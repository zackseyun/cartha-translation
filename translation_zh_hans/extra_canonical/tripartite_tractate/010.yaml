base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/010.yaml
  text: 'The emanation of the Totalities, who exist from the existent one, did not happen through separation from one another, like [something] discarded by the one who gives birth to them. Instead, their begetting is like an act of extension, as the Father extends himself to those he loves, so that [those] who originated from him might also become him. Although the present age is a unity, it is divided into units of time, which are divided into years, which in turn are divided into seasons, then seasons into months, months into days, days into hours, and hours into minutes. In the same way, [] the age of truth, because it is one and many, is honored with names both insignificant and important, according to what each one can grasp. By analogy, it is like a spring that, while remaining what it is, nevertheless flows and expands into streams, lakes, canals, and branches. Or it is like a root spreading beneath trees and branching out with their fruit, or like a human body, inseparably divided
    into various branching limbs—primary and secondary, great and small.


    The aeons brought themselves forth in agreement with the third fruit, by free will and through the understanding he gave them for thought. They do not desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Nor do they desire to give glory together with the entire Totality, or to glorify together with any individual aeon who has reached a place or state higher than his own, unless he obtains <what> was desired from the one with a more exalted name and a higher place. [] They receive one another at the higher place, and the one who wished to rise higher begets himself, so to speak, begetting himself together with the other one and with what he is. He is renewed together with the one who came to him from his brother, beholding him and entreating him concerning the matter.


    So that this may happen in this way, the one who desired to give glory says nothing to him about it except this, because a limit on speech has been established in the Fullness. Thus they remain silent about the incomprehensibility of the Father, while still being permitted to speak about their desire to grasp him.'
translation:
  language: zh_hans
  text: '众总有[a]都出自那位存在者；他们的流溢并不是借着彼此分离而发生的，仿佛是生他们的那位丢弃了[某物]。相反，他们的受生好像一种延展：父把自己延展到他所爱的人那里，使[那些]由他而生的也能成为他。现今的世代虽然是一个整体，却分成一个个时段；时段又分成年，年再分成季节，季节分成月，月分成日，日分成小时，小时分成片刻。同样，[]真理的永世[b]既是一又是多，便按各自所能领会的，以或微小或重大的名号受到尊崇。打个比方，它好像泉源：虽仍保持本来的所是，却不断涌流，扩展成溪流、湖泊、水渠和支流。又好像树根在众树之下伸展，分出枝条并结出果实；也好像人的身体，以不可分离的方式分成各样岔出的肢体——主要的和次要的，大的和小的。


    众永世者[b]凭着自由意志，也凭着第三个果实赐给他们、供他们思想的悟性，与这果实同心，生出了自己。他们并不想把各个不同的圆满[c]一同产生、作为[赞美]之言的事物拿来一同献上荣耀；也不想同整个众总一起献上荣耀；更不想同任何一个达到比自己更高之处或更高状态的永世者一起荣耀，除非他从那位名号更尊贵、所处之地更高的存在那里，得着了所愿的<事物>。[]他们在更高之处彼此接纳；那想要升得更高的，可以说生出了自己：他连同另一位，也连同自己之所是，一起生出自己。他又与那位从自己弟兄那里来到他这里的存在一同更新，注视他，并为这事恳求他。


    为使这事如此发生，那想要献上荣耀的，除了这一点以外，并不向他谈论此事，因为在圆满[c]之中，言语已被划定界限：他们对于父的不可领会保持沉默，却仍蒙准许谈论自己想要领会他的愿望。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众总有”指由那位存在者而出的整体性众存在；原见证使用复数 Totalities。
    reason: 该词兼具集合与复数存在者的意味，中文正文需采用较技术性的表达。
  - marker: b
    text: 这里“永世”和“永世者”对应同一术语的领域性与具位格性用法；也可按语境理解为“世代”或“时代”。
    reason: 保留 aeon/age 的语义宽度，并解释正文为何采用不同中文形式。
  - marker: c
    text: “圆满”是本文的技术性用语；此处原见证先用复数“各个圆满”，后用单数“圆满”。
    reason: 提醒读者单复数变化可能具有意义，不宜在译文中抹平。
lexical_decisions:
- source_word: Totalities
  choice: 众总有
  rationale: 以“众总有”表达构成整体的一切存在者，避免仅译作抽象的“总体”而抹去复数与位格意味。
- source_word: emanation
  choice: 流溢
  rationale: 保留从本源发出的思想意象，同时不预断其确切形上机制。
- source_word: aeon / age
  choice: 永世者／永世（现今的世代）
  rationale: 依语境区分具位格意味的复数 aeons 与作为真理领域的 age；当前时间秩序则译“现今的世代”，并以脚注说明术语关联。
- source_word: Fullness / Fullnesses
  choice: 圆满／各个不同的圆满
  rationale: 保留该文献的技术性概念及单复数差别，不擅自统一为“丰满”或“充满”。
- source_word: extension
  choice: 延展
  rationale: 对应父伸展自身的空间性比喻，并与“分离”形成对照。
- source_word: grasp
  choice: 领会
  rationale: 兼顾认知上的理解和试图把握不可知者的张力。
- source_word: minutes
  choice: 片刻
  rationale: 古代语境未必指现代严格计量的“分钟”；译为“片刻”较稳妥，同时保留时间逐级细分的意思。
theological_decisions:
- issue: 流溢是否意味着从父分离
  choice: 明确译为并非借彼此分离，而如父延展自己
  alternative: 将其解释为创造、分割或本体同一
  rationale: 原文以否定分离和延展比喻并置；译文保留其张力，不把它归入后来的特定教义体系。
- issue: “成为他”的本体含义
  choice: 直译“也能成为他”
  alternative: 弱化为“像他”或强化为“与他本体相同”
  rationale: 见证文本措辞强烈但含义未被解释，应保留开放性。
- issue: “第三个果实”的身份
  choice: 保留“第三个果实”及代词指涉
  alternative: 为其加上特定神学名称或身份
  rationale: 现有依据不足以确定所指，不应导入宗派或私人解释。
- issue: 不可领会父与渴望领会父的关系
  choice: 同时保留沉默与获准谈论愿望
  alternative: 把后者改成实际能够认识父
  rationale: 原文有意维持不可领会与追求领会之间的神学张力。
- issue: 永世者“生出自己”
  choice: 保留反身表达并加“可以说”
  alternative: 改写成由父直接产生或仅作自我发展
  rationale: 原文自身用近似限定语维持悖论式说法，译文不替作者化解。
translation_notes:
  register: 采用现代、庄重而可读的普通话；保留见证中的方括号空缺 []、补字方括号及尖括号校补。因科普特语原文复核尚待进行，本稿以所供公共领域英语见证为暂定依据，对晦涩句法采取尽量克制的顺译，不消除代词指向、层级关系和形上论述中的真实歧义。
