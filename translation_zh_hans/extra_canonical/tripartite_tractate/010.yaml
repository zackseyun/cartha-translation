  revision_rationale: 修订以所供公共领域英语见证为准，未对尚待直接复核的科普特语作超出材料的断言。保留所有[]、[某物]、[那些]、[赞美]及<事物>的文本批判信号；修复了第二段的句法关系、第三个果实与悟性的关系，以及不必要的指称补足。为维持英语见证本有的代词歧义，在“那一位……他”的连续句中未指定各代词究竟指谁。
