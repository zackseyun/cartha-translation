review_pass:
  verdict: revise
  source_fidelity: 本次只能以所提供的公共领域英语见证为直接核对依据；科普特语底本复核尚待进行。修订恢复了首句“从那位存在者而存在”的关系，避免将“诸圆满体所生出之物”误作可被“拿来”献上的对象，并较谨慎地保留第二段中代词、比较级和反身“生出自己”的歧义。方括号、空方括号和尖括号均予保留。
  naturalness: 原稿总体庄重可读，但“众总有”“他们的受生”“同任何一个……一起荣耀”等说法生硬或不合现代汉语搭配。修订采用“诸总体”“被生出”“与……一同归荣耀”等较自然而仍具学术性的表达。
  terminology: “流出”对应 emanation，“延展”对应 extension；以“永世／永世者”对应 age/aeon 的不同语境，并保留“圆满／诸圆满体”的单复数技术性区别。“第三个果实”“成为他”“生出自己”不作教义化解释。
  issues:
  - severity: medium
    issue: 首句的关系和术语表达不够准确自然。
    rationale: “众总有都出自那位存在者”虽大意相近，却未清楚对应“the Totalities, who exist from the existent one”；“众总有”也不是自然的现代汉语技术用语。
  - severity: high
    issue: 第二段第一句把“诸圆满体所共同生出、作为赞美之言的事物”改写为“拿来一同献上荣耀”。
    rationale: 英语见证的句法虽艰涩，原稿却额外加入“拿来”，并改变该事物与“共同归荣耀”之间的关系；应保留其作为一同归荣耀的对象／伴随者的含混结构。
  - severity: medium
    issue: 若干表达过度顺译或引入额外含义。
    rationale: “又与那位……一同更新”中的“又”及“存在”、“同任何一个……一起荣耀”等并非见证所要求，且影响句法关系或现代汉语通顺度。
  - severity: medium
    issue: 直接科普特语复核未完成。
    rationale: 任务资料明确标注 source-language review pending；本稿可作为英语见证的审校修订，但疑难句法及文本缺损仍须由具备科普特语底本的审校者复核。
  revised_text: '从那位存在者而存在的诸总体[a]，其流出并不是借着彼此分离而发生的，仿佛生出他们的那位丢弃了[某物]。相反，他们被生出，好像一种延展；正如父把自己延展到他所爱的人那里，使[那些]由他而出的也能成为他。现今的世代虽然是一体，却分成时段；时段又分成年，年再分成季节，季节再分成月，月分成日，日分成小时，小时分成片刻。同样，[]真理的永世[b]既是一又是多，便随各人所能领会的，以卑微或重要的名号受到尊崇。打个比方，这好像泉源：它虽仍是其所是，却不断流出，扩展成溪流、湖泊、水渠和支流。又好像树根在众树之下伸展，并长出结着果实的枝条；也好像人的身体，以不可分离的方式分成各样分枝的肢体——主要的和次要的，大的和小的。



    诸永世者[b]照着第三个果实，凭着自由意志，也凭着他赐给他们、供他们思想的悟性，生出了自己。他们并不愿与诸不同的圆满体[c]所共同生出、作为[赞美]之言的事物一同归荣耀；也不愿与整个总体一同归荣耀；也不愿与任何一个达到比他自己更高之处或状态的永世者一同归荣耀，除非他从那位名号更尊贵、所处之地更高的存在者那里，得着所愿的<事物>。[]他们在更高之处彼此接纳；那想要升得更高的，可以说生出了自己：他与另一位、也与他的所是一起生出自己；他又与那位从他弟兄那里来到他这里的存在者一同更新，注视他，并就这事恳求他。



    为使这事如此发生，那想要归荣耀的，除了这一点以外，并不对他谈论此事，因为在圆满[c]之中，言语的界限已经定下；这样，他们对父的不可领会保持沉默，却仍获准谈论自己想要领会他的愿望。'
  revised_footnotes:
  - marker: a
    text: “诸总体”对应英语见证中的复数 Totalities，指从“那位存在者”而存在的总体性诸存在；此为技术性译法。
    reason: 保留其集合性、复数性及可能的具位格意味，同时避免不自然的“众总有”。
  - marker: b
