    reason: 保留 aeon/age 的语义宽度，并说明正文的不同译法。
  - marker: c
    text: “圆满／诸圆满体”是本文的技术性用语；英语见证此处先用复数 Fullnesses，后用单数 Fullness。
    reason: 提示单复数变化，不将其抹平。
