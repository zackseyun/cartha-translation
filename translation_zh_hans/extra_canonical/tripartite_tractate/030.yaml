review_pass:
  verdict: revise
  source_fidelity: 鉴于科普特语原文尚待直接复核，本审阅以所供英语见证为准。修订保留方括号中的编者补字、残文省略号和缺行提示，不将残损处的语法关系或神学指称具体化。主要调整了若干不够贴合见证或在中文中形成不必要断言的表达。
  naturalness: 原稿整体庄重可读，但“他伟大”不是自然中文句法，“新房”在此专门语境中偏口语且未清楚保留英文的补字状态；数处条件、代词和残句关系也可更忠实、顺畅地呈现。
  terminology: “属物质者”“救主”“救赎者”“圣灵”等处理可保留。“bridal [chamber]”改作“新婚[内室]”，既较贴近字面，也避免把术语解释为现代家庭语境的“新房”。“complete restoration”维持为“完全的复归”，不添加“万物”等范围限定。
  issues:
  - severity: medium
    issue: “Some elders [. . .] him greatness.”译为“有些长老……他伟大。”
    rationale: 该译法在中文中不成句，且把残缺的“him greatness”擅自重构为对“他”的谓语判断。应保留为名词性残句，如“有些长老……他的伟大。”
  - severity: medium
    issue: “bridal [chamber]”译为“新房[a]”并附带象征性解释脚注
    rationale: “新房”偏口语，并且脚注所述“联合与圆满”的具体象征解释超出残损见证所能安全确定的范围。改为“新婚[内室]”以保留补字与较中性的术语性表达，删除不必要的解释性脚注。
  - severity: low
    issue: “should they return”译为“即使他们再一次回到”
    rationale: 英语见证此处是条件关系，宜译为“若他们再一次回到”，不应转为让步关系。
  - severity: low
    issue: “they dwelt among them”译为“他们住在那些人中间”
    rationale: “那些人”是译文新增的指称限定；原见证只有未明确先行词的“them”，应译作“住在他们中间”以保留模糊性。
  - severity: low
    issue: “from the radiant east”译为“从光明的东方而来的”
    rationale: “radiant”更贴近“光辉的／灿然的”，而“光明的”容易引入抽象道德含义。
