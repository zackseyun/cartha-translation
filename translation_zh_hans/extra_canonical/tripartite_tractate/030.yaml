translation:
  language: zh_hans
  text: '这就是生育的完整本质；它源于[基督]所承受的：当他以所显明的[光]照耀他们时……像他的……将要……像他的……而在那些曾经……之中，唯一存在的差异是——


    （缺失5行）


    ……那些存在的……借着……正如[我]先前所说；至于属物质者，他们将被撇弃，直到末了被毁灭，因为他们不会交出自己的[名字]；即使他们再一次回到那[将不复存在的]……他们仿佛曾经……他们并不存在……但在他们住在那些人中间的时候，他们[在那段]时期还有用处，尽管他们起初并不……随后……借着他们在预备过程中所掌握的权力采取不同的行动，[以]抵抗他们。


    虽然我不断使用这些词语，[我仍未能领会]其中的思想。有些长老……他伟大。


    （缺失5或6行）


    ……每一……天使……话语[和]号角[声]，宣告那从光明的东方而来的、伟大而完全的复归；这复归是在新房[a]里，也就是父神的爱里，照着那……伟大的……能力……他的……甘美；因为他向众伟大者显明自己……他的良善……颂赞、国度和[荣耀]，都借着[耶稣基督]——主、救主，以及所有被那充满慈爱怜悯者所环抱之人的救赎者——并借着[他的]圣灵，从今时直到万代，永永远远。阿们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新房”也可直译为“婚房”或“新婚洞房”；在本文语境中可能带有象征性的联合与圆满意味。
    reason: 该词具有专门的宗教象征潜力，但残损上下文不足以确定具体解释。
lexical_decisions:
- source_word: begetting
  choice: 生育
  rationale: 暂依英译见证保留抽象的生成、生育含义，不具体化为“创造”或“重生”，以免消解原文可能具有的宇宙论意味。
- source_word: material ones
  choice: 属物质者
  rationale: 采用描述性称谓，保留该文献对一类存在者的分类，不译成带现代贬义的“物质主义者”。
- source_word: complete restoration
  choice: 完全的复归
  rationale: “复归”保留返回、恢复原有状态的含义，避免预先判定为特定教义体系中的“万物复兴”。
- source_word: bridal chamber
  choice: 新房
  rationale: 采用现代中文读者可理解且有宗教语境传统的表达，并以脚注提示也可直译为婚房。
- source_word: Redeemer
  choice: 救赎者
  rationale: 与“救主”区分，同时保留赎回、解救的语义。
- source_word: loving mercy
  choice: 慈爱怜悯
  rationale: 并列呈现爱与怜悯两层语义，不压缩成单一神学术语。
theological_decisions:
- issue: 结尾处“one filled with loving mercy”的指称
  choice: 译作“那充满慈爱怜悯者”，保留其指称开放性
  alternative: 明确译为“充满慈爱怜悯的父神”或“基督”
  rationale: 残损句法及所据英译不足以确定该短语的先行词，不应擅自落实为父或基督。
- issue: “all those encompassed by…”与“Redeemer”的关系
  choice: 译为“所有被……所环抱之人的救赎者”
  alternative: 将“被环抱”解释为救赎行动本身
  rationale: 保留关系结构及包围、环抱的空间意象，不加入原见证未明确表达的因果关系。
- issue: “restoration”的范围
  choice: 不增补“万物”
  alternative: 译为“万物完全复兴”
  rationale: 现存见证只有“great complete restoration”，其范围因残文不明，故不作普遍救赎式限定。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。方括号保留英译见证中的编者补字，省略号表示残损或文字不可读，缺行提示照录。因科普特语原文复核尚待进行，本稿属于依据公共领域英语见证形成的暂定译稿；网页联系方式、广告及导航内容不属于古代文本，故未收入。
