review_pass:
  verdict: revise
  source_fidelity: 本审校以所供英文公共领域见证为准；科普特语直接复核仍待进行。修订保留见证中的缺文标记、尖括号补文、复数校订痕迹及不稳定代词指向，未将其教义化或明确化。主要调整了若干关系结构、指代和术语搭配，使之更贴近英文见证的句法与含混度。
  naturalness: 原稿整体庄重且术语一致，但首段“是为着……一切”、若干“肖像／形体”搭配及部分长句略显生硬。修订使现代书面汉语更自然，同时保留该文献有意密集、抽象的语体。
  terminology: 保留“圣言、永世、处所、圆满境、救恩安排”等既定术语。“image”按语境多译为“形象”，避免与“likeness”的“肖像”混淆；“Totalities”仍译“万有”。“激情”保留其受动状态与缺陷之间的文本张力，不译作特定伦理意义的罪欲。
  issues:
