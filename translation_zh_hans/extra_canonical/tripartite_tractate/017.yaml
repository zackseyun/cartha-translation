lexical_decisions:
- source_word: Word
  choice: 圣言
  rationale: 保留其作为位格化神学称谓的意义，并与普通“话语”区分；后文一般性的“a word”译为“话语”。
- source_word: Aeon
  choice: 永世
  rationale: 在此文献中既可指超越性的时代，也可指位格化或领域性的存在；“永世”保留其术语性而不过度解释为单纯时间或神灵。
- source_word: Place
  choice: 处所
  rationale: 保留空间性和形上领域性的双重可能，不窄化为普通地点。
- source_word: Synagogue of Salvation
  choice: 救恩会堂
  rationale: 按见证形式直译其集合与宗教会众意象，避免与后文 Church 合并为同一术语。
- source_word: Fullness
  choice: 圆满境
  rationale: 既表达圆满、充盈，也显示其在本文中具有领域和总体结构的术语功能。
- source_word: He Who Is
  choice: 永存者
  rationale: 表达自存、实存的神圣称号；避免生硬的“那位是者”。
- source_word: Church
  choice: 教会
  rationale: 保留文献中以会众和谐为根据的命名，同时正文随即给出其集合意义。
- source_word: Totalities
  choice: 万有
  rationale: 体现总体性复数概念，又符合现代汉语神学语域；不强行等同于“圆满境”。
- source_word: passions
  choice: 激情
  rationale: 保留情感冲动、受动状态及缺陷的张力；不直接释为罪欲。
- source_word: plan of salvation
  choice: 救恩安排
  rationale: 表达经纶、规划和实施次序，同时避免导入特定宗派的固定术语体系。
- source_word: energy
  choice: 能力的运作
  rationale: 兼顾内在能力与实际作用，避免现代汉语“能量”所带来的物理学联想。
- source_word: seeds
  choice: 种子
  rationale: 保留原有生成和潜存隐喻，不预先断定其具体指人、灵性群体或观念。
theological_decisions:
- issue: “Aeon”究竟是时代、领域还是位格化存在
  choice: 统一译作“永世”，由上下文显示其不同功能
  alternative: 世代／永恒领域／灵体
  rationale: 本文有意在时间、空间和存在者之间保持流动意义，单一定义会消除原文张力。
- issue: “form of matter”与“nature of its cause”的关系
  choice: 译作“具有物质的形态，却也具有其成因的本性”
  alternative: 具有质料形式及神圣本质
  rationale: 保留表面形态与成因本性间的对照，不把“成因”直接等同于某一教义化神性概念。
- issue: 阳性与阴性、软弱的关联
  choice: 尽量照录“阳性的形态”“作为阴性的缺陷”
  alternative: 将其弱化为主动／被动原则
  rationale: 这是文本自身古代性别化宇宙论的一部分；翻译不认可也不美化该判断，但不应静默改写。
- issue: 代词所指在“新娘”段落中不稳定
  choice: 保持“他／那一位”的开放指向，并避免补入明确身份
  alternative: 明确指定为圣言、父或显现者
  rationale: 见证本身的指代含混且附近有缺文，明确化会成为未经支持的解释。
- issue: “prematurely from one”所指
  choice: 译为“在那一位……之前，就过早地从他产生”
  alternative: 明确为圣言或父
  rationale: 英文见证未明确先行词，中文保持其神学和叙事歧义。
- issue: 末段“种子”的身份
  choice: 保留为“种子”，不释为选民或灵性人
  alternative: 属灵者／蒙拣选者
  rationale: 原段只以使命、知识和荣耀描述其角色，尚不足以锁定某一教派式人类学分类。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。关键诺斯替术语保持一致，但尽量让上下文解释其功能。尖括号补文转写为中文尖括号，方括号式缺文则以脚注标示。由于科普特语原文复核尚待进行，本稿严格以所供公共领域英文见证为临时来源依据，不声称解决其代词、缺文及术语层面的不确定性。
