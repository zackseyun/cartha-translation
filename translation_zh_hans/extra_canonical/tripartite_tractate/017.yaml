  revised_text: '圣言既重新得着稳固，又开始统管那些借着他而产生者；对于他按照那决定所产生的一切，他的思想被称为“永世”和“处所”，即那称为“救恩会堂”的。因为他医治了自己，脱离那作为多重思想的分散，并回归单一的思想。它同样被称为“宝库”，因为他得着安息，并将这安息只赐给自己。[a] 它也被称为“新娘”，因为那把自己交托给他、盼望由结合结出果实者的喜乐，就是那曾向他显现的一位。它又被称为“国度”，因为他得着坚定，又因统管那些曾与他交战者而欢喜。它还被称为“主的喜乐”，因为他以欢欣披戴自己。光与他同住，为他所拥有的美善报偿他，也就是自由的思想〔或诸思想〕。[b]


    我们先前提到的那个永世，高过彼此争战的两个阶层。它既不与掌权者为伍，也不涉及软弱和缺陷，即与记忆和肖像有关的事物。圣言将自己置身其中的，是一个全然喜乐的永世：它具有物质的形态，却也具有其成因的本性；这成因就是那已经显明的。因为它是那些住在圆满境者的形象；他们是从“永存者”欢悦的丰盛中产生的。


    再者，他因那向自己显现者的面容而欢喜，也因他的〈喜悦〉、期待，以及他所求之事的应许而欢喜；他拥有子的名、子的本质、能力和形态。他就是他所爱、所喜悦的那一位，[c] 也是人以爱献上祈祷所为的那一位。这个永世是光，是渴望得着坚固，是乐意受教，也是用来看见的眼睛；这些特质都是它从那些崇高者所得的。此外，它是智慧，供他的思想用来对抗救恩安排中居于较低处者；它也是用来言说的话语，以及诸如此类其他事物的完全。


    那些照着圆满境的形象、与他一同取得形态者，其父母就是那些使自己显现者；每一个都是某一形体的摹本。他们具有男性的形态，并非出自那作为阴性的缺陷，而是出自那已经逃离缺陷者。〈他们〉名为“教会”，因为他们和谐地类似于那已经显现者之会众的和谐。那照着光的形象而产生的也是完全的，因为它是唯一实存之光的形象；这光就是万有。即使它低于自己所是其形象的那一位，仍拥有不可分离性，因为它是那不可分离之光的面容。


    然而，那些照着各个永世的形象而产生者，就本质而言，正如我们先前所说；但就其能力的运作而言，却并不相等，因为这能力在他们每一个里面以不同方式存在。在彼此联合之中，他们是相等的，[d] 但每一个〈永世〉仍保有自身特有的〈差异〉。因此，他们具有激情；激情乃是一种缺陷。因为他们不是从圆满境的合一中产生的，而是在那一位尚未从父领受它，或尚未与他的万有及旨意联合之前，就过早地从他产生了。


    尽管如此，这对将来的救恩安排仍有益处。他们获准经过较低的处所，因为这些处所无法承受他们骤然来到，除非一次一位。他们的到来是必要的，因为万事都要借着他们达到完全。


    简而言之，圣言领受了关于万有的异象，就是关于过去存在的、现在存在的和将要存在的事物的异象，因为万有的救恩安排已经托付给他。有些事物已经达到存在，因为这样是有目的的。至于尚未存在的种子，他却因那与自己所构想之事有关的应许，把它们保存在自己里面；这应许关乎那些尚待存在的种子。他也产生了自己的后裔，也就是将自己所构想之事显明出来。然而在一段时期内，那些蒙应许的种子仍被阻止，不能存在，因为他们已受指定，要在救主及其同伴到来时承担使命；这些同伴是在对父的认识和父的荣耀方面居首位的人。


