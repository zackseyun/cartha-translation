  revised_text: '圣言已经重新得着稳固，并开始统管那些借着他而产生的存在者；他的思想，因着他照那决定所产生的一切——即所谓“救恩会堂”的——被称为“永世”和“处所”。因为他医治了自己，脱离那作为多重思想的分散，并回归单一的思想。它同样被称为“宝库”，因为他所得的安息只赐给他自己。[a] 它也被称为“新娘”，因为那向他显现、把自己交托给他，并盼望从结合中得着果实者的喜乐。它又被称为“国度”，因为他得着了坚固，并因统管那些曾与他争战者而欢喜。它还被称为“主的喜乐”，因为他披上了欢欣。光与他同住，为那属于他的美善报偿他，也就是自由的思想。[b]



    我们先前提到的那个永世，高过彼此争战的两个阶层。它既不与掌权者为伴，也不涉及软弱和缺陷，即与记忆和肖像有关的事物。圣言置身其中的，是一个全然喜乐的永世；它具有物质的形态，却也具有其成因的本性，即那已显明者的本性，因为它是住在圆满境者的肖像；他们从“永存者”欢悦的丰盛中产生。



    再者，他因那向自己显现者的面容而欢喜，也因他的〈欢悦〉、期待，以及他所求之事的应许而欢喜；他具有子的名，以及他的本质、能力和形态。他就是他所爱、所喜悦的那一位，[c] 也是人以爱献上祈祷所为的那一位。这个永世是光，是渴望得着坚固，是乐意受教，也是看见的眼；这些特质都是它从那些崇高者所得的。此外，就他那与救恩安排中居于较低处者相对的思想而言，它是智慧；它也是用于言说的话语，以及诸如此类其他事物的完全。



    那些照着圆满境的肖像、与他一同取得形态者，他们的父母就是那些显明自己者；每一个都是某一形体的摹本。他们具有阳性的形态，不是出自那作为阴性的缺陷，而是出自那已经逃离这缺陷者。〈他们〉名为“教会”，因为他们和谐地仿效那已经显现者之会众的和谐。那照着光的肖像而产生者也是完全的，因为它是唯一实存之光的肖像；这光就是万有。即使它低于自己所仿效的那一位，仍具有不可分离性，因为它是那不可分离之光的面容。



    然而，那些照着各个永世的肖像而产生者，就本质而言，正如我们先前所说；但就其能力的运作而言，却并不相等，因为这种能力在他们每一个里面的存在方式不同。在彼此联合之中，他们是相等的，[d] 但每一个〈永世〉仍保有自身特有的〈差异〉。因此，他们具有激情；激情乃是一种缺陷。因为他们不是从圆满境的合一中产生的，反而是在那一位从父领受它之前，或从与他的万有和旨意的合一中领受它之前，就过早地从那一位产生了。



    尽管如此，这对将来的救恩安排仍有益处。他们获准经过较低的处所，因为这些处所不能承受他们骤然来到，除非一次来一位。他们的到来是必要的，因为万事都要借着他们达到完全。



    简而言之，圣言领受了关于万有的异象，就是关于过去所有、现在所有和将来所有的异象，因为万有的救恩安排已经托付给他。有些事物已经得以存在，因为这背后有其用意。至于尚未存在的种子，他却因着那关于自己所构想之事的应许，把它们保存在自己里面；这应许关乎那些尚待产生的种子。他也产生了自己的后裔，也就是把自己所构想之事显明出来。然而在一段时期内，那些蒙应许的种子仍被阻止，不能得以存在，因为他们已被指定，要在救主来临时与他的同伴一同执行使命；这些同伴是在认识父和父的荣耀上居首位的人。



