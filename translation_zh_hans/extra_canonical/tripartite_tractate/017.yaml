translation:
  language: zh_hans
  text: '圣言已经重新得着稳固，并开始统管那些借着他而产生的存在者；他的思想被称为“永世”和“处所”，是为着他依照那决定所产生的一切，也就是那称为“救恩会堂”的。因为他医治了自己，使自己脱离那多重思想所造成的分散，回归单一的思想。它同样被称为“宝库”，因为他得着了安息，并将这安息单单赐给自己。[a] 它也被称为“新娘”，因为那把自己交给他、盼望结合能结出果实者的喜乐；这位也曾向他显现。它又被称为“国度”，因为他得着了坚定，并因统管那些曾与他争战的存在者而欢喜。它还被称为“主的喜乐”，因为他以欢欣披戴自己。光与他同住，因他所拥有的美善而回报他，也就是自由的种种思想。[b]


    我们先前提到的那个永世，高过彼此争战的两个阶层。它既不与掌权者为伍，也不属于软弱和缺陷——那些属于记忆和肖像的事物。圣言将自己安置其中的，是一个充满喜乐的永世：它具有物质的形态，却也具有其成因的本性；这成因就是那已经显明的。因为它是那些住在圆满境中的存在者之肖像，而他们是从“永存者”丰盛的欢悦中产生的。


    再者，他因那向自己显现者的面容而欢喜，也因他的〈欢悦〉、期待，以及他所求之事的应许而欢喜；他拥有子的名、子的本质、能力和形态。这一位是他所爱的，也是他所喜悦的，[c] 又是人以爱献上祈祷所为的那一位。这个永世是光，是渴望得着坚固，是乐意受教，也是用来看见的眼睛；这些特质都是它从那些崇高者所得的。此外，对于他那与救恩安排中居于较低处者相对的思想而言，它是智慧；它也是用来言说的话语，以及诸如此类其他事物的完全。


    那些照着圆满境的肖像、与他一同取得形态的存在者，其父母就是那些显明自己者；每一个都是某一形体的摹本。他们具有阳性的形态，并非出自那作为阴性的缺陷，而是出自那已经逃离缺陷者。〈他们〉名为“教会”，因为他们和谐地仿效那些已经显现者之会众的和谐。那照着光的肖像而产生的也是完全的，因为它是唯一实存之光的肖像；这光就是万有。即使它低于自己所仿效的那一位，仍拥有与他不可分离的性质，因为它是那不可分离之光的面容。


    然而，那些照着各个永世的肖像而产生者，就本质而言，正如我们先前所说；但就其能力的运作而言，却并不相等，因为这能力以不同方式存在于他们每一个里面。在彼此联合之中，他们是相等的，[d] 但每一个〈永世〉仍保有自身特有的〈差异〉。因此，他们具有激情；而激情就是一种缺陷。因为他们不是从圆满境的合一中产生的，而是在那一位尚未从父领受合一，或尚未与他的万有及旨意联合之前，就过早地从他产生了。


    尽管如此，这对将来的救恩安排仍有益处。他们获准经过较低的处所，因为这些处所无法承受他们骤然来到，只能一次承受一位。他们的到来是必要的，因为万事都要借着他们达到完全。


    简而言之，圣言领受了关于万有的异象，就是关于过去所有、现在所有和将来所有的异象，因为万有的救恩安排已经托付给他。有些事物已经成为实有，因为其中有一个目的。至于尚未存在的种子，他却因那与自己所孕育之事有关的应许，把它们保存在自己里面；这应许关乎那些尚待产生的种子。他也产生了自己的后裔，也就是把自己所孕育的显明出来。然而在一段时期内，那些蒙应许的种子仍被阻止，不能成为实有，因为他们已受指定，要在救主和他的同伴来到时承担使命；这些同伴是在认识父和父的荣耀上居首位的人。


    [a] 此处原见证有缺文标记，句间可能遗失文字。

    [b] “思想”在见证中带有复数校订痕迹。

    [c] 此处原见证有缺文标记，语意衔接可能不完整。

    [d] 此处原见证有缺文标记，后文的补足带有编辑性质。'
