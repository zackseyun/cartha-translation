  footnotes:
  - marker: a
    text: 本译稿依据所提供的公共领域英语见证起草；科普特语原文尚待直接复核。方括号表示抄本残缺处的补足或残文提示，尖括号表示译者所补文字；省略号表示文本缺损。
    reason: 交代底本限制，并说明全文沿用的文本校勘符号。
  - marker: b
    text: “那旨意是他吸引到自己这里来的”中的“他”所指并不完全明确；也可理解为代求者使父之丰满的旨意转向自己。
    reason: 保留见证中代词和动作方向的歧义。
  - marker: c
    text: “这彰显就是他的爱子”也可按句法理解为：他显明了彼此联合之共识的彰显，而该彰显被称为爱子。
    reason: 说明“彰显”、共识与子之间同位关系的复杂句法。
  - marker: d
    text: 末句也可能理解为“他就是对父的认识，而他愿意他们认识父”；原见证中的代词关系有歧义。
    reason: 避免把“愿意”的主语及“认识”的宾语定得过死。
  - marker: e
    text: “万有”在本段既可指整体，也可指构成整体的众存在；汉语译名有意保留这种重叠。
    reason: 解释核心术语在集合与复数实体之间的语义弹性。
  - marker: f
    text: “受造”依所提供英语见证翻译；这一词语及“没有视力者”所指，均须待科普特语原文复核。
    reason: 标明具有重要神学影响且源语言审查尚未完成的读法。
lexical_decisions:
- source_word: aeons
  choice: 诸永世
  rationale: 保留这部文献中作为复数超越性存在或领域的专门概念；不用“世代”，以免被误解为时间上的代际。
- source_word: the Totalities / the Totality
  choice: 万有
  rationale: 用自然而庄重的汉语表达整体性概念，同时保留单复数在汉语中本有的模糊；上下文需要时以“都”等词提示复数范围。
- source_word: deficiency / deficient one
  choice: 缺失／有缺失者
  rationale: 保留原文关于不完满、匮乏的概念关联，不擅自解释为道德罪责。
- source_word: Fullness
  choice: 丰满
  rationale: 作为本书宇宙论术语处理，保留与“缺失”的张力；不改写为一般性的“完全”。
- source_word: emanation
  choice: 流溢
  rationale: 采用能体现由源头发出之动态的术语，避免“创造物”所带来的额外本体论判断。
- source_word: Paraclete
  choice: 护慰者
  rationale: 兼顾扶助、安慰和代言的语义范围；不直接套用可能让读者认定此处必指另一特定位格的固定教会译名。
- source_word: Christ
  choice: 基督
  rationale: 保留传统且通行的称号译法。
- source_word: universal plan of salvation
  choice: 普世的救恩计划
  rationale: 明确范围为普世，同时保留“计划”与“救恩”的原文结构，不扩展其最终结果。
- source_word: without sight / sight
  choice: 没有视力者／视力
  rationale: 维持前后词根联系和原文比喻开放性，不直接释为“无知／知识”。
theological_decisions:
- issue: 诸永世的堕落与父的安排
  choice: 译为“仿佛只是他们自己的经历；这是父……所安排的”
  alternative: 可译成诸永世并未真正经历堕落，或父直接导致其堕落
  rationale: 保留“仿佛”以及计划性之间的神学张力，不判定堕落的真实性或因果责任。
- issue: 子由诸永世的和谐产生
  choice: 保留“生出果实”“所生的后裔”及“爱子”并列
  alternative: 改写为父单独生子，或将“生出”弱化为纯粹显现
  rationale: 文段明确把诸永世的合一、祈祷和果实的产生联系起来；译文不以较晚期教义体系消解这种表述。
- issue: “父愿意他们认识他”的代词关系
  choice: 译为“父愿意他们认识他”
  alternative: 译为“子愿意他们认识父”
  rationale: 英语见证的代词句法含混；正文采用较顺畅的一种理解，但不借解释性增补锁定更具体的施事关系。
- issue: 万有被安置在子里面
  choice: 保留先存、现存、将存三重范围
  alternative: 将其系统化为特定的预定论或普救论命题
  rationale: 忠实呈现宏大的包容性语言，但不推导文本未明说的救恩结局。
- issue: “在没有视力者以前受造”
  choice: 保留“受造”
  alternative: 改译为“存在”或“生成”，以避免对子之受造性的暗示
  rationale: 供应见证使用created；在科普特原文复核前，不为配合某种基督论而淡化这一表述。
- issue: 使完全者得力并使有缺失者完全
  choice: 同时保留两类对象
  alternative: 把“完全者”解释成表面完全或尚未完全者
  rationale: 原段故意并置这两种作用，译文保存其张力。
translation_notes:
  register: 采用现代标准普通话的庄重书面语，尽量让普通读者可读，同时保留本作复杂的宇宙论术语、长句逻辑和代词歧义。专名与技术词保持前后一致；未将文本同化为任何特定宗派的三一论、基督论、预定论或普救论表述。
