base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/014.yaml
  text: 'The fall experienced by the aeons of the Father of the Totalities happened only as if it were their own experience, planned by the Father with care, generosity, and great kindness. [] […] the Totality, to teach them about [the deficiency] through the one [from whom alone they] all received power to remove deficiencies.


    His own [order came] into being from <him> who hastened on high, from what produced itself from him, and from complete perfection. The one who hastened on high became an intercessor for the deficient one, together with the emanation of the aeons that had come into being in agreement with the things that exist. When he prayed to them, because they were united, they joyfully and eagerly agreed, in harmonious accord, to help the deficient one. They assembled and pleaded with the Father of generous intention that help would come from the Father above, for his glory, because there was no other way for the deficient one to become perfect except by the will of the Fullness of the Father. He had moved it toward himself, revealing and bestowing <it> on the deficient one.


    From the harmony that had come into being through their joyful inclination, they produced the fruit as an offspring of that harmony, a unity possessed by the Totalities, revealing the face of the Father. The aeons thought about the Father as they glorified him and prayed for help for their brother, asking that the Father would join with them. In this way, they eagerly and joyfully produced the fruit. He then revealed the manifestation of the agreement arising from their mutual union, who is his beloved Son. [] The Son in whom the Totalities are well pleased clothed them with himself as with a garment, imparting perfection to the deficient one and giving strength to the perfect ones. Strictly speaking, he is called “Savior,” “Redeemer,” “the Well-Pleasing One,” “the Beloved,” “the Paraclete,” “the Christ,” and “the Light for the Appointed Ones.” He is congruent with those who produced him because he became the names of the places granted to him. But what other name can be given to him
    except “the Son”? As we said before, this is because he is the knowledge of the Father, whom he desired that they know.


    The aeons generated both the face of the Father whom they glorify, as we wrote earlier, and their own face, because the aeons who glorify generated <his> appearance and their own face. They were formed as his army, like the army of a king, because the beings from the thought possess a powerful unity and a harmony blended together. They were produced in a complex form so that the one who would receive help could behold those for whom he had interceded. He also beholds the one who bestowed it on him. The fruit of the agreement with him that we mentioned earlier is subordinate to the power of the Totalities, because the Father was able to place the Totalities within him: those who existed beforehand, those who are, and those who will be. [] He revealed those whom the Father had placed within him, not giving them away but entrusting them to him. He carried out the universal plan of salvation with the authority granted to him from the beginning and with the power needed for the work. In this
    way, he began to accomplish his revelation.


    The one in whom the Father dwells and in whom the Totalities dwell <was> created before the one who is without sight. He taught him about those who sought their sight through the radiance of the perfect light. First, he perfected him in unspeakable joy. He perfected him for his own sake as a perfect one, and he also bestowed on him what is appropriate for each individual. This is the nature of the first joy.'
translation:
  language: zh_hans
  text: '万有之父的诸永世所经历的堕落，仿佛只是他们自己的经历；这是父以眷顾、恩慈和极大的仁爱所安排的。[a] ……万有，为要借着那一位教导他们认识[缺失]；他们全都唯独从[他]领受了消除种种缺失的能力。


    他自己的[秩序形成了]，出于那迅速升到高处的<他>，也出于那从他自行产生的，以及完全的完满。那迅速升到高处的，成了有缺失者的代求者；与他一同代求的，还有诸永世的流溢——它与一切存在之物和谐一致而产生。他向他们祈求时，他们既同心合一，就欢喜而热切地赞同，以和谐一致的心帮助有缺失者。他们聚集起来，恳求那心怀恩慈的父，愿帮助从上面的父而来，使他得荣耀；因为有缺失者若不借着父之丰满的旨意，就没有别的途径得以完全。那旨意是他吸引到自己这里来的；他将<它>显明，并赐给有缺失者。[b]


    他们怀着喜乐的意愿达成和谐，并从这和谐中生出果实，作为和谐所生的后裔；这果实就是万有所共有的合一，显明父的面容。诸永世一面荣耀父，一面思想他，并为他们的弟兄求助，请求父与他们联合。这样，他们热切而喜乐地生出了果实。随后，他显明了他们彼此联合所达成之共识的彰显；这彰显就是他的爱子。[c] 万有所喜悦的子以自己为衣给他们披上，使有缺失者达到完全，又使完全者得着力量。严格说来，他称为“救主”、“救赎者”、“蒙喜悦者”、“蒙爱者”、“护慰者”、“基督”，以及“蒙拣选者的光”。他与那些生出他的相称，因为他成了所赐给他的那些地方之名。然而，除了“子”，还有什么名字可以归给他呢？正如我们先前所说，这是因为他就是关于父的知识，而父愿意他们认识他。[d]


    诸永世既生出了他们所荣耀之父的面容——正如我们先前所写的——也生出了他们自己的面容；因为那些荣耀父的永世生出了<他的>形貌和他们自己的面容。他们被组成他的军队，如同君王的军队；因为由思想而出的诸存在具有强有力的同心，以及交融在一起的和谐。他们以复合的形态产生，好让那将要得到帮助的看见那些他曾为之代求的。他也看见那位把这帮助赐给他的。我们先前提到的、与他达成共识的果实，处于万有的权能之下；因为父能把万有都安置在他里面：先已存在的、现今存在的，以及将要存在的。[e] 他把父安置在他里面的那些显明出来；父不是把他们交出去，而是把他们托付给他。他凭着起初所赐给他的权柄和完成这工作所需的能力，施行普世的救恩计划。这样，他开始成就自己的启示。


    父住在其中、万有也住在其中的那一位，<在>那没有视力者以前受造。[f] 他借着完全之光的辉耀，把那些寻求视力者的事教导他。他先在不可言说的喜乐中使他完全；他为了自己，使他成为完全者，也把适合每一个体的赐给他。这就是最初喜乐的特质。'
