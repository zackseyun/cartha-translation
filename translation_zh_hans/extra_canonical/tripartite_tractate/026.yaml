review_pass:
  verdict: revise
  source_fidelity: 译稿总体忠实于所给英语见证，并妥善保留了方括号、空缺方括号、尖括号、圆括号及技术术语。然第三段将见证中语法未明的 it 明确落实为“肢体”受教，并将“through the manifestation”处理为“复原……而成”，均超过了见证所能确定的范围。另有少数句子可更贴近原文的修饰关系及指称开放性。由于直接科普特语复核尚待进行，本审校以英语见证为准。
  naturalness: 现代书面汉语整体庄重、连贯。个别表达如“受教的地方”“获得一张像他的脸”“诸永世的各圆满”略显生硬；在不损失技术性和歧义的前提下可调整得更自然。
  terminology: “蒙拣选者／蒙召者”“永世”“圆满”“总体”“道”“救赎”等术语选择一致且适当。“形象”在本段既对应 images 又对应 singular image，应维持这一有意的形式差别；“完全之人”“教会之人”也宜保留其技术性。
  issues:
  - severity: medium
    issue: 第三段将代词 it 的受教对象确定为“肢体”。
    rationale: 英语见证为“places prepared to supply it with the images and archetypes like a mirror”，而 it 的先行词并不明确。正文应保留“它”，或采用不指定先行词的句式，不应在译文中断定为肢体。
  - severity: medium
    issue: 第三段把“through the manifestation of the entire body”译为“这复原借着整个身体的显现而成”。
    rationale: 见证的断句与残缺标记使该短语和“复原”的关系未定；“而成”强化了因果／完成关系。宜维持为并列或悬置结构。
  - severity: low
    issue: “直到诸总体都获得一张像他的脸”不够自然，且“a face like his”更适宜译为面貌相似。
    rationale: 可译为“直到诸总体都有与他相似的面貌”，既自然又不额外解释。
  - severity: low
    issue: “诸永世的各圆满”可能将“the Fullnesses of the aeons”理解为每一永世各有一个圆满。
    rationale: 原见证仅使用复数 Fullnesses 并以 aeons 限定；“诸永世的圆满诸体”或“永世的诸圆满”较少添加分配性含义。
  - severity: low
    issue: “服在……所必需经历的一切之下”语义稍显狭窄。
    rationale: “subjecting himself to everything necessary to us in the flesh”所指是他使自己服从／置身于一切对属肉身的我们所必要之事，不限于“经历”。
  revised_text: '蒙拣选者有分于救主的本性和身体。因着自身的合一以及与他的联合，蒙拣选者就像一间洞房；因为基督来，首要正是为了蒙拣选者。相比之下，蒙召者被安置在那些因洞房而欢喜、因新郎与新娘联合而欣喜快乐的人当中。这样，蒙召者将得到的地方，就是诸形象的永世[a]；在那里，道尚未与圆满联合。因此，教会之人欢喜快乐，并且盼望着她。他由灵、魂、身体构成，与那位制定救恩计划者相称。



    在（这人）里面有一个合一的人，因为他就是总体，也是他们众人。他拥有那从[父]而出的、诸处所所能领受的[]。他也拥有我们先前提到的肢体。救赎一经宣告，完全之人立刻得知怎样迅速回归自己的合一，回到自己所源出的地方。他欢欢喜喜地回到自己所源出的地方，回到自己从中出来的地方。



    然而，他的肢体需要一个受教之处，如同那些已预备好以形象和原型、如同镜子般供应它的处所一样，直到教会身体的一切肢体都在同一处<联结起来>，同时得到复原[b]；借着整个身体的显现，<……>复原到圆满之中。



    它具有一种首要而共同的和谐与联合，就是属于父的和谐，直到诸总体都有与他相似的面貌。然而，末后的复原<将要发生>在总体显明于那位子里面之后；子就是救赎，也就是通往不可理解之父的道路，也就是回归那先存者；并且在诸总体以合宜的方式显明于那一位里面之后——他是通往那不可捉摸、不可言说、[]不可见、不可理解者的道路——以致它得着救赎。



    这不只是从那些<属>左者的辖制下得释放，也不只是逃脱那些属右者的权势；我们曾以为自己是他们的奴仆和儿子，而人一旦逃离他们，没有谁不会很快又被他们捉住。救赎更是上升<到>圆满中的各个层级，也上升到那些得了名字、并按照各永世的能力领会这些名字者那里；又是进入寂静之境，在那里不需要声音，也不需要知识、构想或光照；在那里，万物都是光，一切都放射光辉，无须光照。



    天使和人都需要救赎；形象、永世的诸圆满以及放射奇妙光辉的众能力，也都需要救赎。甚至子自己——他是总体得救赎的典范——也[需要]救赎，[]因为他成为了人，使自己服从一切对我们这些属肉身者所必需的事；我们就是他的教会。后来，他首先借着降在他身上的道得着救赎，其余一切也都从他得着救赎，把他接纳为自己所有。因为那些接纳了这位（已经）领受者的人，自然也领受了他里面所有的。



    在属肉身的人当中，当他的长子、他的所爱、属肉身的子和天上的众天使被看为配得在地上与他结成团契时，救赎便开始[赐下]。因此，他被称为“父的天使之救赎”[c]；他安慰那些为了认识总体而忧伤的人，因为在所有人以先，他是第一个蒙赐这恩典的。'
