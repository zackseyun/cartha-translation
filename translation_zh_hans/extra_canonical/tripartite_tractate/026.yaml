review_pass:
  verdict: revise
  source_fidelity: 本稿总体忠实于所供英语见证，并妥善保留了方括号、空缺、尖括号和括号等校勘信号。惟有数处把见证的句法关系或不确定性处理得过于确定：尤其“受教”段把含混的“as is in the places prepared to supply it...”改写为肢体明确“借着……受到教导”；“all of them”被强化为“他们众人”；以及“a face like his”被译成“一张像他的脸”，均宜修订。另，“蒙召者被安置在……人当中”较原文“为……人而设/定位”增添了空间归属关系。
  naturalness: 行文庄重、术语前后一致，整体可读。为更合现代书面汉语且不牺牲技术性，宜将“洞房”改为较中性的“婚房”，将“受教的地方”改为“受教之所”，并调整若干长句的停顿与指代。
  terminology: “蒙拣选者／蒙召者”“永世”“圆满”“总体”“复原”“道”等关键术语维持一致，且未将文本的非常规救赎论正统化。“父的天使之救赎”及其脚注适当地保留了英语见证中的修饰关系歧义。
  issues:
  - severity: medium
    issue: “受教”段的含混句法被过度确定
    rationale: 见证说“his limbs needed a place for schooling, as is in the places prepared to supply it with the images and archetypes like a mirror”。现译断定“肢体借着……受到教导”，并将“it”明确指为肢体。虽属可行理解，却超出该处残缺、歧义见证所能支持；应保留“预备好以……供给它”的不明先行词和关系。
  - severity: medium
    issue: “a face like his”误作“像他的脸”
    rationale: 英语是“获得一副像他的面容/脸面”，不是“获得一张像他的脸”。修订后既合汉语，也保存“face”的形象语言。
  - severity: low
    issue: Calling 的“positioned for”被译为“被安置在……人当中”
    rationale: “在……人当中”使蒙召者成为该群体中的成员；原句更直接表示其位置或归属是为那些欢庆婚房者而设。改为“是为……而设的”可减少额外限定。
  - severity: low
    issue: “all of them”译为“他们众人”略添人称色彩
    rationale: 其先行词在见证中不明，可能指前文的构成要素或总体成员；“他就是一切”较少预设具体人称。
  - severity: low
    issue: “bridegroom and bride”中的 union 宜译为“结合”
    rationale: 全文“union”是技术性关键词，前文“合一及与他的联合”可保留；婚礼语境中“新郎和新娘的结合”较“联合”自然，同时不改变含义。
  revised_text: '蒙拣选者有分于救主的本性和身体。蒙拣选者因自身的合一以及与他的联合，就像一间婚房；因为基督来，首要正是为了蒙拣选者。相比之下，蒙召者是为那些因婚房而欢喜、又为新郎和新娘的结合而欣喜快乐的人而设的。这样，蒙召者将得到的地方，就是诸形象的永世[a]；在那里，道尚未与圆满联合。因此，教会之人欢喜快乐，并且盼望着她。他由灵、魂和身体构成，与那位制定救恩计划者相称。


    在（这人）里面有一个合一的人，因为他就是总体，他就是一切。他拥有那从[父]而出的、诸处所所能领受的[]。他也拥有我们先前提到的肢体。救赎一经宣告，完全之人立刻得知怎样迅速回归自己的合一，回到自己所源出的地方。他欢欢喜喜地回到自己所源出的地方，回到自己从中出来的地方。


    然而，他的肢体需要一个受教之所，正如那些预备好以如镜子一般的形象和原型供给它的处所；直到教会身体的一切肢体都在同一处<联结起来>，同时得到复原[b]，借着整个身体的显现，<……>复原到圆满之中。


    它具有一种首要而共同的和谐与联合，就是属于父的和谐，直到诸总体都获得一副像他的面容。然而，末后的复原<将要发生>在总体显明于那位子里面之后；子就是救赎，也就是通往不可理解之父的道路，也就是回归那先存者；并且在诸总体以合宜的方式显明于那一位里面之后——他是通往那不可捉摸、不可言说、[]不可见、不可理解者的道路——使它得着救赎。


    这不只是从那些<属>左者的辖制下得释放，也不只是逃脱那些属右者的权势；我们曾以为自己是他们的奴仆和儿子，而人一旦逃离他们，没有谁不会很快又被他们捉住。救赎更是上升<到>圆满中的各个层级，也上升到那些得了名字、并按照各永世的能力领会这些名字者那里；又是进入寂静之境，在那里不需要声音，也不需要知识、构想或光照；在那里，万物都是光，一切都放射光辉，无须光照。


    天使和人都需要救赎；形象、诸永世的各圆满以及放射奇妙光辉的众能力，也都需要救赎。甚至子自己——他是总体得救赎的典范——也[需要]救赎，[]因为他成为了人，使自己服在我们这些属肉身者所必需经历的一切之下；我们就是他的教会。后来，他首先借着降在他身上的道得着救赎，其余一切也都从他得着救赎，把他接纳归于自己。因为那些接纳了这位（已经）领受者的人，自然也领受了他里面所有的。


    在属肉身的人当中，当他的长子、他的所爱、属肉身的子和天上的众天使被看为配得在地上与他结成团契时，救赎便开始[赐下]。因此，他被称为“父的天使之救赎”[c]；他安慰那些为了认识总体而忧伤的人，因为在所有人以先，他是第一个蒙赐这恩典的。'
