review_pass:
  verdict: revise
  source_fidelity: 本段只能以所供英文见证作暂定底本，科普特文直接复核仍待完成。译稿总体保留了尖括号补文、方括号缺文和关键指代的含混性，术语选择也大体稳妥。但数处将见证中本来破碎或关系复杂的句法处理得过于确定，尤以第二段“这就是……”及第五段“第一位得以赐下……”为甚，宜作较贴近且可读的调整。
  naturalness: 中文整体庄重、通顺，适合此类古代思辨文本。个别句子如“这就是那些……的人”缺少可成立的谓语；“与自己的原型分离”弱化了“embrace separation”的主动承受意味；“领受恩典的人中第一位得以赐下”则有歧义且不够自然。修订后保留原文的断裂感，但使中文句法可读。
  terminology: “肉体和魂”“救恩的安排”“道”“流出”“整体”“救赎”及“不受激情”均可保留。“establishment”译为“确立”比“根基”更不实体化，也较贴近抽象名词并列。“祷告”保留，不将其解释为特定仪式或教义。
  issues:
  - severity: medium
    issue: 第二段“这就是那些像他一样取了身体和魂，也得着根基、稳固和智慧的人”是中文残句，并把见证中不完整的结构改造成确定的“得着”。
    rationale: 英文见证此处本身为破碎句法（“This is how those who ... assumed ...”）。宜以“这就是……的方式”维持其未完结结构，且把并列项目译为“取了……以及……”而不添加“得着”的明确关系。
  - severity: medium
    issue: 第五段将“he was the first of those to obtain the grace of bestowing the gifts”译为“他是那些领受恩典的人中第一位得以赐下众恩赐的”。
    rationale: 原句说他是在“获得赐与恩赐之恩典者”中的第一位；现译容易理解为他在一般领受恩典者中首先赐恩，也未清楚保留“赐与恩赐”是恩典的内容。
  - severity: low
    issue: 第四段“他们与自己的原型分离”未充分表达“they embrace separation from their pattern”。
    rationale: 应保留其接受／承担与原型分离的动作，而非仅陈述既成分离状态。
  - severity: low
    issue: 第一段“产生、成为不可见者”对“[came into being] [] [as] invisible and invisibly”的重构略显确定。
    rationale: 见证保留了残缺和补文；中文宜保留方括号并避免把“as invisible”明确实体化为“成为不可见者”。
  revised_text: '由于怜悯的倾向，我们的救主成了与他为之显现的那些人一样；那些人因本能的激情而成了肉体和魂，这两者不断辖制他们，使他们毁灭、死亡。然而，至于那些[产生]、[] [以]不可见、且以不可见方式存在的人，他也以不可见的方式把关于自己的事教导他们。[a] 他不但亲自承担了他所要拯救之人的死亡，也接纳了他们堕入的卑微；他们在带着身体和魂而<出生>时落入其中，而他甘愿作为婴孩，带着身体和魂出生。那些堕落者所共有的其他一切处境，他也都一同经历；尽管他们拥有光，而他又高于他们，他仍甘愿在没有罪、污秽和败坏的情况下受孕。他住在生命中，却被生入肉身的生命；因为已经定下：双方都同样成为身体和魂，这是由于激情，也由于那转变不定的倾向；这倾向来自那已经奋起、转而归回的道。



    但就救恩的安排而言，正是他亲自承担了我们先前所说那些事的结果，就是道在转而归回、奋起之后，由他那照明的异象和坚定的意念所产生的。这就是那些像他一样取了身体和魂，以及确立、稳固和智慧之人的方式。早已预定，他们要与同样早已预定的救主来临一同汇聚。只有救主作出决定时，他们才随之而来。因此，他们来了；在肉身的流出上，他们远远超过那些由缺失而产生的人，[] 因为他们也像救主一样经历了有形体的流出，这是借着他们与他联合的启示而发生的。[b]



    这些人具有同一实体，就是属灵的实体。然而，救恩的安排各有不同：这是一回事，那又是另一回事。有些从激情和分裂中出现，需要医治；另一些则出自医治病人的祷告，被指派去医治堕落的人。他们就是使徒和信息的宣讲者，是救主的学生，也是那些需要受教之人的教师。



    那么，既然按照救恩的安排，他们与不曾有分于这类激情的救主在一个身体里产生，为什么他们也有分于那些由激情产生之人所受的同样激情呢？救主是那独一者的形象，是以身体形态显现的整体。因此，他保全了不可分离的原型，而不受激情正由此而来。但他们各自是每一个已显现者的形象；所以，他们接受与自己的原型分离，因为他们为了那存在于天之下的栽种而取了形态；这栽种也[]有分于他们所到之处盛行的邪恶。因为意愿把整体囚禁在罪之下，好使他能凭意愿怜悯整体，使他们得救；这是因为那独一者被拣选来赐生命，其余一切都需要拯救。[c]



    因此，他是在获得赐下众恩赐之恩典的人中第一位；这些恩赐由他认为配向别人宣讲的人传扬。因为耶稣基督应许的种子已经安置下来，我们所服事的正是它的启示与联合。这应许使教导成为可能，也使他们得以回归起初的所是。他们里面有一滴，使他们倾向于回归那里；他们称这为“救赎”，就是从囚禁中获释，并且得着自由。



    这囚禁属于那些被无知奴役的人。相反，自由就是认识那在无知以前已经存在、永远长存、无始无终的真理。它是良善，是医治一切的良药，也使人脱离那奴役人的本性；这本性使那些从卑微的空虚意念中产生的人受苦，就是邪恶倾向的本性，[]借着那使他们堕落、陷入掌控欲的意念而运作。孩子们从垂顾他们的丰盛恩典中领受了自由的宝藏。自由推翻激情，并毁灭那些它先前从自身抛弃的事物——那时，道已把它们从自己分离出去。他命定它们归于毁灭，直到<这>救恩的安排结束；他又容许它们继续存在，因为它们对那些预定之事也有用处。'
