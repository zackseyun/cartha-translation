lexical_decisions:
- source_word: the All / the Totality
  choice: “全体”
  rationale: 作为本文宇宙论中的术语处理，以引号提示其专门含义；两处英文分别作 the All 与 the Totality，但在当前见证中可能指涉同一整体，译文不强行区分。
- source_word: aeons
  choice: 诸永世
  rationale: 保留该术语既可表示超世时间领域、又可指人格化属灵存在的张力，避免直接套用特定宗派音译或解释性称谓。
- source_word: brought forth / produced
  choice: 使……产生／使……形成
  rationale: 依语境采用较自然的使役表达，不擅自明确为创造、生育或流溢，以保留原见证的生成性含混。
- source_word: perfection / perfect
  choice: 完全／完全的
  rationale: 统一保留圆满、成熟与完成的语义范围；在“达到完全”处使成长意象更符合现代汉语。
- source_word: concealed
  choice: 隐藏
  rationale: 保留编辑性尖括号，并采用中性词，不解释隐藏的具体方式。
- source_word: wear each other
  choice: 彼此穿戴
  rationale: 直译这一异常而可能具有技术含义的隐喻，不以“互相包含”等解释取代原有难度。
- source_word: sweetness
  choice: 甘美
  rationale: 兼顾感官隐喻与赞美语体，比“甜蜜”更庄重，也不将其抽象化为恩慈。
theological_decisions:
- issue: 父延迟赐下完全的原因
  choice: 保留“不是出于嫉妒”以及诸永世不能过早领受完全的因果陈述
  alternative: 将其解释为教育、试炼或预定安排
  rationale: 见证文本刻意同时强调父的非嫉妒与受造／生成者的限制；不补入体系化解释。
- issue: “子”与从父而出者的关系
  choice: 译作“使他与那从他里面发出的混合在一起”
  alternative: 解释为本质合一、位格联合或与万有融合
  rationale: 原见证语句残缺且使用“mixed”，应保留其不寻常措辞和关系上的含混。
- issue: 父的无可比拟与自我显明
  choice: 并列保留父不可比较、受尊荣及显明自己
  alternative: 为消除表面张力而把显明改作间接启示
  rationale: 文本本身维持超越性与可显明性的神学张力，译文不予消解。
- issue: 诸永世“由他而生”
  choice: 采用“由他而生的存在”
  alternative: 译作受造物、流溢体或神性位格
  rationale: 不把产生方式限定为创造、繁衍或流溢，避免导入特定宇宙论框架。
translation_notes:
  register: 采用现代、庄重而可读的普通话书面语。因科普特语原文审查尚待进行，本稿以所给公共领域英文见证为临时依据；保留圆括号、方括号、尖括号和省略号所表达的文本层次。对“全体”“诸永世”“彼此穿戴”等术语和异常隐喻尽量形式保留，不以教派性术语或系统神学解释加以平滑。
