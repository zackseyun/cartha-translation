translation:
  language: zh_hans
  text: '那么，既然他不可领会，也就无法被认识；任何思想都把握不住他，万有都看不见他，任何言语都说不出他，任何手都触及不到他。只有他知道自己本来如何，也知道自己的形态、伟大和尺度本来如何。[a] 因为他能思想自己、看见自己、称说自己、领会自己，所以唯有他自己的心智、自己的眼、自己的口、自己的形态，与他自己的存在相等。因此，他就是他所思想的、所看见的、所说的、所领会的；他本身不可思想、不可言说、不可把握，并且永不改变，而他所思想、所看见、所说的，以及他所思量的，却是滋养，是喜乐、真实、可喜悦、使人安息的。他超越一切智慧，高过一切心智、一切荣耀、一切美丽、一切甘美、一切伟大，以及每一处深渊和每一重高处。


    这位本性不可知者，具有我所列举的一切伟大属性；如果他愿意从自己丰盛的甘美中赐下认识，使人能认识他，他就能这样做。他的能力就是他的意愿。然而，这位使诸总有进入其永恒存在的伟大者，却在静默中约束自己。[b]


    [……][c] 严格说来，他以不可言说的方式生出自己，因为唯有他是自生的；他由自己所构想，并且按自己的本相认识自己。他从自己无限的伟大、无法探究的智慧、不可测量的能力，以及超乎品尝的甘美中，产生一切配得他尊重、荣耀、尊荣和赞美的事物。他以生出的方式显现自己，领受荣耀与赞美、尊荣与爱；他也荣耀并赞美自己，把尊荣与爱归给自己。这样，他便有了一位子；这子存于他里面，他对这子保持静默：子在不可言说者里面不可言说，在不可见者里面不可见，在不可把握者里面不可把握，在不可领会者里面不可领会。


    这样，子永远存在于父里面。正如我们先前所解释的，父以非受生的方式在自己里面认识自己；他借着思想生出自己，那关于他的思想，就是他对自己的感知[……]，是他永恒本性的[……]。[d] 然而，严格说来，那就是静默、智慧和恩赐——如果这样称呼才算恰当。严格说来，父是存在的；在他以前没有[别者存在]，在他以外也没有另一位非受生者。同样，[子]严格说来也是存在的；在他以前没有别者存在，在他以后也不会有另一位子。因此，他是长子，也是独生子。他是长子，因为在他以前没有人存在；他是独生子，因为在他以后不会再有别的子。此外，他有自己的果实；这果实因其超越一切的伟大而无法被认识。然而，他从自己丰盛的甘美中，愿意使自己的果实被认识。于是，他显明了无法言喻的能力，并把这能力与自己丰厚的慷慨调和在一起。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处底本在“自己”与“本来如何”之间有缺损；译文按现存句意衔接，未补定缺字。
    reason: 标明手稿缺损及补译限度。
  - marker: b
    text: “诸总有”对应见证文本的“the Totalities”，是指存在整体或众存在者的特色集合称谓；其确切科普特语形式尚待原文复核。
    reason: 说明不常见宇宙论术语，并提示当前以英文公共领域见证为起草依据。
  - marker: c
    text: 本段开头有手稿缺损，无法确定缺失内容。
    reason: 保存原见证的缺损信号。
  - marker: d
    text: “感知”之后及“他永恒本性的”之后，手稿均有缺损；相关短语的句法和所指因此不能完全确定。
    reason: 提示关键残文造成的语义不确定性。
lexical_decisions:
- source_word: incomprehensible / ungraspable
  choice: 不可领会／不可把握
  rationale: 分别保留认知上的不能领会与思想无法抓住的近义层次，避免合并原文的排比。
- source_word: scale
  choice: 尺度
  rationale: 保留其可能指量度、幅度或宏伟程度的开放性，不擅自释为具体大小。
- source_word: sustenance
  choice: 滋养
  rationale: 既可表达维系生命之物，也可表达带来滋养的性质，保留句法上的抽象性。
- source_word: sweetness
  choice: 甘美
  rationale: 采用庄重而可感的词，保留全文反复出现的味觉隐喻。
- source_word: the Totalities
  choice: 诸总有
  rationale: 将其作为本文特有的宇宙论集合术语处理；“诸”保留复数，“总有”表达存在整体而不直接等同于日常的“万物”。
- source_word: begets himself / self-begotten
  choice: 生出自己／自生的
  rationale: 保留文本关于自我生出的悖论性陈述，不按后世教义体系改写。
- source_word: projects himself
  choice: 显现自己
  rationale: 表达由自身向外呈现的动态，同时避免现代汉语“投射”可能引出的心理学含义。
- source_word: Firstborn and only Son
  choice: 长子，也是独生子
  rationale: 沿用现代读者熟悉的宗教语汇，同时由下文原样保留两种称谓各自的特殊解释。
- source_word: fruit
  choice: 果实
  rationale: 保留原有生成与产出的隐喻，不提前判定它具体指何种实体。
theological_decisions:
- issue: 父的自生与子的存在之间的张力
  choice: 照译“父……生出自己”以及“子永远存在于父里面”
  alternative: 将“生出自己”弱化为“自我认识”或按后期三位一体术语重述
  rationale: 见证文本同时使用自我构想、自生和父子语言；译文保留其内在张力，不以宗派教义消解。
- issue: “长子”与“独生子”的含义
  choice: 保留两个称谓，并保留下文以先后次序所作的解释
  alternative: 按传统神学惯用含义加以协调或释义
  rationale: 本文明确用“以前无人”和“以后无子”分别解释二者，译文不另行改造。
- issue: 静默、智慧和恩赐的所指
  choice: 译作“那就是静默、智慧和恩赐”，保留“那”的模糊指代
  alternative: 明确补出其所指是父、思想、子或自我认识
  rationale: 底本指代本身含混，且手稿在邻近位置残缺，不宜擅自确定。
- issue: 子“存于”父内的表达
  choice: “子永远存在于父里面”及“存于他里面”
  alternative: 译为本体论专门术语如“内在共存”或“同质”
  rationale: 避免把后世专业神学范畴输入文本，同时保持存在与内住的表达。
translation_notes:
  register: 采用现代标准普通话的庄重散文体，保留原文密集的否定排比、自反措辞和哲学—神学张力。方括号与省略号用于标示手稿缺损或编辑补足；所有脚注标记均已置入正文。当前草案依据所给公共领域英文见证起草，科普特语原文复核仍待完成。
