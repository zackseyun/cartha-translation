base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/013.yaml
  text: 'For I am convinced that you are well trained in the sacred writings, and nothing is hidden from you. But this has not been granted to me. Only, as it is said in these Scriptures, “Be angry and do not sin,” and, “Do not let the sun set on your wrath.” Blessed is the one who remembers this; and I trust that this is in you.


    Now may the God and Father of our Lord Jesus Christ, and the eternal High Priest himself, the [Son of God Jesus Christ, build you up in faith and truth, and in all gentleness and in all avoidance of wrath and in forbearance and long-suffering and in patient endurance and in purity; and may he grant you a lot and portion among his saints, and to us with you, and to all who are under heaven, who will believe in our Lord and God Jesus Christ and in his Father who raised him from the dead.


    Pray for all the saints. Pray also for kings and powers and princes, and for those who persecute and hate you and for the enemies of the cross, that your fruit may be manifest among all people, that you may be perfect in him.'
translation:
  language: zh_hans
  text: '《坡旅甲致腓立比人书》12


    我深信，你们在圣书上受过良好的教导，没有什么是向你们隐藏的；但这并没有赐给我。只是，正如这些经文所说：“你们生气，却不要犯罪”；又说：“不可让太阳落下时，你们还在发怒。”记住这话的人有福了；我相信，这也在你们里面。


    愿我们主耶稣基督的上帝和父，以及永恒的大祭司本人——[上帝的儿子耶稣基督[a]——在信心和真理上造就你们，使你们凡事温柔，远避愤怒，宽容忍让，恒久忍耐，坚忍到底，并且纯洁；愿他使你们在他的众圣徒中有所得的份，也使我们与你们一同得份，并使天下所有将要信靠我们的主和上帝耶稣基督、又信靠那使他从死人中复活的父的人一同得份。


    要为所有圣徒祷告。也要为君王、掌权者和统治者祷告，并为迫害你们、恨你们的人和十字架的仇敌祷告，好使你们的果子在众人中显明，使你们在他里面得以完全。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所供英文见证在“上帝的儿子耶稣基督”之前保留了一个未闭合的方括号，可能表示抄本残缺或编者补文的起点。因希腊文和拉丁文原始见证尚待直接核查，本译文暂照其形式保留。
    reason: 标明文本传承或校勘上的不确定性，避免把可能的补文无提示地当作确定正文。
lexical_decisions:
- source_word: sacred writings / Scriptures
  choice: 圣书／经文
  rationale: 首处指神圣文献的整体，用“圣书”；后处引出具体引文，用现代汉语更自然的“经文”，同时保留二者的关联。
- source_word: Be ye angry and sin not
  choice: 你们生气，却不要犯罪
  rationale: 保留命令式及“生气”与“不犯罪”之间的张力，不将其解释成禁止一切愤怒。
- source_word: wrath
  choice: 发怒／愤怒
  rationale: 引文中用“还在发怒”表达持续状态；德目清单中用名词“愤怒”，符合现代汉语搭配。
- source_word: eternal High-priest
  choice: 永恒的大祭司
  rationale: 保留早期基督教文本明确的祭司性称号及其“永恒”属性。
- source_word: build you up
  choice: 造就你们
  rationale: 保留建筑隐喻在基督教汉语中的惯用表达，不弱化为一般性的“帮助”。
- source_word: lot and portion
  choice: 有所得的份／得份
  rationale: “所得的份”保留分配、产业和归属的意象，同时避免生硬重复“阄和份”。
- source_word: long-suffering / patient endurance
  choice: 恒久忍耐／坚忍到底
  rationale: 用相近但不相同的表达保留并列德目的区别：前者偏向长期容忍，后者偏向在压力下坚持。
- source_word: fruit
  choice: 果子
  rationale: 保留道德与属灵成果的传统比喻，不提前限定具体所指。
- source_word: perfect in Him
  choice: 在他里面得以完全
  rationale: 保留“在他里面”的联合性表述以及“完全”的神学张力，不解释为无罪或仅指成熟。
theological_decisions:
- issue: “我们的主和上帝耶稣基督”的称谓关系
  choice: 我们的主和上帝耶稣基督
  alternative: 我们的主耶稣基督和上帝
  rationale: 所供见证的句法把“主”和“上帝”共同用于“耶稣基督”；译文保留这一读法，不拆分称谓。
- issue: 祈愿句中“他”的先行词
  choice: 保留单数“他”，不反复明说具体先行词
  alternative: 每处均译作“耶稣基督”或“上帝”
  rationale: 原见证在提到父与永恒大祭司后使用单数代词，指涉存在一定张力；汉译不擅自消除。
- issue: “这也在你们里面”所指
  choice: 保留概括性指称
  alternative: 解释为“你们也牢记这话”或“你们也有这福分”
  rationale: 原文所指可能是记念这些诫命，也可能是相应的品格；直译可保存这种开放性。
- issue: “天下所有将要相信的人”的时间色彩
  choice: 将要信靠
  alternative: 信靠
  rationale: 保留所供见证中的将来指向，不将范围限于当时已经相信的人。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。德目清单以平行短语呈现，并尽量区分语义相近的忍耐类词语。本稿依据所供公版英文见证起草；由于希腊文和拉丁文原始见证的直接复核尚未完成，校勘性判断均保持暂定，尤其保留了第二段的方括号异常。
