base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/012.yaml
  text: 'I was deeply grieved for Valens, who was formerly a presbyter among you, because he understands so little of the office entrusted to him. Therefore, I warn you to keep away from greed and to be pure and truthful. Keep away from every evil.


    But if someone cannot control himself in these matters, how can he command another to do so? If anyone does not keep away from greed, he will be defiled by idolatry and judged as one of the Gentiles who do not know the judgment of the Lord. Nay, do we not know that the saints will judge the world, as Paul teaches?


    But I have neither found nor heard of any such thing among you, among whom the blessed Paul labored and who were his letters in the beginning. For he boasts about you in all those churches that alone knew God at that time; for we did not yet know Him.


    Therefore, I am deeply grieved for him and for his wife, to whom may the Lord grant true repentance. You yourselves also must be sober in this matter. Do not regard such people as enemies, but restore them as frail and erring members, so that you may save the whole body of you. For by doing this, you build one another up.'
translation:
  language: zh_hans
  text: '我因瓦伦斯深感忧伤。他从前在你们中间作长老，竟如此不明白所托付给他的职分。因此，我劝你们远离贪婪，保持纯洁，诚实无伪。要远离一切恶事。


    一个人在这些事上若不能约束自己，又怎能吩咐别人这样做呢？人若不远离贪婪，就会被偶像崇拜玷污，并要像那些不知道主之审判的外邦人一样受审判。难道我们不知道圣徒将要审判世界吗？保罗也是这样教导的。


    然而，我在你们中间没有发现这样的事，也没有听说过这样的事。蒙福的保罗曾在你们中间劳苦，而你们从起初就是他的书信[a]。他在所有那些教会中都以你们为荣；当时唯有那些教会认识神，我们却还不认识他。


    因此，我为他和他的妻子深感忧伤。愿主赐给他们真正的悔改。你们自己在这件事上也要警醒。不要把这样的人看作仇敌，却要挽回他们，把他们当作软弱而走迷的肢体，好使你们整个身体得以保全。你们这样做，就是彼此造就。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们从起初就是他的书信”：现存拉丁文传本在这里也可理解为“你们是在他书信的开头（所提到的）”。本译文保留古译见证中的“书信”比喻；此处原文传承和句法并不完全确定。
    reason: 该句传本与句法存在真实歧义，且“作他的书信”这一不寻常意象不宜在正文中被悄然改平。
lexical_decisions:
- source_word: presbyter
  choice: 长老
  rationale: 采用初期基督教语境中自然且通行的职分名称，不额外引入后世宗派制度含义。
- source_word: office / τόπος
  choice: 职分
  rationale: 此处指瓦伦斯受托承担的位置或职责；“职分”既保留受托性质，也比直译“位置”更符合上下文。
- source_word: covetousness / πλεονεξία
  choice: 贪婪
  rationale: 涵盖贪财及不正当占有欲，避免把词义仅限于金钱。
- source_word: govern himself / κυβερνᾶν
  choice: 约束自己
  rationale: 源词带有掌舵、治理之意；现代汉语用“约束自己”自然表达自我管理，同时不夸大隐喻。
- source_word: Gentiles / ἔθνη
  choice: 外邦人
  rationale: 保留早期基督教文献中与不认识主之人相关的群体称谓。
- source_word: members
  choice: 肢体
  rationale: 保留群体如同一个身体的比喻，并与后文“整个身体”呼应。
- source_word: edify
  choice: 造就
  rationale: “彼此造就”是自然且庄重的基督教汉语表达，传达建立、坚固群体之意。
theological_decisions:
- issue: 贪婪与偶像崇拜的关系
  choice: “就会被偶像崇拜玷污”
  alternative: “就会因偶像崇拜而沾染污秽”或“就成了拜偶像的人”
  rationale: 保留文本所说的玷污关系，不把贪婪与偶像崇拜直接等同，从而避免消解原文的表达张力。
- issue: “圣徒将要审判世界”
  choice: 直接保留陈述
  alternative: 解释为参与基督的审判或仅作道德评断
  rationale: 文本引用保罗的教导，却未说明审判的具体方式；译文不加入宗派性解释。
- issue: “拯救/保全整个身体”
  choice: “好使你们整个身体得以保全”
  alternative: “好使你们全体得救”
  rationale: 保留身体—肢体的群体隐喻，同时避免武断限定此处“拯救”是终末救恩还是群体免受损害。
- issue: 赐予真正悔改的对象
  choice: “愿主赐给他们真正的悔改”
  alternative: “愿主赐给他和他的妻子真正的悔改”
  rationale: 用复数代词自然承接瓦伦斯及其妻子，不对两人的责任程度另作判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。劝诫段落使用简洁有力的句式；保留“圣徒审判世界”“肢体—身体”“彼此造就”等早期基督教核心意象。鉴于所供材料注明希腊文、拉丁文源语复核尚待完成，本稿对可核见的希腊语段落优先按源语语义处理，对后半拉丁文传承则谨慎参考公共领域见证，并用脚注标明关键歧义。
