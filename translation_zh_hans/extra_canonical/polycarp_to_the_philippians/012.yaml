  naturalness: 原稿总体庄重自然。修订后，“谨慎自守”比“警醒”更贴近原义；“把他们当作……肢体而挽回”也较不易被读作仅仅改变对他们的看法。
  terminology: “长老”“职分”“贪婪”“外邦人”“圣徒”“肢体”“造就”均适合早期基督教书信的现代庄重语体。“偶像崇拜”可保留，以避免把“受偶像崇拜玷污”的句法强行译为“贪婪就是偶像崇拜”。
  issues:
  - severity: medium
    issue: “警醒”未充分表达 sober 的自制、谨慎含义。
    rationale: 此处紧接对贪婪及失职者的劝戒，所要求的是清醒自守，而非主要指末世性或守望性的“警醒”。
  - severity: medium
    issue: “却要挽回他们，把他们当作软弱而走迷的肢体”中，后半语法上容易被理解为单纯的态度说明。
    rationale: 见证的意思是应将他们视为软弱、走迷但仍属身体的肢体，因而加以恢复；调整语序可更清楚保留这一劝诫。
