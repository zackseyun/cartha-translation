source:
  text: 'I was exceedingly grieved for Valens, who aforetime was a presbyter among you, because he is so ignorant of the office which was given unto him. I warn you therefore that ye refrain from covetousness, and that ye be pure and truthful. Refrain from all evil.


    But he who cannot govern himself in these things, how doth he enjoin this upon another? If a man refrain not from covetousness, he shall be defiled by idolatry, and shall be judged as one of the Gentiles who know not the judgment of the Lord, Nay, know we not, that the saints shall judge the world, as Paul teacheth?


    But I have not found any such thing in you, neither have heard thereof, among whom the blessed Paul labored, who were his letters in the beginning. For he boasteth of you in all those churches which alone at that time knew God; for we knew Him not as yet.


    Therefore I am exceedingly grieved for him and for his wife, unto whom may the Lord grant true repentance. Be ye therefore yourselves also sober herein, and hold not such as enemies but restore them as frail and erring members, that ye may save the whole body of you. For so doing, ye do edify one another.'
