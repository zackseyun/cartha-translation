    rationale: 可用“正如他自己所吩咐的，也如……使徒和……先知所吩咐的”保留原文省略的共同谓语，不补充具体命令内容。
  - severity: low
    issue: “罪的债户”不符合当代普通话的常用搭配。
    rationale: “都欠着罪债”保留债务隐喻及其解释空间，读来更自然；脚注继续说明其语义未决。
