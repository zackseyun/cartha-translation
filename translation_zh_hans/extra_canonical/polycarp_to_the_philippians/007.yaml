review_pass:
  verdict: revise
  source_fidelity: 整体忠实传达所提供英文见证的三段劝勉，保留了牧羊、审判台与罪债等意象，也没有把待复核处作宗派化解释。不过，个别措辞缩窄或扩展了原文：将“anything against any man”限定成“控告……的话”，将“不仓促判断”加强为“不可仓促定罪”；末段“正如……所传的”也略把原有的并列、省略结构具体化为“传授”。
  naturalness: 译文总体庄重、流畅，适合现代书面普通话。“罪的债户”“十足的恭敬”略显生硬；改为“负有罪债”“完全的敬重”可保留原意并提高自然度。
  terminology: “长老们”“基督的审判台”“传福音”“假弟兄”等用语稳妥。“偏心”可表达按外貌待人的偏待；“冒用主名”虽能表达批评意味，但比“假冒为善地称主名”更进一步带出未经明说的盗用含义，宜收敛。
  issues:
  - severity: medium
    issue: “不可轻易相信控告任何人的话”把较宽泛的“不可轻信任何不利于任何人的事”限缩为控告言辞。
    rationale: 英文见证为“not quick to believe anything against any man”，未限定为正式或明确的控告。
  - severity: medium
    issue: “也不可仓促定罪”将“not hasty in judgment”限缩为定罪。
    rationale: 原句所禁的是仓促判断／论断，未必已经达到宣告有罪的程度。
  - severity: low
    issue: “正如……所传的”将末段并列而省略的权威来源关系稍作具体化。
    rationale: 可用“也如……所传讲的”保留其与主命令并列的关系，避免暗示使徒和先知只是在传递一项明确、同一的命令。
  - severity: low
    issue: “假冒为善地冒用主名”中的“冒用”稍强于“in hypocrisy bear the name of the Lord”。
    rationale: 原见证重点是虚伪地带着／称呼主的名；“称主名”较贴近且不减弱批判。
  revised_text: '长老们也必须有同情心，怜悯众人；要使迷失的羊回转，看望所有患病的人，不可忽略寡妇、孤儿或穷人；反要常常顾念在上帝和人眼中都可敬的事。他们应当远离一切怒气、偏心和不义的判断，远离一切贪财之心；不可轻信任何不利于任何人的事，也不可仓促判断，因为我们都负有罪债。[a]


    所以，我们若恳求主赦免我们，也应当赦免人；因为我们都在我们的主和上帝眼前，并且我们都必须站在基督的审判台前，各人也必须为自己交账。


    因此，我们要怀着敬畏和完全的敬重事奉他，正如他亲自所吩咐的，也如向我们传福音的使徒和预先宣告我们主来临的先知所传讲的。我们要热心于善事，远离绊脚的事、假弟兄，以及那些假冒为善地称主名、把愚昧人引入歧途的人。[b]'
  revised_footnotes:
  - marker: a
    text: “负有罪债”直译性地保留所据见证中“debtors of sin”的债务比喻；由于直接源语言复核尚待完成，正文不确定它究竟强调人欠下罪债，还是人人都受罪与亏欠所牵连。
    reason: 保留原句不寻常的语义张力，避免将其单一定义为“罪人”或某一种罪债理论。
  - marker: b
    text: “绊脚的事”所据词也可泛指绊脚石、诱因或冒犯；“假冒为善地称主名”指虽带着或称呼主的名，却以虚伪方式行事的人。
    reason: 说明两个具有较宽语义范围的伦理用语，并避免把“称主名”加强为原句未明说的“盗用”。
  revision_rationale: 修订主要消除两处不必要的语义限缩（“控告”“定罪”），收敛“冒用”的加强语气，并使末段的并列权威来源更贴近英文见证的省略结构。其余处维持原稿的现代庄重文体、职分称谓、神学谨慎和歧义保留。
