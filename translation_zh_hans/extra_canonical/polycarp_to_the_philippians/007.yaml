review_pass:
  verdict: revise
  source_fidelity: 整体忠实反映所提供的英文见证，并谨慎保留“罪的债户”的未决含义及末世审判意象。需要修正两处会缩窄或强化原意的表达：把“不仓促判断”译成“不可仓促定罪”将一般判断限定为定罪；“假冒为善地冒用主名”比“虚伪地持主名／称主名”更强，增加了“冒用”的含义。末段有关主、使徒和先知的并列权威来源也可更贴近原句的省略式结构。
  naturalness: 译文庄重、清晰，适合现代书面普通话。“罪的债户”虽刻意保留直译张力，但中文不够自然；改为“都欠着罪债”可保留债务比喻，同时更符合现代汉语。
  terminology: “长老们”“基督的审判台”“福音”“假弟兄”等术语妥当且不带不必要的宗派色彩。“偏心”可准确表达按人情面或身份偏待。“绊跌人的事”较“使人跌倒的事”更能保留原词的宽泛伦理意象，且不预断为具体行为后果。
  issues:
  - severity: medium
    issue: “不可仓促定罪”缩窄了“not hasty in judgment”的范围。
    rationale: 原见证说不可仓促作判断，未明确限于司法性或道德性的“定罪”；应译为“不可仓促判断”。
  - severity: medium
    issue: “假冒为善地冒用主名”加入“冒用”这一原见证未明确表达的指控。
    rationale: “bear the name of the Lord in hypocrisy”所指是虚伪地持有、宣称或奉主的名；“冒用”容易表示未经授权地盗用名义，语义更强。
  - severity: low
