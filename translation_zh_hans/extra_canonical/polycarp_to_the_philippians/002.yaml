base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/002.yaml
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
translation:
  language: zh_hans
  text: '我在我们的主耶稣基督里与你们一同大大喜乐，因为你们接待了真实之爱的榜样[a]，又为他们送行；这正合乎你们的本分。他们被圣洁的锁链捆绑；这些锁链乃是真正蒙上帝和我们的主拣选之人的冠冕。


    我又因你们信心坚固的根基而喜乐；这信心自起初以来就声名远扬，直到如今仍然存留，并为我们的主耶稣基督结果子。他为我们的罪忍受死亡；上帝使他复活，解除了阴间[b]的痛苦。你们虽然没有见过他，却信靠他，并且满有说不出来、充满荣光的喜乐；许多人都渴望进入这喜乐。因为你们知道，你们得救是本乎恩典，不是出于行为，而是照着上帝的旨意，借着耶稣基督[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真实之爱的榜样”直译为“真实之爱的模样／体现”。此处的“爱”在希腊文中是普通名词，并无专名标记；这句话具体指哪些人或如何体现这种爱，仍可保留开放理解。
    reason: 依据原文的普通名词和μίμημα的“榜样、体现”含义，避免将“爱”人格化或将这些人固定为某一对象的“追随者”。
  - marker: b
    text: “阴间”译自Hades，指死者所在的境域；不宜译为专指刑罚之地的“地狱”。
    reason: 保留Hades较宽的语义范围。
  - marker: c
    text: 末句与《以弗所书》2:8—9的措辞相近，但本段还明确说“照着上帝的旨意，借着耶稣基督”；译文保留这些成分。
    reason: 提示互文，同时不以较熟悉的经文措辞替代本段自身的表达。
lexical_decisions:
- source_word: true Love
  choice: 真爱
  rationale: 保留所据英文见证中带有强调意味的表达；汉语不以首字母大写标示专名，因此用脚注说明其开放性，不擅自判定为专称。
- source_word: saintly bonds
  choice: 圣洁的锁链
  rationale: 保留锁链这一具体而悖论性的殉道意象，不弱化为泛泛的“苦难”或“拘禁”。
- source_word: diadems
  choice: 冠冕
  rationale: 以教会文献和圣经语境中自然、庄重的“冠冕”传达尊荣与得胜的象征。
- source_word: steadfast root of your faith
  choice: 你们信心那坚定的根
  rationale: 保留“根”的比喻及信心持久稳固之意。
- source_word: Hades
  choice: 阴间
  rationale: 用“阴间”指称死者所在之境，避免译成“地狱”而引入刑罚之地的限定含义。
- source_word: by grace … not of works
  choice: 本乎恩典，不是出于行为
  rationale: 保留恩典与行为的明确对照，同时采用现代读者可以理解、又与经文互文相称的措辞。
theological_decisions:
- issue: “God and our Lord”所指对象及句法关系
  choice: 上帝和我们的主
  alternative: 上帝——我们的主；上帝和我们的主耶稣基督
  rationale: 所据英文见证保留了并列结构，而希腊文、拉丁文直接核查尚未完成；正文不补入“耶稣基督”，脚注提示可能的句法理解，以免过早消除歧义。
- issue: “true Love”是否为专称或神学称号
  choice: 真爱
  alternative: 真正的爱；那位真爱
  rationale: 不将“爱”直接人格化或等同于某一特定对象，同时保留英文见证的强调。
- issue: “Hades”的神学范围
  choice: 阴间
  alternative: 地狱；死亡
  rationale: “阴间”较能保留Hades作为死者境域的宽泛意义，不将其限定为最终刑罚。
- issue: 得救的施行关系
  choice: 照着上帝的旨意，借着耶稣基督
  alternative: 不是出于行为，而是借着耶稣基督、出于上帝的旨意
  rationale: 保留所据见证的语义成分与次序，不扩写恩典、旨意和基督之间的系统神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的书信体；保留“锁链—冠冕”“信心之根—结果子”等鲜明比喻，并适度拆分英文长句以符合现代汉语阅读节奏。由于本条目注明希腊文和拉丁文原始传统的直接核查尚待完成，本稿实质上依据所给公版英文见证并参照英文POB审校层拟定；所有可能受源语句法影响的重要歧义均显式保留或加注，待源语复核后再定稿。
