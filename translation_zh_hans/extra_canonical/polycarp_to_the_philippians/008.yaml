    Wherefore let us forsake the vain doing of the many and their false teachings, and turn unto the word which was delivered unto us from the beginning, being sober unto prayer and constant in fastings, entreating the all-seeing God with supplications that He bring us not into temptation, according as the Lord said, The Spirit is indeed willing, but the flesh is weak.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/008.yaml
  text: 'For everyone who does not confess that Jesus Christ has come in the flesh is antichrist. Whoever does not confess the testimony of the cross is of the devil. And whoever twists the Lord’s sayings to suit his own desires and says that there is neither resurrection nor judgment—that person is the firstborn of Satan.


    Therefore, let us abandon the empty practices of the many and their false teachings, and turn to the word delivered to us from the beginning. Let us be sober in prayer and steadfast in fasting, pleading with the all-seeing God not to bring us into temptation, just as the Lord said, “The spirit is indeed willing, but the flesh is weak.”'
translation:
  language: zh_hans
  text: '凡不承认耶稣基督已经在肉身里来的人，就是敌基督；凡不承认十字架的见证的人，就是属魔鬼的；凡为迎合自己的私欲而曲解主的圣言，又说既没有复活，也没有审判的人，就是撒但的长子。[a]


    所以，我们应当离弃许多人那些虚妄的行径和他们的错误教导，转向那从起初传给我们的道。我们要警醒祷告，在禁食上恒切，恳求那鉴察一切的上帝不要领我们进入试探，正如主所说：“心灵固然愿意，肉体却软弱了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒但的长子”是原文强烈的谴责性称呼，意指这样的人在撒但的作为上居于突出地位；不一定是在陈述某种字面的出生次序。
    reason: 帮助现代读者理解古代修辞，同时在正文中保留原有比喻。
lexical_decisions:
- source_word: confess
  choice: 承认
  rationale: 这里指公开认可并宣认关于基督的真理；“承认”在现代汉语中自然，也不把含义缩窄为礼仪性“信仰告白”。
- source_word: come in the flesh
  choice: 已经在肉身里来
  rationale: 保留“来”与“肉身”的基督论措辞及完成意义，不释义成单纯的“成为人”。
- source_word: antichrist
  choice: 敌基督的
  rationale: 采用现代中文基督教文献中通行的对应语，并保留原文可指敌对基督者的表述。
- source_word: testimony of the Cross
  choice: 十字架之见证
  rationale: 保留“见证”的客观与宣认双重可能，不擅自改成“十字架的道理”或“基督被钉十字架的事实”。
- source_word: oracles of the Lord
  choice: 主的圣言
  rationale: 表达具有权威性的主之言语；“圣言”比“神谕”更符合早期基督教语境，也避免现代汉语中异教占卜的联想。
- source_word: firstborn of Satan
  choice: 撒但的长子
  rationale: 直译其强烈修辞，不弱化为“撒但的头号儿子”或泛泛的“属撒但者”。
- source_word: being sober unto prayer
  choice: 警醒祷告
  rationale: 依其祷告语境译为保持清醒警觉地祷告，现代汉语自然，并与早期基督教劝勉用语相合。
- source_word: constant in fastings
  choice: 恒切禁食
  rationale: 保留持续、坚持以及复数所暗示的反复禁食实践，不规定具体制度。
- source_word: Spirit / flesh
  choice: 心灵／肉体
  rationale: 在所引主语中，“心灵”自然表达人的内在意愿；“肉体”保留身体软弱的张力，且不将 Spirit 误解为圣灵。
theological_decisions:
- issue: “在肉身里来”的基督论表述
  choice: 保留“耶稣基督已经在肉身里来”
  alternative: 译为“耶稣基督已经成为人来到世上”
  rationale: 原措辞强调真实的肉身显现，并与反对否认基督肉身的论辩相关；不以解释性扩写消除其经文式表达。
- issue: “十字架之见证”的所指
  choice: 保留属格关系的开放性
  alternative: 明确译作“关于十字架的见证”或“十字架所作的见证”
  rationale: 现有见证不足以排除主观属格或客观属格等理解，因此不在正文中单向定论。
- issue: “不要领我们进入试探”中上帝的角色
  choice: 按传统祷文结构直译
  alternative: 译为“不要让我们陷入试探”
  rationale: 保留原有神学张力及与主祷文的明显呼应，不通过释义预先解决上帝、试探与许可之间的关系。
- issue: “心灵”所指
  choice: 理解为人的内在心灵
  alternative: 译为“圣灵固然愿意”
  rationale: 引语的上下文是门徒意愿与肉体软弱的对照；但仍用“心灵”而非“意志”，保留原语的广度。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语，保留早期基督教劝诫的排比与力度。鉴于所提供材料明确说明希腊文和拉丁文原始资料尚待直接复核，本稿以公共领域英文见证为暂定依据；没有把英文 POB 当作唯一底本。经源语言校勘后，尤其应复核“虚妄的行径”“主的圣言”“警醒祷告”以及“撒但的长子”等措辞。
