  naturalness: 整体庄重清晰，但“众人虚妄的行径”易被理解为“所有人的行径”，且修饰关系略滞涩。改为“许多人那些虚妄的行径”更贴近“the many”，并明确其与“他们的错误教导”的并列关系。“在禁食上恒切”比“恒切禁食”更自然地表达持续坚持之意。
  terminology: “承认”“十字架的见证”“主的圣言”“撒但”“上帝”“肉体”等术语均可保留。“敌基督”应作名词使用，不应写成“敌基督的”。引语中的“心灵”可保留，以免将πνεῦμα单方面定为“圣灵”。
