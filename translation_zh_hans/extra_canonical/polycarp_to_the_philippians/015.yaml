base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/015.yaml
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
translation:
  language: zh_hans
  text: 我借克雷森斯写信给你们，写下这些话。我不久前曾向你们举荐他，现在仍要举荐他，因为他在我们中间为人无可指责；我相信，他在你们中间也会同样如此。他的姊妹来到你们那里时，也请你们接待她。愿你们和所有属你们的人，在主耶稣基督里、在恩典中安好。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: by/through Crescens
  choice: 托克雷森斯
  rationale: 表达书信由克雷森斯携带或经他转交；英文见证本身不能确定更细的递送方式。
- source_word: commended
  choice: 举荐
  rationale: 保留作者为信使作担保、请求收信人认可接待他的语义。
- source_word: walked blamelessly
  choice: 为人无可指责
  rationale: 将古代“行走”的品行隐喻译为自然现代汉语，同时保留对其生活表现的肯定。
- source_word: have his sister commended
  choice: 也请你们接纳她
  rationale: 原句在英文见证中较生硬，语境指向作者同样为其姊妹作推荐并请群体接待。
- source_word: all yours
  choice: 所有属你们的人
  rationale: 保留范围上的含混，不擅自限定为家人、同工或会众。
theological_decisions:
- issue: in the Lord Jesus Christ in grace
  choice: 在主耶稣基督里、在恩典中平安
  alternative: 愿主耶稣基督的恩典与你们同在
  rationale: 不把两个介词结构改写成较熟悉但不同的祝福公式，尽量保留现有见证的句法与神学张力。
- issue: blamelessly
  choice: 无可指责
  alternative: 完全无罪
  rationale: 此处是对可观察品行的认可，并非宣称其绝对无罪。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“你们”保持复数群体指向。因所供材料明确说明尚未直接核对希腊文和拉丁文传统，本稿为依据公共领域英文见证所作的暂定译文；未添加脚注，以免在缺乏源语校勘的情况下制造虚假精确性。
