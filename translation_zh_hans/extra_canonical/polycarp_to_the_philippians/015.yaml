- from: 我托克雷森斯把这些话写给你们。我不久前曾向你们举荐他，现在仍要举荐他，因为他在我们中间为人无可指责；我相信，他在你们中间也会同样如此。他的姊妹来到你们那里时，也请你们接纳她。愿你们和所有属你们的人，在主耶稣基督里、在恩典中平安。阿们。
  to: 我借克雷森斯写信给你们，写下这些话。我不久前曾向你们举荐他，现在仍要举荐他，因为他在我们中间为人无可指责；我相信，他在你们中间也会同样如此。他的姊妹来到你们那里时，也请你们接待她。愿你们和所有属你们的人，在主耶稣基督里、在恩典中安好。阿们。
