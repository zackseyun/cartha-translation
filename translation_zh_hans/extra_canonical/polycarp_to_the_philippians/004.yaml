base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/004.yaml
  text: 'Brothers, I write these things to you concerning righteousness, not because I laid this charge upon myself, but because you invited me.


    For neither I nor anyone else like me is able to follow the wisdom of the blessed and glorious Paul, who, when he came among you, carefully and surely taught face to face with the men of that day the word concerning truth; and who also, when he was absent, wrote a letter to you. If you look diligently into it, you will be able to be built up unto the faith given to you,


    which is the mother of us all, while hope follows after and love goes before—love toward God and Christ and toward our neighbor. For if anyone is occupied with these, that person has fulfilled the commandment of righteousness; for whoever has love is far from all sin.'
translation:
  language: zh_hans
  text: '弟兄们，关于公义的这些事，我写信给你们，并不是因为我自作主张，承担了这项嘱托，而是因为你们邀请了我。


    我和任何像我这样的人，都无法企及那位蒙福而荣耀的保罗的智慧。他到你们那里时，曾在当时的人中间，面对面地谨慎而确切地教导有关真理的道；他离开以后，也曾写信给你们。你们若认真研读那封信，就能在所领受的信仰上得以建造。


    这信仰是我们众人的母亲；盼望紧随其后，爱则走在前面——就是对上帝和基督的爱，以及对邻舍的爱。人若专心实行这些事，就已经成全了公义的诫命；因为有爱的人远离一切罪。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: righteousness
  choice: 公义
  rationale: 保留早期基督教伦理与神学语境中的核心用语，同时在现代汉语中清楚自然。
- source_word: brethren
  choice: 弟兄们
  rationale: 保留原文对群体成员的亲切称呼；不擅自改为性别包容性更强但语义范围可能不同的表达。
- source_word: the word concerning truth
  choice: 有关真理的道
  rationale: “道”能承载基督教语境中受教导的信息或话语之义，同时避免将其过度具体化为某一套教义。
- source_word: faith given to you
  choice: 所领受的信仰
  rationale: 用“领受”自然表达信仰是被赐予、被传递的，而非自行创立；“信仰”在此比单指主观信心更符合上下文。
- source_word: mother of us all
  choice: 我们众人的母亲
  rationale: 保留原文鲜明的母亲隐喻，不加解释或弱化。
- source_word: be occupied with these
  choice: 专心实行这些事
  rationale: 原表达指持续投入于上述信、望、爱及其伦理要求；“专心实行”比直译“忙于”更符合现代汉语。
- source_word: fulfilled the commandment
  choice: 成全了……诫命
  rationale: 保留“使之完全、贯彻实现”的语气，并与早期基督教伦理措辞相协调。
theological_decisions:
- issue: “这信仰是我们众人的母亲”中关系代词的所指
  choice: 承接最近的“所领受的信仰”
  alternative: 理解为前文更广义的“真理之道”，或将信、望、爱整体视为所指
  rationale: 英文见证文本的语法最自然地指向“faith”；译文保留这一连接，但不额外阐释母亲隐喻的教义含义。
- issue: 信、望、爱的次序与关系
  choice: 保留“盼望紧随其后，爱走在前面”的空间性隐喻
  alternative: 释义为“以爱为首、继之以盼望”
  rationale: 原句次序具有修辞和神学张力，不宜在译文中改写为固定的层级体系。
- issue: “爱”所指的对象
  choice: 明确保留对上帝、基督和邻舍的爱
  alternative: 概括为爱神爱人
  rationale: 逐项保留上帝与基督的并列对象，避免用概括语消除原文的表达结构。
- issue: “远离一切罪”的绝对语气
  choice: 照原句保留
  alternative: 弱化为“不容易犯罪”或“远离各种罪恶”
  rationale: 不以系统神学解释来缓和文本本身强烈的伦理断言。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。因所提供材料明确说明希腊文和拉丁文原始见证尚待直接复核，本稿属于依据公版英文见证所作的暂定译稿；避免凭空重建底本。句法适度拆分以利普通读者阅读，同时保留“母亲”“紧随其后”“走在前面”等关键隐喻。
