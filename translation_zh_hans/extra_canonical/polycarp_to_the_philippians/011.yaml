base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/011.yaml
  text: 'Therefore stand firm in these things and follow the example of the Lord, being firm in the faith and immovable, kindly affectionate toward one another in love of the brotherhood, partners with the truth, forestalling one another in the gentleness of the Lord, and despising no one.


    When you are able to do good, do not delay, for pitifulness delivers from death. Be all subject to one another, having your conduct blameless among the Gentiles, so that by your good works you may receive praise and the Lord may not be blasphemed in you.


    But woe to the one through whom the name of the Lord is blasphemed. Therefore teach all people soberness, in which you yourselves also walk.'
translation:
  language: zh_hans
  text: '所以，你们要在这些事上站立得稳，效法主，在信仰上坚定不移；在弟兄之爱中彼此亲爱，有份于真理，以主的温柔主动彼此相待，不轻看任何人。


    你们若能行善，就不要拖延，因为施舍能救人脱离死亡。[a] 你们都要彼此顺服，在外邦人中品行无可指责，好使你们因自己的善行得着称赞，主也不至于因你们而受亵渎。[b]


    但那使主的名受到亵渎的人有祸了！所以，你们要教导众人有节制；你们自己也要在这事上行事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施舍”也可广义指怜济、赈助穷乏者的行为。这里说它“救人脱离死亡”，但文本没有进一步限定所指是现世的死亡，还是更广的终极结局。
    reason: 说明该词具体指向怜济行动，并保留“死亡”所指范围的文本张力。
  - marker: b
    text: “因你们”也可较直译为“在你们身上”；意思是外人因信徒不良的行为而亵渎主。
    reason: 说明紧缩的关系表达，而不改变正文自然的汉语表述。
lexical_decisions:
- source_word: Stand fast
  choice: 站立得稳
  rationale: 保留劝勉中坚定持守的形象，同时符合现代汉语教会及一般读者的理解习惯。
- source_word: love of the brotherhood
  choice: 弟兄之爱
  rationale: 表达信徒群体内部的亲爱关系，不把原意扩展为泛指的人类友爱。
- source_word: partners with the truth
  choice: 与真理同工
  rationale: 保留与真理共同参与、协力而行的意味；“同工”比静态的“伙伴”更适合此处连续的伦理劝勉。
- source_word: forestalling one another
  choice: 彼此争先
  rationale: 保留主动抢先、相互领先的语势，而不将其弱化为单纯的彼此相待。
- source_word: gentleness
  choice: 温柔
  rationale: 采用自然且具尊严的伦理用语，可涵盖柔和、谦和的态度。
- source_word: Pitifulness
  choice: 怜悯
  rationale: 按古代劝善语境理解为施怜悯、济助穷乏者；避免现代汉语“可怜”可能带有的贬抑色彩。
- source_word: Gentiles
  choice: 外族人
  rationale: 此处指基督徒群体之外的非犹太或异教社会；“外族人”保留群体边界，又比“外邦人”更便于普通现代读者理解。
- source_word: soberness
  choice: 谨慎自守
  rationale: 兼顾清醒、节制和端正生活的含义，避免只理解为不醉酒。
- source_word: walk
  choice: 行事
  rationale: 将生活道路的隐喻自然转达为实际生活方式。
theological_decisions:
- issue: “怜悯能救人脱离死亡”的施行者与救赎含义
  choice: 直译保留“怜悯能救人脱离死亡”
  alternative: 译为“施舍能救人免于死亡”或明确限定为现世危难
  rationale: 现有见证保留了怜悯与死亡之间强烈而含混的关系；正文不擅自判定是施舍、属灵拯救还是现世搭救，以免消解古代文本的神学张力。
- issue: “主不至于因你们而受亵渎”的关系
  choice: 译作“主也不至于因你们而受亵渎”
  alternative: 译作“人也不至于在你们身上亵渎主”
  rationale: 保留信徒行为可能导致外人亵渎主的因果关系，同时避免将较不自然的空间表达机械带入中文。
- issue: 彼此顺服的范围
  choice: “你们都要彼此顺服”
  alternative: 把顺服限定为对某类领袖或社会等级
  rationale: 见证文本明确为相互关系，不能引入特定职分或等级结构。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。段落与见证一致；命令句保持有力，但避免文言化。由于希腊文和拉丁文原始传统的直接审校尚待完成，本稿以所给公共领域英文见证为主要依据，并用脚注明确保留无法从该见证中可靠消除的歧义。
