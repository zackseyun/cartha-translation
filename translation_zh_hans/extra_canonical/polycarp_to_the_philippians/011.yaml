  naturalness: 原译整体庄重流畅，但“与真理同工”稍带现代教会职分色彩，“以主的温柔彼此争先”容易读成彼此竞逐。改为“有份于真理”和“以主的温柔主动彼此相待”，更自然且贴合上下文。
  terminology: 保留“主”“信仰”“弟兄之爱”“亵渎”等适切宗教语体；将“施舍”用于ἐλεημοσύνη类伦理术语，避免把具体的怜济行动泛化为情感。将“外族人”改为传统且语境准确的“外邦人”。
  issues:
  - severity: medium
    issue: “怜悯能救人脱离死亡”将具体的施舍／赈济行动抽象化。
