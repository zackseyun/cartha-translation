review_pass:
  verdict: revise
  source_fidelity: 修订保留所据英语见证的句法推进、条件句及主语/代词张力，并避免将引文与正典福音书的惯常措辞协调。将“blow for blow”由特指“拳脚”改为较宽泛的“打还打”；将赐予的“throne at [God's] right hand”译作“在自己右边的座位”，以免汉语错误地把“右边”修饰为宝座本身。关于“他的血”及末尾“他”的指向，因提供的底本说明直接源语言复核尚待完成，仍在脚注中如实标明其解释张力，不在正文中武断消除。
  naturalness: 原稿整体庄重、可朗读。修订“束上腰”为“束紧腰带”，这是现代汉语中既保留古代意象又更自然的表达；“众人的迷误”改为“多数人的谬误”，并调整若干连接和并列结构，使劝勉文体更顺畅。
  terminology: 保留“上帝”“主耶稣基督”“复活”“诫命”“假见证”“上帝的国”等用语。“真诚”调整为“按真理”，较贴近“in fear and truth”的真理/真实行事维度；“贪欲、贪财”继续分别表达两个并列项目。
  issues:
  - severity: medium
    issue: “自己右边宝座”句法不自然，且可能误示“右边”是宝座的固有属性。
    rationale: 英语见证的“gave unto him glory and a throne on His right hand”表达赐给基督荣耀和在上帝右边的座位。改为“赐给他荣耀，并赐给他在自己右边的座位”可清楚保留该空间关系。
  - severity: medium
    issue: “不以拳脚还拳脚”把 blow 限缩为拳脚攻击。
    rationale: blow 指一次击打，未限定使用拳或脚；“不以打还打”在现代汉语中自然，且不增加原文没有的具体方式。
  - severity: low
    issue: “束上腰”不是现代汉语的常规搭配。
    rationale: “束紧腰带”准确保留整装待发的古代身体意象，并可由脚注说明其比喻含义。
  - severity: low
    issue: “真诚”略偏主观诚意，未充分呈现 truth 的真理/真实行事维度。
    rationale: “怀着敬畏，按真理事奉上帝”在中文中通顺，并较完整保留并列概念。
