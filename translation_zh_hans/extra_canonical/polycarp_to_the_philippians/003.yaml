base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/003.yaml
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
translation:
  language: zh_hans
  text: '所以，你们要束紧腰间的衣服[a]，以敬畏和真诚事奉上帝；要离弃虚妄空洞的言谈和众人的谬误，因为你们信了那使我们的主耶稣基督从死人中复活、又赐给他荣耀和在自己右边的王座的上帝。天上地上的一切都已服在基督之下；一切有气息的受造物都事奉他。他要来审判活人死人。上帝必向那些不顺从基督的人追讨基督的血债[b]。


    那使基督从死人中复活的，也必使我们复活——只要我们遵行他的旨意，按他的诫命而行，并爱他所爱的事；远离一切不义、贪欲、贪财、恶言和假见证；不以恶报恶，不以辱骂还辱骂，不以击打还击打，也不以咒诅还咒诅。


    反要记住主教导时所说的话：“不要论断，免得你们受论断。要饶恕，你们就必蒙饶恕。要怜悯人，你们就必蒙怜悯。你们用什么量器量给人，也必用什么量器量给你们。”他又说：“贫穷的人和为义受迫害的人有福了，因为上帝的国是他们的。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “束紧腰间的衣服”是古代穿长衣者为行动而束紧衣服的说法，意思是做好准备、立即行动。
    reason: 现代读者可能不熟悉这一古代惯用语，而正文保留了原有意象。
  - marker: b
    text: “追讨……的血债”表达上帝向人追究流血的责任；本句所说的是基督的血，以及不顺从基督的人。
    reason: 中文若直译为“追讨基督的血”不够自然；此注说明“血债”是为传达原句追究责任的用语，并避免制造代词指向的不必要歧义。
  - marker: c
    text: 本段所传主的话是“贫穷的人”和“上帝的国”；没有补入“心灵”，也没有改成“天国”。
    reason: 防止读者误以为译文遗漏，并说明未将教父引文强行协调为某一福音书的常见措辞。
lexical_decisions:
- source_word: gird up your loins
  choice: 束上腰
  rationale: 保留古代整装行动的身体意象，并以脚注说明其惯用含义，避免正文过度释义。
- source_word: fear and truth
  choice: 敬畏和真诚
  rationale: “敬畏”体现面向上帝的 reverential fear；“真诚”在现代汉语中自然，同时保留忠实、真实行事的意味。
- source_word: vain and empty talking
  choice: 虚妄空洞的言谈
  rationale: 兼顾 vain 与 empty 的双重修饰，不将其缩减为一般的“闲话”。
- source_word: quick and dead
  choice: 活人死人
  rationale: 以现代汉语表达古英语 quick 的“活着的人”，并保留审判公式。
- source_word: covetousness, love of money
  choice: 贪欲、贪财
  rationale: 维持两个并列概念：前者范围较广，后者特指爱钱，避免合并。
- source_word: blow for blow
  choice: 不以拳脚还拳脚
  rationale: 用自然中文呈现身体攻击的互相报复，不把 blow 模糊为一般伤害。
- source_word: the poor
  choice: 贫穷的人
  rationale: 按所给见证直译为物质或社会处境上的贫穷，不擅自补入“心灵”。
theological_decisions:
- issue: 赐荣耀与右边宝座者的身份
  choice: 明确为上帝，并将服在其下者明确为基督
  alternative: 全段持续使用“他”，保留所有代词
  rationale: 句法关系清楚指向使耶稣复活的上帝及被高举的基督；中文若连续使用同形代词会造成非原文所必有的混乱。
- issue: “他的血”以及“不顺从他的”所指
  choice: 正文保留“他的”并加脚注说明指代张力
  alternative: 解释为“不顺从基督的人要为流基督的血向上帝交账”
  rationale: 所给见证本身存在代词指向问题，且源语言复核尚未完成；不宜在正文中排除可能解释。
- issue: 复活应许与条件句
  choice: 保留“只要我们……”的条件结构
  alternative: 把条件弱化为单纯行为劝勉
  rationale: 原见证明确使用 if；应保存应许与顺服之间的神学张力，不作体系化消解。
- issue: 登山宝训的引文形式
  choice: 按本段见证译出“贫穷的人”与“上帝的国”
  alternative: 与某一正典福音书措辞协调为“心灵贫穷的人”或“天国”
  rationale: 作者的引文形态不应被静默统一；应忠实保存本段流传的措辞。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留劝勉文体的并列节奏与经文回声；在代词会造成额外混乱处适度明示“上帝”或“基督”，但对原见证中确有可能的指代歧义则用脚注保留。由于所提供材料说明希腊文/拉丁文源语言复核尚待进行，本稿属于依据公共领域英语见证并参考审校层所作的出版草案，相关歧义未作超出证据的确定化处理。
