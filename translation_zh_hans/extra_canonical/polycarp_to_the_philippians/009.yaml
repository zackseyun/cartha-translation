review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现了本段劝勉、基督担当罪、无罪、为人忍受，以及效法其忍耐的脉络。“保证就是耶稣基督”可对应关系代词与最近的阳性名词“保证/凭据”，但中文可更顺畅地保留原文的并列结构。第二段的条件句不是让步性的“即使”，宜译为“若”。
  naturalness: 正文庄重、可朗读，但“在木头上”在现代汉语中生硬且易使人误解为普通木料；“木架上”既自然，又可在脚注说明原文的“树木/木头”措辞。“因为……而……”将末句与前句处理为中文因果连接，略遮蔽原文较独立的说明语气，宜分句处理。
  terminology: “盼望”“义”“忍耐”“荣耀”均合适。“凭据”比“保证”更能表达ἀρραβών所含保证、预付凭证的语义，也避免“我们之义的保证”过于抽象。保留“义”而不预设为“称义”是恰当的。
  issues:
  - severity: medium
    issue: “即使我们为了他的名受苦”弱化了原文的普通条件句。
    rationale: 原句意为“若/如果我们为他的名受苦”，并非着重让步或预期最坏情形；应保留条件性。
  - severity: medium
    issue: “在木头上”不符合现代中文的自然搭配。
    rationale: 该处虽应保留ξύλον（木头、树木）的传统措辞和与彼前2:24的呼应，但正文以“木架”表达受刑工具更自然；脚注可说明原文的字面用词。
  - severity: low
    issue: 末句以“因为”连入前句，且“而我们也信了这事”略显累赘。
    rationale: 原文的“他亲自给了我们这个榜样；而我们相信了这事”可在中文中以独立分句表达，既保留概括回指，也更清楚。
  revised_text: '所以，让我们不住地持守我们的盼望和我们之义的凭据；这凭据就是耶稣基督。他亲自在木架[a]上，用自己的身体担当了我们的罪；他没有犯过罪，口中也没有诡诈。可是，他为了我们忍受了一切，使我们可以在他里面活着。


    所以，让我们效法他的忍耐。若我们为他的名受苦，就让我们荣耀他。因为他亲自把这个榜样赐给了我们，而我们也相信了这事。[b]'
  revised_footnotes:
  - marker: a
    text: “木架”对应原文意为“树木、木头”的说法，指耶稣受死的十字架；此处保留了与彼得前书2:24相近的早期基督徒传统措辞。
    reason: 以现代中文自然说明受刑工具，同时保留原文用词及其经文互文。
  - marker: b
    text: “这事”可概括地指前面所宣告的基督、他的作为及所赐的榜样；原句的具体回指并不完全确定。
    reason: 保留原文指示语的概括性和可能的多重回指，不在正文中擅自消除歧义。
  revision_rationale: 修订限于语法语气、现代汉语搭配和句间关系：将让步句恢复为条件句；以“木架”替换不自然的“木头”，并在脚注保留字面及互文信息；将末句改为较清晰的独立说明。其余关键术语和神学开放性均予保留。
