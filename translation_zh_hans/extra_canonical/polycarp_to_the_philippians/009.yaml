base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
translation:
  language: zh_hans
  text: '所以，我们要不住地坚守我们的盼望，也坚守我们之义的保证；这保证就是耶稣基督。他亲自在木头[a]上，以自己的身体担当了我们的罪。他没有犯过罪，口里也没有诡诈；但他为了我们忍受了一切，好让我们在他里面活着。


    所以，我们要效法他的忍耐。即使我们为了他的名受苦，也要荣耀他，因为他亲自为我们立下了这个榜样，而我们也信了这事。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木头”指耶稣受死的十字架；这里沿用彼得前书2:24等早期基督徒传统的说法。
    reason: 帮助现代读者理解字面表达，同时保留原文用词及其经文互文。
  - marker: b
    text: “这事”也可理解为前面所宣告的基督及其榜样；原句所指较为概括。
    reason: 保留末句指示词可能涉及的多重回指，不在正文中擅自消除歧义。
lexical_decisions:
- source_word: ἀδιαλείπτως / “without ceasing”
  choice: 不住地
  rationale: 保留持续不断之意，也采用现代中文读者熟悉而庄重的表达。
- source_word: ἀρραβών / “earnest”
  choice: 保证
  rationale: 此词指担保、定金或预先给下的凭据；“保证”在正文中最自然，并以脚注保留“凭据、定金”的语义范围。
- source_word: δικαιοσύνη / “righteousness”
  choice: 义
  rationale: 避免直接译成“称义”而提前限定其神学含义；“我们之义”虽较凝练，却保留原短语的开放性。
- source_word: ξύλον / “tree”
  choice: 木头
  rationale: 保留彼得前书受难传统中的具体措辞，不在正文中直接改写为“十字架”；脚注说明所指。
- source_word: ὑπομονή / “endurance”
  choice: 忍耐
  rationale: 既涵盖在苦难中坚忍承受的意思，也符合现代中文教会及一般读者的用语。
- source_word: ὑπογραμμός / “example”
  choice: 榜样
  rationale: 表达供人照着效法的典范，比字面性的“范本”更自然。
theological_decisions:
- issue: 耶稣基督与“盼望”和“保证”的句法关系
  choice: 将“这保证就是耶稣基督”明确回接最近的“保证”
  alternative: 译作“我们的盼望和我们之义的保证，就是耶稣基督”，使基督同时与两者构成同位关系
  rationale: 希腊语关系代词与“保证”在性、数上直接呼应；当前译法依照最自然的句法关系，同时没有否认基督也是盼望的内容。
- issue: δικαιοσύνη的救恩论含义
  choice: 译为“义”
  alternative: 译为“称义”或“使我们得着义”
  rationale: 原词可涉及正直、义或称义语境；保留“义”可避免把多义词限定为某一套教义表述。
- issue: “在他里面活着”的含义
  choice: 直译为“在他里面活着”
  alternative: 译为“靠着他得生命”或“与他一同生活”
  rationale: 原表述具有联合、领域和生命来源等可能内涵，直译可保留其神学张力。
- issue: 末句“我们也信了这事”的指向
  choice: 保留概括性的“这事”并加脚注
  alternative: 解释为“我们也相信了他”或“我们也接受了这个榜样”
  rationale: 原句中指示词的具体所指并非完全确定，不宜在正文中强行锁定。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。正文尽量保持原段落的劝勉节奏及彼得前书受难叙事的回声。鉴于所提供材料注明源语言复核尚待完成，本稿以所附公共领域英文见证为主要起草依据，并参照该段通行希腊语措辞作谨慎校核；出版前仍宜依据指定希腊文与拉丁文校勘本复审。
