review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实传达所给英文见证的劝勉、基督承担罪、无罪受苦及效法忍耐等内容。为更贴近该段通行希腊语措辞并避免中文误解，将“保证”调整为“凭据”，将“木头”调整为“木架”；后二者仍保留原有的担保和ξύλον（tree/wood）意象，不将其过度释义。末句维持指示词所指的概括性。
  naturalness: 原稿庄重可读，但“坚守我们的盼望，也坚守我们之义的保证”重复且稍显生硬，“木头上”在现代中文中也容易被理解为普通木料。修订为“紧紧持守我们的盼望和我们之义的凭据”“在木架上”，较自然且适合朗读。条件句以“若”表达，不把原文的将来可能情形强化为让步意义。
  terminology: “义”“在他里面活着”“忍耐”“荣耀他”均可保留，避免预设特定教义框架。“凭据”适切表达ἀρραβών所含保证、预先给付之物的语义；脚注说明其语义范围。“木架”在中文基督教语境中能传达受刑工具，同时保留原文并未直接使用通常“十字架”一词的特点。
  issues:
  - severity: medium
    issue: “保证”及其重复表达略弱化ἀρραβών的具体“凭据／定金”色彩，且中文句子不够顺畅。
    rationale: 该词不只是抽象的保证，也可指作为保证而先行给出的凭据。改为“凭据”更准确自然，并以脚注保留“定金、担保”的语义范围。
  - severity: medium
    issue: “木头”在现代普通话中不自然，易被误读为材料而非受刑器具。
    rationale: “木架”既保持ξύλον的木质／树木意象及其与彼得前书2:24的呼应，也能使现代读者自然理解其所指。
  - severity: low
    issue: “即使我们为了他的名受苦”将条件句略处理为让步句。
    rationale: 原句表达“若我们为他的名受苦”的可能条件；采用“若”较贴近原句语气。
  revised_text: '所以，我们要不住地紧紧持守我们的盼望和我们之义的凭据，就是耶稣基督。他亲自在木架[a]上，以自己的身体担当了我们的罪。他没有犯过罪，口里也没有诡诈；但他为了我们忍受了一切，好让我们在他里面活着。


    所以，我们要效法他的忍耐。若我们为了他的名受苦，就要荣耀他；因为他亲自为我们立下了这个榜样，而这正是我们所信的。[b]'
  revised_footnotes:
  - marker: a
    text: “木架”直译原文的“木头／树木”；这里指耶稣受死的十字架，并沿用彼得前书2:24等早期基督徒传统的说法。
    reason: 说明该词的字面意象及所指，同时不以“十字架”取代正文中较具特色的原词表达。
  - marker: b
    text: “这”可概括地回指前面所宣告的基督、他的受苦及其所立的榜样；原句的具体所指并未明定。
    reason: 保留末句指示语的开放回指，不在正文中擅自消除歧义。
  revision_rationale: 修订主要处理中文搭配、关键词的语义准确度和条件句语气；保留原段的段落结构、劝勉语气、基督论表述及末句的概括性。鉴于任务材料说明直接源语言复核仍待完成，本审阅以提供的英文见证为基础，并仅作与通行希腊语措辞相符的谨慎调整。
