revisions:
- from: 坡旅甲和同他一起的众长老，写信给寄居在腓立比的上帝教会：愿从全能的上帝和我们的救主耶稣基督而来的怜悯与平安，多多加给你们。
  to: 坡旅甲和与他同在的众长老，写信给在腓立比寄居的上帝的教会：愿从全能的上帝和我们的救主耶稣基督而来的怜悯与平安，多多加增给你们。
  rationale: 修订仅处理属格表达和书信体措辞的自然度，保留“寄居”、长老职分称谓，以及上帝与耶稣基督在祝祷来源中的并列结构。未增添任何神学或制度性说明。
