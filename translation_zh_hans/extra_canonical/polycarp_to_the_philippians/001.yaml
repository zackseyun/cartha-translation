translation:
  language: zh_hans
  text: 坡旅甲和与他同在的众长老，写信给在腓立比寄居的上帝的教会：愿从全能的上帝和我们的救主耶稣基督而来的怜悯与平安，多多加增给你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Polycarp
  choice: 坡旅甲
  rationale: 采用现代中文基督教文献中通行的人名译法，兼顾辨识度与历史传统。
- source_word: presbyters
  choice: 长老
  rationale: “长老”准确保留早期教会职分称谓，不预先套入后世特定宗派的制度含义。
- source_word: sojourneth
  choice: 寄居
  rationale: 保留原见证文本中教会作为异乡寄居群体的意味，而不弱化为单纯的地理位置说明。
- source_word: be multiplied
  choice: 多多加给
  rationale: 再现祝祷中“增多、倍加”的语义，同时符合自然庄重的现代汉语表达。
theological_decisions:
- issue: 怜悯与平安的来源结构
  choice: 从全能的上帝和我们的救主耶稣基督而来
  alternative: 从全能的上帝、我们的救主耶稣基督而来
  rationale: 使用“和”保留两者并列的语法关系，不将“我们的救主”改作“上帝”的同位语，也不额外阐释二者关系。
- issue: 教会的寄居身份
  choice: 寄居在腓立比的上帝教会
  alternative: 在腓立比的上帝教会
  rationale: 保留“sojourneth”的神学与社会身份张力，不把它简化为中性的所在地描述。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。因希腊文及拉丁文原始材料复核尚待完成，本稿依据所提供的公版英文见证与审校层拟定；措辞避免导入后世宗派性的职制或基督论解释。
