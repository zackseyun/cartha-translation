base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/006.yaml
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
translation:
  language: zh_hans
  text: '既然知道上帝是轻慢不得的，我们就应当行事配得上他的诫命和荣耀。


    照样，执事应当在他的公义面前无可指责，作上帝和基督的执事，而不是人的执事；不诽谤人，不一口两舌，不贪爱钱财，凡事节制，有怜悯，殷勤，按着主的真理行事；这位主曾作众人的仆役[a]。因为我们若在今世蒙他喜悦，也必领受来世，正如他应许要使我们从死人中复起。我们若行事配得上他，也必与他一同作王——只要我们确实有信心。


    照样，年轻男子也必须在一切事上无可指责，把纯洁看得最要紧，并约束自己远离各样恶事。因为禁戒世上的欲望是好的；每一种欲望都与圣灵[b]争战。淫乱的人、柔弱的人[c]、与男人行污秽之事的人，都不能承受上帝的国；行为不当的人也不能。因此，应当禁戒这一切，顺服长老和执事，如同顺服上帝和基督。童贞女子必须存着无可指责、纯洁的良心行事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆役”与前文的“执事”可能对应同一个表示服事者的词，原句借此强调：基督亲自成了众人的服事者。
    reason: 保存英语见证所标示的 servant/deacon 文字呼应。
  - marker: b
    text: “圣灵”也可译作“灵”；在尚未完成希腊语直接复核的情况下，此处究竟专指圣灵，还是泛指属灵生命，仍有一定歧义。
    reason: 保留Spirit所可能具有的神学与语义张力。
  - marker: c
    text: “柔弱的人”所据古代用语含义有争议，在相关伦理清单中可能带有贬义，并可能涉及被视为女性化或在男性同性性行为中处于被动角色的人；不宜直接等同于某一种现代身份类别。
    reason: 避免以现代分类过度确定争议词义，同时向读者说明其历史语境。
lexical_decisions:
- source_word: walk / conduct ourselves
  choice: 行事
  rationale: 以现代汉语自然表达伦理性的“行走”，同时保留生活方式的含义。
- source_word: deacons / minister (deacon)
  choice: 执事／仆役
  rationale: 职分处译作“执事”；论到主服事众人时译作“仆役”，并以脚注保留同词呼应。
- source_word: double-tongued
  choice: 一口两舌
  rationale: 保留原有形象，指对不同人说相互矛盾或不真诚的话。
- source_word: presbyters
  choice: 长老
  rationale: 采用早期基督教文本中通行且中性的职分名称。
- source_word: virgins
  choice: 童贞女子
  rationale: 上下文与“年轻男子”并列，采用明确而不添入制度性身份的表达。
- source_word: future world
  choice: 来世
  rationale: 与“今世”形成简洁对照，保留末世性的时代含义。
theological_decisions:
- issue: “his”在“他的诫命和荣耀／他的公义”中的指称
  choice: 保留“他”的代词形式
  alternative: 明确写作“上帝的”
  rationale: 见证文本的近距离先行词是上帝，但代词表达可能承载原文衔接；不作不必要的重复阐释。
- issue: “every desire wages war against the Spirit”中Spirit的含义
  choice: 正文译作“圣灵”，并加脚注说明歧义
  alternative: 译作“灵”或“人的灵”
  rationale: 大写英语见证倾向圣灵，但直接希腊语复核尚未完成，故公开保留另一可能。
- issue: 争议性的性伦理术语
  choice: 分别译作“淫乱的人、柔弱的人、与男人行污秽之事的人”
  alternative: 合并或使用现代身份类别
  rationale: 不把古代行为／道德术语改写为现代性取向身份；同时不掩盖措辞的尖锐与不确定性。
- issue: “as to God and Christ”的比较强度
  choice: “如同顺服上帝和基督”
  alternative: “把他们当作上帝和基督”
  rationale: 保留顺服方式上的类比，避免将长老、执事与上帝、基督作本体等同。
- issue: “if indeed we have faith”的条件语气
  choice: “只要我们确实有信心”
  alternative: “如果我们有信心”
  rationale: 保留强调性的条件，不将其弱化为无条件保证。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。正文以所供公共领域英语见证及经审核的英语POB为暂定依据；资料明确注明希腊文／拉丁文源语复核尚待完成，因此对文字游戏、Spirit及争议性性伦理词汇以脚注公开不确定性，不作宗派化协调。
