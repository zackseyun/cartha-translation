review_pass:
  verdict: revise
  source_fidelity: 草稿整体准确反映本段的劝勉结构、教会职分用语及末世盼望。仍有数处可依希腊语措辞作更贴切的处理：θεὸς οὐ μυκτηρίζεται宜译为“上帝是不可嘲弄的”；ὃς ἐγένετο διάκονος πάντων中的διάκονος应与前文“执事”保留词汇呼应；πνεύματος未带定冠词，正文不宜未经说明定为“圣灵”；μαλακοί及ἀρσενοκοῖται均须避免以现代身份范畴或超出字面范围的定论翻译。
  naturalness: 原文庄重流畅，但“轻慢不得”“从死人中复起”“把纯洁看得最要紧”稍显口语化或不够贴合本段文体。“是上帝和基督的执事，不是人的执事”“使我们从死人中复活”“首先顾念纯洁”更自然、清楚。
  terminology: “执事”“长老”“来世”“童贞女子”均可保留。“仆役”会削弱διάκονος在同一句内与前文职分名称的刻意呼应，宜统一为“执事”并以脚注说明此处指服事者。“柔弱的人”易在现代汉语中被理解为性格软弱；改为较保留原词外延的“柔弱者”，并将相邻术语一并置注说明。
  issues:
  - severity: medium
    issue: “圣灵”将πνεύματος作了单一确定解释。
    rationale: 该希腊词此处未带定冠词；英语见证的“Spirit”虽倾向专指圣灵，但不能取代源语的歧义。正文宜译“灵”，脚注交代可能的专指理解。
  - severity: medium
    issue: “仆役”没有充分保存διάκονος的重复和文字呼应。
    rationale: 作者先称教会职分者为διάκονοι，继而称主“成了众人的διάκονος”。正文统一“执事”可保留源语修辞，脚注说明后者的服事含义。
  - severity: medium
    issue: “柔弱的人、与男人行污秽之事的人”分别过宽及加入了“污秽”这一解释性评价。
    rationale: μαλακοί和ἀρσενοκοῖται的历史语义与具体所指存在争议。“柔弱者、与男子同寝者”较接近字面，并须用脚注避免将其等同为现代身份类别或作过度限定。
  - severity: low
    issue: 若干中文表达可更准确且更合本段庄重语体。
    rationale: “不可嘲弄”“使我们从死人中复活”“首先顾念纯洁”“如果我们确实有信心”分别更贴合原文及条件语气。
  revised_text: '既然知道上帝是不可嘲弄的，我们就应当行事配得上他的诫命和荣耀。


    照样，执事应当在他的公义面前无可指责，作为上帝和基督的执事，不是人的执事；不诽谤人，不一口两舌，不贪爱钱财，凡事节制，满有怜悯，殷勤，按着主的真理行事；这位主成了众人的执事[a]。因为我们若在这今世使他喜悦，也必领受来世，正如他应许使我们从死人中复活。我们若行事配得上他，也必与他一同作王——如果我们确实有信心。


    照样，年轻男子也必须在一切事上无可指责，首先顾念纯洁，并约束自己远离各样恶事。因为禁戒世上的情欲是好的；每一种情欲都与灵[b]争战。淫乱者、柔弱者、与男子同寝者[c]都不能承受上帝的国；行不正当之事的人也不能。因此，应当禁戒这一切，把自己顺服于长老和执事，如同顺服上帝和基督。童贞女子必须以无可指责、纯洁的良心行事。'
  revised_footnotes:
  - marker: a
    text: 此处“执事”与前文的“执事”对应同一个希腊词（διάκονος）。用在主身上时，重点是他成为众人的服事者，不必理解为他承担某一固定教会职分。
    reason: 保留源文重复用词及其服事含义，避免“仆役”遮蔽文字呼应。
  - marker: b
    text: “灵”所译希腊词可理解为圣灵，也可能较广泛地指属灵生命或属灵层面；原文形式本身未明确消除这项歧义。
    reason: 避免英语见证的大写“Spirit”替源语作单一神学判定。
  - marker: c
    text: “柔弱者”和“与男子同寝者”分别对应古代伦理清单中的两个术语（μαλακοί、ἀρσενοκοῖται）。两词的具体历史所指及适用范围均有争议；本译文保留其字面和行为性措辞，不把它们直接等同于任何现代性取向或身份类别。
    reason: 忠实呈现争议术语，同时避免过度确定其含义或使用现代分类。
  revision_rationale: 修订以可核对的希腊语用词为优先，并与英语见证的段落逻辑相符。它统一“执事”以保留διάκονος的修辞重复，将无冠词的πνεύματος译为“灵”并公开其可能所指，且以较少解释性负担的中文处理两项争议性伦理术语。其他改动仅为提高现代标准汉语的准确度、可读性和条件语气的清晰度。
