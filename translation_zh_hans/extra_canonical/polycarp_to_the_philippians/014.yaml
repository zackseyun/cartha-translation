lexical_decisions:
- source_word: ambassador
  choice: 代表……出使
  rationale: 保留受托代表群体执行使命的含义，同时避免现代常设外交官的狭义联想。
- source_word: endurance
  choice: 忍耐
  rationale: 表达在患难中持守不退的德性；较“耐心”更符合早期基督教劝勉语境。
- source_word: edification
  choice: 造就
  rationale: 采用现代华语基督教读者可理解且较为凝练的用语，指信仰与品格上的建立。
- source_word: pertaineth unto our Lord
  choice: 关乎我们主
  rationale: 保留关系范围的开放性，不擅自解释为特定教义内容。
- source_word: sure tidings
  choice: 可靠的消息
  rationale: 自然表达经过确认、值得信赖的消息。
theological_decisions:
- issue: “faith”可指主观的信靠，也可指信仰内容
  choice: 信心
  alternative: 信仰
  rationale: 现有英译见证未能消除歧义；正文采用与“忍耐”并列较自然的“信心”，但不把它扩展成具体教义体系。
- issue: “关乎我们主”与前列诸项的句法关系
  choice: 保留概括性的关系表达
  alternative: 译作“在我们主里的造就”或“关于我们主的教导”
  rationale: 不将它限制为仅修饰“造就”，也不擅自把内容解释为基督论教导。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“你们”保持复数群体指向；“伊格那丢”采用常见中文音译。句式适度拆分，以避免仿古英文长句造成生硬，同时保留原段落的委托、附信、劝益和询问消息四层内容。
