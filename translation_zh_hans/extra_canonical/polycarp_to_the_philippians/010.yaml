  naturalness: 原稿整体庄重通顺。修订后调整并列结构和指代，使“在主那里”及“与他一同受苦”的关系更自然明确；人名采用较通行的早期教会／新约汉语译名形式。
  terminology: “公义的话语”“忍耐”“信心”“公义”“现今的世代”均保留原文的伦理与神学分量，未作宗派性阐释。“一同受苦”对应 συνέπαθον 的共同受苦含义；此处关系代词在所给希腊文文本中语法上指向“主”，不宜以脚注制造未经文本支持的多重先行词歧义。
