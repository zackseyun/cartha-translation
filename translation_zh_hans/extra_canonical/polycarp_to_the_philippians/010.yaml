revisions:
- from: '所以，我劝你们众人都要顺从公义之道，并操练各样的忍耐；这忍耐，你们曾亲眼在蒙福的伊格那修、佐西摩和鲁弗身上看见，也在你们中间的其他人身上，以及保罗本人和其余使徒身上看见。


    你们深信，这些人全都没有徒然奔跑，而是在信心和公义中奔跑；他们如今在主面前，处于他们当得的位置。他们也曾与主一同受苦。[a] 因为他们所爱的不是现今的世界，而是那位为我们的缘故死了、又由上帝为我们使他复活的主。'
  to: '所以，我劝你们众人要顺从公义的话语，并操练一切忍耐；这忍耐，你们曾亲眼在蒙福的伊格那丢、佐西穆斯和鲁孚身上看见，也在其他出于你们中间的人身上看见，又在保罗本人和其余的使徒身上看见。


    你们要确信：这些人没有一个是徒然奔跑，乃是在信心和公义中奔跑；他们在主那里，处于他们所当得的位置，并且曾与他一同受苦。因为他们所爱的不是现今的世代，而是那位为我们而死、又被上帝为我们复活的。'
  rationale: 本段已有安全且必要的修订：删去无明示依据的“如今”，将“在主面前”调整为更贴近 παρὰ τῷ κυρίῳ 的“在主那里”，并将末句恢复为不额外冠以“主”的指称结构，同时保留上帝使其复活及两次“为我们”的表达。因所给希腊文文本中“与谁一同受苦”的关系代词先行词明确，删除会误导读者的歧义脚注。
