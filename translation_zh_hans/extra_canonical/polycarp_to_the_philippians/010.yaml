base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/010.yaml
  text: 'Therefore, I urge all of you to obey the word of righteousness and to practice all endurance, which you saw with your own eyes in the blessed Ignatius, Zosimus, and Rufus, and also in others who came from among you, as well as in Paul himself and the rest of the apostles;


    being convinced that none of these ran in vain, but in faith and righteousness, and that they are in their rightful place in the presence of the Lord, with whom they also suffered. For they did not love the present world, but the one who died for our sake and was raised by God for us.'
translation:
  language: zh_hans
  text: '所以，我劝你们众人要顺从公义的话语，并操练一切忍耐；这忍耐，你们曾亲眼在蒙福的伊格那丢、佐西穆斯和鲁孚身上看见，也在其他出于你们中间的人身上看见，又在保罗本人和其余的使徒身上看见。


    你们要确信：这些人没有一个是徒然奔跑，乃是在信心和公义中奔跑；他们在主那里，处于他们所当得的位置，并且曾与他一同受苦。因为他们所爱的不是现今的世代，而是那位为我们而死、又被上帝为我们复活的。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: word of righteousness
  choice: 公义之道
  rationale: “道”既可表达话语、教导，也保留其作为应当顺从之规范信息的分量；“公义”对应 righteousness，避免缩减为一般的“正确”。
- source_word: practice all endurance
  choice: 操练各样的忍耐
  rationale: “操练”自然表达持续付诸实践；“各样的忍耐”保留 all endurance 的广度，不局限为某一次患难。
- source_word: blessed
  choice: 蒙福的
  rationale: 此处是对人物的尊称，译作“蒙福的”比“有福的”更符合现代汉语中对已受苦见证者的庄重描述。
- source_word: ran not in vain
  choice: 没有徒然奔跑
  rationale: 保留早期基督教文本常见的赛跑隐喻及与保罗书信的呼应，不改写成较抽象的“没有白费努力”。
- source_word: in their due place
  choice: 处于他们当得的位置
  rationale: 保留“合宜、应得之位置”的含义，不进一步解释为天堂、荣耀等级或特定末世状态。
- source_word: the present world
  choice: 现今的世界
  rationale: 保留时间性与伦理张力，不简单译成物质世界或今生享乐。
theological_decisions:
- issue: “with whom also they suffered”中关系代词的先行词及“一同受苦”的含义
  choice: 他们也曾与主一同受苦，并加脚注提示歧义
  alternative: 他们也为主受苦；或他们也与这些见证者一同受苦
  rationale: 英语见证文本最自然地使 whom 指向“主”，但现有材料注明尚待希腊文和拉丁文传统直接复核，因此正文保留直译关系，脚注说明语义可能性，避免把“一同受苦”静默解释为仅仅“为主受苦”。
- issue: “was raised by God for us”的施事者与受事者
  choice: 由上帝为我们使他复活
  alternative: 为我们复活了
  rationale: 明确保留上帝为施事者，也保留“为我们”的受益性表达，不将被动句的神学结构弱化。
- issue: “in faith and righteousness”与奔跑的关系
  choice: 在信心和公义中奔跑
  alternative: 凭着信心、为着公义奔跑
  rationale: 保留介词短语的开放性，不把信心强定为手段，也不把公义强定为目标。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝勉语体；保留“奔跑”这一核心隐喻。人名按常见音译处理。鉴于用户所供材料明确标示原始语言复核待定，本稿属于依据公共领域英语见证形成的审慎暂定稿，未声称完成希腊文与拉丁文校勘。
