base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/005.yaml
  text: 'But the love of money is the beginning of all troubles. Therefore, knowing that we brought nothing into the world and cannot carry anything out, let us arm ourselves with the armor of righteousness, and let us first teach ourselves to walk in the commandment of the Lord;


    and then teach our wives also to walk in the faith that has been given to them, and in love and purity, cherishing their own husbands in all truth, loving everyone equally in all chastity, and training their children in the discipline of the fear of God.


    Our widows must be sober-minded concerning the faith of the Lord, interceding without ceasing for everyone, abstaining from all slander, evil speaking, false witness, love of money, and every evil thing. They know that they are God’s altar, that all sacrifices are carefully inspected, and that nothing escapes him—neither their thoughts, their intentions, nor any of the secret things of the heart.'
translation:
  language: zh_hans
  text: '4 但贪爱钱财是一切祸患的开端。因此，我们既知道自己没有带什么到世上来，也不能带什么离开，就当以公义的军装武装自己，并且先教导自己遵行主的诫命。


    然后，也要教导我们的妻子照着所赐给她们的信心而行，活在爱与纯洁中，以完全的忠诚爱护自己的丈夫，又以全然贞洁的心平等地爱众人，并在敬畏上帝的教养中训练儿女。


    我们中间的寡妇，在主的信仰上应当谨慎自守，不住地为众人代求，远离一切诬蔑、恶言、假见证、贪财和各样恶事。她们知道自己是上帝的祭坛，一切祭物都要经过仔细察验；无论她们的思想、意向，还是内心任何隐秘的事，都不能逃过他的鉴察。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文依据所提供的公版英文见证拟定；希腊文和拉丁文抄本传统尚待直接复核，因此若干词语的细微含义仍属暂定。
    reason: 资料明确说明源语言审查尚未完成；脚注向读者透明交代文本基础及暂定性质。
lexical_decisions:
- source_word: love of money
  choice: 贪爱钱财／贪财
  rationale: 既保留对钱财之爱的核心含义，又采用现代汉语中自然、明确的伦理用语；首句用“贪爱钱财”，列举恶事时用较简洁的“贪财”。
- source_word: beginning
  choice: 开端
  rationale: 避免把原文强化为唯一的“根源”，保留“起始、肇端”的表述。
- source_word: armor of righteousness
  choice: 公义的军装
  rationale: 保留军事隐喻及早期基督教文本的经文回声，同时符合现代中文圣经语体。
- source_word: walk
  choice: 遵行／照着……而行／活在
  rationale: 依不同宾语自然转换表达，同时保留“行事为人”的伦理含义。
- source_word: in all truth
  choice: 以完全的忠诚
  rationale: 此处修饰妻子对丈夫的态度；“忠诚”比逐字的“在一切真理中”更符合汉语搭配，但不将其收窄为单一层面的忠贞。
- source_word: sober-minded
  choice: 谨慎自守
  rationale: 兼顾清醒、节制和稳重的伦理内涵。
- source_word: altar
  choice: 祭坛
  rationale: 保留原文关于寡妇作为献祭所在之处的强烈隐喻，不改写为“祭物”或“献祭者”。
- source_word: intents
  choice: 意向
  rationale: 与“思想”和“内心隐秘的事”区分，保留内在目的或倾向之义。
theological_decisions:
- issue: “一切祸患的开端”与《提摩太前书》措辞的关系
  choice: 译作“一切祸患的开端”
  alternative: “万恶之根”或“各样恶事的根源”
  rationale: 按所给见证保留“beginning”与“troubles”的区别，不为了贴合熟知经文而改成“根”。
- issue: “所赐给她们的信心”中 faith 的范围
  choice: 保留为“所赐给她们的信心”
  alternative: “所托付给她们的信仰”
  rationale: “信心”可涵盖信靠与信仰生活；由于希腊文和拉丁文直接复核尚待完成，不把含义限定为客观教义体系。
- issue: “她们是上帝的祭坛”
  choice: 保留直陈的祭坛隐喻
  alternative: 解释为“她们的祷告如同献在上帝祭坛上的祭物”
  rationale: 原见证明确把寡妇称作上帝的祭坛；不以解释性改写消除其神学张力。
- issue: “一切祭物都要经过仔细察验”的施事者
  choice: 采用不明示施事者的被动表达
  alternative: “上帝仔细察验一切祭物”
  rationale: 所给见证以被动语态表达；中文保留这一开放性，随后再明确没有什么能逃过上帝。
- issue: 对妻子和寡妇的群体指称
  choice: 保留“我们的妻子”“我们中间的寡妇”
  alternative: 改成泛称“妻子们”“寡妇们”
  rationale: 保留书信作者与受众共同体的第一人称复数视角，同时使现代读者容易理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“公义的军装”“上帝的祭坛”等关键隐喻和经文回声；长句适度分层，但维持劝勉文体的连续性。因直接源语言复核尚待完成，本稿避免对可能有歧义的 faith、truth、altar 等词作过度教义化解释。
