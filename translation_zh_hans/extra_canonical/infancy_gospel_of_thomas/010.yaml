translation:
  language: zh_hans
  text: '在《圣萨巴抄本》第259号中，这段记载位于第16章之后。[a]


    （1）又有一次，一个青年正在把木柴劈成大小相等的木块。他劈伤了脚底，流血不止，死了。


    （2）人群顿时骚动起来，耶稣就跑到那里。他挤过人群，抓住那只受伤的脚，脚立刻痊愈了。耶稣对那青年说：“去吧，继续劈你的木柴。”


    （3）众人看见了，都十分惊奇，说：“他救了许多性命，使他们免于死亡；而且他一生的年日里，还会继续拯救所有人。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《圣萨巴抄本》第259号将本段置于第16章之后；这说明不同抄本传统中的篇章次序可能不一。
    reason: 保留见证文本提供的重要抄本编排信息。
  - marker: b
    text: 本句依据现有公共领域英语见证译出；希腊文底本尚待直接复核。“所有人”的具体所指及措辞范围仍可能因底本审校而调整。
    reason: 当前材料明确标注源语言审校尚未完成，且该句具有范围上的潜在歧义。
lexical_decisions:
- source_word: young man
  choice: 青年
  rationale: 自然、庄重地表达年龄不详的年轻男性，不额外限定其身份。
- source_word: splitting wood into equal parts
  choice: 把木柴劈成大小相等的木块
  rationale: 清楚呈现动作及“相等”的意思，符合现代汉语习惯。
- source_word: split the bottom of his foot
  choice: 劈伤了脚底
  rationale: 保留伤势由劈木动作造成以及受伤部位的信息，同时避免生硬直译。
- source_word: bled out
  choice: 流血不止
  rationale: 以自然汉语表达因大量失血而濒死或死亡的过程；下文明确说他死了。
- source_word: forcing his way through the crowd
  choice: 挤过人群
  rationale: 简洁传达耶稣穿过拥挤人群前行，不把动作误译为暴力驱赶。
- source_word: seized the stricken foot
  choice: 抓住那只受伤的脚
  rationale: “抓住”保留动作的直接和有力；“受伤的脚”准确指明对象。
- source_word: souls
  choice: 性命
  rationale: 此处与“从死亡中拯救”搭配，语境主要指人的生命，而非专门讨论灵魂本体。
- source_word: all the days of his life
  choice: 他一生的年日里
  rationale: 保留原句带有古朴色彩的时间表达，同时让现代读者易懂。
theological_decisions:
- issue: “saved many souls from death”的含义
  choice: 救了许多性命，使他们免于死亡
  alternative: 从死亡中拯救了许多灵魂
  rationale: 叙事背景是医治并使死者恢复，因此“性命”最符合具体语境；避免把“souls”无根据地限定为非物质灵魂。
- issue: “he will continue to save all”的范围
  choice: 还会继续拯救所有人
  alternative: 还会继续拯救他们所有人／还会一直救人
  rationale: 保留“所有人”的广泛措辞及其可能带来的神学张力，不擅自缩小范围；脚注说明底本审校尚待完成。
- issue: 青年已死与随即痊愈之间的叙事张力
  choice: 保留“死了”及“脚立刻痊愈了”的原有陈述
  alternative: 将“死了”弱化为“快要死了”或明说“复活了”
  rationale: 见证文本明确说青年死了，却只明言脚痊愈；译文不替作者补足或缓和这一叙事张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。句式尽量简洁，保留古代神迹故事的直接节奏。由于所提供的“原文”实为公共领域英语见证，且希腊文审校尚待进行，本稿属于来源受限的暂定出版草案；未借助宗派性术语补充文本未明说的神学含义。
