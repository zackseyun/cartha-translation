base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/008.yaml
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart understand that I am here from above, so that I may deliver those below and call them up, just as the one who sent me to you commanded me.”


    (2) Immediately, all who had fallen under his curse were saved. From then on, no one dared to provoke him.'
translation:
  language: zh_hans
  text: '（1）孩童耶稣笑着说：“现在，愿不能生育的结出果实，瞎眼的看见，心里愚昧的得以明白：我从上面来到这里，为要解救下面的人，召他们上去，正如差我到你们这里来的那一位所吩咐我的那样。”


    （2）所有落在他咒诅之下的人立刻都得救了。从那以后，再没有人敢激怒他。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the barren
  choice: 不能生育的
  rationale: 保留所据英译中类似名词化的泛指表达，同时用现代汉语中自然且不过度限定性别的说法。
- source_word: bear fruit
  choice: 结出果实
  rationale: 保留生育与结果实之间的隐喻张力，不直接释作“生子”。
- source_word: the foolish in heart
  choice: 心里愚昧的
  rationale: 较贴近古代宗教语境中的内在认知与判断含义，并避免仅译成智力不足。
- source_word: from above
  choice: 从上面
  rationale: 保留空间意象及其可能的超越性含义，不擅自明确为“从天上”。
- source_word: those below
  choice: 下面的人
  rationale: 与“从上面”形成对应，保留原有上下空间及神学双关。
- source_word: deliver
  choice: 解救
  rationale: 可涵盖从困境、权势或审判中救出之意，又不把此处限定为某套救恩论术语。
- source_word: call them up
  choice: 召他们上去
  rationale: 保留“召”与向上运动的双重意义，不简化为“带他们升天”。
- source_word: saved
  choice: 得救了
  rationale: 保留宗教性及广义获救含义；在本段直接语境中也可指脱离咒诅的后果。
- source_word: provoke
  choice: 激怒
  rationale: 在叙事语境中自然表达招惹其发怒之意，比“挑战”更贴近所据文本。
theological_decisions:
- issue: “从上面”与“下面的人”的含义
  choice: 按上下空间意象直译
  alternative: 明确译为“从天上来……拯救地上的人”
  rationale: 所据见证文本保留含混性；不应在希腊文复核尚未完成时，把宇宙空间、来源和救恩含义固定为单一解释。
- issue: “得救”所指的范围
  choice: 保留“得救了”
  alternative: 译为“恢复了原状”或“脱离了咒诅”
  rationale: “得救”既可指即时脱离咒诅，也可能带有更宽的宗教意味；正文不消解这种张力。
- issue: 耶稣所说“差我来的那一位”
  choice: 不补明身份
  alternative: 直接译作“差我来的上帝”或“父”
  rationale: 所据文本没有在此处明说差遣者身份，因此不作神学性补足。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。因希腊文原文复核尚待完成，本稿以公开领域英译见证为暂定依据，尽量保存其平行结构、上下意象和神学含混性；没有设置脚注，因此正文中无脚注标记。
