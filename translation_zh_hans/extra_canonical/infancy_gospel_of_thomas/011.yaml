base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/011.yaml
  text: '(1) The child Jesus was about seven years old, and his mother Mary sent him to fetch water. But there was a large crowd at the cistern, and the pitcher was struck and broke.


    (2) Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. Mary saw the sign Jesus had performed. She kissed him and said, “Lord, my God, bless our child,” because they were afraid that someone might bewitch him.'
translation:
  language: zh_hans
  text: '《多马婴孩福音》第11章　耶稣用外衣盛水


    (1) 孩童耶稣大约七岁时，他母亲马利亚打发他去取水。可是蓄水池旁挤满了人，他的水罐被撞破了。


    (2) 耶稣便把身上穿的外衣展开，盛满水，带回母亲那里。马利亚看见耶稣所行的这个神迹，就亲吻他，说：“主啊，我的上帝，求你赐福给我们的孩子。”他们[a]这样说，是因为害怕有人会用邪术害他。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”所指的人，现有见证没有明确说明。
    reason: 保留原见证复数代词的真实指代不确定性，避免擅自补成马利亚、约瑟或其他人物。
lexical_decisions:
- source_word: child
  choice: 孩童
  rationale: 既保留叙事对耶稣年幼身份的强调，又符合现代汉语书面叙事语体。
- source_word: fill up water / fetch water
  choice: 取水
  rationale: 按语境表达受差遣去容器处取水的动作，避免生硬直译为“装满水”。
- source_word: water cistern
  choice: 蓄水池
  rationale: 区别于天然水井，体现储水设施；因希腊文尚待复核，暂不作更具体的设施判断。
- source_word: pitcher
  choice: 水罐
  rationale: 用普通读者易懂的器皿名称，不武断限定其材质。
- source_word: cloak
  choice: 外衣
  rationale: 自然表达穿在身上的披覆衣物，并保留其被展开盛水这一奇异动作。
- source_word: sign
  choice: 神迹
  rationale: 本段所指是彰显超常能力的行动；“神迹”在现代中文宗教叙事中自然，同时没有增加原文未明说的机制。
- source_word: bewitch
  choice: 用邪术害
  rationale: 表达以巫术或咒术加害的含义；“蛊惑”在现代汉语中多指迷惑思想，不合此处。
theological_decisions:
- issue: 马利亚祷告中的称呼对象
  choice: “主啊，我的上帝，求你赐福给我们的孩子。”
  alternative: 把“主，我的上帝”理解为对耶稣的称呼
  rationale: 保留引语的句法张力，不把祷告对象擅自认定为耶稣，也不借标点消除其潜在歧义。
- issue: “sign”的译法
  choice: 神迹
  alternative: 征兆／记号
  rationale: 在这一神奇事件的叙事语境中，“神迹”最易懂；但不进一步解释其基督论意义。
- issue: 末句复数主语的指代
  choice: 保留“他们”并加注
  alternative: 具体译成“马利亚和约瑟”或只译成“马利亚”
  rationale: 所提供见证没有明确说明复数代词包括哪些人，不应补入文本未交代的人物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。译稿依据所提供的公版英语见证拟定；希腊文手稿传统尚待直接复核，因此对“蓄水池”、器皿、外衣及末句措辞均避免过度具体化。
