  naturalness: 叙事汉语总体自然、庄重。将第（1）节改为“使那些水变得洁净而美好”，既避免代词指向不明，也较完整保留并列描述；“只凭言语吩咐，并非动手而为”自然呈现见证文本刻意保留的言语/行动对比。
  terminology: “孩童耶稣”“安息日”“法利赛人”“麻雀”均合适。“制作黏土”较“和泥”更贴近见证文本所指控的“made clay”，不把行为限缩为普通的搅拌泥水。保留“活物”这一比较性措辞，不将其解释为复活或创造。
