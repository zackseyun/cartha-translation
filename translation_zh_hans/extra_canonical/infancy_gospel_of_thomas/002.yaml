base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/002.yaml
  text: '(1) The child Jesus was five years old. After it rained, he was playing at the ford of a flowing stream. He stirred up the muddy water, gathered it into pools, and made it clean and excellent, commanding it by his word alone—and not by any action.


    (2) Then he took soft clay from the mud and shaped twelve sparrows from it. But it was the Sabbath when he did these things, and many children were with him.


    (3) A certain Jew saw the child Jesus doing these things with the other children. He went to Joseph, Jesus’ father, and slandered the child Jesus, saying, “He made clay on the Sabbath, which is not permitted, and shaped twelve sparrows.”


    (4) Joseph went and rebuked Jesus, saying, “Why are you doing these things on the Sabbath?”


    But Jesus clapped his hands and, with a shout in front of everyone, commanded the birds, saying, “Go, take flight like living beings!” The sparrows took flight and went away, squawking.


    (5) When the Pharisee saw this, he was amazed and reported it to all his friends.'
translation:
  language: zh_hans
  text: '（1）孩童耶稣五岁的时候，一场雨后，他在一条溪流的浅滩上玩耍。他搅动浑浊的水，把水汇集成池，又使水变得清澈而洁净；他单凭一句话发令，并没有动手去做。


    （2）随后，他从泥中取了柔软的黏土，捏成十二只麻雀。那天正是安息日；他做这些事时，还有许多孩子和他在一起。


    （3）有一个犹太人看见孩童耶稣和其他孩子一起做这些事，就到他父亲约瑟那里诋毁他，说：“他竟在安息日和泥，这是不许可的，还捏了十二只麻雀。”


    （4）约瑟便去责备耶稣，说：“你为什么在安息日做这些事？”


    耶稣却拍了拍手，当着众人高声吩咐那些鸟说：“去吧，像活物一样飞起来！”那些麻雀就飞了起来，啾啾叫着离去了。


    （5）那个法利赛人[a]看见这事，十分惊奇，就把这事告诉了他所有的朋友。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 前文称此人为“一个犹太人”，这里则称他为“那个法利赛人”。译文保留所据见证文本中的称谓变化。
    reason: 提示读者注意叙事中的身份称谓不一致，避免译文暗中统一。
lexical_decisions:
- source_word: ford
  choice: 浅滩
  rationale: 指溪流中水浅、可涉过之处；比音译或泛称“河边”更准确自然。
- source_word: dirty waters
  choice: 浑浊的水
  rationale: 上下文是雨后泥水，用“浑浊”比带道德色彩的“污秽”更贴切。
- source_word: clean and excellent
  choice: 清澈而洁净
  rationale: 保留两个并列的正面描述，同时用现代汉语自然表达水质的改变；“excellent”的确切希腊语依据尚待复核。
- source_word: ordering them by word alone
  choice: 单凭一句话发令
  rationale: 保留以言语施令的重点，不将其扩展为特定创造论术语。
- source_word: soft clay
  choice: 柔软的黏土
  rationale: 符合塑形语境，也区分一般泥土与可捏塑的黏土。
- source_word: sparrows
  choice: 麻雀
  rationale: 传统且直接的鸟名对应。
- source_word: slandered
  choice: 诋毁
  rationale: 保留叙述者对告发行为的负面判断，强于中性的“报告”。
- source_word: squawking
  choice: 啾啾叫着
  rationale: 以自然汉语表达小鸟飞走时的鸣叫；避免使用通常形容大型鸟类或刺耳声音的“嘎嘎”。
theological_decisions:
- issue: 耶稣使水洁净的方式
  choice: “单凭一句话发令，并没有动手去做”
  alternative: “只用话命令，而不是用行为命令”
  rationale: 英文见证文本的对举略显生硬；译文保留言语与动作的对比，但不额外解释其神学意义。
- issue: 安息日行为的性质
  choice: “和泥，这是不许可的”
  alternative: “制作黏土，这是不合法的”
  rationale: “和泥”在语境中自然地表达被指控的操作；“不许可”保留规则性判断，不将其强化为正式法律定罪。
- issue: 麻雀获得生命的表述
  choice: “像活物一样飞起来”
  alternative: “活过来飞走吧”
  rationale: 保留见证文本中的比较表达，不直接断言其措辞是“使之复活”或“赋予生命”，从而保存原有张力。
- issue: 告发者身份从“犹太人”转为“法利赛人”
  choice: 正文照见证文本保留变化，并加注说明
  alternative: 统一称为“那个犹太人”或“那个法利赛人”
  rationale: 不擅自消除文本内部的身份变化，也不武断断定两者必为同一身份标签。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“孩童耶稣”保留古代作品的称呼特点；直接引语力求简洁有力。由于所提供材料明确说明希腊语复核尚待完成，本稿以公共领域英文见证及经审校的英文POB为暂定依据，没有假称已完成直接希腊语校勘。
