translation:
  language: zh_hans
  text: '（1）约瑟对耶稣说：“你为什么说这样的话，使他们受苦，也使他们恨我们呢？”


    孩子对约瑟说：“既然你懂得智慧之言，就不会不知道这些话从何而来；这些话是论到一个五岁孩子说的。[a] 他们不会再起来，而这些人将受到惩罚。”[b]


    那些控告他的人立刻都瞎了眼。


    （2）约瑟揪住耶稣的耳朵，用力拉扯。


    （3）耶稣对他说：“你寻找我，也找到了我，这对你已经够了；不要再因自己承受了与生俱来的无知而鞭打我。[c] 你还没有清楚看出我为什么属于你。[d] 看哪！我已经顺服在你面前了。”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些话是论到一个五岁孩子说的”在现有见证中措辞突兀，可能反映文本传承或断句问题；希腊文复核尚待进行。
    reason: 标明来源材料自身的难句，避免中文译文造成虚假的确定性。
  - marker: b
    text: “他们”与“这些人”分别指谁并不完全清楚；“再起来”也可能有恢复、起身或复起等含义。
    reason: 保留代词指向和关键动词的真实歧义。
  - marker: c
    text: 本句原见证极难理解；“因自己承受了与生俱来的无知”只是暂译，也可能有不同的句法关系。
    reason: 直接源语言审查尚未完成，不能把暂定句法包装成定论。
  - marker: d
    text: “我为什么属于你”也可理解为“我为何是你的”之类的关系陈述；具体含义不确定。
    reason: 避免把含混的所属关系限定为某一神学解释。
  - marker: e
    text: “顺服在你面前”所据词句也可能表示受制、被制服或受到约束。
    reason: 提示结句的语义范围及暂定译法。
lexical_decisions:
- source_word: wise words
  choice: 智慧之言
  rationale: 采用庄重而自然的表达，并保留其可能指智慧格言或奥秘言语的宽泛含义。
- source_word: they won’t be raised
  choice: 他们不会再起来
  rationale: 保留“起来”可能指恢复、起身或复起的歧义，不擅自解释为死亡或复活。
- source_word: became blind
  choice: 都瞎了眼
  rationale: 直接呈现叙事中的身体失明，符合现代汉语叙事习惯。
- source_word: pulled hard
  choice: 用力拉扯
  rationale: 明确动作力度，同时避免添加原文未说明的持续时间或伤害程度。
- source_word: subdued
  choice: 顺服在你面前
  rationale: 表达受约束、居于对方权下的意思；以脚注提示该难句仍可能有其他理解。
theological_decisions:
- issue: “这些话从何而来”的所指
  choice: 保留“从何而来”的间接说法
  alternative: 明确译为来自上帝、智慧或耶稣自己
  rationale: 现有见证没有明说来源，且尚待希腊文复核，不加入来源方面的神学判断。
- issue: “他们不会再起来”的含义
  choice: 按字面保留“不会再起来”
  alternative: 译为“不会复活”或“不能康复”
  rationale: 避免将可能的叙事情节含义定为末世复活或永久死亡。
- issue: 耶稣与约瑟的关系
  choice: 译作“我为什么属于你”
  alternative: 译作“我为何是你的儿子”或“你为何拥有我”
  rationale: 保留原见证中关系表述的张力，不明确断定生物学父子关系或所有权。
- issue: “与生俱来的无知”的归属
  choice: 依现有英语见证处理为约瑟所承受的无知
  alternative: 理解为耶稣取了天然无知，或泛指人的天然无知
  rationale: 句法极难，正文给出可读的暂定方案，并用脚注明确不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。因所供材料明确说明希腊文审查尚待进行，本稿属于基于公共领域英语见证的暂定译文；对代词、关系表述和第三段的破损或艰难句法均以脚注保留不确定性。
