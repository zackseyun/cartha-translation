review_pass:
  verdict: revise
  source_fidelity: 需修订。“有人正在建造一座房屋”将原文非人称的“有一座建筑正在建造”具体化为有人施工，并将未明示种类的建筑限定为“房屋”。末句“施救”虽可理解，却未充分表达“save”的持续性及隐含受事者。其余叙事顺序、死人复起和群众宣告均与所给英文见证相符。由于所提供材料是英文见证而非希腊文原文，相关判断仍属暂定。
  naturalness: 整体庄重自然。改为“有一座建筑正在施工”更符合原文的不定表达；“看见一个人倒在那里，已经死了”比“看见一个人死了，躺在地上”更顺畅。以“人哪”保留呼语，并以“还要在他一生的日子里继续拯救人”自然表达未来持续动作。
  terminology: “向他下拜”配合说明“敬拜”的脚注，恰当地保留 worshipped 的动作性与宗教性两种可能。“性命”在死而复起的直接语境中可取；脚注保留“灵魂”的可能。将“房屋”改为“建筑”避免无依据的限定。
  issues:
  - severity: medium
    issue: 将未指明种类的建筑译为“房屋”，并补出“有人”作为建造者。
    rationale: 所给见证仅称“a building was being constructed”，是非人称表达，未说明建筑种类或施工者；译文不宜作此具体化。
  - severity: low
    issue: “他一生的年日都要继续施救”表达略生硬，且“施救”未显出隐含的受事者。
    rationale: 原文是对其一生持续“拯救”的预测；以“还要在他一生的日子里继续拯救人”更自然且保留其范围。
