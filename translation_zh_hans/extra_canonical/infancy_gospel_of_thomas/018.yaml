base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/018.yaml
  text: '(1) After some time, a building was being constructed. There was a great commotion, and Jesus got up and went there.


    When Jesus saw a man lying dead, he took the man’s hand and said, “I tell you, man, rise and do your work.” The man immediately rose and worshiped him.


    (2) The crowd saw this and was amazed. They said, “This child is from heaven, for he has saved many souls from death, and he will continue to save throughout all the days of his life.”'
translation:
  language: zh_hans
  text: '（1）过了一段时间，有人正在建造一座房屋。那里一片骚动，耶稣便起身到那里去。


    他看见一个人死了，躺在地上，就拉住那人的手，说：“我告诉你，起来，做你的工吧！”那人立刻起来，向他下拜。[a]


    （2）众人看见了，都很惊奇，说：“这孩子是从天上来的，因为他已经救了许多性命脱离死亡，并且他一生的年日都要继续施救。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”也可理解为“敬拜”；底本文词可涵盖俯伏致敬或宗教性的敬拜。
    reason: 保留该动作在叙事和神学上的语义幅度。
  - marker: b
    text: 本译文依据希腊抄本传统的一份公版英文译本暂译；尚待直接核对希腊文抄本。“性命”所对应的词也可译作“灵魂”。
    reason: 明确当前底本限制，并交代关键名词的另一种可能译法。
lexical_decisions:
- source_word: building
  choice: 一座房屋
  rationale: 此处可指正在施工的建筑物；按上下文译作“房屋”较自然，但底本未明确建筑种类。
- source_word: great commotion
  choice: 一片骚动
  rationale: 保留现场发生重大扰动或喧闹的含义，不具体断定骚动原因。
- source_word: seized/took his hand
  choice: 拉住那人的手
  rationale: 兼顾动作的主动、有力色彩与现代汉语的自然表达。
- source_word: worshipped
  choice: 向他下拜
  rationale: 该词既可表示敬拜，也可表示俯伏致敬；“下拜”保留动作及语义上的开放性，避免预先裁定其神学性质。
- source_word: souls
  choice: 性命
  rationale: 上下文谈的是使人免于死亡，译作“性命”比现代汉语中的“灵魂”自然，也避免加入灵魂得救的特定神学含义。
- source_word: save
  choice: 救……脱离死亡／施救
  rationale: 首处明确死亡语境，后处用“施救”承接，同时保留未来持续拯救的陈述。
theological_decisions:
- issue: 那人对耶稣所作动作的性质
  choice: 向他下拜
  alternative: 敬拜他
  rationale: 见证文本的“worshipped”可能涵盖敬拜或尊崇性的俯伏；译文不把这一动作单义化。
- issue: “许多 souls”所指
  choice: 许多性命
  alternative: 许多灵魂
  rationale: 本段直接语境是从死亡中救回人命；采用“性命”保留叙事重点，不引入关于死后灵魂得救的额外主张。
- issue: “从天上来的”身份宣告
  choice: 直译为“从天上来的”
  alternative: 属天的／由上帝差来的
  rationale: 不把群众的话进一步解释为本体论身份或差遣公式，保留原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句式尽量简洁，保留古代叙事的重复和群众宣告。由于尚未直接复核希腊文，本稿为依据所提供公版英文见证所作的暂定译文。
