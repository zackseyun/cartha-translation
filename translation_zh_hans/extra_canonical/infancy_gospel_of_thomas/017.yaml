translation:
  language: zh_hans
  text: '《多马婴孩福音》第17章　耶稣使一个婴孩复生[a]


    （1）这些事以后，约瑟家附近有一个婴孩病死了。他母亲悲痛大哭。


    耶稣听见那里悲痛万分，一片骚动，就赶紧跑去。他见孩子已经死了，便摸着孩子的胸口，说：“婴孩，我对你说：不要死，要活过来，和你母亲在一起。”


    婴孩立刻抬眼看他，并且笑了。耶稣对他母亲说：“抱起你的孩子，给他吃奶，也要记得我。”


    （2）站在那里的众人都很惊奇，说：“这孩子确实是神，或是天使，因为他说的每一句话都会成为事实！”[b]


    随后，耶稣又离开那里，去和孩子们玩耍。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章译文暂依据所供公版英文见证拟定；希腊文手稿传统尚待直接复核。
    reason: 透明说明当前底本限制，避免把暂定译文呈现为已经完成原文校勘的定稿。
  - marker: b
    text: “是神，或是天使”是现场众人的惊叹；叙述本身没有在这里裁定这两个说法。
    reason: 帮助读者保留说话者层次和原句的不确定性，而不代替正文作教义判断。
lexical_decisions:
- source_word: baby / child（所供英文见证）
  choice: 婴孩／孩子
  rationale: 叙事开头和耶稣的直接称呼用“婴孩”，突出其年幼；后文按现代汉语自然表达改用“孩子”，指称对象不变。
- source_word: touched his chest（所供英文见证）
  choice: 摸着孩子的胸口
  rationale: 保留动作及身体部位，不将其解释为医治仪式或其他特定象征。
- source_word: live（所供英文见证）
  choice: 活过来
  rationale: 上下文明确说孩子已经死去；“活过来”在现代汉语中自然呈现由死复生的语境，同时不增添复活术语。
- source_word: remember me（所供英文见证）
  choice: 记得我
  rationale: 保留原话简洁而开放的含义，不扩展为敬拜、纪念礼仪或传扬。
- source_word: a god or an angel（所供英文见证）
  choice: 是神，或是天使
  rationale: 保留群众判断中的二选一及其神学张力，不把两者合并，也不替叙述者确认其判断。
- source_word: every word becomes a deed（所供英文见证）
  choice: 他说的每一句话都会成为事实
  rationale: 用自然汉语表达话语立即产生实际结果的意思；避免生硬直译为“成为行为”。
theological_decisions:
- issue: 婴孩由死亡转为存活的叙述性质
  choice: 明确译为“已经死了”与“活过来”
  alternative: 弱化为昏迷后苏醒或病得将死
  rationale: 所供见证明确两次陈述死亡，不能以自然主义解释削弱叙事。
- issue: 群众称耶稣为“神，或是天使”
  choice: 作为群众的直接引语完整保留
  alternative: 改成“来自神”或直接断言耶稣就是神
  rationale: 原叙事把这句话归于惊奇的群众，且保留“或”的不确定性；译文不替群众消除歧义，也不把其话语提升为叙述者的定论。
- issue: “记得我”的宗教含义
  choice: 不作教义性展开
  alternative: 译为“要纪念我”“要信靠我”或“要敬拜我”
  rationale: 在缺乏直接希腊文本复核和更明确语境的情况下，应保留宽泛含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留古代叙事的简洁推进，但避免过度仿古。“悲痛万分，一片骚动”“赶紧跑去”等表达力求自然；结尾“去和孩子们玩耍”保留神迹叙事后突转日常童年活动的张力。由于尚未完成希腊文直接复核，所有词汇判断均明确以所供英文见证为暂定依据。
