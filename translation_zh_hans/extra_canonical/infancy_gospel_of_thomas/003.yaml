    (2) But having seen what had happened, Jesus said to him, “Your fruit (will have) no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) And immediately that child withered away.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/003.yaml
  text: '(1) Annas the high priest’s son said to him, Jesus, “Why are you doing such a thing on the Sabbath?” Then he took a willow twig, destroyed the pools, drained the water Jesus had gathered, and dried up their gatherings.


    (2) But when Jesus saw what had happened, he said to him, “Your fruit will have no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) Immediately, that child withered away.'
translation:
  language: zh_hans
  text: '（1）大祭司亚那的儿子对耶稣说：“你为什么在安息日做这样的事？”随后，他拿起一根柳条，毁坏了那些水池，把耶稣聚集的水放掉，使那些积水都干涸了。[a]


    （2）耶稣看见所发生的事，就对他说：“你的果实必没有根；你的嫩枝必枯萎，如同狂风中被烤焦的枝条！”[b]


    （3）那孩子立刻枯萎了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使那些积水都干涸了”所据英文见证直译为“使它们的聚集干涸了”，具体所指不甚明确；这里按上下文理解为聚集在水池中的水。希腊语原文复核尚待完成。
    reason: 交代现有见证中“their gatherings”的真实歧义，避免把暂定理解伪装成确定读法。
  - marker: b
    text: “必没有根”和“必枯萎”也可理解为带有预言色彩的咒诅表达；译文保留其植物意象，不限定“果实”和“嫩枝”具体象征什么。
    reason: 保存隐喻的多义性及话语在预告与施行之间的神学张力。
lexical_decisions:
- source_word: Annas the high priest
  choice: 大祭司亚那
  rationale: 采用现代汉语圣经语体中常见的人名译法，并保留原见证所表达的身份关系。
- source_word: willow twig
  choice: 一根柳条
  rationale: 直译植物与物件意象，措辞自然明确。
- source_word: pools
  choice: 水池
  rationale: 指耶稣所造、用来蓄水的小池；译作“水池”兼顾可懂度与原文场景。
- source_word: their gatherings
  choice: 那些积水
  rationale: 结合上下文理解为聚集在池中的水，但现有英文见证用语含混，故以脚注说明暂定性质。
- source_word: fruit / root / shoot
  choice: 果实／根／嫩枝
  rationale: 保留同一植物隐喻中的各个对应意象，不将咒语解释性改写为死亡判语。
- source_word: withered away
  choice: 枯萎了
  rationale: 保留与上一节植物意象相呼应的动词及其突兀效果。
theological_decisions:
- issue: 耶稣话语的性质与后果
  choice: 按见证直陈咒诅式话语及孩子随即枯萎
  alternative: 弱化为预言、疾病或象征性描述
  rationale: 文本本身让话语与结果紧密相连，但未明确说明因果机制；译文不作神学辩护，也不额外界定。
- issue: “果实、根、嫩枝”的指涉
  choice: 保留植物隐喻，不明确解释为后代、生命或善行
  alternative: 将隐喻具体化为“你必断子绝孙”或“你的生命必枯干”
  rationale: 现有证据不能排除多重指涉，具体化会消除原有张力与歧义。
- issue: 安息日质问
  choice: 保留“在安息日做这样的事”
  alternative: 解释为违反安息日律法
  rationale: 说话者只提出质问，文本没有在此明确裁定耶稣的行为是否违法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。叙事简洁，保留“果实—根—嫩枝—枯萎”的连续植物意象。由于所供材料注明希腊语复核尚待完成，本稿明确以公共领域英文见证为暂定依据，对关键含混处加注，而不声称已完成直接原文校勘。
