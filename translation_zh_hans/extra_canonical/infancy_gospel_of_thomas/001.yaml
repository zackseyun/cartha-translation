translation:
  language: zh_hans
  text: 我，以色列人多马，认为有必要把我们的主耶稣基督出生在我们伯利恒地区以后，在拿撒勒村所做的一切，告诉所有外族的弟兄姊妹。事情从这里开始：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英语见证翻译；希腊文手稿传统的直接复核尚待完成。
    reason: 如实标明当前译稿的文本依据与局限，避免把英语见证误作已核定的希腊原文。
lexical_decisions:
- source_word: Thomas the Israelite
  choice: 以色列人多马
  rationale: 保留人物自称的族群身份，并采用现代中文常见的人名语序。
- source_word: Gentile brothers (and sisters)
  choice: 外族的弟兄姊妹
  rationale: “外族”保留相对于以色列人的族群含义；“弟兄姊妹”明确传达括号中兼指男女的表达。
- source_word: our Lord Jesus Christ
  choice: 我们的主耶稣基督
  rationale: 沿用早期基督教文献中庄重且通行的称谓，不额外解释其神学含义。
- source_word: village of Nazareth
  choice: 拿撒勒村
  rationale: 保留原见证文本中的村落称谓，不泛化为城镇。
- source_word: our region of Bethlehem
  choice: 我们伯利恒地区
  rationale: 保留“我们”及地域表达；由于希腊文复核尚待完成，不把region具体化为某种行政区划。
- source_word: This is the beginning
  choice: 事情从这里开始
  rationale: 以自然现代汉语呈现叙事引入语，同时保留其开启下文的功能。
theological_decisions:
- issue: “弟兄（和姊妹）”的涵盖范围
  choice: 弟兄姊妹
  alternative: 弟兄们
  rationale: 依据所提供见证明确呈现男女均包括在内，避免现代中文读者误以为只指男性。
- issue: 伯利恒出生与拿撒勒事迹之间的关系
  choice: 保留“出生在我们伯利恒地区以后，在拿撒勒村所做”的时地结构
  alternative: 改写为更协调传统叙事的表述
  rationale: 不以其他福音传统来修整本篇自身的陈述，保留其可能存在的历史与叙事张力。
- issue: 资料基础的权威程度
  choice: 以暂定译文呈现，并用脚注说明尚未直接复核希腊文
  alternative: 按已完成希腊文校勘的方式定稿
  rationale: 用户提供的 drafting_basis 明示直接源语审查尚待完成，因此不应假称已经完成原文校勘。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。句序略作汉语化处理，以清楚表达耶稣出生于伯利恒地区之后、在拿撒勒村所行之事。因缺少可直接审查的希腊文本，本稿不对潜在的原文歧义作超出英语见证的断定。
