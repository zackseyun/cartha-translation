    issue: 第（3）节“孩子回到父母家中”可能造成归属关系含混。
    rationale: 英文见证为“went into his house to his parents”，即孩子回到自己的家、到父母那里；“父母家中”可被读作父母独立拥有的住处，未充分呈现原叙事的动作。
