base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/014.yaml
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
translation:
  language: zh_hans
  text: '（1）约瑟看出耶稣有智慧和悟性。他不愿耶稣不识字，就把他交给另一位老师。


    老师为耶稣写下字母表，对他说：“念阿尔法[a]。”


    （2）孩子说：“你先告诉我贝塔[b]是什么，我就告诉你阿尔法是什么。”


    老师恼怒起来，打了他。耶稣咒诅老师，老师便倒地死了。


    （3）孩子回到父母家中。约瑟叫来耶稣的母亲，吩咐她不要让耶稣出门，免得激怒他的人死去。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿尔法”是希腊字母表的第一个字母。
    reason: 帮助现代中文读者理解教学场景。
  - marker: b
    text: “贝塔”是希腊字母表的第二个字母。
    reason: 说明孩子所问字母与“阿尔法”的次序关系。
lexical_decisions:
- source_word: wisdom and understanding
  choice: 智慧和悟性
  rationale: 保留两个并列概念；“悟性”自然表达理解、领会的能力，又避免把二者合并成一个意思。
- source_word: unacquainted with letters
  choice: 不识字
  rationale: 在现代汉语中自然表达未受基本文字教育；结合下文的希腊字母教学，语境清楚。
- source_word: gave him over to another teacher
  choice: 把他交给另一位老师
  rationale: 保留托付给另一位教师教导的动作，不额外补入原文未明说的学校制度。
- source_word: cursed him
  choice: 咒诅老师
  rationale: 直陈叙事中的强烈行为，不弱化为“责备”，也不解释咒诅与死亡之间的机制。
- source_word: those who provoke him
  choice: 激怒他的人
  rationale: 保留“招惹、激怒”与后果之间的张力，不把对象缩限为老师。
theological_decisions:
- issue: 耶稣的咒诅与老师死亡之间的因果关系
  choice: 按见证文本并列叙述：“耶稣咒诅老师，老师便倒地死了”
  alternative: 增译为耶稣直接使老师死亡，或淡化为二者只是偶然相继发生
  rationale: “便”表达紧接发生，但不另行界定超自然因果机制，从而保留叙事本身的神学张力。
- issue: 约瑟限制耶稣出门的原因
  choice: “免得激怒他的人死去”
  alternative: 解释为保护耶稣、惩罚耶稣，或断言约瑟认定耶稣必定杀人
  rationale: 只保留文本明说的预防目的，不添加对约瑟动机或耶稣身份的教义性说明。
