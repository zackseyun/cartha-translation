translation:
  language: zh_hans
  text: '**第十六章　耶稣医治雅各被蛇咬的伤**


    （1）雅各到树林里去捆柴，好用来烤饼。耶稣也和他一起去了。他们拾柴的时候，一条可怕的蛇咬了雅各的手。


    （2）雅各瘫倒在地，眼看就要死了。孩童耶稣跑到他跟前，向伤口吹了一口气；伤口立刻痊愈，那条蛇也被毁灭了，雅各便得救了。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文抄本 Hagios Saba 259 没有第十七、十八章。因此，接下来的两章依据年代较晚的希腊文抄本。
    reason: 保留所提供英文见证的抄本说明；该说明虽涉及后续章节，仍按草稿的锚点设置在本章末。
lexical_decisions:
- source_word: grove
  choice: 树林
  rationale: 按现有英译见证表达为自然、现代的汉语；因尚待希腊语复核，不进一步限定为果园或特定林地。
- source_word: tie up sticks
  choice: 捆柴
  rationale: 简洁传达收集并捆扎枝柴的动作，也与随后用来做饼的生活场景相合。
- source_word: make bread
  choice: 做饼
  rationale: 古代语境中的 bread 不一定是现代汉语通常所指的发酵面包；“做饼”较为宽泛自然。
- source_word: terrible snake
  choice: 可怕的蛇
  rationale: 保留见证文本的强烈修饰语，不擅自明确蛇种或是否有毒。
- source_word: blew on the bite
  choice: 朝被咬的地方吹了一口气
  rationale: 保留具体动作，并以自然汉语说明吹气所向之处。
- source_word: the beast was destroyed
  choice: 那条蛇也死了
  rationale: 依上下文将 beast 的指称明确为先前的蛇；“死了”自然表达其被消灭的结果，但不补写致死机制。
- source_word: was saved
  choice: 得救了
  rationale: 保留“获救/得救”的宽广含义，使其既可指脱离死亡，也不排除叙事中的神学色彩。
theological_decisions:
- issue: 耶稣医治的方式
  choice: 保留耶稣向伤处吹气、伤处立刻痊愈的叙述
  alternative: 解释为祷告、驱邪或某种医疗行为
  rationale: 现有见证只记载吹气与即时痊愈，并未说明机制，不应加入教派性或推测性解释。
- issue: “雅各得救”的含义
  choice: 译为“雅各便得救了”
  alternative: 译为“雅各活了下来”或“雅各获救了”
  rationale: “得救”保留原句可能同时具有身体获救与神学回响的张力；上下文仍清楚表明直接所指是免于蛇咬致死。
- issue: 蛇的结局
  choice: 译为“那条蛇也死了”
  alternative: 译为“那恶兽被毁灭了”
  rationale: 上下文指称明确，现代汉语用“蛇”更清楚；不将其寓意化为撒但或邪恶势力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留短句推进和神迹叙事的直接性。由于希腊语原文复核尚未完成，本稿以公版英文见证为暂定依据，不对“grove”“beast”等词作超出上下文的细化。标题依用户所给章节主题拟定。
