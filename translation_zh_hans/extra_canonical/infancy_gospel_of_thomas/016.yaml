review_pass:
  verdict: revise
  source_fidelity: 草稿整体忠实于所提供的英文见证：树林、捆扎枝柴、蛇咬手、耶稣向咬伤处吹气、即时痊愈、蛇被毁灭及雅各获救均已涵盖。需要微调“做饼”，使枝柴作为燃料的关系在现代汉语中明确；并以“伤口”对应 bite 的受伤处。由于直接希腊文复核尚待进行，本审查不对见证中可能反映的希腊词义作超出英文依据的限定。
  naturalness: 叙事流畅、庄重且适合现代标准汉语。“好让他们做饼”在汉语中容易把柴误解为制作饼的材料；改为“好用来烤饼”更自然，也准确交代枝柴的用途。“倒在地上”虽可接受，“瘫倒在地”较贴近“sprawled out”。
  terminology: 人名“雅各”、称谓“孩童耶稣”及“得救”均可保留。“得救”在此首先指免于死亡，正文上下文已足够明确，不须加教义解释。“那条蛇也死了”传达结果，但“被毁灭了”更贴近 witness 的 destroyed，且不擅自说明毁灭方式。
  issues:
  - severity: low
    issue: “好让他们做饼”未清楚表达柴薪用途。
    rationale: 英文“tie up sticks so that they might make bread”在场景中指收集、捆扎枝柴以供烤饼；现代汉语宜明示为“好用来烤饼”。
  - severity: low
    issue: “朝被咬的地方吹了一口气”可更凝练为“向伤口吹了一口气”。
    rationale: “伤口”自然对应蛇咬造成的 bite，且不改变叙事动作或其含义。
  - severity: low
    issue: “那条蛇也死了”略弱化“was destroyed”。
    rationale: 改作“那条蛇也被毁灭了”可保留见证文本所述的被动及较强结果，而不添加机制。
