translation:
  language: zh_hans
  text: '（1）耶稣从那里与父亲约瑟同行。有一个人跑过来，撞了他的肩膀。耶稣对他说：“愿你因你的领头者受咒诅！”[a]


    那人立刻死了。


    看见他当场死去的人都惊呼说：“这孩子究竟是从哪里生的？他的话竟会成为事实！”


    （2）死者的父母看见所发生的事，就责怪耶稣的父亲约瑟，说：“不管你是从哪里得来这个孩子的，你都不能和我们同住在这个村子里。你若想留在这里，就要教他祝福人，不要咒诅人，因为我们的孩子已经被夺去了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因你的领头者”依所提供的英文见证直译；这一短语含义异常。希腊文源语复核尚待完成，因此此处不作推测性校订或解释。
    reason: 提醒读者该措辞存在真实的文本或翻译疑难，并避免把暂定读法呈现为确定含义。
lexical_decisions:
- source_word: struck his shoulder
  choice: 撞了他的肩膀
  rationale: 上下文描述奔跑中的碰撞；“撞”比“打”更自然，同时不排除动作具有冒失或伤害性。
- source_word: because of your leader
  choice: 因你的领头者
  rationale: 按所提供见证保留这一反常且意义不明的表述，不擅自改成较顺畅的咒诅语。
- source_word: his word becomes deed
  choice: 他的话竟会成为事实
  rationale: 保留“言语成为实际事件”的惊叹含义，以自然现代汉语表达。
- source_word: taken away from us
  choice: 已经被夺去了
  rationale: 保留丧子父母所说的被动、强烈措辞，而不淡化为单纯的“死了”。
theological_decisions:
- issue: 耶稣咒诅与孩子死亡之间的关系
  choice: 紧接着叙述咒诅和死亡，但不增添明确的因果连接词
  alternative: 译成“所以那人立刻死了”或“耶稣使他死了”
  rationale: 见证文本仅以“立即”连接两件事；译文保留叙事上的强烈关联，却不添加原文未明说的因果解释。
- issue: “because of your leader”的解释
  choice: 正文直译并加注说明文本疑难
  alternative: 解释为“因你的领袖”“因你的首领”或校订成另一种咒语
  rationale: 该短语异常，且希腊文源语复核尚未完成；不应以神学或叙事协调取代文本的不确定性。
- issue: 村民对耶稣身份的惊问
  choice: 译为开放式惊叹“究竟是从哪里生的”
  alternative: 将其解释为超自然来源或神圣身份的明确宣告
  rationale: 保留问题本身的惊异与含混，不替叙述者作神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“父亲约瑟”在第二段保留原文的关系说明；人物称谓不作宗派化处理。由于当前 drafting basis 是公共领域英文见证，且直接希腊文复核尚待完成，本稿属于源语审查前的暂定出版草案。
