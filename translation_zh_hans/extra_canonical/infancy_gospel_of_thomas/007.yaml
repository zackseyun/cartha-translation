translation:
  language: zh_hans
  text: '（1）老师听见耶稣对第一个字母如此透彻的认识，又听见他讲解那字母的各个笔画[a]，便被他的教导和答辩弄得不知所措。老师说：“我有祸了！我有祸了！我困惑不解，苦不堪言。我收下这个孩子，反倒使自己蒙羞。


    （2）“弟兄，把他从我这里带走吧！他的目光，我承受不了；他话语的清晰透彻，我也承受不了。这孩子根本不属于这个尘世，连火也能驯服！也许在世界受造以前，他就已经存在了。究竟怎样的母腹孕育了他？究竟怎样的母亲养大了他？我不知道。弟兄啊，我有祸了！他使我目瞪口呆；我的心思跟不上他。我骗了自己，真是三重不幸！我原以为会收一个学生，到头来却发现自己有了一位老师。


    （3）“朋友们，我年纪这么大，竟被一个孩子胜过；一想到这羞辱，我就痛苦不已。我真该被人赶出去，死掉算了；不然，也该因这孩子逃离这个村庄。我再也无颜见众人，尤其无颜见那些亲眼看见我被一个小小孩子胜过的人。可是，关于第一个字母的那些笔画，我能对人说什么，又能讲些什么呢？朋友们，说实话，我不知道，因为无论是起头还是末了，我都不明白！


    （4）“所以，约瑟弟兄，平安地把他领回你家吧；这孩子是个非同寻常的存在——究竟是神，是天使，还是别的什么，我说不出来；我不知道。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “透彻的认识”和“各个笔画”的译法暂依所提供的公共领域英语见证及上下文拟定；希腊文抄本传统尚待直接复核。
    reason: 底本资料明确说明尚未完成希腊文审查，而本句英语措辞尤其生硬，需向读者标明暂定性质。
lexical_decisions:
- source_word: good familiarity
  choice: 透彻的认识
  rationale: 所提供的英语见证措辞不自然；结合老师惊叹耶稣认识字母的语境，译为自然中文，同时不把它具体化为某一种知识理论。
- source_word: lines of the first letter / first element
  choice: 第一个字母的各个笔画
  rationale: 上下文是识字教学；“笔画”最能让现代汉语读者理解 lines，同时保留它们属于第一个字母这一点。
- source_word: defense
  choice: 答辩
  rationale: 兼顾回应、申辩之意，不预设这是法律意义上的辩护。
- source_word: not of this earth
  choice: 不属于这个尘世
  rationale: 保留其超尘世意味，而不直接断定孩子的本体或来源。
- source_word: with salvation
  choice: 平安地
  rationale: 英语见证直译痕迹明显；此处按送回家时的祝愿或安全状态自然表达，未扩展为完整的救恩论陈述。
- source_word: a great thing
  choice: 非同寻常的存在
  rationale: 避免中文“伟大的东西”对人的贬抑感，也不提前把后面的神或天使之猜测确定为结论。
theological_decisions:
- issue: 孩子是否在创世以前已经存在
  choice: 保留“也许”
  alternative: 断言孩子先存
  rationale: 说话者明确是在猜测；译文不将其提升为叙述者或文本的确定教义。
- issue: “whether a god or an angel”的身份判断
  choice: “究竟是神，是天使，还是别的什么”
  alternative: 译为“是上帝或天使”或直接认定其神性
  rationale: 保留教师不确定、列举可能性的语气，不把普通名词式猜测等同于对独一上帝身份的明确宣认。
- issue: “beginning nor the end”的潜在神学双关
  choice: “无论是起头还是末了，我都不明白”
  alternative: 解释为仅指字母笔画的首尾，或解释为基督论称号
  rationale: 原句可能既承接字母讲解，又产生更宽广的意味；译文保留张力，不在正文中消解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；老师的哀叹保留强烈的重复、羞耻和惊惧感。避免古奥文言，也不把人物的推测改写成叙述者的神学断言。本稿基于所提供的公共领域英语见证，仍属等待希腊文直接校勘的出版草稿。
