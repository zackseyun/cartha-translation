  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/015.yaml
  text: '(1) Some days later, another teacher again said to Joseph, Jesus’ father, “Come, brother, give him to me at the school, so that I can teach him letters with flattery.”


    Joseph said to him, “If you have courage, brother, take him with salvation.”


    The teacher took the child by the hand and led him away with great fear and concern. The child went gladly.


    (2) When Jesus entered the school, he found a book lying on the lectern. He picked it up, but he did not read what was written in it, because it was not from God’s law. Instead, he opened his mouth and uttered such impressive words that the teacher sitting opposite him listened with great delight and encouraged him to say more. The crowd standing there was amazed at his holy words.


    (3) Joseph quickly ran to the school, suspecting that this teacher was no longer inexperienced and had suffered. But the teacher said to Joseph, “So that you may know, brother, I did indeed take your child as a disciple, but he is full of great grace and wisdom. Therefore, brother, lead him away with salvation into your house.”


    (4) Jesus said to the teacher, “Since you have spoken correctly and testified correctly, the one struck down will also be saved because of you.” Immediately, that teacher also was saved. Joseph took the child and led him away into his house.'
translation:
  language: zh_hans
  text: '《多马的婴孩福音》第15章　第三位老师


    (1) 过了几天，又有一位老师对耶稣的父亲约瑟说：“兄弟，来吧，把他交给我，送进学校，好让我用好言劝导他，教他识字。”


    约瑟对他说：“兄弟，你若有胆量，就平安地把他带去吧。”[a]


    老师拉着孩子的手，满怀恐惧和忧虑地领他走了；孩子却欣然前去。


    (2) 耶稣进了学校，看见一本书放在书案上，就拿了起来，却没有诵读其中所写的，因为那并不是出自上帝的律法。[b] 他反而开口说出极其非凡的话。坐在他对面的老师听得十分欢喜，便鼓励他继续讲下去。站在那里的众人都对他的圣言惊叹不已。


    (3) 约瑟赶紧跑到学校，因为他料想这位老师已经吃了苦头，不再是毫无经验的人了。[c] 老师却对约瑟说：“兄弟，我实话告诉你：我的确收了你的孩子作学生，但他满有恩典和智慧。所以，兄弟，请平安地把他领回家去吧。”[a]


    (4) 耶稣对老师说：“既然你说得对，见证得也对，那被击倒的人也必因你而得救。”[d] 那位老师也立刻得救了。约瑟便带着孩子，把他领回家去。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安地”所译的表达字面上近于“带着救恩／安全”；原句含义不寻常，可能表示平安、安全或获救。
    reason: 解释重复出现的异常措辞，同时避免在正文中生硬直译。
  - marker: b
    text: “并不是出自上帝的律法”也可理解为“不是上帝律法中的内容”；现有见证不能完全确定其具体所指。
    reason: 保留该句在书卷身份、内容来源和律法关系上的歧义。
  - marker: c
    text: 这一句的表述较难确定；也可能意为约瑟料想这位老师已经受了苦，因而有了经验。
    reason: 源语言复核尚未完成，英语见证本身的句法和逻辑异常。
  - marker: d
    text: “被击倒的人”是谁，以及“得救”具体指什么，原句没有说明。
    reason: 防止将模糊指称强行与前文某一人物或某种身体状态对应。
lexical_decisions:
- source_word: with flattery
  choice: 用好言劝导他
  rationale: 英语见证直译为“用奉承”，语义在现代汉语中容易显得虚伪；此处按教学语境译为温和、讨好的言语劝导，同时不把它强化为严厉管教。
- source_word: letters
  choice: 识字
  rationale: 这里指初步文字教育，而非书信；“教他识字”自然且符合学校场景。
- source_word: with salvation
  choice: 平安地
  rationale: 保留该异常表达所含的安全、福祉意味；正文采用可读的“平安地”，并以脚注说明其字面含义和不确定性。
- source_word: lectern
  choice: 书案
  rationale: 指放置并诵读书卷的台架；“书案”较为自然，也不引入现代讲台意象。
- source_word: uttered words so impressive
  choice: 说出极其非凡的话
  rationale: 传达言辞给人深刻、惊异之感，不擅自限定为雄辩、神谕或特定教义内容。
- source_word: holy words
  choice: 圣言
  rationale: 简洁保留话语的神圣性质，但不将其改写为经文或启示。
- source_word: the one struck down
  choice: 那被击倒的人
  rationale: 保留指称对象及其状态的含混，不擅自认定是先前某位老师、受咒诅者或死者。
theological_decisions:
- issue: “不是出自上帝的律法”的所指
  choice: 保留为对书中内容来源的陈述
  alternative: 解释为该书不是《律法书》，或其内容违反上帝的律法
  rationale: 现有英语见证容许多种理解；正文不把“上帝的律法”具体等同于某一正典书卷，也不推断其内容邪恶。
- issue: 老师“得救”或“恢复”
  choice: 译作“得救”
  alternative: 译作“痊愈”“恢复正常”或“免于灾祸”
  rationale: 英语见证反复使用 salvation/saved，可能兼有获救、平安和恢复之义；为保留叙事中的神学张力，正文采用“得救”，不缩减为单纯身体康复。
- issue: “因你而得救”的因果关系
  choice: 直译为“因你而得救”
  alternative: 译为“为了你的缘故得救”或“借着你的见证得救”
  rationale: 保留老师的正确言说、见证与被击倒者获救之间未被解释的关联，不补入具体救恩机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“兄弟”保留古代同辈间的称呼；“欣然前去”“惊叹不已”等措辞维持古典宗教叙事气息，但避免文言化。鉴于所供材料明确注明希腊语复核尚待进行，本稿以公共领域英语见证为暂定依据，并通过脚注标明关键不确定处。
