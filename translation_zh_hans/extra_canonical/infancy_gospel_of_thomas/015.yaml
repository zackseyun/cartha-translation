    reason: 英语见证本身的句法和逻辑异常；正文避免擅自确定受苦和经验之间的关系。
  - marker: d
    text: “被击倒的人”是谁，以及“得救”具体指什么，原句没有说明。
    reason: 避免将模糊指称强行对应于前文某位人物、某种身体状态或特定救恩解释。
  revision_rationale: 修订重点是恢复英语见证中刻意重复的“salvation/saved”词汇关联，以“带着救恩”加注的方式保留其异常性；并收束第3节对难句的解释性改写，避免添加原见证未明示的因果与时间关系。其余改动仅为使措辞更自然、中性，并避免不必要的神学术语强化。
