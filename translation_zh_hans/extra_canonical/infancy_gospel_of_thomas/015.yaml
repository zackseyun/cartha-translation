    (4) 耶稣对老师说：“既然你说得对，见证得也对，那被击倒的人也必因你而得救。”[d] 那位老师也立刻得救了。约瑟便带着孩子，把他领回家去。'
  revised_footnotes:
  - marker: a
    text: “带着救恩”直译英语见证中不寻常的表达（with salvation）。这句话可能带有平安、安全、获救或福祉等含义；其在此处的确切意思未明。
    reason: 保留正文中与第4节“得救”可能存在的词汇呼应，同时不将其含义限定为某一种解释。
  - marker: b
    text: “不是出自上帝的律法”也可理解为“不是上帝律法中的内容”。现有见证不能完全确定这里是指该书卷、书中内容，还是其与律法的关系。
    reason: 保留该句关于书卷身份、内容来源及律法关系的歧义。
  - marker: c
