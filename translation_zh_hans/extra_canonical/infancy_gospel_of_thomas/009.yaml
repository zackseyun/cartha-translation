  text: '(1) Again, after many days, Jesus was playing with other children on a certain roof of an upstairs room. One of the children fell and died. When the other children saw this, they went into their houses and left Jesus alone.


    (2) The parents of the child who had died came and accused Jesus, saying, “You pushed our child down!”


    But Jesus said, “I didn’t push him down.”


    (3) They were raging and shouting. Jesus came down from the roof, stood beside the body, and cried out in a loud voice, saying, “Zeno, Zeno”—because this was his name—“rise and say whether I pushed you down.”


    He rose and said, “No, sir.”


    When they saw this, they were amazed.


    Again Jesus said to him, “Fall asleep!”


    The child’s parents praised God and worshiped the child Jesus.'
translation:
  language: zh_hans
  text: '《多马婴孩福音》第9章：耶稣使芝诺复生


    （1）又过了许多天，耶稣和别的孩子在一座楼房的屋顶上玩耍。其中一个孩子掉了下去，死了。其他孩子看见这事，就各自回家，只留下耶稣一人。


    （2）死去孩子的父母来了，指控耶稣说：“是你把我们的孩子推下去的！”


    耶稣却说：“我没有推他下去。”


    （3）他们怒气冲冲，大声叫嚷。耶稣从屋顶下来，站在尸体旁，高声喊道：“芝诺，芝诺[a]——这是他的名字——起来，说说是不是我把你推下去的。”


    他就起来，说：“不是，先生[b]。”


    众人看见了，都十分惊奇。


    耶稣又对他说：“睡去吧！[c]”


    孩子的父母赞美上帝，并敬拜孩童耶稣。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “芝诺”是人名音译；具体拼写仍有待依据希腊文抄本传统复核。
    reason: 交代专名处理及当前底本限制。
  - marker: b
    text: “先生”所对应称呼的确切语气与尊崇程度，仍待希腊原文复核。
    reason: 避免根据英语见证过度确定称呼的语义层级。
  - marker: c
    text: 这里的“睡去”在叙事中可能是死亡的委婉说法；译文保留原有意象，没有直接改写为“死去”。
    reason: 保存语义张力与叙事措辞。
  - marker: d
    text: 现有英语见证作“敬拜”；其所据希腊词的具体含义范围仍待原文校勘。
    reason: 该词具有重要神学含义，需透明标示见证限制。
lexical_decisions:
- source_word: roof of an upstairs room
  choice: 一座楼房的屋顶
  rationale: 按现有英译见证表达为可供孩子活动的楼顶，避免生硬直译“楼上房间的屋顶”。
- source_word: Zeno
  choice: 芝诺
  rationale: 采用该希腊人名在现代汉语中的常见音译；是否需按具体希腊拼写调整，仍待原文校勘。
- source_word: sir
  choice: 先生
  rationale: 保留礼貌称呼，不擅自提升为带有明确神学含义的尊称。
- source_word: Fall asleep
  choice: 睡去吧
  rationale: 保留“睡眠”措辞及其死亡委婉语的张力，不直接改译为“死去吧”。
- source_word: worshipped
  choice: 敬拜
  rationale: 如实保留现有见证中强度较高的宗教性动作词，不弱化为单纯“致敬”。
theological_decisions:
- issue: 芝诺起来后的状态及耶稣命令“睡去吧”的含义
  choice: 保留“起来”与“睡去”的原有意象
  alternative: 明确译作“复活”与“再次死去”
  rationale: 叙事暗示死亡与复生，但措辞本身仍具有形象性；不在正文中替作者解释其机制。
- issue: 孩子父母对孩童耶稣的动作
  choice: 译作“敬拜孩童耶稣”
  alternative: 译作“向孩童耶稣下拜”或“向他致敬”
  rationale: 现有英译见证使用“worshipped”；保留其神学力度，同时以脚注说明希腊原文复核尚待完成。
- issue: 耶稣是否造成孩子坠落
  choice: 保持指控、否认与死者作证的叙事结构
  alternative: 在译文中直接宣告耶稣无罪
  rationale: 不越过文本的戏剧性呈现，以解释性措辞替代叙事证词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；对话简洁直接。当前材料明确说明希腊语源文审查尚未完成，因此本稿以所提供的公版英语见证为暂定依据，并通过脚注标明关键不确定处。
