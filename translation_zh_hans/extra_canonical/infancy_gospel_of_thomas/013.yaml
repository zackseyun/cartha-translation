theological_decisions:
- issue: 耶稣使短木板变长的神迹性质
  choice: 直述“把它拉长，使它与另一块一样长”
  alternative: 解释为通过木工技巧调整或对齐
  rationale: 见证明确叙述超常伸长，不以自然主义解释消解文本的神迹色彩。
- issue: 约瑟末句中上帝与孩子的关系
  choice: “上帝把这个孩子赐给我”
  alternative: 扩展为关于耶稣神性、降生或约瑟父职的教义性陈述
  rationale: 严格保留原句范围，不加入文本未明说的宗派性或系统神学解释。
- issue: “父亲”称谓
  choice: 在叙事与对话引介中保留“父亲”
  alternative: 一律改为“养父”
  rationale: 保留故事本身的亲属称谓，不用解释性称号预先解决其神学张力。
