  footnotes:
  - marker: a
    text: “我因肉身出身的尊贵，既在你之外，也在你里面”原文含义晦涩；本译文保留其张力，未作解释性改写。
    reason: 提示读者该句存在真实的文本与语义不确定性。
  - marker: b
    text: “承载救恩之名”所指不明确，也可理解为“具有救恩的名号”。
    reason: 避免把含混的名号表达限定为某一特定解释。
  - marker: c
    text: 现有英文见证作“我在这世界以前就已经被造”。也可能有人理解为“我在世界被造以前就已存在”；希腊文传本尚待直接复核。
    reason: 保留关键神学张力，并说明当前翻译依据的限制。
  - marker: d
    text: “喧响的锣和鸣鸣的钹”令人联想到《哥林多前书》13:1，但本译文不据此判定作者有意引用。
    reason: 指出明显措辞联系，同时避免无证据地认定直接引文。
  - marker: e
    text: 〈……〉表示传本此处文字残缺或佚失。
    reason: 如实呈现底本文本缺口。
lexical_decisions:
- source_word: letters / alpha / beta / omega
  choice: 字母／阿尔法／贝塔／欧米伽
  rationale: 本段讨论希腊字母的形体与次序，保留希腊字母名称，避免用汉字或英文字母替代而失去语境。
- source_word: lawyer
  choice: 律法师
  rationale: 这里指熟悉并讲授犹太律法的人，不是现代职业意义上的律师。
- source_word: small person
  choice: 小人物
  rationale: 保留原文不只是年龄幼小、也可能含身份或能力微不足道的双关，不径直释为“小孩子”。
- source_word: first element
  choice: 第一个字母
  rationale: 结合随后对阿尔法笔画的讲解，采用自然中文；“element”所含基本构成单位之意由“构造”语境补足。
- source_word: name of salvation
  choice: 救恩之名
  rationale: 保持原文凝练且含义不明的表达，不擅自确定所指名称或具体神学身份。
- source_word: created before this world
  choice: 在这世界以前就已经被造
  rationale: 忠实保留见证文本中“被造”的被动语态及其与先存论并置所形成的神学张力。
theological_decisions:
- issue: 耶稣关于先存与“被造”的自述
  choice: 直译为“我在这世界以前就已经被造”
  alternative: 释作“我在世界被造以前就已存在”
  rationale: 英文见证明确以“我”为created的主语；虽可能涉及底本或传本问题，但在希腊文直接复核前不宜为符合后世教义而改写。
- issue: “我在你之外，也在你里面”及肉身出身的尊贵
  choice: 保留空间性和出身用语
  alternative: 解释为“我超越你并洞察你，因为我的神圣降生”
  rationale: 原句晦涩，可能有多重理解；译文不将其系统化为特定基督论。
- issue: “承载救恩之名”的对象和含义
  choice: 保留开放表达
  alternative: 明确解释为约瑟将被称作某一救恩称号
  rationale: 现有见证不足以确定该名号具体指什么，也不应凭神学推论补足。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文；师生对话保留鲜明语气。“弟兄”反映古代亲切称呼。“学堂”比现代“学校”更适合古代场景。由于所供材料注明希腊文直接审校尚未完成，本稿以公共领域英文见证为暂定依据，并通过脚注标示关键不确定处。
