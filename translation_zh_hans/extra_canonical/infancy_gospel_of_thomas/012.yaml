    reason: 说明底本限制、未定计量单位，并保留末句未明说宾语及其叙事关系的简略性。
  revision_rationale: 修订仅纠正末句超出英文见证的释义，并改善计量表达的现代汉语可读性。保留“他的父亲”这一指称，避免加入神学性限定；也不对百倍收成的机制作解释。
