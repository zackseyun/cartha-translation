base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/012.yaml
  text: '(1) At sowing time, Joseph sowed seed, and the child Jesus sowed one measure of wheat.


    (2) His father harvested a hundred large measures. He gave generously to the poor and the orphans. But Joseph took from Jesus’ seed.'
translation:
  language: zh_hans
  text: '（1）到了播种的时候，约瑟撒下种子，孩童耶稣也撒了一量器的小麦。


    （2）他的父亲收获了一百大量器。他慷慨地把粮食分给穷人和孤儿；不过，约瑟所收取的是耶稣撒下的种子。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章暂据所提供的公版英文见证翻译，尚未直接校核希腊语抄本传统。末句也可理解为：“不过，约瑟从耶稣的种子中取了一些。”
    reason: 明确当前底本限制，并保留末句潜在的句法与语义歧义。
lexical_decisions:
- source_word: one measure of wheat
  choice: 一量器的小麦
  rationale: 现有见证没有注明具体度量单位；用“一量器”保留原文计量表达及其不确定性，避免误换算为现代单位。
- source_word: a hundred great measures
  choice: 一百大量器
  rationale: 保留与前文“一量器”的数量对照，并体现“great/大”的修饰；由于希腊语校核尚待完成，不擅自指定古代容量单位。
- source_word: gave graciously
  choice: 慷慨地把粮食分给
  rationale: 按上下文将所赠之物自然补为收获的粮食，并传达施予穷人和孤儿时的慷慨意味。
- source_word: the poor and the orphans
  choice: 穷人和孤儿
  rationale: 采用现代汉语中清楚自然的群体称谓。
- source_word: took from Jesus’ seeds
  choice: 所收取的是耶稣撒下的种子
  rationale: 英文见证末句语义可能指约瑟的收成源自耶稣所撒的种子；译文保留其强调关系，同时用脚注说明句法尚需希腊语校核。
theological_decisions:
- issue: 百倍收成与耶稣所撒种子的关系
  choice: 将末句译为约瑟所收取的是耶稣撒下的种子
  alternative: 约瑟从耶稣的种子中取了一些
  rationale: 本章叙事重点似在耶稣所撒的一量器小麦产生巨量收成，但现有英文见证末句形式简略；因此正文采用较符合上下文的理解，同时不把神迹机制进一步具体化。
- issue: “他的父亲”的指代
  choice: 保留“他的父亲”
  alternative: 直接改作“约瑟”或“耶稣的父亲约瑟”
  rationale: 忠实保留见证中的亲属称谓，不在此处引入对耶稣父子关系的额外神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“量器”刻意不换算为现代容量单位，以免制造虚假的精确性。正文中的脚注标记与脚注条目一致。
