  text: '(1) When Jesus was twelve years old, his parents went to Jerusalem for the Passover festival, according to custom. But as they were returning, Jesus stayed behind in Jerusalem, and his parents did not know it.


    (2) Assuming that he was with the traveling company, they went a day’s journey and looked for him among their relatives whom they knew. When they did not find him, they returned to Jerusalem and searched for him.


    After three days, they found him in the temple, sitting among the teachers, listening to them and questioning them. Those who heard him were amazed at how he questioned the elders and explained the main points of the law, the riddles, and the parables of the prophets.


    (3) His mother said to him, “Child, what have you done to us? Look, we have been searching for you in pain and grief.”


    Jesus said, “Why were you looking for me? Didn’t you know that I must be in the place of my Father?”


    (4) The scribes and the Pharisees said to Mary, “Are you the mother of this child?”


    She said, “I am.”


    They said to her, “Blessed are you, because the Lord God has blessed the fruit of your womb. We have never seen such wisdom of praise and glory of virtue.”


    (5) Jesus got up and followed his mother from there, and he was obedient to his parents. She treasured all these things, pondering them in her heart.


    Jesus advanced in wisdom, maturity, and grace before God and humans. To whom be the [glory …].'
translation:
  language: zh_hans
  text: '（1）耶稣十二岁的时候，他的父母照惯例上耶路撒冷去过逾越节。返程途中，耶稣却留在了耶路撒冷，他的父母并不知道。


    （2）他们以为耶稣在同行的人群中，就走了一天的路程，又在熟识的亲友中寻找他。没有找到，便返回耶路撒冷去找他。


    三天后，他们在圣殿里找到了他。他正坐在教师们中间，一边听，一边向他们提问。听见他的人都很惊奇，因为他不仅向长者发问，还讲解律法的要义、难题，以及先知的比喻。


    （3）他的母亲对他说：“孩子，你为什么这样对待我们？你看，我们一直在痛苦忧伤中寻找你。”


    耶稣说：“为什么找我呢？难道你们不知道，我必须在我父的地方吗？”[a]


    （4）经学家和法利赛人问马利亚：“你是这孩子的母亲吗？”


    她说：“我是。”


    他们对她说：“你是有福的，因为主上帝赐福给了你腹中的果子。我们从未见过这样的智慧，配得赞美；也从未见过这样荣耀的德行。”[b]


    （5）耶稣就起身，跟随母亲离开那里，并且顺从父母。他母亲把这一切都珍藏在心里，反复思量。


    耶稣在智慧、身量[c]和恩宠上不断长进，在上帝和人面前都是如此。愿［荣耀……］归给他。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我父的地方”也可能理解为“在我父的家里”；此处保留了地点表达，没有改译为“以我父的事为念”。
    reason: 保留关键基督论语句在空间意义与使命意义之间的张力。
  - marker: b
    text: “这样的智慧，配得赞美；……这样荣耀的德行”所依据的见证文本措辞较为生硬，其修饰关系并不完全明确。
    reason: 提示读者这一句存在文本或翻译层面的语法歧义。
  - marker: c
    text: “身量”也可理解为“年岁”或“成熟程度”。
    reason: 保留相关词语在身体成长、年龄和成熟度之间的语义范围。
  - marker: d
    text: 结尾在所据见证中残缺；方括号和省略号表示缺文或后来的补足。
    reason: 忠实保存来源所标示的文本残缺状态。
lexical_decisions:
- source_word: traveling company
  choice: 同行的人群
  rationale: 比“旅行团”更符合古代结伴赶路的情境，也避免现代旅游色彩。
- source_word: teachers
  choice: 教师们
  rationale: 保留原文较宽泛的身份称谓，不擅自具体化为拉比或经学家。
- source_word: main points of the law
  choice: 律法的要义
  rationale: 以自然中文表达律法中的核心内容，同时不扩展为特定教义体系。
- source_word: riddles
  choice: 难题
  rationale: 此处可能指隐晦、待解的问题；“难题”比现代文学意义的“谜语”更合语境。
- source_word: maturity
  choice: 身量
  rationale: 此句明显呼应路加福音2:52；“身量”保留可指身体成长或年岁成熟的语义空间，并加脚注说明。
- source_word: grace
  choice: 恩宠
  rationale: 此处表示在上帝和人面前所得的恩惠或悦纳；“恩宠”较能保留神学语感，且不把意义缩窄为一般好感。
theological_decisions:
- issue: “in the place of my Father”的含义
  choice: 在我父的地方
  alternative: 以我父的事为念／在我父的家里
  rationale: 见证文本明确采用“place”；直译可保留地点意义及潜在的神学双关，不将其单一解释为事务或圣殿。
- issue: 耶稣成长的表述
  choice: 在智慧、身量和恩宠上不断长进
  alternative: 在智慧、成熟和恩典上不断长进
  rationale: 保留文本对真实成长的陈述，不以系统神学预设削弱“长进”的张力。
- issue: 结尾颂荣对象
  choice: 愿［荣耀……］归给他
  alternative: 愿荣耀归给耶稣／上帝
  rationale: 关系代词的先行词按紧邻语境可指耶稣，但残缺结尾仍留有不确定性；译文用“他”而不补明确名号。
- issue: “wisdom of praise and glory of virtue”这一困难短语
  choice: 这样的智慧，配得赞美；也从未见过这样荣耀的德行
  alternative: 这样可赞美的智慧和有荣耀的德行
  rationale: 原见证的修饰关系不够清楚；译文采用通顺但不过度教义化的理解，并以脚注标明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留重复的“寻找”和段落推进，以呈现古代叙事节奏；避免使用过度古雅的“遂、乃”等词。因希腊语原文尚待直接复核，本稿以所提供的公共领域英文见证为临时依据，对疑难处采取保守翻译并加注。
