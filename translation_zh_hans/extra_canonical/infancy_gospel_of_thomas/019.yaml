review_pass:
  verdict: revise
  source_fidelity: 整体忠实反映所提供的英文见证，并保留了“我父的地方”和结尾残缺的关键不确定性。但第（2）节把“他怎样向长者发问并讲解”改写为带有“不仅……还……”和“因为”的因果、递进结构，略增原文未明示的逻辑；第（4）节困难短语被拆分并重复为两项“从未见过”，较明显地重组了原见证的暧昧表达。结尾的颂荣对象不宜据残缺文本进一步明确。
  naturalness: 原稿总体庄重流畅，但“上耶路撒冷去过逾越节”不合现代汉语常用搭配，宜改为“上耶路撒冷去参加逾越节”。“在智慧、身量和恩宠上不断长进，在上帝和人面前都是如此”也略显生硬；可按汉语表达为在智慧、成熟和恩惠上长进，并越来越蒙上帝和人的悦纳。
  terminology: “经学家”“法利赛人”“圣殿”“律法”均合宜。“教师”保留见证文本的宽泛称谓，优于擅译为“拉比”。英文见证为maturity，译作“成熟”比“身量”更直接；“恩惠”比“恩宠”更中性，也较贴近此处在上帝和人面前所得悦纳的语境。
  issues:
  - severity: medium
    issue: 第（2）节加入“因为他不仅……还……”的因果与递进结构。
    rationale: 英文见证只说众人惊奇于他如何向长者发问、如何讲解，并未明确建立“发问”与“讲解”的递进或以其作为额外解释。应以并列方式保留叙述。
  - severity: high
    issue: 第（4）节将困难短语改成“这样的智慧，配得赞美；也从未见过这样荣耀的德行”。
    rationale: 这不但把见证中单一的“从未见过”扩展为两次，也把原本不清楚的修饰关系拆定为两个判断。宜采用较为紧凑、并保留歧义的表达，并以脚注说明。
  - severity: low
    issue: “上耶路撒冷去过逾越节”不自然。
    rationale: 现代汉语通常说“去参加逾越节”或“去守逾越节”。
  - severity: medium
    issue: 将maturity译为“身量”并在正文中与路加福音措辞靠拢。
    rationale: 本任务应首先遵从所提供见证；见证明确作maturity。译为“成熟”不预设身体尺寸或年龄，脚注仍可说明相关词语的语义范围。
  - severity: low
    issue: 末句以“愿……归给他”呈现时，不应把残缺处补足为特定颂荣公式或明确指称对象。
    rationale: 保留原见证的方括号、省略号和代词指向的不确定性即可。
  revised_text: '（1）耶稣十二岁的时候，他的父母照惯例上耶路撒冷去参加逾越节。可是他们返程时，耶稣留在耶路撒冷；他的父母却不知道。


    （2）他们以为他在同行的人群中，就走了一天的路程，在熟识的亲友中寻找他。没有找到他，就返回耶路撒冷寻找他。


    三天后，他们在圣殿里找到了他。他坐在教师们中间，听他们说话，也向他们提问。听见他的人都很惊奇：他怎样向长者发问，又怎样讲解律法的要义、难题和先知的比喻。


    （3）他的母亲对他说：“孩子，你为什么这样待我们？你看，我们一直在痛苦和忧伤中寻找你。”


    耶稣说：“为什么找我呢？难道你们不知道，我必须在我父的地方吗？”[a]


    （4）经学家和法利赛人对马利亚说：“你是这孩子的母亲吗？”


    她说：“我是。”


    他们对她说：“你是有福的，因为主上帝赐福给了你腹中的果子；我们从未见过如此可赞的智慧和荣耀的德行。”[b]


    （5）耶稣就起身，跟随他的母亲离开那里，并且顺从父母。她把这一切都珍藏在心里，反复思量。


    耶稣在智慧、成熟[c]和恩惠上不断长进，越来越蒙上帝和人的悦纳。愿［荣耀……］归给他。[d]'
  revised_footnotes:
  - marker: a
    text: “在我父的地方”也可能理解为“在我父的家里”；此处保留地点表达，没有改译为“以我父的事为念”。
    reason: 保留关键语句在空间意义与使命意义之间的张力，避免单一解释。
  - marker: b
    text: “如此可赞的智慧和荣耀的德行”所依据的见证文本措辞较为生硬，两个修饰语与名词之间的关系并不完全明确。
    reason: 提示读者此处可能存在文本或翻译层面的语法歧义，同时避免在正文中将其拆定为两个独立判断。
  - marker: c
    text: “成熟”也可涉及年龄或身体成长的含义。
    reason: 所据英文见证作maturity；译文保留其宽泛的成长含义，而不限定为单指身量。
  - marker: d
    text: 结尾在所据见证中残缺；方括号和省略号表示缺文或未能确定的文字。
    reason: 忠实保存来源所标示的文本残缺状态，不补足颂荣公式或明确其对象。
  revision_rationale: 修订以所提供的公共领域英文见证为直接审校依据，并维持其暂定性质。主要改正不自然的现代汉语搭配，撤除第（2）节未明示的因果递进，重译第（4）节难句以避免拆分和重复原文没有重复的断言；同时将maturity直译为“成熟”，并把grace在“在上帝和人面前”的语境中自然表达为“越来越蒙上帝和人的悦纳”。所有原有脚注锚点均予保留，且结尾残缺没有被补写。
