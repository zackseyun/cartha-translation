base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/006.yaml
  text: “Jesus” is a hidden name; “Christ” is a revealed name. So “Jesus” is not translated, but he is called by his name “Jesus.” But the name “Christ” in Syriac is “Messiah,” in Greek “Christ,” and all the others have it according to their own language. “The Nazarene” reveals what is hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.
translation:
  language: zh_hans
  text: “耶稣”是一个隐藏的名字；“基督”是一个显明的名字。因此，“耶稣”不被翻译，人们只按他的名字称他为“耶稣”。但“基督”这个名字，在叙利亚语中是“弥赛亚”，在希腊语中是“基督”；其他各族也都按自己的语言来称呼。“拿撒勒人”显明那隐藏的。基督里面包含一切，无论是人、天使、奥秘，还是父。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英语见证译出；科普特语原文的直接复核尚待完成。末句的并列关系以及“拿撒勒人”与“隐藏”之间可能存在的文字关联，仍需据原文确认。
    reason: 明确文本基础的暂定性质，并标示可能受源语言词语游戏及句法影响之处。
lexical_decisions:
- source_word: Jesus
  choice: 耶稣
  rationale: 采用现代汉语中通行的音译，并保留原文关于此名“不被翻译”的论述。
- source_word: Christ
  choice: 基督
  rationale: 采用希腊语称号的传统汉语音译，使其与“弥赛亚”的语言对应关系清楚可见。
- source_word: Messiah
  choice: 弥赛亚
  rationale: 采用通行音译，以保留原文将叙利亚语名称与希腊语“基督”并列的词源性说明。
- source_word: the Nazarene
  choice: 拿撒勒人
  rationale: 译作带定冠称号的人物称谓，不扩展解释其与“隐藏”或地名之间可能存在的文字关联。
- source_word: mystery
  choice: 奥秘
  rationale: “奥秘”既自然庄重，也保留宗教语境中的隐秘、启示含义。
- source_word: has everything within himself
  choice: 里面包含一切
  rationale: 保留内含性的表达，同时避免将其过度阐释为本体论上的等同或统摄。
theological_decisions:
- issue: “拿撒勒人”如何“显明那隐藏的”
  choice: 按见证文本直译，不解释其中可能的词语游戏
  alternative: 意译为“‘拿撒勒人’这个称号揭示了耶稣隐藏的身份”
  rationale: 现有材料仅有英语见证文本，科普特语复核尚待进行；意译会过早限定“隐藏的”所指。
- issue: 基督与所列各项的关系
  choice: 译为“基督里面包含一切”
  alternative: 译为“基督就是一切”或“基督拥有一切”
  rationale: “within himself”强调内含关系；不应将其化约为身份等同，也不应弱化成外在占有。
- issue: 末尾“父”的并列范围
  choice: 保留“人、天使、奥秘，还是父”的并列结构
  alternative: 将“父”另起一句或解释为“也包括父”
  rationale: 保留见证文本突兀而富神学张力的句法，不主动调和基督与父的关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“隐藏／显明”的反复对照和名称之间的语言差异；避免补入特定宗派解释。鉴于直接科普特语审校尚未完成，本稿属于以英语公版见证为依据的暂定最优等效译文。
