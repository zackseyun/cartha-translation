    rationale: 英语见证仅说“他被称作他的名字‘耶稣’”，没有“人们”这一施事者，也没有“只按”的排他限定；且“but”应保留为与“不被翻译”的对照。
  - severity: low
    issue: “其他各族也都按自己的语言来称呼”所指略不明确
    rationale: 原句的“all the others have it according to their own language”所说的是其他语言对该名称的形式；译为“其他各种语言也各有自己的说法”较明确，且不把语言误作族群。
