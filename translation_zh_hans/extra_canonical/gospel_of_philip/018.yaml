lexical_decisions:
- source_word: chamber / bridal chamber
  choice: 内室／婚房
  rationale: 依所供英文见证保留首段“chamber”与次段“bridal chamber”的措辞差异；“婚房”比现代口语色彩较浓的“洞房”更庄重，也保留其仪式性意象。
- source_word: mysteries
  choice: 奥秘
  rationale: 保留宗教语境中的隐秘、神圣仪式双重意味，不缩减为“秘密”。
- source_word: child of the bridal chamber
  choice: 婚房之子
  rationale: 采用较形式对等的表达，保留原文不寻常的身份称谓，不解释为某一特定教义身份。
- source_word: Truth in the images
  choice: 在众形象中领受了真理
  rationale: 保留“真理”与“形象”之间难解的关系，不改写成“借着象征明白真理”等解释性表述。
- source_word: (eternal) ages / (eternal) age
  choice: （永恒的）诸世代／（永恒的）世代
  rationale: 保留见证文本的括号，并以“世代”承载 age 的时间及领域意味；不擅自统一译为带有更强体系色彩的专门术语。
- source_word: According to Philip
  choice: 据腓力所传
  rationale: 采用自然而庄重的中文题署形式，不额外断言作者身份。
theological_decisions:
- issue: 今世领受光与“另一个地方”之间的关系
  choice: 按原句保留绝对而紧张的陈述
  alternative: 把“另一个地方”明确解释为死后世界、来世或某一特定天界
  rationale: 文本本身未在此处界定该地点，译文不代为确定。
- issue: 领受光者“不会被看见，也不会被捆绑”
  choice: 按字面意象译出
  alternative: 解释为属灵上不可识别、不可被邪恶权势拘禁
  rationale: 原陈述可能具有多层含义，直译可避免提前消解其神学张力。
- issue: 世界成为诸世代以及世代为圆满
  choice: 保留其悖论式、宇宙论式措辞
  alternative: 将其顺译为“他们已在世界中进入永恒的圆满”
  rationale: 替代译法会抹平原文的异常句法并加入解释。
- issue: “隐藏在完全的白昼和圣洁的光中”
  choice: 保留“隐藏”与“白昼／光”的反常并置
  alternative: 改成“显明在完全的白昼和圣洁的光中”
  rationale: 文本刻意形成张力；不以逻辑顺畅为由改动其神秘性表达。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语；保留末段神秘、悖论式表达，不以释义替代正文。所给材料注明科普特语复核尚未完成，因此本稿只能依据所供公共领域英文见证作暂定的源证据导向译稿；方括号、省略号及圆括号均尽量原样保存。
