translation:
  language: zh_hans
  text: '凡将要[进入]内室的人，都要点燃自己的[灯]，因为[这]好比那些……在夜间举行的婚礼：火……在夜间……，随后熄灭。但这婚姻的奥秘是在白昼和光明中成就的。那白昼及其光永不落下。[a]


    若有人成为婚房之子，他就会领受那光。人若在这里没有领受它，在另一个地方也无法领受。凡领受那光的人，既不会被看见，也不会被捆绑；即使这样的人仍住在世上，也没有人能搅扰他。不仅如此，当他们离开世界时，他们已经在众形象中领受了真理。[b]世界已经成了（永恒的）诸世代，因为（永恒的）世代对他们而言就是圆满。[c]情形就是这样：这只向他们显明。它不是隐藏在黑暗和夜晚中，而是隐藏在完全的白昼和圣洁的光中。


    福音


    据腓力所传'
  philosophy: optimal-equivalence
