  revised_text: '世界借着四样东西被耕种；人们借着水、土、风和光把东西收进仓里。同样，上帝也借着四样东西耕作：信、望、爱和知识。我们的土就是我们扎根于其中的信；[水]就是我们借此得滋养的望；风就是我们借此成长的爱；光就是我们借此[成熟]的知识。恩典有[四种：有]属地的，有[属天的，……]天上之天……借着……。



    那没有……灵魂的人有福了。这一位就是耶稣基督。他走遍各处，却没有成为任何人的重担。所以，像这样的人有福了；他是完全的人，因为圣言告诉我们，要始终如此是多么困难。我们怎能成就这样伟大的事呢？他又怎能使每个人得安息呢？最要紧的是，不该使任何人忧伤——无论大或小，无论不信的还是信的——然后使那些在富足者中已经安息的人得安息。有些人能从使富足者得安息这事上受益。行善的人不能使他们得安息，因为他们不能任意妄为；他们不能使人忧伤，因为他们不能叫人苦恼。然而，有时富足者反倒使他们忧伤。他们并非那样；是他们自己的恶使他们忧伤。具有那种本性的人使善人喜乐，但有些人却因此极其忧伤。[a]



    一个家主拥有各样东西：儿女、奴仆、牛、狗、猪、小麦、[或]大麦、秸秆、干草、……、肉和橡子。他很有智慧，知道该拿什么喂养每一个。给儿女，他端上饼……；给奴仆，他端上……；给牛，他[投下大麦]、秸秆和干草；给狗，他丢下骨头；给猪，他丢下橡子和泔水。



    上帝的门徒也是这样。他若有智慧，就明白作门徒意味着什么。肉身的外形不会欺骗他；他会察看每个人灵魂的状况，按其情形与他交谈。世上有许多披着人形的动物，门徒认得它们。他会把橡子丢给猪，把大麦连同秸秆和干草丢给牛，把骨头丢给狗，把开胃食物给奴仆，把完全的食物给儿女。[b]



    有人子，也有人子的儿子。主就是人子；人子的儿子，就是那借着人子创造的人。人子从上帝领受了创造的能力，也有生育的能力。领受创造能力的是受造物；领受生育能力的是所生的。创造者不能生育，生育者却能创造。有人说：“创造者也生育。”然而，他们所生的其实是受造物。[所以]，他们所生的并不是他们的儿女，而是……。创造者[公开地]工作，也[显露]出来；生育者却[隐秘地]生育，而他们隐藏……形象。[再说]，那[创造者公开地创造]，生育者却[隐秘地]生育儿女。[c]



    除夫妻二人自己以外，没有[人能够]知道[丈夫]与妻子何时亲密，因为世上的婚姻对已婚的人来说是奥秘。污秽的婚姻尚且隐藏，纯洁无污的婚姻岂不更是真正的奥秘吗？它不属肉体，而是纯洁的；它不出于情欲，而出于意愿；它不属于黑暗或夜晚，而属于白昼和光明。



    婚姻若被赤裸裸地暴露，就成了淫秽之事：不只是新娘接受另一个男人的种子才算如此；即使她离开新房，被人看见，她也犯了奸淫。她可以向父亲、母亲、伴郎和新郎的儿女显露自己；这些人获准每天进入新房。至于其他人，就让他们只渴望听见她的声音，享受她的香气，并像狗一样吃从桌上掉下来的碎屑。新郎和新娘属于新房。没有人能看见新郎和新娘，除非[他们成为]这样的人。[d]'
