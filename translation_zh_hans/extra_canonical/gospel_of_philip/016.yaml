review_pass:
  verdict: revise
  source_fidelity: 本稿总体忠实保留了英文见证稿的段落结构、方括号中的推定补文、缺文省略号，以及若干刻意未解的代词和概念张力。需要修正的主要问题是：开头将“they gather into barns”误加为“人……把收成聚进仓里”，并将“great or small”误译为“尊卑”。这两处都会改变或过度限定见证稿的意义。科普特语直接复核尚待进行，故以下修订仍以所给英文见证稿为准。
  naturalness: 修订后采用较自然而庄重的现代书面普通话；在原文句法断裂、指代不明处不强行理顺。将“世界靠四样东西耕作”调整为被动式农业表达，并使“公开地工作”“赤裸裸地暴露”等搭配更合汉语。
  terminology: 保留“信、望、爱、知识”“人子”“圣言”“完全的人”“创造／生育”“新房”等既有对应。为避免弱化英文见证稿所列社会身份，正文采用“奴仆”对应 servant（原始英文见证作 slave）；这不预断其具体法律身份。
  issues:
  - severity: high
    issue: 首句添加了“人”作为收聚者，并把“they”解释为“人……把收成聚进仓里”。
    rationale: 英文见证稿仅以不定“they”表述借水、土、风、光“gather into barns”，未明言收聚者是人；原译增加施事并将宾语固定为“收成”，超过证据。
  - severity: high
    issue: “whether great or small”译为“无论尊卑”。
