  register: 采用现代标准普通话、简体中文和庄重而可读的散文体。方括号与省略号保留见证稿对抄本残缺及推定复原的标示。因科普特语直接审校尚未完成，本稿属于以公共领域英文见证为基础的暂定出版草案；对代词、缺文和神学术语尤其采取保守处理。
