translation:
  language: zh_hans
  text: '世界靠四样东西耕作，人靠水、土、风、光把收成聚进仓里。同样，上帝也借着四样东西耕作：信、望、爱和知识。我们的土就是信，我们在其中扎根；[水]就是望，我们借此得滋养；风就是爱，我们借此成长；光就是知识，我们借此[成熟]。恩典有[四种：有]属地的，有[属天的，……]天上之天……借着……。


    那没有……灵魂的人有福了。这一位就是耶稣基督。他走遍各处，却没有成为任何人的重担。所以，像这样的人有福了；他是完全的人，因为圣言告诉我们，要始终如此是多么困难。我们怎能成就这样伟大的事呢？他又怎能使每个人得安息呢？最要紧的是，不该使任何人忧伤——无论尊卑，无论不信的还是信的——然后要使那些在富足者中已经安息的人得安息。有些人能从使富足者得安息这事上受益。行善的人不能使他们得安息，因为行善的人不能任意妄为；他们不能使人忧伤，因为他们不能叫人苦恼。然而，有时那富足者反倒使他们忧伤。不是行善的人本身如此，而是富足者自己的恶使他们忧伤。具有那种本性的人使善人喜乐，但有些人却因此极其忧伤。[a]


    一个家主拥有各样东西：儿女、仆人、牛、狗、猪、小麦、[或]大麦、秸秆、干草、……、肉和橡子。他很有智慧，知道该拿什么喂养每一个。给儿女，他端上饼……；给仆人，他端上……；给牛，他[投下大麦]、秸秆和干草；给狗，他丢下骨头；给猪，他丢下橡子和泔水。


    上帝的门徒也是这样。他若有智慧，就明白作门徒意味着什么。肉身的外形不会欺骗他；他会察看每个人灵魂的状况，按其情形与他交谈。世上有许多披着人形的动物，门徒认得它们。他会把橡子丢给猪，把大麦连同秸秆和干草丢给牛，把骨头丢给狗，把开胃食物给仆人，把完美的食物给儿女。[b]


    有人子，也有人子的儿子。主就是人子；人子的儿子，就是那借着人子创造的人。人子从上帝领受了创造的能力，也有生育的能力。领受创造能力的是受造物；领受生育能力的是所生的。创造者不能生育，生育者却能创造。有人说：“创造者也生育。”然而，他们所生的其实是受造物。[所以]，他们所生的并不是他们的儿女，而是……。创造者[公开]工作，自己也[显露]出来；生育者却[隐秘地]生育，而他们隐藏……形象。[再说]，那[创造者公开创造]，生育者却[隐秘地]生育儿女。[c]


    除夫妻二人自己以外，没有[人能够]知道[丈夫]与妻子何时亲密，因为世上的婚姻对已婚的人来说也是奥秘。污秽的婚姻尚且隐藏，纯洁无污的婚姻岂不更是真正的奥秘吗？它不属肉体，而是纯洁的；它不出于情欲，而出于意愿；它不属于黑暗或夜晚，而属于白昼和光明。


    婚姻若被剥露，就成了淫秽之事：不只是新娘接受另一个男人的种子才算如此；即使她离开新房，被人看见，她也犯了奸淫。她可以向父亲、母亲、伴郎和新郎的儿女显露自己；这些人获准每天进入新房。至于其他人，就让他们只渴望听见她的声音，享受她的香气，并像狗一样吃从桌上掉下来的碎屑。新郎和新娘属于新房。没有人能看见新郎和新娘，除非[他们成为]这样的人。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段多处代词所指及“使……得安息”的逻辑关系并不清楚；译文保留见证稿的含混。
    reason: 提示抄本与句法不确定性，防止读者把暂定译法当作唯一解释。
  - marker: b
    text: “披着人形的动物”及按不同食物喂养的说法是本文的比喻性分类语言；译文不据此断定具体群体或教义等级。
    reason: 保留文本尖锐意象，同时避免加入宗派化解释。
  - marker: c
    text: 本段“人子的儿子”“创造”“生育”“受造物”和“所生的”之间关系复杂，且有缺文；现译仅依所给英文见证稿暂定。
    reason: 标明关键神学段落仍待科普特语源文复核。
  - marker: d
    text: “新房”可能同时具有婚姻、象征及礼仪层面的含义；末句“成为这样的人”所指并不完全明确。
    reason: 保存多义性，不将新房意象限定为某一教义或仪式。
lexical_decisions:
- source_word: faith, hope, love, and knowledge
  choice: 信、望、爱和知识
  rationale: 保留四项并列及农业隐喻的对应关系；“知识”不擅自改释为特定宗派意义的“灵知”。
- source_word: Son of Humanity
  choice: 人子
  rationale: 采用现代中文宗教文献中自然而庄重的固定表达，同时保留“人子的儿子”这一原文刻意形成的张力。
- source_word: create / beget
  choice: 创造／生育
  rationale: 明确区分制作、创造与生命生育；避免把两者都译作“生”，从而抹平本段论证。
- source_word: servant/slave
  choice: 仆人
  rationale: 依照所给审校层采用“仆人”，使现代读者易懂；源语言复核后仍须判断是否应更强地表达受奴役身份。
- source_word: bridal chamber
  choice: 新房
  rationale: 在婚礼语境中自然可懂，并保留其作为隐秘婚姻空间的象征功能；不先行解释为特定礼仪术语。
- source_word: pornography
  choice: 淫秽之事
  rationale: 避免现代媒介意义过强的“色情制品”，表达婚姻被公开剥露后成为猥亵、淫秽景象的意思。
theological_decisions:
- issue: “知识”是否应译作诺斯替传统术语“灵知”
  choice: 正文译“知识”
  alternative: 灵知
  rationale: 当前仅据英文见证稿，尚无直接科普特语复核；用“知识”保存较宽语义，不预先把文本归入特定神学体系。
- issue: “没有……灵魂的人有福了”残缺句的解释
  choice: 严格保留残缺，不补足宾语或修饰语
  alternative: 按上下文补作“没有使灵魂成为重担的人”等解释性译文
  rationale: 抄本缺损使句义不稳；不应以推测消除其困难。
- issue: “完全的人”及“那种本性”
  choice: 保留“完全”与“本性”的开放含义
  alternative: 释为已经得救、属灵成熟或具有基督本性的人
  rationale: 避免导入特定成圣论、救恩论或本体论解释。
- issue: 创造与生育的关系
  choice: 按见证稿保留看似矛盾的命题
  alternative: 调和为创造者不能真正生育、而生育者也能属灵创造
  rationale: 段落本身包含术语张力，翻译不代替作者解决论证。
- issue: 纯洁婚姻与新房意象
  choice: 保持婚姻、亲密与新房的字面象征
  alternative: 直接解释为灵魂与基督联合或某种圣礼
  rationale: 文本可能有象征或礼仪背景，但当前证据不足以在正文中锁定单一教义解释。
