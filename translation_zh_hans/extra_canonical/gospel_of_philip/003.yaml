translation:
  language: zh_hans
  text: '给属世之人的那些名称很会迷惑人，因为它们使人的心从正确的转向不正确的。人听见“上帝”，想到的并不是正确的，反而是不正确的。“父”、“子”、“圣灵”、“生命”、“光”、“复活”、“教会”，以及其余一切名称，也是如此：人所想的不是[正确的]，而是[不]正确的，[除非]他们已经认识了正确的。那些[听见的名称]存在于世上……[迷惑人。它们若存在]于永世[a]，就不会在世上用作名称，也不会被列在属世之物中。它们在永世里有其终结。[b]


    有一个名称在世上无人说出，就是父赐给子的名。这个名高过一切；它是父的名，因为子若没有领受父的名，就不会成为父。[c]有这名的人知道它，却不说出来；没有这名的人则不知道它。然而，真理为我们把名称带进世上，因为没有这些名称，我们就不可能认识真理。真理只有一个，但对我们却成为许多事物，为要借着许多事物，在爱中教导这唯一的真理。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永世”对应见证文本中的“（永恒的）时代”；括号表示译者为说明语义所作的补充。科普特语原文尚待直接复核。
    reason: 说明底本括号及关键时代概念的暂定译法。
  - marker: b
    text: 本段方括号内的字词为残缺处的复原；省略号表示抄本有缺损。末句“它们在永世里有其终结”的确切含义并不明确。
    reason: 如实保存抄本残损和语义不确定性。
  - marker: c
    text: “子……成为父”按现有见证文本直译；这里可能涉及名、身份或父性角色之间的关系，但原句没有进一步解释。
    reason: 避免以某一教义体系消解原句的神学张力。
lexical_decisions:
- source_word: world / worldly
  choice: 世上／属世的
  rationale: 依语境分别表达空间性的“世界中”和性质性的“属于世界”；避免一律译作“世俗”所带来的现代负面伦理色彩。
- source_word: names
  choice: 名称／名
  rationale: 一般概念用“名称”，特指父赐给子的唯一之名时用“名”，既自然又保留段落内部的区别。
- source_word: what's right / what's not right
  choice: 正确的／不正确的
  rationale: 底本文字未提供可支持“真实”“正统”或“善”等更具体解释的直接科普特语证据，故保留宽泛而重复的对照。
- source_word: (eternal) age
  choice: 永世
  rationale: 既表达超越现世的时代，又不直接等同于“永生”或“天堂”；以脚注说明原文证据尚待复核。
- source_word: Truth
  choice: 真理
  rationale: 保留拟人化和神学性的抽象名词；末句依语义补明宾语为“这唯一的真理”，但不将其人格身份进一步界定。
- source_word: church
  choice: 教会
  rationale: 采用现代汉语中最通行的基督教共同体用语，不额外限定为制度、建筑或某一宗派。
theological_decisions:
- issue: 名称与其所指真实之间的关系
  choice: 保留“名称会迷惑，却又是认识真理所不可缺少”的张力
  alternative: 将本段解释为对宗教名称的全面否定，或解释为名称本身准确无误
  rationale: 原段同时批评属世名称的误导性，又说真理把名称带到世上以供人学习；译文不消解这一内在张力。
- issue: “子成为父”
  choice: 直译为“子……成为父”并加脚注提示其解释开放性
  alternative: 改写为“子成为像父一样”或“子显明父”
  rationale: 见证文本的表述明确而神学含义不易确定；改写会提前解决原文保留的难题。
- issue: 不可说出的名
  choice: 不把该名具体认定为任何已知神名或称号
  alternative: 补译为某个希伯来神名、耶稣之名或特定秘名
  rationale: 所给证据只称其为父赐给子的名，没有提供其具体形式。
- issue: “真理只有一个，却成为许多事物”
  choice: 保留一与多的对照
  alternative: 将“许多事物”解释成许多名字、教义、象征或圣礼
  rationale: 上下文容许多种理解，但见证文本并未明确限定所指。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。刻意保留“正确的／不正确的”和“名称”等重复，以再现论述的修辞推进。方括号和省略号均保存抄本残缺或复原信号。本稿以所供公共领域英语见证为临时依据；因科普特语源文审查尚未完成，所有可能依赖科普特词形、句法或抄本读法的决定均属暂定。
