  terminology: “上帝、父、子、圣灵、生命、光、复活、教会、真理”均可保留。“正确的／不正确的”虽有意重复，仍忠实反映所供见证的宽泛对照，不宜擅改为“真实／虚假”或“善／恶”。“（永恒的）时代”保留见证文本括号；不将其教义化为“永生”或“天堂”。
