id: GPHIL.015
reference: Gospel of Philip — Baptism, Chrism, Eucharist, Bridal Chamber
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  text: 'Those who say that they''ll die first and (then) they''ll rise are wrong. If they don''t first receive the resurrection while they''re living, they won''t receive anything when they die. It''s the same when they talk about baptism and they say "Baptism is a great thing," because those who receive it will live.


    Philip the apostle said, "Joseph the carpenter planted a garden because he needed wood for his trade. It was he who made the cross from the trees he planted, and his offspring hung from what he planted. His offspring was Jesus, and the plant was the cross." But the Tree of Life is in the middle of Paradise, and from the olive tree came the chrism, and from that the resurrection.


    This world eats corpses. All that are eaten in it die also. Truth eats life, so no one nourished by [Truth] will die. Jesus came from that place, he brought food from there, and to those who wanted, he gave them [to eat, so that] they won''t die.


    [God …] a Paradise, [human …] Paradise, there are […] and […] of God […] those in [it …] I wish that [Paradise …] they''ll say to me, "[… eat] this," or "don''t eat [that …] wish." The tree of knowledge is the place where I''ll eat everything. It killed Adam, but here it makes humanity live. The Law was the tree. It has the power to give the knowledge of good and evil. It neither kept them from evil nor placed them in the good, but it created death for those who ate from it; because when it said, "Eat this, don''t eat that," it became the beginning of death.


    The chrism is better than baptism, since we''re called "Christians" because of the chrism, not because of baptism. And it was because of the chrism that Christ was named, because the Father anointed the Son, and the Son anointed the apostles, and the apostles anointed us. Whoever is anointed has everything: the resurrection, the light, the cross, the Holy Spirit. The Father gave this to him in the bridal chamber, and he received it. The Father was in the Son and the Son in the Father. This is [the kingdom] of heaven.


    The Lord said [it] well: "Some went to the kingdom of heaven laughing and they came out […] a Christian […] and as soon as [… went down] into the water and he […] everything about […] it''s [a] game, [but … disregard] this […] to the kingdom of [heaven …] if they disregard […] and if they scorn it as a game, [… out] laughing. It''s the same way with the bread and the cup and the oil, though there''s one better than these.


    The world came into being through a transgression, because the one who created it wanted to create it imperishable and immortal. He fell away and didn''t get what he wanted, because the world wasn''t imperishable, and the one who created it wasn''t imperishable; because things aren''t imperishable, but rather children. Nothing will be able to receive imperishability without becoming a child. But whoever can''t receive, how much more will they be unable to give?


    The cup of prayer has wine and water, since it''s laid down as the type of the blood over which they give thanks. It fills with the Holy Spirit, and it belongs to the completely perfect human. Whenever we drink this, we''ll receive the perfect human. The living water is a body. It''s necessary for us to put on the living human. So coming down to the water, they strip themselves so that they''ll put on that one.


    A horse begets a horse, a human begets a human, and a god begets god. It''s the same way with [the groom] and [brides too]. They [come into being] from the […] No Jew […] from […] exists and […] from the Jews […] the Christians […] called these […] "the chosen race of […]" and "the true human" and "the Son of the Human" and "the seed of the Son of the Human." This true race is known in the world. These are the places where the children of the bridal chamber exist.


    In this world, union is between male and female, the place of power and weakness; in the (eternal) age, the union is like something else, but we refer to them by the same names. There are other names, however, that are above every name that''s named, and they''re better than the strong, because where there''s force, there are those who are even more powerful. They''re not (two) different things, but they''re both the same thing. This is what won''t be able to come down upon the fleshly heart.


    Isn''t it necessary for everyone who has everything to know themselves completely? Some who don''t know themselves won''t be able to enjoy what they have, but those who''ve come to understand themselves will enjoy them.


    Not only won''t they be able to bind the perfect human, they won''t be able to see them (the perfect human), because if they see them they''ll bind them. There''s no other way for someone to acquire this grace for themselves [except by] putting on the perfect light [and] becoming the perfect [light. Whoever has put it on] themselves will go […] this is the perfect […] for us to become […] before we came to […] whoever receives everything […] these places, they''ll be able to […] that place, but they''ll [… the middle] as incomplete. Only Jesus knows the end of this one.


    The holy man (priest) is completely holy, down to his (very) body, because if he receives the bread he''ll make it holy, or the cup, or anything else that he takes and purifies. Why won''t he purify the body too?


    As Jesus perfected the water of baptism, that''s the way he poured out death. So we go down into the water, but we don''t go down into death, so that we won''t be poured out into the spirit of the world. When it blows, the winter comes. When the Holy Spirit breathes, the summer comes.


    Whoever knows the truth is a free person, and the free person doesn''t sin, because "whoever sins is the slave of sin." Truth is the Mother, but knowledge is the joining. Those who aren''t given to sin are called "free" by the world. These who aren''t given to sin are made proud by the knowledge of the truth. That''s what makes them free and exalts them over everything. But "love builds up," and whoever has been made free through knowledge is a slave because of love for those who aren''t yet able to attain [the] freedom of knowledge, [but] knowledge makes them able [to] become free. Love […] anything its own […] it […] its own. It never [says "…"] or "this is mine," [but "…] are yours." Spiritual love is wine with fragrance. All those who will anoint themselves with it enjoy it. While those who are anointed stay around, those who are nearby also enjoy it. If those who are anointed with ointment leave them and go, those who aren''t anointed but are only nearby remain in their stench.
    The Samaritan didn''t give anything to the wounded man except wine with oil. It wasn''t anything but the ointment, and it healed the wounds, because "love covers a multitude of sins."


    The children to whom a woman gives birth will look like the man she loves. If it''s her husband, they look like her husband; if it''s an adulterer, they look like the adulterer. Often, if a woman sleeps with her husband because she has to, but her heart is with the adulterer with whom she is intimate and she bears a child, the child she bears looks like the adulterer. But you who exist with the Son of God, don''t love the world; rather, love the Lord, so that those you''ll beget may not come to look like the world, but will come to look like the Lord.


    The human unites with the human, the horse unites with the horse, the donkey unites with the donkey. Species unite [with] similar species. That''s what it''s like when spirit unites with spirit, the [Word] is intimate with the Word, [and light is] intimate [with light. If you] become human, [it''s the human who will] love you. If you become [spirit], it''s the Spirit who will unite with you. [If] you become Word, it''s the Word that will unite with you. If [you] become light, it''s the light which will be intimate with you. If you become one of those from above, those from above will rest upon you. If you become horse or donkey or calf or dog or sheep or any other of the animals which are outside or below, neither human nor spirit nor Word nor light nor those from above nor those inside will be able to love you. They won''t be able to rest within you, and you''ll have no part in them.


    Whoever is an unwilling slave will be able to be made free. Whoever has become free by the grace of their master and has sold themselves (back) into slavery won''t be able to be made free any longer.'
