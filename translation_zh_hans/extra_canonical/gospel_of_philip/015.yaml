  revised_text: '那些说自己要先死、然后才复活的人错了。他们若不在活着的时候先领受复活，死时就什么也领受不到。谈到洗礼也是一样：他们说“洗礼是一件大事”，因为领受洗礼的人将要活着。


    使徒腓力说：“木匠约瑟栽了一个园子，因为他的手艺需要木料。正是他用自己所栽的树做成了十字架，而他的后裔悬在他所栽的木头上。他的后裔就是耶稣，那植物就是十字架。”然而，生命树在乐园中央；傅油礼[a]出自橄榄树，复活又出自傅油礼。


    这个世界吞吃尸体；凡被它吞吃的，也都死去。真理以生命为食，所以凡由〔真理〕滋养的，都不会死。耶稣从那地方来，把那里的食物带来，给了那些愿意的人〔吃，使〕他们不至于死。


    〔上帝……〕一个乐园，〔人……〕乐园，其中有〔……〕和〔……〕上帝的〔……〕那些在〔其中……〕我希望〔乐园……〕他们会对我说：“〔……吃〕这个”，或“不要吃〔那个……〕希望。”知识树是我要吃一切的地方。它杀死了亚当，但在这里，它使人类活着。律法就是那棵树。它有使人知道善恶的能力；它既没有阻止他们行恶，也没有把他们安置在善中，反而为吃它的人造成了死亡。因为它一说“吃这个，不要吃那个”，就成了死亡的开端。


    傅油礼胜过洗礼，因为我们称为“基督徒”，是由于傅油，而不是由于洗礼。基督也是因傅油而得名[b]：父膏了子，子膏了使徒，使徒又膏了我们。凡受膏的人拥有一切：复活、光、十字架、圣灵。父在洞房[c]里把这一切赐给他，他也领受了。父在子里面，子也在父里面。这就是〔天〕国。


