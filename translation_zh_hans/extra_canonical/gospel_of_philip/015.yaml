translation:
  language: zh_hans
  text: '那些说自己要先死、然后才复活的人错了。他们若不在活着的时候先领受复活，死时就什么也领受不到。谈到洗礼也是一样：他们说“洗礼是一件大事”，因为领受洗礼的人将要活着。


    使徒腓力说：“木匠约瑟栽了一个园子，因为他的手艺需要木料。正是他用自己所栽的树做成了十字架，而他的后裔悬在他所栽的木头上。他的后裔就是耶稣，所栽的则是十字架。”然而，生命树在乐园中央；傅油礼[a]出自橄榄树，复活又出自傅油礼。


    这个世界吞吃尸体；凡被它吞吃的，也都死去。真理吞吃生命，所以凡以〔真理〕为食的，都不会死。耶稣从那地方来，把那里的食物带来，给了那些愿意的人〔吃，使〕他们不至于死。


    〔上帝……〕一个乐园，〔人……〕乐园，其中有〔……〕和〔……〕上帝的〔……〕那些在〔其中……〕我希望〔乐园……〕他们会对我说：“〔……吃〕这个”，或“不要吃〔那个……〕希望。”知识树是我要吃一切的地方。它杀死了亚当，但在这里，它使人类活着。律法就是那棵树。它有使人知道善恶的能力；它既没有阻止他们行恶，也没有把他们安置在善中，反而为吃树上果子的人造成了死亡。因为它一说“吃这个，不要吃那个”，就成了死亡的开端。


    傅油礼胜过洗礼，因为我们称为“基督徒”，是由于傅油，而不是由于洗礼。基督也是因傅油而得名[b]：父膏了子，子膏了使徒，使徒又膏了我们。凡受膏的人拥有一切：复活、光、十字架、圣灵。父在洞房[c]里把这一切赐给他，他也领受了。父在子里面，子也在父里面。这就是〔天〕国。


    主说得好：“有些人笑着进了天国，又出来〔……〕一个基督徒〔……〕一旦〔……下到〕水里，他就〔……〕关于一切〔……〕这是〔一场〕游戏，〔可是……轻忽〕这〔……〕到〔天〕国〔……〕如果他们轻忽〔……〕又把它当作游戏而蔑视，〔……出来〕时就笑着。”饼、杯和油也是这样，不过还有一样胜过这些。


    世界因一次越界而形成，因为那创造世界的想把它造得不朽、不死。他却堕落了，没有得到自己所想要的；因为世界并非不朽，创造世界的也并非不朽。不朽的并不是事物，而是儿女。若不成为儿女，就没有什么能领受不朽；但那不能领受的，又怎能给予呢？


    祷告之杯里有酒和水，因为它被设立为那血的表样；人们为这血献上感谢。它充满圣灵，属于完全完美的人。每当我们喝这杯，就会领受那完美的人。活水是一个身体。我们必须穿上那活着的人。因此，人下到水里时脱去衣服，为要穿上那一位。


    马生马，人生人，神生神。〔新郎〕和〔新娘们〕也是如此。他们〔产生〕于〔……〕没有犹太人〔……〕从〔……〕存在，而〔……〕从犹太人〔……〕基督徒〔……〕称这些人为〔……〕“〔……〕的蒙选族类”、“真正的人”、“人子”和“人子的后裔”。这个真正的族类在世上为人所知。这些地方就是洞房之子所在之处。


    在这个世界，结合发生在男与女之间，是力量与软弱之所在；在那〔永恒的〕世代[d]，结合却是另一种样子，只是我们仍用相同的名称来称呼。其实还有别的名称，超越一切被称出的名，也胜过强者；因为哪里有力量，哪里就有更强大的存在。它们并非两个不同的事物，而同是一个事物。这是血肉之心所不能领受的。


    凡拥有一切的人，岂不都必须彻底认识自己吗？有些人不认识自己，就不能享用自己所有的；但那些已经认识自己的人，必能享用这一切。


    他们不但不能捆绑那完美的人，甚至不能看见他；因为他们若看见他，就会把他捆绑起来。人若要为自己获得这恩典，除非穿上完全的光，并成为完全的〔光，否则别无他法。凡把它穿在〕自己身上的人将去〔……〕这是完全的〔……〕使我们成为〔……〕在我们来到〔……〕以前，凡领受一切的人〔……〕这些地方，他们就能〔……〕那地方，但他们会〔……中间〕仍不完全。只有耶稣知道这一位的终局。


    圣者（祭司）全然圣洁，甚至身体也是如此。因为他若拿起饼，就会使饼成圣；拿起杯，或拿起任何别的东西加以洁净，也是如此。他又为什么不会使身体洁净呢？


    耶稣怎样使洗礼之水达到完全，也照样倾倒了死亡。因此，我们下到水里，却不是下到死亡里，免得我们被倾倒进这世界的灵中。这灵吹动时，冬天就来；圣灵吹气时，夏天便来。


    认识真理的人是自由人；自由人不犯罪，因为“凡犯罪的，就是罪的奴隶”。真理是母亲，知识则是结合。那些不受罪支配的人，被世人称为“自由人”。这些不受罪支配的人，因认识真理而自高；这认识使他们自由，又把他们高举在万有之上。然而，“爱能造就人”。那借着知识得自由的人，却因爱那些尚不能达到知识之〔自由〕的人而成为奴仆；但知识使他们能〔成为〕自由人。爱〔……〕任何东西归自己〔……〕它〔……〕自己的。它从不〔说“……”〕或“这是我的”，〔而说“……〕是你们的”。属灵的爱是芬芳的酒。凡以它膏抹自己的人都享受它。受膏的人留在近旁时，身边的人也一同享受；若那些受香膏的人离开了，只在旁边却没有受膏的人，就仍留在自己的臭气中。


    那撒玛利亚人给受伤者的，只有酒和油。那无非就是香膏，却医好了伤口，因为“爱遮盖许多的罪”。


    妇人所生的孩子，会像她所爱的男人。她若爱丈夫，孩子就像丈夫；她若爱奸夫，孩子就像奸夫。妇人常常是出于不得已才与丈夫同寝，心里却惦念着同她亲近的奸夫；她若生下孩子，所生的就像奸夫。但你们这些与上帝的子同在的人，不要爱世界，倒要爱主，使你们所生的不像世界，而像主。


    人与人结合，马与马结合，驴与驴结合；同类与相似的同类结合。灵与灵结合，〔道〕与道亲近，〔光也〕与〔光〕亲近，正是如此。〔你若〕成为人，〔人就会〕爱你；你若成为〔灵〕，灵就会与你结合；〔你若〕成为道，道就会与你结合；你若成为光，光就会与你亲近；你若成为上面来的那些存在之一，上面来的就会安住在你身上。你若成为马、驴、牛犊、狗、羊，或外面、下面的任何别种动物，那么，无论人、灵、道、光，还是上面来的、里面的，都不能爱你，也不能安住在你里面；你在他们之中不会有份。


