    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/005.yaml
  text: 'Some say, “Mary conceived by the Holy Spirit.” They are wrong; they do not know what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Instead, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house, but do not steal anything from the Father’s house or carry it away.”'
translation:
  language: zh_hans
  text: '有人说：“马利亚由圣灵怀了孕。”他们错了；他们不知道自己在说什么。女人何曾由女人怀孕呢？“马利亚是未受任何权势玷污的童女”，这是那些成为（第一批）使徒和（后来的）使徒传承者的希伯来人所作的重大见证。那未受任何权势玷污的童女……众权势却玷污了自己。


    而且，主若不是另有一位父亲，就[不会]说：“我[在天上的父]”；他只会说：[“我的父亲。”] 主对[门徒]说：“……从各[家]带到父的家里，但不要从父的家里偷取任何东西，也不要把它带走。”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号表示抄本残损处的补拟文字；省略号表示原文有缺失。括号中的“第一批”“后来的”“传承者”属于所据英文见证的解释性补足。本段目前依据公共领域英文见证起草，尚待直接核对科普特语抄本。
    reason: 明确底本限制，并保存抄本残损、复原及解释性补足的层次。
lexical_decisions:
- source_word: Holy Spirit
  choice: 圣灵
  rationale: 采用现代汉语宗教文献中通行且庄重的对应语；此处关于语法性别的论证保留在上下文中，不另作解释性改写。
- source_word: power / powers
  choice: 权势／众权势
  rationale: 保留单复数对照及可能兼具超自然力量、统治势力之意的含混性，避免窄化为单纯的“能力”或特定等级的灵体。
- source_word: defiled
  choice: 玷污
  rationale: 保留原见证中身体、礼仪或属灵层面的多义张力，并维持重复用词。
- source_word: apostles
  choice: 使徒
  rationale: 采用通行译名。
- source_word: apostolic (successors)
  choice: 使徒传承者
  rationale: 括号内容来自见证的解释性补足；译文保留括号，并避免采用可能带入特定宗派制度的专门称谓。
- source_word: Father / father
  choice: 父／父亲
  rationale: 在引语及“父的家”中用庄重简洁的“父”；在论证一般父子关系处用“父亲”，同时保留大小写无法由中文呈现所造成的含混。
theological_decisions:
- issue: “女人由女人怀孕”所依据的圣灵性别论证
  choice: 直译其反问，不补充说明或调和
  alternative: 将其解释为科普特语中“灵”为阴性，或改写以符合后世三一论表述
  rationale: 文本有意提出争辩；译文应保存其神学张力，而不替作者解决或纠正。
- issue: “另有一位父亲”与“天上的父”的关系
  choice: 保留“另有一位父亲”的直陈及残缺标记
  alternative: 明确解释为地上的父亲、养父或属灵父亲
  rationale: 现有见证并未消除所指的歧义，且直接科普特语复核尚未完成。
- issue: 童女与众权势的玷污对照
  choice: 重复“玷污”，保留悖论式对照
  alternative: 分别译作“侵犯”和“败坏”以使逻辑更顺畅
  rationale: 同词复现可能承载作者的修辞和神学意味，不宜静默拆分。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留反问、重复、括号、方括号与省略号，不擅自修补残文或消解神学冲突。因直接科普特语审校尚待进行，本稿为基于所供公共领域英文见证的暂定译文。
