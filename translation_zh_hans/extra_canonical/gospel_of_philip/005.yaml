    text: 方括号表示抄本残损处的补拟文字；省略号及“[…]”表示原文有缺失。圆括号中的“第一批”“使徒的”“继承者”保留所据英文见证的解释性补足及其不确定性。本段目前依据公共领域英文见证起草，尚待直接核对科普特语抄本。
    reason: 说明残损、复原和解释性补足的不同层次；删去英文见证未提供的“后来的”。
  revision_rationale: 修订删除无来源的时间性增译“后来的”，以“使徒的（继承者）”保留英文见证中“apostolic (successors)”的限定关系和括号不确定性。末句按见证重置方括号及省略号，避免把残缺命令过度补全；同时微调“天上的父”引语，使现代汉语更自然而不消除其残缺性或“另一位父亲”的歧义。
