review_pass:
  verdict: revise
  source_fidelity: 整体忠实保留了英文见证的论辩、重复语汇、残缺信号及关键歧义。但“（后来的）”并非所供见证的括号补足，给“apostolic (successors)”加入了时间次序；末句也把受损的命令句过度整理为较完整的汉语结构。
  naturalness: 译文总体庄重、清楚。将“my [Father who is in] heaven”译为“我[在天上的父]”虽可理解，但略显生硬；“使徒传承者”也不如“使徒的（继承者）”直接反映见证所保留的措辞与括号层次。
  terminology: “圣灵”“权势／众权势”“玷污”“使徒”均合宜。保留“父”与一般性的“父亲”的区分亦可。应删去无依据的“后来的”，并以不预设制度化传承的措辞处理“apostolic (successors)”。
  issues:
  - severity: medium
    issue: “（后来的）”属于无依据的增译。
    rationale: 英文见证为“(the first) apostles and (the) apostolic (successors)”，只以括号标出“the first”“the”及“successors”；并未称后者为“后来的”。这会把可能的时间关系加入文本。
  - severity: medium
    issue: “使徒传承者”弱化并改组了“apostolic (successors)”的括号和限定关系。
    rationale: 该译法容易暗示固定的宗派性传承制度，也未明确保留“继承者”本身是补拟。宜译作“使徒的（继承者）”，并在注释说明这是英文见证的解释性补足。
  - severity: low
    issue: 末句残缺处被略微顺译。
    rationale: 见证在引语开头及“[from]”处均有损缺／补拟；译文应以方括号和省略号更紧密对应，避免看似补出了完整命令。
  - severity: low
    issue: 脚注对括号补足的说明包含“后来的”。
    rationale: 须随正文修订，避免把未见于英文见证的解释说成底本补足。
  revised_text: '有人说：“马利亚由圣灵怀了孕。”他们错了；他们不知道自己在说什么。女人何曾由女人怀孕呢？“马利亚是未受任何权势玷污的童女”，这是那些成为（第一批）使徒和（使徒的）（继承者）的希伯来人的重大见证。那未受任何权势玷污的童女[…]众权势玷污了自己。


    而且，主若非另有一位父亲，就[不会]说：“我[在]天上的父”；否则，他只会说[：“我的父。”]主对[门徒说：“…][从]每[家]带进父的家里，但不要从父的家里偷取任何东西，也不要把它带走。”[a]'
  revised_footnotes:
