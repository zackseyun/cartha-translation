    reason: 源语言审查尚待完成，不应把可能不稳的英文措辞过度具体化。
lexical_decisions:
- source_word: Hebrew
  choice: 希伯来人
  rationale: 保留文本对群体身份的明确称谓，并与末段的自我叙述相呼应。
- source_word: creates
  choice: 造就
  rationale: 此处所指可能不只是生育，也可能包括形成同类身份；“造就”保留较宽的语义范围。
- source_word: proselyte
  choice: 归信者
  rationale: 表达转而归入某一宗教群体的人，避免使用带有特定现代宗派制度色彩的术语。
- source_word: slave
  choice: 奴隶
  rationale: 与主人、自由及产业形成法律和社会身份上的鲜明对照；不弱化为一般的“仆人”。
- source_word: inherit / inheritance
  choice: 承受／产业
  rationale: 保留继承关系的核心意象，同时使父子与产业的表述符合现代汉语。
- source_word: gentile
  choice: 外邦人
  rationale: 采用中文宗教文献中通行而较易理解的群体称谓。
- source_word: Truth
  choice: 真理
  rationale: 保留其抽象且可能具人格化或神学含义的表达，不另行解释其所指。
- source_word: gentrified
  choice: 被改造
  rationale: 英文见证用词异常；在科普特文直接复核尚未完成前，采用较宽泛的表达，避免误植现代社会学意义的“士绅化”。
theological_decisions:
- issue: “活者／死者”究竟指肉身状态、属灵状态，还是两者兼有
  choice: 反复直译为“活者／死者”或“活的／死的”
  alternative: 解释为“属灵活着的人／灵性死亡的人”
  rationale: 原段刻意交叠生命、死亡与继承的意象；译文不替作者消解这种张力。
- issue: 外邦人“不会死，因为从未活过”
  choice: 保留表面悖论
  alternative: 补明为“在属灵意义上从未活过”
  rationale: 原文没有明说是哪一种生命；补入“属灵”会把解释写进正文。
- issue: “父亲和母亲”的所指
  choice: 只译亲属称谓，不作身份判定
  alternative: 将父母解释为特定神圣实体、群体或仪式
  rationale: 本段没有明示所指，不宜导入特定教派或解释传统。
- issue: “自基督来的那一天起”的时间与生命关系
  choice: 译为“因为自基督来的那一天起，他们就是活的”
  alternative: 改写成“基督来临使他们获得了生命”
  rationale: 保留原有因果和时间关系，而不额外规定基督来临与得生命之间的机制。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。保留短句、排比、悖论和继承意象，不用解释性增译来消除神学歧义。底本信息明确说明科普特文审查尚待完成，因此本稿属于依据公共领域英文见证形成的暂定源据稿；方括号和省略号均按见证文本保留。
