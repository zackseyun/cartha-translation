translation:
  language: zh_hans
  text: '希伯来人造就希伯来人，这一类人称为“归信者”。但[归信者]不能再造就一个归信者。他们如同……，并造就别人……；对他们来说，能够得以产生，也就够好了。[a]


    奴隶只求自由，并不求主人的产业。儿子却不只是儿子；他还要求承受父亲的产业。承受死者的，自己也是死的，所承受的也是死者。承受活者的，自己也是活的，所承受的既有活者，也有死者。死人不能承受什么，因为死人怎能承受呢？死人若承受活者，就不会死；相反，死人会活得更加丰盛！外邦人不会死，因为他们从未活过，也就无从死去。凡信了真理的人都已经活了，也有死亡的危险，因为自基督来的那一天起，他们就是活的。世界被创造，城邑被改造，死人被抬出去。[b]


    我们作希伯来人的时候，是没有父亲的——我们只有母亲。但我们成为基督徒以后，就有了父亲，也有了母亲。'
  philosophy: optimal-equivalence
  footnotes:
