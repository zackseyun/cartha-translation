    奴隶只求自由，并不求主人的财产。儿子却不只是儿子；他把父亲的遗产归为己有。继承死者的，自己也是死的，所继承的也是死者。继承活者的，自己也是活的，所继承的既有活者，也有死者。死人不能继承任何事物，因为死人怎能继承呢？死人若继承活者，就不会死；死人反会更为活着！外邦人不会死，因为他们从未活过，也就无从死去。凡信了真理的人都已经活了，也有死亡的危险，因为自基督来到的那一天起，他们就是活的。世界被创造，城邑被改造，死人被抬出去。[b]



    我们作希伯来人的时候，是没有父亲的——我们只有母亲。但我们成为基督徒以后，就有了父亲，也有了母亲。'
