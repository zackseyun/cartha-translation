  footnotes:
  - marker: a
    text: 本段“马利亚”的指称含混；“伴侣”并不在译文中预先判定为婚姻配偶。
    reason: 保留人物指称与关系术语的真实歧义。
  - marker: b
    text: “双重的名”和复数“他们”依现有英语见证保留；其准确语法关系仍须直接核对科普特文。
    reason: 提示源语复核尚未完成，并避免将含混之处体系化。
  - marker: c
    text: “它”在现有见证中可能指“灵”，但句中“燃烧”和“熄灭”的主语也不明确。
    reason: 标明代词与主语的双重含混。
  - marker: d
    text: “埃卡莫特”和“埃克莫特”是两个近似名称的音译；拼写与词源有待科普特文复核。
    reason: 说明音译依据有限，避免把暂定形式当作确定源语结论。
lexical_decisions:
- source_word: heavenly human / earthly human / perfect human
  choice: 天上之人／地上之人／完全之人
  rationale: 保留反复出现的“人”这一核心称谓及三者之间的对应关系，不擅自解释为某个特定神学体系中的专名。
- source_word: begotten / beget
  choice: 被生出来／生出／所生
  rationale: 依句法调整为自然汉语，同时尽量保留同一生育词群的反复；涉及灵性出生之处不改译为“创造”或“重生”，避免消解原文张力。
- source_word: physically
  choice: 按肉身
  rationale: 比“身体上”更符合宗教语境中的自然现代汉语，也保留与另一种出生方式的对照。
- source_word: the Word
  choice: 圣言
  rationale: 以“圣言”表达具位格或神学意味的 Word，同时避免普通“话语”可能造成的弱化。
- source_word: companion / partner
  choice: 伴侣
  rationale: 同一段中两个英文词可能反映相关但未必完全相同的源词；现有证据不足，统一采用较宽泛且不预断婚姻关系的“伴侣”。
- source_word: powers
  choice: 权势
  rationale: 保留超自然或宇宙论实体的可能性，而不简化为普通政治“势力”。
- source_word: Wisdom
  choice: 智慧
  rationale: 保留女性代词线索并以“智慧”呈现，不额外音译为索菲亚，以免加入解释。
- source_word: Echamoth / Echmoth
  choice: 埃卡莫特／埃克莫特
  rationale: 按音译区分两个近似名称，保留文本刻意建立的对照。
theological_decisions:
- issue: “马利亚”在姊妹、母亲与伴侣三重身份中的所指
  choice: 照录三重称谓，不判定每一处是否指同一历史人物
  alternative: 通过补入不同的马利亚或象征性身份来消除表面矛盾
  rationale: 原段本身具有指称与象征层面的张力；现有见证与尚待进行的科普特文复核不足以安全消解。
- issue: “圣灵”是“双重的名”及随后复数代词
  choice: 保留“双重”与“他们”
  alternative: 将复数统一解释为父、子、圣灵三者，或将其改为单数
  rationale: 原有英语见证呈现语法和神学上的含混；译文不替作者完成体系化解释。
- issue: 由灵所生者“借着它”走入迷途
  choice: 保留代词指向灵的表面可能，并加注其歧义
  alternative: 改译为“虽有圣灵仍走迷途”或将代词另指某种力量
  rationale: 这句话形成明显的神学张力，不应在缺乏直接源语审查时悄然缓和。
- issue: 亲吻带来受孕和出生
  choice: 直译其生育隐喻
  alternative: 解释性改译为借礼仪亲吻领受属灵生命
  rationale: 文本可能同时具有礼仪、象征及群体实践含义；译文保留其开放性。
- issue: “小智慧”与死亡的智慧
  choice: 保留名称和定义，不附加诺斯替体系解释
  alternative: 将其明确等同于某一特定流溢体或宇宙论角色
  rationale: 避免输入宗派性或某位解释者的私人体系。
