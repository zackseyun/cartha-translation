base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/010.yaml
  text: 'Some animals submit to humans, such as the calf, the donkey, and others of this kind. Others are not submissive and live alone in the wilderness. Humanity plows the field with the submissive animals and, consequently, nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plow with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers—those that are submissive, those that [aren''t], and those that are alone—because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
translation:
  language: zh_hans
  text: '有些牲畜顺服人，例如牛犊、驴，以及其他同类的牲畜。另一些却不顺服，独自生活在旷野。人用顺服的牲畜耕田，因而养活自己，也养活牲畜，无论是顺服的还是不顺服的。完全的人也是这样：他们用顺服的权能耕作，为一切将要存在的预备所需。因此，整个地方得以维持，无论善的、恶的，右边的、左边的，都是如此。圣灵牧养所有的，并统管一切权能——顺服的、[不顺服的]，以及独处的——因为圣灵确实把它们……限制住，[以致即使它们……]想要，也不能[离开]。[a]


    [那受造的已经]成形，[固然美好；但]你会发现，他的儿女只是高贵的形体。假如他不是受造而是受生的，你就会发现他的后裔是高贵的。可如今，他是受造的，却又生育了。这算什么高贵呢？先有通奸，随后有凶杀；他（该隐）是在通奸中所生，因为他是蛇的儿子。因此，他也像自己的父亲一样成了凶手，杀了他的兄弟（亚伯）。凡不同类者之间的结合，都是通奸。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段末句的抄本残缺。“……”表示文字缺失，方括号表示据上下文补出的字句；现存内容不足以确定完整句法。
    reason: 提示读者此处意义不完整，避免把补文当作确定原文。
  - marker: b
    text: 本段关于该隐“是蛇的儿子”及“不同类者之间的结合”的说法，按本文自身表述保留；“不同类”具体指什么，现存段落没有明说。
    reason: 保存文本独特的神学张力，同时避免将歧义强行归入某一解释体系。
lexical_decisions:
- source_word: submit / submissive
  choice: 顺服／顺服的
  rationale: 保留贯穿动物与“权能”的对应关系；用于动物时略带拟人色彩，但比“驯服”更能维持原文反复出现的同一概念。
- source_word: perfect human
  choice: 完全的人
  rationale: 保留该文献具有术语意味的“perfect”，不擅自释为“成熟者”“得救者”或特定教派称谓。
- source_word: powers
  choice: 权能
  rationale: 兼顾超自然或宇宙性力量的可能含义，避免缩窄为世俗“权力”或明确指定为某类灵体。
- source_word: the whole place
  choice: 整个地方
  rationale: 原表达所指不明，直译以保存其空间性及宇宙论上的可能歧义，不改写为“世界”或“万有”。
- source_word: formed / begotten
  choice: 受造／受生
  rationale: 保留两种起源方式的对照；“成形”另用于后文与“形体”的文字联系。
- source_word: forms
  choice: 形体
  rationale: 与“成形”形成词义呼应，同时不把它解释为柏拉图式“理念”。
- source_word: seed
  choice: 后裔
  rationale: 上下文论及生育和儿女，此处取自然汉语义；仍保留血统、出身的含义。
- source_word: partnership
  choice: 结合
  rationale: 表达关系或联合而不限定为婚姻、性行为或商业伙伴关系；上下文中的“通奸”意象仍清楚可见。
- source_word: dissimilar
  choice: 不同类者
  rationale: 保留类别不相同的强烈判断，避免擅自解释为道德、族群、性别或属灵身份上的差异。
theological_decisions:
- issue: 圣灵与诸权能的关系
  choice: 译作“牧养所有的，并统管一切权能”，包括顺服、不顺服和独处者
  alternative: 将“所有的”限定为人，或把“权能”明确译成邪灵、天使等
  rationale: 见证文本没有清楚限定对象类别，应保留圣灵普遍牧养与统管的张力。
- issue: 该隐的出身
  choice: 直译为“他是蛇的儿子”
  alternative: 将其比喻化为“属蛇的人”或协调为创世记中的亚当之子
  rationale: 文本明确提出自身的神话性或神学性说法，翻译不应为与正典传统协调而消解它。
- issue: “通奸”的范围
  choice: 保留末句绝对化表述“凡不同类者之间的结合，都是通奸”
  alternative: 加上道德限定或解释为特定宇宙论层级之间的混合
  rationale: 原文的尖锐概括及其确切所指均应保存，不在正文中替作者解决。
- issue: 受造与受生的对照
  choice: 维持其评价上的张力和反问语气
  alternative: 解释为创造论、基督论或某种灵性谱系教义
  rationale: 现有见证不足以确认专门教义指向，故不作宗派化展开。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。因尚未完成科普特文直接复核，本稿属于依据所给公共领域英译见证制作的暂定译稿；严格保留方括号、删节号及破损信号。代词方面，以“他们”承接“完全的人”的类称用法；提到圣灵时重复“圣灵”，避免汉语“它／他”造成不必要的位格或语法判断。
