  terminology: “奥秘”“污秽的灵”“魂”“悖逆”“婚房”“形象”“天使”均可保留。“混合”比“交合”更贴近英文 witness 的 mingle，避免将该词预先限定为性行为；后文明确的性侵扰语境仍照实译出。
  issues:
  - severity: high
    issue: 首段补字与残缺标记没有逐项保留
    rationale: 英文见证中的[The]、[is]、[without]、[the]、[intimate …]、[defilement]均是文本状态信息。草稿只保留省略号，且把方括号范围改写或删除，违背暂定桥梁译文须保留见证不确定性的要求。
