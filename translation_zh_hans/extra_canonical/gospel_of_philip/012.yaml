  source_fidelity: 需修订。首段的方括号是英文见证明确标示的补字/残缺范围，草稿多处未在中文正文保留，且将残缺短语重组为较确定的汉语句法。末句“[male]”的方括号也被遗漏。后段基本忠实；但“新郎与新娘”应保持为对所领受之男女力量的同位说明，而非改述为“就是婚房的形象”。
