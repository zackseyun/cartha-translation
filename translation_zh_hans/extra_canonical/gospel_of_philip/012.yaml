translation:
  language: zh_hans
  text: '婚姻的奥秘是伟大的[a]，因为没有它，世界就不会存在；因为世界的构造……，而构造……婚姻。想一想那被玷污的亲密……，因为它有……力量。它的形象存在于一种玷污之中。[b]


    污秽的灵取男性和女性的形态。男性的灵与那些住在女性形体中的魂亲近；女性的灵则借着悖逆，与那些住在男性形体中的魂交合。人若没有领受一种男性的力量和一种女性的力量——新郎与新娘——就是婚房的形象，就无法逃脱它们的捆绑。


    愚昧的女性之灵看见一个男人独自坐着，就扑到他身上，戏弄他，玷污他。同样，愚昧的男性之灵看见一个美丽的女人独自坐着，就诱惑并强迫她，想要玷污她。但它们若看见丈夫和妻子坐在一起，女性之灵就不能进入丈夫里面，男性之灵也不能进入妻子里面。形象与天使联合时也是这样：没有谁敢进入男性或女性里面。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段所据抄本有多处残损；方括号内的词在所据英文见证中表示补足的文字，省略号表示无法复原或缺失的内容。由于目前尚未完成科普特文复核，此译文属暂定稿。
    reason: 交代文本状况、补字性质及翻译依据的限制。
  - marker: b
    text: 本段开头数句残缺严重，“构造”“亲密”“玷污”等词之间的确切句法关系无法从现有英文见证确定，因此未补写隐含主语或论证。
    reason: 防止读者把残篇误读为连贯且确定的完整命题。
  - marker: c
    text: “进入”在此可能带有侵入、控制、污秽或附着等含义；“形象与天使联合”所指也不明确，故正文保留较直译的表达。
    reason: 保存原段落的语义与神学含混性。
lexical_decisions:
- source_word: mystery of marriage
  choice: 婚姻的奥秘
  rationale: 保留“奥秘”这一宗教性术语及其与婚姻的直接关系，不将其解释为普通秘密或特定教派礼仪。
- source_word: structure
  choice: 构造
  rationale: 原见证文本残缺且语义不稳；“构造”可兼顾秩序、组成和维系方式，不擅自补足所缺论证。
- source_word: impure spirits
  choice: 污秽的灵
  rationale: 采用自然而庄重的现代汉语，并与后文“玷污”形成词义呼应。
- source_word: souls
  choice: 魂
  rationale: 使用“魂”以区别于文中的“灵”，保留两类实体在论述中的区分。
- source_word: through disobedience
  choice: 借着悖逆
  rationale: 保留行为或状态的宗教伦理意味，同时不明确其所悖逆的对象。
- source_word: bridal chamber
  choice: 婚房
  rationale: 简洁呈现新郎、新娘结合的场所和象征；不预先判定它是否指某种圣礼。
- source_word: image
  choice: 形象
  rationale: 保留原文可能兼具表征、对应物或属灵映像的开放含义，避免具体化为“象征”或“原型”。
- source_word: angel
  choice: 天使
  rationale: 采用通常对应词，不将其扩释为守护者、属天伴侣或其他特定神学身份。
- source_word: go inside
  choice: 进入……里面
  rationale: 保留原见证文本刻意而含混的空间性表达，不弱化为“侵害”或强化为附身术语。
theological_decisions:
- issue: 婚姻是否明确指普通婚姻或神秘礼仪
  choice: 沿用“婚姻”与“婚房”的表层措辞，不作教义性界定
  alternative: 译成“婚房圣礼”或明确解释为属灵结合
  rationale: 现有依据只是英语公开见证，且科普特文复核待定；文本本身容许现实婚姻、象征形象及仪式背景之间的张力。
- issue: 男性力量与女性力量的性质
  choice: 直译为“男性的力量”和“女性的力量”
  alternative: 解释为男性本质、女性本质，或特定属灵实体
  rationale: 避免把含混的“power”本体化，也不引入性别神学体系。
- issue: 形象与天使联合
  choice: 保留“形象与天使联合”
  alternative: 解释为人的灵魂与守护天使结合
  rationale: 原见证没有明确说明“形象”和“天使”的身份；应保留其神学张力。
- issue: 污秽之灵进入男女的含义
  choice: 保留“进入……里面”的表达
  alternative: 明确译为附身、性交、诱惑或控制
  rationale: 上下文同时具有性、属灵和侵入性意象，单一解释会消除原文的多义性。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。首段严格保留残缺与补足标记；后段为避免汉语中“男性/女性”究竟指人还是灵的歧义，在若干处补出“之灵”，但不改变其男性、女性形态的设定。整体以所给公共领域英文见证为暂定桥梁，尚不能声称已经完成原科普特文校勘。
