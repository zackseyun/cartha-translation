translation:
  language: zh_hans
  text: '掌权者想要欺骗人类，因为他们看出人类与那些真正良善者有亲缘关系。他们把良善者的名号拿来，加在那些不良善者身上，借这些名号欺骗人类，把他们捆绑在那些不良善者那里。随后，他们竟还给人类这样的“恩惠”：把他们从那些不良善者那里带走，安置在那些良善者中间！掌权者知道自己在做什么，因为他们想把自由的人夺来，使他们永远为奴。


    有一些权势存在，[…]人类，不愿他们得[救]，好让他们可以[…]；因为人类若[得救]，献祭就[不会]发生，[…]也不会把动物献给那些权势，因为接受祭物的本是动物。祭牲被献上时是活的，献上之后却死了。一个人死着被献给上帝，却活了。[a]


    基督来临以前，世上没有饼；正如亚当所在的乐园，虽有许多树木供动物取食，却没有麦子供人类食用。人类从前像动物一样吃食；但当基督——那完美的人——来临时，他从天上带来饼，使人类得以用属于人类的食物得到喂养。[b]


    掌权者以为，他们所做的一切是凭自己的能力和意志；然而，圣灵正暗中借着他们成就自己所愿的一切。从起初就存在的真理撒播在各处；许多人看见它被撒下，却很少有人看见它被收割。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段的方括号与省略号表示抄本残损或译者补足之处；残缺使若干句子的语法关系和确切意思无法确定。
    reason: 提示文本状态，并说明残损对理解祭祀段落的影响。
  - marker: b
