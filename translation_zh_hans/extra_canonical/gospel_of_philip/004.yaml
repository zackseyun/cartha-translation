    reason: 保留比喻的开放性，避免把可能的象征意义固定为单一教义。
lexical_decisions:
- source_word: rulers
  choice: 掌权者
  rationale: 保留这类文献中超世权势的含义，同时不把其身份过度具体化为某一套后来的神学体系。
- source_word: humanity
  choice: 人类
  rationale: 以现代、包容且自然的汉语表达集体性的人，不缩窄为男性。
- source_word: kinship
  choice: 亲缘关系
  rationale: 保留关系本体上的亲近含义，不擅自改释为仅仅相似、归属或属灵血统。
- source_word: powers
  choice: 权势
  rationale: 与“掌权者”有所区分，并保留超人间力量或统治势力的开放性。
- source_word: bread
  choice: 饼
  rationale: 既可指日常粮食，也保留本段从天而来的食物意象；比“面包”更具经文语体而仍为现代读者所懂。
- source_word: perfect human
  choice: 完美的人
  rationale: 直译其完整、完善之意，不预先限定为道德无罪、原型人或其他特定教义解释。
- source_word: Truth
  choice: 真理
  rationale: 保留抽象概念可能被人格化的张力，不额外添加称谓或代词。
- source_word: Holy Spirit
  choice: 圣灵
  rationale: 采用现代汉语基督教文献中通行而庄重的名称。
theological_decisions:
- issue: 掌权者所谓“恩惠”的语气
  choice: 以引号和感叹号呈现反讽：“恩惠”
  alternative: 按字面陈述为真实的恩惠
  rationale: 上下文说掌权者意在欺骗并使自由者永远为奴，因此此处明显带反讽；引号帮助现代读者听出语气，却不改写句意。
- issue: “一个人死着被献给上帝，却活了”的所指
  choice: 保留“一个人”的不确定指称
  alternative: 明确译为基督被献上并复活
  rationale: 文本形成强烈的基督论联想，但本句本身未明说姓名；不把暗示提升为明示。
- issue: 圣灵借掌权者行动与掌权者责任之间的张力
  choice: 并列保留掌权者自以为自主、圣灵暗中成就旨意两层陈述
  alternative: 解释为圣灵认可其恶行，或解释为掌权者毫无意志
  rationale: 原文同时保留人的/权势的意志与圣灵主权，不应在译文中消解这种张力。
- issue: “属于人类的食物”含义
  choice: 保留为“属于人类的食物”
  alternative: 释为圣餐、启示、灵粮或救恩知识
  rationale: 上下文可能具有象征意义，但文本在此没有唯一锁定具体教义指涉。
- issue: 祭物接受者“本是动物”
  choice: 直译为“接受祭物的本是动物”
  alternative: 改释为接受祭物的权势具有兽性
  rationale: 该句语义突兀且可能受残卷语境影响，应保留见证文本的张力，不以解释代替翻译。
