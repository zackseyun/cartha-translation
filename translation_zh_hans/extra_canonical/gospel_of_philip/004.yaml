  register: 采用现代、庄重而可读的简体中文。段落结构依见证文本保留；方括号和省略号原样表示残损或补足。由于科普特语原文复核尚待完成，本稿以所给公共领域英文见证为暂定依据，避免在疑难处作超出证据的确定化处理。
