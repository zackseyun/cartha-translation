base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/002.yaml
  text: 'Those who sow in winter reap in summer. Winter is the world; summer is the other age. Let us sow in the world so that we may reap in summer. For this reason, it is not right for us to pray in winter. Summer follows winter. But if someone reaps in winter, they will not reap but will uproot, since this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it is fruitless.


    Christ came to buy some, to save others, and to redeem still others. He bought those who were strangers, made them his own, and set them apart as a pledge, as he wished. It was not only when he appeared that he laid down his life when he wished; rather, since the day the world came into being, he laid down his life when he wished. Then he came first to take it, since it had been pledged. It was under the power of the robbers who had captured it, but he saved it. He also redeemed those who are good in the world, as well as those who are bad.


    Light and darkness, right and left, are brothers to each other. They are inseparable. Therefore, those who are good are not good, those who are bad are not bad, life is not really life, and death is not really death. For this reason, each one will be dissolved into its origin from the beginning. But those who are exalted above the world cannot be dissolved and are eternal.'
translation:
  language: zh_hans
  text: '冬天撒种的人，夏天收割。冬天就是这个世界，夏天则是另一个世代。我们要在这个世界撒种，好让我们在夏天收割。因此，我们不宜在冬天祈求[a]。夏天接在冬天之后。但若有人在冬天收割，他不是在收割，而是在连根拔除，因为这一类不会结出果实……它并不只是出来……而是在另一个安息日……它不结果子。[b]


    基督来，是要买下一些人，拯救另一些人，又赎回另一些人。他买下那些原是外人的，使他们归属自己，并按自己的意愿把他们分别出来，作为凭据[c]。他并非只在显现时才按自己的意愿舍下生命；自世界形成之日起，他就按自己的意愿舍下生命。后来他先来取回它，因为它已经作了抵押[d]。它落在那些将它掳去的强盗权下，但他救了它；他也赎回世上的好人和坏人。[e]


    光与黑暗、右与左，彼此都是弟兄；它们不可分离。因此，好人并非好，坏人并非坏；生命也并非真正的生命，死亡也并非真正的死亡。因此，各自都将消解，归回它起初的本源[f]。但那些被提升到世界之上的，是不可消解的，也是永恒的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祈求”也可理解为“祷告”。这里为何说不宜在“冬天”祈求，所据文本没有进一步说明。
    reason: 保留动词语义及隐喻解释的不确定性。
  - marker: b
    text: 本句数处文字残缺；省略号标示抄本缺损或无法确定的衔接，因此句意不完整。
    reason: 明确展示物质文本的残损，避免制造虚假的连贯性。
  - marker: c
    text: “凭据”所译之词也可能指“质物、保证”或“抵押品”。
    reason: 该词具有经济与保证双重语义，中文单一词项难以完全涵盖。
  - marker: d
    text: “它”在所据文本中的指代不明确，可能承接“生命”或先前所说的凭据／抵押之物。
    reason: 保存代词指向的真实歧义。
  - marker: e
    text: 本段反复出现“他、它、他们”等代词，部分所指并不确定；译文没有擅自补明对象。
    reason: 来源材料的代词链含混，需提醒读者勿把译文视为已解决其所指。
  - marker: f
    text: 也可译作：“各自都将消解在它起初的本源中。”
    reason: 原表达中“从起初”与“本源”的关系可有不同句法理解。
lexical_decisions:
- source_word: winter / summer
  choice: 冬天／夏天
  rationale: 保留原文贯穿本段的季节隐喻，并由正文直接说明其所指。
- source_word: the other age
  choice: 另一个世代
  rationale: “世代”能保留时间—宇宙论含义，避免把它过早具体化为“来世”。
- source_word: pray
  choice: 祈求
  rationale: 语境中的动词可能涉及祷告或请求；“祈求”既自然，也不把含义限定为礼仪性祷告。
- source_word: buy / save / redeem
  choice: 买下／拯救／赎回
  rationale: 刻意保留三个不同动词及其经济、解救意象，不将它们合并为单一救恩术语。
- source_word: pledge
  choice: 凭据／抵押
  rationale: 此词在相邻句中可能带有质物、保证或抵押之意；分别依句法译出，同时以脚注说明不确定性。
- source_word: laid down his life
  choice: 舍下生命
  rationale: 保留主动、自愿交付生命的表达，不擅自解释为某一特定历史事件。
- source_word: brothers
  choice: 弟兄
  rationale: 保留拟人化的亲属隐喻；现代中文中“弟兄”可自然指称成对的男性亲属而不规定长幼。
- source_word: dissolved / indissoluble
  choice: 消解／不可消解
  rationale: 维持同一词根的对照，并保留可能兼具分解、消散和解除之意的抽象表达。
- source_word: origin from the beginning
  choice: 起初的本源
  rationale: 兼顾“起初”与“来源／本源”两层表达，不将其系统化为特定哲学术语。
theological_decisions:
- issue: “冬天不宜祈求”的含义
  choice: 直译为“不宜在冬天祈求”
  alternative: 解释为“不应在现世祷告”或“不应在困境中祷告”
  rationale: 原段的隐喻关系突兀且可能受残损上下文影响；不以教义性释义消除张力。
- issue: 基督自世界形成之日起“舍下生命”
  choice: 保留跨越创世与显现的时间陈述
  alternative: 改写为预定、预表或一次性的受难事件
  rationale: 文本本身将舍命意愿追溯至世界形成之时，译文不替作者协调其时间观。
- issue: 被买、被救、被赎的群体
  choice: 保留三类对象及好人与坏人都被赎回的说法
  alternative: 把三者视为同一群体或仅限义人
  rationale: 原文刻意并列不同动作和对象；合并会抹去其修辞及神学张力。
- issue: 光暗、左右彼此为弟兄且不可分离
  choice: 照录其成对、不可分离的论述
  alternative: 将其解释为道德相对主义、宇宙二元论或最终和解论
  rationale: 这些系统解释均超出所给见证；译文保存陈述而不裁定其体系归属。
- issue: “好人并非好，坏人并非坏”
  choice: 保留否定式悖论
  alternative: 补成“并非绝对地好／坏”
  rationale: 加入“绝对”虽较顺畅，却会替原文限定论断强度。
- issue: 归回本源与超越世界者永恒
  choice: 保留“消解”与“不可消解”的对照
  alternative: 解释为灵魂不朽、复活或元素复归
  rationale: 原文未明确指明机制或主体性质，不应导入宗派性或哲学性定论。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留季节、买赎、抵押、光暗和消解等核心意象；不把悖论改写成教义说明。因科普特语原文复核尚待完成，本稿以所给公共领域英文见证为临时依据；省略号原样保留文本残损。所有脚注标记均已置入正文。
