  revised_text: '上帝是一位染匠。上好的染料——人称它们为“真的”——会随着用它们染过的东西一同死去；被上帝染过的人也是如此。因为他的染料是不朽的，他们便借着他的色彩成为不朽。然而，上帝在水中施洗。


    人若不变得与真实存在之物相像，就不可能看见其中任何一样。这不同于世上的人：他看见太阳，却不成为太阳；看见天、地和其余一切，也不成为它们。事情本来就是这样。但你们看见了那地方的一些事物，也已经成为它们。你看见了灵，就成为灵；你看见了基督，就成为基督；你看见了[父，就]要成为父。因此，[在这里，]你看见万物，却不[看见自己]；但在那里，你看见自己，因为你将[成为]你所看见的。


    信领受，爱给予。[没有人能够]不凭信而[领受]，也没有人能够不凭爱而给予。因此，我们相信，为要领受；我们给予，为要去爱，因为人若不是出于爱而给予，就不能从中得到什么。还没有领受主的人，仍是希伯来人。


    在我们之前的使徒称他为“耶稣·拿撒勒人·弥赛亚”，也就是“耶稣·拿撒勒人·基督”。末一个名字是“基督”，第一个是“耶稣”，中间的是“拿撒勒人”。“弥赛亚”有两个意思：既是“基督”，也是“被量定者”。“耶稣”在希伯来语中是“救赎”；“拿撒拉”是“真理”。因此，“拿撒勒人”就是“真理”。“基督”是那位被量定者；“拿撒勒人”和“耶稣”是被量定的。[a]


    珍珠即使被丢进泥里，也不会降低价值；即使用香膏膏抹，也不会增加价值。对它的主人而言，它始终宝贵。上帝的儿女也是这样：无论身在何处，对他们的父而言，他们仍然宝贵。


    你若说：“我是犹太人”，没有人会动容；你若说：“我是罗马人”，没有人会不安；你若说：“我是希腊人”“蛮族人”“奴隶”[“自由人”]，没有人会惊慌。[但]你若[说]：“我是基督徒”，那[…]就会战栗。但愿有[…这样]的一位；这位[……]将不能忍受[听见]他的名字。[b]


    上帝是吞食人的。因此，人被[献祭]给他。在人被献祭以前，所献的是牲畜，因为受祭的那些并不是神。[c]


    玻璃器皿和陶器都是借着火制成的。但玻璃器皿若破了，还可以重制，因为它们是借着一口气形成的；陶器若破了，就被毁掉，因为它们形成时没有气息。


    一头推磨的驴走了一百英里；等它被放开时，却发现自己仍在原地。许多人奔走，却哪里也没有到达。到了晚上，他们既没有看见城，也没有看见村庄；没有看见任何受造之物或自然之物，也没有看见权能或天使。可怜的人白白劳苦了。


    圣餐就是耶稣，因为在叙利亚语中，他被称为“法里撒塔”，意思是“那被铺展开的”；因为耶稣来，是要把世界钉上十字架。[d]


    主走进利未的染坊，取了七十二种颜色，扔进染缸里，又把它们全都取出来，成了白色。他说：“人子就是这样[作为]染匠而来。”


    那位被称为“不生育者”的智慧，是[众天使的]母，也是[那位][……马利亚]·抹大拉的伴侣。[……爱她]胜过众门徒，[……他]亲吻她的[……][多次]。其余的[…][…]对他说：“你为什么爱她胜过爱我们所有人？”救主回答他们：“为什么我不像爱她那样爱你们呢？一个盲人和一个能看见的人若都在黑暗中，彼此并没有区别。光来到时，能看见的人会看见光，盲人却仍留在黑暗中。”[e]


    主说：“那在存在以前就存在的人是有福的，因为那存在的人曾经存在，并且还要存在。”


    人类的优越并不显露出来，而是存在于隐秘之中。因此，人能支配那些比自己更强壮、在显露和隐秘方面都更大的动物。这样，它们便得以存活；但如果人与它们分开，它们就彼此残杀、撕咬、吞食，因为找不到食物。如今它们已经找到食物，因为人耕种了土地。


    若有人下到水里，上来时却没有领受什么，便说：“我是基督徒”，他就是以利息借来了这个名号。但他若领受了圣灵，这名号便是他所得的礼物。领受礼物的人不会被收回礼物；以利息借来的人，却必须归还。一个人在奥秘中得以形成时，情形就是这样。[f]'
