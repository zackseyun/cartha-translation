  terminology: “染匠／染料／色彩”“灵”“基督”“圣灵”“圣餐”“奥秘”等术语处理一致；“吞食人的”及“被量定者”等异常语汇应维持。专名和本段的古代词源联想仅依英文见证暂定，仍须直接核对科普特语。
