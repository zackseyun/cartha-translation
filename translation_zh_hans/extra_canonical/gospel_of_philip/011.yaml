translation:
  language: zh_hans
  text: '上帝是一位染匠。上好的染料——人称它们为“真的”——会随着用它们染过的东西一同死去；被上帝染过的人也是如此。因为他的染料是不朽的，他们便借着他的色彩成为不朽。然而，上帝是在水中施洗。


    人若不变得与真实存在之物相像，就不可能看见其中任何一样。这不同于世上的人：他看见太阳，却不成为太阳；看见天、地和其余一切，也不成为它们。事情本来就是这样。但你们看见了那地方的一些事物，也已经成为它们。你看见了灵，就成为灵；你看见了基督，就成为基督；你看见了[父，就]要成为父。因此，[在这里，]你看见万物，却不[看见自己]；但在那里，你看见自己，因为你将[成为]你所看见的。


    信领受，爱给予。[没有人能够]不凭信而[领受]，也没有人能够不凭爱而给予。因此，我们相信，为要领受；我们给予，为要去爱，因为人若不是出于爱而给予，就不能从中得到什么。还没有领受主的人，仍是希伯来人。


    在我们以前的使徒称他为“耶稣·拿撒勒人·弥赛亚”，也就是“耶稣·拿撒勒人·基督”。末一个名字是“基督”，第一个是“耶稣”，中间的是“拿撒勒人”。“弥赛亚”有两个意思：既是“基督”，也是“被量定者”。“耶稣”在希伯来语中是“救赎”；“拿撒拉”是“真理”。因此，“拿撒勒人”就是“真理”。“基督”是那位被量定者；“拿撒勒人”和“耶稣”是被量定的。[a]


    珍珠即使被丢进泥里，也不会降低价值；即使用香膏膏抹，也不会增加价值。对它的主人而言，它始终宝贵。上帝的儿女也是这样：无论身在何处，对他们的父而言，他们仍然宝贵。


    你若说：“我是犹太人”，没有人会动容；你若说：“我是罗马人”，没有人会不安；你若说：“我是希腊人”“蛮族人”“奴仆”[“自由人”]，没有人会惊慌。[但]你若[说]：“我是基督徒”，那[…]就会战栗。惟愿[…这]一类，这个[……]不能忍受[听见]他名字的。[b]


    上帝是吞食人的。因此，人被[献祭]给他。在人被献祭以前，所献的是牲畜，因为受祭的那些并不是神。[c]


    玻璃器皿和陶器都是借着火制成的。但玻璃器皿若破了，还可以重制，因为它们是借着一口气形成的；陶器若破了，就被毁掉，因为它们形成时没有气息。


    一头推磨的驴走了一百英里；等它被放开时，却发现自己仍在原地。许多人奔走，却哪里也没有到达。到了晚上，他们既没有看见城，也没有看见村庄；没有看见任何受造之物或自然之物，也没有看见权能或天使。可怜的人白白劳苦了。


    圣餐就是耶稣，因为在叙利亚语中，他被称为“法里撒塔”，意思是“那被铺展开的”；因为耶稣来，是要把世界钉上十字架。[d]


    主走进利未的染坊，取了七十二种颜色，扔进染缸里，又把它们全都取出来，成了白色。他说：“人子就是这样作为染匠而来。”


    那位被称为“不生育者”的智慧，是[众天使的]母，也是[…]抹大拉的[马利亚]的伴侣。[…爱她]胜过众门徒，[…]多次亲吻她的[…]。其余的[…]对他说：“你为什么爱她胜过爱我们所有人？”救主回答他们：“为什么我不像爱她那样爱你们呢？一个盲人和一个能看见的人若都在黑暗中，彼此并没有区别。光来到时，能看见的人会看见光，盲人却仍留在黑暗中。”[e]


    主说：“那在存在以前就存在的人是有福的，因为那存在的人曾经存在，并且还要存在。”


    人的优越并不显露出来，而是存在于隐秘之中。因此，人能支配那些比自己更强壮、在显露和隐秘方面都更大的动物。这样，它们便得以存活；但如果人与它们分开，它们就彼此残杀、撕咬、吞食，因为找不到食物。如今它们已经找到食物，因为人耕种了土地。


    若有人下到水里，上来时却没有领受什么，便说：“我是基督徒”，他就是连本带利借用了这个名号。但他若领受了圣灵，这名号便是他所得的礼物。领受礼物的人不会被收回礼物；连本带利借来的人，却必须归还。一个人在奥秘中得以形成时，情形就是这样。[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段的词源解释和双关按现存见证保留；它们未必符合现代希伯来语、亚兰语或希腊语词源学。“被量定者”所对应的文字游戏尤其难以在中文中重现。
    reason: 提醒读者这是古代文本自身的词源联想，而非现代语言学结论。
  - marker: b
    text: 方括号表示译本据残迹补出的文字，省略号表示手稿缺损；本段后半句残缺严重，主语和完整意思不能确定。
    reason: 防止把不确定重构当作完整原文。
  - marker: c
    text: “吞食人的”及“人被献祭”是文本的原有悖论式说法；这里没有把它解释为字面献人祭、殉道、圣餐或属灵奉献中的任何一种。
    reason: 保存神学歧义并避免误读为译者认定的教义。
  - marker: d
    text: “法里撒塔”是按见证文本转写的叙利亚语名称；“铺展开”与“钉上十字架”之间的关联属于本文的文字游戏，其精确语言学依据仍有待科普特语及相关闪语材料复核。
    reason: 说明外来语与词源解释具有不确定性。
  - marker: e
    text: 手稿在马利亚段落中多处残缺，包括亲吻的部位；译文没有补作常见但不能确定的“嘴”。
    reason: 忠实显示文本损坏，避免无证据补全。
  - marker: f
    text: “奥秘”在这里可能指隐秘教导、入门礼仪或神圣仪式；现存上下文不足以限定为某一项特定圣礼。
    reason: 保留术语的历史和神学开放性。
lexical_decisions:
- source_word: dyer / dyed / dyes / colors
  choice: 染匠／染过／染料／色彩
  rationale: 保留贯穿段落及后文染坊比喻的词根联系，并维持“受染而不朽”的陌生意象。
- source_word: 'true'
  choice: “真的”
  rationale: 保留其作为染料称号的异常表达，不擅自解释为“牢固”或“不褪色”。
- source_word: become like them
  choice: 变得与真实存在之物相像
  rationale: 以集合意义处理先行词，同时避免把“看见即成为”的本体论张力弱化为单纯模仿。
- source_word: the measured
  choice: 被量定者
  rationale: 保留见证文本所述双关，不改写成较顺畅但缺乏依据的称谓。
- source_word: Barbarian
  choice: 蛮族人
  rationale: 采用古代希腊—罗马语境中的历史性类别，不按现代人格侮辱来转写。
- source_word: human-eater
  choice: 吞食人的
  rationale: 直留强烈而突兀的复合表达，不用教义性释义加以缓和。
- source_word: breath
  choice: 一口气／气息
  rationale: 保留“气息、吹气、灵”之间可能存在的语义联想，又不直接译作“圣灵”。
- source_word: Eucharist
  choice: 圣餐
  rationale: 使用现代汉语读者易懂的礼仪称呼；不额外规定具体宗派的圣餐观。
- source_word: Pharisatha / spread out
  choice: 法里撒塔／那被铺展开的
  rationale: 音译外来名称并直译见证文本给出的释义，保存其词源论证。
- source_word: Son of Humanity
  choice: 人子
  rationale: 采用中文宗教文献中通行而自然的称号，同时不扩大其解释。
- source_word: companion
  choice: 伴侣
  rationale: 维持关系用语本身的广义，不擅自具体化为配偶。
- source_word: mystery
  choice: 奥秘
  rationale: 保留其可能兼具秘密、礼仪和神圣奥义的含义，不武断限定为某一圣礼。
- source_word: comes into being
  choice: 得以形成
  rationale: 与全文关于生成、塑造和入门的意象衔接，避免直接解释为重生。
theological_decisions:
- issue: 看见灵、基督和父便成为所见者
  choice: 按见证文本直译“成为灵／成为基督／成为父”
  alternative: 译作“与灵／基督／父相似或联合”
  rationale: 原段的神学张力和重复结构是文本核心，不应以较正统或较温和的解释取代。
- issue: “还没有领受主的人仍是希伯来人”
  choice: 保留原有断言
  alternative: 解释为仍停留在旧约或犹太身份中
  rationale: 上下文并未明确界定其所指，故不加入反犹或取代论式阐释。
- issue: “上帝是吞食人的”与献祭
  choice: 保留悖论式语言并以方括号标出补字
  alternative: 改写为上帝悦纳人的献身或圣餐意象
