translation:
  language: zh_hans
  text: '那些说主先死、然后复起的人错了，因为他先复起，然后才死。凡不先获得复活的人，就不会死。凭着永生的上帝，那人倒会／死＼！[a]


    没有人会把贵重的大东西藏在一个大东西里；反倒常有人把价值成千上万的东西放进一个只值一文钱的东西里。灵魂也是这样：贵重之物竟存在于卑贱的身体中。


    有些人害怕自己复起时会赤身露体，所以他们想要在肉身中复起，却不知道披着［肉身］的人正是赤裸的。那些［……］脱去衣服的人［并］不赤裸。[b]“血肉［不能］承受［上帝的］国。”不能承受的是什么？就是披在我们身上的。但那要承受的又是什么？是耶稣的肉和血。因此他说：“不吃我的肉、不喝我的血的人，里面没有生命。”他的肉是什么？就是圣言；他的血就是圣灵。领受了这二者的人，就有食物、饮品和衣服。


    所以，我不同意另一些说“它不会复起”的人。两边都错了。你这说“肉身不会复起”的人，请告诉我什么会复起，好让我们尊重你。你说：“是肉身里的灵，以及肉身里的这另一道光。”然而，这句话也在肉身之中，因为无论你说什么，都不能离开肉身来说。人必须在这肉身中复起，因为一切都存在于其中。[c]在这个世界上，人胜过他们所穿的衣服；在天国里，衣服却胜过穿衣服的人。


    一切都借着水和火得以洁净——可见的借着可见的，隐藏的借着隐藏的。有些隐藏之物被藏在可见之物里面。水中有水，膏油中有火。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “／死＼”依所据英文见证的特殊标记保留；这一读法及其与前句“不会死”的关系不确定。科普特语原文复核尚待完成。
    reason: 见证文本显式标出异常读法，且形成明显矛盾，不宜静默修正。
  - marker: b
    text: 方括号和省略号表示抄本残缺或译者补足；本句残损严重，确切措辞不明。
    reason: 提醒读者此处语法与意义依赖残缺文本的重构。
  - marker: c
    text: “因为一切都存在于其中”中的“其中”按见证文本可指“这肉身”，但指代关系仍有歧义。
    reason: 保留代词所造成的真实解释空间。
  - marker: d
    text: “膏油”指用于傅抹的礼仪性油；“水中有水，膏油中有火”可能区分外在可见之物与其中隐藏的实在，译文不进一步判定。
    reason: 说明陌生术语与意象，同时避免强加特定圣礼神学。
lexical_decisions:
- source_word: arose / resurrection
  choice: 复起／复活
  rationale: 叙事动词译作“复起”，名词性神学概念译作“复活”，既保留同一词族的关联，也使现代汉语自然。
- source_word: flesh
  choice: 肉身；血肉（引语中）
  rationale: 论述身体及其作为“衣服”的意象时用“肉身”；保罗式固定引语“flesh and blood”译作“血肉”。
- source_word: Word
  choice: 圣言
  rationale: 此处是人格化、神学性的Word，用“圣言”避免被误读为一般话语，同时不额外解释其身份。
- source_word: chrism
  choice: 膏油
  rationale: 指礼仪性的傅膏物质；译作“膏油”比“香膏”更能保留宗教仪式语境。
- source_word: acquire
  choice: 获得
  rationale: 保留复活被人取得或领受的异常表达，不改写为单纯末日事件。
- source_word: inherit
  choice: 承受
  rationale: 采用经文语域中的自然表达，同时保留进入并得享国度的含义。
theological_decisions:
- issue: “先复起，然后才死”的次序悖论
  choice: 按见证文本直译，保留悖论
  alternative: 解释为信徒今生先经历属灵复活，后来才经历肉体死亡
  rationale: 原文段落刻意制造神学张力；译文不把特定解释写入正文。
- issue: 肉身究竟复起还是不复起
  choice: 同时保留“披在我们身上的肉身不能承受”与“必须在这肉身中复起”
  alternative: 将两处协调为属灵身体或完全否定身体复活
  rationale: 作者明确说“两边都错了”，文本本身维持复杂张力，不能以教派体系消解。
- issue: 耶稣的肉与血的解释
  choice: 照文本译为“圣言”与“圣灵”
  alternative: 将其直接解释为圣餐元素或纯象征
  rationale: 段落自行作出对应，译文应呈现而不扩展其仪式或教义含义。
- issue: “衣服”意象
  choice: 保留身体、赤裸与衣服之间的多义关系
  alternative: 明确将衣服解释为复活身体、恩典或礼仪服装
  rationale: 文本未单一定义该意象，应维持开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。因现有 drafting_basis 仅为公共领域英文见证，且科普特语复核尚待完成，本稿属来源受限的暂定译文。正文保留方括号、残缺号及／＼异常读法；不以圆括号擅自消除原见证中的补足或不确定性。
