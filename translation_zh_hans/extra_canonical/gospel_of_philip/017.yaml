  revised_text: '亚伯拉罕……要去看他将要看见的事时，[他]给包皮的肉行了割礼，[告诉]我们：必须除灭肉体。[a]



    世上[大多数（事物）]，只要其[内部隐藏着，就能存立并活着；一旦显露出来]，便会死去。看得见的人就是[例证]：[只要]人的内脏隐藏着，人就活着；若内脏暴露并从体内出来，人就会死。树也是如此：树根隐藏时，它开花生长；树根一旦暴露，树就枯干。世上一切生出来的事物都是这样，不仅显露的如此，隐藏的也如此。因为恶的根只要隐藏着，就很强盛；但它若被认出，就会消解；若被揭露，就会死去。因此，道说：“斧子已经放在树根上了。”[b] 斧子不会只是砍断，因为被砍的还会再发芽；相反，斧子要掘入地下，直至把根挖出来。耶稣把根完全拔除了，其他人却只拔除了一部分。至于我们，愿我们每个人都深挖到自己里面恶的根，从我们里面把它连根拔出。我们若认出它，它就会被拔除；但若不认出它，它便在我们里面扎根，在我们里面结出果实。它辖制我们，迫使我们服侍它；它俘虏我们，使我们去做自己[不]愿做的事，而自己愿做的事却[不]去做。[c] [它]之所以强大，是因为我们没有认出它；只要[它存在]，它就不断活动。



    [无知]是[一切恶]之母。无知会带来[死亡，因为]从[无知]而有的，过去并不存在，现在也[不存在]，将来也不会成为实有……当全部真理显露时，它们就会达到完全。[d] 因为真理与无知相仿：隐藏时，它安歇在自身之中；但它若显露并被认出，就得着荣耀，因为它比无知和谬误更强。真理使人自由。道说：“你们若认识真理，真理就会使你们自由。”[e] 无知就是奴役，认识就是自由。我们若认识真理，就会在自己里面找到真理的果实；我们若与真理联合，它就会接纳我们的丰满。[f]



    如今，我们所有的是受造界中已经显露的事物。我们说：“强盛的是尊贵的，隐藏的是软弱而受轻蔑的。”真理中已经显露的事也是这样：它们软弱而受轻蔑，隐藏的却强盛而尊贵。然而，真理的奥秘是借着预表和形像显露的。[g]



    可是，内室是隐藏的；它是圣中之圣。[h] 起初，幔子遮蔽了上帝怎样治理受造界；但幔子撕裂、里面的事显露时，这殿就会像荒漠一样被遗弃——更确切地说，它会被[毁灭]。一切神性也会从这些地方逃离，却不是进入至圣所，因为它不能与纯净的[光]和[毫无缺欠的]丰满联合；[而是]来到十字架的翅膀之下，[在]它的臂膀之下。[i] 洪水向他们汹涌而来时，这方舟将[成为他们的]拯救。若有人属于祭司职分，他们就能与大祭司一同进入幔内。



    所以，幔子并非只在上端撕裂，否则它只会向上面的人敞开；也并非只在下端撕裂，否则它只会向下面的人显明；它乃是从上到下撕裂的。[j] 上面的人为我们打开了下面，使我们得以进入真理的隐秘。这才真正是尊贵的、强盛的；然而，我们要借着受轻蔑的预表和软弱进入那里。这些在完全的荣耀面前降为卑微。有一种荣耀胜过荣耀，有一种能力胜过能力。因此，那完全的连同真理的隐秘向我们敞开了；至圣所显露了，内室也邀请我们进去。



    恶只要隐藏着，就不活动；但它还没有从圣灵的种子中被除去，他们仍是恶的奴隶。[k] 可是每当它显露时，完全的光就会流溢到众人身上，凡在其中的，都要[领受膏抹]。[l] 那时，奴隶要得自由，被掳的要蒙救赎。“[凡]不是我天上的父所栽种的[植物，都要]连根拔起。”[m] 分离的人要联合……要被充满。'
