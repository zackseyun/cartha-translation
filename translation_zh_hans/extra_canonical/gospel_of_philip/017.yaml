  text: 'When Abraham […] to see what he was going to see, [he] circumcised the flesh of the foreskin, [telling] us that it is necessary to destroy the flesh.


    [Most (things)] of [the] world can stand and live as long as their [insides are hidden. If they are revealed], they die, as [illustrated] by the visible human being. [As long as] a person’s insides are hidden, that person is alive. If their insides are exposed and come out of them, the person will die. It is the same with a tree. While its root is hidden, it blossoms and grows. If its root is exposed, the tree dries up. This is how it is with everything born in the world, not only the revealed but also the hidden, because as long as the root of evil is hidden, it is strong. But if it is recognized, it dissolves, and if it is revealed, it dies. So the Word says, “Already the axe is laid at the root of the trees.” It will not merely cut, because that which will be cut blossoms again. Instead, the axe digs down into the ground until it brings up the root. Jesus pulled out the root completely, but others did so only partially. As for us, let every one of us dig down to the root of the evil
    within and pull it out from its root in us. It will be uprooted if we recognize it. But if we do not recognize it, it takes root within us and bears its fruit in us. It masters us, and we are forced to serve it. It captures us so that we do what we do [not] want to do, and we do [not] do what we want to do. [It is] powerful because we have not recognized it. It remains active as long as [it exists]. [Ignorance] is the mother of [all evil]. Ignorance will cause [death, because] what exists from [ignorance] did not exist, nor [does it exist], nor will they come into being […] they will be perfected when the whole truth is revealed, because truth is like ignorance. When it is hidden, it rests within itself, but if it is revealed and recognized, it is glorified because it is stronger than ignorance and error. It gives freedom. The Word says, “If you know the truth, the truth will make you free.” Ignorance is slavery; knowledge is freedom. If we know the truth, we will find the fruits of
    truth within us. If we unite with it, it will receive our fullness.


    Now we have what is revealed of creation. We say, “Those who are strong are honorable, but those who are hidden are weak and scorned.” This is how it is with those who are revealed of the truth: they are weak and scorned, but the hidden are strong and honorable. Yet the mysteries of the truth are revealed in types and images.


    The chamber, however, is hidden; it is the Holy within the Holy. At first, the veil concealed how God managed creation, but when the veil is torn and what is inside is revealed, this house will be left behind [like] a desert—or rather, it will be [destroyed]. And all divinity will flee [from] these places, not into the Holies [of the] Holies, because it will not be able to unite with the pure [light] and the [flawless] fullness, [but] it will come to be under the wings of the cross [and under] its arms. This ark will [become their] salvation when the floodwaters surge over them. If some belong to the priesthood, they will be able to enter inside the veil with the high priest. So the veil was not torn only at the top, since then it would have been open only to those at the top. Nor was it torn only at the bottom, since then it would have been revealed only to those at the bottom. Instead, it was torn from top to bottom. Those at the top opened the bottom to us so that we may enter the
    secret of the truth. This truly is what is honorable and strong, but we will enter there through scorned types and weaknesses. They are humbled in the presence of the perfect glory. There is glory better than glory; there is power better than power. So the perfect was opened to us together with the secrets of the truth, the Holies of the Holies were revealed, and the chamber invited us in.


    As long as it is hidden, evil is inactive, but it has not been removed from among the Holy Spirit’s seed. They are servants of evil. But whenever it is revealed, the perfect light will flow out upon everyone, and all who are in it will [receive the chrism]. Then the servants will be set free, and the captives will be redeemed. “[Every] plant [which] my Father who is in heaven [has not] planted [will be] uprooted.” Those who are separated will unite […] will be filled.'
translation:
  language: zh_hans
  text: '亚伯拉罕……要去看他将要看见的事时，[他]割去了包皮的肉，[告诉]我们：必须除灭肉体。[a]


    世上[大多数事物]，只要其[内部隐藏着，就能存立并活着；一旦显露出来]，便会死去。看得见的人就是[例证]：[只要]人的内脏隐藏着，人就活着；若内脏暴露并从体内出来，人就会死。树也是如此：树根隐藏时，它开花生长；树根一旦暴露，树就枯干。世上一切生出来的事物都是这样，不仅显露的如此，隐藏的也如此。因为恶的根只要隐藏着，就很强盛；但它若被认出，就会消解；若被揭露，就会死去。因此，道说：“斧子已经放在树根上了。”[b] 斧子不会只是砍断，因为被砍的还会再发芽；相反，斧子要掘入地下，直至把根挖出来。耶稣把根完全拔除了，其他人却只拔除了一部分。至于我们，愿我们每个人都深挖到自己里面恶的根，从我们里面将它连根拔出。我们若认出它，它就会被拔除；但若不认出它，它便在我们里面扎根，在我们里面结出果实。它辖制我们，迫使我们服侍它；它俘虏我们，使我们去做自己[不]愿做的事，而自己愿做的事却[不]去做。[c] [它]之所以强大，是因为我们没有认出它；只要[它存在]，它就不断活动。


    [无知]是[一切恶]之母。无知会带来[死亡，因为]从[无知]而有的，过去并不存在，现在也[不存在]，将来也不会成为实有……当全部真理显露时，它们就会达到完全。[d] 因为真理与无知相仿：隐藏时，它安歇在自身之中；但它若显露并被认出，就得着荣耀，因为它比无知和谬误更强。真理使人自由。道说：“你们若认识真理，真理就会使你们自由。”[e] 无知就是奴役，认识就是自由。我们若认识真理，就会在自己里面找到真理的果实；我们若与真理联合，它就会接纳我们的丰满。[f]


    如今，我们所有的是受造界中已经显露的事物。我们说：“强盛的是尊贵的，隐藏的是软弱而受轻蔑的。”真理中已经显露的事也是这样：它们软弱而受轻蔑，隐藏的却强盛而尊贵。然而，真理的奥秘是借着预表和形像显露的。[g]


    可是，内室是隐藏的；它是至圣之中的圣所。[h] 起初，幔子遮蔽了上帝怎样治理受造界；但幔子撕裂、里面的事显露时，这殿就会像荒漠一样被遗弃——更确切地说，它会被[毁灭]。一切神性也会从这些地方逃离，却不是进入至圣所，因为它不能与纯净的[光]和[毫无缺欠的]丰满联合；[而是]来到十字架的翅膀之下，[在]它的臂膀之下。[i] 洪水向他们汹涌而来时，这方舟将[成为他们的]拯救。若有人属于祭司职分，他们就能与大祭司一同进入幔内。


    所以，幔子并非只在上端撕裂，否则它只会向上面的人敞开；也并非只在下端撕裂，否则它只会向下面的人显明；它乃是从上到下撕裂的。[j] 上面的人为我们打开了下面，使我们得以进入真理的隐秘。这才真正是尊贵的、强盛的；然而，我们要借着受轻蔑的预表和软弱进入那里。这些在完全的荣耀面前降为卑微。有一种荣耀胜过荣耀，有一种能力胜过能力。因此，那完全的连同真理的隐秘向我们敞开了；至圣所显露了，内室也邀请我们进去。


    恶只要隐藏着，就不活动；但它还没有从圣灵的种子中被除去，他们仍是恶的奴隶。[k] 可是每当恶显露时，完全的光就会流溢到众人身上，凡在光里的人都要[领受膏抹]。[l] 那时，奴隶要得自由，被掳的要蒙救赎。“[凡]不是我天上的父所栽种的[植物，都要]连根拔起。”[m] 分离的人要联合……要被充满。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句开头有缺文；“除灭肉体”的具体所指并不明确，可能承接割礼作象征性论述。
    reason: 提示抄本残损和不可消除的解释歧义。
  - marker: b
    text: 参《马太福音》3:10；《路加福音》3:9。这里进一步把斧子描写为掘出树根。
    reason: 标明互文来源及本作的独特发挥。
  - marker: c
    text: 措辞令人想起《罗马书》7:15、19，但这里用于描述未被认出的恶如何奴役人。
    reason: 指出可能的保罗书信互文而不主张直接引用。
  - marker: d
    text: 这一句抄本残损，且“它／它们”的数在现有见证中不一致；译文保留这种不稳定。
    reason: 交代文本与语法的不确定性。
  - marker: e
    text: 参《约翰福音》8:32。
    reason: 标明直接经文互文。
  - marker: f
    text: “丰满”在本作品中可能带有专门含义；这里不把它具体解释为某种固定的宇宙论概念。
    reason: 防止译文过度教义化。
  - marker: g
    text: “预表和形像”指可见、较弱的形式借以显明隐藏的真理奥秘。
    reason: 帮助普通读者理解抽象对比。
  - marker: h
    text: “内室”也可理解为密室或婚房；原词在本作品中含有礼仪和奥秘色彩，正文保留较宽泛译法。
    reason: 保存关键词的多义性。
  - marker: i
    text: 本段“神性”所指以及它为何不能进入至圣所，都不清楚；相关词句亦有残损。
    reason: 避免将晦涩宇宙论关系误作确定教义。
  - marker: j
    text: 参《马太福音》27:51；《马可福音》15:38；《路加福音》23:45。福音书说幔子从上到下裂为两半。
    reason: 标明互文背景。
  - marker: k
    text: “他们”可能指“圣灵的种子”，也可能承接其中的人；原文见证的指代并不完全明确。
    reason: 提示代词歧义。
  - marker: l
    text: “膏抹”可指受膏之礼或膏油；此词为残缺处的补复。
    reason: 说明礼仪词和方括号的性质。
  - marker: m
    text: 参《马太福音》15:13。
    reason: 标明直接经文互文。
lexical_decisions:
- source_word: flesh
  choice: 肉体
  rationale: 保留段首“包皮的肉”与“除灭肉体”之间的词语联系，同时不擅自把它限定为身体、罪性或某种神学术语。
- source_word: Word
  choice: 道
  rationale: 原文见证以带定冠意义的“Word”引出权威话语；译作“道”保留其人格化或启示性可能，而不强行解释。
- source_word: recognized / knowledge
  choice: 认出／认识
  rationale: 上下文强调把隐藏之恶辨认出来，并以认识真理对照无知；分别按语境用“认出”和“认识”，保留同一认知语义链。
- source_word: types and images
  choice: 预表和形像
  rationale: “预表”表达可见形式指向隐藏实在的功能；“形像”保留具象呈现，避免弱化为普通例子。
- source_word: chamber
  choice: 内室
  rationale: 译为中性的空间称谓，不预先判定其是否特指婚房、圣所房间或某种礼仪奥秘。
- source_word: fullness
  choice: 丰满
  rationale: 保留该词在文本中的技术性和开放性，不径直替换为“完全”“圆满境界”或特定体系术语。
- source_word: chrism
  choice: 膏抹
  rationale: 表达受膏这一礼仪动作，同时避免仅音译所造成的不透明；方括号保留修复性质。
- source_word: divinity
  choice: 神性
  rationale: 保留抽象或集合意义，不擅自改成“上帝”“诸神”或“神灵”。
theological_decisions:
- issue: “必须除灭肉体”的含义
  choice: 直译并保留其尖锐表述
  alternative: 解释为除去罪恶欲望或旧性情
  rationale: 现有见证把割礼与“destroy the flesh”并置，含义可能具有象征性，但不宜在正文中替作者消解张力。
- issue: 恶被认识后消解、死亡
  choice: 按原有因果关系表达
  alternative: 改写为人因认识而获得抵抗恶的能力
  rationale: 文本直接宣称恶被认出和揭露便消解、死亡；应保留其本体论色彩。
- issue: 从无知而有者“不存在”
  choice: 保留存在论式否定及数的不稳定
  alternative: 解释为虚假事物最终归于无有
  rationale: 原段残损且代词由单数转复数，正文不强行统一或系统化。
- issue: “神性”逃离及其去向
  choice: 保持神性、至圣所、丰满和十字架之间令人费解的关系
  alternative: 将“神性”解释为低等属灵势力或受造神能
  rationale: 来源见证本身语义紧张且残损，不应导入特定宇宙论解释。
- issue: “圣灵的种子”与恶的奴役
  choice: 保留群体指代和奴役陈述
  alternative: 改成种子本身受污染或仅指未信者
  rationale: 代词所指有歧义，译文不指定某一教义群体。
- issue: 经文引语
  choice: 用熟悉但不完全套用正典译本的措辞
  alternative: 直接复制某一现代圣经版本
  rationale: 这些引语在本作品中经过改述，应呈现互文关系，也应保留本段自身形式。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。所有方括号与省略号均保留，以标示抄本缺损或编者补复。由于科普特语原文复核尚待进行，本稿以所提供的公共领域英文见证为临时来源依据，并避免在晦涩处制造虚假的确定性。
