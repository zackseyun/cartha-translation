review_pass:
  verdict: revise
  source_fidelity: 现稿大体忠实保留了英文见证中的重复、象征语汇、补字方括号及感恩礼祷词的句法含混。不过首句“took all of them by stealth”被改写为“避过了……察觉”，遗漏了“took”的动作，且加入“未被察觉”的具体解释；应恢复为“暗中带走了他们所有人”。“(in) [all these] (ways)”的编辑性圆括号和方括号也应在译文中分别保留。科普特语直接复核尚待进行，以下修订仍以所供英文公共领域见证为准。
  naturalness: “尊大／卑小”在现代汉语中不够自然，并会把原文可指大小、能力或地位的对比导向尊卑评价。改为“大／小”，并以“那些大的／那些小的”承接，较自然且保留原文的开放性。“他的道向所有人隐藏了自己”改为“他的道向众人隐藏了自身”，使拟人表达更通顺。
  terminology: 保留“本相”“道”“感恩礼”“圣灵”“羔羊”“形像”等用语；不将其解释为特定教义。祷词中的“众形像”与“我们”的关系仍不确定，脚注应说明其可被理解为独立的“形像”，或“我们这些形像”。
  issues:
  - severity: medium
    issue: 首句遗漏“took”的动作
    rationale: “悄然避过了他们所有人的察觉”只表达隐匿或不被察觉，未译出英文见证“Jesus took all of them by stealth”的“带走／带领”动作，并加入了原句未明说的“避过察觉”。
  - severity: low
    issue: 编辑性括号标记未完整对应
    rationale: 英文见证为“(in) [all these] (ways)”，现译只保留了方括号和末尾圆括号，遗漏了“(in)”相对应的圆括号标记。
  - severity: low
    issue: “尊大／卑小”不够自然且带有额外价值色彩
    rationale: 该对词在现代普通话中生硬；“尊／卑”易引入社会等级或价值判断。以“大／小”保留见证的重复与未定含义更稳妥。
  revised_text: '耶稣暗中带走了他们所有人，因为他没有按自己的本相显现，而是照着[他们]所能看见他的样子显现。他（以）[这一切]（方式）向他们显现：他向那些大的显为大，向那些小的显为小；他向天使显为天使，向人显为人。因此，他的道向众人隐藏了自身。有些人的确看见了他，却以为自己看见的是自己。但当他在山上于荣耀中向门徒显现时，他并不小。他变大了，也使门徒变大，好让他们能够看见他是大的。


    那一天，他在感恩礼中说：“你这把完全之光与圣灵联合起来的，也把天使连同众形像与我们联合起来吧！”[a]


    不要轻看羔羊，因为没有他，就不可能看见门。没有人能赤身露体地到王面前。[b]'
