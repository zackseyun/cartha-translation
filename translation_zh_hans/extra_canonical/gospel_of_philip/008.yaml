translation:
  language: zh_hans
  text: '耶稣悄然避过了他们所有人的察觉，因为他并没有按自己的本相显现，而是照着[他们]所能看见的样子显现。他以[这一切]（方式）向他们显现：他向尊大的显为尊大，向卑小的显为卑小；他向天使显为天使，向人显为人。因此，他的道向所有人隐藏了自己。有些人确实看见了他，却以为自己看见的是自己。但当他在山上于荣耀中向门徒显现时，他并不卑小。他变得尊大，也使门徒变得尊大，好让他们能够看见他是尊大的。


    那一天，他在感恩礼中说：“你这把完全之光与圣灵联合起来的，也把天使连同众形像与我们联合起来吧！”[a]


    不要轻看羔羊，因为没有他，就不可能看见那门。没有人能赤身露体地到王面前。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话的句法和“众形像”所指均不明确；也可理解为：“你这把完全之光与圣灵联合起来的，也把天使与我们这些形像联合起来吧！”现译文暂依所提供的英文见证保留含混。
    reason: 原见证的介词关系与末尾短语存在真实歧义，且科普特语复核尚待进行。
  - marker: b
    text: “赤身露体”可能是象征性说法，但这里没有明说它指缺少衣服、礼服、属灵形像或某种礼仪身份。
    reason: 避免把含义未定的意象解释为某一特定圣礼或教义。
lexical_decisions:
- source_word: took all of them by stealth
  choice: 悄然避过了他们所有人的察觉
  rationale: 保留隐秘、未被识破的含义，同时避免把英语中不自然的直译“偷走他们”强加给上下文。因科普特语复核尚待进行，此处从现有见证谨慎译出。
- source_word: as he was
  choice: 按自己的本相
  rationale: 表达他没有以真实所是的样态显现，不额外界定其形上性质。
- source_word: great / small
  choice: 尊大／卑小
  rationale: 原见证可指大小、地位或属灵容量；采用兼具程度与身份色彩的词，尽量保留张力。
- source_word: his Word
  choice: 他的道
  rationale: “Word”大写可能具有位格或启示含义；译作传统而可理解的“道”，不擅自改成“话语”或明确等同某一教义概念。
- source_word: Eucharist
  choice: 感恩礼
  rationale: 采用该希腊借词所指礼仪的中性现代名称，避免限定为某一宗派术语。
- source_word: images
  choice: 众形像
  rationale: 保留原文见证中含义不明的复数名词，不解释为偶像、原型、灵体或人类。
- source_word: lamb
  choice: 羔羊
  rationale: 保留可能具有象征意义的称谓，不在正文中确定其所指。
- source_word: approach the king
  choice: 到王面前
  rationale: 自然表达接近君王、进到君王跟前之意，并保持寓意开放。
theological_decisions:
- issue: 耶稣依照观看者的能力采取不同显现样态
  choice: 照着[他们]所能看见的样子显现
  alternative: 照着他们的本性显现
  rationale: 现有见证强调观看能力而非本体同化；保留补入标记，也不把段落系统化为特定基督论。
- issue: 门徒被“变大”以看见显为“大”的耶稣
  choice: 也使门徒变得尊大
  alternative: 提升了门徒的属灵境界
  rationale: 保留文本自身重复和神秘性，不用解释性神学语言消解“大／小”的张力。
- issue: 感恩礼祷词中光、圣灵、天使和形像的关系
  choice: 维持句法含混，并以脚注提示可能断句
  alternative: 解释为圣礼中的具体联合次序
  rationale: 见证文本本身难解，且科普特语审校待定，不宜替文本建立确定的圣礼神学。
- issue: 羔羊、门与赤身接近王的象征意义
  choice: 按形象语言直译
  alternative: 明确解释为基督、救恩入口和礼服／受洗
  rationale: 这些意象可能有多重关联；正文不导入特定宗派或秘仪解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。方括号保留英文见证所标示的补字或残损复原；圆括号保留见证中的编辑性补充。由于所提供材料是公共领域英文见证，科普特语源文复核尚待进行，本稿应视为来源受限的暂定出版草案。
