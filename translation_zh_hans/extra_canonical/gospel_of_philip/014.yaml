translation:
  language: zh_hans
  text: '夏娃还在亚当里面的时候，死亡并不存在。她与他分离以后，死亡便产生了。如果他再次[进入]，并把它接纳归于自己，就不再有死亡。


    “[我的]神，我的神，主啊，你为什么[离弃]我？”他在十字架上这样说，因为他在那里被分开了。……他是借着那……从神而生。那……从死人中……存在，但……他是完全的……肉；然而这……是真正的肉……并不是真的，[而是……]真实之物的形像。


    新房不是为走兽、奴仆或不洁净的人预备的，而是为自由人和童贞者预备的。


    我们借着圣灵重生；但我们借着基督、凭两样事物而生。我们借着圣灵受膏。我们出生的时候，就联合了。


    没有光，谁也不能在水中或镜中看见自己；同样，没有水或镜子，你也不能在光中看见。因此，人必须在两者之中受洗：在光中，也在水中；而这光就是膏油。


    耶路撒冷有三座献祭之殿。朝西开门的称为“圣所”；朝南开门的另一座称为“圣中之圣”；第三座朝东开门，称为“至圣所”，是只有大祭司才能进入的地方。洗礼是“圣所”。[救赎]是“圣中之圣”。“[至]圣所”就是新房。[洗礼]连同救赎也包含复活。救赎在新房里；然而新房胜过……你找不到它的……那些祈祷的人……耶路撒冷。……耶路撒冷的人……[耶路撒冷]，显现出来……这些称为“[至圣所]”的……幔子裂开……除了形像以外的新房……[它]在上面。[所以]它的幔子从上到下裂开了，因为必须有人从下面升到上面。


    那些穿上完全之光的人，诸权势看不见他们，也不能捆绑他们。人要在联合的奥秘中穿上那光。


    如果女的没有从男的分离，她就不会与男的一同死去。他的分离是死亡的开端。因此，基督来修复那从起初就存在的分离，使二者重新联合。他要使那些因分离而死的人得生命，方法就是使他们联合。如今，妻子在新房里与丈夫联合；在新房里联合的人，不会再彼此分离。夏娃之所以离开亚当，就是因为她没有在新房里与他联合。


    亚当的魂借着一口气而产生；与魂相配的是灵。赐给他的那一位是他的母亲。他的魂被[取走]，又有[生命]（夏娃）代替魂赐给他。当他联合时……胜过诸权势的话语，他们就嫉妒他……属灵的伴侣……隐藏……也就是……他们自己……新房，使……耶稣显现……约旦河，天国的[圆满]。那在万有以前[受生]的，又受生了；那最先[受膏]的，又受膏了；那蒙救赎的，又蒙救赎了。


    若有必要讲说一个奥秘：万有之父与那降下来的童女联合；那一天，有火光照亮了他。他显明了伟大的新房，因此他的身体在那一天产生了。他从新房出来，像由新郎和新妇所生的那一位。耶稣就是这样在自己里面设立了一切。每一个门徒也必须借着这些进入他的安息。


    亚当由两个童贞者产生：由灵，也由未受玷污的土地。因此，基督由童女所生，为要纠正起初发生的堕落。


    乐园里长着两棵树：一棵生出[走兽]，另一棵生出人。亚当[吃了]那棵生出走兽之树的果子，[他]就成了走兽，也生出[走兽]。所以亚当的儿女敬拜[走兽]。那树……是果子……他们这样……吃了……的果子……生出人……人的……神造人，……人造[神]。世上的情形正是如此：人造出诸神，又敬拜自己所造的。倒不如让诸神敬拜人！


    事实是，人的工作出于他们的能力，因此他们被称为“诸权势”。他们的作品就是他们的儿女，是在安息中产生的。所以，他们的能力存在于自己的作品中，安息却显明在自己的儿女身上。你会发现，这一点也延伸到形像。这就是形像中的人：他们凭自己的能力完成工作，却在安息中生育儿女。


    在这个世界，奴仆为自由人做工；在天国，自由人却要服事奴仆。新房之子要服事[婚姻]之子。新房之子有一个[共同]的名字：“安息”。他们[同在]，不需要取得形体，[因为他们拥有]观照……他们众多……与那些在……的人一同……诸荣耀的……不……他们……下到[水里……]他们要救赎自己……也就是那些……奉他的名，因为他说：“[这样]我们就要成全一切的义。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bridal chamber
  choice: 新房
  rationale: 采用现代汉语中指婚礼洞房的庄重用语，并在全文保持为该文献的核心奥秘术语；避免译作泛指的“婚房”。
- source_word: the powers
  choice: 诸权势
  rationale: 保留其既可指能力、又可指超人间势力的张力；在讨论人的 power 时依语境译为“能力”。
- source_word: chrism
  choice: 膏油
  rationale: 这里指施膏所用之物，并与“受膏”相关；译为“膏油”比直接教派化为某项固定礼仪更稳妥。
- source_word: rest
  choice: 安息
  rationale: 保留其神学性和奥秘性，也能表达停止劳作、进入圆满状态的语义。
- source_word: image
  choice: 形像
  rationale: 采用宗教文献中自然且较庄重的表达，不预先判定其本体论含义。
- source_word: beget / be born
  choice: 生出／受生／出生
  rationale: 按主语和语境区分主动生育、被动受生及一般出生，尽量保存原段反复运用“生”的修辞。
- source_word: virgin earth
  choice: 未受玷污的土地
  rationale: 在这里“virgin”形容尚未被耕作或玷污的土地；这样译可与前文人的“童贞者”区分，同时保留象征联系。
theological_decisions:
- issue: 亚当与夏娃的重新联合
  choice: 按文本直译为“使二者重新联合”，不解释为特定婚姻、性别或救恩教义
  alternative: 将联合明确解释成灵魂与灵、男性与女性或教会礼仪中的结合
  rationale: 残篇把创世叙事、新房和救赎彼此联系，但具体关系仍有歧义，不宜在译文中替作者定论。
- issue: 十字架上的“被分开”
  choice: 保留“因为他在那里被分开了”
  alternative: 解释为神性与人性分离、耶稣与父分离或身体与灵魂分离
  rationale: 上下文残缺，原见证只给出 divided；应保存其神学张力。
- issue: “真实的肉”与“真实之物的形像”
  choice: 逐项保留矛盾式残句和缺文
  alternative: 整理为一套连贯的幻影论或肉身论陈述
  rationale: 手稿损坏严重，任何顺畅化都会不当地解决文本的表面矛盾。
- issue: 礼仪次序：洗礼、救赎、新房
  choice: 保留文本中的对应和等级性语言
  alternative: 按后世某教派的圣礼体系统一术语或次序
  rationale: 该段自身结构独特，不应套用后世宗派框架。
- issue: “救赎自己”
  choice: 保留残文中的反身表达
  alternative: 改成“被神救赎”或“使自己得救”
  rationale: 上下文缺损，反身形式的确切神学含义不清，译文不作教义校正。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。方括号表示补拟或不确定复原，省略号表示手稿缺损；由于所提供材料明确注明尚待科普特文直接复核，本稿属于依据公共领域英文见证制作的暂定源证草案。为避免虚构校勘信息，本次不另设脚注。
