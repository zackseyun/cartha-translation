translation:
  language: zh_hans
  text: '《雅各原福音》第4章　主的应许


    (1) 看哪！主的一位天使站在旁边，对她说：“安娜，安娜，主已经听见了你的祷告。你必怀孕生子，你的后裔必传遍全世界，为人所谈论。”


    安娜说：“我指着永生的主上帝起誓，无论我生的是男孩还是女孩，我都要把这孩子作为礼物献给主我的上帝；这孩子一生都要事奉他。”


    (2) 看哪！两位天使来到她那里，对她说：“看哪！你的丈夫约雅敬正带着羊群回来。”原来，主的一位天使已经下到约雅敬那里，对他说：“约雅敬，约雅敬，主上帝已经听见了你的祷告。你从这里下去吧。看哪！你的妻子安娜已经怀了孕。”[a]


    (3) 约雅敬立刻下去，召来牧人，对他们说：“给我牵十只无残疾、无瑕疵的羊羔来，这十只羊羔要献给主上帝。再给我牵十二头肥嫩的牛犊来，送给祭司和长老；还要牵一百只公山羊来，送给全体民众。”


    (4) 看哪！约雅敬带着羊群回来了，安娜站在门口。她看见约雅敬带着羊群回来，就立刻跑上前去，搂住他的脖子，说：“现在我知道，主上帝大大赐福给了我。看哪！寡妇不再是寡妇；看哪！没有怀过孩子的，如今已经怀孕了。”[b]


    约雅敬回家的第一天，就在家中安歇。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经怀了孕”也可理解为“腹中已经受孕”。本稿所依据的希腊语直接校勘尚待完成。
    reason: 保留“conceived in her womb”的措辞范围，并明确当前底本限制。
  - marker: b
    text: “寡妇”是安娜在丈夫归来时所用的修辞性说法；本段并未说约雅敬曾经死亡。
    reason: 防止现代读者把这句话误读为丈夫死而复生，同时不消解原文的突兀表达。
lexical_decisions:
- source_word: ἰδού / ‘look’ (as represented in the witness)
  choice: 看哪
  rationale: 保留叙事中反复出现的提示语及其经文式节奏；“看哪”庄重而为现代读者所能理解。
- source_word: σπέρμα / ‘offspring’ (as represented in the witness)
  choice: 后裔
  rationale: 保留集合性和延续性的含义，不把它过早限定为单数的“孩子”；下句再按语境明确为“这孩子”。
- source_word: λειτουργήσει / ‘minister’ (as represented in the witness)
  choice: 事奉
  rationale: 表达终身向上帝履行宗教服事的含义，又不额外指定具体职分。
- source_word: ἄμωμα / ἄσπιλα / ‘without spot or blemish’ (as represented in the witness)
  choice: 无残疾、无瑕疵
  rationale: 以自然中文保留献祭牲畜完整、无缺陷的双重表述。
- source_word: χήρα / ‘widow’ (as represented in the witness)
  choice: 寡妇
  rationale: 直译安娜带有修辞性的自称，不改写为较弱的“如同丧夫”。
- source_word: ἀνεπαύσατο / ‘rested’ (as represented in the witness)
  choice: 安歇
  rationale: 保留“休息、停留”的基本意义，同时维持古代叙事的庄重语体。
theological_decisions:
- issue: 安娜将孩子献给上帝的誓愿
  choice: “作为礼物献给主……一生都要事奉他”
  alternative: “奉献给主，终身在圣殿服事”
  rationale: 原文见证只明确献上和终身事奉，并未在本段明说服事地点；不擅自加入“圣殿”。
- issue: “你的后裔必……为人所谈论”的范围与语气
  choice: “必传遍全世界，为人所谈论”
  alternative: “必在全世界闻名”
  rationale: 避免把中性的“被谈论/被述说”解释成明确的声誉或赞誉，同时保留普世范围。
- issue: “寡妇不再是寡妇”
  choice: 保留字面上的悖论式表达
  alternative: 解释为“我不再像寡妇一样孤苦”
  rationale: 该话可能表达丈夫归来、羞辱消除或修辞性自况；保留原有张力，不替文本锁定单一解释。
translation_notes:
  register: 采用现代、庄重、可朗读的叙事中文；人名译作“安娜、约雅敬”。反复保留“看哪”，以呈现原叙事的强调和节奏。因所提供材料注明希腊语源文审查尚待完成，本稿属于依据公共领域英文见证并参考其所指希腊传统形成的暂定出版草稿；没有把英文POB当作不可审查的唯一底本。
