translation:
  language: zh_hans
  text: '**《雅各原福音》第11章：天使报喜**


    **(1)** 她拿起水罐，出去打水。看哪！有声音对她说：“蒙福的人，欢喜吧！主与你同在；你在妇女中是有福的。”


    马利亚向左右张望，想知道声音是从哪里来的。她非常害怕，就回到屋里。她放下水罐，拿起紫色线[a]，坐在自己的宝座上[b]纺织。


    **(2)** 看哪！主的一位天使站在她面前，说：“马利亚，不要害怕，因为你在万有之主面前蒙了恩。你将因神的话而怀孕[c]。”


    马利亚听见这话，就心里思量，说：“难道我要从主——永生神——怀孕，并且像所有女人一样生产吗？”


    **(3)** 主的天使对她说：“不是那样，马利亚；神的能力要荫庇你。因此，从你而生的那位圣者必称为至高者的儿子。你要给他起名叫耶稣，因为他要把自己的子民从他们的罪中拯救出来。”


    马利亚说：“看哪，我是主的婢女。愿你的话成就在我身上。”


    [a] “紫色线”也可理解为紫色织物或供纺织用的紫色材料；上下文描写的是马利亚承担的纺织工作。


    [b] 原文见证作“宝座”。这里保留这一不同寻常的称呼，不改写成普通的“座位”。


    [c] “因神的话而怀孕”保留原句的简洁和可能的多重理解；也可译作“借着神的话怀孕”。本句没有进一步说明“话”是宣告、媒介，还是带有位格意味的称谓。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紫色线”也可理解为紫色织物或供纺织用的紫色材料；上下文描写的是马利亚承担的纺织工作。
    reason: 保留“the purple”所反映的词义范围，并说明正文按动作语境所作的选择。
  - marker: b
    text: 原文见证作“宝座”。这里保留这一不同寻常的称呼，不改写成普通的“座位”。
    reason: 提醒读者该显眼措辞不是汉译误用，也避免静默正常化。
  - marker: c
    text: “因神的话而怀孕”保留原句的简洁和可能的多重理解；也可译作“借着神的话怀孕”。本句没有进一步说明“话”是宣告、媒介，还是带有位格意味的称谓。
    reason: 标明介词关系和“话”的神学歧义，防止译文过度解释。
lexical_decisions:
- source_word: Rejoice, blessed one
  choice: 蒙福的人，欢喜吧
  rationale: 既保留命令式“欢喜吧”，也保留对马利亚“蒙福”的称呼，避免仅译为一般问候语。
- source_word: the purple
  choice: 紫色线
  rationale: 按纺织语境作自然表达，同时以脚注保留其也可能指紫色织物或材料的词义范围。
- source_word: throne
  choice: 宝座
  rationale: 依见证直译其显著而不寻常的用词，不擅自弱化为“椅子”或“座位”。
- source_word: Lord of All
  choice: 万有之主
  rationale: 保留“主宰一切”的称号意义，措辞庄重且符合现代汉语。
- source_word: conceive from/by God's word
  choice: 因神的话而怀孕
  rationale: 保留介词关系及“话”的语义张力，不明确指定为宣告、工具或具位格者。
- source_word: overshadow
  choice: 荫庇
  rationale: 保留遮蔽、临到的意象及宗教语体，不将其解释性改写为单纯“保护”或“使怀孕”。
- source_word: servant
  choice: 婢女
  rationale: 说话者为女性，原句表达谦卑从属身份；“婢女”比泛称“仆人”更贴近此处语境。
theological_decisions:
- issue: “因神的话而怀孕”中“话”的性质
  choice: 保留“神的话”的未决含义
  alternative: 将“话”明确译作具位格的“道”，或解释为神的命令／宣告
  rationale: 所提供的见证没有充分依据要求在正文中选定某一种神学解释，因此保留其真实歧义。
- issue: 马利亚所问“从主——永生神——怀孕”的表达
  choice: 保留问题中直接而突兀的来源表述
  alternative: 缓和为“靠着主的能力怀孕”或“为主生子”
  rationale: 原见证的神学张力正在于马利亚如何理解怀孕；不应以解释性措辞替她消解问题。
- issue: “荫庇”与受孕之间的关系
  choice: 按因果语序保留，但不补充生理或教义解释
  alternative: 明确译成圣灵使她受孕
  rationale: 本章所给文本说的是“神的能力”，没有在此处明确说“圣灵”；译文不从其他报喜传统补入措辞。
- issue: “至高者的儿子”
  choice: 至高者的儿子
  alternative: 上帝的儿子
  rationale: 保留本段特定称号，不用较概括的神学称谓替换。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；以“看哪”保留反复出现的突显语气。人物对白避免古奥文言，但在“万有之主”“荫庇”“至高者”等关键称号和意象上保持礼仪性与历史文本的庄重感。由于项目所供材料注明希腊文直接复核尚待进行，本稿以所供公共领域英文见证及审校层为依据，避免声称已经解决底本层面的异文或语法问题。
