translation:
  language: zh_hans
  text: '《雅各原福音》第20章：撒罗米的查验


    (1) 她进去，让她摆好姿势；撒罗米便查验她的身体状况。[a] 撒罗米喊道：“我试探了永生的上帝。看哪！我的手像被火烧，正从我身上脱落！”


    (2) 她向主祷告，就在那一刻，那接生婆得了医治。


    (3) 看哪！主的一位天使站在撒罗米面前，说：“你的祷告已经蒙主上帝垂听。去摸那孩子，你就会得到拯救。”[b]


    (4) 她照着做了，撒罗米便得了医治。她敬拜之后，离开了洞穴。看哪！主的一位天使发声说：“撒罗米，撒罗米，要把你所看见的奇事传扬出去，直到那孩子进入耶路撒冷。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句连续使用的“她”所指不够明确：可理解为先前的接生婆进去安置产妇，随后撒罗米查验产妇；所据见证并未把各代词的指代完全说清。
    reason: 保留原见证中的代词歧义，避免擅自用专名消除不确定性。
  - marker: b
    text: “拯救”在这里可能包括从手所受的灾害中获救、得到医治，也可能带有更广的救恩意味。
    reason: 说明源词的语义范围，不把神学与身体层面的含义强行二选一。
  - marker: c
    text: 所据英文见证作肯定命令：“传扬……直到……”。然而，这一位置需要直接核对希腊文，因为相关文本也可能表达：“在孩子进入耶路撒冷以前，不要传扬你所看见的奇事。”
    reason: 当前希腊文审校尚未完成，而是否含否定词会显著改变句义，故需向读者公开说明。
lexical_decisions:
- source_word: tested the living God
  choice: 试探了永生的上帝
  rationale: “试探”保留向上帝提出验证、冒犯性考验的意味；“永生的上帝”采用庄重而通行的现代汉语表达。
- source_word: on fire and falling away from me
  choice: 像被火烧，正从我身上脱落
  rationale: 保留两个强烈的身体意象，不将其弱化为泛指疼痛或受伤。加入“像”使中文自然，同时避免断言手上出现可见火焰。
- source_word: in that hour
  choice: 就在那一刻
  rationale: 此处表达即时发生；现代汉语用“就在那一刻”比直译“在那一小时”更准确自然。
- source_word: salvation
  choice: 拯救
  rationale: 保留既可指身体获救或医治、也可能带有更广救恩含义的词义张力，不直接窄化为“痊愈”。
- source_word: wonderful things
  choice: 奇事
  rationale: 表示超乎寻常、令人惊异之事，符合叙事语域，也不额外判定其神学性质。
theological_decisions:
- issue: 撒罗米“试探永生的上帝”的性质
  choice: 直译为“试探了永生的上帝”
  alternative: “考验了永生的上帝”或“怀疑了永生的上帝”
  rationale: “试探”同时保留验证与冒犯上帝的张力；“怀疑”会加入原句未明说的心理状态。
- issue: 触摸孩子后所得的“salvation”
  choice: 译作“拯救”
  alternative: 译作“医治”或“痊愈”
  rationale: 下文确实叙述撒罗米得医治，但天使话语本身使用更宽泛的救助性语言，不宜提前把含义完全限定为身体康复。
- issue: 末句关于传扬奇事与孩子进入耶路撒冷的时间关系
  choice: 依所提供见证保留肯定命令与“直到”结构
  alternative: 按某些文本理解译为“在孩子进入耶路撒冷以前，不要传扬”
  rationale: 当前任务所提供的公开领域英文见证没有否定词。由于希腊文直接复核尚待完成，正文不擅自补入否定，但以脚注明确提示这一关键文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留“看哪”等古代启示性叙事标志，但避免过度文言化。对人称指代、救恩含义及末句时间命令的文本张力均不作无依据的消解。本稿依据所提供的公开领域英文见证拟定，尚待希腊文原文逐词复核。
