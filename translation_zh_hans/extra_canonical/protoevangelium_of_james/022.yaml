base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/022.yaml
  text: '(1) When Herod realized that the magi had tricked him, he became angry. He sent out his killers and ordered them to kill every infant two years old and younger.


    (2) When Mary heard that the infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that they were looking for John, she took him into the hills and searched for a place to hide him, but there was nowhere to hide. Then Elizabeth groaned and said, “Mountain of God, take in a mother with her child,” because Elizabeth could not climb any higher. Immediately, the mountain split open and received her, and a light shone through the mountain for her. For an angel of the Lord was with them, protecting them.'
translation:
  language: zh_hans
  text: '（1）希律见自己被贤士们愚弄，就大发怒气。他派出刽子手，命令他们杀死所有两岁及以下的婴孩。


    （2）马利亚听说婴孩正在被杀，就害怕起来。她抱起自己的孩子，用布包好，放在牛的食槽里。


    （3）伊利莎白听说有人在寻找约翰，就带着他上了山地，四处寻找可以藏身的地方，却找不到。于是伊利莎白呻吟着说：“上帝的山啊，接纳这位母亲和她的孩子吧！”因为伊利莎白已经无法再往高处爬了。山立刻裂开，接纳了她；有一道光穿过山体，为她照亮。因为主的一位天使与他们同在，保护着他们。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章译文暂依据所提供的公版英语见证拟定；希腊文抄本传统尚待直接复核。
    reason: 资料明确说明源语言审查尚未完成，因此需要向读者标示文本依据的暂定性质。
lexical_decisions:
- source_word: magi
  choice: 贤士们
  rationale: 采用现代中文读者易懂且较为中性的传统译法，不把其身份具体化为君王或某一类术士。
- source_word: killers
  choice: 刽子手
  rationale: 表达受希律差遣执行杀戮的人；较“杀手”更符合奉命处死人的叙事情境。
- source_word: infants
  choice: 婴孩
  rationale: 保留所给见证中对幼小儿童的称呼，并与“两岁及以下”的范围并置，不擅自改成“男婴”。
- source_word: manger for cows
  choice: 牛的食槽
  rationale: 直接说明器物及用途，避免“马槽”这一中文传统说法与见证所指的牛相冲突。
- source_word: Mountain of God
  choice: 上帝的山
  rationale: 保留呼语的直译和神圣归属关系，不将其解释为特定山名。
- source_word: took her / received her
  choice: 接纳了她
  rationale: 与伊利莎白请求山“接纳”母子相呼应，同时保留山裂开容纳她的奇异叙述。
theological_decisions:
- issue: 贤士与希律之间谁欺骗谁
  choice: 希律见自己被贤士们愚弄
  alternative: 希律意识到贤士们欺骗了他
  rationale: 依所给见证保留希律的主观认定，不额外判断贤士是否蓄意欺骗。
- issue: 山中光的性质
  choice: 有一道光穿过山体，为她照亮
  alternative: 山里有神光为她照耀
  rationale: 不把叙述中的“光”神学化或明确为超自然本体，只保留其与天使保护并列的叙事关系。
- issue: 天使保护对象的数目
  choice: 保护着他们
  alternative: 保护着她们母子
  rationale: 保留见证中的复数指代，不强行消除其可能包含伊利莎白与约翰或更广对象的含混性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。叙事保持简洁，保留原见证中的奇异意象与代词含混；人名采用常见中文圣经译名。
