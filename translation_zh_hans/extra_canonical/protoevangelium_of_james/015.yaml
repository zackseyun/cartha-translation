translation:
  language: zh_hans
  text: '《雅各原福音》第15章　大祭司审问马利亚和约瑟


    (1) 文士亚那来到约瑟那里，对他说：“约瑟，你为什么没有在我们同行的人中露面？”


    约瑟对他说：“因为旅途使我疲惫，回来后的第一天我便歇息了。”


    亚那转过身，看见马利亚怀了孕。


    (2) 他急忙到祭司那里，对他说：“你曾为约瑟作证，但他行了极其不法的事。”


    祭司说：“什么事？”


    他说：“约瑟从主的殿里领走的那个童女，他玷污了她，偷了她的婚事[a]，却没有向以色列民公开。”


    祭司回答说：“约瑟真做了这事吗？”


    文士亚那对他说：“请派差役去，你就会发现那童女怀了孕。”


    差役去了，发现她果然像他说的那样。他们便把她和约瑟一同带到审判处。


    (3) 大祭司对她说：“马利亚，你为什么做这事？你为什么羞辱自己，忘记主你的上帝？你在至圣所里长大，从天使手中领受食物，听见它的颂歌[b]，并在它面前起舞。你做的这是什么事？”


    她痛哭着说：“主上帝永远活着！我在上帝面前是清白的，我从未亲近过男人[c]！”


    (4) 祭司说：“约瑟，你做的这是什么事？”


    约瑟说：“主我的上帝永远活着！以上帝的真实为证，我对她是清白的[d]。”


    祭司说：“不可作假见证，要说实话。你偷了她的婚事[a]，没有向以色列民公开，也没有在那大能的手下低头；那手本该赐福给你的后裔[e]。”


    约瑟沉默不语。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偷了她的婚事”是所据见证中的异常说法，可能涉及秘密占有婚姻权利或未公开婚事；原意尚待希腊文校核。
    reason: 防止读者把直译误解为偷窃一场婚礼，同时保留文本的真实含混。
  - marker: b
    text: “它”在所据见证中语法所指不寻常，可能回指天使；希腊文原文及抄本异文仍待复核。
    reason: 明确代词难点，不在正文中暗自修正。
  - marker: c
    text: “亲近过男人”字面是“认识男人”，是指发生性关系的委婉说法。
    reason: 帮助现代读者理解古代惯用语。
  - marker: d
    text: “对她是清白的”保留了所据见证的表达，意指约瑟否认自己曾对马利亚行不当之事。
    reason: 说明关系性措辞，同时避免把否认内容限定得过窄。
  - marker: e
    text: 本句把“大能的手”描写为赐福后裔者，措辞和关系较为含混；也可能与婚姻公开后所领受的祝福有关。
    reason: 保留神学与仪式语境中的不确定性，等待直接核对希腊文。
lexical_decisions:
- source_word: scribe
  choice: 文士
  rationale: 采用符合古代犹太宗教与法律语境的通行称谓，避免现代职业性的“书记员”造成误解。
- source_word: traveling group
  choice: 同行的人
  rationale: 自然表达共同出行的群体，同时不把其具体性质过度确定为商队或朝圣队伍。
- source_word: acted very lawlessly
  choice: 行了极其不法的事
  rationale: 保留强烈的违法、悖逆色彩，不缩减为一般性的“做错事”。
- source_word: stolen her wedding
  choice: 偷了她的婚事
  rationale: 保留见证文本中突兀而含混的比喻表达，不擅自解释为秘密成婚、侵犯婚约或发生性关系。
- source_word: court
  choice: 审判处
  rationale: 表达被带去接受司法或宗教审问的场所，而不武断指定为现代法庭。
- source_word: Holy of Holies
  choice: 至圣所
  rationale: 采用标准宗教用语，准确体现圣殿最神圣的空间。
- source_word: known a man
  choice: 亲近过男人
  rationale: 以现代读者能够理解但仍较含蓄庄重的方式表达性关系；脚注说明其字面形式。
- source_word: pure toward her
  choice: 对她是清白的
  rationale: 保留约瑟所强调的关系方向及无罪申辩，不具体补入“没有碰她”等解释。
- source_word: mighty hand
  choice: 大能的手
  rationale: 保留圣经传统中的神圣权能意象，不改写为抽象的“上帝的权柄”。
theological_decisions:
- issue: 马利亚的贞洁声明
  choice: 我在上帝面前是清白的，我从未亲近过男人
  alternative: 我是童贞女／我没有与男人发生关系
  rationale: 既传达声明的性伦理含义，也保留“认识男人”这一闪族式委婉表达在脚注中的可见性，不将其发展为超出本段的教义陈述。
- issue: 约瑟誓言的见证结构
  choice: 主我的上帝永远活着！以上帝的真实为证
  alternative: 我指着永生的主和上帝真实的见证起誓
  rationale: 见证文本的句法略显异常；译文保留誓言与上帝之真实作证两个层面，而不强行重构其神学逻辑。
- issue: 大能之手赐福后裔
  choice: 那手本该赐福给你的后裔
  alternative: 使你在大能之手下蒙福并得后裔
  rationale: 保留所给见证中“手”作为赐福主体以及“后裔”为受福对象的关系，不将含混句式改造成明确的婚礼祝福仪式。
- issue: 天使代词所指
  choice: 听见它的颂歌，并在它面前起舞
  alternative: 听见天使们歌唱，并在他们面前起舞
  rationale: 所给见证使用单数中性代词且指向不自然；在希腊文复核前保留这一异常，不擅自改成复数天使或另定所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留反复的“对他说”和审讯式问答，以体现古代叙事节奏。标题中的 An(n)as 按常见音译作“亚那”，不与新约人物身份强行等同。本稿依据所提供的公共领域英语见证拟定，希腊文抄本传统尚未直接复核，因此对“偷了她的婚事”、天使代词、约瑟的誓言及“大能的手”等疑难处采取保守译法并加注。
