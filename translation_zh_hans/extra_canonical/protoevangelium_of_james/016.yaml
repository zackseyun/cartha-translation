    reason: 澄清复数代词所指，并避免将“未显露”解释为超出见证措辞的更强断言。
  revision_rationale: 修订限于恢复见证文本的语义力度和叙事范围：“责问”避免把揭露性的试验预先译成惩罚；末句删除“回”“一路”等未明说的信息。其余用语维持原稿的现代庄重中文及其对歧义的审慎处理。
