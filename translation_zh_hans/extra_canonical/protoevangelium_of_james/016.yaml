review_pass:
  verdict: revise
  source_fidelity: 需要修订。“主责罚的水”把 English witness 的 “water of the Lord’s rebuke” 强化为带有惩罚结果的“责罚”，而见证本身只明确其为责备、揭露罪的试验用水。末句“一路欢喜”也添加了原文没有限定的行程信息。其余叙事顺序、人物、试验结果和判词基本忠实于所给见证。
  naturalness: 整体庄重、流畅，适合现代标准汉语的经文语体。将“回家，一路欢喜”改为“到自己家里，欢喜快乐”，可避免添加信息，也更贴近原句的并列状态。
  terminology: “童女”“主的圣殿”“旷野”“安然无恙”“以色列的上帝”均合适。“主的责备之水”比“主责罚的水”更忠实地保留原见证的措辞及其性质；不应在正文中将其定为惩罚或特定律法仪式。
  issues:
  - severity: medium
    issue: “主责罚的水”将“rebuke”译得过强。
    rationale: “责罚”通常表示已经施行或必将施行的惩罚；所给见证称其为“主的责备之水”，并说该水会使罪显露。改作“主的责备之水”可保留仪式性和语义开放性。
  - severity: low
    issue: “一路欢喜”增添了原文未明说的时间／行程限定。
    rationale: 原文只说约瑟带马利亚到自己的家里，欢喜并颂赞上帝；改为“欢喜快乐，颂赞……”即可。
  - severity: low
    issue: 首句“领走”可改为“带走”。
    rationale: “带走”是对 took 的更直接、自然对应；“交还”已充分表达归还的命令。
  revised_text: '（1）祭司说：“把你从主的圣殿带走的那童女交还。”


    约瑟流泪了。


    大祭司说：“我要给你喝主的责备之水；这水会使你的罪在你眼前显露出来。”[a]


    （2）祭司取了那水，给约瑟喝，又差他到旷野去。约瑟安然无恙地回来了。


    祭司也给马利亚喝，又差她到旷野去。她也安然无恙地回来了。


    众人都很惊讶：他们的罪竟没有显露出来。[b]


    （3）祭司说：“主上帝既没有向你们显明你们的罪，我也不定你们的罪。”于是，他释放了他们。


    约瑟便带着马利亚到自己家里，欢喜快乐，颂赞以色列的上帝。'
  revised_footnotes:
  - marker: a
    text: “主的责备之水”也可理解为“主用来责备的水”。这水被说成会使罪在受试者眼前显露；它可能呼应《民数记》第5章的试验仪式，但现有见证没有明说。
    reason: 保留属格关系及仪式背景的开放性，不将“责备”强化为已经施行的惩罚，也不在正文中断定其等同于特定律法仪式。
  - marker: b
    text: “他们的罪没有显露出来”按现有见证直译其叙事判断，指试验未揭露他们被指控的罪行；这句话本身不进一步说明罪是否实际存在。
    reason: 保留试验结果与罪责事实之间的叙事张力，不擅自改写为绝对无罪或实际有罪的断言。
  revision_rationale: 本次修订主要校正“责罚”对“rebuke”的过度强化，并删除“一路”这一无原文依据的补充。保留“童女”、圣殿、旷野、试验后安然返回、未显露罪以及祭司释放二人的叙事结构。判词按上下文译为复数“你们”；由于所供英文见证与现有草稿都未提供希腊文形态，仍应在直接希腊语复核时确认该处人称和“责备之水”的确切措辞。
