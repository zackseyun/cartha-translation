review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所给英语见证的事件次序和审判试验情节；但“water of the Lord’s rebuke”译为“主责罚的水”将“责备／责问”加强为实际施罚，且末句“回家，一路欢喜”分别增添了“回”和“一路”的信息。
  naturalness: 行文庄重、通顺，适合古代宗教叙事。将末句改为“到自己家里去，欢喜快乐”后，可避免不必要的路径和返家预设。
  terminology: “童女”“圣殿”“旷野”“以色列的上帝”均恰当。“主的责问之水”较能保留英语见证中 rebuke 的审断、揭露语义，而不预断为惩罚。
  issues:
  - severity: medium
    issue: “主责罚的水”强化了 water of the Lord’s rebuke 的含义。
    rationale: “责罚”通常指已施加的惩罚；见证文本所强调的是借水揭露罪的审验／责问，尚不必然表示已施刑。
  - severity: low
    issue: “约瑟便带着马利亚回家，一路欢喜”添加了原文未明说的“回”和“一路”。
    rationale: 见证只说约瑟带着马利亚到他的家里去，并以欢喜、颂赞描述二人的状态；应避免补入旅程方式或该处必为其原先住所的预设。
  - severity: low
    issue: 脚注b中的“因为他们的罪没有显露出来”可更中性地表述为试验结果。
    rationale: 原文为众人对“罪未被揭露”感到惊讶；以“因为”并非错误，但“见……没有显露出来”更贴合叙事观察。
  revised_text: '（1）祭司说：“把你从主的圣殿领走的那童女交回来。”


    约瑟流下泪来。


    大祭司说：“我要给你喝主的责问之水；这水会使你的罪显露在你眼前。”[a]


    （2）祭司取了那水，给约瑟喝，又差他到旷野去。约瑟安然无恙地回来了。


    祭司也给马利亚喝，又差她到旷野去。她也安然无恙地回来了。


    众人见他们的罪没有显露出来，都很惊讶。[b]


    （3）祭司说：“主上帝既没有向你们显明你们的罪，我也不定你们的罪。”于是释放了他们。


    约瑟便带着马利亚到自己家里去，欢喜快乐，颂赞以色列的上帝。'
  revised_footnotes:
  - marker: a
    text: “使你的罪显露在你眼前”也可理解为“使你的罪在你面前显明”。“主的责问之水”保留该水作为审验并揭露罪情的作用；它可能呼应《民数记》第5章的试验仪式，但现有见证没有明说。
    reason: 保留措辞的审断和空间意象，并说明可能的经文互文而不在正文中等同两种仪式。
  - marker: b
