translation:
  language: zh_hans
  text: '（1）祭司说：“把你从主的圣殿领走的那童女交回来。”


    约瑟流下泪来。


    大祭司说：“我要给你喝主责罚的水；这水会使你的罪显露在你眼前。”[a]


    （2）祭司取了那水，给约瑟喝，又差他到旷野去。约瑟安然无恙地回来了。


    祭司也给马利亚喝，又差她到旷野去。她也安然无恙地回来了。


    众人都很惊讶，因为他们的罪没有显露出来。[b]


    （3）祭司说：“主上帝既没有向你们显明你们的罪，我也不定你们的罪。”于是释放了他们。


    约瑟便带着马利亚回家，一路欢喜，颂赞以色列的上帝。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使你的罪显露在你眼前”也可理解为“使你的罪在你面前显明”。这里所说的水可能呼应《民数记》第5章的试验仪式，但现有见证没有明说。
    reason: 保留措辞的空间关系与可能的经文互文，不在正文中过度解释。
  - marker: b
    text: “他们的罪没有显露出来”是按现有见证直译其叙事判断；这句话强调试验没有揭露罪行。
    reason: 避免将“没有显露”静默改写为更强的神学断言。
lexical_decisions:
- source_word: virgin
  choice: 童女
  rationale: 保留叙事对马利亚身份的强调；“童女”庄重而易懂，也比单用“女子”更贴近见证文本。
- source_word: Temple of the Lord
  choice: 主的圣殿
  rationale: 以“圣殿”表达耶路撒冷圣所语境，并保留“主”这一神圣称谓。
- source_word: water of the Lord’s rebuke
  choice: 主责罚的水
  rationale: 保留仪式性及审判意味，不擅自将其具体化为“苦水”或解释成某一种法定仪式。
- source_word: wilderness
  choice: 旷野
  rationale: 采用圣经语体中的常用对应词，同时保持其地点和试验场景的开放性。
- source_word: unharmed
  choice: 安然无恙
  rationale: 自然表达二人经受考验后没有受到伤害或刑罚的结果。
- source_word: judge
  choice: 定……的罪
  rationale: 在司法和宗教审断语境中比泛义的“判断”更准确，也与前文所指控的罪相呼应。
- source_word: God of Israel
  choice: 以色列的上帝
  rationale: 保留传统称号，不添加盟约或民族神学方面的解释。
theological_decisions:
- issue: 试验之水与《民数记》疑妻仪式的关系
  choice: 译作“主责罚的水”，不在正文中明确等同于某一律法仪式
  alternative: 译作“主的苦水”或直接称为“疑恨的素祭/试验之水”
  rationale: 现有材料只是英语见证，希腊语复核尚未完成；保留可能的经文呼应，同时避免把隐含关系说成明示关系。
- issue: “他们的罪”是否暗示二人确实有罪
  choice: 按见证文本保留“他们的罪没有显露出来”这一带条件性的说法
  alternative: 解释性译为“他们并没有犯罪”
  rationale: 原叙事以试验结果证明指控未获显明；不把“未显露”进一步解释成作者明确宣告绝对无罪。
- issue: 祭司判词的对象是单数还是复数
  choice: 依上下文译作复数“你们”，并以脚注说明见证文本表面形式可能为单数
  alternative: 逐字保留单数“你”
  rationale: 约瑟和马利亚都接受了试验且一同被释放，中文用复数更合乎叙事；但底本文法细节需待希腊语复核。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文，保留古代宗教审判场景的仪式感。因直接希腊语审校尚未完成，本稿以所给公共领域英语见证为临时依据；对“责罚的水”“显露在你眼前”以及判词人称等处采取审慎、不过度确定的表达。
