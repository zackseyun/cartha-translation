translation:
  language: zh_hans
  text: '《雅各原福音》第23章：撒迦利亚被杀


    (1) 希律却追问约翰的下落，派差役到撒迦利亚那里，对他说：“你把儿子藏在哪里？”


    他回答他们说：“我是侍奉神的人，坐在神的殿中。我怎么会知道儿子在哪里呢？”


    (2) 差役回去，把这一切都禀报希律。希律大怒，说：“他的儿子就要作以色列的王了！”


    他又派差役去对撒迦利亚说：“把实情告诉我！你的儿子在哪里？你知道，你的性命掌握在我手里。”


    差役回去，把这些话禀报了他。


    (3) 撒迦利亚说：“你们若流我的血，我就是神的见证人[a]，因为主必接纳我的灵；你们将要在主殿的入口处流无辜人的血。”


    约在破晓时分，撒迦利亚被杀害了；以色列百姓并不知道他已被杀害。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证人”也可按这里因流血而死的语境理解为“殉道者”。
    reason: 保留“martyr”一词从见证到殉道的双重语义，不在正文中只取其一而遮蔽另一层含义。
lexical_decisions:
- source_word: officers
  choice: 差役
  rationale: 按叙事语境指奉希律之命传话并执行命令的人；“差役”比现代行政色彩较强的“官员”更自然，也不预断其具体职衔。
- source_word: minister of God
  choice: 侍奉神的人
  rationale: 保留其宗教职分含义，同时避免将其过度具体化为某一后世教会职位。
- source_word: sit in God’s Temple
  choice: 坐在神的殿中
  rationale: 保留见证文本中略显特殊的“坐”这一具体表述，不擅自改成“供职”或“值班”。
- source_word: your life is in my hand
  choice: 你的性命掌握在我手里
  rationale: 以自然的现代汉语保留权柄与死亡威胁的比喻。
- source_word: martyr of God
  choice: 神的见证人
  rationale: “martyr”所对应的古代词义核心是“见证人”，在此又因即将流血而带有殉道含义；正文保留基本词义，脚注说明双重意涵。
- source_word: receive my spirit
  choice: 接纳我的灵
  rationale: 保持“灵”与神接纳之意，不扩展为对死后状态的更具体教义陈述。
- source_word: around daybreak
  choice: 约在破晓时分
  rationale: 保留时间的大约性，而不将其精确化。
- source_word: murdered
  choice: 被杀害
  rationale: 传达非正当杀戮的负面判断，且符合现代庄重叙事语体。
theological_decisions:
- issue: “martyr”兼有“见证人”与“殉道者”的意义
  choice: 正文译作“神的见证人”，并以脚注交代“殉道者”的语境含义
  alternative: 直接译作“神的殉道者”
  rationale: 这样既保留古代词汇的基本语义，也不抹去流血受死所形成的殉道意味。
- issue: 撒迦利亚在神殿中的身份
  choice: 译作“侍奉神的人”
  alternative: 译作“神的祭司”或“神的仆役”
  rationale: 所提供的见证文本仅称其为 minister；不在正文中加入该句未明说的具体祭司称号。
- issue: 主接纳撒迦利亚的灵
  choice: 直译为“主必接纳我的灵”
  alternative: 解释为“主必使我上天堂”
  rationale: 保留原陈述的神学张力，不补入关于来世归宿的具体体系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留段落编号和叙事中的重复结构，但适度调整汉语语序。此稿依据所提供的公版英文见证及经审核的英文咨询层拟定；希腊文源语复核尚待完成，因此涉及“差役”“见证人”等词的最终形式仍应由希腊文传统校核。
