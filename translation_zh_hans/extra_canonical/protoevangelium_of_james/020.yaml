translation:
  language: zh_hans
  text: '《雅各原福音》第二十章　撒罗米的查验


    （1）接生婆走进去，说：“马利亚，摆好姿势，因为将有一场不小的查验临到你。”


    撒罗米便查验了她。撒罗米大声喊道：“我有祸了！因我的不法和不信，我竟试探了永活的神。看哪！我的手着了火，正从我身上脱落！”


    （2）她跪倒在主面前，说：“我祖先的神啊，求你记念我，因为我是亚伯拉罕、以撒和雅各的后裔。不要使我在以色列民中成为惩戒的例子，却要把我还给穷人[a]；因为主啊，你知道，我曾奉你的名医治人，也从你领受了我的报酬。”


    （3）看哪！主的一位天使显现，对她说：“撒罗米，撒罗米，万有之主已经听见了你的祷告。把手伸向这孩子，抱起他来，你就会得着救恩和喜乐。”


    （4）看哪！撒罗米欢欢喜喜地走到孩子那里，抱起他来，说：“我敬拜他，因为有一位伟大的王为以色列诞生了。”撒罗米立刻得了医治，并且称义[b]离开了洞穴。


    看哪！有声音说：“撒罗米，撒罗米，在这孩子进入耶路撒冷以前，不要把你所看见的奇妙之事传扬出去。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把我还给穷人”依现有英文见证直译；原句含义不明，也可能涉及恢复她在穷人中的服事。须待希腊文抄本传统复核。
    reason: 保存难解措辞，避免无根据地补出受词或目的。
  - marker: b
    text: “称义”也可理解为“得以平反”或“被判为无罪”；这里没有明确说明其确切范围。
    reason: 提示原表达兼有司法和神学意味，防止读者误以为译文已排除其他可能。
lexical_decisions:
- source_word: position yourself
  choice: 摆好姿势
  rationale: 保留接生婆要求马利亚配合身体查验的语境，同时不额外描写查验细节。
- source_word: no small test
  choice: 一场不小的查验
  rationale: 保留原文的轻描式强调，并以“查验”衔接撒罗米随后的检查行为。
- source_word: lawlessness
  choice: 不法
  rationale: 保留其道德与宗教层面的严肃含义，不弱化为一般的“过错”。
- source_word: the living God
  choice: 永活的神
  rationale: 采用庄重而易懂的圣经式表达，体现神与偶像或死物的对照。
- source_word: Lord of All
  choice: 万有之主
  rationale: 自然表达其普世主权含义，并避免限定为某一宗派术语。
- source_word: lift him up
  choice: 抱起他来
  rationale: 在婴孩语境中比字面的“举起”自然，同时保留实际动作。
- source_word: justified
  choice: 称义
  rationale: 保留原词可能具有的司法与宗教双重意味，不擅自改写为单纯“痊愈”或“获准离开”。
- source_word: report
  choice: 传扬出去
  rationale: 表达不只私下讲述，而是将所见奇事公开传播的含义。
theological_decisions:
- issue: 撒罗米对孩子说“我敬拜他”
  choice: 我敬拜他
  alternative: 我向他下拜
  rationale: 所据见证使用“worship”，具有敬拜或俯伏致敬的潜在张力；正文保留较强表达，不将其降格为一般尊敬，也不添加基督论解释。
- issue: “你就会得着救恩和喜乐”中救恩的范围
  choice: 救恩和喜乐
  alternative: 医治和喜乐
  rationale: 保留“salvation”的宽广神学含义，不因随后手得医治就把它缩限为身体康复。
- issue: “称义离开洞穴”的意义
  choice: 并且称义离开了洞穴
  alternative: 得到证实后离开了洞穴
  rationale: 保留司法、神学或叙事性平反之间的歧义，不把它明确归结为某一种称义教义。
- issue: 亚伯拉罕、以撒、雅各后裔的申诉
  choice: 直译保留其盟约身份诉求
  alternative: 解释为凭血统要求赦免
  rationale: 文本只呈现撒罗米的祷告理由，并未系统说明血统与蒙恩的关系，故不增添赞同或批判。
translation_notes:
  register: 采用现代、庄重而通顺的普通话，并保留“看哪”等叙事标志。正文以所提供的公版英文见证为临时依据；由于希腊文原始语言审查尚未完成，本稿应视为待复核的出版草案。人物名采用“撒罗米”，以区别于现代常见音译“莎乐美”所带来的文化联想。
