base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/030.yaml
  text: '(1) And look! Joseph was preparing to leave for Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers and sent for the magi, and they told him about the star.


    (3) And look! They saw stars in the East. The stars led the magi until they came to the cave, and the star stood over the child’s head. When the magi saw him with his mother Mary, they took gifts from their bags: gold, frankincense, and myrrh.


    After being warned by the angel, they returned to their country by another way.'
translation:
  language: zh_hans
  text: '（1）看哪！约瑟正准备往犹太地去，犹太地的伯利恒却起了一阵大骚动。原来有星象家[a]来到，说：“犹太人的王在哪里？我们在东方[b]看见了他的星，特来敬拜[c]他。”


    （2）希律听见了，心里不安，就差遣官员去召那些星象家来；他们便把那颗星的事告诉了他。


    （3）看哪！他们在东方看见了众星[d]。众星引领他们，直到他们来到那山洞；那颗星停在孩子头顶上方。星象家看见孩子和他母亲马利亚，就从行囊里取出礼物：黄金、乳香和没药。


    他们蒙天使警告以后，就从另一条路回自己的国家去了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “星象家”：原词常指古代研究天象、释梦并从事祭司性智慧活动的人，传统上也常译作“博士”；这里并非指现代学位。
    reason: 说明古代身份用语，避免现代语义误读。
  - marker: b
    text: “在东方”也可理解为“在升起之处”，即看见那颗星升起。
    reason: 保留方位表达与天文表达之间可能存在的歧义。
  - marker: c
    text: “敬拜”也可指向君王俯伏致敬；原有表达可涵盖这两层意思。
    reason: 保留宗教敬拜与王者礼敬之间的语义张力。
  - marker: d
    text: 本句作复数“众星”，随后则转为单数“那颗星”；译文保留这种变化。
    reason: 提示读者原证据中的数目转换，避免静默统一。
lexical_decisions:
- source_word: magi
  choice: 星象家
  rationale: 该词指古代观察天象、释梦或从事祭司性智慧活动的人；“星象家”比传统的“博士”更能让现代读者明白其身份，也避免误解为现代学位持有者。
- source_word: worship
  choice: 敬拜
  rationale: 保留该动作可能兼具向君王俯伏致敬与宗教敬拜的语义张力，不缩减为单纯“朝拜”或“致敬”。
- source_word: cave
  choice: 山洞
  rationale: 直译叙事地点，保留本书传统中出生地点与《马太福音》常见场景表达之间的差异。
- source_word: frankincense
  choice: 乳香
  rationale: 采用现代中文圣经及一般文献通行的香料名称。
- source_word: myrrh
  choice: 没药
  rationale: 采用通行的古代香料及药材名称。
theological_decisions:
- issue: 星象家对孩子所作动作的性质
  choice: 敬拜
  alternative: 朝拜／俯伏致敬
  rationale: 原证据所反映的词义可用于对神的敬拜，也可用于对君王的俯伏礼敬；正文保留较强而仍有语义范围的“敬拜”，脚注说明其张力。
- issue: “众星”转为“那颗星”的数目变化
  choice: 原样保留复数到单数的转变
  alternative: 全段统一译为单数“那颗星”
  rationale: 所提供的文本证据明确由复数转为单数；不以和谐化方式消除可能源于文本传统或叙事表达的张力。
- issue: 天使警告的媒介与内容
  choice: 仅译“蒙天使警告”
  alternative: 补明在梦中受指示不要回希律那里
  rationale: 本章所给文本没有交代警告发生于梦中，也没有明说警告内容，因此不从平行福音叙事补入。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“看哪”保留突显新事件的古典叙事语气；“大骚动”“心里不安”“行囊”等词自然清楚。鉴于希腊语直接复核尚待完成，本稿以所供公共领域英文见证为主要证据，特别审慎保留了“东方／升起之处”、敬拜动作及复数“众星”转单数“那颗星”等不确定性。
