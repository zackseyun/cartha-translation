base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/014.yaml
  text: '(1) Joseph was very afraid and kept quiet about her as he considered what to do. Joseph said, “If I hide her sin, I will be found resisting the law of the Lord. But if I reveal her to the people of Israel, I am afraid that what is inside her might be angelic, and I will be found handing innocent blood over to the judgment of death. So what will I do about her? I will secretly release her from me.”


    Night overtook him. (2) And look! An angel of the Lord appeared to him in a dream and said, “Do not fear this child, for the one in her is from the Holy Spirit. She will give birth to a son, and you will call his name ‘Jesus,’ because he will save his people from their sins.”


    Joseph awoke from his sleep and glorified the God of Israel, who had shown him grace. And he protected her.'
translation:
  language: zh_hans
  text: '《雅各原福音》第14章　约瑟的梦


    (1) 约瑟十分害怕，便对她的事保持沉默，思量该怎样处置。约瑟说：“如果我掩盖她的罪，就会显得是在抗拒主的律法；但如果我把她的事揭露给以色列民，我又怕她腹中所有的或许是出于天使[a]，这样我就会把无辜之血交给死刑的审判。我究竟该怎样处置她呢？我要暗中让她离开我[b]。”


    夜幕降临了。


    (2) 看哪！主的一位天使在梦中向他显现，说：“不要怕这孩子，因为她腹中所有的是出于圣灵。她将生一个儿子，你要给他取名叫‘耶稣’，因为他要把自己的子民从他们的罪中拯救出来。”


    约瑟睡醒后，就颂赞以色列的上帝，因为上帝向他施了恩。此后，他便保护她。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出于天使”依所据英文见证译出；也可理解为“具有天使性质”。希腊文底本尚待直接复核。
    reason: 这一罕见表达具有真实的词义与神学歧义，不宜在正文中静默消除。
  - marker: b
    text: “让她离开我”也可译作“解除她与我的关系”或“暗中休掉她”；原语措辞及其法律含义尚待希腊文复核。
    reason: 避免在源语审校完成前，过早确定这句话专指离婚还是解除婚约。
lexical_decisions:
- source_word: angelic (Greek source review pending)
  choice: 出于天使
  rationale: 保留所据英文见证中“angelic”的可能性语气和天使关联，不擅自改成“出于圣灵”或“神圣的”，也避免将约瑟此时的猜测与随后天使的启示混同。
- source_word: release her from me (Greek source review pending)
  choice: 让她离开我
  rationale: 采用自然而较中性的表达，保留解除双方关系的含义；因尚未直接核对希腊文本，不在正文中过度明确为正式离婚或解除婚约。
- source_word: the judgment of death
  choice: 死刑的审判
  rationale: 传达把无辜者交付可能导致死亡判决的司法含义，同时保持原文较凝重的措辞。
- source_word: the one in her
  choice: 她腹中所有的
  rationale: 尽量保留原句对腹中存在者的间接称说，避免提前用“胎儿”或“孩子”消除叙事中的含蓄。
- source_word: protected her
  choice: 保护她
  rationale: 遵循现有见证的直接意义，不额外扩展为娶她、收留她或与她同住。
theological_decisions:
- issue: 约瑟对马利亚腹中所有者的猜测
  choice: 译为“或许是出于天使”
  alternative: 译为“或许是神圣的”或“或许来自圣灵”
  rationale: 原见证明确保留“angelic”这一特殊而含混的判断；正文不把约瑟尚未获得启示时的猜测改写成后文的圣灵成孕宣告。
- issue: “出于圣灵”的表述
  choice: 保留“她腹中所有的是出于圣灵”
  alternative: 解释为圣灵创造、感孕或生育的具体机制
  rationale: 只陈述来源关系，不为文本未说明的成孕机制添加教义性解释。
- issue: 耶稣拯救自己的子民脱离罪
  choice: 译为“把自己的子民从他们的罪中拯救出来”
  alternative: 解释“自己的子民”具体指某一群体，或将“从罪中”改成“脱离罪的刑罚”
  rationale: 保留“自己的子民”所指范围及“从罪中拯救”的神学张力，不将其缩减为单一救赎模型。
- issue: 约瑟最后对她的行动
  choice: 译为“保护她”
  alternative: 译为“娶她为妻”或“照料她”
  rationale: 依照所据见证，不把较宽泛的保护行动具体化为文本未明说的婚姻或照护安排。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留叙事中的重复、疑惧和“看哪”的突显作用。由于项目资料明确标注希腊文源语审查尚未完成，本稿是依据公共领域英文见证形成的暂定出版草案；词义脚注集中标明最需要源语复核之处。
