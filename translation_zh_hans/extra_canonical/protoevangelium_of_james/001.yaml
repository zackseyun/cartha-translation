review_pass:
  verdict: revise
  source_fidelity: 本稿整体忠实传达了所供英文见证的叙事。根据希腊文常见文本，ὑπὲρ ἱλασμοῦ μου ... εἰς ἄφεσίν μοι宜明确为“作我的赎罪／使我得赦免”，而非可能令人理解为约雅敬自己执行“赎罪”行动的“为我赎罪”。有关十二支派的ἱστορίαι（或相关文本传统所反映的记录）仍有文献性质的不确定性，宜保留为较宽泛的“记载”，并将脚注锚定在首次出现处。第3节的“有子嗣”也比“养育过儿女”更贴合该处以“种／后裔”为核心的表述及前后“没有孩子”的论题。亚伯拉罕“末后的日子”在此译作“晚年”可接受。
  naturalness: 叙事体总体自然、庄重。“没有生养儿女”略显书面且容易偏向生育行为；“没有子嗣”在本段语境更凝练自然。“没有回到妻子那里”可保留原意，但“没有去妻子那里”更直接。“不下去吃喝”是可理解的叙事性措辞，保留其由旷野下到有人居处取得饮食的字面意象。
  terminology: “约雅敬”“吕便”“主上帝”“义人”“旷野”均合乎现代中文基督教文献的常见用语。“谱册”过度限定为家谱册；原见证特意以括号标示 history，且该词可指记载、记录或文献，故改为“记载”并以脚注说明。赎罪用语改为“作我的赎罪，好使我得赦免”，既保留献礼、赎罪和赦免的关联，也不擅定祭物类别。
  issues:
  - severity: medium
    issue: “为我赎罪”在句法上可能使人理解为约雅敬自行赎罪。
    rationale: 英文见证为“the other is to the Lord God for forgiveness, to atone for me”；希腊文常见读法的结构是献给主上帝、为他的赎罪、使他得赦免。译文应明确赎罪与赦免的目的关系，而不把行动主体误置于约雅敬。
  - severity: medium
    issue: “谱册”将有争议的“(history)”过窄地限定为家谱性质文献，且脚注[a]未锚定在该词上。
    rationale: 见证在两处以括号保留该词的不确定性；“记载”较能保留文献类别的开放性。脚注应紧随首次相关用词，避免读者误以为注释的是“以撒”。
  - severity: low
    issue: “养育过儿女”弱化了本段所强调的“有子嗣／有后代”，并引入抚养层面的含义。
    rationale: 第2、3节围绕无子与后裔展开；译为“都有子嗣”更符合上下文，也不把焦点转为养育行为。
  revised_text: '《雅各原福音》第一章：约雅敬的困境


    (1) 在以色列十二支派的记载[a]中，约雅敬是个非常富有的人。他把献给主的礼物加倍献上，心里说：“一份是从我的富余中拿出来给全体百姓的；另一份献给主上帝，作我的赎罪，好使我得赦免。”


    (2) 主的大日临近了，以色列人都在献礼物。吕便却站在约雅敬面前，说：“你不该先献礼物，因为你在以色列中没有子嗣。”


    (3) 约雅敬非常忧伤，便去查阅百姓十二支派的记载，心里说：“我要查一查以色列十二支派的记载，看看在以色列中是否只有我没有子嗣。”他查考之后，发现以色列所有的义人都有子嗣。他又想起，先祖亚伯拉罕晚年的时候，主上帝赐给他一个儿子，就是以撒。


    (4) 约雅敬非常忧伤，没有去妻子那里，却独自退到旷野，在那里支搭帐棚。他禁食四十昼夜，心里说：“主我的上帝若不眷顾我，我就不下去吃喝；祷告就是我的饮食。”[b]'
