translation:
  language: zh_hans
  text: '《雅各原福音》第一章：约雅敬的困境


    (1) 在以色列十二支派的谱册中，约雅敬是个非常富有的人。他把献给主的礼物献上双份，心里说：“一份取自我的富余，为全体百姓献上；另一份献给主上帝，求他赦免，为我赎罪。”


    (2) 主的大日临近了，以色列人都在献礼物。吕便却站到约雅敬面前，说：“你不该先献礼物，因为你在以色列中没有生养儿女。”


    (3) 约雅敬非常忧伤，便去查阅百姓十二支派的谱册，心里说：“我要查一查以色列十二支派的谱册，看看在以色列中是否只有我没有生养儿女。”他查考之后，发现以色列所有的义人都养育过儿女。他又想起，先祖亚伯拉罕年老的时候，主上帝赐给他一个儿子，就是以撒。[a]


    (4) 约雅敬非常忧伤，没有回到妻子那里，却独自退到旷野，在那里支搭帐棚。他禁食四十昼夜，心里说：“主我的上帝若不眷顾我，我就不下去吃喝；祷告就是我的饮食。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谱册”也可理解为“记载”或“历史记录”。本段所据英文见证在相关位置以括号标出“history”，希腊抄本传统仍待直接复核。
    reason: 保留底本见证对该词所反映的词义或文本不确定性。
  - marker: b
    text: “眷顾我”直译可作“顾念我”或“考虑我”；这里没有明说上帝将以何种方式回应。
    reason: 避免把含义过早限定为赐予儿女，并保存原有的叙事开放性。
lexical_decisions:
- source_word: histories / (history)
  choice: 谱册
  rationale: 上下文描述约雅敬查阅十二支派的记录，以确认历代义人是否都有儿女；“谱册”比现代汉语中的“历史”更自然，也保留家族或支派记录的含义。鉴于希腊原文复核尚未完成，以脚注说明其可能也可译作“记载”。
- source_word: Joachim
  choice: 约雅敬
  rationale: 采用现代中文基督教文献中常见、且与 Joachim 对应的传统音译名。
- source_word: Reubel
  choice: 吕便
  rationale: 该名字很可能对应圣经人名 Reuben；采用简体中文圣经通行译名“吕便”，同时避免生硬的逐字音译。
- source_word: doubled the gifts
  choice: 把献给主的礼物献上双份
  rationale: 明确表达所献礼物为两份，并与后文“一份……另一份……”衔接。
- source_word: for forgiveness, to atone for me
  choice: 求他赦免，为我赎罪
  rationale: 保留“赦免”与“赎罪”两个相关而不完全相同的概念，不将其合并或作宗派化解释。
- source_word: had raised children
  choice: 养育过儿女
  rationale: 兼顾生育与抚养的语义范围，避免把原见证中的 raised 简化为单纯“生过”。
- source_word: considers me
  choice: 眷顾我
  rationale: 在祷告语境中，“眷顾”自然表达上帝留意并施恩的含义，同时保留行为结果尚未明说的开放性。
theological_decisions:
- issue: 约雅敬第二份礼物与赎罪的关系
  choice: “献给主上帝，求他赦免，为我赎罪”
  alternative: “献给主上帝作赎罪祭，使我得赦免”
  rationale: 原见证未明确称其为制度性的“赎罪祭”；译文保留礼物、赦免与赎罪之间的联系，却不额外指定祭物类别。
- issue: 无子是否使人无权优先献礼
  choice: 按叙事直接保留吕便的指责
  alternative: 加入解释或淡化其判断
  rationale: 这是人物在故事中的主张，并非译者认可的普遍神学原则；正文不作辩护，也不擅自纠正，以保留叙事张力。
- issue: 上帝对约雅敬的回应
  choice: “若不眷顾我”
  alternative: “若不给我儿女”
  rationale: 原见证只说上帝“考虑/眷顾”他，没有明说所求回应必定是赐子，因此不提前消解叙事悬念。
- issue: 亚伯拉罕“末后的日子”
  choice: “年老的时候”
  alternative: “在先祖亚伯拉罕末后的日子”
  rationale: 依上下文显然指亚伯拉罕晚年，而非末世时期；用自然现代汉语传达这一时间含义，但不扩展其神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名使用常见中文形式；“主上帝”“义人”“旷野”“四十昼夜”等保留经文式语域，但避免过度古雅。当前材料明确说明希腊原文审查尚未完成，因此本稿属于依据公共领域英文见证制作的暂定译稿；涉及“谱册”等关键处以脚注标明不确定性。
