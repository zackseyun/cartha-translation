base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/021.yaml
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
translation:
  language: zh_hans
  text: '《雅各原福音》第21章　星象家来访


    （1）看哪！约瑟正准备动身前往犹太地，犹太地的伯利恒却起了一场大骚动。因为有星象家[a]前来，问道：“那位犹太人的王在哪里？我们在东方[b]看见了他的星，特来敬拜他。”


    （2）希律听见这事，心里不安，便派差役去见那些星象家，又召来祭司长，在宫中询问他们说：“关于基督，经上写了什么？他将生在哪里？”


    他们回答：“在犹太地的伯利恒，因为经上是这样写的。”希律就放他们走了——也就是那些祭司长。


    他又询问星象家说：“关于那位已经诞生为王的，你们看见了什么征兆？”


    星象家说：“我们看见一颗巨大的星，在众星之间闪耀；它使其他星都黯然失色，甚至完全看不见了。因此，我们知道以色列有一位王诞生了，就来敬拜他。”


    希律对他们说：“你们去仔细寻找；若找到了，就回来告诉我，好让我也去敬拜他。”


    （3）星象家去了。看哪！他们先前在东方看见的那颗星一路引领他们，直到他们来到洞穴；星就停在洞顶上方。他们看见那孩子和他的母亲马利亚，就从行囊中取出礼物：黄金、乳香和没药。


    后来，天使警告他们不要进入犹太地[c]，他们便改走另一条路，返回自己的国家。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “星象家”所对应的词传统上也常译作“博士”或“术士”；这里指观察天象并解释征兆的人，并不表示现代学位身份。
    reason: 说明古代身份词的语义范围，避免现代误解。
  - marker: b
    text: “在东方”也可能理解为“在星升起之处”；因尚待直接核校希腊文，本译文保留所据见证较为开放的表达。
    reason: 保存方位与天文现象之间可能存在的歧义。
  - marker: c
    text: 所据见证作“不要进入犹太地”。这一说法虽与常见的“不要回到希律那里”不同，仍照原见证保留。
    reason: 标明显著的叙事与传统差异，避免静默修正文本。
lexical_decisions:
- source_word: magi / μάγοι（希腊文形式有待直接核校）
  choice: 星象家
  rationale: 既保留其观察天象、解释征兆的古代身份，又避免现代“博士”一词容易引起的学位联想；不擅自把他们称为君王。
- source_word: worship
  choice: 敬拜
  rationale: 保留原叙事中向新生之王表达宗教性尊崇的力度，不弱化为一般的“拜见”。
- source_word: the Christ
  choice: 基督
  rationale: 采用现代汉语基督教文献中通行而庄重的称谓，同时保留其作为受膏者称号的神学内涵。
- source_word: officers
  choice: 差役
  rationale: 表达受希律差遣执行公务的人，不在证据不足时具体化为士兵、侍卫或官员。
- source_word: cave
  choice: 洞穴
  rationale: 忠实保留本书所述的出生地点，不以较熟悉的“马槽”传统替换。
- source_word: frankincense and myrrh
  choice: 乳香和没药
  rationale: 采用这两种古代贵重香料在现代中文圣经语境中的标准名称。
theological_decisions:
- issue: 星象家对孩子所行之举的性质
  choice: 敬拜
  alternative: 朝拜／拜见
  rationale: 原文见证使用的措辞具有敬拜或俯伏致敬的语义张力；译作“敬拜”保留该张力，而不进一步说明他们对孩子神性的认识程度。
- issue: “基督”的称号
  choice: 保留“基督”
  alternative: 弥赛亚／受膏者
  rationale: “基督”最自然地对应叙事中的称号，也与现代中文读者的通行理解一致；不在正文中扩展解释。
- issue: 天使警告的目的地
  choice: 不要进入犹太地
  alternative: 不要回到希律那里
  rationale: 所给见证明确作“不要进入犹太地”，尽管与常见平行叙事及本章地理表述之间存在张力，仍按见证保留，不作和谐化改写。
- issue: “为以色列诞生的王”
  choice: 以色列有一位王诞生了
  alternative: 以色列的王诞生了
  rationale: 尽量保留“为以色列／对以色列而言”的关系表达，避免未经原文核校便将其完全定型为所有格称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留反复出现的“看哪”及段落中的问答节奏。当前底本是公版英文见证，希腊文手稿传统尚待直接核校，因此对可能受希腊语措辞影响的细节采取审慎译法，并在必要处以脚注保留歧义。
