  language: zh_hans
  text: '《雅各原福音》第17章：人口登记


    （1）那时，奥古斯都王颁下命令，要登记犹太的伯利恒有多少人口。[a]


    约瑟说：“我要给我的儿子们登记。可是，这孩子该怎么办呢？我要把她按什么身份登记？说是我的妻子吗？我觉得羞愧。说是我的女儿吗？可是以色列人都知道她不是我的女儿。今天是主的日子；主愿意怎样，我就怎样做。”[b]


    （2）于是，他给驴备上鞍，让她坐在上面；他的儿子牵着驴，撒母耳跟在后面。[c]


    快到第三里路的时候，[d]约瑟回头，看见她面带愁容，便心里说：“大概是她腹中的那一位使她难受。”


    约瑟再次回头，却看见她在笑，就问她：“马利亚，你为什么这样？我看见你脸上一会儿带着笑容，一会儿又愁容满面。”


    她对他说：“因为我眼中看见两群人：[e]一群在哭泣哀悼，一群在欢喜雀跃。”


    （3）他们走到半路，马利亚对他说：“约瑟，扶我从驴上下来，因为我腹中的那一位正催着要出来。”


    约瑟便扶她从驴上下来，对她说：“我能带你到哪里去，遮掩你的难堪呢？这里是一片荒野。”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奥古斯都王”依所据见证保留原称号。“登记”指人口登记；此句也可理解为登记犹太伯利恒的居民人数。
    reason: 交代不寻常的统治者称号，并保留人口登记句法的范围歧义。
  - marker: b
    text: “主的日子”原意未必只是普通的“今天”；这里保留其宗教意味，不作进一步解释。
    reason: 保存可能具有神学分量的固定短语及其歧义。
  - marker: c
    text: 原文先说“他的儿子”，随后又提到“撒母耳”；两者是否为同一人，句子本身没有说明。
    reason: 避免擅自协调人物关系。
  - marker: d
    text: “第三里路”指行程接近第三里的位置；从哪里起算，文本没有说明，也没有明说那里设有里程标志。
    reason: 解释古代行程表达，同时不补入未知起点或路标。
  - marker: e
    text: 此处所反映的传统可按“两个群体”理解，故译作“两群人”；文本没有说明他们分别代表谁。
    reason: 保留群体性复数的可能，并避免为异象指定象征对象。
  - marker: f
    text: “难堪”所译的词也可指窘迫、不体面或羞耻的处境；虽处于即将分娩的情境，正文不把含义限定为单纯的临产不便。
    reason: 说明难译词的语义范围，并保留原文的修辞张力。
lexical_decisions:
- source_word: ἀπογραφή / register（据英译见证所反映的希腊传统）
  choice: 登记／给……登记
  rationale: 在本段人口清查语境中采用现代读者易懂的“登记”，避免把制度细节过度具体化为后世意义上的“户籍”。
- source_word: Αὔγουστος ὁ βασιλεύς / Augustus the king
  choice: 奥古斯都王
  rationale: 保留见证中的“王”这一称号，不按路加福音常见译法擅自改成“凯撒”或“皇帝”。
- source_word: παιδίσκη / child（英译见证）
  choice: 这孩子
  rationale: 保留约瑟对马利亚的称呼所带的关系张力；不解释为“少女”“童女”或“未婚妻”。
- source_word: ἡμέρα κυρίου / day of the Lord（英译见证）
  choice: 主的日子
  rationale: 采用字面且自然的译法，保留短语可能具有的宗教意味，不径直解释成“听凭主安排”。
- source_word: δύο λαούς / two peoples（疑为希腊传统读法，尚待直接校勘）
  choice: 两群人
  rationale: “λαοί”通常指群体或民族，而不是恰好两个人；译作“两群人”既符合后文各有一群人的描述，也不进一步认定其象征对象。
- source_word: ἀσχημοσύνη / awkwardness（英译见证）
  choice: 临产不便
  rationale: 此处指马利亚即将分娩的窘迫或不便；用现代汉语表达情境，同时避免带有羞辱意味的“难堪”。
- source_word: ἔρημος / wilderness
  choice: 荒野
  rationale: 保留地点荒僻、缺乏安顿之处的意味，不具体化为“沙漠”。
theological_decisions:
- issue: 马利亚眼中所见“两群人”的身份
  choice: 保持不解释，只呈现一群哀哭、一群欢喜
  alternative: 解释为以色列人与外邦人，或不信者与信者
  rationale: 本章自身没有明说其象征对象；为保留文本的异象性与神学张力，不加入后世解释。
- issue: “主的日子”的含义
  choice: 直译保留
  alternative: 释为“这是主所定的日子”或“我把这事交给主”
  rationale: 原短语可能是时间陈述、敬虔表达或带末世意味的用语；不在正文中替作者消除歧义。
- issue: “腹中的那一位”所指
  choice: 以敬重但不增添身份称号的方式表达
  alternative: 直接译成“婴孩”“耶稣”或“主”
  rationale: 上下文所指明确，但此处文本没有直接使用名字或基督论称号，故不补入。
- issue: 约瑟为何以称马利亚为妻而羞愧
  choice: 保留原话，不作伦理或婚姻关系解释
  alternative: 说明因尚未完婚、因年龄差异，或因她怀孕
  rationale: 本章没有明说羞愧的具体原因；解释会引入特定传统或推论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留原文反复出现的“回头”“一会儿……一会儿……”等口传叙事节奏。因项目注明希腊原文复核尚待完成，本稿以所给公共领域英译见证及其所反映的希腊传统为暂定依据；涉及“两个群体”等处以脚注标明文本与翻译上的不确定性。
