  revision_rationale: 修订撤除安娜话语中源文未明说的“主”，并改正“上去”一语被草稿指定为祭司的处理。其余关键器物、“罪”在牌上显现的机制、称义的被动形式，以及产后洁净的双重语境均保持不作额外解释。由于本任务所供的是英语公共领域见证而非希腊文逐词底本，相关措辞仍应视为暂定。
