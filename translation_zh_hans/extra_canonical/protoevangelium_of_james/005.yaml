base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/005.yaml
  text: '(1) The next day, Joachim offered his gifts, saying to himself, “If the Lord God is reconciled to me, the plate worn by the priest will make it clear to me.” Joachim offered his gifts and watched the priest’s plate as the priest went up to the altar of the Lord. He saw no sin in it. Joachim said, “Now I know that the Lord God has been reconciled to me and has sent all my sins away from me.” He went down from the Temple of the Lord justified and returned to his house.


    (2) About six months were completed, and in the seventh month Anna gave birth. She said to her midwife, “What is it?”


    The midwife said, “It is a girl!”


    Anna said, “My soul is magnified this day!” Then she laid her child down.


    When her days were completed, Anna cleansed her flow of blood. She gave her breast to the child and named her Mary.'
translation:
  language: zh_hans
  text: '（1）第二天，约雅敬献上礼物，心里说：“如果主上帝已经与我和好，祭司所戴的牌就会向我显明。”约雅敬献上礼物；祭司走上主的祭坛时，他留心察看祭司的牌，却没有在上面看见罪。约雅敬说：“现在我知道，主上帝已经与我和好，使我的一切罪都离开了我。”于是，他被算为义，从主的圣殿下来，回到自己家里。


    （2）大约满了六个月，到了第七个月，安娜生下了孩子。她问接生婆：“是什么？”


    接生婆说：“是个女孩！”


    安娜说：“今天，我的心尊主为大[a]！”随后，她把孩子放下。


    安娜满了洁净的日子，就洁净了自己的血污[b]。她给孩子喂奶，并给她取名叫马利亚。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据英语见证直译为“今天，我的灵魂被尊大了／变得伟大了”，没有明说“主”；这里依照这句话明显的经文回响译出宾语。希腊文仍待直接复核。
    reason: 标明正文为自然中文而补出的宾语，并保存源文本可能的语法与神学含混。
  - marker: b
    text: “血污”也可理解为“流血”。这句话可能兼指产后的流血和礼仪上的洁净。
    reason: 避免只作生理解释或只作礼仪解释。
lexical_decisions:
- source_word: plate worn by the priest
  choice: 祭司所戴的牌
  rationale: 保留见证文本中较为含混的具体器物意象，不擅自认定为某一种祭司服饰或圣物。
- source_word: reconciled to me
  choice: 与我和好
  rationale: 自然表达关系恢复，同时保留原文的宗教性含义。
- source_word: justified
  choice: 被算为义
  rationale: 保留司法—神学色彩，避免弱化成单纯“安心”或“得到认可”。
- source_word: My soul is magnified
  choice: 我的心尊主为大
  rationale: 采用现代读者可理解且具有经文回响的表达；但补注说明见证文本未明说宾语“主”。
- source_word: cleansed her flow of blood
  choice: 洁净了自己的血污
  rationale: 保留产后流血与礼仪洁净的关联，不将其改写为纯粹的生理康复。
- source_word: Mary
  choice: 马利亚
  rationale: 采用中文基督教文献中对该人物最通行的传统译名。
theological_decisions:
- issue: 祭司的牌如何显明罪
  choice: 直译为“没有在上面看见罪”
  alternative: 解释为祭司额牌反射出约雅敬无罪，或将其解释为神谕记号
  rationale: 文本本身的机制不清楚，应保留叙事中的真实含混，不添入特定解释。
- issue: 约雅敬从圣殿下来时的称义状态
  choice: “他被算为义”
  alternative: “他称义了自己”或“他确信自己无罪”
  rationale: 保留被动含义及其神学张力，不明确指定施动者，也不把它仅仅心理化。
- issue: 安娜所说“我的魂被放大／尊大”是否明确以主为宾语
  choice: 正文采用习惯性经文表达“我的心尊主为大”，并以脚注标示补足
  alternative: 严格保留为“今天，我的心被尊大了”或“今天，我的灵魂壮大了”
  rationale: 当前材料仅有英语见证且希腊文复核尚待进行；正文顾及中文可读性和明显的颂歌回响，同时脚注明示原见证的省略，避免把解释伪装成确定原文。
- issue: 产后洁净
  choice: 保留礼仪洁净措辞
  alternative: 改写为“产后出血停止”
  rationale: 叙述可能同时涉及生理过程和礼仪状态；不可静默排除后者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名用“约雅敬、安娜、马利亚”；神名用“主上帝”。因所供材料明确注明希腊原文复核尚待进行，本稿属于依据公共领域英语见证所作的审慎暂定稿；对祭司的牌、“看见罪”、安娜的颂语及产后洁净均避免过度释义。
