base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/010.yaml
  text: '(1) A council of the priests met and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Call the pure virgins from the tribe of David to me.” The officers went out and searched, and they found seven. Then the priest remembered that the child Mary was from the tribe of David and was pure before God. So the officers went out and brought her.


    (2) They brought them into the Temple of the Lord, and the priest said, “Cast lots for me to determine who will spin the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    The lot for the true purple and the scarlet fell to Mary, and she took them to her house. This was when Zechariah became silent, and Samuel took his place until Zechariah could speak. Mary took the scarlet and was spinning it.'
translation:
  language: zh_hans
  text: '（1）祭司们开会商议，说：“我们来为主的圣殿做一道幔子吧。”


    祭司说：“把大卫支派中纯洁的童女召到我这里来。”差役出去寻找，找到了七位。祭司又想起女孩马利亚也是大卫支派的人，并且在上帝面前是纯洁的。差役便出去，把她带来。


    （2）他们把这些童女带进主的圣殿。祭司说：“在我面前抽签，看看谁来纺金色、白色、细麻、丝、紫罗兰色、朱红色和纯紫色的线。[a]”


    马利亚抽中了纯紫色和朱红色的线，就把材料带回家去。那时，撒迦利亚不能说话，撒母耳接替了他的职务，直到撒迦利亚能够开口。马利亚拿起朱红色的线，纺了起来。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所列词语究竟全是颜色，还是也包括纤维、织物或线材类别，须待希腊文逐项复核；本稿暂依所提供的英文见证保留各项区别。“纯紫色”也可能指一种特定的贵重紫色染料或织线。
    reason: 原始希腊文审校尚未完成，而英文见证中的 textile/color 列表在语义分类上存在不确定性。
lexical_decisions:
- source_word: veil
  choice: 幔子
  rationale: 指圣殿中的帷幔；“幔子”既符合宗教建筑语境，也比“面纱”准确。
- source_word: pure virgins
  choice: 纯洁的童女
  rationale: 同时保留贞女身份与礼仪、道德层面的“纯洁”，不把二者合并为单一概念。
- source_word: officers
  choice: 差役
  rationale: 原见证未明确其具体官职；采用泛指奉命办事人员的传统而易懂的称呼，避免擅定为圣殿警卫。
- source_word: spin
  choice: 纺……的线
  rationale: 汉语中需补出“线”才能自然表达纺制不同色彩或材质纱线的动作。
- source_word: true purple
  choice: 纯紫色
  rationale: 保留它与普通紫色或紫罗兰色之间的区分，同时避免未经希腊文复核便断定具体染料名称。
- source_word: fell silent
  choice: 不能说话
  rationale: 表达撒迦利亚失语的状态，不额外判断其生理机制或神学性质。
- source_word: took his place
  choice: 接替了他的职务
  rationale: 按上下文理解为暂代撒迦利亚的职分；不进一步指定职务内容。
theological_decisions:
- issue: 马利亚“在上帝面前是纯洁的”的含义
  choice: 按原文直译保留
  alternative: 译成“蒙上帝认可为洁净”或解释为无罪
  rationale: 原见证只陈述她在上帝面前纯洁，可能含礼仪或道德意义；不引入后期宗派教义。
- issue: 撒迦利亚失语
  choice: 译为“不能说话”
  alternative: 解释为因不信受罚而成了哑巴
  rationale: 本章仅交代其状态和持续时间；不从其他文本补入原因。
- issue: 撒母耳的身份与代理职分
  choice: 保留姓名并笼统说接替职务
  alternative: 将其等同于希伯来圣经中的先知撒母耳，或明确称为大祭司
  rationale: 所给见证没有说明此人的身份或确切职衔，故不作神学或历史上的同一认定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“圣殿”“幔子”“童女”等保留古代宗教语境；句法适度现代化。因项目注明希腊文复核尚待完成，本稿以所给公共领域英文见证为暂定依据，并通过脚注明确关键织物与颜色术语的不确定性。
