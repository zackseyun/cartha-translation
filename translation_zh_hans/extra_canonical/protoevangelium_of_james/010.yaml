    reason: 英文见证将颜色词与纺织相关术语并列，且原始希腊文审校尚未完成；脚注避免把各项的具体语义类别定死。
  revision_rationale: 修订纠正“for me”的关系意义，避免把 true purple 解释为“纯紫色”，并撤除对并列纺织术语一概补作“线”的预断。其余叙事内容、人物身份的未定性及撒迦利亚失语的描述均按见证保留，未引入宗派性解释。
