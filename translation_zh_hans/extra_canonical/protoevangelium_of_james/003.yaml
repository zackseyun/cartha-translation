translation:
  language: zh_hans
  text: '第三章　安娜的哀叹


    （1）安娜定睛望天，看见月桂树上有一个麻雀窝。她哀叹起来，自言自语说：


    “我有祸了！是谁生了我？哪个母腹孕育了我？我出生后，竟在以色列民中成了受咒诅的人，遭人鄙弃。他们讥笑我，把我从主我上帝的圣殿赶了出去。


    （2）“我有祸了！我像什么呢？我不像天上的飞鸟，因为就连天上的飞鸟也在你面前繁衍，主啊！


    “我有祸了！我像什么呢？我不像牲畜，因为就连牲畜也在你面前繁衍，主啊！


    “我有祸了！我像什么呢？我不像地上的野兽，因为就连地上的野兽也在你面前繁衍，主啊！


    （3）“我有祸了！我像什么呢？我不像这些水，因为就连这些水也静谧而又涌动[a]，其中的鱼都称颂你，主啊！


    “我有祸了！我像什么呢？我不像这大地，因为大地按时结出果实，称颂你，主啊！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “静谧而又涌动”依所供英文见证译出；这一看似相反的并列表达可能描写水面平静却仍流动或翻涌。希腊语底本尚待直接复核。
    reason: 所供英文措辞“serene yet churn”语义张力明显，且项目资料注明希腊语审校尚未完成，因此保留张力并提示文本依据的暂定性质。
lexical_decisions:
- source_word: looked intently to heaven
  choice: 定睛望天
  rationale: 保留专注仰望的动作，同时采用自然、庄重的现代汉语表达。
- source_word: laurel tree
  choice: 月桂树
  rationale: 按所供英文见证直译树种，不泛化为普通树木。
- source_word: Woe is me!
  choice: 我有祸了！
  rationale: 保留哀歌式反复及灾祸临身的语气，比单纯“我真可怜”更贴近古代宗教文本的力度。
- source_word: fruitful
  choice: 繁衍
  rationale: 在飞鸟、牲畜和野兽三处指生殖繁育；避免只译作抽象的“多结果子”。大地一处则依语境译为“结出果实”。
- source_word: Temple
  choice: 圣殿
  rationale: 在犹太敬拜场景中用现代中文读者熟悉且庄重的称呼。
- source_word: bless you
  choice: 称颂你
  rationale: 此处所指是受造物对主的赞美，不是向上帝赐福，故译作“称颂”以避免误解。
theological_decisions:
- issue: 安娜所说自己在以色列民中成了“curse”的含义
  choice: 成了受咒诅的人
  alternative: 成了以色列民面前的咒诅
  rationale: 译文保留她因不育而自觉蒙羞、受排斥的宗教张力，但不把这种哀叹提升为叙述者对她真实属灵地位的裁定。
- issue: 万物的生育与称颂
  choice: 保留“在你面前繁衍”和受造物“称颂你”的拟人化表达
  alternative: 解释为上帝赐福万物，使其生育
  rationale: 原段落以祷告和哀歌的诗性对比为主；不补入文本未明说的因果神学解释。
- issue: 被赶出圣殿
  choice: 按见证文本直陈“把我从……圣殿赶了出去”
  alternative: 弱化为“不许我进入圣殿”
  rationale: 保留所供见证的强烈排斥措辞，不擅自协调其历史或礼仪背景。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。以“我有祸了！我像什么呢？”维持哀歌的反复节奏；动物与大地的对应句尽量平行。此稿以所供公共领域英文见证及经审核的英文POB为咨询层完成，因希腊语原文复核尚待进行，未对疑难处作超出见证文本的确定化处理。
