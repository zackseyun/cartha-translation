base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/025.yaml
  text: '(1) Now I, James, wrote this account in Jerusalem when there was unrest over Herod’s death. I went into the wilderness until the unrest in Jerusalem had died down. I glorified the Lord God, who gave me the wisdom to write this account.


    (2) And grace will be with all who fear the Lord. Amen.'
translation:
  language: zh_hans
  text: '（1）我雅各在耶路撒冷写下这篇记述的时候，那里正因希律之死发生骚乱。我便到旷野去，直到耶路撒冷的骚乱平息。那赐我智慧写下这篇记述的主上帝，我一直颂赞他。


    （2）愿恩典与一切敬畏主的人同在。阿们。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: history / account（希腊语原文待核）
  choice: 记述
  rationale: 既可指所写的叙事，也不把文类过度限定为现代意义上的“历史”。
- source_word: commotion / unrest（希腊语原文待核）
  choice: 骚乱
  rationale: 保留因希律之死而起的社会动荡之意，并与后文“平息”自然搭配。
- source_word: wilderness（希腊语原文待核）
  choice: 旷野
  rationale: 采用读者熟悉的圣经语汇，既可涵盖荒僻地区，也不具体化为沙漠。
- source_word: fear the Lord（希腊语原文待核）
  choice: 敬畏主
  rationale: 保留宗教语境中兼具敬重、畏惧与忠诚的含义。
theological_decisions:
- issue: 末句“grace will be with”应译作陈述还是祝愿
  choice: 愿恩典……同在
  alternative: 恩典必与……同在
  rationale: 现有英文见证可容许将来陈述，但结语语境也可理解为祝福语。因希腊语校勘尚待完成，采用汉语结语中自然、且不额外强化确定性教义判断的祝愿式。
- issue: “glorifying”所表达的时态与体貌
  choice: 我一直颂赞他
  alternative: 我颂赞了他
  rationale: 所供见证使用进行表达，译文保留持续性的颂赞动作，不把它缩减为一次完成的行为。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。因项目明确说明尚未直接核查希腊语 manuscript tradition，本稿以所供公共领域英文见证为暂定依据；对“记述”“骚乱”及末句语气的处理均应在希腊语审校后复核。
