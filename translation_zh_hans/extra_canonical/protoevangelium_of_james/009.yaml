  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/009.yaml
  text: '(1) Joseph threw down his axe and went to meet them. When they had all gathered, they went to the priest with their staffs. The priest took all their staffs, entered the Temple, and prayed. When he had finished praying, he took the staffs, went out, and gave them back. But there was no sign among them. Joseph took his staff last, and look! A dove went from the staff and flew upon Joseph’s head. The priest said to Joseph, “You have been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she is young. I will not be a laughingstock among the people of Israel.”


    The priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore—how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things will not happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
translation:
  language: zh_hans
  text: '（1）约瑟丢下斧子，前去与他们会合。众人聚齐以后，就各自拿着杖到祭司那里。祭司收下他们所有的杖，进入圣殿祷告。祷告完毕，他拿着那些杖出来，逐一归还；可是杖上都没有显出任何记号。约瑟最后才接过自己的杖。看哪！一只鸽子从杖中飞出，落在约瑟的头上。祭司对约瑟说：“你已蒙拣选，要把主的童女接来，由你照管。”


    （2）约瑟却不肯，说：“我已经有儿子了，又是个老人，她却还年轻。我可不愿成为以色列人中的笑柄。”


    祭司说：“约瑟，要敬畏主你的上帝，也要记住上帝怎样处置大坍、亚比兰和可拉[a]：大地裂开，把他们全都吞了下去，因为他们背叛了上帝。约瑟，现在你要敬畏，免得这样的事也临到你家。”


    （3）约瑟害怕了，便把她接来照管，对她说：“马利亚，我已把你从主的圣殿接出来，现在要带你到我家。我将离开一段时间，去建造房屋，不过我会回来找你。主必保护你。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 大坍、亚比兰和可拉的事件见《民数记》16章。该章记载他们反叛，地裂开吞下大坍、亚比兰及其家属；可拉的结局在相关经文的表述中较为复杂。本句沿用本文自身的概括说法。
    reason: 交代典故来源，并提醒读者本文对《民数记》叙事作了概括，避免把细节差异静默抹平。
lexical_decisions:
- source_word: axe
  choice: 斧子
  rationale: 采用普通现代汉语中自然明确的工具名称，同时保留约瑟从劳作中放下工具的叙事细节。
- source_word: staffs
  choice: 杖
  rationale: “杖”兼具古代语境和仪式物件的庄重感，避免“手杖”过度限定其用途。
- source_word: Temple
  choice: 圣殿
  rationale: 在犹太宗教语境中采用通行译称，并与一般意义的庙宇区分。
- source_word: virgin of the Lord
  choice: 主的童女
  rationale: 较形式地保留属格结构及童贞身份，不将其解释性改写为“献给主的少女”等。
- source_word: welcome ... into your own care
  choice: 接来，由你照管
  rationale: 表达接纳进自己生活范围并承担保护责任，避免译成婚娶而提前解决文本未明说的关系。
- source_word: went from the staff
  choice: 从杖中飞出
  rationale: 保留见证文本所呈现的奇异起点；不擅自弱化为“从杖上飞起”。
- source_word: build houses
  choice: 建造房屋
  rationale: 保留复数含义所指的营造工作，不把它缩窄为建造约瑟自己的家。
theological_decisions:
- issue: 约瑟对马利亚承担的关系性质
  choice: 译作“接来……照管”
  alternative: 译作“娶她”或“收她为妻”
  rationale: 本章措辞强调接纳和监护，没有在此直接界定婚姻关系；译文保留这种叙事张力。
- issue: 鸽子显现的具体方式
  choice: “从杖中飞出，落在约瑟的头上”
  alternative: “从杖上飞起，停在约瑟头顶上方”
  rationale: 依据所给见证保留“from”和“upon”的较直接意义，不将鸽子解释为只在头顶盘旋。
- issue: 祭司警告中灾祸的施行者
  choice: 前句明说上帝的处置，后句译作“这样的事也临到你家”
  alternative: 重复明确说“上帝也这样惩罚你家”
  rationale: 既呈现警告的神学背景，也不在原文较含蓄的结果句中额外强化施事者。
- issue: “反叛”的对象
  choice: 译作“因为他们背叛了上帝”
  alternative: 仅作“因为他们的背叛”
  rationale: 中文需要较自然地交代关系对象；上下文明示这是对上帝的悖逆，但未扩展其具体行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。鉴于希腊原文复核尚未完成，本稿以所供公共领域英文见证为直接起草依据；对“从杖中”“照管”“建造房屋”等可能受希腊措辞影响之处采取保守译法，不作超出见证的教义性解释。
