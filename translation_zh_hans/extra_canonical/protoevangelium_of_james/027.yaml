lexical_decisions:
- source_word: cave
  choice: 洞穴
  rationale: 准确保留古代叙事中的地点意象；现代汉语自然且庄重。
- source_word: stationed his sons with her
  choice: 让自己的儿子们留在那里陪着她
  rationale: “留在那里”表达安排儿子们守候在她身边；补入“陪着”使现代汉语清楚自然，同时不额外规定其具体职责。
- source_word: Hebrew midwife
  choice: 希伯来接生婆
  rationale: “希伯来”保留原见证的族群称谓，“接生婆”是普通读者易懂且符合叙事时代氛围的表达。
- source_word: region of Bethlehem
  choice: 伯利恒一带
  rationale: 自然表达周边地区，不把范围缩窄为伯利恒城内。
