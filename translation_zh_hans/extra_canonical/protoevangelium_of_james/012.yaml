base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/012.yaml
  text: '(1) She made the purple and the scarlet and took it to the priest. The priest received it, blessed her, and said, “Mary, the Lord God has magnified your name, and you will be blessed among all the generations of the earth.”


    (2) Mary rejoiced and went to her cousin Elizabeth. She knocked at the door. Elizabeth heard, threw down the scarlet, and rushed to the door. She opened it, blessed Mary, and said, “How is it that the mother of my Lord should come to me? For look, the one in me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She looked intently into heaven and said, “Lord, who am I, that all the women of the earth will bless me?”


    (3) She stayed with Elizabeth for three months. Day by day, her womb grew larger, and Mary became afraid. She went to her house and hid herself from the people of Israel. She was sixteen years old when these mysteries happened to her.'
translation:
  language: zh_hans
  text: '（1）她做好了紫色线和朱红色线，就把它们带到祭司那里。祭司接过来，为她祝福，说：“马利亚，主上帝已经使你的名尊大；地上的万世万代都要称你有福。”


    （2）马利亚满心欢喜，便去看她的亲属伊利莎白。她敲了敲门。伊利莎白听见后，丢下手中的朱红色线，急忙跑到门口。她开了门，为马利亚祝福，说：“我主的母亲怎么会到我这里来？因为，看哪，我腹中的孩子跳动起来，也为你祝福！”


    可是，马利亚忘了天使加百列告诉她的奥秘。她定睛仰望天空，说：“主啊，我算什么，地上所有的女人竟都要称我有福？”


    （3）她和伊利莎白同住了三个月。她的肚腹一天比一天隆起，马利亚就害怕起来。她回到自己家里，躲避以色列众人。这些奥秘发生在她身上时，她十六岁。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: purple and scarlet
  choice: 紫色线和朱红色线
  rationale: 承接前文纺织圣殿幔子材料的语境，用“线”使中文读者明白所指是织物材料；原文色彩区分保留。
- source_word: cousin
  choice: 亲属
  rationale: 希腊传统所对应的亲属词通常只表明亲缘关系，未必精确指现代汉语的“表姐妹”；采用“亲属”以免过度限定。
- source_word: mysteries
  choice: 奥秘
  rationale: 保留宗教叙事中的神秘启示含义，不解释为单纯的“事情”或“秘密”。
- source_word: magnified your name
  choice: 使你的名尊大
  rationale: 保留“使……为大”的闪语式、经文式表达，同时使用自然庄重的现代汉语。
- source_word: all the generations of the earth
  choice: 地上的万世万代
  rationale: 既传达世代延续，也保留“地上”的普世范围。
- source_word: the one in me
  choice: 我腹中的孩子
  rationale: 按叙事情境将含蓄表达自然化，但不进一步指认其身份。
theological_decisions:
- issue: 伊利莎白对马利亚的称福
  choice: 为马利亚祝福／称我有福
  alternative: 赞美马利亚／尊崇我
  rationale: “祝福、称有福”紧扣原文语义，避免加入敬礼或崇敬层面的宗派性解释。
- issue: 胎儿“祝福”马利亚
  choice: 也为你祝福
  alternative: 因你而欢喜
  rationale: 见证文本明确使用“祝福”的说法；虽与《路加福音》的措辞有所不同，仍保留本书独有的神学张力。
- issue: 马利亚忘记加百列所说的奥秘
  choice: 直译保留“忘了”
  alternative: 一时没有想起／不明白
  rationale: 不为协调马利亚的认知状态而弱化见证文本的明确陈述。
- issue: “我主的母亲”
  choice: 我主的母亲
  alternative: 主的母亲／上帝之母
  rationale: 保留关系性称谓及其含义，不扩展为后世神学称号。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留古代叙事简洁、连续的节奏。鉴于直接希腊语校勘尚待完成，本稿以所给公共领域英译见证为基础，并对可能涉及希腊语语义范围之处采取审慎、不作过度限定的译法。
