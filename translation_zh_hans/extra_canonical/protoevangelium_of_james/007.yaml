translation:
  language: zh_hans
  text: '（1）她一月又一月地照料孩子。孩子两岁时，约雅敬说：“我们把她带到主的圣殿去，好履行我们许下的诺言，免得主向我们发怒，不接纳我们的献礼。”


    但安娜说：“还是等到她满三岁吧，免得她想找父亲或母亲。”


    约雅敬说：“那就等吧。”


    （2）孩子满了三岁，约雅敬说：“我们把希伯来人中纯洁的女儿们召来，让她们拿着点燃的灯，好使孩子不回头，她的心也不受吸引而离开主的圣殿。”[a] 他们就这样做，直到一行人登上主的圣殿。


    祭司迎接她，亲吻她，说：“主上帝使你的名在万代中显为大；在末后的日子，主必借着你向以色列子民显明他的救赎。”


    （3）祭司让她坐在祭坛的第三级台阶上；主上帝把恩典倾注在她身上。她双脚起舞，以色列全家都喜爱她。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她的心也不受吸引而离开主的圣殿”也可理解为“她的心不被圣殿之外的事物吸引”；现有英文见证的句法存在歧义，尚待希腊文校核。
    reason: 保存关于“drawn away from the Temple”所修饰方向的真实歧义，并明确本稿的来源限制。
lexical_decisions:
- source_word: Temple of the Lord
  choice: 主的圣殿
  rationale: 沿用中文宗教文献中自然而庄重的表达，并保留所指为耶路撒冷圣所的语境。
- source_word: promise
  choice: 许下的诺言
  rationale: 上下文指父母向主所作的承诺；不擅自具体化为某种制度化的誓愿。
- source_word: gift
  choice: 献礼
  rationale: 保留献给上帝之物的祭献意味，同时避免把孩子直接物化为普通“礼物”。
- source_word: pure daughters of the Hebrews
  choice: 希伯来人中纯洁的女儿们
  rationale: 较形式地保存“pure”与“daughters”的措辞，不将其明确解释为童女，以免超出所提供的证据。
- source_word: redemption
  choice: 救赎
  rationale: 保留宗教与末世语境中的神学分量，不弱化为一般性的拯救或解救。
- source_word: all the house of Israel
  choice: 以色列全家
  rationale: 保留古代群体称谓的整体性，而不狭义处理为某一个家庭。
theological_decisions:
- issue: 马利亚在以色列救赎中的作用
  choice: “主必借着你……显明他的救赎”
  alternative: “主必在你身上……显明救赎”或“你将救赎以色列”
  rationale: 保留她作为媒介的表达，同时明确救赎属于主，避免把她写成救赎的最终施行者。
- issue: “末后的日子”的时间含义
  choice: 保留“在末后的日子”
  alternative: 解释为“将来”或特指某一历史时点
  rationale: 保存原有末世张力，不提前判定其具体应验范围。
- issue: “倾注恩典”的神学含义
  choice: 直译为“把恩典倾注在她身上”
  alternative: 释为“使她充满恩宠”或某种特定教义状态
  rationale: 保留叙事性神学语言，不导入后世宗派性的定义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留分节编号、重复句式和礼仪性用语。由于所提供材料明确标注“希腊文审查待完成”，本稿是依据公共领域英文见证并参考英文POB咨询层形成的暂定译稿；凡可能受希腊文句法影响的重要歧义，以脚注标明。
