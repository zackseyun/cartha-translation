    reason: 保存修饰关系的真实歧义，避免在希腊文直接复核前过早定案。
  - marker: b
    text: 原文见证直译为“我的心灵今天被放大／被尊为大”。这里译作“被高举”，保留其被动表达；措辞可能使人联想到《路加福音》中的颂歌语言。
    reason: 交代不寻常的颂歌式措辞及其可能的经文互文。
  - marker: c
    text: 也可译作“一个童女生了孩子，这是违反她本性的事”。这句话强调童女生育与通常身体规律之间的反常张力，并非对马利亚作道德评价。
    reason: 防止现代汉语把“本性”误读成品格或道德属性。
  - marker: d
    text: 这里是委婉说法，指通过身体检查来验证马利亚是否仍为童女。
    reason: 让读者理解叙事行为，同时不在正文中增添见证文本没有明说的解剖细节。
lexical_decisions:
- source_word: Hebrew midwife
  choice: 希伯来人的接生婆
  rationale: 正文采用目的关系的自然汉语表达，同时以脚注保留“希伯来接生婆”（族属修饰）的可能性。
- source_word: betrothed
  choice: 未婚妻
  rationale: 现代读者容易理解，也保留已经许配但尚未作为夫妻共同生活的叙事状态。
- source_word: overshadowed
  choice: 遮盖
  rationale: 保留云彩覆盖洞穴的圣显意象，不额外解释其神学含义。
- source_word: my soul is magnified
  choice: 我的心灵被高举了
  rationale: 尽量保留被动语态和颂歌式语言，并用脚注交代更字面的“被放大／被尊为大”。
- source_word: Salome
  choice: 撒罗米
  rationale: 采用现代中文圣经与基督教文献中较通行的人名音译。
- source_word: examine her condition
  choice: 检查她的身体状况
  rationale: 保留见证文本的委婉性，同时让现代读者明白这是身体检查，而不在正文中加入露骨细节。
theological_decisions:
- issue: 马利亚与约瑟的婚姻状态
  choice: “未婚妻”并保留“她并不是我的妻子”
  alternative: 将马利亚直接称为“妻子”或解释为已经完成法律婚姻
  rationale: 见证文本刻意并置“抽签许配给我”与“不是我的妻子”，译文保留这种张力，不替文本建立特定婚姻制度解释。
- issue: 从圣灵怀孕
  choice: 她是从圣灵怀了孕
  alternative: 她因圣灵感孕／圣灵使她怀孕
  rationale: “从”较贴近见证措辞，并避免过度明确原句未展开的因果机制。
- issue: “救恩已经为以色列诞生”
  choice: 按位格化而又含混的方式直译
  alternative: 明确译成“救主已经为以色列降生”
  rationale: 文本说的是“救恩”，不是明确的“救主”；保留抽象名词的人格化和神学张力。
- issue: 童女生育“违反本性”
  choice: 这是她的本性所不能容许的事
  alternative: 这是超自然的事／这违反自然规律
  rationale: 保留陈述者所说的“她的本性”及其身体层面的张力，不把它系统化为泛指的自然法则。
- issue: 撒罗米要求验证童女生育
  choice: 采用委婉正文并以脚注说明验证童贞
  alternative: 在正文直接写明生殖器检查
  rationale: 既不掩盖叙事意图，也维持原见证的委婉程度和庄重语体。
translation_notes:
  register: 采用庄重而自然的现代标准普通话，保留“看哪”“我指着永活的主、我的上帝起誓”等古代叙事与誓言色彩。段落和编号依照所给见证。由于希腊文源语复核尚未完成，本稿以所提供的公共领域英译见证为暂定起草依据；凡可能依赖希腊语句法或词形的判断，均采取保守译法或用脚注保留歧义。
