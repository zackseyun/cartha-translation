translation:
  language: zh_hans
  text: '《雅各原福音》第19章　耶稣诞生


    （1）看哪！有一个女人从山上下来。她问我：“这位先生，你要到哪里去？”


    我说：“我在找一位希伯来人的接生婆。”[a]


    她问我：“你是以色列人吗？”


    我对她说：“是的。”


    她又问：“那么，在洞里分娩的是谁？”


    我说：“是我的未婚妻。”


    她问我：“她不是你的妻子吗？”


    我对她说：“马利亚是在主的圣殿里抚养长大的，后来抽签决定把她许配给我。不过，她并不是我的妻子；她是从圣灵怀了孕。”


    接生婆问：“真的吗？”


    约瑟对她说：“来看看吧。”


    接生婆就跟他去了。


    （2）他们站在洞口，只见一朵明亮的云遮盖了洞穴。接生婆说：“今天，我的心灵被高举了，[b]因为我的眼睛看见了奇妙的事：救恩已经为以色列诞生了！”


    云立刻从洞穴退去，洞里显出一道强烈的光，刺得他们睁不开眼。过了一会儿，那光渐渐退去，直到一个婴孩显现出来。他来到母亲马利亚跟前，含住她的乳房吃奶。


    接生婆高声喊道：“今天对我来说是何等伟大的一天！因为我亲眼看见了这个前所未有的奇迹！”


    （3）接生婆从洞里出来时，撒罗米迎面遇见了她。


    她对撒罗米说：“撒罗米！撒罗米！我一定要把一个前所未见的景象告诉你：一个童女生了孩子，这是她的本性所不能容许的事！”[c]


    撒罗米说：“我指着永活的主、我的上帝起誓：除非我亲自检查她的身体状况，[d]否则我绝不相信这个童女生了孩子。”


    [a] “希伯来人的接生婆”也可理解为“希伯来接生婆”，即接生婆本人是希伯来人；现有英译见证在语法关系上不能完全排除这两种理解。


    [b] 原文见证直译为“我的心灵今天被放大／被尊为大”。这里译作“被高举”，保留其被动表达；措辞可能使人联想到《路加福音》中的颂歌语言。


    [c] 也可译作“一个童女生了孩子，这是违反她本性的事”。这句话强调童女生育与通常身体规律之间的反常张力，并非对马利亚作道德评价。


    [d] 这里是委婉说法，指通过身体检查来验证马利亚是否仍为童女。'
