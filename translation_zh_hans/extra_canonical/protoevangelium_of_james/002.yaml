  register: 采用现代、庄重而易懂的简体中文。人物对话保留情绪强度，叙述则简洁流畅。由于项目资料注明希腊语直接审校尚未完成，本稿以所给公共领域英语见证和可谨慎复原的希腊表达为基础；凡词形、异文或古代制度细节不确定之处，均避免作无根据的确定化处理。
