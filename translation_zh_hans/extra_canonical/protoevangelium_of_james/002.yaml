  text: '(1) Now his wife, Anna, mourned and lamented for two reasons. She said, “I lament because I am a widow and because I have no child.”


    (2) Now the great day of the Lord was approaching, and her servant Juthine said to her, “How long will you humiliate your soul? Look, the great day of the Lord has approached, and it is not right for you to grieve. Take this headband that the leader of the workplace gave me. It is not right for me to wear it, since I am your servant and it bears a royal mark.”


    (3) Anna said, “Get away from me! I will not do this. The Lord God has greatly humiliated me. Perhaps a trickster gave this to you, and you have come to make me share in your sin.”


    Juthine the servant replied, “Why should I curse you, since you haven’t heard my voice? The Lord God has made your womb infertile, to give you no fruit in Israel.”


    (4) And Anna was very grieved. She removed her garment of mourning, washed her head, and put on her wedding garment. At about the ninth hour, she went down into her garden to walk around. She saw a laurel tree and sat beneath it. After resting, she petitioned the Lord, saying, “God of my ancestors, bless me and hear my prayer, just as you blessed our mother Sarah and gave her a son, Isaac.”'
translation:
  language: zh_hans
  text: '（1）他的妻子安娜为两件事悲哀痛哭。她说：“我哀叹自己成了寡妇，也哀叹自己没有孩子。”


    （2）这时，主的大日子临近了。她的婢女犹提内对她说：“你还要苦待自己多久呢？看，主的大日子已经临近，你不该再悲伤了。请收下这条头带吧，是作坊的主管给我的。我既是你的婢女，就不宜佩戴它，因为上面有王室的标记。”[a]


    （3）安娜说：“离开我！我不肯这样做。主上帝已经重重羞辱了我。也许这是哪个骗子给你的，你却来要我与你一同犯罪。”


    婢女犹提内说：“你既不听我的话，我又何必咒诅你呢？主上帝已经使你的腹中不能生育，不让你在以色列中结出果实。”[b]


    （4）安娜极其悲伤，便脱下丧服，洗了头，穿上婚礼的礼服。[c] 大约在申初，她下到自己的园子里散步。她看见一棵月桂树，就坐在树下。歇息之后，她向主祈求说：“我祖先的上帝啊，求你赐福给我，垂听我的祷告；正如你曾赐福给我们的母亲撒拉，赐给她一个儿子以撒。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的大日子”可能指某个重大宗教节期，但这里没有明确说明是哪一个。“王室的标记”也可能表示这条头带具有王室或贵重身份的标识。
    reason: 原文相关指称存在真实不确定性，不宜在正文中擅自具体化。
  - marker: b
    text: “果实”在这里指儿女；这句话是犹提内对安娜所说的话，并不等于叙述者另作解释。
    reason: 说明生育隐喻，并保留人物言语与叙述立场的区别。
  - marker: c
    text: “婚礼的礼服”也可理解为已婚妇女在喜庆场合所穿的礼服；具体服饰性质有待希腊文本校勘。
    reason: 英语见证的“wedding garment”可能有多种文化语境，正文不宜过度限定。
lexical_decisions:
- source_word: πενθεῖν / θρηνεῖν（据希腊传统所反映的哀悼用语；待直接校勘）
  choice: 悲哀痛哭／哀叹
  rationale: 保留两种并列哀伤表达，同时避免现代汉语中生硬重复。
- source_word: ἡ μεγάλη ἡμέρα κυρίου（据见证译文；待直接校勘）
  choice: 主的大日子
  rationale: 保留宗教节期称谓的庄重性及其可能的经文回响，不擅自指定具体节期。
- source_word: ταπεινοῖς τὴν ψυχήν（据见证译文；待直接校勘）
  choice: 苦待自己
  rationale: 此惯用语可能指禁食、刻苦或自我降卑；正文采用自然且保留范围的表达。
- source_word: διάδημα / κεφαλόδεσμον（具体希腊词待校勘）
  choice: 头带
  rationale: 依见证译文作中性处理，不将其过度具体化为冠冕或首饰。
- source_word: ἐργαστήριον及其主管称谓（待校勘）
  choice: 作坊的主管
  rationale: 比“工作场所的领导”更符合古代生产环境，但不确定的制度细节不作扩充。
- source_word: σημεῖον βασιλικόν（据见证译文；待校勘）
  choice: 王室的标记
  rationale: 保留其可能表示王权、王室或贵重身份的含混性。
- source_word: ἄκαρπον / καρπόν（据见证译文；待校勘）
  choice: 不能生育／结出果实
  rationale: 先明示生育处境，再保留“果实”的隐喻及其以色列群体语境。
- source_word: ὥρα ἐνάτη
  choice: 申初
  rationale: 对应古代第九时，约为下午三点；采用传统汉语时辰表达，并以脚注说明。
- source_word: δάφνη
  choice: 月桂树
  rationale: 按通常植物义翻译，不改作笼统的树木名称。
- source_word: ἐπηρώτα / ἐδεήθη（具体读法待校勘）
  choice: 向主祈求
  rationale: 自然表达恳求祷告之意，不引入额外礼仪含义。
theological_decisions:
- issue: “主的大日子”的具体所指
  choice: 保留“主的大日子”
  alternative: 译为某一明确的犹太节期
  rationale: 所给材料没有确定节期名称；保留文本本身的含混性，避免神学或历法上的过度判定。
- issue: 上帝使安娜不能生育的陈述
  choice: 按人物话语直译为“主上帝已经使……”
  alternative: 弱化为“主上帝容许……”或“她以为上帝使……”
  rationale: 这是婢女在叙事中的直接断言；翻译不替叙述者确认，也不以教义解释削弱其力度。
- issue: 安娜“成了寡妇”的说法与前文丈夫尚在的潜在张力
  choice: 保留“成了寡妇”
  alternative: 解释为“像寡妇一样”或“丈夫离弃了我”
  rationale: 原见证明确呈现“寡妇”；不在正文中消解叙事张力。
- issue: “我们的母亲撒拉”
  choice: 保留群体性称谓“我们的母亲”
  alternative: 简化为“先祖撒拉”
  rationale: 保存安娜把自己置于以色列母系祖先传统中的祷告语言。
