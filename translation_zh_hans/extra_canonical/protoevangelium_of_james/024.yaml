translation:
  language: zh_hans
  text: '（1）到了问安的时候，祭司们来了，撒迦利亚却没有像往常一样出来迎接他们，为他们祝福。祭司们站在那里等候撒迦利亚，要领受他的祝福，并颂赞至高的上帝。


    （2）他迟迟不来，众人都害怕起来。其中一人鼓起勇气走进圣所，看见主的祭坛旁有凝结的血。又有声音说：“撒迦利亚被杀了；他的血不会被抹去，直到为他报仇的人来到！”[a]


    那人听见这话，就害怕了，出去把自己所见所闻告诉祭司们。（3）他们便鼓起勇气进去，看见了所发生的事。圣殿的镶板呼喊起来；祭司们就从上到下撕裂衣服。[b]他们没有找到撒迦利亚的尸体，却发现他的血已经变成石头。他们害怕，就出去向全体百姓报告，说撒迦利亚被杀了。百姓各支派听见以后，都为他哀悼，昼夜哭泣了三天。


    （4）三天以后，祭司们开会商议，应当由谁接替撒迦利亚。抽签抽中了西面，因为圣灵曾指示他：在亲眼看见基督以肉身显现以前，他不会死。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他报仇的人”也可译作“为他伸冤的人”。现有底本强调撒迦利亚的血要等到追讨血债者来到才会被除去。
    reason: 保留 avenger 在私人报仇与公义伸冤之间的语义张力。
  - marker: b
    text: 撕裂衣服是悲痛、惊惧或哀悼的表示。
    reason: 帮助现代读者理解古代礼俗，而不把解释写入正文。
  - marker: c
    text: 这里的“以肉身显现”直译现有见证的“在肉身中的基督”；也可理解为“亲眼看见肉身的基督”。
    reason: 说明措辞基础并保留短语可能的句法表达。
lexical_decisions:
- source_word: hour of greeting
  choice: 问安的时候
  rationale: 保留礼仪性会面的含义，不将其具体化为原始材料未明确说明的某一固定时辰。
- source_word: sanctuary
  choice: 圣所
  rationale: 与“圣殿”整体相区别，表达进入圣殿内部神圣区域的意思。
- source_word: panels of the Temple
  choice: 圣殿的镶板
  rationale: 按现有英文见证直译其建筑构件意象，同时避免擅自改作门、墙或梁柱。
- source_word: all the tribes of the people
  choice: 百姓各支派
  rationale: 保留群体按支派构成的古代语境，又使现代汉语自然。
- source_word: the lot fell to Simeon
  choice: 抽签抽中了西面
  rationale: 用自然现代汉语表达以拈阄求取决定的结果，不暗示普通随机游戏。
- source_word: the Christ in the flesh
  choice: 基督以肉身显现
  rationale: 保留“基督”称号和肉身层面，避免弱化为仅仅“亲眼见到基督”。
theological_decisions:
- issue: 撒迦利亚之血与报仇者
  choice: “直到为他报仇的人来到”
  alternative: “直到伸冤者来到”
  rationale: 现有见证明确带有 avenger 的报仇语义；正文保留其强烈表达，脚注提示也可理解为执行血债公义或伸冤者，避免过早化解张力。
- issue: 圣殿镶板呼喊
  choice: 按字面保留“呼喊起来”
  alternative: 解释为发出异响或象征性见证
  rationale: 叙事呈现超自然事件，原文见证没有说明是比喻，因此不作自然化解释。
- issue: 西面不会见死
  choice: “在亲眼看见基督以肉身显现以前，他不会死”
  alternative: “未见肉身中的基督以前，他不会尝死味”
  rationale: 以现代汉语清楚表达时间先后，同时保留基督真实肉身显现的含义，不扩展为特定教派的基督论公式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体；保留重复的“害怕”“鼓起勇气”等推进节奏。由于所供材料注明希腊语核查尚待完成，本稿以公共领域英文见证为临时源证据，并对可能受希腊文本影响的关键处采取审慎、较形式对应的译法。
