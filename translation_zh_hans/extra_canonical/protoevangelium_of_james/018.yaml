lexical_decisions:
- source_word: cave
  choice: 山洞
  rationale: 现代汉语中自然清楚，同时保留场景的岩洞性质；不以“马棚”等传统意象替代。
- source_word: Hebrew midwife
  choice: 希伯来接生婆
  rationale: 保留族群限定与古代职业称呼；“接生婆”比“助产士”更符合叙事时代背景，也容易理解。
- source_word: dome of heaven
  choice: 天穹
  rationale: 简洁表达天空如穹顶的古代宇宙图景，不将其现代化改写。
- source_word: wandering but not wandering
  choice: 正在行走，却又没有行走
  rationale: 保留原句刻意形成的悖论和时间停滞感，不解释为主观恍惚。
- source_word: torrent of the river
  choice: 河里的急流
  rationale: 用自然现代汉语保留水流湍急的画面，避免生硬的“河流的洪流”。
- source_word: resumed its course
  choice: 又都照常运行起来
  rationale: 既表达万物恢复动作，也保留其重新进入正常进程的整体意味。
theological_decisions:
- issue: 时间静止场景的性质
  choice: 按叙事直接呈现万物动作停顿
  alternative: 解释为约瑟的异象、心理体验或宇宙性神迹
  rationale: 文本本身没有明确界定这一经验的本体性质，译文不替作者作神学判定。
- issue: 约瑟“行走却没有行走”的矛盾表达
  choice: 保留表面矛盾
  alternative: 顺译为“想走却走不动”或“仿佛没有行走”
  rationale: 原有张力是本段文学效果的重要部分，解释性改写会消除其歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。动作停滞部分保留反复、悖论和逐层铺陈，以再现原叙事节奏；避免加入马棚、神迹解释或其他后世传统细节。
