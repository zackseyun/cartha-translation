  naturalness: 整体为自然、庄重的现代汉语。“下去了”比“下山去了”更忠实且不显突兀；“走遍犹太周围一带”比“犹太全境及其周围一带”更符合所供英文见证的地域表述。
  terminology: “主上帝”“圣殿”“圣所”“至圣所”“大祭司”“鳏夫”“杖”“征兆”等术语均可保留。“礼袍”可改作较中性的“袍子”，避免在服饰具体身份未核前添加礼仪功能的限定。
