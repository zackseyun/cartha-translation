base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/008.yaml
  text: 'Her parents went down, marveling, praising, and glorifying the Lord God because the child had not turned back. Mary remained in the Temple of the Lord. She was nurtured like a dove and received food from the hand of an angel.


    When she became twelve years old, the priests held a council and said, “Look, Mary has been in the Temple of the Lord for twelve years. What should we do about her so that she will not defile the sanctuary of the Lord our God?” They said to the chief priest, “You stand at the altar of the Lord. Go in and pray about her. If the Lord God reveals anything to you, we will do it.”


    The chief priest went in, taking the robe with twelve bells into the Holy of Holies, and prayed about her. And look! An angel of the Lord stood nearby and said, “Zechariah, Zechariah, go out and assemble the widowers of the people, and let each of them bring a staff. The man whom the Lord God points out with a sign—she will be his wife.”


    The heralds went throughout the whole surrounding region of Judea and sounded the trumpet of the Lord. And look! All the men rushed in.'
translation:
  language: zh_hans
  text: '（1）她的父母下山去了；他们因孩子没有回头而惊叹不已，又赞美、颂扬主上帝。马利亚留在主的圣殿里，像鸽子一样受到抚养，并从天使手中领受食物。


    （2）她到了十二岁时，祭司们召开会议，说：“看，马利亚在主的圣殿里已经十二年了。我们该怎样安置她，才不至于让她玷污主我们上帝的圣所呢？”他们对大祭司说：“你侍立在主的祭坛前。进去为她祷告吧；主上帝若向你启示什么，我们就照着做。”


    （3）大祭司带着那件有十二个铃铛的礼袍[a]进入至圣所，为她祷告。看哪！主的一位天使站在旁边，说：“撒迦利亚！撒迦利亚！你出去，把民中的鳏夫召集起来，让他们各自带一根杖来。主上帝用征兆指明谁，她就要作谁的妻子。”


    传令的人走遍犹太全境及其周围一带，吹响主的号角。看哪！众人都赶来了。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有十二个铃铛的礼袍”：供应的英译见证如此记载；其所指的具体祭司服饰尚待希腊文及抄本传统复核。
    reason: 当前项目明确说明希腊文复核尚未完成，而这一服饰细节可能涉及文本或传统问题，宜透明标示。
  - marker: b
    text: “众人”：字面可译“所有男人”；结合上文，所召集的是民中的鳏夫。
    reason: 保存末句字面范围与上下文所限定召集对象之间的轻微张力。
lexical_decisions:
- source_word: went down
  choice: 下山去了
  rationale: 保留方向性动词；在圣殿叙事语境中，离开耶路撒冷通常称为“下去”。补出“山”使现代汉语自然，但仍不指定具体目的地。
- source_word: nurtured like a dove
  choice: 像鸽子一样受到抚养
  rationale: 保留原有明喻及其未明说的象征意味，不解释为纯洁、温柔或神奇成长。
- source_word: pollute / defile
  choice: 玷污
  rationale: 此处涉及礼仪上的圣所洁净观念；“玷污”既能表达礼仪含义，也不把原因进一步明说。
- source_word: chief priest
  choice: 大祭司
  rationale: 依该段单数职分及进入至圣所的叙述，采用通行的宗教历史称谓。
- source_word: robe with twelve bells
  choice: 有十二个铃铛的礼袍
  rationale: 保留见证文本中的数目与服饰特征；用“礼袍”体现祭司服饰语境，但不擅自等同于某一件正典所述衣物。
- source_word: widowers
  choice: 鳏夫
  rationale: 准确保留“妻子已经去世的男子”这一限定，不泛化为未婚男子。
- source_word: staff
  choice: 杖
  rationale: 保留古代叙事中可作为身份标志和神示媒介的物件，不具体化为手杖或牧杖。
- source_word: points out with a sign
  choice: 用征兆指明
  rationale: 保留神示的方式及其开放性，不预先说明征兆为何。
- source_word: heralds
  choice: 传令的人
  rationale: 采用普通现代读者容易理解的表达，同时保留其奉命公开召集的职能。
- source_word: trumpet of the Lord
  choice: 主的号角
  rationale: 直译所有格表达，不把它解释成圣殿号、宗教仪式号或仅仅奉主之名吹号。
theological_decisions:
- issue: 马利亚从天使手中得食
  choice: 按叙事直接陈述“从天使手中领受食物”
  alternative: 弱化为“由天使照料”或解释为象征性供应
  rationale: 见证文本将其作为叙事事实陈述；译文不应将其去神奇化，也不应额外建立教义。
- issue: 十二岁与玷污圣所之间的关联
  choice: 保留祭司所说“才不至于让她玷污……圣所”
  alternative: 明确补译为月经导致礼仪不洁
  rationale: 文本并未明说具体生理原因；保留其古代礼仪观念和叙事张力，避免替作者补充解释。
- issue: 神示所指定关系的性质
  choice: 译作“她就要作谁的妻子”
  alternative: 译作“交由谁监护”或“许配给谁”
  rationale: 供应的见证明确为 wife；虽然后续传统可能突出监护性质，本段本身不宜以解释取代措辞。
- issue: “主的号角”的所有格
  choice: 保留“主的号角”
  alternative: 解释为“奉主之名吹号”
  rationale: 原表达的确切关系可能具有礼仪、归属或授权含义；直译可保存歧义。
- issue: 末句“所有男人”的范围
  choice: 正文译作“众人都赶来了”，并以脚注提示字面范围
  alternative: 译作“所有鳏夫都赶来了”或“所有男人都赶来了”
  rationale: 上文召集对象是鳏夫，但见证末句字面称“所有男人”；正文采用自然且不过度限定的“众人”，脚注保留文本细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体；保留“看哪”以呈现原文突转和显现语气。段落编号依供应文本。因直接希腊文审校尚未完成，本稿以公共领域英文见证为暂定依据，不把不确定处伪装成已完成的原文定论。
