  text: '(1) Day by day, the child grew stronger. When she was six months old, her mother stood her on the ground to see whether she could stand. She walked seven steps and came to her mother’s breast. Her mother picked her up and said, “As the Lord my God lives, you will not walk on this ground again until I bring you into the Temple of the Lord.”


    She made a sanctuary in her bedroom and did not allow anything sacrilegious or impure to pass through it. She called the pure daughters of the Hebrews, and they played with her.


    (2) When the child became one year old, Joachim held a great feast and invited the chief priests, the priests, the scribes, the elders, and all the people of Israel. Joachim brought the child to the priests, and they blessed her, saying, “God of our ancestors, bless this child and give her a name that will be spoken forever among all generations.”


    All the people said, “So be it. Amen!”


    They brought her to the chief priests, and they blessed her, saying, “Most High God, look upon this child and bless her with a final blessing that cannot be surpassed.”


    (3) Her mother took her up to the sanctuary of her bedroom and nursed the child. Anna made a song to the Lord God, saying:


    “I will sing a holy song to the Lord my God, because God has visited me and removed the criticism of my enemies.


    “And the Lord God has given me the fruit of God’s justice, singular yet manifold before God.


    “Who will report to Reubel’s people that Anna nurses a child? ‘Listen, listen, twelve tribes of Israel: Anna nurses a child!’”


    Anna rested in the sanctuary of her bedroom. Then she went and ministered to them. When dinner was over, they went down rejoicing and glorifying the God of Israel.'
translation:
  language: zh_hans
  text: '（1）孩子一天天长得健壮。六个月大的时候，母亲把她放在地上，想看看她能不能站立。她走了七步，来到母亲怀前；母亲一把抱起她来，说：“我指着主我的上帝的永生起誓：在我把你带进主的圣殿以前，你再也不可在这地上行走。”


    她在自己的卧房里设了一个圣所，不许任何亵渎或不洁之物经过那里。她又叫来希伯来人中纯洁的女儿们陪她玩耍。


    （2）孩子满一岁时，约雅敬大摆筵席，请来祭司长、众祭司、经学家、长老，以及以色列全体百姓。约雅敬把孩子带到祭司面前，他们为她祝福，说：“我们祖先的上帝啊，求你赐福给这孩子，使她的名世世代代永远被人传扬。”


    全体百姓都说：“愿如此成就。阿们！”


    他们又把她带到祭司长面前；祭司长为她祝福，说：“至高的上帝啊，求你眷顾这孩子，以那无可超越的终极之福赐福给她。”[a]


    （3）母亲把她抱上卧房里的圣所，给她喂奶。安娜向主上帝作歌，说：


    “我要向主我的上帝唱一首圣歌，

    因为上帝眷顾了我，

    除去了仇敌对我的责难。


    “主上帝赐给我上帝公义的果实；

    这果实独一，却在上帝面前众多。[b]


    “谁要去告诉吕便的子孙，

    安娜正在乳养一个孩子？[c]

    ‘听啊，听啊，以色列十二支派：

    安娜正在乳养一个孩子！’”


    安娜在卧房的圣所里歇息，随后出去服侍宾客。筵席结束后，众人欢欢喜喜地下去，颂赞以色列的上帝。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “终极之福”所对应的措辞也可能含有“完全的福”或“最后的福”之意；现有见证不足以确定。
    reason: 保留 final blessing 的词义歧义，避免误解为明确的时间顺序。
  - marker: b
    text: “独一，却……众多”原意不明；这里保留所据见证中的悖论式表达，尚待希腊文复核。
    reason: 防止译文自行解释难句并掩盖文本问题。
  - marker: c
    text: 所据英文见证作“Reubel”；这里按通常理解译作以色列支派祖先“吕便”，但原文形式仍需核查。
    reason: 交代专名校订及来源不确定性。
lexical_decisions:
- source_word: sanctuary
  choice: 圣所
  rationale: 保留卧房内被分别为圣之空间的宗教含义，不弱化为一般的“洁净房间”。
- source_word: sacrilegious or impure
  choice: 亵渎或不洁之物
  rationale: 分别保留侵犯神圣与礼仪不洁两个概念，避免合并其意义。
- source_word: scribes
  choice: 经学家
  rationale: 采用现代读者较易理解、同时符合古代犹太语境的称谓。
- source_word: visited
  choice: 眷顾
  rationale: 在此指上帝带着恩惠临到并介入安娜的处境；“眷顾”比字面“探访”更自然。
- source_word: criticism
  choice: 责难
  rationale: 表达因不育而受到的羞辱、非议或指责，同时不把原文范围限死为单纯“讥讽”。
- source_word: ministered to them
  choice: 服侍宾客
  rationale: 依筵席语境明确代词所指，并保留实际接待、服侍之意。
- source_word: Reubel
  choice: 吕便
  rationale: 该拼写很可能对应以色列支派祖先 Reuben；正文采用通行圣经汉译名，并以脚注说明见证文本的拼写问题。
theological_decisions:
- issue: 马利亚在家中圣所受保护的叙述
  choice: 按文本保留“圣所”及避免亵渎、不洁之物的表述
  alternative: 改写为普通育婴房或解释为无罪状态
  rationale: 既不淡化叙事的神圣空间意象，也不据此加入有关马利亚本体或无罪性质的教义判断。
- issue: “final blessing”所指
  choice: 译作“无可超越的终极之福”并加注说明歧义
  alternative: 解释为临终祝福、最后一次祝福或完全的祝福
  rationale: 现有英文见证不足以断定其时间性或完成性，故保存张力而不作教义化解释。
- issue: “上帝公义的果实，独一却众多”
  choice: 近形式保留矛盾式措辞
  alternative: 解释为马利亚一人带给多人祝福，或改作上帝赐下的唯一孩子
  rationale: 诗句意义晦涩，且希腊文复核尚待进行，不宜在正文中静默消解其神学与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文叙事语体。祝福语和安娜之歌略具礼仪与诗歌节奏，但避免过度古雅。当前材料明确说明希腊文审校尚未完成，因此对“终极之福”“独一却众多”和“Reubel”等难点以脚注保存不确定性。
