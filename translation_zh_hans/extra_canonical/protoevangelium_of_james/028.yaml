review_pass:
  verdict: revise
  source_fidelity: 译稿整体忠实保留了叙事顺序、洞穴与云光异象、救恩为以色列诞生的诗性表述，以及撒罗米提出亲自查验的内容。惟“我的心灵……被高举”未能贴切对应“my soul is magnified”的“被尊大／得以尊大”语义；“前所未有”把“new”强化为原文未明说的绝对判断；“本性所不容”容易引向道德或人格本性，宜改为自然情形。
  naturalness: 现有汉语庄重流畅，但“从圣灵怀了孕”“伸进手指”“她的本性所不容”略显生硬或可能误导。改为“由圣灵怀孕”“把手指伸进去”“与她的自然情形相违”，更符合现代标准汉语，同时维持叙事的庄重感。
  terminology: 保留“马利亚”“约瑟”“撒罗米”“圣灵”“主”“上帝”“救恩”“童女”等用语。“救恩”不改作“救主”，以保存英文见证及底层传统可能具有的诗性、人格化开放性。对查验的措辞保持含蓄，但脚注明确其上下文所指。
  issues:
  - severity: medium
    issue: “我的心灵今天被高举了”
    rationale: “magnified”主要是“被尊大、得以尊大”，并非仅指情绪或地位上的“被高举”。“我的心灵今天得以尊大”更贴近原句的庄重、诗性被动表达，且不补出未明言的施事者。
  - severity: low
    issue: “前所未有的奇迹／景象”
    rationale: 英文见证仅称“new miracle／new sight”；“前所未有”加入绝对性的比较判断。宜译为“新的神迹／新的景象”。
  - severity: medium
    issue: “这是她的本性所不容的”
    rationale: 该译法在现代汉语中易被理解为人格、道德或规范性的“本性”，而上下文是童女生育与通常自然情形相违。宜以“与她的自然情形相违”保留原有张力与歧义。
  - severity: low
    issue: “从圣灵怀了孕”“伸进手指”
    rationale: 前者不如“由圣灵怀孕”自然；后者动宾搭配不顺。调整为现代汉语惯用表达，不改变来源或查验动作。
  revised_text: '《雅各原福音》第十九章：耶稣诞生


    （1）约瑟找到一位正从山上下来的接生婆，便把她带来了。[a] 约瑟对接生婆说：“马利亚是我的未婚妻；她是由圣灵怀孕的，也是在主的圣殿里养育长大的。”


    接生婆便跟他去了。


    （2）他们站在洞穴前，只见一片浓云笼罩着洞穴。接生婆说：“我的心灵今天得以尊大，因为我的眼睛今天看见了奇妙的事：救恩已经为以色列诞生了！”


    云立刻从洞穴退去，洞里出现一道强烈的光，使他们的眼睛无法承受。过了一会儿，光退去，直到一个婴孩显现出来。他来到母亲马利亚身边，含住她的乳房。


    接生婆高声说：“今天何等伟大，因为我看见了这个新的神迹！”


    （3）接生婆走出洞穴，撒罗米遇见了她。


    接生婆对她说：“撒罗米！撒罗米！我必须向你述说一个新的景象：一个童女生了孩子，这与她的自然情形相违！”[b]


    撒罗米说：“我指着永活的主、我的上帝起誓：除非我把手指伸进去，查验她的情形，[c] 否则我绝不相信童女生了孩子。”'
