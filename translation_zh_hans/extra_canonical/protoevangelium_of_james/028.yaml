translation:
  language: zh_hans
  text: '《雅各原福音》第十九章：耶稣诞生


    （1）约瑟找到一个正从山上下来的接生婆，就把她带来了。[a] 约瑟对接生婆说：“马利亚是我的未婚妻；她从圣灵怀了孕，又是在主的圣殿里长大的。”


    接生婆便跟他去了。


    （2）他们来到洞穴前，只见一片浓云遮住了洞穴。接生婆说：“我的心灵今天被高举了，因为我的眼睛今天看见了奇妙的事：救恩已经为以色列诞生了！”


    云立刻从洞穴退去，洞里显出一道强烈的光，刺得他们睁不开眼睛。过了一会儿，光渐渐退去，一个婴孩显现出来。他便来到母亲马利亚身边，吃她的奶。


    接生婆高声说：“今天是何等伟大的日子！我竟看见了这前所未有的奇迹！”


    （3）接生婆走出洞穴，撒罗米迎面遇见了她。


    接生婆对她说：“撒罗米！撒罗米！我一定要把一个前所未见的景象告诉你：一个童女竟生了孩子，这是她的本性所不容的！”[b]


    撒罗米说：“我指着永活的主、我的上帝起誓：除非我伸进手指，查验她的身体状况，[c] 否则我绝不相信童女生了孩子。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据英文见证的开头句式压缩，直译近于“他找到（并）带来（她），她正从山上下来”；这里依上下文将“她”理解为接生婆。希腊文传统尚待直接复核。
    reason: 说明代词所指和句法重组，避免把暂定理解伪装成无争议的原文。
  - marker: b
    text: “这是她的本性所不容的”也可理解为“这不合她的自然情形”。
    reason: 保留“nature”在本性、自然情形之间的语义幅度。
  - marker: c
    text: “身体状况”在此是含蓄说法，指撒罗米要亲手检查马利亚是否仍为童女。
    reason: 帮助现代读者理解下文动作所指，同时让正文维持庄重而不过度露骨的语体。
lexical_decisions:
- source_word: betrothed
  choice: 未婚妻
  rationale: 用现代汉语中清楚自然的称谓表达已订婚而尚未成婚的关系，不额外推断婚姻状态。
- source_word: conceived from the Holy Spirit
  choice: 从圣灵怀了孕
  rationale: 保留来源表达及其神学主张，不改写为特定教派的术语。
- source_word: overshadowed
  choice: 遮住了
  rationale: 准确表达云覆盖洞穴的可见景象；不额外赋予“荫庇”等解释性神学含义。
- source_word: My soul is magnified
  choice: 我的心灵今天被高举了
  rationale: 保留所据见证中被动而庄重的表达及其经文回声，避免擅自补出“尊主为大”等原句未明说的宾语。
- source_word: Salvation
  choice: 救恩
  rationale: 既可指拯救事件，也带有人格化的可能性；中文不擅自判定其具体所指。
- source_word: appeared
  choice: 显现出来
  rationale: 保留光退去后婴孩出现这一叙事次序及其非日常语感。
- source_word: against her nature
  choice: 这是她的本性所不容的
  rationale: 保留关于童女生育与通常自然情形相悖的张力，不将其弱化为单纯的“罕见”。
- source_word: examine her condition
  choice: 查验她的身体状况
  rationale: 按上下文表达身体检查，同时避免在正文中加入所据见证没有明说的解剖细节。
theological_decisions:
- issue: “救恩已经为以色列诞生”是否明确等同于婴孩本人
  choice: 保留“救恩”这一抽象而可能人格化的说法
  alternative: 译为“以色列的救主已经诞生”
  rationale: 所据见证写的是“Salvation”而非“savior”；正文应保存其诗性与神学含混，不把“救恩”直接改成“救主”。
- issue: “我的心灵被高举”是否补明上帝为施事者
  choice: 不补明施事者
  alternative: “上帝今天使我的心灵振奋”
  rationale: 被动句没有明说施事者；保留原有开放性。
- issue: 童女生产的陈述
  choice: 作为人物在叙事中的见证直接保留
  alternative: 以译者口吻解释其医学或教义意义
  rationale: 不在翻译中替叙事人物论证或系统化该主张。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的叙事汉语；保留重复呼语、感叹语气和奇异叙事的张力。由于提供材料明确注明希腊语直接复核尚未完成，本稿以公共领域英文见证为暂定依据，并对开篇的句法不确定性作脚注说明。
