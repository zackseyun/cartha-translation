  text: '(1) She was in her sixth month. And look! Joseph came from his building, entered the house, and found her pregnant. He struck his face, threw himself on the ground in sackcloth, and wept bitterly, saying, “How can I face the Lord God? What prayer can I offer concerning this young girl, since I received her as a virgin from the Temple of the Lord God and did not protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Am I not reliving the story of Adam? For while Adam was giving glory during the hour of prayer, the serpent came, found Eve alone, and deceived her. And now it has happened to me!”


    (2) Joseph got up from the sackcloth, called her, and said to her, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) She wept bitterly, saying, “I am pure, and I have not known a man!”


    Joseph said to her, “Then where did this thing in your womb come from?”


    She said, “As the Lord my God lives, I do not know where it came from!”'
translation:
  language: zh_hans
  text: '（1）她怀孕已经六个月了。看哪！约瑟从做工的地方回来，进了屋，看见她怀了孕。他捶打自己的脸，身披麻布，俯伏在地，痛哭说：“我怎能仰面面对主上帝？为了这个少女，我还能作什么祷告呢？我从主上帝的圣殿领她来时，她还是童女，我却没有保护好她。是谁给我设下了这个圈套？是谁在我家里做了这恶事？是谁玷污了这童女？亚当的遭遇岂不是在我身上重演了吗？因为亚当在祷告的时刻颂赞上帝时，那蛇来了，见夏娃独自一人，就欺骗了她；如今同样的事也临到我了！”


    （2）约瑟从麻布上站起来，把她叫来，对她说：“上帝眷顾了你，你为什么做出这种事？你忘记了主你的上帝。为什么使自己蒙羞？你曾在至圣所里得到养育，又从天使手中领受食物！”


    （3）她痛哭说：“我是清白的，从来没有亲近过男人！”[a]


    约瑟对她说：“那么，你腹中这个孩子是从哪里来的？”[b]


    她说：“主我的上帝永远活着，我不知道他是从哪里来的！”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲近过男人”原意为“认识男人”，是指与男人发生性关系的委婉说法。
    reason: 帮助现代读者理解古代惯用语，同时避免正文过于生硬。
  - marker: b
    text: 所据见证直译作“你腹中这东西”；这里依上下文译作“这个孩子”。
    reason: 记录从形式直译到自然汉语的调整，并保留原文措辞的语气信息。
  - marker: c
    text: “主我的上帝永远活着”是古代的起誓用语。末句也可较字面地理解为：“我不知道这是从哪里来的。”
    reason: 说明誓言公式，并保留代词所指可能略有含混。
lexical_decisions:
- source_word: from his building
  choice: 从做工的地方回来
  rationale: 所据英文见证的表达可能指约瑟从建筑工作或工地归来；译作“做工的地方”既自然，也避免在希腊文复核前过度确定为某一栋建筑。
- source_word: struck his face
  choice: 捶打自己的脸
  rationale: 保留哀恸与震惊中的具体身体动作，不弱化为泛泛的“悲痛”。
- source_word: in sackcloth
  choice: 身披麻布
  rationale: 按古代哀悼习俗处理；结合下文“从麻布上站起来”可见原叙述细节略显生硬，因此不擅自统一为单一姿势。
- source_word: young girl
  choice: 少女
  rationale: 符合现代汉语的庄重叙事语体，也不额外推定年龄。
- source_word: virgin
  choice: 童女
  rationale: 在古代宗教叙事中保留身份性称谓；与后文“没有亲近过男人”相互呼应。
- source_word: Holy of Holies
  choice: 至圣所
  rationale: 采用通行的犹太圣殿术语。
- source_word: known a man
  choice: 亲近过男人
  rationale: 以较自然且庄重的委婉语表达希伯来—圣经传统中指性关系的“认识”，并以脚注说明。
- source_word: this thing in your womb
  choice: 你腹中这个孩子
  rationale: 中文若直译“这东西”会显得贬损且不自然；上下文明确指胎儿，但脚注保留原措辞较含混、较生硬的特点。
- source_word: As the Lord my God lives
  choice: 主我的上帝永远活着
  rationale: 保留古代起誓公式的形式和庄严感，不改写成单纯的“我发誓”。
theological_decisions:
- issue: 马利亚怀孕的原因
  choice: 不在叙述中补明圣灵感孕
  alternative: 按后来的基督教理解直接说明胎儿由圣灵而来
  rationale: 本章刻意保留约瑟的困惑和马利亚当时所宣称的无知；提前解释会消除叙事张力。
- issue: 亚当与夏娃的类比
  choice: 按约瑟的言辞保留“亚当在祷告时、蛇欺骗独处的夏娃”的叙述
  alternative: 改写成《创世记》正典文本中更熟悉的表达
  rationale: 这是本作品自身对亚当故事的转述，不应为迁就正典措辞而校正或删改。
- issue: “上帝眷顾了你”与责问之间的张力
  choice: 直译并保留突兀并置
  alternative: 解释为“上帝如此眷顾你”或“你蒙上帝眷顾，却……”
  rationale: 所据见证本身简短而有张力；在希腊文复核前不添加逻辑连接。
- issue: “使自己蒙羞”所表达的主体
  choice: 译为“为什么使自己蒙羞”
  alternative: 译为“为什么羞辱自己的灵魂”
  rationale: “灵魂”直译在现代汉语中容易被理解为特定的灵魂论陈述；当前译法传达道德与人格受辱之意，脚注记录其字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语，保留“看哪”等古代叙事提示语及反复出现的责问。当前底本是公共领域英文见证，希腊文原文复核尚未完成；因此对“from his building”、麻布动作以及若干代词指向采取审慎处理，不把暂时不确定之处伪装成定论。
