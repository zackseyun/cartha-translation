review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所提供的英文见证，且保留了约瑟的震惊、责问，以及马利亚的否认与无知。需要修正两处：原文的“this thing”不宜在正文中预先具体化为“孩子”；末句的“it”也不应改为阳性指人的“他”。此外，关于麻布的动作应避免一面译作“身披”、一面又译作“从麻布上站起来”的不一致。未提供可供逐字核验的希腊文文本，故本次以所给英文见证为直接审校基准，并保留希腊文传统复核的需要。
  naturalness: 修订后保持现代汉语庄重叙事体。“伏在地上的麻布上”既自然，也与下一节“从麻布上起来”相互一致。“你腹中这东西”在责问语境中虽尖锐，却是自然可懂的表达，并保留见证文本的非人格化措辞。
  terminology: “主上帝”“圣殿”“童女”“至圣所”均可保留。“亲近过男人”作为性关系的委婉表达自然且符合文本语域。起誓公式调整为“我指着永活的主——我的上帝起誓”，以在现代汉语中明确其誓言性质，同时不把它误解成单纯的关于上帝永恒性的陈述。
  issues:
  - severity: medium
    issue: “你腹中这个孩子”具体化了见证文本的“this thing”。
    rationale: 约瑟的措辞带有刻意的指示性和非人格化色彩；虽上下文所指为胎儿，但译为“孩子”会提前消解这一语气。
  - severity: medium
    issue: “我不知道他是从哪里来的”把原文中性、指向略含混的“it”改为指男性的人称代词。
    rationale: 此改动既强化了胎儿的人格化和性别指向，也使马利亚的话不如原见证文本含混；宜译作“我不知道这是从哪里来的”。
  - severity: medium
    issue: “身披麻布”与“从麻布上站起来”在动作描写上不一致。
    rationale: 所给见证先说约瑟伏地与麻布有关，后说他从麻布上起来；译为“伏在地上的麻布上”可同时保留这两个叙述细节，避免擅自确定为穿着麻衣。
  - severity: low
    issue: “为了这个少女，我还能作什么祷告呢？”弱化了“what prayer can I say about”的“关于”含义。
    rationale: “我还能为这个少女作什么祷告呢？”较贴近见证，也符合汉语。
  revised_text: '（1）她已经怀孕六个月了。看哪！约瑟从做工的地方回来，进了屋，看见她怀了孕。他捶打自己的脸，伏在地上的麻布上，痛哭说：“我怎能面对主上帝？我还能为这个少女作什么祷告呢？我从主上帝的圣殿领她来时，她还是童女，我却没有保护好她。是谁给我设下了这个圈套？是谁在我家里做了这恶事？是谁玷污了这童女？亚当的遭遇岂不是在我身上重演了吗？因为亚当在祷告的时刻颂赞上帝时，那蛇来了，见夏娃独自一人，就欺骗了她；如今同样的事也临到我了！”


    （2）约瑟从麻布上起来，把她叫来，对她说：“上帝眷顾了你，你为什么做出这种事？你忘记了主你的上帝。为什么使自己蒙羞？你曾在至圣所里得到养育，又从天使手中领受食物！”


    （3）她痛哭说：“我是清白的，从来没有亲近过男人！”[a]


    约瑟对她说：“那么，你腹中这东西是从哪里来的？”[b]


    她说：“我指着永活的主——我的上帝起誓，我不知道这是从哪里来的！”[c]'
