  naturalness: 正文庄重流畅，适合现代标准汉语。将“这东西”置于约瑟质问的语境中，虽带有强烈、不敬的语气，却正好保留其震惊与指控，且在现代汉语中自然可懂。
  terminology: “主上帝”“至圣所”“童女”等宗教叙事术语使用一致。“亲近过男人”作为“认识男人”的委婉表达可保留，并以注释交代其语义。起誓公式宜保留其字面庄严性。
  issues:
  - severity: medium
    issue: “你腹中这个孩子”把“this thing in your womb”明确化为“孩子”。
    rationale: 所据英文见证刻意使用较含混而生硬的“this thing”；虽上下文可推知所指为胎儿，但正文不应提前消除这种措辞与语气。
  - severity: medium
    issue: 末句“我不知道他是从哪里来的”将中性代词具体化为“他”。
    rationale: 英文见证为“it”，且说话者声称不知道其来处。使用“它”较能保留指代的语法中性与叙事含混，避免额外赋予人格化指向。
