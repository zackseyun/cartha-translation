review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所给英文见证，并谨慎保留了“诸天”“有一个人”“我们”的含混性。但（44）“从天而降”比见证的“descended”多加了明确的起点；（45）“极其惊恐”将“greatly distressed”（亦可理解为深感忧虑、不安）收窄为恐惧；（46）“与我无关”弱化了“clean of the blood”的血责／清白习语。
  naturalness: 文字总体庄重、通顺，符合现代标准普通话。将（44）改为“有一个人降下来”，并将（45）改为“深感忧虑”，既自然也更贴近叙事的未定语气。
  terminology: “彼拉多”“百夫长”“上帝的儿子”“诸天”均可。“犹太民众”在此可指叙事中被设想会施行石刑的具体人群；保留说明性脚注有助于避免将其泛化。
  issues:
  - severity: medium
    issue: （44）“从天而降”增添了来源方向。
    rationale: 所给见证只说“a certain man descended”，虽紧接“诸天……打开”，但没有明说此人“从天”下来；译文应保留这种叙事上的未明。
  - severity: medium
    issue: （45）“极其惊恐”过度限定情绪。
    rationale: 英文见证为“greatly distressed”，更宽泛地表示深感忧虑、不安或困扰；不宜限定为恐惧。
  - severity: medium
    issue: （46）“这上帝儿子的血，与我无关”没有充分表达“clean of the blood”的清白／血责习语。
    rationale: 可用“我是清白的”保留原句的自我辩白及与血相关的责任语义，而不裁定该声明是否真实。
  revised_text: '（43）于是，那些人商定一同去把这些事报告给彼拉多。（44）他们还在商议这事的时候，又看见诸天打开，有一个人降下来，进了坟墓。（45）百夫长和跟他在一起的人看见这些事，就离开他们一直看守的坟墓，连夜赶到彼拉多那里。他们把所看见的一切都述说出来，深感忧虑，并说：“他真是上帝的儿子！”


    （46）彼拉多回答说：“对于上帝儿子的血，我是清白的；这事对我们是明明白白的。”[a]


    （47）于是，所有前来的人都恳求他，劝他下令，要百夫长和士兵对他们所看见的事不要说什么。（48）他们说：“我们宁可在上帝面前犯下大罪，也不愿落在犹太民众手中，被石头打死。”[b]（49）于是，彼拉多命令百夫长和士兵不要说什么。'
  revised_footnotes:
  - marker: a
    text: 直译近于：“我对于上帝儿子的血是清白的，这事对我们是显明的。”这是有关血责的习语；“我们”具体包括谁，所据见证并不明确。
    reason: 说明“对于……血，我是清白的”的血责习语，并保留复数代词的真实歧义。
  - marker: b
    text: 这里的“犹太民众”指叙事场景中他们所惧怕、可能用石头打死他们的人群，不应理解为对所有犹太人的概括。
    reason: 避免把古代叙事中的特定群体冲突泛化为民族性指控。
  revision_rationale: 修订仅处理三处可安全确定的忠实度问题：删除“从天而降”所增添的来源信息；以“深感忧虑”保留较宽的受扰／忧虑含义；以“对于……血，我是清白的”恢复血责习语。另将“报告彼拉多”调为更自然的“报告给彼拉多”，并以“不要说什么”贴近重复出现的“say nothing”，不改变段落含义。
