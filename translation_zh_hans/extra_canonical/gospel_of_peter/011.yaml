  english_witness: '(43) Then those men decided to go with each other and report these things to Pilate. (44) And while they were still considering, again the heavens were seen being opened, and a certain man descended and went into the grave. (45) Having seen these things, those with the centurion hurried by night to Pilate, having left the tomb they were watching, and described all that they saw, being greatly distressed, and saying, "Truly he was the Son of God!"


    (46) In response Pilate said, "I''m clean of the blood of the Son of God, and this is clear to us."


    (47) Then all who came were begging him, and encouraging him to command the centurion and the soldiers to say nothing about what they saw. (48) "It''s better for us," they said, "to be guilty of a great sin in front of God than to fall into the hands of the Jewish people and be stoned." (49) So Pilate commanded the centurion and the soldiers to say nothing.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/011.yaml
  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
translation:
  language: zh_hans
  text: '（43）于是，那些人商定一同去把这些事报告彼拉多。（44）他们还在商议的时候，只见诸天再次敞开，有一个人从天而降，进了坟墓。（45）百夫长和跟他在一起的人看见这些事，就离开他们一直看守的坟墓，连夜赶到彼拉多那里。他们极其惊恐，把所看见的一切都述说出来，并说：“他真是上帝的儿子！”


    （46）彼拉多回答说：“这上帝儿子的血，与我无关；这事我们都清楚。”[a]


    （47）于是，所有前来的人都恳求并劝彼拉多下令，要百夫长和士兵对他们所看见的事只字不提。（48）他们说：“我们宁可在上帝面前犯下大罪，也不愿落在犹太民众手中，被石头打死。”[b]（49）于是，彼拉多命令百夫长和士兵不要说出去。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于：“我对于上帝儿子的血是清白的，这对我们是显明的。”“我们”具体包括谁，原文所据见证并不明确。
    reason: 说明血责习语，并保留复数代词的真实歧义。
  - marker: b
    text: 这里的“犹太民众”指叙事场景中他们所惧怕、可能用石头打死他们的人群，不应理解为对所有犹太人的概括。
    reason: 避免把古代叙事中的特定群体冲突泛化为民族性指控。
lexical_decisions:
- source_word: the heavens
  choice: 诸天
  rationale: 保留古代宗教叙事中复数形式的色彩，同时让现代读者能够理解。
- source_word: a certain man
  choice: 有一个人
  rationale: 保留人物身份未明的叙事含混，不擅自认定其为天使或其他特定人物。
- source_word: went into the grave
  choice: 进了坟墓
  rationale: 采用自然现代汉语，并保留动作本身，不增添关于目的或身份的解释。
- source_word: clean of the blood
  choice: 这……的血，与我无关
  rationale: 以现代汉语表达无流血罪责之意，避免直译“洁净”造成生硬或仪式洁净的误解。
- source_word: the Jewish people
  choice: 犹太民众
  rationale: 在该场景中指可能施行石刑的群体；用“民众”避免把叙事中的威胁不加区分地泛化到历代所有犹太人。
theological_decisions:
- issue: “上帝的儿子”的身份宣告
  choice: 他真是上帝的儿子
  alternative: 他真是神的儿子
  rationale: 忠实保留明确的称号和宣告力度，不对其基督论含义另作解释；全篇采用“上帝”作为自然、庄重的现代译法。
- issue: 彼拉多关于血责的声明
  choice: 这上帝儿子的血，与我无关
  alternative: 我是清白的，没有沾上帝儿子的血
  rationale: 表达无罪责的习语意义，同时不替叙事裁定彼拉多的声明是否真实或正当。
- issue: “这事我们都清楚”中的复数指向
  choice: 这事我们都清楚
  alternative: 这对我们是显明的
  rationale: 保留“我们”的不明确指代，不擅自改成“你们”或只指彼拉多本人。
translation_notes:
  register: 采用庄重而自然的现代标准普通话，保留段落编号及叙事的古代宗教色彩。鉴于所提供材料注明希腊语原文复核尚待进行，本稿以给定公共领域英文见证为暂定依据；未对英文见证之外的希腊词形、句法或异文作无证据断定。
