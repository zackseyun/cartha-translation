base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/010.yaml
  text: '(38) When the soldiers saw this, they woke the centurion and the elders, because they too were there keeping watch. (39) While the soldiers were explaining to them what they had seen, they again saw three men coming out of the tomb. Two of them were supporting the third, and a cross was following them. (40) The heads of the two reached as high as heaven, but the head of the one they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens saying, “Have you proclaimed to those who sleep?”


    (42) A reply was heard from the cross: “Yes!”'
translation:
  language: zh_hans
  text: '(38) 那些士兵看见这一幕，就叫醒了百夫长和长老，因为他们也在那里守卫。(39) 士兵正在向他们讲述所看见的事时，他们又看见三个人从坟墓里出来，其中两人扶着另一人，还有一个十字架跟在他们后面。(40) 那两人的头高达天上，而被他们带着的那一位，他的头却越过诸天。


    (41) 他们听见有声音从诸天传来，说：“你向那些沉睡的人宣告了吗？”[a]


    (42) 又听见有声音从十字架传来，回答说：“是的！”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉睡的人”可能指死者；原文没有说明所宣告的具体内容。
    reason: 提示隐喻及信息内容的开放性，同时不在正文中消解歧义。
  - marker: b
    text: 按现存见证文本的叙述，这个回答是从十字架传来的。
    reason: 说明这一不寻常意象属于文本本身，并非译文误置说话者。
lexical_decisions:
- source_word: centurion
  choice: 百夫长
  rationale: 采用现代中文圣经及古代罗马军事语境中通行、准确的称谓。
- source_word: keeping guard
  choice: 守卫
  rationale: 简洁表达持续看守坟墓的行动，不额外补入目的或对象。
- source_word: supporting / being led
  choice: 扶着 / 被他们带着
  rationale: 保留两种表述之间的细微差别：前者着重搀扶，后者可兼有引领之意。
- source_word: heaven / the heavens
  choice: 天上 / 诸天
  rationale: 依据所给见证文本，保留单数与复数的对比，不将二者合并。
- source_word: those who sleep
  choice: 那些沉睡的人
  rationale: 保留睡眠与死亡之间可能存在的隐喻张力，不直接释为“死人”。
- source_word: proclaimed
  choice: 宣告
  rationale: 保留动词内容未明的开放性，不擅自补成“传福音”或指定所宣告的信息。
theological_decisions:
- issue: 向“沉睡的人”宣告的内容与对象
  choice: 直译为“你向那些沉睡的人宣告了吗？”
  alternative: “你向死人传福音了吗？”
  rationale: 原文所给证据未明说宣告内容；“沉睡的人”也具有刻意的隐喻性，因此不作教义化补足。
- issue: 十字架发声
  choice: 按叙事表层保留十字架作回应来源
  alternative: 将回应归于从墓中出来的人
  rationale: 见证文本明确说回应从十字架传来；即使意象奇特，也不应以解释性改写消除。
- issue: 人物身量的超自然描写
  choice: 保留“高达天上”与“越过诸天”
  alternative: 弱化为“极其高大”
  rationale: 原叙事的宇宙尺度意象具有文本和神学张力，不能抽象化或合理化。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。分节与叙事推进依照所给见证文本；避免古奥措辞，也不对奇异意象作合理化处理。由于希腊语源文审查尚待完成，本稿属于依据所提供公版英文见证形成的暂定译稿。
