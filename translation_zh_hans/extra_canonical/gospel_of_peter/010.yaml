review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了叙事中的异常意象、天／诸天的区分，以及从十字架传来回应这一见证文本的表层表达。第42节“又听见有声音”虽可由上下文理解，却把原文所强调的“回应”弱化为泛指的另一声音；宜明确为“一个回应”，并直接标出其来源。第41节“宣告”在现代汉语中通常需要说明所宣告的内容，单独使用略显悬置；改为“向……宣讲”可保留原文未说明内容的开放性。
  naturalness: 第39节改用“说明自己所看见的事”和“两人扶着第三人”，可减少“他们”连续指代造成的短暂歧义。第40节用“牵引”对应被两人带领的动作，较“带着”准确自然。
  terminology: “百夫长”“长老们”“十字架”“诸天”均适切。“那些沉睡的人”可保留其与死亡相关但未明说的隐喻；“向……宣讲”避免将内容具体化为任何特定教义信息。
  issues:
  - severity: medium
    issue: 第42节将“a response was heard from the cross”译作“又听见有声音从十字架传来，回答说”。
    rationale: “又”额外突出再次听见，而“有声音”未明确该声音是对前一问题的回应。改作“从十字架传来一个回应”更完整对应见证文本，且不改变奇异意象。
  - severity: low
    issue: 第41节“你向那些沉睡的人宣告了吗？”在现代汉语中搭配略不自然。
    rationale: “宣告”通常带具体内容；“向那些沉睡的人宣讲过吗？”既自然，也不补出所宣讲的信息。
  - severity: low
    issue: 第39—40节对第三人的动作关系可更精确。
    rationale: “两人扶着第三人”与“被他们牵引的那一位”能分别呈现支持和由两人引领的表达。
  revised_text: '(38) 那些士兵看见这情形，就叫醒了百夫长和长老们，因为他们也在那里看守。(39) 正当士兵向他们说明自己所看见的事时，他们又看见三个人从坟墓里出来：两人扶着第三人，一个十字架跟在他们后面。(40) 那两人的头直达天上，而被他们牵引的那一位的头却越过诸天。


    (41) 他们听见有声音从诸天传来，说：“你曾向那些沉睡的人宣讲过吗？”[a]


    (42) 又听见从十字架传来一个回应：“是的！”[b]'
  revised_footnotes:
  - marker: a
    text: “沉睡的人”可能指死者；原文没有说明所宣讲的具体内容。
    reason: 提示隐喻及信息内容的开放性，同时不在正文中消解歧义。
  - marker: b
    text: 按现存见证文本的叙述，这个回应是从十字架传来的。
    reason: 说明这一不寻常意象属于文本本身，并非译文误置说话者。
  revision_rationale: 修订限于提升与见证文本的逐项对应及现代汉语的清晰度：第42节恢复“回应”的语义重心；第41节以自然的无宾语内容补足式问法保留所宣讲内容未明的特点；第39—40节澄清人物指代及动作关系。未改变叙事的超自然尺度、十字架发声意象，或任何神学上的开放性。
