    (13) But one of those wrongdoers rebuked them, saying, "We, because of the wrong that we did, are suffering this way, but this one, having become Savior of humanity, what wrong has he done to you?"


    (14) And they were angry at him. They commanded that the legs not be broken, so that he might die tortured.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/004.yaml
  text: '(10) They brought two wrongdoers and crucified the Lord between them, but he remained silent, as though he felt no pain. (11) When they raised the cross, they wrote, "This is the king of Israel." (12) They laid his clothes in front of him, divided them, and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We are suffering like this because of the wrong we did, but this one, who became the Savior of humanity—what wrong has he done to you?"


    (14) They became angry with him. They commanded that the legs not be broken, so that he might die under torture.'
translation:
  language: zh_hans
  text: '《彼得福音》——主被钉十字架


    (10) 他们带来两个作恶的人，把他们和主一同钉上十字架，主在他们中间。他却默不作声，仿佛感觉不到疼痛。(11) 他们竖起十字架时，在上面写着：“这是以色列的王。”(12) 他们把他的衣服放在他面前，分了，又为衣服抽签。


    (13) 那两个作恶的人中，有一个斥责他们说：“我们这样受苦，是因为我们做了恶；但这一位成了人类的救主，他对你们做了什么恶呢？”


    (14) 他们就向他发怒，并吩咐不要打断腿[a]，好让他受尽折磨而死。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里没有明说是谁的腿不可打断；紧接上文，可能指斥责他们的那个作恶之人，但也有人可能理解为别的对象。译文保留这种不确定性。
    reason: 保存代词及省略宾语造成的真实指代歧义。
lexical_decisions:
- source_word: wrongdoers
  choice: 作恶的人
  rationale: 既表达行为上的罪责，又避免用现代法律色彩较强的“罪犯”过度限定其身份。
- source_word: the Lord
  choice: 主
  rationale: 保留见证文本的尊称及其叙事中的基督论分量。
- source_word: as if having no pain
  choice: 仿佛感觉不到疼痛
  rationale: 保留“仿佛”的比较和表象意味，不把文本潜在的基督论张力解释成确定的无痛状态。
- source_word: king of Israel
  choice: 以色列的王
  rationale: 采用自然且贴近原有称号结构的中文表达。
- source_word: having become Savior of humanity
  choice: 成了人类的救主
  rationale: 保留“成为”的动态表达和“全人类”的广泛所指，不改写为宗派化的救赎公式。
- source_word: die tortured
  choice: 受尽折磨而死
  rationale: 自然表达延长痛苦直至死亡的目的，同时保留原句的残酷意味。
theological_decisions:
- issue: 耶稣沉默且“仿佛感觉不到疼痛”所含的基督论张力
  choice: 仿佛感觉不到疼痛
  alternative: 毫无痛苦／并不觉得痛
  rationale: 比较语气不能被抹去；译文不裁定这只是外在观感，还是关于耶稣受苦方式的神学陈述。
- issue: “不要打断腿”所指对象
  choice: 不用宾语的“不要打断腿”，并以脚注说明
  alternative: 不要打断那个作恶之人的腿／不要打断主的腿
  rationale: 所据见证中的指代并不完全明确，正文保持中文可容纳的歧义，不擅自确定对象。
- issue: “他”受折磨而死的指代
  choice: 保留“他”
  alternative: 让那个作恶的人受尽折磨而死
  rationale: 延续见证文本的代词形式，不以解释替代翻译。
