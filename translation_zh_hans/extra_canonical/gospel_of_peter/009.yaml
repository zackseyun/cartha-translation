    text: 本段暂据所提供的公版英文见证译出；希腊文原文复核尚待完成。第37节说石头自行滚到一旁，“只让开一部分”，保留了见证中这一不寻常的细节。
    reason: 资料明确说明直接源语言审查尚未完成，因此需向读者透明标示文本依据及关键措辞的不确定性。
  revision_rationale: 仅作安全且必要的措辞修订：更正第37节石头动作的中文施事关系，并使第34节的“sealed”表达更自然。未改变叙事意义、人物身份、天上声音的来源，或“安息日／主日”的区分。
