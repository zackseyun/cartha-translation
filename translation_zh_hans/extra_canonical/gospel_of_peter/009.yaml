review_pass:
  verdict: revise
  source_fidelity: 第37节“那块石头……挪开了一部分”在中文中误使石头成为挪动其他事物的施事者，未能准确表达其自行滚动、只部分让开的动作。其余内容与所提供的英文见证及英文POB审计文本基本相符；“主日”“诸天”“两个人／两个年轻人”均适当保留了文本的称谓与歧义。
  naturalness: 整体庄重、清楚，适合现代标准汉语。“已经封好的坟墓”可微调为“已经封住的坟墓”，更贴合封墓的动作。“滚到一旁，只让开一部分”自然且清楚地保留了不寻常的“部分让开”细节。
  terminology: “安息日”“主日”“诸天”“坟墓”使用一致且得当；未把两人释作天使，也未判定天上声音的来源。第36节的“周身发出强烈的光辉”可保留，忠实表达其带有大量光辉的状态。
  issues:
  - severity: medium
    issue: 第37节“挪开了一部分”的施事与动作关系不自然且不准确。
    rationale: “挪开”通常需要施事者挪动某物；此处叙事所说的是石头自行滚开、仅部分移开／让开。改为“滚到一旁，只让开一部分”既避免语法歧义，也保留英文见证及审计文本强调的部分移开细节。
  - severity: low
    issue: 第34节“已经封好的坟墓”略显口语且弱化封住入口的动作感。
    rationale: “已经封住的坟墓”在现代庄重叙事中更自然，并更直接对应“had been sealed”。
  revised_text: （34）安息日清晨破晓时，有一群人从耶路撒冷和周围乡间前来，要看看那座已经封住的坟墓。（35）但在主日尚未破晓的夜里，士兵两人一组守卫的时候，天上响起了一个洪亮的声音。（36）他们看见诸天敞开，有两个人从那里下来，周身发出强烈的光辉，走近坟墓。（37）那块安放在墓门口的石头自行滚开，滚到一旁，只让开一部分。坟墓开了，两个年轻人都走了进去。[a]
  revised_footnotes:
