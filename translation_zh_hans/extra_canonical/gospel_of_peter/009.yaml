base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/009.yaml
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
translation:
  language: zh_hans
  text: （34）安息日的清晨破晓时，有一群人从耶路撒冷和周围乡间前来，要看看那座已经封好的坟墓。（35）但在主日尚未破晓的夜里，士兵两人一组守卫的时候，天上响起了一个洪亮的声音。（36）他们看见诸天敞开，有两个人从那里下来，周身发出强烈的光辉，走近坟墓。（37）那块安放在墓门口的石头自行滚开，挪开了一部分。坟墓开了，两个年轻人都走了进去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英文见证译出；希腊文原文复核尚待完成。第37节所说石头“挪开了一部分”，保留了见证中“只让开一部分”的细节。
    reason: 资料明确说明直接源语言审查尚未完成，因此需向读者透明标示文本依据及关键措辞的不确定性。
lexical_decisions:
- source_word: Sabbath
  choice: 安息日
  rationale: 采用现代中文读者熟悉且准确的犹太历法用语，并保留与随后“主日”的区别。
- source_word: grave / tomb
  choice: 坟墓
  rationale: 上下文指封闭并有入口石的墓穴；“坟墓”自然通顺，也避免在同一短段中无必要地变换称谓。
- source_word: Lord's day
  choice: 主日
  rationale: 保留早期基督教文本中与安息日有别的日名，不扩写为“星期日”，以免消除原文的宗教称谓。
- source_word: great voice
  choice: 洪亮的声音
  rationale: “great”在此修饰声音，译为“洪亮”符合自然汉语；不擅自判定说话者或声音内容。
- source_word: heavens
  choice: 诸天
  rationale: 见证译文使用复数“heavens”；用“诸天”保留其形式和超越性意象。
- source_word: two men / both young men
  choice: 两个人／两个年轻人
  rationale: 依照所给见证保留第36节与第37节称谓的变化，不将他们解释为天使。
- source_word: having much radiance
  choice: 周身发出强烈的光辉
  rationale: 以自然中文表达人物带有大量光辉的状态，同时不加入“衣服”“面貌”等原文未明说的细节。
- source_word: made way in part
  choice: 挪开了一部分
  rationale: 保留石头只部分移开的不寻常细节，不顺译成完全滚到一旁。
theological_decisions:
- issue: 从天而降的两人之身份
  choice: 译作“两个人”，随后译作“两个年轻人”
  alternative: 译作“两个天使”
  rationale: 见证文本没有明确称他们为天使；保留叙事称谓及其可能的神秘性，避免神学性补充。
- issue: 天上声音的来源
  choice: 不说明发声者
  alternative: 译成“上帝的声音”或“主的声音”
  rationale: 文本只说天上有一个洪亮的声音，并未指明来源；译文保留这一开放性。
- issue: “主日”的所指
  choice: 保留专称“主日”
  alternative: 明确译为“星期日”或“复活日”
  rationale: “主日”既忠实于见证的宗教称谓，也不超出本文直接陈述去解释其历法或礼仪含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留段落编号、安息日与主日的对照、诸天开启的异象语言，以及“两个人／两个年轻人”的称谓变化。鉴于希腊文复核尚待完成，本稿不声称是直接由原文定本译成。
