review_pass:
  verdict: revise
  source_fidelity: 在所提供的英文见证及英文POB桥接译文范围内，译文总体忠实地保留了安息日与主日的区分、未指明天上声音及两位来者的身份，并保留石头只部分让开的不寻常细节。第37节“挪开了一部分”语义上略含混，可能被理解为石头本身的一部分被挪开，而非石头只部分移开并让出通路，宜明确处理。希腊文直接复核尚待完成，不能对超出该见证的细节作定论。
  naturalness: 整体为自然、庄重的现代书面汉语。第37节“自行滚开，挪开了一部分”连用略显生硬，且后一分句缺少明确的语义落点；改为“自行滚开，只让出一部分通路”更通顺，也更准确地表达英文见证的“made way in part”。第36节“周身发出强烈的光辉”可理解，但“身上带着强烈的光辉”更贴近“having much radiance”，不额外强调主动发光。
  terminology: “安息日”“主日”“诸天”“坟墓”及“两个人／两个年轻人”的处理恰当。“主日”不应擅自释为星期日；两人也不应补译为天使。保留“坟墓”作为本段统一称谓可接受。
  issues:
  - severity: medium
    issue: 第37节“挪开了一部分”指向不清。
    rationale: 英文见证及英文POB所强调的是石头自行滚开、只部分让出通路；现有中文可能被读成石头的一部分被挪走，或石头完全滚开后又“挪开一部分”。应以“只让出一部分通路”明确保留该细节。
  - severity: low
    issue: 第36节“周身发出强烈的光辉”略强化为主动发光。
    rationale: 见证仅称两人“having much radiance”。改为“身上带着强烈的光辉”可保留其带有光辉的状态，避免不必要的动态强化。
  revised_text: （34）安息日的清晨破晓时，有一群人从耶路撒冷和周围乡间前来，要看看那座已经封好的坟墓。（35）但在主日尚未破晓的夜里，士兵两人一组守卫的时候，天上响起了一个洪亮的声音。（36）他们看见诸天敞开，有两个人从那里下来，身上带着强烈的光辉，走近坟墓。（37）那块安放在墓门口的石头自行滚开，只让出一部分通路。坟墓开了，两个年轻人都走了进去。[a]
  revised_footnotes:
