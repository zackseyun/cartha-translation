review_pass:
  verdict: revise
  source_fidelity: 第21节和第23节的基本叙事与英文见证相符，第23节的代词歧义也应保留。不过第22节的“重新”“才”均超出见证的明示内容；第24节将“the Lord”改作“主的遗体”并把洗涤译为“洗净”，略增添了原文未明说的含义。
  naturalness: 原译整体庄重通顺，但“太阳重新照耀，才发现已是”带有较强的补叙和推断色彩。改为“太阳照耀起来，当时已是第九时辰”更自然，也更贴近见证。
  terminology: “主”“约瑟”“细麻布”“第九时辰”均适切。“坟墓”可在本段保留；“约瑟园”按见证作为名称处理。
  issues:
  - severity: medium
    issue: 第22节“重新”“才发现”增加了见证未明说的时间/状态含义。
    rationale: 英文见证只说太阳照耀，且“it was found to be the ninth hour”；并未说太阳是“重新”照耀，也未表达“才”发现的迟延或意外。
  - severity: low
    issue: 第24节“主的遗体”及“洗净”略带解释性。
    rationale: 见证作“having taken the Lord, he washed him”。在中文安葬语境中“遗体”可理解，但这里保留“主”及中性的“洗了他”更能对应措辞，避免将洗涤具体化为“洗净”。
  - severity: low
    issue: 第24节“那地方称为”可更明确地回指“坟墓”。
    rationale: 见证的关系从句直接修饰“自己的坟墓”；译为“这坟墓名为”可避免“地方”扩大所指。
