base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/006.yaml
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
translation:
  language: zh_hans
  text: '（21）随后，他们从主的双手中拔出钉子，把他放在地上。全地都震动了，众人大为恐惧。


    （22）这时，太阳重新照耀，才发现已是第九时辰[a]。（23）犹太人很高兴，把他的遗体交给约瑟安葬，因为他曾看见他所行的一切善事[b]。（24）约瑟接过主的遗体，为他洗净，用细麻布裹好，送进自己的坟墓；那地方称为“约瑟园”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第九时辰”按当时从日出计时的方式，约为下午三点。
    reason: 帮助现代读者理解古代时间表达。
  - marker: b
    text: 本节“他曾看见他所行”的两个“他”所指并不明确，也可理解为“约瑟曾看见主所行”。现据现有英文见证保留这种含混；尚待希腊文原文复核。
    reason: 保存底本见证的真实歧义，并说明当前文本基础的限制。
lexical_decisions:
- source_word: the ninth hour
  choice: 第九时辰
  rationale: 保留古代计时表达，并以脚注说明约相当于现代下午三点。
- source_word: his body
  choice: 他的遗体
  rationale: 在安葬语境中用“遗体”比直译“身体”更自然庄重，同时保留代词所指。
- source_word: linen
  choice: 细麻布
  rationale: 采用常见的古代殓葬织物译法，不额外添加裹尸布等解释。
- source_word: Joseph's Garden
  choice: 约瑟园
  rationale: 作为地点名称简洁处理，并保留原文名称的所有格关系。
theological_decisions:
- issue: 第23节代词所指含混
  choice: 保留“因为他曾看见他所行的一切善事”
  alternative: 明确译为“因为约瑟曾看见主所行的一切善事”
  rationale: 现有英文见证中的两个代词存在形式上的歧义；在尚未完成希腊文校核前，不在正文中擅自确定所指，并用脚注提示。
- issue: 太阳再次出现的含义
  choice: 译为“太阳重新照耀”
  alternative: “太阳发光”
  rationale: “重新”自然承接此前可能的黑暗叙事，但不把未见于本段的神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。正文依据公版英文见证拟定；阿赫米姆抄本的希腊文原文复核尚未完成，因此对第23节代词不作超出证据的消歧。
