review_pass:
  verdict: revise
  source_fidelity: 第21节“众人大为恐惧”把原文无主语的“great fear came”明确为“众人”，属无依据增补。第22节“重新”和“才”均非英文见证所载，前者尤其预设了前文黑暗后的恢复。第24节将“坟墓”泛称为“那地方”，略弱化了原文对墓穴的明确指称。其余叙事次序、安葬动作及第23节的代词含混基本得到保留。
  naturalness: 原译整体庄重通顺。修订后以“极大的恐惧临到”“人们发现已是”表达无主语的叙事效果，并使第24节的指称更连贯自然。
  terminology: “主”“第九时辰”“细麻布”“约瑟园”均合适。“遗体”在安葬语境中自然，但原文只说“身体”；为避免在第23节额外改变代词指向，修订保留“他的遗体”。
  issues:
  - severity: medium
    issue: 第21节“众人大为恐惧”增加了恐惧者。
    rationale: 英文见证仅说“great fear came”，未指定是众人恐惧；应保留无明确施事者的表达。
  - severity: medium
    issue: 第22节“太阳重新照耀，才发现”含有“重新”“才”的额外语义。
    rationale: 英文见证为“the sun shone, and it was found to be the ninth hour”，并未出现“重新”或表示迟至此时的“才”。
  - severity: low
    issue: 第24节“那地方称为”将“tomb”泛化为“地方”。
    rationale: 原文明确说约瑟自己的坟墓被称为“约瑟园”；正文应保留“坟墓”的指称。
