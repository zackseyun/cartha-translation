review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实于所提供的英文见证，保留了“主日”“怒火中烧”“哀哭悲悼”及未具体说明的丧葬职责。不过，“her friends”译为“女伴”无英文见证依据；（51）“安放他的墓那里”不合汉语语法；（54）将“if we aren’t able”补足为“即使不能进去”会把原文保留的省略具体化，宜恢复其含混性。
  naturalness: 整体庄重通顺，但（51）的地点短语明显不自然。“在主的墓前为主做……”稍显重复，改为“在安葬主的坟墓那里，做……的事”更符合现代汉语，且不改变意义。
  terminology: “主日”“抹大拉的马利亚”“钉十字架”“哀哭悲悼”均合乎常见庄重基督教语体。“尽我们的本分”可保留其不具体指明礼仪内容的优点。“朋友们”应替代带有未经证实性别限定的“女伴”。
  issues:
  - severity: medium
    issue: “女伴”给 her friends 加入女性限定。
    rationale: 所提供英文见证仅称“her friends”，虽叙事语境可能涉及妇女，但现有审校依据不足以在译文中固定其性别。
  - severity: high
    issue: （51）“来到安放他的墓那里”语法不成立。
    rationale: 应改为“来到安放他遗体的坟墓那里”或同等自然表达，以清楚表达“the grave where he was laid”。
  - severity: medium
    issue: （54）“即使不能进去”过度补足省略。
    rationale: 英文见证只说“if we aren’t able”，其所指可由上下文关联移石，未明确限定为不能进入；译文不应缩窄其指向。
  revised_text: '（50）主日清晨，主的门徒抹大拉的马利亚因害怕那些犹太人——他们怒火中烧——还没有在安葬主的坟墓那里，做妇女通常为自己死去的亲人所做的事。


    （51）她带着朋友们，来到安放他遗体的坟墓那里。（52）她们怕被那些犹太人看见，就说：“他被钉十字架的那一天，我们没能哀哭悲悼；也许现在还能在他的墓前这样做。（53）可是，谁来替我们滚开放在墓入口处的石头，好让我们进去，坐在他身旁，尽我们的本分呢？（54）因为石头很大，而且我们怕被人看见。如果办不到，至少让我们把为纪念他而带来的东西放在入口处；我们要哀哭悲悼，直到回家。”[a]'
