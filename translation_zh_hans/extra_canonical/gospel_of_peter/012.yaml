review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实于所提供的英文见证，保留了“主日”“那些犹太人”、妇女惯常的丧葬举动及哀哭、悲悼的重复。惟（54）“即使不能进去”把原见证中未明说的条件具体限定为“不能进去”；该条件在语境中与移开石头相关，但不宜在暂未直核希腊文时如此收窄。
  naturalness: （51）“来到安放他的墓那里”不合现代汉语。其余叙事和引语基本自然庄重；“来到安放他的墓前”更顺畅准确。
  terminology: “主日”“抹大拉的马利亚”“哀哭悲悼”“墓”均恰当。“女伴”可保留：所供英文为 friends，且现有起草说明已谨慎交代其解释性；在本段妇女同行的语境中自然。
  issues:
  - severity: medium
    issue: （51）“来到安放他的墓那里”句法不自然。
    rationale: “安放他的墓”易被理解为安放墓本身，且“那里”与前面的介词结构重复。应明确为“来到安放他的墓前”。
  - severity: medium
    issue: （54）“即使不能进去”过度限定条件。
    rationale: 英文见证仅说“If we aren’t able”，紧承移开石头的讨论，但并未直接说“不能进去”。译为“即使办不到”可保留省略和语境关联，避免补入行动目标。
  - severity: low
    issue: （50）“为主做”略显口语性且关系可更清楚。
    rationale: 改为“为所爱之逝者所做的事”可对应 women / their loved ones who have died，并自然说明她在主墓前本欲履行的行动。
