base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/012.yaml
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not done at the Lord’s grave what women customarily do for their loved ones who have died, because she was afraid of the Jews, since they were inflamed with anger.


    (51) Taking her friends with her, she went to the grave where he had been laid. (52) They were afraid that the Jews might see them, and they said, “If we were not able to weep and mourn on the day he was crucified, perhaps even now we might do this at his grave. (53) But who will roll away for us the stone placed at the entrance to the grave, so that we may go in, sit beside him, and perform our duties? (54) For the stone is large, and we are afraid that someone may see us. And if we are not able, let us at least place at the entrance what we are bringing in memory of him, and we will weep and mourn until we return to our house.”'
translation:
  language: zh_hans
  text: '（50）主日黎明时，主的门徒抹大拉的马利亚，因为害怕那些犹太人——他们怒火中烧——还没有在主的墓前为主做妇女通常为死去的亲人所做的事。


    （51）她带着女伴，来到安放他的墓那里。（52）她们怕被那些犹太人看见，就说：“他被钉十字架的那一天，我们没能哀哭悲悼；也许现在还能在他的墓前这样做。（53）可是，谁来替我们滚开墓门口的石头，好让我们进去，坐在他身旁，尽我们的本分呢？（54）那石头很大，而且我们怕被人看见。即使不能进去，也让我们至少把为纪念他而带来的东西放在墓门口；我们要哀哭悲悼，直到回家。”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂依据所提供的公版英文见证译出；阿赫米姆抄本的希腊文尚待直接复核，因此个别措辞和句法关系可能需要修订。
    reason: 来源资料明确说明古代原文审校尚未完成，出版草案应向读者透明披露这一限制。
lexical_decisions:
- source_word: the Lord’s day
  choice: 主日
  rationale: 沿用早期基督教语境中自然、凝练的称呼；此处不擅自具体化为其他历法表述。
- source_word: the Jews
  choice: 那些犹太人
  rationale: 保留见证文本所指群体，同时用“那些”提示这是叙事中的特定敌对者，并非对所有犹太人的概括。
- source_word: her friends
  choice: 女伴
  rationale: 上下文说的是前去履行妇女丧葬习俗的人；“女伴”自然表达同行的女性朋友，但底本证据仍属间接。
- source_word: do our duties
  choice: 尽我们的本分
  rationale: 保留丧葬或悼念义务的宽泛含义，不擅自指定膏抹、献祭等具体行动。
- source_word: weep and mourn
  choice: 哀哭悲悼
  rationale: 以两个并列动词保留原文重复加强的哀悼意味。
- source_word: grave
  choice: 墓
  rationale: 用现代汉语中庄重且通行的词，并统一全文用语。
theological_decisions:
- issue: “犹太人”的指涉范围
  choice: 译作“那些犹太人”，理解为叙事中的特定敌对群体
  alternative: 直译为无任何限定的“犹太人”
  rationale: 既忠实保留文本措辞，也避免把其中的愤怒归于整个民族或宗教群体。
- issue: 妇女原本要履行的事项
  choice: 保留为“妇女通常……所做的事”及“尽我们的本分”
  alternative: 具体译成“膏抹尸体”或某种特定礼仪
  rationale: 现有英文见证并未明确具体行为，不应以其他福音传统填补此处。
- issue: “主日”的时间含义
  choice: 保留“主日”
  alternative: 解释性译作“星期日”或“七日的第一日”
  rationale: 保留早期基督教称谓及其神学色彩，不在缺少希腊文复核时消解其表达。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留段号及叙事中的重复和紧张感；引语自然化但不过度口语化。由于尚未直接核对希腊文，此稿避免对“朋友”“本分”及句法因果关系作过度具体的解释。
