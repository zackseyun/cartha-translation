base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/001.yaml
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
translation:
  language: zh_hans
  text: （1）可是，犹太人中没有一个人洗手；希律和他的审判官也都没有洗。他们既不肯洗，彼拉多就起身了。（2）随后，希律王下令把主带来，对他们说：“凡我吩咐你们对他做的，都去做吧。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文暂据所提供的公版英文见证译出；希腊文原文复核尚待完成。
    reason: 资料明确说明直接源语言审查尚未进行，因此须向读者标示本稿的暂定性质。
lexical_decisions:
- source_word: washed the hands
  choice: 洗手
  rationale: 保留见证文本中的具体动作及其可能具有的象征意义，不增译为“洗手表示无辜”。
- source_word: judges
  choice: 审判官
  rationale: 比现代司法语境中的“法官”略宽，适合古代审判场景，也保留其职能含义。
- source_word: the Lord
  choice: 主
  rationale: 对应见证文本的尊称，不改译为人名，也不额外解释其神学含义。
- source_word: stood up
  choice: 起身了
  rationale: 按见证文本直译其动作，不推断彼拉多是离席、退庭或退出审判。
- source_word: brought
  choice: 带来
  rationale: 保持中性，不加入“押来”所暗示的强制方式，也不添加见证文本未明确表达的“带到他面前”。
theological_decisions:
- issue: 洗手动作的责任与无辜象征
  choice: 仅叙述谁洗手或不肯洗手
  alternative: 明说他们拒绝宣告自己无辜，或解释为承担流血责任
  rationale: 文本只记载动作及拒绝动作；其象征意义应由读者从叙事中理解，不宜在正文中替作者定论。
- issue: “主”的身份称谓
  choice: 保留“主”
  alternative: 改为“耶稣”或“主耶稣”
  rationale: 见证文本在此使用尊称“the Lord”；保留该称谓可维持叙述者的神学视角，同时不增添原句未出现的人名。
- issue: 第二节“他们”的所指
  choice: 保留代词“他们”
  alternative: 明确为士兵、犹太人或审判官
  rationale: 现有见证文本没有明确界定受命者，中文也保留这一指代空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是”“随后”清楚呈现叙事转折与推进；句式尽量贴近见证文本，同时避免生硬欧化。第一节将重复的否定关系展开为自然汉语，但不改变希律及其审判官均未洗手的陈述。第二节不采用英文POB中补出的“带到他面前”，以免加入现有见证文本未明说的方位信息。
