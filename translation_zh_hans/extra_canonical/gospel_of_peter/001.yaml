review_pass:
  verdict: revise
  source_fidelity: 第一节忠实保留了犹太人、希律及其审判官均未洗手，以及他们不愿洗手后彼拉多起身的叙述；“起身”没有被过度解释。第二节的“带来”和“主”也与所给英文见证相符。惟“凡我吩咐你们对他做的，都去做吧”虽可理解，却因“做”重复而略显生硬；改为“我吩咐你们怎样对待他，你们就怎样做”更清楚地对应命令内容，且不指定受命者身份。
  naturalness: 整体庄重通顺。“犹太人中没有一个人”可简化为更自然的“犹太人中却没有一人”。第二节宜避免连续使用“做”，以符合现代标准汉语表达。
  terminology: “洗手”“审判官”“主”“彼拉多”“希律”均恰当；“审判官”不强加现代司法制度含义。“主”保留见证文本的称谓，未擅自改为人名。
  issues:
  - severity: low
    issue: 第二节“凡我吩咐你们对他做的，都去做吧”用词重复，句法略拗口。
    rationale: 英文见证所表达的是执行先前关于“他”的命令；中文可用“怎样对待他，你们就怎样做”自然表达，不增加具体行动或对象身份。
  - severity: low
    issue: “犹太人中没有一个人”稍显冗长。
    rationale: “犹太人中却没有一人”在现代汉语中更凝练，否定范围不变。
  revised_text: （1）可是，犹太人中却没有一人洗手；希律和他的审判官也都没有洗。他们既不肯洗，彼拉多就起身了。（2）随后，希律王下令把主带来，对他们说：“我吩咐你们怎样对待他，你们就怎样做。”[a]
  revised_footnotes:
