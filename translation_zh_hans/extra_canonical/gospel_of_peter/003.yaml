  naturalness: 译文总体庄重、清楚。将“他们除酵节第一日”调整为“他们的除酵节第一日”，并将“给他穿上紫袍”调整为“给他披上紫色袍子”，可使现代书面中文更顺畅，同时不增加原文没有的细节。
  terminology: “除酵节”“主”“审判座”“荆棘冠冕”“上帝的儿子”均合适。“紫色袍子”对应紫色衣袍而不把服装类别过度限定；“尊荣／尊崇”的刻意呼应保留了嘲讽性。
  issues:
  - severity: medium
    issue: 第9节“用芦苇刺他”的动作强度过于确定。
