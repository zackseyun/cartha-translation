  text: 'And he handed him over to the people before the first day of their festival of the Unleavened Bread. (6) And those having taken the Lord were running, pushing him, and saying, “Let’s drag the Son of God, having authority over him!”


    (7) And they were clothing him with purple, and sat him on the seat of judgment, saying, “Judge justly, king of Israel!” (8) And one of them brought a thorn crown and placed it on the Lord’s head.


    (9) And other bystanders were spitting in his face, and others slapped his cheeks. Others were piercing him with a reed, and some were scourging him, saying, “With this honor, let’s honor the Son of God!”'
translation:
  language: zh_hans
  text: '他在他们除酵节第一日之前，把他交给了百姓。[a]


    （6）他们抓住主，一边推搡着他奔跑，一边说：“我们既然有权处置他，就来拖走上帝的儿子吧！”[b]


    （7）他们给他穿上紫袍，让他坐在审判座上，说：“以色列王啊，公正地审判吧！”（8）其中一人拿来一顶荆棘冠冕，戴在主头上。


    （9）另有些站在旁边的人朝他脸上吐唾沫，有些人掌掴他的脸颊；另一些人用芦苇刺他，还有些人鞭打他，说：“让我们用这样的尊荣来尊崇上帝的儿子吧！”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段依据所提供的公共领域英文见证暂译；阿克米姆抄本的希腊文原文尚待直接复核。“他们的除酵节”中的“他们”按见证保留，未进一步明确所指群体。
    reason: 资料明确标注源语言审查尚未完成，且代词可能影响叙事语气。
  - marker: b
    text: “我们既然有权处置他”所对应的表达也可理解为“他既已在我们权下”；句法关系尚待希腊文复核。
    reason: 保留所供英文见证中分词短语的真实歧义。
  - marker: c
    text: “用芦苇刺他”依所供英文见证翻译；有些相关译法可能作“用芦苇击打他”，须待希腊文核查。末句直译式地保留“尊荣／尊崇”的反讽。
    reason: 避免在缺乏希腊文直接复核时擅自归一化异常动作，并说明修辞效果。
lexical_decisions:
- source_word: festival of the Unleavened Bread
  choice: 除酵节
  rationale: 采用现代中文圣经语境中通行而简洁的节期名称，同时保留其犹太节期含义。
- source_word: the Lord
  choice: 主
  rationale: 保留叙事对耶稣的尊称，不改写为专名。
- source_word: seat of judgment
  choice: 审判座
  rationale: 保留司法与王权嘲弄的双重场景，不具体化为普通座椅。
- source_word: thorn crown
  choice: 荆棘冠冕
  rationale: 用庄重且易懂的传统表达，呈现作为王冠的讥讽意味。
- source_word: piercing him with a reed
  choice: 用芦苇刺他
  rationale: 按所供英文见证直译其异常措辞，不擅自改成较熟悉的“打他”。
- source_word: honor
  choice: 尊荣／尊崇
  rationale: 在同一句中分别作名词和动词处理，尽量再现原句的反讽性词语呼应。
theological_decisions:
- issue: “having authority over him”的主语与语气
  choice: 我们既然有权处置他
  alternative: 他既已在我们权下／我们控制着他
  rationale: 所供见证的分词结构可与说话者相连；译文保留其宣称权柄的意味，但不赋予额外神学解释。
- issue: “Son of God”的称谓
  choice: 上帝的儿子
  alternative: 神的儿子
  rationale: 采用现代标准普通话中清楚自然的称呼；此处由施虐者以讥讽口吻说出，译文不削弱称谓本身。
- issue: “Judge justly”的反讽
  choice: 公正地审判吧
  alternative: 秉公审判吧
  rationale: 保留命令形式及与审判座、以色列王称号之间的讥讽张力。
- issue: 施虐者所谓“尊荣”的反讽
  choice: 让我们用这样的尊荣来尊崇……
  alternative: 我们就这样向……致敬吧
  rationale: 尽可能保留同根词式的反讽，不将其解释成单纯辱骂。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文；保留段落与节号（6）—（9）。施虐场面使用直接但不过度渲染的动词。由于用户提供的材料明确说明希腊文审查尚待进行，本稿属源证据受限的暂定出版草案，脚注标明关键不确定处。
