review_pass:
  verdict: revise
  source_fidelity: 第58—59节基本忠实保留了英文见证的节期结束、众人返家、门徒哭泣悲伤及“十二”这一可能与其他传统不一致的明确表述。第60节将“the sea”译为“海边”略把目的地具体化为岸边；更重要的是，残缺的关系从句“whom the Lord …”译作“他就是主所……”在中文中不够成立，且“就是”无原文依据。鉴于所给材料明确说明希腊文复核尚待进行，本次仅依公共领域英文见证作保守修订。
  naturalness: 整体庄重、现代且通顺。“我们各人都因所发生的事悲痛，回家去了”可更自然地调整为“各自因所发生的事悲痛，就回家去了”。第60节用同位语破折号标出“我，西门·彼得”可避免把人名误读为另一位人物，并以“主曾……他”保留中文中可理解的残句形式。
  terminology: “除酵节”“主”“门徒”“西门·彼得”“安得烈”“亚勒腓”“利未”均合乎现代中文宗教文本的常用形式。“渔网”虽比原见证的“nets”略具体，但在此语境属自然且不改变叙事。将“海边”改为“海那里”避免无根据地限定为岸边，同时不擅自指定该水域。
  issues:
  - severity: medium
    issue: 第60节将“the sea”译为“海边”。
    rationale: 英文见证只说他们“went to the sea”，并未明说到岸边；“海边”会把地点收窄为海岸。
  - severity: medium
    issue: 第60节残句“whom the Lord …”译为“他就是主所……”。
    rationale: “就是”不见于见证文本，且“主所……”在现代汉语中形成不自然、难以解析的未竟结构。应保留未完成性，同时避免添加指认语气。
  - severity: low
    issue: “我西门·彼得和我的兄弟安得烈”缺少同位语界标。
    rationale: 用破折号或逗号标示“我，西门·彼得”可提高中文可读性，不改变原文第一人称自称结构。
  revised_text: （58）那时正是除酵节的最后一天。节期已经结束，许多人便离开，返回自己的家。（59）但我们这些主的十二个门徒却在哀哭悲伤；我们各人都因所发生的事悲痛，就回家去了。（60）我——西门·彼得——和我的兄弟安得烈带上渔网，到海那里去了。亚勒腓的儿子利未也和我们在一起；主曾……他。[a]
  revised_footnotes:
  - marker: a
    text: 现存手稿至此残缺，后文佚失。本段暂据所提供的公共领域英文见证翻译，尚待希腊文原文复核。
    reason: 说明第60节末尾的省略号表示手稿在未完成的句子中断裂，并如实标明目前译文所依据的文本限制。
  revision_rationale: 修订避免把“海”具体化为“海边”，并以“主曾……他”保留见证文本中未完成的关系从句，而不补足缺失内容或加入“就是”这类无据指认。其余内容维持原译的节期术语、人物名称、叙事重复、十二门徒的数字及手稿残缺说明。
