  text: (58) Now it was the last day of Unleavened Bread, and many people were leaving and returning to their homes because the festival was over. (59) But we, the Lord’s twelve disciples, were weeping and grieving, and each of us returned home, grieving because of what had happened. (60) But I, Simon Peter, and my brother Andrew took our nets and went to the sea. Levi, the son of Alphaeus, was with us, whom the Lord . . .
translation:
  language: zh_hans
  text: （58）那时正是除酵节的最后一天。节期已经结束，许多人便离开，返回自己的家。（59）但我们这些主的十二个门徒却在哀哭悲伤；我们各人都因所发生的事悲痛，回家去了。（60）我西门·彼得和我的兄弟安得烈带上渔网，往海边去了。亚勒腓的儿子利未也与我们同行；他就是主所……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存手稿至此残缺，后文佚失。本段暂据所提供的公共领域英文见证翻译，尚待希腊文原文复核。
    reason: 说明省略号不是修辞停顿，而是手稿缺损；同时如实标明当前底本限制。
lexical_decisions:
- source_word: Unleavened Bread
  choice: 除酵节
  rationale: 采用现代中文圣经及相关文献中通行的节期名称，既简洁，也明确指向犹太节期。
- source_word: the twelve disciples of the Lord
  choice: 主的十二个门徒
  rationale: 保留见证文本的明确人数及所属关系，不因叙事背景可能引出的疑问而加以协调。
- source_word: weeping and grieving
  choice: 哀哭悲伤
  rationale: 分别呈现外在哭泣与内在哀痛的双重表达，同时保持自然中文。
- source_word: nets
  choice: 渔网
  rationale: 补明这些网的捕鱼用途，使现代读者自然理解，但不增添叙事内容。
- source_word: the sea
  choice: 海边
  rationale: 在“带上渔网，往……去”的语境中译作自然中文；原见证只称“海”，未指明具体水域。
- source_word: Levi, the son of Alphaeus
  choice: 亚勒腓的儿子利未
  rationale: 保留人物姓名与父称关系，采用现代中文宗教文本中常见的音译形式。
theological_decisions:
- issue: 受难后仍称叙述者群体为“十二个门徒”
  choice: 照译为“主的十二个门徒”
  alternative: 概括为“主的门徒”或改成“十一个门徒”
  rationale: “十二”属于所提供见证的明确措辞；不应为了与其他传统的计数方式协调而删改。
- issue: “除酵节最后一天”与“节期已经结束”的时间表述
  choice: 两者均予保留
  alternative: 将后一句弱化为“节期将要结束”
  rationale: 见证文本本身并列这两项陈述；译文保留其可能存在的时间张力，不擅自消解。
- issue: 残句“whom the Lord …”的解释
  choice: 保留为“他就是主所……”
  alternative: 补出主对利未所做或所说之事
  rationale: 手稿结尾残缺，无法可靠恢复谓语；不依据其他传统补足内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。句法适度顺应普通话表达，同时保留原见证中的重复、群体称谓、时间张力及残缺结尾。
