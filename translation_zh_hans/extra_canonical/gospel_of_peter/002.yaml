    reason: 提示律法引文的可能出处及其措辞差异，避免读者误以为这是对《申命记》现行文本的逐字引用。
  revision_rationale: 修订“安息日也快到了”为“安息日也开始了”，以对应见证的进行性表述；第（4）节删去补出的“主的”，并微调律法引文的语序以提升自然度。其余内容保留原有的称谓、指代范围和文本含混性。由于现有起草依据为英文见证而非已核对的希腊文本，本次判断仍属基于所供见证的审校。
