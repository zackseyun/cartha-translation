    (5) And Herod said, "Brother Pilate, even if someone hadn''t asked for him, we would''ve buried him, since also Sabbath is beginning, because it''s written in the Law, ''The sun shouldn''t set on one who''s been killed.''"'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/002.yaml
  text: '(3) Joseph was standing there, a friend of Pilate and of the Lord. When he saw that they were about to crucify him, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent word to Herod and asked him for the body.


    (5) Herod said, “Brother Pilate, even if no one had asked for him, we would have buried him, since the Sabbath is also beginning. For it is written in the Law, ‘The sun must not set on one who has been killed.’”'
translation:
  language: zh_hans
  text: '（3）约瑟站在那里；他是彼拉多和主的朋友。他看见他们将要把主钉十字架，就去见彼拉多，请求领取主的遗体，好安葬他。（4）彼拉多派人去见希律，向他索取主的遗体。


    （5）希律说：“彼拉多弟兄，即使没有人来求取他的遗体，我们也会安葬他，因为安息日也快到了。律法上记着：‘不可让太阳在被杀的人身上落下。’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话可能呼应《申命记》21:22—23；这里按现存见证的措辞翻译。
    reason: 提示律法引文的可能出处及其措辞差异，避免读者误以为这是对《申命记》现行文本的逐字引用。
lexical_decisions:
- source_word: friend of Pilate and the Lord
  choice: 彼拉多和主的朋友
  rationale: 保留所据英文见证中约瑟与彼拉多及主两方面的关系，不把“朋友”弱化为泛指的熟人。
- source_word: body
  choice: 遗体
  rationale: 上下文明确指即将被处死之人的身体；现代汉语中“遗体”适合安葬语境，也避免“尸体”带来的不必要粗粝感。
- source_word: sent to Herod
  choice: 派人去见希律
  rationale: 自然表达差遣使者传话之意；不擅自补充原见证未说明的使者身份或具体方式。
- source_word: Brother Pilate
  choice: 彼拉多弟兄
  rationale: 直译亲属或礼貌称呼所保留的“弟兄”，不将其解释为宗教共同体称谓。
- source_word: Sabbath is beginning
  choice: 安息日也快到了
  rationale: 用自然现代汉语表达安息日临近、即将开始，不具体推定准确时刻。
- source_word: one who's been killed
  choice: 被杀的人
  rationale: 保留被动受死的宽泛表述，不收窄为“被处决者”或特定刑罚类别。
theological_decisions:
- issue: 约瑟所请求遗体的归属
  choice: 主的遗体
  alternative: 他的遗体／耶稣的遗体
  rationale: 所据见证重复使用“主”，译文保留其基督论称谓，不以姓名替换。
- issue: 律法引文与希伯来圣经条文的关系
  choice: 按所据见证直译为“不可让太阳在被杀的人身上落下”
  alternative: 依申命记21:23改写为“不可让尸首留在木头上过夜”
  rationale: 该句可能呼应申命记21:22—23，但现有见证措辞并不完全相同；不以正典平行经文校正本段文本。
- issue: “我们会安葬他”的主体
  choice: 保留第一人称复数“我们”
  alternative: 改为“我也会叫人安葬他”
  rationale: 不解释“我们”具体指希律、其属员或当权者群体，保留主体范围的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。因所提供材料明确注明尚待希腊文复核，本稿仅以公共领域英文见证为起草依据；没有虚构希腊词形或声称完成原文校勘。编号沿用见证的（3）—（5），引文层级以中文双引号和单引号区分。
