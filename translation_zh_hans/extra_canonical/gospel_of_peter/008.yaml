review_pass:
  verdict: revise
  source_fidelity: 第28节的“既然发生了”把见证中的条件式“If ... have happened”强化为既定事实，宜保留其条件性。第32节关于滚石与百夫长、士兵的关系在英文见证中确有异常；正文应保留这种不确定性，并以脚注说明。其余叙事内容、人物和行动次序基本忠实于所给见证；希腊文底本尚待复核。
  naturalness: 整体庄重清楚。将“坟墓门口”改为“墓穴入口处”较符合叙事场景和现代汉语；将第28节民众的话改为更自然的条件句。
  terminology: “经学家”“法利赛人”“长老”“百夫长”“从死人中复活”等术语适切。“义人”比“公义”更自然地对应此处对死者为正直、无辜之人的评价，且不额外强化为抽象属性或特定教义断言。
  issues:
  - severity: medium
    issue: 第28节将条件句译为“既然发生了”。
    rationale: 英文见证为“If at his death these greatest signs have happened”，虽带修辞色彩，仍应保留“若／如果”的条件表达，不宜由译者改作明确前提。
  - severity: low
    issue: 第28节“他是多么公义”不够自然，且“公义”在现代汉语中常指抽象的正义属性。
    rationale: 此处的 just 更自然可译为“义人”，表达正直、无辜之人的评价，同时不作超出文本的神学界定。
  - severity: low
    issue: “坟墓门口”略不自然。
    rationale: “墓穴入口处”更贴合封石的空间关系，且不改变 grave/tomb 的基本指称。
