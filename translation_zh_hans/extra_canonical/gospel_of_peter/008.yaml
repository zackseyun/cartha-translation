base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/008.yaml
  text: '(28) The scribes, the Pharisees, and the elders gathered together after hearing all the people grumbling, beating their chests, and saying, “If these greatest signs happened at his death, see how just he was!”


    (29) The elders were afraid and went to Pilate, begging him and saying, (30) “Give us soldiers so that we may guard his grave for three days. Otherwise, his disciples may come and steal him, and the people may think that he rose from the dead and do us wrong.”


    (31) Pilate gave them Petronius the centurion, along with soldiers to guard the tomb. Elders and scribes went with them to the grave. (32) After rolling a great stone to the centurion and the soldiers, everyone who was there placed it at the entrance of the grave. (33) They put seven seals on it, pitched a tent there, and kept watch.'
translation:
  language: zh_hans
  text: '（28）经学家、法利赛人和长老彼此聚集起来，因为他们听见众人都在怨叹、捶胸，说：“他死的时候既然发生了这些极大的神迹，可见他是多么公义！”


    （29）长老们害怕了，就到彼拉多那里恳求他说：（30）“请给我们一些士兵，让我们看守他的坟墓三天，免得他的门徒来把他偷走，百姓以为他从死人中复活了，便加害我们。”


    （31）彼拉多把百夫长彼得罗尼乌斯和一些士兵交给他们去看守坟墓。长老和经学家也跟他们来到坟墓那里。（32）他们把一块大石头滚到百夫长和士兵那里；所有在场的人一同把石头安放在坟墓门口。[a]（33）他们在石头上加了七道封印，又在那里搭起帐篷，严加看守。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有英文见证在这里直译为“把一块大石头滚到百夫长和士兵那里”，句法和动作关系不寻常。也可能意在说众人当着百夫长和士兵的面把石头滚来，或由他们一同安放；有待希腊文底本复核。
    reason: 保存底本见证中的真实疑难，避免把参与者及动作关系武断地确定下来。
lexical_decisions:
- source_word: scribes
  choice: 经学家
  rationale: 指熟悉并讲授宗教律法的专业人士；“经学家”比现代行政意义浓厚的“文士”更易为普通读者理解。
- source_word: grumbling
  choice: 怨叹
  rationale: 结合捶胸和对死者的评价，此处表达哀恸中的不满或悲叹；“怨叹”保留这两层色彩，不将其单纯处理为抱怨。
- source_word: just
  choice: 公义
  rationale: 保留对人物道德正直、无辜而合乎正义的判断，也维持文本可能具有的神学意味。
- source_word: grave / tomb
  choice: 坟墓
  rationale: 中文统一用“坟墓”，自然清楚；原见证中 grave 与 tomb 的交替在此并无明确语义区别。
- source_word: do us wrong
  choice: 加害我们
  rationale: 原措辞可泛指伤害、对付或不利于说话者；“加害我们”保留威胁感，同时避免具体断定伤害方式。
- source_word: seven seals
  choice: 七道封印
  rationale: 表达在墓石上施加七重封缄以显示并防止擅自开启，不误解为七枚现代印章。
theological_decisions:
- issue: 百姓称耶稣为“just”的含义
  choice: 译作“公义”
  alternative: 义人／无辜
  rationale: “公义”既能表达正直，也不排除“无辜”的语境含义；不把百姓的话扩展为更明确的基督论宣告。
- issue: “从死人中复活”是事实陈述还是当局所忧虑的民众看法
  choice: 保留在“百姓以为”所支配的间接内容中
  alternative: 译成直接肯定“他复活了”
  rationale: 原叙事在这里陈述的是长老所担心的公众判断，不应由译者改成旁白的事实断言。
- issue: 异常的滚石句法
  choice: 正文保留“把一块大石头滚到百夫长和士兵那里”，并加注说明
  alternative: 顺译为“百夫长和士兵滚来一块大石头”
  rationale: 现有底本的关系表达异常，且希腊文复核尚未完成；不宜擅自消除可能的文本困难。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。因所提供材料标明希腊文复核尚未完成，本稿以公共领域英文见证为直接起草依据，并对最显著的异常句法作显式脚注，不假装已经完成原文校勘。
