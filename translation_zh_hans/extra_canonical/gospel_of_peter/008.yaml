review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所提供的英文见证，并恰当保留了第32节滚石句的异常动作关系。不过，第31节的“一些士兵”在见证中没有数量限定；第29—30节“加害我们”较“do us wrong”更具体地指向人身伤害，宜改为较宽泛的“对我们不利”。第32节的疑难仍应保留脚注，且正文不应借此断定百夫长和士兵参与滚石。
  naturalness: 叙事总体庄重、通顺。“怨叹、捶胸”可理解，但“哀叹、捶胸”更符合当下哀悼场景的现代中文搭配。将“他是多么公义”改为“他是多么正直”更符合现代汉语中对个人品格的感叹式表达，同时不扩大其神学含义。
  terminology: “经学家”“法利赛人”“长老”“彼拉多”“百夫长”“彼得罗尼乌斯”均可接受。“义人”虽是可行的传统术语，但本段百姓的感叹未必要求术语化；“正直”较自然，也保留δίκαιος／just所含正直、无辜的评价空间。保留“坟墓”“封印”合宜。
  issues:
  - severity: medium
    issue: 第31节加入“一些”士兵
    rationale: 英文见证仅说“with soldiers”，并未表示“不定数量的一些士兵”。中文可直接译为“和士兵”，避免加入未经见证支持的数量限定。
  - severity: medium
    issue: 第30节“加害我们”过度具体化
    rationale: “do us wrong”可指伤害、亏待或对说话者不利；“加害”在现代中文通常更偏向直接施害。译为“对我们不利”可保留原句宽泛的威胁含义。
  - severity: low
    issue: 第28节“公义”作个人评价略显抽象
    rationale: 在“看他是多么……”的感叹句中，“正直”更自然，且仍可表达just对其正直或无辜的评价；不将其处理成明确的基督论术语。
  revised_text: '（28）经学家、法利赛人和长老彼此聚集起来，因为他们听见众人都在哀叹、捶胸，说：“他死的时候既然发生了这些极大的神迹，看他是多么正直！”


    （29）长老们害怕了，就到彼拉多那里恳求他说：（30）“请给我们士兵，让我们看守他的坟墓三天，免得他的门徒来把他偷走，百姓以为他从死人中复活了，因而对我们不利。”


    （31）彼拉多把百夫长彼得罗尼乌斯和士兵交给他们，去看守坟墓。长老和经学家也跟他们来到坟墓那里。（32）他们把一块大石头滚到百夫长和士兵那里；所有在场的人都把它安放在坟墓门口。[a]（33）他们在石头上加了七道封印，又在那里搭起帐篷，严加看守。'
  revised_footnotes:
