base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/005.yaml
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  language: zh_hans
  text: '（15）正午时分，黑暗笼罩了整个犹太地区。他们忧虑不安，怕他还活着，太阳就落山了；因为有话写给他们说：“太阳不可在被杀的人身上落下。”（16）他们中有一个人说：“给他苦胆调酸酒喝。”他们调好后，就给他喝了。（17）他们成全了这一切，也把罪孽堆积在自己头上。（18）许多人以为已经入夜，便提着灯四处走动；还有些人跌倒了。


    （19）主大声呼喊说：“我的能力啊，能力啊，你离弃了我！”他说完这话，那能力就被接上去了。[a]（20）就在那一刻，耶路撒冷圣殿的幔子裂成了两半。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那能力就被接上去了”：原文表述简略，也可理解为“它被接上去了”；这里最可能承接前一句的“能力”，但具体所指和意义并不明确。
    reason: 保留关键代词的语法与神学歧义，并提示读者该译法仍属暂定。
lexical_decisions:
- source_word: darkness held fast over all Judea
  choice: 黑暗笼罩了整个犹太地区
  rationale: 以自然庄重的现代汉语表达黑暗遍及并持续压住全地的景象；“犹太地区”避免让普通读者误解为仅指居民。
- source_word: bile with sour wine
  choice: 苦胆调酸酒
  rationale: 保留“苦胆”与“酸酒”两个成分及混合动作，不将苦胆具体化为未经证实的药物。
- source_word: fulfilled all things
  choice: 成全了这一切
  rationale: 保留“使一切完成”的概括性和可能带有经文应验意味的张力，不擅自补出“预言”。
- source_word: My Power, the Power
  choice: 我的能力啊，能力啊
  rationale: 依现有见证直译重复而异常的称呼，不改写成较熟悉的“我的上帝”，以免抹平本书独特措辞。
- source_word: veil of the temple
  choice: 圣殿的幔子
  rationale: 采用现代中文读者熟悉且准确的礼仪建筑用语。
theological_decisions:
- issue: “it was taken up”的指代与含义
  choice: 那能力就被接上去了
  alternative: 他就被接上去了／他的灵被接去了／这声音被收去了
  rationale: 英语见证的代词含混，但希腊文本通常被理解为承接前句阴性名词“能力”；正文以“那能力”呈现最可能的语法指向，同时用脚注说明原文简略，避免解释其神学机制或将其等同于死亡、升天或灵魂离体。
- issue: “The sun shouldn’t set on one who’s been killed”的经文性质
  choice: 因为有话写给他们说：“太阳不可在被杀的人身上落下。”
  alternative: 因为经上记着：“不可让被处死者留到日落。”
  rationale: 保留见证中“写给他们”的不寻常表述及“太阳……在……身上落下”的意象，不直接改造成申命记引文，也不消除它与所暗指律法之间的措辞差异。
- issue: 黑暗中“some fell down”的原因
  choice: 还有些人跌倒了
  alternative: 还有些人倒下了
  rationale: 不补充跌倒是因黑暗、恐惧或神迹所致；“跌倒”较自然地保留动作本身。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话，保留段号。鉴于所提供材料注明希腊语复核尚未完成，本稿以公共领域英文见证为主要起草依据，对关键歧义采取保守处理；避免以正典受难叙事的熟悉措辞覆盖《彼得福音》见证自身的独特表达。
