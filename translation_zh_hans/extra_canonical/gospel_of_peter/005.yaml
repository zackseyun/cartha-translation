    reason: 保留“it was taken up”的语法指代与意义歧义，避免正文作出神学性或叙事性的补充解释。
  revision_rationale: 修订集中处理会改变原见证开放性的地方：第19节不再以“那能力”替原文代词指定先行词，并以脚注充分标示不确定性；第16节明确保留两种饮物成分。另对第15节作最小幅度的语序调整，以维持现代汉语可读性而不抹平见证的特殊表述。
