lexical_decisions:
- source_word: tomb
  choice: 坟墓
  rationale: 在现代汉语中自然清楚，也能指可进入并安放遗体的墓穴；上下文中的“走近、俯身往里看、中央”补足其空间形态。
- source_word: a certain young man
  choice: 一个青年
  rationale: 保留人物身份的普通描述，不擅自明确为天使；汉语无需机械译出不定限定语“某一个”。
- source_word: beautiful
  choice: 容貌俊美
  rationale: 按所提供见证的直接含义处理，并与随后闪亮长袍的描写区分。
- source_word: long, shining robe
  choice: 闪亮的长袍
  rationale: 保留衣袍长度与发光、明亮的视觉特征，措辞庄重而易懂。
- source_word: arose
  choice: 复活
  rationale: 此处谈论被钉十字架者不再躺在安葬之处，语境表明是从死里起来；“复活”比仅译“起来了”更自然准确。
- source_word: went away
  choice: 离开了
  rationale: 保留动作的朴素表达，不补充去向或升天等未明说的信息。
- source_word: where he came from
  choice: 他原来所来的地方
  rationale: 尽量保留来源和去向的含混性，不将其明确解释为天上、父那里或其他特定所在。
theological_decisions:
- issue: 青年人的身份
  choice: 仅译作“一个青年”
  alternative: 天使
  rationale: 所提供文本只称其为青年；虽有闪亮长袍等超常描写，仍不应在正文中替原文判定身份。
- issue: “复活”与“起来”的译法
  choice: 复活
  alternative: 起来了
  rationale: 死亡、安葬与空墓语境使此动词指向从死里起来；采用现代汉语惯用的“复活”，但不增添复活方式的说明。
- issue: “回到他原来所来的地方”的所指
  choice: 维持未明说的去处
  alternative: 回到天上／回到父那里
  rationale: 原文证据尚未直接复核，且所给见证没有明确命名目的地；保留其神学张力和指涉开放性。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。保留（55）—（57）的段落编号。为符合汉语指代习惯，根据第57节明确的“妇女”将前文复数主语译为“她们”；不把青年解释为天使，也不具体说明耶稣返回何处。
