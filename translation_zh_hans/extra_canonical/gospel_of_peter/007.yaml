    (26) But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. (27) On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/007.yaml
  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  language: zh_hans
  text: '（25）随后，犹太人、长老和祭司知道自己给自己造成了多大的祸害，就开始哀恸，说：“我们因自己的罪有祸了！审判和耶路撒冷的终局近了！”


    （26）但我和我的同伴们都很悲痛，心灵受伤，便躲藏起来；因为他们把我们当作作恶的人，又当作想要烧毁圣殿的人来搜捕。


    （27）在这一切事当中，我们禁食，坐着哀恸，昼夜哭泣，直到安息日。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: how much wrong they had done to themselves
  choice: 自己给自己造成了多大的祸害
  rationale: 保留行为反过来伤害自身的意味；避免仅译为道德上的“犯了多少错”，因为上下文也涉及审判与灾祸。
- source_word: Woe to our sins
  choice: 我们的罪有祸了
  rationale: 保留原见证文本中“祸哉”式哀叹与“罪”的紧密关系，同时采用现代读者能够理解的表达。
- source_word: the judgment and the end of Jerusalem
  choice: 审判和耶路撒冷的末日
  rationale: 不把“审判”与“末日”合并为单一事件，也不擅自将“end”具体化为毁灭、陷落或时代终结。
- source_word: being wounded in mind
  choice: 心里受了创伤
  rationale: 自然表达内在精神痛苦，同时保留“受伤”的形象。
- source_word: wrongdoers
  choice: 作恶的人
  rationale: 传达被视为恶行者或罪犯的指控，但不加入原见证文本没有明确说明的法律定罪。
- source_word: Sabbath
  choice: 安息日
  rationale: 采用通行而准确的宗教历史用语。
theological_decisions:
- issue: “犹太人、长老和祭司”的群体范围
  choice: 按所给见证文本直译为“犹太人、长老和祭司”
  alternative: 改写为“那些犹太领袖、长老和祭司”
  rationale: 见证文本将三者并列，译文不擅自缩小第一项的范围；同时也不扩展为所有时代或所有地方的犹太人。
- issue: 耶路撒冷的“end”所指为何
  choice: 译作“末日”，保留开放性
  alternative: 译作“毁灭”或“陷落”
  rationale: 在尚待希腊文复核的情况下，不提前判定这是城市毁灭、政治陷落，还是末世性的终局。
- issue: 门徒被搜捕的指控
  choice: 保留“作恶”与“想要烧毁圣殿”两项指控
  alternative: 将两项合并为“纵火犯”
  rationale: 见证文本在语法上列出一般性恶名与具体意图，合并会消除叙述中的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留段落编号以对应所给文本。由于希腊文源语审校尚未完成，本稿明确以提供的公版英文见证为暂定依据；对“wrong”“end”及相关句法采取审慎、不作过度解释的译法。
