  to: '（25）随后，犹太人、长老和祭司知道自己给自己造成了多大的祸害，就开始哀恸，说：“我们因自己的罪有祸了！审判和耶路撒冷的终局近了！”


    （26）但我和我的同伴们都很悲痛，心灵受伤，便躲藏起来；因为他们把我们当作作恶的人，又当作想要烧毁圣殿的人来搜捕。


    （27）在这一切事当中，我们禁食，坐着哀恸，昼夜哭泣，直到安息日。'
