  yaml_path: translation/extra_canonical/jubilees/047/005.yaml
  text: And in those days Tarmut[a], the daughter of Pharaoh, went out to bathe in the river, and she heard your voice crying, and she told her maidens to bring you out.
translation:
  language: zh_hans
  text: 那些日子，法老的女儿塔尔穆特[a]到河里去沐浴。她听见你哭泣的声音，就对她的侍女说，要她们把你带出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔尔穆特”是《禧年书》所记法老女儿的名字；约瑟夫斯《犹太古史》2.224所载的对应名字为“特尔穆提斯”。
    reason: 提供该专名的历史文献背景，并说明它不是《出埃及记》正文中出现的名字。
lexical_decisions:
- source_word: ታርሙት
  choice: 塔尔穆特
  rationale: 按吉兹语人名音译；保留《禧年书》赋予法老女儿的专名。
- source_word: ትትሐፀብ
  choice: 沐浴
  rationale: 准确表达在河中洗浴之意；“沐浴”庄重自然，也符合王室人物的叙事语体。
- source_word: ቃለከ፡ እንዘ፡ ትበኪ
  choice: 你哭喊的声音
  rationale: 保留第二人称指向摩西，并自然表达伴随状态“当你哭时”；“哭喊”传达可被听见的哭声。
- source_word: ለአዕጋሪቲሃ
  choice: 她的侍女
  rationale: 该词指法老女儿身边的女性随从；“侍女”比“少女们”更清楚表达随侍身份。
- source_word: ያውፅኣከ
  choice: 把你抱出来
  rationale: 基本义是“把你带出/取出”；上下文对象是婴儿，用“抱出来”符合现代汉语习惯，同时不增添来源容器等本节未明说的信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以“你”保留原文对摩西的第二人称称呼；句法略作拆分，使汉语流畅。未采纳早期审校所提“你姐姐躲过飞鸟”等内容，因为用户此次提供的吉兹语源文并不含该短语，属于节界或旧源段问题。
