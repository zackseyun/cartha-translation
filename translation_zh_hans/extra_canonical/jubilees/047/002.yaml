  yaml_path: translation/extra_canonical/jubilees/047/002.yaml
  text: That was a time of affliction upon the children of Israel, and Pharaoh, king of Egypt, commanded concerning them that they should throw all their children, every male that was born, into the river.
translation:
  language: zh_hans
  text: 那时，以色列子孙正遭受苦难。法老，埃及王，命令以色列人把他们的孩子——凡出生的男孩——都扔进河里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ምንዳቤ
  choice: 遭受苦难的时期
  rationale: 保留“日子／时期”与“苦难、患难”的语义，同时采用自然的现代汉语表达。
- source_word: ውሉደ፡ እስራኤል
  choice: 以色列子孙
  rationale: 对应传统族群称谓“以色列的儿女／子孙”，并避免只指男性。
- source_word: ንጉሠ፡ ግብጽ፡ ፈርዖን
  choice: 埃及王法老
  rationale: 依原文保留“埃及王”和“法老”两个称号，以简洁自然的汉语组合表达。
- source_word: ውሉዶሙ፡ ኵሎ፡ ርሰ፡ ዘተወልደ
  choice: 自己所生的孩子，凡是男孩
  rationale: 原文先用广义的“他们的孩子”，再以“凡出生的男性”限定；译文保留这一先广后窄的结构，不把前项直接缩减为“儿子”。
- source_word: ፈለግ
  choice: 河
  rationale: 原文为一般性的“河／河流”；语境中指尼罗河，但正文不补入原文未明说的专名。
