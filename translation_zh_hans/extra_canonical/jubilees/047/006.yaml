  yaml_path: translation/extra_canonical/jubilees/047/006.yaml
  text: '...to bring you, and he brought you to her. And she took you out of the basket and had compassion on you. And your sister said to her, “Shall I go and call for you one of the Hebrew women, who will rear him and nurse him?”'
translation:
  language: zh_hans
  text: ……把你带来；他便把你带到她那里。她把你从篮子里取出来，怜悯你。你姐姐对她说：“我去替你叫一个希伯来妇人来，让她抚养他[a]、给他哺乳，好吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里由对摩西所说的“你”转为“他”。
    reason: 保留并说明原文引语中的人称转换。
lexical_decisions:
- source_word: ሤፍቅ
  choice: 篮子
  rationale: 指盛放婴孩摩西的容器；译作“篮子”既符合本段语境，也比音译或生硬的器物名称更易懂。
- source_word: መሐረተከ
  choice: 怜悯了你
  rationale: 保留动词所表达的怜悯、同情之意，不扩展为收养等原文未明说的行动。
- source_word: ታሐፅኖ
  choice: 抚养他
  rationale: 该动词在此指照料、养育孩子，与后面的哺乳动词有区别，因此分别翻译。
- source_word: ታጠብዎ
  choice: 给他哺乳
  rationale: 此处表示使婴孩吃奶、乳养，并非“洗他”；译文保留与前一动词并列的第二项行动。
theological_decisions:
- issue: 叙述中人称由“你”转为“他”
  choice: 正文保留原文的人称转换，并加注说明
  alternative: 为行文一致而全部译成“你”
  rationale: 原文先直接对摩西说“你”，在姐姐的引语中则称婴孩为“他”；保留这种转换可避免抹平原文的叙述层次。
- issue: 开头残句的主语与上文关联
  choice: 以省略号起句，并按原文保留“他”
  alternative: 根据上下文补出具体人物姓名或身份
  rationale: 所给经文从目的从句中间开始，且主语只以阳性单数形式出现；不宜凭推测补名。
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“替你叫一个希伯来妇人来”符合当代汉语表达；“抚养”和“哺乳”分别对应两个不同的原文动词。开头用省略号表明本节所给文本承接前文。
