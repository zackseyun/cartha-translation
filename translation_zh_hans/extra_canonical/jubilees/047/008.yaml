  text: And she said to her, “Go.” And she went and called your mother, Jochebed, and gave you to her.
translation:
  language: zh_hans
  text: 她对她说：“去吧。”她就去叫了你的母亲约基别来，把你交给她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወትቤላ፡ ሑሪ
  choice: 她对她说：“去吧。”
  rationale: 保留原文的直接引语和阴性单数命令语气；现代汉语用“吧”自然表达准许或吩咐。
- source_word: ወጸውዐታ፡ ለእምከ፡ ለአዮካቤድ
  choice: 叫了你的母亲约基别来
  rationale: 按原文保留第二人称关系“你的母亲”及专名约基别；补入趋向成分“来”，使汉语动作目的自然清楚。
- source_word: ወወሀበታ
  choice: 把你交给她
  rationale: 原动词基本义为“给”；在婴孩由一人交由另一人照管的语境中，“交给”比直译“给”更自然，同时不额外说明照管或乳养。
