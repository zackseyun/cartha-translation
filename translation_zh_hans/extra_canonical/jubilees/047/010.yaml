  yaml_path: translation/extra_canonical/jubilees/047/010.yaml
  text: And you were in the court of the king for three weeks of years until the day when you went out from the court of the king and saw an Egyptian striking your fellow countryman, one of your brothers.
translation:
  language: zh_hans
  text: 你在王宫中度过了三个七年期[a]，直到你从王宫出去的那一天，看见一个埃及人正在殴打你的一位同胞，就是你弟兄中的一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “三个七年期”即三个以七年为单位的周期，共二十一年。
    reason: 说明原文以七年为一周期的计年表达，并保留正文的原文历法色彩。
lexical_decisions:
- source_word: ዐጸድ፡ መንግሥት
  choice: 王的宫院
  rationale: ዐጸድ本指有围墙的院落或宫廷范围；译作“王的宫院”既保留空间意象，也自然表达王室宫廷。
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመተ
  choice: 三个“七年期”
  rationale: 原文直指三个以七年为单位的周期，即二十一年；正文保留古代计年表达，并用脚注说明。
- source_word: ግብጻዊ
  choice: 一个埃及人
  rationale: 准确保留族属称谓及不定指意义。
- source_word: ካልእከ፡ ዘእምነ
  choice: 你的一个同胞，也就是你的一个弟兄
  rationale: 原文将“你的同类/同胞”进一步界定为“你的弟兄之一”；此译保留二者的并置关系，不将“弟兄”狭义化为亲兄弟。
- source_word: ይዘብጦ
  choice: 正在殴打
  rationale: 未完成体分词式表达正在进行的击打动作；“殴打”符合此处暴力语境。
theological_decisions:
- issue: “弟兄”的关系范围
  choice: 保留“同胞”与“弟兄”两个称呼
  alternative: 仅译为“以色列同胞”或“亲兄弟”
  rationale: 原文措辞强调共同族属，却未表示亲生兄弟关系；保留双重称呼可避免过度限定。
- issue: 三个七年期的表达
  choice: 正文保留周期性计年法，脚注说明为二十一年
  alternative: 正文直接译作“二十一年”
  rationale: 保留原文历法风格，同时确保现代读者能够理解。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言；保留原文“王的宫院”和“七年期”的具体意象，并以简短脚注帮助理解。
