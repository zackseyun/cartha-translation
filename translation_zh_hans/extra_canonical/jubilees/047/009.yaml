  yaml_path: translation/extra_canonical/jubilees/047/009.yaml
  text: And wages were paid, and she nursed you. And after this, when you had grown up, they brought you to Pharaoh’s daughter, and you became her son. And your father Amram taught you writing, and when you had completed three weeks of years, he brought you into the court.
translation:
  language: zh_hans
  text: 工钱付了，她也哺育了你。后来，你长大以后，他们把你带到法老的女儿那里，你就成了她的儿子。你父亲暗兰教你书写；你满了三个七年[a]，他就把你带进王宫的庭院。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即二十一年。
    reason: 解释《禧年书》中“三个七年”的纪年表达，同时保留正文的原文形式。
lexical_decisions:
- source_word: ዐስበ
  choice: 工钱付了
  rationale: 该词在本段出埃及记2:9的背景中指支付报酬；采用无明确施事者的表达，以保留原文主语不明的特点。
- source_word: ሐፀነተከ
  choice: 她也乳养了你
  rationale: 动词形式指女性施事者照料、哺育摩西；“乳养”兼顾哺乳与养育之意。
- source_word: ልሂቀከ
  choice: 你长大了
  rationale: 按其成长、长成之义直译，不引入原文未明说的姐姐。
- source_word: ወሰዱከ
  choice: 人们把你带到
  rationale: 原文为复数施事者；汉语用泛指“人们”，保留其身份未指明的特点。
- source_word: መሀረከ … መጽሐፈ
  choice: 教你读写
  rationale: 字面涉及教导“书写/文字”；现代汉语“读写”自然表达受文字教育的含义。
- source_word: ሠለስተ፡ ሱባዔ
  choice: 三个七年
  rationale: 保留《禧年书》以“七年”为周期的纪年方式，而不只换算成二十一岁。
- source_word: ዐጸደ
  choice: 宫廷
  rationale: 该词可指围院、庭院；在法老王室语境中译作“宫廷”较自然，同时不扩写为特定建筑。
