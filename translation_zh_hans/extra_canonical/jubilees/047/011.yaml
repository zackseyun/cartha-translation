  yaml_path: translation/extra_canonical/jubilees/047/011.yaml
  text: And you killed him and hid him in the sand. And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking?”
translation:
  language: zh_hans
  text: 你杀了他，把他藏在沙中。第二天，你看见以色列子孙中的两个人在争斗，就对那作恶的人说：“你为什么动手打？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቀተልኮ
  choice: 你杀了他
  rationale: 该动词为第二人称阳性单数，宾语代词指前文所述之人；直译并保留叙事中的第二人称称呼。
- source_word: ወኀባእኮ፡ ውስተ፡ ኆፃ
  choice: 把他藏在沙土里
  rationale: 按词义表达“隐藏”及地点“沙中”；“沙土”符合现代汉语叙事习惯。
- source_word: በሳኒታ፡ ዕለት
  choice: 第二天
  rationale: 直接表达序数日期，简洁自然。
- source_word: ፪እንዘ፡ ይትበአሱ፡ እምውሉደ፡ እስራኤል
  choice: 两个以色列人在争斗
  rationale: 原文指以色列子孙中的两个人彼此争斗；“两个以色列人”是现代汉语自然表达。
- source_word: ዘይትአገሎ
  choice: 那行恶的人
  rationale: 保留对其中一方行为不正的判断，不具体化为原文未明说的罪名。
- source_word: ለምንት፡ ትዘብጥ
  choice: 你为什么动手打？
  rationale: 原文只出现“为什么”和“你打”，没有明示受词；此译法在汉语中自然，同时不补入“你的同伴”。
theological_decisions: []
