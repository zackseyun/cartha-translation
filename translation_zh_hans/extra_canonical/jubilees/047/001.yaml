  yaml_path: translation/extra_canonical/jubilees/047/001.yaml
  text: And in the seventh week, in the seventh year, in the forty-seventh jubilee, your father came from the land of Canaan, and you were born in the fourth week, in the sixth year, in the forty-eighth jubilee.
translation:
  language: zh_hans
  text: 在第七个七年期的第七年，即第四十七个禧年，你父亲从迦南地来了；在第四个七年期的第六年，即第四十八个禧年，你出生了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 本节的年代体系以七年为一个周期；译作“七年期”既保留七这个核心概念，又避免现代读者误解为七日的“一周”或某一年中的“第七周”。
- source_word: ኢዮቤልዉ
  choice: 禧年
  rationale: 这是《禧年书》年代体系中的禧年周期；沿用中文圣经传统术语“禧年”。
- source_word: እምድረ፡ ከናአን
  choice: 从迦南地
  rationale: 直接对应来源结构，使用现代中文常见的圣经地名表达。
theological_decisions:
- issue: 年代单位之间的层级
  choice: 译为“第四十七个禧年，第七个七年期的第七年”
  alternative: “第四十七个禧年，第七年的第七周”或“第七周，第七年”
  rationale: 格厄兹语的年代公式表示“禧年—七年期—年”的层级。明确译出“七年期”可防止把该周期理解为一年之内的七日周，同时保持与本节后半句平行。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为使《禧年书》的编年体系清楚可懂，将ሱባዔ具体译为“七年期”，并按中文习惯重排日期成分；不添加原文没有的解释性神学内容。
