base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/003.yaml
  text: And they continued casting them in for seven months[3], until the day when you were born. And your mother hid you for three months, and they became aware of her because of you. And she made for you a basket, and coated it with pitch and asphalt, and placed it among the reeds by the bank of the river, and put you in it for seven days. And your mother came by night and nursed you, and by day Miriam your sister guarded you from the birds.
translation:
  language: zh_hans
  text: 他们一连七个月把孩子丢进河里，直到你出生的那一天。你母亲把你藏了三个月；他们因你而发觉了她。她为你做了一只篮子，涂上沥青和柏油，放在河岸边的芦苇丛中，又把你放在里面七天。你母亲夜里来给你哺乳；白天，你姐姐米利暗守护你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末尾的“米利暗”在句法上可能作同位语，指白天守护你的姐姐。此处原文没有明说她所防范的具体危险。
    reason: segmentation_note
lexical_decisions:
- source_word: ይገድፉ
  choice: 把孩子丢进河里
  rationale: 该动词在此承接上文处死婴孩的命令；中文补出“孩子”和“河里”，使指代及动作目的地自然清楚，同时不改变叙事含义。
- source_word: ሤፍተ
  choice: 篮子
  rationale: 指盛放婴孩的容器；采用现代读者自然易懂的“篮子”，并与《出埃及记》相关叙事保持语义联系。
- source_word: ፒሳ፡ ወአስፋልጠ
  choice: 沥青和柏油
  rationale: 原文列出两种防水材料；保留并列，不将二者合并为泛称。
- source_word: ታጠብወከ
  choice: 乳养你
  rationale: 表达母亲给婴孩哺乳；“乳养”兼具明确性与庄重叙事语体。
- source_word: ትዐቅበከ
  choice: 守护你
  rationale: 保留看守、保护之意，不额外限定具体方式。
