  yaml_path: translation/extra_canonical/jubilees/047/012.yaml
  text: Your brother. And he became angry and was indignant and said[12], “Who appointed you a ruler and a judge over us? Do you intend to kill me as you killed the Egyptian yesterday?” And you feared and fled because of this matter.
translation:
  language: zh_hans
  text: 你的弟兄。他发怒，满怀愤恨，说：“谁立你作我们的首领和审判官？难道你想杀我，像你昨天杀了那个埃及人一样吗？”你便害怕，因这事逃走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተምዐዐ፡ ወተቈጥዐ
  choice: 发怒，满怀愤恨
  rationale: 两个并列动词都表达强烈怒气；分别译出，以保留原文的加强语气，同时避免误译为双方“争吵”。
- source_word: መልአከ፡ ወመኰንነ
  choice: 首领和审判官
  rationale: 此处对应任命在众人之上的治理者与裁断者；“首领和审判官”符合上下文，也能自然传达两个并列职分。
- source_word: ትፈቅድ
  choice: 想
  rationale: 该动词表示意愿或意图；在质问句中译作“想”简洁自然，并保留对杀人意图的追问。
- source_word: እምቅድመ፡ ዝንቱ፡ ነገር
  choice: 因这事
  rationale: 原文表达因着、面对这件事而逃离；汉语用“因这事”准确而自然。
theological_decisions:
- issue: 质问者所称的权柄
  choice: 首领和审判官
  alternative: 统治者和法官
  rationale: 采用庄重而通俗的表达，不把该权柄进一步解释为某种特定宗教或政治职分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留开头“你的弟兄”这一承接上文的片段式结构，不擅自补足原文未明说的谓语；删去所给英语层中与本节吉兹文本内容不符的旧脚注。
