  text: And she said to her, “Go.” And she went and called your mother Jochebed, and she gave her wages, and she nursed you.
translation:
  language: zh_hans
  text: 她对你姐姐说：“去吧。”你姐姐就去叫了你母亲约基别来。法老的女儿给了她工钱；你母亲就乳养你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሑሪ
  choice: 去吧
  rationale: 准确表达阴性单数命令式“去”，并以“吧”使现代汉语对话自然。
- source_word: እምከ ለአዮካቤድ
  choice: 你母亲约基别
  rationale: 保留第二人称关系和专名；不加逗号，使“约基别”自然充当同位语。
- source_word: ዐስበ
  choice: 工钱
  rationale: 此处指付给乳母的酬劳；“工钱”比泛称“报酬”更具体，也符合普通现代汉语。
- source_word: ወሐፀነተከ
  choice: 她便乳养你
  rationale: 按语境表达约基别担任乳母、哺育摩西；“乳养”兼顾哺乳与养育之意。
theological_decisions:
- issue: 连续阴性代词的指代
  choice: 分别明示“你姐姐”和“法老的女儿”，末句以“她”回指约基别
  alternative: 全用“她”，保留原文的代词形式
  rationale: 吉兹语靠上下文区分行动者；现代汉语连续使用“她”会造成不必要的混乱。明示人物只展开上下文已经给出的指代，不引入额外解释，也不改变叙事关系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留第二人称“你”，符合本段向摩西追述其身世的叙事框架；本节无需脚注。
