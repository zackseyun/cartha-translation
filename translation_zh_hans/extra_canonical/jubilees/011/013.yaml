  text: And they arose in the night and wanted to save their gods from the midst of the fire. And Haran rushed
translation:
  language: zh_hans
  text: 他们在夜间起来，想从火中救出自己的诸神。哈兰便猛然奔去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈兰便猛然奔去”也可译作“哈兰冲了过去”或“哈兰跑去”。这句话在内容上承接下一节；有些分节将其视为第14节的开头。
    reason: 说明动词可译为急奔、猛冲或跑去，并提示现存文本传统中的分节问题，而不改变本节所给源文的译出。
lexical_decisions:
- source_word: አማልክቲሆሙ
  choice: 自己的神明
  rationale: 原词意为“他们的诸神”。译作“自己的神明”既保留复数所表达的多神背景，也以自然汉语传达所属关系，不擅自改译为带强烈贬义的“偶像”或具体化为“神像”。
- source_word: ወሰረረ
  choice: 冲了过去
  rationale: 该动词有跃起、奔去、冲去之意；上下文描述哈兰仓促冲向火场，故“冲了过去”比一般的“跑了”更能传达动作的急迫性，同时不补出原文此处未明说的目的地。
- source_word: አራን
  choice: 哈兰
  rationale: 按《创世记》11:27中亚伯兰兄弟的通行中文名译作“哈兰”；吉兹文形式未标示词首喉音，不必据此另造中文人名。
theological_decisions:
- issue: 如何称呼他们试图从火中救出的对象
  choice: 神明
  alternative: 偶像／神像
  rationale: 原文用通常表示“诸神”的名词，而非明确表示雕像或偶像的词。保留“神明”可维持叙事中的反讽与神学张力，不在翻译中预先替叙述者作贬义解释。
translation_notes:
  register: 采用自然、庄重的现代汉语。前两句保持原文并列推进的叙事节奏；末句保留突然而未交代去向的表达，以免把下一节的信息提前补入本节。
