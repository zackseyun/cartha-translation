  text: And if I tell them the truth, they will kill me, for their souls are attached to them.
translation:
  language: zh_hans
  text: 如果我把实情告诉他们，他们就会杀我，因为他们的心灵依附着它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ
  choice: 实情
  rationale: 此处指说出真实情况或真相；译作“实情”符合现代汉语叙事语境，也避免把该词抽象化为神学意义上的“公义”。
- source_word: ነፍሶሙ
  choice: 他们的心
  rationale: 字面为“他们的灵魂/性命”，在“依恋”这一搭配中指人的内在意志与情感；汉语以“心”表达较为自然。
- source_word: ተለውት … ኀቤሆሙ
  choice: 依恋着那些偶像
  rationale: 保留“附着、依恋于它们”的核心意象；代词所指承接上文的偶像，明示为“那些偶像”可避免汉语歧义，但不增添“敬拜”等原文未明说的结果。
theological_decisions:
- issue: 末句是否明确表达敬拜偶像
  choice: 仅译为“心依恋着那些偶像”
  alternative: “他们的心依附那些偶像，以致敬拜它们”
  rationale: 源文只表达内心与它们相连或依恋，并未在本节明确说“敬拜”；不作解释性扩充，以保留原文的含蓄和张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“实情”比“真理”更贴合人物担忧说真话而遭杀害的具体语境；“心依恋着”自然传达内在执着。
