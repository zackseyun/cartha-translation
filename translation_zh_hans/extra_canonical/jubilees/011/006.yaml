  text: for those who make them, and a straying of heart for those who worship them. Do not worship them.” And his father said to him[6], “I also know, my son, but what can I do for a people who have made me subject to them?
translation:
  language: zh_hans
  text: 这归给制造它们的人；敬拜它们的人有心里的迷失。[a]不要敬拜它们。”他的父亲对他说：“我儿，我也知道；可是，面对使我不得不听命于他们的百姓，我又能怎么办呢？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头承接上一节。吉兹文本的句法较难，直译可作：“给制造它们的人，以及给敬拜它们的人心里的迷失。”
    reason: textual_difficulty
  - marker: b
    text: “使我不得不听命于他们”也可译作“使我受他们支配”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሕተት፡ ልብ
  choice: 心里迷失
  rationale: 该短语直指“心的偏离、迷失”；译文保留其内在方向偏差的意象，不将其限定为某一特定罪名。
- source_word: አታምልክዎሙ
  choice: 不要敬拜它们
  rationale: 否定命令式；“它们”承接偶像，符合现代汉语。
- source_word: ወምነት፡ እሬሲ
  choice: 可是……我能怎么办呢
  rationale: 对应“我能做什么”，以自然的反问表达父亲的无奈。
- source_word: እትአዘዝ
  choice: 使我不得不听命于他们
  rationale: 该动词表示服从、受支配，而非“犯错”或“走迷”；加入“不得不”传达使役与被迫服从的语义。
theological_decisions:
- issue: 偶像崇拜者“心里迷失”的因果表达
  choice: 保留为偶像及其制造、敬拜所带来的迷失，不明确指定神为使其迷失的主体
  alternative: 译作“神使他们的心迷失”
  rationale: 吉兹文该处没有明说神是施事者；不应补入可能引发神学定论的主语。
- issue: 父亲与百姓的关系
  choice: 译作百姓使他听命于他们
  alternative: 译作百姓使他在他们面前犯错
  rationale: እትአዘዝ 的词义是服从或受支配；译文不把社会压力改写为道德过失。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句因承接上一节而在汉语中补出“这……不利”，以避免残句；脚注保留原文句法上的困难。对父亲的话使用口语化但不轻佻的反问，呈现其无奈。
