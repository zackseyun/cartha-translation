  yaml_path: translation/extra_canonical/jubilees/011/012.yaml
  text: In that fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no person knew it.
translation:
  language: zh_hans
  text: 在那个第四个七年期的第四年，亚伯兰夜间起来，烧毁了偶像之屋，又烧掉了屋里的一切；没有人知道这事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ፡ ራብዕ
  choice: 第四个七年期
  rationale: “ሱባዔ”字面义为“七、周”，在《禧年书》的年代计算中指由七年组成的周期；译作“七年期”既显明计年方式，也比单说“周”更易懂。
- source_word: ቤተ፡ ጣዖታት
  choice: 供奉偶像的屋宇
  rationale: 原文是“偶像之屋”，未明确使用专指圣殿的词；此译自然表达其用途，同时避免把它过度具体化为规模较大的“庙宇”或“神殿”。
- source_word: አውዐየ
  choice: 烧毁／烧掉
  rationale: 该动词在本句重复出现，表示用火焚烧；根据宾语分别译为“烧毁了……屋宇”和“烧掉了……一切”，保留动作重复而符合现代汉语搭配。
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: 没有人知道这事
  rationale: 直接保留原文“无人知道”的陈述；“这事”自然指代亚伯兰夜间焚烧的行动。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。把纪年术语明确译为“七年期”，并保留原文对两次焚烧动作的并列叙述。源文开头孤立的“አብራም”按章节切分证据视为上一节末尾的重复残片，不纳入本节正文。
