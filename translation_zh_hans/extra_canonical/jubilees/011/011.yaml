theological_decisions:
- issue: “他一生的第六十年”中代词的所指
  choice: 保留“他”
  alternative: 译作“亚伯兰一生的第六十年”或明确指定其他人物
  rationale: 所给吉兹语文本只含第三人称所有格，并未出现“亚伯兰”等具体姓名；保留代词可忠实维持原文在本节内的指代含混。
