  rationale: 采用该圣经人名在现代简体中文中的通行译法。
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: 娶了妻
  rationale: 原文直义为“为自己取了一个妻子”；汉语用“娶了妻”自然、准确，且不增添原文没有的信息。
- source_word: ወበዓመት፡ ዘስሳ፡ ዘሕይወቱ
