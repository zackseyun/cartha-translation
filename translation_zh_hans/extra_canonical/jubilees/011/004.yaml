    6. ለእለ፡ ይገብርዎሙ፡ ወከሕተት፡ ልብ፡ ለእለ፡ ያመልክዎሙ፡ አታምልክዎሙ፡ ወይቤሎ፡ አቡሁ፡ አነሂ፡ አእምር፡ ወልድየ፡ ወምነት፡ እሬሲ፡ ለሕዝብ፡ እለ፡ ረሰዩኒ፡ እትአዘዝ፡

    7. ቅድሜሆሙ። ወእመ፡ ነገርክዎሙ፡ ጽድቀ፡ ይቀትሉኒ፡ እስመ፡ ተለውት፡ ነፍሶሙ፡ ኀቤሆሙ፡

    8. ከመ፡ ያምልክዎሙ፡ ወይስብሕዎሙ፡ አርምም፡ ወልድየ፡ ከመ፡ አይቅትሉከ። ወነገረ፡

    9. ዘንተ፡ ነገረ፡ ለክልኤ፡ አሐዊሁ፡ ወተምዑ፡ ላዕሌሁ፡ ወአርመሙ። ወበአርብዓ፡ አዮቤልዉ፡ በሱባዔ፡ ካልእ፡ በሳብዕ፡ ዓመት፡ ሎቱ፡ ነሥአ፡ ሎቱ፡ አብራም፡ ብእሲተ፡ ወስማ፡ ሶራ፡ ወሰተ፡

    10. አቡሁ፡ ወኮነት፡ ሎቱ፡ ብእሲተ። ወአሬን፡ እኁሁ፡ ነሥአ፡ ሎቱ፡ ብእሲተ፡ በዓመት፡ ሣልስ፡ ዘሱባዔ፡ ሣልስ፡ ወወለደት፡ ሎቱ፡ ወልደ፡ በዓመት፡ ሳብዕ፡ ዘሱባዔ፡ ዝንቱ፡ ወጸውዐ፡

    11. ስሞ፡ ሎጥ። ወናኮር፡ እኁሁ፡ ነሥአ፡ ሎቱ፡ ብእሲተ። ወበዓመት፡ ዘስሳ፡ ዘሕይወቱ፡

    12. አብራም፡ ውእቱ፡ ሱባዔ፡ ራብዕ፡ በዓመት፡ ራብዕ፡ ሎቱ፡ ተንሥአ፡ አብራም፡ በሌሊት፡ ወአውዐየ፡ ቤተ፡ ጣዖታት፡ ወአውዐየ፡ ኵሎ፡ በውስተ፡ ቤት፡ ወሰብእ፡ አልቦ፡ ዘአእመረ።

    13. ወተንሥኡ፡ በሌሊት፡ ወፈቀዱ፡ ያድኅኑ፡ አማልክቲሆሙ፡ እማእከለ፡ እሳት። ወሰረረ፡ አራን፡

    14. ከመ፡ ያድኅኖሙ፡ ወነደደ፡ እሳት፡ ላዕሌሁ፡ ወውዐየ፡ በእሳት፡ ወሞተ፡ በኡር፡ ዘከለዳዊያን፡

    15. በቅድመ፡ ታራ፡ አቡሁ፡ ወቀበርዎ፡ በኡር፡ ዘከለዳዊያን። ወወፅአ፡ ታራ፡ እምነ፡ ኡር፡ ዘከለዳዊያን፡ ውእቱ፡ ወውሉዱ፡ ከመ፡ ይምጽኡ፡ ውስተ፡ ምድረ፡ ሊባኖስ፡ ወውስተ፡ ምድረ፡ ከናአን፡ ወኀደረ፡ ውስተ፡ ምድረ፡ ካራን፡ ወኀደረ፡ አብራም፡ ምስለ፡ ታራ፡ አቡሁ፡ ውስተ፡ ካራን፡

    16. ክልኤ፡ ሱባዔ፡ ዓመታት። ወበሳድስ፡ ሱባዔ፡ በዓመት፡ ኃምስ፡ ሎቱ፡ ነበረ፡ አብራም፡ በሌሊት፡ በሠርቀ፡ ወርኅ፡ ሳብዕ፡ ከመ፡ ያበይነ፡ ከዋክብተ፡ እምበርክ፡ እስከ፡ ነግህ፡ ከመ፡ ይርአይ፡ ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት፡ ወሀሎ፡ ውእቱ፡ ባሕቲቱ፡ ይነብር፡'
