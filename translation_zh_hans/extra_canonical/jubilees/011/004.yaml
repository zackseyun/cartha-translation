    text: “玛斯特玛”是名字的音译；此处称他为“首领”，表明他统辖并差遣其他灵。
    reason: 说明音译专名及“首领”的职能含义，而不将其直接等同于任何后期神学称号。
  revision_rationale: 修订仅消除两处不必要的解释性收窄：以“在地上流血”保留英语审校轨迹的地点与“流血”表达，并以“行各样的谬妄”改善现代汉语搭配且维持三项并列。其余专名、统辖关系和强力主动的语气均保留。
