  yaml_path: translation/extra_canonical/jubilees/011/004.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits, those set under his hand, to do every kind of error and sin and transgression, to corrupt and destroy and to shed blood upon the earth.
translation:
  language: zh_hans
  text: 首领玛斯特玛[a]竭力促成这一切；他又差遣手下的其他灵去制造各种错谬、罪恶和过犯，败坏人，毁灭人，并在地上流人的血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛斯特玛”是名字的音译；此处称他为“首领”，表明他统辖并差遣其他灵。
    reason: 帮助普通读者理解音译专名及“首领”的职能含义，同时避免将其直接等同于某一后期神学称号。
lexical_decisions:
- source_word: Mastema
  choice: 玛斯特玛
  rationale: 按专名音译，避免把这个名字直接解释成“敌意”或“控告”，从而消除其作为人物名称的性质。
- source_word: prince
  choice: 首领
  rationale: 表达其对属下诸灵的统辖地位；比“王子”更符合此处职能，也不额外引入王室血统含义。
- source_word: exerted himself
  choice: 竭力促成
  rationale: 自然表达其主动而强力地推动前述恶事，同时避免误解为所有行动都由他亲自执行。
- source_word: error and sin and transgression
  choice: 错谬、罪恶和过犯
  rationale: 保留三个并列的道德—宗教性概念，不将它们合并成笼统的“作恶”。
- source_word: spirits, those set under his hand
  choice: 手下的其他灵
  rationale: 以现代汉语简洁表达这些灵受玛斯特玛支配和差遣的关系。
- source_word: shed blood
  choice: 流人的血
  rationale: 保留圣经语体中“流血”的暴力与杀人含义，并明确受害者为人。
theological_decisions:
- issue: 玛斯特玛的身份与权柄
  choice: 称为“首领”，并说诸灵在他“手下”
  alternative: 译作“玛斯特玛王”或“魔王玛斯特玛”
  rationale: “首领”保留统辖含义，却不把他等同于后期神学体系中的特定“魔王”，也不暗示王族身份。
- issue: 玛斯特玛与恶事的因果关系
  choice: “竭力促成这一切；他又差遣……”
  alternative: “亲自做了这一切”
  rationale: 既体现其积极推动和责任，又保留后半句所显示的代理行动，即具体恶事由受差遣的灵实施。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原句层层推进的结构和“错谬、罪恶、过犯”三项并列。所提供的吉兹文摘录未包含本节正文，因此本稿只能依据给出的英语审校层拟定；未对缺失的原文形态作无根据的断言。
