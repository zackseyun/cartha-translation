  text: He told this matter to his two brothers[9], and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of his father, and she became his wife.
translation:
  language: zh_hans
  text: 他把这事告诉了他的两个兄弟；他们向他发怒，并且默不作声。第四十个禧年，第二个七年期的第七年，亚伯兰为自己娶了妻子；她名叫撒莱，是他父亲的女儿[a]，并成了他的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他父亲的女儿”依所传文本保留，未按《创世记》的相关记载加以调和；这里可能存在文本问题，也可能反映这一传统中不同的亲属称谓方式。
    reason: textual_variant
lexical_decisions:
- source_word: ዘንተ፡ ነገረ
  choice: 他把这事告诉了
  rationale: 按“这事”作前置宾语理解，补出汉语所需的主语“他”，保留原文叙事承接。
- source_word: ለክልኤ፡ አሐዊሁ
  choice: 他的两个兄弟
  rationale: 准确表达数词“两个”和所属关系“他的”。
- source_word: ወተምዑ፡ ላዕሌሁ
  choice: 他们便向他发怒
  rationale: 保留复数主语以及怒气针对他的关系；“便”自然承接前一动作。
- source_word: ወአርመሙ
  choice: 却一言不发
  rationale: 该动词为第三人称复数，所指仍是两个兄弟；用现代汉语自然表达“保持沉默”，不误译为单数“他沉默”。
- source_word: አዮቤልዉ
  choice: 禧年
  rationale: 采用《禧年书》及圣经年代语境中通行的译法。
- source_word: በሱባዔ፡ ካልእ
  choice: 第二个七年期
  rationale: 此处“周”是七年单位；明译为“七年期”可避免现代读者误解为七天的一周。
- source_word: ነሥአ፡ ሎቱ፡ አብራም፡ ብእሲተ
  choice: 亚伯兰为自己娶了妻子
  rationale: 保留“为自己取妻”的反身意味，同时使用自然庄重的现代汉语。
- source_word: ሶራ
  choice: 撒莱
  rationale: 依其人物身份采用现代中文圣经中通行的专名形式，而非按吉兹语表面拼作“索拉”。
theological_decisions:
- issue: 撒莱与亚伯兰的亲属关系
  choice: 保留“是他父亲的女儿”并加注
  alternative: 按《创世记》11:29或20:12调和为其他亲属表述
  rationale: 不以正典平行经文改写本传统所传文字，也不替读者消解其亲属称谓所造成的张力。
- issue: 沉默者的身份
  choice: 按复数译为“他们……一言不发”
  alternative: 译为“他沉默不语”
  rationale: 吉兹语动词为第三人称复数，语法上承接两个兄弟，不应按旧译改作单数。
translation_notes:
  register: 采用简体中文现代标准书面语，保持经外古代叙事应有的庄重与清晰。年代公式以“禧年—七年期—年”分层表达；句式适度现代化，但不消除原文的文本张力。
