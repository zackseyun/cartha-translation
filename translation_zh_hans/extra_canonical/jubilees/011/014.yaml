lexical_decisions:
- source_word: ከመ፡ ያድኅኖሙ፡
  choice: 为要救他们
  rationale: 保留目的关系及第三人称复数宾语；本节片段承接上文，故采用自然的承接表达。
- source_word: ወነደደ፡ እሳት፡ ላዕሌሁ፡
  choice: 火却在他身上燃起
  rationale: 贴近“火燃起/被点燃在他之上”的字面结构，同时用现代汉语表达灾火临到他；“却”显出救人意图与自身遭火之间的转折。
- source_word: ወውዐየ፡ በእሳት፡
  choice: 他被火烧死
  rationale: 该动词在此语境表示遭火焚烧；与随后“死”合并为自然汉语，避免生硬重复，同时不改变死亡由火造成的意思。
- source_word: ወሞተ፡ በኡር፡ ዘከለዳዊያን፡
  choice: 死在迦勒底人的吾珥
  rationale: “迦勒底人的吾珥”是该地名的传统且清楚的汉语表达，保留所属结构。
