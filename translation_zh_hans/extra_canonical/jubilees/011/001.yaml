  yaml_path: translation/extra_canonical/jubilees/011/001.yaml
  text: In the thirty-fifth jubilee[1], in the third week, in its first year, Reu took for himself a wife, and her name was Ora, the daughter of Ur, the son of Kesed. And she bore him a son, and he called his name Seroh, in the seventh year of this week, in this jubilee.
translation:
  language: zh_hans
  text: 在第三十五个禧年[a]的第三个七年期，也就是这七年期的第一年，拉吴娶了一个妻子。她名叫奥拉，是基薛之子乌尔的女儿。她给拉吴生了一个儿子；就在这禧年的这个七年期的第七年，拉吴给他取名叫西鹿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语文本作“第三十五个禧年”（其词形也可能已有讹误）；这里依《禧年书》内部年代次序采用“三十五”，而不作“七十五”。
    reason: 文本校勘
lexical_decisions:
- source_word: እዮቤልው
  choice: 禧年
  rationale: 按《禧年书》的纪年术语译为“禧年”；这里指禧年周期，保留传统且易识别的名称。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词本义与“七”或“七个一组”有关，在本节纪年公式中指由七年组成的周期；译作“七年期”比直译“周”更能避免现代读者误解为七天。
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: 娶了一个妻子
  rationale: 原文表达“为自己取了一个女子为妻”，现代汉语以“娶了一个妻子”自然传达其含义。
- source_word: ራግው
  choice: 拉吴
  rationale: 对应圣经谱系中的 Reu，采用现代中文圣经常见译名。
- source_word: ኦራ
  choice: 奥拉
  rationale: 依吉兹语音形作中文音译。
- source_word: ኡር
  choice: 乌尔
  rationale: 此处是人名而非地名，按音译作“乌尔”，避免与地名“吾珥”混同。
- source_word: ኬሴድ
  choice: 基薛
  rationale: 依人名 Kesed 的音形译写，并与其后裔关系保持清楚。
- source_word: ሴሮኅ
  choice: 西鹿
  rationale: 对应圣经谱系中的 Serug/Seroh，采用现代中文圣经常见译名。
theological_decisions:
- issue: 禧年纪年的数词文本
  choice: 第三十五个禧年
  alternative: 第七十五个禧年
  rationale: 现有吉兹语文本的数词指向“三十五”，也符合《禧年书》内部谱系年代的连续次序；不采用先前草稿的“七十五”。
- issue: 亲属关系的句法归属
  choice: 奥拉是基薛之子乌尔的女儿
  alternative: 奥拉是乌尔和基薛的女儿
  rationale: 原文连续属格结构及谱系逻辑均表明乌尔是基薛之子，奥拉则是乌尔之女。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。纪年公式以“禧年”和“七年期”表达，使普通读者能辨明这是七年周期而非七天的一周；保留原文重复的时间定位，但调整语序以符合汉语习惯。
