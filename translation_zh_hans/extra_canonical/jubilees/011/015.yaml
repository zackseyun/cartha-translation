  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: zh_hans
  text: 他死在父亲他拉之前。人们把他葬在迦勒底人的吾珥。他拉和他的儿子们离开迦勒底人的吾珥，要前往黎巴嫩地和迦南地；他定居在哈兰地。亚伯兰与父亲他拉一同住在哈兰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ፡ ታራ፡ አቡሁ
  choice: 死在父亲他拉之前
  rationale: 原文直译为“在他父亲他拉之前”，承接上文的死亡叙述；补出汉语所需的“死”，使本节开头自然，同时保留先于父亲去世的时间关系。
- source_word: ኡር፡ ዘከለዳዊያን
  choice: 迦勒底人的吾珥
  rationale: 采用现代中文圣经地名的通行译法，并准确表达属格关系。
- source_word: ይምጽኡ
  choice: 前往
  rationale: 表达他们出发的目的，语气自然且不额外断定最终抵达。
- source_word: ምድረ፡ ሊባኖስ / ምድረ፡ ከናአን
  choice: 黎巴嫩地和迦南地
  rationale: 保留原文两次出现的“地”这一地理表述，在中文中合并连接而不损失信息。
- source_word: ወኀደረ
  choice: 定居／住
  rationale: 该词在两个分句中均表示居住；按主语与语境分别译为“定居”和“住”，使中文流畅而不改变含义。
