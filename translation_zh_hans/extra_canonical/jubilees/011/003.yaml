base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/003.yaml
  text: And in the days of Serug there arose wars and all the sons of men turned to making graven images and carved images and unclean things, and evil spirits were helping them and leading them astray, so that they might commit transgression and uncleanness.
translation:
  language: zh_hans
  text: 在西鹿[a]的日子，战争兴起；世人都转去制造雕刻的偶像、刻制的像和不洁之物。邪灵帮助他们，引诱他们走入歧途，使他们犯下过犯和污秽之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西鹿”亦译“瑟罗赫”。
    reason: 保留英文审校轨迹所记录的另一种人名译法，同时不将其断定为文本传写异文；正文采用与《创世记》11章相符的通行名称。
lexical_decisions:
- source_word: Serug
  choice: 西鹿
  rationale: 采用《创世记》11章族谱中该人名的通行简体中文译名，并与本章上下文保持一致。
- source_word: sons of men
  choice: 世人
  rationale: 用自然的现代汉语表达全体人类，而不把闪语式表达生硬直译为“人的众子”。
- source_word: graven images and carved images
  choice: 雕刻的偶像、刻制的像
  rationale: 保留原文并列的两类造像用语，不擅自合并其可能的语义差别。
- source_word: evil spirits
  choice: 邪灵
  rationale: 简洁保留其超自然恶性主体的含义，不增添特定宗派的解释。
- source_word: transgression and uncleanness
  choice: 过犯和污秽之事
  rationale: 保留道德越界与不洁这两个并列概念及其张力。
theological_decisions:
- issue: 邪灵与人的责任之间的关系
  choice: 译作“帮助他们，引诱他们走入歧途，使他们犯下……”
  alternative: 译作“迫使他们犯罪”
  rationale: 保留邪灵助长和诱导的作用，同时不把人的行为改写为完全受强迫，从而避免消解文本中的责任张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；分号区分战争兴起与世人造像两层叙述，避免过度古雅。
