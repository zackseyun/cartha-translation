  verdict: revise
  source_fidelity: 正文准确保留吉兹语中第三人称复数施事与复数受事：“他们敬拜它们，颂赞它们”。命令句宜将“我儿”作为呼语，并使整段维持承接前文的引语状态。
  naturalness: “我儿，你不要作声”可懂，但“你要安静，我儿”更贴近命令加呼语的语序，也较为自然庄重。原译在“我儿”前新开引号，会错误地将前面的目的从句排除在同一引语之外；末尾“于是他告诉了……”不够自然，改为“于是他接着讲述……”可在不补足原文未展示内容的情况下保留句子未完。
  terminology: “敬拜”“颂赞”准确且符合宗教叙事的庄重语域。“它们”保留原文复数宾语的指向，虽中文可省略，仍属合宜。
  issues:
  - severity: medium
    issue: 引号范围错误
    rationale: 本节开头承接前文引语，英文审校文本在“杀你”后保留闭引号。草稿却在“我儿”前另开引号，造成“好让他们敬拜它们，颂赞它们”被误作引语外叙述。应以省略号及闭引号显示其为承接的引语。
  - severity: low
    issue: 末句中文搭配不完整
    rationale: “于是他告诉了……”在中文中缺少必要的受事或内容，读来生硬。以“于是他接着讲述……”表达原文“他告诉／讲述”并用省略号保留节选中断，较自然而不擅自添加具体内容。
  - severity: low
    issue: 脚注将已提供文本说成主语人称歧义
    rationale: 所提供的吉兹语形态及英文审校结论均支持第三人称复数。脚注可作为既有译法的异译记录，但不应声称当前所给源文本身存在已证实的人称歧义。
  revised_text: ……好让他们敬拜它们，颂赞它们。你要安静，我儿，免得他们杀了你。”于是他接着讲述……
