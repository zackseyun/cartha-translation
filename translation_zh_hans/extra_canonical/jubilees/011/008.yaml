- from: 好让他们敬拜它们，颂赞它们。[a]“我儿，你不要作声，免得他们杀你。”于是他告诉了……
  to: ……好让他们敬拜它们，颂赞它们。你要安静，我儿，免得他们杀了你。”于是他接着讲述……
