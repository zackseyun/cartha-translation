lexical_decisions:
- source_word: ያምልክዎሙ
  choice: 他们敬拜它们
  rationale: 按动词形式及其宾语后缀表达第三人称复数施事和第三人称复数宾语；中文重复代词，以保留原文指代关系。
- source_word: ይስብሕዎሙ
  choice: 颂赞它们
  rationale: ይስብሕ 表示赞美、颂赞；采用较庄重而现代的“颂赞”，并保留复数宾语。
- source_word: አርምም
  choice: 不要作声
  rationale: 这是要求保持沉默的命令；“不要作声”自然传达其警戒语气。
- source_word: ወነገረ
  choice: 于是他告诉了……
  rationale: 原文在本节所给片段中止于“他告诉/讲述”，故用省略号表明句意延续，不擅自补出宾语或内容。
theological_decisions:
- issue: 敬拜与颂赞的主语
  choice: 他们
  alternative: 你
  rationale: 所给吉兹语动词形态及经审核的源文复核支持第三人称复数；脚注保留传统或另一种形态分析所产生的第二人称译法。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“我儿”保留亲子称呼的凝练语气；末尾用省略号明确本条目是跨节或跨句的未完片段。
