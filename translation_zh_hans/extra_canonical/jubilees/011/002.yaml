  yaml_path: translation/extra_canonical/jubilees/011/002.yaml
  text: And the son grew[2], and his father taught him the investigations of the Chaldeans, to divine and to practice augury according to the signs of heaven.
translation:
  language: zh_hans
  text: 儿子渐渐长大[a]，父亲教他迦勒底人的占察之术，使他能按天象占卜、观兆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹文在第1节后直接接第6节，缺少第2—5节。本节依现存节号、上下文以及关于西鹿、迦勒底占卜和玛斯提玛参与偶像崇拜的预期中间内容译出。
    reason: 说明底本文本分段缺失，以及本节据篇章脉络重构的性质。
lexical_decisions:
- source_word: the investigations of the Chaldeans（本节吉兹文缺失，据篇章脉络所存意义）
  choice: 迦勒底人的占察之术
  rationale: “占察”兼顾观察、推究天象及其占卜用途；加“之术”使现代汉语自然，同时不将其窄化为单一技术。
- source_word: to divine
  choice: 占卜
  rationale: 准确表达借天象预知或判断吉凶的行为。
- source_word: to practice augury
  choice: 观兆
  rationale: 保留与“占卜”相关但不完全相同的察看征兆之意，避免把两个并列概念合并。
- source_word: signs of heaven
  choice: 天象
  rationale: 自然、简洁地表达天空中的征象，符合古代迦勒底占星语境。
theological_decisions:
- issue: 本节缺文及其宗教评价
  choice: 仅陈述父亲教授迦勒底占察之术，不增添褒贬
  alternative: 依据后文偶像崇拜与玛斯提玛的主题，明说这是邪术或罪恶
  rationale: 现有重构只描述所学内容；译文保留叙事张力，不把后文的神学评价提前写入本节。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“占卜、观兆”保留原义中两项相关但有区别的活动；脚注明示本节在所给吉兹文材料中缺失，避免把重构内容当作直接存留的原文。
