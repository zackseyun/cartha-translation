  text: And Aran his brother took for himself a wife in the third year of the third week, and she bore him a son in the seventh year of this week, and he called his name Ur.
translation:
  language: zh_hans
  text: 他的兄弟哈兰在第三个七年期的第三年娶了妻子；她在这个七年期的第七年给他生了一个儿子，他给他取名叫乌尔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据吉兹文在本节末止于“他就称呼”；“给他取名叫乌尔”依据紧接下文补出，以完整呈现原句。
    reason: 说明底本文本的章节切分使句子在动词后中断，以及本译文据相邻文本恢复完整命名句。
lexical_decisions:
- source_word: አሬን
  choice: 哈兰
  rationale: 按该人物通常对应的闪族人名 Haran 音译；此处指亚伯兰的兄弟。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词指由七年组成的周期；译作“七年期”既准确又便于现代读者理解。
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: 娶了妻子
  rationale: 原文直译为“为自己取了一个女人/妻子”，在婚姻语境中自然译为“娶了妻子”。
- source_word: ወለደት፡ ሎቱ፡ ወልደ
  choice: 给他生了一个儿子
  rationale: 保留原文“为他生子”的关系表达，同时符合现代汉语。
- source_word: ወጸውዐ
  choice: 他给儿子取名叫
  rationale: 原文为“他称呼/他叫”，结合紧邻文本补足命名对象和名字，使本节句意完整。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第三个七年期的第三年”保留《禧年书》的年代计算方式。所给原文开头“他父亲……成了他的妻子”属于上一句残片，未纳入本节正文；末尾命名句则按相邻文本及既定节次校订补全。
