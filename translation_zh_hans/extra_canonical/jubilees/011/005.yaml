base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/005.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits—those placed under his hand—to do all manner of wrong and sin and all manner of transgression, to corrupt and destroy, and to shed blood on the earth.
translation:
  language: zh_hans
  text: 玛斯提玛首领竭力促成这一切，又差遣别的灵，就是那些置于他权下的灵，去行各样不义、罪恶和各样过犯，败坏并毁灭人，使地上流血。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince Mastema
  choice: 玛斯提玛首领
  rationale: “首领”自然表达其统辖属下诸灵的身份，又避免把该称号误解为世俗王室中的“王子”。
- source_word: exerted himself
  choice: 竭力促成
  rationale: 既保留主动尽力的语义，也与宾语“这一切”自然衔接。
- source_word: spirits—those placed under his hand
  choice: 别的灵，就是那些置于他权下的灵
  rationale: 保留同位解释结构，并明确“在手下”所表示的管辖关系。
- source_word: wrong and sin and ... transgression
  choice: 不义、罪恶和过犯
  rationale: 保留三个相互关联而不完全等同的伦理及宗教用语，不将其合并为单一概念。
- source_word: to corrupt and destroy
  choice: 使人败坏、灭亡
  rationale: 用现代汉语表达两个递进性的破坏结果；补出泛指的“人”，使句意清楚而不限定具体对象。
- source_word: to shed blood on the earth
  choice: 在地上流血
  rationale: 保留经文常见的“流血”表达及其暴力、杀戮含义。
theological_decisions:
- issue: 玛斯提玛的位格与地位
  choice: 以人格化的“他”指称，并译其称号为“首领”
  alternative: 译为非人格力量，或称“玛斯提玛王子”
  rationale: 上下文说他差遣受其管辖的灵，显示其为具有意志和统辖权的属灵存在；“首领”比现代汉语中的“王子”更符合此处职权性称号。
- issue: 邪灵行动与人的败坏之间的关系
  choice: 按文本陈述邪灵受差遣去促成人的败坏、灭亡和流血
  alternative: 补写为邪灵强制人犯罪，或淡化为仅仅诱惑人
  rationale: 原句说明其目的和行动，却未细定人的责任、自由或受迫程度，因此不作超出文本的神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原句连续列举的力度，同时以“就是”清楚呈现对“别的灵”的补充说明。所给吉兹语材料在标号上从前一节直接跳至第6节，未包含本节正文，因此本稿依据经审校并已纠正错配问题的英文咨询层重建，不采用其中已与现行正文无关的旧脚注。
