  timestamp: '2026-07-14T09:56:33Z'
review_pass:
  verdict: revise
  source_fidelity: 所给吉兹语摘录在节号上未呈现本节正文，无法直接逐词核对；据已纠正的英文审校底本，本译准确保留了玛斯提玛差遣受其管辖之灵，实行不义、罪恶、过犯、败坏、毁灭及流血的连续行动。惟“使人……灭亡”略将“毁灭”弱化为结果状态，宜明确其施事性的毁灭行动；“在地上流血”也可更清楚表达“使地上流血”的杀戮含义。
  naturalness: 原译整体庄重、通顺。“玛斯提玛首领”可理解，但现代汉语中“首领玛斯提玛”更自然，且仍保留该称号的职权意味。修订后用平行的动词结构呈现原文列举，语义更清晰。
  terminology: “灵”“不义”“罪恶”“过犯”“败坏”“毁灭”均为合宜且彼此可区分的经文用语。“首领”可译 prince 的统辖性称号，不引入世俗王室含义。
  issues:
  - severity: low
    issue: “使人败坏、灭亡”未充分表达“毁灭”的施事性。
    rationale: 英文审校底本的“to corrupt and destroy”并列描述受差遣之灵的行动；“灭亡”较容易被读作人自行进入的状态。改为“败坏并毁灭人”更明确而不增添解释。
  - severity: low
    issue: “在地上流血”可能表面上指这些灵自身流血。
    rationale: “to shed blood on the earth”指造成杀戮、使血流在地上；译作“使地上流血”更明确保留该行动的使成意义。
  revised_text: 玛斯提玛首领竭力促成这一切，又差遣别的灵，就是那些置于他权下的灵，去行各样不义、罪恶和各样过犯，败坏并毁灭人，使地上流血。
