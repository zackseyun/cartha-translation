revisions:
- from: 玛斯提玛首领竭力促成这一切，又差遣别的灵，就是那些置于他权下的灵，去行各样不义、罪恶和过犯，使人败坏、灭亡，并在地上流血。
  to: 玛斯提玛首领竭力促成这一切，又差遣别的灵，就是那些置于他权下的灵，去行各样不义、罪恶和各样过犯，败坏并毁灭人，使地上流血。
  rationale: 依据英文审校底本作两处轻微的语义澄清：将“毁灭”保留为灵所施行的行动，并将“shed blood”明确为造成地上流血。未添加关于邪灵、人的责任或“这一切”所指内容的神学解释。
