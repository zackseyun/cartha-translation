  text: for two weeks of years.[16] And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains, and he was there by himself as he sat and watched.
translation:
  language: zh_hans
  text: 共两个七年期。[a]在第六个七年期的第五年，第七个月初，亚伯兰整夜坐着察看星辰，从傍晚直到黎明，要看这一年的雨水情形如何。他独自坐在那里察看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面为“两个年之七期”，也就是两个七年期。《禧年书》常用这种单位计算时间。
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤ፡ ሱባዔ፡ ዓመታት
  choice: 共两个七年期
  rationale: 字面为“两个年之七期（weeks of years）”，即两个以七年为单位的时期；用“七年期”既清楚又保留《禧年书》的纪年方式。
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: 第七个月初
  rationale: ሠርቀ 可指月的升起或月初；在历法语境中译作“月初”最自然，同时不具体限定某一日。
- source_word: ከመ፡ ያበይነ፡ ከዋክብተ
  choice: 察看星辰
  rationale: 动词在此表示辨察、考察；“察看”保留有目的的观测意味，但不额外断定具体的占星技术。
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: 这一年的雨水会怎样
  rationale: ግብረ 在此是年景、情形或表现；现代汉语如此表达简明自然，并保留对年度降雨状况的关注。
- source_word: ሀሎ፡ ውእቱ፡ ባሕቲቱ፡ ይነብር
  choice: 他独自一人坐在那里
  rationale: 紧贴“他在那里，独自坐着”的结构，不额外加入原文未明说的“继续观察”。
theological_decisions:
- issue: 亚伯兰察看星辰的行为性质
  choice: 仅叙述他察看星辰以判断雨水
  alternative: 明确译成占星、占卜或天文观测
  rationale: 原文描述其目的，却没有在本节明确给这一行为作神学或技术分类；译文不应替文本作出判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“七年期”统一呈现本书的周期纪年法；保留开头承接上文的简短句式，不擅自补足其所指事件。
