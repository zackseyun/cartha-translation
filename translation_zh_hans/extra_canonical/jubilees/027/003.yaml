  yaml_path: translation/extra_canonical/jubilees/027/003.yaml
  text: and until he turns his anger away from you and he forgets all that you did to him. Then I will send and bring you back from there.”
translation:
  language: zh_hans
  text: 直到他不再向你发怒[a]，忘了你对他所做的一切。那时，我就派人去，把你从那里接回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到你哥哥的怒气离开你”。
    reason: 保留将“怒气”理解为离去主体的传统译法；不过原文格位更支持把“怒气”视为动词的宾语。
lexical_decisions:
- source_word: የኀድግ፡ መዐተ፡ እምኔከ
  choice: 他不再向你发怒
  rationale: “怒气”在句中作动词的宾语，不宜处理为主动离去的主语；汉语以“不再向你发怒”自然表达他撤去针对对方的怒气，同时保留动作主体为“他”。
- source_word: ይረስዕ፡ ኵሎ፡ ዘመጠነ፡ ረሰይኮ
  choice: 忘了你对他所做的一切
  rationale: 按原文次序和范围表达“忘记一切你对他所做的”，不弱化“一切”的概括性。
- source_word: ፈነውየ፡ አቄብለከ፡ እምህየ
  choice: 我就派人去，把你从那里接回来
  rationale: 使役结构表示说话者差人将对方从该处带回；“派人去……接回来”符合现代汉语习惯，也保留“从那里”的空间指向。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“直到”承接上文的时间条件；“那时”明确随后发生的差遣和接回行动。引号结尾表明本节位于一段直接引语的末尾。
