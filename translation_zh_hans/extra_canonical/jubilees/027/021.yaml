lexical_decisions:
- source_word: ይናዘዛ
  choice: 安慰
  rationale: 该动词在本句中表示抚慰、宽慰；用“安慰”自然准确。
- source_word: በእንተ
  choice: 因……而
  rationale: 保留介词短语所表达的关联或缘由，不把具体情境解释得过细。
- source_word: ወልዳ
  choice: 她的儿子
  rationale: 按阴性领属后缀明确雅各是利百加的儿子。
- source_word: ባረኮ
  choice: 为雅各祝福
  rationale: 宾语代词所指最自然地承接雅各；重述姓名可避免现代汉语中“他”指代含混。
theological_decisions:
- issue: 祝福对象的代词所指
  choice: 雅各
  alternative: 利百加
  rationale: 原文阳性宾语后缀与雅各相合，而利百加为阴性；因此译明为雅各，同时不增添祝福内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“因雅各而安慰她”在安慰缘由和相关事项上的适度含混。
