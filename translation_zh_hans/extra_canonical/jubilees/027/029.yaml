  yaml_path: translation/extra_canonical/jubilees/027/029.yaml
  text: And Jacob rose early in the morning and took the stone that he had placed by his head, and he set it up as a pillar for a sign, and he poured oil on its top. And he called the name of that place Bethel, though formerly the name of that region was Luz.
translation:
  language: zh_hans
  text: 雅各清早起来，拿起放在头旁的那块石头，把它立作柱子，作为记号，又把油浇在柱顶上。他给那地方起名叫伯特利；从前那地区名叫路斯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በነግህ
  choice: 清早
  rationale: 准确表达“在早晨、清早”的时间含义，符合现代汉语叙事习惯。
- source_word: እብነ፡ ዘአንበረ፡ ኀበ፡ ርእሱ
  choice: 放在头旁的那块石头
  rationale: 保留原文“在他头部旁边”的空间表达，不擅自改成“枕过的石头”。
- source_word: ሐውልተ
  choice: 柱子
  rationale: 此处指竖立起来的纪念性石柱；译作“柱子”自然且不额外限定其宗教功能。
- source_word: ለትእምርት
  choice: 作为记号
  rationale: 对应“为记号、标志”，保留其宽泛功能，避免解释为特定礼仪纪念碑。
- source_word: ቅብአ
  choice: 油
  rationale: 原词指油或膏油；在“浇”的语境中译作“油”最自然，也避免加入原文未明说的仪式解释。
- source_word: ቤቴል
  choice: 伯特利
  rationale: 采用中文圣经传统中广为人知的地名音译。
- source_word: ሉዛ
  choice: 路斯
  rationale: 采用中文圣经传统地名译法。
- source_word: ብሔር
  choice: 地区
  rationale: 该词可指土地、地域或国土；这里与地名沿革相连，译作“地区”比“国家”更合语境。
theological_decisions:
- issue: 石柱与浇油行为的性质
  choice: 仅按原文叙述为立柱作记号并浇油
  alternative: 明确称其为祭坛、奉献礼或敬拜仪式
  rationale: 原文没有把石柱称为祭坛，也未明确界定浇油的神学或礼仪性质，因此不作教派化阐释。
- issue: 伯特利与路斯所指范围的差异
  choice: 分别译为“那地方”和“那地区”
  alternative: 将两者都译作“地方”或断定为同一城邑
  rationale: 原文先用“地方”，后用可指地域的“地区”，保留措辞差别及可能存在的地理范围张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。句式紧凑，保留原文动作次序；地名沿用通行中文圣经译名。
