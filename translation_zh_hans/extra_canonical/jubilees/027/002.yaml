  text: And now, my son, listen to my voice. Rise and flee to Laban my brother, to Haran, and stay with him a few days, until your brother’s anger turns away,
translation:
  language: zh_hans
  text: 现在，我儿，要听我的话：起来，逃往哈兰，到我哥哥拉班那里去，和他住些日子，直到你哥哥的怒气消退。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: 我儿
  rationale: 直译“我的儿子”，采用现代汉语中庄重而自然的呼语“我儿”。
- source_word: ስማዕ፡ ቃለየ
  choice: 听我的话
  rationale: 原文意为“听我的声音/话”；此处是听从劝告的惯用表达，译作“听我的话”自然且保留命令语气。
- source_word: ወጐየይ
  choice: 逃到
  rationale: 该动词在此语境表示逃离危险；与后面的目的地连译为“逃到”。
- source_word: ላባ፡ እኁየ
  choice: 我哥哥拉班
  rationale: 依原文关系结构保留说话者称拉班为“我的兄弟”；汉语须按性别具体化，叙事背景表明拉班是利百加的哥哥。
- source_word: ኅዳጠ፡ መዋዕለ
  choice: 些日子
  rationale: 对应“少数/几天”，用自然现代汉语表达暂住一段短时间。
- source_word: ይትመየጥ፡ መዐተ፡ እኁከ
  choice: 你哥哥的怒气消退
  rationale: 保留“怒气转离/退去”的动态含义，译作现代汉语常用的“消退”。
