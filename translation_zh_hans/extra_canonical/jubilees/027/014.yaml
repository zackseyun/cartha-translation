base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027/014.yaml
  text: And may he give to you the blessings of my father Abraham, to you and to your seed after you, so that you may inherit the land of your sojourning and all the land that God gave to Abraham. Go, my son, in peace.”
translation:
  language: zh_hans
  text: 愿他把我父亲亚伯拉罕的诸般福分赐给你和你以后的后裔，使你承受你寄居之地，以及上帝赐给亚伯拉罕的全部土地。我的儿子，平安地去吧！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በረከታቲሁ
  choice: 所得的福分
  rationale: 该词在吉兹语中为复数形式，译作“福分”可自然表达多重福惠，并以“所得的”体现第三人称所属后缀。
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: “后裔”既可作集合名词，又保留原词可指种子、子孙的语义范围。
- source_word: ምድረ፡ ፍልሰትከ
  choice: 你寄居之地
  rationale: 反映暂居、旅居之义，也与族长叙事的表达相符，不将其弱化为一般居住地。
- source_word: ትረሰ
  choice: 承受
  rationale: 表达取得产业、继承土地之意，适合应许之地的语境。
- source_word: በሰላም
  choice: 平安地
  rationale: 保留“在平安中”的方式或状态含义，而不只作为告别祝语处理。
theological_decisions:
- issue: 福分的单复数
  choice: 福分
  alternative: 福气／祝福
  rationale: 依据吉兹语复数，而不跟随《创世记》28:4平行经文可能呈现的单数；汉语“福分”可集合性地承载复数意义。
- issue: 土地范围
  choice: 你寄居之地，以及上帝赐给亚伯拉罕的全部土地
  alternative: 把“寄居之地”与“全部土地”合并为同一范围
  rationale: 保留原文并列结构及其可能存在的范围张力，不擅自判定二者完全同指。
- issue: 赐福者的指代
  choice: 愿他
  alternative: 愿上帝
  rationale: 原文使用第三人称代词；保留指代形式，避免把上下文所指直接明说。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“我的儿子，平安地去吧”保留父亲临别嘱咐的温情和命令语气；不添加原文没有的解释性神学措辞。
