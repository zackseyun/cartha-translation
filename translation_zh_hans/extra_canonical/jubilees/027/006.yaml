  yaml_path: translation/extra_canonical/jubilees/027/006.yaml
  text: And Jacob said to Rebekah his mother, “Look, you know that my father has become old and does not see, because his eyes are dim. And if I leave him, it will be evil in his sight, because I have left him and gone away from you.”
translation:
  language: zh_hans
  text: 雅各对母亲利百加说：“你看，你知道我父亲已经年老，眼睛昏花，看不见了。若我离开他，在他眼中便是恶事，因为我撇下他，离开你们而去。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们”在原文中是复数，可能包括利百加及家中其他人。
    reason: 说明原文从对母亲的单数称呼转为复数代词，保留这一细节而不强行统一。
lexical_decisions:
- source_word: ረሰአ
  choice: 已经年老
  rationale: 依本节语境及英译审校层处理为年老、衰老，较自然地说明以撒视力衰退的处境。
- source_word: ክቡዳ፡ አዕይንቲሁ
  choice: 眼睛昏花
  rationale: 原文直译为“他的眼睛沉重”；汉语以“眼睛昏花”自然表达因年老而视力衰弱，同时保留其看不见的因果关系。
- source_word: እኩይ
  choice: 恶事
  rationale: 保留原文明确的道德评价，不弱化为仅仅“不好”或“令他不悦”。
- source_word: በቅድመ፡ አዕይንቲሁ
  choice: 在他眼中
  rationale: 保留原文惯用表达及其与上文“看不见”的张力，不改写为单纯的“在他看来”。
- source_word: አሐውር፡ እምኔክሙ
  choice: 离你们而去
  rationale: 末尾代词为复数，故译作“你们”，不因对话对象利百加为单数而擅自改成“你”。
theological_decisions:
- issue: 雅各离开年迈父亲的行为所受评价
  choice: “这在他眼中就是恶事”
  alternative: “他会不高兴”
  rationale: 原文使用“恶”这一较强的道德词，译文保留孝亲责任所形成的伦理张力，不将其淡化为情绪反应。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。“你看”保留提示语气；“眼睛昏花”符合普通读者习惯；末句保留“在他眼中”与“恶事”的原文力度和修辞张力。
