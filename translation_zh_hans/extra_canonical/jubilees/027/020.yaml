  text: Do not fear for him, my sister, for he is upright in his way, and he is a blameless man, and he is faithful, and he will not be forsaken. Do not weep.
translation:
  language: zh_hans
  text: “我的姐妹，不要为他担心，因为他所行的路正直；他是个无可指责的人，又忠信，必不被撇弃。不要哭。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትፍርሂ፡ በእንቲአሁ
  choice: 不要为他担心
  rationale: 保留否定命令及“为他”的关系；此处语境中的“担心”比直译“惧怕”更符合现代汉语表达。
- source_word: ሪትዕ፡ በፍኖቱ
  choice: 他所行的路正直
  rationale: 将“正直”保留为对其道路的评价，并按 በፍኖቱ 的单数形式译作“路”，不扩为“道路/行径”复数。
- source_word: ፍጹም፡ ውእቱ፡ ብእሲ
  choice: 他是个无可指责的人
  rationale: ፍጹም 可表示完整、完全；用于人物品格时译作“无可指责”自然且不暗示绝对无罪。
- source_word: ምእመን፡ ውእቱ
  choice: 又忠信
  rationale: ምእመን 在此描述人的可靠与忠诚，译作“忠信”可兼顾两层含义。
- source_word: ወኢይትገደፍ
  choice: 必不被撇弃
  rationale: 保留被动意义及将来/确定语气；“撇弃”在庄重叙事中自然，也未明说施事者。
- source_word: ኢትብከዪ
  choice: 不要哭
  rationale: 直接保留对女性单数对象所发的否定命令；汉语无需标示性别。
theological_decisions:
- issue: 谁不会撇弃他
  choice: 采用无施事者的被动句“必不被撇弃”
  alternative: “上帝必不撇弃他”或“他必不灭亡”
  rationale: 原文没有明示施事者，也可能容纳“被遗弃”及结果性含义；不补出“上帝”可保留原文的神学含蓄。
- issue: ፍጹም 是否表示道德完全
  choice: 译作“无可指责”
  alternative: “完全的人”
  rationale: 避免把人物描述强化为绝对完美或无罪，同时保留其品格健全、行为无可责难的正面判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我的姐妹”保留亲属称呼的直陈感；以分号连接连续判断，维持原文排比而避免汉语过度重复“他是”。
