  text: And Isaac called Jacob and blessed him and charged him and said to him, “Do not take a wife for yourself from any of the daughters of Canaan.
translation:
  language: zh_hans
  text: 以撒召来雅各，为他祝福，又嘱咐他说：“你不可从迦南的女子中娶妻。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዐ
  choice: 召来
  rationale: 对应“呼唤、召见”，在此表示以撒叫雅各到跟前；“召来”自然且保留动作含义。
- source_word: ባረኮ
  choice: 为他祝福
  rationale: 准确表达以撒对雅各施行祝福，明确受事者。
- source_word: ነሠጾ
  choice: 嘱咐
  rationale: 此处词义为命令、吩咐；结合父亲临别训示的语境，“嘱咐”既自然又保留权威性。
- source_word: ኢትነሣእ፡ ለከ፡ ብእሲተ
  choice: 你不可……娶妻
  rationale: 原文直义涉及“为自己取一个女人”，现代汉语以“娶妻”准确表达婚姻语境；否定命令译作“不可”。
- source_word: እምኵሉ፡ አዋልደ፡ ከናአን
  choice: 从迦南的女子中
  rationale: 表达来源范围；此结构在否定句中自然涵盖“不可娶迦南女子中的任何一个”，无需添加容易显得生硬的“任何”。
