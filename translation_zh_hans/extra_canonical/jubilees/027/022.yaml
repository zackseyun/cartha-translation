  to: 雅各离开誓言井，前往哈兰；那时是第四十四个禧年中第二个七年期的第一年。他在这个七年期第一个月的月朔来到路斯；路斯在山地中，就是伯特利。傍晚，他来到某处；当夜，他离开自己所走的路，转到道路的西边[a]，睡在那里，因为太阳已经落山。
  rationale: 修订仅调整末句的中文句法，并相应澄清脚注，保留原文及英语审校轨迹所要求的“他的路”和道路西边的方向信息；同时将“在山中”微调为更自然的“在山地中”。其余纪年、地名和时间信息均维持不变。
