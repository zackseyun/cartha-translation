  yaml_path: translation/extra_canonical/jubilees/027/022.yaml
  text: And Jacob went out from the Well of the Oath to go to Haran in the first year of the second week of the forty-fourth jubilee. And he came to Luz, which is in the mountains, that is, Bethel, on the new moon of the first month of this week. And he came to a certain place at evening, and he turned aside from his road to the west of the road that night, and he slept there, because the sun had set.
translation:
  language: zh_hans
  text: 雅各离开誓言井，前往哈兰；那时是第四十四个禧年中第二个七年期的第一年。他在这个七年期第一个月的月朔来到路斯；路斯在山地中，就是伯特利。傍晚，他来到某处；当夜，他离开自己所走的路，转到道路的西边[a]，睡在那里，因为太阳已经落山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话的句法较难，也可较简略地译作：“当夜，他离开自己所走的路，转开。”
    reason: 原文中“西边”与“转开”的句法关系存在解释空间；正文保留与道路西边有关的方向信息，脚注列出不明确表达该方位的较简略译法。
lexical_decisions:
- source_word: ዐዘቆተ፡ መሐላ
  choice: 誓言井
  rationale: 按吉兹文的字面意义翻译为“誓言之井”，既保留原文表达，也与该地名的传统含义相符。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 本节纪年语境中的“周”指由七年组成的周期；译作“七年期”可避免现代读者误解为七日的一周。
- source_word: ኢዮቤል
  choice: 禧年
  rationale: 采用现代中文宗教文献中对 jubilee 的通行译法。
- source_word: በሠርቀ፡ ወርኅ
  choice: 月朔
  rationale: 该词组指新月出现、月份开始之时；“月朔”简洁而庄重。
- source_word: መካነ፡ መሴየ
  choice: 傍晚，他来到某处
  rationale: 保留地点表达的不定性，并将傍晚的时间含义自然地译入中文。
- source_word: እምፍኖቱ
  choice: 从自己所走的路
  rationale: 体现名词所带的第三人称阳性单数领属后缀，即“他的路”。
- source_word: እንተ፡ ዐረበን፡ ለመንገደ
  choice: 转向道路西边
  rationale: 保留原文中与“西边”相关的方向信息，不按较短的异译省略。
