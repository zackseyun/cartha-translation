  yaml_path: translation/extra_canonical/jubilees/027/018.yaml
  text: The Most High God will guard him from every evil and will be with him, for he will not forsake him all his days.
translation:
  language: zh_hans
  text: 至高的上帝必保守他免受一切恶，并与他同在，因为在他一生的日子里，上帝绝不离弃他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: 至高的上帝
  rationale: 按词序与语义表达“上帝—至高者”，自然地呈现其尊称含义，并与英语审校层一致。
- source_word: የዐቅቦ
  choice: 必保护他
  rationale: 该动词表达守护、保守；此处采用现代汉语常用而庄重的“保护”。
- source_word: እምኵሉ፡ እኩይ
  choice: 脱离一切邪恶
  rationale: 介词“从”与“所有的恶”合用，表示使他免受一切恶害；“邪恶”保留道德之恶与灾害之恶可能重叠的语义范围。
- source_word: ወይሄሉ፡ ምስሌሁ
  choice: 与他同在
  rationale: 直译“并将与他一起”，采用汉语宗教文本中自然且准确的“与他同在”。
- source_word: እስመ፡ ኢየኀድጎ
  choice: 因为……不会离弃他
  rationale: 保留原文的因果连接及“放弃、离弃”之意。
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: 他一生的日子
  rationale: 较贴近“他所有的日子”，同时在现代汉语中清楚表达终身持续之意。
theological_decisions:
- issue: 末句省略主语的指代
  choice: 补出“上帝”
  alternative: “因为他一生都不会被离弃”或仅写“因为他一生的日子都不会离弃他”
  rationale: 吉兹语动词主语延续指向前文的“至高的上帝”；汉语若不补出主语容易把两个“他”混淆。补出“上帝”只澄清语法指代，不增加神学解释。
- issue: “一切邪恶”的语义范围
  choice: 保留“邪恶”
  alternative: “一切祸患”
  rationale: 原词可涵盖恶、邪恶或不幸；使用“邪恶”不将其单方面限定为外在灾祸，从而保留原文可能的道德与处境双重含义。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。句式保留原文“保护—同在—不离弃”的三重结构，并通过补出末句主语避免汉语指代歧义。
