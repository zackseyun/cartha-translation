  text: And Jacob awoke from his sleep and said, “Surely this place is the house of the Lord, and I did not know it.” And he was afraid and said, “How awesome this place is! This is none other than the house of the Lord, and this is the gate of heaven.”
translation:
  language: zh_hans
  text: 雅各从睡梦中醒来，说：“这地方确实是主的家，我竟不知道。”他就害怕，说：“这地方多么可畏！这地方不是别的，正是主的家；这就是天的门。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማን
  choice: 确实
  rationale: 表达肯定和恍然领悟的语气，符合现代汉语，也不额外加强原文。
- source_word: ቤቱ፡ ለእግዚአብሔር
  choice: 主的殿
  rationale: 直译为“主的家”虽可理解，但此处指神圣居所；“主的殿”庄重自然，并与后文重复呼应。
- source_word: ግሩም
  choice: 可畏
  rationale: 保留因神圣临在而产生的敬畏与惧怕，不弱化为单纯的“奇妙”或“壮观”。
- source_word: አንቀጸ፡ ሰማይ
  choice: 天的门
  rationale: 贴近原文意象和传统表达，不将其解释性改写为通往天上的入口。
theological_decisions:
- issue: “主的殿”是否指已经建成的宗教建筑
  choice: 保留“主的殿”这一神圣居所表达
  alternative: 主的家
  rationale: 上下文以地点为神的居所，并未主张此处已有实体圣殿；汉语“殿”能承载其庄严和礼仪意味。
- issue: 雅各对该地点的判断强度
  choice: “不是别处，正是”
  alternative: 无非是／不过是
  rationale: 原文结构为排他性的确认；所选译法避免汉语“无非”“不过”可能带出的贬抑意味。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；保留原文两次“主的殿”的重复和“害怕／可畏”的语义呼应。
