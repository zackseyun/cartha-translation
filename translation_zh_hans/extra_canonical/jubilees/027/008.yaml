  language: zh_hans
  text: 利百加对雅各说：“我要进去告诉他，他就会打发你走。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እበውእ
  choice: 我要进去
  rationale: 按第一人称未完成体表达即将采取的行动；“进去”保留进入以撒所在之处的空间意味。
- source_word: እነግር
  choice: 告诉他
  rationale: 原词基本义为“说、告诉”；汉语中补出由上下文可知的受话者“他”，使句意自然。
- source_word: ይፈንወከ
  choice: 他就会打发你走
  rationale: 该动词在此表示“差遣、送走”，后缀指第二人称单数宾语；结合叙事语境，是让雅各离开前往哈兰，而不是派人召他来。
