  text: And Rebekah went in and said to Isaac, “I loathe my life because of the two daughters of Heth whom Esau has taken for himself as wives.
translation:
  language: zh_hans
  text: 利百加进去，对以撒说：“我因以扫为自己娶作妻子的那两个赫人女子，就厌弃自己的生命。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦአት
  choice: 进去
  rationale: 该动词表示进入；结合利百加前往以撒那里说话的语境，译作“进去”自然且贴近原文。
- source_word: ገእዝኩ፡ ሕይወትየ
  choice: 我厌恶我的性命
  rationale: 直译保留“厌恶”与“我的生命/性命”的强烈表达，不弱化为一般性的烦恼或不满。
- source_word: እምክልኤሆን፡ አዋልደ፡ ኬጥ
  choice: 因……那两个赫人女子
  rationale: 保留原文明确的双数概念，并以现代汉语表达原因关系。
- source_word: እለ፡ ነሥአ፡ ዔሳው፡ ሎቱ፡ አንስትያ
  choice: 以扫娶来的
  rationale: 原意是以扫为自己取作妻子；“娶来的”在汉语中简洁表达婚姻关系，同时避免重复累赘。
