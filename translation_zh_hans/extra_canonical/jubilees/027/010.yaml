  text: And if Jacob takes a wife from among the daughters of the land like these, why should I still live? For the daughters of Canaan are evil.”
translation:
  language: zh_hans
  text: 如果雅各娶当地的女子为妻，像这些女子一样，我活着还有什么意义呢？因为迦南的女子是邪恶的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲተ
  choice: 妻子
  rationale: 该词在此指婚配对象；结合“娶”译为“妻子”，符合现代汉语习惯。
- source_word: አዋልደ፡ ምድር
  choice: 当地的女子
  rationale: 直义为“这地的女儿们”，现代汉语以“当地的女子”自然表达其地域归属。
- source_word: ለምንት፡ ሊተ፡ እንከ፡ አሐዩ
  choice: 我活着还有什么意思呢
  rationale: 保留反问与厌生式哀叹的力度，同时采用自然、庄重的现代汉语。
- source_word: እኩያት
  choice: 恶的
  rationale: 直接保留道德评价，不弱化为“不好”或“令人厌烦”。
theological_decisions:
- issue: 对迦南女子的概括性评价
  choice: 因为迦南的女子都是恶的
  alternative: 因为这些迦南女子是恶的
  rationale: 源文表述为“迦南的女儿们”，未限定仅指先前提到的个别人；故保留其概括语气，不替文本缓和或缩小范围。
translation_notes:
  register: 采用现代标准普通话，语气自然而庄重；保留母亲强烈的反问和源文中的道德判断。经文无脚注标记。
