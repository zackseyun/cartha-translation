  text: And the matter of Esau her older son was told to Rebekah in a dream. And Rebekah sent and called Jacob her younger son and said to him, “Look, Esau your brother is bearing a grudge against you, to kill you.”
translation:
  language: zh_hans
  text: 利百加在梦中得知了她长子以扫的事。利百加就差人叫来她的幼子雅各，对他说：“看，你哥哥以扫对你怀恨，要杀你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገሩ
  choice: 他的事
  rationale: 此处可指以扫的事情或情况；结合句法译作“他的事”，比限定为“话”更稳妥，也符合现代汉语。
- source_word: ይትቄየመከ
  choice: 对你怀恨
  rationale: 该动词在吉兹语中表达怀怨、记恨或敌视，不采用平行希伯来经文所呈现的“自我安慰”惯用语，以忠实反映现存吉兹语文本。
- source_word: ከመ፡ ይቅትልከ
  choice: 想要杀你
  rationale: 自然表达其怀恨所指向的杀害意图，同时保留目的关系。
- source_word: ዘይሌህቅ / ዘይንእስ
  choice: 大儿子 / 小儿子
  rationale: 按上下文分别指年长与年幼的儿子；用现代汉语亲属表达清楚呈现二人的相对长幼。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体；保留“在梦中被告诉”的被动结构，以避免擅自补出启示者。无需脚注，因为“对你怀恨”直接对应吉兹语措辞，所谓“安慰自己”属于希伯来平行文本的表达，并非本节吉兹语正文的真实歧义。
