revisions:
- from: 以扫是利百加的大儿子，他的事在梦中被告诉了利百加。利百加就派人叫来她的小儿子雅各，对他说：“看，你哥哥以扫对你怀恨，想要杀你。”
  to: 利百加在梦中得知了她长子以扫的事。利百加就差人叫来她的幼子雅各，对他说：“看，你哥哥以扫对你怀恨，要杀你。”
  rationale: 仅作汉语语序与亲属称谓的润饰。修订保留“在梦中”以及原文未明言告知者的表达，不将“怀恨”改作源自希伯来平行文本的“安慰自己”，并保留怀恨指向杀害的关系。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:01:08Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确反映吉兹语：ነገሩ宜作“……的事/情况”，没有误译为“话”；ይትቄየመከ正确译出为“对你怀恨”，未依照《创世记》平行经文倒译为“安慰自己”。末句的杀害目的也得以保留。
  naturalness: 现行首句“以扫是利百加的大儿子，他的事在梦中被告诉了利百加”虽可理解，但话题前置后再用“他的事”指代，现代汉语叙事中略显生硬。“利百加在梦中得知了她大儿子以扫的事”更自然，同时不补出告知者。
  terminology: 人名“利百加”“以扫”“雅各”均为通行译名。以“长子”“幼子”表达相对长幼，较“大儿子/小儿子”更凝练且符合庄重叙事语体；本节无需神学术语或脚注。
  issues:
  - severity: low
    issue: 首句指代和语序略显生硬。
    rationale: “以扫是……，他的事……”的结构使“他的事”回指略不顺畅；调整为以利百加为主语的“在梦中得知”可保留原文未说明告知者的含蓄。
  - severity: low
    issue: “大儿子/小儿子”可优化为“长子/幼子”。
    rationale: 原文是在雅各与以扫之间标示年长、年幼；“长子/幼子”在现代庄重叙事中更自然简洁，且不改变意思。
