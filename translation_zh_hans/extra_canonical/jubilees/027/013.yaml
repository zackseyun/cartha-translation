  text: And may God Almighty bless you and make you fruitful and multiply you, and may you become an assembly of nations.
translation:
  language: zh_hans
  text: 愿全能的上帝赐福给你，使你繁衍，使你增多；愿你成为多族的会众。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ሰዳይ
  choice: 全能的上帝
  rationale: “ሰዳይ”音译自神名/称号 Shaddai；结合此处对《创世记》祝福语的沿用，以现代汉语通行而庄重的“全能的上帝”表达。
- source_word: ያልህቀ
  choice: 使你生养众多
  rationale: 该动词在这组生育与增多的祝福语中表达使之繁衍、结实的意思；译为“生养众多”既符合上下文，也保留经文语体。
- source_word: ያብዝኀከ
  choice: 使你人数倍增
  rationale: 表达使数量增多；加“人数”使现代汉语语义清楚，并与前一分句形成递进。
- source_word: መክብበ፡ አሕዛብ
  choice: 众民族的会众
  rationale: “መክብብ”指聚集、会众或群体，“አሕዛብ”可指民族、列族；此处译作“众民族的会众”，保留集合性及复数民族意象。
theological_decisions:
- issue: 神的称号 Shaddai 的处理
  choice: 全能的上帝
  alternative: 上帝沙代
  rationale: 采用汉语圣经传统中易懂的意义翻译，同时不加入超出源文的宗派性解释。
- issue: “众民族的会众”的所指
  choice: 保持集合性祝福措辞，不解释为特定宗教共同体
  alternative: 众民族组成的群体
  rationale: 源文保留了族群与会众之间的张力，不宜在正文中明确其实现方式或神学归属。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体；保留原文连续三个祈愿分句的结构，并以“生养众多，人数倍增”呈现相近动词的递进关系。
