  text: And Isaac said to Rebekah, “My sister, do not weep because of Jacob my son, for he will go in peace and return in peace.
translation:
  language: zh_hans
  text: 以撒对利百加说：“我的姊妹，不要为我儿雅各哭泣，因为他必平安地去，也必平安地回来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅትየ
  choice: 我的妹妹
  rationale: 直译为“我的姐妹/妹妹”；此处是以撒对妻子利百加的亲昵称呼。现代汉语中“我的妹妹”既保留原文措辞，也避免改写成原文没有的“妻子”。
- source_word: ኢትብከዪ
  choice: 不要……哭泣
  rationale: 保留否定命令语气，表达以撒安慰利百加、劝她停止哀哭。
- source_word: በእንተ፡ ያዕቆብ፡ ወልድየ
  choice: 为我儿雅各
  rationale: በእንተ 表示“因、为了、关于”；在哭泣的语境中译作“为……哭泣”最自然。ወልድየ 明确是“我的儿子”。
- source_word: በሰላም፡ የሐውር፡ ወበሰላም፡ ይትመየጥ
  choice: 他必平安地去，也必平安地回来
  rationale: 保留“平安”在去与回两句中的重复及平行结构；未来陈述语气以“必”表达。
theological_decisions:
- issue: 以撒关于雅各平安往返的话具有祝福、预言或确信的语气
  choice: 采用直接的未来陈述“必……也必……”，不另加“愿”或“上帝会使”
  alternative: 可译作祈愿“愿他平安地去、平安地回来”，或补明神圣保障
  rationale: 原文使用未来式陈述，没有明说这是祈愿，也没有在本节明示上帝为行动主体；因此保留其确信而不补入解释。
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。保留“我的妹妹”这一古代亲属式称呼所带来的陌生感，不以现代夫妻称谓消解原文特色；并保留两次“平安”的修辞重复。
