  text: and my father will be angry and curse me. I will not go; only if he sends me will I go.”
translation:
  language: zh_hans
  text: 我父亲会发怒，诅咒我。我不去；唯有他差遣我，我才去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትመዓዕ
  choice: 会发怒
  rationale: 该动词在此表示父亲将要动怒；用“会发怒”自然传达上下文中的预期结果。
- source_word: ይረግመኒ
  choice: 诅咒我
  rationale: 保留“咒诅、诅咒”的直接含义，不弱化为责骂。
- source_word: ኢየሐውር
  choice: 我不去
  rationale: 直译否定式第一人称动词，简洁符合现代汉语对话。
- source_word: ፈነወኒ
  choice: 他差我去
  rationale: 该动词具有差遣、派出的意思；“差我去”保留差遣关系，也与后面的“去”自然衔接。
- source_word: ባሕቱ
  choice: 只有……才……
  rationale: 在句中表达限制条件；汉语以“只有……才……”清楚呈现“唯独在他差遣我的情况下”的含义。
