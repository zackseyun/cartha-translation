  yaml_path: translation/extra_canonical/jubilees/027/030.yaml
  text: And Jacob prayed a prayer to the Lord, saying, “If the Lord is with me and keeps me on this road on which I am going, and gives me bread to eat and clothing to wear,
translation:
  language: zh_hans
  text: 雅各向主祷告，说：“如果主与我同在，在我所走的这条路上保守我，又赐给我饼吃、衣服穿，”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在此尚未结束，雅各的祷告接续于下一节。
    reason: 经文以条件句展开，并以逗号收尾；脚注提醒读者不要把本节误读为完整句子。
lexical_decisions:
- source_word: ጸሎተ፡ ለእግዚአብሔር
  choice: 向主祷告
  rationale: 原文直译为“向主祷告一个祷告”；汉语用“向主祷告”即可自然表达其意义，避免累赘。
- source_word: ዐቀበኒ
  choice: 看顾我
  rationale: 此词含守护、保守之意；“看顾”在现代中文中自然庄重，也保留旅途中蒙保护的语义。
- source_word: በዛቲ፡ ፍኖት፡ እንተ፡ ባቲ፡ እሐውር፡ አነ
  choice: 在我所走的这条路上
  rationale: 贴近原文“在这条我正行走的路上”，同时调整为自然的现代汉语语序。
- source_word: ኅብስተ፡ እብላዕ
  choice: 饼吃
  rationale: 保留“饼”的具体意象，而不泛化为“食物”；“赐给我饼吃”符合原文结构。
- source_word: ልብሰ፡ እልበስ
  choice: 衣服穿
  rationale: 原文为“衣服让我穿”；译作“赐给我……衣服穿”简洁自然，并保留生活所需的具体表达。
theological_decisions:
- issue: 条件句中雅各对主同在与看顾的表达
  choice: 如果主与我同在……
  alternative: 主若与我同在……
  rationale: 保留原文条件句的真实张力，不把它解释为怀疑、誓愿或既定确信；“如果”清楚易懂。
- issue: 神名的译法
  choice: 主
  alternative: 上帝／耶和华
  rationale: ግዚአብሔር在此按其常规意义译作“主”，也与所提供的审校层一致；不额外引入特定神名形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留祷告中的条件句结构及“饼”“衣服”等具体意象；避免机械重复“祷告一个祷告”。
