  text: And after Jacob had arisen to go to Mesopotamia, the spirit of Rebekah was grieved over her son, and she wept.
translation:
  language: zh_hans
  text: 雅各起身前往美索不达米亚之后，利百加因儿子而心中悲痛，哭了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥአ
  choice: 动身
  rationale: 此处与表示前往的结构连用，意为起身出发；译作“动身”符合现代汉语叙事习惯。
- source_word: ሰሐዊረ
  choice: 前往
  rationale: 表达行程目的，译作“前往”自然且庄重。
- source_word: መስጶጦሚያ
  choice: 美索不达米亚
  rationale: 采用该古代地名在现代中文中的通行译名。
- source_word: ሐዘነ፡ መንፈሰ፡ ርብቃ
  choice: 利百加……心里悲痛
  rationale: 原文以“利百加的灵”作悲伤的主体；中文用“心里悲痛”保留内在悲伤之意，同时避免生硬直译。
- source_word: ድኅረ፡ ወልዳ
  choice: 为儿子忧伤
  rationale: 介词结构在语境中表示因儿子而悲伤，译作“为儿子忧伤”不误解为时间先后。
- source_word: ወትበኪ
  choice: 就哭了
  rationale: 保留承接关系，并以现代汉语自然表达其实际哭泣。
