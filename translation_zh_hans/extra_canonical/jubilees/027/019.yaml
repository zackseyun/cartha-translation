  source_fidelity: 原文与英文审校轨迹表达说话者确信：他无论到哪里去，其道路/行程都将顺遂，直至平安归来并被平安见到。草稿总体保留了“道路”意象及两次“平安”，但“他的道路都会凡事亨通”将“凡事”直接修饰“道路”，搭配不够清楚自然。
