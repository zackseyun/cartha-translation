  text: For I know that his ways will prosper in everything wherever he goes, until he returns to us in peace and we see him in peace.
translation:
  language: zh_hans
  text: 因为我知道，他无论到哪里去，所行的一切道路都必亨通，直到他平安回到我们这里，我们也平安见到他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አአምር
  choice: 我知道
  rationale: 按第一人称未完成式在此处的陈述语境译为现在时，表达说话者确信。
- source_word: ይሤራኅ ፍኖዊሁ
  choice: 他的道路都会……亨通
  rationale: 字面涉及“他的道路兴盛/顺遂”；保留“道路”这一源语意象，并用“亨通”表达进展顺利。
- source_word: በኵሉ ውእደ ሖረ
  choice: 无论他往哪里去……凡事
  rationale: 源文兼有“在一切”和“他所去之处”的表达；汉语调整语序以自然呈现范围与地点。
- source_word: በሰላም
  choice: 平安
  rationale: 该词在回返和相见两处重复，译文同样保留重复，不将其弱化为单纯的“安全”。
