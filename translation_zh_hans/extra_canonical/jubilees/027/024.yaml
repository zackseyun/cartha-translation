  yaml_path: translation/extra_canonical/jubilees/027/024.yaml
  text: And he dreamed that night, and behold, a ladder was set on the earth, and its top reached to heaven. And behold, the angels of God were going up and coming down on it, and behold, God stood upon it.
translation:
  language: zh_hans
  text: 那天夜里，他做了一个梦：看哪，有一架梯子立在地上，梯顶直达天上。看哪，上帝的众天使沿着梯子上去下来；看哪，上帝站在梯子上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝站在梯子上方。”
    reason: 原文介词短语可理解为“在梯子上”，语境中也可能指“在梯子上方”；脚注保留这一空间关系的歧义。
lexical_decisions:
- source_word: መዓርግ
  choice: 梯子
  rationale: 该词在此指连接地与天、可供上下的梯子；译作“梯子”直接清楚，也避免把解释性的传统称呼“天梯”带入正文。
- source_word: ትክልት፡ ውስተ፡ ምድር
  choice: 立在地上
  rationale: ትክልት 表示竖立、安置；“立在地上”既贴近原文，又符合现代汉语表达。
- source_word: ርእሳ፡ ትበጽፍ፡ ውስተ፡ ሰማይ
  choice: 梯顶直达天上
  rationale: ርእስ 字面为“头、顶部”，在梯子的语境中自然译为“梯顶”；“直达天上”传达其顶部伸抵天界。
- source_word: መላእክተ፡ እግዚአብሔር
  choice: 上帝的众天使
  rationale: 复数 መላእክት 译为“众天使”；እግዚአብሔር 在此作为神的称谓，译为现代中文通行的“上帝”。
- source_word: የዐርጉ፡ ወይወርዱ፡ ባቲ
  choice: 在梯子上上去下来
  rationale: 保留原文“上去—下来”的次序，并明确阴性代词所指为梯子；“在……上”也符合沿梯移动的语境。
- source_word: ወናሁ
  choice: 看哪
  rationale: 原文三次重复提示观看的叙事词，译文均保留为“看哪”，维持异象叙述的庄重节奏。
theological_decisions:
- issue: 上帝相对于梯子的位置（ይቀውም፡ ውስቴታ）
  choice: 上帝站在梯子上
  alternative: 上帝站在梯子上方
  rationale: ውስቴታ 可表达“在其中／在其上”，而不是明确表示“在……上方”的专门介词。正文采用较贴近词面的“在梯子上”，脚注保留语境上可能的“在梯子上方”，不消解位置关系的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文三次“看哪”的重复和异象节奏；用“上帝”与本节“上帝的众天使”保持称谓一致。
