  yaml_path: translation/extra_canonical/jubilees/027/025.yaml
  text: And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are lying asleep I will give to you and to your seed after you.”
translation:
  language: zh_hans
  text: 他对雅各说：“我是耶和华，是你父亲亚伯拉罕的上帝，也是以撒的上帝。你正睡卧其上的这地，我要赐给你和你以后的后裔。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 此处是上帝的专名，在现代中文圣经语体中以“耶和华”表达，并与后面的“上帝”称谓相区分。
- source_word: አቡከ
  choice: 你父亲
  rationale: 直译亲属称谓，不把它扩展解释为“祖先”；保留原文称亚伯拉罕为雅各之父的圣经式用法。
- source_word: ትነውም
  choice: 正躺卧
  rationale: 兼顾动词所表达的躺卧状态；上下文虽指睡眠，但译文不额外强化为“熟睡”。
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: 源词可指种子或子孙；在土地应许语境中，“后裔”是自然且准确的中文表达。
- source_word: እምድኅሬከ
  choice: 你以后的
  rationale: 保留“在你之后”的时间和世代含义，并以自然中文修饰“后裔”。
theological_decisions:
- issue: 亚伯拉罕被称为雅各的“父亲”
  choice: 你父亲亚伯拉罕
  alternative: 你的祖先亚伯拉罕
  rationale: 原文明确使用“父亲”，这是圣经常见的谱系称呼；改成“祖先”虽更符合现代日常亲属表述，却会消解原文措辞。
- issue: 上帝专名与称谓的区分
  choice: 我是耶和华，是……的上帝
  alternative: 我是主，是……的上帝
  rationale: 原文先用上帝专名，随后以“上帝”连接亚伯拉罕和以撒；译文保持这一结构，不把两者合并。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“你父亲亚伯拉罕”这一圣经式表达；“正躺卧”贴近源文动作状态，同时在梦境上下文中自然可解。
