  text: And your seed will be like the dust of the earth, and you will spread out to the sea and to the east and to the north and to the south. And in you and in your seed all the lands of the nations will be blessed.
translation:
  language: zh_hans
  text: 你的后裔必像地上的尘土；你必向海、向东、向北、向南扩展。列国的一切土地[a]都必因你和你的后裔蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国的一切地区”。相关经文传统作“列国的各家族”，但此处吉兹文本为“土地、地区”。
    reason: 说明源文措辞与熟知的创世记平行表达之间的差异，并保留“土地/地区”的词义范围。
lexical_decisions:
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: ዘርእ 可指种子或后代；本节论及族群繁衍，译作“后裔”最自然，并保留其集合意义。
- source_word: ኖላ፡ ምድር
  choice: 地上的尘土
  rationale: 该短语与创世记传统中的“地上的尘土”对应；按上下文表达数量繁多的比喻。
- source_word: ባሕር
  choice: 海
  rationale: 源文直译为“海”，在方向序列中可暗指西方；正文保留“海”，不将隐含方向替换为“西”。
- source_word: ትበዝኅ
  choice: 扩展
  rationale: 在后裔如尘土及四方展开的语境中，译作“扩展”自然地传达增多并向外铺展之意。
- source_word: በሐውርተ፡ አሕዛብ
  choice: 列国的一切土地
  rationale: 依所给吉兹文的词形与最新校勘意见，核心义为各地、土地或国土，而不是“家族”；“列国的一切土地”兼顾字面结构和现代汉语可读性。
- source_word: ይትባረኩ
  choice: 蒙福
  rationale: 保留被动或中动态的祝福表达，不改写成“以……彼此祝福”等可能的解释性译法。
theological_decisions:
- issue: 祝福应许的范围及媒介
  choice: 列国的一切土地都必因你和你的后裔蒙福
  alternative: 列国的所有家族都必因你和你的后裔蒙福
  rationale: 源文在此据所给吉兹文本指向“土地/各地”，虽其经文传统背景可能令人联想到创世记28:14的“家族”，仍应以现存源文为先，不用传统平行经文覆盖其独特措辞。
- issue: “因你”所表达的关系
  choice: 因你和你的后裔
  alternative: 在你和你的后裔里面
  rationale: 吉兹语介词 ብ 可表达“在……中”或工具、媒介关系。汉语“因……”较自然，也保留借着其得福的含义；不进一步界定祝福实现机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“后裔”“蒙福”延续大众熟悉的圣经语体；“向海”刻意保留源文的传统方向习语，而不直接解释成“向西”。
