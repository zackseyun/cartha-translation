  text: And he took one of the stones of that place and put it under that tree, and he was traveling alone, and he slept.
translation:
  language: zh_hans
  text: 他从那地方的石头中取了一块，放在那棵树下。他独自前行[a]，随后睡着了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：行走。
    reason: Ge'ez 动词可表示走、行进或旅行；此处“前行”保留其较宽泛的意义，脚注呈现“行走”这一替代理解。
lexical_decisions:
- source_word: ወነሥአ፡ እምእብነ፡ ውእቱ፡ መካን
  choice: 他从那地方的石头中取了一块
  rationale: 按字面结构保留“从那地方的石头中”及省略而可自然补出的“一块”，与雅各旅途场景相符。
- source_word: ወአንበረ፡ ታሕተ፡ ውእቱ፡ ዕፅ
  choice: 放在那棵树下
  rationale: ዕፅ 可指树或木；本句有明确的指示成分，故译作“那棵树”，而不泛化为“树”。
- source_word: የሐውር
  choice: 前行
  rationale: 该动词可表达走、行进或旅行；“前行”既贴近动作本义，也符合长途赶路的上下文，且不必武断限定为徒步或更宽泛的旅行。
- source_word: ወኖመ
  choice: 后来睡着了
  rationale: 译出“睡”的叙事结果；“后来”自然表达连续动作，不把原文简单连接误读为同时发生。
theological_decisions: []
