  yaml_path: translation/extra_canonical/jubilees/027/027.yaml
  text: And behold, I will be with you and will keep you wherever you go, and I will bring you back into this land in peace. For I will not leave you until I have done everything that I have told you.
translation:
  language: zh_hans
  text: 看哪，我必与你同在；无论你往哪里去，我都必保护你，也必使你平安回到这地。因为我绝不离开你，直到我成就了我对你所说的一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነየ
  choice: 看哪
  rationale: 保留引起注意的郑重语气，符合现代中文经文体，同时比“你看”更庄重。
- source_word: እሄሉ፡ ምስሌከ
  choice: 我必与你同在
  rationale: 直接表达应许性的同在，保留原文第一人称与第二人称单数关系。
- source_word: ወእዐቅበከ
  choice: 我都必保护你
  rationale: 该动词有守护、看守之意；“保护”在现代普通话中自然清楚。
- source_word: በኵለን፡ ወእዴ፡ ሖርከ
  choice: 无论你往哪里去
  rationale: 按语境合译地点范围与“去/行走”的表达，呈现“在你所去的一切地方”的意思。
- source_word: ወአገብአከ፡ ውስተ፡ ዛ፡ ምድር፡ በሰላም
  choice: 也必使你平安回到这地
  rationale: “使……回来”准确体现使役意义；将“平安”自然地与归回结合。
- source_word: ኢየኀድገከ
  choice: 我绝不离开你
  rationale: “离开”保留原文不撇下、不放弃的核心意义；“绝不”体现否定语气的力度。
- source_word: እስከ፡ ሶበ፡ እገብር፡ ኵሎ፡ ዘእቤለከ
  choice: 直到我成就了我对你所说的一切
  rationale: “成就”适合应许得以实现的语境，并保留“直到”结构而不消解其修辞张力。
theological_decisions:
- issue: “直到”是否暗示应许完成后神将离开
  choice: 保留“直到”原有结构，不作解释性改写
  alternative: 译为“我必一直与你同在，并成就……”以排除完成后离开的可能
  rationale: 原文的时间界限表达具有潜在张力；翻译不应以神学推论替代文本本身，也不应暗示超出原文的结论。
- issue: “平安”修饰归回还是进入土地后的状态
  choice: 译作“平安回到这地”
  alternative: 译作“把你带回这地，使你平安”
  rationale: 原文可自然理解为以平安/安然的方式归回；所选表达简洁且不额外拆分为第二项应许。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以分号划分同在、保护和归回的应许，并保留“看哪”“成就”等适度经文语体。
