  text: Rise and go to Mesopotamia, to the house of Bethuel, your mother’s father, and take for yourself a wife from there, from the daughters of Laban, your mother’s brother.
translation:
  language: zh_hans
  text: 起来，往美索不达米亚去，到你外祖父彼土利家里，从那里为自己娶一个妻子，就是从你舅父拉班的女儿中娶一个。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥእ
  choice: 起来
  rationale: 准确传达命令式“起身、起来”，并保持自然庄重的现代汉语表达。
- source_word: ፄስጶጦሚያ
  choice: 美索不达米亚
  rationale: 采用该地名在现代汉语中的通行译名。
- source_word: ቤተ፡ ባቱኤል
  choice: 彼土利家里
  rationale: “家”在此既可指住所，也可带有家族之意；译作“家里”符合此行程指令的自然语境，同时不排除家族含义。
- source_word: አቡሃ፡ ለእምከ
  choice: 你外祖父
  rationale: 原文直译为“你母亲的父亲”；汉语用亲属称谓“外祖父”简洁准确。
- source_word: ወንሣእ፡ ለከ፡ ብእሲተ
  choice: 为自己娶一个妻子
  rationale: 保留“为自己”这一反身关系；在婚配语境中，“娶妻”比字面“取一个女人”自然且准确。
- source_word: እምአዋልደ፡ ላባ
  choice: 从……拉班的女儿中
  rationale: 保留复数“女儿们”所表达的选择范围，汉语以“女儿中”自然呈现。
- source_word: እኁሃ፡ ለእምከ
  choice: 你舅父
  rationale: 原文为“你母亲的兄弟”；“舅父”准确表达母系兄弟关系，并保持庄重语体。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事命令语体。亲属关系使用“外祖父”“舅父”，避免逐词硬译造成生涩；以“就是”连接对妻子来源的进一步限定，使句法清晰，同时保留原文重复说明的结构。
