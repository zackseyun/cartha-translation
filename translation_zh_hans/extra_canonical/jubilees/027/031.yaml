base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027/031.yaml
  text: and I return to my father’s house in peace, then the Lord will be my God, and this stone that I have set up as a pillar for a sign in this place will be the house of the Lord. And of everything that you give me, I will surely give a tenth to you, my God.”
translation:
  language: zh_hans
  text: 我若平安回到我父亲家，主就必作我的上帝；我在这地方立为柱子、作为记号的这块石头，必成为主的殿。凡你赐给我的，我必把十分之一献给你，我的上帝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትመየጥ
  choice: 回到
  rationale: 该动词在此表示返回，配合“我父亲家”译作“回到”自然准确。
- source_word: በሰላም
  choice: 平安
  rationale: 保留原文关于安然、平安归回的常用圣经表达。
- source_word: ሐውልተ፡ ለትእምርት
  choice: 立作记号
  rationale: 兼顾“柱石/纪念物”与“记号”的含义；石头已经在后文明确，中文无需重复堆叠名词。
- source_word: ቤተ፡ እግዚአብሔር
  choice: 耶和华的殿
  rationale: 此处是敬拜场所意义的“上帝之家”，译作“殿”简洁庄重，并与石头成为圣所的语境相合。
- source_word: አሡር
  choice: 把十分之一献给
  rationale: 该词表示取十分之一或缴纳什一；“献给”自然表达向上帝奉上的动作。
theological_decisions:
- issue: 条件句与“耶和华作我的上帝”的关系
  choice: 保留“我若……耶和华就必……”的条件结构
  alternative: 译作“我平安回去以后，耶和华就是我的上帝”
  rationale: 原文延续雅各誓愿的条件句，直译可保留其神学张力，不把它改写成单纯的时间关系。
- issue: 石头与“耶和华的殿”的关系
  choice: 译为“这块石头……必成为耶和华的殿”
  alternative: 解释为石头标示未来建殿之处
  rationale: 原文直接以石头为主语并称其将成为上帝之家；不在正文中加入原文没有的解释。
- issue: 十分之一承诺的语气
  choice: “我必把十分之一献给你”
  alternative: “我必将十分之一分别出来”
  rationale: 保留明确的奉献对象和承诺语气，不进一步规定其礼仪形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。神名 እግዚአብሔር 依常见中文圣经传统译为“耶和华”，አምላኪየ 译为“我的上帝”。句式保留誓愿的条件性及原文重复称呼，避免替原文化解神学张力。
