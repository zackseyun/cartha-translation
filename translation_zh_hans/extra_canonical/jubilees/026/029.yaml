  language: zh_hans
  text: “愿他蒙福；愿他所有的后裔永远蒙福。”事情是这样发生的：当以扫听见他父亲以撒的话时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቡሩከ፡ ይኩን
  choice: 他必蒙福
  rationale: 以自然、庄重的现代汉语表达祝福式结构，同时保留其将来或祈愿语气。
- source_word: ኵሉ፡ ዘርኡ
  choice: 他所有的后裔
  rationale: ዘር可指种子、子孙或后裔；此处指人的世系，译作“后裔”最合语境，ኵሉ译为“所有的”。
- source_word: እስከ፡ ለዓለም
  choice: 永远
  rationale: 该表达表示持续至永世，汉语以“永远”简洁传达。
- source_word: ወኮነ፡ ሶበ፡ ሰምዐ
  choice: ……听见……时
  rationale: 原文含叙事衔接“事情发生了/于是”及时间从句；现代汉语用“……时”自然承接，避免生硬直译。
- source_word: ነገረ፡ አቡሁ፡ ይስሐቅ
  choice: 他父亲以撒所说的话
  rationale: 保留“话/言语”的明示内容及“父亲以撒”的身份关系。
theological_decisions:
- issue: 祝福语气的表达
  choice: 他必蒙福
  alternative: 愿他蒙福
  rationale: ይኩን可承载祈愿或宣告意味；上下文是已经发出的父权祝福，采用“必”保留其宣告性，但不额外解释祝福机制。
translation_notes:
  register: 采用现代标准书面汉语，庄重而易懂。本节以逗号结尾，因为原文句法尚未结束，并将叙事过渡压缩为自然的时间从句。
