base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/005.yaml
  text: And Rebekah called Jacob her son and said to him, “Look, I heard Isaac your father speaking with Esau your brother, saying, ‘Hunt game for me and prepare food for me, and bring it to me, that I may eat and bless you before the LORD before I die.’”
translation:
  language: zh_hans
  text: 利百加把儿子雅各叫来，对他说：“你看，我听见你父亲以撒对你哥哥以扫说：‘去为我打些野味[a]，给我做成食物，拿来给我吃，好让我在耶和华面前、在我死以前为你祝福。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为我猎取野味”。
    reason: 原文动词明确含打猎或捕获猎物之意；脚注给出更形式对应的表达。
lexical_decisions:
- source_word: አሰግር፡ ሊተ
  choice: 去为我打些野味
  rationale: 动词意为打猎、捕获猎物；与后面的“拿来”分开表达，避免误译成重复的“带来”。
- source_word: መብልዐ
  choice: 食物
  rationale: 采用自然且涵盖面适当的现代汉语，对应所预备供人食用之物。
- source_word: በቅድመ፡ እግዚአብሔር
  choice: 在耶和华面前
  rationale: 直译介词短语，保留祝福发生于上帝面前这一神学表述。
- source_word: ዘእንበለ፡ እሙት
  choice: 在我死以前
  rationale: 按上下文表达时间界限，符合现代汉语习惯。
theological_decisions:
- issue: 祝福与“在耶和华面前”的关系
  choice: 好让我在耶和华面前、在我死以前为你祝福
  alternative: 好让我在死以前，在耶和华面前为你祝福
  rationale: 保留原文两个修饰成分，不把“在耶和华面前”弱化为一般虔敬语；顿号帮助读者辨明并列的状语而不强行判定其强调范围。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“你看”保留原文提示听者注意的语气；引语层次清楚，并避免将前一动词误作“拿来”，因为后文另有明确的“拿来”。
