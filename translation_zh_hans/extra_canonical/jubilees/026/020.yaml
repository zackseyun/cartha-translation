  text: “从你打来的野味中拿些来，我儿，好让我的心[a]祝福你。”他就把食物端到父亲面前，父亲吃了；他又给父亲拿来[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的心”直译为“我的灵魂”。
    reason: 保留原文身体／人格用语的语义信息。
  - marker: b
    text: “拿来”的宾语“酒”因经文分节而出现在下一节，本句在此尚未结束。
    reason: 说明分节造成的宾语后置，避免误以为原句完整或缺文。
lexical_decisions:
- source_word: እምዘ፡ አደንከ፡
  choice: 从你打来的野味中拿些来
  rationale: 原文直译近于“从你所猎取的（东西）中”；结合语境，以“野味”自然表达省略的猎物，并补出汉语所需的“拿些来”。
- source_word: ነፍስየ፡
  choice: 我的心
  rationale: 字面是“我的灵魂／性命”；此处指说话者本人内在的意愿与祝福，以“我的心”保留人格化表达，同时避免现代汉语中“灵魂祝福”过于生硬。
- source_word: ወአቅረበ፡ ሎቱ፡
  choice: 他就把食物端到父亲面前
  rationale: 动词表示使之靠近、呈上；按上下文补出先前所说的食物，并用“父亲”澄清代词指向。
- source_word: ወአብአ፡ ሎቱ፡
  choice: 他又给父亲拿来——
  rationale: 该动词可指带来或拿进来；其宾语“酒”因分节出现在下一节，故本节不擅自补入宾语，以破折号提示句意未完。
