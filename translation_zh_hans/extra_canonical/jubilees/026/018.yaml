  text: And Isaac did not recognize him, because his hands were hairy like his brother Esau’s hands, so he blessed him.
translation:
  language: zh_hans
  text: 以撒没有认出他，因为他的手上有毛，像他哥哥以扫的手一样；于是以撒祝福了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要祝福他。”
    reason: 原文末句也可理解为目的关系，而非叙事结果。
lexical_decisions:
- source_word: ኢያእመረ
  choice: 没有认出
  rationale: 此处动词在乔装辨认的叙事情境中指未能辨认身份；译为“没有认出”比泛泛的“不知道”更准确自然。
- source_word: እደዊሁ
  choice: 他的双手
  rationale: 保留复数意义，并用“双手”表达现代汉语中自然的身体部位说法。
- source_word: ጸጓር
  choice: 有毛
  rationale: 描述手部多毛的触感特征；“有毛”准确、通俗，也避免“毛茸茸”可能带来的过度修饰。
- source_word: ይባርኮ
  choice: 给他祝福
  rationale: 按叙事结果理解为以撒实际施行祝福；汉语用“给他祝福”清楚表达施事者与受事者。
theological_decisions:
- issue: 末句“ከመ፡ ይባርኮ”的结果或目的关系
  choice: 于是以撒给他祝福
  alternative: 为要给他祝福／好给他祝福
  rationale: ከመ 加虚拟式在此可有目的或结果色彩；上下文的叙事进程更支持结果，即以撒因未认出雅各而给他祝福，但用脚注保留目的性理解。
- issue: 祝福对象代词及主语清晰度
  choice: 重复“以撒”，并保留“他”作受词
  alternative: 于是给他祝福
  rationale: 原文动词形态表明以撒是施事者；汉语若连续使用代词容易产生歧义，因此重提“以撒”，不改变原文所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留句首因果链条，不补出原文未明说的“雅各”；“哥哥以扫”准确反映亲属关系。脚注标记已置于正文相应句末。
