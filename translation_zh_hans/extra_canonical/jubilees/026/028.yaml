  text: as you commanded me.” And Isaac trembled with a very great trembling, and he said, “Who then is this who hunted and caught game and brought it to me, and I ate of everything before you came, and I blessed him?
translation:
  language: zh_hans
  text: “正如你吩咐我的。”以撒就大大颤抖起来，说：“那么，这人是谁？他打猎，又捕获了野味[a]，拿来给我；你还没来，我就全吃了，并且给他祝了福？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他猎取了野味”。原文用了两个动词，分别表示打猎和捕获。
    reason: 说明原文两个并列动作可在汉语中合并表达，但正文保留其区别。
lexical_decisions:
- source_word: ተደመ፡ ይስሐቅ፡ ድማመ፡ ዐቢየ፡ ጥቀ
  choice: 以撒就大大颤抖起来
  rationale: 保留原文以同源词强化“颤抖”且用“极大、非常”加重程度的表达，同时采用现代汉语自然句式。
- source_word: መኑ፡ ውእቱ፡ ዝንቱ
  choice: 那么，这人是谁？
  rationale: 直陈原文现在指示性的“这人是谁”，不改成较弱的“刚才是谁”。
- source_word: ዘነዐወ፡ ወአሥገረ
  choice: 他打猎，又捕获了野味
  rationale: 原文并列两个动作，分别表达追猎和捕获；译文不将二者压缩为单一的“打猎”。
- source_word: ወበላዕኩ፡ እምኵሉ
  choice: 我就全吃了
  rationale: 以自然汉语传达“我吃了其中的一切/全部”，上下文清楚表明所指是带来的食物。
- source_word: ወባረክዎ
  choice: 并且给他祝了福
  rationale: 保留祝福行为已经完成以及男性单数受词“他”。
theological_decisions:
- issue: 以撒所赐祝福的既成性
  choice: 给他祝了福
  alternative: 为他祈福
  rationale: 原文是已经实施的祝福，不宜弱化为一般性的祈愿；同时不在本节额外解释祝福是否可撤回。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“大大颤抖起来”有意保留原文的强调结构；问话拆成两句，以免汉语长定语生硬，同时不改变逻辑关系。
