  text: forever. Whoever curses you will be cursed, and whoever blesses you will be blessed.” And it happened, after Isaac had finished blessing his son Jacob, and after Jacob had gone out from Isaac his father, that he hid himself;[25]
translation:
  language: zh_hans
  text: 直到永远。凡咒诅你的，必受咒诅；凡祝福你的，必蒙祝福。”以撒为儿子雅各祝福完毕，雅各离开了他父亲以撒以后，就藏了起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给吉兹语引文在“父亲以撒”之后以编辑符号中断；Charles 1895的对应文本及其他吉兹语本在此续有雅各“藏了起来”的叙述，因此正文予以保留。
    reason: 文本片段边界与异文说明
lexical_decisions:
- source_word: እስከ፡ ለዓለም
  choice: 直到永远
  rationale: 保留本节开头承接上文的时间表达，不擅自补足其所修饰的内容。
- source_word: ዘይረግመከ፡ ርጉም
  choice: 凡咒诅你的，必受咒诅
  rationale: 对应关系代词、第二人称宾语和被动结果，采用庄重而自然的汉语句式。
- source_word: ወዘይባርከከ፡ ቡሩክ
  choice: 凡祝福你的，必蒙祝福
  rationale: 与前句保持平行，并用“蒙祝福”清楚表达被动含义。
- source_word: እምድኅረ፡ አኅለቀ፡ እንዘ፡ ይባርኮ
  choice: 祝福完毕……以后
  rationale: 准确传达以撒完成祝福这一先行动作，同时使汉语叙事流畅。
- source_word: ወፅአ፡ ያዕቆብ፡ እምይስሐቅ፡ አቡሁ
  choice: 雅各从父亲以撒面前出去
  rationale: 保留“以撒是他父亲”的亲属说明，并以现代汉语表达离开其面前的动作。
theological_decisions:
- issue: 祝福与咒诅的被动施行者
  choice: 用“必受／必蒙”保留被动表达，不指明施行者
  alternative: 译作“上帝必咒诅／祝福他”
  rationale: 源文未明说施行者；不把可能隐含的神圣被动直接解释为上帝的显式行动，以保存原文的含蓄性。
- issue: 雅各离开后“藏起来”的句末内容
  choice: 正文保留“就藏了起来”，并加文本说明脚注
  alternative: 因所给吉兹语片段在“他父亲”后截断而删去
  rationale: 所给行末的编辑符号表明文本跨片段继续；Charles 1895的对应文本及其他吉兹语本见证这一叙事细节，故予以恢复，但通过脚注说明其文本状况。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语言；祝福语保持前后平行。开头“直到永远”按原文保留其承上性质，句末则依权威文本见证补全跨片段的内容。
