  yaml_path: translation/extra_canonical/jubilees/026/007.yaml
  text: And Jacob said to Rebekah his mother[7], “Mother, will I not lack some of all that my father eats and that pleases him? But I am afraid, my mother, that he will recognize my voice and want to touch me. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”
translation:
  language: zh_hans
  text: 雅各对母亲利百加说：“母亲，父亲所吃、所喜爱的食物，我难道还会缺少吗？[a]可是，母亲，我怕他会听出我的声音，又想摸我。你也知道，我皮肤光滑，我哥哥以扫却浑身有毛；在他眼中，我就会像个戏弄他的人。我会做一件他没有吩咐我做的事；他必向我发怒，我就会给自己招来诅咒，而不是祝福。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的吉兹文在句法和词义上较难。也可译作：“母亲，父亲所吃、所喜爱的食物，我难道会缺少其中的一些吗？”
    reason: 保留开头反问句中“缺少”的范围及句法关系的不确定性，不将有争议的细节过度确定化。
lexical_decisions:
- source_word: ኢይምሕክ
  choice: 难道还会少了什么吗
  rationale: 按此处习语理解为“缺少”，保留反问语气；主语指雅各可用的、父亲惯常食用的东西，汉语中以较自然的省略表达。
- source_word: ወያሠምሮ
  choice: 所喜爱的
  rationale: 源自动词“喜悦、喜欢”，指令以撒满意的食物，不译作“辨认”。
- source_word: ኢይለቡ፡ ቃልየ
  choice: 会听出我的声音
  rationale: 在恐惧动词后的否定结构表达所担心会发生之事；结合语境译为父亲会凭声音认出雅各。
- source_word: ይፍቅድ፡ ይገሥሠኒ
  choice: 想摸我
  rationale: 分别保留“想要”和“触摸我”的主动含义，避免倒置为“不许我摸他”。
- source_word: ልሙጽ
  choice: 皮肤光滑
  rationale: 与以扫“浑身有毛”形成身体触感上的明确对比。
- source_word: ዘያስተአኪ
  choice: 戏弄他的人
  rationale: 表达欺弄、嘲弄之意，同时不把原文进一步解释成特定法律或礼仪罪名。
- source_word: ይትመዓዓኒ
  choice: 恼怒我
  rationale: 依语境表达以撒因受欺弄而向雅各发怒，保留后接诅咒的因果走向。
theological_decisions:
- issue: 雅各对欺骗行为的道德认识
  choice: 我这样做，是做他没有吩咐我的事
  alternative: 我就会欺骗他／犯罪得罪他
  rationale: 原文从父亲未曾吩咐的行为来陈述，不替文本强化为明确的神学或道德定罪。
- issue: 诅咒与祝福的来源
  choice: 我给自己招来的就不是祝福，而是诅咒
  alternative: 上帝会诅咒我而不祝福我
  rationale: 原文说雅各把诅咒招到自己身上，并未明说施行者；译文不补入上帝。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。保留雅各两次称呼“母亲”的情感语气，并以“听出”“想摸我”清楚呈现他担忧声音和触感都会暴露身份。祝福与诅咒的对照按原文直陈。
