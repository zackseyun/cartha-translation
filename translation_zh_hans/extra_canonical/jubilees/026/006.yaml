base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/006.yaml
  text: 'And now, my son, listen to my voice in what I command you: go to your flock and take for me two good young goats, and I will prepare them as food for your father, such as he loves, and you shall bring it to your father, and he will eat, and he will bless you before the LORD before he dies, and you shall be blessed.”'
translation:
  language: zh_hans
  text: “现在，我儿，你要听我所吩咐你的话：到你的羊群里去，给我取两只上好的小山羊来，我要做成你父亲所喜爱的食物。你要拿给你父亲；他吃了以后，就会在去世以前、在主面前祝福你，你也必蒙福。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መርዔትከ
  choice: 你的羊群
  rationale: 该词指受牧养的牲畜群；上下文随即提到小山羊，译作“羊群”自然且不把范围不必要地限死。
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ፡ ሠናያነ
  choice: 两只肥美的小山羊
  rationale: 逐项保留“两只”“幼小的山羊”和“好的”之意；汉语以“肥美”表达适合烹制、品质上佳，符合叙事情境。
- source_word: መብልዐ
  choice: 食物
  rationale: 采用普通而宽泛的“食物”，不擅自限定具体菜肴或烹调方式。
- source_word: ይባርከ
  choice: 祝福你
  rationale: 该动词在此指父亲向儿子施予祝福；宾语由上下文明确，中文补出“你”使语意完整。
- source_word: ቡሩከ
  choice: 蒙福
  rationale: 用被动意义自然的“蒙福”表达成为受祝福者的状态，并与前句“祝福你”相呼应。
theological_decisions:
- issue: “在主面前”与父亲祝福之间的关系
  choice: 他就会……在主面前祝福你
  alternative: 主会在他去世以前祝福你
  rationale: 原文动词主语延续为父亲，而“在主面前”修饰祝福行为；此译法既保留祝福的神圣见证背景，也不把施行祝福的语法主语改成主。
- issue: 末句的语气
  choice: 你也必蒙福
  alternative: 愿你蒙福
  rationale: 原文可带结果或将来意味；在本句计划与预期结果的语境中，以“必蒙福”最自然，同时不额外解释祝福如何实现。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留母亲对儿子的直接命令、行动次序，以及父亲临终前在主面前祝福儿子的神学张力；不对欺骗行为作经文之外的道德评注。
