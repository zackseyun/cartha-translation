  text: And he said, “Have you not reserved a blessing for me, father?” And Isaac answered and said to Esau, “Look, I have made him lord over you, and I have given all his brothers to him as servants; and with abundance.”
translation:
  language: zh_hans
  text: 他说：“父亲，你没有为我留下一份祝福吗？”以撒回答以扫说：“看，我已经立他作你的主，也把他的众弟兄都交给他作仆人；又以丰盛[a]……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“又以丰盛”处中断，未说明何物丰盛。
    reason: 说明源文本末尾残缺，避免读者把省略号误认为单纯的修辞停顿。
lexical_decisions:
- source_word: በረከተ
  choice: 一份祝福
  rationale: 此处是不定意义，指另有一份可留给以扫的祝福；现代汉语加量词“一份”自然且准确。
- source_word: እግዚአ፡ ሤምክዎ፡ ለከ
  choice: 我已经立他作你的主
  rationale: 保留“设立/置为主”的使役意义，并明确其相对于以扫的统属关系。
- source_word: አኀዊሁ
  choice: 他的众弟兄
  rationale: 按字面保留复数“弟兄”，不因创世记平行叙事而改成单数或扩大为“亲族”。
- source_word: አግብርተ፡ ይኩንዎ
  choice: 交给他作仆人
  rationale: 自然表达“使他们成为他的仆人”，并与前面的“把……交给他”衔接。
- source_word: በብዝኀ
  choice: 以丰盛
  rationale: 原文在此截断，只表达“以/凭丰盛”，未明说所丰盛的事物；正文不擅自补入粮食、酒或产业。
theological_decisions:
- issue: 以撒祝福的权柄与既成效力
  choice: 译作“我已经立他作你的主”
  alternative: “我曾宣告他为你的主”
  rationale: 原文以完成式陈述所作安排，不将其弱化为纯粹口头愿望，也不进一步解释祝福如何生效。
- issue: 残缺末语的补足
  choice: 保留未完句，并以省略号标示
  alternative: 依创世记27:37补为“又用五谷和新酒供养他”
  rationale: 所给吉兹语文本止于“又以丰盛”，补足具体对象会消除现存文本的残缺与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看”保留引起注意的语气；末尾用省略号忠实呈现所给文本未完。
