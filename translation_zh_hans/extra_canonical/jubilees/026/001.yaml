  text: “My son, I have grown old, and now my eyes are too dim to see, and I do not know the day of my death.”
translation:
  language: zh_hans
  text: “我儿，我已经老了。看哪，我的眼睛昏花，不能看见；我也不知道自己哪一天死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: 我儿
  rationale: 直译为“我的儿子”；中文直接称呼用“我儿”自然、庄重。
- source_word: አነ፡ ረሳዕኩ
  choice: 我已经老了
  rationale: 保留第一人称和年老这一完成状态，符合现代汉语表达。
- source_word: ወናሁ
  choice: 看哪
  rationale: 保留提示注意的语气词 ናሁ，而不省略其话语功能。
- source_word: አዕይንትየ፡ ከፍአ፡ ለርእይ
  choice: 我的眼睛昏花，不能看见
  rationale: 按语境将眼睛视力衰败自然译出；“昏花”比机械直译“眼睛变坏”更符合现代中文。
- source_word: ወኢያአምር፡ ዕለተ፡ ሞትየ
  choice: 我也不知道自己哪一天死
  rationale: 忠实表达“不知道我死亡之日”，用自然的现代汉语呈现，不额外解释死亡时间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的直接引语。源文开头没有“他说”，故不增补叙述引语；保留“看哪”以反映原文提示语气。
