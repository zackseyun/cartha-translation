  text: Let nations and peoples bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. And all the blessing with which God blessed me and blessed Abraham my father—let it be for you and for your seed.
translation:
  language: zh_hans
  text: 愿列国和万民都向你下拜。[a]愿你作你弟兄的主；愿你母亲的儿子都向你下拜。上帝赐福给我、又赐福给我父亲亚伯拉罕时所赐的一切福分，愿都归给你和你的后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处的句法和分节略显突兀；“列国”也可能与上一节末尾的动词相连，而本句作“愿万民向你下拜”。
    reason: 说明源文本在“列国”的归属和本节开头句法上的真实歧义，同时正文依照所给分节译出该词。
lexical_decisions:
- source_word: አሕዛብ፡ … ሕዝብ፡
  choice: 列国和万民
  rationale: 两个相邻名词分别具有“列国／外邦”和“民众／人民”的含义；正文兼收二者，不遗漏本节开头的አሕዛብ。
- source_word: ኩን፡ እግዚአ፡
  choice: 你要作……的主
  rationale: 保留祝福语境中的祈愿／命令语气，并以现代汉语清楚表达其支配含义。
- source_word: ውሉደ፡ እምከ፡
  choice: 你母亲的儿子
  rationale: 按原文具体亲属称谓直译，不概括为“兄弟”，从而保留与前句“弟兄”的平行变化。
- source_word: ዘርእከ፡
  choice: 你的后裔
  rationale: 原词本义为“种子”，用于家系时是集合性的“后裔”；此译既自然，也保留单数集合概念可能涵盖多代的范围。
- source_word: እግዚአብሔር፡
  choice: 上帝
  rationale: 在此吉兹语传统文本中采用普通读者易懂而庄重的神称，不额外引入“耶和华”等更具体的专名判断。
theological_decisions:
- issue: 祝福话语的语气
  choice: 以“愿……／你要……”表达祈愿性命令
  alternative: 译作陈述性的“他们必……／你必……”
  rationale: 上下文是以撒施予的祝福，动词形式和语境容许命令／祈愿色彩；中文用“愿”和“要”保存祝愿中同时带有宣告与嘱令的张力。
- issue: “后裔”的单复数与指向
  choice: 采用集合名词“后裔”，不限定为单一人物或多个子孙
  alternative: 译作“子孙”或“那一位后裔”
  rationale: 原词可作集合性家系用语；不在译文中加入后续神学解释，以保留其范围上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体；以“下拜”表现臣服性敬礼，以“福分”避免“一切祝福”在此处可能产生的动作／内容混淆。
