  text: And Jacob went in to his father and said, “I am your son; I have done as you told me. Rise, sit, and eat from what I have hunted, father, so that your soul may bless me.”
translation:
  language: zh_hans
  text: 雅各进去，到他父亲那里，说：“我是你儿子；我已经照你吩咐我的去做了。父亲，请起来坐下，吃我所猎得的，好让你亲自祝福我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦአ
  choice: 进去见
  rationale: 原词表示“进入”；结合“到他父亲那里”的方向短语，现代汉语自然表达为“进去见他父亲”。
- source_word: አሰገርኩ
  choice: 我猎得的野味
  rationale: 此处指经狩猎取得之物；译为“猎得的野味”既保留动作来源，也符合父子进食的语境。
- source_word: ነፍስከ
  choice: 你的心
  rationale: 字面为“你的灵魂/生命”；在此是表达父亲本人发出由衷的祝福，汉语用“你的心”较自然，同时以脚注保留字面信息。
theological_decisions:
- issue: “你的灵魂祝福我”的拟人表达
  choice: 好让你的心祝福我
  alternative: 好让你祝福我／好让你的灵魂祝福我
  rationale: 不把表达简化为单纯的“你祝福我”，以保留原文对内在生命或本人的强调；“心”在现代汉语中比“灵魂”用于此句更自然，字面义另见脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留雅各对父亲的直接称呼，并用“请”自然体现命令式话语在亲子语境中的请求语气。
