  text: “The voice is Jacob’s voice[17], but the hands are Esau’s hands.” And he did not recognize him, because it was a turning from heaven to remove his spirit,
translation:
  language: zh_hans
  text: “声音是雅各的声音[a]，双手却是以扫的双手。”他没有认出雅各，因为这是从天而来的转变，要使他的灵离去[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章第17—21节在所据原文资料中的分节并不整齐；这里按吉兹文中辨认与祝福过程最连贯的次序编排。
    reason: segmentation_note
  - marker: b
    text: 或译：“因为这是出于天的转变，要使他的灵被移去。”
    reason: alternative_rendering
lexical_decisions:
- source_word: ቃል፡ ቃለ፡ ያዕቆብ፡
  choice: 声音是雅各的声音
  rationale: 保留原文重复“声音……声音”的辨认句式，也与《创世记》27:22的表达相呼应。
- source_word: እደው፡ እደወ፡ ዔሳው፡
  choice: 双手却是以扫的双手
  rationale: 原文同样重复“手”，汉语以“双手”自然表达身体的一双手；“却”呈现两项判断的反差。
- source_word: ወኢያእመረ፡
  choice: 他没有认出雅各
  rationale: 动词表示不知道或没有辨认出；补出语境明确的宾语“雅各”，避免现代汉语中的指代含混。
- source_word: ሚጠት፡
  choice: 转向
  rationale: 保留名词性结构，可指转变、偏转或使注意发生转移；不把其具体机制解释得过实。
- source_word: እምሰማይ፡
  choice: 从天而来的
  rationale: 直译其来源表达，保留神圣施行者未被明说的含蓄性。
- source_word: ለአሕልፎ፡ መንፈሱ፡
  choice: 为要使他的心神偏离
  rationale: 使役式可表示使之经过、移开或偏离；此处“心神”较“灵”更符合辨认受影响的语境，同时避免误解为灵魂被除灭。
theological_decisions:
- issue: 天上作用与以撒未能辨认之间的关系
  choice: 这是从天而来的转向，为要使他的心神偏离
  alternative: 这是从天而来的转变，为要除去他的灵
  rationale: 保留原文把事件归于“从天而来”的神学张力，但不把“灵”解释成被毁灭或死亡；“偏离”仍容许注意、判断或内在感知受到转移等多种理解。
- issue: “他的心神”所指对象
  choice: 按紧邻主语理解为以撒的心神
  alternative: 理解为雅各或另一未明说对象的灵
  rationale: 语法和叙事语境最自然地指向未认出雅各的以撒，但正文不额外加入“以撒”之名，以保留原文代词形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。首句保留原文的重复和对照；末句尽量贴近吉兹文的名词结构，同时以“心神偏离”避免把含义过度限定为灵魂被移除。
