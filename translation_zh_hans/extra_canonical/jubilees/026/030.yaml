  text: 'he cried out with a very great and bitter cry, and said to his father, “Bless me too, father!” And he said to him, “Your brother came with deceit and has taken away your blessings.” And he said, “Now I know why his name was called Jacob: he has supplanted me these two times. First he took my birthright, and now he has taken my blessing.”'
translation:
  language: zh_hans
  text: 他就放声发出极其悲痛的呼喊，对父亲说：“父亲，也请为我祝福吧！”父亲对他说：“你弟弟用诡计而来，夺去了你的福分[a]。”他说：“现在我明白他为什么名叫雅各了；他两次取代了我：先前夺去了我的长子名分，如今又夺去了我的祝福。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为复数，或译“你的诸福分”。
    reason: 说明此处吉兹语名词为复数，同时避免将复数不必要地解释为“各样”或不同类别。
lexical_decisions:
- source_word: ጸርኀ፡ በቃል፡ ዐቢይ፡ ወመሪር፡ ጥቀ
  choice: 放声大哭，哭声极其悲痛
  rationale: 兼顾“大声”和“极其苦痛”的双重描写，以自然现代汉语表达强烈哀恸。
- source_word: በሕብል
  choice: 用诡计
  rationale: 该词在此表示欺骗、诡诈的手段；“用诡计”贴合上下文，也避免添加具体方式。
- source_word: በረከታቲከ
  choice: 你的各样福分
  rationale: 源文此处为复数，译作“各样福分”明确保留其复数含义，并与后文单数“我的祝福”区分。
- source_word: አዐቀጸኒ
  choice: 取代我
  rationale: 保留与“雅各”之名相关的文字游戏核心含义；此词亦可带有排挤、欺骗之意，但不宜在正文中强行单一化。
- source_word: ልደተየ
  choice: 我的长子名分
  rationale: 语境所指是以扫的长子权利，而非一般的“出生”；采用现代读者易懂且准确的表达。
theological_decisions:
- issue: “雅各”之名与动词之间的文字游戏
  choice: 名叫雅各……两次取代我
  alternative: 名叫雅各……两次欺骗我
  rationale: 选择“取代”较能保留名字与行动之间的关联，同时不把语义完全收窄为道德评价；“欺骗”仍是可能的语境含义。
- issue: 前后“福分/祝福”的数不同
  choice: 前句保留复数“各样福分”，后句保留单数“祝福”
  alternative: 两处均译作单数“祝福”
  rationale: 忠实反映吉兹语前句复数 በረከታቲከ 与后句单数 በረከትየ 的形式差异，不为求表面一致而调和。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；对话清晰，情感强烈但不过分文饰。以“各样福分”保留源文复数，以“取代我”传达雅各名字相关的双关，同时避免导入特定宗派解释。
