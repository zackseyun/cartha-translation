  source_fidelity: 草稿准确传达了大声、苦痛的呼喊、弟弟以诡计而来、前句“福分”的复数与后句“祝福”的单数，以及长子名分。可是“你的各样福分”把单纯的复数较强地解释为不同种类的福分；“他已经两次取代我”在现代汉语中略显生硬，且未充分呈现该处与“雅各”之名相连的双关性和控诉语气。
  naturalness: “放声大哭，哭声极其悲痛”略有语义重复；“用诡计来过”不够自然。改为“放声发出极其悲痛的呼喊”和“用诡计而来”更贴近原文，也更符合庄重自然的现代汉语。
  terminology: “长子名分”恰当。“福分”可作为汉语的集合性名词使用；以脚注说明原文复数即可，避免“各样”所增加的分类意味。“夺去/夺走”适合此处。“取代”保留雅各名字相关的语义核心，但宜改为“他两次取代了我”，使句法自然。
