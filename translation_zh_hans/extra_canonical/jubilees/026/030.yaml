  to: 他就放声发出极其悲痛的呼喊，对父亲说：“父亲，也请为我祝福吧！”父亲对他说：“你弟弟用诡计而来，夺去了你的福分[a]。”他说：“现在我明白他为什么名叫雅各了；他两次取代了我：先前夺去了我的长子名分，如今又夺去了我的祝福。”
