  text: 她把烹制好的食物和自己做的饼交到儿子雅各手里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትብሲሰ
  choice: 烹制好的食物
  rationale: 该词在此指已经烹调好的菜肴或食物；译为“烹制好的食物”自然清楚，也不把具体烹调方式说得过死。
- source_word: ኅብስተ
  choice: 饼
  rationale: 指作为主食的饼；“饼”简洁地保留古代饮食背景。
- source_word: ዘገብረት
  choice: 自己做的
  rationale: 关系从句修饰“饼”，主语为她；加入“自己”使现代汉语指代清晰，没有增加实质信息。
- source_word: ውስተ፡ እዴ
  choice: 交到……手里
  rationale: 按源文的空间表达译出，同时符合现代汉语中表示亲手交付的习惯说法。
- source_word: ወልዳ
  choice: 儿子
  rationale: 源词明确表示“她的儿子”；汉语以“儿子雅各”自然呈现所属关系。
