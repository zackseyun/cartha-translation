  text: And Esau went to the open country to hunt, and to catch, and to bring it to his father.
translation:
  language: zh_hans
  text: 以扫到野外去打猎、捕获猎物，并把猎物带给他父亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገዳመ
  choice: 野外
  rationale: 表示户外、旷野或开阔地带；“野外”自然简洁，符合狩猎场景。
- source_word: ያሥግር
  choice: 打猎
  rationale: 按上下文表示狩猎；用现代汉语常用表达，且不预先重复宾语“猎物”。
- source_word: የአንዝ
  choice: 捕获猎物
  rationale: 该动词在此表示抓住、捕获；补出语境中隐含的“猎物”，清楚保留“猎取—捕获—带回”的动作次序。
- source_word: ያምጽእ
  choice: 带给
  rationale: 表达把所捕之物带到父亲那里；与间接宾语“他父亲”搭配自然。
