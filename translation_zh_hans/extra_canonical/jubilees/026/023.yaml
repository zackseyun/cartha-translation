  yaml_path: translation/extra_canonical/jubilees/026/023.yaml
  text: full, which the LORD has blessed. And may the LORD give you—and multiply you—from the dew of heaven and from the dew of the earth[23], and abundance of grain and oil may he multiply for you. Let them serve you,
translation:
  language: zh_hans
  text: （田地）丰盛，是主所赐福的。愿主从天上的甘露和地上的甘露[a]赐给你，并使你增多；愿他为你增添丰盛的谷物和油。愿他们服侍你，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上的甘露”这一说法较为少见；《创世记》的平行经文可能使人预期这里是“地的肥沃”。本译文依照吉兹语原文，不作协调。
    reason: alternative_reading
lexical_decisions:
- source_word: ምሉእ
  choice: 满盈的
  rationale: 该词意为“满、充盈”，承接上一节所说的田地；不增添原文没有的“福分”。
- source_word: እምጠለ፡ ሰማይ፡ ወእምጠለ፡ ምድር
  choice: 天上的甘露和地上的甘露
  rationale: 依照吉兹语两次出现的“甘露”直译，不按照《创世记》平行经文协调为“地的肥沃”。
- source_word: ወብዝኀ፡ ስርናይ፡ ወቅብእ
  choice: 丰盛的五谷和油
  rationale: “ስርናይ”指谷物、小麦类粮食，“ቅብእ”指油；以自然现代汉语表达其丰足之意。
- source_word: ይትቀነዩ፡ ለከ
  choice: 愿他们服侍你
  rationale: 原文只有复数动词和“你”，没有明说主语是“万民”或“各族”，因此不从《创世记》平行经文补入主语。
theological_decisions:
- issue: 是否按《创世记》27章的平行祝福语补足或协调本句
  choice: 保留《禧年书》吉兹语文本的独特措辞
  alternative: 译作“地的肥沃”，并将末句主语补为“万民”
  rationale: 翻译应优先反映现存原文，不以较熟悉的正典平行经文消除其措辞差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。开头保留其承接上一节的未完句性质；“主”对应吉兹语神圣称谓。末句不擅自补入原文未明说的“万民”。
