    reason: alternative_reading
  revision_rationale: 修订以括号标明首句从前节承接的“田地”，从而保留原文的省略和未完句特征，同时使现代汉语可读。其余改动仅改善句法并以“谷物”避免过度具体化；脚注锚点仍紧附“地上的甘露”。
