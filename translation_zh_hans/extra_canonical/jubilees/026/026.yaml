review_pass:
  verdict: revise
  source_fidelity: 吉兹文本开头确有“他藏了起来”（主语承接上文），随后说以扫从打猎中回来；译文应保留这一动作，但不应把以扫称作“哥哥”。末句原文直译为“愿你的灵魂/生命祝福我”，在汉语正文中译为“愿你祝福我”自然且不失其施动意义，并以脚注说明其字面表达。
  naturalness: “他哥哥以扫”在现代汉语中通常会被理解为“他的年长兄弟以扫”，既不自然也可能造成关系误解。“请我父亲起来”虽摹拟原文第三人称敬称式说法，但现代汉语引语中生硬；改为直接呼告“父亲，请起来……”更自然、庄重。
  terminology: 人名“以扫”正确。“野味”准确传达狩猎所得且符合献食语境。“你的心祝福我”不符合现代汉语常用表达；保留原文“灵魂/生命”这一闪语式措辞的工作宜由脚注承担。
  issues:
  - severity: medium
    issue: “他哥哥以扫”误示以扫为“他”的哥哥。
    rationale: 原文为“以扫，他的兄弟”；结合承接的主语雅各，以扫是其兄弟，并非可由本节语法安全断定为“哥哥”。中文“他哥哥以扫”还会造成不自然的同位关系。
  - severity: medium
    issue: “请我父亲起来”不合现代汉语引语习惯。
    rationale: 原文的“让我父亲起来”属于古代语境中的第三人称敬称/祈使表达；中文宜以“父亲，请起来”传达同一敬意和命令请求。
  - severity: low
    issue: “你的心祝福我”生硬，且脚注的字面说明可更准确。
    rationale: ነፍስ字面较接近“灵魂、生命”，此处是指人本身的惯用表达。正文译“你祝福我”，并在“你”处设脚注，既自然又保留原文信息。
