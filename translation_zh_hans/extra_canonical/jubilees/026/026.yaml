  yaml_path: translation/extra_canonical/jubilees/026/026.yaml
  text: And Esau his brother came in from his hunting. And he also prepared food and brought it to his father, and said to his father, “Let my father arise and eat from my game, so that your soul may bless me.”
translation:
  language: zh_hans
  text: 他藏了起来。他的兄弟以扫打猎回来，也预备了食物，拿到父亲那里，对父亲说：“父亲，请起来吃我打来的野味，好让你[a]祝福我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你”原文直译为“你的灵魂”或“你的生命”；这是指人本身的惯用表达。
    reason: 原文以ነፍስ（“灵魂、生命”）为“祝福”的主语；正文按现代汉语译作“你”，脚注保留字面措辞及其表达功能。
lexical_decisions:
- source_word: ተኀብአ
  choice: 他藏起来以后
  rationale: 该词表示“隐藏、藏匿”；原文在本节开头承接前文，主语未明说，因此采用不补姓名的承接式译法。
- source_word: እምነዓዊሁ
  choice: 打猎回来
  rationale: 按上下文表达以扫从狩猎活动中归来；中文合并方位和来源成分，以自然方式传达其义。
- source_word: መብልዐ
  choice: 食物
  rationale: 泛指预备给父亲吃的食物，不在此处擅自具体化。
- source_word: እመሥገርትየ
  choice: 我打来的野味
  rationale: 指狩猎所得；“野味”既符合叙事场景，也比笼统的“猎物”更适合作为食物。
- source_word: ነፍስከ
  choice: 你的心
  rationale: 字面为“你的灵魂/生命”；此处是闪语式表达，指父亲本人发自内在的祝福。正文用自然中文“你的心”，脚注保留字面信息。
theological_decisions:
- issue: 祝福的施动表达
  choice: 好让你的心祝福我
  alternative: 好让你祝福我
  rationale: 保留原文“你的灵魂/心”作主语的表达，避免把带有古代语言色彩的神学与人观用语完全抹平。
- issue: 本节开头隐藏动作的主语
  choice: 使用“他”而不指名
  alternative: 补作“雅各藏起来以后”
  rationale: 所给吉兹语文本本身没有在该动词处明确写出姓名；译文保持这种承接性，不用上下文推断替代明文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文开头承接前文的“藏起来”动作，并用“请我父亲起来”呈现以扫对父亲的敬称式第三人称说法；不以更口语的“爸爸，你起来”改写。
