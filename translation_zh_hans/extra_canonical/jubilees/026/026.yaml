revisions:
- from: 他藏起来以后，他哥哥以扫也打猎回来了。他也预备了食物，拿到父亲那里，对父亲说：“请我父亲起来，吃我打来的野味，好让你的心[a]祝福我。”
  to: 他藏了起来。他的兄弟以扫打猎回来，也预备了食物，拿到父亲那里，对父亲说：“父亲，请起来吃我打来的野味，好让你[a]祝福我。”
  rationale: 保留本节开头承接上文的未明主语“他藏了起来”，将“以扫”正确译为“他的兄弟”，并将古代第三人称敬称式请求转换为自然、庄重的现代汉语直接呼告。末句不把“灵魂/生命”硬译为汉语“心”，而以正文的自然表达加脚注保留原文的字面与语义范围。
