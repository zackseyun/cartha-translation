  text: And Isaac said to him, “Come near, and let me feel you, my son, whether you are my son Esau or not.”
translation:
  language: zh_hans
  text: 以撒对他说：“靠近些，让我摸摸你，我儿，看看你是不是我的儿子以扫。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅረብ
  choice: 靠近些
  rationale: 准确表达命令式“近前来”，同时符合现代汉语直接引语的自然语气。
- source_word: ወእግስስከ
  choice: 让我摸摸你
  rationale: 源词表示以触摸来辨认；用“摸摸”保留实际动作，也自然体现父亲查验身份的语境。
- source_word: እመ፡ አንተ፡ ወልድየ፡ ዔሳው፡ ወእመ፡ አኮኑ
  choice: 看看你是不是我的儿子以扫
  rationale: 把“是否……或不是”的辨别结构译成现代汉语自然的“是不是”，不改变其疑问和查验性质。
