lexical_decisions:
- source_word: ወይቤ፡ ያዕቆብ
  choice: 雅各说
  rationale: 按吉兹语叙事句式直译，使用自然的现代汉语引语格式。
- source_word: ዘ
  choice: 因为
  rationale: 在此引出对事情迅速发生的原因说明；保留原文的因果关系。
- source_word: አምላክከ
  choice: 你的上帝
  rationale: 保留第二人称单数领属形式“你的”，不将其泛化为“上帝”。
- source_word: ዘአርጐዐኒ
  choice: 把它带到了我面前
  rationale: 表达使某物来到说话者面前的使役/带来含义；汉语采用自然的“把”字句。
- source_word: ቅድሜየ
  choice: 在我面前
  rationale: 保留原文的空间性表达，而不释义为“给我”或“让我遇见”。
theological_decisions:
- issue: “你的上帝”是否应改为“上帝”或“耶和华”
  choice: 你的上帝
  alternative: 上帝／耶和华你的上帝
  rationale: 原文明确含第二人称领属后缀，但没有相应的神名；因此既保留“你的”，也不增补神名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；句法贴近原文，同时避免生硬的“使它来到”。
