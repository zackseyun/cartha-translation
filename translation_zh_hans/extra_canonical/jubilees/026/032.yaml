  text: with grain and wine and oil I have sustained him. And for you, what can I do now, my son?” And Esau said to Isaac his father, “Do you have only one blessing, father? Bless me too, father!”
translation:
  language: zh_hans
  text: 我用小麦、酒和油供养他。至于你，我儿，现在我还能为你做什么呢？”以扫对他父亲以撒说：“父亲，你只有一个祝福吗？父亲，也请为我祝福吧！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስርናይ፡ ወወይን፡ ወቅብዕ
  choice: 五谷、新酒和油
  rationale: 依次表达谷物、酒和油；“五谷”在现代中文中自然概括粮食，“新酒”保留祝福语境中物产丰饶的意味。
- source_word: አጽናዕክዎ
  choice: 供养他
  rationale: 该动词基本义涉及使坚固、扶持；在以谷物、酒和油为手段的语境中，译作“供养”自然体现以物资扶持、维持生活之意，同时不作过度发挥。
- source_word: ምንተ፡ እሬሲ
  choice: 我还能为你做什么呢
  rationale: 保留反问语气，并以“还能”体现先前祝福已经给出的语境。
- source_word: በረከት
  choice: 祝福
  rationale: 采用中文圣经传统中清楚而通行的对应词。
- source_word: ባርከኒ፡ ኪያየኒ
  choice: 也请为我祝福吧
  rationale: 重复的人称成分带有恳求和强调作用；用“也……我”自然传达“我也”的诉求。
theological_decisions:
- issue: 以撒的话是否意味着祝福不可撤回或绝对仅有一个
  choice: 保持反问原貌，不补充祝福不可撤回等解释
  alternative: 将其解释为“我已经没有任何祝福可以给你”
  rationale: 源文只记录“你只有一个祝福吗”的追问及以撒此前的反问；不应在正文中加入关于祝福性质的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“父亲”在以扫的两次呼求中重复保留，以呈现其急切恳求。
