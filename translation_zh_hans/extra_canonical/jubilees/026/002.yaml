base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/002.yaml
  text: And now take your hunting gear, your quiver and your bow, and go out to the field and hunt and catch game for me, my son, and prepare food for me such as my soul loves, and bring it to me so that I may eat, and my soul may bless you before I die.”
translation:
  language: zh_hans
  text: 现在，拿上你的猎具、箭袋和弓，到田野去，为我猎捕野味，我儿。给我预备合我心意的食物，拿来给我吃，好让我在死以前祝福你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንዋየ ነፃዊከ
  choice: 你的猎具
  rationale: 指打猎所用的器具，随后具体列出箭袋和弓；译作“猎具”简洁自然。
- source_word: ምትኃደከ ወቀስትከ
  choice: 你的箭袋和弓
  rationale: 分别对应箭袋与弓，保留原文并列结构。
- source_word: ወነዐው ... ወአንዝ
  choice: 猎取
  rationale: 原文连续使用“猎”和“捕获”两个动作；汉语“猎取”兼含追猎与捕获，避免生硬重复，同时不遗漏取得野味的结果。
- source_word: ነፍስየ
  choice: 我／我所喜爱的口味
  rationale: 闪语式“我的魂”在此表示本人及其食欲、喜好；首次按自然汉语表达为“我所喜爱的口味”，末次在祝福句中直接译为“我”。
- source_word: ወተባርከ ነፍስየ
  choice: 好让我……祝福你
  rationale: 字面为“让我的魂祝福你”；现代汉语用主体“我”最自然，也保留祝福行为。
theological_decisions:
- issue: “我的魂祝福你”的表达
  choice: 让我……祝福你
  alternative: 让我的心祝福你／让我的灵魂祝福你
  rationale: 此处“魂”是表示整个人的惯用说法，并非要区分人的构成；直译“灵魂”容易引入原文并不强调的人论含义。
- issue: 两个狩猎动词的处理
  choice: 猎取野味
  alternative: 猎捕野味／打猎并捕获野味
  rationale: 保留“猎”与“取得猎物”两层语义；“猎取”在现代汉语中凝练而庄重，不把两个紧密相连的动作误解为互不相干的阶段。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我儿”保留父亲对儿子的直接称呼；“田野”“箭袋”等词准确且具经书叙事风格。句末引号依所给片段保留为结束引号。
