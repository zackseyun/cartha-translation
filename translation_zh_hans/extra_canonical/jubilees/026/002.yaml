revisions:
- from: 现在，拿上你的猎具、箭袋和弓，到田野去，为我猎取野味吧，我儿。照我所喜爱的口味给我做成食物，拿来给我吃，好让我在死以前祝福你。”
  to: 现在，拿上你的猎具、箭袋和弓，到田野去，为我猎捕野味，我儿。给我预备合我心意的食物，拿来给我吃，好让我在死以前祝福你。”
  rationale: 修订仅澄清原文两个相连的狩猎动词，并使“我所喜爱”的表达不被不必要地收窄；不改变叙事关系、语气或神学含义。英语审校轨迹中的“Or”说明的是先前较简略的英文译法，并非原文异读，故中文无需增设脚注。
