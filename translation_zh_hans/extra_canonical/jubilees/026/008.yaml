  text: And Rebekah his mother said to him, “Let your curse be on me, my son; only listen to my voice.”
translation:
  language: zh_hans
  text: 他母亲利百加对他说：“我儿，你所受的咒诅归到我身上吧；只管听我的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መርገምከ
  choice: 你所受的咒诅
  rationale: 该词由“咒诅”及第二人称单数属格构成；译作“你所受的咒诅”自然表达“临到你的咒诅”，同时避免误解为“你发出的咒诅”。
- source_word: ላዕሌየ
  choice: 归到我身上
  rationale: 字面义为“在我之上/临到我”，在咒诅语境中译为“归到我身上”符合现代汉语表达。
- source_word: ዳእሙ
  choice: 只管
  rationale: 这里是限制、转折性的“只是/但”，与后面的命令连用，译作“只管”自然传达母亲催促儿子照办的语气。
- source_word: ስማዕ፡ ቃልየ
  choice: 听我的话
  rationale: 直译为“听我的声音/言语”；汉语惯用“听我的话”，既可表示听从，也保留言语层面的含义。
theological_decisions:
- issue: 母亲承担咒诅的表述力度
  choice: 我儿，你所受的咒诅归到我身上吧
  alternative: 我儿，愿你的咒诅临到我
  rationale: 采用自然而庄重的汉语，保留说话者主动承担可能咒诅的强烈表态；不解释其是否真能转移咒诅，也不额外作神学判断。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“他母亲利百加”保留原文对人物关系和姓名的双重说明；引语简洁有力，与上下文中的直接命令相称。
