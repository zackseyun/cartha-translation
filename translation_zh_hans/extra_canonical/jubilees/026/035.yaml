  text: and your seed will be uprooted from under heaven.” And Esau hated Jacob because of the blessing with which his father had blessed him, and he said in his heart, “Now let the days of mourning for my father come near, and I will kill Jacob my brother.”
translation:
  language: zh_hans
  text: “你的后裔也必从天底下被连根拔除。”以扫因他父亲给雅各的祝福而憎恨雅各，心里说：“如今，愿为我父亲举哀的日子临近；我便要杀死我弟弟雅各。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሢሮ
  choice: 被连根拔除
  rationale: 该动词表达拔除、根除之意；用被动式承接原文预言语气，并保留彻底毁灭的意象。
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: “种子”在此指血脉后代，译作“后裔”符合现代汉语及上下文。
- source_word: ይትሜአክ
  choice: 恨
  rationale: 直接表达以扫因祝福而对雅各产生的敌意，不额外强化为较具解释性的措辞。
- source_word: ይእዜኒ
  choice: 如今
  rationale: 保留原文明确的时间或逻辑标记“现在、如今”。
- source_word: ይብጻሕ
  choice: 愿……临近
  rationale: 保留动词“来到、接近”的祈愿式语气，而不把它改写成单纯的将来陈述。
- source_word: እቀትሎ
  choice: 我就杀死
  rationale: 准确表达第一人称杀害意图；“就”自然连接前面的时间条件。
theological_decisions:
- issue: 以扫话语中父亲之死与举哀日子的关系
  choice: 保留“愿为我父亲举哀的日子临近”的含蓄说法
  alternative: 直译或解释为“等我父亲死后”
  rationale: 原文没有直接说“等父亲死后”，而以举哀之日委婉指向父亲去世；译文不替原文消除这种含蓄与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从天下被连根拔除”保留审判宣告的强烈意象；以扫的内心话保留原文的祈愿式和委婉表达，不直接补出“父亲死后”。
