revisions:
- from: “你的后裔也必从天下被连根拔除。”以扫因父亲给雅各所祝的福而恨雅各，心里说：“如今，愿为我父亲举哀的日子临近[a]，我就杀死我的兄弟雅各。”
  to: “你的后裔也必从天底下被连根拔除。”以扫因他父亲给雅各的祝福而憎恨雅各，心里说：“如今，愿为我父亲举哀的日子临近；我便要杀死我弟弟雅各。”
  rationale: 润饰两处汉语表达，并用分号使以扫内心话的愿望与杀意衔接更自然。保留“如今”、举哀的委婉说法、动词“临近”及脚注所提示的句法歧义；未将其解释为父亲已经或必然即刻死亡。
