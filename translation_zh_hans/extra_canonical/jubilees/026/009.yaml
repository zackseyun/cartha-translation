  text: And Jacob listened to the voice of Rebekah his mother, and he went and took two good, fat young goats and brought them to his mother, and his mother prepared them as food, such as he loved.
translation:
  language: zh_hans
  text: 雅各听从了母亲利百加的话，就去取了两只上好而肥壮的小山羊，带给母亲。他母亲把它们做成了父亲以撒所喜爱的食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰምዐ፡ … ቃለ
  choice: 听从了……的话
  rationale: 该结构直译为“听……的声音”，在此语境中表示依言而行；“听从……的话”既自然，也保留顺从之意。
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ
  choice: 两只……小山羊
  rationale: 指两只幼小的山羊；现代汉语用“小山羊”比逐词式表达更自然准确。
- source_word: ሠናያነ፡ ወስቡሓነ
  choice: 肥美的
  rationale: 两个并列形容词含“好、肥壮”之意；合译为“肥美”简洁自然，并涵盖适于烹食的良好与肥嫩。
- source_word: መብልዐ፡ ዘከመ፡ ያፈቅር
  choice: 他爱吃的食物
  rationale: 原文意为“照他所喜爱的（做成）食物”；中文以“他爱吃的食物”准确而流畅地表达。
