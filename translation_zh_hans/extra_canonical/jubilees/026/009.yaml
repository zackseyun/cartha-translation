- from: 雅各听从了母亲利百加的话，就去取了两只肥美的小山羊，带到母亲那里。他母亲把它们做成了他爱吃的食物。
  to: 雅各听从了母亲利百加的话，就去取了两只上好而肥壮的小山羊，带给母亲。他母亲把它们做成了父亲以撒所喜爱的食物。
