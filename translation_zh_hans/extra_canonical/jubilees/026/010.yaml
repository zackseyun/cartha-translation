revisions:
- from: 利百加拿出大儿子以扫上好的衣服，就是她放在家里的，给小儿子雅各穿上；又把小山羊羔的皮包在他的手上和颈项裸露的地方。
  to: 利百加拿了她大儿子以扫上好的衣服，就是在家里、在她那里的，给她小儿子雅各穿上；又把小山羊羔的皮蒙在雅各的手上和颈项裸露的地方。
  rationale: 仅作一处语义收敛：避免把衣服“与她同在家中”的状态关系译为“她放置衣服”的动作。其余措辞保留原译的叙事语气与源文细节；英文审校轨迹所纠正的“from skins”误析，也已由“又把……的皮”恰当反映，故无需脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:01:16Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了利百加取以扫衣服、为雅各穿戴，并将小山羊羔的皮置于其手和颈项裸露处的动作。惟“她放在家里的”将“在她那里／在家中”的状态略译成利百加主动放置的动作，宜作较中性的调整。
  naturalness: 原文通顺庄重；调整后“在家里、在她那里”和“蒙在”更符合现代汉语叙事表达，也更清楚呈现覆盖皮子的动作。
  terminology: 人名“利百加、以扫、雅各”及“大儿子／小儿子”均恰当。“上好的衣服”可表达该词的可爱、可取或珍贵之意；“小山羊羔的皮”保留原文复数不在汉语中强行量化。
  issues:
  - severity: low
    issue: “她放在家里的”略强化了主动放置动作。
    rationale: 吉兹语相应关系从句说明衣服是在利百加那里、在家中，并不明确说她曾把衣服放在那里。改为“在家里、在她那里的”可保留原文的状态性表述。
  revised_text: 利百加拿了她大儿子以扫上好的衣服，就是在家里、在她那里的，给她小儿子雅各穿上；又把小山羊羔的皮蒙在雅各的手上和颈项裸露的地方。
