  text: And Rebekah took the desirable garments of her elder son Esau, which were with her in the house, and clothed Jacob her younger son with them; and the skins of the young kids she put on his hands and on the bare part of his neck.
translation:
  language: zh_hans
  text: 利百加拿了她大儿子以扫上好的衣服，就是在家里、在她那里的，给她小儿子雅各穿上；又把小山羊羔的皮蒙在雅各的手上和颈项裸露的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ፡ ... ዘይትፈተው
  choice: 上好的衣服
  rationale: 该短语指令人喜爱、称心或珍贵的衣服；现代汉语用“上好的衣服”自然表达其贵重、可取之意，同时不把含义限定为外观漂亮。
- source_word: ወልዳ፡ ዘይሌህቅ
  choice: 大儿子
  rationale: 按语境指年长的儿子以扫，与后文“ዘይንእስ”（较小、年幼）形成对照。
- source_word: ወእምእስቲ፡ መሓስአ፡ ጠሊ
  choice: 小山羊羔的皮
  rationale: 依最新校勘判断，ወእምእስቲ 是“并且＋皮”的复数形式，不含“从”的介词；因此直接译作“又把……的皮”，不增添“从皮中”之类成分。
- source_word: ዕርቃነ፡ ክሳዱ
  choice: 颈项裸露的地方
  rationale: 贴近“他颈项的裸露处”，指没有衣物或毛发遮盖的部位；此译法清楚自然，且不扩大为整个颈项。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留叙事中利百加主动安排伪装的直陈语气，不添加道德评语；“包在”符合皮革覆盖手和颈项裸露处的具体动作。
