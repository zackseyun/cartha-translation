  text: shall be your dwelling[34], and from the dew of heaven above. And by your sword you shall live, and you shall serve your brother; and it shall be that when you rebel and remove the yoke from your neck, then you will commit a complete sin unto death,
translation:
  language: zh_hans
  text: 愿你的居所[a]有来自上天的甘露。你必倚靠刀剑而活，也必服侍你的兄弟；到你反抗[b]、从颈项上除去那轭时，你就会犯下十足的罪，以至于死。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的原文格外艰涩，句子似乎有所扩展或省略；也可将“居所”理解为“产业”。这里没有按《创世记》27:39的平行经文补成“地上的肥土”。
    reason: textual_variant
  - marker: b
    text: “反抗”所译的词也可理解为“变得强大”或“壮大”。
    reason: lexical_ambiguity
  - marker: c
    text: 本节的表述与《创世记》27:40不同，吉兹语原文含有“十足的罪，以至于死”这一较难理解的说法；译文保留此难读法，没有按平行经文加以归一。
    reason: textual_variant
lexical_decisions:
- source_word: ንብረትከ
  choice: 你的居所
  rationale: 该词可指居所、产业或所有物；此处处于残缺而艰涩的祝福句中，采用与上下文相合且不擅自补入“土地肥沃”的“居所”。
- source_word: በመጥባኅትከ፡ ትሐዩ
  choice: 你必倚靠刀剑而活
  rationale: 保留“凭/借你的刀剑生活”的工具性含义，同时使用自然的现代汉语表达。
- source_word: ትትቀነይ
  choice: 你必服侍
  rationale: 该动词表达服役、臣服；“服侍”既保留从属关系，也与对兄弟的直接宾语自然搭配。
- source_word: አበይከ
  choice: 你反抗
  rationale: 按第二人称阳性单数理解，结合除轭意象译为“反抗”；不误读为“你的父亲离开你”。
- source_word: አስሰልከ፡ አርዑተ
  choice: 你……除去那轭
  rationale: 两个词分别表达第二人称“除去”和宾格“轭”；原文没有表示“他的”的后缀。
- source_word: አበሳ፡ ኵሎ
  choice: 十足的罪
  rationale: 单数“罪”受“全、完整”修饰，并非“所有种类的罪”；“十足的罪”保留其强调整体或完全程度的用法。
theological_decisions:
- issue: “以至于死”的性质
  choice: 以至于死
  alternative: 该受死刑／导致死亡
  rationale: 原文结构简短，可涉及结果、趋向或定罪性质；采用较开放的表达，不把它限定为肉身死亡、司法刑罚或某一特定神学术语。
- issue: 反抗与除轭的主体
  choice: 两项行动都以“你”为主体
  alternative: 你的父亲离开你并除去他的轭
  rationale: 两个动词均为第二人称阳性单数，且“轭”没有第三人称所有格；因此不引入“父亲”或改换主语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“倚靠刀剑而活”“从颈项上除去那轭”保留古代祝福与支配关系的意象；对残缺的首句及末句神学含义不作过度补足。
