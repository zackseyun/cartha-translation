lexical_decisions:
- source_word: አንሥአ፡ ዔሳው፡ ቃሎ፡ ወበከየ
  choice: 以扫放声大哭
  rationale: 原文直译为“以扫扬起他的声音并哭泣”；现代汉语以“放声大哭”自然、准确地表达同一动作。
- source_word: ወአውሥአ፡ ይስሐቅ፡ ወይቤሎ
  choice: 以撒回答他说
  rationale: 保留“回答”以及引出直接引语的“对他说”之意，同时避免汉语中不自然的重复。
- source_word: ናሁ
  choice: 看哪
  rationale: 采用庄重而通行的提示语，保留原文唤起听者注意的语用功能。
- source_word: እምጠለ፡ ምድር
  choice: 远离地上的甘露
  rationale: 此处介词እም可表示来源或分离；结合祝福语境，译作“远离”保留其分离义。“ጠል”译为“甘露”，较“露水”更符合庄重叙事语体。
theological_decisions:
- issue: 以撒的话究竟表示住处享有还是远离土地的甘露
  choice: 远离地上的甘露
  alternative: 从地上的甘露得福／你的住处必有地上的甘露
  rationale: 原文介词存在来源与分离两种可能，但本处语境和经文传统支持分离义。正文采用“远离”，不把它改写成正面的物质祝福。
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。“放声大哭”比逐字译作“扬声哭泣”更自然；“看哪”保留古代宣告的郑重语气。因原文片段止于介词短语，正文以省略号并加脚注标明未完。
