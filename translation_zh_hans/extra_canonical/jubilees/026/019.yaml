  text: And he said, “Are you really my son Esau?” And he said, “I am your son.” And he said, “Bring it near to me, and I will eat.”
translation:
  language: zh_hans
  text: 他问：“你真是我儿子以扫吗？”他回答：“我是你儿子。”他又说：“把它拿到我这里来，我要吃。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንተኑ
  choice: 你真是……吗
  rationale: 疑问附着成分表达确认语气；译为“真是……吗”符合上下文中辨认身份的询问，也保留强调意味。
- source_word: ወልድየ፡ ዔሳው
  choice: 我儿子以扫
  rationale: 按原文名词关系直译，清楚表达以扫是说话者的儿子。
- source_word: አቅርብ፡ ሊተ
  choice: 拿近些给我
  rationale: 保留“使之靠近我”的动作含义；中文以“拿近些给我”自然表达，宾语承接上文食物。
- source_word: ወእብላዕ
  choice: 我好吃
  rationale: 连接词与未完成式在命令之后表达目的或结果；“我好吃”比生硬的“并且我要吃”更符合现代汉语，同时不增添原文没有的信息。
