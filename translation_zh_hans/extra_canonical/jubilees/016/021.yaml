  text: near the altar that he had built at the Well of the Oath. And he built booths for himself and for his servants.
translation:
  language: zh_hans
  text: 在他于“誓约井”[a]旁所筑的祭坛附近；他又为自己和仆人搭了棚子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓约井”通常指别是巴；这个名称可理解为“誓约之井”。
    reason: 保留原文地名的词面意义，同时帮助读者识别传统地名。
lexical_decisions:
- source_word: ዐዘቅተ፡ መሐላ
  choice: “誓约井”
  rationale: 按词面保留“井”与“誓约”的含义；此处是地名性表达，故加引号，并以脚注说明其通常对应的地名。
- source_word: ምጽላላተ
  choice: 棚子
  rationale: 该词指临时搭建的遮棚或棚屋；“棚子”自然易懂，也与后文住棚节相关用语保持联系。
- source_word: አግብርቲሁ
  choice: 他的仆人
  rationale: 忠实表达复数领属结构；现代汉语中用“仆人”比“奴仆”更中性，不额外强化原文未在本句明示的社会身份细节。
