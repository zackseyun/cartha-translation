  yaml_path: translation/extra_canonical/jubilees/016/001.yaml
  text: 'She conceived a son. And and we returned to Sarah in the seventh month and found that she had conceived before us. And we blessed him, and we told him all that had been commanded for him: that he would not die until he had begotten six sons and would see them before he died, and that in Isaac a name and seed would be called for him.'
translation:
  language: zh_hans
  text: 她怀了一个儿子。第七个月，我们回到撒拉那里，发现撒拉已经怀孕了。[a] 我们祝福了他，并把一切吩咐他的话都告诉了他：他不会死，直到生下六个儿子，并在死前见到他们；在以撒里，必为他称立名和后裔。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“发现撒拉在我们面前／在我们之前已经怀孕了。”该短语的确切语用关系不甚确定。
    reason: 正文避免把源文可能有歧义的空间或时间短语译得生硬或过度确定，同时保留其字面表达。
  - marker: b
    text: 或直译：“在以撒里，名和后裔必为他被称。”
    reason: 保留源文“在以撒里”以及“称／被称”的凝缩句法；“名和后裔”与“为他”的具体关系不作超出原文的神学阐释。
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: 她怀了一个儿子
  rationale: 按吉兹文开头直译其完整陈述，保留“儿子”，不采用早期英译中源文没有的“我们向亚伯拉罕宣告”。
- source_word: በወርኅ፡ ሳብዕ
  choice: 第七个月
  rationale: 依源文语序和上下文，将时间语修饰“我们回到撒拉那里”，而不是修饰她受孕。
- source_word: ስድስተ፡ ውሉደ
  choice: 六个儿子
  rationale: 保留明确数目和亲属称谓。
- source_word: ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: 他的名和后裔……得以延续
  rationale: “称名/称为”在汉语中若逐字处理会生硬难解；此处用“得以延续”传达名号与后裔借以保存、承继的语义，同时以脚注保留字面表达。
theological_decisions:
- issue: “见到”一词的宾语
  choice: 把隐含宾语理解为前述六个儿子，译作“见到他们”
  alternative: 把以撒理解为“见到”的宾语
  rationale: 源文在“他会看见……在他死以前”之后另起“并在以撒里”一语；“以撒”属于下一分句，不是“看见”的宾语。
- issue: “在以撒里”与亚伯拉罕之名和后裔的关系
  choice: 译为“借着以撒得以延续”
  alternative: 直译为“在以撒里为他被称”
  rationale: 选择自然且不额外限定其神学范围的现代汉语，并通过脚注交代原文较为凝缩的“称”字结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他要到……之后才会死”自然表达源文“不会死，直到……”的界限结构；保留叙事中的代词，不擅自补出“亚伯拉罕”，以免加入源文未明说的名称。
