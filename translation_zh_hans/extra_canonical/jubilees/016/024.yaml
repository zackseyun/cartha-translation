  yaml_path: translation/extra_canonical/jubilees/016/024.yaml
  text: 'And morning and evening he burned fragrant incense: frankincense, galbanum, stacte, nard, myrrh, cassia, and costus, seven of these; he offered all of them mixed together, pure.'
translation:
  language: zh_hans
  text: 早晨和傍晚，他都焚烧芬芳的香料：乳香、加勒班香、苏合香、甘松、没药、桂皮和木香[a]，共七种。他把这些全都调和在一起，制成纯净的香而献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些古代香料中，有些所指的具体植物或树脂并不能完全确定，因此名称也可有不同译法。
    reason: 说明古代植物与香料术语在现代物种鉴定上的真实不确定性，避免让译名显得过度确定。
lexical_decisions:
- source_word: የዐጥን እፈወ
  choice: 焚烧芬芳的香料
  rationale: 动词表示焚香，后接香料清单；译作“焚烧芬芳的香料”既保留具体动作，也符合现代汉语表达。
- source_word: ስኂነ
  choice: 乳香
  rationale: 依该古代香料清单的传统对应词，采用现代中文最通行的名称。
- source_word: ቅንአተ
  choice: 白松香
  rationale: 对应 galbanum；“白松香”是较易理解的中文传统译名，但具体植物鉴定并非绝对确定。
- source_word: ማየ ልብን
  choice: 苏合香
  rationale: 对应 stacte 一类滴出的芳香树脂；采用简洁、可辨识的中文香料名称。
- source_word: ናርድስ
  choice: 甘松
  rationale: 对应 nard，采用现代中文常见植物名。
- source_word: ከርቤ
  choice: 没药
  rationale: 该词稳定对应 myrrh，沿用通行圣经汉语名称。
- source_word: ሰንበልተ
  choice: 桂皮
  rationale: 按清单次序对应 cassia，并保留其位于木香之前的原文顺序。
- source_word: ኵስተ
  choice: 木香
  rationale: 对应 costus，使用现代中文药材名。
- source_word: ሰብዐቲሆሙ
  choice: 共七种
  rationale: 明确表达所列香料合计七种。
