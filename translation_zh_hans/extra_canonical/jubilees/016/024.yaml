revisions:
- from: 早晨和傍晚，他都焚烧芬芳的香料：乳香、白松香、苏合香、甘松、没药、桂皮和木香[a]，共七种。他把这一切调和在一起，洁净地献上。
  to: 早晨和傍晚，他都焚烧芬芳的香料：乳香、加勒班香、苏合香、甘松、没药、桂皮和木香[a]，共七种。他把这些全都调和在一起，制成纯净的香而献上。
  rationale: 改正 galbanum 的术语误译，并将“纯净”明确连于七种香料调和而成的香；其余保留原有的香料次序、数目、早晚焚香及献上动作。
