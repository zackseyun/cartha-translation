  text: And he blessed and rejoiced, and he called the name of this feast the feast of the Lord, a joy
translation:
  language: zh_hans
  text: 他祝福了，也欢喜，就把这个节期称为“主的节期——喜乐”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主的节期，喜乐。”
    reason: 原文句末“喜乐”与前面的节期名称可能构成较松散的同位或补充关系；正文用破折号使现代汉语较易理解，脚注保留更贴近原文结构的译法。
lexical_decisions:
- source_word: ባረከ
  choice: 祝福了
  rationale: 按动词通常意义直译，并保留叙事中的完成性动作。
- source_word: ተፈሥሐ
  choice: 满心欢喜
  rationale: 表达喜乐、欢欣；用自然现代汉语呈现其情感强度。
- source_word: ጸውዐ፡ ስማ
  choice: 命名为
  rationale: 该短语字面为“称其名”，在命名语境中译作“命名为”更自然。
- source_word: በዓለ፡ እግዚአብሔር
  choice: 耶和华的节期
  rationale: በዓል指节期；እግዚአብሔር在此作为神名/称谓，采用中文圣经读者熟悉的“耶和华”。
- source_word: ፍሥሓ
  choice: 喜乐
  rationale: 保留句末名词性表达及其与节期名称可能存在的同位关系，不改写为形容词或完整分句。
theological_decisions:
- issue: 句末“喜乐”与“耶和华的节期”的语法关系
  choice: 以破折号连接，呈现同位或补充命名的可能性
  alternative: 译作“令人喜乐的耶和华的节期”或“耶和华的节期，一件喜事”
  rationale: 原文末尾仅有名词ፍሥሓ，关系较为简略；不把它明确限定为人的感受、节期属性或独立评价，以保存原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“他”承接上下文主语；引号标明所命之名，破折号保留句末“喜乐”的同位性和原文的简略表达。
