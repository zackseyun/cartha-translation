  text: and dwelt between Kadesh and Shur in the mountains of Gerar. And in the middle of the fifth month he moved from there and dwelt at the Well of the Oath.
translation:
  language: zh_hans
  text: 他住在加低斯和书珥之间，在基拉耳的山地。第五个月中旬，他从那里迁走，住在誓约井。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደረ
  choice: 住
  rationale: 该动词在叙事语境中表示停留、居住；译为“住”自然简洁。
- source_word: ማእከለ፡ ቃዴስ፡ ወሱር
  choice: 在加低斯和书珥之间
  rationale: 按地理关系直译，保留两个地名。
- source_word: ውስተ፡ አደባረ፡ ጌራሮን
  choice: 在基拉耳山区
  rationale: አደባር 为“山地、群山”，地名按现代汉语圣经惯用形式音译为“基拉耳”。
- source_word: በመንፈቀ፡ ወርኅ፡ ኃምስ
  choice: 五月中旬
  rationale: 字面为“第五个月的一半/中间”，自然表达为“五月中旬”。
- source_word: ፯ዐዘ
  choice: 他从那里迁走，住在誓约井
  rationale: 现提供的吉兹文本末尾疑有抄录或编码压缩，不能清楚支持整句；依英语审校层所保存的完整句意译出，并用“迁走”表达移动居所。
