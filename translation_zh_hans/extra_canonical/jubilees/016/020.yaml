base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/020.yaml
  text: And he built there an altar to Yahweh, who delivered him and made him rejoice in the land of his sojourning, and he made a festival of joy in this month for seven days, near the altar which he had built at the Well of the Oath.
translation:
  language: zh_hans
  text: 他在那里为那拯救他、使他在寄居之地欢喜的耶和华筑了一座祭坛；又在这个月举行了七天的欢乐节，就在他在誓言井所筑的祭坛旁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓言井”即“别是巴”；这个地名的字面意思是“誓言之井”。
    reason: 正文按吉兹语短语保留其字面名称；脚注说明其与通行地名“别是巴”的对应。
lexical_decisions:
- source_word: ለእግዚአብሔር
  choice: 为耶和华
  rationale: 该词在此指以色列的神；采用现代中文圣经中通行的专名“耶和华”，明确保留神名功能。
- source_word: ፈላስነቱ
  choice: 寄居
  rationale: 表达在异地暂住、作为外来居民生活的状态，较“流亡”或“漂泊”更符合本句语境。
- source_word: ገብረ ፡ በዓለ ፡ ትፍሥሕት
  choice: 守了……欢乐节
  rationale: 原文直译近于“举行欢乐的节期”；中文用“守节”自然庄重，并保留节庆与欢乐两层意义。
- source_word: በዐዘቅተ ፡ መሐላ
  choice: 于誓言井
  rationale: 按吉兹语短语的字面意义翻译；该名称对应别是巴，但正文保留源文本的语义形式。
theological_decisions:
- issue: 神名的译法
  choice: 耶和华
  alternative: 主
  rationale: 原文使用指称上帝的名称性表达；译作“耶和华”与咨询层一致，也避免将其弱化为一般称号。
- issue: 拯救与欢喜两个关系从句的主语
  choice: 明确重复“耶和华”作为共同主语
  alternative: 译为“那拯救他、使他欢喜的”
  rationale: 原文两个关系结构都回指耶和华；中文明确主语可避免误读，同时不增加新的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“寄居之地”保留亚伯拉罕作为外来居民的意味；“守了七天的欢乐节”使中文流畅，同时忠实呈现节期、欢乐和七日时长。
