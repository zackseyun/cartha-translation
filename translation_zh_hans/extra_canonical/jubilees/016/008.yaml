  text: He overthrew it. And he and his daughters also committed sin upon the earth, such as had not been on the earth.
translation:
  language: zh_hans
  text: 他把它倾覆了。罗得和他的女儿们也在地上犯了罪，是地上前所未有的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罗得也犯了罪；他的女儿们也在地上犯了罪；这是地上前所未有的。”
    reason: 原文附加语气成分的位置可使“也”主要关联罗得，而非将其作为“罗得和他的女儿们”这一并列主语的共同附加成分；此译法仍保留“地上前所未有”对整项罪行的范围。
lexical_decisions:
- source_word: ገፍታአ
  choice: 他倾覆了那城
  rationale: 该词表示“他倾覆了它”；结合上文所指被毁之城，中文补出“那城”以使指代自然，同时不添加城名。
- source_word: ገብረ … ኀጢአተ
  choice: 犯了罪
  rationale: 直译其“行/犯下罪”的结构，使用现代汉语中自然且庄重的表达。
- source_word: ውእቱኒ፡ ወአዋልዲሁኒ
  choice: 罗得和他的女儿们也
  rationale: 字面为“他和他的女儿们也”；依上下文补明“罗得”，避免跨句代词含混。连接词的附加语气以“也”体现。
- source_word: ዘአኮ፡ ዲበ፡ ምድር
  choice: 是地上前所未有的
  rationale: 保留“地上不曾有过”的强烈表述，不将其具体解释为某一罪类。
theological_decisions:
- issue: “罪”所指的具体性质
  choice: 仅译为“罪”，不作具体定性
  alternative: 明确译作乱伦或其他特定罪行
  rationale: 源文本在本节只使用一般性的“罪”，具体化会把上下文推论写入正文。
- issue: 首句施事者与受事者
  choice: 译作“他倾覆了那城”
  alternative: 明确译作“上帝毁灭了所多玛”
  rationale: 原文使用代词而未在本句点名；正文保留代词，并仅为汉语清晰度补出上下文受事对象“那城”。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“倾覆”呼应城市遭毁的语境；“前所未有”自然传达原文“地上不曾有过”。脚注标记已置于正文。
