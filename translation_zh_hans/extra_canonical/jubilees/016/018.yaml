revisions:
- from: 惟有以撒将成为圣洁的后裔[a]，不被列在列国之中；因为他将成为至高者的份，他所有的后裔也都抽签归了上帝，好使他们从万民中成为主产业的子民，并成为一个国度。
  to: 惟有以撒将成为圣洁的后裔[a]，不被列在列国之中；因为他将成为至高者的份，他全部的后裔都落在上帝的签份中，好使他们从万民中成为主所得的子民，并成为一个国度。
  rationale: 将“抽签归了上帝”改为“落在上帝的签份中”，以忠实保留原文的拈阄分配及归属意象，避免中文中仿佛后裔主动抽签的理解。将“主产业的子民”改为“主所得的子民”，使现代汉语修饰关系明确，并保留“为主所有/所得”的含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:57:15Z'
