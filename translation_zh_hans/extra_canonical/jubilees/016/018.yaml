    issue: “他所有的后裔也都抽签归了上帝”对签阄意象的表达不够准确自然。
    rationale: 原文及英文审校轨迹表达的是“所有后裔落在上帝的签份/归上帝所得之份”，不是后裔自行“抽签”后归属上帝。
  - severity: medium
    issue: “主产业的子民”存在修饰关系歧义。
    rationale: 应清楚表达该民是主从万民中所得、归主所有的子民，同时不将“产业”过度实体化或改变原有归属意象。
