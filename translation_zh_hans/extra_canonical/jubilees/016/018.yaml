  source_fidelity: 正文准确传达了以撒的排他性、圣洁后裔、未列于列国、至高者的份、上帝以抽签/拈阄所得的归属，以及成为主从万民中所得之民和国度等要点。不过“他所有的后裔也都抽签归了上帝”把原文的“落在上帝的签份/归上帝拈阄所得”处理得略显主动且口语；改为“他全部的后裔都落在上帝的签份中”更贴近分配意象。
  naturalness: “主产业的子民”在现代汉语中结构不够清晰，容易理解为“主的产业之子民”，但原意是“归主所有的子民”。“作为主从万民中所得的子民”较自然、庄重，也保留占有/产业的语义。其余句法可顺畅处理。
  terminology: “惟有以撒”“圣洁的后裔”“至高者”“列国”“国度”均恰当。“上帝”与“主”分别对应原文中的God和Lord，宜保留。脚注应保留“一个”的可行字面理解，并明确它对应“惟有”的替代译法。
  issues:
