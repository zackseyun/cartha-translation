base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/018.yaml
  text: And Isaac alone would become a holy seed, and he would not be reckoned among the nations, for he would become the portion of the Most High, and all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples, and that it should become a kingdom
translation:
  language: zh_hans
  text: 惟有以撒将成为圣洁的后裔[a]，不被列在列国之中；因为他将成为至高者的份，他全部的后裔都落在上帝的签份中，好使他们从万民中成为主所得的子民，并成为一个国度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以撒将成为一个圣洁的后裔。”
    reason: 原文አሐዱ可按语境理解为“惟有、独自”，也可较字面地理解为“一、一个”；正文保留本句的排他性强调。
lexical_decisions:
- source_word: አሐዱ
  choice: 惟有
  rationale: 该词基本义为“一、一个”，在以撒与其他后裔相对的语境中可表达排他性的“独有、惟有”；正文保留这一强调，同时以脚注注明另一种可能理解。
- source_word: ዘርእ ቅዱስ
  choice: 圣洁的后裔
  rationale: 按“后裔、种子”这一集体性含义翻译，既自然，也保留其可指以撒及其后代的语义张力。
- source_word: አሕዛብ
  choice: 列国
  rationale: 此处指以色列之外或万族之中的各国各族；“列国”符合庄重的经文语体，并与后文“万民”形成自然呼应。
- source_word: መክፈልተ ልዑል
  choice: 至高者的份
  rationale: 直译其归属和分配意象，不将其扩释为特定的盟约或教义术语。
- source_word: ዘይመልከ አምላክ ወረደ
  choice: 抽签归了上帝
  rationale: 保留原文“签、拈阄所得之份”的分配意象，同时用现代汉语表达其结果，即以撒全部后裔归属上帝。
- source_word: ሕዝበ ትርሲት
  choice: 产业的子民
  rationale: 表达属于主、为主所得之民的含义；“产业”保留原文中占有、承受或归属的传统语义。
- source_word: መንግሥተ
  choice: 国度
  rationale: 该词可指王权、统治或国度；此处与“子民”并列，译作“国度”最自然，同时不额外补入统治者或制度。
theological_decisions:
- issue: 以撒的独特性
  choice: 正文译为“惟有以撒”
  alternative: “以撒将成为一个圣洁的后裔”
  rationale: 原文明确含有አሐዱ；在当前语境中排他义较强，但“一、一个”的字面可能性仍值得用脚注保留。
- issue: 上帝拈阄所得之份
  choice: 译为“他所有的后裔也都抽签归了上帝”
  alternative: “他所有的后裔都落入上帝的签份”
  rationale: 选择较自然的现代汉语，同时保留神圣分配与归属的意象，不解释为某一特定预定论体系。
- issue: “国度”的句法完整性
  choice: 按本节所给文本收束为“并成为一个国度”
  alternative: 将其视为与下一节连续的未完句
  rationale: 源文本在“国度”处结束，英语审校层也如此处理；中文可形成语义完整的并列结果，而不从下一节擅自补文。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“惟有”“至高者”“产业的子民”“国度”保留宗教文本的尊严感；“抽签归了上帝”则避免过度古雅的“拈阄”，使分配意象对现代读者仍然清楚。
