  yaml_path: translation/extra_canonical/jubilees/016/013.yaml
  text: And he did to Sarah as he had said. And she conceived and bore a son in the third month, in the middle of the month, at the time of which the Lord had spoken to Abraham; on the feast of the firstfruits of the harvest, he was born.
translation:
  language: zh_hans
  text: 他照着所说的话对撒拉行了。撒拉就怀孕，在第三个月的月中生了一个儿子；在主对亚伯拉罕所说的日期，他在收获初熟节出生了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ላቲ
  choice: 为撒拉成就了
  rationale: 直译为“为她做了”，在应许实现的语境中译作“成就了”较符合现代汉语，同时保留行动主体未明说具体方式的特点。
- source_word: በወርኅ፡ ሣልስ፡ ወበመንፈቀ፡ ወርኅ
  choice: 在三月月中
  rationale: 保留原文的月份与月中时间信息，不将“三月”现代化误解为公历三月。
- source_word: በበዓለ፡ ቀዳሜ፡ ማእረር
  choice: 在庄稼初熟节
  rationale: 该短语指收获初熟之物的节期；“庄稼初熟节”自然、清楚，也保留农业节期色彩。
- source_word: ተወልደ
  choice: 他……出生了
  rationale: 原文仅用阳性单数动词“出生”，没有明说“以撒”；以代词承接前文“一个儿子”，避免把名字补入正文。
theological_decisions:
- issue: “他照着所说的为撒拉成就了”中的主语
  choice: 保留“他”，由上下文指向主
  alternative: 明确译作“主照着所说的眷顾撒拉”
  rationale: 原文在本节没有再次明说主语，且动词本身是“做、成就”，不宜引入“眷顾”等更具体的神学措辞。
- issue: 应许与出生时间的句法关系
  choice: 译作“正如主对亚伯拉罕所说的，他在……出生了”
  alternative: 把“主所说的时间”处理为独立的时间状语
  rationale: 原文把主对亚伯拉罕所说的日子与节期中的出生相连；此译法保持这种关联，而不额外解释应许的具体内容。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“三月”按古代历法月份理解；正文不添加原文未出现的“以撒”，也不设置缺乏必要性的脚注。
