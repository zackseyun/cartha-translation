lexical_decisions:
- source_word: ወስሐቀት
  choice: 笑了
  rationale: 对应动词“笑”，以自然简洁的现代汉语表达完成事件。
- source_word: እስመ
  choice: 因为
  rationale: 保留原文明确的因果关系，而不弱化为单纯的时间关系“当……时”。
- source_word: ተናገርነ
  choice: 我们……说了
  rationale: 保留第一人称复数主语及已发生的言说动作。
- source_word: ዘንተ፡ ቃለ
  choice: 这话
  rationale: 直译“这句话/这番话”，此处用“这话”最自然凝练。
- source_word: ምስለ፡ አብርሃም
  choice: 对亚伯拉罕
  rationale: 介词短语在此表示言说所涉及或面向的对象；汉语用“对……说”较自然。
- source_word: ወዘለፍናሃ
  choice: 我们便责备了她
  rationale: 表达斥责、申斥之意；“责备”庄重而通俗，不额外强化为严厉谴责。“便”衔接后续反应，但不增加新的神学含义。
theological_decisions:
- issue: 第一人称复数“我们”的身份
  choice: 保留“我们”，不在正文中指明其身份
  alternative: 解释为天使或神圣使者
  rationale: 本节原文本身使用第一人称复数，却未在句内明说所指；为避免导入解释，保留其指称上的语境依赖。
- issue: 撒拉发笑与受责备之间的关系
  choice: 按原文并列叙述，不说明其内心动机或罪责程度
  alternative: 解释为不信而笑，并据此强化谴责
  rationale: 本节只陈述她因听见这话而笑，随后受到责备；不应添加原文未明说的心理或教义判断。
