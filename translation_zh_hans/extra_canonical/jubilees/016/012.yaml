  text: From there he moved and dwelt by the Well of the Oath. And in the middle of the sixth month the Lord visited Sarah
translation:
  language: zh_hans
  text: 他从那里迁到誓约井[a]旁居住。第六个月中旬，主眷顾了撒拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓约井”通常对应别是巴；按字面意为“誓言（或誓约）之井”。
    reason: 说明源语地名的字面意义及其通常对应的地点，避免误解为“幔利橡树”。
lexical_decisions:
- source_word: እምህየ፡ ወኀደረ
  choice: 他从那里迁去，住在
  rationale: እምህየ意为“从那里”，ወኀደረ意为“并住下/居住”；“迁去”自然表达从原地转往他处的语境，但不另加具体行程。
- source_word: ዐዘቅት፡ መሐላ
  choice: 誓约井
  rationale: 该词组直指“誓言/誓约之井”，不采用与原文不符的“幔利橡树”；正文保留地名含义，并以脚注说明其所指。
- source_word: በመንፈቀ፡ ወርኅ፡ ሳድስ
  choice: 六月过了一半的时候
  rationale: 准确表达“第六个月之中/过半时”，同时采用自然现代汉语。
- source_word: ሐወጻ፡ እግዚአብሔር
  choice: 耶和华眷顾了撒拉
  rationale: 动词在此表示带来恩惠和应许成就的临到；“眷顾”既保留经文语域，也避免把行动过度具体化。
theological_decisions:
- issue: “眷顾”是否应具体解释为使撒拉怀孕或履行应许
  choice: 保留为“眷顾了撒拉”
  alternative: 使撒拉怀孕／照着应许赐福撒拉
  rationale: 原文只使用“探访、临到、眷顾”一类动词；不把上下文中的结果直接写进本句，以保留原文的含蓄与神学张力。
- issue: 神名的译法
  choice: 耶和华
  alternative: 主
  rationale: እግዚአብሔር可作“主/上主”；此处采用普通中文圣经读者熟悉的“耶和华”，但不据此扩展任何宗派性解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“六月过了一半的时候”比生硬的“第六月之中”更易懂；“眷顾”保留圣经叙事语感。脚注标记[a]已置于正文对应词后。
