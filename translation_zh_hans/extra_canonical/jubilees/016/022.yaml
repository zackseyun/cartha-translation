  yaml_path: translation/extra_canonical/jubilees/016/022.yaml
  text: at this feast, and he was the first to celebrate the feast of booths on the earth. And during these seven days he offered, day by day, on the altar to the Lord two oxen, two rams, seven sheep, one male goat for a sin offering,
translation:
  language: zh_hans
  text: 在这节期中[a]，他是地上第一个庆祝住棚节的人。在这七天里，他天天在祭坛上向主献上[b]两头公牛、两只公绵羊、七只绵羊和一只作赎罪祭的公山羊，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为这节期”。
    reason: 原文介词短语可按时间理解，也可能承接上一节而表示目的或关联。
  - marker: b
    text: 或译：“天天把……呈到祭坛上”。
    reason: 原文动词本义是“带近、呈上”，在献祭语境中通常译为“献上”。
lexical_decisions:
- source_word: በዛቲ፡ በዓል
  choice: 在这节期中
  rationale: 介词በ在此自然表示节期发生的时间，即“在……期间”；该短语也可能承接上一节，故加脚注保留“为这节期”的可能。
- source_word: መቅደመ፡ ገብረ
  choice: 第一个守……的人
  rationale: 直译为“首先行/举行”；中文以“第一个守……的人”自然表达他率先庆守该节期。
- source_word: በዓለ፡ መጻላት
  choice: 住棚节
  rationale: 指以棚舍为特征的节期；“住棚节”是现代中文中清楚而惯常的名称。
- source_word: ያቀርብ
  choice: 献上
  rationale: 该动词本义为带近、呈上，在祭坛语境中是献祭用语；“献上”比单纯“带来”更准确自然。
- source_word: አልህምተ፡ ክልኤተ
  choice: 两头公牛
  rationale: 按祭牲清单译出牛类牲畜及数量，并用中文适当量词。
- source_word: አብሐኩ፡ ክልኤተ
  choice: 两只公绵羊
  rationale: 与后面的普通绵羊相区别，明确为成年雄性绵羊。
- source_word: መሐስአ፡ ጠሊ፡ አሐደ
  choice: 一只作赎罪祭的公山羊
  rationale: 将公山羊与其赎罪祭用途连贯表达，符合祭祀清单的中文语序。
theological_decisions:
- issue: “献上”是否过度解释祭祀动作
  choice: 正文译作“献上”
  alternative: 带到／呈到祭坛上
  rationale: 上下文明确列举祭牲并提及祭坛和赎罪祭，因此采用标准祭祀含义；脚注保留较贴近词根的“呈上”。
- issue: 节期名称的表达
  choice: 住棚节
  alternative: 棚节／帐棚节
  rationale: “住棚节”清楚、通行，且不额外引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原句未完的列举结构，以逗号结尾，与所给原文片段一致；“天天”简洁呈现逐日献祭的反复性。
