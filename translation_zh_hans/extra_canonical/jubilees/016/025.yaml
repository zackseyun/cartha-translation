  yaml_path: translation/extra_canonical/jubilees/016/025.yaml
  text: And he kept this feast seven days, rejoicing with all his heart and with all his soul, he and all who were in his house; and there was no foreigner with him, nor anyone uncircumcised.
translation:
  language: zh_hans
  text: 他举行这节期七天，以全心全意欢喜庆祝；他和家中所有的人都如此。与他同在的没有外族人，也没有未受割礼的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语摘录在“并没有”之后中断；“外族人，也没有未受割礼的人”据经审校的英文咨询文本补足。摘录开头另有上一句的残余文字，本节正文从“他举行这节期七天”起译。
    reason: 明确区分现有原文证据与咨询层所补足的内容，并说明按节解析排除开头的前文残句。
lexical_decisions:
- source_word: ገብረ፡ ዘንተ፡ በዓለ
  choice: 守这节
  rationale: 该短语直指举行、遵守这一节期；中文用“守节”既自然，也保留礼仪性的含义。
- source_word: ሰቡዐ፡ መዋዕለ
  choice: 七天
  rationale: 按原文数量与时段直译。
- source_word: እንዘ፡ ይትፌሣሕ
  choice: 欢喜
  rationale: 保留原文喜乐、欢庆的动作意味，符合节期语境。
- source_word: በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ
  choice: 全心全意地
  rationale: 原文为“以他的全心和全灵魂”；采用现代汉语惯用表达，同时保留投入全部内在生命的强度。
- source_word: ኵሎሙ፡ እለ፡ ውስተ፡ ቤቱ
  choice: 家里所有的人
  rationale: 直译为“所有在他家中的人”；此处“家”可涵盖家庭成员和家中属员，不缩限为血亲。
- source_word: foreign clause in audited consultation layer
  choice: 外族人……未受割礼的人
  rationale: 所给吉兹语摘录在“并没有”之后中断；完整宾语依据经审校的英文咨询层呈现，并用脚注透明说明。
theological_decisions:
- issue: “全心和全灵魂”的表达
  choice: 全心全意
  alternative: 用他的全心和全灵魂
  rationale: 选择自然的现代汉语成语，不把“灵魂”在此处技术化为特定的人论概念。
- issue: “外族人”与“未受割礼的人”的关系
  choice: 并列保留为两类称谓
  alternative: 合并为“未受割礼的外族人”
  rationale: 英文咨询层以并列结构表达；不擅自判定两者完全重合，从而保留文本可能存在的范围差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“守这节”符合宗教节期语境；分成两句以避免英文式长句。“他身边”表达“与他同在”，不把范围误限为同一房屋之内。
