base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/017.yaml
  text: And we blessed him and told him everything that had been decreed concerning him, that he would not die until he had begotten six more sons and seen them before he died; but in Isaac his name and seed would be called.
translation:
  language: zh_hans
  text: 我们祝福了他，并把一切为他所命定的事告诉他：他在又生了六个儿子、在死前见到他们以前不会死；但他的名和后裔必从以撒得以延续。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረክናሁ
  choice: 祝福了他
  rationale: 按词义直接表达天使群体对亚伯拉罕的祝福，保留第一人称复数叙述。
- source_word: ኵሎ፡ ዘተአዘዘ፡ ሎቱ
  choice: 关于他所命定的一切
  rationale: “命定”体现该词所指的颁定、规定之意，同时保留被动结构及其未明说的施行者。
- source_word: ስድስተ፡ ውሉደ
  choice: 又生了六个儿子
  rationale: ውሉድ 在此结合亚伯拉罕后来所得的六个儿子理解为男性子嗣；“又”依上下文表达除以撒以外另有六子。
- source_word: ይሬኢ
  choice: 见到他们
  rationale: 动词意为“看见”；宾语承接刚提到的六个儿子，不擅自增补“以撒的儿子”。
- source_word: በይስሐቅ
  choice: 在以撒身上
  rationale: 保留介词结构及其可能具有的代表、承续含义，不直接改写成排他的教义性陈述。
- source_word: ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: 他的名和后裔要……得称为名
  rationale: 尽量保留原文“称呼—名—后裔”的措辞关系；正文略显凝练，并以脚注说明可能的通顺理解。
theological_decisions:
- issue: 以撒与亚伯拉罕之名及后裔的关系
  choice: 但他的名和后裔要在以撒身上得称为名
  alternative: 但只有以撒才算他的后裔
  rationale: 原文明确同时提到“名”和“后裔”，并使用“在以撒”及“被称”的表达；不把它收窄为仅讨论谁“算作后裔”，以保留原文的承名与承嗣张力。
- issue: “见到”的隐含宾语
  choice: 他们，指前述六个儿子
  alternative: 以撒的儿子们
  rationale: 原文最近且自然的先行词是刚提到的六个儿子；加入“以撒的”缺乏源文依据，并会改变所述应许。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。时间条件句以“直到……并……”自然衔接；末句为保留源文关键词而稍具经文式凝练感，并辅以脚注。
