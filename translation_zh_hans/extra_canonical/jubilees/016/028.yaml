  yaml_path: translation/extra_canonical/jubilees/016/028.yaml
  text: And both of them had very great joy. And he built there an altar to the Lord, who had blessed him and who had made him rejoice in the land of his sojourning. And he made a feast of joy in this month for seven days.
translation:
  language: zh_hans
  text: 他们二人都极其喜乐。他在那里为主筑了一座祭坛；主赐福给他，也使他在寄居之地欢喜。这个月，他举行了七天的喜乐庆典。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆሙ
  choice: 他们二人都
  rationale: 该词明确指“两者/二人”，保留双数所强调的双方。
- source_word: ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: 极其喜乐
  rationale: 按原文“喜乐甚为广大/非常大”的强化表达，译成自然庄重的现代汉语。
- source_word: ምሥዋዐ
  choice: 祭坛
  rationale: 在“建造”这一搭配中指献祭用的坛。
- source_word: በምድረ፡ ፍልሰቱ
  choice: 在寄居之地
  rationale: ፍልሰት在此表达迁居、旅居或寄居状态；“寄居之地”既自然，也保留非永久居所的意味。
- source_word: በዓለ፡ ፍሥሓ
  choice: 喜乐节宴
  rationale: በዓል可指节期或筵宴；结合“七天”及喜乐语境，采用“节宴”以保留两方面含义。
- source_word: በዝ፡ ወርኅ፡ ሰቡዐ፡ መዋዕለ
  choice: 这个月……为期七天
  rationale: 忠实表达“在这个月”和“七日”，并按现代汉语调整语序。
theological_decisions:
- issue: “赐福”与“使欢喜”的主语及关系
  choice: 两者都明确以“主”为主语
  alternative: 将两个分词理解成对主的称颂性定语而不重复主语
  rationale: 原文以两个关系性表达修饰“主”，汉语若直译易显晦涩；明确主语可保持语义关系而不增添教义解释。
- issue: 喜乐节宴是否指某一具名宗教节期
  choice: 不添加具体节名
  alternative: 按上下文指定为住棚节等具名节期
  rationale: 本节原文本身只说“喜乐的节/宴”，不宜把上下文推定直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“他们二人都”保留原文双数强调；分号连接筑坛与对主的说明，使中文清楚流畅。未设置脚注，因此正文无脚注标记。
