  yaml_path: translation/extra_canonical/jubilees/016/015.yaml
  text: the covenant that is established forever. And in the sixth year of the fourth week we came to Abraham at the Well of the Oath, and we appeared to him as we had told Sarah that we would return to her and she would conceive a son.
translation:
  language: zh_hans
  text: 这约是永远立定的。¹第四个七年期的第六年，我们来到誓约井；在那里，我们向亚伯拉罕显现，正如我们曾告诉撒拉：我们将回到她那里，她将生一个儿子。²
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳን
  choice: 约
  rationale: 该词指盟约、约定；在这一语境中译作“约”，简洁并符合古代宗教文献的庄重语域。
- source_word: ተሠርዐት
  choice: 设立
  rationale: 被动形式表达某事已经制定、确立；“设立”既贴近原文，也比“命定”少带额外神学色彩。
- source_word: ለዓለም
  choice: 为永远
  rationale: 表达永久、世世代代之意；“为永远”保留原文简洁的持续性措辞。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 本书纪年体系中的“周”是七年单位；译作“七年期”可避免现代读者误解为七日的一周。
- source_word: ዐዘቅተ፡ መሐላ
  choice: 誓约井
  rationale: 字面为“誓言/誓约之井”，对应别是巴传统的地名含义；采用意译以保留原文表达。
- source_word: አስተርአይናሁ
  choice: 向他显现
  rationale: 该动词为使役/反身显现表达，译作“向他显现”准确而自然。
- source_word: ንገብአ፡ ኀቤሃ
  choice: 我们必回到她那里
  rationale: 保留复数说话者及方向性表达，不将其神学主体单数化。
- source_word: ወይእቲኒ
  choice: 她就会怀上一个儿子
  rationale: 结合本节传报生子语境补足谓语意义；汉语以将来结果表达最为自然。
theological_decisions:
- issue: 显现者和返回者的数
  choice: 保留“我们”的复数表达
  alternative: 按《创世记》的叙述协调为“我”或“主”
  rationale: 吉兹语动词明确采用第一人称复数；不应为配合其他经文而消除本书自身的叙述形式。
- issue: 永约的性质
  choice: 译作“为永远而设立”
  alternative: 译作“永远命定”
  rationale: “设立”忠实表达约的确立，同时避免把原文未明确说明的预定论含义带入译文。
- issue: 撒拉受孕的时间关系
  choice: 译作“她就会怀上一个儿子”
  alternative: 译作“她已经怀上一个儿子”
  rationale: 上下文是返回时将要发生或得到实现的应许；原文末尾疑有省略或文本不完整，译文依句法和叙事语境表达将来结果，但不进一步规定具体受孕时点。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“第四个七年期”明确《禧年书》的纪年单位；保留“我们”以忠实呈现原文。原文开头承接上一节，中文仍按所给分节译成完整陈述。
