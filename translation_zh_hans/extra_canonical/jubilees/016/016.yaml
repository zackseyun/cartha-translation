  yaml_path: translation/extra_canonical/jubilees/016/016.yaml
  text: And we returned in the seventh month and found Sarah pregnant before us, and we blessed the Lord, and we announced to him all the things which he had spoken concerning him, that he would surely do them.
translation:
  language: zh_hans
  text: 第七月，我们回来，发现撒拉已经怀孕。我们祝福了主[a]，又把上帝先前论到亚伯拉罕、说必定会成就的一切事，都告诉了亚伯拉罕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们祝福了他”。原文使用阳性单数代词；按本句语境及后文向亚伯拉罕宣告的结构，通常理解为指主。
    reason: 保留原文代词形式所带来的文本层面可能性，同时避免使正文中受祝福者与接受宣告者混同。
lexical_decisions:
- source_word: ወተመየጥነ
  choice: 我们回来
  rationale: 按动词的返回义直译，并保留叙述者为复数的天使群体。
- source_word: በወርኅ፡ ሳብዕ
  choice: 七月
  rationale: 自然、准确地表达原文的月份时间。
- source_word: ወረከብናሃ፡ ለሳራ፡ ፀንሰተ፡ ቅድሜነ
  choice: 发现撒拉已经在我们面前怀了孕
  rationale: 保留“发现”“怀孕”及“在我们面前”三个要素；“已经”使现代汉语叙事自然。
- source_word: ወባረክናሁ
  choice: 我们祝福了他
  rationale: 原文使用阳性单数宾语后缀“他”，没有明说“主”；不把解释性的“主”直接写入正文。
- source_word: ወዜነውናሁ
  choice: 又……告诉了他
  rationale: 表达把信息宣告、告知某人的意思；宾语后缀为阳性单数，语境中最可能指亚伯拉罕。
- source_word: ከመ፡ ኢይመውት፡ እስከ፡ ይወልድ
  choice: 并说上帝必定成就这些事
  rationale: 依本节经校订的句意处理为上帝必实现所说之事；汉语补出“上帝”以厘清主语，而不改变应许的内容。
theological_decisions:
- issue: “祝福了他”所指为何
  choice: 正文保留“他”，脚注说明可能所指
  alternative: 译作“祝福了主”或“祝福了亚伯拉罕”
  rationale: 吉兹语只有阳性单数代词，未明列名词；直接指定“主”或“亚伯拉罕”都会消除原文的指代张力。
- issue: 成就应许者的主语
  choice: 译作“上帝必定成就这些事”
  alternative: 保持纯代词形式“他必定成就这些事”
  rationale: 所成就的是上帝先前论亚伯拉罕所说的话；现代汉语连续出现多个“他”会造成不必要的混淆，补出上帝并未改变语义关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留天使叙述者的复数“我们”，并以脚注处理原文代词的真实歧义。
