revisions:
- from: 他们玷污自己，在肉身上行淫乱，在地上行污秽之事。照样，主也必审判那些地方，因为那里的人照所多玛的污秽行事；主怎样审判了所多玛，也必怎样审判那些地方。
  to: 他们玷污了自己，在自己的肉身上行淫，在地上行污秽之事。同样，主必审判那些地方，就是人们在那里照着所多玛的污秽行事的地方，正如他审判了所多玛。
  rationale: 修订仅消除不必要的因果强化，并改善“在肉身上行淫乱”的汉语搭配。“人们在那里”将原文地点从句中隐含的行为者以汉语所需的最低限度明示，同时仍以“那些地方”为主审判对象；“正如他审判了所多玛”保留原文的比较。
