base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/006.yaml
  text: and they defiled themselves and committed fornication in their flesh and did uncleanness on the earth. And thus the Lord will execute judgment on the places where they have acted according to the uncleanness of Sodom, just as he judged Sodom.
translation:
  language: zh_hans
  text: 他们玷污了自己，在自己的肉身上行淫，在地上行污秽之事。同样，主必审判那些地方，就是人们在那里照着所多玛的污秽行事的地方，正如他审判了所多玛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትራኩሱ
  choice: 玷污自己
  rationale: 该动词在此表达使自身成为不洁；采用反身说法，保留原文的主动参与意味。
- source_word: ይዜምዉ
  choice: 行淫乱
  rationale: 对应性方面的不贞或淫乱行为；用现代汉语中庄重且清楚的宗教伦理用语。
- source_word: በሥጋሆሙ
  choice: 在肉身上
  rationale: 直译其身体／肉身层面的限定，不将其进一步解释为某一种特定性行为。
- source_word: ርኵሰ
  choice: 污秽之事
  rationale: 保留该词兼具礼仪与道德不洁的宽泛语义，避免缩窄为单一罪行。
- source_word: ኵነኔ
  choice: 审判
  rationale: 在本句中指上主施行司法性的判决；‘审判’比‘定罪’更能保留行动与结果之间的开放性。
- source_word: መካናት
  choice: 那些地方
  rationale: 按复数名词直译，维持审判对象首先是相关地点的表达。
theological_decisions:
- issue: 所多玛的污秽是否应明确界定为某种特定罪行
  choice: 保留为‘所多玛的污秽’
  alternative: 解释为某一种具体的性罪或社会罪
  rationale: 原文自身没有在本节进一步界定，故保留概括性表达及其神学张力。
- issue: 末句审判对象与比较关系
  choice: 明示‘主怎样审判了所多玛，也必怎样审判那些地方’
  alternative: 压缩为‘正如他审判所多玛’
  rationale: 汉语需要补足比较项才能自然清楚；所补内容来自前句‘审判那些地方’，没有增加新的神学判断。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。句法适度展开，以清楚呈现因果和类比关系；保留‘肉身’‘污秽’‘审判’等源文中的宗教伦理语汇，不作宗派化解释。
