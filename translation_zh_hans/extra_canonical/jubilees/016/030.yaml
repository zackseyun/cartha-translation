base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/030.yaml
  text: It is an everlasting statute throughout their generations, year by year. And there is no limit of days for this, for it is ordained forever for Israel, that they should celebrate it and dwell in booths and wear crowns on their heads and take leafy branches and willows.
translation:
  language: zh_hans
  text: 这是他们世世代代、年年都要遵守的永恒的律例。这事没有日数的限制，因为这是为以色列永远定下的：他们要守这节，住在棚里，头戴冠冕，并拿着带叶的树枝和柳枝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕገ፡ ዘለዓለም
  choice: 永恒律例
  rationale: “ሕግ”指律法、规条或律例；“ዘለዓለም”表示永久。译作“永恒律例”既贴近原文，也符合庄重而通顺的现代汉语。
- source_word: በትውልዶሙ፡ በኵሉ፡ ዓመት፡ ወዓመት
  choice: 他们世世代代、年年
  rationale: 保留“历代”与“每年反复遵行”两个时间层面；“年年”自然传达原文“年复一年”的重复表达。
- source_word: ወአልቦ፡ ለዝንቱ፡ ወሰነ፡ መዋዕል
  choice: 这律例没有日期的限期
  rationale: “ወሰነ”有界限、终点之意，“መዋዕል”指日子或时日；此处表示该律例不受某个时限终止。补出“这律例”以避免汉语指代含混。
- source_word: ሥሩዕ፡ ላዕለ፡ እስራኤል
  choice: 为以色列……定下的
  rationale: “ሥሩዕ”表示设立、规定；“ላዕለ”在此表达施加或规定于以色列。
- source_word: ይግበርዎ
  choice: 守这节
  rationale: 字面为“行它／实行它”。上下文所指是住棚节的庆祝与遵守，译为“守这节”在汉语中自然，并保留礼仪实践含义。
- source_word: ምጽላል
  choice: 棚
  rationale: 指节期居住的临时棚舍；“棚”与本段礼仪语境相符。
- source_word: አክሊላተ
  choice: 冠冕
  rationale: 该词可指冠、冠冕或环状头饰。正文采用范围较宽且庄重的“冠冕”，不擅自具体化为花冠。
- source_word: ዐጽቀ፡ ቈጽል
  choice: 带叶的树枝
  rationale: 组合表达有叶、枝叶繁茂的枝条；译法具体、自然。
- source_word: ውኩሓ
  choice: 柳枝
  rationale: 原文只表达柳树或柳枝，未含“溪边的”等修饰，因此不按《利未记》平行措辞增译。
theological_decisions:
- issue: 律例的永久性
  choice: 同时保留“永恒”“没有日期的限期”“永远定下”三重表述
  alternative: 为避免重复而合并为一句“永远有效”
  rationale: 原文刻意重复强调永久性；保留这种强调，不弱化其神学与礼仪分量。
- issue: 节期行为的指称
  choice: 译作“守这节”
  alternative: 直译作“行这事”或“实行它”
  rationale: 上下文明确谈节期礼仪；“守这节”准确且自然，但不额外引入节名或解释性神学。
- issue: 柳枝是否来自溪边
  choice: 只译“柳枝”
  alternative: 译作“溪边的柳枝”
  rationale: 吉兹语本句没有“溪边的”这一成分；不以《利未记》23:40的措辞补充原文。
translation_notes:
  register: 采用现代、庄重、普通读者易懂的经文体。句法适度拆分以符合现代汉语，同时保留原文对律例永久性的重复强调。未设置脚注，因为正文可直接表达现有原文证据，且不应保留缺乏吉兹语依据的“溪边”异译。
