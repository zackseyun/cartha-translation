  yaml_path: translation/extra_canonical/jubilees/016/004.yaml
  text: and his name, Isaac, was written on the heavenly tablets. And when we returned to her at the appointed time, she conceived and bore a son.
translation:
  language: zh_hans
  text: 他的名字——以撒——被写在天上的书板上。[a]到了指定的时刻，我们回到她那里，[b]她就怀了孕，生了一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的名字被写在天上的书板上，就是以撒。”
    reason: 保留原文中“以撒”后置所形成的另一种句法呈现。
  - marker: b
    text: 或译：“我们来到她那里。”
    reason: “回到”也可在较宽泛的语境中理解为“来到”，故列出这一译法。
lexical_decisions:
- source_word: ስሙ
  choice: 他的名字
  rationale: 该词含第三人称阳性单数领属后缀，直译为“他的名字”，不可省略领属意义。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的书版
  rationale: ጽላት指可供书写的版、板或册版；采用“书版”既保留具体载体意象，也避免误解为普通石板。
- source_word: ገባእነ
  choice: 我们回到
  rationale: 该动词在此表示“返回、再来”，并与上下文所应许的再次到访相呼应；“回到”比单纯“来到”更准确。
- source_word: በጊዜ፡ ሰዓት
  choice: 到了指定的时刻
  rationale: 该短语指预定或约定的时间；此译法自然表达时间已到，同时保留其确定性。
theological_decisions:
- issue: 以撒之名与天上书版的关系
  choice: 将“以撒”作为“他的名字”的同位语，用破折号标明
  alternative: 译作“他的名字写在天上的书版上，就是以撒”
  rationale: 原文词序可使“以撒”显得后置，但核心意义仍是所记之名为以撒；同位结构在现代汉语中清楚自然，又不增添神学解释。
- issue: 来访者再次到撒拉那里
  choice: 译为“我们回到她那里”
  alternative: 译为“我们来到她那里”
  rationale: 选择“回到”依据吉兹语动词本身的返回义，并保留与应许再次来访之间的叙事联系，而不进一步界定“我们”的身份。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“天上的书版”保留古代天上记录载体的具体意象；破折号使同位语清晰。所有脚注标记均置于正文相应位置。
