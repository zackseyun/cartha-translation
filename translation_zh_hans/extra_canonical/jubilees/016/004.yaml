  to: 他的名字——以撒——被写在天上的书板上。[a]到了指定的时刻，我们回到她那里，[b]她就怀了孕，生了一个儿子。
  rationale: 作出小幅措辞修订，以更清楚反映原文被动语态、避免“书版”的现代词义歧义，并使受孕事件的叙事完成性更自然。保留“以撒”的同位语处理、“回到”的词义选择、原有脚注锚点和所有不确定性。
