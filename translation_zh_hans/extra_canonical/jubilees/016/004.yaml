  naturalness: 修订后采用现代庄重的书面语。“他的名字——以撒——被写在天上的书板上”清楚自然；“她就怀了孕”比“她就怀孕”更符合叙事中已经发生的受孕。
  terminology: “天上的书板”保留 heavenly tablets 的记录载体意象，不预设其材质为石头，也不将其泛化为“书”或“册”。“回到她那里”恰当呈现该动词的返回／再来之义。
