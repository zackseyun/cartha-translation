- from: 祭司的职分和圣洁的百姓。他便继续上路，满心欢喜，并因我们把这事告诉了他而称颂万有的创造主。[a]
  to: 祭司的职分和圣洁的百姓。他继续上路；因我们曾告诉他，他欢喜，并称颂万有的创造主。[a]
  rationale: 修订仅删除无明确原文依据的“这事”及略强化语气的“满心”，并调整语序，使“因我们曾告诉他”可自然关联后续的欢喜与称颂。其余关键术语和脚注所记录的替代译法均予保留。
