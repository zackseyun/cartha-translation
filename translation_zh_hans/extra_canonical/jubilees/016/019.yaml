  text: a priesthood and a holy people. And he went on his way, and he rejoiced and blessed the Creator of all because we had told him.
translation:
  language: zh_hans
  text: 祭司的职分和圣洁的百姓。他继续上路；因我们曾告诉他，他欢喜，并称颂万有的创造主。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一译法：“因我们告诉他的一切而称颂主。”
    reason: 保留既有译法所反映的另一种句法与神圣称号理解；正文依据所提供的源文审查，译为“万有的创造主”，并将末句理解为因果关系。
lexical_decisions:
- source_word: ክህነት
  choice: 祭司的职分
  rationale: 该词是表示祭司身份、职任或祭司体系的集合／抽象名词；译作“祭司的职分”既区别于单数“祭司”，也能自然衔接本节残句。
- source_word: ሕዝበ፡ ቅዱሰ
  choice: 圣洁的百姓
  rationale: 按名词加形容词的结构直译，同时保留其群体性和宗教语域。
- source_word: ፍኖተ
  choice: 继续上路
  rationale: 在“行走／道路”的语境中用自然现代汉语表达“走自己的路、继续行程”。
- source_word: ተፈሥሐ
  choice: 满心欢喜
  rationale: 表达喜乐、欢欣之意；“满心”使中文流畅，但不增加新的事件内容。
- source_word: ለባሬ፡ ኵሉ
  choice: 万有的创造主
  rationale: 结合所提供的校勘审查证据，短语指向“万有的创造者”，其中“万有”修饰创造主，而不是后面的“我们告诉他的”内容。
- source_word: ዘነገርናሁ
  choice: 因我们把这事告诉了他
  rationale: 将关系形式按此处的因果功能处理；“这事”承接上下文，避免误将“万有／一切”当作“告诉”的宾语。
theological_decisions:
- issue: 神圣称号的译法及“万有”的句法归属
  choice: 称颂万有的创造主
  alternative: 因我们告诉他的一切而称颂主
  rationale: 来源审查指出相应短语是“万有的创造主”，且后续关系分句在此表原因。正文据此保留具体称号“创造主”，不把“万有”移接为“告诉”的宾语；脚注记录旧有的另一种句法理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭司的职分”保留开头作为上文续接成分的残句性质；“百姓”“称颂”“创造主”维持经籍语体，但避免古奥表达。
