  terminology: “祭司的职分”适切表达集合／抽象名词，“圣洁的百姓”符合经籍语域。“万有的创造主”忠实呈现“Creator of all”，不应改作“主”，也不应把“万有”转归给“告诉”的宾语。脚注作为既有异读／旧译法记录可保留，但须明确其为另一译法，而非正文所据理解。
