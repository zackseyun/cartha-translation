  yaml_path: translation/extra_canonical/jubilees/016/023.yaml
  text: to make atonement for sin by it, for himself and for his seed. And for a sacrifice of well-being, seven rams, seven kids, seven sheep, and seven male goats, and their grain offerings and their drink offerings. And he burned all their fat on the altar, a choice offering to the Lord for a pleasing aroma.
translation:
  language: zh_hans
  text: 借此为罪赎罪，即为自己和自己的后裔赎罪。他又献平安祭：公绵羊七只、幼山羊七只[a]、绵羊七只、公山羊七只，并献上相应的素祭和奠祭。他把它们所有的脂油都焚烧在祭坛上，作为献给主的上好祭物，成为蒙悦纳的馨香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幼山羊”所对应的原文也可理解为“幼畜”或“牛犊”。
    reason: 原词所指牲畜种类存在词义不确定性；正文依当前源文审校采用“幼山羊”，脚注保留其他可能。
lexical_decisions:
- source_word: ያስተስሪ፡ ቦቱ
  choice: 借此……赎罪
  rationale: 保留动词“赎罪”及代词短语“借此”的工具性含义，不把代词所指擅自具体化。
- source_word: መሥዋዕተ፡ መድኀኒት
  choice: 平安祭
  rationale: 该祭名表达安宁、福祉或和好的祭；“平安祭”是现代中文圣经语域中自然且易懂的对应。
- source_word: አብሐኩ
  choice: 公绵羊
  rationale: 按此词在吉兹语中的牲畜义处理为ram，避免受常见祭牲清单影响而误译为公牛。
- source_word: መሐስአ
  choice: 幼山羊
  rationale: 正文采用kids的理解；该词亦可能泛指幼畜或牛犊，故以脚注保留词义不确定性。
- source_word: መሥዋዕቶሙኒ፡ ወቍጻጼቶሙኒ
  choice: 相应的素祭和奠祭
  rationale: 以中文祭祀术语区分随牲祭而献的谷物祭和浇奠之祭；“相应的”传达复数所属关系。
- source_word: ሥብሖሙ፡ የዐጥን
  choice: 把……脂油都焚烧在祭坛上
  rationale: 传达脂油被焚烧、化为烟气的祭坛动作，使用自然中文而不额外加入香料。
- source_word: ጽንሓሐ፡ ኅሩየ፡ ለእግዚአ
  choice: 作为献给主的上好祭物，发出蒙悦纳的香气
  rationale: 兼顾“上好/精选”与献给主、香气悦纳的祭祀表达。
theological_decisions:
- issue: 赎罪的对象与方式
  choice: 借此为罪赎罪，为自己和自己的后裔赎罪
  alternative: 为罪，就是为自己和自己的后裔赎罪
  rationale: 源文既明说“罪”，又含工具性代词“借此”；正文保留两者，并不推断祭物本身具有独立功效。
- issue: 祭名的表达
  choice: 平安祭
  alternative: 福祉祭／和好祭
  rationale: “平安祭”在中文中较为通行，同时不把该祭的神学意义缩窄为某一种解释。
- issue: 悦纳香气的主语关系
  choice: 祭物发出蒙悦纳的香气
  alternative: 使主闻到馨香
  rationale: 避免将拟人化感官描写进一步强化，同时保留祭物蒙主悦纳的含义。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语，并保留本节承接上文的开头结构。祭祀术语使用普通中文读者较熟悉的“赎罪、平安祭、素祭、奠祭”；动物名称尽量明确，同时以脚注呈现真实的词汇歧义。
