  yaml_path: translation/extra_canonical/jubilees/016/031.yaml
  text: And Abraham took branches of palm trees and fruit of beautiful trees, and every day he went around the altar with the branches seven times; and in the morning he praised and gave thanks to his God for everything with joy.
translation:
  language: zh_hans
  text: 亚伯拉罕取了棕榈树枝和佳美树木的果实，天天拿着这些枝子绕祭坛七圈；清晨，他欢欢喜喜地为一切赞美并感谢他的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ፀበርት
  choice: 棕榈树枝
  rationale: 依该词组在本节节期语境中的通常理解，并与英译审校层相符；用“树枝”表达所取的是枝条。
- source_word: ፍሬ፡ ዕፀ፡ ሠናይ
  choice: 佳美树木的果实
  rationale: 较贴近字面结构“佳美之树的果实”，不把“果实”改释为“枝子”。
- source_word: የዐውድ፡ ምሥዋዐ
  choice: 绕祭坛
  rationale: 动词表示环绕、巡行；汉语以“绕祭坛”自然准确地传达动作。
- source_word: በአዕፁቅ፡ ስብዕ
  choice: 拿着这些枝子……七圈
  rationale: “በአዕፁቅ”表示以／带着枝条，“ስብዕ”为七；结合“绕”在汉语中以“七圈”表达次数最自然。
- source_word: ይሴብሕ፡ ወይጌኒ
  choice: 赞美并感谢
  rationale: 分别保留赞颂与称谢两个并列动作。
- source_word: ዘበፍሥሓ
  choice: 欢欢喜喜地
  rationale: 源语末语表达在喜乐中行事；汉语副词形式自然，也使其修饰赞美和感谢这一整体行动。
theological_decisions:
- issue: “他的上帝”的关系表达
  choice: 他的上帝
  alternative: 上帝
  rationale: 保留源语所属关系，不将其泛化，也不添加盟约或宗派性解释。
- issue: 喜乐所修饰的范围
  choice: 使“欢欢喜喜地”修饰赞美并感谢两个动作
  alternative: 仅与“为一切”或“感谢”相连
  rationale: 源语末尾成分的精确修饰范围可有句法张力；中文将其置于并列谓语前，较自然地保留整项行动是在喜乐中完成的含义。
translation_notes:
  register: 采用现代、庄重而通俗的简体中文。“佳美树木”保留经文式庄重感；“天天”“清晨”“七圈”则保持明白自然。源文中方括号所示的“每日”与前文同义，正文不重复译出，以免造成并非必要的强调。
