    text: “后裔”原文直译为“种子”，也可指子孙、后代。
    reason: 保留ዘርእ的实体隐喻及其集体后裔含义。
  revision_rationale: 修订仅处理末句的句法忠实度和首句的中文语序。“好叫它像”对应目的从句，避免“使”所带来的额外使役含义；“它”不把原文未明示的代词先行词绝对限定为“后裔”。其余关键术语、植物意象、“万有”以及脚注均予保留。
