base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/026.yaml
  text: And he blessed his Creator, who had created him in his generation, because He had created him according to His good pleasure; for he knew and perceived that from him there would be a plant of righteousness for the eternal generations, and from him a holy seed, so that it might be like Him who made all things.
translation:
  language: zh_hans
  text: 他称颂创造他的主，因为主按自己的美意，在他的世代中创造了他；他知道，也看明：从他必有一株公义之苗，存到永世万代；从他也必有圣洁的后裔[a]，好叫它像那创造万有者一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，也可指子孙、后代。
    reason: 保留ዘርእ的实体隐喻及其集体后裔含义。
lexical_decisions:
- source_word: በትዝምዱ፡
  choice: 在他的世代
  rationale: 按此处语境保留时间与世代含义，同时避免扩展为原文未明说的历史说明。
- source_word: በሥምረቱ፡
  choice: 按自己的美意
  rationale: 既表达意愿，也保留喜悦、悦纳的意味；“按”自然呈现原文所指的创造依据。
- source_word: ወጠየቀ፡
  choice: 也看明
  rationale: 与“知道”并列，表达进一步辨明、确知之意，又不把语义过度强化为绝对确信。
- source_word: ተከለ፡ ጽድቅ፡
  choice: 一株公义之苗
  rationale: 保留栽种、植株的隐喻，并采用现代读者能够自然理解的庄重表达。
- source_word: ዘርእ፡ ቅዱስ፡
  choice: 圣洁的后裔
  rationale: ዘርእ兼有“种子”和“后裔”义；此处从某人而出的语境以“后裔”最自然，同时用脚注保留字面隐喻。
- source_word: ዘገብረ፡ ኵሎ።
  choice: 那创造万有者
  rationale: ኵሎ明确表示“万有／一切”；因此保留该词，不采用缺少“万有”的修订读法。
theological_decisions:
- issue: 圣洁后裔与创造者相像
  choice: 使这后裔像那创造万有者一样
  alternative: 使他像那创造万有者一样
  rationale: 原文代词本身不以大小写标明所指；关系从句“创造万有者”指向创造主，而近接的“圣洁的后裔”最可能是“相像”的主语。译文据句法呈现此读法，但不另加相像的具体层面，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而清楚的经文语体。“公义之苗”保留原文意象；其余句法适度顺应现代汉语。所有神性代词均不依赖英文大写，而由上下文明确所指。
