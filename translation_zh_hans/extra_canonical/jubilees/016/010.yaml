  language: zh_hans
  text: 这个月，亚伯拉罕从希伯仑迁出，前往基拉耳山地，住在加低斯和书珥之间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዝንቱ፡ ወርኅ
  choice: 这个月
  rationale: 按字面保留时间指示，表达自然明确。
- source_word: ተግዕዘ（所给文本误作፯ዐዘ）
  choice: 迁出
  rationale: 该动词在此表示拔营、迁移；结合地点“从希伯仑”，译为“迁出”比单纯“离开”更能体现迁居语境。
- source_word: ኬብሮን
  choice: 希伯仑
  rationale: 采用现代中文圣经读者熟悉的地名译法。
- source_word: Kadesh / Shur / Gerar（本节后半句）
  choice: 加低斯／书珥／基拉耳
  rationale: 采用通行的中文圣经地名形式，并将“mountains”按地貌语境译作“山地”。
