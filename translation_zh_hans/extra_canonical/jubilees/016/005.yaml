base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/005.yaml
  text: She conceived a son. And in this month the Lord executed judgment on Sodom and Gomorrah and Admah [or 'and Dom'] and all the region of the Jordan, and he burned them with fire and sulfur and destroyed them to this day, just as I have now declared to you all their deeds, that they are utterly wicked and sinful.
translation:
  language: zh_hans
  text: 她怀了一个儿子。就在这个月，主审判了所多玛、蛾摩拉、押玛[a]和约旦河一带所有的地区；他用火与硫磺焚烧它们，并将它们毁灭，直到今日。正如我如今已把他们的一切所作所为告诉你：他们实在极其邪恶，罪孽深重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语文本作“多姆”；此处或为“押玛”的讹变。
    reason: textual_variant
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: 她怀了一个儿子
  rationale: 保留原文开头完整分句；ፀንሰት 表示“怀孕、受孕”，ወልደ 在此指男性后裔，即“儿子”。
- source_word: ገብረ፡ እግዚአብሔር፡ ዘነኒሆሙ
  choice: 主审判了
  rationale: 该短语在语境中指主对诸城施行判决；译作“审判”比生硬直译为“作了他们的审判”更符合现代汉语。
- source_word: ወለዶም
  choice: 押玛[a]
  rationale: 现存吉兹语形式字面近于“多姆”，但很可能是“押玛”在传抄中的讹变；正文采用叙事和地名传统所支持的“押玛”，脚注保留抄本读法的不确定性。
- source_word: ለኵሉ፡ አደያመ፡ ዮርዳኖስ
  choice: 约旦河一带的所有地区
  rationale: 表达约旦河区域的全部地带，采用自然而范围明确的现代汉语。
- source_word: በእሳት፡ ወበተይ
  choice: 用火与硫磺
  rationale: በእሳት 为“用火”，后一词按毁城语境及传统对应物理解为“硫磺”。
- source_word: በከመ፡ ናሁ፡ አይዳዐኩ፡ ኵሎ፡ ምግባሮሙ
  choice: 正如我现在已把他们的一切所作所为告诉你
  rationale: 明确保留“正如”“现在”、第一人称宣告动作以及“他们的一切行为”，避免遗漏原文谓语。
- source_word: ፀዋጋን፡ ወኃጥኣን፡ ጥቀ
  choice: 极其邪恶，罪孽深重
  rationale: 保留双重负面定性及 ጥቀ 的强化作用，以庄重且通顺的汉语表达。
theological_decisions:
- issue: 毁灭持续“直到今日”的表述
  choice: 并将它们毁灭，直到今日
  alternative: 使它们至今仍处于毁灭之中
  rationale: 尽量贴近原文时间短语，同时不额外断定其地理、末世或永刑含义。
- issue: 对居民行为与品格的关系
  choice: 正如我现在已把他们的一切所作所为告诉你：他们实在极其邪恶，罪孽深重
  alternative: 我现在已告诉你他们的一切行为，因为他们极其邪恶、罪孽深重
  rationale: 冒号保留原文中后句可作为所宣告内容的关系，不擅自改成单纯因果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“施行审判”简化为自然的“审判了”；地名使用通行圣经汉译。“他们”指诸城居民，“它们”指诸城及其地区，以区分人和地域。
