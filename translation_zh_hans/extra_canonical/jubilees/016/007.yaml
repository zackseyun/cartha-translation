  text: But Lot we saved, because God remembered Abraham and brought him out from the midst of the overthrow.
translation:
  language: zh_hans
  text: 但我们救了罗得，因为上帝顾念亚伯拉罕，把他从毁灭之中带了出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናድኅኖ
  choice: 我们救了罗得
  rationale: 保留原文第一人称复数的施事表达，并将动词所带的第三人称宾语明确译为“罗得”，使现代汉语自然清楚。
- source_word: ተዘከሮ
  choice: 顾念
  rationale: 该词本义为“记念、想起”；在上帝因记念亚伯拉罕而采取拯救行动的语境中，“顾念”既自然，也保留行动性的含义。
- source_word: አውፅኦ
  choice: 把他……带了出来
  rationale: 准确表达“使他出来、领他出来”，并补明汉语所需的宾语“他”，所指仍是罗得。
- source_word: እማእከለ
  choice: 从……之中
  rationale: 形式和意义均贴近原文“从中间、从当中”，同时符合现代汉语表达。
theological_decisions:
- issue: “我们”与随后“上帝”的关系
  choice: 保留“我们救了罗得”及“上帝顾念亚伯拉罕”
  alternative: 统一改成“上帝救了罗得”
  rationale: 原文先用第一人称复数，随后明确以上帝为第三人称主语；译文不擅自消解这一叙述张力。
- issue: 上帝“记念”亚伯拉罕的含义
  choice: 译作“顾念”
  alternative: 译作“想起”或“记得”
  rationale: “顾念”避免让现代读者误以为上帝此前忘记了亚伯拉罕，同时仍忠实传达原词所指的记念及由此而来的行动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“毁灭之中”承接本节所指的倾覆灾难；代词“他”清楚回指罗得。
