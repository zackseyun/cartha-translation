base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/009.yaml
  text: from the days of Adam until that time, because a man lay with his daughters. And behold, it was commanded and decreed concerning all his seed on the heavenly tablets, that he should remove them and uproot them, and that their judgment be executed like the judgment of Sodom, and that he should leave no seed of his on the earth on the day of condemnation.
translation:
  language: zh_hans
  text: 自亚当的日子起，直到那时[a]，因为有一个人与自己的女儿们同寝。看哪，关于他所有的后裔，命令和定令已经记载在天上的书版上：要除灭他们，将他们连根拔除；要使他们所受的审判如同所多玛所受的审判；在定罪之日，不在地上给他留下任何后裔。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他的时代”。该词组在此通常作时间副词，意为“直到那时”。
    reason: 保留较直译的替代可能，同时表明正文采用符合语境的通常理解。
  - marker: b
    text: “要除灭……不给他留下”所对应的原文动词均为第三人称阳性单数；行动者未在本句明说。也可较明译为：“他要除灭他们，将他们连根拔除……他不在地上给他留下任何后裔。”
    reason: 说明原文单数行动者在中文省略主语的表达中仍得到保留，避免误读为复数执行者。
lexical_decisions:
- source_word: አሜሁ
  choice: 那时
  rationale: 该词组在这里作时间副词，意为“当时、那时”；不把附着代词机械译成“他的时代”。
- source_word: ተአዘዘ፡ ወተቈረጸ
  choice: 发出命令，定下判决
  rationale: 保留两个并列被动动词的语义层次：一项命令已经颁布，一项裁决已经确定；“定下判决”比单纯的“写下”更贴近第二个动词。
- source_word: ያአትትሙ፡ ወ…ይሠርዎሙ
  choice: 除灭他们，将他们连根拔除
  rationale: 两个动词均为第三人称阳性单数形式，所指行动者在上下文中隐含；中文省略主语既自然，也避免擅自补出名称。“连根拔除”传达彻底铲除之意。
- source_word: ይገበር፡ ኵነኔሆሙ
  choice: 使他们所受的审判……
  rationale: 原文动词表达“被施行／得以执行”；此译法保留使审判临到他们的被动含义，同时符合现代汉语表达。
- source_word: ኢያትርፍ፡ ሎቱ፡ ኵሎ፡ ዘርአ
  choice: 不给他留下任何后裔
  rationale: 保留原文第三人称阳性单数主动形式和“不给他留下”的受益格结构，不改写为无主被动句。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的书版
  rationale: “书版”既体现刻写记录的实体意象，也比“石版”更谨慎，因为原词本身不必然限定材质。
theological_decisions:
- issue: 执行审判者的身份
  choice: 在中文正文中省略执行者的显明名称，以无主祈使式“要……”表达
  alternative: 译作“上帝要除灭他们……”
  rationale: 原文动词虽为第三人称阳性单数，语境很可能指向上帝，但本句未明说其名；省略主语既保留语法上的单数行动者，也避免把语境推断写成明文。
- issue: 审判与所多玛的类比
  choice: 译为“使他们所受的审判如同所多玛所受的审判”
  alternative: 译为“照所多玛的刑罚惩罚他们”
  rationale: 保留“审判”的司法性措辞及原文的比较结构，不进一步解释具体刑罚方式。
- issue: 后裔被灭绝的范围
  choice: “不在地上给他留下任何后裔”
  alternative: “他的后裔一个也不存留在地上”
  rationale: 采用主动表达以对应原文单数主动动词，同时保留“任何后裔”的绝对范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留启示性叙事的提示语气；“同寝”比露骨措辞更符合古代宗教文本的庄重语域，同时意思清楚。句中以分号分开三项裁决，使长句层次清晰。
