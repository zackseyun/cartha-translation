revisions:
- from: 因此，天上的法版上为以色列定下：他们要在七月欢欢喜喜地守住棚节七天；这在主面前是蒙悦纳的。
  to: 因此，天上的法版上有关以色列的规定是：他们要在七月欢欢喜喜地庆祝住棚节七天；这一庆祝在主面前是蒙悦纳的。
  rationale: 修订仅改善现代汉语的清晰度和句法自然性：“庆祝住棚节”避免“守住棚节”的歧义；首句调整为自然的汉语领属／限定结构；“这一庆祝”明确承接前述守节行动，以保留“在主面前蒙悦纳”对该行动的关系，未将其武断限缩为节日本身或以色列民。
