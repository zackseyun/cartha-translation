base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/029.yaml
  text: Therefore it is ordained on the heavenly tablets concerning Israel, that they should celebrate the feast of booths for seven days with joy in the seventh month, acceptable before the Lord.
translation:
  language: zh_hans
  text: 因此，天上的法版上有关以色列的规定是：他们要在七月欢欢喜喜地庆祝住棚节七天；这一庆祝在主面前是蒙悦纳的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的法版
  rationale: ጽላት指书写法令的版或石版；译作“法版”既保留天上版册的具体意象，也符合本书中记载天命的语境。
- source_word: ገበርያኮ፡ በዓለ፡ መጸለት
  choice: 守住棚节
  rationale: 字面义为“举行棚舍之节”；采用现代汉语中通行而清楚的节期名称“住棚节”，并以“守”表达举行、遵守该节期。
- source_word: በፍሥሓ
  choice: 欢欢喜喜地
  rationale: 该词表示喜乐、欢欣；叠词表达自然明快，也保留节庆性的喜乐。
- source_word: ዘይትወከፍ፡ በቅድመ፡ እግዚአብሔር
  choice: 这在主面前是蒙悦纳的
  rationale: 保留“在主面前”和被悦纳的被动含义；以“这”指向整项守节行动，避免强行限定为某一个名词。
theological_decisions:
- issue: 天上法版所表达的权威性质
  choice: 译为“天上的法版上为以色列定下”
  alternative: 译为“天上的书卷中记着有关以色列的规定”
  rationale: 原文明确使用“版”并表达已经制定、规定；保留这一具体意象和规范性，不将其弱化为一般记录。
- issue: “蒙悦纳”所修饰的对象
  choice: 用独立分句“这在主面前是蒙悦纳的”
  alternative: 直接修饰“住棚节”或“以色列”
  rationale: 原文关系结构可能关联守节之举或整体规定；独立分句保留其指向范围，不替原文消除句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欢欢喜喜地”保持节庆喜乐，“蒙悦纳”保留经文语体但仍为普通读者熟悉。
