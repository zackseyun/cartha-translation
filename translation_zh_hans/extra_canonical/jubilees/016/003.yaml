  text: And she was afraid and denied that she had laughed because of the word. And we told her the name of her son, as it had been ordained.
translation:
  language: zh_hans
  text: 她害怕了，便否认自己因那话而笑。我们照着所定的，把她儿子的名字告诉了她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈርት
  choice: 害怕了
  rationale: 按该词在句中的完成性叙事用法，表达撒拉因被察知而产生惧怕。
- source_word: ሐሰወት
  choice: 否认
  rationale: 该词基本义涉及说假话；结合宾语从句“自己……笑”，现代汉语用“否认”准确而自然，同时不增添原文没有的评价。
- source_word: በእንተ፡ ቃል
  choice: 因那话
  rationale: 保留介词结构的因由含义，并保留“话”所指在上下文中的一定开放性。
- source_word: ስሞ፡ ለወልዳ
  choice: 她儿子的名字
  rationale: 直译所属关系，清楚表达被告知的是将生之子的名字。
- source_word: በከመ፡ ሥሩዕ
  choice: 照所定的
  rationale: ሥሩዕ 表示已安排、规定或命定；此译保持被动和预先确定之意，不明确添加施事者。
theological_decisions:
- issue: “所定”之施事者
  choice: 采用无施事者的“照所定的”
  alternative: 照上帝所命定的
  rationale: 原文未在本节明说施事者；不补入“上帝”，以保存原文表达的含蓄性。
- issue: 第一人称复数“我们”的身份
  choice: 保留“我们”
  alternative: 改为“天使们”或其他明确身份
  rationale: 原文使用第一人称复数，身份须由上下文判断，本节不作解释性限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因那话而笑”略带原文结构色彩，但仍自然，并避免把“那话”具体解释为应许、宣告或责问。
