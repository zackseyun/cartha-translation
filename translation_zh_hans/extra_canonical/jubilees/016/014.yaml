  text: And Abraham circumcised his son on the eighth day; he was the first to be circumcised according to the ordinance ordained forever.
translation:
  language: zh_hans
  text: 亚伯拉罕在第八天给他儿子以撒行了割礼；他是第一个按照那为永远而设立的规例受割礼的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይስሐቅ
  choice: 以撒
  rationale: 这是人名“以撒”，在汉语圣经传统中已有稳定译名；结合后文可知他是亚伯拉罕在第八天为之行割礼的儿子。
- source_word: ከበቦ
  choice: 行了割礼
  rationale: 该动词在此指施行割礼；用“给……行了割礼”符合现代汉语表达。
- source_word: እመ ሳምንት
  choice: 在第八天
  rationale: 按上下文表示出生后的第八日，译为“在第八天”简洁而忠实。
- source_word: ቀዳሚ
  choice: 第一个
  rationale: 保留“首先、第一”的明确次序含义，不弱化为泛指。
- source_word: በከመ
  choice: 按照
  rationale: 该介词结构表示“依照、按照”，并与完整续文中的“规例”相连，不译作含义较弱的“这样”。
- source_word: ሥርዓት ዘተሠርዓ ለዘለዓለም
  choice: 那永远立定的规例
  rationale: 依据所注明的完整原文续句，保留“规例”及其“永远立定”的持续效力；用自然汉语避免机械重复“被规定的规定”。
theological_decisions:
- issue: “第一个受割礼的人”的范围
  choice: 直译为“他是第一个……受割礼的人”
  alternative: 补作“在约中第一个”或“第一个在第八天受割礼的人”
  rationale: 原句的“第一个”可能依上下文限定于按此永远规例受割礼者。正文不擅自添加范围说明，以保留原文的概括性及潜在张力。
- issue: 规例的永久性
  choice: “永远立定的规例”
  alternative: “永恒的约”
  rationale: 源词表达的是规例、制度或法令，并非此处直接使用“约”一词；因此不以神学术语替换原词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留两分句间紧密的解释关系；明确补出“以撒”，使截断式原文片段在汉语中指代清楚，同时不增加宗派性解释。
