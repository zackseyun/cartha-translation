review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了对母亲的安慰、顺从其意愿、以正直而行以及永不使自己的道路受污的承诺。末句“败坏自己的道路”在汉语中容易被理解为毁坏道路本身，未能清楚表达原文对自身行径／道路的道德性玷污或败坏。
  naturalness: “母亲，不要害怕；请相信我”自然庄重。“行事正直”可通，但将原文“在正直中行走”的行为隐喻略作压缩；末句宜改为“玷污我的道路”，既自然又保留道路意象。
  terminology: “你的意愿”恰当；“正直”符合伦理语境。将“自己的道路”改为“我的道路”可更明确保留原文第一人称所有格；“玷污”较“败坏”更适合此处对道路／行径的道德性表述。
  issues:
  - severity: medium
    issue: 末句“也永不败坏自己的道路”搭配和指向不够准确。
    rationale: 原文为“我绝不……我的道路，直到永远”，所指是说话者的道路／行径。汉语“败坏道路”常指将道路毁坏，伦理含义不够清晰；“玷污我的道路”能保留主动行为、第一人称及道路隐喻。
  - severity: low
    issue: “请相信我”略添礼貌请求色彩。
    rationale: 原文是直接的“相信我／信赖我”。改作“相信我吧”更贴近直接而安慰性的家庭对话语气。
  revised_text: “母亲，不要害怕；相信我吧，我必照你的意愿去做，行事正直，也绝不玷污我的道路。”
