  yaml_path: translation/extra_canonical/jubilees/025/012.yaml
  text: '"Do not fear, mother; be assured that I will do your will and walk in uprightness, and I will never corrupt my ways."'
translation:
  language: zh_hans
  text: “母亲，不要害怕；相信我吧，我必照你的意愿去做，行事正直，也绝不玷污我的道路。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእመኒ
  choice: 请相信我
  rationale: 该词在此是对母亲的直接请求，意为“相信我、信赖我”；这样译比抽象的“你要确信”更贴近原文的人际语气。
- source_word: ፈቃደኪ
  choice: 你的意愿
  rationale: 保留“意愿、心愿”的基本含义，并明确第二人称阴性所指的是母亲。
- source_word: ወበርትዕ፡ አሐውር
  choice: 行事正直
  rationale: 原文直译近于“正直地行走”；汉语用“行事正直”自然表达其道德行为喻义，同时不附加特定宗派解释。
- source_word: ወኢያማስን፡ ፍናውየ፡ ለዓለም
  choice: 也永不败坏自己的道路
  rationale: 保留原文“败坏”与“我的道路”的主动结构及“永远不”的强烈承诺；“道路”维持行为方式的隐喻。
theological_decisions:
- issue: “行走”与“道路”的伦理隐喻
  choice: 前半译作“行事正直”，后半保留“道路”
  alternative: “走正直的路，也永不使我的道路败坏”
  rationale: 避免汉语中近距离重复“走／道路”造成生硬，同时保留末句原有的道路意象和伦理张力。
translation_notes:
  register: 采用现代、庄重而易懂的家庭对话语体；以分号连接安慰、承诺与行为表白。直接引语补全起止引号。
