  yaml_path: translation/extra_canonical/jubilees/025/007.yaml
  text: For I remember the word of Abraham our father, for he commanded me not to take a wife from the daughters of Canaan, but to take a wife for myself from the seed of my father’s house and from my kin.
translation:
  language: zh_hans
  text: 因为我记得我们先祖亚伯拉罕的话[a]：他吩咐我，不可娶迦南人的女儿为妻，却要从我父家的后裔和我的亲族中为自己娶妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我记得我们先祖亚伯拉罕对我所说的话：他曾吩咐我……”。
    reason: 源文“亚伯拉罕的话”及其后连接词的句法关系，可理解为记得亚伯拉罕的话，也可理解为记得他对说话者所说、所吩咐的内容。
lexical_decisions:
- source_word: አዜከር
  choice: 我记得
  rationale: 直译其“记得、想起”之意，并保持第一人称叙述。
- source_word: ነገረ፡ አብርሃም፡ አቡነ
  choice: 我们先祖亚伯拉罕的话
  rationale: 保留“亚伯拉罕的话”这一源文名词结构；“先祖”在此比字面的“父亲”更符合现代汉语对共同祖先的称呼。
- source_word: ኢይንሣእ፡ ብእሲተ
  choice: 不可娶……为妻
  rationale: 按婚姻语境自然表达“不取一个女子”的含义。
- source_word: እምአወልደ፡ ከናአን
  choice: 迦南人的女儿
  rationale: 源文为“迦南的众女儿”；中文以“迦南人的女儿”清楚表达族群归属。
- source_word: እምዘርአ፡ ቤተ፡ አቡየ
  choice: 从我父家的后裔
  rationale: 保留“种/后裔”与“我父家”两层信息，不简化为仅仅“本族”。
- source_word: ወእምዘመድየ
  choice: 和我的亲族中
  rationale: 将ዘመድ译为“亲族”，保持家族及血缘关系的范围，不擅自限定为某一具体亲属。
theological_decisions:
- issue: “我们先祖亚伯拉罕”与“我们的父亲亚伯拉罕”
  choice: 我们先祖亚伯拉罕
  alternative: 我们的父亲亚伯拉罕
  rationale: 源文确为“我们的父亲”，但现代汉语中“先祖”更自然地表达亚伯拉罕作为共同祖先的身份，并未加入宗派性解释。
- issue: 两个婚配来源短语之间的关系
  choice: 从我父家的后裔和我的亲族中
  alternative: 从我父家的后裔中，也就是从我的亲族中
  rationale: 源文以“和”连接两项；正文保留并列，不将后一项确定解释为前一项的同位说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；“娶……为妻”“父家”“亲族”等词保留古代家族婚配语境，同时避免生硬仿译。脚注标记已在正文中以[a]出现。
