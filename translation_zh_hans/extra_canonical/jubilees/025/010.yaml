- source_word: ኢይፈቅድ፡ እግበር፡ ከመ፡ ገብረ፡ ውእቱ
  choice: 但我不愿像他那样做
  rationale: 贴近“不愿意照他所做的去做”，并保留雅各拒绝效法以扫的对比。
theological_decisions:
- issue: 开头让步结构与“吩咐”的主语
  choice: 尽管他吩咐了我这一切
  alternative: 连同他吩咐我的这一切／尽管这一切
  rationale: 原文含“吩咐我”的动词，不能省略；结合全句末尾的拒绝，采用让步表达更能呈现张力。代词“他”依原文保留，不擅自明确其身份。
- issue: 雅各拒绝的具体范围
  choice: 不愿像他那样做
  alternative: 不愿娶那女子／不愿娶妻
  rationale: 原文采用概括性的“像他所做的那样做”，故不把拒绝窄化为某个未明说的具体对象。
