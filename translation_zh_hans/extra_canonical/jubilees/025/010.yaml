  text: And despite all this that he has commanded me[a], these twenty-two years Esau has been urging me and pressing me, speaking to me and saying, ‘My brother, take a wife, one of the sisters of my two wives,’ but I have not been willing to do as he did.
translation:
  language: zh_hans
  text: 尽管他曾向我吩咐这一切，这二十二年来[a]，以扫一直不住地催促我、逼迫我，对我说：‘兄弟啊，娶一个妻子吧，从我两个妻子的姐妹中娶一个。’但我不愿像他那样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这二十二年来”依埃塞俄比亚文保留；这句话大概是说，以扫长年不断向他施压，而不是只发生过一次。
    reason: cultural_note
lexical_decisions:
- source_word: ወምስለ፡ ኵሉ፡ ዘአዘዘኒ፡ ዘንተ
  choice: 尽管他吩咐了我这一切
  rationale: 保留ዘአዘዘኒ“他吩咐我”的明确动词，并按上下文将ወምስለ表达为让步关系。
