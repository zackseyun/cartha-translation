  yaml_path: translation/extra_canonical/jubilees/025/005.yaml
  text: And now[a], my son, listen to my voice and do the will of your mother, and do not take for yourself a wife from the daughters of this land; rather, from my father’s house and from my father’s kindred you shall take a wife for yourself. And God Most High will bless you, and your children will be a righteous offspring and a holy seed.
translation:
  language: zh_hans
  text: “现在[a]，我儿，你要听我的话，照你母亲的心意去做。不要从这地的女子中为自己娶妻；你要从我父家、我父亲的亲族中为自己娶妻。至高的上帝必赐福给你，你的儿女必成为公义的后代、圣洁的苗裔。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节在“从我父家”附近有重复措辞，可能是强调式表达，也可能源于现存文本的局部分段；正文按句意合并处理。
    reason: segmentation_note
lexical_decisions:
- source_word: ግበር፡ ፈቃደ፡ ለአምከ
  choice: 照你母亲的心意去做
  rationale: 直译为“行你母亲的意愿”；此译保持命令语气，同时符合现代汉语表达。
- source_word: አትንሣእ፡ ለከ፡ ብእሲተ
  choice: 不要……为自己娶妻
  rationale: “取一个女子给自己”在婚姻语境中自然译为“为自己娶妻”。
- source_word: እምቤተ፡ አቡየ፡ ወዘመደ፡ አቡየ
  choice: 从我父家、我父亲的亲族中
  rationale: 分别保留“父家”与“父亲的亲族”两个相关而不完全相同的范围。
- source_word: አምላከ፡ ልዑል
  choice: 至高的上帝
  rationale: 既传达神名性称号“至高者之上帝/至高的上帝”，又采用现代中文宗教文本中庄重而通行的表达。
- source_word: ትውልደ፡ ጽድቅ
  choice: 公义的后代
  rationale: 保留“后代/世代”与“公义”的组合，不把它解释为单纯的道德评价。
- source_word: ዘርአ፡ ቅዱሰ
  choice: 圣洁的苗裔
  rationale: “种子”在此指血脉后裔；“苗裔”能保留其繁衍意象并适合庄重文体。
theological_decisions:
- issue: “至高”与“上帝”的语法关系
  choice: 至高的上帝
  alternative: 至高者的上帝
  rationale: 吉兹语词组可按称号理解；上下文是赐福者本身，译作“至高的上帝”最自然，但不进一步加入特定神学解释。
- issue: 后代的圣洁与公义
  choice: 必成为公义的后代、圣洁的苗裔
  alternative: 必是义人的后代和神圣的种子
  rationale: 保留原文的预告/应许语气及两个平行称谓，不说明其圣洁是礼仪性、伦理性还是盟约性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我儿”“父家”“苗裔”略具经文文体色彩，但不致晦涩。正文保留亲属范围、赐福应许以及“公义/圣洁”的张力；未引入宗派性解释。
