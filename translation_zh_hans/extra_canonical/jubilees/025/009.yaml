  yaml_path: translation/extra_canonical/jubilees/025/009.yaml
  text: And for this reason I have guarded my spirit[a], so that I might not sin and might not be defiled in all my ways all the days of my life; for because of wantonness and fornication Abraham my father gave me many commands.
translation:
  language: zh_hans
  text: 因此，我保守我的心灵[a]，免得犯罪，也免得在我一生的日子里、在我所行的一切道路上受玷污；因为父亲亚伯拉罕曾就放荡和淫乱的事，给我许多诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可理解为：“我保守自己，免得玷污自己，也免得我的道路败坏。”
    reason: 原文中“保守”的对象，以及“玷污／败坏”所指的对象，在词汇和句法上可有另一种理解。
lexical_decisions:
- source_word: ተዐቀብኩ፡ በመንፈስየ
  choice: 我谨守自己的心灵
  rationale: 保留“守护、谨守”与“我的灵/心灵”的结构；现代汉语中“心灵”在此比单用“灵”更自然，也符合道德自守的语境。
- source_word: ኢየአብስ
  choice: 免得犯罪
  rationale: 按动词的罪责含义直译，并以“免得”表达目的或防范结果。
- source_word: ኢይማስን
  choice: 免得……受到玷污
  rationale: 采用道德污秽语义，同时用被动表达保留主语究竟是本人还是其道路受到败坏的潜在歧义，并在脚注说明异读。
- source_word: በኵሉ፡ ፍናውየ፡ በኵሉ፡ መዋዕለ፡ ሕይወትየ
  choice: 一生所行的一切道路
  rationale: 将原文“在我一切道路上、在我一生所有日子里”整合为自然汉语，同时保留“一切道路”和终身范围。
- source_word: ምርዐት፡ ወዝሙት
  choice: 放荡和淫乱
  rationale: 分别表达轻佻、纵欲行为与性方面的不贞，避免把两词合并而损失并列强调。
- source_word: አብዝኀ፡ … አዝዘትየ
  choice: 多多告诫我
  rationale: 原文表达父亲给予许多命令；在亲子道德训诫语境中，“多多告诫”自然而庄重，仍保留反复、强烈吩咐之意。
theological_decisions:
- issue: 谨守的对象及受玷污者的句法歧义
  choice: 正文译作“谨守自己的心灵……一切道路受到玷污”
  alternative: “保守自己，免得玷污自己，也免得我的道路败坏”
  rationale: 原文的代词、动词关系可有不同理解；正文采用较顺畅的句法，但用脚注保留“自己受污/道路败坏”的另一种理解，不把道德主体与结果过度固定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“谨守”“玷污”“放荡和淫乱”保留古代道德训诫的力度；避免过度文言化，也不加入宗派性解释。
