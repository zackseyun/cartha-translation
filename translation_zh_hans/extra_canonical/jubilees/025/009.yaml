revisions:
- from: 因此，我谨守自己的心灵[a]，免得犯罪，也免得一生所行的一切道路受到玷污；因为我父亲亚伯拉罕曾就放荡和淫乱的事多多告诫我。
  to: 因此，我保守我的心灵[a]，免得犯罪，也免得在我一生的日子里、在我所行的一切道路上受玷污；因为父亲亚伯拉罕曾就放荡和淫乱的事，给我许多诫命。
  rationale: 修订明确保留“在一切道路上”和“在一生所有日子里”两个范围，同时以自然的现代汉语表达主要读法；脚注保留原文所容许的“自己受污／道路败坏”替代理解。将“多多告诫”改为“给我许多诫命”，以恢复原文的命令性和数量强调。
