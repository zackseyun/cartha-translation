  yaml_path: translation/extra_canonical/jubilees/025/008.yaml
  text: And I heard previously that daughters had been born to Laban, your brother, and I set my heart on them, that I might take a wife from among them.
translation:
  language: zh_hans
  text: 我先前听说，拉班，就是你哥哥，已经有了几个女儿；我便定意要从她们中间娶一个为妻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምቀዲሙ
  choice: 先前
  rationale: 表达此前已经听闻之意，简洁自然，并保留时间上的先行关系。
- source_word: አዋልደ
  choice: 几个女儿
  rationale: 原词为“女儿们”的复数；汉语用“几个女儿”自然体现复数，但不指定确切人数。
- source_word: አንበርኩ፡ ልብየ፡ ላዕሌሆን
  choice: 我就把心放在她们身上
  rationale: 较贴近“把我的心置于她们之上”的原文意象，同时在现代汉语中可理解为有意从中择偶。
- source_word: እንሣእ፡ እምኔሆን፡ ብእሲተ
  choice: 想从她们中间娶一个为妻
  rationale: 准确传达“从她们中取一女子为妻”；补出“一个”使汉语清楚，却不增加身份信息。
theological_decisions: []
