review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了“先前听说”“拉班、你哥哥”“女儿们”以及“从她们中娶一人为妻”的基本内容。不过，“把心放在她们身上”虽逐字保留意象，在现代汉语中较生硬，且容易被理解为泛指情感倾注，未充分表达原文此处定意择妻的含义。
  naturalness: “你哥哥拉班”可理解，但用同位语“拉班，就是你哥哥”更自然、清楚。“拉班生了几个女儿”不算错误，但“已经有了几个女儿”更符合汉语叙述习惯，也避免将焦点不必要地放在生育行为上。“定意要”庄重自然，并能清晰表达“把心置于……之上”的习语性意思。
  terminology: 人名“拉班”正确。“妻”在此为婚姻身份用语，保留为“娶一个为妻”恰当。
  issues:
  - severity: medium
    issue: “把心放在她们身上”在现代标准汉语中不够自然，且语义指向不够明确。
    rationale: 原文的字面意象在此表达的是立意、决心，后接“要从她们中娶一人为妻”的目的说明这一点。改为“定意要”既保留其决意的强度，也避免不必要的歧义。
  - severity: low
    issue: “你哥哥拉班”宜调整为同位语结构。
    rationale: “拉班，就是你哥哥”更自然地保留原文“拉班，你的兄弟”的插入式称谓关系。
