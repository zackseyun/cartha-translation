  yaml_path: translation/extra_canonical/jubilees/025/011.yaml
  text: I swear before you all the days of my life that I will not take a wife for myself from the daughters of the seed of Canaan, and that I will not act wickedly as Esau did.
translation:
  language: zh_hans
  text: 我在你面前起誓：我一生之中，绝不从迦南后裔的女子中为自己娶妻，也绝不像以扫那样作恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሕለ፡ አነ፡ እም፡ ቅድሜኪ
  choice: 我在你面前起誓
  rationale: 按句法表达当面起誓；“你”为阴性单数，与对母亲说话的语境相合，现代汉语无需标明性别。
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: 我一生之中
  rationale: 直义为“我生命的一切日子”，此处用自然庄重的汉语表达誓言持续终身。
- source_word: ኢይንሣእ፡ ሊተ፡ ብእሲተ
  choice: 绝不……为自己娶妻
  rationale: 保留“为自己取得妻子”的反身意味，并以“绝不”传达否定誓言的力度。
- source_word: እምአዋልደ፡ ዘርአ፡ ከናአን
  choice: 从迦南后裔的女子中
  rationale: “种/后裔”采用亲属谱系语境中自然的“后裔”，同时保留“女子中”的范围结构。
- source_word: ወኢያአኪ፡ ገቢረ፡ በከመ፡ ገብረ፡ ዔሳው
  choice: 也绝不像以扫那样作恶
  rationale: ያአኪ 明示作恶、行恶，不应弱化为中性的“做”；后半句保留与以扫行为的比较。
theological_decisions:
- issue: 是否将以扫的行为明确评价为恶
  choice: 译作“作恶”
  alternative: 译作“照以扫所做的去做”
  rationale: 吉兹语动词 ያአኪ 本身含有作恶、行恶之义；明确译出不是额外加入道德评价，而是保存原文措辞。
translation_notes:
  register: 采用现代、庄重且易懂的誓言体。以冒号划分起誓公式和誓言内容；不添加原文没有的宗派性解释。
