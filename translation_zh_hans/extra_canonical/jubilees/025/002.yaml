base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/002.yaml
  text: And she spoke to him, saying, “My son, do not take for yourself a wife from the daughters of Canaan, as Esau your brother did, who took for himself two wives from the daughters of Canaan, and they have made my spirit bitter by all their unclean conduct.”
translation:
  language: zh_hans
  text: 她对他说：“我儿，不要为自己娶迦南女子为妻，像你哥哥以扫那样。他从迦南女子中为自己娶了两个妻子；她们一切不洁的行为都使我的心灵痛苦。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትንሣእ፡ ለከ፡ ብእሲተ
  choice: 不要为自己娶……为妻
  rationale: 保留“为自己娶妻”的反身意味，同时采用现代汉语自然表达。
- source_word: አዋልደ፡ ከናአን
  choice: 迦南女子
  rationale: 字面为“迦南的女儿们”，在婚配语境中译作“迦南女子”清楚自然。
- source_word: ወእምረርዋ፡ ለመንፈሰያ
  choice: 使我的心灵痛苦
  rationale: 原文表达“使我的灵苦涩/痛苦”；“心灵痛苦”既保留内在精神层面的含义，也符合现代汉语。
- source_word: በኵሉ፡ ምግባሮሙ፡ ርኵስ
  choice: 她们一切不洁的行为
  rationale: 将“不洁”作为对其全部行为的性质描述，不额外限定为礼仪或道德范畴。
theological_decisions:
- issue: “不洁”所指的性质
  choice: 保留宽泛的“不洁”
  alternative: 译为“邪恶”或“污秽”
  rationale: 原词可涉及污秽或不洁，文本未明确只指礼仪或伦理意义，因此不作神学化收窄。
- issue: “我的灵”在汉语中的表达
  choice: 我的心灵
  alternative: 我的灵／我的心
  rationale: “心灵”保留人的内在生命与情感痛苦，不将其简化为单纯情绪，也避免现代汉语中“我的灵”的生硬感。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以女性主语“她”体现原文动词的阴性形式；保留以扫娶两个迦南妻子以及她们行为令说话者内心痛苦的因果结构。
