base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/004.yaml
  text: But I[a], my son, love you exceedingly, and my heart and my affection will bless you at all times, by day and in the watches of the night.
translation:
  language: zh_hans
  text: 至于我，我儿，我极其爱你；我的心和我的慈爱必时时祝福你，无论白昼，还是夜间守更的时候。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本行结尾的文本衔接略显生硬；这里按涵盖昼夜全部时段的举隅表达理解，即“白昼和夜间守更的时候”。
    reason: segmentation_note
lexical_decisions:
- source_word: አፈቅረከ፡ ጥቀ፡ ፈድፋደ
  choice: 极其爱你
  rationale: 动词表示“爱”，后接叠加的强意表达；用“极其”自然传达高度强化的语气。
- source_word: ወልብየ፡ ወምሕረትየ
  choice: 我的心和我的慈爱
  rationale: 保留原文两个并列名词；“心”指内在情感，“慈爱”传达ምሕረት兼具怜爱、慈悯和深情的语义范围。
- source_word: ይባርከከ
  choice: 必……祝福你
  rationale: 保留“祝福”的宗教及关系性含义，并以“必”表达该动词在语境中的持续、面向将来的陈述。
- source_word: በኵሉ፡ ጊዜ
  choice: 时时
  rationale: 简洁而自然地表达“在一切时候”。
- source_word: ዕለት፡ ወዐቃቤ፡ ለያልይ
  choice: 无论白昼，还是夜间守更的时候
  rationale: 按昼夜举隅的方式理解结尾，并保留“守更/夜更”这一具体时间意象。
theological_decisions:
- issue: “慈爱”是否应解释为神学意义上的“怜悯”
  choice: 慈爱
  alternative: 怜悯
  rationale: 此处是母亲对儿子的深情祝福；“慈爱”既保留慈悯色彩，又避免把亲情语境过度限定为施怜悯者与受怜悯者的关系。
- issue: “我的心和我的慈爱必祝福你”的拟人表达
  choice: 照原文保留拟人化主语
  alternative: 我必从心里慈爱你、祝福你
  rationale: 原文明确以“我的心和我的慈爱”为祝福的主体；保留这一张力，不把它改写成较平直的释义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我儿”保留亲密且略具古雅的亲子称呼；其余句式力求普通读者易懂，同时保留原文“心和慈爱祝福你”的诗性拟人表达。
