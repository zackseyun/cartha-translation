  text: For all their conduct is fornication and impurity, and there is no righteousness with them, for it is evil.
translation:
  language: zh_hans
  text: 因为他们的一切行为都是淫乱和污秽；他们中间毫无公义，因为这是邪恶的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ምግባሮሙ
  choice: 他们的一切行为
  rationale: 按字面保留“他们全部的行为/行径”，用现代汉语自然表达。
- source_word: ዝሙት
  choice: 淫乱
  rationale: 该词指不正当的性行为；“淫乱”兼顾原文的道德语义与庄重文体。
- source_word: ምርጓት
  choice: 污秽
  rationale: 依英语校勘层所示 impurity，并以宽泛的“污秽”保留其可能兼具礼仪和道德不洁的含义。
- source_word: ጽድቀ
  choice: 公义
  rationale: 保留宗教伦理语境中“正直、公正、合乎正道”的张力，采用通行圣经用语“公义”。
- source_word: እኩይ
  choice: 邪恶
  rationale: 表达原词“恶、坏”的道德判断，语体庄重而易懂。
theological_decisions:
- issue: 末句单数指代的范围
  choice: 因为这一切都是邪恶的
  alternative: 因为它是邪恶的
  rationale: 原文使用单数判断语，但所指可能概括前述整体现象；译为“这一切”使汉语指代清楚，同时不把恶仅限定为某一个先行名词。
translation_notes:
