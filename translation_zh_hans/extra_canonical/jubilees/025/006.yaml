  yaml_path: translation/extra_canonical/jubilees/025/006.yaml
  text: Then Jacob spoke with Rebekah his mother and said to her[a], “Look, I am now a son of nine weeks of years, and I do not know a woman, nor have I touched one, nor have I become engaged, nor do I intend to take a wife for myself from the daughters of Canaan.”
translation:
  language: zh_hans
  text: 随后，雅各对他母亲利百加说：“看哪，我如今已经活了九个七年[a]，却不认识女人，也没有碰过女人，没有订过婚，也不打算从迦南的女子中为自己娶妻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “九个七年”就是六十三年；正文保留《禧年书》特有的纪年方式。
    reason: cultural_note
lexical_decisions:
- source_word: ወልደ፡ ተስዓተ፡ ሱባዔ፡ ዓመት
  choice: 已经活了九个七年
  rationale: 原文直译为“九个年周之子”，即九个七年；用“已经活了”使现代汉语自然，同时保留《禧年书》本身的纪年表达。
- source_word: ኢያአምር፡ ወአገስስኩ
  choice: 不认识女人，也没有碰过女人
  rationale: “认识女人”保留圣经语体中可能指性关系的委婉表达；后项按动词的接触义译为“碰过”，不与前项合并。
- source_word: ወአፈፃርኩ
  choice: 没有订过婚
  rationale: 该词在此表示缔结婚约或订婚；独立译出，避免遗漏原文连续否认中的一项。
- source_word: ወኢይሔሊኒ፡ እንሣእ
  choice: 也不打算……娶
  rationale: ሐለየ含“思想、考虑、打算”之意，故保留意向层面的含义，不弱化为单纯的将来陈述。
- source_word: እምአዋልደ፡ ከናአን
  choice: 从迦南的女子中
  rationale: 准确保留介词“从”和“迦南的女儿们”这一族群表达的实际含义，采用现代汉语自然说法。
theological_decisions:
- issue: “认识女人”的含义
  choice: 保留“不认识女人”的委婉措辞
  alternative: 译作“没有与女人发生过关系”
  rationale: 原文的“认识”具有委婉而可能含性关系的意味；正文保留其语义张力，也由后续“碰过、订过婚”形成递进，不作过度解释。
- issue: 雅各对未来婚姻的态度
  choice: 译为“不打算”
  alternative: 译为“不会”
  rationale: 原文动词明确涉及思想或意图；“不打算”比单纯的“不娶”或“不会娶”更贴近词义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留叙事中的强调语气；“同……说话，对她说”略显复沓，但对应原文先叙述交谈、再引入直接引语的结构。正文中的脚注标记与脚注一致。
