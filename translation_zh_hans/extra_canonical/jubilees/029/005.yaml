  text: the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the seventh year of the fourth week[5], Jacob set out for Gilead in the first month, on the twenty-first; and Laban pursued after him, and he overtook Jacob on the mountain of Gilead in the third month, on the thirteenth.
translation:
  language: zh_hans
  text: 基列地。雅各向拉班隐瞒了自己的心意，没有告诉他。第四个七年期的第七年，正月二十一日，雅各启程前往基列；拉班随后追赶他，并在三月十三日于基列山上追上了雅各。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所列日期较难理解：雅各在正月二十一日启程，拉班在三月十三日于基列山上追上他。译文保留原文的日期，不作协调。
    reason: chronology_note
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ፡ ላባን
  choice: 雅各向拉班隐瞒了自己的心意
  rationale: 原文直译近于“雅各向拉班隐藏了他的心”。现代汉语用“心意”既保留内心意图的意象，又避免“隐藏自己的心”造成生硬或误解。
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: 雅各启程前往基列
  rationale: 该动词可表达转身、返回或动身；此处结合方向后缀，译作“启程前往”最符合叙事语境，同时不额外断定这是“返回”。
- source_word: ወደገኖ፡ ላባ፡ ድኅሬሁ
  choice: 拉班随后追赶他
  rationale: 忠实保留“追赶在他后面”的意思，不加入原文没有的“听说”。
- source_word: ወረከቦ፡ ለያዕቆብ
  choice: 追上了雅各
  rationale: “找到、遇上、赶上”在追赶语境中自然表达为“追上”。
- source_word: ዘሱባዔ፡ ራብዕ
  choice: 第四个七年期
  rationale: 《禧年书》的纪年单位为七年一组；译出“七年期”比单独译“周”更清楚，也避免被理解为七日的一周。
