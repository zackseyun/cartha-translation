translation:
  language: zh_hans
  text: 他们居住的范围，从亚扪子孙之地直到黑门山，以及……的家[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“……的家”之后中断；这里的词是构造形，意思是“……的家（或房屋）”，并非地名“伯特利”。本节所给文本未载其后续成分。
    reason: 说明源文本在本节边界处留下未完成结构，并避免无根据地指定后续成分的位置或将ቤተ误作专名。
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: 他们居住的范围
  rationale: 该词指他们的住处或居住区域；结合“从……直到……”的疆域表达，译为“居住的范围”自然且准确。
- source_word: ምድረ ውሉደ አሞን
  choice: 亚扪子孙之地
  rationale: 依次保留“地、子孙、亚扪”的属格关系，不简化为可能含义更宽的“亚扪地”。
- source_word: ደብረ ሔርሞን
  choice: 黑门山
  rationale: ደብር在此为“山”，ሔርሞን为地名“黑门”。
- source_word: ወቤተ
  choice: 以及……的家
  rationale: ወ为“以及/和”，ቤተ是ቤት“家、房屋”的构造形，要求后接属格成分；现有分节在此截断，因此用省略号明确保留未完结构，不能误作专名“伯特利”。
theological_decisions:
- issue: 本节末尾构造形ቤተ所造成的未完句
  choice: 保留为“以及……的家”
  alternative: 补译为“以及伯特利”或依下节内容补足
  rationale: 原文在本段证据中仅有构造形“……的家”，宾语未出现。补成“伯特利”既不符合ግዕዝ语中该专名的通常形式，也会擅自消除分节截断造成的真实不完整。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们居住的范围”顺应汉语疆域句式；末尾以省略号保留原文在本节边界处的悬置，不擅自补全。
