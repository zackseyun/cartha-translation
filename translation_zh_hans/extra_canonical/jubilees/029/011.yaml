  text: their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon[11]. And the Lord destroyed them because of the evil of their deeds, for they were very lawless, and he caused the Amorites to dwell in their place—an evil and sinful people—and there is no people to this day that has completed all their sins, and they no longer exist.
translation:
  language: zh_hans
  text: 他们的各个王国是加拿音、亚斯他录、以得来、米苏尔和比稳[a]。主因他们行为邪恶而除灭了他们，因为他们极其无法无天；他使邪恶、犯罪的亚摩利人住在他们的地方。直到今日，没有一个民族像他们那样犯尽一切罪恶；他们也不复存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 利乏音人疆域名单中的若干地名，在吉兹语抄传中难以确定；这里采用较为保守的音译。
    reason: textual_variant
lexical_decisions:
- source_word: መንግሥቶሙ
  choice: 他们的诸王国
  rationale: 该词为带第三人称复数领属后缀的“王国”复数形式；用“诸王国”自然体现复数。
- source_word: ቃራናኤም፡ ወአስጠሮስ፡ ወአድራእ፡ ወሚሱር፡ ወቤዎን
  choice: 加拿音、亚斯他录、以得来、米苏尔和比稳
  rationale: 按传世吉兹文本保守音译各地名，不以推测性校勘替换难解名称。
- source_word: ወአሕጐሎሙ
  choice: 而除灭了他们
  rationale: 动词表达使其灭亡、消失；“除灭”既保留主动施事，也符合庄重叙事语体。
- source_word: ጸዋጋን፡ ጥቀ
  choice: 极其无法无天
  rationale: 依上下文表达严重悖逆、越法的性质；“极其”对应强调程度的 ጥቀ。
- source_word: ወአኅደረ፡ አሞሬዎነ፡ ህየንቴሆሙ
  choice: 他使……亚摩利人住在他们的地方
  rationale: 保留使役结构以及“取代他们、住其原处”的空间关系。
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: 像他们那样犯尽一切罪恶
  rationale: 直译语义为“完成他们所有的罪”；汉语以“犯尽一切罪恶”表达罪行达到尽头，同时避免引入“罪孽满盈”等额外神学术语。
- source_word: ወአልቦሙ
  choice: 他们也不复存在
  rationale: 末句字面简略，依否定存在结构补足为自然完整的现代汉语。
theological_decisions:
- issue: 主除灭该族与其邪恶行为之间的关系
  choice: 主因他们行为邪恶而除灭了他们
  alternative: 主使他们离开了自己的恶行
  rationale: 句法中对象后缀指向前述族群，而“因他们行为邪恶”说明审判缘由；所选译文不淡化审判行动。
- issue: 亚摩利人的道德描述
  choice: 邪恶有罪的亚摩利人
  alternative: 亚摩利人住在他们的地方作恶犯罪
  rationale: 原文的“邪恶、犯罪”在名词之后作描述，较自然地修饰亚摩利人这一民族，而非另起一个行为分句。
- issue: “犯尽一切罪恶”的比较对象
  choice: 没有一个民族像他们那样犯尽一切罪恶
  alternative: 没有一个民族犯满了他们的一切罪
  rationale: 原文关系结构略显紧缩；所选译法保留其与前述被除灭族群的比较关系，同时不将“完成罪恶”解释成特定的神学量度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。地名以传统汉语圣经音译可对应者优先（如“亚斯他录”“以得来”“亚摩利人”），其余依吉兹语形式保守音译。保留原文末段强烈而略带张力的概括，不将其改写为特定宗派的罪论表述。
