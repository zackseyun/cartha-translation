base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/029/009.yaml
  text: “The Heap of Witness,” according to this heap. But formerly they used to call the land of Gilead the land of the Rephaim[9], for it is the land of the Rephaim, and the Rephaim were born there—giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature.
translation:
  language: zh_hans
  text: “见证之堆”，即按这石堆而得名。[a] 从前，人们称基列地为“利乏音之地”，[b] 因为那里是利乏音人的土地；利乏音人也生在那里。他们是巨人，身高有十肘、九肘、八肘，最低也有七肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存吉兹文作“见证之宴（或喜乐），正如这宴（或喜乐）”。正文依通常接受的校勘改作“见证之堆”，因为这里是在解释“基列”这一名称，并呼应《创世记》31:47所说的“见证之堆”。
    reason: textual_variant
  - marker: b
    text: 这里把“基列”的“见证之堆”传统与该地较早称为“利乏音之地”的传统并列在一起。
    reason: cross_reference
lexical_decisions:
- source_word: ፍሥሐተ፡ ስምዐ
  choice: 见证之堆
  rationale: 现存吉兹文直译近于“见证之宴／喜乐”，但此处公认存在抄写讹误；上下文是在解释“基列”及《创世记》31章“见证之堆”的地名语源，因此正文采用校勘所恢复的“堆”，并以脚注保留抄本读法。
- source_word: ገለአድ
  choice: 基列
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: ራፋኤል / ረፋኤም / ራፋኤም
  choice: 利乏音／利乏音人
  rationale: 各处是同一族名的拼写变体；采用中文读者较熟悉的圣经音译，不将其解释性地译为“亡灵”。
- source_word: ረዐይት
  choice: 巨人
  rationale: 此词在句中描述利乏音人的巨大体形，后文又明确列出七至十肘的身高；“巨人”自然且贴合语境。
- source_word: በአመት
  choice: 肘
  rationale: 量词在此处表达身高单位；依该段标准译读处理为“肘”，与连续的十、九、八、七相配。
theological_decisions:
- issue: “利乏音”应作为族名还是超自然亡灵来理解
  choice: 保留音译，按当地古族群来表达
  alternative: 译作“亡灵”或其他灵界存在
  rationale: 本节说他们出生在当地，并以肘计量身高，叙事语境明显将其描绘为巨人族群；音译也避免加入超出本节的神学判断。
- issue: 是否把不同身高理解为单一人的约数
  choice: 保留十、九、八、直到七肘的分布范围
  alternative: 概括为“约七至十肘”
  rationale: 原文逐项列举各身高，保留这种递降表达可呈现其修辞力度，并避免抹平文本细节。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“正如这石堆”尽量保留原句简略的语源说明，不扩写成过于确定的“因此得名”。身高部分用自然中文重组，但保留十、九、八、七肘的递降次序。
