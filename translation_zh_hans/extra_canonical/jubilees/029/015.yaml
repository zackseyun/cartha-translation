  text: at the time of autumn. And he sent to his father Isaac from all his possessions clothing and food, meat.
translation:
  language: zh_hans
  text: 到了秋季，他从自己的一切财物中，把衣服和食物、肉类送给父亲以撒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物、肉类”也可译作“肉食”，或理解为“食物和肉”。
    reason: 原文“食物，肉”之间的句法关系不完全明确，可能是修饰、同位说明，也可能列举两项。
lexical_decisions:
- source_word: አመ፡ አቅራቦት
  choice: 到了秋季
  rationale: 按短语整体理解为季节性的时间表达，承接上文所列时节；不把አቅራቦት误解为“带来”。
- source_word: ወይፌኑ
  choice: 他……送给
  rationale: 该动词表示“差送、送出”，并保留连接上文的叙事关系；中文不机械译出句首“并且”。
- source_word: እምኵሉ፡ ጥሪቱ
  choice: 从自己的一切财物中
  rationale: ጥሪት指财物、产业或所有之物；此处表达礼物取自他的全部所有。
- source_word: ልብሰ
  choice: 衣服
  rationale: 采用现代汉语中自然、明确的普通用词。
- source_word: ሲሲተ፡ ሥጋ
  choice: 食物——肉类——
  rationale: ሲሲተ意为食物或给养，ሥጋ意为肉；用破折号保留后者可能对前者作说明的关系，不误译为“初熟的肉”。
