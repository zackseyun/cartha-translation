  text: And Jacob saw that Laban had gone to shear his sheep, and Jacob called Leah and Rachel and spoke to their hearts, that they should come with him to the land of Canaan.
translation:
  language: zh_hans
  text: 雅各看见拉班去给自家的羊剪毛了，就叫来利亚和拉结，对她们说了贴心的话[a]，要她们跟他一起到迦南地去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向她们的心说话”，可指亲切、恳切或打动人心地劝说。
    reason: 保留吉兹语所反映的闪语式表达及其情感和劝服色彩，同时避免正文生硬。
lexical_decisions:
- source_word: ወርእየ፡ ያዕቆብ፡ ከመ፡ የሐውር፡ ላባ
  choice: 雅各看见拉班去……了
  rationale: 依照吉兹语句法保留“看见／察觉”与拉班已经前去的意思；汉语以句末“了”自然表达该行动已发生。
- source_word: ይቅርጽ፡ አባግዒሁ
  choice: 给自己的羊剪毛
  rationale: “剪羊毛”准确表达动词及其宾语；“自己的”明确后缀所指为拉班的羊。
- source_word: ወጸውዖን፡ ያዕቆብ፡ ለሊያ፡ ወለራሔል
  choice: 就叫来利亚和拉结
  rationale: 按汉语叙事习惯调整主语位置，并以“叫来”表达召她们前来的动作。
- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: 对她们说了贴心的话
  rationale: 原文直译为“向／进入她们的心说话”，是带有亲切、恳切或劝服意味的闪语式表达；“说了贴心的话”保留心灵层面的语感，又比机械直译自然。
- source_word: ከመ፡ ይምጽኣ፡ ምስ ሌሁ፡ ምድረ፡ ከናአን
  choice: 要她们跟他一起到迦南地去
  rationale: 保留目的或内容从句的开放性，以“要她们”表达雅各话语所提出的行动，并清楚呈现同行与目的地。
