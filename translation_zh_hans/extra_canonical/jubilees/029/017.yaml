lexical_decisions:
- source_word: ጸዳይ፡ ወዝናም፡ ወማእከለ፡ ክረምት፡ ወሐጋይ
  choice: 春季、雨季、仲冬和夏季
  rationale: 按词面保留原文所列的季节或时令，避免因语境不寻常而擅自改写或省略。
- source_word: ማኅፈደ
  choice: 塔楼
  rationale: 该词在本节两处均指塔楼；采用同一译法，并依据词义及《禧年书》中亚伯拉罕塔楼的地点背景，不译作“洞穴”。
- source_word: ዐዘቅተ፡ መሐላ
  choice: 誓言井
  rationale: 直译地名的构成，保留“井”与“誓言”的语义联系；不直接以另一语言的传统地名取代。
- source_word: ዐርገ
  choice: 上到
  rationale: 保留原文“上去、登上”的方向含义，与塔楼这一地点相称。
