  text: And the Lord did not allow him to devise harm against Jacob, because he had appeared to him in a dream.
translation:
  language: zh_hans
  text: 主没有容许他图谋加害雅各，因为主曾在梦中向他显现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢኀደጎ
  choice: 不容许他
  rationale: 该否定动词结构表达“不让他、未准许他”，保留主阻止其行动的含义。
- source_word: ይሕስም፡ ላዕለ፡ ያዕቆብ
  choice: 谋害雅各
  rationale: 该表达指筹谋对雅各不利之事；“谋害”自然凝练，并保留蓄意加害的意味。
- source_word: አስተረአዮ፡ በሕልም
  choice: 曾在梦中向他显现
  rationale: “曾”表明显现先于主不容许他加害雅各；“向他显现”保留使役/显现结构及宾语所指。
theological_decisions:
- issue: 后半句显现者的指代
  choice: 明确译为“主曾在梦中向他显现”
  alternative: “因为他曾在梦中向他显现”
  rationale: 原文动词形态及上下文指向上主向该人物显现；中文若连续使用两个“他”会产生不必要的歧义，重复“主”仅澄清语法指代，不增添教义解释。
- issue: 因果关系
  choice: 因为
  alternative: 因为/原来
  rationale: እስመ 在此自然引出主阻止谋害的原因；采用“因为”保留直接因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“谋害”比“设计伤害”更符合现代汉语习惯；句中重复“主”以避免代词歧义。
