  yaml_path: translation/extra_canonical/jubilees/029/016.yaml
  text: and drink[16], and milk, and butter, and bread of milk, and from the instruction of all. And for his mother Rebekah, a fourth of the year, in the middle of their times of the months, and between plowing and reaping, and in the middle.
translation:
  language: zh_hans
  text: 又有饮料、奶、奶油、奶饼，以及谷地的椰枣。[a]给他母亲利百加的，则是一年的四分之一，在各月的时段之中，在耕种与收割之间，又在中间……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷地的椰枣”所对应的原文短语含义不十分确定；也可能泛指低地所产的枣类果实。
    reason: lexical_alternative
  - marker: b
    text: 现存分节在这里以“又在中间”突然结束，句意似乎尚未完结。
    reason: textual_fragment
lexical_decisions:
- source_word: ወስቴ
  choice: 还有饮料
  rationale: 按现有校勘层所指的“drink”处理；本节处于馈赠物品清单中，用“饮料”保留其泛指性，不擅自限定为酒。
- source_word: ወኅብስተ፡ ሐሊብ
  choice: 奶饼
  rationale: 字面为“奶的饼/奶制成的饼”，应指一种成形的乳制食品；“奶饼”既贴近构词，又避免无根据地确定为某一种现代奶酪。
- source_word: ወእምነ፡ ትመርት፡ ቍላ
  choice: 以及谷地出产的椰枣
  rationale: 将ትመርት理解为椰枣，将ቍላ理解为低地或谷地；短语有词义和句法困难，故以脚注说明不确定性。
- source_word: ርብዕ፡ ለዓመት
  choice: 一年的四分之一
  rationale: 直译为“一年的四分之一”，不把它解释性改写成“一年四次”。
- source_word: ለአውራኅ
  choice: 各月
  rationale: 该词指“月”，采用复数“各月”，避免旧译误作“路径”。
- source_word: ማእከለ፡ ሐፅኒ፡ ወለ'ዐጺድ
  choice: 在耕种与收割之间
  rationale: 以“在……与……之间”表达ማእከለ…ወ…结构，并区分耕种与收割两个农事阶段。
