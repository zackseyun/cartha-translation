  text: And he dwelt there apart from Esau his son. For in the days when Jacob went to Mesopotamia, Esau took for himself Mahalath, the daughter of Ishmael, as a wife, and he gathered together all his father's livestock and his wives, and he went up and dwelt on Mount Seir, and he left Isaac his father at the Well of the Oath.
translation:
  language: zh_hans
  text: 他住在那里，与他的儿子以扫分开。因为在雅各前往美索不达米亚的那些日子里，以扫娶了以实玛利的女儿玛哈拉为妻；他又把父亲所有的牲畜和自己的妻子们聚集起来，上到西珥山，住在那里；并把他的父亲以撒留在誓约井[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓约井”即别是巴。所给吉兹文片段在“在……”之后截断；此处依据本节完整文本所保存的结尾补足。
    reason: 说明源字段因章节切分而缺失的结尾及该地名的传统对应，避免把补足内容误当作片段中可见的文字。
lexical_decisions:
- source_word: ኀደረ፡ ህየ፡ እምዓሳው፡ ወልዱ
  choice: 他住在那里，与他的儿子以扫分开
  rationale: 保留“住在那里”及表示分离的介词结构，不擅自补明主语身份或分离原因。
- source_word: መስጴጦምያ
  choice: 美索不达米亚
  rationale: 采用该古地名在现代简体中文中的通行译名。
- source_word: ማሕሌትሃ
  choice: 玛哈拉
  rationale: 按《创世记》28:9中该人名的通行中文形式处理。
- source_word: ኵሎ፡ መርዔተ፡ አቡሁ
  choice: 他父亲所有的牲畜
  rationale: “牲畜”能涵盖集合名词的广义所指；忠实保留“他父亲的”，不为缓和叙事张力而改作“自己的”。
- source_word: ደብረ፡ ሴር
  choice: 西珥山
  rationale: 采用圣经地名的通行中文译法。
- source_word: ዐዘቅተ፡ መሐላ
  choice: 誓约井
  rationale: 直译完整经文结尾的地名含义，并以脚注说明其传统地名对应。
theological_decisions:
- issue: 以扫聚集其父全部牲畜的叙事张力
  choice: 照译为“他父亲所有的牲畜”
  alternative: 改作“自己的牲畜”或弱化为“家中的牲畜”
  rationale: 原文明确含“他父亲”，应保留可能引发的历史或伦理张力，不替文本作调和。
- issue: 开头主语与以扫分居的关系
  choice: 保留“他的儿子以扫”而不在正文中补出主语姓名
  alternative: 明确写成“以撒住在那里，与儿子以扫分开”
  rationale: 本节依赖上文确定主语；原文只用代词性动词形式，译文不额外强化原文未明说的姓名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留重复的“住”和连续叙事结构，同时适度调整语序，使普通读者易于理解。
