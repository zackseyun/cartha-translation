  yaml_path: translation/extra_canonical/jubilees/029/013.yaml
  text: And he journeyed on the next morning to the land of Gilead. And Jacob crossed the Jabbok in the ninth month, on the eleventh of it, and on this day Esau his brother came to him, and they were reconciled.
translation:
  language: zh_hans
  text: 第二天早晨，他动身前往基列地。雅各在九月十一日[a]渡过雅博河。就在这一天，他哥哥以扫来到他那里，二人和好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处吉兹文的日期写法可能有讹误；也有译法作“第十周的第一年”。
    reason: 原文日期表达在文本传承与释读上存在困难；正文采用与“九月”直接相连的“十一日”，同时保留另一传统译法。
lexical_decisions:
- source_word: ምድረ፡ ጽባሕ
  choice: 第二天早晨
  rationale: 该短语表示次日清晨；用现代汉语自然、明确地交代时间。
- source_word: ምድረ፡ ገለአድ
  choice: 基列地
  rationale: 保留传统地名“基列”，并以“地”体现原文的地域含义。
- source_word: ኢያቦክሃ
  choice: 雅博河
  rationale: 指雅博水道；中文地名加“河”可避免普通读者误认其为人物或地区。
- source_word: ተኂነኖ
  choice: 二人和好了
  rationale: 依此处叙事语境表达双方关系恢复；避免增添拥抱、立约等原文未明确说明的动作。
theological_decisions:
- issue: 雅各与以扫关系恢复的性质
  choice: 二人和好了
  alternative: 二人彼此宽恕了／二人拥抱了
  rationale: “和好”保留关系恢复这一核心意义，不把经文具体化为赦免宣告或某个身体动作，也不引入额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。短句呈现行程、日期与和好三层信息；专名使用通行圣经译名。
