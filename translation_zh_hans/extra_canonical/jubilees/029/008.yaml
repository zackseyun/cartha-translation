  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገለአድ
  choice: 基列
  rationale: 采用该地名在中文圣经传统中的通行译名。
- source_word: ገብረ፡ ህየ፡ ፍሥሐተ
  choice: 他在那里设宴
  rationale: ገብረ意为“做、举行”，ፍሥሐት在此语境指欢宴或筵席；译为“设宴”自然且保留叙事动作。
- source_word: ለስምዐ
  choice: 作见证
  rationale: 保留“见证”这一核心法律—盟约用语及其目的含义。
- source_word: በእንተዝ፡ ተጸውዐ፡ ስሙ፡ ለውእቱ፡ መካን
  choice: 因此，那地方就被称为——
  rationale: 原文至“那地方的名字被称为”而止，名称似延续至下一节；用破折号明确保留这一未完结构，不擅自补名。
theological_decisions:
- issue: 筵席与见证之间的关系
  choice: 设宴作见证
  alternative: 为见证而举行欢乐庆典
  rationale: 采用简洁而不超释的目的结构，保留盟约场景中筵席本身作为见证的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。经节原文句末不完整，因此以破折号保留其向下文延续的状态。
