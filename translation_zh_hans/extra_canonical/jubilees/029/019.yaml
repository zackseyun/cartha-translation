translation:
  language: zh_hans
  text: 唯有誓约井。以撒从誓约井上去，住在……的塔楼里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“塔楼”采用连接形式，其后的领属成分在下一节；这里的省略号表示原句跨越分节，并非原文缺字。
    reason: 说明源文句法跨越人为节界，避免把普通名词误作地名，也避免在本节内补入下一节的词。
lexical_decisions:
- source_word: ዐዘቅተ፡ መሐላ፡
  choice: 誓约井
  rationale: 按构词直译为“誓约之井”，在现代汉语中凝练为“誓约井”；不擅自以传统地名“别是巴”取代原文的表意名称。
- source_word: ባሕቲቶ
  choice: 只有
  rationale: 表达“单独、惟独”的限制意义；本节开头在现存分节中承接上文，因此保留其片段感。
- source_word: ዐርገ
  choice: 上去
  rationale: 保留该动词“上升、上去”的空间意义，不弱化为泛指的“离开”。
- source_word: ማኅፈደ
  choice: ……的塔楼
  rationale: 将ማኅፈድ视为普通名词“塔楼”，并识别其为连接式，领属成分延至下一节；不用专名音译“玛赫费德”。
