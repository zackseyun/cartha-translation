  text: by night and told Laban concerning Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent, on the mountain.
translation:
  language: zh_hans
  text: 夜里，把有关雅各的事告诉了拉班。那些日子的第十五日，雅各为拉班和所有同他前来的人设宴。那一天，雅各向拉班起誓，拉班也向雅各起誓：双方谁也不可怀着恶意越到对方那里；他们在山上立此誓。〔a〕
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሌሊተ
  choice: 夜里
  rationale: 原文以时间语承接上文，保留本节开头明显的跨节连续性，不擅自补出主语。
- source_word: ገብረ ... ግዝአ
  choice: 设宴
  rationale: 该词组按语境指筹办筵席；现代汉语用“设宴”简洁而庄重。
- source_word: መሐለ
  choice: 起誓
  rationale: 准确表达双方以誓言约束彼此的动作。
- source_word: ኢይትዐደዉ አሐዱ ኀበ ካልኡ
  choice: 双方都不可……越过山去侵犯对方
  rationale: 字面为“一方不可越到另一方那里”；结合“怀着恶意”，译出敌对越界、侵犯的含义，同时保留双方对等性。
- source_word: በእኩይ
  choice: 怀着恶意
  rationale: 既可指恶意，也可指为害；此处采用目的或意图性的自然汉语表达，避免将具体伤害方式说死。
- source_word: በደብረ
  choice: 越过山去
  rationale: 原文末尾为“在/于山”，且底本在此截断；将“山”与越界动作自然结合，但不补造山名。
theological_decisions:
- issue: 双方誓约的性质
  choice: 按相互不起恶意侵犯的盟约来表达
  alternative: 解释为永久划定领土边界或宗教性圣约
  rationale: 原文只明确双方起誓且不得怀恶意越界，未说明领土永久归属，也未展开特定宗教礼仪，因此不作教派化或过度历史化解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。开头保留承接上文的残句形态，不补主语；末尾底本只到“山”，译文不添加山名。
