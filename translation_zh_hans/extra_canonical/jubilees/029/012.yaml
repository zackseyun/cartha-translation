  text: life upon the earth.[12] And Jacob sent Laban away,, and he went into Mesopotamia, the land of the east; and Jacob returned to the land of Gilead. And he crossed the Jabbok in the ninth month, on the eleventh; and on that day Esau his brother came to him, and he was reconciled with him,
translation:
  language: zh_hans
  text: 他们在地上不再有生命了[a]。雅各打发拉班离去，拉班便往东方之地美索不达米亚去了；雅各则回到基列地。九月十一日，他渡过雅博河；就在那一天，他的兄弟以扫来见他，同他和好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们在地上不再有生命了”也可理解为“地上已不再有他们的存留者”。
    reason: alternative_reading
lexical_decisions:
- source_word: ሕይወት፡ ውስተ፡ ምድር
  choice: 在地上……有生命
  rationale: 按字面保留“生命—在地上”的表达，并结合承接上文的否定语境译为“在地上不再有生命”。
- source_word: ወፈነወ፡ ያዕቆብ፡ ላባሃ
  choice: 雅各打发拉班离去
  rationale: 保留使役和送离的语义，同时采用自然的现代汉语语序。
- source_word: ሜስጶ…
  choice: 美索不达米亚
  rationale: 残存词首与英语校勘层所见地名相符，采用现代汉语通行译名。
- source_word: Jabbok
  choice: 雅博河
  rationale: 采用现代中文圣经地名的通行形式，并补出“河”以便普通读者理解。
theological_decisions:
- issue: “在地上不再有生命”所指范围及其与“余剩”概念的关系
  choice: 正文译作“他们在地上不再有生命了”
  alternative: “他们在地上已没有任何余生存者”
  rationale: 正文保留“生命”的直接措辞，不把可能隐含的“余剩”意义确定化；脚注交代另一种理解。
- issue: 以扫与雅各和好的语态
  choice: “与他和好了”
  alternative: “同他和解了”或“二人和好了”
  rationale: 既表达原文所反映的和好结果，也不额外断定由谁主动促成。
