  yaml_path: translation/extra_canonical/jubilees/029/004.yaml
  text: And Jacob blessed the God of Isaac his father, and the God of Abraham, the father of his father; and he arose and set his wives and his children on animals, and took all his possessions, and crossed the River and arrived.
translation:
  language: zh_hans
  text: 雅各颂赞他父亲以撒的上帝，也颂赞他祖父亚伯拉罕的上帝。随后他起身，让妻子儿女骑上牲口，又带上自己所有的财物，渡过大河，抵达了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据吉兹语文本在“妻子”处字面作“姐妹”；叙事语境指他的妻子。末句没有说明抵达何处。
    reason: 保留源文本的词形疑点以及末句目的地省略所形成的歧义。
lexical_decisions:
- source_word: ባረኮ
  choice: 颂赞
  rationale: 该动词基本义为“祝福”；宾语为上帝时，现代汉语用“颂赞”更自然，也避免产生雅各向上帝赐福的误解。
- source_word: አበ፡ አቡሁ
  choice: 祖父
  rationale: 字面为“他父亲的父亲”，在汉语中自然对应“祖父”，所指是亚伯拉罕。
- source_word: ጸዐ(ነ)
  choice: 让……骑上牲口
  rationale: 此处动词表示把人装载或安置在驮畜上，与随后表示“带上”的ነሥአ有别，也符合《创世记》31:17的叙事情景。
- source_word: አኅቲያሁ
  choice: 妻子
  rationale: 所给文本字面形态可读作“他的姐妹”，但叙事语境及查尔斯版所代表的理解指雅各的妻子；正文采用语境所需的“妻子”，并以脚注保留文本疑点。
- source_word: ጥሪተ
  choice: 财物
  rationale: 指个人所有的家产、牲畜或产业；“财物”在此概括而不过度限定。
- source_word: ፈለገ
  choice: 大河
  rationale: 有定指意味，叙事中指那条河；汉语“大河”保留古代文本的称呼，不擅自补明为幼发拉底河。
- source_word: በጽሐ
  choice: 抵达了
  rationale: 源文仅说“到达”，未明说目的地；译文保留这一省略，不补入地点。
theological_decisions:
- issue: 雅各“祝福”上帝的表达
  choice: 颂赞……上帝
  alternative: 祝福……上帝
  rationale: “颂赞”准确传达人在宗教语境中向上帝称颂的含义，同时避免现代读者把它理解为人赐福给上帝；不改变雅各敬拜其祖先之上帝的神学内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将两个不同动作分别译为“让……骑上牲口”和“带上”，并保留末尾未交代目的地的突兀感。所给吉兹语开头的ምስሌከ（“与你同在”）在语法和内容上属于前一节句尾，故未纳入本节正文。
