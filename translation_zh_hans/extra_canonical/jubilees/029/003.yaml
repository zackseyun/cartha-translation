  yaml_path: translation/extra_canonical/jubilees/029/003.yaml
  text: For he told them everything that he had seen in the dream, and everything that had been spoken to him, that he should return to his father's house; and he said to him, “Go to every place, wherever you go.””
translation:
  language: zh_hans
  text: 因为他把自己在梦中所看见的一切，以及对他所说的一切，都告诉了她们，就是他应当回到父亲家里；他又对他说：“你去吧，无论你往什么地方去。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存吉兹文本作“无论你往哪里去”；有些校勘依据《创世记》31:3重构为“我必与你同在”。
    reason: 说明现存文本与校勘补文之间的差异，并解释为何正文不采用补文。
lexical_decisions:
- source_word: ይግባእ
  choice: 应当回到
  rationale: 动词ገብአ在此表示“返回”，且与雅各回父家这一语境相符；不译作“进入”。
- source_word: ቤተ አቡሁ
  choice: 父亲家里
  rationale: 直译为“他父亲的家”，中文按领属关系自然表达为“父亲家里”。
- source_word: ሖውር
  choice: 你去吧
  rationale: 采用简明自然的命令式，同时保留原文“去”的基本意义。
- source_word: ውስተ ኵሉ መካን ወአይ ተሐውር
  choice: 无论你往什么地方去
  rationale: 依现存吉兹文本表达去往任何地方之意，不采用由《创世记》31:3补入的“我必与你同在”。
theological_decisions:
- issue: 说话者身份
  choice: 保留“他又对他说”的代词表达
  alternative: 明确译作“上帝又对他说”
  rationale: 此节现存原文只用隐含的第三人称阳性主语，并未在本句明说上帝；译文不额外补明身份，以保留原文指代方式。
- issue: 末句是否按《创世记》补文
  choice: 按现存吉兹文本译为“无论你往什么地方去”
  alternative: 译为“我必与你同在”
  rationale: “我必与你同在”虽符合《创世记》31:3及某些校勘重构，却不见于所提供的现存吉兹文本，因此不纳入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“她们”对应原文阴性复数宾语；两组“他”保留原文的代词指代，不擅自明确说话者。
