  yaml_path: translation/extra_canonical/jubilees/029/001.yaml
  text: And it came to pass, after Rachel had borne Joseph, that Laban went to shear his sheep, for he was a three days' journey away from him.
translation:
  language: zh_hans
  text: 拉结生了约瑟以后，拉班去剪羊毛，因为他离雅各有三天的路程。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኮነ፡ እምዘ
  choice: ……以后
  rationale: 该叙事衔接语在此引出时间从句；现代汉语用“……以后”自然表达，无须机械译出“事情发生了”。
- source_word: ይቅርጽ፡ አባግዒሁ
  choice: 剪羊毛
  rationale: 字面为“剪他的羊”；汉语通常以“剪羊毛”表达给羊剪毛这一活动。
- source_word: ምሕዋረ፡ ሠሉስ፡ ዕለት
  choice: 三天的路程
  rationale: 保留以行程时间衡量距离的原文表达。
theological_decisions:
- issue: 末句代词“离他”所指
  choice: 明确译作“离雅各”
  alternative: 保留为“离他”
  rationale: 原文男性单数代词在局部句法上可能产生表面歧义，但叙事语境及《创世记》30:36的对应背景表明，拉班与雅各相隔三天路程；在现代汉语中直译“他离他”不清楚，故明确指称而不改变事件关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；不使用文言套语“事情就这样发生了”。主语关系清晰，并保留“三天的路程”这一古代距离表达。
