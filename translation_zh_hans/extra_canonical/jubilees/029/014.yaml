  text: And he went from him to the land of Seir, but Jacob dwelt in tents. And in the first year of the fifth week in this jubilee, he crossed the Jordan and dwelt beyond the Jordan, and he pastured his sheep from the Sea of Heaps[14] as far as Beth-shan and as far as Dothan and as far as
translation:
  language: zh_hans
  text: 他离开他，前往西珥地；雅各住在帐棚里。在这个禧年的第五个七年期的第一年，他过了约旦河，住在约旦河对岸；他牧放羊群，从“堆海”[a]直到伯善，又直到多坍，又直到……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堆海”是对埃塞俄比亚文中一个含义不确定的地名所作的字面暂译；其背后也可能是另一个地名。
    reason: lexical_alternative
  - marker: b
    text: 现存所据文本在“又直到”之后中断，地点名称缺失。
    reason: textual_fragment
lexical_decisions:
- source_word: ምድረ፡ ሴኢር
  choice: 西珥地
  rationale: 按地名的通常汉译处理，保留原文的地域称谓。
- source_word: ኀደረ፡ በምጽላላት
