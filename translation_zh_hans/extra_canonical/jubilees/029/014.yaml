  rationale: 直译其居住于帐棚的意思，同时采用自然的现代汉语表达。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 此处指禧年纪年系统中的七年周期；译作“七年期”比单译“七”更清楚。
- source_word: ማዕዶተ፡ ዮርዳኖስ
  choice: 约旦河那边
  rationale: 保留相对于叙述视点而言的“河对岸/那边”，不擅自确定东西方向。
- source_word: ባሕረ፡ ፌሐሐት
  choice: “堆海”
  rationale: 依埃塞俄比亚文本的字面构词暂译；该地名不确定，故加引号并附注。
- source_word: ቤተስን
  choice: 伯善
  rationale: 采用该古代地名通行的中文音译。
- source_word: ዶታኤም
  choice: 多坍
  rationale: 采用该地名通行的中文音译。
