  text: Abraham his father, on the mountain of Hebron. And there Jacob kept sending to his father and to his mother, from time to time, everything they needed; and they blessed Jacob with all their heart and with all their soul.
translation:
  language: zh_hans
  text: 他的父亲亚伯拉罕，在希伯仑山上。雅各在那里[a]不时把父母所需的一切送给他们；他们也尽心尽性地祝福雅各。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅各不断送去”。
    reason: 原句的结构可着重表达雅各持续、反复送去所需之物；正文则保留了原文明确的地点词“在那里”。
lexical_decisions:
- source_word: ወ'ህየ
  choice: 雅各在那里
  rationale: 保留原文的地点指示“在那里”，使动作明确承接前面的希伯仑山。
- source_word: እምጊዜ፡ በበ፡ ጊዜ
  choice: 不时
  rationale: 自然表达反复、间或发生的时间含义。
- source_word: ኵሎ፡ ትካዞሙ
  choice: 父母所需的一切
  rationale: 按上下文将复数领属对象明确为父亲和母亲，并以现代汉语表达全部生活所需。
- source_word: በኵሉ፡ ልቦሙ፡ ወበኵሉ፡ ነፍሶሙ
  choice: 尽心尽性
  rationale: 保留“全心、全魂”的双重强调，同时采用庄重而通顺的现代汉语表达。
