base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/003.yaml
  text: '"Jacob is younger; to Jacob your father gave the birthright, and you he abandoned." And Esau said to them, "For I sold my birthright to Jacob for a little dish of lentil stew. And on the day my father sent me to hunt and bring him game, so that he might eat and bless me, Jacob came by craftiness and brought my father food and drink, and my father blessed him and set me under his hand. And now our father has made us swear, me and him, that we will not seek evil, each against his brother."'
translation:
  language: zh_hans
  text: “雅各年纪较小；你父亲把长子权给了雅各，却撇下了你。”以扫对他们说：“因为我曾为一小碗扁豆汤，把我的长子权卖给雅各。有一天，我父亲打发我去打猎，把野味带给他，好让他吃了给我祝福；雅各却用诡计把食物和饮品带给我父亲，我父亲就给他祝福，把我置于他手下。如今我们的父亲已经使我和他起誓，彼此不可图谋恶事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይንእስ
  choice: 年纪较小
  rationale: 表达雅各相对于以扫年幼，避免只译“较小”而显得含混。
- source_word: ልህቃነ
  choice: 长子权
  rationale: 上下文对应以扫卖给雅各的长子身份与权利；现代汉语以“长子权”最自然明确。
- source_word: ኀደገ
  choice: 撇下了
  rationale: 保留“离弃、撇下”的强烈措辞，不弱化为单纯的“没有给”。
- source_word: በኅዳጥ፡ ጸብሐ፡ ብርስን
  choice: 为一小碗扁豆汤
  rationale: 按词组所指的少量扁豆羹，以自然汉语呈现交换代价之微小。
- source_word: በተጠብቦት
  choice: 用诡计
  rationale: 该词在此指以机巧、欺诈手段行事；“用诡计”符合以扫叙述的负面视角。
- source_word: ታሕተ፡ እዴሁ
  choice: 服在他手下
  rationale: 保留“置于其手下”的支配、从属意象，同时使中文可理解。
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: 不可彼此谋害
  rationale: 原意是不可寻求恶事加害对方；“谋害”凝练传达主动图谋伤害，不限定为杀害。
theological_decisions:
- issue: 长子权与父亲祝福之间的关系
  choice: 分别译作“长子权”和“祝福”
  alternative: 将二者合并理解为同一项继承福分
  rationale: 原文先提父亲把长子权给雅各，后又叙述父亲祝福雅各；译文保留两者的叙事张力，不替文本作神学合并。
- issue: “使我服在他手下”的从属含义
  choice: 保留实际从属的表述
  alternative: 弱化为“把他置于我之上”或仅指优先地位
  rationale: 原文的“在他手下”具有明确支配意象，应保留其力度而不预先限定其政治、家族或属灵性质。
- issue: 末句誓言的恶行范围
  choice: 译为“不可彼此谋害”
  alternative: 具体化为“不可彼此杀害”
  rationale: 原文说不可寻求恶事攻击兄弟，范围较“杀害”更广，因此不作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语边界按上下文处理：开头是以扫众子先前话语的结尾，随后转入以扫的回答。“因为”保留原文回应中的因果连接；为避免中文主语含混，在第二处明确写出“雅各”。
