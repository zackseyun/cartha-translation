- source_word: ኢትግበሩ፡ ምስሌሁ፡ ፀብአ
  choice: 不要跟他交战
  rationale: 该短语直指与某人发动或进行战争；译为“跟他交战”简洁自然，并保留敌对行动的含义。
- source_word: ከመ፡ ኢትደቁ
  choice: 免得你们倒下
  rationale: 保留目的／防范从句及“倒下”的开放含义，不擅自具体化为被杀、战败或倒在他面前。
