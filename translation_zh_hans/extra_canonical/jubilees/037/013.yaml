base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/013.yaml
  text: He went in front to lead them to Jacob his brother. Then he remembered all the evil that had been hidden in his heart against Jacob his brother, and he did not remember the oath that he had sworn to his father and to his mother, that he would not seek any evil against Jacob all his days.
translation:
  language: zh_hans
  text: 他走在前面，领他们到他兄弟雅各那里。随后，他想起了暗藏在自己心里、要加害他兄弟雅各的一切恶念，却没有想起自己向父母所起的誓：他自己一生中不图谋任何加害雅各的恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሖር፡ ቅድመ፡ ይምርሖሙ
  choice: 他走在前面，领他们
  rationale: 按动词与方位语的顺序表达“走在前面并引领他们”，补足源文首句而不添加目的以外的信息。
- source_word: ኵሎ፡ እኩየ
  choice: 一切恶念／谋害
  rationale: 前一处结合“暗藏在心里”译作“一切恶念”较自然；后一处位于“寻求”之后，按汉语习惯译作“谋害”，保留其加害之意。
- source_word: ኅብእተ፡ ላዕለ፡ ያዕቆብ፡ እኁሁ
  choice: 暗藏在自己心里、要加害他兄弟雅各
  rationale: 将“隐藏”与“针对雅各”的关系清楚表达出来，同时保留“他兄弟”这一明载称谓。
- source_word: ኢይትኃሠሥ
  choice: 不谋害
  rationale: 该否定形式与“恶事”连用，意为不图谋、不寻求加害；“不谋害”简洁自然。
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: 一生都
  rationale: 直义为“他所有的日子”，现代汉语自然表达为“一生都”。
theological_decisions:
- issue: 以扫回想恶念与忘记誓言之间的张力
  choice: “想起了……恶念，却忘了……誓”
  alternative: 将“想起”解释为重新起意或决意行恶
  rationale: 源文刻意并置“记起”与“没有记起”，译文保留这一叙事和道德张力，不进一步推断其心理过程。
- issue: 誓言对象
  choice: “向父母所起的誓”
  alternative: “向父亲和母亲分别所起的誓”
  rationale: 源文并列父亲与母亲，但未交代是一项还是两项誓言；中文合称“父母”可保持开放。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“恶念”与“谋害”依上下文分别处理同一核心词义，避免生硬重复；末句不再补出“他兄弟”，因为源文最后一次只写“雅各”。
