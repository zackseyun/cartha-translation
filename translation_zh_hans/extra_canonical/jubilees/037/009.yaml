  text: and bow your neck under his yoke. We will not listen to this word." And they sent to Aram, and to Aduram, the friend of their father, and they hired with them one thousand warriors for battle.
translation:
  language: zh_hans
  text: “你要把你的颈项伏在他的轭下。我们不听从这话。”于是，他们派人到亚兰，去见他们父亲的朋友亚杜兰，并与他们一同雇用了一千名战士参战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታበውአ፡ ክሳደከ፡ ታሕተ፡ አርዑቱ፡
  choice: 你要把颈项低在他的轭下
  rationale: 保留“颈项—轭下”的具体意象，并按上下文译为劝令语气；“低在”自然表达屈服于轭下，而不额外解释其政治含义。
- source_word: ኢንሰምዕ፡ ንሕነሰ፡ ዘንተ፡ ነገረ።
  choice: 我们绝不听从这话
  rationale: “听”在此语境兼有接受、服从之意；译作“听从”符合现代汉语，并保留拒绝对方要求的力度。
- source_word: ውስተ፡ አራም፡ ወኀበ፡ አዱራም፡ ኀበ፡ ዐርከ፡ አቡሆሙ፡
  choice: 到亚兰，去见他们父亲的朋友亚杜兰
  rationale: 按句法将亚杜兰理解为身在亚兰、且是他们父亲的朋友；地名和人名采用简明音译。
- source_word: ወተዐሰቡ፡ ምስሌሆሙ፡ ፲፻ መስተባእሳነ፡
  choice: 并同他们一起雇了一千名战士出战
  rationale: 保留“雇用”“一千”和作战人员三个要素；“出战”明确其受雇目的，但不增添“精锐”“精选”等原文未明说的修饰。
