  yaml_path: translation/extra_canonical/jubilees/037/010.yaml
  text: And there came to them from Moab and from the sons of Ammon one thousand chosen men who were hired; and from Philistia one thousand chosen men fit for war; and from Edom and from the Horites one thousand chosen men trained for battle; and from the Kittim strong men fit for war.
translation:
  language: zh_hans
  text: 从摩押和亚扪人中来了受雇的一千名精选战士；从非利士来了能征战的一千名精选战士；从以东和何利人中来了用于作战的一千名精选战士；又从基提来了强壮、能征战的勇士。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያነ
  choice: 精兵
  rationale: 本义为“被选中的人”，在各支军事队伍的语境中译作“精兵”，自然体现经过挑选的战士。
- source_word: ተዐሰቡ
  choice: 雇来的
  rationale: 该词表示受雇；按句法修饰来自摩押和亚扪人的一千名精兵。
- source_word: መስተቃትላነ
  choice: 能征战的
  rationale: 表示适于或能够作战，译法保留能力、适战性的含义，不额外引入训练程度。
- source_word: መስተባእሳነ
  choice: 善于作战的
  rationale: 属于战斗人员的描述；用“善于作战”与前文“能征战”略作区分，同时避免过度具体化为“身经百战”。
- source_word: ዕደወ
  choice: 勇士
  rationale: 语境指强健有力的战士；“勇士”符合现代汉语军事叙事的庄重语体。
- source_word: ኬጢዎን
  choice: 基提
  rationale: 采用圣经汉语中对 Kittim 的通行音译，不擅自限定其具体地域或族群范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留四支队伍的并列结构，并将开头残留的“强健、能征战”理解为承接前文的片段，不在本节重复；末句按现存文本译出来自基提的勇士，但原文未给出明确人数。
