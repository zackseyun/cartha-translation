revisions:
- from: 有一千名从摩押和亚扪人中雇来的精兵，来到他们那里；又有一千名来自非利士、能征战的精兵；有一千名来自以东和何利人、善于作战的精兵；还有来自基提、能征战的勇士。
  to: 从摩押和亚扪人中来了受雇的一千名精选战士；从非利士来了能征战的一千名精选战士；从以东和何利人中来了用于作战的一千名精选战士；又从基提来了强壮、能征战的勇士。
  rationale: 修订以“精选战士”贴近‘被选中的人’在军事上下文中的含义，统一并列结构，并避免将其中一类战斗人员无依据地加强为“善于作战”。末项补足原文同时具有的强壮与适战两项描述。原文未给基提人列出人数，译文也不补入。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:03:06Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了四支队伍及其来源、人数与战斗资格。首句“来到他们那里”对应原文来临动词；“雇来的”正确限定摩押和亚扪的一千名被选者。惟“精兵”带有‘精锐、优于常人’的现代军事评价，较原文‘被选中的人’略有加强；在本段各队均明示为战斗人员的语境中尚可理解，但改为“精选的战士”更贴近原文并避免重复的评价色彩。“来自非利士”可更明确为“从非利士来的”。
  naturalness: 原译流畅、庄重，但后三个并列分句的连接方式不完全一致，且“来自以东和何利人”略显压缩。将四项统一为“从……来的……”，并把描述性定语置于名词后，可使现代汉语叙事更清晰自然。
  terminology: 摩押、亚扪人、非利士、以东、何利人、基提均为恰当且通行的译名。“勇士”可对应末项强壮者；为保留“适于作战”的明示限定，宜作“强壮、能征战的勇士”。“作战”用于前两种战斗能力描述一致，避免以“善于”无根据地区分两个原文战斗词。
  issues:
  - severity: low
    issue: “精兵”可能略强化“被选中的人”的含义。
    rationale: 原词核心为被拣选、选出的人员；虽处军事语境，仍以“精选的战士”较不引入‘精锐部队’的额外现代评价。
  - severity: low
    issue: “善于作战的”对以东和何利人队伍的能力程度略强于原文。
    rationale: 原文此处是战斗人员的描述，不必译为特别擅长；“用于作战的”或“能征战的”更稳妥。
  - severity: low
    issue: 末项“勇士”未显出原文的‘适于作战’限定。
    rationale: 原文同时描述其强壮及战斗资格，补出“能征战的”可完整对应而不增加人数。
  revised_text: 从摩押和亚扪人中来了受雇的一千名精选战士；从非利士来了能征战的一千名精选战士；从以东和何利人中来了用于作战的一千名精选战士；又从基提来了强壮、能征战的勇士。
