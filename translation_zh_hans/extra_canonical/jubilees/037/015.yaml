revisions:
- from: '犹大对父亲雅各说[a]：“父亲，请拉开你的弓，射出你的箭，击倒仇敌，杀死敌手。愿你刚强！我们不杀你的兄弟，因为他与你相同，又是你的至亲；我们要把这份尊荣留给他。”于是雅各拉开弓，射出一箭，射中他兄弟以扫的右胸，把他杀了。他又射出一箭，射中亚兰人亚多兰的左胸，将他击退并杀死。


    随后，雅各的众子和他们的奴仆从塔楼的四面出击。犹大率先出去，拿弗他利和迦得与他同行，另有五十名奴仆跟随他们，从塔楼南面出击。他们杀了迎面遇见的所有人，一个也没有逃脱。利未、但和亚设从塔楼东面出击，另有五十人跟随他们；他们杀了摩押和亚扪的勇士。吕便、以萨迦和西布伦从塔楼北面出击，另有五十人跟随他们；他们杀了非利士的战士。西缅、便雅悯和吕便的儿子以诺从塔楼西面出击，另有五十人跟随他们；他们杀了以东人和何利人中四百名强悍善战的人。


    有六百人逃走，以扫的四个儿子也随他们逃走了。他们丢下父亲；以扫已经被杀，倒在亚杜琳的一座山冈上。雅各的众子追赶他们，直到西珥山。雅各却把自己的兄弟埋葬在亚杜琳的那座山冈上，然后回到家里；众人在那里给他们食物。[b]'
