  text: and that we should remain in love and in peace, a man with his brother, and not corrupt our ways." But they said to him, "We will not listen to you to make peace with him, for our strength is stronger than his strength, and we are stronger than he. Go up against him, and let us kill him and destroy his sons. But if you will not go
translation:
  language: zh_hans
  text: “我们应当常存爱心，彼此和睦，人与自己的弟兄相处，也不败坏我们的道路[a]。”但他们对他说：“我们不听你的，不与他讲和；因为我们的力量比他的力量强，我们也比他强。你去攻打他吧，我们要杀死他，毁灭他的儿子们。你若不去……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我们的道路”；可指人的行事方式或生活道路。
    reason: 说明“道路”的隐喻性，同时避免将其含义限定为带贬义的“行径”。
lexical_decisions:
- source_word: በተፋቅሮ፡ ወበሰላም
  choice: 存着爱心，和睦相处
  rationale: 分别表达“爱”与“和平、和睦”，同时采用现代汉语中自然庄重的说法。
- source_word: ብእሲ፡ ምስለ፡ እኁሁ
  choice: 人与弟兄彼此相待
  rationale: 保留“人与他的弟兄”这一关系表达；“彼此相待”使承接前文的方式在中文中清楚自然。
- source_word: ኢናማስን፡ ፍኖዊነ
  choice: 不败坏我们的行径
  rationale: 动词具有毁坏、败坏之义，名词为复数“我们的道路”；在此作为行为方式的隐喻，译作“行径”既保留伦理含义，也不把语气弱化为仅仅“搅扰”。
- source_word: ኢንሰምዐከ
  choice: 我们不听你的
  rationale: 直译其拒绝听从、接受劝告的语气。
- source_word: ለገቢረ፡ ምስሌሁ፡ ሰላመ
  choice: 不会与他讲和
  rationale: “与他成就和平”在现代汉语中自然表达为“与他讲和”。
- source_word: ይጸንዕ፡ እምኃይሉ፡ ወንሕነ፡ ንጸንዕ፡ እምኔሁ
  choice: 必胜过他的力量，我们必胜过他
  rationale: 源文重复同一动词并作力量比较；中文用两次“胜过”保留重复和夸胜语气。
- source_word: ወናሐጕሎ፡ ውሉዱ
  choice: 灭掉他的儿子们
  rationale: 保留“毁灭”这一强烈动词以及“儿子们”的复数指向，不泛化为后代。
