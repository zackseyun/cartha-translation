  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤልዎ
  choice: 但他们对他说
  rationale: 动词形式按上下文作复数主语“他们说”，宾语后缀译作“对他”；句首连接词结合承接语气译为“但”。
- source_word: ከመ፡ ገብርከ
  choice: 向来就是这样行事
  rationale: ከመ 在此指行为方式“这样”，ገብርከ 表示“你行/做”；加入“向来”自然表达下文所限定的持续时段，不增加“仅仅”等源文没有的强调。
- source_word: ዘእምውርዝትከ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: 从年轻时直到今日
  rationale: 直译其起讫时间结构；“年轻时”比生硬的“青年期”更符合现代汉语。
- source_word: ወአንተ
  choice: 而你……
  rationale: 保留源文末尾“而/并且你”的未完承接，不擅自补足下一段内容；省略号标明本条所给文本截断。
