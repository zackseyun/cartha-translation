  text: 如今，你们的父亲叫我们——我和他——起誓[a]，不可彼此图谋恶事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“叫我和他起誓。”
    reason: 保留传统计读所反映的受词数目差异；正文依所给吉兹语证据采用复数“我们”。
lexical_decisions:
- source_word: እምሐለኩ
  choice: 叫我们起誓
  rationale: 按所给吉兹语文本中的第一人称复数受词理解，并与后面的“我和他”相呼应；“叫……起誓”自然表达使役含义。
- source_word: አቡከ
  choice: 我们的父亲
  rationale: 结合叙事关系与经审核的英文咨询层处理为以撒，即说话者以扫和雅各共同的父亲；吉兹语表面形式存在人称上的困难，因此不机械译作与语境冲突的“你的父亲”。
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: 不可……图谋恶事
  rationale: 保留“寻求、谋求恶事”的主动意涵，同时采用现代汉语中自然而庄重的表达。
- source_word: አሐዱ፡ ላዕለ፡ እኁሁ
  choice: 彼此
  rationale: 原意为“一个人针对他的兄弟”；在兄弟双方互不加害的誓言语境中，“彼此”简洁准确。
theological_decisions:
- issue: 誓言的受誓者是以扫一人，还是以扫与雅各二人
  choice: 译为“叫我们——我和他——起誓”
  alternative: “叫我——我和他——起誓”
  rationale: 所给文本的动词形式及最新校订支持复数受词；同位说明“我和他”也清楚指向二人。脚注保留另一种传统计读。
