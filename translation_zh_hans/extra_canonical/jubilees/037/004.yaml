  source_fidelity: 正文将吉兹语的“你的父亲”（አቡከ）改作“我们的父亲”，与所给底本的人称形式不符。虽然英文审校轨迹作“our father”，但应以原文为先；此处应保留对以扫听众而言的“你们的父亲”。动词受词复数及其后“我和他”的同位说明，则由“我们——我和他——”恰当表达。
  naturalness: “如今，你们的父亲叫我们——我和他——起誓，不可彼此图谋恶事”符合现代庄重汉语。破折号清晰标出“我和他”对“我们”的说明。
  terminology: “叫……起誓”准确自然；“图谋恶事”保留“寻求／谋划恶事、加害兄弟”的宽度，未过度具体化为杀害。
  issues:
  - severity: medium
    issue: “我们的父亲”误译原文第二人称所有格。
    rationale: 原文为አቡከ（“你的父亲”）；在本段直接对儿子们说话的语境中，汉语应译“你们的父亲”。英文审校文本的“our father”不应凌驾于原文形式。
  - severity: low
    issue: 脚注的异读译文“叫我——我和他——起誓”在汉语中自相矛盾。
    rationale: 若保留单数受词的传统读法，应将同位成分直接表达为“叫我和他起誓”，而不以“我——我和他——”的形式并置。
  revised_text: 如今，你们的父亲叫我们——我和他——起誓[a]，不可彼此图谋恶事。
  revised_footnotes:
  - marker: a
    text: 或译：“叫我和他起誓。”
    reason: 保留传统计读所反映的受词数目差异；正文依所给吉兹语证据采用复数“我们”。
  revision_rationale: 将父亲的所属人称恢复为原文的“你们的父亲”，同时保留经文本和英文审校所支持的复数受词“我们”。脚注改为自然且逻辑一致的汉语，以呈现单数受词的替代读法。
