  yaml_path: translation/extra_canonical/jubilees/037/002.yaml
  text: Isaac had given the rights of the firstborn to Jacob his younger son, and they were exceedingly angry. And they contended with their father, saying, "Why, did he give the rights of the firstborn to Jacob, who is younger, while you are the elder, and leave you aside?"
translation:
  language: zh_hans
  text: 以撒把长子的权利给了雅各，就是他较年幼的儿子；他们便怒不可遏。他们与父亲争辩说：“你既是哥哥，他为什么把长子的权利给了弟弟雅各，反倒把你撇在一边呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃነ
  choice: 长子的权利
  rationale: 该词在这里指长幼次序所赋予的优先地位或长子权；结合叙事语境，译作“长子的权利”最清楚自然，也与后文“你明明是长子”相呼应。
- source_word: ዘይንእስ
  choice: 小儿子
  rationale: 字面义为“较小的、年幼的”；修饰以撒的儿子雅各，译作“小儿子”符合现代汉语亲属叙述。
- source_word: ወተምዑ፡ ፈድፋደ
  choice: 他们便怒不可遏
  rationale: 原文表达极其愤怒；“怒不可遏”自然传达强烈程度，同时保留庄重叙事语气。
- source_word: ወተጋአዙ፡ ምስለ፡ አቡሆሙ
  choice: 他们与父亲争辩
  rationale: 动词表示争执、相争；“争辩”既体现冲突，又适合随后引出的质问。
- source_word: እንዘ፡ ሀሎከ፡ አንተ፡ ዘትልህቅ
  choice: 你明明是长子
  rationale: 此句指被说话者以扫处于年长者的地位，不是“我们在场”；“明明”自然表达原句所带的让步和质问语气。
theological_decisions:
- issue: “长子的权利”与雅各所得福分之间的关系
  choice: 按原文保留为“长子的权利”
  alternative: 具体化为“长子的福分”或“继承权”
  rationale: 原词侧重长子所享的优先地位和权利，若改成“福分”或单一的“继承权”，会把意义范围缩窄，并可能替原文解决其与相关创世记传统之间的张力。
- issue: 质问中施事者与受损者的身份
  choice: 以“他”指以撒，以“你”指以扫
  alternative: 理解为众子当时在场，并由以撒把他们撇在一边
  rationale: 原文“你……年长”明确指向众子正在对父亲以扫说话；因此，赐予长子权的是已提到的以撒，被撇在一边的是以扫。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“弟弟雅各”用于引语，体现众子站在父亲以扫的角度陈述雅各较年幼；不增添宗派性解释。
