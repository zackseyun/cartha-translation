base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/006.yaml
  text: 'with us, we will harm you also. And now listen to us: let us send to Aram and to Philistia and to Moab and to Ammon, and let us choose for ourselves select men, eager for battle, and let us go against him and fight with him and uproot him from the land before he grows strong."'
translation:
  language: zh_hans
  text: “……我们也必伤害你。现在请听我们的话：让我们派人到亚兰、非利士、摩押和亚扪去；让我们为自己挑选精锐之士，就是热衷争战的人。我们要去攻击他，与他交战，趁他还没有强大起来，就把他从这片土地上连根拔除。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሐስም
  choice: 伤害他
  rationale: 该动词表达加害、伤害之意；结合残句承接上文，以“伤害他”自然呈现其宾语所指，同时不扩大为“杀死”。
- source_word: ንፈኑ
  choice: 派人……去
  rationale: 源词基本义为“差遣、派出”；汉语需补出泛指受差遣者“人”，而目的地仍依原文列举。
- source_word: ኅሩያነ፡ ሰብአ
  choice: 精兵
  rationale: 字面为“精选的人”；在征战语境中译作“精兵”简洁自然，下一分句再说明其勇于作战。
- source_word: ይዳበጉ፡ ውስተ፡ ቀትል
  choice: 勇于作战
  rationale: 表达这些人投入或奋勇于战斗的特征；避免将其过度解释为嗜血或渴望杀戮。
- source_word: ወንሖር፡ ላዕሌሁ
  choice: 去攻打他
  rationale: 原文为“往他那里去／向他而去”，上下文明确带敌对军事目的，译作“去攻打他”符合现代汉语。
- source_word: ወንሠርዎ፡ እምድር
  choice: 把他从这地连根拔除
  rationale: 动词具有拔除、根除之意；“连根拔除”保留形象力度，“从这地”对应原文介词短语。
- source_word: እንበለ፡ የአዝዝ
  choice: 趁他还没有强盛起来
  rationale: 原文表示“在他变强以前”；用“趁……还没有……”自然传达行动的紧迫性。
theological_decisions:
- issue: “连根拔除”是否明确等于杀死
  choice: 保留“连根拔除”的比喻性表达
  alternative: 把他杀死／彻底消灭他
  rationale: 源词语义强烈，但可能兼有驱除、灭绝等范围；不把其对象的结局缩限为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。本节开头显然承接前文，故以省略号标明残句性质；地名按常见中文圣经译名处理。原文连续使用劝议式“让我们……”，译文适度保留，以呈现联合出兵的鼓动语气。
