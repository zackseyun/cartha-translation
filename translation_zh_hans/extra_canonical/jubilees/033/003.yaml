  yaml_path: translation/extra_canonical/jubilees/033/003.yaml
  text: the maidservant of Rachel, the concubine of his father, bathing in water in a secluded place, and he loved her. And he hid himself, and at night he entered the house of Bilhah and found her sleeping alone in her bed.
translation:
  language: zh_hans
  text: 拉结的婢女、他父亲的妾在隐蔽处用水沐浴；他爱上了她。他便躲藏起来；到了夜里，他进入辟拉的屋子，发现她独自睡在她的床上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即辟拉；她既是拉结的婢女，也是他父亲的妾。直译末句：“发现她独自在她的床上睡着。”原文此处没有“在她家里”。
    reason: 澄清两个并列身份称谓共同指向辟拉，并说明末句的语序及未含“在她家里”的限定。
lexical_decisions:
- source_word: ለአኪተ ፡ ራሔል
  choice: 拉结的婢女
  rationale: 该短语明确指拉结的女仆；结合下文“辟拉的屋子”，所指为辟拉。
- source_word: ዐቅብተ ፡ አቡሁ
  choice: 他父亲的妾
  rationale: 保留原文的亲属关系与身份称谓，不将其误解为拉结。
- source_word: በኅቡእ
  choice: 在隐蔽处
  rationale: 表达隐秘、避人之处，符合沐浴场景。
- source_word: ወአፍቀራ
  choice: 就爱上了她
  rationale: 保留原文动词“爱”的直接表达，不擅自弱化为欲望或迷恋。
- source_word: ውስተ ፡ ዐራታ ፡ ባሕቲታ
  choice: 她独自睡在自己的床上
  rationale: 按原文句法表达“在她的床上，独自一人”，不添加“在她家里”。
theological_decisions:
- issue: “爱”是否应解释为情欲
  choice: 译作“爱上了她”
  alternative: “对她起了欲念”
  rationale: 原文使用“爱”这一动词；虽然后续叙事可能带有性意味，本节本身不宜以解释性措辞消除其语义张力。
- issue: “他父亲的妾”所修饰的对象
  choice: 与“拉结的婢女”并列，共同指辟拉
  alternative: 理解为拉结是他父亲的妾
  rationale: 原文开头先称“拉结的婢女”，继而称“他父亲的妾”；下文明确出现辟拉，叙事上两称均指她。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“婢女”“妾”保留古代社会身份用语；用分号理清躲藏与夜间进入屋子的连续动作。
