  text: And Jacob was very angry with Reuben because he had lain with Bilhah, because he had uncovered his father’s skirt.
translation:
  language: zh_hans
  text: 雅各因吕便与辟拉同寝而对他大为愤怒，因为他揭开了父亲的衣襟。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “揭开父亲的衣襟”是指涉性侵犯的委婉说法；“衣襟”按原文可指衣物或遮盖物，并保留了相关律法文本中的衣物意象。
    reason: 说明此处的惯用含义，同时不把原文的衣物／遮盖物意象改译为“床”，也不将其限定为单一教义性解释。
lexical_decisions:
- source_word: ተምዐ ፡ ጥቀ
  choice: 大发烈怒
  rationale: 表达“极其愤怒”的加强语气，同时保持庄重而自然。
- source_word: ሰከበ ፡ ምስለ
  choice: 与……同寝
  rationale: 直译“与……躺卧”，在本句语境中自然表达发生性关系，同时保留经文语体。
- source_word: ከሠተ ፡ ክዳነ ፡ አቡሁ
  choice: 掀开了父亲的衣襟
  rationale: ክዳን指衣物、遮盖物或衣襟；此处保留与申命记22:30、27:20相近的亲属性禁忌惯用语，不改译为“床”。
theological_decisions:
- issue: “掀开父亲衣襟”的含义
  choice: 保留身体—衣物意象，并以脚注说明其委婉含义
  alternative: 意译为“玷污了父亲的婚床”
  rationale: 原文使用衣物／遮盖意象，既指吕便侵犯父亲的婚姻权利，也与律法文本的措辞相呼应；正文不应消解这一互文张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“吕便”“辟拉”沿用常见圣经译名；“同寝”“衣襟”保留经文的委婉表达。
