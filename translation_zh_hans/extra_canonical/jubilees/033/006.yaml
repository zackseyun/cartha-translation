- source_word: ወኢለመኑሂ ፡ ሰብአ
  choice: 她没有告诉任何人
  rationale: 按语境将否定表达自然译出；原文没有明示所告诉之事，中文无需补出宾语。
- source_word: ወሶበ ፡ መጽአ ፡ ያዕቆብ
  choice: 雅各回来……时
  rationale: መጽአ 基本义为“来、来到”；此处雅各回到相关场景，汉语用“回来”衔接更自然。
- source_word: ወኀሠሣ
  choice: 寻找她
  rationale: 动词为第三人称阳性单数，带第三人称阴性单数宾语后缀，意为“他寻找她”；主语承接雅各。
- source_word: ትቤሎ
  choice: 她对他说
  rationale: 阴性单数主语与阳性单数宾语明确，译出人物关系，并以冒号引出下文话语。
