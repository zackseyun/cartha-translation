lexical_decisions:
- source_word: ተኀፍረት ፡ እምኔሁ
  choice: 在他面前感到羞愧
  rationale: 按该短语的关系义表达为“在他面前”，既符合上下文，也避免误译成“因他而羞愧”。
- source_word: ኀደገት ፡ እዴሃ ፡ እምላዕሌሁ
  choice: 把手从他身上移开
  rationale: 保留“她的手”“从他上面/身上”的具体动作；现代汉语用“移开”自然清楚。
- source_word: ጐየ
  choice: 逃走了
  rationale: 准确传达迅速离开、逃离的动作。
- source_word: ትላሑ ፡ በእንተዝ ፡ ነገር
  choice: 为这事哀叹
  rationale: 忠实保留哀伤、悲叹之义；原文没有明确表示程度，故不增译“非常”。
