base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/033/007.yaml
  text: “I am not pure for you, because I have been defiled apart from you; for Reuben has defiled me and lay with me at night while I was asleep, and I did not know until he uncovered my skirt and lay with me.”
translation:
  language: zh_hans
  text: “我对你已不再纯洁，因为我是在与你分离时受了玷污；吕便玷污了我，他夜里在我熟睡时与我同寝；我一直不知道，直到他掀开我的衣边，与我同寝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንጽሕተ
  choice: 贞洁
  rationale: 此处不是泛指清洁，而是在婚姻与性关系的语境中表示纯洁；“贞洁”自然、庄重，并能承接下文。
- source_word: ተገመዝኩ
  choice: 受了玷污
  rationale: 采用被动表达，保留原文说话者遭人侵犯、被置于不洁状态的含义。
- source_word: እምኔከ
  choice: 在你不在的时候
  rationale: 原词组有“离开你／与你分离”的空间意义；结合叙事语境，以此表达她在雅各不在场时遭遇此事，而不暗示主动背离。
- source_word: አርኩሰኒ
  choice: 玷污了我
  rationale: 与前句“受了玷污”保持词义呼应，也保留性侵犯所导致的礼仪及道德污损色彩。
- source_word: ወሰከበ ምስሌየ
  choice: 与我同寝
  rationale: 按原文保留较含蓄而清楚的性关系委婉语，避免加入原文没有明说的法律定性。
- source_word: ከሠተ ክነፍየ
  choice: 掀开我的衣襟
  rationale: 字面涉及揭开衣服的边缘或遮盖处；“衣襟”在中文中较自然，也保留具体动作而不过度解释。
theological_decisions:
- issue: “不纯洁”的关系指向
  choice: 我对你已不再贞洁
  alternative: 我在你面前不洁净
  rationale: 上下文是对配偶说明性方面的玷污；译文体现关系指向，但不扩展为特定宗派的婚姻或礼仪教义。
- issue: 吕便行为的性质
  choice: 用“玷污”“同寝”呈现原文
  alternative: 直译为“强奸”或“奸污”
  rationale: 原文强调她熟睡且不知情，清楚呈现缺乏知情与同意；但本节所用动词仍为“玷污、同寝”，故不以更具体的法律术语替代，以保存文本自身的张力。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语言。“贞洁—玷污”保持语义连贯；以“正在熟睡”“一直不知道”突出原文所述的不知情状态。无脚注标记。
