  verdict: revise
  source_fidelity: 草稿准确保留了吕便使说话者受玷污、夜间同寝、说话者熟睡且不知情，以及随后“揭开衣边／衣裳”并同寝的重复表述。可是“在你不在的时候”将“与你分离／离开你”的关系性表述具体化为雅各当时不在场，超出了原文与英文审校轨迹所保留的含义。
  naturalness: 整体庄重流畅；但“我对你已不再贞洁”略显将原文较宽的“纯洁／洁净”限定为性贞操身份。“我对你已不再纯洁”既自然，也较贴近原文。
  terminology: “玷污”与“同寝”恰当地保留了原文的性语境和含蓄措辞，未擅加法律定性。“衣襟”可理解，但“衣边”更贴近原文所指衣服边缘／下摆，且不把具体衣物部位限定得过窄。
