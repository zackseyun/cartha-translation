  text: in her house. And he lay with her, and she awoke and saw him, and behold, Reuben was lying with her in the bed. And she uncovered the edge of her covering and seized him and cried out, and she recognized that it was Reuben.
translation:
  language: zh_hans
  text: 在她家里。他与她同睡。她醒来，看见了他；看哪，吕便正和她一同躺在床上。她揭开自己遮盖物的一角，抓住他，呼喊起来，便认出他是吕便。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ ፡ ቤታ
  choice: 在她家里
  rationale: 按字面保留本节开头的地点短语；虽可能承接上一节，所给分节源码将其置于本节。
- source_word: ወሰከበ ፡ ምስሌሃ
  choice: 他与她同睡
  rationale: “躺卧”在此语境中带有性关系含义；“同睡”既自然，也避免加入原文没有的额外细节。
- source_word: ወርእየቶ
  choice: 看见了他
  rationale: 明确译出动词所带的第三人称阳性单数宾语后缀。
- source_word: ውስተ ፡ ምስካብ
  choice: 在床上
  rationale: 依上下文作自然的现代汉语表达。
- source_word: ወከሠተት ፡ ክንፋ
  choice: 她掀开盖在身上的衣物边缘
  rationale: 该短语字面涉及打开或揭开“翼、边缘”；在寝具语境中译为衣物的边缘，同时保留其具体动作而不强定为某一种寝具。
- source_word: ወአእመረቶ
  choice: 这才认出他
  rationale: 此处表示辨认、认出；“这才”自然呈现她先看见、后确认身份的叙事次序。
theological_decisions:
- issue: “与她同睡”是否明确断言双方自愿或清醒
  choice: 不补入自愿、同意或清醒等信息
  alternative: 译成带有双方主动意味的表述
  rationale: 原文只叙述吕便与她同卧，随后她醒来并抓住他喊叫；应保留叙事所含张力，不替文本判定她此前的意识或同意状态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“看哪”作为突显突发发现的传统叙事提示语；人名按常见圣经译名作“吕便”。
