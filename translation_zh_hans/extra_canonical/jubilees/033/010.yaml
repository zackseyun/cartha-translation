- from: '他的行为极其邪恶，因为这在主面前是可憎的。因此，天上的法版上写着并已规定：人不可与父亲的妻子同寝，也不可掀开父亲的衣襟[a]，因为这是不洁的。那与父亲的妻子同寝的男人和那女人都必须处死，因为他们在地上做了不洁的事。在我们的上帝面前，他为自己拣选作国度的人民中间，不可有不洁之事。


    法版上又写了一遍：“与父亲的妻子同寝的人受诅咒，因为他露了父亲的羞耻。”愿主的所有圣者都说：“诚心所愿！诚心所愿！”


    摩西啊，你要吩咐以色列子孙谨守这话，因为这是当死的判决；这事是不洁的。那做这事的人永远无法靠赎罪得蒙赦免，除非将他处死，杀掉他，用石头打死他，把他从我们上帝的人民中铲除。


    在以色列中做这事的人，不可在地上多活一天，因为他是可憎而不洁的。他们不可说：“吕便与父亲的妾同寝以后仍得以存活，也蒙了赦免；那女人虽然已有丈夫，吕便的父亲雅各也仍然活着，她也没有被处死。”因为直到那时，条例、判决和律法还没有向众人完全显明；但在你的日子，这要成为有关各时期和各日子的律法，也要成为世世代代永远的律法。


    这律法永不期满，这罪也不得赦免；唯有把两人都从人民中铲除。他们行这事的当天，就要把他们处死。摩西啊，你要把这话写给以色列人，使他们谨守，不做这样的事，不犯导致死亡的罪，因为审判者——主我们的上帝——不徇情面，也不收受贿赂。


    你要把这条例告诉他们，使他们听从、警醒、自守，免得灭亡，从这地被铲除。因为凡在地上做这事的人，在我们的上帝面前都是不洁、污秽、玷污而腐败的。他们在地上所犯的淫乱之罪，没有比这更大的；因为以色列是归主他们上帝为圣的人民，是他产业的人民，是祭司的人民，是国度的人民，也是他栽植的人民。在圣洁的人民中间，绝不可见这样的不洁之事。


    在这个七年期的第三年，雅各和他的众子前去，住在亚伯拉罕的家中，靠近他父亲以撒和他母亲利百加。他众子的名字如下：长子吕便；西缅、利未、犹大、以萨迦和西布伦，是利亚的儿子；约瑟和便雅悯，是拉结的儿子；但和拿弗他利，是辟拉的儿子；迦得和亚设，是悉帕的儿子；还有底拿，她是利亚唯一的女儿，也是雅各的女儿。


    他们前去向以撒和利百加下拜。以撒和利百加看见他们，就为雅各和他的众子祝福。以撒看见小儿子雅各的众子，极其欢喜，便为他们祝福。'
