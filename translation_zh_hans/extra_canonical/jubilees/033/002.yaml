  text: Isaac, he and Leah his wife, on the new moon of the ninth month. And Reuben saw Bilhah,
translation:
  language: zh_hans
  text: 以撒；他和妻子利亚是在九月初一[a]去的。吕便看见了辟拉，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“九月新月升起之时”，即九月初一。
    reason: 说明古代历法表达，兼顾原文字面意象与现代读者理解。
lexical_decisions:
- source_word: ሠርቁ ለወርኀ
  choice: 月初一
  rationale: 字面涉及月亮的升起，指新月之日；现代汉语用“月初一”自然表达古代历法中的朔日。
- source_word: ሮቤን
  choice: 吕便
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: ባላን
  choice: 辟拉
  rationale: 采用现代中文圣经读者熟悉的人名译法；原文在此作宾语。
theological_decisions:
- issue: 本节开头是承接上文的句子残段
  choice: 保留“以撒”作为前句末尾，并用分号显示承接关系，同时补出汉语所需的“去的”
  alternative: 把“以撒”解释为后续代词“他”的指称，译成“以撒和他的妻子利亚”
  rationale: 原文“以撒”之后另有独立代词“他”，而利亚是雅各的妻子，不是以撒的妻子；因此该代词应承接上文的雅各。补出“去的”只是恢复跨节延续的谓语关系，不改变人物关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。由于所给经节从跨节句子的中间开始，以分号保留其承接上文的性质；末尾逗号则保留原文尚未完结的叙事张力。
