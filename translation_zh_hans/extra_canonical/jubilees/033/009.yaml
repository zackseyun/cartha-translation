  text: And Jacob did not approach her again, because Reuben had defiled her. And every man who uncovers his father's covering—his deed is very evil,
translation:
  language: zh_hans
  text: 雅各没有再亲近她，因为流便玷污了她。凡揭开父亲遮盖的人〔a〕，他所行的事极其邪恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአቀረበ ፡ እንከ
  choice: 此后……不再亲近
  rationale: 结合否定语境及英语审校层表达雅各此后不再与她同房；“亲近”既自然，也保留委婉语气。
- source_word: አርኩሳ
  choice: 玷污了
  rationale: 准确传达使人不洁、受辱的含义，并与本段性伦理语境相符。
- source_word: ይከሥት
  choice: 揭开
  rationale: 保留原文“揭露、揭开”的具体动作意象。
- source_word: ክዳነ
  choice: 遮盖之物
  rationale: 原词意为遮盖物或衣物；采用较直译的措辞，以保留其可能指向父亲之衣襟或婚床权利的含混性。
theological_decisions:
- issue: “揭开父亲遮盖之物”的具体所指
  choice: 保留身体／衣物意象，不直接释为“与父亲的妻妾同房”
  alternative: 凡与父亲的妻妾同房的人
  rationale: 原文使用“揭开父亲的遮盖”这一委婉表达；直译可保存其与乱伦禁令及父亲婚姻权利之间的神学和法律张力。
- issue: 末句对行为的评价
  choice: 他所行的极其邪恶
  alternative: 这事极其邪恶
  rationale: 将评价明确落在人的行为上，符合语境，也避免把“事”理解成纯粹抽象事件。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“吕便”依中文圣经传统译名；“亲近”作为性关系的委婉语。“遮盖之物”刻意保留原文不完全透明的习语，而不在正文中作教派化解释。
