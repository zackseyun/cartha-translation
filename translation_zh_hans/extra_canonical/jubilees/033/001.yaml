  text: And Jacob went and camped south of Migdal-edar. And he went to his father.
translation:
  language: zh_hans
  text: 雅各前行，在以得台以南扎营；又到他父亲那里去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖረ
  choice: 动身；去
  rationale: 该动词在本节两次出现，基本义为“去、前往”。首处结合后续扎营译作“动身”，次处按目的地结构译作“去见”，使现代汉语自然，同时保留动作次序。
- source_word: ወኀደረ
  choice: 扎营
  rationale: 此处表示停驻、宿营；结合地理行程语境，“扎营”比泛泛的“住下”更准确自然。
- source_word: መንገለ ፡ ደቡብ
  choice: 在……以南
  rationale: 直指相对于地名的南方位置，译为现代汉语常用的空间表达。
- source_word: መግደላደራፋፍ
  choice: 以得台
  rationale: 该地名对应传统所称 Migdal-edar，即“以得台”；采用中文圣经地名惯用形式，便于辨识。
- source_word: ኀበ ፡ አቡሁ
  choice: 去见他的父亲
  rationale: 字面为“到他父亲那里”；“去见他的父亲”符合现代汉语表达，不额外说明父亲身份或会面结果。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文两个连续动作的先后关系，以“随后”衔接，避免生硬重复“又去”。本节没有需要脚注处理的文本异读或神学歧义。
