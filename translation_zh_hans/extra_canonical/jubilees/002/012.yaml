    rationale: 原文为“所有血肉”；“活物”虽可推知，却是额外限定。修订为“所有血肉之躯”。
  - severity: low
    issue: 脚注a的说明过度指定对应对象
    rationale: 原注称“通常理解为雅各与第七日彼此对应”，可保留提示，但应更明确这只是上下文推断，正文不确定其指代。
  revised_text: '飞鸟及其各类。太阳升起，照耀它们，使它们兴盛；也照耀地上的一切、从地里萌生的一切、所有结果子的树木，以及所有血肉之躯。这三类，他在第五日造了。


    第六日，他造了地上所有的野兽、所有的牲畜，以及地上一切活动之物。此后，他造了人类；他造他们，有男有女，又赐他们权柄，管理地上和海里的一切、所有飞翔之物、野兽、牲畜、地上一切活动之物，以及全地。他赐他们权柄管理这一切。第六日，他造了这四类。全部共有二十二类。


    第六日，他完成了自己的一切工作，就是天上、地上、海中、深渊中、光明中、黑暗中和万有中的一切。他把安息日赐给我们作一个伟大的记号，使我们工作六日，在第七日停止一切工作而安息。他对我们——所有临在的天使和所有圣洁的天使，就是这两大类——说：“让我们与他一同在天上和地上安息。”


    他对我说：“看哪，我要从万民中为自己分别出一民；他们要守安息日。我要使他们成圣，归我作我的子民，也要赐福给他们。我怎样使安息日成圣，也要照样使他们成圣归我，并赐福给他们；他们要作我的子民，我要作他们的上帝。我从我所见的一切后裔中拣选了雅各的后裔，把他记下为我的长子，使他永永远远归我为圣。我要使他们知道安息日，好让他们在这日停止一切工作而安息。”


    他就这样设立一个记号，使他们在第七日与我们一同守安息，吃喝，并称颂那创造万有的主；正如他从万族中拣选一民归自己所有，赐福给他们，并使他们成圣，也使他们与我们一同守安息。他使自己的旨意上升，成为日日在他面前蒙悦纳的馨香。


    从亚当到雅各，共有二十二位人类的先祖；直到第七日，也有二十二类工作完成。这一位是蒙福而圣洁的，那一日也是蒙福而圣洁的；这一位和那一日都归于圣洁和福分。又赐给这一位，使他们世世代代蒙福、成为圣洁，按照那见证和起初的律法，正如第七日被分别为圣并蒙福一样。[a]


    他在六日之内创造了天地和他所创造的一切；上帝使第七日为圣，归于他的一切工作。因此，他为这日颁下命令：凡在这日做任何工的，必被处死；凡玷污这日的，必定被处死。


    你要吩咐以色列子孙，让他们谨守这日，使它分别为圣；不可在这日做任何工，也不可玷污它，因为它比一切日子更为神圣。凡亵渎这日的，必定被处死；凡在这日做任何工的，必定永远死亡，好让以色列子孙世世代代谨守这日，不致从那地被拔除；因为这是圣日，是蒙福之日。凡谨守这日、在这日停止自己一切工作而安息的人，都要像我们一样，世世代代成为圣洁、蒙受福分。[b]'
