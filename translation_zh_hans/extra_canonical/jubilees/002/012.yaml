    从亚当到雅各，共有二十二位人类的先祖；直到第七日，也有二十二类工作完成。这一位是蒙福而圣洁的，那一日也是蒙福而圣洁的；这一位和那一日都归于圣洁和福分。按照那见证和起初的律法，福分赐给了这一位，使他们世世代代蒙福而圣洁，正如第七日被分别为圣并蒙福一样。[a]


