  naturalness: 原稿整体庄重流畅，但“飞鸟和飞鸟的各类”“所有负责使人成圣的天使”“这一位和那一日”等表述有重复、生硬或不必要的解释性。修订后保持现代书面普通话，同时保留原文刻意的重复和代词含混。
  terminology: “安息日”“上帝”“雅各”“以色列子孙”“分别为圣”等用语适切。将“临在的天使”和“圣洁的天使”保留为类别名称，避免将其译成有关天使职责的教义性说明。“必定死亡”较“必须处死”更贴近原文死亡公式，且不擅定执行机制。
  issues:
