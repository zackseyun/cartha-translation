    rationale: 英文审校资料以[12]锚定长段落和传统节号的差异；中文应在相应处保留该锚点，而非仅在末尾使用[b]。
  revised_text: '飞鸟和它们的各类。太阳升起，照耀它们，使它们兴盛[12]；也照耀地上的一切、从地里萌生的一切、所有结果子的树木，以及一切有血肉的活物。这三类，他在第五日造了。


    第六日，他造了地上所有的野兽、所有的牲畜，以及地上一切活动之物。此后，他造了人；他造他们，有男有女，又赐给他们权柄，管理地上和海里的一切、所有飞翔之物、野兽、牲畜、地上一切活动之物，以及全地。他赐给他们权柄管理这一切。第六日，他造了这四类。全部共有二十二类。


    第六日，他完成了自己的一切工作，就是天上、地上、海中、深渊中、光明中、黑暗中和万有中的一切。他把安息日赐给我们作一个伟大的记号，使我们工作六日，在第七日歇下，停止一切工作。他对我们所有临在的天使和所有圣洁的天使——这两大类——说：“让我们与他一同在天上和地上守安息。”


    他对我说：“看哪，我要从万民中为自己分别出一族；他们要守安息日。我要使他们成圣，归我作我的子民，也要赐福给他们。我怎样使安息日成圣，也要照样使他们成圣归我，并赐福给他们；他们要作我的子民，我要作他们的上帝。我从我所看见的一切后裔中拣选了雅各的后裔，把他记作我的长子，使他永永远远分别为圣归我。我要使他们知道安息日，好让他们在这日歇下，停止一切工作。”


    他就这样设立一个记号，使他们在第七日与我们一同守安息，吃喝，并称颂那创造万有的主；正如他从万族中为自己赐福并使一族成圣，归自己所有，也使他们与我们一同守安息。他使自己的旨意上升，成为日日在他面前蒙悦纳的馨香。


    从亚当到雅各，共有二十二位人类的首领；直到第七日，造了二十二类工作。这一位是蒙福而圣洁的，这一位也是蒙福而圣洁的；这一位和这一位都归于圣洁和福分。赐给这一位，使他们日日蒙福而圣洁，正如第七日按照那见证和起初的律法被分别为圣并蒙福一样。[a]


    他在六日之内创造天地和他所创造的一切；上帝使第七日为圣，归于他的一切工作。因此，他为这日颁下命令：凡在这日做任何工的，必定死亡；凡玷污这日的，必定死亡。


    你要吩咐以色列子孙，让他们谨守这日，使它分别为圣；不可在这日做任何工，也不可玷污它，因为它比一切日子更为神圣。凡亵渎这日的，必定死亡；凡在这日做任何工的，必定死亡，直到永远；好让以色列子孙世世代代谨守这日，不致从那地被拔除；因为这是圣日，是蒙福之日。凡谨守这日、在这日歇下而停止自己一切工作的人，都要像我们一样，日日成为圣洁、蒙受福分。'
