base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/030.yaml
  text: And they shall not bring in or take out from house to house on this day[30], for it is holy and blessed more than any jubilee day of jubilees. On this one we kept sabbath in the heavens before it was made known to any flesh to keep sabbath on it upon the earth.
translation:
  language: zh_hans
  text: 这一天，他们不可从一家带东西到另一家去，因为这日是圣洁、蒙福的，胜过任何“禧年中的禧年之日”。在任何有血肉的受造物得知要在地上于这一日守安息日以前，我们已在天上于这一日守安息日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢያብኡ፡ ወኢያውፅኡ፡ እምቤት፡ ቤተ
  choice: 不可从一家搬进东西，也不可从一家搬出东西
  rationale: 保留“带入／带出”和“从房屋到房屋”的具体意象；用“搬进／搬出东西”表达此处关于安息日搬运物品的禁令，避免误解为人员出入。
- source_word: ቅድስት፡ ይእቲ፡ ወቡርክት፡ ይእቲ
  choice: 这日是圣洁、蒙福的
  rationale: 分别对应“圣洁”与“蒙福”，不把原文的并列表述改写成两个比较级。
- source_word: ዕለት፡ ኢዮቤል፡ ዘኢዮቤልውሳት
  choice: “禧年中的禧年之日”
  rationale: 按原文逐层保留“日—禧年—众禧年”的异常复合表达，不删去第一个“禧年”；引号提示这是一处语义和句法均较困难的称谓。
- source_word: አሰንበትነ
  choice: 我们……守安息日
  rationale: 采用动词表达，既保留第一人称复数，也避免添加原文没有明说的主体身份。
- source_word: ለኵሉ፡ ዘሥጋ
  choice: 任何有血肉的
  rationale: 尽量保留闪语式“凡属血肉者”的广泛称呼，同时使现代汉语可懂。
theological_decisions:
- issue: “这日是圣洁、蒙福的，胜过……”是否应译成“更圣洁、更蒙福”
  choice: 保留“是圣洁、蒙福的，胜过……”的结构
  alternative: “比任何……更圣洁、更蒙福”
  rationale: 原文先以表语陈述“圣洁、蒙福”，随后出现比较成分；当前译法保留这种略显不寻常的关系，不将比较范围无声地同时分配给两个形容词。
- issue: “禧年中的禧年之日”所指为何
  choice: 直译并加注说明其困难
  alternative: 解释为“最高的节期”或泛化为“任何禧年之日”
  rationale: 原文措辞罕见，可能是在强调每周安息日高于最隆重的节期循环，但这一解释并非唯一可能，不宜写入正文。
- issue: 天上先守安息日与地上启示的时序
  choice: 译为“早已……那时还没有晓谕……”
  alternative: 弱化为一般性的“在天上守安息日”
  rationale: 保留原文明确的先后关系，同时不进一步推演守安息日者的身份或相关教义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“晓谕”保留启示、公布之意；“有血肉的”略带经文语体，以对应原文的概括性称呼。所给吉兹语开头“ዕለት፡ ገብረ፡ ውስተ፡ ማኅደሪሆሙ።”看似属于前一分句或由章节切分带入的残句，英语审校层亦未将其列入本节正文，因此本稿从完整的新句“他们不可搬进或搬出……”起译。
