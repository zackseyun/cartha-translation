  text: And the waters did so, just as he told them, and they withdrew from the face of the earth.
translation:
  language: zh_hans
  text: 众水照着他对它们所说的那样做了，并从地面上退去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“从地的表面之上退去”。所给原文片段末尾另有一个可意为“进入／在……之内”的词，但未见其宾语；因此正文不补出退去的终点。
    reason: 说明复合空间短语的较直译表达，并交代所给源文片段末尾悬空词语，避免把未明示的地点加入正文。
lexical_decisions:
- source_word: ማያት
  choice: 众水
  rationale: 该词是“水”的复数形式；译作“众水”既保留复数意象，也符合庄重的创造叙事语体。
- source_word: በከመ፡ ይቤሎሙ
  choice: 照他所吩咐的
  rationale: 字面义接近“照他对它们所说的”；汉语以“所吩咐的”自然表达众水遵从神命令的含义。
- source_word: ወተገብሡ
  choice: 退去
  rationale: 表达水从原先覆盖之处撤退、退离的动作；不增添源文残片中未明示的目的地。
- source_word: እምዲበ፡ ገጸ፡ ለምድር
  choice: 从地面上
  rationale: 复合介词与“地的面”共同表示从地表之上离开；“地面”是现代汉语自然且准确的表达。
theological_decisions:
- issue: 众水对神话语的回应
  choice: 照他所吩咐的做了
  alternative: 照他对它们所说的做了
  rationale: 保留受造界顺服命令的叙事含义，同时避免将其扩展成源文没有明说的神学解释。
- issue: 水退去的终点
  choice: 不补出目的地
  alternative: 补作“退入……中”
  rationale: 所给吉兹语文本末尾虽有“ውስተ”（进入、在……之内），却没有随后的明确宾语，且经校订的英文咨询层也删去了悬空的“into”；因此正文不臆补终点。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“众水”保留原文复数和经书语感；其余句法按现代普通话调整，避免生硬直译。
