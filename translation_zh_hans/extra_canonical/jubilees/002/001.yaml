    text: “给万有的记号”：原文末尾的对象为概括性的“所有／一切”，未明确限于人类或某一群体。
    reason: 标示末句对象的开放性，并说明未采用“众人”的原因。
  revision_rationale: 修订集中处理两处语义问题：以“临在的天使”更贴近原称号，以“给万有的记号”保留末尾“为所有”的广泛且未限定对象；同时将不甚自然的“奉……的话”调整为“奉……之命”。其余创造与安息日用语均维持原稿的忠实、庄重表达。
