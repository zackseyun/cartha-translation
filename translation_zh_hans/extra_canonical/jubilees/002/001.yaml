base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/001.yaml
  text: 'And the angel of the presence said to Moses by the word of the LORD, saying, "Write the whole account of creation: how in six days the LORD God finished all his works and all that he created, and he rested on the seventh day and sanctified it for all ages, and appointed it as a sign for all."'
translation:
  language: zh_hans
  text: 临在的天使奉耶和华之命对摩西说：“你要把创造的全部经过写下来：耶和华上帝怎样在六日之内完成了他一切的工作和所创造的一切，又怎样在第七日安息，将这日分别为圣，直到万世，并立这日为给万有的记号。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ፡
  choice: 侍立天使
  rationale: 字面涉及“面前／临在的天使”，指侍立在上帝面前的天使；译作“侍立天使”较符合现代汉语，又保留其身份含义。
- source_word: በቃለ፡ እግዚአብሔር፡
  choice: 奉耶和华的话
  rationale: 保留“借着／按着耶和华的话”的委任意味，避免误解为天使仅仅逐字复述。
- source_word: ኵሎ፡ ነገረ፡ ፍጥረት፡
  choice: 创造的全部经过
  rationale: 兼顾“全部”与“事情、记述”的语义，比“创造的一切话”更自然清楚。
- source_word: አዕረፈ፡
  choice: 安息
  rationale: 保留创造叙事中的传统神学用语及与安息日观念的联系。
- source_word: ቀደሳ፡
  choice: 将这日分别为圣
  rationale: 准确表达使之成为圣、划归神圣用途的含义；补出“这日”以符合汉语指代。
- source_word: ለኵሉ፡ ዓለማት፡
  choice: 直到万世
  rationale: 原文可指所有世代或永世；“直到万世”保留时间上的延续性并具有庄重文体。
- source_word: ትእምርተ፡ ለኵሉ፡
  choice: 众人的记号
  rationale: 末尾“为所有／众者”对象较概括；译作“众人的”自然，同时不擅自补成“他一切的工作”。
theological_decisions:
- issue: “侍立天使”的身份表达
  choice: 侍立天使
  alternative: 临在天使／面前的天使
  rationale: “侍立”传达其在上帝面前供职的身份，不把该称号解释为某个特定神学体系中的专名。
- issue: 第七日成为谁的记号
  choice: 众人的记号
  alternative: 万有的记号／一切受造物的记号
  rationale: 原文结尾只有概括性的“为所有”，对象并未进一步限定；采用“众人”但不补入“受造物”或“他的工作”等解释性成分。
- issue: 上帝的“安息”
  choice: 安息
  alternative: 歇了工
  rationale: “安息”忠实保留原文动作及其礼仪神学张力，不解释为疲倦后的休息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“耶和华上帝”“安息”“分别为圣”等具有经文互文性的表达。引语结构略作汉语化处理，以避免“说……说”造成生硬重复。
