  yaml_path: translation/extra_canonical/jubilees/002/008.yaml
  text: And on the fourth day he made the sun and the moon and the stars, and set them in the firmament of heaven so that they might give light upon all the earth and rule it,
translation:
  language: zh_hans
  text: 第四日，他造了太阳、月亮和众星，把它们安置在天穹中，使它们照耀全地，并管理大地，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምጽናዓተ፡ ሰማይ
  choice: 天穹
  rationale: 该词组指坚固展开的天空，与《创世记》创造叙事的背景相合；“天穹”既保留古代宇宙观的意象，又比“穹苍”更便于现代普通读者理解。
- source_word: ያብርሁ
  choice: 照耀
  rationale: 原词表示发光、照明；“照耀全地”自然且保留其使役目的。
- source_word: ለኰንኖ
  choice: 管理大地
  rationale: 该形式表达统管、治理之意，并带有指向大地的代词成分；译出“大地”可在汉语中明确宾语，同时不额外规定三者各自的治理范围。
theological_decisions:
- issue: 日月星辰对大地的权柄应译为“管理”还是“统治”
  choice: 管理大地
  alternative: 统治大地
  rationale: 原文确有治理、支配的含义；“管理”能保留受造光体所承担的职能，同时避免在现代汉语中产生不必要的政治化色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留本节作为延续句的末尾逗号，以对应所给原文和审校层中尚未完结的句法；主语“他”承接上文的上帝。
