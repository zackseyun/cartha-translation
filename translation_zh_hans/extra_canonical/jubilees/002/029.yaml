base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/029.yaml
  text: 'Likewise declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day.'
translation:
  language: zh_hans
  text: 在这日离开一切工作的人，必永远圣洁、蒙福。照样，你要把这日的条例宣告并告诉以色列子孙：他们要在这日守安息日，不可因心里迷误而弃守这日；不可在这日做任何不合宜的工，不可随自己的心意行事，也不可在这日预备任何吃喝之物或打水；也不可把任何担子从他们的城门运进或运出，就是他们没有在第六日为自己预备好的担子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከማሁ
  choice: 照样
  rationale: 该词表示“同样、照样、如此”，保留它与上文之间的承接关系，不弱化为单纯的“并且”。
- source_word: ዘዝነ፡ ለዛቲ፡ ዕለት
  choice: 这日的条例
  rationale: 语境是在颁示安息日应遵行的规范；“条例”比泛指性的“律法”更自然地表达针对这一日的规定。
- source_word: ወያሰንብቱ፡ ባቲ
  choice: 他们要在这日守安息日
  rationale: 动词具有停止劳作、守安息日之意；此处结合上下文译出礼仪性含义。
- source_word: በስሕተት፡ ልቦሙ
  choice: 因心里迷误
  rationale: 直译保留“心”与“错误、迷失”的组合，未擅自解释为故意悖逆或无知。
- source_word: ባቲ፡ ፈቃዶሙ
  choice: 在这日……随自己的心意行事
  rationale: ፈቃድ 可指意愿、喜好；译文保留其广度，与“自己的乐趣”这一较窄译法相比不预先限定性质。
- source_word: ዘይጸውር
  choice: 任何担子
  rationale: 该词指被搬运、负载之物；“担子”既贴近原义，也与经门运进运出的语境相称。
- source_word: በሰዱስ
  choice: 在第六日
  rationale: 原文明确指“第六”，按创世周次语境译为“第六日”，不擅自增补“住处”等源文没有的成分。
theological_decisions:
- issue: 安息日禁令中“自己的心意”的范围
  choice: 不可随自己的心意行事
  alternative: 不可寻求自己的乐趣
  rationale: 原词可以涵盖意愿或喜好；采用较宽的表达，保留禁令的张力，不将其限定为娱乐活动。
- issue: 开头关于圣洁和蒙福的陈述
  choice: 译入正文，并按其作为承接上文的句尾来处理
  alternative: 依照英语咨询层将其省略
  rationale: 所给吉兹语源文包含“在这日、离开一切工作、圣洁、蒙福、一生”等内容；源文证据优先，因此不可仅因英语咨询文本省略而删去。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以色列子孙”“守安息日”“第六日”等保留经书语体；句法则拆分为现代读者易于理解的连续禁令。开头在吉兹语中显然承接上一节，中文据其语义补足为自然句，但没有加入“在住处”等异文内容。
