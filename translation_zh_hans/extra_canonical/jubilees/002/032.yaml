  text: on it upon the earth. And the Creator of all blessed it, he who created this day for blessing and holiness.
translation:
  language: zh_hans
  text: ——在它上面，在地上。万有的创造者赐福给它；他创造这一天，是为着福分和圣洁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万有的创造者赐福给他所创造的这一天，是为着福分和圣洁。”开头是承接上文的残句，直译为“在它上面，在地上”；“它”的具体所指须由上下文确定。
    reason: 保留代词宾语与后随关系从句之间可能的句法关联，并说明开头残句及末尾“为着福分和圣洁”的含混性。
lexical_decisions:
- source_word: ባቲ፡ በዲበ፡ ምድር
  choice: 在地上遵守它
  rationale: 此句承接上文；ባቲ 指向阴性单数先行词，结合上下文可自然译为“遵守它”，而 በዲበ ምድር 为“在地上”。
- source_word: ፈጣሪ፡ ኵሉ
  choice: 创造万有的主
  rationale: 直译为“万有的创造者”；中文以“创造万有的主”庄重自然，并保留其称号性质。
- source_word: ወባረካ
  choice: 赐福给它
  rationale: 保留动词的代词宾语，不将其与后面的关系从句合并。
- source_word: ዛተ፡ ዕለተ
  choice: 这一天
  rationale: 按指示词与“日”的组合直译。
- source_word: ለበረከት፡ ወለቅድሳት
  choice: 使它蒙福并成为圣日
  rationale: 介词短语字面为“为着福分和圣洁”；在现代汉语中以目的表达呈现，同时保留“福分/圣洁”两重概念。
theological_decisions:
- issue: “赐福”的宾语与后续关系从句的关系
  choice: 将“它”保留为独立宾语，再以分号引出“他创造了这一天”
  alternative: 译作“赐福给他所创造、为要蒙福并成为圣日的这一天”
  rationale: 吉兹文先出现代词宾语，随后才有关系从句；主译尽量保存这种句法张力，不把两者无标记地合并。
- issue: 末尾介词短语表达结果、目的或属性
  choice: 按目的理解为“使它蒙福并成为圣日”
  alternative: 译作“为着福分和圣洁”
  rationale: ל/ለ 类介词结构可表达目的或归属；主译采用自然的目的表达，脚注保留更贴近形式且较含混的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。开头按其承接上文的残句性质处理；用“遵守”补出上下文隐含的动作，使中文可读，同时不在本节内擅自补入具体主语。
