  text: This was the work that he did on the second day. And on the third day he commanded the waters to pass away from before the face of the whole earth into one place, and the dry land to appear.
translation:
  language: zh_hans
  text: 这就是他在第二日所做的工。第三日[a]，他吩咐众水从全地表面退到一处，并使旱地显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本版吉兹文本在“第三日”之后以方括号补出“他照着所说的做了”。若采纳此补文，可译作：“第三日，他照着所说的做了；他吩咐众水……”。
    reason: 标明原文版本中的编辑性补文，并保留主文本未采纳该补文时的读法。
lexical_decisions:
- source_word: ገብረ
  choice: 做／所做的工
  rationale: 该词在本节开头重复出现，兼有“做、造作”之意；按汉语搭配分别译作“所做的工”和“做了”，既保留重复，又使行文自然。
- source_word: ማያት
  choice: 众水
  rationale: 原文为“水”的复数形式；“众水”能简洁保留复数及创世叙事的庄重语域。
- source_word: ይኅለፉ
  choice: 要……退去
  rationale: 原词表达第三人称复数的命令或祈使语气；用“要……退去”保留上帝对众水发令的语气，不将其弱化为单纯叙述。
- source_word: እምቅድመ ገጸ ለኵላ ምድር
  choice: 从全地表面
  rationale: 原文近于“从全地的面前”；“全地表面”在现代汉语中自然，并保留空间图景。
- source_word: ውስተ መካን አሐዱ
  choice: 汇聚到一处
  rationale: 原文直指进入“一个地方”；结合“众水退去”的动作，译作“汇聚到一处”清楚表达其去向。
- source_word: የብስ
  choice: 旱地
  rationale: 对应与水相对、显露出来的干燥陆地；“旱地”延续创世叙事常用而易懂的表达。
theological_decisions:
- issue: 上帝话语与受造界行动的关系
  choice: 采用直接引语：“他对众水说……”
  alternative: 意译为“他命令众水……并命令旱地……”
  rationale: 原文保留“说”这一言语行为，并以命令式内容承接；直引可避免把“旱地显露”另行解释成第二个独立命令，也更贴近源文结构。
- issue: “旱地显露”中的施事关系
  choice: 译作“让旱地显露出来”
  alternative: 译作“旱地要显露出来”
  rationale: 原文形式表达意愿或命令语气，但并未说明旱地靠自身行动还是因众水退去而显露；“让……显露出来”保留这一命令语气及因果张力，不额外指定施事者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“所做的工”呼应创造叙事，“众水”“旱地”保持经文语感；直接引语忠实呈现吉兹文的“说”及其后的命令语气。
