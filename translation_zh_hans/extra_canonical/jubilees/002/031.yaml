  yaml_path: translation/extra_canonical/jubilees/002/031.yaml
  text: And the Creator of all blessed it[31], but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he granted to eat and drink and keep sabbath on it upon the earth.
translation:
  language: zh_hans
  text: 万物的创造主赐福了这日[a]，却没有使各族各民分别为圣，以在这日守安息日；唯有以色列——他只准许他们在地上吃喝，并在这日守安息日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“赐福了它”；“它”指上下文中的安息日。原文对照说，创造主赐福这日，却没有使各族各民分别为圣、在这日守安息日；唯有以色列得到在地上吃喝并守这日的准许。
    reason: cross_reference
lexical_decisions:
- source_word: ባረከ
  choice: 赐福
  rationale: 直译其祝福、赐福之义；宾语依上下文为安息日。
- source_word: አቀደሰ
  choice: 使……成圣
  rationale: 保留使人成为圣、分别为圣的使役含义，不弱化为单纯的“指定”。
- source_word: ሕዝበ፡ ወአሕዛበ
  choice: 各族各民
  rationale: 自然表达两个群体名词并列所涵盖的万民范围。
- source_word: ለአሰንብቶ
  choice: 守安息日
  rationale: 以现代汉语惯用表达传达遵守安息日、停止常务的含义。
- source_word: ወሀበ
  choice: 赐给
  rationale: 在后接动词的结构中表达授予以色列这一特权，避免误读为仅仅供应食物。
- source_word: ይብላዕ፡ ወይስተይ
  choice: 吃喝
  rationale: 简洁保留两个并列动作，且符合安息日享用饮食的语境。
- source_word: ምድር
  choice: 在地上
  rationale: 抄本分节使该词出现在句首，但语义和英译审校传统均表明它承接本节末尾，限定以色列在地上的安息日礼仪。
theological_decisions:
- issue: 安息日成圣与以色列蒙拣选的关系
  choice: 明确区分“这日蒙赐福”与“以色列被分别为圣而守这日”
  alternative: 将其泛化为万民都被召守安息日
  rationale: 原文以否定句排除各族各民，继而用“唯有以色列”加以限制；译文保留这一圣时中的拣选主张，不作体系化调和。
- issue: 吃喝与守安息日是否同属所赐特权
  choice: 将三项动作并列，均视为赐给以色列的活动
  alternative: 把“赐给”理解为单纯赐下食物饮料
  rationale: 原文“赐给”后接吃、喝、守安息日，句法更自然地表示授予实行这些事的权利或特恩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“各族各民”“唯有以色列”保留原文鲜明的对照；破折号呈现原句对“唯有以色列”的强调。
