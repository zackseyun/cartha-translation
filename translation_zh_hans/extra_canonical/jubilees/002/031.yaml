  to: 万物的创造主赐福了这日[a]，却没有使各族各民分别为圣，以在这日守安息日；唯有以色列——他只准许他们在地上吃喝，并在这日守安息日。
  rationale: 修订仅消除“赐给……吃喝”可能造成的供应饮食之误解，并以“分别为圣”及目的性连接更准确呈现原文。保留原文对以色列的排他性限定，也不把“吃喝”具体化为任何未明说的礼仪内容。
