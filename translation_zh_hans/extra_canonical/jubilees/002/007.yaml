- from: 水聚在这穹苍以外的一处，旱地就显露出来。那一天，他为旱地造了所有的海，使各海分别汇聚；又造了所有的河流、山中和全地各处汇聚的水、所有的湖泊、地上的一切露水、可供播种的种子、一切萌生之物、结果子的树木、林木，以及设在伊甸、供人享乐的伊甸园。第三日，他造了这一切——四大类。[a]
  to: 在这穹苍以外的一处，旱地显露出来。那一天，他为旱地造了所有的海，照着各自的汇聚处；又造了所有的河流、山中和全地的水的汇聚处、所有的湖泊、地上的一切露水、可供播种的种子、一切萌生之物、结果子的树木、林木，以及在伊甸、为乐趣而设的伊甸园。第三日，他造了这一切——四大类。[a]
