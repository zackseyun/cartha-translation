  text: one place outside this firmament[7], and the dry land appeared. And on that day he created for it all the seas according to their separate gatherings, and all the rivers and the gatherings of the waters in the mountains and in all the earth, and all the lakes and all the dew of the earth, and the seed that is sown, and everything that sprouts, and fruit-bearing trees, and woods, and the Garden of Eden in Eden for delight, and all these four great kinds he made on the third day.
translation:
  language: zh_hans
  text: 在这穹苍以外的一处，旱地显露出来。那一天，他为旱地造了所有的海，照着各自的汇聚处；又造了所有的河流、山中和全地的水的汇聚处、所有的湖泊、地上的一切露水、可供播种的种子、一切萌生之物、结果子的树木、林木，以及在伊甸、为乐趣而设的伊甸园。第三日，他造了这一切——四大类。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一切——四大类”原文含义较难确定。本节把地貌、水体、植物和伊甸园压缩在同一清单中；“四”很可能概括若干组类别，并非逐项计数。
    reason: segmentation_note
lexical_decisions:
- source_word: ጽናዓት
  choice: 穹苍
  rationale: 该词在创造叙事中指坚固展开的天穹；“穹苍”既保留古代宇宙观色彩，又是现代中文圣经语境中易懂的表达。
- source_word: የብስ
  choice: 旱地
  rationale: 对应与聚集之水相对、显露出来的干燥陆地；“旱地”比泛称“陆地”更贴近词义。
- source_word: አብህርተ
  choice: 海
  rationale: 按复数处理为“所有的海”，与其后各自分别汇聚的描述相合。
- source_word: ምጉባኢሆሙ ለማያት
  choice: 汇聚的水
  rationale: 保留“水的聚集处／聚集起来的水”这一表述，不将其过度具体化为泉源或水库。
- source_word: ምዕቃባተ
  choice: 湖泊
  rationale: 在水体清单中宜译为封闭或蓄积的水域；采用自然且范围适中的“湖泊”。
- source_word: አማተ
  choice: 林木
  rationale: 该词位于结果子的树木与伊甸园之间，指树林或森林；译作“林木”既避免遗漏，也与前项区分。
- source_word: ተድላ
  choice: 享乐
  rationale: 表达愉悦、欢欣或乐趣；“供人享乐”自然传达园子的用途，但不额外限定享乐者身份以外的神学含义。
- source_word: አርባዕተ ዘንተ ዐበይተ ትውልደ
  choice: 这一切——四大类
  rationale: 原文数词“四”与压缩式清单之间关系不够明晰；用破折号保留其总结性和语法张力，不擅自重分每一类别。
theological_decisions:
- issue: 伊甸园与伊甸的关系
  choice: 设在伊甸、供人享乐的伊甸园
  alternative: 供享乐的伊甸乐园
  rationale: 原文重复“伊甸园／在伊甸”，因此保留地点与园子名称的区别，不把二者合并。
- issue: “四大类”具体指哪些受造物
  choice: 不在正文中列明四类，只保留概括语
  alternative: 按水体、植物、林木和伊甸园等方式明确分组
  rationale: 原文清单混合地貌、水体、植物和伊甸园，具体四分法并不确定；明列类别会替原文消除真实歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。保留“穹苍”“旱地”“伊甸园”等创造叙事中的传统核心用语，同时用“分别汇聚”“萌生之物”“林木”等自然现代汉语串联长清单。以分号和破折号梳理原文密集并列结构，但不消除末句“四大类”的歧义。
