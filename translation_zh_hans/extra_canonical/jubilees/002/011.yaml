  text: And on the fifth day he created the great sea monsters in the depths of the waters, for these were the first fleshly beings made by his hands, and every moving thing that moves in the waters, and everything that flies—
translation:
  language: zh_hans
  text: 第五日，他在水的深处创造了巨大的海兽，因为这些是他亲手造出的最先有血肉的生灵；又创造了水中一切游动之物和一切飞翔之物——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አናብርት፡ ዐበይተ
  choice: 巨大的海兽
  rationale: “አናብርት”可泛指大型猛兽；在水域创造的语境中译为“海兽”，既体现其巨大、可畏的形象，也避免采用带有神话定论色彩的“海怪”。
- source_word: ማእከለ፡ ቀላያተ፡ ማያት
  choice: 在水的深处
  rationale: 该短语字面涉及水域或水池的内部、中央；依上下文用自然汉语表达为“水的深处”。
- source_word: በአደዊሁ
  choice: 亲手造出
  rationale: 保留“由他的双手”这一拟人化创造表述；“亲手”在现代汉语中自然且突出直接创造。
- source_word: ዘሥጋ፡ ኖዓተ
  choice: 血肉生灵
  rationale: 原文结合“肉身/血肉”与“活动之物”；译作“血肉生灵”兼顾其有肉身且具生命活动的含义。
- source_word: ይትነወስ፡ ውስተ፡ ማያት
  choice: 水中一切游动之物
  rationale: 动词基本义为移动；因对象位于水中，以“游动”表达更符合现代汉语，但不进一步限定具体物种。
- source_word: ይሰርር
  choice: 飞翔
  rationale: 直接表达飞行活动，保留原文对所有飞翔之物的概括。
theological_decisions:
- issue: “第一”所修饰的受造物范围
  choice: 第一批血肉生灵
  alternative: 最先由他亲手造出的血肉之物
  rationale: 原文将这些水中巨兽称为首先受造的肉身活动者。译文保留这一陈述，不将其扩展解释为一切生命或所有受造物中绝对最早者。
- issue: 拟人化的“他的手”
  choice: 保留为“亲手”
  alternative: 由他创造
  rationale: 不把原文具体的拟人表达抽象化，以保留其强调上帝直接施行创造的修辞力量，同时不据此推导形体性的教义结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“海兽”比“海怪”中性，更适合原文语境；分号和后续短句使长串并列关系清楚。末尾破折号保留本节向下一节延续的未完结构。
