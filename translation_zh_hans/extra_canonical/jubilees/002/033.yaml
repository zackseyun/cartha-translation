  text: and for glory above all days. This law and testimony was given to the children of Israel as an everlasting law throughout their generations.
translation:
  language: zh_hans
  text: 并且在一切日子之上得享荣耀。这律法和见证赐给了以色列子孙，作为世世代代永远的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለስብሐት
  choice: 得享荣耀
  rationale: 保留前缀介词“为、归于”的目的或归属意味，同时用自然汉语表达本句承接上文的功能。
- source_word: እምኵሉ መዋዕል
  choice: 在一切日子之上
  rationale: 较直译地保留比较结构，不将其弱化为单纯的“在所有日子中”。
- source_word: ሕግ ወስምዕ
  choice: 律法和见证
  rationale: 分别对应“律法”与“见证”，保留并列及其宗教法律语域。
- source_word: ለደቂቀ እስራኤል
  choice: 给了以色列子孙
  rationale: 按原文受事结构翻译；“以色列子孙”兼顾传统表达与现代可懂度。
- source_word: ሕገ ዘለዓለም
  choice: 永远的律法
  rationale: 直接保留永久有效的时间含义，不另行解释其神学范围。
- source_word: ለትውልዶሙ
  choice: 世世代代
  rationale: 以自然汉语表达“贯穿他们各代”的持续性。
theological_decisions:
- issue: “律法和见证”是一个复合概念还是两个并列概念
  choice: 保留“律法和见证”的并列形式
  alternative: 译作“作为见证的律法”
  rationale: 原文以并列连接词连接两个名词，宜保留形式与可能的语义张力。
- issue: 永远性与世代范围的关系
  choice: 译作“作为世世代代永远的律法”
  alternative: 译作“作为他们历代遵守的永久条例”
  rationale: 不添加“遵守”或“条例”等原文未明说的内容，并保留“永远”与“世代”两个时间表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；本节开头明显承接上一节，因此保留“并且”。“在一切日子之上得享荣耀”略带源语结构，以保存其比较和目的意味。
