base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/002.yaml
  text: 'For on the first day he created the heavens above and the earth and the waters and all the spirits that minister before him: the angels of the presence[2], and the angels of sanctification, and the angels of the spirit of fire, and the angels of the spirit of clouds, and of darkness, and of snow and hail and frost, and the angels of the voices and thunder and lightning, and the angels of the spirits of cold and heat and winter and spring and harvest and summer, and all the spirits of his works that are in the heavens and on the earth and in the seas and in the depths and in darkness and in night and in light and in dawn and in morning, which he prepared in the knowledge of his heart.'
translation:
  language: zh_hans
  text: 因为在第一日，他创造了上面的诸天、地和众水，也创造了在他面前奉差遣的一切灵：临在的天使[a]、圣洁的天使、火之灵的天使，以及云之灵、黑暗之灵、雪、冰雹和霜之灵的天使；声音、雷鸣和闪电的天使；寒冷、炎热、冬季、春季、收获季和夏季之灵的天使；还有他的作为的一切灵，就是那些在诸天、地上、海中、地底[b]、深渊、黑暗、夜里[c]、光明、黎明和早晨之中的灵。这一切都是他按自己心中的知识预备的。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节关于天使和自然之灵的目录在吉兹文本中十分紧密，部分并列关系可能反映了文本传承中的压缩或讹变；译文尽量依原有次序保留其结构，不作过度梳理。
    reason: segmentation_note
  - marker: b
    text: “地底”所据词语在本版吉兹文本中置于括号内，表明其文本地位不如周围文字确定。
    reason: textual_variant
  - marker: c
    text: “夜里”所据词语在本版吉兹文本中置于括号内；有些传本或译本未收此词。
    reason: textual_variant
  - marker: d
    text: “心中的知识”也可理解为“心中的认识”或“心中的智慧”，但原词并非通常表示“旨意”的词。
    reason: lexical_note
lexical_decisions:
- source_word: መላእክተ ገጽ
  choice: 侍立在他面前的天使
  rationale: 字面为“面前／临在的天使”。此处用自然汉语表达其在神面前侍立的含义，同时不将其处理成特定宗派的天使阶级名称。
- source_word: ይትለአክ ቅድሜሁ
  choice: 在他面前奉差遣
  rationale: 保留动词“受差遣、服役”的主动意象，比单纯译作“事奉”更贴近原文。
- source_word: መናፍስተ ለቍር ወለመዐት
  choice: 寒冷、炎热……之灵
  rationale: 按目录式并列结构译出自然力量之灵，不把“灵”弱化为抽象的天气现象。
- source_word: ማእረር
  choice: 收获季
  rationale: 该词在季节目录中与收割／收获时节相关；以“收获季”保留农业季节含义，并避免强行等同现代四季中的“秋季”。
- source_word: በአእምሮ ልቡ
  choice: 按自己心中的知识
  rationale: አእምሮ 的基本义为“知识、认识、理解”；采用“知识”以贴近词义，不改释为“旨意”或“计划”。
theological_decisions:
- issue: 天使与自然界诸灵之间的关系
  choice: 保持原文反复出现的“天使”和“灵”及其压缩式并列
  alternative: 把全段顺畅改写为各种自然现象均由天使掌管
  rationale: 原文目录的句法紧密且部分关系含混；不额外建立天使等级或明确的自然管辖体系。
- issue: “侍立在他面前的天使”的身份
  choice: 使用描述性称谓
  alternative: 采用某一传统中的专门阶级名称，如“临在天使”
  rationale: 原文可指在神面前的天使，但没有必要导入后世体系化的天使论术语。
- issue: 末句“心中的知识”
  choice: 保留知识性表述
  alternative: 译为“照他心中的旨意／计划”
  rationale: “旨意”虽较流畅，却会把原文的“知识、理解”解释成目的论概念，削弱原有神学张力。
translation_notes:
  register: 采用庄重而现代的叙述语体。长串目录以分号分层，帮助普通读者把握结构，同时保留原文重复、密集而略有含混的天使—自然之灵目录；避免古奥的四字堆叠和宗派化天使术语。
