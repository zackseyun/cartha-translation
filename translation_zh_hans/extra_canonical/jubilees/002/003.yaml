  text: And then we saw his works, and we blessed him and offered praise before him on account of all his works, because
translation:
  language: zh_hans
  text: 那时，我们看见了他的作为，就称颂他，并在他面前，因他一切的作为献上赞美[a]，因为——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他面前赞美他”。
    reason: 原文的“赞美”后接“在他面前”，可理解为在神面前献上赞美；在汉语中也可顺畅地表达为以他为直接对象的“赞美他”。正文保留原文的地点性表达。
lexical_decisions:
- source_word: ምግባሮ (məgbāro)
  choice: 他的作为
  rationale: 该词可指行为、工作或所成就之事；在创造语境中译作“作为”自然庄重，也保留较广的语义范围。
- source_word: ባረክናሁ (bārraknāhu)
  choice: 我们……称颂他
  rationale: 动词本义为祝福、称颂；以神为受词时，现代汉语用“称颂”可避免让人误解为人向神赐福。
- source_word: ሰብሕነ (sabbaḥna)
  choice: 献上赞美
  rationale: 表达“赞美、颂赞”；结合后接“在他面前”，译作“献上赞美”比机械添加受词“他”更自然。
- source_word: ቅድሜሁ (qədmēhu)
  choice: 在他面前
  rationale: 按其空间及礼仪性含义直译，保留天上众者在神面前颂赞的场景。
- source_word: እስመ (ʾəsma)
  choice: 因为——
  rationale: 原文以因果连词结束，本句在所给章节切分中未完；用破折号提示语意延续，而不擅自补足原因。
theological_decisions:
- issue: 人是否能“祝福”神
  choice: 称颂他
  alternative: 祝福他
  rationale: 源词确实可译“祝福”，但在现代汉语中“祝福神”易被理解为向神施予福分；“称颂”保留此处由受造者颂扬神的意义，不引入特定宗派解释。
- issue: 赞美动词是否以神为直接受词
  choice: 在他面前献上赞美
  alternative: 在他面前赞美他
  rationale: 原文动词后明确有“在他面前”，但没有另见一个独立的宾语代词；正文保留这种句法关系，脚注说明也可理解为直接赞美他。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那时”衔接前文；末尾保留未完的“因为”，并以破折号显示原文在本节切分处继续。脚注标记已置于正文相应位置。
