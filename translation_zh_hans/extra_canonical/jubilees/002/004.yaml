  yaml_path: translation/extra_canonical/jubilees/002/004.yaml
  text: 'He made seven great works on the first day. And on the second day he made the firmament in the midst of the waters, and the waters were divided on that day: half of them went up above, and half of them went down beneath the firmament that is in the midst, over the face of the whole earth. And this alone he made.'
translation:
  language: zh_hans
  text: 第一天，他完成了七项伟大的工作。第二天，他在众水中间造了穹苍；就在那一天，众水分开了：一半升到上方，另一半降到位于中间、在全地表面之上的穹苍以下。[a]这一天，他只造了这一项。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一半降到穹苍以下；这穹苍位于中间，在全地表面之上。”
    reason: 原文后半句中“中间”及“在全地表面之上”与“穹苍以下”的句法连接可有不同断分；正文将二者理解为修饰“穹苍”。
  - marker: b
    text: 原文也可较直译为：“而只有这个。”
    reason: 原文末句省略动词；正文根据上下文补出“造了”。
lexical_decisions:
- source_word: ሰብዐተ፡ ግብረ፡ ዐበይተ
  choice: 七件大工
  rationale: 保留“七”“工/作为”“大”的基本语义，并用现代汉语量词“件”使表达自然。
- source_word: ምጽናዓት
  choice: 穹苍
  rationale: 该词在创世叙事中指处于众水之间、将水分开的坚固空间；“穹苍”既承接传统经文用语，也能保持古代宇宙观意象。
- source_word: ማእከለ፡ ማይ
  choice: 在众水中间
  rationale: 直译其空间关系，不将“水”窄化为某一种具体水域。
- source_word: መንፈቆሙ
  choice: 一半
  rationale: 准确表达两部分各占一半的分配。
- source_word: ዲበ፡ ገጸ፡ ለኵሉ፡ ምድር
  choice: 覆盖全地之上
  rationale: “在全地表面之上”若逐词照译较生硬；此译保留穹苍位于全地上方的空间图景。
- source_word: ወዘንተ፡ ባሕቲቶ
  choice: 这一天，他只造了这一件
  rationale: 原文末句字面简略，意为“而只有这个”；依上下文补出主语、动词和时间，使现代汉语完整，同时不增加新的创造项目。
theological_decisions:
- issue: “穹苍”的宇宙论意象
  choice: 保留“穹苍”
  alternative: 天空／苍穹
  rationale: “穹苍”较能保存原词所含的坚固、分隔众水之物的意象；不以现代自然科学概念改写古代文本。
- issue: 末句省略成分
  choice: 译为“这一天，他只造了这一件”
  alternative: “而只有这个”／“他只造了这一件”
  rationale: 原文存在省略；结合第二日的叙述补足“这一天”和“造”，清楚表达该日只有这一项工程，同时以脚注保留更贴近字面的可能。
- issue: “中间”所修饰的成分
  choice: 理解为穹苍位于中间
  alternative: 将其与“在全地表面之上”连读
  rationale: 语序允许一定句法歧义；正文采用较顺畅且与前文“众水中间”呼应的理解，脚注保存另一种切分。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“穹苍”等具有经文传统和古代宇宙图景的词语；避免文言化虚词。以分号、冒号呈现原文的叙事层次，并把较难在正文中自然保留的句法歧义收入脚注。
