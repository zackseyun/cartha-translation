  yaml_path: translation/extra_canonical/jubilees/002/009.yaml
  text: over day and night and to separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.
translation:
  language: zh_hans
  text: 掌管昼夜，并把光和黑暗分开。上帝设立太阳，作为地上的大记号，用来标示日子、安息日、月份、节期、年份、安息年、禧年，以及一切时节。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለፈሊጥ፡ ማዕከለ፡ ብርሃን፡ ወጽልመት
  choice: 把光暗分开
  rationale: 按字面保留“分开光与黑暗”的动作，并以自然现代汉语表达。
- source_word: ለትእምርት፡ ዐቢይ
  choice: 大记号
  rationale: 保留原文“重大/伟大的记号”这一具体说法，不弱化为单纯计时工具。
- source_word: ለሰንበታት
  choice: 安息日
  rationale: 此处与“日子、月份、节期、年份”并列，指周期性的安息日。
- source_word: ለበዓላት
  choice: 节期
  rationale: 原词可指庆典或节庆；在历法序列中译作“节期”自然且准确。
- source_word: ለሰንበታት፡ ዓመታት
  choice: 年安息
  rationale: 直译为“年份的安息日/安息”，指按年计算的安息周期；采用简洁表达，避免增添解释。
- source_word: ለአዮቤልውሳት
  choice: 禧年
  rationale: 采用现代中文中对 jubilee 年期的通行圣经术语。
- source_word: ለኵሉ፡ ጊዜ
  choice: 一年中所有的时节
  rationale: 依据英译审校层所保存的篇章语境补出“年中”，使末项与历法序列衔接；吉兹文本本身直译为“所有时间/时节”。
theological_decisions:
- issue: 太阳作为“大记号”的功能
  choice: 上帝立太阳为地上的大记号，用来标示各类历法时段
  alternative: 上帝赐下太阳，作为统治地上的大记号
  rationale: 原文结构将太阳与日子、安息日、月份等历法单位相连；译文保留神所设立及其标志功能，不把太阳人格化或神格化。
- issue: “年安息”的具体制度含义
  choice: 保留概括性的“年安息”
  alternative: 明确译为“安息年”
  rationale: 原文为“年份的安息/安息日”复数结构；“年安息”较能保留形式上的开放性，不提前限定为某一种后世制度表述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“掌管昼夜”承接上文，保留本节起首为句中续接成分的性质；随后用“并”连接分开光暗的功能。历法项目依原文次序排列，避免加入宗派性解释。
