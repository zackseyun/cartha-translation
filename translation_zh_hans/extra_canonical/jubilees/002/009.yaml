  naturalness: “掌管昼夜，并把光暗分开”通顺，补出“和”后“把光和黑暗分开”更自然、庄重。“年安息”不属现代汉语中稳定自然的历法术语；“安息年”更清楚且符合圣经汉语惯例。
  terminology: “上帝”“大记号”“安息日”“节期”“禧年”均合适。“安息年”准确对应“安息的年份／年份的安息日”，不必附加制度性解释。
