  yaml_path: translation/extra_canonical/jubilees/002/010.yaml
  text: And it separates between light and darkness[10], and for prosperity, so that everything that sprouts and grows on the earth may prosper. These three kinds he made on the fourth day.
translation:
  language: zh_hans
  text: 又用来定年岁，分开光与暗，并使地上一切萌发、生长的都繁盛[a]。这三类，他都在第四日造了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “繁盛”也可理解为“得医治”“复苏”或“茂盛”，指天上光体对地上生长之物的有益作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: ለዓመታት
  choice: 用来定年岁
  rationale: 原文承接上文，以“为年岁”说明天体的功用；中文补出“定”以自然表达计定年岁的意思，同时保留本节开头的承接关系。
- source_word: ይፈሊጥ፡ ማእከለ፡ ብርሃን፡ ወማእከለ፡ ጽልመት
  choice: 分开光与暗
  rationale: “ማእከለ……ወማእከለ……”在此为“在……与……之间”的惯用结构，不按字面译成“光的中间与暗的中间”，以免造成误解。
- source_word: ይጥዐይ
  choice: 繁盛
  rationale: 该词在此语境指地上植物受到有益作用而兴盛，也可含“得医治、复苏、茂盛”之意；正文用“繁盛”最贴合萌发和生长的上下文。
- source_word: ኵሉ፡ ዘይሠርፅ፡ ወይለቍፅ
  choice: 一切萌发、生长的
  rationale: 分别保留“萌发”与“生长”两个并列动作，用自然现代汉语表达植物从出芽到长成的过程。
- source_word: ሠለስተ፡ ዘንተ፡ ዘመደ
  choice: 这三类
  rationale: “ዘመደ”表示种类、类别；按上下文指前三类受造之物，不擅自具体列名。
theological_decisions:
- issue: 天体对地上生长所起作用的表述
  choice: 并使地上一切萌发、生长的都繁盛
  alternative: 并为医治，使地上一切萌发、生长的都得医治
  rationale: 原词具有兴盛、康复或医治的语义幅度。植物生长的语境支持正文译作“繁盛”，脚注则保留“医治、复苏、茂盛”的可能性，避免把经文限定为某种特定宇宙论或神学解释。
- issue: 末句创造者的指称
  choice: 他都在第四日造了
  alternative: 这些都是在第四日造的
  rationale: 原文动词为阳性单数，宜保留创造者为句法主语；仅用普通代词“他”，不额外加入原文此处未明说的神名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“又”体现本节与上文的连续关系；正文保留“年岁”这一原文成分，虽英语咨询层未收入。脚注标记[a]已置于相关词语之后。
