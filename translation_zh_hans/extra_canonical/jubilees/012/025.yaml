  yaml_path: translation/extra_canonical/jubilees/012/025.yaml
  text: 'The Lord God [said]: ''Open his mouth and his ears, so that he may hear and speak with his mouth in the language that has been revealed, for it has ceased from the mouths of all the children of men from the day of the overthrow.''[a]'
translation:
  language: zh_hans
  text: 主上帝说[a]：“你要打开他的口和耳朵，使他能听，并能用自己的口说那已经显明的语言；因为从倾覆之日[b]起，这语言已从所有世人的口中消失了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说”是按上下文补出的；现存引文开头只有“主上帝”，而“打开”在吉兹文中是第二人称单数命令式。另一种译法是：“主上帝啊，求你打开他的口和耳朵……”
    reason: textual_ambiguity
  - marker: b
    text: “倾覆之日”原文表达简略，很可能指与巴别审判有关的语言失落或变乱。
    reason: cross_reference
lexical_decisions:
- source_word: ፍታሕ
  choice: 你要打开
  rationale: 此词为第二人称单数命令式，保留上帝向受命者发出的直接命令。
- source_word: በልሳን፡ እንተ፡ ታስተርኢ
  choice: 那已经显明的语言
  rationale: 将关系结构及完成含义自然译出，同时不具体断定这语言向谁或以何种方式显明。
- source_word: አዐረፈ፡ እምአፈ
  choice: 已从……口中消失
  rationale: 原义近于“停止、不再存在于口中”；“消失”符合语言不再为人使用的语境。
- source_word: ዕለተ፡ ድቀት
  choice: 倾覆之日
  rationale: 保留原文压缩且带审判意味的表达，不在正文中直接解释为巴别事件。
theological_decisions:
- issue: 开头是否补出叙述动词“说”
  choice: 主上帝说[a]
  alternative: 主上帝啊，求你打开他的口和耳朵
  rationale: 现有吉兹文开头缺少明确的“说”，但随后 ፍታሕ 是第二人称单数命令式，结合叙事语境，理解为上帝对受命者说话最连贯；用脚注标明补足，避免掩盖文本形态。
- issue: “倾覆之日”所指为何
  choice: 正文保留“倾覆之日”
  alternative: 巴别塔倾覆之日／语言变乱之日
  rationale: 原文没有明说巴别，因此正文不将可能的典故解释固定为唯一含义，仅在脚注提示其通常理解。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“主上帝”对应神名与“上帝”的组合；“所有世人”自然传达“所有人的儿女”。引语中的命令保持直接，不使用古奥文言。
