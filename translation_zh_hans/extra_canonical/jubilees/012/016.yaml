  text: two weeks of years[a]. And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains. And he was there alone, sitting and observing, and a word came into his heart, and he said[a], “All the signs of the stars and their signs...
translation:
  language: zh_hans
  text: 两个年周[a]。在第六个年周的第五年，亚伯兰在七月初[b]从黄昏到黎明整夜坐着观察众星，要看这一年在雨水方面会是怎样。他独自坐在那里观察；有话进入他心里，他便说：“众星的一切征象和它们的征兆……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“年周”指七年为一周。《禧年书》常用禧年、年周和年来计算时间。
    reason: cultural_note
  - marker: b
    text: “七月初”也可更具体地理解为第七个月的新月开始，或月亮升起之时。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: 年周
  rationale: 直译为“七年一周”，即以七年为一个周期；用“年周”既保留《禧年书》的历法计时方式，也避免误解为普通的一周。
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: 在七月初月亮升起时
  rationale: ሠርቀ ወርኅ 可指月亮升起，也可在历法语境中指月初或朔日；正文保留月亮初升的具体意象，并以脚注说明历法性理解。
- source_word: ያበይነ፡ ከዋክብተ
  choice: 观察众星
  rationale: 按上下文表达亚伯兰持续察看星辰、借此判断年景的行动，采用自然而不添加占卜色彩的汉语。
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: 要看这一年在雨水方面会是怎样
  rationale: 保留“这一年的作为/情形”与降雨之间较宽泛的关系，不具体化为雨量、收成或气候预测。
- source_word: መጽአ፡ ውስተ፡ ልቡ፡ ቃል
  choice: 有话进入他心里
  rationale: 贴近原文的空间性表达，不预先判定这话是思想、启示或神谕。
- source_word: ኵሉ፡ ተአምረ፡ ከዋክብት፡ ወተአምራሁ
  choice: 众星的一切征象和它们的征兆
  rationale: 保留原文“征象/征兆”的近义重复及未完句式，不擅自补足下一节内容。
theological_decisions:
- issue: 进入亚伯兰心里的“话”的来源
  choice: 不明说来源，只译作“有话进入他心里”
  alternative: 译作“神的话临到他心里”或“他心里想到”
  rationale: 本节原文只说“话”进入他心里，并未明确指出说话者；保持这一开放性可避免把它过早解释为神谕或普通念头。
- issue: 观察星辰的性质
  choice: 译作中性的“观察众星”
  alternative: 译作“占星”或“观天象”
  rationale: 原文描述观察星辰以判断雨水年景，但本节本身尚未对该行为作神学定性；不应提前加入赞同或谴责。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“年周”作为必要的历法术语由脚注解释；叙事部分使用自然语序。保留开头承接上文的残句、原文末尾的近义重复和未完引语，以忠实呈现本节边界及文本张力。
