  text: before them? And if I speak the truth to them, they will kill me, for their souls cling to them.
translation:
  language: zh_hans
  text: 在它们面前吗？如果我对他们说真话[a]，他们就会杀我，因为他们的心灵依恋着它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对他们说公义的话”。
    reason: 原词通常可指“正义、公义”；在本句中也可理解为说出真实之事。
lexical_decisions:
- source_word: ጽድቀ
  choice: 真话
  rationale: 该词基本义域包括“正义、公义、正确、真实”；在“说……便遭杀害”的语境中，“说真话”最符合现代汉语表达，同时用脚注保留“正义的话”这一较形式对应的可能译法。
- source_word: ነፍሶሙ
  choice: 他们的心
  rationale: 字面为“他们的灵魂/性命”；此处指内在的眷恋与倾向，现代汉语用“心”自然且不引入关于灵魂本体的额外主张。
- source_word: ተለውት … ኀቤሆሙ
  choice: 依恋着它们
  rationale: 表达紧紧归附、倾向于所指对象的意思；“依恋”既自然，也保留原文所呈现的深层内在黏附感。
theological_decisions:
- issue: 末尾代词所指对象
  choice: 保留“它们”而不明说具体对象
  alternative: 译作“那些偶像”或“那些神像”
  rationale: 本节片段本身只使用代词；不把上下文推定的所指直接写入正文，可避免消除原文的指代含混。
- issue: “灵魂”在本句中的译法
  choice: 按内在意向译为“心”
  alternative: 直译为“灵魂”
  rationale: 这里重点是人的依恋和倾向，而非对灵魂性质作教义陈述；“心”在现代汉语中更准确传达该语用功能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留开头承接上文的疑问形式，以及“他们／它们”的指代区别；不在正文中补出原文没有明说的对象。
