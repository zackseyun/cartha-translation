  source_fidelity: “真话”在本句语境中可准确表达ጽድቀ所指的真实、正确之言，并以脚注保留其“正义／公义”义项。末句ነፍሶሙ字面为“他们的灵魂（或生命）”；译作单纯的“心”虽通顺，却略减弱原文所用的人内在生命这一措辞。改为“心灵”可在不作教义性界定的前提下较好保留原文。开头与末尾的“它们”保留了片段及上下文中的指代对象，避免与说话对象“他们”混同。
