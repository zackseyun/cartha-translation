  yaml_path: translation/extra_canonical/jubilees/012/023.yaml
  text: And I will make your name great, and you will be blessed in the earth, and in you all the nations of the earth will be blessed. And those who bless you I will bless, and those who curse you I will curse.
translation:
  language: zh_hans
  text: 我要使你的名为大；你必在地上蒙福，地上万国都必因你蒙福。祝福你的，我必祝福他们；咒诅你的，我必咒诅他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐቢ፡ ስመከ
  choice: 我要使你的名为大
  rationale: 直译“我要使你的名变大/伟大”，以现代汉语中庄重而熟悉的表达保留名声、地位被高举的含义；不补入原文没有的“赐福给你”。
- source_word: ወትከውን፡ ቡሩከ፡ ውስተ፡ ምድር
  choice: 你必在地上蒙福
  rationale: ቡሩከ 表示“蒙福的、有福的”，ውስተ ምድር 为“在地上”；采用被动式“蒙福”保留原文语态与神赐福的意味。
- source_word: ወይትባረኩ፡ ብከ፡ ኵሎሙ፡ አሕዛበ፡ ምድር
  choice: 地上万国都必因你蒙福
  rationale: ብከ 可表示“在你里面/借着你/因你”；正文选“因你”以符合自然汉语，同时保留亚伯兰作为万国得福关联者的意义。አሕዛበ 译作“万国”，比“民族”更贴合此处传统语境。
- source_word: ወለእለ፡ ይባርኩከ፡ እባርኮሙ
  choice: 祝福你的，我必祝福他们
  rationale: 保留源文从复数关系从句到复数宾语的对应，以“他们”明确所指，不把复数泛化成单数。
- source_word: ወለእለ፡ ይረግሙከ፡ እረግሞሙ
  choice: 咒诅你的，我必咒诅他们
  rationale: 同根词 ይረግሙከ/እረግሞሙ 前后复现，故均译“咒诅”，保存原文直接而强烈的对称结构。
theological_decisions:
- issue: 万国得福与亚伯兰之间的介词关系
  choice: 因你蒙福
  alternative: 在你里面蒙福／借着你蒙福
  rationale: 源文 ብከ 的语义可以覆盖“在你里面、借着你、因你”。“因你”在现代汉语中最自然，也没有进一步界定赐福实现的机制，因而不替原文消除其神学张力。
- issue: 第二句的身份陈述或命令含义
  choice: 你必在地上蒙福
  alternative: 你要成为福分
  rationale: 吉兹文实际为“你将成为蒙福的”，并含“在地上”，不是《创世记》希伯来文本中常见的“你要成为福分”；故按本节现存源文翻译，不以平行经文改写。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话。句式维持原文的祝福—咒诅对称结构，并以分号划分三层应许。正文无脚注标记，因为没有必须另注才能保存的文本异读或不可译歧义。
