translation:
  language: zh_hans
  text: 为要救他们，火在他身上燃起；他被火焚烧，死在迦勒底人的吾珥。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከመ፡ ያድኅኖሙ፡
  choice: 为要救他们
  rationale: ከመ引出目的，ያድኅኖሙ意为“救他们”；保留原文片段承接上文的结构。
- source_word: ወነደደ፡ እሳት፡ ላዕሌሁ፡
  choice: 火就在他身上燃起
  rationale: 直译火在他“上面／身上”燃烧；“燃起”体现动作的发生，又不额外说明点火者。
- source_word: ወውዐየ፡ በእሳት፡
  choice: 他被火烧
  rationale: 以自然现代汉语表达受火焚烧；保留原文的被动受害含义及火的施事／工具关系。
- source_word: ወሞተ፡ በኡር፡ ዘከለዳዊያን፡
  choice: 死在迦勒底人的吾珥
  rationale: 按传统汉语圣经地名译法处理“Ur of the Chaldeans”，清楚保留地点与所属关系。
theological_decisions:
- issue: 火如何燃起及由谁引发
  choice: 火就在他身上燃起
  alternative: 有人在他身上点了火
  rationale: 原文此处未明说点火者，不增添施事者，以保存叙事上的含混。
- issue: 焚烧与死亡的关系
  choice: 他被火烧死
  alternative: 他被火烧，并且死了
  rationale: 原文依次陈述被火焚烧和死亡；汉语合译为“烧死”自然简洁，且未改变死亡由焚烧造成的明显语境关系。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“迦勒底人的吾珥”沿用读者熟悉的圣经专名形式；整节作为承接上文的句子片段处理。
