base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/022.yaml
  text: the word of the LORD came to him by my hand, saying, "Go out from your land and from your kindred and from your father's house to the land that I will show you, and I will make you into a great and numerous nation, and I will bless you."
translation:
  language: zh_hans
  text: 耶和华的话藉着我的手临到他，说：“你要离开你的土地、你的亲族和你父亲的家，往我将要指示你的地去。我要使你成为一个伟大而人数众多的民族，也要赐福给你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ እግዚአብሔር
  choice: 耶和华的话
  rationale: 按短语本义译出神圣之名与“话”；采用现代中文圣经语体中清楚而庄重的表达。
- source_word: ኀቤሁ፡ በእዴየ
  choice: 藉着我的手临到他
  rationale: 保留“到他那里/临到他”与“藉着我的手”两个成分，也避免把第一人称中介者的角色解释得过于具体。
- source_word: ፃእ
  choice: 你要离开
  rationale: 该命令在此语境中指离开原居地；中文用“离开”比直译“出去”更自然，同时保持命令语气。
- source_word: ትዝምድከ
  choice: 你的亲族
  rationale: 表达血缘亲属或宗族范围，不将其窄化为现代意义上的单个“家庭”。
- source_word: ሕዝበ፡ ዐቢየ፡ ወብዙኃ
  choice: 一个伟大而人数众多的民族
  rationale: 同时保留“大”和“众多”两项描述；“民族”适合此处由一人兴起群体的语境。
- source_word: እባርከከ
  choice: 赐福给你
  rationale: 准确传达祝福这一神学与叙事用语，并符合现代中文的庄重表达。
theological_decisions:
- issue: “藉着我的手”的第一人称身份
  choice: 保留为“藉着我的手”
  alternative: 解释为“藉着天使的手”或省略中介表达
  rationale: 原文明确使用第一人称，却在本节本身没有直接点明说话者身份；保留其形式可避免引入解释。
- issue: 应许中的群体称谓
  choice: 译为“民族”
  alternative: 译为“国”或“百姓”
  rationale: 原词可指人民、族群或国家；“民族”能保留群体形成的含义，同时不预先断定其政治形态。
translation_notes:
  register: 采用现代、庄重且易懂的叙事与引语体。保留原文连续的应许结构和中介者第一人称表达；标点按现代简体中文规范处理。
