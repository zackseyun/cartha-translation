base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/020.yaml
  text: Deliver me from the hand of evil spirits that rule over the thoughts of the heart of man, and do not let them lead me astray from following you, my God. And establish me and my seed forever, so that we may not go astray from now and forever." And he said,
translation:
  language: zh_hans
  text: 求你救我脱离那些邪灵之手；它们辖制人心里的意念。我的上帝啊，不要让它们使我偏离你。求你使我和我的后裔永远坚定，好叫我们从今直到永远不再走迷。”他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናፍስት፡ እኩያን
  choice: 邪灵
  rationale: 按字面为“邪恶的灵”；“邪灵”是现代汉语中自然、庄重且准确的表达。
- source_word: ይስልጡ
  choice: 辖制
  rationale: 该词表达掌权、支配之意；“辖制”保留其强势控制的语义，不弱化为一般性的“影响”。
- source_word: ሕሊና፡ ልበ፡ ሰብእ
  choice: 人心里的意念
  rationale: 保留“人的心”与“意念”两层概念，同时避免生硬的“人心的思想”。
- source_word: አይስሕቱኒ፡ እምድኅሬከ
  choice: 不要让它们诱使我偏离你
  rationale: 原文有使役性的“使我走迷”及“离开你身后/不再跟随你”之意；译文自然呈现其核心含义。
- source_word: ወትረሰየኒ፡ ኪያየ፡ ወዘርእየ
  choice: 求你使我和我的后裔永远坚定
  rationale: ኪያየ是独立宾格代词“我”，与动词中的宾语后缀呼应，并引出并列宾语“我和我的后裔”；不译作“在你面前”。
- source_word: ወይቤ
  choice: 他说：
  rationale: 保留原文结尾引出下一节话语的叙事衔接。
theological_decisions:
- issue: 邪灵对人内心的作用
  choice: 译为“辖制人心里的意念”
  alternative: 影响人的思想
  rationale: 原文使用表示掌权或支配的动词；应保留这种强烈表述，而不另行解释其作用机制。
- issue: “使我和我的后裔坚定”的关系对象
  choice: 不加入“在你面前”
  alternative: 使我和我的后裔在你面前永远坚定
  rationale: 吉兹语ኪያየ是“我”的独立宾格形式，并非“在你面前”；加入后者会引入源文没有的内容。
- issue: 末句偏离的对象
  choice: 补明“偏离你”
  alternative: 仅译“走迷”
  rationale: 末句承接前句“偏离你”的语境；汉语补出宾语使指向清楚，但不增加新的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体。以“求你”呈现连续祈求，用“从今直到永远”保留原文的时间跨度；结尾冒号表明“他说”引向后续话语。
