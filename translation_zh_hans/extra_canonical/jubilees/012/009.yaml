  text: He told this matter to his two brothers,, and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of
translation:
  language: zh_hans
  text: 他把这事告诉了他的两个兄弟；他们就向他发怒，却默不作声。第四十个禧年，第二个七年期的第七年，亚伯兰为自己娶了妻子，名叫撒莱；她是……的女儿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语文本在“女儿”一词之后中断，因此这里保留为未完句；关于撒莱亲属关系的具体表述，需要参照后续文本或其他文本见证。
    reason: source_truncation
lexical_decisions:
- source_word: ነገረ፡ ለክልኤ፡ አሐዊሁ
  choice: 把这事告诉了他的两个兄弟
  rationale: 按原文动词及宾语关系直译，同时采用自然的现代汉语语序。
- source_word: ወተምዑ፡ ላዕሌሁ፡ ወአርመሙ
  choice: 他们就向他发怒，却默不作声
  rationale: 两个动词均为复数，主语是两个兄弟；“却”自然呈现发怒而不再开口的语意张力。
- source_word: አዮቤልዉ
  choice: 禧年
  rationale: 保留《禧年书》特有的年代计算术语。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 此处指由七年组成的周期，用“七年期”比单纯“七”更清楚。
- source_word: ነሥአ፡ ሎቱ፡ አብራም፡ ብእሲተ
  choice: 亚伯兰为自己娶了妻子
  rationale: “取一个女人给自己”在婚姻语境中自然表达为“娶妻”，并保留反身意味。
- source_word: ሶራ
  choice: 撒莱
  rationale: 依该人物在中文圣经传统中的通行名称译写；原文形式对应 Sarai。
- source_word: ወሰተ
  choice: 她是……的女儿
  rationale: 所给原文在表示“女儿”的词后截断，译文以省略号明确保留残缺状态，不补入本段未见的亲属成分。
theological_decisions:
- issue: 撒莱的亲属关系
  choice: 不补明她是谁的女儿
  alternative: 依后续文本或其他见证补作“她父亲的女儿”等
  rationale: 当前提供的吉兹语片段止于“女儿”，关系对象不在本段中；为避免凭解释解决文本困难，正文保留未完句，并以脚注说明。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“禧年”“七年期”保留本书年代体系；用复数“他们”准确反映原文语法。
