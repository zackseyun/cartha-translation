translation:
  language: zh_hans
  text: ……太阳和月亮的……，一切都在主手中。我为什么要寻求呢？如果他愿意……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的开头和结尾都属于跨节句子：开头“太阳和月亮的”承接前文；结尾“如果他愿意”在下一节续完。
    reason: 说明章节切分造成的两个句法残片，防止读者把不完整结构误认为译文遗漏。
lexical_decisions:
- source_word: ለፀሓይ፡ ወለወርኅ
  choice: ……太阳和月亮的……
  rationale: 两个名词前的ለ-表示与前文相接的属格或关联结构；本节切分后成为句首残片，因此以省略号保留其未完状态，不擅自补出所修饰的内容。
- source_word: ኵሉ፡ በእዴ፡ እግዚአብሔር
  choice: 一切都在主手中
  rationale: 按原文直译，保留“一切”和“在主手中”的支配意象。
- source_word: ለምንት፡ አነ፡ እትኃሠሥ
  choice: 我为什么还要寻求呢？
  rationale: እትኃሠሥ表达第一人称的寻求、查究；“还要”使现代汉语问句自然，同时承接上下文持续探求的语气。
- source_word: በእመ፡ ፈቀደ
  choice: 如果他愿意……
  rationale: 这是条件从句的开头，应与前一问句分开，并用句末省略号表明其后件位于下一分段。
theological_decisions:
- issue: “主”的指称与大小写呈现
  choice: 主
  alternative: 耶和华／上主
  rationale: 原文እግዚአብሔር通常指“主”；此处不增加原文没有明示的专名。
- issue: 条件句与问句的关系
  choice: 将“如果他愿意”作为下一句开头
  alternative: 译作“如果他愿意，我为什么还要寻求呢？”
  rationale: 原文分句和最新校勘说明显示该条件短语开启下一句，不宜附着于前面的问句，否则会改变逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以省略号明确标示原文在本节边界处前后均未完，并保留问句与条件从句之间的句法张力。
