  to: 我开了他的口、耳朵和嘴唇，开始用希伯来语，就是创造的语言，与他说话。他取来先祖的书卷；这些书卷是用希伯来语写的。他把它们抄录下来，从那时起便开始研习。我把他不能明白的一切都指示给他；他在雨季的六个月里研习这些书卷。
  rationale: 仅作两处安全的措辞修订：以较自然的“开了”对应开启动作，并以“创造的语言”保留原文短语的歧义和宇宙论色彩。其余句法、时间信息和书卷指代维持原意。
