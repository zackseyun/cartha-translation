base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/026.yaml
  text: And I opened his mouth and his ears and his lips, and I began to speak with him in Hebrew, in the language of creation. And he took the books of his fathers, and they were written in Hebrew, and he copied them and began from then on to study them. And I made known to him everything that he was unable to understand, and he studied them during the six rainy months.
translation:
  language: zh_hans
  text: 我开了他的口、耳朵和嘴唇，开始用希伯来语，就是创造的语言，与他说话。他取来先祖的书卷；这些书卷是用希伯来语写的。他把它们抄录下来，从那时起便开始研习。我把他不能明白的一切都指示给他；他在雨季的六个月里研习这些书卷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈታሕኩ
  choice: 我开启了
  rationale: 保留原文第一人称使役动作及其较庄重的叙事语气，不弱化为单纯“使……能”。
- source_word: በዕብራይስጥ
  choice: 用希伯来语
  rationale: 按上下文指语言，而非族群身份；现代汉语以“希伯来语”最清楚自然。
- source_word: በልሳነ፡ ፍጥረታት
  choice: 就是受造之物的语言
  rationale: 尽量贴近“creation/creatures”的源文表达，并保留其宇宙论意味，不解释为某一特定教义概念。
- source_word: መጻሕፍተ፡ አበዊሁ
  choice: 先祖的书卷
  rationale: “先祖”比“父亲们”符合家族传承语境；“书卷”适合古代文献背景。
- source_word: ወደገሞን
  choice: 把它们抄录下来
  rationale: 该动词在此语境有重复、誊录之意；结合书卷，译作“抄录”比笼统的“重复”准确。
- source_word: ስድስተ፡ ወርኀ፡ ዘናም
  choice: 雨季的六个月
  rationale: 保留六个月与雨季的时间关系，采用自然且不增添地域说明的汉语表达。
theological_decisions:
- issue: “受造之物的语言”的所指
  choice: 保留“受造之物的语言”这一开放表达
  alternative: 译为“创造时的语言”或“创世的语言”
  rationale: 源文可被理解为受造界的语言或创造之初的语言；正文不替读者排除其中一种可能，也不将其教义化。
- issue: 神圣启示与人的学习之间的关系
  choice: 并列保留“我指示给他”与“他研习”
  alternative: 把理解完全归结为神直接启示，或完全归结为人的学习
  rationale: 原文同时强调第一人称的教导和亚伯兰持续研习，译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以分号梳理书卷原为希伯来文、抄录和研习之间的关系；不添加原文没有的身份说明。
