  yaml_path: translation/extra_canonical/jubilees/012/019.yaml
  text: And in that night he said, "My God, God Most High, you alone are God to me, and you created all things, and all that exists is the work of your hands. I have chosen you and your dominion; deliver me."
translation:
  language: zh_hans
  text: 那一夜，他说：“我的上帝，至高的上帝，惟有你是我的上帝。你创造了万物；凡存在的，都是你手所作的。我选择了你和你的统治权[a]；求你拯救我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据文本此处字形疑有讹误；校勘本通常读作意为“你的统治权”或“你的权柄”的词。另有旧译按现有字形译作“你的赞美”。
    reason: 说明所给文本的疑难字形及校勘传统，同时保留旧译的文本史信息，不将校勘结论表述为毫无争议。
lexical_decisions:
- source_word: አምላኪየ፡ አምላከ፡ ልዑል
  choice: 我的上帝，至高的上帝
  rationale: 保留呼告的重复结构，并以现代汉语自然表达“至高”。
- source_word: አንተ፡ ባሕቲትከ፡ ሊተ፡ አምላክ
  choice: 惟有你是我的上帝
  rationale: 准确呈现排他性的“你独自/惟有你”以及“对我而言是上帝”。
- source_word: ኵሎ፡ ፈጠርከ
  choice: 你创造了万物
  rationale: 将“全部”按创造语境译为“万物”，简洁而庄重。
- source_word: ግብረ፡ እደዊከ፡ ኵሉ፡ ኮነ፡ ዘሀሎ
  choice: 一切存在的都是你双手的作为
  rationale: 保留“一切存在者”与“你双手的工作/作为”的对应关系，不将其弱化为泛指的一切事情。
- source_word: ወኪያከ፡ ወመሰክንከ፡ ኀረይኩ
  choice: 我选择了你和你的统治
  rationale: 依据校勘说明，将传本文字视为对意为“统治、权柄”的词形之讹；“选择”保留原文主动委身的表述。
- source_word: አድኅነኒ
  choice: 求你拯救我
  rationale: 完整译出末尾祈求；加“求”符合汉语祷告语体。
theological_decisions:
- issue: “惟有你是我的上帝”的排他性
  choice: 直译保留
  alternative: 你是我惟一的上帝
  rationale: 前者更贴近原文语序，也避免额外界定“惟一”的哲学含义。
- issue: 疑难词 ወመሰክንከ 的解释
  choice: 你的统治
  alternative: 你的赞美
  rationale: 所给文本很可能存在抄写或OCR讹误；相关校勘传统支持“统治/权柄”。因现有字面形式本身难以直接支持该义，故以脚注公开文本问题，不掩盖不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“上帝”与项目给定英语咨询层一致；句式适度保留原文的重复和并列。脚注标记已在正文中出现。
