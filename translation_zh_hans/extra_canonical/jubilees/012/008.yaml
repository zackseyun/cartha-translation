lexical_decisions:
- source_word: ያምልክዎሙ
  choice: 敬拜这些偶像
  rationale: 动词表示敬拜，宾语后缀为复数“它们”；结合上下文所指为偶像，汉语用“这些偶像”比无生命代词“它们”更自然清楚。
- source_word: ይስብሕዎሙ
  choice: 赞美这些偶像
  rationale: 保留“赞美、颂扬”的基本意义，并与前一动词构成并列。
- source_word: አርምም
  choice: 安静吧
  rationale: 命令式，意为保持安静或沉默；此处父亲劝儿子不要再说，译作“安静吧”自然且保留语气。
- source_word: ከመ፡ አይቅትሉከ
  choice: 免得他们杀你
  rationale: 准确表达目的／防范从句及第二人称单数宾语。
- source_word: ወነገረ … ለ፪አኃዊሁ
  choice: 他把这些话告诉了自己的两个兄弟
  rationale: 依据经校正的完整经节边界，表达向两个兄弟说这些话；“自己的”清楚呈现所属关系。
- source_word: ወተምዑ፡ ሎቱ
  choice: 他们向他发怒
  rationale: 保留对他生气、发怒的方向关系，不额外说明怒因。
- source_word: ወአርመመ
  choice: 他便沉默了
  rationale: 与前面的命令“安静吧”形成词义呼应，并准确表达随后保持沉默。
