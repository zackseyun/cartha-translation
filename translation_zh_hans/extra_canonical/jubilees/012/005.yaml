base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/005.yaml
  text: There is no spirit in them, because they are the work of hands; and you carry them on your shoulders, and from them there is no help for you, except great shame.
translation:
  language: zh_hans
  text: 它们里面没有灵，因为它们是人手所造的；你们把它们扛在肩上[a]，它们却不能给你们任何帮助，只会使你们大大蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们用肩膀抬着它们，而它们不能给你们任何帮助”。
    reason: 源文连接词与分句边界可使后半句从“肩上”之后另起；脚注保存较贴近形式的读法，并避免加入源文没有的“它们成为你们的重担”。
lexical_decisions:
- source_word: መንፈስ
  choice: 灵
  rationale: 直译源词，指偶像里面并无生命之灵；保留简洁而带神学张力的表达。
- source_word: ግብረ፡ እደው
  choice: 人手所造的
  rationale: 按“手的作品”这一源语结构自然转述，突出偶像出于人的制作。
- source_word: ትጸውርዎሙ
  choice: 把它们扛
  rationale: 该动词表示携带、负载；结合“肩上”译为“扛”最符合现代汉语。
- source_word: ረድኤት
  choice: 帮助
  rationale: 采用直接、常用的对应词，不把意义扩大为拯救或保护。
- source_word: ሐሳር፡ ዐቢይ
  choice: 大大蒙羞
  rationale: 表达“大羞辱／大耻辱”；在句中用结果性说法，形成偶像毫无帮助、反致羞耻的对照。
theological_decisions:
- issue: 偶像“没有灵”的含义
  choice: 保留“没有灵”
  alternative: 译作“没有生命”
  rationale: 源文明确使用“灵”，不将其无声改释为单纯没有生物性生命。
- issue: 末句中“除了大羞辱”的逻辑关系
  choice: 译为“只会使你们大大蒙羞”
  alternative: 直译为“除了大羞辱以外，不能给你们任何帮助”
  rationale: 源文的排除结构意为它们带来的不是帮助而是极大羞辱；此译在现代汉语中自然呈现这一反讽，同时不添加额外负担之意。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。以第二人称复数“你们”对应源文；“它们”用于无生命的偶像。句式保留偶像由人制造、反由人扛抬且不能施助的讽刺对比。
