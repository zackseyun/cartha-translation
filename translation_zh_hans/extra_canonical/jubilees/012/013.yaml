  text: And they arose in the night and wanted to rescue their gods from the midst of the fire. And Haran rushed
translation:
  language: zh_hans
  text: 他们夜里起来，想从火中救出自己的众神。哈兰冲了过去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“哈兰跑去。”此分句在内容上也可能是下一节的开头。
    reason: 原动词可表示奔跑、跃起或冲去；同时，所给吉兹语分节把一个可能承接下一节的短句置于本节末尾。
lexical_decisions:
- source_word: ያድኅኑ
  choice: 救出
  rationale: 该动词表达拯救、搭救之意；结合众神位于火中的语境，“救出”自然且准确。
- source_word: አማልክቲሆሙ
  choice: 自己的众神
  rationale: 保留复数“众神”和第三人称复数所属关系，且用“自己的”符合现代汉语表达。
- source_word: ሰረረ
  choice: 冲上前去
  rationale: 该动词可表达跃起、冲去或疾奔；“冲上前去”传达动作急促有力，同时不擅自补明目的地。
- source_word: አራን
  choice: 哈兰
  rationale: 此名指圣经人物哈兰，采用现代简体中文圣经中通行的译名。
theological_decisions:
- issue: 如何称呼他们试图从火中救出的神像或神祇
  choice: 众神
  alternative: 神像
  rationale: 原文直接使用“神”的复数形式，并未明说“神像”；译作“众神”保留叙事本身的措辞及其讽刺张力，不替作者作解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“夜里起来”“从火中救出”紧贴原文；末句保留其简短突兀的结构，不补写哈兰冲向何处或随后做了什么。
