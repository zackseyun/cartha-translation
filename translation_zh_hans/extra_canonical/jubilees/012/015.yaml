lexical_decisions:
- source_word: በቅድመ፡ ታራ፡ አቡሁ
  choice: 死在他父亲他拉之前
  rationale: 原文是承接上文的残句，字面为“在他父亲他拉之前”；汉语需补出上文支配的“死”，同时保留本节跨句承接的性质。
- source_word: ኡር፡ ዘከለዳዊያን
  choice: 迦勒底人的吾珥
  rationale: 采用现代中文圣经读者熟悉的地名形式，并准确表达属格关系。
- source_word: ምድረ፡ ሊባኖስ
  choice: 黎巴嫩地
  rationale: 直译其“……之地”结构，不把它解释为山脉或现代国家。
- source_word: ኀደረ
  choice: 定居下来／住在
  rationale: 该词在两处均表示居住、停留；依主语和语境分别译为自然汉语“定居下来”和“住在”，不改变语义。
- source_word: ካራን
  choice: 哈兰
  rationale: 采用中文圣经传统中通行的地名译法。
