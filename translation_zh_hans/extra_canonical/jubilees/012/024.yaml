  text: And I will be God to you and to your son and to your son's son and to all your seed. Do not fear from now and unto all the generations of the earth; I am your God." And he said to me,
translation:
  language: zh_hans
  text: “我要作你、你儿子、你孙子和你一切后裔的上帝。从今以后，直到地上所有的世代[a]，你不要害怕；我是你的上帝。”他对我说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上所有的世代”也可译作“地上的世世代代”。原文是“直到”，并没有另一个表示“永远”的词。
    reason: 说明原文时间介词及名词短语的译法，避免将原文未有的“永远”加入正文。
lexical_decisions:
- source_word: እከውንከ … አምላከ
  choice: 我要作……的上帝
  rationale: 按系词结构直译其立约性表达，同时用现代汉语自然句式呈现。
- source_word: ወለወልደ፡ ወልድከ
  choice: 和你孙子
  rationale: 原文逐字为“你儿子的儿子”；汉语以“孙子”简洁准确地表达。
- source_word: ወለኵሉ፡ ዘርእከ
  choice: 和你一切后裔
  rationale: “种/后裔”在此指家系后代；“一切后裔”兼顾准确与自然。
- source_word: ኢትፍራህ
  choice: 都不要害怕
  rationale: 保留否定命令的直接语气；“都”承接其后延伸至各世代的范围。
- source_word: እምይእዜ፡ ወእስከ
  choice: 从今以后，直到
  rationale: 分别呈现“从现在”和“直到”；不增添原文没有的“永远”。
- source_word: ወይቤለኒ
  choice: 他又对我说
  rationale: 原文仅为“他对我说”；“又”自然衔接后续话语，不把主语扩写为“主上帝”。
theological_decisions:
- issue: “我要作……的上帝”的立约意味
  choice: 保留“作……的上帝”
  alternative: 我要成为……的上帝
  rationale: “作……的上帝”在现代汉语中庄重自然，也不把关系性陈述解释成上帝本体发生变化。
- issue: 禁令延续范围的表达
  choice: 从今以后，直到地上所有的世代
  alternative: 从今直到地上世世代代
  rationale: 原文有明确的“直到”而没有“永远”；正文尽量保留其时间界限表达，脚注说明汉语可接受的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文从直接引语转入“他又对我说”的未完句式，因为本节在此处承接下一节；不擅自补明说话者身份。
