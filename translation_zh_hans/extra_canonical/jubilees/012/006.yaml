- from: “对制造它们的人来说，[它们是骗局][a]；对敬拜它们的人来说，它们使人心里迷乱。不要敬拜它们。”他的父亲对他说：“我儿，这我也知道；可是，对这使我不得不听命的民众，我能怎么办呢？”[b]
  to: “至于那些制造它们的人，[它们是骗局][a]；至于那些敬拜它们的人，它们使他们心里迷乱。不要敬拜它们。”他的父亲对他说：“我儿，这我也知道；可是，对于一群使我受他们驱使的人，我又能怎么办呢？”[b]
  rationale: 修订明确“心里迷乱”的对象是敬拜者，并以“受他们驱使”表达父亲受该民众支配的宽泛含义；脚注保留“服事”与“听命”两种可行的具体理解。开头继续以方括号标示承接上节而补出的谓语，维持源文省略结构的透明度。
