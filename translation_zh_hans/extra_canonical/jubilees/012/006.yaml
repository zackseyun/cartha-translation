review_pass:
  verdict: revise
  source_fidelity: 开头以方括号补出承接上节的“它们是骗局”，处理妥当，也避免引入原文未明说的“羞耻”。但“它们使人心里迷乱”中的泛指“人”弱化了原文分别指向敬拜者的与格结构，宜明确为“使他们心里迷乱”。末句“使我不得不听命的民众”基本可通，却没有清楚呈现该动词在此处可指受人驱使、服事人的语义；正文可采用更宽且自然的“受他们驱使”，并在脚注列出两种具体理解。
  naturalness: 原文整体庄重、流畅。将两个“对……的人来说”调整为“至于那些……”更贴合承接性的汉语表达；末句改为“对于一群……的人，我又能怎么办呢？”可保留原问句的无奈语气并避免“听命的民众”可能造成的修饰关系滞涩。
  terminology: “敬拜”准确对应宗教性崇拜，并应前后一致保留。“骗局”可表达此处“欺骗／迷惑”之意；“心里迷乱”恰当呈现“心的混乱”。“受他们驱使”不预断是单纯服从还是作为偶像服务者服事，较好保留原词幅度。
  issues:
  - severity: low
    issue: 敬拜者的指代被泛化
    rationale: “它们使人心里迷乱”虽自然，但原文结构明确将“心的迷乱”归于敬拜它们者。改作“使他们心里迷乱”可保留这一指向。
  - severity: medium
    issue: 末句对受驱使／服事的语义呈现不足
    rationale: “使我不得不听命的民众”可理解为我听命于民众，却未清楚保留该动词也可指被迫服事他们。采用“使我受他们驱使”较宽，脚注再列“服事他们／听命于他们”，可避免过度限定。
