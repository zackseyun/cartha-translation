  yaml_path: translation/extra_canonical/jubilees/012/006.yaml
  text: '[They are a deception] to those who make them, and confusion of heart to those who worship them. Do not worship them." And his father said to him, "I too know, my son, but what can I do for a people who have made me serve?'
translation:
  language: zh_hans
  text: “至于那些制造它们的人，[它们是骗局][a]；至于那些敬拜它们的人，它们使他们心里迷乱。不要敬拜它们。”他的父亲对他说：“我儿，这我也知道；可是，对于一群使我受他们驱使的人，我又能怎么办呢？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文省略了谓语，承接上一节；方括号内文字为按上下文补出。
    reason: 说明源文的省略结构及译文补足。
  - marker: b
    text: “使我受他们驱使”也可译作“使我服事他们”或“使我听命于他们”。
    reason: 保留እትአዘዝ在受驱使、服事和服从之间的词义幅度，避免限定其具体形式。
lexical_decisions:
- source_word: ከሕተት፡ ልብ
  choice: 使人心里迷乱
  rationale: 该短语直指内心的混乱、迷惑；采用自然现代汉语，同时保留其负面精神状态的含义。
- source_word: ያመልክዎሙ / አታምልክዎሙ
  choice: 敬拜它们／不要敬拜它们
  rationale: 同一词根前后呼应，译法保持一致；“敬拜”准确表达对偶像的宗教性崇拜。
- source_word: እትአዘዝ
  choice: 使我不得不听命
  rationale: 该动词表示服从、听命或服事；使役语境下译为“使我不得不听命”，既表达民众施加的压力，也不误作“使我走迷了路”。
theological_decisions:
- issue: 本节开头为承接上节的省略结构
  choice: 在方括号中补出“它们是骗局”
  alternative: 译作“制造它们的人蒙羞”
  rationale: 吉兹语本节开头只有“对制造它们的人”，句意承接上一节；补出“它们是骗局”能形成通顺汉语，又以方括号明确标示补足内容，避免把原文没有的“羞耻”引入正文。
- issue: 他拉受民众支配的具体性质
  choice: “使我不得不听命”
  alternative: “使我服事他们”
  rationale: 原词语义可涵盖服从与服事，具体对象在本句中并未明说；正文保留较宽的“听命”，脚注列出“服事他们”的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我儿”保留父子对话的古典庄重感，但整体句法保持自然；方括号和脚注公开标示上下文补足与词义歧义。
