  text: And he said[a], "Shall I return to Ur of the Chaldeans, who seek my face so that I should return to them? And what shall I do here in this place? Make the right path straight before you in the hand of your servant, that he may do it, and let me not walk in the error of my heart, my God." And he finished speaking and praying, and behold, one was sent
translation:
  language: zh_hans
  text: 他说：“我该回到迦勒底人的吾珥，回到那些想要见我、要我回到他们那里的人那里吗？[a]我在这里、在这地方又该做什么呢？求你使正路在你面前借你仆人的手修直，使他可以这样行；我的上帝啊，不要让我随自己迷误的心而行。”[b][c]他说完话、祷告完毕后，看哪，有一位被差遣而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “想要见我”直译为“寻找我的面”，这里指他们想要见他，好让他回到他们那里；并非说他们要取他的性命。
    reason: literal_idiom
  - marker: b
    text: 本节祈求部分的吉兹文分词和句法较难确定。正文保留亚伯兰求上帝使正路修直，并让其仆人实际去行，不让他随自己迷误之心而行的基本意思。
    reason: segmentation_note
  - marker: c
    text: “求你使正路在你面前借你仆人的手修直，使他可以这样行”也可译作：“求你在你面前修直正路，让你的仆人亲手去行。”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ገጽየ
  choice: 见我
  rationale: 字面为“我的面”；在“寻求我的面”这一表达中，按现代汉语译为“寻求见我”，既保留“想要见他”的含义，也避免误译成“索取我的性命”。
- source_word: እግባእ
  choice: 我回到
  rationale: 该动词在此表达“返回”，与前句“回到吾珥”相呼应，不泛化为“进去”。
- source_word: ፍኖተ፡ ርቱዐ
  choice: 正路
  rationale: 分别对应“道路”和“正直、正确”，用简洁自然的汉语保留道德与方向两方面的含义。
- source_word: ተፈነወ
  choice: 被差遣而来
  rationale: 保留源文的被动式及未明说身份的主语，不提前揭示下一节才可能说明的差遣者或受差者。
theological_decisions:
- issue: 亚伯兰求问中人的行动与上帝引导的关系
  choice: “求你使正路在你面前借你仆人的手修直，使他可以照着行”
  alternative: “求你在我面前修直正路，并让这事由你仆人的手成就”
  rationale: 源文明确写“在你面前”而非“在我面前”，且末尾动词为主动形式“让他做/行”。正文保留上帝指引与仆人实际行动之间略显紧张的句法，不将其改写为单纯由上帝或单纯由人完成。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。祷告保留直接称呼“我的上帝啊”；“看哪”保留叙事转折和突发显现的语气。对疑难句不作教派化解释，并以脚注交代字面表达及句法歧义。
