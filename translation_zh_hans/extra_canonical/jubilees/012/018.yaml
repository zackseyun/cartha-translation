  text: He causes it to rain in the morning and in the evening; and if he wills, he does not make it come down. And everything is in his hand." And he prayed
translation:
  language: zh_hans
  text: 他使雨在早晨和傍晚降下；他若愿意，就不使雨降下。万物都在他手中。”[b]他祷告了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “他祷告了”在所据吉兹语分段中紧接于此，也可视为下一节叙事的开头。
    reason: 说明所给源文本片段末尾的叙事语句与现代节号分界可能不完全一致。
lexical_decisions:
- source_word: ያዘንም
  choice: 使雨……降下
  rationale: 该动词表达“使下雨、降雨”，以现代汉语的使动结构准确传达。
- source_word: ነግሀ፡ ወሰርከ
  choice: 在早晨和傍晚
  rationale: 分别对应“早晨”和“傍晚”，保留两个并列的时间表达。
- source_word: ወእመ፡ ፈቀደ፡ ኢያወርድ
  choice: 他若愿意，就不使雨降下
  rationale: 条件短语修饰后面的否定动词；明确保留原文的意愿条件和停止降雨的否定含义。
- source_word: ወኵሉ፡ ውስተ፡ እዴሁ
  choice: 万物都在他手中
  rationale: 近形式保留“万物”和“在他手中”的意象，不扩展为特定神学解释。
- source_word: ወጸለየ
  choice: 于是，他祷告
  rationale: 译出所给吉兹语片段末尾的叙事动作；“于是”自然承接前文。
theological_decisions:
- issue: 神对降雨的主权与意愿
  choice: 保留“他若愿意，就不使雨降下”
  alternative: “他若愿意，就使雨降下”
  rationale: 现有吉兹语词序中，条件短语之后明确出现否定形式“ኢያወርድ”，因此正文采用不降雨的理解，同时以脚注保留另一种传统处理。
- issue: “万物都在他手中”的表达
  choice: 保留手的比喻
  alternative: “万物都由他掌管”
  rationale: 直译能保留原文形象，并避免将隐喻直接化约为抽象教义陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“傍晚”比“晚上”更贴近成对的“早晨—傍晚”；保留“在他手中”的圣经式意象。引号按上下文显示这是前一人物话语的结束，末句转回叙事。
