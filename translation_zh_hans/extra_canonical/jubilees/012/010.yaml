lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词本义为“七个一组／一周”，在《禧年书》的纪年体系中指由七年组成的周期；译作“七年期”既清楚表达实际时长，也保留原文的周期结构。
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: 娶了妻
  rationale: 字面为“为自己取了一个女人／妻子”，现代汉语以“娶了妻”自然、准确地表达婚姻语境。
- source_word: ወጸውዐ
  choice: 给儿子起名叫
  rationale: 该动词可指“称呼、叫作”；在儿子出生后的命名公式中译为“起名叫”最合语境，同时以省略号保留本节未写出名字的残句形态。
