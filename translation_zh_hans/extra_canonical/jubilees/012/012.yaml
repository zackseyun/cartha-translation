  yaml_path: translation/extra_canonical/jubilees/012/012.yaml
  text: And in the sixtieth year of the life of Abram, that is, in the fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no one knew it.
translation:
  language: zh_hans
  text: 亚伯兰六十岁那年，就是第四个七年期的第四年，亚伯兰夜间起来，焚烧了偶像之屋，又焚烧了屋内的一切；没有人知道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在《禧年书》的年代计算语境中指由七年组成的周期；译作“七年期”比音译或单称“七”更清楚。
- source_word: ቤተ፡ ጣዖታት
  choice: 偶像庙
  rationale: 字面为“偶像之家”；此处指存放、供奉偶像的建筑，译作“偶像庙”自然且保留原意。
- source_word: አውዐየ
  choice: 焚烧／烧毁
  rationale: 原文动词重复出现；中文分别用“焚烧了”和“全都烧毁了”，既体现重复强调，又避免表达生硬。
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: 无人知道此事
  rationale: 准确传达“没有人知道”的意思；补出“此事”作为自然的中文指代，不增加实质信息。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亚伯兰一生第六十年”保留古代纪年叙述的风格；“第四个七年期的第四年”明确呈现《禧年书》特有的七年周期计算。原文没有需要脚注处理的明显异文或神学歧义。
