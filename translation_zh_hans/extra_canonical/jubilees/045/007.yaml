  text: And Joseph sustained his father and his brothers, and all their livestock, as was sufficient for them during the seven years of famine.
translation:
  language: zh_hans
  text: 约瑟供养他的父亲、兄弟们和他们所有的牲畜，足以使他们度过那七年饥荒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሴሰዮሙ
  choice: 供养
  rationale: 此动词有喂养、维持生活之意；这里以一个谓语统摄父亲、兄弟和牲畜，“供养”既保留共同支配关系，也自然符合饥荒语境。
- source_word: ጥሪቶሙ
  choice: 他们所有的牲畜
  rationale: 该词在本处具体指他们的牲畜或家畜，不宜抽象译作“他们所有的一切”。
- source_word: በከመ፡ የአክሎሙ
  choice: 所供给的足以让他们度过
  rationale: 表达“按足够他们所需的程度”，采用现代汉语自然句式，同时不额外引入第二个独立的供给动作。
- source_word: ለሰብዐቱ፡ ዓመታት፡ ዐባር
  choice: 七年饥荒
  rationale: 准确传达持续七年的饥荒时期。
