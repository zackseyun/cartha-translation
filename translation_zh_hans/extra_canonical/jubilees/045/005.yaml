base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/005.yaml
  text: And Joseph and his brothers ate bread before their father, and they drank wine. And Jacob rejoiced with very great joy because he saw Joseph eating with his brothers and drinking before him. And he blessed the Creator of all, who had preserved him and had preserved for him his twelve sons.
translation:
  language: zh_hans
  text: 约瑟和他的弟兄们在父亲面前吃饼，喝酒。雅各极其欢喜，因为他看见约瑟和弟兄们一同吃饼，并在他面前饮酒。他就称颂万有的创造主；创造主保全了他，也为他保全了他的十二个儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: 饼
  rationale: 原词指饼或食物中的面饼；采用简洁而具经文语体的“饼”，不泛化为“饭”。
- source_word: ወይነ
  choice: 酒
  rationale: 该词明确指葡萄酒；现代汉语正文用“酒”自然清楚。
- source_word: ተፈሥሐ / ፍሥሓ ዐቢየ ጥቀ
  choice: 极其欢喜
  rationale: 保留同根名词与动词形成的强调意义，以自然汉语表达强烈喜乐。
- source_word: ፈጣሪ ኵሉ
  choice: 万有的创造主
  rationale: 直译“创造一切者”，既保留神学称号，也符合庄重的现代汉语。
- source_word: ዐቀቦ / ዐቀበ ሎቱ
  choice: 保全了他／为他保全了
  rationale: 保留同一动词的重复及两个不同受益关系：雅各本人蒙保守，十二个儿子也为他得以存留。
theological_decisions:
- issue: “保全了他”中代词的指向
  choice: 保留为“他”，按紧邻叙事主体理解为雅各
  alternative: 明确写作“保全了雅各”
  rationale: 源文使用第三人称代词；正文保留其形式，不作超过文本的明示化处理。
- issue: 创造主与保全行动的关系
  choice: 以分号承接，并重复“创造主”作为主语
  alternative: 使用关系从句“那保全了他……的”
  rationale: 源文可顺畅理解为对创造主的关系从句。中文重复称号可避免长关系结构产生修饰歧义，同时不改变神为保全者的陈述。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。保留“在父亲面前”及“就在自己面前”的空间性重复，也保留“保全”动词的修辞重复。源文开头的“ስሙ”很可能是上一句遗留的章节切分片段，依照经节语法和英语审校层未纳入本节正文。
