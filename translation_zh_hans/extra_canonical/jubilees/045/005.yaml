    issue: “就在自己面前”句法悬空且指代不明
    rationale: 源文的“在他面前”修饰约瑟饮酒，其中“他”承接雅各。草稿将其置于“吃喝”之后并用“自己”表达，中文既不自然，也可能被读作约瑟在自己面前吃喝。
