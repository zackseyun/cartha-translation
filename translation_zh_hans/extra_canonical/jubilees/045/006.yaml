  to: 约瑟给父亲和兄弟一份产业，使他们可以住在歌珊地、拉美西斯和它的全境，就是他在法老面前所管辖的地方。[a]以色列和他的众子住在歌珊地，就是埃及地最好的部分。以色列进入埃及的时候已经一百三十岁。
