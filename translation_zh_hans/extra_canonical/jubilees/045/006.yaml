  yaml_path: translation/extra_canonical/jubilees/045/006.yaml
  text: And Joseph gave his father and his brothers a possession, so that they might dwell in the land of Goshen, and in Rameses and all its territory, which he ruled before Pharaoh. And Israel and his sons settled in the land of Goshen, the best part of the land of Egypt. And Israel was one hundred and thirty years old when he entered Egypt.
translation:
  language: zh_hans
  text: 约瑟给父亲和兄弟一份产业，使他们可以住在歌珊地、拉美西斯和它的全境，就是他在法老面前所管辖的地方。[a]以色列和他的众子住在歌珊地，就是埃及地最好的部分。以色列进入埃及的时候已经一百三十岁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在法老面前”也可理解为“在法老属下”。原文动词的意思是“治理、管辖”，不是“获准”。
    reason: 保留介词短语的可能臣属含义，并说明原文动词的基本意义，避免将其误译为“获准”或作过度政治性解释。
lexical_decisions:
- source_word: ሀብተ
  choice: 产业
  rationale: 此处指赐给家族居住并持有的地产或基业；“产业”既保留所有权意味，也符合本段土地安置的语境。
- source_word: ምድረ፡ ጌሤም
  choice: 歌珊地
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: ራሜሲና
  choice: 拉美西斯
  rationale: 采用现代中文常见音译，并保留原文将其与歌珊地并列的表达。
- source_word: ኵሎ አድያሚሃ
  choice: 其四境
  rationale: 表示拉美西斯周围或所属的全部地域；“四境”简洁而庄重，避免误解为现代行政区。
- source_word: ይኴንን
  choice: 管辖
  rationale: 该动词在此表示治理、统辖，不宜译作“获准”；“管辖”自然呈现约瑟的行政权柄。
- source_word: ምሥናይሃ
  choice: 最好的部分
  rationale: 按其最高级含义译出歌珊是埃及地上佳之处，同时不额外指定肥沃程度等原文未明说的性质。
theological_decisions:
- issue: 约瑟治理与法老权柄的关系
  choice: 他在法老面前所管辖的地方
  alternative: 经法老批准的地方
  rationale: 原文动词明确指向“治理、管辖”，而非被动的“批准”。“在法老面前”保留原文措辞及其可能包含的臣属或代表关系，不把政治关系解释得过死。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“赐给”“产业”“四境”维持古代叙事的尊严感；句法适度拆分，以便普通读者顺畅理解。
