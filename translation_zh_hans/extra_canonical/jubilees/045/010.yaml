revisions:
- from: 因为在那七年的饥荒中，河水没有泛滥[a]，也没有灌溉土地，只有沿河少数几处例外；但如今河水泛滥了，埃及人就耕种那地，并在那一年收获了极多的粮食。
  to: 因为在那七年的饥荒中，河水没有泛滥[a]，也没有灌溉土地，除在河岸边少数地方以外；但如今河水泛滥了，埃及人就播种那地，并在那一年收获了极多的谷物。
  rationale: 将“耕种”改为“播种”，以保留原文明确的农业动作；将例外短语调整为“除在河岸边少数地方以外”，使句法关系更清晰；以“谷物”对应所收聚的粮食作物。其余内容忠实且自然，脚注锚点与正文一致。
