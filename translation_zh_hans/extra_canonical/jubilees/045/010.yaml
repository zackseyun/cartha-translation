  yaml_path: translation/extra_canonical/jubilees/045/010.yaml
  text: For during the seven years of famine it had not overflowed and had not watered the land, except in a few places by the banks of the river; but now it overflowed, and Egypt sowed the land and gathered very much grain in that year.
translation:
  language: zh_hans
  text: 因为在那七年的饥荒中，河水没有泛滥[a]，也没有灌溉土地，除在河岸边少数地方以外；但如今河水泛滥了，埃及人就播种那地，并在那一年收获了极多的谷物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“河水没有上涨”。
    reason: 相关动词可着重河水升高或漫溢；正文依土地得不到灌溉的语境译为“泛滥”。
lexical_decisions:
- source_word: ዐባር
  choice: 河水……泛滥
  rationale: 按上下文，其主语是尼罗河；该词在此描写河水漫溢。中文补出“河水”，使隐含主语清楚而不增添新的所指。
- source_word: ኢሰቀየ
  choice: 没有灌溉土地
  rationale: 动词意为使土地得水、灌溉；据此避免误译为“没有上涨”。
- source_word: ኀበ፡ ድንጋጌ፡ ፈለግ
  choice: 沿河……几处
  rationale: 表达河流边缘、岸边的地点，采用自然的现代汉语。
- source_word: ወዘርኡ፡ ግብጽ፡ ምድረ
  choice: 埃及人就耕种那地
  rationale: 原文直陈“埃及播种土地”；中文以“埃及人”为施事，并用“耕种”涵盖播种耕作的语境。
- source_word: ወአረሩ፡ ብዙኀ፡ ሥርናየ
  choice: 收获了极多的粮食
  rationale: 保留丰收的数量强调；ሥርናየ可指谷物，译作“粮食”较符合普通现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“河水”承接语境中的河流，正文保留饥荒期间不漫溢、不灌溉与当年泛滥、丰收之间的对照。
