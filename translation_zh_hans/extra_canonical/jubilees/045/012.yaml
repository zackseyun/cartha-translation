  text: And Joseph took for the king a fifth of everything that was produced, and four parts he left to them for food and for seed.
translation:
  language: zh_hans
  text: 约瑟从一切出产中取了五分之一归给王，其余四份留给他们作食物和种子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአ
  choice: 取了
  rationale: 此处表示约瑟征收、收取出产中的一份；“取了”自然且不过度限定行政方式。
- source_word: እምኵሉ፡ ዘፈረየ
  choice: 从一切出产中
  rationale: 按源文介词结构表达从全部产物中抽取比例，并避免误解为只取专为王生产之物。
- source_word: ኃምስቶ
  choice: 五分之一
  rationale: 语境与对举的“四份”表明所指为五份中的一份。
- source_word: ለንጉሥ
  choice: 归给王
  rationale: 保留与格所表达的受益或归属关系，不额外解释为税赋制度。
- source_word: ራብዕተ፡ እደ
  choice: 其余四份
  rationale: 直译为“四份”；补入“其余”使现代汉语中的五份分配关系清楚。
- source_word: ለሲሲት፡ ወለዘርእ
  choice: 作食物和种子
  rationale: 分别对应食用与播种用途，采用简洁、通行的现代汉语。
