  text: '...his father Jacob in the land of Goshen, and he embraced his father''s neck and wept. And Israel said to Joseph, "Now let me die, since I have seen you; and now may the LORD, the God of Israel, the God of Abraham and the God of Isaac, be blessed—he who has shown mercy and compassion."'
translation:
  language: zh_hans
  text: ……约瑟来到歌珊地他父亲雅各那里，抱住父亲的颈项，哭了。以色列对约瑟说：“我既然见到了你，现在就是死也可以了。愿耶和华——以色列的上帝、亚伯拉罕的上帝、以撒的上帝——受称颂；他曾施怜悯和慈悲。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐቀፈ፡ ክሳደ፡ አቡሁ
  choice: 抱住父亲的颈项
  rationale: 按字面保留“拥抱/抱住……颈项”的身体动作，同时采用自然的现代汉语表达。
- source_word: እሙት፡ ይእዜሰ
  choice: 现在就是死也可以了
  rationale: 表达雅各见到约瑟后甘愿死去的语气，比生硬的“现在让我死”更符合现代汉语，同时不改变其含义。
- source_word: ይትባረክ፡ እግዚአብሔር
  choice: 愿耶和华……得到称颂
  rationale: 保留祝愿式被动语义；以“耶和华”对应神圣名号，并避免误写成上帝赐福给人。
- source_word: ዘአክአለ፡ ምሕረተ፡ ወሣህሎ
  choice: 他施行了怜悯和慈悲
  rationale: 依据所给吉兹文及修订意见，正面陈述上帝彰显怜悯与慈悲，不采用“没有收回/没有扣留”的否定式转述。
theological_decisions:
- issue: 对上帝的称颂与其怜悯行为之间的关系
  choice: 用分号连接：“……得到称颂；他施行了怜悯和慈悲。”
  alternative: 用定语从句：“……那施行怜悯和慈悲的上帝得到称颂。”
  rationale: 分号既保留原文关系从句对上帝的说明，也使汉语句法清楚，不额外限定怜悯的对象或具体方式。
- issue: “以色列”在叙事中的指称
  choice: 保留“以色列对约瑟说”
  alternative: 改为“雅各对约瑟说”
  rationale: 原文此处明确使用“以色列”，应保留名字转换及其叙事神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文开头以省略号标明该句承接上一节，因为现存片段从“他的父亲雅各……”开始，支配这一宾语的动词可能位于前一节；译文仍完整呈现本节所给文本，避免再次漏译前半句。
