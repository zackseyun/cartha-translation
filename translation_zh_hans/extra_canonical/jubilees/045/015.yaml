  yaml_path: translation/extra_canonical/jubilees/045/015.yaml
  text: And he blessed them, and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the cave of Machpelah[15] in the land of Canaan, near Abraham his father.
translation:
  language: zh_hans
  text: 他祝福他们，又在那地把双份产业给了约瑟。他与列祖同眠，葬在迦南地的麦比拉洞[a]里，靠近他父亲亚伯拉罕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“双重的洞”或“双洞”；这里对应别处所称的麦比拉洞。
    reason: 说明地名译法及原文的字面意义。
lexical_decisions:
- source_word: ባረኮሙ
  choice: 祝福了他们
  rationale: 按该动词及三复数宾语后缀直译，清楚保留受祝福者为复数。
- source_word: ክልኤተ መክፈሊተ
  choice: 双份的产业
  rationale: 字面为“两份/双份”，语境指约瑟在土地产业上所得的双份；补出“产业”使现代汉语自然，同时不限定具体分地方式。
- source_word: ኖመ ምስለ አበዊሁ
  choice: 与列祖同眠
  rationale: 保留古代死亡委婉语及其家族归属意象，符合庄重的经文语体。
- source_word: በዐት ዘካዕበት
  choice: 麦比拉洞
  rationale: 该表达字面涉及“双重之洞”，在创世记传统中对应祖坟麦比拉洞；正文采用通行地名，脚注交代字面含义。
- source_word: ቅሩበ አብርሃም አቡሁ
  choice: 靠近他父亲亚伯拉罕
  rationale: 依原文保留空间关系“靠近”以及“他父亲”的族长称谓，不改写为“祖先”。
theological_decisions:
- issue: “与列祖同眠”是死亡惯用语还是墓葬陈述
  choice: 保留“与列祖同眠”
  alternative: 去世了
  rationale: 原文随后另述安葬，因此此语首先委婉表达死亡，也带有归于列祖的传统意象；不应将其简化而抹去张力。
- issue: 亚伯拉罕被称为“他父亲”
  choice: 直译为“他父亲亚伯拉罕”
  alternative: 他的祖先亚伯拉罕
  rationale: 原文使用“父亲”，可作广义祖先称谓；直译能保留古代谱系语言，而不按现代亲属层级替作者澄清。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“双份的产业”兼顾原文形式与汉语自然度；“与列祖同眠”保留传统死亡委婉语；地名用通行译名“麦比拉洞”，并以脚注呈现原文词义。
