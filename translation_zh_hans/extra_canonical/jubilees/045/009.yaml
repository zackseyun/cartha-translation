  yaml_path: translation/extra_canonical/jubilees/045/009.yaml
  text: And the years of famine were completed[9], and Joseph gave the people who were in the land seed and provisions, so that they might sow the land in the eighth year, because the river had overflowed over all the land of Egypt.
translation:
  language: zh_hans
  text: 饥荒的年头结束了，约瑟就把种子和粮食给了住在那地的民众，使他们在第八年播种土地，因为河水已经漫过埃及全地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐባር
  choice: 饥荒
  rationale: 该词在上下文中指持续多年的饥荒；译作“饥荒”自然且准确。
- source_word: አሕዛብ
  choice: 各族
  rationale: 该词通常指“民族、民众、各族”，并非单纯表示地点内的“人民”；这里以“境内的各族”保留其群体色彩。
- source_word: ዘርአ
  choice: 种子
  rationale: 对应播种所需的种子，与后文“耕种土地”相呼应。
- source_word: ሲሳተ
  choice: 粮食
  rationale: 表示供给、口粮或生活所需；在饥荒结束的语境中译作“粮食”最为清楚。
- source_word: በሳምን ዓመት
  choice: 在第八年
  rationale: ግዕዝ语ሳምን表示“第八”；也符合七年饥荒结束后进入下一年的上下文。
- source_word: መልአ ፈለግ ዲበ ኵሉ ምድረ ግብጽ
  choice: 河水已经漫过埃及全地
  rationale: 字面结构为“河充满/漫及埃及全地”；“漫过”自然表达尼罗河泛滥并覆盖土地的情景，同时不夸大为灾害性洪水。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“第八年”直接按ግዕዝ语原文翻译，不沿用旧译“第七年”。“各族”保留አሕዛብ的群体含义；“河水”依埃及语境自然指尼罗河，但正文不补出原文未明说的河名。
