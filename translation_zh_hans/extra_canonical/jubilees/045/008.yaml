  - severity: low
    issue: “一切所有”可能过早将末项限定为“财物／所有物”。
    rationale: 末项可宽泛地指“一切”；译作“以及一切”能保留其范围及紧凑并列结构的开放性，同时不改变约瑟为取得者这一主动句法。
