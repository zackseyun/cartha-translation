  yaml_path: translation/extra_canonical/jubilees/045/008.yaml
  text: And the land of Egypt suffered because of the famine, and Joseph acquired all the land of Egypt for Pharaoh in exchange for grain, and he acquired the people, their livestock, and everything for Pharaoh.
translation:
  language: zh_hans
  text: 埃及地因饥荒而受苦。约瑟用粮食为法老购得了埃及全地，又为法老购得了百姓、他们的牲畜以及一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切”也可译作“一切所有”。原文末句的并列关系较紧凑，但动词表达的是约瑟为法老取得百姓、他们的牲畜及一切，并非这些东西自行“归了法老”。
    reason: 说明末句主动动词及并列对象的处理，并保留“一切”所指范围的不确定性。
lexical_decisions:
- source_word: ሐመተ
  choice: 衰败
  rationale: 该动词在此描写埃及地受饥荒摧残、陷入困顿；“衰败”既保留土地拟人化的表达，也比单说“受苦”更符合现代汉语语境。
- source_word: አስተጋብአ
  choice: 购得
  rationale: 此处指约瑟以粮食为代价把埃及土地收归法老，译作“购得”清楚表达交易及取得所有权的含义。
- source_word: በእክል
  choice: 用粮食
  rationale: 介词短语表示取得土地所付的对价或手段，故译为“用粮食”。
- source_word: ሰብአኒ
  choice: 百姓
  rationale: ሰብእ 表示人或百姓，后缀 -ኒ 有“也、又”的连接作用，并非第三人称所属形式，因此不译为“他们的百姓”。
- source_word: እንስሳሆሙኒ
  choice: 他们的牲畜
  rationale: 保留第三人称复数所属后缀“他们的”，并把附加的 -ኒ 通过全句的“又”及并列结构自然表达。
- source_word: አጥሪየ
  choice: 购得了
  rationale: 按动词理解，主语仍是约瑟，表示他为法老取得这些对象；避免误作名词“财产”或改成“归了法老”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“衰败”保留原文对埃及地的拟人化描写；后半句重复“为法老购得”，以明确原文主动动词及约瑟持续作主语，同时避免误解并列对象之间的所属关系。
