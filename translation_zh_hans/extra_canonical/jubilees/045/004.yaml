  text: from his servant Jacob. Great for me is this, that I have seen your face while I am still alive, because the vision that I saw at Bethel was truly established. Blessed be the LORD my God forever and ever, and blessed be his name."
translation:
  language: zh_hans
  text: 从他的仆人雅各那里来的。对我而言，如今我还活着，又见到了你的面，实在是大事！因为我在伯特利所见的异象确实应验了。愿耶和华我的上帝永永远远受称颂；他的名也当受称颂。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢይ፡ ሊተ፡
  choice: 对我来说，这是何等大的事
  rationale: 直译为“这对我是大的”，用现代汉语感叹句传达说话者强烈的惊喜，同时保留原文评价性的表达。
- source_word: ዘርኢኩ፡ ገጸከ፡
  choice: 见到你的面
  rationale: 保留闪语式“见你的面”的庄重措辞，而不简化成较口语的“见到你”。
- source_word: አማን፡ ሀለወ፡
  choice: 确实应验了
  rationale: 该短语表达先前异象已被证实、成为现实；“应验了”贴合预示性异象的语境，又避免加入具体实现方式。
- source_word: ለዓለመ፡ ዓለም፡
  choice: 永永远远
  rationale: 采用汉语圣经文体中自然且庄重的永恒时间表达。
- source_word: እግዚአብሔር፡
  choice: 耶和华
  rationale: 按上下文作为以色列上帝的专名处理，与“我的上帝”并列时自然清晰。
theological_decisions:
- issue: 伯特利异象与当前事件的关系
  choice: 异象确实应验了
  alternative: 异象确实得到了证实
  rationale: 原文可表达异象真实成立或已获实现；此处采用“应验”体现叙事中的实现关系，但不说明异象的具体内容，以免过度诠释。
- issue: 祝颂语的语气
  choice: 愿耶和华我的上帝永永远远受称颂；他的名也当受称颂
  alternative: 耶和华我的上帝是永永远远当称颂的；他的名也是当称颂的
  rationale: 原文为祝颂公式，汉语用“愿……受称颂／当受称颂”既庄重自然，也不把祝愿、宣告和命令之间的语气张力完全消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“见到你的面”“永永远远”等经文语体；开头是承接上文的残句，因此按原文保留其不完整性，不擅自补出所送之物或发言者身份。
