  text: 以色列进入埃及地，来到歌珊地；那天是四月初一。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቦአ
  choice: 进入
  rationale: 该动词表示“进入”；以简洁的现代汉语再现叙事动作。
- source_word: እስራኤል
  choice: 以色列
  rationale: 按专名音译；此处保留原文的单数集体称谓，不改写为“以色列人”。
- source_word: ብሔረ፡ ግብጽ
  choice: 埃及地
  rationale: 表示埃及这一地域或国土；“埃及地”既贴近原文，也符合圣经叙事语体。
- source_word: ምድረ፡ ጌሤም
  choice: 歌珊地
  rationale: 采用该地名通行的现代中文圣经译名。
- source_word: አመ፡ ሠርቀ፡ ወርኅ
  choice: 那天是四月初一
  rationale: 该表达直指第四个月的月初或新月之日；现代汉语用“初一”清楚表达月份首日。
theological_decisions:
- issue: “以色列”的所指
  choice: 保留“以色列”
  alternative: 译作“以色列人”或“雅各”
  rationale: 原文使用“以色列”这一名称，可能指雅各本人，也可能兼具其家族共同体的集体意味；不在正文中替读者消除这一张力。
- issue: 月份体系
  choice: 译作“四月”
  alternative: 补明某一宗教历法或现代公历月份
  rationale: 原文仅说第四个月，未在本节界定历法体系，因此不额外指定。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。用分号连接行程地点与日期，避免英文式层层重复；保留“埃及地—歌珊地”的范围递进关系。
