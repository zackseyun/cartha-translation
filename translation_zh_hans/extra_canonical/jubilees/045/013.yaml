  yaml_path: translation/extra_canonical/jubilees/045/013.yaml
  text: And Joseph made it a statute for the land of Egypt to this day. And Israel lived in the land of Egypt seventeen years, and all the days that he lived were three jubilees, one hundred and forty-seven years. And he died in the fourth year of the fifth week of the forty-fifth jubilee.
translation:
  language: zh_hans
  text: 约瑟为埃及地定下这律例，直到今日。以色列在埃及地住了十七年；他一生的年日共三个禧年，也就是一百四十七年。他死于第四十五个禧年的第五个七年期第四年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ
  choice: 律例
  rationale: 该词在此指约瑟为埃及地确立并持续施行的规章；“律例”既保留正式、制度性的语气，也适合庄重的经文体。
- source_word: እዮቤሌውስ
  choice: 禧年
  rationale: 这是《禧年书》的核心纪年单位，每个禧年为四十九年；采用现代中文圣经语境中通行的“禧年”。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词指由七年组成的周期；译作“七年期”可清楚区别于普通的一周，并准确呈现本书的历法体系。
theological_decisions:
- issue: “三个禧年”与“一百四十七年”的关系
  choice: 以“也就是”连接，保留两种并列的寿数表达
  alternative: 删去“三个禧年”，只译“一百四十七年”
  rationale: 原文同时保留禧年纪法和实际年数；三个四十九年周期正是一百四十七年，因此不应省略任何一种表达。
- issue: “以色列”的所指
  choice: 保留“以色列”这一姓名
  alternative: 改译为“雅各”
  rationale: 原文明确使用“以色列”；虽指雅各本人，仍应保留原文称谓，避免替原文消解名称转换所带来的叙事意味。
translation_notes:
  register: 采用现代、庄重而清晰的简体中文。“定下这律例”体现制度确立及延续至今；末句将嵌套纪年自然整理为“第四十五个禧年的第五个七年期第四年”，不改变原有时间层级。
