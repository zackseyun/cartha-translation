  text: And that year was the first year of the fourth week of the forty-fifth jubilee[11].
translation:
  language: zh_hans
  text: 那一年，是第四十五个禧年[a]中第四个七年期的第一年。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“禧年”指由七个七年期组成的四十九年周期。
    reason: chronology_clarification
  - marker: b
    text: 这一纪年与本章前面的纪年公式似乎难以协调。此处依校勘文本译作“第四十五个禧年”；传抄或文本处理过程中可能出现了讹误。另有旧译作“第四十四个”。
    reason: textual_variant
lexical_decisions:
- source_word: ዓመት
  choice: 年
  rationale: 按其通常时间意义直译，符合本节纪年公式。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 此词在《禧年书》的纪年体系中指由七年组成的周期；译作“七年期”比单译“周”更清楚。
- source_word: እዮቤሌው
  choice: 禧年
  rationale: 保留本书以四十九年为一个禧年周期的专门纪年用语。
- source_word: ዘአርብዓ፡ …
  choice: 第四十五个
  rationale: 依据查理士1895年校勘本所指向的“四十又五”读法；所提供的电子文本在数字后半部分疑有OCR讹误。
