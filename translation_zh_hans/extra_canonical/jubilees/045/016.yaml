  text: in the tomb that he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16], so that he might preserve them and renew them for his children until this day.
translation:
  language: zh_hans
  text: 在希伯仑地的双重洞穴中，就是他为自己挖掘的坟墓中。他把自己所有的书和祖先的书都交给儿子利未，要他保存并为他的子孙更新这些书[a]，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更新这些书”也可指借着重抄、修复或重新交付，使这些书得以保存并传给后代。
    reason: 保留ያሐድሶን（“更新、使之重新”）在书卷保存语境中的词义幅度，不限定为某一种具体做法。
lexical_decisions:
- source_word: በዐት፡ ዘካዕበት
  choice: 麦比拉洞
  rationale: 该短语字面可理解为“双重的洞”，但在希伯仑安葬语境中指向传统地名麦比拉洞；采用现代中文通行专名，避免生硬直译。
- source_word: ዘከረየ፡ ለርእሱ
  choice: 他为自己挖掘的
  rationale: 保留原文“为自己”及挖掘动作，修饰“坟墓”。
- source_word: መጻሕፍቲሁ፡ ወመጻሕፍተ፡ አበዊሁ
  choice: 自己所有的书和祖先的书
  rationale: 分别对应“他的全部书籍”与“他列祖/祖先的书籍”，不把后者限缩为父亲一人的书。
- source_word: ይዕቀቦን
  choice: 妥善保存
  rationale: 表达看守、保全这些书卷之意；“妥善”使现代汉语自然，但不增加制度性含义。
- source_word: ያሐድሶን
  choice: 重新传承
  rationale: 词义核心为更新、使之重新；结合书卷与后代的语境，可涉及重抄、修复或重新传递，因此正文采用较自然但仍需脚注说明的表达。
- source_word: ለውሉዱ
  choice: 为自己的子孙
  rationale: 原文单数领属形式可泛指利未的后裔；“子孙”在现代中文中自然涵盖后代。
theological_decisions:
- issue: 书卷“更新”的具体方式
  choice: 正文译作“重新传承”，并以脚注保留多种可能
  alternative: 重抄／修复／更新
  rationale: 原词并未明确指定是抄写、修复还是重新传给后代，不应将古代文本保存方式固定为单一解释。
- issue: “直到今日”的叙述视角
  choice: 保留“直到今日”
  alternative: 直到那一天
  rationale: 该表达可反映叙述者所处的“今日”，也可能按形式作“这日”；依来源及上下文保留传统而开放的时间指称。
translation_notes:
  register: 采用现代、庄重且易懂的叙事文体。“麦比拉洞”使用中文圣经传统中熟悉的地名；全句保留原文连续叙事及书卷传承的古代语境。脚注标记[a]已置于正文相关位置。
