    reason: textual_variant
lexical_decisions:
- source_word: ራብዕ
  choice: 第四个月
  rationale: 原词意为“第四”，在本节切分处承接上节的“月”；补出“个月”可使现代汉语自然，同时避免误译为“第四年”。
- source_word: ሣልስ
  choice: 第三个七年期
  rationale: 《禧年书》的年代结构以七年为一周期；译作“第三个七年期”比孤立的“第三周”更清楚。
- source_word: ይትቀበል
  choice: 迎接他
  rationale: 此处表示约瑟前来接迎某人；宾语代词在本节来源片段中未明说其身份，故保留“他”，不擅自补作“父亲雅各”。
