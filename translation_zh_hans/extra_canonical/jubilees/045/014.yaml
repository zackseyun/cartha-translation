  yaml_path: translation/extra_canonical/jubilees/045/014.yaml
  text: And before he died, Israel blessed his sons and told them everything that would happen to them in the land of Egypt and he made known to them what would come upon them in later days.
translation:
  language: zh_hans
  text: 以色列临死以前，为他的众子祝福，把他们在埃及地将要遭遇的一切都告诉了他们，又使他们知道日后将临到他们的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስራኤል
  choice: 以色列
  rationale: 按原文保留族长雅各的盟约名“以色列”。
- source_word: ባረኮሙ
  choice: 为……祝福
  rationale: 准确表达动词“祝福”及其复数受词所指的众子。
- source_word: ዘኮነ፡ ይረክቦሙ
  choice: 将要遭遇的一切
  rationale: 原文表达将发生并临到他们的全部事情；“遭遇”在此自然涵盖事件临到某人，并不预先限定吉凶。
- source_word: በደኃሪ፡ መዋዕል
  choice: 末后的日子
  rationale: 保留原文“后来的／末后的日子”的传统时间表达及其可能具有的末世意味，不简化为普通的“后来”。
- source_word: ይመጽእ፡ ላዕሌሆሙ
  choice: 临到他们
  rationale: 贴近原文“来到他们之上”，同时符合现代汉语圣经语体。
- source_word: እይድያሙ
  choice: 让他们知道
  rationale: 依据校勘说明将末词理解为“他使他们知道／向他们表明”，使末句保留独立谓语。
theological_decisions:
- issue: “末后的日子”是否作明确末世论解释
  choice: 保留“末后的日子”
  alternative: 日后的岁月／后来
  rationale: 原文既可泛指后世，也可能带有末世色彩；译文保留这种张力，不替读者作教义性判定。
- issue: 以色列所告知之事是否表述为预言
  choice: 不用“预言”，只译“告诉”与“让……知道”
  alternative: 向他们预言
  rationale: 原文强调告知和使人知道；虽有预示未来的性质，却不宜额外加入原文未明说的术语。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“临死以前”自然表达“在他死之前”；“众子”简洁体现复数。“又让他们知道”反映经校勘恢复的末尾动词，并与前面的“告诉”形成适度变化。
