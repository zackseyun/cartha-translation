base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/007.yaml
  text: Thus, there shall not be in Israel one who defiles an Israelite virgin. And if there is any man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed shame in Israel. And as for the woman,
translation:
  language: zh_hans
  text: 所以，在以色列中不可有人玷污以色列的处女。以色列中若有人想把自己的女儿，甚至自己的姐妹，嫁给任何一个出自外族的人，他必被处死；众人要用石头打死他，因为他在以色列中行了可耻的事。至于那女子，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在原文中未完，意思接续下一节。或译：“而那女子，也要……”
    reason: 说明跨节悬句，并保留原文末语在句法上的歧义与旧译可能。
lexical_decisions:
- source_word: ለአርኵሶ
  choice: 玷污
  rationale: 该动词表达使之不洁、加以玷辱；“玷污”既贴近原义，也符合此处关于以色列处女受辱的语境。
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: 出自外族的人
  rationale: 原文直译为“来自列族之种的人”；“出自外族”保留血统或族属意味，又比“外邦人的后裔”更自然，且不额外引入宗派色彩。
- source_word: ሞተ፡ ለይሙት
  choice: 必被处死
  rationale: 这是闪语式加强表达，字面近于“死，他要死”；译作“必被处死”传达确定的死刑判决。
- source_word: በእብን፡ ይውግርዎ
  choice: 众人要用石头打死他
  rationale: 原文为以石头投掷他；按刑罚语境译作“用石头打死”，清楚表达石刑。
- source_word: ገብረ፡ ኀፍረተ
  choice: 行了可耻的事
  rationale: 原文表达“作了羞耻/耻辱”；此译保留道德羞辱含义，同时使用自然现代汉语。
- source_word: ወለብእሲትሂ
  choice: 至于那女子
  rationale: 前缀ለ使“女子”成为承接下节动作的前置对象；译作悬置语，避免误解为她也在本节中被石头打死。
theological_decisions:
- issue: “外族/列国”所指范围
  choice: 外族
  alternative: 外邦人／列国的后裔
  rationale: 原文强调非以色列的诸族或族裔身份；“外族”保留对比，却不把范围限定为某一后来的神学术语。
- issue: 末句女子与刑罚的句法关系
  choice: 以“至于那女子”悬接下节
  alternative: “那女子也……”并入前句
  rationale: 原文的格位结构表明女子是下一动作的前置对象。悬接可保留跨节句法，并避免暗示她与男子同受石刑或同为前述行为的主语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“甚至”体现女儿与姐妹的递进并列；“嫁给”按上下文表达交付女子成婚，但未扩展为婚礼或盟约术语。末句刻意保留未完结构，以忠实呈现原文跨节衔接。
