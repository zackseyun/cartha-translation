  yaml_path: translation/extra_canonical/jubilees/030/020.yaml
  text: And on the day when Jacob's sons killed Shechem, a record was written for them in heaven that they had performed righteousness and uprightness and vengeance on the sinners, and it was written down for blessing.
translation:
  language: zh_hans
  text: 在雅各的儿子们杀死示剑人的那一天，天上为他们写下了一份记录[a]，记明他们施行了公义和正直，并对罪人施行了报复；这事也被记下，作为福分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记录”原文也可译作“书卷”。
    reason: 说明原词既可指书卷，也可在此语境中指天上的记载文书。
lexical_decisions:
- source_word: መጽሐፍ
  choice: 记录
  rationale: 该词基本义为“书、书卷”，在这里指天上写下、记载行为的文书；译作“记录”符合上下文，也比直译“书”更自然。
- source_word: ጽድቀ ወርትዐ
  choice: 公义和正直
  rationale: 分别保留两个并列的伦理评价词，不合并为单一概念。
- source_word: ወበቀለ ላዕለ ኃጥአን
  choice: 并向罪人施行了报应
  rationale: 保留“向罪人施行报应／报复”的强烈司法性措辞，不将其弱化为一般的“惩罚”，也不额外加入现代法律概念。
- source_word: ለበረከት
  choice: 记为福分
  rationale: 原文简洁地表达“为祝福／福分而记下”；此译法保留其结果或用途上的开放性。
theological_decisions:
- issue: 经文对雅各众子暴力行为的正面评价
  choice: 直接译出他们“施行了公义和正直，并向罪人施行了报应”
  alternative: 以较中性的措辞译作“惩治了罪人”或加入解释性保留
  rationale: 原文明确将这些行为评价为公义、正直和对罪人的报应；译文不应因其与其他传统叙述之间存在张力而弱化或调和。
- issue: “记为福分”的对象与作用
  choice: 保留简洁表达“这事也被记为福分”
  alternative: 明确解释为“使他们蒙福”
  rationale: 原文未充分说明福分具体临到谁或以何种方式实现，因此避免把含义限定为他们个人蒙福。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文对事件的明确伦理判断及其神学张力，不增添辩护、谴责或调和性说明。
