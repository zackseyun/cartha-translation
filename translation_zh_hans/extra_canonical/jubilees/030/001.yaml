  text: And in the first year of the sixth week[1], he went up to Salem, east of Shechem, in peace, in the fourth month.
translation:
  language: zh_hans
  text: 第六个七年期的第一年，四月，雅各平安地上到示剑东边的撒冷。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的文本划分较为困难。埃塞俄比亚文把这事置于第六个七年期的第一年，并说明撒冷位于示剑东边；从上下文可知，返回迦南的人是雅各。
    reason: segmentation_note
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词指由七年组成的周期；译作“七年期”比单说“周”更能让现代读者明白这里的纪年方式。
- source_word: ሰሌማሃ
  choice: 撒冷
  rationale: 按地名处理，并采用现代中文圣经语境中常见的音译“撒冷”，不把它解释为普通名词“平安”。
- source_word: ጽባሒሁ ለሰቂማ
  choice: 在示剑东边
  rationale: 按方位关系自然表达，保留撒冷相对于示剑的位置。
- source_word: ዐርገ
  choice: 上到
  rationale: 保留原文表示上行、登往的动词色彩，同时符合中文叙事表达。
- source_word: ፬ይ
  choice: 四月
  rationale: 依据 Charles 1895 标准埃塞俄比亚文本所见“第四月”理解；不采纳先前误作“七月”的译法。
theological_decisions:
- issue: 动作主体的明示
  choice: 雅各
  alternative: 他
  rationale: 本节上下文中的主体是雅各；中文在段落开头明示姓名可避免指代不清，并未增加新的神学解释。
- issue: “撒冷”与“平安”的关系
  choice: 将“撒冷”视为地名，另将“平安地”表达为状态
  alternative: 把“撒冷”解释为“平安”
  rationale: 原文及地理说明支持专名理解；同时保留咨询文本所反映的“平安”状态，不把地名与状态合并，从而避免消解原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“七年期”解释古代纪年单位；“上到”保留原文的行进方向感。脚注标记在正文中写作[a]。
