  text: because it is an abomination before the LORD. Therefore I have written for you in the words of the law all the deeds of the Shechemites that they did against Dinah, and how the sons of Jacob spoke, saying,
translation:
  language: zh_hans
  text: 因为这在主面前是可憎之事。因此，我已在律法的话语中为你写下示剑人对底拿所做的一切事[a]，并写下雅各的众子所说的话：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“示剑所做的一切事”。原文名称可理解为示剑人，也可按“示剑”直译；但相关代词和动词为复数。
    reason: 保留地名/居民称谓之间的真实歧义，并说明正文采用“示剑人”的语法依据。
lexical_decisions:
- source_word: ምኑን
  choice: 可憎之事
  rationale: 该词在此表示宗教与道德意义上的“可憎、憎恶之物”，名词化翻译保留原文“是……之事”的断言结构。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 按现代中文圣经传统译作“主”，既庄重又为普通读者熟悉。
- source_word: ቃለ፡ ሕግ
  choice: 律法的话
  rationale: 直译其“话语/言辞＋律法”结构，不简化为单纯“律法”，以保留原文措辞。
- source_word: ሴቄማ
  choice: 示剑人
  rationale: 后接复数所有格和复数动词，语境所指是示剑的居民，而非单数人物或仅指城名。
- source_word: ዲና
  choice: 底拿
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: ደቂ፡ ያዕቆብ
  choice: 雅各的众子
  rationale: 忠实表达“雅各的儿子们”，用“众子”保持庄重、简洁的叙事语体。
theological_decisions:
- issue: “可憎之事”所指对象的语法含混
  choice: 译作“这在主面前是可憎之事”
  alternative: “这是主所憎恶的”
  rationale: 原文用指示性表达连接上文，却未在本节内明确重述对象；保留“这”可避免擅自限定其所指，也保留“在主面前”的审判性表述。
- issue: “律法的话”与后述事件记录的关系
  choice: 保留“在律法的话中”
  alternative: “写在律法中”
  rationale: 较形式化的译法保留原文独特措辞，不把它解释成特定正典范围或后世法律文书。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留原文因果连接和句末引语引入结构。正文中的“说：”承接下一节，反映原文未完句式。
