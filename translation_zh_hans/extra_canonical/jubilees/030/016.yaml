base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/016.yaml
  text: 'Therefore I have commanded you, saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment[16], and it was reckoned to them as righteousness, and it was written for them for righteousness.'''
translation:
  language: zh_hans
  text: 所以我吩咐你说：“要向以色列作这见证：看示剑人和他们的子孙遭遇了什么。他们怎样被交在雅各两个儿子手中，这两个儿子又怎样使他们痛苦地死去[a]。这事被算为他们的义，也为他们记作义。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们痛苦地死去”所译的原文较难确定，也可理解为“在苦难中杀了他们”；有些文本传统可能作“用刀杀了他们”。基本意思是示剑人遭到暴力杀戮。
    reason: 说明疑难词组及文本传统中的不同理解。
lexical_decisions:
- source_word: በፃዕር
  choice: 使他们痛苦地死去
  rationale: ፃዕር 可表示痛苦、苦难或困苦；与“杀死”连用时原意难以确定。正文保留“痛苦”这一核心语义，同时以脚注说明其他可能解释。
- source_word: ሰቂሞን፡ ወለውሉዱ
  choice: 示剑人和他们的子孙
  rationale: 依上下文指示剑群体及其后代，与本章叙述全城居民被杀相符；不用容易被理解为单指示剑个人的“示剑和他的儿子们”。
- source_word: ኮነቶሙ፡ ጽድቀ፡ ወተጽሕፎሙ፡ ለጽድቅ
  choice: 这事被算为他们的义，也为他们记作义
  rationale: 保留“算为义”与“记作义”的平行表达，以及原文对该行动的正面判定，不加解释或弱化。
theological_decisions:
- issue: 西缅和利未杀死示剑人却被算为义
  choice: 按原文直译为“这事被算为他们的义，也为他们记作义”
  alternative: 解释为他们维护以色列圣洁的热心被算为义
  rationale: 原文直接肯定此事，却未在本节限定究竟是杀戮本身、热心还是审判被算为义；译文保留这一神学张力，不替文本作解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言；引语层次明确。“作这见证”“被算为……义”“记作义”保留经书式法律与记账意象，但不使用生僻文言。
