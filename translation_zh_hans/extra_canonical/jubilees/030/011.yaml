base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/011.yaml
  text: And you, Moses, command the children of Israel and testify to them that they are not to give any of their daughters to the nations, and that they are not to take wives for their sons from the daughters of the nations.
translation:
  language: zh_hans
  text: 摩西啊，你也要吩咐以色列人，并郑重告诫他们[a]：不可把自己的女儿嫁给外族人，也不可为自己的儿子娶外族人的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们听见”。
    reason: 原文采用“使听见”的表达，在此也可理解为向他们作证或警告他们。
lexical_decisions:
- source_word: አዝዞሙ
  choice: 吩咐
  rationale: 准确表达命令、嘱咐之意，并符合摩西向以色列人传达律令的庄重语境。
- source_word: ወአስምዕ፡ ላዕሌሆሙ
  choice: 并郑重告诫他们
  rationale: 该短语字面涉及“使听见”及“向／针对他们”，在此是作证、警告的惯用表达；“郑重告诫”既自然，又保留严肃的见证意味。
- source_word: ለአሕዛብ
  choice: 嫁给外族人
  rationale: 原词通常指列国、外邦民族；婚配语境中译作“外族人”清楚自然，且不额外引入宗教身份判断。
- source_word: አይንሥኡ፡ ለውሉዶሙ
  choice: 不可为自己的儿子娶
  rationale: 保留“为他们的儿子取得／娶妻”的结构，符合现代汉语婚配表达。
theological_decisions:
- issue: 婚配禁令对象的表达
  choice: 外族人／外族人的女儿
  alternative: 外邦人／外邦人的女儿
  rationale: “外族人”直接呈现民族群体之间的婚配界线，避免把原文的“列国”静默限定为纯粹宗教类别。
- issue: 使听见与作证／警告之间的语义张力
  choice: 正文译“郑重告诫”，脚注保留“使他们听见”的直译可能
  alternative: 向他们作证
  rationale: 语境要求严肃警告，但原文的使役听觉表达仍值得保留，因此以正文自然传意、脚注呈现字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事律令语体。“摩西啊”体现直接称呼；“嫁给／娶”将原文在婚配语境中的“给／取”自然地表达出来。
