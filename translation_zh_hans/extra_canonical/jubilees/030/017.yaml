  yaml_path: translation/extra_canonical/jubilees/030/017.yaml
  text: And the seed of Levi was chosen for the priesthood and to be Levites, that they might minister before the LORD as we do at all times[17]. And Levi and his sons will be blessed forever, because he was zealous to execute righteousness and judgment and vengeance on all who rose up against Israel.
translation:
  language: zh_hans
  text: 利未的后裔被拣选，担当祭司职分，并作利未人[a]，好让他们在上主面前供职，正如我们时时所做的[b]。利未和他的子孙必蒙福，直到永远；因为他满怀热忱，施行公义、审判，并向所有起来攻击以色列的人报仇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被拣选归于祭司职分，也归于利未人的职分。”
    reason: 原文以相同的介词形式并列“祭司职分”与“利未人”；正文按汉语自然表达译为承担该职分并成为利未人。
  - marker: b
    text: “正如我们时时所做的”保留本书西奈启示叙事中天上说话者所用的第一人称复数“我们”。
    reason: 说明第一人称复数的叙事指向，不在正文中补入原文未明说的说话者名称。
lexical_decisions:
- source_word: ዘርአ፡ ሌዊ
  choice: 利未的后裔
  rationale: ዘርአ意为“后裔、种”，这里指利未一脉，译作现代汉语自然的“后裔”。
- source_word: ለክህነት
  choice: 承接祭司职分
  rationale: 保留“祭司职分”的制度性含义，并以“承接”表达被拣选进入该职任。
- source_word: ለሌዋውያን
  choice: 作利未人
  rationale: 第二个介词短语若机械译为“为利未人”，容易被理解为替利未人受选；结合句法和上下文，译作身份性的“作利未人”。
- source_word: ይትለአኩ
  choice: 供职
  rationale: 该词表示服事、执行职务；祭司语境中“供职”庄重而清楚。
- source_word: ቀንአ
  choice: 满怀热忱
  rationale: 表达强烈而积极的宗教热忱，同时避免直接加入未明说的对象。
- source_word: ጽድቀ፡ ወኵነኔ፡ ወበቀለ
  choice: 公义、审判……报仇
  rationale: 分别保留三个并列概念，不把“审判”或“报仇”弱化为一般性的惩罚。
theological_decisions:
- issue: 利未后裔被选与祭司、利未人身份的关系
  choice: “承接祭司职分，并作利未人”
  alternative: “为祭司职分和利未人而被拣选”
  rationale: 正文采用较自然且符合语境的身份性表达；脚注保留原文介词结构可能产生的另一种形式对应。
- issue: 天使说话者的自我参照
  choice: 保留“像我们一样”
  alternative: 省略或改写为“像天使一样”
  rationale: 原文使用第一人称复数，应保留其叙事视角，不在正文中明确补出“天使”；脚注说明其框架。
- issue: 对示剑事件的价值判断
  choice: 直译“施行公义、审判……报仇”
  alternative: 缓和为“维护正义，惩罚敌人”
  rationale: 本节明确肯定利未的热忱和报复行为；为保存文本本身的神学张力，不作伦理性淡化。
- issue: 神名的表达
  choice: 上主
  alternative: 耶和华／主
  rationale: 原文使用ግዚአብሔር这一称谓；“上主”庄重自然，又不把该称谓强行等同于特定的希伯来神名形式。
translation_notes:
  register: 采用现代、庄重而易懂的经籍文体。“供职”“承接祭司职分”符合祭司语境；保留“公义、审判、报仇”的并列和张力。脚注标记均已置于正文相应位置。
