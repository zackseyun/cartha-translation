  yaml_path: translation/extra_canonical/jubilees/030/003.yaml
  text: And she was twelve years old. And he asked from her father and from her brothers that she be given to him as a wife. And Jacob and his sons were angry because of the men of Shechem, because they had defiled Dinah their sister.
translation:
  language: zh_hans
  text: 她当时十二岁。他向她父亲和她的兄弟们请求，把她嫁给他为妻。雅各和他的儿子们因示剑人而愤怒，因为他们玷污了他们的妹妹底拿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰተ፡ ፲ወ፪ዓመት
  choice: 她十二岁
  rationale: 按吉兹文直译年龄陈述；结合上下文，主语为底拿。
- source_word: አስተብቍዓ
  choice: 请求
  rationale: 表达向女方父亲与兄弟正式求娶的动作，同时不添加原文未明说的婚俗细节。
- source_word: ትትወሀብ፡ ሎቱ፡ ብእሲተ
  choice: 把她给他作妻子
  rationale: 保留被动结构的语义，并以自然现代汉语表达婚配关系。
- source_word: ዐደወ፡ ሰቂማ
  choice: 示剑人
  rationale: ዐደወ 是表示“……的人”的复数结构，并非“示剑城”；依源文译作“示剑人”。
- source_word: አርኰስዋ
  choice: 玷污了
  rationale: 该词在此指使底拿受污辱或不洁；“玷污”保留其道德与礼仪层面的语义张力。
theological_decisions:
- issue: 玷污底拿的施事者是单数还是群体
  choice: 他们玷污了他们的妹妹底拿
  alternative: 他玷污了他们的妹妹底拿
  rationale: 现有吉兹文本的动词形式指向复数施事者，与紧邻的“示剑人”一致；不依据《创世记》的平行叙事将其改成单数。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“给他作妻子”自然呈现古代婚配请求；“示剑人”严格遵循吉兹文词形，并避免误译为“示剑城”。
