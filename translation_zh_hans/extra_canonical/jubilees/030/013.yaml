base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/013.yaml
  text: '"We will not give our daughter to a man who has a foreskin, for that is a reproach to us." And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.'
translation:
  language: zh_hans
  text: “我们不可把女儿嫁给有包皮的男子，因为那是我们的耻辱。”以色列人若把女儿嫁给外族人，或娶外族人的女儿，也是一种耻辱，因为这是不洁净的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቍልፈተ
  choice: 有包皮的
  rationale: 直译该词所指的未受割礼状态；在本节与《创世记》34章的语境中，比笼统译作“未受割礼的”更贴近原文具体表述。
- source_word: ጽእለት
  choice: 耻辱
  rationale: 保留原词“羞耻、辱没、可责之事”的语义，并维持前后两句的重复呼应。
- source_word: አዋልደ፡ አሕዛብ
  choice: 外族人的女儿
  rationale: “列国/外邦人的女儿”在此指以色列以外各族的女子；“外族人的女儿”是自然且不额外赋予宗教含义的现代汉语表达。
- source_word: ርኵስ
  choice: 不洁净的
  rationale: 保留礼仪及道德层面可能并存的含义，不将其收窄为单纯“肮脏”或明确的某一种律法分类。
theological_decisions:
- issue: 第一句与第二句的说话层次
  choice: 第一句加引号，第二句置于引号之外
  alternative: 全节作为连续陈述，不使用引号
  rationale: 第一句对应雅各众子的直接话语，第二句转为对以色列的规范性评论；标明引语边界可反映语篇转换，而不增添说话者姓名。
- issue: “给”与“娶”的对象关系
  choice: 译为“把女儿嫁给外族人，或娶外族人的女儿”
  alternative: 较形式化地译为“那些给予和那些从列国的女儿中娶取的人”
  rationale: 原文以“给”和“取”概括两种通婚方向；汉语显明其隐含宾语，既保留双向禁忌，也避免含混难懂。
- issue: 不洁的所指
  choice: 用“这是不洁净的”保留较宽泛指向
  alternative: 明确译成“外族女子是不洁净的”或“这种婚姻在礼仪上不洁”
  rationale: 原文的阳性单数表达在句法和语义上可能概括前述行为或情形；不应把不洁明确归于女子本身，也不应擅自限定为礼仪类别。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。第一句保留直接引语，第二句以自然汉语展开原文“给/取”的对称结构；避免使用带强烈后世宗派色彩的术语。
