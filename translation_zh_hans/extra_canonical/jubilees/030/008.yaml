base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/008.yaml
  text: They shall burn her with fire, because she has defiled the name of her father's house, and she shall be rooted out from Israel. And let no fornicator or defiled person be found in Israel throughout all the days of the generations of the earth, for Israel is holy to the LORD, and every man who defiles it shall surely die; they shall stone him with stones.
translation:
  language: zh_hans
  text: 他们要用火烧死她，因为她玷污了父家的名；她要从以色列中被除掉。在地上各世代的一切日子里[a]，以色列中不可有行淫的人或污秽的人，因为以色列是归耶和华为圣的。凡玷污以色列的人都必被处死；众人要用石头打死他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在地上历代的一切日子里”。
    reason: 源文时间短语逐项包含“日子、世代、地”，组合关系在中文中可有不止一种自然表达。
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: 他们要用火烧死她
  rationale: 动词带阴性宾语，刑罚语境不只是焚烧物件；译出“她”，并以“烧死”自然表达致死刑罚。
- source_word: አርኰሰት፡ ስመ፡ ቤተ፡ አቡሃ
  choice: 她玷污了父家的名
  rationale: 保留“玷污—名—父家”的源文意象与名誉含义，不改写成较宽泛的“使家族蒙羞”。
- source_word: ትሠረው፡ እምእስራኤል
  choice: 她要从以色列中被除掉
  rationale: 该词表达拔除、根除；中文“除掉”既自然，也保留从共同体中彻底清除的力度。
- source_word: ዘማ፡ ወርኵስ
  choice: 淫乱或污秽的人
  rationale: 前者指行淫者，后者指不洁或受玷污者；用“或”按并列禁令处理，不将两词合并为单一类别。
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: 在地上世世代代的一切日子里
  rationale: 明确保留መዋዕለ“日子”，并以可理解的中文呈现该书特有的延续性时间表达。
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር
  choice: 以色列归耶和华为圣
  rationale: 与格结构表达以色列对上主的归属；“归……为圣”兼顾神圣身份和归属关系。
- source_word: ሞተ፡ ለይሙት
  choice: 都必被处死
  rationale: 这是闪语式强调死亡判决；中文不机械重复“死”，而保留其确定和司法性的力度。
- source_word: በእብን፡ ይውግርዎ
  choice: 众人要用石头打死他
  rationale: 源文为用石头击打的处决方式；中文惯用“用石头打死”，补出不定主语“众人”以求通顺。
theological_decisions:
- issue: “以色列为圣”的归属含义
  choice: 以色列归耶和华为圣
  alternative: 以色列对耶和华是圣洁的
  rationale: 前者自然表达分别归属上主，同时不把“圣”仅缩减为伦理上的洁净。
- issue: 末句“玷污”的宾语
  choice: 凡玷污以色列的人
  alternative: 凡玷污它的人
  rationale: 源文宾语可能承接“以色列”；直接复现名词可消除中文代词指代不清，但不进一步限定究竟是土地、民族还是圣洁共同体。
- issue: “污秽的人”的性质
  choice: 保留为“污秽的人”
  alternative: 不洁净的人／玷污者
  rationale: 源词可涉及礼仪、道德或共同体意义上的不洁；采用较宽的“污秽”，不擅自限定其神学类别。
translation_notes:
  register: 采用庄重而现代的规范汉语。保留刑罚条文的严肃力度、源文“父家的名”及“世代的一切日子”等特征性表达；为避免生硬，使用“被除掉”“归耶和华为圣”“用石头打死”等普通读者易懂的措辞。主文中的脚注标记[a]与脚注对应。
