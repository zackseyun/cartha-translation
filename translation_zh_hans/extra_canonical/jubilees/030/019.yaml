  yaml_path: translation/extra_canonical/jubilees/030/019.yaml
  text: 'And for this reason they inscribe for him a testimony of favor[a] on the heavenly tablets: blessing and righteousness before the God of all.'
translation:
  language: zh_hans
  text: 因此，他们在天上的版册上为他写下蒙恩的见证[a]：在万有的上帝面前的福分与公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语为“ስምዐ ፡ ሞገስ”（semʿa mogas），可指有关恩宠、悦纳或认可的正式见证或记录。
    reason: lexical_choice
lexical_decisions:
- source_word: ይጽሕፉ
  choice: 他们……写下
  rationale: 保留原文第三人称复数主动形式；主语在本节未明说，因此不擅自补成“天使”。
- source_word: ስምዐ ፡ ሞገስ
  choice: 蒙恩的见证
  rationale: “见证”对应ስምዕ，“蒙恩”表达ሞገስ所含的恩宠、悦纳或认可之意，同时保留其正式记载的语境。
- source_word: ጽላተ ፡ ሰማይ
  choice: 天上的版
  rationale: 直译其复合表达，指天上用来记录的版；避免增添原文没有的材质。
- source_word: በረከተ ፡ ወጽድቀ
  choice: 福分与公义
  rationale: 分别对应“祝福/福分”和“公义/正直”，并保留二者并列关系。
- source_word: አምላከ ፡ ኵሉ
  choice: 万有之上帝
  rationale: 按属格结构译出“万有的上帝”；采用现代中文中庄重而清楚的表达。
theological_decisions:
- issue: 未明说的复数主语
  choice: 保留“他们”，不指明身份
  alternative: 译作“天使们”或使用被动式“被写下”
  rationale: 原文使用复数主动动词，却未在本节点明主语；保留代词可保存原文的含混性。
- issue: ሞገስ的神学语义
  choice: 蒙恩
  alternative: 恩典、悦纳、恩宠
  rationale: “蒙恩”既可表达所领受的恩惠，也可包含得到认可或悦纳的意味，不把词义限定为某一特定教义术语。
- issue: “福分与公义”同前文的句法关系
  choice: 以冒号视为“见证”的内容或说明
  alternative: 译成另一个独立谓语或另起一句
  rationale: 原文名词并列而连接关系简约；冒号保留其解释性关系，同时不强行补入动词。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“天上的版”保留古代天上记录载体的意象；全节仅翻译所给第19节文本，不并入相邻经节。
