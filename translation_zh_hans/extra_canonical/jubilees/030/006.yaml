  yaml_path: translation/extra_canonical/jubilees/030/006.yaml
  text: because they had committed shame in Israel. And the LORD delivered them into the hand of Jacob's sons so that they might destroy them with the sword and do this to them, and so that it might not be done again,
translation:
  language: zh_hans
  text: 因为他们在以色列中行了可耻的事。耶和华把他们交在雅各众子手中，使雅各众子用刀除灭他们[a]，也这样对待他们，使这事不再发生，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除灭”或译“杀死”；原词含根除、彻底毁灭之意。
    reason: 说明原词较强的语义力度，同时记录较窄的可行译法。
lexical_decisions:
- source_word: ኀፍረተ
  choice: 可耻的事
  rationale: 该词表示羞耻、耻辱；结合“做了”这一动词，以“做了可耻的事”自然表达其行为性质，同时不擅自补明具体罪行。
- source_word: ይሠርውዎሙ
  choice: 除灭那些人
  rationale: 动词有拔除、根除、毁灭之意，语气强于一般的“杀死”；“除灭”既保留彻底清除的力度，也符合庄重叙事语体。
- source_word: መጠዎሙ … ውስተ እዴ
  choice: 把他们交在……手中
  rationale: 按闪语式“交在某人手中”表达交付其控制或处置，保留原文的神主动交付这一结构。
- source_word: ይግበሩ ላዕሌሆሙ ዝንተ
  choice: 也这样处置他们
  rationale: 直义为“向他们做这事”。现代汉语若直译略显生硬，“这样处置他们”保留指代的概括性，不进一步解释“这事”的内容。
theological_decisions:
- issue: 神在事件中的主动作用
  choice: 耶和华把他们交在雅各众子手中
  alternative: 他们落在雅各众子手中
  rationale: 原文明确以神为“交付”的主语，因此不将其弱化成无人称或纯粹被动的结果。
- issue: 末句所指的罪行
  choice: 使这样的事不再发生
  alternative: 使玷污以色列处女的事不再发生
  rationale: 本节现存所给原文只保留概括性的否定目的句，没有明说具体行为；因此保留指代，不从上下文补入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“雅各众子”比“雅各的儿子们”更凝练，也适合古代宗族叙事。末尾保留逗号，因为所给吉兹语文本止于未完的“使……不再发生”结构，避免擅自补足下一节或上下文内容。
