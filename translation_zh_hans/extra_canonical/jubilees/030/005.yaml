  yaml_path: translation/extra_canonical/jubilees/030/005.yaml
  text: And thus it must not be done from now on, to defile a daughter of Israel, for in heaven it has been ordained against them that all the men of Shechem be destroyed by the sword,
translation:
  language: zh_hans
  text: 底拿——他们的妹妹。今后绝不可再做这样的事，玷污以色列的女儿；因为在天上已经针对他们[a]定下：示剑所有的男子都要被刀剑消灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”在原文中的具体所指并不完全明确，可能泛指犯下这种玷污行为的人，也可能与本句所说的示剑男子相关。
    reason: 保留原文复数代词的指代歧义，避免在正文中作过度限定。
lexical_decisions:
- source_word: ዲናሃ፡ እኅቶሙ
  choice: 底拿——他们的妹妹
  rationale: 按吉兹文保留句首独立短语及其承接上文的片段感；“እኅቶሙ”意为“他们的妹妹”。
- source_word: አይትገበር፡ እምይእዜ
  choice: 今后绝不可再做这样的事
  rationale: 以现代汉语表达否定命令及“从今以后”的时间含义，并由“这样的事”承接前文事件。
- source_word: ለአርኵሶ፡ ወለተ፡ እስራኤል
  choice: 玷污以色列的女儿
  rationale: “አርኵሶ”表达使之污秽、玷污；保留“以色列的女儿”这一单数集体性表述。
- source_word: ተሠርዐ
  choice: 定下
  rationale: 体现天上所作的规定、命定或判决，不额外指定其制度或神学性质。
- source_word: ያጥፍእዎሙ፡ በሰይፍ
  choice: 要用刀……全都消灭
  rationale: 忠实表达以刀剑施行彻底毁灭的结果；“要”承接已定下的内容。
- source_word: ለኵሎሙ፡ ዐደወ፡ ሴቄማ
  choice: 示剑所有的男子
  rationale: 依传统词义与上下文，将“ዐደወ”理解为成年男子或男丁，采用自然而庄重的现代汉语。
theological_decisions:
- issue: 天上所定之事的对象与代词所指
  choice: 译作“针对他们”，并加注说明指代不明
  alternative: 明确译作“针对玷污以色列女子的人”或“针对示剑人”
  rationale: 原文复数代词的具体先行词并不完全明确；不把解释性身份直接写入正文，以保留原有张力。
- issue: “天上定下”的语气
  choice: “天上已经……定下此事”
  alternative: “天上已经颁布律法”或“上帝已经命定”
  rationale: 原文说“在天上”且使用被动形式，没有在本句明说施令者，也未必专指成文律法，因此不补入“上帝”或“律法”。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。保留开头“底拿——他们的妹妹”的承上片段结构；正文避免古奥措辞，同时维持审判宣告的严肃语气。
