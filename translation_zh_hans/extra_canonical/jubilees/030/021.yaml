  text: And they brought out Dinah their sister from the house of Shechem, and they plundered everything that was in Shechem—their sheep and their cattle and their donkeys and all their possessions and all their wealth, and they brought everything to Jacob their father.
translation:
  language: zh_hans
  text: 他们把他们的妹妹底拿从示剑的家中带出来，又掠走示剑的一切：他们的羊、牛、驴、所有牲畜和全部财物；他们把这一切都带到他们父亲雅各那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአውፅኡ፡ ዳናሃ፡ እኅቶሙ
  choice: 他们把妹妹底拿……带出来
  rationale: 保留动词“带出”和亲属称谓“他们的妹妹”；按现代汉语自然语序将“底拿”置于称谓之后。
- source_word: እምፄ፡ ቤተ፡ ሴኬም
  choice: 从示剑家里
  rationale: 此处“示剑”指玷辱底拿的个人，ቤተ 表示其家或房屋；译作“示剑家里”自然且不额外限定建筑类型。
- source_word: ወፄወዉ፡ ኵሎ፡ ዘሀለወ፡ ውስተ፡ ሰቂሞን
  choice: 又掠走示剑城里的一切
  rationale: 动词表示掳掠；此处地点语境中的示剑指城邑，用“示剑城”避免与前一句的人名混淆。
- source_word: አባግዒሆሙ፡ ወአልህምቲሆሙ፡ ወአእዱጊሆሙ
  choice: 他们的羊、牛、驴
  rationale: 依次直译所列三类牲畜，保留原文清单式表达。
- source_word: ወኵሎ፡ መራዕዮሙ፡ ወኵሎ፡ ንዋዮሙ
  choice: 所有畜群和全部财物
  rationale: 区分表示成群牲畜的 መራዕይ 与表示财产、物资的 ንዋይ，避免把两个并列项目合并为一个宽泛概念。
- source_word: ወአምጽኡ፡ ኵሎ፡ ኀበ፡ ያዕቆብ፡ አቡሆሙ
  choice: 他们把这一切都带到父亲雅各那里
  rationale: 完整保留原文末句，尤其不遗漏“带到他们父亲雅各那里”的终结性动作。
