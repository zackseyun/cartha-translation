base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/010.yaml
  text: whoever defiles it shall surely die[10], and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man should be rooted out who has defiled a daughter in the midst of all Israel, because he has given of his seed to Molech and has acted wickedly so as to defile it.
translation:
  language: zh_hans
  text: 凡玷污她的，必被处死，并要用石头打死。这条律法不受时日限制，也没有赦免或任何赎罪；惟有将那在全以色列中玷污女儿的人连根除掉，因为他把自己的后裔献给了摩洛[a]，又行恶玷污了这女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里突然提到摩洛，与上下文的衔接并不明朗；吉兹文保留了这句话。它可能借献给摩洛的后裔来类比不正当的生育行为和礼仪上的玷污。
    reason: textual_variant
lexical_decisions:
- source_word: ዘያረኵስ
  choice: 凡玷污她的
  rationale: 按关系结构译出“那玷污者”；上下文所指为女子，中文以“她”承接，同时保留原文简略的代词表达。
- source_word: ሞተ፡ ለይሙት
  choice: 必被处死
  rationale: 这是强调死亡判决的同源动词结构；用现代汉语法律语体表达其确定性，不机械重复“死”。
- source_word: ወበእብን፡ ይትወገር
  choice: 并要用石头打死
  rationale: 直译其以石头击打的刑罚表达，符合古代法律语境。
- source_word: ዐቅመ፡ መዋዕለ
  choice: 时日的限期
  rationale: 保留“日子／时日”与“界限”的组合，表示此律例不因时间经过而失效。
- source_word: ይሤረው
  choice: 连根除掉
  rationale: 该被动动词具有“拔除、根除”之意；保留原文强烈的植物性隐喻，不增添“立即”等原文没有的成分。
- source_word: እምውስተ፡ ዘርኡ፡ ወሀቦ፡ ለሞሎክ
  choice: 他把自己的后裔献给了摩洛
  rationale: 按“从／属于他的种子”与“给摩洛”译出；“后裔”比生硬的“种子”更符合现代汉语，又保留生育与献祭的关联。
theological_decisions:
- issue: “摩洛”条款与玷污女子之罪的关系
  choice: 保留原文突兀的因果连接，不解释两者如何构成同一罪行
  alternative: 将其释为把儿女实际献祭给摩洛，或仅视作邪教玷污的比喻
  rationale: 吉兹文确实保存该条款，但上下文关系并不清楚；正文不应替原文消除这种张力。
- issue: “连根除掉”的法律含义
  choice: 保留根除意象，不明确限定为处死或逐出群体
  alternative: 译作“把他处死”或“把他从民中剪除”
  rationale: 源词可以表达彻底除灭，但本句未明说执行方式或群体公式；保留措辞可避免过度解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并保留古代律法语气。“赦免或任何赎罪”维持两个并列概念；“连根除掉”保留源文隐喻及其法律含义上的开放性。
