base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/015.yaml
  text: or if there is one from his daughters whom he has given to a man from any of the nations. For it is plague upon plague[15], and curse upon curse; and every judgment and plague and curse will come. And if he does this thing, or if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together will be judged for all the uncleanness and profanation. And there will be no partiality, and no receiving from his hand fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted. So it is with every man or woman in Israel who defiles his sanctuary.
translation:
  language: zh_hans
  text: 或是他把自己的一个女儿嫁给了万国中的男子。因为这是灾祸之上再加灾祸[a]，咒诅之上再加咒诅；一切审判、灾祸和咒诅都必临到。若他做了这事，或对那些行污秽之事、玷污主的圣所、亵渎他圣名的人视而不见，全体百姓就必因这一切污秽和亵渎一同受审判。必不徇情，也不从他手中收纳果实、祭物、燔祭、脂油或馨香之气。以色列中任何玷污他圣所的男女，都必如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节语句异常密集，可能压缩了数项法律和祭仪规定。译文保留“污秽—群体受审—不徇情—祭物不蒙收纳”的次序，没有过度拆解或顺畅化。
    reason: segmentation_note
lexical_decisions:
- source_word: መቅሠፍት
  choice: 灾祸
  rationale: 该词在本节重复出现，语义可涵盖打击、灾殃或惩罚；译作“灾祸”既保留刑罚意味，也避免将其过度限定为疾病性的“瘟疫”。
- source_word: ኵነኔ
  choice: 审判
  rationale: 在“灾祸和咒诅”的并列结构中指司法性的定罪或判决，译作“审判”保留行动与结果之间的张力。
- source_word: ርኵሰ
  choice: 污秽
  rationale: 此处兼有礼仪与道德层面的不洁含义；“污秽”能保持这种复合语义。
- source_word: ያረኵሱ፡ መቅደሶ
  choice: 玷污……圣所
  rationale: 采用现代汉语中自然且庄重的宗教法律表达，准确传达使圣所成为不洁的含义。
- source_word: ይጌምሩ፡ ስሞ፡ ቅዱሰ
  choice: 亵渎他圣名
  rationale: 该短语表示损害、污辱神圣之名；“亵渎”是清楚而不过度教派化的对应词。
- source_word: ነሢአ፡ ገጽ / አድልዎ፡ ለገጽ
  choice: 徇情
  rationale: 字面涉及“接受面貌”或偏待人的面，功能上表示偏袒；“不徇情”简洁保留司法语境。
- source_word: ጽንሓሐ
  choice: 脂油
  rationale: 该祭仪词在此列于祭物、燔祭之后，并与馨香相连；依上下文译作祭物的“脂油”，不将其误并入后面的香气。
- source_word: ትምዐዘ፡ መዐዛ፡ ሠናይ
  choice: 馨香之气
  rationale: 直译为美好或悦纳的香气；“馨香之气”自然、庄重，也保留祭献语境。
theological_decisions:
- issue: 集体受审判与个人责任的关系
  choice: 译作“全体百姓就必……一同受审判”
  alternative: 译作“众民都一概被定罪”
  rationale: 原文强调群体共同承担判断，但未在本句解释个人责任机制；“一同受审判”保留其严厉性而不额外断定最终定罪。
- issue: 神是否拒绝祭物
  choice: 译作“不从他手中收纳”
  alternative: 译作“神绝不接受他的献祭”
  rationale: 原文以无人收取或接纳的表述展开，并列举多种供物；保留“从他手中收纳”可呈现祭仪和关系层面的拒绝，又不补入原文未明说的主语。
- issue: “主的圣所”与后文“他的圣所”
  choice: 前处用“主的圣所”，后处依原文代词用“他圣所”
  alternative: 两处都统一为“主的圣所”
  rationale: 保留原文名号与代词的转换，同时现代中文中的所指仍然清楚。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留本节法律宣告与祭仪语言的密度；“嫁给”按语境表达父亲将女儿给外族男子为妻，但不额外补入婚姻是否合法等解释。
