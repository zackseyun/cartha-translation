  yaml_path: translation/extra_canonical/jubilees/030/009.yaml
  text: 'For thus it has been ordained and written on the heavenly tablets concerning all the seed of Israel:'
translation:
  language: zh_hans
  text: 因为关于以色列所有的后裔，已经这样定下，并写在天上的版上了：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: 规定
  rationale: 该词在此表示被制定、确立；用“规定”自然地保留制度性和权威意味。
- source_word: ተጽሕፈ
  choice: 写着
  rationale: 原文为被动形式；汉语用“写着”表达已被记载且现存于版上的状态。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版
  rationale: 直译为“天的版（复数）”；“天上的版”保留犹太文献中天上记录载体的意象，不增添“石”或“法”等原文未明说的限定。
- source_word: ኵሉ፡ ዘርአ፡ እስራኤል
  choice: 以色列所有的后裔
  rationale: “种/种子”在此指群体后裔；“所有的后裔”符合现代汉语，同时保留范围上的完整性。
theological_decisions:
- issue: 天上版册所载内容的权威性质
  choice: 规定并写着
  alternative: 设立并记载
  rationale: 原文并列“制定/规定”和“写下”，既含规范性又含记录性；译文不进一步说明其具体神学机制。
- issue: “以色列的后裔”的范围
  choice: 以色列所有的后裔
  alternative: 以色列全体子孙
  rationale: 原文只给出总体称谓，译文不将其限定为某一时代、支派或特定神学群体。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原句引出下文的冒号；用“天上的版”而非较具解释性的“天上的法版”或“天上册卷”，以免加入原文没有的材质或文类信息。
