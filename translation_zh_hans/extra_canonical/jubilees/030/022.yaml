  text: and they brought it all to Jacob their father. And he spoke with them about their having destroyed the city, because he feared those who lived in the land, the Canaanites and the Perizzites. And the terror of Yahweh was on all the cities around Shechem, and they did not rise up to pursue the sons of Jacob, because dread had fallen on them.
translation:
  language: zh_hans
  text: 他们把这一切都带到父亲雅各那里。雅各就他们毁了那城[a]的事同他们说话，因为他惧怕住在那地的人，就是迦南人和比利洗人。耶和华的威慑临到示剑周围各城；他们没有起来追赶雅各的儿子，因为惊惧临到了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“杀了那城”；“城”在这里代指城中的居民。
    reason: 保留吉兹文以“杀”搭配“城”的字面表达及其转喻关系。
lexical_decisions:
- source_word: ቀተሉ፡ ሀገረ
  choice: 毁灭了那城
  rationale: 原文直译为“杀了那城”，以“城”代指城中居民；中文用“毁灭了那城”较自然，同时以脚注保留原文措辞。
- source_word: ግርማ፡ እግዚአብሔር
  choice: 耶和华使……陷入恐惧
  rationale: 该结构表达由耶和华而来的威慑或恐惧；转为自然汉语的使动句，清楚保留恐惧的神圣来源。
- source_word: ኢተንሥኡ፡ ሰሰዲደ
  choice: 没有起来追赶
  rationale: 保留原文“起来”与“追赶”的连续动作，符合庄重而自然的叙事语体。
- source_word: ድንጋፄ፡ ወደቀ፡ ላዕሌሆሙ
  choice: 惊惧临到了他们
  rationale: 保留原文“惊惧落在他们身上”的形象，同时采用现代汉语可理解的表达。
theological_decisions:
- issue: 神名的译法
  choice: 耶和华
  alternative: 主／雅威
  rationale: 结合吉兹文的神圣称谓及审校层明确采用 Yahweh 的证据，使用普通中文读者熟悉的专名“耶和华”，而不将其弱化为一般称谓“主”。
- issue: 恐惧与上帝作为之间的关系
  choice: 耶和华使各城陷入恐惧
  alternative: 耶和华的威慑临到各城
  rationale: 原文明确把各城的恐惧归因于耶和华；使动表达自然清楚，又不进一步解释其方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“责备”概括雅各因他们毁城而对他们说话的语境；后半句用分号呈现耶和华所降恐惧与无人追赶之间的紧密关系。
