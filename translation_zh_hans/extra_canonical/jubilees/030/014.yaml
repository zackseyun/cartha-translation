  text: And it is abominable for Israel. And Israel will not be cleansed from this uncleanness, who has a wife from the daughters of the nations,
translation:
  language: zh_hans
  text: 这对以色列来说是可憎的。以色列若有人娶外族女子为妻[a]，就不能从这污秽中得洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直译为“有一个外族妻子的”。
    reason: 原文关系结构“ዘቦ ብእሲት”字面近于“有妻子的（人）”，汉语正文为行文自然译成条件句。
lexical_decisions:
- source_word: ምኑን
  choice: 可憎的
  rationale: 该词表示令人厌恶、当受憎恶之物；用“可憎的”既贴近原义，也符合庄重的经书语体。
- source_word: ኢይነጽሕ
  choice: 不能……得洁净
  rationale: 该否定动词表达不被洁净或不能成为洁净；结合后接的“从这污秽中”，译为“不能从这污秽中得洁净”自然且保留礼仪洁净含义。
- source_word: ርኵስ
  choice: 污秽
  rationale: 此处指不洁、玷污的状态；“污秽”能保留其礼仪和道德层面的张力，不缩减为一般的“肮脏”。
- source_word: ዘቦ፡ ብእሲት
  choice: 若有人娶……女子为妻
  rationale: 关系词加所有结构直译近于“有妻子的那人”；汉语用“若有人娶……为妻”明确其婚姻关系，并使以色列这一集合主体与其中个人自然衔接。
- source_word: እም
  choice: 外族
  rationale: 现存短句在此处中断，但经校订的上下文及咨询层表明后接“列国的女子”；“外族女子”以自然汉语表达这一族群对比。
theological_decisions:
- issue: “以色列”是集合主体，还是指其中娶外族女子的个人
  choice: 译作“以色列若有人……，就不能……”
  alternative: “有外族妻子的以色列人不能……”
  rationale: 原文先以“以色列”为主语，随后用关系结构限定“有妻子”的人。所选译法保留以色列作为整体承担污秽后果的措辞，同时让现代汉语读者明白具体行为由其中的人实施。
- issue: 污秽的性质
  choice: 保留“污秽”和“得洁净”的礼仪性表达
  alternative: 译作“罪”与“获赦免”
  rationale: 原文使用洁净/不洁词汇，并未直接改用罪责或赦免术语；不应以特定神学解释替代原有范畴。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可憎”“污秽”“得洁净”保留古代宗教与礼仪语境；句法则调整为自然汉语。正文中的[a]与脚注标记对应。
