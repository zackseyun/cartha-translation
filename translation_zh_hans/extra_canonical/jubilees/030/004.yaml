base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/004.yaml
  text: And they spoke with them deceitfully and dealt treacherously with them and misled them. And Simeon and Levi entered Shechem unexpectedly and executed judgment on all the men of Shechem, and they killed every male whom they found in it, and they left none in it; they killed them all in agony, because they had disgraced Dinah their sister.
translation:
  language: zh_hans
  text: 他们怀着恶意与他们交谈，对他们行诡诈，误导他们。西缅和利未突然进入示剑城，对示剑所有的男子施行审判；他们杀死城中所找到的每一个男子，一个也没有留下。趁着他们痛苦之时，他们把众人全都杀了，因为他们玷辱了他们的妹妹底拿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በአኩይ
  choice: 用恶意的话
  rationale: 介词短语表达以恶意、不怀好意的方式说话；译文保留其道德色彩。
- source_word: ኀብለይዎሙ
  choice: 欺骗他们
  rationale: 按上下文指以诡诈对待或欺哄对方。
- source_word: አስፈጥዎሙ
  choice: 迷惑他们
  rationale: 与前一动词并列，表达使对方受误导，而不把两个近义动作合并。
- source_word: ግብተ
  choice: 出其不意地
  rationale: 在叙事中修饰进入示剑，表达突然、未受防备的情形。
- source_word: ገብሩ፡ ኵነኔ
  choice: 审判了
  rationale: 直译为施行审判；保留《禧年书》对该行动的司法性表述，不擅自改成较中性的攻击或惩罚。
- source_word: በ፵ዐር（校作 በጻዕር）
  choice: 在痛苦中
  rationale: 依据校勘所指的 በጻዕር，意为在痛楚、苦楚中，语境上可能涉及割礼后的疼痛；不与《创世记》34章的“刀刃”措辞强行协调。
- source_word: ገመፉ
  choice: 玷辱了
  rationale: 表达使人受辱、遭羞辱；在底拿事件的语境中兼有侵犯其尊严之意，但不额外明确原文未在本节重述的行为细节。
theological_decisions:
- issue: 西缅和利未行动的司法性评价
  choice: 审判了
  alternative: 惩罚了／攻击了
  rationale: 原文使用“施行审判”的措辞。译文保留叙述者赋予行动的司法语言，同时不添加“公义”等评价，以免消除经文自身的伦理张力。
- issue: “在痛苦中”的具体所指
  choice: 正文仅译“在痛苦中”
  alternative: 译作“趁他们因割礼疼痛时”或“用刀刃”
  rationale: 原文表达痛苦，却未在本节明说其原因；保留含蓄性，也遵循最新校勘结论，不引入《创世记》的不同措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“示剑”在“进入示剑”中按城名处理；后文“示剑所有的男人”依原文保留城名。“一切男子”与“一个也没有留下”保留原文的重复和绝对化语气。
