base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/018.yaml
  text: And so they inscribe for him on the heavenly tablets blessing and righteousness before the God of all.
translation:
  language: zh_hans
  text: 于是，他们在天上的版册上为他记下祝福和义，作为在万有的上帝面前的见证。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版
  rationale: 直译为“天上的版（版片）”，保留《禧年书》中记录天上判定与功行的固定意象，同时避免擅自具体化其材质。
- source_word: በረከተ፡ ወጽድቀ
  choice: 福分和义
  rationale: 分别保留“祝福/福分”与“义/公义”两个并列名词；此处用“福分”较自然地表达为他记下的祝福，用“义”保留其被认定为正直的含义。
- source_word: በስምዐ
  choice: 作为……见证
  rationale: 该词具有“见证、证明”的含义；原文明确含有这一成分，故虽英语咨询文本未显明译出，中文仍予保留。
- source_word: ለአምላከ፡ ኵሉ
  choice: 万有之上帝
  rationale: 按原文属格结构译为“万有的上帝/万有之上帝”，表达上帝与一切受造万有的关系，不增添特定宗派解释。
theological_decisions:
- issue: “福分和义”与“见证”的句法关系
  choice: 将“福分和义”表述为所记下的内容，并以整件记录作为见证
  alternative: 译作“为他记下见证、福分和义”，把三者视为并列项目
  rationale: 原文介词短语“በስምዐ”（作为见证）更自然地表示记录的性质或作用，而“福分和义”是明确并列的宾语；此译法既顺畅，又不把“见证”误作第三项记录内容。
- issue: “他们”的身份
  choice: 保留未指明的“他们”
  alternative: 明确译为“天使”或“天上的使者”
  rationale: 本节原文只用第三人称复数动词，并未在句内明说主体；不应擅自补入天使论上的具体身份。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“记下”自然表达写入天上版册的动作；“万有之上帝面前”保留原文敬虔与审判性的语域。
