  yaml_path: translation/extra_canonical/jubilees/030/002.yaml
  text: And there Shechem[2], the son of Hamor the Hivite, the prince of the land, saw Dinah, Jacob's daughter, and he seized her and lay with her and defiled her, and she was a young girl.
translation:
  language: zh_hans
  text: 他们在第四个月平安地来到那里。[a] 就在那里，希未人哈抹的儿子示剑，那地的首领，看见了雅各的女儿底拿，便抓住她，与她同寝，玷污了她；她当时还是个少女。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的短语在句法上承接上一节，直译为“平安地，在第四个月”。
    reason: verse_boundary
  - marker: b
    text: 原文末句直译为“她年纪尚小”；下一节说明底拿当时十二岁。
    reason: lexical_alternative
lexical_decisions:
- source_word: መስተዋ / ወሰተ
  choice: 看见了……便把她抓去
  rationale: 分别保留“看见”与“带走、拿住”的动作；结合强迫性的上下文，用“抓去”比中性的“带走”更准确，同时不额外加入原文未明说的细节。
- source_word: ወሰከበ፡ ምስሌሃ
  choice: 与她同寝
  rationale: 直译为“与她躺卧”，在此是性交的委婉表达；“同寝”庄重、清楚，并保留原文的委婉程度。
- source_word: ወአርኰሳ
  choice: 玷污了她
  rationale: 该动词表示使之污秽、不洁；“玷污”准确保留《禧年书》本章有关污秽的主题，不改译为源自《创世记》希伯来文本传统的“羞辱”。
- source_word: ወይእቲሰ፡ ንስቲት
  choice: 那时她还是个少女
  rationale: 原文强调她年幼；“少女”自然且庄重，又不把年龄说得比原文更具体。
- source_word: በሰላም፡ በ፮ብዕ፡ ወርኅ
  choice: 他在四月平安抵达
  rationale: 该短语在句法和叙事上承接前节，意为“平安，在第四个月”；为使中文成为完整句子，依上文补出主语和“抵达”。
theological_decisions:
- issue: “玷污”与“羞辱”的选择
  choice: 玷污了她
  alternative: 羞辱了她
  rationale: 吉兹语动词本身指污秽或使不洁，而“羞辱”更接近《创世记》34:2某些译法所依据的希伯来语表达。采用“玷污”可忠实呈现本书自身的措辞及其关于不洁的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“同寝”保留原文对性交的委婉表达；“抓去”呈现动作的强迫性，但不加入原文没有明说的法律或解释性术语。专名按现代中文圣经通行形式译作“示剑、哈抹、希未人、底拿、雅各”。
