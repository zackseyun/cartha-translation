base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/018/015.yaml
  text: And he said, “By myself I have sworn, says the LORD, because you have done this thing and have not withheld your son, your firstborn, your beloved one, from me, surely blessing I will bless you, and multiplying I will multiply your seed like the stars of heaven and like the sand that is on the seashore, and your seed will inherit the cities of their enemies.”
translation:
  language: zh_hans
  text: 他说：“耶和华说：‘我指着自己起誓，因为你做了这事，没有把你的儿子，就是你的长子、你所爱的，留下不给我，我必赐福给你，必使你的后裔大大增多，如同天上的星，又如同海边的沙；你的后裔必占有仇敌的城邑。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በርእስየ፡ መሐልኩ
  choice: 我指着自己起誓
  rationale: 直译为“我凭自己起誓”，采用现代汉语中庄重自然的誓言表达，并保留神以自身起誓的含义。
- source_word: በኵረከ（底本文字作 በዘረከ）
  choice: 你的长子
  rationale: 结合校勘信息，底本此处是数字文本/OCR讹误；应读作“你的长子”，不可误译为“你的后裔”。
- source_word: ዘአፍቀርከ
  choice: 你所爱的
  rationale: 保留关系从句的强调语气，并自然地与“你的儿子、你的长子”同位。
- source_word: ባርኮ፡ እባርከከ
  choice: 我必赐福给你
  rationale: 源文以同根词重复加强语气；汉语以“必”表达强调，避免生硬的“赐福，我必赐福”。
- source_word: አበዝኆ፡ አበዝኆ
  choice: 必使……大大增多
  rationale: 用“大大”再现同根重复所表达的强烈增多之意。
- source_word: ዘርአከ
  choice: 你的后裔
  rationale: 该词在应许语境中是集合名词，可兼指整体后代；“后裔”庄重且自然。
- source_word: ይወርሱ
  choice: 必占有
  rationale: 表达取得并拥有仇敌城邑；既保留继承/占有的语义范围，又符合征服语境。
- source_word: አህጉረ፡ ፀሮሙ
  choice: 仇敌的城邑
  rationale: 按源文复数概念处理；“城邑”比单纯“城市”更适合古代语境。
theological_decisions:
- issue: 儿子称谓的排列与关系
  choice: 你的儿子，就是你的长子、你所爱的
  alternative: 你的儿子、你的长子、你的爱子
  rationale: 将三个称谓保留为同位结构，不删去“长子”，也不把“所爱的”实体化为可能带有额外神学联想的固定称号“爱子”。
- issue: 祝福与增多的强调结构
  choice: 以“必”和“大大”再现源文同根重复
  alternative: 直译为“赐福，我必赐福；增多，我必使增多”
  rationale: 保留应许的确定性和强度，同时使现代普通读者能够顺畅理解。
- issue: 后裔取得仇敌城邑的性质
  choice: 占有
  alternative: 承受／继承
  rationale: 源词允许“继承、占有”；此处对象为仇敌的城邑，“占有”较自然，同时不额外说明取得方式。
translation_notes:
  register: 采用现代、庄重而清晰的叙事与神谕语体。引号分层区分叙述者的话和耶和华的宣告；保留“耶和华”这一神名译法。未设置脚注，因为校勘所得“长子”已在正文中明确呈现，且无须以脚注制造并非真实的文本歧义。
