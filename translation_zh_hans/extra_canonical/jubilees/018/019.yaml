  yaml_path: translation/extra_canonical/jubilees/018/019.yaml
  text: And thus it is ordained and written on the heavenly tablets concerning Israel and his seed, that they should keep this festival seven days with festal joy.
translation:
  language: zh_hans
  text: 这样，关于以色列和其后裔，在天上的书版上已经规定并写明：他们要一连七天守这节期，带着节庆的喜乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“在节期的喜乐中”。原文在本句末尾再次使用“节期”一词。
    reason: 说明句末短语同时含有“喜乐”和第二次出现的“节期”，并交代较直译的表达。
lexical_decisions:
- source_word: ሤሩዕ፡ ውእቱ፡ መጽሐፍ
  choice: 已有规定和记载
  rationale: 原文表达某事已被确立并写下；译文兼顾法定意味与书面记载，不把“书/文字”误解为一部独立的书卷。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的石版
  rationale: ጽላት指版、刻写用的板，传统语境中常指石版；“天上的石版”既具体又保留原文的天上记录意象。
- source_word: ዘርኡ
  choice: 他的后裔
  rationale: 字面为“他的种子”，在族裔延续语境中自然译为“后裔”。
- source_word: ለገቢረ፡ ዛቲ፡ በዓል፡ ሰቡዐ፡ ዕለተ
  choice: 他们要一连七天守这节期
  rationale: ገብረ字面可为“行、做”，用于节期时表达遵守或举行；“守这节期”符合现代中文宗教叙事用语，并清楚呈现七天的时长。
- source_word: በፍሥሓ፡ በዓል
  choice: 满怀节庆的喜乐
  rationale: 既保留ፍሥሓ“喜乐”的意义，也体现句末再次出现的በዓል“节期/节庆”，避免仅译作“喜乐”而造成词义损失。
theological_decisions:
- issue: 天上石版所表达的规定性质
  choice: “已有规定和记载”
  alternative: “命定并写着”
  rationale: 原文兼有确立与写下之意；所选译法不额外界定命定者、时间或神学机制，保留文本本身的简洁陈述。
- issue: 以色列的所指
  choice: 保留“以色列”及单数领属“他的后裔”
  alternative: 释为“以色列民族及其后代”
  rationale: 原文可使“以色列”兼具先祖与群体色彩；不在正文中将其单一化，可保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一连七天”自然呈现持续时间；“满怀节庆的喜乐”避免生硬直译，同时保留原文重复“节期”所带出的节庆意味。
