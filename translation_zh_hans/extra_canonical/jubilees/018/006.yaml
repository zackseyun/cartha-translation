  text: 'And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”'
translation:
  language: zh_hans
  text: 以撒对父亲说：“父亲。”他回答说：“我在这里，我儿。”以撒对他说：“看哪，火、刀和木柴都在这里，可是作燔祭用的羊在哪里呢，父亲？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነየ፡ አነ
  choice: 我在这里
  rationale: 这是回应呼唤的惯用表达，既贴近原文，也符合现代汉语习惯。
- source_word: መጥባሕት
  choice: 刀
  rationale: 指献祭时使用的刀；采用普通而准确的现代用语。
- source_word: ዕፀው
  choice: 柴
  rationale: 上下文指供焚烧祭物所用的木柴，译作“柴”自然明确。
- source_word: በግዕ
  choice: 羊
  rationale: 该词泛指绵羊；原文未明确其年龄或性别，因此不窄化为“羊羔”或“公羊”。
- source_word: ዘለጽንሓሕ
  choice: 作燔祭的
  rationale: 按献祭语境表达供完全焚烧之祭物的用途；“燔祭”是现代中文圣经语域中准确且通行的术语。
theological_decisions:
- issue: 祭牲的具体种类、年龄和性别
  choice: 羊
  alternative: 羊羔／公羊
  rationale: 原文仅表达绵羊，并未明确年龄或性别；保留其范围，避免受平行传统措辞影响而过度具体化。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留父子间重复的呼唤与回应，并用“火、刀和柴都有了”自然呈现列举后的语义转折。
