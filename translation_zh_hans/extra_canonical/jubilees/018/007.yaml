  text: And he said, “God will see for himself the sheep for the burnt offering, my son.” And he came near to the place of the mountain of the LORD.
translation:
  language: zh_hans
  text: 他说：“上帝必亲自察看作燔祭所需的羊，我儿。”于是，他走近耶和华的山的那地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሬኢ፡ ሎቱ
  choice: 必亲自看顾
  rationale: 字面为“为自己看见”，在献祭语境中兼有察看、顾念并预备之意；译作“亲自看顾”保留其含蓄，不把“预备”这一可能含义直接明说。
- source_word: በግዐ
  choice: 羊
  rationale: 原词泛指绵羊；此处未明确性别或年龄，因此不用“羊羔”。
- source_word: ለጽንሓሕ
  choice: 作燔祭
  rationale: 该词在此指完全焚烧献上的祭，现代汉语圣经传统通常称“燔祭”。
- source_word: ደብረ፡ እግዚአብሔር
  choice: 耶和华之山
  rationale: 保留“山”与神名的属格结构；以“耶和华”呈现圣名，符合庄重而通行的现代汉语表达。
theological_decisions:
- issue: “上帝必为自己看见羊”的含义
  choice: 上帝必亲自看顾作燔祭的羊
  alternative: 上帝必亲自预备作燔祭的羊
  rationale: 源文动词本义是“看见”，语境可引申为“预备”。正文采用“看顾”，既自然，又避免提前消除“看见／顾念／预备”之间的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“我儿”保留父亲对儿子的直接称呼；“走近……那地方”尽量反映原文的空间推进。
