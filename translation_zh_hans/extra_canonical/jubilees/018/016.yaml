base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/018/016.yaml
  text: And in your seed all the nations of the earth will be blessed, because you have obeyed my voice, and I have made known to all that you are faithful to me in all that I have said to you. Go in peace.”
translation:
  language: zh_hans
  text: 地上万国都必因你的后裔[a]蒙福，因为你听从了我的话。我已使众人知道，你在我对你所说的一切事上都忠于我。平安地去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文为单数形式，也可作集合意义，指子孙后代。
    reason: 保留源语在单一后代与集合性后裔之间的真实歧义。
lexical_decisions:
- source_word: በዘርእከ
  choice: 因你的后裔
  rationale: “种子、后裔”在此为集合性表达；译作“后裔”符合现代汉语，也保留其可指群体或单一后代的语义张力。介词“因”表达万国得福所凭借的媒介关系。
- source_word: ይትባረኩ
  choice: 蒙福
  rationale: 采用被动含义的“蒙福”，自然表达“被赐福”，且不擅自明说施福者。
- source_word: ሰማዕከ፡ ቃለ፡ ዚአየ
  choice: 你听从了我的话
  rationale: 此处“听”带有服从、遵命的语用含义，“听从”比单纯“听见”更准确。
- source_word: አይደዐኩ፡ ለኵሉ
  choice: 我已使众人知道
  rationale: 保留使役意义，并将“向所有人”自然表达为“使众人知道”。
- source_word: ምእመን
  choice: 忠于
  rationale: 该词表达可信、忠信；在“对我”这一关系结构中，“忠于我”是自然且庄重的汉语。
- source_word: ሖር፡ በሰላም
  choice: 平安地去吧
  rationale: 贴近原文命令式，同时保留临别祝愿的语气。
theological_decisions:
- issue: “后裔”是单数个体还是集合群体
  choice: 正文保留“后裔”并加注说明
  alternative: 明确译作“子孙”或“那一位后裔”
  rationale: 源词为单数形式但可具集合义；不应在正文中提前裁定其神学指向。
- issue: 万国蒙福的关系
  choice: 译作“因你的后裔蒙福”
  alternative: “在你的后裔里蒙福”
  rationale: 原介词短语可表达范围或媒介；“因”在现代汉语中清楚自然，同时未进一步界定实现方式。
- issue: “忠信”的对象与性质
  choice: “忠于我”
  alternative: “在我看来是可信的”
  rationale: 上下文强调亚伯拉罕对上帝吩咐的忠诚；此译法保留关系性忠信，而不引入特定教义框架。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式尽量贴近源文层次，以“因为”承接蒙福应许的缘由，并以“平安地去吧”保留正式的差遣与祝愿语气。
