  yaml_path: translation/extra_canonical/jubilees/018/008.yaml
  text: And he built the altar and placed the wood on the altar, and he bound Isaac his son and laid him on the wood that was on top of the altar, and he stretched out his hand to take the knife so that he might slaughter Isaac his son.
translation:
  language: zh_hans
  text: 他筑了一座祭坛，把木柴放在祭坛上，又捆绑他的儿子以撒，把他放在祭坛上面的木柴上。随后，他伸手拿刀，要宰杀他的儿子以撒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምሥዋዕ
  choice: 祭坛
  rationale: 该词在本节指承放祭物和木柴的祭坛；按现代汉语圣经语体译为“祭坛”。
- source_word: ዕፀወ / ዕፀው
  choice: 木柴
  rationale: 上下文是献祭所用的木料，译作“木柴”比泛称“木头”更自然准确。
- source_word: አሰረ
  choice: 捆绑
  rationale: 保留原文明确的束缚动作，也与创世记献以撒叙事的传统措辞相符。
- source_word: መጥባሕተ
  choice: 刀
  rationale: 指宰杀祭牲所用的刀具；原文未要求更专门的器具名称。
- source_word: ይዝብሖ
  choice: 宰杀
  rationale: 该动词表达以献祭方式杀死，译为“宰杀”保留其祭牲语境及叙事的尖锐性。
theological_decisions:
- issue: 亚伯拉罕拿刀时的意图表达
  choice: 要宰杀他的儿子以撒
  alternative: 以便宰杀他的儿子以撒
  rationale: 原文目的结构表明行动意向；“要”在现代汉语中自然传达这一点，同时不对事件是否最终实施作超出原文的判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“捆绑”“宰杀”等原文直白措辞，不淡化献祭场景，也不加入动机或神学解释。
