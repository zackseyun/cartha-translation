  yaml_path: translation/extra_canonical/jubilees/018/003.yaml
  text: And he rose early in the morning and saddled his donkey, and he took two servants with him, and Isaac his son; and he split the wood for the burnt offering, and he went to the place on the third day.
translation:
  language: zh_hans
  text: 他清早起来，给驴备上鞍，带着两个仆人和他儿子以撒，劈开燔祭用的柴；在第三天，他前往那地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሌለየ፡ በነግህ፡
  choice: 清早起来
  rationale: 对应“清晨早起”的动作，以现代汉语自然表达保留时间强调。
- source_word: ጸዐነ፡ አድጎ፡
  choice: 给驴备上鞍
  rationale: 该短语指为驴装鞍、备妥坐骑；用“备上鞍”比单说“预备驴”更具体。
- source_word: ከአአተ፡ ደቂቀ፡
  choice: 两个仆人
  rationale: 字面涉及“两名年轻人/随从”；叙事情境中指随行仆役，但不增加身份细节。
- source_word: መሥዋዕተ፡
  choice: 燔祭
  rationale: 指完全焚烧献上的祭物；沿用简明且通行的圣经礼仪术语。
- source_word: በሠሉስ፡ ዕለት፡
  choice: 第三天
  rationale: 按抄本文本将该时间语与到达目的地相连，符合源语次序及创世记平行叙事。
theological_decisions:
- issue: 献祭术语的表达
  choice: 燔祭
  alternative: 烧献祭／全烧祭
  rationale: “燔祭”准确传达祭物全然焚烧献上的含义，也为现代中文圣经读者所熟悉，不引入额外教派解释。
- issue: “第三天”与动作的句法关系
  choice: 第三天，他到了那地方
  alternative: 他前往那地方，到了第三天
  rationale: 源文末尾时间短语存在附着上的一定弹性；结合平行叙事，译作第三天到达最自然，同时不扩充未明说的行程细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；以连续动作推进句子，并用分号清楚区分启程与第三天到达。
