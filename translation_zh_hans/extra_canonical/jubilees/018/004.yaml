  yaml_path: translation/extra_canonical/jubilees/018/004.yaml
  text: And he saw the place from afar. And he came as far as the well of water, and he said to his servants, “Stay here with the donkeys, and I and the boy will go on, and we will worship, and we will return to you.”
translation:
  language: zh_hans
  text: 他远远地看见了那地方。他来到一口水井[a]旁，对仆人们说：“你们和这些驴留在这里；我和孩子要到前面去敬拜，然后回到你们这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“水坑”。
    reason: 原文短语既可指水井，也可指用于蓄水的坑；正文采用更自然且符合常见用法的“水井”，脚注保留词义范围。
lexical_decisions:
- source_word: መካነ
  choice: 那地方
  rationale: 该词意为“地方、处所”；加“那”自然承接特指地点，又不额外说明其性质。
- source_word: ዐዘቅተ፡ ማይ
  choice: 一口水井
  rationale: 该短语直指有水的井或蓄水坑；“水井”符合现代汉语习惯，并以脚注保留“水坑”的可能。
- source_word: ለደቁ
  choice: 仆人们
  rationale: 此处指随行、受吩咐留下的人；结合复数语境译作“仆人们”，比直译“少年人们”自然。
- source_word: አድግት
  choice: 这些驴
  rationale: 原词为复数；汉语名词本身不显数，故用“这些”明确保留复数，避免受《创世记》平行叙述的单数影响。
- source_word: ወሕፃን
  choice: 孩子
  rationale: 原词指幼小者或孩子；“孩子”自然且不额外限定年龄或身份。
- source_word: ወሰጊደነ
  choice: 敬拜
  rationale: 该动词含俯伏、下拜或敬拜之意；此处行为具有宗教指向，“敬拜”最符合语境，同时不增添仪式细节。
theological_decisions:
- issue: “我们要回到你们这里”是否暗示二人都将返回
  choice: 然后回到你们这里
  alternative: 然后我回到你们这里
  rationale: 原文使用第一人称复数形式，把“去、敬拜、回来”作为“我和孩子”的共同动作；应保留这一叙述张力，不改成单数，也不解释亚伯拉罕的意图或预期。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“你们和这些驴留在这里”明确原文中驴为复数；“到前面去”自然表达继续前行，未补入原文没有的地形、距离或献祭说明。
