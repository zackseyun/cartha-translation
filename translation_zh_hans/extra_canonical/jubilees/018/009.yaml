  yaml_path: translation/extra_canonical/jubilees/018/009.yaml
  text: And I stood before him and before the prince Mastema, and the LORD said, “Tell him not to lay his hand upon the boy, and not to do anything to him, for now I know that he is one who fears God.”
translation:
  language: zh_hans
  text: 我站在他和天使玛斯提玛面前。耶和华说：“告诉他，不可伸手加害这孩子，也不可对他做任何事，因为我知道他是敬畏上帝的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መላእክት፡ መስተማ
  choice: 玛斯提玛首领
  rationale: 按该短语在本节语境中的称号功能处理为“玛斯提玛首领”；音译专名，并用“首领”表达其身份。
- source_word: ኢያውርድ፡ እዴሁ፡ ላዕለ፡ ሕፃን
  choice: 不可伸手加害这孩子
  rationale: 原文是“不可把手伸向/落在孩子身上”的动作表达；结合献祭场景，以自然汉语“伸手加害”传达禁止伤害之意，避免生硬直译。
- source_word: ወኢይግበር፡ ምዝገኒ፡ ላዕሌሁ
  choice: 也不可对他做任何事
  rationale: 保留原文宽泛的全面禁令，不把“任何事”缩窄为某一种具体伤害。
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: 敬畏上帝的人
  rationale: 以现代汉语圣经语体表达“敬畏上帝者”，兼顾畏惧、尊崇与忠诚的含义。
theological_decisions:
- issue: “我知道”是否带有“现在”的时间副词
  choice: 我知道
  alternative: 现在我知道
  rationale: 所给吉兹文在“我知道”前未见明确对应“现在”的词；因此依原文证据不增补时间副词，保留神认识之表述本身的张力。
- issue: “他”所指对象
  choice: 保留代词“他”
  alternative: 明确写成“亚伯拉罕”或“天使”
  rationale: 原文代词存在于叙事链中，本节不擅自补明指称，以免消除原有的篇章依赖和可能的歧义。
- issue: 神名的汉语表达
  choice: 叙述者称“耶和华”，称谓短语中用“上帝”
  alternative: 两处都译“耶和华”或两处都译“上帝”
  rationale: 第一处是专名式主语，第二处是“敬畏神/上帝者”的固定称谓；如此可自然呈现二者在原文中的语用差异。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句式简洁，保留直接引语和代词关系；不依英语咨询文本增添吉兹文未明确表达的“现在”。
