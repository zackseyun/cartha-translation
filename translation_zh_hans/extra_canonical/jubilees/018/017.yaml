  text: And Abraham went to his servants, and they arose and went together to Beer-sheba, and Abraham dwelt by the Well of the Oath.
translation:
  language: zh_hans
  text: 亚伯拉罕到仆人那里去；他们便起来，一同往别是巴去。亚伯拉罕住在誓言之井旁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቁ
  choice: 仆人
  rationale: 此处依上下文指随行的年轻仆人；译作“仆人”比字面上的“孩子们/年轻人”更符合现代汉语叙事。
- source_word: በርስሕ
  choice: 别是巴
  rationale: 按传统地名音译；该名称在后半句以其词源性称谓“誓约井”复现。
- source_word: ዐዘቅት፡ መሐላ
  choice: 誓约井
  rationale: 保留该短语“井/水井”与“誓言、誓约”的词源意义，并与“别是巴”形成有意呼应。
- source_word: ኀደረ
  choice: 住
  rationale: 表达定居、居留之意，使用简明自然的现代汉语。
