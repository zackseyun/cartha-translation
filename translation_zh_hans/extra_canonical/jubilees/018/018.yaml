  yaml_path: translation/extra_canonical/jubilees/018/018.yaml
  text: And he kept this festival every year for seven days with joy, and he named it the Festival of the LORD, according to the seven days during which he had gone and returned in peace.
translation:
  language: zh_hans
  text: 他每年都欢喜地守这节七天，并称它为“主的节期”，按着他去而平安归来的那七天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብር
  choice: 守
  rationale: 此处宾语是节期，用现代汉语“守这节”自然地表达举行、遵守节庆。
- source_word: በኵሉ፡ ዓመታት
  choice: 年年
  rationale: 简洁传达“每一年”的反复性。
- source_word: ሰቡዐ፡ ዕለተ
  choice: 七天
  rationale: 按字面保留节期持续七日的信息。
- source_word: በፍሥሓ
  choice: 欢欢喜喜地
  rationale: 表达喜乐、欢庆的方式，符合节庆语境，也易为现代读者理解。
- source_word: በዓለ፡ እግዚአብሔር
  choice: 耶和华的节
  rationale: 保留“主之节”的称谓；以中文圣经传统常用专名“耶和华”对应神名式译法。
- source_word: ሖረ፡ ወተመይጠ፡ በሰላም
  choice: 出去又平安归来
  rationale: 依次保留“去、返回、平安”三个语义成分。
theological_decisions:
- issue: “耶和华的节”是否指后来律法中的某一特定节期
  choice: 不指明具体节期，仅保留称谓“耶和华的节”
  alternative: 译成某个后世已有专名的节期
  rationale: 原文只给出名称和七日背景，未明确等同于后来的某一制度化节期；不宜加入宗派性或历史性认定。
- issue: 七天与往返行动的关系
  choice: 译为“出去又平安归来，前后共七天”
  alternative: 译为“在他出去和归来的七天期间”
  rationale: 原句关系略显压缩；当前译法保留七天涵盖出行至归来的自然理解，同时不补定具体每日行程。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“年年”“守这节”便于普通读者理解；引号标示节期名称。无脚注标记。
