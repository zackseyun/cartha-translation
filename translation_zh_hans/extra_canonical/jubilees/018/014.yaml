  yaml_path: translation/extra_canonical/jubilees/018/014.yaml
  text: And the LORD called to Abraham by name a second time from heaven, as he had shown me, that we should speak in the name of the LORD.
translation:
  language: zh_hans
  text: 耶和华第二次从天上点名呼唤亚伯拉罕，正如他向我显明的：我们应当奉耶和华的名说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዖ
  choice: 呼唤
  rationale: 对应“呼叫、召唤”，并以“点名”表达随后“以他的名/按名”的含义，避免误解为借亚伯拉罕之名行事。
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 此处为神名的传统汉语圣经表达；重复出现时保持一致。
- source_word: በስሙ
  choice: 点名
  rationale: 字面涉及“以他的名字/按名”；在呼唤语境中译作“点名”自然且准确。
- source_word: ዳግመ
  choice: 第二次
  rationale: 直接保留动作再次发生的次数含义。
- source_word: እምሰማይ
  choice: 从天上
  rationale: 保留来源介词及“天”的空间表达。
- source_word: አስተረአየኒ
  choice: 向我显明
  rationale: 使役/显现类形式含“使我看见、向我显示”之意；“显明”兼顾文本的启示语域与现代可懂性。
- source_word: ንትናገር
  choice: 让我们……说话
  rationale: 保留第一人称复数和从属结构，不将“我们”擅自改成单数或泛指。
- source_word: በስመ፡ እግዚአብሔር
  choice: 奉耶和华的名
  rationale: 自然表达“以耶和华之名”，保留代表其权柄发言的语义。
theological_decisions:
- issue: “我们”所指的群体
  choice: 保留“我们”，不说明具体所指
  alternative: 解释为天使群体、叙述者与同伴，或泛指受命者
  rationale: 源文使用第一人称复数但本节未明确界定其所指；译文应保留这种指代上的开放性。
- issue: “正如他向我显明的”与后续从句的关系
  choice: 用逗号分隔，并将后句译为目的“为要让我们……”
  alternative: 把“让我们奉耶和华的名说话”理解为所显明的内容
  rationale: 源文句法允许比较从句与后续目的/结果从句相接；此译法依词序保留两层结构，但不额外补足对象。
- issue: 神名的呈现
  choice: 耶和华
  alternative: 上主
  rationale: 在简体中文圣经传统中，“耶和华”清楚标示专名；本处未出现需要以称号弱化或解释神名的依据。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“点名呼唤”比“以他的名呼叫”更符合现代汉语，也避免介词歧义；后半句尽量保留源文略显紧密且指代未完全解释的结构。
