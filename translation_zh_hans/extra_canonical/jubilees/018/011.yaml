  yaml_path: translation/extra_canonical/jubilees/018/011.yaml
  text: And I said to him, “Do not stretch out your hand against the boy, and do not do anything to him, for now I know that you fear God, and you have not withheld your son, your firstborn, from me.”
translation:
  language: zh_hans
  text: 我对他说：“不可向这孩子伸手，也不可对他做任何事；因为现在我知道，你敬畏上帝，并且没有把你的儿子、你的长子扣留不给我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእቤሎ
  choice: 我对他说
  rationale: 动词是第一人称单数完成式，叙述者说“我对他说”，不是“他对他说”。
- source_word: አትፈኑ፡ እዴከ፡ ዲበ፡ ሕፃን
  choice: 不要伸手伤害这孩子
  rationale: 保留“伸手对付”的原文意象，同时用“伤害”明确该句在现代汉语中的自然含义。
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: 敬畏上帝的
  rationale: “敬畏”兼具畏惧与虔敬之意，是该宗教表达在现代汉语中的常用对等语。
- source_word: ወኢምሕከ
  choice: 你没有……留下不给我
  rationale: 按该动词在此处的语义译为“不留下/不扣留”，使对象与“不给我”的关系清楚。
- source_word: በኵረከ（据Charles 1895版面校正；所给转录作በዘረከ）
  choice: 你的长子
  rationale: 所给“በዘረከ”应为OCR或转录误差；Charles 1895印本此处为表示“长子”的በኵረከ，且与审校资料一致。
theological_decisions:
- issue: 叙述者的人称
  choice: 我对他说
  alternative: 他对他说
  rationale: 忠实保留吉兹语第一人称形式，也符合在场天使向摩西叙述的框架。
- issue: “敬畏上帝”是否改释为信靠或顺服
  choice: 敬畏上帝
  alternative: 信靠上帝／顺服上帝
  rationale: 原文直接表达“敬畏”，不把其神学含义缩减为单一的信靠或顺服。
- issue: 末尾名词的文本判断
  choice: 你的儿子，就是你的长子
  alternative: 你的儿子，你的后裔
  rationale: 依Charles 1895版面读法采用“长子”；“就是”把同一对象的并列称谓自然呈现出来，不引入两个不同对象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这孩子”比“童子”更通俗；“伸手伤害”兼顾原文形式和汉语可懂度。经核对无须设置脚注，因此正文没有脚注标记。
