revisions:
- from: 我对他说：“不要伸手伤害这孩子，也不要对他做什么；因为现在我知道你是敬畏上帝的：你没有把你的儿子，就是你的长子，留下不给我。”
  to: 我对他说：“不可向这孩子伸手，也不可对他做任何事；因为现在我知道，你敬畏上帝，并且没有把你的儿子、你的长子扣留不给我。”
  rationale: 修订保留第一人称叙述及Charles 1895印本所支持的“长子”读法；将“伸手伤害”改为较贴近原文的“向这孩子伸手”，并调整后半句的句法、标点和“扣留”措辞，使其在现代标准汉语中更自然，同时不增添神学或叙事解释。英文审校轨迹中的“他对他说”与“后裔”均不应作为脚注保留：前者违背吉兹语第一人称形式，后者源于已说明的转录/OCR问题。
