revisions:
- from: 玛斯提玛首领蒙了羞。亚伯拉罕举目观看，看哪，有一只公绵羊，两角卡在灌木丛中。亚伯拉罕就过去牵了那只公绵羊来，献作燔祭，代替他的儿子。
  to: 首领玛斯提玛蒙了羞。亚伯拉罕举目观看，看哪，有一只公绵羊，羊角被灌木丛缠住。亚伯拉罕就去取了那只公绵羊，把它献上作燔祭，代替他的儿子。
  rationale: 修订仅处理汉语语序、受困关系的清晰度，以及“取”与“牵来”的源文对应程度；保留原文的“一只”、玛斯提玛的称号、燔祭及替代关系，未增添神学解释。
