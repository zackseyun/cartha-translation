  text: And Prince Mastema was put to shame. And Abraham lifted up his eyes and looked, and behold, one ram was caught by its horns in the thicket. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: zh_hans
  text: 首领玛斯提玛蒙了羞。亚伯拉罕举目观看，看哪，有一只公绵羊，羊角被灌木丛缠住。亚伯拉罕就去取了那只公绵羊，把它献上作燔祭，代替他的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: 玛斯提玛首领
  rationale: 将መኰንን译为身份称号“首领”，并按音译处理专名መስተማ；语序调整为符合现代汉语的“玛斯提玛首领”。
- source_word: ትገፍረ
  choice: 蒙了羞
  rationale: 表达受辱、遭羞辱的被动结果，保留叙事中的挫败意味。
- source_word: አሐዱ፡ በሐኵ
  choice: 一只公绵羊
  rationale: 明确保留አሐዱ“一”的信息；በሐኵ指公羊，译作普通读者易懂的“公绵羊”。
- source_word: አኀዝ፡ በዕፀው፡ በአቅርንቲሁ
  choice: 两角卡在灌木丛中
  rationale: 按语义译出公羊以角被灌木缠住、卡住的状态；“两角”自然表达复数所有格。
- source_word: አዕረገ፡ ለጽንሓሕ
  choice: 献作燔祭
  rationale: 该短语表示献上为全烧祭；采用汉语圣经传统中清楚而凝练的“燔祭”。
- source_word: ህየንተ፡ ወልዱ
  choice: 代替他的儿子
  rationale: 直接保留替代关系，不额外解释其祭祀或救赎含义。
theological_decisions:
- issue: 玛斯提玛的头衔与身份
  choice: 译作“玛斯提玛首领”
  alternative: “首领玛斯提玛”或仅作“玛斯提玛”
  rationale: 原文明确带有መኰንን这一称号，故不省略；汉语采用专名在前、头衔在后的自然形式，不进一步界定其属灵身份。
- issue: 公羊代替儿子的献祭关系
  choice: 直译为“代替他的儿子”
  alternative: 扩译为“作为他儿子的替代祭物”
  rationale: 原文只陈述替代事实；直译可避免加入原文未明说的祭祀神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“举目观看”“看哪”“燔祭”等具有经文叙事色彩且普通读者可理解的表达；句法适度现代化，避免过度古雅。
