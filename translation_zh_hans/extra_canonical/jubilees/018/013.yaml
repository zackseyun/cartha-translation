  yaml_path: translation/extra_canonical/jubilees/018/013.yaml
  text: And Abraham called that place “The LORD has seen,” so that it is said, “The LORD has seen”—it is Mount Zion.
translation:
  language: zh_hans
  text: 亚伯拉罕称那地方为“主已经看见”，以致有话说：“主已经看见”——它是锡安山。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዖ፡ ... ለውእቱ፡ መካን
  choice: 给那地方起名叫
  rationale: 原文直义为“称那地方”，在命名语境中译作“给那地方起名叫”自然清楚。
- source_word: እግዚአብሔር፡ ርእየ
  choice: 耶和华已经看见
  rationale: 保留完成式“已经看见”，并以“耶和华”表达神圣名号；不按《创世记》平行传统改译为“必预备”。
- source_word: ደብረ፡ ጽዮን
  choice: 锡安山
  rationale: 按其直接含义译出地名及“山”，采用现代中文通行音译“锡安”。
theological_decisions:
- issue: “看见”是否按《创世记》22章传统引申为“预备”
  choice: 保留“已经看见”
  alternative: 译作“耶和华必预备”或“耶和华已经预备”
  rationale: 吉兹语正文重复使用“看见”，本节将该名称直接联系于锡安山；不以平行经文的诠释替换本段措辞。
- issue: 末句与前文的关系
  choice: 译作“那就是锡安山”
  alternative: 译作“它是锡安山”
  rationale: 原文为直接判断句；中文用“那就是”明确指回所说的地方，同时不增添因果或解释关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文中名称的重复与破折号式的断定语气，不另加脚注。
