- from: 亚伯拉罕给那地方起名叫“耶和华已经看见”，因此人们说：“耶和华已经看见”——那就是锡安山。
  to: 亚伯拉罕称那地方为“主已经看见”，以致有话说：“主已经看见”——它是锡安山。
  rationale: 修订以“主”对应原文的神圣称号，避免将其无依据地窄化为专名；同时以非人称“以致有话说”保留原文结构，并用“它是锡安山”直接表达末句断言。
