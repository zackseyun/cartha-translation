  yaml_path: translation/extra_canonical/jubilees/018/005.yaml
  text: And he took the wood of the offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and the two of them went together to that place.
translation:
  language: zh_hans
  text: 他拿起献祭用的柴，放在他儿子以撒身上；他手里拿着火和刀。他们二人一同往那地方去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕፀወ፡ መሥዋዕት
  choice: 献祭用的柴
  rationale: 按字面为“祭物／献祭的木柴”，在现代汉语中译作“献祭用的柴”自然清楚，也保留其礼仪用途。
- source_word: መጥባሕት
  choice: 刀
  rationale: 指宰杀祭牲所用的刀；正文简译为“刀”，不额外添加原文未明说的限定。
- source_word: ኅቡረ፡ ክልኤሆሙ
  choice: 父子二人便一同
  rationale: 原文意为“他们二人一同”；依据前文人物关系用“父子二人”自然衔接，并保留共同前行的强调。
- source_word: እስክ፡ ውእቱ፡ መካን
  choice: 往那地方去
  rationale: 表达朝向既定地点前行；避免生硬译作“直到那地方”，与语境中的目的地含义相符。
