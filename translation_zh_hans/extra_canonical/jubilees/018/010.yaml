  text: And I called to him from heaven and said to him, “Abraham, Abraham.” And he was terrified and said, “Here I am.”
translation:
  language: zh_hans
  text: 我从天上呼叫他，对他说：“亚伯拉罕，亚伯拉罕。”他感到惊恐，说：“我在这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይገብዕ
  choice: 他惊恐
  rationale: 按此处吉兹语动词在叙事语境中的意义译为受到惊吓、畏缩；这也保留了《禧年书》相较相关创世记叙事所增加的反应细节。
- source_word: ነየ፡ አነ
  choice: 我在这里
  rationale: 这是回应呼召的惯用表达；用现代汉语自然、庄重的说法传达“看哪，是我／我在这里”。
- source_word: ጸዋዕክዎ፡ እምሰማይ
  choice: 我从天上呼叫他
  rationale: 依原文保留第一人称叙述者、呼叫的对象以及声音来自天上的空间关系。
theological_decisions:
- issue: 亚伯拉罕听见天上呼声后的反应
  choice: 他惊恐
  alternative: 他急忙／赶紧
  rationale: 选择与所给吉兹语词形、上下文及主要学术译本一致的“惊恐”，不把这一独特叙事细节弱化为动作迅速；同时以脚注记录旧译所反映的异译。
translation_notes:
  register: 采用现代标准普通话和简体中文；句式简洁庄重。以两个感叹号表现重复呼名的急切感，但不增添原文没有的解释。
