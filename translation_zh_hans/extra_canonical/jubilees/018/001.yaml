  yaml_path: translation/extra_canonical/jubilees/018/001.yaml
  text: And the LORD said to Abraham, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your son, your beloved one whom you love, Isaac, and go to the high land, and offer him up on one of the mountains that I will show you.”
translation:
  language: zh_hans
  text: 主对亚伯拉罕说：“亚伯拉罕！亚伯拉罕！”他回答：“我在这里。”主说：“带上你的儿子，就是你所爱的爱子——以撒，往高地去，在我要指给你的一座山上把他献上。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 主
  rationale: 这是吉兹语对神的尊称；译作“主”既与原文称谓相称，也避免仅凭后期对应传统把特定希伯来形式直接写入正文。
- source_word: ፍቁረከ፡ ዘታፈቅር
  choice: 你所爱的爱子
  rationale: 保留“所爱者”与“你所爱”的刻意重复，同时调整为自然、庄重的现代汉语。
- source_word: ይስሐቅሃ
  choice: 你的以撒
  rationale: 保留原文姓名所带的第二人称所有格，而不将其淡化为单独的“以撒”。
- source_word: ምድር፡ ልዐልት
  choice: 高地
  rationale: 原文为“土地”加阴性形容词“高的”，即“高地”，不是“高处之地”式的属格结构。
- source_word: ወአዕርጎ
  choice: 把他献上
  rationale: 该动词有“使之上升”之意，在献祭语境中自然译为“献上”；原文没有“在那里”这一副词。
- source_word: እፄይዐከ
  choice: 我要指给你
  rationale: 传达原文“我将使你看见／指示给你”的将来意义，与山的地点指示相连。
theological_decisions:
- issue: 神的称谓
  choice: 主
  alternative: 上帝；耶和华
  rationale: 吉兹语原文使用神圣尊称እግዚአብሔር。译作“主”忠实保留称谓性质；“耶和华”会进一步明确为希伯来四字神名，而该形式并未直接出现在现存吉兹语文本中。
- issue: “献上”的祭献含义
  choice: 把他献上
  alternative: 使他上升；把他献作祭物
  rationale: “献上”保留原文动词在此语境中的祭献含义，又不额外补入原文未明说的“作祭物”或祭种。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用两次呼名和简短应答保留叙事的紧迫感；“你的儿子，就是你所爱的爱子——你的以撒”尽量保存原文层层限定与情感张力，同时避免生硬直译。
