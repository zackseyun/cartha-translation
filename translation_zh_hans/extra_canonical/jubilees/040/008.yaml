base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/008.yaml
  text: And Joseph went out through all the land of Egypt, and all Pharaoh’s princes loved him, and all his servants, and all who did the king’s work, because he walked uprightly and there was no pride, or arrogance of heart, or partiality, and no taking of bribes; for he judged uprightly for all the peoples of the earth.
translation:
  language: zh_hans
  text: 约瑟走遍埃及全地。法老的众官长、众臣仆，以及所有为王办事的人都爱戴他，因为他为人正直，不骄傲，不心高气傲，也不徇私，并且不收贿赂[a]；他以正直审判地上的各族人民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贿赂”也可译作“礼物”；这里处于审判与公正的语境中，指为求偏袒而送的礼物。
    reason: 原词可指礼物或贿赂，正文依语境采用较明确的“贿赂”，脚注保留其词义范围。
lexical_decisions:
- source_word: መበለ
  choice: 走遍
  rationale: 该动词在此表示约瑟出行、巡行埃及全境；结合“全地”，译作“走遍”比生硬的“出去进入”更符合现代汉语。
- source_word: አፍቀርዎ
  choice: 爱戴他
  rationale: 原词意为“爱他”；在臣属对执政者的语境中，“爱戴”自然表达喜爱与敬重。
- source_word: ርቱዐ፡ የሐውር
  choice: 为人正直
  rationale: 字面为“正直地行走”，是品行端正的惯用表达；译为“为人正直”保留伦理含义并使中文自然。
- source_word: አሢሦተ፡ ገጽ
  choice: 徇私
  rationale: 该短语字面涉及“寻求/看人的脸”，在司法语境中指看情面、偏待人，因此译作“不徇私”。
- source_word: ነሢአ፡ ሕልያነ
  choice: 收贿赂
  rationale: 表示接受礼物或贿赂；在审判语境中译作“收贿赂”最能传达不公正利益输送的含义。
- source_word: ይኴንን
  choice: 审判
  rationale: 原词指施行判断或审判；此处描述约瑟治理各族人民，采用“审判”保留司法色彩。
- source_word: አሕዛበ፡ ምድር
  choice: 地上的各族人民
  rationale: “民族/外族”与“地”构成概括性表达；译文不将其绝对化为现代意义上的全世界人口。
theological_decisions:
- issue: 约瑟公正品格的表述
  choice: 保留“不徇私”与“不收贿赂”为两个并列特点
  alternative: 将两者合并为笼统的“不偏不倚”
  rationale: 吉兹文连续列出两个不同短语，并在收贿赂前再次出现否定结构；分开翻译既忠于句法，也保留司法伦理的具体内容。
- issue: “地上的各族人民”的范围
  choice: 按原文保留广义表述
  alternative: 解释为仅指埃及境内居民
  rationale: 上下文虽在埃及，原文措辞却较宽泛；译文不替作者消解这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“官长、臣仆、审判”保留古代宫廷与治理语境；用“不心高气傲、不徇私、不收贿赂”等普通读者易懂的表达，避免生硬直译。
