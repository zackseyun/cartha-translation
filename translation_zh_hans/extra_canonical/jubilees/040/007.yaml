  yaml_path: translation/extra_canonical/jubilees/040/007.yaml
  text: And he appointed him second in all his kingdom, and made him ruler over all Egypt, and caused him to ride on Pharaoh’s second chariot. And he clothed him with garments of fine linen, and put a gold chain on his neck, and they proclaimed before him, “El, El,” and “Abrer”; and he gave him his signet ring into his hand, and set him over all his house, and magnified him, and said to him, “Only with respect to the throne alone will I be greater than you.”
translation:
  language: zh_hans
  text: 他立约瑟在全国居第二位，使他治理全埃及，又让他乘坐法老的第二辆战车。他给约瑟穿上细麻衣，把金链戴在他颈上。人们在他前面宣告：“埃勒！埃勒！”又宣告：“阿布雷尔！”[a] 法老把印戒交在他手中，立他管理自己的王室，尊他为大，并对他说：“只有在宝座上，我才比你大。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埃勒！埃勒！”和“阿布雷尔！”是按原文音译的呼语；其确切含义不明，可能是授职时的称号或欢呼语。
    reason: 原词意义存在真实不确定性，音译可避免武断地采用某一种词源解释。
lexical_decisions:
- source_word: ዳግመ
  choice: 居第二位
  rationale: 该词在任命语境中表示“第二”，译为“居第二位”比字面“第二次”更符合句法和上下文。
- source_word: አኰነኖ
  choice: 使他治理
  rationale: 保留使役与管辖之意，以自然现代汉语表达约瑟获授对埃及的治理权。
- source_word: ልብሰ፡ ቢሶስ
  choice: 细麻衣
  rationale: ቢሶስ 对应精细亚麻布；采用读者熟悉且庄重的“细麻衣”。
- source_word: በዝግና፡ ወርቅ
  choice: 金链
  rationale: 在颈项佩戴的黄金饰物，简洁译作“金链”。
- source_word: ማዕተቤ
  choice: 印戒
  rationale: 语境指象征并执行王权的戒指，而非普通指环，故译“印戒”。
- source_word: መንበር
  choice: 宝座
  rationale: 此处指法老王位及其最高王权，译“宝座”保留具体意象。
theological_decisions:
- issue: “埃勒、埃勒”和“阿布雷尔”的含义
  choice: 音译并加注，不在正文中确定其含义
  alternative: 意译为“上帝，上帝”及“屈膝”或类似称号
  rationale: 这些呼语的词源和确切意义并不确定；原文以特殊称呼呈现，直接意译会消除真实的文本歧义，并可能引入不必要的神学判断。
- issue: 法老与约瑟的权力等级
  choice: “只有在宝座上，我才比你大”
  alternative: “惟独宝座使我比你大”
  rationale: 保留原文将法老的优越限定于宝座的张力，同时使用自然汉语，不扩大为本体或人格上的高低。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；连续动作以短句组织，保留宫廷授职场景的节奏。专名式呼语采用音译并加脚注，正文中的脚注标记与注释对应。
