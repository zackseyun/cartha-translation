revisions:
- from: 他立约瑟在全国居第二位，使他治理全埃及，又让他乘坐法老的第二辆战车。他给约瑟穿上细麻衣，把金链戴在他颈上。人们在他前面高呼：“埃勒！埃勒！”又呼喊：“阿布雷尔！”[a] 法老把印戒交在他手中，派他管理自己的全家，尊他为大，并对他说：“只有在宝座上，我才比你大。”
  to: 他立约瑟在全国居第二位，使他治理全埃及，又让他乘坐法老的第二辆战车。他给约瑟穿上细麻衣，把金链戴在他颈上。人们在他前面宣告：“埃勒！埃勒！”又宣告：“阿布雷尔！”[a] 法老把印戒交在他手中，立他管理自己的王室，尊他为大，并对他说：“只有在宝座上，我才比你大。”
  rationale: 修订仅消除“全家”在现代汉语中的家庭成员歧义，并以“宣告”更准确呈现仪式性呼告；其余译文保留原有的源文忠实性、叙事节奏及对不明呼语的审慎处理。
