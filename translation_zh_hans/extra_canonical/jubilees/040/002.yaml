  yaml_path: translation/extra_canonical/jubilees/040/002.yaml
  text: And in those days Pharaoh dreamed two dreams in one night concerning the matter of the famine that would come upon all the earth. And he awoke from his sleep and called all the interpreters of dreams who were in Egypt, and the diviners, and he told them both his dreams, but they were not able to understand.
translation:
  language: zh_hans
  text: 那些日子，法老在一夜之间做了两个梦，关乎将要临到全地的饥荒。他从睡梦中醒来，召来埃及所有的解梦人和术士，把两个梦都告诉了他们；他们却不能明白。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለመ፡ ፈርዖን፡ ሕለመ፡ ክልኤተ፡ በአሐቲ፡ ሌሊት
  choice: 法老在一夜之间做了两个梦
  rationale: 按原文顺序和数量表达；“在一夜之间”自然传达“在一个夜晚”的时间范围。
- source_word: በእንተ፡ ነገረ፡ ረኃብ
  choice: 关乎……饥荒
  rationale: 保留“关于饥荒之事”的关系，不把梦直接等同于饥荒。
- source_word: ዘይከውን፡ ዲበ፡ ኵሉ፡ ምድር
  choice: 将要临到全地的
  rationale: 表达将来发生并覆盖全地的灾情；“全地”保留原文可能指整个地区或普世范围的张力。
- source_word: መፈክራነ፡ ሕልም
  choice: 解梦人
  rationale: 指解释梦的人，采用现代汉语中清楚自然的称谓。
- source_word: ረቅይተ
  choice: 术士
  rationale: 该词指从事占卜或秘术者；“术士”较为宽泛，避免过度限定具体术法。
- source_word: ወአክሀሉ፡ አእምሮ
  choice: 他们却不能明白
  rationale: 直接反映原文关于没有能力理解的表述，不扩写为“不能说出梦的含义”。
theological_decisions:
- issue: “全地”的范围
  choice: 全地
  alternative: 全国／整个埃及
  rationale: 原文使用“全地”，不应根据叙事背景擅自缩小为埃及，也不额外解释为全球。
- issue: 术士身份的具体性质
  choice: 术士
  alternative: 占卜者／魔法师
  rationale: 源词语义较宽，选择不预设某一种具体占卜方式、也不附加道德评价的称呼。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；句式紧凑，保留原文前后推进和末句转折。
