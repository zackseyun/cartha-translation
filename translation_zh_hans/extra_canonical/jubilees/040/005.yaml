- from: “现在，法老要在埃及全地委派官员，让他们在丰收年日[b]把粮食储存在各城的仓房里[a]。这些粮食要作为七个荒年的储备，使这地不致在饥荒面前灭亡，因为饥荒将极其严重。”
  to: “现在，法老要在埃及全地委派官员，让他们在丰收的那些年间[b]，把粮食储存在各城的仓房里[a]。这些粮食要作七个荒年的供应，使这地不致因饥荒而毁灭，因为饥荒将极其严重。”
  rationale: 修订仅处理影响现代汉语可读性的“丰收年日”，并使供应一词更贴近源文；保留原有句意、行政语气、七年荒年、仓房及饥荒严重等全部信息。脚注a改为具有实际替代意义的译法，脚注b继续保留源文特有的时间表达。
