base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/005.yaml
  text: “And now let Pharaoh appoint overseers in all the land of Egypt, and let them store up grain in the storehouses of the cities, in each city, during the days of the years of abundance. And it will be provision for the seven years of famine, and the land will not perish before the face of the famine, for it will be very severe.”
translation:
  language: zh_hans
  text: “现在，法老要在埃及全地委派官员，让他们在丰收的那些年间[b]，把粮食储存在各城的仓房里[a]。这些粮食要作七个荒年的供应，使这地不致因饥荒而毁灭，因为饥荒将极其严重。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在各城中”。
    reason: 对应英文审校记录所保留的较简略地点译法；正文则译出源文“房屋”在积粮语境下所指的仓房。
  - marker: b
    text: 直译“在丰收诸年的日子中”；也可译“在丰收的那些年间”。
    reason: 说明源文“日子＋诸年”的闪语式表达，同时使正文保持自然现代汉语。
lexical_decisions:
- source_word: ይስራዕ፡ ፈርዖን፡ … መኰንነ
  choice: 法老要……委派官员
  rationale: ይስራዕ在此表达劝告或命令；መኰንነ指受委任的官员或主管。中文用“委派官员”自然呈现其行政职能，同时不强行限定具体官衔或人数。
- source_word: ይዝግቡ
  choice: 把粮食储存
  rationale: 该动词表示收集、积存；结合丰年与随后荒年的语境，补出隐含宾语“粮食”，使现代汉语清楚自然。
- source_word: በቤተ፡ አህጉር፡ ውስተ፡ ሀገር
  choice: 在各城的仓房里
  rationale: ቤተ本义为“房屋”，在积粮语境中指储粮的仓房；后续“在城里/在一座城里”具有逐城分配的意味，因此译作“各城的仓房里”。
- source_word: ሲሳተ
  choice: 储备
  rationale: 该词指供应、生计或口粮；这里是为荒年预存的粮食，译作“储备”最贴合上下文。
- source_word: ወኢትትሐጐል፡ ምድር፡ እምቅድመ፡ ገጸ፡ ረኃብ
  choice: 使这地不致在饥荒面前灭亡
  rationale: 保留“在……面前”这一源文形象，并以“不致灭亡”传达土地及其居民不被饥荒摧毁的意思。
- source_word: ኀያል፡ ይከውን፡ ጥቀ
  choice: 将极其严重
  rationale: 字面为“将非常强烈”；用于饥荒时，现代汉语自然表达为“极其严重”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“丰收年日”有意保留源文较具闪语色彩的措辞，并用脚注解释；其余句法适度顺应现代汉语。所有脚注标记均已置于正文对应位置。
