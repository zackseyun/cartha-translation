base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/001.yaml
  text: 'And it happened to them just as he had interpreted for them: Pharaoh restored the chief cupbearer to his office, and he killed the baker, as Joseph had interpreted for them. And the chief cupbearer left Joseph in the prison house, even though he had informed him of what would happen, and he did not remember to inform Pharaoh of what Joseph had told him, for he forgot.'
translation:
  language: zh_hans
  text: 事情果然如他为他们所作的解释那样发生了：法老使司酒长复职，却处死了面包师，正如约瑟为他们所作的解释。司酒长把约瑟留在监牢里，尽管约瑟已经告诉他将要发生的事；他没有想起把约瑟所告诉他的事禀告法老，因为他忘了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈከረ
  choice: 作解释
  rationale: 此处指约瑟对梦的解释；译作“作解释”既自然，也避免加入原文没有明说的“梦”。
- source_word: ሊቀ፡ መዘርት
  choice: 司酒长
  rationale: “ሊቀ”表示首领或主管，结合职务词译为通行且简洁的“司酒长”。
- source_word: ሐባዚስ
  choice: 司饼的
  rationale: 原文在此没有“长/首领”一词，不按《创世记》平行叙事增译为“司饼长”。
- source_word: ወረሰዮ
  choice: 把……留在
  rationale: 该动词表示留下或安置，并非“忘记”；与本节末尾明确表示“忘记”的ረሳዐ区别开来。
- source_word: አይድዖ
  choice: 告诉他
  rationale: 按使役含义处理，表达约瑟使司酒长知道将要发生的事，即“告诉他”。
- source_word: ቤተ፡ ሞቅሕ
  choice: 监牢
  rationale: 字面与语境均指拘禁之所；现代汉语中“监牢”清楚而庄重。
- source_word: ረሳዐ
  choice: 忘了
  rationale: 保留末句直接说明司酒长遗忘的语义，并与前面的“留在”清楚区分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。首句保留原文先用代词、后明确说“约瑟”的结构；不以《创世记》的平行措辞补入原文没有的“司饼长”。后半句明确两个代词所指，以免中文产生不必要的指代混乱，同时保留“没有想起……因为忘了”的原文重复强调。
