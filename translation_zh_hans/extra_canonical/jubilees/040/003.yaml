  text: Then the chief cupbearer remembered Joseph and spoke about him to the king, and he brought him out from the prison house, and he told before him both his dreams.
translation:
  language: zh_hans
  text: 于是，司酒长想起了约瑟，就向王提起他。王把约瑟从监牢里带出来，并在他面前讲述了自己的两个梦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: 司酒长
  rationale: 该官衔指掌管王室酒饮的高级官员；用“司酒长”既保留职务性质，也符合现代中文圣经语体。
- source_word: ተዘከረ፡ ለዮሴፍ
  choice: 想起了约瑟
  rationale: 直接表达“记起、想起约瑟”，自然且忠实。
- source_word: ቤተ፡ ሞቅሕ
  choice: 牢房
  rationale: 字面为拘禁之所或监牢之屋；“牢房”简洁自然。
- source_word: ሕለመሁ
  choice: 自己的……梦
  rationale: 词尾 -ሁ 明确表示第三人称阳性单数所属，即司酒长“他的”梦；中文用反身代词“自己的”清楚指回叙述者。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。末句通过明确主语“司酒长”和反身代词“自己的”消除中文中的指代误解，同时忠实保留原文所明示的第三人称阳性单数所属关系。
