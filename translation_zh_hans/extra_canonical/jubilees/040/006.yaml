  yaml_path: translation/extra_canonical/jubilees/040/006.yaml
  text: And the Lord gave Joseph favor and mercy in Pharaoh’s sight, and Pharaoh said to his servants, “We will not find a man wise and understanding like this man, for the spirit of the Lord is with him.”
translation:
  language: zh_hans
  text: 主使约瑟在法老眼前得恩惠和怜悯。法老对臣仆说：“我们找不到像这人一样有智慧、有见识的人，因为主的灵与他同在。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞገሰ፡ ወምሕረተ
  choice: 恩惠、怜悯
  rationale: 分别保留两个并列名词的语义，不将其合并为笼统的“恩宠”。
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለፈርዖን
  choice: 在法老眼前
  rationale: 保留原文具有闪语色彩的关系性表达，同时符合现代中文圣经语体。
- source_word: ለባእክኒሁ
  choice: 臣仆
  rationale: 此处指法老属下的侍臣或官员；“臣仆”既体现宫廷语境，也避免限定为某一具体官职。
- source_word: ጠቢበ፡ ወማእምረ
  choice: 有智慧、有见识
  rationale: 保留两个并列性质：前者偏重智慧，后者偏重知识、理解或洞察。
- source_word: መንፈሰ፡ እግዚአብሔር
  choice: 主的灵
  rationale: 按原文直译，不将“灵”具体解释为能力、智慧或某种心理状态。
- source_word: ምስሌሁ
  choice: 与他同在
  rationale: 准确表达“和他一起、与他同在”的关系含义。
theological_decisions:
- issue: “主的灵”是否应解释为神所赐的智慧能力
  choice: 保留“主的灵”
  alternative: 主所赐的智慧／神的能力
  rationale: 原文明确使用“灵”，直接保留可避免把具有神学张力的表述缩减为单一功能。
- issue: 法老的话是陈述无法找到，还是反问
  choice: 译为陈述“我们找不到”
  alternative: “我们岂能找到……吗？”
  rationale: 所给吉兹文本的否定动词形式及英语审校层均支持陈述式；不另行引入反问语气。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“在法老眼前”有意保留原文表达；引语流畅清楚，不添加原文没有的称号或解释。
