  to: 约瑟把各城的粮食收集起来，存放在各自城内[a]，直到各城都储满了五谷；粮食极其丰盛，多得无法计数或量度。
  rationale: 修订使首句明确保留“收集”与“存放”的动作，并以“各自城内”自然表达按城对应的储存。后半改用“各城都储满了五谷”和“无法计数或量度”，既保留原文“充满”及“计数、量度”两个并列概念，也避免不明确的代词指向。
