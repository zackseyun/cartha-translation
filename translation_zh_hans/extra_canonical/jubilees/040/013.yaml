  yaml_path: translation/extra_canonical/jubilees/040/013.yaml
  text: And Joseph gathered food for each city within the city until they were full of grain, until they were unable to count and measure it because of its abundance.
translation:
  language: zh_hans
  text: 约瑟把各城的粮食收集起来，存放在各自城内[a]，直到各城都储满了五谷；粮食极其丰盛，多得无法计数或量度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“为各城，在城内”；在此语境中，指按各城将粮食存放在城内。
    reason: 说明原文介词结构及正文所采用的、与储粮语境相符的理解。
lexical_decisions:
- source_word: ሲሳተ
  choice: 粮食
  rationale: 该词指食物或粮食；结合约瑟储粮的语境及后文“谷物”，译作“粮食”自然且准确。
- source_word: ለሀገር፡ ውስተ፡ ሀገር
  choice: 把各城的粮食收存在本城里
  rationale: 这一结构直译近于“为一城，在城中”，表达各城的粮食储存在该城之内；用“本城”清楚呈现这种对应关系，而不误解为在城市之间搬运。
- source_word: መልአ፡ ስርናየ
  choice: 城里装满了五谷
  rationale: መልአ 表示“充满、装满”，ስርናየ 指谷物；保留具体的“装满”意象，不提前并入后面的不可计量。
- source_word: ኍልቈቶ፡ ወሰፈረ
  choice: 计数，也无法量度
  rationale: 分别呈现“数算”与“量度”两个并列概念，并让“无法”同时支配二者，符合原文句法。
- source_word: እምነ፡ ብዝኁ
  choice: 粮食极其丰盛，多得
  rationale: 原文说明不能计量的原因是数量众多；此译法在现代汉语中自然地保留因果关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“收存在本城里”明确表达粮食就地储藏；分号保留原文由装满到无法计量的递进关系。
