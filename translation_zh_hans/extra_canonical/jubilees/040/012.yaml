revisions:
- from: 就在那一年，以撒去世了。事情果然照约瑟所说的、关于那两个梦的解释实现了，正如他告诉法老的：埃及全地有七个丰收年；埃及土地出产极其丰盛，一份种子收获一千八百份。[a]
  to: 就在那一年，以撒去世了。事情果然如约瑟对法老所说、关于他那两个梦的解释那样发生了：埃及全地有七个丰年；埃及地出产极其丰盛，一量竟有一千八百量。[a]
  rationale: 修订删除“种子”“收获”等原文未明说的补足，以“一量竟有一千八百量”保留简略而突出的比例表达；同时调整应验句式，并将“丰收年”改为含义更宽的“丰年”。“法老”作为上下文中“他”的所指，属于必要且安全的篇章指代澄清。
