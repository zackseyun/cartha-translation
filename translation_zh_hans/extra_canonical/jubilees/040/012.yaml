  yaml_path: translation/extra_canonical/jubilees/040/012.yaml
  text: 'And in that year Isaac died. And it came to pass just as Joseph had spoken concerning the interpretation of his two dreams, just as he had told him: there were seven years of abundance in all the land of Egypt, and the land of Egypt produced exceedingly, one measure yielding eighteen hundred measures.'
translation:
  language: zh_hans
  text: 就在那一年，以撒去世了。事情果然如约瑟对法老所说、关于他那两个梦的解释那样发生了：埃及全地有七个丰年；埃及地出产极其丰盛，一量竟有一千八百量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一量有一千八百量”。具体量度单位及这一比例所指的农业计算方式未说明；正文不把“一量”限定为种子或收获。
    reason: 保留原文简略的量度表达，避免将未明说的投入物或计算机制写入正文。
lexical_decisions:
- source_word: ሞተ
  choice: 去世了
  rationale: 准确表达“死去”，同时保持叙事文体庄重自然。
- source_word: ፍካሬ፡ ክልኤ፡ ሕልሙ
  choice: 那两个梦的解释
  rationale: 依次对应“解释、两个、他的梦”，保留原文所指的两个梦。
- source_word: ሰብዐቱ፡ ክረምት፡ ዘጽጋብ
  choice: 七个丰收年
  rationale: “ጽጋብ”含饱足、丰裕之意；在农业与粮食语境中译作“丰收”最自然。
- source_word: ወፈርየት፡ ምድረ፡ ግብጽ፡ ብዙኀ
  choice: 埃及土地出产极其丰盛
  rationale: 保留土地结果众多、产量丰厚的含义，以现代汉语自然表达。
- source_word: አሐቲ፡ መስፈርት፡ ዐሠርተ፡ ወሰመትነ፡ ምእተ፡ መስፈረ
  choice: 一份种子收获一千八百份
  rationale: 原文直陈一个量度对应一千八百量度；结合农产语境补出“种子”和“收获”，使比例关系清楚。
theological_decisions:
- issue: “正如他告诉他”的后一个代词所指
  choice: 正如他告诉法老的
  alternative: 正如他告诉他的
  rationale: 上下文是约瑟为法老解梦，中文若保留两个男性代词会显得含混；明确为“法老”属于篇章指代澄清，不加入宗派性解释。
- issue: 丰年预言的实现方式
  choice: 事情果然……实现了
  alternative: 事情就这样发生了
  rationale: 表达原文“按约瑟所说的临到/成就”，保留预言与事件应验之间的联系，而不额外说明神学机制。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“就在那一年”承接上文；避免古奥措辞。对原文省略的农业关系作最低限度明示，并用脚注交代字面表达。
