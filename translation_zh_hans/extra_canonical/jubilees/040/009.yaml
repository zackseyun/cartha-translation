  yaml_path: translation/extra_canonical/jubilees/040/009.yaml
  text: And the land of Egypt prospered before Pharaoh because of Joseph, for the Lord was with him and gave him favor and mercy over all his generation, in the sight of all who knew him and all who heard of him. And Pharaoh’s kingdom was well ordered, and there was no adversary and no evil.
translation:
  language: zh_hans
  text: 埃及地因约瑟而在法老面前兴盛，因为主与约瑟同在，赐给他恩宠和怜悯，使他比所有同代人更蒙恩；这在一切认识他和听闻过他的人面前都是显明的。法老的国安定有序，没有敌手，也没有祸患。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትሠናአወት
  choice: 兴盛
  rationale: 该动词在此描述埃及因约瑟而进入良好、繁荣的状态；“兴盛”比“平安”更能涵盖其积极发展的语义。
- source_word: ሞገሰ፡ ወምሕረተ
  choice: 恩宠和怜悯
  rationale: 分别保留 favor 与 mercy 的并列概念，不合并为单一的“恩惠”。
- source_word: ላዕለ፡ ኵሎሙ፡ ዘመዱ
  choice: 在同代所有人中居于众人之上
  rationale: ላዕለ 表示“在……之上”，而 ዘመድ 在此按 generation 理解为同代人；措辞尽量保留约瑟所得地位高于其同时代众人的含义。
- source_word: ወረጐዐት፡ መንግሥተ፡ ፈርዖን
  choice: 法老的国安定有序
  rationale: 该表达指国度稳定、治理妥善；“安定有序”自然地兼顾两层意思。
- source_word: ሰይጣነ
  choice: 敌手
  rationale: 在“没有……也没有……”的政治安定语境中按普通名词“对头、敌手”处理，不专名化为“撒但”。
- source_word: እኩየ
  choice: 祸患
  rationale: 保留非人格化的“恶事、灾祸”含义，避免擅自译成“恶人”。
theological_decisions:
- issue: “主与他同在”中代词的所指
  choice: 主与约瑟同在
  alternative: 主与他同在
  rationale: 源文代词在句法上回指约瑟；中文明确姓名可避免误读为法老，同时不改变神学内容。
- issue: 末句“敌手”的身份
  choice: 普通意义的敌手
  alternative: 撒但
  rationale: 源词虽可与“撒但”同源，但没有专名标志，且与“祸患”并列描述法老国的安定，故不将其神学化为特定超自然存在。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在法老面前”保留源文宫廷视角；通过重复“众人”略显强调，以呈现源文“在……之上”与“在……眼前”相邻但不同的介词结构。
