revisions:
- from: 埃及地因约瑟而在法老面前兴盛，因为主与约瑟同在，赐他恩宠和怜悯，使他在同代所有人中居于众人之上[a]，在一切认识他和听闻他的人眼前蒙恩。法老的国安定有序，没有敌手，也没有祸患。
  to: 埃及地因约瑟而在法老面前兴盛，因为主与约瑟同在，赐给他恩宠和怜悯，使他比所有同代人更蒙恩；这在一切认识他和听闻过他的人面前都是显明的。法老的国安定有序，没有敌手，也没有祸患。
  rationale: 修订主要消除中文长句中“居于众人之上”与“蒙恩”的语义和句法重叠，将 ላዕለ 的比较性表达为“比所有同代人更蒙恩”，并将“在……面前”自然处理为恩宠显明于认识或听闻约瑟者。其余关键用语及原文的非人格化末句均予保留。
