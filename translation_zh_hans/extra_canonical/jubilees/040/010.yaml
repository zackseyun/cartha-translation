  yaml_path: translation/extra_canonical/jubilees/040/010.yaml
  text: And the king called Joseph’s name Pontifans,^a and he gave Joseph as wife the daughter of Potiphar, the daughter of Sawes^b of Heliopolis, chief of the guards.
translation:
  language: zh_hans
  text: 王给约瑟起名叫“蓬提凡斯”[a]，又把波提法的女儿，就是希利奥波利斯的护卫长萨韦斯[b]的女儿，给约瑟为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有译法作“普松托姆法尼斯”，这是依照《创世记》41:45七十士译本的名称形式；此处正文依吉兹文本音译。
    reason: 说明名称异文及旧译依据，同时维护现存吉兹读法。
  - marker: b
    text: “萨韦斯”依吉兹文本音译；这一形式可能源自希腊语“祭司”一词的讹传，故也有译本作“祭司”。
    reason: 交代文本可能的传抄演变，并保留“专名”与“祭司”两种理解之间的张力。
lexical_decisions:
- source_word: ጸውዐ፡ ንጉሥ፡ ስሞ፡ ለዮሴፍ
  choice: 王给约瑟起名叫
  rationale: 按吉兹语句法直译其使役命名含义，同时采用自然的现代汉语表达。
- source_word: ጶንጢፋንስ
  choice: 蓬提凡斯
  rationale: 依吉兹文本 P̣onṭifans 音译，不以《创世记》七十士译本中的异形名称替换本书独特读法。
- source_word: ወለተ፡ ጶጢፋራን
  choice: 波提法的女儿
  rationale: 将人名 ጶጢፋራን 音译为中文读者较易辨识的“波提法”，保留其属格关系。
- source_word: ሳውፅ
  choice: 萨韦斯
  rationale: 按现存吉兹文本将其作为专名音译；不在正文中校改为“祭司”。
- source_word: ዘኢሊዮጶሊስ
  choice: 希利奥波利斯
  rationale: 采用该古城名称的通行音译。
- source_word: ሊቀ፡ ዐቀብት
  choice: 护卫长
  rationale: 该短语字面表示守卫者之首；“护卫长”在语境中简明自然，且不额外指定其官职细节。
theological_decisions:
- issue: 萨韦斯究竟是人名还是“祭司”的讹传
  choice: 正文保留吉兹文本的人名“萨韦斯”，脚注说明可能源自“祭司”一词
  alternative: 直接译作“祭司”
  rationale: 现存吉兹证据明确呈现一个被当作专名处理的形式；直接校改会掩盖本书文本传统与《创世记》平行记载之间的张力。
- issue: 蓬提凡斯的名称形式
  choice: 依吉兹文本音译“蓬提凡斯”
  alternative: 按七十士译本协调为“普松托μφανης”一类形式
  rationale: 优先翻译所给原语言版本，不以平行传统替代其独特读法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文重复的亲属关系，以“就是”连接，使长句易懂；人名按吉兹文本音译，必要的文本问题置于脚注，不在正文中静默校改。
