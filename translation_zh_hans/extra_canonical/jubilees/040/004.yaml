  yaml_path: translation/extra_canonical/jubilees/040/004.yaml
  text: And he said before Pharaoh that both his dreams were one, and he said to him, “Seven years of abundance will come in all the land of Egypt, and after this seven years of famine, such famine as has not been in all the earth.”
translation:
  language: zh_hans
  text: 他在法老面前说，法老的两个梦是一回事；他又对法老说：“埃及全地将有七个丰年，随后[a]将有七个荒年；这样的饥荒在全地从未有过。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在这以后”。
    reason: 说明原文使用单数指示语，避免误解为明确指向“那些年”。
lexical_decisions:
- source_word: ክልኤሆሙ፡ ሕለመሁ፡ አሐዱ፡ እሙንቱ
  choice: 法老的两个梦其实是一个
  rationale: 保留“两个梦”与“一个”之间的解释性对照；以“其实”使现代汉语自然，但不增添新的释义。
- source_word: ጽጋብ
  choice: 丰年
  rationale: 该词指丰足、富裕；在七年与随后饥荒的语境中，“丰年”比抽象的“丰足”更自然，并与“荒年”相称。
- source_word: ወእምድኅረዝ
  choice: 随后
  rationale: 字面为“在这以后”；“随后”在正文中简洁自然，脚注保留较形式对应的译法。
- source_word: ረኃብ
  choice: 荒年；饥荒
  rationale: 首次与“七年”连用时译作“荒年”，末句强调灾情本身时译作“饥荒”，符合现代汉语搭配，同时保留同一词的语义联系。
- source_word: ውስተ፡ ኵሉ፡ ምድር
  choice: 在全地
  rationale: 依原文保留“全地”的广泛表达，不擅自限缩为埃及；前一句的“埃及全地”则明确对应原文限定。
theological_decisions:
- issue: 末句“全地”的范围
  choice: 保留“全地”
  alternative: 译为“埃及全地”或“天下”
  rationale: 原文末句只有“全地”，不像前句明确说“埃及全地”；因此不将其范围静默限定，也避免“天下”可能带来的习语化夸张。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“法老”在同句中重复一次以避免汉语代词指向含混；引语保持简洁有力。
