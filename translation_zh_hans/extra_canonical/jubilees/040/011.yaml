  text: And in the year Joseph stood before Pharaoh, he was thirty years old when he stood before Pharaoh.
translation:
  language: zh_hans
  text: 约瑟站在法老面前的那一年[a]，他三十岁；那时，他站在法老面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹文刊本此处作“ወበዐሰተ”，很可能是“ወበዐመተ”（“在……年”）的讹误；本译文依后者译出。
    reason: 交代源文本身疑有讹字，并说明正文采用的校读，避免把不确定的字形静默处理。
lexical_decisions:
- source_word: ቆመ፡ ኀበ፡ ፈርዖን
  choice: 侍立在法老面前
  rationale: “站在……面前”在宫廷语境中表示到君王面前供职或候命；译作“侍立”既保留站立的形象，也自然传达宫廷语义。原文两次出现此语，译文照样保留重复。
- source_word: ወልደ፡ ሠላሳ፡ ክረምተ
  choice: 他三十岁
  rationale: 该表达直义近于“有三十个年岁的儿子／三十岁的人”，是闪语式年龄表述；现代汉语自然译为“他三十岁”。
- source_word: ፈርዖን
  choice: 法老
  rationale: 采用现代汉语读者熟悉的埃及君王称号。
