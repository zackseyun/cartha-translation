lexical_decisions:
- source_word: ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  choice: 司狱长
  rationale: 该词组直指监管囚犯之人的首领；“司狱长”简洁、自然，也保留其职务身份。
- source_word: ይትአከኮሙ
  choice: 服侍他们
  rationale: 此动词表达照料、伺候或服侍；结合约瑟受命照管被囚官员的语境，译为“服侍他们”最为贴切。
- source_word: ይትለአክ፡ ቅድሜሆሙ
  choice: 在他们面前供职
  rationale: 字面含在他们面前受差遣、执行服务之意；“供职”保留职责性，避免与前一动词完全重复。
