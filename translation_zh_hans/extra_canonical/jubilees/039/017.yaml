base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/017.yaml
  text: 'And as he interpreted for them, so it happened to them: Pharaoh restored the chief cupbearer to his service, but the baker he killed, just as Joseph had interpreted for them. But the chief cupbearer forgot Joseph in the prison-house, although he had told him what would happen[a], and he did not remember to make it known to Pharaoh what Joseph had told him, for he forgot.[b]'
translation:
  language: zh_hans
  text: 约瑟怎样为他们解说，事情就怎样临到他们：法老让司酒长复职，却处死了司膳长，正如约瑟为他们所解说的。可是，司酒长把监牢里的约瑟忘了，尽管约瑟已经告诉他将要发生的事[a]；他也没有想起把约瑟对他说的话禀告法老，因为他忘了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽管他知道将要发生什么。”但原文动词更可能是使役形式，意为约瑟“使他知道”，即“告诉他”。
    reason: previous_rendering
  - marker: b
    text: 传世埃塞俄比亚文的最后一句行文生硬。大意似乎是：司酒长虽然知道约瑟所作解释已经应验，却忘了约瑟，没有把约瑟的话禀告法老。
    reason: textual_variant
lexical_decisions:
- source_word: ፈከረ
  choice: 解说
  rationale: 此动词在上下文中指约瑟对梦及其结果的解释；“解说”既自然，也不额外限定为一般预言。
- source_word: ሊቀ፡ መዘርት
  choice: 司酒长
  rationale: 该称谓指法老宫廷中主管酒政的官员；采用现代中文圣经读者熟悉且简洁的职衔。
- source_word: ሐባዚስ
  choice: 司膳长
  rationale: 按叙事语境指主管烘焙或膳食的官员；“司膳长”比直译“烤饼长”更符合庄重自然的现代中文。
- source_word: አይድዖ
  choice: 已经告诉他
  rationale: 按其使役语义表达“使他知道、告知他”，主语为约瑟，避免误译成司酒长自己“知道”。
- source_word: ቤተ፡ ሞቅሕ
  choice: 监牢
  rationale: 字面为拘禁之所；中文用“监牢”准确而自然。
theological_decisions:
- issue: 约瑟解梦与事件应验之间的关系
  choice: 正如约瑟为他们所解说的
  alternative: 正如约瑟向他们所预言的
  rationale: 原文强调解释与后来事件的一致，并未要求把约瑟的行为专门界定为预言；“解说”保留叙事本身的表达。
- issue: 末句中主语与代词所指
  choice: 明示“约瑟”告诉司酒长，并将禀告对象译为“法老”
  alternative: 全用“他”保留原文句法含混
  rationale: 根据使役动词和上下文厘清必要的汉语指代，但保留脚注说明传世埃塞俄比亚文本末句的生硬之处，不借此加入额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“复职”“处死”“禀告”等词准确表达宫廷语境；末句保留原文重复“忘了”的强调，并以脚注交代文本表达上的困难。
