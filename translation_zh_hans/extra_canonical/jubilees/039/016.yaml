translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将两个宫廷头衔置于句首作主语，以符合自然汉语语序；不设置脚注，因为格兹文本在此可直接理解为二人把梦讲给约瑟，英文咨询层脚注所述的复数代词问题并不见于所提供的格兹原文形式。
