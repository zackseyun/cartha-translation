  text: And both of them dreamed a dream[a], the chief cupbearer and the chief baker, and they told Joseph.
translation:
  language: zh_hans
  text: 首席酒政和首席烘饼师二人都做了梦，并把梦告诉了约瑟。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለሙ፡ ክልኤሆሙ፡ ሕልመ
  choice: 两人都做了梦
  rationale: 原文直译为“他们两人梦了一个梦”；汉语用“做了梦”自然表达同一意义，并保留“两人都”的强调。
- source_word: ሊቀ፡ መዛርት
  choice: 司酒长
  rationale: 表示负责酒饮或斟酒者的首领；“司酒长”简洁庄重，也符合古代宫廷职务语境。
- source_word: ሊቀ፡ ሐበዝት
  choice: 司膳长
  rationale: 字面涉及饼食制作人员的首领。结合宫廷职务语境译作“司膳长”，比现代职业色彩较强的“烘焙师长”更自然庄重。
- source_word: ወነገርዎ፡ ለዮሴፍ
  choice: 并把梦告诉了约瑟
  rationale: 动词形式和约瑟的间接受词表明他们向约瑟讲述；汉语补出语境中明确的宾语“梦”，避免“告诉约瑟”内容悬空。
