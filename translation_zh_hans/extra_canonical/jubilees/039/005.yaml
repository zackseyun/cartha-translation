  yaml_path: translation/extra_canonical/jubilees/039/005.yaml
  text: to lie with her. But he guarded his soul and remembered the LORD and the words that Jacob his father used to recite from the words of Abraham[a], that no man should commit fornication with a woman who has a husband, for the judgment of death has been ordained for him in heaven before the Most High God, and the sin is recorded against him in the eternal books continually.
translation:
  language: zh_hans
  text: 要与她同寝。但约瑟谨守自己[a]，想起了主，也想起父亲雅各常常诵读的、源自亚伯拉罕的话[b]：任何人都不可与有夫之妇行淫，因为天上已在至高上帝面前为这样的人定下死刑，他的罪也一直记在永恒的册卷中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谨守自己”直译可作“保守（或约束）自己的魂”；此处指约瑟自我约束，不随从诱惑。
    reason: lexical
  - marker: b
    text: 原文说明，雅各常诵读的话源自亚伯拉罕；这是《禧年书》所强调的族长教训传承。
    reason: cross_reference
lexical_decisions:
- source_word: ይስከብ፡ ምስሌሃ
  choice: 与她同寝
  rationale: 直译其性关系含义，同时保持庄重并承接上文。
- source_word: አመጠወ፡ ነፍሶ
  choice: 守住自己的心
  rationale: 原文直指“保守/约束自己的魂（生命、自我）”；现代汉语用“守住自己的心”自然表达内在自守，脚注保留较直译的可能。
- source_word: ያነብብ
  choice: 常……诵读
  rationale: 该词表示读出、诵读；结合叙事语境，以“常”体现反复或习惯性的动作。
- source_word: ይዜሙ
  choice: 行淫
  rationale: 准确传达不正当性关系，且符合庄重的经卷语体。
- source_word: ብእሲት፡ እንተ፡ ባቲ፡ ምት
  choice: 有夫之妇
  rationale: 原文意为“有丈夫的女人”，现代汉语凝练表达为“有夫之妇”。
- source_word: ኵነኔ፡ ሞት
  choice: 死刑
  rationale: 字面为“死亡的判决/刑罚”，此处指所定的死亡判决。
- source_word: መጻሕፍት፡ ዘለዓለም
  choice: 永恒的册卷
  rationale: 保留复数“书卷/册卷”及其天上永久记录的意象。
- source_word: በኵሉ
  choice: 一直
  rationale: 按本句语境表示持续、始终；不增补原文末尾没有的“在主面前”。
theological_decisions:
- issue: 雅各与亚伯拉罕教训之间的传承关系
  choice: 父亲雅各常从亚伯拉罕的话中诵读的教训
  alternative: 父亲雅各常诵读的亚伯拉罕的话
  rationale: 前者较贴近原文嵌套结构，明确雅各所诵读之言源自亚伯拉罕，同时避免断言具体成文载体。
- issue: “没有人……行淫”结构的语气
  choice: 任何人都不可……行淫
  alternative: 没有人与……行淫
  rationale: 原文形式近于存在否定，但在父祖训诫语境中承担禁令功能；译出规范性语气，避免误成经验事实。
- issue: 天上判决与上帝的关系
  choice: 天上已在至高上帝面前……定下
  alternative: 至高上帝已在天上……定下
  rationale: 保留原文被动表达，不把未明说的施事者直接确定为上帝，同时保存“在至高上帝面前”的审判场景。
- issue: 罪的记录对象
  choice: 他的罪也一直记在……中
  alternative: 这罪也一直记在……中
  rationale: 原文代词可关联犯罪者；译作“他的罪”与前句“这样的人”衔接自然，也不改变罪行被永久记录的含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“主”对应 እግዚአብሔር，“至高上帝”对应 እግዚአብሔር፡ ልዑል。句首保留其承接上一节的不完整结构。所有脚注标记均已置于正文。
