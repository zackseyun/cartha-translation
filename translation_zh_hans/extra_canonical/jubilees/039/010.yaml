  yaml_path: translation/extra_canonical/jubilees/039/010.yaml
  text: And the Egyptian saw Joseph’s garment and the broken door-bar, and he heard the account of his wife, and he put Joseph into the prison-house, into the place where the king’s prisoners were confined. And he was there.
translation:
  language: zh_hans
  text: 那埃及人看见约瑟的衣服和折断的门闩，又听了妻子的陈述，就把约瑟关进监牢，就是王的囚犯所被拘禁的地方。约瑟就留在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጐብጻዊ
  choice: 那埃及人
  rationale: 原文以族称指约瑟的主人；照原文保留“埃及人”，不擅自补出姓名或官职。
- source_word: ልብሶ፡ ለዮሴፍ
  choice: 约瑟的衣服
  rationale: 按属格关系直译，清楚自然。
- source_word: ማዕጾ፡ ስቡረ
  choice: 折断的门闩
  rationale: ማዕጽ 可指门闩、门栓，ስቡር 表示被折断；结合场景译作“折断的门闩”。
- source_word: ነገረ፡ ብእሲቱ
  choice: 妻子的陈述
  rationale: ነገር 在此是所说的话、叙述；“陈述”既保留中性语气，也不预先判定其真假。
- source_word: ቤተ፡ ሞቅሕ
  choice: 监牢
  rationale: 字面为拘禁之所；现代汉语以“监牢”简洁表达。
- source_word: ሙቁሓን፡ እለ፡ ሞቅሑ፡ ንጉሥ
  choice: 王的囚犯被拘禁的地方
  rationale: 保留原文“王的囚犯”与被拘禁的被动意义，不具体化为王宫监狱或政治犯。
- source_word: ወሀሎ
  choice: 约瑟就留在那里
  rationale: 原文仅说“他在那里”；汉语补明主语并用“留在”自然传达持续状态，不添加“在狱中”等原文未明说的成分。
