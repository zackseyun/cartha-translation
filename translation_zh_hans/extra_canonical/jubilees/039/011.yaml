  yaml_path: translation/extra_canonical/jubilees/039/011.yaml
  text: There in the prison, the LORD gave Joseph favor and mercy before the chief of the keepers of the prison-house[a], because he saw that the LORD was with him, and everything
translation:
  language: zh_hans
  text: 在那里，在监牢中，耶和华使约瑟在监牢看守长[a]面前蒙恩、得怜悯，因为看守长看出耶和华与约瑟同在，并且一切……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的称号沿用前文表示“看守、守卫”的词根；但在监牢的语境中，指的是主管监牢的官员，而不是波提乏家中的职务。
    reason: lexical_alternative
lexical_decisions:
- source_word: ህየ፡ ውስተ፡ ሞቅሕ፡
  choice: 在那里，在监牢中
  rationale: 保留地点副词和监禁场所两层信息；虽略有复沓，却忠实传达原文开头。
- source_word: ሞገሰ፡ … ወምሕረተ፡
  choice: 恩惠和怜悯
  rationale: 分别对应 favor/grace 与 mercy/compassion，保留两个并列概念，不将其合并。
- source_word: ሊቀ፡ ዐቀብተ፡ ቤተ፡ ሞቅሕ፡
  choice: 监牢看守长
  rationale: 该称号字面涉及监牢看守者之首；用现代汉语明确其为监狱官员。
- source_word: በቅድሜሁ፡
  choice: 在……面前
  rationale: 保留原文表示在某人眼前、得到其认可的关系表达。
- source_word: ወኵሎ፡
  choice: 并且一切……
  rationale: 所给原文止于“并且一切”，句法明显未完；不擅自补出后续内容，以省略号标明残缺。
theological_decisions:
- issue: 神名 እግዚአብሔር 的译法
  choice: 耶和华
  alternative: 主
  rationale: 此处按《人民开放圣经》的中文经文体例采用“耶和华”；不借此加入额外的神学解释。
- issue: 看守长看见的内容
  choice: 他看出耶和华与约瑟同在
  alternative: 因为耶和华看见自己与约瑟同在
  rationale: 按叙事语境，代词最自然地回指监牢看守长；同时不扩充他如何得知这一点。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“蒙恩惠和怜悯”保留经文语感；末尾严格保留源文本身未完的状态。
