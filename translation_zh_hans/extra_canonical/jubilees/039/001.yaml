  yaml_path: translation/extra_canonical/jubilees/039/001.yaml
  text: And Jacob dwelt in the land of his father’s sojourning, in the land of Canaan. These are the generations of Jacob. And Joseph, being seventeen years old, was brought down into Egypt, and Potiphar, an officer of Pharaoh, chief of the guards, bought him.
translation:
  language: zh_hans
  text: 雅各住在他父亲寄居的迦南地。这是关于雅各后代的记述。约瑟十七岁时，被带到埃及；法老的官员[a]、护卫长波提乏买下了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官员”所译的原词也可译作“太监”。
    reason: 原词兼有宫廷职衔与“太监”的传统含义，正文采用语境上较稳妥的广义译法，同时保留词义歧义。
lexical_decisions:
- source_word: ፍልሰተ
  choice: 寄居
  rationale: 该词指离乡侨居、寄居；译作“寄居”既贴近原文，也自然承接“他父亲……的迦南地”。
- source_word: ትዝምደ
  choice: 后代的记述
  rationale: 此词属于家系、世系或后代的语义范围；本句引出雅各家族尤其约瑟的故事，译作“关于雅各后代的记述”比单纯“家谱”更符合叙事语境，同时不把范围缩窄为名单。
- source_word: አውረድዎ
  choice: 被带到
  rationale: 原文有“使下去、带下去”之意；现代汉语以被动式“被带到埃及”自然表达约瑟非自愿被送往埃及。
- source_word: ተሣየጦ
  choice: 买下了他
  rationale: 该形式在本句交易语境中表示波提乏购得约瑟；“买下”清楚传达所有权转移。
- source_word: ኅፅዉ
  choice: 官员
  rationale: 该称号可指宫廷官员，也可按字面或传统用法理解为“太监”；依上下文采用较宽泛的职衔“官员”，并以脚注保留另一译法。
- source_word: ጰጢፋሬን
  choice: 波提乏
  rationale: 采用现代中文读者熟悉的圣经人名译法。
theological_decisions:
- issue: “雅各的世代/后代”作为标题性公式的范围
  choice: 这是关于雅各后代的记述
  alternative: 这是雅各的家谱／这是雅各的世代
  rationale: 保留家系含义，又使其能够自然引出约瑟的叙事，不将公式误解为仅有姓名列表。
- issue: 波提乏职衔的含义
  choice: 官员
  alternative: 太监
  rationale: 原词可能兼具宫廷官员与阉人之义；正文不武断认定其生理身份，脚注说明另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；首句保留原文的寄居意象，第二句作为家族叙事的标题性公式处理，末句用清楚的现代句法呈现约瑟被带往埃及并被波提乏买下的经过。
