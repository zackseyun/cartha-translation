  yaml_path: translation/extra_canonical/jubilees/039/013.yaml
  text: And he remained there two years. And in those days Pharaoh king of Egypt was angry with his two eunuchs, with the chief cupbearer and with the chief baker, and he put them into prison.
translation:
  language: zh_hans
  text: 他在那里停留了两年。在那些日子里，埃及王法老向他的两名宦官——司酒长和首席烘焙师——发怒，把他们关进监牢。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给吉兹文引句止于“把他们放进……”，地点名称在引文中缺失；“监牢”依本节叙事上下文补出。
    reason: 公开说明源文本片段末尾不完整，避免把按上下文补足的地点误呈为该引文中无争议的明文。
lexical_decisions:
- source_word: ነበረ፡ ህየ፡ ካልአ፡ ዓመተ
  choice: 他在那里住了两年
  rationale: 按字面保留“在那里”与“两年”；“住了”符合现代汉语叙事，也可表达持续停留。
- source_word: ተምዐዐ
  choice: 发怒
  rationale: 直接表达法老对二人的愤怒，语气庄重自然。
- source_word: ሕፁዋኒሁ
  choice: 臣仆
  rationale: 该词可指宫廷侍从，也可能特指宦官；正文采用较宽泛的“臣仆”，避免在身份不确定时过度限定。
- source_word: ሊቀ፡ መዛርት
  choice: 司酒长
  rationale: 指主管王室酒饮的首领；采用中国读者熟悉且简洁的圣经职衔。
- source_word: ሊቀ፡ ሐበዝት
  choice: 司膳长
  rationale: 原词直指烘焙或制饼人员的首领；“司膳长”在现代汉语中自然，并能体现宫廷膳食职务。
- source_word: ወወደዮሙ፡ ውስተ፡
  choice: 于是把他们关进监牢
  rationale: 现存引文止于表示“放入……里面”的结构，宾语地点依上下文补足为监牢；脚注明确说明文本状况。
