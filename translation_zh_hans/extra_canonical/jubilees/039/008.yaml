  text: And that woman saw that he would not lie with her, and she accused him before his master, saying, “Your Hebrew servant, whom you love, wanted to force me[a] so as to lie with me; and it happened that when
translation:
  language: zh_hans
  text: 那女人见他不肯与她同寝，便在他主人面前控告他，说：“你所爱的希伯来仆人想要强迫我[a]，好与我同寝。后来，当……时，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“强迫我”的词，也可较宽泛地理解为“侵犯我”或“戏弄我”；但后面的“与我同寝”表明，这项指控是企图施行性强迫。
    reason: 保留该动词的词义范围，同时说明上下文为何支持正文译法。
lexical_decisions:
- source_word: አይስክብ፡ ምስሌሃ
  choice: 不肯与她同寝
  rationale: 按否定动词“躺卧”和介词短语“与她”翻译；结合叙事情境，“同寝”自然表达其性含义，而不增添原文没有明说的细节。
- source_word: ጠየቀተ፡ ቅድመ፡ እግዚአ
  choice: 在他主人面前控告他
  rationale: 该处描述女人向约瑟的主人提出指控；“控告”符合上下文的诬告场景，“在……面前”保留原文空间兼司法性的表达。
- source_word: ገብርከ፡ ዕብራዊ፡ ዘታፈቅር
  choice: 你所宠爱的那个希伯来仆人
  rationale: 保留“你的仆人”“希伯来人”和“你所爱”三项信息；在指责语境中用“宠爱”较自然地传达女人话中的怨责意味。
- source_word: ፈቀደ … ይትዐገላኒ
  choice: 想要强迫我
  rationale: ፈቀደ 表达意愿或企图，故译“想要”；争议动词在本句“与我同寝”的限定下最自然地指性方面的强迫。
- source_word: ወኮነ፡ ሶበ፡
  choice: 事情是这样的：当……的时候，
  rationale: 原文在“当……时”处中断并延续至下一节；中文也保留未完句式，不擅自补足后文。
