  text: I raised my voice, and he ran and left his garment in my hand when I seized him, and he broke the door.”
translation:
  language: zh_hans
  text: 我便放声喊叫，他就逃跑了；我抓住他的时候，他把衣服丢在我手里，并撞破了门[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门”或可理解为“门闩”。
    reason: ማዕጾ的常用义是“门”，但其关门、闭合相关语义可能容许“门闩”的理解；正文采用较直接的“门”。
lexical_decisions:
- source_word: አልዐልኩ፡ ቃለየ
  choice: 我便放声喊叫
  rationale: 直译为“我提高了我的声音”；现代汉语用“放声喊叫”自然表达高声呼喊，且符合叙事情境。
- source_word: ጐየ
  choice: 逃跑了
  rationale: 该动词表示奔跑；在此语境中是从抓捕中逃开，译作“逃跑”比单纯“跑”更明确自然。
- source_word: ኀደገ፡ ልብሶ፡ ውስተ፡ እዴየ
  choice: 他把衣服丢在我手里
  rationale: 保留“他的衣服留在我的手中”的具体意象；“丢在”自然表达他逃跑时弃衣而去，并不暗示从容放置。
- source_word: በጊዜ፡ አንተ፡ አኀዝክዎ
  choice: 我抓住他的时候
  rationale: 按语境处理异常或强调性的代词成分，表达“当我抓住他时”，不额外补入未明示的信息。
- source_word: ወሰበረ፡ ማዕጾ
  choice: 并撞破了门
  rationale: ሰበረ意为打破、折断；ማዕጾ通常指门。结合逃跑动作，“撞破了门”在现代汉语中自然，同时保留暴力破门之意。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号划分呼喊与逃跑动作，使连续叙事清晰；保留第一人称指控的急促感及原文动作链。
