  yaml_path: translation/extra_canonical/jubilees/039/012.yaml
  text: Whatever he did, the LORD made to prosper. And he left everything in his hand, and the chief keeper of the prison knew nothing that was with him, because Joseph did everything and the LORD brought it to completion.
translation:
  language: zh_hans
  text: 他无论做什么，主都使之顺利。狱长把一切都交在他手中；凡在他手中的事，狱长一概不知，因为约瑟办理一切，主也使一切成就。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሴርሖ
  choice: 使之顺利
  rationale: 该动词在此表达使所做之事兴旺、成功；译为“使之顺利”既保留使役意义，也符合现代汉语。
- source_word: ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  choice: 狱长
  rationale: 字面近于“囚牢看守之首”；“狱长”简洁自然，准确表达其主管身份。
- source_word: ኀደገ፡ ኵሎ፡ በእዴሁ
  choice: 把一切都交在他手中
  rationale: 保留“在他手中”的权柄与托付意象，同时使用自然的现代汉语句式。
- source_word: ይፈጽም
  choice: 使之成就
  rationale: 该词有完成、实现之意；“使之成就”保留主语为主以及使役色彩，并与前句“约瑟办理”形成区别。
theological_decisions:
- issue: 约瑟的作为与主的成就之间的关系
  choice: “一切都由约瑟办理，主也使之成就”
  alternative: “约瑟做一切，主完成一切”
  rationale: 保留原文同时陈述人的行动与上帝使事情完成的张力，不将二者合并，也不额外解释因果或神学机制。
- issue: 神名的译法
  choice: 主
  alternative: 耶和华
  rationale: 原文使用常见的“主”之称，译作“主”最直接，也避免从其他文本传统补入专名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡交给他的事”承接“把一切都交在他手中”，使“狱长一概不过问”的对象在中文里清楚，但不增加实质信息。
