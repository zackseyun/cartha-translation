  text: 监牢，在护卫长的家中，就是约瑟被囚禁在那里的那座监牢。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞቅሕ
  choice: 监牢
  rationale: 该词在本句中重复出现，指关押人的处所；译作“监牢”既准确又符合现代汉语叙事语体，并保留原文的重复。
- source_word: ቤቱ፡ ለሊቀ፡ ዐቀብተ
  choice: 护卫长的府中
  rationale: 短语直指“护卫者之首的房舍/府第”；结合约瑟叙事的官职语境，译作“护卫长的府中”自然且不额外限定其具体职能。
- source_word: እኁዝ
  choice: 被囚禁
  rationale: 该词表达被拘押、被扣留的状态；用被动式“被囚禁”保留原文约瑟作为受事者的语法关系。
- source_word: ኀበ፡ ሀሎ፡ ዮሴፍ፡ እኁዝ፡ ህየ
  choice: 就是约瑟被囚禁的那座监牢
  rationale: 原文意为“约瑟在那里被拘押之处”；汉语用“就是……的那座监牢”明确回指前述地点，同时省去语义重复的“在那里”。
