  text: in the house of the Egyptian because of Joseph. And everything that he did, the LORD made to prosper. And the Egyptian left everything in Joseph’s hand, because he saw that the LORD was with him, and everything that he did the LORD made to prosper.
translation:
  language: zh_hans
  text: 在那埃及人的家中——因着约瑟的缘故。[a]凡约瑟所做的事，耶和华都使其亨通。那埃及人把一切都交在约瑟手中，因为他看见耶和华与约瑟同在；凡约瑟所做的事，耶和华都使其亨通。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文节首为承接上一节的片语，直译为“在那埃及人的家中，因着约瑟的缘故”。
    reason: 保留原文节首与上文相连的句法状态，避免在正文中补入本节未明载的谓语。
lexical_decisions:
- source_word: በእንተ፡ ዮሴፍ
  choice: 因为约瑟
  rationale: 按因果意义直译，保留约瑟是那埃及人家中蒙福之缘由的表达。
- source_word: ይሴርሖ
  choice: 使之顺利
  rationale: 该动词在上下文中表示使所做之事成功、兴旺；“使之顺利”自然且不夸大为财富增长。
- source_word: ኀደገ፡ ... በእዴሁ፡ ለዮሴፍ
  choice: 把一切都交在约瑟手中
  rationale: 保留“在手中”的权柄与托付意象，同时符合现代汉语表达。
- source_word: እግዚአብሔር፡ ምስሌሁ
  choice: 耶和华与约瑟同在
  rationale: 明确代词所指以免汉语含混，并采用经文语境中常见而庄重的神名译法。
theological_decisions:
- issue: 开头残句与上一节的衔接
  choice: 补出“福气临到”并以脚注说明原文形式
  alternative: 直译为“在那埃及人的家中，因为约瑟”
  rationale: 现存节首是承接上文的介词短语，单独直译在现代汉语中不成句；依据上下文补足蒙福之意，但用脚注保留原文的句法开放性。
- issue: 重复的兴旺句
  choice: 两次均保留
  alternative: 视为抄写重复而删去一次
  rationale: 所给吉兹语文本明确重复该思想，且重复强化耶和华同在与约瑟凡事顺利之间的联系，不应擅自删减。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“那埃及人”呼应原文称谓；保留“交在约瑟手中”的圣经意象及末句的刻意重复。
