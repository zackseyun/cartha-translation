  text: For Pharaoh, the chief of the guards. And he appointed Joseph over all his house, and the blessing of the LORD came to be.
translation:
  language: zh_hans
  text: 法老的侍卫长。[a]他任命约瑟管理他家中的一切，主的赐福就临到了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头在原文中是“法老的侍卫长”，语法上像是承接上一节的片语。
    reason: 提醒读者源文开头并非完整独立句，避免译文造成虚假的完整性。
  - marker: b
    text: 原文到“主的赐福就临到了”为止，没有说明赐福临到谁或何处。
    reason: 说明译文为何不依据《创世记》的平行叙事补入“那埃及人的家”等内容。
lexical_decisions:
- source_word: ሊቀ፡ ዐቀብት
  choice: 侍卫长
  rationale: 该词组直指护卫或看守人员的首领；“侍卫长”符合约瑟叙事的语境，也自然简洁。
- source_word: ሤሞ፡ ለዮሴፍ፡ ዲበ፡ ኵሉ፡ ቤቱ
  choice: 他派约瑟管理自己的全家
  rationale: ሤሞ 表示任命或安置，ዲበ ኵሉ ቤቱ 表示置于全家之上；“派……管理”以自然汉语表达其管辖职责。
- source_word: በረከተ፡ እግዚአብሔር
  choice: 主的赐福
  rationale: በረከት 是福分、赐福；እግዚአብሔር 是吉兹语中对上帝的常用尊称。译作“主”既贴近词义，也避免在原文未出现希伯来四字神名时过度具体化。
- source_word: ወኮነት
  choice: 便临到了
  rationale: 该阴性动词与“赐福”呼应，基本义为“成为、发生、来到”。汉语用“临到了”表达赐福开始发生，同时保留后接对象在现存引文中未明说的特点。
theological_decisions:
- issue: 神名的表达
  choice: 主
  alternative: 耶和华
  rationale: 原文使用吉兹语通行的神圣称号እግዚአብሔር，并非直接音译四字神名；“主”较少加入源文没有明示的辨识。
- issue: 赐福所临到的对象
  choice: 不补出对象
  alternative: 补作“临到那埃及人的家”或“因约瑟临到他家”
  rationale: 所提供的本节吉兹语止于“主的赐福便临到了”，没有明载对象或原因；不从平行经文补入，可忠实保存现存文本的开放性。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。“自己的全家”指侍卫长整个家业和家务范围；以脚注保留本节首尾在所给源文中都略显悬接的文本形态。
