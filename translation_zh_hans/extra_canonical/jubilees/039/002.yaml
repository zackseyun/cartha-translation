- from: 法老的侍卫长。[a]他派约瑟管理自己的全家，主的赐福便临到了。[b]
  to: 法老的侍卫长。[a]他任命约瑟管理他家中的一切，主的赐福就临到了。[b]
  rationale: 将“他派约瑟管理自己的全家”修订为“他任命约瑟管理他家中的一切”，更直接呈现任命及“在全家／全家业之上”的管辖关系，并消除“全家”仅指家人的现代汉语歧义。其余悬接和未明说的内容均予保留。
