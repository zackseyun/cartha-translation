    issue: “自己的全家”在现代汉语中易被理解为约瑟或侍卫长的家庭成员。
    rationale: 原文“all his house”在此为受任管理的整个家业、家务与所属事务，不限于家庭成员；且“自己的”在前有残片“法老的侍卫长”时，指代不够清晰。
