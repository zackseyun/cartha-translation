  text: And she seized him in the house to force him to lie with her[a], and she shut the doors of the house and seized him, but he left his garment in her hand and broke the door-bar and ran outside from before her face. And she saw
translation:
  language: zh_hans
  text: 她在屋里抓住他，要强迫他与她同寝[a]；她关上屋门，又抓住他。他却把衣服留在她手里，折断门闩，从她面前跑到外面。她看见……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的叙述十分紧凑：她关门、抓住他，他留下衣服、折断门闩并逃走。各动作的确切先后次序，可能受到埃塞俄比亚文本分句方式的影响。
    reason: segmentation_note
lexical_decisions:
- source_word: ወአንዘተ
  choice: 她……抓住他／又抓住他
  rationale: 该动词在原文中出现两次，均予保留；宾语“他”由上下文补出。
- source_word: ከመ፡ ትትበአስ፡ ይስክብ፡ ምስሌሃ
  choice: 要强迫他与她同寝
  rationale: 按语境表达其强迫目的；“同寝”既自然庄重，也保留性关系的委婉表达。
- source_word: ወዐጸወት፡ ኆኅተ፡ ቤት
  choice: 她关上屋门
  rationale: 直译为关闭房屋的门；中文以单数集合表达较自然，不强行确定门扇数量。
- source_word: ወኀደገ፡ ልብሶ፡ ውስተ፡ እዴሃ
  choice: 他却把衣服留在她手里
  rationale: 准确保留衣服落在女子手中的叙事细节，并以“却”呈现逃脱的转折。
- source_word: ወሰበረ፡ ማዕጾ
  choice: 折断门闩
  rationale: 依原文动词“折断”和名词所指的门闩或门栓来译，不弱化为单纯开门。
- source_word: ወጐየ፡ አፍአ፡ እምቅድመ፡ ገጻ
  choice: 从她面前跑到外面
  rationale: 保留“外面”与“从她面前”两个空间成分，同时调整为自然汉语语序。
- source_word: ወርእየት
  choice: 她看见了……
  rationale: 原文以“她看见”收尾，语义显然延续至下一节；以省略号保留未完句势，避免擅自补足宾语。
