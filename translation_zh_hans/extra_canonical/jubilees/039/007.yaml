translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同寝”避免粗俗，也不淡化原文的性胁迫。“她看见了……”保留本节末尾未完的衔接。英文咨询层另列的脚注 b 没有清楚对应现行主文中的独立异文锚点，且“在屋里”已译入正文，因此未收入，以免产生无所指的脚注。
