translation:
  language: zh_hans
  text: 在上帝面前的日子。[a]约瑟想起这件事，就不肯与她同寝。她接连一年又一年地央求他，他却不肯听从。她又追问……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在上帝面前的日子”看来是上一节末尾遗留在本节开头的片段。
    reason: 说明源文本的分节或截取错位，同时保留实际提供的吉兹语内容。
  - marker: b
    text: 原文在“她又追问”处截断，句意未完；主语也可理解为“他”。
    reason: 保留末尾动词的主语歧义和文本残缺，不沿用缺乏原文依据的“她拥抱他”等补译。
lexical_decisions:
- source_word: ተዘከረ፡ ዮሴፍ፡ ዘንተ፡ ነገረ
  choice: 约瑟想起这件事
  rationale: 按词序和语义直译，保留“这件事”的回指，不擅自补明具体内容。
- source_word: አፈቀደ፡ ይስክብ፡ ምስሌሃ
  choice: 不肯与她同寝
  rationale: 依据本句叙事语境及审校层的理解译出拒绝之意；“同寝”自然、庄重，也准确传达与她发生性关系的委婉表达。
- source_word: አስተብቍዐቶ፡ ዓመተ፡ አሐደ፡ ወካልአ
  choice: 她接连一年又一年地央求他
  rationale: 原文直陈“一年和第二年”；汉语以“接连一年又一年”表达持续两个年头的反复恳求。
- source_word: አበየ፡ ሰሚዐ
  choice: 他却不肯听从
  rationale: “不肯听”在此不只是拒绝听见，而是拒绝依从她的要求，故译“听从”。
- source_word: አጠየቀ
  choice: 追问
  rationale: 该词可表达询问、查问；由于所给文本在此截断，采用“追问”并以省略号标明句意未完，不补造宾语或结果。
theological_decisions:
- issue: 开头“在上帝面前的日子”与本节主体之间的关系
  choice: 保留原文片段并加注说明
  alternative: 视为上一节末尾而从本节正文删除
  rationale: 所给吉兹语确实包含该短语，但它在句法上明显像前文残片。为忠实于指定源文本，又不误导读者把它强接到约瑟的行动上，正文保留并加脚注。
- issue: 约瑟是否拒绝与她同寝
  choice: 译作“不肯与她同寝”
  alternative: 按孤立词形译作“愿意／想要与她同寝”
  rationale: 叙事上下文、后句持续央求以及审校文本一致支持拒绝之意；若作肯定愿望，会与紧接的情节冲突。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“同寝”避免粗俗，也不弱化性意味；“央求”“听从”体现持续诱惑与约瑟拒绝的情境。开头和结尾均按所给源文本保留，但用脚注清楚标出分节错位与残句问题。
