    text: “在上帝面前的日子”似乎是上一节末尾遗留在本节开头的片段；此处按所提供的吉兹语文本保留。
    reason: 说明源文本可能存在分节或截取错位，同时不擅自删去实际提供的文字。
  - marker: b
    text: 原文在此动词后截断，句意未完。动词可指“问、询问”等；其主语也可理解为“她”。
    reason: 保留末尾动词的语义范围、主语歧义和文本残缺，不补造宾语、结果或“她拥抱他”等无据内容。
  revision_rationale: 修订仅处理可安全确定之处：把原文明确的“一年和第二年”译为“一年又一年”，并在末句避免把未明主语和宽泛的“问”强定为“她追问”。正文仍依英文审校轨迹译出约瑟拒绝同寝；同时保留开头疑属前节的残片和结尾未完成句，不以推测补全。
