  text: And Joseph was handsome in appearance and very good to look at, and his master's wife lifted up her eyes and saw Joseph and loved him, and asked him
translation:
  language: zh_hans
  text: 他所做的一切，主都使其顺利。约瑟容貌俊美，十分悦目。他主人的妻子举目看见约瑟，便爱上了他[a]，又恳求他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“爱他”；这里的语境表明这是一种爱慕，但原词本身没有进一步说明其性质。
    reason: 保留原词语义范围及叙事语境之间的张力。
lexical_decisions:
- source_word: ይሴርሖ
  choice: 使其顺利
  rationale: 该动词在此语境中表示使约瑟所做的事成功、顺遂；用“使其顺利”既保留使役含义，也符合现代汉语表达。
- source_word: ሠናይ፡ ራእዮ
  choice: 容貌俊美
  rationale: 直译为“他的外貌美好”；“容貌俊美”自然、庄重，并与约瑟叙事的传统用语相合。
- source_word: ወላህይ፡ ራእዮ፡ ጥቀ
  choice: 十分悦目
  rationale: ጥቀ明确表示“非常、十分”，不可省略；“悦目”传达外观令人喜爱，而不与前面的“俊美”机械重复。
- source_word: አፍቀረቶ
  choice: 爱上了他
  rationale: 该词表示“爱他”；在上下文中含有因外貌而产生的爱慕，但原词本身不必被窄化为明确的性欲。
- source_word: አስተብቍዐቶ
  choice: 恳求他
  rationale: 该词有请求、央求之意；本节没有明说所求内容，因此不在正文中补出宾语。
theological_decisions:
- issue: 主使约瑟所做的事顺利的范围
  choice: 他所做的一切，主都使其顺利
  alternative: 凡他所做的，主都使之兴旺
  rationale: 保留神是约瑟成功之源的陈述，同时避免用“兴旺”引入偏重物质繁荣的现代联想。
- issue: 主人之妻对约瑟的情感性质
  choice: 爱上了他
  alternative: 对他起了情欲
  rationale: 原文用“爱”而非明确表示情欲的词；结合语境译为“爱上”较自然，但不将含义过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“举目看见”保留原文动作次序及经文语感；末句不补写她具体恳求的内容，以尊重本节原文的未完待续性质。
