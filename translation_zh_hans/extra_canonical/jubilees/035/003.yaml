  yaml_path: translation/extra_canonical/jubilees/035/003.yaml
  text: And you, my son, know from the day you were born until this day, all my deeds and all that is in my heart, that I love your father exceedingly.
translation:
  language: zh_hans
  text: 我儿，从你出生那天直到今日，你知道我的一切作为和我心里的一切，也知道我极其爱你的父亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: 我儿
  rationale: 直译为“我的儿子”；“我儿”在现代中文中简洁、庄重，也符合母亲对儿子的直接称呼。
- source_word: ምግባርየ
  choice: 我一切的所作所为
  rationale: ምግባር 可指行为、作为或品行；此处与“心里所存的一切”并列，强调外在可见的行为，译为“所作所为”自然准确。
- source_word: ዘውስተ ልብየ
  choice: 我心里所存的一切
  rationale: 依原文保留内心内容的宽泛表达，不把它缩窄为某一种情感、意图或思想。
- source_word: ጥቀ
  choice: 多么爱
  rationale: 该副词表示程度很深；在“我多么爱……”的结构中自然传达“非常、极其”的强度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的家庭对话语体。保留外在行为与内心世界的并列，并将末尾的 ከመ 从句自然处理为“以及我多么爱……”，不额外解释人物动机。
