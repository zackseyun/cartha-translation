  text: And in the sixth year of this week Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.
translation:
  language: zh_hans
  text: 在这个七年周期的第六年[a]，以撒召来他的两个儿子以扫和雅各；他们来到他那里。他对他们说：“我的儿子们，我将要走上我祖先所走的路，前往我祖先所在的永恒之家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那一周的第六年”。《禧年书》的纪年体系中，“一周”指一个七年周期。
    reason: 说明原文纪年术语，并保留“这／那一周”的可选译法。
lexical_decisions:
- source_word: በሳድስ፡ ዓመት፡ ዘዝሱባዔ
  choice: 在这七年的第六年
  rationale: 按《禧年书》的纪年语境，将“周”理解为一个七年周期；保留指示语所表达的“这”。
- source_word: ፍኖተ፡ አበውየ
  choice: 我祖先所走的路
  rationale: 原文直指“我祖先的道路”；中文补出“所走”以自然表达死亡如同踏上先祖之路的意象。
- source_word: ቤት፡ ዘለዓለም
  choice: 永恒之家
  rationale: 直译原文“永恒的家/房屋”，保留其对死亡归宿的含蓄比喻，不具体化为某一神学地点。
- source_word: አበውየ
  choice: 我祖先
  rationale: 该复数词可指父辈或列祖；此处以撒谈及已经离世、所在于永恒之家的先人，译作“祖先”较自然且不缩窄范围。
theological_decisions:
- issue: “永恒之家”所指的死后归宿
  choice: 保留“永恒之家”的比喻
  alternative: 译为“永远的居所”或具体解释为阴间/坟墓
  rationale: 原文没有明确界定其宇宙论或末世论含义；保留意象可避免将某一宗派性的死后观念带入文本。
translation_notes:
  register: 采用庄重而自然的现代汉语。“我的儿子们”保留父亲对两子的直接称呼；用分号连接召唤与到来的动作，使叙事流畅。
