  text: And you, do not fear for Jacob, for Jacob’s guardian is great and mighty and honored, and more praised than Esau’s guardian.” And Rebekah sent and called Esau, and he came to her. And she said to him, “My son, I ask one request from you; say that you will do it, my son.”
translation:
  language: zh_hans
  text: “你也不要为雅各害怕，因为雅各的守护者伟大、强大、尊贵，比以扫的守护者更受赞美。”利百加便差人召来以扫；以扫来到她那里。她对他说：“我儿，我求你一件事；你要答应照办，我儿。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቃቢሁ
  choice: 守护者
  rationale: 该词意为看守、保护者；保留所指身份并未明说的含混性，不擅自增译为“天使”或其他特定称谓。
- source_word: ዐቢይ፡ ወኃያል፡ ወክቡር
  choice: 伟大、强有力、尊荣
  rationale: 分别对应“大、强有力、受尊崇”，既贴近原文并列结构，也使用自然庄重的现代汉语。
- source_word: ወአኩት፡ እምዐቃቢሁ፡ ለዔሳው
  choice: 所受的赞美超过以扫的守护者
  rationale: 将比较结构理解为继续描述雅各的守护者；避免旧译误拆为利百加“赞美以撒”，也不把“受赞美”改释为“更有能力”。
- source_word: ወለአኮት፡ ርብቃ፡ ወጸውዐተ፡ ለዔሳው
  choice: 利百加便派人召以扫
  rationale: 动词组合表达“差遣并召来”，汉语以“派人召”简洁呈现两层动作。
- source_word: ስእለት፡ ብየ
  choice: 我有一件事求你
  rationale: 原文为向对方提出一个请求；用现代汉语惯用表达，保留恳求语气。
theological_decisions:
- issue: 雅各与以扫之“守护者”的身份
  choice: 仅译作“守护者”
  alternative: 译作“守护天使”或“保护神”
  rationale: 原文在本句没有明确界定其本体身份；直译可保留古代宗教语境中的开放性，避免加入特定天使论或神学解释。
- issue: 比较级短语的句法归属
  choice: 理解为雅各的守护者“所受的赞美超过”以扫的守护者
  alternative: 理解为“更有能力”，或拆成利百加赞美以撒
  rationale: 原文相应词汇表达“受赞美”，且该短语在句法上延续对雅各守护者的描述；其他处理不是本处词义，或会产生原文没有的人物动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“守护者”的指称含混；“我儿”重复出现，以反映原文的亲密称呼和劝求语气。
