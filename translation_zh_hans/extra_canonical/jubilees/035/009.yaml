  source_fidelity: 译文总体忠实保留了请求、使以扫起誓、不得图谋害雅各、不得带着敌意追逼，以及对以扫品性的严厉评价。末尾未完成的源文也得到明确保留。惟“要以扫起誓”在现代汉语中可被误读为“以扫将要起誓”，未清楚表达这是利百加请求以撒施行的使役行动。
  naturalness: 整体庄重自然。“请你叫以扫起誓”比“要以扫起誓”更明确、流畅，且准确呈现对以撒的请求。
  terminology: 人名“以撒”“以扫”“雅各”符合通行圣经译名；“图谋加害”“怀着敌意追逼”“毫无良善”均恰当。
