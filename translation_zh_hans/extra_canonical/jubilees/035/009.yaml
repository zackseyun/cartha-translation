  yaml_path: translation/extra_canonical/jubilees/035/009.yaml
  text: 'And she went in to Isaac and said to him, “I ask one request of you: make Esau swear that he will not devise evil against Jacob and will not pursue him in hostility, for you know Esau’s mind, that he has been cruel from his youth, and there is no goodness in him, for he desires'
translation:
  language: zh_hans
  text: 她进去见以撒，对他说：“我求你一件事：请你叫以扫起誓，不图谋加害雅各，也不怀着敌意追逼他。因为你知道以扫的心思；他从小就很残酷，心里毫无良善，因为他想要——”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语文本在“因为他想要”处中断，句意未完。
    reason: 向读者说明结尾并非汉语误译或排版遗漏，而是本次所据源文片段未完。
lexical_decisions:
- source_word: አሐተ፡ ስእለተ፡ አስተበቍዕ፡ በኀቤከ
  choice: 我求你一件事
  rationale: 按短语语义直译并调整为自然现代汉语，保留请求的单一性与恳切语气。
- source_word: እምሕሱ፡ ለዔሳው
  choice: 要以扫起誓
  rationale: 该表达指使以扫以誓言作出保证；“要……起誓”简明且符合上下文。
- source_word: ኢያሕስም፡ ላዕለ፡ ያዕቆብ
  choice: 不图谋加害雅各
  rationale: 动词在此不宜弱化为单纯“恨”；译文保留谋划恶事、意图伤害的含义。
- source_word: ኢይስድዶ፡ በጸልኢ
  choice: 也不怀着敌意追逼他
  rationale: 同时表达“追逐/迫害”与敌对方式或态度，避免仅译为一般性的追赶。
- source_word: ሕሊናሁ፡ ለዔሳው
  choice: 以扫的心思
  rationale: “心思”可涵盖内在意念、倾向和谋算，又不把含义过度限定为理性思想。
- source_word: ጸዋን፡ ውእቱ፡ እምንእሱ
  choice: 他从小就很残酷
  rationale: 依语境呈现其自幼具有的严酷、凶狠性情；“残酷”比“严厉”更符合负面评价。
- source_word: ወአልቦ፡ ላዕሌሁ፡ ኂሩተ
  choice: 心里毫无良善
  rationale: 原文直义近于“在他里面没有良善”；汉语以“心里”自然表达内在品性，而非身体位置。
- source_word: እስመ፡ ይፈቅድ
  choice: 因为他想要——
  rationale: 所给吉兹语材料止于表示意愿或欲求的动词，缺少其宾语或后续内容，因此保留未完句。
theological_decisions:
- issue: 对以扫道德状况的绝对性陈述
  choice: 心里毫无良善
  alternative: 他身上没有善意
  rationale: 保留原文强烈而绝对的措辞，不以较缓和的心理状态解释，也不扩展为系统神学命题。
- issue: 残篇末尾的未完成句
  choice: 以破折号明确保留中断
  alternative: 依据后续经文补全宾语
  rationale: 当前提供的源文本确实止于“因为他想要”；不从未提供的后文擅自补足，以保存文本证据的状态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“进去见以撒”避免生硬照搬空间介词；“图谋加害”“怀着敌意追逼”准确体现两项不同的威胁。末尾以破折号和脚注保留源文的不完整状态。
