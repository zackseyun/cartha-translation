base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/021.yaml
  text: And I myself ask you that you admonish Jacob concerning me and concerning my children, for I know that he will surely reign over me and over my children, because on the day my father blessed him he made him high and me low.
translation:
  language: zh_hans
  text: 我也求你劝诫雅各关于我和我的儿女[a]，因为我知道，他必作王统治我和我的儿女；我父亲祝福他的那一天，立他为高，使我为低。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为我和我的儿女”。
    reason: 吉兹语介词短语既可表示“关于……”，也可表示“为……、为了……”。此处按上下文正文采用“关于”。
lexical_decisions:
- source_word: አስተብቍዐኪ
  choice: 求你
  rationale: 此处是以请求的口吻对利百加说话；译为“求你”自然地保留恳请语气。
- source_word: ትገሥጽዮ
  choice: 劝诫
  rationale: 该词指告诫、规劝或责备；在母亲受托约束雅各行为的语境中，“劝诫”既有力度，也不把语气过度强化为斥责。
- source_word: በእንቲአየ፡ ወበእንተ፡ ውሉድየ
  choice: 为我和我的儿女
  rationale: 介词短语可表示“为……缘故/代表……”或“关于……”。这里以“为”表达以扫请求利百加顾念他和儿女而劝诫雅各，同时用脚注保留“关于”的可能。
- source_word: ነጊሠ፡ ይነግሥ
  choice: 必作王统治
  rationale: 同根动词与强调式结构兼有“作王”和“统治”之意；译文保留王权措辞及其确定语气。
- source_word: ረሰየ፡ ልዑለ፡ ወኪያየ፡ ትሑተ
  choice: 立他为高，使我为低
  rationale: 尽量保留原文“高/低”的对称意象，而不解释成较具体的政治或家族地位。
theological_decisions:
- issue: 雅各“作王”的含义
  choice: 按王权用语直译为“作王统治”
  alternative: 译作“居我和我儿女之上”
  rationale: 原文使用“作王/统治”的同根表达；直译可保留其强烈措辞以及可能具有的预示意味，不将其缩减为一般的家族优先地位。
- issue: “高/低”所指的地位
  choice: 保留“立他为高，使我为低”的开放表达
  alternative: 解释为“使他居上，使我居下”或“使他尊贵，使我卑微”
  rationale: 原文没有明确限定是政治权力、家族次序还是蒙福地位，因此不在正文中替读者消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我父亲祝福他的那一天”维持叙事清晰度；“立他为高，使我为低”刻意保留原文简洁的对偶结构。
