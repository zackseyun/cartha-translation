  yaml_path: translation/extra_canonical/jubilees/035/020.yaml
  text: And Jacob my brother—I love him more than all flesh, and I have no brother in all the earth except him alone. And this is no great thing for me, that I should love him, for he is my brother, and together we were sown in your womb, and together we came out from your belly. And if I do not love my brother, whom shall I love?
translation:
  language: zh_hans
  text: 雅各，我的弟弟——我爱他胜过一切有血肉的人；在全地之上，除了他以外，我再没有别的弟弟。我爱他，这对我并不是什么了不起的事，因为他是我的弟弟；我们一同在你腹中成胎，又一同从你腹中出生。我若不爱我的弟弟，又能爱谁呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምኵሉ፡ ዘሥጋ
  choice: 胜过一切有血肉的人
  rationale: 直译为“胜过一切肉身”，这里指所有有血肉的人；保留原文具象表达，同时补出“人”以合现代汉语。
- source_word: እኅወ
  choice: 弟弟
  rationale: 说话者是以扫，雅各是其孪生弟弟；汉语用“弟弟”比泛称“兄弟”更清楚，并未改变亲属关系。
- source_word: ተዘራእነ
  choice: 成胎
  rationale: 源词本义带有“被撒种、受孕”的生殖隐喻；译作“成胎”使现代读者自然理解其指共同受孕成形，又避免生硬的“被播种”。
- source_word: እምኅንብርትኪ
  choice: 从你腹中
  rationale: 按语境指从母腹出生；采用自然庄重的汉语，不把身体部位过度具体化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事口吻；保留“一切有血肉的人”这一古典具象表达，并让以扫关于孪生血缘与兄弟之爱的论证自然连贯。
