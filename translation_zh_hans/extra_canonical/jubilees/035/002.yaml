  yaml_path: translation/extra_canonical/jubilees/035/002.yaml
  text: And Jacob said to her, "I will do all that you have commanded me, for this matter will be an honor and greatness to me, and righteousness before God, that I should honor them."
translation:
  language: zh_hans
  text: 雅各对她说：“凡你吩咐我的，我都必照办；因为这件事对我将是尊荣和伟大，也是在上帝面前的义，好让我尊敬他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘአዘዝክኒ
  choice: 你吩咐我的
  rationale: 保留第二人称阴性单数施事和第一人称单数受事的关系；“吩咐”自然表达该动词的命令义。
- source_word: ክብረ
  choice: 尊荣
  rationale: 表达由此事带给雅各的荣誉，并与后面的相关名词保持并列。
- source_word: ዕበየ
  choice: 尊贵
  rationale: 原词有伟大、崇高之意；在此与“尊荣”并列，用“尊贵”较符合汉语语境，也避免译成抽象而生硬的“伟大”。
- source_word: ጽድቀ
  choice: 义
  rationale: 保留该词的道德及神学含义，不将其窄化为“正当”或“功德”。
- source_word: ከመ ፡ አክብሮሙ
  choice: 就是我要尊敬他们
  rationale: 保留ከመ在此说明前述内容的关系，并准确反映第三人称复数受词“他们”，不从上下文擅自补明所指。
theological_decisions:
- issue: “义”与尊敬“他们”的关系
  choice: 译作“在上帝面前的义……就是我要尊敬他们”
  alternative: 译作“我尊敬他们，在上帝面前就算为义”
  rationale: 前者较贴近原文结构，同时保留“尊敬他们”是对整件事的说明，还是尤其说明“义”的轻微句法张力，不明确引入功德或称义机制。
- issue: 尊荣、尊贵和义的归属
  choice: “都必因这事归于我”
  alternative: “这事对我将成为尊荣、伟大和义”
  rationale: 采用自然汉语表达谓语关系，但不解释这些是人的称许、身份地位还是上帝所认可的结果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“上帝”对应神名；“义”保留经文的神学张力。“他们”的指代在本节中未明说，因此不以括注或增词消除其上下文依赖。严格限定为《禧年书》35:2，不纳入第1节末尾内容。
