- from: 雅各对她说：“凡你吩咐我的，我都必照办，因为尊荣、尊贵和在上帝面前的义，都必因这事归于我，就是我要尊敬他们。”
  to: 雅各对她说：“凡你吩咐我的，我都必照办；因为这件事对我将是尊荣和伟大，也是在上帝面前的义，好让我尊敬他们。”
  rationale: 修订直接反映“这事将是／成为”尊荣、伟大及在上帝面前的义这一原文谓语结构；以“尊荣和伟大”区分两个并列名词；末句以目的性连接表达 ከመ，同时保留其与前文的轻微句法张力，不补明“他们”的指代，也不引入特定神学解释。
