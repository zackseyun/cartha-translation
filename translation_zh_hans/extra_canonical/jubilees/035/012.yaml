  to: 他因你祝福了你那完全、正直的儿子雅各，就向你怀恨；因为雅各毫无邪恶，只有良善。自从他从哈兰来到直到今日，他从未使我们缺少什么；每日，万事都按时来到我们这里。每当我们从他手中领受时，他就满心欢喜，也为我们祝福。自从他从哈兰来到直到今日，他从未离开我们；他常与我们同住在家中，敬重我们。”
