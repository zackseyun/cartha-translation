base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/012.yaml
  text: And he is bitter against you because you blessed Jacob, your perfect and upright son; for there is no evil at all in him, but only goodness. And from the time he came from Haran until this day he has not deprived us of anything, for everything comes to us in its time every day, and he rejoices with all his heart whenever we receive from his hand, and he blesses us. He has not separated himself from us from the time he came from Haran until this day, and he dwells with us continually in the house while honoring us.”
translation:
  language: zh_hans
  text: 他因你祝福了你那完全、正直的儿子雅各，就向你怀恨；因为雅各毫无邪恶，只有良善。自从他从哈兰来到直到今日，他从未使我们缺少什么；每日，万事都按时来到我们这里。每当我们从他手中领受时，他就满心欢喜，也为我们祝福。自从他从哈兰来到直到今日，他从未离开我们；他常与我们同住在家中，敬重我们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርር፡ ላዕሌከ
  choice: 向你怀恨
  rationale: 字面涉及“对你苦涩”，语境指因祝福雅各而对以撒心生怨恨；“怀恨”自然且保留敌意强度。
- source_word: ፍጹማዊ፡ ወፈትዐ
  choice: 完全、正直
  rationale: 分别表达完整无可指摘与正直、公义的品格，沿用庄重而易懂的圣经语体。
- source_word: አልቦ፡ እኩየ፡ ዘአንበበ፡ ኂሩትነ
  choice: 身上毫无恶处，尽是良善
  rationale: 按修订后的源文理解，不加入“我们的”；用“尽是良善”呈现恶与善的对举。
- source_word: ኢያሕፀፀ፡ ብነ፡ ወእምንትኒ
  choice: 从未使我们缺少什么
  rationale: 表达未曾削减或使之匮乏任何事物，现代汉语自然清楚。
- source_word: ኵሉ፡ ይመጽእ፡ ለነ፡ በበጊዜሁ፡ ኵሉ፡ ዕለት
  choice: 每天一切都按时供给我们
  rationale: 保留“一切”“各按其时”“每天”三项信息，并使句法符合现代汉语。
- source_word: ንነሥእ፡ እምእዴሁ
  choice: 我们从他手中领受
  rationale: 原义可直译为“从他手中拿取”；在馈赠和供养语境中，“领受”较自然，且不把对象具体化。
- source_word: ወኢተፈለጠ፡ እምኔነ
  choice: 从未离开我们
  rationale: 表达没有与家人分开或隔离；“离开”比“与我们分离”更符合汉语叙述。
- source_word: ዘልፈ፡ ውስተ፡ ቤት
  choice: 一直与我们同住在家中
  rationale: “ዘልፈ”表示持续、经常；结合“在家中居住”译出共同生活的含义。
- source_word: ያከብረነ
  choice: 敬重我们
  rationale: 准确表达尊敬、尊荣父母之意，不扩展为特定礼仪或物质供养。
theological_decisions:
- issue: “完全”是否暗示绝对无罪
  choice: 保留“完全、正直”这一品格称述
  alternative: 译作“无可指摘、正直”
  rationale: 源文以两个明确的德性词形容雅各；正文不另作系统神学限定，也不将其弱化。
- issue: “毫无恶处，尽是良善”的范围
  choice: 按人物品格的直接陈述翻译
  alternative: 解释为仅指他对父母的行为
  rationale: 源文措辞广泛，语境虽涉及雅各对父母的善待，却没有明说只限于此，因此保留原有张力。
- issue: “为我们祝福”的主体与对象
  choice: 雅各为说话者一方祝福
  alternative: 雅各称颂上帝
  rationale: 源文宾语为第一人称复数，故译作“为我们祝福”，不擅自改作对上帝的颂赞。
translation_notes:
  register: 采用现代、庄重、流畅的叙事汉语；保留重复的时间界限“从哈兰回来直到今日”，以反映原文的强调。引号表明本节延续人物直接引语。
