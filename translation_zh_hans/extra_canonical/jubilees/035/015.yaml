  naturalness: 除开头外，译文自然、庄重，适合现代标准汉语。以省略号保留跨节残缺，并以脚注交代，可避免把不完整的源文伪装成完整断言。
  terminology: “污秽”“过错”“起誓”“信守誓言”“行善／作恶”“交在……手中”均恰当。“迷误”可改为更常用且不预设“跟随”关系的“过错”。人名“雅各”正确。
  issues:
