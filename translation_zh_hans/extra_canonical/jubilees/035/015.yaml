  yaml_path: translation/extra_canonical/jubilees/035/015.yaml
  text: their uncleanness and after their error, he and his children. And you tell me to make him swear that he will not kill Jacob his brother. Even if he swears, he will not keep his oath, nor will he do anything but evil. And if he desires to kill Jacob his brother, he will be given into Jacob’s hand, and he will not escape from his hand, for he will fall into his hand.
translation:
  language: zh_hans
  text: ……他们的污秽；在他们的过错之后，他和他的儿女。你却叫我使他起誓，不杀他的兄弟雅各。即使他起了誓，也不会信守自己的誓言；他不会行善，只会作恶。倘若他想杀他的兄弟雅各，他必被交在雅各手中，无法从雅各手里逃脱，因为他必落在雅各手中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኵሶን
  choice: 他们的污秽
  rationale: 保留原文表示不洁、污秽的名词意义；结合汉语句法用“沾染”承接这一处跨节残句。
- source_word: ድኅረ፡ ስሕተቶን
  choice: 随从他们的迷误
  rationale: ድኅረ字面为“在……之后”，在此表达跟随错误道路；“迷误”兼顾错误与偏离之意。
- source_word: እምሕሱ
  choice: 让他起誓
  rationale: 使役形式，表示要求或使对方宣誓。
- source_word: ኢይሄሱ፡ በመሐላሁ
  choice: 不会信守誓言
  rationale: 按语境表达不遵守自己所起之誓，采用自然而庄重的现代汉语。
- source_word: ኢይገብር፡ ኂሩተ፡ ዘእንበለ፡ እኩይ
  choice: 他不会行善，只会作恶
  rationale: 保留原文“善—恶”的明确对照，不将其泛化为仅仅“做任何事”。
- source_word: ውስተ፡ እዴ፡ ያዕቆብ፡ ይትወሀብ
  choice: 他必被交在雅各手中
  rationale: 保留被动式及“交在……手中”这一支配、制伏的惯用意象。
theological_decisions:
- issue: 以扫若谋杀雅各所面临的结局
  choice: 按原文直陈他必被交在雅各手中并落在其手中
  alternative: 解释为上帝主动审判或雅各必亲手杀死以扫
  rationale: 原文没有明说施动者，也没有断言雅各将杀死他，因此保留被动表达及其神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。首句在所给材料中承接上一节，原文自身是跨节残句；译文以“也会沾染”作最低限度的汉语补足，使句子可读而不改变其指向。重复保留“雅各手中”，以再现原文的强调。
