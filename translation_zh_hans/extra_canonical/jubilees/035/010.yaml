  yaml_path: translation/extra_canonical/jubilees/035/010.yaml
  text: He will kill him after your death. And you know all that he has done from the day his brother Jacob went to Haran until this day, how with all his heart he has forsaken us and has done
translation:
  language: zh_hans
  text: 他会在你死后杀死他。你也知道，自从他的兄弟雅各去了哈兰，直到今日，他所做的一切；也知道他怎样全心背弃我们，并且做了……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምድኅረ፡ ሞትከ
  choice: 在你死后
  rationale: 按词义直译时间关系；第二人称单数属格由“你”表达。
- source_word: ይቅትሎ
  choice: 他会……杀死他
  rationale: 保留原文第三人称主语和宾语均未明说具体所指的特点，不以人物姓名消除歧义。
- source_word: ኵሎ፡ መጠነ፡ ገብረ
  choice: 他所做的一切
  rationale: 该短语字面涉及“全部/程度”与“所做”，在此自然表达为行为的总和；避免误释为雅各的行为。
- source_word: ያዕቆብ፡ እኁሁ
  choice: 他兄弟雅各
  rationale: 依修订所指出的句法关系，将雅各理解为所谈之人的兄弟，也是前往哈兰者。
- source_word: በኵሉ፡ ልቡ፡ ኀደገነ
  choice: 全心背弃了我们
  rationale: “全心”保留行为意向的完整程度；“背弃”比单纯“离开”更能传达在上下文中的关系性弃绝。
- source_word: ወገብረ
  choice: 并且做了……
  rationale: 本节原文在此未完，保留与下一节衔接的未完成结构，不擅自补足宾语或内容。
theological_decisions:
- issue: 两处第三人称代词的身份
  choice: 保留“他……他”的指代歧义
  alternative: 根据叙事上下文补出具体人物姓名
  rationale: 本节所给吉兹文并未在首句明说姓名；译文不应以解释取代原文的含混指代。
- issue: 雅各与行为主体的关系
  choice: 译为“从他兄弟雅各去哈兰的那一天……他所做的一切”
  alternative: 把雅各当作“所做”的主体
  rationale: 语序和最新校订均支持雅各是“他兄弟”且是去哈兰的人，而本节所控诉行为的主体是另一人。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“背弃”保持责难语气；末尾以省略号明确本节句意尚未完结。
