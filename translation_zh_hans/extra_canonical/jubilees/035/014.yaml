base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/014.yaml
  text: And now my heart is troubled because of all his deeds, and neither he nor his seed will be saved, for they are those who will be destroyed from the earth and those who will be uprooted from under heaven, because he has forsaken the God of Abraham and gone after his wives and after
translation:
  language: zh_hans
  text: 现在，我心里因他一切的所作所为而不安。他和他的后裔都不得救，因为他们必从地上被除灭，必从天底下被拔除；因为他离弃了亚伯拉罕的上帝，随从他的妻子们，又随从……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሀወክ
  choice: 忧乱
  rationale: 表达内心受搅扰、不安的状态，既贴近原词，也保持庄重自然。
- source_word: ምግባራቲሁ
  choice: 他一切的所作所为
  rationale: 概括其全部行为，保留原文复数和负面语境而不额外定性。
- source_word: ሊድኅን
  choice: 得救
  rationale: 保留“获救、蒙拯救”的开放含义，不擅自限定为属灵或现世意义。
- source_word: ይትሐጐሉ
  choice: 被除灭
  rationale: 按吉兹语动词次序译作毁灭、消灭，纠正旧译中与下一动词对调的问题。
- source_word: ይሤረዉ
  choice: 被拔除
  rationale: 体现从根基上除去的意象，并与“从天下”自然搭配。
- source_word: ኀደገ
  choice: 离弃
  rationale: 在此语境中指背弃、舍弃亚伯拉罕的上帝。
- source_word: ሖረ፡ ድኅረ
  choice: 随从
  rationale: 此结构直译为“走在……之后”，汉语以“随从”传达追随之义。
theological_decisions:
- issue: “得救”的范围
  choice: 保留“得救”而不说明是今世脱险、末世拯救或属灵救恩
  alternative: 译为“幸免”或“蒙拯救”
  rationale: 原文未明确限定救恩的时间和性质，应保留其神学张力。
- issue: “亚伯拉罕的上帝”的称谓
  choice: 亚伯拉罕的上帝
  alternative: 亚伯拉罕之神
  rationale: 采用现代简体中文常用而庄重的表达，不引入额外宗派色彩。
- issue: 残缺句的处理
  choice: 以省略号保留“又随从……”的未完状态
  alternative: 根据后续经文补足宾语
  rationale: 所给原文片段止于介词性结构，不应凭推测补写缺失内容。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。句法保留原文的因果推进；将两个平行的被动分句分别译为“从地上被除灭”和“从天下被拔除”。原始证据在句末残缺，因此正文明确保留未完句，不据英语咨询层或上下文擅自补全。
