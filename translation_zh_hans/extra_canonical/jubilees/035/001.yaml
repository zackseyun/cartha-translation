  yaml_path: translation/extra_canonical/jubilees/035/001.yaml
  text: And in the first year of the first week, in the forty-fifth jubilee, Rebekah called Jacob her son and instructed him concerning his father and concerning his brother, that he should honor them all the days of his life.
translation:
  language: zh_hans
  text: 在第四十五个禧年的第一个七年周期的第一年，利百加叫来她的儿子雅各，嘱咐他要敬重他的父亲和兄弟，终其一生都如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓመት፡ ዘሱባዔ፡ ቀዳማይ
  choice: 第一个七年的第一年
  rationale: 按禧年纪年体系表达“第一个七年周期的第一年”；采用“七年”使现代读者明白此处不是普通的一周。
- source_word: በዘአርብዓ፡ ወኀምስቱ፡ ኢዮቤልው
  choice: 在第四十五个禧年
  rationale: 保留原文的序数和专门纪年单位。
- source_word: ጸውዐቶ
  choice: 叫来
  rationale: 对应“召唤他”，在母子叙事语境中自然且准确。
- source_word: ወአዘዘቶ
  choice: 嘱咐他
  rationale: 兼顾“吩咐、命令”之义与母亲郑重训诫儿子的语境。
- source_word: ያክብሮሙ፡ ኵሎ
  choice: 要敬重父亲和兄弟
  rationale: 复数宾语回指前述父亲和兄弟；“敬重”保留尊敬、尊荣之义。
theological_decisions:
- issue: 末尾时间范围
  choice: 一生如此
  alternative: 在他所有的日子都敬重他们
  rationale: 原文所给文本止于“全部/所有”，结合英语审校层所反映的完整句意，以自然汉语表达终身持续的义务，不另加宗派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留《禧年书》的纪年方式，并将“week”按七年周期译作“七年”，避免被误解为七日的一周。
