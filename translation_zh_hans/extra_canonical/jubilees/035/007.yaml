  yaml_path: translation/extra_canonical/jubilees/035/007.yaml
  text: And behold, I have completed all the days of my life that I was to live.” And Jacob laughed because of the words of his mother, because his mother had told him that she would die, yet she remained opposite him, and her strength was upon her, and she had not grown weak in strength, for she went in and went out and saw,
translation:
  language: zh_hans
  text: “看哪，我一生应当活的日子都已经过完了。”雅各因母亲所说的话笑了，因为他母亲曾告诉他，她会死；可是她仍在他对面，力量仍在她身上，体力并未衰退，仍能进出，也能看见，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈጸምኩ፡ ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: 我一生……的日子都已经过完了
  rationale: 保留“完成全部生命日子”的语义，同时采用自然庄重的现代汉语表达。
- source_word: ወበሐቀ፡ ያዕቆብ
  choice: 雅各……笑了
  rationale: 该动词按所给吉兹语文本及英译审校层理解为“笑”；不添加嘲弄意味。
- source_word: ትነብር፡ አንጻሪሁ
  choice: 她仍在他面前
  rationale: 直承“仍然/住在、在……对面”的空间关系，以“在他面前”避免生硬的“与他相对而坐”，也不擅自限定姿势。
- source_word: ኀይላ፡ ላዕሌሃ
  choice: 身上还有力气
  rationale: 保留“力量在她身上”的意象，并使中文自然。
- source_word: ወኢደክመት፡ እምኀይላ
  choice: 体力并未衰退
  rationale: 表达她没有在力量上变弱，避免重复而不改变含义。
- source_word: ትበውእ፡ ወትወፅእ፡ ወትሬኢ
  choice: 仍能进进出出，也看得见
  rationale: 逐项保留“进入、出去、看见”；“看得见”在中文中自然体现身体机能尚存。
