  source_fidelity: 译文准确保留了临终嘱咐的核心内容：安葬地点在亚伯拉罕父亲近旁、以弗仑（赫人）的田地、该处由亚伯拉罕购得作坟地，以及说话者为自己掘墓。未随英文审校层增入所给本节吉兹文本未明载的“迦南地”，处理恰当。
  naturalness: “双洞中；那洞是……”在汉语中既略显生硬，也使“两个洞”与后面的单数“那洞”衔接不稳。改作“那座双重洞穴”可较贴近原文的“double cave”并使指代一致。
  terminology: 人名“亚伯拉罕”“以弗仑”和族称“赫人”均可。以“洞穴”代替“洞”更符合墓穴语境；“坟地”可保留作为 burial place 的现代汉语表达。
  issues:
  - severity: low
    issue: “双洞”与“那洞”的数和指代不一致
    rationale: “双洞”在现代汉语通常容易理解为两个洞，而后文“那洞”却指单一地点。原文及英文审校轨迹所表达的是“double cave”；采用“那座双重洞穴”能避免不必要的误解，并保留该描述的歧义和字面特征。
  revised_text: 把我葬在我父亲亚伯拉罕旁边，在赫人以弗仑田地中的那座双重洞穴里；亚伯拉罕把它购得作坟地。把我葬在我在那里为自己掘的坟墓里。
  revised_footnotes: []
  revision_rationale: 仅调整“double cave”的汉语表达及其后指代，使译文在不补入“迦南地”、不改变地点或购置用途的前提下更自然、明确。
