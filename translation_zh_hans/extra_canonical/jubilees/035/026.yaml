  register: 采用庄重而通顺的现代标准汉语。“我父亲亚伯拉罕”保留亲属称谓的原文顺序；后半句重复“把我葬在”，以保存遗嘱式命令的强调。所给吉兹语在本节相应语句中未见“在迦南地”字样，因此正文不从英文咨询层补入。
