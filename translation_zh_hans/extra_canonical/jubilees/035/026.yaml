base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/026.yaml
  text: Bury me near Abraham my father in the double cave in the field of Ephron the Hittite, which Abraham acquired as a burial place there in the land of Canaan. In the tomb which I dug for myself there, bury me.
translation:
  language: zh_hans
  text: 把我葬在我父亲亚伯拉罕旁边，在赫人以弗仑田地中的那座双重洞穴里；亚伯拉罕把它购得作坟地。把我葬在我在那里为自己掘的坟墓里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባዐት፡ ዘካዕበት
  choice: 双洞
  rationale: 按字面表达“洞穴—双重的”，既保留原文所指的双洞，也避免直接改用源文未出现的传统专名。
- source_word: ገራህተ፡ ኤፍሮን፡ ኬጥያዊ
  choice: 赫人以弗仑田里
  rationale: 保留族称、人名和田地的所属关系，符合现代汉语圣经文体。
- source_word: አጥረየ
  choice: 购得
  rationale: 该动词在此语境指取得为产业；“购得”自然地传达亚伯拉罕取得坟地的交易背景。
- source_word: ለዝኅረ፡ መቃብር
  choice: 作坟地
  rationale: 表达用途关系，简洁对应为埋葬而取得的处所。
- source_word: መቃብር፡ ዘከረይኩ፡ ለርእስየ
  choice: 我为自己掘的坟墓
  rationale: 保留第一人称、为自己预备以及挖掘坟墓的具体动作。
