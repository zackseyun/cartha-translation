  text: 'which you commanded me: that I should honor my father and my brother. Tell me, then, what crookedness you have seen in me;'
translation:
  language: zh_hans
  text: 就是你吩咐我的：要我敬重我的父亲和我的兄弟a。那么，请告诉我，你在我身上看见了什么不正之处？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አክብር
  choice: 敬重
  rationale: 该词表达尊敬、尊荣；“敬重”在现代汉语中自然庄重，也适合对父亲和兄弟并用。
- source_word: አበየ፡ ወእኅየየ
  choice: 我的父亲和我的兄弟
  rationale: 按吉兹文直译；እኅየየ 指“我的兄弟”，不可依熟悉的经文措辞改成“我的母亲”。
- source_word: ጥውየተ
  choice: 不正之处
  rationale: 原词含弯曲、偏邪之意；此处指品行上的过错或不正，译法保留其道德意味而不夸大。
theological_decisions:
- issue: 受敬重者是兄弟还是母亲
  choice: 兄弟
  alternative: 母亲
  rationale: 现存吉兹文本明确作 ወእኅየየ（“和我的兄弟”）；应避免受“父亲和母亲”这一熟悉表达影响而改写文本。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就是你吩咐我的”承接上文，因此保留片段式开头；后半句用直接问话呈现责问语气。
