- source_word: በል
  choice: 请答应我
  rationale: 字面义为“说”，在此是要求以扫表态承诺会照办；译作“请答应我”传达其语用含义。
- source_word: ትገብራ
  choice: 你会照着做
  rationale: 动词表示实行、完成所请求的事；“照着做”清楚承接前面的请求。
- source_word: ወልድየ
  choice: 我儿
  rationale: 保留原文首尾两次亲昵称呼，体现恳求的语气和母子关系。
