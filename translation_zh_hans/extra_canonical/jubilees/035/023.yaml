base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/023.yaml
  text: And she called Jacob before Esau’s eyes and instructed him according to the words that she had spoken with Esau. And he said, “I will do your pleasure. Trust me that no evil may come out from me or from my children against Esau, and I will not be first in anything except in love.”
translation:
  language: zh_hans
  text: 她当着以扫的面叫来雅各，照着自己对以扫所说的话嘱咐他。雅各说：“我会照你的心愿去做。请相信我，我和我的儿女绝不会对以扫行恶；除在爱上以外，我绝不在任何事上先行。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለዔሳው
  choice: 当着以扫的面
  rationale: 原文直义为“在以扫眼前”，现代汉语用“当着……的面”自然且准确地表达以扫亲眼在场。
- source_word: ሥምረተኪ
  choice: 你的心愿
  rationale: 该词在此指利百加所愿、所喜悦之事；“心愿”比生硬的“喜悦”更符合汉语对话语境。
- source_word: ተሐበይኒ
  choice: 请相信我
  rationale: 依原文动词所表达的相信、信任之义翻译，不采用缺乏词源支持的“隐藏我”。
- source_word: ኢይወፅእ፡ እምኔየ፡ ወእምውሉድየ፡ እኩይ፡ ላዕለ፡ ዔሳው
  choice: 我和我的儿女绝不会对以扫行恶
  rationale: 原文形象地说恶事不会“从我和我的儿女出来，临到以扫”；正文以自然汉语传达其承诺不加害以扫的意思。
- source_word: ወኢይቀድም፡ ምንተኒ፡ ዘእንበለ፡ ተፋቅሮ
  choice: 除在爱上以外，我绝不在任何事上先行
  rationale: 保留第一人称主体及“先行”的原文张力：雅各承诺不会率先采取任何行动，唯一例外是在爱上主动。
