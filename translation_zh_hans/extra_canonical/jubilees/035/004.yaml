lexical_decisions:
- source_word: ዘውስተ፡ ልብየ
  choice: 这是我心里的意念
  rationale: 按字面是“那在我心里的”，在上下文中自然表达为内心的意念，同时保留其承接前文的性质。
- source_word: ኵሎ፡ መዋዕለ
  choice: 我一生
  rationale: 字面为“所有日子／我所有的日子”；译作“我一生”符合现代汉语习惯，也涵盖持续终身之意。
- source_word: እሐሊ፡ ሠናየ፡ ለኵሉ
  choice: 为众人谋求好处
  rationale: እሐሊ 表示思想、考虑或筹谋，ሠናየ 表示美善或好处，ለኵሉ 表示“为所有人”；此译兼顾思想与善意行动的取向。
- source_word: ወአፎ፡ ኢይገብር፡ ዘንተ፡ ነገረ
  choice: 我为什么不做这事呢？
  rationale: 反问句表达说话者认为自己理当如此行；“为什么”比生硬的“怎么”更符合现代汉语，同时不补入原文未提供的宾语内容。
theological_decisions:
- issue: 是否补入“尊敬我的父亲和兄弟”
  choice: 正文不补入
  alternative: 补作“我为什么不做这事，尊敬我的父亲和兄弟呢？”
  rationale: 所提供的吉兹语原文止于“这事”，并不含“尊敬我的父亲和兄弟”所对应的词句；为忠于当前源文本，正文不作补充，但在脚注记录旧译。
