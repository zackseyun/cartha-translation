  yaml_path: translation/extra_canonical/jubilees/035/013.yaml
  text: And Isaac said to her, “I also know and see Jacob’s conduct toward us, that with all his heart he honors us. I loved Esau before Jacob from the time he was born first, but now I love Jacob more than Esau, because he has made his deeds very evil, and there is no righteousness in him, for all his ways are injustice and violence, and there is no righteousness around him.”
translation:
  language: zh_hans
  text: 以撒对她说：“我也知道，也看得出雅各怎样待我们：他全心尊敬我们。以扫比雅各先出生；从他出生起，我爱他胜过雅各。但如今我爱雅各胜过以扫，因为以扫使自己的行为变得极其邪恶；他毫无正义。他所行的一切道路都是不义和强暴；他的周围毫无正义[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的周围毫无正义”也可理解为“他根本毫无正义”。
    reason: 末词አውዶ字面为“周围”，在此也可能具有“全然、丝毫没有”的强调性用法。
lexical_decisions:
- source_word: ግብረ፡ ያዕቆብ፡ ዘምስሌነ
  choice: 雅各怎样待我们
  rationale: “行为/作为”带有关系性限定“对我们”，译为“怎样待我们”更符合现代汉语，同时保留原意。
- source_word: በኵሉ፡ ልቡ፡ ውእቱ፡ ያከብረነ
  choice: 他全心尊敬我们
  rationale: 贴近“以他的全心，他尊敬我们”，用自然简洁的现代汉语表达。
- source_word: አፍቀርክዎ፡ ለዔሳው፡ ቀደሙ፡ እምነ፡ ያዕቆብ
  choice: 我……爱他胜过雅各
  rationale: 将“先于/在雅各之前爱以扫”按上下文处理为偏爱程度，同时下一句形成明确对照。
- source_word: አብዝኀ፡ አእክዮ፡ ምግባሪሁ
  choice: 使自己的行为变得极其邪恶
  rationale: 保留主动使役意味，并将አብዝኀ理解为程度增强，而非未经明示的比较级。
- source_word: ዐመፃ፡ ወግፍዕ
  choice: 强暴与不义
  rationale: 分别表达暴虐压迫与违背正义之意，符合庄重的经文语体。
- source_word: አውዶ
  choice: 周围
  rationale: 保留末尾明确出现的“周围”空间性措辞，不为追求与前句一致而删去。
theological_decisions:
- issue: 以撒对两个儿子的爱是否指时间先后或偏爱程度
  choice: 译作“爱他胜过雅各……爱雅各胜过以扫”
  alternative: “在雅各以前爱以扫……如今爱雅各过于以扫”
  rationale: 上下两句构成偏爱对象的逆转；同时用“从他出生起”保留时间线索，避免把“先出生”误作爱的唯一原因。
- issue: 末句“正义”所在的关系
  choice: 保留“他周围也毫无正义”
  alternative: “他根本毫无正义”或重复“他里面毫无正义”
  rationale: 原文末尾有አውዶ“周围”，应保存其意象；脚注提示可能的习语性理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“正义”“强暴”等伦理词汇的重复和力度，不将原文的神学判断弱化，也不把末句的空间性表达擅自同化为前句。
