revisions:
- from: 以撒对她说：“我也知道，并且看得出雅各怎样待我们：他全心尊敬我们。因为以扫先出生，我从他出生起就爱他胜过雅各；但如今我爱雅各胜过以扫，因为以扫使自己的行为变得极其邪恶[a]，他里面毫无正义。他所走的一切道路尽是强暴与不义，他周围也毫无正义[b]。”
  to: 以撒对她说：“我也知道，也看得出雅各怎样待我们：他全心尊敬我们。以扫比雅各先出生；从他出生起，我爱他胜过雅各。但如今我爱雅各胜过以扫，因为以扫使自己的行为变得极其邪恶；他毫无正义。他所行的一切道路都是不义和强暴；他的周围毫无正义[a]。”
  rationale: 修订将以扫先出生处理为时间与次序的交代，而非偏爱的因果；恢复“不义和强暴”的源文次序；以更自然的汉语表达前一处“毫无正义”；并保留末句“周围”的语义及其可能的习语性理解。删除脚注a，以免将强化性表达不必要地解释为比较级。
