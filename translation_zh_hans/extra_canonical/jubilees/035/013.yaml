  terminology: “尊敬”“正义”“不义”“强暴”适合此处伦理性、庄重的语域。“极其邪恶”恰当表达该短语的强化及主动构式；不宜以“更加邪恶”作为同等可能的替译，因为经文此处没有明确的比较对象。
