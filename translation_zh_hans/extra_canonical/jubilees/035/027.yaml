base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/027.yaml
  text: 'And I command you, my sons: do righteousness and uprightness on the earth, so that Yahweh may bring upon you all that Yahweh said he would do for Abraham and for his seed.'
translation:
  language: zh_hans
  text: 我的儿子们，我吩咐你们：要在地上行公义和正直，好使雅威将他所说要为亚伯拉罕及其后裔成就的一切，临到你们身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ፡ ወርትዐ
  choice: 公义和正直
  rationale: 分别对应“公义”与“正直、端正”，保留两个并列的伦理概念，不将其合并为泛指的“善事”。
- source_word: እግዚአብሔር
  choice: 雅威
  rationale: 此处指以色列的神；依照经文语境及审校层对神名的处理，用现代汉语音译“雅威”。
- source_word: ለዘርኡ
  choice: 他的后裔
  rationale: 原词“种、后裔”为集合性单数；“后裔”既自然，又保留其可作整体理解的特点。
- source_word: ያምጽእ፡ ላዕሌክሙ
  choice: 把……都赐给你们
  rationale: 原意为“使……临到你们”；在应许实现的正面语境中译作“赐给你们”较自然，同时保留结果落到他们身上的含义。
theological_decisions:
- issue: 雅威之应许与人的公义行为之间的关系
  choice: 保留“好使”所表达的目的或结果关系
  alternative: 改译为不带关联的“雅威必会……”
  rationale: 原文以目的结构连接命令与应许的成就；译文不将其系统化为功德论，也不削弱原有的神学张力。
- issue: 对亚伯拉罕及其后裔所成就之事的时态
  choice: “他所说要……成就”
  alternative: “他为……所做的”
  rationale: 上下文指向先前宣告的应许及其实现；这样既反映原文“话语/所说”与“成就”的关系，也与审校层所保留的未来指向一致。
translation_notes:
  register: 采用庄重而直接的现代标准汉语；“我的儿子们，我吩咐你们”保留父亲临终训诫的语气，句法清楚，适合普通读者。
