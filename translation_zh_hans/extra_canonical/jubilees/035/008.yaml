base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/008.yaml
  text: and her teeth were strong, and no sickness at all had come upon her in all the days of her life. And Jacob said to her, “Blessed am I, mother, if my days draw near to the days of your life, and if my strength remains upon me like this, according to your strength. You will not die, for you speak with me in vain concerning your death.”
translation:
  language: zh_hans
  text: 她的牙齿坚固；她一生的年日里，从未有任何疾病临到她。雅各对她说：“母亲，我若能活到接近你一生的年日，我的力量也照着你的力量，像这样留在我身上，我就有福了。你不会死[a]，因为你同我谈论自己的死，不过是徒然。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要死。”
    reason: 该动词曾被理解为禁止式；正文依其未完成体形态及上下文译作陈述语气。
lexical_decisions:
- source_word: አስናኒሃኒ፡ ጽኑዕ
  choice: 她的牙齿仍然坚固
  rationale: 按词义直译“她的牙齿坚固”；加入“仍然”自然表达其年老而体健的语境，不改变命题内容。
- source_word: ኢምንተኒ፡ ሕማም፡ ኢበከፋ
  choice: 从未有任何疾病临到她
  rationale: 保留“任何疾病”和否定的完整力度；“临到”对应疾病来到或侵袭她的表达。
- source_word: ብፁዕ፡ አነ
  choice: 我就有福了
  rationale: 直译为“我是有福的”；置于条件句末更符合现代汉语表达。
- source_word: ቀርበ፡ መዋዕልየ፡ ለመዋዕለ፡ ሕይወትኪ
  choice: 我若能活到接近你一生的年日
  rationale: 保留“我的年日接近你生命的年日”这一比较，不把它解释成寿数完全相等。
- source_word: ወይሄስ፡ ኀይለየ፡ ላዕሌየ
  choice: 并且我的力量也能像你现在这样
  rationale: 将力量继续或存留在自己身上的意思译成自然汉语，同时用下句“与你的力量相称”保留比较关系。
- source_word: በከ፡ በጸው
  choice: 不过是徒然
  rationale: 对应“徒然、无益”之意，说明雅各认为她谈论死亡并无根据，而非指她随便闲谈。
theological_decisions:
- issue: አትመውቲ 的语气
  choice: 你不会死
  alternative: 不要死
  rationale: 此处动词形态和上下文较支持否定陈述：雅各根据母亲的强健安慰她不会死；但旧译所据的禁止式理解仍列入脚注，以保留形式或传承上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一生的年日”略带经卷体色彩，以呼应原文重复的“日子/年日”；对雅各较复杂的条件句作轻度重组，但保留两项条件及其比较关系。
