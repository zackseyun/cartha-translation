lexical_decisions:
- source_word: እገብር
  choice: 我都必照办
  rationale: 表达第一人称承诺“我将做”，并以“照办”自然承接“凡你对我说的”。
- source_word: እቀብረኪ
  choice: 把你安葬
  rationale: 准确传达“埋葬你”，同时采用适合亲属临终嘱托语境的庄重现代汉语。
- source_word: አፍቀርኪ
  choice: 照你的心愿
  rationale: 该词通常涉及爱、喜爱或意愿；本处语境是利百加希望葬在撒拉附近，因此译为“心愿”，避免生硬直译。
- source_word: አዕጽምቲሃ / አዕጽምትኪ
  choice: 她的骸骨 / 你的骸骨
  rationale: 保留原文两次明确提到“骨头”的具体意象，并用较庄重的“骸骨”。
