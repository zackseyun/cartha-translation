  text: And they ate and drank, she and her sons, that night; and she died in that night, in the third year of the seventh week of the forty-first jubilee. And her two sons, Esau and Jacob, buried her in the double cave near Sarah, the mother of their father.
translation:
  language: zh_hans
  text: 那一夜，她和儿子们一同吃喝。就在那一夜，她死了；那是第四十一禧年、第七个七年期的第三年。她的两个儿子——以扫和雅各——把她安葬在那座双重洞穴里，靠近他们父亲以撒的母亲撒拉。
