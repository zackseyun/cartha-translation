  rationale: 保留原文“二重／双重之洞”的表述，不擅自补入原文此处未出现的“麦比拉”地名。
- source_word: ቅሩበ፡ ሳራ፡ እመ፡ አቡሆሙ
  choice: 靠近他们父亲的母亲撒拉
  rationale: 保持原文亲属关系的明确说法，即撒拉是他们父亲以撒的母亲。
