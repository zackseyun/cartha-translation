  yaml_path: translation/extra_canonical/jubilees/035/011.yaml
  text: He has dealt wickedly with us; he has gathered your flocks, and he has plundered all your possessions from before your face. And while we ask and request from him what is ours, he acts like a man who has mercy on us.
translation:
  language: zh_hans
  text: 他恶待我们；他聚拢了你的羊群，又从你眼前掳走了你所有的财物。我们恳求他、向他索要属于我们的东西时，他却装作一个怜悯我们的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስሌነ፡ እኩየ
  choice: 他恶待我们
  rationale: 将表示“对我们”和“行恶、恶劣地行事”的结构译为自然的现代汉语，同时保留其行为评价。
- source_word: መሪዕቶከ፡ አስተጋብአ
  choice: 他聚拢了你的羊群
  rationale: 按使役、聚集之义处理动词，并保留第二人称单数所属关系。
- source_word: ኵሎ፡ ጥሪትከ፡ ሄደ
  choice: 掳走了你所有的财物
  rationale: 古典吉兹语ሄደ在此指抢夺、劫掠；ኵሎ为宾格，说明“所有的财物”是动词宾语，不译作“财物都走了”。
- source_word: እምቅድመ፡ ገጽከ
  choice: 从你眼前
  rationale: 保留原文“从你面前”的空间意象，也自然表达公然当面夺走之意。
- source_word: ናስተበቍዕ፡ ወንስእሎ
  choice: 我们恳求他、向他索要
  rationale: 保留两个并列的请求动词，不将其压缩为单一动作。
- source_word: ዘእምዚአነ፡ ውእቱ
  choice: 本来属于我们的东西
  rationale: 明确所求之物为“我们的”，但不补入原文没有说明的具体财物类别。
- source_word: ይሬሲ፡ ከመ፡ ዘብእሲ፡ ዘይምሕረነ
  choice: 他却表现得仿佛是他在怜悯我们
  rationale: 按“像一个怜悯我们的人那样行事”理解，保留原文带有反讽意味的表象与实际行为之间的张力。
theological_decisions:
- issue: 对所谓“怜悯”的反讽
  choice: 译作“仿佛是他在怜悯我们”
  alternative: 译作“他怜悯我们”
  rationale: 原文有比较成分“如同、仿佛”，并非直接肯定他确实施怜悯；译文保留这种讽刺性张力，不替叙述者消解判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恶待”“掳走”“恳求”“索要”等词清楚易懂，并保留原文连续控诉的语气。无需脚注：把ሄደ理解为“掳掠”有句法和古典吉兹语词义支持，而“财物都走了”源于不适用于此处的现代阿姆哈拉语联想。
