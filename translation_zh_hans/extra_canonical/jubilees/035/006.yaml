  yaml_path: translation/extra_canonical/jubilees/035/006.yaml
  text: 'And she said to him, “My son, all my days I have not seen in you any deed of crookedness, but only uprightness. Yet I will tell you the truth, my son: I shall die in this year, and I shall not live beyond this year, for I saw in a dream the day of my death, that I would not live beyond one hundred and fifty-five years.”'
translation:
  language: zh_hans
  text: “我要从他那里领受[a]，这将是我所蒙的恩惠。”她对他说：“我儿，我一生从未在你身上见过任何偏邪的行为，只见正直。但我实话告诉你，我儿：我今年就要死了，活不过这一年；因为我在梦中看见了我死亡的日子：我活不过一百五十五岁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有说明她要从他那里领受什么。
    reason: 保留原文宾语省略所造成的真实含混，避免根据上下文擅自补入“祝福”“安慰”等具体内容。
lexical_decisions:
- source_word: አንግብስ፡ እምኔሁ
  choice: 我也要从他那里领受
  rationale: 原文表达“从他那里领受”，但未明说所领受的具体事物；译文保留宾语隐含的特点，不据上下文擅自补足。
- source_word: ሣህለ
  choice: 恩惠
  rationale: 该词可指怜悯、慈惠或恩惠；此处用“恩惠”既自然，也保留广义的善待含义。
- source_word: ግብረ፡ ጠዋየ
  choice: 偏邪的行为
  rationale: 兼顾“行为”与“弯曲、不正”的意象，并与下文“正直”形成清楚对照。
- source_word: ርቱዐ
  choice: 正直
  rationale: 准确表达端正、正直之义，并保持与“偏邪”的对举。
- source_word: ኢየሐዩ፡ ፈድፋደ፡ እምእት፡ ወኃምሳ፡ ወኀምስ
  choice: 我活不过一百五十五岁
  rationale: 按原文“不再活过一百五十五”的年龄上限表达，采用现代汉语自然说法。
