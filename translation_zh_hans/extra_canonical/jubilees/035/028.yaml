  yaml_path: translation/extra_canonical/jubilees/035/028.yaml
  text: And love one another, my sons, among yourselves, each loving his brother as a man loves his own life, and let a man seek—”
translation:
  language: zh_hans
  text: “我的儿子们，你们彼此之间要相爱；各人要爱自己的兄弟，如同爱自己的性命，并且各人要寻求——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታፈቅሩ
  choice: 要相爱
  rationale: 该词表达爱；结合父亲对儿子们的劝诫语境，以劝勉式“要相爱”自然传达其命令意味。
- source_word: አኅዊክሙ
  choice: 自己的兄弟
  rationale: 保留原文“你们的兄弟”的亲属称谓，并按汉语个体分配结构译作“各人……自己的兄弟”。
- source_word: ነፍሶ
  choice: 自己的性命
  rationale: 原词可指生命、性命或自身；此处与爱兄弟相比较，“自己的性命”既贴近字义，也保留原文力度。
- source_word: ወይኀሥሥ፡ ብእሲ
  choice: 并且各人要寻求——
  rationale: ብእሲ（人）在此作动词“寻求”的主语，而不是宾语；本节在动词后中断，宾语延续至下一节，故用破折号保留未完句法。
theological_decisions:
- issue: 爱兄弟与爱自己生命的比较
  choice: 如同爱自己的性命
  alternative: 像爱自己一样
  rationale: “性命”更明确保留ነፍሶ的生命含义，不把原文泛化为现代心理意义上的“爱自己”。
- issue: 末句的语气与主语
  choice: 并且各人要寻求——
  alternative: 并且一个人寻求——
  rationale: 上下文是以撒对众子的劝诫，因此用“要”表达延续的劝勉语气；“各人”自然呈现泛指主语，同时不把“人”误作寻求的对象。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。“我的儿子们”保留亲属称呼；分号划分总体命令与个体说明。末尾破折号严格保留跨节未完的句子，不擅自补出下一节的宾语。
