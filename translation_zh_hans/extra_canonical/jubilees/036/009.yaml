  yaml_path: translation/extra_canonical/jubilees/036/009.yaml
  text: But if there is one among you who devises evil against his brother, know from now on that everyone who devises evil against his brother will fall into his hand, and he will be cut off from the land of the living, and his seed will be blotted out from under heaven.
translation:
  language: zh_hans
  text: 但你们中间若有人图谋加害自己的弟兄，你们从今以后要知道：凡图谋加害自己弟兄的，必落在他弟兄手中[a]；他必从活人之地被剪除，他的后裔也必从天下被抹去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“落在他手中”；“他”也可被理解为图谋者本人。
    reason: 原文第三人称代词的指向存在真实歧义，正文依语境指向其弟兄，脚注保留另一种可能。
lexical_decisions:
- source_word: ዘኀሠሠ፡ እኩየ
  choice: 图谋加害
  rationale: 该短语直指蓄意谋求恶事；“图谋加害”既保留谋划的意味，也自然表达恶意所针对的对象。
- source_word: ለእኁሁ
  choice: 自己的弟兄
  rationale: 保留亲属称谓“弟兄”，并用“自己的”明确其与图谋者的关系。
- source_word: ውስተ፡ እዴሁ፡ ይወድቅ
  choice: 必落在他弟兄手中
  rationale: 原文代词所指在语法上可能引起歧义；结合句中受害的弟兄这一最近且合乎语境的指称对象，正文明确译作落在其弟兄手中，同时以脚注保存较直译的形式。
- source_word: ይሤር፡ እምድረ፡ ሕያዋን
  choice: 必从活人之地被剪除
  rationale: 保留圣经式意象及被动惩罚含义，现代中文亦可理解。
- source_word: ዘርኡኒ፡ ይትሐጐል
  choice: 他的后裔也必……被抹去
  rationale: “后裔”准确传达种子、子孙之义；“被抹去”对应彻底消失的审判意象。
theological_decisions:
- issue: “落在他手中”之代词所指
  choice: 正文译为“落在他弟兄手中”
  alternative: “落在他自己手中”或仅译“落在他手中”
  rationale: 原文仅作第三人称单数所有形式，本身没有明确的反身标记。上下文警告谋害弟兄者反落入被害弟兄手中，因此正文采用这一较自然的指向；脚注保留原文形式上的含混，避免把解释冒充无歧义的字面意义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“活人之地”“从天下被抹去”等经文意象。“你们从今以后要知道”依原文语序表达郑重警告。
