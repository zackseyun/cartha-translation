  yaml_path: translation/extra_canonical/jubilees/036/014.yaml
  text: And Esau said, “I sold it to Jacob, and I gave the birthright to Jacob; let it be given to him, and I have no word to say about it, for it is his."”
translation:
  language: zh_hans
  text: 以扫说：“我把它卖给雅各，也把长子的名分给了雅各；就让它归给他吧。对此我无话可说[a]，因为它是他的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我什么也没有。”
    reason: 对应英语审校轨迹所记录的简略替代译法；锚定“我无话可说”，不改变正文所依据的完整吉兹续文。
lexical_decisions:
- source_word: ሤጥኩ፡ ሎቱ፡ ለያዕቆብ
  choice: 我已经把它卖给雅各
  rationale: 原文动词意为“我卖了”，受词未明说；汉语补出中性的“它”，承接上下文，同时不直接把它限定为“长子的名分”。
- source_word: ልህቃነ
  choice: 长子的名分
  rationale: 该词在此指长子所享有的身份和权利；“长子的名分”是自然且为普通读者熟悉的表达。
- source_word: ይትወሀብ፡ ሎቱ
  choice: 就让它归给他吧
  rationale: 保留第三人称被动／准被动的许可意味，以自然汉语表达“让它给他”。
- source_word: አልቦየ፡ ቃለ፡ ዘእብል፡ በእንቲአሁ
  choice: 对此我无话可说
  rationale: 完整句意是没有可就此说的话；此译简洁自然，不扩大为法律性声明。
- source_word: እስመ፡ ዚአሁ፡ ውእቱ
  choice: 因为它是他的
  rationale: 直译所有关系，不进一步解释“它”具体包括哪些权利或祝福。
theological_decisions:
- issue: 以扫所转让之物的具体范围
  choice: 以中性代词“它”保留所指
  alternative: 明确译为“长子的名分”或“祝福”
  rationale: 首句受词在原文中省略，后文虽提到长子的名分，但不宜在首句中把潜在所指完全锁定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“长子的名分”表达相关身份与权利，并保留原文代词所指的含混性。
