  text: And Isaac said, “May a blessing rest upon you, my sons, and upon your seed this day, because you have given me rest.”
translation:
  language: zh_hans
  text: 以撒说：“我的儿子们，愿祝福今日临到你们和你们的后裔，因为你们使我得了安息。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በረከተ
  choice: 福分
  rationale: 对应“祝福、福分”，在此作愿望句的主语；“福分临到”自然且保留宗教语域。
- source_word: አውሉድየ
  choice: 我儿
  rationale: 字面为“我的儿女／孩子们”；语境中以撒对儿子们说话，现代汉语群体称呼用“我儿”庄重而简洁。
- source_word: ዘርእክሙ
  choice: 你们的后裔
  rationale: 保留“种子、后代”的传统语义，在谱系与盟约语境中“后裔”最准确。
- source_word: አዕረፍክሙኒ
  choice: 你们使我得了安息
  rationale: 使役形式表达“使我安歇／得安息”；采用“得了安息”保留与前句“愿福分临到”的词义呼应。
theological_decisions:
- issue: “安息”是否解释为具体的和解、安心或临终安宁
  choice: 保留“使我得了安息”
  alternative: “使我安心”或“使我安享晚年”
  rationale: 原文措辞具有较宽的“休息、安歇”含义，不把它限定为心理状态或临终处境，以保存潜在的叙事与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。愿望句以“愿……临到……”表达；不添加原文未明说的因果解释。
