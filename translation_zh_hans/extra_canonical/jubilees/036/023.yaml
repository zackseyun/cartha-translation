  yaml_path: translation/extra_canonical/jubilees/036/023.yaml
  text: For he loved her exceedingly after Rachel her sister had died, because she was perfect and upright in all her ways and honored Jacob; and in all the days of her life with him he had not heard from her mouth a harsh word, because gentleness and peace and uprightness and honor were in her.
translation:
  language: zh_hans
  text: 自从她的姊妹拉结死后，他就格外疼爱她；因为她在一切的行事上都完全、正直，并且敬重雅各。在她与雅各共同生活的所有日子里，雅各从未听见她口中说过一句严厉的话，因为温柔、平和、正直和尊荣都在她里面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“因为她温柔、平和、正直、可敬。”
    reason: 原文以四个抽象名词说这些品格“在她里面”；此译法将其自然转述为对她品格的形容。
lexical_decisions:
- source_word: ያፈቅራ፡ ፈድፋደ፡ ጥቀ
  choice: 格外疼爱她
  rationale: 保留动词“爱”及双重强化语气，以自然现代汉语表达极深的爱。
- source_word: ፍጽምት፡ ወሬትዕት
  choice: 完全正直
  rationale: “完全”对应完整、无可指摘之意；“正直”对应行为端正，不额外引入道德体系。
- source_word: በኵሉ፡ ፍናዊሃ
  choice: 她的一切行事
  rationale: 源语字面为“在她所有的道路上”，汉语用“行事”自然表达生活方式与行为。
- source_word: ቃለ፡ ድሩከ
  choice: 一句严厉的话
  rationale: 按上下文译作刺耳、苛厉的话；“严厉”保留其负面言语力度而不过度具体化。
- source_word: የውህት፡ ወሰላመ፡ ወርትዕ፡ ወክብራ፡ ባቲ
  choice: 她里面有温柔、和睦、正直和尊荣
  rationale: 保留源语四个抽象名词及“在她里面”的结构，不改写为一串形容词。
theological_decisions:
- issue: “完全”是否暗示绝对无罪
  choice: 按源语保留“完全”，并限定于“她的一切行事”这一品格评价
  alternative: 译作“无可指摘”或“纯全”
  rationale: 经文是在赞誉人物的生活品格，并未展开无罪论；不应因后来的神学争议而削弱原文。
- issue: 末句抽象名词的处理
  choice: 保留“温柔、和睦、正直和尊荣”在她里面
  alternative: 译作“她温柔、和善、正直、可敬”
  rationale: 抽象名词结构具有品格内住、充盈于人的表达张力，应予保留，同时用脚注说明较动态的理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“疼爱”体现亲密深厚之爱；“共同生活”避免“同住”可能产生的临时居住感。主语在长句后半明确补出“雅各”，以消除汉语代词歧义。脚注标记[a]置于相关末句之后。
