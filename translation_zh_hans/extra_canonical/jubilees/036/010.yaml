revisions:
- from: 在动乱、咒诅、烈怒和震怒的日子，吞噬一切的熊熊烈火必临到他。上帝怎样焚烧了所多玛，也必照样焚烧他的土地、他的城和一切属于他的。他必从《世人之子训诫册》中被涂去[a]，不能列入《生命册》，反要列入那注定灭亡的册中；他必落入永远的咒诅。这样，他们所受的审判必世世代代不断更新，伴随着诅咒、咒诅、震怒、痛苦、烈怒、灾殃和永远的疾病[b]。
  to: 在动乱、咒诅、烈怒和震怒的日子，他必以吞噬一切的熊熊烈火施行审判；正如他焚烧所多玛，也必照样焚烧他的土地、他的城和一切属他的；他必从《世人之子训诫册》中被涂去[a]，不能列入《生命册》，反要进入那注定灭亡的归宿；他必落入永远的咒诅。这样，他们所受的审判必世世代代在咒骂、咒诅、震怒、痛苦、烈怒、灾殃和永远的疾病中不断更新[b]。
  rationale: 修订开头，使“熊熊烈火”明确为施行焚烧审判的手段，而非另行“临到”单数对象；删除原文未出现的第二个“册”，以“注定灭亡的归宿”保留原文的概括指涉；并调整末句介词结构和首组近义词，使之既忠实呈现审判不断更新及咒罚词累加，也符合现代汉语表达。
