base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/010.yaml
  text: And on the day of turmoil and cursing and fury and wrath[10], and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse[10], so that for all days their judgment may be renewed with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease.
translation:
  language: zh_hans
  text: 在动乱、咒诅、烈怒和震怒的日子，他必以吞噬一切的熊熊烈火施行审判；正如他焚烧所多玛，也必照样焚烧他的土地、他的城和一切属他的；他必从《世人之子训诫册》中被涂去[a]，不能列入《生命册》，反要进入那注定灭亡的归宿；他必落入永远的咒诅。这样，他们所受的审判必世世代代在咒骂、咒诅、震怒、痛苦、烈怒、灾殃和永远的疾病中不断更新[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “《世人之子训诫册》”原文含义较难确定。吉兹文似乎把这册与《生命册》区别开来，但前一册的确切性质不明。
    reason: textual_variant
  - marker: b
    text: 末句连续使用多个意义相近的咒罚词。译文保留这种层层累加的表达，因为它本身构成警告的修辞力量。
    reason: segmentation_note
lexical_decisions:
- source_word: ሁከት
  choice: 动乱
  rationale: 表达骚乱、扰乱之意，适合审判场景，同时避免过度具体化。
- source_word: መርገም
  choice: 咒诅
  rationale: 在经文中前后保持一致，传达正式的诅咒与受咒状态。
- source_word: ቍጥዓ / መዓት
  choice: 烈怒 / 震怒
  rationale: 原文并列两个意义相近的怒气词，译文用两个近义词保留其累积修辞，不合并为一项。
- source_word: መጽሐፈ ተግሣጸ ውሉደ ሰብእ
  choice: 《世人之子训诫册》
  rationale: 按构词关系直译为与世人之子有关的训诫记录，并与随后明确出现的《生命册》区分；因确切性质不明，另加脚注。
- source_word: ይትሐጐል ወየኀልፍ
  choice: 注定灭亡……落入
  rationale: 分别保留毁灭、消逝或转入另一处境的意象，不把两者简化成同一动作。
- source_word: ጽእለት / መርገም
  choice: 诅咒 / 咒诅
  rationale: 以相近但不同的汉语词保留原文连续堆叠的咒罚词汇及其顺序。
- source_word: እንዘ ትትሔደስ
  choice: 不断更新
  rationale: 明确译出持续或反复更新的分词结构，避免误作‘他们谴责他’。
theological_decisions:
- issue: 焚烧所多玛者的主语
  choice: 上帝怎样焚烧了所多玛
  alternative: 他怎样焚烧了所多玛
  rationale: 汉语补出语境所隐含的施行审判者，使句意自然清楚；不借此加入更具体的位格认定。
- issue: 两种册籍的关系
  choice: 将《世人之子训诫册》与《生命册》分别处理
  alternative: 把前者解释成《生命册》的别称
  rationale: 原文表面上区分两者；译文保留这一区分，不以特定神学体系将它们等同。
- issue: 末句代词由单数转为复数
  choice: 保留“他们所受的审判”
  alternative: 统一改为“他所受的审判”
  rationale: 源文在此呈现复数所有关系；即使与前文单数对象形成张力，也不静默校正。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；册名加书名号以帮助普通读者辨认意象。保留审判用语的重复和强度，不将近义项压缩，也不消除单复数转换及册籍含义上的真实疑难。
