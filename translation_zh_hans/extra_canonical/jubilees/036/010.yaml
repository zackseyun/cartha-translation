  naturalness: 整体庄重通顺。将开头改为“以……火施行审判”，并将末句改作“在……中不断更新”，可更自然地体现原文的工具性表达与分词性修饰。
  terminology: “生命册”“咒诅”“烈怒／震怒”“灾殃”“永远的疾病”均适合本段的庄重审判语域。“世人之子训诫册”可保留，并以脚注说明其文本和语义困难。末句以“咒骂和咒诅”区分相邻的近义咒罚词，比仅作“诅咒、咒诅”更自然。
