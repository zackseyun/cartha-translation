  yaml_path: translation/extra_canonical/jubilees/036/003.yaml
  text: 'And this I command you, my sons: do righteousness and uprightness on the earth, so that the LORD may bring upon you all that the LORD said he would do for Abraham and for his seed.'
translation:
  language: zh_hans
  text: “我的孩子们，我吩咐你们这件事：要在地上行公义和正直，好叫耶和华使他所说要为亚伯拉罕和他的后裔成就的一切，都临到你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉድየ
  choice: 我儿
  rationale: 原词直译为“我的儿女／孩子们”，在父亲向众子训诫的语境中，用现代汉语集合性称呼“我儿”，庄重而自然，并由后面的“你们”明确复数。
- source_word: ጽድቀ፡ ወርትዐ
  choice: 公义和正直
  rationale: 分别保留“义／公正”与“正直／端正”的并列意义，不将两者合并为单一德目。
- source_word: ይገበር
  choice: 成就
  rationale: 该动词基本义为“做、施行”；与上文“所说”相连时，汉语用“成就”自然表达把应许付诸实现。
- source_word: ዘርኡ
  choice: 他的后裔
  rationale: 原词可指种子或后代；此处指亚伯拉罕的后代，采用现代圣经语体常用的“后裔”，并保留集合含义。
theological_decisions:
- issue: 顺服与神应许实现之间的关系
  choice: 译作“好使……临到你们”，保留目的或结果关系
  alternative: 可弱化为“这样……就会临到你们”
  rationale: 原文以ከመ引出从句，具有目的或结果色彩；译文不进一步判定人的义行在神学上是功德条件、盟约条件还是应许实现的途径。
- issue: 神对亚伯拉罕及其后裔所说之事的句法范围
  choice: “为亚伯拉罕和他的后裔成就的一切”
  alternative: “对亚伯拉罕和他的后裔所说的一切”
  rationale: 原文结构及英语审校层理解为耶和华所说要为亚伯拉罕及其后裔施行之事；本译法呈现这一关系，同时避免增添具体应许内容。
translation_notes:
  register: 采用现代、庄重而易懂的训诫语体。保留神名“耶和华”，与源文专名用法相应；句中代词“他”避免现代汉语中非必要的专门神性代词。未设置脚注，因此正文无脚注标记。
