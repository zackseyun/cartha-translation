  yaml_path: translation/extra_canonical/jubilees/036/024.yaml
  text: And he remembered all her deeds that she had done in her life, and he mourned for her greatly, because he loved her with all his heart and with all his soul.
translation:
  language: zh_hans
  text: 他想起她生前所做的一切事，就为她深深哀悼，因为他用全心全魂爱她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይዜከር
  choice: 他想起
  rationale: 该动词在此表示回想、记起；结合后文哀悼的语境，译作“想起”自然且准确。
- source_word: ኵሎ ምግባራቲሃ
  choice: 她……所做的一切事
  rationale: 保留“全部”与“行为/所做之事”的范围，不额外赋予善恶评价。
- source_word: ወይላሕዋ ጥቀ
  choice: 就为她深深哀悼
  rationale: “ጥቀ”加强哀恸程度；“哀悼”比一般的“悲伤”更契合为逝者举哀的上下文。
- source_word: በኵሉ ልቡ ወበኵሉ ነፍሱ
  choice: 全心全意
  rationale: 这是现代汉语中自然而庄重的对应表达，传达“以全部的心、全部的魂/生命”之完整投入。
theological_decisions:
- issue: “心”与“魂”是否应逐项直译
  choice: 采用习语“全心全意”
  alternative: “用他的全心和全魂”或“尽心尽性”
  rationale: 原文为强调爱的完全与深切，并非在此建立心与魂的二分人论；“全心全意”既保留整体意义，也避免生硬及带入特定经文套语。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“一生所做的一切事”贴近原文次序；“深深哀悼”传达强烈悲痛；不添加原文没有的道德评价或神学解释。
