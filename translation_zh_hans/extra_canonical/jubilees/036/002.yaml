revisions:
- from: 要把我葬在我父亲亚伯拉罕附近，就是赫人以弗仑田间的麦比拉洞里；那地方是亚伯拉罕买来作墓地的。要把我葬在我在那里为自己挖的墓穴里。
  to: 要把我葬在我父亲亚伯拉罕附近，葬在赫人以弗仑田地里的双重洞穴中；亚伯拉罕买下那里作墓地。要把我葬在我在那里为自己挖的坟墓里。
  rationale: 修订保留原文的重复命令和“附近／洞穴／田地／取得作墓地／亲自挖掘”诸要素；以“双重洞穴”对应原文及英文审校文本，而不以传统地名覆盖其描述性措辞。句法同时调整为现代标准汉语较自然、清晰的表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:02:46Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了葬在亚伯拉罕近旁、以弗仑田地、亚伯拉罕取得墓地及说话者亲自掘墓等主要信息。不过，原文及英文审校轨迹均将该处表述为“double cave（双重洞穴）”；径译为专名“麦比拉洞”会把原文的描述性措辞替换为来自相关传统的固定地名，因而应保留“双重”的语义。
  naturalness: “赫人以弗仑田间”略显生硬，改为“赫人以弗仑田地里的”更符合现代汉语。末句的“坟墓”比“墓穴”更适合对应已为自己掘好的安葬之处。
  terminology: “亚伯拉罕”“以弗仑”“赫人”均合乎通行中文圣经用语。为忠实呈现本段原文，不将“double cave”直接替换为“麦比拉洞”。
  issues:
