  yaml_path: translation/extra_canonical/jubilees/036/002.yaml
  text: And bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, which Abraham acquired for a burial place there. In the tomb that I dug for myself there, bury me.
translation:
  language: zh_hans
  text: 要把我葬在我父亲亚伯拉罕附近，葬在赫人以弗仑田地里的双重洞穴中；亚伯拉罕买下那里作墓地。要把我葬在我在那里为自己挖的坟墓里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅሩበ
  choice: 附近
  rationale: 表达“靠近、邻近”，对应以撒要求葬在父亲亚伯拉罕近旁的意思。
- source_word: ባዐት፡ ዘካዕበት
  choice: 麦比拉洞
  rationale: 该短语字面可理解为“双重之洞”，但在此传统叙事和地名语境中指麦比拉洞；采用现代中文圣经读者熟悉的专名。
- source_word: ኬጥያዊ
  choice: 赫人
  rationale: 指赫族人，采用现代中文圣经惯用族名。
- source_word: ዘአጥረየ
  choice: 买来
  rationale: 此处表示亚伯拉罕取得该地作墓地；结合土地交易语境译为“买来”比泛称“取得”更明确自然。
- source_word: ዘከረይኩ
  choice: 挖
  rationale: 按该动词在墓穴语境中的具体动作译作“挖”，保留说话者亲自预备墓穴之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言；保留原文后半句重复“葬我”的强调，用两个祈使句呈现。地名和族名依通行中文圣经译法处理。
