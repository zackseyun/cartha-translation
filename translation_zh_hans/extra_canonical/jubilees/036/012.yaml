  yaml_path: translation/extra_canonical/jubilees/036/012.yaml
  text: And he divided all the possessions that he had between them on that day, and he gave the greater share to the man who was born first, and the tower[12] and all that was around it, and all that Abraham had acquired at the Well of the Oath.
translation:
  language: zh_hans
  text: 那一天，他把自己所有的财产都在他们之间分配，并把较大的一份给了那位先出生的人，又把塔楼[a]和周围的一切，以及亚伯拉罕在誓约井所得的一切，都给了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔楼”可能指以撒所得产业中的某一特定建筑或产业设施。这里的产业清单十分简略，原文的确切所指并不清楚。
    reason: 文化与文本说明
lexical_decisions:
- source_word: ጥሪተ
  choice: 财产
  rationale: 原词明确指财物、产业或财富；译出这一名词，避免仅作笼统的“所有”。
- source_word: ዕበየ
  choice: 较多的一份
  rationale: 在分配财产的语境中表示较大、较多的份额；此译自然地保留比较意味。
- source_word: ለብእሲ፡ ዘውእቱ፡ ቀደመ፡ ተወልደ
  choice: 给了那先出生的人
  rationale: 保留原文明确的“人”以及先出生这一描述，不擅自改成带有特定继承制度色彩的称号。
- source_word: ማኅፈደ
  choice: 塔楼
  rationale: 按此处名词传统上所指的塔或产业中的塔楼翻译；因具体所指不明，附注说明。
- source_word: ዐዘቅተ፡ መሐላ
  choice: 誓约井
  rationale: 按构词直译地名意涵，同时保持它作为特定地点的性质。
theological_decisions:
- issue: “先出生的人”是否译作“长子”
  choice: 先出生的人
  alternative: 长子
  rationale: 原文采用描述性说法，未直接使用具有法律或神学继承含义的专门称谓；保留描述可避免过度诠释。
- issue: “誓约井”是否规范化为圣经常见地名“别是巴”
  choice: 誓约井
  alternative: 别是巴
  rationale: 原文以意译式地点称呼出现；保留其字面意义，也避免把文本的表达方式静默替换成传统地名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“较多的一份”符合中文财产分配语境；末尾补出“都给了他”，使连续宾语的归属在中文中清楚，但不增加新的受益人。
