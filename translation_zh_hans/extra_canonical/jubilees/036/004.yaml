  yaml_path: translation/extra_canonical/jubilees/036/004.yaml
  text: And be, my sons, loving among yourselves, loving your brothers as a man who loves his own life, and each seeking for his brother what is good for him; and act together on the earth, and let them love one another as themselves.
translation:
  language: zh_hans
  text: 我的孩子们，你们要彼此相爱，爱你们的弟兄，如同人爱自己的性命；各人都要为弟兄寻求对他有益的事。你们要在地上一同行事，彼此相爱，如同爱自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句字面作“让他们彼此相爱，如同他们自己”（即“如同爱自己”）；人称由前文的“你们”转为“他们”。
    reason: 保留吉兹语原文末句的人称变化，并说明其省略的比较表达。
lexical_decisions:
- source_word: ውሉድየ
  choice: 我的孩子们
  rationale: 保留亲切而郑重的直接称呼；“孩子们”比仅限男性的“儿子们”更自然，也可涵盖后裔或众子女的称谓范围。
- source_word: ነፍሶ
  choice: 自己的性命
  rationale: ነፍስ在此可指生命、性命或自身；在“爱自己的……”这一语境中译为“性命”，既自然又保留生命层面的力度。
- source_word: የኀሥሥ
  choice: 寻求
  rationale: 按词义保留主动追求、设法促成之意，不弱化为仅仅“希望”。
- source_word: በዘ፡ ይሤኒ፡ ሎቱ
  choice: 对他有益的事
  rationale: 表达“对他好的／有益的”，避免将“好”限定为道德意义或物质利益。
- source_word: በገቢረ፡ ኅቡረ
  choice: 同心行事
  rationale: 原文含共同做事、联合行动之意；“同心行事”兼顾共同性与中文表达的庄重自然。
theological_decisions:
- issue: “爱弟兄如同爱自己的性命”与末句“彼此相爱，如同爱自己”的关系
  choice: 保留两次相近而不完全相同的劝勉
  alternative: 合并为一次“爱人如己”的概括
  rationale: 原文有意重复，并分别使用“性命／自身”相关表达；不把它直接同化为某一熟知的正典公式。
- issue: 原文末句由第二人称转为第三人称的语法人称变化
  choice: 正文按直接劝诫的语境译为“你们……彼此相爱”，并以脚注说明字面人称
  alternative: 正文直译为“让他们彼此相爱”
  rationale: 上下文持续向“我的孩子们”说话，中文若突然改为“他们”容易被误解为另有所指；脚注保留原文真实的人称张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。保留“弟兄”以呈现古代亲族与群体称谓；用分号和句号梳理原文连续的并列结构，同时不消除其重复与人称张力。
