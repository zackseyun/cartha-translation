  yaml_path: translation/extra_canonical/jubilees/036/011.yaml
  text: I declare and testify to you, my sons, according to the judgment that will come upon the man who desires to do evil against his brother.
translation:
  language: zh_hans
  text: 我的孩子们，我照着那将临到想要向自己弟兄行恶之人身上的审判，向你们宣告并作证。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按照那将临到意欲向自己弟兄作恶之人身上的审判。”
    reason: 说明“照着”所对应的“按照”关系，并保留原文对意图而非既成行为的表述。
lexical_decisions:
- source_word: አነግር፡ ወአስምዕ
  choice: 宣告并作证
  rationale: 保留两个并列动词；“作证”体现使役动词አስምዕ在劝诫、立约语境中的郑重分量，不弱化为单纯的“告知”。
- source_word: በከመ፡ ኵነኔ
  choice: 照着……审判
  rationale: 明确保留በከመ所表达的“按照、照着”，而不把句子改写成直接宣告审判；汉语将相关定语后置于“照着”之后，以尽量维持原句关系。
- source_word: ዘይፈቅድ፡ ይግበር፡ ሕሡመ
  choice: 恶意加害
  rationale: ይፈቅድ表示意愿或企图，ሕሡመ指恶事、伤害；“恶意加害”兼顾内在意图与针对弟兄的恶行。
- source_word: እኁሁ
  choice: 自己的弟兄
  rationale: 采用庄重而通行的经文用语“弟兄”，并用“自己的”清楚表达第三人称领属。
theological_decisions:
- issue: 审判与宣告之间的句法关系
  choice: 保留“照着……审判”，使宣告和作证以该审判为准则或依据
  alternative: 译作“我向你们宣告并作证：……的人必受审判”
  rationale: 原文明确含በከመ；虽然后一种汉语更顺，却会消除原文中“按照/照着”的句法张力。
- issue: 所图之恶是一般作恶还是具体伤害
  choice: 译为“恶意加害自己的弟兄”
  alternative: 译为“想要向自己的弟兄行恶”
  rationale: “加害”自然呈现行为所针对的对象，同时保留其道德恶性；脚注列出较贴近逐词结构的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我的孩子们”保留父亲临终劝诫的亲密语气；“宣告并作证”保持郑重、近于法庭或立约的语域。原文“照着……审判”的表达在汉语中略显凝重，但为避免抹平源文句法而予以保留。
