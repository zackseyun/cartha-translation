  text: there was peace among them. And they went out from him and rested that day and slept. And Isaac slept on his bed five years[18], rejoicing, and he slept the eternal sleep and died at the age of one hundred and eighty years. He completed twenty-five weeks and five years. And his two sons buried him.
translation:
  language: zh_hans
  text: 他们之间和睦了。于是，他们从他那里出来，当天休息，睡下了。那一天，以撒满心喜乐地睡在床上；他进入了永远的长眠，离世了，享年一百八十岁。他度过了二十五个七年期又五年[a]。他的两个儿子把他安葬了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 二十五个七年期等于一百七十五年，再加五年，共一百八十年。原文先说以撒享年一百八十岁，随后又用这种历法方式概括其寿数。
    reason: cross_reference
lexical_decisions:
- source_word: ዐርዮ
  choice: 和睦
  rationale: 该词在此表示彼此间和平、协调的状态；译作“和睦”既贴近语义，也符合现代汉语叙事表达。
- source_word: ንዋመ፡ ዘለዓለም
  choice: 永远的长眠
  rationale: 原文直译为“永远的睡眠”，是对死亡的委婉表达；保留“睡眠”意象，同时用“长眠”使中文自然庄重。
- source_word: ወልደ፡ ፻ወ፹ዓመት
  choice: 享年一百八十岁
  rationale: 原文为闪语式年龄表达，字面近于“一个一百八十岁的人”；“享年”准确传达死时年龄。
- source_word: ፻ወ፶ምስ፡ ሱባዔ፡ ፈጸመ፡ ወ፭ዓመተ
  choice: 他度过了二十五个七年期又五年
  rationale: “周/七期”在《禧年书》的年代计算中指七年为一期；明确译作“七年期”可避免现代读者误解为七天的一周，并保留原文独立的历法总结。
- source_word: ክልኤሆሙ፡ ውሉዱ
  choice: 他的两个儿子
  rationale: 原文只说“他的两个儿子”，未在本节写出姓名，因此不补入以扫和雅各。
theological_decisions:
- issue: “永远的睡眠”与死亡的关系
  choice: 随后，他睡了永远的长眠，离世了
  alternative: 随后，他永远沉睡，就是死了
  rationale: 保留原文先述“永远的睡眠”、再述死亡的并列推进，不用“就是”把两者解释性等同，以免消解原文的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“满心喜乐地睡在床上”保留原文当天喜乐安睡的情景；分号区分普通睡眠与随后作为死亡意象的“永远的长眠”。所有原文连接关系均保留，但适度调整标点以符合现代汉语。
