  yaml_path: translation/extra_canonical/jubilees/036/020.yaml
  text: But Jacob dwelt on Mount Hebron, in the tower of the land of the sojourning of Abraham his father, and he worshiped the LORD with all his heart and according to the commandments as they were revealed,
translation:
  language: zh_hans
  text: 雅各住在希伯仑山上，在他父亲亚伯拉罕寄居之地的塔中[a]；他全心敬拜主，遵照所启示的诫命，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文中“塔”“地”和“寄居”之间的修饰关系可有不同划分；无论如何，“他父亲亚伯拉罕”与其寄居有关，且原文明确含有“地”一词。
    reason: 说明短语修饰关系的歧义，同时保留原文中亚伯拉罕及“地”两个不可省略的成分。
lexical_decisions:
- source_word: ኀደረ
  choice: 住
  rationale: 表示居住、停留；此处叙述雅各的居所，用“住”自然准确。
- source_word: ደብረ፡ ኬብሮን
  choice: 希伯仑山
  rationale: ደብር 表示山或山地，保留原文明确的地形称谓。
- source_word: ማኅደድ
  choice: 塔
  rationale: 该词在此传统文本中通常理解为塔或高楼；采用简明的“塔”。
- source_word: ምድረ፡ ፍልሰተ
  choice: 寄居之地
  rationale: 保留“土地”和“寄居”两层意义，不省略原文的 ምድር（地）。
- source_word: አምላከ፡ ለእግዚአብሔር
  choice: 敬拜主
  rationale: 此处动词表达事奉或敬拜；“敬拜主”符合上下文，也避免生硬直译。
- source_word: በኵሉ፡ ልቡ
  choice: 全心
  rationale: 直译为“以他的全心”，现代汉语用“全心”简洁庄重。
- source_word: ትእዛዛት
  choice: 诫命
  rationale: 复数名词指神所颁的命令；“诫命”符合宗教语境且保持正式语体。
- source_word: ያስተርኢ
  choice: 所启示的
  rationale: 该形式在此可表达显明、使人看见或启示；“所启示的”自然地保留神圣命令被显明的含义。
theological_decisions:
- issue: “主”的指称与排印
  choice: 主
  alternative: 上主／耶和华
  rationale: 原文使用常规的神圣称号，未在本句拼写神名；译作“主”既忠实又不额外引入特定译名传统。
- issue: 命令显明方式的表达
  choice: 所启示的诫命
  alternative: 所显明的诫命
  rationale: “启示”符合语境，但不补出启示者、时间或媒介，从而保留原文的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文末尾未完的逗号，因为本节现有底本及英译均显示句意继续；不擅自补足后文。
