  naturalness: 叙事和引语总体自然、庄重。“召来”可用，但“召集了”更符合同时召唤两个儿子的语境；“他们来到他那里”略显直译，改为“他们就来到他面前”更自然。
  terminology: “以撒”“以扫”“雅各”均为通行译名。“永恒之家”忠实保留原文未界定的死后居所，不应具体化。“祖先”适切；“孩子们”可保留为父亲对儿子们的亲切称呼。
