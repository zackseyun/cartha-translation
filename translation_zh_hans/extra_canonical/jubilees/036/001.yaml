  yaml_path: translation/extra_canonical/jubilees/036/001.yaml
  text: And in the sixth year of this week, Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.”
translation:
  language: zh_hans
  text: 这一七年期的第六年，以撒召集了他的两个儿子——以扫和雅各；他们就来到他面前。他对他们说：“我的孩子们，我将踏上我祖先所走的路，前往我祖先所在的永恒之家。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘዝሱባዔ
  choice: 这一七年
  rationale: 该词指按七年为一周期的“七年期”。译作“这一七年”，既保留《禧年书》的纪年方式，也比音译或泛译为“一周”更不易让现代读者误解为七日。
- source_word: ውስተ፡ ፍኖተ፡ አበውየ
  choice: 踏上我祖先所走的路
  rationale: 原文直指“进入／走上我先祖之路”，是死亡的委婉表达；此译保留道路意象而不直接释作“死亡”。
- source_word: ቤት፡ ዘለዓለም
  choice: 永恒之家
  rationale: 按原文保留“家／居所”与“永恒”的组合，不将其具体化为坟墓、阴间或天堂。
- source_word: አበውየ
  choice: 我祖先
  rationale: 该词可指父辈或列祖；语境涉及已经离世的先人，译作“祖先”自然且不局限于以撒的生父。
theological_decisions:
- issue: “永恒之家”所指的死后处所
  choice: 保留“永恒之家”的含混表达
  alternative: 译为“永远的坟墓”“阴间”或“天堂”
  rationale: 原文没有明确界定该处所；不以特定末世论或死后观替文本作解释。
- issue: “祖先之路”的死亡含义
  choice: 保留道路隐喻
  alternative: 直译为“我要死了”
  rationale: 原文以祖先所走的路委婉指向死亡；保留该意象可维持其文学色彩和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这一七年”保留本书特有的七年周期纪年；直接引语保持父亲临终训言的郑重语气。
