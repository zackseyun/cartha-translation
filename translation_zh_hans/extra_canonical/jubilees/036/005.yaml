- from: 至于偶像的事，我吩咐你们，也劝诫你们：要藐视它们，抵制它们，不可喜爱它们；因为对于那些敬拜它们、向它们跪拜的人，它们充满了谬误。
  to: 至于偶像的事，我吩咐你们，也劝诫你们：要藐视它们，弃绝它们，不可喜爱它们；因为对那些敬拜它们、向它们跪拜的人来说，它们满是谬误。
  rationale: 修订改善“抵制”的语域与末句的汉语句法。保留“偶像”作为末句主语，并没有改译为“敬拜者充满谬误”或“偶像使人陷入谬误”，因此不越过原文和英语审校层所保留的解释空间。
