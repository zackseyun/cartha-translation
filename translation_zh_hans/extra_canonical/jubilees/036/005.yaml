  yaml_path: translation/extra_canonical/jubilees/036/005.yaml
  text: And concerning the matter of idols, I command you and exhort you that you should despise them and reject them, and that you should not love them, because they are full of error for those who worship them and for those who bow down to them.
translation:
  language: zh_hans
  text: 至于偶像的事，我吩咐你们，也劝诫你们：要藐视它们，弃绝它们，不可喜爱它们；因为对那些敬拜它们、向它们跪拜的人来说，它们满是谬误。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጣዖት
  choice: 偶像
  rationale: 准确对应受敬拜的偶像，且是现代汉语宗教文本中自然、明确的用语。
- source_word: ትመንንምዎሙ
  choice: 藐视它们
  rationale: 保留原文要求鄙弃、轻看偶像的强烈语气。
- source_word: ወተጸረርዎሙ
  choice: 抵制它们
  rationale: 该动词表达反对、敌对之意；“抵制”既保留主动抗拒的力度，又符合现代汉语表达。
- source_word: ኢታፍቅርዎሙ
  choice: 不可喜爱它们
  rationale: 直译原文否定“爱”的表述，不弱化为仅仅“不要亲近”。
- source_word: ስሕተት፡ ምሉአን
  choice: 充满了谬误
  rationale: 保留“充满”这一谓语结构，并以“谬误”表达迷误、错误之义。
- source_word: ያመልኩዎሙ / ይሰግዱ፡ ሎሙ
  choice: 敬拜它们／向它们跪拜
  rationale: 区分一般性的敬拜与身体俯伏、跪拜的动作，保留原文并列。
theological_decisions:
- issue: “充满谬误”所修饰或影响的对象
  choice: 译作“对于那些……的人，它们充满了谬误”
  alternative: “敬拜它们、向它们跪拜的人充满了谬误”
  rationale: 源文的语法可使“它们”指偶像，而后接“对于那些敬拜它们的人”；依主要句法与英语审校层保留偶像为主语，同时不进一步解释谬误如何临到敬拜者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“吩咐—劝诫”与“敬拜—跪拜”的并列层次，不增添宗派性解释。
