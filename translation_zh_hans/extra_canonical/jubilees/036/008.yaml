base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/008.yaml
  text: And let each one love his brothers with mercy and righteousness, and let no man desire evil against his brother from now and forever, all the days of your life, so that you may prosper in all your deeds and not be destroyed.
translation:
  language: zh_hans
  text: 各人都要以怜悯和公义爱自己的弟兄们；从今直到永远，在你们一生的日子里，谁也不可对自己的弟兄存心作恶，好使你们在一切所行的事上亨通，不致灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐዱ፡ አሐዱ
  choice: 各人都
  rationale: 逐字有“一个一个”之意，在此表示群体中的每一个人；译作“各人都”自然且保留分配意义。
- source_word: እኅዋሁ
  choice: 他的弟兄们
  rationale: 原文此处为复数，与后文单数“自己的弟兄”形成可见区别。
- source_word: በምሕረት፡ ወበጽድቅ
  choice: 以慈爱和公义
  rationale: 分别保留“怜悯/慈爱”与“正义/公义”两个并列概念；“慈爱”较适合此处兄弟相爱的关系语境。
- source_word: ወኢይፈቅድ፡ ብእሲ፡ እኩየ
  choice: 谁也不可图谋恶事
  rationale: 动词本义可涉及意愿、欲求；与“恶事害弟兄”搭配时，“图谋”准确传达蓄意求害，而不把它弱化为一般情绪。
- source_word: ከመ፡ ትሠርሑ
  choice: 好使……亨通
  rationale: 依英语校勘层及上下文取结果/兴盛之义，以现代汉语表达行为顺遂。
- source_word: ወኢትትሐጐሉ
  choice: 不致灭亡
  rationale: 保留原文强烈的毁灭、败亡结果，不弱化为“失败”或“受挫”。
theological_decisions:
- issue: “从今直到永远”与“一生的日子里”的关系
  choice: 两者并列保留
  alternative: 将“永远”解释为仅指终身
  rationale: 原文同时出现永远性措辞和“你们一生的日子”；译文保留这种张力，不替作者消解。
- issue: 兄弟之爱的对象范围
  choice: 直译为“弟兄们/弟兄”
  alternative: 泛化为“众人/别人”
  rationale: 原文明确使用亲属或共同体称谓，不在翻译中扩展为普遍人类范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谁也不可”自然表达否定的不定主语；“一生的日子里”略带经文语体，同时仍易于普通读者理解。
