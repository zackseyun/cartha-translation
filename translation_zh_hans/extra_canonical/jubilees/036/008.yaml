revisions:
- from: 各人都要以慈爱和公义爱他的弟兄们；从今直到永远，你们一生的日子里，谁也不可图谋恶事害自己的弟兄[a]，好使你们所做的一切都亨通，不致灭亡。
  to: 各人都要以怜悯和公义爱自己的弟兄们；从今直到永远，在你们一生的日子里，谁也不可对自己的弟兄存心作恶，好使你们在一切所行的事上亨通，不致灭亡。
  rationale: 修订仅处理汉语搭配、词义区分和不必要的脚注，不改变原文的复数“弟兄们”与后文单数“弟兄”的区别，也保留时间短语的并置及末句的结果/目的关系。
