  text: he divided the days of his generation. And Leah his wife died in the fourth year of the second week of the forty-fifth jubilee[21], and he buried her in the double cave near Rebekah his mother,
translation:
  language: zh_hans
  text: 他划分了自己一生的年日。[a]他的妻子利亚死于第四十五个禧年的第二个七年期第四年；他把她葬在双重洞穴里，靠近他母亲利百加。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己一生的年日”也可较直地译作“自己出生（或世代）的日子”。这句话可能承接上一节。
    reason: 保留原文短语的词义歧义，并提示分节衔接问题。
  - marker: b
    text: “双重洞穴”对应《创世记》传统中先祖安葬的麦比拉洞。
    reason: 提供相关经文传统的互文说明。
lexical_decisions:
- source_word: ፈለጠ
  choice: 划分了
  rationale: 该动词在此取“分开、划分”义，避免采用缺乏词汇依据的“查明、探究”。
- source_word: መዋዕለ፡ ልደቱ
  choice: 自己一生的年日
  rationale: 直译涉及“出生／世代的日子”，中文如此表达晦涩；“一生的年日”保留其指向生命历程的含义，具体歧义另见脚注。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 指禧年纪年体系中的一个七年周期，以清楚的现代汉语表达。
- source_word: በዓተ፡ ዘእንተ፡ ክልኤ
  choice: 双重洞穴
  rationale: 按字面保留“双重／两个”的称谓，不直接以传统专名“麦比拉洞”替换正文。
- source_word: ቅሩበ
  choice: 靠近
  rationale: 保留原文的空间关系，不将其扩展为“葬在旁边”等更具体的解释。
theological_decisions:
- issue: 开头短句与前一节的衔接
  choice: 依本节所给文本独立译出，不补入主语身份或“正如”等连接语
  alternative: 视为36:20末尾的残留分句，补译为“正如他划分了自己一生的年日”
  rationale: 当前分节材料仅含该短句；忠实呈现其措辞，同时不凭上下文擅自补足连接成分。
- issue: “双重洞穴”的传统认定
  choice: 正文保留字面称谓，脚注说明其与《创世记》传统中的麦比拉洞相对应
  alternative: 正文直接译作“麦比拉洞”
  rationale: 原文此处并未使用麦比拉这一专名；脚注既能提供互文信息，也不抹去原文措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“禧年—七年期—年”的纪年层级明晰；人名按通行中文圣经译名处理。开头保留原文较突兀的动作陈述，并以脚注说明其歧义及可能的跨节衔接。
