lexical_decisions:
- source_word: ልዑል
  choice: 至高者
  rationale: 该词意为“至高者”；原文片段句首承接上文，汉译补出为施惠或眷顾的主体，以形成自然且可理解的句子。
- source_word: ብእሲ
  choice: 人
  rationale: 按普通名词译作“人”，不限定特定身份。
- source_word: ይገብር፡ ጽድቀ
  choice: 行义
  rationale: 直译为“施行公义”，现代汉语经文语体中“行义”简洁而准确。
- source_word: ዘርኦ
  choice: 他的后裔
  rationale: 字面为“他的种子”，此处指人的子孙后代。
- source_word: እስከ፡ ለዓለም
  choice: 永远
  rationale: 表达持续到永世的时间范围。
- source_word: ይኤዝዞሙ
  choice: 吩咐他们
  rationale: 保留命令、嘱咐的动作，不弱化为一般谈话。
- source_word: ይባርኮሙ
  choice: 祝福他们
  rationale: 直接保留祝福的宗教与关系含义。
- source_word: ኅቡረ
  choice: 一同
  rationale: 表示共同聚集、一起进行吃喝。
- source_word: ተፈሥሑ
  choice: 满心欢喜
  rationale: 传达欢欣、喜乐之意，并使现代汉语表达自然。
theological_decisions:
- issue: 句首“至高者”与残缺谓语的关系
  choice: 译作“必永远蒙至高者眷顾”
  alternative: 保留残句：“至高者，那行义的人，他和他的后裔直到永远”
  rationale: 所给吉兹文从跨页或跨节句中截取，句首“至高者”显然承接前文谓语结构。为使本节可读，依据英语审校层所反映的整体意思补入中性的“眷顾”，但不具体限定为拯救、赐福或保护。
- issue: “义”的性质
  choice: 行义
  alternative: 行公义／称义
  rationale: 原文描述人的行为，不宜译成具有特定教义含义的“称义”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文首句在所给原文中属于承上残句，因此以最少量语义补足处理；末尾逗号保留其与下一节连续的句法关系。
