revisions:
- from: “我的孩子们，要记念主，就是你们祖先亚伯拉罕的上帝；也要记得我怎样敬拜他，以公义和喜乐事奉他，好使他使你们增多，使你们的后裔多如天上的繁星，并把你们栽种在地上，成为公义的栽种，世世代代、直到永远也不被拔除。”
  to: “我的孩子们，要记念主，就是你们祖先亚伯拉罕的上帝；也要记得我怎样敬拜他〔a〕，又怎样以公义和喜乐事奉他，好使他使你们增多，使你们的后裔多如天上无数的星辰，又把你们栽种在地上，成为公义的栽种，世世代代、直到永远不被拔除。”
  rationale: 修订不改变英文本审校轨迹所采用的“我敬拜他，并事奉他”的理解；增设脚注以透明处理现存吉兹词形的疑难。另以“又怎样”明确两个动作的并列关系，并微调“天上无数的星辰”以完整而自然地表达后裔繁多。
