  yaml_path: translation/extra_canonical/jubilees/036/006.yaml
  text: Remember, my sons, the LORD, the God of Abraham your father; and how I also worshipped him and served him in righteousness and in joy, so that he may multiply you and make your seed numerous like the stars of heaven in multitude, and plant you in the earth as a plant of righteousness that will not be uprooted throughout all generations forever.
translation:
  language: zh_hans
  text: “我的孩子们，要记念主，就是你们祖先亚伯拉罕的上帝；也要记得我怎样敬拜他〔a〕，又怎样以公义和喜乐事奉他，好使他使你们增多，使你们的后裔多如天上无数的星辰，又把你们栽种在地上，成为公义的栽种，世世代代、直到永远不被拔除。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከርዎ
  choice: 要记念……也要记得
  rationale: 该命令支配主及随后关于说话者敬拜、事奉主的内容；中文用两个相应表达自然呈现其延展结构。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 该词是吉兹语中对上帝的尊称；译作“主”既庄重，也符合经文语域。
- source_word: አቡክሙ
  choice: 你们祖先
  rationale: 语境中的亚伯拉罕是后代的先祖；“祖先”比现代汉语的“父亲”更不易造成直系生父的误解。
- source_word: አምላክየ
  choice: 我怎样敬拜他
  rationale: 现存词形疑有文本讹误；依上下文及校勘传统理解为“我敬拜他”，同时不与后面的“事奉”合并。
- source_word: ተቀነዩኩ፡ ሎቱ
  choice: 事奉他
  rationale: 该动词在此表达服事、侍奉，译作“事奉”符合宗教语境且区别于“敬拜”。
- source_word: በጽድቅ፡ ወበፍሥሓ
  choice: 以公义和喜乐
  rationale: 保留两个并列的方式状语，不将“公义”弱化为一般道德上的“正直”。
- source_word: ዘርአክሙ
  choice: 你们的后裔
  rationale: “种子”在此为集合性后裔隐喻；现代汉语以“后裔”最清楚。
- source_word: ተክለ፡ ጽድቅ
  choice: 公义的栽种
  rationale: 保留源文“栽种/植物”的名词性意象，并与前面的“栽种你们”形成呼应。
- source_word: ዘኢይሤረዉ
  choice: 不被拔除
  rationale: 准确保留植物意象及被动含义。
theological_decisions:
- issue: “敬拜”与“事奉”是否应合并
  choice: 分别译为“敬拜他……事奉他”
  alternative: 合并为“忠于他”或仅译“事奉他”
  rationale: 源文在校勘理解下包含两个动作；分别翻译可避免遗漏，也不人为消解两者的语义区别。
- issue: 增多、繁衍和栽种的施事者
  choice: 以“他”为施事者，指前述的主
  alternative: 译成不明确主语的愿望句
  rationale: 目的句中的动词形式和上下文自然指向上帝的赐福行动。
- issue: “公义的栽种”的身份含义
  choice: 保留比喻，不解释为特定群体或教义身份
  alternative: 释译为“公义的民族/子民”
  rationale: 源文使用栽种意象；直保其张力可避免加入原文没有明说的神学限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“记念”保留圣经语体，“事奉”用于宗教语境；其余句法尽量现代化。对疑似讹误的 አምላክየ 依据上下文与校勘传统译作“我怎样敬拜他”，但不另设脚注，因为正文已采用最可能的源文读法。
