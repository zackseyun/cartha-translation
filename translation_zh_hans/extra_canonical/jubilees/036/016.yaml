  text: And my heart has rejoiced concerning the birthright, that you did not do violence concerning it. May the LORD bless you
translation:
  language: zh_hans
  text: 我的心也因长子的名分而欢喜，因为你没有在这名分的事上施行强暴。[a]愿耶和华赐福给你！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你没有因这名分施行强暴。”
    reason: 该介词短语可按“关于这名分”或“因为这名分”理解；正文采用较明确的前者。
  - marker: b
    text: 原文末句较简略，也可译作：“愿耶和华赐福！”
    reason: “给你”依直接对受话者祝福的语境补明。
lexical_decisions:
- source_word: ልብየ
  choice: 我的心
  rationale: 直译为“我的心”，在此指说话者内在的喜悦与欣慰。
- source_word: ልህቃን
  choice: 长子的名分
  rationale: 依本节语境及传本文义，指长子所享有的身份和权利；译作“长子的名分”比单说“长子权”更自然庄重。
- source_word: ፁገ
  choice: 强暴
  rationale: 保留其暴力、侵害之意，不弱化为一般的“争执”或“过错”。
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 采用现代中文圣经语体中对神圣名号的常见译法；原文没有“至高者”，故不增译。
theological_decisions:
- issue: 否定动词的施事者
  choice: 你没有……行强暴
  alternative: 没有人为这事行强暴
  rationale: 原文ኢትግበር为第二人称阳性单数的否定主动形式，应让受话者作主语，不改成被动或无人称表达。
- issue: 末句祝福的受词
  choice: 愿耶和华赐福给你
  alternative: 愿耶和华赐福
  rationale: 上下文是直接对受话者祝福，译出“给你”使中文完整；但原文形式较简略，因此以脚注说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“为这事行强暴”保留原文较强的伦理措辞；结尾用感叹号呈现祝福语气。
