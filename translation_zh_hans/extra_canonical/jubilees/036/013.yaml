  text: And he said, “I give this greater share to the man who was born first.”
translation:
  language: zh_hans
  text: 他说：“我把这较大的一份给那先出生的男子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ
  choice: 我……赐给
  rationale: 按第一人称未完成式直译为“我给／我赐给”；语境是郑重分配份额，因此用“赐给”保持庄重而不显生硬。
- source_word: ዕበየ
  choice: 较大的一份
  rationale: 该词表达“大、较大”的意思；结合分配语境，以“较大的一份”自然传达比较意义，并避免抽象的“更大份额”。
- source_word: ለብእሲ
  choice: 给……的人
  rationale: 明确保留“人／男子”的名词含义；现代汉语中此处译作“人”最自然，无须额外突出性别。
- source_word: ዘውእቱ ቀደመ ተወልደ
  choice: 那先出生的人
  rationale: 依次保留关系结构、“先／首先”和“出生”的含义；不直接改译为“长子”，以免加入原文未明确表达的身份术语。
