  text: to the left of the grave of Sarah, his father’s mother. And all her sons and his sons came to mourn Leah his wife with him and to comfort him for her, because he was grieving for her.
translation:
  language: zh_hans
  text: 在撒拉——他父亲的母亲——的坟墓左边。她所有的儿子和他的儿子都来与他一同哀悼他的妻子利亚，并为她的缘故安慰他，因为他正为她悲痛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በፀጋመ
  choice: 在……左边
  rationale: ፀጋም明确表示“左边、左侧”，保留原文具体的方位，不泛化为“旁边”。
- source_word: ውሉዳ፡ ወውሉዱ
  choice: 她所有的儿子和他的儿子
  rationale: 依照原文两个带不同所属后缀的并列形式，保留“她的”与“他的”之区分；在此家谱语境中译作“儿子”比泛称“孩子”更贴切。
- source_word: ይብክይዋ
  choice: 哀悼
  rationale: 该词表示为死者哭泣、举哀；“哀悼”自然表达丧葬语境中的动作。
- source_word: ይናዝዝዎ
  choice: 安慰他
  rationale: 准确表达因丧亲而给予慰藉之意。
- source_word: ይሳቀዮ
  choice: 正为她悲痛
  rationale: 该词可指受苦、痛苦；结合妻子去世及众人前来安慰的语境，译为“悲痛”最自然，同时未加入额外神学解释。
