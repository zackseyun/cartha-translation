  yaml_path: translation/extra_canonical/jubilees/036/007.yaml
  text: And now I make you swear by a great oath, for there is no oath greater than it, by the glorious and honorable and great and splendid and marvelous and mighty name of him who made the heavens and the earth and all things together, that you may be those who fear him and those who worship him.
translation:
  language: zh_hans
  text: 现在，我要你们凭大誓起誓，因为没有比这更大的誓：要凭那创造诸天、大地和万物全体的那一位荣耀、尊贵、伟大、辉煌、奇妙而强大的名起誓，好叫你们成为敬畏他、敬拜他的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምሕለክሙ፡ በመሐላ፡ ዐቢይ
  choice: 我要你们凭一个大誓起誓
  rationale: 保留使役性的“使你们起誓”以及“大誓”的强调，用现代汉语自然表达。
- source_word: በስም፡ ስቡሕ፡ ወክቡር፡ ወዐቢይ፡ ወስፉሕ፡ ወመንክር፡ ወኀያል
  choice: 凭……那荣耀、尊贵、伟大、辉煌、奇妙而有力的名
  rationale: 逐项保留六个并列修饰语及“凭名起誓”的结构；“有力”对应表示强大、有能力的词，避免擅自改为专门神学称号。
- source_word: ዘገብረ፡ ሰማያተ፡ ወምድረ
  choice: 那位创造诸天、大地……的主
  rationale: 以关系结构表达“那位创造……者”；补出“主”使长串定语在汉语中清楚落脚，所指仍为前述之神。
- source_word: ወኵሎ፡ ኅቡረ
  choice: 和万有
  rationale: 表达“一切之总和／万物合在一起”；“万有”简洁涵盖整体意义，避免较生硬的“所有事物一起”。
- source_word: ከመ፡ ትኩኑ፡ እለ፡ ትፈርህዎ፡ ወእለ፡ ታመልከዎ
  choice: 好叫你们成为敬畏他、敬拜他的人
  rationale: 保留目的或结果意味，并维持“敬畏”与“敬拜”两个并列行动。
theological_decisions:
- issue: 誓言所凭的是神的名还是直接凭神起誓
  choice: 凭……的名起誓
  alternative: 凭那位创造者起誓
  rationale: 原文明确以“名”为誓言所凭，不应省略，以免消解其古代宗教语境。
- issue: 连接词ከመ所表达的目的／结果张力
  choice: 好叫你们成为
  alternative: 使你们成为／为要使你们成为
  rationale: “好叫”保留目的兼结果的开放性，不把句义限定为命令、预言或单纯愿望。
- issue: “敬拜”所指的礼敬强度
  choice: 敬拜他
  alternative: 侍奉他／向他下拜
  rationale: 此处与“敬畏”并列，语境指向宗教性的崇敬；“敬拜”自然且不额外引入宗派含义。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。保留原文层叠的神名修饰语和誓言句式，同时用冒号和定语结构控制长句。正文没有脚注标记，因此不设脚注。
