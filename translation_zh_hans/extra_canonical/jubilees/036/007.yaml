revisions:
- from: 现在，我要你们凭一个大誓起誓，因为没有比这更大的誓：凭那位创造诸天、大地和万有的主那荣耀、尊贵、伟大、辉煌、奇妙而有力的名起誓，好叫你们成为敬畏他、敬拜他的人。
  to: 现在，我要你们凭大誓起誓，因为没有比这更大的誓：要凭那创造诸天、大地和万物全体的那一位荣耀、尊贵、伟大、辉煌、奇妙而强大的名起誓，好叫你们成为敬畏他、敬拜他的人。
  rationale: 删除原文没有的“主”，以“那一位”保留关系指称；将“万有”改为“万物全体”，表达原文“all things together”的整体含义。其余保留正式、自然的现代汉语誓言句式及目的从句的开放语气。
