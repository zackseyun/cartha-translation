  to: 愿至高的上帝将他赐给我的一切福分，以及他赐给挪亚和亚当的福分，都赐给你。愿这些福分安歇在你后裔圣洁的头上，直到永远，历经所有世代。[a]
  rationale: 修订首句以准确、自然的中文表达上帝分别赐给说话者、挪亚和亚当的福分，并保留这些福分再赐给受祝福者的祈愿结构。第二句恢复“安歇在……头上”的意象；将“所有世代”置入正文，避免原有脚注所补的原文量化信息在译文中未显明。
