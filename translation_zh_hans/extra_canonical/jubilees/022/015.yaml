  yaml_path: translation/extra_canonical/jubilees/022/015.yaml
  text: May the Most High God give you all the blessings with which he blessed me and with which he blessed Noah and Adam. May they rest upon the holy head of your offspring for all generations and forever.
translation:
  language: zh_hans
  text: 愿至高的上帝将他赐给我的一切福分，以及他赐给挪亚和亚当的福分，都赐给你。愿这些福分安歇在你后裔圣洁的头上，直到永远，历经所有世代。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“世世代代，直到永远”。
    reason: 原文直陈“所有世代”和“直到永远”；正文以“历经所有世代”显明量词，脚注提供较自然的汉语习语式表达。
lexical_decisions:
- source_word: አምላከ፡ ልዑል
  choice: 至高的上帝
  rationale: 直译其称号，同时采用现代汉语中自然、庄重的表达。
- source_word: ኵሎን፡ በረከታተ
  choice: 一切福分
  rationale: 保留“全部”的明确量化含义，并以中文常用搭配表达复数祝福。
- source_word: ያዕርፉ፡ ዲበ
  choice: 临到……上
  rationale: 原义为“安息、停留在……之上”；在祝福语境中译作“临到”较自然，也保留福分落在后裔身上的意象。
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: 该词可指种子、子孙或后代；此处显然关乎历代子孙，“后裔”准确且庄重。
- source_word: ድማኅ፡ ቅዱስ
  choice: 圣洁的头
  rationale: 保留原文具体的身体意象和形容词，不将其泛化为“圣洁的后裔”。
- source_word: ለኵሉ፡ ትውልደ፡ ትውልድ
  choice: 世世代代
  rationale: 自然表达历代延续；脚注补明原文含有“所有”的量化意味。
- source_word: ወእስከ፡ ለዓለም
  choice: 直到永远
  rationale: 准确传达持续至永恒的时间范围，并与前面的世代措辞区分。
theological_decisions:
- issue: 福分是上帝直接再赐，还是先前福分继续落在后裔身上
  choice: 首句用“赐给你”，次句以“这些福分临到”承接
  alternative: 把两句合并为上帝直接赐福后裔
  rationale: 保留原文先祈求上帝赐下福分、再祈愿这些福分落在后裔头上的双重结构，不消除其祝福传承的意象。
- issue: “圣洁”修饰“头”还是泛指后裔
  choice: 按词序译为“后裔圣洁的头”
  alternative: 译为“你圣洁的后裔”
  rationale: 原文明确保留“头”的名词意象；不以神学解释替代文本表述。
translation_notes:
  register: 采用现代、庄重且易懂的祝福语体。“就是”解释性承接两组关系从句，避免中文长句生硬；保留“后裔圣洁的头上”这一略具古典色彩但重要的原文意象。
