  yaml_path: translation/extra_canonical/jubilees/022/007.yaml
  text: And he ate and drank, and blessed the Most High God, who created heaven and earth, who made all the produce of the earth, and gave it to the children of men to eat and drink and bless their Creator.
translation:
  language: zh_hans
  text: 他吃了，喝了，并称颂至高的上帝。这位上帝创造了天地，造了地上一切的出产，并将这些赐给世人，使他们吃、喝，并称颂他们的创造主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ / ይባርኩ
  choice: 称颂
  rationale: 此处受词是上帝或创造主，语境表示人向上帝献上赞美与祝颂；“称颂”比现代汉语中可能含有由尊向卑意味的“祝福”更自然准确。
- source_word: አምላክ፡ ልዑል
  choice: 至高的上帝
  rationale: 保留“上帝”与“至高”两个语义成分，并采用自然的现代汉语定中结构。
- source_word: ሰማየ፡ ወምድረ
  choice: 天地
  rationale: 简洁对应“天与地”，也是现代汉语庄重文体中的惯常表达。
- source_word: ኵሎ፡ ስብሐ፡ ምድር
  choice: 地上出产万物
  rationale: ስብሐ 字面可涉及“丰美、肥美”，但此处指土地供人吃喝的丰饶产物；译作“出产万物”既体现土地的丰盛，也符合上下文。
- source_word: ውሉደ፡ ሰብእ
  choice: 世人
  rationale: 字面为“人的儿女/人类的子孙”，在此泛指人类；“世人”自然凝练，不额外限定血统或世代。
- source_word: ፈጣሪሆሙ
  choice: 他们的创造主
  rationale: 保留第三人称复数领属关系及“创造者”称号；“创造主”符合庄重而通俗的汉语宗教表达。
theological_decisions:
- issue: 人称颂上帝与上帝赐下地上出产之间的关系
  choice: 保留“让他们吃喝、称颂他们的创造主”这一并列目的结构
  alternative: 译成“使他们因吃喝而感谢创造主”
  rationale: 原文将吃、喝、称颂并列，未明确说明称颂只是吃喝所引发的结果；译文不增添因果解释。
- issue: “至高”所修饰的范围
  choice: 译为“至高的上帝”
  alternative: 译为“至高者上帝”或将“至高者”处理成独立称号
  rationale: 原文中“至高”紧随“上帝”，最自然地构成称号性修饰；本译法不引入额外的位格或称号区分。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。以“又”连接连续动作，以“就是那……”展开对至高上帝的说明；避免过度文言化，也不把原文的并列目的关系改写成明确因果关系。
