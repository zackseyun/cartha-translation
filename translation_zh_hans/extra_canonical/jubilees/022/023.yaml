  yaml_path: translation/extra_canonical/jubilees/022/023.yaml
  text: For because of the transgression of Ham, Canaan erred, and all his seed will be destroyed from the earth; and there will be no remnant from him, nor anyone who escapes, on the day of judgment.
translation:
  language: zh_hans
  text: 因为含的过犯，迦南犯了罪；他所有的后裔都将从地上被除灭。到审判之日，他的后裔中必无余民，也没有一人能逃脱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አበሳ
  choice: 过犯
  rationale: 该词在此指应受责罚的罪责或违犯；“过犯”既保留道德与法律意味，也符合庄重的经文语体。
- source_word: ስሕተ
  choice: 犯了错
  rationale: 源词表达偏离、失误或犯罪；此处用“犯了错”保留其较宽泛的含义，不把它过度限定为某一种罪。
- source_word: ዘርአ
  choice: 后裔
  rationale: 原义为“种子、子孙”；在人类谱系语境中译作“后裔”自然准确。
- source_word: ይደመሰስ
  choice: 被除灭
  rationale: 表达彻底毁灭或抹除；“被除灭”保持原文的强烈程度及被动意味。
- source_word: ተረፉ
  choice: 余民
  rationale: 指灾祸或审判后留下的人；“余民”简洁地传达残存者之义。
- source_word: ዘይድኅን
  choice: 能逃脱
  rationale: 在审判语境中表示得以脱身、幸免；译作“能逃脱”比宽泛的“得救”更贴合此句的平行结构。
- source_word: ደይን
  choice: 审判
  rationale: 该词指司法性的裁决；“审判之日”是准确且自然的表达。
theological_decisions:
- issue: 含的过犯与迦南犯错之间的关系
  choice: 因为迦南因含的过犯而犯了错
  alternative: 因为含的过犯，迦南犯了错
  rationale: 原文连续使用因果标记及属格关系，可理解为含的过犯构成迦南犯错的背景或原因。采用双重“因”略显紧密，却明确保留原文因果层次，不另行解释责任如何传递。
- issue: 审判中无人幸免的范围
  choice: 他将没有余民，也没有一人能逃脱
  alternative: 他将没有余民，也没有得救的人
  rationale: “他”承接迦南，并包括其后裔谱系；译文保留绝对性的措辞，同时不把“逃脱”扩展解释为特定的救恩教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话经文语体。保留“含—迦南—后裔”的因果与谱系关系，并以分号呈现毁灭宣告和审判日结果之间的推进。无脚注标记。
