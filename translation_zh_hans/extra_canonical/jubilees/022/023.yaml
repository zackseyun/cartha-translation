- from: 因为迦南因含的过犯而犯了错，他所有的后裔都将从地上被除灭；到审判之日，他将没有余民，也没有一人能逃脱。
  to: 因为含的过犯，迦南犯了罪；他所有的后裔都将从地上被除灭。到审判之日，他的后裔中必无余民，也没有一人能逃脱。
  rationale: 修订消除了汉语中重复的因果结构，并明确末句“余民”和“逃脱者”属于迦南的后裔范围。保留原文的严厉审判语言、因果关联及其未具体说明的罪责性质；未增添任何关于责任归属或救恩教义的解释。
