  yaml_path: translation/extra_canonical/jubilees/022/029.yaml
  text: And he blessed him with all his heart and said, “The Most High God, the God of all and Creator of all, who brought me out from Ur of the Chaldeans to give me this land as an everlasting possession, and that I might establish a holy seed—may the Most High be blessed forever.”
translation:
  language: zh_hans
  text: 他全心全意地祝福他，说：“至高的上帝，万有的上帝、万有的创造主，曾领我离开迦勒底人的吾珥，为要把这地赐给我作永远的产业，也使我得以兴起圣洁的后裔[a]——愿至高者永远受颂赞！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“并让我兴起圣洁的后裔”。
    reason: 原文的目的连接词可理解为承接前一目的分句；两种译法都保留第一人称“我”为“兴起”的主语。
lexical_decisions:
- source_word: በኵሉ፡ ልቡ
  choice: 全心
  rationale: 直译为“以他的全心”，在现代汉语中以“全心”简洁保留祝福出于整个内心的含义。
- source_word: አምላከ፡ ልዑል
  choice: 至高的上帝
  rationale: 保留“上帝”与“至高”这一称号的组合，并与句末单独出现的“至高者”相区别。
- source_word: አምላከ፡ ኵሉ፡ ወፈጣሪ፡ ኵሉ
  choice: 万有的上帝、万有的创造主
  rationale: 两次保留“万有”，体现原文的重复和并列称号，不将其压缩为单一称谓。
- source_word: ኡር፡ ዘከለዳውያን
  choice: 迦勒底人的吾珥
  rationale: 采用通行的圣经地名译法，并保留原文属格结构。
- source_word: ምድረ፡ አርስ፡ ለዓለም
  choice: 这地……作永远的产业
  rationale: 将“产业之地”按自然汉语表达，同时保留永久占有或承受的概念。
- source_word: አቅም፡ ዘርአ፡ ቅዱሰ
  choice: 使我得以兴起圣洁的后裔
  rationale: 动词为第一人称单数，主语转为说话者；“兴起”兼顾建立、使之延续的语义，“后裔”符合 זרע/“种子”在谱系语境中的惯用义。
- source_word: ይትባረክ፡ ልዑል
  choice: 愿至高者……受颂赞
  rationale: 保留原文句末再次明说“至高者”，不用代词替代；“受颂赞”适合对上帝的庄重祝颂。
theological_decisions:
- issue: “兴起圣洁的后裔”的施事者
  choice: 明确由第一人称“我”兴起后裔
  alternative: 理解为上帝“赐下这地并兴起圣洁的后裔”
  rationale: ግዕዝ语 አቅም 是第一人称单数形式，显示此处主语从上帝转为说话者；译文以“使我得以”保留上帝赐予条件与说话者承担行动之间的张力。
- issue: 句末祝颂的所指
  choice: 愿“至高者”永远受颂赞
  alternative: 愿“他”永远受颂赞
  rationale: 原文明示并重复 ልዑል，不宜以代词淡化这一称号及其修辞呼应。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与祝颂语体。“全心”为自然汉语；称号中的“万有”予以重复，以保留原文节奏。长句用破折号引出最终祝颂，避免误把末句当作前面关系从句的一部分。
