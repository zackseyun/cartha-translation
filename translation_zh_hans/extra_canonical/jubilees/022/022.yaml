  text: Take heed, my son Jacob, that you do not take a wife from any of the seed of the daughters of Canaan, for all his seed is to be uprooted from the earth.
translation:
  language: zh_hans
  text: “我儿雅各，你要谨慎，不可娶迦南女子后裔中的任何女子为妻，因为迦南的所有后裔都要从地上被连根拔除。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要从地上被除灭。”
    reason: 原词既可突出“连根拔除”的形象，也可表达彻底消灭的结果。
lexical_decisions:
- source_word: ተዐቀብ
  choice: 你要谨慎
  rationale: 该词是警戒性的命令，意为“当心、谨慎、自守”；“你要谨慎”符合现代汉语的庄重劝诫语气。
- source_word: አትንግእ፡ ብእሲተ
  choice: 不可……娶……为妻
  rationale: 原文表达“不可取一个女子/妻子”，按汉语婚姻用语自然译为“不可娶……为妻”。
- source_word: እም፡ ኵሉ፡ ዘርአ፡ አዋልደ፡ ከናአን
  choice: 迦南女子的任何后裔
  rationale: 尽量保留原文“迦南众女子的后裔/种”的层叠表达；“任何”体现否定句中 ኵሉ 的周遍含义。
- source_word: ለሥራዊ፡ እምድር
  choice: 要从地上被连根拔除
  rationale: ሥራዊ 所属词根带有拔根、根除之意；“连根拔除”保留与“地上”相呼应的农业意象，并表达彻底除灭。
theological_decisions:
- issue: 末句所指的后裔
  choice: 迦南的后裔
  alternative: 他的后裔
  rationale: 原文代词式关系可按“他的后裔”理解，所指为迦南；正文明确重复“迦南”，避免现代汉语中“他”指代不清，但不改变所指。
- issue: ሥራዊ 的意象与结果
  choice: 被连根拔除
  alternative: 从地上毁灭
  rationale: 选择保留原文可能具有的拔根意象，同时以脚注注明结果性译法，避免把词义限定为单纯的物理拔根。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“我儿雅各”保留亲属称呼和直接呼语；末句用被动结构维持原文审判宣告的力度。
