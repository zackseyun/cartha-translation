    issue: “不可娶迦南女子的任何后裔为妻”缺少对可婚配对象为女子的明确限定。
    rationale: 该表述按现代汉语可理解为“娶任何后裔”，而“后裔”不限性别；原文的“娶妻”结构要求所指为女子。改为“迦南女子后裔中的任何女子”既保留原文的族属／后裔表达，也使句法和语义完整。
  - severity: low
