  yaml_path: translation/extra_canonical/jubilees/022/008.yaml
  text: And now I thank you, my God, because you have shown me this day. Behold, I am one hundred seventy-five years old, advanced and complete in days, and all my days have been peace.
translation:
  language: zh_hans
  text: 现在，我感谢你，我的上帝，因为你让我看见了这一天。看哪，我已经一百七十五岁，年事已高，寿数已足；我一生的岁月都平安度过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትኃነይ፡ ለከ
  choice: 我感谢你
  rationale: 按语境表达向上帝感恩，现代汉语自然简洁。
- source_word: አርአይከኒ፡ ዛተ፡ ዕለተ
  choice: 你让我看见了这一天
  rationale: 保留原文“使我看见这一天”的具体意象，不改写为较抽象的“让我活到今天”。
- source_word: ናሁ
  choice: 看哪
  rationale: 保留提示听者注意的庄重话语标记。
- source_word: ወልደ፡ ፻ወ፸ወ፭ ክረምት
  choice: 我已经一百七十五岁
  rationale: 以现代汉语年龄表达准确传达原文年数。
- source_word: አሂቅ፡ ወፍጹመ፡ መዋዕል
  choice: 年事已高，寿数已足
  rationale: 分别传达年迈与日子圆满的并列含义，并采用自然、庄重的中文措辞。
- source_word: ወኵሉ፡ መዋዕልየ፡ ኮናኒ፡ ሰላመ
  choice: 我一生的岁月都平安度过
  rationale: 既保留“我所有的日子”与“平安”的陈述，也避免生硬直译为“我的日子成了平安”。
theological_decisions:
- issue: “看见这一天”的含义
  choice: 保留“你让我看见了这一天”
  alternative: 你让我活到了今天
  rationale: 原文意象可能兼具存活至此和亲历此日之意；正文保留其开放性，不替读者限定解释。
- issue: “寿数已足”的语气
  choice: 寿数已足
  alternative: 日子已经圆满
  rationale: 前者在现代中文中自然表达一生年日臻于完满，又不额外引入死亡已迫近等教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事祷告语体；保留“看哪”的经文风格，同时避免不自然的欧化句式。
