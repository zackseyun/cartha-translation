  yaml_path: translation/extra_canonical/jubilees/022/004.yaml
  text: And in those days Ishmael came to see his father, and the two of them came together; and Isaac slaughtered a sacrifice as a thank offering and offered it on the altar that his father had made in Hebron.
translation:
  language: zh_hans
  text: 在那些日子，以实玛利来探望他的父亲；兄弟二人一同前来。以撒宰杀了一只祭牲，作为感恩祭献在他父亲在希伯仑所筑的祭坛上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይርአይ፡ አባሁ
  choice: 探望父亲
  rationale: 字面涉及“看见父亲”，在此叙事语境中自然表达来访、看望之意。
- source_word: ክልኤሆሙ፡ ኅቡረ
  choice: 兄弟二人相聚
  rationale: 原文为“他们二人一同/相聚”；依上下文所指为以实玛利和以撒，补出“兄弟”可避免误解为以实玛利与父亲，同时保留二人相聚的意思。
- source_word: መሥዋዕተ፡ ለጽንሓሕ
  choice: 一只祭牲作为感恩祭
  rationale: 保留宰杀祭牲与祭物用途两层意义；“感恩祭”自然对应源文所表达的感谢、称谢性质。
- source_word: ዲበ፡ ምሥዋዕ፡ አቡሁ፡ ዘገብረ
  choice: 在他父亲……所筑的祭坛上
  rationale: 按原文关系从句，祭坛的建造者是以撒的父亲；中文以“所筑”简洁呈现。
theological_decisions:
- issue: “他们二人”所指对象
  choice: 译作“兄弟二人”，指以实玛利与以撒
  alternative: 译作“他们二人”，可能被理解为以实玛利与其父亲
  rationale: 紧接下文由以撒献祭，且英语审校层也明确理解为两兄弟相聚；显明所指有助于现代中文读者正确把握叙事。
- issue: 祭物的性质
  choice: 感恩祭
  alternative: 平安祭或感谢祭
  rationale: 不引入后世宗派性祭礼分类；“感恩祭”既表达称谢用途，也保持一般性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“宰了一只祭牲”比“宰杀一个祭物”自然；“所筑”略带经文庄重感，但仍属现代标准汉语。
