  yaml_path: translation/extra_canonical/jubilees/022/019.yaml
  text: They sacrifice their sacrifices to the dead, and they worship demons, and they eat in the graves[19], and all their works are vanity and emptiness.
translation:
  language: zh_hans
  text: 他们宰杀祭物献给死人，敬拜鬼魔，又在坟墓里吃东西[a]；他们所做的一切都是虚妄和空虚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在坟墓里吃东西”可能是指与丧葬或招魂活动有关的祭宴。
    reason: 说明可能的古代文化背景，同时不将原文未明确界定的仪式性质写入正文。
lexical_decisions:
- source_word: መሥዋዕቶሙ፡ ... ይዘብሑ
  choice: 宰杀祭物
  rationale: 保留“祭物”与“宰杀、献祭”的祭祀语义，同时避免生硬重复为“献上他们的祭物”。
- source_word: ለአብድነት
  choice: 献给死人
  rationale: 依该版本所反映的受祭对象译作“死人”，并保留原文对死者祭祀的直接陈述。
- source_word: አጋንንት
  choice: 邪灵
  rationale: 该词指鬼魔一类的灵体；“邪灵”是现代汉语中自然、庄重且不过度附加后世形象的表达。
- source_word: በውስተ፡ መቃብራት፡ ይበልዑ
  choice: 在坟墓里吃食
  rationale: 按方位词的字面意义保留“在……里面”，不改译为“坟墓上”或泛化为“墓地旁”；“吃食”保留原文仅言进食。
- source_word: ከንቱ፡ ወበከ
  choice: 虚妄空洞
  rationale: 以两个相近而不完全相同的词保留原文并列的否定性评价，中文则合为自然的谓语结构。
theological_decisions:
- issue: 对死者献祭与敬拜邪灵之间的关系
  choice: 保留为两个并列行为
  alternative: 将二者解释为同一类招魂或鬼神崇拜
  rationale: 原文用并列结构陈述，未明确说明二者完全等同，因此不在正文中作神学合并。
- issue: 坟墓中的进食性质
  choice: 正文只译“在坟墓里吃食”
  alternative: 正文明确译成“举行丧葬宴席”或“行招魂仪式”
  rationale: 原文没有明说仪式的具体性质；可能的丧葬或招魂背景仅置于脚注，以保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文连续并列的谴责语气；不用宗派化术语，也不把文化推测写入正文。
