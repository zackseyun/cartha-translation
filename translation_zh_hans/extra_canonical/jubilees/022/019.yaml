  rationale: 修订仅改善术语精确度和现代汉语表达：以“鬼魔”对应鬼魔类灵体；以“吃东西”保留原文笼统的“吃”；并将末句改为自然的并列评价结构。脚注锚点仍紧随“坟墓里吃东西”，与所说明短语一致。
