  yaml_path: translation/extra_canonical/jubilees/022/025.yaml
  text: Do not fear, my son Jacob, and do not be dismayed, son of Abraham. The Most High God will keep you from corruption, and he will deliver you from every path of error.
translation:
  language: zh_hans
  text: “我儿雅各，不要害怕；亚伯拉罕的儿子啊，不要惊慌。至高的上帝必保护你，使你免受败坏；他必救你脱离一切迷误的道路。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍራህ
  choice: 不要害怕
  rationale: 按否定命令式直译，符合现代汉语劝勉语气。
- source_word: አትደንግፅ
  choice: 不要惊慌
  rationale: 表达因恐惧而震惊、惶惑的含义，并与前句形成自然平行。
- source_word: አምላከ፡ ልዑል
  choice: 至高的上帝
  rationale: 保留“上帝/神”与“至高”构成的称号关系，中文表达自然庄重。
- source_word: ይዕቀብከ
  choice: 必保护你
  rationale: 该动词表示看守、护卫；与后接“免受……”连用，可清楚呈现保护义。
- source_word: ሙስና
  choice: 败坏
  rationale: 保留 corruption 可指道德或整体腐化的语义宽度，不窄化为单纯“毁灭”。
- source_word: ፍኖተ፡ ስሕተት
  choice: 迷误的道路
  rationale: “道路”对应 ፍኖት，“迷误”兼顾错误、偏离之义，也保留其比喻性。
- source_word: ይባልሕከ
  choice: 必救你脱离
  rationale: 按上下文译作解救、搭救，并将前置介词短语自然移至动词之后。
theological_decisions:
- issue: 两个动词与两个介词短语的句法对应
  choice: 将“免受败坏”归于“保护你”，将“脱离一切迷误的道路”归于“救你”
  alternative: 把两个介词短语都归于“保护”，再单独译“他必救你”
  rationale: 原文的平行结构更自然地支持两个动词分别支配相应短语；如此既完整呈现两个动作，也不让第二个动词悬空。
- issue: “败坏”的具体性质
  choice: 保留宽泛的“败坏”
  alternative: 译作“毁灭”或明确限定为“道德腐败”
  rationale: 原词容许较宽的腐坏、败坏含义，语境未要求将其限定为肉体毁灭或专门的道德术语。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。保留“我儿雅各”与“亚伯拉罕的儿子啊”两个呼语的平行和强调；以分号显出保护与拯救两分句的对应关系。
