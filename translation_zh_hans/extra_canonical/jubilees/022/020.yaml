  to: 他们没有心去明白；他们的眼睛看不见自己所造的，也看不见自己对木头说“你是我的神”、对石头说“你是我的主、我的拯救者”时是怎样迷失的。他们没有心。
  rationale: 修订删除原文未明示的“实在”，保留首尾“没有心”的重复；同时重组“迷失”与两句偶像称呼的关系，使其明确表达他们正是在如此称呼木头和石头时迷失。未改变“心”、制造、神、主、拯救者等核心用语。
