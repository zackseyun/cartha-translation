  yaml_path: translation/extra_canonical/jubilees/022/020.yaml
  text: They have no heart to understand, and their eyes do not see what they have made, and how they go astray when they say to wood, ‘You are my god,’ and to stone, ‘You are my lord and my deliverer.’ And they have no heart.
translation:
  language: zh_hans
  text: 他们没有心去明白；他们的眼睛看不见自己所造的，也看不见自己对木头说“你是我的神”、对石头说“你是我的主、我的拯救者”时是怎样迷失的。他们没有心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ለሐልዮ
  choice: 明白的心
  rationale: “心”在此指理解和辨识的内在能力；译作“明白的心”既保留原文意象，也符合现代汉语表达。
- source_word: ምንተ፡ ገብሮሙ
  choice: 自己所造的
  rationale: 按动词“做、制造”的直接意义处理；上下文所指为人手制造的偶像。
- source_word: ይስኅቱ
  choice: 走入迷途
  rationale: 保留“偏离、迷失”的动态含义，不额外限定为道德、礼仪或教义层面的错误。
- source_word: አምላኪየ
  choice: 我的神
  rationale: 采用通常的神称谓，并保留第一人称所属关系。
- source_word: እግዚእየ
  choice: 我的主
  rationale: 准确表达主人、主宰之义，不添加特定宗派含义。
- source_word: መባሕሕየ
  choice: 我的拯救者
  rationale: 表达施行解救者的含义；“拯救者”庄重自然，也不把此处窄化为某一种具体救援。
theological_decisions:
- issue: “没有心”的重复
  choice: 首句译为“没有明白的心”，末句译为“实在没有心”
  alternative: 两处均译为“没有理解力”
  rationale: 保留原文首尾重复及圣经语体中的“心”这一人论意象；末句加入“实在”使汉语收束自然，但不另行解释其神学原因。
- issue: 偶像崇拜者所称的“拯救者”
  choice: 保留为直接引语“我的拯救者”
  alternative: 译为“救我的神”
  rationale: 原文将“主”和“拯救者”并列；直译可保留偶像崇拜者赋予石头的两重称号及其反讽张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“心”“神”“主”“拯救者”等原文核心意象和称谓；通过“自己所造的”凸显制造偶像与敬拜偶像之间的反讽。
