base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/013.yaml
  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
translation:
  language: zh_hans
  text: 他走近雅各，亲吻他，说：“愿我的儿子雅各和他的众子，蒙至高的主赐福，直到万世！愿主赐给你公义的后裔；愿他使你的一些子孙在全地之中成为圣洁[a]。愿列国服侍你，愿万国都在你的后裔面前下拜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“愿他从你的子孙中使人成圣”；动词是主动式，原文没有明说被分别为圣者的数目。“一些”是按“从……中”的部分含义补出。
    reason: 说明原文宾语省略及部分结构，避免把主动动词误解为“他使自己成圣”。
lexical_decisions:
- source_word: ቀርበ
  choice: 走近
  rationale: 准确表达趋近、靠近之意，并符合现代汉语叙事习惯。
- source_word: ቡሩክ
  choice: 蒙……赐福
  rationale: 此处为祝福宣告；以“蒙至高的主赐福”自然表达祝福的施予者，避免误读为雅各归福于主。
- source_word: ዘርአ፡ ጽድቅ
  choice: 公义的后裔
  rationale: 保留“后裔/种子”与“公义”的修饰关系；在人物后代的语境中，“后裔”比字面的“种子”自然。
- source_word: ይቀድስ
  choice: 使……成为圣洁
  rationale: 该动词为主动使役形，而非反身式，表示主使人分别为圣或成为圣洁。
- source_word: ይትቀነዩ
  choice: 服侍
  rationale: 表达臣服、事奉或效力之意；“服侍”既保留从属意味，也不擅自限定为政治统治。
- source_word: ይስግዱ
  choice: 下拜
  rationale: 保留身体俯伏、表示敬服的动作，不把它专门化为宗教敬拜。
theological_decisions:
- issue: 祝福的施予者及祝福期限
  choice: 愿雅各和众子“蒙至高的主赐福，直到万世”
  alternative: 愿雅各和众子归于至高的主，直到万世
  rationale: 原文中“至高的主”最自然地理解为赐福者；同时保留“直到万世”这一时间表达，不将其改写为归属宣言。
- issue: 从子孙中成圣者的范围
  choice: 愿他使“你的一些子孙”成为圣洁
  alternative: 愿他从你的子孙中使人成圣
  rationale: 动词是主动式，排除“使自己成圣”的反身理解；介词“从”可作部分结构，暗示子孙中的一部分，但原文省略了明确宾语，因此以脚注交代补足。
- issue: 列国在后裔面前下拜
  choice: 下拜
  alternative: 敬拜
  rationale: 原词可指俯伏致敬或臣服；“下拜”保留动作及其语义张力，避免未经文本限定便赋予只归于神的敬拜含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“众子”“后裔”“万世”“下拜”保留古代祝福语的尊严感，但避免过度文言化。主文中的脚注标记[a]与脚注完全对应。
