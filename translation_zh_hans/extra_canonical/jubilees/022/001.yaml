base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/001.yaml
  text: And it came to pass in the first week[1], in the forty-fourth jubilee, in the second year of that week—the year in which Abraham died—that Isaac and Ishmael came from the Well of the Oath to celebrate the Feast of Weeks, this feast of the firstfruits of the harvest, with Abraham their father.
translation:
  language: zh_hans
  text: 在第四十四个禧年的第一个七年期的第二年，就是亚伯拉罕去世的那一年，以撒和以实玛利从盟誓井[b]来到他们父亲亚伯拉罕那里，同他一同庆祝七七节，即这收割初熟之物的节期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “盟誓井”通常称为“别是巴”。
    reason: reader_clarity
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期／七七节（依语境）
  rationale: 该词基本义与“七”构成的周期有关；在纪年语境中指七年期，在节期名称中则对应七七节。按两处具体语境分别译出，既清楚又保留原文的词语关联。
- source_word: አርብዓ፡ ወአርባዕቱ
  choice: 第四十四
  rationale: 吉兹文拼写明确为“四十和四”；据此译作第四十四，而不采用旧译“第四十二”。
- source_word: ዐዘቅተ፡ መሐላ
  choice: 盟誓井
  rationale: 按原文地名的字面构成翻译；此地通常对应别是巴。
- source_word: ዘቀዳሚ፡ ማእረር
  choice: 收割初熟之物
  rationale: 字面涉及“收割的首先部分”，在七七节语境中指初熟之物；避免误解成“第一个收割节”。
- source_word: ኀበ፡ አብርሃም፡ አቡሆሙ
  choice: 来到他们父亲亚伯拉罕那里
  rationale: ኀበ表示趋向或所在关系；译为“来到……那里”比直接断定“与……一起”更贴近原文，也保留关系上的轻微含混。
theological_decisions:
- issue: 七七节与初熟之物的关系
  choice: 译作“七七节，也就是这收割初熟之物的节期”
  alternative: “七七节，这第一个收割节”
  rationale: 原文所说的是收割中首先所得之物，而非多个收割节中的第一个节期；当前译法保留节期的农业和礼仪内涵。
- issue: 亚伯拉罕与庆节者的空间或共同参与关系
  choice: “来到他们父亲亚伯拉罕那里”
  alternative: “同他们的父亲亚伯拉罕一起庆祝”
  rationale: 原文介词首先表达趋向或所在，并未毫无歧义地明说亚伯拉罕与他们共同执行庆祝行动，因此不把共同参与解释写死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。纪年信息完整保留，不为流畅而删减；节期名称采用通行的“七七节”，地名则正文保留吉兹文的字面意义，并用脚注说明常见名称。
