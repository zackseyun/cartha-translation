base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/011.yaml
  text: And he called Jacob and said, “My son Jacob, may the God of all bless you and strengthen you to do righteousness and his will before him. And may he choose you and your seed, that you may be for him a people of inheritance according to his will all the days.”
translation:
  language: zh_hans
  text: 他召来雅各，说：“我儿雅各，愿万有之上帝赐福给你，赐你力量，使你在他面前行公义，遵行他的旨意。愿他拣选你和你的后裔，使你们照他的旨意，直到永远作他产业之民。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ኵሉ
  choice: 万有之上帝
  rationale: 直译为“万有的上帝”，以自然庄重的现代汉语表达其统管万有的含义。
- source_word: ያኃይለከ
  choice: 赐你力量
  rationale: 该动词表达使人刚强、赋予能力；结合后接不定式，译作“赐你力量，使你……”最自然。
- source_word: ለገቢረ፡ ጽድቅ
  choice: 行公义
  rationale: 保留“施行/成就公义”的伦理与宗教含义，不窄化为一般的“做好事”。
- source_word: ወፈቃዱ
  choice: 遵行他的旨意
  rationale: 原文与“行公义”并列；汉语补出“遵行”以明确行动关系，同时保留“旨意”的神学语域。
- source_word: ወይኅረይ
  choice: 愿他拣选
  rationale: 保留祈愿语气和“选择、拣选”的核心意义。
- source_word: ብከ፡ ወ'በዘርእከ
  choice: 你和你的后裔
  rationale: 原介词结构在此指拣选的对象；“后裔”比“种子”符合现代汉语族裔延续语境。
- source_word: ሕዝበ፡ ዘርስት
  choice: 产业之民
  rationale: 保留“民”与“产业/承受之业”的结合，避免将其解释性地限定为神拥有人民或人民承受土地中的某一种。
- source_word: በኵሉ፡ መዋዕለ
  choice: 世世代代
  rationale: 字面意为“所有的日子”；在祝福后裔的语境中，译作“世世代代”自然地表达持续历代之意。
theological_decisions:
- issue: “产业之民”中产业关系的方向
  choice: 保留“作他产业之民”的凝练表达
  alternative: 作承受产业的民／作归他为业的民
  rationale: 原文组合可承载归属与承受产业的关联；正文不单向消解这种张力。
- issue: “拣选”的对象及结果
  choice: 你和你的后裔，使你们……作他产业之民
  alternative: 在你和你的后裔中拣选，使你……
  rationale: 按句法将雅各及其后裔共同视为拣选对象，并以复数“你们”使汉语指向清楚。
- issue: “在他面前”的管辖范围
  choice: 使你在他面前行公义，遵行他的旨意
  alternative: 使你行公义，并在他面前遵行他的旨意
  rationale: 原文中该短语位于两个并列对象之后，可自然修饰整个行动组合；译文保留这一整体关联。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“我儿雅各”保留父辈称呼的亲密与郑重；两次“愿”对应连续祈愿。“上帝”用于普适现代书面汉语。无脚注。
