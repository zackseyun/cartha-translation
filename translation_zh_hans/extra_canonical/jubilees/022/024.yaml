base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/024.yaml
  text: And for all who worship idols and for the profane[24], there is no hope in the land of the living; for they will go down to Sheol, and they will go to the place of judgment, and they will have no memorial upon the earth. As the sons of Sodom were removed from the earth, so all who worship idols will be removed.
translation:
  language: zh_hans
  text: 所有敬拜偶像的人和可憎之人[b]，在活人之地都毫无指望；因为他们必下到示奥尔[a]，前往审判之地，在地上不留任何记念。所多玛的子孙怎样从地上被除去，所有敬拜偶像的人也必照样被除去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示奥尔”是原文名称的音译，常指死者所在之处。本节另提“审判之地”，因此没有把它直接译作“地狱”或“坟墓”。
    reason: alternative_reading
  - marker: b
    text: 或译“被憎恶的人”；原词源于“憎恨”，并非通常表示礼仪上“不洁净”的词。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ጽሉአን (ṣəluʾān)
  choice: 可憎者
  rationale: 该词源于“憎恨”词根，直指被憎恶、可憎之人；避免误译为表达礼仪不洁的“不洁净者”，也不把含义过度限定为某一种亵渎行为。
- source_word: ሲኦል (Siʾol)
  choice: 示奥尔
  rationale: 保留原文音译，因本节将“下到示奥尔”与“走向审判之地”并列，不宜直接译作“地狱”而合并两个概念。
- source_word: ይትነሥኡ (yətnaśəʾu)
  choice: 被除去
  rationale: 结合所多玛子孙从地上消失的语境，表达从地上被移除或除灭；并在后半句重复相同译法，保留原文的对应结构。
- source_word: ዝክረ (zəkr)
  choice: 有人记念
  rationale: 该词表示记念、名声或留存的纪念；“不再有人记念”在现代汉语中自然地表达其在世上不留纪念的含义。
theological_decisions:
- issue: 示奥尔与审判之地的关系
  choice: 保留为两个并列而未明确等同的表述
  alternative: 把二者都译作“地狱”或将“审判之地”解释为示奥尔内部的区域
  rationale: 原文先说下到示奥尔，再说走向审判之地；译文保留这种张力，不替文本建立更具体的死后世界体系。
- issue: 偶像崇拜者最终被除去的语气
  choice: 采用“必……被除去”
  alternative: 译作仅仅“被迁走”或明确扩展为“永远灭亡”
  rationale: 原文以所多玛子孙从地上被除去作类比，语气严厉，但没有在此进一步界定其终极状态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“活人之地”“审判之地”保留原文意象；后两句重复“被除去”，以再现原文类比和动词呼应。
