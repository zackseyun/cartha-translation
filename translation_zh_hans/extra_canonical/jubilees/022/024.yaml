  to: 所有敬拜偶像的人和可憎之人[b]，在活人之地都毫无指望；因为他们必下到示奥尔[a]，前往审判之地，在地上不留任何记念。所多玛的子孙怎样从地上被除去，所有敬拜偶像的人也必照样被除去。
