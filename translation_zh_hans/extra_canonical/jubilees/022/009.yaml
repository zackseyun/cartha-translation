  yaml_path: translation/extra_canonical/jubilees/022/009.yaml
  text: The sword of the adversary has not overcome me in all that you have given me and my children all the days of my life until this day.
translation:
  language: zh_hans
  text: 仇敌的刀，在你赐给我和我儿女的一切事上，未曾胜过我；我一生的所有日子，直到今日，都是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡ ጸላኢ
  choice: 仇敌的刀
  rationale: 按字面保留“刀”与“仇敌”的属格关系，既可指实际兵刃，也保留敌对势力所带来杀害的形象。
- source_word: ኢሞአኒ
  choice: 未曾胜过我
  rationale: 动词表达战胜、制伏之意；“未曾胜过我”自然且贴近原文。
- source_word: በኵሉ፡ ዘወሀብከኒ
  choice: 你所赐给我的一切
  rationale: 保留第二人称施予者和“所赐的一切”的宽泛指称，不擅自限定为财物、福分或产业。
- source_word: ወለውሉድየ
  choice: 和我的儿女
  rationale: ውሉድ可泛指子女或后代；在亚伯拉罕临终祝福的近距离语境中译作“儿女”自然，同时不额外缩窄其范围。
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: 我一生的年日，直到今日
  rationale: 保留“生命的一切日子”这一时间跨度，以现代中文惯用表达传达其完整性。
theological_decisions:
- issue: 仇敌之刀未能胜过的宾语范围
  choice: 译为既未胜过说话者，也未胜过所得的一切和儿女
  alternative: 只译作“仇敌的刀在你赐给我和我儿女的一切事上未曾胜过我”
  rationale: 原文中“我”“你所赐给我的一切”“我的儿女”之间的句法关系较压缩。正文采用最顺畅且与英语审校层相符的并列理解，同时不把“仇敌”神学化为特定超自然存在。
- issue: 第二人称“你”的身份
  choice: 保留“你”，不在正文补作“上帝”
  alternative: 明确译为“上帝所赐”
  rationale: 原文仅有第二人称动词形式；上下文虽可辨明对象，正文仍不增补原文未明说的称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“未曾”“赐给”“直到今日”保持祝福祷告语境的庄严感；用分号拆开高度压缩的原句，使范围关系较易理解，又不消除其真实的句法张力。
