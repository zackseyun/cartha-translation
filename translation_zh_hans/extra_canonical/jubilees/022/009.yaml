    issue: “一切”和“我的儿女”被译成“胜过”的直接宾语。
    rationale: 原文的介词性短语更自然地限定“未曾胜过我”的范围：仇敌的刀在神所赐给说话者及其儿女的一切事上未能胜过说话者。草稿的“也未曾胜过”增添了刀剑胜过儿女及所赐之物的断言。
