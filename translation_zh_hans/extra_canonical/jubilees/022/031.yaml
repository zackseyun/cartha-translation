  yaml_path: translation/extra_canonical/jubilees/022/031.yaml
  text: And do not forsake him, and do not leave him, from now and unto the days of eternity. And let your eyes be open upon him and upon his seed, that you may keep him and bless him and sanctify him for a people of your inheritance. And bless him with all your blessings from now and for all the days forever, and renew your covenant and your mercy with him and with his seed according to all your will throughout all the generations of the earth.”
translation:
  language: zh_hans
  text: 从今直到永恒的岁月，求你不要离弃他，也不要撇下他。愿你的眼目垂顾他和他的后裔[a]，保守他，赐福给他，使他分别为圣，成为你产业的子民。求你以你一切的福分赐福给他，从今直到永恒的一切日子[b]；又照你一切的旨意，在地上历代之中，同他和他的后裔重申你的约和向他们所施的怜悯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“愿你的眼目向他和他的后裔敞开”或“在他和他的后裔之上敞开”。
    reason: 保留“眼目敞开”及介词“在……之上／向着”的源文形式。
  - marker: b
    text: 或译：“从今直到永恒的日子。”
    reason: 源文包含“日子”和“永恒”；“一切”强调其持续、无尽。
lexical_decisions:
- source_word: አትኅድጎ፡ ወአትትሐየዮ
  choice: 不要离弃他，也不要撇下他
  rationale: 保留两个相近但不完全相同的否定祈使动词，以自然汉语呈现其排比强调。
- source_word: አዕይንቲከ፡ ክሡታተ፡ ላዕሌሁ
  choice: 你的眼目垂顾他
  rationale: 字面为“你的眼目向着／在他之上敞开”；“垂顾”在庄重现代汉语中自然表达持续关注与看顾，并以脚注保留形式上的另一译法。
- source_word: ትቀድሶ
  choice: 使他分别为圣
  rationale: 保留“使成圣／分别为圣”的宗教语义，不弱化为一般性的奉献或任命。
- source_word: ለሕዝብ፡ ዘለርስትከ
  choice: 成为你产业的子民
  rationale: 按上下文把目的结构译出，同时保留“产业”这一盟约性用语；不将其具体化为某一后世教义概念。
- source_word: ሐድስ፡ ኪዳነከ፡ ወሣህለከ
  choice: 更新你的约和怜悯
  rationale: 分别对应“约”与“怜悯／恩慈”，保留二者并列，避免合并为“慈爱之约”。
- source_word: በኵሉ፡ ፈቃድከ
  choice: 照你一切的旨意
  rationale: “ፈቃድ”可指意愿、旨意；祷告语境中“旨意”庄重自然，同时保留范围词“一切”。
theological_decisions:
- issue: “使他分别为圣”与“成为你产业的子民”的句法关系
  choice: 译作“使他分别为圣，成为你产业的子民”
  alternative: “使他为你产业的子民分别为圣”
  rationale: 源文的代词“他”与随后单数形式的“子民”存在语法张力；正文保留由个人通向群体身份的表达，不擅自把“他”改成“他们”。
- issue: 更新之对象是“约和怜悯”
  choice: “向他和他的后裔更新你的约和怜悯”
  alternative: “与他和他的后裔重立你的约，并重新施怜悯”
  rationale: 源文将“约”和“怜悯”共同置于“更新”之下。虽然汉语略显张力，仍保留该并列关系，不拆解为两个不同动作。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语体。以“求你／愿”明确源文中向上帝发出的祈愿语气；保留“产业、分别为圣、约、怜悯”等核心词，同时避免过度古雅。
