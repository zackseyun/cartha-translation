base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/005.yaml
  text: And he brought a peace offering and made a great feast of rejoicing before Ishmael his brother. And Rebekah made fresh cakes from new grain and gave them to Jacob her son[5], so that he might bring them to Abraham, his father, from the firstfruits of the land, that he might eat and bless the Creator of all before he died.
translation:
  language: zh_hans
  text: 他献上平安祭，又在他的兄弟以实玛利面前举办盛大的欢庆筵席。利百加用新收的谷物做了新制的饼，交给她儿子雅各，让他把这些用地里初熟果实制成的饼带给他的父亲亚伯拉罕，好让他在去世以前吃这些饼，并称颂万有的创造主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መድኃኒተ
  choice: 平安祭
  rationale: 依本句祭献与筵席语境，并参考经审校的咨询层，译作现代读者熟悉的祭礼名称“平安祭”；该词形的具体语义仍受传本与词汇辨识限制。
- source_word: ፯ዝዐ፡ ፍሥሓ
  choice: 盛大的喜乐筵席
  rationale: ፍሥሓ明确表达喜乐；整体短语指规模盛大、以欢庆为特征的宴席，采用自然汉语整合表达。
- source_word: ጻፍንተ፡ ሐዳሰ፡ እምስርናይ፡ ኅዲስ
  choice: 用新收的谷物做了新鲜饼
  rationale: 保留“新鲜/新制”与“新谷”的双重意象，同时避免汉语中生硬重复“新的”。
- source_word: አቡሁ
  choice: 他的父亲
  rationale: 该词直译为“他的父亲”。尽管亚伯拉罕按家谱是雅各的祖父，古代经文可用“父亲”泛指父祖，正文不替原文消解这一张力。
- source_word: ፈጣሪ፡ ኵሉ
  choice: 万有的创造主
  rationale: 准确保留“创造者/创造主”与“全部、万有”的属格关系，并采用庄重自然的汉语称谓。
theological_decisions:
- issue: 亚伯拉罕与雅各的亲属称谓
  choice: 保留“他的父亲亚伯拉罕”
  alternative: “他的祖父亚伯拉罕”或“他父亲的父亲亚伯拉罕”
  rationale: 原文明确使用አቡሁ“他的父亲”；将其改成“祖父”会以家谱逻辑取代文本本身的广义父祖用法。
- issue: 对创造者的称号
  choice: “万有的创造主”
  alternative: “创造一切的主”
  rationale: 两者皆可表达原文；所选译法更凝练庄重，且不加入特定宗派神学措辞。
- issue: 临终前的动作关系
  choice: “好叫他在去世以前吃了，并称颂……”
  alternative: 将“去世以前”仅限定于“称颂”
  rationale: 原文顺序使临终时间语涵盖吃与称颂这一连贯目的动作，中文据此保持自然且不过度切分。
translation_notes:
  register: 采用现代标准普通话、简体中文和庄重叙事体。句式力求普通读者易懂，同时保留古代文本以“父亲”指父祖所产生的真实张力。脚注标记已在正文“雅各[a]”处出现。
