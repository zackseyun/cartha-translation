revisions:
- from: 他献上平安祭，又在他兄弟以实玛利面前摆设盛大的喜乐筵席。利百加用新收的谷物做了新鲜饼，交给她儿子雅各[a]，让他把地里的初熟果实带给他的父亲亚伯拉罕，好叫他在去世以前吃了，并称颂万有的创造主。
  to: 他献上平安祭，又在他的兄弟以实玛利面前举办盛大的欢庆筵席。利百加用新收的谷物做了新制的饼，交给她儿子雅各，让他把这些用地里初熟果实制成的饼带给他的父亲亚伯拉罕，好让他在去世以前吃这些饼，并称颂万有的创造主。
  rationale: 修订恢复雅各所携带的对象为利百加所制的饼，并以“用地里初熟果实制成的”表达其来源，避免将原文句法关系改写为雅各直接携带初熟果实。删去与正文锚点无直接释义关系的脚注；其余关键术语及“父亲”这一保留古代父祖称谓的译法维持不变。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:01:41Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿基本保留了祭献、欢庆筵席、新谷制饼、亚伯拉罕以“父亲”相称及临终前吃和称颂等要素。但“让他把地里的初熟果实带给……”将雅各所带之物改成了“初熟果实”，使前文已交给雅各的饼不再是后文“带给”的对象；原文及英文审校轨迹均表明所带的是那些饼，且其与地里初熟果实有关。
  naturalness: “新鲜饼”略显生硬，改为“新制的饼”更符合现代汉语。“在他的兄弟以实玛利面前举办盛大的欢庆筵席”庄重而自然。
  terminology: “平安祭”“万有的创造主”“以实玛利”“利百加”“雅各”“亚伯拉罕”均可保留。“父亲”应保留原文的广义父祖称谓，不应擅改为“祖父”。原有脚注并非对“她儿子雅各”这一锚点的必要说明，且其内容讨论的是另一短语，宜删除锚点及脚注。
  issues:
