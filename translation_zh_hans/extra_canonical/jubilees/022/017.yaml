  yaml_path: translation/extra_canonical/jubilees/022/017.yaml
  text: And may he renew his covenant with you, that you may be for him a people for an inheritance for all ages, and that he may be God to you and to your seed in truth and righteousness all the days of the earth.
translation:
  language: zh_hans
  text: 愿他与你更新他的约，使你作他产业的子民，直到万世；愿他在信实和公义中作你和你后裔的上帝，直到地上一切的日子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሐድስ፡ ኪዳኖ፡ ምስሌከ
  choice: 与你重立他的约
  rationale: የሐድስ 表示“更新、重新”，ኪዳን 为“约”；“重立”在现代中文中自然庄重，并保留再次确认或更新盟约的含义。
- source_word: ሕዝበ፡ ለርስት
  choice: 作产业之民
  rationale: 直译为“作为产业／继承物的百姓”。“产业之民”保留归属及珍贵所有的盟约意象，不改释为百姓自己承受产业。
- source_word: ለኵሉ፡ ዓለማት
  choice: 直到万世
  rationale: ዓለማት 可指诸世代、永世；语境强调长久持续，译为“直到万世”兼顾原文复数和庄重语体。
- source_word: ለከ፡ ወለዘርእከ፡ አምላከ
  choice: 作你和你后裔的上帝
  rationale: 逐项保留“你”“你的种子／后裔”和“上帝”的关系表达；“后裔”比字面“种子”更符合现代汉语。
- source_word: ዘበሀልወ፡ ወዘበጽድቅ
  choice: 以信实和公义相待
  rationale: 两个抽象名词大致对应真实性／信实与公义。“以……相待”使中文关系清楚，同时不过度界定这些品质究竟主要描述上帝的本性、作为，还是盟约关系。
- source_word: በኵሉ፡ መዋዕለ፡ ምድር
  choice: 在地上一切的日子里
  rationale: 贴近原文“地的一切日子”，保留其独特时间表达，指地上历史存续的全部时日。
theological_decisions:
- issue: “产业”所表达的归属方向
  choice: 使你归他作产业之民
  alternative: 使你成为承受产业的百姓
  rationale: 源文结构更自然地表示百姓成为上帝的产业，而非强调百姓承受某项产业；加入“归他”明确原文关系，却不扩展具体神学体系。
- issue: “信实和公义”与“作上帝”的句法关系
  choice: 在地上一切的日子里，以信实和公义相待
  alternative: 在真理和公义中，作你和你后裔的上帝
  rationale: 中文采用关系性表达以避免生硬，但仍保留“信实／真实”和“公义”共同限定上帝与他们之间关系的开放性，不将其缩减为单一属性或行为。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“重立他的约”“产业之民”“直到万世”保留盟约语汇和原文的时间广度；避免古奥虚词过多。
