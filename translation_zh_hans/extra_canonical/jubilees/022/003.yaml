  text: For Isaac had many possessions in Beer-sheba, and Isaac would go and look at his possessions and return to his father.
translation:
  language: zh_hans
  text: 因为以撒在别是巴有许多产业；他常去察看自己的产业，然后回到父亲那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብዙኅ፡ ጥሪቱ
  choice: 有许多产业
  rationale: ብዙኅ 表示“许多”，ጥሪት 在本节语境中指财产、产业；“产业”自然且能涵盖牲畜等家产。
- source_word: በቤርሳቤ
  choice: 在别是巴
  rationale: 按现代中文圣经中通行的地名音译处理。
- source_word: የሐውር፡ … ይዋሑ፡ … ይገብእ
  choice: 常去……察看……然后回到
  rationale: 连续未完成式在叙事语境中表达过去反复或惯常发生的行动；用“常”明确呈现这一体貌。
- source_word: ይዋሑ፡ ጥሪተ
  choice: 察看自己的产业
  rationale: 依所给吉兹语文本及校勘说明理解为查看产业；“自己的”由以撒拥有这些产业的上下文自然补明，避免中文指代含混。
- source_word: ኀበ፡ አቡሁ
  choice: 到父亲那里
  rationale: 直译为“向/到他的父亲那里”；中文无需重复“他的”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留经文开头“因为”与前文的因果衔接，并以“常”表达三个未完成式所体现的惯常行动。未采纳旧译“预备筵席并带给父亲”，因为现有吉兹语文本支持“察看产业并回到父亲那里”。
