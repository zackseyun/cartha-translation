  yaml_path: translation/extra_canonical/jubilees/022/014.yaml
  text: Be strong before men[14], and while you rule among all the seed of Seth, then your ways and the ways of your sons will be justified, so that they may become a holy people.
translation:
  language: zh_hans
  text: 你要在人面前刚强；当你在塞特所有后裔中掌权[a]时，你的道路和你子孙的道路就必显为正直，好使你们成为圣洁的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句措辞较难确定。吉兹文明确写作“塞特所有后裔”；这里译作“掌权”的词也可能有“被高举”的意思，整句或泛指他在人类中的地位。
    reason: 说明原文的文本难点，并保留“掌权”与“被高举”之间的真实歧义。
lexical_decisions:
- source_word: ኃያለ
  choice: 刚强
  rationale: 保留“强壮、有力量”的命令语气；“刚强”庄重自然，也符合祝福与劝勉的语境。
- source_word: ውስተ፡ ኵሉ፡ ዘርአ፡ ሴት
  choice: 在塞特所有后裔中
  rationale: 按吉兹文明确保留“塞特”和“后裔”，不将其泛化为单纯的“人类”。
- source_word: ትሜብል
  choice: 掌权
  rationale: 依上下文采用“掌权”，但该词在此句中的含义和文本切分不够确定，亦可能表达“被高举”，故加脚注保留歧义。
- source_word: ፍናዊከ፡ ወፍናዊ፡ ውሉድከ
  choice: 你的道路和你子孙的道路
  rationale: 两个“道路”按形态和复数谓语理解为复数集合概念；中文以重复“道路”清楚呈现并列关系。
- source_word: ይጸድቃ
  choice: 必显为正直
  rationale: 该词源于“正直、公义”语义域；这里以道路为主语，“显为正直”比人格性的“称义”更自然，同时保留获得正面判定的含义。
- source_word: ሕዝብ፡ ቅዱስ
  choice: 圣洁的子民
  rationale: “子民”适合群体身份和盟约式语境，“圣洁”保留分别为圣及道德纯正的张力。
theological_decisions:
- issue: “道路得称义”的表达
  choice: 道路必显为正直
  alternative: 道路必得称义
  rationale: 避免把后期系统神学中的人格称义术语直接套用于“道路”，同时不削弱原文公义、得认可的意味。
- issue: 成为圣洁子民的隐含主语
  choice: 好使你们成为圣洁的子民
  alternative: 从而成为圣洁的子民
  rationale: 依语境将雅各及其子孙作为复数群体明确表达；不把“道路”误解为“成为子民”的主语。
- issue: 雅各在塞特后裔中的地位
  choice: 掌权
  alternative: 被高举
  rationale: 正文采用与英译审校层一致、且在语境中通顺的“掌权”，脚注说明另一可能，不武断消除原文难点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“刚强”“圣洁的子民”保持经文体裁的尊严；句法略作顺整，并以脚注承载原文难以确定之处。
