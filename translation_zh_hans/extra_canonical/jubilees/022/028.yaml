  yaml_path: translation/extra_canonical/jubilees/022/028.yaml
  text: And both of them lay down together on one bed[28], and Jacob slept in the bosom of Abraham, his father’s father. And he kissed him seven times, and his compassion and his heart rejoiced over him.
translation:
  language: zh_hans
  text: 两人一同躺在一张床上，雅各睡在祖父亚伯拉罕的怀里。亚伯拉罕亲了他七次；他的怜爱和他的心都因雅各而欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句的结构较为生硬；较直译可作：“他的怜爱和他的心在他身上欢喜。”
    reason: 保留原文介词短语和拟人化表达可能具有的字面读法。
lexical_decisions:
- source_word: ዐራት፡ አሐቲ
  choice: 一张床
  rationale: 直译为“一个床榻”；现代汉语以“一张床”自然表达其单数含义。
- source_word: ሕፅነ
  choice: 怀里
  rationale: 该词表示胸怀、怀抱；“睡在……怀里”既贴近原文，又符合现代汉语亲昵场景的表达。
- source_word: አቡ፡ አቡሁ
  choice: 祖父
  rationale: 原文逐字为“他父亲的父亲”，在汉语中自然且准确的亲属称谓是“祖父”。
- source_word: ሰዐሞ፡ ስብዐ
  choice: 亲了他七次
  rationale: 保留亲吻动作、宾语以及明确的次数。
- source_word: ምሕረቱ
  choice: 他的怜爱
  rationale: 该词可指怜悯、慈爱或温柔眷顾；此处亲密的祖孙语境中，“怜爱”比“怜悯”自然，同时保留温柔关爱之意。
- source_word: ትሤሖ … ላዕሌሁ
  choice: 因雅各而欢喜
  rationale: 动词表达欢喜、喜悦，介词短语字面有“在他之上／向着他”之意；汉语用“因……而欢喜”传达喜悦以雅各为对象，且不删去原文的欢喜动词。
theological_decisions:
- issue: 末句中“怜爱”和“心”的拟人化并列
  choice: 保留“他的怜爱和他的心都……欢喜”
  alternative: 意译为“他满心怜爱雅各，为他欢喜”
  rationale: 原文将“他的怜爱”和“他的心”并列作主语；正文保留这种略显不寻常但有表现力的结构，避免把两者悄然合并。
- issue: 末句介词短语的关系
  choice: 译作“因雅各而欢喜”
  alternative: “在他身上欢喜”或“向他欢喜”
  rationale: 原文关系可较字面地理解为喜悦落在或指向雅各；“因雅各而欢喜”在现代汉语中自然，也不引入额外的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“祖父”取代逐字的“他父亲的父亲”；末句保留原文“怜爱”和“心”并列欢喜的修辞张力，并以脚注说明较字面的读法。
