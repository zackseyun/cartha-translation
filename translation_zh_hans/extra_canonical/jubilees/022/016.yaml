  yaml_path: translation/extra_canonical/jubilees/022/016.yaml
  text: And may he cleanse you from all uncleanness and impurity, so that he may forgive all your transgressions and your sins of ignorance[16]. And may he strengthen you and bless you, and may you inherit the whole earth.
translation:
  language: zh_hans
  text: 愿他洁净你，除去一切污秽和不洁，好赦免你一切的过犯和无知中所犯的罪[a]；愿他使你刚强，赐福给你，使你承受全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无知中所犯的罪”所对应的吉兹语短语文本和句法较难，也可理解为“因不明白而犯的错”。原文似乎把这类罪错与前面的“过犯”区别开来，但未必明确等同于后来的“故意罪”和“误犯之罪”分类。
    reason: lexical_alternative
lexical_decisions:
- source_word: ያንጽሕከ
  choice: 洁净你
  rationale: 保留使役性的洁净含义，并以现代汉语自然表达。
- source_word: ርኵሰት፡ ወርኩስ
  choice: 污秽和不洁
  rationale: 原文使用两个意义相近的词并列，译文保留这种叠加，而不合并为单一概念。
- source_word: ያስተስሪ
  choice: 赦免
  rationale: 上下文以过犯和罪为宾语，译作“赦免”比一般性的“解除”更贴切。
- source_word: አበሳከ
  choice: 你的过犯
  rationale: 表达违犯、过失之义，并与下一个较难确定的罪错词组作区分。
- source_word: ዘበአያእምሮ፡ ጌገይከ
  choice: 无知中所犯的罪
  rationale: 该短语文本和句法较难，似指并非在充分知情下犯的错误或罪；正文采用通顺译法，脚注保留不确定性。
- source_word: ያኃይለከ
  choice: 使你刚强
  rationale: 保留使之得力量、坚固的使役意义。
- source_word: ትረስ፡ ኵላ፡ ምድረ
  choice: 承受全地
  rationale: 动词具有继承、得为产业之义；“承受全地”兼顾圣经语体和现代可懂度。
theological_decisions:
- issue: 过犯与无知之罪的关系
  choice: 保留为两个并列而有区别的范畴：“过犯”和“无知中所犯的罪”
  alternative: 将两者统合为泛指的一切罪，或明确解释为故意罪与非故意罪
  rationale: 原文似有区分，但难以据此断定“过犯”必然全是故意犯罪；因此不在正文中强化为明确的神学分类。
- issue: 动词愿望式语气
  choice: 连续使用“愿他……”
  alternative: 译为确定陈述“他必……”
  rationale: 原文处于祝福祈愿语境，保留祈愿语气，避免改成无条件预告。
- issue: “全地”的范围
  choice: 直译为“全地”
  alternative: 解释为“整片土地”或“全世界”
  rationale: 原词可依语境指土地、大地或世界；正文保留其范围上的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。用“承受全地”保留经文色彩；避免古奥词汇及宗派化解释。脚注标记置于其实际解释的“无知中所犯的罪”之后。
