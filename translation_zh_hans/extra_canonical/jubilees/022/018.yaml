base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/018.yaml
  text: And you, my son Jacob, remember my words and keep the commandments of Abraham your father. Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion; for their deeds are unclean, and all their ways are defilement and abomination and uncleanness.
translation:
  language: zh_hans
  text: “我儿雅各，你要记住我的话，遵守你父亲亚伯拉罕的诫命。你要与列族分别，不可跟他们一同吃饭，不可照他们的行为行事，也不可与他们为伴；因为他们的行为是不洁净的，他们的一切道路尽是污秽、可憎和不洁。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈለጥ፡ እምአሕዛብ
  choice: 与列族分别
  rationale: ተፈለጥ表达分开、分别；አሕዛብ指诸民族或外族。译作“列族”保留古代经文语境，又不把所指过度限定为某一宗教意义上的“外邦人”。
- source_word: ወኢትብላዕ፡ ምስሌሆሙ
  choice: 不可跟他们一同吃饭
  rationale: 按字面保留共同进食的禁令，不扩展为一般交往或特定礼仪规条。
- source_word: ወኢትኩኖሙ፡ ቢጸ
  choice: 不可与他们为伴
  rationale: ቢጸ表示同伴、伙伴；“与他们为伴”自然且保持原文关系性的劝诫。
- source_word: ርኩስ
  choice: 不洁净
  rationale: 该词具有不洁、污秽的含义；此处作行为的表语，译为“不洁净”兼顾礼仪与道德色彩，不强行限定。
- source_word: ጐግኒ፡ ወምናኔ፡ ወስቆራር
  choice: 污秽、可憎和不洁
  rationale: 保留原文末尾三个并列的负面名词及其累加强调。“污秽”“可憎”“不洁”在现代汉语中庄重、易懂，并避免把彼此近义的词合并。
theological_decisions:
- issue: “与列族分别”的范围
  choice: 保留为直接的分别命令
  alternative: 解释为仅拒绝偶像崇拜或全面禁止族群交往
  rationale: 原文把分别、不同席、不同流合并陈述，却未在本节进一步界定适用范围；译文不替文本缩小或扩大该命令。
- issue: 不洁用语的性质
  choice: 采用兼具礼仪和道德可能性的“不洁净／不洁”
  alternative: 统一解释为道德邪恶或礼仪污染
  rationale: 上下文以行为和道路为对象，但相关词汇仍可能带有礼仪不洁的色彩，应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“我儿雅各，你也要……”自然呈现劝诫语气；“列族”略带经文语体但仍可理解。末句保留三个近义词的排比，不为追求流畅而删减原文的强化效果。
