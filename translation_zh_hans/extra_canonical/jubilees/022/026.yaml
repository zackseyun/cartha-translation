  yaml_path: translation/extra_canonical/jubilees/022/026.yaml
  text: This house I have built for myself[26], to put my name upon it on the earth. It is given to you and to your seed forever, and it will be called the house of Abraham. It is given to you and to your seed forever, because you will build my house and establish my name before God forever. Your seed and your name will stand throughout all the generations of the earth.”
translation:
  language: zh_hans
  text: “我为自己建造了这座房屋，为要在地上使我的名立在这房屋上。[a]它已经赐给你和你的后裔，直到永远；它要称为‘亚伯拉罕之家’。它已经赐给你和你的后裔，直到永远，因为你将建造我的房屋，使我的名在上帝面前永远坚立。你的后裔和你的名必在地上的万代中长存。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我为自己建造了这座房屋”可能指亚伯拉罕设立的敬拜场所；但下文的“亚伯拉罕之家”也带有家族传承的意味。这里的双重含义可能是有意保留的。
    reason: 说明源语“房屋／家”兼具场所与家族含义，中文无法用一个自然词语完全重现。
lexical_decisions:
- source_word: ቤተ
  choice: 房屋／之家／殿
  rationale: 该词在本节反复出现，可指具体房屋、宗教性殿宇，也可延伸指家族。中文依各处搭配分别译作“房屋”“之家”“殿”，并以脚注说明首句可能兼具宗教场所与家族传承的含义。
- source_word: አንብር፡ ስምየ፡ ላዕሌሁ
  choice: 把我的名立在地上
  rationale: 保留“立／安置名字”的源语意象，不把“名”解释性改写为名声、权柄或敬拜。
- source_word: ተውህበት
  choice: 它已经赐给
  rationale: 采用完成式表达已经作出的赐予，并保留本节中重复出现的赐予公式。
- source_word: ወተሰምየ（校勘所据正确读文；所给文本作ወጎሳመይ）
  choice: 它要称为
  rationale: 依据版本校勘与上下文，所给字符应属讹误；正确读文表示“被称为／得名为”，而非“我的人民”。
- source_word: ትሐንጽ…ታቀውም
  choice: 你将建造……使……坚立
  rationale: 两动词为未完成式，在预告雅各未来行动的语境中以将来表达最合适。
- source_word: ውስተ፡ ኵሉ፡ ትውልደ፡ ምድር
  choice: 在地上的万代中
  rationale: “万代”自然而庄重地表达遍及地上一切世代的延续。
theological_decisions:
- issue: “房屋”究竟指祭祀场所还是亚伯拉罕家族
  choice: 正文保留从具体“房屋”转向“亚伯拉罕之家”的张力，并加脚注说明双重可能
  alternative: 统一解释为圣所，或统一解释为家族／王朝
  rationale: 源文的同一词汇容许宗教建筑与家族传承两层含义；不应在译文中排除其中任何一层。
- issue: “在上帝面前坚立我的名”的神学关系
  choice: 按源文直译，保留说话者的“我的名”与“上帝”并列
  alternative: 解释为“使上帝的名坚立”或“在上帝面前保存我的名声”
  rationale: 原句本身具有值得保留的张力，解释性改写会改变指代或预先解决其含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“直到永远”的重复和“立名”“万代”等源文意象，不以教派术语扩充。
