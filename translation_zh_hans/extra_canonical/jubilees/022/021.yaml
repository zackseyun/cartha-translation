  yaml_path: translation/extra_canonical/jubilees/022/021.yaml
  text: But you, my son Jacob, may the Most High God help you, and may the God of heaven bless you and remove you from their uncleanness and from all their error.
translation:
  language: zh_hans
  text: 至于你，我儿雅各，愿至高的上帝帮助你；愿天上的上帝赐福给你，使你远离他们的污秽和一切谬误。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልዑል
  choice: 至高的
  rationale: 该词意为“高、至高”，在此作上帝的尊称；译为“至高的上帝”，既贴近原文，也符合现代汉语宗教语体。
- source_word: ይርዳእከ
  choice: 帮助你
  rationale: 直译该祈愿式动词，保留祝愿语气。
- source_word: ወያግኅሥከ
  choice: 使你远离
  rationale: 此处表达把雅各从某种有害处境中移开或隔离；“使你远离”自然地保留这一方向性含义。
- source_word: ርእዮሙ
  choice: 他们的污秽
  rationale: 依据本版所反映的语境及英译审校层，采用伦理—礼仪意义的“污秽”；所有格“他们的”对应复数后缀。
- source_word: ስሕተቶሙ
  choice: 他们的谬误
  rationale: 该词可指错误、迷误或偏离；“谬误”保留认知及行为偏差的宽度，避免具体化为某一种罪。
theological_decisions:
- issue: “至高的上帝”与“天上的上帝”的关系
  choice: 保留两个并列称号
  alternative: 合并为对同一称号的重复表达
  rationale: 原文连续使用两个神圣称号；保留其并列结构，不解释为不同对象，也不消除修辞上的重复。
- issue: 脱离污秽与谬误的施事者
  choice: 译作上帝“使你远离”
  alternative: 译作雅各自行“离弃”
  rationale: 原文祈愿动词以上帝为主语，强调所求的是上帝的行动，同时不进一步规定其作用方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“愿……；愿……”呈现祝福祈愿结构；“至于你，我儿雅各”保留转折和亲属称呼。全文无脚注标记。
