  yaml_path: translation/extra_canonical/jubilees/022/030.yaml
  text: And he blessed Jacob and said[30], “My son, in whom with all my heart and all my affection I rejoice, may Your grace and Your mercy rest upon him and upon his seed always.”
translation:
  language: zh_hans
  text: 他祝福雅各，说：“我儿，我全心全意、满怀慈爱地因你欢喜。愿你的恩惠和怜悯长久临到他和他的后裔，直到永远。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里由第二人称“你的”转为第三人称“他”。这可能表示说话者转而向上帝祈求，但原文没有明说；译文保留了这一人称转换。
    reason: textual_variant
lexical_decisions:
- source_word: ምሕረትየ
  choice: 爱
  rationale: 此处与“全心”并列，表达说话者对雅各深厚的慈爱、眷爱；译作自然汉语的“爱”，避免把亲情语境中的情感误读为单纯的“怜悯”。
- source_word: ይትፈሣሕ፡ ቦቱ
  choice: 以你为乐
  rationale: 保留“因某人欢喜、以某人为喜乐”的关系结构，同时使中文简洁自然。
- source_word: ሣህለከ፡ ወምሕረትከ
  choice: 你的恩惠和怜悯
  rationale: 两个名词均带第二人称阳性单数后缀，故译为“你的”，不改成第一人称。
- source_word: ነዋኅ፡ ላዕሌሁ
  choice: 长久临到他
  rationale: ነዋኅ 表示延长、长久；ላዕሌሁ 表示“在他之上”。“长久临到他”在现代中文中自然地传达持续覆庇的祈愿。
- source_word: ኵሎ፡ መዋዕለ
  choice: 直到永远
  rationale: 字面为“所有的日子”，修饰时间而非“后裔”；按汉语祈愿语体译为“直到永远”。
theological_decisions:
- issue: 祝福语中第二人称与第三人称的突转
  choice: 正文保留“你的恩惠……临到他”
  alternative: 改为“愿上帝的恩惠……临到你”或“愿我的恩惠……临到他”
  rationale: 原文明确使用第二人称后缀“你的”，随后又以第三人称“他”指雅各。此处可能是转向上帝的祈祷，也可能保存了不规则措辞；不应在正文中擅自统一人称。
- issue: “你的”所指对象
  choice: 不在正文中补出“上帝”
  alternative: 译为“愿你——上帝——的恩惠……”
  rationale: 祈祷语境可使读者理解为转向上帝，但原文没有明说称呼；正文保留这种含蓄和歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“我全心爱你，以你为乐”将原文较密集的关系从句转为自然汉语；祈愿部分则尽量保留原文的人称不规则和神学张力。
