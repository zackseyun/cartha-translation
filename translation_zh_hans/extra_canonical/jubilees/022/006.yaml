  yaml_path: translation/extra_canonical/jubilees/022/006.yaml
  text: And Isaac also sent by the hand of Jacob the best of the thank offering to Abraham, that he might eat and drink.
translation:
  language: zh_hans
  text: 以撒也借雅各之手，把感恩祭中最好的祭物送给亚伯拉罕，好让他吃喝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈነወ፡ በእዴ፡ ያዕቆብ
  choice: 由雅各的手……送给
  rationale: 保留原文“借雅各之手”的委托表达，同时使现代汉语自然清楚。
- source_word: ዘይሤኒ
  choice: 最好的部分
  rationale: 该形式表达优选、上好之物；在祭物语境中译作“最好的部分”，避免误解为整个祭物。
- source_word: መሥዋዕተ፡ ዘመድኃኒት
  choice: 感恩祭
  rationale: 此短语指带有感谢、称谢性质的祭物；采用简明且符合祭祀语境的“感恩祭”。
- source_word: ወይብላዕኒ፡ ወይስተይኒ
  choice: 让他吃喝
  rationale: 对应“使他吃并使他喝”，以自然汉语保留目的关系及两个动作。
theological_decisions:
- issue: “መሥዋዕተ፡ ዘመድኃኒት”的祭类名称
  choice: 感恩祭
  alternative: 救恩祭／平安祭
  rationale: 原词组在此更适合理解为感谢或称谢性质的祭；不采用“救恩祭”以免引入救赎论色彩，也不擅自等同于五经中制度化的“平安祭”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“由雅各的手”这一带有原文色彩的委托结构。
