    rationale: 原文的修饰语指“最好的”祭物／供物；英语审校轨迹亦作“the best of the thank offering”，并未明说是一个“部分”。译为“最好的祭物”更稳妥。
  - severity: low
    issue: “由雅各的手”不够自然。
    rationale: “借雅各之手”是现代汉语中表达经由某人转交的自然、庄重说法，并保留原文措辞的色彩。
  revised_text: 以撒也借雅各之手，把感恩祭中最好的祭物送给亚伯拉罕，好让他吃喝。
