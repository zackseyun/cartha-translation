base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/010.yaml
  text: My God, may your mercy and your peace be upon your servant and upon the seed of his sons, that they may be for you a chosen people and an inheritance from among all the nations of the earth, from now and for all the days of the generations of the earth, for all ages.
translation:
  language: zh_hans
  text: 我的上帝啊，愿你的怜悯和平安临到你的仆人和他众子的后裔，使他们归你作蒙拣选的子民，并作从地上万国中分别出来的产业；从今时直到地上世世代代的一切日子，直到万世。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላኪየ
  choice: 我的上帝啊
  rationale: 保留第一人称领属和呼格语气；置于祈愿句首，符合原文。
- source_word: ሣህልከ
  choice: 你的慈爱
  rationale: 该词可指怜悯、恩慈；此处祷告语境用“慈爱”自然庄重，又不削弱施恩含义。
- source_word: ዘርአ፡ ውሉዱ
  choice: 他众子的后裔
  rationale: 按原文层级直译“他儿子们的种/后裔”，避免笼统化为“他的后裔”。
- source_word: ሕዝበ፡ ኅሩየ
  choice: 蒙拣选的子民
  rationale: 表达“被选择的人民”，采用现代宗教汉语中清楚而庄重的说法。
- source_word: ወርስተ
  choice: 产业
  rationale: 保留“继承所得、归属之产业”的圣经语义，而不改释为较弱的“所有物”。
- source_word: እምኵሉ፡ አሕዛበ፡ ምድር
  choice: 从地上万国中所得的
  rationale: 保留介词“从……中”所表达的选取或分别关系，并让它自然修饰“产业”。
- source_word: ለኵሉ፡ ዓለማት
  choice: 直到永永远远
  rationale: 自然表达“至所有世代/诸永世”的持续时间，与前句层递相接。
theological_decisions:
- issue: “蒙拣选的子民”和“产业”的关系
  choice: 并列保留两种身份描述
  alternative: 将二者合并为“蒙拣选作产业的子民”
  rationale: 原文以连接词并列“子民”与“产业”；并列译法保留其可能的语义张力，不预先判定后者仅为前者的补语。
- issue: “从地上万国中”修饰对象
  choice: 就近连接“产业”
  alternative: 同时修饰“蒙拣选的子民”和“产业”
  rationale: 原文次序使该短语紧随“产业”，但语义上也可能涵盖整个并列结构；正文按句法就近处理而不额外扩张。
- issue: 末尾时间表达
  choice: 将“地上世世代代的一切日子”与“永永远远”都保留
  alternative: 合并简化为“直到永远”
  rationale: 原文有两层延续表达；保留二者可呈现其强调和节奏。
translation_notes:
  register: 采用现代标准普通话的庄重祷告体。“我的上帝啊”明确呈现原文呼格；全句保留原文层递结构，同时用分号控制长句，使普通读者易于理解。未设置脚注，因为正文已直接表达原文内容，没有必须另注的文本异读。
