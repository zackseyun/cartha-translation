  text: and I will be their God, and they will be my people in truth and in righteousness.
translation:
  language: zh_hans
  text: 我必作他们的上帝；他们必以诚实和公义作我的子民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ
  choice: 上帝
  rationale: 对应“上帝、神”，在此带有第一人称所属关系，按汉语自然表达译为“他们的上帝”。
- source_word: ሕዝብየ
  choice: 我的子民
  rationale: 该词表达“我的人民/子民”；“子民”适合庄重的盟约语境，也清楚体现归属关系。
- source_word: ዘበአማን
  choice: 在真诚中
  rationale: 保留介词结构及“真实、忠信、诚实”的语义范围；此处采用“真诚”，避免过早限定为某一项抽象教义。
- source_word: ዘበጽድቅ
  choice: 在正义中
  rationale: 对应“正义、公义、正直”；采用现代读者易懂的“正义”，同时保留伦理与关系层面的庄重意味。
theological_decisions:
- issue: 上帝与子民之间的关系
  choice: 保留“我要作他们的上帝，他们也要作我的子民”的双向表述
  alternative: 意译为“我要与他们立约，使他们归属于我”
  rationale: 原文直接陈述彼此关系，并未在本句明说“立约”，因此不补入解释性神学术语。
- issue: 真诚与正义的句法关系
  choice: 译作“在真诚和正义中”，让两者共同修饰“作我的子民”
  alternative: 译作“作我真实而公义的子民”
  rationale: 原文重复的介词性结构更接近行为或生活所处的范围；保留这一结构，也避免把两个词仅处理为子民的静态属性。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留原文平行句式和盟约性语气，不添加原文未明说的教派性解释。所给吉兹语片段末尾似乎接续下一分句（“ወኢ*የኀድ”），本稿只翻译与本节英文审校层相对应的完整句。
