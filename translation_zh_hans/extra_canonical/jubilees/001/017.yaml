  terminology: “上帝”与“子民”一致且适合本书的庄重语体。“公义”比“正义”更贴近本句与原文所表达的 righteousness，且不额外规定具体教派解释。“诚实”可比“真诚”更妥当地保留“真实／真理、忠信”的语义场。
