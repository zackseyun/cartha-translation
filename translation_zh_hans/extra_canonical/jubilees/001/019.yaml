base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/019.yaml
  text: And he prayed and said, “Lord my God, do not abandon your people and your inheritance to walk in the error of their hearts, and do not give them into the hand of their enemies, the nations, lest they rule over them and cause them to sin against you. Let your mercy, Lord, be lifted up over your people.”
translation:
  language: zh_hans
  text: 他祷告说：“主啊，我的上帝，求你不要撇弃你的子民、你的产业，任由他们随从自己内心的迷误而行；也不要把他们交在仇敌——列国——手中，免得仇敌辖制他们，使他们得罪你。主啊，愿你的怜悯临到你的子民。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትኅድግ
  choice: 不要撇弃
  rationale: 保留否定祈求的语气，也准确表达遗弃、任其不顾的含义。
- source_word: ሕዝበከ፡ ወርስትከ
  choice: 你的子民、你的产业
  rationale: 保留两个并列称谓及“产业”这一盟约性意象，不合并释义。
- source_word: በሐዊር፡ በስሕተተ፡ ልቦሙ
  choice: 任由他们随从自己内心的迷误而行
  rationale: 以自然汉语表达“行在他们心中的迷误里”，并维持行为与内心迷误的关联。
- source_word: ውስተ፡ እዴ፡ ፀሮሙ
  choice: 交在仇敌……手中
  rationale: 保留闪族语言常见的“交在……手中”意象。
- source_word: አሕዛብ
  choice: 列国
  rationale: 此处与“他们的仇敌”同位，指敌对的外邦诸国；“列国”较庄重且不额外引入贬义。
- source_word: ኢይኰንንዎሙ
  choice: 免得仇敌辖制他们
  rationale: 源词可涉及统治、支配或审判；结合敌国掌权的上下文，采用“辖制”，同时不扩展为具体政治制度。
- source_word: ይትለዐል፡ … ምሕረትከ፡ ላዕለ
  choice: 愿你的怜悯临到
  rationale: 原文直译近于“愿你的怜悯被高举在……之上”；汉语若照搬较晦涩，此处按祈求怜悯覆临百姓的语境自然表达。
theological_decisions:
- issue: 百姓犯罪的责任与外敌的作用
  choice: 使他们得罪你
  alternative: 逼他们得罪你／叫他们犯罪得罪你
  rationale: 保留敌人的因果作用，但不暗示百姓因此完全没有道德责任。
- issue: “你的产业”的盟约含义
  choice: 保留“产业”
  alternative: 你的百姓／属于你的民
  rationale: 不将原文的神学意象平面化，也不添加超出文本的盟约解释。
- issue: 末句怜悯的空间隐喻
  choice: 愿你的怜悯临到你的子民
  alternative: 愿你的怜悯高举在你的子民之上
  rationale: 选择现代汉语可理解的祈祷表达；“临到”仍保留怜悯从上而来的方向感。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷体。“主啊，我的上帝”保留直接呼告；破折号标明“列国”与“仇敌”的同位关系。全节不加脚注，因为主要语义可在正文中清楚呈现。
