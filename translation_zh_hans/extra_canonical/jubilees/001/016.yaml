  text: with all my heart and with all my soul. And they will be for a blessing and not for a curse, and they will be the head and not the tail. And I will build my sanctuary in their midst, and I will dwell with them,
translation:
  language: zh_hans
  text: 用我全部的心和灵魂。他们必成为祝福，而不是咒诅；必居首位，而不是居末位。我要在他们中间建造我的圣所，并要与他们同住，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሉ፡ ልብየ፡ ወበኵሉ፡ ነፍስየ
  choice: 全心全意
  rationale: 直译为“以我的全心、以我的全魂”；现代汉语用“全心全意”自然表达完整投入，同时保留第一人称语境所指的全然心意。
- source_word: ለበረከት
  choice: 成为福分
  rationale: 保留“成为/归为福分”的结果意义；“福分”比单纯“祝福”更适合与“咒诅”构成名词性对举。
- source_word: ርእሰ፡ ወአኮ፡ ዘነበ
  choice: 居首位，而不是居末位
  rationale: 原文意象为“头而非尾”；采用现代汉语可理解的地位表达，仍保留申命记式的首末对举。
- source_word: መቅደስየ
  choice: 我的圣所
  rationale: 准确保留第一人称所有格及分别为圣、供神居临的场所含义。
- source_word: ማእከሎሙ
  choice: 在他们中间
  rationale: 忠实表达群体内部、中央的空间关系。
- source_word: እኀድር፡ ምስሌሆሙ
  choice: 与他们同住
  rationale: “住/居留”与“同他们一起”的组合自然译为“与他们同住”，保留神临在群体中的意义。
theological_decisions:
- issue: “头而不是尾”的表达方式
  choice: 译作“居首位，而不是居末位”
  alternative: 译作“作头而不作尾”
  rationale: 前者在现代普通话中较自然，并传达地位和处境的对比；不把它进一步解释为政治统治或宗教优越。
- issue: 神在群体中的临在
  choice: 分别保留“建造我的圣所”与“与他们同住”
  alternative: 合并解释为“我要住在他们的圣殿里”
  rationale: 原文包含两个并列动作；分译可避免把神的同住局限为仅在建筑物内，也不额外引入后世神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文从上一句续接而来，因此以“全心全意”开头；末尾逗号保留原始材料在本节末端未完的连续性。
