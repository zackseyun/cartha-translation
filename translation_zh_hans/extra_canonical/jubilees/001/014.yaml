  text: And they will forget all my law and all my commandments and all my judgments, and they will go astray as to new moons
translation:
  language: zh_hans
  text: 他们必忘记我一切的律法、诫命和典章，并在朔日[a]的事上走迷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“新月”。
    reason: 原词既可表示新月，也可指以新月为标志的朔日；当前经节切分又在此处中断，宜保留歧义。
lexical_decisions:
- source_word: ይረስዑ
  choice: 忘记
  rationale: 直译该动词，表达对上帝律法的遗忘或弃置。
- source_word: ሕግየ
  choice: 我全部的律法
  rationale: 保留第一人称所属关系，并以“全部”对应强调整体性的 ኵሎ。
- source_word: ትእዛዝየ
  choice: 我所有的诫命
  rationale: “诫命”是现代汉语宗教文本中自然且准确的对应词。
- source_word: ፍትሕየ
  choice: 我一切的判决
  rationale: 该词可指司法判决、典章或公正裁断；此处选择“判决”，同时避免把三个并列法律术语合并。
- source_word: ይስሕቱ
  choice: 偏离正道
  rationale: 表达迷失、走错或偏离之意；结合后面的事项范围，用“在……的事上偏离正道”形成自然汉语。
- source_word: ሠርቀ
  choice: 朔日
  rationale: 在历法与敬拜语境中指新月之日；“朔日”比字面“新月”更清楚地表示历法日期，但以脚注保留另一译法。
theological_decisions:
- issue: ፍትሕየ 所指是司法判决、典章还是公义法则
  choice: 判决
  alternative: 典章
  rationale: 保留原文与“律法”“诫命”并列的独立法律范畴，不将其神学含义扩大或同化。
- issue: ሠርቀ 是天象“新月”还是历法/节期“朔日”
  choice: 朔日
  alternative: 新月
  rationale: 上下文更可能涉及宗教历法，但现有分节在该词后截断，故正文采用语境化表达，并以脚注保存词义歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“律法—诫命—判决”的三项并列结构。经节在“朔日”处结束，不添加逗号，也不擅自补入下一分句。
