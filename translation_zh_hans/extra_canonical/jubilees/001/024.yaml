  yaml_path: translation/extra_canonical/jubilees/001/024.yaml
  text: And their souls will cling to me and to all my commandments, and they will do my commandments. And I will be their Father, and they will be my children.
translation:
  language: zh_hans
  text: 他们的心灵必依附我和我的一切诫命，并且遵行我的诫命。我要作他们的父，他们要作我的儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍሶሙ
  choice: 他们的心灵
  rationale: 此处指人的内在生命与意志取向；译作“心灵”比单用“灵魂”更符合现代汉语表达，同时保留原词的内在生命意涵。
- source_word: ኀቤየ
  choice: 依附我
  rationale: 与“心灵”连用，表达转向并紧紧归附于神，不将其弱化为单纯的空间性“到我这里”。
- source_word: ትእዛዝየ
  choice: 我的诫命
  rationale: 准确传达神所颁布的命令，在经文语体中采用通行而庄重的“诫命”。
- source_word: ይገብሩ
  choice: 遵行
  rationale: 原词在此表示实行、履行；“遵行诫命”是自然且准确的现代汉语搭配。
- source_word: አበ
  choice: 父
  rationale: 保留亲属称谓及其盟约关系意涵，不扩展为解释性称号。
- source_word: ውሉደ
  choice: 儿女
  rationale: 原词为复数“孩子/子女”；“儿女”在现代汉语中自然包含群体，不限定性别。
theological_decisions:
- issue: 心灵归附与遵行诫命之间的关系
  choice: 保留并列结构：“依附我和我的一切诫命，并且遵行我的诫命”
  alternative: 将其解释为因果关系，如“因归向我而遵守……”
  rationale: 原文以连接词并列这些行动，没有明确标示因果次序，因此不替文本补入系统化解释。
- issue: 神与群体的父子关系
  choice: 直译为“我要作他们的父，他们要作我的儿女”
  alternative: 解释为收养、立约身份或民族身份
  rationale: 原文仅陈述父与儿女的关系；直译可保留其丰富神学张力，避免导入特定教义框架。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文的重复“我的诫命”，不为求简练而删并，以呈现其强调效果。所给吉兹文本在“他们要作我的儿女”之后仍有后续语句，但英语审校层及本节指定范围止于此处，因此正文依该节界截断。
