base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/005.yaml
  text: 'And the Lord taught him what was first and what was to come: the account of the divisions of all the days of the law and the testimony. And he said, “Set your heart on everything that I tell you on this mountain, and write it in a book, so that their generations may see that I have not abandoned them because of all the evil that they have done by transgressing the ordinance that I establish between me and you.”'
translation:
  language: zh_hans
  text: 主使他知道起初的事和将来的事，就是律法和见证的一切日子的划分记载。主说：“你要留心我在这山上告诉你的一切，并把它写在书上，使他们的后代看见：我没有因他们违背我在你我之间所立的规条、行了这一切恶事而离弃他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመሮ
  choice: 使他知道
  rationale: 该动词在此表示使人知晓、教导；“使他知道”自然且贴近语义。
- source_word: ዘቀዳሚ፡ ወዘኒ፡ ይመጽእ
  choice: 起初的事和将来的事
  rationale: 保留过去/起初与未来的对举，不把其范围过度限定为历史事件。
- source_word: ነገረ፡ ኩፋሌ
  choice: 划分记录
  rationale: ነገር可指叙述、记载或事项，ኩፋሌ指划分；合译为“划分记录”可表达有关分期划分的书面记述。
- source_word: መዋዕላት
  choice: 日子
  rationale: 采用该词通常的时间含义，并保留“一切日子”的概括表达。
- source_word: ሕግ፡ ወለስምዕ
  choice: 律法和见证
  rationale: 分别对应“律法”与“见证”，保留其并列和经书式术语色彩。
- source_word: አነብር፡ ልበከ
  choice: 你要留心
  rationale: 字面意象近于“把你的心放在……上”；现代汉语以“留心”自然传达专注、牢记之意。
- source_word: ሥርዐት
  choice: 规条
  rationale: 该词可指秩序、条例或制度；上下文涉及神所设立并被违背的规范，“规条”较为稳妥。
- source_word: እሠርዕ
  choice: 所立
  rationale: 表达制定、设立之意；“所立的规条”符合现代汉语搭配。
theological_decisions:
- issue: 神没有离弃他们与他们所行之恶的关系
  choice: 译作“尽管……我却没有离弃他们”
  alternative: “使他们看见，我没有因他们所行的一切恶事而离弃他们”
  rationale: 原文介词短语与否定动词的逻辑关系可能被理解为“不因恶行而离弃”；“尽管……却……”既符合上下文，也避免让“因为”在汉语中误成离弃的原因。
- issue: “律法和见证”与“日子的划分”的句法关系
  choice: 译作“律法和见证中一切日子的划分记录”
  alternative: “一切日子的划分、律法和见证的记录”
  rationale: 源文串联结构紧密，存在修饰范围的张力；正文采用与既有校审层一致的理解，但不将“律法和见证”解释成具体宗派概念。
- issue: 神与摩西之间所立之规条
  choice: 保留“我在你我之间所立”
  alternative: “我借着你所设立”
  rationale: 原文明确出现“在我与在你之间”的关系表达，应保留其盟约式张力，不改写成单纯的中介关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主”对应普通的主称而非将其改写为专名形式；引语清晰，避免古奥倒装。未添加原文没有的“今日”。
