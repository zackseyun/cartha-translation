revisions:
- from: 主使他知道起初的事和将来的事，就是律法和见证中一切日子的划分记录。主说：“你要留心我在这山上告诉你的一切，并把它写在书上，使他们世世代代都能看见：尽管他们违背我在你我之间所立的规条，行了这一切恶事，我却没有离弃他们。”
  to: 主使他知道起初的事和将来的事，就是律法和见证的一切日子的划分记载。主说：“你要留心我在这山上告诉你的一切，并把它写在书上，使他们的后代看见：我没有因他们违背我在你我之间所立的规条、行了这一切恶事而离弃他们。”
  rationale: 修订仅处理末句被明确化的让步关系，并微调“后代”及首句名词串的表达。修订后不增加“今日”等原文未载信息，也不以特定神学传统界定“律法和见证”或“规条”。
