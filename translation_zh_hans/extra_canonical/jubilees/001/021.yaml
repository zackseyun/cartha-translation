lexical_decisions:
- source_word: ልበ፡ ንጹሐ፡
  choice: 一颗清洁的心
  rationale: 按词义直译“清洁的心”，并补入现代汉语所需量词，使祈求的并列结构自然。
- source_word: መንፈሰ፡ ቅዱሰ፡
  choice: 一个圣洁的灵
  rationale: 保留“灵”与“圣洁”的直接搭配，不擅自将其确定为专名“圣灵”，从而保存原文可能指人内在之灵的歧义。
- source_word: ይትዐቀጹ፡ በኀጢአቶሙ፡
  choice: 陷在自己的罪中
  rationale: 该表达具有被缠住、陷住之意；“陷在……中”在现代汉语中自然，也保留罪成为网罗或困境的意象。
- source_word: ተዋሥኦቶሙ፡
  choice: 他们的悖逆
  rationale: 依上下文表达与上帝对抗、不顺服的倾向；“悖逆”兼顾宗教语境的庄重感与现代可懂度。
- source_word: ሕሊናሆሙ፡
  choice: 他们的心思
  rationale: 译出内在思想、意念之义，不缩窄为单一的“计划”或“企图”。
- source_word: ይቡሰ፡
  choice: 颈项刚硬
  rationale: 结合句法及连续文本所呈现的固定身体隐喻，采用汉语圣经传统中清楚可懂的“颈项刚硬”，表达顽梗不从。
theological_decisions:
- issue: “圣洁的灵”是否应译为专名“圣灵”
  choice: 一个圣洁的灵
  alternative: 圣灵
  rationale: 原文此处没有足够的形式标记强制要求将其理解为专名；保留普通名词结构可避免预先解决其究竟指人的更新之灵还是上帝的圣灵这一问题。
- issue: 神名/称号 እግዚአብሔር 的译法
  choice: 主
  alternative: 耶和华
  rationale: 吉兹语文本使用的是“主”的称号形式，而非可直接音译为“耶和华”的希伯来四字神名；因此译作“主”更贴近现存原文证据。
- issue: 末尾“不听从”的时态和语气
  choice: 他们必不听从
  alternative: 他们不听从
  rationale: 依咨询文本所反映的连续语境，用“必不”传达预见性的将来陈述，同时不添加其尚未出现的宾语。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。该节首尾都属于跨节或跨句残段，因此开头保留名词短语的承接形式，结尾不补原文未提供的宾语或闭引号。并列项略作汉语句法调整，以“也知道”使“颈项刚硬”自然成立，但不改变三项内容。
