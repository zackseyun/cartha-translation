  yaml_path: translation/extra_canonical/jubilees/001/004.yaml
  text: And on the seventh day he called to Moses from the midst of the cloud, and the appearance of the glory of Yahweh was like a burning fire on the top of the mountain. And Moses was on the mountain forty days and forty nights.
translation:
  language: zh_hans
  text: 第七天，他从云彩中间呼唤摩西。耶和华荣耀的显现，仿佛山顶上燃烧的烈火。[a]摩西在山上四十天四十夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华的荣耀显现出来，仿佛山顶上燃烧的烈火。”
    reason: 原文相关形式可理解为名词性的“显现、外观”，也可能按动词表达；脚注保留这一句法歧义。
lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር
  choice: 耶和华荣耀
  rationale: “ስብሐት”表示“荣耀”，神名“እግዚአብሔር”在此依文本传统译作“耶和华”，既明确又符合现代中文圣经语体。
- source_word: ወርእዩ
  choice: 显现
  rationale: 此处形式可按与《出埃及记》24:17相应的名词性表达理解为“外观、显现”，而非简单处理为“看见”；译文保留其神显语境。
- source_word: ከመ፡ እሳት፡ ዘያነድድ
  choice: 如同烈火……燃烧
  rationale: 直译其比较与分词结构，表达荣耀的显现仿佛正在燃烧的火。
- source_word: አርብዓ፡ ዕለተ፡ ወአርብዓ
  choice: 四十昼夜
  rationale: 源文末项在所给引文中截断，但平行经文及英语审校层均表明惯用对偶为“四十日和四十夜”；现代中文以“四十昼夜”自然凝练地表达。
theological_decisions:
- issue: “耶和华荣耀”与火的关系
  choice: 耶和华荣耀的显现如同烈火，在山顶上燃烧
  alternative: 耶和华的荣耀显现出来，如同山顶上的烈火
  rationale: 采用名词性“显现”，避免把原文的“荣耀之显现/外观”无标记地改成动词“显现出来”，并保留火是比喻性外观而非将荣耀等同于物质之火。
- issue: 呼唤者的身份
  choice: 他
  alternative: 耶和华
  rationale: 本节源文使用第三人称动词，主语须由上文补足；译作“他”保留篇章衔接，不在本节中额外明示。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第七天”“从云中”“山顶”“四十昼夜”均保持叙事简洁；正文以“荣耀的显现”贴近源文形式，并用脚注呈现另一种可能译法。
