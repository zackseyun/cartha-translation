revisions:
- from: 第七天，他从云中呼唤摩西。耶和华荣耀的显现如同烈火，在山顶上燃烧。[a]摩西在山上四十昼夜。
  to: 第七天，他从云彩中间呼唤摩西。耶和华荣耀的显现，仿佛山顶上燃烧的烈火。[a]摩西在山上四十天四十夜。
  rationale: 将“燃烧”明确修饰“烈火”，以忠实保留原文比较结构并消除中文歧义；将“云中”具体为“云彩中间”，将“四十昼夜”展开为“四十天四十夜”，使译文更贴近源文措辞而不改变意义。
