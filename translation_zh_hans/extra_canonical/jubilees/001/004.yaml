    rationale: 原文是“荣耀的显现/外观”像“在山顶上燃烧的火”；现有中文可被读为荣耀的显现本身在山顶燃烧。
  - severity: low
    issue: “四十昼夜”压缩了“日和夜”的并列。
    rationale: 虽不改变基本意义，但“四十天四十夜”更直接、完整地再现源文及英文审校文本。
