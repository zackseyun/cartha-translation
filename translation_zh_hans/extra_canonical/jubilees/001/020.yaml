  text: ወፍጥር፡ ሎሙ፡ መንፈሰ፡ ርቱዐ፡ ወኢ*ይኰንንዎሙ፡²⁰ መንፈሰ፡ ቤልሖር፡ ለአስተዋድዮቶሙ፡ ቅድሜከ፡ ወለአዕቅጾቶሙ፡ እምኵሉ፡ ፍኖተ፡²¹ ጽድቅ፡ ከመ፡ ይትሐጐሉ፡²² እምቅድመ፡ ገጽከ። ወእሙንቱ፡ ሕዝብከ፡²³ ወርስትከ፡ ዘባላህከ፡ በኀይልከ፡ ዐቢይ፡ እምእዴ፡ ግብጽ፤ ፍጥር፡²⁴ ሎሙ፡
