base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/020.yaml
  text: And create for them an upright spirit, and do not let the spirit of Beliar rule over them to accuse them before you and to turn them away from every path of righteousness, so that they perish from before your face. Yet they are your people and your inheritance, whom you delivered by your great power from the hand of Egypt. Create for them
translation:
  language: zh_hans
  text: 求你为他们创造正直的灵；不要让彼列的灵辖制他们，在你面前控告他们，并把他们从一切正义之路上引离，以致他们从你面前灭亡。然而，他们是你的子民，是你的产业；你曾以你的大能把他们从埃及人手中救出。求你为他们创造……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሰ፡ ርቱዐ
  choice: 正直的心灵
  rationale: መንፈስ 可指“灵、心灵”；与“正直”搭配时，“心灵”在现代汉语中既自然，也保留内在属灵倾向的含义。
- source_word: መንፈሰ፡ ቤልሖር
  choice: 彼列的灵
  rationale: 将专名音译为“彼列”，不把它解释性改写为“邪灵”，以保留原文的专名及相关传统背景。
- source_word: ይኰንንዎሙ
  choice: 辖制他们
  rationale: 依语境表达支配、管辖之意；避免采用过强的神学化术语。
- source_word: ለአስተዋድዮቶሙ፡ ቅድሜከ
  choice: 在你面前控告他们
  rationale: 保留法庭式的“控告”意象及“在你面前”的空间—司法表达。
- source_word: ለአዕቅጾቶሙ፡ እምኵሉ፡ ፍኖተ፡ ጽድቅ
  choice: 使他们偏离一切正义之路
  rationale: 按修订证据理解为使人转离道路；“正义之路”兼顾宗教伦理含义与现代可懂度。
- source_word: ሕዝብከ፡ ወርስትከ
  choice: 你的子民，是你的产业
  rationale: 分别保留“人民/子民”与“继承所得、产业”的盟约性意象。
- source_word: ባላህከ፡ በኀይልከ፡ ዐቢይ
  choice: 你曾以大能……救出
  rationale: 以自然汉语表达凭巨大能力施行拯救；“救出”符合出埃及语境。
- source_word: እምእዴ፡ ግብጽ
  choice: 从埃及人手中
  rationale: “从……手中”保留闪语式权势意象；“埃及”在此可转喻埃及人或埃及势力。
theological_decisions:
- issue: “彼列的灵”是专名性存在还是泛指邪恶倾向
  choice: 保留“彼列的灵”
  alternative: 邪恶的灵
  rationale: 原文明确使用彼列这一名称；翻译不应预先裁定其本体性质。
- issue: መንፈስ 在首句指人的内在心志还是独立的灵
  choice: 译作“心灵”
  alternative: 灵
  rationale: “造一颗正直的心灵”能传达内在更新，同时不完全排除属灵层面；若直译“造一个正直的灵”，现代汉语容易被理解成独立灵体。
- issue: 末尾重复“求你为他们造”是不完整句还是应从下节补足
  choice: 保留未完结构并加省略号
  alternative: 从下一节补全宾语
  rationale: 所给经节文本在此处断开；不擅自把下一节内容并入本节。
- issue: 表示因果目的的灭亡从句
  choice: “以致从你面前灭亡”
  alternative: “免得他们从你面前灭亡”
  rationale: 原文连词按现有文本证据呈目的/结果方向，虽神学上形成张力，仍不改写为相反的预防性含义。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“求你”补出祈使语气，使中文自然；保留“正义之路”“你的产业”“从……手中”等原文意象。经节结尾显然跨入未完句，故用省略号标示，不补入下一节。
