  timestamp: '2026-07-14T09:55:02Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实保留了祈求、彼列的灵的辖制／控告、偏离义路、以色列作为上帝子民与产业、以及从埃及之手蒙拯救等内容。惟首句“造一颗正直的心灵”将原文的“灵”译成带量词的“心灵”，在汉语中不够贴合，也弱化了原文保留的“灵”之语义开放性。
  naturalness: 祈祷体庄重通顺；但“造一颗……心灵”不合现代汉语惯用搭配。“使他们偏离一切正义之路”可更明确地表明其施事是彼列的灵，而非造成句法歧义。
  terminology: “彼列”作为专名、 “控告”、“子民”、“产业”及“大能”均可保留。“正直的灵”比“正直的心灵”更直接对应መንፈስ，并避免预断其仅指人的内在心理状态。
  issues:
  - severity: medium
    issue: “一颗正直的心灵”对“正直的灵”的表达不够准确且搭配生硬。
    rationale: 原文使用መንፈስ（灵），并未限定为“心灵”；“一颗心灵”也不是自然的现代汉语量词搭配。改作“正直的灵”可保留原文的语义开放性与庄重祈祷语体。
  - severity: low
    issue: “使他们偏离”在长串兼语结构中施事略显含混。
    rationale: 原文意为彼列的灵控告他们并使他们离开一切义路。改为“把他们从一切正义之路上引离”更清楚呈现该灵的作用，同时不增加解释。
  revised_text: 求你为他们创造正直的灵；不要让彼列的灵辖制他们，在你面前控告他们，并把他们从一切正义之路上引离，以致他们从你面前灭亡。然而，他们是你的子民，是你的产业；你曾以你的大能把他们从埃及人手中救出。求你为他们创造……
