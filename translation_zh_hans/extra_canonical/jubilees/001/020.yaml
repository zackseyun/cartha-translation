revisions:
- from: 求你为他们造一颗正直的心灵，不要让彼列的灵辖制他们，在你面前控告他们，使他们偏离一切正义之路，以致从你面前灭亡。他们毕竟是你的子民，是你的产业；你曾以大能把他们从埃及人手中救出。求你为他们造……
  to: 求你为他们创造正直的灵；不要让彼列的灵辖制他们，在你面前控告他们，并把他们从一切正义之路上引离，以致他们从你面前灭亡。然而，他们是你的子民，是你的产业；你曾以你的大能把他们从埃及人手中救出。求你为他们创造……
  rationale: 修订首句以“正直的灵”对应原文መንፈስ，删除不自然且语义较窄的“一颗……心灵”。将“使他们偏离”调整为“把他们从……引离”，明确其仍受“彼列的灵”支配，忠实反映原文与英语审校轨迹的“turn them away”。保留经节末尾未完成的重复祈求，并以省略号标明其跨节延续；未补入下一节。
