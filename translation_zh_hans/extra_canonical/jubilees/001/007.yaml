base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/007.yaml
  text: and they will know that I have been with them. And you, write down for yourself all the words that I make known to you today, for I know their rebellion and their stiff neck before I bring them into the land that I swore to their fathers—to Abraham, Isaac, and Jacob—saying, ‘To your seed I will give the land that flows with milk and honey.’ And they will eat and be satisfied.
translation:
  language: zh_hans
  text: 他们就会知道，我曾与他们同在。你要把我今日使你知道的一切话都写下来；因为在我把他们领进那地以前，我已经知道他们的悖逆和他们硬着的颈项。那地是我向他们的祖先——亚伯拉罕、以撒和雅各——起誓应许的；我曾说：‘我要把那流奶与蜜之地赐给你们的后裔。’他们必吃得饱足。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀለው፡ ኮንኩ፡ ምስሌሆሙ
  choice: 我一直与他们同在
  rationale: 原文表达“我曾经/一直与他们同在”，用“一直”自然传达完成性和持续关联，不额外加入“真正”等强调语。
- source_word: ምረተሙ
  choice: 他们的悖逆
  rationale: 该词在语境中指反抗、背叛；“悖逆”既保留宗教文本的庄重语气，也为现代读者所理解。
- source_word: ክሳዶሙ፡ ደቡበ
  choice: 顽梗
  rationale: 字面意象是“颈项僵硬”；正文采用汉语经文传统中自然凝练的“顽梗”，避免生硬直译。
- source_word: ለዘርእክሙ
  choice: 你们的后裔
  rationale: 原词字面为“种子”，在给列祖的群体性应许中指后代；译作“后裔”自然且不预先限定单数或特定神学指涉。
- source_word: ምድረ፡ እንተ፡ ትውሕዝ፡ ሐሊበ፡ ወመዓረ
  choice: 那流奶与蜜之地
  rationale: 保留原文定指的“那地”和“流奶与蜜”的惯用意象，兼顾准确、庄重与可读性。
- source_word: ወይበልዑ፡ ወይጸግቡ
  choice: 他们将吃得饱足
  rationale: 直接保留“吃”和“饱足”两个动作，未将其解释性扩展为繁荣或富足。
theological_decisions:
- issue: “后裔/种子”的数与神学指向
  choice: 你们的后裔
  alternative: 你们的子孙／你的后裔
  rationale: 源词可作集合名词。此处话语列举亚伯拉罕、以撒、雅各，并以复数受词形式表达“你们的”，故正文保留群体性，不将其专门化为某一个人。
- issue: “顽梗”的身体隐喻
  choice: 正文采用“顽梗”
  alternative: 硬着颈项／颈项刚硬
  rationale: “顽梗”传达拒绝顺服的含义，同时避免因逐字翻译而造成现代汉语不自然；未进一步解释其道德或盟约含义。
- issue: “我与他们同在”的时态与力度
  choice: 我一直与他们同在
  alternative: 我曾与他们同在／我确实与他们同在
  rationale: 保留原文完成表达的既往事实及其持续关联，不加入“确实、真正”等原文没有的强化。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。保留“悖逆”“起誓”“后裔”“流奶与蜜”等适合古代宗教叙事的词语；通过“这时，我还没有……”处理原文“在我把他们领进……以前”的长句关系，使中文层次清晰，并避免把“知道他们的悖逆”误解为仅在进入土地之前才知道。
