revisions:
- from: 那位在以色列营前行走的临在天使，取了记载年岁划分的版：从创造之时起，律法和见证，以及他们各禧年的七年期，逐年按其全部数目，还有逐年计算的禧年；从创造之日，直到天地和其中一切受造之物照着天上的诸般能力和地上的一切创造而得更新的那日；直到耶和华的圣所在耶路撒冷的锡安山上被造，所有光体也都得更新，为要使以色列所有蒙拣选的人得医治、平安和福分；并使这一切从那日起，在大地存留的一切日子里始终如此。
  to: 那位走在以色列营前的临在天使，拿起记载年岁划分的版；上面记着从创造之时起的律法和见证、他们禧年的周数及其逐年全数，又记着从创造之日起逐年的禧年，直到天地和其中一切受造之物照着天上的诸能力和地上一切受造之物得更新、耶和华的圣所在耶路撒冷的锡安山上被造、所有光体为使以色列所有蒙拣选的人得医治、平安和福分而更新的那日；并使这一切从那日起，在大地的一切日子里始终如此。
  rationale: 修订不改变段落所陈述的历法记录与末世更新次序；主要撤除“七年期”这一未经文本明示的具体化，并调整长句的汉语统摄关系。“使这一切……始终如此”保留末句“如此”的宽泛回指，不将其限定为仅指医治、平安和福分。
