base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/029.yaml
  text: And the angel of the presence, who went before the camp of Israel, took the tablets of the divisions of the years from the time of creation, of the law and of the testimony, of the weeks of their jubilees, year by year in all their number, and the jubilees year by year, from the day of creation until the day when the heavens and the earth and all their creatures will be renewed according to the powers of heaven and according to all the creation of the earth, until the sanctuary of Yahweh is created in Jerusalem on Mount Zion, and all the lights are renewed for healing and for peace and for blessing for all the chosen of Israel, and that it may be thus from that day and throughout all the days of the earth.
translation:
  language: zh_hans
  text: 那位走在以色列营前的临在天使，拿起记载年岁划分的版；上面记着从创造之时起的律法和见证、他们禧年的周数及其逐年全数，又记着从创造之日起逐年的禧年，直到天地和其中一切受造之物照着天上的诸能力和地上一切受造之物得更新、耶和华的圣所在耶路撒冷的锡安山上被造、所有光体为使以色列所有蒙拣选的人得医治、平安和福分而更新的那日；并使这一切从那日起，在大地的一切日子里始终如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: 临在天使
  rationale: 字面为“面／面前的天使”，在《禧年书》的固定称谓中指侍立于神面前、代表神临在的天使；“临在天使”既自然，也保留其职分意味。
- source_word: ጸላተ፡ ዘክፋሌ፡ ዓመታት
  choice: 记载年岁划分的版
  rationale: ጸላት 指版或书写版，ክፋሌ 指划分、分段；译文保留历法被划分并记录在版上的含义。
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: 他们各禧年的七年期
  rationale: ሱባዔ 可指“七”或七年周期；在禧年历法语境中用“七年期”，并保留“他们的”这一代词关系。
- source_word: ኢዮቤሌዎን
  choice: 禧年
  rationale: 采用现代中文圣经及犹太历法语境中通行的名称。
- source_word: ይትኃደስ / ይትኄደሱ
  choice: 得更新
  rationale: 原文是被动／反身形态，表达天地、受造物及光体进入更新状态，不额外指定施动者。
- source_word: ኀይላቲሆሙ፡ ለሰማይ
  choice: 天上的诸般能力
  rationale: 保留“能力／权能”的复数含义，不擅自把它具体化为天使、星辰或自然规律。
- source_word: ብርሃናት
  choice: 光体
  rationale: 复数词字面为“众光／发光者”；此处宇宙更新语境较可能指天上光体，故用“光体”而非抽象的“光明”。
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 该吉兹语神名／尊称在中文圣经传统中通常对应“耶和华”；此处采用普通读者最熟悉的专名形式。
- source_word: ኵሉ፡ መዋዕለ፡ ምድር
  choice: 在大地存留的一切日子里
  rationale: 字面接近“地的一切日子”；此译表达“只要大地尚存”的持续时间，同时避免误解为地球自身拥有日子。
theological_decisions:
- issue: 圣所的末世性“被造”
  choice: 耶和华的圣所……被造
  alternative: 耶和华的圣所……被建立／建造
  rationale: 原文使用“创造”词根的被动式，而不只是普通建筑用语；直译保留圣所与宇宙更新之间的神学联系及其不寻常表达。
- issue: 天地更新所依照的对象
  choice: 照着天上的诸般能力和地上的一切创造
  alternative: 照着天军和地上一切受造物的样式
  rationale: 原文结构存在语义张力；不把“能力”解释成某类位格存在，也不补出“样式”，以保留其概括性。
- issue: 末句所指范围
  choice: 使这一切……始终如此
  alternative: 使医治、平安和福分……长存
  rationale: 原文“如此”可能回指紧邻的福分，也可能涵盖整个更新景象；“这一切”保留较宽的回指范围，不将其缩窄。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。原句极长且层层延展，译文以冒号、分号划分历法记录、宇宙更新、圣所与福分几个层次，同时维持其单一宏大句式。保留“被造”“诸般能力”等原文中不寻常而具有神学张力的措辞，未作宗派化解释。
