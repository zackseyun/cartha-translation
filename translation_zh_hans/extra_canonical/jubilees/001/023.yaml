  text: and I will cut off the foreskin of their heart and the foreskin of the heart of their seed, and I will create for them a holy spirit, and I will cleanse them so that they do not turn away from following me from that day and forever.
translation:
  language: zh_hans
  text: 我要割去他们心里的包皮和他们后代心里的包皮；我要为他们创造一个圣洁的灵，并洁净他们，使他们从那日起直到永远跟从我，不再转离我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个圣洁的灵”也可译作“圣灵”；“跟从我，不再转离我”直译为“不从我身后转离”。
    reason: 保留“圣洁的灵／圣灵”的可能歧义，并说明原文“从我身后”的空间性及跟随隐喻。
lexical_decisions:
- source_word: ቍልፈተ፡ ልቦሙ፡ ወቍልፈተ፡ ልበ፡ ዘርኦሙ
  choice: 他们心里的包皮……他们后代心里的包皮
  rationale: ቍልፈት直指“包皮／未受割礼的状态”，呼应“心受割礼”的圣经意象；不以“遮盖”弱化其具体而强烈的隐喻。
- source_word: እፈጥር፡ ሎሙ፡ መንፈሰ፡ ቅዱሰ
  choice: 我要为他们造一个圣洁的灵
  rationale: 保留“创造／造”（ፈጠረ）的主动意义，并将መንፈስ ቅዱስ按此处无明确专名标志的语境译作“一个圣洁的灵”，避免径自确定为专名“圣灵”。
- source_word: እነጽሖሙ
  choice: 洁净他们
  rationale: 准确表达使之洁净、清净的使役意义。
- source_word: ኢይትመየጡ፡ እምድኅሬየ
  choice: 不再转身离开，不跟从我
  rationale: 原文含“转回／转离”以及“从我后面”的空间性表达；汉语以“不再转身离开，不跟从我”保存转离与停止跟从两层意味。
- source_word: እምይእቲ፡ ዕለት፡ እስከ፡ ለዓለም
  choice: 从那日起直到永远
  rationale: 自然而贴切地再现起始时间与永久延续。
theological_decisions:
- issue: “心里的包皮”这一圣经神学隐喻
  choice: 直译为“割去……心里的包皮”
  alternative: “除去他们心上的遮盖”
  rationale: 直译保留割礼意象及其神学分量；替代译法虽较委婉，却会遮蔽原文与申命记、耶利米书相关表达的联系。
- issue: መንፈሰ ቅዱሰ是否应作为专名
  choice: 一个圣洁的灵
  alternative: 圣灵
  rationale: 原文可被理解为“圣洁的灵”，也可能使读者联想到“圣灵”；正文不强行消除这种语法与神学张力，脚注提示另一种理解。
- issue: “从我后面转离”的关系性含义
  choice: 不再转身离开，不跟从我
  alternative: 不再离开我
  rationale: 正文明确呈现跟随者从身后转离的图景，而不是只保留一般性的离弃含义。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“心里的包皮”虽不委婉，却忠实保留原文的割礼隐喻；句式以分号划分更新、赐灵、洁净及恒久跟从等动作。
