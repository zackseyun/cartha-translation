  yaml_path: translation/extra_canonical/jubilees/001/006.yaml
  text: 'today for their generations on Mount Sinai.” And so it will be: when all these things come upon them, they will know that I am more righteous than they are in all their judgments and in all their deeds,'
translation:
  language: zh_hans
  text: “今日在西奈山上，为他们的世世代代[a]。”事情将会如此：当所说的这一切临到他们时，他们就会知道，在他们一切的裁断和一切的行为上，我都比他们公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今日”也可按句读与上一节相连；原文在此处的短语连接较为紧密。
    reason: 原文词序与分节可能使“今日”归属前句或本句；脚注保留这种句法和分节上的可能性。
lexical_decisions:
- source_word: ዮም
  choice: 今日
  rationale: 直接保留原文的时间副词“今日”，避免像早期译文那样遗漏。
- source_word: ለትውልዶሙ
  choice: 为他们世世代代
  rationale: 表达“为他们的各代／后世”，用现代汉语中自然且庄重的习语呈现其延续性。
- source_word: ይመጽእ፡ ኵሉ፡ ዝነገር፡ ላዕሌሆሙ
  choice: 当所说的这一切临到他们时
  rationale: 保留“临到他们”的事件性，并将关系表达明确为“所说的这一切”，不额外界定其具体内容。
- source_word: ፍትሖሙ
  choice: 他们一切的裁断
  rationale: 该词可涉及审断、判决或公正；“裁断”保留司法和道德判断两方面的语感。
- source_word: ጻድቅ፡ እምኔሆሙ
  choice: 我都比他们公义
  rationale: 按比较结构直译为“比他们公义”，保留说话者与他们之间的道德对比。
- source_word: ምግባሮሙ
  choice: 他们一切的行为
  rationale: 采用涵盖行为、作为和实践的常用表达，不将其限缩为善行或恶行。
theological_decisions:
- issue: 说话者的公义与受审者之裁断、行为的比较
  choice: 我都比他们公义
  alternative: 我在他们一切的裁断和行为上都是公义的
  rationale: 原文含比较意味；主译保留“比他们”，不把张力弱化为单纯宣告说话者公义。
- issue: “这一切”的性质
  choice: 所说的这一切
  alternative: 这一切灾祸
  rationale: 原文只说“所说的／被宣告的一切”，没有在本句明言全是灾祸，因此不作神学性增补。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“世世代代”“临到”“公义”保留经文语体；“裁断”比“判断”更能承载原词的司法意味。主文本中的引号显示本节开头承接上一节的话语。
