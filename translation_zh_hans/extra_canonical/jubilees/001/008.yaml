  text: and they will turn to foreign gods, to those who cannot deliver them from any of their distress.
translation:
  language: zh_hans
  text: 他们必转向外邦的神明，就是那些不能救他们脱离任何患难的神明。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“不能救他们脱离一切患难”。这里的否定与“一切”连用，意思是他们不能救人脱离任何患难。
    reason: 说明否定辖域下“任何”与原文“一切”的对应关系，避免读者误解为只能救人脱离部分患难。
lexical_decisions:
- source_word: ይትመየጡ
  choice: 必转向
  rationale: 表达该动词“转向、归向”的将来含义；“必”符合预告性语境。
- source_word: አምላክ፡ ነኪር
  choice: 外邦的神明
  rationale: ነኪር意为“外来的、异族的、陌生的”；在偶像崇拜语境中，“外邦的神明”自然且保留其异己性质。
- source_word: ኢያድኅንዎሙ
  choice: 不能救他们脱离
  rationale: 保留否定、施救对象及“从……中搭救”的语义。
- source_word: እምኵሉ፡ ምንዳቤሆሙ
  choice: 脱离任何患难
  rationale: 原文直译近于“脱离他们一切的患难”；在否定辖域内，现代汉语用“不能……脱离任何患难”更清楚地表达完全无力施救，而不暗示只能救一部分。
theological_decisions:
- issue: 外邦神明是否具有真实救赎能力
  choice: 不能救他们脱离任何患难
  alternative: 不能救他们脱离一切患难
  rationale: 选择“任何”明确表达这些神明全然不能施救；不对其本体地位作超出原文的说明。
- issue: “那些”的指代
  choice: 以“就是那些……的神明”明确回指外邦神明
  alternative: 转向那些不能救他们……的外邦神明
  rationale: 原文重复介词结构，所指仍是前述外邦神明；当前译法既保留解释性复指，也避免误指人。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“神明”避免把异教对象误写成独一上帝的专名；“患难”兼顾宗教文本语体与日常可理解性。
