  text: And I will send witnesses to them so that I may testify to them, but they will not listen; and they will also kill the witnesses, and they will drive away those who seek the law, and they will overturn everything and begin to do evil.
translation:
  language: zh_hans
  text: 我必差遣见证人到他们那里，好向他们作证；但他们不肯听。他们还要杀害这些见证人，驱逐那些寻求律法的人，推翻一切，开始作恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕተ
  choice: 见证人
  rationale: 该词在本节指被差遣、向百姓作证的人；译作“见证人”既保留其身份，也与下文“杀害这些见证人”呼应。
- source_word: አስምዕ
  choice: 向他们作证
  rationale: 该使役形式与“使人听见／宣告”有关，在此语境中与“见证人”构成词义呼应；“作证”符合整句功能，又不添加见证内容。
- source_word: ኢይሰምዑ
  choice: 不肯听
  rationale: 原文直义为“不听”；汉语“不肯听”自然表达持续拒绝听从的语境，而不将其弱化为单纯没有听见。
- source_word: ሕገ
  choice: 律法
  rationale: 此处指作为规范与启示的法律／律法；“律法”符合犹太宗教文献语境，且不限定为某一条具体诫命。
- source_word: ይሰድድዎሙ
  choice: 驱逐
  rationale: 该动词可含赶逐、追逼或迫害之意；“驱逐”贴近本句使寻求律法者离开的动作，同时不额外强化为系统性迫害。
- source_word: ያፀርዑ
  choice: 废弃
  rationale: 该词在此表达使之失效、破坏既有秩序的意思；“废弃一切”比泛化的“改变一切”更能保留其否定和毁坏色彩。
- source_word: ይዌልእ
  choice: 开始
  rationale: 按其起始义直译为“开始”，与后接“作恶”构成自然汉语。
theological_decisions:
- issue: 见证的方向与功能
  choice: 向他们作证
  alternative: 作证指控他们
  rationale: 原文表达差遣见证人并使百姓听见见证，但未在本节明确加入司法性的“指控”；正文保留较中性的“向他们作证”，避免提前限定见证只具定罪功能。
- issue: “律法”的范围
  choice: 不具体说明其所指范围
  alternative: 明确译为“摩西律法”或“上帝的律法”
  rationale: 原文仅用“律法”，没有附加限定；保留其开放范围可避免输入经文没有明说的神学界定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号和短句呈现原文连续推进的预言性动作；保留“见证人／作证”的词义呼应，并避免加入原文未明说的对象、动机或结果。
