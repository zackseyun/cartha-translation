  yaml_path: translation/extra_canonical/jubilees/001/011.yaml
  text: And they will make for themselves high places and groves and carved images, and they will bow down, each to his own error, and they will sacrifice their children to demons and to every work of the error of their hearts.
translation:
  language: zh_hans
  text: 他们要为自己建造丘坛、神木和雕像；各人都要跪拜自己的迷误，并把自己的儿女献给鬼魔，也献给他们心中迷误的一切作为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐታተ
  choice: 丘坛
  rationale: 依本节语境及英译所保存的传统理解，指供异教祭祀使用的高处或高地圣所；译作“丘坛”兼顾准确与中文宗教文本中的可读性。
- source_word: ወግልፎ
  choice: 神木
  rationale: 与丘坛、雕像并列，宜理解为祭祀用的树丛或木柱；“神木”比现代汉语中的“树林”更能显出其崇拜用途，同时不强行限定为某一特定神祇的柱像。
- source_word: ስሒት
  choice: 所迷信的
  rationale: 原词涉及错误、迷误或偏离；在“跪拜”之后用名词化短语表达其崇拜对象实属谬误，同时保留“各自”所指的分散性。
- source_word: አጋንንት
  choice: 鬼魔
  rationale: 指邪灵或鬼类；“鬼魔”是自然、庄重且易懂的现代中文宗教用语。
- source_word: ግብረ፡ ስሕተት፡ ልቦሙ
  choice: 心中谬误所生的一切行为
  rationale: 尽量保存“他们心中的错误/迷误”与“行为”之间的修饰关系，又避免生硬直译。
theological_decisions:
- issue: “各自跪拜自己所迷信的”究竟指各人的偶像，还是各人的谬误
  choice: 保留“各自”与“迷误”之间的关联，不具体化为某一类偶像
  alternative: 他们各自跪拜自己的偶像
  rationale: 源文及咨询层均强调“各自的错误/迷误”；译为“偶像”会把原有的抽象神学判断具体化，缩小其语义范围。
- issue: 献儿女给鬼魔的祭祀性质
  choice: 译作“献给”，不补入“焚烧”或“杀害”
  alternative: 把自己的儿女杀献给鬼魔
  rationale: 动词表达献祭，但本句未明确祭献方式；应保留其严厉含义而不添加源文没有明说的细节。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“丘坛—神木—雕像”保持并列；后半句以“又投身于”表达对一切错误行为的实行，避免逐词硬译造成歧义。正文无脚注，因此没有脚注标记。
