  text: And every angel and every spirit will know that these are my children, and that I am their Father in uprightness and righteousness, and that I love them.
translation:
  language: zh_hans
  text: 所有天使和所有灵都将知道：他们是我的儿女；我是他们的父，秉持正直和公义；并且我爱他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ መላእክ፡ ወኵሉ፡ መንፈስ፡
  choice: 每一位天使和每一个灵
  rationale: 逐项保留原文“所有/每一……天使”和“所有/每一……灵”的并列与周延性；“位”用于天使，使现代汉语自然庄重。
- source_word: ወያአምርዎሙ፡
  choice: 都会知道
  rationale: 按原文未来时态表达，并以“都”承接前面的两个全称短语。
- source_word: እሙንቱ፡ ውሉድየ፡
  choice: 他们是我的儿女
  rationale: “儿女”自然表达复数“孩子/子女”，不额外引入性别限定。
- source_word: ወአነ፡ አቡሆሙ፡
  choice: 我……作他们的父
  rationale: 保留父亲意象；采用“作他们的父”以便与后续方式性短语自然衔接。
- source_word: በርቶዕ፡ ወበጽድቅ፡
  choice: 以正直和公义
  rationale: 保留两个并列的伦理—神学概念及介词形式，不将二者合并或解释为同义反复。
- source_word: ወአፈቅርሙ፡
  choice: 并且我爱他们
  rationale: 直接保留第一人称的爱与宾语，不增添程度或方式。
theological_decisions:
- issue: “以正直和公义”与父子关系的句法关联
  choice: 我以正直和公义作他们的父
  alternative: 我是他们正直而公义的父
  rationale: 原文以介词性表达“在/以正直和公义”修饰父亲身份或其施行方式；正文保留方式性张力，避免直接把两个名词改写为形容父本性的属性。
- issue: 受造灵界对神子民身份的认识
  choice: 每一位天使和每一个灵都会知道
  alternative: 所有天使和所有灵都认识
  rationale: “知道”较准确地传达认知陈述，不把它神学化为关系性的“认识”；同时不补入已由修订删除、且不见于本节吉兹文本的内容。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。句式紧贴吉兹文的并列推进，同时避免生硬直译；本节无需脚注。
