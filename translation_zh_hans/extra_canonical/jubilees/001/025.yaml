revisions:
- from: 每一位天使和每一个灵都会知道，他们是我的儿女，我以正直和公义作他们的父，并且我爱他们。
  to: 所有天使和所有灵都将知道：他们是我的儿女；我是他们的父，秉持正直和公义；并且我爱他们。
  rationale: 修订仅处理“正直和公义”与“父”的汉语连接方式，并略调全称表达和标点以提高现代汉语自然度。没有增添已被英文审计轨迹排除的“永活神的儿女”等内容；“秉持正直和公义”保留原文介词短语在父亲身份／作为上的适度句法开放性。
