  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኮነ
  choice: 事情是这样发生的
  rationale: 对应叙事起始语“于是／事情发生了”，用现代汉语自然承接下文；本节在逗号处未完，故以冒号保留延续性。
- source_word: በቀዳሚ፡ ዓመት
  choice: 第一年
  rationale: 直译时间表达，保持纪年含义。
- source_word: በፀአቶሙ
  choice: 离开
  rationale: 源词表示出去、离去；采用透明的普通词“离开”，不以术语“出埃及”预先强化事件名称。
- source_word: ለደቂቀ፡ እስራኤል
  choice: 以色列子孙
  rationale: 保留闪语式群体称谓及其庄重的经文语体，同时现代读者易懂。
- source_word: እምነ፡ ግብጽ
  choice: 埃及
  rationale: 与“离开”组合表达来源地“离开埃及”。
- source_word: በወርኅ፡ ሣልስ
  choice: 三月
  rationale: 在纪年语境中自然表达“第三个月”，指该年的第三个月，并非现代公历三月。
