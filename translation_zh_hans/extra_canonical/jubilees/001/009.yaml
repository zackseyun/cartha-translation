base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/009.yaml
  text: And this testimony will be heard as a testimony against them. For they will forget all my commandments, everything that I command them, and they will walk after the nations, and after their impurities, and after their shameful things, and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare.
translation:
  language: zh_hans
  text: 这见证必被听见，作为指控他们的证言；因为他们必忘记我的一切诫命，就是我所吩咐他们的一切，并随从列国，随从他们的污秽和可耻之事，侍奉他们的神明。这些神明必成为他们的绊脚石、患难、困苦和网罗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: 见证／证言
  rationale: 此词在句中重复，兼有“见证”与“作证之言”的含义；中文用近义表达保留重复的修辞功能，同时避免生硬。
- source_word: ይረስዑ
  choice: 忘记
  rationale: 直接表达不再记念、遵守上帝诫命的意思，不额外解释为故意背弃。
- source_word: የሐውሩ፡ ድኅረ
  choice: 随从
  rationale: 原文直义为“走在……之后”，现代汉语以“随从”自然传达追随其道路和做法。
- source_word: ርኵሶሙ
  choice: 他们的污秽
  rationale: 保留宗教与道德层面的开放含义，不收窄为某一种具体礼仪不洁。
- source_word: ኀሣሮሙ
  choice: 他们可耻之事
  rationale: 表达原词所含的羞耻、卑劣色彩，同时保持所指对象的概括性。
- source_word: ይትቀነዩ
  choice: 侍奉
  rationale: 适合以神明为对象的服事、崇奉语境，又不擅自添加具体祭祀行为。
- source_word: ማዕቅፈ
  choice: 绊脚石
  rationale: 传达使人跌倒、陷落之物的比喻意义。
- source_word: መሥገርት
  choice: 网罗
  rationale: 保留捕捉、陷害的具体意象，与前面的患难和困苦并列。
theological_decisions:
- issue: “见证”如何成为针对他们的证言
  choice: 作为指控他们的证言
  alternative: 向他们作见证
  rationale: 上下文带有审判性，英文校审层亦明确为 against them；“指控”使中文关系清楚，但不说明见证具体通过何种方式发声。
- issue: “这些”所指为何
  choice: 这些事
  alternative: 这些神明
  rationale: 原文代词的指向存在一定张力；译作“这些事”可涵盖随从污秽、可耻之事及侍奉神明的整体行为，避免武断限定为神明本身。
- issue: 诫命与服从的关系
  choice: 保持“忘记我的一切诫命”原貌
  alternative: 离弃／违背我的一切诫命
  rationale: “忘记”可能蕴含不遵守，但译文不把隐含的伦理后果直接替换为更强的“背弃”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“列国”“诫命”“网罗”等保留经文语体；通过“就是”“给他们带来”理顺句法，避免逐词直译造成晦涩。
