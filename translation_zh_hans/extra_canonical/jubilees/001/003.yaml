  text: The glory of the Lord was upon Mount Sinai, and the cloud overshadowed it for six days. And He called him
translation:
  language: zh_hans
  text: 主的荣耀在西奈山上，云彩笼罩西奈山六天。他便召唤了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“他召唤了他。”按上下文，通常理解为主召唤摩西。
    reason: 保留原文末句的双重代词形式，同时仅在脚注说明其通常的上下文指向。
lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር
  choice: 耶和华的荣耀
  rationale: ስብሐት表示“荣耀、荣光”；እግዚአብሔር在此指以色列的主，译作“耶和华”符合中文圣经叙事中的通常称谓。
- source_word: ውስተ፡ ደብረ፡ ሲና
  choice: 在西奈山上
  rationale: ውስተ在此表达位置，ደብር为“山”；用“在……山上”自然传达空间关系。
- source_word: ጸለሎ፡ ደመና
  choice: 云彩遮盖了山
  rationale: 动词表达遮蔽、笼罩；宾语代词所指最自然地回指西奈山，正文将其明确为“山”，避免现代汉语中代词指向含混。
- source_word: ስዱሰ፡ ዕለተ
  choice: 六天
  rationale: 直译为“六日”，现代叙事中“六天”更自然，意义不变。
- source_word: ወጸውዖ
  choice: 随后，他呼唤摩西
  rationale: 该形式表示“并且/于是他呼唤他”；结合紧邻语境，主语为耶和华，宾语为摩西。用“随后”承接叙事，并在正文中明确宾语。
theological_decisions:
- issue: 末句主宾语均以代词表达
  choice: 正文作“他呼唤摩西”，并以脚注保留原文形式
  alternative: 直译作“他呼唤他”
  rationale: 孤立直译会使现代读者难以辨认第二个代词的指向；上下文清楚表明受呼唤者是摩西。脚注保留原文的代词表达，避免掩盖形式上的含混。
- issue: 神名እግዚአብሔር的译法
  choice: 耶和华
  alternative: 主
  rationale: 此处叙述西奈山显现，以“耶和华”明确指称以色列的神，同时不增加原文以外的教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“云彩遮盖了山”避免连续使用“它”造成指代不清；“随后”使并列叙事衔接顺畅。
