base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/026.yaml
  text: And I will write down for you all these things that I am making known to you on this mountain, what is first and what is last and what is to come, in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees forever, until I descend and dwell with them throughout all the ages of eternity.”
translation:
  language: zh_hans
  text: “我要为你写下这一切，就是我正在这山上向你显明的：起初的、末后的和将要发生的事；按照律法、见证、各七期[a]和禧年的一切日子划分，直到永远，直到我降临，与他们同住，直到万世无穷。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各七期”直译为“七个一组的时期”或“周”。在本书的禧年历法语境中，通常可指七年为一组的周期；原文此处与“禧年”的具体句法关系不宜过度限定。
    reason: 避免把原文的七期词在正文中直接确定为“七年期”，同时说明其在禧年历法语境中的通常理解。
lexical_decisions:
- source_word: ኵሎ፡ ዘንተ፡ ነገረ
  choice: 这一切
  rationale: ነገረ在此泛指所启示的全部内容，译作“这一切”比限定为“这些话”更自然，也避免缩窄所指。
- source_word: አየድዐከ
  choice: 向你显明
  rationale: 该动词为未完成式，适合表达正在进行的启示；“显明”保持庄重，也符合神向摩西启示的语境。
- source_word: ዘቀዳሚ፡ ወዘደኃሪ፡ ዘይመጽእ፡ ሀሎ
  choice: 起初的、末后的和将要发生的事
  rationale: 依次保留“先/初”“后/末”及“将来”的三项结构，不把其含义解释得过窄。
- source_word: ዙፋቤ፡ መዋዕል
  choice: 日子的一切划分
  rationale: 直译其时间被分段、划分的概念，与本书历法结构相符，同时不额外解释具体制度。
- source_word: በሕግ፡ ወዘበስምዕ
  choice: 按着律法、见证
  rationale: 保留原文两个并列的宗教法律术语；“见证”不改释为“约”或“法版”。
- source_word: በሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: 禧年各七年期
  rationale: ሱባዔ意为七个一组或七年期，所属关系指向禧年；译文明确其历法单位而不把它误作普通星期。
- source_word: በኵሉ፡ ዓለመ፡ ዓለም
  choice: 世世无穷
  rationale: 采用自然庄重的汉语惯用表达，传达贯穿一切永恒世代之意。
theological_decisions:
- issue: 神降临并与“他们”同住的对象及方式
  choice: 直到我降临，与他们同住
  alternative: 直到我下来，在他们中间居住
  rationale: 紧贴第一人称神圣发言，保留“他们”的指代开放性，也不把“降临”具体解释为某一种神学事件。
- issue: 启示动作的时态和体貌
  choice: 我在这山上向你显明的
  alternative: 我在这山上已经向你显明的
  rationale: 原文动词为未完成式，宜保留正在展开或一般性的启示意义，不译成明确完成体。
- issue: “律法”与“见证”的关系
  choice: 律法、见证
  alternative: 律法的见证
  rationale: 原文以连接词并列两项；保持并列可避免将“见证”从属于“律法”。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。保留原文长句及时间层层展开的结构，但以冒号和分号厘清范围；避免加入宗派性解释。
