  yaml_path: translation/extra_canonical/jubilees/001/022.yaml
  text: and they will not listen until they acknowledge their sin and the sins of their fathers. And after this they will turn to me in all uprightness and with all their heart and with all their soul,
translation:
  language: zh_hans
  text: 他们必不听从，直到承认自己的罪和祖先的罪。此后，他们必以完全的正直，全心全魂地归向我，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢይሰምዑ
  choice: 他们必不听从
  rationale: 保留否定及将来语气；这里的“听”含有听从之意，译作“听从”更符合现代汉语语境。
- source_word: ያአምሩ
  choice: 承认
  rationale: 在“罪”的宾语语境中，此词不仅指知道，也指认识并承认。
- source_word: ኀጢአቶሙ፡ ወኀጣውአ፡ አበዊሆሙ
  choice: 自己和祖先所犯的罪
  rationale: 自然呈现“他们的罪和他们父辈的罪”，并保留两代人的罪责区别。
- source_word: ይትመየጡ፡ ኀቤየ
  choice: 归向我
  rationale: 准确表达转回、归回到说话者这里的悔改性动作。
- source_word: በኵሉ፡ ርቱዕ
  choice: 以完全正直的心
  rationale: 源文直义近于“以一切正直”；加入“心”使中文自然，但不把正直具体化为某种宗派性概念。
- source_word: በኵሉ፡ ልብ፡ ወበኵሉ፡ ነፍስ
  choice: 全心全意地
  rationale: 现代汉语惯用表达，传达“以全部的心和全部的魂/生命”；“全意”在此承载全人的内在投入。
theological_decisions:
- issue: “听”与“听从”的语义范围
  choice: 听从
  alternative: 听见
  rationale: 上下文描述顽梗及后来悔改，重点是拒绝顺服而非听觉能力。
- issue: “知道/认识罪”是否译为认罪
  choice: 承认……所犯的罪
  alternative: 认识到……的罪
  rationale: “承认”保留认识并面对罪责的含义，又避免扩写成礼仪性或制度性的“认罪”。
- issue: “全魂”的表达
  choice: 全心全意
  alternative: 尽心尽性
  rationale: “全心全意”更符合普通现代读者的语言习惯，也表达全人的归向；未采用带有既定经文套语色彩的表达。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。源文开头的“他们的颈项”应属上一节“硬着颈项”之句的分节残片，因此本节不译入。句末保留逗号，以对应原文尚未结束的句法并衔接下一节。
