  yaml_path: translation/extra_canonical/jubilees/001/027.yaml
  text: And he said to the angel of the presence, “Write for Moses from the beginning of creation until the time when my sanctuary will be built in their midst forever and ever, and the Lord will appear to the eyes of all.”
translation:
  language: zh_hans
  text: 他对临在的天使说：“你要为摩西写下，从创造之初，直到我的圣所建立在他们中间、直到永永远远，并且主显现在众人眼前的时候。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ፡
  choice: 侍立在面前的天使
  rationale: 字面为“面前／临在的天使”。译作“侍立在面前的天使”，既保留其在神面前的身份，也避免生硬的“面容天使”。
- source_word: እምቀዳሚ፡ ፍጥረት፡
  choice: 从创造之初
  rationale: 忠实表达从创造开始的时间起点，现代汉语简洁自然。
- source_word: መቅደስየ፡
  choice: 我的圣所
  rationale: 保留第一人称所属关系及宗教建筑／神圣居所的含义。
- source_word: ለዓለመ፡ ዓለማት፡
  choice: 永永远远
  rationale: 以庄重而通行的汉语表达强调持续至无尽世代。
- source_word: ያስተርኢ፡ እግዚአብሔር፡ ለዐይን፡ ኵሉ፡
  choice: 主必显现在众人眼前
  rationale: 保留“主”“显现”及“所有人的眼目”三项语义，调整为自然的现代汉语语序。
theological_decisions:
- issue: “面前的天使”的身份
  choice: 侍立在面前的天使
  alternative: 临在天使
  rationale: 原文称谓可能指在神面前供职的特殊天使；译文不把它处理成专名，也不附加特定天使学体系。
- issue: 圣所建成与主显现之间的时间关系
  choice: 以“那时”连接，但不进一步说明因果关系
  alternative: 并且主将显现
  rationale: 上下文以“直到……并且……”衔接，可能带有时间关联；“那时”使汉语清楚，同时不宣称圣所建成是主显现的原因。
- issue: 圣所持续时间的修饰范围
  choice: 将“永永远远”理解为圣所建在他们中间的持续状态
  alternative: 把它与后面的主显现一并理解为末世性的总体时段
  rationale: 原文词序紧随圣所建在他们中间之后，最自然地修饰该状态，但不额外限定其神学实现方式。
translation_notes:
  register: 采用现代、庄重且易懂的经书体。引语中的“你要”传达命令语气；避免过度文言化，也不使用带有特定宗派色彩的术语。
