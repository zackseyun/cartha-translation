  rationale: 修订恢复“临在的天使”这一称谓，并重组时间从句，使“直到永永远远”自然地表达圣所在他们中间的持续状态；以“并且”保留主显现与前项的原文并列连接，避免增添“那时”所暗示的更强时间关系。
