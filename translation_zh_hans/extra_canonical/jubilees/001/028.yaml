  - severity: medium
    issue: “也是在锡安山作王的，直到永永远远”句法不完整且王者身份表达偏弱。
    rationale: 原文并列自称为上帝、父和王；汉语宜明确译出“君王”，并将“直到永永远远”自然修饰其王权。
