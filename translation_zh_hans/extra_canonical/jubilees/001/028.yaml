  to: 所有人都必知道：我是以色列的上帝，是雅各众子孙的父，也是永远在锡安山上作王的君王；锡安和耶路撒冷必成为圣洁。”
  rationale: 修订使“王”的自称在现代汉语中完整明确，并将末句恢复为与原文形容性谓语相应的“成为圣洁”，避免将其解释为“圣地”。其余内容及第一人称神谕语气均保留。
