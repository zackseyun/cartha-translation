  text: And all will know that I am the God of Israel and the Father of all the children of Jacob, and king on Mount Zion forever, and Zion and Jerusalem will be holy.”
translation:
  language: zh_hans
  text: 所有人都必知道：我是以色列的上帝，是雅各众子孙的父，也是永远在锡安山上作王的君王；锡安和耶路撒冷必成为圣洁。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያእምር
  choice: 必知道
  rationale: 该动词表示“知道、认识”；结合未完成式语境，以“必知道”自然表达将来含义。
- source_word: አምላከ፡ እስራኤል
  choice: 以色列的上帝
  rationale: 直接保留属格关系和神圣称谓，不添加原文没有的“耶和华”。
- source_word: አብ፡ ለኵሎሙ፡ ደቂቀ፡ ያዕቆብ
  choice: 雅各所有子孙的父
  rationale: 忠实呈现“父”与“雅各所有子孙”的关系，并采用现代汉语自然语序。
- source_word: ንጉሥ፡ በደብረ፡ ጽዮን
  choice: 在锡安山作王的
  rationale: ንጉሥ 可作“王”，介词结构指向锡安山；汉语用“作王”更自然地表达其统治身份。
- source_word: ለዓለመ፡ ዓለም
  choice: 直到永永远远
  rationale: 这是强调永久性的惯用表达；“直到永永远远”既庄重又保留其强化意味。
- source_word: ቅድስት
  choice: 成为圣地
  rationale: 阴性形容词“圣洁的”述说锡安和耶路撒冷；译作“成为圣地”使现代汉语表意清楚，同时不过度具体化其圣洁性质。
theological_decisions:
- issue: 上帝自称为雅各所有子孙的父
  choice: 保留“父”的直接称谓
  alternative: 译作“祖先”或弱化为“保护者”
  rationale: 原文明确使用“父”，应保留其神学张力，不以解释性词语替换。
- issue: 锡安与耶路撒冷的圣洁状态
  choice: 译为“必成为圣地”
  alternative: 译为“必是圣洁的”
  rationale: 前者符合汉语对地点的自然表达；“成为”也反映 ትከውን 的动态含义，但不说明圣洁实现的具体方式。
- issue: 锡安山上的王权主体
  choice: 维持第一人称连续性：“也是……作王的”
  alternative: 改为第三人称“他是在锡安山作王的”
  rationale: 原文从“我是”延续至“王”，主体仍为说话者；不应无据改变人称。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留原文的第一人称神谕语气及“父”“作王”“圣”的神学措辞；不补入所给吉兹语文本中没有的显现句，也不添加宗派性解释。
