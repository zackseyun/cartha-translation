  source_fidelity: 译文总体忠实于所给吉兹语：保留了“以色列的上帝”“雅各众子孙的父”“在锡安山作王直到永远”及锡安、耶路撒冷将为圣的陈述，且未添加英语修订史中已删除的“显现”句。惟“成为圣地”将原文的形容词性“圣洁/为圣”具体化为地点类别，宜避免。
  naturalness: “也是在锡安山作王的，直到永永远远”在句法上悬置，读来不像完整的第一人称自称。改为“也是……作王的君王”可自然清楚地维持说话者为王的意思。
  terminology: “上帝”“父”“锡安”“耶路撒冷”均合宜。“雅各众子孙”比“雅各所有子孙”更符合现代庄重汉语，也准确传达“雅各的所有儿女/后裔”。“圣洁”保留原文的性质陈述，不以“圣地”解释性替代。
