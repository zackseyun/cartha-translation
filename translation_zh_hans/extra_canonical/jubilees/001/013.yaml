  text: before my eyes. And I will hide my face from them, and I will deliver them into the hand of the nations for captivity and for plunder and for devouring, and I will uproot them from the midst of the land, and I will scatter them among the nations.
translation:
  language: zh_hans
  text: 在我眼前。我要向他们掩面，把他们交在列国手中，使他们被掳、被劫掠、被吞灭；我要把他们从这地中连根拔除[a]，使他们分散在列国之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“除掉他们”。
    reason: “连根拔除”反映原动词较强的根除意味；“除掉”是语义较宽、意象较弱的可能译法。
lexical_decisions:
- source_word: አኀብእ ገጽየ እምኔሆሙ
  choice: 我要向他们掩面
  rationale: 直译为“我要把我的脸从他们那里隐藏”；汉语圣经语体以“向他们掩面”自然、凝练地保留拒绝眷顾的意象。
- source_word: እሜጥዎሙ ውስተ እደ አሕዛብ
  choice: 把他们交在列国手中
  rationale: 保留“置于……手中”的支配权隐喻；“列国”对应复数外邦民族。
- source_word: ለፂዋዌ ወለኀብለ ወለተበልዖ
  choice: 使他们被掳、被劫掠、被吞灭
  rationale: 以三个并列被动短语再现原文递进的灾祸清单，并保留“吞吃/吞灭”的强烈形象。
- source_word: አቤስሎሙ እማእከለ ምድር
  choice: 把他们从这地中连根拔除
  rationale: 该动词语势强，具有根除、拔除之义；结合“从地中”采用农业意象鲜明的“连根拔除”，不弱化为一般的“移走”。
- source_word: እዘርዎሙ ማእከለ
  choice: 使他们分散在列国之中
  rationale: “分散”准确表达散播、散置之意；句末“列国”依据英文校勘层和经文结构补足当前所给盖兹语片段在章节切分处省略的宾语。
theological_decisions:
- issue: “掩面”的含义
  choice: 保留“掩面”意象
  alternative: 译作“我不再眷顾他们”
  rationale: 原文表达神隐藏自己的面；直保意象可兼容撤回眷顾、拒绝帮助和施行审判等含义，避免替读者单一定义。
- issue: 灾祸三项的关系
  choice: 并列译为“被掳、被劫掠、被吞灭”
  alternative: 概括为“任人掳掠毁灭”
  rationale: 保留原文三个目的/结果成分及其神学张力，不把神的交付与列国造成的后果压缩为一个笼统动作。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留“列国”“掩面”等必要的经文表达，同时避免过度古雅。开头“在我眼前”承接上一节，因此保留其片段性。
