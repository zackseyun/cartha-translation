  yaml_path: translation/extra_canonical/jubilees/001/015.yaml
  text: and Sabbaths and festivals and jubilees and ordinances. And after this they will turn to me from among the nations with all their heart and with all their soul and with all their strength, and I will gather them from among all the nations, and they will seek me so that I may be found by them. And when they seek me with all their heart and with all their soul, I will reveal to them abundant peace in righteousness, and I will transplant them as an upright planting,
translation:
  language: zh_hans
  text: 以及安息日、节期、禧年和规例。此后，他们必从列国中归向我，尽心、尽性、尽力；我要从列国中招聚他们。他们必寻求我，使我被他们寻见。他们尽心、尽性寻求我的时候，我必在公义中向他们显明丰盛的平安，并将他们移栽为正直的栽种，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትመየጡ፡ ኀቤየ
  choice: 归向我
  rationale: 表达返回、转回到神面前之意；现代汉语自然，也保留属灵与行动层面的含义。
- source_word: አስተጋብኦሙ
  choice: 招聚他们
  rationale: 该使役性动词指聚集、召集；结合“从列国中”的离散背景，译作“招聚”准确而庄重。
- source_word: የኀሡኒ ... እትረከቦሙ
  choice: 寻求我，好让我被他们寻见
  rationale: 保留原文由“寻求”到“被寻见”的结构及其目的或结果张力，不改写成单纯的“找到我”。
- source_word: እከሥት፡ ሎሙ
  choice: 向他们显明
  rationale: 动词含揭开、显露之意；“显明”比“赐给”更贴近原文。
- source_word: በጽድቅ
  choice: 在公义中
  rationale: 保留介词短语的范围或处境含义，不武断限定为工具性的“以公义”或伴随性的“连同公义”。
- source_word: እፈልሶሙ
  choice: 把他们移栽
  rationale: 该词有迁移、移植之义，且上下文先说从列国招聚；“移栽”保留区别于普通“栽种”的迁置含义。
- source_word: ተክለ፡ ርቱዐ
  choice: 使他们成为正直的栽种
  rationale: 保留植物意象和名词结构；“正直”对应道德与秩序上的端正，避免过度解释为“牢固”。
theological_decisions:
- issue: 人的寻求与神使自己可被寻见之间的关系
  choice: 他们必寻求我，好让我被他们寻见
  alternative: 他们必寻求我，也必寻见我
  rationale: 原文保留目的式或结果式表达，未直接将寻见表述为人的自主成就；译文维持这种神人行动之间的张力。
- issue: “在公义中”所修饰的范围
  choice: 我必在公义中向他们显明丰盛的平安
  alternative: 我必向他们显明丰盛的平安与公义
  rationale: 原文以介词短语表达，不宜把“公义”并列成另一项恩赐；同时不进一步界定是神的公义、人的公义还是公义秩序。
- issue: 末句的栽种意象
  choice: 把他们移栽，使他们成为正直的栽种
  alternative: 栽种他们，使他们成为正直的栽种
  rationale: “移栽”与从列国招聚的语境相呼应，也反映该动词区别于普通“栽种”的迁移语义。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“尽心、尽性、尽力”沿用普通读者熟悉的圣经措辞；以“招聚”“显明”“移栽”保留原文动作层次。译文承接上下文，故以“以及”起句，并保留末尾逗号，表明本节句意尚未完结。
