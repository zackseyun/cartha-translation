  to: 以及安息日、节期、禧年和规例。此后，他们必从列国中归向我，尽心、尽性、尽力；我要从列国中招聚他们。他们必寻求我，使我被他们寻见。他们尽心、尽性寻求我的时候，我必在公义中向他们显明丰盛的平安，并将他们移栽为正直的栽种，
