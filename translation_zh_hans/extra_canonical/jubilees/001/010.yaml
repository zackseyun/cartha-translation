revisions:
- from: 许多人必灭亡；他们必被掳，落在仇敌手中，因为他们离弃了我的律例、我的诫命、我约中的节期、我的安息日，以及我在他们中间为自己分别为圣的圣物；他们也离弃了我的帐幕和我的圣所，就是我在大地中央为自己分别为圣、要把我的名立在其上的地方。
  to: 许多人必灭亡；他们必被俘，落在仇敌手中，因为他们离弃了我的律例、我的诫命、我约中的节期、我的安息日、我在他们中间为自己分别为圣的圣物，以及我的帐幕和我的圣所，就是我在大地中央为自己分别为圣、为要把我的名安置在其上的帐幕和圣所。
  rationale: 修订保留原文以“离弃了”统领的全部并列宾语，不再把帐幕和圣所释成单一“地方”。末尾仍使用“其上”，使其所指保持与原文相近的简略性，避免指定为某一特定城市或作额外神学解释。将“被掳”微调为“被俘”，以贴近“被捕获”的基本含义。
