base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/010.yaml
  text: And many will perish, and they will be captured and fall into the hand of the enemy, because they abandoned my ordinances and my commandments and the festivals of my covenant and my Sabbaths and my holy things that I sanctified for myself among them, and my tabernacle and my sanctuary that I sanctified for myself in the midst of the land, so that I might set my name upon it.
translation:
  language: zh_hans
  text: 许多人必灭亡；他们必被俘，落在仇敌手中，因为他们离弃了我的律例、我的诫命、我约中的节期、我的安息日、我在他们中间为自己分别为圣的圣物，以及我的帐幕和我的圣所，就是我在大地中央为自己分别为圣、为要把我的名安置在其上的帐幕和圣所。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሐጐሉ
  choice: 必灭亡
  rationale: 表达毁灭、丧亡之意，并以“必”体现此处预告语气。
- source_word: ይትአኀዙ
  choice: 必被掳
  rationale: 在落入敌手的战争语境中，采用自然且明确的“被掳”，比泛指“被抓住”更贴切。
- source_word: ሥርዐትየ
  choice: 我的律例
  rationale: 保留宗教法规语域，并与后面的“诫命”有所区分。
- source_word: በዓላት፡ ኪዳንየ
  choice: 我约中的节期
  rationale: 保留“节期”与“我的约”之间的属格关系，不将其扩大解释为一般宗教庆典。
- source_word: ቅድሳትየ
  choice: 我的圣物
  rationale: 用“圣物”保留原词可指神圣之物的复数、概括性含义，不擅自限定为圣日或圣所。
- source_word: ደብተራየ
  choice: 我的帐幕
  rationale: 采用熟悉的圣经礼仪建筑用语，与“圣所”并列。
- source_word: አሢም፡ ስምየ፡ ላዕሌሁ
  choice: 把我的名立在其上
  rationale: 较形式地保留“设立/安置我的名在其上”的圣所语言，同时保持现代汉语可读性。
theological_decisions:
- issue: “我的圣物”所指范围
  choice: 保留为概括性的“圣物”
  alternative: 译作“我的圣日”或“我的圣洁之物”
  rationale: 原文在“安息日”之后另列该词，但并未明确限定其具体所指；保留概括性可避免替文本消除歧义。
- issue: “在大地中央”修饰的对象
  choice: 使其主要关联“我的圣所”，并以“地方”承接后续代词
  alternative: 将其理解为同时修饰帐幕和圣所，或直译为“在大地中央，我为自己分别为圣”
  rationale: 原文关系链以“我的帐幕和我的圣所”展开，而第二个关系从句紧随“圣所”；中文用“地方”承接，可避免末尾“其上”指代生硬，但不进一步指定某座城或神学意义上的世界中心。
- issue: 百姓是否也“离弃”帐幕和圣所
  choice: 补出“他们也离弃了”统摄后续并列宾语
  alternative: 完全依照原文长串并列，仅用一个“离弃了”统摄全句
  rationale: 语义上帐幕和圣所仍属于“离弃”的宾语；中文补出谓语可澄清句法，不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的圣经叙事语体。保留“律例、诫命、约、安息日、帐幕、圣所”等稳定术语；通过分号和补出谓语拆解原文长串结构，以增强可读性。
