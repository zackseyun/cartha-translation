  text: And I will not abandon them, nor will I estrange myself from them, for I am the Lord their God.” And Moses fell on his face,
translation:
  language: zh_hans
  text: “我必不离弃他们，也不疏远他们，因为我是主——他们的上帝。”摩西就俯伏在地，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጎሙ
  choice: 我必不离弃他们
  rationale: 现存引文开头似有截断或异文标记；依据句法语境及审定英文咨询层，译出否定式“离弃”，保留上帝不抛弃其子民之意。
- source_word: ወኢይትናከሮሙ
  choice: 也不疏远他们
  rationale: 该动词表达变得陌生、与之疏离之意；译为“疏远”较自然，并与前句“离弃”形成有区别的并列。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 按吉兹语普通神圣称号处理，不以专名“耶和华”替代。
- source_word: አምላኮሙ
  choice: 他们的上帝
  rationale: 保留第三人称复数领属关系，直译盟约关系的表述。
- source_word: ወወድቀ፡ ሙሴ፡ በገጹ
  choice: 摩西就俯伏在地
  rationale: 字面为“摩西落在/伏在他的脸上”；现代汉语惯用“俯伏在地”表达以脸伏地的姿态。
theological_decisions:
- issue: 神名与称号的呈现
  choice: 主
  alternative: 耶和华
  rationale: 源文在此使用吉兹语称号“እግዚአብሔር”，并未明确要求以希伯来专名替换，故不作教派性或逆向专名化处理。
- issue: 上帝与其子民关系的第二个否定动词
  choice: 不疏远他们
  alternative: 不把他们当作陌生人／不与他们隔绝
  rationale: 选择可兼顾关系性含义和自然汉语的表达，不把该句进一步解释为特定的弃约教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引号承接前文话语；末尾逗号保留本节在叙事和句法上未完、继续进入下一节的特征。
