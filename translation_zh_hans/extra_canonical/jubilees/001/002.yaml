base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/002.yaml
  text: On the sixteenth day of that month, Yahweh spoke to Moses, saying, “Come up to me on the mountain, and I will give you two stone tablets of the law and the commandment, which I have written, so that you may teach them.” And Moses went up onto the mountain of Yahweh, and the glory of Yahweh dwelt on Mount Sinai,
translation:
  language: zh_hans
  text: 那月十六日，耶和华对摩西说：“你上山到我这里来。我要把两块石版赐给你；版上有律法和诫命，是我写下的，好让你教导他们。”于是，摩西登上耶和华的山，并留在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语文本到此只说摩西“留在那里”，没有“耶和华的荣耀停留在西奈山上”这句话；后者见于英语咨询文本，未据此收入正文。
    reason: 标明原语言证据与英语咨询层在本节结尾的实质差异，避免把源文没有的主语、荣耀和地点加入译文。
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 该词在吉兹语中是对上帝的称谓；本项目的咨询层在本节采用神名“Yahweh”。中文以通行的“耶和华”呈现，同时不以“主”遮蔽神名政策。
- source_word: ዕረግ፡ ኀቤየ፡ ውስተ፡ ደብር
  choice: 你上山到我这里来
  rationale: 按源文次序和空间关系表达“上到我这里、进入山中”，用自然现代汉语整合为一句。
- source_word: ክልኤተ፡ ጽላተ፡ እብን
  choice: 两块石版
  rationale: 直译“两块石制的版”，采用现代中文圣经语体中清楚自然的“石版”。
- source_word: ዘሕግ፡ ወዘትእዛዝ
  choice: 版上有律法和诫命
  rationale: 源文是“律法和诫命”的属格结构，修饰石版；补出中文所需的关系“版上有”，不把二者强行解释为同一概念或不同文本。
- source_word: ታስብዎሙ
  choice: 好让你教导他们
  rationale: 保留复数宾语“他们”的人称指向，不擅自改成“教导这些律法”或“学习它们”。
- source_word: ወኀደረ
  choice: 并留在那里
  rationale: 该动词可指居留、停留；在摩西上山的语境中译作“留在那里”最自然，并保持摩西为语法主语。
theological_decisions:
- issue: 神名与神圣称谓的呈现
  choice: 耶和华
  alternative: 主／上帝
  rationale: 源词本身是“主、上帝”类称谓，但审校后的英语咨询层明确执行 Yahweh 神名政策；中文采用“耶和华”，避免另行引入宗派性称呼。
- issue: 末句主语及“荣耀”语句
  choice: 摩西登山并留在那里
  alternative: 耶和华的荣耀停留在西奈山上
  rationale: 所提供的吉兹语文本只明确写“摩西登上……并停留”，未出现“荣耀”或“西奈”二词。英语咨询层末尾的“耶和华的荣耀住在西奈山”缺乏本次所给源文支持，因此不纳入正文，并以脚注说明。
- issue: “他们”的所指
  choice: 保留人称复数“他们”
  alternative: 教导这些律法／把这些教导给百姓
  rationale: 源文保留复数宾语，却未在本节明确重述其先行对象；译文不替作者消除这一指向上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；直接引语简洁自然。“石版、律法、诫命”保留古代宗教法律语境所需的正式度。正文严格依所提供的吉兹语证据收束，不沿用英语咨询层中未受该源文支持的扩展结尾。
