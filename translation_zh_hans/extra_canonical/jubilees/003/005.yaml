  text: And he awakened Adam from his sleep, and when Adam awoke, he rose on the sixth day and brought her to him.
translation:
  language: zh_hans
  text: 上帝使亚当从睡眠中醒来。亚当醒来后，在第六日起身；上帝把她带到他面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነቅሆ
  choice: 使……醒来
  rationale: 该使役动词表示“唤醒、使醒来”，主语承接上文的上帝，宾语为亚当。
- source_word: ተንሥአ
  choice: 站起身来
  rationale: 保留该动词“起来、起身”的具体动作含义，而不弱化为单纯“醒了”。
- source_word: አብጽሓ
  choice: 把她带到
  rationale: 该动词在此表示“使到达、带来”，阴性宾语指上文所造的女人。
- source_word: ኀቤሁ
  choice: 到他面前
  rationale: 介词与第三人称阳性单数后缀合起来意为“到他那里”，现代汉语译作“到他面前”更自然，所指为亚当。
theological_decisions:
- issue: 末句“把她带到他面前”的主语
  choice: 明确译为“上帝”
  alternative: 保留为“他把她带到他面前”
  rationale: 吉兹文动词只标示第三人称阳性单数主语，形式上可译作“他”；但叙事连贯性和《创世记》2:22的平行表述均表明施事者是上帝。明确主语可避免现代汉语中误解为亚当把女人带给自己。
- issue: “在第六日”修饰的动作
  choice: 连接于亚当“站起身来”
  alternative: 理解为整个唤醒并带来的事件发生在第六日
  rationale: 原文语序将“在第六日”紧接在“站起身来”之后，因此正文保留这一直接连接，同时不排除整组事件同日发生。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。“睡梦中醒来”和“站起身来”避免生硬直译；重复“亚当”和“上帝”以厘清吉兹文中靠动词形态与上下文辨明的主语。
