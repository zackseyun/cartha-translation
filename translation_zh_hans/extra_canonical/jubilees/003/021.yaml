  text: for food; and she took from it and ate. And she covered her shame with fig leaves first, and she gave to Adam, and he ate.
translation:
  language: zh_hans
  text: 可作食物；她就从其中取了果子吃了。她先用无花果树叶遮住自己的羞处，然后把果子给了亚当，他也吃了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበሊዕ
  choice: 可作食物
  rationale: 该短语承接上文，表达果子适合食用；用“可作食物”保留其句法衔接。
- source_word: ወነሥአት፡ እምኔሁ፡ ወበልዐት
  choice: 她就从其中摘下果子来吃了
  rationale: 直义为“她从其中取了，并吃了”；补出语境中明确的“果子”，使现代汉语自然。
- source_word: ኀፍረታ
  choice: 自己的羞处
  rationale: 该词可指羞耻或应遮蔽的裸露部位；“羞处”兼顾身体所指与羞耻意味。
- source_word: በቈጽለ፡ በለስ
  choice: 用无花果树叶
  rationale: 按原文直译为“以无花果树的叶子”。
- source_word: ዘቀዳሚ
  choice: 先
  rationale: 明确保留原文“首先、在先”的时间次序，表示遮蔽发生在给亚当果子之前。
- source_word: ወወሀበተ
  choice: 然后把果子给了亚当
  rationale: 原文为“她给了”，结合本节完整语境补明接受者与所给之物；“然后”自然表达前面的“先”所建立的次序。
theological_decisions:
- issue: “羞处”是否应抽象译为“羞耻”
  choice: 自己的羞处
  alternative: 自己的羞耻／赤身
  rationale: 上下文叙述用树叶遮蔽身体；“羞处”既不把含义纯粹抽象化，也保留羞耻层面。
- issue: 是否把“也”放在给亚当的动作上
  choice: 他也吃了
  alternative: 她也给了亚当
  rationale: 原文的“先”强调动作次序，并无支持“她也给了”的附加副词；“也”适合表达亚当与女子同样吃了果子。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“摘下果子”与“把果子给了亚当”是依据明确语境作出的自然补足；以“先……然后……”清楚保留原文的先后关系。
