base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/022.yaml
  text: And he ate, and his eyes were opened, and he saw that he was naked. And he took fig leaves and sewed them and made himself a covering, and covered his shame.
translation:
  language: zh_hans
  text: 亚当吃了，眼睛就开了，看见自己赤身露体。他便拿无花果树的叶子缝在一起，给自己做了遮盖物，遮住自己的羞处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበልዐ
  choice: 他吃了
  rationale: 直译该动词“并且他吃了”，保留原文明确陈述亚当吃了果子的起首分句。
- source_word: ወተርኅወ፡ አዕይንቲሁ
  choice: 眼睛就开了
  rationale: 保留原文“他的眼睛被打开／开了”的意象，同时用现代汉语自然表达结果关系。
- source_word: ቈጽለ፡ በለስ
  choice: 无花果树的叶子
  rationale: 按词义译出“无花果叶”，加“树的”使现代汉语更清楚自然。
- source_word: ወጠቅዐ
  choice: 缝在一起
  rationale: 该词在此表示把叶子连接、缝合，译文保留具体动作。
- source_word: ምርአ
  choice: 遮盖
  rationale: 采用宽泛的“遮盖”，不把形制具体化为围裙、腰布等，以免超出吉兹语文本所明确表达的范围。
- source_word: ኀፍረቶ
  choice: 羞处
  rationale: 该词可涉及羞耻或可耻之裸露；“羞处”在此既切合身体语境，也避免仅抽象译作“羞耻”。
theological_decisions:
- issue: 眼睛开启的表述是否解释为获得知识或属灵状态改变
  choice: 仅译作“眼睛就开了”
  alternative: 解释性译为“他顿时明白了善恶”
  rationale: 原文只陈述眼睛开启及看见赤身，未明说其神学机制，故保留叙事张力，不加入解释。
- issue: “羞处”是否明确指生殖器
  choice: 使用较含蓄而具身体指向的“羞处”
  alternative: 译作“下体”或抽象的“羞耻”
  rationale: 原词与裸体和遮盖相连，但具体身体范围仍不宜过度限定；“羞处”兼顾语境和原文余地。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语；连续使用“他”维持叙事主体为亚当。“赤身露体”是普通读者熟悉且有尊严的表达，“遮盖／羞处”则保留原文身体性而不作过度具体化。
