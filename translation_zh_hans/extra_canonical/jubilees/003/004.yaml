base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/004.yaml
  text: And the Lord said to us, “It is not good for the man to be alone; let us make for him a helper like him.” And the Lord our God caused a deep sleep to fall upon him, and he slept; and he took one bone from among his bones for the woman, and that rib was the origin of the woman from among his bones, and he built flesh in its place, and built the woman.
translation:
  language: zh_hans
  text: 主对我们说：“那人独自一人不好；我们要为他造一个与他相称的帮助者。”主、我们的上帝使深沉的睡眠临到他身上，他就睡了；他从他的骨头中取出一根骨头来造女人。那根肋骨成为女人由他的骨头而受造的根源[a]。他在原处补上肉，又造了女人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受造的根源”所译原词也可指“受造之物”或“形成”。本句句法较难，强调女人与那根肋骨的关系，并再次说明她出自男人的骨头。
    reason: 说明ፍጥረት的词义范围，并保留原句关于女人由骨头受造的重复而含蓄的表达。
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 主
  rationale: 该词在此作神的称号，译作“主”既贴近原文，也避免在原文未明确使用神名时擅自引入“耶和华”。
- source_word: መርዳእ፡ ዘከማሁ
  choice: 与他相称的帮助者
  rationale: 保留“帮助者”这一角色用语，并以“与他相称”表达与他对应、适合他的含义，不把它弱化为普通助手。
- source_word: ዐጽመ፡ አሐደ
  choice: 一根骨头
  rationale: 原文先使用泛指“骨头”的词，故不提前译成“肋骨”；下句才明确称其为肋骨。
- source_word: ገቦ
  choice: 肋骨
  rationale: 该词在后一句明确指身体侧部的肋骨，保留原文由泛称“骨头”转为具体“肋骨”的变化。
- source_word: ፍጥረት
  choice: 受造的本源
  rationale: 该词涉及创造、受造或形成。结合句法，译作“受造的本源”以保留肋骨与女人受造之间的来源关系，同时不删去这一独立分句。
- source_word: ሐነጸ
  choice: 造
  rationale: 原义带有建造、构筑色彩；现代汉语在“造上肉”和“造了女人”中较自然，也保留重复动词的修辞。
theological_decisions:
- issue: “我们要造”中的复数
  choice: 保留“我们”
  alternative: 改作单数或解释为上帝对天使说话
  rationale: 原文明确采用第一人称复数，但未在本节解释参与者及其神学含义，因此不在正文中消解这一张力。
- issue: 女人受造与肋骨的关系
  choice: 保留“那根肋骨就是女人从他骨头中受造的本源”这一独立陈述
  alternative: 简化为“用那根骨头造了女人”
  rationale: 原文明确重复提到肋骨和“从他的骨头中”，简化会遗漏源文本身强调的内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文的神圣称号、第一人称复数以及“骨头／肋骨”的词汇转换；避免用教派术语解释“我们”，也不把较难的受造来源分句静默改写或删除。
