base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/028.yaml
  text: And he sent out from the garden of Eden all flesh that was in the garden of Eden, and all flesh was scattered, each according to its kind and according to its form, to the places that had been created for them.
translation:
  language: zh_hans
  text: 他把伊甸园中一切有血肉的都遣了出去；一切有血肉的便各按其类、各按其形态，分散到为它们所造的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ዘሥጋ
  choice: 凡有血肉的
  rationale: 直译为“所有属肉的／一切肉体”，在本节语境中泛指园内一切有血肉的生物；保留原文广泛而略带集合性的表达，不限缩为某一类动物。
- source_word: ተዘርዉ
  choice: 分散
  rationale: 该词表达散开、分布之意；“分散”自然呈现众生离园后被安置于不同区域的情形。
- source_word: በበ፡ ዘመዶሙ
  choice: 各从其类
  rationale: 表示按照各自的种类或族类；采用现代中文圣经语体中自然且清楚的表达。
- source_word: በበ፡ ፍጥረቶሙ
  choice: 各按其形态
  rationale: ፍጥረት 可指受造的形态、构造或本性；译作“形态”以区别于前面的“类”，并避免把两项合并。
- source_word: ውስተ፡ መካን፡ ዘተፈጥረ፡ ሎሙ
  choice: 到为它们所造的地方
  rationale: 保留被动结构及“为它们”这一受益关系，说明各类生物前往为其预备或创造的所在。
theological_decisions:
- issue: “他”所指的行动主体
  choice: 沿用原文代词“他”，不在正文补出“上帝”
  alternative: 上帝把……送出园去
  rationale: 本节承接上文，原文以第三人称单数动词表达主体；直接补名可能消除篇章中的代词衔接，因此保留“他”。
- issue: 生物离园是被驱逐、遣送还是一般离开
  choice: 译为“送出园去”
  alternative: 赶出园去／放出园去
  rationale: 原动词含差遣、送走之意；“送出”既保持施动性，又避免额外强化惩罚色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡有血肉的”保留古代文本的集合性称谓；后半句用“各从其类、各按其形态”的平行结构再现原文节奏。
