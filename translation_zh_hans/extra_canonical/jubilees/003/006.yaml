  text: And he recognized her and said to her, “This now is bone from my bones and flesh from my flesh. This one shall be called my woman, because she was taken from her man.”
translation:
  language: zh_hans
  text: 他认出了她[a]，对她说：“这才是我骨中的骨、肉中的肉。她要称为‘我的女人’，因为她是从她的男人身上取出来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他认识了她。”
    reason: 源词可表示“知道、认识”，但在这里按上下文更可能指辨认、认出。
lexical_decisions:
- source_word: ወአእመራ
  choice: 他认出了她
  rationale: 动词在这里表示亚当醒来后辨认、认出这女子与自己的关系；译作“认识了她”在现代汉语中容易被理解为发生性关系，不合本段叙事次序。
- source_word: ዝንቱ፡ ይእዜ
  choice: 这一次
  rationale: 保留指示词与“现在”的强调意味，并采用自然汉语表达亚当面对这位与先前受造物不同、与自己相配者时的感叹。
- source_word: ዐጽም፡ እምዐጽምየ፡ ወሥጋ፡ እምሥጋየ
  choice: 我骨中的骨、肉中的肉
  rationale: 采用形式对应的庄重表达，保留源文的平行结构及亲属、同体意象。
- source_word: ብእሲትየ
  choice: 我的女人
  rationale: 属格后缀明确为第一人称单数“我的”；不省略为通常的“女人”，以保存《禧年书》文本与常见《创世记》措辞之间的差异。
- source_word: እምብእሲሃ
  choice: 从她的男人身上
  rationale: 源文带第三人称阴性单数属格后缀，直指“她的男人”；如此也尽量保留“男人／女人”的词语呼应。
theological_decisions:
- issue: “认出／认识”是否暗示性关系
  choice: 认出了她
  alternative: 认识了她
  rationale: 上下文描述亚当醒来后辨认女子的来源与身份，夫妻同房在本书叙事中另有后续安排；这里不应因现代汉语的惯用含义而提前引入性关系。
- issue: 是否将“我的女人／她的男人”常规化为“女人／男人”
  choice: 保留所有格
  alternative: 她要称为“女人”，因为她是从“男人”身上取出来的
  rationale: 源文两处所有格均有文本依据；保留它们既不额外建立婚姻教义，也不抹平本书独有措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“骨中的骨、肉中的肉”保留经文式平行节奏；“我的女人／她的男人”略显非常规，但为忠实呈现吉兹文所有格与词语呼应而保留。
