  text: for himself and for his wife[a], and stored what was being kept. And at the completion of the seven years which he had completed there, exactly seven years, in the second month, on the seventeenth day, the serpent came and approached the woman, and the serpent said to the woman, “Has God commanded you, saying, ‘You shall not eat from every tree of the garden’?”
translation:
  language: zh_hans
  text: 为自己和妻子作了预备，又把所保留的存放起来。整整七年期满之后——他在那里度过了七年——第二个月十七日[a]，蛇来了，靠近那女人，对她说：“上帝吩咐过你们说：‘园中各样树上的果子，你们都不可吃’吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 日期记载得十分精确：在伊甸园度过整整七年之后，第二个月十七日。《禧年书》常以这类纪年构成其启示叙事的框架。
    reason: cultural_note
lexical_decisions:
- source_word: ሰብዓቱ / ሰብዓተ
  choice: 七年／整整七年
  rationale: 这两个词均明确表示“七”；邻近的፳፮、፳፯是查尔斯版的脚注标号，不是正文数字“二十六、二十七”。
- source_word: ጥንቁቀ
  choice: 整整
  rationale: 表达时间计算的精确、完整，符合上下文对七年期满的强调。
- source_word: አርዌ ምድር
  choice: 蛇
  rationale: 该词组字面可指“地上的爬物／蛇”；创世记叙事背景及后续直接称谓支持译作“蛇”。
- source_word: ቀርበ ኀበ ብእሲት
  choice: 靠近那女人
  rationale: 保留“来到并接近女人”的空间动作，同时用自然现代汉语表达。
- source_word: እምኵሉ ዕፀ
  choice: 园中各样树上的果子……都不可吃
  rationale: 按否定问句的自然汉语语序表达“不可吃所有树上的”，并结合平行的创世记措辞补明吃的是树上的果子。
theological_decisions:
- issue: 蛇的问题是否应解释为断言、反问或故意歪曲上帝命令
  choice: 保留为带引语的疑问句
  alternative: 译成明确的反问：“上帝真的说……吗？”
  rationale: 原文以“说”引出命令内容，但不必在译文中进一步判定蛇的语气和动机；问号保留叙事张力。
- issue: 七年纪年与版本脚注数字的辨别
  choice: 译作“七年……整整七年”
  alternative: “二十六年……二十七年”
  rationale: 正文中的吉兹词明确是“七”；版面中的፳፮、፳፯属于批注标号，不能当作正文数字。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留经文的重复纪年，以体现原文强调。脚注标记置于具体日期之后，使正文锚点与脚注内容相符。
