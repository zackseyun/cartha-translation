  text: And he made garments of skin for them, and clothed them, and sent them out from the garden of Eden.
translation:
  language: zh_hans
  text: 他为他们做了皮衣，给他们穿上，又把他们送出伊甸园。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ፡ ዘማዕስ
  choice: 皮衣
  rationale: 该短语意为用皮制成的衣服；译作“皮衣”简洁自然，并保留材料信息。
- source_word: አልበሶሙ
  choice: 给他们穿上
  rationale: 保留使役性的穿衣动作，也符合现代汉语表达。
- source_word: ፈነዎሙ
  choice: 把他们送出
  rationale: 原词表示差遣、送走；“送出”保留了行动主体及离开园子的结果，而不强化为较具惩罚色彩的“赶出”。
- source_word: ገነት፡ ኤዶም
  choice: 伊甸园
  rationale: 采用现代中文中通行且清楚的专名形式。
theological_decisions:
- issue: 离开伊甸园的动作语气
  choice: 送出
  alternative: 赶出
  rationale: 源词可表达差遣或送走，本节未必必须强化为暴力驱逐；“送出”更贴近词义范围，也保留叙事张力。
- issue: 皮衣的象征意义
  choice: 仅译明衣服材质，不附加献祭或赎罪解释
  alternative: 在译文中暗示献祭、遮罪等神学含义
  rationale: 原文只陈述制作、穿衣和送出，并未说明皮革来源或赋予其特定象征意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式依次呈现制作、穿上、送出三个动作，贴近原文推进；“又”使并列叙事流畅。
