  yaml_path: translation/extra_canonical/jubilees/003/024.yaml
  text: And to Adam also he said, “Because you listened to the voice of your wife and ate from that tree from which I commanded you not to eat, cursed shall the ground be on your account. It shall produce thorns and thistles for you, and you shall eat your bread by the sweat of your face until you return to the ground from which you were taken; for you are earth, and to the earth you shall return.”
translation:
  language: zh_hans
  text: 他也对亚当说：“因为你听从了妻子的话，吃了我吩咐你不可吃的那棵树的果子，土地必因你的缘故受诅咒。它要给你长出荆棘和蒺藜；你必汗流满面地吃饭，直到你归回你从其中被取出的土地。因为你本是土，也必归回土。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድር
  choice: 土地／土
  rationale: 该词在本节反复出现，既指受诅咒并出产荆棘的土地，也构成“人出于土、归回土”的呼应；中文分别用“土地”和“土”，既合乎语境，又保留原文的文字关联。
- source_word: ቃለ፡ ብእሲትከ
  choice: 妻子的话
  rationale: 直译为“你妻子的声音／话”；现代汉语以“听从了妻子的话”自然表达听从其劝说之意。
- source_word: እከዋከ፡ ወአሜካሳ
  choice: 荆棘和蒺藜
  rationale: 指两类带刺植物；采用现代中文圣经语境中清楚、庄重且广为理解的对应词。
- source_word: በሐፈ፡ ገጽከ
  choice: 汗流满面
  rationale: 原义为“在你脸面的汗水中”；此表达保留劳苦得食的具体形象，同时符合自然汉语。
- source_word: ብላዕ፡ ሣዕስቲከ
  choice: 才有饭吃
  rationale: 该短语表达人在劳苦中获得日常食物；“饭”在现代汉语中自然指日用饮食，并未限定具体谷物。
theological_decisions:
- issue: 土地受诅咒的原因表达
  choice: 土地必因你的缘故受诅咒
  alternative: 土地必为你受诅咒
  rationale: 原文介词结构表示诅咒因亚当的行为而临到土地；“因你的缘故”保留因果关系，不把土地拟人化为代替亚当承受刑罚。
- issue: “你是土”的人类本质与死亡宣告
  choice: 因为你本是土，也必归回土
  alternative: 因为你是尘土，也必归于尘土
  rationale: 原文重复与“土地”同源的词，强调人的来源和归宿；用“土”保留这一呼应，不额外引入灵魂、死亡状态等解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。保留神谕中的因果、土地受诅咒、劳苦得食以及人归回土的层次；不添加原文没有的教派性解释。
