  yaml_path: translation/extra_canonical/jubilees/003/010.yaml
  text: 'Therefore the commandment was written on the heavenly tablets concerning her who gives birth: if she bears a male, she shall remain in her uncleanness seven days, according to the first seven days, and thirty-three days she shall remain in the blood of purification; she shall touch nothing holy, and she shall not enter the sanctuary until she completes these days for a male child.'
translation:
  language: zh_hans
  text: 因此，天上的版册上记载了关于产妇的诫命：她若生男孩，就要在不洁中停留七天，如最初的七天一样；又要在洁净之血中停留三十三天。她不可触碰任何圣物，也不可进入圣所，直到为男孩所定的这些日子满了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版
  rationale: 直译为天上的书写版，保留《禧年书》中诫命被记录于天上版面的独特意象，避免擅自具体化为石版。
- source_word: ለእሙ፡ ተባዕተ፡ ወለደት
  choice: 产妇……生男孩
  rationale: 原文指生育者在生下男性婴孩时的情形；用现代汉语简洁表达，同时不扩大为一般母亲身份。
- source_word: ውስተ፡ ርኵሳ
  choice: 在不洁中
  rationale: 保留礼仪状态用语，而不译成带有道德谴责意味的肮脏或污秽。
- source_word: ውስተ፡ ደመ፡ ንጽሓ
  choice: 在洁净的血中
  rationale: 依原文形式保留血与洁净并置的张力，不解释成某一特定生理或礼仪过程。
- source_word: ኵሎ፡ ቅዱሰ
  choice: 任何圣物
  rationale: 原文意为一切神圣之物；此处译为圣物，符合触碰这一动词的自然搭配。
- source_word: መቅደስ
  choice: 圣所
  rationale: 采用中性且通行的礼仪空间用语，不预设其具体建筑形态。
theological_decisions:
- issue: 产后不洁的性质
  choice: 以“不洁”表达礼仪状态
  alternative: 译作“污秽”或解释为道德罪责
  rationale: 上下文关乎时限、圣物和圣所，属于礼仪性规定；译文不把它转化为道德判断。
- issue: “洁净的血”的解释
  choice: 保留字面张力
  alternative: 解释为“洁净期”或“产后流血期”
  rationale: 原文措辞本身将血与洁净并置，译文不替文本消除这种张力。
- issue: 末句日子的所指
  choice: 译作“为男孩所定的这些日子”
  alternative: 仅译“这些日子”
  rationale: 原文末尾明确限定这些日子与男孩有关，应完整保留，避免遗漏。
translation_notes:
  register: 采用现代、庄重而易懂的法规叙述语体；保留“天上的版”“不洁”“洁净的血”“圣所”等原文关键概念。分号呈现七日与三十三日两个连续阶段，并完整译出末尾的男性婴孩限定语。
