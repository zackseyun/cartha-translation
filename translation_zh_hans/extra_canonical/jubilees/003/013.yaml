base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/013.yaml
  text: 'Therefore the statute of these days was ordained for her who bears a male or a female: she shall touch nothing holy, nor enter the sanctuary, until'
translation:
  language: zh_hans
  text: 因此，为生了男婴或女婴的妇人制定了这些日子的条例：她不可触摸任何圣物，也不可进入圣所，直到……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተዝ
  choice: 因此
  rationale: 承接上文并引出由前述缘由所定的条例，符合该连接语在语境中的因果功能。
- source_word: ተሠርዐ
  choice: 定下了
  rationale: 表达条例被制定、设立的被动意义，同时保持现代汉语自然。
- source_word: ለእኅተ፡ ትውልድ፡ ለተባዕት፡ ወለአንስት
  choice: 为生男孩或女孩的妇人
  rationale: 按短语整体语义处理为生产男性或女性婴孩的妇人；用“男孩或女孩”比“男性或女性”更符合生产语境。
- source_word: ፍትሖን
  choice: 条例
  rationale: 在礼仪规范语境中指所规定的法则或定例，“条例”兼顾正式性与可懂性。
- source_word: ቅዱሰ
  choice: 圣物
  rationale: 这里是实体化的“圣洁之物／任何圣物”，译作“圣物”可与后面的圣所区分。
- source_word: መቅደስ
  choice: 圣所
  rationale: 保留礼仪空间的宗教含义，不具体限定为圣殿中的某一区域。
- source_word: እስከ፡ አመ
  choice: 直到……
  rationale: 原文在本节末形成未完的时间从句，并在后文续接；中文以省略号明确保留这种未完成性。
theological_decisions:
- issue: 产妇礼仪限制的性质
  choice: 按原文直译为不得触碰圣物、不得进入圣所
  alternative: 解释为道德上的不洁或罪责
  rationale: 原文陈述的是礼仪条例，并未把生产本身解释为道德罪责，因此不加入此类神学判断。
- issue: 本节末尾未完成的“直到”结构
  choice: 保留“直到……”
  alternative: 依据后续经文补全期限
  rationale: 本节所给原文止于时间连接语；保留悬置结构可忠实反映文本边界，避免把下一节内容移入本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妇人”保留经书语体的正式感；句法适度调整为自然汉语，但不消解原文礼仪术语及末尾未完句的张力。
