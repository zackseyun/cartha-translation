- source_word: ወሰመያ፡ አዳም፡ ስመ፡ ብእሲቱ፡ ሔዋ
  choice: 亚当给妻子起名叫夏娃
  rationale: 按原文顺序表达“亚当称其妻子的名为夏娃”，采用现代汉语自然说法。
- source_word: ወአኮኑ
  choice: 他们没有……
  rationale: 保留所给格尔兹语片段末尾未完成的否定表达，不擅自补出缺失宾语或后文。
