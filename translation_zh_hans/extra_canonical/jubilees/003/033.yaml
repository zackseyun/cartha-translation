lexical_decisions:
- source_word: አሐዱ
  choice: 成为一体
  rationale: 该词表示“一、一个”；结合残句句法及英译审校层，用自然中文表达为“成为一体”，同时保留其承接上文的残句性质。
- source_word: ውስተ፡ ምድረ፡ ፍጥረቶሙ
