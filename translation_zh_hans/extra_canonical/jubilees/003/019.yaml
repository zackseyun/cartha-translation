base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/019.yaml
  text: God said to us, ‘Do not eat from it, and do not touch it, lest you die.’” And the serpent said to the woman, “You will not surely die, for God knows that on the day you eat from it, your eyes will be opened, and you will be like gods, and you will know good.”
translation:
  language: zh_hans
  text: 上帝对我们说：‘不可吃它，也不可触碰它，免得你们死。’蛇对那女人说：‘你们绝不会死！因为上帝知道，你们吃它的那一天，你们的眼睛就会打开；你们会像神明一样，并且知道善[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“认识美善”。现存原文在此仅作“善”，没有“恶”字。
    reason: 保留 ሠናየ 可指“善、美好”的词义范围，并说明正文没有依照平行叙事补入“恶”。
lexical_decisions:
- source_word: ኢትብልዑ፡ እምኔሁ
  choice: 不可吃那树上的果子
  rationale: 原文直译为“不可从它吃”；汉语补出“树上的果子”，使所指自然明确，同时不改变禁令内容。
- source_word: ወኢትልከፍዎ
  choice: 也不可触碰它
  rationale: 保留原文并列的第二项禁令，采用现代汉语中自然而庄重的“触碰”。
- source_word: አኮ፡ ሞተ፡ ዘትመውቱ
  choice: 你们绝不会死
  rationale: 该表达是对死亡后果的强烈否定，对应创世记叙事中的强调式否认；“绝不会”在现代汉语中传达其语势。
- source_word: አርዌ፡ ምድር
  choice: 地上的蛇
  rationale: 形式上保留“地/大地”这一修饰成分，不简化为单独的“蛇”。
- source_word: ይትረኀዉ፡ አዕይንቲክሙ
  choice: 眼睛就会打开
  rationale: 按原文意象直译，并使用现代汉语通顺表达。
- source_word: ከመ፡ አማልክት
  choice: 像神明一样
  rationale: 原文为复数“诸神/神明”；译作“神明”既保留复数类称意味，也避免擅自解释为单数的上帝。
- source_word: ወታአምሩ፡ ሠናየ
  choice: 并且知道善
  rationale: ወታአምሩ 是限定动词“并且你们将知道”，不是分词；ሠናየ 在现存文本中仅明确写出“善”。
theological_decisions:
- issue: አማልክት 应译作“上帝”还是“神明”
  choice: 神明
  alternative: 上帝
  rationale: 该词在此为复数形式。译作“神明”保留原文的数和蛇话语中的神学张力，不把它预先解释为唯一的上帝。
- issue: 末句是否补成“知道善恶”
  choice: 正文只译“知道善”
  alternative: 知道善恶
  rationale: 所给吉兹语文本止于“善”，没有出现“恶”；即使其背景让人联想到创世记，也不应把缺少的词直接补入正文。
translation_notes:
  register: 采用现代、清晰而庄重的叙事体。女人转述上帝命令时用“曾对我们说”，蛇的话则保留直接而强烈的否定语气。所有引号及脚注标记均置于相应正文位置。
