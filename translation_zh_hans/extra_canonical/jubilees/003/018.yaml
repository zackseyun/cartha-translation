lexical_decisions:
- source_word: እግዚአብሔር
  choice: 上帝
  rationale: 采用现代普通话中庄重而通行的神名译法，不附加宗派色彩。
- source_word: ኢትብልዑ፡ እምኔሁ
  choice: 不可吃它的果子
  rationale: 原文直译近于“不可从它吃”；汉语补出“果子”，与树木语境及下文相符。
- source_word: እምኵሉ፡ ፍሬ፡ ዕፀ፡ ዘውስተ፡ ገነት
  choice: 园中各样树上的果子
  rationale: 自然表达原文“园中所有树的果子”，保留范围广泛的意思。
- source_word: ዕፀ፡ ዘማእከለ፡ ገነት
  choice: 园子中央那棵树
  rationale: 准确表达位于园子中间的树；“中央”简洁、现代而庄重。
theological_decisions:
- issue: 神对园中果子的许可与禁令之间的对照
  choice: 保留“你们可以吃”与“不可吃”的直接引语及转折
  alternative: 将许可解释为“可以随意吃”，或补全禁令内容
  rationale: 原文在本段只给出简短措辞，且末尾残缺；不从《创世记》平行经文擅自补入“随意”或后续禁令。
- issue: 说话者的性别指代
  choice: 译作“她对他说”
  alternative: 省略代词性别或改写为人物姓名
  rationale: 原文动词及代词指向女性说话者和男性受话者，直译可保留叙事关系。
