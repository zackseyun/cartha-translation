  text: until she completes these days for a male. But for a female, two weeks, like the first two weeks, in her uncleanness, and sixty-six days she shall remain in the blood of her purification.
translation:
  language: zh_hans
  text: 直到她完成为男孩所定的这些日子。至于女孩，她要像先前的两个七日一样，在她的不洁中度过两个七日；又要在她洁净的血中停留六十六日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰቡዓተ
  choice: 七日
  rationale: 该词表示以七天为单位的周期。译作“七日”既保留原文的计数形式，也自然契合本段洁净条例的语境；“两个七日”即十四天。
- source_word: በርኵሳ
  choice: 在不洁中
  rationale: 保留名词性表达及第三人称阴性所属含义；汉语语境中“不洁”指礼仪状态，不擅自改释为道德污秽。
- source_word: ደመ፡ ንጽሓ
  choice: 她洁净的血
  rationale: 较形式地保留“血”与“洁净”的组合，并体现原文阴性所属成分，不把这一有张力的表达静默改写成单纯的“洁净期”。
- source_word: ትንበር
  choice: 停留
  rationale: 对应“居留、保持在某状态”的基本含义；在此以“停留”保留原文表述，避免额外补入原文未明说的行为要求。
theological_decisions:
- issue: “不洁”与“洁净”是否作道德化解释
  choice: 按礼仪状态直译为“不洁”和“洁净”
  alternative: 译为“污秽”并赋予道德含义
  rationale: 上下文对应产后洁净条例；原文本身没有把这种状态界定为个人道德罪责，因此不应加入该层解释。
- issue: “她洁净的血”这一短语的张力
  choice: 保留原文名词组合
  alternative: 解释性改写为“洁净期间”或“血得洁净的日子”
  rationale: 原文将“血”与“洁净”直接相连，含义具有一定张力；正文宜保留，而不替读者消解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“若生的是女孩”自然承接前句省略的信息；分号划分十四日的不洁期与六十六日的洁净阶段。未加入属于下一节的“共八十日”。
