base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/001.yaml
  text: 'And during the six days of the second week we brought to Adam, by the word of the Lord, all the beasts, and all the livestock, and all the birds, and everything that moves on the earth, and everything that moves in the waters, according to their kinds and according to their forms: the beasts on the first day, the livestock on the second day, the birds on the third day, and everything that moves on the earth on the fourth day, and what moves in the waters on the fifth day.'
translation:
  language: zh_hans
  text: 第二周的六天里，我们奉主的话，把一切野兽、牲畜、飞鸟，以及地上一切活动之物和水中一切活动之物，都带到亚当面前；它们各按自己的种类和形态：第一天是野兽，第二天是牲畜，第三天是飞鸟，第四天是地上一切活动之物，第五天是水中一切活动之物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰዱስ፡ መዋዕል
  choice: 六天里
  rationale: 该短语直指“在六天之中”，而非“第二天”；这样也符合后文按多日列举的结构。
- source_word: በቃለ፡ እግዚአብሔር
  choice: 照着主的话
  rationale: 保留“藉着／按照主的话”的语义，同时用自然汉语表达这些动物被带到亚当面前是遵照主的吩咐。
- source_word: አራዊተ
  choice: 野兽
  rationale: 与后面的牲畜相区别，表达非家养兽类。
- source_word: እንስሳ
  choice: 牲畜
  rationale: 在与野兽并列的分类语境中，指家养动物；“牲畜”比泛称“动物”更能保持分类差异。
- source_word: ዘይትነወስ / ዘይትሐወስ
  choice: 活动之物
  rationale: 源词强调移动或活动；不擅自缩窄为爬行动物或昆虫。
- source_word: በበ፡ ዘመዶሙ ወበበ፡ አምሳሎሙ
  choice: 各从其类，各按其形态
  rationale: 分别保留“种类／族类”和“形态／样式”两个并列概念，不将二者合并。
theological_decisions:
- issue: 行动的主体与神命令的关系
  choice: “我们照着主的话……带到亚当面前”
  alternative: “主借着话把……带到亚当面前”
  rationale: 原文以第一人称复数为行动主体，并以介词短语说明此举与主的话有关；译文保留天使叙述者的主体地位，不把主改成直接执行者。
- issue: 六天总述与后文只列到第五天之间的张力
  choice: 保留“六天里”及第一至第五天的原有列举
  alternative: 把“六天”改成“五天”或“第二天”
  rationale: “六天”有明确原文依据；即使与本节列出的五日形成表面张力，也不应在翻译中替作者协调。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“亚当”“主”沿用普通中文圣经读者熟悉的称谓；分类列表保持清楚平行，避免过度古雅。
