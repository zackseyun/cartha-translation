  text: But to Adam alone, from among all the beasts and cattle, he gave the means to cover his shame.
translation:
  language: zh_hans
  text: 在一切走兽和牲畜中，他唯独使亚当能遮盖自己的羞耻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“他只赐给亚当遮盖自己羞耻的办法，使他有别于一切走兽和牲畜。”
    reason: 原文中“从一切走兽和牲畜”位置靠后，既可理解为“在这些动物中唯独亚当”，也可理解为补充说明亚当与它们有别。
lexical_decisions:
- source_word: ወለአዳም፡ ባሕቲቱ
  choice: 他唯独使亚当
  rationale: “ባሕቲቱ”强调亚当是唯一受到这种待遇的对象；汉语将“唯独”置于“亚当”前，清楚表达对比。
- source_word: ወሀቦ፡ ይክድን
  choice: 使……能遮盖
  rationale: 字面是“赐给他去遮盖”，在此表示赋予遮盖的条件或手段；译作“使……能”既自然，又不把所赐之物具体化为原文未明说的衣物或能力。
- source_word: ኀፍረቶ
  choice: 自己的羞处
  rationale: 该词可指羞耻或身体隐私部位；上下文谈论赤身与遮盖，译作“羞处”保留身体指向和庄重语体。
- source_word: እምኵሉ፡ አራዊት ወእንስሳ
  choice: 在一切走兽和牲畜中
  rationale: 介词“እም”基本义为“从、出自”；在此与“唯独亚当”构成群体中的对比，汉语用“在……中”最清楚。
theological_decisions:
- issue: 遮盖羞处的行为主体与赐予者
  choice: 保留“他”为隐含的赐予者，并明确亚当是遮盖者
  alternative: 译成“他唯独给亚当遮盖了羞处”
  rationale: 源文“ይክድን”指亚当去遮盖，而不是赐予者替亚当遮盖；这样也与本章前文上帝赐衣、亚当穿戴的叙述保持张力而不混同动作。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“羞处”比“羞耻”更贴合赤身与遮盖的语境，又避免粗俗；“走兽和牲畜”保留原文两个动物类别的区分。
