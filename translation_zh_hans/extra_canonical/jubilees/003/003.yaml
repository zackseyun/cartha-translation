  text: And during these five days Adam saw them[a], male and female, of every kind that was on the earth, but he was alone, and no helper like him was found for him.
translation:
  language: zh_hans
  text: 在这五天里，亚当看见地上各类动物都有雄有雌[a]；但他独自一人，没有找到与他相配的帮助者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存吉兹文的节号从第2节直接跳到第4节；第2、4节之间缺少部分的语意可由上下文辨认：在这五天里，亚当观察到各类动物都有雄有雌，却没有找到与自己相配的帮助者。
    reason: segmentation_note
lexical_decisions:
- source_word: ተባዕት፡ ወአንስት（据缺失行所保存的语意）
  choice: 有雄有雌
  rationale: 所指为地上各类动物，现代汉语用“雄、雌”比“男、女”自然准确；同时保留成对对照。
- source_word: ዘይረድኦ
  choice: 能帮助他的
  rationale: 保留“帮助、扶助”的基本意义，不赋予特定宗派或等级观念。
- source_word: ዘከማሁ
  choice: 与他相配
  rationale: 该词组有“像他、与他相应”的意思；“与他相配”既表达对应关系，也避免把它弱化为外貌相似。
theological_decisions:
- issue: 亚当所需帮助者与他的关系
  choice: 与他相配、能帮助他的
  alternative: 像他的帮助者
  rationale: 正文兼顾“帮助”与“对应／相称”两层含义，不把关系解释为从属，也不预先赋予婚姻神学之外的特定教义。
- issue: 缺失经文的呈现
  choice: 在正文中按上下文保存本节语意，并用脚注说明行号缺失
  alternative: 删去本节或把整节置于方括号内
  rationale: 现存排版从第2节跳到第4节，但第4节开头及上下文清楚承接亚当未找到相配帮助者的叙述；脚注可诚实呈现文本状况，而不妨碍连续阅读。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“各类动物都有雄有雌”比逐词译作“看见它们，雄的和雌的”更符合汉语表达；分号保留动物成双与亚当独处之间的鲜明转折。
