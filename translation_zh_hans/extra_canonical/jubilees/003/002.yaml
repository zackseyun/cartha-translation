  text: And Adam gave names to them all, each by its own name; and as he called them, so was their name.
translation:
  language: zh_hans
  text: 亚当给它们全都取名，逐一按各自的名字；他怎样称呼它们，它们的名字就是怎样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰመዮሙ
  choice: 给它们……取名
  rationale: 该词表达亚当为众生物命名；现代汉语用“取名”自然明晰，同时保留动作主体与复数受事。
- source_word: ለኵሎሙ
  choice: 它们一一
  rationale: 原文指“所有它们”；译作“一一”既体现无一遗漏，也与后面的逐个命名相衔接。
- source_word: በበ፡ አስማቲሆሙ
  choice: 各有其名
  rationale: 重叠介词结构有逐一、各自之意；此译保留分配性，不把名字具体化。
- source_word: ወበከመ
  choice: 他怎样……就怎样……
  rationale: 依据原文残句并参照经审校的英文咨询层，采用对应结构，表达称呼与名字之间的一致关系。
theological_decisions:
- issue: 亚当命名行为的对象与权柄含义
  choice: 仅陈述亚当给“它们”取名
  alternative: 增译为亚当凭治理权给所有动物定名
  rationale: 原文在本节所给片段中没有明说“治理权”或补出对象类别，因此不引入额外神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“取名”“称呼”避免生硬直译，并保留原文后半句的对应式强调。
