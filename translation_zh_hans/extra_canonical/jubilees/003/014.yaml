  text: until those days are completed for a male and for a female. This is the law and testimony that was written.
translation:
  language: zh_hans
  text: 直到为男子和女子所定的那些日子满了。这就是所写下的律法和见证。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትፈጸማ፡ እላንቱ፡ መዋዕል
  choice: 那些日子满了
  rationale: 以自然汉语表达“那些日子得以完成／届满”，并保留日数期满的含义。
- source_word: ለተባዕት፡ ወለአንስት
  choice: 为男子和女子所定的
  rationale: 介词ለ表示“为／对于”，连接词ወ明确为“和”；补出“所定的”使其与“日子”在现代汉语中自然衔接，而不增添实质内容。
- source_word: ሕግ፡ ወስምዕ
  choice: 律法和见证
  rationale: 分别保留“律法”与“见证”的宗教法律语域及并列关系。
- source_word: ዘተጽሕፈ
  choice: 所写下的
  rationale: 准确体现关系结构及被动完成含义。
theological_decisions:
- issue: 男子与女子之间的连接关系
  choice: 和
  alternative: 或
  rationale: 原文ወ为并列连接词“和”，不应改成选择关系“或”。
- issue: “律法和见证”的关系
  choice: 保留两个并列名词
  alternative: 合并解释为单一法令
  rationale: 原文明确以ወ连接两个术语；保留并列可避免消解其可能具有的法律及神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“为……所定”用于疏通原文介词短语与“日子满了”的关系；不加入原文未载的以色列或终身遵守等内容。
