  yaml_path: translation/extra_canonical/jubilees/003/023.yaml
  text: And the Lord cursed the serpent and was angry with it forever. And he was also angry with the woman, because she listened to the voice of the serpent and ate; and he said to her, “I will greatly multiply your sorrow and your pain; in sorrow you shall bear children, and your desire shall be for your husband, and he will rule over you.”
translation:
  language: zh_hans
  text: 耶和华咒诅了蛇，永远向它发怒。他也向女人发怒，因为她听从蛇的话，吃了。耶和华对她说：“我要大大增添你的愁苦和疼痛；你必在痛苦中生儿女。你必归向你的丈夫[a]，他必管辖你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归向”可按字面理解为转向或归向你的丈夫；这一短语也常译为“恋慕”或“渴望”。其具体含义存在讨论。
    reason: 保留原文短语的歧义，并提示常见传统译法，避免将有争议的词义断言为唯一的直译。
lexical_decisions:
- source_word: ትምዕዖ / ተምዕዓ
  choice: 发怒
  rationale: 该词在本节先后描述耶和华对蛇和女人的反应；译作“发怒”既符合语境，也保留原文对两者平行的表述。
- source_word: ኀዘንኪ፡ ወለፃዕርኪ
  choice: 你的愁苦和疼痛
  rationale: 分别传达忧愁与劳苦、痛楚，避免把两个近义而不完全相同的词合并为一个概念。
- source_word: በሐዘን፡ ለዲ፡ ውሉደ
  choice: 你必在痛苦中生儿育女
  rationale: 以自然现代汉语表达在痛苦中生产儿女的意思，同时不把范围缩限为单次分娩。
- source_word: ኀበ፡ ምትኪ፡ ምግባእኪ፡ ውእቱ
  choice: 你必归向你的丈夫
  rationale: 其中“ምግባእ”基本义为返回、归回；正文据吉兹文直译为“归向”，并用脚注说明传统语境中可能表达的“恋慕”含义。
- source_word: ይኴንነኪ
  choice: 他必管辖你
  rationale: 该动词表示施行权柄、统治或管辖；“管辖”保留陈述本身，不额外判断这是命令、许可还是后果。
theological_decisions:
- issue: 女人“归向”丈夫与丈夫“管辖”她这一关系的性质
  choice: 按原文作为受罚宣告的一部分直陈：“你必归向你的丈夫，他必管辖你。”
  alternative: 将其解释性译为婚姻规范、神圣命令，或反过来淡化为单纯情感依恋
  rationale: 上下文是耶和华因女人听从蛇而发怒并宣告后果。译文不把这一描述进一步系统化为普遍婚姻教义，也不消除“归向／恋慕”的词义张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“大大增添”保留原文加强式；“生儿育女”较口语易懂，但仍适合经文体。神名依《禧年书》上下文及汉语圣经惯例译作“耶和华”。所有脚注标记均已置于正文对应位置。
