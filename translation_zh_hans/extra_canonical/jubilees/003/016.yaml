base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/016.yaml
  text: And we gave him work, and we instructed him to do everything suitable for cultivation. And he was cultivating, and he was naked and did not know it, and was not ashamed, and he kept the garden from the birds and from the beasts and from the cattle, and gathered its fruit and ate, and set aside the remainder for himself.
translation:
  language: zh_hans
  text: 我们给他安排了工作，并教导他做一切适合耕作的事。他耕作着；他赤身露体，却不知道自己赤身露体，也不觉得羞耻。他守护园子，防备飞鸟、野兽和牲畜；又收集园中的果实，吃了，并把余下的留给自己。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምግባረ
  choice: 工作
  rationale: 此处指交给亚当的劳作或职分；译作“工作”自然，也不额外限定为某一种具体农活。
- source_word: ገቢሮተ፡ ኵሉ፡ ዘይስተርኢ፡ ለቅኔ
  choice: 做一切适合耕作的事
  rationale: 保留ገቢሮተ“做”的含义，并将修饰结构自然表达为“适合耕作的事”；“耕作”也与下句的持续劳作相呼应。
- source_word: ይትቀነይ
  choice: 耕作
  rationale: 语境为看守并料理园子，采用范围较宽的“耕作”，避免仅理解为翻土。
- source_word: ዕራቁ፡ ወኢያአምር፡ ወኢየኀፍር
  choice: 赤身露体，自己却不知道，也不觉得羞耻
  rationale: 依次保留赤裸、不知晓和不羞耻三层陈述；加入“自己却”使现代汉语关系清楚，但不解释其原因。
- source_word: የዐቅብ፡ ገነት
  choice: 守护园子
  rationale: 兼有看守、保护之意，后接防备鸟兽，故“守护”最合语境。
- source_word: አዕዋፍ፡ ... አራዊት፡ ... እንስሳ
  choice: 飞鸟、野兽和牲畜
  rationale: 保持三类动物的区分：鸟类、野生兽类与家畜。
- source_word: ያስተጋብእ፡ ፍሬሁ
  choice: 收集园中的果实
  rationale: 动词表达聚集、收取；代词所指为园子，译出“园中的”以符合汉语并明确指代。
- source_word: ያነብር፡ ተረፎ፡ ሎቱ
  choice: 把剩下的为自己存起来
  rationale: 保留“安放/留下余物给自己”的含义；“存起来”符合果实收存的语境。
theological_decisions:
- issue: 亚当不知道自己赤裸的陈述
  choice: 自己却不知道
  alternative: 并不明白赤裸为何物
  rationale: 原文只陈述“不知道”，未明确其对象是赤裸这一事实、赤裸的意义，还是羞耻意识；正文采用最贴近句法的表达，不引入额外神学解释。
- issue: 园中劳作的性质
  choice: 工作／耕作
  alternative: 服侍／事奉
  rationale: 此处语境集中于园子的料理、果实采集和防护；采用日常劳作词汇，避免将该动词神学化为礼仪性“事奉”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。用分号划分耕作、赤裸无羞与守园收果几个并列动作，保留原文的连续叙述节奏；不添加原文没有的因果或道德评价。
