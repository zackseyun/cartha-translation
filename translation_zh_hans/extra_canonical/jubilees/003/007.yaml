  text: Therefore a man and a woman shall be one, and therefore a man shall leave his father and his mother and join to his wife, and they shall become one flesh.
translation:
  language: zh_hans
  text: 因此，男人和女人要成为一体；因此，男人要离开父亲和母亲，与妻子结合，二人要成为一体。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲ ወብእሲት
  choice: 男人和女人
  rationale: 分别对应“男人”与“女人”，保留原文成对并列的表达。
- source_word: አሐደ
  choice: 一体
  rationale: 原义为“一、一个”；在男女关系的语境中译作“一体”，自然且不超出原文。
- source_word: ዘየኀድግ
  choice: 要离开
  rationale: 表达离弃、离开的动作；此处采用现代汉语常用的“离开”。
- source_word: ይጻመር ምስለ ብእሲቱ
  choice: 与妻子结合
  rationale: 动词表示连接、联合；“结合”既保留关系性的联合，也避免加入原文未明说的解释。
- source_word: ሥጋ አሐደ
  choice: 一体
  rationale: 字面为“一个肉身”。按现代汉语圣经语体译作“一体”，正文自然；具体字面义可由词汇说明体现。
theological_decisions:
- issue: 开头“男人和女人成为一”的性质
  choice: 译为“成为一体”
  alternative: 成为一个／合而为一
  rationale: “一体”保留原文的合一陈述，并与末句“一个肉身”的婚姻语境相呼应，但不进一步界定这种合一的神学性质。
- issue: 末句主语数量
  choice: 译为“二人要成为一体”
  alternative: 他们要成为一体
  rationale: 原文使用复数动词“他们要成为”，所指是男人与妻子；“二人”使现代汉语指代清楚，没有增添新的参与者。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。保留原文两次“因此”的论证结构，并以分号呈现两个紧密相连的因果陈述。
