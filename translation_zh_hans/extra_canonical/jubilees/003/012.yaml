  text: And they shall be eighty days in all. And when she had completed these eighty days, we brought her into the garden of Eden, for it is holier than all the earth, and every tree that is planted in it is holy.
translation:
  language: zh_hans
  text: 总共为八十天。这八十天期满后，我们把她带进伊甸园，因为伊甸园比全地都圣洁，园中所栽种的每一棵树也都是圣洁的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይከውና
  choice: 是
  rationale: 此处与“总共”“八十天”连用，表达总计为八十天；采用自然的现代汉语判断句。
- source_word: ፈጺማ
  choice: 满了
  rationale: 该动词在此表示完成规定的日数；“满了这八十天”既贴近原意，也符合汉语叙事表达。
- source_word: አባእናሃ
  choice: 我们把她带进
  rationale: 原文为第一人称复数使其进入；“带进”自然保留了使动和方向意义。
- source_word: ገነት ኤዶም
  choice: 伊甸园
  rationale: 按通行汉语圣经地名表达处理，指伊甸的园子。
- source_word: ቅድስት
  choice: 圣洁
  rationale: 保留该词的礼仪与神圣属性含义，并与后半句同一词根的表述保持一致。
- source_word: ዕፀ ዘትከል
  choice: 所栽种的每一棵树
  rationale: 按关系结构直译其核心意义；“每一棵”对应原文全称范围。
theological_decisions:
- issue: 伊甸园圣洁程度的比较
  choice: 伊甸园比全地都圣洁
  alternative: 它是全地中最圣洁的
  rationale: 原文比较结构可表达高于全地；采用“比全地都圣洁”保留比较语气，避免额外强化为绝对最高级。
- issue: 园中树木的圣洁属性
  choice: 园中所栽种的每一棵树也都是圣洁的
  alternative: 其中一切栽种的树都是圣洁的
  rationale: 保留原文对每棵树的全称断言，不将“圣洁”弱化为普通的分别或洁净。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“总共是八十天”独立成句，以保留原文首句，避免再次遗漏；后句按叙事先后关系自然衔接。原文没有需要在正文中另加标记说明的实质异文，因此不设脚注。
