  yaml_path: translation/extra_canonical/jubilees/003/009.yaml
  text: And after forty days had been completed for Adam in the land where he had been created, we brought him into the garden of Eden, that he might till it and keep it; but his wife was brought in after eighty days, and after this she entered into the garden of Eden.
translation:
  language: zh_hans
  text: 亚当在他受造之地四十天期满后，我们把他带进伊甸园，让他耕作、看守园子。他的妻子则在八十天期满后被带进去[a]；此后，她进入了伊甸园。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把他的妻子带了进去”。
    reason: 原文动词形式也可较直译地理解为第三人称复数主动，但其主语没有明说。
lexical_decisions:
- source_word: ገነት፡ ኤዶም
  choice: 伊甸园
  rationale: 按现代汉语圣经传统译名处理，同时准确表达“园子”与“伊甸”这一地名。
- source_word: ይትቀነይ፡ ወይዕቀባ
  choice: 耕作、看守园子
  rationale: 分别保留两个并列动作：劳作或耕作，以及守护或看守；补出“园子”使汉语指向自然明确。
- source_word: አብአ
  choice: 被带进去
  rationale: 该第三人称复数形式可作无人称被动理解；这样既保留动作，又避免凭空引入身份不明的“他们”。
- source_word: ቦአት፡ ውስተ፡ ገነት፡ ኤዶም
  choice: 她进入了伊甸园
  rationale: 按原文保留随后明确陈述的主动进入动作，不因与前句语义相近而删并。
theological_decisions:
- issue: 亚当与其妻被带入伊甸园的施事者是否相同
  choice: 亚当句保留第一人称复数“我们”，妻子句采用无人称被动“被带进去”
  alternative: 译作“他们把他的妻子带进去”
  rationale: 原文在亚当句使用第一人称复数，而妻子句的第三人称复数可具无人称被动功能；不擅自认定两句施事者相同，也不引入未说明的群体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“满了四十天以后”“在八十天以后”保留原文的时间结构；分号用于呈现妻子被带入与随后进入伊甸园之间既相连又略显重复的原文表述。
