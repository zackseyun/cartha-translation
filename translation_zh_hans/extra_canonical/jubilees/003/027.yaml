base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/027.yaml
  text: And on that day the mouths of all the beasts and cattle and birds and whatever walks and whatever moves were closed from speech, for they all used to speak with one another, with one lip and one tongue.
translation:
  language: zh_hans
  text: 就在那一天，所有野兽、牲畜、飞鸟，以及一切行走和活动的生物，都不再能说话；因为它们先前都彼此交谈，使用一种言语、一种语言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊት
  choice: 野兽
  rationale: 与随后表示家畜或一般牲畜的“እንስሳ”相区别，保留原文列举的类别。
- source_word: እንስሳ
  choice: 牲畜
  rationale: 在“野兽”之后译作“牲畜”，自然呈现野生动物与驯养动物的对举。
- source_word: ያንሶሱ ወዘይትሐወስ
  choice: 爬行和活动之物
  rationale: 分别表达地面爬行与一般移动，避免把两个近义动作合并。
- source_word: ተፈጽመ፡ አፈ…እምነቢብ
  choice: 都不能再开口说话了
  rationale: 原文表达其口停止或终止说话；此译符合现代汉语，同时保留说话能力在当日终止的含义。
- source_word: ክንፈረ፡ አሐደ፡ ወልሳነ፡ አሐደ
  choice: 同一种口音、同一种语言
  rationale: 直义为“一种唇、一种舌”；采用汉语中可理解的表达，保留言语一致性的双重措辞。
theological_decisions:
- issue: 动物此前彼此说话的叙事陈述
  choice: 按原文直接陈述为“此前它们都能彼此交谈”
  alternative: 弱化为比喻性沟通或声音相通
  rationale: 原文明确使用“说话”及“一种唇、一种舌”，不应在翻译中将其解释为比喻。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“就在那一天”承接上下文；“不能再开口说话”比机械直译“口从言语中被封闭”自然，并体现状态的终止。“口音、语言”保留原文平行结构而避免生硬的“一个嘴唇、一条舌头”。
