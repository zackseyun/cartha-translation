  yaml_path: translation/extra_canonical/jubilees/003/030.yaml
  text: Therefore it was commanded on the heavenly tablets concerning all those who know the judgment of the law, that they should cover their shame and should not uncover themselves as the nations uncover themselves.
translation:
  language: zh_hans
  text: 因此，在天上的石版上，就一切知晓律法裁断[a]的人已有命令：他们要遮盖自己的羞处，不可像列国那样显露自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法裁断”也可理解为“律法的条例”“律法的判决”或“公正的准则”。
    reason: 源语 ፍትሐ፡ ሕግ 兼有裁断、规范条例与公正准则的语义，脚注保留其解释空间。
lexical_decisions:
- source_word: በእንተ፡ ዝንቱ
  choice: 因此
  rationale: 承接上文亚当以衣物遮盖羞体一事，表达由此而来的规范。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的石版
  rationale: 保留《禧年书》中记载神圣命令的固定意象；“石版”比泛称“版”更清楚自然。
- source_word: ፍትሐ፡ ሕግ
  choice: 律法判定
  rationale: ፍትሕ 可指判决、公正或法定条例；采用“判定”保留其司法与规范双重意味，不缩窄为单纯的知识或规条。
- source_word: ይክድኑ፡ ኀፍረቶሙ
  choice: 遮盖自己的羞体
  rationale: 直陈遮盖身体羞处之意，既保持庄重，也与本段亚当遮体的语境呼应。
- source_word: ኢይትከሠቱ
  choice: 不可……裸露自己
  rationale: 该词指显露、暴露；结合“羞体”和后面的列国，译为“裸露自己”最符合语境。
- source_word: አሕዛብ
  choice: 列国的人
  rationale: 保留“外邦/诸民族”的群体对照含义，同时避免在此无必要地加入宗教身份色彩。
theological_decisions:
- issue: “ፍትሐ፡ ሕግ”究竟指律法的判决、公义还是条例
  choice: 正文译作“律法判定”，并加注说明语义范围
  alternative: 律法的条例；律法的公义；律法的裁断
  rationale: 源语措辞具有司法和规范层面的张力；不将其无声地限定为某一神学概念。
- issue: “天上的石版”所载命令的效力范围
  choice: 按源文译为针对“一切明白律法判定的人”
  alternative: 解释为只针对以色列人，或普遍针对所有人
  rationale: 本节本身以认知律法者界定对象；不额外导入盟约群体或普世伦理的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“羞体”保持经文语体的含蓄与准确；“列国的人”自然表达诸民族的对照。
