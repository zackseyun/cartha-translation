  yaml_path: translation/extra_canonical/jubilees/003/008.yaml
  text: In the first week Adam was created[a], and the rib—his wife—was made; and in the second week he showed her to him. Therefore the command was given to keep seven days for a male, and two weeks of days for a female, in impurity.
translation:
  language: zh_hans
  text: 在第一周，亚当受造；他的肋骨，即他的妻子，也受造。在第二周，上帝向他显明她。[a] 因此，有命令规定：要为男婴和女婴分别守七天和两个七日周期的不洁期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章把亚当和女人延后进入伊甸园的时间，与后来生男孩和生女孩后的不洁期联系起来。
    reason: cross_reference
lexical_decisions:
- source_word: ሳብዕት
  choice: 七日周期
  rationale: 该词在本节既指创世叙事中的一个七日单位，也构成随后七天与十四天的对应关系；译作“七日周期”比单用“周”更清楚地保留这种结构。
- source_word: ገቦ
  choice: 肋骨
  rationale: 此处指从亚当身上取出、用以造女人的肋骨或身体一侧；结合本章3:5及《创世记》2章的背景，译作普通读者熟悉的“肋骨”。
- source_word: አርአዮ ኪያሃ ሎቱ
  choice: 上帝把她带到他面前
  rationale: 字面含义近于“使他看见她／把她显给他”；按叙事动作译为“带到他面前”，同时不增加婚礼等原文未明说的概念。
- source_word: ርኵስን
  choice: 不洁期
  rationale: 该词表示礼仪上的不洁，不等同于道德罪污；“不洁期”自然地表达规定持续的时段。
theological_decisions:
- issue: 产后不洁条例与亚当、女人受造时间的对应
  choice: 正文以“因此”保留作者建立的因果类比，并在脚注说明其与后来条例的联系
  alternative: 把这段直接改写成《利未记》12章的条例说明
  rationale: 原文明确作出对应，却未在本节完整阐释律法背景；正文不应过度展开，脚注可帮助读者理解。
- issue: “肋骨”与“妻子”的同位关系
  choice: 译为“他妻子——那根肋骨——也受造”
  alternative: 译为“他的妻子由肋骨造成”
  rationale: 前者较贴近原文凝缩而略显突兀的表达，并保留“肋骨”与“妻子”之间的同位张力；后者更顺畅，却加入了原句未明说的“由……造成”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“七日周期”保留本节反复出现的七日结构；“不洁期”明确为礼仪时段，避免让读者误解为道德定罪。脚注标记置于作者完成两段受造时间叙述之后。
