  text: And in the first week of the first jubilee, Adam and his wife were in the garden of Eden for seven years, tilling and keeping it.
translation:
  language: zh_hans
  text: 在第一个禧年的第一个七年期，亚当和他的妻子在伊甸园中住了七年，耕作并看守园子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሱባዔ
  choice: 在……七年期
  rationale: 该词指由七个单位构成的周期；结合下文“七年”，译作“七年期”既清楚又保留《禧年书》的年代结构。
- source_word: አዮቤሌው
  choice: 禧年
  rationale: 保留本书以禧年为时间单位的专门用语。
- source_word: ገነት ኤዶም
  choice: 伊甸园
  rationale: 采用现代中文圣经及一般读者熟悉的地名表达。
- source_word: ይትቀነይ ወየዐቅብ
  choice: 耕作并看守园子
  rationale: 两个动词分别表达劳作、耕种与守护、看守；补出“园子”使中文宾语明确，并呼应创世记叙事。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留“第一个禧年的第一个七年期”这一年代计算方式，不将其改写为解释性年数。原文开头疑似承接前文的“以色列要终生遵守”，按给定节号及英文审校层的划分，不纳入本节正文。
