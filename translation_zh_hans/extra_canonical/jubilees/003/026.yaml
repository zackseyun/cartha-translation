base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/026.yaml
  text: And on that day on which Adam went out from the garden[a], he burned incense as a sweet fragrance—frankincense, galbanum, stacte, and spices—in the morning with the rising of the sun, from the day when he covered his shame.
translation:
  language: zh_hans
  text: 亚当离开伊甸园的那一天，清晨日出时，他焚香，烧乳香、白松香、苏合香和香料[a]，作为馨香的献供；这是从他遮盖羞处的那一天开始的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所列几种芳香物的原文在若干处难以确定，其具体物种对应也未尽明确；大意是亚当在日出时焚烧香料，献上馨香。
    reason: textual_variant
lexical_decisions:
- source_word: ዐጠነ
  choice: 焚烧……献上馨香
  rationale: 该动词表示焚香、使香气上腾；结合后面的香料清单，用“焚烧”自然表达其祭献行为。
- source_word: መዐዛ፡ ሠናይ
  choice: 馨香
  rationale: 直义为“美好的香气”；“馨香”在庄重宗教语境中自然，也保留蒙悦纳之香的表达，但不额外断定神学含义。
- source_word: ዕጣነ፡ ስኂነ፡ ወቀንአተ፡ ወማየ፡ ልብን፡ ወሰንበለ
  choice: 乳香、古蓬香、苏合香和香料
  rationale: 依现有吉兹文本及传统校勘所辨识的四类芳香物翻译；其中若干词的具体植物对应并不完全确定，因此以脚注提示文本困难。
- source_word: ኀፍረቶ
  choice: 羞处
  rationale: 该词在上下文指赤身所显露、需要遮盖的身体羞处；“羞处”比抽象的“羞耻”更贴近具体所指。
theological_decisions:
- issue: 亚当焚香行为的性质
  choice: 以“献上馨香”表达献祭性动作
  alternative: 仅译作“熏出香气”
  rationale: 上下文的焚香及“馨香”措辞显示这并非普通熏香；但未补入“赎罪祭”等原文没有的祭类名称。
- issue: 末句时间关系
  choice: 保留“从他遮盖羞处的那一天开始”
  alternative: 并入前句，理解为仅指同一天发生
  rationale: 吉兹文使用“从……之日”结构，语义略显突兀；正文保留其起始时间意味，不擅自消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“伊甸园”“乳香”“苏合香”“馨香”为读者较熟悉的宗教及香料用语；对难以确指的香料名称不作过度确定。
