  yaml_path: translation/extra_canonical/jubilees/003/020.yaml
  text: And the woman saw the tree, that it was delightful[a] and pleasing to the eye, and its fruit was good for food, and she took from it and ate.
translation:
  language: zh_hans
  text: 女人看见那棵树令人喜爱[a]，悦人眼目，果子也适合食用；她就从树上取了果子来吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处的吉兹语词“አዳም”（ʾaddām）是形容词，意为“令人喜爱”或“令人愉悦”，并非人名“亚当”。
    reason: lexical_choice
lexical_decisions:
- source_word: አዳም
  choice: 令人喜爱
  rationale: 此处为形容词，表达树给人带来的愉悦或喜爱之感；与下文“悦人眼目”并列，既保留两层描述，也避免误作人名“亚当”。
- source_word: ለበሊዕ
  choice: 适合食用
  rationale: 该表达意为“供吃食、适于吃”，译作“适合食用”自然准确，并与创世记背景相符。
- source_word: ወነሥአት፡ እምኔሁ፡ ወበልዐት
  choice: 就从树上摘下果子吃了
  rationale: 原文直译为“她从它取了，并吃了”；根据紧邻的“果子”补出宾语，使中文指代清楚而不增加新的情节。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代汉语。“令人喜爱”与“悦人眼目”分别保留原文中总体愉悦感和视觉吸引力两项并列描述；句末补明“果子”，以符合现代汉语表达。
