  yaml_path: translation/extra_canonical/jubilees/019/010.yaml
  text: And in the fourth year of it he took a wife for Isaac his son, and her name was Rebekah, daughter of Bethuel, the son of Nahor, Abraham’s brother, the sister of Laban, and the daughter of Bethuel; and Bethuel was the son of Milcah, the wife of Nahor, Abraham’s brother.
translation:
  language: zh_hans
  text: 到了那一时期的第四年，他为儿子以撒娶了一个妻子，名叫利百加。她是亚伯拉罕的兄弟拿鹤之子彼土利的女儿，也是拉班的妹妹，又是彼土利的女儿；彼土利则是亚伯拉罕的兄弟拿鹤之妻密迦的儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先称彼土利为拿鹤之子，随后又称他为密迦的儿子，并重复说利百加是彼土利的女儿；译文保留了这些表述。
    reason: 提醒读者这些看似重复或不一致的谱系措辞来自原文，而非中文误写。
lexical_decisions:
- source_word: ወበዓመት፡ ራብዕ፡ ሎቱ
  choice: 到了那一时期的第四年
  rationale: 原文直译近于“在它／那事的第四年”，所指须由上文补足；译文保留这种回指，不擅自指定具体禧年或七年周期。
- source_word: ነሥአ፡ ለይስሐቅ፡ ወልዱ፡ ብእሲተ
  choice: 他为儿子以撒娶了一个妻子
  rationale: 按闪语式婚姻表达自然转为现代汉语“为……娶妻”，同时保留主语未在本句明说、须承接上文的特点。
- source_word: ርብቃ
  choice: 利百加
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
- source_word: ባቱኤል
  choice: 彼土利
  rationale: 采用中文圣经传统通行译名。
- source_word: ናኮር
  choice: 拿鹤
  rationale: 采用中文圣经传统通行译名。
- source_word: ሜልካ
  choice: 密迦
  rationale: 采用中文圣经传统通行译名。
- source_word: ወልደ
  choice: 之子／儿子
  rationale: 原词为亲属谱系用语；本节先称彼土利为拿鹤之子，后又称其为密迦之子，译文不把后者改写成“外孙”等解释性称谓。
theological_decisions:
- issue: 彼土利的双重谱系表述
  choice: 保留“拿鹤之子”与“密迦的儿子”两种说法，并照录“彼土利的女儿”的重复
  alternative: 合并为“拿鹤和密迦的儿子彼土利之女”，并删除重复成分
  rationale: 原文有意或因传本文本形成的重复与双重表述不应被静默整理；保留它们可忠实呈现现存吉兹文本的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。谱系关系尽量依照吉兹文本的次序展开；“那一时期”用于保留原文回指对象未明说的特点。所给源文开头“上帝……天上的版”显然是切分时残留的上一句片段，正文依据本节完整句法从“到了第四年”起译。
