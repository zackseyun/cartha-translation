  yaml_path: translation/extra_canonical/jubilees/019/024.yaml
  text: May God be mine and my seed's, Jacob's and his seed's, forever. And in his seed my name and the name of my fathers—Shem and Noah and Enoch and Mahalalel and Enosh and Seth—shall be blessed.
translation:
  language: zh_hans
  text: 愿上帝永远作我和我后裔的上帝，也作雅各和他后裔的上帝。[a]愿我的名和我祖先——闪、挪亚、以诺、玛勒列、以挪士、塞特——的名，都在雅各的后裔中蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作：“愿我的后裔永远属于雅各和他的后裔。”
    reason: 保留审校轨迹所反映的另一种句法理解；该读法将“我的后裔”而非“上帝”视为归属关系的主体。
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 上帝
  rationale: 这里是愿望句的主语；明确译出，以免误把“后裔”理解为主语。
- source_word: ኪያየ ወዘርእየ
  choice: 作我和我后裔的上帝
  rationale: 字面关系接近“属于我和我的后裔”；汉语以“作……的上帝”自然表达盟约性的归属，同时保留其神学张力。
- source_word: ለያዕቆብ ወለዘርኡ
  choice: 也作雅各和他后裔的上帝
  rationale: 按与前半句平行的与格结构理解；补出“上帝”仅为汉语表达完整，并未增加新的指称。
- source_word: ኵሎ መዋዕለ
  choice: 永远
  rationale: 该表达指所有日子、恒久不止；“永远”简洁自然。
- source_word: ይትባረክ
  choice: 蒙福
  rationale: 保留被动意义，表示这些名字在雅各后裔中受到祝福或被称颂，而不武断指定施事者。
- source_word: አበዊየ
  choice: 我祖先
  rationale: 此处随后列出多代先祖，现代汉语用“祖先”比字面的“父辈”更准确自然。
theological_decisions:
- issue: 上帝与利百加、其后裔、雅各及其后裔之间的归属关系
  choice: 愿上帝永远作我和我后裔的上帝，也作雅各和他后裔的上帝
  alternative: 愿上帝属于我和我的后裔、雅各和他的后裔，直到永远
  rationale: 源文以“上帝”为主语，表达归属或盟约关系；正文采用自然且庄重的汉语，不把句子误解为“我的后裔属于雅各”。
- issue: “在他的后裔中蒙福”的含义
  choice: 保留“名……在他的后裔中蒙福”
  alternative: 他的后裔要称颂我的名和我祖先的名
  rationale: 源文的被动形式并未明确说明谁施行祝福，也可能兼有“得福”与“被称颂”的意味，因此不将其具体化为某一主动行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依照常见圣经汉译形式；通过重复“作……的上帝”澄清源文句法，同时用脚注保存归属表达的字面歧义。
