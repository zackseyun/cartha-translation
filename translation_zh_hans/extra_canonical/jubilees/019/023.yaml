lexical_decisions:
- source_word: ይክል፡ ሰብእ፡ ኈልቆ፡ ኖላ፡ ምድር
  choice: 人若能数清地上的沙粒
  rationale: 按条件句自然译出“人若能数……”，并将“地上的沙”表达为现代汉语常用的“地上的沙粒”。
- source_word: ይትኌለቍ፡ ዘርኡሂ
  choice: 他的后裔也能数得清
  rationale: 保留源文“他的后裔也将被数算”的可数意义；汉语用主动可能式更自然，同时不把“后裔”误解为单数个体。
- source_word: ወኵሉን፡ በረከት፡ እለ፡ ባረከኒ
  choice: 他赐给我的一切福分
  rationale: ባረከኒ直译为“他祝福了我”；此处用“他赐给我的福分”符合现代汉语搭配，并保留未明说的第三人称主语，不增补“主”。
theological_decisions:
- issue: 赐福者的身份
  choice: 他赐给我的
  alternative: 主赐给我的
  rationale: 源文只有第三人称阳性单数动词“他祝福我”，没有明写神名或“主”；因此不在正文中补入特定身份。
- issue: 后裔是否可数
  choice: 他的后裔也能数得清
  alternative: 他的后裔也将多得不可胜数
  rationale: 源文表面延续“数算”措辞，保留条件句所表达的不可数修辞，不将其直接释义为“多得不可胜数”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“数清”比单用“数”更自然地表达能够数尽；“后裔”保持经文语体。正文不擅自补出“主”。
