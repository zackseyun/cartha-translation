  text: that is, Hebron—for four hundred pieces of silver. And they urged him, saying, “We will give it to you for nothing,” but he did not take it from their hands for nothing, because he gave the full price in silver for the place.
translation:
  language: zh_hans
  text: 就是希伯仑，价银四百。众人劝他说：“我们白送给你。”但他没有白白从他们手中收下，因为他为那地方付了足额的银价。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኬብሮን
  choice: 希伯仑
  rationale: 采用该地名通行的现代汉语圣经译名。
- source_word: በአርባዕቱ፡ ምእት፡ ብሩር
  choice: 用四百舍客勒银子买下
  rationale: 原文直指“四百银”；结合购地语境，以“舍客勒银子”表达计价银的通常含义，并用“买下”自然承接前文所指之地。
- source_word: በከ
  choice: 白送／白白
  rationale: 该词在提议和拒绝中重复出现，均保留“无偿、不要钱”的意义及修辞呼应。
- source_word: ብሩረ፡ ፍጹመ
  choice: 付足了银价
  rationale: 表达以银支付完整价款，既保留“足额”的重点，也符合现代汉语交易语境。
