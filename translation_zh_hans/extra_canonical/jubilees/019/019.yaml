  text: 他必在地上的万国中出众。如今，我儿以撒……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘይቀውም
  choice: 他必……脱颖而出
  rationale: 该形式在本句关系结构中表达将来意义；字面核心是“站立、挺立”，结合“从万国中”表示出众、卓然而立。译作“脱颖而出”较自然，同时保留其区别于众国的含义。
- source_word: እምኵሎሙ፡ አሕዛብ
  choice: 从……万国中
  rationale: እም 表示“从……中”，ኵሎሙ 表示“所有”，አሕዛብ 为“列国、万国”。
- source_word: እለ፡ ዲበ፡ ገጸ፡ ምድር
  choice: 地面上的
  rationale: 按短语结构译为“在地面上的”；“地面”保留“地之表面”的具体意象。
- source_word: ወናሁ
  choice: 现在
  rationale: 该连接表达“看哪／如今／现在”。此处引出对以撒的直接称呼，采用现代汉语自然的“现在”，不额外强化为视觉性的“看哪”。
- source_word: ይስሐቅ፡ ወልድየ
  choice: 我儿以撒
  rationale: ይስሐቅ 为“以撒”，ወልድየ 为“我的儿子”；按自然汉语称呼次序译为“我儿以撒”。
theological_decisions:
- issue: ዘይቀውም 所指对象及其突出程度
  choice: 以单数男性代词“他”承接上下文，并译为“脱颖而出”
  alternative: “他必屹立于地面上的万国之上”或“他必从地面上的万国中兴起”
  rationale: 原文片段以关系形式开始，主语须由上文补足；不把“从万国中”扩大解释成统治万国，以免加入原文未明说的权柄或至高地位。
- issue: 片段末尾的不完整句法
  choice: 在“我儿以撒”后用省略号表示句意延续
  alternative: 以句号收束，或自行补足后文
  rationale: 所给原文止于称呼，明显与下一片段相连；省略号忠实标示文本边界，不擅自补写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句保持经文式凝练表达；“脱颖而出”传达从万国中卓然而立的语义，但避免增添统治或超越万国的神学判断。末句按片段性质保留未完状态。
