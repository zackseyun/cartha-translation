revisions:
- from: 他必从地面上的万国中脱颖而出。现在，我儿以撒……
  to: 他必在地上的万国中出众。如今，我儿以撒……
  rationale: 作两处轻微措辞调整：“出众”保留“在列国中显著”的比较意义，避免“脱颖而出”的人才典故联想；“地上的万国”和“如今”使汉语更自然庄重。其余保留：单数“他”由上下文补足，且不将其解释为统治列国；省略号继续标示片段在称呼中断。
