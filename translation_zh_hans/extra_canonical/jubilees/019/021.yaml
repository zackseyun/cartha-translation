  yaml_path: translation/extra_canonical/jubilees/019/021.yaml
  text: For a blessing on the earth from now and throughout all the generations of the earth. Let your hands be strong, and let your heart rejoice in your son Jacob, because I have loved him far more than all of them.
translation:
  language: zh_hans
  text: 为使大地从今以后直到地上的万代蒙福。愿你的手刚强，愿你的心因你儿子雅各欢喜，因为我爱他，远胜过爱他们众人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበረከት
  choice: 成为福分
  rationale: 该词组表达目的或结果，直译近于“为着福分”；结合上文残句性质，译作“成为福分”使现代汉语通顺，同时保留祝福临到大地的含义。
- source_word: ኵሉ ትውልደ ምድር
  choice: 地上世世代代
  rationale: 逐项保留“所有、世代、大地”的范围意义，以自然汉语表达绵延的历代。
- source_word: ይጽንዓ እደዊኪ
  choice: 愿你的双手有力量
  rationale: 动词含坚固、刚强之意；采用祝愿式“愿”，并以“双手有力量”呈现原文的身体意象。
- source_word: ትትፈሣሕ ልብኪ
  choice: 愿你的心……欢喜
  rationale: 保留“心”作为喜乐主体的原文意象和祝愿语气。
- source_word: ፈድፋደ እምኵሎሙ
  choice: 远胜过他们众人
  rationale: ፈድፋደ 表示极其、格外，እምኵሎሙ 表示“比他们所有人”；译文明确保留比较对象而不省略。
theological_decisions:
- issue: 开头“为福分”所指的主语
  choice: 用“他”承接语境中的雅各
  alternative: 译为无主句“为使地上蒙福”
  rationale: 本节后文明确提到雅各，英语审校层也把该短语理解为人物在地上成为福分；但吉兹语引文从片段开始，句法可能承接前文。正文采用最自然的语境承接，不额外引入特定宗派解释。
- issue: “我爱他”中说话者及“他们”的身份
  choice: 保留第一人称与泛指复数，不在正文点明身份
  alternative: 把说话者或比较对象解释为具体人物群体
  rationale: 本节片段自身没有明说说话者，也未列出“他们”所指；保留代词可维护原文的语境依赖和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“世世代代”“愿……欢喜”等表达适合经籍体裁，但避免文言化。原文开头似承接前句；为形成可读的独立经节，以“他”承接本节明确出现的雅各。
