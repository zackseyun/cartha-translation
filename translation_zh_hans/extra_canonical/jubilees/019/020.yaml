  yaml_path: translation/extra_canonical/jubilees/019/020.yaml
  text: He loves Esau more than Jacob, but I see your righteous affection for Jacob. And continue still to show him kindness, and let your eyes be upon him in love, because he will be a blessing on the earth from now and through all the generations of the earth.
translation:
  language: zh_hans
  text: 他爱以扫，胜过爱雅各；但我看得出，你对雅各怀着正义的爱。你仍要继续善待他，以慈爱看顾他，因为从今以后，在地上的万代之中，他必成为祝福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያፈቅሮ
  choice: 他爱
  rationale: 该动词包含第三人称阳性单数主语和第三人称阳性单数宾语；汉语须补出主语“他”，宾语则由后接的“以扫”明确。
- source_word: እም ያዕቆብ
  choice: 胜过爱雅各
  rationale: 比较结构表达对以扫的爱超过对雅各的爱；补出第二个“爱”，使现代汉语清楚自然。
- source_word: መፍቀሪተ ጽድቅ
  choice: 合乎正义的爱
  rationale: 保留“爱/ affection”与“正义、公义”之间的修饰关系，不将其窄化为某种特定教义术语。
- source_word: አሡንዮ ላዕሌሁ
  choice: 善待他
  rationale: 按语境表达持续向雅各施恩、行善的意思，避免生硬直译。
- source_word: ወይኩና አዕይንትኪ ላዕሌሁ ለፍቅር
  choice: 以慈爱看顾他
  rationale: “眼目在他身上”是眷顾、关注的习语；译为“看顾”自然，同时保留“出于爱”的含义。
- source_word: ይከውን
  choice: 他必成为
  rationale: 表达后续预言性结果；依经审核的整节文本补足其表语“地上的福分”。
theological_decisions:
- issue: 对雅各之爱的性质
  choice: 合乎正义的爱
  alternative: 公义之爱／正当的爱
  rationale: “合乎正义”既保留ጽድቅ的伦理与神学张力，也避免让现代读者误解为一个固定宗派术语。
- issue: 雅各将成为“福分”还是“蒙福者”
  choice: 成为地上的福分
  alternative: 在地上蒙福
  rationale: 依据经审核的整节证据保留使他人成为有福的工具这一较强表达，不改写成单纯领受福气。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以慈爱看顾他”自然呈现原文“眼目在他身上，为要爱他”的习语；“从今以后，直到大地世世代代”保留时间跨度与全地范围。开头的“他”在所给吉兹语片段中由动词形态体现，具体所指须由上文确定，因此正文不擅自加入人名。
