  rationale: 仅作汉语措辞调整：将末句的时间范围改为自然且不改变意义的表达，并以“成为祝福”消除“福分”可能造成的领受性歧义。其余人称指向、比较关系及“眼目在他身上”的眷顾性习语均予保留。
