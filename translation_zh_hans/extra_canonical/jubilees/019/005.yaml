base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/005.yaml
  text: He spoke with the sons of Heth so that they might give him a place in which to bury his dead. And the LORD gave him favor before all who saw him[5], and he entreated courteously of the sons of Heth, and they gave him the land of the double cave, which is opposite Mamre—
translation:
  language: zh_hans
  text: 他与赫人商议，请他们给他一处地方，好把他的死人葬在那里。耶和华使所有见到他的人都恩待他；他谦恭地恳求赫人，他们便把幔利对面的双洞之地给了他——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተናገረ፡ ምስለ
  choice: 与……商议
  rationale: 原文直译为“与……说话”；结合向赫人求取墓地的语境，“商议”自然表达交涉之意，又不过度具体化。
- source_word: ውሉደ፡ ኬጥ
  choice: 赫人
  rationale: 字面为“赫的子孙”，对应《创世记》相关叙事中通行的族名“赫人”。
- source_word: መካነ
  choice: 一处地方
  rationale: 保留原词“地方、处所”的宽泛含义，不预先译成“坟地”。
- source_word: ቤድኖ
  choice: 他的死人
  rationale: 原文指“他的死者/尸身”；此处采用庄重且贴近圣经叙事习惯的表达，并保留所指关系。
- source_word: ሞገሰ
  choice: 恩
  rationale: 该词表示恩宠、好感；“在……面前蒙恩”既贴近原文结构，也符合现代中文圣经语体。
- source_word: በየውሀት
  choice: 谦恭地
  rationale: 表示温和、柔顺或谦逊的态度；“谦恭地”适合此处恳求交涉的语境。
- source_word: ምድረ፡ ባዓት፡ ዘካዕበት
  choice: 麦比拉洞那块地
  rationale: 该短语字面可理解为“双洞之地”，但在亚伯拉罕安葬死者的传统语境中对应专名“麦比拉洞”；加入“那块地”保留ምድር的土地含义。
- source_word: መምብሬም
  choice: 幔利
  rationale: 按圣经地名通行译法音译 Mamre。
theological_decisions:
- issue: 神赐恩宠与人的交涉并列
  choice: 保留“耶和华使他……蒙恩”及随后“他……恳求”的并列关系
  alternative: 将蒙恩解释为交涉成功的单一原因，或淡化神的行动
  rationale: 原文同时陈述神所赐的恩宠和亚伯拉罕谦恭的请求；译文不消解二者之间的神学张力。
- issue: “所有看见他的人”的范围
  choice: 直译为“所有看见他的人”
  alternative: 意译为“所有在场的人”或“众赫人”
  rationale: 原文范围宽泛，未明确仅限赫人或现场群众，因此不擅自收窄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文各分句的推进关系，并以破折号呈现本节在“幔利对面”之后未完、承接下文的状态。未采用英文咨询层中明显错置且与本节无关的脚注[5]。
