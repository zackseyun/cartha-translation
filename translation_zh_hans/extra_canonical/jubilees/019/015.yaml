  yaml_path: translation/extra_canonical/jubilees/019/015.yaml
  text: And all his deeds were fierce. And Abraham loved Jacob, but Isaac loved Esau. And Abraham saw the deeds of Esau, and he knew that in Jacob his name and seed would be called. And he called Rebekah and commanded her concerning Jacob, because he knew that she loved Jacob much more.
translation:
  language: zh_hans
  text: 他所做的一切都很凶暴。亚伯拉罕爱雅各，以撒却爱以扫。亚伯拉罕看见以扫的所作所为，就知道自己的名和后裔将要在雅各里面被称。[a]于是，他把利百加叫来，为雅各的事吩咐她，因为他知道她格外爱雅各。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“他的名和后裔要在雅各中为他被称。”此处“他的”在叙事中指亚伯拉罕；“被称”一语的确切含义保留其原有的表达张力。
    reason: 保留源文的被动表述及“在雅各中”的措辞，不将其限定解释为家名或血脉的“延续”。
  - marker: b
    text: 原文只说利百加“格外”或“更加”爱雅各，未明说比较对象。
    reason: 避免将上下文中可能暗示的以扫作为源文明确陈述的比较对象。
lexical_decisions:
- source_word: ድሩክ
  choice: 凶暴
  rationale: 该词在此描述以扫一切行为的猛烈、凶悍性质；“凶暴”既保留负面力度，也比“凶猛”更适合修饰人的行事。
- source_word: ይጼዋዕ ሎቱ ስም ወዘርእ
  choice: 自己的名和后裔将要在雅各身上得以延续
  rationale: 原文直译近于“名和后裔要为他在雅各中被称”；中文采用自然表达，传达亚伯拉罕的家名与血脉将由雅各承续，同时以脚注保存字面结构。
- source_word: አዘዘ በእንተ ያዕቆብ
  choice: 为雅各的事嘱咐她
  rationale: 动词表示吩咐、命令；在家庭叙事语境中，“嘱咐”自然庄重，并保留其向利百加交代雅各之事的含义。
- source_word: ፈድፋደ
  choice: 远胜于以扫
  rationale: 该副词表示极其、更加；结合“爱雅各”的比较语境译作“远胜于”，而比较对象“以扫”由上下文补明，并以脚注说明。
theological_decisions:
- issue: “名和后裔被称”所表达的承续关系
  choice: 译为亚伯拉罕的名和后裔在雅各身上得以延续
  alternative: 他的名和后裔要在雅各里被称
  rationale: 避免将“被称”解释成特定的救赎论术语；正文只表达家名与后裔经雅各承续，脚注保留原文较含混的被动说法。
- issue: 末句比较对象是否明说
  choice: 补出“以扫”
  alternative: 她更加爱雅各
  rationale: 原文只说她“更加/极其”爱雅各，比较对象没有明写；根据紧邻的雅各—以扫对照补出以扫可使现代中文清楚，但用脚注标明这一补足。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以“却”呈现亚伯拉罕与以撒各自偏爱的对照；“所作所为”“得以延续”“嘱咐”兼顾自然汉语与古代家族叙事的庄重感。
