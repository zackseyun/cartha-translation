  text: And he was patient in spirit[4], and he spoke with the sons of Heth.
translation:
  language: zh_hans
  text: 他在心志上忍耐，并同赫人交谈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትዕግሥተ፡ መንፈስ
  choice: 心里忍耐
  rationale: 该短语直译为“灵里的忍耐”；现代汉语用“心里忍耐”既保留内在的坚忍之意，也避免生硬表达。
- source_word: sons of Heth（据上下文及英译所保存的读法）
  choice: 赫人
  rationale: 这是现代汉语圣经传统中对“赫的子孙”的自然族称；比逐字译作“赫的儿子们”更符合此处群体所指。
- source_word: spoke with（据英译审校层所保存的句意）
  choice: 交涉
  rationale: 上下文涉及亚伯拉罕为安葬之地与赫人商谈；“交涉”比泛指的“说话”更准确，同时不增添交易结果。
theological_decisions:
- issue: 亚伯拉罕受试验时的内在态度
  choice: 译作“心里忍耐”，只陈述其坚忍
  alternative: 译作“心平气和”或“毫无怨言”
  rationale: 原文强调忍耐的心志，并未要求把它解释为完全没有悲伤、愤怒或疑问，因此不把经文的评价绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赫人”沿用通行的圣经族名；句式简洁，并保留原文对亚伯拉罕内在忍耐的强调。
