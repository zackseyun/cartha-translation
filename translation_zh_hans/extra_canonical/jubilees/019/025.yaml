  text: and Adam. And they shall be to establish heaven and to strengthen the earth and to renew all.
translation:
  language: zh_hans
  text: 还有亚当。他们将建立天、坚固大地、更新一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译作：“他们将是为了建立天、坚固大地、更新一切。”原文在“他们将是／成为”之后接三个带 ለ- 的动词性形式；此处按目的关系译为“建立……、坚固……、更新……”。
    reason: 说明原文“将是／成为”后接三个带 ለ- 动词性形式的较形式化译法，不增添原文未明示的“力量”。
lexical_decisions:
- source_word: ለሳርረ፡ ሰማይ
  choice: 建立天
  rationale: 动词词根表达奠立、建立；前缀 ለ- 与动词性形式在此自然表示目的，故译作“建立”，不译成较弱的“支撑”或名词化的“作天的支柱”。
- source_word: ለአጽንዖ፡ ምድር
  choice: 坚固地
  rationale: 表达使大地稳固、坚强；“坚固地”既贴近词义，又与“建立天”构成自然的平行结构。
- source_word: ለኀድሶ፡ ኵሉ
  choice: 更新一切
  rationale: ኀደሰ 表示更新、使之焕新；ኵሉ 单独表示“一切”，原文未明说“万物”，故保留其涵盖范围的开放性。
- source_word: ይኩኑ
  choice: 他们将要
  rationale: 保留第三人称复数与将来意味；其后连续的目的性动词在汉语中可直接组成谓语序列。
theological_decisions:
- issue: “一切”的范围
  choice: 更新一切
  alternative: 更新万有
  rationale: 原文仅用“全体／一切”，没有明确限定为受造万物；译作“一切”可保留其语义与神学范围的含混性。
- issue: 天与地的“建立／坚固”是否应理解为支撑宇宙
  choice: 建立天、坚固地
  alternative: 支撑天、巩固地
  rationale: 按词根分别直译，不把这句话解释成特定宇宙观，也不将两个动词合并为同一概念。
translation_notes:
  register: 采用庄重而现代的普通话。“建立天、坚固地、更新一切”保留原文三个并列成分及其节奏；以脚注说明主句结构的另一种较直译理解。
