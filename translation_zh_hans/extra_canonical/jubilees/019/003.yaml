    text: 所据文本的转录在“我们试验他”处似有讹误，字面可能被读作“我们记念他（或她）”；本译依校勘读法及本章关于试验亚伯拉罕的上下文。所提供的吉兹文行文末尾也有残缺，末句依完整经文恢复。
    reason: textual_and_source_note
lexical_decisions:
- source_word: ይብክያ
  choice: 为她哀哭
  rationale: 该动词表达哭泣、哀悼；在撒拉死亡与安葬的语境中，“哀哭”自然且准确。
- source_word: ይቅበራ
  choice: 埋葬她
  rationale: 保留动词“埋葬”及其阴性宾语，不沿用将其遗漏的旧译。
- source_word: ወመከርኖ（校勘读法）
  choice: 我们试验他
  rationale: 采用经校勘确认、也符合本章试验亚伯拉罕这一上下文的读法；用户所列文本中的ወናዝከሮ很可能是讹误或转录错误。
- source_word: ይትነገሥ፡ መንፈሱ
  choice: 他的心灵是否能忍耐
  rationale: 以现代汉语表达其心灵受约束、保持耐心之意，同时不把这种内在状态过度解释为某一特定德性体系。
- source_word: በነገረ፡ አፉ（据完整经文）
  choice: 他口中……说出……话
  rationale: 保留原文关于“口中言语”的具体表达，译成自然汉语。
theological_decisions:
- issue: 复数第一人称“我们”的说话者身份
  choice: 保留“我们”，不在正文中明确其身份
  alternative: 译成“上帝试验他”或“天使试验他”
  rationale: 原文使用第一人称复数；直接指明主体会加入上下文推断，并可能消除文本本身保留的叙事张力。
- issue: 亚伯拉罕受试验时的表现
  choice: 译为心灵能忍耐，口中没有说出激烈的话
  alternative: 概括为“他顺服地通过了试验”
  rationale: 原文分别描述内在忍耐与外在言语，不宜用神学性总结取代具体陈述。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“哀哭”“埋葬”贴合丧葬语境；“没有说出激烈的话”比生硬直译“他口里的言语没有变得强暴”更自然，同时保留言语未失控的含义。
