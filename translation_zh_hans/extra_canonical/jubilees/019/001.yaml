  text: And in the first year of the first week in the fifty-eighth jubilee[1], Abraham returned and dwelt opposite Hebron—that is, Kiriath-arba—for another week of years.
translation:
  language: zh_hans
  text: 在第五十八个禧年的第一个七年周期的第一年，亚伯拉罕回来，住在希伯仑对面；希伯仑就是基列·亚巴。他又住了一个七年周期。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፶ወ፰ እዮቤልዉ
  choice: 第五十八个禧年
  rationale: 原文数字፶ወ፰直译为五十加八，即五十八；依所提供的吉兹语文本翻译。
- source_word: ሱባዔ
  choice: 七年周期
  rationale: 该词本义为“七个一组／一周”；在《禧年书》的纪年语境中指以七年为一组的周期。译作“七年周期”既清楚表达含义，也保留其特殊历法概念。
- source_word: ተመይጠ
  choice: 回来
  rationale: 表达亚伯拉罕返回某地，采用自然且贴近原义的现代汉语。
- source_word: አንጻረ ኬብሮን
  choice: 希伯仑对面
  rationale: አንጻረ表示“面对、在……对面”，不弱化为泛指的“附近”。
- source_word: ቀርያታርቦቅ
  choice: 基列·亚巴
  rationale: 按该地名所对应的闪语名称音译；原文以此说明希伯仑的别名。
- source_word: ኀደረ
  choice: 住
  rationale: 此处表示停留、居住；结合句末持续一个七年周期的说明，译作“住”最自然。
theological_decisions:
- issue: “七年周期”的历法含义
  choice: 两处均译作“七年周期”
  alternative: 七年／年周
  rationale: 避免只译成“七年”而抹去《禧年书》以七年为单位组织历史的核心概念，同时避免“年周”对普通读者过于生硬。
- issue: 禧年序数的文本差异
  choice: 第五十八个禧年
  alternative: 第四十八个禧年；某些其他文本传统的不同数字
  rationale: 严格遵循所给吉兹语原文፶ወ፰，不以其他版本或推算结果改写正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“七年周期”兼顾原文形式与普通读者的理解；地名使用常见圣经汉语形式。“他在那里”是为使末句汉语指向清楚而作的轻度显化，不改变原文信息。
