- from: 在第五十八个禧年的第一个七年周期的第一年，亚伯拉罕回来，住在希伯仑对面，就是基列·亚巴；他在那里又住了一个七年周期。
  to: 在第五十八个禧年的第一个七年周期的第一年，亚伯拉罕回来，住在希伯仑对面；希伯仑就是基列·亚巴。他又住了一个七年周期。
  rationale: 将地名同位语另行表述，明确“基列·亚巴”是希伯仑的别名，同时保留“对面”的具体空间关系、“第五十八个”的原文数字，以及“七年周期”的历法术语。末句保留原文“又一个七年周期”的持续时间，未增添“在那里”等原文未明说的地点指代。
