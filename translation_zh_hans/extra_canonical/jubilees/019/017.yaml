  text: than Esau. And he said to her, “My daughter, keep my son Jacob, for he will be in my place on the earth, and for a blessing in the midst of the sons of men, and for all the seed of Shem.”
translation:
  language: zh_hans
  text: 胜过以扫。他对她说：“我的女儿，要守护我的儿子雅各，因为他要在地上代替我，成为世人中间的福，也成为闪所有后裔的福。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些旧译在句末作“并成为闪一切后裔的荣耀”；现存吉兹文没有“荣耀”一词。
    reason: 说明旧译所增“荣耀”缺乏所给吉兹文本的词汇依据，避免读者误以为正文遗漏。
lexical_decisions:
- source_word: ዐቀቢ
  choice: 看顾
  rationale: 该命令式动词有守护、照料之意；“看顾”既保留保护含义，也符合父亲嘱托女儿照顾雅各的语境。
- source_word: ህየንቴየ
  choice: 接替我
  rationale: 字面义为“代替我／在我的位置上”；译作“接替我”自然地表达雅各将在地上承接其位置，且不额外限定具体职分。
- source_word: ለበረከት
  choice: 成为福
  rationale: 保留“为着祝福／成为祝福”的表达，使雅各既可理解为蒙福者，也可理解为给人带来福分者。
- source_word: ውሉደ፡ ሰብእ
  choice: 世人
  rationale: 字面为“人的众子”；现代汉语以“世人”自然传达全体人类中的人们。
- source_word: ዘርኡ ሴም
  choice: 闪的一切后裔
  rationale: “种子／后裔”在谱系语境中指后代；“闪”采用通行圣经人名。
theological_decisions:
- issue: 雅各“在地上代替我”的具体含义
  choice: 译作“他将在地上接替我”
  alternative: “他将在地上居于我的位置”
  rationale: 原文没有说明所接替的是族长身份、属灵地位还是祝福承继权，因此不把其中任何一种解释写入正文。
- issue: “福”与“闪的一切后裔”的句法关系
  choice: 译作“在世人中间成为福，也为闪的一切后裔带来福分”
  alternative: 较字面的“为世人中间的福，并为闪的一切后裔”
  rationale: 原文后半句省略了可由上文补出的“福”；中文补出“带来福分”以保持句意完整，同时不加入“荣耀”等原文没有的概念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看顾”“接替”“后裔”符合经卷语体但不过度古雅；保留开头承接上文的比较片段“胜过以扫”。
