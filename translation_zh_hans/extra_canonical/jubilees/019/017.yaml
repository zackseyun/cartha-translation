revisions:
- from: 胜过以扫。他对她说：“我的女儿，要看顾我的儿子雅各，因为他将在地上接替我，在世人中间成为福，也为闪的一切后裔带来福分。”[a]
  to: 胜过以扫。他对她说：“我的女儿，要守护我的儿子雅各，因为他要在地上代替我，成为世人中间的福，也成为闪所有后裔的福。”[a]
  rationale: 修订仅收紧两个表达：以“守护”准确表达托付保护的命令，并以平行的“成为……的福”呈现原文省略的祝福结构，避免加入“带来”的施予动作。保留开头的承接片段、未说明具体职分的“代替我”，以及关于“荣耀”并非所给吉兹文本词汇的脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:01:41Z'
