  text: my sons. Forever let him be blessed, and let his seed be that which fills the whole earth.
translation:
  language: zh_hans
  text: 我的众子。[a] 愿他永远蒙福，愿他的后裔遍满全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头“我的众子”承接上文；所据吉兹文在本节末另有一个未完成的“若/如果”，应属下一句，故未列入正文。
    reason: 说明现存分节造成的句首承接与句末跨界，避免读者误以为正文是完整独立句，同时不把下一句的起首词并入本节。
lexical_decisions:
- source_word: ውሉድየ
  choice: 我的众子
  rationale: 直译为“我的儿子们”；用“众子”简洁保留复数及亲属称谓。
- source_word: እስከ ለዓለም
  choice: 永远
  rationale: 这是表示持续至永世的固定表达，译为“永远”自然且准确。
- source_word: ይትባረክ
  choice: 愿他……蒙福
  rationale: 保留源文祈愿式的语气及第三人称单数指向，不把它改写成陈述。
- source_word: ዘርኡ
  choice: 他的后裔
  rationale: 该词本义为“种子”，在人物谱系语境中是集合性的“后裔”。
- source_word: ይከውን ዘይመልእ ኵላ ምድረ
  choice: 愿……遍满全地
  rationale: 源文较直译为“愿其成为那充满全地的”；汉语以“遍满全地”自然表达同一结果，并保留祈愿语气。
theological_decisions:
- issue: “他的后裔”是集合概念还是单一个体
  choice: 采用集合性的“后裔”，不限定为某一位后裔
  alternative: 译作“他的那一位后裔”或“他的子孙们”
  rationale: 源文单数“种子/后裔”可作集合名词，且本句没有充分依据将其专指某一个体；因此保留其潜在张力而不作教义化限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我的众子”保留古代族长对众子的称呼；后两分句用对称的“愿……”呈现祝福语气。
