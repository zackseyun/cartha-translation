  register: 采用庄重而通顺的现代标准汉语。“又”承接上下文；分号清楚区分婚娶陈述与基土拉的身份说明。原文末语在字面结构上较紧缩，本译文依英语审校层所反映的理解，表达为她出自亚伯拉罕家中仆人的女儿群体。
