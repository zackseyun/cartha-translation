  text: And Abraham took for himself a third wife, and her name was Keturah, from among the daughters of the servants of his household.
translation:
  language: zh_hans
  text: 亚伯拉罕又为自己娶了第三位妻子，名叫基土拉；她是他家中仆人的女儿之一。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: 为自己娶了……妻子
  rationale: 按闪语背景下“取女子归自己”的婚娶用法自然表达，同时保留“为自己”的反身意味。
- source_word: ሣልስተ
  choice: 第三位
  rationale: 直译序数词，明确基土拉在叙事中被称为亚伯拉罕的第三位妻子。
- source_word: ኬጡራ
  choice: 基土拉
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: እምነ፡ አዋልደ፡ ልደ፡ ቤቱ
  choice: 她是他家中仆人的女儿之一
  rationale: 将“从……女儿中”自然转述为所属关系；“家中仆人”对应其家宅所属的仆役群体，不将其简化为泛指家人。
theological_decisions: []
