lexical_decisions:
- source_word: ብርሃናት
  choice: 众光
  rationale: 该词为“光”的复数；在此语境中指穹苍之上的诸光体，但译作“众光”可保留原文措辞，不将其具体化为星辰。
- source_word: ምጽናዓት
  choice: 穹苍
  rationale: 对应天空的坚固穹顶，与创世叙事中的传统宇宙图景相合；“穹苍”兼具庄重感和经文语域。
- source_word: ጸውዖ
  choice: 把……叫来
  rationale: 表达召唤某人来到面前的动作，比单纯“称呼”更符合上下文。
- source_word: በቅድመ፡ አዕይንቲሃ
  choice: 当着……的面
  rationale: 原义为“在她眼前”，现代汉语以“当着她的面”自然传达亲眼在场之意。
