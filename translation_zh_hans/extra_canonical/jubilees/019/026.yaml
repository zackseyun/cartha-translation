  source_fidelity: 首句“穹苍之上的众光”忠实对应“在穹苍之上的光（复数）”。但第二分句的施事代词误译：原文动词及英语审校记录均为“他叫雅各”，而非“她”。“他的母亲利百加”也须保留属主关系。
