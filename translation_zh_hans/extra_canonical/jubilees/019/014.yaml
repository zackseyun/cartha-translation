  text: and hairy. And Jacob dwelt in tents. And the youths grew, and Jacob learned writing, but Esau did not learn, because he was a man of the field and a hunter, and he learned warfare.
translation:
  language: zh_hans
  text: 而且多毛。雅各住在帐棚里。两个少年渐渐长大；雅各学习文字[a]，以扫却没有学习这些，因为他是田野之人，又是猎人；并学习争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “文字”也可译作“书写”或“书本方面的学问”。
    reason: 原词的语义范围包括书写、书卷及相关学习，具体所指存在歧义。
lexical_decisions:
- source_word: ጸጕር
  choice: 浑身多毛
  rationale: 承接上文对以扫外貌的描写；原词意为“有毛的、多毛的”。
- source_word: ምጽላላት
  choice: 帐棚
  rationale: 采用自然且符合古代游牧生活背景的表达，并保留复数所表示的生活范围。
- source_word: ወሬዛ
  choice: 两个少年
  rationale: 该词指年轻人；语境中的主语是雅各和以扫，因此明确为“两个少年”，避免现代汉语中复数关系不清。
- source_word: መጽሐፈ
  choice: 文字
  rationale: 该词与书写、书卷或文字学习有关；正文用“学习文字”自然表达雅各接受文字教育，同时以脚注保留语义范围。
- source_word: ብእሲ፡ ሐቃላዊ
  choice: 田野之人
  rationale: 贴近原文构词和创世记相关叙述的传统意象，不扩展为特定职业。
- source_word: ነዓዊ
  choice: 猎人
  rationale: 直接表达以狩猎为特征的人。
- source_word: ፀብአ
  choice: 争战
  rationale: 原词涉及战争、战斗；“学习争战”既保留动作性，也适合庄重的古代叙事语体。
theological_decisions:
- issue: 雅各所学内容的性质
  choice: 正文译作“文字”，并注明也可理解为书写或书本方面的学问
  alternative: 书写；书本；经书
  rationale: 原文不足以证明特指某类宗教经典，因此不将其解释为经书或神学教育。
- issue: 以扫作为“田野之人”的含义
  choice: 保留“田野之人”这一开放表达
  alternative: 农夫；野外生活的人；粗野的人
  rationale: 原文强调他与田野的关联，但不能据此断定他是农夫，也不应加入贬义人格判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又浑身多毛”保留本节从上一句延续而来的残句性质；“帐棚”“田野之人”“争战”维持古代叙事色彩，又避免生僻文言。
