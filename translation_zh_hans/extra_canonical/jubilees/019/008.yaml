  text: 又一年。这就是撒拉一生的年日。这是亚伯拉罕所受的第十次考验，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ሕይወታ፡ ለሳራ
  choice: 撒拉一生的年日
  rationale: 直译为“撒拉生命的日子”，采用现代汉语圣经文体中自然且庄重的表达，并保留原文总结寿数的措辞。
- source_word: ዝመከራ፡ ዓሥር
  choice: 第十次考验
  rationale: መከራ在此指经历试炼或考验；“考验”通俗自然，又不预先断定其施行者。
- source_word: በዘተመከረ
  choice: 亚伯拉罕所受的
  rationale: 该被动结构表达亚伯拉罕经受考验；按英语校勘层所反映的语境补明主语，使汉语句意完整，同时不补出考验的施行者。
theological_decisions:
- issue: 考验的施行者
  choice: 不明说是谁考验亚伯拉罕
  alternative: 译作“上帝给亚伯拉罕的第十次考验”
  rationale: 本节所给原文使用被动表达，没有在此明确指出施行者；译文保留这种含蓄，避免加入原文未明说的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“又一年”承接上文，因此保留片段式开头；末尾逗号反映本节句意在后文继续。
