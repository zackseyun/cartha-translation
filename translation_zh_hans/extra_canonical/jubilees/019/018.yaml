- from: 因为我知道，耶和华必为自己拣选他作为子民。
  to: 因为我知道，主必拣选他作自己的子民。
  rationale: 仅作两项安全修订：以“主”对应原文神圣称号，避免无依据地指定神名；以“作自己的子民”使反身归属和汉语表达更清楚。单数“他”及其与群体性“子民”的张力均予保留。
  reviewer_model: gpt-5.6-terra
