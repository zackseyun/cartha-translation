  language: zh_hans
  text: 因为我知道，主必拣选他作自己的子民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእምር
  choice: 我知道
  rationale: 按吉兹语第一人称动词直译，表达说话者确定的认知。
- source_word: ያኀሪ
  choice: 必……拣选
  rationale: “拣选”准确传达选择、选定之意；“必”体现此处未完成式在预告语境中的将来指向。
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 采用现代中文圣经语体中对神圣名号的通行译法，并与咨询层的 LORD 对应。
- source_word: ሎቱ
  choice: 为自己
  rationale: 保留反身受益关系，即耶和华为自己而拣选。
- source_word: ለሕዝብ
  choice: 作为子民
  rationale: “子民”自然表达与神归属关系中的群体含义，同时保留单数对象“他”与群体身份之间的张力。
theological_decisions:
- issue: 单数的“他”与群体性的“子民”并置
  choice: 保留“拣选他作为子民”的并置表达
  alternative: 译作“拣选他的后裔作自己的子民”或“使他成为一个民族”
  rationale: 原文明确以单数代词“他”为宾语，却以“民／民族”说明其身份；不补入“后裔”，也不将其限定为民族形成，以免消解原文的代表性和群体性张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为”保留原文与上文的因果衔接；语序略作汉语化处理，但不增补原文未明说的“后裔”等内容。
