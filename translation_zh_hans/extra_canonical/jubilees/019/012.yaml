  text: 'for Hagar had died before Sarah. And she bore him six sons: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah, in two weeks of years.'
translation:
  language: zh_hans
  text: 因为夏甲在撒拉之前去世了；她在两个七年期中为他生了六个儿子：心兰、约珊、米但、米甸、伊施巴和书亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምቅድመ
  choice: 比……先
  rationale: 在死亡语境中自然表达时间上的先后，保留原文“在撒拉之前”的含义。
- source_word: ውሉደ፡ ስድስተ
  choice: 六个儿子
  rationale: “子女/儿女”在此由随后六个男性人名限定，译作“儿子”最清楚。
- source_word: በክልኤ፡ ሱባዔ፡ ዓመት
  choice: 在两个七年期内
  rationale: 直译为“在两个七年（组）中”，即十四年；保留《禧年书》以七年为周期的纪年表达。
