  yaml_path: translation/extra_canonical/jubilees/019/027.yaml
  text: and he kissed him and blessed him and said, “Jacob, my beloved son, whom my soul loves, may God from above the firmament bless you and give you all the blessings with which he blessed Adam and Enoch and Noah and Shem; and whatever he has spoken to me and whatever he said he would give me, may it rest upon you and upon your seed forever, according to the days of heaven above the earth. And may the spirits of Mastema not come upon you or upon your seed, to turn you away from following the LORD, who is your God from now and forever. And may the Lord God be a father to you, and you be his firstborn son, and to the people always. Go, my son, in peace.” And the two of them went out together from Abraham. And Rebekah loved Jacob with all her heart and with all her soul, much more than Esau, but Isaac loved Esau much more than Jacob.
translation:
  language: zh_hans
  text: '他亲吻了雅各，并祝福他，说：“雅各，我亲爱的儿子，我的心所爱的人，愿穹苍之上的上帝[b]赐福给你，把他赐给亚当、以诺、挪亚和闪[a]的一切福分都赐给你。他对我说过的一切，以及他说要赐给我的一切，愿这一切都临到你和你的后裔，直到永远，只要天仍在地之上。愿玛斯提玛的诸灵不临到你和你的后裔，免得它们使你偏离，不再跟随耶和华[d]——他是你的上帝，从今直到永远。愿主上帝[c]作你的父；你要作他的长子，永远在万民中如此[e]。我的儿子，平安地去吧。”


    于是，他们二人一同离开亚伯拉罕那里。利百加全心全意地爱雅各，远胜过以扫；以撒却爱以扫，远胜过雅各。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另可断句为：“赐给亚当、以诺和挪亚的一切福分；以及……”即不包括“闪”。
    reason: 相关名称及后续连词的文本划分存在异读传统。
  - marker: b
    text: 也可理解为“至高的上帝”；原文直译为“从穹苍之上的上帝”。
    reason: 保留具体宇宙图景，同时说明惯用的概括译法。
  - marker: c
    text: 或译：“愿耶和华作你的父。”
    reason: 说明较简约的传统译法；正文则保留原文中的“上帝”。
  - marker: d
    text: 或译：“使你离开耶和华。”原文含有从耶和华身后离开的意思。
    reason: 说明源语空间性表达可采取的另一种译法。
  - marker: e
    text: 原文在“你作他的长子”后接“向／对众民，直到永远”，谓语关系有所省略，句法不甚明确。
    reason: 避免把含混的短语擅自补足为特定的父子关系、统治关系或其他教义性解释。
lexical_decisions:
- source_word: አምላክ፡ እመልዕልተ፡ ምጽናዓት
  choice: 穹苍之上的上帝
  rationale: 按词面保留《禧年书》特有的宇宙图景；不直接化约为“至高的上帝”
- source_word: መናፍስተ፡ መስቴማ
  choice: 玛斯提玛的诸灵
  rationale: መናፍስት为复数“诸灵”，Mastema作为专名音译
- source_word: እምድኅረ፡ እግዚአብሔር
  choice: 偏离，不再跟随耶和华
  rationale: 保留“从耶和华身后离开”的空间性及跟随含义，而不只笼统译作“离开”
- source_word: እግዚአብሔር፡ አምላከ
  choice: 主上帝
  rationale: 源文同时包含“主”和“上帝”，两者均予保留
- source_word: በከመ፡ መዋዕለ፡ ሰማይ፡ ዲበ፡ ምድር
  choice: 只要天仍在地之上
  rationale: 用自然汉语表达“照着天在地之上的日子”所指的恒久期限，同时保留天地意象
theological_decisions:
- issue: 上帝的宇宙性称号
  choice: 穹苍之上的上帝
  alternative: 至高的上帝
  rationale: 源文明确提到“穹苍之上”；正文保留该具体表达，脚注列出较概括的理解
- issue: 主与雅各的父子关系
  choice: 愿主上帝作你的父，你作他的长子
  alternative: 愿耶和华作你的父
  rationale: 保留源文“主上帝”以及父与长子的对应关系，不加入后来的宗派性解释
- issue: “也永远归于这百姓”的句法
  choice: 保留为与前句并列但语义略显悬置的表达
  alternative: 补足为“并永远作这百姓的父”
  rationale: 源文在“归于／对这百姓”处句法含混；不擅自补出未明说的谓语或身份
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。祝福部分保留反复出现的“愿”，以呈现礼仪性节奏；专名按常见圣经汉译处理，Mastema译作“玛斯提玛”。对末段“也永远归于这百姓”的源文句法含混不作教义化补足。
