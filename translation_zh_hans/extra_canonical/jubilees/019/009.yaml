revisions:
- from: 在这件事上，亚伯拉罕显为忠信，心里忍耐。他没有为那地的应许说一句话；耶和华曾说，要把那地赐给他和他以后的后裔。然而，他只求在那里得一处地方，好埋葬自己的死人，因为他显为忠信；他也在天上的版册上被记为耶和华的朋友。
  to: 在这件事上，亚伯拉罕被认定为忠信，灵里忍耐。他没有为那地的应许说一句话；耶和华曾说，要把那地赐给他和他以后的后裔。然而，他在那里求得一处地方，好安葬死者，因为他被认定为忠信；他也在天上的版册上被记为耶和华的朋友。
  rationale: 删去未经原文支持的“只”，并将不自然的“自己的死人”改为“死者”，以保留原文的概括性。将“心里忍耐”调整为“灵里忍耐”，更贴近原文措辞；其余关键术语与重复强调均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:01:35Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了开头“在这件事上”、亚伯拉罕的忠信与忍耐、对土地应许保持缄默、请求墓地、再次被认定为忠信，以及天上版册中的记录。惟“只求”加入了原文和英文审校链均未明示的限制性语气；“自己的死人”虽可逐字对应，但在现代汉语中不自然且易生歧义。
  naturalness: 整体庄重通顺，适合经文语体。“心里忍耐”可理解，但“灵里忍耐”较贴近原文的“忍耐的灵/心志”；“自己的死人”不属现代标准汉语的自然表达，宜改为“死者”。
  terminology: “忠信”“那地的应许”“后裔”“天上的版册”“耶和华的朋友”均恰当，并保留了本书特有的天上记录意象。“显为忠信”可保留，但“被认定为忠信”更自然明确地表达“被发现/被认定”为忠信。
  issues:
  - severity: medium
    issue: “只求”无来源依据。
    rationale: 原文和英文审校文本说亚伯拉罕“请求/求”一处埋葬之地；“只”额外加上排他或限缩意味，宜删除。
  - severity: medium
    issue: “埋葬自己的死人”不符合自然现代汉语。
    rationale: 这是对“bury his dead”的生硬逐字处理。此处指他的死者（语境中为撒拉），译作“安葬死者”既自然，也不把单数或具体身份强加给文本。
  - severity: low
    issue: “心里忍耐”对“忍耐的灵/心志”的表达略弱。
    rationale: “灵里忍耐”更直接保留原文的“灵/心志”成分，且在庄重经文汉语中自然。
  revised_text: 在这件事上，亚伯拉罕被认定为忠信，灵里忍耐。他没有为那地的应许说一句话；耶和华曾说，要把那地赐给他和他以后的后裔。然而，他在那里求得一处地方，好安葬死者，因为他被认定为忠信；他也在天上的版册上被记为耶和华的朋友。
