base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/009.yaml
  text: In this, Abraham was found faithful, patient in spirit. And he did not speak a word concerning the promise of the land, which the LORD had said he would give to him and to his seed after him, yet he asked there for a place to bury his dead, because he was found faithful, and he was recorded as a friend of the LORD on the heavenly tablets.
translation:
  language: zh_hans
  text: 在这件事上，亚伯拉罕被认定为忠信，灵里忍耐。他没有为那地的应许说一句话；耶和华曾说，要把那地赐给他和他以后的后裔。然而，他在那里求得一处地方，好安葬死者，因为他被认定为忠信；他也在天上的版册上被记为耶和华的朋友。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦቱ
  choice: 在这件事上
  rationale: 保留指向上文考验的关联语义，比单纯译作“在那里”更符合本句开头的承接作用。
- source_word: ምእመነ
  choice: 忠信
  rationale: 兼顾“忠诚、可信、信实”的语义，不将其限缩为单指主观相信。
- source_word: ዕጉሠ፡ መንፈስ
  choice: 心里忍耐
  rationale: 按“灵里/心中有耐心”理解，以现代汉语自然表达其内在坚忍。
- source_word: ንባብ፡ ዘበምድር
  choice: 那地的应许
  rationale: 结合后接“耶和华曾说要赐给他”的内容，表达关于土地的神圣宣告；“应许”在语境中自然，但未额外扩展内容。
- source_word: ዘርኡ
  choice: 后裔
  rationale: 准确表达集体性的子孙、种裔含义，符合庄重经文语体。
- source_word: መካነ፡ አስተብቍዐ
  choice: 求……得一处地方
  rationale: 体现亚伯拉罕请求取得埋葬之地，而非暗示已无偿获得。
- source_word: ዐርከ
  choice: 朋友
  rationale: 直译其关系称谓，并保留“耶和华的朋友”这一神学表达。
theological_decisions:
- issue: “忠信”出现两次
  choice: 两处均保留
  alternative: 第二处省略以避免重复
  rationale: 原文重复说明亚伯拉罕被认定为忠信，可能具有论证和强调作用，不宜因汉语修辞而删去。
- issue: 土地之言的性质
  choice: 译作“那地的应许”
  alternative: 译作“关于那地的话”或“那地的宣告”
  rationale: 下文明确是耶和华说要赐地，语境支持“应许”；同时不增加具体立约术语。
- issue: 被记为耶和华的朋友
  choice: 以亚伯拉罕为被动句主语
  alternative: 译作“有话记下，说他是耶和华的朋友”
  rationale: 原文动词为阳性单数被动形式，最自然地指亚伯拉罕被记录为朋友。
- issue: 天上版册
  choice: 保留超自然书册意象
  alternative: 泛化为“天上的记录”
  rationale: 该意象是《禧年书》的重要神学文学元素，应明确保存，不作去神话化处理。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“自己的死人”略带古朴色彩，却准确保留亲属死者的表达；“天上的版册”保留原作书写与记录的具体意象。未设置脚注，因为正文可直接表达原文，且无必须并列保存的重大歧义。
