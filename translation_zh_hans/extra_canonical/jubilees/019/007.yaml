revisions:
- from: 他又向他们下拜，随后把他的死者葬在麦比拉洞里。[a] 撒拉一生的年日共一百二十七年，就是两个禧年又四个七年期。
  to: 他又向他们下拜，随后安葬了他的死者在双洞里。撒拉一生的年日共一百二十七年：两个禧年又四个七年期。[a]
  rationale: 修订将“麦比拉洞”改为直接对应原文的“双洞”，并以冒号和脚注保留原文中127年与禧年计数之间未解决的数值张力。其余叙事内容保留“再次下拜”、安葬“他的死者”及禧年／七年期等关键语义。
  reviewer_model: gpt-5.6-terra
