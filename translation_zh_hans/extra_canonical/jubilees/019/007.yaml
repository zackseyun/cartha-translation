  yaml_path: translation/extra_canonical/jubilees/019/007.yaml
  text: 'And he bowed down to them again, and after this he buried his dead in the double cave. And all the days of Sarah’s life were one hundred and twenty-seven years: two jubilees and four weeks of years.'
translation:
  language: zh_hans
  text: 他又向他们下拜，随后安葬了他的死者在双洞里。撒拉一生的年日共一百二十七年：两个禧年又四个七年期。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按《禧年书》通常以四十九年为一个禧年计算，两个禧年和四个七年期合为一百二十六年；原文在此仍记撒拉享年一百二十七年。
    reason: 如实说明原文并列的两种计数之间的数值差异，不擅自调和。
lexical_decisions:
- source_word: ካዕበ
  choice: 又
  rationale: 明确保留“再次、第二次”的含义，呼应这里是亚伯拉罕再次向当地人下拜。
- source_word: ቤድኖ
  choice: 他的死者
  rationale: 按原文的所有格表达直译，指已死的撒拉；不直接改成“撒拉”，以保留原文措辞。
- source_word: ባዓት፡ ዘካዕበት
  choice: 麦比拉洞
  rationale: 该短语在创世记传统中对应专名“麦比拉洞”；同时以脚注说明其可按普通词义理解为“双洞”。
- source_word: ኢዮቤልዉ
  choice: 禧年
  rationale: 指《禧年书》使用的四十九年周期，采用通行且庄重的术语。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 此处不是普通的一周，而是由七年构成的周期；译为“七年期”可避免现代读者误解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“年日”保留经文式表达但仍易懂；历法总结用“两个禧年又四个七年期”，准确对应127年（2×49＋4×7）。
