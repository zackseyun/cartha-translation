  text: And in the first year of the third week of this jubilee[2], the days of Sarah’s life were completed, and she died in Hebron.
translation:
  language: zh_hans
  text: 在这个禧年的第三个七年期的第一年，撒拉一生的年日尽了；她死在希伯仑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在《禧年书》的纪年体系中指由七年构成的周期；译作“七年期”既清楚又保留其历法含义。
- source_word: ዝእዮቤልው
  choice: 这个禧年
  rationale: 按上下文指当前的禧年周期；使用“这个禧年”自然且准确。
- source_word: ተፈጸመ፡ መዋዕለ፡ ሕይወታ፡ ሳራ
  choice: 撒拉一生的日子满了
  rationale: 贴近原文“撒拉生命的日子完成了”的表达，也保留庄重的圣经语体。
- source_word: ኬብሮን
  choice: 希伯仑
  rationale: 这是地名 Hebron 的通行中文译名。
