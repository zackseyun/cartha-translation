  yaml_path: translation/extra_canonical/jubilees/019/013.yaml
  text: And in the sixth week, in its second year, Rebekah bore to Isaac two sons, Jacob and Esau. And Jacob was smooth and upright, but Esau was a fierce man, and a man of the field,
translation:
  language: zh_hans
  text: 在第六个七年期的第二年，利百加给以撒生了两个儿子，就是雅各和以扫。雅各皮肤光滑，为人正直；以扫却是个凶悍的人[a]，是田野之人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凶悍”也可译作“严厉”或“粗野”；原文不是“多毛”。
    reason: 说明ድሩክ的语义范围，并避免以《创世记》平行叙事中的“多毛”描述替代本节吉兹语原文。
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 此处指《禧年书》的七年周期，而非普通的一周；译作“七年期”可让现代读者直接明白年代结构。
- source_word: ልሙጽ
  choice: 皮肤光滑
  rationale: 该词基本义为“光滑”；结合雅各与以扫的身体特征对比，补出“皮肤”使汉语自然，同时不混同于下一项品格描述。
- source_word: ሬትዕ
  choice: 为人正直
  rationale: 表达“正直、公正”的品格含义，采用自然庄重的现代汉语。
- source_word: ድሩክ
  choice: 凶悍
  rationale: 该词可表示强悍、严厉或粗野；“凶悍”保留人物气质上的强硬感，也避免受《创世记》平行叙事影响而误译为“多毛”。
- source_word: ሐቃላዊ
  choice: 常在田野活动
  rationale: 字面为“田野之人”；动态表达其以田野为生活活动范围，符合现代汉语习惯。
theological_decisions:
- issue: 雅各的品格描写
  choice: 为人正直
  alternative: 为人完全／纯全
  rationale: 源词在此更直接表示正直或公正；不将其扩大为带有更强神学含义的“完全”或“纯全”。
- issue: 以扫的特征
  choice: 凶悍的人
  alternative: 多毛的人
  rationale: 依据所给吉兹语词汇本身翻译，不以《创世记》25章或27章的措辞取代本节文本；同时用脚注保留“严厉、粗野”等词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“第六个七年期的第二年”明确本书纪年方式；“给以撒生了两个儿子”保留原文关系结构；末句用分号呈现雅各与以扫的鲜明对照。
