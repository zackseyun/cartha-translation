base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/024.yaml
  text: And he came to the land of Ephrath, and he stayed there. And Rachel gave birth in the night to a son, and she called his name Son of My Sorrow, because she suffered while giving birth; but his father called his name Benjamin, on the eleventh of the eighth month, in the first year of the sixth week of this jubilee.
translation:
  language: zh_hans
  text: 他来到以法他的地，住在那里。拉结在夜里生了一个儿子，给他起名叫“我痛苦之子”[a]，因为她生产时受了极大的痛苦；但孩子的父亲给他起名叫便雅悯[b]，是在这个禧年的第六个七年期第一年八月十一日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我痛苦之子”是名字的字面意义；参创世记35:18的“便俄尼”。
    reason: 正文保留源文的语义型命名，脚注说明其与《创世记》人名传统的关系。
  - marker: b
    text: “便雅悯”通常理解为“右手之子”；也有人理解为“南方之子”。
    reason: 该名字的词源解释存在真实歧义，脚注并列主要理解而不强行裁定。
lexical_decisions:
- source_word: ምድረ ከብራታን
  choice: 以法他的地
  rationale: 该处在传本文本及英语审校层中对应地名 Ephrath；用《圣经》中文传统译名“以法他”，并保留“地”的表达。
- source_word: ወልደ ሕማምየ
  choice: 我痛苦之子
  rationale: 按构词直译为“我的痛苦之子”，既保留拉结命名的语义，也不直接以另一希伯来名称替换。
- source_word: ብንያም
  choice: 便雅悯
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 在《禧年书》的纪年体系中指由七年组成的周期；译成“七年期”比单独的“周”更清楚。
- source_word: ኢዮቤልው
  choice: 禧年
  rationale: 采用该书书名及其四十九年纪年周期的通行术语。
