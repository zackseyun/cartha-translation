base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/013.yaml
  text: Let us not give our daughter to a man who has a foreskin, for that is a reproach to us. And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.
translation:
  language: zh_hans
  text: 我们不可把女儿嫁给未受割礼的男子，因为这对我们是羞辱。这对以色列也是羞辱，临到那些把女儿嫁出去的人，也临到那些娶外族女子的人，因为这是不洁的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲ፡ ዘቦ፡ ቍልፈተ
  choice: 未受割礼的人
  rationale: 字面指“有包皮的男人”；按现代汉语和本句婚姻语境译为“未受割礼的人”，既准确又自然。
- source_word: ጽእለት
  choice: 羞辱
  rationale: 此词在上下文中表示群体所承受的耻辱或羞耻；“羞辱”保留其强烈的贬抑含义。
- source_word: እምአዋልደ፡ አሕዛብ
  choice: 外族女子
  rationale: 字面为“列族的女儿”；“外族女子”符合现代汉语，并保留以色列与列族之间的群体区分。
- source_word: ርኩስ
  choice: 不洁
  rationale: 该词可指礼仪或道德意义上的污秽；译作“不洁”保留这种语义张力，不限定为单一范畴。
theological_decisions:
- issue: “给”与“娶”所指的婚姻双方
  choice: 译为“把女儿嫁出去的人”和“娶外族女子的人”
  alternative: 直译为“给予的人和从外族女儿中取的人”
  rationale: 根据婚姻语境明确双方动作，使现代读者易懂；不把经文扩展为超出原文的普遍族群教义。
- issue: 不洁的性质
  choice: 保留概括性的“这是不洁的”
  alternative: 具体化为“这是礼仪上不洁的”或“这是道德污秽”
  rationale: 原文未明确限定不洁属于礼仪还是道德范畴，因此保留歧义。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“未受割礼”比字面的“有包皮”更自然；“嫁出去／娶”显明原文婚姻交换语境，同时末句保留“不洁”的开放含义。
