  yaml_path: translation/extra_canonical/jubilees/032/007.yaml
  text: 'Therefore thus it is ordained in Israel concerning the defilement of an Israelite virgin: and if there is a man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed disgrace in Israel; and the woman'
translation:
  language: zh_hans
  text: 因此，在以色列中，关于以色列处女所受的玷污，定例如下：[a]以色列中若有人想把自己的女儿，甚至自己的姐妹，交给任何一个出自外族后裔的男子，他必须被处死；人要用石头打死他，因为他在以色列中做了可耻的事。至于那女子，也……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于一个受了玷污的以色列处女。”
    reason: 原文短语可理解为名词性的“以色列处女的玷污”，也可转译为描述该处女已经受玷污的关系结构。
  - marker: b
    text: 现有原文在本节止于“那女子也”，句子尚未完整。
    reason: 提示读者此处的残句来自所提供文本的节界或文本状态，而非译文遗漏。
lexical_decisions:
- source_word: በአርኵሰ፡ ድንግል፡ እስራኤላዊት
  choice: 关于以色列处女受玷污的事
  rationale: 保留“玷污”“处女”“以色列的”三个语义要素，同时用自然的现代汉语表达该介词短语；不把“玷污”具体解释为某一种行为。
- source_word: የሀብ
  choice: 交给
  rationale: 原词意为“给、交付”；上下文可能指嫁给，但正文采用较宽泛的“交给”，避免把未明说的婚姻关系写死。
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: 任何一个外族后裔
  rationale: 对应“出自列国／外族之种的人”；“外族后裔”在现代汉语中较自然，也保留族属含义。
- source_word: ሞተ፡ ለይሙት
  choice: 必须被处死
  rationale: 该同源词叠用构成强调性的死刑表述；译为“必须被处死”体现法律语境和强调。
- source_word: ኀፍረተ
  choice: 可耻的事
  rationale: 该词可表示羞耻、耻辱或丑事；此处译法保留道德与群体性的羞辱意味，而不额外限定罪名。
theological_decisions:
- issue: “玷污”所指行为的性质
  choice: 保留为“受玷污”
  alternative: 明确译作性侵犯、失贞或与外族通婚
  rationale: 原文在本句中未将该词的具体性质完全展开；保留概括表达可避免以特定神学或法律解释取代文本。
- issue: 把女儿或姐妹“给”外族后裔的关系
  choice: 译作“交给”
  alternative: 译作“嫁给”
  rationale: 婚配很可能是语境所指，但原文动词本身只是“给”；正文保留其语义宽度。
- issue: 经文末尾的不完整句
  choice: 保留“至于那女子，也……”并加注
  alternative: 根据后续内容补全刑罚
  rationale: 所提供的吉兹语本节证据止于“那女子也”，不可在本节正文中擅自补入未提供的词句。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留法律条文式语气。“定例如下”“必须被处死”“用石头打死”体现原文的规范性和刑罚强度；避免使用生僻文言词。
