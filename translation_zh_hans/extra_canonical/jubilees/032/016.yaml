base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/016.yaml
  text: The LORD will put it in their mouths, that they may bless all the seed of the beloved. Your mother called you Levi, and in truth she called you so that you would be joined to God and be a companion to all the sons of Jacob. Let his table be yours, and you and your sons shall eat, and for all.
translation:
  language: zh_hans
  text: 上帝必把这话放在他们口中，使他们祝福蒙爱者的一切后裔。你母亲给你起名叫利未；她这样称呼你，实在是要你与主联合，并作雅各众子的同伴。愿他的席归你；你和你的儿子都要吃这席上的食物，并且为众人……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所存文本在“并且为众人”之后中断，句意未完。
    reason: 说明源文本的残缺，防止读者将省略号误解为修辞停顿。
lexical_decisions:
- source_word: አብሔር
  choice: 上帝
  rationale: 此处是通常表示“上帝”的称谓；与后文较完整的神名“እግዚአብሔር”有所区别。
- source_word: ይትወሀብ፡ ውስተ፡ አፉሆሙ
  choice: 必把这话放在他们口中
  rationale: 按字面意象表达“赐在他们口中”；补出“这话”，使现代汉语自然，同时不具体限定话语内容。
- source_word: ኵሎ፡ ዘርአ፡ ለፍቅር
  choice: 蒙爱者的一切后裔
  rationale: 保留单数“蒙爱者”及其后裔的表达，不擅自确定所指人物。
- source_word: እምከ፡ ከመከ፡ ሌዊሃ
  choice: 你母亲给你起名叫利未
  rationale: እምከ意为“你母亲”；上下文涉及利未得名，不采用“从他们中间”这一误读。
- source_word: አጸቁ
  choice: 联合
  rationale: 体现利未之名与“联合、连结”之间的词源性呼应。
- source_word: ወሱታፌ
  choice: 并作……的同伴
  rationale: 明确保留原文“同伴、伙伴”的独立概念。
- source_word: ማእዳ፡ ለከ፡ ትኩን
  choice: 愿他的席归你
  rationale: 贴近“愿他的桌席成为你的”这一结构，不与后面的吃席混为一谈。
theological_decisions:
- issue: 首句与后文神称谓是否统一译作“主”
  choice: 首句译“上帝”，后文译“主”
  alternative: 两处都译“主”
  rationale: 原文分别使用አብሔር与እግዚአብሔር；译文保留这一措辞差异，避免无依据地统一。
- issue: “他的席”所指
  choice: 保留代词“他的”
  alternative: 明说“主的席”
  rationale: 虽然上文最可能指向主，但原文使用代词；保留代词可避免消除原有指代空间。
- issue: 末尾残缺短语
  choice: 译作“也要为众人……”
  alternative: 补成“也要供众人吃”或其他完整句意
  rationale: 所提供的原文在“并且为所有……”处中断；不以推测补足其礼仪或供养含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起名叫利未—联合”尽量保留原文的命名双关；末句维持残缺状态，不据上下文擅自补写。
