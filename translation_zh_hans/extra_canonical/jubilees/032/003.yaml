base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/003.yaml
  text: And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons starting from him, and Levi came up in the portion of the LORD, and his father clothed him.
translation:
  language: zh_hans
  text: 那些日子，拉结怀了便雅悯。雅各从便雅悯数起自己的儿子[a]，利未就归在耶和华的份内；他父亲给他穿上衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从他数起”；“他”指便雅悯。
    reason: 说明原文代词及计数起点，并交代正文为清晰起见明示其指代。
lexical_decisions:
- source_word: ፀንሰት
  choice: 怀了
  rationale: 准确表达“受孕、怀胎”，用现代汉语自然叙述。
- source_word: እምኔሁ
  choice: 从便雅悯数起
  rationale: 保留“从他开始”的计数起点；依近邻先行词将代词所指明示为便雅悯，使倒数众子而利未成为第十位的叙事逻辑在中文中清楚可见。
- source_word: በመክፈሊተ፡ እግዚአብሔር
  choice: 归入耶和华的份中
  rationale: 保留“份、分得之物”的献纳语义，不将其过度解释为某一后期制度术语。
- source_word: አልበሱ
  choice: 给他穿上衣服
  rationale: 直译“使他穿上、给他穿衣”；不擅自说明衣服的种类或礼仪性质。
theological_decisions:
- issue: 利未被选归耶和华的叙事依据
  choice: 保留雅各从便雅悯开始数儿子的细节
  alternative: 省略计数起点，只译“雅各数点自己的儿子”
  rationale: 原文的እምኔሁ提供计数起点，这一细节解释了利未如何落在耶和华的份中；省略会削弱经文自身的逻辑。
- issue: “耶和华的份”的性质
  choice: 不进一步释作“十分之一”或“祭司职分”
  alternative: 在正文中明确译成“归耶和华的十分之一”或“祭司的份”
  rationale: 上下文可能暗示十分取一及利未的圣职，但本节原文本身只说“耶和华的份”，应保留其表达范围。
- issue: 父亲所穿衣服的性质
  choice: 仅译“给他穿上衣服”
  alternative: 译作“给他穿上祭司袍”
  rationale: 原文没有明确衣服种类；不把可能的祭司象征直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“归入耶和华的份中”保留原文略带礼仪色彩的措辞；“从便雅悯数起”明示代词指向，以免中文读者误解，同时不补入原文未明说的倒数方式、十分之一制度或祭司服饰。
