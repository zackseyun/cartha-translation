base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/010.yaml
  text: Whoever defiles shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man be rooted out who has defiled his daughter in the midst of all Israel, because from his seed he has given to Molech and has acted wickedly by defiling it.
translation:
  language: zh_hans
  text: 凡行玷污之事的，必被处死，用石头打死。这条律法不受年日限制，也没有赦免或任何赎罪；除非那在全以色列中玷污自己女儿的人被剪除[a]，因为他把自己的后裔献给了摩洛，又因玷污它而行了恶事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除非他们剪除那在全以色列中玷污自己女儿的人。”
    reason: 原文动词形态宜理解为单数被动，但传统译法曾按不定主语的主动句处理，故列出异译。
  - marker: b
    text: “它”所指不明确；按上下文也可译作“她”，指他的女儿，但原文所用代词后缀为阳性单数。
    reason: 保留原文代词的语法形式及其指代歧义。
lexical_decisions:
- source_word: ዘያረኵስ
  choice: 凡行玷污之事的
  rationale: 保留“玷污”的核心含义，并以自然汉语表达名词化的关系结构，且不擅自补定其宾语。
- source_word: ሞተ፡ ለይሙት
  choice: 必被处死
  rationale: 体现原文加强式的死刑判语；现代汉语中比逐字译作“死而死”清楚庄重。
- source_word: ወበእብን፡ ይትወገር
  choice: 用石头打死
  rationale: 准确表达以石头执行死刑，避免生硬重复“用石头投掷”。
- source_word: አልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕለ
  choice: 这条律法不受年日限制
  rationale: 保留该规定没有时限、持续有效的意思，同时不把含义扩展为后世的专门法律术语。
- source_word: ይሤረው
  choice: 被剪除
  rationale: 按第三人称单数被动理解，并采用圣经法律语境中自然而明确的“剪除”。
- source_word: ሞሎክ
  choice: 摩洛
  rationale: 采用现代简体中文中常见的专名音译。
- source_word: በአርኵሶ
  choice: 因玷污它
  rationale: 保留原文阳性单数后缀所指对象的不确定性，不擅自改作指向女儿的阴性宾语。
theological_decisions:
- issue: 赦免、赎罪与剪除之间的关系
  choice: “也没有赦免或任何赎罪；除非……被剪除”
  alternative: “也没有赦免或任何赎罪，只有把……剪除”
  rationale: 用“除非”保留原文条件式张力，不解释剪除本身是否构成某种赎罪机制。
- issue: 末句代词的所指
  choice: 正文译作“它”，脚注说明也可按语境理解为“她”
  alternative: 直接译作“玷污她”
  rationale: 原文后缀为阳性单数，直接改成指女儿会消除原文在语法与语境之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律判语。“剪除”保留古代盟约与群体惩罚语境中的力度；其余句式尽量使用自然现代汉语。所有异文标记均已在正文中标出。
