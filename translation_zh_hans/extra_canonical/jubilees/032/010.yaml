  to: 凡行玷污之事的，必被处死，用石头打死。这条律法不受年日限制，也没有赦免或任何赎罪；除非那在全以色列中玷污自己女儿的人被剪除[a]，因为他把自己的后裔献给了摩洛，又因玷污它而行了恶事[b]。
