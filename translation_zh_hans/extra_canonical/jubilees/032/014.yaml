base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/014.yaml
  text: and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that they may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your children be for glory and greatness.
translation:
  language: zh_hans
  text: 你的儿女世世代代也必如此。愿主为了自己的荣耀，赐给你和你的后裔宽广的心；愿他从凡有血肉的众生中，使你和你的后裔亲近他，好叫他们[a]在他的圣所中供职，如同侍立在他面前的天使和众圣者。你儿女的后裔也必像他们一样，归于荣耀和尊大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词为第三人称复数，直译为“他们供职”；因上文同时提到“你和你的后裔”，也可理解为“你们供职”。
    reason: 保留原文动词人称与复合先行词之间可能产生的指代张力。
lexical_decisions:
- source_word: ዓለማት
  choice: 世世代代
  rationale: 此处表示绵延的各个世代；译作“世世代代”比直译“诸世界”更符合上下文和现代汉语。
- source_word: ዐበየ፡ ልበየ
  choice: 宽广的心
  rationale: 保留“心之广大”的意象，同时采用自然、庄重的汉语表达，不把它具体化为智慧、勇气等单一品格。
- source_word: ዘሥጋ
  choice: 凡有血肉的众生
  rationale: 按闪语式“所有肉身”表达受造且有血肉的群体，避免仅译作抽象的“肉体”。
- source_word: ይትአዘዙ
  choice: 供职
  rationale: 在圣所语境中表达服事、履行职分之意；不扩写为特定祭司礼仪。
- source_word: መላእክተ፡ ገጽ
  choice: 侍立在他面前的天使
  rationale: “面前的天使”是指在上帝临在中侍立者；补出“侍立”使现代中文清楚，同时保留“面前/临在”的核心意象。
- source_word: ለክብር፡ ወለዕበይ
  choice: 得享荣耀和尊大
  rationale: 分别对应“荣耀”与“伟大、尊大”，并以“得享”使结句在中文中完整自然。
theological_decisions:
- issue: 圣所中供职者的所指
  choice: 译为“好叫他们……供职”，以第三人称复数承接“你和你的后裔”，重心自然落在后裔群体上
  alternative: “好叫你们……供职”
  rationale: 原文动词为第三人称复数，因此正文保留“他们”；但前面的复合宾语含“你和你的后裔”，所指范围在语篇上仍可能被理解为二者，故以脚注说明。
- issue: “面前的天使”的称谓
  choice: 采用描述性译法“侍立在他面前的天使”
  alternative: 音译或术语化为某一固定天使等级
  rationale: 原文表达其与上帝临在的关系，并未要求建立具体的天使等级体系；描述性译法避免导入宗派化天使论。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。以“主”对应神圣称号；“宽广的心”“凡有血肉的众生”“圣所中供职”等表达尽量贴近原文意象，同时避免生硬直译。脚注标记[a]已置于相关代词之后。
