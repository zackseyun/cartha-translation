revisions:
- from: 凡为你祝福的，都蒙福；凡咒诅你的民族，都受咒诅。他又对犹大说：“愿主赐你力量和能力，使你践踏一切恨你的人。愿你作雅各众子的统治者，你和你儿子中的一人都作统治者。愿你和你众子的名声传遍全地各方[a]；那时，列国必在你面前惧怕。[b]
  to: 凡为你祝福的，必蒙福；凡咒诅你的，必受咒诅。他又对犹大说：“愿主赐你力量和能力，使你践踏一切恨你的人。愿你和你的一位儿子作雅各众子的统治者。愿你的名和你众子的名传遍全地各方[a]；那时，列国必在你面前惧怕。[b]
  rationale: 修订纠正了“民族”造成的施事者误读，恢复“你的名”和“你众子的名”的并列，并以更自然的汉语准确呈现犹大与其一位儿子共同治理雅各众子的意思。保留引语未闭合及相关脚注，因为讲话确实延续至下一节。
