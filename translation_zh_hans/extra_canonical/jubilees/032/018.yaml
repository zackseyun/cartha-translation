base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/018.yaml
  text: Blessed be everyone who blesses you, and all the people who curse you shall be cursed. And to Judah he said, "May the Lord give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go forth and be spoken of throughout all the earth and regions. Then nations will fear before your face.
translation:
  language: zh_hans
  text: 凡为你祝福的，必蒙福；凡咒诅你的，必受咒诅。他又对犹大说：“愿主赐你力量和能力，使你践踏一切恨你的人。愿你和你的一位儿子作雅各众子的统治者。愿你的名和你众子的名传遍全地各方[a]；那时，列国必在你面前惧怕。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各方”也可译作“各地区”或“各城邑”。
    reason: 原文አህጉር的地域含义较宽，可指地区，在某些用法中也可指城邑。
  - marker: b
    text: 本节的话在下一节继续。
    reason: 说明此处不加结束引号的篇章原因，避免读者误以为引号遗漏。
lexical_decisions:
- source_word: ቡሩክ
  choice: 都蒙福
  rationale: 原文以“蒙福的”起句，语法较为省略；结合紧接的咒诅对句及语境，译作祝福公式“凡为你祝福的，都蒙福”，同时不扩展其神学含义。
- source_word: ኃይለ፡ ወጽንዐ
  choice: 力量和能力
  rationale: 保留两个并列名词，而不将其合并为单一概念；“能力”表达ጽንዐ在此处的强健、坚固之力。
- source_word: ትኪዶሙ
  choice: 践踏
  rationale: 该动词表达踩踏、压服，直译“践踏”既保留征服意象，也符合庄重祝福语体。
- source_word: መኰንነ
  choice: 统治者
  rationale: 此词可指领袖、官长或统治者；上下文谈到治理雅各众子，故取较宽泛的“统治者”，避免具体化为某种官职或王号。
- source_word: ዘየሐውር፡ ወዘያንበቡ
  choice: 传遍
  rationale: 两个动词共同描写名字出去并广泛流传；汉语以“名声传遍”自然表达其合成意义，不机械重复近义动作。
- source_word: አህጉር
  choice: 各方
  rationale: 该词可指地区、区域，某些语境也可指城邑；“全地各方”在汉语中自然，并保留地域范围的宽泛性。
- source_word: እምቅድመ፡ ገጽከ
  choice: 在你面前
  rationale: 按原文保留“面前”的身体性表达，不弱化为单纯“怕你”。
theological_decisions:
- issue: 犹大及其后裔的统治应否解释为特定王朝或弥赛亚预言
  choice: 你和你儿子中的一人都作统治者
  alternative: 愿你和你的一个后裔作王
  rationale: 原文只说犹大与其众子中的“一人”作治理者，未明说“王”或指明特定人物；因此保留不确定性，不加入后来的王朝或弥赛亚解释。
- issue: 祝福与咒诅公式中施行者是否应明说为上帝
  choice: 都蒙福／都受咒诅
  alternative: 上帝必赐福／上帝必咒诅
  rationale: 原文采用被动或状态式祝福语言，没有显明施事者；译文保留这种神圣被动式的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。祝福公式保持对称；“践踏”“在你面前”保留原文意象。引语在本节末不闭合，因为讲话延续到下一节。
