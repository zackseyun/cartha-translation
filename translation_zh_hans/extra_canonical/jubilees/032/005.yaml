revisions:
- from: 离开基列地。雅各向拉班隐瞒了自己的心思，没有告诉他。第四个七年周期的第七年，正月二十一日，雅各转向基列；拉班随后追赶，在三月十三日于基列山追上了雅各。但主不容拉班伤害雅各，因为主夜间在梦中向他显现；拉班也把这事告诉了雅各。那月十五日，雅各为拉班和所有随他而来的人设宴。当天，雅各向拉班起誓，拉班也向雅各起誓，双方都不可在那山越界，怀着恶意到对方那里去，
  to: 离开基列地。雅各向拉班隐瞒了自己的心思，没有告诉他。第四个七年周期的第七年，正月二十一日，雅各转向基列；拉班随后追赶，在三月十三日于基列山追上了雅各。但主不容拉班伤害雅各，因为主夜间在梦中向拉班显现；拉班也告诉了雅各。在那些日子的第十五日，雅各为拉班和所有随他而来的人设宴。当天，雅各向拉班起誓，拉班也向雅各起誓，双方都不可在那山越界，怀着恶意到对方那里去，
  rationale: 仅作保守的语义与指代修订：删除原文未明说的“这事”，将“那月”改为较贴近原文的“那些日子”，并明确梦中显现的对象为拉班。其余措辞保留，因为已准确避免了英文旧译和《创世记》平行叙事造成的“离开基列”“第十年”“他们告诉拉班”及“主对拉班说话”等误译。
