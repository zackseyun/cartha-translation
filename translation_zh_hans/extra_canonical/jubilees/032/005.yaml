  text: from the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the fourth week, in the seventh year, Jacob turned toward Gilead in the first month, on the twenty-first; and Laban pursued after him and overtook Jacob at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not allow him to harm Jacob, for he appeared to him in a dream at night and Laban told Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent at the mountain,
translation:
  language: zh_hans
  text: 离开基列地。雅各向拉班隐瞒了自己的心思，没有告诉他。第四个七年周期的第七年，正月二十一日，雅各转向基列；拉班随后追赶，在三月十三日于基列山追上了雅各。但主不容拉班伤害雅各，因为主夜间在梦中向拉班显现；拉班也告诉了雅各。在那些日子的第十五日，雅各为拉班和所有随他而来的人设宴。当天，雅各向拉班起誓，拉班也向雅各起誓，双方都不可在那山越界，怀着恶意到对方那里去，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ
  choice: 雅各向拉班隐瞒了自己的心思
  rationale: 按字面保留“隐藏自己的心”，同时用现代汉语“心思”传达其意，避免擅自限定为某一种具体计划。
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: 雅各转向基列
  rationale: 方向后缀表明朝向基列，不是“离开基列”；“转向”也保留动词的转身、改变方向之意。
- source_word: በቅዳሜ፡ ወርኅ፡ አመ፡ ዐሥራሁ፡ ወአሚሩ
  choice: 正月二十一日
  rationale: 该日期短语指第一月第二十一日；采用简洁而庄重的汉语历法表达。
- source_word: በወርኅ፡ ሣልስ፡ አመ፡ ዐሡሩ፡ ወሠሉሱ
  choice: 三月十三日
  rationale: 原文是第三月第十三日，并非“第十三年”。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 对应原文的主称，既忠实又不把此处强行改写为其他神名形式。
- source_word: ገብረ፡ ያዕቆብ፡ ግዝአ
  choice: 雅各……设宴
  rationale: 此处指预备宴席；“设宴”自然、明确，符合叙事语体。
- source_word: ኢይትዐደዉ፡ አሐዱ፡ ኀበ፡ ካልኡ፡ በእኩይ
  choice: 双方都不可……越界，怀着恶意到对方那里去
  rationale: 保留彼此不得越过并加害对方的互惠誓言结构，不把“恶意”具体化为某一种伤害。
theological_decisions:
- issue: 夜间梦中显现者与叙事主语
  choice: 主夜间在梦中向他显现；拉班也把这事告诉了雅各
  alternative: 主在夜间的梦中向拉班显现，并就雅各的事对拉班说话
  rationale: 原文明确以主为显现者，代词在上下文中指拉班；后一分句则明确以拉班为主语、雅各为受话者，因此不按《创世记》平行叙事改写。
- issue: 神名的汉语呈现
  choice: 主
  alternative: 耶和华
  rationale: 原文使用格尔兹语的“主”称，而非必须还原为四字神名的明确形式；采用“主”可避免超出文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留开头承接上文的残句和结尾尚未完结的句法，以反映所给经节边界；年代单位译作“七年周期”，使《禧年书》的纪年方式对普通读者清楚。
