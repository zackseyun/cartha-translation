base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/002.yaml
  text: And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth of everything that had come with him, from people to cattle, from gold to all possessions; and he brought it and gave a tenth of everything.
translation:
  language: zh_hans
  text: 本月十四日，雅各清早起来，把随他而来的一切——从人到牲畜，从金子到各样财物——都取出十分之一；他把这十分之一带来，又从一切中取出十分之一。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጌሰ፡ ያዕቆብ፡ በነግህ
  choice: 雅各清早起来
  rationale: 按词序和语义表达雅各在清晨早起，使用自然、庄重的现代汉语。
- source_word: አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለዝ፡ ወርኅ
  choice: 本月十四日
  rationale: 直译日期表达，避免添加原文未明说的月份名称。
- source_word: ወዐሠረ፡ እምኵሉ
  choice: 都取出十分之一
  rationale: 该动词与“十分之一”相关；用分析式表达比单用“十一奉献”更易懂，也保留实际取出份额的含义。
- source_word: እምሰብእ፡ እስከ፡ እንስሳ
  choice: 从人到牲畜
  rationale: 保留原文范围表达，不把“人”解释为仆役、家属或人口，以免消除原文张力。
- source_word: እምወርቅ፡ እስከ፡ ኵሉ፡ ንዋይ
  choice: 从金子到各样财物
  rationale: ንዋይ可指财物、资产或器物；“各样财物”在此概括范围自然且不过度限定。
- source_word: ወአብአ
  choice: 他把这些带来
  rationale: 该词是表示使之进入的使役形式，语境中意为带来、带入，不能译作“拿取”。
- source_word: ወዐሠረ፡ እምኵሉ
  choice: 又从一切中献上十分之一
  rationale: 保留原文重复；末句结合献纳语境译作“献上十分之一”，而不采用教会术语化较强的表达。
theological_decisions:
- issue: “从人到牲畜”是否应按奉献制度加以解释
  choice: 照原文保留“从人到牲畜”
  alternative: 解释为从家中人口或仆役到牲畜，或改写为其所属的一切
  rationale: 原文明确列出人和牲畜；译文不替文本解决人如何被计入十分之一的神学与社会含义。
- issue: 末句是否明确说“献给上帝”
  choice: 译作“献上”，但不补出“给上帝”
  alternative: 译作“献给上帝”
  rationale: 所给分节开头的“给上帝”很可能承接前节，而本句自身未再次明说受领者；“献上”保留祭献语境，同时避免跨分节擅自补足。
translation_notes:
  register: 采用现代、清楚而庄重的叙事体。破折号标示两个“从……到……”范围结构，分号保留后半句的重复推进。未沿用旧脚注“或作：他拿取”，因为吉兹语 ወአብአ 支持“带来／带入”，并不支持“拿取”。
