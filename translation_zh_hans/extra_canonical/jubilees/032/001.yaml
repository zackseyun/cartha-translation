revisions:
- from: 犹大看见了[a]，就欢喜，并称颂他祖先亚伯拉罕和以撒的上帝。他说：“如今我知道，在万有的上帝面前，我和我的子孙都有永远的盼望。关于他们二人，事情就是这样定下的；这也必照着以撒给他们的祝福，记在天上的版上，为他们作永远的见证。”
  to: 犹大看见了[a]，就欢喜，并称颂他列祖亚伯拉罕和以撒的上帝。他说：“如今我知道，在万有的上帝面前，我和我的子孙都有永远的盼望。关于他们二人的事，已经如此定下；并要为他们记录在天上的版册上，作为永远的见证，正如以撒曾祝福他们那样。”
  rationale: 修订不改变段落的神学或叙事含义。它保留审校记录所支持的“犹大看见了”，以脚注透明说明文本疑难；同时将“天上的版”改为自然的“天上的版册”，并重组末句，以准确而清晰地表达定旨、天上记录、永恒见证和以撒祝福之间的关系。
