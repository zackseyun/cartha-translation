base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/001.yaml
  text: And Judah saw and rejoiced, and he blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be recorded for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them."
translation:
  language: zh_hans
  text: 犹大看见了[a]，就欢喜，并称颂他列祖亚伯拉罕和以撒的上帝。他说：“如今我知道，在万有的上帝面前，我和我的子孙都有永远的盼望。关于他们二人的事，已经如此定下；并要为他们记录在天上的版册上，作为永远的见证，正如以撒曾祝福他们那样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大欢喜了。”“看见了”采用复原读法；所给吉兹文本此处的文字有疑难。
    reason: 交代所给吉兹文本开头可能存在的遗漏、讹写或录入问题，并保留不含“看见了”的较短读法。
lexical_decisions:
- source_word: ባረኮ
  choice: 称颂
  rationale: 此处宾语是上帝，译为“称颂”比笼统的“祝福”更符合现代汉语宗教语境，同时保留“宣告赐福、赞美”的词义范围。
- source_word: ተስፋ፡ ዘለዓለም
  choice: 永远的盼望
  rationale: 直译核心意象，不把“盼望”具体化为某一种救恩或产业，以保留原文的开放性。
- source_word: አምላከ፡ ኵሉ
  choice: 万有的上帝
  rationale: 保留“all”的广泛指向，不限定为“所有人的上帝”或“全能的上帝”。
- source_word: ክልኤሆሙ
  choice: 他们二人
  rationale: 忠实保留原文双数所指；本节本身没有重新点明二人的姓名，因此不在译文中补足。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版
  rationale: “版”保留刻写、记录之物的实体意象，也与《禧年书》中反复出现的天上记录概念相符。
- source_word: በስምዕ፡ ዘለዓለም
  choice: 作永远的见证
  rationale: 按原文的“见证”表达，不改写成较抽象的“永久记录”。
theological_decisions:
- issue: “永远的盼望”属于谁
  choice: 我和我的子孙都有永远的盼望
  alternative: 我有永远的盼望，我的子孙也有
  rationale: 两种句法理解意义接近；正文采用自然汉语合并表达，同时不进一步界定盼望的内容。
- issue: 天上版册中的记载是预定、记载还是确立
  choice: 事情就是这样定下的；这也必……记在天上的版上
  alternative: 这事已为他们二人命定，并要在天上的版上为他们立作永远的见证
  rationale: 兼顾原文所含的确立与天上记录两个层面，避免把二者压缩为单一的预定论表述。
- issue: “他们二人”的身份
  choice: 保留代词，不在本节补名
  alternative: 明确译作“犹大和利未”
  rationale: 上下文或可辨明所指，但本节原文只用双数代词；保留这一衔接方式，避免向本节正文加入解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“万有的上帝”“永远的盼望”“天上的版”等表达保留原文意象和神学张力；句式适度拆分，便于普通读者朗读和理解。
