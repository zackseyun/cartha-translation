base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/025.yaml
  text: And Rachel died there and was buried in the land of Ephrath, that is, Bethlehem. And Jacob built a pillar over Rachel’s grave on the road, above her tomb.
translation:
  language: zh_hans
  text: 拉结死在那里，葬在以法他的地，就是伯利恒。雅各在路上、在拉结的墓上立了一根纪念柱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ ፡ ኤፍራታ
  choice: 以法他的地界
  rationale: “ምድር”可指土地、地域；译作“地界”既自然，也保留此处的地域含义。
- source_word: ሐውልተ
  choice: 一根柱子
  rationale: 该词在墓葬语境中指立于墓上的纪念柱；正文采用较贴近原文而不过度解释的“柱子”。
- source_word: ውስተ ፡ ፍኖት
  choice: 在路旁
  rationale: 字面涉及“在路上/路中”；汉语“在路旁”更符合坟墓与纪念柱的自然位置，也与相关传统表述相合。
- source_word: ላዕለ ፡ መቃብሪሃ
  choice: 就在她的墓上
  rationale: 保留“在她墓上方/之上”的空间表达，并用“就在”体现原句的补充强调。
