  text: It is ordained for them that they should do it and be recorded as friends. But if they transgress and act in all its ways with uncleanness, they shall be recorded on the heavenly tablets as adversaries, and they shall be blotted out from the book of life and recorded in the book of those who will be destroyed and with those who
translation:
  language: zh_hans
  text: 这是为他们所规定的：他们应当这样行，并被记为朋友。但他们若违犯，在其中一切道路上行事污秽，就必在天上的版册上被记为仇敌；他们的名字必从生命册上被涂去，并被记在那将要灭亡之人的册上，与那些……同列。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所提供的原文在“与那些……”处中断，句意未完。
    reason: 明确说明底本文段残缺，防止读者误以为译文遗漏或擅自猜补。
lexical_decisions:
- source_word: ሤሠርዐት፡ ሎሙ
  choice: 这是为他们所规定的
  rationale: 按被动、非人称结构表达，避免无根据地补出发令者“他”。
- source_word: ወይጸሐፉ፡ አዕርክተ
  choice: 并被记为朋友
  rationale: 将动词按被动理解，并保留“朋友”与下文“仇敌”的鲜明对照。
- source_word: ሰርኵስ
  choice: 不洁之事
  rationale: 表达污秽、不洁的含义；置于“行”之后，使现代汉语自然。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版册
  rationale: 兼顾“版/板”与天上记录载体的语境，区别于后文明确的“册”。
- source_word: ጸላእተ
  choice: 仇敌
  rationale: 与前文“朋友”构成原文所强调的身份对照。
- source_word: መጽሐፈ፡ ሕይወት
  choice: 生命册
  rationale: 采用自然且广为理解的汉语圣经用语。
- source_word: መጽሐፈ፡ እለ፡ ይትሐጐሉ
  choice: 那将要灭亡之人的册
  rationale: 保留关系从句和将来意味，不把灭亡的性质进一步解释为特定教义概念。
theological_decisions:
- issue: 被记为朋友或仇敌的天上身份记录
  choice: 保留“朋友—仇敌”的对称表达
  alternative: 把前半句译为“记作条例”
  rationale: 吉兹语“አዕርክተ”指朋友，与后文“ጸላእተ”（仇敌）形成关键对照；不应消解这一神学张力。
- issue: 生命册中的名字
  choice: 译作“他们的名字必从生命册上被涂去”
  alternative: 严格只说“他们必从生命册上被涂去”
  rationale: 汉语中册上被涂去的通常是名字；补出“名字”是轻度语义显化，不改变所指。
- issue: 残缺结尾
  choice: 以省略号保留未完结构，并加注说明
  alternative: 依据后续经文猜补宾语
  rationale: 所给原文片段止于“与那些……”，不可擅自补足。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“版册”保留天上版牍的古代意象；“生命册”则使用读者熟悉的固定表达。句末按现存来源片段保留残缺。
