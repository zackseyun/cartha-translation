base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/011.yaml
  text: Their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the LORD destroyed them for their evil deeds, because they were very wicked, and he caused the Amorites to dwell in their place, evil and sinful, and there is no people today that has completed all their sins, and they are no more.
translation:
  language: zh_hans
  text: 他们的王国包括加奈音、亚斯他录、以得来、米苏珥和比稳。耶和华因他们的恶行毁灭了他们[a]，因为他们极其邪恶；他使那些邪恶、有罪的亚摩利人住在他们的地方。直到今日，没有一个民族犯尽了他们所有的罪恶[b]；他们已不复存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判了他们”；但原文动词通常表示“毁灭、毁坏”。
    reason: 说明可见的旧译法，同时表明正文采用较贴合吉兹语动词基本义的译法。
  - marker: b
    text: 原文直译为“完成了他们所有的罪”；也可理解为“把他们的罪全都犯尽了”。
    reason: 保留原文“完成”与“所有”的表达及其在汉语中的可能含义，不加入“满盈”或“像他们一样”等原文未明说的成分。
lexical_decisions:
- source_word: አሕጐሎሙ
  choice: 毁灭了他们
  rationale: 该动词在此表示毁坏、灭亡，较“审判他们”更贴合吉兹语词义。
- source_word: ጸዋጋን፡ ጥቀ
  choice: 极其邪恶
  rationale: 以自然现代汉语表达程度副词与“邪恶”的组合。
- source_word: ወአኅደረ፡ አሞሬዎነ፡ ህየንቴሆሙ
  choice: 他使……亚摩利人住在他们的地方
  rationale: 保留使役结构和取代原居民而居住的空间关系。
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: 犯尽了他们的一切罪恶
  rationale: 保留“完成/犯尽”与“全部”的措辞，不加入“罪恶满盈”等解释性意象。
- source_word: ወአልቦሙ
  choice: 他们也已不复存在
  rationale: 按上下文将简短存在否定句译成自然中文，同时保留代词所指可能存在的歧义。
theological_decisions:
- issue: 上帝对邪恶民族的行动性质
  choice: 毁灭了他们
  alternative: 审判了他们
  rationale: 原文动词首先表达毁坏或使灭亡；译文不以较宽泛的神学术语“审判”取代具体行动。
- issue: “犯尽一切罪恶”的含义
  choice: 直译为“犯尽了他们的一切罪恶”
  alternative: “罪恶达到满盈”或“像他们一样犯尽罪恶”
  rationale: 原文有“完成”和“全部”，但不宜补入“满盈”的神学图像，也不应无明文地加入比较语“像他们一样”。
- issue: 末句代词的指向
  choice: 保留“他们”
  alternative: 明确为“那些民族”或“亚摩利人”
  rationale: 原文代词的先行对象并不完全明确，因此中文不擅自消解其张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。地名依常见圣经译名习惯音译；句法适度拆分以便普通读者理解。所有脚注标记均已置于正文相应位置。
