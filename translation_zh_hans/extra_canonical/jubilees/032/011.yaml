revisions:
- from: 他们的国有加奈音、亚斯他录、以得来、米苏珥和比稳。耶和华因他们的恶行毁灭了他们[a]，因为他们极其邪恶；他使邪恶有罪的亚摩利人住在他们的地方。直到今日，没有一个民族犯尽了他们的一切罪恶[b]；他们也已不复存在。
  to: 他们的王国包括加奈音、亚斯他录、以得来、米苏珥和比稳。耶和华因他们的恶行毁灭了他们[a]，因为他们极其邪恶；他使那些邪恶、有罪的亚摩利人住在他们的地方。直到今日，没有一个民族犯尽了他们所有的罪恶[b]；他们已不复存在。
  rationale: 修改仅限于中文自然度和句法：以“王国包括”替换“国有”，并调整亚摩利人的定语。保留“毁灭”“犯尽所有罪恶”及末句“他们”的歧义；不把末句代词擅自限定为某一民族，也不将“完成所有罪”扩展为特定的神学解释。
