base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/020.yaml
  text: And through you the salvation of Israel will be found. And on the day you sit on the throne of the glory of your righteousness, there will be great peace for all the seed of the sons of the beloved. Whoever blesses you shall be blessed, and all who hate you and afflict you, and also those who curse you, shall be destroyed and cut off.
translation:
  language: zh_hans
  text: 以色列必因你得着拯救。当你坐在你公义荣耀的宝座上之日[a]，蒙爱者的众子的一切后裔都必享有大平安。[b]凡祝福你的，必蒙祝福；凡恨你、苦待你，以及咒诅你的人，都必被毁灭，并被剪除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到那日，你将住在你公义荣耀的宝座上；”
    reason: 原文的时间表达和动词可容许这一句法划分及译法。
  - marker: b
    text: “蒙爱者的众子”亦可译为“他所爱的众子”。
    reason: 说明原文预指代词式属格结构，并保留其潜在歧义。
lexical_decisions:
- source_word: ብከ፡ ትትረከብ፡ መድኃኒተ፡ እስራኤል
  choice: 以色列必因你得着拯救
  rationale: 保留“借着/因着你”与被动式“被寻得、得着”的语义，同时用自然汉语表达。
- source_word: መንበረ፡ ክብር፡ ጽድቅከ
  choice: 你公义荣耀的宝座
  rationale: 尽量保留原文连续属格结构及“宝座—荣耀—你的公义”之间的开放关系，不简化为“尊贵的宝座”。
- source_word: ዐቢየ፡ ሰላም
  choice: 大享平安
  rationale: 兼顾“极大的平安”之强度与现代汉语的流畅、庄重表达。
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: 蒙爱者众子的所有后裔
  rationale: 按闪语式预指代词结构理解为“蒙爱者的众子”，保留“蒙爱者”作为实体称谓，避免误作“他所爱的众子”。
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: 必被除灭，遭到剪除
  rationale: 以两个并列结果保留原文双重动词的力度，不把二者合并成一个泛化表达。
theological_decisions:
- issue: “蒙爱者”是称号还是修饰“众子”
  choice: 蒙爱者众子的所有后裔
  alternative: 他所爱的众子的所有后裔
  rationale: 原文结构更支持“蒙爱者的众子”；此译保留该实体称谓及可能的神学指向，不擅自确定其所指。
- issue: 坐上宝座与大享平安的时间关系
  choice: 当你坐在……宝座上之日，……都必大享平安
  alternative: 到那日，你将住在……宝座上；……都必大享平安
  rationale: 依原文时间从句，使坐上宝座与平安的结果直接相连，同时用脚注保留另一种句法划分。
- issue: “你公义荣耀的宝座”的属格关系
  choice: 保留紧密的多重属格表达
  alternative: 你荣耀的公义宝座／彰显你公义的荣耀宝座
  rationale: 原文关系具有一定张力；不以解释性译文预先限定“荣耀”与“公义”的修饰层级。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留祝福与咒诅公式的对称性。“剪除”沿用圣经语域，但与“除灭”并列，使普通读者可由上下文理解。
