base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/017.yaml
  text: 'every man and woman in Israel who defiles his sanctuary. Because of this I have commanded you, saying, "Bear this testimony over Israel: see what happened to Shechem and to his sons, how they were given into the hand of the two sons of Jacob, and they killed them in agony, and it was reckoned to them as righteousness, and it was written down for them as righteousness."'
translation:
  language: zh_hans
  text: 以色列中凡玷污他的圣所[a]的男女——因此，我吩咐你说：“你要使以色列听见这见证[b]：看看示剑和他的儿子们遭遇了什么；他们怎样被交在雅各两个儿子的手中，那二人怎样在他们的剧痛中杀了他们。这事算为那二人的义，也为他们记作义。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的圣所”原文如此；按语境通常指上帝的圣所。
    reason: 保留原文代词所指的形式歧义，同时帮助读者理解常见语境指向。
  - marker: b
    text: 也可译作“你要向以色列宣告这见证”。原文直译为“使以色列听见这见证”。
    reason: 说明使役动词的字面结构及较自然的汉语表达可能。
lexical_decisions:
- source_word: ያረኵስ፡ መቅደሶ
  choice: 玷污他的圣所
  rationale: ያረኵስ 表示使不洁、玷污；መቅደሶ 带第三人称阳性单数属格，直译为“他的圣所”。保留代词，不擅自明定所指。
- source_word: አስምዕ፡ ዛተ፡ ስምዐ
  choice: 使以色列听见这见证
  rationale: 保留同源动词与名词所形成的“使听见……见证”结构；“见证”也保留其庄重及近于法律、盟约语境的分量。
- source_word: ተውህበት፡ ውስተ፡ እዴ
  choice: 被交在……手中
  rationale: 贴近原文“被给在……手中”的被动表达，同时采用自然的现代汉语习语。
- source_word: በፃዕር
  choice: 在他们的剧痛中
  rationale: ፃዕር 的基本义为痛苦、疼痛或苦楚；结合示剑事件的语境，指他们身处剧痛之中，不采用缺乏词源依据的“用刀”。
- source_word: ኮነቶሙ፡ ጽድቀ፡ ወተጽሕፎሙ፡ ለጽድቅ
  choice: 这事算为那二人的义，也为他们记作义
  rationale: 保留“成为/算为义”与“写下/记作义”的重复和平行关系，不进一步解释其神学机制。
theological_decisions:
- issue: “他的圣所”中代词的所指
  choice: 正文保留“他的”，脚注说明语境中通常理解为上帝的圣所
  alternative: 直接译为“上帝的圣所”
  rationale: 原文使用阳性单数属格代词而未在本句明说先行词；保留这一形式可避免把语境推断写入正文。
- issue: 对雅各两个儿子行为的义之评价
  choice: 直译为“算为……义，也……记作义”
  alternative: 弱化为“被认为做得对”或加入伦理辩解
  rationale: 原文明确重复“义”，形成有意的神学张力；译文不应弱化，也不应替文本调和其与其他经文可能产生的伦理张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文的法律—盟约色彩、被动结构和“义”的重复；“在他们的剧痛中”忠实呈现疼痛语义，并避免误译为“用刀”。
