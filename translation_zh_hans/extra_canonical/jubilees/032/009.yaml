base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/009.yaml
  text: This is a testimony of joy like this joy. And formerly they used to call the land of Gilead the land of the Rephaim, because it is the land of the Rephaim; and Rephaim were born there, giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits.
translation:
  language: zh_hans
  text: 这是喜乐的见证，如同这喜乐。[a]从前，人们称基列地为利乏音人之地，因为那是利乏音人之地；利乏音人也在那里出生；他们是身高十肘、九肘、八肘，直到七肘的巨人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头一句原文结构简略，也可理解为：“这是关于喜乐的见证，正如这喜乐。”
    reason: 保留原文中“喜乐—见证—如同这喜乐”之间语法关系的歧义。
  - marker: b
    text: 原文所列身高依次为十肘、九肘、八肘，直到七肘；“肘”是古代长度单位。
    reason: 说明数字序列，并澄清古代度量单位。
lexical_decisions:
- source_word: ፍሥሐተ
  choice: 喜乐
  rationale: 该词表示“喜乐、欢欣”；两次出现均按本义译出，避免把第二处误译为“见证”。
- source_word: ስምዕ
  choice: 见证
  rationale: 此处名词表示“见证、证言”，与前后的“喜乐”区别开来。
- source_word: ምድረ፡ ገለአድ
  choice: 基列地
  rationale: 采用现代中文圣经语境中通行且易懂的地名译法。
- source_word: ራፋኤም / ረፋኤም
  choice: 利乏音人
  rationale: 按相关古代族群名称音译，并用“人”明确指族群；同一名称的拼写变体统一处理。
- source_word: ረዐይት
  choice: 巨人
  rationale: 上下文以肘数描述异常身高，译作“巨人”自然传达所指。
- source_word: በአመት
  choice: 肘
  rationale: 这里是身高的古代长度单位；依文献语境译作“肘”，而非按字面误作“年”。
theological_decisions:
- issue: 开头“喜乐”与“见证”的关系
  choice: 保留“喜乐的见证，如同这喜乐”的紧密重复结构
  alternative: 将其解释性改写为“这是为这喜乐所作的见证”
  rationale: 原文结构简短而略显含混，翻译不替作者消解“喜乐”与“见证”的具体逻辑关系。
- issue: 利乏音人的身份
  choice: 仅按原文称为利乏音人和巨人
  alternative: 加入超自然、族谱或神学身份说明
  rationale: 本节没有进一步界定其性质，不应导入特定传统的解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留开头原文的重复和一定歧义；地名与族名使用中文圣经读者较熟悉的形式。数字按校勘所指出的十、九、八、七完整译出。
