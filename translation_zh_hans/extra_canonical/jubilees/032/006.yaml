base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/006.yaml
  text: from the prayer that he had prayed, that he should tithe together with their sacrifices and their drink offerings. And when the fire had consumed it, he burned frankincense upon it in the fire, and for the sacrifice of deliverance he offered two oxen and four rams and four sheep and four he-goats and four yearling sheep.
translation:
  language: zh_hans
  text: 他照着自己所作的祷告，许愿要连同他们的祭物和奠祭一同献上十分之一。[a]火将它烧尽之后，他便在其上焚烧乳香；又为拯救祭献上两头公牛、四只公绵羊、四只绵羊、四只公山羊和四只一岁的绵羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的祭物和奠祭”原文为复数领属；所指对象不明确。
    reason: 原文语法明确为复数，但上下文中的指代可能令现代读者困惑，故说明而不改成单数。
lexical_decisions:
- source_word: የዐሥር
  choice: 献上十分之一
  rationale: 该动词表达取十分之一或缴纳什一，结合祭献语境译为“献上十分之一”自然且准确。
- source_word: ጥዓሕቶሙ
  choice: 他们的奠祭
  rationale: 保留原文第三人称复数后缀；祭祀语境中“奠祭”比泛称“浇奠之物”更简明。
- source_word: የዐጥን፡ ስኂነ
  choice: 把乳香烧
  rationale: 该短语指焚烧乳香，不可省略；以现代中文明确表达动作及材料。
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: 拯救祭
  rationale: 直译其“拯救/救助之祭”的构造，避免擅自等同于某一既定祭类。
- source_word: አባግዐ፡ ዘዘ፡ ዓመት
  choice: 一岁的绵羊
  rationale: 按“各为一岁/年岁的绵羊”理解为一岁绵羊，保持牲畜清单的简洁。
theological_decisions:
- issue: “拯救祭”是否应解释为平安祭或救恩祭
  choice: 拯救祭
  alternative: 平安祭；救恩祭
  rationale: 原文用“拯救、救助”一词修饰祭物；直译可保留祭名的开放性，不把它强行归入后来的固定祭祀分类。
- issue: 复数领属后缀的指向
  choice: 他们的祭物和奠祭
  alternative: 他的祭物和奠祭
  rationale: 原文两个名词均带第三人称复数后缀，故保留“他们的”；虽先行对象不够明确，也不以解释性翻译消除这种张力。
translation_notes:
  register: 采用现代、庄重而可朗读的祭祀叙事用语。“公绵羊”与“绵羊”分别对应清单中不同的原文牲畜称谓；避免以不确定的专门祭名取代“拯救祭”。主文保留原文较突兀的复数领属，并以脚注提示。
