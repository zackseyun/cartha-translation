base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/019.yaml
  text: all the children of men. And I will give to your seed all the earth that is under heaven, and they will rule over all the nations as they desire; and after this they will draw the whole earth to themselves and inherit it.
translation:
  language: zh_hans
  text: 所有世人。我要把天底下的全地赐给你的后裔；他们必随自己的意愿统治万国。此后，他们必把全地收拢归于自己[a]，并承受全地为业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“聚集全地”。
    reason: 原动词可直接表示“聚集、收拢”；正文结合其使役形式及上下文，表达全地被归拢向主体的方向性。
lexical_decisions:
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: 该词本义为“种子、子孙”，此处指受应许者的后代；“后裔”自然且保留集体含义。
- source_word: ኵላ፡ ምድረ፡ ከመትሕተ፡ ሰማይ
  choice: 天下全地
  rationale: 依次保留“全部、地、在天之下”的范围表达，同时采用自然的现代汉语语序。
- source_word: ወይኴንኑ፡ ውስተ፡ ኵሉ፡ አሕዛብ
  choice: 他们必……统治万国
  rationale: 动词表达治理、支配；介词结构在此表示统治所及的对象，译作“统治万国”比“在万国中统治”更清楚。
- source_word: በከመ፡ ፈቀዱ
  choice: 随自己的意愿
  rationale: 保留“照他们所愿”的自主意味，不进一步解释其道德性质。
- source_word: ያስተጋብኡ
  choice: 使……归聚于自己
  rationale: 该使役形动词具有使聚集、收拢的含义；结合上下文中的统治与承受产业，译文既保留聚集意象，也表达向主体归拢的方向。
- source_word: ወይወርስዋ
  choice: 并承受全地为业
  rationale: 动词意为继承、取得为产业；补出“全地”作为承接前句的宾语，使汉语清楚自然。
theological_decisions:
- issue: 后裔对万国的统治范围与方式
  choice: 按字面保留“统治万国”及“随自己的意愿”
  alternative: 弱化为“在万国中治理”或将其解释为某种特定的末世统治
  rationale: 原文表达支配关系，却未指明实现方式、时代或道德评价，因此不引入额外的宗派性解释。
- issue: 全地归聚与承受产业的关系
  choice: 将两个动作并列呈现，不说明二者是否为征服、归信或政治整合
  alternative: 明确解释为征服世界或使万民归信
  rationale: 原文只陈述归聚和承受，并未限定其具体机制，应保留其神学与叙事上的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所有世人”保留本节开头作为承接上文的残句形态；整体不擅自补足前文。用“承受……为业”保持古代应许和产业语境中常见且易懂的圣经表达。
