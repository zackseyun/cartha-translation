base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/015.yaml
  text: the daughters of the nations. And if there is any from his daughters whom he gives to a man from any of the nations, for it is plague upon plague, and curse upon curse; and all this plague and curse shall come if he does this thing, and if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together shall be judged for all the uncleanness and profanation.
translation:
  language: zh_hans
  text: 列国的女子。若他把自己的任何一个女儿给了列国中的任何一个男子，这就是灾祸加灾祸、咒诅加咒诅。若他行了这事，又对那些行污秽之事的人、玷污主的圣所的人和亵渎他的圣名的人视而不见，这一切灾祸和咒诅就必临到；全体百姓都必因这一切污秽和亵渎而受审判。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋልደ፡ አሕዛብ
  choice: 列国的女子
  rationale: 按原文直译，并保留本节开头承接上文的片段性质；原文没有“在……之上”的介词。
- source_word: እምአዋልዲሁ
  choice: 自己的一个女儿
  rationale: 后缀为第三人称阳性单数，意为“他的女儿中（一个）”；中文随本句主语自然表达为“自己的一个女儿”。
- source_word: መቅሠፍት፡ ላዕለ፡ መቅሠፍት
  choice: 灾祸加灾祸
  rationale: 保留原文叠加强调的结构；“灾祸”在此比特指疫病的“瘟疫”更能涵盖审判性祸患。
- source_word: መርገም፡ ላዕለ፡ መርገም
  choice: 咒诅加咒诅
  rationale: 对应原文平行结构及其累加语气。
- source_word: ተዐወረ፡ አዕይንቲሁ
  choice: 视而不见
  rationale: 原文字面为“使自己的眼睛瞎了”，在语境中指故意闭眼不管；采用现代汉语习语传达其道德责任。
- source_word: ያረኵሱ፡ መቅደሶ፡ ለእግዚአብሔር
  choice: 玷污主圣所
  rationale: 准确表达使圣所不洁、受到亵渎之意，并以“主”对应神圣称号。
- source_word: ይጌምኑ፡ ስሞ፡ ቅዱሰ
  choice: 亵渎他圣名
  rationale: 保留“他的圣名”这一神学表达及亵渎行为的严重性。
- source_word: ይትኬነን
  choice: 受审判
  rationale: 该词在此表达被定罪或受裁断；“受审判”保留判决结果尚未在措辞中完全展开的空间。
theological_decisions:
- issue: 个人纵容污秽与全体百姓受审判之间的共同责任
  choice: 保留“全体百姓都必……受审判”
  alternative: 解释为只有直接犯罪者受惩罚
  rationale: 原文明言“全体百姓一同”受审判，不宜削弱其中群体责任的张力，也不额外说明其机制。
- issue: “主”的圣所和圣名
  choice: 译作“主圣所”与“他圣名”
  alternative: 加入特定神名音译或宗派化称谓
  rationale: 原文使用神圣称号；采用普通现代中文圣经语体，避免引入原文未要求的宗派特征。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留开头“列国的女子”这一承接上文的残句，不擅自补足缺失的句法内容；以平行、递进句式再现警告和审判的严肃语气。
