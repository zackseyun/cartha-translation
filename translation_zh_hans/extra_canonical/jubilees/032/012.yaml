  text: It has been ordained, and there is no keeping it over from this year to the year that is coming. For in its year the seed is eaten until the days of the gathering of the seed of the year, and wine until the time of
translation:
  language: zh_hans
  text: 这事既已定下，不可把它从今年留到来年。因为当年的种子要吃到收聚种子的日子，酒要喝到……的时候。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语原文到“酒要喝到……的时候”即告中断。本节中的埃塞俄比亚数字二十六、二十七、二十八是查尔斯1895年版的注释标号，不属于正文。
    reason: 说明底本文本残缺，并防止把版本注号误译为经文中的年份。
lexical_decisions:
- source_word: ተኀርየ
  choice: 已经定下
  rationale: 该词在此表示某事已被选定、规定或命定；“已经定下”自然传达完成/被动意味，同时不额外明说施事者。
- source_word: ወአልቦ፡ ለአትርፎ፡ እምኔሁ
  choice: 不可把它……留到
  rationale: 该短语表达没有将其余留、存留的可能，结合后文年度对照，译作“不可把它从今年留到来年”符合汉语习惯。
- source_word: ዘርእ
  choice: 种子／庄稼
  rationale: 该词可指种子、播种所得或作物；首次保留“种子”，在收聚语境中以“庄稼”表达其收成含义，避免生硬重复。
- source_word: መዋዕለ፡ ሐፊረ
  choice: 收聚……的日子
  rationale: 按字面保留“日子”和收聚概念，不把它过度具体化为某一种收割制度。
- source_word: አመ
  choice: ……的时候
  rationale: 末尾词引出时间点或时期，但所给原文截断，故以未完成短语呈现。
