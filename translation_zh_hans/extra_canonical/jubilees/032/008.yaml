base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/008.yaml
  text: they shall burn her with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.
translation:
  language: zh_hans
  text: 他们要用火焚烧她，因为她玷污了父家的名；她也要从以色列中被除掉。在地上世世代代的一切日子，以色列中都不可有淫乱或污秽，因为以色列归耶和华为圣。凡玷污以色列的人，必要死；众人要用石头打死他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: 用火焚烧她
  rationale: 动词所带的阴性宾语明确指向“她”；直译火刑表达，同时采用自然的现代汉语语序。
- source_word: አርኰሰት፡ ስመ፡ ቤተ፡ አቡሃ
  choice: 她玷污了父家的名
  rationale: 保留“玷污—名—父家”的源文结构及其家族荣誉含义，不改写为解释性的“使家族蒙羞”。
- source_word: ትሠረው፡ እምእስራኤል
  choice: 从以色列中被除掉
  rationale: 该动词表达除灭、拔除；“除掉”在汉语中自然，也保留其严厉的刑罚语气。
- source_word: ዘማ፡ ወርኵስ
  choice: 淫乱或污秽
  rationale: 分别保留性方面的不道德与较广义的不洁概念；连接词按汉语禁令语境译作“或”。
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር
  choice: 以色列归耶和华为圣
  rationale: “归……为圣”准确传达献属关系；以“耶和华”表达神圣称谓，符合现代中文圣经语体。
- source_word: ሞተ፡ ለይሙት
  choice: 必要死
  rationale: 保留源文同根词强化的确定性，以简洁庄重的汉语表达必死判决。
- source_word: በእብን፡ ይውግርዎ
  choice: 众人要用石头打死他
  rationale: 源文直义为“用石头击打他”；结合紧接的死刑判决，译作汉语惯用的“用石头打死”，不额外添加执行主体身份。
theological_decisions:
- issue: 以色列“为圣”的含义
  choice: 以色列归耶和华为圣
  alternative: 以色列对耶和华是圣洁的
  rationale: 前者较自然地保留圣洁兼具分别归属的含义，而不把“圣”缩减为单纯道德品质。
- issue: 末句“玷污”的宾语
  choice: 凡玷污以色列的人
  alternative: 凡玷污它的人
  rationale: 源文在前句以“以色列”为明确焦点；中文重复名词可避免代词指向含混，但不进一步界定玷污的具体方式。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。刑罚命令保持直接严肃；保留“父家的名”“归耶和华为圣”等源文关键意象，不以现代社会学或宗派性术语释义。
