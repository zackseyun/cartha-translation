- from: '他满心欢喜。雅各安排他的两个儿子[a]，一个在右边，一个在左边，这就算为他的义。夜里，雅各把一切都告诉了父亲：主怎样以极大的怜悯待他，怎样使他一路顺利，保护他脱离一切祸患。以撒就称颂他父亲亚伯拉罕的上帝，因为上帝没有从他仆人以撒的儿子收回慈爱和公义。


    早晨，雅各把自己向主所作的祷告、所见的异象、怎样筑了一座祭坛，以及怎样照着祷告预备好一切要献在主面前的祭物，都告诉了父亲以撒；他也说自己怎样来，要让父亲骑上驴。以撒对雅各说：“我儿，我不能跟你去，因为我年老了，受不了路途劳顿。平安地去吧，我儿！我今天已经一百六十五岁，不能再远行了。让你母亲骑上牲口，跟你一同去。我儿，我知道你是为我而来的；你今天还能看见我活着，我也能看见你，我儿，这一天是蒙福的。愿你顺利；要履行你所作的祷告，不要耽延，因为这祷告正等待实现。现在就赶快去做吧！愿那成就了一切的，成全你所作的祷告。”


    以撒又对利百加说：“跟你儿子雅各去吧。”利百加便跟儿子雅各同去，底波拉也陪着她；他们来到伯特利。雅各想起父亲为他和他的两个儿子利未、犹大祝福时所作的祷告，就欢喜快乐，称颂他祖先亚伯拉罕和以撒的上帝。他说：“现在我知道，在万有的上帝面前，我有永远的盼望，我的子孙也有。关于他们二人的事就是这样定下的；以撒怎样祝福他们，这事也要在天上的版上为他们立作永远的见证。”


    那一夜，雅各住在伯特利。利未梦见他们已任命并立他作至高上帝的祭司，他和他的子孙都要任职，直到永远。他从睡梦中醒来，就称颂主。


    这个月十四日清早，雅各起来，把随身带来的一切取出十分之一献上：从人口到牲畜，从金子到各种财物；他从一切所有的取了十分之一。那些日子，拉结怀了便雅悯。雅各数点自己的儿子，利未归入主的份；他父亲给他穿上祭司的衣服，为他行承接圣职之礼。[b]


    这个月十五日，他把祭牲带到祭坛：牛十四头，公绵羊十八只，绵羊四十九只，羊羔七只，山羊羔二十一只。'
