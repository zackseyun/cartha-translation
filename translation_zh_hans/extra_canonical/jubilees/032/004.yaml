base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/004.yaml
  text: He put on priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar from the cattle fourteen oxen and twenty-eight rams, and forty-nine sheep and seven lambs and twenty-one kids,
translation:
  language: zh_hans
  text: 他穿上祭司礼服，充满了自己的手[a]。这个月十五日，他把牲畜带到祭坛：公牛十四头、公绵羊二十八只、绵羊四十九只、羊羔七只、公山羊羔二十一只。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “充满自己的手”是一种与祭司授职有关的表达，也可理解为“承接祭司职分”。
    reason: 说明源文的礼仪性惯用语，同时保留正文的字面意象，不将其解释性含义直接替代原文措辞。
lexical_decisions:
- source_word: አልባሰ፡ ክህነት
  choice: 给他穿上祭司的衣服
  rationale: አልባሰ为使役、及物的“给……穿上”，而ክህነት在此修饰所穿衣物，表示祭司职分所用的服装；结合后接“他的双手”，保留两个不同人物的指向。
- source_word: መልአ፡ እደዊሁ
  choice: 使他的双手充满
  rationale: 直译这一授职语式，不在正文中径自化解其礼仪含义；以脚注提示可能的惯用含义。
- source_word: አብአ፡ ውስተ፡ ምሥዋዕ
  choice: 带到祭坛那里
  rationale: 按字面表达“带入／带到祭坛”，不增添原文没有明说的“作为祭物”。
- source_word: እምአልህምት
  choice: 牲畜
  rationale: 作为后续各类祭牲清单的总称，采用现代汉语中自然且范围合适的“牲畜”。
- source_word: መሓስዐ፡ ጠሊ
  choice: 公山羊羔
  rationale: 区分前面的羊羔，并体现山羊幼畜及其雄性类别。
theological_decisions:
- issue: “使他的双手充满”的祭司授职含义
  choice: 正文保留源文形象，脚注说明可理解为承接祭司职分
  alternative: 正文直接译作“授予他祭司职分”或“使他承接圣职”
  rationale: 源文保留了“充满双手”的礼仪性表达；直接解释会消除原有意象，并把一种语境解释写入正文。
- issue: 带到祭坛之物是否明说为祭物
  choice: 不加“作为祭物”
  alternative: 译作“把牲畜作为祭物带到祭坛”
  rationale: 上下文虽明显涉及献祭，但该短语本身没有对应“作为祭物”的词，故不在正文补入。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。祭牲清单使用常见量词，并以冒号清楚引出；不添加原文未明说的献祭解释。
