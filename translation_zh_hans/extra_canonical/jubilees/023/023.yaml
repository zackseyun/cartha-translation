revisions:
- from: 耶和华必降大惩罚在那一代人的行为上，把他们交给屠杀、审判、掳掠、抢夺和毁灭。
  to: 耶和华必使大惩罚临到那一代人的作为；他必把他们交给屠杀、审判、掳掠、抢夺和毁灭。
  rationale: 修订仅处理汉语句法和“作为”的词汇对应，保留原文的两分句结构、主的施行者身份，以及五项灾祸的次序与广义。未将末项具体化，也未引入任何宗派性解释。
