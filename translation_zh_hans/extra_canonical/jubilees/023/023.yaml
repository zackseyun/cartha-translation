review_pass:
  verdict: revise
  source_fidelity: 需修订。原文先说“大惩罚从主临到那一代人的作为”，随后以“他”指主，说他将他们交给五样灾祸。草案基本保留此结构，但“耶和华必降大惩罚在……”不合现代汉语句法；且“掳掠”在现代汉语中容易主要理解为抢夺行为，未充分显出此处“被掳／囚掳”的状态。
  naturalness: “降大惩罚在……上”明显生硬。改为“使大惩罚临到……”，庄重、自然，并维持惩罚临到其作为的句法关系。以分号分开两分句，也清楚保留后句主语“他”。
  terminology: “作为”可对应ግብረ并适用于道德审判语境，较“行为”稍更贴近“works”。“屠杀、审判、掳掠、抢夺和毁灭”保留五项并列；其中“掳掠”在圣经书面语中可指被掳的境遇，虽现代义有一定歧义，结合上下文仍可接受。无须添加脚注。
  issues:
  - severity: medium
    issue: “耶和华必降大惩罚在那一代人的行为上”句法不自然。
    rationale: 汉语通常说“使惩罚临到……”，这样既保留源文中惩罚临到“作为”的对象关系，也避免生硬的介词搭配。
  - severity: low
    issue: “行为”可更贴近原文的“作为／所作所为”。
    rationale: ግብረ的范围为作为、所作之事；“作为”在此审判语境中自然且覆盖面更合适。
  revised_text: 耶和华必使大惩罚临到那一代人的作为；他必把他们交给屠杀、审判、掳掠、抢夺和毁灭。
