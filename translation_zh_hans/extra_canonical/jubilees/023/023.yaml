  text: And a great punishment will come upon the works of that generation from the LORD, and he will give them over to slaughter and judgment and captivity and plundering and destruction.
translation:
  language: zh_hans
  text: 耶和华必使大惩罚临到那一代人的作为；他必把他们交给屠杀、审判、掳掠、抢夺和毁灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት፡ ዐቢይ
  choice: 大惩罚
  rationale: 保留“大”与惩治、灾罚之义；现代汉语中自然庄重。
- source_word: ግብረ፡ ይእቲ፡ ትውልድ
  choice: 那一代人的行为
  rationale: ግብር 在此指所行之事；译作“行为”比“工作”更符合审判语境，同时保留惩罚临到其行为这一表达。
- source_word: እምኀበ፡ እግዚአብሔር
  choice: 耶和华必降
  rationale: 源语表示惩罚来自主；汉语以主动句自然表达来源，未改变施行者。
- source_word: መጥባሕት
  choice: 屠杀
  rationale: 该词指宰杀、杀戮，较“刀剑”更直接对应源语所指的结果。
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留司法裁决和定罪惩处的语义，不进一步限定其形式。
- source_word: ፂዋዌ
  choice: 掳掠
  rationale: 表达被俘、被掳的处境，并与下一项财物遭抢夺相区别。
- source_word: ሀደድ
  choice: 抢夺
  rationale: 对应劫掠、夺取之义，采用现代读者易懂的表达。
- source_word: ብልዐት
  choice: 毁灭
  rationale: 字面具有吞吃、吞噬之义，此列举中指最终被消灭的灾祸结果；“毁灭”在汉语中较自然，但不将其具体化为某一种灾害。
theological_decisions:
- issue: 惩罚的来源与施行者
  choice: 译为“耶和华必降……把他们交给……”
  alternative: “大惩罚必从耶和华临到……他必把他们交给……”
  rationale: 源文明确惩罚来自上主，并以第三人称指上主交付他们；汉语合并为连续主动句，指代清楚且不增添神学解释。
- issue: 惩罚临到“行为”还是临到“世代”
  choice: 保留“降……在那一代人的行为上”
  alternative: “临到那一代人”
  rationale: 源文明确出现“那一代的行为”；虽在汉语中略带源语色彩，仍应保留惩罚针对其所作所为的措辞，不擅自简化对象。
- issue: 末项 ብልዐት 的形象性
  choice: 毁灭
  alternative: 吞噬
  rationale: “吞噬”更贴近词形意象，“毁灭”更符合灾罚清单的语用结果。正文采用自然且广义的“毁灭”，不把它限定为饥荒或食人等特定解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留五项并列灾罚及源文的神学张力，避免古奥词汇和宗派化解释。
