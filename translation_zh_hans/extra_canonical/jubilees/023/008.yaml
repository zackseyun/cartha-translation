  yaml_path: translation/extra_canonical/jubilees/023/008.yaml
  text: And all the men of his house wept for him forty days, and Isaac and Ishmael and all their sons and all the sons of Keturah in their places; and the days of weeping for Abraham were completed.
translation:
  language: zh_hans
  text: 他家中所有男子都为他哀哭了四十天；以撒、以实玛利、他们所有的儿子，以及基土拉所有的儿子，都各自在自己的地方哀哭。为亚伯拉罕哀哭的日子就满了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በከይዎ
  choice: 为他哀哭
  rationale: 该动词在此表示因死者而哭泣、哀悼；“为他哀哭”既保留哭泣的具体意象，也清楚表明哀悼对象。
- source_word: ውሉዶሙ / ውሉደ ኬጡራ
  choice: 他们的众子／基土拉的众子
  rationale: ውሉድ 在亲属谱系语境中可指子女或后裔；本节依原文结构及传统理解译作“众子”，不扩展为更宽泛的“后裔”。
- source_word: በመካኖሙ
  choice: 各在自己的地方
  rationale: 直译其地点分散之意，表明这些人并非必然同处一地哀哭。
- source_word: ተፈጸመ መዋዕለ ብካዩ
  choice: 哀哭的日子就满了
  rationale: 保留原文“日子完成、届满”的表达，同时采用自然而庄重的现代汉语。
theological_decisions:
- issue: 末句中哀哭的主体与对象
  choice: 为亚伯拉罕哀哭的日子
  alternative: 亚伯拉罕哀哭的日子
  rationale: 上下文描述家人哀悼已经去世的亚伯拉罕，因此“亚伯拉罕”是哀哭的对象，而不是正在哀哭的主体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“众子”保留家谱语境；第二分句补出“哀哭”，使汉语句法完整，但不增加新的事件内容。
