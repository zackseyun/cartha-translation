  yaml_path: translation/extra_canonical/jubilees/023/018.yaml
  text: For all of them have acted wickedly, and every mouth speaks sin, and all their works are uncleanness and abomination, and all their ways are defilement and uncleanness and destruction.
translation:
  language: zh_hans
  text: 因为他们全都作恶，人人口中都说罪恶；他们的一切行为都是污秽可憎的，他们的一切道路尽是玷污、污秽和败坏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败坏”或译“毁灭”。
    reason: 末词可表示腐败、败坏，也可指毁坏或灭亡。
lexical_decisions:
- source_word: ዐበሳ
  choice: 罪恶
  rationale: 该词可指罪、过犯或罪责；在“口中说……”这一搭配中译作“罪恶”自然，也保留道德含义。
- source_word: ስቈራር
  choice: 可憎的
  rationale: 该词表达令人厌恶、可憎之意；与“污秽”并列时译作“可憎的”，保留其强烈语气。
- source_word: ግማኔ
  choice: 玷污
  rationale: 按其污损、污染的语义处理，并与随后表示“污秽”的词有所区分。
- source_word: ሙስና
  choice: 败坏
  rationale: 该词可涵盖腐败、毁坏或灭亡；“败坏”在此既自然，又能保留道德腐化与毁坏后果之间的语义张力。
theological_decisions:
- issue: ዐበሳ 应译为“罪恶”还是“罪责”
  choice: 罪恶
  alternative: 罪责
  rationale: 原句说每一张口都“说”该词，侧重口中所表达的罪恶，而非仅陈述法律或神学意义上的罪责。
- issue: 末词 ሙስና 的道德与毁灭含义
  choice: 正文采用“败坏”
  alternative: 毁灭／败亡
  rationale: 不将其单向限定为最终毁灭；脚注提示另一可能，使原文的语义幅度得以保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原文反复出现的“都／一切”以及并列递进结构；“污秽可憎”避免生硬堆叠，同时维持强烈的道德谴责语气。
