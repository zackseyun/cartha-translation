  yaml_path: translation/extra_canonical/jubilees/023/012.yaml
  text: And all the generations that will arise from now until the day of the great judgment will grow old quickly before they complete two jubilees, and their knowledge will depart from them, from their spirit,, and all their knowledge will vanish.
translation:
  language: zh_hans
  text: 从现在直到大审判之日，凡兴起的世代，尚未过完两个禧年，就都迅速衰老；他们的知识要从他们的灵里离去，[a]他们一切的知识也都要消逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的知识要从他们的灵里离去”也可理解为“他们的知识要离开他们”。末句在所据版本中置于方括号内。
    reason: 说明中间分句的句法歧义，并交代括号内末句的文本状态。
lexical_decisions:
- source_word: ኵሉ፡ ትውልድ፡ ዘይትነሣእ
  choice: 凡兴起的世代
  rationale: 按原文保留“兴起”的动态表达；“凡”自然传达整体范围。
- source_word: ዕለተ፡ ደይን፡ ዐባይ
  choice: 大审判之日
  rationale: 直译核心名词结构，保持末世审判语义而不另作神学解释。
- source_word: ይረሰኡ፡ ፍጡነ
  choice: 迅速衰老
  rationale: 对应“迅速／很快”与“变老”，采用自然庄重的现代汉语。
- source_word: ዘእንበለ፡ ይፈጽሙ፡ ክልኤ፡ ኢዮቤል
  choice: 尚未过完两个禧年
  rationale: 表达在完成两个禧年以前即衰老；“禧年”保留本书特有的时间单位。
- source_word: አእምሮቶሙ
  choice: 他们的知识
  rationale: 该词可涉及知识、认识或理解；上下文强调认知能力的丧失，译作“知识”并以脚注保留另一种句法理解。
- source_word: እመንፈሶሙ
  choice: 从他们的灵里
  rationale: 明确保留原文“从他们的灵”的成分，避免像早期英译修订那样遗漏。
- source_word: ወትአትት፡ ኵላ፡ አእምሮቶሙ
  choice: 他们一切的知识也都要消逝
  rationale: 如实译出括号内末句，并保留其与前句近似重复的强调效果。
theological_decisions:
- issue: “灵”与知识离去之间的句法关系
  choice: 他们的知识要从他们的灵里离去
  alternative: 他们的知识要离开他们
  rationale: 现存格阿兹文本明确含有“从他们的灵”这一短语，正文予以保留；同时脚注说明另一种较简约的理解，以免过度确定可能不稳的句法。
- issue: 括号内末句的文本状态
  choice: 纳入正文并保留重复
  alternative: 将其移至脚注或省略
  rationale: 所给底本文本包含该句；尽管以方括号标示，翻译仍应呈现其内容，并用脚注说明文本状态。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“禧年”保留《禧年书》的术语特色；句中不消除“知识”重复，以呈现原文的强调和可能的文本层次。
