revisions:
- from: 他们要拿起弓和刀剑，起来杀戮，为要使他们回到正道；他们不会回头，直到许多人的血流在地上，彼此残杀。
  to: 他们要带着弓和刀剑，兴起杀戮，为要使他们回到这条道路上；他们不会回头，直到许多血流洒在地上——这些人被那些人杀害。
  rationale: 修订保留“使他们回到道路上”的方向性，并维持后半句中行动者“他们”可能仍指前述武装者的句法连贯。末尾不译作“彼此残杀”，而用“这些人被那些人杀害”尽量反映原文的压缩对举；破折号提示其与“血流洒在地上”的补充性关系，未擅自规定双方必然互为施害者。
