  text: And they will rise up with bow and with swords and with slaughter, to turn them back to the way; and they will not turn back until much blood is poured out on the earth, these by those.
translation:
  language: zh_hans
  text: 他们要带着弓和刀剑，兴起杀戮，为要使他们回到这条道路上；他们不会回头，直到许多血流洒在地上——这些人被那些人杀害。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቀውሙ
  choice: 起来
  rationale: 该动词基本义为“站立、起来”；此处描述武装行动，用“起来”既贴近原文，也符合现代汉语。
- source_word: በቀስት፡ ወበአስይፍት፡ ወበቅትል
  choice: 拿起弓和刀剑，起来杀戮
  rationale: 保留“弓、刀剑、杀戮”三个并列要素，同时调整介词结构，使中文自然可读；“杀戮”不弱化原文的暴力色彩。
- source_word: ከመ፡ ይሚጥዎሙ፡ ውስተ፡ ፍኖት
  choice: 为要使他们回到正道
  rationale: ውስተ 表示“进入、到……里面”，故方向是使他们回到“道路”，不是赶离道路；“正道”在汉语中自然表达此处具有规范意义的“道路”。
- source_word: ወኢይትመየጡ
  choice: 他们不会回头
  rationale: 保留“转回、回头”的语义，并维持主语可能仍指前述起事者的句法连贯性。
- source_word: እሉ፡ በእሉ
  choice: 彼此残杀
  rationale: 原文直译近于“这些被那些”，表达双方互相施加暴力；汉语用“彼此残杀”清楚传达其相互性。
theological_decisions:
- issue: “道路”的方向
  choice: 使他们回到正道
  alternative: 把他们赶离道路
  rationale: 原文介词 ውስተ 的方向是“进入、到”，支持使对方转向道路；不采用与介词方向相反的旧译。
- issue: 末句双方关系
  choice: 彼此残杀
  alternative: 这些人被那些人杀害
  rationale: “这些被那些”在上下文中呈现群体间相互流血；译作“彼此残杀”避免武断指定单向受害关系，同时保留原文的紧张性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留经文中武装起事、劝返正道与持续流血之间的神学和伦理张力，不加解释性评判。
