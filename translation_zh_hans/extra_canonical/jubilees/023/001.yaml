  yaml_path: translation/extra_canonical/jubilees/023/001.yaml
  text: And he placed Jacob's two fingers upon his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers.
translation:
  language: zh_hans
  text: 他把雅各的两根手指放在自己眼睛上，称颂万神之神；随后蒙上脸，伸直双脚，睡了永恒之眠，归到列祖那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆን፡ አጻብዐ፡ ያዕቆብ
  choice: 雅各的两根手指
  rationale: 依照词序与所有关系，保留“两根手指属于雅各”的意思；用现代汉语自然表达，避免生硬的“雅各之两指”。
- source_word: አምላክ፡ አማልክት
  choice: 万神之神
  rationale: 保留原文“神中之神”的最高级称号；“万神之神”在庄重汉语中简洁自然，并不额外裁定“众神”的本体地位。
- source_word: ኖመ፡ ንዋመ፡ ዘለዓለም
  choice: 睡了永恒之眠
  rationale: 保留原文“睡眠”的死亡委婉语及“永恒”的明确修饰，不仅译作较含蓄但信息较少的“长眠”。
- source_word: ተጋብአ፡ ኀበ፡ አበዊሁ
  choice: 归到列祖那里
  rationale: 准确传达“被聚集/归到他的父祖那里”的传统死亡表述；“列祖”庄重且为现代读者熟悉。
theological_decisions:
- issue: “万神之神”是否暗示承认多神真实存在
  choice: 直译为“万神之神”
  alternative: 至高的上帝
  rationale: 原文保留复数“众神”与其上的神这一称号；改作“至高的上帝”会提前消解原文可能具有的修辞或神学张力。
- issue: “永恒之眠”的性质
  choice: 保留死亡的睡眠隐喻
  alternative: 去世了／永远死去
  rationale: 原文同时使用“睡眠”和“永恒”，不宜把隐喻改写为对死亡或复活状态的教义性解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“自己眼睛”明确回指动作的执行者，符合该句语法与语境；分号用于梳理连续的临终动作，不改变其顺序。
