revisions:
- from: 那时，他们会说：“先人的年日很多，长达一千年，而且美好；但看哪，我们一生的年日，人即使活得长久，也不过七十年；若是强健，便到八十年。这些年日却是苦难的；在这个邪恶世代的日子里，毫无平安。”
  to: 那时，他们会说：“先人的年日很多，长达一千年，并且美好；但看哪，我们一生的年日，人活到高龄时，是七十年；若是强健，可到八十年。这些年日却是恶劣的；在这个邪恶世代的日子中，毫无平安。”
  rationale: 修订“即使”为时间性表达，删去额外强化限制的“也不过”，并以“恶劣的”保留源词对年日的宽泛负面评价。其余保留原译的经文体、寿数对照和“邪恶世代”的明确表述。
