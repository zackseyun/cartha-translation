  yaml_path: translation/extra_canonical/jubilees/023/016.yaml
  text: Then they will say, “The days of the former ones were many, up to a thousand years, and good; but behold, the days of our life, when a man has lived long, are seventy years, and if he is strong, eighty years, and they are evil, and there is no peace in the days of this evil generation.”
translation:
  language: zh_hans
  text: 那时，他们会说：“先人的年日很多，长达一千年，并且美好；但看哪，我们一生的年日，人活到高龄时，是七十年；若是强健，可到八十年。这些年日却是恶劣的；在这个邪恶世代的日子中，毫无平安。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀደምት
  choice: 先人
  rationale: 指从前世代的人；“先人”既自然，又保留其与当代人的对比。
- source_word: መዋዕሊሆሙ፡ ብዙኅ
  choice: 年日很多
  rationale: 贴近“他们的日子众多”的源语表达，并在汉语中自然指寿命长。
- source_word: ሠናይ
  choice: 美好
  rationale: 保留该词“好、美善”的宽泛意义，不把它限缩为安逸或幸福。
- source_word: አመ፡ አብዝኀ፡ ሰብእ፡ ሐይወ
  choice: 人即使活得长久
  rationale: 表达一人达到通常寿命上限的条件性/让步意味，与后面的七十年相接自然。
- source_word: ኀየለ
  choice: 强健
  rationale: 该词表示有力量、强壮；此处指体力足以使寿数延至八十。
- source_word: እኩይ
  choice: 苦难的
  rationale: 此处语境描述人生年日的恶劣、困苦；译作“苦难的”比抽象的“邪恶”更符合汉语对年日的修饰，同时不抹去负面判断。
- source_word: አልቦ፡ ምዝኒ፡ ሰላመ
  choice: 毫无平安
  rationale: 强化源语否定“没有任何平安”，以简洁现代汉语表达。
- source_word: ትውልድ፡ ይእቲ፡ እኪት
  choice: 这个邪恶世代
  rationale: 保留“这/这个世代”及其道德评价，不将“世代”改释为时代或族群。
theological_decisions:
- issue: 七十、八十年与诗篇九十篇的互文关系
  choice: 保留源文本的寿命陈述，不添加经文出处或解释
  alternative: 在正文中明确仿用诗篇九十篇，或按其常见译法增译“其中所夸耀的”
  rationale: 本节自身没有明说引文出处，也没有后一个短语；不应从可能的互文中补入源文所无内容。
- issue: “年日是恶的”的性质
  choice: 译为“这些年日却是苦难的”
  alternative: 译为“这些年日是邪恶的”
  rationale: 源词可表达恶、坏或困苦。结合寿命和无平安的语境，“苦难的”在现代汉语中较自然；同时以“这个邪恶世代”保留明确的道德性用语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“看哪”的经文语体和层层并列的论述结构，但以分号和句号避免长句拖沓。“也不过”自然传达与先人千年寿数相比的缩减，不额外加入宗派性解释。
