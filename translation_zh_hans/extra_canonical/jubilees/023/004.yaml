  text: And he rose from his bosom and ran and told Rebekah his mother. And Rebekah went by night to Isaac and told him, and they went together, and Jacob also with them, and a torch was in his hand; and when they had gone, they found Abraham lying dead.
translation:
  language: zh_hans
  text: 他从亚伯拉罕怀中起来，跑去告诉母亲利百加。利百加连夜去见以撒，把这事告诉了他。于是他们一同前去，雅各也跟他们一起；他手里拿着一支火把。[a]他们到了那里，看见亚伯拉罕躺着，已经死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火把”和“手”在原文中都是单数，“手”带阳性单数后缀；按紧邻语序很可能指雅各，但也可能指以撒。
    reason: 原文明确使用单数形式，却没有重复说明持火把者的姓名；正文保留单数，脚注说明所指的轻微歧义。
lexical_decisions:
- source_word: እምሕፅኑ
  choice: 从亚伯拉罕怀中
  rationale: 该词组直译为“从他的怀中”；结合上一节，所指是亚伯拉罕的怀中。正文明确补出姓名，使现代汉语指代清楚，同时保留叙事联系。
- source_word: ሌሊተ
  choice: 连夜
  rationale: 原词表示“在夜间”。“连夜去见”在现代汉语中自然，并保留夜间立即前往的叙事意味。
- source_word: ማኅቶት
  choice: 一支火把
  rationale: 原文名词为单数，故不采用复数“火把”。
- source_word: በድኖ
  choice: 已经死了
  rationale: 该词表示“死的、尸体般的”。译作“已经死了”自然明确，并与“躺着”共同传达原文画面。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“从亚伯拉罕怀中起来”这一具体叙事细节，不以较泛化的“从床上起来”替代；同时将较长的原文并列结构分成数句，以便普通读者理解。
