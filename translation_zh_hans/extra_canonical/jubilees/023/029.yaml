revisions:
- from: 人的日子将开始增多，世世代代、日复一日地增长，直到他们的寿数接近一千年，并在漫长的岁月中又延续许多年。那时不再有老人，也没有人觉得自己没有享尽天年，因为他们全都如同孩童和少年。他们一生的日子都将在平安喜乐中度过，并且存活；那时不再有撒但，也没有毁灭人的恶者，因为他们一生的日子都将是蒙福和得医治的日子。
  to: 人的日子将开始增多，世世代代、日复一日地增长，直到他们的寿数接近一千年，并在许多日子之外又有许多年。那时不再有老人，也没有一个人不以自己的日子为满足；因为他们全都如同孩童和少年。他们一生的日子都将在平安和喜乐中度过；他们必存活。那时不再有撒但，也没有毁灭人的恶者，因为他们一生的日子都将是祝福和医治的日子。
  rationale: 修订限于恢复“满足自己的日子”的原文表达，改善“存活”的中文自然度，并使末句的“祝福和医治”保持原文名词并列。“并在许多日子之外又有许多年”对应所给英语审校轨迹中“to many years beyond many days”的不寻常对比，未擅自把它解释为某一特定末世体系或具体年代算法。
