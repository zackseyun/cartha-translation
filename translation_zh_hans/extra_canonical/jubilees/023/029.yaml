base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/029.yaml
  text: And the days will begin to grow many and increase among the children of men, generation by generation and day by day, until their days draw near to one thousand years and to many years beyond many days. And there will be no old man, nor one who is not satisfied with his days; for all of them will be like children and youths. And all their days they will complete in peace and joy, and they will live, and there will be no Satan and no evil destroyer, for all their days will be days of blessing and healing.
translation:
  language: zh_hans
  text: 人的日子将开始增多，世世代代、日复一日地增长，直到他们的寿数接近一千年，并在许多日子之外又有许多年。那时不再有老人，也没有一个人不以自己的日子为满足；因为他们全都如同孩童和少年。他们一生的日子都将在平安和喜乐中度过；他们必存活。那时不再有撒但，也没有毁灭人的恶者，因为他们一生的日子都将是祝福和医治的日子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕል
  choice: 日子／寿数／一生的日子
  rationale: 此词在本节反复出现，依语境分别指一般的“日子”、人的寿命及一生；中文适度变换可保持所指清楚，同时保留原文以“日子”为核心的反复意象。
- source_word: ውሉደ፡ ሰብእ
  choice: 人
  rationale: 字面为“人的儿女”；现代汉语中译作“人”自然且涵盖全人类，避免产生只指后代子孙的误解。
- source_word: ፲ሠርቱ፡ ምእት፡ ዓመት
  choice: 一千年
  rationale: 数词结构明确，直译其具体寿数。
- source_word: ዘኢይጸግብ፡ መዋዕሊሆሙ
  choice: 觉得自己没有享尽天年
  rationale: 动词核心义为“满足、饱足”；此处指对自己日子的满足，译文保留主观“满足”的含义，而不简化为仅仅“夭折”。
- source_word: ሕፃናት፡ ወደቂቅ
  choice: 孩童和少年
  rationale: 两个年龄称谓并列，分别表达年幼者与年轻者；如此可保留原文并列结构。
- source_word: ሰይጣነ
  choice: 撒但
  rationale: 按专名音译，保留其人格化称谓，不泛化为“邪恶”。
- source_word: እኩየ፡ ዘያማስን
  choice: 毁灭人的恶者
  rationale: 保留“恶”与“毁坏／摧毁”的双重信息，并维持其可能指人格化作恶者的表达。
- source_word: በረከት፡ ወፈውስ
  choice: 蒙福和得医治
  rationale: 分别对应“祝福”与“医治／痊愈”；用动态名词结构使中文自然，并保留二者并列。
theological_decisions:
- issue: 未来长寿景象的性质
  choice: 按预言性陈述直译，不注明其属于末世、千禧年或其他特定时期
  alternative: 明确解释为某一宗派体系中的末世国度
  rationale: 本节自身只描绘未来长寿、平安和医治的景象，没有明确界定其体系位置，故不加入宗派性解释。
- issue: “没有撒但”的含义
  choice: 保留“撒但”这一人格化专名，并与“毁灭人的恶者”并列
  alternative: 将二者都抽象化为“邪恶势力”
  rationale: 原文明确使用撒但之名；保留并列也不武断判定后一个称谓与撒但是同一对象还是另一恶者。
- issue: “如同孩童和少年”的语义张力
  choice: 保留明喻，不解释为永葆青春或道德纯真
  alternative: 释义为“始终年轻”或“纯洁无罪”
  rationale: 原文容许身体年龄、生命状态或相对寿命等多种理解，译文不替文本消除这种张力。
translation_notes:
  register: 采用现代、庄重且通顺的简体中文。整体遵循最优对等：保留原文“日子”的重复意象、预言语气和并列节奏，同时在不同上下文中用“寿数”“一生的日子”澄清所指。原文星号属于版本校勘标记而非正文脚注；因未提供具体异文内容，正文不另设脚注。
