base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/020.yaml
  text: And they will contend, these with those, and the young with the old, and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler, concerning the law and concerning the covenant, because they have forgotten commandment and covenant and festival and month and Sabbath and Jubilee and all that is appointed.
translation:
  language: zh_hans
  text: 他们将彼此争执：少年人与老年人相争，老年人与少年人相争；穷人与富人相争，卑微的人与尊贵的人相争，贫乏的人与掌权者相争。他们要就律法和约起争执，因为他们已经忘记了诫命、约、节期、月份、安息日、禧年，以及一切所定的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትባአሱ
  choice: 争斗
  rationale: 该动词在此表示彼此冲突、争竞；“争斗”既保留强烈语气，也适合随后各社会群体相争的并列结构。
- source_word: ወረዘት
  choice: 少年人
  rationale: 指年轻者，与“老年人”构成明确对举；采用现代、庄重而易懂的称呼。
- source_word: ሊቃናት
  choice: 老年人
  rationale: 上下文要求与年轻者相对，译作“老年人”比可能带职衔意味的译法更贴合此处年龄对举。
- source_word: ነዳይ … ባዕል
  choice: 穷人……富人
  rationale: 保留经济地位上的鲜明对照；“ባዕል”在这一对举中宜理解为有财产者、富人。
- source_word: ትሑት … ዐቢይ
  choice: 卑微的人……尊贵的人
  rationale: 表达社会地位低与高的对照；避免把“ዐቢይ”仅按体格译为“大”。
- source_word: ምስኪን … መኰንን
  choice: 贫乏的人……掌权者
  rationale: 前者指困苦、匮乏者，后者指官长或统治者；“掌权者”能自然表达权势差异，同时不限定具体官职。
- source_word: ሕግ
  choice: 律法
  rationale: 在诫命、约和圣日的语境中指具有宗教规范性质的律法，而非一般法律。
- source_word: ኪዳን
  choice: 约
  rationale: 保留其立约、盟约含义，并使用中文圣经传统中清楚简洁的术语。
- source_word: በዓለ፡ ወወርኀ፡ ወሰንበተ፡ ወእዮቤሌወ
  choice: 节期、月份、安息日、禧年
  rationale: 依次保留原文所列神圣历法项目；“月份”不擅自具体化为月朔，“禧年”对应 Jubilee 制度。
- source_word: ኵሎ፡ ዘ ኴነ
  choice: 一切所规定的事
  rationale: 直译可近于“一切已有的事”，但上下文列举律法和圣历规定，采用“所规定的事”传达其规范性含义，并与源文语境相符。
theological_decisions:
- issue: “律法和约”是争论的主题还是争斗的原因
  choice: 译作“为律法和约争论”
  alternative: “因律法和约而争斗”
  rationale: 原文介词短语可表达“关于”或“为了”；采用“为……争论”保留主题与缘由之间的张力，不说明哪一方立场正确。
- issue: 圣日名称是否专名化
  choice: 采用“安息日、禧年”而不另加解释
  alternative: 译作一般性的“休息日、七年周期”
  rationale: 上下文明确处于律法与约的宗教历法框架中，传统术语最准确，同时不引入额外教派解释。
translation_notes:
  register: 采用现代标准汉语，保持预言性、庄重而清晰的语体。首句以冒号引出五组对举，并用分号分隔，以再现原文累积式平行结构；末句保留因果关系和圣历项目的连续列举。
