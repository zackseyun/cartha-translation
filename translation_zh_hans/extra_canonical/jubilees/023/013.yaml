  yaml_path: translation/extra_canonical/jubilees/023/013.yaml
  text: And in those days, if a man lives a jubilee and a half of years, they will say of him, “He has lived long”; but most of his days are pain and labor and distress, and there is no peace.
translation:
  language: zh_hans
  text: 在那些日子，若有人活到一个半禧年，人们就会论到他说：“他活得长久。”但他大部分的日子都是痛苦、劳碌和困苦，毫无平安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እመ፡ ሐይወ፡ ብእሲ
  choice: 若有人活到
  rationale: 按条件结构译出“若一个人活”，并用“有人”形成自然、庄重的现代汉语。
- source_word: ኢዮቤልወ፡ ወመንፈቀ፡ ዓመታት
  choice: 一个禧年半
  rationale: 保留原文以禧年计算寿命的表达；即一个禧年加半个禧年，不擅自换算成年数。
- source_word: አብዝኀ፡ ሐይወ
  choice: 他活得长久
  rationale: 直陈其寿命被认为很长，符合引语语境。
- source_word: ሙስዝናተ፡ መዋዕሊሁ
  choice: 他大多数的日子
  rationale: 对应其日子的多数部分，避免扩展为整个人生。
- source_word: ሕማም፡ ወስራሕ፡ ወምንዳቤ
  choice: 痛苦、劳碌和忧患
  rationale: 分别保留身体或普遍性的苦痛、劳作负担及困苦忧患的并列层次。
- source_word: አልቦ፡ ሰላመ
  choice: 毫无平安
  rationale: 简洁而有力度地表达“不存在平安”；“平安”也保留该词可能涵盖安宁与福祉的宽度。
theological_decisions:
- issue: “平安”的含义范围
  choice: 保留“平安”
  alternative: 安宁／太平
  rationale: 原词可指和平、安宁及整体福祉；“平安”在现代中文中自然，也不把含义限缩为外在无战争或内在宁静。
- issue: 禧年的具体年数
  choice: 不换算，译作“一个禧年半”
  alternative: 七十三年半左右
  rationale: 原文以禧年为计量单位；直接换算会引入历法解释并消除文本原有的文化表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“尽是”强化多数日子所呈现的总体特征，但仍由“大多数”限制范围；引语和转折依照原文结构保留。
