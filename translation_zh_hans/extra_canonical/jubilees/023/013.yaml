- from: 在那些日子，若有人活到一个禧年半，人们就会论到他说：“他活得长久。”但他大多数的日子尽是痛苦、劳碌和忧患，毫无平安。
  to: 在那些日子，若有人活到一个半禧年，人们就会论到他说：“他活得长久。”但他大部分的日子都是痛苦、劳碌和困苦，毫无平安。
  rationale: 修订仅改善现代汉语的数量表达和句法自然度，并将并列的患难性词语译为“困苦”。原文的条件、引语、禧年计量、寿命长短的社会评价，以及没有平安的断言均予保留。
