  text: And a sound was heard in the house of Abraham, and Ishmael his son arose and went to Abraham his father, and he wept for Abraham his father, he and all the house of Abraham, and they wept with great weeping.
translation:
  language: zh_hans
  text: 在亚伯拉罕家中听见了声音。以实玛利，就是亚伯拉罕的儿子，起来到他父亲亚伯拉罕那里去，为他父亲亚伯拉罕哀哭；他和亚伯拉罕全家都极其哀哭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃል
  choice: 声音
  rationale: 原词可指“声音、声响、话语”；此处未明说是哭声，因此保留较宽泛的“声音”，不根据上下文擅自具体化。
- source_word: ተንሥአ
  choice: 起来
  rationale: 按原文保留动作次序，也符合现代汉语叙事表达。
- source_word: በከየ / በከዩ
  choice: 哭泣／哀哭
  rationale: 原文先用单数、后用复数描述哭泣；译文以“哭泣”对应个人行动，并以“哀哭”体现全家的丧亲悲恸。
- source_word: ብካየ፡ ዐቢየ
  choice: 大大哀哭
  rationale: 保留同源名词加强动词的强调效果，即“极其悲痛地哭”，同时采用自然、庄重的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“父亲亚伯拉罕”的重复，以反映原文的哀悼语气与句法强调；不把开头未明确性质的“声音”解释为哭声或报丧声。
