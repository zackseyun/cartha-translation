  - severity: low
    issue: 正文与翻译注所述的脚注 b 不一致
    rationale: 翻译注称应在“约”后置脚注 b，但实际脚注集中没有 b，正文亦无该标记。修订后不保留未经支撑的“约”异文说明，脚注结构恢复一致。
