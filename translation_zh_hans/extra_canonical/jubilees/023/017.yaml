revisions:
- from: 在那一代，儿女[a]必因父辈和长者所犯的罪、所行的不义、口中所说的话，以及他们所做的种种大恶而责备他们；也因他们背弃了主在自己与他们之间所立的约。这约要求他们谨守遵行他的一切诫命、规例和全部律法，不偏向右，也不偏向左。
  to: 在那一代，儿女[a]必因他们父辈和长者所犯的罪、所行的不义、口中的言语，以及所做的种种大恶而责备他们；又因他们背弃了主在他们与自己之间所定的规例，使他们谨守遵行他的一切诫命、规例和全部律法，不偏向右，也不偏向左。
  rationale: 依指定吉兹语底本，将被背弃的 ሥርዐተ 由“约”改为“规例”，以避免英语审校层的 covenant 读法覆盖所给原文。相应删除无实际锚点的脚注 b 说明。其余译法仅作指代和句法顺畅化处理，不改变经文的指控、法律术语串列或“不偏左右”的意象。
  reviewer_model: gpt-5.6-terra
