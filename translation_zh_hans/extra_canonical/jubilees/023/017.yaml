base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/017.yaml
  text: And in that generation children will reproach their fathers and their elders because of sin and because of injustice and because of the speech of their mouth and because of the great evils that they commit, and because they have forsaken the covenant that the LORD made between them and himself, that they should keep and do all his commandments and his ordinances and all his law, without turning aside to the right hand or to the left.
translation:
  language: zh_hans
  text: 在那一代，儿女[a]必因他们父辈和长者所犯的罪、所行的不义、口中的言语，以及所做的种种大恶而责备他们；又因他们背弃了主在他们与自己之间所定的规例，使他们谨守遵行他的一切诫命、规例和全部律法，不偏向右，也不偏向左。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”。
    reason: 吉兹语 ደቂቅ 可泛指孩子、儿女，也可特指儿子；此处正文采用较包容且符合代际对照的“儿女”。
lexical_decisions:
- source_word: ደቂቅ
  choice: 儿女
  rationale: 该词可泛指孩子，也可指儿子；此处与“父辈和长者”相对，“儿女”在现代汉语中自然且不无根据地保留后代之义。
- source_word: ይዘልፉ
  choice: 责备
  rationale: 表达因上一代的恶行而斥责、谴责之意；“责备”准确而不过度强化。
- source_word: አበዊሆሙ፡ ወአዕሩጊሆሙ
  choice: 父辈和长者
  rationale: 分别呈现“他们的父亲/父辈”与“他们的老人/长者”；“父辈”更适合群体和代际语境。
- source_word: ዐመፃ
  choice: 不义
  rationale: 该词在此与罪及大恶并列，含悖逆、违法或不义之意；“不义”保留较宽的伦理含义。
- source_word: ኪዳን（据英译所反映的读法；所给吉兹文本此处作 ሥርዐተ）
  choice: 约
  rationale: 英语校勘层作“covenant”，但所给吉兹文本字面为“规制/法度”。正文依该传统语境译作“约”，并用脚注如实标示源文读法差异。
- source_word: ትእዛዘ፡ ወሥርዐተ፡ ወኵሎ፡ ሕገ
  choice: 一切诫命、规例和全部律法
  rationale: 逐项保留命令、条例/规例和律法三组法律术语，维持原文累积式表达。
- source_word: የማነ፡ ወፀጋመ
  choice: 向右……向左
  rationale: 保留原文方位成语，表达丝毫不偏离所吩咐的道路。
theological_decisions:
- issue: 主与群体之间关系的表述
  choice: 主在自己与他们之间所立的约
  alternative: 主在他们中间所制定的规制
  rationale: 英语审校层反映“立约”的文本传统和句法理解；但吉兹本文面读法存在差异，故正文采用语境连贯的“约”，同时在脚注明示另一读法，不掩盖文本张力。
- issue: 诫命的所属
  choice: 他的一切诫命
  alternative: 一切诫命
  rationale: 吉兹文本的代词归属不如英语表达明确；上下文以主为立约和颁令者，补出“他的”符合语义，但不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“谨守遵行”承接法律与盟约语境；分成两句以降低长串并列结构的阅读负担。注意：脚注 b 所对应的标记应置于正文“约”之后。
