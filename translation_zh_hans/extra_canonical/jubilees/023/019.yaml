base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/019.yaml
  text: Behold, the earth will be destroyed because of all their deeds, and there will be no grain, no wine, and no oil, because all their deeds are faithless; and they will all perish together—beasts and cattle and birds and all the fish of the sea—because of the sons of men.
translation:
  language: zh_hans
  text: 看哪，大地必因他们的一切行为而毁坏；五谷、酒和油都必断绝，因为他们的一切行为都背信弃义。野兽、牲畜、飞鸟和海里所有的鱼都必一同灭亡；这都是因世人而起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትሐጐል
  choice: 必……毁坏
  rationale: 该词在本节先用于大地，后用于各类动物，语义涉及毁灭、灭亡；依各自主语分别译作“毁坏”和“灭亡”，使现代汉语自然，同时保留共同的灾灭意象。
- source_word: ዘርእ፡ ወይን
  choice: 五谷、酒
  rationale: 按校订文本将其理解为并列的农业产物“谷物与酒”，而不机械译成不自然的“葡萄树的种子”；“五谷”在现代汉语中概括粮食作物，与酒、油构成自然的产物序列。
- source_word: ቅብዐ
  choice: 油
  rationale: 原词可指膏油或油；在谷物、酒的农业产物语境中译作“油”最合适，不额外限定为橄榄油。
- source_word: ካሕደ፡ ምግባሪሆሙ
  choice: 他们的一切行为都背信弃义
  rationale: ካሕደ 带有否认、背弃、不忠之意；译作“背信弃义”保留道德和关系层面的不忠，不把含义缩减为一般的邪恶。
- source_word: እምቅድመ፡ ውሉደ፡ ሰብእ
  choice: 这一切都是因世人而起
  rationale: 该短语表达灾祸源于或归因于“人的子孙”；“因世人而起”准确传达归因关系，也符合现代中文表达。
theological_decisions:
- issue: 受造界的毁灭与人类行为之间的因果关系
  choice: 明确译出大地及动物的灾灭“因”人的行为而来
  alternative: 弱化为仅表示时间上的伴随或笼统关联
  rationale: 原文在开头以“因他们的一切行为”，末尾又以“因世人”形成归因框架；应保留人类罪行牵连受造界的神学张力。
- issue: “背信弃义”的对象是否明确
  choice: 不补出对上帝、盟约或彼此背信
  alternative: 译为“背叛上帝”或“违背盟约”
  rationale: 原文本节未明确说明背弃的对象；保留开放性，避免导入特定神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“看哪”保留先知式警示语气；后半句列举各类动物，以分号和顿号清楚呈现范围。未设置脚注，因此正文无脚注标记。
