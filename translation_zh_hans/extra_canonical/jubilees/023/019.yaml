revisions:
- from: 看哪，大地必因他们的一切行为而毁坏；五谷、酒和油都必断绝，因为他们的一切行为都背信弃义。野兽、牲畜、飞鸟和海里所有的鱼，也都必一同灭亡；这一切都是因世人而起。
  to: 看哪，大地必因他们的一切行为而毁坏；五谷、酒和油都必断绝，因为他们的一切行为都背信弃义。野兽、牲畜、飞鸟和海里所有的鱼都必一同灭亡；这都是因世人而起。
  rationale: 仅收窄末句代词的语法指向，使“因世人而起”直接承接动物及海鱼的集体灭亡，避免在中文中无意扩展其明确指代范围；其余措辞保持原译的来源忠实度与现代汉语自然性。
