base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/022.yaml
  text: And those who have escaped will not turn from their wickedness to the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.
translation:
  language: zh_hans
  text: 那些逃脱的人不会离开自己的恶行，转向正义之路；因为他们全都要起来追逐欺诈和财富，各人都想夺取邻舍的一切。他们要为自己博得大名，却不是凭真实，也不是凭正义；他们还要以自己的不洁和他们污秽所带来的败坏，亵渎至圣所。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድኅኑ
  choice: 逃脱的人
  rationale: 该词在此指从灾祸中幸存、逃脱的人；译作“逃脱的人”与上下文的余民意象相合，又不额外赋予属灵“得救”的含义。
- source_word: ፍኖተ፡ ጽድቅ
  choice: 正义之路
  rationale: 直译为“正义／公义的道路”；“正义之路”在现代汉语中庄重自然，并保留伦理与神学层面的开放性。
- source_word: ትዕግልት
  choice: 欺诈
  rationale: 依该版本及英译所反映的语境，指诡诈、欺骗性的争夺；采用“欺诈”，避免将其窄化为一般冲突。
- source_word: ብዕል
  choice: 财富
  rationale: 按语境表示财物或财富，与后文夺取邻舍所有相呼应。
- source_word: ወስመ፡ ዐቢየ፡ ይሰምዩ
  choice: 为自己博得大名
  rationale: 表达“被称为大／获得大名”的意思；“博得大名”自然传达其自我抬举，而不过度规定具体方式。
- source_word: ቅድስተ፡ ቅዱሳን
  choice: 至圣所
  rationale: 字面结构为“圣中之圣”，在圣所语境中通常指至圣所；采用规范、易懂的汉语宗教术语。
- source_word: ርኵሶሙ
  choice: 自己的不洁
  rationale: 保留礼仪与道德不洁均可能包含的宽度，不具体化为某一种罪污。
- source_word: ሙስና፡ ግማኔሆሙ
  choice: 污秽的败坏
  rationale: 原文呈现“败坏／腐化”与“污秽／玷污”的叠加表达；译文保留两层概念，虽略显凝重，却符合经文修辞。
theological_decisions:
- issue: “逃脱”是否译为“得救”
  choice: 逃脱的人
  alternative: 得救的人
  rationale: 此处重点是经历灾祸后仍不悔改的人；“得救”在现代基督教汉语中容易被理解为终极救恩，可能制造原文未必具有的神学矛盾。
- issue: “至圣”所指为何
  choice: 至圣所
  alternative: 至圣之物
  rationale: 原文表达可字面理解为“圣中之圣”；依据传统译读和亵渎场景采用地点性的“至圣所”，但不进一步指明具体圣殿或时代。
- issue: 恶人获得“大名”的性质
  choice: 为自己博得大名，却不是凭真实，也不是凭正义
  alternative: 他们将被称为伟大，却并非真实，也并非正义
  rationale: 译文保留名望与真实、正义之间的张力，不将“大名”解释为神的认可或合法尊荣。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。分号组织原文连贯的因果与递进关系；“邻舍”保留古代伦理语境且为普通读者熟悉。对末句保留原文较强的污秽与败坏叠词，不作教派化解释。
