  yaml_path: translation/extra_canonical/jubilees/023/026.yaml
  text: In those days they will cry out and call and pray to be saved from the hand of the sinful nations, but there will be no one who will be saved.
translation:
  language: zh_hans
  text: 在那些日子，他们必呼喊、求告、祈祷，为要从有罪的列国手中得救；但没有一人得救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但没有一人得以逃脱。”
    reason: 原动词可指“得救”或“逃脱、脱险”；正文依祈祷和拯救语境译为“得救”，脚注保留另一处境性译法。
lexical_decisions:
- source_word: ይጸርሑ፡ ወይጼውዑ፡ ወይጼልዩ
  choice: 呼喊、求告、祈祷
  rationale: 保留原文三个并列动词及其递进式恳求语气；“求告”也自然表达向神呼求的含义。
- source_word: ከመ፡ ይድኅኑ
  choice: 盼望……而得救
  rationale: ከመ 引出目的，基本式复数动词 ይድኅኑ 在此为不及物意义“得救、逃脱”，不译作使役性的“拯救”。
- source_word: እምእደ፡ ኃጥአን፡ አሕዛብ
  choice: 脱离犯罪列国的手
  rationale: 直译“从犯罪的列国之手”，保留“手”所表达的权势或辖制意象；አሕዛብ 为复数“列国”。
- source_word: ወአልቦ፡ ዘይድኅን
  choice: 但没有一人能得救
  rationale: 关系结构意为“没有得救者/无人得救”；动词仍是基本式而非使役式。汉语加入“能”以自然表达预告中的结果性不可能，但不把主语改成施救者。
theological_decisions:
- issue: 末句所指是“无人得救”还是“无人施救”
  choice: 但没有一人能得救
  alternative: 但没有人来拯救他们
  rationale: 原文 ይድኅን 是基本式，指“得救、逃脱”，不是使役式“拯救”；因此主体是未能获救的人，而非缺席的施救者。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“犯罪列国”比“有罪的民族”更贴近复数结构及其道德定性；保留“从……的手”这一古典权势意象。正文脚注标记与脚注对应。
