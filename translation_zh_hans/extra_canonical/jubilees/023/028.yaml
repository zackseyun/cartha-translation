  text: And in those days the children will begin to search the law, and to seek the commandments, and to return to the way of righteousness.
translation:
  language: zh_hans
  text: 在那些日子，孩子们将开始查考律法，寻求诫命，并回到公义之道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቅ
  choice: 孩子们
  rationale: 该词基本义为“孩子、儿女”；此处泛指新一代，译为“孩子们”既贴近原文，也不额外限定性别或身份。
- source_word: ይትኀሠሡ፡ ሕገገ
  choice: 探求律法
  rationale: 动词含查考、寻找之意；“探求”兼顾主动寻索与深入查考，保留原文语气。
- source_word: ለኀሢሠ፡ ትእዛዝ
  choice: 寻求诫命
  rationale: 保留与前一分句相近而不完全相同的寻索表达；“诫命”准确对应命令、训令的宗教语境。
- source_word: ተመይጦ፡ ውስተ፡ ፍኖተ፡ ጽድቅ
  choice: 回归正义之道
  rationale: 逐项体现“返回／转回”“进入／到”“道路”“正义／公义”；中文以“回归……之道”自然凝练地表达。
theological_decisions:
- issue: ጽድቅ 的译法
  choice: 正义
  alternative: 公义
  rationale: 原词可涵盖正直、公正与合宜；“正义”较符合普通现代汉语，同时不排除其宗教伦理含义。
- issue: “探求律法”与“寻求诫命”的关系
  choice: 保留两个并列分句
  alternative: 合并为“查考律法和诫命”
  rationale: 原文以两个动词短语并列，可能有修辞递进或同义强化；保留并列可避免抹平这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话；保留原文三个并列动作的节奏，不添加解释性主语或神学限定。
