  text: And the heads of the children will become white with gray hair, and a child of three weeks will appear old like one of a hundred years, and their stature will be destroyed by distress and affliction.
translation:
  language: zh_hans
  text: 孩子们的头发将因衰老而变白；才三周大的婴孩，看起来竟像百岁老人；他们的身量也将因困苦和患难而被摧毁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይጸዐዱ፡ አርእስተ፡ ደቂቅ፡ በሲበት
  choice: 孩子们的头发将因衰老而变白
  rationale: 原文直陈“孩子们的头因衰老而变白”；汉语以“头发变白”自然表达其语义，同时保留幼年与衰老并置的反常景象。
- source_word: ሕፃን፡ ወልደ፡ ሠለስት፡ ሱባዔ
  choice: 才三周大的婴孩
  rationale: ሠለስት ሱባዔ意为“三个七日周期”，即三周；“才”凸显年龄之幼小而不增加实质内容。
- source_word: ልሂቅ፡ ከመ፡ ዘምእት፡ ዓመት
  choice: 看起来竟像百岁老人
  rationale: 保留“显得年老，如同百岁之人”的比较结构；“老人”在现代汉语中比“百岁之人显老”更自然。
- source_word: ይትሐጐል፡ ቍመቶሙ
  choice: 他们的身量……衰残
  rationale: ቍመት可指身量、体态或身体成长状态；“身量衰残”保留原文较具体但略显异常的表达，避免径自解释为寿命缩短。
- source_word: በምንዳቤ፡ ወበፃዕር
  choice: 在困苦和患难中
  rationale: 两个并列词均指压迫性的痛苦、劳苦或患难；以“困苦和患难”保留并列与语义强度。
theological_decisions: []
