base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/011.yaml
  text: For Abraham was perfect in all his deeds with the LORD, and he was pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, until he grew old because of evil, and he was full of days.
translation:
  language: zh_hans
  text: 因为亚伯拉罕在他一切与主有关的行为上都完全，一生的日子都以公义蒙主喜悦。他一生尚未满四个禧年，就因邪恶而衰老，并且饱享天年[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 直译：“饱足于自己的日子。”
    reason: 保留原文以“饱足”描述寿数的希伯来式表达。
lexical_decisions:
- source_word: ፍጹም (fəṣṣum)
  choice: 完全
  rationale: 保留“完整、无可指摘”的基本含义；在“行为”这一语境中用“完全”庄重而自然，不额外引入绝对无罪的解释。
- source_word: ምስለ፡ እግዚአብሔር (məsla ʾƎgziʾabəḥer)
  choice: 在主面前
  rationale: 介词本义为“与”，但整个短语描述亚伯拉罕的行为相对于主的状态；正文采用自然的汉语圣经表达“在主面前”，脚注保留较形式对应的“与主同行/同主相合”可能性。
- source_word: ይሠምር (yəsämmər)
  choice: 蒙主喜悦
  rationale: 该词表达取悦、得喜悦；补出语义上的对象“主”，使汉语清楚，并与上句衔接。
- source_word: ኢዮቤልውሳተ (ʾiyobelusat)
  choice: 禧年
  rationale: 指每四十九年为一周期的禧年；“四个禧年”即四个这样的周期，不换算成年数，以保留原文历法表达。
- source_word: ረሰአ (räsäʾa)
  choice: 衰老
  rationale: 表达年老、变老；结合后文邪恶造成寿命衰减的语境，译作“衰老”比单纯“年老”更能体现负面色彩。
- source_word: ወጸገበ፡ መዋዕሊሁ (wä-ṣägäba mäwaʿəllihu)
  choice: 饱享天年
  rationale: 直译为“饱足于自己的日子”；采用汉语中自然庄重的寿终表达，同时用脚注保留原文“饱足”的具体意象。
theological_decisions:
- issue: “完全”是否表示亚伯拉罕绝对无罪
  choice: 保留“完全”，限定于“一切行为在主面前”的叙述
  alternative: 正直／无可指摘
  rationale: 原文确实使用“完全”，不应因系统神学顾虑削弱；同时不添加“毫无罪过”等超出本句的绝对化解释。
- issue: 亚伯拉罕衰老与“邪恶”的关系
  choice: 因邪恶而衰老
  alternative: 在邪恶面前衰老
  rationale: “在……面前”这一习语可具有原因义，且本章语境强调邪恶导致人的寿命缩短；脚注保留较字面的空间性读法，以免抹去原文张力。
- issue: “饱享天年”的主体与含义
  choice: 亚伯拉罕饱足于自己的岁月
  alternative: 他的日子满了
  rationale: 原文动词的主体是亚伯拉罕，并带有“饱足”的意象；不改写为以“日子”为主语的完成表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“禧年”保留古代历法术语；句法分为两句以避免欧化长句。神名按本段来源及英语审校层统一译作“主”。
