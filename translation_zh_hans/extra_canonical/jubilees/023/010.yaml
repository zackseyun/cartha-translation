base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/010.yaml
  text: For the days of the former ones were nineteen jubilees for their lives; but after the Flood they began to diminish from nineteen jubilees, and to grow old quickly, and to shorten the days of their lives because of many afflictions and because of the evil of their ways, except Abraham.
translation:
  language: zh_hans
  text: 因为从前之人的寿数是十九个禧年期[a]；但洪水以后，他们的寿数开始从十九个禧年期递减，也迅速衰老；他们一生的日子因许多苦难和他们道路的邪恶而缩短，亚伯拉罕除外。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禧年期”是本书使用的时间单位，通常指七个七年，即四十九年。
    reason: 帮助普通读者理解专门的历法术语。
  - marker: b
    text: “亚伯拉罕除外”在原文中的修饰范围并不完全明确：可指前面所说的整体情形，也可能特指“他们道路的邪恶”。
    reason: 保存原文句法所留下的真实歧义，避免替读者作出神学判断。
lexical_decisions:
- source_word: መዋዕለ፡ ቀደምት
  choice: 从前之人的寿数
  rationale: 结合后文“他们的生命”，将字面上的“从前之人的日子”按寿命语境自然译出。
- source_word: ዐሠርቱ፡ ወተስዓቱ፡ ኢዮቤልውሳት
  choice: 十九个禧年期
  rationale: 保留本书以禧年为时间单位的术语，并用“期”表明这里指完整的禧年周期。
- source_word: አይኅ
  choice: 洪水
  rationale: 此处指叙事中的那场洪水；中文正文无需借助额外教派术语。
- source_word: ይኅትጉ
  choice: 逐渐减少
  rationale: 表达寿数从十九个禧年开始递减的过程。
- source_word: በረሲአ፡ ፍጡነ
  choice: 迅速衰老
  rationale: 对应“快速变老”，采用自然且庄重的现代汉语。
- source_word: ሕማም፡ ብዙኅ
  choice: 苦难重重
  rationale: 源词可涵盖痛苦、患难或疾病；用“苦难”保留较宽泛的含义。
- source_word: እከየ፡ ፍናዊሆሙ
  choice: 他们所行的道路邪恶
  rationale: 保留“道路”这一行为与生活方式的比喻，不把它窄化为某一种罪。
theological_decisions:
- issue: 末尾“亚伯拉罕除外”的修饰范围
  choice: 正文独立置于句末，并加注说明歧义
  alternative: 明确译成“唯有亚伯拉罕所行的道路并不邪恶”或“唯有亚伯拉罕不受寿命缩短影响”
  rationale: 原文末尾的例外语结构简短，其范围可能指整个前述情况，也可能更贴近“道路邪恶”；不宜在正文中擅自消除这种歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“禧年期”和“道路”两个具有本书特色的表达，同时通过脚注解释术语及句末例外语的范围歧义。
