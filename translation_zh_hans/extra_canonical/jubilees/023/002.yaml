  text: And through all this Jacob was lying in his bosom, and he did not know that Abraham, his father's father, had died.
translation:
  language: zh_hans
  text: 在这一切期间，雅各一直躺在亚伯拉罕怀中，并不知道他祖父亚伯拉罕已经去世。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበዝ፡ ኵሉ
  choice: 在这一切期间
  rationale: 按上下文表达“在这一切事情发生的整个过程中”，以自然汉语保留时间延续之意。
- source_word: ይስክብ፡ ውስተ፡ ሕፅኑ
  choice: 一直躺在亚伯拉罕怀中
  rationale: 直译为“躺在他的怀中”；汉语为避免代词指向不清，依语境明示亚伯拉罕，同时保留亲密依偎的具体形象。
- source_word: አቡ፡ አቡሁ
  choice: 他祖父
  rationale: 字面为“他父亲的父亲”，现代汉语通常自然表达为“他祖父”。
- source_word: ሞተ
  choice: 已经去世
  rationale: 准确传达“死了”，并以庄重、自然的叙事用语表达。
theological_decisions:
- issue: 雅各躺在谁的怀中
  choice: 在正文中明确为亚伯拉罕
  alternative: 保留“在他怀中”
  rationale: 原文使用代词，但紧接着点明亚伯拉罕为已死者；结合叙事情境，所指是亚伯拉罕。中文若仅写“他”容易产生不必要的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体；保留原文中雅各尚未察觉亚伯拉罕死亡所形成的张力，不额外解释其原因。
