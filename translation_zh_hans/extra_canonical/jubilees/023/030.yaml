  yaml_path: translation/extra_canonical/jubilees/023/030.yaml
  text: And then the LORD will heal his servants, and they will rise up and see great peace, and they will drive out their enemies; and the righteous will see and give thanks and rejoice forever and ever with joy.
translation:
  language: zh_hans
  text: 然后，上主必医治他的仆人；他们必起来，得见极大的平安，赶逐他们的仇敌。义人也必看见，献上感谢，并欢喜快乐，直到永永远远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'እማን
  choice: 那时
  rationale: 此处承接前文，表达时间推进；译作“那时”比单纯“然后”更符合现代汉语叙事语感。
- source_word: ይፈውሶ
  choice: 必医治
  rationale: 保留动词“医治”的直接意义，并以“必”体现预言性语境中的将来指向。
- source_word: እግዚአብሔር
  choice: 上主
  rationale: 采用庄重而通行的神名表达，不额外引入原文没有明确标示的专名形式。
- source_word: ለገብርቲሁ
  choice: 他的仆人
  rationale: 准确保留第三人称领属关系及复数含义。
- source_word: ወይትነሥኡ
  choice: 他们必起来
  rationale: 直译其起身、兴起之义；不擅自解释为复活或政治崛起，以保留语义张力。
- source_word: ሰላመ፡ ዐቢየ
  choice: 大平安
  rationale: 保留名词“平安”及形容词“大的”所表达的强度。
- source_word: ወይሰድዱ
  choice: 并赶逐
  rationale: 传达驱赶、逐出的动作力度，较“击败”更贴近源词，也不增加杀戮含义。
- source_word: ወያአኵቱ
  choice: 献上感谢
  rationale: 以自然庄重的汉语表达感谢、称谢之意，同时不把对象补明，以免超出原文。
- source_word: እስከ፡ ለዓለመ፡ ዓለም
  choice: 直到永永远远
  rationale: 保留强化的永久表达及“直到”的延续意味。
- source_word: በፍሥሐ
  choice: 欢欢喜喜
  rationale: 将末尾的“以喜乐”自然融入谓语表达，同时保留强烈喜悦的色彩。
theological_decisions:
- issue: “起来”的含义
  choice: 保留为“起来”
  alternative: 复活／重新兴起
  rationale: 源文自身未明确限定为身体复活、民族复兴或一般起身，因此不在译文中消解歧义。
- issue: 神名的呈现
  choice: 上主
  alternative: 耶和华／主
  rationale: 以庄严、易懂且不依赖特定宗派习惯的称谓表达 እግዚአብሔር。
- issue: 义人所“看见”的宾语
  choice: 不补出宾语
  alternative: 义人必看见这一切
  rationale: 原文仅写“义人必看见”，宾语可能由上下文领会；不擅自补足可保留原文的省略结构。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的简体中文。以两个主要句群呈现原文连续并列结构，减少机械重复的连接词，同时保留预言语气、动作次序以及末尾永恒喜乐的强调。
