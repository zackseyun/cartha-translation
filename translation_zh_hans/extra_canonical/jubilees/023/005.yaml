  language: zh_hans
  text: 以撒俯伏在他父亲的脸上，哭了，又亲吻他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወድቀ
  choice: 伏在
  rationale: 原义为“落下、俯伏”；在临终哀恸的语境中，“伏在”既保留身体动作，也比直译“倒在”更自然。
- source_word: ውስተ፡ ገጹ፡ አቡሁ
  choice: 在父亲脸上
  rationale: 按原文介词与名词结构直译，保留“脸”这一具体身体意象，不改写为较笼统的“伏在父亲身上”。
- source_word: ወበከየ
  choice: 哭泣着
  rationale: 表达持续或伴随的哀哭，并使三个连续动作在现代汉语中衔接自然。
- source_word: ወሰዐሞ
  choice: 亲吻他
  rationale: 该动词意为“亲吻”；宾语依上下文指以撒的父亲，译作“他”避免重复而不增添解释。
