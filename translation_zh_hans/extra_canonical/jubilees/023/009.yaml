  yaml_path: translation/extra_canonical/jubilees/023/009.yaml
  text: And he lived three jubilees and four weeks of years, one hundred and seventy-five years, and he completed the days of his life, old and full of days.
translation:
  language: zh_hans
  text: 他活了三个禧年和四个七年期，共一百七十五年；他度尽了一生的岁月，年迈而日子满足。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልው
  choice: 禧年
  rationale: 指《禧年书》以四十九年为周期的计年单位；采用现代中文圣经及相关文献中通行的术语。
- source_word: ሱባዔ፡ ዓመተ
  choice: 七年期
  rationale: 字面为“一组七年”，译作“七年期”既保留历法结构，又避免被误解为普通的一周。
- source_word: ወፈጸመ፡ መዋዕለ፡ ሕይወቱ
  choice: 他度尽了一生的岁月
  rationale: 保留“完成其生命之日”的语义，同时采用自然、庄重的现代汉语。
- source_word: አሂቅ፡ ወፍጹመ፡ መዋዕለ
  choice: 年迈而寿数满足
  rationale: 反映“年老且日子充足”的传统寿终表达；“寿数满足”保留原文意象而不扩充为额外神学判断。
