revisions:
- from: 他必煽动列国中的罪人起来攻击他们；这些人对他们毫无怜悯和同情，对老人、少年或任何人都不施恩，因为他们邪恶而强暴，行恶胜过所有世人。
  to: 他必兴起列国中的罪人来攻击他们；这些人对他们毫无怜悯和同情，也不顾老人、少年或任何人的情面，因为他们邪恶而强大，行恶胜过所有世人。
  rationale: 修订仅校正三个语义层面：以“兴起”避免将使其发动的方式限定为“煽动”；以“不顾……情面”表达不偏待；以“强大”保留力量而不额外增添“暴虐”的词义。其余句法、代词指向和比较结构均予保留。
  reviewer_model: gpt-5.6-terra
