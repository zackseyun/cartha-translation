base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/024.yaml
  text: And he will stir up against them the sinners of the nations, who have no mercy or compassion for them, and who show no favor to old or young, to no one at all; for they are evil and strong, so as to do evil more than all the sons of men.
translation:
  language: zh_hans
  text: 他必兴起列国中的罪人来攻击他们；这些人对他们毫无怜悯和同情，也不顾老人、少年或任何人的情面，因为他们邪恶而强大，行恶胜过所有世人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወያነቅህ፡ ላዕሌሆሙ
  choice: 他必煽动……起来攻击他们
  rationale: 动词表示激起、唤起；结合介词“在他们之上／反对他们”，译作“煽动……起来攻击他们”自然表达敌对行动。
- source_word: ኃጥአኒሆሙ፡ ለአሕዛብ
  choice: 列国中的罪人
  rationale: 保留“罪人”这一道德与宗教色彩，并将属格关系自然译为“列国中的”。
- source_word: ምሕረተ፡ ወሣህለ
  choice: 怜悯和同情
  rationale: 两个近义名词并列，分别传达怜悯与慈悯／体恤之意，保留原文的强调。
- source_word: ኢያደልዉ
  choice: 不施恩
  rationale: 该词在此指不偏爱、不优待或不予恩待；“不施恩”既简洁，也与后面的各类对象相接。
- source_word: አሰልሂቅ፡ ወኢለወሬዛ፡ ወኢለመኑሂ
  choice: 对老人、少年或任何人
  rationale: 依次保留年龄两端及概括性对象，表达无人能获优待。
- source_word: እኩያን፡ ወኀያላን
  choice: 邪恶而强暴
  rationale: 前词为邪恶，后词基本义为强有力；语境描述残酷施害者，故用“强暴”呈现力量与暴虐色彩，同时不把它误解成单纯的身体强壮。
- source_word: ይእከዩ፡ እምኵሉ፡ ውሉደ፡ ሰብእ
  choice: 行恶胜过所有世人
  rationale: 保留比较结构；“人之众子”按现代汉语惯用表达译为“世人”。
theological_decisions:
- issue: 煽动者“他”的身份
  choice: 保留代词“他”，不在正文中明确其身份
  alternative: 译成“上帝必煽动”
  rationale: 本节原文仅有第三人称单数主语；补明身份会消除由上下文承担的指代关系。
- issue: “罪人”的性质
  choice: 直译为“罪人”
  alternative: 译为“恶人”或“犯罪之民”
  rationale: “罪人”保留原文明确的道德—宗教判断，又不额外限定其罪行类型。
- issue: 施害者的强力特征
  choice: 译为“强暴”
  alternative: 译为“强大”
  rationale: 本节将其力量直接用于超乎众人的作恶；“强暴”较能呈现语境中的暴虐性，但仍不增添具体神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式保留原文递进：兴起敌人、毫无怜悯、不分对象、最后说明其邪恶强暴。正文无脚注，因此无脚注标记。
