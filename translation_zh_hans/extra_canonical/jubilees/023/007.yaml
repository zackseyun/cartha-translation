  text: And his sons Isaac and Ishmael buried him in the double cave, near Sarah his wife.
translation:
  language: zh_hans
  text: 他的儿子以撒和以实玛利把他安葬在麦比拉洞里，靠近他的妻子撒拉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “麦比拉洞”原文直译为“双重的洞”或“双洞”。
    reason: 保留原文地名表达所含的字面意义及潜在歧义。
lexical_decisions:
- source_word: ቀበርዎ
  choice: 把他安葬
  rationale: 该动词表示埋葬死者；“安葬”符合现代中文经文语体，并保留宾语代词“他”。
- source_word: በዓተ፡ ካዕበት
  choice: 麦比拉洞
  rationale: 字面可理解为“双重的洞”；此处对应亚伯拉罕安葬于撒拉附近的传统地点，采用现代中文读者熟悉的专名“麦比拉洞”，并以脚注保留字面意义。
- source_word: ቅሩበ
  choice: 靠近
  rationale: 直接表达空间上的邻近关系，不额外推定是在同一墓穴或紧挨遗体。
- source_word: ብእሲቱ
  choice: 他的妻子
  rationale: 准确表达撒拉与被安葬者的婚姻关系。
- source_word: ውሉዱ፡ ይስሐቅ፡ ወእስማዔል
  choice: 他的儿子以撒和以实玛利
  rationale: 原文将主语置于句末；中文前置主语更自然，且人物及其施事角色清楚。
theological_decisions:
- issue: “双重的洞”是普通描述还是地名
  choice: 正文译作专名“麦比拉洞”
  alternative: “双洞”或“双重的洞穴”
  rationale: 上下文所述为亚伯拉罕葬在妻子撒拉附近，与创世记中的麦比拉洞相符；但原词表面仍有“双重”之义，因此在脚注说明，避免掩盖词形。
- issue: 以撒和以实玛利是否为埋葬者
  choice: 明确作为句子主语
  alternative: 保留原文后置结构：“他们把他安葬……；他的儿子以撒和以实玛利”
  rationale: 原文末尾名词短语自然标明施事者；中文前置不改变意义，也避免代词指向含混。
translation_notes:
  register: 采用现代、庄重而自然的叙事语体。将原文句末主语前置，以符合普通话语序；不增添原文未明说的仪式或墓穴细节。
