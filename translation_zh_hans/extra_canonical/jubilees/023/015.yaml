  text: And all this will come upon an evil generation which sins on the earth; their deeds are uncleanness and fornication and impurity and abomination.
translation:
  language: zh_hans
  text: 这一切都必临到一个在地上犯罪的邪恶世代；他们所行的是污秽、淫乱、不洁和可憎之事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመጽእ
  choice: 必临到
  rationale: 表达“来到、临及”的将来意义；“临到”自然地体现灾祸落在该世代身上。
- source_word: ትኤብስ
  choice: 犯罪
  rationale: 按该动词“犯罪、违犯”的意义翻译，不误作“玷污”。
- source_word: በምድር
  choice: 在地上
  rationale: 保留介词短语的地点意义，而不把“地”处理为动词的宾语。
- source_word: ርኵስ
  choice: 污秽
  rationale: 对应礼仪或道德层面的污秽，并与后面的“不洁”保持词项区分。
- source_word: ዝሙት
  choice: 淫乱
  rationale: 准确表达不正当性行为这一含义，语体庄重且通行。
- source_word: ገማኔ
  choice: 不洁
  rationale: 保留与“污秽”并列而意义相近的独立词项，不擅自合并。
- source_word: ሳቀራር
  choice: 可憎之事
  rationale: 以自然汉语表达“可憎、令人厌恶之物/行为”，并适应行为清单的语境。
- source_word: ገብርሙ
  choice: 他们所行的是
  rationale: 体现“他们的行为/作为”的独立分句功能，使整列恶行都受其统摄。
theological_decisions:
- issue: 罪恶清单与“他们的行为”之间的句法关系
  choice: 将整列译为“他们所行的是污秽、淫乱、不洁和可憎之事”
  alternative: 译作“以污秽、淫乱、不洁和可憎之事玷污大地”
  rationale: 原文先说该世代“在地上犯罪”，随后以“他们的行为”统摄整个罪恶清单；不应合并成“玷污大地”的单一从句。
- issue: “污秽”与“不洁”的近义并列
  choice: 保留两个独立词项
  alternative: 合并为一个词或改写以消除重复
  rationale: 原文有两个相近而不同的词，保留并列可维持其修辞力度与可能的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“邪恶世代”“临到”保留经文语感；分号清楚标示两个相连但有区别的分句。
