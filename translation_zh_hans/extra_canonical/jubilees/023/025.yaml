  terminology: 将“得罪雅各”改为“向雅各犯罪”，更明确对应“sin against Jacob”，也避免“得罪”在现代汉语中可仅指冒犯人的较弱含义。“暴行”比“暴虐”更直接对应此处的暴力行为。
