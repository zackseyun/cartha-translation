  yaml_path: translation/extra_canonical/jubilees/023/025.yaml
  text: And they will commit violence in Israel and sin against Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.
translation:
  language: zh_hans
  text: 他们必在以色列中施行暴行，并向雅各犯罪a；大量的血必倾流在地上；无人收殓，也无人埋葬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀከከ
  choice: 暴虐
  rationale: 该词在此指伤害、压迫或暴力行为；“施行暴虐”既保留原文力度，也符合庄重而自然的现代汉语。
- source_word: ዐበሳ
  choice: 得罪
  rationale: 此词表达犯罪、冒犯；与介词ዲበ连用时译作“得罪雅各”，自然体现针对雅各的冒犯，而不将其弱化为仅仅发生在雅各之中。
- source_word: ይትከዐው
  choice: 流
  rationale: 在“许多血”这一语境中表示血被倾倒、流出；汉语以“血必流在地上”表达最自然，并保留被动事件的灾难性。
- source_word: ያስተጋብእ
  choice: 收殓
  rationale: 原义为聚集、收集；在无人掩埋死者的上下文中，指收集或收殓尸身。“收殓”能与后面的“埋葬”区分，同时清楚传达语境含义。
- source_word: ይቀብር
  choice: 埋葬
  rationale: 直接表示埋葬，采用现代标准汉语的常用庄重表达。
theological_decisions:
- issue: “雅各”前介词ዲበ的关系
  choice: 得罪雅各
  alternative: 在雅各中犯罪
  rationale: 原文先用ውስተ表达“在以色列中”，随后改用ዲበ（在……之上、针对……）；译为“得罪雅各”保留介词变化及针对性，不把两个短语同质化。
- issue: “许多血”的汉语表达
  choice: 许多人的血
  alternative: 许多血
  rationale: 汉语通常不说“许多血”；补出“人的”是语义上隐含且不改变指向的自然化处理，也清楚呈现大量死亡的含义。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。前两分句保留“以色列”与“雅各”的平行及介词差异；末句以“收殓—埋葬”呈现无人处理死者遗体的递进关系。
