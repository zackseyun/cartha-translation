base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/014.yaml
  text: 'For blow upon blow, and wound upon wound, and distress upon distress, and evil report upon evil report, and sickness upon sickness, and every evil like these, one with another: disease and collapse and frost and hail and snow and fever and chills and stupor and famine and death and sword and captivity and every affliction and sickness.'
translation:
  language: zh_hans
  text: 因为打击接连打击，创伤接连创伤，困苦接连困苦，恶讯接连恶讯，疾病接连疾病；诸如此类的灾祸，彼此相继而来：病患、崩溃、霜冻、冰雹、降雪、发热、寒战、昏沉、饥荒、死亡、刀剑、被掳，以及各种灾难和疾病。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት
  choice: 打击／灾难
  rationale: 此词在首句的递进结构中译作“打击”，末尾概括时按语境译作“灾难”，兼顾其击打、灾祸的语义范围。
- source_word: ቍስላን
  choice: 创伤
  rationale: 表示伤口或创伤；“创伤”适合与“接连”搭配，并保留身体受创之义。
- source_word: ምንዳቤ
  choice: 困苦
  rationale: 涵盖患难、窘迫或痛苦，不把含义限缩为单一情绪。
- source_word: ስምዐት እኩይ
  choice: 恶讯
  rationale: 直译为“坏的消息／听闻”；“恶讯”自然而凝练。
- source_word: ደዌ / ሕማም
  choice: 疾病／病患
  rationale: 二词均属疾病语域；在重复句与灾祸清单中稍作词汇变化，同时不强行区分具体病种。
- source_word: ጕፍጥአት
  choice: 倒毙
  rationale: 该罕见词语义并不完全确定；依传统译文所反映的倒下、崩倒之义，采用“倒毙”，并保留灾难性身体崩溃的色彩。
- source_word: አስሕትያ
  choice: 霜冻
  rationale: 按寒冷灾害语境理解为霜或严寒造成的冻害。
- source_word: በረድ
  choice: 冰雹
  rationale: 常见义为冰雹；与随后“降雪”区分。
- source_word: ሐመዳ
  choice: 降雪
  rationale: 在天气灾害并列中取“雪”义；用“降雪”使汉语清单自然。
- source_word: ስክሕካሕ
  choice: 寒战
  rationale: 按身体因寒冷或发热而颤抖理解，与前项“发热”形成合理并列。
- source_word: ሰምዛዝ
  choice: 昏沉
  rationale: 表示麻木、迟钝或昏迷一类状态；“昏沉”避免过度确定为完全失去意识。
- source_word: ዐባር
  choice: 饥荒
  rationale: 按灾祸清单中的饥馑义翻译。
- source_word: መጥባሕት
  choice: 刀剑
  rationale: 在“死亡”与“被掳”之间指由刀剑造成的杀戮；采用圣经文体中自然且不过度解释的“刀剑”。
- source_word: ፂዋዌ
  choice: 被掳
  rationale: 表示俘虏或囚禁状态；“被掳”准确呈现受动意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文层层重复的修辞，以“接连”传达“……之上又……”的累积感；将“ዝንቱ ምስለ ዝንቱ”译为“一个接着一个”，不遗漏原文灾祸清单。罕见词按上下文谨慎处理，避免加入宗派性或神学性解释。
