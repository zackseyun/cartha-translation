  - severity: low
    issue: “这一切同类的灾祸，一个接着一个”措辞稍不自然。
    rationale: 可改为“诸如此类的灾祸，彼此相继而来”，更符合现代汉语，并对应“every evil like these, one with another”的并发、累积感。
