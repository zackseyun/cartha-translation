  rationale: 将“像冰一样”改为“像冰雹一样”，以保留原文的具体比喻；将“喊道”“答话”分别收束为“说”“说话”，更贴近原文而不损害汉语叙事的通顺。末句明确指出亚伯拉罕，避免代词指向不清。
