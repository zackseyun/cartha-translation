  text: And Jacob awoke from his sleep, and behold, Abraham had grown cold as ice; and he said, “Father, father!” But there was no one speaking, and he knew that he had died.
translation:
  language: zh_hans
  text: 雅各从睡梦中醒来，看哪，亚伯拉罕已经冷得像冰雹一样；他便说：“父亲，父亲！”却没有人说话，他便知道亚伯拉罕已经死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነቅሀ፡ ያዕቆብ፡ እምንዋሙ፡
  choice: 雅各从睡梦中醒来
  rationale: 按词义和汉语自然语序表达“雅各从他的睡眠中醒来”；“睡梦”较“睡眠”更适合叙事语体。
- source_word: ወናሁ፡
  choice: 看哪
  rationale: 保留原文提示读者注意突发情景的叙事标记，而不弱化为普通连接词。
- source_word: ቈረ፡ አብርሃም፡ ከመ፡ ባረድ፡
  choice: 亚伯拉罕已经冷得像冰一样
  rationale: 原文明确含比较结构“像冰雹/冰一般”；用“冰”呈现尸体冰冷的直观含义，并以“已经”体现雅各醒来时发现的状态。
- source_word: ወይቤ፡ *አባ፡ አባ፡
  choice: 他就喊道：“父亲！父亲！”
  rationale: ይቤ 基本义为“说”，但重复呼唤父亲的语境带有急切呼喊意味；“喊道”在现代汉语中自然传达这一语用力度。
- source_word: ወአልቦ፡ ዘነበበ፡
  choice: 却没有人答话
  rationale: 字面近于“没有说话的人”；在呼唤之后，汉语用“没有人答话”准确表达没有回应。
- source_word: ወአእመረ፡ ከመ፡ ሞተ።
  choice: 他便知道亚伯拉罕已经死了
  rationale: 补出汉语所需的指称对象“亚伯拉罕”，避免末句两个“他”产生歧义；完成体用“已经……了”自然呈现死亡事实。
theological_decisions: []
