  text: And the LORD appeared to him and said to him, "Do not go down to Egypt. Dwell in the land that I tell you, and sojourn in that land, and I will be with you and bless you. For to you
translation:
  language: zh_hans
  text: 主向他显现，对他说：“不要下到埃及去。要住在我要告诉你的那地，并在那地寄居；我必与你同在，赐福给你。因为给你……[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语原文在“因为给你”之后中断，本句未完。
    reason: 明确说明来源文本的截断状态，避免读者误以为中文漏译，同时不擅自补足缺文。
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 主
  rationale: 该词在吉兹语中是对上帝的尊称“主”；译作“主”既贴近现存文本，也避免在无希伯来底本证据时直接还原为神名。
- source_word: ኢትረድ፡ ግብጸ
  choice: 不要下到埃及去
  rationale: 保留“下去”的空间动词及禁止语气，符合汉语圣经叙事的自然表达。
- source_word: ንበር
  choice: 住
  rationale: 表达定居、居住之意，并与下文表示寄居的动词区别开来。
- source_word: ፍልስ
  choice: 寄居
  rationale: 该词指作为异乡人暂住；“寄居”准确保留其非永久定居的含义和庄重语体。
- source_word: ይእቲ፡ ምድር
  choice: 那地
  rationale: 依原文指示词译为“那地”，不改作“这地”。
- source_word: እስመ፡ ለከ
  choice: 因为给你……
  rationale: 现提供的原文在“因为／由于，给你”处中断；保留未完成的句法，不擅自补入后续内容。
theological_decisions:
- issue: 神圣称谓的翻译
  choice: 主
  alternative: 耶和华
  rationale: 吉兹语现存文本使用称谓እግዚአብሔር，而非可直接辨认为四字神名的形式；因此采用“主”，不作超出文本证据的还原。
- issue: 残缺句是否据平行经文补全
  choice: 不补全，以省略号和脚注标明中断
  alternative: 参照《创世记》26:3等平行材料补写应许内容
  rationale: 本任务所给原文确实止于“因为给你”，擅自依据平行经文补写会掩盖当前来源的残缺，并可能引入不属于本节所给文本的措辞。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“住”与“寄居”分别对应两个不同动词，以保存语义对照；引号内以分号划分连续命令与应许。
