  text: And in the first year of the fourth week a famine came upon the land, besides the former famine that had been in the days of Abraham.
translation:
  language: zh_hans
  text: 第四个七年周期的第一年，一场饥荒临到这地；这场饥荒不同于亚伯拉罕日子里曾有过的那场饥荒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年周期
  rationale: 该词在《禧年书》的年代体系中指由七年组成的周期；译作“七年周期”比单独译作“周”更能让现代读者明白。
- source_word: ጸንከ
  choice: 发生了
  rationale: 依本节语境表达饥荒临到或加于地上的意思，中文用“发生了饥荒”自然且不增添因果解释。
- source_word: ዐባር
  choice: 饥荒
  rationale: 按上下文及古代译本传统，此处所指为临到土地的饥荒。
theological_decisions:
- issue: 本次饥荒与亚伯拉罕时代饥荒的关系
  choice: 在此以前……也曾有过一次饥荒
  alternative: 除了亚伯拉罕时代先前的饥荒以外
  rationale: 原句作比较并区分两次饥荒；采用自然中文保持历史关联，不暗示两场饥荒同时存在，也不赋予额外神学因果。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“第四个七年周期”保留《禧年书》特有的纪年方式；后半句调整为自然汉语语序，同时保持原文对亚伯拉罕时代先前饥荒的回顾。
