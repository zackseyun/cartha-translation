  yaml_path: translation/extra_canonical/jubilees/024/007.yaml
  text: And Jacob grew up, and kept the command of his father, but Esau rejected it. And there was famine upon the land, and he came
translation:
  language: zh_hans
  text: 雅各长大后，遵守父亲的命令；以扫却拒绝了。[a]那地发生了饥荒，他便来到……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给吉兹文的电子文本在这里有讹误；Charles 1895校正读文为“遵守他父亲的命令，以扫却拒绝了”。
    reason: 说明关键底本文本校勘，因为未经校正的OCR会造成相反或残缺的译意。
  - marker: b
    text: 本节所给原文在“他便来到”处中断；主语和目的地可由下文进一步说明，这里不予补出。
    reason: 保留原文边界、代词含混和未完成句式。
lexical_decisions:
- source_word: አህቀ
  choice: 长大
  rationale: 该动词在此表示成长、达到成年阶段，并非地位或权势上“变得伟大”。
- source_word: ኀለወ
  choice: 遵守
  rationale: 该动词有守住、谨守、遵行之意，与后面的“命令”自然搭配。
- source_word: ትእዛዘ
  choice: 命令
  rationale: 直译其“命令、吩咐”之义，保持父子关系中的权威语气。
- source_word: ዐበየ
  choice: 拒绝了
  rationale: 在经校正的读文中，此词描述以扫拒绝父命；译作“拒绝”比含混的“离开”更符合词义与句法对比。
- source_word: ዐባር
  choice: 饥荒
  rationale: 表示土地上的饥荒，采用现代汉语中常见且庄重的圣经叙事用语。
- source_word: መጽአ
  choice: 来到
  rationale: 保留“来、来到”的基本方向义；因本节所给原文止于此处，不补出目的地。
theological_decisions:
- issue: 雅各与以扫对父命的不同回应
  choice: 明确译为雅各遵守、以扫拒绝
  alternative: 译为雅各离开父亲的命令，或不点明以扫
  rationale: Charles 1895 的经校正读文包含“他父亲”及“以扫却拒绝”的对照；这样既符合词义，也避免因OCR讹误而颠倒叙事中的伦理与神学对比。
- issue: 末句主语及未完成结构
  choice: 保留代词“他”并以省略号显示句子未完
  alternative: 补明为“以撒”并加入目的地
  rationale: 当前所给原文只有第三人称单数动词且在“来到”后截断；不根据后续上下文擅自补足，可保留原始片段的含混与边界。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“长大后”自然表达成长阶段；分号突出雅各与以扫的对照。“那地发生了饥荒”避免过度古雅；末尾省略号忠实呈现所给原文的截断。
