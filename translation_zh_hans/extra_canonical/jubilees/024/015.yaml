  text: among the Philistines and reaped a hundredfold. And Isaac became very great, and the Philistines envied him. And all the wells that the servants of Abraham had dug during Abraham's lifetime, the Philistines stopped up.
translation:
  language: zh_hans
  text: 在非利士人中，他收获了百倍。以撒越发昌盛，非利士人就嫉妒他。亚伯拉罕在世时，他的仆人所挖的一切井，非利士人都堵住了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስዊተ፡ ወዐብየ፡
  choice: 收获了百倍
  rationale: 原文表达百倍的收成；结合本节承接上文的片段结构，译为自然简明的现代汉语。
- source_word: ዐብየ፡ ይስሐቅ፡ ፈድፋደ፡
  choice: 以撒越发昌盛
  rationale: 直义为以撒大大地壮大；“昌盛”可涵盖财富、势力和地位的增长，而不擅自限定为单一方面。
- source_word: ቀንኡ፡ ላዕሌሁ፡
  choice: 嫉妒他
  rationale: 准确表达非利士人因以撒昌盛而产生的嫉妒。
- source_word: ደፈንዎ፡
  choice: 都堵住了
  rationale: 指把先前挖成的井填塞、封堵；“堵住”符合现代汉语叙事习惯。
