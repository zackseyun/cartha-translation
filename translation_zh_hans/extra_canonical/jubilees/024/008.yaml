  naturalness: 修订后句子保持庄重、自然的现代书面汉语。“正要下埃及去”清楚表达未完成式的未实现／趋向性；以分号连接后句，可避免将原文简单的“和／于是”过度解释为“却”。
  terminology: “以撒”“埃及”“非利士人”“亚比米勒”均合乎现代中文圣经常用译名。“基拉耳”是 Gerar 在简体中文圣经传统中较通行的译名。年代术语译为“七年期”并以脚注说明，准确且便于现代读者理解。
