base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/008.yaml
  text: Isaac was going to go down to Egypt in the second year of this week, and he went to Gerar, to Abimelech king of the Philistines.
translation:
  language: zh_hans
  text: 以撒在这个七年期[b]的第二年正要下埃及去[a]；后来他去了基拉耳，到非利士人的王亚比米勒那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“动身要下埃及去”。
    reason: 原文动词可表达意向或开始行动；两种译法都不表示以撒已经抵达埃及。
  - marker: b
    text: 直译：“这个周”；这里的“周”指一个七年期。
    reason: 说明原文年代术语及其指示词，避免将其误解为普通的七天一周或改译成原文未明说的序数。
lexical_decisions:
- source_word: ይረድ
  choice: 正要下……去
  rationale: 该未完成式在这里表示意向或即将发生的行动；上下文随即说以撒去了基拉，因此不译成已经完成的“下到埃及”。
- source_word: ግብጸ
  choice: 埃及
  rationale: 标准地名译法；与方向动词连用时采用现代汉语自然表达“下埃及去”。
- source_word: በካልእ፡ ዓመት፡ ዘዝ፡ ሱባዔ
  choice: 在这个七年期的第二年
  rationale: 逐项保留“第二年”和指示词“这个”；ሱባዔ在《禧年书》的年代计算中指由七年构成的周期，译作“七年期”比单独的“周”更清楚。
- source_word: ወሖረ
  choice: 后来却去了
  rationale: 动词是已完成的“去”；连接词本义为“和/于是”，但汉语用“后来却”自然呈现前一意向与实际去向的转折，同时不声称以撒已进入埃及。
- source_word: ጌራርገ
  choice: 基拉
  rationale: 采用该地名通行的简体中文圣经译名。
- source_word: አቤሜሌክ
  choice: 亚比米勒
  rationale: 采用该人名通行的简体中文圣经译名。
theological_decisions:
- issue: 以撒是否实际下到埃及
  choice: 译为“正要下埃及去”，表示意向而非已完成行动
  alternative: “下到埃及去了”
  rationale: 原文未完成式及后续前往基拉的叙述支持意向或即将行动的读法；完成式译法会造成以撒已经抵达埃及的叙事印象。
- issue: 年代单位中的指示词
  choice: “这个七年期”
  alternative: “第六个七年期”
  rationale: 原文明确使用“这个”，并未在本节写出“第六”；不以语境推算结果替换原文措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正要”准确保留未完成式所表达的意向；“后来却”使两次行动的关系在汉语中清楚，但不增添以撒进入埃及的含义。人名、地名沿用简体中文圣经常见译名。
