  yaml_path: translation/extra_canonical/jubilees/024/003.yaml
  text: And Jacob cooked lentil stew, and Esau came from the field hungry. And he said to Jacob his brother, "Give me some of this wheat stew." And Jacob said to him, "Sell me your firstborn birthright."
translation:
  language: zh_hans
  text: 雅各煮了扁豆汤。以扫从田野来，饿了，就对他的兄弟雅各说：“给我一点这麦子汤[a]。”雅各对他说：“把你长子的名分卖给我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“麦子汤”；前一句则说雅各煮的是扁豆汤。
    reason: 说明原文内部真实存在的“扁豆”与“麦子”之别，避免按熟悉的平行叙事将二者协调为同一种食物。
lexical_decisions:
- source_word: ተብሰለ፡ ብርስን
  choice: 煮了扁豆汤
  rationale: ብርስን 指扁豆；用“汤”自然表达煮成的浓汤或羹，不额外加入原文没有明确表达的“红色”。
- source_word: ርኁብ
  choice: 饥饿难忍
  rationale: 表达以扫从田野回来时处于饥饿状态；较单纯“饿了”更符合叙事语气，同时不加入“疲乏”等其他概念。
- source_word: ተብሰል፡ ዘሥርናይ
  choice: 麦子汤
  rationale: ሥርናይ 通常指小麦；保留本句与前文“扁豆汤”不一致的文本现象，不按熟悉的平行经文加以协调。
- source_word: ልህቃኒከ፡ ዘቅድመ፡ ልደት
  choice: 你长子的名分
  rationale: 该短语指因首先出生而有的长子身份或权利；现代汉语惯用“长子的名分”，并避免误把 ዘቅድመ 解释成时间副词“先”。
theological_decisions:
- issue: 以扫所出售之物的性质
  choice: 长子的名分
  alternative: 长子的产业／长子所得的份
  rationale: 原文着重首先出生所具有的身份或权利，并未在此明确限定为产业份额；“名分”保留其身份与权利两方面的含义。
- issue: 是否协调“扁豆汤”与“麦子汤”
  choice: 保留二者差异
  alternative: 两处均译作“扁豆汤”
  rationale: 现存吉兹语正文第二处明确使用“小麦”一词；忠实呈现这一文本张力，不依据熟悉叙事或前句暗中改写。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“饥饿难忍”自然传达人物状态；对话简洁直接。脚注仅说明吉兹语正文中“扁豆”与“小麦”的差异，不替原文消解这一张力。
