  yaml_path: translation/extra_canonical/jubilees/024/001.yaml
  text: And it came to pass after Abraham died that the LORD blessed Isaac his son. And he rose up from Hebron and went and dwelt at the Well of the Vision[a] in the first year of the third week of this jubilee.
translation:
  language: zh_hans
  text: 亚伯拉罕死后，主赐福给他的儿子以撒。以撒从希伯仑动身，前往异象井[a]居住；那时是本禧年的第三个七年期的第一年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “异象井”按吉兹语地名字面翻译。它很可能就是《创世记》所记的相关地点，但正文没有补入其较完整的传统名称。
    reason: cross_reference
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 主
  rationale: 这是吉兹语中对上帝的常用尊称；译作“主”既符合原文表达，也避免在没有直接希伯来语文本证据时把神名形式补入正文。
- source_word: ዐዘቅተ፡ ራእይ
  choice: 异象井
  rationale: 按吉兹语字面保留“井”与“异象”两个组成部分，将其作为地名处理，不把《创世记》中较完整的传统地名直接移入正文。
- source_word: ሣልስ፡ ሱባዔ
  choice: 第三个七年期
  rationale: 此处“周”处于《禧年书》的年代计算语境，指七年为一期；译作“七年期”比现代汉语的“第三周”更准确清楚。
- source_word: ተንሥአ
  choice: 动身
  rationale: 该动词字面有“起来”之意，在从希伯仑迁往另一地点的叙事中自然表达为“动身”。
theological_decisions:
- issue: 神圣称谓是否译作“耶和华”
  choice: 主
  alternative: 耶和华
  rationale: 现存所给原文是吉兹语，其称谓本身不是四字神名的音译；“主”保留其称谓性质，不超出当前原文证据。
- issue: “他的儿子”所修饰的对象
  choice: 明确表达为“亚伯拉罕的儿子以撒”
  alternative: 保留可能暂时误读为“主的儿子”的线性词序
  rationale: 原句语法与叙事情境表明“他的儿子”指亚伯拉罕之子以撒；汉语若机械保留词序会造成原文没有的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“禧年”和“七年期”保留本书特有的年代框架；分号用来连接迁居事件与纪年说明。
