- from: '亚伯拉罕死后，非利士人用土填了那些井。亚比米勒对以撒说：“离开我们吧，因为你比我们强盛得多。”第七个七年的第一年，以撒从那里离开，在基拉耳谷安营。他们重新挖开他父亲亚伯拉罕的仆人从前所挖的水井；亚伯拉罕死后，非利士人曾把这些井堵住。他们仍照以撒的父亲亚伯拉罕所起的名字给这些井命名。


    以撒的仆人在河谷挖了一口井，找到了活水。基拉耳的牧人与以撒的牧人争执，说：“这水是我们的。”以撒就给那口井起名叫“争竞”，因为他们与我们争竞。他们又挖了一口井，双方也为那口井争吵，以撒便给它起名叫“敌对”。以撒从那里迁走，又挖了一口井；他们没有为这口井争吵，他就给它起名叫“宽阔之地”。以撒说：“如今耶和华为我们开拓了地方，我们必在这地繁衍。”


    第四十四个禧年的第一个七年的第一年，以撒从那里上到“誓约井”。那一夜，正月初现的黎明[a]，耶和华向他显现，对他说：“我是你父亲亚伯拉罕的上帝。不要惧怕，因为我与你同在；我要赐福给你，使你的后裔大大增多，如同地上的沙，因为亚伯拉罕是我的仆人。”以撒就在那里筑了一座祭坛，就是他父亲亚伯拉罕最先筑坛的地方。他求告耶和华的名，并向他父亲亚伯拉罕的上帝献祭。


    他们挖了一口井，找到了活水。以撒的仆人又挖了一口井，却没有找到水，便来告诉以撒没有找到水。以撒说：“今天我向非利士人起了誓，这事就临到我们了。”他给那地方起名叫“誓约井”，因为他在那里向亚比米勒、亚比米勒的同伴亚户撒和军队统帅非各起了誓。那一天，以撒明白自己是在胁迫之下起誓与他们讲和的。


    那一天，以撒咒诅非利士人，说：“愿非利士人在万族中受咒诅，遭受烈怒和愤恨！愿耶和华把他们交在犯罪的列国手中，就是交在基提人手中，使他们受羞辱、咒诅、烈怒和愤恨。那些逃脱仇敌和基提人刀剑的，愿一个公义的民族在审判中[a]把他们从天下铲除，因为他们世世代代都要在地上与我的子孙为敌，恨恶他们。在盛怒审判的日子，他们中间必没有一个余民，也没有一个逃脱的人。因为非利士人的一切后裔都注定要被毁灭、拔除，从地上消失；这些迦斐托人必不再有余民或后裔留在地上。


    “即使有人升到天上，也必从那里被拉下来；即使他潜入地下，也必从那里被拖走；即使他藏在列国中，也必从那里被拔除；即使他下到阴间，他在那里所受的审判也必加重，那里没有安宁留给他。即使他被掳去，寻索他性命的人也必在路上杀死他；全地必不再留下他的名和后裔，因为他必落入永远的咒诅。”


    关于非利士人的事，就这样写在天上的版上，并已定下：到审判之日，要如此待他们，把他们从地上铲除。'
