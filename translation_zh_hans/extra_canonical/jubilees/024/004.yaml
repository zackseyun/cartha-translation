- source_word: ተብሰለ፡ ብርስን
  choice: 扁豆汤
  rationale: 该词组指煮熟的扁豆食物；结合上下文译为自然的现代汉语“扁豆汤”，不额外加入原文没有的数量限定。
- source_word: እመውት
  choice: 我快要死了
  rationale: 保留以扫认为死亡迫近的语气，比直译为“我死”更符合此处未完成、临近发生的语境。
theological_decisions:
- issue: 以扫话语中死亡迫近的程度
  choice: 我快要死了
  alternative: 我就要死了／我要死了
  rationale: 原文表达可理解为死亡迫近；“快要死了”保留其强烈陈述，同时不进一步断定这是客观事实还是夸张之语。
