  text: By your seed all the nations of the earth will be covenant.[a] And now your father obeyed my voice and kept my charge and my commandments and my laws and my statutes and my covenant. And now, listen to my voice and dwell in this land." And he dwelt in Gerar three weeks of years. And Abimelech gave command concerning him
translation:
  language: zh_hans
  text: “地上万国都必因你的后裔得福，因为你父亲听从了我的话，谨守了我的吩咐、诫命、律法、条例和约。[a]现在，你也要听从我的话，住在这地。”于是，他在基拉耳住了三个七年。亚比米勒就他下令，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里连续列出“吩咐、诫命、律法、条例和约”五项；这些词的含义彼此有所重叠，译文仍按原文次序分别保留。
    reason: segmentation_note
lexical_decisions:
- source_word: በዘርእከ
  choice: 因你的后裔
  rationale: 介词短语直译为“在/借着你的后裔”略显生硬；结合祝福万国的语境，用“因你的后裔”自然表达媒介或缘由，同时保留“后裔”可作集合名词的含义。
- source_word: ኵሎሙ አሕዛበ ምድር
  choice: 地上万国
  rationale: 准确保留“地上的一切民族/列国”的普世范围，并采用现代中文圣经语体中自然、庄重的表达。
- source_word: ሰምዐ፡ አቡከ፡ ቃለ፡ ዚአየ
  choice: 你父亲听从了我的话
  rationale: “听”在此含顺服之意；译作“听从”比单纯“听见”更符合后续“谨守”的盟约顺服语境。
- source_word: ዑቃቤየ
  choice: 我的吩咐
  rationale: 指受托谨守之事或命令；以“吩咐”与后列“诫命、律法、条例”区分。
- source_word: ትእዛዛትየ
  choice: 诫命
  rationale: 保留复数命令的法律与盟约色彩。
- source_word: ሕገጊየ
  choice: 律法
  rationale: 单独译出该项，避免与相邻的“诫命”或“条例”合并。
- source_word: ሥርዐትየ
  choice: 条例
  rationale: 表达规定、制度或法令之意，并与“律法”保持词项区分。
- source_word: ኪዳንየ
  choice: 约
  rationale: 此词指立约关系或盟约；“我的约”简洁而具有传统盟约语义。
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመት
  choice: 三个七年
  rationale: 按《禧年书》的年代单位直译为三个由七年组成的周期，即二十一年；不直接换算，以保留原作纪年特色。
- source_word: ወአዘዘ፡ አቤሜሌክ፡ በእንቲአሁ
  choice: 亚比米勒为他的事下令
  rationale: 原句在本节末尾未完，保留开放式句法，以便与下节命令内容衔接。
theological_decisions:
- issue: 万国与后裔相关的祝福表述
  choice: 地上万国都必因你的后裔得福
  alternative: 地上万国都要以你的后裔为福／祝福自己
  rationale: 此处呼应创世记的应许传统。译作“得福”保留被动或结果性含义，不具体限定祝福如何临到，也不引入后世宗派性解释。
- issue: 父亲身份
  choice: 你父亲
  alternative: 亚伯拉罕
  rationale: 源文使用关系称谓而未在本句明说姓名；译文保留这一称谓，不擅自补名。
- issue: 法律词列的关系
  choice: 逐项保留“吩咐、诫命、律法、条例和约”
  alternative: 概括为“我的一切律法”
  rationale: 源文明确列出五个彼此重叠但不同的词项；逐项翻译可保留文本的密集性和盟约修辞，不人为消解差异。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与神谕语体。“听从”“谨守”“后裔”“约”等词保留经文的盟约色彩，但避免古奥句式。原节末句显然延续到下一节，因此以逗号收尾，不擅自补足亚比米勒命令的内容。
