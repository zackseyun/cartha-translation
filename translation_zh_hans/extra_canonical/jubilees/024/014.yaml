  text: 牛、羊、骆驼、驴和许多财物。他在那地撒种。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልህምተ
  choice: 牛
  rationale: 此处与羊、骆驼、驴并列，指牛类牲畜；用现代汉语常用总称“牛”。
- source_word: አባግዐ
  choice: 羊
  rationale: 指羊群；原文在此不要求区分绵羊与山羊，故保留较宽泛的“羊”。
- source_word: አግማለ
  choice: 骆驼
  rationale: 直接对应骆驼类牲畜。
- source_word: አእዱገ
  choice: 驴
  rationale: 直接对应驴类牲畜。
- source_word: ጥሪት
  choice: 财物
  rationale: 该词在牲畜清单之后概括其大量财产；译作“财物”既自然，也不把含义限缩为钱财。
- source_word: ዘርአ
  choice: 撒种
  rationale: 表示播种；“撒种”保留具体农业动作，并与“在那地”自然搭配。
- source_word: ምድረ
  choice: 那地
  rationale: 指叙事语境中的土地；依汉语表达补出指示成分“那”。
