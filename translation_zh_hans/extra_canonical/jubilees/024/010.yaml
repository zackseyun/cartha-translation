  text: And to your seed I will give all this land, and I will establish my oath that I swore to Abraham your father. And I will multiply your seed like the stars of heaven, and I will give to your seed all this land. And they will bless themselves
translation:
  language: zh_hans
  text: 我要把这一切土地赐给你的后裔，并坚立我向你父亲亚伯拉罕所起的誓。我要使你的后裔增多，如同天上的星辰；我要把这一切土地赐给你的后裔。他们必蒙福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必为自己求福。”本节所给原文到此为止；“地上万国”等字样不在这段原文中。
    reason: 保留末句动词可能具有的反身含义，并说明不应从相邻经文补入原文未载的主语。
lexical_decisions:
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: 该词可指种子、子孙或后裔；此处用于应许的承受者，译作“后裔”自然且保留集合性。
- source_word: አቀውም፡ መሐላየ
  choice: 坚立我……所起的誓
  rationale: አቀውም 表示使之确立、站立；“坚立”准确表达誓言得到确认，而非另起新誓。
- source_word: ከዋክብተ፡ ሰማይ
  choice: 天上的星辰
  rationale: 直译其比较意象，同时采用庄重而通顺的现代汉语。
- source_word: ይትባረኩ
  choice: 他们必蒙福
  rationale: 该形态可作被动或反身理解；正文采用自然的被动表达，并以脚注保留反身可能。
theological_decisions:
- issue: 末句祝福动词的语态
  choice: 他们必蒙福
  alternative: 他们必为自己求福
  rationale: 吉兹语形式容许被动或反身理解。正文不补入本节所给原文中没有出现的“地上万国”，避免用后续语境填补截断的句子；脚注保留另一种语态理解。
- issue: “后裔”的单复数张力
  choice: 采用集合名词“后裔”
  alternative: 子孙
  rationale: 原词可作集合性单数，汉语“后裔”既不强制限定单数个体，也不额外导入特定神学解释。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语；保留原文连续两次“把这一切土地赐给你的后裔”的重复，不作合并。
