base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/006.yaml
  text: '"Swear to me today." And he swore to him. And Jacob gave Esau his brother bread and stew, and he ate until he was satisfied. And Esau sold his birthright. Therefore his name was called Edom, because of the wheat stew that Jacob gave him in exchange for his birthright.'
translation:
  language: zh_hans
  text: “你今天向我起誓吧。”他就向雅各起了誓。雅各给他哥哥以扫饼和炖食；以扫吃了，直到饱足。以扫卖了自己的长子名分。因此，他得名以东，因为雅各用小麦做的炖食[a]换取了他的长子名分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节吉兹语原文作“用小麦做的炖食”；《创世记》25章的平行叙事通常译作“红豆汤”或“扁豆汤”。
    reason: 说明本节原文明确说炖食由小麦制成，并保留其与《创世记》平行叙事在材料描述上的差异。
lexical_decisions:
- source_word: መሐል፡ ሊተ፡ ዮም
  choice: 你今天向我起誓吧
  rationale: 按字面保留“向我”“今天”以及命令语气，同时使现代汉语自然。
- source_word: አኁሁ፡ ዔሳው
  choice: 他哥哥以扫
  rationale: አኁሁ 表示“他的兄弟”；依叙事关系，以扫是雅各的哥哥，译出亲属排行更符合汉语表达。
- source_word: ኅብስተ፡ ወተብሰለ
  choice: 饼和炖食
  rationale: 分别对应饼/食物与煮炖之物；不在首次出现时擅自补入原文未明说的材料。
- source_word: ወመጠ፡ ዔሳው፡ ቀዳሙ፡ ትውልዶ
  choice: 以扫卖了自己的长子名分
  rationale: 动词表示出售；ቀዳሙ ትውልዶ 指先出生者所享有的权利，即长子名分。
- source_word: ኤዶም
  choice: 以东
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: ተብሰለ፡ ስርናይ
  choice: 小麦炖食
  rationale: ስርናይ 明确指小麦；不受《创世记》平行叙事影响而改译为红豆或扁豆。
- source_word: በቅድመተ፡ ልደቱ
  choice: 换取了他的长子名分
  rationale: 介词结构在此表达交换关系；用“换取”清楚呈现雅各给炖食与取得长子名分之间的交易。
theological_decisions:
- issue: 以扫对长子名分所做之事
  choice: 卖了
  alternative: 轻看了／藐视了
  rationale: 本节吉兹语动词表达“出售”，不应借《创世记》相关措辞将其改成神学评价性的“轻看”。
- issue: 炖食的材料
  choice: 小麦
  alternative: 红扁豆
  rationale: 原文 ስርናይ 是“小麦”，且没有“红”一词；保留本书文本与《创世记》平行记载之间的差异。
- issue: “以东”得名的解释
  choice: 直接保留本节因小麦炖食而得名的陈述
  alternative: 补写“红”的双关解释
  rationale: 原文虽将“以东”之名与炖食相连，却未出现“红”字；不以平行经文补足或消解文本张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。对话简洁自然；叙事使用“起誓、饱足、长子名分”等普通读者熟悉且适合古代宗教文本的措辞。脚注标记[a]已置于正文对应词语之后。
