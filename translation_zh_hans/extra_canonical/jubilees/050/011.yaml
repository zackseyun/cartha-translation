  to: 惟有这项工作要在安息日，在耶和华你们上帝的圣所中进行：用常献的祭物为以色列赎罪，日复一日，作为在耶和华面前蒙悦纳的纪念；他必日复一日，永远悦纳他们，照着你所受的吩咐。
