base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/011.yaml
  text: This work alone shall be done on the sabbath days in the house of the sanctuary of the LORD your God, so that they may make atonement for Israel with a continual offering, day by day, as a memorial that is acceptable before the LORD, and he will receive them forever, day after day, according as you were commanded.
translation:
  language: zh_hans
  text: 惟有这项工作要在安息日，在耶和华你们上帝的圣所中进行：用常献的祭物为以色列赎罪，日复一日，作为在耶和华面前蒙悦纳的纪念；他必日复一日，永远悦纳他们，照着你所受的吩咐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘግብር፡ ባሕቲቱ
  choice: 惟有这项工作
  rationale: 保留ግብር“工作、事务”的名词含义，并以“惟有”表达ባሕቲቱ的排他性。
- source_word: ይትገበር
  choice: 可以……进行
  rationale: 该被动形式直译为“被做”；结合安息日准许事项的语境，用现代汉语表达为“可以进行”。
- source_word: በቤተ፡ መቅደሱ
  choice: 在……圣所中
  rationale: ቤተ መቅደስ指圣所或圣殿；此处不强行限定为后世特定建筑，译作“圣所”。
- source_word: ያስተስርዩ
  choice: 赎罪
  rationale: 使役复数形式表达“使得赎罪/施行赎罪”；汉语用祭祀语境中的惯用词“赎罪”。
- source_word: መባአ፡ ወትረ
  choice: 常献的祭物
  rationale: መባአ明确指祭物、供物，ወትረ表示持续、经常；译文避免遗漏“祭物”。
- source_word: ለተዝካር
  choice: 作为……纪念祭
  rationale: ተዝካር为纪念、记念之物；在献祭语境中译为“纪念祭”，使所指自然清楚。
- source_word: ዘይሠጠው
  choice: 蒙悦纳
  rationale: 按该词在此处“可接受、令人喜悦”的意义翻译，不误解为“被赐下”。
- source_word: ወይትወከፎሙ
  choice: 他必……悦纳他们
  rationale: 动词表示接纳、接受，宾语后缀为复数“他们”；保留由祭物转向献祭者群体的表达张力。
theological_decisions:
- issue: 安息日禁工与圣所礼仪的关系
  choice: 惟有这项工作可以在安息日……进行
  alternative: 这项工作本身要在安息日……完成
  rationale: 源文的“惟有”具有排他意味，语境是在一般禁工中准许圣所礼仪；译文明确例外，但不扩展为系统性的安息日教义。
- issue: 赎罪行动的施行者
  choice: 用常献的祭物为以色列赎罪
  alternative: 使他们用常献的祭物为以色列赎罪
  rationale: 源文动词为复数且带使役色彩，但本节未清楚点明主语。正文用汉语无主句保留开放性，避免擅自指定祭司或其他群体。
- issue: “悦纳他们”的指代
  choice: 他必永远悦纳他们
  alternative: 他必永远悦纳这些祭物
  rationale: 源文宾语为复数人称后缀，较自然地指向人群；译作“他们”，不把它消解为祭物，同时保留上下文可能存在的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。以“耶和华你们上帝”对应神名与所属关系；使用“圣所、祭物、赎罪、悦纳”等普通读者熟悉的礼仪词汇。重复“日复一日”以保存源文强调，不为求简洁而删去。
