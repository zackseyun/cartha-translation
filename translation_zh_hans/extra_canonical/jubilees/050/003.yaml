  text: And the land will keep its sabbaths while they dwell upon it, and they will know the year of the jubilee.
translation:
  language: zh_hans
  text: 他们住在那地之上时，那地必守自己的安息年；他们也必知道禧年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታበብት፡ ምድር፡ ሰንበታቲሃ
  choice: 那地必守自己的安息年
  rationale: 该短语直指土地遵守属于它的复数“安息”；结合土地安息与禧年的律法语境，用“安息年”比泛称“安息日”更自然准确，同时以“自己的”保留三人称阴性所有格。
- source_word: በነቢሮቶሙ፡ ዲቤሃ
  choice: 他们住在那地之上时
  rationale: 保留“他们居住”及“在其上”的空间关系；汉语以时间从句表达伴随情形，清楚自然。
- source_word: ወዓመተ፡ ለኢዮቤል፡ ያእምሩ
  choice: 他们也必知道禧年
  rationale: “ዓመተ”是“年”，“ኢዮቤል”是禧年，“ያእምሩ”表示他们将知道；不额外解释这种“知道”是计算、承认还是遵守，以保留原文宽度。
theological_decisions:
- issue: 土地“守安息”的主体性表达
  choice: 保留“那地必守自己的安息年”
  alternative: 他们必使那地守安息年
  rationale: 原文以“地”为语法主体；不改写为居民主动使土地休息，从而保留土地安息这一律法和神学意象。
- issue: “知道禧年”的含义
  choice: 直译为“知道禧年”
  alternative: 明白／计算／遵守禧年
  rationale: 原文动词本身未限定为计算或遵守；直译避免把某种具体实践预先写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“那地之上”略具书面色彩，用来贴近原文空间表达；分号呈现两个并列的未来陈述。
