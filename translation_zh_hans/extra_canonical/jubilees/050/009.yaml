base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/009.yaml
  text: You shall do no work at all on the Sabbath day except what you have prepared for yourselves on the sixth day, to eat and to drink and to rest and to keep Sabbath from all work on this day, and to bless the LORD your God, who has given you a day of festival and a holy day and a holy day of the kingdom for all Israel—this day throughout their days, throughout all days.
translation:
  language: zh_hans
  text: 在安息日，你们不可做任何工；除非是你们在第六日为自己预备的，为要吃喝、安歇，并在这日停止一切工作、守安息日。你们要称颂耶和华你们的上帝；他赐给你们节庆之日、圣日和国度的圣日[a]，归给全以色列；这日要在他们的年日中，在一切时日中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁国度之日”。
    reason: 原文此处的修饰关系可理解为“国度的圣日”，也可理解为“圣洁国度之日”；正文保留较自然的前一种理解。
  - marker: b
    text: 直译：“这日在他们的日子中，在所有日子中。”
    reason: 原文重复使用“日子／时日”，并非通常表示“世代”的词；脚注保留这一重复和其持续性。
lexical_decisions:
- source_word: ሰንበት
  choice: 安息日／守安息日
  rationale: 该词在本节既指特定日子，也出现在表示停止劳作、遵守安息的结构中；按汉语语境分别作名词和动词性表达。
- source_word: ዘአስተዳለውክምዎ
  choice: 为自己预备的食物
  rationale: 原文直指“你们为自己所预备的”，结合后接“吃喝”，补出“食物”使汉语自然，同时不把例外扩大为其他劳动。
- source_word: መንግሥት
  choice: 国度
  rationale: 保留“王国、王权、国度”之间的语义张力；正文采用现代宗教汉语较自然的“国度”，脚注列出另一可能。
- source_word: በመዋዕሊሆሙ
  choice: 贯穿他们的年日
  rationale: 按字面保留“在他们的日子中”，不改译为原文未明说的“世代”；“年日”比单说“日子”更能表达一生或延续的时日。
- source_word: በኵሉ፡ መዋዕል
  choice: 直到一切时日
  rationale: 尽量保留原文“在所有日子中”的重复和时间延展，不直接简化为“永远”。
theological_decisions:
- issue: “圣洁”修饰“日”还是“国度”
  choice: 国度的圣日
  alternative: 圣洁国度之日
  rationale: 原文的属格结构及阴性形态可产生关联范围上的张力；正文采用较顺畅、且与前面的“圣日”形成并列的读法，脚注保留“圣洁国度之日”。
- issue: 安息日例外的范围
  choice: 只可享用第六日为自己预备的食物
  alternative: 除了第六日为自己预备的以外，不可做任何工
  rationale: 后文“吃喝”表明例外关乎预先备妥之物；译文避免让人误解为第六日预备好的各类工作都可在安息日进行。
- issue: 末句是否明确译作“世世代代直到永远”
  choice: 贯穿他们的年日，直到一切时日
  alternative: 世世代代，直到永远
  rationale: 原文两次使用“日子／时日”，并未使用通常表示“世代”的词；保留其异常而有力的重复，不以传统公式替换。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华你们的上帝”保持经文称谓；“吃喝、安歇……守安息日，并称颂”保留原文连续的不定式目的链，但调整为汉语可读的祈使句。正文中的[a]、[b]与脚注完全对应。
