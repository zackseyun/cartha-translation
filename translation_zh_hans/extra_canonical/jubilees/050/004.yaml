base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/004.yaml
  text: 'Therefore I have ordained for you weeks of years and years and jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and forty years still remain for learning the commandments of the LORD, until they cross over into the land of Canaan crossing the Jordan to the west.'
translation:
  language: zh_hans
  text: 因此，我为你规定了年周、年和禧年：从亚当的日子直到今天，共四十九个禧年；尚有一个年周、两年和四十年，用来学习耶和华的诫命，直到他们渡过约旦河，向西进入迦南地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作：“直到他们渡过约旦河，进入迦南地。”源文末尾的方位短语可理解为修饰渡河的方向，或指约旦河／过境地点的西方位置。
    reason: 保留源文末尾方位短语的句法歧义，同时避免将“越过迦南地的边界”理解为越出迦南地。
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: 年周
  rationale: 直译为“年的七数”，在本节年代计算中指七年为一周；“年周”既简洁，也保留其历法术语性质。
- source_word: ኢዮቤሌዎታት
  choice: 禧年
  rationale: 采用现代中文圣经及相关古代犹太文献中通行的术语。
- source_word: ርሑቅ
  choice: 尚有
  rationale: 原词有“相距、尚远”之意；结合后续时间总数，以“尚有”自然表达距离该事件仍剩这些年数，而不把它误写成单纯空间距离。
- source_word: ለእእምሮ
  choice: 可以学习
  rationale: 字面涉及“知道、认识”；在“诫命”的语境中，“学习”自然表达这段时间用于认识并掌握诫命，同时避免擅自加入“遵守”。
- source_word: ማዕዶተ፡ ምድረ፡ ከናአን
  choice: 越过迦南地的边界
  rationale: 保留跨越、边界的空间意象，清楚表达进入迦南地。
- source_word: ገጸ፡ ዐረቢሁ
  choice: 向西
  rationale: 按“朝向其西面”理解，指渡过约旦河后朝西进入迦南；原句也可作位置性表达，故列脚注。
theological_decisions:
- issue: 神名 እግዚአብሔር 的译法
  choice: 耶和华
  alternative: 主
  rationale: 此处采用中文圣经叙事中常见的专名表达，以对应源文所指的以色列之神；不额外加入宗派性解释。
- issue: 学习诫命与遵守诫命的关系
  choice: 学习耶和华的诫命
  alternative: 认识耶和华的诫命
  rationale: 源文表达认识或知道，未明确写出“遵守”；译文不把实践层面的含义擅自补入，以保留原文措辞范围。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“年周”作为必要的历法术语保留，并通过上下文中的“一个年周、两年，再加四十年”呈现原文逐项列举的结构。末句保留两个跨越动作及方位信息，并以脚注说明句法歧义。
