- from: 因此，我为你规定了年周、年和禧年：从亚当的日子直到今天，共四十九个禧年；尚有一个年周、两年，再加四十年，可以学习耶和华的诫命，直到他们渡过约旦河，向西越过迦南地的边界。[a]
  to: 因此，我为你规定了年周、年和禧年：从亚当的日子直到今天，共四十九个禧年；尚有一个年周、两年和四十年，用来学习耶和华的诫命，直到他们渡过约旦河，向西进入迦南地。[a]
