base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/008.yaml
  text: And the man who does any work on it shall die—every man who defiles this day, or who lies with a woman, or who says he will do any matter on it so as to do business concerning any buying or selling, or who draws water on it that he had not prepared for himself on the sixth day, or who lifts any burden to carry it out from his tent or from his house—shall die.
translation:
  language: zh_hans
  text: 凡在这日做任何工作的，都必被处死；凡玷污这日的，或与女人同寝的，或说要在这日办理任何事务、进行任何买卖的，或在这日汲取自己没有在第六日预备好的水的，或把任何担子从自己的帐棚或房屋搬出去的，都必被处死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: 工
  rationale: 此处指安息日禁令所涵盖的劳作；译作“工”既贴近原文，也符合庄重的经文语体。
- source_word: ይመት
  choice: 必被处死
  rationale: 原词直指死亡刑罚；被动表述自然呈现受刑之意，又不擅自补出执行者。
- source_word: ይፄምና
  choice: 玷污
  rationale: 保留该词对圣日造成亵渎或不洁的宗教性含义，不缩窄为单纯“违反”。
- source_word: ይስክብ፡ ምስለ፡ ብእሲት
  choice: 与女人同寝
  rationale: 按原文保留较委婉而清楚的性关系表达，不另行解释其婚姻身份。
- source_word: ሠይጥ፡ ወተሣይጦ
  choice: 买卖
  rationale: 成对词语指售卖与购买，汉语以惯用并列词“买卖”自然概括两方面。
- source_word: ማየ፡ ይቀድሕ
  choice: 汲取……水
  rationale: 准确表达从水源打水或取水的动作，比泛称“用水”更贴近原文。
- source_word: ዕለት፡ ሳድስት
  choice: 第六日
  rationale: 保留古代按序数称日的表达，不直接解释为现代星期名称。
- source_word: ዘይጸውር
  choice: 担子
  rationale: 指被提起并搬运的负载；“担子”在现代汉语中清楚且保持经文语感。
- source_word: ደብተራሁ
  choice: 自己的帐棚
  rationale: 原词在此表示帐棚或居所；采用“帐棚”以保留游牧生活背景，并以“自己的”体现所属关系。
theological_decisions:
- issue: 死亡条款的法律力度
  choice: 译为“必被处死”
  alternative: 译为“必死”
  rationale: 上下文列举禁行事项并重申刑罚，具有法律制裁语境；“必被处死”比可能仅指自然死亡的“必死”更明确，同时不添加施刑主体。
- issue: “玷污这日”的含义范围
  choice: 保留“玷污”这一宽泛宗教性措辞
  alternative: 具体化为“违犯安息日”或“使这日不洁”
  rationale: 原文措辞带有圣俗边界和亵渎意味，但未在本句穷尽界定；保留其张力，避免以特定法律或宗派解释替代原文。
- issue: 与女人同寝的身份与情境
  choice: 仅译“与女人同寝”
  alternative: 译为“与妻子同房”或“发生不正当性关系”
  rationale: 原文只称“女人”，没有明说妻子，也没有将行为定性为婚外或不正当关系，因此不作神学或伦理上的额外限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留原文连续列举与首尾重复死刑条款的法律宣告结构；以分号和逗号梳理长句，避免古奥虚词。原文若干星号属于版本校勘标识，但所给材料未提供足以形成明确异文脚注的说明，因此正文不设置脚注。
