base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/013.yaml
  text: And the person who does any of these things on the Sabbath day shall die, so that the children of Israel may keep according to the commandments of the Sabbaths of the land, as it is written on the tablets that he gave into my hands so that I might write for you the laws of each appointed time according to the divisions of its days.
translation:
  language: zh_hans
  text: 凡在安息日做这些事的人，都必被处死；好使以色列子孙按这地各安息日的诫命谨守安息日[a]。这正如写在交在我手中的版上的，为要使我把各个指定时期的律例，按其日子的划分写给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好使以色列子孙按这地各安息日的诫命谨守。”
    reason: 原文“谨守”的明确宾语未直接说出；正文依上下文补作“安息日”，脚注保留可将该动词理解为不明示宾语的另一种句法可能。
lexical_decisions:
- source_word: ወሰብእ፡ ዘይገብር፡ ኵሎ፡ ዘእምዝ
  choice: 凡……做这些事中任何一件的人
  rationale: 保留句首连接语的承接作用，并将“任何/一切这些事”的结构译成自然、明确的现代汉语。
- source_word: በዕለተ፡ ሰንበት
  choice: 在安息日
  rationale: 按犹太宗教语境采用通行译名“安息日”。
- source_word: ይሙት
  choice: 都必被处死
  rationale: 此处是针对违犯者的法定死刑，不宜仅译作自然死亡的“必死”。
- source_word: እንዘ፡ ይዕቀቡ፡ በከመ፡ ትእዛዛተ
  choice: 按照……的诫命谨守
  rationale: 明确保留በከመ“按照”的规范性关系，不把“诫命”直接处理成“谨守”的宾语。
- source_word: ሰንበታት፡ ምድር
  choice: 地上各安息期
  rationale: 保留“地/土地”与复数“安息期”的组合，避免擅自限定为单一的每周安息日或安息年。
- source_word: ሕገገ፡ ጊዜ፡ ወጊዜ
  choice: 各个指定时期的律例
  rationale: ሕገገ按复数处理为“律例”；重复的“时期和时期”在汉语中自然表达为“各个时期”，并以“指定”体现礼仪历法中的规定时点。
- source_word: በበ፡ ክፍሌ፡ መዋዕሊሁ
  choice: 按其日子的划分
  rationale: 较形式地保留“各自/按照、划分、其日子”的结构与历法含义。
theological_decisions:
- issue: “谨守”的对象及标准
  choice: 译为“按照地上各安息期的诫命谨守安息日”
  alternative: “谨守地上各安息期的诫命”
  rationale: 原文በከመ表示“按照”，诫命是遵守安息制度的标准；但动词的具体宾语略有省略，故用脚注保留另一种句法理解。
- issue: “地上各安息期”的范围
  choice: 不具体解释为每周安息日或土地的安息年
  alternative: “土地的各安息年”
  rationale: 原文复数“安息”与“地/土地”的关系可有不同理解，应保留其广度和张力。
- issue: 赐版者的指代
  choice: 译为“那赐给我、交在我手中的版”而不补出主语名称
  alternative: “他赐给我并交在我手中的版”
  rationale: 原文关系结构可直接修饰“版”，中文无需补定“他”所指，以免加入原文未明说的身份说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；法律语境用“必被处死”，历法与礼仪语境用“安息期”“指定时期”“律例”。正文中的[a]与脚注完全对应。
