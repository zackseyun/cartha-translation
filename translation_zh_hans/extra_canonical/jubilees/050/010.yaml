revisions:
- from: 因为主赐给以色列极大的尊荣：可以在这节庆之日吃喝饱足，并在这一天歇下一切属于世人劳作的工，只可焚香，并在主面前为平日和安息日献上供物与祭牲。
  to: 因为主赐给以色列极大的尊荣：让他们在这节庆之日吃喝饱足，并在这一天歇息，不做一切属于世人劳作的工作；只可焚香，并在主面前为平日和安息日献上供物与祭牲。
  rationale: 仅调整“歇下……工”的中文句法与语义表达，使其明确表示在节庆日停止一般世人劳作而安歇。保留末句“为平日和安息日”的原有歧义与英语审校轨迹，不擅自限定为特定节期或改作单纯时间状语。
