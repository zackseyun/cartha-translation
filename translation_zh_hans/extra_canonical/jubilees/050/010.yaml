base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/010.yaml
  text: 'For great is the honor that the LORD has given to Israel: to eat and to drink and to be satisfied on this festival day, and to rest on it from all work belonging to the labor of the children of men, except burning incense and bringing an offering and sacrifice before the LORD for the days and for the sabbaths.'
translation:
  language: zh_hans
  text: 因为主赐给以色列极大的尊荣：让他们在这节庆之日吃喝饱足，并在这一天歇息，不做一切属于世人劳作的工作；只可焚香，并在主面前为平日和安息日献上供物与祭牲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢይ፡ ክብር
  choice: 极大的尊荣
  rationale: 保留“伟大/重大”与“荣耀、尊荣”的组合，并自然表达这是主赐给以色列的殊荣。
- source_word: በዛቲ፡ ዕለት፡ በዓል
  choice: 在这节庆之日
  rationale: 将“日”与“节庆”共同译出，避免只译作一般的“节日”。
- source_word: ወለጸጊብ
  choice: 饱足
  rationale: 对应吃喝之后得满足、吃饱之意，采用庄重而通俗的表达。
- source_word: ለአዕርፎ
  choice: 歇下
  rationale: 表达停止劳作、安歇的动作，同时与安息日语境协调。
- source_word: ግብር፡ ዘእምግብረ፡ እጓለ፡ እመሕያው
  choice: 一切属于世人劳作的工
  rationale: 尽量保留原文“工作/劳作”叠合及“人子、世人”的范围限定。
- source_word: ዕጣን፡ ዕጣን
  choice: 焚香
  rationale: 原文存在重复形式；按上下文理解为与献祭并列的礼仪行为，以自然汉语表达，不机械重复。
- source_word: ቍርባን፡ ወመሥዋዕት
  choice: 供物与祭牲
  rationale: 区分一般献上的供物与作为祭献的祭牲，保留两个礼仪名词。
- source_word: ለመዋዕለ፡ ወለሰንበታት
  choice: 为平日和安息日
  rationale: “日子”在与“安息日”对举时可指日常各日；译作“平日”使汉语清楚，同时保留其可能涉及规定日期的张力。
theological_decisions:
- issue: 安息日禁工与祭祀活动的例外
  choice: 译作“只可焚香，并……献上供物与祭牲”
  alternative: 译作“除了焚香和献祭之外”
  rationale: 明确原文将圣所礼仪列为停止一般人间劳作之外的活动，但不进一步解释其律法或神学机制。
- issue: “尊荣”的内容
  choice: 用冒号引出吃喝、饱足和安歇
  alternative: 将其改写为“主如此尊重以色列，使他们……”
  rationale: 保留原文将节日享用与安息本身视为神所赐尊荣的结构，不淡化其神学意味。
- issue: 末尾“日子与安息日”的所指
  choice: 译作“平日和安息日”
  alternative: 译作“各节期和安息日”或“每日和每个安息日”
  rationale: 原文措辞较简略，保持与安息日的对举，不擅自限定为节期，也不强行加入“每日”。
translation_notes:
  register: 采用现代标准普通话的庄重书面语；句式清楚，保留原文因果关系、尊荣主题、禁工与礼仪例外之间的张力。神名按项目惯例译为“主”。
