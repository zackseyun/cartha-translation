revisions:
- from: 禧年将不断过去，直到以色列从淫乱、污秽、玷污、罪恶和过错的一切罪责中得洁净，并在全地安然居住；那时，他们中间不再有任何撒但，也不再有任何恶者；从那时直到永远，这地都必洁净。
  to: 一个又一个禧年过去，直到以色列从一切淫乱、污秽、玷污、罪恶和过错中得洁净，并在全地安然居住；那时，他们中间不再有任何撒但，也不再有任何恶者；从那时直到永远，这地都必洁净。
  rationale: 调整两处轻微的汉语表达问题：以“一个又一个禧年过去”自然呈现复数禧年周期；删去可能造成句法负担的“罪责”，直接列出以色列得洁净所脱离的各项罪与污秽。其余术语、语气、时间范围和身份歧义均予保留。
