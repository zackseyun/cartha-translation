base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/005.yaml
  text: And the jubilees will pass until Israel is cleansed from all guilt of fornication and uncleanness and pollution and sin and error, and dwells in confidence in all the land; and there will no longer be for them any satan or any evil one, and the land will be clean from that time forever.
translation:
  language: zh_hans
  text: 一个又一个禧年过去，直到以色列从一切淫乱、污秽、玷污、罪恶和过错中得洁净，并在全地安然居住；那时，他们中间不再有任何撒但，也不再有任何恶者；从那时直到永远，这地都必洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤሌዎታት
  choice: 禧年
  rationale: 指按禧年循环计算的时期；保留复数所表达的连续周期含义，以“将不断过去”自然呈现。
- source_word: አበሳ
  choice: 罪责
  rationale: 此词可指罪过、过犯或由罪产生的罪责；结合后续罪恶清单，译作“罪责”较能体现“从……中得洁净”的关系。
- source_word: ዝሙት
  choice: 淫乱
  rationale: 通常指不正当的性行为或淫行；“淫乱”庄重且为现代读者清楚。
- source_word: ርኵስ
  choice: 污秽
  rationale: 表达礼仪或道德上的不洁，不限定为单一类别。
- source_word: ግማኔ
  choice: 玷污
  rationale: 与“污秽”并列，保留原文近义词的累加效果，表达污染、败坏之意。
- source_word: ጌጋይ
  choice: 过错
  rationale: 可指错误、偏差或过失；译作“过错”以区别于前面的“罪恶”，不把含义过度神学化。
- source_word: ይትአመን
  choice: 安然居住
  rationale: 该语境强调安全、可靠或无所惧怕的状态；“安然居住”符合汉语表达，同时保留安全感。
- source_word: ሰይጣነ
  choice: 撒但
  rationale: 音译原词，不擅自判定此处是专名还是泛指敌对者；配合“任何”保留原文表达。
- source_word: እኩየ
  choice: 恶者
  rationale: 可指邪恶者或恶的存在；“恶者”保留人格化可能性，而不指定其具体身份。
- source_word: ትነጽሕ
  choice: 洁净
  rationale: 与前文以色列“得洁净”形成词义呼应，并适合描述土地脱离污秽的状态。
theological_decisions:
- issue: “撒但”是专名还是泛称
  choice: 任何撒但
  alternative: 那撒但／任何敌对者
  rationale: 原文带有不定或泛指语势，英文审校层亦保留“any satan”。译文不加专名化限定，以免把可能的泛称强行解释成唯一特定存在。
- issue: 洁净的对象与罪恶清单的句法关系
  choice: 以色列从……一切罪责中得洁净
  alternative: 以色列的一切淫乱、污秽、玷污、罪恶和过错都被洁净
  rationale: 原文以“罪责”统摄后续并列项目的可能性较强；如此翻译既保留总括关系，也避免把“淫乱”等抽象行为直接说成被洗净。
- issue: 末世性永久状态
  choice: 从那时直到永远，这地都必洁净
  alternative: 从那时起，这地永远洁净
  rationale: 明确保留原文“从那时”与“直到一切日子／永远”的时间跨度，不进一步界定其末世时间表。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文并列罪恶术语的累加力度，以及“撒但／恶者”身份上的开放性；通过分号梳理长句，但不拆散其从禧年推移、以色列洁净、安居、邪恶消失到土地永洁的逻辑链。
