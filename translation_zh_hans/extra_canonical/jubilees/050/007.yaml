base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/007.yaml
  text: Six days you shall do work, but the seventh day is a sabbath of the LORD your God. You shall do no work on it—you and your children and your male servants and your female servants and all your animals and also the resident foreigner who is with you.
translation:
  language: zh_hans
  text: 六日你们要做工；第七日却是耶和华你们上帝的安息日。那一天，你们、你们的儿女[a]、你们的男仆女仆、所有的牲畜，以及住在你们中间的外族人，都不可做任何工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”。
    reason: 原词可泛指儿女、后代，也可按较窄义理解为儿子。
lexical_decisions:
- source_word: ውሉድክሙ
  choice: 你们的儿女
  rationale: ውሉድ是“儿女、子女、后代”的复数集合称谓；此处用“儿女”既自然，也保留其可能被较窄理解为“儿子”的词义背景。
- source_word: ኵሉ፡ እንስሳክሙ
  choice: 所有牲畜
  rationale: እንስሳ可泛指动物，但在家庭安息日禁令的语境中指人所拥有的家畜；“牲畜”比笼统的“动物”更符合语境。
- source_word: ነኪርኒ፡ ዘኀቤክሙ
  choice: 以及住在你们中间的外族人
  rationale: ነኪር表示陌生人、外来者或异族人，ዘኀቤክሙ意为“在你们那里/与你们同住的”；此译避免现代“外国侨民”的行政色彩。
- source_word: ሰንበት፡ ዘእግዚአብሔር፡ አምላክክሙ
  choice: 耶和华你们上帝的安息日
  rationale: 按属格结构直译，保留安息日归属于耶和华、你们上帝的表达。
theological_decisions:
- issue: ውሉድ是否限定为男性后代
  choice: 正文译作“儿女”
  alternative: 你们的儿子
  rationale: 该复数词可指儿女或后代；上下文概括安息日诫命所涵盖的家庭成员，因此正文采用较自然且不无根据地限缩性别的“儿女”，并以脚注保留窄义可能。
- issue: 安息日所属关系的表达
  choice: “耶和华你们上帝的安息日”
  alternative: “向耶和华你们的上帝守的安息日”
  rationale: 原文仅有属格关系，没有明说“向……守”，故不补入解释性神学措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“六日”保留诫命式语体；后半句适度重述“都不可做工”，避免汉语中长串并列成分与前文谓语关系含混。正文脚注标记与脚注完全对应。
