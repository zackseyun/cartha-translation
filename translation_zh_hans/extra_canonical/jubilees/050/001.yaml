  yaml_path: translation/extra_canonical/jubilees/050/001.yaml
  text: And after this law I made known to you the days of the sabbaths in the wilderness of Sinai, which is between Elim and Sinai.
translation:
  language: zh_hans
  text: 在这律法之后，我在西奈旷野，就是以琳和西奈之间，向你晓谕了安息日的日子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“此后，我向你晓谕了有关安息日诸日的律法。”
    reason: 源文在句法上也可将“律法”与后面的“安息日的日子”连读；此译保留该替代分析，同时避免汉语中不自然的“安息日之日”。
lexical_decisions:
- source_word: ሕገ
  choice: 这律法
  rationale: 将其按前置宾语理解为上文刚讲完的律法；这种读法比把它与后面的“日子”构成被动词隔开的属格结构更符合吉兹语通常语序。
- source_word: መዋዕለ፡ ሰንበታት
  choice: 各安息日的日子
  rationale: 保留“日子”和复数“安息日”的源文表达，避免擅自具体化为日期、节期或单一安息日。
- source_word: በገዳመ፡ ሲና
  choice: 在西奈旷野
  rationale: ገዳም在此指旷野；不译作“西奈山上”。
- source_word: እንተ፡ ይእቲ፡ ምእከለ፡ ኤሎም፡ ወሲና
  choice: 就是以琳和西奈之间
  rationale: 按源文将关系说明与“西奈旷野”相连，并自然表达其位于两地之间。
theological_decisions:
- issue: “律法”与“各安息日的日子”的句法关系
  choice: “这律法之后……晓谕了各安息日的日子”
  alternative: “此后，我向你晓谕了各安息日之日的律法”
  rationale: 源文把ሕገ置于动词之前，而መዋዕለ፡ ሰንበታት置于动词之后；主译文据此把“这律法”理解为承接上文的时间参照，同时以脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“晓谕”体现权威性的启示语境；“各安息日的日子”虽略带源文痕迹，却有助于保留原句的词汇结构和含义张力。
