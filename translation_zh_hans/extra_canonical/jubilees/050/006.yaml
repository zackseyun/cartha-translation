  text: And behold, I have written for you the command concerning the Sabbaths, and all the judgments of its laws.
translation:
  language: zh_hans
  text: 看哪，我已经为你写下了有关安息日的诫命，以及其各项律法的一切裁断。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወናሁ
  choice: 看哪
  rationale: 保留原文提示并强调下文的语气，采用现代中文圣经体中自然而庄重的表达。
- source_word: ትእዛዘ፡ ሰንበታትኒ
  choice: 有关安息日的诫命
  rationale: ትእዛዝ 表示“命令、诫命”，ሰንበታት 为复数形式；中文以集合性称谓“安息日”表达关于各安息日的整体规定，避免生硬的“安息日们”。
- source_word: ጸሐፍኩ፡ ለከ
  choice: 我已经为你写下了
  rationale: 准确呈现第一人称完成动作及“为你/给你”的受益对象。
- source_word: ፍትሓተ
  choice: 判例
  rationale: 该词在律法语境中指司法裁断、法令或典章；“判例”能保留其区别于一般律法条文的司法含义。
- source_word: ሕገጊሁ
  choice: 其律法
  rationale: 按所给文本的复数词干理解为“它的诸律法”；中文“律法”可作集合名词，既自然，也不把附属代词的指向过度解释为某个明确名词。
theological_decisions:
- issue: “其”所指为何
  choice: 保留“其律法”这一代词结构
  alternative: 译作“安息日律法”或“这些律法”
  rationale: 原文附属代词存在指代空间；不在正文中擅自明确其先行词，以保留原文可能的语法张力。
- issue: ሕገጊሁ 的数
  choice: 译为中文集合性单数“律法”，并以“一切判例”体现内部复数范围
  alternative: 译作“其各项律法”
  rationale: 原文形态支持复数“laws”，但现代中文“律法”常作集合名词；译成“各项律法”会令“判例”与“律法”的属格关系显得累赘。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“看哪”保留原文话语标记；“安息日”在中文中以集合性单数自然涵盖原文复数；整体尽量贴近原文语序，同时避免机械直译。
