  yaml_path: translation/extra_canonical/jubilees/050/002.yaml
  text: And I told you about the sabbaths of the land on Mount Sinai, and the years of the jubilees I told you among the sabbaths of years; but its year I did not tell you until the time when you enter the land that you are to possess.
translation:
  language: zh_hans
  text: 我在西奈山上向你讲述了土地的安息，也在年之安息中向你讲述了禧年的年份；但关于那一年[a]，直到你们进入将要承受的土地时，我才告诉你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那一年”的原文所指并不完全明确，可能指禧年本身的年份，或与其施行有关的特定年份。
    reason: 保留原文代词性表达所形成的真实歧义，避免在正文中武断确定其所指。
lexical_decisions:
- source_word: ሰንበታተ፡ ምድር
  choice: 土地的安息期
  rationale: 直译为“土地的安息（复数）”，在本节语境中指土地周期性的安息期；用“安息期”既保留制度性含义，也符合现代汉语。
- source_word: ዓመታተ፡ ኢዮቤሌዎኒ
  choice: 禧年的岁数
  rationale: 原文是复数“禧年的年数/岁数”，这里保留其计算周期的含义，不泛化为单纯的“禧年”。
- source_word: ውስተ፡ ሰንበታተ፡ ዓመታት
  choice: 在七年安息期的条例中
  rationale: 原文较直译为“在各个年期的安息中”。“七年安息期”自然表达按七年划分的周期；“条例中”是为使汉语关系清楚而作的轻度补足。
- source_word: ትእኅዙ
  choice: 承受
  rationale: 该词表达取得、占有土地；“承受”兼顾实际得地与受赐产业的语感，且不额外限定取得方式。
theological_decisions:
- issue: “那一年”的所指
  choice: 在正文中保留“那一年”，并加注说明其所指不明确
  alternative: 明确译作“禧年的那一年”或“禧年开始的年份”
  rationale: 原文仅用带代词色彩的“年”，可能承接禧年，却没有把具体所指完全说死；不应在译文中代替原文消除歧义。
- issue: 第二人称单复数的转换
  choice: 前文用“你”指摩西，后文用“你们”指进入并承受土地的群体
  alternative: 全节统一译作“你”或“你们”
  rationale: 原文前面的受词后缀为第二人称单数，而“进入”及相关表述转为第二人称复数；汉语明确呈现这一转换。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“土地的安息期”“七年安息期”“禧年”保持律法历法语境；句法略作调整，使较长的并列结构便于普通读者理解，同时保留原文由对摩西单数称呼转向对群体复数称呼的变化。
