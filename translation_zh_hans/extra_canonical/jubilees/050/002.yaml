- from: 我在西奈山上把土地的安息期告诉了你，也在七年安息期的条例中把禧年的岁数告诉了你；但那一年[a]，我要等到你们进入将要承受的土地时才告诉你。
  to: 我在西奈山上向你讲述了土地的安息，也在年之安息中向你讲述了禧年的年份；但关于那一年[a]，直到你们进入将要承受的土地时，我才告诉你。
  rationale: 修订恢复原文过去时的“没有告诉……直到……才告诉”结构，以“禧年的年份”替代易误解为年龄的“禧年的岁数”，并删去原文未明说的“条例”和“七年”。正文仍保留“那一年”的未定所指，脚注仅说明其可能范围；第二人称则继续呈现前段单数“你”与进入土地时复数“你们”的转换。
