  naturalness: 长串并列在律例语体中自然；以破折号标示本节悬接下文也合适。修订后“在海上乘船航行”比“乘船渡海”更不预设横渡海域的终点。
  terminology: “安息日”“做工”“耕种田地”“禁食”“争战”均恰当。源文的“动物”不宜译窄为通常指家畜的“牲畜”。
