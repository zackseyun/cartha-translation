base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/012.yaml
  text: And every person who does work on it, or goes on a journey, or tills his field, whether in his house or in any place, or kindles a fire, or rides on any animal, or travels by ship on the sea, or strikes or kills anything, or slaughters an animal or a bird, or catches a wild beast or a bird or a fish, or fasts, or makes war on the sabbath day—
translation:
  language: zh_hans
  text: 凡在安息日做工，或出门远行，或耕种田地——无论在家里还是在任何地方——或点火，或骑乘任何动物，或在海上乘船航行，或击打或杀死任何东西，或宰杀牲畜或鸟，或捕捉野兽、鸟或鱼，或禁食，或争战的人——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: 做工
  rationale: 指安息日所禁止的劳作；“做工”既贴近原义，也符合现代中文经文语体。
- source_word: የሐውር፡ መንገደ
  choice: 出门远行
  rationale: 字面为“走路/上路”；结合安息日条例语境，用“出门远行”自然表达受禁的行程，同时不限定具体交通方式。
- source_word: ይትቀነይ፡ ወፍረ
  choice: 耕种田地
  rationale: 表示从事田间耕作；采用“田地”而非较宽泛的“农场”。
- source_word: ያነድድ፡ እሳተ
  choice: 点火
  rationale: 直接对应使火燃起，简洁自然。
- source_word: ይጼአን፡ ዲበ፡ ኵሉ፡ እንስሳ
  choice: 骑乘任何牲畜
  rationale: 源文表达乘在动物之上；“牲畜”在此比泛称“动物”更符合骑乘语境。
- source_word: ይነግድ፡ በሐመር፡ ባሕረ
  choice: 乘船渡海
  rationale: 表达凭船在海上行进；不把动词过度解释为经商。
- source_word: ይዘብጥ፡ ወይቀትል፡ ምንተሂ
  choice: 击打、杀死任何活物
  rationale: 保留“击打”与“杀死”两个并列动作；“任何活物”使宾语在中文中明确而不过度限定。
- source_word: የሐርድ፡ እንስሳ፡ ወዖፈ
  choice: 宰杀牲畜或鸟
  rationale: “宰杀”准确表达屠宰动物，保留牲畜与鸟的并列。
- source_word: አሰገረ፡ እመሂ፡ አርዌ፡ ወዖፈ፡ ወእመሂ፡ ዓሣ
  choice: 捕捉野兽、鸟或鱼
  rationale: 概括捕获各类动物的动作，并保留源文列举顺序。
- source_word: ይጾውም
  choice: 禁食
  rationale: 直接保留源文所列的禁食行为，不按后世礼仪传统加以解释。
- source_word: ይገብር፡ ጸብአ
  choice: 争战
  rationale: 表示进行战争或作战；“争战”兼具经文庄重感与现代可懂性。
theological_decisions:
- issue: 安息日禁令清单与刑罚结论的句法关系
  choice: 以破折号收尾，保留本节未完的条件句结构
  alternative: 用句号结束，译成独立禁令
  rationale: 源文及咨询层均显示本节是后续判决的前置主语/条件清单；保留悬接可避免擅自补足或削弱下一节的关系。
- issue: 将“禁食”列入安息日所禁行为
  choice: 照源文直译为“禁食”
  alternative: 省略、改释为苦待己身，或通过注释消解其张力
  rationale: 该项目在神学和礼仪上可能令人意外，但源文明确列出，应保留其真实张力，不以特定传统重新解释。
translation_notes:
  register: 采用现代、庄重而清楚的律例语体。以“凡……的人——”统摄长串并列行为，并用插入破折号处理“无论在家里还是在任何地方”，使结构清晰。末尾破折号表明句意承接下一节。
