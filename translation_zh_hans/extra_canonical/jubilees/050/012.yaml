    issue: “骑乘任何牲畜”将动物范围收窄。
    rationale: 原文“ኵሉ፡ እንስሳ”及英文审校轨迹均为“任何动物”；“牲畜”通常偏指驯养家畜，不能无依据地排除其他可骑乘动物。
  - severity: low
    issue: “乘船渡海”可能强化为横渡海域。
    rationale: 原文及英文为凭船在海上行进／旅行，未明确表达从一岸渡至另一岸；“在海上乘船航行”保留较宽泛含义。
  - severity: medium
    issue: “任何活物”将“任何东西”的泛指宾语限于生物。
    rationale: 原文此处与英文“anything”均保留宽泛宾语；虽“杀死”本身通常指生物，译文不应以“活物”预先限定同时适用于“击打”的对象。
