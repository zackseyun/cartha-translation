  text: evening[a], and bow down to him, and continually seek his face at all times, and do uprightness and righteousness before him, so that he may direct you and give you mercy, and send down for you the rain of morning and evening, and bless all the work that you do on the earth, and bless your grain
translation:
  language: zh_hans
  text: 至高者——你们要向他俯伏，常常寻求他的面，时时如此；要在他面前行正直和公义，好让他引导你们，赐你们怜悯，为你们降下早晚的雨[a]，赐福你们在地上所做的一切工，也赐福你们的五谷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “早晚的雨”直译为“早晨和傍晚的雨”；在农业祝福的语境中，可能指适时降下、滋养庄稼的雨，可与“早雨、晚雨”相类比。
    reason: lexical_alternative
lexical_decisions:
- source_word: ልዑለ
  choice: 至高者
  rationale: 按词面保留这一神圣称谓；原文在本节开头承接上文，语法上呈片段状态，因此不擅自补入动词。
- source_word: ወትስፈዉ፡ ገጸ፡ ዚአሁ
  choice: 寻求他的面
  rationale: 保留闪族表达“他的面”，传达持续转向他、求见并仰望他的含义。
- source_word: ርትዐ፡ ወጽድቀ
  choice: 秉公行义
  rationale: 以自然而庄重的并列短语表达正直与公义，不把两个近义伦理词合并为一个概念。
- source_word: ያርትዕ፡ ርእስክሙ
  choice: 引导你们
  rationale: ርእስክሙ 字面为“你们的头/你们自己”，在此作反身用法；不误译为“你们的道路”。动词可有使正直、导正之意，“引导”在汉语中保留其方向性。
- source_word: ዝናመ፡ ነግሀ፡ ወሰርከ
  choice: 早晚的雨
  rationale: 直译“早晨和傍晚的雨”，同时用脚注说明它可能对应农业语境中的按时降雨。
- source_word: እክልከ
  choice: 你们的五谷
  rationale: 原词为谷物、粮食；“五谷”在现代汉语中自然地表达集体性的田间收成。
theological_decisions:
- issue: 神圣称谓 ልዑለ 的句法状态
  choice: 保留“至高者”并以分号显示其与后文的衔接
  alternative: 补译为“敬畏至高者”或“要归向至高者”
  rationale: 所给吉兹文本从称谓本身起始，明显可能承接上一分句；补入具体动词会超出本节现存词证。
- issue: ያርትዕ 的含义
  choice: 译作“引导你们”
  alternative: “使你们正直”
  rationale: 两义均有词源和语境依据；正文采用较自然且不把结果说死的“引导”，同时承认该词带有导正、使正直的意味。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“秉公行义”“赐福”“怜悯”保留经文语体，但避免生硬古奥。开头保留原文承接上文的片段感，不凭推测补全。
