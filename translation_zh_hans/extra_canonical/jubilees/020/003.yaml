revisions:
- from: 所多玛所受的审判，就是他们怎样因自己的恶行，又因彼此间的淫乱、污秽和败坏而被定罪；他们因淫乱而死。你们也要谨慎自守，远离一切淫乱和污秽，以及罪的一切玷污，免得你们使自己的名成为咒诅，使自己的一生成为羞辱，使自己的众子落入刀剑的毁灭[b]，自己像所多玛一样受咒诅，所有余民像蛾摩拉的子孙一样。我向你们作证，我的孩子们：要爱他[a]。
  to: 所多玛怎样因自己的恶行，又因彼此间的淫乱、污秽和败坏而受审判；他们因淫乱而死。你们也要谨慎自守，远离一切淫乱、污秽和罪的一切玷污，免得使自己的名成为咒诅，使自己的一生成为羞辱，使自己的众子遭刀剑毁灭[b]，使自己像所多玛一样受咒诅，使你们其余的人像蛾摩拉的子孙一样。我向你们作证，我的孩子们：要爱他[a]。
  rationale: 修订只处理可安全判定的汉语表达：将开头改为直接说明所多玛如何受审判，避免重复；将不自然的“落入刀剑的毁灭”改为“遭刀剑毁灭”，同时保留脚注交代原文名词性并列结构；并以“其余的人”避免“余民”可能附带的术语联想。保留“要爱他”及其脚注，不提前把下一节的名词指称补入正文。
