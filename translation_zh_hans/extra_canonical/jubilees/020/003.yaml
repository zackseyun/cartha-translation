base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/003.yaml
  text: 'and the judgment of Sodom, how they were judged because of their wickedness, and because of fornication and uncleanness and corruption among themselves: by fornication they died. And you also, guard yourselves from all fornication and uncleanness and from every defilement of sin, so that you may not make your name a curse, and all your life a reproach, and all your sons to destruction by the sword, and you become accursed like Sodom, and all your remnant like the sons of Gomorrah. I testify to you, my children: love him'
translation:
  language: zh_hans
  text: 所多玛怎样因自己的恶行，又因彼此间的淫乱、污秽和败坏而受审判；他们因淫乱而死。你们也要谨慎自守，远离一切淫乱、污秽和罪的一切玷污，免得使自己的名成为咒诅，使自己的一生成为羞辱，使自己的众子遭刀剑毁灭[b]，使自己像所多玛一样受咒诅，使你们其余的人像蛾摩拉的子孙一样。我向你们作证，我的孩子们：要爱他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”的所指在下一节说明，即天上的上帝。
    reason: 跨节代词可能使单独阅读本节的读者不明所指。
  - marker: b
    text: 或译：“使自己的众子被刀剑毁灭。”
    reason: 原文将“众子”“毁灭”和“刀剑”置于前面“使／交付”支配的并列结构中；汉语按结果关系表达更自然。
lexical_decisions:
- source_word: ዝሙት
  choice: 淫乱
  rationale: 该词反复出现，指不正当的性行为；“淫乱”在现代汉语中清楚、庄重，并保留原文的道德分量。
- source_word: ርኵስ
  choice: 污秽
  rationale: 保留礼仪与道德层面都可能存在的含义，不将其限定为某一种具体罪行。
- source_word: ሙስና
  choice: 败坏／毁灭
  rationale: 前一处描述所多玛人彼此间的腐败，译为“败坏”；后一处与刀剑及子孙的结局相连，译为“毁灭”，按语境体现同词的结果性含义。
- source_word: ፃማነ፡ ኀጢአት
  choice: 罪的一切玷污
  rationale: 依原文属格关系表达，保留罪带来污染、玷污的意象。
- source_word: አሰምዕ
  choice: 我向你们作证
  rationale: 按第一人称单数陈述式理解，而非“你们要听”；符合该动词宣告、作证的语义。
- source_word: አፍቅርዎ
  choice: 要爱他
  rationale: 保留第三人称阳性单数宾语后缀；“他”的所指延续到下一节，不在本节内擅自补明。
theological_decisions:
- issue: “他”的指代对象跨越节界
  choice: 正文保留“要爱他”，以脚注说明所指在下一节展开
  alternative: 直接译为“要爱天上的上帝”
  rationale: 原文在本节只使用代词，明确名词出现在下一节；保留代词可忠实呈现篇章衔接，避免把后文内容提前并入。
- issue: 众子、刀剑与毁灭之间的句法关系
  choice: 译作“使自己的众子落入刀剑的毁灭”
  alternative: “使自己的众子被刀剑毁灭”
  rationale: 原文把“众子”与“毁灭”置于前面“使／交付”结构的并列链条中；正文尽量保留这一结构，脚注提供更自然的结果式理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留本节开头承接上文的片段式结构，也保留结尾代词指向下一节的张力；不补入原文未明说的教义解释。
