base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/001.yaml
  text: And in the forty-second jubilee[a], in the first year of the seventh week, Abraham called Ishmael and his twelve sons, and Isaac and his two sons, and the six sons of Keturah and their children. And he commanded them to keep the way of the LORD, to do righteousness, and that each should love his brother, and that he should thus be among all people, walking together to practice justice and righteousness on the earth.
translation:
  language: zh_hans
  text: 在第四十二个禧年、第七个七年周期的第一年，亚伯拉罕召来以实玛利和他的十二个儿子、以撒和他的两个儿子，以及基土拉的六个儿子和他们的子女。他吩咐他们谨守主的道，行公义；各人都要爱自己的弟兄，并要在众人中如此为人；他们要彼此同行，在地上施行公平和公义。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末段句法紧密，直译可理解为：各人要爱自己的弟兄，在众人中如此为人，并且他们要彼此同行，在地上施行公平和公义。
    reason: 说明原文末句的句法密度以及单数转复数的结构，保留可能的理解张力。
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: 禧年
  rationale: 对应《禧年书》的纪年单位，沿用现代中文圣经及相关文献中通行的术语。
- source_word: ሱባዔ
  choice: 七年周期
  rationale: 此处指禧年纪年体系内由七年组成的周期；补出“周期”可避免将其误解为普通的一周。
- source_word: ፍኖተ፡ እግዚአብሔር
  choice: 主的道
  rationale: “道路”在此指遵行上帝旨意的生活方式；译作“主的道”既保留经文惯用表达，也自然简洁。
- source_word: ጽድቀ
  choice: 公义
  rationale: 保留其伦理与宗教层面的正直、公义含义。
- source_word: ፍትሕ
  choice: 公平
  rationale: 与随后再次出现的“公义”构成有区别而相联的并列表达，避免将两个源词合并。
- source_word: ይሖሩ
  choice: 同行
  rationale: 保留源文“行走”的行为隐喻，同时结合上下文表达共同生活、行事的意义。
theological_decisions:
- issue: “主的道”的神名表达
  choice: 主
  alternative: 上主／耶和华
  rationale: 源文使用常见的神圣称谓；“主”庄重自然，也避免在缺乏更明确依据时指定神名读法。
- issue: 末句中单数与复数主语的转换
  choice: 先译“各人……在众人中如此为人”，再译“他们要彼此同行”
  alternative: 全句统一改为复数主语
  rationale: 源文先用第三人称单数承接“各人”，随后转为复数；译文保留这一语法与思想重心的变化。
- issue: “弟兄”的范围
  choice: 弟兄
  alternative: 彼此／同胞
  rationale: 源词具有亲属称谓色彩，而受命者本为家族成员；保留“弟兄”可避免过早将其泛化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“禧年”“七年周期”清楚呈现纪年体系；末句以分号理顺长句，但不消除源文由单数转复数及“行走”意象所形成的张力。
