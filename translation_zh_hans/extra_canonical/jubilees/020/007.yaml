translation:
  language: zh_hans
  text: 你的羊群。你们要在地上成为祝福，地上万族都要渴慕你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዒከ
  choice: 你的羊群
  rationale: 该词指羊群，带第二人称单数属格；本节从上一语境承接，故保留片段式开头。
- source_word: በበረከት
  choice: 成为福分
  rationale: 介词结构在系词后表达身份或功用；译为自然现代汉语“成为福分”，不生硬直译为“作为一个福分”。
- source_word: አሕዛበ፡ ምድር
  choice: 地上万族
  rationale: አሕዛብ 可指各民族、列国或外邦；此处采用概括性且符合祝福语境的“万族”，避免额外引入宗教身份色彩。
- source_word: ይፈትዉክሙ
  choice: 都要渴慕你们
  rationale: 动词表达喜爱、愿望或渴求，宾语为第二人称复数；“渴慕”保留其较强的意愿色彩。
theological_decisions:
- issue: “成为福分”的含义
  choice: 保留“成为福分”
  alternative: 蒙福
  rationale: 原文并非仅说受福，而是说受话者成为福分；如此保留施福与受福之间的神学张力。
- issue: 万族对受话者的态度
  choice: 渴慕你们
  alternative: 爱你们／盼望你们
  rationale: 原动词语义可涵盖爱、愿望和渴求；不补出他们渴慕受话者的具体原因或对象内容，以保存原文的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。第二分句及末句依吉兹语复数人称译作“你们”，首句的属格则按原文单数译作“你的”；不擅自统一人称，以保留现存文本的转换。
