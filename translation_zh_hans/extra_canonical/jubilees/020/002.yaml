  yaml_path: translation/extra_canonical/jubilees/020/002.yaml
  text: And that they should circumcise their sons according to the covenant that was established with them[a], and that they should not turn aside from this, neither to the right nor to the left, from any path that the LORD commanded; and that we should keep ourselves from all fornication and uncleanness, and that we should put away from among us every act of fornication and uncleanness. And if a woman among you commits harlotry, or even a daughter, burn her with fire, and let them not commit fornication after their eyes and after their heart, and let them not take wives for themselves from the daughters of Canaan, for the seed of Canaan will be uprooted from the land. And he told them of the judgment of the Watchers[a],
translation:
  language: zh_hans
  text: 他们的儿子要按着与他们所立的约受割礼[a]；他们不可偏离上主所吩咐的任何道路，或向右，或向左。我们要远离一切淫乱和污秽，并从我们中间除去一切淫乱和污秽的行为。你们中若有妇人，或女儿行淫，就要用火焚烧她[b]。他们不可随从自己的眼目和内心行淫；他们也不可从迦南的女子中为自己娶妻，因为迦南的后裔必从这地被连根拔除。他又把守望者所受的审判告诉了他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的儿子要按着……约受割礼”是根据亚伯拉罕之约的语境作出的理解；这一见证在此处的措辞较为紧缩。
    reason: 说明语境推断及原文措辞的不确定性。
  - marker: b
    text: 这里的命令语气严厉，带有法律色彩；吉兹文明确说要“用火焚烧”。
    reason: 说明原文刑罚用语的明确性，避免读者误以为译文有所增饰。
  - marker: c
    text: “守望者”指以诺传统中悖逆的天上众生；这里所说的是他们所受的惩罚。
    reason: 交代专有传统称谓的背景。
lexical_decisions:
- source_word: ይክስቡ፡ ውሉዶሙ፡ በኪዳን
  choice: 他们的儿子要按着……约受割礼
  rationale: 此处见证的措辞较为紧缩；结合亚伯拉罕之约的语境，将该短语理解为儿子按约受割礼，同时以脚注说明其推断性质。
- source_word: ዝሙት / ዘመወት / ይዘምዋ
  choice: 淫乱／行淫
  rationale: 原文反复使用同一词根，指向明确的性行为；译文保留这一重复和具体含义，不弱化为泛指的“偏离正道”。
- source_word: ይሤረዉ
  choice: 被连根拔除
  rationale: 该动词有“拔除、连根除去”之意，与主语“后裔／种子”形成鲜明的农业隐喻，比泛化的“毁灭”更贴近原文。
- source_word: ረዓይት
  choice: 守望者
  rationale: 这是以诺传统中对悖逆天上众生的特定称呼；采用通行音义明确的译法，并以脚注交代背景。
- source_word: እግዚአብሔር
  choice: 上主
  rationale: 以庄重而现代的汉语表达神圣称谓，避免在缺乏进一步证据时过度限定其专名形式。
theological_decisions:
- issue: 约与割礼的关系
  choice: 正文译为“按着……约受割礼”，并注明措辞属语境推断
  alternative: 直译为“使他们的儿子进入与他们所立的约”
  rationale: 本节承接亚伯拉罕立约语境，割礼含义很可能存在，但当前吉兹文见证表达紧缩；正文提供可读译文，脚注保留文本上的不确定性。
- issue: 妇人或女儿行淫所受的刑罚
  choice: 明确译出“用火焚烧她”
  alternative: 以较含蓄的“处死她”处理
  rationale: 原文明确出现“用火”，且语气具有严厉的法律性质；不因现代读者的不适而淡化。
- issue: 守望者的身份
  choice: 保留专称“守望者”
  alternative: 解释性译作“悖逆的天使”
  rationale: 原文仅给出传统称号；正文不直接加入“天使”等解释，以免消除其文学传统中的张力，背景放入脚注。
- issue: 人称在“他们”与“我们”之间转换
  choice: 保留原文的人称转换
  alternative: 统一改为“他们”或“你们”
  rationale: 源文确有第三人称与第一人称复数的转换；统一人称会无据地平整文本。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文中“他们／我们／你们”的人称转换，以及“淫乱／行淫”的词根重复；对严厉刑罚不作弱化。句子适度分开以利诵读，但不改变论述次序。
