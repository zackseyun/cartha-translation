  text: to Isaac his son. And Ishmael and his sons and the sons of Keturah and their children went together and settled from Paran as far as the entrance to Babylon, in all the land that faces eastward.
translation:
  language: zh_hans
  text: 给他的儿子以撒。以实玛利和他的儿子们、基土拉的儿子们及他们的后代一同前往，并从巴兰直到巴比伦的入口，在整个面向东方的地区定居。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅቡረ
  choice: 一同
  rationale: 表达众人共同迁往并居住，贴合原文“共同、一起”的意义。
- source_word: እምፋርሞን
  choice: 从巴兰
  rationale: 将地名 ፋርሞን 按传统对应译作“巴兰”，并保留起点介词“从”。
- source_word: እስከ፡ ምብዋአ፡ ባቢሎን
  choice: 直到巴比伦的入口
  rationale: ምብዋአ 表示“入口、进入之处”；采用较贴近原文且不额外判定具体地理边界的译法。
- source_word: ኵሉ፡ ምድር
  choice: 整个……地区
  rationale: 原义为“全地”；此处描述定居范围，现代汉语用“整个地区”自然清楚。
- source_word: እንተ፡ ገጸ፡ ጽባሕ
  choice: 朝向东方的
  rationale: ጽባሕ 可关联清晨、日出方向；在地理语境中译为“东方”，同时以“朝向”保留原文的方位表述。
