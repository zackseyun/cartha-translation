  yaml_path: translation/extra_canonical/jubilees/020/008.yaml
  text: and they will bless your children in my name, so that they may be blessed as I am. And he gave gifts to Ishmael and to his sons and to the sons of Keturah, and he sent them away from Isaac his son; but he gave everything to him
translation:
  language: zh_hans
  text: 他们要奉我的名为你们的儿女祝福，使他们像我一样蒙福。他把礼物送给以实玛利、以实玛利的儿子们和基土拉的儿子们，又打发他们离开他的儿子以撒；却把一切都给了他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”原文为阳性单数宾语，本节没有明确说明所指；从下节可理解为以撒。
    reason: 保留原文末句代词在本节内的指代含混，同时提示其跨节衔接。
lexical_decisions:
- source_word: ይባርኩ
  choice: 为……祝福
  rationale: 保留“祝福”的核心意义，并用现代汉语自然的句式表达；第三人称复数主语译为“他们”。
- source_word: ሀብተ
  choice: 礼物
  rationale: 该词在这里指亚伯拉罕分给其他儿孙的赠礼；汉语用集合意义的“礼物”即可自然涵盖一件或多件。
- source_word: ወፈነዎሙ
  choice: 又打发他们
  rationale: 准确表达“送走、遣走”及复数宾语，并符合叙事语体。
- source_word: ወኵሎ፡ ወሀቦ
  choice: 却把一切都给了他
  rationale: 保留“全部”与动词所带的阳性单数宾语，同时以“却”呈现给其他人礼物与把全部交给一人之间的对比。
theological_decisions:
- issue: “像我一样蒙福”的比较关系
  choice: 使他们像我一样蒙福
  alternative: 使他们成为像我一样有福的人
  rationale: 原文保留祝福行动与蒙福状态之间的联系；所选译法自然且不额外界定福分的性质。
- issue: 末句阳性单数宾语的所指
  choice: 译作“他”，并加注说明本节未明确指出所指
  alternative: 直接译作“以撒”
  rationale: 原文只有阳性单数宾语后缀，所指很可能由下节补明；正文不提前消除跨节形成的指代张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“奉我的名”“蒙福”“打发”保留古代祝福与家族叙事的语感，但避免生硬直译。末句按原文保留代词和略显突兀的收束，并以脚注说明。
