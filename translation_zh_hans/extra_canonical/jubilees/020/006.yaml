  text: and womb, and may He bless the seed of your body and the seed of your land, and the herds of your cattle and the flocks of
translation:
  language: zh_hans
  text: 和子宫；愿他赐福给你亲生的后裔[a]、你土地的出产，以及你的畜群和……的畜群[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你身体的种子”。这里指你亲生的后裔。
    reason: 保留 ዘርእ 与 ከርሥ 的字面意象及其所指后裔的语义范围，避免将其限定为仍在腹中的后代。
  - marker: b
    text: 本节所据原文在“和……的畜群”处截断；“畜群”也曾被理解为“所生的后代”。
    reason: 说明传入文本的不完整状态，并记录 መራዕየ 的另一种旧译理解。
lexical_decisions:
- source_word: ማኅፀነ
  choice: 子宫
  rationale: 按其基本义直译，并保留它与前文相接的句法关系；本节所给原文从上一分句中间开始。
- source_word: ዘርአ፡ ከርሥከ
  choice: 你腹中的后裔
  rationale: ዘርእ 为“种子、后裔”，ከርሥ 可指腹中、身体内部；此处自然表达为人的后裔。
- source_word: ዘርአ፡ ምድርከ
  choice: 你土地的出产
  rationale: 字面是“你土地的种子”，语境所指是土地所生的作物或出产；采用现代汉语自然说法。
- source_word: መራዕየ
  choice: 群
  rationale: 该词指放牧的兽群、畜群；第一次结合 አልህምቲከ 译作“畜群”，第二次因原文截断而保留为未完整的“……的群”。
theological_decisions:
- issue: “子宫”是赐福的宾语，还是前一分句的末项
  choice: 将“和子宫”归入前一分句，另起“愿他赐福你腹中的后裔”
  alternative: “愿他赐福你的子宫、你腹中的后裔”
  rationale: 吉兹文在 ወማኅፀነ（和子宫）之后另有 ወይባርክ（愿他赐福），赐福的直接对象从 ዘርአ፡ ከርሥከ 开始；不把名词与后面的动词错误合并。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。开头和结尾均保留所给吉兹文片段跨越上下文边界的残缺状态，不擅自补足前后内容；用分号帮助读者看清“子宫”属于前一分句，而“愿他赐福”开启新分句。
