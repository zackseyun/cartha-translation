  text: the desert. And these mingled with those, and their name was combined as Arabs and Ishmaelites.
translation:
  language: zh_hans
  text: 旷野。这些人与那些人混合，他们的名称也被合并为“阿拉伯人和以实玛利人”。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其名被称为阿拉伯人。”
    reason: 保存早期修订与旧译所采用的另一种理解；但正文依照现存格尔兹语抄本中“结合／合并”的读法。
lexical_decisions:
- source_word: ገዳም
  choice: 旷野
  rationale: 该词指荒芜、无人居住之地；“旷野”既贴近原义，也符合现代中文经书体表达。
- source_word: ተደመሩ
  choice: 混合
  rationale: 此处描述两个群体彼此掺合、融合；译作“混合”与上下文及英语审校层一致。
- source_word: ተጸምደ
  choice: 合在一起
  rationale: 抄本所见动词意为“连接、结合”，并非“称为”；此译保留其被动结合的语义，同时使中文自然。
- source_word: ዓረበ ወእስማዔላዊያን
  choice: 阿拉伯人和以实玛利人
  rationale: 按族群名称直译，并采用现代中文通行的圣经专名形式。
theological_decisions:
- issue: 群体混合与名称结合之间的关系
  choice: 保留原文先说群体混合、再说名称合在一起的双重表述
  alternative: 将后半句解释为单纯的命名：“他们被称为阿拉伯人”
  rationale: 格尔兹语抄本的动词支持“结合”而非“称为”；不以解释性改写消除原文略显特殊的表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这些人／那些人”保留原文指代关系，不擅自补明具体族群；句首“旷野”承接上一节或上一分句。
