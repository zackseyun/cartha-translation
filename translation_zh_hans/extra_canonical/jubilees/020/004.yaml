base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/004.yaml
  text: the God of heaven, and cling to all his commandments, and do not walk after their idols and after their uncleanness. And do not make for yourselves gods of cast metal or carved images, for they are emptiness, and there is no spirit in them; for they are the work of hands, and all who trust in them trust in nothing. Do not serve them, and do not bow down to them. But serve the God
translation:
  language: zh_hans
  text: ……天上的上帝，并持守他一切的诫命；不要随从他们的偶像和他们的污秽。不要为自己制造铸造的神明或雕刻的像，因为它们是虚空，其中没有灵；它们是人手所造，凡倚靠它们的，所倚靠的也是虚空。不要事奉它们，也不要向它们下拜；惟要事奉上帝……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትጸመዱ
  choice: 谨守
  rationale: 该词有紧紧依附、持守之意；在“诫命”的搭配中译作“谨守”，既自然又保留忠实遵行的力度。
- source_word: ርኵሶሙ
  choice: 污秽之物
  rationale: 保留礼仪或道德层面均可能存在的含义，不将其缩窄为单一类别。
- source_word: አማልክተ፡ ሰብክ
  choice: 铸造神像
  rationale: 按语境表达由金属铸成的神祇形像；“神像”比直译“铸造的神”更符合现代汉语。
- source_word: ግልፈዋተ
  choice: 雕像
  rationale: 指雕刻而成的形像，与前面的铸造神像形成制作方式上的对应。
- source_word: ከንቱ
  choice: 虚空无用／虚空
  rationale: 兼顾“空虚、徒然、毫无实质”的语义；后一句以“所倚靠的也是虚空”保留原文的修辞重复。
- source_word: መንፈስ
  choice: 气息
  rationale: 此处强调偶像没有生命气息；“气息”也保留该词可指风、气息、灵的语义背景。
- source_word: ታምልክዎሙ
  choice: 敬奉
  rationale: 在偶像语境中表示以神明相待、事奉或崇拜；译为“敬奉”可与“下拜”区分。
theological_decisions:
- issue: 偶像“没有灵”的表述
  choice: 里面毫无气息
  alternative: 里面没有灵
  rationale: 上下文强调人手所造之物没有生命，译作“气息”较自然，同时不否认源词“灵”的语义范围。
- issue: “凡倚靠它们的”所得结果
  choice: 所倚靠的也是虚空
  alternative: 倚靠的是虚无／终必落空
  rationale: 保留原文围绕“虚空”的重复和判断，不扩展为原文未明说的结局。
- issue: 末句残缺
  choice: 惟要敬奉上帝……
  alternative: 补足下一页或下一节内容
  rationale: 所给吉兹文止于“上帝”一词，英语审校层也同样未完；用省略号明确保存文本边界，不臆补宾语或称号。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。开头显然承接前文，因此保留为不完整的续接结构；结尾也按所给底本保留未完状态。避免使用带特定宗派色彩的术语。
