  yaml_path: translation/extra_canonical/jubilees/007/008.yaml
  text: And Ham saw Noah his father naked[a], and he went out and told his two brothers outside. And Shem took a garment, and he and Japheth laid the garment on their shoulders.
translation:
  language: zh_hans
  text: 含看见父亲挪亚赤身露体，就出去，把这事告诉了他的两个兄弟。闪拿了一件衣服，与雅弗一同把衣服搭在肩上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节在所据吉兹语文本中止于闪和雅弗把衣服搭在肩上；他们随后倒退而行、遮盖父亲的动作属于下一分节。
    reason: segmentation_note
lexical_decisions:
- source_word: ዕራቆ
  choice: 赤身露体
  rationale: 准确表达“裸身、没有遮盖”的状态，措辞庄重自然，不额外引入“羞辱”等解释。
- source_word: በአፍአ
  choice: 外面的
  rationale: 保留原文“在外面”的空间信息，并自然地修饰含出去后所告知的两个兄弟。
- source_word: ልብሰ
  choice: 一件衣服
  rationale: 原词泛指衣物；用“一件衣服”符合汉语叙事习惯，又不擅自限定衣物种类。
- source_word: መታክፍቲሆሙ
  choice: 肩上
  rationale: 按原文复数领属结构表达为他们共同的“肩上”，中文以“一同……搭在肩上”自然呈现。
theological_decisions:
- issue: 是否把下一分节中倒退遮盖父亲的动作并入本节
  choice: 本节止于把衣服搭在肩上
  alternative: 继续译出倒退而行、遮盖父亲赤身等动作
  rationale: 所提供的吉兹语本节文本只到衣服放在二人肩上；为尊重当前原文分节，不将后续材料移入本节。
- issue: 如何表达挪亚的裸身状态
  choice: 直译为“赤身露体”
  alternative: 解释为“父亲的羞处”或其他带评价色彩的说法
  rationale: 原文仅陈述裸身事实；直译保留叙事张力，不加入神学或道德解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“赤身露体”保留经文语感但仍属现代读者熟悉的表达；句法简洁，并依所给吉兹语文本维持本节边界。
