base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/003.yaml
  text: 'On the new moon of the first month, he made a feast on that day with rejoicing, and he made a burnt offering to the LORD: one young bull, one ram, seven yearling sheep, and one male goat, so that he might make atonement for himself and for his sons.'
translation:
  language: zh_hans
  text: 正月初一[a]，他在那一天欢欢喜喜地举行宴会，又向耶和华献上燔祭：一头公牛犊、一只公绵羊、七只一岁的羊[b]和一只公山羊，为自己和众子赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“第一个月的月朔”。
    reason: 保留源文历法表达；“正月初一”是自然的现代汉语译法。
  - marker: b
    text: 或译“一岁大的七只羊”。
    reason: 说明“一岁”修饰羊群中的每一只，并保留另一种自然语序。
lexical_decisions:
- source_word: በሠርቀ፡ ወርኀ፡ ቀዳሚት
  choice: 正月初一
  rationale: 字面意为“在第一个月的月朔”；按现代汉语通常以“正月初一”表达该历法日期，并用脚注保留“月朔”的字面信息。
- source_word: በዓለ
  choice: 举行宴会
  rationale: 此处指设宴庆祝；“举行宴会”在现代汉语中自然，也与随后“欢欢喜喜地”相配。
- source_word: ጽንሓሐ
  choice: 燔祭
  rationale: 指祭物全然焚烧献上的祭祀，采用中文圣经传统且准确的祭祀术语“燔祭”。
- source_word: ለእግዚአብሔር
  choice: 向耶和华
  rationale: 神名在此以格尔兹语常用称谓出现；依上下文及中文圣经惯例译作“耶和华”。
- source_word: ዋ፡ እምአልህምቱ፡ አሐደ
  choice: 一头公牛犊
  rationale: 祭牲清单所指为一头幼公牛；“公牛犊”既保留性别与幼龄信息，也符合汉语祭牲表述。
- source_word: አባግዐ፡ ዘዘ፡ ዓመት፡ ሰብዐተ
  choice: 七只一岁的羊
  rationale: 明确保留“羊”“七只”及“一岁”三个要素；源文未在此进一步限定性别。
- source_word: መሐስአ፡ ጢለ፡ አሐደ
  choice: 一只公山羊
  rationale: 译出山羊及雄性含义；比拘泥字面的表达更自然清楚。
- source_word: ከመ፡ ያስተስሪ፡ ቦቱ
  choice: 为……赎罪
  rationale: 该动词在献祭语境中表达施行遮盖或赎罪；“为……赎罪”保留祭祀与神学意味。
theological_decisions:
- issue: 赎罪行为的表达
  choice: 为自己和众子赎罪
  alternative: 替自己和众子献上赎罪祭
  rationale: 源文强调借此“赎罪”的目的，并未把所献祭物直接称为“赎罪祭”；因此保留目的性表达，避免把燔祭改判为另一祭类。
- issue: 神名的译法
  choice: 耶和华
  alternative: 主
  rationale: 采用中文圣经中对四字神名的通行对应，但不借此增添源文以外的教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。祭祀术语沿用读者熟悉的“燔祭”“赎罪”，牲畜名称则用当代自然量词和名称。
