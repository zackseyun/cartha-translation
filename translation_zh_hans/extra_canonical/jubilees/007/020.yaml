  yaml_path: translation/extra_canonical/jubilees/007/020.yaml
  text: And in the twenty-eighth jubilee, Noah began to command the ordinances and the commandments to his children's children, and all the judgments[a] that he knew. And he testified to his children that they should do righteousness, and cover the shame of their flesh, and bless their Creator,[b] and honor father and mother, and love each one his neighbor, and guard their souls from fornication and uncleanness and all iniquity.
translation:
  language: zh_hans
  text: 在第二十八个禧年，挪亚开始向他的孙辈传授律例、诫命和一切他所知道的判例[a]。他又郑重嘱咐自己的儿女，要行公义，遮盖肉身的羞耻，称颂那创造他们的[b]，孝敬父母，各人爱自己的同伴，并保守自己，远离淫乱、污秽和一切不义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “判例”或译“公正”。
    reason: 原词兼有法律裁断与公正的语义；在此与“律例、诫命”并列，正文取其法律语境。
  - marker: b
    text: 原文直译：“那创造他们的”。
    reason: 保留原文的关系从句表达；正文未增入原文没有的称谓。
lexical_decisions:
- source_word: ለውሉደ፡ ውሉዱ፡
  choice: 给他的孙辈
  rationale: 字面为“给他儿女的儿女”，即孙辈；简洁表达且不增加世代。
- source_word: ፍትሐ
  choice: 法则
  rationale: 该词可指审判、公正或法律判例；与“律例、诫命”并列时，“法则”符合这里的法律语域，同时以脚注保留“公正”的可能。
- source_word: አስምዐ፡ ላዕለ
  choice: 告诫
  rationale: 原文含向某人郑重作证、警戒之意；此处是挪亚对后代提出伦理要求，“告诫”自然并保留庄重语气。
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: 身体的羞处
  rationale: 较直译地保留“肉身之羞耻”的委婉表达，指应遮盖的裸露部位。
- source_word: ለዘፈጠሮሙ
  choice: 那创造他们的主
  rationale: 原文直译为“那创造他们的”；补出“主”使汉语句子完整自然，并用脚注注明其字面形式。
- source_word: ነፍሶሙ
  choice: 自己的生命
  rationale: 原词可指灵魂、自身或生命；在“保守……远离”这一伦理语境中译作“生命”，避免把含义窄化为特定的灵魂论。
- source_word: ዝሙት፡ ወርኵስ፡ ወኵሉ፡ ዐመፃ
  choice: 淫乱、污秽和一切不义
  rationale: 分别对应性淫乱、礼仪或道德污秽，以及广义的违法邪恶；采用现代、庄重且易懂的伦理用语。
theological_decisions:
- issue: “那创造他们的”是否名词化为“创造主”
  choice: 那创造他们的主
  alternative: 他们的创造主／那创造他们的
  rationale: 既保持原文关系从句的强调，又使现代汉语表达完整；脚注保留字面结构，不引入额外的创造论限定。
- issue: “彼此相爱”的对象范围
  choice: 彼此相爱
  alternative: 各人爱自己的邻舍
  rationale: 原文逐字近于“各人爱他的同伴”；“彼此相爱”自然呈现群体内相互之爱，而不把“同伴”扩大或限定为后世特定神学术语。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“禧年、律例、诫命、公义”等保留古代宗教法律语境；避免过度古雅。“孙辈”准确对应“他儿女的儿女”。所有脚注标记均已置于正文相应位置。
