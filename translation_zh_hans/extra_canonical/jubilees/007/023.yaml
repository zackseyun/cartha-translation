  text: and a man his neighbor. And everyone sold himself to do injustice and to shed much blood.
translation:
  language: zh_hans
  text: 人也这样对待邻舍。人人都出卖自己，去行不义，流许多血。〔a〕
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: 人待邻舍也是如此
  rationale: 原文是承接上文的省略结构，字面近于“人也（对）他的邻舍”；译文补出汉语所需的“待……如此”，同时保留其承接性，不另行指定具体恶行。
- source_word: ኵሉ፡ ተሰይጠ
  choice: 人人都出卖自己
  rationale: 保留动词的反身含义以及“所有人”的普遍范围；虽在汉语中语气强烈，却准确传达主动委身于恶的意象。
- source_word: ይግበር፡ ዐመፃ
  choice: 去行不义
  rationale: ዐመፃ可指不义、暴行或悖逆；此处选较宽泛的“不义”，避免把含义限定为单纯的暴力。
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: 流许多血
  rationale: 按原文保留“倾流大量血”的直接表达，不擅自补入“在地上”或指定受害者。
theological_decisions:
- issue: “出卖自己”是否应解释为卖给罪恶或不义
  choice: 不补明买主或对象
  alternative: 人人都把自己卖给不义
  rationale: 原文只表达反身性的“出卖自己”，补出“不义”为交易对象会消除原文的开放性，并加入原文没有明说的神学解释。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。首句按原文的承接性省略结构作最低限度补足；后句保留“出卖自己”的鲜明意象及“不义—流血”的并列推进。
