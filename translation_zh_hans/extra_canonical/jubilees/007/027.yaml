revisions:
- from: '我的孩子们，你们要[彼此相爱][a]。因为我看见了：看哪，邪灵已经开始引诱你们和你们的儿女犯罪。如今我为你们担心，恐怕我死后，你们会在地上流人的血，自己也从地面上被除灭。凡流人血的，以及吃任何血肉之物的血的，都必从地上除灭。[b]凡吃血或在地上流人血的，一个也不会留下；他在天下不会有子孙后代存留。他们必往阴间去，必下到受审判之地，进入深渊的黑暗；他们都必横死。


    你们宰杀走兽、牲畜或地上爬行之物时，不可让它们所流的血沾在你们身上；要把流在地面上的血用土掩盖，为自己的性命行善。你们不可像那些连血一起吃的人，务要坚决不吃血。要在自己面前把血掩盖，因为我奉命这样向你们和你们的儿女作证，也向一切血肉之物作证。不可把生命连同肉一起吃，免得你们的血，就是你们的生命，要从地上一切流你们血的血肉之物手中追讨。地不能除净流在其上的血；惟有借着流血者的血，地才会世世代代得以洁净。


    现在，我的孩子们，要听从：你们要秉公行义，好使你们在全地之上按公义扎根，使你们的荣耀在我的上帝面前被高举；他曾救我脱离洪水。看哪，你们要去，为自己建造城邑，在其中栽种地上的各种植物和各样结果子的树。前三年，树的果子不可收取，也不可食用；第四年才可收取果子，并把初熟之物献到创造天地万有的至高主面前。要把初酿的酒和初榨的油，连同初熟的果子，一并献在主的祭坛上，使之蒙悦纳；余下的，要由主殿中的祭司食用。'
  to: '我的孩子们，你们要[彼此相爱][a]。因为我看见了：看哪，邪灵已经开始向你们和你们的儿女犯罪。如今我为你们担心，恐怕我死后，你们会在地上流人的血，自己也从地面上被除灭。凡流人血的，和凡吃任何有血肉之物的血的，都必从地上除灭。[b]凡吃血或在地上流人血的，一个也不会留下；他在天下不会有子孙后代存留。他们必往阴间去，必下到受审判之地，进入深渊的黑暗；他们都必横死。


    你们宰杀走兽、牲畜或地上爬行之物时，不可让所流的血归在你们身上；要把流在地面上的血用土掩盖，为自己的性命行善。你们不可像那些连血一起吃的人，务要坚决不吃血。要把血掩盖起来，因为我奉命这样向你们和你们的儿女，并同一切有血肉的，作见证。不可把生命连同肉一起吃，免得你们的血，就是你们的生命，从一切在地上流你们血的有血肉之物手中被追讨。地不能从流在其上的血得洁净；惟有借着流那血之人的血，地才会在世世代代得以洁净。


    现在，我的孩子们，要听从：你们要秉公行义，好使你们在全地之上按公义扎根，使你们的荣耀在我的上帝面前被高举；他曾救我脱离洪水。看哪，你们要去，为自己建造城邑，在其中栽种地上的各种植物和各样结果子的树。前三年，凡可食用的果子都不可收取；第四年，果子才可食用，并要把初熟的出产献到创造天地万有的至高主面前。要把初酿的酒、初榨的油和初熟的出产献在主的祭坛上，使之蒙悦纳；余下的，要在主的殿中食用。'
  rationale: 修订以现存吉兹文本为先，并参照英文审计轨迹。删除“引诱”和“祭司”等无明确文本根据的补充；调整禁血段落的句法和现代汉语表达；明确第四年果实可食，同时保留初熟出产献于主前及余物在主殿中食用的原文信息。保留方括号中的残缺补足及原有分节说明脚注。
