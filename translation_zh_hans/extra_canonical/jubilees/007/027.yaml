  text: 'My children, [love] one another. For I see, and behold, the demons have begun to sin against you and against your children, and now I fear for you, that after my death you will shed the blood of men on the earth, and you yourselves will be destroyed from the face of the earth. For everyone who sheds the blood of man[a], and everyone who eats the blood of any flesh, will all be destroyed from the earth. And no man who eats blood, or who sheds the blood of man on the earth, will be left; neither seed nor descendants will remain to him under heaven. For into Sheol they will go, and into the place of judgment they will descend, and into the darkness of the deep they will all enter by a violent death. Let no blood appear upon you from all the blood there is in all the days in which you slaughter any beast or cattle or whatever creeps on the earth; and do a good work for your souls by covering with earth that which has been poured out on the face of the earth. And do not be like one who
    eats with the blood, but be strong not to eat blood before you; cover the blood, for thus I have been commanded to testify to you and to your children, together with all flesh. And do not eat the life with the flesh, so that your blood, which is your life, may not be required from the hand of any flesh that sheds it on the earth. For the earth will not be cleansed from the blood that has been poured out upon it, except by the blood of the one who poured it out will the earth be cleansed throughout all its generations. And now, my children, listen: do justice and righteousness, so that you may be planted in righteousness over the face of the whole earth, and your glory may be lifted up before my God, who saved me from the waters of the flood. And behold, go and build for yourselves cities, and plant in them every plant that is on the earth, and every fruit-bearing tree.'
translation:
  language: zh_hans
  text: '我的孩子们，你们要[彼此相爱][a]。因为我看见了：看哪，邪灵已经开始向你们和你们的儿女犯罪。如今我为你们担心，恐怕我死后，你们会在地上流人的血，自己也从地面上被除灭。凡流人血的，和凡吃任何有血肉之物的血的，都必从地上除灭。[b]凡吃血或在地上流人血的，一个也不会留下；他在天下不会有子孙后代存留。他们必往阴间去，必下到受审判之地，进入深渊的黑暗；他们都必横死。


    你们宰杀走兽、牲畜或地上爬行之物时，不可让所流的血归在你们身上；要把流在地面上的血用土掩盖，为自己的性命行善。你们不可像那些连血一起吃的人，务要坚决不吃血。要把血掩盖起来，因为我奉命这样向你们和你们的儿女，并同一切有血肉的，作见证。不可把生命连同肉一起吃，免得你们的血，就是你们的生命，从一切在地上流你们血的有血肉之物手中被追讨。地不能从流在其上的血得洁净；惟有借着流那血之人的血，地才会在世世代代得以洁净。


    现在，我的孩子们，要听从：你们要秉公行义，好使你们在全地之上按公义扎根，使你们的荣耀在我的上帝面前被高举；他曾救我脱离洪水。看哪，你们要去，为自己建造城邑，在其中栽种地上的各种植物和各样结果子的树。前三年，凡可食用的果子都不可收取；第四年，果子才可食用，并要把初熟的出产献到创造天地万有的至高主面前。要把初酿的酒、初榨的油和初熟的出产献在主的祭坛上，使之蒙悦纳；余下的，要在主的殿中食用。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存吉兹文本此处残缺，字面仅存“我的孩子们，一个……同他的弟兄”；“彼此相爱”是按语境补足的。
    reason: textual_note
  - marker: b
    text: 现存行文把关于流血、禁食血、栽种和初熟果实的长篇训诫合并在一个延长的经节单元中；较完整的版本可能将其划分为多个经节。
    reason: segmentation_note
lexical_decisions:
- source_word: አጋንንት
  choice: 邪灵
  rationale: 该词通常指邪恶的灵界存在；“邪灵”比现代汉语中易带民俗色彩的“鬼魔”更自然，同时保留其超自然含义。
- source_word: ውስተ፡ ሲኦል
  choice: 往阴间去
  rationale: 保留 Sheol 作为死人归宿的古代语义，不将其直接等同于后期神学意义上的“地狱”。
- source_word: መካን፡ ዘይደኑ
  choice: 受审判之地
  rationale: 直译其作为施行审判之处的含义，不进一步判定具体末世刑罚体系。
- source_word: ነፍስ
  choice: 生命／性命
  rationale: 在禁血语境中指生命本身；依汉语搭配分别译作“生命”和“性命”，避免误读为与身体分离的灵魂。
- source_word: ፍትሐ፡ ወጽድቀ
  choice: 秉公行义
  rationale: 同时表达公正审断与正直行为，采用自然而庄重的现代汉语。
- source_word: ቀዳሜ፡ ፍሬ
  choice: 初熟之物
  rationale: 准确传达最先成熟并献上的出产，与后文酒、油和果子的初产相呼应。
- source_word: ባእዛኒ፡ ቤተ፡ እግዚአብሔር
  choice: 主殿中的祭司
  rationale: 该表达在礼仪语境中指主殿的祭司群体；如此翻译使余下祭物的领受者清楚。
theological_decisions:
- issue: 血与生命的关系
  choice: “你们的血，就是你们的生命”
  alternative: “你们灵魂的血”
  rationale: 源文把血与生命紧密并置；译为同位关系既符合上下文，也避免引入灵魂具有血液的观念。
- issue: 流血使土地得洁净的陈述
  choice: “惟有借着流血者的血，地才会……得以洁净”
  alternative: 解释为司法死刑或赎罪祭
  rationale: 源文保留了严峻而未展开的血偿逻辑；正文不额外指定执行机制或建立后期赎罪理论。
- issue: 献初熟果实的对象
  choice: “献到……至高主面前”
  alternative: “奉献给至高主”
  rationale: 保留源文的礼仪空间表达，又不改变献祭对象。
- issue: 开头残缺命令
  choice: 以方括号补作“彼此相爱”
  alternative: 直译为不完整的“一个人与他的弟兄”
  rationale: 现存吉兹文本语法残缺，但上下文及传统复原支持“彼此相爱”；用方括号明确标示补足，避免把推定内容伪装成无争议原文。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。保留古代法律与礼仪语汇的力度，但避免过度文言化；段落按主题分为流血警告、禁血命令及栽种与初熟果实条例。方括号仅用于标示源文残缺处的必要补足。
