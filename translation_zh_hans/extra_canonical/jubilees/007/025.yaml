  yaml_path: translation/extra_canonical/jubilees/007/025.yaml
  text: The thoughts and desires of man imagine what is vain and evil continually, and the Lord destroyed everything from the face of the earth because of the evil of their deeds and because of blood.
translation:
  language: zh_hans
  text: 人的心思和欲望终日所想的，尽是虚妄和邪恶；主因他们行为邪恶，又因流血之事，就从地面上除灭了一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流血之事”原文直译为“血”。
    reason: 保留源文简略措辞及其可能涵盖血债、暴力流血的语义张力。
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ፡
  choice: 人的心思和欲望
  rationale: 分别保留“心思/意念”与“欲望/意愿”两个并列概念；单数“人”在此作人类总称，汉语用“人的”自然表达。
- source_word: ይኄሊ፡
  choice: 所想的
  rationale: 该动词表示思想、考虑或设想，不弱化为单纯系词“是”。
- source_word: ከንተ፡ ወእኩየ፡
  choice: 尽是虚妄和邪恶
  rationale: 同时保留“虚妄/空虚”与“邪恶”两个成分，避免遗漏前者。
- source_word: በኵሉ፡ መዋዕል።
  choice: 终日
  rationale: 自然表达“一切日子/不断”的持续含义。
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እም ... ገጸ፡ ምድር፡
  choice: 主……就从地面上除灭了一切
  rationale: “除灭”体现毁灭、抹除之义；“从地面上”保留源文空间表达。
- source_word: በእንተ፡ እኩይ፡ ምግባሮሙ፡ ወበእንተ፡ ደም፡
  choice: 因他们行为邪恶，又因流血之事
  rationale: 前项表达其行为的邪恶，后项“血”在语境中指造成血债或流血；译作“流血之事”使现代读者易懂，同时用脚注保留字面形式。
theological_decisions:
- issue: “一切”所指范围
  choice: 保留“一切”，不在正文补出具体对象
  alternative: 译作“所有生灵”或“所有人”
  rationale: 源文仅用“全部/一切”，具体范围有语境依赖；不擅自缩窄或扩张。
- issue: “血”的含义
  choice: 正文译“流血之事”，并脚注说明字面为“血”
  alternative: 直译“因血”或解释为“因杀人流血”
  rationale: 既传达洪水审判语境中的血债含义，也不把源文未明说的具体罪名绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“终日所想的，尽是……”兼顾源文动词“想”及持续性；避免古奥表达，也不加入宗派性解释。
