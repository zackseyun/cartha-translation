base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/030.yaml
  text: For thus Enoch, the father of your father, commanded his son Methuselah, and Methuselah commanded his son Lamech, and Lamech commanded me everything that his fathers commanded him.
translation:
  language: zh_hans
  text: 因为以诺——你们父亲的父亲——曾这样吩咐他的儿子玛土撒拉；玛土撒拉又吩咐他的儿子拉麦；拉麦也把他祖先所吩咐他的一切，都吩咐了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አቡሁ፡ ለአቡክሙ
  choice: 你们祖父的父亲
  rationale: 按属格关系直译，保留以诺相对于听众的世代关系，并避免把随后出现的“玛土撒拉”误作其同位语。
- source_word: አዘዘ
  choice: 吩咐
  rationale: 准确表达长辈向后代传授并命令遵守的语义，也适合本节反复出现的传承链条。
- source_word: ወእዱ
  choice: 他的儿子
  rationale: 依上下文理解为表示父子关系的短语，使“以诺—玛土撒拉—拉麦—挪亚”的传承次序清楚自然。
- source_word: አበዊሁ
  choice: 他列祖
  rationale: 保留复数所指，表示拉麦之前的祖先们，而不缩减为单数“父亲”。
theological_decisions:
- issue: 祖传命令的传承链条
  choice: 明确译为以诺吩咐儿子玛土撒拉、玛土撒拉吩咐儿子拉麦、拉麦吩咐“我”
  alternative: 把玛土撒拉处理为“你们祖父”的同位语
  rationale: 源文中“玛土撒拉”是以诺所吩咐的对象，并与“他的儿子”构成同位关系；所选译法保存正确的家谱次序，不引入额外神学解释。
translation_notes:
  register: 采用庄重而自然的现代汉语。“你们祖父的父亲”虽略显重复，却准确保存源文亲属关系；用破折号标明插入说明，并以分号呈现逐代传承的节奏。
