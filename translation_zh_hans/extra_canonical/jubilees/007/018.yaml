base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/018.yaml
  text: The sons of Japheth were Gomer and Magog and Madai and Javan, Tubal and Meshech and Tiras.
translation:
  language: zh_hans
  text: 闪的儿子是以拦、亚述、亚法撒——他生于洪水之后第二年——还有路德和亚兰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: 闪的儿子
  rationale: 按字面表达亲属关系，并采用现代中文圣经读者熟悉的人名译法。
- source_word: ኤላም፡ ወአሱር፡ ወአርፋክስድ
  choice: 以拦、亚述、亚法撒
  rationale: 保留原文名单的次序及并列关系，采用通行音译。
- source_word: ዝንቱ፡ ትውልደ፡ ክልኤ፡ ዓም፡ እምድኅረ፡ አይኅ
  choice: 他生于洪水之后第二年
  rationale: 将指向亚法撒的说明性分句自然译出；“洪水之后第二年”保留原文纪年方式。
- source_word: ወሉድ፡ ወአራም
  choice: 还有路德和亚兰
  rationale: 恢复插入说明之后的名单结构；以“还有”使现代汉语衔接清楚。
