  to: 还有不洁和一切强暴。洪水临到地上，正是因为这三件事：因为守望者违背了为他们所定的命令，追随人的女子而行淫；他们从所选择的一切女子中娶了妻子，并且开创了不洁。
  rationale: 修订以吉兹语文本为准，保留其承接上文的列举、对洪水原因的重复因果说明、守望者违令而追随人的女子行淫、任意择妻，以及“不洁之开端”等要点。译文避免将英语审校层中与本节不相干的脚注引入中文文本。
