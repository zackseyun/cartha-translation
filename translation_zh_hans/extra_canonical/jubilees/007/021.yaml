    rationale: 该词可涵盖不义/暴行，但在洪水传统及本句列罪语境中，“强暴”是更直接、具体的对应。
  - severity: medium
    issue: “他们所得规条的命令”不够自然且未清楚表达命令是为守望者所定。
    rationale: 原文所说的是为他们所定的命令；改为“为他们所定的命令”可避免“规条的命令”的层叠和语义含混。
  - severity: low
    issue: 句首“以及”及“从自己所中意的女子中娶妻”不符合自然现代汉语。
    rationale: 前者应改为“还有”以承接上文；后者可简化为“从他们所选择的一切女子中娶了妻子”，同时保留“all whom they chose”的范围。
  - severity: low
