base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/021.yaml
  text: And uncleanness and all lawlessness. For because of these three things the flood came upon the earth[a], because of the fornication by which the Watchers committed fornication contrary to the command of their ordinances, going after the daughters of men, and they took for themselves wives from all whom they chose, and they made the beginning of uncleanness.
translation:
  language: zh_hans
  text: 还有不洁和一切强暴。洪水临到地上，正是因为这三件事：因为守望者违背了为他们所定的命令，追随人的女子而行淫；他们从所选择的一切女子中娶了妻子，并且开创了不洁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኵስ / ርኵሰ
  choice: 不洁／不洁之事
  rationale: 该词在本节首尾呼应，兼有污秽、不洁之义；统一译法可保留原文的框架结构。
- source_word: ዐመፃ
  choice: 不法之事
  rationale: 此词可指违法、悖逆或强暴；在概括洪水成因的语境中，“不法之事”既自然，又不把含义限缩为单一罪行。
- source_word: አይኅ
  choice: 洪水
  rationale: 指降在全地的洪水，与《创世记》洪水传统相符。
- source_word: ትጉሃን
  choice: 守望者
  rationale: 这是以诺传统中该类天上存在的固定称谓；“守望者”能保留其专名性质。
- source_word: ዝሙት ዘዘመዉ
  choice: 行淫
  rationale: 原文采用同根名词与动词的强调结构，直译会显得累赘；“而行淫”自然传达其核心意义。
- source_word: ገብሩ መቅድመ ርኵሰ
  choice: 开了不洁之事的先河
  rationale: 原义为“造出了不洁的开端”；此译保留其首创、肇始之意，同时符合现代汉语表达。
theological_decisions:
- issue: 守望者的罪与所得命令之间的关系
  choice: 译作“违背了他们所得规条的命令，追求人的女子而行淫”
  alternative: “他们所行的淫乱，就是违背自身规条的命令，去追求人的女子”
  rationale: 原文语序紧密，可将“违背命令”理解为修饰其追逐人的女子并行淫的行为。正文采用较自然的汉语句法，脚注保留另一种结构理解。
- issue: “三件事”的所指
  choice: 保留“这三件事”，不在本节补明
  alternative: 根据上下文列出三项罪恶
  rationale: 本节本身使用指示语回指上文；擅自补列会消除原文的篇章依赖，并可能引入解释性判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以及”保留本节开头承接上文的片段性质；“娶妻”与“不洁之事的先河”兼顾古代叙事语域和普通读者的可读性。未采用英文咨询层中与本节现有吉兹语无关的巨人族群脚注。
