  naturalness: “以及不洁”作为句首承接语在现代汉语中不自然；“自己所中意的女子中娶妻”亦显得累赘。调整后保留承接上文的片段性质，同时更通顺。
  terminology: 保留“守望者”“洪水”“不洁”。“守望者”作为以诺传统用语适切；本节无须沿用英语审校记录中误置、且与本节无关的巨人术语脚注。
