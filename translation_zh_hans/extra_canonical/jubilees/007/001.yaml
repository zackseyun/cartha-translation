base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/001.yaml
  text: And in the seventh week, in its first year, in this jubilee, Noah planted a vine on the mountain on which the ark had come to rest, whose name was Lubar, one of the mountains of Ararat; and in the fourth year it produced fruit.
translation:
  language: zh_hans
  text: 在这个禧年的第七个七年期第一年，挪亚在方舟停泊的那座山上栽种了一株葡萄藤；那山名叫路巴尔，是亚拉腊群山中的一座。到了第四年，葡萄藤结了果子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ፡ ሳብዕ
  choice: 第七个七年期
  rationale: “ሱባዔ”在《禧年书》的年代体系中指由七年组成的周期；译为“七年期”比单作“周”更能让现代读者理解。
- source_word: በዝ፡ አቆቤጼዉ
  choice: 在这个禧年
  rationale: 依英语校勘层及本书年代语境理解为“在这个禧年”，并将其前置，使中文纪年结构自然。
- source_word: ወይነ
  choice: 一株葡萄树
  rationale: 此处指挪亚栽种的葡萄藤；现代汉语通常称“葡萄树”，并以“一株”明确其植物义。
- source_word: ደብር
  choice: 山
  rationale: 按其基本地理含义译为“山”。
- source_word: አዕረፈት፡ ታቦት
  choice: 方舟停泊
  rationale: 保留“方舟安歇、停住”的意象；“停泊”与方舟搭配自然，且不额外解释事件。
- source_word: ሉባር
  choice: 路巴尔
  rationale: 按专名音译，避免将名称释义化。
- source_word: አድባረ፡ አራራት
  choice: 亚拉腊群山中的一座
  rationale: 原文为复数“亚拉腊诸山”；此译既保留群山概念，也说明路巴尔是其中一座。
- source_word: ገብረ፡ ፍሬ
  choice: 结了果子
  rationale: 直译其结果之义，主语依近接语境明确为葡萄树。
