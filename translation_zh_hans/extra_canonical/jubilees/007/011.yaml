  yaml_path: translation/extra_canonical/jubilees/007/011.yaml
  text: May God enlarge Japheth, and may God dwell in the dwellings of Shem; and let Canaan be his servant.”
translation:
  language: zh_hans
  text: 愿上帝扩张雅弗，愿上帝住在闪的帐棚里；愿迦南作他的仆人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 上帝
  rationale: 原文是通常表示“上帝／神”的称谓，并非表示四字神名；译作“上帝”既准确又符合庄重的现代汉语。
- source_word: ያስፋሕ
  choice: 扩张
  rationale: 保留使雅弗得以扩展、增广的空间意象，也呼应雅弗名字相关的文字意味。
- source_word: ይኅድር
  choice: 住在
  rationale: 表达居住、安居之意，不额外解释此句所涉及的神学含义。
- source_word: ማኅደሪ
  choice: 帐棚
  rationale: 在此指居所或帐棚；结合族长时代语境，译作“帐棚”自然且具体。
- source_word: ገብሮ
  choice: 他的仆人
  rationale: 准确表达从属服事关系；用“他的”保留原文代词所可能具有的指代张力，不在正文中擅自消解。
theological_decisions:
- issue: 两处“上帝”的称谓
  choice: 两处都译为“上帝”
  alternative: 将其中一处或两处译为“耶和华／主”
  rationale: 吉兹语两处均明确使用እግዚአብሔር，不能据《创世记》的熟悉措辞导入原文未有的四字神名。
- issue: “住在闪的帐棚里”的主语
  choice: 明确保留“上帝”为主语
  alternative: 理解为雅弗住在闪的帐棚里
  rationale: 本节吉兹语在该分句再次明说“上帝”，因此中文应忠实呈现，不沿用其他文本传统中可能产生的主语歧义。
- issue: “他的仆人”的代词指向
  choice: 保留“他的”
  alternative: 明译为“雅弗的仆人”或“闪的仆人”
  rationale: 原文使用第三人称单数代词；中文保留代词可避免超出文本明确程度而指定所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留祝福诗句的三个并列祈愿分句。正文无脚注标记，因为本节无需以脚注补充异文或必要说明。
