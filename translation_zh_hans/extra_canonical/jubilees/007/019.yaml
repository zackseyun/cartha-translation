  yaml_path: translation/extra_canonical/jubilees/007/019.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee Noah began to command the ordinances and the commandments to his sons' sons, and all the judgments that he knew; and he testified to his sons that they should do righteousness, and that they should cover the shame of their flesh, and that they should bless their Creator, and honor father and mother, and each one love his neighbor, and guard themselves from fornication and uncleanness and all injustice.
translation:
  language: zh_hans
  text: 这些就是挪亚的儿子。在第二十八个禧年，挪亚开始把律例、诫命和自己所知道的一切法则传给他的孙辈。他又告诫自己的儿子，要行公义，遮盖身体的羞处，称颂他们的创造者，孝敬父母，各人爱邻舍，并保守自己远离淫乱、污秽和一切不义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዛተ
  choice: 律例、诫命
  rationale: 分别对应制度性规范与明确命令，采用现代中文宗教文献中自然且易懂的固定搭配。
- source_word: ፍትሐ
  choice: 法则
  rationale: 此处指挪亚所知道并传授的公正裁断或规范；译作“法则”既保留法律意味，也避免误解为具体判决。
- source_word: ይክድኑ፡ ኃፍረተ፡ ሥጋሆሙ
  choice: 遮盖身体的羞处
  rationale: 贴近原文“遮盖他们肉身的羞耻”，以自然现代中文表达身体裸露所带来的羞耻。
- source_word: ይባርክዎ፡ ለዘፈጠሮሙ
  choice: 称颂创造他们的主
  rationale: 原文动词可指祝福、颂赞；受词为创造者，中文用“称颂”最自然。“主”由语境补出，以免“创造他们的那一位”过于生硬。
- source_word: ያፍቅሩ፡ አሐዱ፡ አሐዱ፡ ቢጾ
  choice: 彼此相爱
  rationale: 原文直译为“各人爱同伴”；“彼此相爱”准确传达相互关爱的要求，并符合现代汉语。
- source_word: ዝሙት፡ ወርኵስ፡ ወእምኵሉ፡ ዐመፃ
  choice: 淫乱、污秽和一切不义
  rationale: 依次保留性方面的越轨、礼仪或道德污秽，以及广义的恶行或暴行。
theological_decisions:
- issue: “创造他们的”是否明确称为“上帝”
  choice: 称颂创造他们的主
  alternative: 称颂创造他们的那一位／称颂创造他们的上帝
  rationale: 原文用关系表达“创造他们者”，未在此短语中出现明确神名；“主”自然指向创造者，又不增加特定神学称号。
- issue: ዐመፃ 的道德范围
  choice: 一切不义
  alternative: 一切暴行／一切悖逆
  rationale: 该词可涵盖不法、暴力和悖逆；本节是概括性的伦理训诫，因此正文用较宽泛的“不义”，脚注保留其可能含有暴行或悖逆之意。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“禧年”“律例、诫命”等保留作品的古代宗教与历法语境；句式适度拆分，便于普通读者理解。
