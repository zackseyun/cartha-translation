base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/022.yaml
  text: And they fathered the children of the Naphidim, and all of them were unlike one another, and they devoured one another; and the giants killed the Naphil, and the Naphil killed the Elyo, and the Elyo mankind.
translation:
  language: zh_hans
  text: 他们生了儿子，就是纳菲丁[a]；他们全都彼此不同，并且互相吞吃。巨人杀了纳菲勒[b]，纳菲勒杀了埃利约[c]，埃利约又杀了人类。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纳菲丁”按吉兹文 ናፊዲም 音译，是此处所生者的名称；原文将其与后文的“纳菲勒”区别开来。
    reason: 避免“纳菲丁的子孙”在中文中造成所属关系的歧义，并保留两个不同名称的差异。
  - marker: b
    text: “纳菲勒”按吉兹文 ናፊል 音译，原文形式不同于“纳菲丁”。
    reason: 防止读者将两个近似名称视为完全相同。
  - marker: c
    text: “埃利约”按吉兹文 ኤልዮ 音译；其确切所指不明。
    reason: 如实标示该罕见名称的词义不确定性，避免过度解释。
lexical_decisions:
- source_word: ናፊዲም
  choice: 纳菲丁
  rationale: 按音转写这一身份不明的族类名称，避免把它与下文形式不同的“ናፊል”混为一谈。
- source_word: ኢይትማሰሉ
  choice: 彼此全不相同
  rationale: 表达否定式“并不相似”，并依上下文补明相互关系，使现代汉语自然而不增加解释。
- source_word: ወይበልዕ፡ አሐዱ፡ አሐዱ፡ ካልኦ
  choice: 并且互相吞吃
  rationale: 原文逐字近于“一个吃另一个”，用“互相吞吃”保留其残酷、直接的含义。
- source_word: ይርባሕ
  choice: 巨人们
  rationale: 依该段所列不同巨人族类的语境及校勘传统译为“巨人们”；用复数配合后续各族类间的争杀。
- source_word: ናፊል
  choice: 纳菲勒
  rationale: 按音转写，并刻意区别于“ናፊዲም”（纳菲丁），保存原文的分类差异。
- source_word: ኤልዮ
  choice: 埃利约
  rationale: 身份和词义不确定，故按音转写，不擅自解释为某一特定族类。
- source_word: አንሰ፡ አመሕያው
  choice: 人类
  rationale: 原文指人或人类整体；中文用“人类”与前述各族类形成清楚对照。
theological_decisions:
- issue: 不同巨人族类名称是否合并为“尼非林”
  choice: 分别音译为“纳菲丁”“纳菲勒”“埃利约”
  alternative: 统一译作“尼非林”或笼统译作“巨人”
  rationale: 原文使用三个不同形式；合并会抹去本节刻意呈现的族类层次及彼此残杀的次序。
- issue: 末句省略谓语的处理
  choice: 补出“又杀了”
  alternative: 保留为“埃利约人类”之类的断裂结构
  rationale: 原文承接前两个“杀了”的平行句而省略谓语；汉语补出谓语可清楚再现其语法含义，同时“又”标示连续关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式保持原文简短、递进的族类争杀次序；罕见族名采用彼此可辨的音译，并以脚注说明，不用熟悉但会造成合并误解的传统称呼取代。
