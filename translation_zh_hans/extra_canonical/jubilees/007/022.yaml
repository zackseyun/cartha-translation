  rationale: 修订仅处理两项可安全判定的忠实度问题：将开头改为明确的同位语结构，避免把纳菲丁误作“子孙”的所属者；并将“巨人们”改为与原文一致的单数“巨人”。其余译法、名称区分和对末句省略谓语的补足均可保留。
