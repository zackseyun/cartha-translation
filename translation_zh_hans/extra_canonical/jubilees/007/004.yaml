  yaml_path: translation/extra_canonical/jubilees/007/004.yaml
  text: And he prepared the kid first, and put some of its blood on the flesh that was on the altar which he had made; and all its fat he offered up on the altar where he had made the burnt offering, and the ox and the ram and the sheep.
translation:
  language: zh_hans
  text: 他先预备了那只山羊羔，把它的一些血抹在他所筑的祭坛上的肉上；又把它所有的脂油献在他献燔祭的祭坛上，并献上公牛、公绵羊和羊群中的羊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可理解为：“就是他献公牛、公绵羊和羊群中的羊为燔祭的那座祭坛。”
    reason: 吉兹文末尾的并列成分可与“献燔祭”相连，也可视为继续列举所献的祭牲；脚注保留这一句法歧义。
lexical_decisions:
- source_word: ማሕስአ
  choice: 山羊羔
  rationale: 该词在祭牲语境中指幼山羊；译作“山羊羔”既明确牲畜种类，也符合现代汉语祭祀叙述。
- source_word: አንበረ፡ እምኔ፡ ደሙ
  choice: 把它的一些血抹在
  rationale: እምኔ 表示取其一部分；“抹在”自然表达把血施于祭坛上肉体的动作，不额外规定倾倒或洒血。
- source_word: ስብሖ
  choice: 它所有的脂油
  rationale: 保留所有格与“全部”的范围，清楚指向山羊羔的脂油。
- source_word: አዕረገ
  choice: 献
  rationale: 字面有“使上升”之意，在献祭语境中指使祭物上升为祭，现代汉语以“献”表达其礼仪含义，同时避免生硬直译。
- source_word: ላህመ፡ ወበሐኩ፡ ወአባግዐ
  choice: 公牛、公绵羊和羊群中的羊
  rationale: 依次保留牛、成年公羊及较宽泛的羊类称谓；末项用“羊群中的羊”避免与前一项完全合并。
theological_decisions:
- issue: 祭坛上的“肉”所指为何
  choice: 保留为“肉”，不注明属于哪一种祭牲
  alternative: 译为“祭牲的肉”或认定是先前燔祭的肉
  rationale: 源文仅说祭坛上的肉，指代并不完全明确；正文不替原文消除歧义。
- issue: 末尾三类牲畜与“献”的句法关系
  choice: 将“公牛、公绵羊和羊群中的羊”理解为一同献上的祭牲
  alternative: 仅把它们视为对先前燔祭的补充说明
  rationale: 源文串联结构紧凑，句法关系存在一定张力；正文采用最自然的祭祀动作延续读法，并以脚注说明另一种理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭坛”“燔祭”“脂油”等保留经卷祭祀语域；避免把“使上升”机械直译，也不擅自补入祭牲归属或礼仪细节。
