  yaml_path: translation/extra_canonical/jubilees/007/017.yaml
  text: 'And these are the sons of Shem: Elam and Asshur and Arpachshad—this one was born two years after the flood—and Lud and Aram.'
translation:
  language: zh_hans
  text: 闪的儿子是以拦、亚述、亚法撒——亚法撒是在洪水之后两年出生的——还有路德和亚兰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: 闪的儿子
  rationale: 按家谱语境将“闪的众子”自然译为“闪的儿子”，既保留复数所列诸子，也符合现代汉语表达。
- source_word: ኤላም፡ ወአሱር፡ ወአርፋክስድ
  choice: 以拦、亚述、亚法撒
  rationale: 采用现代中文圣经传统中通行的人名音译，便于读者与《创世记》家谱对应。
- source_word: ዝንቱ፡ ትውልደ
  choice: 亚法撒……出生
  rationale: 指示词“这一个”回指紧邻的亚法撒；相关动词表示“出生”，不译作“这一代”。为使中文指代清楚，直接重述姓名。
- source_word: ክልኤ፡ ዓም፡ እምድኅረ፡ አይኅ
  choice: 在洪水之后第二年
  rationale: 忠实表达洪水以后两年的时间定位，并用自然的现代汉语呈现。
- source_word: ወሉድ፡ ወአራም
  choice: 还有路德和亚兰
  rationale: 用“还有”承接被插入的出生说明，清楚恢复名单结构。
theological_decisions:
- issue: “这一个”所指为何
  choice: 明确回指亚法撒
  alternative: 译为“这一代出生于洪水之后第二年”
  rationale: 吉兹文的单数指示表达及上下文家谱次序均支持回指亚法撒，也与《创世记》11:10的年代说明相合；不应把相关形式误解为“世代”。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以破折号标示名单中的年代插语，并重复“亚法撒”以避免汉语中的指代含混；专名采用简体中文读者熟悉的传统译名。
