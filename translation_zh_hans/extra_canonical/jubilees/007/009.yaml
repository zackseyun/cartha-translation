  yaml_path: translation/extra_canonical/jubilees/007/009.yaml
  text: And Noah awoke from his wine and knew everything that his youngest son had done to him, and he cursed his son and said, “Cursed be Canaan; a lowly servant[a] shall he be to his brothers.”
translation:
  language: zh_hans
  text: 挪亚酒醒以后，知道了他小儿子向他所做的一切，就咒诅他的儿子说：“迦南当受咒诅；他必作他弟兄们卑微的奴仆[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹文的说法直译近似“卑微（或低下）的奴仆”，并非《创世记》中较熟悉的“奴仆的奴仆”。
    reason: 说明本节吉兹文本与熟悉的《创世记》措辞之间的词汇差异。
lexical_decisions:
- source_word: ነቅሀ፡ ኖኅ፡ እምወይኑ
  choice: 挪亚酒醒以后
  rationale: 按吉兹文本直译为挪亚“从他的酒醒来”，现代汉语自然表达为“酒醒以后”。
- source_word: ወአእመረ፡ ኵሎ፡ ዘገብረ፡ ላዕሌሁ
  choice: 知道了……向他所做的一切
  rationale: 保留“知道”“一切”以及行为指向挪亚的结构，不额外说明行为的具体性质。
- source_word: ወልዱ፡ ዘይንእስ
  choice: 他小儿子
  rationale: 吉兹语表达其较小、年幼的儿子；采用符合现代汉语叙事的“小儿子”，不擅自确定更复杂的排行含义。
- source_word: ቅኑየ፡ ገብር
  choice: 卑微的奴仆
  rationale: 原文不是《创世记》常见的“奴仆的奴仆”措辞，而是带有低下、卑微含义的奴仆表达，因此正文保留这一区别。
- source_word: ለአኃዊሁ
  choice: 他弟兄们
  rationale: 忠实保留复数“弟兄们”；代词所指在语境中为迦南。
theological_decisions:
- issue: 受咒诅者与“他儿子”的指称张力
  choice: 保留“咒诅他的儿子说：‘迦南……’”
  alternative: 改写为“就咒诅迦南说”
  rationale: 吉兹文本先说挪亚咒诅“他的儿子”，随后直接点名迦南。译文不替文本消除这一叙事与家系指称上的张力。
- issue: 奴仆等级用语
  choice: 卑微的奴仆
  alternative: 奴仆的奴仆
  rationale: 采用现存吉兹文本的措辞，而不以《创世记》的熟悉表述覆盖本书的异文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“酒醒以后”“向他所做的一切”自然流畅；“当受咒诅”保留宣告式语气。脚注标记紧接“卑微的奴仆”，与所解释的词组准确对应。
