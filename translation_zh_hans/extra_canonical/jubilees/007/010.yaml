  text: And he blessed Shem and said, “Blessed be the LORD, the God of Shem; and let Canaan be his servant.”
translation:
  language: zh_hans
  text: 他又祝福闪，说：“愿耶和华——闪的神——受称颂；愿迦南作他的仆人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆”。
    reason: 原词可涵盖“仆人”与“奴仆”的语义范围，后者更强调受奴役的身份。
lexical_decisions:
- source_word: ወባረኮ
  choice: 他又祝福
  rationale: 保留叙事承接关系，并准确表达“祝福”的动作。
- source_word: ይትባረክ
  choice: 愿……受称颂
  rationale: 此处为被动祝愿式，受称颂者是耶和华；译法兼顾原文形式与现代汉语自然度。
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 按此处与《创世记》平行传统中的神名功能译作“耶和华”。
- source_word: ገብሮ
  choice: 他的仆人
  rationale: 原词可指仆人或奴仆；正文采用较宽泛且庄重的“仆人”，以脚注保留更强的从属含义。
theological_decisions:
- issue: “闪的神”与称颂对象的句法关系
  choice: 愿耶和华——闪的神——受称颂
  alternative: 愿闪的神耶和华受称颂
  rationale: 两种表达在意义上相近；破折号清楚显示“闪的神”是对耶和华的同位说明，同时不把祝福对象误解为闪。
- issue: “他的”所指对象
  choice: 保留“他的”，不在正文中明确改为“闪的”或“耶和华的”
  alternative: 愿迦南作闪的仆人
  rationale: 原文代词存在可感知的指代空间；直译保留其形式与神学张力，避免擅自消解。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“受称颂”体现原文被动祝愿式；以破折号处理同位语，使朗读清晰。脚注标记已置于正文对应词后。
