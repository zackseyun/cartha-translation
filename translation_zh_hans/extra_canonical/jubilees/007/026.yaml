revisions:
- from: 就是他们在大地中所流的血。他毁灭了一切，只留下我和你们——我的孩子们——以及所有同我们一起进入方舟的。看哪，我眼看你们的行为，知道你们没有按正义而行；因为你们已经开始走腐败的道路，彼此分离，各人与自己的同伴分开；你们将互相争斗，不能同心合一。
  to: 就是他们在大地之中所流的血。他毁灭了一切；我、你们——我的孩子们——以及一切同我们一起进入方舟的，都得以存留。看哪，我看见你们所行的事就在我面前：你们没有行在正义中；因为你们已经开始走上败坏的道路，你们各人离开自己的邻人；你们将彼此争斗，也不会联合在一起。
  rationale: 修订使中文更自然，并更紧密地保留原文的观察语气、各人离开邻人的表述及末句“不会共同／联合”的意思。保留“他”而不补出神名，也保留首句作为承接上一节“血”的残句结构。
