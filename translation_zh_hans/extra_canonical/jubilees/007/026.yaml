base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/026.yaml
  text: which they shed in the midst of the earth. He destroyed everything, and I and you, my children, and all that entered with us into the ark were left. And behold, I see before me your deeds, that you are not walking in righteousness; for you have begun to walk in the paths of corruption, and you are separating, each one from his neighbor, and you will fight one with another, and you will not be united.
translation:
  language: zh_hans
  text: 就是他们在大地之中所流的血。他毁灭了一切；我、你们——我的孩子们——以及一切同我们一起进入方舟的，都得以存留。看哪，我看见你们所行的事就在我面前：你们没有行在正义中；因为你们已经开始走上败坏的道路，你们各人离开自己的邻人；你们将彼此争斗，也不会联合在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘከዐዉ፡ ማእከለ፡ ምድር
  choice: 就是他们在大地中所流的血
  rationale: 关系代词承接上一节的“血”；ከዐዉ 表示“他们倾倒／流出”，ማእከለ ምድር 表示发生地点“在大地中”。
- source_word: ደምሰሰ፡ ኵሎ
  choice: 他毁灭了一切
  rationale: 保留第三人称单数施事者和 ኵሎ“全部、一切”，不把“大地中间”误作毁灭的宾语。
- source_word: ወተርፍኩ
  choice: 只留下我
  rationale: 该词表达“我被留下／存留下来”；中文以自然的主动结果式呈现，并由后续并列成分补足存留者。
- source_word: ዘአኮንክሙ፡ ዘተሐውሩ፡ በጽድቅ
  choice: 你们没有按正义而行
  rationale: “行走”是行为方式的惯用隐喻；“按正义而行”兼顾原文形象与现代中文可懂度。
- source_word: በፍኖተ፡ ሙስና
  choice: 腐败的道路
  rationale: 直译“腐败／败坏的道路”，保留道德败坏与行为路径的比喻。
- source_word: ወትትፋለጡ፡ አሐዱ፡ አሐዱ፡ እም ቢጹ
  choice: 彼此分离，各人与自己的同伴分开
  rationale: ትትፋለጡ 表示分离、分开，እም 表示“从”；不采用“追随邻舍”的旧解。
- source_word: ኢትሄልዉ፡ ኅቡረ
  choice: 不能同心合一
  rationale: 原义为“不再／不能共同在一起”；“同心合一”自然表达团结状态，同时与前文争斗相对。
theological_decisions:
- issue: 洪水毁灭的施事者
  choice: 保留“他”而不明说姓名
  alternative: 明确译作“上帝毁灭了一切”
  rationale: 原文使用第三人称单数动词，但本句未明说主语；保留代词可避免补入原文未显述的称谓。
- issue: “正义”的含义
  choice: 按正义而行
  alternative: 行义／过正直的生活
  rationale: 保留“行走”隐喻及伦理判断，不将其缩窄为某一宗派化的义论概念。
- issue: 末句的团结含义
  choice: 不能同心合一
  alternative: 不能共同生活／不会联合在一起
  rationale: 上下文强调分裂与互斗；所选表达涵盖共同体破裂，但不引入特定教会论含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留古代劝诫语气；破折号用于清晰标示“我的孩子们”这一呼语。“大地中”略具源文本色彩，以承接上一节所说流血遍地的语境。
