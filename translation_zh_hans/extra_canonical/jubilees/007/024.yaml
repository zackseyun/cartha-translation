  text: And the earth was filled with violence. And after this they sinned against the beasts and birds and everything that moves and everything that walks upon the earth, and much blood was shed upon the earth, and all—
translation:
  language: zh_hans
  text: 地上充满了暴行。此后，他们又得罪了野兽、飞鸟、一切爬行和行走在地上的生物；许多血流在地上，而一切——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: 暴行
  rationale: 该词在此表示暴力、强暴或不法行为；结合下文流血的语境，译作“暴行”自然且保留道德与暴力层面的含义。
- source_word: አበሱ፡ ሎሙ፡ በአራዊት፡ ወአዕዋፍ
  choice: 他们又得罪了野兽、飞鸟
  rationale: 按句法将代词理解为预指后列的野兽和飞鸟，而非反身代词；“得罪”保留了原文“犯罪/冒犯”的关系含义。
- source_word: ዘይትሐወስ፡ ወዘያንሶሱ
  choice: 一切爬行和行走在地上的生物
  rationale: 两项分别描写移动、爬行与行走；补出“生物”使现代汉语通顺，但不把范围限定为某一动物类别。
- source_word: ትክዐወ፡ ደም፡ ብዙኅ
  choice: 许多血流在地上
  rationale: 以自然中文表达大量流血，同时保留“血”及其落在地上的具体意象。
theological_decisions:
- issue: “得罪野兽”的性质
  choice: 不具体说明其行为是杀戮、食用或性行为
  alternative: 译成“与野兽犯罪”或明确解释为残杀动物
  rationale: 原文说明其犯罪所针对的对象，却没有在本句明确界定行为性质；译文保留这种张力，避免引入特定解释。
- issue: 残缺句尾
  choice: 以破折号保留“而一切——”的未完状态
  alternative: 根据后续文本补全句意
  rationale: 所提供的原文止于“而一切”，不可据推测补足，因此明确呈现文本的不完整。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“地上充满了暴行”保持简洁有力；下文用并列结构贴近原文。未设置脚注，因为主译已采用较有语法依据的“得罪了野兽”，不必保留会误导为反身含义的旧异译。
