base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/029.yaml
  text: And in the fifth year make the release[a], so that you may release it in righteousness and uprightness, and you will be righteous, and all your planting will prosper.
translation:
  language: zh_hans
  text: 第五年，你们要实行“放开”[a]，按公义和正直放开它；这样，你们就会成为正直的人，你们所栽种的一切也都会兴旺。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 关于第五年的这项命令，原文含义不易确定。“放开”所译的词有放开、留下或停止处置之意，可能指与上文初熟果子条例相关的一种农业做法。
    reason: alternative_reading
  - marker: b
    text: 或译：“这样，你们就会成为正直的人；你们所栽种的一切也会为你们兴旺。”旧译也可能把后半句理解为：“你们所栽种的一切都会成为正直而兴旺的。”
    reason: previous_rendering
lexical_decisions:
- source_word: ኅድገተ (ḥədgata)
  choice: 留放
  rationale: 该词表示放开、留下或停止处置；上下文涉及果树与初熟果子的条例，因此采用较为开放的农业用语“留放”，不把具体做法解释得过死。
- source_word: በጽድቅ (ba-ṣədq)
  choice: 按公义
  rationale: 保留“公义”的伦理和宗教含义，并以“按”表达行事准则。
- source_word: በርኅብ (ba-rəḥb)
  choice: 正直
  rationale: 依照经审核的咨询文本处理为与“公义”并列的品格用语，同时避免加入特定宗派解释。
- source_word: ይረኅብ (yə-rəḥb)
  choice: 兴旺
  rationale: 在栽种的语境中表达宽展、丰盛或昌盛之意，现代汉语以“兴旺”最自然。
theological_decisions:
- issue: 人称义与栽种兴旺是否属于同一分句
  choice: 分译为“你们就会成为义人，你们所栽种的一切也都会兴旺”
  alternative: “你们所栽种的一切都会正直而兴旺”
  rationale: 吉兹文先明确以第二人称复数说“你们将成为义”，随后另说全部栽种将兴旺；分译可避免漏掉对人的陈述。
- issue: 第五年的“留放”是否明确等同安息年或豁免年
  choice: 不作等同，只译“实行留放”
  alternative: 译作“守安息年”或“实行豁免”
  rationale: 原词和本段农业语境不足以确定具体制度，故保留文本本身的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“留放”刻意保留原文制度细节的不确定性；后两分句清楚区分人的称义与栽种的兴旺。
