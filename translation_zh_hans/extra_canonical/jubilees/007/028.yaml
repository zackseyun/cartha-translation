revisions:
- from: 三年之内，凡可食用之物的果实都不可收取[a]。第四年，要收取其果实，把初熟之物献在至高的主面前；他创造了天地和万有。要把初酿的酒和初榨的油，作为初熟之物丰丰富富地献在主的祭坛上；主悦纳这些祭物。剩下的，要让主殿中的仆役在悦纳祭物的坛前吃。
  to: 三年之内，凡可食用之物的果实都不可采收。第四年，要采收其果实，把初熟之物献在至高的主面前；他创造了天地和万有。要把新酒和油作为初熟之物，丰盛地献在主的祭坛上，蒙他悦纳。剩下的，要让主殿中的仆役在这祭坛前吃。
  rationale: 修订删除与已定句法判断相冲突的脚注，改正重复用字，并以“新酒和油”避免无根据地限定加工方式。对“悦纳”的表述改为由主悦纳所献之物，末句则以“这祭坛前”承接，令汉语清楚自然，同时不增添教义性解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:56:51Z'
review_pass:
  verdict: revise
  source_fidelity: “凡可食用之物的果实”正确反映了吉兹语中带后缀的“其果实”与后随属格“凡可食用之物”的关系，也与英语审校轨迹的定论一致。原文的礼仪次序、第四年初熟之物、新酒和油、祭坛及余物供主殿仆役食用等内容均应保留。
  naturalness: 正文整体庄重通顺，但“丰丰富富地”是明显的重复性笔误；“初酿的酒”不如礼仪及农业语境中常用的“新酒”自然。末句的“悦纳祭物的坛”在汉语中容易造成祭坛作为“悦纳”主体的误解。
  terminology: “初熟之物”“至高的主”“祭坛”“主殿中的仆役”均合适。“新酒和油”比“初酿的酒和初榨的油”更贴近原文所列出产类别，且不额外限定加工方式。
  issues:
  - severity: low
    issue: “丰丰富富地”重复用字。
    rationale: 应改为“丰盛地”，以消除笔误而不改变“丰盛／充足地献上”的意思。
  - severity: medium
    issue: 脚注a保留了已被英语审校轨迹否定的“从任何可食用之物上收取”分析。
    rationale: 最新审校明确判定该处为“凡可食用之物的果实”，而非“从……收取”。该脚注会向读者呈现不应维持的替代译法，宜删除。
