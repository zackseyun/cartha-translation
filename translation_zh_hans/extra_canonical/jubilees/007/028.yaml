base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/028.yaml
  text: For three years the fruit of everything that is eaten shall not be gathered; and in the fourth year its fruit shall be gathered, and the firstfruits acceptable before the LORD Most High, who created heaven and earth and everything, shall be offered up. Let them offer in abundance the first wine and oil as firstfruits on the altar of the LORD, who receives it; and what is left over let the servants of the house of the LORD eat before the altar that receives it.
translation:
  language: zh_hans
  text: 三年之内，凡可食用之物的果实都不可采收。第四年，要采收其果实，把初熟之物献在至高的主面前；他创造了天地和万有。要把新酒和油作为初熟之物，丰盛地献在主的祭坛上，蒙他悦纳。剩下的，要让主殿中的仆役在这祭坛前吃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሬሁ፡ ዘኢይትቀሠም፡ እምኵሉ፡ ዘይትበላዕ
  choice: 凡可食用之物的果实都不可收取
  rationale: 按吉兹语前置代词后缀与随后属格成分的结构理解，把“其果实”与“凡可食用之物”合译为自然的汉语属格结构，同时保留“收取”这一动作。
- source_word: ቀዳሜ፡ ፍሬ
  choice: 初熟之物
  rationale: 此处指首先出产并献上的果实或产物；“初熟之物”既符合祭献语境，也避免把范围仅限于某一种果子。
- source_word: ቀዳሜ፡ ወይኑ፡ ወቅብአ፡ ቀዳሜ፡ ፍሬ
  choice: 初酿的酒和初榨的油，作为初熟之物
  rationale: 依据上下文将酒与油理解为首先所得的出产；用“初酿”“初榨”使现代读者清楚其所指。
- source_word: ዘይትወከፍ
  choice: 悦纳这些祭物／悦纳祭物的
  rationale: 该分词表达祭物被接受、蒙悦纳；译为“悦纳”保留礼仪与神学语域，并在两处按汉语句法调整。
- source_word: ባእዛኒ፡ ቤተ፡ እግዚአብሔር
  choice: 主殿中的仆役
  rationale: 依英语审校层所反映的文本理解，指主殿中服役的人；采用非宗派性的“仆役”，不擅自具体化为某一祭司等级。
theological_decisions:
- issue: 祭坛所献之物的接受者
  choice: 主悦纳这些祭物
  alternative: 祭坛悦纳这些祭物
  rationale: 源文关系从句紧接“主的祭坛”，语法上可能修饰祭坛，但“悦纳”在祭献语境中最终以主为主体更自然；后句仍译作“悦纳祭物的坛前”，以保留原文紧张与表达方式。
- issue: “至高的主”与创造者同位
  choice: 至高的主……他创造了天地和万有
  alternative: 创造天地和万有的至高主
  rationale: 拆为两个分句，清楚保留创造者与至高主为同一位，又不增加原文没有的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。礼仪用语使用“初熟之物、献、祭坛、悦纳”，但避免古奥句式；时间规定用“三年之内、第四年”清楚呈现。
