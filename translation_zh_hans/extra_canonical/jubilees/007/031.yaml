  - severity: low
    issue: “郑重告诫”将第二个动词的“作证／使人听见／宣告”语义收窄。
    rationale: 原文此处可表达见证、宣告或郑重使人知晓；正文宜选较宽的“郑重宣告”，脚注说明其他可能。
