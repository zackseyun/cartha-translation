  yaml_path: translation/extra_canonical/jubilees/007/031.yaml
  text: 'And I also command you, my sons, according to the command that Enoch gave to his son in the first jubilees, while he was still alive in the seventh generation: he commanded and testified to his son and to his sons'' sons until the day of his death.'
translation:
  language: zh_hans
  text: 我的儿子们，我也照着以诺在最初几个禧年间、还在世且处于第七代时吩咐他儿子的那样吩咐你们：他吩咐并郑重宣告给他的儿子和子孙，直到他去世的日子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郑重宣告”也可译作“作证”或“使人知晓”；“最初几个禧年”原文为复数。“第七代”的具体计算起点本节未说明。
    reason: 保留第二动词和复数纪年表达的语义空间，且不在正文中补定“第七代”的计算方法。
lexical_decisions:
- source_word: ኢዮቤልውሳት
  choice: 禧年
  rationale: 这是《禧年书》的核心纪年术语，采用现代中文中通行且庄重的译法。
- source_word: በቅድሜ፡ ኢዮቤልውሳት
  choice: 在最初几个禧年中
  rationale: 保留复数形式及时间范围的表达，不将其强行限定为单一的“第一个禧年”。
- source_word: ውስተ፡ ትዝምዱ፡ ሳባስ
  choice: 处在第七代的时候
  rationale: 按字面保留“第七代”的世代定位，同时用自然汉语表达。
- source_word: አስምዐ
  choice: 郑重告诫
  rationale: 该词基本义涉及“使听见”，在遗训语境中可指宣告、作证或郑重告诫；正文选用自然且符合语境的表达，并以脚注保留歧义。
- source_word: ውሉደ፡ ውሉዱ
  choice: 子孙
  rationale: 字面为“他儿子的儿女”，汉语以“子孙”自然涵盖后代链条。
theological_decisions:
- issue: 以诺告诫的权威性质
  choice: 吩咐并郑重告诫
  alternative: 吩咐并作证
  rationale: 原词可表达使人听见、宣告或作证；译文不把它提升为特定宗派意义上的启示公式。
- issue: “第七代”所指的世代关系
  choice: 保留“处在第七代”
  alternative: 解释为“从亚当算起的第七代”
  rationale: 原文自身未在本节明说计算起点，因此不在正文中补入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；重复“吩咐”以保留原文遗训式强调，并将较长的原文句子分为两句，避免中文结构拖沓。
