- source_word: ካም
  choice: 含
  rationale: 采用现代中文圣经中 Ham 的通行译名。
- source_word: ወተፈልጠ፡ እምአቡሁ
  choice: 离开了父亲
  rationale: 原文表达从父亲那里分离；此处用自然汉语呈现关系及居处分开之意，不额外说明动机或目的地。
- source_word: ኵስ፡ ወመሰጠሬም፡ ወፉድ፡ ወከናአን
  choice: 古实、麦西、弗和迦南
  rationale: 采用这些人物在现代中文圣经中的通行名称，同时保持原文列举次序。
- source_word: ወሐሎሙ፡ ኮነ፡ ሎቱ
  choice: 使含很不悦
  rationale: 该短语表示这事在含看来令人不快；译为现代、庄重且易懂的汉语。
theological_decisions:
- issue: “他的幼子”中代词所指
  choice: 正文保留“他的幼子”的代词形式，并加脚注说明歧义
  alternative: 直接译作“含的小儿子迦南”或“挪亚的小儿子”
  rationale: 源文代词在语法上可能产生所指歧义；上下文因被咒诅者是迦南而倾向指含的儿子，但不宜在正文中无提示地彻底消除原有张力。
