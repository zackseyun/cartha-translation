  yaml_path: translation/extra_canonical/jubilees/007/002.yaml
  text: And he kept its fruit, and gathered it in that year, in the seventh month. And he made wine from it, and put it into a vessel, and kept it until the fifth year, until the first day.
translation:
  language: zh_hans
  text: 他保存了它的果实，并在那一年七月把果实收聚起来。他用这些果实酿了酒，把酒放入器皿中，一直保存到第五年，直到第一日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所依据的格兹语文本止于“第一日”；“正月”是下一节的开头。
    reason: 说明本节经文边界，避免将下一节开头的词语并入本节。
lexical_decisions:
- source_word: ዐቀበ፡ ፍሬሁ
  choice: 保存着葡萄树的果实
  rationale: ዐቀበ 表示保守、保存；结合上下文补出“葡萄树”，使所指在汉语中清楚，又不改变内容。
- source_word: ቀሰሞ
  choice: 将果实收集起来
  rationale: 该词表示采集、收聚；译作“收集起来”既贴近原义，也避免擅自具体化为“采摘葡萄”。
- source_word: ገብረ፡ እም... ወይነ
  choice: 用果实酿了酒
  rationale: 原文结构直译为“从它制成酒”；汉语以“用果实酿了酒”自然表达来源关系。
- source_word: ንዋይ
  choice: 器皿
  rationale: 原词可泛指器具或容器；“器皿”保留其非特指性，不擅定材质与形制。
- source_word: ዕለት፡ ቀዳሚት
  choice: 第一日
  rationale: 按所给格兹语本节的边界，仅译“第一日”，不把下一节开头的“正月”并入。
