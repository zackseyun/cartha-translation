  text: And he rejoiced and drank some of this wine, he and his sons with joy. And it became evening, and he went into his tent, and being drunk he lay down and slept, and he was uncovered inside his tent while he slept.
translation:
  language: zh_hans
  text: 他欢喜，和儿子们欢欢喜喜地喝了些这酒。到了晚上，他走进自己的帐篷；他醉了，躺下睡着了。他在帐篷里睡着时，身上没有遮盖。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈሥሐ / በፍሥሓ
  choice: 很高兴／欢欢喜喜地
  rationale: 保留经文中“喜乐”的重复，同时采用自然的现代汉语表达。
- source_word: ሰከበ፡ ስኩሩ
  choice: 醉醺醺地躺下
  rationale: “ስኩሩ”表示醉酒状态；这样既交代状态，也保持动作次序。
- source_word: ተከሥተ
  choice: 身体露在……里
  rationale: 原词表达暴露、未遮盖；正文不具体限定暴露的身体部位，以保留原文概括性。
- source_word: ሰቀላሁ
  choice: 自己的帐篷
  rationale: 按上下文指他的帐篷；现代汉语用“自己的”清楚表达所属关系。
theological_decisions:
- issue: 挪亚的暴露程度
  choice: 身体露在帐篷里
  alternative: 赤身露体在帐篷里
  rationale: 吉兹文表达“被揭开／暴露”，但本句未明确使用“赤身”一词；因此避免加强为完全裸体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“喜乐”的语义重复及叙事动作顺序，不添加道德评价或因果解释。
