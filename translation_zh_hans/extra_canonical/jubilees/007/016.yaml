  text: 'And behold, these three cities are near Mount Lubar: Sedeqetelebab in front of the mountain toward its east, Ne''elatama''uk toward the south, and Adataneses toward the sea.'
translation:
  language: zh_hans
  text: 看哪，这三座城都靠近路巴山：西底基特利巴在山前东面，尼拉特玛乌在北面[a]，亚达塔尼西斯在朝海的一面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 英语校订层作“南面”，但本处所给吉兹语正文作“北面”（ሰሜን）。
    reason: 记录原文证据与英语咨询层之间的方位差异，保留文本问题而不静默调和。
lexical_decisions:
- source_word: ቅሩበ፡ ሉባር፡ ደብር
  choice: 靠近路巴山
  rationale: 按吉兹语词序与语义，表达三城与路巴山相近；用现代汉语自然措辞。
- source_word: በጽባሒሁ
  choice: 东面
  rationale: 字面与“早晨、日出方向”有关，在方位语境中指东方。
- source_word: ገጸ፡ ሰሜን
  choice: 在北面
  rationale: 所给 Charles 1895 吉兹语正文明确作 ሰሜን，即“北”；不依英语修订层的“南面”改写原文。
- source_word: መንገለ፡ ባሕር
  choice: 在朝海的一面
  rationale: 保留“朝向海”的空间关系，避免擅自把海所代表的方向具体化。
