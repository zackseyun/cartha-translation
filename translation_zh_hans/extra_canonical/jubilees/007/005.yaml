revisions:
- from: 他把它们所有的肉都献在祭坛上焚烧，又把它们所有的祭物调上油，放在坛上。随后，他把酒浇进祭坛上的火中，又把香料放在祭坛上，使馨香上升，在耶和华他的上帝面前蒙悦纳。
  to: 他把它们所有的肉都献在祭坛上焚烧，又把它们所有掺了油的祭物放在上面。随后，他把酒浇进祭坛上的火中，又把香料放在祭坛上，使馨香升起，在耶和华、他的上帝面前蒙悦纳。
  rationale: 仅作必要的汉语表达和句法澄清：将不通的“调上油”改为“掺了油的”，并用“上面”承接祭坛；其余保留原译对祭仪意象、香料泛称及“蒙悦纳”表达的处理。
