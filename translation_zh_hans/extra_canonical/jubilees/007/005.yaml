base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/005.yaml
  text: And he caused all their flesh to ascend on the altar, and he placed all their offering mixed with oil upon it, and afterward he poured wine into the fire that was on the altar, and put incense on the altar, and caused a pleasing fragrance to ascend, acceptable before the LORD his God.
translation:
  language: zh_hans
  text: 他把它们所有的肉都献在祭坛上焚烧，又把它们所有掺了油的祭物放在上面。随后，他把酒浇进祭坛上的火中，又把香料放在祭坛上，使馨香升起，在耶和华、他的上帝面前蒙悦纳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዕረገ፡ ኵሎ፡ ሥጋሆሙ፡ ዲበ፡ ምሥዋዕ
  choice: 把它们所有的肉都献在祭坛上焚烧
  rationale: 原文直译为“使它们所有的肉升到祭坛上”；在献祭语境中，“献上焚烧”既保留“上升”的祭仪意象，也使现代汉语读者清楚理解动作。
- source_word: ልዉሰ፡ በቅብዕ
  choice: 调上油
  rationale: 表达祭物与油混合或掺调，不额外指定油的种类。
- source_word: ወይነ
  choice: 酒
  rationale: 该词指酒；语境未要求进一步限定为葡萄酒。
- source_word: ስኂነ
  choice: 香料
  rationale: 原词泛指焚烧用的芳香物质，不宜窄化为“乳香”；“香料”比现代汉语中易指成品香支的“香”更准确。
- source_word: መዐዛ፡ ሠናየ
  choice: 馨香
  rationale: 原义为“美好的香气”；采用自然而庄重的祭祀用语。
- source_word: ያሠምር፡ ቅድመ፡ እግዚአብሔር፡ አምላኩ
  choice: 在耶和华他的上帝面前蒙悦纳
  rationale: 保留“蒙悦纳”的祭仪和神学含义，并保存“他的上帝”这一关系表述。
theological_decisions:
- issue: “馨香”与“蒙悦纳”的关系
  choice: 使馨香上升，在耶和华他的上帝面前蒙悦纳
  alternative: 使蒙悦纳的馨香升到耶和华他的上帝面前
  rationale: 原文可理解为香气是悦纳的，也可理解为整个献祭行动在上帝面前蒙悦纳；正文采用汉语中较自然且仍保留一定句法张力的表达，不把神学关系过度限定。
- issue: 祭物“上升”的表达
  choice: 献在祭坛上焚烧
  alternative: 使它们所有的肉升到祭坛上
  rationale: “升”在此属于献祭焚烧的惯用意象；译为“献……焚烧”避免读者误解为单纯搬运，同时不加入献祭种类等原文没有的信息。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事语体；保留“祭坛、祭物、馨香、蒙悦纳”等成熟圣经汉语词汇。耶和华以通行专名呈现，未增补宗派性解释。
