  text: For he loved him more than all his sons. And Noah slept with his fathers.
translation:
  language: zh_hans
  text: 因为他爱他，胜过爱自己所有的儿子。[a] 挪亚与列祖同睡了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里只说“他”，受爱者是谁须由上文确定。
    reason: 说明原文代词的指代含蓄，避免正文擅自消除歧义。
  - marker: b
    text: “与列祖同睡”是指去世。
    reason: 解释现代读者可能不熟悉的传统死亡委婉语。
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 保留本句与上文之间的因果衔接；也可译作“因”或“因为”。
- source_word: ኪያሁ
  choice: 他
  rationale: 原文是带强调意味的第三人称宾格，但本节本身未明说所指，故正文不擅自补出人名。
- source_word: ያፈቅር፡ ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  choice: 爱他，胜过爱自己所有的儿子
  rationale: 以自然汉语表达比较关系，并用“自己”明确“他的儿子”归属于施爱者，而不改变受爱对象在原文中的代词形式。
- source_word: ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: 挪亚与列祖同睡了
  rationale: 保留闪族传统的死亡委婉语及其经文语体；“列祖”比直译“父亲们”更符合现代中文圣经表达。
theological_decisions:
- issue: 受爱者的身份
  choice: 正文保留代词“他”
  alternative: 按上下文补作“亚法撒”
  rationale: 所给吉兹文只含代词，并未在本节明列姓名；为保存原文指代方式，不在正文中替代为专名。
- issue: 挪亚死亡的表述
  choice: 保留“与列祖同睡”这一委婉语
  alternative: 直译其含义为“挪亚死了”
  rationale: 原文使用“睡”的传统死亡隐喻；保留它既忠于措辞，也不额外解释死亡或死后状态。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“爱他，胜过爱自己所有的儿子”保留原文代词，同时使所属关系清楚；“与列祖同睡”保留经文传统表达，并以脚注释义。
