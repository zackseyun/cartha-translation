revisions:
- from: 在第三十三个禧年，即第二个七年的第一年，法勒娶了一个名叫洛姆娜的女子为妻；她是示拿的女儿。这个七年的第四年，她给他生了一个儿子。他给儿子取名叫拉吴，因为他说：“看哪，世人因邪恶的计谋而变坏了，要为自己在地上建造一座城和一座塔。”
  to: 在第三十三个禧年、第二个七年的第一年，法勒娶了一个名叫洛姆娜的女子为妻；她是示拿的女儿。这个七年的第四年，她给他生了一个儿子。他给儿子取名叫拉吴，因为他说：“看哪，世人因那邪恶的谋划变得邪恶：他们要为自己在地上建造一座城和一座塔。”
  rationale: 修正嵌套纪年的连接方式，并微调引语的句法，以更清楚地传达原文所述世人变得邪恶与其建城造塔之谋划的关系。英文审校轨迹中的第18号脚注讨论塔的尺寸，并不属于本节所给吉兹文本，故不设置脚注锚点或脚注。
