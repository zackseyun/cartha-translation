base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/018.yaml
  text: And in the thirty-third jubilee[18], in the first year of the second week, Peleg took for himself a wife whose name was Lomna, the daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land.”
translation:
  language: zh_hans
  text: 在第三十三个禧年、第二个七年的第一年，法勒娶了一个名叫洛姆娜的女子为妻；她是示拿的女儿。这个七年的第四年，她给他生了一个儿子。他给儿子取名叫拉吴，因为他说：“看哪，世人因那邪恶的谋划变得邪恶：他们要为自己在地上建造一座城和一座塔。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው
  choice: 禧年
  rationale: 按《禧年书》的纪年体系译为“禧年”，保留该书特有的时间单位。
- source_word: ሱባዔ
  choice: 七年
  rationale: 该词指由七年组成的周期；译成“七年”比音译或单称“周”更便于现代读者理解。
- source_word: ፋሌክ
  choice: 法勒
  rationale: 采用现代中文圣经中较通行的人名形式。
- source_word: ሎምና
  choice: 洛姆娜
  rationale: 原文专名，无稳定通行汉译，依读音作谨慎音译。
- source_word: ሲናአር
  choice: 示拿
  rationale: 采用中文圣经对 Shinar 的传统通行译名。
- source_word: ራገው
  choice: 拉吴
  rationale: 对应 Reu，采用现代中文圣经较通行的译名。
- source_word: ምክረ፡ ዐግ
  choice: 邪恶的计谋
  rationale: 保留“计谋/谋划”与邪恶性质之间的修饰关系，不将其扩展解释为特定神学概念。
- source_word: ሀገረ፡ ወማኅፈደ
  choice: 一座城和一座塔
  rationale: 依上下文分别译作城与塔，呼应巴别叙事而不增添原文未明说的名称。
theological_decisions:
- issue: 世人变坏与建城造塔之计谋的关系
  choice: “因邪恶的计谋而变坏了，要……”
  alternative: “变得邪恶，定意要……”
  rationale: 原文可理解为人在与建城造塔相关的计谋中成为邪恶；正文保留因果与目的之间的张力，不把罪恶仅等同于建筑行为本身。
- issue: 示拿的身份表达
  choice: “她是示拿的女儿”
  alternative: “她来自示拿”
  rationale: 原文明确使用“女儿”，故形式上保留亲属表述；即使“示拿”也可能带有地域联想，也不擅自改释为籍贯。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“即”帮助读者理解禧年与七年周期的嵌套纪年；婚娶、生子和命名句保持叙事节奏。所给英文脚注讨论塔的尺寸，与本节吉兹文本及正文内容无关，因此不纳入本节，也不设置脚注标记。
