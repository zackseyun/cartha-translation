base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/013.yaml
  text: And we told Noah along with their deceptions, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book concerning every kind of healing, and the spirits were restrained.
translation:
  language: zh_hans
  text: 我们把（上文所述的事）连同它们的迷惑告诉了挪亚[a]，使他们能借着地上的草木得医治[b]。挪亚把我们教给他的一切都写在一本书中，记下关于各种医治的事；那些灵也受到了约束[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“我们连同它们的迷惑告诉了挪亚”。“连同”所连的另一项未在本节明说，须由上文补足；“迷惑”也可译为“错误”。
    reason: 说明原文介词结构的承前省略及该词的语义范围，不在正文臆定省略的内容。
  - marker: b
    text: 或译：“使他们能用地上的草木施行医治。”原文的复数代词指向及动词理解在传统解释中有所不同。
    reason: 正文依本段英文审校轨迹采用“得医治”，同时保留可理解为主动医治的可能。
  - marker: c
    text: 按上下文，这些是危害人的灵；原文这里只说“灵”，并未加“邪恶”一词。
    reason: 交代上下文所指，同时避免在正文增添原文没有的修饰。
lexical_decisions:
- source_word: አስሕተትሙ
  choice: 它们迷惑人的手段
  rationale: 该词可指欺骗、诱惑或使人误入歧途之事；结合上下文中的诸灵，用“迷惑人的手段”既自然，也保留其主动欺骗的含义。
- source_word: በዕፀወ፡ ምድር
  choice: 用地上的植物
  rationale: 按字面译出“地上的植物/草木”，不把它具体化为现代意义上的药品。
- source_word: ትዝምደ፡ ፈውሳት
  choice: 各类医治的方法
  rationale: 该短语涉及医治的类别或门类；译为“各类医治的方法”比生硬的“每一种医治”更符合现代汉语。
- source_word: ተዐጸዉ
  choice: 受到了约束
  rationale: 该动词有被关闭、禁闭或限制之意；“受到约束”保留约制含义而不额外指定拘禁方式。
- source_word: መናፍስት
  choice: 那些灵
  rationale: 原文仅作“灵”，没有明说“邪恶”；用“那些灵”借上下文指明所指，同时避免增译神学定性。
theological_decisions:
- issue: “灵”是否应明确译作“邪灵”
  choice: 那些灵
  alternative: 那些邪灵
  rationale: 上下文虽表明这些灵具有危害性，但本节原文没有“邪恶”这一修饰语，因此正文不增补。
- issue: 医治分句的施事与受事
  choice: 使他们能……施行医治
  alternative: 使他们能……得到医治
  rationale: 吉兹语动词形态更直接支持复数主语主动“医治”，但传统译法常按语境理解为受医治；正文从形态，脚注保留另一理解。
- issue: “同它们的迷惑手段”所连接的省略内容
  choice: 一并告诉了挪亚
  alternative: 把它们所有的错误告诉了挪亚
  rationale: 原文的“同/与”似承接前文未在本节重述的内容。正文用“一并”保留这种衔接，不擅自补出具体宾语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“施行医治”“受到约束”略带经书语体，但不古奥。代词分别用“它们”指诸灵、“他们”指承担医治行动者；原文所含的指代张力通过脚注保留。
