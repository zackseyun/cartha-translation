  text: And for Japheth came out the third portion beyond the river Tina, toward the north of the outflow of its waters, and it extends northeastward to the whole region of Gog and to all the country east of it.
translation:
  language: zh_hans
  text: 雅弗所得的是第三份土地，在提拿河彼岸、其水流出口以北；这地向东北延伸，直到歌革全境和它以东的全部土地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给的相关吉兹语原文摘录未完整呈现本节目标句；“提拿河”“歌革”等读法依现有校订文本保留，其确切地理所指不详。
    reason: 说明当前提供的原语言证据范围有限，并避免对不确定地名作无根据的认定。
lexical_decisions:
- source_word: Japheth
  choice: 雅弗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: the third portion
  choice: 第三份地业
  rationale: “portion”在本段指拈阄分得的地域；译作“地业”可自然表达所分配的土地，同时保留继承与领地的语感。
- source_word: river Tina
  choice: 提拿河
  rationale: 按专名音译，不擅自等同于某条已知河流。
- source_word: toward the north of the outflow of its waters
  choice: 从河水出口的北面起
  rationale: 保留原有地理定位及“水流出口”的表达，不将其具体化为河口、入海口或水源。
- source_word: northeastward
  choice: 向东北延伸
  rationale: 用现代汉语清楚表达方向及疆界延展。
- source_word: Gog
  choice: 歌革
  rationale: 采用中文圣经传统中通行的专名译法，不预先判定其指民族、人物或特定政治实体。
theological_decisions:
- issue: 歌革的所指
  choice: 保留为地名式专名“歌革”，译作“歌革全境”
  alternative: 将其解释为某一民族、君王或末世性实体
  rationale: 本节语境是疆域划分，原有措辞仍可能容纳不同理解；不导入后世神学体系或特定释经传统。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句法按疆界描述的顺序展开；“抽得”体现分地语境，“延伸”使地理走向清楚。所有不确定专名均保留音译或传统译名。
