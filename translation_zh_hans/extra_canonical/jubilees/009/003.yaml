base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/003.yaml
  text: And it goes forth toward the north to the limits of Gadir, and it goes forth to the coast of the waters of the great sea, until it approaches the river Gihon; and it goes along the south of the waters of Gihon to the bank of this river.
translation:
  language: zh_hans
  text: 这疆界向北延伸，直到迦迪尔的边界；又沿着大海水域的海岸延伸，直至靠近基训河；再沿基训水域的南面延伸，直到这条河的岸边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: māya bāḥr ʿabiy
  choice: 大海水域
  rationale: 保留“水域”和“大海”两个语义成分，避免弱化为泛指的“大水”，同时使现代汉语表达自然。
- source_word: Gadir
  choice: 迦迪尔
  rationale: 按专名音译，并与经文地理边界的语境相符。
- source_word: Gēyon
  choice: 基训河
  rationale: 采用该河名在现代中文圣经传统中的通行译名，并补出“河”以明确所指。
- source_word: mangala ʾazēb māya gēyon
  choice: 沿基训水域的南面
  rationale: 明确保留原文的“南面”这一方位标志，不误解为河流穿过土地中央。
- source_word: dengagu la-zentu falag
  choice: 这条河的岸边
  rationale: 保留“这条河”及“岸边”两个具体地理要素。
