  text: And for Javan came forth the fourth portion, every island and the islands which are toward the border of Lud.
translation:
  language: zh_hans
  text: 雅完所得的是第四份：所有岛屿，以及朝向路德边界的岛屿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧译作：“这地向北延伸到北方，又向北延伸到凯尔特山脉和毛克海，并从迦迪尔以东伸展，直到海水所在的地区。”这段文字实际属于另一处疆界描述，并非本节正文。
    reason: 保留既有版本所记录的旧译，同时明确说明近期校勘所发现的经节错置，避免读者将其误认为本节的可靠异文。
lexical_decisions:
- source_word: Javan（据经节校订所恢复的人名）
  choice: 雅完
  rationale: 采用现代中文圣经传统中对该人名的通行音译，便于辨认其与《创世记》族谱的联系。
- source_word: fourth portion
  choice: 第四份
  rationale: 这里指抽签分配所得的份额；用“份”自然简洁，同时不把其范围过度解释为单一大陆领土。
- source_word: island(s)
  choice: 岛屿
  rationale: 保留原句中单复数形式所形成的重复，不擅自将其具体化为某一群岛或沿海地区。
- source_word: Lud
  choice: 路德
  rationale: 采用通行的人名或族名音译；原文只说明其边界，不进一步判定具体地理位置。
