  text: The third tongue. And for Mesek came forth the sixth portion, all the region beyond the third tongue.
translation:
  language: zh_hans
  text: 第三个舌状地带。[a] 米设得了第六份，就是第三个舌状地带以外的整个地区。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舌状地带”原文直译为“舌头”；这里用作地理称谓，可能指舌状延伸的地带，具体地貌未明。
    reason: 保留 ልሳን 的形象及其地理所指的不确定性，避免限定为海湾或海岬。
  - marker: b
    text: “以外的”也可译为“另一边的”或“对面的”；该词亦可能被较宽泛地理解为“……一带的”。
    reason: 反映 ማዕዶት 所含彼岸、对面或越过某地的空间关系，并保留英语审校记录中的替代理解。
lexical_decisions:
- source_word: ልሳን፡ ዘሣልስት፡ (ləsān za-śālśt)
  choice: 第三个舌状海湾
  rationale: ልሳን 的本义是“舌头”，在地理语境中可指舌状伸展的海域、海湾或地带；译作“舌状海湾”既保留原文意象，也让现代读者看出这是地理名称。
- source_word: ለሞስክ፡ (la-Mosək)
  choice: 米设
  rationale: 采用该人物名称在现代中文圣经传统中常见的形式；介词表示这一份地业归给米设。
- source_word: ወፅአ፡ መክፈልት፡ ሳድስ፡ (waṣ'a makfalt sāds)
  choice: 抽得第六份
  rationale: 直译为“第六份出来给他”；在分地语境中，“抽得”自然表达拈阄所得，同时保留“第六份”的次序。
- source_word: ኵሉ፡ ማዕዶተ፡ (kwəllu māʿdota)
  choice: 以外的整个地区
  rationale: ማዕዶት 可表达另一边、对面或越过某处的地域；结合地理分界语境，译为“以外的整个地区”。
theological_decisions: []
