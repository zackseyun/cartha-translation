  yaml_path: translation/extra_canonical/jubilees/009/011.yaml
  text: And for Tubal there came out a fifth portion in the midst of the tongue that approaches toward the portion of Lud, as far as the other tongue, into the region beyond the other tongue.
translation:
  language: zh_hans
  text: 至于土巴，他所得的是第五份，位于那伸向路德所得之地的舌状地带中间，直到另一片舌状地带，进入那另一片舌状地带以外的地区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所述地理边界含义不甚明确；“舌状地带”直译为“舌头”，可能指狭长的陆地或水域。
    reason: 保留原文地理术语的真实不确定性，并帮助现代读者理解其形象性。
lexical_decisions:
- source_word: ወለቱቤልሂ
  choice: 至于土巴
  rationale: 该词组明确指“土巴”；句首残留的“路德之地”属于前一节或前一分句，不应误作本句受益者。
- source_word: መክፈልት፡ ኃምስ
  choice: 第五份
  rationale: 直译为“第五份／第五部分”，指分配给土巴的地域份额。
- source_word: ልሳን
  choice: 舌状地带
  rationale: 本义为“舌头”，在这里显然是地理用语，但具体所指不明；译作“舌状地带”既保留原有意象，也提示其地貌含义。
- source_word: ማዕዶተ
  choice: 以外的地区
  rationale: 该词有“越过、彼岸、另一边”之意，故表达为位于另一片舌状地带之外，而非仅仅在其中。
theological_decisions: []
translation_notes:
