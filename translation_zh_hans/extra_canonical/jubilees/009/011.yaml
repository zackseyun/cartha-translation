  source_fidelity: 译文正确将本节的受分者译为“土巴”，没有把前一节末尾的“路德”误接为本节受分者。保留了“第五份”“舌（状地带）”“向着路德的份地延伸”“直到另一片舌状地带”以及越过／在另一片舌状地带彼岸的区域等关键地理界线。将 ማዕዶተ 译为“以外的地区”符合“彼岸、越过”的方向性，未弱化为单纯“在……之内”。
