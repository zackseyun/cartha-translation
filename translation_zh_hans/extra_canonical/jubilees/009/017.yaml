base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/017.yaml
  text: Nineteen jubilees, two weeks, and five years—which he lived on earth longer than the children of men because of the righteousness in which he was perfect, except for Enoch. For Enoch's role was created as a testimony to the generations of the world, so that he might recount all the deeds to the generations.
translation:
  language: zh_hans
  text: 十九个禧年、两个七年期和五年——因为他在义上达到完全，他在地上的寿数超过世人，只有以诺除外。因为以诺被造作世上历代的见证，好向世代传述一切作为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው፡ ወክልኤ፡ ሱባዔ፡ ወ፭ዓመተ
  choice: 十九个禧年、两个七年期又五年
  rationale: 按原文保留禧年、七年期和年数的计时方式；“ሱባዔ”在此指一个七年期。
- source_word: ዘአፈድፈደ፡ ሐዩዎ፡ ዲበ፡ ምድር፡ እምውሉደ፡ ሰብእ
  choice: 他在地上的寿数超过了世人
  rationale: 将“超过”与“在地上的生命/寿数”自然组合，并把“人的子孙”译为现代汉语常用的“世人”。
- source_word: በእንተ፡ ጽድቅ፡ ዘባቲ፡ ፍጹመ፡ ኮነ
  choice: 因着他所达到完全的义
  rationale: 保留原文把长寿归因于“义”的因果关系，也保留“成为完全/达到完全”的表达张力。
- source_word: ዘእንበለ፡ ሄኖክ
  choice: 只有以诺除外
  rationale: 直译排除结构，不擅自补充以诺长寿或被接去等解释。
- source_word: ተፈጥሮተ
  choice: 受造的身份
  rationale: 该词可涉及受造、本性或受造状态；结合句法，以“受造的身份”保持可理解性，同时不把它确定解释为某种教职。
- source_word: ለስምዕ፡ ለትዝምደ፡ ዓለም
  choice: 世世代代的见证
  rationale: “ስምዕ”译作“见证”，“世界的世代”按现代汉语习惯译为“世世代代”。
- source_word: ከመ፡ ይንገር፡ ኵሎ፡ ግብረ፡ ለትውልደ
  choice: 使他向历代述说一切作为
  rationale: 保留目的从句及“述说一切作为”的宽泛含义，不擅自限定这些作为属于上帝还是人。
theological_decisions:
- issue: “完全的义”是否暗示绝对无罪
  choice: 按原文译为“他所达到完全的义”
  alternative: 因他行为正直
  rationale: 原文同时含有“义”与“完全/成为完全”的措辞；弱化成一般品行会消除其神学张力，译文也不进一步解释为绝对无罪。
- issue: 以诺相关的“受造/本性”措辞
  choice: 以诺受造的身份被立为见证
  alternative: 以诺的职分被设立为见证
  rationale: “职分”较流畅，却会把含义固定为制度性角色；正文保留受造含义，并以脚注呈现可能的语义范围。
- issue: “一切作为”的施事者
  choice: 不明说是谁的作为
  alternative: 人类历代的一切行为／上帝的一切作为
  rationale: 原文在此没有明确限定所属关系，应保留其开放性。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“禧年”“七年期”保留古代计时特色；长句以破折号划分。正文只用代词“他”，不从上下文擅自补入姓名。
