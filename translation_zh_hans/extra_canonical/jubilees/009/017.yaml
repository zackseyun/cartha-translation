  naturalness: “因着他所达到完全的义”和“受造的身份被立为”在现代汉语中均较生硬。改为“因为他在义上达到完全”及“以诺被造作……的见证”，既庄重也更清楚。
  terminology: “禧年”“七年期”“以诺”“义”“见证”均可保留。“世世代代”可具体为“世上的历代”，以对应“世界的世代”；“一切作为”保留施事者未明的歧义。
  issues:
