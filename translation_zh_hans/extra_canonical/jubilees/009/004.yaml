  yaml_path: translation/extra_canonical/jubilees/009/004.yaml
  text: And this is the land that came out for Ham, as the portion which he was to occupy forever, for himself and for his sons throughout their generations forever.
translation:
  language: zh_hans
  text: 这就是分给含的土地，作为他要永远占有的产业份额，归他和他的子孙，世世代代，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፅአ መክፈልት
  choice: 抽签所得……份
  rationale: 本段分地语境中的固定表达指所抽得或所得的份；译出“抽签”可使现代读者明白土地分配的方式，同时保留“份”的概念。
- source_word: የአኅዝ
  choice: 占有
  rationale: 表达取得并持守所分土地，不仅是暂时居住；“占有”简洁贴合领受产业的语境。
- source_word: ለዓለም / ለትውልዶሙ ለዓለም
  choice: 永远……世世代代，直到永远
  rationale: 保留原文对永久性的重复强调，不将两个时间表达合并或弱化。
theological_decisions:
- issue: 土地归属的永久性表述
  choice: 直译为“永远……世世代代，直到永远”
  alternative: 简化为“永远归他和他的后代”
  rationale: 原文以重复的永久性措辞强调分地的持续效力；译文保留这种张力，不对其后续历史或神学效力作解释。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“抽签所得”交代分地背景，“归他和他的子孙”清楚呈现受益者；保留原文重复的永恒措辞。所给吉兹语材料属于相关母记录，目标句本身未清晰出现在摘录中，因此措辞同时参照该段可见的分地公式及经审校的英文咨询层。
