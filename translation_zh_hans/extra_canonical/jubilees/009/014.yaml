  text: And Noah slept with his fathers[14], and he was buried on Mount Lubar in the land of Ararat. Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years. And in his life on earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was created as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.
translation:
  language: zh_hans
  text: 这些全都是挪亚儿子们的疆界。挪亚把他所写的一切交给了他的儿子闪，因为他极其爱他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩያን
  choice: 疆界
  rationale: 按本段分地语境理解为各支所得之地的界限；用现代汉语中清楚、庄重的“疆界”表达。
- source_word: ለውሉደ፡ ኖኅ
  choice: 挪亚的众子孙
  rationale: ውሉድ 可指儿女或后裔；此处承接挪亚后代的土地分配，以“众子孙”比仅作“儿子们”更贴合语境，同时不限定为遥远后裔。
- source_word: ኵሎ፡ ዘጸሐፈ
  choice: 自己所写的一切
  rationale: 保留“全部”和“写下”的明确含义，不擅自说明所写内容。
- source_word: ዘይፈህቅ
  choice: 因为他深爱闪
  rationale: 该关系表达爱；用“深爱”传达其加强意味，并在汉语中补明宾语以避免歧义。
theological_decisions:
- issue: 挪亚交给闪之文献的性质
  choice: 仅译为“自己所写的一切”
  alternative: 解释为某种特定圣书、启示或祖传记录
  rationale: 原文没有界定这些文字的体裁、权威或内容，因此不作神学性增补。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。鉴于所给英语咨询层与吉兹语经文明显不对应，本稿以吉兹语来源及其分地语境为准，不沿用英语文本中关于挪亚寿数和以诺使命的内容。
