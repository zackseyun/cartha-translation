  yaml_path: translation/extra_canonical/jubilees/009/010.yaml
  text: And he said[10], "Let a tenth of them remain before him, and let nine parts descend into the place of judgment." And he told one of us that we should teach Noah all their remedies, for
translation:
  language: zh_hans
  text: 他说：“要让它们的十分之一留在他面前，其余的十分之九下到审判之地。”[a] 他又对我们中的一个说，要我们把它们的一切疗法[b]教给挪亚，因为……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留下十分之一”的说法，是本章对洪水之后邪灵为何仍继续活动的独特解释。
    reason: cross_reference
  - marker: b
    text: “它们的一切疗法”也可理解为“医治它们所造成之病害的一切方法”。
    reason: source_ambiguity
lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: 审判之地
  rationale: 按词面保留“地方/处所”与“审判”的组合，措辞庄重自然，也不把它具体化为某一特定刑罚场所。
- source_word: ወለአሐዱ፡ እምኔነ፡ ይቤ
  choice: 他又对我们中的一个说
  rationale: 介词ለ表明“我们中的一个”是说话的间接对象，而非动词主语；因此不译作“我们中的一个说”。
- source_word: ኵሎ፡ ፈውሶሙ
  choice: 它们的一切疗法
  rationale: 保留复数代词后缀与“医治、疗法”的语义关联，不在正文中强行判定是它们掌握的疗法，还是针对它们所致伤害的疗法。
- source_word: እስመ
  choice: 因为……
  rationale: 原始材料止于表示原因的连词，故以省略号明确本节所给文本在此处未完，不擅自补足后文。
theological_decisions:
- issue: 洪水之后邪灵仍然活动的解释
  choice: 让十分之一留下，其余九份下到审判之地
  alternative: 概括为只有少数邪灵获准留下
  rationale: 保留原文明确的十分之一与九份比例，以及“留下”和“下到审判之地”的张力，不进行神学概括。
- issue: 发出指示者与受话者的身份
  choice: 以“他”作说话者，以“我们中的一个”作受话者
  alternative: “我们中的一个说”
  rationale: 格厄兹语介词结构明确支持此句法关系；“他”的具体身份则依上下文保留为代词，不在本节中额外指名。
- issue: 疗法与邪灵的关系
  choice: 正文保留所有格表达“它们的一切疗法”
  alternative: “对付它们的一切疗法”或“医治它们所致疾病的一切方法”
  rationale: 后两种译法会明确一种可能的因果或对象关系，而源语的代词后缀较为凝练；正文保留其张力，脚注说明语境上的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“要让……”“其余九份”兼顾命令语气和比例表达；末尾保留“因为……”以反映所提供源文是不完整句。所有脚注均以方括号字母标记，并在正文对应位置出现。
