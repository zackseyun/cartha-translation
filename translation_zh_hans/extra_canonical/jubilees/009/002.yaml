  yaml_path: translation/extra_canonical/jubilees/009/002.yaml
  text: And it extends to all the mountains of fire, and it extends toward the west to the sea of Atel, and it extends westward until it reaches the sea of Mauk, that sea into which everything that descends is not destroyed.
translation:
  language: zh_hans
  text: 它延伸到所有火焰之山，又向西延伸到阿特勒海；再往西延伸，直到毛克海。凡下到那海里的，都不会灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡没有灭亡的，都下到那海里。”
    reason: 保留关系从句与主句可能倒置分析所形成的传统异译；正文采用革次语法更直接支持的理解。
lexical_decisions:
- source_word: mountains of fire
  choice: 火焰之山
  rationale: 保留地理名称般的字面意象，避免译成现代地质术语“火山”而引入原文未必具有的含义。
- source_word: sea of Atel
  choice: 阿特勒海
  rationale: 按专名音译，并以“海”标明地理类别。
- source_word: sea of Mauk
  choice: 毛克海
  rationale: 按专名音译，并以“海”标明地理类别。
- source_word: everything that descends
  choice: 凡下到那海里的
  rationale: 明确关系从句所指，并依革次语法使“下到海里”作主语范围，而非修饰“未灭亡”的事物。
- source_word: is not destroyed
  choice: 都不会灭亡
  rationale: “灭亡”自然而庄重，可涵盖毁坏或消逝之意，不额外限定其机制。
