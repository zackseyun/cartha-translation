  text: And he was buried on Mount Lubar in the land of Ararat. And he completed 950 years of his life.
translation:
  language: zh_hans
  text: 他被葬在亚拉腊地的卢巴山上[a]。他的一生共满了九百五十年[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚拉腊地的卢巴，那座山”。
    reason: 原文“卢巴山”也可按同位结构理解为“卢巴，即那座山”。
  - marker: b
    text: 直译：“他在一生中满了九百五十年。”
    reason: 说明原文介词结构，同时保留主文较自然的汉语表达。
lexical_decisions:
- source_word: ተቀብረ
  choice: 葬
  rationale: 该动词表示“被埋葬”；汉语以“葬在”自然表达其被动含义，无须使用生硬的“被埋葬”。
- source_word: ሉባር፡ ደብር
  choice: 卢巴山
  rationale: “ደብር”在此指山，与专名“ሉባር”连用，按现代汉语地名习惯译作“卢巴山”。
- source_word: ምድረ፡ አራራት
  choice: 亚拉腊地
  rationale: 保留“地、地域”之义，不把它缩窄为单指亚拉腊山。
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ
  choice: 年日共满了九百五十年
  rationale: “ፈጸመ”有完成、满数之意；“共满了”既贴近原文，也符合汉语记述寿数的庄重表达。
- source_word: በሕይወቱ
  choice: 他一生的
  rationale: 字面为“在他一生中”；在汉语中转为修饰“年日”，表达自然且不改变意义。
