revisions:
- from: 众灵之使者马斯特马来了，说：“主啊，创造者，请让他们中间有一些留在我面前，让他们听从我的话，照我吩咐他们的一切去做。因为如果他们中间没有一些留给我，我就无法在世人身上施行我意愿的权柄；这些灵是用来败坏人、使人走迷的，直到我的审判来到，因为世人的邪恶实在深重。”
