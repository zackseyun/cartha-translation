base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/008.yaml
  text: And the angel of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me from among them, I will not be able to exercise the authority of my will over the children of men, for these are for corrupting and leading astray before my judgment, for great is the wickedness of the children of men.”
translation:
  language: zh_hans
  text: 众灵之使者马斯特马来了，说：“主啊，创造者，请让他们中间有一些留在我面前，让他们听从我的话，照我吩咐他们的一切去做。因为如果他们中间没有一些留给我，我就无法对世人施行我意愿的权柄；因为这些灵是要在我的审判之前败坏人、使人走迷的，世人的邪恶实在深重。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: 众灵之使者马斯特马
  rationale: 按句法将መስተማ视为明确出现的专名“Mastema”，而不译作“剩下的”；መልአከ፡ መናፍስት直译为“众灵之使者”，既保留属格关系，也采用自然中文。
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: 请让他们中间有一些留在我面前
  rationale: 保留“从他们中留下若干”以及“在我面前”的空间或隶属意味，不擅自解释为彻底交由马斯特马管辖。
- source_word: ወይስምዑ፡ ቃለየ
  choice: 让他们听从我的话
  rationale: “听我的声音/话”在上下文中含服从意味；“听从我的话”兼顾源语意象与现代汉语自然度。
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: 施行我意愿的权柄
  rationale: 保留“施行/行使”“权柄”和“我的意愿”三个语义成分，避免简化成仅仅“随心所欲”。
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: 败坏人、使人走迷
  rationale: 分别表达败坏与引入歧途两个并列动作，并在中文中补出受事“人”，使句意清楚。
- source_word: ቅድመ፡ ኵነኔየ
  choice: 直到我的审判来到
  rationale: 源语字面可理解为“在我的审判之前”；结合汉语表达，以“直到……来到”呈现这些灵在审判前所起作用，同时未将“我的审判”改成上帝的审判。
theological_decisions:
- issue: 马斯特马的身份与名称
  choice: 译作专名“马斯特马”，并称其为“众灵之使者”
  alternative: 译作“剩下之灵的使者”，省略马斯特马之名
  rationale: 吉兹文明确含有መስተማ这一专名；将其误解为“剩下的”既遗漏人物名，也改变其身份。
- issue: “我的审判”的归属
  choice: 保留第一人称“我的审判”
  alternative: 解释为“上帝的审判”或“他们受审判”
  rationale: 源文使用第一人称所有形式；即使其神学指向或叙事含义存在张力，也不应在正文中替换归属。
- issue: 邪灵的作用
  choice: 译为“这些灵是用来败坏人、使人走迷的”
  alternative: 弱化为“这些灵可能败坏、迷惑人”
  rationale: 源文表达其目的或功用，语气强于可能性；译文保留这一令人不安的神学张力，不补入许可、预定等体系化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。祷告式称呼译为“主啊，创造者”，保留呼语的直接性；整体避免古奥文言，也不以现代心理学或特定宗派术语解释邪灵、权柄与审判。
