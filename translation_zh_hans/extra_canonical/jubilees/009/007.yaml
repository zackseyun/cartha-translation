  source_fidelity: 译文整体保留了疆界描述的三个动作及方位：延伸、折回、向东延伸，并将地名作音译。惟“到法拉以西附近”在汉语中容易被理解为“到法拉西侧附近”，没有清楚表达原文“直到接近法拉以西之地”的未抵达意味；“折回亚非拉格”也宜明确其朝向。
