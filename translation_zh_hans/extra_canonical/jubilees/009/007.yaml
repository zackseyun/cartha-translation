  text: And it extends until it approaches west of Fara, and it returns toward Aferag, and it extends eastward toward the waters of the Sea of Me'at.
translation:
  language: zh_hans
  text: 它延伸，直到接近法拉以西之地；又折回，朝亚非拉格，向东延伸到米阿特海的水域。
  philosophy: optimal-equivalence
