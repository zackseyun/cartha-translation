  yaml_path: translation/extra_canonical/jubilees/009/009.yaml
  text: And the prince of spirits, Mastema, came and said, "Lord, Creator, leave some of them to me, and let them listen to my voice and do everything that I tell them; for if none of them is left to me, I will not be able to exercise the authority of my will among the children of men, because they are for corrupting and leading astray before my judgment, for great is the evil of the sons of men."
translation:
  language: zh_hans
  text: 众灵之长玛斯提玛[a]前来，说：“主啊，创造者，请把他们中的一些留给我，让他们听从我的声音，照我吩咐他们的一切去做。因为若他们中没有一个留给我，我就无法在人类中施行我意愿的权柄。他们是用来在我的审判之前败坏人、使人走迷的，因为人类的恶甚大。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众灵之长”所对应的原文也可理解为“众灵的天使”或“众灵的使者”；“玛斯提玛”是此敌对灵界人物的名字。另有译法把整句理解为：“那名为玛斯提玛的首领前来，说……”
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: 众灵之长玛斯提玛
  rationale: 保留“众灵之长”这一明确头衔及专名“玛斯提玛”；መልአክ 可指使者、天使或统领者，此处结合人物地位译作“之长”，而不把头衔省略。
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: 请把他们中的一些留给我
  rationale: 按上下文表达从邪灵中留下若干归玛斯提玛支配；“一些”虽由语境补足，却是汉语中传达部分关系所必需。
- source_word: ይስምዑ፡ ቃለየ
  choice: 听从我的声音
  rationale: 兼顾字面“听我的声音”和实际含义“服从”，采用现代汉语自然且仍保留声音意象的表达。
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: 施行我意愿的权柄
  rationale: 保留“权柄”与“意愿”两个来源概念，不简化为单纯的“为所欲为”。
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: 败坏人、使人走迷
  rationale: 分别反映“腐化、毁坏”与“使偏离、诱入迷途”两个并列使役动词。
- source_word: ቅድመ፡ ኵነኔየ
  choice: 在我的审判之前
  rationale: 直译时间或位置关系，保留原文略显张力的措辞，不擅自解释为“直到审判之日”或“受我审判”。
theological_decisions:
- issue: 玛斯提玛的身份头衔
  choice: 众灵之长
  alternative: 众灵的天使／灵界之首
  rationale: 原文头衔可有“天使、使者、首领”的词义范围；结合《禧年书》中玛斯提玛作为敌对灵体统领者的语境，用“之长”最能避免把“众灵”误读为其本质类别，同时不引入后世体系化的魔鬼论称谓。
- issue: 邪灵的作用与玛斯提玛的审判
  choice: 他们是用来在我的审判之前败坏人、使人走迷的
  alternative: 我要借他们败坏人、使人走迷，直到我的审判来到
  rationale: 原文说明这些灵的败坏和迷惑功能，但施事、目的及“在审判之前”的准确关系有张力；正文不补入“我要借”或“直到”，以免过度厘清神学因果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。称呼“主啊，创造者”保留原文并列呼语；全段维持玛斯提玛第一人称陈述中的威胁性和神学张力，不以“撒但”等后世常用称号替换其专名。
