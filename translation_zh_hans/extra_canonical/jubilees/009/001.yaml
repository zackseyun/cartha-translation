  to: 至于南方，为闪划出了一份土地，直到临近海的中央[a]。至于玛代，也划出了一份土地，使他占有他两位兄弟以西之地，直到众岛屿，直到它们的边界。
  rationale: 修订首句以消除“他的份”与“闪的份”的不必要重复和指代歧义，并使分地表述符合现代庄重汉语。第二句保留源文及英文审校轨迹所要求的“两位兄弟以西”，不指明这两位兄弟是谁；“直到众岛屿，直到它们的边界”也保留原文重复的边界终点结构。
