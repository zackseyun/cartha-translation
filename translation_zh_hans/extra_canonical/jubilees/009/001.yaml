base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/001.yaml
  text: And for the south there came out his portion[1], for Shem, as far as it approaches the middle of the sea. And for Madai there came out a portion, that he should possess from the west of his two brothers, as far as the islands and as far as their borders.
translation:
  language: zh_hans
  text: 至于南方，为闪划出了一份土地，直到临近海的中央[a]。至于玛代，也划出了一份土地，使他占有他两位兄弟以西之地，直到众岛屿，直到它们的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章开头所提供的分地段落可能残缺；这里的边界表述较为简略，“海的中央”具体指何处并不确定。
    reason: segmentation_note
lexical_decisions:
- source_word: መክፈልት
  choice: 份
  rationale: 指土地分配所得的份额；“份”自然简洁，也保留分地语境。
- source_word: ይቀርብ
  choice: 临近
  rationale: 保留“接近、临到”的空间含义，不把边界关系过度具体化。
- source_word: ሜአት
  choice: 中央
  rationale: 按所给文本及篇章地界语境理解为“中部、中央”，与“海”连用译作“海的中央”。
- source_word: ማዳይ
  choice: 玛代
  rationale: 采用该圣经人物及族名在现代中文中的常见音译。
- source_word: የአኅዝ
  choice: 占有
  rationale: 在分配土地的语境中表达取得并持有，不采用带强烈暴力意味的“抢夺”。
- source_word: ለክአኢሆሙ፡ አኅዊሁ
  choice: 他两个兄弟
  rationale: 明确保留“两个”的数目，避免误解为泛指多个兄弟。
- source_word: ደስያት
  choice: 众海岛
  rationale: 以复数表达诸岛；“海岛”符合中文地理边界叙述。
- source_word: ጽነፊሆን
  choice: 其疆界
  rationale: 保留复数对象所关联的边缘、边界含义，中文用“疆界”较庄重自然。
theological_decisions:
- issue: 南方所得之份与闪的关系
  choice: 用同位说明“他的份，就是闪的份”
  alternative: 将“为闪”理解为动作的受益对象
  rationale: 原文句法简略且所供章节开头可能残缺；同位表达既交代闪，又不补入原文没有的人物或地名。
- issue: 玛代所得土地与两个兄弟的方位关系
  choice: 译为“他两个兄弟以西之地”
  alternative: 译为“从西方为他的兄弟们取得”
  rationale: 结合数词“两个”和土地分配语境，此译更合乎源语构造；但相关格关系存在解释空间，因此不进一步指明两位兄弟是谁。
translation_notes:
  register: 采用现代、庄重而易懂的地界叙述语体；保留原文重复的“划出一份”结构及边界表达，不补入源文未见的含、基训、伊甸园等内容。
