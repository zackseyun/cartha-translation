base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/013.yaml
  text: And I[13], your servant, remain alone instead of the boy as a servant to my lord, and let the young man go with his brothers, for I became surety for him from the hand of your servant, our father. And if I do not bring him back, your servant will bear the blame before our father all our days.’
translation:
  language: zh_hans
  text: “就让我——你的奴仆——独自留下，代替这孩子作我主的奴仆；让这少年人同他的弟兄们一起去。因为我曾向你仆人、我们的父亲为他作保。若我不把他带回来，你的奴仆在我们有生之日，都要在我们的父亲面前担当罪责。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存吉兹文本的句法较为紧缩，个别代词及末句的复数形式也不规则。本译文按上下文保留主要意思：犹大提出代替孩子留下，并说明自己曾向父亲为他作保。
    reason: segmentation_note
lexical_decisions:
- source_word: ገብርከ / ገብረ
  choice: 你的奴仆／作……的奴仆
  rationale: 该词在此表达臣服、受辖制的身份；译作“奴仆”既保留其强度，也符合犹大对统治者自谦的语境。
- source_word: ህየንቴሁ
  choice: 代替这孩子
  rationale: 表示替代关系，即犹大提出自己留下，取代孩子所处的位置。
- source_word: ወሬዛ
  choice: 这少年人
  rationale: 指同一位较年轻的人；“少年人”比“男孩”更适合庄重叙事语体。
- source_word: ተሀበይክዎ
  choice: 我曾……为他作保
  rationale: 按该段与创世记44章平行的语义理解为承担保证责任，而非“受托”或“从母亲那里接来”。
- source_word: ይሌብከ
  choice: 担当罪责
  rationale: 此处指因未能履行保证而承担过失或罪责；“担当罪责”保留其道德与关系层面的分量。
- source_word: ኵሎነ መዋዕለ
  choice: 在我们有生之日
  rationale: 尽量保留传本中的复数表达“我们所有的日子”，而不擅自改为更常见的“我一生”。
theological_decisions:
- issue: 犹大留下的身份性质
  choice: 代替孩子作奴仆
  alternative: 仅说“为孩子作保”
  rationale: 本节前半明确提出实际替代：犹大留下服役，让少年人随哥哥们回去；不应把这一行动缩减为抽象的担保。
- issue: 末句复数“我们的日子”
  choice: 译作“在我们有生之日”
  alternative: 按创世记平行经文顺译为“我一生”
  rationale: 现存吉兹文本呈现复数形式；即使表达略显异常，也应保存文本张力，不依平行经文静默校正。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就让我”自然表达原文的请求语气；“同他的哥哥们回去”依上下文补足移动方向。“你仆人、我们的父亲”保留对约瑟说话时的双重关系称谓。
