  text: '"we will be servants to our lord." And he said to them, "Not so. The man with whom I found it—he alone'
translation:
  language: zh_hans
  text: “我们要作我们主人的奴仆。”他对他们说：“不可这样。我在谁那里找到它，谁就……”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንትቀነይ
  choice: 我们要作……的奴仆
  rationale: 该动词表达服役、为奴之意；结合复数第一人称，译出“我们要作……的奴仆”，保留原文较强的从属语气。
- source_word: ለእግዚእነ
  choice: 我们主人
  rationale: እግዚእ 在此为人间的“主人”，带第一人称复数领属成分，故译“我们主人”，不作神称。
- source_word: አኮ፡ ከማሁ
  choice: 不可这样
  rationale: 否定词与“如此、这样”合用，表示拒绝对方所提方案；中文用“不可这样”自然而庄重。
- source_word: በኀበ፡ ብእሲ
  choice: 在谁那里……那人
  rationale: 原结构直指“在其处”的那个人；中文以“在谁那里……那人”保留关系结构。
- source_word: ዘረከብክዎ
  choice: 我找到了它
  rationale: 动词形态明确含第一人称单数主语及第三人称单数宾语后缀，宜译为主动句，不采用“它被找到”的被动表达。
- source_word: ኪያሁ፡ ባሕቲቶ
  choice: 只有那人
  rationale: 代词加“单独、唯独”构成排他强调，译作“只有那人”。
