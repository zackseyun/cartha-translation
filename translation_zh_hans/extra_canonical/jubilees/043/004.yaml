  naturalness: 修订后采用“照着这话对他们说”这一庄重而自然的叙事表达，并使末句的第一人称论证关系清楚连贯。“尚且”自然表达其反证式申辩。
  terminology: “仆人”符合该段人物对上位者的自称及经文叙事语域；“财物”可涵盖原文宽泛的财富／财货意义，不应窄译为“银子”。脚注锚点紧随“财物”，位置恰当。
