  yaml_path: translation/extra_canonical/jubilees/043/004.yaml
  text: And he ran after them and spoke to them according to this word. And they said to him, "Far be it from your servants to do this thing, and to steal from your lord's house any money or gold. The money that we found before in our sacks we, your servants, brought back from the land
translation:
  language: zh_hans
  text: 他就追上他们，照着这话对他们说。他们对他说：“你的仆人绝不做这样的事，也绝不会从你主人的家里偷走任何财物[a]或金子。我们先前在袋子里发现的财物，尚且从那地带了回来——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财物”也可译作“钱财”或“财货”；原文并非专指银子。
    reason: 说明原词的语义范围，并避免按照《创世记》44:8的平行措辞译成“银子”。
lexical_decisions:
- source_word: በከመ፡ ዝንቱ፡ ነገር
  choice: 把这些话告诉了他们
  rationale: 该短语直指前文所吩咐的话；按现代汉语自然表达为“把这些话告诉了他们”，而不生硬直译为“照着这话说”。
- source_word: ሐሰ፡ ሎሙ፡ ለአግብርቲከ
  choice: 你的仆人绝不……
  rationale: 这是强烈否认的惯用表达，相当于“断乎不可／远离你的仆人”；“绝不”既传达语气，也符合现代普通话。
- source_word: ንዋየ
  choice: 财物
  rationale: 该词可指财富、财货或钱财，并非专指银子；译作“财物”避免受《创世记》平行叙事影响而窄化为“银子”。
- source_word: ወርቅ
  choice: 金子
  rationale: 直接保留原文明确提到的黄金，与较宽泛的“财物”并列。
- source_word: እምድረ
  choice: 从那地
  rationale: 现有引文止于“从……地”，未保留地名；正文以“那地”表达已出现的成分，并用破折号标明句子在所给来源处未完。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“尚且”呈现他们由较强事实推出无罪申辩的语势。所给吉兹文在“从……地”处中断，因此以破折号保留未完句，不擅自补入地名或后续经文。
