  naturalness: “在我主耳中说一句话”是源语意象的逐词转写，在现代汉语中不自然；“向我主进一言”既保留恭敬的宫廷语域，也更符合现代书面汉语。其余措辞庄重清楚。
  terminology: “我主”“仆人”恰当保留臣属敬语；“兄弟二人”忠实于源文，不应在正文改为“两个儿子”。脚注可说明较顺畅但较解释性的另一种关系表达。
