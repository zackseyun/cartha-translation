- from: 犹大说：“我主啊，求你容仆人在我主耳中说一句话。他的母亲给你仆人——我们的父亲——生了兄弟二人。[a]一个出去了，失落了，没有人找到他；如今只剩他一人，是他母亲所留下的；而你仆人……”
  to: 犹大说：“我主啊，求你容仆人向我主进一言。他的母亲为你仆人——我们的父亲——生了兄弟二人。[a]一个出去了，失落了，没有人找到他；他是他母亲所生的唯一留下的人；而你仆人……”
