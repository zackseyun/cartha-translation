  text: And Judah said, "I beg you, my lord, let your servant speak a word in my lord's hearing. His mother bore two brothers to your servant, our father. One went out and was lost, and no one has found him; and he alone remains from his mother, and your servant..."
translation:
  language: zh_hans
  text: 犹大说：“我主啊，求你容仆人向我主进一言。他的母亲为你仆人——我们的父亲——生了兄弟二人。[a]一个出去了，失落了，没有人找到他；他是他母亲所生的唯一留下的人；而你仆人……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的父亲，就是你仆人，从同一个母亲得了两个儿子。”
    reason: 原文语序及代词指向紧密，正文保留“他的母亲”“生了”“兄弟二人”的表述；脚注提供从父亲视角重新组织关系的较通顺译法，不取代正文。
lexical_decisions:
- source_word: ሳዕሌየ፡ እግዚኦ
  choice: 我主啊，求你
  rationale: 以自然而恭敬的现代汉语表达恳求语气，同时保留对上位者的称呼。
- source_word: አትናገር፡ ገብርከ፡ ቃለ፡ ውስተ፡ እዝነ፡ እግዚእየ
  choice: 容仆人在我主耳中说一句话
  rationale: 紧贴原文“让你的仆人在我主耳中说一句话”的身体意象和宫廷敬语，不改写成较抽象的“听我说”。
- source_word: ክልኤተ፡ አኀወ
  choice: 兄弟二人
  rationale: 保留原文“两个兄弟”，不以关系推论改作“两个儿子”。
- source_word: ወለደት፡ እሙ፡ ለገብርከ፡ ለአቡነ
  choice: 他的母亲给你仆人——我们的父亲——生了
  rationale: 保留原文“他的母亲”“生了”以及“你仆人、我们的父亲”的同位关系；破折号帮助现代读者辨认插入说明。
- source_word: ወፅአ፡ ወተገደፈ
  choice: 出去了，失落了
  rationale: 分别呈现两个动词，保留叙述含蓄性，不擅自明确为死亡或被害。
- source_word: ወአልቦ፡ ዘተረክበ
  choice: 没有人找到他
  rationale: 按原文否定存在结构自然译出，不推断搜寻者身份。
- source_word: ወውእቱ፡ ባሕቲቱ፡ ተረፈ፡ እምእሙ
  choice: 如今只剩他一人，是他母亲所留下的
  rationale: 保留“他独自留下/余下”及“从他母亲而来”的关系；用中文分句避免误读。
- source_word: ወገብርከሂ
  choice: 而你仆人……
  rationale: 原文片段止于未完成短语，使用省略号忠实显示话语在本节末中断。
theological_decisions:
- issue: 失落之人的结局
  choice: 失落了
  alternative: 死了／被撕碎了
  rationale: 本段原文没有明确说明死亡方式；保留其叙事上的含蓄与张力。
- issue: “兄弟二人”与“两个儿子”的关系表达
  choice: 兄弟二人
  alternative: 两个儿子
  rationale: 原文直接使用“兄弟”，即使上下文可从父亲角度理解为儿子，也不以解释替换原词。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语，保留古代宫廷恳求中的“我主”“仆人”称谓。正文中的破折号用于标明同位说明；末尾省略号反映源文节选本身以未完成短语结束。
