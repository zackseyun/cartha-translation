  - severity: low
    issue: “在我主耳中说一句话”不合现代汉语搭配
    rationale: 虽反映原文“在……耳中”的意象，但中文通常说“向……进一言”或“在……耳边说”。前者在此宫廷恳求语境中自然且庄重。
