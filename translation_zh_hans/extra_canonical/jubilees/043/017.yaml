  text: Do not weep over me, but hurry and bring my father to me, and you see that it is my mouth that speaks, and the eyes of my brother Benjamin also see. For behold, this is the second year of the famine,
translation:
  language: zh_hans
  text: 不要为我哭泣；你们要赶快把我父亲带到我这里来。你们看见[a]：是我的口在说话；我弟弟便雅悯也亲眼看见。看哪，这是饥荒的第二年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们将会看见”。
    reason: 原文动词形式在此可表达现在或将来意义；正文依即时目睹的语境采用现在时。
lexical_decisions:
- source_word: ኢትብከዩ፡ ላዕሌየ
  choice: 不要为我哭泣
  rationale: 保留否定命令及“为我／因我”的关系，符合现代汉语表达。
- source_word: ወአፍጥኑ፡ ወእምጽእዎ፡ ለአቡየ፡ ኀቤየ
  choice: 你们要赶快把我父亲带到我这里来
  rationale: 准确表达催促、带来、父亲和趋向说话者等要素。
- source_word: ወትሬእዩ
  choice: 你们亲眼看见
  rationale: 在当前指认的语境中采用现在时；该未完成式也容许将来意义，故以脚注保留。
- source_word: ዘይነብብ፡ አፉየ
  choice: 是我的口在说话
  rationale: 保留原文突出“我的口”的具体表达，不改写为仅仅“是我说话”。
- source_word: ወአዕይንቲሁኒ፡ ለአኁየ፡ ብንያም፡ ይሬእያ
  choice: 我弟弟便雅悯的眼睛也看见了
  rationale: 保留“眼睛”和附加语气“也”，同时用汉语可理解的句式呈现。
- source_word: እስመ፡ ናሁ፡ ዝንቱ፡ ካልእ፡ ዓም፡ ዘዐባር
  choice: 看哪，这是饥荒的第二年
  rationale: 直译“第二年”和“饥荒”的属格关系，不加入“仍有五年”或“持续”等原文未明说的内容。
