  text: and ten donkeys carrying grain. And he sent them away. And they went up and told their father that Joseph was alive, and that he was distributing grain to all the peoples of the earth and ruling.
translation:
  language: zh_hans
  text: 又有十头驮着粮食的驴。他打发他们离去了。他们上去告诉父亲：约瑟仍然活着，并且正向地上万民分发粮食，掌权统治。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐሠርተ፡ አእዱገ፡ ዘይወስዱ፡ ስርናየ
  choice: 十头驮粮食的驴
  rationale: 按词义直译数量、牲畜及其负载；“驮粮食”符合现代汉语习惯。
- source_word: ይበፍር፡ ስርናየ
  choice: 分发粮食
  rationale: 保留向众人配给、分发粮食的动作含义，不增添买卖等原文未明说的信息。
- source_word: ለኵሉ፡ አሕዛበ፡ ምድር
  choice: 向地上各族
  rationale: “各族”既表达复数群体，也避免将其不必要地限缩为政治意义上的国家。
- source_word: ወይኴንን
  choice: 治理他们
  rationale: 该动词表达统治、治理或施行权柄；采用中性的“治理”，并补出汉语所需的宾语，其指向依上下文为地上各族。
theological_decisions:
- issue: 约瑟治理的对象和范围
  choice: 治理他们
  alternative: 掌权／作王
  rationale: 原文末尾仅陈述治理或统治，没有明确使用“作王”称号；译文保留广泛权柄的陈述而不提升为特定王权身份。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。保留原文短句推进的节奏；“上去”沿用地理叙事中的方向表达。
