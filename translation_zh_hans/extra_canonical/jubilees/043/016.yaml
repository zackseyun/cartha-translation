  text: And he embraced their necks and wept[16], but they did not recognize him, and they also wept. And he said to them,
translation:
  language: zh_hans
  text: 他搂住他们的颈项，哭了[a]；他们却没有认出他来，也哭了。于是他对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们却没有认出他来”可能表示：约瑟表明身份时，他们仍因震惊而未能认出他，或尚未完全确认他的身份。
    reason: alternative_reading
lexical_decisions:
- source_word: ሐቀፈ፡ ክሳውዲሆሙ
  choice: 搂住他们的颈项
  rationale: 按原文保留具体的拥抱动作与身体部位；“搂住”比生硬的“拥抱他们的颈项”更符合现代汉语。
- source_word: በከየ
  choice: 哭了
  rationale: 直接传达原文的哭泣动作，语言自然简洁。
- source_word: ኢያእመርዎ
  choice: 没有认出他来
  rationale: 这里的动词在叙事情境中表示未能辨认其身份；保留原文与约瑟已经显露身份之间的张力。
- source_word: አንከ፡ ይብከዩ
  choice: 也哭了
  rationale: 体现对方随之哭泣，保留原文简洁的并列结构。
- source_word: ወይቤሎሙ
  choice: 于是他对他们说
  rationale: 作为引出下一节话语的叙事公式，以冒号保留未完待续的句法。
theological_decisions:
- issue: 约瑟显明身份后，兄弟们仍“没有认出他”的叙事张力
  choice: 正文直译为“他们却没有认出他来”，并以脚注说明其可能含义
  alternative: 解释性译为“他们一时仍不敢相信是他”或“他们还没有完全认出他”
  rationale: 原文明确否定他们认出他，却未解释原因；不应在正文中替作者消除这种含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；“搂住他们的颈项”保留原文的具体意象，“却”凸显未能认出的反差。脚注标记置于“哭了”之后，与所给校订层的位置对应，但脚注内容解释随后整句的叙事难点。
