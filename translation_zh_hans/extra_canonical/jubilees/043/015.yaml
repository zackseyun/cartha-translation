  text: And he could no longer restrain himself, and told them that he was Joseph. And he spoke with them in the Hebrew language.
translation:
  language: zh_hans
  text: 他再也忍不住了[a]，便告诉他们自己就是约瑟。随后，他用希伯来语跟他们说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“他克制住了自己”或“他忍住了”，没有明确的否定词；但上下文以及与《创世记》45:1的对应关系支持正文的译法。
    reason: 原文的字面形式与叙事情境之间存在文本歧义，需同时保留两者。
lexical_decisions:
- source_word: ተዐገሦ
  choice: 再也忍不住了
  rationale: 该词本身通常表示“忍耐、克制自己”，原文未见否定词；但此处随即揭示身份，且与《创世记》45:1的叙事情境明显对应，因此正文按语境表达为“再也忍不住了”，同时用脚注保留原文的字面读法。
- source_word: ነገሮሙ፡ ከመ፡ ውእቱ፡ ዮሴፍ
  choice: 告诉他们自己就是约瑟
  rationale: 自然表达原文“告诉他们，他是约瑟”；“就是”体现身份揭示的语气，但不增加额外内容。
- source_word: በከመ፡ ልሳነ፡ ዕብራይስጥ
  choice: 用希伯来语
  rationale: 原文意为以希伯来人的语言说话；现代汉语通常简洁表述为“用希伯来语”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“随后”使两个连续动作衔接清楚；正文不生硬照录可能受损的字面形式，而以脚注明示原文证据及其歧义。
