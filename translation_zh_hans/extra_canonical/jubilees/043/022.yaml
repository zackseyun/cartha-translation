  language: zh_hans
  text: 他又照法老的吩咐，给他们车和旅途所需的给养。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቃለ፡ አፈ፡ ፈርዖን
  choice: 照法老的吩咐
  rationale: 原文直译为“按法老口中的话”，现代汉语用“照……的吩咐”自然表达命令的权威和依据。
- source_word: ሰረገላተ
  choice: 车辆
  rationale: 指供他们返乡及接家眷使用的车；“车辆”既保留交通工具的含义，也避免误解为战争用的战车。
- source_word: ስንቀ፡ ለፍኖት
  choice: 路上所需的粮食
  rationale: 意为旅途中的口粮或给养；此译法在现代汉语中清楚自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。所给吉兹文本开头的“እግዚአብሔር፡ ብዕለ፡ ወክብረ።”在语法上像是前句末尾的残片，并且英语审校层未将其列入本节；依据章节切分信息，本译文不把该残片纳入43:22。主语依上下文保留为“他”，不擅自补明为约瑟。
