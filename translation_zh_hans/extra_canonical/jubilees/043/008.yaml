  text: 他们撕裂自己的衣服，把东西装在驴背上，返回城里，来到那所房子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠጠጡ፡ አልባሲሆሙ፡
  choice: 撕裂衣服
  rationale: 直译该短语所表达的撕裂自己衣服这一举动，并采用现代汉语中自然、庄重的说法。
- source_word: ጸዐኑ፡ ዲበ፡ አእዱጊሆሙ፡
  choice: 把东西驮在驴上
  rationale: 原文表示“装载在他们的驴上”，未明说所装之物；汉语补出泛指的“东西”，使句意通顺而不擅自限定具体货物。
- source_word: ተመይጡ፡ ሀገረ፡
  choice: 返回城里
  rationale: 体现“返回”与目的地“城”的含义；“城里”符合现代汉语叙事习惯。
- source_word: ወበጽሑ፡ ቤተ፡
  choice: 来到那所房子
  rationale: 保留原文末尾“来到／抵达房子”的完整分句，并以“那所”自然指向上下文已知的住所。
