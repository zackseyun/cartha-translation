  text: and over all the land of Egypt. And tell my father of all my honor and of all that has been given to me."
translation:
  language: zh_hans
  text: 并管理埃及全地。你们要把我一切的尊荣，以及他所量定并赐给我的一切，都告诉我父亲。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”所指原文未明说；“量定”也可译作“分给”。
    reason: 保留第三人称施事者的指代含混，并说明መጠነ的另一种自然译法。
lexical_decisions:
- source_word: ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  choice: 管理埃及全地
  rationale: ዲበ本义为“在……之上”，此处承接上文所述权柄，用现代汉语“管理”自然表达其治理含义；句首“也”保留连接关系。
- source_word: ኵሎ፡ ክብረየ
  choice: 我所得的一切尊荣
  rationale: ክብር表示尊荣、荣耀或显赫地位；“所得”使中文通顺，但不限定尊荣来自何种具体形式。
- source_word: ዘመጠነ፡ ወሀበኒ
  choice: 他所量定并赐给我的一切
  rationale: 保留መጠነ“衡量、量定、分配”和ወሀበኒ“并赐给我”两个动作，不像英译咨询文本那样将前者省略；第三人称单数施事者在本节中未明说。
- source_word: ዜንውዎ፡ ለአቡየ
  choice: 告诉我父亲
  rationale: 按“向某人述说、报告”的语义译为自然的现代汉语。
theological_decisions:
- issue: “他所量定并赐给我”中的施事者身份
  choice: 正文保留“他”，脚注说明所指未明
  alternative: 直接译作“上帝所量定并赐给我的”
  rationale: 原文动词带第三人称阳性单数主语，但本节没有明说其所指；直接补出“上帝”会消除原文保留的指代空间。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“尊荣”兼顾身份与荣耀；“量定并赐给”略带经文语体，以保留原文两个相连动词及其神学张力。
