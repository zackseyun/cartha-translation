  yaml_path: translation/extra_canonical/jubilees/043/012.yaml
  text: our father loves him, and his life is bound up with his life. And it will happen, when we go to your servant our father, if the boy is not with us, that he will die, and we will afflict our father with sorrow to death.
translation:
  language: zh_hans
  text: 我们的父亲疼爱他，他的性命与这孩子的性命连在一起。我们回到你仆人——我们的父亲——那里时，如果这孩子不和我们在一起，他就会死[b]；我们就会使父亲因悲伤而受苦[a]至死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使父亲因悲伤而受苦”也可按语境译作“使父亲悲痛”。
    reason: 源文动词可指使人受苦、折磨或惩治；本句与“悲伤”连用，表达使父亲因悲伤受苦。
  - marker: b
    text: “他”按上下文指父亲；也可译作“那老人就会死”。原文只说“他就会死”。
    reason: 说明代词指向及较明确的语境译法，同时保留源文未明说名词的特点。
lexical_decisions:
- source_word: ያፈቅሮ
  choice: 疼爱他
  rationale: 该动词表达爱；在父亲对幼子的语境中，“疼爱”比泛泛的“爱”更自然，同时不增添原文没有的神学含义。
- source_word: ነፍሱኒ፡ እስርት፡ እምነፍስዝ
  choice: 他的性命与这孩子的性命连在一起
  rationale: 保留“性命／灵魂被系在一起”的源文意象，并用现代汉语自然表达；“这孩子”明确第二个“性命”的所指。
- source_word: ወሬዛ
  choice: 这孩子
  rationale: 该词指少年或男孩；此处结合上下文译为“这孩子”，符合父子关系和叙事语境。
- source_word: ንቀጽዕ
  choice: 使……悲痛
  rationale: 该动词可指使受苦、折磨或惩治；结合后接“以悲伤”和父亲将死的语境，译作“使……悲痛”既贴合本句搭配，也避免误从《创世记》平行经文套用“使下到”。
theological_decisions:
- issue: “他的性命与这孩子的性命连在一起”中的生命关联
  choice: 保留具体的“性命”意象
  alternative: 他的心与这孩子紧紧相连
  rationale: 源文重复使用“灵魂／性命”，不宜将其纯粹心理化为“心”，以免削弱原文关于生命彼此系连的强烈表达。
- issue: “他就会死”的指代
  choice: 正文保留代词，并以脚注说明语境所指
  alternative: 那老人就会死／我们的父亲就会死
  rationale: 源文只有第三人称阳性单数动词，没有明说“老人”或再次写出“父亲”；保留代词可避免把上下文解释直接写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你仆人——我们的父亲——”以破折号呈现同位关系；“悲痛至死”保留源文强烈而略带古雅的终极表达。
