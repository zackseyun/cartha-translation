  text: his servants. Look, we are servants to our lord, we and our donkeys also." And Joseph said to them, "God forbid that I should do this[10]. You, go to your houses; but your youngest brother shall be my servant, because you have done evil. Did you not know that a man surely divines with his cup, as I do?
translation:
  language: zh_hans
  text: 作他的奴仆。看哪，我们和我们的驴也都作我主的奴仆。”约瑟对他们说：“上帝绝不允许我这样做[a]。你们回家去吧；但你们最小的弟弟要作我的奴仆，因为你们行了恶事。难道你们不知道，像我这样的人岂不是会用杯占卜吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝绝不允许我这样做”一句的原文艰涩。上下文的总体意思是：约瑟坚决拒绝众兄弟提出的方案，不让所有人都作奴仆，只让那与杯有关的人留下。
    reason: textual_variant
lexical_decisions:
- source_word: አግብርት / ቅኔየ
  choice: 奴仆
  rationale: 这些词在本段指受主人支配、留下服役的人；译作“奴仆”既保留古代社会关系，也比单纯的“仆人”更准确。
- source_word: እግዚእነ
  choice: 我主
  rationale: 保留对约瑟的尊称及主仆语境，用现代中文可懂而庄重的“我主”。
- source_word: ያስተቀስም
  choice: 占卜
  rationale: 该动词在杯的语境中表示借杯施行占卜；不将叙事陈述扩展为对该行为的神学评价。
- source_word: እኑክሙ
  choice: 你们最小的弟弟
  rationale: 词形在抄本文本中有困难；依本章情境及平行叙事，所指是被杯栽赃并将留下的最小弟弟。
theological_decisions:
- issue: 约瑟是否实际实行占卜
  choice: 保留“像我这样的人必用他的杯占卜吗”的叙事措辞
  alternative: 解释为约瑟只是伪装会占卜，或改成“查验”
  rationale: 原文以修辞问句提及借杯占卜，但未明确裁定约瑟是否真的这样做；译文不替叙事消除这一张力。
- issue: 约瑟拒绝众兄弟一同为奴的难句
  choice: 上帝绝不容我这样做
  alternative: 愿上帝使我远离恐惧／上帝忍耐了恐惧
  rationale: 埃塞俄比亚文本此处措辞艰涩，直译难以形成稳定语义；按上下文，约瑟是在强烈拒绝让所有人留下为奴，因此正文采用语境上最可能的意义，并以脚注说明困难。
translation_notes:
  register: 采用现代、庄重且易懂的叙事中文。保留经文起首承接上节的残句形态；对“奴仆”和“占卜”不作淡化。引号内用“看哪”体现原文提示语的郑重感。
