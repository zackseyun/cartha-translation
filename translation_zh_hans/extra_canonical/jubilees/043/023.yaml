  text: And he gave all of them changes of garments and silver[23]. And to their father also he sent garments and silver.
translation:
  language: zh_hans
  text: 他给他们每个人一套换洗衣服[a]和银子；又给他们的父亲送去衣服和银子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “换洗衣服”所译的吉兹语短语，也可理解为“各样的衣服”或“彩色衣服”。
    reason: 保留原文词组在“替换、种类、颜色”之间的词义可能性。
lexical_decisions:
- source_word: አልባሰ፡ ኅብር
  choice: 替换的衣服
  rationale: 该短语直译可能指“有变化的衣服”“各样的衣服”或“彩衣”；结合《创世记》45:22的平行语境，这里更可能是指可供替换的一套套衣服。
- source_word: ብሩረ
  choice: 银子
  rationale: 按该词通常所指译为银子；原文没有说明数量或具体银制物品。
- source_word: ለኵሎሙ
  choice: 他们每个人
  rationale: 明确表达分配对象为众人中的每一位，比笼统的“所有人”更符合此处赠礼语境。
- source_word: ፈነወ
  choice: 送去
  rationale: 表达差遣人把礼物送给不在场的父亲，符合动词在此语境中的动作方向。
