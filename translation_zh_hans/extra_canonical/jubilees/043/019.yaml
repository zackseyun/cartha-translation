  text: for preservation[19], go down, you and your households, so that you may not be consumed by the famine and not be distressed on account of your possessions. For God sent me before you quickly, so that they may live.
translation:
  language: zh_hans
  text: 你们和你们的家人要赶快下去，免得被饥荒吞灭，也免得因你们的财产而忧愁。因为上帝为了保全生命[a]，早已在你们以先差遣我，使他们可以活下去。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为了保全生命”也可理解为“为了存留余民”或“为了使人存活”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“使他们可以活下去”；“他们”的具体所指并不完全明确。
    reason: referential_ambiguity
lexical_decisions:
- source_word: ፍጡነ፡ ረዱ
  choice: 要赶快下去
  rationale: 保留副词“赶快”与复数命令“下去”的组合，语序自然且不把“赶快”误接到后面的差遣上。
- source_word: ኢትትሐጐሉ፡ በዐባር
  choice: 免得被饥荒吞灭
  rationale: 动词表达毁灭、消灭之意；“被饥荒吞灭”既贴近原文，也符合庄重的现代汉语。
- source_word: ኢትትከዙ
  choice: 免得……忧愁
  rationale: 该词意为悲伤、忧虑或苦恼，不译作与前一动词重复的“灭亡”。
- source_word: ጥዕንትከሙ
  choice: 你们的财产
  rationale: 依此处语境指随家属迁移时所牵挂的所有物或产业；“财产”通顺而不过度具体化。
- source_word: ለሠሪዕ
  choice: 为了保存生命
  rationale: 表达保存、存留或使幸存的目的；正文采用自然的概括说法，并以脚注保留“存留余民/使人存活”的可能理解。
- source_word: ይሕየዉ
  choice: 使他们可以活下去
  rationale: 严格保留原文第三人称复数形式，不改写为单数使役式“使你们存活”。
theological_decisions:
- issue: 上帝差遣约瑟在先的目的
  choice: 为了保存生命
  alternative: 为了存留余民／为了使人存活
  rationale: 原文目的语具有保存、幸存的语义空间；正文不把它限定为特定的神学术语。
- issue: 末句第三人称复数的指代
  choice: 使他们可以活下去
  alternative: 使你们可以活下去
  rationale: 原文动词是第三人称复数，所指对象在上下文中可能是家人以及相关生灵；保留代词张力，不擅自改为第二人称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吞灭”保留饥荒造成毁灭的力度；“忧愁”准确区分于前面的灭亡概念。正文与脚注中的标记完全对应。
