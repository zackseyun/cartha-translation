  text: over all the land of Egypt. And their father did not believe them, for his mind was stunned. But when he saw the wagons that Joseph had sent, the life of his spirit was renewed, and he said, "It is enough for me if Joseph is alive. I will go down and see him before I die."
translation:
  language: zh_hans
  text: 掌管埃及全地。他们的父亲却不相信他们，因为他心思恍惚。后来，他看见约瑟派来的车辆，他的心灵重新有了生气；他说：“约瑟若还活着，这对我就足够了。我会下去，在我死以前见他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  choice: 治理埃及全地
  rationale: 原文仅为“在／掌管埃及全地”这一承接上文的片语；结合上下文补出自然汉语所需的“治理”，同时保留其作为前句结尾的性质。
- source_word: ወአእምነ፡ አቡሆሙ
  choice: 他们的父亲不相信他们
  rationale: 动词表示“不信”；宾语由语境补足为“他们”，符合原文叙事关系与自然汉语表达。
- source_word: ደንገፀ፡ በሕሊናሁ
  choice: 他心里惊愕，无法相信
  rationale: 字面涉及内心或心思因震惊而失常、发愣；采用双短语表达震惊及由此产生的不敢置信，避免生硬的“心思昏厥”。
- source_word: ወተሐደሰት፡ ሕይወተ፡ መንፈሱ
  choice: 精神便重新振作起来
  rationale: 较直译为“他灵的生命更新了”；汉语用“精神重新振作”自然传达生命活力恢复之意，而不把“灵”过度术语化。
- source_word: ዐቢይ፡ ውእቱ፡ ሊተ፡ እመ፡ ዮሴፍ፡ ሕያው
  choice: 只要约瑟还活着，我就心满意足了
  rationale: 该句表达“约瑟活着，对我已是足够／大事”；译文保留满足感及条件关系，采用自然现代汉语。
- source_word: እረድ፡ ወእርአዮ፡ ዘእንበለ፡ እሙት
  choice: 我要下去见他一面，然后才死
  rationale: 依次表达“下去、见他、在我死以前”；“然后才死”在汉语中自然传达临终前得见之愿。
theological_decisions:
- issue: “灵的生命更新”是否应保留独立的灵魂术语
  choice: 精神便重新振作起来
  alternative: 他灵里的生命便恢复了
  rationale: 此处主要描写雅各从震惊、迟疑转为恢复活力，并非明确讨论灵魂构成；采用日常而庄重的“精神”，避免导入特定人论。
- issue: 临死前见约瑟的表述
  choice: 然后才死
  alternative: 在我死以前见他
  rationale: “然后才死”忠实体现人物认为见到约瑟后便可安然离世的情感，但不额外赋予死亡或来世方面的神学解释。
translation_notes:
  register: 采用现代、庄重、易懂的叙事汉语。经文开头承接上一节，保留其非独立句的性质；引语力求自然且有长者口吻。无脚注标记。
