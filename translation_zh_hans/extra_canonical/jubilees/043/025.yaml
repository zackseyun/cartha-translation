revisions:
- from: 治理埃及全地。他们的父亲不相信他们，因为他心里惊愕，无法相信。后来，他看见约瑟派来接他的车辆，精神便重新振作起来，说：“只要约瑟还活着，我就心满意足了。我要下去见他一面，然后才死。”
  to: 掌管埃及全地。他们的父亲却不相信他们，因为他心思恍惚。后来，他看见约瑟派来的车辆，他的心灵重新有了生气；他说：“约瑟若还活着，这对我就足够了。我会下去，在我死以前见他。”
  rationale: 修订保留首句作为承接上文的残留片语，并以“掌管”表达其上下文功能，同时删除本节未明说的“接他的”。将父亲的状态译为“心思恍惚”，避免与“不相信”重复；将“生命／灵”的恢复以非教义化而较完整的“心灵重新有了生气”表达。引语改为“这对我就足够了”，并恢复“在我死以前见他”的时间意义。
