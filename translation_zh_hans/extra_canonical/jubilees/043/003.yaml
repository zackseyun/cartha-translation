  text: And it happened[3], when they had gone out from there, Joseph said to the man of his house, "Pursue them, run and overtake them, saying, 'Instead of good you have repaid me evil; you have stolen from me the silver cup from which my lord drinks.' And bring back to me their youngest brother, and bring him quickly before I enter into my judgment."
translation:
  language: zh_hans
  text: 他们从那里出去以后，约瑟对管家说：“去追赶他们，跑去追上他们，对他们说：‘你们竟以恶报善，偷走了我的银杯，就是我主人用来喝酒的杯。’你要把他们最小的弟弟带回我这里；赶快把他带来，要在我开始审判以前。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句因分句方式和惯用语含义不够明确，也可理解为：“赶快把他带来，免得我进行审判。”这里按“在我开始审判以前”译出。
    reason: textual_and_segmentation_difficulty
lexical_decisions:
- source_word: ለብእሲ፡ ቤቱ
  choice: 管家
  rationale: 字面为“他家中的人”，在叙事语境中指约瑟家中的主管；“管家”简洁自然，也符合其受命追赶众人的职分。
- source_word: ደግፎሙ፡ ሩጽ፡ ወተአንዞሙ
  choice: 去追赶他们，跑去追上他们
  rationale: 保留连续命令及行动的急迫感；不把首词译作原文没有明确表达的“起来”。
- source_word: ህየንተ፡ ሠናይት፡ ዐሠይክሙኒ፡ እኩየ
  choice: 你们竟以恶报善
  rationale: ህየንተ 表示“代替、反而”；汉语成语“以恶报善”准确而自然地传达以恶取代善报的对照。
- source_word: ሠረቅክሙኒ
  choice: 偷走了我的
  rationale: 体现动词中的第一人称单数受事成分，即“从我这里偷走”，不省略“我”。
- source_word: ወአገብአ፡ ሊተ፡ ለአኁሆሙ፡ ዘይንእስ
  choice: 你要把他们最小的弟弟带回我这里
  rationale: 按人称和所有关系直译为“他们最小的弟弟”，并将此句视为约瑟继续吩咐管家，而不是管家要向兄弟们说的话。
- source_word: ዘእንበለ፡ እባእ፡ ውስተ፡ ምኵናንየ
  choice: 要在我开始审判以前
  rationale: ዘእንበለ 在此取时间义“在……以前”；“进入我的审判”按现代汉语表达为“开始审判”，同时保留审判主体及语义张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语层级明确区分约瑟对管家的命令与管家奉命要对众兄弟说的话；末句不强行消除原文在分句和逻辑关系上的困难，以脚注保留另一种可能。
