  yaml_path: translation/extra_canonical/jubilees/043/001.yaml
  text: And Joseph devised a plan by which he might know their thoughts, whether there was a thought of peace among them. And he said to the man who was over his house, "Fill all their sacks with grain, and put their money back in the middle of their bags; and put my silver cup, the cup from which I drink, in the sack of the youngest." And he sent them away.
translation:
  language: zh_hans
  text: 约瑟想出一个办法，要借此知道他们的心思，看看他们彼此之间是否存着和睦的心。他对管家说：“把粮食装满他们所有的袋子，把他们的钱放回他们的袋子里[a]；再把我的银杯，就是我喝水用的杯，放进最年幼的那个人的袋子里。”于是，他打发他们走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把各人的钱放回各人的袋子里。”
    reason: 原文“他们的钱”和“他们的袋子”均为复数；可按群体整体表达，也可依上下文作逐一分配的理解。正文保留原文的集合复数表达。
lexical_decisions:
- source_word: ሐለየ፡ ... ሕሊና
  choice: 想出一个办法
  rationale: 该搭配表达约瑟有意构思一个计策或办法；译作“想出一个办法”自然地体现谋划之意，而不是仅仅“思想”。
- source_word: ያአምር፡ ሕሊናሆሙ
  choice: 知道他们的心思
  rationale: 保留原文“知道”与“心思/意念”的表达，不将其具体化为动机或品格。
- source_word: ሕሊና፡ ሰላም፡ በበይናቲሆሙ
  choice: 他们彼此之间是否存着和睦的心
  rationale: “和平/和睦的意念”在此涉及兄弟彼此间的关系；译文保留其内在心意与关系层面的张力。
- source_word: ብእሲ፡ ዘላዕለ፡ ቤቱ
  choice: 管家
  rationale: 字面为“在他家之上的人”，现代汉语以“管家”简洁准确地表达其职分。
- source_word: ወርቆሙኒ፡ አግብእ፡ ሎሙ
  choice: 把他们的钱放回
  rationale: 动词含“使返回、归还”之意，故明确译出“放回”，避免受《创世记》平行经文影响而弱化该语义。
- source_word: ኮራ፡ ዘብሩር
  choice: 银杯
  rationale: 直接对应由银制成的杯。
- source_word: ሐስለ፡ ዘይንእስ
  choice: 最小的那个人的袋子
  rationale: 原文以“较小/最小者”指兄弟中最年幼者；采用不增添姓名的自然表达。
theological_decisions:
- issue: “和睦的心”所指范围
  choice: 译为“他们彼此之间是否存着和睦的心”
  alternative: “他们对他是否怀有善意”
  rationale: 原文包含“在他们彼此之间”的关系性措辞，并未明确限定为他们对约瑟的态度，因此不将对象窄化。
- issue: 约瑟行动的性质
  choice: “想出一个办法”
  alternative: “设下计谋”
  rationale: 原文表明有意谋划，但未必带有现代汉语“计谋”常有的贬义；中性措辞避免额外的道德判断。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留叙事的简洁性及“心思—和睦的心”的重复意象；“管家”“银杯”等词符合普通读者习惯。脚注标记[a]已置于正文对应位置。
