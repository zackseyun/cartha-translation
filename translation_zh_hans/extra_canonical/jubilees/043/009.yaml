  yaml_path: translation/extra_canonical/jubilees/043/009.yaml
  text: And they came to Joseph, and all of them bowed down before him with their faces to the ground. And Joseph said to them, "You have done evil." And they said, "What shall we say, and how shall we clear ourselves? Our Lord has found the guilt of your servants."
translation:
  language: zh_hans
  text: 他们来到约瑟那里，全都俯伏在他面前，脸贴着地。约瑟对他们说：“你们做了恶事。”他们说：“我们还能说什么？又怎能为自己辩解呢？上帝已经查出了你仆人们的罪孽。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰገዱ፡ ሎቱ፡ ኵሎሙ፡ በገጾሙ፡ ውስተ፡ ምድር
  choice: 全都俯伏在他面前，脸贴着地
  rationale: 准确表达众人向约瑟下拜、面伏于地的动作，也符合现代汉语叙事习惯。
- source_word: እኩየ፡ ገበርክሙ
  choice: 你们做了恶事
  rationale: 保留原文对行为的直接道德判断，不把“恶”具体化为原文未明说的罪名。
- source_word: ምነት፡ ንትዋቀስ
  choice: 又怎能为自己辩解呢
  rationale: 该动词在这里表示申辩、为自己开脱；译文以自然汉语传达反问语气。
- source_word: እግዚእነ
  choice: 我们的主
  rationale: 形式上保留第一人称复数所属和“主”的称谓，不在正文中强行判定所指。
- source_word: አበሳሆሙ
  choice: 他们的罪过
  rationale: 严格保留所给吉兹文的第三人称复数所属形式；因其与说话者语境存在张力，另加脚注说明。
theological_decisions:
- issue: “我们的主”所指是谁
  choice: 正文译作“我们的主”，不直接替换为“上帝”或“约瑟”
  alternative: 按《创世记》44:16的平行叙事明确译作“上帝”，或按当前对话译作“我主”指约瑟
  rationale: 吉兹文使用“我们的主”，其表达可作为神圣称谓，但当前对话场景也可能引发另一理解；保留原文措辞可避免无依据地消除张力。
- issue: 末句罪过的所属人称
  choice: 按现存引文译为“他们的罪过”并加注
  alternative: 依上下文及平行经文改作“我们的罪过”或“你仆人们的罪过”
  rationale: 用户提供的原文明确呈第三人称复数后缀；虽然上下文显然是众兄弟承认自身罪责，正文仍不擅自校改原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏在他面前，脸贴着地”保留礼仪动作的具体性；对末句不作静默校正，以脚注呈现文本与语境的差异。
