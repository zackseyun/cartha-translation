  text: I will take him as a servant, and you may go in peace to your houses." And while they were searching in their goods, beginning with the eldest and finishing with the youngest, it was found in Benjamin's sack.
translation:
  language: zh_hans
  text: “我要收他作奴仆；你们可以平平安安地回家去。”他们搜查各人的行囊，从最年长的开始，到最年幼的结束；最后在便雅悯的袋里找到了它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እነሥእ፡ ገብረ
  choice: 我要收他作奴仆
  rationale: እነሥእ 是第一人称单数主动形式，宜译为“我要收”；ገብረ 在此指受役使者，结合叙事情境译为“作奴仆”
- source_word: ተአትዉ፡ በሰላም፡ ቤቲክሙ
  choice: 你们却可以平平安安地回家去
  rationale: 保留“平安”与“你们的家”的语义，同时用现代汉语自然表达许可和对比
- source_word: ይፈትኑ፡ ውስተ፡ ንዋዮሙ
  choice: 搜查各人的行囊
  rationale: 动词表示检查、搜查；名词泛指随身物品或财物，在本段装粮与搜袋的场景中译为“行囊”较自然，并不提前限定为单一袋子
- source_word: እምዘ፡ ይልህቅ፡ ቀደሙ፡ ወፈጸሙ፡ በኀበ፡ ዘይንእስ
  choice: 从年长的开始，到年幼的结束
  rationale: 依次保留由长至幼的搜索顺序
- source_word: ተረክበ፡ ውስተ፡ ሐስለ፡ ብንያም
  choice: 最后在便雅悯的袋里找到了
  rationale: 原文使用非特指的“被找到/找到了”，未明说物件名称；中文保留由上下文补足宾语的表达
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“奴仆”保留古代强制役使关系的分量；首句明确采用第一人称主动式，避免误译成被动。“最后”用于自然衔接搜查次序和发现结果，不增加实质信息。
