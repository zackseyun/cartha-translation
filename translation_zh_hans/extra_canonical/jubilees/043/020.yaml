  text: a numerous people. And tell my father that I am still alive, and look, you yourselves see that God has made me as a father to Pharaoh and as ruler in his house,
translation:
  language: zh_hans
  text: 许多百姓。你们要告诉我父亲，我还活着。看哪，你们亲眼看见：上帝立我作法老的父，并作他家中的统治者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ፡ ብዙኃን
  choice: 许多百姓
  rationale: 按原文保留承接上文的片段式短语；“百姓”自然表达群体意义。
- source_word: ዓዲ፡ ሕያው፡ አነ
  choice: 我还活着
  rationale: “还”准确表达持续存活之意，符合现代汉语习惯。
- source_word: እንተ፡ አቡሁ፡ ለፈርዖን
  choice: 作法老的父
  rationale: 直译“父”的比喻性称谓，不擅自改释为顾问、导师或保护者，以保留原文张力。
- source_word: እመብል፡ ውስተ፡ ቤቱ
  choice: 作他家中的统治者
  rationale: 表达在法老家中掌权治理的身份；“他”按最近先行词指法老。
theological_decisions:
- issue: 约瑟权位的神圣授予
  choice: 上帝立我
  alternative: 上帝使我成为
  rationale: “立”简洁体现任命和设立之义，同时不扩展原文对上帝作为的解释。
- issue: “法老的父”的含义
  choice: 保留“父”这一称谓
  alternative: 译作“法老的顾问”或“法老的保护者”
  rationale: 原文采用亲属隐喻，其具体政治或宫廷含义并未明说，故不应在正文中消解其歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看，你们亲眼看见”保留原文“看”与“你们看见”的强调性并列；全节作为跨节句段，开头保留片段形式。
