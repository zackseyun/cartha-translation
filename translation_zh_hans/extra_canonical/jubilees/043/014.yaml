lexical_decisions:
- source_word: ልበ፡ ኵሎሙ፡ ዕሩይ
  choice: 他们众人同心
  rationale: 直译为“他们众人的心联合”，用现代汉语“同心”保留内心一致、彼此联合的含义。
- source_word: ብእሲ፡ ምስለ፡ ካልኡ
  choice: 彼此和睦
  rationale: 原文意为“各人与另一人/彼此”；结合“心联合”的语境，以“彼此和睦”自然表达群体成员之间的相合。
- source_word: ለሠናይ
  choice: 一心向善
  rationale: 原义为“为了善/向着善”；译文保留其正面目的与方向，不具体限定“善”的内容。
- source_word: ወበአከ
  choice: 就哭了
  rationale: 该动词表示哭泣；“就”自然承接约瑟看见此景后的反应。
