  yaml_path: translation/extra_canonical/jubilees/043/002.yaml
  text: And he did as Joseph told him, and filled all their sacks with grain, and put their money in their sacks; and he put the cup in Benjamin's sack. And when morning dawned, they went away.
translation:
  language: zh_hans
  text: 他照约瑟吩咐他的去做，把他们的袋子都装满粮食，又把他们的钱[a]放进他们的袋子里；他还把那只杯放进便雅悯的袋子里。天一亮，他们就离去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们的金子”。
    reason: 源词ወርቅ字面意为“金子”；正文按购粮付款的语境译为“钱”，脚注保留原文措辞。
lexical_decisions:
- source_word: አሕስሊሆሙ
  choice: 他们的袋子
  rationale: 该词指盛装粮食等物的袋子；译作“袋子”自然清楚，也避免无根据地限定具体材质。
- source_word: ሲሊተ
  choice: 粮食
  rationale: 语境中指装入袋中的谷粮；“粮食”符合现代汉语叙事表达。
- source_word: ወርቆሙ
  choice: 他们的钱财
  rationale: 该词字面为“他们的金子”，但在此指先前用来购粮的付款；正文译作“钱财”传达语境功能，脚注保留字面信息。
- source_word: ኮራ
  choice: 杯
  rationale: 源词指杯子；不额外添加材质或用途，以免超出本节文本。
- source_word: ነግሀ፡ በጽባሕ
  choice: 清晨天一亮
  rationale: 保留“到了早晨／破晓”的双重时间意象，同时采用自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而顺畅的叙事语体。按吉兹语句法区分两个动作：先把袋子装满粮食，再把钱财放入袋中；不采纳把“粮食和钱财”一并视为“装满”宾语的歧义读法。
