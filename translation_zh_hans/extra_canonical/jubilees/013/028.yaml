lexical_decisions:
- source_word: ወበጽሐ
  choice: 走近
  rationale: 该动词在此表示来到、趋近；译作“走近”符合叙事语境，也不额外补入目的。
- source_word: ወሰገደ
  choice: 下拜
  rationale: 保留俯身敬礼或下拜的动作含义；不径译为带有特定宗教对象意味的“敬拜”。
- source_word: እግዚእነ
  choice: 我们的主
  rationale: 按词形保留第一人称复数领属和尊称；虽汉语称呼略显非日常，却忠实保存原文表达。
theological_decisions:
- issue: 所多玛王向亚伯兰下拜的性质
  choice: 用“下拜”描述动作
  alternative: 敬拜
  rationale: 原词可用于俯伏、礼拜等行为；本处对象是亚伯兰，语境可理解为向尊贵者行礼，因此不把动作限定为宗教敬拜。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。经文显然承接上一节，故保留句首残句“在他面前”。末尾引语在本节未完，保留逗号，不擅自补足后文。专名采用通行圣经译名“所多玛”“亚伯兰”。
