  text: And Pharaoh sent away Sarai, Abram’s wife, and expelled him from the land of Egypt. And he went to the place where he had pitched his tent at first, to the place of the altar, between Bethel on the west and Ai on the east, and he blessed the LORD his God who had brought him back in peace.
translation:
  language: zh_hans
  text: 法老送走了亚伯兰的妻子撒莱，把亚伯兰逐出埃及地。亚伯兰回到起初支搭帐棚的地方，就是祭坛所在之处；那里西边是伯特利，东边是艾。他称颂耶和华他的上帝，因为上帝使他平安归来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አገብአ
  choice: 送走了
  rationale: 该动词在此表示法老让撒莱离去、将她送回，采用自然且不额外强化语气的表达。
- source_word: አፍለሶ
  choice: 逐出
  rationale: 与前面的“送走”形成区分，保留该动词使亚伯兰离开埃及地的较强语气。
- source_word: ደብተራሁ
  choice: 帐棚
  rationale: 在亚伯兰迁徙的叙事语境中指其所支搭的帐棚。
- source_word: ምሥዋዕ
  choice: 祭坛
  rationale: 准确表达献祭场所，并保留其宗教含义。
- source_word: ባሕር
  choice: 西边
  rationale: 该词本义可指“海”，在方位用法中指西方；此处与“东边”相对。
- source_word: ባረከ
  choice: 称颂
  rationale: 当人为上帝施行动作时，译作“称颂”比“祝福”更符合现代汉语宗教语境。
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 以传统专名表达以色列上帝的神名，符合此处叙事及现代中文圣经文体。
- source_word: ገብ በሰላም
  choice: 使他平安归来
  rationale: 表达“带回／使返回而平安”的整体意义，中文流畅且保留归返与平安两层含义。
theological_decisions:
- issue: 亚伯兰称颂的对象与归来之因
  choice: 他称颂耶和华他的上帝，因为上帝使他平安归来
  alternative: 他祝福使他平安归来的主、他的上帝
  rationale: 明确“称颂”是亚伯兰向上帝发出的行动，同时避免汉语“祝福上帝”可能造成的误解；“他的上帝”仍保留原文关系表达。
- issue: “使他平安归来”的施事者
  choice: 上帝
  alternative: 不重复主语，仅译“那使他平安归来的”
  rationale: 原文关系结构以耶和华为施事者；现代汉语重复“上帝”可清楚指明所指，而不增加新的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“撒莱、亚伯兰、伯特利、艾”等传统译名；依原文次序先交代返回帐棚旧址和祭坛所在，再说明伯特利与艾的方位。
