  text: For all the land that you see I will give to you and to your seed forever. And I will make your seed like the sand of the sea; if a man can count the dust of the earth, then your seed also
translation:
  language: zh_hans
  text: 因为你所看见的整片土地，我都要赐给你和你的后裔，直到永远。我要使你的后裔多如海沙；若有人能数清地上的尘土，那么你的后裔也[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文到“你的后裔也”便结束，句子在下一节接续；因此这里不补出谓语。
    reason: 说明原文跨节的未完句法，避免读者误以为译文残缺，也避免加入与下一节相冲突的意思。
lexical_decisions:
- source_word: ዘርእ / ዘርአከ
  choice: 后裔
  rationale: 此处指亚伯兰的集体性子孙；“后裔”既保留集合含义，也符合庄重的应许语境。
- source_word: ኆፃ፡ ባሕር
  choice: 海沙
  rationale: 直译为“海的沙”，现代汉语自然表达为“海沙”。
- source_word: ኆፃ፡ ምድር
  choice: 地上的尘土
  rationale: 该短语字面仍含“沙/尘”之义；依创世记平行传统及上下文的可数性意象，译作“地上的尘土”。
- source_word: እስከ፡ ለዓለም
  choice: 直到永远
  rationale: 保留时间延续与永久性的表达，不将其弱化为一般的“长久”。
theological_decisions:
- issue: 本节末尾未完句与下一节的语法衔接
  choice: 保留“那么你的后裔也”这一悬置结构，不补出谓语
  alternative: 补作“那么你的后裔也能数清”
  rationale: 本节吉兹文本止于“你的后裔也”，相关否定谓语位于下一节；在本节擅补肯定谓语会扭转原文跨节句法，并与下节冲突。
- issue: “后裔”的单数形式与集合意义
  choice: 译作集合名词“后裔”
  alternative: 译作“子孙”或“种子”
  rationale: 既反映源词可指“种子/后代”的语义，又不预先限定为单一个体或多个个体。
translation_notes:
  register: 采用现代、庄重而易懂的应许语体。“整片土地”自然传达“所有你所看见的地”；末句刻意保留原文在分节处的悬置，并以脚注说明。
