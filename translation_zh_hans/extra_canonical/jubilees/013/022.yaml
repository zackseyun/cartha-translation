  text: for I will give it to your seed.” And Abram went to Hebron and settled there. And in this year Chedorlaomer king of Elam came, and Amraphel king of Shinar, and Arioch king of Ellasar,
translation:
  language: zh_hans
  text: “因为我要把这地赐给你的后裔。”亚伯兰就往希伯仑去，住在那里。这一年，以拦王基大老玛、示拿王暗拉非和以拉撒王亚略来了，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዘርእከ
  choice: 你的后裔
  rationale: “种子/后裔”在此指亚伯兰的子孙；“后裔”既自然，也保留集合性含义。
- source_word: እሁብ
  choice: 我要把这地赐给
  rationale: 动词表达第一人称将来给予；宾语承接上文所指之地，补出“这地”使现代汉语语意完整。
- source_word: ወኀደረ፡ ህየ
  choice: 住在那里
  rationale: 按语境表达停驻、定居，不额外强化为永久定居。
- source_word: መጽአ
  choice: 来了
  rationale: 直译“来”；句子在本节末仍未完结，因此保留开放结构。
- source_word: ኬብሮን
  choice: 希伯仑
  rationale: 采用现代中文圣经传统通行地名。
- source_word: ኮዶላጎሞር
  choice: 基大老玛
  rationale: 采用现代中文圣经传统通行人名。
- source_word: ሴናአር
  choice: 示拿
  rationale: 采用现代中文圣经传统通行地名。
- source_word: ሴላሰር
  choice: 以拉撒
  rationale: 采用现代中文圣经传统通行地名。
theological_decisions:
- issue: “后裔”的单复数和集合性
  choice: 后裔
  alternative: 子孙／种子
  rationale: 源词可作集合名词；“后裔”不强行限定单数或复数，也不预先化解其可能承载的神学张力。
- issue: 赐地应许的宾语
  choice: 补出“这地”
  alternative: 只译“我要赐给你的后裔”
  rationale: 汉语需要明确宾语，而上下文清楚指向土地；此补足不增添新的神学内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并沿用读者熟悉的圣经专名译法。保留原文在本节末以逗号延续王名名单的未完句式，不擅自补足后续事件。
