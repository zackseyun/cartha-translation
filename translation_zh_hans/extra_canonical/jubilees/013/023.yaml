  yaml_path: translation/extra_canonical/jubilees/013/023.yaml
  text: And Targal[a], king of nations; and they killed the king of Gomorrah, and the king of Sodom fled, and many fell into the bitumen of the valley of the Sodomites[b] by the Salt Sea. And they took captive Sodom and Admah and Zeboiim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went as far as Dan.
translation:
  language: zh_hans
  text: 还有万国之王塔尔迦勒[a]；他们杀了蛾摩拉王，所多玛王逃走，许多人掉进盐海旁所多玛人谷中的沥青里[b]。他们掳掠了所多玛、押玛和洗扁，也掳走了亚伯兰的侄子罗得和他的一切财物，然后一直到了但。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语作“塔尔迦勒”（Targāl），对应《创世记》14:1的“提达”。
    reason: lexical_choice
  - marker: b
    text: 吉兹语直译为“在所多玛人谷中的油（或沥青）里”。这对应《创世记》14:10所说西订谷的沥青坑。查尔斯曾把这里校改为“因受伤”，但吉兹语原文按《创世记》的叙事背景可以理解，无须校改。
    reason: textual_critical
lexical_decisions:
- source_word: ተርጋል
  choice: 塔尔迦勒
  rationale: 按吉兹语 Targāl 音译，以保留本书文本的姓名形式；其对应《创世记》14:1的“提达”，另以脚注说明。
- source_word: ወጐየ
  choice: 逃走
  rationale: 该动词意为“逃跑、逃走”，主语是所多玛王；既符合所给校勘文本，也符合上下文。
- source_word: በቀብአ
  choice: 在沥青里
  rationale: qab’a 通常指油或膏，但此处承接《创世记》14章的沥青场景，语境义为“沥青”。不采用缺乏必要性的“因受伤”校改，也不在正文擅自补出原文没有明说的“坑”。
- source_word: ሰዶማውያን
  choice: 所多玛人的
  rationale: 严格保留吉兹文本的“所多玛人”，不以《创世记》平行经文中的“西订”替换。
- source_word: ፄወዉ / ፄወውዎ
  choice: 掳掠了／掳走了
  rationale: 动词表示掳获、俘掳。对城市用自然汉语“掳掠”，对罗得用“掳走”，既保留重复结构，也避免生硬地说“俘虏一座城”。
- source_word: ጥሪቶ
  choice: 财物
  rationale: 这里指罗得所拥有的财产、资财；“一切财物”简洁而符合叙事语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。开头保留原文承接上一节列举诸王的片段式结构；地名采用常见中文圣经译名“蛾摩拉、所多玛、押玛、洗扁、但”，人名“塔尔迦勒”则按本节吉兹语形式音译。
