  to: 还有万国之王塔尔迦勒[a]；他们杀了蛾摩拉王，所多玛王逃走，许多人掉进盐海旁所多玛人谷中的沥青里[b]。他们掳掠了所多玛、押玛和洗扁，也掳走了亚伯兰的侄子罗得和他的一切财物，然后一直到了但。
  rationale: 仅作两项安全的汉语表达修订：以分号连接原文承接上文的列王残句与后续行动，并将明确的“亚伯兰兄弟的儿子”自然化为“亚伯兰的侄子”。保留“所多玛人谷”“沥青”“逃走”和“到了但”，不以《创世记》的“西订谷”或“沥青坑”覆写吉兹语正文。
