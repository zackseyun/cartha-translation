  text: And in the forty-first jubilee, in the third year of the first week, he returned to this place and offered a sacrifice upon it, and he called on the name of the LORD.
translation:
  language: zh_hans
  text: 在第四十一个禧年的第一个七年的第三年，他回到这地方，在其上献了祭，并求告耶和华的名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብአ፡ ውስተዝ፡ መካን
  choice: 回到这地方
  rationale: ገብአ 在本段亚伯兰从埃及返回的语境中表示“回到”，ዝ 指近指的“这”，故不译作“进入那地方”。
- source_word: ወአዕረገ፡ በዲቤሁ፡ ጽንሓሐ
  choice: 在其上献了祭
  rationale: 该短语表达在其上献上祭物；保留代词“其”与前面的“这地方”相应，不增添原文没有的“筑坛”。
- source_word: ወጸውዐ፡ በስመ፡ እግዚአብሔር
  choice: 并求告耶和华的名
  rationale: 这是圣经汉语中自然且准确的固定表达；እግዚአብሔር 在此对应神圣名号，译作“耶和华”。
- source_word: በዘአርብዓ፡ ወአሐዱ፡ ኢዮቤልዎን፡ በሣልስ፡ ዓም፡ ዘሱባዔ፡ ቀዳማ
  choice: 在第四十一个禧年的第一个七年的第三年
  rationale: 按《禧年书》的纪年结构直译，清楚保留“禧年—七年周期—年”的层级。
theological_decisions:
- issue: 是否提及筑坛
  choice: 只译“献了祭”
  alternative: “在那里筑了一座坛”
  rationale: 现有吉兹语文本明确提到献祭，并未出现“坛”或“建造”；避免受《创世记》13:4的平行叙述影响而补入内容。
- issue: 神名的译法
  choice: 耶和华
  alternative: 主
  rationale: “求告耶和华的名”保留此处神圣名号的传统对应，也契合原文表达及汉语圣经语域。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话；纪年表达尽量清晰，叙事部分简洁，不以平行经文补足原文。
