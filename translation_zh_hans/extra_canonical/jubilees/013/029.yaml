  yaml_path: translation/extra_canonical/jubilees/013/029.yaml
  text: 'Give us the persons whom you rescued, but let the goods be yours.” And Abram said to him, “I have lifted up my hands to God Most High: from a thread even to a sandal strap, I will not take anything that is yours, lest you should say, ‘I have made Abram rich’—except only what the young men have eaten, and the share of the men who went with me, Aner and Eshcol and Mamre; let them take their share.”'
translation:
  language: zh_hans
  text: “把你救出来的人交给我们[a]，财物你自己留下吧。”亚伯兰对他说：“我已经向至高的上帝举手起誓：凡是你的东西，我一概不拿，连一根线、一条凉鞋带也不拿，免得你说：‘是我使亚伯兰富足的。’只有年轻人所吃的，以及与我同去的亚乃、以实各和幔利这些人应得的份，可以除外；让他们拿自己应得的份吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“给我们”；《创世记》14:21的平行叙述作“给我”。
    reason: 说明本节吉兹文本的复数形式，并保留其与平行传统之间的真实差异。
lexical_decisions:
- source_word: ጸግወነ
  choice: 交给我们
  rationale: 动词形式带第一人称复数宾语，直译为“给我们”，不按《创世记》平行经文改成单数“给我”。
- source_word: ነፍሰ፡ እለ፡ ባሳሕከ
  choice: 你救出来的人
  rationale: ነፍሰ 在此指人命或人员，结合关系从句译为自然的现代汉语“你救出来的人”。
- source_word: አነሣእ፡ እደየ
  choice: 举手起誓
  rationale: 字面为“举起我的手”；在誓言语境中表达起誓动作，译出隐含的语用意义。
- source_word: አምላክ፡ ልዑል
  choice: 至高的上帝
  rationale: 保留神称号“至高的神”，采用现代中文自然表达。
- source_word: እምፈትል፡ እስከ፡ ተታነ፡ እሣእነ
  choice: 从一根线到一根鞋带
  rationale: 保留表示从微小之物到另一微小之物的两端式说法及具体意象。
- source_word: መክፈልቶሙ
  choice: 自己应得的份
  rationale: 意为分配所得的份额；加入“应得的”使中文语义清楚，不改变其权利归属。
theological_decisions:
- issue: “举手”是否明确译为向上帝起誓
  choice: 举手起誓
  alternative: 举起我的手
  rationale: 上下文是正式宣誓；译出“起誓”能准确传达动作的惯用意义，同时保留“举手”意象。
- issue: 神名的表达
  choice: 至高的上帝
  alternative: 至高神
  rationale: 原文为普通神称号而非专名；“至高的上帝”庄重、清楚，也不加入宗派性解释。
- issue: 第一人称复数宾语与《创世记》平行文本的差异
  choice: 交给我们
  alternative: 交给我
  rationale: 忠实保留吉兹文 ጸግወነ 的复数宾语，不以平行经文的单数形式进行协调。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留誓言的正式语气、具体意象及原文“我们”的文本差异；人名按常见中文圣经译名处理。
