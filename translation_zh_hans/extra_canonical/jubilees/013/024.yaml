  yaml_path: translation/extra_canonical/jubilees/013/024.yaml
  text: And one who had escaped came and told Abram that his brother’s son had been taken captive[24]. And he armed the servants born in his house . . . Upon Abram and upon his seed is the first tithe for the LORD, and the LORD made it an ordinance forever, that they should give it to the priests who minister before him[24],
translation:
  language: zh_hans
  text: 有一个逃脱的人来告诉亚伯兰，他兄弟的儿子被掳走了。亚伯兰就武装了家中所生的人……[a] 亚伯兰和他的后裔有献给主的头一份十分之一[b]；主又把这定为永远的律例，要他们把它交给在他面前供职的祭司，为要……[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本版原文在“武装了家中所生的人”之后有缺文，随即转到设立十分之一的规定；这里原来可能有更完整的叙事。
    reason: segmentation_note
  - marker: b
    text: 原文此句没有明写动词，直译近于“亚伯兰和他的后裔有献给主的头一份十分之一”。“头一份十分之一”也可理解为“首要的十分之一”，或指与初产、初熟之物有关的第一份十分之一；原文措辞不寻常。
    reason: textual_and_lexical_ambiguity
  - marker: c
    text: 所提供的吉兹文到表示“为要／使得”的连接词便中断，因此句意未完。
    reason: source_truncation
lexical_decisions:
- source_word: ዚድኅነ
  choice: 一个逃出来的人
  rationale: 按其完成式分词意义译出“逃脱、幸免的人”，与亚伯兰受报的叙事语境相合。
- source_word: ወልደ፡ እኁሁ
  choice: 他兄弟的儿子
  rationale: 保留原文亲属关系的直述，不擅自改成较概括的“侄子”。
- source_word: አስተረሰየ፡ ልደ፡ ቤቱ
  choice: 武装了家中所生的人
  rationale: “家中所生的人”紧贴原文，避免在原词未明说奴仆时直接增添“奴仆”；使役动词依叙事语境译作“武装”。
- source_word: ዐሥራተ፡ ቀዳሚ
  choice: 头一份十分之一
  rationale: 逐项保留“十分之一”和“首先、首要”的成分；措辞虽略显特殊，却反映原文不寻常的搭配，并在脚注列出其他可能理解。
- source_word: ይትቀነዩ፡ ቅድሜሁ
  choice: 在他面前供职
  rationale: 以礼仪语境中自然而庄重的表达传达“在他面前服事”，所指为祭司职事。
theological_decisions:
- issue: 无动词的十分之一条款
  choice: 亚伯兰和他的后裔负有……的责任
  alternative: 亚伯兰和他的后裔有……／向亚伯兰和他的后裔征收……
  rationale: 原句是无系词名词句，关系含混。正文用“负有……责任”表达其规范性而不引入原文没有明确给出的施行者；脚注说明更直译和其他理解。
- issue: 永远律例的受领者与祭司职分
  choice: 要他们把它交给在他面前供职的祭司
  alternative: 使人把它交给侍立在他面前的祭司
  rationale: 原文复数代词自然承接亚伯兰及其后裔；“供职”不额外界定祭司职务的宗派性内涵。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主”对应神名称号；“律例”“祭司”“供职”等保持经书语域。以省略号和脚注明示缺文及句尾残缺，不把推测的叙事或律法内容补入正文。
