  text: and from cattle and from sheep. And he gave it to his priests to eat and to drink with rejoicing.
translation:
  language: zh_hans
  text: 以及牛群和羊群中的十分之一。他把这些交给他的祭司，让他们欢欢喜喜地吃喝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምአልህምት፡ ወእምአባግዕ
  choice: 牛群和羊群中的十分之一
  rationale: 字面为“从牛群和从羊群”。本节承接上文所述的十分之一，因此在中文中补出“十分之一”，使省略的宾语清楚，同时保留牲畜类别。
- source_word: ለካህናቲሁ
  choice: 他的祭司
  rationale: 对应带第三人称单数所属后缀的“祭司”，直译为“他的祭司”。
- source_word: ለበሊዕ፡ ወለሰትይ
  choice: 吃喝
  rationale: 分别对应“吃”和“喝”；汉语并列作“吃喝”自然简洁。
- source_word: በፍሥሓ
  choice: 欢欢喜喜地
  rationale: 表达“在喜乐中、带着欢喜”的方式或情境；采用自然现代汉语，保留喜庆意味。
theological_decisions:
- issue: 本节开头省略了所取之物
  choice: 依据紧接的上文补出“十分之一”
  alternative: 直译为“以及从牛群和羊群中”
  rationale: 格尔兹文在此仅说“从牛群和从羊群”，语法上承接上文的什一奉献。补出省略成分可避免中文成为残句，但不额外界定其礼仪性质。
- issue: “他的祭司”的所指
  choice: 保留代词，不明确解释祭司属于谁
  alternative: 改为“至高者的祭司”或“麦基洗德的祭司”
  rationale: 原文只保留第三人称所属关系；不应在译文中替原文消解指代上的潜在张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“欢欢喜喜地吃喝”适合普通读者，也准确传达原文在喜乐中饮食的含义。
