  text: will be innumerable. Rise, walk through the land in its length and its breadth, and see it all.
translation:
  language: zh_hans
  text: 将多得无法数算。起来，走遍这地，从这头到那头，从这边到那边，并察看全地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይትኍለቍ
  choice: 将多得无法数算
  rationale: 该词表达“不可被数算”。本节开头承接上一节，中文补出“将多得”，使残句在保持上下文衔接的同时自然可读。
- source_word: ተንሥእ
  choice: 起来
  rationale: 保留命令语气，简洁对应“起身、起来”。
- source_word: አንሶሱ
  choice: 走遍
  rationale: 表达在土地中行走、巡行之意；结合后面的长宽范围，用“走遍”比单纯“行走”更自然。
- source_word: ውስተ፡ ኑኃ፡ ወርኅባ
  choice: 从这头到那头，从这边到那边
  rationale: 原文直指土地的长度与宽度。采用现代汉语的空间表达，既保留纵横全境之意，也避免生硬的“在其长度和宽度中”。
- source_word: ወርኢ፡ ኵሎ
  choice: 并察看全地
  rationale: “察看”体现有意观看；“全地”明确“全部”所指的是前述土地，符合汉语指代习惯。
theological_decisions: []
translation_notes:
