  text: In that year, when Lot had been taken captive, the LORD said to Abram, after Lot had separated from him, in the fourth year of this week, “Lift up your eyes from the place where you are dwelling, northward and southward and westward and eastward,
translation:
  language: zh_hans
  text: 那一年，罗得被掳之时，上主对亚伯兰说——这是罗得与他分开以后，在这个七年期的第四年——“你要从你所在之地举目，向北、向南、向西[a]、向东[b]观看，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西”原文直译为“海的方向”。
    reason: 保留吉兹语以“海”表示西方的具体意象。
  - marker: b
    text: “东”原文直译与“日出”有关。
    reason: 说明源文以日出方向表达东方。
lexical_decisions:
- source_word: ተፄወወ፡ ሎጥ
  choice: 罗得被掳以后
  rationale: 动词表示被俘、被掳；用“被掳”既符合叙事背景，也保留受事语态。
- source_word: እግዚአብሔር
  choice: 上主
  rationale: 该词在此指向亚伯兰说话的神；“上主”庄重自然，又避免把源文未明示的专名形式直接补入。
- source_word: በ፬ብዑ፡ ዓመት፡ ዘዝሱባዔ
  choice: 在这个七年期的第四年
  rationale: “七期”在《禧年书》的年代框架中指一个七年周期；译作“七年期”比直译“周”更便于现代读者理解。
- source_word: ባሕር
  choice: 西
  rationale: 字面为“海”，在方位列举中惯指西方；正文采用自然的方位词，并以脚注保留源文意象。
- source_word: ጽባሕ
  choice: 东
  rationale: 字面与日出、清晨有关，在此作为东方的方位表达；正文译“东”，脚注说明字面。
theological_decisions:
- issue: 神称的表达
  choice: 上主
  alternative: 耶和华／神
  rationale: 吉兹语此处使用常见神称，并未以源文形式明确拼写希伯来神名；“上主”既保持神圣称谓，也不额外判定专名层面的文本问题。
- issue: 罗得被掳与神谕时间之间的句法张力
  choice: 保留“那一年，罗得被掳以后”与“罗得与他分开以后，在……第四年”两重时间说明
  alternative: 重排或合并为单一、无张力的时间线
  rationale: 源文并列了这些时间信息；不为消除表面年代张力而删改或重新解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。破折号标出插入的年代说明，以保存源文语序中的时间层次而不使主句难读。末尾不闭合引号，因为上主的话在下一节继续。
