  yaml_path: translation/extra_canonical/jubilees/013/017.yaml
  text: And he said, “You are God Most High, my God forever and ever.” And in the seventh year of this week, Lot separated from him, and Lot settled in Sodom; and the men of Sodom were very sinful.
translation:
  language: zh_hans
  text: 他说：“你是至高的上帝，是我的上帝，直到永永远远。”在这个七年周期的第七年，罗得与他分开，住在所多玛；所多玛人罪恶深重。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: 至高的上帝
  rationale: 直译“至高的神／上帝”，用现代汉语中自然而庄重的称谓。
- source_word: ለዓለመ፡ ዓለም
  choice: 直到永永远远
  rationale: 保留表示永久、无尽延续的强化表达。
- source_word: ዘዝሱባዔ
  choice: 这个七年周期
  rationale: 该词指以七年为一组的时间单位；译出“七年周期”，避免中文“周”被误解为七日。
- source_word: ተፈልጠ፡ ሎጥ፡ እምኔሁ
  choice: 罗得与他分开
  rationale: 忠实表达罗得从前述人物那里分离；原文以代词指称，正文不擅自补明姓名。
- source_word: ኀደረ፡ ሎጥ፡ ውስተ፡ ሰዶም
  choice: 罗得……住在所多玛
  rationale: 动词表示居住、安顿；“住在”简洁自然。
- source_word: ኃጥኣን፡ ጥቀ
  choice: 罪恶深重
  rationale: 传达“非常有罪／极其邪恶”的程度，在现代汉语中庄重流畅。
theological_decisions:
- issue: “至高的上帝”与“我的上帝”的关系
  choice: 是我的上帝
  alternative: 我的上帝
  rationale: 保留原文两个称谓之间的同位／断言关系，不增添关于神名或身份的解释。
- issue: 所多玛人的道德描述
  choice: 罪恶深重
  alternative: 罪人甚多／非常有罪
  rationale: 原文强调其有罪程度；此译法不具体化罪行，也不引入后世神学解释。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的简体中文。“七年周期”明确古代计年单位；保留“他”的原文代词，不在单节内擅自补出所指人物。
