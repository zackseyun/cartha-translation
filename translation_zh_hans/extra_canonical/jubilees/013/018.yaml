  text: And it was grievous in his heart that his brother’s son had been separated from him, for he had no children.
translation:
  language: zh_hans
  text: 他兄弟的儿子已经与他分开了，这使他心里忧伤，因为他没有儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአእከዮ፡ በልቡ፡
  choice: 使他心里忧伤
  rationale: 表达此事在他心中成为痛苦、令他难过的含义；中文自然而庄重。
- source_word: ወልደ፡ እኁሁ፡
  choice: 他侄儿
  rationale: 原文直译为“他兄弟的儿子”；现代汉语以“侄儿”简洁表达，同时不额外指定是兄长还是弟弟之子。
- source_word: ተፈልጠ፡ … እምኔሁ፡
  choice: 与他分离
  rationale: 保留原文所述分开状态及被动意味，不擅自说明是谁主动离开或谁促成分离。
- source_word: አልቦ፡ ውሉደ፡
  choice: 没有儿女
  rationale: ውሉደ为复数“孩子、儿女”，用“儿女”不限定性别，也符合上下文。
