revisions:
- from: 这律法没有日期的期限，因为他为世世代代永远定下了这律例：他们要把一切的十分之一献给主，包括田产[a]、酒和油。
  to: 这项律法没有时限，因为他把它定为世世代代永远的条例：他们要把一切的十分之一献给主，即从种子[a]、酒和油中取十分之一。
  rationale: 修订以“时限”自然准确地表达原文“日子的界限”，并将“田产”改为“种子”，保留原文字面及其语义弹性；脚注继续说明该词在并列酒和油的农产清单中很可能指收成。末句重组为“从……中取十分之一”，使“一切的十分之一”与所列项目的关系在汉语中清楚自然。
