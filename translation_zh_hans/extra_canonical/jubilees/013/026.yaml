  yaml_path: translation/extra_canonical/jubilees/013/026.yaml
  text: 'And for this law there is no limit of days, for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed[26] and from wine and from oil.'
translation:
  language: zh_hans
  text: 这项律法没有时限，因为他把它定为世世代代永远的条例：他们要把一切的十分之一献给主，即从种子[a]、酒和油中取十分之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “种子”很可能泛指农业出产或收成，而不只是留作播种的种子。
    reason: cultural_note
lexical_decisions:
- source_word: ሕግ
  choice: 律法
  rationale: 对应“law”，在本段礼仪与奉献规范的语境中庄重而自然。
- source_word: ወሰነ፡ መዋዕል
  choice: 日期的期限
  rationale: 按字面保留“日子的界限/期限”这一表达，意指此律例不受时限约束。
- source_word: ለትውልድ፡ ዘለዓለም
  choice: 世世代代永远
  rationale: 同时保留“世代”和“永远”两层强调，不将其简化为单一时间概念。
- source_word: ዓሥራተ
  choice: 十分之一
  rationale: 准确表达什一奉献；用普通读者易懂的说法，避免仅用术语“什一”。
- source_word: ዘርእ
  choice: 田产
  rationale: 此处与酒、油并列，语境所指很可能是土地所出的农产或收成，而非仅指留作播种的种子。
- source_word: ወይን
  choice: 酒
  rationale: 该词在农产奉献清单中指葡萄酒；简洁自然。
- source_word: ቅብእ
  choice: 油
  rationale: 在此农产语境中通常指橄榄油；正文保留较宽泛的“油”。
theological_decisions:
- issue: 律例的持续效力
  choice: 没有日期的期限……世世代代永远
  alternative: 永不废止
  rationale: 保留原文时间表达及其张力，不进一步推断其在后世不同盟约或群体中的规范地位。
- issue: 十分之一的接受者
  choice: 献给主
  alternative: 给耶和华
  rationale: 原文使用神圣称谓；“主”庄重自然，也不额外引入特定中文神名译法的宗派偏好。
- issue: 制定者“他”的指向
  choice: 他
  alternative: 上帝
  rationale: 原文为第三人称单数；保留代词，避免在本节内部明确定义其所指而消除篇章语境中的照应。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。句式保留原文的因果关系与冒号后的条例内容；以“包括”自然引出三类奉献物。脚注标记紧随其所解释的“田产”。
