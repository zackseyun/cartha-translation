  yaml_path: translation/extra_canonical/jubilees/038/007.yaml
  text: And Reuben and Issachar and Zebulun went out toward the north side of the tower, and fifty were with them; and they killed the fighting men of the Philistines.
translation:
  language: zh_hans
  text: 流便、以萨迦和西布伦往塔的北边去了，有五十人随同他们；他们杀了非利士人的战士。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወፅኡ
  choice: 出击
  rationale: 该动词基本义为“出去”；在随后的杀敌语境中译作“出击”，既自然又保留军事行动色彩。
- source_word: እንተ፡ ገጸ፡ ሰሜን፡ ለማኅፈድ
  choice: 向塔的北面
  rationale: 按短语构造表达朝向塔北侧的行动；“北面”比“北边一侧”更简洁自然。
- source_word: ወ፶ ምስሌሆሙ
  choice: 带着五十人
  rationale: 原文直译为“有五十人与他们同在”；合入主句可避免现代汉语中生硬的并列，同时不改变人数及同行关系。
- source_word: መስተባእሳኒሆሙ
  choice: 战士
  rationale: 指参与战斗的男子或战斗人员；“战士”简明庄重，且不额外限定军阶或职业身份。
- source_word: ፍልስጥኤም
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行的族名译法。
