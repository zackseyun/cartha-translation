  rationale: 准确表达“统治、登基为王”，并使中文叙事自然。
- source_word: ህየንቴሁ
  choice: 接替他
  rationale: 核心意义是“在他的位置上、代替他”；译为“接替他”既保留继位关系，也符合现代汉语。
- source_word: ዮባብ፡ ወልደ፡ ዛራ፡ ዘእም፡ ቦሴር
  choice: 波色人谢拉的儿子约巴
  rationale: 保留“约巴—谢拉之子—来自波色”的人物关系和来源信息，以自然中文重组。
