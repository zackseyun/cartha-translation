  text: 他的城是达拿巴。巴拉克死了，来自波色的谢拉的儿子约巴接替他作王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接替他作王”或译“在他之后作王”。
    reason: 吉兹语ህየንቴሁ主要表示“在他的位置上、代替他”；“在他之后”可保留为强调时间先后的次选理解。
lexical_decisions:
- source_word: ሀገሩ፡ ደናባ
  choice: 他的城是达拿巴
  rationale: 按字面保留所属关系“他的城”和城名；此句在所提供的吉兹语经文中明确出现，不因可能的分节差异而省略。
- source_word: ባላቅ
