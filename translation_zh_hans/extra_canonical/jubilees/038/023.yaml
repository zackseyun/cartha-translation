  text: 扫罗死了，亚革波的儿子巴勒乌南接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተ
  choice: 死了
  rationale: 准确表达完成的死亡事件，符合现代汉语叙事习惯。
- source_word: ህየንቴሁ
  choice: 接替他
  rationale: 原词意为“代替他、在他的位置上”；结合作王语境译为“接替他”，既准确又自然。
- source_word: ነግሠ
  choice: 作王
  rationale: 直接表达登位统治，符合圣经历史叙事的庄重语体。
- source_word: ባኤሉናን
  choice: 巴勒乌南
  rationale: 按格尔兹语专名 Baʾelunan 音译，并与英语咨询层 Baelunan 相协调。
- source_word: አክቡር
  choice: 亚革波
  rationale: 按专名 ʾAkbur 音译；该名对应以东王表传统中的 Achbor，采用较常见的中文圣经式译名“亚革波”。
