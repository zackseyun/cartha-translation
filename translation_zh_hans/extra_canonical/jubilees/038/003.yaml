  text: And again he shot an arrow, and it struck Adoran the Aramean in the left breast, and he drove him back and killed him.
translation:
  language: zh_hans
  text: 他又射出一支箭，箭射中了亚兰人亚多兰的左胸；他把亚多兰击退，并杀了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈነወ፡ ሐጸ
  choice: 射出一支箭
  rationale: ፈነወ 有“发出、射出”之意，与“箭”连用时，现代汉语自然译作“射出一支箭”。
- source_word: አዶራንሃ
  choice: 亚多兰
  rationale: 按人名音译；末尾形式可能带宾格或受事标记，不另行译出。
- source_word: አረማዊ
  choice: 亚兰人
  rationale: 表示族属或地域身份，即“Aramean”，采用现代汉语圣经语境中通行的“亚兰人”。
- source_word: ጥቦ፡ ፀጋማዊ
  choice: 左胸
  rationale: 词组指左侧胸部；译作“左胸”简洁自然，并保留受箭部位。
- source_word: ወሰደዶ
  choice: 把……击退
  rationale: 保留该动词所表达的驱赶、迫退含义，不与随后“杀了”合并。
- source_word: ወቀተሎ
  choice: 并杀了他
  rationale: 直陈后续致死动作，保留叙事中的动作次序。
