lexical_decisions:
- source_word: ህየንቴሁ
  choice: 接替他
  rationale: 该词意为“代替他、在他的位置上”；结合作王的语境，译为“接替他作王”自然且准确。
- source_word: ደብረ፡ ቴማን
  choice: 提幔山区
  rationale: ደብረ可指山地或山区；此处与地名提幔连用，译作“提幔山区”比单一的“提幔山”更自然，并保留地域含义。
- source_word: አሳም
  choice: 亚萨姆
  rationale: 按格尔兹语人名形式音译，以区别于其他可能相关但源文未明示的人名形式。
