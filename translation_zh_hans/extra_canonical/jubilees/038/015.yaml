  text: And the sons of Edom have not cast off the yoke of servitude that the twelve sons of Jacob had laid upon them, to this day.
translation:
  language: zh_hans
  text: 以东的子孙直到今日仍未摆脱雅各的十二个儿子[a]加在他们身上的奴役之轭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹文转录在此处误作“十四和十五”；Charles 1895的正文所指为“十二”。
    reason: 说明输入文本中的转录/OCR讹误及正文采用“十二”的依据。
lexical_decisions:
- source_word: ውሉደ፡ ኤዶም
  choice: 以东的子孙
  rationale: 按字面保留“以东之子孙”的群体称谓，语言自然，也与上下文的民族含义相符。
- source_word: ኢነገኁ
  choice: 仍未摆脱
  rationale: 表达否定完成动作，并与句末“直到今日”自然衔接；不加入原文没有明确表达的“再次”。
- source_word: እምአርዑተ፡ ቅኔ
  choice: 奴役之轭
  rationale: 保留“轭”的具体比喻，并以“奴役”传达ቅኔ在此处所指的服役、受辖制状态。
- source_word: ዘሠርዑ
  choice: 加在……身上的
  rationale: 在“轭”的比喻中，用现代汉语自然表达“安放、施加”的动作。
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: 直到今日
  rationale: 准确保留时间延续语气，符合庄重而通顺的现代汉语。
theological_decisions:
- issue: 雅各儿子人数的文本问题
  choice: 正文作“十二个儿子”
  alternative: 按所提供的转录字符直译为“十四和十五个儿子”
  rationale: 所提供的吉兹文转录在数词处显然发生字符/OCR讹误；Charles 1895相应正文及叙事语境所指均为雅各的十二个儿子。正文采用可恢复的原读法，同时以脚注透明说明转录问题，不让机械讹文压倒文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“奴役之轭”保留原文意象；语序调整为自然汉语，但未弱化以东持续受辖制的陈述。
