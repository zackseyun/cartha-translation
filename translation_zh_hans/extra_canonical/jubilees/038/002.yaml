  text: At that time Jacob bent his bow and sent out an arrow, and struck Esau his brother in the right breast, and killed him.
translation:
  language: zh_hans
  text: 那时，雅各拉开弓，射出一支箭，射中了他哥哥以扫的右胸，把他杀死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰቀ፡ ያዕቆብ፡ ቀስተ፡
  choice: 雅各拉开弓
  rationale: 按字面结构表达雅各张弓的动作；现代汉语用“拉开弓”自然清楚。
- source_word: ወፈነወ፡ ሐጸ፡
  choice: 射出一支箭
  rationale: 保留“放出/发出箭”的具体动作，并补入汉语量词“一支”使句子自然。
- source_word: ወነደፎ፡ ለዔሳው፡ እኁሁ፡
  choice: 射中了他哥哥以扫
  rationale: 动词在此语境指箭击中或刺中；“射中”既符合远距离放箭的动作，也避免不必要地强化创伤细节。亲属词译为“哥哥”，符合以扫为雅各兄长的叙事关系。
- source_word: ጥቦ፡ የማናዊ፡
  choice: 右胸
  rationale: 对应“右边的胸部/乳房”；在男性受箭语境中，“右胸”是自然且准确的现代汉语表达。
- source_word: ወገደሎ።
  choice: 把他杀死了
  rationale: 明确保留结果性动词“杀死”，并用现代汉语连动结构衔接前句。
