  text: His city was Aw'it. And Adath died, and Salman from Amaseqa reigned in his place.
translation:
  language: zh_hans
  text: 他的城是奥伊特。阿达特死后，来自阿马塞卡的萨勒曼接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀገሩ
  choice: 他的城
  rationale: 该词由“城、地方”与第三人称阳性单数属格后缀构成；依上下文直译为“他的城”。
- source_word: አውኢት
  choice: 奥伊特
  rationale: 专名按吉兹语形式音译，不擅自等同于其他地名。
- source_word: ወሞተ
  choice: 死后
  rationale: 字面为“并且死了”；汉语合并成时间从句，更自然，也不改变事件次序。
- source_word: አዳት
  choice: 阿达特
  rationale: 按吉兹语专名音译。
- source_word: ወነግሠ
  choice: 作王
  rationale: 对应“统治、作王”，保留王权含义。
- source_word: ህየንቴሁ
  choice: 接替他
  rationale: 意为“在他的位置上、代替他”；“接替他作王”符合现代汉语，同时比单纯“在他之后”更准确。
- source_word: ሰልማን
  choice: 萨勒曼
  rationale: 按吉兹语专名音译。
- source_word: ዘእም፡ አማሴቃ
  choice: 来自阿马塞卡的
  rationale: ዘእም 表示“从……来的”，修饰萨勒曼；地名按源文音译。
