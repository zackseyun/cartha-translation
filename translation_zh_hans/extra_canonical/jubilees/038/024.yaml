  yaml_path: translation/extra_canonical/jubilees/038/024.yaml
  text: And Baelunan son of Achbor died, and Adath reigned in his place; and the name of his wife was Mayṭabigo, daughter of Maṭarego, daughter of Metebedzaab.
translation:
  language: zh_hans
  text: 亚克布尔的儿子巴埃鲁南死了，阿达特接替他[a]作王。他的妻子名叫迈塔比戈[b]，是马塔雷戈的女儿、梅特贝扎阿卜的孙女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他之后”。
    reason: 保留较宽泛的时序译法；正文则依原词更具体地译为“接替他”。
  - marker: b
    text: 或作“梅塔比戈”。
    reason: 记录不体现原文 ይ 音素的另一种名称写法。
lexical_decisions:
- source_word: ህየንቴሁ
  choice: 接替他
  rationale: 该词表示“在他的位置上、代替他”，这里译为自然的王位继承表述，同时保留明确的替代含义。
- source_word: መይጠቢጎ
  choice: 迈塔比戈
  rationale: 按吉兹文中的 ይ 音素音译为“迈”，不省略 y 音。
- source_word: ወለተ፡ ማጠረጎ፡ ወለተ፡ ሜተቤድዛአብ
  choice: 是马塔雷戈的女儿、梅特贝扎阿卜的孙女
  rationale: 原文连续使用“女儿”表达女性家系；现代汉语以“孙女”清楚呈现她是后者的女性后裔，而不改变所列谱系。
