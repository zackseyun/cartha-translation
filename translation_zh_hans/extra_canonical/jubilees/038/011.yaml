  source_fidelity: 首句的“制伏”准确传达使对方归服的战事语境。但原文两处亲属称谓平行，宜将“以扫的子孙”修为“以扫的儿子们”。后半句的“低头屈服，成了仆役”将“低下颈项”的具体意象泛化，且把原文“好成为／以成为”的目的性表达直接改作既成结果；可作更贴近原文而仍自然的修订。
