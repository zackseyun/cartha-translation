  text: And the sons of Jacob subdued the sons of Esau on Mount Seir, and they bowed their necks so that they might become servants.
translation:
  language: zh_hans
  text: 雅各的儿子们在西珥山制伏了以扫的儿子们；以扫的儿子们便低下颈项，好成为奴仆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መገብዎሙ
  choice: 制伏了
  rationale: 该动词在此表达使对方受制、臣服；“制伏”既符合战事语境，也比“压迫”更准确自然。
- source_word: ውሉደ፡ ያዕቆብ / ደቂቀ፡ ዔሳው
  choice: 雅各的儿子们／以扫的子孙
  rationale: 分别保留原文亲属称谓；后者在叙事中可指以扫的后裔，译作“子孙”较符合现代汉语。
- source_word: አትሐቱ፡ ክሳዶሙ
  choice: 低头屈服
  rationale: 原文直译涉及“使颈项低下”；汉语用“低头屈服”保留身体意象及臣服含义，同时避免生硬。
- source_word: አግብርተ
  choice: 仆役
  rationale: 该词指处于服役、从属地位的人；“仆役”保留强制从属意味，但不擅自限定为近代财产制意义上的“奴隶”。
theological_decisions:
- issue: 臣服结果的表达
  choice: 成了仆役
  alternative: 好成为仆役／奴隶
  rationale: 原文目的或结果结构可理解为“使他们成为仆役”；中文以“成了”自然表达叙事结果，不引入额外神学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“低头屈服”既传达原文的颈项意象，又让普通读者易于理解；全句不增加原文没有的主语或因果说明。
