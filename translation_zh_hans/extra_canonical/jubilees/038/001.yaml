  yaml_path: translation/extra_canonical/jubilees/038/001.yaml
  text: And after this Judah spoke to Jacob his father and said to him, “Bend your bow, father, and send forth your arrows, and cast down the enemy and kill the adversary; and let there be strength for you, for we will not kill your brother, for he is your companion and he is like you; let us give him honor.”
translation:
  language: zh_hans
  text: 这事以后，犹大对他父亲雅各说：“父亲，拉开你的弓，射出你的箭，击倒仇敌，杀死敌手；愿你有力量！因为我们不会杀你的兄弟；他是你的同伴，和你相像。让我们尊敬他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስከ፡ አባ፡ ቀስተከ
  choice: 父亲，拉开你的弓
  rationale: ምስከ 在弓箭语境中指拉弓、张弓；依原文词序自然转为现代汉语称呼语。
- source_word: ወፈኑ፡ አሕፃከ
  choice: 射出你的箭
  rationale: ፈኑ 表示发出、放出，在弓箭语境中自然指射出；不采用缺乏此处词义支持的“把箭装入箭袋”。
- source_word: ወንደፍ፡ ጸላኢ፡ ወቅትል፡ ፀረዊ
  choice: 击倒仇敌，杀死敌手
  rationale: 保留两个平行命令及“仇敌／敌手”的近义复现，体现原文修辞。
- source_word: ወይኩን፡ ለከ፡ ኀይለ
  choice: 愿你得着力量
  rationale: 保留愿望式语气和“力量”这一核心名词，表达自然而不作额外神学解释。
- source_word: እስመ፡ አንቀትል፡ አኅዋከ
  choice: 因为我们不会杀你的兄弟
  rationale: 依据校勘审查所指出的疑似讹写，按否定形式及单数关系义理解；避免采纳不受可靠吉兹语支持的“我们要杀你兄弟的仇敌”。
- source_word: ውእቱ፡ ወመምስአከ፡ ውእቱ
  choice: 他是你的同伴，与你相像
  rationale: 依校勘所恢复的 ወቢጸከ 与 ወመምስለከ 之义翻译，两个指示／系词形式均以“他是”关系表达。
- source_word: ንህቦ፡ ለክብር
  choice: 让我们尊重他
  rationale: 按“给予他尊荣”的习惯表达转为自然汉语；受词指向前述人物。
theological_decisions:
- issue: 犹大所说的对象是否应被杀
  choice: 译作“我们不会杀你的兄弟”
  alternative: “我们要杀你兄弟的仇敌”
  rationale: 所提供的文本审查明确指出传本／录入中可能有字形讹误，并认为否定句及“同伴、相像”的后续描述构成连贯语义。此选择不引入宗派性解释。
- issue: “尊荣”的施予对象
  choice: 译作“让我们尊重他”
  alternative: “我们要把它给你作为尊荣”
  rationale: 结合前句持续以第三人称指称“你的兄弟／同伴”，把受词理解为该人最连贯；不将“尊荣”实体化为交给雅各之物。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留命令句的力度、平行近义词以及愿望式语气；不添加原文没有的身份说明或神学解释。鉴于关键歧义主要源于疑似文本讹误，而所给审查已作明确校勘判断，正文采用校勘后读法，未另设脚注。
