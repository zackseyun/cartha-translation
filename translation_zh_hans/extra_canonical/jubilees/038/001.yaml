revisions:
- from: 这事以后，犹大对他父亲雅各说：“父亲，拉开你的弓，射出你的箭，击倒仇敌，杀死敌手；愿你得着力量！因为我们不会杀你的兄弟；他是你的同伴，与你相像。让我们尊重他。”
  to: 这事以后，犹大对他父亲雅各说：“父亲，拉开你的弓，射出你的箭，击倒仇敌，杀死敌手；愿你有力量！因为我们不会杀你的兄弟；他是你的同伴，和你相像。让我们尊敬他。”
  rationale: 仅作两处低风险的汉语措辞润饰：以‘愿你有力量’替代稍显特定语域的‘愿你得着力量’，并以‘让我们尊敬他’更贴切地表达末句的 honor。其余内容维持原译，尤其保留经审校支持的疑难文本读法，未将底本文字讹误可能引出的另一种不连贯解释写入正文。
