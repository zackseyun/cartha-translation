  naturalness: 整体为自然、庄重的现代汉语。‘得着力量’稍带较特定的宗教汉语色彩，改为‘有力量’更符合现代标准汉语，同时不改变祈愿语气。末句的‘尊重他’可更准确地表达“给他尊荣／honor him”的敬重意味，改为‘尊敬他’。
  terminology: 人名‘犹大’、‘雅各’规范。‘仇敌／敌手’保留原文并列的近义修辞，恰当。将‘honor’处理为‘尊敬’避免把‘尊荣’误作可交付的物品，也使指向前述第三人的受词明确。
