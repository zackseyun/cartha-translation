  text: And they sent to their father asking whether they should make peace with them or kill them.
translation:
  language: zh_hans
  text: 他们派人去问他们的父亲：他们是该与那些人讲和，还是杀他们？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለአኩ፡ ኀበ፡ አቡሆሙ
  choice: 他们派人去问父亲
  rationale: 直译为“他们差遣到他们父亲那里”；按现代汉语自然表达，将差遣的目的隐含为“去问”，与后续间接问句相连。
- source_word: እመ፡ ይገብሩ፡ ሰላመ፡ ምስሌሆሙ
  choice: 他们是该与那些人讲和
  rationale: “作和平/缔结和平”自然译为“讲和”；ምስሌሆሙ 表示“与他们”，为避免两个“他们”所指混淆，译作“与那些人”。
- source_word: ወእመ፡ ይቀትልዎሙ
  choice: 还是杀了他们
  rationale: 保留两个备选行动的结构；ይቀትልዎሙ 明确表示“杀他们”，不弱化为“攻打”或“击败”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们是该……还是……”清楚呈现向父亲请示的二选一问题；不增添主语身份或行动动机。
