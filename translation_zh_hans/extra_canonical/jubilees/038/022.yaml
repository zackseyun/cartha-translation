  text: And Salman died, and Saul from Rehoboth by the River reigned in his place.
translation:
  language: zh_hans
  text: 萨勒曼死后，来自河边利河伯的扫罗接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰልመን (Salman)
  choice: 萨勒曼
  rationale: 按吉兹语本文音译人名，不以《创世记》平行经文中的异名形式取代源文本。
- source_word: ህየንቴሁ (həyäntehu)
  choice: 接替他
  rationale: 本义为“在他的位置上／代替他”；结合“作王”译为“接替他作王”，自然表达王位继承，同时比单纯“在他之后”更贴近原文。
- source_word: ራኦቦት፡ ፈለግ (Rāʾobōt falag)
  choice: 河边利河伯
  rationale: 将地名与“河”之间的关系自然译作“河边”，保留“利河伯”为专名；“来自河边利河伯”对应原文“从……而来”的结构。
