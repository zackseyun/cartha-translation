    rationale: 吉兹语ሐቅለ的核心义为田野、田地，也可指野地；本句应译出“摩押的田野”，而不宜改为抽象的领土范围。
  - severity: low
    issue: “击败米甸”比原文“击打／攻击米甸”更明确地断言了战果。
    rationale: ዘቀተለ的基本动作义是击杀、击打；在民族集体宾语的战争语境中可自然表达为“击打米甸”，从而避免额外强化为决定性胜利。
