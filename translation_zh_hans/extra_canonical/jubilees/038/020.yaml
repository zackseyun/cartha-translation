  text: And Asam died, and Adath son of Barad, who struck Midian in the field of Moab, reigned in his place; and the name of his city was Avith.
translation:
  language: zh_hans
  text: 亚桑死了，巴拉德的儿子亚达特接替他作王[a]；亚达特曾在摩押的田野击打米甸。他的城名叫亚未得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他的位置上作王”。
    reason: 说明原文强调接替前王的位置，而非仅指“在他以后”作王。
lexical_decisions:
- source_word: ህየንቴሁ
  choice: 接替他
  rationale: 该词意为“在他的位置上、代替他”，强调王位承继，而不只是时间上的“在他以后”。
- source_word: ዘቀተለ፡ ምዕድያምሃ
  choice: 曾……击败米甸
  rationale: ቀተለ 的基本义与“杀、击杀”有关，但宾语“米甸”在这里指一个民族或其军队，汉语译作“击败米甸”更自然，也与相关王表语境相符。
- source_word: በሐቅለ፡ ሞአብ
  choice: 在摩押境内
  rationale: ሐቅል 可指田野、地区或疆域；此处表达发生在摩押之地，译为“境内”简洁自然。
- source_word: አሳም / አዳት / በረድ
  choice: 亚桑 / 亚达特 / 巴拉德
  rationale: 按所给吉兹文的人名形式音译，避免以《创世记》平行王表中的异名直接取代本段实际读法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留本段吉兹文的人名形式；“接替他作王”清楚呈现王位承继关系。所给吉兹文摘录止于“他的城名”，城名“亚未得”依据经节的续文及校核层补足。
