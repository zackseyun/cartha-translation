  source_fidelity: “接替他作王”准确传达吉兹语ህየንቴሁ“在他的位置上／代替他”的王位承继意义。人名基本依所给吉兹文本音译。惟“在摩押境内”将በሐቅለ፡ ሞአብ（在摩押的田野／平原）泛化为政治疆域，宜保留具体地貌；“击败”虽在战事语境中通顺，但较“击打／攻打”多带明确战胜的结果含义。
  naturalness: 修订后采用“在摩押的田野击打米甸”，既保留原文相对从句所述的军事行动，也符合庄重、现代的叙事语体。“田野”在此为古代地名性地貌表述，较“境内”更贴近原文。
  terminology: 保留“作王”“米甸”及现有音译人名、城名。脚注准确说明“接替”并非仅是时间上继任。
