lexical_decisions:
- source_word: ወእምዝ
  choice: 此后
  rationale: 自然表达时间承接关系，保留“在这以后”的意义。
- source_word: ወጽኡ
  choice: 出发了
  rationale: 此处语境是出兵行动；译作“出发”比字面“出去”更符合现代汉语，同时不额外指定目的地。
- source_word: ውሉደ፡ ያዕቆብ
  choice: 雅各的儿子们
  rationale: 直接对应原文亲属称谓。
- source_word: እሙንቱ፡ ወአግብርቲሆሙ
  choice: 和他们的仆人
  rationale: 原文分别点明“他们本人”和“他们的仆人”；汉语并列主语已自然包含“他们本人”，无需生硬重复。
- source_word: ተናፊቆሙ
  choice: 分成
  rationale: 保留该词所表达的分组或分列动作，不沿用遗漏此意的旧译。
- source_word: ውስተ፡ መርብዕተ፡ ማኅፈድ
  choice: 四列战阵
  rationale: 按军事语境理解为四个战斗队列；“战阵”庄重自然，也避免将其泛化为普通的四组。
