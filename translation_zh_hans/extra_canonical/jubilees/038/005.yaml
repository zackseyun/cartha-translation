  yaml_path: translation/extra_canonical/jubilees/038/005.yaml
  text: And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, toward the south side of the tower; and they killed all whom they found before them, and none of them escaped, not even one.
translation:
  language: zh_hans
  text: 犹大首先出去，拿弗他利、迦得和五十名仆人都与他同行，往塔的南侧去。他们杀死了凡所遇见的人，没有一个从他们手中逃脱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍጹመ
  choice: 率先
  rationale: 此处结合语境表示犹大在前或首先出战；译作“率先”既自然，也保留其先行之意。
- source_word: ፶ ደቅ
  choice: 五十名仆人
  rationale: 依校勘文本及英语审定层理解为“五十名仆人”；“名”符合现代汉语对人的计数习惯。
- source_word: እንተ ገጸ ደቡብ ለማኅፈድ
  choice: 向塔的南面进发
  rationale: 按短语结构表达朝向塔南侧的行动；“进发”承接出战语境而不额外解释战术。
- source_word: ወቀተሉ ኵሎ ዘረከቡ በቅድሜሆሙ
  choice: 杀了所有遇见的人
  rationale: 直译核心意义为“杀死他们面前所遇见的一切人”，汉语中省去重复方位语更自然。
- source_word: ወአልቦ ዘአምለጠ እምኔሆሙ ወአሐዱኒ
  choice: 无一逃脱，连一个也没有
  rationale: 保留原文先否定无人逃脱、再以“一个也没有”加强语气的重复强调。
