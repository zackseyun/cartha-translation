- from: 犹大率先出战，拿弗他利和迦得与他同去，另有五十名仆人跟随他们。他们向塔的南面进发，杀了所有遇见的人，无一逃脱，连一个也没有。
  to: 犹大首先出去，拿弗他利、迦得和五十名仆人都与他同行，往塔的南侧去。他们杀死了凡所遇见的人，没有一个从他们手中逃脱。
  rationale: 修订删除原文未明说的“出战”，将同行者统一明确为与犹大同行，并以自然完整的现代汉语保留“无人逃脱”的强调。未添加脚注，因为本节无需脚注即可准确表达。
