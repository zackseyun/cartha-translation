  text: And Simeon and Benjamin and Enoch, the son of Reuben, went out to the west side of the tower, and fifty were with them; and they killed four hundred valiant warriors of Edom and the Horites.
translation:
  language: zh_hans
  text: 西缅、便雅悯和吕便的儿子以诺出到塔的西面，另有五十人与他们同行；他们杀了以东人和何利人中的四百名骁勇战士。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገጸ፡ ዐረቢሁ፡ ለማኅፈድ
  choice: 塔的西面
  rationale: 该短语直指塔的西侧；译文保留方位关系，并用现代汉语自然表达。
- source_word: ኤዶማ፡ ኤዶም፡ ወኤዶማ፡ ሖሬዎን
  choice: 以东人和何利人中的
  rationale: 原文以重复的族名形式表示被杀者分别来自以东人与何利人；加“中的”可避免误读为杀灭整个族群。
- source_word: ጽኑዓነ፡ መስተቃትላነ
  choice: 骁勇战士
  rationale: 两个词共同描写这些人刚强、善战；“骁勇战士”简洁保留其军事含义。
