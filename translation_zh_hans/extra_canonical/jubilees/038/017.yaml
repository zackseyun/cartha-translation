  text: to this day, in the land of Edom. And Balaq son of Beor reigned in Edom, and the name of his city was Denaba.
translation:
  language: zh_hans
  text: 直到今日，仍在以东地。比珥的儿子巴勒在以东作王；他的城名叫德拿巴。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “德拿巴”是按本处传本文字音译的城名；此名也常被译作“亭哈巴”。
    reason: 提示专名的不同译法，避免在传本名称与较熟悉的传统译名之间作无说明的同一化处理。
lexical_decisions:
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: 直到今日
  rationale: 直译该时间表达，保留其延续至叙述者当时的含义。
- source_word: በምድረ፡ ኤዶም
  choice: 仍在以东地
  rationale: “仍”使这一承接上文的残句在现代汉语中自然，同时不改变“在以东地”的基本意义。
- source_word: ነግሠ
  choice: 作王
  rationale: 准确表达“统治、为王”，并采用现代中文圣经叙事中自然庄重的说法。
- source_word: ባላቅ፡ ወልደ፡ ቤዖር
  choice: 比珥的儿子巴勒
  rationale: 采用中文读者熟悉的人名形式，并保留“某人的儿子”这一父系身份结构。
- source_word: ወስመ፡
  choice: 他的城名叫
  rationale: 现存引文止于“其名”，但经校验的英译咨询层保留了该分句的完整内容；中文按完整句意自然表达。
