  text: But Jacob buried his brother in the mountain that is in Adurim, and he returned to his house.
translation:
  language: zh_hans
  text: 雅各却把他的哥哥埋葬在亚杜林境内的山上，随后回到自己家里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዕቆብሰ
  choice: 雅各却
  rationale: 人名按通行译名处理；后缀 -ሰ 带有转折或话题推进意味，在上下文中译作“却”。
- source_word: ቀበሮ
  choice: 埋葬
  rationale: 准确表达将死者安葬的动作。
- source_word: እኅዋሁ
  choice: 他的哥哥
  rationale: 该词本身可泛指“他的兄弟”，但本段叙事所指为雅各的哥哥以扫；译作“哥哥”自然且符合明确语境。
- source_word: ወገር
  choice: 山上
  rationale: 保留该地形词“山、山地”的具体含义，避免弱化为泛称“地区”。
- source_word: አዱፊም
  choice: 亚杜林
  rationale: 按专名音译；原文拼写对应 Adurim。
- source_word: ገብአ ውስተ ቤቱ
  choice: 回到自己家里
  rationale: 自然表达“返回他的房屋/家中”，其中“自己”明确反身所指而不增添新信息。
theological_decisions: []
