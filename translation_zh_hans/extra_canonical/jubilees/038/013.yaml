  naturalness: 修订稿采用自然、庄重的现代汉语叙事。“派人去告诉他的儿子们”将原文“雅各差遣给他的儿子们，叫他们……”的使令关系清楚表达出来；“服役的轭”保留原文的轭之意象和臣属含义。
  terminology: “讲和”适切对应“缔结和平”。“服役的轭”对应አርዑተ፡ቅኔ，避免把臣属义缩窄为单纯体力劳役；“进贡”恰当表达ይጽብሑ在此处的纳贡／缴赋义。脚注所列较宽泛的“服事”可保留为替代性理解，但不应取代正文的“进贡”。
