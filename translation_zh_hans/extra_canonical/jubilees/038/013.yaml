  yaml_path: translation/extra_canonical/jubilees/038/013.yaml
  text: And Jacob sent to his sons that they should make peace, and they made peace with them, and they imposed upon them a yoke of service, so that they should pay tribute to Jacob and his sons all their days.
translation:
  language: zh_hans
  text: 他杀了他们。雅各派人去告诉他的儿子们，让他们讲和；他们便与那些人讲和，又把服役的轭加在他们身上，使他们一生向雅各和他的儿子们进贡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们一生服事雅各和他的儿子们。”
    reason: 保留末句可作较宽泛“服事／效劳”理解的传统译法，同时正文采用更具体的“进贡”。
lexical_decisions:
- source_word: ይቀትልዎሙ
  choice: 他追赶他们
  rationale: 按吉兹语动词的基本义直译，并保留其与前文叙事相接的性质；该短句虽在英文咨询文本中省略，原文却明确存在。
- source_word: ይግበሩ፡ ሰላመ
  choice: 讲和
  rationale: 字面为“缔造和平”，现代汉语叙事中“讲和”自然、准确。
- source_word: አርዑተ፡ ቅኔ
  choice: 服劳役的轭
  rationale: 保留“轭”的支配意象；ቅኔ指服役、臣属或劳役，不泛化为普通工作。
- source_word: ይጽብሑ
  choice: 进贡
  rationale: 该词在本句语境中指缴纳贡赋，比泛称“服事”更具体，也与劳役臣属的上下文吻合。
- source_word: ኵሎ
  choice: 终身
  rationale: 依英文校勘层所反映的句义理解为“所有日子／一生之久”，用“终身”作自然凝练的表达。
theological_decisions:
- issue: 臣属关系的性质
  choice: 同时保留“劳役之轭”和“进贡”
  alternative: 概括为“服事雅各”
  rationale: 原文包含加轭与缴纳贡赋两个层面；不将政治、经济性的臣属关系神学化或弱化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“那些人”用于区分雅各的儿子们与他们讲和的对象，避免连续代词造成歧义。正文脚注标记已置于相关句末。
