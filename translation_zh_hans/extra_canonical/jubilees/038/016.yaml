  text: And these are the kings who reigned in Edom before a king reigned over the children of Israel.
translation:
  language: zh_hans
  text: 以下是曾在以东作王的诸王，在有王统治以色列子孙以前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሉ፡ ነገሥት
  choice: 以下……诸王
  rationale: “这些王”在此引出随后名单；汉语用“以下……诸王”自然承接，同时保留指示与复数含义。
- source_word: ነገሡ፡ በኤዶም
  choice: 在以东作王
  rationale: 按原文表达其在以东施行王权；“作王”也能保留后半句同一词根的呼应。
- source_word: ዘእንበለ፡ ይንግሥ፡ ንጉሥ
  choice: 有王作王以前
  rationale: 保留“王／作王”的词根重复，不将时间关系扩写为更具体的君主制度解释。
- source_word: ለውሉደ፡ እስራኤል
  choice: 在以色列子孙中
  rationale: “子孙”对应原文的后裔群体称谓；介词在语境中可表示相对于或治理该群体，译作“在……中”保留原句相对简约的表达。
theological_decisions:
- issue: 以色列王权出现之前的时间参照
  choice: 在以色列子孙中有王作王以前
  alternative: 在有王统治以色列子孙以前
  rationale: 原文使用“王”与“作王”的同根表达，所选译法保留这一修辞，并避免把介词关系过度限定为直接统治。
translation_notes:
  register: 采用庄重而通顺的现代书面汉语；句式按名单引言处理，以“以下”开头。保留“作王”的经史语体，但避免生僻古奥措辞。
