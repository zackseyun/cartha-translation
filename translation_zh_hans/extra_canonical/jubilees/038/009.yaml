  text: 'And six hundred fled, and four of the sons of Esau fled with them; and they left their father slain, as he had fallen in the hill-country which is in Add footnote: "Ge''ez reads Adufim, likely a scribal corruption of Adurim.". And the sons of Jacob pursued them as far as Mount Seir.'
translation:
  language: zh_hans
  text: 有六百人逃走了，以扫的四个儿子也同他们一起逃走；他们撇下了已被杀、倒在亚杜芬[a]境内山地的父亲。雅各的儿子们追赶他们，直到西珥山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语作“亚杜芬”（Adufim）；这可能是“亚杜琳”（Adurim）在抄传中产生的讹误。
    reason: 正文忠实保留原文实际读法，同时说明学界常见的校勘判断，避免把推定改读当作无争议的原文。
lexical_decisions:
- source_word: ስድስቱ፡ ምእት
  choice: 六百人
  rationale: 原文直译为“六百”，上下文所指数目为人，汉语补出量词使句意自然。
- source_word: ጕዩ
  choice: 逃跑了
  rationale: 保留原文重复出现的“逃跑”动作，不弱化为一般的离去。
- source_word: ቅቱለ
  choice: 已经被杀
  rationale: 准确表达父亲处于被杀死的状态，同时避免擅自指明行凶者。
- source_word: ወገር
  choice: 山地
  rationale: 此处指丘陵或山岭地区；“山地”符合上下文并保持地貌含义。
- source_word: አዱፊም
  choice: 亚杜芬
  rationale: 正文按现存吉兹语读法 Adufim 音译，不在正文中静默采用校勘改读。
- source_word: ሰደድዎሙ
  choice: 追赶他们
  rationale: 表达持续追击之意，现代汉语自然，也不添加已经追上的含义。
- source_word: ደብረ፡ ሴኢር
  choice: 西珥山
  rationale: 采用该地名在中文圣经传统中通行而清楚的译名。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号处理原文中“撇下父亲”与其死亡状态的关系，尽量保留句法张力；不补明以扫为父亲，也不判定是谁杀了他。
