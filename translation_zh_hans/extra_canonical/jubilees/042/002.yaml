  yaml_path: translation/extra_canonical/jubilees/042/002.yaml
  text: And the rain was withheld from the land, because there was no shower that came down. And the land became barren, but in the land of Egypt alone there was food, because Joseph had gathered seed for the land
translation:
  language: zh_hans
  text: 那地没有得到雨[a]，因为没有雨水降下。土地变得荒芜；唯独埃及地有粮食，因为约瑟已为那地收集了种子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“雨拒绝被赐下。”
    reason: 保留原文以“拒绝”拟人化描述雨未被赐下的独特表达；正文按现代汉语自然表达。
lexical_decisions:
- source_word: ወአበየ፡ ዝናም፡ ተውህቦ
  choice: 雨也不再降在地上
  rationale: 原文直译为“雨拒绝被赐下”，是拟人化习语；正文以自然汉语表达停止降雨，脚注保留字面形象。
- source_word: ምትነ
  choice: 一滴雨
  rationale: 结合“落下”的语境，指少量降水或雨滴；译作“一滴雨”自然地突出完全无雨。
- source_word: ዐብረተ፡ ምድር
  choice: 土地变得荒芜
  rationale: 按语境表达土地因旱灾而不再出产，与后文埃及有粮形成对照。
- source_word: ሲሲተ
  choice: 粮食
  rationale: 此处指可供食用或维生的储粮，现代汉语“粮食”符合饥荒语境。
- source_word: አስተጋብአ፡ ዮሴፍ፡ ዘርአ፡ ለምድር
  choice: 约瑟已经为那地储备了种子
  rationale: 保留“收集、聚集种子供土地之用”的基本意象；“储备”符合约瑟预先积存的语境，又不将“种子”泛化为粮食。
