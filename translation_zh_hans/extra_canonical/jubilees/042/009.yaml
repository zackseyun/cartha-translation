  yaml_path: translation/extra_canonical/jubilees/042/009.yaml
  text: And they went up from the land of Egypt and came to the land of Canaan, and they told their father everything that had happened to them, and how the ruler of the land had spoken harshly with them and had seized Simeon until...
translation:
  language: zh_hans
  text: 他们从埃及地上去，来到迦南地，把自己所遭遇的一切都告诉了父亲，又讲到[a]那地的统治者怎样严厉地对他们说话，并扣押了西缅，直到……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又说那地的统治者……”。
    reason: 保留连接词在“怎样”与“那”之间的可能理解；正文采用更符合 ወአፎ 方式义的译法。
  - marker: b
    text: 原文的“直到”引出下一节才完成的从句。
    reason: 说明本节结尾在原文中并非完整句，避免误补为“直到那时”。
lexical_decisions:
- source_word: ዐርጉ
  choice: 上去
  rationale: 该词意为“上升、上去”；从埃及前往迦南按古代地理叙述惯用“上去”。
- source_word: ኵሎ፡ ዘከመ፡ ረከቦሙ
  choice: 自己所遭遇的一切
  rationale: 自然表达他们向父亲报告全部经历，同时保留“临到、遇到他们”的含义。
- source_word: ወአፎ
  choice: 又讲到……怎样
  rationale: 此处引出事情发生的方式，译为“怎样”比单纯的“说”或“说那”更贴近原文，也与前面的报告内容自然衔接。
- source_word: መኰንነ፡ ብሔር
  choice: 那地的统治者
  rationale: 直译为“那地的掌权者/统治者”；避免具体化为原文未明说的官职。
- source_word: ዐጹባጺበ
  choice: 严厉地
  rationale: 在此修饰统治者对众兄弟说话的方式，表达严厉、粗暴相待之意。
- source_word: አሐዘ
  choice: 扣押
  rationale: 语境中西缅被留下作为人质；“扣押”既表达拘留，也不额外加入原文未明说的法律含义。
- source_word: እስከ፡ ሶበ
  choice: 直到……
  rationale: 这是引出后续时间从句的连接语，句法延续到下一节，不应在本节内补成“直到那时”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上去”“迦南地”保留圣经地理叙事的常用表达；以省略号明确呈现跨节未完句。所给吉兹文本开头在“他们从埃及地上去”之前另有上一句的残余结尾，依经节切分证据及审校后的英文咨询层，本节正文从“他们从埃及地上去”起译。
