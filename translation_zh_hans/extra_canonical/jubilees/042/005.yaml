  yaml_path: translation/extra_canonical/jubilees/042/005.yaml
  text: And Joseph recognized them, but they did not recognize him. And he spoke harshly with them and said to them, “Are you not spies, and have you come to observe the exposed parts of the land?”
translation:
  language: zh_hans
  text: 约瑟认出了他们，他们却没有认出他。他严厉地对他们说：“你们不是探子吗？你们来，是要察看这地暴露的地方吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእመሮሙ / ኢያእመርዎ
  choice: 认出了他们／没有认出他
  rationale: 保留同一词根形成的鲜明对照，并用现代汉语自然表达相认与未认出的意思。
- source_word: ዐጹባጺበ
  choice: 严厉地
  rationale: 该副词描述约瑟说话的严峻、粗厉方式；“严厉地”庄重自然，不额外推断其语气细节。
- source_word: ሰብአ፡ ዓይን
  choice: 探子
  rationale: 字面构词近于“眼目之人”，在本语境中指负责窥察的人；译为“探子”可准确传达其惯用意义，避免生硬直译。
- source_word: ታስተሓይዪ
  choice: 察看
  rationale: 表达前来观察、查探的动作，同时不过度强化为军事侦察。
- source_word: ጸባረ፡ ምድር
  choice: 这地暴露的地方
  rationale: 保留原文所指土地无遮蔽、易受侵入或防守薄弱之处的形象及一定歧义，不径自限定为“弱点”或“边防”。
