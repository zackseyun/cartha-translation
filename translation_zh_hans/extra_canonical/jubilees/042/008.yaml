- source_word: አሕስሊሆሙ
  choice: 他们的袋子
  rationale: 按本节叙事语境指装粮食等物的袋子；采用现代汉语通顺而不过度具体化的表达。
- source_word: ኢያእመሩ
  choice: 他们并不知道
  rationale: 直接保留否定式认知动词的含义。
- source_word: እኅዋሆሙ
  choice: 他们的弟弟
  rationale: 该词本身可泛指兄弟；结合后续“最小的”及叙事语境，译作“弟弟”最自然。
- source_word: ዘይ…
  choice: 因为他们曾告诉他……
  rationale: 所给吉兹文片段在此处截断；依据同节经审校的英文咨询层补足句意，同时不对原因关系作额外发挥。
