  text: in the seven years of abundance and had kept it. And the Egyptians came to Joseph so that he might give them food, and he opened the storehouses where the grain of the former years was, and sold it to the peoples of the land for gold.
translation:
  language: zh_hans
  text: 在七个丰年中，他把粮食储存了起来。埃及人[a]来到约瑟那里，请他给他们食物。约瑟便打开存放着往年粮食的仓库，把粮食卖给那地的众民，换取金子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“埃及来到了约瑟那里。”
    reason: 原文名词形式可直译为“埃及”，但相应动词和代词为复数，正文据此译作“埃及人”。
lexical_decisions:
- source_word: ሠምር
  choice: 丰年
  rationale: 按上下文指物产丰盛、粮食充足的年岁；译作“丰年”自然简洁，也与约瑟故事的语境相符。
- source_word: ዐቀቦ
  choice: 储存了起来
  rationale: 该词有保守、看守、保存之意；在粮食语境中译为“储存”最符合现代汉语表达。
- source_word: ግብጽ
  choice: 埃及人
  rationale: 名词字面可指“埃及”，但谓语“他们来”和后文“给他们”的复数形式表明这里所指是埃及人。
- source_word: ሲሲተ
  choice: 食物
  rationale: 保留泛指食物或给养的含义，不将其不必要地限缩为某一种粮食。
- source_word: መዛግብተ
  choice: 仓库
  rationale: 在储粮语境中指储藏粮食的库房，译作“仓库”准确且通俗。
- source_word: ስርናይ
  choice: 粮食
  rationale: 该词具体可指小麦或谷物；此处作为仓储和售卖对象，中文用“粮食”较自然，并保留类别上的适度宽泛。
- source_word: ዘቀዳሚ፡ ዓመት
  choice: 往年
  rationale: 指此前那些年份，而非严格意义上的“第一年”；“往年”自然地传达先前年份的含义。
- source_word: አሕዛበ፡ ምድር
  choice: 当地各族
  rationale: 直义为“那地的诸民／各族”；译文保留群体复数，同时避免生硬的“地上的民族”。
- source_word: በወርቅ
  choice: 收取金子
  rationale: 原文明确为“用金／以金子”，不可译作银子；在交易语境中补出“收取”使汉语关系清楚。
theological_decisions: []
