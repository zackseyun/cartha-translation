- from: 在七个丰年中，他把粮食储存了起来。埃及人[a]来到约瑟那里，请他给他们食物。约瑟便打开存放着往年粮食的仓库，把粮食卖给当地各族，收取金子。
  to: 在七个丰年中，他把粮食储存了起来。埃及人[a]来到约瑟那里，请他给他们食物。约瑟便打开存放着往年粮食的仓库，把粮食卖给那地的众民，换取金子。
  rationale: 仅作两处低风险措辞调整：以“那地的众民”保留原文对当地人群的宽泛复数指称，避免将其限为“各族”；以“换取金子”清楚表达售卖粮食的交易对价。脚注将直译备选补足为完整、自然的汉语句子。
