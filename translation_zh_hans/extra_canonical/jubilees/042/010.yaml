translation:
  language: zh_hans
  text: 他们要带便雅悯来。雅各说：“你们使我失去了儿子：约瑟不在了，西缅也不在了……”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያመጽእዎ፡ ለብንያም
  choice: 他们要把便雅悯带来
  rationale: 按使役/带来之义直译，并保留原文在本节开头承接上文的句法状态。
- source_word: እምከንከሙኒከ
  choice: 你们使我丧失儿女
  rationale: 该词表达使人失去子女、使其丧子的意思；采用现代汉语中自然且能保留亲子关系信息的说法。
- source_word: ኢሀሎ
  choice: 不在了
  rationale: 原文表面为“不存在/不在”，在失子语境中委婉表达已经失去；“不在了”既自然，又不将死亡状态解释得过于明确。
- source_word: ወስምዖንሂ
  choice: 西缅也
  rationale: 附加成分表达“也/同样”，故将其明确译出。
theological_decisions:
- issue: 约瑟与西缅的状态是否明确为死亡
  choice: 均译作“不在了”
  alternative: 均译作“死了”或“没有了”
  rationale: 原文只陈述他们“不在/不存在”，雅各未必确知二人死亡；译文保留这种认识上的有限性与叙事张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“丧失儿女”比单说“使我丧子”更贴合复数对象，也避免误解为只失去一个儿子；省略号表明原始节选在此未完。
