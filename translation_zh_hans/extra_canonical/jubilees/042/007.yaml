  text: He sent his brothers away, and he filled their sacks with grain, and he also put their money for them.
translation:
  language: zh_hans
  text: 他打发他的弟兄们离开，把他们的袋子装满粮食，又为他们放好了他们的钱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钱”直译为“金子”或“黄金”。
    reason: 保留ወርቅ的本义；本节语境下“钱”是自然的概括译法。原文说“为他们／给他们”，但未明确说明放置的地点。
lexical_decisions:
- source_word: አኀዊሁ
  choice: 弟兄们
  rationale: 该词表示“他的弟兄们”；汉语结合主语与叙事语境，用“弟兄们”自然表达，所属关系已由上下文明确。
- source_word: አሕስሊሆሙ
  choice: 他们的袋子
  rationale: 指装粮食的袋或口袋；“袋子”是现代汉语中准确而自然的统称。
- source_word: ስርናየ
  choice: 粮食
  rationale: 该词指谷物、小麦一类粮食；此处用概括性的“粮食”，符合交易和装袋的语境。
- source_word: ወርቆሙ
  choice: 他们的钱
  rationale: ወርቅ本义为“金、黄金”，也可指钱财；这里是购粮所付而被放回的钱，不应依《创世记》平行经文译作“银子”。
- source_word: ሎሙ
  choice: 给他们
  rationale: 该形式表达受益或间接受词“为他们、给他们”，而非地点意义“在袋中”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“打发……走了”自然呈现差遣离开的动作；末句以“放进去给他们”兼顾汉语表达和原文“给他们”，并用脚注交代“钱／金子”的词义幅度。
