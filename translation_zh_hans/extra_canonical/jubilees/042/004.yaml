base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/042/004.yaml
  text: And the famine became very severe in the land of Canaan, and Jacob heard that there was grain in Egypt, and he sent ten of his sons to get grain for him from Egypt. But Benjamin he did not send. And the ten sons of Jacob arrived in Egypt with those who were traveling.
translation:
  language: zh_hans
  text: 迦南地的饥荒变得极其严重。雅各听说埃及有粮食，就派十个儿子到埃及去为他买粮。至于便雅悯，他没有派去。[a] 雅各的十个儿子便和其他赶路的人一同抵达埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给吉兹文本在这里字面作“他派去了”，没有通常的否定词；但本节两次说前往的是十个儿子，且相关叙事也说便雅悯没有同去，因此正文采用“没有派去”。
    reason: 如实呈现现存源文本与上下文所支持读法之间的文本差异。
lexical_decisions:
- source_word: ረኃብ
  choice: 饥荒
  rationale: 准确表达席卷一地的严重粮食短缺，比“饥饿”更符合上下文。
- source_word: ሲሲት
  choice: 粮食
  rationale: 该词在这里指可从埃及取得的口粮或谷物；“粮食”既贴合语境，也避免无根据地限定为某一种谷物。
- source_word: ይንሥኡ
  choice: 买
  rationale: 字面义偏向“取得、拿取”，但创世记相关叙事的交易语境表明是购粮；现代汉语用“买粮”自然清楚。
- source_word: ምስለ፡ ዘየሐውር
  choice: 和其他赶路的人一同
  rationale: 保留“与行路者同行”的意思，并用自然汉语表达不特指身份的同行旅客。
theological_decisions:
- issue: 便雅悯是否被派往埃及
  choice: 正文译作“他没有派去”，并加脚注说明文本问题
  alternative: 按所给吉兹文本的现存字面形式译作“他也派去了”
  rationale: 所给文本的动词形式表面上没有否定词，但这与本节前后逻辑、十个儿子的明确数目以及平行叙事冲突；英译审校层也采用否定读法。正文采用极可能的原意，同时不掩盖源文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“极其严重”对应源文的加强表达；句式保持流畅，不机械复制吉兹语连续使用“并且”的结构。
