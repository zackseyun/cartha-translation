lexical_decisions:
- source_word: ዓመት፡ ዘሱባዔ፡ ሣልስ
  choice: 第三个七年的第一年
  rationale: 按禧年纪年语境，将“第三个七年”理解为该禧年内第三组七年周期；保留原文的历法表达，同时使现代汉语读者易于理解。
- source_word: ዘ፵ወ፭፡ ኢዮቤልው
  choice: 第四十五个禧年
  rationale: 直译序数与“禧年”，保留《禧年书》特有的纪年体系。
- source_word: ዐባር
  choice: 饥荒
  rationale: 该词在此处指粮食匮乏、饥荒，与叙事语境及英语审校层一致。
- source_word: ይምጻእ፡ ውስተ
  choice: 正临到
  rationale: 以进行性表达对应原文“当……来到/进入时”的未完动作，并自然引出后续地点或叙事。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“七年”用于表达禧年内部的七年周期，避免较生硬的“七年期”；句末保留逗号，因为所给原文和英语审校文本均为未完的从属时间结构。
