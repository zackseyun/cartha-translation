  text: And he put them in custody. And after that he released them and kept Simeon alone, and the nine [he sent away]
translation:
  language: zh_hans
  text: 他把他们拘押起来。此后，他释放了他们，却单独扣留西缅；至于那九人，他把他们[遣走了]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的本节原文切分在“那九人”之后中断；“遣走了”据接续文本补出。也可直译为：“以及那九人……”。
    reason: 原文分节或切分造成句末动词缺失；方括号标示补出的动词，并说明文本情况及较字面的替代译法。
lexical_decisions:
- source_word: ንጸዎሙ
  choice: 把他们拘押起来
  rationale: 该词在此语境表示将人置于看管或羁押之下；“拘押”自然、明确，又不额外推定监禁形式。
- source_word: ፈትሖሙ
  choice: 释放了他们
  rationale: 对应解开、放走之意；结合此前的拘押，译作“释放”最合语境。
- source_word: አቀመ ስምዖንን ባሕቲተ
  choice: 只留下西缅一人
  rationale: 保留“使西缅留下”与“单独一人”的语义，同时符合现代汉语表达。
- source_word: ወተስዐተ
  choice: 至于其余九人，他把他们遣走了
  rationale: 现存分节片段止于“九人”，句法不完整；依相邻文本与审校所指出的跨节缺失动词补出“遣走”，并以脚注说明。
