  text: And Asudi, and Iyak, and Solomon were six. And they died in the year they entered Egypt, and there remained to Dan
translation:
  language: zh_hans
  text: 亚苏底、伊雅克和所罗门，共计六人。他们在进入埃及的那一年死了；至于但，还留下了……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在此处以“给／为但”的与格结构悬接，直译为“给但还留下了”。本节未说明所留下的是谁或什么；也有译法作“但仍存留”。
    reason: 说明末句的吉兹语与格关系及本节末尾的悬接，避免将“但”误解为“存留”的主语。
lexical_decisions:
- source_word: አሱዲ፡ ኢያክ፡ ስሎሞን
  choice: 亚苏底、伊雅克和所罗门
  rationale: 按吉兹语人名音译，并保留三个人名的并列关系。
- source_word: ሲድስቱ
  choice: 合计六人
  rationale: 原词意为“六（人）”；结合本节显然承接前文名单，用“合计”自然表达总数，同时不把眼前三个人误说成六个人。
- source_word: ወሞቱ፡ በዓመተ፡ ቦኡ፡ በግብጽ
  choice: 他们进入埃及的那一年就死了
  rationale: 依次保留“他们死了”“在……年”“他们进入埃及”的时间关系；“就”自然体现同年发生，并未另加因果。
- source_word: ወተርፈ፡ ለዳን
  choice: 给但还留下了……
  rationale: ተርፈ是不及物的“剩下、存留”，ለዳን含与格“给但、为但”。原文在此形成悬而未完的结构，因此不擅自补出留下者是谁。
theological_decisions:
- issue: 末句中“但”是否为存留者
  choice: 保留与格结构：“给但还留下了……”
  alternative: “但仍存留”或“但留下来”
  rationale: 吉兹语ለ-标示“给／为”，不宜无根据地把“但”改作动词“存留”的主语；省略号保留源文在本节末尾的未完信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名用音译；“合计六人”照应前文名单。末句刻意保留原文的悬接结构，不根据下一节内容擅自补足。
