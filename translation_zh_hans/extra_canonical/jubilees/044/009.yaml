  text: 'And these are the names of the sons of Jacob who went into Egypt with Jacob their father: Reuben, the firstborn of Israel; and these are the names of his sons: Enoch, Pallu, Hezron, and Carmi—four.'
translation:
  language: zh_hans
  text: 这些是雅各的儿子们的名字；他们与父亲雅各一同去了埃及：以色列的长子流便；他的儿子名叫哈诺、法路、希斯伦和迦米，共四人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እለ፡ ሖሩ፡ ውስተ፡ ግብጽ
  choice: 去了埃及
  rationale: 按吉兹文的简单过去叙述直译，既自然又保留迁往埃及这一动作。
- source_word: በኵሩ፡ ለእስራኤል
  choice: 以色列的长子
  rationale: 准确表达属格关系及“头生、长子”之意，并保留雅各的盟约名“以色列”。
- source_word: ሄኖክ
  choice: 哈诺
  rationale: 采用《创世记》46:9同一人物在现代中文圣经中的常见译名，避免误认作另一位通常译为“以诺”的人物。
- source_word: ፬
  choice: 共四人
  rationale: 将吉兹文末尾的数字“四”自然融入中文，同时保留名单总数。
