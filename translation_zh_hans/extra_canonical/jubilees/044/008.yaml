  yaml_path: translation/extra_canonical/jubilees/044/008.yaml
  text: And Israel sent Judah before him to his son Joseph, so that he might examine the land of Goshen, because there Joseph had told his brothers to come and dwell, so that they might be near him. And it was the best of the land of Egypt, and near to him, for all of them and for their livestock.
translation:
  language: zh_hans
  text: 以色列先派犹大到他的儿子约瑟那里，好勘察[a]歌珊地；因为约瑟曾告诉他的兄弟们，要到那里居住，好让他们离自己近些。歌珊是埃及地最好的地方[b]，离约瑟也近，对他们所有人和他们的牲畜来说也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“预备”。
    reason: 该动词在传本与平行叙事的理解中有“勘察”和“预备”两种译法；正文采用更贴近此处吉兹语词义的“勘察”。
  - marker: b
    text: 直译“它在埃及地是美好的”。
    reason: 原文形容歌珊美好、优良；正文依比较语境译作“埃及地最好的地方”，脚注保留较形式对应的译法。
lexical_decisions:
- source_word: ያስተዳሉ (yāstaddālu)
  choice: 勘察
  rationale: 在本句语境中表达察看、查明地方的意思，比受《创世记》平行叙事影响的“预备”更贴近此处吉兹语的具体用词，同时保留异译于脚注。
- source_word: ሠናይት (śannāyt)
  choice: 最好的地方
  rationale: 该词本义为美好、优良；在此指歌珊相对于埃及其他地区的优越性，语境上宜作“最好的地方”，而非仅说“在埃及地是好的”。
- source_word: ቅሩበ ዚአሁ / ቅርብት ኀቤሁ
  choice: 离自己近些／离约瑟也近
  rationale: 两处均突出歌珊与约瑟所在之处的距离近；第二处明确重提“约瑟”，使现代汉语指代清楚。
- source_word: ለኵሉ ወለእንሳሂ
