  yaml_path: translation/extra_canonical/jubilees/044/028.yaml
  text: '[And these are the names of the sons of Bilhah, the handmaid] of Rachel, the wife of Jacob, whom she bore to Jacob: Dan and Naphtali. And these are the names of their children who came with them into Egypt: the sons of Dan: Hushim and Samon.'
translation:
  language: zh_hans
  text: '[以下是拉结的婢女辟拉给雅各所生众子的名字：][a]但和拿弗他利。以下是随他们进入埃及的儿女的名字：但的儿子是户伸和撒们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给古典埃塞俄比亚语片段从句中开始，缺少句首“以下是拉结的婢女辟拉……众子的名字”一类的引介语。方括号内依据本节的谱系句法和上下文补出；现存文字起于“拉结，雅各的妻子，……她给雅各生了……”。
    reason: 说明章节切分造成的句首缺失，并将恢复的引介语与实际提供的古典埃塞俄比亚语文字明确区分。
lexical_decisions:
- source_word: ዘወለደት
  choice: 辟拉给雅各生了
  rationale: 该动词是阴性单数主动式“她生了”；结合残缺句首所恢复的先行词“辟拉”，保留主动语态，避免误说成拉结亲自生了但和拿弗他利。
- source_word: እለ፡ ቦኡ፡ ምስሌሆሙ፡ ውስተ፡ ግብጽ
  choice: 那些同他们一起进入埃及的儿女
  rationale: 依次体现关系词、复数动词“进入”、介词“同他们一起”和地点“埃及”，同时调整为自然汉语语序。
- source_word: ሑሲም
  choice: 户伸
  rationale: 按此处古典埃塞俄比亚语音形转写该人名，并采用与常见圣经人名传统相近的汉语形式。
- source_word: ሳሞን
  choice: 撒们
  rationale: 按所给文本的音形转写；不擅自改同其他谱系文本中的异文或删去此名。
theological_decisions:
- issue: 但和拿弗他利的生母是谁
  choice: 明确以辟拉为动词“生了”的主语
  alternative: 译为“拉结给雅各生了”或无主语的“给雅各生了”
  rationale: 阴性主动动词需要承接前文先行词；经恢复的残缺句首显示该先行词是拉结的婢女辟拉。这样既忠于语法，也不把辟拉所生的儿子归为拉结亲生。
- issue: 缺失句首的处理
  choice: 在正文中以方括号补出“以下是拉结的婢女辟拉众子的名字”并加注
  alternative: 仅翻译现存片段，形成语义残缺或改用被动句掩盖缺文
  rationale: 所给片段显然从所属短语中间开始，且章节切分校验与审校资料均指出句首被误切；方括号可恢复可读性，同时透明标明补文而不冒充现存文字。
translation_notes:
  register: 采用现代、庄重而易懂的谱系叙述。为适应汉语语序，把现存源文中的“拉结，雅各的妻子”处理为独立说明句，并再次点明“辟拉”为主动动词的主语；方括号及脚注公开标示句首补文。
