    text: 这里但的众子与《创世记》46:23通常所见的名单不同。《禧年书》保存了一个扩展的传统，列出但的几个儿子；下文说其中多数人在进入埃及的同一年死去。现存吉兹文句末的数词作“六”，但本句实际只列出五个名字。
