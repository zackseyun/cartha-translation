  yaml_path: translation/extra_canonical/jubilees/044/007.yaml
  text: And his sons and the sons of his sons rose up, and they loaded their father and their possessions on wagons. And Israel set out from the Well of the Oath on the sixteenth of this third month, and he went to the land of Egypt.
translation:
  language: zh_hans
  text: 他的儿子和孙子们都动身，把父亲和他们的财物安置在车上。第三个月十六日，以色列从誓约井[a]出发，前往埃及地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓约井”即别是巴；这里按原文所用名称的字面意思译出。
    reason: 帮助读者识别这一地点的传统圣经地名，同时保留吉兹文本的字面表达。
lexical_decisions:
- source_word: ውሉዱ፡ ወውሉደ፡ ውሉዱ
  choice: 他的儿子和孙子们
  rationale: 原文直译为“他的儿子和他儿子的儿子”；用“儿子和孙子们”准确而自然地表达两代后裔。
- source_word: ወአጽዐኑ፡ አበሆሙ፡ ወንዋዮሙ፡ ዲበ፡ ሰረገላት
  choice: 把父亲和他们的财物安置在车上
  rationale: 保留父亲与财物同被置于车辆上的句法关系；“安置在车上”比机械的“装载父亲”更符合现代汉语尊重人物的表达。
- source_word: ዐዘቅተ፡ መሐላ
  choice: 誓约井
  rationale: 按吉兹文词义直译为“誓约之井”，并以脚注说明其传统地名，保留原文的地名释义特色。
- source_word: ዐሡሩ፡ ወስዱሱ፡ ለዝ፡ ወርኅ፡ ሣልስ
  choice: 三月十六日
  rationale: 准确传达原文的历法日期，采用现代汉语自然次序。
- source_word: ብሔረ፡ ግብጽ
  choice: 埃及地
  rationale: “地”对应原文地域名词，也与庄重的经书叙事语体相称。
theological_decisions: []
translation_notes:
