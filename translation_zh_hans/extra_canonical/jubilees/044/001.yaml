  text: 'And Israel set out from Add a footnote: "Ge''ez reads *Haran*, a likely scribal error for *Hebron*.", from his house, on the new moon of the third month, and he went by the way of the Well of the Oath, and he offered a sacrifice to the God of his father Isaac on the seventh of this month.'
translation:
  language: zh_hans
  text: 以色列在三月初一从他在希伯仑[a]的家中出发，走别是巴（即“誓约井”）的路；本月初七，他向他父亲以撒的上帝献上祭物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹文作“哈兰”，很可能是“希伯仑”的抄写错误。
    reason: 现存吉兹文本读“哈兰”，但叙事地理及通行校勘均表明“希伯仑”很可能是原读法；脚注保留文本证据。
lexical_decisions:
- source_word: እምካራን
  choice: 从家乡希伯仑[a]
  rationale: 现存吉兹文本字面作“从哈兰”，但上下文是雅各从迦南的家前往埃及，并途经别是巴；因此正文采用极可能的原文修复“希伯仑”，同时以脚注保留抄本读法。
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ
  choice: 在三月初一
  rationale: ሠርቀ在历法语境中指新月之日，即该月第一日；现代汉语以“初一”表达最自然清楚。
- source_word: ፍኖተ፡ ዐዘቅተ፡ መሐላ
  choice: 誓约井的路
  rationale: 字面为“誓言（或誓约）之井的道路”，对应别是巴这一地名的释义；保留源文的释名形式，避免直接以传统地名替换。
- source_word: ሦዐ፡ መሥዋዕተ
  choice: 献了祭
  rationale: 准确传达献上祭物的行动，并采用自然、庄重的现代汉语。
- source_word: ለአምላከ፡ አቡሁ፡ ይስሐቅ
  choice: 向他父亲以撒的上帝
  rationale: 保留属格关系，不将其泛化为“祖先的上帝”或加入额外神学说明。
theological_decisions:
- issue: “以撒的上帝”中的关系表达
  choice: 他父亲以撒的上帝
  alternative: 他父亲以撒所敬奉的上帝
  rationale: 源文直接表达“他父亲以撒的上帝”；正文保留这一盟约性称谓，不添加“所敬奉的”等解释性成分。
- issue: 献祭日期与行程的句法关系
  choice: 以分号区分出发、行路和初七献祭
  alternative: 将所有动作连成一个长句
  rationale: 源文连续使用并列结构，但献祭明确发生在本月初七；分号既保留叙事连接，也避免让读者误以为出发当天便献祭。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“家乡”用于顺畅表达“从他的家”，并与所校订的地名衔接；“三月初一”和“本月初七”清楚呈现古代历法日期。
