  yaml_path: translation/extra_canonical/jubilees/044/003.yaml
  text: And while he was considering sending to Joseph that he should come to him[3], and not going down himself, he remained there seven days, to see in a vision whether he should stay or whether he should go down. And he celebrated the feast of the harvest of the firstfruits of the old grain, for in all the land of Canaan there was not a handful of any seed in the land, because the famine was upon all the beasts and the livestock and the birds and also upon men.
translation:
  language: zh_hans
  text: 他正考虑派人去告诉约瑟，要约瑟到他这里来，而自己不下埃及去；于是他在那里停留了七天，要在异象中察看自己究竟该留下，还是该下去。[a]他又庆祝陈粮初熟果实的收割节，[b]因为迦南全地连一把种子也没有；饥荒临到了所有的野兽、牲畜、飞鸟，也临到了人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传世吉兹文本这一句结构艰涩。大意似乎是：雅各先停留七天，等候异象确认自己究竟该留下，还是该下埃及。
    reason: textual_variant
  - marker: b
    text: 或译：“陈粮初熟果实节。”原文连续使用“节期、收割、初熟果实”等词。
    reason: translation_alternative
lexical_decisions:
- source_word: ይሔሊ፡ ይልአክ፡ ለዮሴፍ፡ ከመ፡ ይምጻእ፡ ኀቤሁ
  choice: 考虑派人去告诉约瑟，要约瑟到他这里来
  rationale: 保留“考虑—派遣—约瑟来他这里”的句法关系，同时用自然现代汉语补足传话行为。
- source_word: ወኢይረድ፡ ውእቱ
  choice: 而自己不下埃及去
  rationale: “他不下去”在叙事语境中指雅各不下埃及；补出目的地以免汉语读者误解，但不改变行动抉择。
- source_word: ይርአይ፡ ራእየ
  choice: 在异象中看看
  rationale: 兼顾“看见/察看”和“异象”两个词的形式，表达等候异象指引的意思。
- source_word: በዓለ፡ ማእረረ፡ ቀዳሚ፡ ፍሬ
  choice: 初熟果实……收割节
  rationale: 明确保留“节期”“收割”和“初熟果实”三项词义，避免漏译“收割”。
- source_word: እምሥርናይ፡ ብሉይ
  choice: 用陈粮
  rationale: 按“旧的谷物/粮食”直译为自然汉语“陈粮”，与饥荒中没有新收成的语境相合。
- source_word: ዐባር
  choice: 饥荒
  rationale: 该词在此指饥荒，须明确译出，不能把末句误作食物分配的陈述。
theological_decisions:
- issue: 雅各等候异象与是否下埃及的关系
  choice: 译作要在异象中察看自己该留下还是下去
  alternative: 译成等候上帝明确命令他下埃及
  rationale: 原文只明说借异象辨明去留，并未在本节明说命令的发出者或内容，因此保留叙事张力。
- issue: 节期名称的确定性
  choice: 正文采用“收割节”，并保留“初熟果实”成分
  alternative: 直接规范化为某一后世固定宗教节名
  rationale: 避免把源文的描述性名称过度等同于特定宗派或后期节历术语。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。正文尽量贴近吉兹文的词义和叙事次序；对艰涩句法以脚注说明，不在正文中强行消除歧义。
