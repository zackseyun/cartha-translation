  text: 'And the sons of Asher: Imnah, Ishvah, Beriah, and Serah, their sister—four. All the persons were sixteen, and all the persons of Leah were forty-nine.'
translation:
  language: zh_hans
  text: 亚设的儿女是音拿、亦施瓦、比利亚和他们的妹妹西拉，共五人。[a] 总人数为十六人；利亚一系的人数共四十九人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文列出音拿、亦施瓦、比利亚和西拉四个名字，随后却记为“五人”；译文保留原文的数目。有些文本将“亦施瓦”读作“亦施威”。
    reason: 保留传本文字中名单数目与所记总数之间的张力，并记录人名异读，避免无说明地校正原文。
lexical_decisions:
- source_word: ውሉደ፡ አሴር
  choice: 亚设的儿女
  rationale: 名单包括儿子和妹妹西拉，译作“儿女”比单译“儿子”更符合本句实际所列成员，同时保留家族名单的表达。
- source_word: ነፍስ
  choice: 人
  rationale: 此处用于家族人口统计；现代汉语以“人”表达最自然，也不把闪语式“灵魂”误解为纯属灵概念。
- source_word: ኵሉ፡ ዘልያ
  choice: 属利亚的共有
  rationale: 原文直义近于“利亚所有的”，指利亚这一支的人数；这样既自然，又不额外限定为直系后裔。
theological_decisions:
- issue: 家族人数统计中的“灵魂/人”
  choice: 人
  alternative: 灵魂
  rationale: 上下文是迁往埃及的家族人口清点，并无意建立灵魂论意义；译为“人”避免不必要的神学化。
translation_notes:
  register: 采用现代、庄重而清楚的家谱文体。人名依常见圣经汉语形式处理；数量句保持简洁，并以脚注说明原文名单与数字不一致之处。
