- source_word: ፈደ፡ ውስተ፡ ግብጽ
  choice: 下到埃及去
  rationale: 保留前往埃及常用的地理—叙事表达“下到”，并采用通行地名译法。
theological_decisions:
- issue: 雅各惧怕与伯特利之梦之间的关系
  choice: 用“就”连接回想与惧怕，但不说明梦的具体内容或惧怕的神学原因
  alternative: 译作“并且害怕”，弱化两件事之间可能存在的承接关系
  rationale: 原文以连续连接词叙述雅各想起梦、惧怕并面对下埃及之事；译文保留自然的叙事承接，同时避免把因果关系解释得过于确定。
