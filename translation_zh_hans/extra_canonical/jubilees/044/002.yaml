lexical_decisions:
- source_word: ተዘከረ
  choice: 想起了
  rationale: 准确表达“记起、回想起”，符合现代汉语叙事习惯。
- source_word: ሕልመ፡ ዘርእየ
  choice: 他……所见的梦
  rationale: 保留原文“看见梦”的表达结构，同时用自然、庄重的现代汉语呈现。
- source_word: በቤቴል
  choice: 在伯特利
