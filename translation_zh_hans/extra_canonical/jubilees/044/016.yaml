  language: zh_hans
  text: 利亚的婢女悉帕给雅各所生的儿子是迦得和亚设。他们随雅各进入埃及；以下是他们儿子的名字：迦得的儿子是洗非芸、哈基、书尼、以斯本、以利、亚罗底和亚利利[a]，共七人。
  philosophy: optimal-equivalence
