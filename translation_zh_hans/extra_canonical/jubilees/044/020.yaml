  text: 'And the sons of Benjamin: Bela, Becher, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim, and Ard—ten.'
translation:
  language: zh_hans
  text: 便雅悯的儿子是比拉、比结、亚实别、基拉、乃缦、以希、罗实、母平、户平和亚勒，共十一人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“十一人”，但这里列出的名字只有十个；有些译本据名单作“十人”。
    reason: 说明吉兹文本中的名单数目与汇总数字不一致，同时保留原文读法。
lexical_decisions:
- source_word: ወውሉደ፡ ብንያም
  choice: 便雅悯的儿子
  rationale: 按原文直译，并采用现代中文圣经中通行的人名形式。
- source_word: ባላ፡ ወበኮር፡ ወአስቤል፡ ጌራ፡ ወንእማን፡ ወኤሒ፡ ወሮስ፡ ወሙጲም፡ ወሑጲም፡ ወአርድ
  choice: 比拉、比结、亚实别、基拉、乃缦、以希、罗实、母平、户平和亚勒
  rationale: 依据吉兹文逐一音译，并尽量采用《创世记》46:21相关人名的现代中文惯用译法。
- source_word: ዐሠርቱ፡ ወአሐዱ
  choice: 共十一人
  rationale: 该短语字面为“十和一”，即十一；尽管前列姓名实际只有十个，正文仍保留原文数字，并以脚注说明抄本文本内部的不一致。
theological_decisions:
- issue: 名单人数与总数不一致
  choice: 正文译作“共十一人”，并加注说明名单只列十个名字
  alternative: 依名单及英文咨询层改作“共十人”
  rationale: 数字差异属于文本传承问题，不涉及应由译者静默解决的神学判断；以吉兹文原始证据为先，并明确保留其张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语；句式简洁，适合家谱名单。人名依相关圣经传统译名统一处理，不对原文数字矛盾作未经说明的校正。
