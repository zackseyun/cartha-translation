  yaml_path: translation/extra_canonical/jubilees/044/004.yaml
  text: And on the sixteenth the Lord appeared to him and said to him, “Jacob, Jacob.” And he said, “Here I am.”
translation:
  language: zh_hans
  text: 十六日，主向他显现，对他说：“雅各！雅各！”他说：“我在这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ዐሡሩ፡ ወስዱሱ
  choice: 十六日
  rationale: 原文直指“第十六（日）”；承接本章历日叙事，中文简洁译作“十六日”。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 该词是吉兹语中对上帝的常用称号；依原文称号译为“主”，不擅自改作其他神名。
- source_word: አስተርአዮ
  choice: 向他显现
  rationale: 保留神向雅各显现的主动性及原文第三人称受事关系。
- source_word: ያዕቆብ፡ ያዕቆብ
  choice: 雅各！雅各！
  rationale: 保留重复呼名，并用感叹号自然呈现直接呼唤。
- source_word: ነየ፡ አነ
  choice: 我在这里
  rationale: 这是回应呼召的惯用表达，比字面组合更符合现代汉语，同时保留“我已在此”的含义。
theological_decisions:
- issue: 显现者的称谓
  choice: 主
  alternative: 上帝／耶和华
  rationale: 吉兹原文此处使用称号እግዚአብሔር；译作“主”最直接，也不将称号进一步具体化，从而避免加入原文未明说的辨识。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话；保留简短对话、重复呼名及叙事节奏。
