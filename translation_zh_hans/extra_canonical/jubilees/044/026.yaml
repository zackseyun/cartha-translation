  text: 'Eleven. And all the persons of Rachel were fourteen. And the sons of Bilhah, her maidservant:'
translation:
  language: zh_hans
  text: 十一人。拉结家的人共十四人。拉结的婢女辟拉所生的儿子是：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句引出下一节所列的人名。旧译作“辟拉的儿子死了”，但吉兹文 ላእከታ 意为“她的婢女”，不是“死了”。
    reason: 说明原文语义及旧译误读，并帮助读者理解句末冒号所表示的家谱承接关系。
lexical_decisions:
- source_word: ዐሠርቱ፡ ወአሐዱ
  choice: 十一人
  rationale: 直译为“十和一”，承接前文的人数统计；中文补出量词“人”，使片段自然清楚。
- source_word: ኵሉ፡ ነፍስ፡ ዘራሔል
  choice: 拉结家的人共
  rationale: ነፍስ 在家谱计数中指“人、人口”；所属结构可自然表达为“拉结家的人”，而非抽象的“灵魂”。
- source_word: ዐሠርቱ፡ ወአርባዕቱ
  choice: 十四人
  rationale: 按吉兹文数词“十和四”译为十四，并补出中文量词。
- source_word: ወውሉደ፡ ባላ፡ ላእከታ
  choice: 拉结的婢女辟拉所生的儿子是
  rationale: ውሉደ 指“儿子/所生者”，ባላ 为辟拉，ላእከታ 是“她的婢女”；结合后续名单，这是引介语而非“死了”。补明“拉结的”以交代第三人称阴性后缀的指代。
