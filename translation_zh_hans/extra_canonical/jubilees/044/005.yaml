base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/005.yaml
  text: And he said to him, “I am the God of your fathers, the God of Abraham and Isaac. Do not fear; go down into Egypt, for there I will make you into a great nation.”
translation:
  language: zh_hans
  text: 他对他说：“我是你父亲的上帝，也是亚伯拉罕和以撒的上帝。不要害怕；下到埃及去，因为我必在那里使你成为一个大国。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ አቡከ
  choice: 你父亲的上帝
  rationale: 所给吉兹语文本作单数“你父亲”（አቡከ），因此正文依直接源文译为单数；同时以脚注保留审校层所反映的复数异文。
- source_word: ኢትፍራህ
  choice: 不要害怕
  rationale: 准确传达否定命令，符合现代汉语庄重而自然的表达。
- source_word: ወሪደ፡ ግብጽ
  choice: 下到埃及去
  rationale: 保留源文“下去”的空间意象，也与相关创世记叙事的传统地理表达一致。
- source_word: ውስተ፡ ዐቢይ፡ ሕዝብ፡ እሬስየከ
  choice: 使你成为一个大国
  rationale: 按语义自然表达“把你造成大民族/大国”；“国”在族群形成的语境中简明而庄重。
theological_decisions:
- issue: “你父亲”应作单数还是复数
  choice: 正文采用单数“你父亲”，并加异文脚注
  alternative: 正文作“你列祖”，脚注“或作你父亲”
  rationale: 当前提供的吉兹语直接证据为አቡከ（单数“你的父亲”），故不应仅依英语审校层改成复数；但英语POB及修订记录明确保存复数读法，故以脚注呈现，避免掩盖文本差异。
- issue: “大国”的含义
  choice: 不扩展解释为特定政治国家或教会群体
  alternative: 译作“大民族”或加入神学解释
  rationale: 源文只陈述将雅各造成“大民/大国”，应保留其族群与国家概念之间的张力，不引入宗派性阐释。
