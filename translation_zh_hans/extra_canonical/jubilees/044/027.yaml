  yaml_path: translation/extra_canonical/jubilees/044/027.yaml
  text: And all the persons of Jacob who entered Egypt were seventy persons. These are his sons and the sons of his sons[27], all of them seventy-five.
translation:
  language: zh_hans
  text: 雅各家进入埃及的共有七十人；这些是他的儿子和儿子的儿子，共七十五人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章的计数方式并不直观：这里先说进入埃及的有七十人，随后又说儿子和儿子的儿子共七十五人；下文还说明其中五人死在埃及，而约瑟和他的两个儿子不列入那项死亡人数。
    reason: 说明本章内部的计数线索，同时保留正文中七十与七十五的张力。
lexical_decisions:
- source_word: ኵሉ፡ መንፈስ
  choice: 凡……的（人）
  rationale: 字面为“所有灵魂/生命”，在家族人口统计语境中自然表达为“凡……的人”，避免现代汉语误解为非物质的“灵魂”。
- source_word: ዘቦአ፡ ውስተ፡ ግብጽ
  choice: 随雅各进入埃及的
  rationale: 保留“进入埃及”的动作，并以“随雅各”明确关系，使汉语流畅。
- source_word: ውሉዱ፡ ወውሉደ፡ ውሉዱ
  choice: 他的儿子和孙子
  rationale: 原文直译为“他的儿子和他儿子的儿子”；“儿子和孙子”准确且符合现代汉语。
- source_word: ሰብዓ / ሰብዓ፡ ወኃምስቱ
  choice: 七十人 / 七十五人
  rationale: 照录原文相邻的两个总数，不擅自调和其表面张力。
theological_decisions:
- issue: 七十与七十五两个总数之间的表面差异
  choice: 正文同时保留“七十人”和“七十五人”，并加注说明本章后文的计数线索
  alternative: 将其中一个数字改成另一个，或在正文中补入解释以消除差异
