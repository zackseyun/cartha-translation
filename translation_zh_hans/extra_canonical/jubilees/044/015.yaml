base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/015.yaml
  text: 'These are the sons of Jacob and their sons, whom Leah bore to Jacob in Mesopotamia: six, and Dinah their sister, one. And all the persons of Leah’s sons and their sons who came with Jacob their father into Egypt were thirty-three; and with Jacob their father among them, they were thirty-four.'
translation:
  language: zh_hans
  text: 这些是雅各的儿子和他们的儿子，是利亚在美索不达米亚给雅各生的：六个儿子和他们的妹妹底拿。利亚的儿子和他们的儿子中，随父亲雅各进入埃及的，共三十三人；连同他们的父亲雅各，共三十四人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ያዕቆብ፡ ወውሉዶሙ
  choice: 雅各的儿子和他们的儿子
  rationale: 依原文保留两代人的并列表述；不用“后代”概括，以免抹去家谱结构。
- source_word: መስጴጦምያ
  choice: 美索不达米亚
  rationale: 采用现代汉语通行地名，准确对应原文地名。
- source_word: ነፍስ
  choice: 人
  rationale: 此处用于家族人数统计，译作“人”自然清楚，同时不赋予该词在此处并无必要的灵魂论含义。
- source_word: ቦኡ፡ ምስለ፡ ያዕቆብ፡ አቡሆሙ፡ ውስተ፡ ግብፅ
  choice: 随父亲雅各进入埃及
  rationale: 忠实表达同行、进入埃及及雅各作为其父亲三层信息。
theological_decisions:
- issue: 家族人数统计中“灵魂／人”的表达
  choice: 按人数语境译作“人”
  alternative: 直译作“灵魂”或“性命”
  rationale: 原文ነፍስ在这里是闪语式的人数计量用法；译作“人”避免引入身心二分等并非本节重点的神学含义。
- issue: 三十三人与三十四人的计数关系
  choice: 保留原文先列三十三人、再加雅各为三十四人的表述
  alternative: 按其他家谱传统或抄本重新协调人数
