  text: 'And sons were born to Joseph in Egypt before his father came into Egypt, whom Asenath, the daughter of Potiphar, priest of Heliopolis, bore to him: Manasseh and Ephraim—two.'
translation:
  language: zh_hans
  text: 在他父亲来到埃及以前，亚西纳——赫利奥波利斯祭司波提非拉的女儿——在埃及给约瑟生了两个儿子：玛拿西和以法莲，共二人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስኔት
  choice: 亚西纳
  rationale: 采用该人物在现代中文圣经传统中较常见的译名，同时对应源文 Asnet/Asenath。
- source_word: ጶጢፋራ
  choice: 波提非拉
  rationale: 按源文 Potiphara 音译，并与“波提乏”这一相近人名有所区分。
- source_word: ካህን
  choice: 祭司
  rationale: 准确表达源文所指的宗教职分，不额外解释其具体祭司体系。
- source_word: ኤልዮጶሊስ
  choice: 赫利奥波利斯
  rationale: 按源文所保存的希腊式地名音译，避免擅自改用带解释性质的别称。
- source_word: ተወልዱ፡ ለዮሴፍ
  choice: 约瑟……得了两个儿子
  rationale: 源文直义为“有儿子为约瑟出生”；中文用“得了两个儿子”自然表达，同时保留随后对生母的说明。
- source_word: ፪
  choice: 共两人
  rationale: 保留家谱记载末尾明确列出的总数。
