  yaml_path: translation/extra_canonical/jubilees/044/006.yaml
  text: I will go down with you, and I will surely bring you up again. And in this land you will be buried, and Joseph will place his hands on your eyes. Do not fear; go down into Egypt.”
translation:
  language: zh_hans
  text: “我必与你一同下去，也必把你带上来。你将葬在这片土地上；约瑟必把双手[a]放在你的眼睛上。不要害怕，下到埃及去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些相关文本传统作“手”；本节吉兹语原文作复数“手”。
    reason: 说明本节复数形式与其他文本传统中单数形式的差异，并交代“雙手”的原文依据。
lexical_decisions:
- source_word: እወርድ፡ ምስሌከ
  choice: 我必与你一同下去
  rationale: 按原文保留“下去”的空间意象及上帝同行的应许。
- source_word: አወጽአከ
  choice: 把你带上来
  rationale: 该动词本义为“使出来、领出来”；结合与“下去”的对应关系，译作“带上来”，同时不明确限定这是本人归返还是后裔出埃及，以保留原文张力。
- source_word: ትትቀበር
  choice: 你将葬在
  rationale: 采用自然的现代汉语被动表达，忠实传达原文“被安葬”。
- source_word: እዴሁ
  choice: 双手
  rationale: 所给吉兹语文本采用复数形式，与《七十士译本》创世记46:4的复数相符。
- source_word: አዕይንቲከ
  choice: 你的眼睛
  rationale: 直译复数名词；此处指约瑟在雅各死时为他合眼。
theological_decisions:
- issue: “把你带上来”的所指
  choice: 保留第二人称单数，不增译为“把你的后裔带上来”或明确解释为遗体归葬
  alternative: 译作“我也必领你的后裔出来”或“我必使你的遗体归回”
  rationale: 原文直接对雅各说“把你带上来”，其应许可同时牵涉个人归葬与后裔出埃及；正文不替读者消解这一张力。
- issue: 约瑟把手放在雅各眼睛上的含义
  choice: 保留具体身体动作，不在正文解释为“为你合眼”
