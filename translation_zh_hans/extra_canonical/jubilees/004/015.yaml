base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/015.yaml
  text: And he was still with the angels of God for six jubilees of years, and they showed him everything that is on earth and in the heavens, the rule of the sun, and he wrote down everything.
translation:
  language: zh_hans
  text: 他仍与上帝的天使同在，历时六个禧年[a]。天使把地上和诸天中的一切，以及太阳的权能，都指给他看；他把这一切都写了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禧年”是四十九年，即七个七年；六个禧年共二百九十四年。
    reason: 普通读者未必熟悉《禧年书》的历法单位；说明换算有助于理解此处所述时长。
lexical_decisions:
- source_word: መላእክት፡ አምላክ
  choice: 上帝的天使
  rationale: 按词义直译，保留所属关系，不把“天使”扩释为其他超自然群体。
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: 历时六个禧年
  rationale: 该短语表示六个禧年周期的持续时间；加入“历时”使现代汉语自然，同时保留本书特有的历法单位。
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: 太阳的权能
  rationale: ሥልጣን可指权柄、统辖或支配力；“权能”保留其拟人化或宇宙秩序层面的含混，不直接改释为“运行规律”。
- source_word: ወጸሐፈ፡ ኵሎ
  choice: 他便把这一切全都写了下来
  rationale: 明确主语承接以诺，并以自然汉语表达“写下全部”的完成性。
theological_decisions:
- issue: 以诺与天使同在的性质
  choice: 译作“与上帝的天使同在”
  alternative: “住在上帝的天使中间”或“陪伴上帝的天使”
  rationale: 原文只陈述同在，没有说明居住地点、身份改变或从属关系，因此不作神学扩释。
- issue: 太阳的“权能”所指
  choice: 正文保留“权能”
  alternative: “太阳的运行规律”或“太阳的统辖”
  rationale: 上下文虽涉及天文知识，但原词本身具有权柄、支配力等语义；保留张力，避免把古代宇宙论语言完全现代科学化。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“此后”承接叙事，“指给他看”贴近启示场景；分号保持原句各动作之间的紧密联系。
