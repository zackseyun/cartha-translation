  yaml_path: translation/extra_canonical/jubilees/004/020.yaml
  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Daniel, the daughter of his father's sister; and in the sixth year of this week she bore him a son, and he called his name
translation:
  language: zh_hans
  text: 在第十二个禧年的第七个七年期，他为自己娶了妻子，名叫伊德尼，是但以理的女儿，即他父亲的姐妹之女；在这个七年期的第六年，她为他生了一个儿子，他给他起名为——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有引文到“他给他起名为”即告中断，儿子的名字未包含在本节所提供的原文中。
    reason: 说明句末不完整源于所提供的格厄兹语引文，避免擅自从后文补入名字。
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: 禧年
  rationale: 按《禧年书》的纪年术语译为“禧年”，指由七个七年期组成的周期。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在本书纪年语境中指一个由七年组成的周期；译为“七年期”比单译“七”更清楚。
- source_word: እድኒ
  choice: 伊德尼
  rationale: 按格厄兹语人名作音译，不根据后世传统改写其形式。
- source_word: ዳንኤል
  choice: 但以理
  rationale: 采用中文读者熟悉的圣经人名传统译法。
- source_word: ወለተ፡ እኅተ፡ አቡሁ
  choice: 他父亲姐妹的女儿
  rationale: 直译亲属关系，保留原文所表达的父系姑表亲身份；“姐妹”不强行判定长幼。
- source_word: ወጸውዐ፡ ስሞ
  choice: 他给他起名叫
  rationale: 自然表达“称他的名／给他命名”，并保留现存引文在名字出现前中断的状态。
