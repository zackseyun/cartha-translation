base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/018.yaml
  text: And at the end of the nineteenth jubilee, in the seventh week, in its sixth year, Adam died, and all his sons buried him in the land of his creation; and he was the first to be buried in the earth.
translation:
  language: zh_hans
  text: 他是第一个写下见证、并向地上历代世人作见证的人；他叙述禧年的各个七年期，说明年的日子，并排定月份。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዐ፡ ወአስምዐ
  choice: 写下见证……作见证
  rationale: 保留“见证”这一核心词义及书写、宣告两方面的动作，避免弱化为一般的“记录”或“教导”。
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: 禧年的各个七年期
  rationale: “ሱባዔ”指七个一组的周期；在《禧年书》的年代体系中，此处宜明确为七年期，同时不把它误译成单纯的“周”。
- source_word: መዋዕለ፡ ዓመታት
  choice: 各年的日数
  rationale: 贴近“年之日”的表达，指明各年所含或所计的日子，不扩展为更宽泛的“年代”。
- source_word: አውራኅ፡ ሰርዐ
  choice: 排定月份
  rationale: 保留“月份”与“安排、定序”的含义，符合本节历法语境。
- source_word: ውስተ፡ ትዝምደ፡ ምድር
  choice: 向地上历代的世人
  rationale: 自然表达“在地上的世代中”，并保留见证面向历代人类的含义。
theological_decisions:
- issue: “见证”的性质
  choice: 不说明见证的具体内容或神学功能
  alternative: 译作“写下启示”或“传授律法”
  rationale: 原文在此只称其为“见证”，没有明确等同于启示或律法；保留原有开放性。
- issue: 禧年与七年期的关系
  choice: 译为“禧年的各个七年期”
  alternative: 译为“禧年的七周”或直接换算成年数
  rationale: 既呈现原文的周期结构，又不进一步解决其历法计算方式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“禧年”为本书惯用历法术语；“七年期”比“周”更易使普通读者理解其年代含义。开头以省略号标明所给源文并非完整句首，正文脚注标记与脚注相对应。
