base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/022.yaml
  text: And he testified to the Watchers, who had sinned with the daughters of men; for these had begun to unite themselves, so as to be defiled, with the daughters of men, and Enoch testified against them all.
translation:
  language: zh_hans
  text: 他向那些与世人的女子犯了罪的守望者作证；因为他们开始与世人的女子结合，以致受玷污。以诺指证他们所有人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰትጉሃን
  choice: 守望者
  rationale: 该词指《禧年书》传统中的天上守望者；“守望者”既保留专名性质，也与相关古代文献的通行译法一致。
- source_word: አበሱ
  choice: 犯罪
  rationale: 按其基本伦理和宗教含义译为“犯罪”，不将罪的性质作超出上下文的限定。
- source_word: አዋልደ ሰብእ
  choice: 世人的女子
  rationale: 直译为“人的女儿们”略显生硬；“世人的女子”自然表达其群体意义，并保留与天上守望者的对照。
- source_word: ይደመሩ
  choice: 结合
  rationale: 该动词表示联合、相合；“结合”保留关系性质，而不擅自限定为婚姻或单纯性交。
- source_word: ይርኩሱ
  choice: 玷污自己
  rationale: 该形式表达成为不洁或使自身受污；译文保留礼仪与道德层面的张力。
- source_word: አስምዐ
  choice: 指证
  rationale: 此处语境是以诺针对守望者作见证；“指证”比一般的“作见证”更自然地传达不利证言，同时不增添审判结果。
theological_decisions:
- issue: 守望者与世人的女子所犯之罪的具体性质
  choice: 译作“结合，以致玷污自己”
  alternative: 译作“同房而受玷污”或“娶她们为妻”
  rationale: 源文明确表达联合和玷污，却未在本节中明确限定为婚姻或使用露骨的性行为措辞，因此保留其范围和神学张力。
- issue: 以诺证言的司法色彩
  choice: 译作“指证”
  alternative: 译作“作证反对”或“谴责”
  rationale: “指证”兼有证言与针对性，符合上下文；“谴责”会把证言进一步解释为判决或道德宣告。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“守望者”作为古代文献中的群体称谓保留；全节用分号和句号呈现源文先述罪行、后重申以诺指证众人的结构。
