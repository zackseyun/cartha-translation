  source_fidelity: 译文整体对应本节：守望者与世人女子犯罪、开始结合而受玷污，以及以诺针对他们全体作证，均已涵盖。但开头“又指证”将源文较中性的“向……作证／见证”预先强化为不利指控，并添加了“又”；“已经开始”也比源文的“开始”多出完成或既成意味。
