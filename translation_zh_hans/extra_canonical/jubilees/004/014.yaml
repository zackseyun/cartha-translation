  choice: 禧年
  rationale: 保留本书以四十九年为一个“禧年”的专门纪年单位。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在本段指禧年内由七年构成的周期；译作“七年期”比单独译“周”更清楚。
- source_word: እድኒ
  choice: 伊得尼
  rationale: 按吉兹语人名音译，并与英语咨询层 Edni 对应。
- source_word: ዳንኤል
  choice: 但以理
  rationale: 采用该闪族人名在简体中文圣经传统中的通行形式。
- source_word: ማቱሳላ
  choice: 玛土撒拉
  rationale: 采用该人物在简体中文圣经传统中的通行译名。
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: 娶了一个妻子
  rationale: 自然表达“为自己取妻”，不机械保留源语中的反身受益结构。
theological_decisions:
- issue: 伊得尼与以诺的亲属关系
  choice: 正文较直地呈现“她是但以理的女儿，又被称为他父亲姐妹的女儿”，并加注说明文本疑难
  alternative: 按英语咨询层直接译作“他伯父（或叔父）的女儿”
  rationale: 现提供的吉兹文本含“父亲的姐妹”而不是“父亲的兄弟”，且整个同位结构语法不顺；不应无说明地采用已消除歧义的亲属关系。
