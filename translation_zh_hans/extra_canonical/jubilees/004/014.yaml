  naturalness: “在第十二个禧年，也就是其中的第七个七年期”略显解释性且不够简洁；“在第十二个禧年的第七个七年期”更自然。亲属链若直译为“她是但以理的女儿，又被称为他父亲姐妹的女儿”既指代不清，也不合现代汉语表达。
  terminology: “禧年”“七年期”“以诺”“但以理”“玛土撒拉”均恰当。“伊得尼”可保留，且与英语 Edni 对应。
  issues:
