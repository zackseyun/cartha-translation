  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Danel, his father’s brother’s daughter; and in the sixth year of this week she bore him a son, and he called his name Methuselah.
translation:
  language: zh_hans
  text: 在第十二个禧年的第七个七年期，以诺娶了一个妻子，名叫伊得尼；她是但以理的女儿，而但以理是他父亲的姐妹的女儿[a]。在这个七年期的第六年，她给他生了一个儿子，他给儿子取名叫玛土撒拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处吉兹文本的亲属链按字面是“但以理……他父亲的姐妹的女儿”，通常理解为以诺父亲的姐妹之女；英语审校轨迹作“他父亲兄弟的女儿”。由于两者不一致，正文依吉兹文本保留其表述。
    reason: 澄清“他”的指代及亲属关系链，并记录源文与英语审校轨迹的差异，避免将争议性谱系关系擅自确定为另一种关系。
