    issue: “又被称为他父亲姐妹的女儿”误将亲属同位结构处理成别称。
    rationale: 源文的“女儿……父亲的姐妹的女儿”构成谱系说明，不表示伊得尼另有一个称谓。应明确但以理与以诺父亲的亲属关系。
