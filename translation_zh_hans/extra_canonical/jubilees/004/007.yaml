    该隐娶了自己的妹妹阿万为妻；第四个禧年结束时，她为他生了以诺。第五个禧年第一个七年期的第一年，地上开始建造房屋；该隐建了一座城，照着儿子以诺的名字给城命名。亚当与妻子夏娃同房，她又生了九个儿子。


    第五个禧年的第五个七年期，塞特娶了自己的妹妹阿苏拉为妻；第四年，她为他生了以挪士。他是地上第一个呼求主名的人。


