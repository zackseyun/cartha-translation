  text: that are committed in heaven and on earth, and in light and in darkness, and in every place. And Adam and his wife mourned for Abel four weeks[7] of years. And in the fourth year of the fifth week they became joyful, and Adam again knew his wife, and she bore him a son, and he called his name Seth; for he said, “the Lord has raised up for me another seed on the earth in place of Abel, because Cain killed him.” And in the sixth week he fathered his daughter Azura. And Cain took Awan his sister as a wife, and she bore him Enoch at the end of the fourth jubilee. And in the first year of the first week of the fifth jubilee, houses were built on the earth, and Cain built a city and named it after his son Enoch. And Adam knew Eve his wife, and she bore nine more sons. And in the fifth week of the fifth jubilee Seth took Azura his sister as a wife, and in the fourth year she bore him Enos. He was the first to call on the name of the Lord on the earth. And in the seventh jubilee, in the
    third week, Enos took Noam his sister as a wife, and she bore him a son in the third year of the fifth week, and he called his name Kenan. And at the end of the eighth jubilee Kenan took Mualeleth his sister as a wife, and she bore him a son in the ninth jubilee, in the first week, in the third year of that week, and they called his name Mahalalel. And in the second week of the tenth jubilee Mahalalel took Dinah, the daughter of Barakiel, his father's brother's daughter, as a wife, and she bore him a son in the third week, in its sixth year, and they called his name Jared. For in his days the angels of the Lord descended to the earth, those who are called the Watchers, so that they might instruct the children of men,
translation:
  language: zh_hans
  text: '就是在天上、地上、光明中、黑暗中和各处所犯的事。亚当和妻子为亚伯哀悼了四个七年期[a]。第五个七年期的第四年，他们转悲为喜；亚当再次与妻子同房，她为他生了一个儿子。亚当给他取名叫塞特，因为他说：“主在地上为我另立了一个后裔，代替亚伯，因为该隐杀了他。”第六个七年期，亚当生了女儿阿苏拉。


    该隐娶了自己的妹妹阿万为妻；第四个禧年结束时，她为他生了以诺。第五个禧年第一个七年期的第一年，地上建造了房屋；该隐建了一座城，照着儿子以诺的名字给城命名。亚当与妻子夏娃同房，她又生了九个儿子。


    第五个禧年的第五个七年期，塞特娶了自己的妹妹阿苏拉为妻；第四年，她为他生了以挪士。他是地上第一个呼求主名的人。


    第七个禧年的第三个七年期，以挪士娶了自己的妹妹挪安为妻；第七个禧年的第五个七年期第三年，她为他生了一个儿子，他给孩子取名叫该南。第八个禧年结束时，该南娶了自己的妹妹穆阿勒勒特为妻；第九个禧年第一个七年期的第三年，她为他生了一个儿子，他们给孩子取名叫玛勒列。


    第十个禧年的第二个七年期，玛勒列娶了迪拿为妻；迪拿是巴拉基勒的女儿，巴拉基勒是玛勒列父亲的兄弟。第三个七年期的第六年，她为他生了一个儿子，他们给孩子取名叫雅列；因为在他的日子，主的天使降到地上，就是那些被称为“守望者”的，为要教导世人，


    [a] 本节及本章的“七年期”对应《禧年书》的纪年单位，即由七年组成的一期；“禧年”则保留为四十九年的纪年单位。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节及本章的“七年期”对应《禧年书》的纪年单位，即由七年组成的一期；“禧年”则保留为四十九年的纪年单位。
    reason: 解释本书特有的纪年体系，并避免现代读者将“周”误解为七天。
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 此处在《禧年书》的纪年体系中指七年构成的一期。译作“七年期”比单译“周”更能让现代读者直接理解，同时保留与“禧年”的区别。
- source_word: ኢዮቤልው
  choice: 禧年
  rationale: 采用中文宗教及古代纪年语境中通行的“禧年”，这里具体指七个七年期，即四十九年。
- source_word: አእመራ
  choice: 与……同房
  rationale: 字面为“认识”，在此是夫妻性关系的委婉说法；译作“同房”自然清楚，并保留叙事的庄重语体。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 该词是“主”的称号，并非在此直接呈现神名，故不译作带有特定神名含义的形式。
- source_word: ትጉሃነ
  choice: 守望者
  rationale: 这是相关第二圣殿时期文献中一类天使的称号；“守望者”既保留专名性质，也反映其词义。
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: 世人
  rationale: 字面相当于“人类的儿女”，汉语以“世人”表达更自然，也不额外限定性别或年龄。
theological_decisions:
- issue: 塞特之名相关话语的发言者
  choice: 保留“他说”所指为亚当
  alternative: 依《创世记》3:25的平行叙事改作夏娃说
  rationale: 吉兹文本明确使用阳性“他说”，应按本书现存文本翻译，不以平行经文校正。
- issue: 以挪士首先呼求主名
  choice: 译作“第一个呼求主名的人”
  alternative: 译作“开始称呼主的名”或“开始宣告主名”
  rationale: 源文表达“他首先呼求主的名”，保留“呼求”可涵盖敬拜、祈求或公开称颂等可能含义，不替文本作过度判定。
- issue: 守望者下降的初始目的
  choice: 译作“为要教导世人”
  alternative: 按其后来堕落的叙事预先译为带负面目的的“诱导世人”
  rationale: 本句明确陈述其下降是为了教导，不应从后续传统倒推并改写这里的动机。
- issue: 该隐、塞特等娶妹妹为妻
  choice: 直译亲属关系，不作伦理解释
  alternative: 弱化为“娶阿万/阿苏拉为妻”
  rationale: 亲属称谓是源文叙事的重要内容，译文应保留，同时不添加辩护或谴责。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。年代公式尽量依照吉兹文本顺序，同时以“七年期”明确其时间长度。人名采用现代中文圣经传统中已有的常见形式；本书特有人名则按音译处理。开头和结尾都明显承接相邻经节，因此保留不完整句式，不擅自补出源文未提供的宾语或后续内容。
