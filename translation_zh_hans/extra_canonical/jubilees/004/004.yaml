  yaml_path: translation/extra_canonical/jubilees/004/004.yaml
  text: And therefore the Lord rebuked Cain because of Abel[4], because he had killed him; and he made him a fugitive on the earth because of the blood of his brother, and he cursed him on the earth.
translation:
  language: zh_hans
  text: 因此，主因亚伯的缘故[a]责备该隐，因为该隐杀了他；主又因他兄弟的血，使他在地上流离，并在地上咒诅他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节在现有底本文本中没有作为独立编号的一行完整保存；其内容由开头的重复语句与第5节开头的续文共同构成。这里按紧接的吉兹语上下文复原句意，未作扩写。
    reason: segmentation_note
lexical_decisions:
- source_word: እግዚአብሔር (ʾEgziʾabḥer)
  choice: 主
  rationale: 该词在吉兹语文本中是通常的“主”之称，并未以正字法标示希伯来语四字神名，故不译作带特殊排印含义的“耶和华”。
- source_word: ዘለፎ (zalafa)
  choice: 责备
  rationale: 表达斥责、谴责之意；“责备”既贴近语义，也符合现代汉语经文体。
- source_word: በእንተ አቤል (baʾenta ʾAbel)
  choice: 因亚伯的缘故
  rationale: 保留介词短语较宽泛的因由关系，不将其具体化为“为亚伯伸冤”等解释。
- source_word: ደመ እኁሁ (dama ʾəḫuhu)
  choice: 他兄弟的血
  rationale: 依原文保留“血”的单数、具象表达，并延续该隐与亚伯叙事中的亲属关系。
- source_word: ረገሞ (ragamō)
  choice: 咒诅他
  rationale: 原词表示施加咒诅，直译可保留叙事中的审判力度。
theological_decisions:
- issue: 主责备该隐的原因
  choice: 因亚伯的缘故
  alternative: 为亚伯伸冤
  rationale: 原文只明说“因为／关于亚伯”，不应加入“伸冤”这一神学解释。
- issue: 神名的译法
  choice: 主
  alternative: 耶和华
  rationale: 依据现存吉兹语形式翻译；该词没有提供足够证据支持使用专门对应希伯来四字神名的译称。
- issue: 该隐在地上的处境
  choice: 使他在地上流离
  alternative: 使他成为地上的逃亡者
  rationale: 上下文所传达的是无定所、漂泊的惩罚；“流离”自然凝练，同时不额外规定其法律身份。
translation_notes:
  register: 采用现代、庄重而通顺的普通话；以“主”称呼上帝，以“流离”表达该隐受罚后在地上的漂泊处境。脚注说明底本的分节与行文断裂。
