base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/013.yaml
  text: And in the eleventh jubilee, Jared took for himself a wife whose name was Baraka, the daughter of Rasuyal,[a] a daughter of his father's brother, in the fourth week of this jubilee. And she bore him a son in the fifth week, in the fourth year of the jubilee, and he called his name Enoch.
translation:
  language: zh_hans
  text: 在第十一个禧年，雅列为自己娶了一个妻子，名叫巴拉卡，是拉苏亚勒[a]的女儿，即雅列父亲的兄弟之女；那是在这个禧年的第四周。她在第五周、这个禧年的第四年，为他生了一个儿子；他给儿子起名叫以诺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉苏亚勒”（ራሱያል）在一些较早的版本中转写为“拉苏贾勒”（Rasujal）。
    reason: 说明人名转写异体；正文按吉兹字母直接音译，避免旧式转写以 j 表示 y 音。
lexical_decisions:
- source_word: ያሬድ
  choice: 雅列
  rationale: 采用现代中文圣经传统中 Jared 的通行译名，便于读者识别人物。
- source_word: ባረካ
  choice: 巴拉卡
  rationale: 按吉兹语人名音译，保留原名形式。
- source_word: ራሱያል
  choice: 拉苏亚勒
  rationale: 依吉兹文字直接音译，保留其中的 y 音及词尾，不采用旧版受欧洲拼写影响的 Rasujal 形式。
- source_word: ወለተ ፡ እኍሁ ፡ ለአቡሁ
  choice: 也就是他父亲兄弟的女儿
  rationale: 直译亲属关系，不以“堂姐妹”等现代分类替代，以免增加原文未明说的细节。
- source_word: ሄኖክሃ
  choice: 以诺
  rationale: 采用现代中文圣经传统中 Enoch 的通行译名。
- source_word: ነሥአ ፡ ያሬድ ፡ ሎቱ ፡ ብእሲተ
  choice: 雅列为自己娶了一个妻子
  rationale: 既表达“取来归自己”的字面结构，也以自然中文呈现婚娶含义。
