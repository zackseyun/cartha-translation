  text: And he killed him in the field, and his blood cried out from the ground to heaven, complaining about him.
translation:
  language: zh_hans
  text: 他在野外杀了他；他的血从地上向天呼喊，控告他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他而申诉。”
    reason: 源文末尾的动词与介词组合既可理解为针对某人控告，也可较宽泛地表示因某人而申诉。
lexical_decisions:
- source_word: በገዳም
  choice: 在野外
  rationale: ገዳም在此指野外、旷野之地；结合该叙事场景，译作“在野外”自然且准确。
- source_word: ጸርኀ
  choice: 呼喊
  rationale: 该动词表达高声喊叫；以“呼喊”保留血拟人化、向天发声的鲜明意象。
- source_word: እምድር፡ ውስተ፡ ሰማይ
  choice: 从地上向天
  rationale: 直接保留源文由地至天的方向关系。
- source_word: ይስኪ፡ በእንተ
  choice: 控告他
  rationale: 该表达可指因某人而申诉，或针对某人提出控告；此处“控告他”符合血呼喊伸冤的司法语境，同时保留脚注中的另一种理解。
theological_decisions:
- issue: 死者之血呼喊并申诉的拟人化意象
  choice: 保留“他的血……向天呼喊，控告他”
  alternative: 将其解释性地译成“他的死向上天求公义”
  rationale: 源文直接以血为主语，不应把这一神学及文学意象改写为抽象概念。
- issue: 末尾短语所指对象及语义力度
  choice: 正文译作“控告他”
  alternative: “因他而申诉”或“诉说他的罪”
  rationale: 源文介词结构存在一定语义弹性；正文采用与上下文最吻合的司法性表达，脚注保留较宽泛的申诉义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言；以分号连接杀害与血呼喊的结果，保留源文简洁、有力的节奏及拟人化表达。
