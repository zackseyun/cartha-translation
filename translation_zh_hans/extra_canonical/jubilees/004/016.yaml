  yaml_path: translation/extra_canonical/jubilees/004/016.yaml
  text: And they did justice and uprightness upon the earth. And in the tenth jubilee[16], in the first week, Jared took for himself a wife, and her name was Baraka, the daughter of Rasujal, the daughter of his father's sister, as his wife, in the fourth year of this week; and she bore him a son in the fifth week, in the fourth year.
translation:
  language: zh_hans
  text: 他们在地上秉公行义。第十个禧年第一周，这一周的第四年，雅列为自己娶了妻子，名叫巴拉加；她是拉苏雅勒的女儿，也是雅列父亲姊妹的女儿。她在第五周第四年为他生了一个儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存吉兹文作“第五周第四年”。这与前文“第十个禧年第一周第四年”的时间顺序不易协调；也可能反映文本传抄或数字保存上的问题。此处仍按现存文本翻译。
    reason: textual_variant
lexical_decisions:
- source_word: ፍትሐ፡ ወርተዐ
  choice: 秉公行义
  rationale: 分别表达“公正／审判”与“正直／正义”，并以自然庄重的现代汉语呈现二者并列关系。
- source_word: ኢዮቤልዉ
  choice: 禧年
  rationale: 采用《禧年书》年代体系的通行称呼；此处指第十个禧年周期。
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: 为自己娶了妻子
  rationale: 准确传达“为自己取一女子为妻”的婚姻用语，避免生硬重复。
- source_word: ወለተ፡ እኅተ፡ አቡሁ
  choice: 雅列父亲姊妹的女儿
  rationale: 按词面保留亲属关系，即父系姑母之女，不另行推断更具体的亲属称谓。
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: 为他生了一个儿子
  rationale: 保留原文未在本节点明儿子姓名的表达。
theological_decisions:
- issue: “公正”与“正直”的并列伦理表述
  choice: 秉公行义
  alternative: 施行公正和正直
  rationale: 保留两个伦理概念的张力，同时使中文简洁自然，不将其解释为某一特定宗派的义论。
- issue: 末句年代是否可能抄传不稳
  choice: 正文依现存吉兹文译作“第五周第四年”
  alternative: 据上下文改为“这一周第五年”
  rationale: 现存文本明确出现“第五周”和“第四年”；不凭逻辑擅改，但以脚注提示其与前文时间顺序之间的困难。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“秉公行义”保持经文语感但不过度古雅。人名按吉兹文音译；年代公式尽量清楚，并将疑难留在脚注中。
