  yaml_path: translation/extra_canonical/jubilees/004/012.yaml
  text: He was the first to write a testimony[12], and he testified to the children of men among the generations of the earth, and recounted the weeks of the jubilees, and made known the days of the years, and set in order the months,
translation:
  language: zh_hans
  text: 他是第一个写下见证[a]的人；他向世上世世代代的人作见证，述说禧年的各个七年期，指明各年的日数，并将月份依次排列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “写下见证”也可理解为“写下记录”或“写下证言”。
    reason: 原词既可强调作证，也可指作为见证保存下来的书面记录。
lexical_decisions:
- source_word: ጸሐፈ ስምዐ
  choice: 写下见证
  rationale: ጸሐፈ意为“写”，ስምዐ可指“见证、证言”或所写的“记录”；正文保留“见证”的法律与启示意味，并以脚注注明另一可能。
- source_word: አስምዐ
  choice: 作见证
  rationale: 该动词与前面的ስምዐ构成词根呼应，译作“作见证”可保留原文重复和强调。
- source_word: ውስተ ትዝምደ ምድር
  choice: 向世上世世代代的人
  rationale: 按语境表达地上人类的历代群体；用现代汉语顺畅呈现，同时不把对象限缩为某一代。
- source_word: ሱባዔሆሙ ለኢዮቤልውሳት
  choice: 禧年的各个七年期
  rationale: ሱባዔ在本书年代体系中指七年周期，不宜只译为含混的“周”。
- source_word: መዋዕለ ዓመታት
  choice: 各年的日数
  rationale: 依原文“年之日”保留历法含义，即各年所含或所计的日数。
- source_word: አውራኅ ሰርዐ
  choice: 将月份依次排列
  rationale: ሰርዐ有安排、规定次序之义；此处与历法知识相连，译文明确其编排月份的动作。
theological_decisions:
- issue: “见证”是启示性证言还是一般书面记录
  choice: 正文译为“写下见证”
  alternative: “写下记录”或“写下证言”
  rationale: 原词容许“见证/记录”的重叠意义；正文不把它弱化为纯粹编年记录，脚注则保留另一理解。
- issue: 以诺对历法的行为是描述还是规范
  choice: 译为“指明……并将……排列”
  alternative: “规定各年的日数和月份”
  rationale: 原文可涉及历法秩序，但本句未必明确声称以诺创设规范，故避免过度强化其立法权威。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言；保留“禧年”这一书卷特有术语，并用“七年期”解释其内部年代单位。
