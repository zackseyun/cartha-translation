base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/017.yaml
  text: …year of the jubilee, and he called his name Enoch. He was the first among the children of men born on the earth who learned writing and knowledge and wisdom, and who wrote down the signs of heaven according to the order of their months in a book, so that they might know…
translation:
  language: zh_hans
  text: ……禧年中的一年，给他取名叫以诺。[a] 他是地上所生的人中第一个学习书写、知识和智慧的人；他又把天上的征象按照各月的次序写在书上，使人们可以知道……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹文在此从一句话的中间开始，因此“给他取名”的主语没有在本片段中出现。
    reason: segmentation_note
  - marker: b
    text: 所提供的吉兹文在“使人们可以知道”之后中断，句意尚未结束。
    reason: segmentation_note
lexical_decisions:
- source_word: መጽሐፈ
  choice: 书写
  rationale: 此处与“学问和智慧”并列，指书写或文字之术；译作“书写”比仅作“书”更符合“学会”的搭配。
- source_word: ትምህርተ
  choice: 学问
  rationale: 该词可指教导、知识或学识；在此与书写、智慧并列，译为“学问”自然且不把三项合并。
- source_word: ጥበበ
  choice: 智慧
  rationale: 保留其通常所指的智慧或才智，并维持与书写、学问并列的结构。
- source_word: ተአምረ፡ ሰማይ
  choice: 天上的征象
  rationale: 直译为“天的征象”，在历法和月份语境中指可观察的天象；“征象”也保留其作为记号的含义。
- source_word: ሥርዐተ፡ አውራኅሆሙ
  choice: 各月的次序
  rationale: 保留复数月份及其排列、规程之意，不进一步解释为特定历法体系。
- source_word: እጓለ፡ እመሕያው
  choice: 人
  rationale: 该惯用表达字面近于“活人之子／世人”，此处用现代汉语“人”表达，并由“地上所生的人中”保留原文范围。
theological_decisions:
- issue: “天上的征象”是否应解释为占星预兆
  choice: 不作占星术解释，仅译为“天上的征象”
  alternative: 天体运行的记号／天文现象
  rationale: 原文只说天上的记号并将其与月份次序相连；不宜加入占星、预言或现代天文学等原文未明说的限定。
- issue: 主句“给他取名”中省略的主语
  choice: 在中文中仍不补出具体人物
  alternative: 补作“她给他取名”或“他给他取名”
  rationale: 所给吉兹文片段从前句中间开始，动词主语须由缺失的上文判断；避免根据后来的编排擅自确定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。以省略号明确表示底本片段首尾均不完整；不借用相邻经节补齐人名、亲属关系、年代或历法说明。
