lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在《禧年书》的年代框架中指由七年组成的周期；译作“七年期”既准确又便于现代读者理解。
- source_word: ኢዮቤልዉ
  choice: 禧年
  rationale: 保留本书特有的四十九年纪年单位，并采用中文圣经传统中通行的名称。
- source_word: ኖአም
  choice: 挪安
  rationale: 按吉兹文人名音译，并与相邻族谱姓名的现代中文形式协调。
- source_word: ቃይናን
  choice: 该南
  rationale: 采用中文圣经族谱中通行的人名形式。
- source_word: ነሥአ ... ብእሲተ
  choice: 娶……为妻
  rationale: 以自然汉语表达原文“取某人为自己的妻子”的婚姻用语。
theological_decisions:
- issue: 近亲婚姻的叙述
  choice: 直译为“娶了自己的妹妹……为妻”
  alternative: 弱化为“娶了挪安为妻”
  rationale: 原文明说其亲属关系；这是族谱叙事资料，不应因现代伦理感受而删减或解释。
