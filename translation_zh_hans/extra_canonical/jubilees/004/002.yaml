  yaml_path: translation/extra_canonical/jubilees/004/002.yaml
  text: And in the fifth week she bore him his daughter Awan. And in the first year of the third jubilee Cain killed Abel, because Abel’s offering was accepted, but Cain’s sacrifice was not accepted.
translation:
  language: zh_hans
  text: 在第五周，她为他生了女儿阿万。在第三个禧年的第一年，该隐杀了亚伯，因为亚伯的供物蒙悦纳，该隐的祭物却没有蒙悦纳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋን
  choice: 阿万
  rationale: 按音译处理人名，与常见《禧年书》译名形式相符。
- source_word: ኢዮቤሌው
  choice: 禧年
  rationale: 指本书特有的四十九年周期；采用简洁且通行的中文术语。
- source_word: ቍርባኖ
  choice: 供物
  rationale: 表达献给上帝的礼物，并与后句“祭物”保留原文的词语变化。
- source_word: መሥዋዕቶ
  choice: 祭物
  rationale: 此处指该隐所献之物；译作“祭物”既体现献祭语境，也保留与前句“供物”的词汇区别。
- source_word: ተወክፈ / ኢተወክፈ
  choice: 蒙悦纳／没有蒙悦纳
  rationale: 采用圣经语体中自然、庄重的表达，准确呈现被接受与不被接受的对照。
theological_decisions:
- issue: 该隐杀害亚伯的原因表述
  choice: 因为亚伯的供物蒙悦纳，该隐的祭物却没有蒙悦纳
  alternative: 因为上帝悦纳了亚伯的供物，却没有悦纳该隐的祭物
  rationale: 原文使用被动式而未明说施事者；保留“蒙悦纳”的被动表达，既让神学含义清楚，又不补入原文未明说的主语。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“第五周”和“第三个禧年的第一年”保留原书的年代计算方式；明确重复“该隐”，避免代词指向含混。
