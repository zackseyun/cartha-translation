base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/005.yaml
  text: 'And because of this it is written on the heavenly tablets: “Cursed is he who strikes his neighbor maliciously”; and let all who see and hear say, “So be it”; and the man who has seen and not reported, let him be cursed in the same way.'
translation:
  language: zh_hans
  text: 因此，天上的书版上记着：“恶意击打别人的人必受诅咒。”所有看见并听见的人都要说：“愿如此。”那看见了却没有报告的人[a]，也要同样受诅咒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给吉兹文电子文本表面作“看见并报告了”；但此处很可能漏录了否定词，因此按其表面读法也可译为“看见并报告了”。上下文和通行校勘本支持正文“没有报告”的译法。
    reason: 说明所给电子文本疑有字符误录，并保留表面读法所造成的真实文本差异。
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版
  rationale: 直译为天上的书写版，保留《禧年书》中记载天命的固定意象；不用“石版”，因为原词本身未限定材质。
- source_word: ዘይዘብጥ፡ ካልአ፡ በእኩይ
  choice: 恶意击打别人的人
  rationale: ይዘብጥ 表示击打，ካልአ 表示另一个人或别人，በእኩይ 表示以恶意、邪恶地；此译自然且不把“别人”缩窄为特定法律意义的“邻舍”。
- source_word: ይኩን
  choice: 诚心所愿
  rationale: 在众人回应咒诅的语境中表达确认和赞同，功能近于“阿们”，同时以现代汉语传达其意义。
- source_word: አነገረ
  choice: 报告
  rationale: 该动词指讲明、告知或报告；在目击恶行的司法语境中，“报告”最清楚。
- source_word: ከማሁ
  choice: 同样
  rationale: 表示与前述受咒诅者相同的结局，简洁保留比较关系。
theological_decisions:
- issue: 目击者是否因未报告而受诅咒
  choice: 看见了却没有报告
  alternative: 看见并报告了
  rationale: 所给电子文本表面为肯定式“并报告了”，但这会使律例惩罚履行报告责任的人，与上下文相悖；版本校勘信息指出此处很可能把否定词 ኢ 误录为 አ。正文采用语境和公认文本传统支持的否定读法，并以脚注公开文本问题。
- issue: 众人的回应语
  choice: 诚心所愿
  alternative: 愿它如此／阿们
  rationale: 既保留对所宣告咒诅的正式确认，也避免仅用音译而使普通读者难以把握句义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“受诅咒”维持法律宣告的力度；句式避免古奥。“天上的版”保留原作独特意象，不擅自解释为书卷或石版。
