    issue: “天上的版”在现代汉语中不够明确且搭配生硬。
    rationale: “版”常指版本或印刷版，难以自然承载天上记录之书写板的意象；“天上的书版”既保留“版”的形象，也明确其记录功能。
  - severity: low
