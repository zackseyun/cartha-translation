revisions:
- from: 因此，天上的版上写着：“恶意击打别人的人受诅咒。”凡看见、听见的人都要说：“诚心所愿。”那看见了却没有报告的人[a]，也要同样受诅咒。
  to: 因此，天上的书版上记着：“恶意击打别人的人必受诅咒。”所有看见并听见的人都要说：“愿如此。”那看见了却没有报告的人[a]，也要同样受诅咒。
  rationale: 修订仅处理汉语的自然性、原文连接关系及回应语的准确性；保留英语审校轨迹支持的“没有报告”正文读法，并通过脚注公开所给电子文本的肯定式异文及其不确定性。
