  source_fidelity: 正文正确反映英语审校轨迹所采用的“未报告”读法；但所给吉兹文电子文本表面作肯定式，故须以脚注明确此为基于校勘和语境的复原读法。将“天上的版”改为“天上的书版”，更准确表达记载性的“天上版（heavenly tablets）”意象，且避免汉语中“版”指印刷版的歧义。
  naturalness: “天上的版上写着”不够自然，且“凡看见、听见的人”易被读作只须看见或只须听见。修订为“天上的书版上记着”及“所有看见并听见的人”，语义连接更清楚、现代汉语更自然。“愿如此”比“诚心所愿”更直接对应此处对咒诅的确认。
  terminology: 保留“受诅咒”和“恶意击打”，维持庄重的法律／宣告语体。以“书版”翻译“版／泥版式的书写载体”，不擅自限定材质为石头；“愿如此”传达确认性的回应，而不把词语不必要地限定为特定宗派术语。
