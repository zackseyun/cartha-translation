base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/019.yaml
  text: And he recounted the sabbaths of years, as we made known to him. And he saw what was and what will be in a vision of his sleep, how it will happen to the children of men in their generations until the day of judgment. He saw and understood everything, and wrote his testimony, and placed the testimony on earth...
translation:
  language: zh_hans
  text: 他照着我们所指示他的，述说了年岁的安息期。他在睡梦中的异象里看见了已经发生的事和将要发生的事，也看见这些事将如何临到人类，历世历代直到审判之日。他看见并明白了一切，就写下了他的见证，把这见证置于地上……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存所给原文在此处以“在地上……”未完的句式结束，内容可能接续下一节。旧有英译脚注所载“他离一千年还差七十年……”实际属于《禧年书》4:30，并非本节的异文。
    reason: 说明所给原文的截断状态，并纠正先前因经节错位而附入的内容；正文以省略号和脚注标记保留这一文本现象。
lexical_decisions:
- source_word: ሰንበታት፡ ዓመታት
  choice: 年岁的安息期
  rationale: 较直译地保留“安息期”与“年”的组合，避免擅自具体化为七年周期，同时用现代汉语可理解的结构表达。
- source_word: በራእየ፡ ንዋሙ
  choice: 在睡梦的异象中
  rationale: 兼顾“异象”和“睡眠／梦境”两个来源成分，不简化为普通的梦。
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: 世人的子孙
  rationale: 保留“人的儿女／子孙”的古典群体称谓，指向历代人类。
- source_word: ዕለተ፡ ደይን
  choice: 审判之日
  rationale: 采用现代中文宗教文献中清楚而庄重的对应语，不额外规定审判的性质。
- source_word: ስምዖ
  choice: 自己的见证
  rationale: 依上下文将其理解为以诺写下的见证；保留“见证”而不改写成“记录”或“预言”。
- source_word: አንበረ፡ ... ዲበ፡ ምድር
  choice: 把这见证留在地上
  rationale: “置于地上”在汉语中略显生硬，“留在地上”自然表达保存于世的含义，又不增添保管方式。
theological_decisions:
- issue: 异象所涵盖的时间与内容
  choice: 已经发生和将要发生的事……直到审判之日
  alternative: 过去、现在和未来直到末日的一切历史
  rationale: 只表达原文明确的“已经发生／将要发生”及“审判之日”，不加入“末日”或完整历史体系等解释。
- issue: 以诺对异象的认知程度
  choice: 他全都看见并明白了
  alternative: 他获得了全知
  rationale: 忠实保留经文范围内的“全都”，但不将其提升为本体意义上的全知属性。
- issue: 见证留在地上的含义
  choice: 把这见证留在地上
  alternative: 把见证交给地上的人／藏在地上
  rationale: 原文未明确接收者或保存方式，因此避免补入交付、埋藏等解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“年岁的安息期”有意保留原文特有历法表达；整体维持叙事节奏，不将异象、审判或见证作教派化阐释。
