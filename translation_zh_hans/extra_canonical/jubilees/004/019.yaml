revisions:
- from: 他照着我们所指示他的，述说了年岁的安息期。他在睡梦的异象中看见了已经发生和将要发生的事，也看见世人的子孙世世代代将要遭遇的一切，直到审判之日。他全都看见并明白了，就写下自己的见证，把这见证留在地上……[a]
  to: 他照着我们所指示他的，述说了年岁的安息期。他在睡梦中的异象里看见了已经发生的事和将要发生的事，也看见这些事将如何临到人类，历世历代直到审判之日。他看见并明白了一切，就写下了他的见证，把这见证置于地上……[a]
  rationale: 修订仅收紧原文的句法和语义范围：不把事件明确说成“遭遇的一切”，保留其如何发生于人类、延及历代直到审判之日的表达；并将“留在地上”改为较少解释的“置于地上”。保留“年岁的安息期”以避免在历法术语上作未经文本明确支持的具体化。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:56:13Z'
review_pass:
