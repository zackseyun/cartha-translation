  text: And for this reason we declare, when we come before the Lord our God, all the sins
translation:
  language: zh_hans
  text: 因此，我们来到主我们上帝面前时，宣明一切罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበእንተዝ
  choice: 因此
  rationale: 表达“为此缘故／因此”的因果承接，现代汉语中简洁自然。
- source_word: ናየድዕ
  choice: 要陈明
  rationale: 按校勘文本所呈现的“使人知道、宣明”之意处理；“陈明”适合在上帝面前述说罪行的庄重语境，同时不强行改译为更具神学限定的“认罪”。
- source_word: መጻእነ ቅድመ
  choice: 我们来到……面前时
  rationale: 保留“来到／进入……面前”的时间性从句关系。
- source_word: እግዚአብሔር አምላክነ
  choice: 主我们的上帝
  rationale: 源文使用“主”这一称号而非神名，故不译为带神名含义的“耶和华”；同时尽量保留原语词序。
- source_word: ኵሎ ኀጢአተ
  choice: 一切罪行
  rationale: “罪行”可自然承接“陈明”，并保留复数或集合性的“所有罪”之意。
theological_decisions:
- issue: 是否将“陈明”解释性译为“承认／认自己的罪”
  choice: 陈明一切罪行
  alternative: 承认一切罪／认罪
  rationale: 源文和英语审校层表达的是“declare/make known”，且本节为残句；采用“陈明”保留其语义宽度，不预先限定罪的归属或行为的礼仪性质。
- issue: 神称号的译法
  choice: 主我们的上帝
  alternative: 耶和华我们的上帝
  rationale: 源文是神圣称号“主”，不是神名，故避免加入原文没有的专名。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。此节在所给底本中本身是未完句；中文以句号收束以便独立引用，但不补入底本未提供的宾语归属、后续内容或神学解释。
