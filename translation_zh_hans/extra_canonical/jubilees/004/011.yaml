  yaml_path: translation/extra_canonical/jubilees/004/011.yaml
  text: He was the first among those born on earth to learn writing, instruction, and wisdom, and to write down the signs of heaven according to the order of their months in a book, so that the children of men might know the seasons of the years according to the order of each of their months.
translation:
  language: zh_hans
  text: 他是世上所生的人中第一个学习书写、教导和智慧，并把天上的征兆按照各月的次序写在书上的人，为要使世人能按每个月的次序，知道年份中的时节。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፈ፡ ወትምህርተ፡ ወጥበበ
  choice: 文字、学问和智慧
  rationale: 分别保留“书写/文字、教导/学问、智慧”三个并列概念；“学习文字”在现代汉语中自然，也符合此处获得书写知识的语境。
- source_word: ተአምረ፡ ሰማይ
  choice: 天上的征兆
  rationale: “ተአምር”可指记号、征兆；采用“征兆”保留天象作为可观察记号的含义，不具体化为星宿或历法。
- source_word: ሥርዐተ፡ አውራኅሆሙ
  choice: 各月的次序
  rationale: 直译其按月份排列、运行的秩序，不额外解释为某一种历法体系。
- source_word: እጓለ፡ እመሕያው
  choice: 世人
  rationale: 该惯用语字面近于“人类的儿女”；正文用自然、庄重的现代汉语“世人”表达全人类。
- source_word: ጊዜ፡ ዓመታት
  choice: 一年四季的时节
  rationale: 表达一年之中的时令与节期；“四季”按现代汉语习惯说明年度时序，但不限定具体节庆。
