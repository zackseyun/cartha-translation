base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/021.yaml
  text: And he was still with the angels of God for six jubilees of years[21], and they showed him everything that is on the earth and in the heavens, the dominion of the sun, and he wrote down everything.
translation:
  language: zh_hans
  text: 他与上帝的众天使同在六个禧年[a]。他们把地上和天上的一切，以及太阳的权柄，都指给他看；他便把这一切全都写了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一个禧年为四十九年；六个禧年共二百九十四年。
    reason: 解释《禧年书》特有的纪年单位，帮助现代读者理解时间长度。
lexical_decisions:
- source_word: ሀሎ፡ እንከ፡ ምስለ
  choice: 又与……同住了
  rationale: 按语境表达持续与众天使在一起；“又”自然承接前文，同时不把连接词解释得过重。
- source_word: መላእክት፡ አምላክ
  choice: 上帝的众天使
  rationale: 保留属格关系，并用“众”自然表达复数。
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: 六个禧年
  rationale: 保留《禧年书》的纪年单位；具体年数放入脚注，避免正文累赘。
- source_word: ኵሎ፡ ዘውስተ፡ ምድር፡ ወዘበሰማያት
  choice: 地上和天上的一切
  rationale: 贴近原文范围表达，采用现代汉语自然语序。
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: 太阳的权辖
  rationale: ሥልጣን表示权力、统辖或权域；“权辖”保留其宇宙论含义与一定歧义，不擅自改释为太阳的轨道或运行规律。
- source_word: ወጸሐፈ፡ ኵሎ
  choice: 他便把这一切全都写了下来
  rationale: 明确宾语回指前述启示，并以自然汉语表达完成性的书写动作。
theological_decisions:
- issue: “太阳的权辖”所指为何
  choice: 保留为“太阳的权辖”
  alternative: 译作“太阳的运行规律”或“太阳的统治权”
  rationale: 原词可指权力、统辖、权域；原文未明确是在说太阳所得的权柄、所辖范围，还是其受命运行的秩序，因此不在正文中消除这种张力。
- issue: 本节主语身份
  choice: 沿用代词“他”
  alternative: 明确写作“以诺”
  rationale: 原文此句使用第三人称动词，身份由上下文确定；不在正文补入原文未明说的专名。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“同住”表达长期相伴，“指给他看”保留启示场景的具体性。所给吉兹文本开头的“玛土撒拉”（ማቱሳላ）以句号结尾，显然是前一句“生玛土撒拉”的末尾残项，故不纳入本节正文。未采用英文咨询层中与本节内容无关的误置脚注。
