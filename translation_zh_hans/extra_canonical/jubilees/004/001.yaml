  text: And in the third week in the second jubilee she gave birth to Cain, and in the fourth she gave birth to Abel, and in the fifth she gave birth to her daughter Awan.
translation:
  language: zh_hans
  text: 在第二个禧年的第三个七年期，她生了该隐；第四个七年期，她生了亚伯；第五个七年期，她生了女儿阿万。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: week（本节经校勘所恢复的年代单位）
  choice: 七年期
  rationale: 《禧年书》的年代体系以七年为一个“周”；译作“七年期”既传达实际时长，也避免现代读者误解为七天。
- source_word: jubilee（本节经校勘所恢复的年代单位）
  choice: 禧年
  rationale: 采用该书书名及其四十九年周期的通行译法。
- source_word: Awan
  choice: 阿万
  rationale: 按人名音译；不擅自将其与其他传统中的名字等同。
theological_decisions:
- issue: 本节所述生育者的身份
  choice: 保留代词“她”
  alternative: 明说“夏娃”
  rationale: 依本节衔接方式保留原叙事中的代词，不在正文补入未明说的专名。
- issue: 所给吉兹文与Jubilees 4:1的错位
  choice: 按经校勘确认的4:1内容翻译该隐、亚伯和阿万的出生
  alternative: 照所给错位片段翻译耶和华责备该隐
  rationale: 所给吉兹文实际属于后续经节，不能据此改写4:1；最新审校也确认了分节错位。
translation_notes:
  register: 采用简洁、庄重的现代汉语；重复“七年期”以保留原文清楚的年代递进和平行结构。
