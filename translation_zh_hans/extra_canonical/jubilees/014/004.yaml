  verdict: revise
  source_fidelity: 译文准确传达了继承应许、带到外面和命令观看的叙事次序。但“从你腹中出来”在现代汉语中通常指孕育者，置于亚伯兰身上会造成不必要的性别语义错位；源文此处是“从你本身／身体而出”的后裔惯用表达。
  naturalness: “承受你”在现代汉语中不自然，且容易被理解为忍受某人。“继承你”虽保留源文以第二人称为直接宾语的简洁结构，且在庄重的经文语体中可理解为成为你的继承人。“从你本身所生的”是汉语圣经传统中自然且不越界的表达。
  terminology: “继承”恰当对应继承动词，未擅自补入“产业”。“带他到外面”自然对应使其出去；“你看——”保留原文在节末中断、下接下一节的引语。
  issues:
  - severity: medium
    issue: “从你腹中出来的那一位”用于男性受话者易造成语义误解。
    rationale: 汉语“腹中”主要关联母体怀胎；源文身体意象在此指亚伯兰自身所出的后裔，并非要求汉语保留会误导的生理表述。
  - severity: medium
    issue: “他必承受你”不合现代汉语搭配。
    rationale: “承受”通常搭配痛苦、责任、财物等，不以人作此义项的宾语；改为“必继承你”既更自然，也保留源文直接宾语所留下的概括性。
