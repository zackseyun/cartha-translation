lexical_decisions:
- source_word: ዘይወፅእ፡ እምከርሥከ
  choice: 从你腹中出来的那一位
  rationale: 按吉兹语直译“从你腹中出来者”，保留身体意象；现代汉语中“腹中”自然表达亲生后裔。
- source_word: ይወርሰከ
  choice: 必承受你
  rationale: 保留动词“继承/承受”直接以“你”为宾语的源文张力，不擅自补成“产业”或“家业”。
- source_word: አውፅኦ፡ አፍአ
  choice: 领他到外面
  rationale: 表达使役性的“把他带出去”，符合现代汉语叙事习惯。
- source_word: ነጽር
  choice: 你看
  rationale: 该祈使词意为“看、观看”；本节在此戛然而止，以破折号提示话语延续至下节。
theological_decisions:
- issue: 应许继承者的身份
  choice: 从你腹中出来的那一位
  alternative: 你亲生的儿子
  rationale: 源文只说明继承者从亚伯兰身体而出，并未在本句明说“儿子”；采用较贴近原文的表达，避免提前限定。
- issue: “承受你”的宾语结构
  choice: 保留“承受你”
  alternative: 继承你的产业
  rationale: 源文以第二人称代词作直接宾语，可能涵盖本人、家业与继承地位；不将其窄化为财产。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文简洁的应许句式及本节末尾未完的引语；无脚注标记。
