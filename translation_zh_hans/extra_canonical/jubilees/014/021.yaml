  source_fidelity: 译文准确保留了亚伯兰献上分割的祭物、鸟、素祭和奠祭，以及火将其焚尽的叙事。将 መሥዋዕት 在与奠祭并列的祭仪语境中译为“素祭”是合宜的，也与英语审校轨迹中恢复 cultic precision 的决定一致。
  naturalness: “随同它们的素祭和奠祭”中“它们”在现代汉语里容易就近理解为“肉块和鸟本身”，表达略显生硬。改为“配合这些祭物的”可清楚表达所属关系及祭仪上的伴随关系，且不改变原意。
  terminology: “亚伯兰”“献上”“素祭”“奠祭”均符合中文圣经及祭祀语境的常用、庄重表达。脚注以“祭物”保留该词较宽的可能含义，处理适当。
