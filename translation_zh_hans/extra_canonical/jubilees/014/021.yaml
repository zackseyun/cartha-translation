revisions:
- from: 那一天过去了。亚伯兰献上那些肉块和鸟，又献上随同它们的素祭[a]和奠祭；火把这一切都烧尽了。
  to: 那一天过去了。亚伯兰献上肉块和鸟，以及配合这些祭物的素祭[a]和奠祭；火把这一切都烧尽了。
  rationale: 仅调整属格短语的汉语表达，以消除“它们”的指代生硬和潜在歧义；不改变祭物、素祭、奠祭或火焚尽一切的语义。
