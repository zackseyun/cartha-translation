  yaml_path: translation/extra_canonical/jubilees/014/021.yaml
  text: And that day passed, and Abram offered up the pieces and the birds and their grain offerings and their drink offerings, and fire consumed them.
translation:
  language: zh_hans
  text: 那一天过去了。亚伯兰献上肉块和鸟，以及配合这些祭物的素祭[a]和奠祭；火把这一切都烧尽了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祭物”。
    reason: 原词可泛指祭物；正文依其与奠祭并列的祭祀语境译为“素祭”，脚注保留较宽泛的译法。
lexical_decisions:
- source_word: አዕረገ
  choice: 献上
  rationale: 该词本义有“使上升”之意，在献祭语境中自然表达为“献上”，既保留祭献动作，也符合现代汉语习惯。
- source_word: ክፍላተ
  choice: 肉块
  rationale: 原词意为分割后的各部分；结合献祭场景及本章上下文，译作“肉块”比笼统的“各部分”更清楚。
- source_word: አዕዋፈ
  choice: 鸟
  rationale: 直接对应原文复数名词，不进一步限定鸟的种类。
- source_word: መሥዋዕቶሙ
  choice: 随同它们的素祭
  rationale: 该祭祀用语与紧接的奠祭并列，在此适合指伴随所献祭牲的素祭；加入“随同”自然表达原文所属关系，并避免误解为肉块和鸟本身所拥有的祭物。
- source_word: ሞጻሕቶሙ
  choice: 随同它们的……奠祭
  rationale: 该词指浇奠之祭，译作现代中文圣经语体通行的“奠祭”；与前项共同承接“随同它们的”。
- source_word: በልዐቶሙ እሳት
  choice: 火把这一切都烧尽了
  rationale: 原文直译为“火吃了它们”；“烧尽”准确传达火完全吞噬祭物的形象，“这一切”明确复数代词所涵盖的全部祭物。
theological_decisions:
- issue: መሥዋዕቶሙ 所指的祭物类别
  choice: 素祭
  alternative: 祭物／祭品
  rationale: 原词本身可广指祭物，但它在此与奠祭并列，并伴随已献上的肉块和鸟，采用“素祭”更能呈现该处祭仪组合，同时以脚注保留较宽泛的词义可能。
- issue: 火烧尽祭物的施事表达
  choice: 直接保留“火”为主语
  alternative: 解释为上帝降火烧尽
  rationale: 原文只说火烧尽祭物，没有明说火的来源；不补入“上帝降火”，以保留叙述本身的含蓄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“献上”“素祭”“奠祭”保留祭祀语境的准确性；以分号连接献祭与火烧尽祭物两个紧密相连的动作。
