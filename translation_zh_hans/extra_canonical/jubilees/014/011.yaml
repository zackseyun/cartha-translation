  text: the oak of Mamre, which is near Hebron. And he built an altar there and offered sacrifice
translation:
  language: zh_hans
  text: 幔利的橡树，靠近希伯仑。他在那里筑了一座祭坛，献了祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድራይ፡ ዘማምሬ
  choice: 幔利的橡树
  rationale: “ድራይ”指树木，结合传统地名表达及英语审校层译作“the oak of Mamre”，译为“幔利的橡树”，自然且具体。
- source_word: ቅሩበ፡ ኬብሮን
  choice: 靠近希伯仑
  rationale: “ቅሩበ”表示临近，“ኬብሮን”对应地名希伯仑；采用现代汉语常用表达。
- source_word: ሐነጸ፡ ምሥዋዐ
  choice: 筑了一座祭坛
  rationale: “ሐነጸ”意为建造，“ምሥዋዐ”指祭坛；量词“一座”符合现代汉语习惯。
- source_word: ዘብሐ
  choice: 献了祭
  rationale: 该词可指宰杀祭牲或献祭；在筑坛语境中译为“献了祭”，既自然，又保留祭祀行为的整体含义，避免仅译作一般性的“宰杀”。
theological_decisions:
- issue: ዘብሐ所指是宰杀祭牲还是完整的献祭行为
  choice: 献了祭
  alternative: 宰杀了祭牲
  rationale: 原词带有宰杀、献祭的语义范围；紧接“筑了一座祭坛”，此处以“献了祭”最符合语境，同时不额外规定祭物种类或礼仪细节。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。经文从短语起首，依照所给分节保留其承接上文的片段性质；不补入原文未明说的主语名称。
