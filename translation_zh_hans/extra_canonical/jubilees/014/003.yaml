  text: Eliezer—he will inherit me, and to me you have not given seed.” And he said to him, “This one will not inherit you,”
translation:
  language: zh_hans
  text: “以利以谢——他将继承我；你却没有赐给我后裔。”他对他说：“这个人不会继承你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኤሊኤዜር
  choice: 以利以谢
  rationale: 按常见圣经人名译法音译，保留源文明确出现的姓名。
- source_word: ይወርሰኒ
  choice: 将继承我
  rationale: 直译其‘继承我’的表达，不擅自补成‘继承我的产业’，以保留源文措辞。
- source_word: ዘርአ
  choice: 后裔
  rationale: 此处指所赐的子嗣或后代；‘后裔’自然庄重，也保留集合性语义。
- source_word: ዝ
  choice: 这个人
  rationale: 指回以利以谢；译为‘这个人’比单纯‘这’更符合现代汉语，同时不重复补入姓名。
theological_decisions:
- issue: ‘继承我’是否应解释为‘继承我的产业/家业’
  choice: 保留‘继承我’
  alternative: 译作‘继承我的产业’或‘作我的继承人’
  rationale: 源文以人称宾语表达，可能涵盖继承其家业与地位；正文不把这一含义收窄。
- issue: ‘后裔’的单复数或具体身份
  choice: 使用集合性‘后裔’
  alternative: 译作‘儿子’或‘孩子’
  rationale: 源词对应‘种子/后裔’，不应在此处限定为某一个具体儿子。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。破折号呈现姓名后强调代词的语气；分号保留申诉中两个紧密相连的分句。
