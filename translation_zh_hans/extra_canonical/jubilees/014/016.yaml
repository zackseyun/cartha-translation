  text: But you will go to your fathers in peace, and you will be buried at a good old age.
translation:
  language: zh_hans
  text: 但你必平安地归到你列祖那里，并且在高寿时被安葬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐውር፡ ኀበ፡ አበዊከ
  choice: 归到你列祖那里
  rationale: 原文直指“到你父辈／祖先那里去”，是古代关于死亡归宿的表达；译作“归到你列祖那里”既保留意象，也符合庄重的现代中文经文语体。
- source_word: በሰላም
  choice: 平安地
  rationale: 保留“在平安中”的状态含义，同时使中文句法自然。
- source_word: ወትትቀበር
  choice: 并且……被安葬
  rationale: 准确表达被动意义，并与前一分句顺畅衔接。
- source_word: በርእስ፡ ሠናይ
  choice: 在高寿时
  rationale: 该短语在语境中表达年老而寿终、达到可称为美好或圆满的年岁；“高寿”是自然简洁的现代汉语表达，避免生硬直译为“在美好的年老中”。
theological_decisions:
- issue: “归到列祖那里”的含义
  choice: 保留祖先归宿的传统表达，不具体解释死后状态
  alternative: 意译为“安然离世”或解释为进入某一特定的死后居所
  rationale: 原文保留了古代亲族性死亡意象，本节并未界定其精确的末世论或死后世界含义，因此不作教派化阐释。
- issue: “高寿”是否表示道德评价或寿命保证
  choice: 仅表达在年老高寿时安葬
  alternative: 译为“享尽天年”或“在蒙福的晚年安葬”
  rationale: “享尽天年”及“蒙福”会增加原文没有明说的圆满程度或神学评价；“高寿”较为克制。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“列祖”保留经文传统色彩；整体避免过度古雅，也不把死亡意象解释为特定教义。
