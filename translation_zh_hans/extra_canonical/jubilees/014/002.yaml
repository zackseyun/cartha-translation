  yaml_path: translation/extra_canonical/jubilees/014/002.yaml
  text: and your reward will be exceedingly great.” And he said[a], “Lord, Lord, what will you give me? For I go childless, and the son of Maseq, the son of my maidservant, is Damascus."”
translation:
  language: zh_hans
  text: “你的赏赐必极其丰厚。”他接着说：“主啊，主啊，你要赐给我什么呢？我将无儿无女地离世，而玛色之子、我婢女之子，乃是大马士革[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹文本此处措辞十分压缩，直译为“玛色之子、我婢女之子，乃是大马士革”，没有出现“以利以谢”这一名字。结合《创世记》15:2，此处通常理解为指亚伯兰家中的大马士革人以利以谢。
    reason: 说明文本压缩及与《创世记》15:2的可能互文所指，同时不在正文中补入原文没有的人名。
lexical_decisions:
- source_word: ይፈደፍድ፡ ጥቀ
  choice: 必极其丰厚
  rationale: 该短语表达程度极高；用“极其丰厚”自然呈现赏赐之大，同时保留将来语气。
- source_word: አሐውር፡ ዘእንበለ፡ ውሉድ
  choice: 我将无儿无女地离世
  rationale: 字面包含“行去”与“没有儿女”；结合语境指亚伯兰将无后而终，但不进一步解释继承制度。
- source_word: ወወልደ፡ ማሴቅ፡ ወልደ፡ አመትየ
  choice: 而玛色的儿子，也就是我婢女的儿子
  rationale: 保留原文重复的“儿子”关系，并以“也就是”使压缩的同位结构在现代汉语中可读。
- source_word: ውእቱ፡ ደማስቆስ
  choice: 乃是大马士革
  rationale: 依现存吉兹文本直译系词与“大马士革”，不擅自补入原文未出现的“以利以谢”。
theological_decisions:
- issue: 是否按《创世记》15:2补出“以利以谢”
  choice: 正文不补“以利以谢”，仅在脚注说明可能所指
  alternative: 译作“就是大马士革人以利以谢”
  rationale: 吉兹正文只写“乃是大马士革”；补名会把互文解释写入正文，掩盖《禧年书》此处真实的文本压缩与歧义。
- issue: “无儿无女地行去”的含义
  choice: 译为“无儿无女地离世”
  alternative: 译为“无儿无女地生活下去”或“无儿无女地走着”
  rationale: 上下文关乎后嗣与继承，“离世”最自然地传达其忧虑；但不补写谁将继承产业。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主啊，主啊”保留原文重复呼告；“乃是”略带庄重色彩，用于承载末尾突兀、压缩的判断句。
