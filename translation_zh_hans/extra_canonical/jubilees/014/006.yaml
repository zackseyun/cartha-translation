  text: the stars. And he said to him, “So will your seed be.” And he believed the LORD, and it was reckoned to him as righteousness.
translation:
  language: zh_hans
  text: 众星。主对他说：“你的后裔也将如此。”他信了主，这就算为他的义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: 原词指“种子、后裔”，此处按应许子孙众多的语境译为“后裔”，自然且保留群体含义。
- source_word: ወአምኖ
  choice: 他信了
  rationale: 采用直接、简洁的表达，保留其信靠对象为主。
- source_word: ለእግዚአብሔር
  choice: 主
  rationale: 原文为对上帝的尊称；按现代中文经文体例译作“主”。
- source_word: ወተኈለቍ
  choice: 这就算为
  rationale: 表达“被计算、被归算”的被动概念，同时使中文主语指向前句所述的信，避免擅自明确未明说的施事者。
- source_word: ጽድቀ
  choice: 义
  rationale: 保留原词的司法与关系性神学张力，不扩译为“义行”或“正直”。
theological_decisions:
- issue: 被算为义的主语与施事者
  choice: “这就算为他的义”
  alternative: “主就以此为他的义”或“他就被算为义”
  rationale: 原文承接“他信了主”，以被动形式表达归算；所选译法尽量保存“这”所指内容及施事者未明说的特点，也不把含义改成亚伯兰本人被直接宣告为义。
- issue: “后裔”的单数与集合意义
  choice: 使用集合名词“后裔”
  alternative: “子孙”或“种子”
  rationale: 中文“后裔”既能对应单数形式，又可自然表示众多子孙，不预先限定其神学所指。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“众星”保留本节从上文接续而来的片段结构；未补写原文在本节中没有出现的“数点”等内容。
