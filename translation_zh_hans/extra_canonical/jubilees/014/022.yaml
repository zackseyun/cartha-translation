  yaml_path: translation/extra_canonical/jubilees/014/022.yaml
  text: And on this day we made the covenant with Abram[a], just as we had made it in this month with Noah; and Abram renewed it as a festival and as an ordinance for himself forever.
translation:
  language: zh_hans
  text: 就在这一天，我们与亚伯兰立了约[a]，正如我们曾在这个月与挪亚立约一样。亚伯兰又将这约更新，定为节期，也定为他永远当守的条例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们与亚伯兰立了约”保留了原文的第一人称复数。这符合《禧年书》中由天上使者向摩西传达启示的叙事框架；这里很可能是天使叙述者在说话。
    reason: cross_reference
lexical_decisions:
- source_word: ተካየድነ፡ ኪዳነ
  choice: 我们……立了约
  rationale: 该词组表达订立盟约；用现代汉语圣经语体中自然而庄重的“立约”，并保留原文第一人称复数。
- source_word: ሐደሶ
  choice: 将这约更新
  rationale: 动词意为更新、重新确立；宾语承接上文的“约”，在汉语中补出“这约”以确保指代清楚。
- source_word: በበዓል
  choice: 定为节期
  rationale: 原词指节庆或节期；结合介词结构译作“定为节期”，表达亚伯兰以节庆方式更新此约。
- source_word: ወለሥርዓት፡ ሎቱ
  choice: 也定为他……当守的条例
  rationale: ሥርዓት 表示规定、制度或条例，ሎቱ 表示“为他/对他”；译文保留其个人适用关系，同时采用自然汉语。
- source_word: እስከ፡ ለዓለም
  choice: 永远
  rationale: 惯用表达，表示持续到永世；“永远”准确、简洁。
theological_decisions:
- issue: “我们与亚伯兰立了约”中第一人称复数的身份
  choice: 保留“我们”，并以脚注说明其叙事框架
  alternative: 改译为“上帝与亚伯兰立了约”或“我与亚伯兰立了约”
  rationale: 原文动词明确为第一人称复数。直接改成“上帝”或单数“我”会消除《禧年书》天上中介叙事所保留的张力。
- issue: 亚伯兰所更新之对象
  choice: 按上下文补出“这约”
  alternative: 仅译作“亚伯兰又更新了它”或不补宾语
  rationale: 原文代词性宾语在汉语中若直译会显得含混；“这约”是最近且最自然的先行对象，但不进一步解释约与节期、条例之间的神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“就在这一天”突出原文时间指示；“正如……一样”保留与挪亚之约的对应关系。脚注标记已置于相关主句之后。
