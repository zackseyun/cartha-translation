revisions:
- from: 亚伯兰沉沉睡去。看哪，黑暗带来的巨大恐惧临到他。亚伯兰被告知：“你务要确知，你的后裔必在异乡作寄居者；那里的人要奴役并苦待他们四百年。”
  to: 亚伯兰陷入沉睡。看哪，一阵巨大的黑暗恐惧临到他。亚伯兰被告知：“你务要确知，你的后裔必在异乡作寄居者；那里的人要奴役并苦待他们四百年。”
  rationale: 将“黑暗带来的巨大恐惧”改为“巨大的黑暗恐惧”，避免将原文未明示的关联限定为因果；并以“陷入沉睡”更自然地呈现深沉睡眠临到亚伯兰。其余措辞保持原译的准确性、现代庄重语体及原文的施事者含混。
