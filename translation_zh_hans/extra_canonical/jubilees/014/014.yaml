  text: A deep sleep fell upon Abram; and behold, a great terror of darkness fell upon him. And it was said to Abram, “Know with certainty that your seed will be aliens in a land not theirs, and they will enslave them and afflict them four hundred years.”
translation:
  language: zh_hans
  text: 亚伯兰陷入沉睡。看哪，一阵巨大的黑暗恐惧临到他。亚伯兰被告知：“你务要确知，你的后裔必在异乡作寄居者；那里的人要奴役并苦待他们四百年。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድንጋፄ
  choice: 沉沉睡去
  rationale: 表示临到亚伯兰的深沉睡眠；采用自然的现代汉语表达，同时保留其非寻常、强烈的意味。
- source_word: ግርማ፡ ዐቢይ፡ ጽልመት
  choice: 黑暗带来的巨大恐惧
  rationale: 依原文词序和语义关系保留“巨大”“恐惧／威慑”与“黑暗”，避免把黑暗仅处理成恐惧的程度修饰语。
- source_word: አእምሮ፡ አእምር
  choice: 务要确知
  rationale: 原文以同源动词重复加强语气，意为确实知道；汉语用“务要确知”体现强调。
- source_word: ፈላሴ
  choice: 寄居者
  rationale: 指身处不属于自己之地的外来居留者；“寄居者”比“外国人”更贴合语境，也不预设现代国籍概念。
- source_word: ምድረ፡ ነኪር
  choice: 异乡
  rationale: 原义为陌生、外来的土地；译作“异乡”简洁自然，并与“寄居者”相呼应。
- source_word: ይቀንይዎሙ
  choice: 奴役他们
  rationale: 此处表示使人服劳役、受辖制；“奴役”准确呈现强制性的从属状态。
- source_word: ያሐምምዎሙ
  choice: 苦待他们
  rationale: 该词具有使受苦、加以折磨或压迫之意；“苦待”符合本句历史语境且为普通读者易懂。
theological_decisions:
- issue: 向亚伯兰说话者的身份
  choice: 采用无明确施事者的“亚伯兰被告知”
  alternative: “上帝对亚伯兰说”或“有人对亚伯兰说”
  rationale: 原文使用非人称／被动式“有话对亚伯兰说”，本节自身未明说说话者；译文不补入身份，以保留原文的含蓄。
- issue: “四百年”所修饰的范围
  choice: 置于“奴役并苦待他们”之后，使其自然涵盖并列的两项遭遇
  alternative: 仅理解为“苦待”持续四百年
  rationale: 原文将奴役与苦待并列，时间短语置后；译文保留这一句法张力，不另行作教义或年代学限定。
- issue: 奴役和苦待的施事者
  choice: 译作“那里的人”
  alternative: 沿用含混代词“他们”
  rationale: 原文第三人称复数施事与指向后裔的宾语代词并列；汉语若直译会造成难以辨认的代词冲突。“那里的人”按上下文澄清语法所指，而不具体指定民族或政权。
translation_notes:
  register: 采用现代、庄重而可诵读的简体中文。“看哪”保留原文突显异象的提示语；全句避免古奥文言，也不补入说话者的神学身份。
