  text: 把迦南人的地赐给你，作为永远的产业；并要作你和你后裔的上帝。”他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከናናዊያን
  choice: 迦南人
  rationale: 按族名直译；结合本句承接的土地应许，中文补出“的地”，使残句语义完整自然。
- source_word: ለእኂዝ
  choice: 作为产业
  rationale: 该词表示持有、占有或产业；在土地应许语境中译作“作为产业”最贴切。
- source_word: ለዓለም
  choice: 永远的
  rationale: 保留“直到永世、永久”的时间含义，并自然修饰“产业”。
- source_word: አምላከ
  choice: 上帝
  rationale: 指神；采用现代、庄重且普通读者易懂的称谓。
- source_word: ለዘርእከ እምድኅሬከ
  choice: 你后裔的
  rationale: 直译为“你之后的你的后裔”；中文以“你后裔”自然表达世代承续之意。
- source_word: ወይቤ
  choice: 他说
  rationale: 按叙事连接语直译，并用冒号提示下节将接续其话语。
theological_decisions:
- issue: “作你和你后裔的上帝”的关系性表达
  choice: 并要作你和你后裔的上帝
  alternative: 并成为你和你后裔的上帝
  rationale: 保留原文不定式结构所表达的应许目的或结果，不加入“可能”等弱化语气，也不额外阐释盟约神学。
translation_notes:
  register: 采用现代标准普通话，语体庄重而清楚。本节开头显然承接前文，故依据语境补出“把……的地赐给你”，避免中文成为无法理解的残句；结尾保留“他说：”的跨节衔接。
