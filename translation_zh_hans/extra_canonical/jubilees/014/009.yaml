  text: “Lord, Lord, by what shall I know that I will inherit it?” And he said to him, “Bring me a three-year-old heifer,”
translation:
  language: zh_hans
  text: “主啊，主啊，我凭什么知道我必承受这地呢？”他对他说：“给我取一头三岁的母牛来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚኦ፡ እግዚኦ፡
  choice: 主啊，主啊
  rationale: 保留原文重复呼告的庄重和恳切语气。
- source_word: በምንት፡ አአምር፡
  choice: 我凭什么知道
  rationale: 按原文疑问结构自然表达所求的确据，同时不增添“兆头”等原文未明说的内容。
- source_word: ከመ፡ እወርሳ
  choice: 我必承受这地
  rationale: 动词表达继承、承受；依上下文补出宾语“这地”，使现代汉语指向清楚。
- source_word: ንሣእ፡ ሊተ፡
  choice: 给我取……来
  rationale: 自然传达原文“为我取来”的命令语气。
- source_word: ጣዕዋ፡
  choice: 一头三岁的母牛
  rationale: 依据该词在此处及其《创世记》15:9平行传统中的含义译出牲畜种类与年龄。
theological_decisions:
- issue: “承受”的对象
  choice: 这地
  alternative: 它
  rationale: 原文动词本身在所给片段中未明列宾语，但上下文明指先前应许之地；译作“这地”既符合汉语表达，也不改变应许的内容。
- issue: 亚伯兰所求为何
  choice: 我凭什么知道
  alternative: 我可以借什么兆头知道
  rationale: 保留原文询问获得认知或确据之方式的开放性，不把问题明确解释成索求神迹。
