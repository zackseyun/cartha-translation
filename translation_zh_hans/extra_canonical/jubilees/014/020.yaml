  yaml_path: translation/extra_canonical/jubilees/014/020.yaml
  text: the Kenites, and the Kenizzites, and the Kadmonites, and the Perizzites, and the Rephaim, and the Rakites[a], and the Avvites, and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: zh_hans
  text: 基尼人、基尼洗人、甲摩尼人、比利洗人、利乏音人、拉基人[a]、亚卫人、亚摩利人、迦南人、革迦撒人和耶布斯人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“拉基人”的族名依照吉兹文的读法；在平行传统中，它可能以另一种形式为人所知。本译文保留传抄下来的形式，不作协调。
    reason: textual_variant
lexical_decisions:
- source_word: ለራኬዎን
  choice: 拉基人
  rationale: 按吉兹文所传族名 ራኬዎን（Rakeon）音译，不与平行传统中的其他族名协调统一。
- source_word: ለራፋኤዎን
  choice: 利乏音人
  rationale: 采用现代中文圣经读者熟悉的传统族名，指 Rephaim。
- source_word: ለገር ጌሴዎን
  choice: 革迦撒人
  rationale: 采用 Girgashites 的通行中文圣经译名；原文书写虽分隔，仍作为一个族名处理。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。原文逐项以连接词列举族群，中文以顿号排列，并在末项前用“和”，既保留完整清单，也避免生硬重复。各族名尽量采用通行中文圣经译名；有文本问题的 ራኬዎን 则按音保留为“拉基人”。
