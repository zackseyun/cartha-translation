  text: And Abram rejoiced, and he told this whole matter to Sarai his wife, and he believed that he would have offspring, though she was not bearing. And Sarai advised Abram her husband and said to him, “Go in to Hagar, my Egyptian maidservant; perhaps I may build up offspring for you from her.” And Abram listened to the voice of Sarai his wife and said to her, “Do so.” And she took her,
translation:
  language: zh_hans
  text: 亚伯兰欢喜，就把这一切告诉了妻子撒莱。他相信自己必有后裔，尽管撒莱没有生育。撒莱给丈夫亚伯兰出主意，对他说：“你去亲近我的埃及婢女夏甲吧；或许我能借着她为你建立后裔。”亚伯兰听从了妻子撒莱的话，对她说：“就这样做吧。”于是她带上夏甲，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 源文未明说“她”的主语；按上下文通常指撒莱。阴性宾语“夏甲”以代词出现；本句在此尚未完结，下文继续叙述。
    reason: 说明源文省略的主语、阴性代词宾语及跨节未完的句法，而不加入“带来”的方向性。
lexical_decisions:
- source_word: ተፈሥሐ
  choice: 欢喜
  rationale: 直接表达亚伯兰因所领受之事而喜悦，语体自然庄重。
- source_word: ዘንተ፡ ነገረ፡ ... ኵሎ
  choice: 把这一切告诉了
  rationale: 按源文保留“这整件事／这一切”的范围，不补明具体内容。
- source_word: ዘርእ
  choice: 后裔
  rationale: 此处指所应许的子孙；“后裔”在现代汉语中自然，也能保留群体与延续性含义。
- source_word: ባእ፡ ኀበ፡ አጋር
  choice: 去亲近……夏甲
  rationale: 该表达是委婉的同房用语；“亲近”既能让普通读者理解，又保持经文的含蓄和庄重。
- source_word: አሐንጽ፡ ... ዘርአ፡ እምኔሃ
  choice: 借着她为你建立后裔
  rationale: 保留“建立”这一生动隐喻以及“为你”的源文关系，不改写为单纯的“得孩子”。
- source_word: ሰምዐ፡ ... ቃለ
  choice: 听从了……的话
  rationale: 此语境不只是听见，而是接受并同意撒莱的建议。
- source_word: ወሥአታ
  choice: 于是她把夏甲带来
  rationale: 动词带第三人称阴性单数宾语后缀，指向夏甲；用“带来”较符合叙事动作，同时以脚注说明主语及动词译法的可能性。
theological_decisions:
- issue: 撒莱不生育与亚伯兰相信将有后裔之间的张力
  choice: “他相信自己必有后裔，尽管撒莱没有生育”
  alternative: 把信心明确解释为相信撒莱本人必生子
  rationale: 源文并未在此明确说明应许将如何实现，因此保留信心与现实处境之间的张力，不加入后来的神学解释。
- issue: “建立后裔”的主体与受益关系
  choice: “我能借着她为你建立后裔”
  alternative: “我可以借她得孩子”
  rationale: 保留撒莱作为语法主体、亚伯兰作为受益者的表达，也保留“建立”的隐喻，不将古代代理生育习俗现代化或合理化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲近”作为同房的委婉表达，“后裔”保留应许语境；结尾依源文保持承接下节的未完状态，并确保脚注标记[a]出现在正文。
