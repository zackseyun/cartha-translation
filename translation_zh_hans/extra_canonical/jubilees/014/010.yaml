translation:
  language: zh_hans
  text: 三岁的；又取一只三岁的母山羊、一只三岁的公绵羊、一只斑鸠和一只鸽子。”月中[a]，他取了这一切；他住在……旁边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “月中”在吉兹文中明确出现。《禧年书》常仔细标明时间，具有礼仪和年代记述上的意义，因此予以保留。
