lexical_decisions:
- source_word: ዘሠለስቱ፡ ዓመት፡
  choice: 三岁的
  rationale: 该短语承接上一节被章节切分开的名词，故保留为承前的片段，不擅自补出本节原文没有重复的牲畜名称。
- source_word: ጠሌ
  choice: 母山羊
  rationale: 此处对应《创世记》15:9献祭牲畜清单中的母山羊；用现代汉语明确动物类别与性别。
- source_word: በገዐ
  choice: 公绵羊
  rationale: 该词指公羊；译作“公绵羊”可避免与公山羊混淆。
- source_word: መንጢጠ
  choice: 斑鸠
  rationale: 该词指turtledove，汉语圣经语境中通常称“斑鸠”。
- source_word: ርግብ
  choice: 鸽子
  rationale: 原词为一般意义上的鸽，不额外加入本节未明说的“雏”或“幼”。
- source_word: በመንፈቀ፡ ወርኅ
  choice: 月中
  rationale: 直译为月份的中间，简洁保留《禧年书》明确的时间标记。
- source_word: ኀበ
  choice: 在……旁边
  rationale: 这是表示“在、靠近、旁边”的介词，宾语因分节而落在下一节；以省略号显明句法尚未结束，而不误译成“那里”。
