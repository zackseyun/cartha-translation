base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/014/001.yaml
  text: And after this new moon[a], in the fourth year of this week, on the new moon of the third month, the word of the LORD came to Abram in a dream, saying, “Do not fear, Abram; I am your protector, and your reward will be very great.”
translation:
  language: zh_hans
  text: 这些事以后，在这个七年期的第四年，三月朔日[a]，耶和华的话在梦中临到亚伯兰，说：“亚伯兰，不要害怕；我是你的保护者[b]，你的赏赐必极其丰厚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原词可指“升起”“开端”或“黎明”；在《禧年书》的历法语境中，这里指一个月开始的日子，即朔日。
    reason: cultural_note
  - marker: b
    text: 或译：“我是你的盾牌。”
    reason: translation_alternative
lexical_decisions:
- source_word: ነገር (nagar)
  choice: 这些事
  rationale: 这里承接前文，通常表示“这些事以后”；译作“这些事”比“这件事”更自然，也不把它误解为历法术语。
- source_word: ዝሱባዔ (zə-subāʿe)
  choice: 这个七年期
  rationale: 《禧年书》以七年为一个周期；“七年期”既传达其历法结构，也比音译或“周”更便于现代读者理解。
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ (ba-śarqa sālis warḫ)
  choice: 三月朔日
  rationale: śarqa 基本含义涉及升起、开端或黎明；在《禧年书》的历法语境中，此处指该月开始之日，故译作“朔日”，并以脚注保留词义范围。
- source_word: ቃለ፡ እግዚአብሔር (qāla ʾEgziʾabəḥer)
  choice: 耶和华的话
  rationale: 采用现代中文圣经读者熟悉而庄重的表达，并保留“话临到某人”的启示公式。
- source_word: ሕልም (ḥəlm)
  choice: 梦
  rationale: 直译为“梦”，不增添“异象”等原文未明说的类别。
- source_word: ኢትፍራህ (ʾi-təfraḥ)
  choice: 不要害怕
  rationale: 准确表达否定命令，并符合现代汉语惯用表达。
- source_word: ዐስብከ፡ ዐቢይ፡ ጥቀ
  choice: 你的赏赐必极其丰厚
  rationale: “赏赐”保留报偿或奖赏之义；“极其丰厚”自然传达“大到极点”的加强语气。
theological_decisions:
- issue: “我是你的保护者”所表达的比喻
  choice: 我是你的保护者
  alternative: 我是你的盾牌
  rationale: “保护者”直接表达关系与功能，符合现有吉兹文校勘信息；“盾牌”与《创世记》15:1的传统措辞相应，但可能把隐喻具体化，故置于脚注，不在正文中强行定夺。
- issue: “赏赐”与前一句的句法关系
  choice: 用逗号连接为同一段神谕
  alternative: 在“保护者”后断句
  rationale: 保留“保护者”与“赏赐极大”连续出现的张力，不把后半句割裂为独立宣告。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“七年期”解释本书特有的时间单位；“朔日”简洁表达月份起始日，并以脚注说明原词的真实歧义。正文避免仿古虚词和宗派化术语。所给吉兹文摘录在“我是……”处中断；末句依据该版此节的续文信息及审校记录补全。
