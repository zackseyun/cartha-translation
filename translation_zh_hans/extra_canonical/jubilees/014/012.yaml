revisions:
- from: 这一切，把它们的血倒在祭坛上；又把它们从中间劈开，一半一半面对面摆放；鸟却没有劈开。随后有鸟飞下来，落在那些肉块上。
  to: 他把这些祭牲的血倒在祭坛上，又把它们从中间劈开，分成两半，彼此相对地摆放；只是鸟没有劈开。又有鸟飞下来，落在这些肉块上。
  rationale: 修订仅解决中文句法、指代和表达自然度问题。“这些祭牲”承接上下文中本节所处理的动物；保留“鸟”的泛称，不将其解释为猛禽；“肉块”对应被分开的部分，未增添神学或仪式性说明。
