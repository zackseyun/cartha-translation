  text: all these, and poured out their blood upon the altar, and divided them in the middle, and placed them opposite one another, face to face; but the birds he did not divide. And birds came down upon the pieces,
translation:
  language: zh_hans
  text: 他把这些祭牲的血倒在祭坛上，又把它们从中间劈开，分成两半，彼此相对地摆放；只是鸟没有劈开。又有鸟飞下来，落在这些肉块上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከዐወ፡ ደሞሙ፡ ውስተ፡ ምሥዋዕ
  choice: 把它们的血倒在祭坛上
  rationale: 按词序与语义直译“将它们的血倾倒在祭坛上”，用现代汉语自然表达。
- source_word: ወነፈቆሙ፡ እማእከል
  choice: 把它们从中间劈开
  rationale: 保留从中间分割祭牲的具体动作，与创世记十五章的立约场景相符，但不额外增添解释。
- source_word: ወአንበሮሙ፡ አንጻራቲሆሙ፡ በበገጾሙ
  choice: 一半一半面对面摆放
  rationale: 原文强调各部分彼此相对；译文用“一半一半”承接劈开的动作，并以“面对面”保留原文形象。
- source_word: ወለዐዋፊሰ፡ ኢነተፈ
  choice: 鸟却没有劈开
  rationale: 保留祭牲与鸟之间的转折，并沿用同一动词“劈开”，使动作对应清楚。
- source_word: ወይወርዱ፡ አዕዋፍ፡ ዲበ፡ ክፍሉ
  choice: 随后有鸟飞下来，落在那些肉块上
  rationale: “降下到……之上”在现代汉语中自然译作“飞下来，落在……上”；“肉块”明确指前述被分开的祭牲部分。
theological_decisions:
- issue: 飞下来的“鸟”是否应明确为猛禽
  choice: 保留为泛称“鸟”
  alternative: 猛禽／鸷鸟
  rationale: 所给吉兹文使用一般性的“鸟”词语，英译也保留为 birds；不依据平行经文把类别具体化，以免消除原文的宽泛表达。
- issue: 是否把本节动作明确解释为立约仪式
  choice: 只叙述动作，不加仪式解释
  alternative: 加入“作为立约仪式”等说明
  rationale: 原文在此仅报告宰牲、分割和摆放，不宜把神学解释写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。所给片段开头“这一切”在独立呈现时是承接上文的宾语性残句，译文忠实保留这种跨节衔接，不擅自补出原文片段中未出现的谓语。
