  yaml_path: translation/extra_canonical/jubilees/014/019.yaml
  text: On that day the LORD made a covenant with Abram, saying, “To your offspring I will give this land, from the river of Egypt to the great river, the river Euphrates.”
translation:
  language: zh_hans
  text: 那一天，耶和华与亚伯兰立约，说：“我要把这片土地赐给你的后裔，从埃及河直到那条大河，就是幼发拉底河。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተካየደ፡ ኪዳነ
  choice: 立约
  rationale: 该表达指缔结或设立盟约；现代汉语圣经语体通常自然地译作“立约”。
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 此处对应神的专名；采用现代中文圣经读者熟悉的译名“耶和华”。
- source_word: ለዘርእከ
  choice: 给你的后裔
  rationale: “种子”在此为集合性亲属用语，指亚伯兰的后代；译作“后裔”既自然，也保留其集合意义。
- source_word: ዛተ፡ ምድረ
  choice: 这片土地
  rationale: 指示词加“地、土地”；“这片土地”符合现代汉语表达，也保留所指地域的整体性。
- source_word: እምፈለገ፡ ግብጽ
  choice: 从埃及河
  rationale: 按原文直译为“埃及之河”；不进一步判定具体是哪一条河，以免消除地理上的可能歧义。
- source_word: ፈለገ፡ ዐቢይ፡ ፈለገ፡ ኤውፍራጢስ
  choice: 那条大河，就是幼发拉底河
  rationale: 保留原文“大河—幼发拉底河”的同位说明结构，并使中文衔接自然。
theological_decisions:
- issue: “后裔”的单数形式及集合意义
  choice: 后裔
  alternative: 种子／子孙
  rationale: 原词可按字面作“种子”，在盟约语境中集合性地指后代。“后裔”不强行限定单数个体或复数群体，较能保留原文的语义张力。
- issue: 神名的呈现
  choice: 耶和华
  alternative: 上主／主
  rationale: 原文使用神名对应形式，而非一般性的“主”；因此采用专名译法，避免将两者混同。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；句式贴近原文盟约宣告的结构，同时避免生硬逐词翻译。引语内部以句号收束。
