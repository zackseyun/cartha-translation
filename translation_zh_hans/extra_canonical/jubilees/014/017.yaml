  text: And in the fourth generation they will return here, for the sin of the Amorites is not complete until now.”
translation:
  language: zh_hans
  text: 到了第四代，他们必回到这里；因为亚摩利人的罪恶直到如今还没有满盈。a”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በትውልድ፡ ራብዕ
  choice: 到了第四代
  rationale: 按原文直译为“第四代”，并用“到了”自然表达时间推进。
- source_word: ይትመየጡ፡ ዝየ
  choice: 他们必回到这里
  rationale: 保留复数主语、返回动作及地点指示，不补入原文未明说的身份。
- source_word: ኃጢአቶሙ፡ ለአሞሬዎን
  choice: 亚摩利人的罪恶
  rationale: 以现代汉语自然表达属格关系；“罪恶”既传达罪的性质，也适合此处集合性用法。
- source_word: ኢተፈጸመ … እስከ፡ ይእዜ
  choice: 直到如今……还没有满盈
  rationale: 原文意为截至当前仍未完成或达到限度；“满盈”保留其限度尚未达到的意象，也符合庄重的经文语体。
theological_decisions:
- issue: 亚摩利人的罪尚未“完成”的含义
  choice: 还没有满盈
  alternative: 还没有达到极点／尚未完全
  rationale: 原文动词可表示完成、完满。译作“满盈”保留审判限度逐渐累积的含义，却不进一步断定其具体神学机制。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“必回到”表达原文未来陈述；“直到如今……还没有满盈”避免汉语中“尚未……直到如今”的累赘，同时忠实保留时间界限。末尾引号依上下文显示本节为引语的结束。
