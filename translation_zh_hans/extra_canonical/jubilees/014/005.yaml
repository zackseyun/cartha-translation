  text: Look toward heaven and count the stars, if you are able to count them.” And he looked toward heaven and saw
translation:
  language: zh_hans
  text: “你要仰望天空，数一数众星，看看你能不能数得过来。”于是他仰望天空，就看见……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ሰማይ
  choice: 仰望天空
  rationale: 此处与“观看”的命令语意相连；汉语用“仰望天空”自然表达朝天观看。
- source_word: ኈልቍ፡ ከዋክብተ
  choice: 数一数众星
  rationale: 保留命令语气和“星辰”的复数总体意义；“数一数”符合现代汉语口吻。
- source_word: እመ፡ ትክል፡ ኈልቈቶሙ
  choice: 看看你能不能数得过来
  rationale: 表达“若你能够数它们”的条件和能力含义，“数得过来”自然暗示数量极多而不额外解释。
- source_word: ወነጸረ፡ ሰማየ፡ ወርእየ
  choice: 于是他仰望天空，就看见……
  rationale: 保留连续动作“他观看天并看见”；句子在所给原文处未完，因此以省略号标明跨节或残句延续。
