lexical_decisions:
- source_word: ይከልኦሙ
  choice: 把它们赶走
  rationale: 该动词在此表示阻挡、驱离；结合复数宾语所指的飞鸟，译为“把它们赶走”自然且符合语境。
- source_word: ኢየኀድጎ
  choice: 不让
  rationale: 保留“不准、不给机会”的使役含义，用现代汉语“不让”表达简洁清楚。
- source_word: አዕዋፍ
  choice: 飞鸟
  rationale: 对应复数“鸟类”，在祭牲与猛禽的叙事语境中，“飞鸟”庄重自然。
- source_word: ይልከፍዎሙ
  choice: 碰那些祭牲
  rationale: 动词可指触碰、攫取或侵扰；采用较宽泛的“碰”以保留原文措辞的概括性，并补明复数代词所指为已摆放的祭牲。
- source_word: ሶበ፡ ዐርበት፡ ፀሐይ
  choice: 太阳将要落下的时候
  rationale: 直达原文时间从句“当太阳下落时”；“将要落下”也保留事件尚在展开的意味。
