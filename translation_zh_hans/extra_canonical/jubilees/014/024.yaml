  text: Sarah took Hagar, her maidservant, the Egyptian, and gave her to Abram her husband as a wife. And he went in to her, and she conceived and bore a son, and he called his name Ishmael, in the fifth year of this week; and that year was the eighty-sixth year in Abram’s life.
translation:
  language: zh_hans
  text: 撒拉取了她的婢女、埃及人夏甲，交给她的丈夫亚伯兰作妻子。亚伯兰与夏甲同房，夏甲就怀了孕，生了一个儿子；他给儿子取名叫以实玛利。这是在这个七年期的第五年；那一年是亚伯兰一生中的第八十六年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሶራ፡ ለአጋር፡ ለአአታ፡ ግብጻዊት
  choice: 撒拉把她的婢女、埃及人夏甲带来
  rationale: 依次保留人物、身份及族属信息；按现代汉语调整语序。“带来”对应原文“取/带”的动作，避免遗漏句首谓语。
- source_word: ወወሀበታ፡ ለአብራም፡ ለምታ፡ ትኩኖ፡ ብእሲተ
  choice: 交给她丈夫亚伯兰作妻子
  rationale: 明确译出ለምታ“她丈夫”，并以“作妻子”表达目的或身份关系，不额外界定其婚姻法律地位。
- source_word: ወቦአ፡ ኀቤሃ
  choice: 亚伯兰与夏甲同房
  rationale: 原义为“他进入她那里”，属于委婉的性关系表达；现代汉语以“同房”自然、庄重地传达。
- source_word: ወጸውዐ፡ ስሞ፡ ይስማዔል
  choice: 他给儿子取名叫以实玛利
  rationale: 保留原文阳性单数主语“他”，在汉语中补明“儿子”以避免代词指向含混。
- source_word: በዓመተ፡ ኃምስ፡ ዘዘሰብዐ
  choice: 在这个七年期的第五年
  rationale: “周”在《禧年书》的纪年语境中指七年周期；译作“七年期”比普通“星期/一周”清楚，同时保留其历法含义。
- source_word: ዓመት፡ ሰማንያ፡ ወስድስቱ፡ ዓም፡ በሕይወተ፡ አብራም
  choice: 那一年是亚伯兰一生中的第八十六年
  rationale: 贴近原文“在亚伯兰生命中的八十六年”，用自然汉语表达其年龄纪年。
theological_decisions:
- issue: 夏甲被交给亚伯兰的关系表述
  choice: 作妻子
  alternative: 给亚伯兰为妾／作他的女人
  rationale: 原文使用通常表示“妻子/女人”的词；“妾”会加入特定社会法律分类，“女人”又可能弱化关系，因此保留较直接的“妻子”，不对其地位作超出文本的判定。
- issue: “她丈夫”的归属
  choice: 她丈夫亚伯兰
  alternative: 亚伯兰作妻子
  rationale: 原文明确含有“她丈夫”，其自然先行词是撒拉；正文予以保留，以免遗漏婚姻关系信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。专名沿用常见圣经译名。以“同房”传达原文委婉语，以“七年期”避免“周”在现代汉语中被误解为七天；分句适度拆开以提升可读性，并在正文保留脚注标记[a]。
