  text: And I will also judge the nation to whom they will be enslaved, and after this they will come out from there with much property.
translation:
  language: zh_hans
  text: 他们将要服侍的那个民族，我也要审判；此后，他们必带着许多财物从那里出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለሕዝብ፡ኒ
  choice: 那个民族，我也
  rationale: ወ引出续接关系，后附词素ኒ表达“也”；汉语将“也”放在主语“我”之后更自然，同时保留其附加意义。
- source_word: ይትቀነዩ
  choice: 将要服侍
  rationale: 该未完成式在预言语境中具有将来指向；“服侍”保留服务、臣属乃至受奴役的语义张力，不把原文窄化为单一制度性含义。
- source_word: እፈትሖሙ፡ ሎሙ
  choice: 我要审判
  rationale: 在本句语境中表示上帝对该民族施行司法性的裁断；按现代汉语避免机械重复代词宾语。
- source_word: ጥሪት፡ ብዙኅ
  choice: 许多财物
  rationale: ጥሪት指财产、资财，ብዙኅ表示数量众多；“许多财物”准确且符合庄重的现代汉语。
theological_decisions:
- issue: 后裔与该民族关系的强度
  choice: 将要服侍
  alternative: 将被奴役
  rationale: 原词可涵盖臣服、服役或受奴役；正文采用较宽的“服侍”，以保留原文范围，不预先限定具体制度形态。
- issue: 预言的时间指向
  choice: 将要……我要……必……
  alternative: 正在服侍……我审判……
  rationale: 上下文是对亚伯兰后裔未来经历的预告，未完成式宜按将来理解；中文用将来表达使时间框架清楚。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；语序按汉语自然表达调整，并保留“也”、未来预言及“许多财物”等源文要素。
