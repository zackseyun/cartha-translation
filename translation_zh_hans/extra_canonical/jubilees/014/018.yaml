  text: And he awoke from his sleep and arose, and the sun had set, and there was a flame. And behold, a smoking furnace and a torch of fire passed between the pieces.
translation:
  language: zh_hans
  text: 他从睡梦中醒来，站起身来；太阳已经落下，火焰出现了。看哪，一座冒烟的火炉和一支火炬从那些肉块之间经过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነድ (nad)
  choice: 火焰
  rationale: 该词表示火焰或烈火；按吉兹文本直译，不采用《创世记》15:17中“天黑了”的平行措辞。
- source_word: እቶን (ʾetōn)
  choice: 火炉
  rationale: 指炉、熔炉；与“冒烟”连用时译作“冒烟的火炉”自然且保留原有意象。
- source_word: ልባስ እሳት (ləbbās ʾəsāt)
  choice: 燃烧的火炬
  rationale: 短语构成火的明亮、可持照明物意象；译作“燃烧的火炬”比生硬的“火之火炬”更符合现代汉语。
- source_word: ክፍል (kəfl)
  choice: 肉块
  rationale: 结合立约献祭的上下文，所指是被分开的祭牲肉块；用“肉块”明确其具体指代。
theological_decisions:
- issue: 是否按《创世记》15:17的平行叙述译作“天黑了”
  choice: 火焰出现了
  alternative: 天黑了
  rationale: 吉兹文本明确使用表示“火焰”的ነድ；保留《禧年书》现存文本的独特读法，避免以平行经文校改本句。
- issue: 经过肉块之间者的象征身份
  choice: 仅呈现火炉与火炬的异象，不加解释
  alternative: 明确解释为上帝临在或立约者
  rationale: 原文只描写所见景象；译文不额外指定其神学身份，以保留文本的象征张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“看哪”保留原文突显异象的提示语；全句避免仿古倒装，同时维持叙事的肃穆感。
