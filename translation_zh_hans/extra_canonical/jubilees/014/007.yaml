  text: And he said to him, “I am the LORD who brought you out from Ur of the Chaldeans, so that I might give you this land to inherit it.”
translation:
  language: zh_hans
  text: 他对他说：“我是耶和华，曾把你从迦勒底人的吾珥领出来，为要把这地赐给你作产业。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 这是表示以色列之神名号的常用庄重译法，与本句自我启示的语境相符。
- source_word: ኡር፡ ዘከለዳዊያን
  choice: 迦勒底人的吾珥
  rationale: 按地名与所属关系直译，并沿用现代中文圣经读者熟悉的专名形式。
- source_word: ምድረ፡ ዛቲ
  choice: 这片土地
  rationale: 保留指示词“这”，同时以自然现代汉语表达所指的土地。
- source_word: ትረሳ
  choice: 赐给你作产业
  rationale: 该词表达承受、继承为业之意；“作产业”既自然，又保留土地作为承受之业的语义。
theological_decisions:
- issue: 神自称的译法
  choice: 我是耶和华
  alternative: 我是主
  rationale: 此处是神的自我宣告；采用专名式译法可保留原句与《创世记》相关叙事的呼应，而不额外加入解释。
- issue: 赐地与承受产业的关系
  choice: 为要把这片土地赐给你作产业
  alternative: 为要使你继承这片土地
  rationale: 兼顾“赐予”和“承受为业”两层含义，不把经文进一步解释为某一特定神学体系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留直接引语、神圣名号、地名和赐地为业的核心语义。
