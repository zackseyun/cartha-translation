  text: And the chief of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me, I will not be able to exercise the authority of my will over the sons of men. For these are for corruption and for leading astray before my judgment, because the wickedness of the sons of men is great.”
translation:
  language: zh_hans
  text: 众灵之首玛斯提玛前来，说：“主，创造者，求你让其中一些留在我面前，使他们听从我的声音，照我吩咐他们的一切去做；因为若不把其中一些留给我，我就不能在世人身上施行我意志的权柄。他们原是要在我审判之前败坏人、引人走迷的，因为世人的恶甚大。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mastema
  choice: 玛斯提玛
  rationale: 按专名音译，保留其作为众灵之首的名字，不将其解释性地译作“仇敌”或等同于其他称号。
- source_word: chief of the spirits
  choice: 众灵之首
  rationale: 简洁表达其统领地位，并保留“灵”这一类别称谓。
- source_word: Lord, Creator
  choice: 主，创造者
  rationale: 保留两个并列的呼语及其庄重语气。
- source_word: listen to my voice
  choice: 听从我的声音
  rationale: 兼顾字面意象和服从之义；下文“照我吩咐”进一步明确其实际含义。
- source_word: authority of my will
  choice: 我意志的权柄
  rationale: 保留“意志”与“权柄”之间不寻常但重要的组合，不改写成单纯的“统治”。
- source_word: sons of men
  choice: 世人
  rationale: 采用自然的现代汉语总称，指人类，并避免误读为仅指男性后裔。
- source_word: corruption and for leading astray
  choice: 败坏人、引人走迷
  rationale: 分别保留毁坏与诱入歧途两个动作，避免合并为笼统的“作恶”。
theological_decisions:
- issue: 玛斯提玛与这些灵的关系
  choice: 译作“留在我面前”及“留给我”，保留其请求支配部分灵体的意思
  alternative: 译作“与我同在”或“归我管辖”
  rationale: 原句既有临在用语，也暗示管辖；正文不把这种关系系统化为特定的恶魔论。
- issue: “我意志的权柄”的性质
  choice: 直译为可在人身上施行的权柄
  alternative: 解释为“执行我的计划”或“试探人的能力”
  rationale: 经文本身将意志、权柄和针对世人的行动相连，但没有明确界定其范围或正当性，因此保留张力。
- issue: “在我审判之前”的归属与含义
  choice: 保留为“在我审判之前”
  alternative: 译作“按我的裁断”或“在最终审判以前”
  rationale: 短语可能涉及玛斯提玛所执行的审判，也可能带有时间或场景色彩；不擅自明确为末日审判或神的审判。
- issue: 恶灵败坏人和人的罪恶之间的关系
  choice: 并列保留恶灵的迷惑与世人自身的恶
  alternative: 将人的恶完全解释为恶灵造成的结果
  rationale: 原文同时陈述两者，未解除人类责任与外在诱惑之间的神学张力。
