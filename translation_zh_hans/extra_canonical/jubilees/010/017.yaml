base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/017.yaml
  text: nineteen jubilees and two weeks of years and five years. And during his life on the earth he surpassed the sons of men[17], except Enoch, because of the righteousness in which he was perfect. For Enoch was appointed as a testimony for the generations of the world, to recount all the deeds of generation after generation until the day of judgment.
translation:
  language: zh_hans
  text: 共十九个禧年[a]、两个七年期和五年。他在世时，因着他所完全持守的义，胜过世人；唯有以诺例外。[b]因为以诺被立为世上历代的见证，好述说一代又一代的一切行为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禧年”在本书的纪年体系中是四十九年。
    reason: chronology_clarification
  - marker: b
    text: 这一句原文十分凝缩。“他在世时”也可理解为“他的寿命”；据此可译为：“他的寿命超过了世人，只有以诺例外；这是因着他所完全持守的义。”
    reason: alternative_reading
lexical_decisions:
- source_word: እዮቤልው
  choice: 禧年
  rationale: 保留《禧年书》的专门纪年单位；在本书的年代体系中指一个四十九年的周期。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词本义为“七个一组”，在年代语境中指七年，译作“七年期”比单译“周”更清楚。
- source_word: ሐዩዎ
  choice: 寿命
  rationale: 此处指人在地上的生命年数；结合“超过世人”和以诺这一例外，译作“寿命”最能表达比较对象。
- source_word: ጽድቅ
  choice: 义
  rationale: 保留该词的伦理及神学分量，不弱化为一般的“善良”或“正直”。
- source_word: ስምዕ
  choice: 见证
  rationale: 该词表示“见证、证言”，不是通常意义上的“记号”；“被立为……见证”也保留以诺为后世作证的角色。
- source_word: ግብረ
  choice: 行为
  rationale: 可指所做之事、行动或作为；“一切行为”保持概括性，不预先限定为善行或恶行。
theological_decisions:
- issue: 挪亚的寿命、义与以诺例外之间的关系
  choice: 按句法次序译为“寿命超过了世人，只有以诺例外；这是因着……义”
  alternative: 可理解为他在义上胜过世人，只有以诺例外
  rationale: 原文表达高度凝缩，“寿命/生命”“超过”“因着义”和“只有以诺例外”的关系并不完全明朗。正文采用与上下文年代数据较协调的寿命解释，同时以脚注保留另一种可能。
- issue: 以诺作为见证的身份
  choice: “以诺被立为世上历代的见证”
  alternative: “以诺的职分被设立为世上历代的见证”
  rationale: 原文用使役表达，直接以以诺本人为被设立者较自然，也不额外引入“职分”这一原文未明说的概念。
- issue: 是否补入“直到审判之日”
  choice: 不补入
  alternative: 依英语审校层补作“直到审判之日”
  rationale: 本请求所给吉兹语文本止于“一代又一代”，未包含“直到审判之日”的对应词句；按原文证据优先的原则不在正文中补入。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“共十九个禧年……”承接上文，保留原文片段式的年代总结；“只有以诺例外”维持原文的神学张力。所有脚注标记均已置于正文对应位置。
