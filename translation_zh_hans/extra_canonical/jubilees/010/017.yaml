revisions:
- from: 共十九个禧年[a]、两个七年期又五年。他在世的寿命超过了世人，只有以诺例外；这是因着他在其中得以完全的义。[b] 因为以诺被立为世上历代的见证，好述说一代又一代的一切行为。
  to: 共十九个禧年[a]、两个七年期和五年。他在世时，因着他所完全持守的义，胜过世人；唯有以诺例外。[b]因为以诺被立为世上历代的见证，好述说一代又一代的一切行为。
  rationale: 将正文改为较贴近吉兹语句法的理解：比较的重点是挪亚因完全持守的义而胜过世人，以诺为例外；同时在脚注中保留把“在世时”理解为寿命的可能。年代单位、以诺作为见证，以及“一代又一代的一切行为”均予保留。由于提供的原文在此止于“世代相继”，未添加“直到审判之日”。
  reviewer_model: gpt-5.6-terra
