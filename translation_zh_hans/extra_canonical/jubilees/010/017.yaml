  source_fidelity: “ሐዩዎ”在此更稳妥地指“在世时／一生中”，而非可明确量化、并与众人比较的“寿命”。原文紧接的“因着……义”自然说明他胜过世人的缘由；以诺是此项卓越的例外。所给吉兹语引文止于“世代相继”，故正文不补入英语审校轨迹中的“直到审判之日”。
  naturalness: 原译“他在世的寿命超过了世人”及“这是因着他在其中得以完全的义”虽可理解，但前者过度限定，后者指代和搭配生硬。修订后句法更符合现代庄重书面汉语，并保留原文的比较关系。
  terminology: 保留“禧年”“七年期”“义”“见证”“行为”等术语。“见证”恰当对应ስምዕ，不改作“记号”。
  issues:
  - severity: medium
    issue: 将“在世时／一生中”译为“在世的寿命”，并将“因着义”附着于寿命比较。
    rationale: 这使原文较自然的意思——他因完全的义而胜过世人——变成寿命的优越，属于不必要的释义性限定。以诺例外仍可保留在正文。
  - severity: low
    issue: “在其中得以完全的义”表达不自然。
    rationale: 原文意为“他在这义上是完全的／他所完全持守的义”；修订采用更自然的“他所完全持守的义”。
