  text: the unclean demons began to lead astray the children of the sons of Noah, and to make them err and destroy them.”
translation:
  language: zh_hans
  text: 污秽的鬼魔开始把挪亚儿子们的子女引入歧途，使他们迷失，并毁灭他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናፍስት፡ እኩያን（据本章相关语境；英审校层作 unclean demons）
  choice: 不洁的鬼魔
  rationale: “鬼魔”自然表达敌对的超自然灵体；以“不洁”保留其礼仪与道德色彩，不弱化为泛称“恶灵”。
- source_word: lead astray
  choice: 引入歧途
