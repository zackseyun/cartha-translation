base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/021.yaml
  text: And they built it for forty-three years. Its breadth was 204 cubits[21], and the height of a brick was one third of one cubit; and its height amounted to 5,433 cubits and 2 palms, and twelve stades.
translation:
  language: zh_hans
  text: 他们建造这座塔用了四十三年。塔宽二百零四肘[a]；每块砖高三分之一肘。塔高达五千四百三十三肘、二掌和十二斯塔迪昂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文本所传的塔身尺寸很难解释，其中一些数字或单位可能在传抄中已经讹误。本译文尽量照所传数字直译，但确切尺寸仍无法确定。
    reason: textual_variant
lexical_decisions:
- source_word: ሐነጽዎ
  choice: 建造这塔
  rationale: 动词意为“建造它”；依本节上下文，代词所指是塔，中文补出“这塔”更自然。
- source_word: ግንፋለ
  choice: 肘
  rationale: 该词在此表示古代长度单位 cubit，采用中文圣经及古代度量语境中通行的“肘”。
- source_word: ኑኅ
  choice: 三分之一肘
  rationale: 结合句法及英语审校层，将砖的高度理解为一肘的三分之一；补出单位以免中文产生“一的三分之一”的歧义。
- source_word: ስዝር
  choice: 掌
  rationale: 作为较小的长度单位 palm，译作“掌”，保留古代计量方式。
- source_word: ምዕራፍ
  choice: 斯塔迪昂
  rationale: 此处指 stade/stadion 古代长度单位；采用音译，避免用现代长度换算掩盖原文计量上的困难。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留原文所传的数字与古代单位，不采纳后期希腊材料中关于两面墙长度的补文；“十二”依吉兹文数字፲ወ፪直译。
