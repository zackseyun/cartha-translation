  text: from the land of Shinar[28]. And Ham and his sons went into the land that was apportioned to him, which he acquired.
translation:
  language: zh_hans
  text: 从示拿地[a]。含和他的儿子们进入了那分给他、他所得的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的“从示拿地”承接上文；由于分节，本节起首呈现为一个片段。
    reason: segmentation_note
lexical_decisions:
- source_word: እምድረ፡ ሲናአር
  choice: 离开示拿地
  rationale: እም表示“从、离开”，ምድረ ሲናአር指“示拿地”；保留原文作为承接上文的句子片段。
- source_word: ወሖሩ፡ ካም፡ ወውሉዱ
  choice: 含和他的儿子们来到
  rationale: ሖሩ表示前往，后接ውስተ“进入”，合译为自然的汉语“来到”；“含”采用现代中文圣经中通行的人名形式。
- source_word: ውስተ፡ ምድር
  choice: 那……土地
  rationale: 字面为“进入土地”；结合汉语句法，将关系从句置于“土地”之前。
- source_word: እንተ፡ አሕዝት፡ ሎቱ
  choice: 按份分给他
  rationale: 该表达在分地语境中指使他得以占有的份地；如此翻译可避免误解为未经许可的强占。
- source_word: ዘረከበ
  choice: 由他承受
  rationale: ረከበ可表示得到、领受或取得；“承受”切合获分土地的语境，同时保留实际领受所得之意。
theological_decisions:
- issue: 含取得土地的性质
  choice: 按份分给他、由他承受
  alternative: 他为自己夺取
  rationale: 原文的使役占有表达与ረከበ的“领受、取得”共同指向合法获分并承受土地；译作“夺取”会把后文迦南擅占土地的意味错误地移到含身上。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“按份分给”交代土地分配背景，“承受”保留领受产业的语感；不把原文解释成非法强占。
