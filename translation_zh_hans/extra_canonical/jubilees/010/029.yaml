base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/029.yaml
  text: And Canaan saw the land of Lebanon as far as the brook of Egypt, that it was very good, and he did not go into the land of his inheritance to the west of the sea, and he dwelt in the land of Lebanon, from the east and from the west, from the border of the Jordan and from the border of the sea.
translation:
  language: zh_hans
  text: 迦南看见黎巴嫩地，直到埃及溪，十分美好；他没有进入在海的西边、属于他产业的土地，却住在黎巴嫩地，其范围从东到西，介于约旦河的边界和海的边界之间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末尾的地界表述在传本中较为艰涩，直译为“从东、从西，从约旦河的边界和从海的边界”。正文将其顺译为地域范围；这些方位短语彼此的精确地理关系并不完全明确。
    reason: 保留原文边界句法的歧义，避免把不够明确的地理关系表述为确定无疑。
lexical_decisions:
- source_word: መሐዘ፡ ግብጽ
  choice: 埃及溪
  rationale: 按字面保留地理名称“埃及溪”，不具体认定为现代某条河道。
- source_word: ሠናይ፡ ይእቲ፡ ጥቀ
  choice: 非常美好
  rationale: 体现“美好”与强化词“非常”的组合。
- source_word: ምድረ፡ ርስት
  choice: 分给他作产业的土地
  rationale: “产业之地”在上下文中指经拈阄分得的领地；译文兼顾产业含义与自然汉语。
- source_word: መንገለ፡ ዐረብ፡ ባሕር
  choice: 海西边
  rationale: 原文短语指向海的西方/西边；依英译校勘层理解为“to the west of the sea”，但其方位关系存在文本疑难，另加脚注说明。
- source_word: እምእደ፡ ዮርዳኖስ፡ ውእምእደ፡ [ባሕር]
  choice: 从约旦河边界延伸到海边界
  rationale: 将重复的“边界”结构自然表达为地域范围，同时保留约旦河与海两端。
theological_decisions:
- issue: 迦南未前往自己产业之地的行为性质
  choice: 用“反而”呈现叙事对比，不直接加上悖逆、贪恋或犯罪等评价
  alternative: 译作“他违命没有前往”或“因贪恋而没有前往”
  rationale: 本节只叙述他见地美好、未赴产业之地并住下；动机及神学评价不宜由译者补入。
- issue: 土地归属与分配方式
  choice: 译作“分给他作产业”
  alternative: 仅译“他的产业之地”
  rationale: 上下文涉及拈阄分地，但本节原文的核心词是“产业”；此译法点明分配背景而不扩写具体程序。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“埃及溪”“产业”等保留古代地理与分地语境；对末尾艰涩的方位结构作适度顺译，并以脚注披露其歧义。
