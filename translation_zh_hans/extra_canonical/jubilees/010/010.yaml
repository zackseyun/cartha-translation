  text: And he said, “Let a tenth of them remain before him, and let nine parts descend into the place of judgment.”
translation:
  language: zh_hans
  text: 他说：“让其中十分之一留在他面前，其余十分之九降到审判之地去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓሥራተሙ
  choice: 它们的十分之一
  rationale: 表达原文按十份划分的数量关系，并明确所指为前文提到的灵体。
- source_word: ቅድመ፡ ሰይጣን
