  text: Lebanon, from Hamath as far as the entrance of Egypt, he and his descendants to this day. And because of this,
translation:
  language: zh_hans
  text: 黎巴嫩，从哈马直到埃及的入口；他和他的后裔直到今日仍在那里。因此，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊባኖስ
  choice: 黎巴嫩
  rationale: 按专名直译；在本残句中承接前文所述地域。
- source_word: እምአማት፡ እስከ፡ ምብዋአ፡ ግብጽ
  choice: 从哈马直到埃及的入口
  rationale: 保留从哈马至埃及入口的地理范围表达；“入口”对应ምብዋአ，避免擅自具体化为某一地点。
- source_word: ውእቱ፡ ወውሉዱ
  choice: 他和他的后裔
  rationale: 阳性代词及所属后缀指向前文人物迦南，而非土地；“后裔”自然概括其子孙。
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: 直到今日仍在那里
  rationale: 直义为“直到这一日”；补出汉语所需的状态谓语“仍在那里”，使残句语义通顺，但不增加新的时间含义。
- source_word: ወበእንተዝ
  choice: 因此
  rationale: 该连接语开启下文，译作“因此”并保留经节末尾未完待续的结构。
theological_decisions:
- issue: 代词所指
  choice: 按人物迦南处理，译为“他和他的后裔”
  alternative: 按黎巴嫩或土地处理，译为“它和它的后裔”
  rationale: ለ“他/它”的形式本身可受语境影响，但“他的后裔”更自然地指前文族长迦南；土地拥有“后裔”在此不合语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文是承上启下的残句，中文以分号厘清地域范围与人物居住状态，并用末尾逗号保留“因此”通往下文的未完结构。
