  yaml_path: translation/extra_canonical/jubilees/010/027.yaml
  text: And it was between Asshur and Babylon, in the land of Shinar; and he called its name Overthrow, in the fourth week, in the first year at its beginning, in the thirty-fourth jubilee, they were dispersed.
translation:
  language: zh_hans
  text: 它位于示拿地，在亚述和巴比伦之间。他给它取名为“倾覆”[a]。在第三十四个禧年的起初，即第一年的第四周，他们分散了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倾覆”也可按原词音译为“德凯特”；这里译出名字的含义。
    reason: 原文既可视为具有词义的命名，也可作为专名音译；正文采用意译，脚注保留音译可能。
lexical_decisions:
- source_word: ደቀት (däqät)
  choice: 倾覆
  rationale: 该词意为“倒下、毁灭、倾覆”，在此作为所起的地名；译出词义比单纯音译更能传达原文的命名意味。
- source_word: አሱር (ʾAssur)
  choice: 亚述
  rationale: 采用现代中文读者熟悉的传统地名译法。
- source_word: ሰናአር (Śənāʾār)
  choice: 示拿
  rationale: 采用该古地名通行的中文译名。
- source_word: ተዘርዉ (täzäräwu)
  choice: 他们就分散了
  rationale: 保留原文复数被动／不及物结果含义，表达群体被分散或四散的事件，不补入原文未明说的施事者。
theological_decisions:
- issue: 分散事件的施事者
  choice: 不明说施事者，译作“他们就分散了”
  alternative: “他们就被分散了”或“上帝使他们分散”
  rationale: 原文动词表达分散的结果，但本节没有明确指出谁实施了这一行动；不补入“上帝”可保留原文的含蓄与张力。
- issue: 年代短语的归属与次序
  choice: “第三十四个禧年的第四周第一年伊始”
  alternative: “在第四周第一年的开始，即第三十四个禧年”
  rationale: 按禧年—周—年的层级重组为自然中文，同时忠实保留“在其开始”的时间限定；不采纳缺乏吉兹文支持的“此前”或“第三十七个禧年”。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。将原文开头的地点片语补足为自然汉语句子“它位于……”，但不添加具体所指；年代表达按中文习惯排列，并保留原文“伊始”的意义。
