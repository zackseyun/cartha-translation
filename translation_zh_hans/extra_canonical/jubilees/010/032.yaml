  yaml_path: translation/extra_canonical/jubilees/010/032.yaml
  text: Cursed are you, and cursed shall you be beyond all the sons of Noah, by the curse with which we bound ourselves by an oath before the holy judge and before Noah our father.”
translation:
  language: zh_hans
  text: 这地在闪的居地内，因为这是闪和他的子孙抽签所得的。你受咒诅；你必比挪亚所有的儿子更受咒诅[a]，凭着我们以誓言约束自己所立的咒诅。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比……更受咒诅”也可理解为“在挪亚所有的儿子中受咒诅”。
    reason: 吉兹语介词እም兼有分离、来源和比较等功能；此处存在真实的句法歧义。
lexical_decisions:
- source_word: ማኅደረ፡ ሴም
  choice: 闪的居地
  rationale: ማኅደር可指住处、居地或领地；结合土地分配和抽签的上下文，译作“居地”既自然，也不把含义过度限定为帐篷或政治疆域。
- source_word: ወፀአ፡ በዕፆሙ
  choice: 抽签所得的
  rationale: 字面意象是签为他们“出来/落定”；现代汉语以“抽签所得”清楚表达分地结果，同时保留签决定归属的意义。
- source_word: ርጉም፡ አንተ፡ ወርጉመ፡ ትከውን
  choice: 你是受咒诅的，也必……更受咒诅
  rationale: 保留原文现在状态与将来结果的重复和递进，不将两个分句压缩成一次咒诅宣告。
- source_word: እምኵሎሙ፡ ውሉደ፡ ኖኅ
  choice: 比挪亚所有的儿子更
  rationale: 介词እም可表达“从、离开”并引申为比较；此处按比较义处理，与咒诅程度的宣告相合。
- source_word: ተማራዕነ፡ በመሐላ
  choice: 我们起誓约束自己
  rationale: 表达以誓言使自己承担约束的意思；避免仅译作“我们发誓”而遗漏相互承担咒约的力度。
theological_decisions:
- issue: 咒诅是程度比较还是群体归属
  choice: 译为“比挪亚所有的儿子更受咒诅”
  alternative: 译为“在挪亚所有的儿子中受咒诅”
  rationale: እም通常支持比较或分离义，但这里也可能被理解为从整个群体中特别标出受咒诅者；正文采用较直接的比较义，并以脚注保存另一种理解。
- issue: 是否补入英译咨询层中的“在圣洁的审判者和我们父亲挪亚面前”
  choice: 不补入正文
  alternative: 依英译咨询层补入该短语
  rationale: 所提供的吉兹语证据止于“以誓言”，未含该短语。遵循原语言证据优先的原则，不把当前源文中无法核验的内容静默加入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“居地”“抽签所得”“起誓约束自己”适合普通读者，同时保留土地归属、咒诅宣告和誓约约束的古代语境。开头在吉兹语中承接上文，中文未擅自补出明确主语。
