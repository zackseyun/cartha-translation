  text: for your grace has been great toward me, and great is your mercy toward my life—let your grace be magnified over my sons, and do not let wicked spirits rule over them, lest they destroy them from the earth.
translation:
  language: zh_hans
  text: 因为你向我施的恩惠浩大，你对我的性命大有怜悯。愿你的恩惠在我众子身上更显浩大[a]；不要让邪灵辖制他们，免得邪灵将他们从地上除灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧译作：“愿你的恩惠在我众子身上被高举。”正文译作“更显浩大”，以保留与前句“浩大”的同根呼应。
