  yaml_path: translation/extra_canonical/jubilees/010/019.yaml
  text: For they departed from the land of Ararat eastward to Shinar, and in his days they built the city and the tower, saying, “Come, let us go up by it into heaven.”
translation:
  language: zh_hans
  text: 因为他们从亚拉腊地向东迁往示拿；在他的日子里，他们建造了那座城和那座塔，说：“来吧，让我们借着这塔上到天上去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈለሱ
  choice: 迁往
  rationale: 表达离开原居地并迁移至另一地，比单纯“出发”更符合迁徙语境。
- source_word: መንገለ፡ ጽባሕ
  choice: 向东
  rationale: 字面涉及日出方向，现代汉语自然表达为“向东”。
- source_word: ሰናአር
  choice: 示拿
  rationale: 采用现代中文圣经传统中 Shinar 的通行地名译法。
- source_word: ሐነጽዎ፡ ለሀገር፡ ወለማኅፈድ
  choice: 建造了那座城和那座塔
  rationale: 分别对应城与塔；“那座”使汉语指称自然，并与熟知的叙事对象相符。
- source_word: ንዕርግ፡ ቦቱ፡ ውስተ
  choice: 让我们借着这塔上到天上去
  rationale: 保留借助所建之塔向上进入天上的空间意象，不将其弱化为抽象的扬名或宗教解释。
theological_decisions:
- issue: 建塔者所说目标的空间含义
  choice: 上到天上去
  alternative: 通到天上／升到天上
  rationale: 原文表达上升、进入的方向性；“上到天上去”既自然又保留其大胆宣称，不预先判断这句话是夸张、象征还是字面企图。
- issue: “在他的日子”所指人物
  choice: 保留“他的日子”
  alternative: 明确补出某一人物姓名
  rationale: 本节所给原文片段未明说代词所指，译文不擅自消除上下文中的指代含混。
translation_notes:
  register: 采用庄重而现代的叙事语言；保留“因为”与上文的因果衔接，并用分号清楚区分迁徙与建造两个动作。
