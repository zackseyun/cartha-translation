  text: It is between Asshur and Babylon in the land of Shinar[25]. And they called its name Overthrow.
translation:
  language: zh_hans
  text: 它位于示拿地，在亚述和巴比伦之间。人们称它为“倾覆”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倾覆”所据的埃塞俄比亚文本形式并不十分确定；这里可能是塔倒塌后所得的毁坏之名。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሱር
  choice: 亚述
