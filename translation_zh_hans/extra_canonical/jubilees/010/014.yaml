  text: And he gave all that he had written to Shem, his son, whom he loved more than all his sons.
translation:
  language: zh_hans
  text: 他把所写的一切都交给了他的儿子闪；在所有儿子中，他最爱闪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወሀበ
  choice: 他……交给了
  rationale: 直译为“他给了”；结合所写之物由父亲传给儿子的语境，用“交给”更自然，并保留交付之意。
- source_word: ኵሎ፡ ዘጸሐፈ
  choice: 所写的一切
  rationale: 对应“他所写的全部”，保持范围完整，不增添“书卷”等原文未明说的载体。
- source_word: ለሴም፡ ወልዱ
  choice: 他的儿子闪
  rationale: 保留闪的身份及所属关系，采用现代汉语常用语序。
- source_word: ዘይፈህቅ
  choice: 他最爱闪
  rationale: 该关系结构表达他所爱的人；结合比较成分，译作“最爱”，自然传达“爱胜过众子”的意思。
theological_decisions:
- issue: 对闪的爱是否带有拣选或特殊恩宠的神学含义
  choice: 仅译为父亲在众子中最爱闪
  alternative: 译为“他特别拣选/偏爱闪”
  rationale: 原文表达爱与比较，并未明确使用“拣选”概念，因此不加入额外神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号把交付文稿与对闪的爱连接起来，既清楚表达关系，又避免生硬的长定语。
