base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/018.yaml
  text: And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife whose name was Lomna, daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the counsel of wickedness to build for themselves a city and a tower in the land of Shinar.”
translation:
  language: zh_hans
  text: 第三十三个禧年，第二个七年的第一年，法勒娶了一个妻子，名叫罗姆拿，是示拿的女儿。这个七年的第四年，她为法勒生了一个儿子。法勒给儿子起名叫拉吴，因为他说：“看哪，世人因邪恶的计谋[a]而变得邪恶，要为自己建造一座城和一座塔，在示拿地[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“邪恶的计谋”与“要为自己建造”之间的句法关系可有不同理解；也可译为：“世人因邪恶的计谋变得邪恶，为自己建造一座城和一座塔。”
    reason: 保留原文不定式与前文的句法歧义，避免将“建造”断定为计谋的唯一内容。
  - marker: b
    text: 本节所给吉兹文止于“地”的属格连接形式，所限定的名称似乎被分节切到下一节；依语法和上下文补作“示拿地”。
    reason: 说明正文补足地名的文本与语法依据，不把分节造成的不完整引文当作无歧义读法。
lexical_decisions:
- source_word: እዮቤልው
  choice: 禧年
  rationale: 指《禧年书》特有的四十九年周期；采用简明且已有中文传统的称呼。
- source_word: ሱባዔ
  choice: 七年
  rationale: 本义为“七个一组”，在本书年代体系中指七年周期；译作“七年”比“周”更能让普通读者直接理解。
- source_word: ፋሌክ
  choice: 法勒
  rationale: 对应《创世记》族谱中的 Peleg，采用现代中文圣经常见译名。
- source_word: ሎምና
  choice: 罗姆拿
  rationale: 按吉兹文人名音译，保持与示拿不同。
- source_word: ሲናአር
  choice: 示拿
  rationale: 对应 Shinar，采用中文圣经通行地名。
- source_word: ራገው
  choice: 拉吴
  rationale: 对应 Reu，采用中文圣经族谱中的通行译名。
- source_word: ውሉደ፡ ሰብእ
  choice: 世人的儿女
  rationale: 较直译地保留“人的儿女/子孙”这一集体表达，同时符合现代汉语。
- source_word: በምክረ፡ ዐግ
  choice: 听从邪恶的计谋
  rationale: 原文为“借着/因着邪恶的计谋”；加入“听从”使汉语关系清楚，但不把“计谋”弱化为一般意图。
- source_word: ሀገረ፡ ወማኅፈደ
  choice: 一座城和一座塔
  rationale: 分别对应城与塔，保留巴别叙事的两个建筑对象。
theological_decisions:
- issue: “因邪恶的计谋变得邪恶”与“不轨计谋是建城造塔”的句法关系
  choice: 用分号及“那计谋就是”表明建城造塔是所说计谋的内容
  alternative: 译为“因邪恶的计谋而变得邪恶，为要建造……”
  rationale: 原文中不定式可与“计谋”紧密相连；此译避免误读为他们变恶的目的才是建造，同时保留行为本身在叙事中受到负面评价的张力。
- issue: 末尾“示拿”是否属于本节
  choice: 正文译作“示拿地”并加注说明
  alternative: 仅译“在地上”
  rationale: 现存引文止于处于属格连接形态的“地”，语法上预期后接限定语；上下文和紧邻文本支持“示拿”，但因分节边界证据不完整，以脚注交代。
- issue: 引文开头“ትውልድ፡ ለዕለተ፡ ደይን”
  choice: 不纳入本节正文
  alternative: 译作“世代，直到审判之日”置于本节开头
  rationale: 该短语在语义与句法上显然是前一节结尾的残片；本节年代公式从“第三十三个禧年”开始，符合经节解析及英译审校层。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“禧年”“七年”清楚呈现本书年代体系；叙事句式避免古奥文言。“看哪”保留宣告语气。人名、地名优先采用中文圣经通行形式。所有脚注标记均置于相关正文位置。
