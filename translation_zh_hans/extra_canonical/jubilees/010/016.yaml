  text: And he was buried in Lubar, a mountain in the land of Ararat. He completed nine hundred and fifty years in his life.
translation:
  language: zh_hans
  text: 他被葬在亚拉腊地的鲁巴山上。他一生共度过了九百五十年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተቀብረ
  choice: 葬在
  rationale: 该被动动词表示“被埋葬”；汉语以“他葬在……”自然表达被葬于某地，不改变其受事意义。
- source_word: ሉባር፡ ደብር
  choice: 鲁巴山
  rationale: 将专名音译为“鲁巴”，并把表示山岳的“ደብር”译作“山”；源文结构支持将鲁巴理解为山名。
- source_word: በምድረ፡ አራራት
  choice: 亚拉腊地的
  rationale: “ምድር”意为土地、地区；译作“亚拉腊地”比“亚拉腊国”更少加入政治含义。
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ
  choice: 他一生共度过了九百五十年
  rationale: 直译为“他在其生命中完成了九百五十年”；现代汉语用“一生共度过了”自然传达寿数圆满之意。
