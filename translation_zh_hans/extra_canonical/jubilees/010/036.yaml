  yaml_path: translation/extra_canonical/jubilees/010/036.yaml
  text: And he dwelt in the land of Media, near his wife’s brothers, until this day. And he called his dwelling-place, and the dwelling-place of his sons, Media, after Madai their father.
translation:
  language: zh_hans
  text: 他住在米底地，靠近他妻子的弟兄，直到今日。他把自己的居住地和众子的居住地都称为“米底”，取名自他们的父亲玛代。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ሜድቂን
  choice: 米底地
  rationale: 指玛代及其后裔所居之地；采用现代中文中通行的地名“米底”，同时保留与人名“玛代”的区别。
- source_word: አኀወ፡ ብእሲቱ
  choice: 他妻子的弟兄
  rationale: 原文“弟兄”是复数；用较庄重而自然的“弟兄”准确保留这一数的信息。
- source_word: ምገባሪሁ፡ ወምገባረ፡ ውሉዱ
  choice: 自己和众子的居住地
  rationale: 原文先说他的居处，再说其众子的居处；中文合并表达以避免累赘，但保留两者范围。
- source_word: ማዳይ
  choice: 玛代
  rationale: 作为专名音译，并与地名“米底”区分，符合中文圣经人名惯例。
