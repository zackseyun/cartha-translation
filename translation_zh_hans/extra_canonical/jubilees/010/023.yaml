  text: And the Lord went down, and we went down with him, to see the city and the tower that the sons of men had built. And he confused all their tongues, and they no longer heard one another’s speech, and they ceased building the city and the tower. Therefore the whole land of Shinar was called Babel, because there the Lord confused all the tongues of the sons of men, and from there they were scattered into their cities, each according to his tongue and according to his nation.
translation:
  language: zh_hans
  text: 主降下来，我们也同他一起降下来，要察看世人所建的城和塔。他使他们的一切语言混乱，使他们彼此不再听见对方的话；于是，他们停止建造那城和塔。因此，示拿全地名叫巴别[a]，因为主在那里使世人的一切语言混乱；他们又从那里分散到各自的城邑，各按自己的语言和民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴别”在这里与“混乱”相联系，是按本段叙事所作的名称解释。
    reason: 说明文本中的词源关联，同时不把叙事性词源说明误当作现代语言学结论。
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 主
  rationale: 这是该书叙事中对上帝的常用称谓；译作“主”自然、庄重，也与上下文相符。
- source_word: ወረደ / ወወረድነ
  choice: 降临／一起降临
  rationale: 保留原文中“主降下、我们也随同降下”的空间意象及第一人称复数叙述。
- source_word: ውሉደ፡ ሰብእ
  choice: 世人
  rationale: 字面为“人的儿女／众人之子”，在此泛指人类；“世人”既自然，又不额外限定性别。
- source_word: ሀገረ፡ ወማኅፈደ
  choice: 城和塔
  rationale: 结合巴别叙事和英语审校层，将第二个名词理解为所建的塔；保留两个建筑对象。
- source_word: ልሳናቲሆሙ
  choice: 他们的语言
  rationale: 原词可指舌头或语言；语境明确涉及言语沟通，译作“语言”最自然。
- source_word: አህጉሪሆሙ
  choice: 各自的城邑
  rationale: 此处指他们散往的聚居地或城邑；采用“城邑”以保留古代叙事色彩，同时避免现代行政区含义。
- source_word: በበ፡ ሕዝቢሆሙ
  choice: 各按自己的……民族而居
  rationale: 保留按语言与族群分散的平行结构；补出“而居”使现代汉语句意完整。
theological_decisions:
- issue: 第一人称复数“我们”所指
  choice: 保留“我们”，不解释其身份
  alternative: 解释为天使、天上议会或神圣众者
  rationale: 原文明确使用第一人称复数，却未在本句界定说话群体；保留其开放性，避免导入特定神学体系。
- issue: 主“降临”的拟人化空间表述
  choice: 直接保留“降临”
  alternative: 弱化为“主前来察看”
  rationale: 原文重复“降下”的动作；直译能保存叙事意象和神学张力，不将其改写为抽象的全知表述。
- issue: 语言混乱的施动者
  choice: 明确译为“他使……混乱”并在解释地名处写“主”
  alternative: 使用无主句“语言发生混乱”
  rationale: 原文将行动直接归于主；译文不应淡化这一因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以“察看”“城邑”等词保留古典经书语感，但避免过度文言化。句法清晰呈现降临、察看、混乱、停建、命名和分散的连续因果关系。
