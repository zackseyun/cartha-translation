  text: In rebellion you have dwelt, and in rebellion your children will fall, and you will be uprooted forever. Do not dwell.
translation:
  language: zh_hans
  text: 你们曾居于悖逆中；你们的子孙也必在悖逆中倒下；你们必永远被连根拔除。不可居住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句仅为“不可居住”，没有说明所禁止居住的地点或宾语。
    reason: 说明原文否定命令中省略的地点／宾语，避免读者误以为中文漏译。
lexical_decisions:
- source_word: በሀከከ
  choice: 在悖逆中
  rationale: 依照该词在本句中的训诂取义为“悖逆、叛乱”，并保留原文两次重复所形成的谴责语气。
- source_word: ኀደርክሙ
  choice: 你们……居住
  rationale: 按完成式表达已经发生的行为；汉语不另加“曾经”，以免语气累赘，但由上下文呈现既成事实。
- source_word: ይወድቁ
  choice: 必……倒下
  rationale: 保留“跌倒、倒下”的具体意象及将来指向，不扩释为死亡或灭亡。
- source_word: ወትሴር
  choice: 必……被连根拔除
  rationale: 采用表示拔除、根除的被动表达，保留原文强烈而具体的审判意象。
- source_word: ለዓለም
  choice: 永远
  rationale: 在句法上修饰“被连根拔除”，与其紧邻位置及完整谓语结构相符。
- source_word: ኢትኅደር
  choice: 不可居住
  rationale: 保留原文简短的否定命令及未明说地点的突兀感，不擅自补入“闪的住处”等原文没有的内容。
theological_decisions:
- issue: “永远”的修饰范围
  choice: 修饰“被连根拔除”
  alternative: 修饰“你们的子孙倒下”
  rationale: 原文中“永远”紧接在“你们必被拔除”之后；如此处理也避免省略独立动词 ወትሴር。
- issue: 末句所禁止居住的地点
  choice: 正文不补明地点
  alternative: 补作“不可住在那里”或引入闪及其产业
  rationale: 本节所给吉兹文本只有简短的“不可居住”，补出具体地点会超出源文证据；以脚注说明其省略性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“悖逆”的重复、子孙“倒下”以及“被连根拔除”的审判意象；末句维持原文的简短和语义悬置。
