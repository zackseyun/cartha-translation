base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/030.yaml
  text: 'And Ham his father, and Cush and Mizraim his brothers, said to him: ''Because you have settled in a land which is not yours, and which did not fall to you by lot, do not do so; for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.'''
translation:
  language: zh_hans
  text: 他的父亲含，以及他的兄弟古实和麦西，对他说：“你住在不属于你的土地上，那地也不是抽签分给你的。不要这样做；因为你若这样做，你和你的众子必在那地倒下，并因悖逆而受咒诅。你既因悖逆住在那里，你的众子也必因悖逆而倒下；你也必永远被拔除。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹文摘录在本节末句中途截止；“你既因悖逆住在那里……”以下根据查尔斯版所对应的完整经文及经审核的英文审校记录补足。
    reason: source_excerpt_truncated
lexical_decisions:
- source_word: ካም፡ አቡሁ
  choice: 他的父亲含
  rationale: 按原文的亲属关系与语序表达；“含”采用现代中文圣经传统通行译名。
- source_word: ኩስ፡ መውጽሬም
  choice: 古实、麦西
  rationale: 采用现代中文圣经传统中较通行的人名形式，分别对应 Cush 与 Mizraim。
- source_word: ምድር፡ እንተ፡ አኮነ፡ እንቲአከ
  choice: 不属于你的土地
  rationale: 直译“不是你的地”，用自然现代汉语表达其归属含义。
- source_word: ኢወፀአ፡ ለከ፡ በዕፁ
  choice: 也不是抽签分给你的
  rationale: 保留“以签所得份地”的古代分地背景，同时使普通读者容易理解。
- source_word: ትወድቁ፡ ውስተ፡ ምድር
  choice: 必在那地败落
  rationale: 保留“坠落／倒下”的意象，又避免中文被误解为单纯身体跌倒。
- source_word: ሀከከ
  choice: 悖逆
  rationale: 该词在语境中指叛逆、反抗；“悖逆”既庄重又能保留道德与盟约性的张力。
- source_word: be uprooted（由校订所据完整经文补足）
  choice: 被拔除
  rationale: 保留原有连根拔起的强烈意象，不弱化为一般的“离开”或“消失”。
theological_decisions:
- issue: 土地归属与抽签分配
  choice: 分别译出“不属于你的土地”与“不是抽签分给你的”
  alternative: 合并为“住在未分给你的土地上”
  rationale: 原文并列归属与抽签两个概念；分别表达可保留其法律及神学张力，而不解释抽签背后的施行者。
- issue: “败落”与咒诅的关系
  choice: 按并列结果表达，不说明咒诅是谁施加的
  alternative: 译成“上帝必使你们败亡并咒诅你们”
  rationale: 原文使用结果性／被动性表达，未在本句明说施行者，因此不补入“上帝”。
- issue: 悖逆的性质
  choice: 保留“悖逆”，不具体说明是违抗父命、土地分配还是上帝旨意
  alternative: 译成“违抗上帝的命令”
  rationale: 上下文可容纳多层指向，译文不应把原文未明说的对象单一化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留土地抽签、悖逆、咒诅和拔除等核心意象；避免加入原文未明说的神学施事者。脚注标记已在正文中以[a]标出。
