  yaml_path: translation/extra_canonical/jubilees/010/020.yaml
  text: And they began to build, and in the fourth week they made brick with fire, and the bricks served them as stone, and the clay with which they plastered was asphalt that comes out of the sea and from the springs of water in the land of Shinar.
translation:
  language: zh_hans
  text: 他们开始建造。到了第四周，他们用火烧制砖块，砖块在他们看来如同石头；他们用来涂抹的泥料，是从海中和示拿地的水泉中涌出的沥青。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሕንጹ
  choice: 建造
  rationale: 按其建筑语境直译，简明自然。
- source_word: በሱባዔ ራብዕ
  choice: 到了第四周
  rationale: 保留《禧年书》以“周”为时间单位的表达；加“到了”使汉语时序自然。
- source_word: ንንፈሱ በእሳት
  choice: 用火烧制砖块
  rationale: 源文表示以火处理、烧成砖；译作现代汉语常用的“烧制砖块”。
- source_word: ከመ እብን
  choice: 以砖代石
  rationale: 凝练表达砖块对他们起石头作用的原意。
- source_word: አስፋሌጦስ
  choice: 沥青
  rationale: 指天然沥青（bitumen/asphalt），在古代建筑中用作黏结和抹缝材料。
- source_word: እምነ ባሕር ወእምአንቅዐተ
  choice: 从海中和……泉源涌出
  rationale: 保留物质来自海与泉源的并列结构，并以“涌出”呈现来源动态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；“第四周”保留作品特有的纪年方式。“抹缝”比泛称“涂抹”更贴合古代砖筑中沥青作为黏结、填缝材料的语境。源文所给片段末尾止于“泉源”，而英文审校层补有“示拿地”；本稿依据该节完整传本文本与审校层保留此地名，但不添加解释性脚注。
