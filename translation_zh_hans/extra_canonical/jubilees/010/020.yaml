  source_fidelity: “抹缝”将源文及英文审校层的“plastered”（涂抹、涂敷）收窄为填缝，属于未经文本明示的建筑技术限定。改为“涂抹”保留原文的较宽泛表达。其余主要信息——开始建造、第四周、火烧砖、砖代石、沥青的来源及示拿地——均得到保留。
  naturalness: 原译整体自然庄重。修订后以“用来涂抹的泥料”对应原文结构，虽保留“泥料是沥青”这一古代材料表述上的张力，却不擅自调和或解释它；“水泉”比单称“泉源”更贴近英文“springs of water”。
  terminology: “烧制砖块”“以砖代石”“沥青”“示拿地”均适切。“周”保留《禧年书》本身的时间单位，不改作现代历法的“星期”。
