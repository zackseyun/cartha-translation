  text: before the holy prince, and before Noah our father. But he did not listen to them, and he dwelt in the land.
translation:
  language: zh_hans
  text: 在圣洁的首领面前，也在我们祖先挪亚面前。他却不听从他们，住在那地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ ቅዱስ
  choice: 圣洁的首领
  rationale: መኰንን可指掌权者、首领或审判官；此处保留英语审校层所体现的“prince”之统领含义，同时避免采用带特定爵位色彩的“王子”。
- source_word: ኖኅ፡ አቡነ
  choice: 我们的先祖挪亚
  rationale: አቡነ直译为“我们的父亲”，此处是对挪亚的祖先式称呼；译作“我们的先祖”更符合现代汉语表达，并保留群体祖源关系。
- source_word: ኢሰምዖሙ
  choice: 不听从他们
  rationale: 动词本义为“听”，在涉及人的宾语时语境含有“不听劝、不服从”之意；“不听从”自然表达这一语用含义，并保留复数代词“他们”。
- source_word: ኀደረ፡ ምድረ
  choice: 仍住在那地
  rationale: ኀደረ表示居住、停留，ምድረ表示土地或地域；“住在那地”忠实简洁。“仍”承接前句的拒绝语气，不增添新的地点信息。
theological_decisions:
- issue: “我们的父亲”作为挪亚称号的理解
  choice: 译作“我们的先祖挪亚”
  alternative: “我们的父亲挪亚”
  rationale: 这里表达共同祖先身份，而非直接父子关系；采用现代汉语中清楚自然的亲缘称谓，不引入额外神学判断。
- issue: 开头短语中后缀代词的处理
  choice: 只译“在那位圣洁的首领……面前”
  alternative: “在他面前，在那位圣洁的首领面前”
  rationale: በቅድሜሁ中的后缀与后续由ለ引出的名词构成前指结构，不应重复译出一个独立的“他”；此处理也符合最新语法审校。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。保留原文片段式的开头结构，不补入来源中没有的地点范围、子孙或时间信息；用“他却……仍……”自然呈现转折和持续居住的关系。
