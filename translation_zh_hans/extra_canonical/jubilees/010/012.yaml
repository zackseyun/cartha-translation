  text: We left them so that they might be subject before Satan on the earth. And the remedy for all their diseases...
translation:
  language: zh_hans
  text: 我们留下了他们[a]，使他们在地上受撒但辖制；以及他们一切疾病的医治……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按上文语境译作“我们留下了他们中的十分之一”；“十分之一”并未明说在本节所给的吉兹语中。
    reason: 说明上下文可能隐含的数量，但不将其补入本节正文。
  - marker: b
    text: 本节所给原文到此为未完成的名词短语，直译近于“以及他们一切疾病的医治……”。
    reason: 保留来源文本的截断状态，并表明此处是名词“医治”，不是“我们医治了”。
lexical_decisions:
- source_word: አተርፍነ
  choice: 我们留下了他们
  rationale: 该动词为第一人称复数“我们留下／使……存留”；宾语由语境补出，但本节所给吉兹语没有明说“十分之一”。
- source_word: ይትኰነኑ፡ ቅድመ፡ ሰይጣን
  choice: 归撒但管辖
  rationale: 表达在撒但面前受其支配、隶属其权下的意思；避免将其过度明确为司法意义的“受审判”。
- source_word: ዲበ፡ ምድር
  choice: 在地上
  rationale: 直接对应“在／于地上”。
- source_word: ወፈውሰ፡ ደዌሆሙ፡ ኵሎ
  choice: 还有医治他们一切疾病的疗法……
  rationale: ፈውስ 在此按名词“医治、疗法”处理，而非第一人称复数动词“我们医治了”；原文片段止于未完的名词短语，故保留省略号。
theological_decisions:
- issue: 邪灵与撒但的从属关系
  choice: 归撒但管辖
  alternative: 在撒但面前受审判
  rationale: 词形和上下文较支持受支配、受管辖之意，但不把这种关系扩展成特定宗派的撒但论。
- issue: 留下者的数量
  choice: 正文不补“十分之一”
  alternative: 我们留下了他们中的十分之一
  rationale: “十分之一”可由前文语境理解，却不在本节所提供的吉兹语字面中；正文从现有原文，脚注说明语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“疗法”使未完名词短语在中文中自然可读；省略号保留所给原文截断的性质。
