  text: For he loved him more than all his sons. And Noah slept with his fathers.
translation:
  language: zh_hans
  text: 因为他爱他胜过爱自己的众子。挪亚与他的列祖同睡了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪያሁ
  choice: 他
  rationale: 这是独立宾格代词“他”，原文在本节没有明说所指，因此正文保留代词，不擅自补作“亚法撒”或其他名字。
- source_word: ያፈቅር
  choice: 爱
  rationale: 直接表达动词“爱”的含义，符合现代汉语。
- source_word: ፈድፋደ እምኵሉ ውሉዱ
  choice: 胜过爱自己的众子
  rationale: 表达比较结构“比他所有的儿子更……”，在汉语中补出第二个“爱”以使比较关系清楚；“自己的”指向隐含主语。
- source_word: ወኖመ ኖኅ ምስለ አበዊሁ
  choice: 挪亚与他的列祖同睡了
  rationale: 保留“与列祖同睡”这一传统死亡委婉语及其源文意象，不扩写本节未载的埋葬信息。
theological_decisions:
- issue: 代词“他”的具体所指
  choice: 正文保留“他”
  alternative: 按上下文补出某个人名
  rationale: 本节吉兹文只有宾格代词，明确命名会消除源文自身的指代依赖，并可能造成误译。
- issue: “与列祖同睡”的表达
  choice: 保留传统委婉语“与他的列祖同睡了”
  alternative: 意译为“死了”
  rationale: 直译既能让现代读者理解为死亡，也保存古代叙事的固定表达及其文学、神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众子”略带经文文体色彩，但仍通俗易懂；不沿用英文咨询层中已被审校否定的“亚法撒”脚注，因为吉兹文本明确使用代词而非专名。
