lexical_decisions:
- source_word: ነፋሰ፡ ዐቢየ
  choice: 一阵狂风
  rationale: 直译为“大风”；“狂风”在现代汉语中自然表达其强劲和破坏力。
- source_word: ማኅፈድ
  choice: 那塔
  rationale: 依该词在巴别塔叙事中的语境取“塔”，并以“那”指向上下文已知之塔。
- source_word: ውስተ
  choice: 向
  rationale: 该介词字面范围较宽；此处结合风与塔的关系，译作“向……刮起”，自然表达风冲击塔，而不误作“进入”。
- source_word: ወገፍታአ
  choice: 把塔掀倒
  rationale: 表达阴性宾语后缀所回指的塔及“推翻、倾覆”的动作；重复“塔”可避免汉语代词指代不明。
- source_word: ወናሁ
  choice: 看哪
  rationale: 保留叙事中的引介词及其悬接下文的功能。
