  yaml_path: translation/extra_canonical/jubilees/010/005.yaml
  text: But bless me and my sons, that we may increase and multiply and fill the earth.
translation:
  language: zh_hans
  text: 但求你赐福给我和我的儿子们，使我们生养众多，遍满大地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bless
  choice: 赐福
  rationale: 用现代中文圣经语体中自然且庄重的表达，保留由上位者施福的含义。
- source_word: increase and multiply
  choice: 生养增多
  rationale: 以简洁、熟悉的中文表达再现人口繁衍与数目增长这一成对概念。
