base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/007.yaml
  text: And let them not rule over the spirits of the living, for you alone know their judgment; and do not let them have power over the sons of the righteous from now and forevermore.”
translation:
  language: zh_hans
  text: 不要让它们辖制活人的灵，因为惟有你知道对它们的判决；从今直到永远，也不要让它们有权辖制义人的众子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spirits of the living
  choice: 活人的灵
  rationale: 保留属格结构及其可能的指涉范围，不擅自改成“活人”或“活着的灵”。
- source_word: rule over / have power over
  choice: 辖制 / 有权辖制
  rationale: 分别呈现两个近义表达，同时保持后半句对权柄的强调。
