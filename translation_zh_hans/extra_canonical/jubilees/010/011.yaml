base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/011.yaml
  text: 'He knew that they were not walking in uprightness and were not striving in righteousness. And we acted according to all his word: all the evil ones that were cruel we bound in the place of judgment, and a tenth of them'
translation:
  language: zh_hans
  text: 他知道，他们行走并不刚强，争战也不凭公义。[a]我们便照他一切的话而行：凡凶残的恶者，我们都捆绑在审判之地；至于他们的十分之一——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的吉兹文语句艰涩。“行走并不刚强”也可能在上下文中带有并非正直行事的伦理含义；本译文保留较贴近字面的措辞，不将该解释确定化。
    reason: 说明原文开头的句法和词义不确定性，并避免正文将一种伦理性解释当作唯一含义。
lexical_decisions:
- source_word: ያአምር
  choice: 他知道
  rationale: 按该动词的第三人称阳性单数形式直译，并遵循本节现存吉兹文的起点，不把上一节有关挪亚和药方的文字移入本节。
- source_word: ዘየሐውሩ
  choice: 他们行事
  rationale: 该形式以“行走”为基本义；现代汉语用“行事”自然表达其伦理语境，同时避免生硬直译为脚步上的行走。
- source_word: በጽድቅ
  choice: 合公义
  rationale: 保留“公义”这一伦理及神学意味较强的词，不弱化为一般的“合理”或“公平”。
- source_word: ገበርነ፡ በከመ፡ ኵሉ፡ ቃሉ
  choice: 我们便照他一切的话而行
  rationale: 保留第一人称复数及“照着他全部话语”的结构；“他”的指代在上下文中保持原有状态，不擅自明说所指。
- source_word: እኩያነ
  choice: 恶者
  rationale: 以人格化复数“恶者”对应邪恶的灵体，而非抽象的“邪恶”。
- source_word: መካነ፡ ደይን
  choice: 审判之地
  rationale: 较形式地保留“地方/处所”与“审判”的组合。
- source_word: ወዓሥራተሙ
  choice: 至于他们的十分之一——
  rationale: 原文在本节末只给出“和/而他们的十分之一”，句意延续至后文；用破折号保留未完结构，而不补入本节未载的谓语。
theological_decisions:
- issue: 本节开头困难短语的伦理含义
  choice: 他们行事并不正直，争战也不合公义
  alternative: 他们行走并不刚强，也不是凭公义争战
  rationale: 吉兹文开头的句法和词义关系困难。“行事不正直”依上下文表达总体伦理意义，但以脚注明确提示“刚强”等更贴近表层词义的可能，避免把解释伪装成确定文本。
- issue: “他”的身份
  choice: 保留代词“他”
  alternative: 明确译为“挪亚”或其他人物
  rationale: 本节本身只用第三人称指代；不依据解释传统擅自补明身份。
- issue: 末尾“十分之一”的处置
  choice: 保留为承接下节的未完句
  alternative: 补写其获准留下或受支配等后续内容
  rationale: 忠实保留所给本节的边界及语法悬置，不从下一节预先补足神学叙事。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“公义”“审判之地”“恶者”等词保留经卷语域；不把属于上一节的“教导挪亚各种药方”等内容并入本节。末尾用破折号显示原文句子在本节边界处尚未完成。
