lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: 审判之地
  rationale: 按名词短语直译为“审判之地”，不补入原文没有的系词或“设立”等动词，并保留残篇开头的不完整性。
- source_word: ወለአሐዱ፡ እምኔነ፡ ይቤ
  choice: 我们中有一位说
  rationale: 自然而贴近原文地表达“我们之中的一位说”。
- source_word: ከመ፡ ንምሀር፡ ለኖኅ
  choice: 让我们……教给挪亚
  rationale: 以劝勉式“让我们”表达第一人称复数意愿式，并明确挪亚为受教者。
- source_word: ኵሎ፡ ፈውሶሙ
  choice: 医治他们的一切方法
  rationale: ፈውስ 可指医治、疗法或药方；此处采用自然的集合表达，同时保留“他们”这一代词指向。
- source_word: እስመ
  choice: 因为
  rationale: 该连接词引出原因，但现存所给文本在此中断，故以省略号保留未完句。
theological_decisions:
- issue: 开头残句是否补出谓语
  choice: 保留“审判之地”为独立残片
  alternative: 译作“审判之地被设立了”
  rationale: 所给吉兹文本只有名词短语，没有明示“设立”或其他谓语；不应为使句子完整而增补神学或叙事内容。
- issue: “他们”的指代
  choice: 保留代词，不在正文中释明对象
  alternative: 按上下文明确译为“邪灵”或“人的儿子们”
  rationale: 本节片段本身没有显明先行词；保留代词可避免消除原文与分节造成的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“审判之地”保留残篇形态；引语使用自然的劝勉句式。正文中的省略号明确反映源文本片段未完，而非自行补足其原因。
