base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/013.yaml
  text: And we told Noah all their medicines, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book, all the kinds of healing remedies, and the spirits were restrained.
translation:
  language: zh_hans
  text: 我们把它们所有的药物都告诉了挪亚，使他们可以借着地上的植物得到医治。挪亚把我们教给他的一切，就是各种医治方法，都写在一本书里；众灵也受了约束。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገርናሁ
  choice: 我们……告诉了挪亚
  rationale: 按动词第一人称复数及宾语后缀直译，保留叙述者群体的声音。
- source_word: አስሕተትሙ
  choice: 它们所有的药方
  rationale: 语境指针对前述灵所致病患的药物或疗法；译作“药方”比“药品”更能涵盖下文各种医治之法，同时保留代词所指的含混。
- source_word: ዕፀወ፡ ምድር
  choice: 地上的植物
  rationale: 源语直指大地的植物；用现代汉语自然表达，不缩窄为某类药草。
- source_word: ትዝምደ፡ ፈውሳት
  choice: 各种医治之法
  rationale: 表达治疗或疗法的不同类别，避免生硬的“医治的种类”。
- source_word: መናፍስት
  choice: 众灵
  rationale: 原文仅作“灵”的复数，并未在本节明说“邪灵”，故不增补性质判断。
- source_word: ተዐጸዉ
  choice: 受到了约束
  rationale: 体现被动和限制、封禁之意，同时不添加原文此处未明说的对象或范围。
theological_decisions:
- issue: 众灵的道德性质
  choice: 译作“众灵”
  alternative: “邪灵”
  rationale: 虽然上下文或可表明其有害性质，本节源语只写“灵”，应避免把语境推论直接写入正文。
- issue: 医治对象的指代
  choice: 译作不特指的“使人可以……得到医治”
  alternative: “使他们可以……得到医治”
  rationale: 源语动词为第三人称复数，但具体先行词在本节内部并不充分明确；汉语用泛指“人”可自然表达其医疗目的，又不强行指定某一群体。
- issue: 众灵受到约束的范围
  choice: 不补充约束的对象或行动
  alternative: “不再追随挪亚的儿子们”
  rationale: 该补语不见于所给吉兹文，故保持本节原有的简洁和开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“药方”“医治之法”相互照应；分号呈现写书与众灵受约束之间紧密但未明说的逻辑关系。无脚注标记。
