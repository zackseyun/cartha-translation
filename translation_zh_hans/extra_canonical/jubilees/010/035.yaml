  yaml_path: translation/extra_canonical/jubilees/010/035.yaml
  text: That land was named Canaan. And Japheth and his sons went toward the sea and dwelt in the land of their portion. And Madai saw the land of the sea[35], and it did not please him, and he asked from Elam and Asshur and Arpachshad, the brothers of his wife, a portion, and he dwelt there.
translation:
  language: zh_hans
  text: 那地被称为迦南。雅弗和他的儿子们往海边去，住在分给他们的那份土地上。玛代看见海边之地[a]，却不喜欢；他便向以拦、亚述和亚法撒——他妻子的兄弟们——求一份土地，并住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文关于玛代及“他妻子的兄弟们”的句法结构较生硬。“他妻子的兄弟们”为复数，看来指以拦、亚述和亚法撒三人；也有人把婚姻关系特别理解为与亚法撒有关。
    reason: segmentation_note
lexical_decisions:
- source_word: ተሰምየት፡ ይእቲ፡ ምድር፡ ከናአን
  choice: 那地名叫迦南
  rationale: 按被动式“被称为”和指示语“那地”直译，同时采用现代汉语自然句式。
- source_word: መንገለ፡ ባሕር
  choice: 往海边去
  rationale: መንገለ 表方向，ባሕር 指海；“往海边去”兼顾方向意义和汉语可读性。
- source_word: ምድረ፡ መክፈልቶሙ
  choice: 分给他们的那份土地
  rationale: 保留“份额、分得之地”的分配含义，不把它具体化为政治疆域。
- source_word: ምድረ፡ ባሕር
  choice: 海边之地
  rationale: 保留原文简略的属格结构；不擅自确定为某一特定海域或沿海国家。
- source_word: አኀወ፡ ብእሲቱ
  choice: 他妻子的兄弟们
  rationale: አኀወ 是复数构造形式，故以复数“兄弟们”表达，并使其与前列的以拦、亚述和亚法撒相连。
- source_word: አስተብቍዓ
  choice: 求一份土地
  rationale: 依上下文表达请求取得份地之意；补出“土地”是为承接本节反复出现的分地语境。
theological_decisions:
- issue: 玛代妻子兄弟的指称范围
  choice: 把以拦、亚述和亚法撒三人共同解释为“他妻子的兄弟们”
  alternative: 仅把亚法撒解释为“他妻子的兄弟”
  rationale: 原文 አኀወ 为复数，语法上更自然地指向前列三人；但原句结构较生硬，因此以脚注提示。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“海边之地”的概括性和原句婚姻关系的张力；用破折号标明同位说明，避免误读为另一个未具名群体。
