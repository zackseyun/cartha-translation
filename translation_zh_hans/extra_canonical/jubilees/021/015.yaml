base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/015.yaml
  text: Keep this command and do it[15], my son, so that you may walk rightly in all your deeds. And at all times be pure in your body, and wash yourself with water before you go up to offer on the altar; and wash your hands and your feet before you approach the altar; and when you have finished offering, return.
translation:
  language: zh_hans
  text: 我儿，你要谨守这条命令，照着去行，好使你所做的一切都合乎正道。你要时刻保持身体洁净；上去在祭坛上献祭以前，要用水洗身；走近祭坛以前，要洗手洗脚；献完以后，就回去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有吉兹文分段在本节之后直接标作第17节，没有单列第16节；因此这里也不另立第16节。
    reason: segmentation_note
lexical_decisions:
- source_word: ዑቅ፡ ዛተእዛዘ፡ ወገብራ፡
  choice: 谨守这条命令，照着去行
  rationale: 兼顾“守住／谨守”命令与实际遵行两个并列动作，避免只译为抽象的服从。
- source_word: ከመ፡ ታርትዕ፡ በኵሉ፡ ግብርከ።
  choice: 好使你所做的一切都合乎正道
  rationale: 将表示端正、正直的动词自然译为“合乎正道”，同时保留目的关系及“所有行为”的范围。
- source_word: ኩን፡ ንጹሐ፡ በሥጋከ፡
  choice: 保持身体洁净
  rationale: 这里的洁净与献祭前洗濯相关，译作“洁净”可保留礼仪与身体清洁两方面的含义。
- source_word: ለአዕርጎ፡ ውስተ፡ ምሥዋዕ፡
  choice: 上去在祭坛上献祭
  rationale: 保留动词“上去／使之上升”的空间意象，并按祭坛语境将献上之举译为“献祭”。
- source_word: ግባእ፡
  choice: 回去
  rationale: 该命令式在此表示返回、回去，而不是“进去”；采用自然且不增添目的地的译法。
theological_decisions:
- issue: 身体洁净的性质
  choice: 用“洁净”表述，不限定为单纯卫生或特定宗派的礼仪状态
  alternative: 保持身体清洁
  rationale: 上下文明确涉及献祭前的洗濯，但原文没有系统界定其神学性质；“洁净”能够保留这种礼仪张力。
- issue: 祭坛动作的表达
  choice: 译为“在祭坛上献祭”
  alternative: 把祭物献上祭坛
  rationale: 原文可突出“使之上升／献上”的动作，但没有在本句明说祭物；正文采用自然概括，避免补出未经明示的宾语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以第二人称训诫语气呈现父亲对儿子的劝命，并用分号清楚排列献祭前后的洁净步骤。
