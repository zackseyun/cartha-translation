translation:
  language: zh_hans
  text: 野兽、牲畜和空中一切飞鸟的血。你若宰杀祭牲，献作蒙悦纳的平安祭[a]，就要把它宰杀，将它的血浇在祭坛上；你所献祭牲的一切脂油，也要和调油的细面一同献在祭坛上；还要连同奠酒，全都一起献在祭坛上，作为献在……面前的馨香之祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献作可蒙悦纳的平安祭”。
    reason: “蒙悦纳的”描述该平安祭可被接纳；脚注保留较直译的表达，并避免将其误解为“感恩平安祭”。
lexical_decisions:
- source_word: አርዌ፡ ወዘእንስሳ
  choice: 野兽、牲畜
  rationale: 分别保留野生动物与家畜的类别，符合上下文关于动物之血的列举。
- source_word: ጽንሓሐ፡ ሰላም
  choice: 平安祭
  rationale: 该词组指和平、和睦类祭牲；采用现代中文圣经语体中通行且易懂的“平安祭”。
- source_word: ዘይሰጠው
  choice: 蒙悦纳的
  rationale: 原词表达“被接受、蒙接纳”，并非“感恩”；译文保留其受悦纳之意。
- source_word: ጽንሑክ
  choice: 你所献祭牲
  rationale: 体现原文第二人称单数所属成分，不省略“你的”这一语义。
- source_word: ትክዐዉ
  choice: 浇
  rationale: 按主动动词处理，译为献祭者把血浇在祭坛上，而非被动结果句。
- source_word: ስንዳሌ፡ ልውሰ፡ በቅብዕ
  choice: 调油的细面
  rationale: 简明表达细面与油混合的祭物构成。
- source_word: ሞ፟ጻሕቱ
  choice: 奠酒
  rationale: 此处指随祭牲同献的液体奠祭；“奠酒”比抽象的“奠祭”更具体自然。
- source_word: መዐዛ፡ ሠናይ
  choice: 馨香之祭
  rationale: 保留祭祀语境中的“美好、悦人的香气”，采用庄重而熟悉的中文表达。
theological_decisions:
- issue: ዘይሰጠው所表达的祭物性质
  choice: 蒙悦纳的平安祭
  alternative: 感恩平安祭
  rationale: 词义核心是“蒙接纳、被悦纳”，没有足够原文依据将其限定为感恩祭。
- issue: 经节末尾句法残缺
  choice: 以“献在……面前”保留未完结构
  alternative: 补出“献在主面前”等宾语
  rationale: 所给吉兹语文本止于“面前”，宾语落在后续文本；不擅自补明可避免越过本节源文证据。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀语汇；保留本节开头承接上文、结尾未完待续的形态。
