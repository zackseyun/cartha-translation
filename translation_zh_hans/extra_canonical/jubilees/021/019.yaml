- from: 绝不可吃血，因为血就是生命；也不可吃任何血。不可因任何人的血而收受礼物[a]，免得人血被白白流出而不予审判[b]；因为流出的血会玷污大地，若不流那流血之人的血，大地就不能从人的血中得洁净。
  to: 绝不可吃血，因为血就是生命；也不可吃任何血。不可为任何人的血收受礼物[a]，免得人的血白白流出，流血者却不受审判[b]；因为流出的血会玷污大地，大地不能因人的血得洁净，除非流出那流人血者的血。
