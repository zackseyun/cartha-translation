  text: blood at all, because it is the life; and do not eat any blood. And do not accept a gift concerning any human blood, lest it be shed with impunity, without judgment; for it is the blood that is shed which pollutes the earth, and the earth cannot be cleansed from the blood of a man except by the blood of the one who shed it.
translation:
  language: zh_hans
  text: 绝不可吃血，因为血就是生命；也不可吃任何血。不可为任何人的血收受礼物[a]，免得人的血白白流出，流血者却不受审判[b]；因为流出的血会玷污大地，大地不能因人的血得洁净，除非流出那流人血者的血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”在这里可能指就血债所付的贿赂或偿金。
    reason: 说明该词在司法语境中的可能含义，同时保留正文“礼物”的较宽泛词义。
  - marker: b
    text: 也可译作“免得人的血流出而无人受审判”或“免得流血者逍遥法外”。
    reason: 明确“白白”与“没有审判”所表达的无惩罚、无追究含义，并保留原句的表达弹性。
lexical_decisions:
- source_word: ነፍስ
  choice: 生命
  rationale: 此处指血所承载的生命，而非现代汉语通常所说的“灵魂”；译作“生命”自然且符合祭祀与禁血语境。
- source_word: ሕልያነ
  choice: 礼物
  rationale: 保留原词较宽的“礼物、馈赠”含义；在本语境中可能特指为血债所付的贿赂或偿金，故以脚注说明。
- source_word: ይትከዐው
  choice: 被……流出／流出的
  rationale: 该动词表示血被倾倒、流出；不译作“追讨”或“索取”。
- source_word: በከ
  choice: 白白
  rationale: 表达“徒然、无代价地、逍遥法外地”的意思；结合后文“没有审判”，译作“白白”最自然。
- source_word: ያንጥኦ
  choice: 玷污
  rationale: 在血污染土地的语境中表示使之不洁、污染，译作“玷污”兼具礼仪与道德色彩。
- source_word: ነጺሐ
  choice: 得洁净
  rationale: 对应土地从流血之污中被洁除，保留原文洁净观念。
theological_decisions:
- issue: 血与生命的关系
  choice: “血就是生命”
  alternative: “生命在血中”
  rationale: 原文系判断结构“因为它是生命”，直译为“血就是生命”更贴近现有吉兹语文本，同时不额外引入后来的系统化解释。
- issue: 流人血后的审判与土地洁净
  choice: 保留“流那流血之人的血”这一报偿性表述
  alternative: 概括为“惩罚凶手”
  rationale: 原文以血对血的方式陈述土地得洁净的条件；概括会削弱其措辞所含的神学张力。
- issue: 礼物的司法含义
  choice: 正文译“礼物”，脚注说明可指贿赂或偿金
  alternative: 正文直接译“贿赂”
  rationale: 避免把语境所暗示的非法收买固定成原词唯一词义，同时让现代读者理解其司法背景。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“绝不可”“收受”“玷污”“得洁净”保留训诫与礼仪语域；避免古奥句式。正文中的[a]、[b]均与脚注对应。
