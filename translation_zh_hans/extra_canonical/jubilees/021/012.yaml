base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/012.yaml
  text: 'your offerings before the Lord. And take care with the wood of the offering, that you do not bring wood for the altar in addition to these: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar.'
translation:
  language: zh_hans
  text: 你在主面前所献的祭物。要留意献祭所用的木材；除了以下这些，不可把木材带到祭坛上：柏木、冷杉木、杏树木、松木、脂松木、香柏木、杜松木、铁线莲木、橄榄木、桃金娘木、月桂木和香柏木。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 树种名称的辨认并不完全确定；古代译本或旧译对这份清单有不同理解，也有译法将其作禁用木材清单，并列为葡萄树、无花果树、桃金娘、月桂、柏树、香柏、杜松、枣椰树、杏树、橄榄树、没药树、月桂树和梣木。原文清单的首项和末项也可能不是同一种“香柏木”。
    reason: 原文含多项罕见植物名，传本与既有译法分歧显著；脚注保存词种鉴定及禁令方向的真实不确定性。
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: 你的祭物
  rationale: 该词为“祭物、供物”，附第二人称单数属格；结合残句结构译作“你……的祭物”。
- source_word: ቅድመ፡ እግዚአብሔር
  choice: 在主面前
  rationale: 按介词与神圣称谓的通常意义直译，保持庄重而自然。
- source_word: ዕፀወ፡ መሥዋዕት
  choice: 献祭所用的木柴
  rationale: 字面为“祭物/献祭的木材”；汉语用功能性表达更自然，并与后文祭坛语境衔接。
- source_word: ኢታብእ
  choice: 不可另拿……上来
  rationale: 否定式动词表达禁令；按语境用现代汉语禁令句呈现。
- source_word: ምሥዋዕ
  choice: 祭坛
  rationale: 此处与“祭物”词形相近但语境指承接木柴之祭坛，避免混同为“祭物”。
- source_word: ዲበ፡ ዝንቱ
  choice: 除了以下这些
  rationale: 依据句法与最新源文审校，将所列树种理解为允许范围，而不是受禁清单。
- source_word: ቍጲርሳን፡ ወጰፍሪን፡ ወስጋድ፡ ወስጥርቢሎን፡ ወጱጦን፡ ወቂድርን፡ ወሱራት፡ ወታናክ፡ ወዕፀ፡ ዘይት፡ ምርስኔ፡ ወደፍን፡ ወቄዳር
  choice: 柏木、冷杉木、杏树木、松木、脂松木、香柏木、杜松木、铁线莲木、橄榄木、桃金娘木、月桂木和香柏木
  rationale: 依现有葛尔兹语词项鉴定及审校后的英语咨询层逐项音义对应；保留首尾两项均被识别为香柏类木材的重复，不擅自合并或改种。
theological_decisions:
- issue: 木材清单是禁用清单还是限定可用清单
  choice: 译为“除了以下这些，不可另拿”，即仅限所列木材
  alternative: 译为“不可拿以下这些木材”，将清单视为禁用清单
  rationale: 句中的“在这些之外/加在这些以外”以及最新源文复核支持限定允许范围；该选择也避免颠倒诫命。
- issue: ምሥዋዕ 的所指
  choice: 祭坛
  alternative: 祭物或献祭
  rationale: 结合“把木柴拿上来”的动作和前文已出现的祭物词，祭坛更符合此处搭配及词项区分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“木柴”比单说“木头”更符合祭坛燃料语境；树种后加“木”以明确此处所指为献祭用木材。正文保留原文清单末项造成的“香柏木”重复，并用脚注提示可能的词种差异。
