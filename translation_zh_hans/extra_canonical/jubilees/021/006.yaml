  naturalness: “归给不洁之物，也不要归给……”在现代汉语中不自然，也会使“归给”的宾语关系和禁令范围含混。改为“不可归向……，也不可随从……”更清楚、庄重且自然。
  terminology: “不洁之物”保留原文可能泛指不洁对象而未擅自限定为偶像；“雕刻的像／铸造的像”准确呈现两类偶像。“任何血”恰当反映末尾的全面限定。
  issues:
