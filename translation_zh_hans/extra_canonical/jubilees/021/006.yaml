  text: to unclean things, or after carved images, or after molten images. And do not eat any blood
translation:
  language: zh_hans
  text: 不可归向不洁之物，也不可随从雕刻的像或铸造的像。也不可吃任何血。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለርኩሳን
  choice: 归给不洁之物
  rationale: 介词 ለ- 表示“给、归于”，ርኩሳን 为复数，意为“不洁之物”；译文保留其范围上的含混，不直接限定为“偶像”。
- source_word: ድኅሬሆሙ
  choice: 归给
  rationale: 此处在献祭禁令的语境中表示追随、转向或献给；中文以“归给”承接前项并自然表达敬拜或献祭的对象。
- source_word: ለገሊፎ
  choice: 雕刻的像
  rationale: 对应雕刻、刻成之物，采用现代汉语常用的偶像类别表达。
- source_word: ለስብክ
  choice: 铸造的像
  rationale: 对应熔铸、铸成之物，与“雕刻的像”形成来源文本中的平行结构。
- source_word: ወኢትብልዑ፡ ወኢምዝተኒ
  choice: 任何血都不可吃
  rationale: 禁令动词为复数；末尾形式按校勘所指出的“任何”理解，保留全面禁止的语气。
theological_decisions:
- issue: ርኩሳን 的指称范围
  choice: 不洁之物
  alternative: 不洁的偶像
  rationale: 原词本身可泛指不洁的人或物；为免把解释性限定写入正文，采用较宽的直译。
- issue: 三个介词短语与禁令的关系
  choice: 将首项译作陈述性承接，并在后两项明确补出“不要”
  alternative: 三个短语都译作“不要归给……”
  rationale: 本节为上一句的残句式延续；中文需补足禁令关系，同时避免机械重复。
- issue: 食血禁令的范围
  choice: 任何血都不可吃
  alternative: 不可吃血
  rationale: 末尾附加成分支持“任何、丝毫”的全面性，因此在中文中明确呈现。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。经文显然承接上文，故保留片段式起首，但用“也不要”使本节内部关系清楚；不以宗派术语限定“不洁之物”的具体所指。
