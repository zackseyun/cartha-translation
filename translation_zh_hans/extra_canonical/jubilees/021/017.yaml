  text: and wash your hands and your feet. And let no blood be seen on you or on your garments.
translation:
  language: zh_hans
  text: 要洗净你的手和脚。不可让人看见你们身上或衣服上有任何血迹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትሐፀብ
  choice: 洗净
  rationale: 该词表达洗涤之意；结合祭礼与血污的语境，译作“洗净”既自然，也保留洁净意味。
- source_word: እደዊከ፡ ወእገሪከ
  choice: 你的手和脚
  rationale: 依原文单数第二人称所属形式直译，保留对受嘱咐者的直接称呼。
- source_word: ኢያስተርኢ
  choice: 不可……沾有……血迹
  rationale: 字面义为“不可被看见/显现”；汉语用“不可让……沾有任何血迹”自然表达不得有可见之血。
- source_word: በዲቤክሙ
  choice: 你们身上
  rationale: 介词结构意为“在你们上面/身上”；保留原文此处转为复数第二人称的现象。
- source_word: በውስተ፡ አልባሲክሙ
  choice: 衣服上
  rationale: 原文指血在你们的衣物之中或之上；按汉语习惯译为“衣服上”。
theological_decisions:
- issue: 洗手洗脚与血迹禁令的礼仪性质
  choice: 按具体动作直译，不增添“礼仪洁净”“献祭”等解释
  alternative: 显明译为“按礼仪洁净自己”
  rationale: 本节原文本身只命令洗手洗脚，并禁止身上或衣物留血；不宜把语境解释写入正文。
- issue: 人称由单数转为复数
  choice: 保留“你的”与“你们”的转换
  alternative: 为汉语一致性全部统一为单数或复数
  rationale: 原文前半使用单数所属形式，后半使用复数形式；保留这一张力，避免无依据地协调。
translation_notes:
  register: 采用现代、庄重而易懂的祈使语体。“血迹”明确表达可见之血，同时避免生硬地直译为“不可见任何血在你们上面”。
