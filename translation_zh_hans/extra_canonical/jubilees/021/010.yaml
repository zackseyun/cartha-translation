revisions:
- from: 要连同它的奠祭，作为馨香，把素祭献给主。祭牲的肉要在当天和第二天吃；第二天必须在日落以前吃完，不可留到第三天，因为那时它就不蒙悦纳，成了亵渎之物，不可再吃。凡吃它的人都要担当自己的罪。因为我发现，我的先祖——古人——的书上，以及以诺和挪亚的言论中，都是这样记载的。
  to: 并要连同它的奠祭，向主献上作馨香的素祭。祭牲的肉要在当天和第二天吃；第二天不可让日头落在它上面以前还没有吃完，也不可把它留到第三天，因为它不蒙悦纳，因为它是污秽之物，必不可吃。凡吃它的人都要担当自己的罪。因为我发现，我古代先祖的书中，以及以诺的话语和挪亚的话语中，都是这样记载的。
  rationale: 修订首句以明确奠祭和素祭均须保留，并使“馨香”自然地归于向主所献的祭；调整逾期祭肉的措辞，避免添加“那时”的解释性推断及“亵渎之物”的不自然主动含义；将末句整理为自然的单数“书中”，同时保留以诺和挪亚“话语”的开放文献形态。未增设脚注：英语审计轨迹中的替代译法不构成此中文译文所需的脚注锚点。
