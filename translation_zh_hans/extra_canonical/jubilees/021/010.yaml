  yaml_path: translation/extra_canonical/jubilees/021/010.yaml
  text: and with its drink offering, for a pleasing aroma, a grain offering to the Lord. And eat its flesh on that day and on the second day, and do not let the sun go down on it on the second day until it is eaten, and do not leave any of it for the third day, because it is not acceptable, because it is a profane thing, and it must not be eaten; and all who eat it will bear their sin. For thus I found written in the book of my forefathers, the former ones, and in the words of Enoch and in the words of Noah.
translation:
  language: zh_hans
  text: 并要连同它的奠祭，向主献上作馨香的素祭。祭牲的肉要在当天和第二天吃；第二天不可让日头落在它上面以前还没有吃完，也不可把它留到第三天，因为它不蒙悦纳，因为它是污秽之物，必不可吃。凡吃它的人都要担当自己的罪。因为我发现，我古代先祖的书中，以及以诺的话语和挪亚的话语中，都是这样记载的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞጻሕቱ
  choice: 它的奠祭
  rationale: 该词指与祭物同献的液体祭，译为“奠祭”，并保留物主关系。
- source_word: መዓዛ፡ ሠናይ
  choice: 馨香
  rationale: 字面为“美好的香气”；“馨香”简洁、庄重，也符合祭祀语境。
- source_word: ኅብስተ፡ ጽንሓሕ
  choice: 素祭
  rationale: 该词组字面涉及祭献用的饼或粮食供物；“素祭”能自然表达其祭物类别，且不与前面的奠祭混同。
- source_word: ወኢይዕረብ፡ ላዕሌሁ፡ ፀሓይ
  choice: 必须在日落以前吃完
  rationale: 原文以“不可让太阳落在其上”表达时限；采用现代汉语的自然说法，同时保留必须在第二日日落前吃完的要求。
- source_word: እኩይ፡ ኅሩየ
  choice: 亵渎之物
  rationale: 语境指因超过规定期限而不再适宜献祭或食用之物；“亵渎之物”保留其礼仪性负面含义，而不泛化为普通的“坏东西”。
- source_word: ኃጢአተ፡ ሎሙ፡ ይነሥኡ
  choice: 担当自己的罪
  rationale: 直陈食用者承担由此产生的罪责，不进一步解释刑罚性质。
- source_word: መጽሐፈ፡ አበዊየ፡ ቀደምት
  choice: 我的先祖——古人——的书
  rationale: 保留“书”的单数，并将“古人”作为对“我的先祖”的说明，避免误译为多本书。
theological_decisions:
- issue: 超过第二日的祭肉为何不可食用
  choice: 因为那时它就不蒙悦纳，成了亵渎之物
  alternative: 因为它不蒙悦纳，因为它是邪恶的分别之物
  rationale: 译文保留“不蒙悦纳”与礼仪上成为亵渎之物这两层判断，不把原因改释为卫生、道德或某一宗派性的祭祀理论。
- issue: 食用者所承担的后果
  choice: 担当自己的罪
  alternative: 承担罪罚
  rationale: 原文明确提到“罪”，但没有在本句具体说明刑罚，故不把“罪”解释性地改成“罪罚”。
- issue: 以诺和挪亚材料的性质
  choice: 以诺和挪亚的言论
  alternative: 《以诺书》和《挪亚书》
  rationale: 原文使用“言论／话语”，未明确要求将二者识别为具有固定书名的独立著作，故保留文献形态上的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。祭祀术语使用“奠祭、素祭、馨香、祭牲”等普通中文读者可识别的表达；对第二日日落时限作适度句法重组，但不改变规定。
