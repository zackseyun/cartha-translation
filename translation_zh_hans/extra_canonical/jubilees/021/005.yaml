lexical_decisions:
- source_word: ኪዳኖ
  choice: 他的约
  rationale: 按第三人称阳性单数领属形式直译；虽然这两个词很可能承接上一节，但既然列于本节所给源文中，就予以保留。
- source_word: ትእዛዞ
  choice: 他的诫命
  rationale: 保留单数领属形式；“诫命”是现代中文中自然、庄重且符合律法语境的表达。
- source_word: ሥርዐቶ
  choice: 律例
  rationale: 表达所规定的法则或定例，并与“诫命”“典章”构成自然的法律用语组合。
- source_word: ኵነኔሁ
  choice: 典章
  rationale: 该词可指判断、裁决或法令；此处与诫命、律例并列，译作“典章”较自然，同时不把它缩窄为某一次具体判决。
- source_word: ኢትሖር፡ ድኅሬሆሙ
  choice: 不可随从它们
  rationale: 字面意象为“不可走在它们后面”；“随从”在现代中文中自然地传达跟从之意，并保留复数代词所指不明的现象。
theological_decisions:
- issue: 末句“它们”的指代
  choice: 保留“它们”，不在正文中补出具体对象
  alternative: 译作“不可随从偶像”或把代词解释为前述诫命、律例和典章
  rationale: 所给吉兹语片段只有复数代词，且似乎因分节截断而缺少后续对象。补出“偶像”虽可能符合更宽上下文，却超出本段明文；将其明确指向前述律法项目又会造成明显的意义冲突。因此保留源文张力，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我的儿啊”保留亲切而郑重的训诲语气；法律术语采用“诫命、律例和典章”。正文不擅自修补疑似分节造成的残句，而由脚注交代文本问题。
