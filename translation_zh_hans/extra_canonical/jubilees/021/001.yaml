  yaml_path: translation/extra_canonical/jubilees/021/001.yaml
  text: And in the sixth year of the seventh week of this jubilee, Abraham called Isaac his son and instructed him, saying, “I have grown old, and I do not know the day of my death, and I am full of my days.”
translation:
  language: zh_hans
  text: 这个禧年的第七个七年期到了第六年，亚伯拉罕把儿子以撒叫来，吩咐他说：“我已经老了，不知道自己哪一天死；我已饱享一生的年日[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已享尽天年。”原文直译为“我的年日使我饱足”或“我饱享了我的年日”。
    reason: 说明原文第一人称“饱足”结构及其可用的汉语惯用表达，保留末句的语义张力。
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词本义为“七个一组”，在《禧年书》的年代框架中指七年为一期；译作“七年期”可让现代读者直接明白，同时保留其历法功能。
- source_word: አዘዞ
  choice: 吩咐
  rationale: 原词表示命令、嘱咐；此处是父亲临近晚年向儿子作郑重交代，“吩咐”兼顾权威性与汉语自然度。
- source_word: ረሳዕኩ
  choice: 我已经老了
  rationale: 依上下文及审定英译所反映的词义，表达亚伯拉罕年事已高；采用现代汉语常用而庄重的说法。
- source_word: ጸገብኩ፡ መዋዕልየ
  choice: 我已饱享一生的年日
  rationale: ጸገብኩ是第一人称单数，意为“我已饱足/满足”，并非“我的年日已经完成”；“饱享”既保留主体语法和“饱足”的意象，也符合汉语表达。
theological_decisions:
- issue: 末句是主观的“饱足”还是客观的“年日满了”
  choice: 我已饱享一生的年日
  alternative: 我的年日已经满了
  rationale: 原文动词为第一人称单数，主体是“我”；正文不改写成以“年日”为主语的客观完成陈述，以免消解原文的语法重点。脚注说明可接受的惯用译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“七年期”明确年代单位；“把儿子以撒叫来”避免生硬照搬源语语序；末句用“饱享”保留原文的饱足意象，并以脚注交代较惯用的另一译法。
