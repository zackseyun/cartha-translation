base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/004.yaml
  text: the will of him who created me. For he is the living God, and he is holy and faithful and righteous above all; and with him there is no partiality and no accepting of gifts, for he is a righteous God and one who executes judgment on all who transgress his commandments and those who despise his covenant.
translation:
  language: zh_hans
  text: 那创造我者的旨意。因为他是永活的上帝；他是圣洁、信实的，他的公义超乎万有。在他那里，绝不看情面，也不收受贿赂[a]；因为他是公义的上帝，向一切违犯他诫命的人，以及藐视他的约[b]的人施行审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”。这里的语境是公正施行审判，因此正文译作“贿赂”。
    reason: 保留ነሢአ ሕልያን既可泛指接受礼物、在司法语境中又可特指受贿的词义范围。
  - marker: b
    text: 所存吉兹文此处只说“那些藐视的人”，没有明说所藐视的对象；正文依上下文补作“他的约”。
    reason: 标明源文的省略，避免把补足的宾语误当作明载于该句。
lexical_decisions:
- source_word: አምላክ፡ ሕያው
  choice: 永活的上帝
  rationale: 直译“活着的上帝”，采用现代中文圣经语体中自然而庄重的“永活的上帝”，表达其为生命之神。
- source_word: ነሢአ፡ ገጽ
  choice: 看情面
  rationale: 字面为“取脸面”，是偏袒、徇情之意；“看情面”既自然，也与下一个关于贿赂的短语保持区别。
- source_word: ነሢአ፡ ሕልያን
  choice: 收受贿赂
  rationale: 该短语指接受礼物，语境涉及公正审判，故译为“收受贿赂”；脚注保留较宽泛的“礼物”义。
- source_word: ገባሬ፡ ኵነኔ
  choice: 施行审判
  rationale: 对应“行审判者”，用动词结构更符合现代汉语，同时保留司法审判意涵。
- source_word: ይትዐደዉ፡ ትእዛዞ
  choice: 违犯他诫命的人
  rationale: 保留“违犯”这一主动越界含义，并以“诫命”表达神所颁布的命令。
- source_word: ይሜንኑ
  choice: 藐视
  rationale: 该词表达轻蔑、拒斥，不与前面的“违犯”合并，以保留两个不同动作。
theological_decisions:
- issue: 上帝的公义与“超乎万有”的关系
  choice: 他的公义超乎万有
  alternative: 他比万有都公义
  rationale: 源文可较直地理解为“公义超乎一切”；所选译法避免把“万有”拟人化为可比较的道德主体，同时保留原文的至高程度。
- issue: 末句“藐视”的宾语
  choice: 正文依传统与语境补出“他的约”，并加脚注
  alternative: 仅译“那些藐视的人”
  rationale: 所给吉兹文在“藐视”后未明列宾语，但上下文及审校层支持“他的约”；用脚注明确补足情况，不掩盖源文的省略。
translation_notes:
  register: 采用现代、庄重而易懂的普通话圣经语体。保留开头承接上文的片段式句法，不擅自补出源文没有的主语或谓语；并以分号呈现原文连续的神性描述与审判理由。
