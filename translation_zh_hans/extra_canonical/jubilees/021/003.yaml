  text: and to walk uprightly in all his paths. My soul hated idols, that I might observe to do
translation:
  language: zh_hans
  text: 并在他一切的道路上正直行走。我的心厌恶偶像，为要谨慎遵行[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在原文中未完，所要“遵行”的内容见下节；不可译作“谨防制造偶像”。
    reason: 说明跨节句法，并防止因偶像这一近邻名词而误解末句为禁止性表达。
lexical_decisions:
- source_word: አርትዕ፡ ሐዊረ
  choice: 正直行走
  rationale: 该短语表达端正、正直地行事；“正直行走”既保留“行走”的道路意象，也符合庄重的现代汉语。
- source_word: በኵሉ፡ ፍናዊሁ
  choice: 在他一切的道路上
  rationale: 逐项保留“在—一切—他的道路”这一结构，不擅自明确代词所指。
- source_word: ጣዖተ፡ ጸልአት፡ ነፍስየ
  choice: 我的心厌恶偶像
  rationale: ነፍስየ直译为“我的灵魂”，在此表示说话者内在的自我；译作“我的心”更自然，同时保留强烈的内在厌恶。
- source_word: እትዐቀብ፡ ለገቢረ
  choice: 谨慎遵行
  rationale: እትዐቀብ表示留意、谨守，ለገቢረ指向“去做/遵行”；不能译成“避免去做”，因为这会反转语义。句子的宾语留待下文补足。
theological_decisions:
- issue: “他的道路”中代词的指向
  choice: 保留“他”
  alternative: 明确译为“上帝”或“亚伯拉罕”
  rationale: 本节片段本身未消除指代歧义，不以解释性增译替代原文。
- issue: 末句“遵行”的宾语未在本节出现
  choice: 保留跨节悬接，以脚注说明
  alternative: 补出“他的旨意”或改为“避免制造偶像”
  rationale: 格厄兹文以表示目的的“为要”和“谨慎去做/遵行”收尾，具体宾语在后文承接；补写宾语会超出本节原文，改成避免行为则会逆转意思。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“我的心”避免“我的灵魂”在此处显得生硬；末尾刻意保留未完句式，以忠实呈现原文跨节结构。
