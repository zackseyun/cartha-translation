base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/013.yaml
  text: '[called] arsatna and besem[13]; but from among these woods place under the sacrifice upon the altar those proven in appearance. And do not place any split or dark wood, but hard and clean wood, without blemish, sound and freshly grown; and do not place old wood[13], because its fragrance has gone out.'
translation:
  language: zh_hans
  text: 〔名叫〕阿尔萨特纳和贝塞姆[a]。从这些木材中，要把外观经检验合格的木材放在祭坛上的祭物下面[b]。不可放劈裂或色暗的木头，只可用坚硬、洁净、毫无瑕疵、完好而新长成的木头；也不可放陈旧的木头，因为它的香气已经散失了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿尔萨特纳”和“贝塞姆”是按吉兹语音译的树木名称，其确切所指不明；这里的文字也可能保存了受损或难解的植物名。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作：“把外观经检验合格的放在祭物下面，在祭坛上。”
    reason: previous_rendering
lexical_decisions:
- source_word: አርሳትነ ወቤስም
  choice: 阿尔萨特纳和贝塞姆
  rationale: 这两个词似为难以确定的树木名称，且文本可能受损；采用音译，以免强行指定现代树种。
- source_word: ምኩረ ራእዮሙ
  choice: 外表验看合格的
  rationale: 保留“经检验”与“外观”两层意思，同时用自然的现代汉语表达祭坛用木的筛选标准。
- source_word: ንቁዐ ወፈዋነ
  choice: 劈裂或发黑的
  rationale: 分别体现木材已经裂开和颜色暗黑的两个负面特征，不遗漏并列成分。
- source_word: ጽኑዓነ ወንጹሐ
  choice: 坚硬、洁净
  rationale: 按原文并列保留木材的坚实与洁净两项要求。
- source_word: ብሉየ
  choice: 陈旧的木头
  rationale: 与后文香气已经散失相呼应，表达久置或老旧、已不适合献祭的木材。
- source_word: ምትነኒ
  choice: 瑕疵
  rationale: 在祭物与礼仪语境中译为“瑕疵”，既自然又保留完整无缺的要求。
theological_decisions:
- issue: 祭坛、祭物与木材的位置关系
  choice: 放在祭坛上的祭物下面
  alternative: 把外表验看合格的木头放在祭物下面，放在祭坛上
  rationale: 原文连续出现“在祭物下面”和“在祭坛上”；正文以自然汉语表达两重空间关系，脚注提示原文结构也可作较逐字的理解。
- issue: 祭坛用木的礼仪要求
  choice: 按原文并列保留坚硬、洁净、无瑕、完好、新长成及有香气等要求
  alternative: 概括为只用上好的香木
  rationale: 不把具体标准简化为概括性的礼仪解释，从而保留文本的细节与张力。
translation_notes:
  register: 采用现代、庄重而易懂的祭礼指示语体。对无法可靠鉴定的树名保留音译；用“祭坛”与“祭物”明确区分地点和其上的供物。方括号所反映的补入词改用中文六角括号“〔〕”呈现，以提示“名叫”在底本中的文本状态。
