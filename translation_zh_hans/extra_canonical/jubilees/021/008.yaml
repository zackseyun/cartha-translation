  text: 'the Lord. And the fat of the sacrifice of deliverance you shall place on the fire that is on the altar: the fat that is on the entrails, and all the fat that is on the inward parts, and the two kidneys, and all'
translation:
  language: zh_hans
  text: 主。你要把平安祭的脂油放在祭坛的火上：就是内脏上的脂油、脏腑上的一切脂油、两个肾，以及一切[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文在“一切”之后中断，句意接续下一节；这里的原词意为“一切、全部”，不是“两个都”。
    reason: 说明章节切分造成的未完句，并防止将末词误译为“两者都”。
lexical_decisions:
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: 平安祭
  rationale: 该短语直义近于“拯救／安康的祭”；结合献祭语境，以现代中文圣经读者易懂的传统祭名“平安祭”表达，同时不将其限定为某一私有教义解释。
- source_word: ታነብር፡ ዲበ፡ እሳት፡ ዘዲበ፡ መሥዋዕት
  choice: 放在祭坛的火上
  rationale: 按词序和关系直译为“放在那祭坛之上的火上”；中文压缩为自然而准确的表达。
- source_word: ከርሥ
  choice: 内脏
  rationale: 此处指腹腔内脏器官，置于献祭脂油清单中译作“内脏”最清楚。
- source_word: ንዋየ፡ ውስት
  choice: 脏腑
  rationale: 该表达指身体内部的器官或内在部分；译为“脏腑”以区别前面的“内脏”，并保留原文并列措辞。
- source_word: ክሊአ፡ ኵልያት
  choice: 两个肾
  rationale: 明确保留数词“二”和“肾”的复数含义。
- source_word: ወኵሎ
  choice: 以及一切
  rationale: ኵሎ意为“一切／全部”，不能改译为“两者都”。本节在此处截断，语义延续至下一节。
theological_decisions:
- issue: መድኃኒት所修饰祭物的名称
  choice: 平安祭
  alternative: 拯救祭／安康祭
  rationale: “平安祭”在汉语圣经献祭术语中自然且易识别，也能涵盖安康、完整与蒙拯救的语义范围；不据此附加特定赎罪论解释。
- issue: 本节末尾不完整的“ወኵሎ”
  choice: 保留为“以及一切”，让句子在本节末尾悬置
  alternative: 补足为“两个肾全都”或从下一节补入宾语
  rationale: 原文分节在短语中间中断；忠实保留这一文本现象，避免为追求句法完整而把“一切”误解为“两者都”，也不擅自移入下一节文字。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。开头“主。”承接上一节，照原始分节保留。末尾刻意维持未完句，以忠实反映吉兹文在此处的章节截断；脚注标记已在正文中以[a]呈现。
