  text: its fragrance, because there is no longer fragrance upon it as at first. Other than these woods, do not place any other, because its fragrance is distinct, and the odor of its fragrance goes up to heaven.
translation:
  language: zh_hans
  text: 它的香气，因为如今上面已经不再有起初那样的香气。除了这些木料以外，不可再放别的木料，因为它的香气独特，它的香气升到天上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዐዛሁ
  choice: 它的香气
  rationale: 保留第三人称单数领属形式；依上下文指祭物或所焚之物的香气。
- source_word: እስመ፡ አልቦ፡ እንከ፡ መዐዛ፡ ላዕሌሁ፡ ከመ፡ ቀዳማዊ
  choice: 因为如今上面已经不再有起初那样的香气
  rationale: 逐项体现“因为、如今/不再、香气、在其上、如起初”；中文调整语序以求自然。
- source_word: ዕፀው
  choice: 木料
  rationale: 该词为“树木、木材”的复数；祭祀焚烧语境中译作“木料”比“树林”自然。
- source_word: አልቦ፡ ዘታነብር፡ ባዕደ
  choice: 不可放上别的
  rationale: 表达否定命令及“另一个、别的”之意，不擅自补入“种类”。
- source_word: ፍሉጥ
  choice: 独特
  rationale: 该词可有“已知、显明、可辨认”之义；结合香气语境取“独特”，同时不扩展为某种神学判断。
- source_word: ወየዐርግ፡ ፄና፡ መዐዛሁ፡ ውስተ፡ ሰማይ
  choice: 它馨香的气味直升天上
  rationale: 保留“气味—香气”的源文叠表达，并以“升上天”呈现方向性；“直升”使现代汉语顺畅。
theological_decisions:
- issue: 香气升天是否明确表示蒙神悦纳
  choice: 只译为“它馨香的气味直升天上”
  alternative: 译为“它的馨香上达天庭，蒙神悦纳”
  rationale: 原文仅陈述香气升入天上，未明说悦纳，故不加入解释性的神学结论。
- issue: ፍሉጥ 的语义取向
  choice: 译作“独特”
  alternative: 译作“为人所知”或“明显可辨”
  rationale: 香气语境支持“可辨识、与众不同”，但不将其解释成礼仪效力或神圣属性。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀叙述语体。开头在篇章上明显承接前文，保留其片段式衔接，不补造本节未明说的宾语或祭仪解释。
