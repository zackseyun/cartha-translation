    issue: “素祭”缺少原文所示的所属限定
    rationale: መሥዋዕቱ带第三人称所属成分，英文审校译为“with its grain offering”。译作“连同它的素祭”可保留该关系，且不改变祭物的具体理解。
  - severity: low
    issue: 末句修饰关系可更清楚
    rationale: 将“作为献在主面前、蒙悦纳的馨香”紧接“献上”，可清楚表达所献之物具有馨香、蒙悦纳的祭祀描写。
