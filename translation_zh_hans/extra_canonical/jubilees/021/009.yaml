base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/009.yaml
  text: The fat that is on them, and that which is on the entrails, and the liver with the kidneys, you shall remove. And you shall offer all this as a pleasing fragrance acceptable before the Lord, with its grain offering.
translation:
  language: zh_hans
  text: 要取下其上的脂肪、内脏上的脂肪，以及肝和肾脏；要把这一切连同它的素祭献上，作为献在主面前、蒙悦纳的馨香。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናቅፅ
  choice: 内脏
  rationale: 该词指腹腔内的脏器、肠腑；祭祀语境中译作“内脏”比“腰部”准确，也与其上脂肪的描述相称。
- source_word: ከብደ
  choice: 肝
  rationale: 按该词通常的解剖学含义直译为“肝”。
- source_word: ኵልያት
  choice: 肾脏
  rationale: 这是“肾”的复数形式；汉语以集合性的“肾脏”自然表达。
- source_word: ትብልእ
  choice: 取下
  rationale: 依本句祭牲处理的语境及所传校勘理解，表达把指定部位从祭牲上取下；避免按相近词形误解为“吃”。
- source_word: ለመዐዛ፡ ሠናይ፡ ዘይሠጠው
  choice: 成为蒙悦纳的馨香
  rationale: 兼顾“美好/芬芳的香气”与在主面前被接纳的祭祀含义，采用现代中文圣经语体中自然而庄重的表达。
- source_word: መሥዋዕቱ
  choice: 素祭
  rationale: 依献祭指令的上下文，将随同牲祭献上的祭物具体表达为“素祭”；此处不宜译成现代汉语容易误解的泛称“牺牲”。
theological_decisions:
- issue: “馨香”与“蒙悦纳”的关系
  choice: 译作“在主面前成为蒙悦纳的馨香”
  alternative: 译作“作为主面前芬芳的香气”
  rationale: 保留献祭既有香气描述、又有在主面前获接纳的双重意味，但不进一步解释其神学机制。
- issue: 祭物名称的具体程度
  choice: 将 መሥዋዕቱ 译作“素祭”
  alternative: 译作“祭物”或“供物”
  rationale: 沿用经审校的祭祀语境理解，使读者明白这是与脂肪和脏器一同献上的附属祭物；同时不引入宗派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“取下……献上”清楚呈现两步祭祀动作；“内脏”“肝和肾脏”使用普通读者易懂的现代解剖词汇；“馨香”“蒙悦纳”“素祭”保留必要的经文祭祀语域。
