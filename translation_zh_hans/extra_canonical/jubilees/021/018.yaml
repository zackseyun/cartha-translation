  text: Take care, my son, concerning blood; take great care to cover it in the earth. And do not eat it at all.
translation:
  language: zh_hans
  text: 我儿，论到血，你要谨慎；务要格外谨慎，把血埋在土里。你绝不可吃血。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐቀብ
  choice: 谨慎
  rationale: 该词在本节两次出现，表达“留意、谨慎遵守”；保留重复，以呈现原文的劝诫力度。
- source_word: ጥቀ
  choice: 格外
  rationale: 这是加强程度的副词，修饰第二个“谨慎”，表示“非常、极其”；译作“格外”符合现代汉语劝诫语气。
- source_word: ደፍኖ
  choice: 把血埋
  rationale: 动词表示遮盖、掩埋；结合“在土里”，汉语译作“埋在土里”自然且准确，不增添原文没有的“用尘土”。
- source_word: ውስተ፡ ምድር
  choice: 在土里
  rationale: 直指在地中或土中，未明说“用尘土”；因此不作经文互文式补充。
- source_word: እንከ
  choice: 绝不可
  rationale: 该语助成分在否定命令中加强禁令，译为“绝不可”体现“完全不要、根本不要”的语气。
theological_decisions:
- issue: 禁食对象是否明确为血
  choice: 你绝不可吃血
  alternative: 你绝不可吃它
  rationale: 原文宾语代词回指本节的“血”。汉语直接复现“血”可避免代词指向含混，不改变禁令内容。
- issue: 是否按《利未记》相关措辞补入“用尘土遮盖”
  choice: 把血埋在土里
  alternative: 用尘土把血遮盖起来
  rationale: 本节吉兹文仅有“在土里”，没有对应“尘土”的独立词；不应因互文背景而补入源文未载的成分。
translation_notes:
  register: 采用现代、庄重而易懂的父子劝诫语体。“我儿”保留亲密且郑重的称呼；分号承接两重“谨慎”，并以“务要格外谨慎”再现原文加强语气。无脚注标记，因为本稿未设置脚注。
