  text: And on all your offerings put salt, and do not let the salt of the covenant be lacking from any of them.
translation:
  language: zh_hans
  text: 你的一切祭物都要加盐；任何祭物都不可缺少盟约之盐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: 你的一切祭物
  rationale: መሥዋዕት 指献给上帝的祭物或供物；此处采用较宽泛而符合祭祀语境的“祭物”，并保留第二人称所属关系。
- source_word: ትደይ፡ ፄወ
  choice: 都要加盐
  rationale: 直译为“放盐”；现代汉语祭祀语境中“加盐”更自然，同时准确表达把盐放在祭物上的动作。
- source_word: ፄወ፡ ኪዳን
  choice: 盟约之盐
  rationale: 保留原文“盐—盟约”的属格关系，不将其解释为盐所象征的某一种特定神学含义。
- source_word: ወኢይደሪዕ
  choice: 不可缺少
  rationale: 表达原文否定式“不要让……缺少/缺席”，以自然的中文禁令形式呈现。
- source_word: ውስተ፡ ኵሉ
  choice: 任何祭物
  rationale: 原文末尾字面为“在一切之中”，语境所指仍是前述全部祭物；译出省略对象，使中文完整清楚。
theological_decisions:
- issue: “盟约之盐”的含义
  choice: 保留为“盟约之盐”
  alternative: 解释为“象征盟约的盐”或“立约的盐”
  rationale: 原文只陈述盐与盟约的属格关系，并未明确说明是象征、凭据还是立约仪式用盐；直保留可避免消解其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭物”兼顾献祭与供物的语义范围；分号呈现原文并列的正面命令与反面禁令。
