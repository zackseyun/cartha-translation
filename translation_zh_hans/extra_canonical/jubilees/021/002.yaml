  yaml_path: translation/extra_canonical/jubilees/021/002.yaml
  text: And behold, I am one hundred and seventy-five years old, and throughout all the days of my life I have remembered the Lord, seeking with all my heart to do his will.
translation:
  language: zh_hans
  text: 看哪，我已经一百七十五岁了；在我一生的每一天，我都记念主，一心寻求遵行他的旨意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወናሁ
  choice: 看哪
  rationale: 保留原文用于引起注意的提示语，同时采用庄重而通行的现代汉语表达。
- source_word: ወልደ፡ ምእት፡ ወሰብዓ፡ ወኃምስቱ፡ ዓመት
  choice: 我已经一百七十五岁了
  rationale: 按原文年龄陈述直译，并以“已经……岁了”呈现自然的现代汉语时态语感。
- source_word: በኵሉ፡ መዋዕለ፡ ሕይወትየ
  choice: 在我一生的日子里
  rationale: 保留“我生命所有日子”的时间范围和原文的日子意象，避免仅压缩为“一生”。
- source_word: ሀሎኩ፡ እንዘ፡ እዜከር፡ ለእግዚአብሔር
  choice: 我常常记念主
  rationale: 该结构表达贯穿一生的持续状态；“常常记念”在中文中自然地传达持续铭记、顾念之意。“主”对应传统神圣称谓。
- source_word: እንዘ፡ አኀሥሥ፡ በኵሉ፡ ልብየ
  choice: 一心寻求
  rationale: “以我的全心寻求”自然译为“一心寻求”，保留全心投入与主动追求的含义。
- source_word: ከመ፡ እግበር፡ ፈቃደቲሁ
  choice: 遵行他的旨意
  rationale: “行他的意愿”在圣经体裁的现代中文中通常表达为“遵行他的旨意”，兼顾准确、庄重与可读性。
theological_decisions:
- issue: “记念主”是否应解释为持续信靠或敬拜
  choice: 保留为“记念主”
  alternative: 始终敬畏主／始终信靠主
  rationale: 原文动词的直接意义是记得、记念；不把这一行为预先解释成特定的敬虔实践，以保留其语义宽度。
- issue: “寻求”与“遵行”之间的关系
  choice: 一心寻求遵行他的旨意
  alternative: 一心寻求他的旨意，并且遵行
  rationale: 原文以目的结构表达寻求是为了实行其旨意；译文维持这一关系，不增添“辨明旨意”后再行动的两阶段解释。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语体。“看哪”保留古代经文的提示功能；其余句法尽量自然，避免过度古雅。分号划分年龄陈述与一生行为的回顾。
