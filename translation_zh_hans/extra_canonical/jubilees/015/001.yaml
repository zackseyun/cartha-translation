  yaml_path: translation/extra_canonical/jubilees/015/001.yaml
  text: In the fifth year of the fourth week of this jubilee, in the third month, in the middle of the month, Abram celebrated the festival of the firstfruits of the wheat harvest.
translation:
  language: zh_hans
  text: 在这个禧年的第四个七年期第五年，三月月中，亚伯兰守了小麦收割初熟节。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልዉን
  choice: 禧年
  rationale: 该词指《禧年书》特有的四十九年周期；“禧年”是现代中文圣经语境中通行且易懂的表达。
- source_word: ራብዑ
  choice: 第四个七年期
  rationale: 本节按禧年内的七年周期纪年；译出“七年期”可避免把“第四周”误解为普通的一周。
- source_word: በመንፈቀ፡ ወርኀ
  choice: 月中
  rationale: 直指月份的中点；简洁自然，并保留原文未指定确切日期的表达。
- source_word: ቀዳሜ፡ ማእረር
  choice: 收割的初熟节
  rationale: 原语表达收获初熟果实的节庆；采用“初熟节”保留其礼仪含义，同时以“收割的”说明语义关系。
- source_word: ስርናይ
  choice: 小麦
  rationale: 该词特指小麦，而非泛指谷物；译作“小麦”准确保留原文细节。
theological_decisions:
- issue: 节期名称是否与后来的规范名称完全等同
  choice: 小麦收割的初熟节
  alternative: 七七节
  rationale: 原文以初熟和小麦收割描述该节期，并未在本句直接使用“七七节”这一名称；保留描述性称呼，避免替原文预先判定节期名称。
translation_notes:
  register: 采用庄重而自然的现代普通话。“七年期”明确禧年内部的纪年结构；句序基本依照原文时间信息由大到小展开，末尾陈述亚伯兰守节。
