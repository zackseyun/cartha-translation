  text: And I will establish my covenant between me and you, and I will multiply you greatly.
translation:
  language: zh_hans
  text: 我要在我和你之间立定我的约，使你大大增多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ፡ ኪዳንየ
  choice: 立我的约
  rationale: 字面可作“赐下我的约”，但在“我与你之间”的盟约语境中，现代汉语以“立约”最自然，也准确表达确立盟约关系；保留“我的”以反映第一人称所有关系。
- source_word: ማእከሌየ፡ ወማእከሌከ
  choice: 在我与你之间
  rationale: 直接保留双方之间的关系结构，符合汉语盟约表述。
- source_word: ወአአብቀከ፡ ጥቀ
  choice: 并使你极其繁多
  rationale: 保留使役意义和强烈程度；“繁多”既可涵盖后裔或人口增多，也不在本节明说对象之外擅自补入“后裔”。
theological_decisions:
- issue: 盟约动词应译为“赐下”还是“立”
  choice: 立我的约
  alternative: 赐下我的约
  rationale: 源词形式支持“给予”，但此处属于固定盟约语境；译作“立我的约”更符合中文习惯及实际语义，同时不引入宗派性解释。
- issue: 增多的对象是否明确补为“后裔”
  choice: 使你极其繁多
  alternative: 使你的后裔极其繁多
  rationale: 源文以第二人称受词“你”表达，并未在本句明说“后裔”；正文保留这一简洁性及可能的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式简明，保留盟约语言的正式感；“极其繁多”略带经文语体，但普通读者仍易理解。
