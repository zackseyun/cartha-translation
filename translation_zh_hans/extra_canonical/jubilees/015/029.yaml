  text: For the command has been ordained as a covenant, that they should keep it forever among all the children of Israel.
translation:
  language: zh_hans
  text: 因为这诫命被立为约，为要使以色列所有子孙永远遵守它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዝ
  choice: 诫命
  rationale: 指具有约束力的命令；在盟约语境中，“诫命”比一般的“命令”更自然庄重。
- source_word: ተሠርዐ
  choice: 已被立为
  rationale: 保留原文被动式以及设立、规定之意，不补出未明说的施事者。
- source_word: ለኪዳን
  choice: 约
  rationale: 准确表达宗教及群体关系语境中的 covenant。
- source_word: ይዕቀብዎ
  choice: 遵守
  rationale: 该动词有守护、持守之意；以诫命为宾语时，现代汉语通常译作“遵守”。
- source_word: ለዓለም
  choice: 永远
  rationale: 在此表示持续无尽的时间，与诫命的永久效力相符。
- source_word: ዲበ፡ ኵሎሙ፡ ደቂቀ፡ እስራኤል
  choice: 以色列所有子孙
  rationale: 自然表达全体以色列后裔的范围；“所有”对应原文的全称限定。
theological_decisions:
- issue: 诫命与约的关系
  choice: 这诫命已被立为约
  alternative: 这诫命已经作为约而设立
  rationale: 保留原文把诫命与约紧密联系的表述，不将二者解释成彼此分离的概念，也不额外说明约的性质。
- issue: 被动式的施事者
  choice: 不补出设立者
  alternative: 上帝已将这诫命立为约
  rationale: 原文使用被动式，没有明确说出施事者；译文保留这一含蓄表达，避免加入原文未明说的神学信息。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为”承接上文的论证关系；句式简洁，并保留原文中诫命、约、永久遵守和全体以色列子孙四个核心要素。
