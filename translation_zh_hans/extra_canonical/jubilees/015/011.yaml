- from: '耶和华对亚伯拉罕说：“至于你，你和你以后的后裔都要守我的约。你们中间所有的男子都要受割礼；你们要割去包皮，这就作我与你们之间永远定例的记号。你们中间所有的男子，满八天时都要受割礼，无论是在家中出生的，还是用金子[a]从任何外族人那里买来的，就是那些不属你后裔的人。凡在你家中出生的，必须受割礼；凡用金子买来的，也必须受割礼。这样，我的约就在你们的肉身上，作永远的定例。未受割礼的男子，就是到了第八天还没有割去包皮的，那人必从亲族中被剪除，因为他违背了我的约。”


    耶和华又对亚伯拉罕说：“至于你妻子撒莱，你不可再叫她撒莱，她的名字要叫撒拉。我要赐福给她，也要从她赐给你一个儿子；我要赐福给他[b]，他要成为一国，多国的君王要从他而出。”


    亚伯拉罕俯伏在地，满心欢喜，心里说：“一百岁的人还能生儿子吗？撒拉已经九十岁了，还能生育吗？”亚伯拉罕对耶和华说：“但愿以实玛利能在你面前存活！”


    上帝说：“是的，撒拉要给你生一个儿子，你要给他起名叫以撒。我要与他坚立我的约，作为永远的约，也要与他以后的后裔立这约。至于以实玛利，我也听了你的祈求。看哪，我要赐福给他，使他繁衍，人数极其增多。他将生十二个首领，我要使他成为大国。但我要与以撒坚立我的约；明年这个时候，撒拉要给你生下以撒。”


    上帝与亚伯拉罕说完了话，就从他那里升上去了。亚伯拉罕照耶和华对他说的做了：他召来儿子以实玛利、所有在他家中出生的人，以及用金子买来的所有人，就是他家中所有的男子，割去了他们的包皮。就在那一天，亚伯拉罕和他家中所有的男子——包括在家中出生的，以及从外族人那里用金子买来的——都一同受了割礼。


    这是为世世代代所定的永远律例：不可推迟，也不可在八天中多拖延一天，因为这是永远的定例，已经制定并写在天上的版上。凡出生后到了第八天仍未割去包皮的人，都不属于耶和华与亚伯拉罕立约所得的子民，因为他属于毁灭之子；他身上没有归属耶和华的记号。他必归于毁灭，从地上被消灭，从地上被连根拔除，因为他违背了耶和华我们上帝的约。”'
