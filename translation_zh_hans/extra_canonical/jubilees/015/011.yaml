    issue: “他召来儿子以实玛利”
    rationale: 原文是亚伯拉罕“取了／带着”以实玛利及家中男子，并无“召来”所暗示的召集动作。
  - severity: low
    issue: “天上的版上”
    rationale: “版”在现代汉语中通常指版本，难以自然表达原文及英语审校轨迹中的“heavenly tablets”。“天上的石版上”更自然，并保留其书写载体意象。
  - severity: low
