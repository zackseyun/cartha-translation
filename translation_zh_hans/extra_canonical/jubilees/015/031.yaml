revisions:
- from: 他使他成为圣洁，从所有世人中将他聚拢出来；因为有许多民族、许多百姓，他们全都属于他。他又在众人之上委派众灵，使他们受迷惑，偏离对他的跟随。[a]
  to: 他使他成圣，并从全人类中把他召聚出来；因为有许多民族和许多百姓，他们全都属于他。他又派定众灵在他们之上，使这些民族和百姓迷失，不再跟随他。[a]
  rationale: 修订仅消除“他们”可能误指众灵的语法歧义，并改善“聚拢”与单数对象的搭配。仍保留连续代词的身份未明、众灵受派于万民之上的安排，以及“从他后面”这一表达所含的“偏离跟随”意义；不对众灵的身份、其作用方式或责任归属作教义性推论。
