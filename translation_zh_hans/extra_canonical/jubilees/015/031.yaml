  yaml_path: translation/extra_canonical/jubilees/015/031.yaml
  text: And he sanctified him and gathered him from all the children of men; for there are many nations and many peoples, and all are his, and over all he appointed spirits to lead them astray from following him.
translation:
  language: zh_hans
  text: 他使他成圣，并从全人类中把他召聚出来；因为有许多民族和许多百姓，他们全都属于他。他又派定众灵在他们之上，使这些民族和百姓迷失，不再跟随他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“使他们从他身后迷失。”这里的说法意为使他们偏离他，不再跟随他。
    reason: 保留እምድኅሬሁ的字面空间意象及其惯用含义。
lexical_decisions:
- source_word: ቀደሶ
  choice: 使他成为圣洁
  rationale: 保留使役意味，并避免把动作弱化为仅仅分别或拣选。
- source_word: አስተጋብኦ
  choice: 将他聚拢出来
  rationale: 体现“聚集、收聚”的基本语义，同时与后面的“从所有世人中”自然衔接。
- source_word: አሕዛብ / ሕዝብ
  choice: 民族／百姓
  rationale: 用两个相近而不完全相同的现代汉语词，保留原文并列用语及群体层次。
- source_word: አሰለመ መናፍስተ
  choice: 委派众灵
  rationale: 按语境表达把诸灵置于众人之上的安排；不额外说明这些灵的身份或性质。
- source_word: ያስሕትዎሙ
  choice: 使他们受迷惑
  rationale: 保留使役性的“使走迷、引入歧途”，并用自然汉语表达。
- source_word: እምድኅሬሁ
  choice: 偏离对他的跟随
  rationale: 该表达字面与“在他后面”有关，语境上指不再跟随他；正文采用通顺译法，脚注保留字面形象。
theological_decisions:
- issue: 连续出现的单数男性代词所指
  choice: 保留“他”，不在正文中明确其身份
  alternative: 直接译为“雅各”或“以色列”
  rationale: 本节原文本身使用代词；明确补出身份会消除由上下文承担的指代关系。
- issue: 众灵与人的迷失之间的关系
  choice: 译为上帝委派众灵，使众人受迷惑
  alternative: 弱化为众灵仅容许他们自行偏离，或强化为不可抗拒地迫使他们犯罪
  rationale: 保留原文的委派与使役结构，不进一步解决其神学张力，也不推导责任归属。
- issue: “他们全都属于他”的范围
  choice: 让“他们”自然回指前述许多民族和百姓
  alternative: 限定为某一个特定民族
  rationale: 原文复数代词承接前述复数群体，宜保持其广泛范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文代词和因果结构；对“从他后面”的闪语式表达在正文中作自然处理，并以脚注说明字面形式。
