  yaml_path: translation/extra_canonical/jubilees/015/007.yaml
  text: And your name shall no longer be called Abram, but from now and forever your name shall be Abraham, for I have made you the father of many nations.
translation:
  language: zh_hans
  text: 你的名不再叫亚伯兰；从今直到永远，你的名要叫亚伯拉罕，因为我已立你作多国之父。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይጼዋዕ
  choice: 不再叫
  rationale: 该否定被动式表达名字不再被如此称呼；汉语用“不再叫”自然且贴近原意。
- source_word: አምይእዜ፡ ወእስከ፡ ለዓለም
  choice: 从今直到永远
  rationale: 分别保留“从现在”和“直到永远”的时间范围，同时使现代汉语流畅。
- source_word: አበ፡ ብዙኃን፡ አሕዛብ
  choice: 多国之父
  rationale: “አሕዛብ”在此指多个民族或国家；“多国之父”既简洁，又呼应创世记传统措辞。
- source_word: ሤምኩከ
  choice: 我已立你作
  rationale: 该动词表示任命、设立；完成式以“已”体现已经作出的立约性宣告。
theological_decisions:
- issue: 神所作宣告的时态与效力
  choice: 我已立你作
  alternative: 我要使你成为
  rationale: 原文采用完成式，强调设立已经成立；不改写为单纯将来事件。
- issue: “多国”的所指
  choice: 多国
  alternative: 许多民族／外邦人
  rationale: 保留原文可涵盖民族与国家的语义范围，不将其限定为宗教意义上的“外邦人”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原文由“亚伯兰”改名为“亚伯拉罕”的正式宣告语气，并以分号清楚呈现旧名与新名的对照。
