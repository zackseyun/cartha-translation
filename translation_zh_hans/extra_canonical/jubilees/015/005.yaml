  yaml_path: translation/extra_canonical/jubilees/015/005.yaml
  text: And Abram fell on his face, and God spoke with him and said, “Behold, my covenant is with you, and you shall become the father of many nations.”
translation:
  language: zh_hans
  text: 亚伯兰俯伏在地。上帝对他说：“看哪，我的约与你同在；你将成为多国之父。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወድቀ፡ አብራም፡ በገጹ፡
  choice: 亚伯兰俯伏在地
  rationale: 原文直译为“亚伯兰伏在他的脸上”，这是表示俯伏的惯用表达；译作“俯伏在地”符合现代汉语习惯，也保留敬畏、降服的姿态。
- source_word: ተናገሮ፡ እግዚአብሔር፡
  choice: 上帝对他说
  rationale: 动词带第三人称阳性单数宾语后缀，表达上帝向亚伯兰说话；“上帝”是现代标准普通话中自然、庄重且不偏宗派的称呼。
- source_word: ናሁ፡
  choice: 看哪
  rationale: 保留原文用于郑重引出宣告的提示词及其庄严语气。
- source_word: ሥርዓትየ፡ ምስሌከ፡
  choice: 我的约与你同在
  rationale: ሥርዓት 可指规例、制度或约定；本段承接亚伯拉罕立约语境，对应《创世记》17:4，故“约”最贴切。ምስሌከ 直义为“与你同在”，因此不改写为较强的“我与你立约”。
- source_word: ወትከውን፡ አበ፡ ለብዙኃን፡ አሕዛብ፡
  choice: 你将成为多国之父
  rationale: 准确表达将来时意义；አሕዛብ 在此指多个民族或邦国，传统立约表述“多国之父”简洁、自然且与源语结构相称。
theological_decisions:
- issue: ሥርዓትየ 在本节应译为“约”还是“律例／规例”
  choice: 约
  alternative: 我的律例与你同在
  rationale: 该词本身语义较宽，但本节直接重述亚伯拉罕之约的宣告，语境明确支持“约”；如此翻译并非引入特定宗派解释。
- issue: ምስሌከ 的关系表达
  choice: 与你同在
  alternative: 是与你立的／我与你立约
  rationale: 保留源语静态关系表述，避免加入原文未明说的立约动作，同时维持“约已临到并属于你”的张力。
- issue: “多国之父”的含义
  choice: 保留“多国”而不解释为特定族群或属灵群体
  alternative: 许多民族的祖先
  rationale: 源语并未在本节界定这些国的身份；直译可避免加入后来的神学限定。“父”也比“祖先”更贴近原文及立约称号。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“看哪”和“多国之父”等具有经文宣告色彩的表达；以句号拆分叙述与神谕，使中文节奏清晰。无脚注标记。
