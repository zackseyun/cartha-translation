  yaml_path: translation/extra_canonical/jubilees/015/028.yaml
  text: And you, command the children of Israel, and let them keep the sign of the covenant throughout their generations as an everlasting ordinance, and they shall not be uprooted from the land.
translation:
  language: zh_hans
  text: 你也要吩咐以色列子孙，叫他们世世代代遵守这约的记号，作为永远的定例；并且他们不会从这地上被拔除。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: 你也
  rationale: 保留连接词及强调性的第二人称表达，不加入原文没有的“现在”。
- source_word: ለውሉደ፡ እስራኤል
  choice: 以色列子孙
  rationale: 直译其亲属群体称谓，同时采用现代中文圣经语体中自然且易懂的表达。
- source_word: ትእምርተ፡ ኪዳን
  choice: 这约的记号
  rationale: 对应“约的记号”；中文以“这约”自然回指语境中的约，并未改变所属关系。
- source_word: ለትውልዶሙ
  choice: 世世代代
  rationale: 自然表达“在他们的各代中／贯穿他们的世代”。
- source_word: ለሥርዐት፡ ዘለዓለም
  choice: 作为永远的定例
  rationale: “定例”准确体现持续有效的规定，“永远”保留时间范围。
- source_word: ወኢይሠረዉ፡ እምነ፡ ምድር
  choice: 他们就不会从这地被拔除
  rationale: 保留被动意象“拔除”及从土地上除去的含义；“这地”按上下文自然指向所应许之地。
theological_decisions:
- issue: 遵守约的记号与不从地上被拔除之间的关系
  choice: 用“这样”表达承接关系，但不进一步界定为严格的功德因果或无条件保证
  alternative: 仅用“并且”，将两个分句纯并列
  rationale: 原文连接结构可体现顺承，而上下文带有诫命与结果的关联；译文保留这种张力，不加入特定神学体系的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话；句式保持经文感，但避免文言化。“吩咐”“遵守”“定例”“拔除”均为普通读者可理解的宗教叙事用语。
