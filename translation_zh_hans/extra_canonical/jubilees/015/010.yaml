  yaml_path: translation/extra_canonical/jubilees/015/010.yaml
  text: And I will give to you and to your seed after you the land where you have resided as a foreigner, the land of Canaan, for an everlasting possession, and I will be their God.”
translation:
  language: zh_hans
  text: 我要把迦南地，就是你寄居的那片土地，赐给你和你之后的后裔，作为永远的产业；我也要作他们的上帝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: 该词本义可指“种子、后代”；此处是集体意义，译作“后裔”自然且符合应许语境。
- source_word: ኀበ፡ ፈለስከ
  choice: 你寄居过的地方
  rationale: ፈለሰ 在此表达以外来者身份居住、寄居；保留“寄居”可呈现亚伯拉罕尚未拥有该地的处境。
- source_word: ዘትኳን፡ ለዓለም
  choice: 作为永远的产业
  rationale: 按上下文理解为土地归属持续到永远；“产业”体现可占有、承受之地，而不强化现代财产权措辞。
- source_word: እከውኖሙ፡ አምላከ
  choice: 我要作他们的上帝
  rationale: 直译其关系性盟约表达，并保留复数代词所指向的后裔群体。
theological_decisions:
- issue: “永远”的时间力度
  choice: 永远
  alternative: 长久
  rationale: 源文 ለዓለም 具有强烈而开放的永久性表达；不因后续神学体系而将其弱化或限定。
- issue: 上帝与后裔的关系表述
  choice: 我要作他们的上帝
  alternative: 我要成为他们的上帝
  rationale: 两者均可表达原意；“作他们的上帝”更凝练，也保留盟约关系的庄重语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句序略作汉语化处理，以“就是迦南地”明确同位关系；保留“寄居”“后裔”“永远的产业”等关键盟约用语。
