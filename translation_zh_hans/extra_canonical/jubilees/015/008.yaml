base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/008.yaml
  text: And I will make you very great, and I will make you into nations, and kings shall come out from you. And I will establish my covenant between me and you and between your seed after you throughout their generations, as an everlasting ordinance, so that I may be God to you and to your seed after you.
translation:
  language: zh_hans
  text: 我要使你极其昌盛，使你成为许多民族；君王必从你而出。我要在我和你之间，以及我和你之后的后裔之间，立定我的约，世世代代作为永远的定例，使我作你和你之后后裔的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዐብየከ ጥቀ
  choice: 使你极其昌盛
  rationale: 保留“使……非常大／兴盛”的强化含义，同时用现代汉语自然表达人口、势力和福分的增长。
- source_word: አሕዛብ
  choice: 许多民族
  rationale: 原词为复数；加入“许多”使汉语明确呈现多个民族，而不将其限缩为现代政治意义上的“国家”。
- source_word: እሁብ ኪዳንየ
  choice: 立我的约
  rationale: 字面可作“赐下我的约”，但在盟约语境中“立约”是自然且准确的汉语表达，也与整句所述双方及后裔之间的关系相符。
- source_word: በትዝምዶሙ
  choice: 世世代代
  rationale: 表达“按着他们的世代／贯穿他们的各代”，符合现代汉语经文语体。
- source_word: ሥርዓት ዘለዓለም
  choice: 永远的定例
  rationale: 保留“定例、规例”与前面的“约”之间的词义区别，不把两者直接合并。
- source_word: እኩንከ አምላከ
  choice: 使我作……的上帝
  rationale: 对应目的结构“使／为要我成为你的上帝”，保留盟约关系的表达。
theological_decisions:
- issue: “永远的定例”与“约”的关系
  choice: 保留为两个相关但不同的表述
  alternative: 将“永远的定例”直接译成“永远的约”
  rationale: 原文先说“我的约”，后用“永远的定例”描述其持续性；保留词汇差异可避免提前消解两者之间的语义张力。
- issue: 上帝与亚伯拉罕及其后裔的关系
  choice: 直译为“使我作你和你身后后裔的上帝”
  alternative: 解释性改写为“使你们永远敬拜我”或“使我保护你们”
  rationale: 原文陈述的是盟约性的身份关系，其具体内涵不宜在正文中被单一解释取代。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“昌盛”“立约”“定例”等词保留经文语感，但句法尽量自然；“你身后……的后裔”保留原文“在你之后”的代际表达。
