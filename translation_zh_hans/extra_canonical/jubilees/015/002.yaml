  yaml_path: translation/extra_canonical/jubilees/015/002.yaml
  text: 'And he offered a new sacrifice on the altar, the firstfruits of the produce, to the Lord: a bull and a goat and a sheep on the altar as a pleasing aroma to the Lord; and their grain offering and their drink offering he offered on the altar with incense.'
translation:
  language: zh_hans
  text: 他在祭坛上向耶和华献上新的祭物，就是初熟的谷物；又把一头公牛、一只山羊羔和一只绵羊献在祭坛上，作献给耶和华怡人的馨香；并把相应的素祭和奠祭同香一起献在祭坛上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕተ፡ ሐዲስ
  choice: 新的祭
  rationale: 依次保留“祭物/祭”与“新”的基本含义，以自然汉语表达。
- source_word: ቀዳሜ፡ እክል
  choice: 初熟的谷物
  rationale: ቀዳሜ 表示最先或初熟之物，እክል 指食粮、谷物；此处按献祭语境译为“初熟的谷物”。
- source_word: ላህመ፡ ወበሐኮ፡ ወበግዐ
  choice: 一头公牛、一只山羊羔和一只绵羊
  rationale: 分别按牛、幼山羊和羊处理；特别保留 በሐኮ 的幼山羊义，不误译为公绵羊。
- source_word: ጽንሓሐ፡ ለእግዚአብሔር
  choice: 蒙耶和华悦纳的馨香之祭
  rationale: 该短语处于献祭语境，兼顾香气与蒙神悦纳的惯用祭祀表达，而不译成祭物种类“燔祭”。
- source_word: መሥዋዕቶሙ፡ ወሞጻሕቶሙ
  choice: 相应的素祭和奠祭
  rationale: 按祭祀术语区分谷物供献与浇奠之祭；复数领属形式用“相应的”自然承接前列牲畜。
- source_word: ስኂን
  choice: 香料
  rationale: 采用较宽泛的香料称呼，避免在词义证据不足时过度限定为乳香。
theological_decisions:
- issue: “馨香”是否只表示气味，还是包含神悦纳祭物之意
  choice: 蒙耶和华悦纳的馨香之祭
  alternative: 献给耶和华作馨香
  rationale: 译文保留祭物发出馨香的图像，同时明示该固定祭祀措辞中的悦纳含义，但不把它改释为某一特定祭类。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；沿用普通读者熟悉的祭祀术语“素祭、奠祭、馨香之祭”，句法则适度拆分，避免古奥。
