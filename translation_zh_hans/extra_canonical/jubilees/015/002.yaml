revisions:
- from: 他在祭坛上向耶和华献上新的祭，就是初熟的谷物；又把一头公牛、一只山羊羔和一只绵羊献在祭坛上，作为蒙耶和华悦纳的馨香之祭。他也把相应的素祭和奠祭连同香料一起献在祭坛上。
  to: 他在祭坛上向耶和华献上新的祭物，就是初熟的谷物；又把一头公牛、一只山羊羔和一只绵羊献在祭坛上，作献给耶和华怡人的馨香；并把相应的素祭和奠祭同香一起献在祭坛上。
  rationale: 修订仅调整两处：以“香”准确对应献祭用的 incense；将“馨香之祭”的定类式表达改为“作献给耶和华怡人的馨香”，更紧贴原文，同时保留献祭语境中神悦纳的含义。其余动物名称保留“公牛、山羊羔、绵羊”，其中“山羊羔”正确反映 በሐኮ 的幼山羊义，未采纳有争议且不合本词的“公绵羊”。
