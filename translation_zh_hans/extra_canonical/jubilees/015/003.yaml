  yaml_path: translation/extra_canonical/jubilees/015/003.yaml
  text: And the Lord appeared to Abram and said to him, “I am God Shaddai; be pleasing before me, and be blameless.”
translation:
  language: zh_hans
  text: 主向亚伯兰显现，对他说：“我是沙代神；你要在我面前蒙悦纳，并要纯全。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 该词在吉兹语经文中是通常对应神圣名号的称谓；采用现代中文圣经读者熟悉的“耶和华”。
- source_word: አምላክ፡ ሰዳይ
  choice: 沙代神
  rationale: 保留神圣称号“Shaddai”的音译，不以“全能”解释性替代，从而保留称号本身的语义开放性。
- source_word: አሥምር፡ ቅድሜየ
  choice: 在我面前蒙悦纳
  rationale: አሥምር 表示“使人喜悦、蒙悦纳”，与本吉兹语文本所反映的传统一致；不按希伯来语《创世记》17:1协调为“行走”。中文用“蒙悦纳”自然表达“在我面前成为可喜悦的”。
- source_word: ኩን፡ ፍጹመ
  choice: 要纯全
  rationale: ፍጹመ 可指完整、完全或无可指摘；“纯全”兼顾人格完整与伦理无可指摘，避免暗示绝对无罪。
theological_decisions:
- issue: “沙代”的翻译
  choice: 音译为“沙代神”
  alternative: 全能的神
  rationale: 原文保留专名式神圣称号；音译避免将可能的词源或神学解释固定为唯一含义。
- issue: 命令语“አሥምር”的文本传统
  choice: 在我面前蒙悦纳
  alternative: 行在我面前
  rationale: 依据所给吉兹语动词本身翻译，而不以《创世记》马所拉文本的措辞替换，保存《禧年书》文本传统的差异。
- issue: ፍጹመ 的伦理强度
  choice: 纯全
  alternative: 完全／无可指摘
  rationale: “纯全”保留完整、正直的要求，同时不额外断言此处要求形而上的完美或绝对无罪。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“对他说”清楚传达间接宾语；分号连接两个命令。“蒙悦纳”略带经文语体，但普通读者可理解，并准确区别于“行走”。
