base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/032.yaml
  text: But over Israel he did not hand over or entrust any angel or spirit, for he alone is their ruler, and he will guard them and require them from the hand of his angels and from the hand of his spirits and from the hand of all his authorities, so that he may guard them and bless them, and that they may be his and he may be theirs from now and forever.
translation:
  language: zh_hans
  text: 至于以色列，他没有把他们交给或托付给任何天使或任何灵[a]，因为惟有他是他们的统治者。他必看守他们，并从他的众天使、他的众灵和他一切掌权者手中追讨他们[b]，为要看守他们，赐福给他们，使他们成为属他的；他也成为属他们，从今直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他没有为以色列设立任何天使或灵。”
    reason: 说明这一短语也可按其功能译为“设立”，同时正文保留原文两个动词“交给”和“托付”的具体意味。
  - marker: b
    text: “追讨他们”也可译作“寻找他们”或“从……手中索回他们”；这里可能含有要求交代的意思。
    reason: 原动词语义范围包括寻找、索求、追讨；与“从……手中”搭配时，既可能强调索回，也可能强调问责。
lexical_decisions:
- source_word: ኢያሰለመ፡ ወአመነሂ
  choice: 没有把他们交给或托付给
  rationale: 保留原文相连的两个动词。“交给”表达移交管辖，“托付给”表达委托照管；不只译作“设立”，以免丢失以色列未被交由天使管理的关键意象。
- source_word: መኰንኖሙ
  choice: 他们的统治者
  rationale: 表达实际治理与管辖，较“官长”更适合此处神对以色列的独一统治。
- source_word: የዐቅቦሙ / ይዕቀቦሙ
  choice: 看守他们
  rationale: 两处采用同一译法，以保留原文重复；“看守”兼有保护和守护之意。
- source_word: ይትኀሠሦሙ፡ እምእዴ
  choice: 从……手中追讨他们
  rationale: 该动词可指寻找、索求或追讨；与“从……手中”连用时含索回并要求交代之意。“追讨”保留其力度和问责色彩。
- source_word: ትእዛዝያኒሁ
  choice: 他的……掌权者
  rationale: 按与天使、灵并列的属灵权柄理解，译作“掌权者”，但不进一步界定其等级或性质。
- source_word: ይኩንዎ፡ ሎቱ፡ ወውእቱ፡ ይኩኖሙ፡ ሎሙ
  choice: 使他们归他，他也归他们
  rationale: 保留原文双向归属的对称表达，不将其解释性改写为较熟悉的盟约公式，从而保存原文独特措辞及其张力。
theological_decisions:
- issue: 以色列与天使治理的关系
  choice: 明确译出神没有把以色列“交给或托付给”任何天使或灵
  alternative: 他没有为以色列设立任何天使或灵
  rationale: 原文用了两个动词，强调未将以色列移交或委托给属灵存在；正文保留这一神学对比，脚注提供功能性译法。
- issue: 神向其天使、灵和掌权者追讨以色列
  choice: 保留“他的”以及“从……手中追讨”的表述
  alternative: 解释为神单纯从敌对势力手中拯救以色列
  rationale: 原文称这些存在为“他的”，并没有明说它们敌对；译文不把经文张力化解为善恶阵营的解释。
- issue: 神与以色列的相互归属
  choice: 使他们归他，他也归他们
  alternative: 使他们作他的子民，他作他们的神
  rationale: 后一种虽符合常见盟约语言，却加入了原文此处未明说的“子民／神”；直译式对称表达更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“惟有”“从今直到永远”等经文体表达，但避免古奥句法。两次重复“看守他们”，以反映原文的修辞重复；末句维持双向归属的对称和神学张力。
