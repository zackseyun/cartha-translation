base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/034.yaml
  text: And there will be great wrath from the Lord against the children of Israel, because they have forsaken his covenant and turned aside from his word and provoked and blasphemed, in that they do not perform the ordinance of this law; for they have made themselves like the nations, for uprooting and destruction from the earth. And there will no longer be for them pardon or forgiveness, that they should be forgiven and pardoned for all the sin of this eternal error.
translation:
  language: zh_hans
  text: 主必向以色列子孙大发烈怒，因为他们离弃了他的约，偏离了他的话，又惹他发怒、亵渎他；他们不遵行这律法的条例，反倒使自己变得与列国一样，以致从地上被连根拔除、彻底消灭。此后，他们再也没有宽恕或赦免，使他们得以从这一永远的迷误的一切罪中蒙宽恕、获赦免。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一永远的迷误的一切罪，都不能蒙宽恕、获赦免。”原文明确含有“罪”一词；“罪”与“这一永远的迷误”之间的具体关系不宜在译文中明确化为因果关系。
    reason: 保留原文末句中“罪”与“迷误”关联结构的歧义，并明确译出“罪”。
lexical_decisions:
- source_word: መዓት፡ ... ዐቢይ
  choice: 大发烈怒
  rationale: 保留“大怒”的强烈审判语气，同时使用现代汉语中庄重自然的表达。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 按此处称谓直译为“主”，不额外引入原文未明确要求的专名形式。
- source_word: ኀደጉ፡ ኪዳኖ
  choice: 离弃了他的约
  rationale: 准确表达主动抛弃盟约，而非仅仅违背某项规定。
- source_word: እምቃሉ፡ ተገኅሡ
  choice: 偏离了他的话
  rationale: 保留“从……转离”的空间性隐喻，并使中文流畅。
- source_word: ወወሐኩ፡ ወጸረፉ
  choice: 又惹他发怒、亵渎他
  rationale: 分别保留挑衅/触怒与亵渎两个并列行为，不合并弱化。
- source_word: ሥርዐተ፡ ለዝ፡ ሕግ
  choice: 这律法的条例
  rationale: “条例”对应规定或礼仪性规条，“律法”对应整体法令，保留两层结构。
- source_word: ገብሩ፡ ነፍሳቲሆሙ፡ ከመ፡ አሕዛብ
  choice: 使自己变得与列国一样
  rationale: “自己的性命/自身”在此是反身表达，译作“自己”较自然；“列国”保留犹太文献中的群体对照。
- source_word: ለስስሎ፡ ወለተሠርዎ፡ እምድር
  choice: 以致从地上被连根拔除、彻底消灭
  rationale: 以两个并列结果表达拔除与除灭；“连根拔除”体现源词的强烈意象。
- source_word: ኅድገተ፡ ወስርየተ
  choice: 宽恕或赦免
  rationale: 保留原文两个近义赦罪词的并列，而不压缩为一个词。
- source_word: ኵሉ፡ ኃጢአት
  choice: 一切罪
  rationale: 明确译出ኃጢአት“罪”，避免此前译文遗漏。
- source_word: ስሕተት፡ ዛቲ፡ ዘለዓለም
  choice: 这一永远的迷误
  rationale: “迷误”兼具偏离、错误之意；“永远的”保留时间限定，不擅自解释为不可赦免的教义术语。
theological_decisions:
- issue: 最后一句中罪、迷误与赦免之间的关系
  choice: 译为“不能从这一永远的迷误所产生的一切罪中蒙宽恕、得赦免”
  alternative: “这一永远的迷误的一切罪都不能蒙宽恕、得赦免”
  rationale: 原文明确含“罪”，且“迷误”与“罪”构成属格关系；正文以“所产生”使现代中文可懂，但脚注保留更贴近原文结构的译法，避免把两者等同或删去其中之一。
- issue: 审判结果的目的或结果语气
  choice: 用“以致”表达
  alternative: 用“为要”表达
  rationale: 上下文可理解为他们自比列国后招致拔除和毁灭；“以致”保留结果意味，避免断言他们主观上以毁灭为目的。
- issue: “永远的迷误”是否等同某一特定教义概念
  choice: 不作教义化解释
  alternative: 译成某种宗派化的“永不得赦免之罪”术语
  rationale: 原文保持“迷误—罪—不得赦免”的张力，译文不额外认定其与其他经文中的特定罪名完全相同。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“烈怒、离弃、亵渎、条例、赦免”等词保持宗教文献的尊严感；句法适度拆分，避免照搬原文连串结构造成晦涩。脚注标记已在正文中以[a]出现。
