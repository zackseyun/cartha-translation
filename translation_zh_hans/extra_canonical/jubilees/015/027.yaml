  to: 因为所有侍立在上帝面前的天使和所有圣洁的天使，自受造之日起便是如此受造的[b]；上帝又在侍立在他面前的天使和圣洁的天使面前[a]，使以色列分别为圣，使他们可以与他和他的圣天使同在。
  rationale: 仅调整“他们的受造就是如此”的汉语句法，使“自受造之日起”的时间关系清晰，并保留原文关于受造状态的简洁与含混。其余关键术语、第二处天使短语未添加“所有”的细节，以及አንጻር的脚注歧义均予保留。
