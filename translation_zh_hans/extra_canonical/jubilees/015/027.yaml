  yaml_path: translation/extra_canonical/jubilees/015/027.yaml
  text: For all the angels of the presence and all the angels of holiness—thus was their creation from the day of their creation—and before the angels of the presence and the angels of holiness he sanctified Israel, that they might be with him and with his holy angels.
translation:
  language: zh_hans
  text: 因为所有侍立在上帝面前的天使和所有圣洁的天使，自受造之日起便是如此受造的[b]；上帝又在侍立在他面前的天使和圣洁的天使面前[a]，使以色列分别为圣，使他们可以与他和他的圣天使同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与侍立在他面前的天使和圣洁的天使相对”。
    reason: 原文አንጻር可表示“在……面前”，也可表示“与……相对”。
  - marker: b
    text: 或译：“他就是这样创造了他们”。
    reason: 原文采用“他们的受造”这一名词性表达；此替代译法按其隐含的主动意义表达。
lexical_decisions:
- source_word: መላእክተ፡ ገጽ
  choice: 侍立在上帝面前的天使
  rationale: 字面为“面前／临在的天使”。此译避免生硬的“面容天使”，并以现代汉语表达其在上帝面前侍立的含义。
- source_word: መላእክተ፡ ቅዳሴ
  choice: 圣洁的天使
  rationale: 按ቅዳሴ的圣洁、神圣语义直译，与后文“圣天使”相呼应。
- source_word: ፍጥረቶሙ
  choice: 他们的受造
  rationale: 保留原文名词结构“他们的受造／创造”，不擅自改写成明确的主动句“他创造了他们”。
- source_word: ወአንጻሮሙ
  choice: 又在……面前
  rationale: አንጻር可指面对、相对或在……面前；正文采用语境中较自然的“在……面前”，脚注保留“与……相对”的可能。
- source_word: ቀደሶ፡ ለእስራኤል
  choice: 使以色列分别为圣
  rationale: 表达使之成为圣、归于神圣用途的使役含义，较单用“圣化”更符合现代标准汉语。
theological_decisions:
- issue: “他”所指与“上帝”是否应在译文中明说
  choice: 首次以“上帝”补明，后续使用“他”
  alternative: 全程仅用“他”
  rationale: 本节原文依赖上文确定主语；现代汉语若只写“他”容易指代不清。补明“上帝”是语篇层面的明晰化，并未改变行动主体。
- issue: 以色列被分别为圣与天使的关系
  choice: 译作在天使“面前”使以色列分别为圣
  alternative: 译作与天使“相对”而使以色列分别为圣
  rationale: 原词容许空间或对应关系两种理解；正文不把它扩展为某种天使论或以色列论，另一可能收入脚注。
- issue: “受造就是如此”的含义
  choice: 保留名词性和语义上的含混
  alternative: 解释为“他就是这样创造了他们”或“这就是他们受造的本性”
  rationale: 原文用名词“他们的受造”，其所指可能是受造方式、受造状态或本性；正文不替原文消解这一张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“分别为圣”保留经文语域，同时比“圣化”更易为普通读者理解。两处脚注标记均置于相关短语之后；句法尽量保留原文先述天使受造、再述以色列被分别为圣的并列结构。
