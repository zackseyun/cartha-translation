  yaml_path: translation/extra_canonical/jubilees/015/030.yaml
  text: For Ishmael and his sons and his brothers and Esau, the Lord did not bring near to himself, and he did not choose them, though they are the children of Abraham, because he knew them; and he chose Israel to be his people.
translation:
  language: zh_hans
  text: 至于以实玛利、他的儿子、他的兄弟和以扫，主没有使他们亲近自己，也没有拣选他们；他们虽是亚伯拉罕的子孙，主却认识他们，因此没有拣选他们。主拣选以色列作自己的子民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢያቅረቦ፡ ኀቤሁ
  choice: 没有使他们亲近自己
  rationale: 保留“带近/使亲近于他”的空间与关系意象，而不将其具体化为某种礼仪或救恩体系。
- source_word: ኢኀረየ፡ ቦሙ
  choice: 没有拣选他们
  rationale: “拣选”自然、庄重，并准确表达选择之意；宾语按上下文处理为复数。
- source_word: አእመሮሙ
  choice: 认识他们
  rationale: 保留“认识/知道”的宽泛语义，不擅自解释为预知其品格或行为。
- source_word: ሕዝበ
  choice: 自己的子民
  rationale: 在“使他成为”之后补明所属关系，使现代汉语顺畅，同时表达“成为他的民”的含义。
theological_decisions:
- issue: 第二个እስመ与“认识他们”的逻辑关系
  choice: 译作“因为主认识他们”
  alternative: “但主认识他们”
  rationale: እስመ通常表示原因，且最新源文审校明确指出这里应保留因果关系；不以转折消解经文的神学张力。
- issue: 以色列的单复数所指
  choice: “使他成为自己的子民”
  alternative: “使他们成为自己的子民”
  rationale: 源文中与“以色列”相关的代词形式可按集合性名称理解；正文采用单数“他”贴近语法，脚注说明集合性译法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。通过分句避免首句层次过密；保留“亲近”“拣选”“认识”等关键神学词汇的开放性，不加入关于预知、功德或盟约机制的额外解释。
