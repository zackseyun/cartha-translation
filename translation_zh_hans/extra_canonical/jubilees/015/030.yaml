revisions:
- from: 因为以实玛利、他的儿子、他的兄弟和以扫，主没有使他们亲近自己，也没有拣选他们，尽管他们是亚伯拉罕的子孙；因为主认识他们。主拣选了以色列，使他成为自己的子民。[a]
  to: 至于以实玛利、他的儿子、他的兄弟和以扫，主没有使他们亲近自己，也没有拣选他们；他们虽是亚伯拉罕的子孙，主却认识他们，因此没有拣选他们。主拣选以色列作自己的子民。
  rationale: 修订仅调整句法和指代：以“因此没有拣选他们”使“认识他们”明确作为未拣选的原因，保留其宽泛的“认识”含义，不将其释为预知品格或行为；末句改为“拣选以色列作自己的子民”，自然呈现集合性名称而不添加解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:57:01Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本保留了未使其亲近、未拣选、亚伯拉罕后裔、认识他们及拣选以色列为民等要素。为更清楚地保留第二个表示原因的连接词，宜将“因为主认识他们”明确连于前述未拣选，而不让其在汉语中悬置或似乎连于拣选以色列。
  naturalness: 原文首句过长，且“尽管……；因为……”在现代汉语中逻辑附着不够清晰。“他们虽是……，主却认识他们；因此……”能保持庄重自然，并明示因果关系。
  terminology: “亲近”“拣选”“认识”“子民”均适切，应予保留。“作自己的子民”比“使他成为自己的子民”更自然，也避免把集合性的“以色列”误读成单一个人。
  issues:
  - severity: medium
    issue: 第二个“因为主认识他们”的因果所指在汉语中不够明确。
    rationale: 源文的第二个 እስመ 应保留原因关系。置于“尽管……；因为……”之后，读者可能不易判断其解释的是未拣选他们，还是后面的拣选以色列。改为“因此没有拣选他们”可清晰保留而不扩展“认识”的含义。
  - severity: low
    issue: “使他成为自己的子民”中的单数代词略显生硬。
    rationale: “以色列”虽为单数名称，却指集合性的民族；汉语以“拣选以色列作自己的子民”可自然表达原文，并无需解释性脚注。
  revised_text: 至于以实玛利、他的儿子、他的兄弟和以扫，主没有使他们亲近自己，也没有拣选他们；他们虽是亚伯拉罕的子孙，主却认识他们，因此没有拣选他们。主拣选以色列作自己的子民。
