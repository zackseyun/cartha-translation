  to: 现在我告诉你：以色列子孙必不遵守这条例，也不按照全律法给他们的儿子行割礼；因为他们在给儿子行割礼时，会留下一部分肉。彼列的众子必使他们的儿子仍保持出生时未受割礼的样子。
