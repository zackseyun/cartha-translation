base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/033.yaml
  text: And now I am telling you that the children of Israel will not keep this ordinance, and they will not circumcise their sons according to all the law; for they will leave some of the flesh of their circumcision in the circumcision of their sons, and all the sons of Belial will leave their sons uncircumcised as they were born.
translation:
  language: zh_hans
  text: 现在我告诉你：以色列子孙必不遵守这条例，也不按照全律法给他们的儿子行割礼；因为他们在给儿子行割礼时，会留下一部分肉。彼列的众子必使他们的儿子仍保持出生时未受割礼的样子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐት
  choice: 条例
  rationale: 此词在本节指应当遵守的割礼规条；“条例”既准确，也符合现代庄重汉语。
- source_word: ኵሉ፡ ሕግ
  choice: 全部律法
  rationale: 原文直译为“全部律法”，没有指示词，因此不增译“这”。
- source_word: ክስበት
  choice: 割礼／行割礼
  rationale: 依具体句法分别采用名词和动词表达，使中文自然，同时保留原文反复出现的核心概念。
- source_word: ውሉደ፡ ቤልአር
  choice: 彼列的众子
  rationale: 保留“众子”这一闪族式群体称谓及“彼列”专名，不将其解释性改写为某一特定神学身份。
- source_word: ዘእንበለ፡ ክስበት
  choice: 不受割礼
  rationale: 准确表达未行割礼的状态，并与下文“像出生时那样”自然衔接。
theological_decisions:
- issue: “彼列的众子”的身份
  choice: 彼列的众子
  alternative: 邪恶之徒／属彼列的人
  rationale: 原文使用亲属群体式称谓；保留原貌可避免把“彼列”预先解释为抽象邪恶或特定恶魔论角色。
- issue: 割礼不完全之语的指向
  choice: 他们给儿子行割礼时，会留下割礼之肉的一部分
  alternative: 他们会留下一部分割礼之肉，并且彼列的众子……
  rationale: 原文明确包含“在他们儿子的割礼中”，正文将该短语与留下肉相连；但原文结构较为生硬，故以脚注保留较松散的断句可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“仍像出生时那样”避免生硬直译，同时清楚表达儿子保持未受割礼的状态。
