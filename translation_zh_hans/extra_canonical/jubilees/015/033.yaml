  naturalness: “割礼之肉的一部分”虽可理解，但现代汉语略显生硬；改为“在给儿子行割礼时留下一部分肉”更自然，并清楚表达割礼不完全。末句改为“使……仍保持出生时未受割礼的样子”，比“让……仍像出生时那样，不受割礼”更顺畅明确。
  terminology: “条例”“割礼”“彼列的众子”均适切。将“全部律法”调整为“全律法”，在庄重现代汉语中更凝练，且不增加原文没有的指示词。
