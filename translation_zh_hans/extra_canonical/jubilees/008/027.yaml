base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/027.yaml
  text: For I see, and behold, the demons have begun to lead you and your children astray. And now I fear for you, that after my death you will shed human blood upon the earth, and you too will be destroyed from the face of the earth.
translation:
  language: zh_hans
  text: 因为我看见：看哪，鬼魔已经开始使你们和你们的儿女走入歧途。如今我为你们担心，恐怕我死后，你们会在地上流人的血，你们自己也会从地上被除灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጋንንት
  choice: 鬼魔
  rationale: 该词为“魔鬼、邪灵”的复数；“鬼魔”既保留其超自然恶灵含义，也符合庄重的现代汉语经文语体。
- source_word: አበሱተ ወጠኑ
  choice: 已经开始引诱……偏离正道
  rationale: 保留“开始”的起始体意义，并以“引诱……偏离正道”自然表达使人走入歧途的语义。
- source_word: ትክዐዉ ደመ ሰብእ
  choice: 你们会……流人的血
  rationale: 直译核心意象“倾流人的血”，采用现代汉语惯用表达“流人的血”。
- source_word: ትደመሰሱ
  choice: 会被除灭
  rationale: 表达彻底毁灭、抹除之意，并与后面的“从地面上”自然衔接。
theological_decisions:
- issue: 引诱者的身份
  choice: 明确译作复数的“鬼魔”
  alternative: 魔鬼／邪灵
  rationale: 原文使用复数名词，译文不将其归并为单一的“魔鬼”，也不弱化为泛指的邪恶影响。
- issue: 警告的确定性与语气
  choice: 以“担心，恐怕……会……”表达
  alternative: 断言“你们必会……”
  rationale: 原文由“我为你们担心”引出后续内容，保留警告中的忧惧语气，不将其强化为无条件预言。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“因为我看见了：看哪”保留原文的因果衔接与突显语气；“连你们也”传达原文强调的“你们也”。未采用所给英文脚注，因为其内容属于另一节的旧译，并非本节原文异文。
