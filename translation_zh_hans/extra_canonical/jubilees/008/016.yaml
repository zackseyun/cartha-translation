  yaml_path: translation/extra_canonical/jubilees/008/016.yaml
  text: And it goes toward the border of this river, and it goes toward the east until it approaches the garden of Eden, toward its north, to the north, and from the east of all the land of Eden, and to all the east, and it turns within the east and comes until it approaches the east of the mountain whose name is
translation:
  language: zh_hans
  text: 它向这条河的边界延伸，又向东延伸，直到临近伊甸园，朝着它的北面，向北；又从伊甸全地的东面，向着整个东方。它在东方转向，继续延伸，直到临近那座山的东面；那山名叫——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንገበ
  choice: 朝着／向／……的东面
  rationale: 该词在本节反复表示方向或朝向，不译作“道路”；依不同句法位置用自然汉语表达。
- source_word: ድንጋጉ፡ ለዝ፡ ፈለግ
  choice: 这条河的边界
  rationale: 将ድንጋጉ理解为带第三人称阳性单数后缀的“边界、岸界”，而不是专名“Dungagu”；ለዝ፡ ፈለግ限定为“这条河的”。
- source_word: ገነት፡ ዘኤዶም
  choice: 伊甸园
  rationale: 采用现代汉语读者熟悉且准确的地名表达。
- source_word: ሰሜኑ፡ ለሰሜን
  choice: 园的北面，向北
  rationale: 保留原文连续出现的“其北面”和“向北”，不将两者合并解释为“东北”。
- source_word: እምጽባሒሃ፡ ለኵላ፡ ምድረ፡ ኤዶም
  choice: 从伊甸全地的东面
  rationale: 保留介词“从”和“其东面”的关系，避免遗漏原文的起向信息。
- source_word: መንገበ፡ ጽባሒሁ፡ ለደብር
  choice: 那座山的东面
  rationale: 按属格关系理解为朝向山的东面，而不是笼统的“向东到山那里”。
