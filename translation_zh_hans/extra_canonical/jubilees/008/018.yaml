  text: For Shem and for his sons to possess it forever, for his generations forever. And Noah rejoiced because this portion came forth for Shem and for his sons, and he remembered all that he had spoken with his mouth in prophecy, for he said, “Blessed be the Lord God of Shem, and may he dwell...
translation:
  language: zh_hans
  text: 这份产业归给闪和他的儿子们，让他们及其后代永远占有。挪亚因这份产业归给了闪和他的儿子们而欢喜；他又想起自己曾以预言亲口说出的一切话，因为他说：“耶和华——闪的上帝——当受称颂！愿他居住……”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语文本在“愿他居住”之后中断，本译文因此以省略号表示句子未完。
    reason: 说明源文片段的截断状态，并避免擅自补译后文。
lexical_decisions:
- source_word: ለእኂዞታ
  choice: 让他们……占有这地
  rationale: 该形式是不定式并带阴性单数宾语后缀，直译为“为要占有它”；结合上文所分之地，以“这地”自然表达代词所指。
- source_word: መክፈልት
  choice: 这一份
  rationale: 表示分配所得的份额或地业；此处用“这一份”既承接土地划分语境，也不额外限定其性质。
- source_word: በትንቢት
  choice: 预言
  rationale: 指以预言方式所说的话；译为“亲口说出的全部预言”，保留话语的先知性。
- source_word: ይትባረክ
  choice: 当受称颂
  rationale: 被动祈愿式，表达“愿……被称颂”；汉语经文体以“当受称颂”自然而庄重。
- source_word: ወይኅድር
  choice: 愿他居住
  rationale: 祈愿式动词，意为“愿他居住/住下”；源文在此中断，故不补出地点或对象。
theological_decisions:
- issue: “耶和华、闪的上帝”的句法关系
  choice: 耶和华——闪的上帝——当受称颂
  alternative: 闪的上帝耶和华当受称颂
  rationale: 两种中文均可表达原文“耶和华，闪的上帝”。采用同位语破折号，清楚保留称号关系，不引入额外神学解释。
- issue: “愿他居住”中代词所指
  choice: 保留“他”，不明确指称
  alternative: 愿上帝居住／愿闪居住
  rationale: 原文动词为第三人称阳性单数，且所给文本止于动词，指称可能需由后文确定；不应在本节擅自消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“世世代代永远”保留原文重复的永恒表达；“亲口说出”对应“用他的口”，避免生硬直译。
