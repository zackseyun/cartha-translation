base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/040.yaml
  text: For everyone who sheds the blood of man, and everyone who eats the blood of any flesh, all of them will be destroyed from the earth.
translation:
  language: zh_hans
  text: 凡流人血的，凡吃任何有血肉之物的血的，全都必从地上被除灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“……他们都必从地上被除灭。”
    reason: 原文在两个泛指主语之后使用复数代词作总括；正文用“全都”自然表达，也可较直译地保留“他们都”的复指结构。
lexical_decisions:
- source_word: ይክዑ፡ ደመ፡ ሰብእ
  choice: 流人血
  rationale: 按字面保留“倾倒人的血”这一惯用表达的含义，以现代汉语自然译为“流人血”。
- source_word: ይበልዕ፡ ደመ፡ ዘኵሉ፡ ዘሥጋ
  choice: 吃任何血肉之物的血
  rationale: 保留原文“吃”与“血”的直接措辞，并把“凡有血肉的”理解为各类有血肉的活物，不将其缩窄为某一种动物。
- source_word: ይደመሰሱ
  choice: 被除灭
  rationale: 表达从地上彻底消除、毁灭的被动含义，语体庄重且符合上下文。
- source_word: ኵሎሙ
  choice: 全都
  rationale: 原文以复指性的“他们全都”总结前面两类人；汉语用“全都”自然保留这一总括作用。
theological_decisions:
- issue: 刑罚对象是否涵盖前述两类人
  choice: 用“全都”明确同时涵盖流人血者和吃血者
  alternative: 将“都”仅贴近第二类人理解
  rationale: 原文复数总括词ኵሎሙ回指两个并列的泛指主语，不宜缩限其指涉。
- issue: 被除灭的施事者
  choice: 采用无施事者的被动句“被除灭”
  alternative: 明说“上帝要除灭他们”
  rationale: 原句没有明说施事者；保留被动可避免把上下文所暗示的施事者直接写入正文。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体；保留经文中“流人血”“从地上被除灭”等凝练表达，同时避免补入原文未明说的施事者。
