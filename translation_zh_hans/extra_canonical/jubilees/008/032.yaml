base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/032.yaml
  text: For because of these three things the flood came upon the earth—namely, because of the fornication by which the Watchers defiled themselves with the daughters of men, taking for themselves wives from all whom they chose, and they made a beginning of uncleanness;
translation:
  language: zh_hans
  text: 正是因这三件事，洪水临到地上：守望者[a]违背自己的法度，与世人的女儿行淫，玷污了自己；他们从自己所挑选的人中娶妻，并由此开始了污秽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守望者”是本书对这一群体的称呼；其身份与行为在上下文中另有叙述。
    reason: 保留专门群体称谓，并提供最少且不预断其本体性质的说明。
lexical_decisions:
- source_word: ትጉሃን
  choice: 守望者
  rationale: 该词在《禧年书》的相关语境中指那群下到地上、后来与世人女子结合的天上存在；“守望者”既保留传统称谓，也避免泛化为普通“天使”。
- source_word: ይርኩሱ
  choice: 玷污了自己
  rationale: 采用反身表达，保留行为使主体陷入不洁的含义，而不把它弱化为一般性的道德过失。
- source_word: ዝሙት / 相关淫乱表达
  choice: 淫乱
  rationale: 用现代读者易懂而庄重的词，传达非法性关系的含义，不额外限定为某一法律或婚姻制度下的专门罪名。
- source_word: ብእሲተ
  choice: 妻
  rationale: 此处指选取女子并建立婚配关系，译作“娶来为妻”自然地表达动作及身份。
- source_word: ርኵስ
  choice: 污秽
  rationale: 保留原文兼具道德与礼仪不洁色彩的张力，不窄化为单纯的性犯罪或礼仪违规。
theological_decisions:
- issue: 守望者的身份
  choice: 使用专名式称谓“守望者”，不解释其本体性质
  alternative: 译作“天使”或“警醒者”
  rationale: 上下文虽把他们置于天上使者传统中，但本句的群体称号本身应保留，避免替文本完成本体论判断。
- issue: “三件事”与本节只列第一项的结构
  choice: 保留“这三件事：第一”并让句子停在第一项
  alternative: 删去数目提示，或补入后文另外两项
  rationale: 原文的列举跨越后续经文；本节应保留这种未完待续的篇章结构，不擅自补足。
- issue: 不洁的起源表述
  choice: 译为“由此开了污秽的先河”
  alternative: 译为“他们是最先行污秽之事的”
  rationale: 表达他们开启了此类污秽行为，而不推断世上一切罪恶或一切礼仪不洁绝对起源于此。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“淫乱”“玷污”“污秽”保留原文严肃的伦理与洁净语汇；分号和“第一”清楚呈现因果及跨节列举结构。
