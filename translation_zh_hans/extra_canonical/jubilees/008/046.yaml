base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/046.yaml
  text: And do not eat blood with the flesh, lest your blood, which is your life, be required from the hand of all flesh that sheds blood on the earth.
translation:
  language: zh_hans
  text: 不可连肉带血一起吃[a]，免得你们的血，就是你们的生命，被从地上一切使血流出的活物手中追讨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译作“不可把生命和肉一起吃”。
    reason: 保留英文审计所列的另一种可能译法，不未经依据断言其为传本异文。
  - marker: b
    text: “一切……活物”直译为“一切血肉”。
    reason: 保留闪语式惯用表达的字面意义及其范围上的含混。
lexical_decisions:
- source_word: ደም (dam)
  choice: 血
  rationale: 按校订所据读法直译为“血”，保留本节前后反复出现的血之主题，不以“生命”替代首句的具体禁令。
- source_word: ሥጋ (śegā)
  choice: 肉
  rationale: 此处指可食之肉；“连肉带血一起吃”符合现代汉语，也清楚表达血仍与肉同在。
- source_word: ነፍስ (nafś)
  choice: 生命
  rationale: 在“你们的血，就是你们的生命”中取“生命”义，呈现血与生命的同位关系。
- source_word: ኵሉ ዘሥጋ (kwellu za-śegā)
  choice: 一切……活物
  rationale: 该惯用语字面为“一切血肉”；在此作为能流血并被追讨责任的主体，译作“活物”较自然，同时以脚注保留字面表达。
- source_word: ይትኀሠሥ (yitḫaśśaś)
  choice: 追讨
  rationale: 表达对所流之血追究责任的司法性含义，并保留原文未明说追讨者的被动张力。
theological_decisions:
- issue: 谁追讨所流之血
  choice: 采用“要……追讨”的无施事表达
  alternative: 明确译作“上帝必追讨”
  rationale: 原文在本句中没有明说追讨者；不补入“上帝”，以保留叙述的含蓄与司法意象。
- issue: 首句所禁的是血还是生命
  choice: 正文采用“血”
  alternative: “不可把生命和肉一起吃”
  rationale: 依照已审定的源文校订采用“血”，使禁令与后句“你们的血”直接呼应；同时以脚注说明传本文字所造成的异读。
translation_notes:
  register: 采用现代、庄重而易懂的叙事律法语体。“连肉带血一起吃”自然表达禁食带血之肉；后半句维持略带司法色彩的“追讨”，并不擅自补出施事者。
