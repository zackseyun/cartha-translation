base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/022.yaml
  text: all the land of Eden, and all the land of the Erythraean Sea, and all the land of the east, and India, and on the Erythraean Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the north, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea beyond the mountains of Asshur toward the north—a blessed and spacious land, and all that is in it is very good.
translation:
  language: zh_hans
  text: 以东全地、厄立特里亚海一带全境、东方全地、印度，以及厄立特里亚海及其群山；巴珊全地、黎巴嫩全地和迦斐托诸岛；西尼珥和亚玛拿的所有山岭；北方的亚述山岭；以拦、亚述和巴比伦全地，以及书珊和米底；亚拉腊的所有山岭；还有大海彼岸、越过亚述山岭、朝向北方的整个地区——这是一片蒙福而辽阔的土地，其中的一切都极其美好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኤዶም
  choice: 以东
  rationale: 按专名 Edom 音义传统译作“以东”，避免与“伊甸”混同。
- source_word: Erythraean Sea（吉兹文所传古地理名称）
  choice: 厄立特里亚海
  rationale: 采用音译以保留古代范围较广且未必等同现代红海的地理名称。
- source_word: Caphtor
  choice: 迦斐托
  rationale: 采用便于现代中文读者辨认的圣经地名音译。
- source_word: Senir / Amana
  choice: 西尼珥／亚玛拿
  rationale: 按传统圣经地名音译，保留两个独立山地名称。
- source_word: Asshur
  choice: 亚述
  rationale: 采用现代中文圣经与古代近东史常用名称。
- source_word: Susa / Media
  choice: 书珊／米底
  rationale: 采用中文圣经中通行的古地名，不依英语形式机械转写。
- source_word: Ararat
  choice: 亚拉腊
  rationale: 采用中文圣经通行译名。
- source_word: ቡርክት፡ ወስፍሕት
  choice: 蒙福而辽阔
  rationale: 分别表达“受福”和“宽广”，保留原文并列评价。
- source_word: ኵሉ፡ ዘውስቴታ፡ ጥቀ፡ ሠናይ
  choice: 其中的一切都极其美好
  rationale: 紧贴“其中一切—非常—好”的结构，并用自然庄重的现代汉语表达。
theological_decisions:
- issue: 地理清单是否作象征性或神学化解释
  choice: 按古代地理名称直译，不附加象征解释
  alternative: 把各地区解释为具有特定神学含义的疆域
  rationale: 本节本身是疆界与土地品质的陈述；不应把经文未明说的宗派性或私人解释带入正文。
- issue: 亚述山岭方位的文本问题
  choice: 正文作“北方”，脚注保留“南方”的异译可能
  alternative: 正文作“南方”
  rationale: 所给吉兹文证据及最新校勘说明支持“北方”，但既有传译存在“南方”，故以脚注保存差异。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。长串地名以分号分组，保持原文疆域清单的累积节奏；专名优先采用中文圣经和古代近东史常见译法。
