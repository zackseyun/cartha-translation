  text: Rafa. And it goes down toward the north to the bank of the Tina River. This portion came out by lot.
translation:
  language: zh_hans
  text: 拉法。[a]疆界向北下行，直到提拿河岸。[b]这一份是抽签所得的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉法”可能是上一节末尾地名的收尾部分。
    reason: verse_boundary
  - marker: b
    text: “向北”所依据的吉兹文词形可能有传抄讹误；若依现存词形直译，方向含义并不明确。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ራፋ
  choice: 拉法
  rationale: 按专名音译；该词在本节所给吉兹文开头独立出现，很可能承接上一节的地名列表，因此保留而不省略。
- source_word: ወይወርድ
  choice: 疆界……下行
  rationale: 词义为“并且它下去／下降”；结合划界语境，以“疆界”补明所指，使现代汉语自然，同时保留“下行”的空间意象。
- source_word: ጽንፉ … ጢና ፈለገ
  choice: 直到提拿河岸
  rationale: ጽንፉ 表示边缘、岸边，ፈለገ 表示河流；按汉语地名结构译作“提拿河岸”。
- source_word: መክፈልት
  choice: 这一份
  rationale: 指分配所得的份地；“这一份”既贴近原词，也与上下文的土地分配相合。
- source_word: ወፅአት በዕፁ
  choice: 是抽签所得的
  rationale: 原文直译近于“由签出来”；用现代汉语表达以抽签决定并获得份地的含义。
