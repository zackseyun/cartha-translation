  yaml_path: translation/extra_canonical/jubilees/008/042.yaml
  text: For they will go down into Sheol, and into the place of judgment they will descend, and into the darkness of the deep they will all go by a violent death.
translation:
  language: zh_hans
  text: 因为他们必下到阴间，降到审判之地，并因横死进入深渊的黑暗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “横死”也可译作“死于暴力”。
    reason: 原文末尾短语强调暴烈或非自然的死亡；脚注保留较直白的另一种表达。
lexical_decisions:
- source_word: ሲኦል
  choice: 阴间
  rationale: 这是“示奥尔”（Sheol）的音译词；“阴间”是现代中文圣经语境中自然且不预断其等同于最终刑罚之地的译法。
- source_word: መካን፡ ዘይደን
  choice: 审判之地
  rationale: 按字面表达为“施行审判的地方”或“受审判之地”；译作“审判之地”保留原文对地点与审判功能之间关系的含混。
- source_word: ጽልመት፡ ማዕምቅ
  choice: 深渊的黑暗
  rationale: 保留“黑暗”与“深处／深渊”的组合意象，同时使现代汉语表达顺畅。
- source_word: በሞት፡ ጸዋገ
  choice: 横死
  rationale: 该短语指暴烈、非自然或遭杀戮的死亡；“横死”简洁传达这种死亡方式，不额外指定施害者。
theological_decisions:
- issue: “阴间”与最终审判之地的关系
  choice: 分别译作“阴间”和“审判之地”
  alternative: 把两者合并理解为“地狱”
  rationale: 原文依次列出两个表达，不应以单一的后期神学术语消除其并列关系。
- issue: 死亡与进入黑暗之地的句法关系
  choice: 以分号区分去向与死亡方式：“他们全都必横死”
  alternative: 译作“他们全都将借着横死进入那里”
  rationale: 原文末尾短语可理解为方式或结局；采用并列收束，既符合上下文，也避免过度明确其逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；保留“阴间—审判之地—深渊的黑暗”的递进意象，并避免将这些术语统一解释为某一特定宗派的末世论概念。
