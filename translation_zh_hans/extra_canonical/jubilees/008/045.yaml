    18. ለሴም፡ ወለውሉዱ፡ ለእኂዞታ፡ ለዓለም፡ ለትውልዱ፡ እስከ፡ ለዓለም። ወተፈሥሐ፡ ኖኅ፡ እስመ፡ ወፅአ፡ ዝንቱ፡ መክፈልት፡" ለሴም፡ ወለ"ውሉዱ፡ ወተዘከረ፡ ኵሎ፡" ዘነበበ፡ በአፉሁ፡ በትንቢት፡" እስመ፡ ይቤ፡ ይትባረክ፡ እግዚአብሔር፡ *አምላኩ፡ ለሴም፡ ወይኅድር፡

    19. እግዚአብሔር፡ ውስተ፡ መሓድሪሁ፡ ለሴም። ወአእመረ፡ ከመ፡ ገነት፡" ኤዶም፡ ቅድስተ፡ ቅዱሳን፡ ወማኅደሩ፡ ለእግዚአብሔር፡ ውእቱ፡" ወደብረ፡ ሲና፡ ማእከለ፡ ገዳም፡" ወደብረ፡ ጽዮን፡ ማእከለ፡ ሕንብርት፡'' ለምድር፡ ሠለስቲሆሙ፡ ዝንቱ፡ *መንጸረ፡ ዝንቱ፡'' ለቅድስት፡"

    20. አሎ፡ ውሉደ፡ ኖኅ፡ ወበ፳፰ ወስብዓቲቱ፡'' አዩቤልውሳት፡'' እንዘ፡'' ኖኅ፡ የአዝዝ፡'' ሥርዐተ፡ ወትእዛዘ፡'' ለውሉደ፡ ውሉዱ፡'' ወኵሉ፡'' ዘያአምር፡ ፍትሐ፡'' ወአስምዐ፡ ላዕለ፡ ውሉዱ፡ ከመ፡ ይግበሩ፡ ጽድቀ፡ ወከመ፡ ይክድኑ፡ ኃፍረተ፡ ሥጋሆሙ፡ ወከመ፡ ይባርክዎ፡ ለዘፈጠሮሙ፡ ወያክብሩ፡ አበ፡ ወእመ፡ ወያፍቅሩ፡" አሐዱ፡ አሐዱ፡ ቢጾ፡" ወይዕቀቡ፡ ነፍሶሙ፡" እምዝሙት፡

    21. ወእግዚአብሔር፡" እስከ፡ ለዓለም። ወአእመረ፡ ከመ፡ መክፈልተ፡ በረከት፡ ወቡራኬ፡" በጽሐ፡'' ለሴም፡ ወለውሉዱ፡ ለትውልድ፡ ዘለዓለም፡" ኵላ፡" ምድረ፡ ኤዶም፡ ወኵላ፡" ምድረ፡ ባሕረ፡" ኤርትራ፡ ወኵላ፡ ምድረ፡'' ጽባሕ፡ ወህንደኬ፡ ወበአርቲራ፡ ወአድባሪሁ፡ ወኵሉ፡ ምድረ፡ ባሳ፡" ወኵላ፡" ምድረ፡ ሊባኖስ፡ ወደሰያት፡ ከፍቸር፡" ወኵሉ፡" ደብረ፡ ሰኒር፡" ወአማና፡ ወደብረ፡ አሱር፡ ዘደቡብ፡ ወኵላ፡" ምድረ፡ ኤላም፡ አሱር፡ ወባቢል፡ ወሱሳን፡ ወማዕዳይ፡" ወኵሉ፡" አድባረ፡ አራራት፡'' ወኵሉ፡" ማዕዶተ፡ ባሕር፡ ዘማዕዶተ፡ ደብረ፡" አሱር፡ ዘመንገበ፡

