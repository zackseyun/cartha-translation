base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/045.yaml
  text: And do not be like one who eats with the blood, but be careful that they do not eat blood before you. Cover the blood, for thus I have been commanded to testify to you and to your children together with all flesh.
translation:
  language: zh_hans
  text: 你们不可像吃血的人一样；要留意，别让人当着你们的面吃血。要把血掩盖起来[a]，因为我受命这样郑重告诫你们、你们的子孙和一切有血肉的活物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有旧译作“把血倒掉”；吉兹语正文作“把血掩盖起来”。
    reason: 说明既有译法差异，并标明本译所依据的原文词义。
lexical_decisions:
- source_word: ዘይበልዕ፡ ምስለ፡ ደም
  choice: 吃带血之肉的人
  rationale: 原文直译为“与血一同吃的人”；结合上下文禁食动物之血，以现代汉语表达为“吃带血之肉”，同时保留血与食物未分离的含义。
- source_word: ድፍኑ፡ ደመ
  choice: 把血掩盖起来
  rationale: ድፍኑ 是“遮盖、掩盖”的命令式；这里与把所流之血掩埋或覆土的做法相合，不译作前文已经涉及的“倒出”。
- source_word: አሰምዕ
  choice: 告诫
  rationale: 该词在此有郑重作证、使人听见警告之意；“告诫”在中文中自然地传达带权威的见证性训示。
- source_word: ምስለ፡ ኵሉ፡ ዘሥጋ
  choice: 关于一切有血肉的活物都是如此
  rationale: 原文形式上是“与一切肉体一同”，语义关系略显压缩；按禁血语境理解为该命令适用于一切有血肉的活物，避免误解为向动物发出告诫。
theological_decisions:
- issue: 禁血命令的对象与范围
  choice: 将末句表达为这项告诫涉及“一切有血肉的活物”
  alternative: 直译为“同一切肉体一起告诫你们和你们的子孙”
  rationale: 直译在现代汉语中会误导读者，以为“一切肉体”也是受告诫者；上下文讨论宰杀动物及其血，因此采用语义清楚但不扩张教义的表达。
- issue: “掩盖血”与“倒出血”的关系
  choice: 正文采用“把血掩盖起来”
  alternative: “把血倒掉”
  rationale: 现存吉兹语命令词明确支持“遮盖、掩盖”；“倒出”可能受相邻禁血规定影响，但不应取代本句的实际措辞。
translation_notes:
  register: 采用现代、庄重而易懂的训诫语体；保留第二人称复数“你们”，并以分号和短句呈现原文连续命令的节奏。
