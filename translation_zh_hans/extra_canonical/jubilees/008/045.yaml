  text: '1. ወበ፬ሥራ፡ ወተስዐቱ፡ እዮቤልው፡ በሱባዔ፡ ቀዳሚ፡ በቀዳሚሁ፡ ነሥአ፡ ሎቱ፡ አርፋክስድ፡ ብእሲተ፡ ወስማ፡ ራሱእያ፡ *ወለተ፡ ሱሳን፡ ወለተ፡ ኤላም፡ [ሎቱ፡ ብእሲተ፡] ወወለደት፡ ሎቱ፡

    2. ወልደ፡ በዓመተ፡ ሣልስ፡ በሱባዔ፡ ዝንቱ፡ ወጸውዐ፡ ስሞ፡ ቃይናም፡። ወልህቀ፡ ወልድ፡

    3. ወመሀሮ፡ አቡሁ፡ መጽሐፈ፡ ወሖረ፡ ይኅሥሥ፡ ሎቱ፡ መካነ፡ ኀበ፡ ይእኅዝ፡ ሎቱ፡ ሀገረ። ወረከበ፡ መጽሐፈ፡ ዘቈረጹ፡ ቀደምት፡ ውስተ፡ ኰኵሕ፡ ወአንበበ፡ ዘውስተታ፡ ወአዕለዎ፡ ወረከበ፡ እምውስተታ፡ ከመ፡ ሀሎ፡ ውስተታ፡ ትምህርተ፡ ትጉሃን፡ በዘ፡ ይሬስዩ፡ ሰገለ፡ *ፀሓይ፡

    4. ወወርኅ፡ ወከዋክብት፡ ውስተ፡ ኵሉ፡ ትእምረ፡ ሰማይ። ወጸሐፋ፡ ወአነገረ፡ በእንቲአሃ፡

    5. እስመ፡ ይፈርህ፡ ለኖኅ፡ ነጊረ፡ በእንቲአሃ፡ ከመ፡ ኢይትመዐዐ፡ ላዕሌሁ፡ በእንቲአሃ። ወአመ፡ ፭ ኢዮቤልው፡ በሱባዔ፡ ፩አክ፡ በቀዳማ፡ ዓመት፡ ነሥአ፡ ሎቱ፡ ብእሲተ፡ ወስማ፡ *ሜልካ፡ ወለተ፡ አመዳይ፡ ወልደ፡ ያፌት፡ ወበዓመት፡ ራብዕ፡ ሎቱ፡ ወሊደ፡ ወልደ፡ ወጸውዐ፡ ስሞ፡ ሳላ፡

