  text: '...and the moon and the stars in all the signs of heaven. And he wrote it down and said nothing about it...'
translation:
  language: zh_hans
  text: ……以及月亮和众星在天上的一切征兆。他把这事写下来，又述说了有关这事的内容。[a]……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有一种校读将此处读作“却没有述说有关这事的内容”。所给吉兹文本作肯定式：“又述说了有关这事的内容”。
    reason: 所给文本的 ወአነገረ 为肯定式；否定译法须校读为 ወኢነገረ。脚注保留这一文本问题，而正文按所给文本翻译。
lexical_decisions:
- source_word: ትእምረ፡ ሰማይ
  choice: 天上的一切征兆
  rationale: 按词面保留“天上的征兆”这一观念；结合前面的月亮和众星，指天象所呈现的各种征兆，但不增添原文未明说的“占卜”或“预兆解释”。
- source_word: ወጸሐፋ
  choice: 他把这事写了下来
  rationale: 动词意为“写”；中文补出承接上文的“这事”，使残句自然，同时不扩大所指范围。
- source_word: ወአነገረ፡ በእንቲአሃ
  choice: 并讲述了这事
  rationale: 依所给吉兹文本的肯定形式翻译为“并讲述”；በእንቲአሃ 指“关于它/这事”。
theological_decisions:
- issue: “讲述”是否应作否定式
  choice: 正文依现存所给文本译为肯定：“并讲述了这事”
  alternative: “却没有讲述这事”
  rationale: 所给文本为 ወአነገረ，表面上是肯定形式；否定译法需要校改为 ወኢነገረ。文本差异不涉及应由译者暗中裁定的教义问题，因此在正文保留所给读法，并以脚注说明可能的校读。
translation_notes:
  register: 采用庄重而自然的现代汉语。经文片段在开头和结尾保留省略号，以反映所给吉兹文本跨越前后语境、并非完整独立句段；脚注标记已置于正文。
