base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/024.yaml
  text: And the earth was filled with violence. And after this, they sinned against the beasts and the birds and everything that moves and everything that walks on the earth, and much blood was shed on the earth.
translation:
  language: zh_hans
  text: 地上充满了暴行。此后，他们对走兽、飞鸟，以及地上一切爬行和行走的生物犯了罪；地上流了许多血。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: 暴行
  rationale: 该词在此指强暴、凶残与不法行为；“暴行”自然凝练，并保留道德谴责意味。
- source_word: አበሱ፡ ሎሙ
  choice: 得罪了
  rationale: 动词表示犯罪或犯错，后接指向对象的表达；“得罪了”保留他们对受造生物施加罪恶行为的关系性含义。
- source_word: አራዊት
  choice: 走兽
  rationale: 指野兽或陆地动物；结合与飞鸟并列的语境，译作传统而易懂的“走兽”。
- source_word: ዐዋፍ
  choice: 飞鸟
  rationale: 准确表达鸟类，并与“走兽”形成自然并列。
- source_word: ዘይትሐወስ
  choice: 爬行
  rationale: 指在地上移动、蠕动或爬行之物；此处用“爬行”与后面的“行走”相区分。
- source_word: ዘያንሶሱ
  choice: 行走
  rationale: 指在地上走动、来往；直译为“行走”，避免把所指范围过度限定。
- source_word: ትክዐወ፡ ደም፡ ብዙኅ
  choice: 许多血流在地上
  rationale: 原文采用“血被倾倒/流出”的表达；中文如此翻译自然，也保留大量流血的具体意象。
theological_decisions:
- issue: 人对动物“犯罪”的关系性表达
  choice: 他们得罪了走兽、飞鸟……
  alternative: 他们残害了走兽、飞鸟……
  rationale: 原文明确使用“犯罪/犯错”一类动词，而没有直接限定具体行为；采用“得罪”保留较宽的语义与神学张力，不将其默定为单一形式的残害。
- issue: 末句施事者是否明示
  choice: 许多血流在地上
  alternative: 他们使许多血流在地上
  rationale: 原文表达流血的结果而未明确补出施事者；中文不增添主语，以保存原文结构上的含混。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。句式保留原文由地上暴行转入对各类生物犯罪、再到大量流血的推进；不添加原文没有明说的行为方式或神学解释。
