  yaml_path: translation/extra_canonical/jubilees/008/028.yaml
  text: And he blessed the God of gods, who had put the word of the Lord in his mouth.
translation:
  language: zh_hans
  text: 他称颂万神之神，就是那位曾把主的话放在他口中的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: 称颂
  rationale: 此处宾语是神，语境表示人向神发出赞美；“称颂”比容易理解为赐福的“祝福”更自然准确。
- source_word: አምላክ፡ አማልክት
  choice: 万神之神
  rationale: 保留原文“神之神”的最高级式称号，同时采用现代汉语中简洁庄重的表达。
- source_word: ወደየ፡ ውስተ፡ አፉሁ
  choice: 放在他口中
  rationale: 贴近原文的空间隐喻，表示使某人得着并说出话语。
- source_word: ንባበ፡ እግዚአብሔር
  choice: 主的话
  rationale: ንባብ 表示话语或言辞；እግዚአብሔር 依圣经汉语惯例译作“主”。
theological_decisions:
- issue: “万神之神”是否暗示承认诸神真实存在
  choice: 保留原文称号“万神之神”
  alternative: 至高的神
  rationale: 原文明确使用“神之神”的结构；译文不把其潜在修辞或神学张力改写成解释性的称号。
- issue: 关系从句中施事者的指代
  choice: 译作“因为他把主的话放在他口中”
  alternative: “就是那把主的话放在他口中的神”
  rationale: 原文关系结构指向先行词“万神之神”；现代汉语用因果句更自然，但两个“他”的所指在脱离上下文时略有歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“称颂”符合人对神的言语行为；整体尽量保留原文称号和“放在口中”的具体意象。
