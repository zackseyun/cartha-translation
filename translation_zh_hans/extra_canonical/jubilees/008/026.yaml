base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/026.yaml
  text: which they shed in the midst of the earth, He destroyed everything; and I and you, my children, and all who entered with us into the ark were left. And now, behold, I see before me your deeds, that you are not walking in righteousness, for you have begun to walk in the path of corruption, and you are separating, each one from his neighbor, and are jealous of one another, and are not united together.
translation:
  language: zh_hans
  text: 他们在地上所流的血[a]，他毁灭了一切；我、你们——我的孩子们——以及所有同我们一起进入方舟的人，都被留下了。如今，看哪，我看见你们摆在我面前的行为：你们并不行在正义中[b]，因为你们开始走上败坏的道路；你们各自离开邻舍，彼此嫉妒，也不能和睦相处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们在地上所流的血”承接上一节；另一种理解作：“那些在地上的人，他把他们全都毁灭了。”
    reason: 源文关系结构曾有不同理解；正文按动词“流出、倾倒”并以“血”为先行词翻译，同时保留另一种理解供查考。
  - marker: b
    text: 或译：“你们没有行在正义中。”
    reason: 源文未完成式可表达当前或持续的行为；正文以“并不”明确呈现这一点。
lexical_decisions:
- source_word: ዘከዐዉ
  choice: 他们……所流的
  rationale: 该关系结构承接上一节所说的血；动词表示倾倒、流出，在血的语境中自然译为“流”。
- source_word: ደምሰሰ ኵሎ
  choice: 他把一切都毁灭了
  rationale: ደምሰሰ 表示毁灭、除灭；ኵሎ 是“全部、一切”，并非带复数代词后缀的“他们所有人”。
- source_word: ተሐውሩ በጽድቅ
  choice: 行在正义中
  rationale: 保留“行走”作为生活方式的源文隐喻，同时以现代汉语可懂的“行在……中”表达持续行为。
- source_word: በፍኖተ ሙስና
  choice: 走上败坏的道路
  rationale: ፍኖት 为单数“道路”，ሙስና 表示败坏、腐化；不误译为复数。
- source_word: ትትፋለጡ አሐዱ አሐዱ እምነ ቢጹ
  choice: 你们各自与邻舍分离
  rationale: 逐项呈现“各自”“离开/远离”“邻舍”的意义；“邻舍”保持庄重的经文语体。
- source_word: ኢትሄልዉ ኅቡረ
  choice: 不再同心合一
  rationale: 源文直义为“不共同/联合地存在”；译作“不再同心合一”自然表达群体不联合的状态。
theological_decisions:
- issue: 毁灭行为的主语
  choice: 他
  alternative: 上帝
  rationale: 源文以第三人称单数动词表达，当前摘录未明说主语；正文保留代词，避免把隐含指称显明化。
- issue: “正义/义”的表达
  choice: 正义
  alternative: 公义
  rationale: ጽድቅ 可指正直、公义或正义；此处描述伦理生活方式，“正义”清楚自然，也不额外导入宗派术语。
- issue: 时态与体貌
  choice: 你们没有行在正义中
  alternative: 你们未曾行在正义中
  rationale: 源文为未完成式，指当前或持续状态；正文避免完成时含义。脚注说明也可译为现在持续式。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以破折号处理“我的孩子们”这一呼语，避免误读并保持叙述流畅；用“看哪”保留源文提示语的经文色彩。所有脚注标记均已置于正文。
