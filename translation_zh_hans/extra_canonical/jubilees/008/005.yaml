revisions:
- from: 因为他不敢把这事告诉挪亚，恐怕挪亚因此向他发怒。第五个禧年期、第一个七年期的第一年，他娶了妻子，名叫梅勒迦，是雅弗的儿子玛代的女儿。到这个七年期的第四年，他生了一个儿子[a]，给他取名叫沙拉。
  to: 因为他不敢把这事告诉挪亚，恐怕挪亚因此向他发怒。第五个禧年期、第一个七年期的第一年，他娶了一位妻子，名叫梅勒迦，是雅弗的儿子玛代的女儿。到这个七年期的第四年，他得了一个儿子，给他取名叫沙拉。
  rationale: 仅作安全的汉语表达修订：以“得了一个儿子”保留吉兹原文男性主语及其得子的事实，避免“他生了”在现代汉语中的不必要歧解；相应删除不再需要且可能夸大歧义的脚注。其余内容保持原文的指代、纪年和亲属关系。
