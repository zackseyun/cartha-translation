  naturalness: 整体庄重通顺，但“他生了一个儿子”虽可用于族谱语境，现代汉语中仍较易首先联想到母亲分娩。使用“他得了一个儿子”较自然，同时不改变原文所表明的男性主语。
  terminology: “禧年期”“七年期”适合《禧年书》的纪年体系；“挪亚、雅弗、玛代、沙拉”等名称处理一致。删除脚注中“也可译作”的表述，因为就所给吉兹文本而言，动词的阳性单数并非可与女性主语并列的文本歧义。
