base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/005.yaml
  text: For he was afraid to tell Noah about it, lest he be angry with him because of it. And in the fifth jubilee, in the first week, in the first year, he took a wife, and her name was Melka, the daughter of Madai, the son of Japheth; and in the fourth year of it he fathered a son, and he called his name Salah.
translation:
  language: zh_hans
  text: 因为他不敢把这事告诉挪亚，恐怕挪亚因此向他发怒。第五个禧年期、第一个七年期的第一年，他娶了一位妻子，名叫梅勒迦，是雅弗的儿子玛代的女儿。到这个七年期的第四年，他得了一个儿子，给他取名叫沙拉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይፈርህ
  choice: 不敢
  rationale: 该动词本义为“害怕”；在“害怕告诉”的语境中译作“不敢……告诉”更符合现代汉语，同时保留因惧怕而不说的含义。
- source_word: ኢዮቤልው
  choice: 禧年期
  rationale: 这里指《禧年书》的四十九年纪年单位，而非单独的第五十年；加“期”可避免误解。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在纪年公式中指一个由七年组成的周期，译作“七年期”清楚而准确。
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: 他娶了妻子
  rationale: 直译为“他为自己取了一个女人/妻子”，汉语婚姻语境自然译作“娶了妻子”。
- source_word: ወሊደ፡ ወልደ
  choice: 他生了一个儿子
  rationale: 动词为阳性单数，主语是前述男子；“生了一个儿子”在汉语族谱表达中可指男子生育后代，同时脚注说明更明确的译法。
- source_word: ሜልካ / አመዳይ / ሳላ
  choice: 梅勒迦／玛代／沙拉
  rationale: 采用与相关圣经人物名相协调的现代汉语音译；ሳላ 对应族谱人物 Salah，译作“沙拉”。
theological_decisions:
- issue: “这事”所指及发怒的缘由
  choice: 保留概括性的“这事／因此”
  alternative: 明确补出所隐瞒之事的具体内容
  rationale: 原文使用代词，具体所指依赖上文；不在本节内擅自补足，以保存原有指代关系。
- issue: 第四年生子的主语
  choice: 按吉兹语阳性单数译为“他生了一个儿子”
  alternative: “她给他生了一个儿子”
  rationale: 原文动词形态支持男性为主语；不因现代汉语习惯而改换原文主语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。纪年术语“禧年期”“七年期”保持全书制度性用语的清晰度；亲属关系与人名按族谱句式表达。
