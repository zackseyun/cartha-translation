base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/020.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee and the seventh week, Noah began to command the ordinances and the commandments to the children of his sons, and all that he knew of justice; and he testified to his sons that they should do righteousness and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication,
translation:
  language: zh_hans
  text: 这些是挪亚的儿子。第二十八个禧年中的第七个七年期，挪亚开始把律例、诫命，以及他所知道的一切公理，教导给他儿子们的儿女；又嘱咐自己的儿子们，要秉行正义，遮盖自己肉身的羞耻，称颂他们的创造者，孝敬父母，彼此相爱，并保守自己远离淫乱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头及动词结构在传本解释上有困难。原文也可理解为：“挪亚的儿子们在第二十八个禧年中的第七个七年期，正当挪亚把律例、诫命和自己所知道的一切公理教导给他儿子们的儿女时，他嘱咐自己的儿子们……”正文采用把有关动词理解为“开始”的校勘性读法，以形成完整句意。
    reason: 保留እንዘ通常可表示“当……时”的读法，以及开头句法可能与后文相连的歧义；同时使脚注中的关系代词和正文一致。
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዘ
  choice: 律例、诫命
  rationale: 分别对应规范性条例与命令，保留原文并列结构。
- source_word: ፍትሐ
  choice: 公理
  rationale: 此处指挪亚所知道的正义、公正之道；译作“公理”可与下文“正义”有所区分。
- source_word: ጽድቀ
  choice: 正义
  rationale: 表达合乎正道的行为要求，译为“秉行正义”自然且庄重。
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: 自己身体的羞处
  rationale: 较直译地保留“肉身之羞”的委婉表达，指裸体或私处。
- source_word: ዘፈጠሮሙ
  choice: 那创造他们的主
  rationale: 原文实质为“创造他们的那一位”；加“主”使中文指称自然，同时不使用特定神名。
- source_word: አሐዱ፡ አሐዱ፡ ቢጾ
  choice: 彼此相爱
  rationale: 原意为“各人爱自己的同伴/弟兄”；汉语以“彼此相爱”简洁传达相互关系。
- source_word: ዝሙት
  choice: 淫乱
  rationale: 可涵盖不正当性行为，比“奸淫”范围更广，符合此处一般伦理训诫。
theological_decisions:
- issue: “创造他们的那一位”的称谓
  choice: 那创造他们的主
  alternative: 他们的创造者
  rationale: 保留对创造者的敬拜语境，同时避免导入原文未出现的专名。
- issue: 保护“灵魂”还是保护“自己”
  choice: 保守自己远离淫乱
  alternative: 保守自己的灵魂远离淫乱
  rationale: ነፍሶሙ 可指“他们的灵魂/自身”；中文“保守自己”更自然，并保留整体人格免受淫乱玷污之意。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“禧年”“七年期”保留本书纪年体系；“孙辈”自然表达“儿子们的儿女”。脚注明确交代吉兹文本句法及可能校勘造成的真实歧义。
