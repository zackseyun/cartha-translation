base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/025.yaml
  text: The thoughts and desire of man imagine vanity and evil continually, and the Lord destroyed everything from the face of the earth because of their evil deeds and because of blood.
translation:
  language: zh_hans
  text: 人所思所愿的，终日尽是虚妄和邪恶；主因他们的恶行和流血的事，从地面上除灭了一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ
  choice: 人的心思和欲望
  rationale: 分别保留“心思/意念”与“欲望/意愿”两个并列概念，不将其合并。
- source_word: ይኄሊ
  choice: 所想的
  rationale: 明确体现原文“思想、设想”的动词意义，避免仅译成静态的“是”。
- source_word: ከንተ፡ ወእኩየ
  choice: 虚妄和邪恶
  rationale: 保留两个并列宾语：ከንተ 指虚空、虚妄之事，እኩየ 指邪恶。
- source_word: በኵሉ፡ መዋዕል
  choice: 终日
  rationale: 自然表达“所有日子/不断”的持续意义；语境中指始终如此。
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እምነ፡ ገጸ፡ ምድር
  choice: 主……从地面上除灭了一切
  rationale: 保留毁灭性动词、范围“一切”以及“从地面上”的空间表述。
- source_word: በእንተ፡ እኩይ፡ ምግባሮሙ፡ ወበእንተ፡ ደም
  choice: 因他们的恶行和流血之事
  rationale: 前者直译为他们邪恶的行为；后者字面为“血”，按因暴力流血而受审判的语境译作“流血之事”，同时不增添更具体的罪名。
theological_decisions:
- issue: 人内在状态的描述
  choice: 译作“所想的，尽是虚妄和邪恶”
  alternative: 译作“始终是邪恶的”
  rationale: 原文同时有“想/思想”的动词及“虚妄”和“邪恶”两个成分，不能缩减为单一的道德判断。
- issue: 除灭的对象范围
  choice: 保留“一切”
  alternative: 具体化为“所有人”或“所有生物”
  rationale: 原文对象为概括性的“全部/一切”，不应在译文中擅自限定。
- issue: “血”的含义
  choice: 译作“流血之事”
  alternative: 直译“血”
  rationale: 汉语中仅说“因为血”语义不完整；“流血之事”传达血罪或杀戮的自然语义，同时避免指定某一种解释。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语；前半句保留“心思和欲望”“虚妄和邪恶”的平行结构，后半句以分号呈现审判结果及原因。
