revisions:
- from: 人的心思和欲望终日所想的，尽是虚妄和邪恶；主因他们的恶行和流血之事，从地面上除灭了一切。
  to: 人所思所愿的，终日尽是虚妄和邪恶；主因他们的恶行和流血的事，从地面上除灭了一切。
  rationale: 修订仅处理前半句的汉语句法与搭配，使“思想和意愿”不被误读为两个都在“想”的主体；保留原文的持续性、虚妄与邪恶的并列，以及后半句未限定对象的“一切”和概括性的“血”。
