  source_fidelity: 草案将 ኅድገተ / ታሕድግዎ 译为“休耕”，虽试图适应果树条例的农业语境，却把“放开、解除、释放”的宽泛动作具体化成停止耕作；这与紧邻语境中第五年果实可不再受先前限制的意思不符。应保留“解除限制／放开”的核心意义，并以脚注说明其所指。
  naturalness: “让它休耕”在现代汉语中通顺，但第五年对已栽种之物“休耕”不自然，也易被理解为整块土地撂荒。改为“解除对它的限制”既自然，也能表达原文所保留的对象与动作的歧义。
  terminology: “公义和正直”可保留两个并列伦理词。“行义”能够表达结果分句的行为向度，但“你们就必行义”略显重复；“你们就必成为正直的人”更贴近英文审计轨迹的“you will be righteous”，同时不引入系统神学含义。
  issues:
