  yaml_path: translation/extra_canonical/jubilees/008/052.yaml
  text: And in the fifth year you shall make its release, so that you may release it in righteousness and uprightness, and you will be righteous, and all your planting will prosper.
translation:
  language: zh_hans
  text: 第五年，你们要解除对它的限制，使你们可以凭公义和正直解除限制；这样，你们就必成为正直的人，你们所栽种的一切也必兴旺。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅድገተ / ታሕድግዎ
  choice: 让它休耕
  rationale: 该词基本义为“放开、留下、免除”。本节承接果树栽植及其年限的语境，所指是第五年不再受前三年禁食、第四年初熟果献纳的限制，或让栽植物进入获准使用的状态。为避免生硬的“释放它”，按农业语境译作“让它休耕”；但原词本身较宽泛。
- source_word: በጽድቅ፡ ወበርትዕ
  choice: 凭公义和正直
  rationale: 保留两个并列的伦理词，分别表达公义与正直，不将二者合并为笼统的“正确地”。
- source_word: ይረተው
  choice: 兴旺
  rationale: 此动词在这里描述栽植物的良好发展或繁盛；“兴旺”兼顾植物生长与结果顺利的语义。
theological_decisions:
- issue: “公义和正直”与“行义”的关系
  choice: 保留因果式承接：“这样，你们就必行义”
  alternative: 译作“你们就必成为义人”
  rationale: 源文可表达行为或状态上的正直。采用“行义”避免把农业条例的遵守直接系统化为身份性称义，同时保留伦理后果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留源文的命令、目的及结果链条；农业术语按上下文自然表达。
