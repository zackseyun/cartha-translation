base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/021.yaml
  text: 'and the Lord forever. And he knew that a blessed portion and a blessing had come to Shem and to his sons for the generations of eternity: all the land of Edom, and all the land of the Red Sea, and all the land of the east and India, and on the Red Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the south, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea, beyond the mountains of Asshur toward the north.'
translation:
  language: zh_hans
  text: 和主，直到永远。[a]他知道，有福的份和祝福已经临到闪和他的子孙，直到世世代代、永永远远：以东全地、红海全地、东方全地和印度、阿尔提拉及其群山、巴珊全地、黎巴嫩全地和迦斐托诸岛、西尼珥和亚玛拿的所有山岭、南方的亚述山脉、以拦、亚述、巴比伦、书珊和玛代全地、亚拉腊的所有山岭，以及海对岸、亚述山脉以北的所有地区。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的“和主，直到永远”承接上一节尚未结束的句子；原文分节在此保留了这一句尾。
    reason: 说明源文本跨节句法，避免将“直到永远”误解为“主”的定语。
lexical_decisions:
- source_word: መክፈልተ፡ በረከት፡ ወቡራኬ
  choice: 有福的份和祝福
  rationale: 分别保留“份”和“祝福”两个并列成分，不采用缺乏吉兹语依据的“宽广的份”。
- source_word: ባሕረ፡ ኤርትራ
  choice: 红海
  rationale: 这是该古代地理名称的通行对应，也与上下文的疆域列表相符。
- source_word: ባሳ
  choice: 巴珊
  rationale: 依此处传统地理辨识及英语审校层处理为圣经地名巴珊。
- source_word: ከፍቸር
  choice: 迦斐托
  rationale: 采用现代中文圣经读者较熟悉的地名形式。
- source_word: ሰኒር፡ ወአማና
  choice: 西尼珥和亚玛拿
  rationale: 按古代近东山名音译，并保留二者并列。
- source_word: አሱር
  choice: 亚述
  rationale: 采用通行圣经地名译法；同一词在“亚述山脉”和疆域名中保持一致。
theological_decisions:
- issue: 闪所得之份的性质
  choice: “有福的份和祝福”
  alternative: “蒙福而宽广的份”
  rationale: 原文明确并列“祝福之份”和“祝福”，不把第二项解释为疆域宽广，以免加入原文没有的神学或地理含义。
- issue: 祝福延续的时间范围
  choice: “直到世世代代、永永远远”
  alternative: “给永恒的世代”
  rationale: 既保留原文世代延续与永久性的叠加强调，又用自然现代汉语表达，不限定其具体神学机制。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。疆域清单尽量保持原文次序和重复结构；在不改变所列区域范围的前提下，适度使用“沿岸”“山脉”等自然汉语地理表达。
