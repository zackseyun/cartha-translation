  to: 和主，直到永远。[a]他知道，有福的份和祝福已经临到闪和他的子孙，直到世世代代、永永远远：以东全地、红海全地、东方全地和印度、阿尔提拉及其群山、巴珊全地、黎巴嫩全地和迦斐托诸岛、西尼珥和亚玛拿的所有山岭、南方的亚述山脉、以拦、亚述、巴比伦、书珊和玛代全地、亚拉腊的所有山岭，以及海对岸、亚述山脉以北的所有地区。
