    issue: 开头“以及永远的主”误译跨节句尾。
    rationale: 原文为“和主，直到永远”，其中“直到永远”修饰承接上节的句子，而非修饰“主”。
  - severity: high
    issue: 将“阿尔提拉及其群山”重复译作“红海沿岸及其群山”。
    rationale: 源文先列“红海”，随后另列“在/于阿尔提拉及其群山”；即使其具体地理辨识有讨论，也不应在译文中直接与已出现的红海合并。
  - severity: low
    issue: “以拦、亚述和巴比伦全地，以及书珊和玛代”对“全地”的统摄范围略不明晰。
    rationale: 将并列地名一并置于“全地”范围内，较清楚地反映原文连续疆域列表。
