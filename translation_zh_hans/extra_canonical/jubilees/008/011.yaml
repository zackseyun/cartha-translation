base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/011.yaml
  text: And he called his sons, and they came near to him, they and their children, and he divided the earth into the lots that his three sons would possess. And they stretched out their hands and took the writing from the bosom of Noah their father.
translation:
  language: zh_hans
  text: 他召集自己的儿子；他们和他们的儿女都来到他跟前。他把大地划分为他三个儿子将要承受的各份地业。他们伸出手，从他们父亲挪亚的怀中取出书卷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከፈሉ፡ ምድረ፡ በዐባዊ፡ ዘይእኅዙ፡ ሠለስቲሆሙ፡ ውሉዱ
  choice: 他把大地分成三份，给他的三个儿子各自占有
  rationale: 上下文明确涉及挪亚的三个儿子及其所得地业；译作“三份”比抽象的“阄份”更自然，也保留分配与占有的含义。源文动词形式在传本和句法上可能呈复数，但叙事主事者依上下文是挪亚，故汉语以“他”承接。
- source_word: መጽሐፈ
  choice: 文书
  rationale: 该词可指书、卷册或书面文件；此处是从挪亚怀中取出、随后用来拈阄分地的书面记录，译作“文书”既具体又不把载体限定为现代书本。
- source_word: እምኅፅነ፡ ኖኅ፡ አቡሆሙ
  choice: 从父亲挪亚的怀中
  rationale: 贴近源文“从他们父亲挪亚的怀中”，以现代汉语自然语序表达亲属关系，同时保留“怀中”这一具体形象。
- source_word: ወበፍሑ፡ እደዊሆሙ
  choice: 他们便伸手
  rationale: 直译为“他们伸出双手/他们的手”；汉语用“伸手”自然表达共同取出文书的动作，不额外说明每人是否各伸一手。
