base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/039.yaml
  text: He commanded me all that his fathers had commanded him. And I also command you, my children, according to how Enoch commanded his son in the first jubilees, while he was alive, in the seventh generation; he commanded and testified to his son and to his son's children until the day of his death.
translation:
  language: zh_hans
  text: 他祖先曾吩咐他的一切，他都吩咐了我。我的孩子们，我也要吩咐你们，正如以诺在最初的禧年时期、在第七代时仍在世，怎样吩咐他的儿子那样；以诺直到去世的那一天，一直吩咐并郑重告诫[a]他的儿子和他儿子的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郑重告诫”也可译作“郑重宣告”或“作见证”；原文按字面可理解为“使人听见”。
    reason: 保留 አስምዐ 所含“使听见”、郑重宣告及作见证等相关语义，而不在正文中作排他的解释。
lexical_decisions:
- source_word: አዘዘ / እኤዝዘክሙ
  choice: 吩咐／要吩咐你们
  rationale: 保留原文反复出现的“命令、吩咐”语义，并以自然的现代汉语表达。
- source_word: በቀዳሚ፡ እዮቤልውሳት
  choice: 在最初的禧年期间
  rationale: 按复数形式译出一段由禧年构成的早期时期，避免把它误解成单一节庆。
- source_word: ውስተ፡ ትዝምዳ፡ ሳባዕ
  choice: 处于第七代时
  rationale: 直译其世代定位，不额外判定计算世代的起点。
- source_word: አስምዐ
  choice: 郑重告诫
  rationale: 该使役形字面与“使听见”有关，在此语境可有作证、郑重宣告或告诫之意；正文采用符合训诫语境的自然表达，并以脚注保留字面可能。
- source_word: ለወልዱ፡ ወለውሉደ፡ ውሉዱ
  choice: 他的儿子和孙辈
  rationale: 原文为“他的儿子和他儿子的孩子们”；“儿子和孙辈”准确而简洁。
theological_decisions:
- issue: አስምዐ 的语义范围
  choice: 郑重告诫
  alternative: 作见证／使他们听见
  rationale: 上下文是把祖传训令郑重传给后代；不将其收窄为司法意义的“作证”，脚注保留使役结构的字面含义。
- issue: “第七代”与以诺的关系
  choice: 保留为“处于第七代时”
  alternative: 解释为“作为第七代的人”
  rationale: 原文只给出世代定位；正文不补入从亚当开始计算等解释，以保留文本本身的简略性。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留“吩咐”的重复，以呈现祖先训令逐代传承的结构；将较生硬的亲属链条自然译为“儿子和孙辈”。
