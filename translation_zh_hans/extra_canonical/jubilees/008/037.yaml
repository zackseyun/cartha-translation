review_pass:
  verdict: revise
  source_fidelity: 首句准确反映 በቅድመ፡ምሥዋዕ፡ዘይትወከፍ（“在蒙悦纳的祭坛前”）。不过，所给吉兹语文本中的 ገበሩ 按其现存词形应译为“他们施行了／作了”，不应在正文中无文本依据地改作第二人称复数命令式。后面的 ታሕድግዎ 则确为第二人称复数，故应保留这一人称与语气的不协调，并以脚注说明。
  naturalness: “在蒙悦纳的祭坛前”庄重自然。“第五年，你们要施行豁免，好免除它”虽然通顺，却将现存文本的第三人称形式校改为命令式。改为“第五年，他们施行了豁免，好叫你们免除它”较忠实；这一略显突兀的衔接正反映原文形式的张力。
  terminology: “祭坛”正确区分于“祭物／供物”；“蒙悦纳”恰当表达被动的“被接纳”。“豁免”可表达 ኅድገተ 的释放、宽免含义；“免除它”保留未说明的单数对象，不把它擅自具体化为债务、土地或其他事物。
  issues:
  - severity: medium
    issue: 正文将 ገበሩ 改译为第二人称复数命令式。
    rationale: 依所提供的吉兹语文本，ገበሩ 的表面形式是第三人称复数完成式“他们作了／施行了”。虽然其后第二人称复数 ታሕድግዎ 造成张力，且审校记录提出可能有抄写或校勘问题，但在未提供文本证据支持校改时，正文应保留现存读法，将可能的命令式校读置于脚注。
  revised_text: 在蒙悦纳的祭坛[a]前。第五年，他们施行了豁免，好叫你们免除它[b]。
  revised_footnotes:
  - marker: a
    text: 此词也可被译作“祭物”；但按所给吉兹语词形，正文译作“祭坛”。
    reason: 说明与旧有“祭物／供物”译法相关的词义辨析，且不改变正文所依据的词形。
  - marker: b
    text: 现存原文前一动词直译为“他们施行了”，后一动词则为“你们免除它”。二者在人称和语气上不一致；有校读会将前一动词理解为“你们要施行”，但正文保留现存形式。
    reason: 忠实呈现原文的人称、语气张力，并说明命令式译法属于校读而非现存文本的直接翻译。
  revision_rationale: 需要修订，以免正文无说明地采用推测性的命令式校读。修订保留 ገበሩ 的现存第三人称复数完成式，同时将其与 ታሕድግዎ 的第二人称复数不协调明确标于脚注；祭坛、蒙悦纳、豁免及未指明的宾语均予保留。
