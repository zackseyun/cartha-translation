  verdict: revise
  source_fidelity: 正文将现存吉兹语的ገበሩ直接改作第二人称复数命令式，虽可反映一种为协调后续动词而作的校读，却未如实呈现所给底本的表面第三人称复数完成式。应以底本文字为正文，并在脚注说明可能的命令式校读。祭坛、蒙悦纳、豁免及未明宾语“它”的处理均可保留。
  naturalness: “在蒙悦纳的祭坛前”作为残存经句的片段自然且庄重。“第五年，他们施行豁免，好叫你们免除它”刻意保留原文人称张力；虽略显突兀，却比无标示地改写为命令句更符合此处的文本状态。
  terminology: “祭坛”正确对应ምሥዋዕ，不应改作“祭物”。“蒙悦纳”恰当表达被动接受义。“豁免／免除”能保留ኅድገተ及后续动词的宽免、释放或留下等可能语义，且不擅自确定“它”的所指。
  issues:
