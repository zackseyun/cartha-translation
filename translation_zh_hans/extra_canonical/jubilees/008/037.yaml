    issue: 正文未经标示地采用命令式校读
    rationale: 所给吉兹语写作ገበሩ，表面为“他们施行了”；草稿正文“你们要施行”依赖将其校作命令式。后面的第二人称复数动词确实造成张力，但应在正文保留现存形式，在注中陈明协调性校读。
  revised_text: 在蒙悦纳的祭坛[a]前。第五年，他们施行了豁免[b]，好叫你们免除它。
