  text: Before the altar that is accepted. And in the fifth year make a release, so that you may release it.
translation:
  language: zh_hans
  text: 在蒙悦纳的祭坛[a]前。第五年，你们要施行豁免[b]，好免除它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祭坛”有旧译作“祭物”。
    reason: 说明近形词辨析及旧译传统，但正文依吉兹语词形译作“祭坛”。
  - marker: b
    text: 原文此处的现存形式也可直译为：“第五年，他们施行了豁免，好让你们免除它。”正文按与下句第二人称复数相协调的命令式读法翻译。
    reason: 原文动词形式在人称、语气上存在张力，正文不宜无说明地校改。
lexical_decisions:
- source_word: ምሥዋዕ
  choice: 祭坛
  rationale: 该词指“祭坛”，应与意为“祭物、供物”的 መሥዋዕት 区分。
- source_word: ዘይትወከፍ
  choice: 蒙悦纳的
  rationale: 保留“被接受、蒙接纳”的被动含义；汉语宗教语境中“蒙悦纳”自然而庄重。
- source_word: ኅድገተ
  choice: 豁免
  rationale: 此名词可表达释放、免除或宽免；此处采用“豁免”，同时保留所免对象未交代清楚的含混性。
- source_word: ታሕድግዎ
  choice: 免除它
  rationale: 按第二人称复数及宾语后缀译为“你们……免除它”；汉语主句已明示“你们”，目的分句可自然省略主语。
theological_decisions:
- issue: ገበሩ 的人称与语气
  choice: 你们要施行
  alternative: 他们施行了
  rationale: 现存形式表面上可读作第三人称复数完成式“他们施行了”，但其后的 ታሕድግዎ 明确为第二人称复数，且上下文被理解为命令；正文采用与该命令语境协调的复数祈使式读法，并以脚注保留字面形式。
- issue: 豁免对象的指代
  choice: 它
  alternative: 将对象具体化
  rationale: 原文仅有阳性单数宾语后缀，没有明确说明所指，故不擅自补成债务、土地、祭坛或其他对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙悦纳”“施行豁免”保留经文体的凝练感；由于所给原文似为残句，未补写上下文。所有脚注标记均已置于正文。
