revisions:
- from: 这海名叫“埃及海之舌”。它从那里向北延伸，到大海的入口，沿着水边；又向西走，到阿弗拉[a]；再继续延伸，直到接近基训河的水域[b]，就在基训水域的北面。
  to: 这海名叫“埃及海之舌”。它从那里向北延伸，直达大海的入口，在水边；又向西延伸，到阿弗拉[a]；再继续延伸，直到接近基训河的水域[b]，就在基训水域的北面。
  rationale: 仅作两项安全的汉语表达调整：把地点短语明确译为“在水边”，并以“向西延伸”统一地理边界的叙述动词。保留地名、古代地理形象以及阿弗拉短语的替代理解脚注，不对其作现代地理定位。
