base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/015.yaml
  text: This sea is named the tongue of the Egyptian Sea. And it extends from there northward to the mouth of the Great Sea, at the waters' edge, and it goes along toward the west to Afra, and it goes on until it approaches the waters of the Gihon River, on the north side of the waters of Gihon.
translation:
  language: zh_hans
  text: 这海名叫“埃及海之舌”。它从那里向北延伸，直达大海的入口，在水边；又向西延伸，到阿弗拉[a]；再继续延伸，直到接近基训河的水域[b]，就在基训水域的北面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向着阿弗拉以西”。
    reason: 原短语中方向词与地名的句法关系可有另一种理解；正文依较可能的“向西，到阿弗拉”处理。
  - marker: b
    text: 或译：“基训的水”。
    reason: 原文先说“基训河的水域”，随后较简略地说“基训水域”；脚注保留更贴近字面的简短表达。
lexical_decisions:
- source_word: ልሳነ፡ ባሕረ፡ ገብጽ
  choice: 埃及海之舌
  rationale: 直译地理名称中的“舌”，保留原文以身体部位比喻狭长水域或海湾的表达，不擅自改释为某一现代地貌名称。
- source_word: አፉሃ፡ ለባሕር፡ ዐቢይ
  choice: 大海的入口
  rationale: አፉሃ 字面为“它的口”，在水域地理语境中自然译作“入口”；“大海”保留原文称谓。
- source_word: ውስተ፡ ክናፍረ፡ ማያት
  choice: 沿着水边
  rationale: 该短语字面涉及水的“唇缘/边缘”，译为现代汉语自然的“沿着水边”，同时保留边界行进的含义。
- source_word: መንገበ፡ ዐረብ፡ ዐፍራ
  choice: 向西走，到阿弗拉
  rationale: 将方向“向西”和目的地“阿弗拉”分别表达，避免误译为“阿弗拉以西”。
- source_word: ማየ፡ ጊዮን፡ ፈለገ
  choice: 基训河的水域
  rationale: 按词序和语义表达为“基训河的水域”；“基训”采用中文圣经传统音译，ፈለገ 明示此处为河。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。地理边界以连续动词“延伸、走、接近”呈现；保留“海之舌”这一原文形象及地名的不确定性，不将古代地理名称强行对应到现代地点。
