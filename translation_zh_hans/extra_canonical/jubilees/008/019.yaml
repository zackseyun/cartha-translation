base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/019.yaml
  text: '"...the LORD in the dwelling of Shem." And he knew and he knew that the Garden of Eden is the holy of holies and the dwelling of the LORD, and Mount Sinai is in the midst of the wilderness, and Mount Zion is in the midst of the navel of the earth; these three were created as holy places facing one another.'
translation:
  language: zh_hans
  text: “……愿主住在闪的居所中。”[a] 他知道，伊甸园是至圣之地，是主的居所；西奈山位于旷野中央，锡安山位于大地肚脐的中央。这三处被造为彼此相对的圣地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头在原文中没有动词，承接上一节的祈愿语。也可按独立片段译作：“……主在闪的居所中。”
    reason: 说明跨节句法关系及原文无动词所留下的表达歧义。
lexical_decisions:
- source_word: ቅድስተ፡ ቅዱሳን
  choice: 至圣之地
  rationale: 字面为“诸圣中最圣”，是表达最高级神圣性的固定结构；译作“至圣之地”既保留宗教语域，也自然明确。
- source_word: ሕንብርት፡ ለምድር
  choice: 大地肚脐
  rationale: 保留原文“地的肚脐”这一宇宙地理意象，不以“中心”等抽象说法取代；后接“中央”反映原文关于锡安山位置的表述。
- source_word: መንጸረ
  choice: 彼此相对
  rationale: 该词在本句表达面对、相对的位置关系；结合“三处”采用汉语自然的相互表达。
- source_word: መሓድሪ
  choice: 居所
  rationale: 同一词根在“闪的居所”和“主的居所”中保持一致，以呈现原文的词语呼应。
theological_decisions:
- issue: 本节开头是否把主住在闪的居所中译为独立的过去时陈述
  choice: 作为承接上一节祝福语的片段，补出“愿……住”
  alternative: “主住在闪的居所中”或“主曾住在闪的居所中”
  rationale: 本节所给文本开头本身无动词，语法上承接上一节结尾的祈愿式动词；译成过去时会把挪亚的祝福误改为历史陈述。
- issue: “至圣”是否专指后来圣殿中的至圣所
  choice: 译作“至圣之地”
  alternative: “至圣所”
  rationale: 原文在此描述伊甸园的神圣地位；“至圣之地”保留最高级含义，同时避免无根据地把它直接等同于圣殿建筑空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。开头用省略号显示本节从上一节引语中间起始；保留“大地肚脐”的古代宇宙地理意象，并以分号和句号梳理三个地点及总结句的层次。
