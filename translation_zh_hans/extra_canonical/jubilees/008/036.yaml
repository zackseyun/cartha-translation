base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/036.yaml
  text: And Yahweh destroyed everything from the face of the earth because of the wickedness of their deeds and because of the blood which they had poured out in the midst of the earth; he destroyed everything.
translation:
  language: zh_hans
  text: 耶和华因他们的恶行，又因他们在大地之中所倾流的血，就从地面上除灭了一切；他除灭了一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 此处为上帝的称谓；按现代简体中文圣经语体采用“耶和华”，与来源所表达的神圣专名功能相称。
- source_word: ደምሰሰ
  choice: 除灭
  rationale: 该动词在上下文中指彻底消灭；“除灭”既保留审判语气，也符合庄重而通俗的经文表达。
- source_word: እምነ ገጸ ምድር
  choice: 从地面上
  rationale: 直译为“从地的面上”；采用自然的现代汉语表达，同时保留从地上清除之意。
- source_word: እኩይ ምግባሮሙ
  choice: 他们行为邪恶
  rationale: 保留“邪恶”作为行为的性质，而不扩展为动机、罪性或其他神学判断。
- source_word: ደም ዘከዐዉ
  choice: 他们……所流的血
  rationale: 源语意为倾倒、流出血；中文以“流血”语义表达，既自然又保留暴力造成血流的含义。
- source_word: ማእከለ ምድር
  choice: 在大地之中
  rationale: 较形式地保留“在地的中间/之中”的空间措辞，不擅自弱化为泛指“地上”。
theological_decisions:
- issue: 神名的呈现
  choice: 耶和华
  alternative: 主／雅威
  rationale: 采用中文读者熟悉且具有专名功能的“耶和华”；不以“主”替代专名，也不借此引入特定宗派解释。
- issue: 重复的审判陈述
  choice: 保留“他除灭了一切”的重复
  alternative: 删去重复或合并为一句
  rationale: 源文末尾再次陈述“除灭了一切”，具有强调作用；保留这种张力和修辞，不作平滑化处理。
- issue: 毁灭的原因
  choice: 并列保留行为邪恶与流血两项原因
  alternative: 将流血解释为邪恶行为的例证
  rationale: 源文用并列结构呈现两项理由；译文不把二者从属化，以免缩窄原文意义。
translation_notes:
  register: 采用现代、庄重、清晰的简体中文经文语体。句式保留原文因果关系和末尾重复；不增加解释性内容。
