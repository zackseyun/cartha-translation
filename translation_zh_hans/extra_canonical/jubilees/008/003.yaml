base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/003.yaml
  text: And his father taught him writing. And he went to seek for himself a place where he might seize a city for himself. And he found a writing which the ancients had cut on a rock, and he read what was in it. And he copied it, and he found from what was in it that there was in it the teaching of the Watchers, by which they used to observe the omens of the sun.
translation:
  language: zh_hans
  text: 他父亲教他书写。他出去，为自己寻找一处地方，好在那里为自己夺取一座城。他找到一篇古人刻在岩石上的文字，读了其中的内容，并把它抄录下来。他从中发现，其中有守望者的教导；他们曾借此观察太阳的征兆。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “观察太阳的征兆”也可译作“占察太阳的征兆”。
    reason: 原文末语可指对太阳征象的观察，也可能带有辨识预兆的含义；正文保留较开放的表达，脚注说明其预兆性理解。
lexical_decisions:
- source_word: መጽሐፈ
  choice: 书写／文字
  rationale: 此词在首句指书写之术，在后文指刻于岩石上的文字；依各处语境分别译出。
- source_word: ይእኅዝ፡ ሎቱ፡ ሀገረ
  choice: 为自己占取一座城
  rationale: 保留动词“取得、占有”的力度及反身表达，不弱化为单纯“建立城市”。
- source_word: ቀደምት
  choice: 古人
  rationale: 自然表达“先前之人、古代的人”，与岩刻文字的语境相合。
- source_word: ወአዕለዎ
  choice: 并把它抄录下来
  rationale: 按吉兹语动词的抄写、誊录义处理，而非译作“明白了”。
- source_word: ትጉሃን
  choice: 守望者
  rationale: 采用本书相关传统中通行且语义透明的称呼，并保留其作为特定群体名称的性质。
- source_word: ሰገለ፡ ፀሓይ
  choice: 太阳的征兆
  rationale: “征兆”保留天象被用于预兆性观察的含义，又不把具体占卜体系过度确定化。
theological_decisions:
- issue: 守望者教导的性质
  choice: 直译为“守望者的教导”，并说他们借此“占察太阳的征兆”
  alternative: 将其解释为天文学知识或明确称为邪术
  rationale: 源文只陈述教导及其用途；译文不替文本判定其道德或神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式保留原文连续推进的结构，同时适度分句以符合现代汉语阅读习惯；专名“守望者”不另加解释，以免引入宗派性诠释。
