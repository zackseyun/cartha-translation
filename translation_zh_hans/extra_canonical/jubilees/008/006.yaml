base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/006.yaml
  text: For he said, “I was indeed sent,” and in the fourth year Shelah was born and grew up; and he took for himself a wife, and her name was Melka, the daughter of Kebed, his father’s brother, in the first year of the fifth week of the thirty-first jubilee.
translation:
  language: zh_hans
  text: 因为他说：“我确实被差遣了。”第四年，沙拉出生并长大；在第三十一个禧年的第五个七年期第一年，他娶了妻子，名叫米勒迦，是基别（他父亲的兄弟）的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈንዎ፡ ተፈነውኩ
  choice: “我的确是奉差遣而来的”
  rationale: 保留原文被动式“被差遣”及重复所表达的强调；用自然汉语表达，而不把命名缘由解释为特定神学意义。
- source_word: ወልህቀ
  choice: “后来长大成人”
  rationale: 明确译出原文“长大”的动词；加入“后来”以避免误解为出生当年即已成年。
- source_word: እዮቤልው
  choice: “禧年”
  rationale: 采用《禧年书》年代体系的通行名称。
- source_word: ሱባዔ
  choice: “七年期”
  rationale: 此处指禧年内部以七年为一组的周期，译为“七年期”比单称“周”更便于现代读者理解。
- source_word: ሳላ
  choice: “沙拉”
  rationale: 按圣经人物 Shelah 的常见简体中文译名处理。
- source_word: መልካ
  choice: “米勒迦”
  rationale: 采用与闪族名字 Melka/Milcah 相应、较为熟悉的中文音译。
- source_word: ኬቤድ
  choice: “基别”
  rationale: 依吉兹文形式作简洁音译，不擅自等同于其他人物。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。年代短语依吉兹文读作“第三十一个禧年、第五个七年期、第一年”，并置于娶妻事件之前以消除汉语歧义；没有沿用已被源文纠正的旧译异文。
