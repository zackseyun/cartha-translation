base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/007.yaml
  text: And in the sixth year she bore him a son, and he called his name Peleg, because in his days, when he was born, the sons of Noah began to divide the earth among themselves. For this reason he called his name Peleg.
translation:
  language: zh_hans
  text: 第六年，她为他生了一个儿子；他给他起名叫法勒[a]，因为在他出生的日子，挪亚的众子开始在他们中间划分土地。因此，他给他起名叫法勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法勒”（吉兹文：ፋሌክ，Fālēk）这个名字与希伯来语词根 פלג（plg，“分开、划分”）相关，呼应本节所说的土地划分。
    reason: lexical_choice
lexical_decisions:
- source_word: ፋሌክ
  choice: 法勒
  rationale: 采用现代中文圣经传统中 Peleg 的通行译名“法勒”，并以脚注说明名字与“分开、划分”的语源双关。
- source_word: ይትካፈሉ
  choice: 彼此分配
  rationale: 该词在此表示挪亚的众子把土地在各人之间划分、分配；“彼此分配土地”既保留相互/各自参与的语义，也与法勒名字所含的“分开”双关相呼应。
- source_word: ምድረ
  choice: 土地
  rationale: 此处指挪亚众子在彼此之间划分的地土或地域；译作“土地”在现代汉语中自然，并避免把动作误解为使整个地球发生物理分裂。
- source_word: ደቂቀ፡ ኖኅ
  choice: 挪亚的众子
  rationale: 按字面关系译出“挪亚的儿子们”，用庄重而自然的“众子”表达复数。
theological_decisions:
- issue: “分配土地”是否指地球的物理分裂
  choice: 译为“彼此分配土地”
  alternative: “使大地分裂”
  rationale: 源文描述挪亚的众子在他们彼此之间进行划分，重点是地域的分配；不把它明确解释成地球本身发生物理断裂，从而避免加入源文未明说的宇宙论判断。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“她”“他”沿用本节上下文中的指代，不擅自补入姓名；保留原文末尾重复命名的结构，以呈现其强调和语源解释。
