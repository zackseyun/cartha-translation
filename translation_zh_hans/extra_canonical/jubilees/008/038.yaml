base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/038.yaml
  text: You, in righteousness and uprightness, shall be righteous, and all your plantings shall prosper. For thus Enoch, the father of your father, commanded Methuselah his son, and Methuselah his son Lamech, and Lamech...
translation:
  language: zh_hans
  text: 你们要在公义和正直中成为义人；你们所栽种的一切都必兴旺。因为以诺——你们父亲的父亲——曾这样吩咐他的儿子玛土撒拉；玛土撒拉也这样吩咐他的儿子拉麦；拉麦……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所据文本到“拉麦”处中断，句子未完。
    reason: 说明所提供吉兹底本文本在此截断；不以推测或后文补足未完成的传承链。
lexical_decisions:
- source_word: በጽድቅ፡ ወበርትዕ
  choice: 秉持公义和正直
  rationale: 保留“公义”与“正直”两个并列的伦理概念，同时用现代汉语自然表达其行为方式。
- source_word: ወትጸድቁ
  choice: 成为义人
  rationale: 保留与前文“公义”同根的重复，不将原文的强调合并消除。
- source_word: ወይረተው፡ ኵሉ፡ ተክሊክሙ
  choice: 你们所栽种的一切都必兴旺
  rationale: “栽种”保留农业意象；谓语按语境译为“兴旺”，避免生硬直译，同时不限定为某一种作物或产业。
- source_word: አዘዘ
  choice: 吩咐
  rationale: 准确表达长辈向后代传授命令或训诫的动作；后两处依省略关系补出“这样吩咐”，使汉语传承链清楚。
- source_word: አቡሁ፡ ለአቡክሙ
  choice: 你们父亲的父亲
  rationale: 按吉兹语表层关系直译，不把它与随后“他的儿子玛土撒拉”合并。
theological_decisions:
- issue: 以诺与受话者之父的亲属关系
  choice: 正文保留“你们父亲的父亲”
  alternative: 以诺吩咐你们的父亲玛土撒拉
  rationale: 原文同时出现“你们父亲的父亲”和“他的儿子玛土撒拉”；尽管谱系上可能引起张力，仍保留两个明确成分，不以推断消解文本难点。
- issue: 未完句的处理
  choice: 以省略号保留“拉麦又……”
  alternative: 依据后续经文补全拉麦所吩咐的对象与内容
  rationale: 所提供的原文止于“拉麦”，不可借后文推补本节缺失内容。
