  register: 采用现代、庄重而易懂的普通话。“秉持公义和正直”避免过度古雅；“成为义人”有意保留原文同根复现。破折号标明同位说明，分号清楚呈现从以诺到玛土撒拉、再到拉麦的训诫传承。
