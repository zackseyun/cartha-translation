  yaml_path: translation/extra_canonical/jubilees/008/023.yaml
  text: and a man his neighbor. And everyone sold himself to do iniquity and to shed much blood.
translation:
  language: zh_hans
  text: 人与邻舍彼此相害。人人都出卖自己，去行不义，流许多人的血。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流许多人的血”也可译作“流许多血”。所给吉兹语文本与传统章节编号《禧年书》8:23并不相符；旧译“含知道父亲咒诅了他的小儿子……”对应另一处经文，并非本行吉兹语的内容。
    reason: 说明“许多血”的语法歧义，并警示源文与经节编号错位及旧译误配。
lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: 人与邻舍彼此相害
  rationale: 该片段字面近于“人〔与〕他的同伴／邻舍”，在现存句首残片中语法关系不完整；依上下文保留人与邻舍之间相害的含义，同时用自然汉语成句。
- source_word: ኵሉ፡ ተሰይጠ
  choice: 人人都出卖自己
  rationale: 保留反身动词“卖掉自己／自甘卖身”的强烈意象，不弱化为单纯“投身于”。
- source_word: ይግበር፡ ዐመፃ
  choice: 去行不义
  rationale: ዐመፃ 可指不义、暴行或悖逆；“不义”覆盖面较广，也保留伦理与神学张力。
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: 流许多人的血
  rationale: 源文直译为“倾倒许多血”；汉语以“流……的血”自然表达，并将“许多”理解为受害者众多，但在脚注保留另一种可能。
theological_decisions:
- issue: “出卖自己”的道德能动性
  choice: 保留“出卖自己”
  alternative: 任凭自己／投身于
  rationale: 源文的反身卖身意象强调人主动屈从于罪恶；不将其改写为某一宗派关于意志或罪性的专门表述。
- issue: ዐመፃ 的罪恶类别
  choice: 不义
  alternative: 罪孽／暴行／悖逆
  rationale: 源词语义宽广，“不义”不把它限定为暴力或宗教悖逆；后文流血自然显出其暴力后果。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“出卖自己”刻意保留源文的鲜明比喻。因开头吉兹语片段疑为承接上文的残句，正文作最低限度补足，并以脚注披露文本与编号错位。
