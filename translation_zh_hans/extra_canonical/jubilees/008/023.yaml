review_pass:
  verdict: revise
  source_fidelity: 首句的吉兹语在所给材料中只是承接上文的残片，直呈“……人〔对〕他的邻舍……”，没有可据以补出“彼此相害”的动词或关系。后句明确表达众人卖了自己／自卖，以行不义并流（倾倒）许多血；“许多人的血”将原文的“许多血”不必要地具体化了。
  naturalness: “人人都卖了自己，去行不义，流许多血”在现代汉语中庄重、清楚，也保留原文强烈的自卖意象。以省略号保留首句作为残片的未完成状态，优于擅自补足为完整叙述。
  terminology: “不义”适切对应广义的罪恶／不义（ዐመፃ），不预设狭义神学解释。“卖了自己”忠实保留反身“卖”的比喻。
  issues:
  - severity: high
    issue: 首句添加“彼此相害”
    rationale: 所给吉兹语仅有“人……邻舍”的残片，未出现“伤害”或“彼此”所需的词义。该补足改变并扩展了源文。
  - severity: medium
    issue: “流许多人的血”具体化了“许多血”
    rationale: 原文的宾语是“许多血”，并未明说“人的”。虽然流血语境通常涉及人，译文应保留原有表达的概括性。
  - severity: low
    issue: 脚注包含旧译误配及章节错位的编辑说明
    rationale: 这些信息可用于审校记录，但不属于经文读者必须阅读的译注；且现有脚注是为已改动的“许多人的血”而设，修正正文后无需保留该锚点。
  revised_text: ……人对邻舍……。人人都卖了自己，去行不义，流许多血。
  revised_footnotes: []
  revision_rationale: 删除无源文根据的“彼此相害”，并以省略号保留所给源文开头作为承接性残片的语法不完整。将“许多人的血”改为“许多血”，不把原文未明言的受害者类别写入正文。相应删除仅为该具体化及编校错位说明而设的脚注。
