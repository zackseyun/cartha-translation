review_pass:
  verdict: revise
  source_fidelity: 后半句基本忠实，但“流许多人的血”把吉兹语直称的“许多血”具体化为许多受害者的血，超过了原文。首个短语在所给吉兹语中确为不完整的“人……邻舍”式残片；译作“彼此相害”不仅补入动作，也补入双向关系，推断稍强。
  naturalness: “人人都出卖自己，去行不义”自然、庄重，也保留反身“卖掉自己”的意象。将首句收为“人害邻舍”可避免“彼此”造成的额外含义，同时使汉语成句；脚注说明该处文本残缺／省略性质。
  terminology: “不义”适合对应语义宽泛的 ዐመፃ，不宜在正文限定为“暴行”或“悖逆”。“卖身行不义”比“出卖自己，去行不义”更凝练，仍保留原文的自我出售比喻。专名在旧译说明中采用通行的“古实、麦西、弗、迦南”。
  issues:
  - severity: medium
    issue: “彼此相害”补入了互相、双向的关系。
    rationale: 所给源文只保留“人……邻舍”的不完整短语；即使按语境补出伤害动作，也没有明示“彼此”。
  - severity: medium
    issue: “流许多人的血”将“许多血”解释为“许多人的血”。
    rationale: ደመ፡ብዙኀ 的表述是“许多血／大量的血”，未明说“人的”。应在正文保留其简洁与歧义。
  - severity: low
    issue: 脚注将章节错位说明与血的语法歧义混合，且未保留英文审计轨迹所载旧译的具体内容。
    rationale: 脚注应明确标为旧译误配，并给出其文本；正文的“许多血”无需再作不必要的语法说明。
  revised_text: 人害邻舍。人人都卖身行不义，流许多血。[a]
  revised_footnotes:
  - marker: a
    text: 旧译作：“含知道他父亲咒诅了他最小的儿子，便离开父亲；他和他的儿子们，就是古实、麦西、弗和迦南，都与他同去。”这段旧译对应另一处经文，并非本行所给的吉兹语文本。首句的吉兹语仅存“人……邻舍”的省略性短语；“害”按语境补足。
    reason: 保留英文审计轨迹中的旧译误配信息，并透明说明源文首句的不完整性及译文的最低限度补足。
  revision_rationale: 修订避免把“许多血”限定为“许多人的血”，并删除源文未明示的相互性。首句仍须以最少补足构成可读汉语，故用单向的“人害邻舍”，同时在脚注披露该处源文短语的不完整状态。脚注也完整保留先前错误经文配对的审计信息，而不将其误称为本节的正常异译。
