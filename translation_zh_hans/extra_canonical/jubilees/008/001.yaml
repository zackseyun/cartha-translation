base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/001.yaml
  text: In the twenty-ninth jubilee, in the first week, in its first year, Arpachshad took a wife for himself, and her name was Rasu'eja, the daughter of Susan, the daughter of Elam, and she bore him
translation:
  language: zh_hans
  text: 在第二十九个禧年周期[a]的第一个七年期、第一年，亚法撒为自己娶了妻子。她名叫拉苏耶雅，是苏珊的女儿；苏珊是以拦的女儿。她给他生了[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给印本文字表面也可读作“第四十九个”；但按本书年代次序，此处应为“第二十九个”，所给文字很可能有识别或排印错误。
    reason: 说明数字的文本问题及正文采用“第二十九个”的依据。
  - marker: b
    text: 原文到此只说“她给他生了”，所生的是谁见下一节。
    reason: 说明本节末句的直接宾语在下一节，保留原文跨节未完的句法。
lexical_decisions:
- source_word: እዮቤልው
  choice: 禧年周期
  rationale: 指《禧年书》以四十九年为单位的禧年计算周期；加“周期”可避免被理解为单独一个禧年。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词指由七年组成的一“周”；译作“七年期”既保留历法结构，也便于现代读者理解。
- source_word: አርፋክስድ
  choice: 亚法撒
  rationale: 采用现代中文圣经中 Arpachshad 的常见译名。
- source_word: ራሱእያ
  choice: 拉苏耶雅
  rationale: 按吉兹语人名音译，尽量保留其音节结构。
- source_word: ወለተ፡ ሱሳን፡ ወለተ፡ ኤላም
  choice: 是苏珊的女儿、以拦的外孙女
  rationale: 原文连续使用“女儿”表达谱系；汉语以“女儿、外孙女”自然呈现两代女性谱系关系。
- source_word: ወወለደት፡ ሎቱ
  choice: 她给他生了
  rationale: 逐项保留“生”和间接受词“给他”；其直接宾语位于下一节，因此本节以破折号标示句意未完。
theological_decisions:
- issue: 禧年数字的文本问题
  choice: 正文作“第二十九个”
  alternative: 第四十九个
  rationale: 所给印本文字表面可被读作“四十九”，但书中年代次序要求此处为“二十九”，且已有校勘意见判定数字字形属于OCR错误；正文采用符合原书年代体系的读法，同时以脚注保留印本文本证据。
- issue: 跨节未完的生育句
  choice: 保留“她给他生了——”并用破折号提示下接
  alternative: 补出下一节的“一个儿子”或删去本节末句
  rationale: 不越过本节补入原文此处没有的直接宾语，也不遗漏结尾的动词短语，从而保留原有分节造成的悬置。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。历法术语用“禧年周期”和“七年期”明确时间层级；人名采用通行译名或依原文音译。以分号和破折号改善长句可读性，同时保留跨节悬句。
