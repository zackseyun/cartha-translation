  yaml_path: translation/extra_canonical/jubilees/008/031.yaml
  text: And Noah began to command his sons' sons with ordinances and commandments and all the judgments that he knew, and he testified to his sons that they should do righteousness, and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication and uncleanness and all injustice.
translation:
  language: zh_hans
  text: 挪亚开始把自己所知道的一切律例、诫命和各样法度教导给他的孙子们，又向他的儿子们郑重嘱咐，要他们行公义，遮盖自己身体的羞处，称颂那创造他们的，孝敬父母，彼此相爱，并谨守自己，远离淫乱、污秽和一切不义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዘ
  choice: 律例、诫命
  rationale: 分别呈现规章与命令两类规范性用语，同时保持现代中文经籍语体。
- source_word: ፍትሐ
  choice: 法则
  rationale: 此处指挪亚所知的各项判断、裁断或法度；译作“法则”既保留法律语义，也避免误解为具体司法判决。
- source_word: ይግበሩ፡ ጽድቀ
  choice: 行公义
  rationale: 保持原文“实行公义”的行动性，而非仅译作“为人正直”。
- source_word: ይክድኑ፡ ኃፍረተ፡ ሥጋሆሙ
  choice: 遮盖自己身体的羞处
  rationale: 直译原文关于遮盖肉身羞处的表达，保留其身体与伦理层面的含义。
- source_word: ይባርክዎ፡ ለዘፈጠሮሙ
  choice: 称颂创造他们的主
  rationale: 动词意为祝福、称颂；补出“主”使汉语自然，但不以专名替代原文关系性称谓“创造他们的那一位”。
- source_word: ያክብሩ፡ አበ፡ ወእመ
  choice: 孝敬父母
  rationale: “尊荣父亲和母亲”在现代标准中文圣经语域中自然表达为“孝敬父母”。
- source_word: ያፍቅሩ፡ አሐዱ፡ አሐዱ፡ ቢጾ
  choice: 彼此相爱
  rationale: 原文逐字近于“各人爱他的同伴/弟兄”；上下文为家族训诫，译作“彼此相爱”自然且不排除弟兄含义。
- source_word: ይዕቀቡ፡ ነፍሶሙ
  choice: 保守自己的性命
  rationale: 保留“灵魂/生命/自身”可能的语义张力；此处以“性命”呈现对整个人的守护，而非预设后期灵魂论。
- source_word: ዝሙት
  choice: 淫乱
  rationale: 对应广义的非法性行为，采用庄重而通行的伦理术语。
- source_word: ርኵስ
  choice: 污秽
  rationale: 保留礼仪与道德污秽皆可能包含在内的宽广语义。
- source_word: ዐመፃ
  choice: 不义
  rationale: 此词可含暴行、违法、压迫等义；“一切不义”保留概括性，不缩限为暴力。
theological_decisions:
- issue: “创造他们的那一位”的称谓
  choice: 创造他们的主
  alternative: 创造他们的那一位／他们的创造主
  rationale: 用“主”使中文称颂对象明确而庄重，但不加入特定神学名号或宗派性解释。
- issue: “保守他们的灵魂”中“灵魂”的理解
  choice: 保守自己的性命
  alternative: 保守自己的灵魂／谨守自己
  rationale: 原词可指生命、性命、自身或灵魂；“性命”避免把经文限定为身心二元论，同时保留严肃的生命伦理意味。
- issue: “污秽”是否指礼仪或道德状态
  choice: 保留“污秽”这一宽泛表达
  alternative: 不洁／道德败坏
  rationale: 原文并未在此明确限定，故不把它单独解释为礼仪不洁或纯粹道德败坏。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语；保留训诫式并列结构，但适度调整语序以符合中文表达。经文无脚注，故正文不设标记。
