base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/015.yaml
  text: and holiness. And may he make them great throughout all the ages. And they shall be princes and judges and chiefs for all the seed of the sons of Jacob. They shall speak the word of the Lord in righteousness[15], and they shall judge all his judgments in righteousness, and they shall declare his ways to Jacob and his paths to Israel. The blessing of the Lord shall be in their mouths
translation:
  language: zh_hans
  text: 以及圣洁。愿他使他们在万世中尊大。他们必作雅各众子的一切后裔的首领、审判官和官长。他们必按公义宣讲主的话，按公义施行他的一切判决；他们要向雅各宣明他的道路，向以色列宣明他的路径[a]。主的赐福必在他们口中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的路径”一语在文本和词义上较难确定；有些解释将它理解为给以色列的“律例”或“管教”。
    reason: textual_and_lexical_difficulty
lexical_decisions:
- source_word: ወለቅዱስ
  choice: 并归于圣洁
  rationale: 本节开头承接上文，原文是残句；译文保留其接续性质，不擅自补出未见于本节的支配成分。
- source_word: ያዐብዮሙ
  choice: 使他们……尊大
  rationale: 该使役形式表达“使他们变得伟大／尊大”；“尊大”既保留地位提升之意，也符合祝福语境。
- source_word: ውስተ ኵሉ ዓለማት
  choice: 在万世中
  rationale: 直译为“在一切世代／诸世界中”；此处时间性的祝福语境支持“万世”。
- source_word: መኳንንተ ወመሳፍንተ ወመላእክተ
  choice: 首领、审判官和使者
  rationale: 保留三个并列身份。末词通常可指天使或使者；此处描述雅各后裔中的职分，故正文采用较中性的“使者”，并以脚注说明另一种语境性理解。
- source_word: ቃሎ ለእግዚአብሔር
  choice: 主的话
  rationale: 自然表达属格关系，不扩展为特定教义术语。
- source_word: በጽድቅ
  choice: 按公义
  rationale: 该短语两次出现，分别修饰宣讲与审断；重复保留原文的平行结构和强调。
- source_word: ፍኖቶ
  choice: 他的道路
  rationale: 采用常见的道路隐喻，保留行为方式与神所指示之道的语义空间。
- source_word: አስርኖ
  choice: 他的路径
  rationale: 此词在该处文本和词义均有困难；正文采用与前句平行且较保守的“路径”，不在正文中强行确定为律例或管教。
- source_word: በረከተ ለእግዚአብሔር
  choice: 主的赐福
  rationale: “赐福”比抽象的“福分”更适合“在他们口中”的宣告语境，同时仍保留原文属格表达。
theological_decisions:
- issue: “他的判决／道路／路径”中代词的指向
  choice: 保留“他”的连续指称，按上下文指向主
  alternative: 把每一处都明确译成“主的”
  rationale: 原文使用第三人称所属形式；保留代词可维持原文衔接，也避免增加不必要的解释性重复。
- issue: 第三种职分是否指超自然的“天使”
  choice: 译为“使者”，并加注说明
  alternative: 译为“天使”或按语境译为“领袖”
  rationale: 原词确可指天使，但本句把这些职分置于雅各众子的后裔中；“使者”既忠于词形，也不把含义限定为超自然存在。
- issue: 对以色列所宣明的是“路径”还是“律例／管教”
  choice: 正文保留“路径”，脚注交代其他可能
  alternative: 直接译为“律例”或“管教”
  rationale: 该处存在真实的文本与词义困难；正文不消解歧义，脚注呈现较强的解释性读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留开头承接上文的残句形式、三重职分列表、两次“按公义”的平行重复，以及结尾“在他们口中”的具体意象；不补入宗派性解释。
