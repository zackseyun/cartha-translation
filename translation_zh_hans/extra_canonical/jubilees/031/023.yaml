lexical_decisions:
- source_word: በፍሥሐ
  choice: 满心欢喜
  rationale: 该短语意为“带着喜乐／欢喜地”；译作“满心欢喜”自然庄重，同时不增添具体动作。
- source_word: አኖመ
  choice: 安置好
  rationale: 此处表示使二人各居一侧；“安置好”比直译为“使躺下”更符合上下文，也保留了主动安排位置的含义。
- source_word: በየማኑ … በፀጋሙ
  choice: 在自己右边……在自己左边
  rationale: 依次保留原文左右位置的对称结构；补出反身代词“自己”，明确是相对于句中主语的位置。
