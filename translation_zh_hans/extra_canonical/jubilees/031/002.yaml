  text: the foreign gods that are among you.' And they gave him the foreign gods, and what was in their ears and what was on their necks, and the idols that Rachel had stolen from Laban her brother. And she gave them all to Jacob, and he burned them, and crushed them, and destroyed them, and hid them under the oak that was in the land of Shechem.
translation:
  language: zh_hans
  text: “你们中间的外族神像。”他们便把外族神像，以及耳朵上和颈项上所戴的饰物，都交给他；还有拉结从她兄弟拉班那里偷来的偶像。她把这一切都交给雅各；雅各把它们焚烧、砸碎、毁掉，又埋藏在示剑地的橡树[a]下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “橡树”所对应的吉兹语树名也可译作“笃耨香树”；确切树种不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: አማልክተ፡ ነኪር
  choice: 外族神像
  rationale: 字面为“外来的/陌生的神”；结合可交付、焚烧、砸碎和埋藏的实体语境，译作“外族神像”既保留异族归属，也符合所指物件。
- source_word: ዘውስተ፡ እዘኒሆሙ፡ ወዘውስተ፡ ክሳውዲሆሙ
  choice: 耳朵上和颈项上所戴的饰物
  rationale: 原文直陈“在他们耳中和颈上的东西”，中文补出“所戴的饰物”以自然表达，但不进一步限定为耳环或护符。
- source_word: ጣዖተ
  choice: 偶像
  rationale: 指拉结偷来的宗教塑像或神像；“偶像”为准确且通行的中文宗教用语。
- source_word: ድርዋስ
  choice: 橡树
  rationale: 树种词的确切对应不完全确定；正文采用自然、传统的“橡树”，并以脚注保留“笃耨香树”的可能。
- source_word: ምድረ፡ ሰቂሞን
  choice: 示剑地
  rationale: 保留地名并表达“示剑之地”的地域含义。
theological_decisions:
- issue: “外族神”是指神祇本身还是其物质神像
  choice: 外族神像
  alternative: 外族神明
  rationale: 后续动作包括交出、焚烧、砸碎、毁掉和埋藏，明显强调物质对象；译作“神像”避免中文读者误解为抽象神祇，同时仍保留其异教性质。
- issue: 耳朵和颈项上的物件是否明确为宗教护符
  choice: 饰物
  alternative: 护符
  rationale: 原文只说这些部位上的东西，未明确说明其宗教功能，故不将其教义性地具体化为“护符”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。开头保留上节引语的收尾，并明确随后另起叙述。各处连续动词均予保留，不省略“毁掉”。
