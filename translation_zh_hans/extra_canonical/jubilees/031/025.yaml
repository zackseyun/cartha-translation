  text: And Isaac blessed the God of his father Abraham, who had not withheld his mercy and his righteousness from the son of his servant Isaac.
translation:
  language: zh_hans
  text: 以撒称颂他父亲亚伯拉罕的上帝；这位上帝没有从他仆人以撒的儿子那里收回慈爱和公义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: 称颂
  rationale: 此处以撒以上帝为宾语，表示向上帝颂赞、祝福；“称颂”比“祝福上帝”更符合现代汉语习惯。
- source_word: ምሕረተ
  choice: 慈爱
  rationale: 表达上帝怜悯、恩慈的持久态度；“慈爱”自然且保留盟约语境可能具有的厚度。
- source_word: ጽድቀ
  choice: 公义
  rationale: 保留该词兼具正直、公正与信实行为的神学张力，不缩减为单纯的“善意”。
- source_word: አኀደገ
  choice: 收回
  rationale: 结合否定词理解为“没有撤去/扣留”；“没有……收回”在汉语中自然，并体现持续施予的含义。
- source_word: እምወልደ ገብሩ ይስሐቅ
  choice: 向自己仆人以撒的儿子
  rationale: 按源文属格关系直译，指上帝的仆人以撒之子；避免把“以撒”误解为“儿子”的同位语。
theological_decisions:
- issue: “慈爱和公义”之间的关系
  choice: 保留两个并列名词“慈爱和公义”
  alternative: 合并译为“信实的慈爱”或“恩义”
  rationale: 源文明确并列两项；保留并列可避免预先界定二者是同义、因果或盟约性复合概念。
- issue: 上帝与以撒的关系表述
  choice: 译作“自己仆人以撒”
  alternative: “他的仆人以撒”
  rationale: “自己”明确反身所属关系，避免汉语中的“他”被误指为亚伯拉罕，同时不增加源文以外的神学解释。
translation_notes:
  register: 采用现代、庄重而通顺的经文语体。“称颂”适合人向上帝的动作；句式尽量贴近源文结构，同时通过“自己”消除代词歧义。
