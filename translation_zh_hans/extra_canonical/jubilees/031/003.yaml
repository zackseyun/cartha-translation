  yaml_path: translation/extra_canonical/jubilees/031/003.yaml
  text: And he went up on the new moon of the seventh month, to Bethel. And he built an altar in the place where he had lodged, and he set up there a pillar, and he sent to his father Isaac that he should come to him.
translation:
  language: zh_hans
  text: 七月初一，他上伯特利去。他在先前住宿的地方筑了一座祭坛，又在那里立了一根柱子，并派人去请他父亲以撒到他这里来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: 七月初一
  rationale: 该短语指第七个月的新月日，即月初一；原文没有“年”字，因此不译作“第七年正月”。
- source_word: ዐርገ
  choice: 上……去
  rationale: 保留动词“上去”的方向含义，符合前往伯特利的叙事表达。
- source_word: ኖመ
  choice: 住宿
  rationale: 此处指留宿、过夜；“住宿”比单纯“睡觉”更准确，也适合现代叙事语体。
- source_word: ሐውልተ
  choice: 柱子
  rationale: 指立起作为标志或纪念物的石柱；正文采用中性、简明的“柱子”，不额外指定其用途。
- source_word: ፈነወ፡ ኀበ፡ አቡሁ፡ ይስሐቅ
  choice: 派人去请他父亲以撒
  rationale: 原文直译为“差遣到他父亲以撒那里”，结合后接目的句，汉语自然表达为派人请以撒前来。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事文体。“七月初一”清楚传达古代历法中的新月日；关系结构“他住宿在那里之处”按现代汉语整理为“先前住宿的地方”，不重复“那里”。
