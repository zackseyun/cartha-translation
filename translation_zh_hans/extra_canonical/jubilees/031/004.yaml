lexical_decisions:
- source_word: ውስተ፡ መሥዋዕቱ
  choice: 在他的祭牲那里
  rationale: ውስተ 可表示“在……之中、到……里面”，此处依上下文和审校层取地点义“在……那里”；መሥዋዕት 指献祭之物或祭牲，译作“祭牲”以保留具体而未完全确定的所指。
- source_word: ወኀበ፡ እሙሂ፡ ርብቃ
  choice: 也到他母亲利百加那里
  rationale: ኀበ 表示朝向或到某人那里；-ሂ 带有附加意味，故用“也”；רבקה/ርብቃ 按现代中文圣经通行人名译作“利百加”。
- source_word: ይምጻእ፡ ወልድየ፡ ያዕቆብ
  choice: 让我的儿子雅各来吧
  rationale: 愿望式 ይምጻእ 译为“让……来吧”，自然表达以撒的吩咐或愿望；保留“我的儿子雅各”的原有语序与亲属称谓。
