  text: He embraced the neck of Jacob his son and wept upon his neck. And the dimness passed from Isaac’s eyes, and he saw the two sons of Jacob, Levi and Judah, and he said, “Are these your sons, my son?”
translation:
  language: zh_hans
  text: 他抱住他儿子雅各的颈项，在他的颈项上哭泣。以撒眼中的昏暗消退了；他看见雅各的两个儿子利未和犹大，就问：“我儿，这些是你的儿子吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክሳደ፡ ያዕቆብ፡ ወልዱ፡
  choice: 儿子雅各的颈项
  rationale: ክሳድ 表示“颈项”，并与“雅各、他的儿子”构成领属关系；正文保留原文明确出现的身体部位。句首动作须依上下文补出，译作“搂住”以形成自然汉语。
- source_word: ወበከየ፡ ዲበ፡ ክሳዱ።
  choice: 伏在他的颈项上哭
  rationale: 按字面为“在他的颈项上哭”；“伏在”符合现代汉语叙事习惯，同时不改变动作关系。
- source_word: ወጽላሌ፡ ኀለፈ፡ እምአዕይንተ፡ ይስሐቅ፡
  choice: 以撒眼中的昏暗消退了
  rationale: ጽላሌ 指遮蔽视线的昏暗，ኀለፈ 表示过去、离去；译文保留视力恢复的具象说法。
- source_word: ወርእየ፡ ክልኤሆሙ፡ ውሉደ፡ ለያዕቆብ፡ ሌዊሃ፡ ወይሁዳሃ፡
  choice: 他看见雅各的两个儿子利未和犹大
  rationale: 依原文次序清楚表达“两位、雅各的儿子、利未和犹大”。
- source_word: ውሉድከሁ፡ እሉ፡ ወልድየ፡
  choice: 我儿，这些是你的儿子吗？
  rationale: 原文直陈形式在语境中承担询问功能；以汉语问句自然呈现，并保留“我儿”的称呼。
theological_decisions:
- issue: 以撒视力恢复的性质
  choice: 按原文译作“眼中的昏暗消退了”
  alternative: 解释为神迹性医治或仅为暂时看清
  rationale: 原文只叙述昏暗离开，未交代原因、持续时间或神学性质，因此不作额外解释。
- issue: 句首缺省动作
  choice: 依据上下文补作“搂住”
  alternative: 机械保留为不完整的名词短语，或泛译为“拥抱雅各”
  rationale: 所给吉兹语片段以“儿子雅各的颈项”起首，动作似由上下文承接或省略；为使中文成句而补出动作，同时在正文保留“颈项”并用脚注说明较宽泛译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“颈项”比“脖子”更适合经文体裁，但仍易懂；整体避免古奥虚词。引语以现代标点呈现。
