revisions:
- from: 既然你看见我还活着，我也见到了你，我儿，你就亨通吧。你所许的愿，要履行，不可延迟还愿，因为这愿必向你追讨；现在要赶快履行。
  to: 既然你看见我还活着，我也见到了你，我儿，你就亨通吧。你所许的愿，要履行；不可延迟履行你的愿，因为你必因这愿被追究。现在要赶快履行。
