  yaml_path: translation/extra_canonical/jubilees/031/029.yaml
  text: in that you have seen me alive, and I also have seen you, my son. Prosper and fulfill the vow that you have vowed, and do not delay your vow, for you will be called to account concerning the vow, and now hasten to perform it.
translation:
  language: zh_hans
  text: 既然你看见我还活着，我也见到了你，我儿，你就亨通吧。你所许的愿，要履行；不可延迟履行你的愿，因为你必因这愿被追究。现在要赶快履行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ ባቲ፡
  choice: 既然
  rationale: 此处是表原因或依据的连接语，意为“既然／因着”，上下文没有“日子”这一阴性先行词，不宜补作“在……那一天”。
- source_word: ሕያወየ
  choice: 我还活着
  rationale: 保留“活着”的状态义，并以“还”体现相见时发现对方仍然活着的自然汉语语感。
- source_word: ተስፋሕ
  choice: 你就亨通吧
  rationale: 按此处祝愿或劝勉语气处理，采用庄重而易懂的“亨通”。
- source_word: ግበር፡ ጸሎተ
  choice: 履行……愿
  rationale: 该搭配直指实行、完成所许之愿；现代汉语惯用“履行所许的愿”。
- source_word: አታጕንዲ፡ ጸሎተከ
  choice: 不可延迟还愿
  rationale: 表达不可拖延履行誓愿；“还愿”是现代汉语中对此行为的简洁说法。
- source_word: ትትኀሠሥ፡ ጸሎተ
  choice: 这愿必向你追讨
  rationale: 保留原文“被寻索／被追究”的被动和追索意象，不把它过度解释为特定审判场景。
- source_word: ጕጕአ፡ ትግበራ
  choice: 要赶快履行
  rationale: 准确传达催促立即实行的含义，汉语自然简明。
theological_decisions:
- issue: 许愿之后所负责任的表达
  choice: 这愿必向你追讨
  alternative: 你必因这愿被追究／你必为这愿交账
  rationale: 原文含被寻索、追究之意，但没有明说追讨者或审判形式；正文保留拟人化和神学张力，避免擅自明确主体。
translation_notes:
  register: 采用现代、庄重、易懂的叙事劝诫语体；保留“我儿”的亲属称呼和许愿履愿的经文语汇，不增添原文没有的时间先行词或审判主体。
