  yaml_path: translation/extra_canonical/jubilees/031/001.yaml
  text: And on the new moon of the month Jacob spoke to all the people of his house, saying, “Purify yourselves and change your garments, and let us rise and go up to Bethel, where I prayed to him in the day when I fled from the face of Esau my brother, and he was with me and brought me back into this land in peace. And put away
translation:
  language: zh_hans
  text: 到了月朔[a]，雅各对全家的人说：“你们要洁净自己，更换衣服。我们起来，上伯特利去；我逃避我哥哥以扫的那一天，曾在那里向他祷告。他与我同在，使我平安回到这片土地。你们还要除掉[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到了本月初一”。原文指新月初现之时。
    reason: 说明日期用语的可译范围，并排除“第一个月”的误读。
  - marker: b
    text: 这句话在下一节接续；“除掉”的宾语也见下一节。
    reason: 原文在本节末以命令式动词结束，句意尚未完整，且直接引语仍在继续。
lexical_decisions:
- source_word: በሠርቀ፡ ወርኅ፡
  choice: 到了月朔
  rationale: 字面指月亮初现之时，即新月或一月之初；“月朔”准确表达每月初一，而不是“第一个月”。
- source_word: ንጽሑ፡
  choice: 洁净自己
  rationale: 这是复数命令式，指礼仪或宗教意义上的自洁；译文不擅自限定具体仪式。
- source_word: ወወልጡ፡ አልባሲክሙ፡
  choice: 更换衣服
  rationale: 直译为“换你们的衣服”，现代汉语以“更换衣服”自然表达。
- source_word: ንዕርግ፡ ቤቴል፡
  choice: 上伯特利去
  rationale: 保留“上去”的方向性，并采用通行地名“伯特利”。
- source_word: ወሜጠኒ፡
  choice: 使我……回到
  rationale: 该动词含“使返回、带回”之意，须保留“回”的语义，不能仅译作“带我”。
- source_word: ወአስስሉ፡
  choice: 你们还要除掉
  rationale: 这是复数命令式，仍属雅各的直接引语；宾语在下一节出现，因此本节保留未完结构。
theological_decisions:
- issue: “他与我同在”中代词所指
  choice: 保留“他”
  alternative: 明确译为“上帝”
  rationale: 原文使用第三人称代词，语境所指显然是雅各祷告的对象，但本节没有在此处直接写出“上帝”；保留代词可避免把解释写入正文。
- issue: “洁净自己”的性质
  choice: 不具体说明洁净方式
  alternative: 译作“行洁净礼”或“使自己在礼仪上洁净”
  rationale: 原文命令洁净，却没有规定具体方式；正文保留其礼仪和道德层面的开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“月朔”略具经文文体色彩，并由脚注解释；其余措辞力求自然。末尾不闭合引号，以显示雅各的话和未完成的命令延续至下一节。
