lexical_decisions:
- source_word: ጽርሕ
  choice: 内室
  rationale: 此词在这里指以撒躺卧的房间；译作“内室”既符合场景，也比“宫室”自然。
- source_word: እዴ፡ አቡሁ
  choice: 父亲的手
  rationale: 按语境理解为雅各握住父亲的手；中文用单数泛指，不强行补出原文未明确表达的细节。
- source_word: ወደነነ፡ ሰዐሞ
  choice: 俯身亲吻他
  rationale: 分别体现“弯下、俯下”和“亲吻”的动作，表达简洁自然。
- source_word: ወተሰቅለ
  choice: 便紧紧抱住
  rationale: 该动词在此表达依附、紧贴或抱住；结合亲人相见的动作场景，译为“紧紧抱住”，同时因后文残缺而不补宾语。
theological_decisions:
- issue: 本节是否存在需要释义解决的神学歧义
  choice: 不作神学性增补
  alternative: 根据上下文补写祝福或亲属关系方面的内容
  rationale: 现有原文主要叙述动作，且末句残缺；不应以推测补足后续内容或加入特定神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“进到……那里，进了……”保留原文连续进入的句式层次，但用标点减轻重复感；省略原文关系副词后的指示性“那里”，避免中文累赘。末句按残缺文本保留未完状态。
