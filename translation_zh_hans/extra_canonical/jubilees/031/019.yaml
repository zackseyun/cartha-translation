  text: 列国都必震动，万民也都必震动。在你那里，必有给雅各的帮助。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሀወኩ
  choice: 必震动
  rationale: 该动词在此表示受震撼、动荡；重复译出，以保留原文的平行与强调。
- source_word: አሕዛብ / ሕዝብ
  choice: 列国 / 万民
  rationale: 分别对应诸国与各民众，既保留词汇区别，也形成自然的汉语平行句。
- source_word: ረድኤተ
  choice: 帮助
  rationale: 直译为援助、帮助；不擅自具体化为拯救或救主。
- source_word: ብከ
  choice: 在于你
  rationale: 保留第二人称单数以及帮助以此人为所在或媒介的表达，避免补入原文未明说的施事关系。
theological_decisions:
- issue: “雅各的帮助”与“你”的关系
  choice: 雅各的帮助必在于你
  alternative: 你必帮助雅各
  rationale: 原文采用“在你之中/在你那里”加名词“帮助”的结构；正文保留其表达张力，不改写成直接的主谓施受关系。
translation_notes:
