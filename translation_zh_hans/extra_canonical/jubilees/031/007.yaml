base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/007.yaml
  text: She heard, “Behold, Jacob your son has come.” And she kissed him. And she saw his two sons and recognized them, and said to him, “Are these your sons, my son?” And she embraced them and kissed them and blessed them, saying, “In you shall the seed of Abraham be honored, and you shall become a blessing.”
translation:
  language: zh_hans
  text: 她听见有人说：“看哪，你儿子雅各来了。”她就亲吻他。她看见他的两个儿子，认出了他们，便对他说：“我儿，这些是你的儿子吗？”她拥抱他们，亲吻他们，为他们祝福说：“亚伯拉罕的后裔必因你们而得尊荣；你们也必成为福分。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጽሐ
  choice: 来了
  rationale: 该词表示“到达、来到”；在报信场景中译作“来了”自然准确。
- source_word: አእመረትሙ
  choice: 认出了他们
  rationale: 保留“认识、辨认”的明确含义，而不弱化为仅仅“知道他们是谁”。
- source_word: ይክበር
  choice: 得尊荣
  rationale: 对应“受尊崇、得荣耀”的被动或不及物意义；“得尊荣”兼顾庄重语体与现代可懂性。
- source_word: ዘርአ አብርሃም
  choice: 亚伯拉罕的后裔
  rationale: “种子”在此为群体性后裔用法，现代汉语宜译“后裔”。
- source_word: ለበረከት
  choice: 成为福分
  rationale: 直承“成为祝福/福分”的述语结构；“福分”在此比“祝福”更适合作为人成为的结果性名词。
theological_decisions:
- issue: 祝福中第二人称的数
  choice: 你们
  alternative: 你
  rationale: 原文ብክሙ及相关动词形式为复数，指刚被拥抱并蒙祝福的两个儿子，不应按英语单复数不显的形式弱化。
- issue: 末句是否加入“在地上”
  choice: 不加入
  alternative: 你们必在地上成为福分
  rationale: 本节所给吉兹语原文没有对应“在地上”的成分，因此不从其他传统或平行表述补入。
- issue: “因你们而得尊荣”的关系
  choice: 保留工具/关联性的“因你们”
  alternative: 亚伯拉罕的后裔要在你们里面得尊荣
  rationale: ብክሙ字面可表达“在你们里面”或“借着/因着你们”；汉语“因你们”较自然，同时不把其神学关系具体化为地点性的“里面”。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“看哪”保留原文提示注意的语气；人物动作按原文顺序铺陈。问句调整为自然汉语词序，但保留“我儿”的亲属称呼。
