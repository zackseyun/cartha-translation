  yaml_path: translation/extra_canonical/jubilees/031/013.yaml
  text: 'and his left hand on Judah, and he turned toward Levi first and began to bless him, and said to him: “May the God of all, the Lord of all the ages, bless you'
translation:
  language: zh_hans
  text: 左手则按在犹大身上。[a]他先转向利未，开始祝福他，对他说：“愿万有的上帝、万世的主赐福给你，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又用左手按着犹大。”
    reason: 原文在此承接上一节的动作并采用省略结构；此译法更贴近其字面形式。
lexical_decisions:
- source_word: በፀጋማዊ፡ እዴሁ
  choice: 左手则按在……身上
  rationale: 原文意为“用他的左手”，承接上一节“按手”的动作；汉语补出“按在……身上”，使跨节省略自然清楚。
- source_word: ቀዲሙ
  choice: 先
  rationale: 保留利未在祝福次序上居先的含义，同时避免重复表达。
- source_word: አምላከ፡ ኵሉ
  choice: 万有的上帝
  rationale: 直译“众有/一切的上帝”，以“万有”保持庄重并涵盖整体性。
- source_word: እግዚአ፡ ኵሉ፡ ዓለማት
  choice: 万世的主
  rationale: ዓለማት 可指诸世代或诸时代；“万世”保留时间维度和礼仪性语感。
- source_word: ይባርከ፡ … ኪያከ
  choice: 愿……赐福给你
  rationale: 以汉语祈愿式准确表达原文祝祷语气。
theological_decisions:
- issue: “万有的上帝”与“万世的主”的关系
  choice: 保留两个并列称号，指向同一位上帝
  alternative: 合并为“统管万世万有的上帝”
  rationale: 原文分别使用“万有的上帝”和“万世的主”，保留并列结构可避免抹平其修辞和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与祝福用语。“左手则按在犹大身上”补足跨节省略的动作，避免误读为犹大使用自己的左手；句末保留逗号，表明祝福语在下一节继续。
