  yaml_path: translation/extra_canonical/jubilees/031/024.yaml
  text: 'And it was reckoned to him as righteousness. And Jacob told his father during the night everything: how the Lord had shown him great mercy, and how he had made all his ways prosper and had protected him from everything.'
translation:
  language: zh_hans
  text: 这就算为他的义。[a] 到了夜里，雅各把一切都告诉了父亲：主怎样向他施了极大的怜悯，[b] 怎样使他所行的一切尽都顺利，又怎样保守他脱离一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹文本作“义便临到他”；正文依校勘所推定的读法“这就算为他的义”。
    reason: 所给文本的ወተኀለፈ意为“越过、临到”，而校勘意见认为此处是ወተኈለቈ（“被计算、被算作”）的讹误。
  - marker: b
    text: 或按较贴近字面的结构理解为：“主为他所做的一切，即那极大的怜悯。”
    reason: 原文这一分句可将“所做的一切”与“大怜悯”较松散地相连；正文则将“做”与“极大的怜悯”连读，译为自然的“施了极大的怜悯”。
lexical_decisions:
- source_word: ጽድቀ
  choice: 义
  rationale: 保留“算为义”这一圣经惯用表达中的核心名词，措辞简洁庄重。
- source_word: እግዚአ ብሔር
  choice: 主
  rationale: 该复合称谓通常指“主”，不泛化为“上帝”。
- source_word: ሣህለ፡ ዐቢየ
  choice: 极大的怜悯
  rationale: 直陈其程度与性质；与ገብረ连用时自然译为“施了极大的怜悯”。
- source_word: ሠርሖ፡ ኵሎ፡ ፍኖቲሁ
  choice: 使他所行的一切尽都顺利
  rationale: ፍኖት本义为“道路”，在此按人生行程或所行之事的习语意义表达，同时保留“使……顺利”的使动关系。
- source_word: ተማኅፀኖ፡ እምኵሉ
  choice: 保守他脱离一切
  rationale: 不擅自补入原文未明说的“邪恶”或“危险”，保留“脱离一切”较宽泛的指涉。
theological_decisions:
- issue: 首句是“算为义”还是“义临到他”
  choice: 正文采用“这就算为他的义”
  alternative: “义便临到他”
  rationale: “算为义”反映校勘所推定的读法ወተኈለቈ及其明确的圣经惯用语；但所提供的吉兹文本实际写作ወተኀለፈ，故以脚注保留直译及文本差异。
- issue: 主所行之事与“大怜悯”的句法关系
  choice: “主怎样向他施了极大的怜悯”
  alternative: “主与他同在所做的一切，以及那极大的怜悯”
  rationale: 正文将ገብረ与ሣህለ连读，形成自然的“施怜悯”；脚注保留ዘከመ及ምስሌሁ可能支持的较贴近表层结构的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到了夜里”自然表达时间背景；“所行的一切尽都顺利”保留“道路”的习语色彩；末句刻意不补出原文没有的“邪恶”。所有脚注标记均已置入正文。
