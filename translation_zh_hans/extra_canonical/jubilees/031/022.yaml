  text: He had seen the sons of Jacob his son truly. And he went out from between his feet and fell down and bowed to him. And he blessed them and rested there near Isaac his father that night[22], and they ate and drank.
translation:
  language: zh_hans
  text: 他确实看见了自己儿子雅各的众子。随后，雅各从以撒两脚之间退出来[a]，俯伏在地，向他下拜。以撒便为他们祝福。那一夜，雅各留在父亲以撒身边；他们一同吃喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从以撒两脚之间退出来”是原文较难确定的说法，可能指雅各从以撒跟前退出，然后俯伏下拜。
    reason: 说明源文习语的含混性，避免把对具体动作的推测写入正文。
lexical_decisions:
- source_word: ዘበጽድቅ
  choice: 确实
  rationale: 该短语在此作副词，表达“真实、确然”，用“确实”比直译为“在公义中”更符合现代汉语，同时以脚注保留另一种可能。
- source_word: ወወፅአ፡ እማእከለ፡ እገሪሁ
  choice: 从他两脚之间退出来
  rationale: 尽量保留原文具体而含混的身体方位表达；“退出来”使动作在汉语中可理解，但不把其确切场景解释得过死。
- source_word: ወድቀ፡ ወሰገደ፡ ሎቱ
  choice: 俯伏在地，向他下拜
  rationale: 分别体现“倒下/伏地”与“下拜”的连续动作，采用庄重而自然的现代汉语。
- source_word: ወአዕረፈ፡ ህየ፡ ቅሩበ፡ ይስሐቅ፡ አቡሁ
  choice: 留在父亲以撒身边
  rationale: “留在……身边”自然传达在附近歇宿、停留之意，并保留亲属关系。
theological_decisions:
- issue: ዘበጽድቅ 的语义
  choice: 确实
  alternative: 在公义中
  rationale: 上下文更支持其作真实性副词，而非对雅各众子的道德评价；脚注保留形式上可能的直译。
- issue: 连续动词中的主语与代词指向
  choice: 在正文中以“雅各”“以撒”适度明示
  alternative: 全程使用“他”
  rationale: 吉兹语借上下文表达主语切换，汉语若全用代词会难以辨认；根据“父亲以撒”可合理判定留宿者是雅各，祝福者是以撒，但不额外加入神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。为避免连续代词造成混乱，按上下文有限度地明示“雅各”和“以撒”；不补入原文没有的“欢喜”等内容。所有脚注标记均已置于正文。
