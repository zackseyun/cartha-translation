  text: with you. And I know, my son, that it was for my sake you came, and this day shall be blessed.
translation:
  language: zh_hans
  text: 与你同在。我知道，我儿，你是为我的缘故而来的；这一天必蒙福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስሌከ
  choice: 与你同在
  rationale: 该词组承接上文，直译为“与你同在”；保留本节开头作为前句尾部的残句形态，不擅自补足主语。
- source_word: በእንቲአየ
  choice: 为我的缘故
  rationale: 准确表达原因或受益关联，且比“为了我”更庄重、清晰。
- source_word: መጻእከ
  choice: 你……来的
  rationale: 按第二人称阳性单数完成式表达“你来了”，结合汉语句法译作“你是……而来的”。
- source_word: ትኩን፡ ቡርክት
  choice: 必蒙福
  rationale: 表达“成为／是有福的、受祝福的”；“蒙福”在现代中文中自然，并保留祝福来自外在施予者的语感。
theological_decisions:
- issue: “这一天”是客观蒙福还是愿望式祝福
  choice: 这一天必蒙福
  alternative: 愿这一天蒙福
  rationale: 源文动词形式可承载将来或意愿色彩；上下文英审校层采用陈述性的“shall be blessed”。译文保留较强的将来陈述，同时不明确指定赐福者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我儿”保留亲属称呼及郑重语气；分号呈现两个紧密相关但各自完整的分句。开头“与你同在”忠实保留源文承接上文的结构。
