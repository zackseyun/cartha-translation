  text: For they resemble you.” And he told him that they were indeed his sons. And he said, “Now I see that they are truly your sons.”
translation:
  language: zh_hans
  text: “因为他们像你。”雅各告诉以撒，他们确实是雅各自己的儿子。以撒说：“现在我看出来了，他们确实是你的儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስሉከ
  choice: 他们长得像你
  rationale: 该动词表达“与某人相像”；本段谈论人的外貌，用“长得像”符合现代汉语习惯。
- source_word: በአማን
  choice: 确实
  rationale: 保留原文表示真实性、确定性的强调语气。
- source_word: ውሉዱ
  choice: 自己的儿子
  rationale: 原文意为“他的儿子”；结合叙事主语，以反身形式自然表达他们是雅各的儿子，并避免误译为“孙子”。
theological_decisions:
- issue: 亲属称谓应译为“儿子”还是按以撒的关系译为“孙子”
  choice: 儿子
  alternative: 孙子
  rationale: 原文亲属词及对话视角指向“你的儿子”，即雅各的儿子；改作“孙子”会把以撒与他们的实际关系代入原文措辞，削弱“他们像你，所以是你的儿子”这一逻辑。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免连续代词造成说话者混淆，在不改变指称的前提下补明“雅各”和“以撒”；保留两处“确实”所体现的确认语气。
