lexical_decisions:
- source_word: ወእርአዮ፡ ዘእንበለ፡ እሙት
  choice: 让我在死前见他一面
  rationale: 按短语语义译为临终前见某人；“一面”符合现代汉语习惯，并不增添实质意义。
- source_word: ኀበ
  choice: 到……那里
  rationale: 该介词在此表示趋向或抵达，译法自然且保留人物并列关系。
- source_word: ውስተ፡ ቤቱ፡ ለአቡሁ፡ አብርሃም
  choice: 进了他祖父亚伯拉罕的家
  rationale: 原文直译近于“在/进入他父亲亚伯拉罕的家”；这里的“父亲”指祖先或祖父。为避免现代汉语误以为亚伯拉罕是雅各的父亲，依亲属关系译作“祖父”，同时以“进了”表达 ውስተ 的进入/在内含义。
- source_word: ክልኤተ፡ እምውሉዱ
  choice: 两个儿子
  rationale: 原文为“他儿子中的两个”，汉语简洁表达为“两个儿子”。
- source_word: ሌዊሃ፡ ወይሁዳሃ
  choice: 利未和犹大
  rationale: 采用通行的圣经人物汉译名。
