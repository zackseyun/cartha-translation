  text: And he came to his father Isaac and to his mother Rebekah. And Rebekah came out from the chamber to the door of the chamber to kiss Jacob and embrace him, for her spirit had revived when...
translation:
  language: zh_hans
  text: 他来到父亲以撒和母亲利百加那里。利百加从内室出来，走到内室门口，要亲吻雅各，拥抱他，因为她的心神在……的时候恢复了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语正文在“……的时候”处结束，句意尚未完成；这里不补入原文未载明的后续内容。
    reason: 说明异常的未完句来自现存输入的经文边界，并保留በጊዜ作为时间连接语的功能。
lexical_decisions:
- source_word: ማኅፈድ
  choice: 内室
  rationale: 该词在本节连续出现两次，均译作“内室”，既符合住宅内部房间的语境，也保留原文刻意的重复。
- source_word: አንቀጸ
  choice: 门口
  rationale: 此处指内室的入口；“门口”比用于大型出入口的“门”或“城门”更自然。
- source_word: ትስዐሞ
  choice: 亲吻
  rationale: 直接表达亲吻这一动作，语体庄重而通俗。
- source_word: ትሕቀፎ
  choice: 拥抱他
  rationale: 保留动词的直接宾语，并与前面的“亲吻雅各”构成自然并列。
- source_word: መንፈሳ
  choice: 她的心神
  rationale: መንፈስ可指灵、气息或内在精神状态；此处描述利百加重新振作，译作“心神”既保留内在生命意味，又符合现代汉语。
- source_word: ሐይወ
  choice: 恢复了
  rationale: 原词表达重新活过来、复苏；与“心神”搭配译作“恢复了”，避免过度解释为某种特定情绪。
- source_word: በጊዜ
  choice: 在……的时候
  rationale: 此处引出时间从句，但所给吉兹语文本在连接词处截断；用未完成结构忠实保留原文边界，而不擅自补足后续事件。
theological_decisions:
- issue: “心神恢复”是否具有特定神学含义
  choice: 按人物内在生命或精神状态复苏来表达，不作教义化解释
  alternative: 译作“她的灵复活了”
  rationale: 上下文更适合一般性的恢复、振作之意；“灵复活了”容易引入原文未明确表达的复活教义色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“从内室出来，走到内室门口”保留同一吉兹语名词的重复。末句有意维持未完成状态，以反映所给原文在时间从句连接语处截断。
