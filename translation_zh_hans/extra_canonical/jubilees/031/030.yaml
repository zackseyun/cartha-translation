  text: And may he prosper all that you do, all for which you have prayed in prayer.” And he said to Rebekah, “Go with Jacob your son.” And Rebekah went with Jacob her son, and Deborah with her, and they came to
translation:
  language: zh_hans
  text: 愿他使你所做的一切，以及你祷告所求的一切，都亨通。”他对利百加说：“你和你儿子雅各一起去吧。”[a] 利百加就和她儿子雅各一同去了，底波拉也和她同行；他们来到……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给吉兹文电子文本在“你儿子”一词处疑有识别讹误；正文按“你儿子”译出。
    reason: 说明电子文本该处的字形异常及正文所采用的读法，不声称未提供的校勘依据。
lexical_decisions:
- source_word: ወይሥመር
  choice: 愿他使……亨通
  rationale: 该动词在此表达使事情顺利、兴盛之意；以祝愿式“愿他”保留原文未明说主语的第三人称祈愿语气。
- source_word: ለዘጸለይከ፡ ጸሎተ
  choice: 你祷告所求的一切
  rationale: 保留ጸለየ“祷告”的含义，不译作“许愿”；汉语不机械重复“祷告了祷告”，而以“祷告所求”自然表达同源宾语结构。
- source_word: ወልድኪ
  choice: 你儿子
  rationale: 按校勘所指的读法理解为“你的儿子”；所给电子文本中的ወአድኪ应为讹误或识别错误。
- source_word: ወዲቦራ፡ ምስሌሃ
  choice: 底波拉也陪着她
  rationale: 直义为“底波拉也与她同在/同行”；“陪着她”符合行程语境且保持人物关系。
- source_word: ወበጽሑ፡ ውስተ
  choice: 他们来到……
  rationale: 原文止于介词“进入/到……里面”，目的地留待下节；用省略号保留句子未完的状态，不擅自补足地点。
theological_decisions:
- issue: 祝愿句中第三人称主语的指称
  choice: 保留“他”，不在正文补作“上帝”
  alternative: 译作“愿上帝使……”
  rationale: 原文动词含第三人称主语，但本节所给文本未明说其名称；保留代词可避免把语境推定写进正文。
- issue: 祷告与许愿的区别
  choice: 译作“祷告所求”
  alternative: 译作“祷告中所许的愿”
  rationale: 原文使用表示祷告的词根，并无必须理解为许愿的词汇证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“亨通”准确承载祝愿某人所行顺利之意；末尾保留原文跨节形成的未完成句。
