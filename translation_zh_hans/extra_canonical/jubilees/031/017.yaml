base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/017.yaml
  text: May your table be full, and may your food not fail for all ages. And all who hate you shall fall before you, and all your adversaries shall be rooted out and perish. And the one who blesses you,
translation:
  language: zh_hans
  text: 愿你的桌席丰盛，你的食物世世代代都不缺乏。愿一切恨你的人都仆倒在你面前；愿你所有的仇敌都被连根拔除，归于灭亡。那祝福你的人，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在本节末尾尚未说完，谓语接在下一节。结合下一节可构成完整的祝福句：“愿祝福你的人蒙福。”
    reason: 说明原文跨节句法，并说明完整句意来自下一节，不将其表述为本节独立的异文或替代读法。
lexical_decisions:
- source_word: ማዕድከ፡ ምልእተ፡
  choice: 你的桌上丰盛
  rationale: 原文直指“你的桌子满盈”；中文用“桌上丰盛”自然表达食物充足，同时保留筵席与供应的意象。
- source_word: ወኢይሕፀፅ፡ እክልከ፡ ለኵሉ፡ ዓለማት።
  choice: 你的食物世世代代都不缺乏
  rationale: 保留“不缺乏”及涵盖一切时代的时间表达；“世世代代”符合祝福语体。
- source_word: ቅድሜከ፡ ይደቁ፡
  choice: 都仆倒在你面前
  rationale: 按原文空间关系和倒下之义直译，保留敌对者在受祝福者面前败落的图景。
- source_word: ይሠረዉ፡ ወይትሐጐሉ፡
  choice: 都被连根拔除，归于灭亡
  rationale: 分别呈现“拔除/根除”和“消亡/灭亡”两个并列动作，不将其合并弱化。
- source_word: ወዘይባርከከ፡
  choice: 那祝福你的人
  rationale: 本节原文仅有带定冠关系意义的主语短语，谓语延至下一节；中文保留悬接结构，避免提前补出“必蒙福”。
theological_decisions:
- issue: 本节末尾祝福者短语是否补足谓语
  choice: 保留“那祝福你的人”这一未完句，并以逗号承接下一节
  alternative: 译作“愿祝福你的人蒙福”
  rationale: 吉兹文在本节边界处只有“那祝福你的人”，谓语位于31:18；不应跨节补译而造成下一节谓语重复，也不应消除原有句法张力。
- issue: 祈愿语气与预言语气
  choice: 全节采用“愿……”，末句保持中性主语短语
  alternative: 将敌人败亡译成确定将来式“必……”
  rationale: 上下文是祝福辞，前部形式与语义宜以祈愿表达；这既符合汉语祝福语体，也不把原文强行系统化为绝对预言。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“桌上丰盛”避免生硬的“桌子满盈”；“仆倒”“连根拔除”“归于灭亡”保留原文的诗性力度。末尾用逗号明确显示句子延续至下一节，脚注标记已在正文中出现。
