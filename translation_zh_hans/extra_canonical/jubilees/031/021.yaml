  text: from the earth, and shall become accursed.” And he turned and kissed him again and embraced him, and he rejoiced greatly because
translation:
  language: zh_hans
  text: 从地上消失，并且他们必受诅咒。”他转过身来，又亲了他一次，拥抱他；他非常欢喜，因为——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምድር
  choice: 从地上
  rationale: 介词短语直译为“从地上”，承接上文谓语；本片段句首明显属于前句末尾。
- source_word: ወይኩኑ፡ ርጉማነ
  choice: 成为受诅咒的人
  rationale: 保留“成为”与表诅咒状态的复数/群体性表达，以自然汉语呈现其所指之人。
- source_word: ወተመይጠ፡ ሰዐሞ፡ ዳግመ
  choice: 他又转身亲吻他
  rationale: 依次保留“转身”“亲吻”“再次”的动作关系；“又”使现代汉语更顺畅。
- source_word: ወሐቀፎ
  choice: 拥抱他
  rationale: 按动词及其宾语后缀直译。
- source_word: ወተፈሥሐ፡ ዐቢየ
  choice: 他非常欢喜
  rationale: 以“非常”表达强化成分，保持庄重而自然。
- source_word: እስመ
  choice: 因为——
  rationale: 原文停在因果连词处，属于未完句；用破折号保留跨节延续感，不擅自补足原因。
theological_decisions:
- issue: 诅咒表达的施受关系
  choice: 成为受诅咒的人
  alternative: 成为咒诅
  rationale: 源文指向承受诅咒的对象或状态；所选译法不额外指定施咒者，也避免把人直接等同于抽象的“咒诅”。
- issue: 节末因果从句未完
  choice: 保留“因为——”
  alternative: 省略“因为”或从下一节补全
  rationale: 严格反映所给源文的边界与悬而未决的句法，不提前引入下一节内容。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语。由于本节所给吉兹文开头承接前文、结尾又以“因为”引出后文，译文保留两端的跨节句法；不添加脚注。
