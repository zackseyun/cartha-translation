  yaml_path: translation/extra_canonical/jubilees/031/018.yaml
  text: and cursed be every people that curses you.” And to Judah he said, “May the Lord give you strength and power, so that you may tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go about and travel through all the earth and its regions. Then nations shall fear before your face,”
translation:
  language: zh_hans
  text: “凡咒诅你的民，都必受咒诅。”他又对犹大说：“愿主赐你力量和刚强，使你可以践踏一切恨你的人。你和你的一位子孙要作雅各众子的统治者。愿你和你子孙的名流传、遍及全地和各地区；那时，列国必在你面前惧怕。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ
  choice: 民
  rationale: 该词在此指群体或人民；译作“民”既准确，也避免把含义限缩为现代民族国家。
- source_word: ኀይለ፡ ወጽንዐ
  choice: 力量和能力
  rationale: 保留原文并列结构，表达所赐的强健与威能，而不强行合并为一个概念。
- source_word: ትኪዶሙ
  choice: 践踏
  rationale: 直陈战胜、制伏仇敌的强烈意象，符合原文动作力度。
- source_word: መኰንነ
  choice: 统治者
  rationale: 该词表示掌权、治理者；“统治者”自然地保留政治治理意味。
- source_word: ዘየሐውር፡ ወዘያንሶሱ
  choice: 传遍、行遍
  rationale: 保留两个并列移动动词；结合主语“名”，用“传遍”表达名声流布，同时以“行遍”保留巡行、遍历之意。
- source_word: አሕዛብ
  choice: 列国
  rationale: 此处为复数，指众外邦或诸民族；“列国”符合庄重经文语体。
- source_word: እምቅድመ፡ ገጽከ
  choice: 在你面前
  rationale: 按字面保留“在你面前／从你面前”的空间与权威意象。
theological_decisions:
- issue: 犹大及其一位后裔的统治权
  choice: “你和你的一位子孙要作雅各众子的统治者”
  alternative: “你要作统治者，你的一个儿子也要统治雅各的众子”
  rationale: 原文句法可涉及犹大及其后裔共同或延续掌权；现译保留“一位子孙”的单数特征，不指明具体人物，也不加入弥赛亚身份解释。
- issue: 祝愿与预告的语气转换
  choice: 前句用“愿”，统治句用“要”，末句用“必”
  alternative: 全段统一译作祈愿语气
  rationale: 原文在祝福、命令式宣告和未来结果之间存在张力；译文依其句法推进保留这种变化，不将全段同质化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“咒诅”“践踏”“列国”“在你面前”等经文意象；避免古奥倒装和宗派性诠释。原文星号属于版本校勘标识，因未提供相应异文内容，正文不另设脚注。
