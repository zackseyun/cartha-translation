  naturalness: 译文总体庄重通顺。“凡咒诅你的民”及“列国必在你面前惧怕”自然合宜；“愿你和你子孙的名传遍、行遍”则搭配生硬，宜改为“流传、遍及”。
  terminology: “主”“咒诅”“践踏”“统治者”“雅各众子”“列国”均保持了适当的经文语体，且没有加入宗派性解释。“你和你的一位子孙”保留了原文单数和指涉上的开放性。
