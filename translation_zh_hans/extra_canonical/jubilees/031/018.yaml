revisions:
- from: “凡咒诅你的民，都必受咒诅。”他又对犹大说：“愿主赐你力量和能力，使你可以践踏所有恨你的人。你和你的一位子孙要作雅各众子的统治者。愿你和你子孙的名传遍、行遍全地及其各处；那时，列国必在你面前惧怕。”
  to: “凡咒诅你的民，都必受咒诅。”他又对犹大说：“愿主赐你力量和刚强，使你可以践踏一切恨你的人。你和你的一位子孙要作雅各众子的统治者。愿你和你子孙的名流传、遍及全地和各地区；那时，列国必在你面前惧怕。”
  rationale: 仅作必要的语言与语义微调：以“力量和刚强”更准确地对应原文的并列赐福；以“流传、遍及”替换不自然的“传遍、行遍”，保留原文双动词及“名”遍达全地和各地区的意象。其余句法及犹大与“一位子孙”的未定指涉维持不变。
