base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/020.yaml
  text: and in you shall the salvation of Israel be found. And on the day you sit on the throne of the glory of your righteousness[20], there shall be great peace for all the seed of the sons of the beloved. Blessed be the one who blesses you, and all who hate you and afflict you, and those who curse you, shall be rooted out and destroyed.
translation:
  language: zh_hans
  text: 在你里面，必能寻见以色列的拯救。到了你坐在你公义的荣耀之宝座上那日[a]，蒙爱者众子的一切后裔都必有大平安。祝福你的人有福了；凡恨你、苦害你和咒诅你的人，都必被连根拔除，归于灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句的属格结构紧密，也可较简洁地译作：“到了你坐在你公义的荣耀宝座上那日。”
    reason: 保留“荣耀”“公义”与“宝座”之间的句法关系及其可作较紧凑处理的余地。
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: 以色列的拯救
  rationale: 按名词结构直译，既可涵盖拯救的行动，也可指救恩，避免擅自限定其神学含义。
- source_word: ትነብር፡ ውስተ፡ መንበረ
  choice: 坐在……宝座上
  rationale: ትነብር 可表示坐、居住；与“宝座”连用时，现代汉语以“坐在……宝座上”最自然。
- source_word: ክብር
  choice: 荣耀
  rationale: 此处与宝座及公义相连，“荣耀”比“尊荣”更符合庄重的君王语境，同时保留源词的荣光与尊贵含义。
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: 蒙爱者众子的所有后裔
  rationale: 保留“后裔/种”和“众子”的层级，并将 ለፍቅር 按“蒙爱者”处理，不误译为“永远”。
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: 被连根拔除，归于灭亡
  rationale: 分别传达根除与毁灭、消亡两个连续意象。
theological_decisions:
- issue: “在你里面”与以色列拯救的关系
  choice: 在你里面，必能寻见以色列的拯救
  alternative: 以色列的救主必在你里面被寻见
  rationale: 源文的“拯救”是名词，不明确指某一位救主；因此不将其人格化或加入特定弥赛亚解释。
- issue: 宝座、荣耀与公义的密集属格结构
  choice: 你公义荣耀的宝座
  alternative: 你公义的荣耀宝座／你荣耀之公义的宝座
  rationale: 源文结构紧密且可有不同切分；正文采用可读而不额外增词的表达，并以脚注保存歧义。
- issue: “蒙爱者”的所指
  choice: 蒙爱者
  alternative: 所爱的人
  rationale: 源文未明确所爱者的身份，不将其具体认定为某位先祖、以色列或弥赛亚。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语；以“必”“有福了”“连根拔除”等保持祝福宣告的经文语体，同时避免生硬仿古。“蒙爱者众子的所有后裔”略显密集，但有意保留原文亲属层级。
