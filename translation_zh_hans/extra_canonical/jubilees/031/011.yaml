lexical_decisions:
- source_word: አማን
  choice: 真是
  rationale: 表达“确实、实在”的肯定语气；放在现代汉语判断句中自然庄重。
- source_word: ውሉድየ
  choice: 我的孩子
  rationale: 忠实体现“孩子”与第一人称领属关系；不额外限定性别或人数。
- source_word: ወቀርቡ፡ ኀቤሁ
  choice: 他们走近他
  rationale: 对应“他们来到／靠近他那里”，采用自然现代汉语表达。
- source_word: ወተመይጠ
  choice: 他便转过身来
  rationale: 保留原文明确的转身动作，并以“便”顺接叙事。
- source_word: ወሰዐሞሙ፡ ወሐቀፎሙ
  choice: 亲吻他们，拥抱他们
  rationale: 逐项保留亲吻与拥抱两个动作及其共同宾语。
