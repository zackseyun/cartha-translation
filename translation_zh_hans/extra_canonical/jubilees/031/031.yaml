  text: Bethel. And Jacob remembered the prayer with which his father had blessed Levi and Judah, and he rejoiced and blessed the God of his fathers Abraham and Isaac. And he said, “Now I know that I have an everlasting hope, and my children also, before the God of all.” And thus it was ordained concerning the two of them, and it was recorded for them as an everlasting, righteous testimony on the heavenly tablets, just as Isaac blessed them.
translation:
  language: zh_hans
  text: 伯特利。雅各想起他父亲为利未和犹大祝福时所作的祷告，就欢喜，并称颂他列祖亚伯拉罕和以撒的上帝。他说：“如今我知道，在万有的上帝面前，我有永远的盼望，我的子孙也有。”关于他们二人的事就这样定下了；正如以撒祝福他们一样，这事作为他们永远而公义的见证[a]，被记载在天上的版上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或略作：“永恒的见证”；这种略译未显出“公义”。
    reason: 保留既有较简译法的信息，同时说明正文按源文保留“公义”。
  - marker: b
    text: 或译：“这事被记录下来”。
    reason: 源文动词为单数；此处所记载的是所定之事或该见证，而非他们二人本身。
lexical_decisions:
- source_word: ተፈሥሐ
  choice: 欢喜
  rationale: 准确表达该动词“喜乐、欢欣”的意思，语体自然庄重。
- source_word: ባረኮ፡ ለአምላከ
  choice: 称颂……上帝
  rationale: 此处上帝是祝颂行为的对象；“称颂”比“祝福上帝”更符合现代汉语宗教语境。
- source_word: ተስፋ፡ ዘለዓለም
  choice: 永恒的盼望
  rationale: 保留“盼望”与“永恒”的直接搭配，不把其具体所指解释为某种特定救恩教义。
- source_word: በቅድመ፡ አምላከ፡ ኵሉ
  choice: 在万有的上帝面前
  rationale: 形式上保留“在……面前”以及“万有之上帝”的普遍性称号。
- source_word: ሥሩዕ
  choice: 定下了
  rationale: 表达“被规定、被设立”的被动含义，同时避免生硬的行政措辞。
- source_word: በስምዕ፡ ዘለዓለም
  choice: 作为永恒而公义的见证
  rationale: 依据经审核的源文校勘信息保留“见证”“永恒”以及“公义”的完整语义。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版
  rationale: 直译“天之版/天上的版”，保留《禧年书》特有意象，不擅自具体化材质。
theological_decisions:
- issue: “永恒的盼望”的对象与内容
  choice: 不补明盼望的具体内容
  alternative: 解释为永生、救恩或圣约应许
  rationale: 源文只说有永恒的盼望；补入具体神学内容会消除原有开放性。
- issue: 关于利未和犹大的天上记录究竟记录什么
  choice: 以“这事”及“见证”为单数所指，译作“为他们记录”
  alternative: 译成“他们二人被记录”
  rationale: 经审核的动词形态为第三人称阳性单数，更可能指所定之事或见证被记录，而不是二人本身被记录。
- issue: 公义与见证的关系
  choice: “永恒而公义的见证”
  alternative: “永恒的公义见证”或仅“永恒的见证”
  rationale: 既保留“公义/正直”这一源文成分，也不将其过度解释为法庭判决或归算之义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“称颂上帝”“在……面前”“天上的版”等表达保留古代宗教文本的郑重感。所给吉兹语行从“和犹大”附近起，正文开头“伯特利。雅各想起……祷告”主要由经审校的英文咨询层补足；吉兹语可直接核验的主体内容从“就欢喜”开始。所有脚注标记均已置于正文。
