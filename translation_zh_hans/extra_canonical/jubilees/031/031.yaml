revisions:
- from: 伯特利。雅各想起他父亲为利未和犹大祝福时所作的祷告，就欢喜，并称颂他祖先亚伯拉罕和以撒的上帝。他说：“如今我知道，在万有的上帝面前，我和我的子孙都有永恒的盼望。”关于他们二人，这事就这样定下了，并照以撒为他们所祝的福，作为永恒而公义的见证[a]，为他们记录[b]在天上的版上。
  to: 伯特利。雅各想起他父亲为利未和犹大祝福时所作的祷告，就欢喜，并称颂他列祖亚伯拉罕和以撒的上帝。他说：“如今我知道，在万有的上帝面前，我有永远的盼望，我的子孙也有。”关于他们二人的事就这样定下了；正如以撒祝福他们一样，这事作为他们永远而公义的见证[a]，被记载在天上的版上[b]。
  rationale: 修订仅解决末句的汉语句法及单数所指：以“这事”承接“关于他们二人的事”，用“被记载”对应单数被动意义，并将“为他们”自然落实为“作为他们……的见证”。同时以“列祖”优化庄重语域；其余内容保持原译的语义范围与不确定性。
