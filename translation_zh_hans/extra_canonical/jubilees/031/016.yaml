revisions:
- from: 上帝要把话赐在他们口中，使他们祝福蒙爱之人的一切后裔。至于你，你母亲给你起名叫利未；她这样给你起名，实在名副其实。[a]你必与主联合，作雅各众子的同伴。他的席要归你，你和你的子孙都要吃席上的食物。你的席必为世世代代丰盛满盈。
  to: 愿上帝把话放在他们口中，使他们祝福蒙爱之人的一切后裔。至于你，你母亲给你起名叫利未；她给你起这名，确实恰如其分。[a]你必与主联合，作雅各众子的同伴。让他的席归你；你和你的子孙都要从那里吃。你的席必世世代代丰盛满盈。
  rationale: 修订保留原译对母亲主语、命名说明、代词歧义及“世世代代”的处理；仅将开头调整为较贴合原文祈愿语气的现代汉语，并润饰席筵相关措辞和末句句法，未改变经文意义或增添教义解释。
