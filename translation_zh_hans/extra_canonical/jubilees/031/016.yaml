base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/016.yaml
  text: that they may bless all the seed of the beloved. Your mother called your name Levi, and truly did she call your name. You shall be joined to the Lord and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,
translation:
  language: zh_hans
  text: 愿上帝把话放在他们口中，使他们祝福蒙爱之人的一切后裔。至于你，你母亲给你起名叫利未；她给你起这名，确实恰如其分。[a]你必与主联合，作雅各众子的同伴。让他的席归你；你和你的子孙都要从那里吃。你的席必世世代代丰盛满盈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利未”这个名字在此与下句“联合”相呼应。
    reason: 帮助读者看出原文命名说明与后文之间的文字关联，而不把该关联扩展为额外教义。
lexical_decisions:
- source_word: ይትወሀብ፡ ውስተ፡ አፉሆሙ
  choice: 要把话赐在他们口中
  rationale: 原文直译为“赐在他们口中”；汉语补出“话”，自然表达上帝使他们开口祝福之意，而不把内容扩成特定的神谕。
- source_word: ኵሎ፡ ዘርአ፡ ለፍቅር
  choice: 蒙爱之人的一切后裔
  rationale: 保留“后裔/种子”这一集体性表达，并将属格结构自然译出；不擅自认定“蒙爱之人”的具体身份。
- source_word: እምከ፡ ስመከ፡ ሌዊን፡ ወበአማን፡ ጸውዑት፡ ስመከ
  choice: 你母亲给你起名叫利未；她这样给你起名，实在名副其实
  rationale: 明确保留“你母亲”这一主语；በአማን 表示“确实、真实”，结合下句“联合”所形成的命名呼应，译作“名副其实”。
- source_word: አጸቶ፡ ለእግዚአብሔር
  choice: 与主联合
  rationale: 保留原文的联合意象，也维持其与“利未”之名之间可能存在的语义呼应。
- source_word: ማእዳ
  choice: 席
  rationale: 此词可指桌席或筵席；“席”既能表达共享食物，也避免过度具体化为家具或仪式。
- source_word: ትምላእ
  choice: 丰盛满盈
  rationale: 表达“充满”的结果状态；与“席”搭配时，“丰盛满盈”比机械直译“被装满”更符合现代汉语。
theological_decisions:
- issue: “他的席”中代词所指
  choice: 保留“他的席”
  alternative: 译为“主的席”
  rationale: 上文最近的单数指称是“主”，但原文使用代词；保留代词可避免把潜在指向完全锁定。
- issue: “蒙爱之人”的身份
  choice: 不注明具体人物
  alternative: 明确译为“亚伯拉罕/雅各的后裔”
  rationale: 原文短语本身未在本节中明说所指，应保留其称号性质和解释空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赐在他们口中”“与主联合”等关键意象尽量贴近原文；叙事部分则用自然的现代措辞。“子孙”按上下文表达延续的后代，“世世代代”依据完整经文末尾所含“世代”译出。
