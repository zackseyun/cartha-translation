    rationale: 原文可表达“并且／当他来时”的时间性连接；在代词指向和句法关系均不完全明朗处，不宜以“好让”限定为目的。
  - severity: low
    issue: “扶上”将登乘动作具体化为搀扶。
    rationale: 原文表达使某人上到驴/牲畜上；“让……骑上”或“扶……上”皆可通，但“扶”额外暗示身体搀扶，宜用较中性的“让……骑上”。
  - severity: low
    issue: 末句“让你母亲骑上牲口”可更直接体现使役动作。
    rationale: “扶你母亲上牲口”自然地表达把母亲安置到牲畜上，同时不把动作误解为母亲自行骑乘。
