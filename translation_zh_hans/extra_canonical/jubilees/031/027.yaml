  text: he had prayed, and when he came, he might set him on a donkey. And Isaac said to Jacob his son, “I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred sixty-five years old today. I am no longer able to travel. Set your mother on a beast and let her go."”
translation:
  language: zh_hans
  text: 他祷告了；等他来时，可以让他骑上驴。[a]以撒对他儿子雅各说：“我不能和你一起去，因为我老了，经不起路途劳顿。去吧，我儿，愿你平安！今天我已经一百六十五岁，不能再出门远行了。扶你母亲上牲口，然后你去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句中的两个“他”在原文里都没有明确指出所指的人；“等他来时，可以让他骑上驴”也可译作“他来时，就让他骑上驴”。
    reason: 保留代词指向以及未完成式/虚拟语气和连接关系的歧义。
lexical_decisions:
- source_word: ጸለየ
  choice: 祷告了
  rationale: 该动词通常意为“祷告”，不译作“许愿”。
- source_word: ይጽዐኖ፡ ዲበ፡ አድግ
  choice: 可以把他扶上驴
  rationale: 保留未完成式/虚拟语气的可能或目的色彩；አድግ在此明确指“驴”。
- source_word: ተዐግሦ፡ በፍኖት
  choice: 经不起路途劳顿
  rationale: 自然表达“在路上忍受、支撑”的含义，符合年老体衰的语境。
- source_word: ነጊደ
  choice: 出门远行
  rationale: 表达旅行、上路之意，并与前句的“路途”呼应。
- source_word: ጻዐና፡ ለአምካ
  choice: 让你母亲骑上牲口
  rationale: 保留“你母亲”这一明确宾语；汉语以“骑上牲口”自然表达使其乘上驮畜。
- source_word: ወትሖር
  choice: 你就去吧
  rationale: 动词为第二人称单数，所指是雅各去，而非仅仅“让她去”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“愿你平安”保留祝福语气；“牲口”在末句对应泛指的驮畜，不擅自限定为驴。
