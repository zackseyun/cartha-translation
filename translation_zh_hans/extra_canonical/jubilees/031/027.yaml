revisions:
- from: 他祷告了，好让他来到时，可以把他扶上驴。[a] 以撒对他儿子雅各说：“我不能和你一起去，因为我老了，经不起路途劳顿。去吧，我儿，愿你平安！今天我已经一百六十五岁，不能再出门远行了。让你母亲骑上牲口，你就去吧。”
  to: 他祷告了；等他来时，可以让他骑上驴。[a]以撒对他儿子雅各说：“我不能和你一起去，因为我老了，经不起路途劳顿。去吧，我儿，愿你平安！今天我已经一百六十五岁，不能再出门远行了。扶你母亲上牲口，然后你去吧。”
  rationale: 修订首句，避免“好让”所造成的目的关系，并以“让他骑上驴”保留原文较中性的使役/登乘含义。末句改为“扶你母亲上牲口”，更清楚地对应把母亲安置在牲畜上的命令；仍保留末尾命令的对象是雅各。
