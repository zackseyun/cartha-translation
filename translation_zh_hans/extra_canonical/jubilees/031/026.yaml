base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/026.yaml
  text: And in the morning Jacob told his father Isaac the prayer that he had prayed to the Lord[26], and the vision that he had seen, and how he had built an altar, and that everything was prepared for the sacrifice to be offered before the Lord.
translation:
  language: zh_hans
  text: 到了早晨，雅各把自己向主所作的祷告[a]、所看见的异象、他怎样筑了一座祭坛，以及为在主面前献祭而预备的一切都已齐备的事，都告诉了父亲以撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文使用与“祷告”有关的词语；不过，结合伯特利、祭坛、献祭，以及以撒告诫他不可耽延的上下文，这里也可能是指雅各所许的愿。
    reason: 保留原文字面意义与上下文所支持的另一种理解。
lexical_decisions:
- source_word: ጸሎተ፡ ዘጸለየ
  choice: 所作的祷告
  rationale: 原文使用同根的祷告用语，直译义为“他所祷告的祷告”；中文以“所作的祷告”自然表达，同时保留其基本词义。
- source_word: ሬአየ፡ ዘርእየ
  choice: 所看见的异象
  rationale: 结合名词与同根动词的结构及叙事语境，译为自然的“所看见的异象”。
- source_word: ኀነጸ፡ ምሥዋዐ
  choice: 筑了一座祭坛
  rationale: “建造”与“祭坛”搭配，现代中文惯用“筑了一座祭坛”。
- source_word: ኵሉ፡ ድልው
  choice: 一切也都已预备妥当
  rationale: 保留“全部”和“准备好”的含义，并以现代中文流畅表达。
- source_word: መሥዋዕት፡ ለገቢር፡ ቅድመ፡ እግዚአብሔር
  choice: 要在主面前献上祭物
  rationale: 按原文“祭物/祭献—施行—在主面前”的关系表达献祭行动，避免生硬重复。
theological_decisions:
- issue: 此处所述是“祷告”还是“许愿”
  choice: 正文译作“祷告”，脚注说明语境可能指向许愿
  alternative: 正文译作“所许的愿”
  rationale: 吉兹语明确采用祷告词根，正文应优先反映现存原文；但伯特利、祭坛、祭物以及上下文关于不可耽延的内容，使“许愿”成为值得保留的语境性理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“向主所作的祷告”贴近原文又避免同根词机械重复；用分号梳理较长并列结构。所给吉兹语末尾有“如同/照着”之类的连接词，但在本节引文中没有后续成分，故未在中文正文保留悬空连接语。
