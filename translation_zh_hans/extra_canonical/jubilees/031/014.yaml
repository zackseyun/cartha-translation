revisions:
- from: 以及你的儿女，直到万世。愿主赐给你和你的后裔极大的悟性[a]，使他们得享荣耀。愿他从一切有血肉的当中，使你和你的后裔亲近他，在他的圣所中供职，如同侍立在他面前的天使和众圣者一样。他们如何，你儿女的后裔也必如何，得享荣耀和尊大。
  to: 以及你的儿女，直到万世。愿主赐给你和你的后裔极大的悟性[a]，使你和你的后裔得荣耀。愿他从一切有血肉的当中，使你和你的后裔亲近他，在他的圣所中供职，如同侍立在他面前的天使和众圣者一样。他们如何，你儿女的后裔也必如何，得享荣耀和尊大。
  rationale: 仅作两项安全修订：明确“荣耀”祝福涵盖“你和你的后裔”，并使脚注的替代译法更贴近“greatness of heart”。其余措辞保留原译对源文结构、圣所语域和末句类比的准确处理。
