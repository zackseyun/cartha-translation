  yaml_path: translation/extra_canonical/jubilees/031/014.yaml
  text: and your children throughout all the ages. And may the Lord give to you and to your seed great understanding for glory. And may he bring you and your seed near to him from among all flesh, to minister in his sanctuary like the angels of the presence and like the holy ones. As they are, so shall the seed of your children be for glory and greatness
translation:
  language: zh_hans
  text: 以及你的儿女，直到万世。愿主赐给你和你的后裔极大的悟性[a]，使你和你的后裔得荣耀。愿他从一切有血肉的当中，使你和你的后裔亲近他，在他的圣所中供职，如同侍立在他面前的天使和众圣者一样。他们如何，你儿女的后裔也必如何，得享荣耀和尊大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或理解为“伟大的心”。
    reason: 原短语中的名词主要表示“悟性、理解力”，但源自“心”这一词根；此处保留较贴字面的替代理解。
lexical_decisions:
- source_word: ዓለማት
  choice: 万世
  rationale: 该词为“时代、世代”的复数；“直到万世”自然表达延续于所有世代之意。
- source_word: ዐባየ፡ ልባዌ
  choice: 极大的悟性
  rationale: ልባዌ 是由“心”相关词根形成的名词，主要表示理解力、悟性；保留“大”的强化意义，并以脚注说明较贴近词源的另一理解。
- source_word: ያቅርብ፡ ኀቤሁ
  choice: 使……亲近他
  rationale: 保留使役动词“带近、使接近”及其敬拜与拣选语境，不扩展为未经原文明说的特定职分。
- source_word: ይትአለክ፡ ውስተ፡ መቅደሱ
  choice: 在他的圣所中供职
  rationale: 该动词在圣所语境中指事奉或执行职务；“供职”比泛泛的“服侍”更能体现礼仪性语域。
- source_word: መላእክተ፡ ገጽ
  choice: 侍立在他面前的天使
  rationale: 字面为“面前（或临在）的天使”；此译保留其在神面前侍立的含义，同时符合现代汉语表达。
- source_word: ለክብር፡ ወለዐቢይ
  choice: 得享荣耀和尊大
  rationale: 分别对应“荣耀”与“伟大、尊大”；“尊大”在庄重语体中比“伟大”更适合此祝福语境。
theological_decisions:
- issue: “从一切有血肉的当中”所表达的群体区别
  choice: 从一切有血肉的当中，使你和你的后裔亲近他
  alternative: 使你和你的后裔比一切有血肉的更亲近他
  rationale: 原文表达从众人之中带近或选召出来，并未明确作程度比较，因此不译成“更亲近”。
- issue: “如同……一样”是否表示身份完全相同
  choice: 保留类比表达，不称其成为天使或圣者
  alternative: 使他们成为天使和圣者
  rationale: 原文用比较结构，说明其圣所供职或荣耀状态相似，不足以断定本体身份发生改变。
- issue: 末句“他们如何……也必如何”的指代
  choice: 让“他们”自然回指天使和众圣者
  alternative: 明确补写“那些天使和圣者怎样”
  rationale: 原文保留代词式回指；正文维持这种简洁性，避免加入额外解释。
translation_notes:
  register: 采用现代、庄重且易懂的祝福语体。“供职”“圣所”“众圣者”等词保持礼仪场景的庄严感；避免以特定宗派术语解释“亲近”或天使类比。
