lexical_decisions:
- source_word: ለክልኤሆሙ፡ ኀቡረ
  choice: 他们二人在一起
  rationale: 明确保留“二人”与“一起”的双重信息，并采用自然的现代汉语表达。
- source_word: መንፈሰ፡ ትንቢት
  choice: 预言的灵
  rationale: 形式上贴近源文，保留“灵”与“预言”的属格关系，不将其解释性改写为“说预言的能力”。
- source_word: ወረደ፡ ውስተ፡ አፉሁ
  choice: 降到他口中
  rationale: 保留源文具体而不寻常的身体意象，不淡化为“临到他”。
- source_word: ወአንዘ፡ ለሌዊ፡ በየማናዊ
  choice: 他用右手拉住利未
  rationale: 按该句及校订参照层所表达的动作处理；“拉住”比单纯“拿”更适合汉语中以手抓住人的语境。
theological_decisions:
- issue: “预言的灵”的所指
  choice: 保留“预言的灵”
  alternative: 译作“先知之灵”或“说预言的能力”
  rationale: 源文允许将其理解为带来预言的灵；直译可保留其神学开放性，避免预先界定为人格性存在或抽象能力。
