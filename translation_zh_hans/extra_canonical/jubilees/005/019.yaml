  yaml_path: translation/extra_canonical/jubilees/005/019.yaml
  text: But for all those who corrupted their ways and their plans before the Flood[a], no favor was shown, except to Noah alone; for favor was shown to him on behalf of his sons, whom he saved from the waters of the Flood because of him, since his heart was righteous in all his ways, according to what had been commanded concerning him, and he did not deviate from anything that had been appointed for him.
translation:
  language: zh_hans
  text: 然而，所有在洪水以前[a]败坏了自己道路和谋算的人，都没有蒙恩；惟独挪亚一人例外。因为为着他的儿子们，他蒙了恩[b]；他的儿子们也因着他得以从洪水中获救。因为他的心在自己一切道路上正直；他照着所吩咐他的而行，凡为他所定的，他一点也没有偏离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在洪水以前”所对应的原文短语较难确定，其中涉及“洪水”；这里按上下文理解为：在那一代人中，除了挪亚以外，没有人得到恩待。
    reason: lexical_alternative
  - marker: b
    text: 这里的表达也可理解为“为了他的儿子们”或“代表他的儿子们”。它说明向挪亚施的恩与其儿子们的得救有关；下句明确说，他们是因着挪亚获救。
    reason: semantic_ambiguity
lexical_decisions:
- source_word: አማሰኑ፡ ፍኖዊሆሙ፡ ወምክርሙ
  choice: 败坏了自己道路和谋算
  rationale: 分别保留“道路”与“谋算”两个并列概念；“败坏”准确表达使其腐坏、败坏之意。
- source_word: ኢተነሥአ፡ ገጾሙ / ተነሥአ፡ ሎቱ፡ ገጸ
  choice: 没有蒙恩／蒙了恩
  rationale: 原文直译近于“面容没有被举起／面容为他被举起”，在此表达获得有利看顾或恩待；用“蒙恩”自然且与上下文相称，避免译作带负面意味的“偏袒”。
- source_word: በእንተ፡ ውሉዱ
  choice: 为自己众子的缘故
  rationale: 此处介词结构指向挪亚所得恩待惠及众子；采用“为……的缘故”保留目的、关涉或代表性含义，不误解为众子是挪亚蒙恩的原因。
- source_word: ጻድቅ፡ ይእቲ፡ ልቡ
  choice: 他的心……是正直的
  rationale: 保留“心”及“正直／公义”的伦理判断；在描述行事道路的语境中，“正直”较自然。
- source_word: ኢተዐደወ
  choice: 一点也没有偏离
  rationale: 表达越界、偏离之意，并与后面的“一切所定的”自然搭配。
theological_decisions:
- issue: 挪亚蒙恩与众子获救之间的因果关系
  choice: 挪亚为众子的缘故蒙恩；众子因着挪亚获救
  alternative: 挪亚因为众子而蒙恩
  rationale: 相邻两个介词结构应加以区分；后句明确说众子“因着他”从洪水中获救，因此前句不宜暗示众子是挪亚蒙恩的功德原因。
- issue: 挪亚的正直与顺服
  choice: 并列保留内在正直、遵行吩咐和不偏离所定之事
  alternative: 将其概括为挪亚完全无罪
  rationale: 原文称其心正直并忠于所命定的道路，却没有作抽象的绝对无罪宣告；译文不扩大神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙恩”延续圣经文体但仍为现代读者熟悉；以分号和句号拆分较长的吉兹语句，保持逻辑层次。所有脚注标记均已置于正文相应位置。
