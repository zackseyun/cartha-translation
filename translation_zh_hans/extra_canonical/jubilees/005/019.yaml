  rationale: 修订避免把“为着他的儿子们”误读为儿子们是挪亚蒙恩的功劳原因，并将“儿子们因着他获救”的因果关系单列清楚。末段调整为两个明确分句，使“心正直”“照命而行”和“不偏离所定的”各自清晰，同时不扩大原文的神学断言。
