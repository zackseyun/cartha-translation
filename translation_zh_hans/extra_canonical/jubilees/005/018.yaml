  text: It has been written and ordained that mercy will be shown to all who turn from all their error[a], once each year.
translation:
  language: zh_hans
  text: 这已经写明并定下：凡转离自己一切过错的人，每年一次必蒙怜悯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每年一次”可能反映《禧年书》关于周期性赎罪或施怜悯的历法观念。这里保留原文明确的说法，不将其笼统译为“定期”。
    reason: cross_reference
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  choice: 已经写明并定下
  rationale: 分别体现“被写下”和“被规定、设定”的完成意义，同时保持庄重而自然的现代汉语表达。
- source_word: ይትመሐር፡
  choice: 必蒙怜悯
  rationale: 采用不明说施怜悯者的被动式，贴近原文形式，也避免擅自补出主语。
- source_word: እለ፡ ተመይጡ፡ እም*ኵሉ፡ ጌጋዮሙ፡
  choice: 凡转离自己一切过错的人
  rationale: 保留“转离”的悔改意象，并将集合性的“他们的全部过错”译为自然汉语。
- source_word: ምዕረ፡ ለ*ለ፡ ዓመት።
  choice: 每年一次
  rationale: 明确保留原文的年度频次，而不笼统处理为“定期”或“年年”。
theological_decisions:
- issue: 施怜悯者是否应明确为上帝
  choice: 采用“蒙怜悯”，不明说施事者
  alternative: 译作“上帝必怜悯”或“他必怜悯”
  rationale: 原文使用被动表达；保留未明说的施事者，可避免加入原文没有显明陈述的神学主语。
- issue: “每年一次”的历法含义
  choice: 在正文中直译，并以脚注提示可能关联
  alternative: 概括为“年年”或直接解释为赎罪日
  rationale: 原文明确表达年度一次，但没有在本节直接点明具体节期；因此保留措辞及其解释空间。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“转离”保留原文的方向性意象；“必蒙怜悯”既自然，也保留原文未明说施事者的被动结构。
