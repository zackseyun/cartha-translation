base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/016.yaml
  text: And he is not one who shows partiality, nor one who accepts a bribe, when he says that he will execute judgment on each. Even if one gave everything that is on the earth, he would not show partiality or accept it, nor would he receive anything from his hand, for he is a righteous judge.
translation:
  language: zh_hans
  text: 他不偏袒人，也不受贿；当他说要逐一地施行审判时，即使有人献上地上的一切，他也不偏袒，也不接受所献之物，也不从那人手中收取任何东西，因为他是公义的审判者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘይነሥእ፡ ገጸ
  choice: 偏袒人的
  rationale: 该表达直译涉及“取面/接受面孔”，在审判语境中是“不徇情、不看情面”的惯用义；译为“偏袒”自然且准确。
- source_word: ዘይነሥእ፡ ሕሊና
  choice: 受贿的
  rationale: ሕሊና 在这里指影响审判的赠礼，司法语境下译作“贿赂”比笼统的“礼物”更能传达其负面含义。
- source_word: ይገበር፡ ዘንተ፡ ለለ፻፻
  choice: 逐一施行审判，就必如此
  rationale: 保留对每一个个体分别执行所宣告之判决的意思；“就必如此”承接“他说”，使现代汉语通顺。
- source_word: ኢይትሜጠው፡ እምእዴሁ
  choice: 不会从那人手中收取任何东西
  rationale: ይትሜጠው 表示领取、拿取或接受；不采用“受其左右”，以免加入原文没有的因果解释。
- source_word: መኰንን፡ ጽድቅ
  choice: 公义的审判者
  rationale: 直接表达“义/公义”与“审判者”的组合，符合庄重的现代汉语宗教文体。
theological_decisions:
- issue: 神圣审判是否可被财物改变
  choice: 明确表达即使献上地上一切，审判者也不偏袒或收受任何东西
  alternative: 将末句解释为“不受献礼者左右”
  rationale: 原文强调审判者的公义与不可贿赂性；按动词本义译成“收取”，不把结果进一步解释成“受左右”。
- issue: “他说”与执行审判之间的语气关系
  choice: 译为“既说……就必如此”
  alternative: 译为条件式“如果他说……”或时间式“当他说……”
  rationale: 上下文表达其宣告审判后的确定执行；汉语用“既……就……”既自然，也避免误读为不确定条件。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“偏袒”“受贿”“逐一施行审判”适合司法语境；避免古奥直译及宗派化术语。原文后半连续否定略有重复，译文保留其强调作用，同时补出“任何东西”以完整表达及物动词的隐含宾语。
