  text: And he destroyed all from their places, and not one of them remained whom he had not judged according to all their wickedness.
translation:
  language: zh_hans
  text: 他把他们全都从他们所在之处除灭；他们中没有一个留下而未曾按自己一切的恶行受他审判。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወደምሰሰ
  choice: 他……除灭
  rationale: 该动词表达毁灭、消灭之意；“除灭”既保留审判语境的力度，也符合庄重的现代汉语。
- source_word: ኵሉ እመካኖሙ
  choice: 把他们全都从原处
  rationale: 依原文保留“全部”与“从他们的地方／所在之处”的空间含义；译作“从原处”较自然，但不额外指明被逐出还是就地毁灭。
- source_word: ወኢተርፈ አሐዱ እምኔሆሙ
  choice: 他们中没有一个留下
  rationale: 直接呈现“其中一人也未剩下”的绝对性。
- source_word: ዘአኰነነ
  choice: 人人都……受了审判
  rationale: 原结构直译近于“没有一个留下，是他未曾审判的”；汉语改用总括表达，保持所有人均被审判的含义。
- source_word: በኵሉ እኪዮሙ
  choice: 按自己一切的恶行
  rationale: 保留“按照／依据”及“他们全部的恶”的审判尺度；“恶行”比抽象的“邪恶”更贴合按行为受审的自然汉语表达。
theological_decisions:
- issue: 毁灭与审判的关系
  choice: 并列呈现除灭与按恶行受审
  alternative: 把毁灭直接解释为审判的执行结果
  rationale: 原文同时陈述毁灭和审判，却未明确界定二者的逻辑或时间关系，因此不作额外神学推断。
- issue: 审判对象是否有例外
  choice: 用“没有一个”与“人人都”明确无一例外
  alternative: 仅笼统译作“他们都受审判”
  rationale: 原文以否定式关系结构强调不存在未经审判者，译文保留这一强调。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“除灭”“受了审判”适合古代宗教叙事语域；以分号连接两个紧密相关但逻辑关系未被原文明说的分句。
