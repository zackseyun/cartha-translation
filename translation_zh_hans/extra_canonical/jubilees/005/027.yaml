  text: 水停留在地面上五个月，共一百五十天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማያት
  choice: 水
  rationale: 该词为“水”的复数形式；现代汉语通常用集合名词“水”，无需机械体现复数。
- source_word: ይቀውም
  choice: 停留
  rationale: 表达水持续处于地面之上的状态；“停留”自然地传达持续意义，又不额外解释为水势不动或不退。
- source_word: ዲበ፡ ገጸ፡ ምድር
  choice: 在地面上
  rationale: 直译为“在大地的表面上”；“在地面上”简洁自然，并保留空间关系。
- source_word: ኃምስተ፡ አውራኀ፡ ምእተ፡ ወኃምሳ፡ ዕለተ
  choice: 五个月，共一百五十天
  rationale: 忠实保留两个并列的时长表达；加入“共”使现代汉语明确后者是对前者的天数说明，而非额外相加。
