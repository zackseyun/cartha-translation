  yaml_path: translation/extra_canonical/jubilees/005/015.yaml
  text: Concerning all, he will judge the great according to his greatness, and the small according to his smallness, and each one according to his way.
translation:
  language: zh_hans
  text: 至于众人，他要按大者之大、小者之小、各人自己的道路施行审判。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይኴንኖ
  choice: 他要审判
  rationale: 该动词在此表示施行审判；保留第三人称单数主语，不擅自补明其身份。
- source_word: ለዐቢይ በከመ ዐበየ
  choice: 大者按其大
  rationale: 尽量保留原文“大／大”的词根呼应及衡量关系，不具体化为财富、地位或罪责。
- source_word: ለንኡስሂ በከመ ንእሰ
  choice: 小者按其小
  rationale: 与前句构成平行，保留“小／小”的概括性与原文可能存在的语义张力。
- source_word: ለለ አሐዱ በከመ ፍኖቱ
  choice: 各人按自己的道路
  rationale: ፍኖት意为道路、行路方式，也可引申为行为；译作“道路”既贴近原词，也保留其比喻意义。
theological_decisions:
- issue: 审判者身份
  choice: 使用“他”，不在本节补作“上帝”
  alternative: 上帝要审判
  rationale: 原文只有第三人称单数动词形式；虽可由上下文识别审判者，单节翻译不应将隐含主语明说。
- issue: 按大小施行审判的含义
  choice: 保留“大者按其大，小者按其小”
  alternative: 位高者按其地位，卑微者按其卑微
  rationale: 原文没有明确“大、小”所指的是身份、能力、责任还是罪行，因此不消除其真实歧义。
translation_notes:
  register: 采用庄重而简洁的现代汉语。“大者／小者”保持对称，“各人按自己的道路”自然可懂，同时保留古代审判语境中的比喻表达。
