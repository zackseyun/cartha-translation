  text: 方舟前行，停在亚拉腊群山之一的路巴山顶上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሖረት
  choice: 漂去
  rationale: 该动词基本义为“行走、前去”；用于方舟时译作“漂去”，既符合洪水语境，也保留其移动之意。
- source_word: ታቦት
  choice: 方舟
  rationale: 在洪水叙事中指挪亚的舟，采用现代中文圣经语境中通行的“方舟”。
- source_word: አዕረፈት
  choice: 停在
  rationale: 原词表示“歇息、停住”；此处描述方舟停止移动并落定，译为“停在”自然准确。
- source_word: ርእሰ
  choice: 山顶
  rationale: 字面为“头、顶端”，在山岳语境中指山顶。
- source_word: ሉባር
  choice: 路巴山
  rationale: 专名音译为“路巴”，并依上下文补出“山”，使中文所指清楚。
- source_word: አሐዱ፡ እምአድባረ፡ አራራት
  choice: 亚拉腊群山中的一座山
  rationale: 直译为“亚拉腊诸山之一”；此译保留亚拉腊被视为一个山地区域或群山的表达。
