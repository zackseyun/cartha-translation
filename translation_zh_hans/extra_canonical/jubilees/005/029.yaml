base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/029.yaml
  text: And in the fourth month the fountains of the great deep were closed[a], and the floodgates of heaven were restrained; and at the beginning of the seventh month all the mouths of the depths of the earth were opened, and the waters began to descend into the lower deep.
translation:
  language: zh_hans
  text: 第四个月，大深渊的泉源都封闭了[a]，天上的闸门也被关住。第七个月初，地底深处所有的开口全都打开，众水便开始向下流入下层深渊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的说法看似矛盾：大深渊的泉源“封闭”之后，地底深处的开口却又“打开”，使众水向下流入下层深渊。本译文保留这一宇宙论次序，不加调和。
    reason: textual_variant
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: 大深渊的泉源
  rationale: 按该短语的宇宙论语境译出“大深渊”及其水源，既与洪水叙事相符，也不将其解释为普通泉眼。
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: 天上的闸门
  rationale: 保留古代宇宙图景中天上蓄水口的具体意象；“闸门”在现代汉语中自然且庄重。
- source_word: በሠርቀ፡ ወርኀ፡ ሳብዕ
  choice: 第七个月初
  rationale: 该时间表达指月份开始之际；如此翻译自然，并避免在证据不足时特指朔日。
- source_word: አፈወ፡ መዓምቅተ፡ ምድር
  choice: 地底各深处的出口
  rationale: 原文直陈大地深处的“口”；译作“出口”保留开口及水流通道的意义，同时符合现代汉语。
- source_word: ቀላይ፡ ታሕቲት
  choice: 下面的深渊
  rationale: 保留上下分层的古代宇宙观，不将其泛化为海洋或地下水。
theological_decisions:
- issue: 泉源先封闭、地底深处的出口后打开这一表面张力
  choice: 照原有次序保留，并加脚注说明
  alternative: 将后一句协调为出口关闭，或把前一句改为水势停止
  rationale: 原文呈现的宇宙论过程本身具有张力；翻译不应为求逻辑顺畅而改写或消解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大深渊”“天上的闸门”“下面的深渊”保留原文的古代宇宙图景；句法稍作汉语化处理，但不消除原文中封闭与打开之间的张力。
