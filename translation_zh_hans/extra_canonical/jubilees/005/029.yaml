revisions:
- from: 第四个月，大深渊的泉源都封闭了[a]，天上的闸门也被止住。第七个月初，地底各深处的出口全都打开，众水便开始向下流入下面的深渊。
  to: 第四个月，大深渊的泉源都封闭了[a]，天上的闸门也被关住。第七个月初，地底深处所有的开口全都打开，众水便开始向下流入下层深渊。
  rationale: 修订仅改善汉语搭配并使“口”的译法避免不必要的方向性：“被止住”改为“被关住”，“出口”改为“开口”，“下面的深渊”改为更凝练的“下层深渊”。时间表达、封闭与开启的表面张力及脚注锚点均予保留。
