  yaml_path: translation/extra_canonical/jubilees/005/017.yaml
  text: 'And concerning the children of Israel it has been written and ordained: if they turn to him in righteousness, he will forgive all their transgressions and pardon all their sins.'
translation:
  language: zh_hans
  text: 论到以色列子孙，已经写明并定下：如果他们以公义归向他，他就会赦免他们一切的过犯，宽恕他们一切的罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: 以色列子孙
  rationale: 直译为“以色列的儿女/子孙”；采用传统而清楚的中文圣经表达，指以色列群体。
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: 已经写明并定下
  rationale: 保留两个并列的被动概念：一项内容既被记载，也被制定或规定。
- source_word: ተመይጡ፡ ኀቤሁ
  choice: 归向他
  rationale: 该短语表达转回、回到他那里；“归向”自然地保留悔改和关系转向的含义。
- source_word: በጽድቅ
  choice: 以公义
  rationale: 对应“在/以正义、公义”；不扩写为“真心悔改”，以免消解原文的措辞及其神学张力。
- source_word: የኀድግ፡ ኵሎ፡ አበሳሆሙ
  choice: 赦免他们一切的过犯
  rationale: 动词有放下、免除之意；与“过犯”搭配译作“赦免”符合语境。
- source_word: ይስሬ፡ ኵሎ፡ ኀጢአቶሙ
  choice: 宽恕他们一切的罪
  rationale: 保留与前半句近义平行而不合并；“罪”与前面的“过犯”对应原文两个不同名词。
theological_decisions:
- issue: “以公义归向他”的条件表述
  choice: 保留为“如果他们以公义归向他”
  alternative: 如果他们真诚悔改、归向他
  rationale: 原文明确使用“公义/正义”一词；不将其解释性改写为内心真诚或某种特定悔改教义。
- issue: 赦免与宽恕的平行句
  choice: 保留两个并列分句
  alternative: 他就会赦免他们所有的罪过
  rationale: 原文以两个动词和两个罪责名词形成平行，保留这种复沓可呈现其强调效果。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“经上”用于自然表达非人称的“已经写下”，但不具体指认某一部经典；整体保持原文条件句及两个赦罪分句的结构。
