  to: 至于他们的儿子，有一道话从他面前发出，说要用刀剑击倒他们，把他们从天下除去。[a]
  rationale: 将“击杀”改为“击倒”，以对应第一动词的击打／击倒义，避免无必要地强化其为明确的杀死；将“有话……要”调整为“有一道话……说要”，改善现代汉语衔接，同时保留“从他面前发出”的庄重裁决意象。脚注改为聚焦“除去／移除”的词义及中性整句替译。
