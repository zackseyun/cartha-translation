  yaml_path: translation/extra_canonical/jubilees/005/007.yaml
  text: And concerning their sons, a word went out from before his face that they should be struck down with the sword and removed from under heaven.
translation:
  language: zh_hans
  text: 至于他们的儿子，有一道话从他面前发出，说要用刀剑击倒他们，把他们从天下除去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除去”也可译作“移除”。整句也可译作：“要用刀剑击倒他们，并把他们从天下移除。”
    reason: 说明第二个动词的基本“移除”义，并提供保持两个动词区分的替译，不把原文直接强化为“灭尽”或“毁灭”。
lexical_decisions:
- source_word: ዲበ፡ ውሉዶሙ
  choice: 至于他们的儿子
  rationale: “ዲበ”在此引出所论对象；“ውሉዶሙ”指“他们的儿子/后代”。依本节语境采用较具体的“儿子”。
- source_word: ወፅአ፡ ቃል፡ እምቅድመ፡ ገጹ
  choice: 有话从他面前发出
  rationale: 保留原文“话发出”及“从他面前”的宫廷式、神圣裁决意象，不改写为解释性的“他下令”。
- source_word: ይምሐጾሙ፡ በሰይፍ
  choice: 用刀剑击杀他们
  rationale: 动词表示击打、击杀；与“刀剑”连用时，“击杀”既传达暴力结果，也保留具体的刀剑意象，避免泛化为“消灭”。
- source_word: ያሰስሎሙ፡ እምታሕተ፡ ሰማይ
  choice: 把他们从天下除去
  rationale: 动词核心义为移除、除去；“从天下”贴近“从天之下”，表达彻底不再存留，而不把动词强化为另一个“毁灭”。
theological_decisions:
- issue: “从他面前”所指的主体
  choice: 保留代词“他”，不在正文补作“上帝”
  alternative: 从上帝面前
  rationale: 上下文可帮助识别所指，但本节原文使用代词；保留代词可避免在单节中加入原文未明说的名词，并维持神圣裁决的庄严表达。
- issue: 刑罚措辞的强度与层次
  choice: 译为“击杀……除去”
  alternative: “彻底消灭……毁灭”
  rationale: 原文使用两个不同动词：先以刀剑击杀，后从天下除去。译文保留这两个动作的层次，不以两个同义的强烈毁灭词抹平差异。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“刀剑”“从他面前发出”“从天下除去”保留原文裁决宣告的正式色彩；避免生硬的“从他脸前”及过度解释性的“颁布命令”。
