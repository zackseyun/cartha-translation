  yaml_path: translation/extra_canonical/jubilees/005/024.yaml
  text: And the Lord opened seven floodgates of heaven and the openings of the fountains of the great deep[a], seven openings in all, and the floodgates poured down water from heaven for forty days and forty nights.
translation:
  language: zh_hans
  text: 主打开了天上的七道水闸，又打开了大深渊泉源的开口；这些开口共七处[a]。那些水闸便从天上倾泻下水来，历时四十昼夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些开口共七处”直译为“按数目为七口”。原文以“口”描写大深渊泉源的开口，并特意强调其数目。
    reason: 说明原文的字面意象及重复计数，避免自然化译法掩盖其表达特点。
lexical_decisions:
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: 天上的七道水闸
  rationale: 该词在洪水语境中指天上供水倾泻的闸口；译作“水闸”既保留古代宇宙图景，也比笼统的“窗口”更切合下文降水。
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: 大深渊泉源
  rationale: 保留“泉源”与“大深渊”两个意象，并采用自然的现代汉语组合。
- source_word: አፈወ
  choice: 出口
  rationale: 原义为“口”，在泉源语境中指水流出的开口；正文译作“出口”较自然，脚注保留其字面意象。
- source_word: ፵መዋዕለ፡ ወ፵ሌልየ
  choice: 持续四十昼夜
  rationale: 准确表达四十天、四十夜的连续时段，同时保持中文简洁庄重。
theological_decisions:
- issue: 天上水闸与大深渊泉源的宇宙图景
  choice: 按原文保留具体空间意象
  alternative: 泛化为“大雨和地下水涌出”
  rationale: 泛化会消除原文刻意呈现的古代宇宙图景；保留意象并不要求读者接受某种后来的宇宙论解释。
- issue: 七个出口的计数范围
  choice: 译作“出口总数为七”，并以脚注说明字面措辞
  alternative: 译作“七张口”或省略重复计数
  rationale: 原文明确重复“七”并使用计数表达，应保留其强调；正文采用自然汉语，不武断扩展其确切所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“倾泻而下”体现洪水规模；分号划分开启水源与持续降水两个动作。脚注标记[a]已置于对应短语之后。
