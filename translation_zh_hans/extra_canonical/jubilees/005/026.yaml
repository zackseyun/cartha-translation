  text: And the waters rose upon the earth fifteen cubits; the waters rose high above all the high mountains, and the ark was lifted up from the earth and floated on the surface of the waters.
translation:
  language: zh_hans
  text: 水在地上上涨了十五肘；水高高漫过所有的高山，方舟也从地上浮起，漂在水面上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቀ፡ ማያት
  choice: 水……上涨
  rationale: 按吉兹语动词与主语的组合直译其水位升高之意，同时保持现代汉语自然。
- source_word: ዐሠርት፡ ወኃምስተ፡ በእመት
  choice: 十五肘
  rationale: 保留原文古代长度单位“肘”，不擅自换算；该短语在上下文中表示水上涨的高度。
- source_word: ተለዐለ፡ ማያት፡ ዲበ፡ ኵሉ፡ ደብር፡ ነዋኅ
  choice: 水高高漫过所有的高山
  rationale: “漫过”自然表达水位升至山峰以上；重复“高”对应原文中水势升高和高山的措辞。
- source_word: ታቦት
  choice: 方舟
  rationale: 采用汉语圣经传统中通行且易懂的对应词。
- source_word: ተንሰፈ፡ ዲበ፡ ገጸ፡ ማያት
  choice: 漂在水面上
  rationale: 准确传达方舟在水面漂浮的状态，措辞简洁自然。
