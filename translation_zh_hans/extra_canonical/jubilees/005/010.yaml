  yaml_path: translation/extra_canonical/jubilees/005/010.yaml
  text: And their fathers were watching, and after this they were bound in the depths of the earth forever, until the day of the great judgment, for judgment upon all who corrupted their ways and their deeds before the Lord.
translation:
  language: zh_hans
  text: 他们的父亲正在观看；此后，他们被捆绑在大地深处，永远如此，直到大审判之日；这审判要临到所有在主面前败坏自己道路和行为的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“大审判”之后再次出现“审判”，并使用可表达“在……之上／临到……”的介词结构。末句也可译作：“直到大审判之日，为审判所有在主面前败坏自己道路和行为的人。”
    reason: 保留审判一词的重复及介词的方向性，同时不确定该短语与前句之间唯一的句法关系。
lexical_decisions:
- source_word: አበዊሆሙ
  choice: 他们的父辈
  rationale: 按其通常含义直译“他们的父亲／父辈”，不擅自将所指对象解释为某一类超自然存在。
- source_word: ይኔጽሩ
  choice: 一直注视着
  rationale: 表达观看、察看的持续状态，并保留句中主语与下文被捆绑者可能不同的表面结构。
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: 大地深处
  rationale: 自然表达“地的深处／深渊”，同时避免加入原文未明说的“阴间”或“地狱”。
- source_word: እስከ፡ ለዓለም፡ እስከ፡ ዕለተ፡ ኵነኔ፡ ዐባይ
  choice: 永远如此，直到大审判之日
  rationale: 保留“永远”与“直到……之日”并列造成的时间张力，不将二者强行调和。
- source_word: ዲበ፡ ኵሎሙ
  choice: 临到所有……的人
  rationale: 体现介词“在……之上／临到／针对”的方向性，表明审判施行在这些人身上。
- source_word: አማሰኑ፡ ፍኖቶሆሙ፡ ወምግባሪሆሙ
  choice: 败坏自己道路和行为
  rationale: “败坏”对应使之腐坏、毁坏之义；“道路和行为”保留两个并列名词及其伦理含义。
theological_decisions:
- issue: “永远”与“直到大审判之日”的关系
  choice: 并列保留“永远如此，直到大审判之日”
  alternative: 解释为“被拘禁直到大审判之日”或“永远被拘禁”
  rationale: 原文同时含有表示“永远”和“直到”的措辞；译文不替文本消除这种张力。
- issue: 审判短语中“审判”的重复及介词方向
  choice: 正文译作“那时，审判将临到所有……”
  alternative: “为要审判所有……”或“为了对所有人进行审判”
  rationale: 兼顾原文重复的审判语义和“临到／针对”的介词力量，同时使现代汉语可读；脚注说明较形式化的译法。
- issue: “他们的父辈”与“他们被捆绑”的指代
  choice: 维持两个代词主语，不明确二者是否同指
  alternative: 明确改写为“那些父辈后来被捆绑”或为各代词补出具体身份
  rationale: 原文的代词衔接存在解释空间，译文不引入额外身份判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大地深处”“大审判之日”“在主面前”等措辞保留古代宗教文本的语体；不添加“天使”“守望者”“地狱”等解释性术语。
