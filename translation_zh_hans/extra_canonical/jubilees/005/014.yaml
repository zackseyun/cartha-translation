base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/014.yaml
  text: And if they do not walk in it[a], judgment is written for every creature and for every kind. And there is nothing in heaven or on earth, or in light or in darkness, or in Sheol or in the deep or in the place of darkness—all their judgments are ordained and written and engraved.
translation:
  language: zh_hans
  text: 如果他们不行在其中[a]，针对一切受造之物和各类的审判都已写下。天上、地上、光明中、黑暗中、阴间、深渊和幽暗之处，没有一物例外；它们的一切审判都已定下、写下并刻录。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“如果他们不行在其中”。“其中”的具体所指承接上文，本节未予明说。
    reason: ambiguity
  - marker: b
    text: “天上、地上、光明中、黑暗中、阴间、深渊和幽暗之处”是一组涵盖整个宇宙领域的列举。末尾“定下、写下并刻录”保留了原文三重法律记录意象。
    reason: cultural_note
lexical_decisions:
- source_word: ኢሖሩ፡ ባቲ
  choice: 不遵行这道
  rationale: 字面为“不行在其中”。按汉语习惯译作“不遵行这道”，同时以脚注保留代词所指依赖上文的特点。
- source_word: ፍጥረት
  choice: 受造之物
  rationale: 保留“被造者／受造物”的创造论语义，也适合涵盖广泛对象。
- source_word: ትዝምድ
  choice: 族群
  rationale: 此词涉及种类、亲族或群类；译作“族群”可与“一切受造之物”并列，又不强行限定为生物学物种。
- source_word: ሲኦል
  choice: 阴间
  rationale: 采用现代中文圣经语域中对 Sheol 的常见音义对应，避免译成带有后世惩罚含义的“地狱”。
- source_word: ቀላይ
  choice: 深渊
  rationale: 表达深处、深水或无底深处的宇宙空间意象。
- source_word: መጽልም
  choice: 幽暗之处
  rationale: 与前面的“黑暗中”有所区分，同时保留“黑暗之地／幽暗处”的空间意义。
- source_word: ሥሩዕ፡ ወጽሑፍ፡ ወቅሩጽ
  choice: 定下、写明并刻录
  rationale: 保留原文三项并列及法律记录意象；“刻录”突出不可轻易抹去的铭刻感。
theological_decisions:
- issue: “阴间”的性质
  choice: 阴间
  alternative: 地狱
  rationale: 原词对应 Sheol，主要指死者所在之境；译作“地狱”会不必要地加入终末刑罚的特定含义。
- issue: 宇宙范围列举与审判对象的关系
  choice: 译为“没有一个例外；他们所受的一切审判”
  alternative: 译为“没有审判……一切都已定下”
  rationale: 底本文本疑有传抄或印刷讹误；结合修订证据，末句应含“他们的审判”。译文保留全面覆盖与司法记录的重点，不把它解释成某一特定教义体系。
- issue: “其中”的先行词
  choice: 正文作“这道”，脚注说明也可直译“在其中行”
  alternative: 明确指定为某条律法或道路
  rationale: 本节本身未明说代词所指，避免擅自锁定为特定律法概念。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“无论……没有一个例外”自然呈现原文全面否定的范围；保留“阴间、深渊、幽暗之处”的古代宇宙图景，不以后世系统神学术语替换。所有脚注标记均已置于正文。
