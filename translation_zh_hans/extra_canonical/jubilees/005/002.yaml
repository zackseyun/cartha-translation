base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/002.yaml
  text: And lawlessness increased on the earth, and all flesh corrupted its way, from men to cattle, and to beasts, and to birds, and to everything that moves on the earth. All of them corrupted their ways and their ordinances, and they began to devour one another; and lawlessness increased on the earth, and every imagination of the thoughts of all the children of men was thus evil all the days.
translation:
  language: zh_hans
  text: 不法之事在地上日益增多；凡有血肉的都败坏了自己的道路，从人到牲畜、野兽、飞鸟，以及地上一切活动的生物，都是如此。这些全都败坏了自己的道路和定规，并开始彼此吞吃；不法之事在地上日益增多，所有世人心中一切意念，终日尽都是恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: 不法之事
  rationale: 该词可指违法、邪恶或暴行；此处反复描述遍地的道德败坏，译作“不法之事”既保留法律与伦理色彩，也符合现代汉语。
- source_word: ኵሉ ዘሥጋ
  choice: 凡有血肉的
  rationale: 较贴近原文“所有肉身/一切血肉”，并能自然涵盖随后列举的人和各类动物。
- source_word: አማሰነ ፍኖተ
  choice: 败坏了自己的道路
  rationale: 保留“败坏”与“道路”的源语意象，所指为生活方式或行为路径，不将其窄化为单一罪行。
- source_word: ሥርዐቶሙ
  choice: 定规
  rationale: 此词可表达秩序、规制或既定安排；“定规”保留其规范与秩序层面的开放性。
- source_word: ይትበልዑ በበይናቲሆሙ
  choice: 彼此吞吃
  rationale: 按字面保留互相吃食、吞噬的强烈表达，不弱化为笼统的彼此伤害。
- source_word: ኵሉ ሕሊና አእምሮ
  choice: 心里所思所想的
  rationale: 源语组合涉及意念、思想或心智活动；采用自然汉语概括，同时保留其涵盖全部内在思虑的范围。
- source_word: ኵሉ መዋዕለ
  choice: 终日
  rationale: 原文直义近于“所有日子/日日”；依语境译为“终日”，表达持续不断，并与相近的创世记措辞相呼应。
theological_decisions:
- issue: “凡有血肉的”是否仅指人类
  choice: 保留广义，并按原文列举人、牲畜、野兽、飞鸟和爬行动物
  alternative: 将其解释为仅指全人类
  rationale: 源文随后明确从人延伸到各种动物，因此不应把败坏道路的主体限定为人类。
- issue: “道路和定规”的含义
  choice: 保留两个并列概念，不解释其具体神学机制
  alternative: 将“定规”明确解释为受造秩序或自然法
  rationale: 原文没有在本节界定“定规”究竟指行为规范、物种秩序还是受造安排，译文保留其张力。
- issue: 末句邪恶的持续范围
  choice: 译为“终日尽都是恶”
  alternative: 译为“一生所有日子都是恶”
  rationale: 源语表达持续性，但未明确限定为每个人的一生；“终日”较自然，也避免过度阐释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“败坏道路”“彼此吞吃”等源语鲜明意象。句式适度拆分以便普通读者理解，同时维持原文两次“不法之事在地上日益增多”的重复结构。
