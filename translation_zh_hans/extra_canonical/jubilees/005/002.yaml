  to: 不法之事在地上日益增多；凡有血肉的都败坏了自己的道路，从人到牲畜、野兽、飞鸟，以及地上一切活动的生物，都是如此。这些全都败坏了自己的道路和定规，并开始彼此吞吃；不法之事在地上日益增多，所有世人心中一切意念，终日尽都是恶。
