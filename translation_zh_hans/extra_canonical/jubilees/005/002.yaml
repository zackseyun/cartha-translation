  naturalness: 整体庄重通顺。“它们全都”在所指同时包括人类和动物时略显不够妥当，改为“这些全都”更自然。末句可更直接对应“所有世人心思的一切意念”。
  terminology: “不法之事”“凡有血肉的”“败坏自己的道路”“定规”均可保留；“定规”虽略具书面色彩，但能保留原文关于规条、秩序或既定安排的开放含义。
