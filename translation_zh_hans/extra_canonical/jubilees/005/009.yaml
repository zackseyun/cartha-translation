  text: And he sent a sword among them so that each might kill his fellow, and they began to kill one another until they all fell by the sword and were wiped out from the earth.
translation:
  language: zh_hans
  text: 他使刀剑临到他们中间，使各人杀死自己的同伴；他们便开始彼此残杀，直到全都倒在刀剑之下，从地上被除灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈነወ፡ ሰይፈ፡ ማእከሎሙ
  choice: 使刀剑临到他们中间
  rationale: 保留“差遣／发出刀剑到他们中间”的使役意象，同时避免误加原文没有明确表达的领属词“他的”。
- source_word: ይቅትል፡ ፩፪ቢጹ
  choice: 各人杀死自己的同伴
  rationale: 按上下文将表示相互同伴关系的措辞译为“各人……自己的同伴”，自然传达群体内部互杀。
- source_word: ወወጠኑ፡ ይቅትሉ፡ ዝንቱ፡ ዘንተ
  choice: 他们便开始彼此残杀
  rationale: 原文表达“开始这一个杀那一个”；“彼此残杀”简洁保留相互杀戮之义。
- source_word: እስከ፡ ወድቁ፡ ኵሎሙ፡ ውስተ፡ ሰይፍ
  choice: 直到全都倒在刀剑之下
  rationale: 保留“全都”“倒下”和“刀剑”的具体意象，采用现代汉语庄重而自然的表达。
- source_word: ወተደምሰሱ፡ እምነ፡ ምድር
  choice: 从地上被除灭
  rationale: 准确呈现被动的彻底毁灭及“从地上”这一范围表达。
theological_decisions:
- issue: 刀剑的领属
  choice: 译作“刀剑”，不译“他的刀剑”
  alternative: 他的刀剑
  rationale: 吉兹语此处没有明确的第三人称领属成分；不补出“他的”，以免把隐含关系强化为明说。
- issue: 施动者与互相残杀的关系
  choice: 保留“他使刀剑临到”与“他们彼此残杀”两层表述
  alternative: 直接解释为他使他们互相杀戮
  rationale: 原文同时呈现神圣施动与群体内部互杀，译文不消解其中的神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话。“临到”保存经文语体，“彼此残杀”“除灭”清楚有力而不过度古雅；全节不需脚注。
