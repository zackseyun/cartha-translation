  text: And on the new moon of the tenth month the tops of the mountains appeared, and on the new moon of the first month the earth appeared.
translation:
  language: zh_hans
  text: 十月初一，山顶显露出来；正月初一，大地显露出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሠርቀ፡ ወርኀ፡ ዓሥር
  choice: 十月初一
  rationale: 字面涉及“第十个月的月亮升起／新月”。结合月份纪日语境，以现代汉语“十月初一”自然表达该月第一日，同时避免把重点误置于天文现象。
- source_word: አስተርአየ፡ አርእስተ፡ አድባር
  choice: 山顶显露出来
  rationale: 保留“显现、可见”与“诸山之顶”的基本语义，措辞也与洪水消退后地貌逐渐可见的情景相符。
- source_word: በሠርቀ፡ ለወርኀ፡ ቀዳማይ
  choice: 正月初一
  rationale: 原文指“第一个月”的月初；汉语历法语境中“正月初一”简洁自然，并明确为第一月第一日。
- source_word: አስተርአየት፡ ምድር
  choice: 大地显露出来
  rationale: 按原文保留“大地／土地显现”的陈述，不擅自细化为“地面干了”或“水退尽了”。
