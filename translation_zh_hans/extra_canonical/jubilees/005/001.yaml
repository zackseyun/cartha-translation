base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/001.yaml
  text: And it came to pass, when the children of men began to multiply on the face of the earth, and daughters were born to them, that in a certain year of this jubilee the angels of God saw them, that they were beautiful to look upon; and they took wives for themselves from all whom they chose, and they bore children for them, and these were the giants.
translation:
  language: zh_hans
  text: 当世人在地面上开始增多、女儿也生给他们的时候，在这个禧年的某一年，上帝的天使看见她们美丽；他们就从所有他们所选择的女子中娶来作妻子。她们给他们生了儿女；这些儿女就是巨人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: 世人
  rationale: 该词组直译近于“人类之子”，在此泛指人类；译作“世人”自然、庄重，也与后文“女儿”相衔接。
- source_word: መላእክተ፡ እግዚአብሔር
  choice: 上帝的天使
  rationale: 按吉兹文本明确译出“上帝的天使”，不以《创世记》平行文本中的其他称呼取代。
- source_word: ሠናያት፡ ለርእይ
  choice: 容貌美丽
  rationale: 原文意为“看起来美好/悦目”；“容貌美丽”符合本段观看女子的语境，又保持自然中文。
- source_word: ነሥእዎን፡ ሎሙ፡ አንስቲያ
  choice: 娶来为妻
  rationale: 原文为“取她们给自己作妻子”；此译简洁表达婚配意义，不额外判断其合法性。
- source_word: እለ፡ ኀረዩ
  choice: 自己所中意的女子
  rationale: 保留“他们选择”的主动含义；“中意”在现代汉语中自然，并未增添强迫或同意等原文未明说的信息。
- source_word: ረዐይት
  choice: 巨人
  rationale: 依该版吉兹文本及其语境，指异常巨大的后代；译作“巨人”避免擅自套用其他传统中的专名。
theological_decisions:
- issue: 与女子结合者的身份
  choice: 上帝的天使
  alternative: 上帝的众子／神的儿子们
  rationale: 本节吉兹文本明确写作“上帝的天使”，因此按所给原文翻译，不以《创世记》6章的希伯来措辞覆盖本书文本。
- issue: “巨人”所指的范围
  choice: 这些儿女就是巨人
  alternative: 他们就是守望者
  rationale: 句法上最近的先行项是所生的儿女，且“巨人”符合本段传统语境；不把末词解释成天使群体的称号。
- issue: 婚配行为的伦理性质
  choice: 不在本节增添伦理评语
  alternative: 称之为犯罪、强夺或违背天命
  rationale: 本节只叙述看见、选择、娶妻和生子，审判意义将在后文展开；译文不提前化解叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“事情是这样”传达吉兹语叙事起始式；保留“这个禧年的某一年”这一纪年表达。句式适度拆分，以免原文长句在中文中显得拖沓，同时不改变事件顺序。
