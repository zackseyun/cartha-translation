  yaml_path: translation/extra_canonical/jubilees/005/003.yaml
  text: And the Lord saw the earth, and behold, it was ruined, and all flesh had corrupted its order, and all who were on the earth had done evil before his eyes.
translation:
  language: zh_hans
  text: 主察看大地，看哪，大地已经败坏；凡有血肉的都败坏了自己的秩序，地上一切活着的都在他眼前行了恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 此处是神圣名号；采用现代中文圣经读者熟悉且庄重的译法。
- source_word: ማሰነት
  choice: 败坏
  rationale: 依上下文指大地陷入毁坏、腐败的状态；“败坏”既保留道德与受造秩序受损的意味，也与后句形成呼应。
- source_word: ኵሉ፡ ዘሤጋ
  choice: 凡有血肉的
  rationale: 贴近闪语式“所有肉身/一切血肉”，指一切有血肉的活物，不擅自缩窄为人类。
- source_word: ሥርዓታ
  choice: 自己的秩序
  rationale: 该词核心义为秩序、规制或定例；此处保留受造者偏离既定秩序的含义，不译作“道路”。
- source_word: አእከየ
  choice: 行了恶
  rationale: 用自然中文表达作恶、行坏事的动词意义，同时保留行为层面的判断。
- source_word: ቅድመ፡ አዕይንቲሁ
  choice: 在他眼前
  rationale: 保留原文具象表达及神鉴察一切的语气。
theological_decisions:
- issue: “凡有血肉的”的范围
  choice: 不限定为人类
  alternative: 译作“所有人”
  rationale: 原文使用广义的“血肉”，可能涵盖一切有血肉的活物；译文保留这一范围上的开放性。
- issue: ሥርዓታ 所表达的受造规范
  choice: 译为“自己的秩序”
  alternative: 译为“自己的道路”
  rationale: 原词指秩序、规则或定例；“秩序”更准确地保留《禧年书》此处受造秩序遭到败坏的张力，避免把意义转成一般性的生活道路。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。以“看哪”保留叙事中的突显语气；“凡有血肉的”略带经文风格，但仍为普通读者可理解，并能较准确承载原文范围。
