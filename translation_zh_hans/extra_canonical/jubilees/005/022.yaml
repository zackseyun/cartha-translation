  yaml_path: translation/extra_canonical/jubilees/005/022.yaml
  text: And Noah made the ark in every respect as He commanded him, in the twenty-sixth jubilee of years, in the fifth week, in the fifth year.
translation:
  language: zh_hans
  text: 挪亚在一切事上都照着上帝吩咐他的去造方舟。这是在第二十六个禧年周期的第五个七年期、第五年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第二十六个禧年周期的第五个七年期、第五年”，即该禧年周期的第三十三年。
    reason: 说明《禧年书》以四十九年禧年周期及其中七年期纪年的方式；第五个七年期的第五年为该周期的第三十三年，不以换算结果取代正文原有表达。
lexical_decisions:
- source_word: ገብረ፡ ኖኅ፡ ታቦተ
  choice: 挪亚……造了方舟
  rationale: ገብረ意为“做、建造”，ታቦት在洪水叙事中指方舟；采用现代汉语自然语序。
- source_word: በኵሉ፡ በከመ፡ አዘዞ
  choice: 在各方面都照着上帝吩咐他的
  rationale: በኵሉ保留“在一切方面”的完整性；አዘዞ是带第三人称阳性宾语后缀的主动形式，即“他吩咐了他”。上下文中的施令者是上帝，明示“上帝”可在汉语中避免两个“他”造成歧义，同时不改动语义。
- source_word: በዕሥራ፡ ወስድስቱ፡ ኢዮቤልው፡ ዓመታት
  choice: 在第二十六个禧年周期
  rationale: 数词明确为“二十六”；禧年在本书年代体系中是四十九年的周期，译作“禧年周期”以区别单一的禧年。
- source_word: በኃምስ፡ ሱባዔ፡ በኃምስ፡ ዓመት
  choice: 第五个七年期第五年
  rationale: ሱባዔ在《禧年书》的年代计算中指一个七年期；直译其周期意义，避免仅译“周”而被理解为七日。
theological_decisions:
- issue: አዘዞ的主语是否应在译文中明示
  choice: 明示为“上帝吩咐他的”
  alternative: “照着他吩咐他的”或“照着所受的吩咐”
  rationale: 源文采用主动动词且施令者由语境承接为上帝。中文若连续使用两个“他”会含混，改为被动又会掩盖源文主动结构，因此明示上帝最为清楚。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“方舟”“禧年”沿用读者熟悉的圣经术语；以“七年期”准确表达年代单位。正文分为两句，使建造行动与年代说明更清楚。
