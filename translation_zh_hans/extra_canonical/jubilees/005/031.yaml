  text: And the waters receded from upon the earth in the fifth week, in its seventh year; and on the seventeenth day in the second month the earth was dry.
translation:
  language: zh_hans
  text: 水在第五个七年期的第七年从地面退去；第二个月十七日，地干了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነጽፈ፡ ማያት፡ አመልዐልተ፡ ምድር
  choice: 水从地面退去
  rationale: 按语境将水从地表消退译为“退去”，既符合洪水消退的自然汉语表达，也避免译成完全“消失”。
- source_word: በሱባዔ፡ ኃምስ፡ በሳብዕ፡ ዓመት፡ ሎቱ
  choice: 在第五个七年期的第七年
  rationale: “ሱባዔ”在《禧年书》的年代体系中指七年为一组的周期；明确译为“七年期”，保存原文的编年信息。
- source_word: ዐሡሩ፡ ወሰብዑ፡ ዕለት፡ በካልእ፡ ወርኀ
  choice: 第二个月十七日
  rationale: 采用现代汉语日期次序，准确表达原文“第二月的第十七日”。
- source_word: የብሰት፡ ምድር
  choice: 地就干了
  rationale: 简洁保留原文土地变干的结果；“就”自然承接前述日期，但不额外强化因果。
