  text: And he said, “I will destroy man and all flesh upon the face of the earth, which I created.”
translation:
  language: zh_hans
  text: 他说：“我要毁灭地面上我所创造的人和一切血肉之躯。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አይመሰለ
  choice: 我要毁灭
  rationale: 按该版语境及英语审校层理解为第一人称毁灭宣告；用“我要”自然表达意志与将来行动。
- source_word: ለሰብእ
  choice: 人
  rationale: 对应泛指人类的“人”，不额外限定为某一群体。
- source_word: ለኵሉ፡ ዘሥጋ
  choice: 一切血肉之躯
  rationale: 保留“所有/一切”与“肉身、血肉”的表达范围，并与单独提到的“人”并列。
- source_word: በመልዕልተ፡ ገጸ፡ ምድር
  choice: 地面上的
  rationale: 介词为“在……之上”，不是“从……之上”；以现代汉语自然表达空间位置，避免受《创世记》平行措辞影响而加入“从”。
- source_word: ዘፈጠርኩ
  choice: 我所创造的
  rationale: 保留第一人称单数及关系结构；在汉语中前置修饰“人和……一切血肉之躯”，避免误解为只修饰邻近成分。
theological_decisions:
- issue: 创造者与毁灭者的身份
  choice: 用同一第一人称“我”表达创造与毁灭
  alternative: 将主语明示为“上帝”
  rationale: 原文只以动词人称表达说话者，不在本节另添神名；保留上下文所确立的身份。
- issue: 关系从句“我所创造的”的修饰范围
  choice: 前置，使其自然涵盖“人和……一切血肉之躯”
  alternative: 置于句末，保留潜在的邻近修饰歧义
  rationale: 原文关系成分位于整组宾语之后，最自然地回指被毁灭的受造对象整体；汉语句末放置会产生不必要的结构歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“血肉之躯”保留古代文本中“肉身/血肉”的质感，同时普通读者易懂。引号和标点按简体中文出版习惯处理。
