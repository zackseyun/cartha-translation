  text: And on the twenty-seventh thereof he opened the ark and sent out from it beasts and cattle and birds and everything that moves.
translation:
  language: zh_hans
  text: 到了那月二十七日，他打开方舟，把野兽、牲畜、飞鸟和一切活动之物都从方舟里放了出去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ዕሥራ፡ ወሰብዑ፡ ሎቱ
  choice: 到了那月二十七日
  rationale: 原文表达“其二十七日”；结合日期语境，以自然现代汉语明确为“那月二十七日”，不补入原文未明说的月份名称。
- source_word: ታቦት
  choice: 方舟
  rationale: 在洪水叙事中指挪亚的方舟；采用现代中文圣经传统中通行且易懂的称呼。
- source_word: አራዊተ
  choice: 野兽
  rationale: 与后面的“牲畜”构成类别对举，译为“野兽”可保留其野生动物之义。
- source_word: እንስሳ
  choice: 牲畜
  rationale: 此处与“野兽、飞鸟”并列，指家养动物；译为“牲畜”较能呈现类别区分。
- source_word: አዕዋፈ
  choice: 飞鸟
  rationale: 采用自然而庄重的中文，明确指鸟类。
- source_word: ዘይትነወስ
  choice: 一切活动之物
  rationale: 保留原文较宽泛的“凡移动/活动者”，避免缩窄为某一种动物或特定的爬行动物。
- source_word: ፈነወ፡ እምውስቴታ
  choice: 从方舟里放了出去
  rationale: 动词表示遣出、放出；补明“方舟”作为代词所指，使中文清楚流畅。
