  text: And the fountains of the deep also sent up waters until the whole world was full of water.
translation:
  language: zh_hans
  text: 深渊的泉源也涌出水来，直到全世界都充满了水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ
  choice: 深渊的泉源
  rationale: 该词组指深处或深渊的水泉；译作“深渊的泉源”既贴近原文，也保留洪水叙事的庄重语体。
- source_word: ያዐርጉ፡ ማያተ
  choice: 涌出水来
  rationale: 动词有使水上升、升涌之意；汉语用“涌出水来”自然呈现水从深处向上冒出的动态。
- source_word: ኵሉ፡ ዓለም
  choice: 全世界
  rationale: 直译为“整个世界”，在本节语境中指洪水所充满的全地，保留原文广泛而未加限定的表述。
- source_word: መልአ … ማየ
  choice: 都被水充满
  rationale: 原文表达世界充满了水；采用被动式汉语，清楚说明水遍满全世界的结果。
theological_decisions:
- issue: 洪水范围的表述
  choice: 全世界
  alternative: 全地
  rationale: 原文“ኵሉ ዓለም”具有全面性，可译“整个世界”；不另加地理或神学限定，以保留原文自身的范围表述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；句式紧凑，并以“也”承接上下文中其他水源的出现。
