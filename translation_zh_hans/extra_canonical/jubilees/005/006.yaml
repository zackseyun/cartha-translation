  yaml_path: translation/extra_canonical/jubilees/005/006.yaml
  text: And against his angels whom he had sent to the earth he was exceedingly angry[a], so as to strip them of all their dominion; and he told us to bind them in the depths of the earth, and behold, they are bound within them and separated.
translation:
  language: zh_hans
  text: 对他所差到地上的那些天使，他极其愤怒，要剥夺他们一切的权柄[b]；他吩咐我们[a]把他们捆绑在大地的深处。看哪，他们被捆绑在那些深处之中[c]，并被隔离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吩咐我们”保留原文的第一人称复数，反映本书由天使中保讲述上帝作为的启示框架。这里所说的，是把犯罪的天使拘禁在地下深处。
    reason: cross_reference
  - marker: b
    text: 或译“极其愤怒，便剥夺他们一切的权柄”。
    reason: source_ambiguity
  - marker: c
    text: 直译“在它们中间”或“在它们里面”；“它们”指前面的“大地的深处”。末句“被隔离”未说明他们是与谁或与什么分开。
    reason: translation_clarity
lexical_decisions:
- source_word: ተምዐ፡ ፈድፋደ
  choice: 极其愤怒
  rationale: ተምዐ 表示发怒，ፈድፋደ 加强程度；译文保留强烈语气而不作额外解释。
- source_word: ይሠርዎሙ፡ እምኵሉ፡ ሥልጣኖሙ
  choice: 夺去他们所有的权柄
  rationale: 该短语表达使他们失去原有的一切权能或管辖权；“夺去……权柄”在现代汉语中自然，也避免将其具体化为肉体性的“铲除”。
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: 大地深处
  rationale: 直译为“大地的深处（复数）”；汉语集合表达“大地深处”自然，并保留地下幽深之意。
- source_word: ብሕትዋን
  choice: 与外界隔绝
  rationale: 词义为被分开、隔离；补出“与外界”使现代汉语完整，但不指定他们彼此分离。
theological_decisions:
- issue: “吩咐我们”中第一人称复数的身份
  choice: 保留“我们”，并以脚注说明叙事框架
  alternative: 改为“吩咐众天使”
  rationale: 原文明确使用第一人称复数，反映《禧年书》中天使中保者讲述启示的框架；不应在正文中将其解释性替换。
- issue: 发怒与夺权之间的句法关系
  choice: 译作“极其愤怒，便夺去”并注明另一种理解
  alternative: “极其愤怒，为要夺去”
  rationale: 原文连接较为紧凑，可理解为随后的结果或目的；正文采用自然的结果关系，但脚注保留目的式理解。
- issue: 末句“隔绝”的对象
  choice: 译作“与外界隔绝”
  alternative: “彼此分开”
  rationale: 上下文描写他们被囚在地下深处，更可能指被隔离拘禁；不把词义解释为犯罪天使彼此分散。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“至于……那些天使”清楚标示话题转换；“看哪”保留原文提示读者注意的语气。避免使用带有特定宗派色彩的术语，并以脚注保存原文在句法和代词指向上的歧义。
