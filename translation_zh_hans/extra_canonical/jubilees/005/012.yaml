  to: 他为自己一切的作为创造了新的、公义的本性[a]，使它们在其整个本性中永不犯罪，反倒全都成为正直的，各按其类，直到永远。
  rationale: 修订仅处理汉语句法和词语搭配：“创造了”使首句自然，“在其整个本性中”保留原文范围，“成为正直的”准确表达“都成为义的／正直的”，并以“各按其类”清晰保留按类别的限定。脚注标记及其说明均予保留。
