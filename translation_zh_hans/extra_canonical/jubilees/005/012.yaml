  yaml_path: translation/extra_canonical/jubilees/005/012.yaml
  text: And he made for all his works a new and righteous nature[a], so that they should not sin in all their nature forever, but should all be righteous, each according to its kind, all the days.
translation:
  language: zh_hans
  text: 他为自己一切的作为创造了新的、公义的本性[a]，使它们在其整个本性中永不犯罪，反倒全都成为正直的，各按其类，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一分句在文本和语义上都较难确定。这里保留“新的、公义的本性”这一表达，意在呈现受造界按其种类得到更新、归于公义的秩序，而不将它泛化为笼统的陈述。
    reason: textual_variant
lexical_decisions:
- source_word: ገብረ
  choice: 造了
  rationale: 该动词在此表示施行创造或造成；“造了”与本节论及受造秩序的语境相符。
- source_word: ለኵሉ፡ ግብረ
  choice: 为自己一切的作为
  rationale: 保留“作为/工作”的广义表达，不径直限定为某一类受造物；代词所指依上下文译为“自己”。
- source_word: ፍጥረተ፡ ሐዳሰ፡ ወጻድቅተ
  choice: 一个崭新而公义的本性
  rationale: ፍጥረት 可指受造性质、构造或本性；此处结合后续“在……本性中”译作“本性”，同时以脚注保留文本和语义上的困难。
- source_word: እይረብቡ
  choice: 不犯罪
  rationale: 按句中目的结构及英译校勘层所保存的意义，表达不再陷入罪的状态。
- source_word: በበ፡ ትዝምዳ
  choice: 各从其类
  rationale: 保留按类别或种类分别归属的创造秩序，不泛化为“各自”。
- source_word: ኵሉ፡ መዋዕለ
  choice: 直到永远
  rationale: 字面近于“一切日子”；现代汉语用“直到永远”自然表达持续无尽的时间，并与前句的永恒意义呼应。
theological_decisions:
- issue: “崭新而公义的本性”是否指内在道德改造或创造秩序的更新
  choice: 保留“本性”并加脚注说明其困难
  alternative: 译作“新的公义秩序”或笼统译作“使万物更新为义”
  rationale: 源文容许性质、构造和受造秩序等相邻含义；正文保留本性用语，脚注提示按类更新的受造秩序，避免将其限定为某一教义体系。
- issue: 复数对象的指称范围
  choice: 使用“它们”承接“一切的作为”
  alternative: 明确译作“众生”或“万物”
  rationale: 源文的范围较宽，明确化为“众生”可能缩窄指称，故保留中性复数。
translation_notes:
  register: 采用庄重而现代的标准普通话。“各从其类”保留经文式凝练感，但仍为普通读者所能理解；正文中的脚注标记与脚注完全对应。
