  yaml_path: translation/extra_canonical/jubilees/005/020.yaml
  text: And the Lord said that He would destroy everything that is on the dry land, from man to cattle, to beasts, and to the birds of heaven, and to whatever moves on the earth.
translation:
  language: zh_hans
  text: 主说，他要消灭陆地上的一切：从人到牲畜、野兽、天上的飞鸟，以及地上一切活动之物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主说：‘愿陆地上的一切都被消灭：从人到牲畜、野兽、天上的飞鸟，以及地上一切活动之物。’”
    reason: 保留先前将本句理解为直接引语和被动命令式的译法，但正文依原文语法采用第三人称主动的间接引语。
lexical_decisions:
- source_word: ይደመስስ
  choice: 他要消灭
  rationale: 该动词为第三人称主动形式，后接宾语“所有／一切”，宜按间接引语表达，保留主的主动施事身份。
- source_word: የብስ
  choice: 旱地
  rationale: 指与水域相对的干地；“旱地”在现代汉语中简洁自然，也呼应洪水叙事语境。
- source_word: እንስሳ
  choice: 牲畜
  rationale: 在与“野兽”并列时，译为“牲畜”可清楚表达家养动物与野生动物的区别。
- source_word: አራዊት
  choice: 野兽
  rationale: 与前项家畜形成对应，采用庄重且通行的圣经叙事用语。
- source_word: ዘይትሐወስ
  choice: 一切活动之物
  rationale: 直译为“那活动／移动的”；不擅自限定为爬行动物，保留原文概括性。
theological_decisions:
- issue: 主的话应作直接引语还是间接引语
  choice: 采用间接引语：“主说，他要消灭……”
  alternative: 采用直接命令式：“主说：‘愿……都被消灭。’”
  rationale: 吉兹语动词是第三人称主动形式，并以“一切”为宾语，语法上更支持“他要消灭”的间接引语，而非被动命令式。脚注保留旧译可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从人到……”保留原文逐项扩展的列举结构；末项译作“一切活动之物”，避免把范围缩窄为某一动物类别。
