  yaml_path: translation/extra_canonical/jubilees/005/008.yaml
  text: And he said, “My spirit shall not abide upon man forever, for they too are flesh; and their days shall be one hundred and twenty years.”
translation:
  language: zh_hans
  text: 他说：“我的灵不会永远停留在人身上[a]，因为他们也是血肉之躯[b]；他们的年日将是一百二十年。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在人之上”。
    reason: 保留吉兹语介词ዲበ的空间意象，同时说明正文“在人身上”的字面依据。
  - marker: b
    text: 直译：“因为他们也是肉。”
    reason: 显示原文附着词-ni所表达的“也”，并呈现“肉”的简洁原貌。
lexical_decisions:
- source_word: ይነብር (yǝnabbǝr)
  choice: 停留
  rationale: 该动词基本义为居住、停留；此处与“我的灵”和介词“在……身上”搭配，以“停留”自然表达持续临在之意。
- source_word: ዲበ (diba)
  choice: 在人身上
  rationale: 该介词明确表示“在……之上/身上”，不按《创世记》的常见措辞协调为“在人里面”。
- source_word: ሰብእ (sabʾ)
  choice: 人
  rationale: 此处为集合意义，泛指人类；汉语单数“人”可自然承载这一含义。
- source_word: እሙንቱኒ (ʾǝmuntu-ni)
  choice: 他们也
  rationale: 代词“他们”所带附着词-ni具有“也、同样”的含义，应在译文中保留。
- source_word: ሥጋ (śǝga)
  choice: 不过是血肉之躯
  rationale: 本义为“肉、血肉”；“血肉之躯”符合现代汉语，并以“不过是”体现句中对人属肉体、有限本质的强调，但不把它具体解释为某种教义判断。
- source_word: መዋዕሊሆሙ (mawāʿǝlihomu)
  choice: 他们的年日
  rationale: 字面为“他们的日子”；“年日”是庄重而易懂的汉语圣经语体，并适合后接年数。
theological_decisions:
- issue: “一百二十年”指个体寿命上限，还是洪水前的期限
  choice: 保留“他们的年日将是一百二十年”的开放表达
  alternative: 明确译作“我再给他们一百二十年”或“人的寿命将以一百二十岁为限”
  rationale: 原文自身未明说这是审判倒计时还是寿命上限；译文不替读者消除这一真实歧义。
- issue: 神的灵与人的空间关系
  choice: 译作“停留在人身上”
  alternative: “住在人里面”
  rationale: 忠实保留吉兹语介词ዲበ“在……之上/身上”，避免向《创世记》其他传统译法靠拢。
- issue: “他们也不过是血肉之躯”的神学含义
  choice: 仅陈述人的血肉属性
  alternative: 解释为人的必死性、败坏性或与某一群体的类比
  rationale: 附着词-ni要求保留“也”，但其比较对象及“血肉”的具体神学内涵并未在本句说明，不宜扩释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“停留在人身上”有意保留源文介词的独特表达；“年日”维持经文语体。正文所有脚注标记均已对应列出。
