  yaml_path: translation/extra_canonical/jubilees/005/023.yaml
  text: And he entered it in its sixth year[a], in the second month, on the new moon of the second month, until the sixteenth; and he entered, he and all that we brought to him, into the ark, and the Lord shut it from outside on the seventeenth evening.
translation:
  language: zh_hans
  text: 在这一周期的第六年[a]，二月，从二月朔日直到十六日，他进了方舟；他和我们带到他那里的一切也都进了方舟。十七日晚上，主从外面把方舟关上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的日期句式较难确定。“从二月朔日直到十六日……十七日晚上”很可能是在说明进入方舟的时段，以及主在洪水开始前夕将方舟关上。
    reason: segmentation_note
lexical_decisions:
- source_word: በሳድስ፡ ሎቱ
  choice: 在这一周期的第六年
  rationale: በሳድስ意为“第六”，结合上文的禧年周期纪年，以“这一周期”补明所指；不按《创世记》背景改作“第六百年”。
- source_word: በሠርቅ፡ ለካልእ፡ ወርኀ
  choice: 二月朔日
  rationale: ሠርቅ在本书历法语境中指新月；“朔日”是现代汉语中简洁而准确的历法表达，保留“新月”这一概念，而不泛化为普通的“第一日”。
- source_word: ዘአባእነ፡ ሎቱ
  choice: 我们带到他那里的一切
  rationale: 保留原文第一人称复数“我们带来”及间接宾语“给他／到他那里”，不改成无主语的被动表达。
- source_word: ዐጸዎ፡ እግዚአብሔር፡ እንተ፡ አፍአሁ
  choice: 主从外面把方舟关上
  rationale: 按原文表达主在外面关上方舟；中文补出“方舟”以明确宾语，避免代词含混。
theological_decisions:
- issue: 挪亚入方舟之年的纪年
  choice: 第六年
  alternative: 第六百年
  rationale: 原文明确使用“第六”（በሳድስ），且承接《禧年书》自身的周期纪年；不以《创世记》挪亚六百岁的记载改写本节。
translation_notes:
  register: 采用庄重、清楚的现代书面汉语。“朔日”虽略带历法色彩，但在现代中文中仍通行，并能准确保留原文的“新月”术语。分号保留原文两次“进入”的推进关系，同时使日期层次易于理解。
