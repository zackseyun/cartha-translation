lexical_decisions:
- source_word: ወአዘዞ
  choice: 他吩咐
  rationale: 该词表达命令、吩咐；主语承接上下文，保留原文第三人称单数。
- source_word: ታቦተ
  choice: 方舟
  rationale: 此处指挪亚为躲避洪水而造的舟，采用现代中文圣经传统中清楚而通行的译法。
- source_word: ይድኀኖ
  choice: 得救
  rationale: 该动词表示被拯救、获救；保留其被动或结果意味，不具体限定施救方式。
- source_word: ማየ፡ አይኅ
  choice: 洪水
  rationale: 字面为“洪水的水”，汉语译作“洪水”即可自然表达所指，并避免冗赘。
theological_decisions:
- issue: 获救的主体与方式
  choice: 好使他从洪水中得救
  alternative: 好使他逃过洪水
  rationale: “得救”较贴近原文动词的救援意味，同时不额外说明施救者或机制。
translation_notes:
