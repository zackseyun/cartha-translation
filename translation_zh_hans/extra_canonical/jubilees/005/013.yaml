revisions:
- from: 他规定了这一切，这一切也写在天上的版上；毫无不公。[a]凡偏离那条为他们规定、要他们行在其中的道路的人——
  to: 这一切，他都规定了，并写在天上的石版上；毫无不公。[a]凡偏离那条为他们规定、要他们行在其中的道路的人——
  rationale: 修订仅改善首句对原文连续主动动词的呈现，并将不自然的“天上的版”改为“天上的石版”。保留独立的“毫无不公”分句、其后开启的“凡……的人”悬置结构及末尾破折号，以免将“不公”错误地直接归于偏离者，并如实标示句子延续至下一节。
