  text: And all this was ordained and written on the heavenly tablets, and there is no injustice; and all who depart from the path that was ordained for them to walk in—
translation:
  language: zh_hans
  text: 这一切，他都规定了，并写在天上的石版上；毫无不公。[a]凡偏离那条为他们规定、要他们行在其中的道路的人——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一种句法连接可译为：“对于所有偏离那条为他们规定、要他们行在其中的道路的人，也没有不公——”
    reason: 原文连续使用连接词，分句边界存在一定句法歧义；正文采用较符合连接词和跨节悬置结构的理解。
lexical_decisions:
- source_word: ሠርዐ / ሠርዐተ
  choice: 规定／为……规定
  rationale: 保留同一词根在本节中的重复，表达设定、命定规范之意；现代汉语用“规定”自然清楚，也不额外引入宗派性术语。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版
  rationale: 直译“天之版（复数）”，并与《禧年书》中记载天上法令与事件的固定意象相符。
- source_word: ዐመፃ
  choice: 不公
  rationale: 此处表示不义、不公正；“毫无不公”既贴近原文，也保留其所指可能是裁断或安排本身的开放性。
- source_word: ተዐደዉ፡ እምፍኖተ
  choice: 偏离……道路
  rationale: 准确表达离开、越出道路，而不把动作强化为某种特定教义意义上的“背道”。
- source_word: ይሖሩ፡ ባቲ
  choice: 行在其中
  rationale: 保留闪语式“在道路中行走”的意象，同时在现代汉语中仍庄重易懂。
theological_decisions:
- issue: “毫无不公”与后面“凡偏离……的人”的句法关系
  choice: 以分句隔开，将“凡偏离……”视为下一句的起首
  alternative: “对于所有偏离……道路的人，也没有不公”
  rationale: 原文在“凡……的人”之前有连接词，最自然地开启新分句；而且该主语在下一节才得到谓语。这样可避免误读为偏离道路本身并非不义，或偏离者不会受到不公。脚注仍交代较少采用的句法连接可能。
- issue: 本节末尾的不完整结构
  choice: 以破折号收尾
  alternative: 以句号结束
  rationale: 原文末尾的“凡偏离……道路的人”是悬置成分，句意延续到下一节；破折号忠实提示跨节延续，不擅自补足内容。
- issue: 规定者的身份
  choice: 译出原文动词所含的第三人称单数主语“他”
  alternative: 改为被动式“这一切都已规定”
  rationale: 吉兹语首个动词为第三人称阳性单数主动形式。使用“他”保留语法信息，而不在本节中额外添加“上帝”等解释性称谓。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“行在其中”保留经文道路意象；末尾破折号明确表示句子在下一节继续。
