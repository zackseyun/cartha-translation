  text: And the Lord remembered Rachel and opened her womb, and she conceived and bore a son, and she called his name
translation:
  language: zh_hans
  text: 上帝顾念拉结，打开了她的子宫；她就怀孕，生了一个儿子，给他起名叫[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节在现存所引文本中到“给他起名叫”便中止，名字见下文。
    reason: 提示读者句末的不完整来自来源文本的篇章衔接，而非译文遗漏；同时保留原文未完成的命名结构。
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 此处指以色列的上帝；采用现代中文圣经叙事中自然且明确的专名表达。
- source_word: ለራሔል
  choice: 拉结
  rationale: 按通行中文圣经人名译法音译 Rachel。
- source_word: አርኀወ ማኅፀና
  choice: 开了她的子宫
  rationale: 较直接地保留原文关于生育能力的身体意象；不弱化为仅仅“使她能生育”。
- source_word: ፀንሰት
  choice: 怀孕
  rationale: 准确表达“受孕、怀胎”，符合现代汉语叙事习惯。
- source_word: ወለደት ወልደ
  choice: 生了一个儿子
  rationale: 保留原文明确的男性后裔，并采用自然的现代汉语措辞。
- source_word: ጸውዐት ስሞ
  choice: 给他起名叫
  rationale: 原文直义为“她称他的名”；此句在所给来源中止于命名引语之前，因此保留未完结构。
theological_decisions:
- issue: 上帝的“顾念”
  choice: 顾念
  alternative: 记念
  rationale: 该词表达上帝眷顾并采取行动，并非暗示此前遗忘；“顾念”在现代汉语中更自然，同时保留神学张力。
- issue: 生育能力与上帝行动的关系
  choice: 开了她的子宫
  alternative: 使她能够怀孕
  rationale: 保留原文将受孕归于上帝行动的明确表达，不改写为抽象或纯自然主义说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；句式简洁，保留连续叙事节奏。以“子宫”直译身体意象，避免较古雅且可能含混的“胎”；句末按来源保留开放结构，并以脚注说明。
