  text: Leah conceived and bore Jacob a second son, and he called his name Simeon, on the twenty-first.
translation:
  language: zh_hans
  text: 利亚怀孕，为雅各生了第二个儿子；雅各给他起名叫西缅。这事发生在二十一日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልያ
  choice: 利亚
  rationale: 采用该圣经人物通行的现代中文译名。
- source_word: ወፀንሰት ወወለደት
  choice: 怀孕，……生了
  rationale: 两个动词均为阴性单数，主语是利亚；以自然中文保留动作次序。
- source_word: ለያዕቆብ ወልደ ካልአ
  choice: 给雅各生了第二个儿子
  rationale: 准确表达与格关系及“第二个儿子”的次序。
- source_word: ወጸውዐ ስሞ
  choice: 他给孩子起名叫
  rationale: ጸውዐ为第三人称阳性单数，故保留男性主语“他”，即上下文中的雅各；不按《创世记》的平行叙事改成“她”。
- source_word: ስምዖን
  choice: 西缅
  rationale: 采用该人物通行的现代中文译名。
- source_word: አመ ፲ሥራ
  choice: 那是在二十一日
  rationale: አመ引出日期；数词按所给校勘文本及经审核的咨询译文理解为“二十一日”。独立成句，使中文日期表达清楚。
theological_decisions:
- issue: 给西缅起名者的性别
  choice: 译作“他”，指雅各
  alternative: 译作“她”，指利亚
  rationale: 原文此前“怀孕”“生”使用阴性形式，而“起名”明确转为第三人称阳性单数；应保留《禧年书》此处与《创世记》平行记载之间的差异，不作协调。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“给孩子起名叫”比直译“称他的名为”更符合当代普通话，同时借“他”清楚保留原文起名动词的阳性主语。
