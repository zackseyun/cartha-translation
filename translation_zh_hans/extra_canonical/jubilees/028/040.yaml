lexical_decisions:
- source_word: ለወርኅ፡ ሳብዕ፡
  choice: 在第七月
  rationale: 按时间状语自然译出月份；格厄兹语结构在此表达事情发生的月份。
- source_word: በካልእ፡ ዓም፡ ዘሱባዔ፡ ራብዕ።
  choice: 也就是第四个七年期的第二年
  rationale: “ሱባዔ”在《禧年书》的年代体系中指由七年组成的周期；译作“七年期”比单独译作“周”更能让现代读者明白其计年含义。
- source_word: አቀመት፡ ወኢትወልድ፡
  choice: 已经停止生育
  rationale: 两个相连的表达共同说明利亚不再生产；中文合译可避免“停止了，并且不生育”的生硬重复，同时保留完成状态。
