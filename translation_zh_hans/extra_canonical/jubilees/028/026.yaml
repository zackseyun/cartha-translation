  text: the LORD saw that Leah was hated, while Rachel was loved. And Jacob again went in to
translation:
  language: zh_hans
  text: 主看见利亚受冷落，拉结却蒙爱。雅各又进到[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文在“进到”处结束；其宾语“拉结”见下一节。
    reason: 说明原文句法跨越节界，避免补入“她”而在下一节与“拉结”重复。
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 主
  rationale: 该词在此指上帝；译作“主”符合经文体例，也保持庄重自然。
- source_word: ትጸላእ
  choice: 受冷落
  rationale: 字面可作“被恨”，但在利亚与拉结受宠程度的对比语境中，表达相对失宠；“受冷落”避免误解为强烈仇恨，同时保留不受爱的张力。
- source_word: ትትፈቀር
  choice: 蒙爱
  rationale: 与利亚“受冷落”形成直接对比，准确表达被爱的状态。
- source_word: ደገመ
  choice: 又
  rationale: 表示动作再次发生。
- source_word: ቦአ
  choice: 进去
  rationale: 该动词在婚姻叙事中含有“进到女子那里”的委婉意味；译作“进去”保留原文措辞及含蓄性。
- source_word: ኀበ
  choice: 到
  rationale: 本节止于介词，宾语位于下一节；保留未完结构，以便与下节衔接。
theological_decisions:
- issue: “利亚被恨”是绝对仇恨还是相对失宠
  choice: 受冷落
  alternative: 被恨
  rationale: 上下文以利亚和拉结受爱的程度作对照；所选译法传达利亚不受宠爱的处境，又不把语义过度强化为敌意。
- issue: 雅各“进去”的委婉性
  choice: 保留“进去”
  alternative: 与她同房
  rationale: 原文采用含蓄表达，不宜在正文中把潜在的性含义完全明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。因原文句子跨越节界，本节有意保留“到”后的悬接结构，并用脚注说明。
