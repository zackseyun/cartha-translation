  text: and take your wages.” And they agreed between themselves that he would give him as his wages every lamb
translation:
  language: zh_hans
  text: “你领取你的工钱吧。”他们彼此商定，他要把每只羊羔[a]都给他，作为他的工钱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每只小羊”。
    reason: “羊羔”与“小羊”均可表达原文对幼畜的限定。
  - marker: b
    text: 或译：“给他作报酬”。
    reason: “工钱”较贴近劳动所得，“报酬”则是较宽泛的自然表达；两者都保留原文的酬偿关系。
lexical_decisions:
- source_word: ዐስበከ
  choice: 你的工钱
  rationale: 保留名词“工钱”及第二人称单数领属后缀；“领取”承接命令式动词 ንሣእ。
- source_word: ተካሀሉ በበይናቲሆሙ
  choice: 他们彼此商定
  rationale: 自然表达双方相互达成约定的含义，同时保留“彼此”这一相互关系。
- source_word: ዐስቦ
  choice: 他的工钱
  rationale: 明确体现第三人称阳性单数领属后缀，避免只译成泛指的“工钱”。
- source_word: ኵሎ በግዐ እመሐስዕ
  choice: 每只羊羔
  rationale: ኵሎ 表示周遍意义；末词限定为幼畜，因此正文采用“羊羔”，而不笼统译作“羊”。
