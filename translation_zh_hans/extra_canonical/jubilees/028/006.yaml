  text: But Jacob did not know, for he thought that she was Rachel. And he went in to her, and behold,
translation:
  language: zh_hans
  text: 雅各却不知道，因为他以为她是拉结。他便与她同房。看哪，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢያእመረ
  choice: 不知道
  rationale: 直译否定式动词“未曾知道／不知道”，保留雅各当时不知情的陈述。
- source_word: አምሳለ
  choice: 以为
  rationale: 此处表达雅各对女子身份的认定；现代汉语用“以为”自然清楚，也保留其认知有误的含义。
- source_word: ወቦአ፡ ኀቤሃ
  choice: 便与她同房
  rationale: 字面为“进去到她那里”，在婚姻叙事语境中是委婉的性关系表达；采用现代中文圣经语体常见且易懂的对应说法。
- source_word: ወናሁ
  choice: 看哪
  rationale: 保留叙事中的提示词及其悬宕效果，因为本节原文在此处未完。
theological_decisions:
- issue: 雅各是否识破女子身份
  choice: 明确表述雅各“不知道”，并说明他以为女子是拉结
  alternative: 弱化为“没有认出来”
  rationale: 源文直接陈述认知状态，不应改写为仅仅视觉上未能辨认，也不对欺骗事件附加原文没有明说的道德或神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“与她同房”传达源文委婉语的实际含义；末尾保留“看哪，”及逗号，以反映现存分节在此形成的悬接。
