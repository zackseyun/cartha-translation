  text: he brings up sin against himself into heaven, and no one who does this thing is righteous, for
translation:
  language: zh_hans
  text: 他把罪孽带到天上来控告自己〔a〕；凡做这事的人，没有一个是义人〔b〕，因为
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አበሳ
  choice: 罪孽
  rationale: 该词可指罪、过犯或罪责；“罪孽”在此兼顾行为及其罪责，语体庄重而自然。
- source_word: ያዐርግ
  choice: 把……带到天上
  rationale: 这是使役形，表示“使上升、带上去”，保留行为人主动使罪孽上达的语义，不译成不及物的“升到”。
- source_word: በእንቲአሁ
  choice: 使之成为控告自己的证据
  rationale: 字面涉及“因他／针对他”；结合罪孽上达天上的司法性语境，以此表达罪归到行为人自己身上，同时避免误解为他控告自己。
- source_word: ይጸድቅ
  choice: 是义人
  rationale: 在否定存在结构中按谓语意义自然表达为“没有一个是义人”，保留称义／为义的语义。
- source_word: ዘንተ ነገረ
  choice: 这事
  rationale: 直译为“这件事”，现代汉语用“这事”简洁自然，并承接前述行为。
- source_word: እስመ
  choice: 因为
  rationale: 原句止于因果连接词，译文保留未完句式，以便与下一节衔接。
theological_decisions:
- issue: 罪孽上达天上的主语与使役关系
  choice: 由行为人“把罪孽带到天上”
  alternative: “他的罪孽因他升到天上”
  rationale: 抄本所见动词为使役词干，宜保留行为人作主语、罪孽作受事；另一读法虽符合较早译法，却削弱了形态上的使役性。
- issue: “因他／针对他”的司法含义
  choice: 译作“使之成为控告自己的证据”
  alternative: 较字面地译作“为他／因他”
  rationale: 介词短语本身可有多重关系；正文以自然汉语呈现罪孽上达而反过来指证行为人的意义，但不引入特定宗派教义。
- issue: 行这事者与义的关系
  choice: “凡做这事的人，没有一个是义人”
  alternative: “没有义人做这事”
  rationale: 前者明确陈述行此事的人不为义，避免后者仅像是在描述义人群体中无人碰巧如此行。
translation_notes:
  register: 采用现代、庄重且通顺的书面普通话。保留结尾“因为”的悬接状态，反映源文片段尚未完结；本节未设脚注，故正文无脚注标记。
