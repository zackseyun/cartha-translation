  text: She did not bear children, and she said to Jacob, “Give me children.” And Jacob said, “Have I withheld from you?”
translation:
  language: zh_hans
  text: 她没有生育，就对雅各说：“给我孩子。”雅各说：“难道是我扣留了什么、没有给你吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现存文本的末句宾语省略，直译近于“难道是我从你那里扣留了吗？”。上下文可使人联想到生育或孩子，但原文并未明说所扣留的具体事物。
    reason: 保留原文宾语省略及其歧义，同时说明上下文所形成的自然理解，不按平行经文补足本节未明示的内容。
lexical_decisions:
- source_word: ኢትወልድ
  choice: 她没有生育
  rationale: 该否定动词表达她未曾生育；补出承接上文的女性主语，使现代汉语自然。
- source_word: ሀበኒ፡ ውሉደ
  choice: 给我孩子
  rationale: 直译祈使表达，保留说话者急切而简短的语气。
- source_word: ከላእኩ፡ እምኔኪ
  choice: 是我不让你生育吗
  rationale: ከልአ 表示阻止、扣留；结合生育语境译为“不让你生育”，同时保留反问形式。
theological_decisions:
- issue: 雅各反问的施事与经文残句
  choice: 将现存问句译为“难道是我不让你生育吗？”，不补出上帝或后续内容
  alternative: “难道是我扣留了你的孩子吗？”或依《创世记》30:2补成“难道是我代替上帝，使你不能生育吗？”
  rationale: 格厄兹文本到“我从你那里阻止/扣留了吗”即止；译文按生育语境作最低限度的汉语显化，但不从平行经文补入本节未保存的神学主语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；人物对话简洁直接。末句以自然汉语表达其反问，并用脚注交代原文省略，避免擅自按平行经文扩写。
