  text: '[He took] Leah his elder daughter, and gave her to Jacob as a wife, and he gave her Zilpah his maidservant as a handmaid.'
translation:
  language: zh_hans
  text: '[拉班带着][a]他的大女儿利亚来，把她给雅各为妻，又把自己的婢女悉帕给利亚作使女。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文因分节从“他的大女儿利亚”起首，承接上文；“拉班带着”是为使本节可独立成句而按上下文补出。
    reason: 说明方括号中的主语及承接动作并非本节分节起首处的明文，同时避免将补语误作原文另有完整句子。
lexical_decisions:
- source_word: እንተ፡ ትልህቅ
  choice: 大女儿
  rationale: 该短语直指利亚是年长的女儿；现代汉语以“大女儿”自然表达这一亲属排行。
- source_word: ብእሲተ
  choice: 为妻
  rationale: 该词表示“妻子、妇人”；在“给雅各”的结构中译为“给雅各为妻”，既贴近原文又符合庄重的现代汉语。
- source_word: ዘለፋሃ፡ አመተ
  choice: 自己的婢女悉帕
  rationale: 原文将悉帕称为他的女性仆役；“婢女”保留其从属身份，也与随后给利亚作使女的关系相符。
- source_word: ለእኪት
  choice: 作使女
  rationale: 该词在此指服侍女主人的女性仆役；“使女”既准确又符合经卷叙事语体。
theological_decisions:
- issue: 本节开头因分节而缺少支配“利亚”的动词
  choice: 在方括号内补出“拉班带来了”
  alternative: 直译为“他的大女儿利亚，把她给雅各为妻”
  rationale: 现存本节以宾格“利亚”起首，语法上承接上一节，单独成节时会成为残句。补语仅为恢复上下文隐含的动作和主语，并用方括号明确标示非本节明文；不改变叙事含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“给雅各为妻”“作使女”保留古代叙事关系而不过度古奥；方括号及脚注如实呈现分节导致的原文残缺。
