lexical_decisions:
- source_word: ሱባዔ
  choice: 七日
  rationale: 该词指一个七日周期；结合婚娶语境，译作“七日”既保留原文的周期概念，也自然衔接下文婚宴的七天。
- source_word: ቀዳማ
  choice: 第一个
  rationale: 按原文保留序数含义，不擅自明确为利亚或拉结的婚宴周期。
- source_word: ሰቡዕ፡ ዕለት
  choice: 七天
  rationale: 原文表达七日的时段，现代汉语自然译作“七天”。
- source_word: ዘግዝአ፡ ዘልያ
  choice: 利亚婚宴的
  rationale: 该短语依语境修饰前述七天，指属于利亚的婚庆时段；译作“利亚婚宴的七天”清楚而不增加额外情节。
