  text: “我服侍你是为了拉结，不是为了利亚。你为什么亏负我？把你的女儿带走吧，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተቀነይኩ፡ ለከ
  choice: 我服侍你
  rationale: 明确保留第一人称动词和第二人称受事，符合原文句法，也使现代汉语自然清楚。
- source_word: በእንተ፡ ራሔል
  choice: 是为了拉结
  rationale: “为了”准确表达此处所服侍的目的或缘由；采用通行人名“拉结”。
- source_word: 7ፋዕከኒ
  choice: 亏负我
  rationale: 原文所指不止于一般失误，而含不公对待之意；“亏负”保留较宽的道德含义，不擅自限定为某一种欺骗手段。
- source_word: ንግአ፡ ወሰተከ
  choice: 把你的女儿带走吧
  rationale: 以自然的现代汉语表达命令语气；“带走”在对话场景中比孤立的“拿走”更适合用于人。
