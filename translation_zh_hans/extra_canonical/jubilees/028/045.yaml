  text: And Jacob went in to Leah, and she conceived and bore a son, and she called his name Issachar, on the fourth day.
translation:
  language: zh_hans
  text: 雅各与利亚同房；利亚怀孕，生了一个儿子，给他起名叫以萨迦。这是在第四日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦአ፡ ... ኀበ፡ ሊያ
  choice: 与利亚同房
  rationale: 该闪语式表达字面为“进去到利亚那里”，在婚姻与受孕语境中是委婉指夫妻同房；采用现代汉语自然且庄重的对应表达。
- source_word: ጸውዐት፡ ስሞ፡
  choice: 给他起名叫
  rationale: 原文意为“她称他的名”；译作“给他起名叫”符合现代汉语命名叙述。
- source_word: ይሳኮር
  choice: 以萨迦
  rationale: 采用中文圣经传统通行人名译法。
- source_word: በራብዑ፡
  choice: 本月初四
  rationale: 该词组意为“在第四日”。依本章按月份逐日记事的上下文，将隐含的月日关系在汉语中自然表达为“本月初四”，避免误读为生产过程的第四天。
