  text: And Jacob’s possessions increased greatly, and he acquired cattle and sheep and donkeys and camels.
translation:
  language: zh_hans
  text: 雅各的财产大大增多，并获得了牛、羊、驴和骆驼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጥሪቱ
  choice: 财产
  rationale: 指雅各所拥有的产业或财富；结合后列牲畜，译作“财产”自然且不过度缩窄为牲畜。
- source_word: በዝኅ … ጥቀ
  choice: 大大增多
  rationale: 保留动词“增多”及强化语“极其、非常”的意义，符合现代汉语表达。
- source_word: አጥረየ
  choice: 置办了
  rationale: 表达取得、积聚财物之意；“置办”适用于牲畜等产业，也比单纯“有了”更能体现获取过程。
- source_word: አልህምተ
  choice: 牛
  rationale: 该词在此为牲畜类别，按语境译作“牛”。
- source_word: አባግዐ
  choice: 羊
  rationale: 泛指羊群；原文未要求区分绵羊或山羊，故保留概称。
- source_word: አእዱገ
  choice: 驴
  rationale: 原文明确列出驴，不应遗漏。
- source_word: አገማለ
  choice: 骆驼
  rationale: 对应骆驼这一牲畜类别。
