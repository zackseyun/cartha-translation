  text: The sheep bore according to their kinds; and every one with marks belonged to Jacob, and every one without marks to Laban.
translation:
  language: zh_hans
  text: 羊群按各自的样式产仔；凡有斑纹的都归雅各，凡没有斑纹的都归拉班。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዐ
  choice: 羊群
  rationale: 该词明确是句子的主语，指羊；译作“羊群”符合畜群叙事语境，也避免漏译。
- source_word: ይለዳ
  choice: 产仔
  rationale: 动词表示生育；在牲畜语境中，“产仔”比泛称“生”更自然、准确。
- source_word: ዘበአርአያሆን
  choice: 按各自的样式
  rationale: 保留原文“按其样式/外观”的表达，不擅自具体化为某一种斑纹。
- source_word: ትእምርት
  choice: 斑纹
  rationale: 此处指可见的标记；结合雅各与拉班分配牲畜的语境，译作“斑纹”自然明确，同时保留标记性质。
- source_word: ለያዕቆብ / ለላባ
  choice: 归雅各 / 归拉班
  rationale: 与格形式在本句表达所属或分配关系，现代汉语用“归”简洁自然。
