  text: and I will give you Rachel also, if you will serve me another seven years and pasture my sheep,
translation:
  language: zh_hans
  text: 我也会把拉结给你，只要你再服侍我七年，并牧放我的羊群。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእሁበከ
  choice: 我也会……给你
  rationale: 保留将来应许的语气；连词与后接的“拉结也”自然合并表达。
- source_word: ራሔልሃ
  choice: 拉结
  rationale: 采用该人物在现代中文圣经传统中的通行译名；词形中的附加成分按语境体现为“也”。
- source_word: ትትቀነይ፡ ሊተ
  choice: 你……服侍我
  rationale: 直接表达对拉班服役的关系，措辞庄重而自然。
- source_word: ካልአነ፡ ዓመተ፡ ሰብዐተ
  choice: 再……七年
  rationale: “另一个七年”在现代汉语中自然译为“再七年”。
- source_word: ትርዐይ፡ አባግዐየ
  choice: 牧放我的羊群
  rationale: 动词指牧养、放牧；“羊群”比单数式的“羊”更符合汉语牧养语境。
theological_decisions:
- issue: 服侍七年与牧羊之间的句法关系
  choice: 用“并”连接“服侍我”与“牧放我的羊群”
  alternative: 译作“在牧放我的羊群期间服侍我七年”
  rationale: 源文顺次连接两个动作，并未明确把牧羊仅处理为时间背景；“并”保留较直接的并列关系，也与审定英文层一致。
- issue: 条件关系的表达
  choice: 译为“只要你……”
  alternative: 译为“如果你……”
  rationale: 本句是以继续服役为交换条件的承诺；“只要”在现代汉语中自然呈现该条件，同时不额外引入神学解释。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言；避免生硬照搬“另一个七年”，也不把牧羊从服侍内容中解释性地分离。
