  text: thus it is ordained and written on the heavenly tablets that no one should give the younger daughter
translation:
  language: zh_hans
  text: 因此，天上的石版上已有规定，也有记载：任何人都不可把小女儿嫁出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在此尚未说完；禁令的具体条件承接下文，即不可在大女儿之前先把小女儿嫁出去。
    reason: 避免读者把本节截断后的措辞误解为永远不得嫁小女儿，同时不把下一节文字直接补入正文。
lexical_decisions:
- source_word: ሥሩዕ፡ ወጽሑፍ
  choice: 规定并写着
  rationale: 分别保留“被规定”和“被写下”两个并列概念，同时采用自然的现代汉语表达。
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的版
  rationale: 直译其复合意象，保留《禧年书》中天上记录载体的具体形象，而不解释为抽象的“天条”。
- source_word: የሀብ፡ ወለተ
  choice: 把……女儿嫁出去
  rationale: 原文动词基本义为“给”，在父亲将女儿给人婚配的语境中，以“嫁出去”表达其实际含义。
- source_word: እንተ፡ ትንእስ
  choice: 小女儿
  rationale: 该短语意为“年幼的女儿”；结合本章利亚与拉结的长幼婚配语境，译为自然且关系明确的“小女儿”。
theological_decisions:
- issue: “天上的版”所载规定的权威性质
  choice: 保留“规定并写着”的双重措辞
  alternative: 简化为“天条规定”或“经上记着”
  rationale: 原文同时陈述其被规定并被写下，没有说明这是否等同摩西律法或一般圣经经文；译文不替原文作体系化判断。
- issue: 本句禁令的完整范围
  choice: 按现存短句译出，并以脚注提示句意承接下文
  alternative: 从下文补入“在大女儿以前”等限定语
  rationale: 所给原文在“小女儿”处结束，禁令的比较条件由后文补足；正文不把下一节内容提前并入本节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“天上的版”保留原文物质性意象；“嫁出去”则将婚配语境中直译生硬的“给女儿”自然化。
