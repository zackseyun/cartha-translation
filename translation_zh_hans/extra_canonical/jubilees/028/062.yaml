  text: He was a three days' journey from him. And Jacob saw that Laban had gone to shear.
translation:
  language: zh_hans
  text: 他离拉班有三天的路程。[a]雅各看见拉班已经去剪羊毛了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他与拉班之间相隔三天的路程。”
    reason: 原文“离他有三天的路程”的句法可译为主体距某人三日路程，也可侧重双方之间的距离；脚注保留这一表达差异。
lexical_decisions:
- source_word: ሀሎ፡ እምኔሁ፡ ምሕዋረ፡ ሠሉስ፡ ዕለት
  choice: 他离拉班有三天的路程
  rationale: ሀሎ表达“有、相隔”的状态；እምኔሁ为“离他”，结合下句将所指对象明示为拉班，以避免现代汉语代词含混；ምሕዋረ ሠሉስ ዕለት意为“三天的路程”。
- source_word: ወርእየ፡ ያዕቆብ
  choice: 雅各见
  rationale: 按原文顺序自然表达“雅各看见／察觉”；此处“见”简洁而庄重。
- source_word: ከመ፡ የሐውር፡ ላባ፡ ይቅርጽ
  choice: 拉班去剪羊毛了
  rationale: የሐውር表示“去、前往”，ይቅርጽ表示“剪（羊毛）”；汉语补出宾语“羊毛”，使动作明确自然，句末“了”表达已经离去的状态。
theological_decisions: []
