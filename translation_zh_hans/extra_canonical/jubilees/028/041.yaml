  register: 采用自然、庄重的现代标准普通话。原文先说“她也”，后以阴性动词连续叙述怀孕和生产；中文补出“悉帕”以消除代词指向歧义。未保留英文咨询层的词序脚注，因为吉兹语形态清楚支持“她也”。
