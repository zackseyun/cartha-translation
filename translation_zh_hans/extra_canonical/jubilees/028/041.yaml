  language: zh_hans
  text: 她也把自己的婢女悉帕给雅各作妻子；悉帕怀孕并生了孩子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይእቲኒ
  choice: 她也
  rationale: 独立阴性单数代词加“也”附着词，承接叙事中的平行动作；置于主语后符合现代汉语表达。
- source_word: ዜልፋሃ
  choice: 悉帕
  rationale: 采用该人物在现代中文圣经传统中通行的音译。
- source_word: ለአኪታ
  choice: 自己的婢女
  rationale: 指女主人所属的女仆；“婢女”兼顾古代社会身份与庄重、易懂的现代汉语。
- source_word: ብእሲተ
  choice: 为妻
  rationale: 该词表示妻子或女人；在“给雅各”的结构中表示将她给雅各作妻子。
- source_word: ወፀንሰት፡ ወወለደት
  choice: 就怀孕生子
  rationale: 保留“怀孕—生产”的动作次序；原文未明说孩子性别，但中文“生子”在此泛指生下孩子，避免句末悬空。
