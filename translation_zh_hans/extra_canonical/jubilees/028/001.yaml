  text: And he lifted up his feet and went to the land of the east, to Laban, the brother of Rebekah, and he stayed with him.
translation:
  language: zh_hans
  text: 他抬起脚，前往东方之地，到利百加的兄弟拉班那里；他就住在拉班那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንሥአ፡ እገሪሁ
  choice: 他抬脚出发
  rationale: 保留原文“抬起他的脚”的具体意象，同时用“出发”使现代汉语读者清楚其启程之意。
- source_word: ምድረ፡ ጽባሕ
  choice: 东方之地
  rationale: 该词组字面涉及“日出之地”，在语境中指东方地区；译作“东方之地”既自然，又保留地域表达。
- source_word: ኀበ፡ ላባ
  choice: 到了拉班那里
  rationale: 介词可表达趋向；结合行程语境，以“到了……那里”清楚呈现目的地。
- source_word: እኁሃ፡ ለርብቃ
  choice: 利百加的哥哥
  rationale: 原词表示男性同胞；汉语“哥哥”自然明确，同时符合拉班与利百加的亲属关系。
- source_word: ወሀሎ፡ ምስሌሁ
  choice: 他就住在拉班那里
  rationale: 原文可直译为“他与他同在/留在他那里”；语境描述寄居，译作“住在……那里”自然且不额外限定时长。
