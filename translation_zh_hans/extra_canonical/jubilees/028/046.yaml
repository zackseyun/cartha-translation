  language: zh_hans
  text: 在第四个七年的第四年五月，她把他交给乳母。雅各又进去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለኃምስ ወርኅ
  choice: 五月
  rationale: 该短语表示“第五个月”；译作“五月”符合现代汉语纪年表达。
- source_word: ዘሱባዔ ራብዕ
  choice: 第四个七年
  rationale: 保留《禧年书》按七年周期计时的方式，不泛化为普通“时期”。
- source_word: ወወሀበተ ለሐፂኒት
  choice: 她把他交给乳母
  rationale: 动词为阴性主语“她给/交付”，间接对象指乳母；代词所指依上下文保留为“他”。
- source_word: ወቦአ ያዕቆብ ዳግመ
  choice: 雅各又进去与她同房
  rationale: 字面为“雅各再次进去”；在生育叙事中是委婉的同房表达，汉语补出“与她同房”以传达语境含义。
