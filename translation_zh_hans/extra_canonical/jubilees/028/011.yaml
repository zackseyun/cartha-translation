  text: 她的眼睛。[a]她的容貌美丽，十分可爱。拉班对雅各说：“不是这样做的……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她的眼睛”在本节的原文分段中是一个悬置的短语，语意承接上一句；后面的“美丽”在吉兹语中为单数，修饰“容貌”，并不修饰复数的“眼睛”。
    reason: 说明原文分节造成的断句，并避免把“美丽”误解为对“眼睛”的描写。
lexical_decisions:
- source_word: ራእያ
  choice: 容貌
  rationale: 该词在这里指可见的外表或容貌；用“容貌”既自然，又与单数形容词“美丽”在语法上相合。
- source_word: ላሕይት ጥቀ
  choice: 十分可爱
  rationale: 保留形容词所表达的悦人、可爱之意，并以“十分”对应加强语气的“极其”。
- source_word: ኢኮነ ከመዝ
  choice: 不可这样做
  rationale: 原文直译近于“不是这样”；结合拉班说明当地婚俗的语境，译为自然的汉语惯用表达，同时以省略号保留本节末尾未完的句势。
