  text: And he loved Rachel more than Leah, because Leah had been given to him. And the LORD opened Leah’s womb, and she conceived.
translation:
  language: zh_hans
  text: 他爱拉结胜过爱利亚，因为利亚已经被给了他。耶和华开了利亚的子宫，她就怀了孕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአፍቀራ፡ ለራሔል፡ እምልያ፡
  choice: 他爱拉结胜过爱利亚
  rationale: 本短语在所引片段中缺失，但章节分割校验与标准经文衔接表明它属于本节开头；译文补出，以恢复完整句意。
- source_word: ትውህበት
  choice: 已经被给了
  rationale: 保留被动语态和完成意义，不增添原文没有的“作为交换”等解释。
- source_word: አርኀወ፡ እግዚአብሔር፡ ማኅፀነ፡ ልያ
  choice: 耶和华使利亚能够生育
  rationale: 原文直译为“耶和华打开利亚的子宫”；采用现代汉语自然表达，同时保留生育能力由耶和华开启的含义。
- source_word: ወፀንሰት
  choice: 她就怀了孕
  rationale: 准确表达“她受孕了”，并以“就”自然承接前句。
theological_decisions:
- issue: 利亚被给雅各与雅各偏爱拉结之间的因果关系
  choice: 保留“因为”
  alternative: 改作较弱的“而”或省略因果连接
  rationale: 原文እስመ通常表示原因。即使这里的逻辑关系显得突兀，也不应替作者消解其张力。
- issue: “打开子宫”的神圣行动
  choice: 译作“使利亚能够生育”
  alternative: 直译为“打开利亚的子宫”
  rationale: 避免现代汉语中生硬甚至易误解的身体意象，同时明确保留耶和华赐予生育能力这一陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“爱拉结胜过爱利亚”保留比较结构；“能够生育”比直译“打开子宫”更符合当代普通话，同时不削弱原文的神学主语。
