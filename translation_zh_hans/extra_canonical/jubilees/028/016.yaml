- source_word: ወአንተኒ፡ አዝዝ
  choice: 你也要吩咐
  rationale: “ኒ”表达“也”，命令式动词译为“要吩咐”，符合现代汉语训令语体。
- source_word: ለደቂቀ፡ እስራኤል
  choice: 以色列子孙
  rationale: 采用经文中自然且庄重的传统表达，准确保留群体血缘称谓。
- source_word: ወአይ
