  text: 'The sixth: in the sixth year of the third week, Jacob again went in to Bilhah, and she conceived.'
translation:
  language: zh_hans
  text: 第六个：第三个七年期的第六年，雅各又与辟拉同房，她就怀了孕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 句首“第六个”可能是指雅各所得的第六个儿子。
    reason: 原文保留独立序数词而省略其所修饰的名词，需说明这一真实歧义。
lexical_decisions:
- source_word: ሳድስ
  choice: 第六个
  rationale: 保留原文句首独立的序数词；结合上下文，它很可能用于数算所生的第六个儿子，但原句未明说“儿子”，故不补入。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在《禧年书》的年代框架中指以七年为一组的时期；译作“七年期”比单说“周”更清楚。
- source_word: ደገመ / ካዕበ
  choice: 又
  rationale: 二词共同表达重复、再次之意；现代汉语用一个“又”即可自然传达，避免累赘地译成“再次又”。
- source_word: ቦአ ኀበ ባላ
  choice: 与辟拉同房
  rationale: 原文是字面意义近于“进去到辟拉那里”的委婉语；汉语以“同房”自然、庄重地表达其性关系含义。
- source_word: ፀንሰት
  choice: 怀了孕
  rationale: 准确表达女性受孕，符合现代标准汉语叙事习惯。
theological_decisions:
- issue: 句首“第六”所指为何
  choice: 译作独立的“第六个”，不明补所数对象
  alternative: 译作“第六个儿子”或省略
  rationale: 原文明确保留序数词，却没有名词；此处可能数算雅各的第六子。保留其省略结构，既不漏译，也不把语境推断写成明说内容。
- issue: 雅各进入辟拉处的表达
  choice: 采用“与辟拉同房”
  alternative: “进到辟拉那里”
  rationale: 这是源语常见的性关系委婉表达；直译在现代汉语中容易只被理解为空间移动，因此采用功能相当且不过度露骨的说法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“第三个七年期的第六年”明确呈现《禧年书》的纪年方式；“同房”保留原文委婉而明确的语气。
