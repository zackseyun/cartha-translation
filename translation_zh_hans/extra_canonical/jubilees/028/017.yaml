  language: zh_hans
  text: 要这样办：不可在先把年长的嫁出去之前，娶年幼的，或把年幼的嫁出去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግበሩ፡ ዘንተ፡ ቃለ
  choice: 要这样办
  rationale: 直译近于“做这事／照这话做”；现代汉语以“这样办”自然表达所规定的做法。
- source_word: አይንሥኡ፡ ወአየሀቡ
  choice: 不可……娶或嫁
  rationale: 保留原文“取”和“给”在婚姻语境中的双重动作，不把两者合并为单一行为。
- source_word: እንተ፡ ትንእስ
  choice: 年幼的
  rationale: 原文为阴性“较小／较年轻者”；不擅自补入“妹妹”或“女儿”，以保存指称方式。
- source_word: ያቅድሙ፡ እንተ፡ ትልህቅ
  choice: 先嫁出年长的
  rationale: 体现“使年长者在先”的次序，并按婚嫁语境自然表达；“年长的”保留原文阴性比较称谓而不明确亲属关系。
