  text: and donkeys and servants and maidservants. And Laban and his sons envied Jacob, and Laban gathered his sheep.
translation:
  language: zh_hans
  text: 还有驴、男仆和婢女。拉班和他的儿子们嫉妒雅各；拉班把自己的羊群聚集起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወደቀ፡ ወአዋልደ
  choice: 以及驴、公仆和婢女
  rationale: 本节开头承接前文财产清单；依现有分节和英语审校层译出。这里的“公仆和婢女”采用现代而庄重的常用表达。
- source_word: ወቀንአ
  choice: 嫉妒
  rationale: 该词在此表示因雅各的兴盛而生嫉妒，直译即可，未额外解释其动机。
- source_word: ላባ፡ ወውሉዱ፡
  choice: 拉班和他的儿子们
  rationale: 保留并列主语以及复数“儿子们”。
- source_word: ላዕለ፡ ያዕቆብ፡
  choice: 雅各
  rationale: 与“嫉妒”连用时，汉语直接以宾语呈现，无须机械译出介词。
- source_word: ወአስተጋብአ፡ ላባ፡ አባግዒሁ፡
  choice: 拉班便把自己的羊群聚集起来
  rationale: 忠实表达拉班聚集其羊群；不增添“带走”等原文没有的方向或目的信息。
