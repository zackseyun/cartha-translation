  text: every speckled, spotted, and white one that was born among the goats would be his wages. And they bore
translation:
  language: zh_hans
  text: 山羊中所生的，凡有细斑[a]、花斑或白色的，都作他的工价。它们便生下了……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有细斑”也可理解为“呈灰斑色”。
    reason: 该吉兹词可能侧重灰烬般的颜色，也可能指细碎斑纹；正文选择适合牲畜花色语境的表达，同时保留词义幅度。
lexical_decisions:
- source_word: አጣሊ (ʾaṭāli)
  choice: 山羊
  rationale: 该词明确指山羊；不用旧译“羊羔”。
- source_word: ሐመደ (ḥamada)
  choice: 有细斑
  rationale: 该词与“灰、灰烬”相关，可描写灰斑或细碎斑纹；按语境译为“有细斑”，并以脚注保留“灰斑色”的可能。
- source_word: ጋሰ (gāsa)
  choice: 花斑
  rationale: 与前一颜色词并列，表示带明显斑块或杂色的外观；“花斑”自然且能与“细斑”区分。
- source_word: ጸዐዳ (ṣaʿadā)
  choice: 白色
  rationale: 直译其颜色义“白”。
- source_word: ዐስቦ (ʿasbo)
  choice: 工价
  rationale: 指雅各所得的报酬，用“工价”贴合牲畜作为劳动报酬的语境。
- source_word: ወይወልዱ (wa-yəwaldū)
  choice: 它们就生下了……
  rationale: 按完成叙事理解为“它们生下了”；本节在此处截断，故以省略号体现句子延续到下文。
