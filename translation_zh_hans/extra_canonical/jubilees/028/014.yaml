  text: before the elder; first let him give the elder, and after her the younger. And the man who does thus,
translation:
  language: zh_hans
  text: 在年长的女子之前[a]；他应当先把年长的嫁出去，然后才嫁年幼的。这样做的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头承接上一节，合起来意为“把年幼的嫁在年长的之前”。
    reason: 说明原文跨节句法，避免读者把“在年长的女子之前”误解为独立成分，同时不把上一节文字直接补入正文。
lexical_decisions:
- source_word: እምእንተ፡ ትልህቅ፡
  choice: 在年长的女子之前
  rationale: 该短语承接上一节“把年幼的嫁出去”的意思；保留原文跨节形成的不完整句式，不将其误作独立分句。阴性形式按上下文译为“女子”。
- source_word: ያቀድም፡ ውሂበ፡
  choice: 他应当先把……嫁出去
  rationale: 字面义为“让他先给出”；婚嫁语境中，现代汉语自然表达为“嫁出去”，并保留命令或规范意味。
- source_word: እንተ፡ ትልህቅ፡
  choice: 年长的
  rationale: 保留比较性的年龄称谓，不擅自具体化为“长女”或“姐姐”。
- source_word: እንተ፡ ትንእስ፡
  choice: 年幼的
  rationale: 与“年长的”对称，保留原文阴性所指及相对年龄关系。
- source_word: ወበእሲ፡ ዘይገብር፡ ከመዝ፡
  choice: 这样做的人
  rationale: 贴近“而如此行的人”；末尾逗号保留本节在语法和意义上尚未结束的状态。
