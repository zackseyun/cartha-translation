  text: a house for myself, for I have completed the years for which I served you for your two daughters, and I will go.
translation:
  language: zh_hans
  text: 给我一个家吧，因为我为你的两个女儿服侍的年限已经满了；我要离开。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊተ፡ ቤተ፡
  choice: 为我自己成家
  rationale: 字面为“给我/为我，一个家（房屋）”。结合本句承接的语境，用“成家”自然表达建立自己家室之意，同时不按《创世记》的平行经文改作“把我的妻子给我”。
- source_word: ፈጸምኩ፡ ዓመታተ፡
  choice: 年限已经满了
  rationale: ፈጸምኩ 表示完成、满了；ዓመታተ 为“年岁/年限”。此译法符合现代汉语，又保留完成约定年期的含义。
- source_word: ዘተቀነይኩ፡ ለከ፡
  choice: 我为你服侍的
  rationale: ተቀነይኩ 表示服侍或效劳，ለከ 表示“为你/给你”；采用“服侍”以贴近原文关系措辞。
- source_word: ህየንተ፡ ክልኤቲ፡ አዋልዲከ፡
  choice: 为你两个女儿
  rationale: ህየንተ 表示“为了、作为……的代价/交换”，ክልኤቲ 及 አዋልዲከ 指“你的两个女儿”。中文以“为你两个女儿”保留关系而避免过度解释交易性质。
- source_word: ወአሐውር፡
  choice: 我要走了
  rationale: 表示“并且我将去/离开”；“我要走了”是自然、庄重且符合语境的现代汉语。
theological_decisions:
- issue: 是否依《创世记》平行叙事译为“把我的妻子给我”
  choice: 按吉兹文本译作“为我自己成家”
  alternative: 把我的妻子给我
  rationale: 现存所给原文明确有 ሊተ ቤተ（“为我/给我，家或房屋”），并无“妻子”或“给”这一请求式动词；因此不以平行经文校改当前文本。
translation_notes:
  register: 采用现代、清楚而庄重的简体中文。“成家”比“给我一所房子”更符合此处家室语境，但仍以原文“为我一个家”为依据；不添加原文没有的妻子请求。
