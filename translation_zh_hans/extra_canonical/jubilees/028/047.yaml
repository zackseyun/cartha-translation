  text: to her, and she conceived and bore another son and a daughter, and she called the son's name Zebulun,
translation:
  language: zh_hans
  text: 到她那里；她就怀孕，生了另一个儿子[a]和一个女儿，并给儿子起名叫西布伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二个儿子”。
    reason: 原文 ካልእተ 既可表示“另一个”，也可表示“第二个”。
lexical_decisions:
- source_word: ካልእተ፡ ወልደ
  choice: 另一个儿子
  rationale: ካልእተ 可表示“另一个”或“第二个”。按本段生育次序译作“另一个儿子”较自然，也避免让读者误以为西布伦是利亚所生的第二个儿子；另一可能译法保留在脚注中。
- source_word: ዘቡሎን
  choice: 西布伦
  rationale: 采用该圣经人名在现代简体中文中的通行译名。
- source_word: ወጸውዐት፡ ስሞ፡ ለወልድ
  choice: 并给儿子起名叫
  rationale: 原文直译近于“她称那儿子的名字”，中文以“给儿子起名叫”自然、准确地表达命名动作。
theological_decisions:
- issue: ካልእተ 的次序含义是否应明确为“第二个”
  choice: 正文译“另一个”，脚注列“第二个”
  alternative: 第二个儿子
  rationale: 原词兼有“另一个”和“第二个”的可能；正文依据叙事中的实际出生次序采用不易引起误解的表达，同时用脚注保留原文的词义张力，不作神学化处理。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。开头“到她那里”保留原文作为承接上文的片段性质；用分号使其与随后完整分句衔接。
