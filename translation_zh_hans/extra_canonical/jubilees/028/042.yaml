lexical_decisions:
- source_word: ወልደ
  choice: 她生了一个儿子
  rationale: 该词在此叙事语境中表示“生育”，并由后文阳性代词和名字表明所生的是儿子；补出主语“她”以符合现代汉语表达。
- source_word: ወጸውዐት፡ ስሞ፡ ልያ፡ ጋድ
  choice: 利亚给他起名叫迦得
  rationale: 按源文保留利亚为命名者，并用现代汉语自然表达“称他的名为迦得”；“迦得”采用通行圣经人名译法。
- source_word: አመ፡ ዐሡሩ፡ ወስኑዩ፡ ለወርኅ፡ ሳምን፡ በሣልስ፡ ዓመት
  choice: 那时是第三年八月十二日
  rationale: 依次表达“十二日、八月、第三年”，在中文中调整为通常的年—月—日顺序，并以“那时是”连接叙事。
