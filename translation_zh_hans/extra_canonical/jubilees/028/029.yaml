  text: Leah conceived and bore him a third son, and he called his name Levi, on the first day of the first month.
translation:
  language: zh_hans
  text: 利亚怀孕，为他生了第三个儿子；他[a]给孩子起名叫利未，是在第一月初一[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“起名”的动词是阳性单数，即“他起名”；有译本作“她起名”。
    reason: 说明命名动词的阳性单数形式，并保留译本传统中的另一理解。
  - marker: b
    text: 原文也可译作“在月朔”；其中表示“开始、升起”的词也可指“黎明”，但这里不宜同时译成“黎明时分”和“初一”。
    reason: 保留日期短语的词义幅度，并说明未采用重复翻译。
lexical_decisions:
- source_word: ወጸውዐ፡ ስሞ፡ ሌዊ፡
  choice: 他给孩子起名叫利未
  rationale: 动词“ወጸውዐ”是第三人称阳性单数，因此以“他”为主语；“起名叫利未”自然表达“称他的名为利未”。
- source_word: በሠርቅ፡ ወርኅ፡
  choice: 日期是正月初一
  rationale: 该短语以“月的开始、月朔”为核心含义；结合审校层所保留的月份信息，译作“正月初一”，避免把“黎明”和“初一”重复译出。
- source_word: ወልደ፡ ሣልሰ፡
  choice: 第三个儿子
  rationale: 直译为“第三个儿子”，保留出生次序。
theological_decisions:
- issue: 给孩子命名者的性别
  choice: 他
  alternative: 她
  rationale: 原文命名动词为第三人称阳性单数，所指应为雅各；前面的“怀孕、生育”虽以利亚为主语，却不决定后一个动词的主语。
- issue: 日期短语的理解
  choice: 正月初一
  alternative: 黎明时分／月朔
  rationale: ሠርቅ可涉及“升起、黎明、开始”，与“月”连用时可指月朔或初一；正文采用上下文支持的日期表达，脚注保留较贴近词面的“月朔”。
translation_notes:
  register: 采用庄重而自然的现代汉语。“给他生了”保留孩子是为雅各所生；以分号清楚标示主语由利亚转为“他”。日期另用“日期是”衔接，避免生硬堆叠。
