  language: zh_hans
  text: 约瑟：在这第四个七年期的第六年四月初一[a]。在他出生的日子里……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第四月的新月日”。
    reason: 保留历法用语“新月”与现代日期表达“初一”之间的对应关系。
lexical_decisions:
- source_word: በሠርቅ፡ ወርኅ፡ ራብዕ
  choice: 四月初一
  rationale: 这里是历法表达，指第四月的新月日，即该月第一日；这样译比直译“第四月的新月”更符合现代汉语日期习惯。
- source_word: በሱባዔ፡ ዝንቱ፡ ራብዕ
  choice: 这第四个七年期
  rationale: ሱባዔ在《禧年书》的年代计算中指一个七年周期；译作“七年期”既保留计年结构，也避免误解为普通的一周。
- source_word: ወበመዋዕለ፡ ተወልደ
  choice: 在他出生的那些日子里……
  rationale: 该短语为承接下文的依附性时间结构，不宜强行处理为完整独立句；省略号标明本节在此处未完。
