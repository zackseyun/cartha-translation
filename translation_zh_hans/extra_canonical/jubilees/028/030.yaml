lexical_decisions:
- source_word: ቀዳማዊ
  choice: 第一
  rationale: 保留原文句首“第一”的明确意义；它可能承接上一节的叙述，但不在本节中擅自补明所指。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在《禧年书》的年代框架中指由七年组成的周期；译作“七年期”比直译“七”更清楚，也避免与普通的一周混淆。
- source_word: ደገመ
  choice: 又
  rationale: 表达再次发生，符合原文重复、再度之意。
- source_word: ቦአ ኀቤሃ
  choice: 与她同房
  rationale: 原文字面为“进去到她那里”，在此是委婉表达性交；采用现代汉语中庄重且通行的圣经用语。
- source_word: ፀንሰት
  choice: 她就怀了孕
  rationale: 准确表达阴性主语的受孕，并以自然汉语呈现叙事结果。
