lexical_decisions:
- source_word: ወአሐዱ፡ ዘወርኅ፡ ዓሥር
  choice: 十月初一
  rationale: 按字面为“第十个月的一日／第一日”；现代汉语日期表达用“十月初一”自然且准确。
- source_word: በሣልስ፡ ዓመት፡ ለዝ፡ ሱባዔ
  choice: 在这个七年期的第三年
  rationale: ሱባዔ在《禧年书》的纪年体系中指由七年构成的周期；译作“七年期”比单独译作“七”或“周”更清楚。
- source_word: ወደገመ፡ ያዕቆብ፡ ወቦአ
  choice: 雅各又进去
  rationale: ደገመ表达“再次／又”，ቦአ意为“进入”；保留原文动作及其未完的后接方向结构。
- source_word: ኀበ
  choice: 到……那里
  rationale: 该词引出趋向或对象，约为“到／往……那里”；本节所给原文在此截断，因此不擅自补出对象。
