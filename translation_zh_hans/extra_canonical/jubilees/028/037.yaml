  text: And he went in to her, and she conceived and bore him a son, and he called his name Dan, on the ninth of the month.
translation:
  language: zh_hans
  text: 他与她同房；她怀了孕，并在当月初九为他生了一个儿子；他给孩子取名叫但[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本或译本作“她给孩子取名”。
    reason: 所给吉兹文本的动词为阳性单数，故正文作“他给孩子取名”；相关传本及《创世记》叙事中存在由母亲取名的异文传统。
lexical_decisions:
- source_word: ወቦአ፡ ኀቤሃ፡
  choice: 他与她同房
  rationale: 原文直译为“他进去到她那里”，在生育叙事中是委婉表达；译作“同房”既自然，也保留庄重语体。
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ፡ ወልደ፡
  choice: 她就怀孕，为他生了一个儿子
  rationale: 依次保留“怀孕”“为他生子”的动作与受益关系。
- source_word: ወጸውዐ፡ ስሞ፡ ዳን፡
  choice: 他给孩子取名叫但
  rationale: 所给吉兹文本的动词是第三人称阳性单数，因此以“他”为取名者；“但”沿用该人名在中文圣经传统中的通行译法。
- source_word: አመ፡ ተሱዑ፡ ለወርኅ፡
  choice: 这事发生在当月初九
  rationale: 日期结构更自然地表示某月第九日；补出“这事发生”使现代汉语顺畅，并避免误读成妊娠第九个月。
