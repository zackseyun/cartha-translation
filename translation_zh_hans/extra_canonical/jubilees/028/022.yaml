lexical_decisions:
- source_word: ባላንሃ
  choice: 辟拉
  rationale: 按该人物在《创世记》传统中的通行中文译名音译。
- source_word: አኅታ፡ ለዜልፋን
  choice: 悉帕的妹妹
  rationale: 直译亲属关系；原文明确称辟拉为悉帕的姐妹，此处结合阴性形式译为“妹妹”。
- source_word: ለአኪት
  choice: 作婢女
  rationale: 表达作为女仆、侍女的身份或用途，采用庄重而通俗的“婢女”。
- source_word: ወትቀንየ፡ ሰብዓተ፡ ዓመተ፡ ዳግመ
  choice: 他又服侍了七年
  rationale: 保留动词“服侍”及“又、再”的含义；主语依上下文以“他”表达，不在本节内擅自补出姓名。
- source_word: በእንተ
  choice: 为了……
  rationale: 该介词引出目的或对象，但现存节段在此中断，因此用省略号保留未完状态。
theological_decisions:
- issue: 本节开头因分节而形成的残句及施事者归属
  choice: 不补入“拉结给了”或“拉班给了”等动词和主语，按现存节段保留残句
  alternative: 依据叙事上下文重构为“拉班把悉帕的妹妹辟拉给拉结作婢女”
  rationale: 上下文很可能表明施事者是拉班，但所给吉兹文节段本身缺少相应动词；补成“拉结给了”会造成叙事事实错误，直接补“拉班”则超出本节明文。脚注说明分节问题，可兼顾来源忠实与可理解性。
- issue: 末尾未完成的目的短语
  choice: 保留“为了……”
  alternative: 根据下一节或上下文补足服侍对象
  rationale: 原文止于介词“为了/因着”，应保留文本边界造成的悬置，不以推断消除歧义。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。正文有意保留首尾两处由分节造成的残缺，不把上下文推断写成确定事实；以脚注帮助读者理解。
