  text: because Leah’s eyes were weak, but her appearance was very beautiful, and Rachel was beautiful,
translation:
  language: zh_hans
  text: 因为利亚的眼睛软弱，但她的容貌十分美丽，而拉结很美丽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድኩም
  choice: 柔弱
  rationale: 该词表示软弱、无力；用于眼睛时译作“柔弱”，既保留原文含义，也避免擅自具体化为视力不佳或眼神无光。
- source_word: ላሕይ፡ ራእያ፡ ጥቀ
  choice: 她的容貌十分美丽
  rationale: 按吉兹语结构将这一描述归于利亚；ጥቀ明确表达加强语气，故译“十分”。
- source_word: ሠናይ
  choice: 美丽
  rationale: 此处简洁地断言拉结美丽，不把前句关于“容貌”和“十分”的成分移到拉结身上。
theological_decisions:
- issue: 利亚与拉结的容貌描写归属
  choice: “她的容貌十分美丽”指利亚，随后另说“拉结也很美丽”
  alternative: 把“容貌美丽”与程度副词一并归于拉结
  rationale: 原文在“利亚的眼睛柔弱”后以阴性单数所属形式继续描述“她的容貌”，之后才以拉结之名开启并列分句；这样也保留《禧年书》相对于《创世记》平行叙述的独特措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“但”保留利亚眼睛柔弱与容貌美丽之间的对比；“也”自然呈现随后对拉结的并列肯定，但不添加原文没有的具体容貌特征。
