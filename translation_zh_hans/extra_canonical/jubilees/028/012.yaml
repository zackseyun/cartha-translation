lexical_decisions:
- source_word: በምድርነ
  choice: 在我们这地方
  rationale: 字面为“在我们的地/国中”，此处指当地通行的习俗；译作“地方”自然且不把范围过度限定为国家。
- source_word: ውሂበ
  choice: 嫁出去
  rationale: 基本义为“给、交出”；在女儿婚配的上下文中指嫁女，汉语以“嫁出去”清楚表达隐含宾语和婚姻语境。
- source_word: እንተ ትንእስ / እንተ ትልህቅ
  choice: 小女儿 / 大女儿
  rationale: 分别表示较小者与较大者；上下文涉及拉结和利亚，按年龄及婚配语境明确为妹妹与姐姐，采用现代汉语常见说法。
- source_word: ርቱዐ
  choice: 对
  rationale: 表示正直、合宜；“不对”既保留规范判断，也符合口语自然度。
- source_word: ለገቢረ ዝንቱ
  choice: 这样做
  rationale: 直义为“做这事”，译作“这样做”简洁自然。
