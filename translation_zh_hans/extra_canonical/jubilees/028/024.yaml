  text: and she bore Jacob a son, and he called his name Reuben, on the fourteenth day of the month,
translation:
  language: zh_hans
  text: 她给雅各生了一个儿子；雅各给他起名叫吕便。这是在该月十四日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“第九个月十四日”。
    reason: 所给吉兹语校勘文本仅作“该月十四日”，但部分抄本有“第九个月”的异文，故在脚注中保留。
lexical_decisions:
- source_word: ወወለደት፡ ለያዕቆብ፡ ወልደ
  choice: 她给雅各生了一个儿子
  rationale: 保留阴性单数主语“她”和受益/关系表达“给雅各”，同时采用自然的现代汉语语序。
- source_word: ወጸውዐ፡ ስሞ፡ ሮቤል
  choice: 雅各给他取名叫吕便
  rationale: 动词“叫/命名”为第三人称阳性单数；按上下文将其明确为雅各，以免汉语零主语被误解为前句的女性主语。“吕便”采用通行圣经人名译法。
- source_word: አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለወርኅ
  choice: 这是在本月十四日
  rationale: 原文明确表达“十四日”，但所给校勘文本只说“月”，没有“第九”的词；“本月”以自然汉语呈现定指月份而不擅自补入月份序数。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。将阳性单数命名者明示为“雅各”，准确体现吉兹语形态对前一阴性主语的转换；日期异文置于脚注，不纳入正文。
