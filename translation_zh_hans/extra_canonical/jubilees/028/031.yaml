  text: and she bore him a fourth son, and he called his name Judah, on the fifteenth day of the third month,
translation:
  language: zh_hans
  text: 三月十五日，她给他生了第四个儿子；他给孩子起名叫犹大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለደት
  choice: 她……生了
  rationale: 该动词为阴性单数形式，明确以利亚为主语；补出“她”符合现代汉语表达。
- source_word: ወልደ፡ ራብዐ
  choice: 第四个儿子
  rationale: 直译“第四个儿子”，保留出生次序。
- source_word: ጸውዐ
  choice: 他……起名
  rationale: 所给吉兹语动词是第三人称阳性单数，故按底本译为“他”，不依《创世记》平行经文改成“她”。
- source_word: ይሁዳ
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: በዐሡሩ፡ ወኀሙሱ፡ ለወርኅ፡ ሣልስ
  choice: 三月十五日
  rationale: 按汉语自然日期次序表达“第三月的第十五日”。
theological_decisions:
- issue: 为犹大起名者的性别
  choice: 他给孩子起名
  alternative: 她给孩子起名
  rationale: 尽管《创世记》29:35及可能的异文以利亚为起名者，但所提供的吉兹语底本文法明确为阳性单数，译文不以平行经文默改底本。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；将原文连续并列句适度断句，以提高可读性，同时保留人物性别、出生次序和日期信息。
