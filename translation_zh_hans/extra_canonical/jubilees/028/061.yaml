lexical_decisions:
- source_word: ወኮነ፡ እምዘ፡
  choice: 以后，事情是这样
  rationale: 保留叙事承接语气，同时用自然的现代汉语表达“此后发生了”。
- source_word: ወለደት፡ ራሔል፡ ዮሴፍ
  choice: 拉结生了约瑟
  rationale: 按原文语序和明确的母子关系直译。
- source_word: ይቅርጽ፡ አባግዒሁ
  choice: 剪他的羊毛
  rationale: 该表达指给羊剪毛；现代汉语用“剪羊毛”最清楚自然。
- source_word: እስመ፡ ርሑቅ
  choice: 因为他在远处
  rationale: 保留原文的因果连接及距离含义，不擅自补明他远离何处。
