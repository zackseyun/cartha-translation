  text: And a daughter was born, whose name was Dinah, in the seventh month, in the seventh year of the sixth week of the fourth jubilee. And He had mercy on her,
translation:
  language: zh_hans
  text: 又有一个女儿出生，名叫底拿；那是在第四个禧年的第六个七年期，即这一期的第七年七月。他怜悯了她，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስማ፡ ዲና
  choice: 名叫底拿
  rationale: 直译为“她的名字是底拿”；汉语用“名叫底拿”自然表达，同时保留原文明确提到名字的内容。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 此处指由七年组成的周期；译为“七年期”既清楚又能与“禧年”区分。
- source_word: ተሣሀላ
  choice: 怜悯了
  rationale: 该动词表达施怜悯；采用庄重而通行的现代汉语措辞。
theological_decisions:
- issue: 末句施怜悯者的身份
  choice: 他怜悯了她
  alternative: 上帝怜悯了她
  rationale: 吉兹语动词及宾语后缀表明主语为阳性单数、对象为阴性单数，但本节没有明说主语是上帝；因此保留代词，不把解释直接写入正文。
- issue: 末句女性宾语的所指
  choice: 她
  alternative: 拉结
  rationale: 原文只使用阴性单数宾语后缀；虽然上下文可能指拉结，正文仍保留原有指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“第四个禧年的第六个七年期，即这一期的第七年七月”按原文由大到小交代历法层级，并用“即这一期”减少汉语歧义。末尾保留逗号，反映原句思想延续至下一节。
