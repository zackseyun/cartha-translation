  text: my maidservant; and she will conceive and bear me a son.” And she gave Bilhah her maidservant to be his wife.
translation:
  language: zh_hans
  text: “我的婢女；她会怀孕，给我生一个儿子。”她就把自己的婢女辟拉给他为妻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመትየ
  choice: 我的婢女
  rationale: 该词由“婢女”与第一人称单数属格构成，直译为“我的婢女”；采用现代、清楚且符合叙事语体的表达。
- source_word: ወትፀንስ
  choice: 她会怀孕
  rationale: 保留连接词“并且”和第三人称阴性动词的基本意义；译文不加入原文没有的“与她同房”。
- source_word: ወትወልድ፡ ሊተ፡ ወልደ
  choice: 给我生一个儿子
  rationale: 依次表达“生、给我、儿子”，调整为自然的现代汉语语序。
- source_word: ወወሀበት፡ ባላሃ፡ አመታ፡ ትኩኖ፡ ብእሲተ
  choice: 她就把自己的婢女辟拉给他为妻
  rationale: 忠实呈现“她给了辟拉、她的婢女、使其成为妻子”的句法关系，并用汉语叙事中自然的“给他为妻”表达目的或结果。
theological_decisions:
- issue: 是否补入“与她同房”
  choice: 不补入
  alternative: “我的婢女；你与她同房，她就会怀孕”
  rationale: 现存所给吉兹语原文只说“我的婢女；她会怀孕”，没有对应“你与她同房”的词语。为避免受《创世记》30:3的平行叙事影响而增译，正文严格依从本节原文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“婢女”兼顾古代家庭制度背景与普通读者的可理解性；句首保留原文片段式衔接，因为本节从前文引语中段开始。
