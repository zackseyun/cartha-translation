  text: of the fourth week. And he again went in to her, and she conceived and bore him a second son, and she called
translation:
  language: zh_hans
  text: 第四个七年期。他又与她同房；她怀孕，给他生了第二个儿子，并给他起名叫——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘሱባዔ፡ ራብዕ
  choice: 第四个七年期
  rationale: “ሱባዔ”在《禧年书》的年代计算语境中指由七年组成的周期；译为“七年期”比单独译作“七”或“周”更清楚。原文是承接上文的残句，中文仍保留这种衔接性。
- source_word: ወደገመ፡ ቦአ፡ ኀቤሃ
  choice: 后来，他又与她同房
  rationale: 字面结构为“他再次进入她那里”，是古代闪语式的同房委婉语；采用现代中文圣经文体中自然、庄重的“与她同房”。
- source_word: ወፀንሰት
  choice: 她就怀孕
  rationale: 直接表达受孕，保留叙事动作次序。
- source_word: ወወለደት፡ ሎቱ፡ ወልደ፡ ካልአ
  choice: 给他生了第二个儿子
  rationale: 保留“给他”及“第二个儿子”的关系与次序；中文表达自然。
- source_word: ወጸውዐት
  choice: 并给他起名叫——
  rationale: 原文在“她称呼/起名”之后于本节截断，姓名应见后续文本；以破折号明确保留未完句，而不擅自补足。
