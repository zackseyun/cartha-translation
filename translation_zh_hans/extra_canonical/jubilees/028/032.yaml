  text: In the first year of the fourth week. And through all this Rachel was jealous of Leah, because she was barren.
translation:
  language: zh_hans
  text: 第四个七年期的第一年。在这一切期间，拉结一直嫉妒利亚，因为她不能生育。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在《禧年书》的年代计算中指由七年组成的周期；译作“七年期”既保留历法含义，也便于现代读者理解。
- source_word: ትቀንዕ
  choice: 嫉妒
  rationale: 对应拉结因不育而对利亚产生的嫉妒，按原文直陈其情感，不作弱化。
- source_word: በዝ፡ ኵሉ
  choice: 在这一切事上……一直
  rationale: 兼顾“在这一切之中/期间”的范围意义，并以“一直”自然表达该状态贯穿上述事情。
- source_word: ራሔል / ልያ
  choice: 拉结 / 利亚
  rationale: 采用现代中文圣经读者熟悉的人名译法。
theological_decisions:
- issue: 拉结不育与其嫉妒之间的因果关系
  choice: 因为她不能生育
  alternative: 因为她是不生育的
  rationale: 保留原文所述因果关系，不增添神学解释；“不能生育”在现代汉语中更自然、庄重。
translation_notes:
  register: 采用简洁庄重的现代标准普通话。“第四个七年期的第一年”明确呈现《禧年书》的纪年体系；第二句保留原文的情感张力和因果关系。
