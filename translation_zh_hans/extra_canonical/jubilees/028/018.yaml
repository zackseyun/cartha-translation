  text: 因为这是非常邪恶的。”拉班对雅各说：“等这个人的七天婚宴过去，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“让这个人的七天过去。”这里指其婚宴的七天。
    reason: 原文对该人未直接点名，且以简略方式说“七天”；正文按语境译为“七天婚宴”，注释保留其简略措辞和未具名的指称。
lexical_decisions:
- source_word: እኩይ፡ ጥቀ
  choice: 非常邪恶
  rationale: እኩይ意为“邪恶”，ጥቀ是明确的加强词，宜译出“非常”，不可省略。
- source_word: ይኅልፍ
  choice: 等……结束
  rationale: 该词在此表示让一段规定的时间过去；汉语直接引语中用“等……结束”自然且忠实。
- source_word: ሰቡዐ፡ መዋዕለ፡ ግዝአ፡ ለዛ
  choice: 这一个的七天婚宴
  rationale: 按字面保留“这一个”的指称，并结合婚姻叙事语境，将七日时段表达为“七天婚宴”；不擅自把所指明确为利亚。
