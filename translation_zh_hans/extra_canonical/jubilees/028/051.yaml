  text: Joseph, Jacob said to Laban, “Give me my wives and my children, and I will go to my father Isaac, and I will make.”
translation:
  language: zh_hans
  text: 约瑟。雅各对拉班说：“请把我的妻子和儿女交给我，我要到我父亲以撒那里去，并且我要建造[a]……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“我要建造”处中断，所建造的对象可能接在下一节；也可译作“我要做……”。
    reason: 说明原文分节造成的未完句，并保留该动词“做／建造”的词义范围，避免为求通顺而改作“返回”。
lexical_decisions:
- source_word: ዮሴፍ
  choice: 约瑟
  rationale: 原文此分段只有人名“约瑟”，不补入“出生时”等在本段中没有明载的成分；句点反映章节切分造成的前句收尾。
- source_word: ሀበኒ፡ አንስትየየ፡ ወውሉድየ
  choice: 请把我的妻子和儿女交给我
  rationale: 直译核心为“把我的妻子和儿女给我”；加入“请”使汉语请求语气自然，但不改变命令式内容。
- source_word: ወእሖር፡ ኀበ፡ አቡየ፡ ይስሐቅ
  choice: 我要到我父亲以撒那里去
  rationale: 保留动词“去”和方向结构“到……那里”，不误译为“回去”。
- source_word: ወእግበር
  choice: 并且我要建造
  rationale: 该词源自动词“做、制造、建造”，并非“返回”；结合其后显然被切断的宾语，汉语暂取“建造”，并以省略号保留未完句。
