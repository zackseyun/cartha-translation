  text: the ninth, in the first year of the third week. But Rachel’s womb was closed, because he saw
translation:
  language: zh_hans
  text: 第九个月[a]，在第三个七年期的第一年。可是，拉结的子宫闭塞了，因为他看见……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“第九”；“个月”依上下文补出。
    reason: 说明本节起首承接相邻分节的月份语境，以及汉语为完整表达所作的必要补词。
lexical_decisions:
- source_word: ታስዕ
  choice: 第九个月
  rationale: 原文只有“第九”，承接上一节被分割的月份语境；汉语补出“个月”以使句意自然，并用脚注说明直译。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在《禧年书》的年代计算中指由七年组成的周期；译作“七年期”既清楚又避免与普通的一周混淆。
- source_word: ማሕጸናሰ፡ ለራሔል፡ ተጸፍቀ
  choice: 拉结的子宫却闭塞了
  rationale: 保留原文具体的身体意象及转折语气，不将其解释性改写为“不能生育”。
- source_word: ርእየ
  choice: 他看见
  rationale: 按原文第三人称阳性单数动词直译；本节在此处截断，因此不擅自补明主语或所见内容。
theological_decisions:
- issue: “他看见”的主语及宾语未在本节片段中明说
  choice: 保留“因为他看见……”的悬而未决形式
  alternative: 解释为“因为上帝看见……”并补出所见内容
  rationale: 原文只明示阳性单数主语，且句子跨节延续；不以神学推断填补文本未明说的信息。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“七年期”清楚呈现本书特有的年代单位；末尾用省略号显示原文在本节结束处语意未完。
