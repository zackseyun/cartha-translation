    text: 查尔斯1895年版原文在“梦中”之后标有校勘注37；本次所给资料未包含注释内容。
    reason: 保留所提供原文中的校勘注位置，同时不臆造缺失内容。
  - marker: b
    text: 查尔斯1895年版原文在“对他所说的”之后标有校勘注38；本次所给资料未包含注释内容。
    reason: 保留所提供原文中的校勘注位置，同时不臆造缺失内容。
lexical_decisions:
- source_word: ምድረ፡ ከናአን
  choice: 迦南地
  rationale: 按地名短语直译，符合现代中文圣经语体。
- source_word: በህልም
  choice: 在梦中
  rationale: 保留原文未加限定的单数“梦”，不扩写为异象或启示。
- source_word: ነገሮን
  choice: 告诉了她
  rationale: 依吉兹语动词所带的阴性单数宾语形式翻译；英语咨询层作“them”，但原文形态更支持“她”。
- source_word: ዘተናገረ፡ ሎቱ
  choice: 对他所说的
  rationale: 保留被动表达及受事者“他”，不擅自说明说话者是谁。
theological_decisions:
- issue: 梦中所见及所听之事的来源
  choice: 不补出上帝、天使或其他说话者
  alternative: 译作“上帝对他所说的一切”
  rationale: 原文使用未明示施事者的被动结构；补明身份会消除原有含混。
- issue: “告诉”的宾语人数与性别
  choice: 译为阴性单数“她”
  alternative: 依英语POB译为复数“他们”
  rationale: 以原语言证据优先；吉兹语形式指向阴性单数宾语。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。经文从句承接上一语境，因此保留开头“同他一起到迦南地”的片段结构；两个“一切”对应原文的重复，以维持其强调效果。
