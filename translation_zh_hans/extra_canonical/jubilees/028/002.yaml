  text: And he served him for his daughter Rachel one week.
translation:
  language: zh_hans
  text: 他为了他的女儿拉结，服侍了他一个七年期。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个七期”或“一个周”，在《禧年书》的年代体系中指七年。
    reason: 说明原文特有的“周”式年代术语，并避免读者误解为七天。
lexical_decisions:
- source_word: ወተቀንየ፡ ሎቱ፡
  choice: 他……服侍了他
  rationale: 逐一保留动词“服侍”及其间接宾语“他”，自然表达雅各为拉班效力。
- source_word: ህየንተ፡ ራሔል፡ ወለቱ፡
  choice: 为了他的女儿拉结
  rationale: 保留“他的女儿”这一不可省略的关系说明；ህየንተ在此按交换或目的关系译为“为了”。
- source_word: ሱባዔ፡ አሐደ።
  choice: 一个七年期
  rationale: ሱባዔ字面为“一组七/七期”，《禧年书》的年代体系通常指七年组成的周期。译作“七年期”既保留其专门的周期概念，又避免现代汉语把“一个星期”误解为七天。
theological_decisions:
- issue: “一七期”究竟应显明为七年还是只译“一个星期”
  choice: 正文译“一个七年期”
  alternative: “一个七期”或“一个星期（即七年）”
  rationale: 上下文所述服役期以年计算，而本书以七年为一个“周/七期”；正文明确时间单位，同时用脚注交代字面形式，以保存原文的年代术语。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“一个七年期”略带年代术语色彩，适合《禧年书》的结构性计时方式；脚注标记已在正文中对应。
