lexical_decisions:
- source_word: ወለደት፡ ወልደ፡ ዳግመ
  choice: 又……生了第二个儿子
  rationale: 保留原文“生子”及“第二”的次序信息；用“又”自然表达再次生育。
- source_word: ለያዕቆብ
  choice: 给雅各
  rationale: 贴近吉兹文与格所表达的关系，同时符合现代汉语叙事习惯。
- source_word: ጸውዐት፡ ራሔል፡ ስሞ
  choice: 拉结给他起名叫
  rationale: “称他的名”为闪语式表达，译作现代汉语常用的“给他起名叫”，不增添解释。
- source_word: ንፍታሌም
  choice: 拿弗他利
  rationale: 采用该圣经人名在现代简体中文中的通行译名。
- source_word: በኀሙሱ
  choice: 在第五日
  rationale: 按原文保留序数日期；上下文未在本节明确其历法参照，故不擅自补明。
