  text: all the sheep that were speckled and those that had marks of spots and those that had dark spots, and they would breed again
translation:
  language: zh_hans
  text: 所有带斑点的羊、带有斑点标记的羊，以及带深色斑点的羊，它们都会再次繁殖。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዕ
  choice: 羊
  rationale: 该词指羊群；此处用现代汉语常用的“羊”，不额外限定绵羊或性别。
- source_word: ጋሴ
  choice: 有斑点的
  rationale: 按本句对羊毛花色的分类，译作“有斑点的”，既自然又保留外观特征。
- source_word: ትእምርተ፡ ኵስኵሰ
  choice: 有斑纹记号的
  rationale: 直译包含“记号”与斑纹类词语；合译以避免生硬，同时保留其与一般斑点类别的区别。
- source_word: ሐመደ፡ ኵስኵሰ
  choice: 有深色斑点的
  rationale: 依短语所描述的较暗色斑点类别处理；不进一步指定具体颜色，以免超出源文证据。
- source_word: ወይደግማ
  choice: 还会再次繁殖
  rationale: 结合羊群语境，将“再次/重复”的动词自然表达为再次繁殖，补足现代汉语所需的语义宾语。
theological_decisions:
- issue: 末句主语的指代
  choice: 译为“它们”，指前述各类羊
  alternative: 重复译为“这些羊”
  rationale: 源文以动词形式承接前文，汉语需明示主语；“它们”保持指代自然，不引入额外解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。保留三类羊毛斑纹之间的并列区分；末句按畜群语境译出“繁殖”，避免机械直译造成句意残缺。
