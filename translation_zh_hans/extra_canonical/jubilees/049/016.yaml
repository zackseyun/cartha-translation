  text: at its appointed time, in every respect according to its command. And it shall not be lawful to eat it outside the sanctuary of the LORD, but before the sanctuary of the LORD, and all the people of the assembly
translation:
  language: zh_hans
  text: 要在指定的时间，在一切事上都照着它的命令而行。不可在耶和华的圣所外吃这祭物，却要在耶和华的圣所前吃。会众的全体百姓[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文在“会众的全体百姓”处接入下一节；这几个字是下一句的主语。
    reason: 说明跨节句法，避免读者误以为译文缺少谓语，或把该短语错误地理解为“同全会众一起”。
lexical_decisions:
- source_word: በጊዜሁ
  choice: 在指定的时间
  rationale: 按语境表达逾越节礼仪所规定的时刻；避免仅译作含混的“在那时”。
- source_word: በኵሉ፡ በከመ፡ ትእዛዙ
  choice: 凡事都照着有关这节期的命令行
  rationale: 保留“在一切方面、按照其命令”的整体意义，并以自然中文补明命令所关涉的是本节期礼仪。
- source_word: ወኢይከውን፡ ለበሊያቶ
  choice: 不可……吃这祭物
  rationale: 该结构表示不许可食用；“这祭物”承接上下文所论逾越节祭牲，使中文宾语清楚。
- source_word: በአፍአ፡ እምቤተ፡ መቅደሱ፡ ለእግዚአብሔር
  choice: 在耶和华的圣所外
  rationale: 直接反映“在……之外”的空间限制；以“耶和华”译神名传统对应词。
- source_word: በአንጻረ፡ ቤተ፡ መቅደሱ፡ ለእግዚአብሔር
  choice: 在耶和华的圣所前
  rationale: በአንጻረ 表示面对、在……前；“圣所前”比“圣所对面”更符合礼仪语境，同时保留空间意义。
- source_word: ወኵሉ፡ ሕዝበ፡ ማኅበ
  choice: 会众的全体民众
  rationale: 保留连接词所引出的新主语以及“民众/百姓”和“会众”两层词义；此短语跨节接续第17节，不改作与前句相连的伴随成分。
theological_decisions:
- issue: 圣所外食用的禁令与圣所前食用的要求
  choice: 不可在耶和华的圣所外吃这祭物，只可在耶和华的圣所前吃
  alternative: 不可在耶和华的圣所外吃，而要在耶和华的圣所对面吃
  rationale: “前”可自然表达面对圣所、处于圣所面前的礼仪空间关系，不将其解释为进入圣所内食用，也不额外引入特定宗派礼仪观。
- issue: 节末残句的跨节句法
  choice: 将“会众的全体民众”保留为第17节后续谓语的主语
  alternative: 译成“同全会众一起”，并归入本节食用命令
  rationale: 原文有连接词及明确的“民众”成分，且现存文本在此截断；按跨节句法保留张力，避免为求本节自足而改变语法关系。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。“这祭物”依上下文指逾越节祭牲。末尾刻意保留跨节未完句式，并以脚注说明。
