base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/022.yaml
  text: And you, Moses, command the children of Israel to keep the ordinance of the Passover as it was commanded to you; tell them year by year, and day by day, and concerning the feast of unleavened bread, that they should eat unleavened bread for seven days, that they should observe its feast, and that they should bring its offering day by day during those seven days of rejoicing.
translation:
  language: zh_hans
  text: 你也要，摩西，吩咐以色列子孙遵守逾越节的条例，正如吩咐你的那样；要逐年逐日告诉他们有关无酵节的事：他们要吃无酵饼七天，守这节期，并在那七个欢庆的日子里天天献上这节期的供物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ጳስካ
  choice: 逾越节的条例
  rationale: “ሥርዐት”指规例、礼制或条例，“ጳስካ”指逾越节；此译既保留礼仪性质，也符合现代中文表达。
- source_word: በዓለ፡ ፍአት
  choice: 无酵节
  rationale: 该词组直指无酵饼的节期，采用通行且清楚的中文名称。
- source_word: ፍአተ
  choice: 无酵饼
  rationale: 在“吃”这一语境中所指为无酵食物，译作“无酵饼”最自然明确。
- source_word: ቍርባኖ
  choice: 供物
  rationale: 该词指献上的礼物或祭献；“供物”保留其祭仪含义，同时不额外限定祭物种类。
- source_word: መዋዕለ፡ ፍሥሓ
  choice: 欢庆的日子
  rationale: “ፍሥሓ”意为喜乐、欢欣或欢庆，并非“节期”；译文保留这一语义区别。
theological_decisions:
- issue: 命令的传递层次
  choice: “正如所吩咐你的”
  alternative: “正如你所受的命令”
  rationale: 保留被动表达，使最终命令者在上下文中仍指向上帝，又不在本节中擅自补出主语。
- issue: 每日教导与节期事项的句法关系
  choice: “你要年年、日日教导他们，也要把无酵节的事告诉他们”
  alternative: “你要年年、日日把无酵节告诉他们”
  rationale: 原文串联多个宾语和时间短语，句法略显紧密；此译使中文通顺，同时不把“日日”武断地只限定为无酵节期间。
- issue: 末尾七日的性质
  choice: “那七个欢庆的日子”
  alternative: “那七天的节期”
  rationale: 原文使用表示喜乐、欢庆的词，而非通常表示节期的词，因此不将二者合并。
translation_notes:
  register: 采用庄重而现代的经文语体。“以色列子孙”保留传统群体称谓；用分号和冒号理清连续命令。源文开头似承接上一句的残片“他的名在其中……”，英语审校层未纳入本节正文；本稿依所给节界，从“你也要，摩西”所引出的完整命令起译。
