  text: '夜里，就是十五日的晚上，从日落起；因为这夜是节期的开始，也是欢庆的开始。那时，你们住在埃及，吃逾越节的祭肉；玛斯特玛的一切势力都奉差遣，要击杀埃及地一切头生的，从法老的长子直到磨坊里被掳女奴的长子，以及头生的牲畜。主赐给他们的记号是这样：他们看见凡门柱上有一岁羊羔的血的房屋，就不可进去杀戮，反要越过，使屋里所有的人都得救，因为门柱上有血作记号。


    主的众使者照主所吩咐的一切而行，越过了以色列众子；没有灾殃临到他们，要毁灭他们中间任何生命，无论牲畜、人，甚至狗。埃及所遭的灾殃极重；埃及没有一家没有死人、哀哭和号哭。但以色列众人安然居住，吃逾越节的祭肉，喝酒，颂赞、称颂并感谢主——他们列祖的上帝；他们预备好要脱离埃及的轭和邪恶的奴役。


    你也要一生天天记念这日，一生年年遵守，每年一次，在指定的时候，照它的一切律例而行；不可把这日从一日挪到另一日，也不可从一月挪到另一月。这是永远的律例，已经为以色列众子孙写定并规定在天上的版上，叫他们世世代代每年都在指定的时候遵守，一年一次。这律例没有终止之日，因为它是永远规定的。


    洁净而又在近处的人，若在指定的时候前来守这节，将蒙悦纳的供物献在主面前，并在节期之日于主面前吃喝，却没有按时献上主的供物，就必被剪除；这人要担当自己的罪。[a] 因此，以色列子孙要前来，在指定的时候守逾越节，就是在正月十四日，两晚之间，从白昼正中直到夜间的第三部分；[b] 因为一天的三分之二属于光明，三分之一属于傍晚。这就是主吩咐你要在傍晚正中所行的。


    不可在有光的任何时段宰杀逾越节祭牲，只可在傍晚时分宰杀。他们要在晚上吃，直到夜间的第三部分；夜间第三部分以后，祭肉若有任何剩余，都要用火焚烧。他们不可生吃，也不可用水煮了吃，只要用火烤着吃；要把头、内脏和腿一同用火烤。在以色列子孙中，不可折断任何骨头。


    为此，主吩咐以色列子孙在指定的时候守逾越节，不可折断祭牲的任何一根骨头；因为这是节期之日，是奉命遵守的日子。他们不可把它从一日挪到另一日，也不可从一月挪到另一月，只应在节期指定的日子遵守。


    你也要吩咐以色列子孙，一生每年守逾越节，一年一次，在指定的时候遵守；这样，这节就在主面前成为蒙悦纳的记念。他们守逾越节的那一年，击杀和打击的灾殃就不会临到他们。'
  philosophy: optimal-equivalence
