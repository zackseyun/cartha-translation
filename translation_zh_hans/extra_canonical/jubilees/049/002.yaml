revisions:
- from: '夜里，就是十五日晚上，从日落起；因为这夜是节期的开始，也是欢庆的开始。那时，你们住在埃及，吃逾越节的祭肉；玛斯特玛的一切势力都奉差遣，要击杀埃及地所有头生的，从法老的长子直到磨坊里被掳女奴的长子，以及牲畜中头生的。主赐给他们的记号是这样：凡有一岁羊羔的血涂在门框上的房屋，他们看见了，就不可进去杀戮，而要越过，使屋里所有的人都得救，因为门框上有血作记号。


    主的众使者照主所吩咐的一切而行，越过了以色列众子；灾殃没有临到他们，毁灭他们中间任何有生命的，无论牲畜、人，甚至狗。埃及所遭的灾殃极重；埃及没有一家不死人，处处都有哀恸和哭号。但以色列众人安然居住，吃逾越节的祭肉，喝酒，颂赞、称颂并感谢主—他们列祖的上帝；他们预备好要脱离埃及的轭和邪恶的奴役。


    你也要一生天天记念这日，一生年年遵守，每年一次，在指定的日子，照它的一切律例而行；不可把这日从一日挪到另一日，也不可从一月挪到另一月。这是永远的律例，已经为以色列所有子孙写定并规定在天上的版上，叫他们世世代代，每年都在指定的日子遵守，一年一次。这律例没有终止之日，因为它是永远规定的。


    洁净的人若前来，在指定的日子守这节，将蒙悦纳的供物献在主面前，并在节期之日于主面前吃喝—这洁净而又在近处的人却必被剪除，因为他没有按时献上主的供物；这人要担当自己的罪。[a] 因此，以色列子孙要前来，在指定的时候守逾越节，就是在正月十四日，两晚之间，从白昼正中直到夜间的第三部分；[b] 因为这一天有两部分属于光明，第三部分属于晚上。这就是主吩咐你要在晚上正中所行的。


    不可在有光的任何时段宰杀逾越节祭牲，只可在傍晚时分宰杀。他们要在晚上吃，直到夜间的第三部分；夜间第三部分以后，祭肉若有任何剩余，都要用火焚烧。他们不可生吃，也不可用水煮了吃，只要用火烤着吃；要把头、内脏和腿一同用火烤。他们不可折断其中任何一根骨头，因为以色列子孙不可折断任何骨头。


    为此，主吩咐以色列子孙在指定的时候守逾越节，不可折断祭牲的任何一根骨头；因为这是节期之日，是奉命遵守的日子。他们不可把它从一日挪到另一日，也不可从一月挪到另一月，只应在节期指定的日子遵守。


    你也要吩咐以色列子孙，一生每年守逾越节，一年一次，在指定的时候遵守；这样，这节就在主面前成为蒙悦纳的记念。他们守逾越节的那一年，击杀和打击的灾殃就不会临到他们。'
