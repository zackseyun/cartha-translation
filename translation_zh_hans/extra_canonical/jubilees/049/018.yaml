revisions:
- from: 因此，经上记着，也定规了：他们要在耶和华的圣所里吃这祭牲。[a] 以色列子孙进入他们将要取得的迦南地以后，要在那地中央、他们一个支派中间立起耶和华的帐幕，[b] 直到耶和华的圣所在那地建成。其间，他们要前来，在耶和华的帐幕中守逾越节，并在耶和华面前宰杀这祭牲。
