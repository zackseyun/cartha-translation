base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/018.yaml
  text: Thus it is written and ordained that they should eat it in the sanctuary of the LORD. And when the children of Israel enter the land that they are to possess, in the land of Canaan, and they set up the tent of the LORD in the midst of the land, in one of their tribes, until the sanctuary of the LORD is built in the land, they shall come and observe the Passover in the midst of the tent of the LORD, and they shall slaughter it before the LORD.
translation:
  language: zh_hans
  text: 因此，已经这样记载并规定了：他们要在耶和华的圣所里吃这祭牲。[a] 当以色列子孙进入他们将要占有的迦南地时，要在那地的中央、在他们的一个支派中支搭耶和华的帐幕，[b] 直到耶和华的圣所在那地建成。在此期间，他们要前来，在耶和华的帐幕中守逾越节，并在耶和华面前宰杀这祭牲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这祭牲”原文直译为“它”，所指承接上文的逾越节祭牲。
    reason: 说明为符合现代中文表达而补出的指代内容。
  - marker: b
    text: “支派”原文也可指军队、队伍或营伍。
    reason: 保留ሠራዊቶሙ的词义幅度及此处可能具有的安营意象。
lexical_decisions:
- source_word: ቤተ፡ መቅደሱ
  choice: 圣所
  rationale: 该词组直指神圣之所；译作“圣所”既符合上下文，也与后文建成的固定圣所形成连贯表达。
- source_word: ደብተራ፡ እግዚአብሔር
  choice: 耶和华的帐幕
  rationale: ደብተራ在此指尚未建成固定圣所以前设立的会幕或帐幕；用“帐幕”保留其可迁移建筑的含义。
- source_word: ጳስካ
  choice: 逾越节
  rationale: 这是源自‘Passover/Pascha’的节期名称，采用现代中文圣经传统中通行且清楚的“逾越节”。
- source_word: ወይጠብኅዎ
  choice: 宰杀这祭牲
  rationale: 动词意为“宰杀它”；依本段逾越节祭牲的语境补明“祭牲”，避免现代中文中“宰杀它”的指代生硬，同时不限定为某一种牲畜。
- source_word: ሠራዊቶሙ
  choice: 支派
  rationale: 该词通常可指军队、队伍或营伍；在以色列安营及土地分配的语境中，译作“支派”最自然，但以脚注保留其字面范围。
theological_decisions:
- issue: 固定圣所与帐幕之间的关系
  choice: 将帐幕时期表达为持续到圣所建成以前
  alternative: 把两者视为同一建筑，或明确指定为后来的某一座圣殿
  rationale: 原文明确先说设立帐幕，继而说“直到”圣所建成；译文保留这一先后关系，不进一步指定历史地点或建筑。
- issue: 逾越节祭牲的指代
  choice: 译为“这祭牲”
  alternative: 译为“逾越节羊羔”
  rationale: 原文使用代词“它”，本节并未明确重述牲畜种类；“这祭牲”使指代清楚，又避免加入原文此处没有明说的“羊羔”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事及律例语体。“经上记着，也定规了”保留原文两个并列的被动概念；用“其间”自然承接帐幕设立至圣所建成的时段。神名统一译作“耶和华”。
