  yaml_path: translation/extra_canonical/jubilees/049/017.yaml
  text: All of Israel shall observe it at its appointed time. And every man who comes on that day shall eat it in the house of the sanctuary of your God before the LORD, from twenty years old and upward, because
translation:
  language: zh_hans
  text: 全以色列都要在规定的时间守这节。凡在那一天前来、年满二十岁及以上的人，都要在你们上帝圣所的殿中，在耶和华面前吃这祭物，因为——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文止于“因为”；其后的理由接续在下一节。
    reason: 说明句末未完成的因果结构源于原文跨节延续，并保留原文的未完状态。
lexical_decisions:
- source_word: ሮሙ፡ ለእስራኤል፡
  choice: 以色列全体
  rationale: 依句意及经审校的英译理解为全体以色列人；用“全体”比生硬的“以色列的一切”更符合现代汉语。
- source_word: ይገበርዎ፡
  choice: 都要……守这节
  rationale: 该动词在节期律例的语境中表示实行、遵守；补出“这节”承接上下文中的逾越节条例。
- source_word: በጊዜሁ፡
  choice: 在指定的时间
  rationale: 保留“属于它的时间／规定时刻”之义，指节期所定日期。
- source_word: ኵሉ፡ ሰብእ፡ ዘመጽአ፡ በዕለቱ፡
  choice: 凡在那日前来的人
  rationale: 按泛指关系句处理；“前来”保留来到圣所或礼仪场合的动态含义，不擅自限定出发地点。
- source_word: ይብልዎ፡
  choice: 都要……吃这祭物
  rationale: 动词意为“吃”；宾语由上下文所述逾越节祭物补明，以免汉语中的“吃”悬空。
- source_word: በቤተ፡ መቅደሱ፡ ለአምላክክሙ፡
  choice: 在你们上帝的圣所中
  rationale: 字面结构近于“你们上帝的圣所之屋”；汉语“圣所”已自然涵盖建筑空间，无须重复译作“圣所之屋”。
- source_word: በቅድመ፡ እግዚአብሔር፡
  choice: 在耶和华面前
  rationale: በቅድመ 表示“在……面前”；以“耶和华”传达此处神圣专名。
- source_word: ዘእም፳ዓመት፡ ወላዕለ፡
  choice: 从二十岁以上
  rationale: 直译年龄下限，保留其适用对象为年满二十岁者。
- source_word: እስመ፡
  choice: 因为——
  rationale: 原文在本节以因果连词结束，理由延续至下一节；保留未完句法而不自行补足。
theological_decisions:
- issue: 谁须在圣所吃逾越节祭物
  choice: 将“凡在那日前来的人”与“从二十岁以上”连读，表述为前来者中年满二十岁的人
  alternative: 把“二十岁以上”理解为独立修饰以色列全体
  rationale: 原文语序使年龄限定紧接吃祭物者；译文维持这一最自然的句法关系，但不额外说明性别、资格或神学含义。
- issue: 神名的表达
  choice: 耶和华
  alternative: 主
  rationale: 原文 እግዚአብሔር 在此对应传统圣名语境；采用现代中文圣经读者熟悉的“耶和华”，并与前面的“你们上帝”区分。
- issue: 本节结尾的不完整因果句
  choice: 保留“因为——”
  alternative: 删除“因为”或从下一节补入原因
  rationale: 源文本身在此处未完，保留跨节张力，避免把下一节内容未经提供便并入本节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“守这节”承接节期法规语境；“圣所”避免字面重复造成的生硬；用破折号明确原文句意尚未完结。
