  text: in the third part of the day. And they shall bring its blood to the base of the altar, and they shall place its fat on the fire that is upon the altar, and they shall eat its flesh roasted with fire in the court of the house
translation:
  language: zh_hans
  text: 在白昼的第三个时段。[a]他们要把它的血带到祭坛脚下，把它的脂肪放在祭坛上的火上，并要在殿的院子里吃它那用火烤的肉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在日子的第三部分”；所指的确切时段并未明说。
    reason: 原文的时间表达可能指对白昼的分段，译文需保留其不确定性，避免换算成未经明示的现代时刻。
lexical_decisions:
- source_word: በሣልስቲ፡ ለዕለት
  choice: 在白昼的第三段时间
  rationale: 按字面保留“日子的第三部分”这一时间划分；用“白昼”避免被误解为连续三天中的第三天。
- source_word: ምካይዳ፡ ለምሥዋዕ
  choice: 祭坛脚下
  rationale: 该词在此指祭坛的底部或基部；“脚下”既自然，也符合血被带到祭坛基部的祭仪语境。
- source_word: ሥብሖ
  choice: 它的脂肪
  rationale: 保留祭牲脂肪这一具体祭仪用语，不泛化为“肥油”。
- source_word: ዐጸደ፡ ቤት
  choice: 殿的院子
  rationale: 直译为“房屋/殿的院落”；上下文为圣所祭仪，因此译作“殿的院子”，但不进一步指定为内院或外院。
theological_decisions:
- issue: “殿/房屋”的所指
  choice: 殿
  alternative: 房屋
  rationale: 祭坛、献祭与院子的语境表明这里是礼仪性的圣所建筑；“殿”在现代中文中自然而庄重，同时未额外引入具体圣殿制度。
- issue: 白昼第三段的精确时刻
  choice: 保留为“白昼的第三段时间”
  alternative: 下午/傍晚
  rationale: 原文只表达对白昼的分段，没有明确给出现代钟点；不将其解释性地固定为下午或傍晚。
translation_notes:
  register: 采用现代、庄重而易懂的祭仪叙述。延续上一节而以残句开头，保留原文篇章衔接；“祭坛脚下”“脂肪”“殿的院子”等词力求兼顾形式对应与自然中文。
