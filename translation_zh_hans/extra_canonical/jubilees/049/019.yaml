  text: from year to year. And in the days when the house is built in the name of the LORD in the land of their inheritance, there they shall go and slaughter the Passover in the evening, at sunset,
translation:
  language: zh_hans
  text: 年年如此。及至在他们承受为业之地，奉耶和华之名建成圣殿的时候，他们要前往那里，在傍晚、日落的时候宰杀逾越节祭牲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሔር፡ እምዓመት፡ በዓመት
  choice: 年年如此
  rationale: 表达逐年重复之意，并保留本节承接上文的片段性质。
- source_word: ቤት
  choice: 圣殿
  rationale: 字面为“房屋”，但此处指奉耶和华之名建造、作为献逾越节祭牲地点的殿宇；中文以“圣殿”自然且语境明确。
- source_word: በስመ፡ እግዚአብሔር
  choice: 奉耶和华之名
  rationale: 保留“以……之名”的宗教表达，并按现代汉语习惯译作“奉……之名”。
- source_word: በምድረ፡ ርስትሙ
  choice: 在他们承受为业的土地上
  rationale: 既保留“产业/继承地”的概念，也采用现代中文圣经语体中清楚自然的表达。
- source_word: ህየ፡ የሐሩ፡ ወይጥብሑ
  choice: 他们要到那里去……宰杀
  rationale: 明确译出运动动词የሐሩ“去”，并以“到那里去”对应地点副词ህየ“那里”；连接词ወ表达连续动作。
- source_word: ጳስካ
  choice: 逾越节的祭牲
  rationale: 此处与“宰杀”连用，所指不是节日本身，而是逾越节祭牲；明译宾语可避免中文误解。
- source_word: ምሴተ፡ እንዘ፡ የዐርብ፡ ፀሐይ
  choice: 在傍晚日落时
  rationale: 综合表达“傍晚”与“太阳落下”，自然地保留两个相互限定的时间成分。
theological_decisions:
- issue: “殿”是否应明确译作“圣殿”
  choice: 圣殿
  alternative: 殿／房屋
  rationale: 上下文涉及奉耶和华之名建造并宰杀逾越节祭牲的固定场所，译作“圣殿”是语境释义，不引入特定宗派立场。
- issue: ጳስካ指节期还是祭牲
  choice: 逾越节的祭牲
  alternative: 逾越节
  rationale: 由于动词是“宰杀”，此处为转喻，实际对象是祭牲；明确译出可使现代读者准确理解。
translation_notes:
  register: 采用庄重而现代的标准普通话。“年年如此”保留开头承接前文的语气；“到了……的日子”处理时间从句；明确译出“到那里去”，纠正遗漏源文运动动词的风险。未设置脚注，因为正文可直接而清楚地体现源文。
