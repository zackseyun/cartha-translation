  text: before the LORD, upon the altar of your God. For you observed this feast in haste when you came out from Egypt until you entered the wilderness of Shur, because at the shore of the sea you completed it.
translation:
  language: zh_hans
  text: 在耶和华面前，在你们上帝的祭坛上。因为你们从埃及出来时，匆忙守这节期，直到进入书珥的旷野；因为你们是在海边守完这节期的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅድመ፡ እግዚአብሔር
  choice: 在耶和华面前
  rationale: 按字面保留“在主面前”的礼仪表达；以“耶和华”呈现神名的传统指称。
- source_word: ዲበ፡ ምሥዋዐ፡ አምላክክሙ
  choice: 献在你们上帝的祭坛上
  rationale: 原文直译为“在你们上帝的祭坛上”；因本句承接上文，补出“献”使中文片段自然，但不另加祭物对象。
- source_word: በዓለ
  choice: 这节
  rationale: 指节期或节庆；现代中文语境中“守这节”简洁自然。
- source_word: በውልዋሌ
  choice: 匆忙
  rationale: 表达仓促、急迫之意，与出埃及叙事背景相符，同时避免扩写为恐惧或逃亡。
- source_word: ገዳመ፡ ሱር
  choice: 书珥旷野
  rationale: 采用圣经地名的通行译法。
- source_word: በኀበ፡ ድንጋገ፡ ባሕር
  choice: 在海边
  rationale: 对应海的岸边或边缘，采用自然且准确的现代汉语。
- source_word: ሰበጥክምዋ
  choice: 守完这节
  rationale: 语境中指完成节期的遵守；译为“守完”既保留完成义，也衔接前文“守这节”。
theological_decisions:
- issue: “耶和华面前”与“祭坛上”的关系
  choice: 保留两个并列的礼仪性地点表达，不解释献祭机制
  alternative: 解释为祭物必须在耶和华面前、放到祭坛上
  rationale: 本节是承接上文的句子片段；不应在缺少本节明确宾语时补入特定祭物或祭仪细节。
- issue: 从出埃及到进入书珥旷野的时间范围
  choice: 保留“直到”所表达的连续范围
  alternative: 理解为只在出埃及当日守节
  rationale: 原文明确使用“直到……进入”，应让时间跨度及其可能产生的叙事张力保留下来。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“你们”贯穿复数对象；句首保留其承接上文的片段性质。末句以分号呈现原因说明，避免机械重复“因为”。
