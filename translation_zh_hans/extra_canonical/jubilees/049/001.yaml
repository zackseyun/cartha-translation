base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/001.yaml
  text: 'Remember the command that the LORD commanded you concerning the Passover: that you should observe it at its appointed time, on the fourteenth day of the first month; that you should slaughter it before evening and that they should eat it.'
translation:
  language: zh_hans
  text: 你要记住耶和华关于逾越节所吩咐你的命令：要在指定的时间，就是第一个月十四日，守这节；要在天晚以前宰杀逾越节的祭牲，并且他们要吃它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር
  choice: 你要记住
  rationale: 准确表达命令式“记住”，并保持对单数第二人称的直接 خطاب。
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神名的常见译法。
- source_word: ፋሲካ
  choice: 逾越节
  rationale: 这是该节期在现代汉语中的标准名称；后文按语境以“逾越节的祭牲”表达可被宰杀、食用的对象。
- source_word: በጊዜሁ
  choice: 在指定的时间
  rationale: 保留其按所定时刻遵守的含义。
- source_word: ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡ ቀዳማዊ
  choice: 正月十四日
  rationale: 自然而准确地表达“第一个月的第十四日”；“正月”在圣经汉语中可指历法的首月。
- source_word: ትጥብቍ
  choice: 宰杀
  rationale: 依上下文指宰杀逾越节祭牲，而不是笼统的“守”。
- source_word: ዘእንበለ፡ ይምሰይ
  choice: 在天晚以前
  rationale: 较贴近字面“未到晚上”，不改写为其他更具体的时段。
- source_word: ይብልዕዎ
  choice: 让众人吃
  rationale: 保留原文第三人称复数主语与宾语所形成的人称转换；以“众人”使中文指向清楚，但不具体限定群体身份。
theological_decisions:
- issue: “逾越节”既可指节期，也可指被宰杀食用的祭牲
  choice: 前句译作“守这节”，后句译作“宰杀逾越节的祭牲”
  alternative: 各处都仅译作“逾越节”
  rationale: 汉语中“宰杀逾越节”不自然；按句法所指显明为祭牲，可作最低限度的语义明示，同时不增加祭牲种类等原文未说明的信息。
- issue: 末句主语由第二人称转为第三人称复数
  choice: 译作“并且要让众人吃”
  alternative: 译作“并且你要吃”或“并且你们要吃”
  rationale: 保留原文人称张力，不把第三人称复数同化为前面的第二人称。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留原文命令链条和分号层次；“指定的时间”“天晚以前”避免对历法与时刻作超出原文的解释。
