  yaml_path: translation/extra_canonical/jubilees/049/021.yaml
  text: that has been sanctified in the name of the LORD. And they shall not be able to observe the Passover in their cities, nor in any place except before the tent of the LORD, or before his house where he dwells.
translation:
  language: zh_hans
  text: 就是那奉主的名分别为圣的地方。他们不可在自己的城里守逾越节，也不可在任何地方守，只可在主的帐幕前，或[a]在他所居住的殿前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “或”直译为“若不然”；这里表示替代关系。
    reason: 说明源文连接语的惯用含义，并将脚注锚定于所解释的连接词。
lexical_decisions:
- source_word: ዘተቀደሰ፡ በስመ፡ እግዚአብሔር
  choice: 那奉主的名分别为圣的地方
  rationale: 保留关系从句与上文衔接的性质；补出汉语所需的“地方”，并以“分别为圣”表达被动的宗教语义。
- source_word: ገቢረ፡ ጳስካ
  choice: 守逾越节
  rationale: 该表达直义近于“举行逾越节”，现代汉语圣经语体通常自然表达为“守逾越节”。
- source_word: በአህጉሪሆሙ
  choice: 在自己的城里
  rationale: 按复数所有结构译出“他们的城邑”，用自然汉语概括为“自己的城里”。
- source_word: በቅድመ፡ ደብተራ፡ እግዚአብሔር
  choice: 在主的帐幕前
  rationale: ደብተራ 在此指宗教帐幕；“主的帐幕”准确而易懂。
- source_word: ወአመ፡ አኮ
  choice: 或
  rationale: 该惯用组合直译为“而若不然”，在此构成替代关系，宜译为“或”，而非累加性的“和”。
- source_word: ቤቱ፡ ኀበ፡ ኀደረ
  choice: 他所居住的殿
  rationale: 保留主语为“他”而非“他的名”；ቤት 可指房屋或圣殿，语境中以“殿”最恰当。
theological_decisions:
- issue: 合法守逾越节的地点关系
  choice: “主的帐幕前，或在他所居住的殿前”
  alternative: “主的帐幕前，并在他的殿前”
  rationale: 源文 ወአመ፡ አኮ 是“否则／或”的惯用表达，指帐幕与后来圣殿作为替代地点，而不是要求同时在两处。
- issue: 神居住之处的表述
  choice: “他所居住的殿”
  alternative: “他的名所居住的殿”
  rationale: 源文仅有“他居住”，没有“他的名”；不引入源文未明说的申命记式措辞。
translation_notes:
  register: 采用现代、庄重且通顺的经文语体。“就是”使本节开头的关系从句能自然承接上文；地点禁令以“不可……也不可……只可……”清楚呈现。
