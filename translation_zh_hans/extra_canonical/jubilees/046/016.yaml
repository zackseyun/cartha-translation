  text: they increased, and likewise they multiplied. And the Egyptians loathed the sons of Israel.
translation:
  language: zh_hans
  text: 他们人数增多，也同样繁衍起来。埃及人厌恶以色列的子孙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“埃及人使以色列的子孙成了可厌恶的。”
    reason: 保留该动词按使役形态理解的旧译可能；正文则依其在本语境中的词汇化意义译为“厌恶”。
lexical_decisions:
- source_word: ይበዝኁ
  choice: 人数增多
  rationale: 该动词表示增多、变得众多；补出“人数”使现代汉语自然，同时保留群体增长之意。
- source_word: ይፈደፍዱ
  choice: 繁衍起来
  rationale: 与前一动词构成平行，表达人数繁殖增多；译为“繁衍”比简单重复“增多”更能体现第二个动词的语义。
- source_word: ያስተረዙስዎሙ
  choice: 厌恶
  rationale: 该动词在此表示视为不洁、憎嫌或厌恶；主语是埃及人，宾语是以色列的子孙，因此正文采用“厌恶”，不误解为埃及人使他们招致他人厌恶。
- source_word: ውሉደ፡ እስራኤል
  choice: 以色列的子孙
  rationale: 直译亲属后裔用语，并保持经文庄重而通俗的表达。
theological_decisions:
- issue: 埃及人与以色列子孙之间的敌意由谁发出
  choice: 埃及人厌恶以色列的子孙
  alternative: 埃及人使以色列的子孙成了可厌恶的
  rationale: 动词在该语境中较自然地指埃及人把以色列人视为可憎而厌恶他们；异译保留使役形式的可能，但不在正文中把敌意的指向改成由埃及人造成他人厌恶。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“人数增多”明确群体增长，“也同样繁衍起来”保留两个平行动词，不强化原文未必明确的程度关系。脚注标记已在正文中列出。
