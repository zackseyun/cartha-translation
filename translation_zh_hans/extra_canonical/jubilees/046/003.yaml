revisions:
- from: 在约瑟一生的年日里，以色列众子都兴旺。约瑟死时一百一十岁。他在迦南地住了十七年，服侍人十年，在监牢里三年，又在埃及王法老的权下八十年。[a]
  to: 约瑟在世的日子里，得见以色列众子。约瑟死时一百一十岁。他在迦南地住了十七年，服役十年，在监牢里三年，又在埃及王法老管辖之下八十年。[a]
  rationale: 修正首句的核心动词，使其表达约瑟“得见”以色列众子，而不加入原文没有的“兴旺”意思。随后仅作必要的汉语措辞调整：“服役”不擅自补出服侍对象，“管辖之下”自然地呈现法老权柄关系。脚注保留文本摘录截断及“在埃及地八十年”的异译信息。
