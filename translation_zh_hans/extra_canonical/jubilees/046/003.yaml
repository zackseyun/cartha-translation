  terminology: “以色列众子”“迦南地”“监牢”“埃及王法老”均可保留。“服役十年”比“服侍人十年”更贴近原文未指明服侍对象的概括说法；“管辖之下”准确表达受法老权柄支配，且不额外断定约瑟的具体身份。
