base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/003.yaml
  text: the sons of Israel throughout all the days of Joseph's life. And Joseph died at the age of one hundred and ten years. Seventeen years he lived in the land of Canaan, and ten years while he was serving, and three years in the prison-house, and eighty years he was under the authority of Pharaoh, king of Egypt.
translation:
  language: zh_hans
  text: 约瑟在世的日子里，得见以色列众子。约瑟死时一百一十岁。他在迦南地住了十七年，服役十年，在监牢里三年，又在埃及王法老管辖之下八十年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所引吉兹文摘录在“八十年”处截断；该节完整文本的句末为“在埃及王法老的权下”。另有译法作“在埃及地八十年”。
    reason: 说明所提供吉兹文摘录的截断，并保留既有异译；正文依据审校轨迹所保存的完整句末翻译。
lexical_decisions:
- source_word: ርዎሙ
  choice: 兴旺
  rationale: 按此处概述以色列众子在约瑟一生中的境况来译；用现代汉语表达其安稳、得享福祉的语义，不把它窄化为单纯人数增长。
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወቱ፡ ለዮሴፍ
  choice: 在约瑟一生的年日里
  rationale: 保留“约瑟生命的全部日子”这一时间范围，同时采用自然庄重的汉语表达。
- source_word: ወሞተ፡ ዮሴፍ፡ ወልደ፡ ምእት፡ ወዓሠርቱ፡ ዓመት
  choice: 约瑟死时一百一十岁
  rationale: 原文以年龄说明约瑟去世之时；汉语用“死时……岁”简明准确。
- source_word: እንዘ፡ ይትቀነይ
  choice: 服侍人
  rationale: 该形式表示处于服役或为奴侍奉的状态；不擅自补出具体主人，以保留原文概括性。
- source_word: ቤተ፡ ሞቅሕ
  choice: 监牢
  rationale: 字面为拘禁之所、囚禁之屋；“监牢”符合现代叙事语体。
- source_word: ታሕተ፡ ሤመቱ፡ ለፈርዖን፡ ንጉሠ፡ ግብጽ
  choice: 在埃及王法老的权下
  rationale: 依据校勘记录所保存的完整句末，直译约瑟处于法老所授权柄或管辖之下；“权下”既可表达受其权柄管辖，也不排除受其任命掌权。
theological_decisions:
- issue: 约瑟最后八十年的身份关系
  choice: 在埃及王法老的权下
  alternative: 在埃及地住了八十年
  rationale: 完整句末的校勘证据明确提到法老及其权柄，不能仅按年数补作居住地点；所选措辞也不将这种关系过度解释为奴役或某一具体官职。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。开头承接上文，不另补主语之外的情节；年龄分项使用短句，使十七年、十年、三年和八十年的结构清晰。
