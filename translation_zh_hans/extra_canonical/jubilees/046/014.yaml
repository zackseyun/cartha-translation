base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/014.yaml
  text: 'And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen.'
translation:
  language: zh_hans
  text: 他委派监工管辖他们，用劳役苦待他们。他们为法老建造坚固城，就是比东和兰塞；又修筑所有倒塌的墙垣和堤垒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末尾的“倒塌的”在语法上也可能只修饰紧邻的“堤垒”。
    reason: 说明关系修饰语可能涵盖“墙垣和堤垒”两项，也可能只修饰后一项，保留原文范围上的歧义。
lexical_decisions:
- source_word: ሊቃነ፡ ግብር
  choice: 监工
  rationale: 字面为“劳作的首领”，语境中指监管强制劳役的人；“监工”符合现代汉语习惯，也与出埃及叙事背景相称。
- source_word: በቅኔ
  choice: 用劳役
  rationale: 该词在此表达受支配、服役或奴役性的劳作；译作“用劳役”既自然，也避免把含义限定为某一种压迫方式。
- source_word: አህጉረ፡ ጽኑዓተ
  choice: 坚固城
  rationale: 对应“坚固的城邑”，保留防御性城池的含义。
- source_word: ጥቆመ
  choice: 墙垣
  rationale: 依英语校勘层及上下文取“墙、墙垣”义；“墙垣”适合古代建筑语境而不显生僻。
- source_word: ዐረፋተ
  choice: 堤垒
  rationale: 可指土垒、堤岸或筑起的防御工事；“堤垒”保留其工程结构上的宽泛性。
- source_word: ዘወደቀ
  choice: 倒塌的
  rationale: 直译其“倒下、坍塌”之义，并保留关系修饰语在原文末尾所造成的范围含混。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“委派监工管辖他们”“用劳役苦待他们”清楚呈现强制劳动关系；城名采用常见圣经汉语音译“比东”和“兰塞”。末句用“修筑”而非明确增译为“重建”，以免过度解释，但“倒塌的”自然暗示修复性工程。
