base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/002.yaml
  text: And there was no adversary and nothing evil through all the days of Joseph's life that he lived after his father Jacob, because all Egypt honored him.
translation:
  language: zh_hans
  text: 约瑟的父亲雅各去世以后，在约瑟余下的一生中，没有仇敌，也没有任何祸患，因为全埃及都尊敬他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይጣን
  choice: 仇敌
  rationale: 此处指敌对者或对头；按上下文采用普通名词“仇敌”，不将其专名化为“撒但”。
- source_word: ምንተኒ፡ እኩየ
  choice: 任何祸患
  rationale: 原文意为“任何恶事/坏事”；“祸患”在此自然表达约瑟一生未遭邪恶或灾祸侵扰的意思。
- source_word: ያከብ
  choice: 尊敬
  rationale: 该词在本句表示给予尊荣；“尊敬他”符合全埃及对约瑟的态度，也合乎现代汉语表达。
theological_decisions:
- issue: ሰይጣን 是否应译作专名“撒但”
  choice: 译作“仇敌”
  alternative: 撒但
  rationale: 该词可表示“敌对者”，语境并未明确要求把它理解为超自然专名；保留普通名词义可避免不必要的神学具体化。
- issue: “在他父亲雅各之后”的含义
  choice: 译明为“他的父亲雅各去世以后”
  alternative: 在他的父亲雅各之后
  rationale: 这里的时间短语说明约瑟比父亲长寿并在其后继续生活；汉语若直译“在……之后”容易生硬或含混，补出“去世”是语境所要求的自然表达，并未改变命题内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在约瑟余下的一生中”承接原文“他在父亲雅各之后所活的全部日子”，既保留时间范围，也避免汉语重复累赘。
