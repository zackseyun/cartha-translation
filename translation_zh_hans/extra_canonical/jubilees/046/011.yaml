  text: Hebron; and your father Amram remained with them. And the king of Canaan defeated the king of Egypt.
translation:
  language: zh_hans
  text: 希伯仑；你父亲亚伯兰[a]仍和他们在一起。迦南王击败了埃及王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹文本作“亚伯兰”。按上下文，此名可能是“暗兰”的抄写讹误。
    reason: 保留现存原文读法，同时说明该姓名与上下文之间的文本困难，而不将校读当作无标记的原文。
lexical_decisions:
- source_word: አብራም
  choice: 暗兰[a]
  rationale: 吉兹文本字面作“亚伯兰”，但此处受话者是摩西，语境所指应为摩西的父亲暗兰，因此正文采用语境所要求的人名，并用脚注保留抄本读法。
- source_word: ተረፈ
  choice: 留在那里
  rationale: 表达“留下、仍与他们同在”的意思；结合地点“希伯仑”，译得自然明确。
- source_word: ሞአ
  choice: 击败了
  rationale: 该动词意为战胜、击败，并非“死”；此处表示迦南王战胜埃及王。
theological_decisions:
- issue: 父亲姓名的抄本异文
  choice: 正文作“暗兰”
  alternative: 按现存吉兹文本直译为“亚伯兰”
  rationale: “你父亲”所指为摩西之父，故“暗兰”符合叙事语境；同时脚注明示原文读法，既避免误导普通读者，也不掩盖文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“希伯仑”保留为承接上文的片段式地名；不擅自补足原文省略的句法内容。
