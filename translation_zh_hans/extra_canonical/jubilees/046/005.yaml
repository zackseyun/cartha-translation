  text: and all that generation. And he commanded the sons of Israel before he died that they should carry
translation:
  language: zh_hans
  text: 以及那整个世代。约瑟在去世以前，吩咐以色列的子孙把……带走。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文至此句意未完；所要带走的对象见下节。
    reason: 说明省略号源于节界处原句未完，而非文本缺失或译者删略。
lexical_decisions:
- source_word: ወኵላ፡ ይእቲ፡ ትውልድ
  choice: 以及那整个世代
  rationale: 按字面保留“那整个世代”，并以“以及”承接上文；本节开头本身是前句的延续。
- source_word: ለውሉደ፡ እስራኤል
  choice: 以色列的子孙
  rationale: 保留闪语式群体称谓的经文庄重感，同时符合现代汉语。
- source_word: ዘእንበለ፡ ይሙት
  choice: 在去世以前
  rationale: 表达“尚未死／死以前”的时间意义；在汉语中置于“吩咐”之前更自然，不改变其修饰关系。
- source_word: ከመ፡ ይስዱ
  choice: 把……带走
  rationale: 动词表示拿取、带走；原文在本节末止于从属结构，宾语须由后文补足，因此用省略号保留未完句。
theological_decisions:
- issue: 命令者的身份
  choice: 在正文中明示“约瑟”
  alternative: 仅译作“他”
  rationale: 吉兹语以动词人称表达“他”，而本节脱离上下文时中文代词指向不清；根据本章语境补出约瑟，不引入额外神学解释。
- issue: 临终命令的内容
  choice: 不补明所带之物
  alternative: 依据后文补作“他的骸骨”
  rationale: 本节所给原文到“带走”为止；补出后文宾语会越过当前节界，因此保留悬而未完的结构。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“去世”较“死”适合叙事语境；保留首句对上文的承接，并用省略号和脚注如实呈现本节末尾的未完结构。
