base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/001.yaml
  text: And it came to pass after Jacob died, the sons of Israel increased in the land of Egypt, and they became a numerous people; and they were all united in their hearts, so that each loved his brother and a man helped his brother. And they increased abundantly and multiplied exceedingly during all the days of Joseph, for ten weeks of years.
translation:
  language: zh_hans
  text: 雅各死后，以色列的子孙在埃及地增多，成了人数众多的民族；他们都同心合意[a]，彼此相爱，人人都帮助自己的弟兄。在约瑟的年日中，整整十个七年期，他们极其增多，大大繁衍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的心都一致”。
    reason: 原文可较直译为众人在心里一致，强调内在的同心与团结。
lexical_decisions:
- source_word: በዝኁ
  choice: 增多／繁衍
  rationale: 该动词在本节反复出现，基本义为“增多、繁衍”；依汉语语境分别译作“增多”和“繁衍”，既保留语义重复，也避免生硬复沓。
- source_word: ሕዝበ፡ ብዙኃ
  choice: 人数众多的民族
  rationale: ሕዝብ 指群体、人民或民族，ብዙኃ 指众多；此处描述以色列子孙形成庞大族群。
- source_word: ዕሩያነ፡ በአልቦሙ
  choice: 同心合意
  rationale: 结合“在他们心里”的表达，意指内心一致、彼此和睦；用现代汉语成语自然传达，同时以脚注保留较直译的可能。
- source_word: ይትራዳእ
  choice: 帮助
  rationale: 该词表达互相援助；上下文具体说一人帮助自己的弟兄。
- source_word: ዐሠርተ፡ ሱባዔ፡ ዓመታት
  choice: 十个七年期
  rationale: 直译为“十个年之七期”，即七十年；保留《禧年书》以七年为周期的时间表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“彼此相爱，人人都帮助自己的弟兄”将原文重复的“弟兄”关系转化为流畅汉语，同时保留群体互爱互助之意；末句不补入原文未明说的“约瑟一生”。
