  yaml_path: translation/extra_canonical/jubilees/046/009.yaml
  text: in the land of Egypt. And all his brothers died after him. And the king of Egypt went out to fight with the king of Canaan in the forty-seventh jubilee, in the second week, in the second year; and the sons of Israel brought out all the bones of the sons of Jacob, except the bones of Joseph, and they buried them in the field, in the double cave in the mountain,
translation:
  language: zh_hans
  text: 在埃及地。此后，他的兄弟们都死了。第四十七个禧年、第二个七年期的第二年，埃及王出兵与迦南王交战。以色列子孙把雅各众子的骸骨全都带了出来，只有约瑟的骸骨没有带出；他们把这些骸骨葬在田野里，在双洞里，在山中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在田野里，在双洞里，在山中”；原文连续使用地点介词，未完全说明这些地点彼此之间的关系。
    reason: 保留原文连续地点短语的句法歧义，避免将“山中”确定为“双洞”的限定语，或将各地点武断地处理为所有格关系。
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词本义为“七个一组／一周”；在《禧年书》的纪年公式中指七年为一期。译作“七年期”既保留历法结构，也比单说“周”更便于现代读者理解。
- source_word: ውሉደ፡ እስራኤል
  choice: 以色列子孙
  rationale: 直译为“以色列的儿女／子孙”，此处指以色列的后裔，不限于亲生儿子。
- source_word: አዕፅምቲሆሙ
  choice: 骸骨
  rationale: 原词意为“骨头”；用于迁葬先祖遗骨的语境时，“骸骨”自然、庄重。
- source_word: በዐት፡ ዘካዕበት
  choice: 双洞
  rationale: 字面为“双重的洞穴／第二洞穴”。“双洞”保留其形态含义，不擅自用传统地名替代。
- source_word: ይትቃተል
  choice: 交战
  rationale: 该动词表达彼此作战；结合“出兵”语境，译作“交战”简洁而准确。
theological_decisions:
- issue: “以色列子孙”与“雅各众子”的关系
  choice: 保留两种称谓，不将二者合并
  alternative: 统一译为“以色列人”或“雅各的后裔”
  rationale: 原文有意分别使用“以色列子孙”和“雅各众子”，前者是执行迁葬者，后者是被迁葬的先祖；保留称谓差异可避免抹平代际关系。
- issue: 埋葬地点中“田野、双洞、山”的关系
  choice: 正文按自然中文呈现为“在田野里，在山中的双洞里”，并以脚注保存原文并列结构的歧义
  alternative: 明确译成“田野的双洞”或将三者完全视为彼此独立的地点
  rationale: 原文重复使用“在”引出地点，却未完全说明三者的从属关系；不宜武断建立所有格或地点关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“禧年—七年期—年”的纪年层级明确呈现；避免用教派化术语或用传统地名替换原文。“在埃及地”保留为承接上文的句段，因为所给原文即以此续接。
