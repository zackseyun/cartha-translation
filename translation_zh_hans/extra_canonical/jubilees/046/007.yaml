revisions:
- from: 埃及，在那里杀了他；他又追赶他们到了埃及，一直追到埃罗蒙关口。但他无法进去，因为另有一位新王登基统治埃及，比他更强。他便返回迦南地。埃及的关口关闭了，无人出埃及，也无人进入埃及。
  to: 到了埃及，在那里杀了他；他又追赶他们到埃及，一直追到埃罗蒙的关口。但他无法进去，因为另有一位新王登基统治埃及，比他更强。他便返回迦南地。埃及的关口被关闭了，无人出埃及，也无人进入埃及。
