lexical_decisions:
- source_word: ይቀንይዎሙ
  choice: 强迫他们服苦役
  rationale: 该动词在此表示使人受役、服事；结合“以强暴”和埃及奴役的语境，译为“服苦役”自然且准确。
- source_word: በግፍዕ
  choice: 强迫
  rationale: 本义涉及强暴、压制或不公；与使役动词合译为“强迫”，避免生硬的“以暴力使他们服事”。
- source_word: ያሐስሙ
  choice: 压迫
  rationale: 表达使人受苦、严酷对待的含义；“压迫”简洁地保留奴役语境中的强制与苦待。
- source_word: መጠነ … ከማሁ
  choice: 越是……就越是……
  rationale: 保留原文关联比较结构，同时让现代汉语读者自然理解其递进关系。
