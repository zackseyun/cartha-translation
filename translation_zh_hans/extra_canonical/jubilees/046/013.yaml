revisions:
- from: 他压迫他们，又对埃及人说：“看哪，以色列子孙这族人数比我们多，势力也比我们强。来吧，我们要用计对付他们，免得他们继续增多；我们要用苦役压迫他们，免得战争临到我们，他们也联合我们的仇敌攻打我们，并离开我们的国土；因为他们的心和面都朝向迦南地。”
  to: 他压迫他们，又对埃及人说：“看哪，以色列子孙这族人比我们更多，也比我们强盛。来吧，让我们用计对付他们，趁他们还没有增多；让我们以苦役压迫他们，免得战争临到我们，他们也联合我们的仇敌攻打我们，并离开我们的国土；因为他们的心和面容都朝着迦南地。”
  rationale: 修订首次“免得他们继续增多”为“趁他们还没有增多”，以对应源文的时间性表达。其余调整限于现代汉语的顺畅度和命令语气；保留“攻打我们”，以呈现源文中明确的交战动词，并保留“离开我们的国土”，不依据《出埃及记》的平行措辞擅改为“上去”。无需脚注：本节关键的“以前”与“出去”可在正文直接明确表达。
