base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/013.yaml
  text: and he oppressed them, and he said to the people of Egypt, 'Look, the people of the children of Israel are more and stronger than we are. Come, let us deal wisely with them, before they multiply, and let us oppress them with servitude, lest war come upon us and they also join themselves to our enemies and go out from our land, for their hearts and their faces are toward the land of Canaan.'
translation:
  language: zh_hans
  text: 他压迫他们，又对埃及人说：“看哪，以色列子孙这族人比我们更多，也比我们强盛。来吧，让我们用计对付他们，趁他们还没有增多；让我们以苦役压迫他们，免得战争临到我们，他们也联合我们的仇敌攻打我们，并离开我们的国土；因为他们的心和面容都朝着迦南地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያሕምሞሙ / ወናሕምሞሙ
  choice: 压迫他们／用苦役压迫他们
  rationale: 该词在上下文中指施加痛苦和压制；前后采用“压迫”保持词汇呼应，第二处结合በቅኔ明确表达为“用苦役”。
- source_word: ሕዝበ፡ ውሉደ፡ እስራኤል
  choice: 以色列子孙这族
  rationale: 既保留“以色列子孙”的传统群体称谓，也体现ሕዝብ“族、民”的集体含义。
- source_word: ንጥበብ፡ ላዕሌሆሙ
  choice: 用计对付他们
  rationale: 直译近于“对他们行智慧之事”，语境中是谋划控制，现代汉语以“用计对付”自然且不美化其行动。
- source_word: ዘእንበለ፡ ይብዝኁ
  choice: 免得他们继续增多
  rationale: ዘእንበለ可表达“在……以前／以免”；这里按法老防范人口增长的目的关系译为“免得”，同时以“继续增多”呈现动态。
- source_word: ይጽብኡነ
  choice: 攻打我们
  rationale: 该动词涉及交战或出兵；与“联合我们的仇敌”连用时，“攻打我们”最符合句法和战争语境。
- source_word: ይወፅኡ፡ እምድርነ
  choice: 离开我们的国土
  rationale: ወፅአ意为“出去”，不是“上去”；中文在此译“离开”准确表达从本国出去。
- source_word: ልቦሙ፡ ወገጾሙ፡ ውስተ፡ ምድረ፡ ከናአን
  choice: 他们的心和面都朝向迦南地
  rationale: 保留“心和面”的双重意象及其朝向，不将其简化为单一的愿望或意图。
theological_decisions:
- issue: “心和面朝向迦南地”的含义
  choice: 保留具象表述，不解释为神圣应许、归乡愿望或政治企图
  alternative: 译作“他们一心想回迦南地”
  rationale: 原文同时提到“心”和“面”，其确切涵义带有修辞张力；直保意象可避免加入原文未明说的神学或心理解释。
- issue: 战争情境中的以色列人行动
  choice: 译为“联合我们的仇敌攻打我们”
  alternative: 仅译“投靠我们的仇敌”
  rationale: 原文在联合仇敌之外另有交战动词，译文应呈现法老所担忧的军事行动，而不省略。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引语保留法老连续陈述的压迫逻辑；以“看哪”“来吧”呈现原文号召语气。未设置脚注，因为关键异文可在正文中由源文直接裁定：ወፅአ为“出去／离开”，而非“上去”。
