- source_word: ዐጸወ፡ አንቀጸ፡ ግብጽ
  choice: 封闭了埃及的关口
  rationale: ዐጸወ意为关闭、封闭，አንቀጸ指门或关口；此处保留单数表达，并用“关口”呈现可能涉及出入通道的含义。
- source_word: ሐለየ፡ እኩየ፡ ሕሊና
