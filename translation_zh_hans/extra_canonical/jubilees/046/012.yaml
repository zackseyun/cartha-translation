- source_word: ውሉደ፡ እስራኤል
  choice: 以色列的子孙
  rationale: 按字面保留“以色列的子孙”，避免改成较宽泛的“以色列人”。
- source_word: ከመ
  choice: 以便
  rationale: 该连接词引出目的或结果从句；原文在本节末停顿，后文尚未给出，因此保留未完结构。
theological_decisions:
- issue: 恶计与以色列子孙之间的关系
  choice: 要加害以色列的子孙
  alternative: 针对以色列的子孙图谋恶计
  rationale: 介词ላዕለ可表达“针对、反对”；译文明确其敌对指向，但不补入原文未说明的具体加害方式。
- issue: 末尾目的连接词的悬置
  choice: 保留“以便”形成未完句
  alternative: 删去连接词，使本节成为完整句
  rationale: 原文以ከመ结束，显然连接下一节；保留悬置可忠实呈现经文分节造成的未完句，并避免擅自补足内容。
