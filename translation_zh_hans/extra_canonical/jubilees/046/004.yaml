lexical_decisions:
- source_word: እምታሕተ፡ ንጉሥ
  choice: 在王手下
  rationale: 直译其空间性介词所表达的从属关系，并保留“王”这一称谓。
- source_word: እንዘ፡ ይኴንን
  choice: 那时他统管
  rationale: እንዘ引出同时发生的情状；用“那时”自然呈现“当……时”的关系，ይኴንን译作“统管”。
- source_word: ኵላ፡ ምድረ፡ ግብጽ
  choice: 埃及全地
  rationale: 准确保留“全部、土地、埃及”的范围与地名。
- source_word: ወሞተ
  choice: 他死了
  rationale: 按单数动词直译，主语承接上文人物。
- source_word: ወኵሎሙ፡ አኅዊሁ
  choice: 他所有的兄弟也都死了
  rationale: 原文逐字近似“以及他所有的兄弟”，在本节截取处形成省略；汉语补出共享谓语“死了”，使句意完整而不增加新的事件。
