translation:
  language: zh_hans
  text: ……他的骸骨——在他们离开埃及地的那一天。随后他叫他们就他的骸骨起誓，因为他知道，埃及人不会再把他带出（埃及），葬在迦南地。因为迦南王马克马龙住在亚述地时，曾在谷中与……王交战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存引文在“与……王交战”处中断；下一位王的名字不在本次所给原文范围内。
    reason: 标明所提供底本文段在句末中断，避免擅自补足交战对象。
lexical_decisions:
- source_word: አዕፅምቲሁ
  choice: 他的骸骨
  rationale: 原词指“他的骨头/骸骨”；中文叙事中“骸骨”庄重自然，也符合迁葬语境。
- source_word: በመዋዕለ፡ እመ፡ ይወፅኡ
  choice: 等到他们……的那一天
  rationale: 保留“在他们出去之日”的时间表达，并用现代汉语自然呈现。
- source_word: አምሐሎሙ
  choice: 叫他们……起誓
  rationale: 该动词为使役意义，即让人宣誓，而非说话者自己起誓。
- source_word: አውፅኦተ፡ ወቀቢሮተ
  choice: 把他运出去，安葬
  rationale: 分别表达“带出”与“埋葬”；结合骸骨迁运语境，以“运出去”比直译“带出去”更自然。
- source_word: ማክማሮን
  choice: 马克马龙
  rationale: 按人名音译，不将其与未经证实的其他名称等同。
- source_word: በቈላ
  choice: 在谷中
  rationale: 按原文保留地形意义，不擅自指定某一山谷。
theological_decisions:
- issue: 约瑟要求后人带走骸骨的原因
  choice: 保留为他预知埃及人不会再次将他运往迦南安葬
  alternative: 解释为埃及人不愿安葬他，或明确归因于神启示
  rationale: 原文只陈述“他知道”，没有说明知识来源；不补入启示、预言或动机。
- issue: “不会再”所指的先前事件
  choice: 保留“再”的含混性
  alternative: 明确解释为此前将雅各送往迦南安葬
  rationale: 上下文可能暗指先前的送葬，但本节没有明说，因此正文不作限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。经文从上一句承接而来，开头本属残句；中文以“他的骸骨”保留这种承接关系，同时补入“带走”使句法可读。结尾严格保留所提供格尔兹文本的未完状态，并以脚注说明。
