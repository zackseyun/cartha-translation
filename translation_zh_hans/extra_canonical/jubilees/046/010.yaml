translation:
  language: zh_hans
  text: 许多人回到了埃及，但他们中只有少数人留在希伯仑山区。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወገብኡ
  choice: 回到了
  rationale: 该动词在此表示“返回、回去”，与目的地“埃及”自然搭配。
- source_word: ብዙኃን
  choice: 许多人
  rationale: 直译其复数含义，并与后文“少数人”形成对照。
- source_word: ወኅዳጣን ተርፉ እምኔሆሙ
  choice: 但他们中只有少数人留在
  rationale: 保留“许多—少数”的对比；“他们中”对应 እምኔሆሙ，“留在”表达 ተርፉ 在语境中的存留之意。
- source_word: ውስተ ደብረ
  choice: 在……山区
  rationale: ደብረ 是与后接地名连属的形式；结合校勘信息，所支配的地名“希伯仑”因分节而落入下一节。汉语以“希伯仑山区”自然表达该地理短语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“希伯仑”依据连属结构及分节校勘补足，但不加方括号，以免把可靠的跨节词组误呈为臆补。
