base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/001.yaml
  text: And the Lord knew that Abraham was faithful in all his trials; for he had tested him in his country, and with famine, and had tested him through the wealth of kings, and again had tested him through his wife when she was taken away, and through circumcision, and had tested him through Ishmael and Hagar his maidservant when he sent them away. And in everything by which he had tested him, he was found faithful, and his soul was not impatient, and he did not delay in acting; for he was faithful and a lover of the Lord.
translation:
  language: zh_hans
  text: 耶和华知道亚伯拉罕在一切考验中都忠信；因为他曾在亚伯拉罕的本地考验他，也借着饥荒考验他，又借着众王的财富考验他；又在他的妻子被带走时，借着他的妻子考验他，也借着割礼考验他；并且在他遣走以实玛利和他的婢女夏甲时，借着他们考验他。在这一切考验中，亚伯拉罕都显为忠信；他心里没有不耐烦，也没有迟延行事，因为他忠信，并且爱耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሃይምን / ምእመን
  choice: 忠信
  rationale: 该词在本节首尾及结论处反复出现，兼有可信、忠诚之意；译作“忠信”可保留重复，并适合亚伯拉罕经受考验的语境。
- source_word: ምንዳቤሁ / አመከሮ
  choice: 考验／考验他
  rationale: 原文以相关的“试验、考验”语汇贯穿全节；用“考验”既自然，也保留反复出现的主题线索。
- source_word: በምድሩ
  choice: 在亚伯拉罕的本乡
  rationale: 字面近于“在他的地／国土”；此处指亚伯拉罕原先所在之地。“本乡”比笼统的“地”更能自然表达这一关系，又不过度指定具体地名。
- source_word: በብዕለ፡ ነገሥት
  choice: 借着众王的财富
  rationale: 保留“财富”和复数“众王”，不把隐含所指解释成某一次具体事件。
- source_word: እመ፡ ትትሃየድ
  choice: 在他的妻子被带走时
  rationale: 保留原文被动表达及事件背景，不擅自补出带走她的人或地点。
- source_word: አመቱ
  choice: 婢女
  rationale: 此词指女性奴仆或婢女；“婢女”符合古代叙事语体，同时避免现代雇佣关系的“女仆”含义。
- source_word: ወኢተአገተት፡ ነፍሱ
  choice: 他心里没有不耐烦
  rationale: “灵魂／性命”在此表达内在态度；汉语以“心里”自然传达其义，并保留“不耐烦”的心理层面。
- source_word: መፍቀሬ፡ እግዚአብሔር
  choice: 爱耶和华
  rationale: 原文可直译为“耶和华的爱者／爱耶和华的人”；在中文句中用“爱耶和华”简洁自然。
theological_decisions:
- issue: “耶和华知道”与其后“考验”的关系
  choice: 保留“知道……因为他曾……考验他”的表述
  alternative: 译成“耶和华由此得知”或“证实”
  rationale: 原文并未系统说明神的知识是否因考验而新增；直译其叙事逻辑，可避免替文本消解潜在的神学张力。
- issue: 亚伯拉罕的“忠信”是绝对无过还是在所列考验中的评价
  choice: 限定为“在一切考验中都忠信／都显为忠信”
  alternative: 译作“亚伯拉罕凡事完全无罪”
  rationale: 原文评价集中于所列考验及其回应，不应扩展为关于绝对无罪的教义判断。
- issue: “众王的财富”所指事件
  choice: 保留概括性表达
  alternative: 明确解释为亚伯拉罕拒绝所多玛王财物或接受诸王赠礼
  rationale: 原文本身未明确锁定单一事件，故保留其概括性和可能的互文空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。通过重复“考验”和“忠信”再现原文的修辞结构；适度补出“亚伯拉罕”以避免连续代词在中文中产生指代混乱。神名按《禧年书》该句的通常语义译为“耶和华”。
