  to: 他想起罗得与他分开那天，主对他所说的话，就欢喜，因为主赐给他后裔，使他承受这地；他用全口称颂创造主。
  rationale: 仅将“他们”改为“他”，保留原文单数形式所呈现的指代张力，不预断其究竟专指亚伯拉罕还是以单数指代其后裔；并将结句调整为更自然且更贴近“用他的全口称颂创造主”的汉语表达。
