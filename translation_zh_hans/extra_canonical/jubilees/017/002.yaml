base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/002.yaml
  text: And the Lord said to him, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your beloved son whom you love, Isaac, and go into the high land, and offer him there on one of the mountains that I will show you.” And he rose early in the morning and saddled his donkey and took two of his young servants with him, and Isaac his son; and he split the wood of the offering and went to the place on the third day, and he saw the place from afar. And he came to a well of water, and he said to his young servants, “Stay here with the donkey, and I and the boy will go on, and when we have worshiped we will return to you.” And he took the wood of the sacrifice and laid it on Isaac his son, and he took in his hand the fire and the knife. And the two of them went together to that place.
translation:
  language: zh_hans
  text: 他想起罗得与他分开那天，主对他所说的话，就欢喜，因为主赐给他后裔，使他承受这地；他用全口称颂创造主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከረ
  choice: 想起
  rationale: 准确表达回想起先前话语的动作，符合现代汉语叙事习惯。
- source_word: ተፈልጠ፡ ሎጥ፡ እምኔሁ
  choice: 罗得与他分开
  rationale: 保留罗得离开亚伯拉罕的基本语义，以自然中文表达分离关系。
- source_word: ዘርአ
  choice: 后裔
  rationale: 此处指上帝赐下的子孙或种裔；“后裔”既庄重又符合上下文。
- source_word: ይረሳ፡ ለምድር
  choice: 承受这地
  rationale: 该动词具有继承、取得产业之意；“承受这地”保留应许之地与产业继承的语感。
- source_word: በኵሉ፡ አፉሁ
  choice: 满口
  rationale: 源文直指“用他的全口”；“满口颂赞”保留形象，同时符合现代汉语。
- source_word: ፈጣሪ
  choice: 创造主
  rationale: 保留“创造者”的称号及敬拜语境中的尊称色彩。
theological_decisions:
- issue: “承受这地”的主语
  choice: 以“后裔”为承受者，并用“他们”明示
  alternative: 以亚伯拉罕为承受者，译作“使他承受这地”
  rationale: 源文在“赐给他后裔”之后使用单数形式，语法上存在张力；上下文的土地应许通常涉及其后裔。中文若不补主语会生硬，因此采用“他们”表达集合名词“后裔”的自然指向，但不扩展具体神学含义。
- issue: 说话者的身份
  choice: 译作“主对他所说的话”
  alternative: 译作“他对他说的话”
  rationale: 源文代词本身可依上下文指认；土地与后裔的应许来自主，因此在中文中明示“主”，避免代词链造成误解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。源文行与所给英文咨询文本内容明显不对应，因此译稿以吉兹语原文行为准，不把英文文本中献以撒的叙事内容移入本节。
