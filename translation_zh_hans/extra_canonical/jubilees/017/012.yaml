  text: And He opened her eyes and saw a well of water, and she went and filled the skin with water and gave him drink.
translation:
  language: zh_hans
  text: 他开了她的眼睛，她就看见一口水井。她便去把水袋装满了水，给他喝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከሠተ፡ አዕይንቲሃ፡
  choice: 他使她睁开眼睛
  rationale: 动词“ወከሠተ”是第三人称阳性单数，另以阴性物主后缀指向“她的眼睛”；译文保留未明说的男性主语，并自然表达“打开她的眼睛”的使动含义。
- source_word: ዐዘቅተ፡ ማይ፡
  choice: 一口水井
  rationale: 该词组指取水的井或水源；结合叙事场景译作“水井”，并用量词“一口”符合现代汉语习惯。
- source_word: ዝቃ፡
  choice: 水袋
  rationale: 指用皮制成、可盛水的容器；译作“水袋”比音译或泛称“器皿”更清楚自然。
- source_word: ወአስተየቶ፡
  choice: 给他喝
  rationale: 该使役饮用形式及其宾语后缀表达“使他喝／给他水喝”；简洁译作“给他喝”。
theological_decisions:
- issue: 首句未明说的阳性主语是谁
  choice: 译作“他”，不直接补成“上帝”
  alternative: “上帝使她睁开眼睛”
  rationale: 吉兹语动词明确标示第三人称阳性单数，却在本节没有明说主语名称。译作“他”既体现语法信息，也避免仅凭平行经文把解释直接写入正文。
- issue: “打开眼睛”的表达性质
  choice: “使她睁开眼睛”
  alternative: “开了她的眼睛”
  rationale: 现代汉语中“使她睁开眼睛”自然表达外在主体使其得以看见，同时不额外界定这是神迹、启示还是恢复视觉。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。连续的吉兹语叙事连接词按汉语节奏处理为“就”“便”，保留动作顺序而避免机械重复“又”。
