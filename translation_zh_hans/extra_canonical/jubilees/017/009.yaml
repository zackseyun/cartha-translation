  yaml_path: translation/extra_canonical/jubilees/017/009.yaml
  text: And he took bread and a skin of water and put them on Hagar's shoulder, and the child, and sent her away. And she went and wandered in the wilderness of Beersheba, and the water in the skin was finished, and the child was thirsty and was unable to walk, and he fell.
translation:
  language: zh_hans
  text: 他拿了饼和一皮袋水，放在夏甲肩上，又把孩子交给她，便打发她走了[a]。她走着，在别是巴的旷野游荡。皮袋里的水用完了，孩子口渴，走不动了，就倒在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处的句法较为压缩：也可理解为“把饼和水交给夏甲和孩子，便打发他们走了”。
    reason: 保留“使负荷／放在肩上”与“夏甲和孩子”之间关系的歧义；正文则依动词的具体含义，并按叙事语境以自然中文表达。
lexical_decisions:
- source_word: አስከማ (ʾaskamā)
  choice: 放在……肩上
  rationale: 该使役动词含有“使负荷、使扛在肩上”的意思；如此译出其具体动作，不弱化为泛指的“给”。
- source_word: ተንገገ (tangagā)
  choice: 迷了路
  rationale: 在旷野语境中表达游荡、迷失方向；比单纯“徘徊”更自然，也与叙事处境相符。
- source_word: ተፈጸመ (tafaṣṣama)
  choice: 用完了
  rationale: 原义为“完结、耗尽”，用于皮袋中的水，现代汉语自然表达为“用完了”。
- source_word: ስእነ ሐዊረ (səʾna ḥawira)
  choice: 走不动了
  rationale: 直译为“不能行走”，采用简洁自然的现代汉语，同时保留孩子因口渴而失去行走能力的含义。
- source_word: ወድቀ (wadqa)
  choice: 倒在地上
  rationale: 原词意为“跌倒、倒下”；补出“在地上”使中文画面清楚，不增加原因判断。
theological_decisions:
- issue: 孩子是否也被放在夏甲肩上
  choice: 正文译作“连同孩子一起放在夏甲肩上”
  alternative: “让夏甲和孩子带着这些”或“把这些交给夏甲和孩子”
  rationale: 原文在“使负荷/放在肩上”之后并列提到夏甲和孩子，句法略显压缩。正文依动词的具体含义及英译审校层的判断，理解为饼、水和孩子都放在夏甲肩上；脚注保留另一种可能，避免借孩子年龄等外部推断改写文本。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“皮袋”保留古代盛水容器的文化背景；“别是巴的旷野”沿用常见地名形式。后半节使用短句，呈现水尽、口渴、无力行走、倒下的连续进展。
