revisions:
- from: 他想起了上主在罗得与他分离的那一天对他说过的那句话，就欢喜，因为主赐给他后裔在地上，使他承受大地[a]；他便满口称颂创造主。
  to: 他想起主在罗得与他分离的那一天对他说过的话，便欢喜，因为主赐给他后裔，使他们在地上承受大地[a]；他便满口称颂创造主。
  rationale: 修订使“在地上”与“承受大地”的关系在汉语中清楚自然，并将承受的行动与“后裔”相连，符合“赐给他后裔……以承受大地”的语义推进。将“上主”统一为“主”，保留“话”的单数、后裔、承受及创造主等关键表达。
