base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/003.yaml
  text: And he remembered the word that He had spoken to him on the day when Lot was separated from him, and he rejoiced because the Lord had given him seed upon the earth to inherit the earth, and he blessed the Creator with all his mouth.
translation:
  language: zh_hans
  text: 他想起主在罗得与他分离的那一天对他说过的话，便欢喜，因为主赐给他后裔，使他们在地上承受大地[a]；他便满口称颂创造主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”。
    reason: 格厄兹语ምድር可指大地、土地或地域；此处的具体范围未明，正文保留较宽泛的“大地”。
lexical_decisions:
- source_word: ቃሎ፡ ዘተናገሮ፡
  choice: 对他说过的那句话
  rationale: ቃል为单数“话、话语”，动词所带宾语后缀表示“对他”；结合语境，指上主对亚伯拉罕所说的应许。
- source_word: ዘርአ፡
  choice: 后裔
  rationale: 本义为“种子”，用于赐给族长的应许时自然指后代、后裔。
- source_word: ይረሳ፡
  choice: 承受
  rationale: 源自动词ወረሰ，意为“继承、承受”，不取旧译“遍布、覆盖”。
- source_word: ምድር፡
  choice: 地上／大地
  rationale: 该词可指地、土地或大地；按两个介词结构分别译为自然的“在地上”和“承受大地”。
- source_word: በኵሉ፡ አፉሁ፡
  choice: 满口称颂
  rationale: 贴近“用他的整个口”的表达，同时采用现代汉语中自然而庄重的说法。
- source_word: ለፈጣሪ፡
  choice: 创造主
  rationale: 保留“创造者”作为神圣称号的功能，并使中文表达庄重简洁。
theological_decisions:
- issue: 所记起之话语的说话者
  choice: 明确译为“上主……对他说过的那句话”
  alternative: “他想起了他对自己说过的那句话”
  rationale: 人称后缀与《创世记》相关语境共同表明，说话者是上主，听者是亚伯拉罕；明确主语可避免现代汉语代词混乱。
- issue: “承受大地”的隐含主语
  choice: 采用不重复主语的“使他承受大地”
  alternative: 明确译作“使他的后裔承受大地”
  rationale: 原文动词为第三人称阳性单数，形式上可回指亚伯拉罕，也可能从集体性的“后裔”来理解；正文不额外补入“他的后裔”，以免过度消解句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留“上主”“创造主”等称号，并以“那句话”体现原文单数。脚注标记已置于正文相应位置。
