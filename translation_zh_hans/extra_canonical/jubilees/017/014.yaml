  text: And she bore him a son and he called his name Nabaioth, for she said, “The Lord is near to me.”
translation:
  language: zh_hans
  text: 她给他生了一个儿子，他给孩子取名叫尼拜约，因为她说：“主离我很近。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናቤዮት
  choice: 尼拜约
  rationale: 采用现代中文圣经中对同一人名 Nabaioth/Nebaioth 的通行译名，便于识别其与以实玛利家谱人物的对应关系。
- source_word: ቅሩብ
  choice: 离……很近
  rationale: 该词意为“近、临近”；结合后接“对我/于我”，译作“离我很近”自然清楚，同时保留原文所表达的临近关系。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 按此处神圣称号的通常语义译作“主”，不额外指定原文未明说的专名形式。
theological_decisions:
- issue: 给孩子命名者的身份
  choice: 明确译为“他给孩子取名”
  alternative: 省略主语，译作“就给孩子取名”
  rationale: ጸውዐ 是第三人称阳性单数，与前面的阴性单数“她生了”和后面的阴性“她说”形成明确主语转换；译出“他”可忠实保留这一语法信息。
- issue: “主离我很近”的含义
  choice: 保留空间或关系上“临近”的开放表达
  alternative: 解释为“主垂顾我”或“主帮助我”
  rationale: 原文只陈述主“近”，未具体说明是眷顾、帮助还是临在，因此不作神学性扩展。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“她给他生了一个儿子”保留原文关系结构；“给孩子取名叫”比直译“叫他的名为”更符合当代汉语，同时明确阳性主语转换。引语简洁，保留命名缘由的含蓄性。
