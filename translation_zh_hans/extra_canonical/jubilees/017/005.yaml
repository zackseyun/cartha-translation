  yaml_path: translation/extra_canonical/jubilees/017/005.yaml
  text: …and her son, for the son of this servant woman will not be an heir with my son Isaac.” And the matter was very grievous in the sight of Abraham because of his maidservant and because of his son.
translation:
  language: zh_hans
  text: ……以及她的儿子，因为这婢女的儿子不能与我的儿子以撒一同承受产业。”[a] 这件事因他的婢女和他的儿子的缘故，使亚伯拉罕极其忧愁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“……以及她的儿子，因为这女奴的儿子不能与我的儿子以撒一同继承产业。”
    reason: 说明“婢女”可较直译为“女奴”，并保留“承受产业／继承产业”的自然表达差异。
lexical_decisions:
- source_word: አመቱ
  choice: 婢女
  rationale: 该词指处于奴仆身份的女子；“婢女”在现代中文中庄重、清楚，也适合本段古代家内奴仆的语境。
- source_word: ኢይወርስ
  choice: 不可……承受产业
  rationale: 保留“继承、取得产业”的核心含义；相较单说“作继承人”，这一表达在中文句中更自然。
- source_word: ማኅዘነ
  choice: 十分难受
  rationale: 表达此事令亚伯拉罕深感痛苦、忧伤，不把这种情绪过度限定为某一种心理状态。
theological_decisions:
- issue: 婢女之子与以撒共同继承的否定范围
  choice: 不可与我的儿子以撒一同承受产业
  alternative: 不能成为与我的儿子以撒同等的继承人
  rationale: 原文否定其“与以撒一同继承”，并未进一步明说继承份额、地位是否同等，因此不加入“同等”等解释性限定。
- issue: 亚伯拉罕痛苦的缘由
  choice: 因他的婢女和儿子
  alternative: 只因他的儿子
  rationale: 本节吉兹文明确同时提到婢女和儿子，故保留两者，不按《创世记》平行经文缩减。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。开头用省略号表明“还有她的儿子”承接上一节未完的命令；保留引语在本节结束处闭合。
