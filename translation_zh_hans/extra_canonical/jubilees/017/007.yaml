  text: For in Isaac a name and seed will be called for you. And concerning the son of this servant woman,
translation:
  language: zh_hans
  text: 因为在以撒中，必有名和后裔被称为属于你[a]。至于这婢女的儿子，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“因为在以撒中，名和后裔必为你被称。”
    reason: 原文保留“在以撒中”和“被称”的表达；“名和后裔”并列，具体所指及“为你”的归属关系可有不同理解。
lexical_decisions:
- source_word: በይስሐቅ
  choice: 在以撒里
  rationale: 保留介词“在……里”的原文表达，并与创世记相关措辞的语义联系相协调。
- source_word: ይጼዋዕ፡ ለከ፡ ስም፡ ወዘርእ
  choice: 必有名和后裔归于你
  rationale: 原文直译近于“名和后裔将为你被称”；中文采用自然的被动归属表达，同时保留“名”和“后裔”两个并列成分。
- source_word: ወልደስ፡ ለዛ፡ ወለት
  choice: 这婢女的儿子
  rationale: 按语境将表示女性仆役的词译为“婢女”，既体现其从属身份，也避免使用现代法律语境色彩较重的“女奴”。
theological_decisions:
- issue: “在以撒里……被称”的理解
  choice: 不直接改写为“从以撒生的才算你的后裔”
  alternative: 只有从以撒生的，才称为你的后裔
  rationale: 原文明确并列“名和后裔”，且动词为“称”；正文保留其较为特殊且可能有意的措辞，不以《创世记》或《罗马书》的常见译法取代。
- issue: 句末未完结构
  choice: 以逗号结束，保留向下文延续的句法
  alternative: 补足关于婢女之子的应许内容
  rationale: 所给原文在“至于这婢女的儿子”处中断；不从后续经文擅自补文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“后裔”延续圣经叙事常用词；“婢女”比“使女”更现代，又比“女奴”少一些现代制度化含义。保留本节末尾未完的承接结构。
