base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/015.yaml
  text: When I called him. And it came to pass in the seventh week, in the first year, in the first month, in this jubilee, on the twelfth of this month, words came in heaven concerning Abraham, that he was faithful in all that he spoke, and he loved the Lord, and in every trial he was faithful.
translation:
  language: zh_hans
  text: 我呼召他的时候。[a]事情是这样发生的：在这个禧年的第七个七年期第一年正月十二日，天上有话论到亚伯拉罕，说他在自己所说的一切事上都忠信，又爱主，并且在每一次考验中都忠信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“当我呼召他时”，并在此处断句；这句话在语法和叙事上可能承接上文。
    reason: 保留吉兹文第一人称和原有断句所造成的突兀感，并提示其上下文关联。
lexical_decisions:
- source_word: ሶበ፡ ጸዋዕክዎ
  choice: 我呼召他的时候
  rationale: ጸዋዕክዎ为第一人称单数“我呼召他”，ሶበ表示“当……时”；保留原文略显突兀的时间从句，不改成第三人称。
- source_word: ሱባዔ፡ ሳብዕ
  choice: 第七个七年期
  rationale: 在《禧年书》的年代体系中，此处“周”指由七年组成的周期；译作“七年期”可让现代读者直接理解。
- source_word: ቃላት፡ በሰማያት
  choice: 天上有话
  rationale: 贴近原文“话语在天上”的表达，同时保持自然中文；不擅自指定说话者。
- source_word: መሃይምን / ምእመነ
  choice: 忠信
  rationale: 原文前后重复同一“忠信/可信”语义，中文也重复，以保留修辞呼应。
- source_word: ምንዳቤ
  choice: 考验
  rationale: 该词在本段语境中指亚伯拉罕所经历的试炼或考验；选“考验”较为中性，不预断其来源或性质。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 采用庄重而通行的对应词，符合此处敬称用法。
theological_decisions:
- issue: 天上之话的发言主体
  choice: 保留为“天上有话”
  alternative: 译作“上帝在天上说”或“天上宣告”
  rationale: 原文只说天上有“话”，没有明确点出发言者；不补入未明说的神学主体。
- issue: 亚伯拉罕忠信的范围
  choice: “在自己所说的一切事上都忠信”
  alternative: “凡上帝对他说的，他都相信”
  rationale: 原文关系从句的主语最自然地指亚伯拉罕所说的话；不把它改释为他对神言语的信心。
- issue: 末句的考验
  choice: “在每一次考验中都忠信”
  alternative: “在一切苦难中仍有信心”
  rationale: 保留“考验”与“忠信”的广义，不将其缩窄为苦难或特定形式的信心。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。年代表达改用“七年期”以清楚呈现《禧年书》的编年单位；保留首句的片段式结构、天上话语主体未明以及“忠信”的重复，避免替原文消除张力。
