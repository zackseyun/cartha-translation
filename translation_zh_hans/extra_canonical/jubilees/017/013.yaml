  text: her child. And she arose and went toward the wilderness of Paran. And the child grew, and he became an archer, and the Lord was with him, and his mother took for him a wife from the daughters of Egypt.
translation:
  language: zh_hans
  text: 她的孩子。她就起来，往巴兰的旷野去。孩子渐渐长大，成了弓箭手；主与他同在。他母亲从埃及女子中给他娶了一个妻子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕፃና
  choice: 她的孩子
  rationale: 该词带第三人称阴性单数所有格，意为“她的孩子”；在本节划分中很可能承接上一节的句法，因此保留为句首残句，不增添原文没有的“长大”。
- source_word: መንገለ በድው ፍራም
  choice: 往巴兰的旷野去
  rationale: መንገለ 表示方向“往、朝向”；በድው 为“旷野”，ፍራም 对应地名巴兰。中文用“往……去”自然表达方向。
- source_word: አሀቀ ሕፃን
  choice: 孩子渐渐长大
  rationale: አሀቀ 表示成长；“渐渐”符合儿童成长的自然汉语表达，但不改变命题内容。
- source_word: ነዳፌ
  choice: 弓箭手
  rationale: 指使用弓箭的人；译作“弓箭手”简明且符合现代汉语。
- source_word: ሀለወ እግዚአብሔር ምስሌሁ
  choice: 主与他同在
  rationale: 按原文常见同在公式直译，保留其神学含义。
- source_word: እምአዋልደ ግብጽ
  choice: 从埃及女子中
  rationale: 字面为“从埃及的女儿们中”；现代汉语以“埃及女子”表达族群归属更自然。
theological_decisions:
- issue: 神名 እግዚአብሔር 的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 原文使用通行的“主”之称，不宜在此具体化为某一神名形式；“主”自然、庄重，也不引入宗派性措辞。
- issue: “主与他同在”的性质
  choice: 保留原文陈述，不加解释
  alternative: 解释为主赐福或保护他
  rationale: “同在”可能蕴含眷顾、帮助或保护，但原文没有明说，故不消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句首“她的孩子。”看似残缺，却反映现有节界可能切断了上一句的情况；为忠于所给吉兹文，不擅自补足句法，也不把它误译为“孩子长大”。
