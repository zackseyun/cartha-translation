  text: And his mother took him and cast him under an olive tree, and she went and sat opposite, at a distance.
translation:
  language: zh_hans
  text: 他母亲抱起他，把他丢在一棵橄榄树下；她走开，在对面相隔一段距离坐下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነሥአቶ፡ እሙ፡
  choice: 他母亲抱起他
  rationale: 动词意为“拿起、带起”；按母亲对孩子的动作，译作“抱起”自然，也保留原文宾语“他”和主语“他母亲”。
- source_word: ወገደፈቶ፡
  choice: 把他丢在
  rationale: 保留“投下、丢下”的较强动作色彩，不弱化为单纯的“放在”。
- source_word: ታኅተ፡ አሐቲ፡ እልያስ፡
  choice: 在一棵橄榄树下
  rationale: “አሐቲ”字面为“一”，在此可自然发挥不定限定作用；汉语“一棵”同时准确表达数量和不定指称。
- source_word: አንጻር፡ መጠነ፡
  choice: 在对面相隔一段距离
  rationale: 分别保留“对面”和“有一定距离”的空间信息，避免把距离具体化。
