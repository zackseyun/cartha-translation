base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/011.yaml
  text: She went a bowshot away, because she said, “Let me not see the death of my child,” and she sat and wept. And an angel of God, one of the holy ones, said to her, “What are you weeping for, Hagar? Rise, take up the child, and hold him with your hand, for God has heard your voice and has seen the child.”
translation:
  language: zh_hans
  text: 她走开一箭之遥[a]，因为她说：“我不愿看见我的孩子死去。”她便坐下哭泣。[b]　上帝的一位天使，就是众圣者中的一位，对她说：“夏甲，你为什么哭？起来，抱起孩子，用手扶住他，因为上帝已经听见你的声音，也已经看见这孩子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“一箭之地”或“一次射箭的距离”。
    reason: 说明原文具体但在现代汉语中略带古雅的距离表达。
  - marker: b
    text: 原文只说“她坐下哭泣”，没有《创世记》21:16平行记载中的“坐在他对面”。
    reason: 防止读者因平行经文而把原文未载的方位细节带入本节。
lexical_decisions:
- source_word: አሐቲ፡ ምንዳፍ
  choice: 一箭之遥
  rationale: 该短语直指“一次射箭的距离／一箭之地”，保留原文具体的距离表达及其与《创世记》21:16的呼应。
- source_word: ሕፃን / ኅፃን
  choice: 孩子
  rationale: 上下文所指为夏甲的儿子；现代汉语“孩子”自然、准确，也保留年龄称谓的一般性。
- source_word: አንዝዮ፡ በእዴኪ
  choice: 用手扶住他
  rationale: 原文含以手支撑、扶持之意；译作“扶住”比单纯“抱着”更能呈现动作，同时避免生硬直译。
- source_word: ቅዱሳን
  choice: 众圣者
  rationale: 保留“圣者们”这一属天群体称谓，不将其解释性改写为某一特定天使等级。
theological_decisions:
- issue: “上帝的一位天使”与“众圣者中的一位”的关系
  choice: 上帝的一位天使，就是众圣者中的一位
  alternative: 上帝的使者——众圣者中的一位
  rationale: 原文既称其为“上帝的天使／使者”，又以同位语说明他是“圣者中的一位”；正文保留这两个称谓，不进一步界定其天使论身份。
- issue: 上帝听见和看见的宾语
  choice: 听见你的声音，也已经看见这孩子
  alternative: 垂听了你的声音，也顾念了这孩子
  rationale: 采用较贴近原文感官动词的表达，保留“听见／看见”的平行结构，避免将“看见”解释为“顾念”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“一箭之遥”保留原文具体距离；“众圣者”保留属天称谓的开放性。所有脚注标记均置于正文相应位置。
