  yaml_path: translation/extra_canonical/jubilees/017/004.yaml
  text: And Sarah saw Ishmael joking and dancing, and Abraham rejoicing with great joy, and she became jealous of Ishmael and said to Abraham, “Cast out this maidservant and her son.”
translation:
  language: zh_hans
  text: 撒拉看见以实玛利嬉笑跳舞，又看见亚伯拉罕满心欢喜，就嫉妒以实玛利，对亚伯拉罕说：“把这个婢女和她儿子赶出去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትዋነይ፡ ወይዘፍን
  choice: 嬉笑跳舞
  rationale: 分别表达嬉戏、说笑与跳舞的动作；用自然简洁的现代汉语保留两个并列动作。
- source_word: ይትፌሣሕ፡ ፍሥሓ፡ ዐቢየ
  choice: 满心欢喜
  rationale: 原文为同根词强化并以“大”修饰，意为极其欢喜；“满心欢喜”自然传达强烈程度。
- source_word: ቀንአት
  choice: 嫉妒
  rationale: 该词在此表示撒拉因以实玛利而生嫉妒；不改写成较弱的“不悦”。
- source_word: ስድድ
  choice: 赶出去
  rationale: 保留命令语气及驱逐之意，符合现代叙事汉语。
- source_word: ዛተ፡ ወሰተ
  choice: 这个婢女
  rationale: 所据文本末词字形疑有讹误；结合句法、文本传统及创世记21:10背景，指具有从属身份的女仆，而非泛指女人。
theological_decisions:
- issue: 撒拉对以实玛利的态度
  choice: 嫉妒以实玛利
  alternative: 因以实玛利而愤怒／不悦
  rationale: 直译表示嫉妒的动词，不以心理推断淡化经文中的张力。
- issue: 被逐女子的身份表述
  choice: 婢女
  alternative: 女人
  rationale: “婢女”保留叙事中的社会身份；同时避免加入原文没有明说的专名“夏甲”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“又看见”明确两个视觉宾语的并列关系；直接引语保持简洁有力。
