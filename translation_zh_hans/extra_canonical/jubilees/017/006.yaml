  text: that he should send them away from him. And the Lord said to Abraham, “Do not let it be grievous in your sight because of the boy and because of the servant woman. Whatever Sarah says to you, listen to her voice and do it.”
translation:
  language: zh_hans
  text: 好叫他把他们从自己身边赶走。[a] 耶和华对亚伯拉罕说：“不要因这孩子和这婢女而忧愁。凡撒拉对你说的，你都要听从她的话，照着去做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头承接上一节，意思是亚伯拉罕想到要把他们赶走而感到忧愁；也有译本作：“他把他们从自己身边赶走了。”
    reason: 说明吉兹语动词的未完成式／虚拟式及传统异译，避免将动作误解为此时已经发生。
lexical_decisions:
- source_word: ይሰድዶሙ፡ እምኀቤሁ
  choice: 好叫他把他们从自己身边赶走
  rationale: 动词为未完成式／虚拟式，承接上一节的思想，而不是叙述已经发生的动作；“赶走”保留该词强于普通“送走”的语气。
- source_word: ሐዘን
  choice: 忧愁
  rationale: 表达亚伯拉罕因孩子和婢女而感到痛苦、难过，现代汉语自然且庄重。
- source_word: ወለት
  choice: 婢女
  rationale: 该词在此指夏甲的从属身份；“婢女”兼顾古代语境和现代可读性，避免将其弱化为一般女仆。
- source_word: ስማዕ፡ ቃለ
  choice: 听从她的话
  rationale: 原文直译近于“听她的声音”，在此是服从其所说之意；译为汉语惯用表达，同时在脚注说明字面形式。
- source_word: ወግበር
  choice: 照着去做
  rationale: 保留“听”之后明确的行动命令，不将两项命令合并弱化。
theological_decisions:
- issue: 开头动词的时态／语气及其与上一节的关系
  choice: 译作“好叫他……赶走”，视为承接上一节的从属内容
  alternative: “他把他们从自己身边赶走了”
  rationale: 吉兹语 ይሰድዶሙ 是未完成式／虚拟式；叙事中上帝此后才向亚伯拉罕说话，因此不宜处理为已经完成的动作。
- issue: “听她的声音”的表达
  choice: 正文采用功能上自然的“听从她的话”
  alternative: 字面译作“听她的声音”
  rationale: 这里的希伯来—闪语式表达表示顺从撒拉所说的；自然翻译不改变命令的神学力度，字面形式则留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“好叫”明确显示句法承接上一节；“这孩子和这婢女”保留原文对二人的指称方式；神名按中文圣经通行传统译为“耶和华”。
