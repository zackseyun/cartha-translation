  text: I will make him into a great nation, because he is from your seed. And Abraham rose early in the morning,
translation:
  language: zh_hans
  text: 我要使他成为大国，因为他是你的后裔。亚伯拉罕清早起来，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ዐቢይ፡ ሕዝብ፡ እሬስዮ
  choice: 我要使他成为大国
  rationale: እሬስዮ为未完成体第一人称单数并带第三人称宾语，依语境表达将来；ውስተ与“使、成为”结构连用，ዐቢይ修饰ሕዝብ，因此译为“使他成为大国”，而不是“在大民中使他为大”。
- source_word: እስመ፡ እምዘርእከ፡ ውእቱ
  choice: 因为他是你的后裔
  rationale: እስመ表示原因；እምዘርእከ直译为“出于你的种子”，现代汉语以“你的后裔”自然传达血缘含义。
- source_word: ወነገሀ፡ አብርሃም፡ በነግህ
  choice: 亚伯拉罕清早起来
  rationale: 该表达指亚伯拉罕清晨早起；保留句末逗号，以反映本节原文尚未完句并承接下文。
theological_decisions:
- issue: “大国”与“大民”的选择
  choice: 大国
  alternative: 大民／众多的人民
  rationale: ሕዝብ可指人民或民族、国族；在“使他成为……”的应许语境中，“大国”最自然，也与相关族长叙事的惯用表达相符，同时不额外引入政治国家的细节。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“后裔”比直译“种子”更符合普通话血缘语境；末尾保留逗号，显示句子延续至下一节。
