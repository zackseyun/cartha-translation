  text: And Judah said to Onan, his brother,, “Go in to your brother’s wife, and perform a brother-in-law’s duty to her, and raise up offspring for your brother.”
translation:
  language: zh_hans
  text: 犹大对珥的弟弟俄南说[a]：“你要与你哥哥的妻子同房，向她尽兄弟的本分，为你哥哥兴起后代[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大对俄南、他的弟弟说”；按上下文，“他的”指珥。
    reason: 说明原文代词的形式，并避免把俄南误解为犹大的弟弟。
  - marker: b
    text: 原文末句只说“兴起”；“后代”是按上下文补出的隐含宾语。
    reason: 标明为使中文句意完整而补出的隐含宾语，并保留原文简略表达。
lexical_decisions:
- source_word: ባእ፡ ኀበ፡ ብእሲተ፡ እኁከ
  choice: 与你哥哥的妻子同房
  rationale: 原文直译为“进去，到你哥哥的妻子那里”，在本语境中是表示性关系的委婉说法；译作“同房”既传达实际含义，也保持庄重。
- source_word: ወረከያ፡ ናዕልተ
  choice: 向她尽为弟的本分
  rationale: 该短语指亡兄之弟对寡嫂所负的婚姻和生育责任；用通俗而庄重的表达，避免引入特定宗派术语。
- source_word: ወአንሥእ
  choice: 立后
  rationale: 动词意为“兴起、使起来”；这里按语境指为亡兄兴起后代。“立后”简洁自然，并保留后代归于亡兄名下的含义。
theological_decisions:
- issue: “他的弟弟”所指的人
  choice: 珥的弟弟俄南
  alternative: 犹大的弟弟俄南
  rationale: 原文代词在形式上可能引起歧义，但紧接着的“你哥哥的妻子”和叙事上下文表明，俄南是死者珥的弟弟，而不是犹大的弟弟。正文予以明确，脚注保留原文形式。
- issue: 末句省略的宾语
  choice: 为你哥哥立后
  alternative: 为你哥哥兴起后代
  rationale: 原文只保留“兴起”这一动词，宾语须由上下文补出；“立后”自然表达为亡兄延续后嗣的含义，同时不额外规定后代的神学或法律身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同房”准确传达原文委婉语的语境含义；“尽为弟的本分”和“立后”避免生硬的法律术语，同时保留兄终弟及责任与为亡兄延续后嗣的核心意思。
