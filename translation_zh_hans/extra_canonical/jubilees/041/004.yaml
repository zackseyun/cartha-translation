  to: 犹大对珥的弟弟俄南说[a]：“你要与你哥哥的妻子同房，向她尽兄弟的本分，为你哥哥兴起后代[b]。”
  rationale: 修订仅改善汉语搭配并消除“立后”的现代语义歧义。人际关系、同房的委婉表达、对寡嫂所尽的责任，以及为亡兄兴起后代的含义均予保留；脚注锚点和数量不变。
