  - severity: medium
    issue: “立后”可能产生不必要的歧义。
    rationale: “立后”常被理解为确立继承人或册立君位继承者，未必明确指生育后代；“为你哥哥兴起后代”既符合上下文，也更贴近原文“兴起”的表达。
