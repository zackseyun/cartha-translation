lexical_decisions:
- source_word: አባግዒሁ፡ በቴምናታ
  choice: 他的羊群在亭拿
  rationale: 按所给吉兹语保留残句性质；“他的”承接上文，“亭拿”为地名的常用音译。
- source_word: አንበረች፡ አልባሰ፡ ምዕስብናሃ
  choice: 她脱下守寡的衣服
  rationale: 该短语指她除去寡居身份所穿的衣服；中文用“脱下”自然表达放下、除去衣物的动作。
- source_word: ለብሰት፡ ገልባቤ
  choice: 蒙上面纱
  rationale: 字面涉及穿戴遮盖物；结合叙事情境译作“蒙上面纱”，简明而不增添地点或动作。
- source_word: ተሣየየት
  choice: 装扮自己
  rationale: 反身动词表示修饰、装扮自己；保留与前述换装并列的独立动作。
