  text: And he thought her to be a prostitute and said to her, “Let me come in to you,” and she said to him, “Come,” and he went in. And she said to him,
translation:
  language: zh_hans
  text: 他以为她是妓女，就对她说：“让我进到你那里去。”她对他说：“来吧。”他便进到她那里。她又对他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐዘባ
  choice: 以为
  rationale: 该动词在此表示“认为、以为”，且上下文所述是犹大的错误判断；不用“认出”，以免暗示他正确识别了她的真实身份。
- source_word: ዘማዊት
  choice: 妓女
  rationale: 指从事卖淫的女子；现代汉语中“妓女”直接、清楚，也符合叙事语境。
- source_word: እባእ፡ ኀቤኪ
  choice: 让我到你那里去
  rationale: 保留第一人称意愿式的“让我去”以及朝向第二人称阴性的“到你那里”，不误译成命令对方“到我这里来”。
- source_word: ባእ
  choice: 来吧
  rationale: 这是对男性单数所说的“来/进去”；结合前句，以自然汉语译为准许性的“来吧”。
- source_word: ወቦአ
  choice: 他便进到她那里
  rationale: “进入”在此带有性关系的委婉含义；沿用圣经叙事中自然且不过度明说的表达。
theological_decisions:
- issue: 是否把性行为的委婉语明确化
  choice: 保留“进到她那里”的委婉表达
  alternative: 译作“与她同房”或“和她发生关系”
  rationale: 原文使用“进入”的叙事措辞；直陈性行为会消除原文的委婉性，而本节结尾仍引向她接下来的话。
- issue: 犹大对女子身份的判断性质
  choice: 译作“以为她是妓女”
  alternative: 译作“认出她是妓女”
  rationale: 原词表达认定或猜想，且叙事中这一判断并不符合她的真实身份；“以为”保留错误判断这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。引语关系清楚；保留原文末尾“她又对他说：”的未完结构，使其自然衔接下一节。
