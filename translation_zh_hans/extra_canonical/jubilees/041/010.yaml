  text: And she sat at the entrance that is on the road to Timnah. And as Judah was going, he found her.
translation:
  language: zh_hans
  text: 她坐[a]在通往亭拿路上的入口处。犹大正走着的时候，发现了她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“停留”。
    reason: 原词既可表示坐下，也可表示停留或居住。
  - marker: b
    text: 或译：“遇见了她”。
    reason: 原词可指找到、发现；也可按偶然相逢的语境理解为遇见。
lexical_decisions:
- source_word: ወነበረት
  choice: 她坐
  rationale: 该动词可表示“居留、停留、坐下”；在此叙事场景中指她在路口就位，译作“坐”最自然，也与上下文相符，同时以脚注保留“停留”的可能。
- source_word: ውስተ አንቀጽ
  choice: 在……路口
  rationale: አንቀጽ 基本义为“入口、门口”；结合后面的道路说明，现代汉语用“路口”简洁自然地表达其地点功能。
- source_word: ፍኖተ ቴምናታ
  choice: 通往亭拿的路
  rationale: 按属格结构直译为指向亭拿的道路；“亭拿”采用该地名常见的现代中文音译。
- source_word: ረከባ
  choice: 发现了她
  rationale: 该动词主要可表示“找到、发现、遇到”；此处“发现了她”保留非相互性的语感，脚注列出自然的另一译法“遇见了她”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“犹大走过时”表达行路过程中发生的动作，不补入原文没有说明的动机或身份判断。
