  yaml_path: translation/extra_canonical/jubilees/041/002.yaml
  text: For Er his firstborn he took a wife from the daughters of Aram, and her name was Tamar. But he rejected her and did not lie with her, because his mother was from the daughters of Canaan, and he wanted to take for himself a wife from the kin of his mother.
translation:
  language: zh_hans
  text: 他为长子珥娶了一个亚兰女子为妻，她名叫她玛。珥却厌恶她，不与她同房，因为他的母亲是迦南女子；他想从母亲的宗族中为自己娶妻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋልደ፡ አራም
  choice: 亚兰女子
  rationale: 字面为“亚兰的女儿们”中的一人；现代汉语用“亚兰女子”自然表达其族属。
- source_word: ጸልአ
  choice: 厌恶
  rationale: 该动词表达憎恶、嫌恶；较“拒绝”更贴近原词的强烈负面态度，同时不额外说明原因。
- source_word: ኢሰከበ፡ ምስሌሃ
  choice: 不与她同房
  rationale: 字面为“不与她躺卧”，语境指夫妻性关系；“同房”在现代中文中清楚而庄重。
- source_word: ነገደ፡ እሙ
  choice: 母亲的宗族
  rationale: ነገድ可指支派、族类或亲族；此处用“宗族”保留群体亲缘含义，避免缩窄为直系亲属。
theological_decisions:
- issue: 珥不与她同房的动机归属
  choice: 按原文直陈：因母亲是迦南女子，他想从母亲的宗族娶妻
  alternative: 将其解释为珥出于族群偏见或反抗父命
  rationale: 原文只给出家族与择偶动机，没有进一步作道德或神学解释，因此保留叙事本身的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他”为开头主语，依上下文指犹大；不增补名字，以贴近原文。人名“珥”“她玛”及地名“亚兰”“迦南”采用通行圣经译名。
