  yaml_path: translation/extra_canonical/jubilees/041/008.yaml
  text: And in the fifth year of this week, Shua, the wife of Judah, died. And in the sixth year Judah went up to shear his sheep at Timnah, and they told Tamar, saying, “Behold, your father-in-law is going up to Timnah to shear.”
translation:
  language: zh_hans
  text: 本七年周期的第五年，书亚——犹大的妻子——死了。[a] 第六年，犹大上到亭拿去给他的羊剪毛；有人告诉他玛说：“看哪，你公公正要上亭拿去剪毛。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹文本片段在“本七年周期的第五年”前后只保留“书亚，犹大的妻子”等语词，未见“死了”这一谓语；正文根据该节完整传本的译读补足。
    reason: 说明所给源文本片段的断裂/省略现象，以及正文保留死亡事件的依据。
  - marker: b
    text: 原文末句仅说“去剪”，没有再次明说“羊”或“羊毛”；中文的“剪毛”承接前句，补足语境中已明确的对象。
    reason: 保留原文末句未重复宾语的简省表达。
lexical_decisions:
- source_word: ዘዝሱባዔ
  choice: 这一七年周期的
  rationale: ዝ指“这”，ሱባዔ在《禧年书》的纪年语境中指由七年组成的周期；如此既避免误译为“第七个周期”，也让现代读者明白计时单位。
- source_word: ዐርገ
  choice: 上……去／正上……去
  rationale: 保留原文“上去”的方向性表达，也符合前往亭拿的传统叙事措辞。
- source_word: ይቅርጽ አባግዒሁ
  choice: 剪羊毛
  rationale: 该短语直指给他的羊剪毛；汉语以“剪羊毛”表达最自然。
- source_word: ሐሙኪ
  choice: 你公公
  rationale: 原词表示女子的夫父；现代汉语中“公公”准确而自然。
- source_word: ቴምናታ
  choice: 亭拿
  rationale: 采用该圣经地名在现代简体中文读者中较熟悉的传统译名。
theological_decisions:
- issue: 首句所述事件的谓语
  choice: 译作“死了”，并加注说明所给吉兹文本片段的情况
  alternative: 按现存片段直译成无谓语的“犹大的妻子书亚，在这一七年周期的第五年”
  rationale: 所给片段本身呈现名词性残句，无法独立成句；上下文及经校订的英译传统表明这里记述书亚去世。正文补足事件，同时以脚注公开文本现象，不把重构伪装成毫无疑问的明文。
- issue: 末句是否重复“他的羊”
  choice: 正文译作“去剪羊毛”，脚注交代原文末处仅作“去剪”
  alternative: 只译“去剪”
  rationale: 吉兹文末句省去“他的羊”，但承接前句时宾语明确；汉语“去剪”过于突兀，补出“羊毛”可读性更好，同时脚注保留原文的简省。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“七年周期”清楚表达《禧年书》的纪年单位；人名、地名使用简体中文圣经语境中易辨认的形式。
