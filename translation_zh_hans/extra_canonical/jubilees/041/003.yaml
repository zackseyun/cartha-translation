  text: And Judah his father forbade him. And Er, Judah’s firstborn, was evil, and the LORD put him to death.
translation:
  language: zh_hans
  text: 他的父亲犹大阻止了他。犹大的长子珥作恶，耶和华杀了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕበሶ (ʾaḥbasa-hu)
  choice: 阻止了他
  rationale: 该使役式动词在这里表示阻拦、制止或禁止；结合上下文，译为“阻止”比“责备”更符合词义，同时不擅自补明被阻止的具体行为。
- source_word: እኩይ (ʾəkuy)
  choice: 作恶
  rationale: 原文可描述人为恶或邪恶；汉语叙事中“作恶”自然、庄重，也保留道德判断。
- source_word: ቀተሎ (qatala-hu)
  choice: 使他死了
  rationale: 直译为“杀了他”亦可；在上帝施行审判的语境中，“使他死了”准确表达致死含义，并符合现代汉语圣经叙事语体。
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: 耶和华
  rationale: 采用简体中文圣经传统中对神圣名号的通行译法。
theological_decisions:
- issue: 珥之恶的具体性质
  choice: 仅译“作恶”，不解释其具体罪行
  alternative: 根据上下文补出某种具体恶行
  rationale: 本节原文没有说明其恶的具体内容，补充解释会消除文本保留的空白。
- issue: 上帝致珥死亡的表述
  choice: “耶和华就使他死了”
  alternative: “耶和华杀了他”
  rationale: 两者都可反映原文的致死动作；所选表达在中文中较自然，并仍明确将珥的死亡归于耶和华的行动，没有淡化神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留首句代词“他”的原文指向，不根据上下文擅自补出所阻止的行为；以“阻止”准确区别于较早误译的“责备”。
