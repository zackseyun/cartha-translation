  yaml_path: translation/extra_canonical/jubilees/041/028.yaml
  text: For he went in the innocence of his eyes and sought judgment, because by the judgment of Abraham, which he commanded his sons, Judah desired that she be burned with fire.
translation:
  language: zh_hans
  text: 因为他本着自己眼中的纯真[a]行事，并寻求裁断；犹大要照着亚伯拉罕所作、并吩咐儿子们遵守的裁断[b]，将她用火烧死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯真”也可译作“质朴”或“正直”。原文保留“眼中”的意象。
    reason: lexical_ambiguity
  - marker: b
    text: 原文介词直译为“从”；在此法律语境中表示行动所依据的裁断，故译作“照着”。
    reason: source_ambiguity
lexical_decisions:
- source_word: በየውሀተ፡ አዕይንቲሁ
  choice: 怀着眼中的纯正
  rationale: የውሀት 表示纯真、质朴或正直；保留“眼中/眼目”的原文意象，同时避免误译为“眼目的欲望”。
- source_word: ኀሠሠ፡ ኵነኔ
  choice: 寻求裁断
  rationale: 保留法律语境；“裁断”既可指判决，也可指司法判断，不把含义缩窄为报复或定罪。
- source_word: እምፍተሐ፡ አብርሃም
  choice: 照着亚伯拉罕……的判例
  rationale: 介词 እም 字面可作“从”，但此处表达犹大行动所依据的法律权威；“照着”符合汉语法律语境。
- source_word: ይውዐይ፡ በእሳት
  choice: 要把她用火烧死
  rationale: 表达犹大的意愿以及火刑结果；不额外说明执行与否。
theological_decisions:
- issue: 经文对犹大行动动机的评价
  choice: 译作“怀着眼中的纯正”，呈现原文对其主观无辜或正直的描述
  alternative: “随着眼目的欲望”
  rationale: የውሀት 的词义是纯真、质朴或正直，而非欲望；因此不采用会逆转叙事评价的旧译。
- issue: 亚伯拉罕之“裁断”的性质
  choice: 译作“判例”，并表明众子受命遵守
  alternative: “审判”或“律法”
  rationale: “判例”能体现行动依据，又不把该词过度制度化为完整成文律法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“眼中的纯正”略带源语色彩，以保留原文意象；“判例”突出法律背景，但避免引入特定宗派术语。
