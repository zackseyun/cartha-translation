    issue: “眼中的纯正”搭配生硬
    rationale: 该译法虽逐字保留意象，却不符合自然现代汉语表达；改为“本着自己眼中的纯真”可保留歧义及意象。
  - severity: medium
    issue: “判例”过度具体化“裁断／判断”
    rationale: 原文及英文审校轨迹使用 judgment；“判例”暗示先例法性质，超出文本可确定的信息。
  - severity: low
    issue: “吩咐众子遵守”补入了“遵守”
    rationale: 原文仅称亚伯拉罕向儿子们下令；以“所作、并吩咐儿子们遵守的裁断”虽仍属自然表达，但应避免把“判例”作为固定制度术语。
  revised_text: 因为他本着自己眼中的纯真[a]行事，并寻求裁断；犹大要照着亚伯拉罕所作、并吩咐儿子们遵守的裁断[b]，将她用火烧死。
