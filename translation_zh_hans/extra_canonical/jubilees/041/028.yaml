  to: 因为他本着自己眼中的纯真[a]行事，并寻求裁断；犹大要照着亚伯拉罕所作、并吩咐儿子们遵守的裁断[b]，将她用火烧死。
  rationale: 修订仅改善汉语搭配，并将“判例”改为较中性的“裁断”，以免把原文的 judgment／法律判断制度化为特定法学概念。保留“因为”、犹大的意愿、亚伯拉罕向儿子们所下的命令，以及火刑的严厉表述。
