review_pass:
  verdict: revise
  source_fidelity: 正文总体忠实地保留了开头的手段关系、第一人称复数叙述声音、两子未与她同寝，以及后裔未被拔除的意象。惟“为另一个支派存续”在汉语中容易理解为后裔为某支派的利益而延续，且把“立定/确立”弱化为单纯“存续”；应更直接反映后裔被立定与“另一个支派”之间简略而未完全限定的关系。
  naturalness: “借着这事”“烈怒和惩罚”“与她同寝”“连根拔除”均庄重自然。“我们也对犹大说”中的“也”在此略显无所承接；“我们对犹大说”更顺畅。后半句改为“他的后裔得以立定为另一个支派”较凝练自然，同时不引入“归入”或“在……中”等原文未明示的关系。
  terminology: “烈怒”“惩罚”“后裔”“支派”及“连根拔除”用语一致且合乎经文书面语体。“同寝”恰当地以庄重措辞表达原文。第一人称复数应保留，不宜以“有人说”或无主被动取代；因此原脚注所提示的替代译法不宜保留。
  issues:
  - severity: medium
    issue: “为另一个支派存续”弱化并偏移后半句关系
    rationale: 原文先说“后裔得以立定/确立”，再以简略的介词关系连接“另一个支派”。现译的“存续”未充分表达“立定”，而“为……存续”易被读成目的或受益关系。改作“得以立定为另一个支派”在现代汉语中更清楚，也避免擅自译成“在另一个支派中”或“归入另一个支派”。
  - severity: low
    issue: “也”在“我们也对犹大说”中不够自然
    rationale: 此处连词主要承接前句，汉语无需在“我们”后另加“也”。删去后更自然，意义不变。
  - severity: low
    issue: 脚注以“也有人对犹大说”作为替代译法，削弱明确的第一人称复数
    rationale: 本段叙述框架及英文学术审校轨迹均支持保留“我们说”。在没有必要呈现文本变体或真实语法歧义的情况下，该脚注会误导读者，宜删除。
