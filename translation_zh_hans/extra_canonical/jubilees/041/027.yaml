  yaml_path: translation/extra_canonical/jubilees/041/027.yaml
  text: And by this he will turn away wrath and punishment from Israel. And to Judah we said that his two sons had not lain with her, and because of this his seed was established for another tribe and was not uprooted.
translation:
  language: zh_hans
  text: 借着这事，他必使烈怒和惩罚离开以色列。我们对犹大说，他的两个儿子都没有与她同寝；正因如此，他的后裔得以立定为另一个支派，没有被连根拔除。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበእሊአሁ
  choice: 借着这事
  rationale: 该短语字面带有“借着这些”的意味；结合上下文，以中文单数概括前述事件最自然，同时保留手段或缘由关系。
- source_word: ያነድግ
  choice: 使……离开
  rationale: 表达转移、除去之意；与“烈怒和惩罚”搭配，译为“使……离开”既贴近原文，也符合现代汉语。
- source_word: መዐተ፡ መመቅሠፍተ
  choice: 烈怒和惩罚
  rationale: 分别保留忿怒与刑罚的双重概念，不将二者合并。
- source_word: ኢበከቡ፡ ምስሌነ
  choice: 没有与她同寝
  rationale: 以庄重、清楚而不过度直露的现代汉语表达性关系；否定形式照原文保留。
- source_word: ቆመ፡ ዘርአ
  choice: 他的后裔才得以……存续
  rationale: 原文以“种、后裔站立”表示家系得以确立并延续；中文采用自然表达，同时保留后裔存立的含义。
- source_word: ወኢይሤረወ
  choice: 没有被连根拔除
  rationale: 保留原文“拔根、根除”的形象，而非仅泛译为“没有灭亡”。
theological_decisions:
- issue: 叙述者采用第一人称复数
  choice: 我们也对犹大说
  alternative: 也有人对犹大说／也有话对犹大说
  rationale: 第一人称复数符合《禧年书》中天使向摩西讲述时常见的叙事声音；正文不改为无主被动，以免遮蔽这一框架，同时用脚注提示可能的非人称理解。
- issue: “为另一个支派”与犹大后裔的关系
  choice: 他的后裔才得以为另一个支派存续
  alternative: 他的后裔在另一个支派中得以存续
  rationale: 原文关系简略，可能指后裔被确立为另一支派，也可能指为另一支派而延续；正文保留“为”的关系，不擅自明确为“在……中”。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“同寝”避免粗俗，“连根拔除”保留原文意象；分号呈现后半句的因果推进。
