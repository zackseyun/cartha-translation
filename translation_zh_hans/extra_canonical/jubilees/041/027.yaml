revisions:
- from: 借着这事，他必使烈怒和惩罚离开以色列。我们也对犹大说[a]，他的两个儿子都没有与她同寝；正因如此，他的后裔才得以为另一个支派存续，没有被连根拔除。
  to: 借着这事，他必使烈怒和惩罚离开以色列。我们对犹大说，他的两个儿子都没有与她同寝；正因如此，他的后裔得以立定为另一个支派，没有被连根拔除。
  rationale: 修订仅处理后半句“后裔—另一个支派”的表达，使“立定”得到保留，并以“立定为”自然呈现原文简略关系，避免将其解释为后裔在某支派之内延续。删除无必要且可能遮蔽第一人称复数叙述声音的脚注；其余译文维持原有的忠实性、庄重语体和性关系的委婉表达。
