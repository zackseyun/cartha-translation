    reason: 说明源文片段在连接词处截断，并保留该词的时间／伴随语义，不将其限定为“等候”。
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 在这一残缺句首承接上文，按圣经叙事中该神名的通常中文译法处理。
- source_word: ወቀተሎ
  choice: 耶和华便使他死了
  rationale: 动词表达使某人死亡；补出主语以使残句在中文中可读，同时不补入源文未提供的前文内容。
- source_word: መርዓቱ
  choice: 儿媳
  rationale: 此处指犹大的儿媳他玛，现代汉语用“儿媳”自然准确。
- source_word: ንበሪ፡ ቤተ፡ አቡኪ
  choice: 你住在你父亲家里
  rationale: 保留女性单数命令语气及“父亲家里”的地点表达。
- source_word: እንዘ
  choice: 等候着……
  rationale: 该词引出同时或持续情状，但所给源文在此截断；用省略号保留未完句，不擅自补译后文。
theological_decisions:
- issue: 神名的译法
  choice: 耶和华
  alternative: 主
  rationale: እግዚአብሔር在此对应叙事中的上主称谓；采用中文圣经传统中明确的专名译法，并保持与英语审校层“the LORD”的对应。
- issue: 神使人死亡的因果表达
  choice: 耶和华便使他死了
  alternative: 他就死了
  rationale: 源文动词具有及物/使役意义；保留神作为施事者所形成的神学张力，不弱化为自然死亡。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你住在”比“你居留”更适合普通读者；以省略号忠实呈现源文片段的未完状态。
