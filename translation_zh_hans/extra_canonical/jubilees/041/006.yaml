  text: the LORD, and he put him to death. And Judah said to Tamar his daughter-in-law, “Remain in your father’s house while...”
translation:
  language: zh_hans
  text: 耶和华，便杀了他。犹大对儿媳他玛说：“你住在你父亲家中，在……期间……”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
