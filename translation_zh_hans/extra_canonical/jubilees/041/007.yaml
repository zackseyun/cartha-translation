base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041/007.yaml
  text: Remain a widow until my son Shelah grows up, and I will give you to him as a wife. And he grew up, but Bedsu’el, Judah’s wife, did not let Shelah her son to marry, and Bed[su'el] died.
translation:
  language: zh_hans
  text: “你要守寡，直到我儿子示拉长大；那时我必把你给他作妻子。”后来示拉长大了，可是犹大的妻子贝德苏埃尔不让她儿子示拉娶妻；后来贝德[苏埃尔]死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末尾的人名只存“贝德”；方括号内的“苏埃尔”依据本节前文同一人名补足。
    reason: 说明底本文本截断及编辑性补全。
lexical_decisions:
- source_word: ትመዐስቢ
  choice: 你要守寡
  rationale: 该词在本叙事语境中特指继续保持寡居状态，不宜弱化为一般的“等候”。
- source_word: ይልህቅ / ወልህቀ
  choice: 长大 / 后来……长大了
  rationale: 前者表达预期的长成，后者明确叙述示拉后来已经长大，须完整保留重复及叙事推进。
- source_word: ወእሁበኪ፡ ሎቱ፡ ብእሲተ
  choice: 我必把你给他作妻子
  rationale: 按与格代词和“妻子”表达直译，清楚呈现许配关系。
- source_word: ወኢኀደገት
  choice: 可是不让
  rationale: 在前述示拉已经长大的背景下，此处连词具有语义转折；动词表示不准许或阻止。
- source_word: ከመ፡ ያውስብ
  choice: 娶妻
  rationale: 该动词在这里指男子结婚、娶妻；原文未明确写出宾语为她玛，因此不擅自补入。
- source_word: ቤድ
  choice: 贝德[苏埃尔]
  rationale: 现存文本在名字中途截断；方括号透明标示依据上文同名所作的补全。
theological_decisions:
- issue: 示拉所娶对象是否明确为她玛
  choice: 保留为不带明示宾语的“娶妻”
  alternative: 译作“娶她玛”或“娶她为妻”
  rationale: 原文此处仅表达贝德苏埃尔不让示拉结婚，并未明示宾语；不根据上下文消除这一文本层面的含混。
- issue: 父亲把女子给儿子为妻的表述
  choice: 按古代婚姻安排直译为“把你给他作妻子”
  alternative: 现代化为“让你嫁给他”
  rationale: 直译保存原文的社会法律表达及叙事张力，但不额外赋予教派性解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“守寡”保留法律与叙事分量；“后来……可是不让”自然呈现示拉已长大却仍受阻的转折。专名 Shelah 译作通行圣经人名“示拉”，Bedsu’el 音译为“贝德苏埃尔”。
