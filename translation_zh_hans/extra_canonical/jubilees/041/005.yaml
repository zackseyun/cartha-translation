  rationale: 采用该人物在现代中文圣经传统中通行的音译。
- source_word: ቦአ፡ ቤተ፡ ብእሲተ፡ እኁሁ
  choice: 与哥哥的妻子同房
  rationale: 这是闪语背景下表示发生性关系的委婉说法；译为现代汉语中庄重而清楚的表达。
- source_word: ወከዐወ፡ ዘርአ፡ ውስተ፡ ምድር
  choice: 把精液遗在地上
  rationale: 贴近原文动作和对象，不增添动机或生理细节。
- source_word: ወእኩየ፡ ኮነ፡ በቅድመ፡ አዕይንተ
  choice: 这事在……眼中是恶的
  rationale: 所给吉兹语文本止于“眼中”，未保留评价者，故不擅自补出“主”或其他对象。
