  choice: 只陈述行为“是恶的”，不解释恶在何处
  alternative: 明确解释为拒绝为兄长立后、避孕或某种性行为本身有罪
  rationale: 本节片段没有明说判定的具体依据；为避免导入宗派性伦理结论，保留原文的张力。
- issue: 残句中“在谁眼中”
