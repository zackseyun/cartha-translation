lexical_decisions:
- source_word: ዘርአ
  choice: 后裔／精液
  rationale: 同一词在本节中先指为兄长所生的后代，后指遗在地上的精液；按语境分别译出，以保留原文的词义关联，又使现代汉语清楚自然。
- source_word: አውናን
