lexical_decisions:
- source_word: ኢዮቤልው
  choice: 禧年
  rationale: 保留《禧年书》特有的年代计算单位；此处指第四十五个禧年周期。
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词表示由七年组成的周期；译作“七年期”比单独译作“周”更能避免被误解为七日的一周。
- source_word: ነሥአ
  choice: 娶了妻
  rationale: 字面义为“取、拿、接受”。结合犹大及后续婚姻叙事，汉语以“娶了妻”自然表达其语境义；宾语可能落在下一节或因分节而省略。
