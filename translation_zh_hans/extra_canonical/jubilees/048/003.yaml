  yaml_path: translation/extra_canonical/jubilees/048/003.yaml
  text: On the way[3], at the lodging-place, he met you. Did he not desire with all his power to kill you and to save the Egyptians from your hand, when he saw that you had been sent to do this and to execute judgment upon Egypt?
translation:
  language: zh_hans
  text: 在路上、在住宿的地方，他遇见了你[a]。他看见你奉差遣来做这事，并惩罚埃及，岂不是竭尽全力想要杀死你，把埃及人从你手中救出来吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遇见了你”在这里可能含有敌对遭遇的意味；可比较《出埃及记》中旅途上发生的致命冲突。
    reason: lexical_alternative
lexical_decisions:
- source_word: በፍኖተ
  choice: 在路上
  rationale: 按其通常方位义直译，保留事件发生于行程中的背景。
- source_word: ትትቄበሎ
  choice: 他迎面遇上你
  rationale: 该动词核心义为“相遇、遭遇”；结合上下文可带敌对色彩，但正文不扩译为原词本身没有的“控告”。
- source_word: በምጽላል
  choice: 到了住宿的地方
  rationale: 指旅途中的歇宿处；用现代汉语自然表达地点关系。
- source_word: አኮሁ
  choice: 不是曾……吗
  rationale: 保留原文反问结构，而不改写成平直陈述。
- source_word: በኵሉ፡ ኃይሉ
  choice: 竭尽全力
  rationale: 自然传达“以他全部的力量”，不削弱其强度。
- source_word: ያድኅኖሙ
  choice: 使……脱离
  rationale: 在“埃及人”和“你的手”这一结构中表达拯救、解救之义。
- source_word: በቀለ
  choice: 惩罚
  rationale: 该词可指报复、施行惩治；此处采用不预设私人复仇动机且符合对埃及施行刑罚语境的表达。
theological_decisions:
- issue: 敌对相遇者的身份
  choice: 保留“他”
  alternative: 明说“玛斯提玛”或“上帝”
  rationale: 本节原文使用第三人称代词；不在译文中补入本节未明说的身份，以保留篇章指代及相关张力。
- issue: 对埃及行动的性质
  choice: 惩罚埃及
  alternative: 向埃及报仇／审判埃及
  rationale: 原词包含报复或惩治色彩；“惩罚”在现代汉语中自然，也避免把某一特定神学术语强加于原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文反问句及第三人称代词，不把“相遇”擅自解释为“控告”；脚注说明该遭遇在语境中可能具有敌意。
