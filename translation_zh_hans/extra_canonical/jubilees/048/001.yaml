base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/001.yaml
  text: And in the sixth year of the third week of the forty-ninth jubilee[1], you departed and lived in the land of Midian for five weeks of years and one year, and you returned to Egypt in the second week, in the second year, in the fiftieth jubilee.
translation:
  language: zh_hans
  text: 第四十九个禧年的第三个七年期第六年，你离去，在米甸地住了五个七年期又一年；后来，你在第五十个禧年的第二个七年期第二年回到埃及。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文的纪年表达十分紧凑，理解上也略有困难。“五个七年期又一年”按原文保留，以呈现《禧年书》的历法体系。
    reason: segmentation_note
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年期
  rationale: 该词在本书历法语境中指由七年组成的周期；译作“七年期”既清楚又保留其历法结构。
- source_word: ኢዮቤልውሳት / ኢዮቤልው
  choice: 禧年
  rationale: 采用现代中文圣经传统中对 jubilee 的通行译名，并保留《禧年书》的纪年体系。
- source_word: ሖርከ
  choice: 你离开那里
  rationale: 基本义为“你去、你离去”；结合摩西离开埃及前往米甸的叙事语境，译为“离开那里”较自然，同时不把目的地重复加入动词。
- source_word: ነበርከ
  choice: 住在
  rationale: 对应“居住、停留”，在米甸长期生活的语境中译为“住在”。
- source_word: ገባእከ
  choice: 你回到
  rationale: 该动词在此具有“返回”之义，且摩西此前从埃及出走，故“回到埃及”比单纯“进入埃及”更准确。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“七年期”明确表达七年为一周期，避免“周”可能被误解为七日；日期公式按中文习惯调整语序，但保留原有层级与历法张力。
