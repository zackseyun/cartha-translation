base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/010.yaml
  text: And all the people whom he brought out pursued after them[10], after Israel, and Yahweh our God cast them into the midst of the sea, into its depths, beneath the sons of Israel, just as the people of Egypt had cast their sons into the river. A thousand thousand and ten thousand mighty men were destroyed because of one nursing infant of the children of your people whom they had thrown into the river.
translation:
  language: zh_hans
  text: 他所领出来的众民都追赶他们[a]，追赶以色列；雅威我们的上帝把他们抛进海中，投入海的深处，使他们沉在以色列子孙之下，正如埃及人曾把他们的儿子丢进河里一样。一百万和一万名勇士，竟因你百姓的儿女中一个被他们丢进河里的、仍在吃奶的婴孩而灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存原文的行号从第9节跳到第14节；此处按本章内容顺序编为第10节，未删去现存内容。
    reason: segmentation_note
lexical_decisions:
- source_word: እግዚአብሔር፡ አምላክ
  choice: 雅威我们的上帝
  rationale: 结合句中第一人称复数所属关系表达为“雅威我们的上帝”；“雅威”直接标示神名，避免仅用称号取代。
- source_word: ማእከለ፡ ባሕር፡ ውስተ፡ መዓምቅቲሃ
  choice: 海中，投入海的深处
  rationale: 保留“海的中央／海中”与“其深处”的递进意象，同时采用自然的现代汉语。
- source_word: ምእተ፡ አልፈ ... ወዐሠርተ፡ ምእተ
  choice: 一百万零一万
  rationale: 按本行所传数字及审校层的理解，将“一千个一千”和“一万个”合并为现代汉语易懂的数值表达。
- source_word: ሕሱዳ
  choice: 吃奶婴孩
  rationale: 表达尚在哺乳期的婴孩；不额外指定性别，以免超出该词本身的信息。
theological_decisions:
- issue: 埃及军队灭亡与婴孩被投入河中的因果／报应关系
  choice: 竟因……而灭亡
  alternative: 为……报仇而灭亡／作为惩罚而灭亡
  rationale: 原文表达“因为／由于”的关联，但没有明说“报仇”或系统化惩罚机制，因此保留因果张力而不作神学扩写。
- issue: “他们的儿子”的指代
  choice: 保留“他们的儿子”
  alternative: 明确译为“以色列人的儿子”
  rationale: 原文代词在句法上保留一定指代空间；上下文自然指向以色列人的孩子，但正文不强行消除原有含混，末句则按原文明确说“你百姓儿女中”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“追赶他们，追赶以色列”保留原文重复强调；“淹没在……脚下”传达埃及人沉入海中、以色列人从其上方经过的空间图景。“竟”突出人数与一个婴孩之间强烈的修辞对比，但不添加原文未明说的教义解释。
