base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/002.yaml
  text: Again, in the second year of the fiftieth jubilee, you know what was spoken to you on Mount Sinai, and what the prince Mastema desired to do to you when you were returning to Egypt.
translation:
  language: zh_hans
  text: 又，在第五十个禧年的第二年，你知道[a]在西奈山上对你所说的话，也知道玛斯提玛王子想要在你返回埃及[b]时对你做什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你将知道”。
    reason: 原文动词形式可作现在时或将来时理解。
  - marker: b
    text: “返回”或译：“进入”。
    reason: 原文动词可有“返回”或“进入”的含义；叙事语境支持“返回”。
lexical_decisions:
- source_word: ታአምር
  choice: 你知道
  rationale: 该未完成式可表达现在或将来；上下文是在唤起摩西对既往之事的记忆，因此正文采用自然的现在时，同时以脚注保留“你将知道”的可能。
- source_word: መኰንን፡ መስተማ
  choice: 玛斯提玛王子
  rationale: መኰንን表示统治者、首领或王子；专名按音译作“玛斯提玛”，采用“王子”以贴近该人物在本书中的称号。
- source_word: ትገብእ፡ ግብጸ
  choice: 你返回埃及时
  rationale: ገብአ可指返回；此处叙事背景是摩西从米甸回埃及，故采用“返回”，并在脚注保留“进入”的词义可能。
- source_word: ፈቀደ፡ ይግበር፡ ምስሌከ
  choice: 想要对你做什么
  rationale: 直译为“想要与你/对你做什么”；中文如此表达自然，并且不把原文未明说的敌对含义强化为“加害”。
theological_decisions:
- issue: 玛斯提玛意图的性质
  choice: 想要对你做什么
  alternative: 想要怎样加害你
  rationale: 原文介词结构本身没有明确说“反对”或“加害”；保留语义张力，不根据上下文补入更强的敌意。
- issue: “知道”的时态
  choice: 你知道
  alternative: 你将知道
  rationale: 形式上两者皆可能；正文依语境理解为对摩西已有认知的诉诸，脚注保存未来时读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“第五十个禧年的第二年”清楚表达纪年关系；专名“玛斯提玛”音译，称号译作“王子”。脚注标记均置于正文相关句末。
