  rationale: 修订不改变经文意义：将“在埃及”及四个以“向”引出的对象直接连于“行了神迹奇事”，使其对应原文的行动框架；以“受差遣去行的”保留被动差遣和目的关系。脚注删去未经所给材料证实的“抄本段落”说法。
