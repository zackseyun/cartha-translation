  yaml_path: translation/extra_canonical/jubilees/048/004.yaml
  text: But I delivered you from his hand, and you did the signs and wonders which you were sent to do in Egypt against Pharaoh and against all his house and against his servants and against his people.
translation:
  language: zh_hans
  text: 但我救你脱离他的手；你在埃及向法老、向他的全家、向他的臣仆、向他的百姓行了神迹奇事，就是你受差遣去行的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所引吉兹文本开头另有“埃及人”一词，看来是上一句的结尾，因此正文未在此重复译出。
    reason: 原始引文在本节文字前保留了“ግብጻውያን”（埃及人），而本节句法及英语审校文本均以“但我救你……”为正文起点；脚注透明说明这一分节现象。
lexical_decisions:
- source_word: ወባላሕኩከ፡ እምእዴሁ
  choice: 但我救你脱离了他的手
  rationale: 保留第一人称施救者、第二人称受救者以及“脱离他的手”这一闪语式表达；以“但”承接上下文中的转折。
- source_word: ተአምረ፡ ወመንክረ
  choice: 神迹奇事
  rationale: 采用现代汉语圣经语域中自然且庄重的固定搭配，分别对应“记号/神迹”和“奇异之事”。
- source_word: ተፈነውከ፡ ትግበር
  choice: 你奉差遣要……所行的
  rationale: 保留原文被动的“受差遣”，不擅自明说差遣者；同时使汉语关系从句通顺。
- source_word: ላዕለ
  choice: 向
  rationale: 原文在法老、全家、臣仆和百姓前反复使用同一介词，语境表达神迹针对这些对象；汉语以一个统辖并列项的“向”自然呈现。
- source_word: ኵሉ፡ ቤቱ
  choice: 他的全家
  rationale: 直译为“他的整个家/家室”，此处“全家”兼可涵盖法老家室及其宫廷所属，避免过度限定。
- source_word: አግብርቱ
  choice: 他的臣仆
  rationale: 该词指仆役或臣属；在法老语境中“臣仆”既庄重又保留两层可能含义。
theological_decisions:
- issue: 差遣者是否应明确为上帝
  choice: 保留“奉差遣”的被动形式，不补出差遣者
  alternative: 译作“我差你去行的”
  rationale: 上下文很可能以说话者为差遣者，但原文在此使用被动式；不补明主语可保留原有表达及其神学张力。
- issue: 神迹奇事与受差遣从句的关系
  choice: 用“就是……所行的”表明这些神迹奇事正是受差遣要行的事
  alternative: 译作“你奉差遣时行了神迹奇事”
  rationale: 原文的关系结构把“神迹奇事”与受差遣所要执行的内容直接相连，不宜弱化为单纯时间关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“他的手”“神迹奇事”“臣仆”等适合古代叙事的表达；通过分号和“就是”理清较长的关系从句，同时避免把原文未明说的差遣者补入正文。
