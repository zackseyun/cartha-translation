  to: 他用火烧了他们。这一切都交在你手中，使你在这一切尚未成就以前就成就这一切；你也在场。
  rationale: 仅将指代不明的“把它成就”改为“成就这一切”。这不消解原文中“在尚未成就以前”与“成就”并置所形成的张力，也不改变任何施事、受事或时间关系。脚注内容准确说明异译及本译的句法依据，无须改动。
