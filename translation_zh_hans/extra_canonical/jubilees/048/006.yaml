  yaml_path: translation/extra_canonical/jubilees/048/006.yaml
  text: And he burned them with fire. And everything was entrusted into your hand so that you might do it, before it was done, and you were present.
translation:
  language: zh_hans
  text: 他用火烧了他们。这一切都交在你手中，使你在这一切尚未成就以前就成就这一切；你也在场。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውዐዮሙ፡ በእሳት
  choice: 用火烧了他们
  rationale: 该动词在此表示使对象被火焚烧；译文保留第三人称施事和复数受事。
- source_word: ኵሉ፡ ተፈነወ፡ በእዴከ
  choice: 这一切都交在你手中
  rationale: ተፈነወ 有“被差遣、被交付”的语义范围；结合“在你手中”，译作“交在你手中”较符合现代汉语，同时不额外限定为某种正式委托。
- source_word: ከመ፡ ትግበር
  choice: 使你……把它成就
  rationale: 保留目的结构，并以“成就”对应“做成、使之发生”，使后续同根被动表达在汉语中仍可辨认。
- source_word: ዘእንበለ፡ ይትገበር
  choice: 在这一切尚未成就以前
  rationale: 按 ዘእንበለ 加虚拟式的时间性惯用法处理为“在……以前”，不采用“离了你便没有……”的旧解。
- source_word: ወሀለወከ
  choice: 你也在场
  rationale: 直接表达第二人称单数的“存在、在场”，避免将该分句并入前句而漏译。
theological_decisions:
- issue: “在尚未成就以前就把它成就”所形成的时间与施事张力
  choice: 保留原文近乎悖论式的措辞
  alternative: 解释性改写为“使你预先安排这一切”或“这一切都由你成就”
  rationale: 原文重复同一“做成/成就”词根，并明确使用“以前”；解释性改写会替文本消解其时间和神学张力。
- issue: 末句与前文的关系
  choice: 独立译为“你也在场”
  alternative: 将其解释为“若没有你，什么也没有成就”
  rationale: ወሀለወከ 明说“你在/你存在”，应在正文中明确呈现，不宜被因果性神学释义取代。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这一切尚未成就以前就把它成就”略带不寻常的重复，是为保存原文同根词和真实张力；分号使末句“你也在场”保持独立而清晰。
