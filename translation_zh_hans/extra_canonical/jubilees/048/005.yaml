revisions:
- from: 耶和华因以色列的缘故向他们施行了严厉的报应：他用血、青蛙、蚊虫和狗蝇击打他们，又使他们生出恶疮，迸发成水疱；他使他们的牲畜遭受瘟疫，又降下冰雹，毁灭了为他们生长的一切；随后用蝗虫吞吃冰雹为他们剩下的，又使黑暗临到他们，使他们一切头生的，无论人还是牲畜，都死亡。耶和华也向他们所有的神明施行了报应。
  to: 耶和华因以色列的缘故，向他们大大施行报应：他用血、青蛙、蚊虫和狗蝇击打他们，又使他们生出恶疮，冒出水疱；他使他们的牲畜遭受死亡，又降下冰雹，借此毁灭了为他们生长的一切；又用蝗虫吞吃冰雹之后为他们所剩下的一切，又使黑暗临到他们，使他们一切头生的，无论人还是牲畜，都死亡。耶和华也向他们所有的神明施行了报应。
  rationale: 修订仅解决蝗灾对象的歧义，并将开头“大”的强调更贴近地译出；其余灾祸术语、神名和“人及牲畜的头生者”范围均予保留。将牲畜所受的“死亡”直译为“遭受死亡”，不把原文明确的结果性表述限缩为特定病因。
