base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/005.yaml
  text: 'And the LORD executed a great vengeance on them for Israel: he struck them with blood, and with frogs, and with gnats, and with dog-flies, and with evil boils that burst out in blisters, and their livestock with death, and with hailstones—by this he destroyed everything that grew for them—and with locusts that devoured what had been left for them from the hail, and with darkness, and with the death of their firstborn, of man and beast; and on all their gods the LORD executed vengeance.'
translation:
  language: zh_hans
  text: 耶和华因以色列的缘故，向他们大大施行报应：他用血、青蛙、蚊虫和狗蝇击打他们，又使他们生出恶疮，冒出水疱；他使他们的牲畜遭受死亡，又降下冰雹，借此毁灭了为他们生长的一切；又用蝗虫吞吃冰雹之后为他们所剩下的一切，又使黑暗临到他们，使他们一切头生的，无论人还是牲畜，都死亡。耶和华也向他们所有的神明施行了报应。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 耶和华
  rationale: 在此作为以色列之神的专名使用；采用现代中文圣经读者熟悉、庄重的译法。
- source_word: በቀለ
  choice: 报应
  rationale: 此词在本节首尾形成框架，表达针对加害者的惩罚性伸冤；“报应”既保留审判意味，也避免把它弱化为一般惩罚。
- source_word: በጽንጽያ፡ ክልብ
  choice: 狗蝇
  rationale: 直译为“狗蝇”，保留埃塞俄比亚文本所见复合称呼及其与出埃及灾祸传统的联系，不武断确定具体昆虫种类。
- source_word: በእኩይ፡ ቍስል
  choice: 恶疮
  rationale: 直译其负面性质，并采用自然、庄重且符合灾祸语境的现代中文。
- source_word: ዐንጸዐንጺ
  choice: 水疱
  rationale: 结合语境理解为疮迸发形成的疱；译作“水疱”比音译或含混的“肿块”更易懂。
- source_word: በሞት
  choice: 瘟疫
  rationale: 字面为“死亡”，但其直接作用于牲畜，并处于灾祸清单中；“遭受瘟疫”自然表达致死性牲畜灾，同时死亡结果仍由语义保留。
- source_word: አማልክቲሆሙ
  choice: 他们所有的神明
  rationale: 保留复数及所属关系；“神明”在中文中自然指埃及诸神，又不暗示叙述者承认其真实神性。
theological_decisions:
- issue: 神名的表达
  choice: 耶和华
  alternative: 主
  rationale: 原文在叙事中明确使用神圣称号/神名；译为“耶和华”便于与后文“他们的神明”形成清楚对照。
- issue: “在他们所有的神明上施行报应”的含义
  choice: 向他们所有的神明施行了报应
  alternative: 惩罚了他们所有的神像
  rationale: 原文说“神明”而非“神像”；保留措辞中的神学张力，不擅自将对象解释为偶像实体。
- issue: 头生者死亡的范围
  choice: 一切头生的，无论人还是牲畜，都死亡
  alternative: 杀死他们人和牲畜中的长子
  rationale: 原文涵盖人和牲畜的头生者；“头生的”避免把牲畜套入只适用于人的“长子”概念。
translation_notes:
  register: 采用现代标准普通话，语体庄重而清楚。以首尾重复的“施行了报应”保留原文框架；中段适度分句，以免灾祸长串在中文中失去层次。保留“狗蝇”等源文本特征，不用较常见但解释性更强的“虻虫”取代。
