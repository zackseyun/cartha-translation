  yaml_path: translation/extra_canonical/jubilees/048/007.yaml
  text: 'And you were to speak before the king of Egypt, before all his servants and before his people. And everything happened at your word: ten great and grievous judgments came upon the land of Egypt, for you to carry out.'
translation:
  language: zh_hans
  text: 你要在埃及王面前、在他所有臣仆和他的百姓面前说话。一切都照你的话发生了：十项重大而严厉的审判临到埃及地，为要你施行这些审判。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትናገር
  choice: 你要……说话
  rationale: 该动词为第二人称形式；用“要”自然表达上下文中的使命或预定行动，不额外强化为命令。
- source_word: ላእካኒሁ
  choice: 他的臣仆
  rationale: 此处指埃及王属下的官员或侍从；“臣仆”兼顾宫廷语境与原词的从属意味。
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留原词所含的司法性和神学张力，不仅译作泛泛的“灾祸”。
- source_word: ዐበይት፡ ወጸዋጋት
  choice: 重大而严厉的
  rationale: 分别传达“大”和“沉重、严酷”的修饰意义，同时符合现代汉语搭配。
- source_word: ትግበር
  choice: 由你施行
  rationale: 按主动语态和第二人称阳性单数处理，明确摩西是施行动作的主体。
theological_decisions:
- issue: 十灾被称为“审判”及摩西的施行角色
  choice: 十场重大而严厉的审判……由你施行
  alternative: 十场重大而惨痛的灾祸……得以施行
  rationale: 原文使用具有审判意味的名词，并以第二人称主动动词收尾；译文保留神圣审判与摩西主动参与之间的张力，不改成被动表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“埃及王”紧贴原文，“臣仆”保留宫廷语域；句末用“由你施行”清楚反映原文主动的第二人称形式。
