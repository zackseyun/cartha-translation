  yaml_path: translation/extra_canonical/jubilees/048/015.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the prince Mastema was bound and imprisoned behind the children of Israel.
translation:
  language: zh_hans
  text: 在十四日、十五日、十六日、十七日和十八日，马斯提玛这首领被捆绑并囚禁在以色列子孙后面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在以色列子孙后面”直译为“在他们后面”；此处的空间关系及其具体含义并未进一步说明，也可能暗示他被拘禁在后方，不能追上以色列子孙。
    reason: source_ambiguity
lexical_decisions:
- source_word: መኩነነ፡ ማእቲማ
  choice: 马斯提玛首领
  rationale: መኩነነ 表示掌权者、首领；采用“首领”既自然，也不额外引入特定的天使等级称谓。
- source_word: ሀሎ፡ አቡረ፡ ወዐዐወ
  choice: 一直被捆绑、囚禁
  rationale: ሀሎ 表示持续处于某种状态，后面两个词分别传达受捆绑和受拘禁；“一直”也说明这一状态贯穿所列日期。
- source_word: እምድኅሬሆሙ
  choice: 留在……后面
  rationale: 按词面保留“在他们后面”的空间关系，不把含义擅自解释为保护、追赶或远离。
- source_word: ለውሉደ
  choice: 以色列子孙
  rationale: 现存短语在句末有所省略或截断；结合紧邻语境及可靠的经文分节传统，所指为以色列子孙。
theological_decisions:
- issue: 马斯提玛的身份称谓
  choice: 首领
  alternative: 魔王／恶天使之王
  rationale: 原文在此仅使用掌权者性质的称谓；译作“首领”避免把后世恶魔论分类带入文本。
- issue: “在以色列子孙后面”的关系
  choice: 保留空间性表达
  alternative: 使他不能控告或追赶以色列子孙
  rationale: 原文没有在本句明说目的或结果；保留其含混性，避免依据上下文补出神学解释。
translation_notes:
  register: 采用庄重而通顺的现代汉语。日期列表略作合并，但完整保留十四日至十八日；用“一直”呈现原文持续状态。所给吉兹文本开头“把你百姓的子孙丢在河中……”是上一节末尾的残句，因此未纳入本节正文。
