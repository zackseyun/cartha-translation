  to: 他藉着那人为以色列施行了报复。[a]主为以色列所做的一切，都是照着他与亚伯拉罕所立的规例，为要向那些人施行报复，正如他们曾以强暴奴役以色列人一样。[b]
  rationale: 修订直接保留首句“藉着他”的工具性意义，避免“此人”带来的额外指示意味；并重组第二句，使“主为以色列所做的一切”明确受“照着……规例”限定。保留原文中报复词语的重复、以强暴奴役的具体含义，以及“正如”所表达的相称／对应关系。
