  yaml_path: translation/extra_canonical/jubilees/048/008.yaml
  text: Through him he took vengeance for Israel. And the LORD did everything for Israel, and according to his ordinance, which he established with Abraham, so that he might take vengeance on them just as they had enslaved them by force.
translation:
  language: zh_hans
  text: 他藉着那人为以色列施行了报复。[a]主为以色列所做的一切，都是照着他与亚伯拉罕所立的规例，为要向那些人施行报复，正如他们曾以强暴奴役以色列人一样。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“他藉着他为以色列施行了报复”；两个代词的所指须由上文确定。
    reason: 保留ቦቱ的工具性表达和原文代词所指依赖上下文的特点。
  - marker: b
    text: 原文两处均用复数代词，直译为：“向他们施行报复，正如他们曾以强暴奴役他们一样。”按上下文，前一组“他们”指施行奴役者，后一组指以色列人。
    reason: 说明原文代词形式，并交代正文为避免汉语歧义而作的最低限度所指澄清。
lexical_decisions:
- source_word: ቦቱ
  choice: 借着此人
  rationale: 该词在此表示凭借或经由前文所指的人；译作“此人”既承接上下文，又不擅自补明其身份。
- source_word: በቀለ፡ ለእስራኤል
  choice: 为以色列报了仇
  rationale: 保留完成式陈述及“为以色列”的受益含义，不误译为目的从句。
- source_word: ሥርዐቱ
  choice: 规例
  rationale: 原词可指秩序、规定或所制定的规例；此处不直接译作“约”，以免把词义过度神学化。
- source_word: ይትበቀል፡ ላዕሌሆሙ
  choice: 向那些人施行报复
  rationale: 准确表达对某些人施行报复；用“那些人”帮助现代汉语读者辨明其与随后被奴役的以色列人不是同一群体。
- source_word: ቀነይዎሙ
  choice: 奴役以色列人
  rationale: 该动词具体表示使人服役、使人臣服或奴役，比宽泛的“压迫”更准确。
- source_word: በግፍዕ
  choice: 以强暴
  rationale: 保留原词所含的不义、暴力和强制色彩。
theological_decisions:
- issue: “与亚伯拉罕所立的”究竟修饰规例还是指圣约
  choice: 译作“他与亚伯拉罕所立的规例”
  alternative: “他与亚伯拉罕所立的约”
  rationale: 紧贴ሥርዐት的词义，不因亚伯拉罕语境而把它直接等同于“约”，同时保留它是上帝与亚伯拉罕所确立安排的含义。
- issue: 报复的对象与被奴役的对象在原文中都以复数代词表示
  choice: 正文按语境分别表达为“那些人”和“以色列人”
  alternative: 两处都直译为“他们”
  rationale: 原文的所指转换可由语法和上下文识别，但现代汉语连续使用“他们”会造成实质性误读；正文作最低限度的所指澄清，并以脚注说明原文形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“报了仇／施行报复”保留同一词根在本节中的重复；“为要”体现目的关系，“正如……一样”保留በከመ所表达的对应或相称关系。
