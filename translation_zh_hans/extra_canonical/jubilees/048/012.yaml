  yaml_path: translation/extra_canonical/jubilees/048/012.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the angel Mastema was bound and restrained from following after the children of Israel.
translation:
  language: zh_hans
  text: 在第十四日、第十五日、第十六日、第十七日和第十八日，天使玛斯提玛被捆绑、受约束，不得追赶以色列子民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአክ
  choice: 天使
  rationale: 该词可指“使者”或“天使”；在玛斯提玛这一超自然存在的语境中译作“天使”最直接，也避免采用原文未明说的“首领”。
- source_word: ተእስረ
  choice: 被捆绑
  rationale: 保留原文的被动意义及具体的束缚意象。
- source_word: ተዐግሠ
  choice: 受约束
  rationale: 表达被拦阻、受抑制之意，并与前面的“被捆绑”形成原文所见的并列动作。
- source_word: እምድኅረ ፡ ደቂቀ ፡ እስራኤል
  choice: 不能追赶以色列子民
  rationale: 按语境将“在……之后”自然表达为“追赶”，并完整保留“以色列子民”；“不能”明确呈现约束所造成的阻止结果。
theological_decisions:
- issue: 玛斯提玛的身份称谓
  choice: 玛斯提玛天使
  alternative: 玛斯提玛首领
  rationale: 原文明确使用“天使/使者”一词，并未使用“首领”；因此不引入传统译法中的额外头衔。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。日期列举略作汉语式整合，但完整保留第十四日至第十八日的逐日顺序；“被捆绑、受约束”保留原文两个并列动词，不将其合并。
