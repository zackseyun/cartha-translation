  source_fidelity: 所给吉兹语定位行包含“埃及人”“以色列人”和刚硬其心等较完整的叙述，而英语审校轨迹及中文草稿仅是“Israel, so that he could not accuse them”的截段；两者无法逐词、逐句对应。就英语审校轨迹而言，草稿保留了“他”和“他们”的未明指向，未擅自补入人物身份。
