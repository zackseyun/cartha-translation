  source_fidelity: 所提供的吉兹语定位行（标作源文第17行）内容涉及埃及人追赶以色列人、心被刚硬，以及毁灭他们，与指定经节及英语审校短语“Israel, so that he could not accuse them”不对应。因此不能以该错位行支持“控告”一词；就指定的英语审校层而言，译文保留了“Israel／them”和“accuse”的基本指向。
