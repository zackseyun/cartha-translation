  yaml_path: translation/extra_canonical/jubilees/048/014.yaml
  text: And all the people whom he had brought out pursued after Israel, and the Lord God cast them into the midst of the sea, into the depths of the abyss, beneath the children of Israel, just as the people of Egypt had cast their children into the river; He took vengeance on a million of them, and one thousand mighty men were destroyed, and those who pursued them perished because of envy.
translation:
  language: zh_hans
  text: 那地是干的。[a]他所领出来的众民都追赶以色列；主上帝把他们抛进海中，投入深渊的深处，在以色列子孙下面，[b]正如埃及人曾把自己的孩子扔进河里一样。[c]他向他们中的一百万人施行报复，一千名勇士被消灭；那些追赶他们的人也因嫉妒而灭亡。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那地是干的”在原文中是承接上文的短语，也可译作“那是干地”。
    reason: 原文以关系性短语开头，脱离前节时句法不完整，需提示其跨节衔接。
  - marker: b
    text: “投入深渊的深处，在……下面”直译原文；这里的空间关系较为浓缩，也可理解为海的深处位于以色列子孙下方。
    reason: 保留“深处”“深渊”和“在……下面”三个成分，同时说明原文紧缩句法造成的歧义。
  - marker: c
    text: “自己的孩子”是按原文代词直译；鉴于《出埃及记》的背景，也可能是指埃及人扔进河里的以色列孩子。
    reason: 原文的语法回指与叙事背景之间存在真实张力，不宜在正文中无声消解。
  - marker: d
    text: 原文数字直译为“一百万人”和“一千名勇士”；这些异常庞大的数目可能反映本文传抄中的数字形式，但现存文本如此。
    reason: 数字容易被改译或校正；脚注明示译文遵从所给吉兹文本的数值。
lexical_decisions:
- source_word: እንተ፡ የብስ
  choice: 那地是干的
  rationale: 短语直译为“那是干的／干地”，句法上承接上文；中文补出“地”以表达其名词性所指，同时以脚注说明衔接关系。
- source_word: ይደግኑ፡ ድኅሬሆሙ፡ ለእስራኤል
  choice: 都追赶以色列
  rationale: 该表达意为“跟在……后面追赶”；中文采用自然而准确的“追赶”。
- source_word: ወረዎሙ
  choice: 把他们抛进
  rationale: 动词具有使之下去、扔下或投入之意；“抛进”保留上帝主动把追兵投入海中的力度。
- source_word: ውስተ፡ መዓምቅቲሃ፡ ሰቀላይ
  choice: 投入深渊的深处
  rationale: 同时体现“深处”和“深渊”两个要素，避免遗漏ሰቀላይ。
- source_word: ወረዉ፡ ውሉዶሙ፡ ሰብአ፡ ግብጽ
  choice: 埃及人曾把自己的孩子扔进
  rationale: 保留埃及人为施事者、孩子为受事者的主动句结构，也呈现报应式对照；代词按原文译为“自己的”。
- source_word: ኀበቀሎሙ
  choice: 他报应了其中
  rationale: 按校勘所指的“向他们施行报复／报应”理解；“报应”与前后行为对应，并避免补入原文没有明说的方式。
- source_word: በእንተ፡ ሕሱዳ
  choice: 因嫉妒
  rationale: 按该词通常的“嫉妒、妒忌”义直译，不改释为较宽泛的敌意。
theological_decisions:
- issue: 海中毁灭与埃及人投孩子入河之间的报应关系
  choice: 保留“正如……一样”以及“报应”措辞
  alternative: 弱化为单纯的历史类比
  rationale: 原文明确并置“抛进海中”与“扔进河里”，又使用报复／报应动词；译文应保留其神学张力，不替文本淡化神圣审判。
- issue: “他们的孩子”的身份
  choice: 正文译作“自己的孩子”，脚注说明历史语境也可能指被埃及人投入河中的以色列孩子
  alternative: 正文直接译作“以色列人的孩子”
  rationale: 原文代词形式表面上回指埃及人，但与《出埃及记》背景存在张力；正文保留语法表层，脚注交代语境，不擅自消除歧义。
- issue: 上帝作为海中毁灭的主动者
  choice: 明确译为“主上帝把他们抛进海中”
  alternative: 用被动式“他们坠入海中”
  rationale: 原文明确以上主上帝为主语；不可通过被动表达削弱其主动施行审判的陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主上帝”“以色列子孙”“深渊”“报应”等词保持经卷叙事的肃穆感，同时避免古奥文言。正文尽量贴近吉兹文本；对跨节残句、空间短语、孩子身份及异常数字均以脚注保留并说明歧义。
