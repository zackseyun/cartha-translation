base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/009.yaml
  text: And the prince Mastema stood up against you and sought to cast you into Pharaoh’s hand, and he helped the magicians of Egypt, and they stood and acted before you. We indeed permitted them to do evil, but we did not allow healing to be performed by their hands. But the LORD struck them with evil sores, and they were unable to continue resisting, because we made them incapable of performing even one sign of enchantment. And through all the signs and wonders the prince Mastema was put to shame, until, when he grew strong, he cried out to the Egyptians that they should pursue after you with all the power of Egypt, with their chariots and with their horses and with all the multitude of the people of Egypt. And I stood between the Egyptians and Israel, and we delivered Israel from his hand and from the hand of his people, and the LORD brought them out through the midst of the sea as on dry land.
translation:
  language: zh_hans
  text: 玛斯提玛王子起来与你作对，企图把你交在法老手中；他又帮助埃及的术士，使他们站在你面前施行法术。我们确实准许他们行恶，却不容他们借自己的手施行医治。[a]但主用恶疮击打他们，他们便无力继续抗拒，因为我们使他们连一个法术性的神迹也施行不出来。在这一切神迹奇事中，玛斯提玛王子蒙受羞辱；后来，他强盛起来，就向埃及人呼喊，叫他们以埃及全部的力量，带着战车、马匹和埃及人的全体众民追赶你。我站在埃及人与以色列之间；我们救以色列脱离他的手和他百姓的手，主就领他们从海中经过，如同走在干地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有译法：“他们确实施展自己的法术，我们也准许他们，使这些事得以借他们的手施行。”
    reason: 这一句的传本文字和词形存在困难；正文依据“准许行恶／不容医治”的对照翻译，同时保留传统的另一种理解。
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: 玛斯提玛王子
  rationale: መኰንን 表示统治者、首领或王子；采用“王子”既与人物称号相称，也避免误解为普通官员。专名依通行形式音译为“玛斯提玛”。
- source_word: ሥረያቲሆሙ፡ ለግብጽ
  choice: 埃及的术士
  rationale: 上下文对应与摩西对抗的埃及术士；采用普通读者易懂且符合叙事背景的称谓。
- source_word: እኩየስኬ፡ … ወፈውሳስ
  choice: 确实准许他们行恶，却不容他们……施行医治
  rationale: 保留格尔兹文“恶”与“医治”之间的明确对照，并按校勘所指出的否定意义译出后半句。
- source_word: በቍስል፡ እኩይ
  choice: 用恶疮击打
  rationale: 直译为严重、恶性的疮；“恶疮”简洁庄重，也呼应出埃及记的灾祸。
- source_word: ሕሱደ፡ ትእምርተ
  choice: 邪术的神迹
  rationale: 兼顾表示欺骗或法术性质的修饰语与“记号、神迹”的名词，不把其真实性或机制解释得过死。
- source_word: በሰረገላቲሆሙ፡ ወበአፍራሲሆሙ
  choice: 带着战车、马匹
  rationale: 按原文并列结构自然译出军事追击力量。
- source_word: እንተ፡ ማእከለ፡ ባሕር
  choice: 从海中经过
  rationale: 保留“海”的一般称呼，不擅自具体化为某一现代地名。
theological_decisions:
- issue: 神圣群体第一人称“我们”的身份
  choice: 保留“我们”，不指明其成员
  alternative: 解释为上帝与天使，或叙述者所属的天使群体
  rationale: 原文在“我们准许”“我们使他们不能”“我们救以色列”等处使用复数第一人称，同时又单称“主”；译文保留这一张力，不加入原文未明说的身份解释。
- issue: 玛斯提玛后来“强盛起来”的含义
  choice: 直译为“后来，他强盛起来”
  alternative: 译为“直到他鼓起勇气”或“直到他占了上风”
  rationale: 原文措辞可指力量增强；直译避免解释成心理状态，也保留为何受辱后仍能煽动追兵的叙事张力。
- issue: 以色列的单数拟人表达
  choice: 译作“以色列”，后文以“他的手”指玛斯提玛
  alternative: 将以色列扩展为“以色列人”
  rationale: 保留原文将以色列作为整体称呼的表达，同时通过上下文明确代词所指，避免中文歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体；保留原文中的“你”“我们”和“主”，不额外解释说话者身份。术语避免过度宗派化，“神迹奇事”“恶疮”“术士”等表达兼顾经文语域与现代可读性。
