  text: And Benjamin was the youngest[4], and for this reason he remained with his father. And there came the kings of Taphu, and the kings of Ares, and the kings of Seragan, and the kings of Selo, and the kings of Gaas, and the king of Bethoron, and the king of Maanisakir, and all those who dwell on this mountain, and those who dwell in
translation:
  language: zh_hans
  text: 便雅悯是最年幼的[a]，因此留在父亲身边。塔孚的诸王、阿雷斯的诸王、塞拉甘的诸王、塞洛的诸王、迦阿斯的诸王，以及伯特和仑的王、玛阿尼撒基尔的王都来了；所有住在这山上的人，以及住在……的人，也都来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第4—8节中的地名与王号次序，在吉兹语文本传承中难以确定；因此采用保守音译，不强行对应已知地点。本节末句延续至下一节。
    reason: 保留英文审校轨迹对疑难专名的说明，并准确说明句子跨节延续，而不误称文本残缺。
lexical_decisions:
- source_word: ብንያም
  choice: 便雅悯
  rationale: 采用现代中文圣经读者熟悉的人名形式。
- source_word: ዘይኄእስ
  choice: 年纪最小
  rationale: 按上下文表达幼子、最年幼者之意，避免仅译作体格上的“小”。
- source_word: ነገሥተ
  choice: 诸王
  rationale: 保留复数形式；该词在若干地名之前重复出现。
- source_word: ንጉሠ
  choice: 王
  rationale: 保留原文在伯特和仑、玛阿尼撒基尔之前使用的单数形式。
- source_word: ደብር
  choice: 山
  rationale: 此处指山或山地；依直接语境采用“山”。
- source_word: ቤተርን
  choice: 伯特和仑
  rationale: 按可能对应的地名 Bethoron 音译，未进一步地理归一化。
- source_word: ማአኒሳኬር
  choice: 玛阿尼撒基尔
  rationale: 对疑难专名作保守音译，不以推测替换。
