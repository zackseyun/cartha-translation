  text: And the sons of Jacob slaughtered a kid of the goats and dipped Joseph’s garment in the blood, and sent it to Jacob their father on the tenth of the seventh month.
translation:
  language: zh_hans
  text: 雅各的儿子们宰了一只山羊羔，把约瑟的衣服蘸在血里[a]，在七月初十送到他们父亲雅各那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用血染了”。
    reason: 原动词在此语境中可侧重实际浸蘸的动作，也可按结果译为染血；正文保留较具体的动作表达。
lexical_decisions:
- source_word: ዳቤላ፡ ጠሊ
  choice: 一只山羊羔
  rationale: 按短语所指的幼山羊直译，同时采用现代汉语自然量词。
- source_word: ጸንቀቀ
  choice: 蘸在……里
  rationale: 表达把衣服置入血中的具体动作，比仅译作“染上”更贴近原文动作性，也保留与《创世记》相关叙事的呼应。
- source_word: ልብሱ፡ ለዮሴፍ
  choice: 约瑟的衣服
  rationale: 以自然的现代汉语表达所属关系；原文未进一步限定衣服的样式。
- source_word: አመ፡ ዐሡሩ፡ ለወርኀ፡ ሳብዕ
  choice: 在七月初十
  rationale: 准确表达第七个月第十日，并采用现代中文通行的日期说法。
theological_decisions: []
translation_notes:
