translation:
  language: zh_hans
  text: 他的仆人，直到他和众子下到埃及的那一天。这个七年周期的第七年，他从家里差遣约瑟去探问他兄弟们在……地是否平安[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给原文在此中断。“地”在原文中为领属结构，后面本应接地名或其他限定语。
    reason: 说明本节末尾是不完整的“在……地之／……地”短语，避免擅自补足地名或将其译作完整地点。
lexical_decisions:
- source_word: አግብርተ
  choice: 他的仆人
  rationale: 按所给分节保留开头承接上文的名词短语；原文在此处显然从前句中段开始。
- source_word: ወረዱ
  choice: 下到
  rationale: 保留闪语叙事中前往埃及常用的方向表达“下去/下到”，同时符合现代汉语习惯。
- source_word: ዝ ሱባዔ
  choice: 这七年
  rationale: ሱባዔ 指一个七年周期；译作“这七年”比生硬的“这个七期”更易懂，也保留历法含义。
- source_word: ያእምር ሰላሞሙ
  choice: 探问……是否平安
  rationale: 字面涉及“知道他们的平安/安好”，汉语叙事中“探问是否平安”自然且准确。
- source_word: ምድረ
  choice: ……地
  rationale: 该词为领属结构形式“某某之地”，但所给原文在领属成分出现前截断；用省略号显明文本不完整，而不擅自补入地名。
