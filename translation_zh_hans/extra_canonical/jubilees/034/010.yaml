revisions:
- from: 他的仆人，直到他和众子下到埃及的那一天。这七年的第七年，他从家里差约瑟去探问他兄弟们是否平安；他们当时在……地[a]。
  to: 他的仆人，直到他和众子下到埃及的那一天。这个七年周期的第七年，他从家里差遣约瑟去探问他兄弟们在……地是否平安[a]。
  rationale: 修订将“第七年”明确为七年周期中的第七年，并将末尾残缺地点短语直接置于“兄弟们”所在处，不添加“当时”。开头继续保留为承接上文的残句；末尾以省略号和脚注忠实呈现现有分节在领属结构中截断的状态。
