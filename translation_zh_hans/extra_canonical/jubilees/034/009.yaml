lexical_decisions:
- source_word: ርቤአሃ፡ ወትምናታሬስሃ
  choice: 鲁贝勒和塔姆纳塔雷斯
  rationale: 按人名音译处理，并依现有校勘层所反映的读法转写；不擅自补充原文未明说的身份或称号。
- source_word: ወተመይጠ፡ በሰላም
  choice: 他平安返回
  rationale: 直接表达动词“返回”及方式状语“平安地”，符合现代汉语习惯。
- source_word: ወገብረ፡ ምስሌሆሙ፡ ሰላመ
  choice: 与他们讲和
  rationale: 原文直译为“与他们缔造和平”；“讲和”自然、简洁，并保留双方结束敌对状态的含义。
- source_word: ወኮንዎ
  choice: 他们也归属于他
  rationale: 保留动词所带第三人称阳性单数宾语后缀所表达的“对他／属于他”关系；避免译成单纯的“他们是”，也不补出原文没有明说的“臣仆”或“纳贡者”。
