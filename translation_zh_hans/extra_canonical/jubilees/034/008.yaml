translation:
  language: zh_hans
  text: 以及西罗、阿曼尼斯凯尔和迦迦阿斯。他收回了自己的牲畜，胜过他们，又向他们征收贡赋；他们便把他们土地所出产的五分之一交给他作贡赋。他又修建了[a]——
