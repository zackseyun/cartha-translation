lexical_decisions:
- source_word: ሴሎ፡ አማኒስኬር፡ ጋጋአስ
  choice: 西罗、阿曼尼斯凯尔和迦迦阿斯
  rationale: 按吉兹文形式音译三个人名，并保留本节开头承接上文的列举结构。
- source_word: አስተጋብአ፡ መራዕይሁ
  choice: 收回了自己的牲畜
  rationale: መራዕይ通常指畜群、牲畜；动词表达重新聚集或收回之意。相较宽泛的“财物”，此译更贴近词汇本义。
- source_word: ዐብየ፡ ላዕሌሆሙ
  choice: 胜过他们
  rationale: 保留“在他们之上强盛、占上风”的基本含义，中文用简洁自然的“胜过”表达。
- source_word: ሠርዐ፡ ፀባሕተ፡ ላዕሌሆሙ
  choice: 向他们征收贡赋
  rationale: 字面为把贡赋加在他们身上，即规定并征收贡赋。
- source_word: ኀምስተ፡ ፍሬ፡ ምድርሙ
  choice: 本地出产的五分之一
  rationale: ኀምስተ在此依语境表示五分之一，ፍሬ ምድር指土地的果实或出产。
- source_word: ሐነጸ
  choice: 修建了
  rationale: 该动词意为建造、修建；句子跨节未完，故以破折号提示后文续接。
