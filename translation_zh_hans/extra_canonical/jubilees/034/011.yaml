  to: 示剑；他在多坍地找到了他们。他们以诡诈待他，商议要杀他；后来却改变主意，把他卖给以实玛利商人，又把他带到埃及，卖给波提乏——法老的一名官员、护卫长、希利奥波利斯城的祭司。
