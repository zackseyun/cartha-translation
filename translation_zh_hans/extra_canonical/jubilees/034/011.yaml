review_pass:
  verdict: revise
  source_fidelity: “以诡诈待他”“商议要杀他”“改变主意”“以实玛利商人”“护卫长”均恰当反映吉兹文本，尤其没有把 ሊቀ፡ ዐቀብት 改作《创世记》传统中常见的“膳长/厨役长”。但源文中带约瑟下埃及并将他卖给波提乏的主语仍是兄弟们；草稿改成“商人把他带下埃及，卖给……”属于无根据的主语转换。
  naturalness: 开头“示剑；他在多坍地找到了他们”作为承接上文的残句可以保留，但“商人把他带下埃及”除忠实度问题外，也使叙事衔接失准。将波提乏的连续职衔置于人名之后，以破折号列举，较符合现代汉语且不消解其并列关系。
  terminology: 人名、地名及“以实玛利”“波提乏”“希利奥波利斯”均可接受。“护卫长”准确。保留“祭司”而不将其改释为非宗教职衔，合乎源文。
  issues:
  - severity: high
    issue: 将“他们”改为“商人”作为带约瑟下埃及并售卖他的主语。
    rationale: 吉兹文在“卖给以实玛利商人”之后，仍以复数动词叙述他们把约瑟带到埃及并卖给波提乏；文本没有把这些行动转交给商人。
  revised_text: 示剑；他在多坍地找到了他们。他们以诡诈待他，商议要杀他；后来却改变主意，把他卖给以实玛利商人，又把他带到埃及，卖给波提乏——法老的一名官员、护卫长、希利奥波利斯城的祭司。
