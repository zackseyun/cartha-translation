base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/011.yaml
  text: Shechem[11], and he found them in the land of Dothan. And they dealt treacherously with him and made a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis.
translation:
  language: zh_hans
  text: 示剑；他在多坍地找到了他们。他们以诡诈待他，商议要杀他；后来却改变主意，把他卖给以实玛利商人，又把他带到埃及，卖给波提乏——法老的一名官员、护卫长、希利奥波利斯城的祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሐብበይዎ
  choice: 他们以诡诈待他
  rationale: 该动词在此表示以诡诈、欺骗的方式对待或谋害，不是通常表示“恨”的词；译文保留其行为意味。
- source_word: ወገብሩ፡ ላዕሌሁ፡ ምክረ
  choice: 商议要……
  rationale: 直译为“针对他制订计谋”；现代汉语以“商议要杀他”自然表达共同谋划。
- source_word: ወተመይጦሙ
  choice: 后来却改变主意
  rationale: 表示他们回转、改变决定；“却”呈现从杀害转为出售的转折。
- source_word: ለነጋዲተ፡ እስማዒላዊያን
  choice: 以实玛利商人
  rationale: 保留族称及商旅身份，符合源文。
- source_word: ሊቀ፡ ዐቀብት
  choice: 护卫长
  rationale: 源文由“首领”和“守卫者”构成，意为护卫的首领，不采用《创世记》熟悉措辞所可能引入的“膳长/厨役长”。
- source_word: ሣውዕ፡ ዘሀገረ፡ ኤሌው
  choice: 希利奥波利斯城的祭司
  rationale: ሣውዕ 表示祭司；ኤሌው 所指城市对应希利奥波利斯，采用现代通行音译。
theological_decisions:
- issue: 波提乏的职衔
  choice: 护卫长
  alternative: 膳长／厨役长
  rationale: 按本节吉兹语 ሊቀ ዐቀብት 翻译，不以其他传统中的平行叙事措辞替换源文。
- issue: “祭司”与“护卫长”的关系
  choice: 两项称谓并列修饰波提乏
  alternative: 将“祭司”理解为另一人物或改释为非宗教官职
  rationale: 源文连续列出法老官员、护卫长及该城祭司；译文保存这种张力，不替作者消解职务并存的问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。开头“示剑”承接上一节未完的行程句，故保留分号以显示其承前性质；人名地名采用常见中文形式。
