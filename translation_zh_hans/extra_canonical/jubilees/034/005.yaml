  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አም፡ ምድረ፡ ከናዓን
  choice: 从迦南地回来
  rationale: 据校勘说明，አም 是እም（“从”）的排印讹误；此短语承接上一节所述之人的行动。中文补出“回来”，使跨节残句自然成立，但不增添新的地点信息。
- source_word: ወዜነዉዎ፡ ለያዕቆብ
  choice: 他们告诉雅各
  rationale: ዜነወ 表示告知、报告；间接受词明确为雅各。
- source_word: እንዘ፡ ይብሉ
  choice: 说
  rationale: 该结构引出所报告的话，现代汉语简洁译作“说”。
- source_word: ናሁ
  choice: 看哪
  rationale: 保留提示听者注意的语气，并采用庄重而通行的圣经汉语表达。
- source_word: ነገሥተ፡ አሞሬዎን
  choice: 亚摩利人的诸王
  rationale: 复数“诸王”对应ነገሥት；族名按现代中文圣经惯用形式音译为“亚摩利人”。
