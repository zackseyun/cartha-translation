  text: Their sin was that they had brought grief to the compassion of their father because of Joseph his son. And this day was ordained so that they should grieve on it for their sins, and for all their transgressions, and for all their errors, so as to cleanse themselves on this day once each year.
translation:
  language: zh_hans
  text: 他们的罪在于：他们因约瑟——他们父亲的儿子——伤了父亲的怜悯之心。这一天被定下，是要他们在这一天为自己的罪、所有过犯和一切过失悲哀，好叫他们每年一次在这一天洁净自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语引文在“以及一切……”处中断；本句末尾“过失……每年一次”依据经审校的英文参照层补足。
    reason: 明确说明原始语言材料在本节末尾不完整，避免把参照层补文误作所提供吉兹语中完整可见的内容。
lexical_decisions:
- source_word: ኃጢአቶሙ
  choice: 他们的罪／自己的罪
  rationale: 按上下文分别作主题和介词宾语，保留“罪”的伦理与宗教含义。
- source_word: አኅዘኑ
  choice: 伤透了
  rationale: 该使役形式表达“使……悲伤”；用现代汉语自然传达强烈的致哀含义。
- source_word: ምሕረተ፡ አቡሆሙ
  choice: 父亲的慈心
  rationale: ምሕረት通常指怜悯、慈悲；此处不是抽象教义术语，而是父亲对儿子的慈爱怜惜，因此译作“慈心”，避免生硬的“使父亲的怜悯悲伤”。
- source_word: ተሠርዐት
  choice: 被定下
  rationale: 表达该日被设立、规定为特定纪念之日，中文简洁自然。
- source_word: ይሕዝኑ
  choice: 悲哀
  rationale: 与前面的“使悲伤”同源语义相应，并符合为罪哀恸的语境。
- source_word: አበሳሆሙ
  choice: 过犯
  rationale: 与“罪”并列时译作“过犯”，保留原文近义词累积而不合并。
theological_decisions:
- issue: 父亲之“怜悯/慈悲”是否拟人化保留
  choice: 译作“伤透了父亲的慈心”
  alternative: “使他们的父亲因他的儿子约瑟而悲伤”
  rationale: 原文明确含有ምሕረት（怜悯、慈悲），不宜完全省略；“慈心”既保留词义，又符合现代中文表达。
- issue: 洁净的主体与方式
  choice: “好叫他们……洁净自己”
  alternative: “使他们在这一天得洁净”
  rationale: 依英语审校层所保存的反身意义，不将洁净明确解释为神主动施行或礼仪自动生效，以免加入原文未明说的神学立场。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“约瑟——父亲的儿子——”以插入语保留原文同位说明；“罪、过犯、过失”维持并列层次，不将其神学化为特定宗派术语。
