  text: 亚摩利人的七个王聚集起来对付他们，要暗中杀害他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጋብኡ
  choice: 聚集起来
  rationale: 表达共同聚集、联合行动之意；中文无需照搬反身形式。
- source_word: ሱባዔቲሆሙ፡ ነገሥተ፡ አሞሬዎን
  choice: 亚摩利人的七个王
  rationale: 按源文数量词、王与族名之间的关系自然重组为现代汉语。
- source_word: ላዕሌሆሙ
  choice: 攻击他们
  rationale: 源文直义近于“反对／敌对他们”；结合随后杀害的目的，用“攻击”体现敌对行动，同时不过度具体化为战争。
- source_word: ከመ፡ ይቅትልዎሙ
  choice: 要……杀死他们
  rationale: 保留目的关系和杀害行为的直接力度。
- source_word: ኀብኢኦሙ
  choice: 暗中
  rationale: 该形式表达隐藏、隐秘行动的方式；按其副词性功能译为“暗中”，比“把自己藏起来”更自然。
