  text: And in the sixth year of this week, of this forty-fourth jubilee, Jacob sent his sons to pasture their sheep, and their servants also with them, in the pasture of Shechem.
translation:
  language: zh_hans
  text: 在这第四十四个禧年的这一七年期的第六年，雅各派遣他的儿子们，连同他们的仆人，到示剑的牧场去放牧他们的羊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: 七年
  rationale: 该词在《禧年书》的年代框架中指一个七年周期；译作“七年”比直译“周”更能让现代汉语读者清楚理解。
- source_word: ዘአርብዓ ወረባዕቱ እዮቤልው
  choice: 第四十四个禧年
  rationale: 按数词“ 四十又四”及“禧年”直译，保留原文纪年方式。
- source_word: ይርዐዩ አባግዒሆሙ
  choice: 放牧他们的羊
  rationale: 动词表示牧放、使吃草；宾语带第三人称复数所有格，故译“他们的羊”。
- source_word: ወአግብርቲሆሙኒ
  choice: 他们的仆人也
  rationale: 名词附第三人称复数所有格后缀，明确是“他们的”，附加成分表达“也”。
- source_word: ውስተ ጸአተ ሴቄም
  choice: 去示剑的牧场
  rationale: 介词短语与“差遣……去放牧”自然衔接；“牧场”为单数，示剑按传统地名音译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“这个七年”保留原文在禧年内指示特定七年周期的表达；调整汉语语序，使地点与放牧动作自然结合。依照格尔兹语复数所有格，将仆人明确译为“他们的仆人”，不沿用较早的“他的仆人”异译。
