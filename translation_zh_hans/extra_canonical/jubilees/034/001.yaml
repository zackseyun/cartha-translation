- from: 在这第四十四个禧年的这个七年的第六年，雅各差遣儿子们去示剑的牧场放牧他们的羊，他们的仆人也和他们一同去了。
  to: 在这第四十四个禧年的这一七年期的第六年，雅各派遣他的儿子们，连同他们的仆人，到示剑的牧场去放牧他们的羊。
  rationale: 修订仅调整汉语语序和纪年表达，以更自然地呈现原文：雅各所差遣的是儿子们，仆人也与他们同去；“他们的仆人”保留格尔兹语复数所有格。原文“牧场”为单数，译文亦维持单数。
