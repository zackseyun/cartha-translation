revisions:
- from: 因此，规定以色列子孙要在七月初十刻苦己身[a]；这一天，关于约瑟的消息传到了他父亲雅各那里。他们也要在七月初十这一天献一只小山羊，为自己赎罪，每年一次，因为他们犯了罪；他们曾因约瑟——他们父亲的儿子——伤了父亲的心。
  to: 因此，为以色列子孙定下了条例：他们要在七月初十刻苦己身[a]，就是关于约瑟的消息传到他父亲雅各那里的那一天；他们也要在七月初十这一天用一只小山羊为自己赎罪，每年一次，为了他们的罪，因为他们伤害了父亲对他儿子约瑟的慈爱之情。
  rationale: 修订使“以羊赎罪”的关系明确可见，并将末句改为符合现代标准汉语的表达，同时保留原文对雅各所收到消息内容的含混性，且不在正文加入“赎罪日”的名称。
