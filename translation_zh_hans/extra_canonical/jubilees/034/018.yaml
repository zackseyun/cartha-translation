  yaml_path: translation/extra_canonical/jubilees/034/018.yaml
  text: Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month[a], on the day when the news about Joseph reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the affection of their father for Joseph his son.
translation:
  language: zh_hans
  text: 因此，为以色列子孙定下了条例：他们要在七月初十刻苦己身[a]，就是关于约瑟的消息传到他父亲雅各那里的那一天；他们也要在七月初十这一天用一只小山羊为自己赎罪，每年一次，为了他们的罪，因为他们伤害了父亲对他儿子约瑟的慈爱之情。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章把每年七月初十刻苦己身的礼仪，与约瑟那件染血的衣服及雅各的哀痛联系起来，以此说明赎罪日（Yom Kippur）这一礼仪的由来。
    reason: cross_reference
lexical_decisions:
- source_word: ይሕመሙ
  choice: 刻苦己身
  rationale: 该词表达使自己受苦、自我克制；“刻苦己身”既保留礼仪语境中的自我苦待含义，也符合现代中文圣经语体。
- source_word: ዜናሁ፡ ለዮሴፍ
  choice: 关于约瑟的消息
  rationale: 原文只说有关约瑟的消息，并未明说是他的死讯，故不补入“死了”。
- source_word: ያስተስርዩ
  choice: 为自己赎罪
  rationale: 在献祭语境中表达施行赎罪之礼；保留原文反身对象“为自己”。
- source_word: ጠሊ
  choice: 一只小山羊
  rationale: 该词指山羊羔或幼山羊；“小山羊”清楚自然，并保留献祭牲畜的具体类别。
- source_word: ምሕረቶ፡ ለአቡሆሙ
  choice: 父亲的心
  rationale: 原词可指怜爱、慈爱或柔情；结合“使……忧伤”的搭配，中文用“伤了父亲的心”自然传达他们伤害父亲对儿子的深厚感情，而不将其误解为抽象的神学术语“怜悯”。
theological_decisions:
- issue: 本节与赎罪日传统的关系
  choice: 正文仅按原文陈述七月初十刻苦己身并献羊赎罪，背景关联置于脚注
  alternative: 在正文直接称这一天为“赎罪日”
  rationale: 原文描述了后来与赎罪日相连的日期和礼仪，却未在本节直接使用“赎罪日”这一名称；不宜在正文补入。
- issue: 雅各所得消息的内容
  choice: 译作“关于约瑟的消息”
  alternative: 译作“约瑟已死的消息”
  rationale: 原文保留了消息内容的含混性，故不根据叙事背景补明为死讯。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“规定”对应礼仪制度的设立；“刻苦己身”“赎罪”保留经文礼仪语汇。末句用“伤了父亲的心”表达原文中父亲因儿子约瑟而受伤的慈爱之情，同时避免加入约瑟已经死亡等原文未明说的信息。
