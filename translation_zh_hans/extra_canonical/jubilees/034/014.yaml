  text: And his sons and his daughters rose up to comfort him, but he would not be comforted for his son.
translation:
  language: zh_hans
  text: 他的儿子们和女儿们都来安慰他，但他因自己的儿子不肯受安慰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉዱ፡ ወወለቱ
  choice: 他的儿子们和女儿
  rationale: 格阿兹语“ውሉዱ”表示复数“他的儿子们”，而“ወለቱ”按现存文本为单数“他的女儿”；因此不随英语咨询层译成复数“女儿们”。
- source_word: ይናዝዝዎ
  choice: 安慰他
  rationale: 该动词在此处表示安慰、劝慰，采用现代汉语中自然且庄重的表达。
- source_word: ኢተናዘዘ
  choice: 不肯受安慰
  rationale: 该否定形式表示他没有接受安慰；“不肯受安慰”既符合上下文，也保留其持续拒绝被安慰的意味。
- source_word: በእንተ፡ ወልዱ
  choice: 因自己的儿子
  rationale: 介词短语表示因着、为了他的儿子；用“因自己的儿子”准确表达雅各悲痛的缘由，并避免汉语中代词指向不明。
