lexical_decisions:
- source_word: ዐገትዎሙ
  choice: 包围了
  rationale: 按该动词在此处的敌对行动语境译为“包围”，并保留完成性。
- source_word: መራዕዮሙ
  choice: 他们的羊群
  rationale: 此词指牧养的群畜；结合叙事语境，以现代汉语自然表达译作“羊群”。
- source_word: ተማህጠኑ
  choice: 掳走了
  rationale: 表示被强行夺取；相较泛泛的“带走”，用“掳走”更能体现袭击中的劫掠意味。
- source_word: ደቂ አቡሁ ወደቂ ቤቱ
  choice: 他父亲所有的仆人和他自己家中的仆人
  rationale: 据校勘所反映的完整读法，保留两个并列群体，不将父亲的仆人与他本家的仆人合并。
- source_word: ሖረ ላዕሌሆሙ
  choice: 前去迎战他们
  rationale: 字面有“向他们而去／上到他们那里”之意；在武装出动的语境中译为“前去迎战他们”，自然且不额外断定战斗结果。
