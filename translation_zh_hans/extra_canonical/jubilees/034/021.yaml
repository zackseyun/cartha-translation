  yaml_path: translation/extra_canonical/jubilees/034/021.yaml
  text: The wife of Benjamin was Iyasaka. And Simeon regretted it and took a second wife from Mesopotamia[21], like his brothers.
translation:
  language: zh_hans
  text: 便雅悯的妻子是雅撒卡。西缅回心转意[a]，另娶了一位来自美索不达米亚的妻子，像他的弟兄们一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西缅后悔了”，也可理解为“西缅改变了主意”。原文动词基本含义是“转回”，此处指他随后像弟兄们一样，另娶了一位来自美索不达米亚的妻子。
    reason: alternative_reading
lexical_decisions:
- source_word: ኢያስካ
  choice: 雅撒卡
  rationale: 按吉兹语人名音译，保留其专名形式。
- source_word: ተመይጠ
  choice: 回心转意
  rationale: 该动词可表示转回、改变心意，也可在语境中理解为后悔；正文采用自然且不把含义限定为宗教性“悔改”的表达，并以脚注保留其他可能。
- source_word: ካልእተ
  choice: 又……一个
  rationale: 在妻子这一语境中表示另一个、第二个；如此译法自然表达西缅另娶一妻，而不强行凸显次序。
- source_word: ሜስጶ ጦምያ
  choice: 美索不达米亚
  rationale: 采用该古代地名在现代汉语中的通行译名。
- source_word: ከመ፡ አኅዊሁ
  choice: 像他的弟兄们一样
  rationale: 直接保留比较关系及复数“弟兄们”。
theological_decisions:
- issue: ተመይጠ 是否应译为宗教意义的“悔改”
  choice: 回心转意
  alternative: 后悔了；悔改了；转变了
  rationale: 原词语义有“转回／改变心意”的幅度，语境说明其结果是另娶美索不达米亚女子，但未必明确表达宗教性的悔改，因此避免过度神学化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名按原文音译；关键动词保留其“转回／改变心意／后悔”的语义张力，正文不使用可能带有较强宗教专义的“悔改”。
