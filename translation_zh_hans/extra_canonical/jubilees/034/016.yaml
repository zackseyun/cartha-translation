  text: And these three mournings came upon Israel in one month. And they buried Bilhah opposite Rachel's tomb, and they buried Dinah, his daughter, there.
translation:
  language: zh_hans
  text: 这三重哀痛在同一个月临到以色列。他们把辟拉葬在拉结的坟墓对面，又把他的女儿底拿也葬在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝንቱ፡ ሠለስቱ፡ ላህ
  choice: 这三重哀痛
  rationale: 依上下文指约瑟失踪、辟拉去世和底拿去世带给雅各的三重悲痛；用“哀痛”既表达哀伤，也避免误解为三场正式丧礼。
- source_word: በወርኀ፡ አሐዱ
  choice: 在同一个月
  rationale: 按字面保留“三重哀痛在一个月内临到”的时间集中性。
- source_word: አንጻረ፡ መቃብረ፡ ራሔል
  choice: 在拉结的坟墓对面
  rationale: አንጻረ 表示面对、相对或对面；译为“对面”保留明确的空间关系。
- source_word: ዳናሃኒ፡ ወለተ
  choice: 他的女儿底拿
  rationale: 将人名音译为通行圣经译名“底拿”，并把“女儿”与前文的以色列（雅各）相连。
theological_decisions:
- issue: “以色列”所指
  choice: 保留“以色列”
  alternative: 明确译作“雅各”
  rationale: 原文使用以色列这一名称；虽在叙事中指雅各本人，仍保留原称谓，不替作者消解名称转换。
- issue: 三重哀痛的具体所指
  choice: 正文不逐项解释
  alternative: 在正文补出约瑟、辟拉和底拿
  rationale: 原文仅说“三重哀痛”，具体对象可由上下文推知；不在正文加入原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；人名使用现代中文圣经中常见的译法。原文结构简洁，中文以两句呈现，保留事件次序及“也葬在那里”的照应。
