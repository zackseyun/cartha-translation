  text: And he mourned all that night, because at evening they had brought it to him, and he became fevered with grief for his death, and said, “A wild beast has devoured Joseph.” And all the people of his house mourned with him on that day, and they were grieving and mourning with him all that day.
translation:
  language: zh_hans
  text: 他哀哭了一整夜，因为傍晚他们把它带给了他。他因约瑟的死悲痛得发热，说：“有猛兽把约瑟吃了！”那一天，他全家的人都同他一起哀哭，终日与他一同悲痛哀伤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላሐዉ / ይላሐዉ
  choice: 哀哭
  rationale: 该词在本节反复描述雅各及其家人为约瑟举哀；译作“哀哭”既保留外在哭泣，也符合丧亲语境。
- source_word: አርዌ፡ ጸዋገ
  choice: 猛兽
  rationale: 该词组指野生凶兽；现代汉语用“猛兽”自然凝练，也传达造成死亡的危险性。
- source_word: በልዖ
  choice: 吃了
  rationale: 原词直指吞吃、吃掉；口语化但庄重的“吃了”保留雅各惊痛之下直截了当的判断。
- source_word: በላህ፡ ሞቶ
  choice: 因哀痛约瑟的死而发起热来
  rationale: 吉兹文在此将强烈哀痛与发热状态相连；如此翻译保留身体反应，而不把它弱化为纯粹的比喻。
theological_decisions:
- issue: 雅各所认定的死亡与实际情形之间的张力
  choice: 按原文保留雅各的断言：“有猛兽把约瑟吃了！”
  alternative: 补明“他以为”或说明约瑟其实未死
  rationale: 本节从雅各当时所知的角度叙述；不提前解释后续真相，可保留叙事反讽与人物认知的局限。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“整整一夜”“终日”自然呈现时间上的持续；将代词所指明译为“那件衣服”，承接上文染血的约瑟衣服，避免中文歧义。
