  text: six thousand men who carried weapons. And he killed them in the descent of Shechem, and pursued those who fled, and killed them with the edge of the sword, and he killed Ares and Taphu and Seragan.
translation:
  language: zh_hans
  text: 六千名携带武器的人。他在示剑的下坡处杀了他们，又追赶逃跑的人，用刀刃杀了他们；他还杀了阿雷斯、塔弗和塞拉甘。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እለ፡ ይጸውሩ፡ አበይፍተ
  choice: 携带武器的人
  rationale: 按短语的直接含义翻译；用现代汉语自然表达持械者，不额外限定武器种类。
- source_word: በውስተ፡ ጸአተ፡ ዘሴቄም
  choice: 在示剑的下坡处
  rationale: ጸአተ 的基本意象是出去、下行；在此地形语境中指下坡或下行处。“下坡处”比“平原”更贴近原词，也比抽象的“下降处”自然。
- source_word: በአፈ፡ ሰይፍ
  choice: 用刀刃
  rationale: 保留原文“刀剑之口/刃”的惯用表达所强调的锋刃意象，同时采用自然的现代汉语。
- source_word: ለአሬስ፡ ወለታፉ፡ ወለሴሬጋን
  choice: 阿雷斯、塔弗和塞拉甘
  rationale: 按吉兹语形式音译三个专名，不擅自将其等同于其他已知人物或地名。
