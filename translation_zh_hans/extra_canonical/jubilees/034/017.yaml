  text: And he mourned for Joseph one year and did not cease, for he said, “I will go down to the grave mourning for my son.”
translation:
  language: zh_hans
  text: 他为约瑟哀哭了一年，没有止息，因为他说：“我要为我儿子哀哭着下到坟墓去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይላሑ
  choice: 哀悼
  rationale: 该词在本段语境中指因约瑟之死而悲伤、举哀；“哀悼”自然且保留丧亲语境。
- source_word: ዓመተ፡ አሐደ
  choice: 一年
  rationale: 直译时间长度，表明雅各持续哀悼的时期。
- source_word: መቃብር
  choice: 坟墓
  rationale: 该词通常指墓穴或坟墓；原文此处没有必须译作专名式阴间的明确依据。
- source_word: እንዘ፡ ላላሑ
  choice: 哀悼着
  rationale: 保留伴随状态，表示他下到坟墓时仍在为儿子哀悼。
theological_decisions:
- issue: “下到坟墓”是否应解释为进入阴间
  choice: 按原文译为“下到坟墓里去”
  alternative: “下到阴间去”
  rationale: 埃塞俄比亚文本使用的是通常表示“坟墓”的词；不把其死后世界观进一步体系化，以免加入原文没有明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“哀悼—下到坟墓”的重复和强烈悲痛，不将其弱化为一般性的难过。
