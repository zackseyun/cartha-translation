  text: under the trees, and to seize their cattle. But Jacob, and Levi, and Judah, and Joseph were in the house with Isaac their father, because his spirit was grieved and they could not leave him.
translation:
  language: zh_hans
  text: 在树下，并夺取他们的牲畜。雅各、利未、犹大和约瑟同他们的父亲以撒在屋里，因为以撒心灵愁苦，他们不能离开他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንስሳሆሙ
  choice: 他们的牲畜
  rationale: 该词指属于他们的动物或家畜；结合夺取的语境，译作“牲畜”最自然。
- source_word: መንፈሱ
  choice: 以撒的灵
  rationale: 原文直指“他的灵”；补出明确的所指“以撒”，同时保留“灵”这一原文用语，不改译为纯心理性的“心情”。
- source_word: ኀዲጎተ
  choice: 离开他
  rationale: 表达撇下、离去之意；“离开他”符合现代汉语，也保留他们因以撒忧伤而不能走开的含义。
theological_decisions:
- issue: “灵忧伤”应理解为属灵状态还是一般内心悲痛
  choice: 保留为“以撒的灵忧伤”
  alternative: 译作“以撒心里悲痛”
  rationale: 原文明确使用“灵”，此处可能描述人的内在生命或情绪状态；直译可保留其语义张力，不把它限定为单纯心理感受。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文从上一句中间续接，因此保留开头“在树下，并……”，不擅自补足前文主语；后半句补出“以撒”以避免连续代词造成歧义。
