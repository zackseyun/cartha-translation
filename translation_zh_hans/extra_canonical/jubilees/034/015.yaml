  text: And on that day Bilhah heard that Joseph had perished, and while she was mourning for him she died in Qafratef[15], and Dinah his daughter also died after Joseph had perished.
translation:
  language: zh_hans
  text: 那一天，辟拉听说约瑟已经失踪了。她当时住在卡弗拉提夫[a]；她为他哀哭时死了。约瑟失踪以后，雅各的女儿底拿也死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卡弗拉提夫”这一地名的读音不确定，也可能是吉兹文抄传过程中讹变的地名。
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕለ
  choice: 失踪
  rationale: 该词可表示失落、不见或毁灭；上下文中约瑟其实仍然活着，而家人只知道他不见了，因此译作“失踪”既符合叙事情境，也避免把歧义强行确定为死亡。
- source_word: ትለሐዎ
  choice: 为他哀哭
  rationale: 保留原文持续哀悼的动作及其指向约瑟的含义，用现代汉语自然表达。
- source_word: ቀፍራቲፍ
  choice: 卡弗拉提夫
  rationale: 按吉兹文形式音译；此地名的读音和文本形态均不确定，故不作地点辨认。
- source_word: ዳኖኒ ወለቱ
  choice: 雅各的女儿底拿
  rationale: 原文直译近于“底拿，他的女儿”；为免现代汉语误以为底拿是约瑟的女儿，依上下文明确所指为雅各，同时不改变亲属关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；人名沿用常见中文圣经译名“辟拉、约瑟、雅各、底拿”。调整了地点短语在汉语句中的位置，使叙述清楚，但保留其与辟拉死亡事件的关联。
