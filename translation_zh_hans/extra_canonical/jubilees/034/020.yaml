base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/020.yaml
  text: And after Joseph was taken away, the sons of Jacob took wives. The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba, a Canaanite; and the name of Levi’s wife was Melka, from the daughters of Aram, from the seed of the sons of Terah; and the name of Judah’s wife was Bethasu’el, a Canaanite; and the name of Issachar’s wife was Hezaqa; and the name of Zebulun’s wife was Ni’aman; and the name of Dan’s wife was Egla; and the name of Naphtali’s wife was Rasu’a, from Mesopotamia; and the name of Gad’s wife was Maka; and the name of Asher’s wife was Ijona; and the name of Joseph’s wife was Asenath, an Egyptian; and the name of Benjamin’s wife was Iyasaka.
translation:
  language: zh_hans
  text: 约瑟被带走[a]以后，雅各的儿子们娶了妻。流便的妻子名叫亚达；西缅的妻子名叫阿迪巴，是迦南女子；利未的妻子名叫米勒迦，是亚兰的女子，出自他拉众子的后裔；犹大的妻子名叫比他苏勒，是迦南女子；以萨迦的妻子名叫希西卡；西布伦的妻子名叫尼阿曼；但的妻子名叫埃格拉；拿弗他利的妻子名叫拉苏阿，来自美索不达米亚；迦得的妻子名叫玛迦；亚设的妻子名叫伊约娜；约瑟的妻子名叫亚西纳，是埃及女子；便雅悯的妻子名叫伊雅萨卡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被带走”也可理解为“失去”或“消失”。
    reason: 保留原文动词在约瑟叙事语境中的真实语义幅度，避免把事件方式解释得过窄。
lexical_decisions:
- source_word: ተሐጕለ
  choice: 被带走
  rationale: 该动词在此可表达失去、消失或被带离；结合约瑟叙事，正文采用自然且不额外断定具体方式的“被带走”，并以脚注保留语义幅度。
- source_word: ነሥኡ፡ አንስትያ
  choice: 娶了妻
  rationale: 按现代汉语婚姻语境自然表达“取女子为妻”，同时保持原文陈述语气。
- source_word: እምአዋልደ፡ አራም
  choice: 是亚兰的女子
  rationale: 较直译地保留“亚兰的女儿们/女子之一”的族属或地域表达，不擅自细化为具体家系。
- source_word: እምዘርአ፡ ውሉደ፡ ታራን
  choice: 出自他拉众子的后裔
  rationale: 保留“种裔—众子—他拉”的谱系层次，以清楚的现代汉语呈现。
- source_word: እንተ፡ ሜስጶጦምያ
  choice: 来自美索不达米亚
  rationale: 采用现代通行地名，并将来源关系译得自然。
- source_word: ግብጻዊት
  choice: 是埃及人
  rationale: 原词为阴性族属称谓；汉语无需标示语法性别，以自然表语结构表达。
theological_decisions:
- issue: 约瑟离开家族的方式
  choice: 被带走
  alternative: 失踪了／被除掉
  rationale: 原词允许“失去、消失、被带离”等理解；正文不把它强化为死亡或主动离去，脚注提示其语义并非绝对单一。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；家族名单以分号分隔，避免重复句式造成晦涩。人名依古典语言形式音译；“亚西纳”等已有较通行的圣经汉语形式则沿用。
