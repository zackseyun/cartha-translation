  text: and an ordinance for a testimony forever. And Noah ordained them for himself as festivals for everlasting generations,
translation:
  language: zh_hans
  text: 并且是一项永远作为见证的条例。[a]挪亚为自己把它们定为节期，为永远的世代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并且是一项永远的见证条例。”
    reason: “条例”可理解为“为见证”而设，或理解为“见证条例”；两种译法均保留原文的“条例”及其永久性。
lexical_decisions:
- source_word: ሥርዓት
  choice: 条例
  rationale: 该词指规定、法令或礼仪制度；“条例”既保留规范性，也符合庄重的经文语体。
- source_word: ስምዕ
  choice: 见证
  rationale: 直译其“见证、证据”之义，并保留“作见证”与“作为见证”之间的句法张力。
- source_word: ሠርዓን
  choice: 把这些日子定为
  rationale: 动词有设立、规定之意；结合宾语附着的复数形式及下文“节期”，补出“这些日子”使现代汉语通顺，而不改变所指。
- source_word: በዓላት
  choice: 节期
  rationale: 指按时庆祝的节庆；“节期”较“节日”更能体现历法和礼仪安排。
- source_word: ለትውልድ፡ ዘለዓለም
  choice: 留给世世代代，直到永远
  rationale: 兼顾“世代”和永久持续性，避免生硬地译作“永远的世代”。
theological_decisions:
- issue: “条例”与“见证”的关系
  choice: 并作为永远作见证的条例
  alternative: 并有一条永远的见证条例
  rationale: 按源文名词结构保留“条例”及其见证用途，不把二者合并成一种固定的神学术语。
- issue: 挪亚设立节期的受益者或遵守者
  choice: 挪亚为自己把这些日子定为节期
  alternative: 挪亚给自己设立这些节期
  rationale: 明确保留源文“为自己”，不扩大为所有人或直接解释为神所颁布的普遍命令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“条例”“见证”“节期”“世世代代”保持经文语域；用“这些日子”承接上下文中所论的日期，使本节在现代汉语中完整自然。
