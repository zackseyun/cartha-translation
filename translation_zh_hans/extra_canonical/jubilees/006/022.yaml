  yaml_path: translation/extra_canonical/jubilees/006/022.yaml
  text: For this festival, as it is written and ordained concerning it, celebrate it. For I have written in the book of the first law what I wrote for you, that you should celebrate it at its appointed time, one day in the year. And I told you about its sacrifices, that they should be a memorial, and that the children of Israel should celebrate it in...
translation:
  language: zh_hans
  text: 至于这节期，你要照着关于它所记载、所规定的来守。[a]因为我已在先前的律法书中写明，就是我为你所写的：你要在它所定的时候守这节期，每年一天。我也告诉你这节期的祭物，使它们作为纪念，并使以色列子孙在……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节首词在传本中可能有讹误；一抄本作“因为”。若按此读法，首句可理解为：“因为这节期是照着关于它所记载、所规定的，你要守它。”
    reason: 说明格尔兹文本首词的校勘问题，并保留不强行定论的另一种句法理解。
  - marker: b
    text: 原文在本节末止于“在”，其后的宾语接下一节开头；这里不补入传本中没有的“世世代代”。
    reason: 提示节号造成的跨节断句，避免把省略号理解为原文残缺，或擅自补入无据内容。
lexical_decisions:
- source_word: ዛቲ፡ በዓል፡
  choice: 这节期
  rationale: 明确保留指示词“这”和名词“节期”，避免遗漏原文成分。
- source_word: ቍሩጽ፡
  choice: 所规定的
  rationale: 该词在此与“所记载的”并列，语境指对节期的确定或规定；译作“规定”比字面性的“镌刻”更符合现代汉语。
- source_word: መጽሐፈ፡ ሕግ፡ ዘቀዳሚ፡
  choice: 先前律法书
  rationale: 保留“律法书”及修饰语“先前/第一”的基本关系；此处采用较自然且不过度界定书卷身份的“先前律法书”。
- source_word: በበጊዜሃ፡
  choice: 按所定的日期
  rationale: 表达在其指定时间举行之意；结合年度节期语境，以“日期”呈现自然。
- source_word: ዕለተ፡ አሐተ፡ ለዓመት፡
  choice: 一年一天
  rationale: 紧贴原文“一日/一年”的简洁表达，不增添频率解释。
- source_word: ቍርባኖሂ፡
  choice: 这节期的祭物
  rationale: 其后缀回指节期；“祭物”可涵盖献祭相关供物，而不缩窄为某一种祭。
- source_word: ዝክራነ፡
  choice: 纪念
  rationale: 保留礼仪性“作为纪念”的含义，不进一步解释纪念对象。
- source_word: ደቂቀ፡ እስራኤል፡
  choice: 以色列子孙
  rationale: 采用庄重且现代读者熟悉的圣经语体，准确对应“以色列的儿女”。
- source_word: ውስተ፡
  choice: 在……
  rationale: 本节止于介词，宾语延续到下一节；保留未完结构并以省略号提示跨节衔接。
theological_decisions:
- issue: “使它们成为纪念”的指称
  choice: 保留复数“它们”，回指祭物
  alternative: 译为“使这节期成为纪念”
  rationale: 原文在提及祭物后使用复数形式，较自然地回指祭物；不把纪念功能擅自改归节期本身。
- issue: 末句是否补入“世世代代”
  choice: 不补入，并保留“在……”的断句
  alternative: 补为“世世代代守这节期”
  rationale: 现存本节格尔兹文本止于介词“在”，其宾语在下一节；“世世代代”在所给原文中没有依据。
- issue: 首词的文本问题
  choice: 按语境译出因果连接“因为”
  alternative: 不译首词，仅从“这节期”开始
  rationale: 所给校勘信息指出印本文首词可能讹误，而异本支持“因为/因为这节期……”；译文保留逻辑连接，同时用脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“守这节期”沿用汉语圣经中自然的礼仪表达；句末刻意保留跨节未完句。所有脚注标记均置于正文相应位置。
