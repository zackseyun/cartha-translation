  text: And he gave Noah and his sons a sign that there should never again be a flood upon the earth.
translation:
  language: zh_hans
  text: 他赐给挪亚和他的儿子们一个记号，表明地上再也不会有洪水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወሀቦ
  choice: 他赐给
  rationale: 该形式表达“并且他给了”；承接语境保留第三人称主语，用“赐给”体现所赐记号来自上帝，同时保持现代汉语自然。
- source_word: ለኖኅ፡ ወለደቂቁ
  choice: 挪亚和他的儿子们
  rationale: 分别对应“给挪亚”和“给他的儿子们”；“他的”按原文关系明确表达。
- source_word: ትእምርተ
  choice: 一个记号
  rationale: 对应“记号、标志”；此处指作为保证的可见标记，不扩展解释其具体所指。
- source_word: ከመ፡ ኢይኩን፡ ዳግመ
  choice: 表明……再也不会有
  rationale: ከመ引出记号所表达的内容；否定词与“再次”合起来译为“再也不会”，符合现代汉语。
- source_word: አይኅ፡ ዲበ፡ ምድር
  choice: 地上……洪水
  rationale: 直译为“地上的洪水”；调整语序为自然汉语，不添加“遍及全地”等原文未明说的限定。
theological_decisions:
- issue: 所赐记号的施予者
  choice: 保留“他”，不在正文中补作“上帝”
  alternative: 上帝赐给
  rationale: 原文使用第三人称单数动词形式；保留代词可忠实承接上文，避免在独立经节中擅自显明原文未重复的名词主语。
- issue: 记号与未来洪水之间的关系
  choice: 译作“表明……再也不会有”
  alternative: 作为……不再发生的保证
  rationale: 原文以ከመ引出内容或目的，关系略有弹性；“表明”既自然，又不把经文进一步解释为特定神学类别的“圣约保证”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保持单句结构和原文信息密度，不添加彩虹、圣约或洪水范围等本节未明说的内容。
