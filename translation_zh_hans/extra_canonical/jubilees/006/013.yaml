  yaml_path: translation/extra_canonical/jubilees/006/013.yaml
  text: And you, command the children of Israel not to eat any blood, so that their name and their seed may be before Yahweh our God always.
translation:
  language: zh_hans
  text: 你要吩咐以色列子孙，不可吃任何血，好使他们的名和后裔永远在雅威我们的上帝面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: 以色列子孙
  rationale: 直译为“以色列的儿女/子孙”，采用现代中文圣经语体中自然且庄重的表达。
- source_word: ኵሎ፡ ደመ
  choice: 任何血
  rationale: ኵሎ 与否定命令连用，表达“不可吃任何血”，比逐字译作“所有的血”更符合现代汉语。
- source_word: ስሞሙ፡ ወዘርኦሙ
  choice: 他们的名和后裔
  rationale: 保留“名”与“种子/后裔”两个并列概念；ዘር 在此按族系延续之义译为“后裔”。
- source_word: እግዚአብሔር፡ አምላክነ
  choice: 雅威我们的上帝
  rationale: 以“雅威”呈现神名，并保留“我们的上帝”这一关系性称谓及原文语序所体现的紧密联系。
- source_word: ኵሎ፡ መዋዕለ
  choice: 永远
  rationale: 字面为“所有日子”，在此表达持续不断、世世长存之意，现代汉语以“永远”最自然。
theological_decisions:
- issue: 禁食血与名字、后裔常在上帝面前之间的关系
  choice: 用“好使”保留目的或结果关系
  alternative: 译作“因此”或拆成两个独立陈述
  rationale: 原文 ከመ 可表达目的或结果；“好使”保留这种关联而不进一步说明其神学机制。
- issue: “他们的名”与“后裔”的集体含义
  choice: 保留原文的单数集合性“名”和后裔概念
  alternative: 改写为“他们和他们的后代”
  rationale: 不把“名”解释性消解为“他们本人”，从而保留原文有关名号、记念或存续的含义空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；句式简洁，保留原文命令、禁令及目的关系。
