  text: And there will be those who will assuredly make observations of the moon, for it corrupts the seasons.
translation:
  language: zh_hans
  text: 并且必有人会格外留意月亮，因为月亮会败坏时节。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውኑ
  choice: 并且必有人
  rationale: 保留句首连接词 ወ（“并且”），并以“必有人”自然表达未完成式所指向的将来情形。
- source_word: ያስተሐይጹ፡ ወርኀ፡ በሑያጼ
  choice: 执意观测月亮
  rationale: 该表达以同源词加强“观察、测算”之意；“执意观测”既避免生硬重复，也传达原文的强调语气，同时保留历法观测的语境。
- source_word: ታማስን
  choice: 败坏
  rationale: 该动词语气强于“扰乱”，可指败坏、损坏；此处译为“败坏”以保留原文对月历的强烈否定。
- source_word: ጊዜያተ
  choice: 时节
  rationale: 该复数词可指时间、季节或规定的时期；“时节”在历法语境中自然，并保留一定语义宽度。
theological_decisions:
- issue: 月亮与时节之间的因果关系
  choice: 因为月亮会败坏时节
  alternative: 因为它会扰乱时节
  rationale: 原文以 እስመ 明示原因，且 ታማስን 的力度更接近“败坏”而非较弱的“扰乱”；明确重复“月亮”可避免汉语中代词指向不清，但不进一步解释其历法神学含义。
translation_notes:
  register: 采用庄重而易懂的现代书面汉语。“执意”承载同源结构的强调效果；“时节”兼顾普通读者可读性与古代历法语境。
