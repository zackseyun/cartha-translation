  text: for their generations in this month, one day every year. And on the new moon of the first month, and on the new moon of the fourth month, and on the new moon of the seventh month, and on the new moon of the tenth month are the days of remembrance, and they are the days of the seasons in the four divisions of the year; they are written.
translation:
  language: zh_hans
  text: 他们要世世代代在这个月每年守一日。第一、第四、第七和第十个月的月朔，都是纪念的日子，也是年度四个分期的时节日子；这些日子都已有记载。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትዝምዶሙ
  choice: 他们世世代代
  rationale: 依上下文及校勘判断，此词很可能对应“他们的世代”，并承接上一节；译文保留其跨世代延续之意。
- source_word: በዝ፡ ወርኅ፡ ዕለተ፡ አሐተ፡ ለለአሐዱ፡ ዓመት
  choice: 在这个月每年守一天
  rationale: 直译核心为“在这个月，每年一天”；补出中文所需的“守”，表达遵守该日的语境，不增加具体礼仪内容。
- source_word: ሠርቀ፡ ወርኅ
  choice: 月朔
  rationale: 该短语指月亮初现、月份开始，即新月之日；“月朔”简洁而准确，也适合历法语境。
- source_word: ዕለታት፡ ተዝካር
  choice: 纪念的日子
  rationale: 保留“记念、纪念”这一明确功能，不将其限定为某种特定宗教仪式。
- source_word: ዕለታት፡ ጊዜ
  choice: 时日
  rationale: 原文可直指“时期／时节的日子”；“时日”保留其历法标志作用，并避免过度解释。
- source_word: አርባዕቱ፡ መክፈላት፡ ዓመት
  choice: 划分一年四季
  rationale: 原文直义为“一年的四个分段”；此处用现代汉语自然表达其把一年划为四期的功能。
- source_word: ጽሑፋት፡ እማንቱ
  choice: 这些都已有记载
  rationale: 忠实表达“它们是写下来的／有文字记载的”，不加入早期英译曾出现而原文没有的“规定”。
theological_decisions:
- issue: 四个日期的性质
  choice: 译为既是“纪念的日子”，也是划分一年的“时日”
  alternative: 解释为具有特定宗派意义的节期或圣日
  rationale: 原文只陈述纪念和历法分期功能，未说明更具体的礼仪或神学制度，因此不作扩充。
- issue: 末句是否包含“命定”之意
  choice: 仅译“已有记载”
  alternative: 译作“已有记载并被命定”
  rationale: 吉兹语现存文本只出现“写下／记载”，没有与“命定”对应的词，故不采用增译。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“月朔”具有历法色彩，但仍是现代读者可据语境理解的常用书面词。首句按承接上一节的未完句意处理为完整汉语句子；末句以分号连接，反映原文与前述历法日期的紧密关系。
