base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/011.yaml
  text: Therefore I have said that you also shall make a covenant with the children of Israel in this month on the mountain, with an oath; and you shall sprinkle blood on them because of all the words of the covenant that God made with them for all days.
translation:
  language: zh_hans
  text: 因此我说：你也要在这个月、在山上，与以色列子孙立约，以誓言为证；又要因为上帝与他们所立、直到永远的约的一切话，把血洒在他们身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትካየድ፡ ኪዳነ
  choice: 立约
  rationale: 该结构表达缔结、确立盟约；现代汉语以“立约”最自然，也保留经文庄重语体。
- source_word: ደቂቀ፡ እስራኤል
  choice: 以色列子孙
  rationale: 按字面保留亲属后裔意象，同时是普通读者熟悉的圣经表达。
- source_word: ማሕላ
  choice: 誓言
  rationale: 对应起誓或誓词；译作“以誓言为证”清楚表达立约所伴随的宣誓。
- source_word: ደመ
  choice: 血
  rationale: 原文仅作“血”，不补出祭牲等来源，以免超出文本证据。
- source_word: እግዚአብሔር
  choice: 上帝
  rationale: 此处采用神的通称“上帝”，不处理为专名“耶和华”，与该词在本句中的一般神称用法相符。
- source_word: ለኵሉ፡ መዋዕል
  choice: 世世代代长存
  rationale: 字面为“所有的日子”；在盟约延续语境中，此译自然表达永久有效之意，而非仅指若干具体日子。
theological_decisions:
- issue: 血洒在谁身上
  choice: 洒在他们身上
  alternative: 洒向他们／洒在百姓身上
  rationale: 保留原文代词及施洒对象，不将其解释为洒在祭坛、约书或其他物件上。
- issue: “一切话”与洒血之间的关系
  choice: 因为……一切话
  alternative: 关于……一切条款／按照……一切话
  rationale: 原文介词短语的逻辑关系略显紧密而可有解释空间，正文保留“因为”所呈现的因由关系，不将“一切话”改释为法律条款。
- issue: 永久性修饰范围
  choice: 另成分句“这约世世代代长存”
  alternative: 上帝为永远与他们所立的约
  rationale: 原文末尾“所有的日子”可与立约行为或盟约持续性相连；汉译以独立分句避免误解其仅修饰“话”，同时忠实呈现盟约恒久的语义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因此，我说”保留叙述者承接上文的语气；句中重复“在这个月，在山上”维持原文时地次序。未加入原文没有的祭礼对象或血的来源。
