  naturalness: “因此，我说”及主要用语庄重自然；但末半句在“因为”之后未完成谓语结构，分号后的“这约”虽可理解，却使全句不够连贯。将该修饰语置回“上帝与他们所立的约”内，可使现代汉语完整通顺。
  terminology: “以色列子孙”“立约”“誓言”“血”“上帝”均可接受，并与所给英语审校轨迹相称。为避免把“所有日子”的持续性另行断言为独立命题，采用“直到永远的约”来保留其与盟约的关联。
