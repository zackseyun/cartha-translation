base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/012.yaml
  text: 'And this testimony is written concerning you so that you may keep it always: that you must not eat any blood of beasts or birds or cattle during all the days of the earth. And the man who eats the blood of beast or cattle or birds during all the days of the earth—he and his seed shall be rooted out from the earth.'
translation:
  language: zh_hans
  text: 这证言是关于你们写下的，好使你们永远遵守：在世上一切的日子里，不可吃野兽、飞鸟或牲畜的任何血。在世上一切的日子里，凡吃野兽、牲畜或飞鸟之血的人，他和他的后裔都必从地上被剪除。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: 证言
  rationale: 此处指写下并约束后世的见证或训令；“证言”既保留法律与盟约色彩，也符合现代中文表达。
- source_word: ትዕቀብዋ
  choice: 遵守
  rationale: 该动词在此不是单纯保存文字，而是谨守其中的规定。
- source_word: አራዊት፡ ወአዕዋፍ፡ ወእንስሳ
  choice: 走兽、飞鸟或牲畜
  rationale: 分别表达野兽、鸟类与家畜的类别，并保留原文列举结构。
- source_word: ደም
  choice: 血
  rationale: 直接保留禁食血的具体对象，不作象征化解释。
- source_word: ይስሮ
  choice: 被除灭
  rationale: 该词表达从地上断绝、拔除；“被除灭”保留严厉的审判语气，同时避免擅自限定具体执行方式。
- source_word: ዘርኡ
  choice: 他的后裔
  rationale: 原义为其种或后代；在人类语境中译作“后裔”自然且准确。
theological_decisions:
- issue: 禁食血命令的持续范围
  choice: 译作“在世上一切的日子里”
  alternative: 译作“永远”或“只在某一盟约时期”
  rationale: 原文反复使用表示“大地一切日子”的措辞，译文保留其表面上的普遍和持续效力，不代替文本处理其与后世律法或盟约的关系。
- issue: “他和他的后裔”所受后果的性质
  choice: 保留为“都必从地上被除灭”
  alternative: 解释为处死、绝后、逐出群体或末世审判
  rationale: 源文没有在本节明确说明除灭的机制，故保留其神学张力与语义宽度。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语；保留原文两句结构、类别列举、时间范围的重复，以及“他和他的后裔”这一严厉而未加解释的判语。
