revisions:
- from: 因此，必有这样的年日临到他们：他们扰乱秩序，把作见证的日子变为可憎的日子[a]，把不洁净的日子当作节期；他们把一切圣日与不洁净的日子混在一起，把不洁净的日子与圣日混在一起。因为他们在月份、安息日、节期和禧年的计算上都出了差错。
  to: 因此，将有年岁临到他们：他们扰乱秩序，把作见证的日子变为可憎的日子[a]，把不洁净的日子当作节期；他们把一切圣日与不洁净的日子混淆，又把不洁净的日子与圣日混淆。因为他们在月份、安息日、节期和禧年上都出了差错。
  rationale: 修正“年日”以忠实呈现原文的“年岁／年份”，并删除“计算上”这一虽合理但超出原文明确表述的限定。其余措辞、脚注锚点及脚注所保留的替代句法方向均可维持。
