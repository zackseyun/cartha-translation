base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/037.yaml
  text: Therefore years will come upon them when they disturb the order, and they will make a day of testimony an abominable day, and an unclean day a festival day, and they will mix up all the holy days with the unclean, and the unclean day with the holy; for they will go wrong as to months and sabbaths and festivals and jubilees.
translation:
  language: zh_hans
  text: 因此，将有年岁临到他们：他们扰乱秩序，把作见证的日子变为可憎的日子[a]，把不洁净的日子当作节期；他们把一切圣日与不洁净的日子混淆，又把不洁净的日子与圣日混淆。因为他们在月份、安息日、节期和禧年上都出了差错。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把可憎的日子变为作见证的日子。”
    reason: 保留早期译法所反映的句法歧义；正文按格尔兹文句法及与下句的对照关系，译为将“作见证的日子”贬为“可憎的日子”。
lexical_decisions:
- source_word: ያማስኑ
  choice: 扰乱秩序
  rationale: 该动词在上下文中指搅乱、破坏历法安排；补出“秩序”使现代汉语自然，并与后文圣俗日期混淆相衔接。
- source_word: ዕለተ፡ ስምዐ
  choice: 作见证的日子
  rationale: 保留“日子”与“见证”的构词关系，不把所指具体化为某一节日。
- source_word: ምግንተ
  choice: 可憎的日子
  rationale: 表达可厌、可憎之义，并与随后“不洁净的日子”构成平行。
- source_word: ዕለተ፡ ርኵስተ
  choice: 不洁净的日子
  rationale: 以礼仪语境中常见的“洁净／不洁净”对应圣俗日期的对照。
- source_word: በዓለ
  choice: 节期
  rationale: 在历法语境中指庆典或节日；“节期”兼顾宗教历法色彩与现代可读性。
- source_word: አውራኀ
  choice: 月份
  rationale: 按本节历法语境取复数“月份”，而非泛指月亮。
- source_word: ሰንበታት
  choice: 安息日
  rationale: 采用现代中文圣经传统中通行且清楚的对应词。
- source_word: ኢዮቤል
  choice: 禧年
  rationale: 采用表示 jubilee 周期的通行译名，并保留复数整体概念。
theological_decisions:
- issue: “作见证的日子”与“可憎的日子”的句法方向
  choice: 把作见证的日子变为可憎的日子
  alternative: 把可憎的日子变为作见证的日子
  rationale: 依格尔兹文词序及句法判断，ዕለተ፡ ስምዐ 是直接宾语，ምግንተ 是宾语补足成分；这也与下一分句把不洁净之日抬为节期形成反向对照。
- issue: 历法错误的性质
  choice: 在月份、安息日、节期和禧年的计算上都出了差错
  alternative: 在月份、安息日、节期和禧年方面走错了
  rationale: 上下文谈论历法秩序，“计算上”使汉语读者明白错误涉及日期判定，同时不引入特定历法体系或宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必有这样的年日临到他们”保留预告性的语气；重复“混在一起”以再现原文对圣日与不洁净之日双向混淆的强调。正文脚注标记与脚注条目一致。
