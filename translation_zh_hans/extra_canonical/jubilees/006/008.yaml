  text: Whoever sheds the blood of a man, by a man shall his blood be shed; for in the likeness of God he made man.
translation:
  language: zh_hans
  text: 凡流人血的，他的血也必被人所流，因为上帝照自己的形象造了人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚当”。
    reason: 原文“ለአዳም”既可对应泛指的“人”，形式上也可理解为专名“亚当”；正文依上下文及《创世记》9:6的引文背景采用泛指。
lexical_decisions:
- source_word: ዘይከዑ፡ ደመ፡ ሰብእ
  choice: 凡流人血的
  rationale: 按原文结构直译为泛指条件句，并自然承接《创世记》9:6的措辞。
- source_word: በሰብእ፡ ደሙ፡ ይትከዐው
  choice: 他的血也必被人所流
  rationale: 保留介词短语“被人”和被动式“必被流”的对应关系，不额外明确执行者的制度身份。
- source_word: በምስለ፡ እግዚአብሔር
  choice: 照上帝的形像
  rationale: “形像”准确传达 likeness/image 的观念，并采用现代中文圣经语体中通行而庄重的表达。
- source_word: ለአዳም
  choice: 人
  rationale: 此处反映泛指的人/人类，与前半句“人血”呼应；译作专名“亚当”会缩窄本句关于人按上帝形像受造的普遍根据。
theological_decisions:
- issue: 流人血者之血由谁所流
  choice: 保留“被人所流”
  alternative: 译为“谁流人的血，人也必流他的血”
  rationale: 原文表达可被理解为报应或司法原则，但未具体说明执行者；被动措辞避免擅自加入国家、亲属复仇者或其他制度性解释。
- issue: 造人者的主语
  choice: 译为“上帝……造了人”
  alternative: 形式上译作“他照上帝的形像造了人”
  rationale: 原文动词为阳性单数，近似其所引《创世记》9:6的语义；中文若仅用“他”容易产生指代歧义，明示“上帝”能自然传达原意而不改变神学内容。
- issue: אדם/ለአዳም 的泛指与专名可能性
  choice: 正文译“人”
  alternative: 译“亚当”
  rationale: 上下文及《创世记》9:6的引文背景支持泛指“人/人类”，但词形也可对应专名，故以脚注保留另一可能。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语；以“凡……的”表达普遍原则，以“必被人所流”保留原文的被动结构和解释空间。脚注标记置于与“人”相关的句末。
