base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/031.yaml
  text: 'And you, command the children of Israel to keep the years according to this reckoning: three hundred and sixty-four days, and it will be a complete year. And it will not disturb its time from its days or from its feasts, for everything will come in them according to their testimony, and they will not omit a day nor disturb a feast.'
translation:
  language: zh_hans
  text: 至于你，要吩咐以色列子孙按此计算守年：一年三百六十四天，这就成为完整的一年。这一年的时序不会偏离它的日子或节期；因为一切都会照着它们的见证[a]，在其中临到。他们不会漏掉一天，也不会扰乱一个节期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们”可能指前文的日子和节期；“见证”也可能含有它们所指示或规定之意。原文的代词所指和关系较为凝练。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: ወእንተኒ
  choice: 至于你
  rationale: 保留独立代词对受命者的强调，比单纯译作“你要”更能体现原文语气。
- source_word: ኍልቍ
  choice: 算法
  rationale: 此处指据以计算一年日数的计数方式；“算法”在现代汉语中自然，也符合上下文。
- source_word: ፍጹመ፡ ዓመተ
  choice: 完整的一年
  rationale: 直接表达“完整、完足的一年”，不额外引入历法解释。
- source_word: ኢያማስን / ኢያማስኑ
  choice: 不会使……偏离 / 不会扰乱
  rationale: 前一动词为阳性单数，所指是这一年或这种年数安排；末一动词为复数，主语是以色列子孙。汉语分别处理，以保存数的对比及语义。
- source_word: ስምዖሙ
  choice: 它们的见证
  rationale: 保留原文较为凝练且可能具有历法规定意味的“见证”，不擅自改译为“规定”或“次序”。
- source_word: የኀልፉ፡ ዕለተ
  choice: 漏掉一天
  rationale: 在历法语境中表示不越过或遗漏任何一日；“漏掉”是自然且准确的现代汉语。
theological_decisions:
- issue: 三百六十四日历法的规范性
  choice: 按原文陈述其为“完整的一年”，不添加解释或评判
  alternative: 将其解释为特定宗派或群体永久有效的神圣历法
  rationale: 本节本身强调该算法，却未要求译者界定其跨时代的神学效力；译文应保存经文主张而不导入后世立场。
- issue: “它们的见证”的含义
  choice: 保留“见证”并以脚注提示所指关系存在含混
  alternative: 明确改写为“按日子和节期所规定的日期”
  rationale: 原文表达具有一定歧义，直接释义会过早消除其张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“守年”保留历法遵守的意味；以“如期来到”使“来到”在汉语中通顺，但不把原文具体化为某一后世历法体系。
