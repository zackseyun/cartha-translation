revisions:
- from: 至于你，要吩咐以色列子孙照这个算法守年：三百六十四天为一年，这样就是完整的一年。它不会使一年的时序偏离其日子或节期；因为一切都必在这些日子中，照它们的见证[a]如期来到。他们不会漏掉一天，也不会扰乱一个节期。
  to: 至于你，要吩咐以色列子孙按此计算守年：一年三百六十四天，这就成为完整的一年。这一年的时序不会偏离它的日子或节期；因为一切都会照着它们的见证[a]，在其中临到。他们不会漏掉一天，也不会扰乱一个节期。
  rationale: 修订避免把前一单数动词译成使役式，改善历法术语的现代汉语自然度，并将“照着它们的见证，在其中临到”调整为较贴近原文的结构。脚注锚点仍附于“见证”，保留代词所指及“见证”含义的歧义。
