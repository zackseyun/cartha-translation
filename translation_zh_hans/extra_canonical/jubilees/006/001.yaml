  yaml_path: translation/extra_canonical/jubilees/006/001.yaml
  text: And on the new moon of the third month he came out of the ark, and he built an altar on that mountain. And he made atonement for the earth, and he took a young goat and made atonement with its blood for all the guilt of the earth, because everything that had been on it had been destroyed, except those that were in the ark with Noah.
translation:
  language: zh_hans
  text: 三月新月之日，挪亚出了方舟，在那座山上筑了一座祭坛。他为大地行赎罪礼，又取了一只小山羊，用它的血为大地的一切罪过赎罪；因为大地上原有的一切都已被除灭，只有与挪亚一同在方舟里的那些人除外。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ሠርቁ፡ ለወርኅ፡ ሣልስ
  choice: 三月初一
  rationale: 字面涉及第三个月的月朔，即新月之日；按现代汉语历日习惯译作“三月初一”，清楚自然。
- source_word: ታቦት
  choice: 方舟
  rationale: 此处指挪亚洪水叙事中的舟，沿用现代中文圣经语境中通行且明确的“方舟”。
- source_word: ምሥዋዐ
  choice: 祭坛
  rationale: 指献祭用的坛，译作“祭坛”准确而自然。
- source_word: አስተስረየ
  choice: 行赎罪礼／赎罪
  rationale: 该动词表达施行遮罪、赎罪或洁净的仪式行为；首处补出“礼”以使汉语顺畅，次处简作“赎罪”。
- source_word: መሐስአ፡ ጠሊ
  choice: 一只山羊羔
  rationale: 该词组指幼小的山羊；译作“山羊羔”保留牲畜种类和幼龄含义。
- source_word: አበሳ፡ ምድር
  choice: 大地的一切罪过
  rationale: 保留“大地”被赋予罪责或污秽这一不寻常的原文表达，不改释为仅属人类的罪。
- source_word: ተደምሰሰ
  choice: 被除灭
  rationale: 表达洪水中彻底毁灭、抹去之意；“除灭”兼具庄重感与叙事力度。
theological_decisions:
- issue: 为大地赎罪的表述
  choice: 保留“为大地……赎罪”
  alternative: 解释为“为地上众生的罪赎罪”或“洁净大地”
  rationale: 原文直接以大地为赎罪行为的对象，并提到“大地的一切罪过”；译文不把这种拟人化和祭仪张力化解掉。
- issue: 施行赎罪者的身份
  choice: 在开头明说“挪亚”，后文用“他”
  alternative: 全节只用“他”
  rationale: 本节原文以第三人称代词承接上下文；独立呈现时补出挪亚可避免指代不明，但不改变叙事主体。
- issue: 方舟中存留者的结局
  choice: 译为“得以存留”
  alternative: 直译为“存在／在方舟里”
  rationale: 原句结构是“除了那些与挪亚在方舟里的”；结合前面的“被除灭”，用“得以存留”自然呈现隐含对比而不增加救恩教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。句式尽量贴近吉兹语的事件顺序，同时避免生硬逐词对应；祭仪术语保留“赎罪”，不以特定宗派的献祭理论加以扩释。
