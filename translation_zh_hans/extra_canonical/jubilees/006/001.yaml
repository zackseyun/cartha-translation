  terminology: “方舟”“祭坛”“赎罪”“大地”等术语选择恰当。“为大地的一切罪过赎罪”保留了原文将罪过归于大地的非常规表达，不应解释性改写为人类的罪。“小山羊”对应幼山羊献祭牲畜，避免“山羊羔”在现代用语中略显不够稳妥的复合称法。
