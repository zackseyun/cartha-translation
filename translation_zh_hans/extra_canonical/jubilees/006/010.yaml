  yaml_path: translation/extra_canonical/jubilees/006/010.yaml
  text: And Noah and his sons swore that they would not eat any blood that is in any flesh, and he established a covenant before the Lord God forever throughout all the generations of the earth in this month.
translation:
  language: zh_hans
  text: 挪亚和他的儿子们起誓，不吃一切肉中所含的血；并且在这个月，在主上帝面前立了永约，直到地上的历代。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐኩ
  choice: 起誓
  rationale: 该词在此表示郑重宣誓；以“起誓”准确传达其法律与盟约语境。
- source_word: ኢይብልዑ
  choice: 不吃
  rationale: 直译否定式“他们不可／不会吃”；在起誓内容中用“不吃”自然简洁。
- source_word: ኵሎ ደመ ዘበኵሉ ሥጋ
  choice: 任何血，就是一切肉中的血
  rationale: 保留原文“所有血”与“在一切肉中”的范围表达，并用“就是”使现代汉语关系清楚。
- source_word: ተካየደ ኪዳነ
  choice: 立约
  rationale: 这是汉语中表达订立、确立盟约的正式而自然的固定说法。
- source_word: እግዚአብሔር አምላክ
  choice: 主上帝
  rationale: 按词义译出“主、上帝”，不将其误作源文未出现的神名。
- source_word: ለዓለም በኵሉ ትውልደ ምድር
  choice: 使这约世世代代永远存留于地上
  rationale: 兼顾“永远”“地上的各代”诸要素，采用自然中文表达其持续效力。
- source_word: በዝንቱ ወርኅ
  choice: 在这个月
  rationale: 直接保留原文时间指示，不擅自补出具体月份。
theological_decisions:
- issue: 盟约的主语
  choice: 译作“他又……立约”，以挪亚为单数主语
  alternative: 译作“他们又……立约”，以挪亚和众子为共同主语
  rationale: 源文动词“ተካየደ”为单数形式，较自然地回指挪亚；同时保留前句挪亚与儿子们共同起誓的复数主语。
- issue: 盟约永久性的所指
  choice: 明确为“使这约……永远存留”
  alternative: 将“永远”直接连接“立约”而不说明修饰关系
  rationale: 原文中“永远、地上各代”表达盟约持续有效；中文适度补出“这约”和“存留”可避免误读，但不增加新的神学内容。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。分号区分共同起誓与挪亚立约两个动作；末句单列时间信息，以避免“在这个月”误修饰“地上的世世代代”。
