revisions:
- from: 挪亚和他的儿子们起誓，不吃任何血，就是一切肉中的血；他又在主上帝面前立约，使这约世世代代永远存留于地上。这事是在这个月发生的。
  to: 挪亚和他的儿子们起誓，不吃一切肉中所含的血；并且在这个月，在主上帝面前立了永约，直到地上的历代。
  rationale: 修订保留禁食血的全面范围，并将“在这个月”置回立约行为中。以省略主语的“立了永约”避免将源文中盟约设立的施事过度限定为挪亚，同时以“直到地上的历代”对应永远持续于地上各代的范围。
