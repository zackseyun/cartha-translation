base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/034.yaml
  text: For I know, and from now on I will make it known to you—not from my own heart, for the book is written before me, and it is ordained on the heavenly tablets—the divisions of the days, lest they forget the festivals of the covenant and walk according to the festivals of the nations, after their error and after their ignorance.
translation:
  language: zh_hans
  text: 因为我知道，并且从今以后，我要使你知道：这并非出于我自己的心意；因为书卷写在我面前，日子的划分[a]也已定在天上的石版上，免得他们忘记盟约的节期，随从列国的节期，跟随他们的错误和无知而行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“时期的划分”。
    reason: መዋዕል 通常指“日子”，但在历法语境中也可较宽泛地理解为“时期”；正文依原义及本书语境采用“日子”。
lexical_decisions:
- source_word: መዋዕል
  choice: 日子
  rationale: 该词直译为“日子”；本段涉及历法与节期的准确计算，保留“日子”比泛化为“时期”更切合原文和上下文。
- source_word: ክፋሌሁ ለመዋዕል
  choice: 日子的划分
  rationale: 保留原文的历法表达及其可能略显技术性的含义，不将其解释性改写为某种具体历制。
- source_word: በዓላተ ኪዳን
  choice: 盟约的节期
  rationale: “节期”自然表达宗教历法中规定的庆典日期；“盟约”准确保留 ኪዳን 的神学与契约含义。
- source_word: ጽላተ ሰማይ
  choice: 天上的版
  rationale: 保留原文“版、板”的具体意象，不解释为抽象的天上记录。
- source_word: እምልብየ
  choice: 出于我自己的心意
  rationale: 原文直指“从我的心”；现代汉语用“出于自己的心意”表达并非自行构想，同时保留其内在来源之意。
theological_decisions:
- issue: 启示的来源
  choice: “这并非出于我自己的心意；因为有一卷书写在我面前”
  alternative: “这不是我心里想出来的”
  rationale: 前者既自然，又保留启示并非来自说话者自身、而来自既有天上记录的张力，不加入关于默示机制的教派性解释。
- issue: 天上版所规定的内容
  choice: 将“日子的划分”理解为“已定在天上的版上”的主语
  alternative: 将“有一卷书写在我面前”和“已定在天上的版上”都笼统修饰整卷书
  rationale: 原文语序在“天上的版”后紧接“日子的划分”，英语审定层也以破折号突出该内容；译文保持这一关联，同时不作超出原文的历法说明。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“使你知道”略具原文色彩，但在此启示宣告语境中仍自然；末句以“跟着他们的谬误和无知而行”保留原文两个并列的原因或路径表达。
