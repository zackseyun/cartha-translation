    rationale: 原文 ጽላተ 为“版、石版”的复数，英语审定层亦作 heavenly tablets。改为“天上的石版上”既保留具体意象，也使汉语自然。
  - severity: low
    issue: “有一卷书写在我面前”可能误读为正在进行的书写动作。
    rationale: “书卷写在我面前”更贴近“书卷已经写成并在我面前”的表达，不改变原文的时间或启示来源。
