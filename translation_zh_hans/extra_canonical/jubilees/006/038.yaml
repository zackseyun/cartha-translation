  yaml_path: translation/extra_canonical/jubilees/006/038.yaml
  text: Therefore I command you and testify to you, so that you may testify to them; for after your death your children will corrupt it, so that they will not make the year three hundred and sixty-four days only. Therefore they will go wrong concerning the new moons and seasons and sabbaths and festivals, and they will eat all the blood with all flesh.
translation:
  language: zh_hans
  text: 因此，我吩咐你，也向你作证，好让你向他们作证；因为你死后，你的子孙必败坏这规定，不把一年定为只有三百六十四天。因此，他们必在新月、时节、安息日和节期上出错；他们要连同一切肉吃一切血。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句直译为“他们要吃一切血，连同一切肉”。“连同”所表达的血与肉的关系在原文中较为凝缩；禁食血的语境可使人理解为食用带血的肉，但正文保留原文的表述。
    reason: 保留末句句法关系的歧义，避免将其完全解释为“带血的肉”。
lexical_decisions:
- source_word: አስምዕ / ታስምዕ
  choice: 向……作证
  rationale: 该使役词在此带有郑重告诫、见证的意味；保留重复结构及盟约式语气，不弱化为一般的“告知”。
- source_word: ያማስኑ
  choice: 败坏这规定
  rationale: 动词表示败坏、破坏；宾语在上下文中指一年历法的规定，中文补出“这规定”以使指代清楚。
- source_word: ባሕቲተከ
  choice: 整整
  rationale: 该词在数字之后有限定“仅仅、恰好”的作用；“整整三百六十四天”自然表达准确天数。
- source_word: ሠርቀ
  choice: 朔日
  rationale: 该词可指月亮升起、新月或朔日；历法语境中译“朔日”，同时不把它解释成特定后世制度。
- source_word: ጊዜ
  choice: 节期
  rationale: 本义为时候、时节；与安息日和节庆并列，译作“节期”体现历法中的规定时日。
- source_word: ኵሎ፡ ደመ፡ ምስለ፡ ኵሉ፡ ሥጋ
  choice: 一切带血的肉
  rationale: 原文直译近于“一切血与一切肉”；依饮食禁令语境表达为“带血的肉”，并以脚注保留形式上的歧义。
theological_decisions:
- issue: “作证”是否仅表示“告知”
  choice: 保留“向你作证／向他们作证”
  alternative: “使你知道／使他们知道”
  rationale: 原文重复同一词根，且语境是天使郑重嘱咐挪亚传达历法诫命；“作证”保留其郑重和见证性质，不将其降格为普通信息传递。
- issue: 历法偏差的具体性质
  choice: 译为“在……的日期上出错”
  alternative: 仅译“在……方面出错”
  rationale: 上下文把错误归因于一年日数的改变，涉及这些日子的推算；补出“日期上”是语境性明示，但不进一步指定某一历法体系。
- issue: 末句的血与肉关系
  choice: 正文译“一切带血的肉”，脚注保留直译
  alternative: “吃一切血和一切肉”
  rationale: 禁食血的语境支持“带血的肉”，但原文结构可以更直译地理解，故以脚注保存歧义。
translation_notes:
  register: 采用庄重而清晰的现代书面汉语；保留“吩咐—作证—作证”的郑重重复。数字写为“三百六十四”，历法术语用普通读者可理解的“朔日、节期、安息日和节庆”。
