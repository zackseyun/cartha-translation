revisions:
- from: 他把脂肪献在祭坛上，又取来一头公牛、一只公绵羊、一只羊、几只山羊羔、盐、一只斑鸠和一只雏鸽，在祭坛上献为燔祭。他又把调了油的素祭放在这些祭物上，洒上酒，并在所有祭物上放了香，使馨香上升，在主面前蒙悦纳。
  to: 他把脂肪放在祭坛上，又取来一头公牛、一只公绵羊、一只羊、几只山羊羔、盐、一只斑鸠和一只雏鸽，在祭坛上献为燔祭。他又把用油调和的供物放在这些祭物上，洒上酒，并在所有祭物上放了香，使馨香上升，在主面前蒙悦纳。
  rationale: 修订仅消除两处超出原文明确范围的限定：以“放在”对应脂肪被升上／置上祭坛的动作，并以“供物”保留油调祭物的类别歧义。其余译文忠实保留牲畜及盐、鸟类的次序，保留“洒酒”这一源语动词的具体含义，也未将“主”替换为神名。
