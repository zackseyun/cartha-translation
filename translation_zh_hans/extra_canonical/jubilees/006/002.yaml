    rationale: 原文在此处直接说将脂肪升上（即置上）祭坛；采用“放在祭坛上”能保留动作而不额外断定该短语本身的献祭功能。
  - severity: medium
    issue: “素祭”将以油调和的供物限定为特定类别。
    rationale: መሥዋዕተ 是“供物、祭物”的通称，随后的“以油调和”没有在本句中明说谷物性质；译作“供物”可保留原文的概括性。
