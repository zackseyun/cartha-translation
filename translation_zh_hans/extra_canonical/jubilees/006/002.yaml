base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/002.yaml
  text: And he placed the fat on the altar, and he took an ox and a ram and a sheep and kids and salt and a turtledove and a young pigeon, and he offered a burnt offering on the altar, and he set upon them an offering mixed with oil, and he sprinkled wine, and he put incense over everything, and he caused a pleasing fragrance to rise up, acceptable before the Lord.
translation:
  language: zh_hans
  text: 他把脂肪放在祭坛上，又取来一头公牛、一只公绵羊、一只羊、几只山羊羔、盐、一只斑鸠和一只雏鸽，在祭坛上献为燔祭。他又把用油调和的供物放在这些祭物上，洒上酒，并在所有祭物上放了香，使馨香上升，在主面前蒙悦纳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ፡ ሥብሐ
  choice: 把脂肪献上
  rationale: 字面为“使脂肪上升”，在祭祀语境中自然表达为献上脂肪；避免误译成单纯“放置”。
- source_word: ላህመ፡ ወበሐኰ፡ ወበገዐ፡ ወአጣሊ
  choice: 一头公牛、一只公绵羊、一只羊、几只山羊羔
  rationale: 依次保留原文所列牲畜类别及单复数；中文用量词使表达自然。
- source_word: ጼወ
  choice: 盐
  rationale: 按该词通常义直译，保留它在祭物清单中的位置，不擅自解释用途。
- source_word: ጽንሓሐ
  choice: 燔祭
  rationale: 此处处于祭坛献祭语境，指整献而焚烧的祭物；采用现代中文圣经语域中通行且明确的“燔祭”。
- source_word: መሥዋዕተ፡ አውሰ፡ በቅብዕ
  choice: 调了油的素祭
  rationale: 原文指以油调和的供物；“素祭”能自然区分于前述牲畜燔祭，同时保持祭祀语域。
- source_word: ነዝኀ፡ ወይነ
  choice: 洒上酒
  rationale: ነዝኀ 的核心义为“洒、撒”，故不用较符合一般奠祭习惯却不够贴合本词的“浇奠”。
- source_word: ዕጣነ
  choice: 香
  rationale: 指焚烧用的香料或香，中文以“香”简洁自然。
- source_word: መዐዛ፡ ሠናየ፡ ዘያሠምር
  choice: 馨香……蒙悦纳
  rationale: 兼顾“美好香气”与“使人喜悦／可蒙悦纳”的祭祀含义，采用庄重而易懂的传统中文表达。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 原词是“主／上主”的称号，并非以神名四字母形式出现，故译作“主”。
theological_decisions:
- issue: 馨香与蒙悦纳之间的关系
  choice: 使馨香上升，在主面前蒙悦纳
  alternative: 使主闻到悦纳的馨香
  rationale: 原文同时表达香气上升及其在主面前令人喜悦／蒙悦纳；所选译法避免把感官动作或悦纳对象解释得过于具体。
- issue: 神圣称谓的表达
  choice: 主
  alternative: 耶和华
  rationale: 源文使用表示“主”的称号，没有明确呈现神名，因此不引入“耶和华”。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文祭祀语域。“燔祭、素祭、馨香、蒙悦纳”等词具有必要的经文风格，但句法保持自然；清单次序严格依照吉兹文。
