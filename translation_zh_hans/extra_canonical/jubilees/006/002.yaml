  source_fidelity: 需作两处小幅修订。首句的吉兹文表达为将脂肪“升上／置于”祭坛，译为“献在祭坛上”虽合祭祀语境，却较原文多出献祭动作；改为“放在祭坛上”更贴近。以油调和的 መሥዋዕተ 是一般性的“供物／祭物”；本节并未明确其为谷物，译作“素祭”会不必要地限定其性质。
  naturalness: 原译庄重、清楚，祭祀清单和后续动作衔接自然。将“调了油的素祭”改为“用油调和的供物”后，仍符合现代中文经文语体。
  terminology: “燔祭”“馨香”“主”均恰当；“洒上酒”准确反映 ነዝኀ 的“洒、撒”义，不应改作“浇奠”或“倾倒”。“香”可保留。
  issues:
