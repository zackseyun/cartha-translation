  text: and on it the earth became dry, and he opened it and saw the earth. And on the new moon of the fourth month the mouths of the depths of the abyss beneath were closed. And on the new moon of the seventh month were opened all the mouths of
translation:
  language: zh_hans
  text: 到那一天，地面干了；他把它打开了，看见了地面。四月初一，下方深渊深处的各个口都关闭了。七月初一，所有……的口都被打开了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语原文摘录到“所有……的口”处中断；本译文不据上下文补足所缺成分。
    reason: 说明底本文段在属格成分开始处中断，并解释正文保留的省略号。
lexical_decisions:
- source_word: ወባቲ
  choice: 到那一天
  rationale: 该短语直译可作“在它／她之上”，但结合前文日期指代，以现代汉语自然表达为“到那一天”，同时不重复补出原文此处未明说的日期。
- source_word: የብሰት፡ ምድር
  choice: 地干了
  rationale: የብሰት表示变干、干涸；简洁译出土地退水后干燥的状态。
- source_word: ወአርኀወ
  choice: 他打开了方舟
  rationale: 动词意为“他打开”；宾语在摘录中省略，依叙事情境补出“方舟”，使中文可理解，但不进一步限定为窗、盖等具体部位。
- source_word: ወርእየ፡ ምድረ
  choice: 看见了地面
  rationale: 将“看见地”译成自然现代汉语“看见了地面”。
- source_word: በሠርቀ፡ ወርኅ፡ ራብዕ
  choice: 四月初一
  rationale: ሠርቀ ወርኅ指月亮初现／新月之日；在此历法语境中用普通读者易懂的“初一”表达。
- source_word: አፈ፡ መዓምቅቲሃ፡ ለቀላይ፡ ታሕቲት
  choice: 地下深渊各处的泉口
  rationale: 原语逐层表达“下方之深渊的深处／孔口”；译作“地下深渊各处的泉口”，既保留宇宙水源意象，又避免生硬重复“深处的口”。
- source_word: ተፈጸመ
  choice: 都封闭了
  rationale: 此处表示闭合、封住；加“都”与复数性的“各处泉口”协调。
- source_word: ተርኅወ፡ ኵሉ፡ አፈ
  choice: 所有……的口都打开了
  rationale: 明确保留原文的被动／状态动词“打开”，并以省略号显示所给原文在属格成分处中断，不擅自补足对象。
theological_decisions:
- issue: 地下深渊意象的处理
  choice: 保留“地下深渊”及其泉口的具体宇宙图景
  alternative: 概括为“地下的水源”
  rationale: 原文具有明确的深渊及其孔口意象；不应以现代自然解释消解古代文本的表达。
- issue: 末句残缺
  choice: 保留“所有……的口”这一未完成结构
  alternative: 根据洪水叙事补为某类泉口或天窗
  rationale: 所提供的吉兹语摘录止于属格结构开端；补足会把推测写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。日期以“某月初一”表达新月日；末句刻意保留残缺。为使中文叙事成立，在“他打开了”后依语境补出“方舟”，但不具体指明所打开的是窗、门或盖。
