  yaml_path: translation/extra_canonical/jubilees/006/006.yaml
  text: And behold, I have given you all the beasts and everything that flies and everything that moves on the earth, and the fish in the waters, and everything for food; like the green plants I have given you everything to eat.
translation:
  language: zh_hans
  text: 看哪，我已把一切走兽、一切飞禽、地上一切活动之物和水中的鱼都赐给你们；这一切都可作食物。正如青绿的草木一样，我把这一切都赐给你们吃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊተ
  choice: 走兽
  rationale: 指动物、野兽；此处与飞禽、地上活动之物和鱼并列，用“走兽”自然且能保留类别区分。
- source_word: ዘይሰርር
  choice: 飞禽
  rationale: 该词意为“飞翔的”；在动物清单中以“飞禽”表达，避免误译为“活动之物”。
- source_word: ዘይትሐወስ
  choice: 活动之物
  rationale: 表示移动、活动之物；采用较宽泛的译法，不擅自限定为爬行动物或生物。
- source_word: ለሲሲት
  choice: 可作食物的
  rationale: 表达供食用、作为食物之意，与下文“赐给你们作食物”相衔接。
- source_word: ሐምለ፡ ሣዕር
  choice: 青翠的植物
  rationale: 字面涉及绿色草木；“青翠的植物”符合现代汉语，并呼应创世记传统措辞而不过度缩窄为草。
- source_word: ትብልዑ
  choice: 作食物
  rationale: 原义为“你们吃”；结合“赐给你们”译作“作食物”，使中文流畅并保留食用许可的含义。
theological_decisions:
- issue: 动物作为食物的赐予范围
  choice: 把各类动物及一切可食之物都表述为赐给人作食物
  alternative: 将末句理解为只赐植物作食物
  rationale: 原文先列走兽、飞禽、地上活动之物和鱼，随后说“一切可作食物的”，并以青翠植物作类比；译文保留这一整体结构，不缩小赐予范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“看哪”保留原文提示语气；用“你们”反映复数受词。句式稍作整合以避免汉语中重复累赘，同时保留动物类别、植物类比和赐予食用的逻辑。
