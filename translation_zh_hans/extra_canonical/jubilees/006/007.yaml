revisions:
- from: 但带着生命、带着血的肉，你们不可吃；因为一切血肉之躯的生命都在血中，免得为你们的生命追讨你们的血。无论从谁手中，还是从任何活物那里，我都要追讨人的血。
  to: 但仍有生命、带着血的肉，你们不可吃；因为一切有肉身者的生命都在血中，以免为你们的生命而追讨你们的血。从每一个人手中，也从每一种活物手中，我都要追讨人的血。
  rationale: 修订明确了“每一个人”与“每一种活物”两个并列追责对象，并以“一切有肉身者”避免将原文广义的“一切肉身”限缩为人。中段仍保留“为你们的生命而追讨你们的血”的原文句法与解释张力，不将其改写为单一、确定的神学或司法因果。
