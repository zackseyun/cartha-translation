base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/007.yaml
  text: But flesh with its life, with its blood, you shall not eat; for the life of all flesh is in the blood, so that your blood for your lives may not be sought. From the hand of every man, from the hand of every living thing, I will require the blood of man.
translation:
  language: zh_hans
  text: 但仍有生命、带着血的肉，你们不可吃；因为一切有肉身者的生命都在血中，以免为你们的生命而追讨你们的血。从每一个人手中，也从每一种活物手中，我都要追讨人的血。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሱ
  choice: 生命
  rationale: 此处与“血”并列，指使肉身有生命的生命气息或生命本身；结合下文“生命在血中”，译作“生命”最连贯自然。
- source_word: ነፍሰ
  choice: 生命
  rationale: 在“血肉之躯的生命都在血中”这一语境中，该词表示生命，而非现代汉语通常所说的独立“灵魂”。
- source_word: ሥጋ
  choice: 肉／血肉之躯
  rationale: 首处涉及食用，译作“肉”；后处泛指有血的肉身，译作“血肉之躯”，使汉语语义清楚。
- source_word: ይትኀሠሥ / አኀሥሦ
  choice: 追讨
  rationale: 两处均含追究、索取偿还之意；“追讨血”保留审判与问责意味，也呼应相关古代经文措辞。
- source_word: ነፍሳቲክሙ
  choice: 你们的生命
  rationale: 保留原文“为你们的生命”的关系，不把其明确化为某一种单一因果解释。
- source_word: እምእዴ
  choice: 从……手中／从……那里
  rationale: 对人保留“从谁手中”的责任表达；对活物用自然汉语“从……那里”，同时维持两个并列追责对象。
theological_decisions:
- issue: 血与生命的关系
  choice: “一切血肉之躯的生命都在血中”
  alternative: “血就是一切肉身的生命”
  rationale: 原文使用“在血中”的空间关系，未直接将血与生命完全等同，因此按原文保留其表达。
- issue: 否定目的从句的逻辑关系
  choice: “免得为你们的生命追讨你们的血”
  alternative: “所以必为你们的生命追讨你们的血”
  rationale: 原文否定目的式较难，语义可能涉及禁食带血之肉，以免人的血因其生命而被追讨；译文保留这种目的与警戒意味，不将其改写成确定的宣判。
- issue: 追讨人的血之主体
  choice: “我都要追讨”
  alternative: 省略主语，译作“都必追讨”
  rationale: 末句动词为第一人称表达，译出“我”以保留神圣说话者的自指，但不额外添加身份称谓。
- issue: 追责对象的次序
  choice: “无论从谁手中，还是从任何活物那里”
  alternative: “从一切人和一切兽手中”
  rationale: 依所给吉兹文本的次序，先人后活物；不依据平行传统擅自倒置，也不把广义“活物”窄化为“兽”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“血肉之躯”用于概括凡有肉身者，“追讨人的血”保留古代盟约与司法语感。原文中段句法略显生硬，译文尽量保存“为你们的生命”这一真实张力，而未将其过度解释。
