base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/005.yaml
  text: And as for you, be fruitful and multiply on the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I will put upon everything that is on the earth and in the sea.
translation:
  language: zh_hans
  text: 至于你们，要在地上生养、增多，在地上多起来，并成为地上的祝福。我要使地上和海里的一切都因你们而恐惧战栗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሀቁ፡ ወተባዝኁ
  choice: 生养增多
  rationale: 此处是创世叙事中的繁衍祝福语式；以现代中文常见而庄重的“生养增多”表达结果性增殖，并与上下文相称。
- source_word: ወብዙኁ፡ ላዕሌሃ
  choice: 遍满地面
  rationale: 字面涉及在地上成为众多；译作“遍满地面”自然呈现人口繁盛及其空间范围，同时避免生硬重复“增多”。
- source_word: ወኩኑ፡ ለበረከት፡ ላዕሌሃ
  choice: 并成为地上的福
  rationale: 保留“成为祝福/福”的表述，不将其解释为单纯“蒙福”，从而维持原文主动成为福分的语义。
- source_word: ፍርሀትክሙ፡ ወረዓድክሙ
  choice: 惧怕你们、畏惧你们
  rationale: 以两个近义表达对应原文并列的“恐惧”与“战栗/畏惧”，保留加强语气。
- source_word: እሁብ፡ ዲበ
  choice: 我要使……
  rationale: 原文直译为“我要把……放在……之上”；现代汉语用使役结构更自然，并准确表达恐惧临到受造物。
- source_word: ኵሉ፡ ዘውስተ፡ ምድር፡ ወዘውስተ፡ ባሕር
  choice: 地上和海里的一切
  rationale: 简洁保留陆地与海洋的总括范围，不擅自限定为某类动物。
theological_decisions:
- issue: “成为地上的福”还是“在地上蒙福”
  choice: 成为地上的福
  alternative: 在地上蒙福
  rationale: 原文结构指向“成为祝福”，而非仅仅领受祝福；保留这一较不寻常但有意义的表达，避免消解其神学张力。
- issue: “一切”的指称范围
  choice: 保留为“地上和海里的一切”
  alternative: 明确译为“地上和海里的一切动物”
  rationale: 原文使用总括性关系结构，并未在本句明确补出“动物”；正文不增加限制，以保存原有概括性。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话。整体依从吉兹语句法与意象，同时调整重复以符合中文节奏；“生养增多”“遍满地面”“成为地上的福”形成递进。未添加原文没有的解释性称谓。
