  rationale: 删除“遍满地面”这一无对应的扩展，恢复原文“生养、增多……成为众多”的层递；将“昌盛”改为“多起来”，使数量意义明确。末句调整为自然的使役句，完整保留神使万物因人类而有恐惧与战栗的含义及陆地、海洋的总括范围。
