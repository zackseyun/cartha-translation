base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/030.yaml
  text: And all the days of the commandments are fifty-two weeks of days, and all of them make a complete year. Thus it is inscribed and ordained on the heavenly tablets, and there is no neglecting a single year, from year to year.
translation:
  language: zh_hans
  text: 诫命所定的一切日子，共计五十二个七日周，合成完整的一年。这事已刻写并设立在天上的版册上；年复一年，不可漏掉任何一年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዛት
  choice: 诫命
  rationale: 该词在吉兹语中为复数；汉语“诫命”可作集合性称谓，既忠于复数含义，也避免生硬的“众诫命”。
- source_word: ፶ምሳ፡ ወክልኤ፡ ሰንበታት፡ መዋዕል
  choice: 五十二个整周
  rationale: 字面为“五十二个日子的周”；译作“整周”自然表达每周由完整天数组成，并保留历法计算的重点。
- source_word: ፍጹም
  choice: 完整
  rationale: 表示完满、齐全；此处修饰一年，译作“完整”最切合历法语境。
- source_word: ተቈርፀ፡ ወተሠርዐ
  choice: 铭刻并制定
  rationale: 依原文次序分别表达“刻写、铭刻”与“设立、规定”，不颠倒两个动作。
- source_word: ጽላት፡ ሰማይ
  choice: 天上的版
  rationale: 保留《禧年书》中“天上版册”的具体意象；“版”体现刻写文字的载体。
- source_word: አልቦ፡ ተዐድዎ
  choice: 不可漏掉
  rationale: 语境强调历法年不可被忽略或跳过；“漏掉”较“违犯”更贴合逐年守历的含义。
theological_decisions:
- issue: 历法陈述是否明说三百六十四日
  choice: 仅译“五十二个整周”
  alternative: 增译为“五十二个整周，即三百六十四日”
  rationale: 原文只明说五十二周；虽可推算为三百六十四日，但不应把推论加入正文。
- issue: 天上版册的权威性质
  choice: 保留“已铭刻并制定”两个并列动作
  alternative: 合并为“已规定”
  rationale: 原文同时强调记录与设立，合并会削弱其双重表述及神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“诫命所规定的”补足汉语中的关系，使首句清楚自然；“年复一年”保留原文反复、持续遵守的语气。
