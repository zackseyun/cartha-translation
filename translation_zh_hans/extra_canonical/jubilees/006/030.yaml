revisions:
- from: 诫命所规定的一切日子，共有五十二个整周；这些日子合起来就是完整的一年。这事已铭刻并制定在天上的版上；年复一年，不可漏掉任何一年。
  to: 诫命所定的一切日子，共计五十二个七日周，合成完整的一年。这事已刻写并设立在天上的版册上；年复一年，不可漏掉任何一年。
  rationale: 将首句调整为更直接的属格／关系表达，并以“七日周”明确原文“日子的周”。将“天上的版”改为“天上的版册”，保留复数文书意象；以“刻写并设立”按原文次序译出两个动作，避免“制定在……上”的不自然搭配。末句保留“年复一年”及“漏掉”的逐年守历含义。
