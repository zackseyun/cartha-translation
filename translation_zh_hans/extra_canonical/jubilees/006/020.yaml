  text: And you also, command the children of Israel that they keep this festival throughout their generations.
translation:
  language: zh_hans
  text: 你也要吩咐以色列子孙，叫他们世世代代守这个节期。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ እስራኤል
  choice: 以色列子孙
  rationale: 直译为“以色列的儿女”，用现代中文圣经语体中自然、庄重的“以色列子孙”，指以色列全体后裔。
- source_word: ይዕቀብዋ
  choice: 守
  rationale: 该动词在此表示遵守、持守节期；中文以“守节期”表达最自然，并保留礼仪性义涵。
- source_word: ዛቲ በዓል
  choice: 这个节期
  rationale: 指前文所述的特定节庆；“这个”体现指示性，“节期”比单纯“节日”更符合经文语域。
- source_word: በኵሉ ትዝምዶሙ
  choice: 世世代代
  rationale: 原意为“在他们所有的世代中”；采用自然的汉语固定表达，完整传达历代持续遵守之意。
theological_decisions: []
