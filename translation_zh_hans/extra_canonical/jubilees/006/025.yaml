lexical_decisions:
- source_word: ተዝካረ
  choice: 纪念
  rationale: 对应“纪念、记念之物”，保留原文简洁而略带礼仪色彩的表达。
- source_word: በሠርቀ፡ ወርኅ፡ ቀዳሚ
  choice: 正月初一
  rationale: 字面涉及“第一个月的新月”；在古代历法语境中即该月第一日，译作“正月初一”自然明确。
- source_word: ተብህለ፡ ሎቱ
  choice: 有话吩咐他
  rationale: 原文为非人称被动“有人/有话对他说”，没有明说发话者；此译保留这一点，不擅自补出“上帝”。
- source_word: ታቦተ
  choice: 方舟
  rationale: 此处指挪亚受命建造的舟，采用现代中文圣经语境中通行的称谓。
theological_decisions:
- issue: 发出建造方舟命令者的身份
  choice: 不明说主语，译为“有话吩咐他”
  alternative: “上帝吩咐他”
  rationale: 原文使用非人称被动表达，没有在本节直接点明发话者；虽可由上下文推知，正文仍保留原有含蓄。
- issue: “这些”所指对象
  choice: 依上下文译为“这些日子”
  alternative: 仅译“这些”
  rationale: 原句代词所指需从前文的日期或节期获得；补出“日子”使中文通顺，但不进一步限定具体节日。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“正月初一”兼顾历法含义与自然表达；末尾逗号保留本节与下文句法相连的状态。
