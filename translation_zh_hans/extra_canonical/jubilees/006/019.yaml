  yaml_path: translation/extra_canonical/jubilees/006/019.yaml
  text: But Abraham alone kept it, and Isaac and Jacob and his children kept it until your days. And in your days the children of Israel forgot it until I renewed it for them on this mountain.
translation:
  language: zh_hans
  text: 惟有亚伯拉罕遵守了这节期；以撒、雅各和雅各的子孙也一直遵守，直到你的时代。在你的时代，以色列子孙忘记了这节期，直到我在这山上为他们重新确立它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባሕቲቱ
  choice: 惟有
  rationale: 表达“单独、唯独”的限制意味，同时保持庄重自然。
- source_word: ዐቀበ / ዐቀብዋ
  choice: 遵守
  rationale: 此处指守住并实行前文所述的节期或规定；汉语用“遵守”最为自然。
- source_word: ውሉዱ
  choice: 雅各的子孙
  rationale: 原文为“他的子孙”，紧接雅各；明示所指可避免现代汉语中的代词歧义。
- source_word: ረከቡ
  choice: 忘记
  rationale: 依该版正文语境及英语校审层理解为以色列子孙失落、遗忘这一节期；译为“忘记”符合上下文的对比。
- source_word: ኀይስክዎሙ
  choice: 为他们重新确立
  rationale: 含恢复、更新之意；“重新确立”适合在山上重申节期规定的语境。
- source_word: በኀበዝ፡ ደብር
  choice: 在这山上
  rationale: 按指示语境处理为说话者与摩西所在之山，采用自然的现代汉语表达。
theological_decisions:
- issue: “它”所指对象
  choice: 这节期
  alternative: 它
  rationale: 本节承接前文的节期规定；在中文中补明指称，可读性更好，也不额外引入宗派解释。
- issue: 亚伯拉罕与后代守节的连续性
  choice: 保留亚伯拉罕“惟有”遵守、其后以撒和雅各家延续遵守的表述
  alternative: 把“惟有”理解为亚伯拉罕一人始终守节
  rationale: 按原文句法保留限制词与后续并列人物之间的张力，不将其过度系统化。
- issue: 神在山上的行动
  choice: 重新确立
  alternative: 更新、重新赐下
  rationale: “重新确立”既保留恢复之意，又避免暗示节期本体被创造或改变。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“惟有”保留经文感但不过分文言；通过重复“这节期”避免连续代词造成歧义。
