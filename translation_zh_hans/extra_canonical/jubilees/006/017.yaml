  yaml_path: translation/extra_canonical/jubilees/006/017.yaml
  text: For this reason it is ordained and written on the heavenly tablets that they should celebrate the Feast of Weeks in this month, once each year, to renew the covenant every year.
translation:
  language: zh_hans
  text: 因此，在天上的石版上已经规定并写明：他们应当在这月守七七节，每年一次，年年更新这约。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: 天上的石版
  rationale: 直译为“天之版”，在本书语境中指天上的记录石版；“石版”比单用“版”更清楚自然。
- source_word: በዓል፡ ዘሱባዔ
  choice: 七七节
  rationale: 意为“七周之节／周数节”；“七七节”是简洁且具有经文传统辨识度的现代中文节名。
- source_word: ለሐዲስ፡ ኪዳን
  choice: 更新这约
  rationale: 保留“更新”和“约”的直接含义；加“这”承接上下文所指的特定盟约，不另行解释其性质。
- source_word: በኵሉ፡ ዓም፡ ወዓመት
  choice: 年年
  rationale: 源文以重复的年度表达强调每一年；译作“年年”自然保留这一反复性。
theological_decisions:
- issue: 天上石版上的规定与记载
  choice: “规定并记载”
  alternative: “命定并写下”
  rationale: 源文两个被动动词分别表达设立／规定与书写；采用中性措辞，不进一步界定命定者或其神学机制。
- issue: 盟约更新的主体
  choice: “他们要……更新这约”
  alternative: “使这约得到更新”
  rationale: 按句法让“他们”同时承接庆节与更新盟约的行动，同时不补充仪式细节或盟约对象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原句的因果关系、天上石版意象、每年一次的节期频率，以及“年年更新这约”的强调；不引入宗派性解释。
