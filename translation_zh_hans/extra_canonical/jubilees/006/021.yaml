  text: 'as a command for them: one day in the year, in this month, they shall celebrate the festival. For it is the Feast of Weeks, and it is the Feast of Firstfruits. It is of two kinds and of a double nature.'
translation:
  language: zh_hans
  text: 这要作为给他们的命令：他们要每年在这个月的一日庆祝这节期。因为这是七七节，也是初熟节；它有两类，且具有双重性质。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለትእዛዝ፡ ሎሙ
  choice: 作为给他们的命令
  rationale: 保留目的或规定性的表达，并自然承接上文。
- source_word: ዕለተ፡ አሐተ፡ ለዓመት፡ በዝ፡ ወርኅ
  choice: 每年在这个月中，要用一天
  rationale: 按源文语序关系表达一年一次、在本月选定一日之意，不补入具体日期。
- source_word: ይግበሩ፡ በዓለ፡ ባቲ
  choice: 庆祝这节日
  rationale: 将字面‘在其中举行节庆’译为现代汉语自然说法。
- source_word: በዓለ፡ ሱባዔያት
  choice: 七七节
  rationale: 采用该古代节期在中文圣经传统中通行且准确的名称。
- source_word: በዓለ፡ ቀዳሜ፡ ፍሬ
  choice: 初熟节
  rationale: 直译为首先成熟之果的节期，并采用简洁、庄重的通行名称。
- source_word: ክልኤ፡ ዐጽፍት፡ ይእቲ፡ ወለክልኤ
  choice: 它有两类，也有双重性质
  rationale: 源文末尾重复表达‘二/双重’，措辞略显难解；译文保留两项并列和语义张力，不将其解释为某两种具体内容。
theological_decisions:
- issue: 七七节与初熟节的关系
  choice: 并列称为同一节期的两个名称或面向
  alternative: 解释为两个彼此分开的节期
  rationale: 源文两次使用‘它是’，紧接同一庆祝命令；并列翻译最忠实，也避免加入节期体系上的额外解释。
- issue: 末句‘两类/双重’的具体所指
  choice: 保留概括性和含混性
  alternative: 明确解释为律法与历史、麦收与立约等两重意义
  rationale: 源文本节没有说明双重性的具体内容，故不引入后世或宗派性阐释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；节期名称使用中文圣经读者熟悉的‘七七节’与‘初熟节’。末句有意保留源文重复且含混的双重表达。
