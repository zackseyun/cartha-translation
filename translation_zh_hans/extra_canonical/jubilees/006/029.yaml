base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/029.yaml
  text: 'For the feasts and for memorials forever, and thus they are ordained. And they are recorded on the heavenly tablets: thirteen weeks, each one from another, for their memorials, from the first to the second, and from the second to the third, and from the third to the fourth.'
translation:
  language: zh_hans
  text: 为节期，也为永远的纪念；它们就这样被规定。天上的版册上也记载着：为着它们的纪念，每一项之间相隔十三周——从第一项到第二项，从第二项到第三项，从第三项到第四项。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的版册上也写着它们。”
    reason: 吉兹语动词可按写录动作或记载状态理解；正文采用持续状态的译法。
lexical_decisions:
- source_word: ለበዓላት፡ ለተዝካር፡ እስከ፡ ለዓለም፡
  choice: 作为节期和永远纪念的日子
  rationale: 保留“节期”“纪念”及“永远”三项内容，并用现代汉语补出“日子”，使句意完整自然。
- source_word: ሥርዓት
  choice: 规定
  rationale: 此词指既定的秩序、条例或安排；此处译作“规定”简明且符合节期制度的语境。
- source_word: ያዐርገዎን፡ ውስተ፡ ጽላት፡ ሰማይ
  choice: 天上的版上也记载着它们
  rationale: 按未完成式表达持续有效的记载状态；“版”保留天上版册的具体意象，不扩释为书卷。
- source_word: ዓሥሩ፡ ወሠላስ፡ ሰንበታት
  choice: 十三周
  rationale: 字面为“十三个安息日/周”；在历法间隔中表示十三周。
- source_word: አሐቲ፡ አሐቲ፡ እምኔሆን
  choice: 彼此相隔
  rationale: 反映逐一、一个接一个的间隔关系，并与后文从第一到第四的序列相衔接。
theological_decisions:
- issue: 天上版册上记载的时态与性质
  choice: 记载着
  alternative: 写在了／被写在
  rationale: 吉兹语动词为未完成式，可表达当前或持续状态；译文不将其限定为一次性的过去行为。
- issue: “规定”的施事者
  choice: 采用无施事者表达“它们就是这样规定的”
  alternative: 上帝这样规定了它们
  rationale: 原文未明说施事者；不补入“上帝”，以保留原文语法上的含蓄。
- issue: 十三周与各纪念日之间的关系
  choice: 译为彼此相隔十三周
  alternative: 每一个各有十三周
  rationale: 后文“从第一个到第二个……”表明十三周是相邻纪念日之间的间隔；同时不进一步指认具体节期。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留重复的“从……到……”结构，以呈现原文历法序列的节奏和精确性。
