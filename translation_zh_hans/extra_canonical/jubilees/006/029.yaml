  text: ለበዓላት፡ ለ³⁸ተዝካር፡ *እስከ፡³⁹ ለዓለም፡ ወከመዝ፡ *እማንቱ፡ ሥርዓት።⁴⁰ ወያዐርገዎን፡ ውስተ፡ ጽላት፡ ሰማይ፡ ዓሥሩ፡ ወሠላስ፡ ሰንበታት፡⁴¹ *አሐቲ፡ አሐቲ፡⁴² እምኔሆን፡ እምዛቲ፡ ውስተ፡ ዛቲ፡ ተዝካሮን፡ እምቀዳሚት፡ እስከ፡ ካልእት፡ ወእምካልእት፡ እስከ፡ ሣልስት፡ ወእምሣልስት፡ እስከ፡ ራብዕት።
