base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/018.yaml
  text: And this whole festival was celebrated in heaven from the day of creation until the days of Noah—twenty-six jubilees and five weeks of years. And Noah and his sons kept it for seven jubilees and one week of years, until the day of Noah's death. And from the day of Noah's death his sons corrupted it until the days of Abraham, and they ate blood.
translation:
  language: zh_hans
  text: '这个完整的节期，从创造之日起直到挪亚的日子，一直在天上举行，共二十六个禧年期[a]和五个七年期。挪亚和他的儿子们也遵守这节期，达七个禧年期和一个七年期，直到挪亚去世的那一天。挪亚去世以后，他的后代一直败坏这节期，直到亚伯拉罕的日子；他们也吃血。


    [a]“禧年期”指四十九年；“七年期”指七年。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禧年期”指四十九年；“七年期”指七年。
    reason: 帮助现代读者理解《禧年书》特有的年代计算单位。
lexical_decisions:
- source_word: በዓል
  choice: 节期
  rationale: 该词指按时庆守的宗教节日；“节期”比单纯“节日”更能体现历法和礼仪背景。
- source_word: ኢዮቤልዉ
  choice: 禧年期
  rationale: 此处是《禧年书》的年代计算单位，即七个七年期，共四十九年；加“期”可避免读者误解为某一个禧年年份。
- source_word: ሱባዔ ዓመት / ሱባዔ ዓመታት
  choice: 七年期
  rationale: 直译为“年之七组”，在本书年代体系中表示七年；译作“七年期”自然且准确。
- source_word: ደቂቁ
  choice: 他的儿子们
  rationale: 在挪亚本人共同守节的语境中，具体指他的儿子们。
- source_word: ውሉዱ
  choice: 他的子孙
  rationale: 此处时间跨度从挪亚去世延续到亚伯拉罕时代，译作“子孙”比仅译“儿子”更符合该词可指后裔的范围及上下文。
- source_word: ወይበልዑ ደመ
  choice: 他们还吃血
  rationale: 直接保留原文对吃血行为的陈述，不作解释或弱化。
theological_decisions:
- issue: 节期在天上被遵守
  choice: 一直在天上遵守
  alternative: 一直由天上的众使者庆祝
  rationale: 原文只明确地点为“在天上”，并未在本节明说行为主体；不补入“众使者”，以保留原文表达范围。
- issue: 挪亚后裔对节期所做之事
  choice: 败坏了这节期
  alternative: 废弃了这节期
  rationale: 采用校勘英译所反映的“corrupted it”，并明确“这节期”为宾语，使中文通顺，同时不把行为强化为彻底废止。
- issue: 吃血与败坏节期的关系
  choice: 用分号并列为“他们还吃血”
  alternative: 译成因果关系“因为他们吃血”
  rationale: 原文仅以连接词并列两项陈述，没有明确标示因果，因此避免加入因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“一直在天上遵守”保留原文较为含蓄的施事表达；年代单位采用“禧年期／七年期”，兼顾准确性和可读性。数字“二十六”依据该版校勘传统及年代结构理解原文数词，并与审校咨询层一致。
