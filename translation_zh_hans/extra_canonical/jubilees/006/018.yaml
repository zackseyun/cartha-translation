  naturalness: “这整个节期……一直在天上遵守”在现代汉语中施事和搭配略显生硬；改为“这个完整的节期……一直在天上举行”，既保留未指明施事者的含蓄表达，也更符合“celebrated”的节期语境。“他的后代一直败坏这节期”也比“他的子孙败坏了这节期，直到……”更自然地表达延续至亚伯拉罕时代的状态。
  terminology: “节期”“禧年期”“七年期”“吃血”均合适。“禧年期”配合脚注说明其为四十九年，能够准确传达本书的年代计算体系。
