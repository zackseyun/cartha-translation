  yaml_path: translation/extra_canonical/jubilees/006/028.yaml
  text: the tops of the mountains appeared, and Noah rejoiced. Therefore he ordained them for himself as festivals for remembrance forever, and thus they are ordained.
translation:
  language: zh_hans
  text: 山顶显露出来，挪亚就欢喜。因此，他为自己把这些日子定为节期，永远作为纪念；这些日子也就这样被定下了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርእስቲ፡ አድባር
  choice: 山顶
  rationale: 直译为“山的顶部／山顶”，符合洪水消退、山顶显现的语境。
- source_word: አስተርአየ
  choice: 显露出来
  rationale: 表达被看见、显现之意；用“显露出来”自然呈现山顶从水中出现的情景。
- source_word: ተፈሥሐ
  choice: 欢喜
  rationale: 该词表示喜乐、欢欣；“欢喜”简明庄重。
- source_word: ሠርዓን፡ ኪያሆን፡ ሎቱ
  choice: 他为自己把这些日子定为
  rationale: 保留动词“设立、规定”及间接受益成分“为自己”；宾语代词依上下文指前述日期，明译为“这些日子”。
- source_word: በዓላተ፡ ለተዝካር፡ ለዓለም
  choice: 节期，永远作为纪念
  rationale: 依据经审查确认的完整吉兹语后半句，保留“节期”“纪念”“永远”三项意义，不因所给片段的分割缺失而删减。
- source_word: ወከማሁ፡ ሠርዓዋ
  choice: 这些日子也就这样被定下了
  rationale: 保留“照样／这样”及被设定的结果；补明主语“这些日子”以符合现代汉语。
theological_decisions:
- issue: 节期的纪念性质与永久性
  choice: 译作“永远作为纪念”
  alternative: “作为永远的节期”或仅作“永远作为节期”
  rationale: 完整文本含“为纪念”（ለተዝካር）与“永远”（ለዓለም），两者都应呈现；本译不进一步界定其神学适用范围。
- issue: “为自己”的指向
  choice: 保留“他为自己”
  alternative: 省略或解释为“为自己的后代”
  rationale: 源文明确含第三人称反身／受益表达，保留其张力，不增添后代或群体等未明说的对象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“定为节期”“作为纪念”贴近礼仪语境，但避免过度宗派化。“这些日子”是为消除汉语代词歧义而作的上下文补明。
