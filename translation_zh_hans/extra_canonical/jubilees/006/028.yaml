  source_fidelity: 译文准确呈现完整经文所含的要点：群山之顶显现、挪亚欢喜、他为自己设立这些日子为节期、其纪念性与永久性，以及随后“照样被设立”的结语。虽然所示吉兹语片段在分段处截断，审校记录所补的后半句（含“为纪念”“永远”）应予保留；现译已如此处理。
