  yaml_path: translation/extra_canonical/jubilees/006/032.yaml
  text: But if they transgress and do not observe them according to his command, then they will disturb all their seasons, and the years will be moved from this order, and they will transgress their ordinances.
translation:
  language: zh_hans
  text: 但他们若违犯，不按他的命令遵守这些日子[a]，就会扰乱他们所有的节期[b]，年岁也会偏离这秩序[c]；他们还会违背自己的规例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“遵守它们”；复数代词所指可理解为上文规定的日子或节期。
    reason: 保留复数宾语及其先行词的语义空间。
  - marker: b
    text: 这里的动词是主动式，也可译为“使他们所有的时期陷入混乱”。
    reason: 说明原文以违犯者为行动主体，并保留“节期／时期”的词义范围。
  - marker: c
    text: 本版吉兹文本在此另以方括号收入一句重复性文句：“节期也会受扰乱，年岁也会变动。”正文按其括注性质不重复译出。
    reason: 交代源文本中的方括号重复材料，避免无声删略。
lexical_decisions:
- source_word: ተዐደዉ
  choice: 违犯
  rationale: 该动词表达越界、违背既定命令或秩序；“违犯”既保留其道德与制度含义，也符合现代中文表达。
- source_word: ኢገብርዎን
  choice: 不……遵守这些日子
  rationale: 动词本义可为“做、实行”，宾语后缀是复数；结合上下文所论规定的日子与节期，译为“遵守这些日子”自然且保留复数指向。
- source_word: ያማስኑ
  choice: 会扰乱
  rationale: 此处是主动使役形式，主语是违犯者，而“自己一切的节期”是宾语，因此不用被动式“受到扰乱”。
- source_word: ጊዜያቲሆሙ
  choice: 自己一切的节期
  rationale: ጊዜ 可指时间、时期；在历法语境中译作“节期”能清楚表达规定的时序，同时“自己”体现复数所属后缀。
- source_word: ይትሐወሱ
  choice: 会偏离
  rationale: 该词在此描述年岁从既定秩序中被挪动、混乱；“偏离”比直译“被移动”更符合中文历法语境。
- source_word: ሥርዐቶሙ
  choice: 自己的规例
  rationale: ሥርዐት 可指秩序、制度或规例；末句以“规例”表达他们所应遵循的规定，同时不强行确定中文单复数。
theological_decisions:
- issue: 命令发布者的代词
  choice: 他的命令
  alternative: 给他的命令／上帝的命令
  rationale: 原文保留第三人称男性代词；正文照译“他的”，避免在本节中补明原文未直接说出的身份或受命关系。
- issue: 复数宾语的所指
  choice: 这些日子
  alternative: 这些规定／它们
  rationale: 吉兹文宾语后缀为复数，结合上下文以“这些日子”承接最为清楚；脚注提示原文仅以代词表达，避免把所指说得过死。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“这些日子—节期—年岁—秩序”保持历法语境的连贯；主动译出“会扰乱”，并以脚注交代复数代词、词义范围及括号内的重复文句。
