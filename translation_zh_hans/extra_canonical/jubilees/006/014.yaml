base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/014.yaml
  text: And there is no limit of days for this law, for it is forever. They shall keep it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar every day, at morning and evening. They shall make atonement for it continually before the Lord, so that they may keep it and not be uprooted.
translation:
  language: zh_hans
  text: 这条律法没有期限，因为它是永远的。他们世世代代都要遵守，好叫他们每日早晚在祭坛前用血为你们祈求。他们要不断在主面前为此赎罪[a]，好使他们遵守这律法，不致被连根拔除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为此”所指不甚明确，可能承接这律法或相关的祭仪责任。
    reason: 保留原文代词指向的歧义。
  - marker: b
    text: 或译：“不致被剪除。”
    reason: 提供符合盟约语境的惯用译法，同时正文保留“拔根”的原始意象。
lexical_decisions:
- source_word: ዐቅመ፡ መዋዕል
  choice: 日数的限期
  rationale: ዐቅም 表示尺度、限度，መዋዕል 表示日子；合译为“日数的限期”，自然表达此律法并无终止期限。
- source_word: ይትመሀለሉ
  choice: 祈求
  rationale: 该词表示恳求、代求，不与下文专指赎罪的 ያስተሰርዩ 混同。
- source_word: በደም፡ በቅድመ፡ ምሥዋዕ
  choice: 在祭坛前以血
  rationale: 保留原文的祭祀语境和介词关系；“以血”表达祈求所凭借的祭牲之血。
- source_word: ያስተሰርዩ
  choice: 赎罪
  rationale: 此使役形动词指施行遮罪、除罪，与前文“祈求”保持词义区别。
- source_word: ኢይሠረዉ
  choice: 不致被连根拔除
  rationale: 该被动形式源于“拔根、根除”，保留其严厉的盟约性后果，而不弱化为“忽略”。
theological_decisions:
- issue: 血祭行动中“祈求”与“赎罪”的关系
  choice: 分别译作“祈求”和“赎罪”
  alternative: 两处都译作“赎罪”
  rationale: 原文使用两个不同动词；区分翻译可避免把代求与赎罪行动合并为同一概念。
- issue: 末句的后果
  choice: 不致被连根拔除
  alternative: 不致被剪除
  rationale: “连根拔除”较直接保留词根所含的拔根意象；“剪除”虽符合部分圣经语域，却会减弱原文具体形象。
- issue: “为此赎罪”的指代
  choice: 正文保留“此”，脚注说明可能指向
  alternative: 明确译为“为这律法赎罪”或“为你们赎罪”
  rationale: 原文代词的所指并不完全明确，不应在正文中强行消除这种歧义。
translation_notes:
  register: 采用现代、庄重而通俗的汉语；“世世代代”“祭坛”“赎罪”等词保持经书语体，但避免过度古雅。将每日的两个时段自然译为“每日早晚”，并在末句补出“这律法”，使汉语指代清楚而不改变主旨。
