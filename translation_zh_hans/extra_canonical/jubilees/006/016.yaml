  text: He set his bow in the cloud for a sign of the everlasting covenant, that there should never again be floodwaters upon the earth to destroy it all the days of the earth.
translation:
  language: zh_hans
  text: 他把弓放在云中，作为永约的记号，使洪水在大地存留的一切日子不再临到地上毁灭它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀስተ
  choice: 弓
  rationale: 该词本义为“弓”；在云中的弓即彩虹，但保留“弓”的意象可更贴近源文及盟约记号的表达。
- source_word: ወሀበ፡ ውስተ፡ ደመና
  choice: 把自己的弓放在云中
  rationale: 动词表达“放置、安放”；依上下文补出所属关系“自己的”，使现代汉语自然。
- source_word: ለትእምርተ፡ ኪዳን፡ ዘለዓለም
  choice: 作为永约的记号
  rationale: 直译盟约术语，保留“记号—约”的关系。
- source_word: ማየ፡ አይኅ
  choice: 洪水
  rationale: 字面为“洪水之水/洪泛之水”，汉语以“洪水”简洁传达。
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: 直到大地的年日终结
  rationale: 源文近于“大地的一切日子”；此处译出持续至大地存留终点的时间含义，同时避免误解为每天都发生毁灭。
theological_decisions:
- issue: “永约”的持续性与“大地的一切日子”的关系
  choice: 分别译作“永约”与“直到大地的年日终结”
  alternative: “永恒之约”与“在大地存留的一切日子”
  rationale: 保留源文一方面称约为永久，另一方面以大地的全部年日表述洪水不再毁灭的期限，不把两者强行系统化。
- issue: 否定范围
  choice: “使洪水不再临到地上，毁灭大地”
  alternative: “使地上不再有洪水，毁灭一切”
  rationale: 源文可涉及洪水不再出现并造成全面毁灭；本译文把否定重点落在毁灭性洪水不再临到大地，避免暗示此后绝无任何局部洪灾。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“弓”保留源文具体意象；句末将字面“大地的一切日子”自然化为“直到大地的年日终结”。无脚注。
