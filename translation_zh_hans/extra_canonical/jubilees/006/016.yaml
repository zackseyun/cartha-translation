- from: 他把自己的弓放在云中，作为永约的记号，使洪水不再临到地上，毁灭大地，直到大地的年日终结。
  to: 他把弓放在云中，作为永约的记号，使洪水在大地存留的一切日子不再临到地上毁灭它。
  rationale: 修订保留“弓”的意象及“永约”的术语，并将“大地的一切日子”译为自然且范围明确的持续性表达。末尾“它”承接“大地”，对应源文中洪水所要毁灭的对象；全句不暗示从此不存在任何局部洪灾。
