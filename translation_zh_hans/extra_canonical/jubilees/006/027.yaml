lexical_decisions:
- source_word: መዓምቅተ፡ ምድር
  choice: 地的深渊
  rationale: 按原文保留“地”与“深处／深渊”的意象；结合“敞开”和水流入其中的语境，译为自然而庄重的“地的深渊”。
- source_word: ማያት፡ ይረድ፡ ውስቴቱ
  choice: 水开始流入其中
  rationale: 动词表达水向下进入先前敞开的深渊；“流入”在中文中自然呈现下降并进入其中的动作，“开始”反映叙事中的起始体含义。
- source_word: በሠርቀ፡ ወርኅ፡ ዓሥር
  choice: 到了十月初一
  rationale: ሠርቀ ወርኅ 指月亮初现／新月，在历法语境中即该月的第一日；“十月初一”比直译“十月的新月”更符合现代汉语日期表达。
