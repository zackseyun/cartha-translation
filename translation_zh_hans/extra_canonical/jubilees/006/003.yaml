  text: And the LORD smelled the pleasing fragrance, and he made a covenant with him that there should never again be floodwaters to destroy the earth.
translation:
  language: zh_hans
  text: 上主闻到怡人的香气，便与他立约：不再有洪水毁灭大地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: 上主
  rationale: 该词在吉兹语中是对神的尊称“主”；译作“上主”既庄重自然，也避免仅凭英文大写 LORD 反向引入原文未明示的专名。
- source_word: መዐዛ፡ ሠናየ
  choice: 悦人的香气
  rationale: 直译为“美好／佳美的香气”；“悦人的香气”保留其正面评价，并符合现代汉语表达。
- source_word: ተካየደ፡ ምስሌሁ፡ ኪዳነ
  choice: 与他立约
  rationale: 该短语表达与某人订立、确立盟约；“与他立约”简明准确。
- source_word: ማየ፡ አይኅ
  choice: 洪水
  rationale: 字面为“洪灾之水／洪水之水”，现代汉语以“洪水”自然涵盖这一含义。
- source_word: ያማስን፡ ምድረ
  choice: 毁灭大地
  rationale: 动词表示毁坏、灭坏，宾语为“地”；译作“毁灭大地”保留灾难的强度。
theological_decisions:
- issue: 是否将神名译作“耶和华”
  choice: 上主
  alternative: 耶和华
  rationale: 现存吉兹语正文使用称号 እግዚአብሔር，而非音译神名；按原文证据优先译为“上主”，不依据英文排印形式补入专名。
- issue: 立约内容的施事表达
  choice: 再也不让洪水毁灭大地
  alternative: 再也不会有毁灭大地的洪水
  rationale: 吉兹语结构主要陈述此后不再有造成毁灭的洪水；所选译法自然地表达上主所立之约，但不额外说明洪水的具体施事机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；句式简洁，适合普通读者，同时保留祭物香气、立约和洪水毁地之间的原文逻辑。
