  text: All the days of the earth, seedtime and harvest shall not cease; cold and heat, summer and winter, and day and night shall not change their order, nor shall they cease forever.
translation:
  language: zh_hans
  text: 在大地存留的一切日子里，播种和收割必不止息；寒冷和炎热、夏季和冬季、白昼和黑夜，都不会改变各自的规律，也永远不会止息。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: 地还存留的所有日子
  rationale: 该短语表示大地存续期间，作全句的时间状语；这样译比直译“地的所有日子”更符合现代汉语，同时不改变其范围。
- source_word: ዘርእ፡ ወማእረር
  choice: 播种和收割
  rationale: 对应农事周期中的播种期与收获期，采用自然且准确的现代汉语表达。
- source_word: አይትኀደግ
  choice: 必不止息
  rationale: 该否定动词表达不会停止；“必不止息”保留庄重语体及明确的将来持续意味。
- source_word: ቍር፡ ወሙቀት
  choice: 寒冷和炎热
  rationale: 保留原文成对并列的气候现象，不将其窄化为特定季节。
- source_word: ሐጋይ፡ ወክረምት
  choice: 夏季和冬季
  rationale: 依上下文及传统季节对应译为“夏季和冬季”，与前一组“寒冷和炎热”保持区别。
- source_word: ኢይወልጡ፡ ሥርዓቶሙ
  choice: 都不会改变各自的规律
  rationale: 复数物主形式指上述各项各自既定的秩序或规律；“规律”在现代汉语中自然，也保留受造秩序之意。
- source_word: ወኢይትኀደጉ፡ ለዓለም
  choice: 也永远不会止息
  rationale: 保留与前文“不止息”的重复及末尾“永远”的强调，不将其合并省略。
theological_decisions:
- issue: 自然秩序的持续范围
  choice: 将“地还存留的所有日子”作为统摄后续各项的时间状语
  alternative: 把它与“播种”断开理解为独立名词串列
  rationale: 原文词序及语义更支持时间状语用法；此译也保留持续范围，而不额外推断世界永恒存在。
- issue: “规律/秩序”的主体
  choice: 理解为播种收割、冷热、季节和昼夜各自的规律
  alternative: 仅理解为昼夜的规律
  rationale: 复数形式及整句并列结构允许其回指所有列举项目；用“都”和“各自”明确呈现这一最自然的句法关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文成对列举、两个否定谓语及末尾“永远”的强调；以分号划分“不止息”与“不改变规律”两个相关分句，避免汉语长串并列造成歧义。
