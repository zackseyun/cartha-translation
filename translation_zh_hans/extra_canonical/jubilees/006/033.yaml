  yaml_path: translation/extra_canonical/jubilees/006/033.yaml
  text: And all the children of Israel will forget, and will not find the path of the years, and they will forget the new moons and appointed times and sabbaths, and they will go wrong as to the whole order of the years.
translation:
  language: zh_hans
  text: 以色列众子孙都必忘记，也必找不着历法的正轨；他们必忘记新月、定期和安息日，并且在历年整个秩序上走错。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎሙ፡ ውሉደ፡ እስራኤል
  choice: 以色列所有的子孙
  rationale: 贴近原文“以色列的一切子孙”，同时保持现代汉语的庄重与清晰。
- source_word: ፍኖተ፡ ዓመታት
  choice: 年序的轨道
  rationale: ፍኖት意为道路、路径；此处指按历法推移诸年的正确轨道。“年序”体现历年秩序，“轨道”保留原文路径意象。
- source_word: ሠርቀ
  choice: 朔日
  rationale: 该词在历法语境中指月初或新月之日；“朔日”比单说“新月”更准确地表达历日意义。
- source_word: ወጊዜ
  choice: 节期
  rationale: ጊዜ通常指时间、时期；在与朔日和安息日并列的历法语境中，指规定的时节或节期。译作“节期”传达其礼仪历法含义，但不额外指定具体节日。
- source_word: ሰንበተ
  choice: 安息日
  rationale: 采用现代中文圣经传统中清楚且通行的对应词。
- source_word: ኵሎ፡ ሥርዐተ፡ ዘዓመታት፡ ይጌግዩ
  choice: 在整套年序上发生错乱
  rationale: ሥርዐት表示秩序、安排；ይጌግዩ表示犯错、走偏。“发生错乱”自然表达他们对全部历年秩序的偏差。
theological_decisions:
- issue: 历法偏差的性质
  choice: 保持为对年序、朔日、节期和安息日的遗忘与错乱
  alternative: 将其解释为背弃某一特定宗派历法
  rationale: 原文强调历法秩序的失落，并未在本节详述后世宗派性的历法体系，因此不作超出文本的限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“年序的轨道”保留原文“诸年之路”的意象，同时用“朔日、节期、安息日”明确其历法语境。
