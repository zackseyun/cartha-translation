    Since, however, you politely request what is the correct (interpretation) of the resurrection, I write to you what is essential. Many surely put no faith in it. A few, however, find it. Let us then discuss the topic.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/001.yaml
  text: '[] My son Rheginos, some wish to learn many things. This is their objective when preoccupied with questions whose answers they lack. If they are successful with these, they tend to think of themselves as quite important. I, however, do not believe they have attained to the word of truth. Instead, they look out for their own satisfaction, when we have received (true satisfaction) through our Savior, our Lord Christ. [] We obtained it when we knew the truth and found our repose in it.


    Since, however, you politely request what is the correct (interpretation) of the resurrection, I write to you what is essential. Many surely put no faith in it. A few, however, find it. Let us then discuss the topic.'
translation:
  language: zh_hans
  text: '[……][a]我儿雷吉诺斯，有些人想要学习许多事。他们专心追究自己还没有答案的问题，目的就在于此。如果在这些事上有所成，他们往往就自以为了不起。但我不认为他们已经得着真理之道。相反，他们是在寻求自己的满足；而我们却已经借着我们的救主、我们的主基督得着了真正的满足。[……]我们是在认识真理，并在真理中得享安息时得着它的。


    不过，既然你谦和地询问，应当怎样正确理解复活，我就把要紧的写给你。许多人确实不信这事，然而少数人找到了它[b]。那么，我们就来讨论这个题目吧。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号中的省略号表示现存文本在这些位置有残缺，或译本无法恢复其文字。
    reason: 保留所提供见证中的文本残损信号，并让普通读者明白其含义。
  - marker: b
    text: “它”可能指复活本身，也可能指对复活的正确理解；现有见证没有明确消除这种歧义。
    reason: 保留代词指向及相关神学含义的不确定性。
lexical_decisions:
- source_word: My son Rheginos
  choice: 我儿雷吉诺斯
  rationale: 保留书信式、师长式称呼，并采用便于现代普通读者辨认的人名音译。
- source_word: the word of truth
  choice: 真理之道
  rationale: 保留“真理”与“道/话语”的语义联系，同时使中文表达庄重自然；不将其扩释成特定教义术语。
- source_word: satisfaction
  choice: 满足／真正的满足
  rationale: 前者保留对方寻求自我满足的批评；括注所表达的对照含义以“真正的满足”呈现，但不进一步界定其性质。
- source_word: repose
  choice: 安息
  rationale: 兼顾停止追寻、内在安定与宗教语域，避免弱化为一般的“休息”。
- source_word: the correct (interpretation) of the resurrection
  choice: 应当怎样正确理解复活
  rationale: 以自然中文表达括注所提示的“解释／理解”，同时不预先规定复活的具体性质。
- source_word: find it
  choice: 找到了它
  rationale: 保留代词所指不明的状态，不擅自改成“相信复活”或“找到正确解释”。
theological_decisions:
- issue: “满足”如何借着救主、主基督而得
  choice: 保持原见证的对照与简略表达
  alternative: 扩写为得救、知识或属灵圆满等特定体系
  rationale: 该段没有明确界定“满足”的教义内容，不应导入宗派或特定解释传统。
- issue: “少数人找到了它”中“它”的所指
  choice: 正文保留代词，并以脚注说明歧义
  alternative: 明确译为“少数人找到了复活的真义”或“少数人得着了复活”
  rationale: 现有见证允许不止一种理解；保留张力比替作者作出判定更忠实。
- issue: “复活”的性质
  choice: 仅译作“复活”，不在引言中加以物质化或灵意化限定
  alternative: 译成“身体复活”或“属灵复活”
  rationale: 本段只是提出论题，尚未在这里解决其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书信论述语体。因科普特语原文复核尚未完成，本稿是依据所提供公共领域英译见证形成的暂定译文；对残缺处、括注和代词歧义采取保守处理。
