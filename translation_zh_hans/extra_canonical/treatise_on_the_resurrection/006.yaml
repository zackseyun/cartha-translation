review_pass:
  verdict: revise
  source_fidelity: 整体忠实反映所提供英语见证的论证、重复和宇宙论对照，也审慎保留了“救恩”的括注及关键缺文。不过，“全体才是被保存的”的“才是”加入了原文没有的排他/强调意味；末句以“在……形成”处理缺文，既未直观保留英语见证的方括号，也使“come into being”的否定结构不够清楚。
  naturalness: 译文总体庄重、清楚，适合现代书面普通话。“为得救恩和救赎而蒙拣选”比“蒙拣选，得着救恩和救赎”更准确地表达目的关系；“全体却是”也比“全体才是”自然且不增义。
  terminology: “圆满”“全体”“脱离出去”“被保存”均可作为暂定的开放性对应，未强加特定教义解释。“圆满的体系”保留 Fullness 的可能术语性；脚注提示恰当。缺文应用方括号而非省略号标示，以与英语见证及项目惯例一致。
  issues:
  - severity: medium
    issue: “全体[b]才是被保存的”中的“才是”增添排他性强调。
    rationale: 英语见证为“The All, however, is what is preserved”，其中 however 表示转折，并非“只有全体才被保存”。改为“全体……却是被保存的”可保留转折而不添加限定。
  - severity: medium
    issue: 末句未以方括号直接标示源见证的缺文，且“并非在……形成”句法和语义不够贴合。
    rationale: 英语见证明确写作“did not [] come into being”。译为“并非[]产生”保留缺文位置与否定的“产生/成为”概念；不应以省略号取代方括号。
  - severity: low
    issue: “蒙拣选，得着救恩和救赎”较易读成拣选之后取得结果，而非“chosen for”的目的关系。
    rationale: “为得救恩和救赎而蒙拣选”更直接对应 for，同时不改变该句关于拣选与预定的开放性。
  revised_text: 得救之人所思想的，必不消亡。那些认识了（救恩）的人，他们的心思必不消亡。因此，我们为得救恩和救赎而蒙拣选；因为从起初就已经预定，我们不会陷入无知之人的愚昧，反而会进入认识真理之人的智慧。他们所持守的真理，确实不能失落，也绝不会失落。圆满的体系[a]是坚固的；那脱离出去、成为世界的，却是软弱的。然而，全体[b]却是被保存的。它并非[]产生；它早已存在。
  revised_footnotes:
  - marker: a
    text: “圆满”可能是本文宇宙论中的专门用语；由于科普特语原文复核尚未完成，此处暂依现有公共领域英语见证译出。
    reason: 提醒读者该词可能具有技术含义，并交代当前底本限制。
  - marker: b
    text: “全体”也可理解为“万有”或“整体”；这里保留其抽象、整体性的表达。
    reason: 保存 the All 的术语性与语义开放度。
  - marker: c
    text: 方括号所示位置在所据英语见证中有文本残缺或复原不确定；未补入任何可确定的文字。
    reason: 忠实标示抄本损坏或复原不确定性，避免无依据补文。
