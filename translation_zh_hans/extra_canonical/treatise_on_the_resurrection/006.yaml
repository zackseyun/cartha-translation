base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/006.yaml
  text: What those who are saved have thought will not perish. The minds of those who have known (salvation) will not perish. Therefore, we were chosen for salvation and redemption, because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but would enter into the wisdom of those who know the truth. The truth they preserve cannot and will not be lost. The system of the Fullness is strong. What broke loose and became (the) world is weak. The All, however, is what is preserved. It did not [] come into being; it already existed.
translation:
  language: zh_hans
  text: 得救之人所思想的，必不消亡。那些认识了（救恩）的人，他们的心思必不消亡。正因如此，我们蒙拣选，得着救恩和救赎；因为从起初就已经预定，我们不会陷入无知者的愚昧，反而会进入认识真理之人的智慧。他们所持守的真理，确实不能失落，也绝不会失落。圆满的体系[a]是坚固的；那脱离出去、成为世界的，却是软弱的。然而，全体[b]才是被保存的。它并非在……[c]形成；它早已存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圆满”可能是本文宇宙论中的专门用语；由于科普特语原文复核尚未完成，此处暂依现有公共领域英语见证译出。
    reason: 提醒读者该词可能具有技术含义，并交代当前底本限制。
  - marker: b
    text: “全体”也可理解为“万有”或“整体”；这里保留其抽象、整体性的表达。
    reason: 保存 the All 的术语性与语义开放度。
  - marker: c
    text: 方括号所示位置在所据英语见证中有文本残缺或复原不确定；省略号不代表可确定补出的文字。
    reason: 忠实标示抄本损坏或复原不确定性，避免无依据补文。
lexical_decisions:
- source_word: thought / mind
  choice: 所思想的／心思
  rationale: 英语见证在相邻两句中分别使用 thought 和 mind；译文保留这一差别，不强行统一为某个哲学或神学术语。
- source_word: known (salvation)
  choice: 认识了（救恩）
  rationale: 保留见证中的括号及其补足性质，不把“认识”单纯改写为“经历”或“获得”，以免消解原文可能具有的认识论意味。
- source_word: predetermined
  choice: 已经预定
  rationale: 直接表达事情从起初已被确定，同时不额外引入有关预定方式或范围的宗派性解释。
- source_word: system of the Fullness
  choice: 圆满的体系
  rationale: 以“圆满”表达 Fullness 的整体、完备含义，以“体系”对应 system；因科普特语复核尚未完成，以脚注提示此处也可能是专门宇宙论用语。
- source_word: broke loose
  choice: 脱离出去
  rationale: 保留从原有整体中分离或挣脱的动态含义，不进一步断定其主体、原因或道德性质。
- source_word: the All
  choice: 全体
  rationale: 使用可指万有整体的凝练名词，并以脚注说明它在本文语境中可能带有术语性质。
- source_word: preserved
  choice: 被保存
  rationale: 沿用被动表达，不擅自补出保存者，也保留与前文“持守／失落”的语义关联。
theological_decisions:
- issue: 拣选、预定与人的认识之间的关系
  choice: 依见证顺序直译为“我们蒙拣选……因为从起初就已经预定”
  alternative: 解释为某种特定的无条件拣选、预知拣选或灵魂先存论
  rationale: 文本本身陈述拣选与预定，却未说明其机制；译文保留这种神学张力，不导入后世宗派体系。
- issue: “圆满”与“世界”的关系
  choice: 保留“圆满的体系”与“脱离出去、成为世界的”之间的对照
  alternative: 把“圆满”明确等同于神界，或把“世界”明确判定为邪恶物质界
  rationale: 英语见证支持强弱及整体与分离之间的对照，但不足以支持更具体的本体论判定。
- issue: 全体是否受造
  choice: 译为“它并非在……形成；它早已存在”
  alternative: 补足残缺处并明确宣称全体绝对永恒或自有永有
  rationale: 见证在关键位置标示缺文；译文不以教义推断填补缺口，只保留其与“早已存在”的对照。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式尽量清晰，同时保留原段落的抽象论述、平行结构和“圆满／世界／全体”等概念张力。当前仅能依据所提供的公共领域英语见证起草，科普特语源文复核仍待完成，因此对可能的技术术语和缺文均作审慎标注。
