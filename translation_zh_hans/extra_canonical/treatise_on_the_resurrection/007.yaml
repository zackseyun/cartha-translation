translation:
  language: zh_hans
  text: '所以，我儿雷吉诺斯啊，绝不要怀疑复活！因为即使你从前并不是活在肉身中，你进入这个世界时，还是取了肉身。


    那么，当你（返回并）升入永世[a]时，为什么不会取肉身呢？那比肉身更好的，正是使人得生命的。那为你而形成的，难道不属于你吗？属于你的，难道不是与你同在吗？不过，当你在这个世界时，你还缺少什么呢？这正是你竭力想要发现的。


    身体的余生[b]就是衰老，而你正处于必死的状态。你所缺少的是一种收获；因为你若离去，就不会失去那最好的。较差的会衰败，但它仍有恩典。


    所以，没有什么能把我们从这个世界救赎出来。然而，我们就是万有[c]，因此我们得救了。我们从起初到末了都已经得着救恩。让我们这样思想，也这样领悟。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永世”所译的词常音译为“爱安”或“艾安”（aeon），可指一个世代、永恒领域，也可能是相关思想体系中的神圣实体或层域。此处含义尚待科普特文复核。
    reason: 保留关键术语的多义性，避免以单一中文概念定死。
  - marker: b
    text: 底本英语见证作“身体的胎衣／后产物”（the afterbirth of the body），措辞异常。这里暂译“身体的余生”；也可能意指身体后来产生的结果，即衰老。
    reason: 公开说明见证文本的困难与暂定处理，不把不确定解释伪装成确定原文。
  - marker: c
    text: “万有”可能是专门术语，指整体、圆满或一切存在。原句也可直译为“我们是那一切／那整体”。
    reason: 提示专名可能性，并保留本体论陈述的歧义。
lexical_decisions:
- source_word: flesh
  choice: 肉身
  rationale: 既保留身体性的含义，也符合中文宗教与哲学语境；不简化为“身体”，以免抹去原文论证中“肉身”与其上之物的张力。
- source_word: aeon
  choice: 永世
  rationale: 采用可读而仍具专门色彩的译法；该词在相关思想语境中可能兼指永恒领域、世代或神圣实体，故以脚注保留歧义。
- source_word: what causes life
  choice: 使人得生命的
  rationale: 保留因果关系，同时避免擅自指明其主体是灵、心或某一神圣实体。
- source_word: afterbirth of the body
  choice: 身体的余生
  rationale: 此处英语见证的“afterbirth”语义反常，可能是“身体后来所生/所余之物”的比喻；正文采用较通顺但仍不完全释义的表达，并以脚注说明。
- source_word: the All
  choice: 万有
  rationale: 用“万有”表达整体、圆满或一切存在，不将其预先解释为特定神学体系中的专名；同时加脚注提示其可能具有术语性质。
- source_word: grace
  choice: 恩典
  rationale: 保留原文正面的宗教性用语，不改译成较弱的“好处”或“宽待”。
theological_decisions:
- issue: 升入永世时是否“取肉身”
  choice: 保留“取肉身”的明确说法
  alternative: 译作“重新获得身体”或解释为纯属灵的复活
  rationale: 见证文本本身把进入世界时取肉身与升入永世时取肉身相对照；不应为配合某种复活论而消解其张力。
- issue: “我们就是万有”与得救的关系
  choice: 按原句保留身份陈述及其推论
  alternative: 释为“我们属于万有”或“我们与万有联合”
  rationale: 英语见证明确作“We ... are the All”；虽其形上学含义不明，仍不宜擅自弱化或体系化。
- issue: “没有什么能救赎我们”与“我们得救了”的表面矛盾
  choice: 保留相邻的张力
  alternative: 补出某个外在救赎者，或将前句改成“世上没有任何东西”
  rationale: 原文可能意在否定来自世界的救赎，也可能有更特殊的宇宙论含义；在科普特文复核前不补足原文没有明说的限定。
- issue: 救恩的时态与范围
  choice: 译为“从起初到末了都已经得着救恩”
  alternative: 译为“我们终将完全得救”
  rationale: 保留见证文本的完成性表达及“从起初到末了”的全程范围，不转化为单纯未来事件。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。称呼“我儿雷吉诺斯啊”保留教导文体的亲切与郑重。鉴于科普特原文复核尚未完成，本稿以所给公共领域英语见证为暂定依据；括号中的“（返回并）”照见证保留，所有较大的文本与术语不确定性均以脚注标明。
