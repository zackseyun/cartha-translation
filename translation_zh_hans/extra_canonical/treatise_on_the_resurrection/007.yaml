review_pass:
  verdict: revise
  source_fidelity: 在所提供的英语见证范围内，草稿整体保留了论证次序、反问形式和若干刻意的张力；但有几处将见证的开放表达过度具体化，如把“aeon”译为“永世”、在“causes life”中加入“人”，以及将异常的“afterbirth of the body”译成“身体的余生”。科普特原文尚待复核，故修订避免把这些困难处解释为确定含义。
  naturalness: 原稿庄重、可朗读，但“身体的余生就是衰老”在现代汉语中既不自然，也容易被理解为身体剩余的寿命。修订以“身体所生的后续之物是衰老”保留其生育／后生意象，并用脚注说明其为临时直译。
  terminology: “肉身”“复活”“恩典”“救恩”“万有”可保留。“爱安”比“永世”更能保留 aeon 的术语性及其未决语义；“万有”以注释说明其可能是专门性整体概念，而不作体系化解释。
  issues:
  - severity: medium
    issue: “永世”将 aeon 的含义固定化。
    rationale: 英语见证特意保留 aeon，且括号提示该术语未决；“永世”主要导向时间性的永恒，可能遮蔽其作为世代、领域或实体的可能。
  - severity: medium
    issue: “使人得生命的”无根据地加入“人”。
    rationale: 见证仅称“what causes life”；应保留“生命”而不限定生命的承受者。
  - severity: high
    issue: “身体的余生”误导 afterbirth of the body 的异常措辞。
    rationale: “余生”通常指剩余寿命，偏离 afterbirth 的“后生之物／产后之物”字面意象，并将困难语句改写成另一种明确意思。
  - severity: low
    issue: “即使你从前并不是活在肉身中”弱化了条件句的假设性。
    rationale: 见证为“if you once did not live in flesh”；“如果你从前不曾活在肉身中”更直接保留其条件结构。
  - severity: low
    issue: “一种收获”对“a gain”的表达较实物化。
    rationale: 此处是悖论式断言；“反而是所得”更自然，并保留“缺少”与“获得”之间的张力。
  revised_text: '所以，我儿雷吉诺斯啊，绝不要怀疑复活！因为，如果你从前不曾活在肉身中，你进入这个世界时就取了肉身。


    那么，当你（返回并）升入爱安[a]时，为什么不会取肉身呢？比肉身更好的，正是使生命得以存在的。那为你而成的，难道不属于你吗？属于你的，难道不与你同在吗？不过，当你在这个世界时，你还缺少什么呢？这正是你一直竭力要发现的。


    身体所生的后续之物[b]是衰老，而你正处于必死的状态。你所缺少的，反而是所得；因为你若离去，就不会失去那最好的。较差的会衰败，但它仍有恩典。


    所以，没有什么能把我们从这个世界救赎出来。然而，我们就是万有[c]，因此我们得救了。我们从起初到末了已经得着了救恩。让我们这样思想，也这样领悟。'
  revised_footnotes:
  - marker: a
    text: “爱安”音译 aeon。该词可指世代、永恒的领域，或在相关思想语境中的实体或层域；由于科普特文尚待复核，此处不将其限定为单一含义。
    reason: 保留英语见证特意保留的术语及其多义性。
  - marker: b
    text: 英语见证作“the afterbirth of the body”（直译近于“身体的后生之物／产后之物”），措辞异常。“身体所生的后续之物”是为保留其字面意象的暂译；本句究竟如何理解，仍须依据科普特文复核。
    reason: 避免“余生”所造成的“剩余寿命”误解，同时不把难句解释为确定意思。
  - marker: c
    text: “万有”对应“the All”，可能指整体、圆满或一切存在；也可较直译为“那一切／那整体”。
    reason: 提示可能的术语性，保留身份陈述的本体论歧义。
  revision_rationale: 修订以所给公共领域英语见证为暂定审校基准。主要改动是恢复条件句与原文的开放性，避免增添“人”等限定，并在 afterbirth 难句上采用较贴近字面而不误导为“余生”的表达。保留“（返回并）”及“我们就是万有”与“没有什么能把我们从这个世界救赎出来”之间的张力，不引入特定教义解释。
