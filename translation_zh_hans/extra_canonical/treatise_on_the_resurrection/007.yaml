review_pass:
  verdict: revise
  source_fidelity: 依所提供的英语见证逐句复核，整体结构、反问链、括号中的“返回并”、以及末段的张力均已大体保留。仍有几处需修正：英语的“if you once did not live in flesh”不是让步关系，宜译“若你从前不曾活在肉身中”；“what causes life”并未限定为“使人得生命”，宜保留较宽的“使生命发生/产生生命”；“afterbirth of the body”应保留其异常的生育意象，不能改为“余生”；“nothing can redeem us from this world”中的“from this world”应明确为“从这世界中”。
  naturalness: 原稿庄重可读，但“身体的余生就是衰老”既偏离见证的反常措辞，也使中文逻辑生硬。“当你在这个世界时”可顺为“你还在这世界上的时候”。其余行文适合现代书面普通话。
  terminology: “肉身”“复活”“恩典”“救恩”“万有”可保留。“aeon”译作“永世”容易将可能指“世代/时代”或专门宇宙论领域的词义固定为永恒；采用“永世（aeon）”并以脚注说明较稳妥。“雷吉诺斯”可沿用，音译本身无须改动。
  issues:
  - severity: medium
    issue: “即使你从前并不是活在肉身中”将条件句译成让步句。
    rationale: 英语见证为“if you once did not live in flesh”，宜保留“若/如果”的条件关系，而非预设后的让步关系。
  - severity: medium
    issue: “使人得生命的”增加了“人”并将“life”的宽泛含义收窄。
    rationale: 见证仅说“what causes life”；上下文虽涉及人，但此处不必补出受益者。
  - severity: high
    issue: “afterbirth of the body”译为“身体的余生”，抹除了见证文本明确而困难的“后产/胎衣”意象。
    rationale: 即使该措辞异常，正文也应尽量保留其字面张力；以脚注标示暂译和语义困难，胜过转换为不相同的“余生”。
  - severity: medium
    issue: “没有什么能把我们从这个世界救赎出来”可被理解为世界是被救赎的来源或对象，介词关系不够清楚。
    rationale: 将“from this world”译为“从这世界中”更直接保留离开/脱离该世界的方向。
  revised_text: '所以，我儿雷吉诺斯啊，绝不要怀疑复活！因为，若你从前不曾活在肉身中，你进入这世界时却取了肉身。


    那么，当你（返回并）升入永世[a]时，为什么不会取肉身呢？比肉身更好的，乃是使生命产生的。那为你而形成的，难道不属于你吗？属于你的，难道不与你同在吗？不过，你还在这世界上的时候，还缺少什么呢？这正是你一直竭力要发现的。


    身体的后产[b]是衰老，而你处于必死的状态。你所缺少的，乃是一种收获；因为你若离去，就不会失去那最好的。较差的会衰败，但它仍有恩典。


    所以，没有什么能把我们从这世界中救赎出来。然而，我们就是万有[c]，因此我们得救了。我们从起初到末了都已经得着救恩。让我们这样思想；让我们这样领悟。'
  revised_footnotes:
  - marker: a
    text: “永世”译自 aeon，亦常音译为“爱安”或“艾安”。该词可指世代、时代、永恒领域，也可能指相关思想体系中的神圣实体或层域；此处确义仍待科普特文复核。
    reason: 保留 aeon 的多义性，避免将其固定解释为单一的“永恒”概念。
  - marker: b
    text: 底本英语见证作“the afterbirth of the body”，直译可作“身体的后产”。此语措辞异常，可能指身体随后产生的东西，或以生育意象指向衰老；此处暂保留其字面陌生感，待科普特文复核。
    reason: 纠正“余生”对 afterbirth 生育意象的遗漏，并如实标示文本困难。
  - marker: c
    text: “万有”可能是专门术语，指整体、圆满或一切存在；原句也可直译为“我们是那一切／那整体”。
    reason: 提示其术语可能性，并保留本体论陈述的歧义。
  revision_rationale: 修订严格依提供的公共领域英语见证进行，不对尚待复核的科普特语做超出证据的重构。主要恢复条件句、life 的未限定性、afterbirth 的异常字面意象，以及“从这世界中”的方向关系；同时保留原见证中“取肉身”、万有与得救之间的关系，以及相邻句的张力。
