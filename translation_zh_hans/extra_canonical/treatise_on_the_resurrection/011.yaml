translation:
  language: zh_hans
  text: '这一切都是我从我的［……］主耶稣基督的恩慈中领受的。我的孩子们，关于这些事，我已经教导了你们和你们的弟兄姊妹；凡能使你们坚固的事，我一样也没有忽略。不过，我对这道的解释中，若有什么写得晦涩，你们只管问，我就会向你们说明。


    不过现在，你们不必急于把这篇文字传给你们中间的任何人，因为它能带来帮助。[a]


    许多人正在探究我写给你们的那些问题。对于这些人，我说：愿平安与恩典临到他们。


    我向你们，以及那些以弟兄姊妹之爱爱你们的人问安。


    《论复活》'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句依现有英语见证翻译。原句“不必急于分享”与随后“因为它能带来帮助”之间的逻辑关系并不明确；在科普特语原文复核完成前，暂不改写以消除这一张力。
    reason: 标示底本中真实且影响理解的歧义，同时避免无依据地校改。
lexical_decisions:
- source_word: graciousness
  choice: 恩慈
  rationale: 既保留来自主的仁慈与恩惠之意，也避免把词义过度限定为某一套教义术语。
- source_word: the word
  choice: 这道
  rationale: 保留其可能指教导、论述或神圣之“道”的歧义；用“这道”而不径自解释为某一特定含义。
- source_word: strengthen
  choice: 使你们坚固
  rationale: 采用自然且庄重的宗教语体，表达巩固信念或生命的宽泛含义。
- source_word: brothers and sisters
  choice: 弟兄姊妹
  rationale: 以现代汉语中常见的包容性群体称谓传达原见证所明示的男女共同体。
- source_word: looking into
  choice: 探究
  rationale: 保留调查、思考和研究相关问题的开放含义。
- source_word: love of brothers and sisters
  choice: 弟兄姊妹之爱
  rationale: 表达共同体成员间亲如手足的爱，不额外引入宗派性术语。
theological_decisions:
- issue: “the word”的所指
  choice: 译作“这道”并保留开放性
  alternative: 译作“这番话”“教义”或“圣言”
  rationale: 现有依据仅为英语见证，直接科普特语复核尚未完成；不应提前判定它特指本文论述、基督教教义或神圣的道。
- issue: 分享文本的劝告与“because it can be helpful”之间的逻辑张力
  choice: 正文直译，并加脚注说明可能存在的文本或翻译不确定性
  alternative: 擅自改为“不要不愿分享”或“要分享”以使逻辑顺畅
  rationale: 现有见证表面上同时说“不必急于分享”和“因为它能带来帮助”，应保存这种张力，不静默修正。
- issue: 恩慈的来源
  choice: “从……主耶稣基督的恩慈中领受”
  alternative: “靠着……主耶稣基督的恩典得到”
  rationale: 保留来源关系及“graciousness”较宽的语义，不把它完全术语化为“恩典”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。方括号中的空缺信号保留为“［……］”，以表示手稿残缺或待复原处。正文仅收入作品结语和题名；网页的常见问题、联系方式与广告声明属于后加编辑材料，未纳入。此稿依据所提供的公共领域英语见证拟定，尚待科普特语原文直接复核。
