    不过现在，你们不要急着把这事与任何一个你们中间的人分享，因为它能带来帮助。[a]


    许多人正在探究我写给你们所论及的那些事。对于这些人，我说：愿平安与恩典临到他们。


    我向你们，以及那些以弟兄姊妹之爱爱你们的人问安。


