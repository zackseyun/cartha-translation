  english_witness: 'There are some, however, who in the course of their investigation, wish to understand if one who is saved, when discarding the body, will be saved immediately. Let none doubt concerning this. [...]. In fact, the visible limbs that are dead [] shall not be saved, for (in that case) the living [limbs] that exist in them would rise.


    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/008.yaml
  text: 'There are some, however, who, in the course of their investigation, want to understand whether a person who is saved will be saved immediately upon casting off the body. Let no one doubt this. [...]. In fact, the visible limbs that are dead [] will not be saved, for in that case the living [limbs] that exist within them would rise.


    Then what is the resurrection? It is the continuing revelation of those who have risen. For if you remember reading in the gospel that Elijah appeared, with Moses beside him, do not think that the resurrection is an illusion. It is no illusion; rather, it is a reality! In fact, it would be more accurate to say that the world is an illusion than to say that the resurrection—which has taken place through our Lord, the Savior, Jesus Christ—is an illusion.'
translation:
  language: zh_hans
  text: '然而，有些人在探究的过程中，想要明白：一个得救的人脱去身体时，是否会立刻得救。谁也不要对此怀疑。[…]。事实上，那些已经死去、看得见的肢体[]不会得救；不然，存在于其中的活的[肢体]就会复起。


    那么，什么是复活？复活就是那些已经复起之人的持续显现。因为，你们若还记得福音书中记载以利亚显现，摩西也和他一同出现，就不要以为复活是幻象。复活不是幻象，而是真实！事实上，与其说那借着我们的主、救主耶稣基督已经成就的复活是幻象，倒不如说这世界是幻象更为准确。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段据所提供的公版英文见证暂译，尚待科普特语原文复核。原见证中的“[…]”和“[]”表示抄本缺损或校补位置；方括号内的“[肢体]”表示译者补出的词。
    reason: 明确译文依据及文本缺损情况，避免读者把残缺或补词误认为完整可靠的抄本文本。
lexical_decisions:
- source_word: discarding the body
  choice: 脱去身体
  rationale: 保留身体如同可脱下之物的原文意象，同时不用“死亡”等解释性词语取代其含混表达。
- source_word: saved immediately
  choice: 立刻得救
  rationale: 直译时间副词与救恩用语，不擅自说明这里所指的是灵魂、身体或末世阶段。
- source_word: visible limbs
  choice: 看得见的肢体
  rationale: 保留“visible”与“limbs”的具体措辞，不概括为“肉身”，以免抹平后文活肢体与死肢体之间的张力。
- source_word: would rise
  choice: 就会复起
  rationale: 采用“复起”以保留与“复活”同一语义场的关联，同时避免将此处直接等同于完整的教义术语。
- source_word: continuing revelation
  choice: 持续显现
  rationale: 这里更像已经复起之人的继续呈现或显露；“显现”自然且能与随后以利亚、摩西的出现相呼应。
- source_word: illusion
  choice: 幻象
  rationale: 表达不真实、仅为表象之意，并保留作者将复活与世界相比较的强烈修辞。
- source_word: reality
  choice: 真实
  rationale: 与“幻象”形成清楚对照；不扩充为“客观事实”，以免加入现代哲学限定。
- source_word: has come to pass through our Lord
  choice: 借着我们的主……已经成就
  rationale: 保留完成意义及“借着”的中介表达，不把施事关系解释得超过现有见证。
theological_decisions:
- issue: 脱去身体后是否立即得救
  choice: 保留问句与“不要怀疑”的断言，不说明其具体救恩次序
  alternative: 译成“灵魂离体后立即进入完全救恩”
  rationale: 见证文本没有明确使用“灵魂”或系统说明中间状态；添加这些内容会消除原有张力。
- issue: 死去的可见肢体不会得救
  choice: 按现存英文见证保留这一困难陈述
  alternative: 协调为“死去的身体也必复活得救”
  rationale: 原段自身的论证关系晦涩，且抄本有缺损信号；不应以某种复活教义改写文本。
- issue: 复活是已复起者的持续显现
  choice: 以“持续显现”表达
  alternative: 译为“复活是复活者不断得到启示”或“复活的启示仍在继续”
  rationale: 英语见证的语法允许一定歧义；结合以利亚与摩西“显现”的例证，“持续显现”较连贯，但仍需科普特语复核。
- issue: 世界与复活何者是幻象
  choice: 保留原文夸张式比较，不将“世界是幻象”改写为绝对教义断言
  alternative: 直接断言物质世界本质上虚假
  rationale: 句式是“与其说……倒不如说……”的修辞比较，并非必然在建立完整的世界观体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原见证的省略号、空方括号和补词方括号；为确保脚注标记在正文出现，将文本依据与缺损说明合并为[a]。鉴于科普特语审校尚未完成，本稿避免对“得救”“肢体”“持续显现”等难句作教派化或体系化解释。
