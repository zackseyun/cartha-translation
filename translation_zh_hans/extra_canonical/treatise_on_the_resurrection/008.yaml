review_pass:
  verdict: revise
  source_fidelity: 总体忠实保留了英文见证的论证次序、残缺标记、复活／复起的关联，以及“世界是幻象”这一比较性修辞。但将“continuing revelation”译作“持续显现”把“启示／揭示”的核心词义收窄为人物的出现；后文的以利亚和摩西可构成例证，却不足以安全地替换该词。
  naturalness: 译文整体庄重、通顺，适合现代标准汉语。“那些已经复起之人的持续启示”虽保留原文语义上的关系不够明确，但可用“那些已经复起之人所持续得到的启示”会增加原文没有的受事关系。因此采用“那些已经复起之人的持续启示”，保留其必要的含混。另将“摩西也和他一同出现”调整为“摩西也与他同在”，较贴近“with him”，避免不必要的重复。
  terminology: “得救”“身体”“肢体”“复活”“幻象”“真实”“主、救主耶稣基督”等处理可保留。“复起”作为与“复活”相联而又不完全等同的表达可以接受。将“revelation”统一落实为“启示”，避免以解释性较强的“显现”替代。
  issues:
  - severity: medium
    issue: “continuing revelation”译为“持续显现”
    rationale: 英文见证明确使用“revelation”，而非“appearance”。“显现”虽受后文人物显现的语境支持，却改变了核心名词的语义，且消除了原句关于“启示”与“已复起者”之间关系的含混。应译为“持续启示”。
  - severity: low
    issue: “Moses with him”译为“摩西也和他一同出现”
    rationale: 该译法可理解，但“一同出现”重复了前面的“显现”，并比“with him”多强调了出现这一动作。“摩西也与他同在”更紧凑且更贴近见证措辞。
