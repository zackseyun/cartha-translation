review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所提供的英文见证，并妥善保留了省略号、空方括号和补词方括号。惟“continuing revelation”译为“持续显现”把“启示／揭示”改为“出现”，虽与下文人物显现有关联，却未保留见证文本的核心用词和歧义，宜改正。
  naturalness: 行文总体庄重、自然。“已经复起之人的持续启示”略显抽象，但能保留原文的困难句法与语义，不应为顺畅而过度释义。其余句式可作轻微调整，使连接更自然。
  terminology: “得救”“身体”“肢体”“复活”“幻象”“真实”“主、救主耶稣基督”等术语使用稳妥。“复起”用于肢体“would rise”可保留，以区别该段的“复活”。
  issues:
  - severity: medium
    issue: “continuing revelation”被译作“持续显现”。
    rationale: 英文见证明言“revelation”，而非“appearance”。下文以以利亚和摩西显现为例，不能据此将名词直接改译为“显现”。应译作“持续的启示”，以保存原文可能的“启示／揭示”含义及其晦涩性。
  - severity: low
    issue: “福音书中记载”较“reading in the gospel”稍增书写／记载的表述。
    rationale: 可译为“在福音中读到”，更贴近见证文本，且不预设此处特指哪一卷福音书。
  revised_text: '然而，有些人在探究的过程中，想要明白：一个得救的人脱去身体时，是否会立刻得救。谁也不要对此怀疑。[…]。事实上，那些可见的、已经死去的肢体[]不会得救；不然，存在于其中的活的[肢体]就会复起。


    那么，什么是复活？复活就是那些已经复起之人持续得到的启示。因为，若你们记得曾在福音中读到以利亚显现，摩西也与他一同显现，就不要以为复活是幻象。复活不是幻象，而是真实！事实上，与其说那借着我们的主、救主耶稣基督已经成就的复活是幻象，倒不如说这世界是幻象更为准确。[a]'
  revised_footnotes:
