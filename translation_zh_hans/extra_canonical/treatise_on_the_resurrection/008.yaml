    reason: 说明译文暂依英文见证，并保留省略号和方括号所标示的文本不确定性及补词。
  revision_rationale: 将“持续显现”改为“持续得到的启示”，以对应英文见证的“continuing revelation”，同时以“得到的”使中文所有关系较明确，而不界定启示的来源、内容或神学机制。将“福音书中记载”调整为“在福音中读到”，更贴近见证文本。其余难解的肢体、得救与复起表述均予保留，不作教义协调。
