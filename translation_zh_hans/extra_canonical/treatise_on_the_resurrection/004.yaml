base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/004.yaml
  text: Then, as the apostle truly said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” If we live visibly in this world, we wear this world. We are his radiant beams, and we remain with him until our setting—that is, our death in this life. Through him we are drawn to heaven, like rays drawn by the sun, with nothing holding us back. This is the spiritual resurrection, [] swallowing up the soul just as it swallows up the flesh.
translation:
  language: zh_hans
  text: 于是，正如使徒确实说过的：“我们与他一同受苦，与他一同复活，也与他一同升到天上。”如今，我们若有形有体地活在这个世界，就披戴着这个世界。我们是他光辉的射线，并且一直与他同在，直到我们落下的时候，也就是我们在今生死去之时。借着他，我们被吸引到天上，如同光线被太阳吸引，不受任何事物阻拦。这就是属灵的复活，[a]吞没灵魂，正如它吞没肉身一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处抄本有缺损或尚未复原的空缺；缺失内容可能影响本句与下文的衔接。
    reason: 原始材料以空方括号标示抄本损坏或未复原缺文，正文必须显式标注。
lexical_decisions:
- source_word: visibly live
  choice: 有形有体地活
  rationale: 依据现有英文见证，表达在可见、具身的现世中生活，避免仅译为“明显地活着”所产生的歧义。
- source_word: wear this world
  choice: 披戴着这个世界
  rationale: 保留“穿戴”这一鲜明隐喻，不将其解释性改写为“属于”或“适应”世界。
- source_word: radiant beams
  choice: 光辉的射线
  rationale: 保留随后太阳与光线比喻之间的词汇呼应。
- source_word: setting
  choice: 落下的时候
  rationale: 保留光线或日落的意象，并由原文紧接的解释“也就是……死去之时”明确所指。
- source_word: drawn to heaven
  choice: 被吸引到天上
  rationale: 保留被动与牵引意象，不强化为主动“升天”。
- source_word: spiritual resurrection
  choice: 属灵的复活
  rationale: 采用现代汉语宗教文献中自然且准确的表达，并保留其与肉身、灵魂关系中的神学张力。
- source_word: swallowing up
  choice: 吞没
  rationale: 保留强烈的吞噬、消纳意象，不解释为“拯救”“改变”或“取代”。
theological_decisions:
- issue: 与基督一同受苦、复活、升天的时态和现实性
  choice: 按引语译为已经发生的共同经历
  alternative: 译为将来的盼望或纯象征性经历
  rationale: 现有见证使用过去时；译文不将其系统化为某一特定末世论。
- issue: 属灵复活与灵魂、肉身的关系
  choice: 保留“吞没灵魂，正如它吞没肉身一样”
  alternative: 解释为灵魂得救、肉身被抛弃，或二者都被更新
  rationale: 原句本身具有神学张力，且缺文可能影响句法，不宜擅自消解。
- issue: 由他吸引到天上的施事关系
  choice: “借着他，我们被吸引到天上”
  alternative: “他把我们带到天上”
  rationale: 保留介词结构与被动语态，使“他”究竟是媒介还是直接施事的细微开放性不被过度限定。
translation_notes:
  register: 采用庄重而现代的标准普通话；保留“披戴”“射线”“落下”“吞没”等核心隐喻。由于科普特语原文审校尚待完成，本稿以所提供的公版英文见证为暂定依据，避免对缺文及神学含义作超出证据的补足。
