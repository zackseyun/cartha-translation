review_pass:
  verdict: revise
  source_fidelity: 依据所提供的英文见证，译文总体忠实保留了共同受苦、复活及升天的完成时引语、“穿戴世界”的隐喻、光线与太阳的比喻，以及缺文后“吞没”灵魂和肉身的强烈措辞。惟“有形有体地活”略显重复且将“visibly”过度具体化为双重肉身性表述，宜改为“以可见之身活着”，以保留可见／具身的含义而不额外界定。科普特语底本尚待直接审校，故不对缺文作补足。
  naturalness: 整体庄重通顺。“以可见之身活着”比“有形有体地活在”更符合现代书面汉语，也较自然地承接“披戴这世界”。其余如“披戴”“光辉的射线”“落下之时”“吞没”均能保留原文意象与论述的凝练语气。
  terminology: “使徒”“披戴”“属灵的复活”“灵魂”“肉身”均为适切且稳定的宗教文本用语。“借着他”保留了英文见证中“By him”的媒介性及潜在施事开放性；“与他一同”准确对应共同参与的表述。
  issues:
  - severity: low
    issue: “有形有体地活在这个世界”措辞重复，并稍强化了“visibly”的肉身含义。
    rationale: 英文见证仅称“visibly live”，可指可见的、现世具身的生存状态；“有形有体”以两个近义词并列，汉语略显拗口，也可能不必要地缩窄其开放性。改为“以可见之身活着”较为简洁、自然，并保留该意象。
  revised_text: 于是，正如使徒确实说过的：“我们与他一同受苦，与他一同复活，也与他一同升到天上。”如今，我们若在这个世界上以可见之身活着，就披戴着这个世界。我们是他光辉的射线，并且一直与他同在，直到我们落下之时，也就是我们在今生死去之时。借着他，我们被吸引到天上，如同光线被太阳吸引，不受任何事物阻拦。这就是属灵的复活，[a]吞没灵魂，正如它吞没肉身一样。
  revised_footnotes:
  - marker: a
    text: 此处抄本有缺损或尚未复原的空缺；缺失内容可能影响本句与下文的衔接。
    reason: 原始材料以空方括号标示抄本损坏或未复原缺文，正文必须显式标注。
  revision_rationale: 仅作一项安全的措辞修订：将“有形有体地活在这个世界”改为“在这个世界上以可见之身活着”。修订改善汉语自然度，并避免将英文见证中较开放的“visibly”作重复且偏强的解释。保留缺文标记、全部核心隐喻、被动牵引关系及未决的神学张力。
