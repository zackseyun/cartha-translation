review_pass:
  verdict: revise
  source_fidelity: 该稿总体忠实于所提供的英文见证，并谨慎保留了末句的缺文标记及其未决的神学张力。惟“visibly live”译为“有形有体地活”将“可见地”具体化为“具身体地”，超出了现有英文见证可安全支持的范围。应保留其“可见”的表述而不预断其人类学含义。
  naturalness: 整体庄重、通顺，适合该文献的论述性语体。“我们若在这个世界上可见地活着”虽略带刻意，正好保留原文措辞的陌生性与歧义，且比“有形有体地活”更准确。将“射线”改作“光芒”可使“我们的沉落”与日光意象在现代汉语中更连贯。
  terminology: “使徒”“披戴”“属灵的复活”“灵魂”“肉身”均可保留。“借着他”恰当地维持了原见证中工具性／施事关系的开放性。缺文处应继续以脚注锚点明确标出，不补足缺失文字。
  issues:
  - severity: medium
    issue: “visibly live”译作“有形有体地活”
    rationale: “visibly”在所给英文见证中是“可见地”，并不必然等同于“有形有体”或“具身体性”。后者会将尚待直接科普特语审校的问题作解释性定论。
  - severity: low
    issue: “光辉的射线”与“落下的时候”的意象衔接略显生硬
    rationale: “光芒”在汉语中既能传达beams，也较自然地承接太阳、沉落与死亡的比喻；不改变原有意象或神学含义。
  revised_text: 于是，正如使徒确实说过的：“我们与他一同受苦，与他一同复活，也与他一同升到天上。”如今，我们若在这个世界上可见地活着，就披戴着这个世界。我们是他的光芒，并且一直与他同在，直到我们沉落之时，也就是我们在今生死去之时。借着他，我们被吸引到天上，如同光芒被太阳吸引，不受任何事物阻拦。这就是属灵的复活，[a]吞没灵魂，正如它吞没肉身一样。
  revised_footnotes:
  - marker: a
    text: 此处抄本有缺损或尚未复原的空缺；缺失内容可能影响本句与下文的衔接。
    reason: 原始材料以空方括号标示抄本损坏或未复原缺文，正文必须显式标注。
  revision_rationale: 仅作两项安全修订：以“可见地活着”取代解释性较强的“有形有体地活”，并以“光芒／沉落”使太阳光线的连续比喻更自然。保留“披戴这个世界”、与他同受苦／复活／升天的完成式陈述、被动的“被吸引”、以及末句缺文和“吞没”意象；不对缺文或其神学含义作补足。
