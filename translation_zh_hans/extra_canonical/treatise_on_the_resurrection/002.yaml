    issue: “structure”译为“形体”
    rationale: 英文见证明确用 structure，且说许多 dominions 和 divinities 在其中出现；“形体”主要指外形或实体身体，缩窄了原见证的构成性、宇宙论性含混。应译为“结构”。
  - severity: low
    issue: “把这两者都取在自己身上”表达稍显滞涩
    rationale: 虽可理解，但不够自然。调整为“将二者都取于自身”，可保留原文动作意象及后接“具有人性与神性”的说明。
  revised_text: '主在肉身中生活时，以及他显明自己是上帝的儿子之后，是怎样传讲的呢？他住在你们所住的这个地方，讲论自然之物的法则；不过，我把这法则称为“死亡”。


    雷吉诺斯啊，上帝的儿子就是人子。他将二者都取于自身，具有人性与神性。因此，一方面，他作为上帝的儿子能够驱逐死亡；另一方面，他作为人子带来了圆满界[a]的复原。这是因为，他的起源在上方；他作为真理的种子，早在他较低的结构形成以前就已存在。在这较低的结构中，出现了许多权势和神祇[b]。'
