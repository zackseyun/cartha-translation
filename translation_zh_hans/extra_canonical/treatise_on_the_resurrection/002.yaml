base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/002.yaml
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
translation:
  language: zh_hans
  text: '主在肉身中生活时，以及他显明自己是上帝的儿子之后，是怎样传讲的呢？他曾住在你们所住的这个地方，讲论自然之物的法则；不过，我把这法则称为“死亡”。


    雷吉诺斯啊，上帝的儿子就是人子。他把这两者都取在自己身上，兼有人性与神性。因此，一方面，他作为上帝的儿子能够驱逐死亡；另一方面，他作为人子带来了圆满界[a]的复原。这是因为，在他较低的形体形成以前，他就源自上方，如同真理的种子。在这较低的形体中，出现了许多权势和神祇[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圆满界”译自见证中的 Fullness，可能是专门术语，指神圣的圆满领域或状态；其确切科普特语形式尚待原文复核。
    reason: 说明大写专名的可能性及当前底本限制，避免普通读者误解为一般意义上的“完整”。
  - marker: b
    text: “权势和神祇”也可能指宇宙性的统治力量或神性存在；这里不进一步判定它们的身份或善恶。
    reason: 保留原见证的本体论含混与复数表达，不导入特定宗派解释。
lexical_decisions:
- source_word: lived in the flesh
  choice: 在肉身中生活
  rationale: 保留“肉身”这一具体而具有思想史分量的表达，同时使用现代汉语自然句式。
- source_word: law of natural things
  choice: 自然之物的法则
  rationale: 原见证语义不够明确；采用较形式对应的译法，不擅自解释为“自然法”或“必死规律”。
- source_word: took both to himself
  choice: 把这两者都取在自己身上
  rationale: “两者”回指上帝的儿子与人子（并由后文说明为人性与神性）；译文保留原文较强的取用意象，不将其系统化为后期教义术语。
- source_word: humanity and divinity
  choice: 人性与神性
  rationale: 以现代中文常用术语准确表达两种性质，同时避免增添关于其关系方式的定义。
- source_word: banish death
  choice: 驱逐死亡
  rationale: 保留原文主动排除、逐出的力度。
- source_word: Fullness
  choice: 圆满界
  rationale: 大写词在此很可能具有该文献思想体系中的专门含义；“圆满界”既传达圆满，也提示其领域性，并以脚注保留不确定性。
- source_word: structure
  choice: 形体
  rationale: 上下文把它与“源自上方”相对，并涉及其中出现的权势和神祇；“形体”可保留其构成物、较低存在形态的含混性。
- source_word: dominions
  choice: 权势
  rationale: 既可指统治力量，也可能指超人间的权能；选用不限定其本体身份的译词。
- source_word: divinities
  choice: 神祇
  rationale: 如实保留复数及非唯一神性的表达，不改写为天使、邪灵或诸神体系。
theological_decisions:
- issue: “上帝的儿子就是人子”与人性、神性的关系
  choice: 按见证直译，并让后句说明他兼有人性与神性
  alternative: 译为“上帝的儿子也成为人子”或使用“两性一位”等后期教义表述
  rationale: 原文陈述关系，却未明确采用“成为”或后期信经术语；保留其自身的神学张力。
- issue: 驱逐死亡与复原圆满界分别归于上帝的儿子和人子
  choice: 保留“一方面……另一方面……”的对应结构
  alternative: 将两项行动合并归于未区分身份的“主”
  rationale: 该对称结构是本段论证的核心，不应为了神学整合而抹平。
- issue: “圆满界”的复原
  choice: 保留“复原”而不说明究竟是宇宙、群体或灵性状态的复原
  alternative: 解释为“万有复兴”“教会复兴”或“神性世界恢复”
  rationale: 现有英文见证不足以排除多种理解，且科普特语复核尚待完成。
- issue: 上方起源、真理种子与较低形体的先后关系
  choice: 译作“在他较低的形体形成以前，他就源自上方，如同真理的种子”
  alternative: 明确断言为先存基督论、灵魂下降论或某种诺斯替宇宙生成论
  rationale: 译文呈现时间与上下层次意象，但不把含混表述锁定为某一教义体系。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。因当前材料明确注明“科普特语源文审校待定”，本稿以所给公共领域英文见证为临时起草依据，尽量形式谨慎，不假装已经完成原文直译。称呼 Rheginos 音译为“雷吉诺斯”，并以“啊”呈现直接呼语。
