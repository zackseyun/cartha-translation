  naturalness: 整体庄重、清楚。“给（原文缺损）作答”和“使自己起来”在现代汉语中略显生硬；前者可将缺文标记置于“给”后并以方括号明确其编辑性质，后者可改为“自己升起”。“关于存在的一切”也比“有关存在的一切”更平顺。
  terminology: “真理之言”“流溢”“蒙拣选者”“不朽”“吞灭／吞没”均可保留。“永世”配合脚注能避免将 aeon 过度限定；脚注应明确这是一种暂译，且原词的语义范围未被穷尽。
