review_pass:
  verdict: revise
  source_fidelity: 整体忠实传达了英文见证中世界的变易、复活的坚实实在，以及光、圆满等象征性对照。惟“它使真实存在的显明出来，使万物改变形态，并转变成新的”将原文的并列说明明确改写成连续使役动作，略增加了原文未明说的施事关系；残缺／补写标记的全半角形式也应统一并紧贴相应语句。
  naturalness: 译文庄重通顺，但“坚定长存的实在”“不朽坏的”“会朽坏的”“形像”等处略显生硬或不合当代规范。改为“稳固长存的实在”“不朽性”“会朽坏者”“形象”，既较自然，也保留抽象与象征语体。
  terminology: “幻象”“复活”“圆满／缺乏”“美善”均能保留原文的抽象和可能的术语性，不宜将“圆满／缺乏”具体化为某一宇宙论体系。对 imperishability 使用“不朽性”较准确，避免把抽象名词误作无明确根据的人格实体。
  issues:
  - severity: medium
    issue: “revelation of what exists, even the transfiguration of things, and a transformation into what is new”被译作复活主动“使……显明／使……改变／并转变”的连续动作。
    rationale: 英文见证将这些表述并列为复活所是，虽可含动态意味，却未明确指定“复活”使万物发生这些动作。宜保留名词性并列与句法余地。
  - severity: low
    issue: “不朽坏的[]［将降临］在会朽坏的之上”中“不朽坏的／会朽坏的”不够自然，且方括号全半角混用。
    rationale: imperishability 是抽象名词，译为“不朽性”更贴切；以统一的“[]［……］”保留见证所显示的缺损及编辑补写。
  - severity: low
    issue: “形像”应作现代规范写法“形象”。
    rationale: 不改变 symbols and images 的意思，并改善现代普通话书写规范。
  revised_text: '然而，我究竟在对你说什么呢？活着的人将要死吗？他们怎能活在幻象之中呢？富人已经变得贫穷，君王也被拉下高位。一切都在变化之下。这个世界是幻象——如果我这样说并没有夸大实情的话。


    然而，复活并不具有那种虚幻、转瞬即逝的性质，因为它是稳固长存的实在。它是对实有之物的启示，即万物的变形，以及向新事物的转变。因为不朽性[]［将降临］在会朽坏者之上。[a]光将流泻下来，临到黑暗之上，并将它吞没。那时，圆满将填满缺乏。[b]这些都是复活的象征和形象。这就促成美善。'
  revised_footnotes:
  - marker: a
    text: “[]”表示见证文本在此有缺损；“［将降临］”是编辑者补出的文字。科普特语原文复核尚待完成。
    reason: 保留抄本损坏及编辑复原所显示的不确定性。
  - marker: b
    text: “圆满”和“缺乏”也可能是带有专门宇宙论含义的术语；此处不限定其具体所指。
    reason: 提示原文可能具有术语色彩，同时避免过度解释。
  revision_rationale: 修订主要恢复英文见证中“启示／变形／向新事物的转变”的并列、名词性表述，避免增加明确的使役关系；同时将抽象名词 imperishability 译作“不朽性”，统一残缺与补写标记，并作少量现代汉语规范和流畅度调整。由于直接科普特语复核仍待完成，保留了见证文本本身的方括号不确定性及“圆满／缺乏”的开放术语性。
