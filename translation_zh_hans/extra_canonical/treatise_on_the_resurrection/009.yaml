    reason: 保留抄本损坏及编辑复原的不确定性。
  - marker: b
    text: “圆满”和“缺乏”也可能是带有专门宇宙论含义的术语；此处不限定其具体所指。
    reason: 提示原文可能具有术语色彩，同时避免过度解释。
  revision_rationale: 修订集中于汉语语法和来源结构：“不朽坏性／会朽坏的事物”更准确且自然地表达抽象名词与其对项；第二段恢复“启示、形态改变、转变”的并列界定；末句改为更明确的现代汉语。保留“幻象”“圆满”“缺乏”、抄本缺损方括号和编辑补文，未将象征语言解释为任何特定教义体系。
