base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/009.yaml
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
translation:
  language: zh_hans
  text: '然而，我究竟在对你说什么呢？活着的人将要死吗？他们怎能活在幻象之中呢？富足的人已经变得贫穷，君王也被拉下高位。一切都在变化之下。这个世界是幻象——如果我这样说并没有夸大实情的话。


    然而，复活并不具有那种虚幻、转瞬即逝的性质，因为它是坚定长存的实在。它使真实存在的显明出来，使万物改变形态，并转变成新的。因为不朽坏的[]［将降临］在会朽坏的之上。[a]光将倾流到黑暗之上，把黑暗吞没。那时，圆满将充满缺乏。[b]这些都是复活的象征和形像。由此便成就美善。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “[]”表示见证文本在此有缺损；“［将降临］”是编辑者补出的文字。科普特语原文复核尚待完成。
    reason: 保留抄本损坏及编辑复原的不确定性。
  - marker: b
    text: “圆满”和“缺乏”也可能是带有专门宇宙论含义的术语；此处不限定其具体所指。
    reason: 提醒读者原文可能具有术语色彩，同时避免过度解释。
lexical_decisions:
- source_word: illusion
  choice: 幻象
  rationale: 保留世界看似真实却不具恒存实在的含义；比“骗局”少主观欺骗意味，也比“虚无”更忠实于见证文本。
- source_word: reality that remains firm
  choice: 坚定长存的实在
  rationale: 兼顾“实在”与“保持稳固”两个语义要素，并与前文转瞬变化的世界形成对照。
- source_word: transfiguration
  choice: 改变形态
  rationale: 在来源语言复核尚未完成时，避免直接采用可能带有特定经文联想的术语“变像”，同时保留形态转变之意。
- source_word: imperishability
  choice: 不朽坏的
  rationale: 使用实体化表达，以对应它降临于“会朽坏的”之上的拟人化、宇宙论式陈述。
- source_word: Fullness
  choice: 圆满
  rationale: 保留该词可能具有技术性宇宙论含义，同时采用现代汉语可理解的表达。
- source_word: Deficiency
  choice: 缺乏
  rationale: 与“圆满”构成原文对照，不擅自将其解释为罪、物质或某一特定神学范畴。
- source_word: what is good
  choice: 美善
  rationale: 保留抽象、概括性的善，语体庄重而不把原文具体化为某项结果。
theological_decisions:
- issue: “世界是幻象”的本体论力度
  choice: 直译为“这个世界是幻象”
  alternative: “这个世界转瞬即逝”或“世界只是表象”
  rationale: 见证文本明确使用“illusion”，不宜仅弱化为短暂性；同时不扩展为世界完全不存在。
- issue: 复活与现存实在的关系
  choice: “它使真实存在的显明出来”
  alternative: “它是存在之物的启示”
  rationale: 采用较自然的汉语，但保留复活作为显明既有实在的陈述，不解释其究竟指属灵实体、受造秩序还是终末实在。
- issue: “圆满”与“缺乏”的技术性
  choice: 保留抽象名词并以“圆满”“缺乏”呈现
  alternative: 解释为特定诺斯替宇宙论中的专名
  rationale: 避免导入某一学派的完整体系；大写所暗示的专门意味通过对称、抽象措辞保留。
- issue: 残缺与补写
  choice: 正文保留“[]［将降临］”
  alternative: 无标记地译作“将降临”
  rationale: 忠实保留见证文本所示的抄本缺损与编辑补写，不把复原内容当作毫无疑问的原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文连续的反问、世界与复活之间的强烈对照，以及“光吞没黑暗”“圆满充满缺乏”等象征性语言。由于科普特语来源审查尚未完成，本稿明确以所提供的公版英文见证为暂定依据，并在残缺处保留编辑标记。
