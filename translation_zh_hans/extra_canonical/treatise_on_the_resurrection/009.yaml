id: TRES.009
reference: Treatise on the Resurrection — The World is an Illusion
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  text: 'Yet what am I telling you? Those who are alive shall die? How do they live in an illusion? The rich have become poor, and the kings are cast down. Everything is subject to change. The world is an illusion, if in fact I do not exaggerate the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things, and a transformation into what is new. Because imperishability [] [will descend] on the perishable. The light will flow down on the darkness, swallowing it up. The Fullness then will fill the Deficiency. These are symbols and images of the resurrection. This makes for what is good.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
