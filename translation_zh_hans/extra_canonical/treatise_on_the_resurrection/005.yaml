base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/005.yaml
  text: 'However, if some do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
translation:
  language: zh_hans
  text: '然而，有些人若不信，（这是因为）他们无法被说服。我的孩子，死人将要复起，这属于信，而不属于辩论。


    今世的哲学家中，也有一些人相信，好叫他们至少也能复起。今世的哲学家不可因相信自己能凭自己从死亡中返回生命，就自以为有理。因为借着我们的信，我们认识了人子；我们相信他已从死人中复起。论到他，我们宣告：“他成了死亡的消除者。”因为信是伟大的，信的人也是〈伟大的〉。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “〈伟大的〉”中的尖括号表示该词为见证译本所标示的补足或复原；科普特语原文尚待直接复核。
    reason: 保留所提供英文见证的文本修复标记，并明确当前底本限制。
lexical_decisions:
- source_word: rise / rose
  choice: 复起
  rationale: 统一保留死者从死亡中起来的复活语义，同时避免在此处用较具后世术语色彩的表达过度解释。
- source_word: faith / belief
  choice: 信
  rationale: 原见证在 faith 与 belief 之间有措辞变化；中文以“信”保持段落的词义关联，既可指信心，也可指相信这一行动。
- source_word: argumentation
  choice: 辩论
  rationale: 表达以论证、争辩来说服人的方式，与前文“无法被说服”自然衔接。
- source_word: feel justified
  choice: 自以为有理
  rationale: 保留其自我确认或自认为立场正当的意味，不引入宗派性的“称义”术语。
- source_word: Son of Man
  choice: 人子
  rationale: 采用传统且通行的对应语，保留其称号性质。
- source_word: obliteration of death
  choice: 死亡的消除者
  rationale: 保留“使死亡归于消灭”的强烈意象，并依原句的述谓结构译为指向人子的称谓。
theological_decisions:
- issue: 复起与信、论证之间的关系
  choice: “这属于信，而不属于辩论”
  alternative: “这是信仰问题，不是论证问题”
  rationale: 较贴近见证的简洁对比，不将原文扩大成对理性或论证的一般性否定。
- issue: 哲学家凭自己返回生命
  choice: “相信自己能凭自己从死亡中返回生命”
  alternative: “相信他使自己复活”
  rationale: 保留原见证中“returns himself ... by himself”的重复强调及其可能的含混，不替文本判定所指是哲学学说、自救观念还是具体复活机制。
- issue: 人子与死亡的关系
  choice: “他成了死亡的消除者”
  alternative: “他消灭了死亡”
  rationale: 原见证采用名词性表述“became the obliteration of death”；译文保留“成了”及称谓式张力，而不改写成单纯事件陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。鉴于科普特语源文复核尚未完成，本稿以所提供的公版英文见证为临时起草依据；括号与尖括号所体现的不确定性均予保留。
