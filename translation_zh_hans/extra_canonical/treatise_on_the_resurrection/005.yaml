    text: “〈伟大的〉”中的尖括号表示该词为英文见证译本所标示的补足或复原；科普特语原文尚待直接复核。
    reason: 保留所提供英文见证的文本修复标记，并明确当前底本限制。
  revision_rationale: 修订以所提供的英文见证为准，保留其括号中的说明、末句的复原标记及“至少”的语义位置。“死亡的消除”刻意保留原句“became the obliteration”的抽象名词述谓；不将其改写为“消灭死亡”或“死亡的消除者”。在不增加神学解释的前提下，以“复活”替换生硬的“复起”。
