  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/010.yaml
  text: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing with others. Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
translation:
  language: zh_hans
  text: '所以，雷吉诺啊，不要只思想片面的真理，也不要为了迎合别人，就按着这肉身生活。相反，要逃避分裂和束缚，你就会在此刻经历复活。因为那必死的若知道自己终将死去，即使在今生度过许多年，最终也会走到这一步：为什么不把自己看作已经复活、已经抵达了呢？


    如果你已经拥有复活，为什么还继续行事，仿佛自己仍将死去呢？你应当知道，你已经死了。你因缺乏操练而没有意识到这一点。人人都应当以各种方式操练；这样，他们就会从这要素[a]中得到释放，不致陷入谬误，反而会重新领受那从起初就有的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这要素”所指不明确，也可能涉及“这一元素”或“这一成分”的意思；因科普特语原文复核尚待完成，此处保留其歧义。
    reason: 防止译文擅自把该词解释为肉身、物质或世界。
lexical_decisions:
- source_word: partial (truths)
  choice: 片面的真理
  rationale: 保留见证文本中“部分/片面”与“真理”之间略显开放的关系，同时使现代汉语读者易于理解。
- source_word: this flesh
  choice: 这肉身
  rationale: 采用较贴近原见证的措辞，不将其解释性地改写为“肉体欲望”或“属世生活”。
- source_word: agreeing (with others)
  choice: 迎合别人
  rationale: 表达为了与他人保持一致而生活的语义，比生硬的“同意别人”更自然。
- source_word: divisions and bondages
  choice: 分裂和束缚
  rationale: 分别保留群体破裂与受辖制的语义，不进一步限定其性质。
- source_word: experience the resurrection now
  choice: 在此刻经历复活
  rationale: 明确保留当下经验复活的时间性及神学张力。
- source_word: possess the resurrection
  choice: 拥有复活
  rationale: 保留原文不寻常的所有关系，不弱化为仅仅“相信复活”。
- source_word: this element
  choice: 这要素
  rationale: 直译并保留指称不明的歧义，避免擅自解释为肉身、世界或物质。
- source_word: what was from the beginning
  choice: 那从起初就有的
  rationale: 保留所指对象未明的状态，不补入“本性”“生命”或“产业”等解释。
theological_decisions:
- issue: 复活是当下经验还是未来事件
  choice: 保留“在此刻经历复活”及“已经拥有复活”的表述
  alternative: 解释为对未来身体复活的预尝或确据
  rationale: 见证文本刻意以当下、已然的语言谈论复活；译文不以特定教派框架消解这种张力。
- issue: “你已经死了”的含义
  choice: 按字面保留
  alternative: 解释为向罪死、属灵死亡或肉身必死
  rationale: 上下文未明确限定死亡的性质，故不添加解释。
- issue: 从“这要素”中获释
  choice: 保留抽象且含混的说法
  alternative: 译作脱离身体、物质界或今世
  rationale: 英语见证本身标明该表达有歧义，且科普特语直接复核尚待完成。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。由于当前仅有公共领域英语见证，科普特语源文审校尚待完成，本稿属暂定译文；对“复活”“已经死了”“这要素”等关键表达尽量保留其异常措辞与神学张力。
