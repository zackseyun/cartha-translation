review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所给英语见证，并妥善保留“复活”的当下性及“这要素”的指称歧义。但“think not in partial (truths)”译为“不要只思想片面的真理”不够自然，且把括号所示的省略/不确定关系处理得过于确定；“having arrived”宜明确为“已经达到（终点）”，而非泛泛的“抵达了”。
  naturalness: 文体总体庄重、现代且通顺。“那必死的若知道自己终将死去”可调整为更自然的“必死者若知道自己会死”。“以各种方式操练”在此抽象语境可保留，但“接受训练”较符合“lack of training / train”的语义连贯性。
  terminology: “肉身”“复活”“分裂和束缚”均可保留。“这要素”虽有意维持歧义，但现代汉语略显生硬；使用“这一要素”并以脚注说明，可更清楚地对应 witness 的 element 而不作神学限定。人名“Rheginos”译作“雷吉诺”可接受。
  issues:
  - severity: medium
    issue: “partial (truths)”的译法过度实化且不够顺畅。
    rationale: 英语见证以括号标出 truths，显示“partial”与“truths”的结合方式有省略或不确定性。“不要只思想片面的真理”既使“真理”成为明确宾语，也带有“只思考”的附加限制。宜以“不要执着于片面的（真理）”保留括号与开放性。
  - severity: low
    issue: “having arrived”未充分体现“已达成／已到达”的完成意味。
    rationale: “已经抵达了”在汉语中目的地未明且略口语化；“已经达到终点”在不引入额外教义解释的前提下更完整地传达 arrived 的完成状态。
  - severity: low
    issue: “lack of training”与后句“train”宜采用同一词族。
    rationale: 将二者分别译为“缺乏操练”与“操练”并无误，但“缺少训练／接受训练”更自然，也更清楚呈现原文的重复关联。
  revised_text: '所以，雷吉诺啊，不要执着于片面的（真理），也不要为了迎合别人而照着这肉身生活。相反，要逃避分裂和束缚，你就会在此刻经历复活。


    因为必死者若知道自己会死，尽管在今生度过许多年，最终也会达到这一点：为什么不把自己看作已经复活、已经达到终点了呢？


    如果你拥有复活，为什么还继续行事，仿佛自己仍会死去呢？你应当知道，你已经死了。你因缺少训练而没有意识到这一点。人人都应当以各种方式接受训练；这样，他们就会从这一要素[a]中得到释放，不致陷入谬误，反而会重新领受那从起初就有的。'
  revised_footnotes:
  - marker: a
    text: “这一要素”所指不明确；英语见证作 this element，可能指“元素”“成分”或其他概念。因科普特语原文复核尚待完成，此处保留歧义。
    reason: 避免将该词擅自解释为肉身、物质、世界或其他特定概念。
  revision_rationale: 修订限于更准确、自然地传达英语见证的开放措辞和完成体意味：以括号保留“partial (truths)”的文本不确定性；以“已经达到终点”表达“having arrived”；并统一“训练”的词汇关联。其余关键含混表达及当下复活的张力均予保留。
