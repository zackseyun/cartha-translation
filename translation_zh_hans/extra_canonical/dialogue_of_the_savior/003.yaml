  verdict: revise
  source_fidelity: 译稿总体忠实保留了英语见证的残缺标记、重复和未完成句式，也没有把宇宙论或救赎论含义教义化。但有数处措辞改变或过度具体化了见证：如“从作为”不合汉语且未对应 work，“里面[所有的]”为英语见证所无，“胜过”强于 mastered；并且把 word 译为“道”会不必要地引入具有专名或神学实体意味的联想。若干方括号的范围及空方括号也应更精确保留。古科普特原文尚未直接复核，本审阅以所给英语见证为准。
  naturalness: 修订后以现代书面普通话表达，同时不为使行文流畅而补全残句。“一根孤立的杖”改作较自然的“一根孤零零的杖”；“渡越之处”改作“过渡之处”。对残缺段落仍刻意保留必要的突兀和不完整。
  terminology: “archons”保留为中性的“执政者”，“logic”仍译“理性”，“living mind”仍直译为“活的心智”。“word”改为“话语”，避免在英语见证没有明确专名化的情况下译作“道”。“mastered every earthly thing”译为“掌握了世上一切事物”，不强化为“胜过”。
  issues:
  - severity: medium
    issue: “从作为[……]”不自然，且未忠实对应 from the work。
    rationale: 英语见证的 work 即使所指不明，仍应译出为“工作／作为”等名词；“从作为”在此既不通顺，也容易遮蔽残缺句本身的结构。
  - severity: medium
    issue: “要看你们里面[所有的]”加入了见证中没有的“所有”。
    rationale: 见证为“Look instead at [what is] inside (you)”，其中补足的是“what is”，不是“all”。应以方括号标明为使汉语成句而补出的“事物”，不可添加全称限定。
  - severity: medium
    issue: “你们已经胜过世上一切事物”把 mastered 加强为战胜。
    rationale: mastered 可表示掌握、精通或控制；“胜过”主要表达比较或战胜，缩窄并强化了原有语义。
  - severity: medium
    issue: 将 word 译作“道”带来无根据的神学专名化倾向。
    rationale: 此处是残句，英语见证仅作普通名词 word，未标作 Logos 或专名；“话语”较能保留其未定含义。
  - severity: low
    issue: 部分方括号范围和空方括号未逐项保留。
    rationale: 英语见证中的“[]”和相邻的恢复词是抄本状态的重要信息；修订文本恢复“这[] [将]”等可见标记，并避免重组“理性是[……真理][所在之处]”的恢复范围。
  - severity: low
    issue: “一根孤立的杖”不合现代汉语搭配。
    rationale: “一根孤零零的杖”保留 solitary 的未知意象，读法更自然，且不解释其象征意义。
