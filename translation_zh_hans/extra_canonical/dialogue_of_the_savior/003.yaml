review_pass:
  verdict: revise
  source_fidelity: 译稿总体忠实保留了英语见证中的方括号补足、残缺省略和多处不完整句法，也未把难解段落教义化。但有若干措辞越过或误解见证：将“[what is] inside (you)”译作“里面[所有的]”无据；将小写、未定指的“word”译作“道”带入不必要的宗教专名色彩；“from the work”被译成不成句的“从作为”。在只能依据英语见证、尚未核对科普特文的条件下，修订以逐字对应和保留残缺为先。
  naturalness: 原译庄重且大部分可朗读，但“从作为”“理性就是[……真]理[所在之处]”及“使那道不至于[……]他们所举起的[……]”等处在汉语中产生了并非由残缺本身必要造成的额外病句。修订仍保留抄本损毁导致的断裂，却使可译部分的搭配和标点更自然。
  terminology: “执政者”可保留 archons 的中性、技术性张力；“权势”可保留 power 的力量／势力含义。“理性”是 logic 的可接受临时对应。“话语”比“道”更适合对应此处未大写、未显示为专名的 word；“活的心智”改为较自然的“活着的心智”，不改变其异常而开放的表述。
  issues:
  - severity: medium
    issue: “相反，要看你们里面[所有的]”误译并误注。
    rationale: 英语见证为“Look instead at [what is] inside (you)”，方括号中的补足是“what is”，并非“all”。译为“要看你们里面的[事物]”保留补足和所指不明。
  - severity: medium
    issue: “从作为”不合汉语且未妥善对应“from the work”。
    rationale: 该处前后均有缺损，不能安全补足完整关系；可译出的“from the work”宜作“从那工作[……]”，并以省略号维持原有断裂。
  - severity: medium
    issue: 将 word 译作“道”过度神学化。
    rationale: 英语见证使用小写 word，且残缺语境不足以确定其为 Logos 或专名；译作“话语”较中性。
  - severity: low
    issue: “胜过世上一切事物”将 mastered 具体化为战胜。
    rationale: “掌握世上一切事物”更贴近 mastered，也不预设冲突或征服。
  - severity: low
    issue: “活的心智”及若干残句的汉语表达生硬。
    rationale: “活着的心智”更合现代汉语；通过在残缺边界处分句，可避免把无法确定的英语句法强连为中文病句，同时不补写缺文。
