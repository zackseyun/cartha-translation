translation:
  language: zh_hans
  text: '“我要教导你们：毁灭的时候何时来到。[a] 黑暗的第一股权势将追上你们；不要害怕，[b] 也不要说：‘看哪，时候到了。’[c] 然而，当你们看见一根孤立的杖[……]。[d] 要知道，[……]从作为[……]，而那些执政者[……]追上你们[……]。恐惧才是[黑暗]真正的力量。既然如此，如果你们惧怕那即将追上你们的事，它就会制伏你们；它们之中没有一个会释放你们，也没有一个会怜悯你们。相反，要看你们里面[所有的]，[e] 因为你们已经胜过世上一切事物。这[……][将]把你们带到上面，进入一个[没有]统治、[没有]暴君的[地方]。当你们[……]时，你们会看见那些[……]，你们也会[听见他们。我]告诉你们，理性[……]。理性就是[……真]理[所在之处]。然而，他们[……]，而你们[……]真理。这[是……在]活的[心智里面]。因此，[……]以及你们的喜乐[……]，使[……]你们的灵魂[……]，使那道不至于[……]他们所举起的[……]，他们却不能[领悟]它[……]。要使你们[里面]的和你们[外面]的成为同一回事。[f]


    那[……]渡越之处在[你们]看来确实可怕，但不要迟疑，只管穿过那里。它的深处何其深，它的[高处]何其高！[要同心专一……]，火[……]露珠[……]一切权势[……]你们。它们会[……]，而[一切]权势[……]它们[……]以前。我告诉[你们]，[……]灵魂[……]将在它们一切之中成为[……]你们是[……]，并且那[……]不要睡着[……]众子[……]你们[……]你们[……]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭的时候”所指不明；残存语境可能涉及末后的危难，也可能涉及灵魂所经历的威胁。
    reason: 保留末世论与个人性解读之间的歧义。
  - marker: b
    text: “权势”也可理解为“力量”；上下文似乎把黑暗势力与恐惧紧密相连。
    reason: 说明 power 的词义张力。
  - marker: c
    text: “时候到了”可能指预期的毁灭或危难已经临到；本文没有进一步界定。
    reason: 避免擅自确定时间论或末世论含义。
  - marker: d
    text: “一根孤立的杖”按所据英语见证直译；其后的文本残缺，因此这一意象的含义无法确定。
    reason: 提示难解意象与抄本残损。
  - marker: e
    text: 此处英语见证为“看你们里面[所有的]”；方括号内文字属补足，具体所指不明。
    reason: 区分可见文本与复原文字。
  - marker: f
    text: “里面”与“外面”均据残缺处的补足文字；这句话的合一究竟指何种层面，本文没有说明。
    reason: 保留复原状态和神学开放性。
lexical_decisions:
- source_word: destruction
  choice: 毁灭
  rationale: 保留事件究竟指宇宙性毁灭、审判还是个人遭遇的开放性，不具体化为某一教义概念。
- source_word: power of darkness
  choice: 黑暗的第一股权势
  rationale: “权势”兼具力量与人格化势力的可能；加量词“股”使现代汉语自然，却不判定其本体。
- source_word: archons
  choice: 执政者
  rationale: 采用早期宗教文献中较中性的对应词，保留其既可指统治势力、也可指超自然掌权者的张力。
- source_word: logic
  choice: 理性
  rationale: 英语见证两次作 logic；译作“理性”以保留思想、推理原则或宇宙性理则之间的可能性，不擅自改为“道”。
- source_word: living mind
  choice: 活的心智
  rationale: 直译其异常表达，不将其神学化为“生命之灵”或其他体系性术语。
- source_word: word
  choice: 道
  rationale: 在宗教语境中以“道”表达具有实体或启示意味的 word，同时不确定其是否为专名，故不加专名号。
- source_word: crossing place
  choice: 渡越之处
  rationale: 比“关口”更少解释性，兼容空间通道、灵魂上升阶段或象征性经过。
theological_decisions:
- issue: 恐惧与黑暗权势的关系
  choice: “恐惧才是[黑暗]真正的力量”
  alternative: “恐惧就是黑暗的真正权势”
  rationale: 保留英语见证中 power 可指力量或权势的双关，并以方括号标明“黑暗”为补足文字。
- issue: 向内观看的对象
  choice: “要看你们里面[所有的]”
  alternative: “要省察内心”
  rationale: 不把原文具体化为道德反省；保留其可能涉及内在本体、知识或心智的含混性。
- issue: 上升目的地的性质
  choice: “没有统治、没有暴君的[地方]”
  alternative: “无人统治的自由之境”
  rationale: 避免将残缺文本扩展为政治自由或特定救赎论，同时保留 reign 与 tyrant 的并列表达。
- issue: 内外合一
  choice: “使你们[里面]的和你们[外面]的成为同一回事”
  alternative: “使内在与外在合一”
  rationale: 尽量保留命令句的具体结构，不解释为伦理一致、神秘合一或宇宙论复归。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。方括号中的文字表示见证文本所标示的复原或不确定补足；“[……]”表示抄本缺损或无法恢复的文字。译稿以所提供的公版英语见证为临时依据，科普特文原始材料的直接复核尚待完成，因此对残句不作平滑补写，也不以教派术语填补其神学空白。
