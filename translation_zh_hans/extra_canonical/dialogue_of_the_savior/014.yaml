translation:
  language: zh_hans
  text: '马利亚问：“芥菜种是[哪一]类的？是属天的，还是属地的？”[a]


    主说：“父为自己设立世界以后，把许多剩余之物留给了万有之母。因此，他才播种、作工。”


    犹大说：“你本着真实的心意把这话告诉了我们。我们祷告的时候，应当怎样祷告？”


    主说：“要在没有女人的地方祷告。”[b]


    马太说：“他告诉我们：‘要在没有女人的地方祷告。’这意思是要毁灭女性的作为。这并不是因为另有一种生育，而是因为她们应当停止[生育]。”[c]


    马利亚说：“这些永远不会被毁灭吗？”


    主说：“[你]知道，它们会[再次]消亡，……而[这里女性的作为]也会被[毁灭]。”[d]


    犹大[对马太]说：“[女性]的作为确实会消亡。那时，执政者将[召唤他们的诸世代]，而我们会准备好面对他们。”[e]


    主说：“他们会看见[你们，也会]看见那些接纳你们的人吗？看哪，从父那里有一句真实的话，在寂静中发出，直达深渊，伴随着一道闪电，并且能生发。[f]他们看得见它吗？还是能胜过它呢？你们确实更清楚那条[道路]；[无论天使]还是权势都不知道它。那是父与子的道路，因为二者为一；你们要行在自己所认识的[道路]上。即使执政者变得极其强大，也无法到达那里。我实在告诉你们，连我也很难到达那里。”[g]


    ……[马利亚]问[主]：“如果作为[被毁灭，那么究竟]是什么毁灭作为呢？”


    [主说]：“你知道，[每当]我毁灭[它]，它就会回到自己的地方。”


    犹大说：“灵怎样显现出来？”


    主说：“剑怎样[显现出来]？”


    犹大说：“光怎样显现出来？”


    主说：“[它]永远借着自身[显现出来]。”


    犹大问：“谁消解谁的作为？是作为[消解]世界，还是世界消解作为？”[h]


    主[回答]：“那[领悟的人，就是消解作为的人]。因为认识了这些作为的人，理当实行父的[旨意]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 底本在“哪一”处有缺损；抄本页码在本译文中省略。
    reason: 说明补译括号及编辑处理。
  - marker: b
    text: “没有女人的地方”含义不明；下文由马太解释为终止“女性的作为”，但文本没有明确说明这是指生育、性行为、身体性，还是一种宇宙论观念。
    reason: 保留有争议语句的真实歧义，避免教派化解释。
  - marker: c
    text: “她们”也可依语境理解为泛指具有生育能力者；“生育”为残缺处的推补。
    reason: 说明代词所指及复原的不确定性。
  - marker: d
    text: 此句抄本残缺严重；省略号表示无法可靠复原的文字。方括号内文字均为推补。
    reason: 透明呈现文本损坏。
  - marker: e
    text: “执政者”是本类古代文献中对超世统治势力的称呼。“诸世代”所译之词也可指“永世”或人格化的超世领域。相关短语均有缺损。
    reason: 解释两个宇宙论术语而不固定其体系含义。
  - marker: f
    text: “能生发”也可译作“具有生育力”或“产生万物”；这里可能修饰“话”，也可能与整幅景象相关。
    reason: 保存语法和词义歧义。
  - marker: g
    text: “连我也很难到达那里”依现存见证直译；这句话可能受抄本损坏影响，但现有资料不足以修正。
    reason: 提示异常读法而不静默调和。
  - marker: h
    text: “消解”所译之词可含解除、分解或消散之意；此处与“毁灭”是否完全同义并不明确。
    reason: 保留关键词之间可能存在的区别。
lexical_decisions:
- source_word: works
  choice: 作为
  rationale: 保留该词在行为、产物和宇宙性运作之间的语义张力；统一译法也使末段的文字关联可见。
- source_word: Mother of the All
  choice: 万有之母
  rationale: 按古代宇宙论称谓直译，不预先把它等同于某一特定神学人物。
- source_word: archons
  choice: 执政者
  rationale: 采用便于现代读者理解而又保留统治性含义的译名；脚注说明其术语性质。
- source_word: aeons
  choice: 诸世代
  rationale: 保留原术语兼有时代、永世及超世实体的歧义，不径自采用教派化音译。
- source_word: true mind
  choice: 真实的心意
  rationale: 避免把短语过度技术化为特定诺斯替主义术语，同时保留心思、意向的含义。
- source_word: generative
  choice: 能生发
  rationale: 兼顾产生、繁生和赋予生命的可能含义，不限定为生殖。
- source_word: dissolves
  choice: 消解
  rationale: 区别于前文的“毁灭”，保留解除、分解或使之消散的语义范围。
- source_word: spirit
  choice: 灵
  rationale: 采用自然且传统的汉语宗教词汇，不额外判定这里指人的灵、神灵或神圣之灵。
theological_decisions:
- issue: “没有女人的地方”及“女性的作为”的含义
  choice: 正文直译，并以脚注提示其解释不确定
  alternative: 意译为禁欲、独身或超越性别的属灵状态
  rationale: 文本本身随后提供解释，却仍留下生育、身体性及宇宙论之间的张力；不应替作者解决。
- issue: 父与子“二者为一”
  choice: 保留“二者为一”
  alternative: 扩写为本体同一、旨意一致或联合一致
  rationale: 原句没有明确说明“一”的性质，须保存其神学开放性。
- issue: “连我也很难到达那里”
  choice: 按见证文本保留其突兀表述
  alternative: 修正为“连你们也很难”或解释为耶稣谦逊的修辞
  rationale: 此句具有真实的文本和神学张力，现有材料不足以改写或调和。
- issue: 父、万有之母与世界的关系
  choice: 按叙事次序直译，不建立完整宇宙论体系
  alternative: 用特定诺斯替体系解释父、母、世界及余留之物
  rationale: 单段资料不足以确认这些称谓在全书中的技术含义。
- issue: “认识作为”与“实行父的旨意”
  choice: 保留认识与行动之间的责任关系
  alternative: 把“认识”解释为得救的秘密知识
  rationale: 原文并未明确把这种认识限定为某宗派的救赎知识。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。对抄本缺损以方括号和省略号透明标示；删除纯粹的抄本页码。由于科普特语原文复核尚待完成，本稿以所给公共领域英译见证为临时桥梁，尤其对残缺句、代词所指和术语意义采取审慎处理。
