  naturalness: 译文总体为自然、庄重的现代普通话；“身披肉身”“生命之地”等表达虽带有刻意保留的陌生感，仍可理解，且符合不提前诠释见证的需要。
  terminology: “生命之地”“不义”“纯净的光”“认识自己”前后一致，并避免加入特定宗派的解释。“人[子]”可在保持汉语称谓“人子”的同时准确对应英文见证中受损并复原的部分。
