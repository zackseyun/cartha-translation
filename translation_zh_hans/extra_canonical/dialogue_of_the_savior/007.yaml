translation:
  language: zh_hans
  text: '马利亚问她的弟兄们：“你们向[人]子提出的[这些]问题，要存放在哪里？”[a]


    主[对]她说：“姊妹，[没有人]能询问这些事，[除非]他心里有一处地方[]可以存放它们。[b]这样的人能离开[这个世界]，进入[生命]之地，不会被扣留在这个贫乏的世界里。”


    马太说：“主啊，我想[看见]那生命之地；[那里]没有不义，只有纯净的[光]。”


    主回答说：“马太弟兄，只要你还身披肉身，就不能看见它。”[c]


    马太说：“主啊，[如果我]不能看见它，至少请让我认识它。”


    主说：“凡认识自己的人，都已经看见了它。凡交给他去做的事，他都去做。这样的人便在良善上变得[像]那地方。”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 正文中的方括号表示抄本残损处由编者补出的文字；补文具有不同程度的不确定性。
    reason: 说明底本见证的编辑性复原，避免读者把补文视为完整保存的抄本文字。
  - marker: b
    text: “地方[]可以”之间的空方括号表示此处有残缺，但现有见证未提供可译出的补文。
    reason: 保留并说明未复原的抄本缺口。
  - marker: c
    text: “身披肉身”直译见证中的穿戴隐喻；其确切含义未在本段说明。
    reason: 提醒读者该表达不应被无标记地解释为某一种肉身观。
  - marker: d
    text: 末句的句法和思想关系较为生硬；本译保留“在良善上变得像那地方”的比较，没有改写成“配得进入”或“已经到达”。
    reason: 保存见证的真实歧义及神学张力。
lexical_decisions:
- source_word: place of life
  choice: 生命之地
  rationale: 保留反复出现的“地方/生命”意象，并避免把它预先解释为某个特定宗派所理解的天堂、境界或内在状态。
- source_word: place in the heart
  choice: 心里有一处地方
  rationale: 保留原见证中具体而略显神秘的空间隐喻，不弱化为“有能力”或“能领会”。
- source_word: world of poverty
  choice: 贫乏的世界
  rationale: 直译其评价性表达，同时不擅自将“贫乏”限定为物质贫穷、灵性缺失或宇宙论术语。
- source_word: wear the flesh
  choice: 身披肉身
  rationale: 保留“穿戴”肉身的隐喻及其张力，不平直改写为“活在肉身中”。
- source_word: known himself
  choice: 认识自己
  rationale: 保留自我认识这一核心措辞，不扩充为救赎论或神秘主义解释。
- source_word: iniquity
  choice: 不义
  rationale: 兼顾道德与宗教语域，且与“良善”形成适度对照。
- source_word: pure light
  choice: 纯净的光
  rationale: 保留光的象征性和形容词，不解释其所指。
theological_decisions:
- issue: “生命之地”的性质
  choice: 保留为未加解释的“生命之地”
  alternative: 译作“永生之境”或“天堂”
  rationale: 现有见证没有明确把该处等同于某一既定末世论地点；保留原文张力。
- issue: “认识自己”与“看见它”的关系
  choice: 按陈述直接并列，不补入因果说明
  alternative: 译成“因为认识自己，所以已经看见它”
  rationale: 避免替文本判定二者关系究竟是因果、等同还是经验性的对应。
- issue: 末句“在良善上像那地方”
  choice: 保留其不寻常的比较结构
  alternative: 顺译为“已经成为良善的人，配得进入那里”
  rationale: 后者会加入资格与进入的神学逻辑，而见证只表达人成为“像”那地方。
- issue: 肉身与看见的关系
  choice: 保留“身披肉身”这一限制性说法
  alternative: 解释为肉眼无法看见属灵世界
  rationale: 原见证并未明确区分肉眼、灵眼或死后状态，不宜代为消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“姊妹”“弟兄”保留对话中的亲属式称呼；“主啊”用于直接呼语。因科普特语原文复核尚未完成，本稿以所提供的公版英文见证为暂定依据；方括号、残缺位置及若干句法关系均应在直接核对《拿戈玛第文集》科普特语抄本后复审。
