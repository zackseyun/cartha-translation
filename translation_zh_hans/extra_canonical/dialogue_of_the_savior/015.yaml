base_translation:
  language: en
  yaml_path: translation/extra_canonical/dialogue_of_the_savior/015.yaml
  text: 'As for you, strive diligently to free yourselves from [wrath] and jealousy. Strip yourselves of your [works], and do not [. . .]. [] [. . .] reproach [. . .], because I say to [you, . . .] you will receive [. . .] much [. . .] the one who searched and [discovered the true life]. This person will [attain rest and] live forever. I say to [you, guard yourselves], so that you do not lead [your] spirits and souls into error.


    [The Dialogue] of the Savior'
translation:
  language: zh_hans
  text: '“至于你们，要竭力使自己摆脱[愤怒]和嫉妒。要脱去你们的[行为][a]，不要……。……责备……，因为我告诉[你们，……]你们将领受……许多……那寻找并已[发现真正生命]的人；这人将[得享安息，并]永远活着。我告诉[你们：要谨慎自守]，免得使[你们的]灵与魂陷入迷误。”


    《救主[的对话]》'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行为”所对应的残存词语也可按上下文理解为“作为”或“功业”；残篇不足以确定其性质。方括号表示原稿残缺处的编辑复原，省略号表示文字佚失。
    reason: 说明关键语词的歧义，并交代残篇符号，避免读者把编辑复原误当作完整保存的正文。
lexical_decisions:
- source_word: strive diligently
  choice: 竭力
  rationale: 保留殷勤努力的强度，同时符合现代汉语劝诫语体。
- source_word: free yourselves from
  choice: 使自己摆脱
  rationale: 表达主体主动脱离愤怒与嫉妒，不额外引入救赎机制。
- source_word: strip from yourselves
  choice: 脱去
  rationale: 保留原文如脱衣般除去某物的形象。
- source_word: works
  choice: 行为
  rationale: 此处按见证文本译作“行为”，不擅自限定为善行、恶行或宗教功德。
- source_word: the true life
  choice: 真正生命
  rationale: 保留定冠意义及神学张力，不解释为永生或某种特定属灵状态。
- source_word: achieve rest
  choice: 得享安息
  rationale: 兼顾达到安息的结果义与自然、庄重的中文表达。
- source_word: spirits and souls
  choice: 灵与魂
  rationale: 保留两个并列名词，不将其合并或建立体系化的人论区分。
- source_word: into error
  choice: 陷入迷误
  rationale: 表达被引入错误、迷失的状态，同时避免添加道德或教义上的具体判定。
theological_decisions:
- issue: “行为”的性质
  choice: 保留为中性的“行为”
  alternative: 恶行／功业／作为
  rationale: 残篇上下文不足，不能确定其特指恶行、功德或宇宙论意义上的作为。
- issue: 灵与魂的关系
  choice: 并列译出“灵与魂”
  alternative: 灵魂／心灵和生命
  rationale: 不消除原文两个概念之间可能存在的区分，也不据此建立特定人论。
- issue: 安息与永生的关系
  choice: 依次保留“得享安息，并永远活着”
  alternative: 将安息解释为永生
  rationale: 原文将二者并列，译文不将它们同一化。
- issue: 寻找者句法
  choice: 保留断裂感，以分号连接残存语意
  alternative: 明确补成“寻找的人将领受许多”
  rationale: 手稿残缺使“领受”与“寻找者”的确切句法关系不明，不宜静默重构。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。严格保留方括号与省略号所标示的复原和佚文；鉴于尚未直接核对科普特文，本稿以所给公共领域英文见证为暂定依据，不对断裂句法作过度补全。
