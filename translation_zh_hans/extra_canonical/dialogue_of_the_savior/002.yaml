translation:
  language: zh_hans
  text: '“你们献上赞美时，要这样做：


    父啊，求你垂听我们，

    如同你垂听你的独生子，

    甚至将他接到你那里。

    [你]使他从繁重的[劳作]中得享安息。

    我们的力量[不能被胜过]，

    [因为]你的战阵[不能被胜过]。

    [……]光[……]活着的[……]不可接近的[……活着]。

    [真实的]道[赐下了]使人得生命的悔改，

    [而这一切发出]于你。

    你是那独一者的意念和完全的宁静。[a]

    求你再次垂听我们，

    如同你垂听你的蒙选者。

    蒙选者要借着你的祭献进入。[b]

    他们借着自己的善行，使自己的灵魂摆脱了盲目的肉身肢体，

    使他们能永远存在[……]。

    阿们。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那独一者”也可译作“那独处者”或“孤独者”；现有英文见证不足以确定所指。
    reason: 保留 solitary 的词义及指称歧义。
  - marker: b
    text: “祭献”也可译作“献祭”或“牺牲”；原句未明确祭献的具体所指。
    reason: 避免把含混的祭献语言预先等同于某一事件或教义解释。
  - marker: c
    text: 本译文暂依据所提供的公版英文见证译出，尚待科普特文直接复核。方括号和省略号保留底本残损及编者补拟的标记；末句方括号内没有可辨识的补文，故以“[……]”表示缺文。
    reason: 公开说明底本文本状况、暂定性质及编辑符号的处理。
lexical_decisions:
- source_word: only Son
  choice: 独生子
  rationale: 保留见证文本所表达的独特父子关系；在尚未直接核对科普特文前，不进一步限定其形上含义。
- source_word: rest
  choice: 安息
  rationale: 兼顾停止劳作、获得休憩以及宗教语境中的安息意味。
- source_word: battle forces
  choice: 战阵
  rationale: 表达有组织的争战力量，同时避免擅自具体化为军队、天军或属灵势力。
- source_word: repentance for life
  choice: 使人得生命的悔改
  rationale: 保留“悔改”与“生命”的目的或结果关系，不改写成特定的救恩公式。
- source_word: the solitary
  choice: 那独一者
  rationale: 英文见证为单数，可指独处者或独一者；正文采用较适合祷告语境的“独一者”，并以脚注保留歧义。
- source_word: sacrifice
  choice: 祭献
  rationale: 比“牺牲”更能保留礼仪性献祭含义，但不判定献祭者、祭物或具体事件。
- source_word: elect
  choice: 蒙选者
  rationale: 传达被拣选的状态，同时避免套用特定宗派的预定论框架。
- source_word: blind bodily limbs
  choice: 盲目的肉身肢体
  rationale: 依照现有见证保留不寻常且可能带有象征性的表述，不将其顺释为罪性、残疾或肉体本身。
theological_decisions:
- issue: “借着你的祭献进入”的施事者与救恩机制
  choice: 保持原句结构，不说明祭献具体指谁或何事
  alternative: 解释为父献上独生子，或解释为受祷者自己的献祭
  rationale: 现有见证本身没有消除这种歧义；不应凭后来的教义体系补足。
- issue: 善行使灵魂得释放
  choice: 直译为“借着自己的善行，使自己的灵魂摆脱……”
  alternative: 弱化为善行仅是释放的证据，或强化为完整的功德救赎论
  rationale: 保留文本呈现的因果张力，不以宗派立场重构。
- issue: “独一者”的身份
  choice: 不在正文中认定其为上帝、独修者或宇宙性的独一存在
  alternative: 明确解释为某一特定神学位格或修行群体
  rationale: 英文见证无法充分确定所指，且科普特原文复核尚待进行。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告体；以“求你垂听”呈现祈求语气。严格保留方括号与省略号所提示的残损和补拟，不以流畅性为由填补缺文。由于科普特文审校尚未完成，本稿是依据公版英文见证形成的暂定译稿。
