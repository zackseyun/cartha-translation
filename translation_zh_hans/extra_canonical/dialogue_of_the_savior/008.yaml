translation:
  language: zh_hans
  text: '犹大回答说：“主啊，请告诉我，[地震]的震动是怎样震动大地的？”


    主捡起一块石头，拿在手里。[他……对他说：“我]手里拿的是什么？”


    他回答：“[是]一块石头。”


    他对他们说：“支撑[大地]的，也正是支撑天的。当一句话语从至尊者那里发出，就会遇见那支撑天与地的。大地不会移动；它若移动，就会坠落。然而它不移动，为使最初的话语不致落空。话语立定了世界，住在其中，并闻了它的馨香。我向你们所有人子们[a]宣告一切不动摇的事，因为你们来自那地方。你们活在那些以喜乐和真理发言之人的心里。如果话语从父的身体发出，来到人间，而人们不接受它，它就会返回自己的地方。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子们”依所据英文见证直译为复数；这一称谓的确切含义不明。
    reason: 复数表达在中文中生硬且容易被误读为通常的单数称号“人子”，需提示其文本形态与不确定性。
lexical_decisions:
- source_word: word
  choice: 话语
  rationale: 保留普通言语与具有宇宙性作用之“话语”之间的张力，不直接译作带有较强约翰传统联想的“道”。
- source_word: Majesty
  choice: 至尊者
  rationale: 表达超越性的尊荣称号，同时不擅自将其明确等同于后文的“父”。
- source_word: supports
  choice: 支撑
  rationale: 保留石头示范所引出的具体承托意象，而不抽象化为“维系”或“治理”。
- source_word: set up
  choice: 立定
  rationale: 兼顾建立和使之稳固的含义，与上下文“不移动”“不动摇”相呼应。
- source_word: Sons of Man
  choice: 人子们
  rationale: 保留原见证中复数而反常的称谓，不改成单数基督称号，也不泛化为“人类”。
- source_word: Father’s body
  choice: 父的身体
  rationale: 按见证直译这一具象而神学上难解的说法，不弱化为“父那里”或解释为某种特定教义。
theological_decisions:
- issue: “话语”是否位格化
  choice: 保持语法与意象中的暧昧，不加代词或身份说明
  alternative: 明确译成位格化的“道”或解释为基督
  rationale: 本文既赋予话语宇宙性行动，又称其为从至尊者或父发出；现有间接来源不足以将这种张力归结为特定基督论。
- issue: “最初的话语”的所指
  choice: 直译为“最初的话语”
  alternative: 解释为创世命令、原初圣言或第一条诫命
  rationale: 见证本身未明确界定所指，应保留开放性。
- issue: “父的身体”
  choice: 保留身体语言
  alternative: 神学化处理为“父的本体”“父的怀中”或“父那里”
  rationale: 避免消除文本中真实而不寻常的身体性表达。
