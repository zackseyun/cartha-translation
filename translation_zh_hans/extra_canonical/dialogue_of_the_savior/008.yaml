  register: 采用现代、庄重而可诵读的普通话。方括号保留所据见证中的残损或编者补足；残损处用省略号表示缺文。手稿页码已省去。由于科普特语原文复核尚未完成，本稿属于依据所提供公版英文见证拟定的暂定译文。
