review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实于所提供的英文见证，并保留了方括号所标示的残损或补足。惟“遇见那支撑天与地的”在中文中缺少明确的名词性落点，且“发言”“活在”等措辞未能恰当地传达原文较为庄重、具居住意象的表达；现予以不增添教义解释的微调。科普特语原文尚待直接复核，以下判断以所给英文见证为准。
  naturalness: 修订后采用较自然而庄重的现代书面普通话：将“捡起”改为“拿起”，将“活在……心里”改为“住在……心中”，并使“支撑天和地的”在句法上完整。保留原文刻意重复的“震动……震动”及“话语”的宇宙性拟人表达。
  terminology: “话语”“至尊者”“支撑”“立定”“人子们”“父的身体”均宜保留。尤其不应把 word 改译为“道”，也不应将 Father’s body 解释性地改写为“本体”或“父那里”。“人子们”保留其反常复数形式，并以脚注说明其含义未定。
  issues:
  - severity: medium
    issue: “当一句话语从至尊者那里发出，就会遇见那支撑天与地的”句法不完整。
    rationale: 英文的 what supports the heaven and the earth 为名词性从句；中文须补出不带解释色彩的“事物”，才能使“遇见”的宾语完整。
  - severity: low
    issue: “活在那些以喜乐和真理发言之人的心里”用语偏生硬。
    rationale: lived in the hearts 更自然的对应是“住在……心中”；“发言”带现代会议语境，不如“说话”贴合普通言语行为。
  - severity: low
    issue: “所有人子们”语序不够自然。
    rationale: 改作“你们所有的人子们”可保留复数称谓及其强调，同时符合现代汉语语序。
  revised_text: '犹大回答说：“主啊，请告诉我，[地震]的震动如何震动大地？”


    主拿起一块石头，拿在手里。[他……对他说：“我]手里拿的是什么？”


    他回答：“[是]一块石头。”


    他对他们说：“支撑[大地]的，也正是支撑天的。当一句话语从至尊者那里发出，就会遇见那支撑天和地的事物。大地不会移动；它若移动，就会坠落。然而它不移动，为使最初的话语不致落空。话语立定了世界，住在其中，并闻了它的馨香。我向你们所有的人子们[a]宣告一切不动摇之事，因为你们来自那里。你们住在那些以喜乐和真理说话之人的心中。如果话语从父的身体中发出，来到人间，而人们不接受它，它就会返回自己的地方。”'
  revised_footnotes:
