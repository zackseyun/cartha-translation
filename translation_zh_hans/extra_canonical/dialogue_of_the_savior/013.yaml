translation:
  language: zh_hans
  text: '马利亚说：“我想明白一切，[确切地知道]其本来的样子。”


    主说：“凡寻求生命的人，这就是他的财富，因为世界（所给）的[安息]是虚假的，它的金银也会骗人。”


    他的门徒问他：“我们该做什么，才能完成我们的工作？”


    主[对]他们说：“无论在什么境况中，都要预备好。那认识过……[争战、亲眼见过]战斗的人有福了。他没有杀人，也没有[被]杀，反而得胜而出。”


    犹大问：“主啊，请告诉我，道路的起点是什么？”


    他说：“爱与良善。掌权者中哪怕曾有其中一样，邪恶也绝不会产生。”[a]


    马太说：“主啊，你毫不费力地讲明了万物的终局。”


    主说：“我告诉你们的一切，你们都已经明白，也凭信接受了。你若认识它，它就属于你；你若不认识，它就不属于你。”


    他们问他：“我们要到哪里去？”


    主说：“要占据你们所能到达的地方。”


    马利亚问：“这样安排的一切都是可见的吗？”


    主说：“我已经告诉你们：那能看见的，也正是显明的。”[b]


    他的十二个门徒问他：“老师，[以]……宁静……教导我们……。”


    主说：“[如果你们明白了]我[对你们说的]一切，你们就会[成为不死的，因为]你们……一切。”


    马利亚说：“关于真理的奥秘，我只想[对]主说一件事：我们立身于其中，也在其中向属世界的事显露无遗。”[c]


    犹大对马太说：“我们想知道，当我们脱离[肉体]的朽坏时，将要穿上怎样的衣服。”


    主说：“统治者和管理者所拥有的衣服，只是暂时赐下的，并不能长存。但你们作为真理之子，不要穿上这些只能暂存的衣服。我反而告诉你们：你们脱去衣服时，就有福了，因为……[脱去外在之物]并不是什么大事。”[d]


    ……说：“是我在说话，也是我在领受……吗？”


    主说：“是的，[就是那以合乎理性的方式领受]你父的人。”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌权者”也可译作“统治者”。此处可能带有宇宙论色彩，但现存句子本身没有进一步说明其身份。
    reason: 说明 archons 的词义范围，同时避免导入特定体系。
  - marker: b
    text: 本句也可能理解为：“能看见的人，就是显明的人。”现有见证中的主语关系并不完全清楚。
    reason: 保留“看见者”与“显明者”是否同一主体的真实歧义。
  - marker: c
    text: “向属世界的事显露无遗”原意不甚清楚；也可能是“对于世界之事，我们在其中是透明的”。
    reason: 该句语义异常，中文正文只能作暂定表达。
  - marker: d
    text: “衣服”和“外在之物”可能具有象征意义；由于文本残缺，这里不确定它们是否专指肉体。
    reason: 防止读者把象征意象误认为已经得到明确解释。
  - marker: e
    text: 末句残缺；“合乎理性的方式”是依现有英文见证所作的暂译，尚待科普特文复核。
    reason: 明确此处词义和句法的不确定性。
lexical_decisions:
- source_word: '[rest]'
  choice: '[安息]'
  rationale: 依照所给见证保留方括号中的编辑复原；“安息”既可指休止，也保留可能的宗教性含义。
- source_word: archons
  choice: 掌权者
  rationale: 采用较自然且不预设特定诺斯替体系的译法；该词也可译作“统治者”。
- source_word: path
  choice: 道路
  rationale: 保留具体道路与比喻性人生、救赎路径之间的双重意味。
- source_word: deathless
  choice: 不死的
  rationale: 直译其生命状态，不扩展为特定的复活、灵魂不朽或神化教义。
- source_word: sons of truth
  choice: 真理之子
  rationale: 保留古代亲属隐喻，避免释义为“属于真理的人”而削弱原文形象。
- source_word: garments
  choice: 衣服
  rationale: 保留衣服意象及其可能的象征意义，不在正文中径直解释为身体或属灵形态。
- source_word: logical way
  choice: 合乎理性的方式
  rationale: 按现有英文见证作暂定直译；底本语言复核前不把它神学化为“借着道”。
theological_decisions:
- issue: 爱与良善同掌权者及邪恶起源的关系
  choice: 保留“哪怕曾有其中一样”的反事实陈述
  alternative: 解释为掌权者完全缺乏爱与良善，所以产生邪恶
  rationale: 原句具有宇宙论含意，但不能据现有见证进一步建构掌权者的本体或起源。
- issue: 得胜者既未杀人也未被杀
  choice: 按字面保留三重对照
  alternative: 解释为纯属灵争战或殉道教训
  rationale: 不消解战斗意象与非杀戮得胜之间的张力。
- issue: 脱去衣服
  choice: 保留为未解释的象征性言语
  alternative: 明确解释为脱离肉体或除去物质性
  rationale: 上下文虽涉及肉体朽坏，但文本没有把每一处“衣服”明确等同于肉体。
- issue: 成为不死的条件
  choice: 保留“明白”与“不死”之间的文本关系
  alternative: 改写成因信得永生或因知识得救
  rationale: 避免把残缺句子纳入某一宗派的救恩论框架。
- issue: 领受父的末句
  choice: 保留父与理性领受的搭配，并标示复原
  alternative: 解释为领受圣父、圣言或神性知识
  rationale: 句子残缺且“logical”所据科普特词尚待复核，不宜作教义性扩展。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。方括号表示见证中的编辑复原，省略号表示抄本缺损或无法恢复的文字；正文不增补空缺内容。人名采用通行圣经译名。由于直接科普特文审校尚待进行，本稿是以所给公共领域英文见证为依据的暂定源证据译稿。
