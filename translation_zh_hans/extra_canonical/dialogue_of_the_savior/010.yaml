translation:
  language: zh_hans
  text: '他[带着]犹大、马太和马利亚……[要让他们看见天与地最远的]边界。[a] 他把[手]放在他们身上时，他们盼望自己能够[看见]。


    犹大抬头观看，看见一处极高之地；他又看见下面的深渊之地。


    犹大对马太说：“弟兄，谁能升到如此高处，或下到下面的深渊呢？那里有熊熊烈火，极其可怕。”


    就在那一刻，有一道话语从高处发出。犹大站在那里，看见那话语怎样降[下]。


    他问那话语：“你为什么降下来？”


    人子向他们问安，对他们说：“有一粒来自某个权能的种子有所缺失，便降到地的深渊里。那位至尊想起了[它]，就把[话语差到]它那里。那话语把种子带到至尊[面前]，免得……最初的话语失落。”[b]


    [他的]门徒对他所告诉他们的一切都感到惊奇，并且凭信领受了这一切；他们也知道，思量不义是无益的。


    随后他对门徒说：“我不是对你们说过吗？善者将被接到光中，如同可见的声音和闪电。”[c]


    他的门徒都赞美他说：“主啊，在你显现于此以前，谁曾赞美你呢？因为一切赞美都归于你。谁曾称颂[你]呢？因为一切祝福都归于你。”


    他们站在那里时，他看见两个灵带着一个魂同行。接着有一道强烈的闪电。人子发出一道话语，说：“把他们的衣服给他们！”[d]


    于是，小的变得与大的一样。他们[好像]那些被接到上面的人。……他们之间[没有差别]。他所[说的话使]门徒[信服]。


    马利亚[对他说：“看哪，我]看见那从起初就[影响]人的恶，就是他们彼此共同生活时的恶。”[e]


    主[对她]说：“你看见他们时，[就知道]许多。他们[不会一起留在那里]。然而，当你看见那永恒存在者时，那才是伟大的异象。”[f]


    众人都对他说：“请给我们解释。”


    他对他们说：“你们想以什么方式看见它呢？是在转瞬即逝的异象中，还是在永远长存的异象中？”


    他继续说：“你们要尽己所能，救那在你们[离去]之后仍会存留的；要寻找它，并从它里面说话，好使你们所寻找的一切与你们自身相合。因为我实在[告诉]你们，永活的上帝[在]你们里面，……[正如你们也在]上帝里面。”[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 底本此处残缺；方括号内文字为补拟，省略号表示缺文。手稿页码标记未收入正文。
    reason: 向读者交代开篇重建及缺文状态。
  - marker: b
    text: 本句多处残缺。“话语”在叙事中仿佛能下降并采取行动；“最初的话语”与前面的“话语”是否完全同指，未必确定。
    reason: 保留文本实体化语言及指称上的歧义。
  - marker: c
    text: “可见的声音”是底本见证保留的悖论式表达，也可能因残缺或传抄而难解。
    reason: 避免读者误以为译文笔误，同时不擅自修正文意。
  - marker: d
    text: “他们”可能指两个灵、魂，或这一场景中的其他对象；残存文本不足以确定。“衣服”也可能具有象征意义。
    reason: 说明代词和意象的真实歧义。
  - marker: e
    text: 马利亚的话有多处补拟；“彼此共同生活”与“从起初影响人的恶”之间的确切关系并不清楚。
    reason: 避免把残缺句子解释为对婚姻、社会或人性的确定教义。
  - marker: f
    text: “他们不会一起留在那里”来自残缺处的补拟，所指对象和地点都不明确。
    reason: 标示重建不确定性。
  - marker: g
    text: “在你们离去之后”中的“离去”是依上下文补足；末句中间亦有缺文。此处表达上帝在人里面、人在上帝里面，但没有进一步说明这种“在……里面”的性质。
    reason: 交代补拟，并保留互在语言的神学开放性。
lexical_decisions:
- source_word: word
  choice: 话语
  rationale: 保留文中既可指发出的言语、又仿佛具有行动主体性的张力；不直接译作带有更固定神学含义的“道”。
- source_word: power
  choice: 权能
  rationale: 保留原见证中抽象而可能具人格化色彩的表述，不擅自确定为“神力”“掌权者”或某一特定灵界位格。
- source_word: Majesty
  choice: 那位至尊
  rationale: 以尊称表达超越性的威荣，并用“那位”保留其人格化语气；避免直接等同于某个既定神名。
- source_word: seed
  choice: 种子
  rationale: 维持原文意象及其可能的象征含义，不释义为灵魂、后裔或神圣成分。
- source_word: spirits / soul
  choice: 灵／魂
  rationale: 保留见证对两个术语的区分，不将二者合并为“灵魂”。
- source_word: garments
  choice: 衣服
  rationale: 保留可作字面或象征理解的意象，不添加复活、荣耀或天上身体等解释。
- source_word: Eternally Existent One
  choice: 那永恒存在者
  rationale: 尽量直译称号，保留其本体论色彩而不以特定神学术语取代。
- source_word: living God
  choice: 永活的上帝
  rationale: 采用自然、庄重的现代汉语，同时保留“living”的强调。
theological_decisions:
- issue: “一道话语”是否应直接认定为神学意义上的“道”或基督
  choice: 译作“话语”，并保留其发出、下降、受问及行动的主体性
  alternative: 译作“道”，或明确称为基督
  rationale: 当前仅有英语见证且科普特语复核待定；不宜用中文传统神学术语提前消除文本中的含混。
- issue: “来自某个权能的种子有所缺失”的宇宙论含义
  choice: 按见证保留“权能”“种子”“缺失”
  alternative: 解释为堕落的灵魂、神性火花或受造者
  rationale: 这些解释均会导入特定体系；正文应保留原有神话性与神学张力。
- issue: “永活的上帝在你们里面……你们也在上帝里面”
  choice: 照其互在表达翻译
  alternative: 弱化为上帝与你们同在，或解释为本体同一
  rationale: 既不削弱内在性，也不把它解释成信徒与上帝在本体上完全等同。
- issue: “小的与大的一样”及“没有差别”
  choice: 保留平等化陈述而不说明对象身份
  alternative: 解释为得救者、灵魂、天使或复活身体之间的平等
  rationale: 残缺语境不足以支持明确指认。
- issue: “思量不义是无益的”
  choice: 维持原见证的反思性表述
  alternative: 改成“行不义是无益的”
  rationale: 虽然后者更自然，但会改变所提供见证中的 consider；待源语言复核前不作校正。
translation_notes:
  register: 采用现代标准普通话、简体中文，语气庄重但避免古奥。鉴于科普特语源文复核尚待进行，本稿严格以所提供的公共领域英语见证为暂定依据；保留方括号补拟、词语残缺与省略号所示缺文，不把模糊的宇宙论、灵魂论或神人关系系统化。为提升中文可读性，适度调整语序，但不消除“可见的声音”等原有张力。
