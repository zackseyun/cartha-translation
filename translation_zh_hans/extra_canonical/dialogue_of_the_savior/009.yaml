translation:
  language: zh_hans
  text: '“凡不明白〔完满之事〕的人，便一无所知。[a]


    “不站在黑暗中的人，不能看见〔……〕光。


    “不明白火如何产生的人，必在火中焚烧，却不知道火的源头。


    “人若不先明白水，便一无所知；因为这样的人在水中受洗，对他有什么益处呢？


    “不明白吹动的风如何产生的人，必与风一同被吹走。


    “不明白自己所穿戴的身体如何产生的人，必与这身体一同毁灭。


    “人若不认识子，又怎能认识〔父〕呢？


    “不认识万物之根的人，万事都向他隐藏。


    “不认识不义之根的人，对不义就不会陌生。


    “不明白自己如何来的人，也不会明白自己将如何去。


    “那将〔自高〕、并因此被降卑的人，对这个世界并不陌生。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英文见证翻译；《拿戈玛第文集》科普特语原文尚待直接核校。正文中的〔 〕表示见证文本所标出的补足；〔……〕表示该处有缺文而无法确定所缺文字。
    reason: 交代当前文本基础及补足、缺文符号，避免让暂定译文看似已经完成原文核校。
  - marker: b
    text: 末句的句法和所指并不完全明朗；这里依现有英文见证保留“对这个世界并不陌生”这一可能具有多重含义的说法。
    reason: 提醒读者该句可涉及熟悉、归属或牵连，不在正文中强行消解歧义。
lexical_decisions:
- source_word: deed of completeness
  choice: 完满之事
  rationale: 保留“deed/事”与“completeness/完满”的抽象张力，不把它具体化为某种仪式、功德或教义概念。
- source_word: stands not in the darkness
  choice: 不站在黑暗中
  rationale: 原句逻辑反常而可能具有刻意的悖论性，因此按见证文本直译，不擅自改成“站在黑暗中”。
- source_word: came into existence
  choice: 如何产生
  rationale: 用现代汉语自然表达起源或形成，同时不额外断定是受造、生成或流溢。
- source_word: the body he wears
  choice: 自己所穿戴的身体
  rationale: 保留身体如衣物般被“穿戴”的原始意象，不弱化为普通的“身体”。
- source_word: root of everything
  choice: 万物之根
  rationale: 保留“根”的象征及其可能兼具起源、根基之意的开放性。
- source_word: root of iniquity
  choice: 不义之根
  rationale: 以“不义”涵盖道德邪恶和不正，不具体化为某一罪行。
- source_word: no stranger to
  choice: 对……并不陌生
  rationale: 保留原文习语的含混性，既可表示熟悉，也可能暗示归属或牵连。
theological_decisions:
- issue: “完满之事”的含义
  choice: 不加解释地保留抽象说法
  alternative: 译作“成全的作为”或明确指某种救赎行为
  rationale: 现有英文见证不足以确定其专门术语含义，不应导入特定神学体系。
- issue: 黑暗与光之间的反常命题
  choice: 保留“不站在黑暗中……不能看见光”
  alternative: 按通常逻辑修订为“站在黑暗中的人不能看见光”
  rationale: 见证文本明确含有否定词；在科普特语核校前，应保存其悖论和文本张力。
- issue: 水与洗礼
  choice: 译为“在水中受洗”
  alternative: 译为“浸入其中”或赋予圣礼功效
  rationale: 保留 baptism 的直接宗教语义，但不说明其具体形式或神学功效。
- issue: “子”与“父”
  choice: 采用“子”“父”并保留“父”为补足文字
  alternative: 扩展为“圣子”“圣父”
  rationale: 避免加入见证文本未明说的后期规范称号，同时保留亲属及神学关系。
- issue: 末句的自高与降卑
  choice: 表达为因果关系“自高、并因此被降卑”
  alternative: 仅并列为“自高又降卑”
  rationale: 英文见证明确标出 consequently；译文保留其结果关系，但不说明施事者。
translation_notes:
  register: 采用现代、庄重而可读的普通话，以反复的“不明白/不认识”维持原段箴言式节奏。为避免与脚注标记[a]、[b]混淆，英文见证中的方括号补足统一改用中文六角括号〔〕；中断正文的手稿页码[15]不纳入译文。
