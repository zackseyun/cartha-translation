translation:
  language: zh_hans
  text: '犹大［说］：“我确实想要［明白一切］。”


    ［主］对他说：“永生的［上帝并不］住在这缺陷的整个［领域里的任何地方］。”


    犹大［问］：“谁［要统治我们］？”


    主回答：“［看哪，这里居住着］一切存在于将要存留之物［中］的。你们要［统治］他们。”


    犹大说：“看哪，那些执政者[a]在我们之上，因此他们要统治我们。”


    主回答：“统治他们的正是你们。你们除去自己里面的嫉妒时，就要披戴光明，并要进入洞房[b]。”


    犹大问：“我们的衣袍要怎样供给［我们］呢？”


    主回答：“有些人会供给你们，另一些人会领受［衣袍］，［］而正是他们［要把］你们的衣袍［给］你们。因为那地方如此［可畏］，谁能到达那里呢？然而，生命的衣袍会赐给人，因为他们知道自己将要走的道路。事实上，就连我要到达那里也很困难[c]。”


    马利亚说：“这样，每一天的难处<已经够了>[d]。工人配得自己的食物。学生将与他们的老师一样。”


    她说这话，像一个明白一切的女人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “执政者”译自见证文本的 archons，可指掌权者；在相关古代宗教语境中，也常指支配世界或宇宙领域的权势。此处不进一步确定其身份。
    reason: 该术语具有普通政治含义与特殊宇宙论含义，需保留歧义。
  - marker: b
    text: “洞房”也可译作“新房”或“婚房”。这里可能具有象征或礼仪意味，但残存文本本身没有作出解释。
    reason: 避免把婚礼空间意象预先归入某一特定神学体系。
  - marker: c
    text: “就连我要到达那里也很困难”依照所提供的英文见证直译；这一表述的残缺背景及其所指仍需科普特文复核。
    reason: 该句具有明显神学张力，且直接源语审校尚未完成。
  - marker: d
    text: 尖括号表示见证文本中的编者补入；方括号表示残缺处的复原。空方括号［］表示此处有未能复原的缺文。
    reason: 说明全文所保留的手稿与编辑符号；主文本中的“<已经够了>”属于编者补足。
lexical_decisions:
- source_word: archons
  choice: 执政者
  rationale: 保留相关古代宗教文献中兼具“掌权者”与宇宙性统治力量含义的术语，不将其直接解释为魔鬼或世俗官员。
- source_word: deficiency
  choice: 缺陷
  rationale: 保留该词可能具有的宇宙论或存在论意味；不擅自具体化为“堕落世界”或“物质界”。
- source_word: clothe yourselves with the light
  choice: 披戴光明
  rationale: 采用庄重而自然的汉语，保留“穿上”与光明结合的衣袍意象。
- source_word: bridal chamber
  choice: 洞房
  rationale: 直译其婚礼空间意象，不把它解释为某一特定礼仪、天界层次或神秘结合。
- source_word: garments of life
  choice: 生命的衣袍
  rationale: 保留“衣袍”母题及“生命”的修饰关系，不释义为救恩、复活身体或荣耀。
- source_word: attain
  choice: 到达
  rationale: 在空间语境中采用通顺译法，同时保留其也可能指“达到、获得”的开放性。
theological_decisions:
- issue: 门徒与执政者之间的权柄关系
  choice: 按见证文本译作“统治他们的正是你们”
  alternative: 将其弱化为“胜过他们”
  rationale: 原见证明确反转了统治关系；不应为减弱宇宙论色彩而改写。
- issue: 永生上帝与“缺陷”领域的关系
  choice: 保留否定式及残缺修复标记
  alternative: 解释为“上帝不住在这有缺陷的世界”
  rationale: 句中多处依靠修复，且“缺陷”可能是术语；避免将其固定解释为物质世界。
- issue: “就连我……也很困难”的说话者及含义
  choice: 照译并保留神学张力
  alternative: 改成“若不是靠我，任何人都难以到达”或另作教义协调
  rationale: 见证文本明确保留第一人称“我”；不凭后来的基督论预设修改。
- issue: 衣袍的供给者与领受者
  choice: 保留代词关系及空缺标记
  alternative: 补明为天使、灵魂或得救者
  rationale: 文本残缺且指代含混，无法可靠确定各方身份。
- issue: 马利亚三句格言之间的关系
  choice: 并列呈现，不增添因果解释
  alternative: 将三句整合为关于门徒训练或末世赏赐的单一论证
  rationale: 见证文本只是将这些格言相继排列，逻辑衔接并不完全明确。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。因尚未提供可直接审查的科普特文，本稿严格作为依据所给公共领域英文见证制作的暂定译稿；保留方括号、空方括号及尖括号所标示的复原、缺文与编者补入，不将残缺句法过度润色或教义化。
