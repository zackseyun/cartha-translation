translation:
  language: zh_hans
  text: '他的门徒[说：“主啊]，寻求的是谁，[启示的]又是谁？”


    [主]对[他们]说：“寻求的，[正是]启示的。”


    马太[又对他说：“主啊]，当我[听你说话]，也当我自己说话时，[说话的]是谁，听的又是谁？”


    [主]说：“说话的，正是[听的]；能看见的，正是启示的。”


    马利亚说：“主啊，请看，[当我]穿着身体时，我的眼泪从哪里流出？我的笑声又从哪里来？”


    主说：“[是身体]因自己的行为，也[因]仍有待完成的（行为）而哭泣；是心智[因着……圣灵的果实]而欢笑。凡[不站]在黑暗中的，都将[不]能看见[光]。[a]


    我告诉你们，[凡在光以外的]就是黑暗；[凡]不站在[黑暗中的，都将]不[能]看见光。[b]然而，[虚谎之子]被带了出去……你们要披戴光，并要[如此活到]永远……[如果……]，那么，上面和下面的[一切]权势都要残酷地对待你们。在那里，人要为[万]物的结局哀哭、[咬牙]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此句所据抄本残损，方括号内文字为补足；“不站在黑暗中……不能看见光”的反常说法按现有英文见证保留，未擅自改成相反意思。
    reason: 提醒读者关键否定词位于复原文本中，且句义存在真实的文本与解释困难。
  - marker: b
    text: 这一句大体重复前句，同样含有残损与补足。原科普特文尚待直接复核。
    reason: 标明重复段落的残损状态及本稿仅据公共领域英文见证起草的限制。
lexical_decisions:
- source_word: reveals
  choice: 启示
  rationale: 保留该词既可指显明真相、也可指属灵启示的开放性；避免译成较弱的“揭露”或预先指定启示的内容。
- source_word: wearing a body
  choice: 穿着身体
  rationale: 保留原文将身体比作衣物的鲜明隐喻，不改写成较自然却削弱意象的“活在肉身中”。
- source_word: mind
  choice: 心智
  rationale: 与“身体”形成原文所呈现的对照，同时不径直等同于“灵魂”或“心”，以免加入特定人论。
- source_word: spirit
  choice: 圣灵
  rationale: 原见证作“the spirit”；在宗教语境中用“圣灵”表达，但不借上下文进一步界定其所指。
- source_word: sons of deceit
  choice: 虚谎之子
  rationale: 保留闪语式关系表达及其群体称谓色彩，不将其解释性改写为“说谎的人”。
- source_word: put on the light
  choice: 披戴光
  rationale: 保留“穿上／披戴”的衣着隐喻，并与前文“穿着身体”形成可能有意的呼应。
- source_word: powers
  choice: 权势
  rationale: 保留其可指超自然势力或掌权力量的歧义，不具体化为“天使”“魔鬼”或世俗政权。
theological_decisions:
- issue: 寻求者与启示者被说成同一者
  choice: 直译为“寻求的，正是启示的”
  alternative: 解释为“寻求的人也必得着启示”
  rationale: 原文陈述身份同一，而非明确表达因果或应许；不替文本消解其神秘性。
- issue: 不在黑暗中者不能看见光的反常陈述
  choice: 保留否定：“不站在黑暗中……不能看见光”
  alternative: 校正为“站在黑暗中的不能看见光”
  rationale: 所据见证明确含双重否定式内容，且抄本残损；不能因神学或逻辑上的困难而静默修正。
- issue: 身体哭泣、心智欢笑的对照
  choice: 按原见证保留主体对照
  alternative: 解释为身体属恶、心智属善
  rationale: 文本本身没有在这一段明确建立完整的善恶本体论，因此不加入诺斯替主义或其他体系化解释。
- issue: “万物的结局”所指
  choice: 保留广义表达
  alternative: 具体译为“世界末日”
  rationale: “every thing”的范围及末世论含义并不完全确定；“万物的结局”较能保存开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。方括号保留抄本残损后的编者补足，省略号表示缺文；圆括号保留见证中对重复词“行为”的说明。因尚未完成科普特文原文复核，本稿为暂定出版草案，尤其不应消除否定句、主体同一及身体／心智对照中的歧义。
