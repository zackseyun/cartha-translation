translation:
  language: zh_hans
  text: '犹大问道：“主啊，请告诉[我们]，[天与]地尚未形成以前，有什么[存在]？”


    主说：“那时有黑暗和水，并且……有一个灵在[水]之上。[a]我实在告诉你们：看哪，你们所寻找、所询问的，就[在]你们里面；它[具有]灵的能力和奥秘，因为它[源于]灵。不义进入，[不断毁坏]心智。看哪，[……]。”


    [马太]说：“主啊，请告诉我们，[灵魂]安置在哪里？真正的[心智]又住在哪里？”


    主[说]：“灵的火在[二者之间]形成，灵也就这样产生了，真正的心智则在它们里面。[如果]有人把灵魂安置在高处，它就[必]被高举。”


    马太问他：……“若按[真正的解释]来理解，[割礼岂不是必需的吗]？”


    主[说：“割礼]比你们的[作为更有益。要从]你们自己里面[除去那能]迫害你们的，就是你们心里的一切；因为你们的心怎样[受割礼]，你们也照样[会找到]一条道路，胜过上方和下方的众权势。[b]我告诉你们：那[拥有]权力的人，要舍弃[权力]并悔改；那[明白]的人，要寻找、寻见，并且欢喜。”


    犹大说：“看哪，[我]看出万物都[恰如]地上的一个记号；它们之所以这样形成，正是这个缘故。”


    主[说]：“父建立世界的时候，把其中的一些水[聚集起来]，话语便从水中发出。[c]……它经历了许多[患难，却]高过环绕全地的[众星]轨道。


    “[上方]聚集的水在众星之外；水的[外面]<有>一个巨大的火狱，像墙一样环绕众星。[d]里面若干存在者一与其余的分开，时段就[开始被计算]。


    “当[整个事物]建立起来以后，他向[下]观看；父对它说：‘去吧，从你自己里面[生出一些东西]，使[大地]世世代代、永永远远都不缺少什么。’[e]


    “于是，[它]从自己里面涌出奶的泉、蜜的泉、油的泉、酒的泉，又生出佳美的果实、可口的滋味和有益健康的根，使大地世世代代、永永远远都不缺少什么。


    “它在上方[……]，……站立着，[显出]自己的美丽[……]。在外面，[有一道大光]，比那与它相似的光更明亮；因为那一道光统管上方和下方的[一切]永世。[f][光]从火中抽出，散布在上方和下方的[穹苍]。上方诸天之上的和下方大地之上的，都悬于它们；万物都悬于它们。”[g]


    犹大听见这些话，就俯伏在地，双膝跪下，赞美主。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段开头有缺文；“一个灵”及“水”周围的文字部分经补足。“灵”也可理解为“气息”或“风”，现有见证不足以确定。
    reason: 说明残缺及关键词的真实语义歧义。
  - marker: b
    text: 这段关于割礼的文字严重残缺；“比你们的作为更有益”等措辞是据现有见证补出的读法。这里从割礼转向“心受割礼”，但两者关系不能由残文完全确定。
    reason: 避免把残缺论述塑造成确定的礼仪教义。
  - marker: c
    text: “话语”也可译作“言语”或“道”；本段没有清楚说明它是否指一位有位格的存在。
    reason: 保存词义与神学身份的开放性。
  - marker: d
    text: 尖括号表示抄本中没有、但为使句子通顺而补入的词；这里的宇宙景象及若干方位词也受缺文影响。
    reason: 交代角括号的文本批判功能。
  - marker: e
    text: “他”和“它”的具体所指在残缺原文中并不清楚，可能涉及父、已建立的整体、世界或前文所述的某一实在。译文保留代词，不强行判定。
    reason: 保留指代歧义。
  - marker: f
    text: “永世”所对应的词既可指漫长的时代，也可指宇宙中的层域或属灵实在。
    reason: 解释古代宇宙论术语的语义范围。
  - marker: g
    text: 末段多处残缺；“那与它相似的光”“那一道光”以及复数“它们”的先行词都不明确。
    reason: 标明末段无法可靠消解的指代问题。
lexical_decisions:
- source_word: spirit
  choice: 灵
  rationale: 原见证在多处使用同一词，可能指宇宙性的灵、人的灵或属灵实在；统一译作“灵”，不以“圣灵”等措辞预先限定身份。
- source_word: mind / true mind
  choice: 心智／真正的心智
  rationale: 译作“心智”以表达认知与内在意识，不简单等同于现代汉语较偏情感或道德意味的“心”。
- source_word: soul
  choice: 灵魂
  rationale: 采用普通现代汉语中可理解的对应词，并与“灵”和“心智”保持词汇区分。
- source_word: word
  choice: 话语
  rationale: 保留人格化或创生性“话语”的可能性，但避免直接译作带有较强约翰文献联想的专名“道”。
- source_word: powers
  choice: 众权势
  rationale: 此处可能指宇宙性的掌权者或能力；用“众权势”保存其复数和超人间语境，不具体化为某类灵体。
- source_word: aeons
  choice: 永世
  rationale: 该词兼有漫长时代与宇宙层域的含义；“永世”保留古代宇宙论色彩，脚注提示其语义范围。
- source_word: firmament
  choice: 穹苍
  rationale: 采用庄重而仍可理解的宇宙论用语，与上下诸天的语境相符。
- source_word: circumcision
  choice: 割礼／受割礼
  rationale: 保留身体礼仪与内心象征之间有意形成的张力，不改写成单纯的“洁净内心”。
theological_decisions:
- issue: “灵”是否明确等同于圣灵
  choice: 保留为“灵”
  alternative: 译为“圣灵”
  rationale: 现有见证没有足够依据加入“圣”字；上下文也容许更广泛的宇宙论或人论含义。
- issue: “割礼”的必要性及其内在化
  choice: 保留问句、残缺处及“心受割礼”的比拟
  alternative: 解释为废除肉身割礼、只承认属灵割礼
  rationale: 残卷文字并未完整呈现论证，不能替作者解决身体礼仪与内心转化之间的张力。
- issue: “话语”是否作为神圣位格
  choice: 不加专名化标记
  alternative: 译作“圣道”或“道”
  rationale: 文本说话语从水中发出，但其位格和身份在本段并不清楚。
- issue: “上方和下方的权势”之性质
  choice: 保持概括性宇宙权势语言
  alternative: 明确译成天使、魔鬼或执政者
  rationale: 现有文字不足以确定这些权势的道德属性或具体类别。
- issue: 末段光、火与代词的所指
  choice: 保留模糊代词并加脚注
  alternative: 按某一宇宙论体系补出具体主体
  rationale: 残缺文本中先行词不清，明确化会制造原文没有的确定性。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。方括号保留见证中补出的文字，省略号表示缺文，尖括号保留编辑性补字；抄本页码未置入正文。人名采用通行译名“犹大”“马太”。由于所供材料注明科普特语源文复核尚待进行，本稿是依据公共领域英文见证形成的暂定源证据草案，不宣称已完成直接科普特语校勘。
