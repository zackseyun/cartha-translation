translation:
  language: zh_hans
  text: '门徒问他：“什么是圆满，什么是缺乏？”


    他回答他们：“你们从圆满而来，却住在缺乏之地。


    看哪，他的光已经倾注在我身上。”


    马太问：“主啊，请告诉我，死去的人怎样死，活着的人怎样活？”


    主说：“[你们曾]问我一句眼睛未曾看见的[真]话，而我只从你们这里听过这话。不过，我告诉你们：当那赋予人生命的被取走时，这人就称为死的；当那活着的<进入>死的里面时，这人就称为活的。”[a]


    犹大问：“说实在的，为什么有些人<死>，有些人活？”


    主说：“凡从真理而来的，都不会死；凡从女人而来的，都会死。”


    马利亚问：“主啊，请告诉我，我为什么来到这地方？是要得益，还是要受损？”


    主回答：“你显明那位显明者的丰富。”[b]


    马利亚问他：“主啊，那么，是否有一个地方被真理离弃，或缺少真理？”[c]


    主说：“就是我不居住的地方。”


    马利亚说：“主啊，你使那些不认识[你]的人又惧怕又惊奇，甚至[如同吞噬一切的火]。”[d]


    马太问：“我们为什么不能立刻安息？”


    主说：“把你们不能随身带走的东西留下，那时你们就会安息。”


    马太问：“小的怎样与大的协调一致？”


    主说：“要把这些重担留下。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号表示见证译者补足或复原的文字；尖括号表示经编辑校正或补入的文字。本句中“那赋予人生命的”“那活着的”和“死的”具体所指并不明确。
    reason: 保留残缺文本和编辑复原信号，并提示关键指称的真实歧义。
  - marker: b
    text: “你显明那位显明者的丰富”也可理解为“你彰显启示者的财富”；原句刻意重复“显明”这一词义关系。
    reason: 说明较生硬但重要的词根呼应及“wealth”的语义范围。
  - marker: c
    text: 现有见证可有两种理解：一个地方被真理所离弃，或一个地方缺少真理。正文并列保留这两种可能。
    reason: 原见证以括号标示句法不确定性。
  - marker: d
    text: “你”和“如同吞噬一切的火”属于见证中复原的文字，原稿此处有残缺。
    reason: 交代方括号内容的文本状况；裸页码已不收入正文。
lexical_decisions:
- source_word: fullness
  choice: 圆满
  rationale: 保留与“缺乏”相对的抽象、宇宙论意味，同时采用现代汉语中自然而庄重的表达。
- source_word: deficiency
  choice: 缺乏
  rationale: 不擅自具体化为某种物质或道德缺陷，保留原见证的抽象性。
- source_word: what animates a person
  choice: 那赋予人生命的
  rationale: 英文见证没有明确指称灵、魂或气息，故避免用特定术语消除歧义。
- source_word: the revealer
  choice: 那位显明者
  rationale: 保留施事者意义及原句“显明/显明者”的词根呼应。
- source_word: rest
  choice: 安息
  rationale: 既可表达停止劳苦，也保留宗教语境中较深的终极安歇意味。
- source_word: harmonize
  choice: 协调一致
  rationale: 表达大小两者相配或和谐的关系，不额外解释其象征对象。
theological_decisions:
- issue: “凡从女人而来的，都会死”的人性与死亡表述
  choice: 按见证直译，保留其尖锐张力
  alternative: 释为“凡属肉身的都会死”
  rationale: 原见证明说“woman”，改成“肉身”会加入解释并削弱文本本身的神学张力。
- issue: “他/他的光”的指称
  choice: 保留第三人称“他的光”
  alternative: 改作“他的（圆满者的）光”或“你的光”
  rationale: 先行词在现有见证中不明确，不应擅自确定其所指。
- issue: “活着的进入死的里面”所指为何
  choice: 保留实体化且含混的“那活着的”与“死的”
  alternative: 解释为灵进入身体或生命进入尸体
  rationale: 现有依据不足以锁定灵魂论或复活论解释。
- issue: “真理离弃/缺少真理”的句法关系
  choice: 并列保留两种可能理解
  alternative: 只译为“没有真理的地方”
  rationale: 英文见证明确呈现 forsaken (by) 与 lacks 两种句法可能，译文不宜默默选定其一。
translation_notes:
  register: 采用现代标准普通话，语体庄重但尽量清楚。因科普特语原文复核尚待完成，本稿以所给公共领域英文见证为暂定依据；保留方括号与尖括号的文本批判信号，删除仅表示手稿分页的19、20。人名采用常见中文圣经译名“马太、犹大、马利亚”。
