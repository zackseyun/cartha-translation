review_pass:
  verdict: revise
  source_fidelity: 译稿总体忠实保留了见证文本的重复、残缺标记及“愤怒”拟人化的异常施事关系。不过，“temporality”译为“现世”把“时间性／受时间支配的状态”具体化为世界或时代，超出所给英语见证。“for the elect and solitary, [] those …”一处则遗漏了见证中明确保留的空方括号，并添加“这是为”及较强的句法重组，宜恢复其残缺和句法未定性。
  naturalness: 整体庄重、可读。“安然站立”略带原文未明示的“安然”意味；改作“安歇地站立”虽略具文献语体，却更直接保留“stand at rest”与后文“rest forever”的对应。缺损的“fear … you”不能为求流畅而补足，应容许其保持片段状态。
  terminology: “救主”“愤怒”“掌权者”“父”及“蒙拣选者、独居者”均可保留。“时间性”比“现世”更贴近 temporality，且不预断其宇宙论含义。“跨越之道”保留 crossing over 的空间和象征双关，合适。
  issues:
  - severity: medium
    issue: “temporality”译作“现世”
    rationale: “现世”通常指今世、当前世界或尘世；temporality 的核心是时间性或受时间限制的状态。原处又有残缺，宜采用较不解释性的“时间性”。
  - severity: high
    issue: 遗漏见证中的空方括号“[]”，并在末段加入“这是为”
    rationale: 空方括号是所供见证特意保留的结构性残缺信号。加入“这是为”会将原本在缺损处不明的句法关系确定化；应恢复“［］”并以较中性的断句呈现。
  - severity: low
    issue: “安然站立”增加了“安然”的语义
    rationale: stand at rest 表示站立而安歇；“安然”带有平安、从容之意。改为“安歇地站立”更贴近见证，同时维持与“永远安息”的词汇关联。
  revised_text: '救主对他的门徒说：“弟兄们，如今时候已经到了，我们该停下工作，安歇地站立，因为安歇地站立的人必永远安息。我告诉你们，要常常超越［……］时间性［……］。［我告诉］你们，［……］不要惧怕［那些……］你们。我［告诉你们］，愤怒是可怕的，［而激起］愤怒的人是［可怕的人］。然而，因为你们［已经能够忍受］，它或许会从［你们……］出来。


    “众人战战兢兢地领受了这些关于愤怒的话。愤怒为他们设立了掌权者，因为没有人能躲开愤怒。然而，我来时开辟了一条道路，并教导人那为蒙拣选者和独居者［］——就是那些认识父、忠于真理之人的跨越之道；而你们献上了赞美。”[a][b][c]'
  revised_footnotes:
