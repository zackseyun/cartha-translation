translation:
  language: zh_hans
  text: '救主对他的门徒说：“弟兄们，如今时候已经到了，我们该停下工作，安然站立，因为安然站立的人必永远安息。我告诉你们，要常常超越［……］现世［……］。［我告诉］你们，［……］不要惧怕［那些……］你们的人。我［告诉你们］，愤怒是可怕的，［而激起］愤怒的人是［可怕的人］。然而，因为你们［已经能够忍受］，它或许会从［你们……］出来。


    “众人战战兢兢地领受了这些关于愤怒的话。愤怒为他们设立了掌权者，因为没有人能躲开愤怒。然而，我来时开辟了一条道路，并教导人怎样越过去；这是为蒙拣选、独居的人［……］，就是那些认识父、忠于真理的人；而你们献上了赞美。”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号及其中的省略号表示抄本残缺或译者据残文所作的补足；本段若干句子的确切措辞因此不能确定。
    reason: 说明文本损坏与复原标记，防止读者把补足内容视为完整可靠的抄本文字。
  - marker: b
    text: “掌权者”译自见证中的 archons，可指统治者，也可能指此类文献中的超自然权势；这里不限定其所指。
    reason: 保留关键术语的历史与神学歧义。
  - marker: c
    text: 本译文暂依据所提供的公版英译见证；纳戈·哈玛第抄本 III,5 的科普特语原文尚待直接复核。
    reason: 如实标明当前译稿的证据层级和暂定性质。
lexical_decisions:
- source_word: Savior
  choice: 救主
  rationale: 沿用早期基督教文献中自然、庄重且广为理解的称谓。
- source_word: stand at rest / rest
  choice: 安然站立／安息
  rationale: 保留原见证中“站立”与“安息”的词义关联，同时使现代汉语可读；不把它直接解释为停止活动、死亡或得救。
- source_word: temporality
  choice: 现世
  rationale: 此处语境可能指受时间辖制的现世状态；译作“现世”较自然，但原科普特语尚待核查，因此保留损坏标记以避免过度确定。
- source_word: anger
  choice: 愤怒
  rationale: 使用中性而庄重的常用词，并保留它既可指情绪、也仿佛被人格化为支配力量的张力。
- source_word: archons
  choice: 掌权者
  rationale: 该词在相关文献中可指统治者或宇宙性的权势；“掌权者”保留两种可能，不直接音译或限定为某类灵体。
- source_word: crossing over
  choice: 越过去
  rationale: 保留空间性和象征性的双重含义，不擅自解释为死亡、升天或脱离物质世界。
- source_word: elect and solitary
  choice: 蒙拣选、独居的人
  rationale: 分别呈现两个称谓；“独居”保留 solitary 的基本意义，不将其教派化为特定修行阶层。
- source_word: Father
  choice: 父
  rationale: 保留文献的亲属称谓及其神学开放性，不擅加“天父”等解释性成分。
theological_decisions:
- issue: “安然站立”与“永远安息”的关系
  choice: 保留两个相近但不完全相同的表达
  alternative: 统一译作“安息”或解释为进入永恒救恩
  rationale: 见证文本刻意并置 standing at rest 与 rest；统一或解释会抹平可能的修辞和神学张力。
- issue: 愤怒是否被人格化为宇宙力量
  choice: 保留“愤怒为他们设立了掌权者”的拟人表述
  alternative: 解释为“愤怒使统治者辖制他们”或“他们因愤怒而受邪灵控制”
  rationale: 原句施事关系异常但明确；不应替文本解决其宇宙论或伦理学含义。
- issue: “蒙拣选、独居的人”的身份
  choice: 按并列称谓直译
  alternative: 译作“被选中的独身者”“灵性上的合一者”或某一特定教派成员
  rationale: solitary 的具体内涵有争议，且尚无直接科普特语复核，不宜加入宗派性解释。
- issue: 末句“你们献上了赞美”的句法关系
  choice: 保留为面向门徒的独立并列句
  alternative: 将其并入“忠于真理的人”的定语，或改为命令句
  rationale: 英语见证的句法连接略显突兀；译文保留这种突兀，不重构缺损上下文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。尽量保存见证文本的重复、突兀句法和神学张力；对残缺处统一使用全角方括号与省略号。因直接科普特语审校尚未完成，本稿属于可供出版流程继续校勘的暂定译稿。
