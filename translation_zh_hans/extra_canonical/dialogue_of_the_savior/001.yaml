review_pass:
  verdict: revise
  source_fidelity: 需修订。现稿将“temporality”实质性解释为“现世”，缩窄了“时间性／受时间限制的状态”的含义；又在残缺句“fear [not those . . .] you”中补出了“的人”，使残缺处获得原见证未提供的句法信息。末段把见证的空方括号改作带省略号的方括号，并增添“这是为”，均超出所给英语言见证。
  naturalness: 整体庄重、通顺。“安然站立”“永远安息”自然且保留重复。残缺句改按残文信号直呈后会略显断裂，但这种断裂由抄本缺损造成，应优先保留。
  terminology: “救主”“掌权者”“父”“真理”“蒙拣选、独居的人”均可保留。“时间性”比“现世”更贴近 temporality，且避免预断其宇宙论含义。
  issues:
  - severity: medium
    issue: “temporality”译为“现世”
    rationale: “现世”指当下世界或今生，不能稳妥覆盖 temporality 的“时间性／受时间制约性”；在尚未直接核对科普特语的情况下不宜作此解释性收窄。
  - severity: high
    issue: 在“fear [not those . . .] you”处补出“的人”
    rationale: 见证仅保留残缺的“你们”，未明确其与前文的语法关系；“的人”把对象固定为人，属于无标记补足。
  - severity: medium
    issue: 见证中的空方括号[]被改成“［……］”
    rationale: 空方括号是见证保留的独立缺损信号；加入省略号改变了其形式，且与审校轨迹不一致。
  - severity: medium
    issue: “这是为蒙拣选、独居的人”增添连接和目的关系
    rationale: 英语见证在“the elect and solitary, [] those ...”处句法残断，未出现“这是为”；应保留其不完整连接，避免重构。
  revised_text: 救主对他的门徒说：“弟兄们，如今时候已经到了；我们该停下工作，安然站立，因为安然站立的人必永远安息。我告诉你们，要常常超越［……］时间性［……］。［我告诉］你们，［……］不要惧怕［那些……］你们。我［告诉你们］，愤怒是可怕的；［凡激起］愤怒的人是［可怕的人］。然而，因为你们［已经能够忍受］，它或许会从［你们……］出来。\n\n“众人战战兢兢地领受了这些关于愤怒的话。愤怒为他们设立了掌权者，因为没有人能躲开愤怒。然而，我来时开辟了一条道路，并教导人有关蒙拣选、独居之人越过去的道路，［］那些认识父、忠于真理的人；而你们献上了赞美。”[a][b][c]
