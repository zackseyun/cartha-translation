    text: 方括号及其中的省略号表示抄本残缺或译者据残文所作的补足；本段若干句子的确切措辞因此不能确定。空方括号“［］”按所据英语见证保留，表示该处的缺损未给出任何补足文字。
    reason: 说明省略号方括号和空方括号两类残缺标记，避免将缺损处的句法关系视为确定。
