  naturalness: 整体语体庄重、可读。“这些小子之众魂”不合现代汉语习惯，改为“属于这些小小者的众魂”；“但你们[不会]存留”既自然又避免把将来否定误解为能力否定。
  terminology: “救主”“主”“心智”“心”“魂”“同伴”“真理”等术语的处理总体适切，并保留文本的概念区分和指称开放性。“小小者”比“小子”更中性，也较少引入汉语圣经传统中固定的修辞联想。
  issues:
