    issue: “你们却[不能]”误译否定陈述
    rationale: 英文“[your work] will survive, but [not] you”表示工作会存留、你们却不会存留；“不能”通常表示无能力或不得许可，改变了原句的断言性质。
  - severity: low
    issue: “这些小子之众魂”搭配生硬且关系不清
    rationale: 英文是“属于这些 little ones 的众魂”，应使“众魂”明确作为“属于”的中心语；“小小者”保留 little ones 的不确定身份而较符合现代汉语。
  - severity: medium
