    rationale: 英文见证在“[I have called] you [to myself]”及“[you might accept] my word among [you. Behold]”处标示了特定的残缺与补文范围。修订将这些恢复信号更清楚地保留，同时不对“在你们中间”的句法归属作神学化解释。
