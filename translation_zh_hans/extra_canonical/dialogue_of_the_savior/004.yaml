translation:
  language: zh_hans
  text: '马太说：“怎样……？”[a]


    ……救主说：“[如果你们不使]你们里面的保持有序，[你们的工作]会存留下来，你们却[不能]。”[b]


    犹大[说]：“主啊，[我想知道属于]这些小子之众魂的一切作为。他们……的时候，将住在哪里？……灵……？”[c]


    主[说：“……接纳]他们。他们既不死，也不被毁灭，因为他们已经认识了[他们的]同伴，也认识了那将接纳他们的；因为真理寻找智慧和公义的人。”[d]


    救主[说]：“身体的灯是心智。只要你们[里面的]保持有序，也就是[魂]保持有序，你们的身体就会[明亮]。你们的心若昏暗，你们所……盼望的光就会[离你们很远]。我已召你们[到我这里来]，因为我很快就要离去，好让[你们在]彼此中间[领受]我的话。[看哪]，我把它传给[你们]。”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原稿此处残缺；省略号表示文字散佚，问句内容无法复原。
    reason: 说明残损而不补足未知内容。
  - marker: b
    text: 方括号内是残缺处的编辑性补文；本句开头之前另有无法辨认的文字。“工作”也可指“作为”或“成果”，确切所指不明。
    reason: 保留修复层级及词义不确定性。
  - marker: c
    text: 本段多处残缺。“这些小子”也可理解为“这些微小者”；“众魂”与“作为”之间的关系因缺文而不完全清楚。
    reason: 提示语法和身份指称均不确定。
  - marker: d
    text: 主回答的开头已经残缺；“同伴”及“那将接纳他们的”分别指谁，现存文字没有说明。
    reason: 避免把不明对象神学化。
  - marker: e
    text: 本段各方括号内容均属补文。“传给”所译原见证为“send”，也可理解为“差送”；代词“它”指“我的话”。
    reason: 交代修复性质，并保留发送动词的语义范围。
lexical_decisions:
- source_word: Savior
  choice: 救主
  rationale: 沿用早期基督教文献中自然、庄重且广为理解的称谓。
- source_word: maintain in order
  choice: 使……保持有序／保持有序
  rationale: 保留原见证所呈现的秩序与维持含义，不释义为特定的伦理或灵修实践。
- source_word: souls
  choice: 众魂
  rationale: 以“魂”对应 soul，避免直接等同于现代汉语中常带完整人格或鬼魂意味的“灵魂”；“众魂”也保留复数。
- source_word: mind
  choice: 心智
  rationale: 表达认知、理解的内在能力，并与下文“心”和“魂”区分。
- source_word: heart
  choice: 心
  rationale: 保留古代宗教语言中内在中心的意象，不缩窄为情感。
- source_word: companions
  choice: 同伴
  rationale: 保留关系对象的宽泛性，不擅自确定为天使、同道或其他群体。
- source_word: the truth seeks
  choice: 真理寻找
  rationale: 保留真理被拟人化为主动寻找者的表达。
- source_word: my word
  choice: 我的话
  rationale: 保持语义开放，不将其教义化为特定术语。
theological_decisions:
- issue: “里面的”具体指什么
  choice: 正文先保留“你们里面的”，随后按残缺见证保留“也就是[魂]”
  alternative: 统一译作“你们里面的魂”
  rationale: 文本前后既有较宽泛的内在之物，也有编辑补出的“魂”；不应抹平这一张力。
- issue: “工作存留而人不存留”的含义
  choice: 直译其对照关系
  alternative: 释义为功业、行为或作品存留而本人不得救
  rationale: 残文不足以确定“工作”的具体所指，也不宜加入得救论解释。
- issue: “不死，也不被毁灭”的对象与性质
  choice: 按最近的“他们”保留陈述
  alternative: 解释为众魂天然不朽或特定群体获得永生
  rationale: 上下文严重残缺，无法据此建立灵魂本体论或救恩次序。
- issue: “那将接纳他们的”所指
  choice: 维持单数而不点明身份
  alternative: 明确译为救主、父、神或接引者
  rationale: 现有见证没有足够证据识别这一对象。
- issue: “灯”与“光”的象征意义
  choice: 保留身体、心智、心、魂和光之间的原有隐喻关系
  alternative: 解释为属灵洞见、救赎知识或神性火花
  rationale: 避免将象征系统归入某一宗派或现代学术重构。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。因尚未完成科普特语原文复核，本稿严格依照所给公共领域英文见证起草；方括号保留编辑补文，省略号保留手稿残损，不以流畅性掩盖断裂。术语“心智、心、魂”刻意区分，以保存文本内部可能存在的概念差异。
