lexical_decisions:
- source_word: soul
  choice: 灵魂
  rationale: 采用现代汉语中最直接、通行的对应词，并保留全文将灵魂人格化为女性的意象。
- source_word: androgynous
  choice: 形体兼具男女两性
  rationale: 清楚表达同时具有男性与女性形态的含义，避免用可能过于技术化或含混的“雌雄同体”。
- source_word: Father
  choice: 父
  rationale: 保留原文的亲属称谓及神学意象；在祈语中译作“我的父”。
- source_word: visited
  choice: 眷顾
  rationale: 此处不仅指到访，也包含临到、关怀与察看的意味；“眷顾”符合庄重宗教语体。
- source_word: give an account
  choice: 交账
  rationale: 保留向父说明或负责的意象，同时以方括号标示见证文本中的补复。
- source_word: maiden’s quarters
  choice: 闺房
  rationale: 自然表达未婚女子所居之处，并保持离家、失贞与归回的叙事意象。
theological_decisions:
- issue: 灵魂的女性人格化
  choice: 全篇以“她”指称灵魂
  alternative: 用无性别的“它”
  rationale: 原文明确说灵魂具有女性本性和子宫，并持续采用女性、童女、妻子、寡妇等意象；使用“她”忠实保留这一结构。
- issue: “与父同住时”的童贞及双性形态之间的张力
  choice: 并列保留“童女”与“兼具男女两性”
  alternative: 将双性解释为纯粹属灵或无性
  rationale: 见证文本同时陈述两者，不应在翻译中消解其张力或加入体系化解释。
- issue: 父的怜悯与“配得”之间的关系
  choice: 译为“认为她配得他的怜悯”
  alternative: 改写为无条件赐下怜悯
  rationale: 保留原文因她的境况与苦难而判定其值得怜悯的表述，不导入特定恩典论。
- issue: 灵魂堕入身体
  choice: 直译为“坠入身体”
  alternative: 弱化为“进入身体”或解释为道德堕落
  rationale: 原文同时使用“fell into a body”和“entered this life”；保留其下降或堕落色彩，而不判定这是否意味着身体本身邪恶。
