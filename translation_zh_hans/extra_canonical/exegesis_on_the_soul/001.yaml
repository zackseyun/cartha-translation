translation:
  language: zh_hans
  text: '[a]很久以前，智者们用阴性名称称呼灵魂。事实上，她的本性也是女性；她甚至有子宫。


    当她独自与父同住时，她还是童女，形体兼具男女两性。然而，她一旦坠入身体、进入今生，就落在许多强盗手中。那些残暴之徒把她彼此转交，并[强暴]她。有些人用强力占有她，另一些人则用礼物诱惑她。简而言之，他们玷污了她，她也[失去]了她的[b]童贞。


    她在自己的身体里卖淫，毫无例外地把自己交给所有人，把每一个她愿意拥抱的人都当作丈夫。她任凭那些残暴、不忠的奸夫糟蹋之后，便深深呻吟，悔恨不已。


    可是，即使她转脸离开那些奸夫，也仍会奔向别的人；那些人强迫她与他们同住，在他们床上服侍他们，仿佛他们是她的主人。她因羞耻而不再敢离开他们。至于他们，却长久欺骗她，装作忠贞、真诚的丈夫，仿佛十分敬重她。经历这一切之后，他们便抛弃她，离她而去。


    于是，她成了一个无依无靠、贫穷凄凉的寡妇。在患难中，她连一口食物也没有剩下。她从他们那里所得的一切，不过是性交带来的污秽。她同奸夫所生的儿女，都是哑的、瞎的、患病的、心智昏弱的。


    然而，至高的父眷顾她、察看她，看见她在痛苦和羞耻中呻吟，为自己所行的淫乱悔恨；她又开始呼求他的名，求他帮助。她便全心[呻吟]说：“救我吧，我的父！求你察看我，因为我要向你[交账]；我离弃了自己的家，又从[c]闺房逃了出来。求你使我再次归回你自己。”


    当他看见她处在这种境况中，就会认为她配得他的怜悯，因为她离弃自己的家之后，遭遇了许多苦难。'
