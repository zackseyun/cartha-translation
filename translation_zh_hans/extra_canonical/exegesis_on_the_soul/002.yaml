review_pass:
  verdict: revise
  source_fidelity: 稿本总体忠实保留了英文见证的论证结构、露骨的性意象、经文引语的非通行措辞，以及方括号所标示的残损和编辑补足。仍有数处需要校正：将“challenge”译成“争战”混同了后文所引弗6:12的争战意象；“close them in”的代词对象被不必要地改成不合语法的“把他们封闭起来”；“insisted”被加强为“一再”；结尾的“对象”弱化了原文“everyone”的人称指向。
  naturalness: 整体为现代、庄重且可朗读的普通话。“肉体硕大的人”“没有知觉的外在之物”等虽略显生硬，但正对应见证文本的刻意陌生表达，宜保留。将“最艰难的［争战］”改为“最棘手的［难题］”，并调整“封闭”句及使徒劝告句后，语义和汉语表达都会更清晰。
  terminology: “灵魂”“行淫／淫乱”“牧人”“肉体的国度”“感官可知的领域”等核心术语处理可接受，并适当地没有以通行中文圣经文本取代本作品的特殊引文。为准确反映引自林前5:9的“prostitutes”，改用“娼妓”，避免把该处泛化为“淫乱的人”；此处不改变作品随后对其作灵意解释的立场。
  issues:
  - severity: medium
    issue: “最艰难的［争战］”
    rationale: 英文见证为“the most difficult [challenge] pertains to”，方括号补足应为“难题／挑战”，不是“争战”。“争战”属于紧接着所引以弗所书的不同词汇场，造成概念混淆。
  - severity: medium
    issue: “我要把他们封闭起来”
    rationale: “close them in”中的“them”虽指代不够明确，但中文“把他们封闭起来”既不自然，也使后面的“她不能追赶自己的情人”关系不清。改为“我要把他们围困住”保留复数代词及其未明指向。
  - severity: low
    issue: “一再嘱咐”及“防备它，并洁净自己，除去它”
    rationale: “insisted”并未明确表示反复；“purify yourselves from it”应表达使自身脱离此事而得洁净。改为“郑重劝告：‘你们要防备它；要洁净自己，脱离它。’”更贴近见证。
  - severity: low
    issue: 林前5:9引语中的“淫乱的人”
    rationale: 见证明确作“prostitutes”，为与前后“prostitution”相连的具体名词；译为“娼妓”较准确。
  - severity: low
    issue: 结尾“与每一个遇见的对象交合”
    rationale: 原文是“having sex with everyone she meets”；“对象”可能指物或泛指事物。应明确为“与她所遇见的每一个人交合”。
  revised_text: '现在，关于灵魂的淫乱，圣灵曾在许多地方发出预言，借着先知耶利米说：


    “丈夫若休了妻子，她离去另嫁别人，还能再回到丈夫那里吗？那女人岂不是已经彻底玷污了自己吗？主说：‘你曾向许多牧人行淫，后来却回到我这里。你要举目仔细观看，看看你在哪里行过淫。你不是坐在街头，以你的淫行和邪恶玷污了这地吗？你接受许多牧人，成了自己的绊脚石；你在所有人面前都不知羞耻。你没有称我为亲人、父亲，或你童贞的守护者。’”（耶利米书3:1–4）


    何西阿先知书上又写着：


    “来吧，与你们的母亲争辩，因为她不再作我的妻子，我也不再作她的丈夫。我要从我面前除去她的淫行，从她两乳之间除去她的奸淫。我要剥去她的衣服，使她赤裸，像她出生那天一样；我要使她成为旷野，像无水之地，并使她［因无儿女而渴望］。[a]我必不怜悯她的儿女，因为他们是淫乱所生的儿女；他们的母亲行了淫，并且［以可耻之事对待她的儿女］。［……］[b]因为她说：‘我要追随我的情人行淫；他们给我饼和水、衣服和袍子、酒和油，以及我所需要的一切。’所以，看哪，我要把他们围困住，使她不能追赶自己的情人。她寻找他们却找不到时，就会说：‘我要回到我从前的丈夫那里；那时我的景况比现在好。’”（何西阿书2:2–7）


    他在以西结书中又说：


    “主说：‘在你作了许多恶事之后，你建造妓院，又在街上为自己的美貌设置场所。你在每条街上建造妓院，挥霍自己的美貌，在每条巷口张开双腿，多多行淫。你向埃及人——你那些肉体硕大的邻舍——行淫。’”（以西结书16:23–26）


    那么，“埃及人——肉体硕大的人”是什么意思呢？无非是肉体的国度、感官可知的领域和尘世事务。灵魂在这里从这些事物取得饼，又取得酒、油、衣服，以及身体周围其他没有知觉的外在之物——就是她以为自己不可缺少的东西；这些事物便玷污了她。


    然而，关于这种淫乱，救主的使徒郑重劝告：“你们要防备它；要洁净自己，脱离它。”这不仅指身体的淫乱，尤其是指灵魂的淫乱。因此，使徒写信给上帝的［众教会］，[c]免得我们中间发生［这种淫乱］。


    然而，最棘手的［难题］关乎灵魂的淫乱［……］；[d]身体的淫乱也从其中产生。因此，保罗写信给哥林多人说：“我曾在信上写给你们：‘不可与娼妓来往。’这并不是泛指世上的娼妓，或贪婪的人、勒索人的、拜偶像的人；若是那样，你们就必须离开这个世界了。”（哥林多前书5:9–10）这里他说的是属灵的事，正如他说：“因为我们的争战不是对抗血肉之人，而是对抗这黑暗世界的统治者和邪恶的灵。”（以弗所书6:12）


    只要灵魂仍旧四处奔走，与她所遇见的每一个人交合，玷污自己，她就承受自己应得的苦果。'
