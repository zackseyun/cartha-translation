    reason: 保留手稿空缺，不根据何西阿书通行文本擅自补齐。
  - marker: c
    text: “众教会”为编辑补足；现存见证在此并不完整。
    reason: 让读者区分可见文本与现代补足。
  - marker: d
    text: “争战”为语境性补足，后面的“［……］”表示另一处缺损；原句的精确结构尚待源语复核。
    reason: 如实呈现句法和手稿状态的不确定性。
lexical_decisions:
- source_word: prostitution / played the harlot
  choice: 淫乱／行淫
  rationale: 用现代汉语中庄重而直接的词语，同时涵盖身体行为及作者贯穿全文的灵性隐喻；按句法分别采用名词“淫乱”和动词“行淫”。
- source_word: soul
  choice: 灵魂
  rationale: 保留本文拟人化的核心主题，并以阴性代词所承载的妻子、母亲和妓女意象贯穿上下文；汉语中因代词不标语法性别，主要借相关称谓呈现。
- source_word: shepherds
  choice: 牧人
  rationale: 不按后世经文传统改作“情人”或“首领”，保留所据见证文本的异常措辞及潜在多义性。
- source_word: kingdom of the flesh
  choice: 肉体的国度
  rationale: 保留作者将“埃及”寓意化为肉体领域的表达，不解释为特定教派的宇宙论术语。
- source_word: perceptible realm
  choice: 感官可知的领域
  rationale: 表达与感官经验相关的可感世界，并避免含混的“可见界”缩窄其范围。
- source_word: senseless external things
  choice: 没有知觉的外在之物
  rationale: 将其理解为无生命、无知觉的物质用品，而不擅自改成道德判断意义上的“愚昧事物”。
- source_word: men great of flesh
  choice: 肉体硕大的人
  rationale: 保留原见证的肉体性与可能的性暗示，不以解释性或委婉译法消除其张力。
- source_word: world rulers
  choice: 这黑暗世界的统治者
  rationale: 依所据引文的句法表达其属灵敌对力量，同时避免直接音译为带有特定诺斯替体系含义的专门术语。
theological_decisions:
- issue: 身体淫乱与灵魂淫乱的关系
  choice: 保留作者“尤其”强调灵魂淫乱，并说身体淫乱由此产生
  alternative: 将二者并列为同等类别，或把“灵魂淫乱”仅释为偶像崇拜
  rationale: 原文明确建立主次及起源关系；译文不替作者缓和或系统化这一主张。
- issue: 保罗书信引文的解释层次
  choice: 直译“这里他说的是属灵的事”
  alternative: 把引文改写为仅指邪灵、异教或社会罪恶
  rationale: 保留作者对哥林多前书的灵意解读，同时不宣称这是该书信唯一可能的释义。
- issue: 旧约引文与通行圣经文本的差异
  choice: 依当前科普特文献之英文见证的措辞翻译，不与现代旧约译本协调
  alternative: 用通行中文圣经逐字替换引文
  rationale: 这些引文属于作品现存形态的一部分，其差异可能反映七十士译本传统、转引、释义或传抄状态。
- issue: 灵魂的女性拟人化
  choice: 借“妻子、母亲、女人”等上下文意象保留女性拟人化
  alternative: 全篇改为中性抽象论述
  rationale: 女性拟人化是本文婚姻与淫乱隐喻的结构核心；现代汉语无须在每个代词处刻意强化性别。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。性与卖淫意象按原文直陈，不粗俗化，也不以委婉语淡化。旧约和保罗书信引文依本作品所保存的见证翻译，未强行与任何通行中文圣经版本协调。因科普特语源文审校尚未完成，本稿属于依据公共领域英文见证所作的暂定源据译稿；方括号及省略号明确标示编辑补足和缺损。
