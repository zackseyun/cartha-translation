  terminology: “父”“灵魂”“子宫”“外在的国度”“受洗／洗礼”“长子”“新郎／新娘”“洞房”等译语前后一致，并避免将父、长子或新郎擅自等同于特定神学人物。“卖淫”“交合”保留了见证中的直接性；“奸夫们”可保留其婚约背叛意象。
  issues:
  - severity: medium
    issue: “洗净奸夫们留给她的污秽”增加了原见证未明言的“留给她”。
    rationale: 英语见证仅称“purified herself from the pollutions of the adulterers”，即使语境可推知污秽与奸夫有关，也不宜将其明确叙述为他们“留给她”的东西。应译为“洁净自己，脱离奸夫们的污秽”或等值表达。
