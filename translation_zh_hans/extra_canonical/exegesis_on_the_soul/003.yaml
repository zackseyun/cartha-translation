lexical_decisions:
- source_word: womb
  choice: 子宫
  rationale: 保留原文贯穿段落的身体与灵魂生殖隐喻；“胎”或“孕育之处”会削弱其具体而刻意的解剖意象。
- source_word: outward kingdom
  choice: 外在的国度
  rationale: 直译并保留其含义上的开放性，不擅自解释为物质世界、肉体领域或某种特定宇宙论层级。
- source_word: good character
  choice: 美好的品性
  rationale: 用自然现代汉语表达道德与本性层面的正面状态，同时避免过度神学化。
- source_word: baptized / baptism
  choice: 受洗／洗礼
  rationale: 保留文本明确使用的宗教仪式词汇及其洁净隐喻。
- source_word: firstborn
  choice: 长子
  rationale: 保留亲属关系与优先出生的含义，不补入基督论身份判断。
- source_word: bridal chamber
  choice: 洞房
  rationale: “洞房”在现代汉语中自然地指新婚房间，能延续新郎、新娘和婚配的意象。
- source_word: prostitution
  choice: 卖淫
  rationale: 保留原文强烈、直接的性伦理措辞，不用较委婉的“淫行”淡化意象。
- source_word: adulterers
  choice: 奸夫们
  rationale: 与被人格化为女性的新娘相配，并保留婚约背叛的意味。
theological_decisions:
- issue: 灵魂的人称与性别
  choice: 以“她”指灵魂
  alternative: 以无性别的“它”指灵魂
  rationale: 本段持续把灵魂人格化为女性、新娘和待产妇；使用“她”可维持原文的性别隐喻链。
- issue: “父、长子、新郎”的身份关系
  choice: 保留称谓，不明确等同于任何特定神学人物
  alternative: 将长子或新郎明定为基督
  rationale: 该段自身使用这些称号却未在所给范围内明说身份，译文不应替文本消除这一开放性。
- issue: 洗礼的意义
  choice: 保留为灵魂转回自身并得洁净的意象
  alternative: 解释为某一教派的圣礼教义或纯粹象征
  rationale: 文本将受洗、洁净、恢复本性和回归自己并置；译文维持这种张力，不作宗派性定论。
- issue: “依照父的旨意”后的残缺句
  choice: 保留断裂，不补足主语、动作或逻辑关系
  alternative: 依据上下文推补完整句意
  rationale: 见证文本明确标示缺文，推补会造成缺乏来源支持的神学或叙事结论。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。保留子宫、生殖器、卖淫、交合等原文刻意直露的身体与性意象，不作委婉化；同时保留“外在的国度”“回归自己”等未被解释完毕的概念。由于科普特语原文复核尚待进行，本稿严格依据所给公版英语见证起草，属于来源复核前的出版草案。
