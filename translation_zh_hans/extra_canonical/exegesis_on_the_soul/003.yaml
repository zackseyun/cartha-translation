  terminology: “子宫”“受洗／洗礼”“长子”“洞房”“卖淫”“奸夫”等术语和意象处理基本一致。“父”“新郎”“长子”不作额外身份认定，符合原文开放性。
  issues:
  - severity: medium
    issue: 正文未直接保留“renovation of [] her former nature”中的空方括号。
