  - severity: low
    issue: “父从天上给她差来一个男人”及“她会对自己发狂”略显生硬。
    rationale: 改为“父从天上差遣一个男人到她那里”及“她会因自己而发狂”，可更自然地对应“sent her a man”与“become mad at herself”，不改变含义。
