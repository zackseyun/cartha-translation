  footnotes:
  - marker: a
    text: 方括号中的词语表示所据英文见证将其视为残卷补写或推定复原；科普特语原文尚待直接复核。
    reason: 保留见证中的文本复原信号，避免把不确定文字当作完整无缺的原文。
  - marker: b
    text: “[原文残缺]”表示所据见证在此留有空缺，现有材料不足以可靠补出文字。
    reason: 明确标示无法复原的缺文，并保存其所在位置。
  - marker: c
    text: 此句按作品中的引文形式翻译；其措辞并非对所引经文通行译法的直接照录，也可能综合了创世记 3:16 与以弗所书 5:23 的语言。
    reason: 避免将作品的释义性引文误认为某一现代圣经译本的逐字引述。
  - marker: d
    text: 本段同时说灵魂“使自己重生”“凭自己的意愿行动”，又说她从父领受神性；译文保留这种并置，不预先判定二者的教义关系。
    reason: 提示原文真实存在的神学张力，防止静默调和。
lexical_decisions:
- source_word: carnal marriage
  choice: 肉体的婚姻
  rationale: 保留本段将普通性结合与属灵婚姻相对照的核心措辞，同时使用现代读者易懂的表达。
- source_word: one life
  choice: 一个生命
  rationale: 不改写为“一体”或“一灵”，以保留原见证中与随后“成为一体”引文之间既相近又有区别的表述。
- source_word: master
  choice: 主人
  rationale: 原见证在“原先的主人”及引文中都使用支配关系用语；译作“主人”以保留其张力，不弱化为单纯的“配偶”。
- source_word: divine nature
  choice: 神性
  rationale: 简洁表达从父领受、用于更新的属神性质，不扩展为某一教派关于成神或本体合一的专门教义。
- source_word: formulas
  choice: 套语
  rationale: 结合“反复念诵”表达固定言辞或程式化话语，避免擅自限定为祷告、咒语或礼仪公式。
- source_word: heavenly reality
  choice: 属天实在
  rationale: 保留其本体性和属天指向，不将其窄化为单纯的教训、制度或仪式。
theological_decisions:
- issue: 灵魂的主动意愿与父所赐恩典之间的关系
  choice: 同时保留“凭自己的意愿行动”与“从父那里领受神性”
  alternative: 将前者解释为完全由恩典推动，或将后者弱化为辅助
  rationale: 原见证有意并置灵魂的意愿、父的赐予和灵的恩典；译文不替作者消解这种张力。
- issue: 灵魂、爱人、丈夫、兄弟与救主的意象关系
  choice: 逐一保留原文称谓，不统一为单一基督论头衔
  alternative: 把所有男性形象都明确译为“基督”
  rationale: 原见证以多重亲属和婚姻意象描述救赎关系，直接统一会超出文本所明说的范围。
- issue: “领受神性”的含义
  choice: 直译并保持开放
  alternative: 解释为道德更新、圣灵内住或本体成神
  rationale: 文本未在此明确界定其机制；应保存其神学含混性。
- issue: 重生与复活的关系
  choice: 保留文本把重生、复活、得赎和升天并列等同的修辞
  alternative: 依后世系统神学将这些阶段严格区分
  rationale: 段落本身以四个“这就是”解释灵魂的恢复，译文应忠实呈现。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。灵魂依原作持续人格化为女性，以“她”指称；“父”在叙事中作为神圣称谓保留，但不额外添加原见证没有的身份说明。诗篇与其他经文引语按本作品所呈现的措辞翻译，未强行与任何现行中文圣经版本统一。由于科普特语源文复核尚待完成，本稿明确属于依据所供公共领域英文见证制作的出版前草案。
