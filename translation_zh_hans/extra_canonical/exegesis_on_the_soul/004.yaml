    这样，灵魂以自己的荣美重新[装扮好]以后，[渴望]敬拜她的爱人；[他也]爱她。她与他联合时，便从他得着了[] [b]赐生命之灵的种子。她藉此生下正直的儿女，并将他们抚养成人，因为这就是生育那伟大而完全的奇迹。于是，这婚姻照着父的旨意得以成全。


    灵魂理当使自己重生，再次成为她从前的样子。随后，灵魂凭自己的意愿行动，并从父那里领受神性，使自己更新，回到起初所在之处：[d]


    这就是从死人中复活。


    这就是从奴役中得赎。


    这就是向上升入天界的旅程。


    这就是上升到父那里的道路。


    因此，先知说：


    “我的灵魂啊，要颂赞主；


    我里面的一切啊，要颂赞他的圣名。


    我的灵魂啊，要颂赞上帝：


    他赦免你一切的罪孽，


    医治你一切的疾病；


    他从死亡中救赎你的生命，


    以慈爱作你的冠冕；


    他用美物满足你的渴望，


    使你的青春如鹰一般更新。”


    （诗篇 103:1–5）


    她恢复青春以后，就要上升，颂赞父和那拯救她的兄弟。灵魂就是这样藉着重生而得救。这并不是靠反复诵念程式化的话语，也不是靠学识上的专长，或从书本中学习而来的；而是出于[灵]的恩典，是慈悲的[上帝]所赐的礼物。这就是属天实在的道路。


