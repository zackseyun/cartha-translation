translation:
  language: zh_hans
  text: '《论灵魂——灵魂的婚姻》


    因为那种婚姻不同于肉体的婚姻，所以彼此交合的人满足于那样的交合，随后便把肉体情欲的烦扰像重担一样抛在身后，[彼此转过脸去][a]。然而，这种婚姻[却不同]。他们[彼此]结合时，就成为一个生命。


    [原文残缺][b] 因此，先知论到最初的男人和女人说：“二人将成为一体。”（创世记 2:24）


    起初，他们与父同住的时候，曾彼此结合；后来，那女人诱使那作她兄弟的男人走入迷途。这婚姻使他们重新结合，灵魂也与她真正的爱人、她原先的主人联合了。正如经上所写：“因为女人的主人就是她的丈夫。”[c]（创世记 3:16；以弗所书 5:23）


    此后，她一步一步地认出了他，便再次欢喜；她在他面前哭泣，想起自己从前守寡时所受的羞辱。她又把自己装扮得更加美丽，好让他乐意与她同住。


    先知在《诗篇》中说：


    “女儿啊，你要听，要看，也要侧耳而听；

    要忘记你的族人和你父亲的家。

    王就会爱慕你的美丽，

    因为他是你的主。”

    （诗篇 45:10–11）


    因为他吩咐她把目光从自己的族人和那一群奸夫身上移开——她从前就住在他们中间——只把自己献给她的王、她真正的主；又要忘记她地上父亲的家，因为她在那里处境悲惨，转而记念她在天上的父。


    因此，也有话对亚伯拉罕说：“你要离开本地、本族和父家。”（创世记 12:1）


    这样，灵魂以自己的荣美重新[装扮好]以后，[渴望]敬拜她的爱人；[他也]爱她。她与他联合时，便从他得着了[原文残缺][b]赐生命之灵的种子。她藉此生下正直的儿女，并将他们抚养成人，因为这就是生育那伟大而完全的奇迹。于是，这婚姻照着父的旨意得以成全。


    灵魂理当使自己重生，再次成为她从前的样子。随后，灵魂凭自己的意愿行动，并从父那里领受神性，使自己更新，回到起初所在之处：[d]


    这就是从死人中复活。

    这就是从奴役中得赎。

    这就是上升天界的旅程。

    这就是上升到父那里的道路。


    因此，先知说：


    “我的灵魂啊，要颂赞主；

    我里面的一切啊，要颂赞他的圣名。

    我的灵魂啊，要颂赞上帝：

    他赦免你一切的罪孽，

    医治你一切的疾病；

    他从死亡中救赎你的生命，

    以慈爱作你的冠冕；

    他用美物满足你的渴望，

    使你的青春如鹰一般更新。”

    （诗篇 103:1–5）


    她恢复青春以后，就要上升，颂赞父和那拯救她的兄弟。灵魂就是这样藉着重生而得救。这并不是靠反复念诵套语，也不是靠学问上的专长，或从书本中学习而来的；而是出于[灵]的恩典，是慈悲的[上帝]所赐的礼物。这就是属天实在的道路。


    因此，救主高声说：[原文残缺][b]“若不是我的父吸引一个人，把他带到我这里来，就没有人能到我这里来；在末日，我要使他复活。”（约翰福音 6:44）'
