  footnotes:
  - marker: a
    text: “魂”也可理解为“生命”或“自己”。这里保留原文用词，以显出它与本段反复出现的“魂”之间的联系。
    reason: 源词具有语义范围，且所引路加福音的常见译法可能不同。
  - marker: b
    text: 方括号表示现存文本有残缺，括号内文字为据上下文所作的补足。本段引文见《革利免一书》8:3，其中汇合了若干先知性经文的措辞。
    reason: 说明抄本残缺与引文性质，避免读者误以为方括号属于作者原有标点。
  - marker: c
    text: 这一段与现行《以赛亚书》30:19-20的常见文本有明显差异；此处依本作品所保存的引文形态翻译。
    reason: 保存古代见证的独特读法，不以现代标准经文校正正文。
lexical_decisions:
- source_word: soul
  choice: 魂
  rationale: 原文在“全魂呼求”“魂呼求父”以及“恨自己的魂”等处反复使用同一核心词。译作“魂”以保留文本内部的词语联系及其古代宗教语感，避免一律释为“生命”而消除歧义。
- source_word: inward spirit
  choice: 从内心深处发出的灵
  rationale: 兼顾“内在”与“灵”的明示含义，并与外在嘴唇形成对照。
- source_word: vacuous lie / place of lies
  choice: 虚空谎言／谎言之地
  rationale: 保留“虚空”与“谎言”的并置，也保留末句带空间意味的“之地”，不将其抽象化为单纯的错误观念。
- source_word: hollow zealotry
  choice: 徒然的狂热
  rationale: 表达缺乏真实内容却强烈执着的状态，不擅自限定为某一宗派或政治意义的“狂热主义”。
- source_word: repentance
  choice: 悔改
  rationale: 采用现代汉语基督教文献中通行且普通读者易懂的对应词，并保留行为与心志转向的含义。
- source_word: duplicity
  choice: 二心
  rationale: 此处指祷告时内外不一、心意分裂；“二心”简洁并具有合宜的经文语体。
- source_word: deserves salvation
  choice: 配得救恩
  rationale: 贴近资格或相称性的措辞，不改写为已获救或必然蒙拣选等更强神学判断。
theological_decisions:
- issue: “恨自己的魂”的含义
  choice: 正文直译为“恨自己的魂”并加注说明
  alternative: 译作“恨恶自己的生命”或“舍弃自己”
  rationale: 来源文本明确采用“魂”，且文本本身带有灵魂论语境；直译可保存其张力，不用较熟悉的福音书措辞消解差异。
- issue: 悔改与救恩的关系
  choice: “救恩始于悔改”
  alternative: “悔改是得救的先决条件”
  rationale: 前者贴近“beginning”的顺序性表达，避免引入更系统化的条件论。
- issue: 上帝察验谁“配得”救恩
  choice: 保留“配得救恩”
  alternative: 改为“谁将得救”
  rationale: 原句包含价值或资格判断，改写会削弱文本的伦理张力。
- issue: 引文与正典经文的差异
  choice: 按作品所引的形态翻译，并保留所给出处
  alternative: 用现代圣经标准译文替换
  rationale: 这里翻译的是《灵魂诠释》中的引文形态，不应为了与标准经文一致而改写古代作者的文本。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。叙述部分尽量自然，引文略带经文节奏。由于科普特语原文审校尚待完成，本稿以所给公共领域英语见证为直接起草依据；保留方括号所示残缺，并避免把引文强行统一为现代圣经标准译文。
