translation:
  language: zh_hans
  text: '以色列起初若不是向上帝叹息，因自己所受奴役的暴政而哀号，就必不会蒙眷顾，得以从埃及地、从为奴之家被救出来。


    《诗篇》中又写着：


    我因叹息而极其疲惫；


    我每夜都用泪水淹没我的床榻，


    浸透我的卧席。


    我在所有仇敌中间已经衰老。


    一切作恶的人哪，离开我吧！


    看哪，主已经听见我哭泣的声音，


    主已经悦纳我的祷告。（诗篇6:6—9）[a]


    我们若悔改，上帝必定会垂听我们。他恒久忍耐，满有怜悯；愿荣耀归于他，直到永永远远。阿们！


    《灵魂释义》'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所引《诗篇》的措辞及节次依照本文所保存的引文；与某些现代《圣经》译本的分行和表达可能略有不同。
    reason: 说明这是作品内部的经文引述，并避免读者将其措辞差异误认为排印错误。
lexical_decisions:
- source_word: visited
  choice: 蒙眷顾
  rationale: 这里的“visit”并非普通探访，而指上帝介入并施行拯救；“蒙眷顾”既保留经文语感，也自然易懂。
- source_word: house of bondage
  choice: 为奴之家
  rationale: 保留出埃及传统中的固定意象，并以现代汉语可理解的形式表达。
- source_word: tyranny of its slavery
  choice: 受奴役的暴政
  rationale: 兼顾“奴役”与“暴虐统治”两层意义，不将其弱化为一般苦难。
- source_word: patient and richly merciful
  choice: 恒久忍耐，满有怜悯
  rationale: 以庄重而通顺的中文表达上帝的忍耐和丰盛慈悲。
- source_word: Exegesis
  choice: 释义
  rationale: 标题所指是对灵魂经历及其经文意义的阐释；“释义”较“训诂”自然，也不预设特定文体。
theological_decisions:
- issue: 以色列的哀求与上帝拯救之间的条件关系
  choice: 保留“若不是……就必不会……”的强条件句
  alternative: 弱化为“因以色列哀求，上帝便拯救了他们”
  rationale: 见证文本明确提出反事实条件关系；译文不应为了系统神学上的协调而削弱其张力。
- issue: 悔改之后上帝垂听的确定性
  choice: 译为“必定会垂听我们”
  alternative: 译为“愿意垂听我们”或“可能垂听我们”
  rationale: 原见证使用明确的肯定语气，应如实保留其劝勉力度。
- issue: “accepted my prayer”的含义
  choice: 悦纳我的祷告
  alternative: 听了我的恳求
  rationale: “悦纳”保留接纳祷告的意义，并与前句“听见”形成区别。
