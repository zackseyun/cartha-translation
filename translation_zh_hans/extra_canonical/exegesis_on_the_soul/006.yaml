base_translation:
  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/006.yaml
  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents, she will be returned to her house.'
translation:
  language: zh_hans
  text: '因此，诗人写道：


    奥德修斯坐在岛上，受苦悲伤，

    转脸不听卡吕普索的话，也不受她的诱惑，

    一心想再见自己的故乡，看见那里升起的炊烟。

    若不是得了上天的帮助，[a]

    他就不可能回到自己的故乡。

    （荷马《奥德赛》1.48—1.59）[b]


    又有一次，[海伦也]说：


    我的心在我里面回转；

    [……]我愿回到自己的家乡。

    （荷马《奥德赛》4.260—261）[c]


    因为她哀叹说：


    是阿佛洛狄忒迷惑了我，

    把我从故乡带走。

    我抛下了自己的女儿，

    也抛下了我的丈夫——他善良、聪慧、俊美。

    （荷马《奥德赛》4.261—264）[d]


    因为，灵魂若因阿佛洛狄忒的不忠而离弃她那完美的丈夫——阿佛洛狄忒借着生育的行为在这里产生——她就会遭受伤害。然而，她若哀叹悔改，就会被送回自己的家。[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上天”依所据英译见证译出；也可能表示来自天上的援助。科普特原文尚待直接复核。
    reason: 说明关键神学称谓及当前底本限制。
  - marker: b
    text: 荷马引文及卷行编号照所据见证保留；这里的措辞未必与现存希腊文《奥德赛》的通行版本逐字相合。
    reason: 原作品可能经由引述传统、改写或不同文本形态引用荷马。
  - marker: c
    text: 方括号表示见证中的补足或残缺；“[……]”保留原见证空括号所提示的文本缺损。
    reason: 向读者明确传本状态，避免把缺文误作正常停顿。
  - marker: d
    text: 本段荷马引文的编号依所据见证保留。阿佛洛狄忒是希腊神话中与爱情和欲望相关的女神。
    reason: 保留原有书目资料，并为普通读者提供最低限度背景。
  - marker: e
    text: “借着生育的行为在这里产生”原意和所指并不完全清楚；本译文没有将其解释为某种特定的肉身观、性伦理或宇宙论。
    reason: 保存原句真实的神学与语义张力，防止过度阐释。
lexical_decisions:
- source_word: poet
  choice: 诗人
  rationale: 保留作者以泛称指荷马的表达，正文后所附引文出处则明确其身份。
- source_word: village
  choice: 故乡
  rationale: 在返乡语境中比字面的“村庄”更自然，也能贯通奥德修斯、海伦与灵魂归家的意象；原词具体范围仍可能是家乡、城邑或乡土。
- source_word: charms
  choice: 诱惑
  rationale: 此处与卡吕普索挽留奥德修斯的话并列，重在迷人、引诱的力量；不武断译作法术。
- source_word: Heaven
  choice: 上天
  rationale: 保留超越性援助的含义，不擅自将其限定为某位神或特定神学称谓。
- source_word: heart changed
  choice: 心在我里面回转
  rationale: 兼顾内在改变与回转的方向感，也与下文悔改主题相呼应，但不直接把引文改写成神学术语“悔改”。
- source_word: soul
  choice: 灵魂
  rationale: 采用现代汉语中清楚、庄重且能承载本文拟人化女性形象的常用词。
- source_word: perfect husband
  choice: 完美的丈夫
  rationale: 保留“完美”这一强烈且可能具有象征意义的修饰，不弱化为“好丈夫”。
- source_word: act of begetting
  choice: 生育的行为
  rationale: 保留原见证中生成、生殖的含义及其晦涩性，不擅自具体化为性交、出生或创造。
- source_word: returned to her house
  choice: 被送回自己的家
  rationale: 保留被动语态，避免替原文补出施事者；“家”也维持全文的归返意象。
theological_decisions:
- issue: 上天援助的身份
  choice: 译作“上天的帮助”，不指明施助者
  alternative: 译作“神的帮助”或“诸神的帮助”
  rationale: 所据英译见证仅作 Heaven；在科普特原文复核之前，不应消除其指称上的开放性。
- issue: 阿佛洛狄忒与生育的关系
  choice: 保留“阿佛洛狄忒借着生育的行为在这里产生”这一语法张力
  alternative: 解释为“因肉欲而在世上掌权”或“象征生殖欲望”
  rationale: 原句神学与句法均晦涩；直译式保留可避免导入某一派别对肉身、生育或欲望的特定解释。
- issue: 灵魂、丈夫与归家意象
  choice: 维持灵魂为阴性拟人，并保留丈夫和家作为文本意象
  alternative: 将丈夫明确解释为神、基督、天上的配偶或灵魂的本源
  rationale: 本段没有明说丈夫的身份；不宜在译文中替作者完成象征解释。
- issue: 悔改与归返
  choice: 译作“她若哀叹悔改，就会被送回自己的家”
  alternative: 译作主动的“她就能回家”或补明“神会使她得救”
  rationale: 保留条件关系和被动归返，同时不补出原见证未明说的施事者或完整救恩体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。诗体引文以分行呈现，尽量保持返乡、哀叹和诱惑的意象；论述部分保留灵魂的女性拟人。方括号严格保留传本补足或缺损信号。由于目前仅有公共领域英译见证，科普特原文尚待复核，所有涉及“上天”、空缺文字及“生育的行为”的处理均属审慎暂译。
