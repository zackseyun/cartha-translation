lexical_decisions:
- source_word: water
  choice: 水
  rationale: 保留本章贯穿始终的字面意象，并让作者随后对洗礼的解释自然显明。
- source_word: baptism which bringeth remission of sins
  choice: 那带来赦罪的洗礼
  rationale: 准确保留洗礼与赦罪之间的原文表述，不额外界定其机制。
- source_word: cross
  choice: 十字架
  rationale: 采用现代汉语基督教文本中清楚、通行的对应词。
- source_word: conversion
  choice: 回转
  rationale: 既表达方向与生命的转变，也避免把语义缩限为加入某一宗派。
- source_word: vessel of His Spirit
  choice: 承载他圣灵的器皿
  rationale: 保留“器皿”的隐喻，并用“承载”使其在现代汉语中可理解；不擅自确定所指对象。
- source_word: in the spirit
  choice: 在灵里
  rationale: 保留可能指人的灵性层面或圣灵领域的歧义，不强行译作“靠着圣灵”。
theological_decisions:
- issue: 水、洗礼与赦罪的关系
  choice: 译为“那带来赦罪的洗礼”，并保留作者“下到水里、从水里上来”的论述
  alternative: 译为“象征赦罪的洗礼”或“使人罪得赦免的洗礼”
  rationale: 前者会加入“仅为象征”的解释，后者则可能强化因果机制；现译较贴近所给见证文本并保留神学张力。
- issue: “把盼望寄托在十字架上”的含义
  choice: 直译其盼望对象，不补作替代、功德或礼仪解释
  alternative: 解释为“信靠基督的赎罪功劳”
  rationale: 作者在本段明确说“十字架”，扩展为系统神学术语会超出文本。
- issue: “他/He”在引文和解释中的指代
  choice: 在明确处用“上帝”，其余依语境保留“他”
  alternative: 一律译为“主”或“基督”
  rationale: 见证文本的指代在若干处并不完全明确，避免把全部发言者或行动者统一确定。
- issue: “承载他圣灵的器皿”的所指
  choice: 保留隐喻，不明确说是教会、身体或受洗者
  alternative: 译成“他使教会得荣耀”
  rationale: 原段解释简短且所指可有争议，应保存其开放性。
- issue: “在灵里”的指向
  choice: 保留“在灵里”
  alternative: 译为“靠着圣灵”或“在我们的灵中”
  rationale: 现有资料不足以排除任何一种理解，因此不消除歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。先知引文保持经文式节奏，但避免过度古雅；作者的解释段使用清楚的现代论述语气。由于所给材料注明希腊文/拉丁文复核尚待进行，本稿以公开领域英文见证为暂定依据，并对残句与关键歧义作了明确保留。
