  language: zh_hans
  text: '我们来查考一下，主是否也预先指明了水和十字架的事。论到水，经上针对以色列人写道：他们不肯接受那带来赦罪的洗礼，反而要为自己建造。[a]


    因为先知说：“天哪，要惊讶！地更要因此战栗！因为这百姓做了两件恶事：他们离弃了我这生命的泉源，又为自己挖了死亡的坑。


    “我的圣山西奈难道是荒野中的磐石吗？你们将像雏鸟，巢一失去，就在高处振翅乱飞。”


    先知又说：“我要走在你前面，铲平群山，砸碎铜门，打断铁闩；我要把幽暗中隐藏、无人看见的宝物赐给你，使他们知道我是主上帝。”


    又说：“你要住在坚固磐石的高处洞穴中。”又说：“他的水必有保障；你们必看见王的荣美，你的心必默想对主的敬畏。”


    他又借另一位先知说：“行这些事的人，要像一棵栽在分流溪水旁的树，按时结果，叶子也不凋落；他所做的一切都必顺利。


    “恶人却不是这样，绝不是这样；他们如同尘土，被风从地面吹散。因此，恶人在审判中站立不住，罪人在义人的会众中也站立不住；因为主知道义人的道路，恶人的道路却必灭亡。”


    你们看，他怎样同时指明了水和十字架。意思是：那些把盼望寄托在十字架上、又下到水里的人有福了！因为经文说，赏赐要在“按时”的时候来到；他说：“那时，我必报偿。”但论到现在，他怎么说呢？“叶子也不凋落。”他的意思是：凡从你们口中凭着信心和爱说出的话，都要使许多人回转，并得着盼望。


    另一位先知又说：“雅各之地所得的赞美，超过全地。”他的意思是：上帝使承载他圣灵的器皿得荣耀。[b]


    接着他说什么呢？“有一条河从右边流出，河边长起美好的树；凡吃这些树上果子的人，都必活到永远。”


    他说这话，是因为我们带着罪和污秽下到水里，又从水里上来，心中结出果实，在灵里把我们的敬畏和盼望安放在耶稣身上。“凡吃这些树上果子的人，都必活到永远。”他的意思是：“凡听见这些话并且相信的人，都必活到永远。”'
