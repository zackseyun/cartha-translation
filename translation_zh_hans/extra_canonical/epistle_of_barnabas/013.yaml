  yaml_path: translation/extra_canonical/epistle_of_barnabas/013.yaml
  text: 'Now let us see whether this people or the first people has the inheritance, and whether the covenant had reference to us or to them.


    Hear, then, what the Scripture says concerning the people: “Isaac prayed concerning Rebekah his wife, for she was barren. And she conceived. Then Rebekah went out to inquire of the Lord. And the Lord said to her, ‘Two nations are in your womb, and two peoples in your belly, and one people shall vanquish another people, and the greater shall serve the less.’”


    You ought to understand who Isaac is, who Rebekah is, and in whose case he has shown that the one people is greater than the other.


    And in another prophecy Jacob speaks more plainly to Joseph his son, saying, “Behold, the Lord has not bereft me of your face; bring me your sons, that I may bless them.”


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the Spirit a type of the people that should come afterward. And what does he say? “Jacob crossed his hands and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, ‘Transfer your right hand to the head of Manasseh, for he is my firstborn son.’ And Jacob said to Joseph, ‘I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.’”


    Mark in whose cases he ordained that this people should be first and heir of the covenant.


    If then, besides this, he also recorded it through Abraham, we attain the completion of our knowledge. What, then, does he say to Abraham when he alone believed, and was ascribed for righteousness? “Behold, I have made you, Abraham, a father of nations that believe in God in uncircumcision.”'
translation:
  language: zh_hans
  text: '现在让我们看看：是这百姓，还是先前的百姓承受产业？这约所指的是我们，还是他们？


    请听圣经论到这百姓所说的话：“以撒为妻子利百加祈求，因为她不能生育；她就怀了孕。后来，利百加出去求问主。主对她说：‘你腹中有两个民族，你肚里有两族；一族必胜过另一族，较大的要服侍较小的。’”[a]


    你们应当明白以撒是谁，利百加是谁，也应当明白上帝借着谁表明一族比另一族大。


    在另一段预言中，雅各对儿子约瑟说得更加明白：“看哪，主没有使我见不到你的面；把你的儿子们带到我这里来，好让我祝福他们。”[b]


    约瑟就把以法莲和玛拿西带来，想让玛拿西蒙祝福，因为他年长；于是约瑟把他领到父亲雅各的右手边。但雅各在灵里看见了后来那百姓的预表。他怎么说呢？“雅各交叉双手，把右手按在次子、较年幼的以法莲头上，为他祝福。约瑟对雅各说：‘请把你的右手移到玛拿西头上，因为他是我的长子。’雅各对约瑟说：‘我知道，我儿，我知道；但较大的要服侍较小的。不过，这一个也必蒙祝福。’”[c]


    你们要留意，上帝借着哪些人预定这百姓居首位，并承受这约。[d]


    此外，如果上帝也借着亚伯拉罕把这事记载下来，我们的认识就完整了。那么，当亚伯拉罕独自相信、这信被算为义时，上帝对他说了什么呢？“看哪，我已经立你亚伯拉罕作万族之父，就是那些未受割礼而相信上帝之人的父。”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参《创世记》25:21–23。本段引文的措辞与现今通行的《创世记》文本并不完全相同，特别是“一族必胜过另一族”和“较大的要服侍较小的”。
    reason: 标明作者的经文引述来源及其文本差异，避免读者误以为是逐字引用现代圣经译本。
  - marker: b
    text: 参《创世记》48:9–11。这里“没有使我见不到你的面”是说，上帝没有剥夺雅各再次见到约瑟的机会。
    reason: 原表达直译较为生硬，脚注说明其惯用含义并标示出处。
  - marker: c
    text: 参《创世记》48:13–20。作者把利百加所得的话“较大的要服侍较小的”也用于以法莲和玛拿西；这句话不见于现今通行的该段《创世记》文本。
    reason: 区分经文原叙事与本书作者的组合式引用和解释。
  - marker: d
    text: “这百姓”在本章的论证中指作者所属、并认为承受这约的群体；正文保留作者没有在这里直接点明其名称的表达方式。
    reason: 解释代词的篇章功能，同时避免在正文中过度释义。
  - marker: e
    text: 参《创世记》15:6；17:5，也可比较《罗马书》4:9–12、17。末句把不同经文主题结合起来；“未受割礼而相信上帝的万族”不是现今通行《创世记》17:5的逐字措辞。
    reason: 说明作者的复合引述和释经扩展，并提供相关经文背景。
lexical_decisions:
- source_word: inheritance
  choice: 承受产业
  rationale: 保留圣经传统中的继承与盟约产业含义；比单用“遗产”更适合群体和神学语境。
- source_word: the first people
  choice: 先前的百姓
  rationale: “first”可能指时间上在先的群体，而非价值或等级上的“第一”；译文保留这种指向。
- source_word: people / peoples
  choice: 百姓／族
  rationale: 作者以“百姓”讨论盟约群体；引文中的复数则按语境译作“两族”，使现代汉语自然，同时保留群体对照。
- source_word: vanquish
  choice: 胜过
  rationale: 供应文本的引文作“vanquish”；译为“胜过”保留强弱关系而不额外强化为军事征服。
- source_word: type
  choice: 预表
  rationale: 这里明确指后来的百姓在先前人物和事件中被象征性预示；“预表”准确保留早期基督教释经用语。
- source_word: in the Spirit
  choice: 在灵里
  rationale: 保留“Spirit”可能指圣灵或属灵领受的张力，不径自补成“在圣灵感动下”。
- source_word: first and heir of the covenant
  choice: 居首位，并承受这约
  rationale: 分别呈现次序上的“first”和继承关系上的“heir”，避免把二者压缩为单一概念。
- source_word: in uncircumcision
  choice: 未受割礼而
  rationale: 用自然汉语表达未受割礼的状态，同时避免将其误解为某种抽象教义名词。
theological_decisions:
- issue: “这百姓”与“先前的百姓”的身份
  choice: 不在正文中明确指定为教会、基督徒或以色列
  alternative: 直接译明为“基督徒／教会”和“以色列人”
  rationale: 原段落借代词和群体称呼展开论证；显明身份会替作者消除其修辞推进和一定程度的含混。
- issue: 神圣行动者的代词
  choice: 在汉语必须明确主语处译作“上帝”
  alternative: 沿袭英文见证中的“他”
  rationale: 英文见证的大写 He 暗示神圣行动者，但现代简体中文“他”容易与雅各、约瑟等人物混淆；使用“上帝”澄清句法，不增加宗派性解释。
- issue: 雅各“在灵里”所见
  choice: 保留“在灵里看见”
  alternative: 译作“受圣灵感动，看见”
  rationale: 供应证据不足以确定是否必须把灵明确人格化为圣灵，因此保留原有神学张力。
- issue: 亚伯拉罕的信与称义
  choice: “独自相信、这信被算为义”
  alternative: “只因信就被称义”
  rationale: 避免引入后期教义公式；尽量呈现供应见证的叙述关系。
- issue: 未受割礼者作为亚伯拉罕后裔
  choice: 保留作者扩展后的引文措辞
  alternative: 将其校正为《创世记》或《罗马书》的标准经文措辞
  rationale: 本段反映作者自己的引述与解释方式，不应静默同化为后世通行经文文本。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。经文引述使用中文引号；人物名采用简体中文圣经通行译名。鉴于所供应材料注明希腊文及相关拉丁文见证尚待直接复核，本稿不声称解决源语言层面的文本异读；对关键含混处采取保守表达，并以脚注说明明显的组合式引用。
