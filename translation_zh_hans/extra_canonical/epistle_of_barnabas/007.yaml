base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/007.yaml
  text: 'Understand, therefore, children of gladness, that the good Lord revealed everything to us beforehand, so that we might know to whom we ought to give thanks and praise in all things.


    If, then, the Son of God, who is Lord and future Judge of the living and the dead, suffered so that his wound might give us life, let us believe that the Son of God could not have suffered except for our sake.


    Moreover, when he was crucified, he was given vinegar and gall to drink. Hear how the priests of the temple revealed this matter. Scripture contains a commandment: “Whoever does not observe the fast shall surely die.” Because the Lord was about to offer the vessel of his Spirit in his own person as a sacrifice for our sins, he commanded that the symbol given in Isaac, who was offered on the altar, should also be fulfilled.


    What, then, does he say in the prophet? “Let them eat from the goat that is offered during the fast for all their sins.” Pay careful attention: “Let the priests alone eat all the entrails, unwashed, with vinegar.”


    Why? “Since you are going to give me—who am about to offer my flesh for the sins of my new people—gall with vinegar to drink, you alone must eat, while the people fast and mourn in sackcloth and ashes.” This was to show that he must suffer at their hands.


    Pay attention to the commands he gave: “Take two goats, fair and alike, and offer them. Let the priest take one as a whole burnt offering for sins.”


    But what must they do with the other one? “The one is accursed,” he says. Notice how the symbol of Jesus is revealed.


    “All of you must spit on it and goad it, place scarlet wool around its head, and then let it be cast into the wilderness.” When this has been done, the one who takes the goat into the wilderness leads it away, removes the wool, and puts it on the branch called Rachia, the same plant whose shoots we are accustomed to eat when we find them in the countryside. The fruit of this briar alone is so sweet.


    What, then, does this mean? Pay attention. The one is at the altar, and the other is accursed. Moreover, the accursed one is crowned. For they will see him on that day wearing the long scarlet robe around his flesh, and they will say, “Is this not the one whom we once crucified, treated with contempt, and spat on? Truly, this was the one who then said that he was the Son of God.”


    For how is he like the goat? For this reason it says that the goats must be fair and alike, so that when they see him coming at that time, they may be astonished at his likeness to the goat. See, therefore, the symbol of Jesus who was to suffer.


    But what does it mean that they place the wool among the thorns? It is a symbol of Jesus set forth for the church, since whoever wished to remove the scarlet wool had to suffer many things because of the thorn’s terrible nature and, through affliction, gain mastery over it. Thus he says, “Those who desire to see me and to attain my kingdom must take hold of me through tribulation and affliction.”'
translation:
  language: zh_hans
  text: '所以，喜乐之子啊，你们要明白：良善的主预先把一切都向我们显明了，使我们知道在一切事上应当向谁献上感谢和赞美。


    既然上帝的儿子是主，也是将来审判活人死人的那一位，他受苦，好使我们因他的创伤得生命，那么我们就当相信：上帝的儿子受苦，只是为了我们。


    不仅如此，他被钉十字架时，有人给他醋和苦胆喝。请听圣殿的祭司怎样显明这件事。经上有一条诫命：“凡不守禁食的，必定死。”主如此吩咐，是因为他将要亲自把承载他灵的器皿献上，作为赎我们罪的祭，也要使那预先显于以撒身上的预表得以应验——以撒曾被献在祭坛上。[a]


    那么，他在先知书中怎么说呢？“要让他们吃那只在禁食期间为他们一切罪献上的山羊。”你们要仔细留意：“所有祭司都要单独吃那没有洗过、配着醋的内脏。”[b]


    为什么呢？“既然你们将要把苦胆和醋给我喝——我正要为我的新子民的罪献上自己的肉身——你们就要单独吃，而百姓要禁食，披麻蒙灰，哀哭。”这是要表明，他必须在他们手中受苦。


    你们要留意他所颁布的命令：“要取两只俊美而相像的山羊，把它们献上；祭司要取其中一只，作为赎罪的全燔祭献上。”


    但另一只该怎样处理呢？他说：“这一只是受咒诅的。”请留意耶稣的预表怎样显明出来。


    “你们众人都要向它吐唾沫，用刺棒赶它，把朱红色的羊毛围在它头上，然后把它放逐到旷野。”这些事做完后，负责把山羊带到旷野的人就领它去，取下羊毛，放在一种名叫“拉基亚”的枝子上；我们在乡间遇见这种植物，常吃它的嫩芽。唯独这种荆棘结出的果实如此甘甜。[c]


    那么，这是什么意思呢？要留意：一只在祭坛上，另一只受咒诅；而且，受咒诅的那只还戴上了冠。因为到了那日，他们将看见他肉身外披着朱红色长袍，就会说：“这不就是我们从前钉十字架、轻蔑并吐唾沫羞辱的那一位吗？他确实就是当时自称为上帝儿子的那一位。”


    那么，他怎么会像那只山羊呢？正因如此，经文说两只山羊必须俊美而相像，好叫他们到那时看见他来临，因他与那只山羊相像而惊异。所以，看哪，这就是那位将要受苦的耶稣的预表。


    至于他们把羊毛放在荆棘中间，这是什么意思呢？这是为教会陈明的、关于耶稣的预表。因为无论谁想取下朱红色的羊毛，都必须因荆棘的可怕而受许多苦，并在患难中竭力将它取到。因此他说：“凡渴望见我、进入我国度的人，都必须经历患难和痛苦，才能持守我。”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段所引的禁食条例以及以撒献祭的说法，是作者把赎罪日礼仪、以撒的故事和耶稣受难并置所作的预表性解释；现存旧约文本中没有完全相同的引文形式。
    reason: 提醒读者这不是可直接逐字定位的一处圣经引文，并保留作者的组合式释经。
  - marker: b
    text: “没有洗过、配着醋”所依据的古代文本传承和句法并不十分清楚；也可理解为内脏“未经清洗，并蘸醋食用”。
    reason: 标示底本见证中的语法和礼仪细节不确定性。
  - marker: c
    text: “拉基亚”是按古代见证音译的植物名，确切品种不明；作者称它为一种有可食嫩芽或甘甜果实的荆棘。
    reason: 避免把未确定的古代植物名称武断对应为某一现代物种。
  - marker: d
    text: “持守我”较直译可作“抓住我”或“取得我”，与前文冒着荆棘取下朱红羊毛的图像相呼应。
    reason: 保留末句动词的具体意象及其可能的语义范围。
lexical_decisions:
- source_word: children of gladness
  choice: 喜乐之子
  rationale: 保留古代劝勉文体中的亲属称谓和闪语式表达，同时在现代汉语中仍清楚可懂。
- source_word: quick and dead
  choice: 活人死人
  rationale: 按传统而清晰的汉语圣经措辞表达 living and dead，避免将 quick 误解为“迅速”。
- source_word: vessel of His Spirit
  choice: 承载他灵的器皿
  rationale: 保留“器皿”这一具身隐喻，不直接解释为“身体”，以免消除原文的神学张力。
- source_word: type / symbol
  choice: 预表
  rationale: 上下文指旧约礼仪和人物预先指向耶稣；“预表”比一般的“象征”更准确保留其历史—对应关系。
- source_word: whole burnt offering
  choice: 全燔祭
  rationale: 采用祭祀语境中的标准术语，表示祭物完全焚烧。
- source_word: Rachia
  choice: 拉基亚
  rationale: 植物名称的确切对应未定，故音译保留，不作无根据的植物学认定。
- source_word: lay hold on Me
  choice: 持守我
  rationale: 兼顾“抓住/取得”这一意象与门徒在患难中坚持归属基督的含义；脚注说明其可能的更直译读法。
theological_decisions:
- issue: 上帝之子受苦的目的与范围
  choice: “受苦，只是为了我们”
  alternative: “若不是为了我们，他就不可能受苦”
  rationale: 保留文本强调其受苦完全为人的救益，却避免把句式误读为关于神性是否具有受苦能力的系统教义断言。
- issue: “承载他灵的器皿”所指
  choice: 保留器皿隐喻
  alternative: 直接译作“他的身体”
  rationale: 见证文本的措辞可能涉及身体与灵的关系；直译隐喻可避免先行裁定其基督论含义。
- issue: 两只山羊与耶稣的关系
  choice: 译作“预表”
  alternative: 译作“象征”或“预言”
  rationale: 作者主张礼仪事件与耶稣受苦及再临之间存在预先设定的对应；“预表”既不过度等同，也不削弱其论证。
- issue: “我的新子民”
  choice: 照译为“我的新子民”
  alternative: 解释为“取代以色列的教会”
  rationale: 保留文本本身的措辞，不导入替代神学或特定教派的进一步推论。
- issue: 末句“lay hold on Me”
  choice: “经历患难和痛苦，才能持守我”
  alternative: “借着患难和痛苦取得我”
  rationale: 原句与取下荆棘中的羊毛相呼应，含有奋力抓取的图像；中文正文以自然表达为主，同时不把它改写成靠功德赚取国度。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留“预表、全燔祭、披麻蒙灰”等必要的古代宗教语汇，并用清晰句法降低理解门槛。鉴于提供的 drafting basis 明示希腊文/拉丁文源语复核尚待完成，本稿不假装已完成直接源语校勘；对引文形式、植物名和关键句法的不确定性均以脚注显明。
