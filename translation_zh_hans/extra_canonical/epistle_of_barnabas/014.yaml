  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
translation:
  language: zh_hans
  text: '14 是的，确实如此。至于他起誓应许列祖、要赐给这民的约，我们来看看他是否真的赐下了。他确实赐下了；可是他们自己因所犯的罪，显明不配领受。


    因为先知说：“摩西在西奈山禁食四十昼夜，为要领受主的约，交给百姓。[摩西][a]从主那里领受了两块石版；这两块版是在灵里，由主亲手用指头写成的。”摩西拿着石版下山，要交给百姓。


    主对摩西说：“摩西，摩西，赶快下去！因为你从埃及地领出来的百姓行了恶事。”摩西得知他们又为自己造了铸像，就把石版从手中扔下；主立约的版便摔碎了。


    摩西领受了石版，他们自己却显明不配领受。那么，我们是怎样领受这约的呢？请留意：摩西是以仆人的身份领受的；主却亲自把约赐给我们，使我们成为他产业的子民；他为我们的缘故恒久忍耐。


    然而，他显现出来，是要让他们的罪同时达到满盈，也使我们能借着承受这约的那一位，就是主耶稣，领受这约。他早已为此预备妥当，为要亲自显现，把我们那些已经被交付死亡、任由谬误之不义支配的心从黑暗中救赎出来，并借着这道在我们里面确立这约。


    因为经上记着，父吩咐他救我们脱离黑暗，并为自己预备一群圣洁的子民。


    所以先知说：“我耶和华你的上帝凭公义召你；我要拉住你的手，使你刚强。我已使你作万民之约[b]、列国之光，去开启瞎子的眼睛，领被捆绑的人脱离锁链，使坐在黑暗中的人走出牢狱。”这样，我们便明白自己是从哪里被赎出来的。


    先知又说：“看哪，我已立你作列国之光，使你成为救恩，直到地极。”救赎你的耶和华，就是上帝，如此说。


    先知又说：“主的灵在我身上，因此他膏了我，叫我向卑微的人宣告好消息；他差遣我医治心灵破碎的人，向被掳的宣告释放，向瞎眼的宣告重见光明；宣告主悦纳之年和报偿之日，安慰一切哀恸的人。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩西”在所据英文见证中以方括号标出，表示这是为使句意明确而补出的名称。
    reason: 保留底本所标示的补文信息。
  - marker: b
    text: “万民之约”也可译作“这族的约”或“百姓之约”；所据见证的用词在这里并不十分明确。
    reason: 保留受益群体所指的词义歧义。
lexical_decisions:
- source_word: διαθήκη / covenant
  choice: 约
  rationale: 此处既指上帝起誓赐下的盟约，也与石版及后来“在我们里面确立”相连；“约”可自然保留这些关联。
- source_word: κληρονομίας / inheritance
  choice: 产业
  rationale: “他产业的子民”沿用圣经传统表达，同时清楚传达归属上帝的群体身份。
- source_word: ἐλυτρώθημεν / ransomed
  choice: 被赎出来
  rationale: 保留赎价与解救的双重意味，不弱化为一般性的“获救”。
- source_word: λόγος / word
  choice: 道
  rationale: 原文可能兼具所宣讲之话语及更浓厚的神学意味；译作“道”保留这种张力。
- source_word: ταπεινοῖς / humble
  choice: 卑微的人
  rationale: 可指社会处境低微者或谦卑者；“卑微的人”比单纯“谦卑的人”更能保留范围。
- source_word: ἀνταποδόσεως / recompense
  choice: 报偿
  rationale: 该词可包含报应或偿还的意义；“报偿”避免预先限定为奖赏或惩罚。
theological_decisions:
- issue: “他们的罪达到完成”的含义
  choice: “他们的罪……达到满盈”
  alternative: “他们在罪中被带到完全”
  rationale: 保留审判性和累积性的语气，同时避免把“完全”误读为道德完善。
- issue: “承受这约的那一位”与基督的关系
  choice: 直译为“借着承受这约的那一位，就是主耶稣”
  alternative: “借着把约赐给我们的主耶稣”
  rationale: 原文论证刻意同时谈到领受、承受和赐下；不把这种张力简化。
- issue: “万民之约”的受益对象
  choice: “万民之约”并加注
  alternative: “这族的约”或“百姓之约”
  rationale: 见证文本的 race 可有“族类、人民”之义；上下文引用以赛亚并转向列国，正文采用较自然但仍宽泛的表达。
- issue: “在灵里写成”与书写者
  choice: “在灵里，由主亲手用指头写成”
  alternative: “由主的手指在圣灵中写成”
  rationale: 保留“灵”的短语，不擅自明确为圣灵，也保留拟人化的手与指头意象。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。引文保留先知式语气，但避免过度文言化。现有材料明确说明尚未完成希腊文及拉丁文见证的直接复核，因此本稿依据所提供的公共领域英文见证及审校层起草；补文与关键歧义均以脚注显明。
