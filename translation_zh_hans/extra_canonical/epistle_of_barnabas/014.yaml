  naturalness: 原稿总体庄重、流畅，适合现代汉语朗读。修订后以“主手的指头”“在罪中达到完成”等表达保留源文的不寻常处，同时避免不必要地采用文言或教派性措辞。
  terminology: “约”“产业的子民”“救赎”“道”等核心术语均可保留。“耶和华”并非所给英文见证的明确措辞，修订为“主”，以避免在本段审校依据下额外指定神名。
  issues:
  - severity: medium
    issue: “他们的罪同时达到满盈”
    rationale: 英文见证作“they might be perfected in their sins”，其含义与修辞作用艰涩；“达到满盈”将其具体解释为罪恶累积至满。宜以较贴近而不预断的“在罪中达到完成”保留张力。
  - severity: low
    issue: “由主亲手用指头写成”
    rationale: 见证为“by the finger of the Lord’s hand in the spirit”。“亲手”将“手的指头”的双重意象压缩，且“在灵里”应紧贴书写行为。
  - severity: low
    issue: 引文中使用“耶和华”
    rationale: 所供英文见证一律作“Lord”；在尚待直接复核希腊文、拉丁文见证的情况下，采用“主”更严格对应审校依据。
