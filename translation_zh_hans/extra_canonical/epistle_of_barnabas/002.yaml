base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/002.yaml
  text: 'Seeing, then, that the days are evil and that the Active One himself has the authority, we ought to pay attention to ourselves and seek out the ordinances of the Lord.


    The aids of our faith are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, and knowledge rejoice with them.


    For he has made known to us by all the prophets that he desires neither sacrifices nor whole burnt offerings nor oblations, saying at one time:


    “What is the multitude of your sacrifices to me?” says the Lord. “I am full of whole burnt offerings, and I do not desire the fat of lambs or the blood of bulls and goats—not even if you come to be seen by me. Or who required these things at your hands? You shall no longer continue to tread my court. If you bring fine flour, it is in vain; incense is an abomination to me. Your new moons and your Sabbaths I cannot endure.”


    Therefore, he annulled these things so that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have an oblation not made by human hands.


    And he says to them again: “Did [I] command your fathers, when they went forth from the land of Egypt, to bring me whole burnt offerings and sacrifices?


    “No. This was my command to them: Let none of you bear an evil grudge against his neighbor in his heart, and do not love a false oath.”


    So, unless we are without understanding, we ought to perceive the mind of the goodness of our Father. For he speaks to us, desiring that we should not go astray like them but should seek how we may approach him.


    Thus he speaks to us: “The sacrifice to God is a broken heart; the smell of a sweet savor to the Lord is a heart that glorifies its Maker.” Therefore, brethren, we ought to learn accurately concerning our salvation, lest the Evil One, having effected an entrance of error in us, should fling us away from our life.'
translation:
  language: zh_hans
  text: '既然现今的日子邪恶，而那位行动者亲自掌权，我们就应当留心自己，寻求主的律例。[a]


    所以，敬畏和忍耐是我们信仰的助力，恒久忍耐和自制是我们的盟友。


    只要这些在有关主的事上存留于纯洁的灵中，智慧、悟性、学问和知识便与它们一同欢喜。[b]


    他借着众先知向我们显明：他既不想要祭牲，也不想要全燔祭或供物。有一次他说：


    “你们众多的祭牲与我何干？”主说，“全燔祭我已经厌足；羊羔的脂油、公牛和山羊的血，我都不想要。即使你们来显在我面前，我也不要。[c] 谁从你们手中求这些呢？不要再继续践踏我的院宇。你们献上细面也是枉然；香是我所憎恶的。你们的月朔和安息日，我无法容忍。”


    因此，他废除了这些事，使我们的主耶稣基督的新律法脱离强制的轭，并有一种不是人手所献的供物。[d]


    他又对他们说：“你们的祖先从埃及地出来时，我曾吩咐他们给我献上全燔祭和祭牲吗？


    “不。我吩咐他们的是：你们谁都不可在心里对邻舍怀有恶意，也不可喜爱虚假的誓言。”[e]


    所以，只要我们不是毫无悟性，就应当领会我们天父良善的心意。他对我们说话，是不愿我们像他们一样迷失，而要我们寻求怎样亲近他。


    因此，他对我们说：“献给上帝的祭，是一颗破碎的心；在主面前馨香的气味，是一颗荣耀其创造主的心。”所以，弟兄们，我们应当确切地明白有关我们救恩的事，免得那恶者使谬误侵入我们里面，把我们从生命中抛出去。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位行动者”所指并不确定；也可理解为“那位正在运行的”。现据英文见证保留其称号性质，待希腊文见证复核。
    reason: 保留关键称号的词义与身份歧义。
  - marker: b
    text: “学问”对应见证中的 science，指有系统的认识或学识，并非特指现代自然科学。
    reason: 避免现代词义误读，同时说明四个认知名词的并列。
  - marker: c
    text: “来显在我面前”也可译作“来朝见我”；这句话沿用所据见证的措辞，与通行的《以赛亚书》文本形式略有差异。
    reason: 交代先知引文的文本形式及可能译法。
  - marker: d
    text: “不是人手所献的”也可理解为“不是人手所造的”。
    reason: 保留“人手”复合词在供物语境中的语义可能。
  - marker: e
    text: 这里把有关燔祭的先知话语与“不可心怀恶意、不可喜爱假誓”的劝诫连在一起，是《巴拿巴书》现有论述的形式。
    reason: 提醒读者这是复合引述，避免误认为可与单一旧约段落逐字对应。
lexical_decisions:
- source_word: ὁ ἐνεργῶν / “the Active One” (source-language review pending)
  choice: 那位行动者
  rationale: 保留所据见证中作为称号的主动、施行之意，不擅自判定所指是上帝、基督或恶者；以脚注提示歧义。
- source_word: φόβος / fear
  choice: 敬畏
  rationale: 在信仰德性语境中译作“敬畏”比一般性的“恐惧”自然，同时不把它扩写为特定教义概念。
- source_word: μακροθυμία / long-suffering
  choice: 恒久忍耐
  rationale: 与本句较普通的“忍耐”区分，表达长期承受和不轻易发怒的含义。
- source_word: ἐπιστήμη / science
  choice: 学问
  rationale: 古代语境并非专指现代自然科学；“学问”既保留与知识相关的独立名词，也避免时代错置。
- source_word: ὁλοκαυτώματα / whole burnt offerings
  choice: 全燔祭
  rationale: 准确表达祭物全部焚烧的礼仪类别，并与泛称“祭牲”区别。
- source_word: προσφορά / oblation
  choice: 供物
  rationale: 采用普通读者可懂的祭献用语；后文依据语境译作“供物／所献的供物”，保留献呈含义。
- source_word: χειροποίητος / made by hands
  choice: 人手所献的
  rationale: 顺应本段“供物”的施献语境；原词也可理解为“人手所造的”，故列脚注保留另一可能。
- source_word: ὁ πονηρός / Evil One
  choice: 那恶者
  rationale: 保留人格化和定指色彩，不直接以某个专名替换。
theological_decisions:
- issue: “那位行动者”的身份
  choice: 以称号直译，不明确身份
  alternative: 译作“那恶者”“上帝”或“掌权者”
  rationale: 现有材料明确指出该称号可能具有重要歧义，且希腊文校勘尚待完成；正文不应提前消解张力。
- issue: “废除了这些事”与旧约祭祀的关系
  choice: 保留作者强烈的“废除”措辞
  alternative: 弱化为“使这些退居次位”或解释为只废除误用
  rationale: 原见证的论述明确而尖锐；译者不应以系统神学调和作者的表述。
- issue: 基督新律法的“供物”
  choice: 保留祭献隐喻，并译为“不是人手所献的供物”
  alternative: 解释为祷告、赞美、圣餐或内心敬拜
  rationale: 下文虽将破碎和荣耀创造主的心称为祭，但不宜在此将“供物”限定为某一礼仪或教义。
- issue: 先知引文的复合来源
  choice: 按《巴拿巴书》现有连贯引述翻译
  alternative: 逐句改成现代旧约译本或标出每处出处
  rationale: 作者对先知材料有所组合和转述；应保存本文形态，而非用后世标准文本覆盖。
- issue: “破碎的心”
  choice: 直译其献祭语言和内在悔痛意象
  alternative: 具体解释为“悔改的心”
  rationale: “破碎”比“悔改”更具原引文意象，也保留含义空间。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。保留“律例、全燔祭、月朔、院宇、馨香”等经书语域词汇，但以通顺句法降低理解门槛。神名代词统一用“他”，不以排版性尊称添加原文没有的神学信息。当前源材料注明希腊文／拉丁文复核尚待完成，因此对“那位行动者”、认知词组和若干引文措辞采取审慎、带脚注的暂定译法。
