source:
  text: 'Seeing then that the days are evil, and that the Active One himself has the authority, we ought to give heed to ourselves and to seek out the ordinances of the Lord.


    The aids of our faith then are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, knowledge rejoice with them.


    For He hath made manifest to us by all the prophets that He wanteth neither sacrifices nor whole burnt offerings nor oblations, saying at one time;


    What to Me is the multitude of your sacrifices, saith the Lord I am full of whole burnt-offerings, and the fat of lambs and the blood of bulls and of goats desire not, not though ye should come to be seen of Me. or who required these things at your hands? Ye shall continue no more to tread My court. If ye bring fine flour, it is in vain; incense is an abomination to Me; your new moons and your Sabbaths I cannot away with.


    These things therefore He annulled, that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have its oblation not made by human hands.


    And He saith again unto them; Did command your fathers when they went forth from the land of Egypt to bring Me whole burnt offerings and sacrifices?


    Nay, this was My command unto them, Let none of you bear a grudge of evil against his neighbor in his heart, and love you not a false oath.


    So we ought to perceive, unless we are without understanding, the mind of the goodness of our Father; for He speaketh to us, desiring us not to go astray like them but to seek how we may approach Him.


    Thus then speaketh He to us; The sacrifice unto God is a broken heart, the smell of a sweet savor unto the Lord is a heart that glorifies its Maker. We ought therefore, brethren, to learn accurately concerning our salvation, lest the Evil One having effected an entrance of error in us should fling us away from our life.'
