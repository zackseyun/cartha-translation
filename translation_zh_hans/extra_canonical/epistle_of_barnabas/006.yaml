    rationale: 作者紧接着以重新创造作比，措辞仍为“新的样式／类型”；不应预先限定其为特定的人论术语。
  - severity: low
    issue: “圣子”在此比所据见证的“Son”更具后期教义术语色彩。
    rationale: 译为“儿子”足以保留作者所指，并避免无必要地增添神学限定。
  - severity: low
