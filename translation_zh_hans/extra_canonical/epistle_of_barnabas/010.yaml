translation:
  language: zh_hans
  text: '摩西说：“不可吃猪、鹰、隼、鸢、乌鸦，也不可吃任何身上没有鳞的鱼。”他领会了其中的三项条例。


    此外，他又在《申命记》中对他们说：“我要把我的条例立为这百姓的约。”所以，神的诫命并不是不许他们用牙齿咬食物；摩西所说的乃有属灵的含义。


    他提到猪，意思就是：“不可依附像猪一样的人。”也就是说，他们富足享乐时便忘记主，缺乏时才承认主；正如猪吃东西时不认主人，饿了就叫，一得到食物又安静下来。


    “也不可吃鹰、隼、鸢和乌鸦。”他说：“不可依附这样的人，也不可变得像他们：他们不知道怎样靠劳苦流汗为自己取得食物，反倒无法无天地夺取别人的东西；他们看似无辜地四处走动，其实却窥探搜寻，贪婪地要找人抢掠。”这些鸟也是如此：它们不为自己觅食，反倒闲坐着，寻找机会吃属于别人的肉；它们作恶多端，害人不浅。


    他说：“也不可吃七鳃鳗、章鱼和乌贼。”他的意思是：“不可变得像那些恶贯满盈、已经被定罪至死的人。”这些鱼也是如此：唯独它们受咒诅，在深处游动，不像其余的鱼在水面附近游，反倒栖息在深海底下。


    还有：“不可吃兔子。”为什么呢？“不可成为败坏男童的人，也不可变得像这种人。”因为兔子每年会在身体上增加一个孔道；它活了多少年，就有多少个孔。[a]


    再者：“也不可吃鬣狗。”他说：“不可成为奸夫或淫乱的人，也不可与这种人相似。”为什么呢？因为这种动物年年改变性别，有时为雄，有时为雌。[b]


    他厌弃鼬，也有充分的理由。他说：“不可变得像那些我们听说用口行污秽不义之事的人，也不可依附那些不洁、用口行污秽不义之事的女人。”因为这种动物从口受孕。[c]


    所以，关于食物，摩西领受了三项这类规定，并按属灵的含义说了出来；可是他们却按肉体的私欲去领会，以为这些规定只是在讲吃东西。


    大卫也领会了这三项规定，说：“不随从恶人计谋的人有福了”——不像那些鱼，在黑暗中游入深处；“不站在罪人的道路上”——不像那些假装敬畏主、却像猪一样犯罪的人；“不坐在毁灭者的座位上”——不像那些停坐着伺机攫取猎物的鸟。这样，你们如今已经得到了关于饮食的完整教导。


    摩西又说：“凡分蹄又反刍的，你们都可以吃。”这是什么意思呢？领受食物的人认识赐他食物的那一位，得了饱足，便显出以他为乐。摩西这样说得好，切合这条诫命。那么，他的意思究竟是什么呢？你们要依附敬畏主的人：他们在心里反复思想自己所领受之道的分别；他们传讲主的条例，又遵守这些条例；他们知道默想是一件喜乐的事，并且反复咀嚼主的道。但为什么要分蹄呢？因为义人一面行走在这个世界，一面盼望将来圣洁的世界。你们看，摩西这位立法者何等有智慧！


    然而，他们怎能察觉或明白这些事呢？我们既正确领会了这些诫命，便照主的旨意把它们讲明。为此，他给我们的耳朵和心行了割礼，使我们能够明白这些事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里关于兔子身体会逐年增加孔道的说法属于古代动物学观念，并不符合现代动物学知识；译文按原文保留。
    reason: 防止读者把历史文本中的生理说法误当作现代事实。
  - marker: b
    text: 这里关于鬣狗每年改变性别的说法属于古代流传的动物观念，并不符合现代动物学知识；译文按原文保留。
    reason: 交代古代观念背景而不改写作者论证。
  - marker: c
    text: 这里关于鼬从口受孕的说法属于古代动物学传说，并不符合现代动物学知识；译文按原文保留。
    reason: 明确区分忠实翻译与事实认同。
lexical_decisions:
- source_word: swine
  choice: 猪
  rationale: 依上下文及英译见证的校勘说明，将明显误印“seine”还原为“swine”；后文亦以猪作寓意解释。
- source_word: cleave unto
  choice: 依附
  rationale: 保留紧密结交、认同并追随之意，同时采用现代普通读者易懂的表达。
- source_word: in spirit / spiritual sense
  choice: 有属灵的含义／按属灵的含义
  rationale: 表达作者对饮食律例的寓意性理解，不进一步限定为某一宗派的释经框架。
- source_word: lamprey / polypus / cuttlefish
  choice: 七鳃鳗／章鱼／乌贼
  rationale: 采用现代通行的动物名称；古代物种识别可能并非完全确定，但不影响段落论证。
- source_word: corrupter of boys
  choice: 败坏男童的人
  rationale: 保留原文对性剥削或性败坏的谴责，同时避免在源语复核尚未完成时加入更具体的司法术语。
- source_word: meditate / chew the cud
  choice: 反复思想／反复咀嚼
  rationale: 保留默想与反刍之间的文字呼应。
- source_word: holy world to come
  choice: 将来圣洁的世界
  rationale: 直陈末世盼望而不擅自改成特定神学体系中的固定术语。
- source_word: circumcised our ears and hearts
  choice: 给我们的耳朵和心行了割礼
  rationale: 保留鲜明的圣经隐喻，不以解释性意译削弱其修辞力量。
theological_decisions:
- issue: 饮食诫命是否仅有寓意而无字面意义
  choice: 按作者原有论证，译为神的诫命并非只是不许用牙齿咬食物，摩西的话有属灵含义
  alternative: 将其绝对化为神从未颁布任何字面饮食规定
  rationale: 原段带有强烈的属灵化解释，但现有见证的措辞和论证张力应予保留，不额外扩展为系统性否定。
- issue: “三项条例”的具体所指
  choice: 保留“三项条例／规定”，不在正文中强行列出或重构
  alternative: 明确解释为鱼、猪、鸟三类，或恶人、罪人、毁灭者三类
  rationale: 段落内部存在多重对应，现有见证没有无歧义地界定三项内容。
- issue: 末句“他”所指
  choice: 保留“他给我们的耳朵和心行了割礼”
  alternative: 明确写成“主／神”
  rationale: 英文见证中的代词指向可由语境推知，但在源语复核前不应把代词所保留的形式差异完全消除。
- issue: “他们”对律法的领受
  choice: 忠实保留作者对“他们”的批评
  alternative: 改写为泛指任何只按字面理解的人
  rationale: 历史文本的论辩立场应予呈现，但不增添针对后世群体的贬抑性称谓。
- issue: 古代动物学说法
  choice: 正文保留，并以“据说”及脚注标明其古代观念性质
  alternative: 按现代动物学纠正或删除
  rationale: 这些说法构成作者寓意论证的一部分，应忠实保存，同时避免让现代读者误以为译者认可其科学准确性。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。引文保留经训式语气，但避免过度文言化。鉴于所提供材料明确说明希腊文／拉丁文直接复核尚待完成，本稿以公版英文见证及经审校的英文POB为临时依据；对动物名称、代词指向和“三项条例”等不确定处采取保守译法，不无声消解歧义。
