    他说：“也不可吃七鳃鳗、章鱼和乌贼。”他的意思是：“不可变得像那些恶贯满盈、已经被判死刑的人。”这些鱼也是如此：唯独它们受咒诅，在深处游动，不像其余的鱼在水面附近游，反倒栖息在深海底下。


    还有：“不可吃兔子。”为什么呢？“不可成为败坏男童的人，也不可变得像这种人。”因为据说兔子每年会在身体上多长一个孔；它活了多少年，就有多少个孔。[a]


    再者：“也不可吃鬣狗。”他说：“不可成为奸夫或淫乱的人，也不可与这种人相似。”为什么呢？因为据说这种动物年年改变性别，有时为雄，有时为雌。[b]


