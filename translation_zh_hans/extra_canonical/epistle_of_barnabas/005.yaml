  footnotes:
  - marker: a
    text: 直译为“他洒血的血”或“他所洒的血”，带有献祭礼仪中洒血洁净的意象。
    reason: 说明不常见的所属结构与礼仪背景。
  - marker: b
    text: 这句引文的措辞与《箴言》1:17的传统文本有关，但本章对它的运用并不等同于该节通常的语境。
    reason: 提示引文来源和作者独特的解释，避免读者误以为是逐字一致的标准引文。
  - marker: c
    text: 见证文本原为“他极其爱他”，末一个代词可指以色列；正文为免现代汉语指代不清，明确译出。
    reason: 解决代词歧义，同时记录底本文字。
  - marker: d
    text: 原句用语异常强烈，也可理解为“在各种罪上都极其不法”。本译文未将这句话缓和。
    reason: 保留使徒罪性描述的文本张力。
  - marker: e
    text: 见证文本直译近于“把他们罪的总数归结完全”；这里按上下文译为罪恶达到满盈。由于直接希腊文校勘尚待完成，此处仍属暂定。
    reason: 标明关键难句的解释性翻译及资料限制。
  - marker: f
    text: “木头”在此指受刑的木架，并呼应早期基督教文献称十字架为“木头”的经文用语。
    reason: 解释为何正文不直接改译为“十字架”。
  - marker: g
    text: 这几句以先知性经文的口吻组合出现，其中“用钉子刺透我的肉身”的具体措辞在常见旧约文本传统中并不一致。
    reason: 提示复合引文和文本传统问题，不把它伪装成单一、逐字可核的引文。
lexical_decisions:
- source_word: deliver His flesh unto corruption
  choice: 把自己的肉身交给朽坏
  rationale: 保留见证文本中“交付”与“朽坏”的强烈表达，不弱化为泛指死亡。
- source_word: the blood of His sprinkling
  choice: 他所洒的血
  rationale: 保留礼仪性“洒血”意象，同时用自然汉语表达所属关系。
- source_word: for our souls
  choice: 为我们的生命
  rationale: 此处“魂”可指人的生命本身；译作“生命”避免现代汉语把它狭窄理解为与身体分离的灵魂。
- source_word: redeem the promise made to the fathers
  choice: 履行赐给列祖的应许
  rationale: 上下文所指是使应许兑现；“履行”比把应许本身说成被“救赎”更符合自然汉语。
- source_word: new people
  choice: 一个新子民
  rationale: “子民”保留群体与圣约色彩，又不预先限定其制度身份。
- source_word: came in the flesh
  choice: 在肉身中来
  rationale: 保留道成肉身式措辞及其神学张力，不改写为单纯“成为人”。
- source_word: suffer on a tree
  choice: 在木头上受难
  rationale: 保留原有“木头/树”的经文用语，而不直接替换为解释性的“十字架”。
- source_word: set my face as a hard rock
  choice: 使自己的脸坚如磐石
  rationale: 保留先知性比喻，表达坚定承受敌对的姿态。
theological_decisions:
- issue: 创世时“我们要造人”所指的对象
  choice: 按见证文本保留“上帝……对他说”
  alternative: 把复数理解为上帝对天使或天上议会说话
  rationale: 本章作者明确把这句话用于主；译文呈现作者论证，但不进一步界定三一论术语。
- issue: 主受苦的主动性
  choice: 反复译作“甘愿受苦”并保留“他自己愿意”
  alternative: 仅译为被动地“遭受苦难”
  rationale: 本段同时强调人的加害与主主动接受苦难，两方面都应保留。
- issue: 使徒被称为极重的罪人
  choice: 保留令人惊讶的强烈说法
  alternative: 缓和为“普通罪人”或“被视为罪人”
  rationale: 不以传统使徒形象消解文本本身的修辞和神学张力。
- issue: 受难使迫害先知者的罪满盈
  choice: 译作“使……罪达到满盈”
  alternative: 译作“概括他们全部的罪”
  rationale: 在上下文中这是罪恶达到完全数额、从而面临审判的意象；脚注注明底本表达和审校限制。
- issue: 复活与审判的主语
  choice: 保留儿子“使人复活”并“亲自施行审判”
  alternative: 把复活改作纯被动事件或把审判主语改为上帝
  rationale: 见证文本把这两项行动都归于本段的“他”，不应调整其基督论陈述。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；“上帝”用于 God，“主”用于 Lord。保留作者密集的经文论证、肉身语言和反问结构，同时适度拆分长句。当前所供直接依据是公共领域英文见证，且资料明确注明希腊文/拉丁文直接复核尚待完成，因此对疑难句采取审慎译法，并在脚注中标出暂定之处。
