  language: zh_hans
  text: '《巴拿巴书信》第5章


    主正是为此甘愿把自己的肉身交给朽坏，好使我们因罪得赦免而得洁净；这洁净是借着他所洒的血[a]成就的。


    因为，论到他的圣经，有些话关乎以色列，有些话关乎我们。经上说：“他因你们的过犯受了创伤，因我们的罪被压伤；因他所受的鞭伤，我们得了医治。他像羊被牵去宰杀，又像羔羊在剪毛的人面前默不作声。”


    所以，我们应当深深感谢主，因为他向我们揭示了过去，使我们对现在有智慧，也没有让我们对未来毫无领悟。


    经上又说：“网罗并非无缘无故张开给飞鸟。”[b]这话的意思是：人既知道正义的道路，却硬要走上黑暗的道路，他灭亡也是公正的。


    弟兄们，还有这一点：主虽是全世界的主——上帝在创世之初曾对他说：“我们要照着我们的形象和样式造人”——却甘愿为我们的生命受苦；那么，他究竟为什么甘愿在人的手下受苦呢？


    你们要明白：众先知从他领受恩典，便预言他的事。然而，他亲自甘愿受苦，为要消灭死亡，彰显死人复活；因为他必须在肉身中显现，


    也为要履行赐给列祖的应许，并为自己预备一个新子民。他在世上的时候便表明：他使人复活以后，必亲自施行审判。


    此外，他传道、教导以色列，行了那么多奇事和神迹，并且极其爱以色列人。[c]


    他拣选自己的使徒去宣扬他的福音；这些人罪孽深重，胜过一切罪人[d]，为要表明他来不是召义人，而是召罪人。就在那时，他显明自己是上帝的儿子。


    因为，他若没有在肉身中来，人就不能看见他而得救。人尚且无法正视那终将消逝的太阳的光芒，而太阳不过是他亲手所造的。


    所以，上帝的儿子在肉身中来，正是为了使那些迫害并杀害他众先知之人的罪达到满盈。[e]


    为此，他甘愿受苦。因为上帝论到他肉身所受、由他们造成的创伤说：“他们击打自己的牧人时，羊群的羊就必失散。”


    但他自己愿意这样受苦，因为他必须在木头上[f]受难。那位预言他的人论到他说：“求你使我的生命免受刀剑”；又说：“求你们用钉子刺透我的肉身，因为作恶者的会众起来攻击我。”[g]


    他又说：“看哪，我任凭人鞭打我的背，击打我的双颊；我使自己的脸坚如磐石。”'
