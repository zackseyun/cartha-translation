review_pass:
  verdict: revise
  source_fidelity: 本稿整体忠实呈现所供英文见证的劝诫性论述、经文引文及其未消解的神学张力。不过，少数词语处理越过了见证的语义范围：将“under one”译作“一举”加入了原文未明示的方式义；将“Black One”意译为“黑暗者”将“黑”扩展为“黑暗”；“给灵魂松弛/放任”的句子也需要更准确地表达为不可放纵心灵与恶人交往。另有一处长句重组后使“除非……抵挡，否则……”的条件关系不够清晰。由于直接希腊文及拉丁文校勘尚待进行，以下仍以提供的英文见证为审慎依据。
  naturalness: 原稿总体庄重自然，适合早期基督教劝诫文本。修订使“给心灵松弛”“忠心的奴仆”“在一者之下”等表达更贴近见证并保持可读性；“那黑者”虽不如意译自然，但作为刻意异常的称谓，以脚注说明比扩展其含义更稳妥。
  terminology: 保留“主”“约”“产业”“称义”“属灵”“典章”等术语。将“蒙爱的耶稣”统一为“蒙爱的耶稣”，不判定其为后来特定的称号；“那黑者”保留称谓的字面异常性，不直接等同于特定专名。
  issues:
  - severity: medium
    issue: “under one”被译为“一举”
    rationale: “一举”意为一次行动或一下子，英文见证的“under one”并不表达该意思。应以“在一者之下”保留其不寻常且未决的关系。
  - severity: medium
    issue: “Black One”译为“那黑暗者”
    rationale: “黑暗”加入了见证未明言的抽象意义。该称谓虽显突兀，仍应译作“那黑者”，并用脚注说明其性质。
  - severity: medium
    issue: “给灵魂松弛”译作“不要让我们的心灵松懈”
    rationale: 原句的重点是不可给予灵魂放纵、使其得以同罪人恶人交往的自由，而不只是心灵状态的松懈。
  - severity: low
    issue: 关于抵挡邪恶的条件句被过度重组
    rationale: 原文是“信仰的整个时期于我们无益，除非我们如今……抵挡”的结构；应恢复直接清楚的条件关系。
  - severity: low
    issue: “devoted slave”弱化为“忠心的仆人”
    rationale: 在不制造贬抑语气的前提下，“忠心的奴仆”更完整保留见证的自我称谓强度。
  revised_text: '因此，我们应当深入考察现今的处境，查明那些能拯救我们的事。让我们彻底远离一切不法的行为，免得不法的行为制伏我们；也让我们憎恶现今时代的迷误，好使我们因那将要来到的而蒙爱。


    不要放纵我们的心灵，使它有自由与罪人和恶人交往，免得我们也变得和他们一样。


    那最后的绊倒之事已经临近；关于这事，经上如以诺所说[a]。正因如此，主缩短了时节和日子，好让他所爱的那一位赶快来到他的产业。


    先知也这样说：“十个王国要在地上掌权；在它们之后，另有一位王兴起，他要使其中三个王在一者之下降卑。”[b]


    但以理也同样论到这事说：“我看见第四只兽邪恶、强壮，比地上一切走兽都更难驯服；又看见从它长出十只角，并从这些角中长出一只小角，一个赘生物；又看见它使三只大角在一者之下降卑。”[c]


    所以，你们应当明白。此外，我还要请求你们一件事：我也是你们中的一员，爱你们每一个人胜过爱自己的性命；如今务要谨慎自守，不要像某些人那样罪上加罪，还说我们的约也仍旧属于他们。


    这约是我们的；但他们却这样永远失去了它——就在摩西刚领受了约之后。因为经上说：“摩西在山上禁食四十昼夜，从主领受了约，就是由主的手指写成的石版。”


    可是，他们转向偶像，便失去了这约。因为主这样说：“摩西！摩西！快下去，因为你从埃及地领出来的百姓行了不法的事。”摩西明白了，就把两块版从手中扔下；他们的约便摔碎了，好使蒙爱的耶稣之约，借着从信靠他而生的盼望，印在我们心里。[d]


    我本愿意写许多事；我不是以教师的身份写，而是出于爱你们，不愿你们缺少我们所拥有的；我急切地写给你们，作你们忠心的奴仆。因此，在这末后的日子里，我们务要警醒。我们信仰生活的全部岁月，对我们都毫无益处，除非我们如今在这不法的时期、在将要发生的种种绊倒之事中，按上帝儿女所当有的样子抵挡，好使那黑者不得乘隙而入。[e]


    让我们远离一切虚妄，彻底憎恶恶道上的行为。你们不可私下退避，各自孤立，仿佛自己已经称义；反要聚集在一起，共同商议大家的益处。


    因为经上说：“那些自以为有智慧、看自己为聪明的人有祸了！”让我们成为属灵的人，成为一座为上帝造得完备的殿。只要力所能及，就让我们操练敬畏上帝，[并且][f]竭力遵守他的诫命，好让我们以他的典章为乐。


    主审判世界，并不偏待人；每个人都要照自己的行为得报。人若为善，他的义必在路上走在他前面；人若作恶，他所作恶事的报应就在他面前。免得我们虽是蒙召的人，却因松懈而在自己的罪中沉睡，以致那邪恶的首领得势攻击我们，把我们从主的国里赶出去。


    弟兄们，你们还要明白这一点：你们看见，尽管以色列中发生了那么多神迹奇事，他们仍被弃绝。因此，我们务要谨慎，免得我们正如经上所说的那样：“蒙召的人多，选上的人少。”'
