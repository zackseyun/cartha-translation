  revised_text: '因此，我们应当深入考察现今的事，查究那些有能力拯救我们的事。让我们彻底远离一切不法的行为，免得不法的行为制伏我们；也让我们憎恶现今时代的迷误，好使我们因那将要来到的而蒙爱。


    不要放纵自己的心灵，让它有自由与罪人和恶人交往，免得我们也变得和他们一样。


    最后的绊脚之事已经临近，正如以诺所说、经上所论到的那样[a]。正因如此，主缩短了时节和日子，好让他所爱的人赶快来到他的产业。


    先知也这样说：“十个王国要在地上掌权；在它们之后，另有一位王要兴起；他要一下子使其中三个王降卑。”[b]


    但以理也同样论到这事说：“我看见第四只兽邪恶、强壮，比地上一切走兽都更难驯服；又看见十只角从它而出，又从这些角中出现一只小角和一个赘生物；它一下子使三只大角降卑。”[c]


    所以，你们应当明白。此外，我还要请求你们一件事：我也是你们中的一员，并且爱你们每一个人，胜过爱自己的性命。如今务要谨慎自守，不要像某些人那样罪上加罪，还说我们的约也仍归他们所有。


    这约是我们的；但他们在摩西刚领受这约之后，就这样永远失去了它。因为经上说：“摩西在山上禁食四十昼夜，从主领受了约，就是主的手指所写的石版。”


    可是，他们转向偶像，便失去了这约。因为主这样说：“摩西！摩西！快下去，因为你从埃及地领出来的百姓行了不法的事。”摩西明白了，就把两块石版从手中扔下；他们的约便摔碎了，好使那蒙爱者耶稣之约，借着从信靠他而生的盼望，印在我们心里。[d]


    我本想写许多事；我不是以教师的身份写，而是出于爱你们，不愿你们缺少我们所拥有的；我热切地写给你们，作你们尽心的仆人。因此，在这末后的日子里，我们务要警醒。我们信仰的全部时日，对我们都毫无益处，除非我们如今在这不法的时期和将要发生的种种绊脚之事中，按上帝儿女所当有的样子加以抵挡，免得那黑者乘隙而入。[e]


    让我们远离一切虚妄，彻底憎恶恶道上的行为。不要暗自退居、各自孤立，仿佛自己已经称义；反要聚集在一起，共同商议大家的益处。


    因为经上说：“那些自以为有智慧、看自己为聪明的人有祸了！”让我们成为属灵的人，成为一座完全归于上帝的殿。只要力所能及，就让我们操练敬畏上帝，[并且][f]竭力遵守他的诫命，好让我们以他的典章为乐。


    主审判世界，并不偏待人；每个人都要照自己的行为得报。人若为善，他的义必在路上走在他前面；人若作恶，他所作恶事的报应就在他面前，免得我们虽是蒙召的人，却因松懈而在自己的罪中沉睡，以致那邪恶的首领得势攻击我们，把我们从主的国里赶出去。


    弟兄们，你们还要明白这一点：你们看见，尽管以色列中发生了那么多神迹奇事，他们仍被弃绝。因此，我们务要谨慎，免得我们正如经上所说的那样：“蒙召的人多，选上的人少。”'
  revised_footnotes:
  - marker: a
    text: 这里归于以诺的话，在现存《以诺一书》中没有找到完全对应的句子；作者可能援引了当时流传的以诺传统。
    reason: 说明引文来源的不确定性，避免读者误以为可在现存《以诺一书》中直接找到逐字对应。
  - marker: b
    text: “一下子”对应见证中不寻常的“under one”；此处也可被理解为“使三个王归于一王之下”。
    reason: 保留该短语在见证背后可能存在的文本或解释歧义，而不在正文中作单一判定。
  - marker: c
    text: 本句呼应《但以理书》7章，但措辞与通行经文不完全相同。“一只小角和一个赘生物”按见证保留并列及不寻常意象，未判定二者是否同指。
    reason: 标明自由引述性质，并避免把见证的句法歧义解释为单一意象。
  - marker: d
    text: “他们的约”也有见证可理解为“那约”；本译依所给见证保留物主表达。
    reason: 提示代词与约之归属在文本传承和翻译中具有解释张力。
  - marker: e
    text: “那黑者”近于直译“the Black One”，是对邪恶权势的人格化称谓；本译不将其直接等同于某一专名。
    reason: 保留见证的颜色称谓，避免以“黑暗者”等解释性词语替代。
  - marker: f
    text: “并且”在所据见证中以方括号标示为补入的连接词，原文传承在此不确定。
    reason: 保留用户材料中的方括号恢复信号，并说明其文本性质。
