review_pass:
  verdict: revise
  source_fidelity: 需修订。正文将“sprinkle the people”具体化为“把水逐一洒在民众身上”，原提供见证没有“水”，不应补入。另“cast them into vessels”宜明确为把灰放入器皿；“twist the scarlet wool on a tree … and the hyssop”宜将羊毛与牛膝草同置于该动作中。"offered him for slaughter"译作“把他交出去宰杀”加入了“交出去”的动作，宜改为“献上他供宰杀”。其余疑难处，包括十二与三的张力、“国在十字架上”及牛膝草的“污秽”，应保持不作协调。
  naturalness: 整体庄重、可朗读，但“收起灰来”“放进器皿”“并配上牛膝草”略显口语或动作关系不清；“孩子们”在这段礼仪—寓意论述中可统一作较庄重而仍不预断身份的“孩童”。“把水逐一洒在民众身上”虽自然，却不忠实，改为“逐一洒在民众身上”即可。
  terminology: “预表”“母牛／牛犊”“朱红色羊毛”“牛膝草”“木头”均可保留。“国”保留 kingdom 的开放性，脚注说明“统治／王权”的可能，恰当。应避免把“authority over the Gospel”弱化为泛泛的“有关福音的权柄”，改作“掌管福音的权柄”，同时不把孩童指定为使徒或门徒。
  issues:
  - severity: medium
    issue: “把水逐一洒在民众身上”无来源依据。
    rationale: 所给英文见证只说孩童逐一洒在民众身上，并未说所洒的是水；补出“水”会缩窄礼仪动作及其对象。
  - severity: medium
    issue: “把他交出去宰杀”增添“交出去”。
    rationale: 见证为“offered him for slaughter”，强调献上供宰杀，未明说交付给他人；应避免加入叙事性动作。
  - severity: low
    issue: 羊毛与牛膝草的动作关系在中文中不清晰。
    rationale: 见证将朱红色羊毛与牛膝草连在“缠在木头上”的步骤中；译文“并配上牛膝草”较松散，宜更直接呈现。
  - severity: low
    issue: “为各支派作见证”可更贴近“for a testimony unto the tribes”。
    rationale: “作为对各支派的见证”较准确表达该数目所具的见证功能，而不暗示他们主动向支派作证。
  revised_text: '你们认为这个预表是什么意思呢？诫命吩咐以色列人：那些罪恶已经满盈的人要献上一头母牛，把它宰杀并焚烧；然后孩童要收取灰烬，放入器皿中，又把朱红色的羊毛和牛膝草缠在一根木头上——看，这里又有十字架和朱红色羊毛的预表——做完这些以后，孩童要逐一洒在民众身上，使他们从罪中得洁净。



    你们要明白，这话对你们说得多么清楚：那牛犊就是耶稣；献上它的人是罪人，也就是那些献上他供宰杀的人。此后，献上的不再是人；荣耀也不再归于罪人。[a]



    那些洒的孩童，就是向我们宣讲罪得赦免和内心得洁净的人；他们共有十二位，作为对各支派的见证——因为以色列有十二个支派。耶稣把掌管福音的权柄赐给他们，使他们去宣讲。



    可是，为什么洒的孩童又是三个人呢？这是为亚伯拉罕、以撒和雅各作见证，因为他们在上帝面前是大有能力的。



    接着，是把羊毛放在木头上。这表示耶稣的国在十字架上，[b]凡把盼望寄托在他身上的人，都必永远活着。



    为什么羊毛和牛膝草同时出现呢？因为在他的国里将有邪恶而污秽的日子，我们要在那些日子中得救；因为肉身受痛苦的人，要借着牛膝草的污秽得医治。[c]



    如今，这些事之所以这样发生，对我们确实是显明的；对他们却是隐晦的，因为他们没有听见主的声音。'
