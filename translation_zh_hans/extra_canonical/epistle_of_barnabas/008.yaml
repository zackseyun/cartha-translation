base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/008.yaml
  text: 'But what do you think the type means, where the commandment is given to Israel that those men whose sins are full grown must offer a heifer, slaughter it, and burn it; and then that the children must take up the ashes and cast them into vessels, and twist the scarlet wool on a tree—see, here again is the type of the cross and the scarlet wool—and the hyssop; and that, this done, the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand how plainly it is spoken to you: the calf is Jesus; the men who offer it, being sinners, are those who offered him for slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are those who preached to us the forgiveness of sins and the purification of our hearts, those to whom, being twelve in number for a testimony to the tribes—for there are twelve tribes of Israel—he gave authority over the Gospel, that they should preach it.


    But why are the children who sprinkle three in number? For a testimony to Abraham, Isaac, and Jacob, because these are mighty before God.


    Then there is the placing of the wool on the tree. This means that the kingdom of Jesus is on the cross, and that those who set their hope on him shall live forever.


    And why are the wool and the hyssop at the same time? Because in his kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they did not hear the voice of the Lord.'
translation:
  language: zh_hans
  text: '你们认为这个预表是什么意思呢？诫命吩咐以色列人：要让那些罪恶已经满盈的人献上一头母牛，宰杀并焚烧；然后让孩子们收起灰来，放进器皿，把朱红色的羊毛缠在一根木头上——看，这里又有十字架和朱红色羊毛的预表——并配上牛膝草。做完这些以后，孩子们要把水逐一洒在民众身上，使他们的罪得以洁净。


    你们要明白，这话对你们说得多么清楚：那牛犊就是耶稣；献牛犊的人是罪人，也就是那些把他交出去宰杀的人。此后，就不再是人献上了；荣耀也不再属于罪人。[a]


    那些洒水的孩子，就是向我们宣讲罪得赦免、内心得洁净的人。他们共有十二位，为各支派作见证——因为以色列有十二个支派。耶稣把有关福音的权柄赐给他们，使他们去宣讲。


    可是，为什么洒水的孩子又是三个人呢？这是为亚伯拉罕、以撒和雅各作见证，因为他们在上帝面前大有能力。


    接着，羊毛被放在木头上。这表示耶稣的国在十字架上，[b]凡把盼望寄托在他身上的人，都必永远活着。


    为什么羊毛和牛膝草同时出现呢？因为在他的国里将有邪恶污秽的日子，我们却要在那些日子中得救；因为肉身受痛苦的人，借着牛膝草的污秽而得医治。[c]


    如今，这些事之所以这样发生，对我们确实是显明的；对他们却是隐晦的，因为他们没有听见主的声音。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “此后，就不再是人献上了”一句在现有见证中语意不明，也可理解为“此后，献上的便不再是人”。本译文保留其含混性。
    reason: 该句的主语、谓语省略关系及括注所指不够确定，不宜在正文中强行释义。
  - marker: b
    text: “国”也可理解为“统治”或“王权”；原句把它直接与十字架相连。
    reason: 保留 kingdom 一词的多重可能，并提示中文直译所呈现的神学张力。
  - marker: c
    text: “借着牛膝草的污秽而得医治”依照所提供的古译见证直译；原文传统及其确切含义仍待希腊文、拉丁文见证复核。
    reason: 该表达语义反常，可能涉及文本、词义或古代象征解释问题，须向读者透明说明。
lexical_decisions:
- source_word: type
  choice: 预表
  rationale: 保留作者把礼仪细节视为后来事件之象征性先兆的论证方式；“预表”在现代中文中简洁而能承载此处的类型论含义。
- source_word: heifer / calf
  choice: 母牛 / 牛犊
  rationale: 依照所提供见证保留前后称谓的变化，不擅自统一。
- source_word: children
  choice: 孩子们
  rationale: 忠实保留见证中的反复用词以及十二人和三人之间刻意存在的张力，不改作“门徒”或“使徒”。
- source_word: scarlet wool
  choice: 朱红色的羊毛
  rationale: “朱红色”准确表达礼仪性色彩，“羊毛”保留材料本身。
- source_word: tree
  choice: 木头
  rationale: 此处与十字架的解释直接相关；“木头”既自然，也保留木材、木架或树木之间的语义空间。
- source_word: hyssop
  choice: 牛膝草
  rationale: 采用现代中文圣经与古代礼仪文本中通行的植物名称。
- source_word: kingdom
  choice: 国
  rationale: 采用直接、开放的译法，不预先把它限定为“王权”“统治”或空间性的国度。
- source_word: foul
  choice: 污秽
  rationale: 保留原见证在“日子”和“牛膝草”两处使用的负面、令人不适的措辞，不以较顺畅的“卑微”或“洁净作用”替代。
theological_decisions:
- issue: 母牛礼仪与耶稣受死的对应
  choice: 按作者原有解释直译为“那牛犊就是耶稣”
  alternative: 弱化为“那牛犊象征耶稣”
  rationale: 上文已经明确称其为预表，而本段使用直接同一式陈述；保留这种强烈表达，避免削弱作者的神学论证。
- issue: 十二位与三位洒水者之间的不一致
  choice: 两者都原样保留
  alternative: 把“三个人”协调为十二人中的三人，或视作抄写错误而更改
  rationale: 现有见证明确包含两种数目；在缺乏完成的原文校勘前，不应静默协调。
- issue: “耶稣的国在十字架上”
  choice: 保留“国在十字架上”的紧张表达，并加注说明可能语义
  alternative: 解释性译为“耶稣的王权借十字架彰显”
  rationale: 后者虽较自然，却会替作者解决“国／王权”与十字架关系的歧义。
- issue: 牛膝草的“污秽”带来医治
  choice: 保留悖论式措辞
  alternative: 改译为“借着牛膝草的洁净作用得医治”
  rationale: 所提供见证明确使用负面词汇；不以熟悉的洁净象征覆盖文本本身的困难。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；保留修辞问句、礼仪步骤及作者逐项释义的讲论节奏。本文依据所提供的公版英文见证拟定，希腊文／拉丁文原始见证尚待直接复核，因此对疑难句采取保守译法，并以脚注标明，不作宗派性协调或教义扩写。
