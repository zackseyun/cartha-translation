review_pass:
  verdict: revise
  source_fidelity: 译稿整体忠实保留了《巴拿巴书》十九章的训诫体、重复句式、历史性的主仆语境及若干不宜擅自化解的神学张力。仍有少数措辞或缩窄英文见证的范围（如将 works 明定为“行善”、将 lofty 限定为“权贵”），或在中文中造成不必要的意义偏移（如“上帝的预表”）。鉴于所供原始语言复核尚待完成，修订严格以英文见证为直接审校基准，并以脚注保留关键歧义。
  naturalness: 原稿庄重、流畅，适合训诫文体。修订使若干表达更自然且更贴近原句结构，例如“凡临到你身上的事”“要让邻舍分享你的一切”“不可两舌”；并将主仆段落恢复为泛指性的单数“你”，避免无根据的叙述人称转换。
  terminology: 保留“光明之道”“上帝”“主”“圣灵”“那恶者”等既有宗教语域。将 type of God 由易被理解为预示性的“预表”改为“上帝的代表”，并以脚注说明其为类比性、代表性用语；将“权贵”改为较宽的“地位高的人”。
  issues:
  - severity: medium
    issue: “热心行善”将 works 缩窄为善行。
    rationale: 英文见证只说“在其作为／行为上热心”，虽然语境是伦理训诫，却未在此处限定为“行善”。改作“在自己的行为上热心”。
  - severity: medium
    issue: “上帝的预表”可能将 type 误解为预示后事的预表。
    rationale: 此处的 type 更适合按代表性形象或类比处理；“上帝的代表”较能传达原句要求的类比，且不把主人等同于上帝。
  - severity: low
    issue: “权贵”将 the lofty 限定为政治或社会权力者。
    rationale: 见证的范围可以包括一切地位高、显贵或自高者；“地位高的人”保留较宽范围。
  - severity: low
    issue: “口是心非”未充分对应 double-tongued 的言语两面性。
    rationale: “不可两舌”是现代中文宗教／伦理语域中可理解的表达，也更贴近原见证的并列词。
  - severity: low
    issue: “临到你的遭遇”搭配不够自然。
    rationale: 改为“凡临到你身上的事”，既自然，又不将 accidents 误限为意外事故。
  - severity: low
    issue: 主仆段落将泛指的单数训诫转换为“你们”。
    rationale: 英文见证持续使用单数第二人称；中文恢复“你”可保留原文对每一读者的直接劝诫。
  revised_text: '所以，光明之道就是这样：人若愿意沿着这条路前往为他指定的归宿，就应当在自己的行为上热心。那赐给我们、使我们可以行在其中的知识如下：


    你要爱那造你的，敬畏那创造你的，荣耀那救你脱离死亡的。你要心地纯一，灵里富足；不可依附那些走死亡之路的人。凡不蒙上帝喜悦的事，你都要恨恶；一切虚伪，你都要恨恶；永不可离弃主的诫命。


    不可高抬自己，凡事都要存谦卑的心；不可把荣耀归给自己；不可图谋恶事害你的邻舍；不可让狂妄进入你的心。


    不可淫乱，不可通奸，不可败坏男童。[a] 在任何不洁之处，不可从你口中说出上帝的话。[b] 责备人的过犯时，不可因人而异。你要温柔，要安静，要敬畏你所听见的话；不可怀恨你的弟兄。


    不可疑惑一件事究竟会不会成就。[c] 不可妄用主的名。爱邻舍要胜过爱自己的性命。不可用堕胎杀害孩子；孩子出生以后，也不可杀他。不可撇下你的儿女不管，却要从他们年幼时就教导他们敬畏上帝。


    不可贪图邻舍的财物，不可贪利。你的心不可依附地位高的人，却要与谦卑的人和义人同行。凡临到你身上的事，你都要当作好事接受，因为知道没有什么事是在上帝以外发生的。[d] 不可三心二意，也不可两舌。


    你要顺服你的主人，如同顺服上帝的代表，存敬重和畏惧的心。[e] 不可苛刻地吩咐自己的男仆或女仆，因为他们也仰望同一位上帝，免得他们不再敬畏那位在你们双方之上的上帝。因为他来召人，并不徇情面，而是召那些圣灵所预备的人。[f]


    凡事都要让邻舍分享，不可说什么东西是你独有的。你们既然一同分享那不能朽坏的，何况这些会朽坏的东西呢？不可口无遮拦，因为口是死亡的网罗。你要尽自己所能，为了你的灵魂保持纯洁。


    不可伸手只顾领受，施舍时却把手缩回。凡向你讲说主之道的人，你都要像爱护眼中的瞳人一样爱护他。


    你要昼夜记念审判之日，天天寻找圣徒：或用言语劳作，前去劝勉他们，并思量怎样借着你的话拯救灵魂；或亲手做工，作为你罪的赎价。[g]


    施舍不可迟疑，施舍时也不可抱怨；你要知道，谁是那善于偿付你报偿的主。你要持守所领受的，既不增添，也不删减。你要彻底恨恶那恶者。你要秉公判断。


    不可制造分裂；争执的人，你要使他们和好，叫他们重新相聚。你要承认自己的罪。不可怀着邪恶的良心去祷告。这就是光明之道。'
