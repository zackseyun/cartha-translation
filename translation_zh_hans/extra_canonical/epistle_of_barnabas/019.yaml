review_pass:
  verdict: revise
  source_fidelity: 整体上忠实传达所提供的英文见证及其训诫体结构，也谨慎保留了若干文本和神学歧义。不过，首句将笼统的“in his works”缩窄为“行善”，以及个别措辞对人称、语义和历史语境的处理，可作更贴近见证且更自然的修订。由于直接希腊文、拉丁文校勘尚待完成，本审阅不能解决见证间可能存在的底本异文。
  naturalness: 译文庄重、清楚，反复使用“你要／不可”也适合本章训诫文体。修订使“指定的归宿”“敬重和畏惧”“口无遮拦”等处更准确自然，并使主仆段恢复原文单数的直接劝诫。
  terminology: “光明之道”“上帝”“主”“圣灵”“那恶者”等术语前后一致。“上帝的预表”在现代汉语中易误解为主人预示上帝；修订为“上帝的代表”，并以脚注说明其为类比性表述，不等同于把主人神化。保留“男仆、女仆”以呈现古代制度语境。
  issues:
  - severity: medium
    issue: “zealous in his works”译为“热心行善”
    rationale: 英文见证只说在自己的作为／行动上热心、殷勤，并未明说“善”。加入“行善”缩窄了原句范围。
  - severity: medium
    issue: “as to a type of God, in shame and fear”译为“如同顺服上帝的预表，存敬重和畏惧的心”
    rationale: “预表”在中文神学语境通常指预示性的预型，未必适合此处的“代表／形象”语义；“shame”也较接近“羞惭”，而非“敬重”。
  - severity: low
    issue: 主仆段由单数转为复数
    rationale: 虽然中文复数不改变核心意思，但原文持续以单数第二人称训诫；保持单数能维持段落的修辞一致性。
  - severity: low
    issue: “不要口无遮拦”略强于“not be hasty with your tongue”
    rationale: 原见证重点是言语轻率、急躁；“口无遮拦”可包含无所顾忌的广泛意思。改为“不可轻率开口”更贴近。
  - severity: low
    issue: 脚注f将“他”自然指向上帝
    rationale: 所供英文见证以大写“He”处理，但本句没有明示先行词；在未核希腊文和拉丁文见证前，不应在注释中把指称确定为上帝。
  revised_text: '所以，光明之道就是这样：人若愿意沿着这条路前往为他指定的目的地，就应当在自己的行事上热心。赐给我们、使我们可以行在这道中的知识如下：


    你要爱那造你的，敬畏那创造你的，荣耀那救你脱离死亡的。你要心里单纯，灵里富足；不可依附那些走死亡之路的人。凡不蒙上帝喜悦的事，你都要恨恶；一切虚伪，你都要恨恶；永不可离弃主的诫命。


    不可高抬自己，凡事都要存谦卑的心；不可把荣耀归给自己；不可图谋恶事害你的邻舍；不可让狂妄进入你的心。


    不可淫乱，不可通奸，不可败坏男童。[a] 在不洁的人中间，不可从你口中说出上帝的话。[b] 责备人的过犯时，不可因人而异。你要温柔，要安静；对你所听见的话，要心怀敬畏；不可怀恨你的弟兄。


    不可疑惑一件事究竟会不会成就。[c] 不可妄用主的名。爱邻舍要胜过爱自己的性命。不可用堕胎杀害孩子；孩子出生以后，也不可杀他。不可撇下你的儿女不管，却要从他们年幼时就教导他们敬畏上帝。


    不可贪图邻舍的财物，不可贪利。不可在心里依附显贵，却要与谦卑、正直的人同行。凡临到你的遭遇，你要当作好事接受，因为知道没有什么事是在上帝以外发生的。[d] 不可三心二意，也不可口是心非。


    你作仆人的，要以羞惭和畏惧的心顺服主人，如同顺服上帝的代表。[e] 你作主人的，不可苛刻地吩咐那仰望同一位上帝的男仆或女仆，免得他们不再敬畏那位在你们双方之上的上帝；因为他来召人，并不徇人的情面，而是召那些圣灵所预备的人。[f]


    凡事都要让邻舍与你有分，不可说什么东西是你独有的。你们既然一同分享那不能朽坏的，何况这些会朽坏的东西呢？不可轻率开口，因为口是死亡的网罗。你要尽自己所能，为了你的灵魂保持纯洁。


    不可伸手只顾领受，施舍时却把手缩回。凡向你讲说主之道的人，你都要像爱护眼中的瞳人一样爱护他。


    你要昼夜记念审判之日，天天寻找圣徒：或以言语劳作，前去劝勉他们，并思量怎样借着你的话拯救灵魂；或亲手做工，作为你罪的赎价。[g]


    施舍不可迟疑，施舍时也不可抱怨；你要知道，谁是那慷慨偿付你赏赐的主。你要持守所领受的，既不增添，也不删减。你要彻底恨恶那恶者。你要秉公判断。


    不可制造分裂；争执的人，你要使他们和好，叫他们重新相聚。你要承认自己的罪。不可怀着邪恶的良心去祷告。这就是光明之道。'
