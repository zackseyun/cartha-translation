lexical_decisions:
- source_word: circumcised / circumcision
  choice: 受割礼／割礼
  rationale: 保留本章贯穿始终的肉身、心和耳朵之间的同一意象，不改写为较抽象的“洁净”或“更新”。
- source_word: hearing with the ears
  choice: 亲耳听／亲耳听从
  rationale: 在自然汉语中保留原文对“耳朵”和“听见”的强调；首处依语境用“听从”表达响应之意。
- source_word: cleverness
  choice: 自作聪明
  rationale: 传达这里明显的负面评价，同时避免把含义过度收窄为“诡诈”或特定异端教义。
- source_word: seal
  choice: 印记
  rationale: 保留契约身份标志的比喻，并避免直接解释成某一后世圣礼体系。
- source_word: looked forward in the spirit
  choice: 在灵里预先望见
  rationale: 保留前瞻和属灵洞见两层意思，不将其确定化为技术性的“预言”。
- source_word: innate gift
  choice: 内在的恩赐
  rationale: 所据见证含义较难确定；采用贴近字面的表达，避免擅自解释为“自然知识”或“植入的教义”。
theological_decisions:
- issue: 肉身割礼与内心割礼的张力
  choice: 按作者论证译为“他们所倚仗的割礼已经废除了”，并保留后续“不是肉身的割礼”
  alternative: 解释为仅废除对割礼的错误倚靠，而非割礼本身
  rationale: 所据文本直言其被废除；译文不替作者缓和，也不把此处提升为超出文本的普遍系统教义。
- issue: “邪恶的天使”在误导中的作用
  choice: 直译为“有一个邪恶的天使教他们自作聪明”
  alternative: 弱化为“邪恶使者”或“恶念”
  rationale: 保留文本明确的超自然称谓及其神学张力，不擅自自然化。
- issue: 亚伯拉罕数字释经中的基督论
  choice: 保留作者由希腊字母数值读出耶稣与十字架的论证，并用脚注说明
  alternative: 按现代历史语境改写或纠正该论证
  rationale: 这是本章核心的古代字母数值释经；翻译应准确呈现，而不是认可、否定或调和其方法。
- issue: “向主受割礼”的异常措辞
  choice: 正文保留“向主受割礼”，脚注指出见证不稳定
  alternative: 改作“为主给自己行割礼”或“归向主”
  rationale: 现有材料明确标示尚待原文复核，强行顺译会掩盖真实的不确定性。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。引文保持经文式节奏，但避免文言化。鉴于提供材料注明“源语言复核待定”，本稿以所给公共领域见证为临时依据，并对异常措辞、侵入标记及希腊字母数值释经作透明脚注；未把不确定处静默调和。
