lexical_decisions:
- source_word: Ten Words
  choice: 十诫
  rationale: 原表达直译为“十句话／十言”，但在现代汉语圣经语境中通常指十诫；此处采用普通读者最易理解的惯用名称。
- source_word: hallow / make holy
  choice: 分别为圣
  rationale: 保留使某日归于神圣用途的动作含义，并与后文人先被分别为圣的论证形成词语呼应。
- source_word: bring all things to an end
  choice: 使万物达到终局
  rationale: 既表达完成、终结的末世性含义，又避免误解为单纯毁灭。
- source_word: the Lawless One
  choice: 那不法者
  rationale: 保留带定冠词的个人化指称及原文可能的末世人物含义，不擅自指定其身份。
- source_word: new moons
  choice: 朔月
  rationale: 采用指每月初一宗教节期的传统而准确的汉语词。
- source_word: eighth day
  choice: 第八日
  rationale: 保留作者关于七日之后新创造开端的象征性用语，不解释性改写为“主日”。
- source_word: another world
  choice: 另一个世界
  rationale: 保持见证文本的措辞及其时代论含义，不提前限定为“新天新地”或“来世”。
- source_word: having been manifested
  choice: 显现之后
  rationale: 保留复活后被显明、出现的含义，同时使汉语自然简洁。
theological_decisions:
- issue: 六日与六千年的对应
  choice: 按作者原有释经直接保留
  alternative: 将其弱化为一般性的象征时代
  rationale: 这是本章论证的核心，即一日对应一千年；翻译不应替作者消解其明确的末世时间框架。
- issue: 第七日安息的主语
  choice: 译作“他才会……安息”，保留指代
  alternative: 明确改作“上帝才会安息”或“圣子才会安息”
  rationale: 所据见证的代词在上下文中可能引发指代张力；译文不擅自解决。
- issue: 现今能否将安息日分别为圣
  choice: 保留作者带反事实意味的尖锐判断
  alternative: 改写为现今只能不完全地守安息日
  rationale: 作者的论证是完全成圣与末后安息尚待实现；应保存这种神学张力。
- issue: 称义、应许与成圣的次序
  choice: 保留“被称为义—领受应许—先被分别为圣—才能将该日分别为圣”的次序
  alternative: 依后世系统神学重新组织术语关系
  rationale: 忠实呈现文本本身的救恩论表达，不导入宗派框架。
- issue: 第八日的实践
  choice: 译作“欢欢喜喜地守第八日”
  alternative: 译作“庆祝星期日”
  rationale: 保留作者本身的象征名称及喜乐实践，不将其直接等同于后来的制度化星期日礼仪。
- issue: 耶稣升天的时序
  choice: 按见证文本保留为与第八日相连的连续叙述
  alternative: 依据其他传统材料调整复活与升天之间的时间间隔
  rationale: 翻译须反映本章现存措辞，不以其他经文或传统协调其叙述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留早期基督教劝诫文体中的“孩子们”称呼。引文使用现代标点；神名按现代通行表达译为“上帝”，代词不作神性大写区分。因所供材料注明希腊文／拉丁文直接复核尚待进行，本稿以现有公共领域见证及审校层为依据，避免对潜在原文歧义作过度确定的处理。
