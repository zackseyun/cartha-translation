base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/001.yaml
  text: 'I greet you, sons and daughters, in the name of the Lord who loved us, in peace.


    Seeing that the ordinances of God are great and rich unto you, I rejoice with exceedingly great and overflowing joy over your blessed and glorious spirits; so innate is the grace of the spiritual gift you have received.


    Therefore, I congratulate myself all the more, hoping to be saved, because I truly see that the Spirit has been poured out among you from the riches of the Lord’s fountain. The greatly desired sight of you amazed me so much concerning you.


    Being persuaded of this, and knowing within myself that, after saying many things among you, I know that the Lord traveled with me on the way of righteousness, I am also wholly compelled to love you more than my own soul—for great faith and love dwell in you through the hope of the life that is his—considering this, therefore, that,


    if I take care to share with you some portion of what I received, it will become my reward for having ministered to such spirits, I was eager to send you something small, so that together with your faith you might also have complete knowledge.


    Well then, there are three ordinances of the Lord: *the hope of life, which is the beginning and end of our faith; righteousness, which is the beginning and end of judgment; and love displayed in gladness and exultation, the testimony of works of righteousness.*


    For the Lord made known to us through his prophets things past and present, giving us likewise the firstfruits of the taste of things future. Seeing each of these things coming to pass one by one, just as he said, we ought to offer a richer and higher offering to the fear of him. But I, not as though I were a teacher, but as one of you, will set out a few things by which you will be gladdened in the present circumstances.'
translation:
  language: zh_hans
  text: '《巴拿巴书信》第一章


    儿女们，愿你们平安！我奉那位爱我们的主的名向你们问安。


    我看见上帝的法度在你们中间既伟大又丰丰富富，就因你们蒙福而荣耀的灵，以极大而满溢的喜乐欢喜；你们所领受之属灵恩赐的恩典，已经如此深植在你们里面。


    因此，我越发为自己庆幸，盼望得救，因为我确实看见圣灵从主丰盛的泉源倾注在你们中间。我渴望已久，如今见到你们；这次相见使我对你们深感惊叹。


    我既对此深信不疑，又在心里清楚知道：我在你们中间讲了许多话以后，主曾与我同行在正义的道路上；我也完全受到催促，要爱你们胜过爱自己的性命——因为借着对那属于他的生命之盼望，大有信心和爱住在你们里面。于是我想到：


    只要我用心把自己所领受的一部分传给你们，服侍这样的灵便会成为我的赏赐。因此，我热切地写一点简短的话给你们，使你们不但有信心，也有完备的知识。


    那么，主有三项法度：生命的盼望，是我们信心的起始和终结；正义，是审判的起始和终结；在欢喜和雀跃中彰显的爱，是正义行为的见证。[a]


    主借着众先知把过去和现在的事告诉了我们，也使我们预先尝到未来之事的滋味。我们既看见这些事一件一件照他所说的实现，就应当为敬畏他献上更丰盛、更崇高的供物。[b] 至于我，我并不以教师自居，只是你们中间的一员；我要说明几件事，使你们在现今的处境中喜乐。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句原有结构高度凝练。“正义”与“审判”、“爱”与“正义行为的见证”之间的确切逻辑关系，可以有不同理解；译文保留其并列和格言式表达。
    reason: 避免把含混的三重法度强行整理成单一神学体系。
  - marker: b
    text: “为敬畏他献上更丰盛、更崇高的供物”也可理解为“在敬畏他的事上付出更多、更高的努力”。现有材料不足以完全确定这里的比喻和语法关系。
    reason: 公开领域英文见证措辞异常，且任务资料注明尚待直接核对希腊文和拉丁文见证。
lexical_decisions:
- source_word: ordinances / δικαιώματα（据相关希腊见证的通常读法）
  choice: 法度
  rationale: 兼顾神所定的规范、要求与正当准则，不把意义缩窄为礼仪条例或行政命令。
- source_word: spirits
  choice: 灵
  rationale: 保留原文以“灵”称呼受信者内在属灵生命或属灵之人的表达，不擅自改成单纯的“品格”或“心情”。
- source_word: the life which is His
  choice: 那属于他的生命
  rationale: 保留“他的”所指及生命与主之间关系的含混性，不直接释作“永生”或“他所赐的生命”。
- source_word: knowledge
  choice: 知识
  rationale: 对应信心之外进一步领受的认识；不用带有后世宗派或诺斯替色彩的专门术语。
- source_word: righteousness
  choice: 正义
  rationale: 在本段兼具道德正直与合乎上帝准则的含义；采用现代读者易懂且不预先限定为法庭称义的表达。
- source_word: firstfruits of the taste
  choice: 预先尝到……的滋味
  rationale: 自然表达“初熟果子／初尝”的复合意象，传达未来福分已可先行体验。
theological_decisions:
- issue: “三项法度”之间的句法与神学关系
  choice: 按三项并列保留：生命的盼望、正义、爱
  alternative: 把信心、审判、行为分别解释成完整的救恩阶段或固定教义体系
  rationale: 现有见证的句式凝练且关系具有张力；译文维持并列和各自的“起始与终结／见证”措辞，不补入体系化解释。
- issue: 圣灵倾注与作者得救盼望的关系
  choice: 保留作者因看见圣灵在受信者中间倾注而更盼望得救的原有逻辑
  alternative: 改写为作者确信受信者得救，或宣告自己已经得救
  rationale: 原句谈的是作者“盼望得救”，对象与确定程度不应被改换。
- issue: “正义，是审判的起始和终结”
  choice: 直译并保留其格言式张力
  alternative: 释作“公义是判断一切的标准”或“称义贯穿末日审判”
  rationale: 两种解释都可能过度确定原文未明说的关系。
- issue: “更丰盛、更崇高的供物”献给敬畏
  choice: 保留献供物的比喻，同时译作“为敬畏他”
  alternative: 意译为“更加努力提升敬畏之心”
  rationale: 现有英文见证的对象关系不够清晰，故在正文中维持祭献意象，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“儿女们”保留作者亲切而带教导意味的称呼；长句适度分层，以符合现代汉语阅读习惯，同时不消除原文的论证连接。此稿依据所提供的公共领域英文见证，并参照任务中关于希腊／拉丁见证的说明拟定；由于直接源语言校勘尚待完成，对若干异常句法采取审慎保留并加注的方式。
