translation:
  language: zh_hans
  text: '但那黑暗者的道路弯曲，充满咒诅；因为这是一条通往永死和刑罚的路，其中尽是毁灭人灵魂的事：拜偶像、狂妄、倚仗权势而自高[a]、虚伪、心怀二意、通奸、杀人、抢掠、骄傲、违法、诡诈、恶毒、顽梗、巫术、邪术、贪婪、不敬畏上帝。


    他们迫害善人，憎恨真理，喜爱谎言；不明白公义的赏赐，不亲近良善，也不持守公正的判断；不关心寡妇和孤儿。他们警醒，不是为了敬畏上帝，而是为了作恶；温柔和忍耐远远避开他们。他们喜爱虚妄之事，追逐报酬；不怜悯穷人，也不为劳苦受压的人劳苦；随时准备毁谤。他们不承认那位创造他们的主；他们杀害儿女，败坏上帝所造的；躲开有需要的人，欺压受苦的人；替富人说话，不公正地审判穷人；在一切事上犯罪。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倚仗权势而自高”：所给英文见证作不寻常的“exhalation of power”；相关希腊措辞通常理解为权势的高举、傲慢或自高。此译暂按该义处理。
    reason: 输入明确说明尚待直接核对希腊文和拉丁文见证，而英文见证此处疑有误植或旧译问题，需向读者公开不确定性。
lexical_decisions:
- source_word: τοῦ μέλανος（据现存希腊文本的常见读法）
  choice: 那黑暗者
  rationale: 字面可作“那黑者”。此处人格化地指邪恶势力；“黑暗者”在现代汉语中较自然，同时保留其称号性质，避免直接认定为某个特定专名。
- source_word: σκολιά
  choice: 弯曲
  rationale: 保留道路意象及其道德含义，比单译“邪恶”更贴近原文修辞。
- source_word: ὕψωμα δυνάμεως（据相关希腊文本读法）
  choice: 倚仗权势而自高
  rationale: 所给英文见证的“exhalation of power”很可能反映“exaltation/elevation of power”一类意义；译文显明“权势”与“自高”的关系，但以脚注标示其暂定性。
- source_word: διπλοκαρδία
  choice: 心怀二意
  rationale: 保留“心分为二”的形象，表达内心不专一、反复无常。
- source_word: οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ（据平行文本）
  choice: 不亲近良善，也不持守公正的判断
  rationale: 既保留“亲近/依附”的关系性动词，也让后半句在现代汉语中通顺。
- source_word: μισθάποδος / μισθὸν διώκοντες（见证传统所反映的表达）
  choice: 追逐报酬
  rationale: 不擅自限定为正当工资、贿赂或报复性回报，保留原语境中的负面而宽泛的含义。
- source_word: πλουσίων παράκλητοι（据平行希腊文本）
  choice: 替富人说话
  rationale: 表达为富有者辩护、偏袒其利益的意思，与下文对穷人的不公审判形成对照。
theological_decisions:
- issue: “黑者”的身份
  choice: 译作“那黑暗者”，不在正文直接译成“魔鬼”或“撒但”
  alternative: 那黑者；魔鬼；撒但
  rationale: 原文称号的象征性应予保留；直接换成特定专名会消除原文措辞所留的空间。
- issue: “永死和刑罚”的关系
  choice: 译作“通往永死和刑罚的路”
  alternative: “一条带着刑罚的永死之路”
  rationale: 保留死亡、永恒性与刑罚三项概念，不进一步界定刑罚是永死的同位说明、伴随状态，还是另一个终点。
- issue: “毁灭人灵魂”的主语归属
  choice: 译作“其中尽是毁灭人灵魂的事”
  alternative: “其中的事使他们的灵魂灭亡”
  rationale: 沿用列举罪恶行为的结构，不对“他们/人”的指称范围作过度限定。
- issue: 创造主与杀害儿女者之间的断句
  choice: 断作“他们不承认那位创造他们的主；他们杀害儿女”
  alternative: “不承认那使他们成为杀害儿女者的主”
  rationale: 后者在神学和句法上都会误导；相关两路训诲传统清楚支持将“杀害儿女”视为下一项罪行。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。首段保留恶行清单的紧凑节奏，次段以短分句呈现连续控诉。避免过度古雅的“寡妇孤儿不顾”等压缩表达，也不引入特定宗派术语。鉴于项目资料注明原语言审查尚未完成，本稿依据所给公共领域英文见证，并参考《巴拿巴书》20章与“两条道路”传统中可识别的希腊措辞拟定；争议最大的词组已作脚注披露。
