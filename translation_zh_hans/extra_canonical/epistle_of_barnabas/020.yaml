    text: “高举权势”：所给英文见证作不寻常的“exhalation of power”。相关希腊短语通常作ὕψωμα δυνάμεως，直译近于“权势的高举”；此处按其较通常的意义译出，不进一步限定为倚仗权势而自高。
    reason: 英文见证在此处措辞异常；脚注说明译文依据及仍保留的句法／语义开放性。
  revision_rationale: 修订限于可安全校正之处：以较贴近原短语的“高举权势”替代带有额外因果关系的译法；删去原文未明说的“主”；补足“受造物”。同时微调少数词语，以维持清晰、庄重的现代标准汉语，并保留“黑暗者”这一未被特定化的称号。
