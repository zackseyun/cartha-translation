  yaml_path: translation/extra_canonical/epistle_of_barnabas/003.yaml
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
translation:
  language: zh_hans
  text: '因此，关于这些事，他又对他们说：


    “你们为什么为我禁食，”主说，“好让你们今天高声呼喊，叫人听见你们的声音呢？这不是我所拣选的禁食，”主说，“也不只是让人苦待自己；


    即使你们把颈项弯得像圆环，披上麻布，躺在灰烬中，也不能把这样的日子称为蒙悦纳的禁食。


    但他对我们说：‘看哪，这才是我所拣选的禁食，’主说，‘要解开一切邪恶的捆绑，松开强制契约绷紧的绳索，使受压伤的人得释放，并撕断一切不义的轭。要把你的饼分给饥饿的人；若看见赤身的人，就给他衣服穿；要把无家可归的人接到你家中；若看见卑微的人，不可轻看他，也不可轻看你家里的人和你自己的骨肉。


    那时，你的光必如晨光破晓，你的伤必迅速痊愈；公义必行在你前面，上帝的荣耀必环绕你。


    那时你呼求，上帝就必应允你；你还在说话，他就说：“看哪，我在这里！”只要你从自己中间除掉重轭、指指点点的手势和抱怨的话；只要你真心把饼给饥饿的人，怜悯受苦的人。’”


    所以，我的弟兄们，那位恒久忍耐的，预先看见他在自己所爱者里面所预备的子民会以纯朴的心相信，便预先把这一切向我们显明，免得我们这些初学者撞上他们的律法而遭遇船难。[a]'
