  footnotes:
  - marker: a
    text: 本章引文大体对应《以赛亚书》58:4–10，但措辞和编排有若干差异。本译稿依据所提供的公版英译见证拟定；希腊文及相关拉丁文见证仍待直接校勘，因此“强制契约”“受压伤的人”及末句若干表达暂作审慎处理。
    reason: 说明互文来源、现有底本限制及关键语句的暂定性质，避免让读者误以为已经完成原语言校勘。
lexical_decisions:
- source_word: abasing / humbling his soul
  choice: 苦待自己
  rationale: 保留禁食语境中使自己受苦、刻苦己身的含义，同时避免把“魂”机械直译成不自然的现代汉语。
- source_word: forcible contracts
  choice: 强制契约
  rationale: 依所给英译见证保留法律与压迫意味；原文见证尚待直接核对，因此不进一步窄化为债券或卖身契。
- source_word: the broken ones
  choice: 受压伤的人
  rationale: 表达遭压迫而受创的人群，既保留“破碎”意象，也使现代读者能理解其社会处境。
- source_word: bond / yoke
  choice: 捆绑／轭
  rationale: 按上下文分别处理：前者强调束缚，后者保留负重与压迫的具体比喻。
- source_word: in his well-beloved
  choice: 在自己所爱者里面
  rationale: 保留原表述可能具有的基督论含义及其语义张力，不擅自补明“爱子”或其他身份称谓。
- source_word: shipwreck ourselves upon their law
  choice: 撞上他们的律法而遭遇船难
  rationale: 保留航海隐喻及“他们的律法”所形成的危险意象，不将其改写成抽象的“误解律法”。
theological_decisions:
- issue: 禁食的否定范围
  choice: 译为否定外在苦行本身作为蒙悦纳之禁食，而非笼统否定一切禁食
  alternative: 译成上帝完全废除禁食
  rationale: 上下文以公义和怜悯来界定真正蒙悦纳的禁食，不能无据扩展为对禁食实践的全面否定。
- issue: “所爱者”的身份
  choice: 保留“自己所爱者”这一较含蓄称呼
  alternative: 直接译为“爱子基督”
  rationale: 该称呼可能指向基督，但现有材料未在此句明说其姓名；保留含蓄表达可避免把解释写入正文。
- issue: “他们的律法”与作者立场
  choice: 保留第三人称“他们的律法”及船难警告
  alternative: 改写为对犹太律法或旧约的系统性神学判断
  rationale: 正文呈现明显的群体区分和警戒，但不宜据此导入后世宗派性的律法观。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。先知引文保留排比、命令句和“看哪”等经文语体；叙述与结语则避免过度文言化。代词依所给见证保留“他们／我们”的群体区分，但不额外解释其历史对象。
