review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实于所提供的英译见证，并保留了引文的命令、应许及末句的航海隐喻。不过，若干处将限定或解释性意思加入正文，或未充分表达原句的指向：例如“也不只是”弱化并改变了否定结构；“也不可轻看你家里的人和你自己的骨肉”把“不轻看”的对象误移为家人；“只要”将条件句处理得过强；“重轭”无据增添“重”。末句宜以“在……上触礁”更自然、准确地保留 shipwreck upon 的隐喻。直接希腊文及拉丁文见证尚未提供可供逐字核校的文本，故本次判断以所给英语见证为准，并保留相关不确定性。
  naturalness: 整体文体庄重、适合朗读。修订使否定句、条件句和嵌套引语更符合现代标准汉语；将“make your bed of ashes”译为“以灰烬作床”保留原有较强的形象，避免误作仅仅“躺在灰烬中”。“指指点点”比“指指点点的手势”更简练自然。
  terminology: “禁食、麻布、公义、荣耀、轭、律法”等术语可维持。为保留 source 的语义张力，“forcible contracts”仍译“强制契约”，“the broken ones”译“受压伤的人”；二者均在脚注说明为暂定处理。“in his well-beloved”维持为“在自己所爱者里面”，不将其释为特定基督论称号。
  issues:
  - severity: medium
    issue: “也不只是让人苦待自己”
    rationale: 英语见证为“not a man abasing his soul”，与前句共同界定“不被拣选的禁食”，并无“只是”的限定。应译为“也不是人苦待自己”。
  - severity: high
    issue: “也不可轻看你家里的人和你自己的骨肉”
    rationale: 该译文使“家里的人和骨肉”成为不可轻看的对象；英语见证的句法则延续“不可轻看他”，意为家人与骨肉也不可轻看那卑微者。需恢复代词指向。
  - severity: medium
    issue: “只要你……”处理条件句
    rationale: 英语见证使用 if；“只要”容易形成充分条件或时间性承诺。以“如果你……”较直接保留条件结构。
  - severity: low
    issue: “重轭”
    rationale: 见证仅作“the yoke”，未见“重”的限定；应译“轭”。
  - severity: medium
    issue: “撞上他们的律法而遭遇船难”
    rationale: 表达虽可理解，但“shipwreck ourselves upon”以“在……上触礁”更自然地保留航海比喻，并避免“撞上……而遭遇船难”的重复。
  revised_text: '因此，关于这些事，他又对他们说：


