review_pass:
  verdict: revise
  source_fidelity: 译稿总体忠实呈现本段借用《以赛亚书》58章而展开的论述，也保留了末句“所爱者”及“他们的律法”的含蓄与群体区分。不过，若干处把引文中具体的动作或隐含宾语译得不够准确：灰烬不是单纯“躺在”其中；“不可轻看……也不可轻看你家里的人”未能表达与《以赛亚书》互文相合的“不可躲避自己的骨肉”；末句的航海比喻也宜译得更自然。
  naturalness: 整体庄重、可朗读，但“也不只是让人苦待自己”“只要你从自己中间除掉重轭”“撞上他们的律法而遭遇船难”等表达分别造成否定范围、搭配和意象上的不顺。修订后保持现代标准汉语，同时保留经文式排比。
  terminology: “苦待自己”“麻布”“轭”“上帝”“所爱者”等处理基本适切。“强制契约”可暂保留以反映英译见证的法律—压迫语义，但应在注释中明确其属于待核的困难表达；“受压伤的人”改为“受压迫的人”，避免将“broken”过度具体化为身体创伤。
  issues:
  - severity: medium
    issue: “躺在灰烬中”弱化了“make your bed of ashes”的刻苦姿态。
    rationale: 原见证的表达是以灰烬铺床／作为卧榻，而非仅仅置身灰中。
  - severity: high
    issue: “也不可轻看你家里的人和你自己的骨肉”误置了否定动词的对象。
    rationale: 此处与《以赛亚书》58:7“不可躲避自己的骨肉”相互呼应；见证中的省略结构不宜直译成不可轻看家人。
  - severity: medium
    issue: “重轭”并非所给见证的明确含义。
    rationale: 原文为“the yoke”，译作“轭”或“压迫的轭”较稳妥；“重”是无据添加。
  - severity: medium
    issue: “撞上他们的律法而遭遇船难”不符合汉语航海意象。
    rationale: “在……上触礁／遭遇船难”可同时保留原文的航海隐喻及“他们的律法”这一危险触点。
  revised_text: '因此，关于这些事，他又对他们说：


    “你们为什么为我禁食，”主说，“以致你们的声音今天在呼喊中被人听见呢？这不是我所拣选的禁食，”主说，“也不是人苦待自己；


    即使你们把颈项弯得像圆环，披上麻布，以灰烬为卧榻，也不可称这样的禁食为蒙悦纳的。


    但他对我们说：‘看哪，这才是我所拣选的禁食，’主说，‘要解开一切邪恶的捆绑，松开强制契约绷紧的绳索，使受压迫的人得释放，并撕断一切不义的轭。要把你的饼分给饥饿的人；若看见赤身的人，就给他衣服穿；要把无家可归的人接到你家中；若看见卑微的人，不可轻看他；也不可躲避你自己的骨肉。


    那时，你的光必在清晨破晓；你的医治必迅速显现；公义必行在你前面，上帝的荣耀必环绕你。


    那时你呼求，上帝就必应允你；你还在说话，他就说：“看哪，我在这里！”只要你从自己中间除掉轭、指指点点的手势和抱怨的话；只要你真心把饼给饥饿的人，并怜悯受苦的人。’”


    所以，我的弟兄们，那位恒久忍耐的，预先看见他在自己所爱者里面所预备的子民会以纯朴的心相信，就预先把这一切向我们显明，免得我们像生手一样，在他们的律法上触礁而遭遇船难。[a]'
