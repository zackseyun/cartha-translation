review_pass:
  verdict: revise
  source_fidelity: 本稿总体忠实保留了本章围绕十字架、举手、铜蛇及“耶稣／约书亚”同名所作的预表式论证，也没有将非常规旧约引文调和为通行经文。不过若干处将“寄望于他”改为“仰望他”、将“树／木头”具体化为“木架”，或将“被刀剑杀戮”弱化为“杀败”，超出了所供见证的语义。以赛亚引文的句法也需要更贴近见证并保留其异常形式。
  naturalness: 原稿整体庄重流畅，适合现代中文朗读。修订使代词指向、引号内引文和长句层次更清楚，同时保留古代讲论文本特有的重复与设问。
  terminology: “十字架”“预表”“铜蛇”“基督”“神的儿子”等术语可保留。“set their hope on him”宜稳定译为“把希望寄托在他身上”，不宜译成带有额外视觉意象的“仰望”。ξύλον／tree 在本见证中宜保留为“树／木头”，不应在铜蛇段落预先释作“木架”。
  issues:
  - severity: medium
    issue: “set their hope on him”译为“仰望他”
    rationale: 英文见证强调把希望置于／寄托于他；“仰望”虽可在相关圣经叙事中通顺，却加入了原句未明说的视觉动作。
  - severity: medium
    issue: 铜蛇所置之处译为“木架”
    rationale: 所供见证为“tree”，且本段正依赖“tree”的修辞重复；译作“木架”会把意象具体化，并可能过早导向十字架。
  - severity: medium
    issue: “they were slain with the sword”译为“被刀剑杀败”
    rationale: 原文见证是被刀剑杀戮，不能弱化为军事上的战败。
  - severity: low
    issue: “gainsaid my righteous way”译为“招呼悖逆、反驳我正义道路的百姓”
    rationale: “招呼”并非原句所表达的关系；应为向／对悖逆并抗拒其正义道路的百姓伸手。
  - severity: medium
    issue: 以赛亚引文调整了“我握住了他的右手”与后续分句的结构
    rationale: 该引文形式本已异常，应尽量依见证保留“我握住了他的右手；列国要在他面前听从；我要摧毁君王的势力”的并列关系，而不改写为使役句。
  - severity: low
    issue: “in a figure”译为“以预表的方式”
    rationale: 本句虽处于预表论证中，但见证用语是较宽泛的“in a figure”；译为“以象征的形式”较能保留其解释空间。
  revised_text: '同样，他又在另一位先知那里论到十字架，说：“这些事什么时候成就呢？”主说：“当一棵树弯曲而又挺立，并且有血从一棵树上滴下来的时候。”在这里，你又领受了有关十字架和那位将被钉十字架者的教导。


    他又在摩西的事上说：当异族人向以色列发动战争时，为要在战争临到他们时提醒他们，正因他们的罪，他们已经被交付给死亡；圣灵对摩西的心说，他应当作出十字架和那位将要受苦者的预表，因为他说，除非他们把希望寄托在他身上，战争必永远临到他们。于是，摩西在交战之中把兵器一件件堆起来；他站在比众人都高的地方，伸开双手，以色列就再度得胜。但每当他把手垂下，他们就被刀剑杀戮。[a]


    这是什么缘故呢？为要让他们明白：除非他们把希望寄托在他身上，否则他们不能得救。


    他又在另一位先知那里说：“我整天伸开双手，向悖逆、抗拒我正义道路的百姓。”


    摩西又作出耶稣的预表：他必须受苦；当以色列正遭败落时，他们将以为已经除灭的那一位，反要借着一个象征使人得生。主使各样的蛇咬他们，他们就死了——因为过犯是借着蛇在夏娃身上发生的——为要使他们确信：他们因自己的过犯，必被交付给死亡的痛苦。


    不仅如此，摩西虽然颁布命令说：“不可为你的神制造铸造的或雕刻的偶像”，他自己却造了一个，为要向他们显明耶稣的预表。于是，摩西造了一条铜蛇，把它显著地竖起来，并宣告召集百姓。


    百姓聚集以后，恳求摩西为他们代求，使他们得到医治。摩西对他们说：“你们中间无论谁被咬了，都要来到那安放在树上的蛇那里；他要相信并盼望，这条本身已经死去的蛇能够使人得生，他就立刻得救。”他们便照样做了。在这些事上，你又看见耶稣的荣耀：万有都在他里面，也都归向他。


    摩西给嫩的儿子耶稣——也就是约书亚[b]——起这个名字时，又对他说了什么呢？摩西作为先知这样做，是要让全体百姓单单听从他，因为父把有关他儿子耶稣的一切事都启示出来。


    因此，摩西给嫩的儿子耶稣起了这个名字，并派他去窥探那地时，对他说：“你手里要拿一本书，写下主所说的话：在末后的日子，神的儿子要把亚玛力全家连根除灭。”[c]


    看哪，这里又是耶稣；他不是人之子，而是神的儿子，并且以象征的形式在肉身中显现。既然人们会说基督是大卫的儿子，大卫自己因惧怕并看清罪人的谬误，就预言说：“主对我主说：‘你坐在我的右边，等我使你的仇敌作你脚下的脚凳。’”


    以赛亚又这样说：“主对我的基督、主说：‘我握住了他的右手；列国要在他面前听从；我要摧毁君王的势力。’”[d]你看，大卫称他为“主”，并不称他为“儿子”。'
