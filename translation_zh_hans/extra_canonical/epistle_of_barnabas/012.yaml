review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿总体保留了本章连续的预表论证、非常规引文和代词的开放性，也以脚注恰当地提示其与通行旧约文本的差异。但数处将原见证的“把盼望寄托于他”改为“仰望他”，并在摩西为约书亚命名的设问中误将“先知”的修饰对象和句法关系转移到摩西身上；铜蛇段亦有主语及“象征”短语关系不够准确的问题。
  naturalness: 需修订。原稿整体庄重、可朗读，但“圣灵对摩西的心说”“战争必永远攻击他们”“以预表的方式在肉身中显现”等措辞略显生硬或引起不必要的解释。改稿以“把盼望寄托于他”“战争将永远向他们发动”“在肉身中藉着预表显明”等表达保留原意并改善现代汉语通顺度。
  terminology: 保留“十字架”“预表”“基督”“神的儿子”和“耶稣／约书亚”。“set their hope on him”统一译为“把盼望寄托于他”，避免将信靠／盼望的措辞具体化为视觉性的“仰望”。ξύλον／tree 在预言及铜蛇叙事中均译为“树／木头”，不擅自改作“木架”或“十字架”。
  issues:
  - severity: medium
    issue: “set their hope on him”译作“仰望他”
    rationale: 英文见证重复使用“set their hope on him”，语义核心是寄望、盼望或信靠；“仰望”额外加入视觉动作及特定释经联想。应在两处一致保留“把盼望寄托于他”。
  - severity: high
    issue: 约书亚命名段误置“先知”及因果句的修饰关系
    rationale: 原句问的是摩西给嫩的儿子耶稣（约书亚）这个名字时，对他说什么；“作为先知”在该论证中指约书亚，目的是使百姓只听从他，因父启示关于其子耶稣的一切。草稿“摩西作为先知这样做”改变了句法关系和论证。
  - severity: medium
    issue: 铜蛇段“使人得生”句的主语与“象征”关系不清
    rationale: 见证说摩西预表耶稣将受苦，并预示那位人们以为已毁灭者会使人活；此事是在以色列人仆倒时借一个象征显出。草稿的“他们以为已经除灭的那一位，反而要借一个象征使人得生”可被理解为以色列人毁灭了该位，且把象征直接作为其施行手段，关系过度固定。
  - severity: medium
    issue: 铜蛇所置之处译为“木架”
    rationale: 所供见证只说“tree”；在本章刻意连接树与十字架的修辞中，译作“木头”可保留该含混和意象，避免添加“架”的具体形制。
  - severity: low
    issue: 以赛亚引文脚注锚点紧贴下句
    rationale: 脚注标记后应有句末空格或换段，以维持正文及脚注锚点的排版清晰。
  revised_text: '同样，他又借另一位先知说明十字架的事。那先知说：“这些事什么时候成就呢？”主说：“每当一棵树弯下又直立起来，每当有血从树上滴下来的时候。”你在这里又受到有关十字架和那位将被钉十字架者的教导。


    他又借摩西说：当异族人向以色列发动战争时，为要在战争向他们发动时提醒他们：他们是因自己的罪被交付给死亡的；圣灵对摩西的心说，他应当作出十字架和那位将要受苦者的预表。因为圣灵说，除非他们把盼望寄托于他，否则战争将永远向他们发动。于是，在交战之中，摩西把兵器一件件堆叠起来；他站在比众人都高的地方，伸开双手，以色列就又得胜。但每当他把手垂下，他们就被刀剑杀戮。[a]


    为什么会这样？为要让他们明白：除非把盼望寄托于他，否则他们不能得救。


    他又借另一位先知说：“我整天伸开双手，向悖逆、反驳我正义道路的百姓。”


    摩西又作出耶稣的预表：他必须受苦；并且，当以色列人仆倒时，要藉着一个象征显明，那位他们将以为已经毁灭的，自己却要使人得生。主使各样的蛇咬他们，他们就死了——因为过犯曾借着蛇在夏娃身上发生——为要使他们确信：他们因自己的过犯，必被交付去遭受死亡的痛苦。


    不仅如此，摩西虽然颁布命令说：“不可为你的神制造铸像或雕像”，他自己却造了一个，为要向他们显明耶稣的预表。于是摩西造了一条铜蛇，把它显著地竖立起来，并宣告召集百姓。


    百姓聚集以后，恳求摩西为他们代求，使他们得到医治。摩西对他们说：“你们中间无论谁被咬了，都要来到那安放在木头上的蛇那里；他要相信并盼望：这条本身已经死去的蛇能够使人得生，他就立刻得救。”他们便照样做了。在这些事上，你又看见耶稣的荣耀：万有都在他里面，也都归于他。


    摩西给嫩的儿子耶稣——也就是约书亚[b]——起这个名字时，又对他说了什么呢？他是先知；这样，全体百姓便会单单听从他，因为父将有关他儿子耶稣的一切事都启示出来。


    因此，摩西给嫩的儿子耶稣起了这个名字，并派他去窥探那地时，对他说：“你手里要拿一本书，写下主所说的话：在末后的日子，神的儿子要把亚玛力全家连根除灭。”[c]


    看哪，这里又是耶稣；他不是人的儿子，而是神的儿子，并且在肉身中藉着预表显明。既然人们要说基督是大卫的儿子，大卫自己因敬畏并看清罪人的谬误，就预言说：“主对我主说：‘你坐在我的右边，等我使你的仇敌作你脚下的脚凳。’”


    以赛亚又这样说：“主对我的基督——主——说：‘我握住了他的右手，使列国在他面前听从；我也要摧毁君王的势力。’”[d] 你看，大卫称他为“主”，并不称他为“儿子”。'
