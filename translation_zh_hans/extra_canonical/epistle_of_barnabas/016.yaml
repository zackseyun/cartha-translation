  footnotes:
  - marker: a
    text: “把他局限在圣殿里奉为神圣”所据文字含义不甚明确，也可较直译为“在圣殿里将他分别为圣”；本句似在批评人把上帝像外族人的神祇一样安置在殿宇中。
    reason: 说明源见证中的语言困难，并保留另一种可能译法。
  - marker: b
    text: “亲自应许要建造并完成”也可译作“亲自着手建造并完成”。
    reason: 保留动词在承担、应许与着手实行之间的语义空间。
  - marker: c
    text: “那名”原文传统中可作为对上帝或主之名的绝对称呼；这里没有进一步明说。
    reason: 避免擅自确定其具体指称。
  - marker: d
    text: 这一长句的句法关系并不完全清楚；“从而领我们”在语法上可能以上帝为主语，也可能承接前述整组神圣恩赐与行动。
    reason: 保留原见证长句中的主语与结构歧义。
lexical_decisions:
- source_word: temple / house
  choice: 圣殿／殿／居所
  rationale: 按语境区分实体圣殿、引文中的殿宇及内在人格的居所，同时维持全章圣殿意象的连贯。
- source_word: the Name
  choice: 那名
  rationale: 保留早期基督教文本中带神学重量的绝对用法，不擅自补明具体所指。
- source_word: incorruptible
  choice: 不朽坏的
  rationale: 保留其超越普通“不会毁坏”的末世与生命意味。
- source_word: spiritual temple
  choice: 属灵圣殿
  rationale: 采用现代汉语基督教语境中清楚而庄重的表达，并与实体圣殿形成对照。
- source_word: calling of his promise
  choice: 他应许的呼召
  rationale: 保留属格关系可能具有的歧义，不改写成单一因果解释。
theological_decisions:
- issue: “在圣殿里使他成圣／奉他为圣”的含义
  choice: 把他局限在圣殿里奉为神圣
  alternative: 在圣殿里将他分别为圣
  rationale: 英文见证的表达生硬，语境指责把上帝当作可被殿宇容纳、如异教神祇般安置；正文作适度显义，并以脚注标明文本困难。
- issue: 真正圣殿的位置
  choice: 就在他亲自应许要建造并完成的地方
  alternative: 在他亲自着手建造并完成它的所在
  rationale: 避免把“地方”过早解释为教会、个人内心或末世圣殿，让后文自行展开。
- issue: 上帝在信徒里面说预言并居住
  choice: 保留直接陈述
  alternative: 解释为圣灵或基督在信徒中运行
  rationale: 原见证仅称“他自己”，不引入后期三一论或教会论上的特定辨识。
- issue: “圣殿的门就是口”所指
  choice: 按原意象直译
  alternative: 解释为传道者的口或信徒认信的口
  rationale: 所指存在张力；不在正文中替作者消除歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；保留第二人称复数“你们”、经文引语的宣告语气，以及本章从实体圣殿转向内在属灵圣殿的论证张力。因所提供材料注明希腊文／拉丁文复核尚待完成，本稿以公共领域英文见证及其所反映的源文结构为暂定依据，对高风险处设置脚注而不作教派化调和。
