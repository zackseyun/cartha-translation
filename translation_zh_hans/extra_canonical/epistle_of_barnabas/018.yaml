review_pass:
  verdict: revise
  source_fidelity: 经核对《巴拿巴书》18章希腊文的通行读法，草案有两处实质性偏差：首句的 γνῶσις 是“认识/知识”，不是“教训”；末句后半的 ἄρχων 是“统治者、掌权者”，并非与前半相同的“主”。此外，φωταγωγοὶ ἄγγελοι 宜明确译出为带来或引导光明的天使。
  naturalness: “布列着”虽可理解，但用于“天使在道路上被安排驻守”的句法略显生硬；“分别有……天使驻守”更自然且保留 τεταγμένοι 的受命、配置意味。“另一项教训和教导”也不自然，改为“另一番认识和教导”更符合现代庄重汉语。
  terminology: 保留“道路”“光明/黑暗”“上帝”“撒但”和“权能”等核心表达；将第二位的称号改为“统治者”，以反映 ἄρχων，避免把其与永恒的主并列称为“主”。“教导和权能的两条道路”仍保留原文属格结构可能具有的关系歧义。
  issues:
  - severity: high
    issue: 首句将 γνῶσις 译为“教训”。
    rationale: 希腊文为“转到另一番认识（γνῶσις）和教导（διδαχή）”；“教训”既遗漏“认识/知识”的语义，又与后面的“教导”形成不必要的近义重复。
  - severity: high
    issue: 末句将 δεύτερος 的 ἄρχων 译为“主”。
    rationale: 希腊文前半为 κύριος（主），后半为 ἄρχων（统治者/掌权者）。应保留称号差异，不能依据所给英语见证将两者一律译作“主”。
  - severity: medium
    issue: “上帝赐光的天使”使“赐光”的施事归于上帝，修饰关系不够准确。
    rationale: φωταγωγοὶ ἄγγελοι 的复合词描述天使是带来、引导光明者；宜译为“上帝那带来光明的天使”。
  - severity: low
    issue: “布列着”不够自然。
    rationale: τεταγμένοι 的重点是被安排、配置或驻守在各道路上；“分别有……天使驻守”较通顺。
  revised_text: '不过，让我们转到另一番认识和教导。关于教导和权能，有两条道路：一条是光明之路，另一条是黑暗之路；这两条道路之间有极大的差别。因为在一条路上，有上帝那带来光明的天使驻守；在另一条路上，有撒但的天使驻守。


    前一位是从亘古直到永远的主；后一位却是现今这不法时期的统治者。[a]'
  revised_footnotes:
  - marker: a
    text: 本段已按《巴拿巴书》18章希腊文通行读法复核；拉丁文见证仍待直接核对。末句前半称上帝为“主”（κύριος），后半称撒但为“统治者”（ἄρχων）；译文保留这一区别。“关于教导和权能，有两条道路”的语法关系仍按原文保留。
    reason: 说明底本复核状态，并标明末句两个不同称号及“教导和权能”关系的保留歧义。
  revision_rationale: 修订以希腊文为准，恢复“认识和教导”的并列，区分 κύριος 与 ἄρχων，并更准确、自然地表达“带来光明的天使”和其驻守道路的意象。将“不义”改为“不法”对应 ἀνομία（无法、违背律法），但不对“现今时期”作任何末世论延伸。
