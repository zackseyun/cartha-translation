base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/018.yaml
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
translation:
  language: zh_hans
  text: '不过，让我们转到另一项教训和教导。教导和权能有两条道路：一条属于光，另一条属于黑暗；这两条道路之间有极大的差别。因为在一条路上，布列着上帝赐光的天使；在另一条路上，则布列着撒但的天使。


    前一位是从亘古直到永远的主，后一位却是现今这不义时期的主。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂依据所提供的公版英语见证翻译；希腊文及拉丁文见证仍待直接核对。末句两次称“主”的措辞，以及“教导和权能”的语法关系，均按现有见证保留。
    reason: 明确当前底本限制，并提示两个可能受源语言复核影响的重要歧义。
lexical_decisions:
- source_word: lesson and teaching
  choice: 教训和教导
  rationale: 保留英译见证中两个近义词并列的形式；在尚未直接核对希腊文和拉丁文之前，不擅自合并。
- source_word: two ways
  choice: 两条道路
  rationale: 采用早期基督教伦理传统中自然且形象明确的表达，并贯穿本段。
- source_word: teaching and power
  choice: 教导和权能
  rationale: “权能”比一般的“能力”更能保留宗教语境中的支配力或属灵权势含义，同时不将二者关系解释得过死。
- source_word: light giving angels of God
  choice: 上帝赐光的天使
  rationale: 保留天使与“赐光”的修饰关系，避免译成仅仅身处光明中的天使。
- source_word: are stationed
  choice: 布列着
  rationale: 传达被安排驻守、列阵于道路上的意象，且符合庄重的现代汉语。
- source_word: from all eternity and unto all eternity
  choice: 从亘古直到永远
  rationale: 以自然庄重的汉语表达无始无终的时间范围。
- source_word: season of iniquity that now is
  choice: 现今这不义时期
  rationale: 保留“现今”“时期”和“不义”三个要素，不将其扩展解释为特定末世年代。
theological_decisions:
- issue: 两位“主”的身份及其对比
  choice: 前一位是从亘古直到永远的主，后一位却是现今这不义时期的主
  alternative: 前者是永恒的主，后者只是当前邪恶时代的统治者
  rationale: 保留见证文本两次使用“主”所造成的尖锐对比，不用“只是”“统治者”等词预先消解其神学张力；同时以“前一位/后一位”承接天使背后的两方。
- issue: “教导和权能”与“两条道路”的语法关系
  choice: 教导和权能有两条道路
  alternative: 有两种教导和两种权能，也就是两条道路
  rationale: 源语言复核尚待进行，因此保留所提供见证的结构和可能的歧义，不额外断定“教导”与“权能”各自都有两种。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“布列着”“亘古”等词略带经文体色彩，但仍属现代读者可理解的表达。避免加入宗派术语或把撒但的权势系统化解释为与上帝对等。
