base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/017.yaml
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
translation:
  language: zh_hans
  text: '我已经尽我所能，用浅明的话把这一切向你们说明了。我心里盼望，自己没有遗漏任何事，[没有漏掉有关救恩的事，以致未能如愿。][a]


    因为，如果我要写信告诉你们眼前或将来的事，你们不会明白，因为这些事是用比喻表达的。关于这些，就说到这里。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号内的文字依现有英文见证保留，可能反映补复文字或抄本残损；因尚待直接核对希腊文和拉丁文见证，其正文状态暂不确定。
    reason: 忠实呈现来源所标示的文本不确定性，并说明本稿仍有待原文校勘。
lexical_decisions:
- source_word: with all simplicity
  choice: 用浅明的话
  rationale: 这里强调表达方式简单明白，而不是品格上的单纯；译为“用浅明的话”自然且符合语境。
- source_word: my soul hopeth
  choice: 我心里盼望
  rationale: 保留闪语式或古代书信中“我的灵魂/生命”指说话者自身内在意愿的意味，同时避免现代汉语中生硬的“我的灵魂希望”。
- source_word: things immediate or future
  choice: 眼前或将来的事
  rationale: “immediate”的确切所指有待希腊文复核；“眼前”既可指当前，也保留临近之意，不强行限定。
- source_word: parables
  choice: 比喻
  rationale: 采用通行且庄重的宗教及文学用语；不擅自具体化为寓言、预表或谜语。
- source_word: So much then for this
  choice: 关于这些，就说到这里
  rationale: 以自然现代汉语表达段落收束语气。
theological_decisions:
- issue: 方括号内有关救恩的语句是否属于可确定正文
  choice: 在正文中保留方括号，并加注说明文本状态
  alternative: 无括号地并入正文，或完全删去
  rationale: 所给见证明确用方括号标示补复或抄本残损信号；保留可避免对文本确定性作过度判断。
- issue: “有关救恩的事”的范围
  choice: 直译为“有关救恩的事”
  alternative: 解释为得救条件、救恩教义或伦理要求
  rationale: 原见证没有进一步界定，故保留其概括性与潜在神学张力。
- issue: “眼前或将来的事”所指
  choice: 不解释其具体内容
  alternative: 明确解释为末世事件、现实事务或即将发生之事
  rationale: 现有英语见证不能充分决定所指；避免导入特定末世论解释。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“我心里盼望”比“我的灵魂盼望”更符合现代汉语，同时保留原句的内在情感。“你们”维持复数受信对象。由于直接希腊文/拉丁文审查尚未完成，本稿是以公共领域英文见证为基础的暂定译文；尤其是方括号内容及“眼前”的原词范围，出版前应据原文见证复核。
