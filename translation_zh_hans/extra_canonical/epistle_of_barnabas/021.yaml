review_pass:
  verdict: revise
  source_fidelity: 草稿整体忠实反映所提供的英文见证，且保留了“恶者”“器皿”等重要的开放表达；但数处增添或收窄了原句含义。“一切主的规例”把“上文所写的那些”扩成全称；“被认可”在原文仅说“被发现／被寻见”处加入正面裁决；并且正文删去了供稿英文见证和英文POB明确保留的“这些事，这些事”重复。
  naturalness: 整体庄重通顺，但“把那些你们能够帮助的人留在你们中间”不合现代汉语搭配，且未清楚表达应持续保有施善对象。“作自己忠实的劝导者”也可稍作调整，使其自然但仍保留原文不寻常的劝诫意象。
  terminology: “规例”“那恶者”“报偿”“器皿”均可保留。“被认可”应改为不预断审判结果的“得以被寻见”。“立法者”虽不十分日常，却正确保留强烈的法律措辞。
  issues:
  - severity: medium
    issue: “一切主的规例”增加了全称范围。
    rationale: 见证说“上文所写的……规例”，并非明说所有主的规例。应保留其所指范围。
  - severity: high
    issue: “在审判之日被认可”过度解释“be found”。
    rationale: 原表达没有说明被发现时的状态或结果；“认可”预设正面的审判结论。
  - severity: medium
    issue: 删除了英文见证和英文POB中的“these things, these things”重复。
    rationale: 在尚未完成希腊文／拉丁文见证复核的前提下，不宜在正文无依据地消除供稿明确保留的重复；可用脚注说明其可能是传抄或转录重复。
  - severity: medium
    issue: “把那些你们能够帮助的人留在你们中间”不自然且意义不够清楚。
    rationale: 应表达在群体中持续有可供行善、可施益的人，而不是字面上的“留住”某些人。
  - severity: low
    issue: “因为这些诫命配得如此看重”补入“看重”。
    rationale: 末句所指和“配得”的补足语均不明确；宜采用较少增义的表达并加说明。
  revised_text: '所以，学习上文所写的主的规例，并照着行，是好的。因为行这些事的人必在上帝的国里得荣耀；选择与这些事相反之道的人，却要和自己的行为一同灭亡。为此有复活，为此有报偿。


    我劝你们中身居高位的人：你们若肯接受我一点善意的劝告，就要使你们中间常有你们可以施善的人。不要疏忽。


    那日临近了；到那日，一切都要与那恶者一同被毁灭。主临近了，他的赏赐也临近了。[a]


    我再三劝你们：要彼此作良善的立法者；要作自己忠实的劝导者；要从你们中间除去一切虚伪。


    愿统管全世界的上帝赐给你们智慧、判断力、学识、对他规例的认识和忍耐。


    你们要受上帝教导，殷勤寻求主对你们的要求，并且付诸实行，好使你们在审判之日得以被寻见。[b]


    你们若还记得什么善事，就请在实行这些事、这些事时也记念我，使我的热望和警醒都能结出一些善果。我恳求你们把这当作给我的恩惠。[c]


    那美好的器皿——身体——还与你们同在的时候，不要缺少这些事中的任何一样，反要不断寻求这些事，并履行每一条诫命，因为这些诫命本是配得的。[d]


    正因如此，我越发热切地尽我所能写信给你们，好使你们喜乐。爱与和平的儿女们，愿你们安好！愿荣耀和一切恩典的主与你们的灵同在。'
  revised_footnotes:
  - marker: a
    text: “他的赏赐也临近了”也可较直译为“主临近了，他的赏赐也是如此”。
    reason: 保留简略原句中第二分句的省略关系。
  - marker: b
    text: “得以被寻见”较形式对应“被发现／被寻见”。原句没有明说在审判日被发现时的状态或结果。
    reason: 避免把开放的审判语句解释为“被认可”、得救或被定罪。
  - marker: c
    text: 所提供的英文见证和英文POB在“这些事”处重复一次。该重复可能反映传抄或转录现象，但在原语言见证尚待直接复核时，正文予以保留。
    reason: 说明重复读法及暂不擅自删改的处理。
