    text: “身体”是对“器皿”所作的解释性补明。“因为这些诫命本是配得的”保留末句“它们是配得的”的简略表达；“配得”所隐含的补足语未明说。
    reason: 区分器皿比喻与括注解释，并保留末句谓语的开放性。
  revision_rationale: 修订以所提供英文见证及英文POB审计文本为暂定依据：消除不必要的全称扩展和正面审判结论，恢复见证中明确保留的重复读法，改善“保留可施善之人”的汉语表达，并在“配得”一语保留其未明说的补足内容。由于供稿标明原始希腊文／拉丁文复核仍待完成，重复读法和若干简略措辞均以脚注标示，不作定本式判断。
