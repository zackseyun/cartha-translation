  naturalness: 正文庄重流畅，适合现代标准汉语。“使你们在审判之日被寻见”虽略带经文语体，却自然且能保留原句开放性。
  terminology: “规例”“那恶者”“器皿”“报偿”等选择稳妥。“立法者”保留了原文突兀但有意的措辞，应予维持。将“被认可”改为“被寻见”，避免预设审判结论。
