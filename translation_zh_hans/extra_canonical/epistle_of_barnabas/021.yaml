base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/021.yaml
  text: 'Therefore, it is good to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For whoever does these things will be glorified in the kingdom of God, but whoever chooses their opposites will perish together with their works. This is why there is the resurrection; this is why there is the recompense.


    I urge those of you who are in a higher position: if you are willing to receive any good advice from me, keep among you those to whom you can do good. Do not fail.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and his reward.


    Again and again I urge you: be good lawgivers for one another; remain faithful counselors to yourselves; remove all hypocrisy from among you.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of his ordinances, and patience.


    Be taught by God, diligently seeking what the Lord requires of you, and act so that you may be found on the day of judgment.


    But if you have any remembrance of what is good, remember me when you practice these things, these things, so that both my desire and my watchfulness may lead to some good result. I urge you, asking this as a favor.


    As long as the good vessel (of the body) is with you, do not lack any of these things, but search them out constantly and fulfill every commandment, for they deserve it.


    For this reason I was all the more eager to write to you as far as I was able, so that I might give you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
translation:
  language: zh_hans
  text: '所以，学习上文所写的一切主的规例，并照着行，是好的。因为行这些事的人必在上帝的国里得荣耀；选择相反之道的人，却要和自己的行为一同灭亡。为此有复活，为此有报偿。


    我劝你们中身居高位的人：你们若肯接受我一点善意的劝告，就要把那些你们能够帮助的人留在你们中间。不要疏忽。


    那日临近了；到那日，一切都要与那恶者一同被毁灭。主临近了，他的赏赐也临近了。[a]


    我再三劝你们：要彼此作良善的立法者；继续作自己忠实的劝导者；要从你们中间除去一切虚伪。


    愿统管全世界的上帝赐给你们智慧、判断力、学识、对他规例的认识和忍耐。


    你们要受上帝教导，殷勤寻求主对你们的要求，并且付诸实行，好使你们在审判之日被认可。[b]


    你们若还记念善，就请在实行这些事时也记念我，使我的热望和警醒都能结出一些善果。我恳求你们把这当作给我的恩惠。[c]


    那美好的器皿——身体——还与你们同在的时候，不要缺少这些事中的任何一样，反要不断查考，并履行每一条诫命，因为这些诫命配得如此看重。[d]


    正因如此，我越发热切地尽我所能写信给你们，好使你们喜乐。爱与和平的儿女们，愿你们安好！愿荣耀和一切恩典的主与你们的灵同在。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的赏赐也临近了”也可较直译为“主临近了，他的赏赐也是如此”。
    reason: 保留简略原句中第二分句的省略关系。
  - marker: b
    text: “被认可”较直译为“被发现”或“被显明”；这里没有明说被发现处于何种状态。
    reason: 标示审判语境中原表达的开放性，避免过度解释。
  - marker: c
    text: 部分英文见证在“这些事”处重复一次，可能是抄写或转录造成；正文按自然语意只译一次。
    reason: 说明所给见证的重复读法及正文处理。
  - marker: d
    text: “身体”是对“器皿”所作的解释性补明；“因为这些诫命配得如此看重”也可译作“因为它们是配得的”。
    reason: 区分比喻本身与见证中的解释，并保留末句代词所指及谓语含义的不确定性。
lexical_decisions:
- source_word: ordinances
  choice: 规例
  rationale: 兼顾规范性与可读性，避免一概译作“律法”而引入过窄的神学限定。
- source_word: recompense / reward
  choice: 报偿／赏赐
  rationale: 前者保留按行为所得回报的广义，后者对应末世语境中的主所带来的赏赐；不强行把两处词义完全等同。
- source_word: the Evil One
  choice: 那恶者
  rationale: 保留人格化表达及其可能指向，不径直增译为“魔鬼”。
- source_word: lawgivers
  choice: 立法者
  rationale: 保留原有强烈而不寻常的法律意象，虽较生硬，却不改写为较弱的“榜样”或“劝勉者”。
- source_word: vessel
  choice: 器皿
  rationale: 保留身体作为器皿的古代比喻，并用破折号呈现见证文本所补明的“身体”。
- source_word: be found
  choice: 被认可
  rationale: 在审判语境中表达经查验而蒙认可的含义，同时以脚注提示较形式对应的译法。
theological_decisions:
- issue: 复活与报偿的关系
  choice: “为此有复活，为此有报偿”
  alternative: “复活和报偿正是为这些事而设”
  rationale: 保留原文简短、含义紧张的因果陈述，不解释复活是否仅为报偿或审判。
- issue: “主临近”与“赏赐”的主语归属
  choice: “主临近了，他的赏赐也临近了”
  alternative: “主和他的赏赐都临近了”
  rationale: 保留赏赐属于主的关系，又避免补入赏赐对象或性质。
- issue: 审判之日“被找到”的含义
  choice: “被认可”并加脚注
  alternative: “被显明为完全／得救”
  rationale: 不把审判结果具体化为某一教义术语，保留原句未明说的判断内容。
- issue: 末世毁灭的范围
  choice: “一切都要与那恶者一同被毁灭”
  alternative: “一切邪恶都要连同那恶者被毁灭”
  rationale: 依据所给见证保留“everything”的宽广说法，不擅自限定为“一切邪恶”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。鉴于所给材料明确注明尚待希腊文／拉丁文直接复核，本稿以公共领域英文见证及其校订层为暂定依据；对异常重复、括注和可能的语义张力均予以标示，不声称已完成原语言定本级审校。
