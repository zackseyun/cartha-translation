  - severity: medium
    issue: 正文删除了英文见证中的“these things, these things”重复。
    rationale: 既然所供见证及英语POB审校轨迹保留重复，中文正文也应保留相应重复；仅以脚注说明而删除，会改变所审读法。
  - severity: low
    issue: “因为这些诫命配得如此看重”强化并限定了末句。
    rationale: “for they deserve it”中的代词指向及“值得”的具体补足并未明说；译文不宜加入“如此看重”的评价性措辞。
