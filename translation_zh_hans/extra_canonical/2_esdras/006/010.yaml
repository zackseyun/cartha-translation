lexical_decisions:
- source_word: aliud
  choice: 别的
  rationale: 直接表达“另外的事、别的事”，保留所问内容未明说的特点。
- source_word: noli querere
  choice: 不要再问
  rationale: 以自然的现代汉语表达否定命令；“再”承接上下文中已经进行的询问。
- source_word: dominator domine
  choice: 掌权的主啊
  rationale: 既保留 domine 的“主”，也明确呈现 dominator 所表达的统治、掌权含义，避免仅译作“主啊”而丢失一词。
- source_word: si inueni gratiam
  choice: 我若在你面前蒙了恩
  rationale: “蒙恩”是自然庄重的汉语表达，并将拉丁文关系性语境中隐含的对象明确为“在你面前”。
theological_decisions:
- issue: dominator domine 的神圣称谓
  choice: 掌权的主啊
  alternative: 至高主宰啊／主宰之主啊
  rationale: 采用透明且不带特定宗派色彩的译法，同时保留两个拉丁词所传达的称谓力度。
- issue: 未完条件句
  choice: 保留“我若在你面前蒙了恩”而不补足后文
  alternative: 补入请求内容使句子完整
  rationale: 拉丁文本在本节末停于条件从句，属于跨节延续；应保持原有节界和悬而未决的句法。
