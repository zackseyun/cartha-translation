  text: Therefore he sent me to show you all these things and to say to you, ‘Take courage and do not fear,
translation:
  language: zh_hans
  text: 因此，他差我来把这一切指示给你，并对你说：“要有勇气，不要害怕，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: 因此
  rationale: 表达前文原因所引出的结果，符合拉丁语因果衔接。
- source_word: misit me
  choice: 他差我来
  rationale: 保留差遣者与受差者的关系，并用自然的现代汉语表达。
- source_word: demonstrare tibi
  choice: 指示给你
  rationale: 既可涵盖展示，也可涵盖说明；此处保留启示性语境而不过度具体化。
- source_word: haec omnia
  choice: 这一切
  rationale: 自然对应原文，指向前述全部事项。
- source_word: confide
  choice: 要有勇气
  rationale: 在劝勉语境中表达信赖所带来的勇气；与后句“不要害怕”搭配自然。
- source_word: noli timere
  choice: 不要害怕
  rationale: 直接保留禁止恐惧的命令语气。
theological_decisions:
- issue: confide所表达的是信靠还是勇气
  choice: 要有勇气
  alternative: 要信靠
  rationale: 拉丁语confide可表达信赖、放心或鼓起勇气；与“不要害怕”并列时，“要有勇气”更自然，同时不额外指定信靠的对象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文未完的直接引语，以句末逗号表示经文在下一节继续。
