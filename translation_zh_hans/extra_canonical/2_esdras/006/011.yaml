translation:
  language: zh_hans
  text: 在你眼前[a]，好让你向你的仆人显明众征兆的终局。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作：“我回答说：‘主宰的主啊，若我在你眼前蒙恩，’”
    reason: previous_rendering
lexical_decisions:
- source_word: ante oculos tuos
  choice: 在你眼前
  rationale: 直译这一拉丁惯用语，并保留本节作为残句接续上文的形态。
- source_word: Vt demonstres
  choice: 好让你……显明
  rationale: 表达目的关系；“显明”符合启示文学语域，也准确传达 demonstres。
- source_word: seruo tuo
  choice: 你的仆人
  rationale: 忠实保留说话者在上帝面前的自称。
- source_word: finem signorum
  choice: 这些征兆的终局
  rationale: finis 在此可指终点、结局或最后阶段；“终局”保留末世语境的张力。“这些”使汉语表达自然，其指称承接上下文中的征兆。
theological_decisions:
- issue: finem signorum 的含义
  choice: 这些征兆的终局
  alternative: 这些征兆的终点／征兆的结局
  rationale: 不把它具体解释为某一征兆本身，也不预先断定是时间终点还是最终结果，从而保留原文可能的双重含义。
- issue: 残存拉丁文本与较长传统读法的关系
  choice: 正文仅翻译所给拉丁文本
  alternative: 在正文补入“我回答说：‘至高的主啊，如果我在你眼前蒙恩……’”
  rationale: 所给清理后的拉丁原文从 ante oculos tuos 开始；不把未见于该段所给文本的材料无标记地补入正文，而以脚注保存异读信息。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“显明”“仆人”“终局”保持启示文学的正式语体；正文有意保留残句性质，以对应现存来源文本。
