source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuum processit, et opus statim fiebat. Processit enim subito fructus multitudinis inmensus et concupiscentia gustus multiformis et flores colore inimitabiles et odores odoramentis inuestigabiles. die tertio haec facta sunt. Quarto autem die imperasti fieri solis splendorem, lunae lumen, stellarum dispositionem, Et imperasti eis ut deseruirent futuro plasmato
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/044.yaml
  text: For at once there came forth fruit in immeasurable abundance[a], and manifold delights of taste, and flowers of inimitable color, and scents of unsearchable fragrance. These things were made on the third day.
translation:
  language: zh_hans
  text: 因为顷刻之间便生出了多得无法计量的果实、各样可口的滋味[a]、色彩无可比拟的花朵，以及芬芳莫测的香气。这些事都是在第三日造成的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对各样滋味的欲求”。
    reason: 原文 concupiscentia gustus multiformis 形式上可指“对各样滋味的欲求”；但在创造植物的语境中，也可指各样令人喜悦、可口的滋味。
lexical_decisions:
- source_word: fructus multitudinis inmensus
  choice: 多得无法计量的果实
  rationale: 保留“果实”以及数量广大、不可衡量的意思，同时采用自然的现代汉语表达。
- source_word: concupiscentia gustus multiformis
  choice: 各样悦人口味的佳果
  rationale: 拉丁文直译近于“各样口味的欲求”，但上下文列举受造的植物产物，所表达的应是能引起食欲、滋味多样的悦人之物；译作“佳果”承接前面的果实，同时用脚注保留形式上的歧义。
- source_word: flores colore inimitabiles
  choice: 色彩无可比拟的花朵
  rationale: 准确传达花朵色彩无法仿效或媲美之意，汉语庄重而自然。
- source_word: odores odoramentis inuestigabiles
  choice: 芬芳莫测的香气
  rationale: 原文措辞有重复强调色彩，意为香气之奥妙难以探究；译文避免生硬重复，又保留不可测度的语气。
- source_word: die tertio haec facta sunt
  choice: 这些都是在第三日造成的
  rationale: “造成”贴合创造叙事中的 facta sunt，并清楚保留时间信息。
theological_decisions:
- issue: concupiscentia 是主观欲望还是受造物客观的可喜悦性
  choice: 正文译为“各样悦人口味的佳果”
  alternative: “对各样口味的欲求”
  rationale: 上下文描述第三日出现的果实、花朵和香气，采用客观可口、悦人的理解更符合语境；脚注仍保留较字面的另一种读法，不把歧义完全消除。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话；保持创造叙事的凝练节奏。脚注标记已置于正文对应位置。
