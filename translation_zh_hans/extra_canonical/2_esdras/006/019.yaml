  source_fidelity: 正文准确对应拉丁文“inquirere incipiam ab eis qui iniuste nocuerunt iniustitia sua, et”。“开始查问……的人”保留 inquirere 的调查／查问基本义；“以自己的不义伤害别人”恰当呈现 iniuste 与 iniustitia sua 的强调。末尾“并且……”如实反映 et 后句法未完，且没有误将下一节关于锡安的内容提前译入。
