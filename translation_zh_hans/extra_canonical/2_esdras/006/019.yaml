  text: and when I begin to inquire of those who have unjustly harmed others by their injustice[a], and
translation:
  language: zh_hans
  text: 当我开始查问那些以自己的不义伤害别人的人时[a]，并且……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我开始追究那些以自己的不义伤害别人的人时”。
    reason: 保留 inquirere 在此处可能含有审判、追责意味的译法。
lexical_decisions:
- source_word: inquirere
  choice: 查问
  rationale: 既保留“调查、询问”的基本含义，也不把司法性的“追究、要求交账”定为唯一解释。
- source_word: qui iniuste nocuerunt iniustitia sua
  choice: 那些以自己的不义伤害别人的人
  rationale: 保留原文“以不义行不义之害”的重复强调；“别人”是汉语中为补足 nocuerunt 隐含受害对象而作的自然表达。
- source_word: et
  choice: 并且……
  rationale: 原文在 et 处跨节未完，用省略号明确显示句子延续至下一节，避免把本节误作完整句。
theological_decisions:
- issue: inquirere 是否具有审判、追责含义
  choice: 正文译作“查问”
  alternative: “追究……的责任”或“要求……交账”
  rationale: 拉丁词可指调查、询问，也可在审判语境中指追查问责；正文采用较宽的表达，并用脚注保留较强的司法性理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留开头“当……时”所体现的从属结构，并以“并且……”反映拉丁原文在本节末尾尚未结束；未把属于下一节的“锡安受屈辱的日子满了”移入本节。
