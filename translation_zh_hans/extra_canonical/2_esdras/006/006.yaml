source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'consignarentur qui fidem thesaurizauerunt: Tunc cogitaui et facta sunt haec per me et non per alium, ut et finis per me et non per alium. Et respondi et dixi : quae erit separatio tem-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/006.yaml
  text: Then I considered, and these things were made through me and not through another, so also the end will be through me and not through another.”
translation:
  language: zh_hans
  text: 那时我思量，这些事便借着我、而不是借着别人造成；同样，终局也将借着我、而不是借着别人来到。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tunc cogitaui
  choice: 那时我思量
  rationale: 保留时间推进和第一人称的思考动作；“思量”庄重而仍属现代汉语，且不把未明说的宾语补入句中。
- source_word: facta sunt haec per me
  choice: 这些事便借着我……造成
  rationale: 以被动含义的“造成”对应 facta sunt，并用“借着我”保留 per me 的媒介性表达，避免改写成更强的“由我创造”。
- source_word: et non per alium
  choice: 而不是借着别人
  rationale: 直接保存反复出现的排他对比，并使前后两处措辞一致。
- source_word: ut et finis per me
  choice: 同样，终局也将借着我……来到
  rationale: “同样……也”自然表达 ut et 的对应关系；finis 译作“终局”，保留其可指终结或末后结局的宽度。“来到”是为汉语完整性所作的最少补足。
theological_decisions:
- issue: “借着我”是否应解释为“由我创造／成就”
  choice: 保留“借着我”
  alternative: 译为“由我造成”或“由我成就”
  rationale: 拉丁文两次使用 per me，具有媒介或施事表达上的张力；译文不把它系统化为特定的创造论表述。
- issue: finis 的具体所指
  choice: 终局
  alternative: 终结、末日
  rationale: “终局”既可表示历史或受造秩序的结局，又不强行限定为某一特定末世事件。
translation_notes:
  register: 采用现代、庄重且可朗读的叙事语言。重复“借着我、而不是借着别人”以体现原文的修辞平行；不纳入本节边界之外紧接的问答残句。
