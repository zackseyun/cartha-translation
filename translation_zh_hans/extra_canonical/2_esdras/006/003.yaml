  text: 乐园的根基；在美丽的花朵尚未被看见以前，在诸运动的力量尚未被确立以前，又在……以前，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fundamenta paradisi
  choice: 乐园的根基
  rationale: 按拉丁文直译，并保留其作为前一分句末尾残片的性质。
- source_word: uiderentur decores flores
  choice: 美丽的花朵显现
  rationale: uiderentur 字面为“被看见”，在创造次序的语境中自然表达为“显现”，不改变花朵开始可见的基本含义。
- source_word: motus uirtutes
  choice: 各种运动的力量
  rationale: motus 可作属格单数或主格复数理解；与复数 uirtutes 连用时，“运动的力量”最直接保留拉丁文本的措辞及其不确定性。
- source_word: confirmarentur
  choice: 被确立
  rationale: 保留被动语态及“使稳固、确立”的含义。
theological_decisions:
- issue: motus 是否特指地震
  choice: 正文采用“各种运动的力量”
  alternative: 地震的威力
  rationale: 拉丁文 motus 本身可泛指运动、震动，也可能在启示文学语境中特指地震；正文不把这种可能性无根据地固定为单一解释，脚注提示另一译法。
translation_notes:
