lexical_decisions:
- source_word: tuorum
  choice: 你的那些征兆
  rationale: 本节开头承接上一节的 signorum（征兆）；拉丁文仅保留属格代词“你的那些”，中文为避免残缺难解，补出所指名词。
- source_word: ex parte
  choice: 其中一部分
  rationale: 直接表达部分而非全部，保留原文含义。
- source_word: nocte praeterita
  choice: 在前一夜
  rationale: 自然对应“previous night”，指此前一夜。
- source_word: surge super pedes tuos
  choice: 你站起来
  rationale: 采用现代汉语自然表达；其字面意象是“站在你的脚上”。
- source_word: audies
  choice: 就必听见
  rationale: 保留将来时语气，同时不擅自补出将要听见的内容。
