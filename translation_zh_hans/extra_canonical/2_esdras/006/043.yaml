  text: 因为你的话一发出，事就立刻成了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现提供的拉丁底本在本节仅存开头“Verbum enim”（“因为［你的］话……”）；本句其余部分依据英语 POB 审校轨迹所引的续文译出。
    reason: 准确标明拉丁片段的存留范围，并说明译文续文的实际依据。
lexical_decisions:
- source_word: Verbum
  choice: 你的话
  rationale: 依照上下文把拉丁语“话／言语”表达为对上帝所说的“你的话”，既自然，也保留借言语成事的意象。
- source_word: went forth（据校勘咨询层所保存的续文）
  choice: 一发出
  rationale: 用现代汉语简洁表达命令发出并立即生效；“一……就……”也与后半句的即时性相呼应。
- source_word: the work was immediately done（据校勘咨询层所保存的续文）
  choice: 事就立刻成了
  rationale: “事成了”比“工作被完成”更符合庄重自然的汉语，同时不额外限定这是某一项具体工程。
theological_decisions:
- issue: 上帝话语与受造之工之间的关系
  choice: 保留“话一发出，事就成了”的直接因果次序
  alternative: 解释为上帝经过某种过程完成创造
  rationale: 经文强调话语发出与事情完成之间的即时联系；译文不添加机制性的神学解释。
translation_notes:
  register: 采用现代、简洁而庄重的叙述语体。“因为”承接上文；“一发出……就立刻成了”清楚传达迅速成就的语势。
