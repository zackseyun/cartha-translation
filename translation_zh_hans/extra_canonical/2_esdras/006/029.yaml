  yaml_path: translation/extra_canonical/2_esdras/006/029.yaml
  text: 'And it happened[a], while he was speaking to me, behold, the place on which I was standing was gradually moving. And he said to me:'
translation:
  language: zh_hans
  text: 当他正对我说话时，看哪，我所站的地方渐渐移动起来[a]。他对我说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“渐渐震动起来”。
    reason: 拉丁语 mouebatur 可泛指“移动”，也可在此语境中理解为“震动”；原文未进一步限定运动方式。
lexical_decisions:
- source_word: Et factum est cum loqueretur mihi
  choice: 他正对我说话的时候
  rationale: 拉丁语是叙事承接结构；汉语无需机械译出“事情发生了”，用时间从句自然表达其功能。
- source_word: ecce
  choice: 看哪
  rationale: 保留原文引人注意、标示突发异象的语气。
- source_word: paulatim mouebatur
  choice: 渐渐震动起来
  rationale: paulatim 表示逐渐发生；mouebatur 可泛指移动或受震动。结合地点在人脚下发生运动的语境，正文采用自然的“震动起来”，并在脚注保留较中性的“移动”可能。
- source_word: locus super quem stabam
  choice: 我所站的地方
  rationale: 准确而自然地表达关系从句，无需照搬拉丁语介词结构。
- source_word: Et dixit ad me
  choice: 他对我说
  rationale: 完整保留本节末尾引出下文直接引语的句子。
