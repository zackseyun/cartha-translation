source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos autem populus tuus quem vocasti primogenitum, unigenitum, aemulatorem, carissimum, traditi sumus in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/058.yaml
  text: But we[a], your people, whom you have called your firstborn, your only one, your beloved, your dear one[b], have been handed over into their hands.
translation:
  language: zh_hans
  text: 但我们，就是你的子民，是你称为长子、独子、你所妒爱的人[a]、至爱之人的，如今却被交在他们手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所妒爱的人”所译的拉丁词含义艰深，也可理解为“热心者”或“与你争竞者”。本句连续列出以色列所得的盟约尊称，并未把它们化约为一个顺畅的概称。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被交付到他们手中”。
    reason: translation_alternative
lexical_decisions:
- source_word: primogenitum
  choice: 长子
  rationale: 保留盟约性称号及其家庭隐喻，对应“首先出生的”。
- source_word: unigenitum
  choice: 独子
  rationale: 直译“唯一所生的”，与前面的“长子”并列，不消解原文称号之间的张力。
- source_word: aemulatorem
  choice: 你所妒爱的人
  rationale: 该词含义艰深，可涉及热忱、竞争或妒爱；此处采用关系性表达，既与一连串盟约尊称相合，也避免简单译成与 carissimum 重复的“爱子”。
- source_word: carissimum
  choice: 至爱之人
  rationale: 表达最高程度的珍爱，并与 aemulatorem 区分。
- source_word: traditi sumus in manibus eorum
  choice: 被交在他们手中
  rationale: tradere 比一般的“给予”更有交付、交出的意味；中文“交在……手中”也保留原文的惯用意象。
theological_decisions:
- issue: 以色列的一连串盟约尊称
  choice: 逐项保留“长子、独子、你所妒爱的人、至爱之人”
  alternative: 将这些称号意译为概括性的“你最珍爱的选民”
  rationale: 原文刻意堆叠彼此带有张力的尊称；逐项保留可呈现祈祷者所强调的盟约身份与当前遭遇之间的反差。
- issue: aemulatorem 的神学关系指向
  choice: 译为“你所妒爱的人”并加注说明
  alternative: “热心者”或“与你争竞者”
  rationale: 拉丁词本身多义，语境不足以完全确定主动的“热心”还是关系性的“妒爱”；正文作合乎盟约语境的译法，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但……如今却……”凸显尊荣身份与被交敌手之间的反差；保留四个并列称号及“在他们手中”的原文意象。
