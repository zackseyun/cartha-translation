review_pass:
  verdict: revise
  source_fidelity: 原文以四个并列宾格称号说明“你所称为的”子民：primogenitum、unigenitum、aemulatorem、carissimum。草稿将 aemulatorem 译为“你所妒爱的人”，把该词改成神对以色列的关系性行为，缺少拉丁语依据，也使称号结构不够清晰。traditi sumus in manibus eorum 译为“被交在他们手中”准确保留了被交付给敌手的意味。
  naturalness: 草稿整体庄重，但“是你称为……的人”与“你所妒爱的人”嵌套，句法较滞涩。以破折号标出同位说明，并把四项统一为名词性称号，现代汉语更自然，也更容易辨认原文的列举。
  terminology: “长子”“独子”可保留。“热心者”是 aemulatorem 在此盟约称号串列中的较稳妥正文译法；该拉丁词有语义困难，脚注应保留“妒爱者／争竞者”等可能，而不把不确定的关系性释义写入正文。“至爱者”对应 carissimum，并与前项区别。
  issues:
  - severity: medium
    issue: aemulatorem 被译为“你所妒爱的人”
    rationale: aemulatorem 是与其他称号并列的阳性宾格名词，不是“神妒爱某人”的关系从句。此译法改变了语法关系，并过早确定了有争议的词义。
  - severity: low
    issue: 四个称号的并列结构不够明确
    rationale: 将各项统一处理为“你称为你的……的”称号，并以破折号隔开同位语，可更忠实呈现原文的修辞堆叠。
  revised_text: 但我们——你的子民，就是你称为你的长子、独子、热心者[a]和至爱者的——却被交在他们手中[b]。
  revised_footnotes:
  - marker: a
    text: “热心者”所译的拉丁词含义艰深，也可理解为“妒爱者”或“争竞者”。本句连续列出以色列所得的盟约尊称，并未把它们化约为一个顺畅的概称。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被交付到他们手中”。
    reason: translation_alternative
  revision_rationale: 修订将 aemulatorem 作为并列的称号译为“热心者”，避免把语义不确定的名词改写为“你所妒爱的人”的关系性解释；脚注保留其竞争、妒爱等语义可能。其余称号及“被交在他们手中”的交付意象均予保留，并调整句法以清晰呈现原文四重称号的列举。
