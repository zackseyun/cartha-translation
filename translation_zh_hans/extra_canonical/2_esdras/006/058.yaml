review_pass:
  verdict: revise
  source_fidelity: 原文的四重称号及“被交在他们手中”的被动交付意象均应保留。草案将 aemulatorem 译作“你所妒爱的人”，把本可指“热心者／竞争者”的名词改造成上帝“妒爱”的关系性表达；这并非拉丁文自然或可确证的含义，且中文搭配不当。
  naturalness: 草案主句层层嵌套，尤其“是你称为……之人的”不够自然。“但我们——你的子民，就是你称为……的——已被交在他们手中”既庄重又清晰。
  terminology: “长子”“独子”可保留。aemulatorem 宜暂译为“热心者”，并以脚注保留“竞争者”等不确定性；carissimum 译为“至爱者”，以维持称号并列和庄重语体。traditi sumus 应译“被交在……手中”或“被交付到……手中”，不可弱化为一般的“给”。
  issues:
  - severity: high
    issue: aemulatorem 被译为“你所妒爱的人”
    rationale: aemulator 的基本语义涉及热心、效法、竞争或对抗；“妒爱”并非该拉丁词在此可安全确立的意思，并将并列称号不必要地改写为神对人的情感关系。
  - severity: medium
    issue: 正文句法“是你称为……之人的”生硬且指代负担过重
    rationale: 应使“你的子民”与“你称为……的”之间的同位关系更清晰，避免现代汉语中不自然的多层“是……的”。
  - severity: low
    issue: 脚注 a 的“妒爱”解释预设了不稳妥的正文释义
    rationale: 注释应说明术语困难，并列出“热心者”“竞争者”等可行理解，而不将“妒爱”作为首选。
  revised_text: 但我们——你的子民，就是你称为你的长子、独子、热心者[a]、至爱者的——已被交在他们手中[b]。
  revised_footnotes:
  - marker: a
    text: “热心者”所译的拉丁词含义艰深，也可理解为“竞争者”或“效法者”。本句连续列出以色列所得的盟约尊称，并未把它们化约为一个顺畅的概称。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被交付到他们手中”。
    reason: translation_alternative
  revision_rationale: 修订逐项保留 primogenitum、unigenitum、aemulatorem、carissimum 四个称号，并以较中性的“热心者”暂译难词 aemulatorem，借脚注保存其语义不确定性。主句改为现代汉语中清楚自然的插入同位结构；“已被交在他们手中”则对应 traditi sumus in manibus eorum 所含的交出、落入敌手之意。
