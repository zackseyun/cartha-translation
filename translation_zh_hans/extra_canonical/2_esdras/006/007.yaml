  text: Then I answered and said[a], “What will be the dividing of the times? Or when will be the end of the former and the beginning of the one that follows?”
translation:
  language: zh_hans
  text: 于是我回答说：“这些时期将怎样划分？或者，前一个时期何时终结，后一个时期何时开始？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: separatio temporum（据上下文复原；所给片段仅存 porum）
  choice: 这些时期将以什么为分界
  rationale: “separatio”表示分开、划分或分界；用“以什么为分界”既符合现代汉语，也保留询问两个时期如何划分的含义。
- source_word: prioris finis
  choice: 前一个时期何时结束
  rationale: prioris 是省略中心词的属格形式，与 temporum 的语境相承，指前一个时期；补出“时期”可使中文明确自然。
- source_word: sequentis initium
  choice: 后一个时期何时开始
  rationale: sequentis 与 prioris 平行，指随后的时期；译作“后一个时期”保留两者的对称关系，不额外界定其神学所指。
- source_word: aut ... aut
  choice: ……？……何时……，……何时……？
  rationale: 拉丁语在此衔接两个相关疑问。中文不机械重复“或”，而以连续问句表达，意义清楚且庄重自然。
theological_decisions:
- issue: prioris 与 sequentis 所指的时期
  choice: 译为“前一个时期”和“后一个时期”
  alternative: 明确译为“今世”和“来世”
  rationale: 原文只用“前一个”和“随后的”作对称表达，并未在本节明说“今世/来世”；不将可能的末世论解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与问句。“我回答说”保留经文叙事公式；正文不加脚注，因为原文的平行结构可在中文中直接清楚表达。所给拉丁文本开头残缺为“porum”，译文结合可辨认的 temporum 词尾、经文结构及审校层所保存的完整句意处理。
