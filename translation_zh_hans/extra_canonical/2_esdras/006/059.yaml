  text: et si propter nos creatum est saeculum, quare non hereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/059.yaml
  text: And if the world was created for our sake, why do we not possess our world as an inheritance? How long will this be?”
translation:
  language: zh_hans
  text: 如果世界是为我们而造的，为什么我们还没有承受我们自己的世界为产业呢？这种情形要到几时呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: 世代
  rationale: 拉丁词在本节两次出现，兼有“世界/时代”的语义空间；译作“世代”可保留其时间性与末世语境，并保持两处用词一致。
- source_word: hereditatem possidemus
  choice: 承受……为产业
  rationale: 体现 hereditatem 的继承、产业含义及 possidemus 的实际占有意味，采用现代中文圣经语体中自然而庄重的表达。
- source_word: propter nos
  choice: 为我们
  rationale: 直接表达“为了我们的缘故”，不额外限定受益、目的或创造秩序的神学含义。
- source_word: usquequo haec
  choice: 这种情形要到几时呢
  rationale: haec 字面为“这些事”，在此指前述未能承受产业的现状；以自然中文呈现，同时保留哀问语气。
theological_decisions:
- issue: saeculum 的空间性与时间性
  choice: 两处均译为“世代”
  alternative: 两处均译为“世界”，或分别译为“世界”和“世代”
  rationale: 原文重复同一词，应尽量保留词语呼应；“世代”更能呈现本段对当前时代与将来产业的末世张力，但不将其明确解释为某一特定神学体系。
- issue: nostrum saeculum 的归属意味
  choice: 属于我们的世代
  alternative: 我们的世界
  rationale: 保留 nostrum 的归属强调，却不把它扩展解释为已经拥有或仅指将来的新世界。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话；保留连续反问和末世性的张力，不添加原文没有的主语、时间限定或教派性解释。
