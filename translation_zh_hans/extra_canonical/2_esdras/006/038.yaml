base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/038.yaml
  text: And I said[a], “O Lord, from the beginning of creation, on the first day, you spoke, saying, ‘Let heaven and earth be made,’ and your word accomplished the work.”
translation:
  language: zh_hans
  text: 于是我说[a]：“主啊，从创造之初、在第一日，你确曾说：‘要有天地。’你的话就完成了这工作。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你说”。
    reason: 保留英语审校轨迹中附于“我说”的替代读法信息。
lexical_decisions:
- source_word: loquens locutus es
  choice: 你曾发言说
  rationale: 拉丁文以分词和限定动词叠用，带有强调色彩；中文用“发言说”保留言说动作的郑重与轻微强化，同时避免生硬重复“说了又说”。
- source_word: fiat caelum et terra
  choice: 要有天地
  rationale: fiat 是第三人称祈使/愿望式；在创造命令的语境中，“要有”比“愿天地被造”更自然庄重，也不额外指定创造过程。
- source_word: tuum verbum
  choice: 你的话
  rationale: verbum 在此直接指上主所说的话；译作“你的话”自然且避免把它预先解释为特定神学位格。
- source_word: opus perfecit
  choice: 完成了这工
  rationale: 保留 perficere 的完成含义；“这工”承接前述天地受造之事，符合庄重的现代汉语表达。
theological_decisions:
- issue: “你的话”是否人格化
  choice: 保留为“你的话”
  alternative: “你的道”
  rationale: 原文虽可能容许人格化理解，但本句也可单纯指上主的命令；“你的话”保存这种开放性，不把后期神学含义强加于文本。
- issue: 天地形成命令的语态
  choice: “要有天地”
  alternative: “愿天地被造”
  rationale: 拉丁文 fiat 可表达“使之成为/让其形成”；中文创造叙事惯用的命令式既准确又自然，但不进一步说明天地如何被造。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在创造之初，第一日”依原文次序保留两个时间限定语；以“便”清楚表现上主发言与工程完成之间的紧密关系。
