  yaml_path: translation/extra_canonical/2_esdras/006/056.yaml
  text: But the rest of the nations, which have come from Adam, you said are nothing, and that they are like spittle; and you compared their abundance to a drop from a vessel.
translation:
  language: zh_hans
  text: 至于其余从亚当而生的各国，你曾说他们算不得什么，又说他们如同唾沫；你把他们的丰盛比作从器皿滴下的一滴水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: residuas autem gentes
  choice: 至于其余……各国
  rationale: 保留 autem 的转折兼承接作用，并将 gentes 按上下文译为“各国”，自然且庄重。
- source_word: ab Adam natas
  choice: 从亚当而生的
  rationale: 贴近拉丁文 natas 的出生、衍生之意，不额外解释族群关系。
- source_word: nihil esse
  choice: 算不得什么
  rationale: 传达“被视为无足轻重、等于无物”的语气，比直译“什么也不是”更符合现代汉语。
- source_word: salivae adsimilatae sunt
  choice: 好像唾沫
  rationale: 直接保留原文强烈而卑微的比喻，不作缓和。
- source_word: stillicidium de vaso
  choice: 器皿滴下的一滴水
  rationale: stillicidium 指滴落之物或水滴；补出“水”使汉语意象清楚，同时保留 de vaso 的来源。
- source_word: abundantiam eorum
  choice: 他们人数众多
  rationale: 此处 abundantia 指众民族人口之多，译出语境所指，避免生硬的“他们的丰盛”。
theological_decisions:
- issue: 其余各国被说成“算不得什么”的评价归属
  choice: 保留“你曾说”作为引述框架
  alternative: 直接陈述各国算不得什么
  rationale: 原文 dixisti 明确表明这是说话者引用上帝先前的话；保留归属可避免把评价变成叙述者未经限定的断言。
- issue: “唾沫”与“一滴水”的贬抑性比喻
  choice: 原样保留两个比喻
  alternative: 弱化为“微不足道”
  rationale: 原文以具体且强烈的形象表达万国之微小，不应因神学或文体顾虑而淡化。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；保留原文的排比结构和尖锐比喻。“器皿”比“容器”更符合经文语域，但仍为现代读者所熟悉。
