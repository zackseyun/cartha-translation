source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quando suppleta fuerit humilitas Sion, Et cum supersignabitur saeculum quod incipiet pertransire, haec signa faciam: libri aperientur ante faciem firmamenti, et omnes uidebunt simul,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/020.yaml
  text: 'when the humiliation of Zion is completed[a], and when the age that is beginning to pass away is marked out, I will perform these signs: the books will be opened before the face of the firmament, and all will see together.'
translation:
  language: zh_hans
  text: 当锡安所受的屈辱满了，那个开始消逝的世代被作上记号[a]时，我必施行这些征兆：书卷将在穹苍面前展开，众人必一同看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被作上记号”也可译作“被封印”；拉丁词含有在上面加印记的意思。
    reason: 保留 supersignabitur 在“加记号”与“封印”之间的词义幅度。
lexical_decisions:
- source_word: suppleta fuerit humilitas Sion
  choice: 锡安所受的屈辱满了
  rationale: suppleta 表示达到满数或完成；humilitas 在此末世语境中指锡安遭受的卑抑、屈辱。译作“所受的屈辱满了”既保留被动受苦的意味，也符合现代汉语表达。
- source_word: supersignabitur
  choice: 被标定
  rationale: 该词为将来时被动式，核心意象是在某物之上加上记号。“被标定”保留标记及界定之意，同时不把含义过度限定为封印。
- source_word: saeculum
  choice: 世代
  rationale: 此处指当前正在走向终结的时代或世代；“世代”能保留其时间秩序与末世含义。
- source_word: faciam haec signa
  choice: 我必行这些征兆
  rationale: faciam 是“做、施行”，而不是单纯“显示”；“行这些征兆”忠实而自然。
- source_word: libri aperientur
  choice: 书卷将……展开
  rationale: 启示文学语境中的 libri 指受审判时展开的书卷；“展开”比用于现代装订书的“打开”更合乎古代卷轴意象。
- source_word: ante faciem firmamenti
  choice: 在穹苍面前
  rationale: 保留原文带有拟人色彩的 faciem（面前）及 firmamentum（穹苍），不改释为较笼统的“天空中”。
- source_word: omnes uidebunt simul
  choice: 众人必一同看见
  rationale: simul 可指同时或一同；“一同”自然地保留共同且同时目睹的含义。
theological_decisions:
- issue: supersignabitur 所表达的末世动作
  choice: 正文译作“被标定”
  alternative: “被封印”
  rationale: 原词可以唤起加印或封印的意象，但并不必然专指封闭性的“封印”。正文采用较宽的“被标定”，脚注保留另一种可能。
- issue: “书卷”的身份
  choice: 不在正文中说明书卷的具体内容
  alternative: 明确译为审判册或生命册
  rationale: 原文只说 libri，没有界定这些书卷为何种册卷；为保存启示文学中的张力，不作教义性补充。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“屈辱满了”“行这些征兆”“穹苍面前”等表达保留启示文学的庄严意象；句法略作汉语化处理，但维持原文各分句的次序和末世张力。
