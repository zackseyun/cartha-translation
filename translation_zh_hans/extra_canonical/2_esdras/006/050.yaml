  text: the name of the second you called Leviathan. And you separated them from each other[a], for the seventh part where the water had been gathered could not hold them.
translation:
  language: zh_hans
  text: 你给第二个起名为利维坦。你又将它们彼此分开[a]，因为水聚集在其中的第七部分容纳不下它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“你又将它们彼此分开，因为水聚集在其中的第七部分容纳不下它们两个。”
    reason: 说明末句复数代词在上下文中可明确理解为两个受造物，同时正文不补出拉丁文未明说的“两个”。
lexical_decisions:
- source_word: nomen secundi uocasti Leuiathan
  choice: 你把第二个命名为利维坦
  rationale: 按拉丁文保留“第二个”的次序指称，并以现代汉语自然表达“称其名为”。
- source_word: separasti ea ab alterutro
  choice: 你又把它们彼此分开
  rationale: ea为中性复数，承接前文两个受造物；ab alterutro表达相互分离。
- source_word: septima pars ubi erat aqua congregata
  choice: 水所聚集的第七部分
  rationale: 贴近原文关系结构，不额外解释这里的“第七部分”所指为何。
- source_word: capere
  choice: 容纳不下
  rationale: 在空间承载语境中译为“容纳”，并结合non表达不能容纳。
theological_decisions:
- issue: 末句是否明确补出“两个都”
  choice: 正文不补“两个都”
  alternative: 容纳不下它们两个
  rationale: 拉丁文只有复数代词ea，没有明说“两者都”；正文保留原文简约表达，脚注提示可理解为二者不能同处。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；“利维坦”使用通行音译。保留原文的节界与指代，不把前句并入上一节，也不在正文中补入原文未明说的“两者都”。
