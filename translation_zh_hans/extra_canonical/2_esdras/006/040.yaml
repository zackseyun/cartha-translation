  text: Then you commanded that light should be brought forth from your treasuries, so that your works might then appear.
translation:
  language: zh_hans
  text: 那时，你吩咐从你的宝库中取出光来，使你的作为在那时显现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tunc
  choice: 那时
  rationale: 保留时间推进语气；末句另一处 tunc 在汉语中不必重复，以免生硬，其含义由句式自然承载。
- source_word: dixisti
  choice: 你吩咐
  rationale: 在创造语境中表达以言语发令；比单纯的“你说”更能传达后接不定式结构的命令含义。
- source_word: de thesauris tuis
  choice: 从你的宝库中
  rationale: 直译复数 thesauris 的集合意象；现代汉语“宝库”可作集合名词，无须机械标出复数。
- source_word: proferri lumen
  choice: 取出光来
  rationale: 保留 proferri 的被动/使役意味及光从宝库中被带出的空间意象，同时采用自然汉语表达。
- source_word: opera tua
  choice: 你的作为
  rationale: opera 可指所做之工或作品；“作为”保留行动与成果之间的开放性。
- source_word: apparerent
  choice: 显现
  rationale: 表达从不可见到可见、出现的含义，不额外解释这些作为的性质。
theological_decisions:
- issue: 光的来源与创造方式
  choice: 从你的宝库中取出光来
  alternative: 使光从你的宝库中发出
  rationale: 拉丁文 de thesauris 与 proferri 描绘光被从宝库带出；采用“取出”保留这一古代宇宙论意象，不将其改写为无中生有或一般性的发光。
- issue: opera tua 的所指
  choice: 你的作为
  alternative: 你的工程／你所造的万物
  rationale: 原文没有明确限定为受造物或具体工程，因此保留概括性，避免加入神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。译文贴近拉丁文本，同时避免逐词硬译；不添加原文没有的“某种”来限定“光”。
