  source_fidelity: 原译“吩咐人”补入了拉丁文未明示的执行者；dixisti ... proferri lumen 只表达你下令／吩咐把光带出。末句的第二个 tunc 也应在译文中保留。修订后保留光由“你的宝库”被带出的意象，以及 opera tua 的开放所指。
  naturalness: “你吩咐从你的宝库中取出光来”是现代汉语中自然的无指明执行者的命令表达，避免为被动结构强加施事者；“使你的作为在那时显现”庄重而通顺。
  terminology: “宝库”恰当对应 thesauris；“光”“作为”“显现”均保留原文的概括性和叙事／祷告式庄重语体。
