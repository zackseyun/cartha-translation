lexical_decisions:
- source_word: imperasti
  choice: 吩咐
  rationale: 准确表达带有权威的命令，在现代汉语经文语体中自然庄重。
- source_word: eis
  choice: 它们
  rationale: 所指对象为非人的受造物，按本节上下文使用“它们”。
- source_word: deservirent
  choice: 服侍
  rationale: 表达为某对象效力、服务的含义，同时保留原文的从属意味。
- source_word: futuro plasmato homini
  choice: 那将要被造的人
  rationale: 保留未来意味，并用“被造”传达 plasmato 所指的塑造、造成；避免将其具体化为原文未明说的专名。
theological_decisions:
- issue: “人”是否应明确译作亚当或人类
  choice: 保留为“人”
  alternative: “亚当”或“人类”
  rationale: 拉丁文仅作 homini；虽语境可能指最初受造的人，但不应在正文中消除这一指称范围上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；句式贴近原文，同时避免生硬的拉丁语序。
