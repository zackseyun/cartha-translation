- source_word: haec
  choice: 这些事
  rationale: 保留中性复数所概括的内容，不擅自具体化。
- source_word: veni tibi ostendere
  choice: 我来，是要……指示给你
  rationale: 既体现 veni 的到来，也保留 ostendere 的启示、展示意味。
- source_word: venturae nocti
  choice: 在今夜
  rationale: 依上下文及公认的文本校勘，理解为 hac ventura nocte（在这将临的夜晚）；现代汉语用“今夜”最自然。
