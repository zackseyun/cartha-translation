  text: And it happened on the eighth night that my heart was troubled again within me, and I began to speak before the Most High.
translation:
  language: zh_hans
  text: 到了第八个夜晚，我心中又起了烦乱，便开始在至高者面前说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est in octava nocte
  choice: 到了第八夜
  rationale: 以自然的现代汉语表达时间推进；拉丁语叙事公式 et factum est 无须机械译作“事情发生了”。
- source_word: cor meum iterato turbabatur in me
  choice: 我心里再次烦乱
  rationale: 保留 cor 的内在情感含义和 iterato 的重复意味；“烦乱”可涵盖不安、困扰而不过度限定具体情绪。
- source_word: coepi loqui coram Altissimo
  choice: 就开始在至高者面前说话
  rationale: “开始说话”对应 coepi loqui，“在……面前”直译 coram，并保留 Altissimus 的传统尊称“至高者”。
theological_decisions:
- issue: coram Altissimo 所表达的关系
  choice: 在至高者面前说话
  alternative: 向至高者祷告
  rationale: 原文只明确说“在至高者面前说话”，没有使用“祷告”一词；直译可避免把行为的性质解释得过窄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，句式简洁，保留第一人称叙事及原文的内心动荡感。
