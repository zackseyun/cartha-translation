  yaml_path: translation/extra_canonical/2_esdras/006/052.yaml
  text: but Leviathan you gave the moist seventh part, and you have kept it to be food for whom you wish and when you wish.
translation:
  language: zh_hans
  text: 至于利维坦，你把湿润的第七部分赐给了它；又把它们保留下来，在你愿意的时候，成为你所愿意之人的食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们”对应拉丁文复数代词，最自然地指上下文中的贝希摩斯和利维坦两只巨兽；有些文本传统或译法则将此处理解为单指其中之一。
    reason: 保留拉丁文复数形式及其上下文所指，同时不把传本和解释上的歧义绝对化。
lexical_decisions:
- source_word: Leuiathan
  choice: 利维坦
  rationale: 采用现代中文中通行的音译，保留这一受造巨兽的专名性质。
- source_word: septimam partem humidam
  choice: 湿润的第七部分
  rationale: 依照拉丁文的修饰关系直译，不擅自将“部分”解释为“海洋”或“水域”，从而保留原文的宇宙分区表达。
- source_word: seruasti
  choice: 留存下来
  rationale: 表达有意保留、存留以待特定用途的含义，语气自然且庄重。
- source_word: ut fiant in [escam]
  choice: 使它……成为……食物
  rationale: 结合残篇续文及审校用英文所保存的完整句意译出目的关系；中文采用“成为食物”的自然表达。
theological_decisions:
- issue: “ea”的所指
  choice: 译作单数“它”，在语法上承接“湿润的第七部分”
  alternative: 译作复数“它们”，指利维坦和贝希摩斯，或译作单数并专指利维坦
  rationale: 所给拉丁文为“ea”，可与阴性单数“partem”呼应；因此正文保留单数，并用脚注说明上下文可能引出的另一种理解，不强行消除歧义。
- issue: 食物的受益者与时间由上帝意愿决定
  choice: “在你愿意的时候，成为你所愿意之人的食物”
  alternative: “在你愿意的时候，给你愿意的人吞吃”
  rationale: 前者紧贴审校层所反映的句法，同时避免把“食物”强化为特定的末世性吞吃场景。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“至于”承接本节前半关于另一巨兽及其居所的对比；分号呈现赐予居所与留存作食物两个相连动作。
