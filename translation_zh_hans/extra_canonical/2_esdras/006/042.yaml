  text: et tertio die imperasti aquis congregari in septima parte terrae, sex vero partes siccasti et conservasti, ut ex his sint coram te ministrantia seminata adeo et culta.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/042.yaml
  text: And on the third day you commanded the waters to be gathered into the seventh part of the earth, but six parts you dried up and preserved, so that from these there might be before you things sown and cultivated, serving you.
translation:
  language: zh_hans
  text: 第三日，你命令众水聚集到大地的七分之一，却使其余六分干涸，并将它们保全，使其中所播种和耕作之物可以在你面前服侍你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in septima parte terrae
  choice: 到大地的七分之一
  rationale: 这里表示众水被聚集到占大地七分之一的区域；“到”自然传达聚集所指向的范围。
- source_word: sex vero partes siccasti et conservasti
  choice: 却使其余六分干涸，并把它们保存下来
  rationale: “其余”根据七分之一与六分的对照自然补明；“保存下来”保留 conservasti 的明确含义，不将其弱化为单纯留下。
- source_word: seminata adeo et culta
  choice: 播种和耕作之物
  rationale: 拉丁文形式及句法略显生硬，整体指由播种、耕作而产生或形成的事物；采用名词化表达，保留其概括性，不擅自限定为庄稼或田地。
- source_word: coram te ministrantia
  choice: 侍立在你面前，为你效劳
  rationale: ministrantia 有服侍、供役之意，coram te 表示在你面前；拆为两个协调短语，使现代汉语顺畅，同时保留敬奉与服务的意象。
theological_decisions:
- issue: 受造土地及其出产“服侍”上帝的拟人表达
  choice: 保留“侍立在你面前，为你效劳”
  alternative: 译作“供你使用”或“在你面前生长”
  rationale: 原文明确使用 ministrantia，具有服侍的拟人色彩；不宜把这一神学诗性意象消解为纯功用性语言。
- issue: 六分土地被“保存”的目的关系
  choice: 将目的译为“好让其中有……”
  alternative: 译为“因此其中有……”
  rationale: ut 引出目的或结果；此处创造命令的语境较适合目的表达，但仍以“好让”保留目的与预期结果之间的自然张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“众水”“侍立在你面前”保留经文语体；句法则作适度调整，避免照搬拉丁语造成晦涩。
