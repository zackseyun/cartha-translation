  yaml_path: translation/extra_canonical/2_esdras/006/028.yaml
  text: and the truth, which has been fruitless for so long, will be revealed.”
translation:
  language: zh_hans
  text: 长久以来未曾结果的真理，将显明出来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendebitur
  choice: 将显明出来
  rationale: 准确表达拉丁语将来时被动形式，兼顾“被显出、被揭示”的含义；“显明出来”在现代汉语中自然庄重。
- source_word: ueritas
  choice: 真理
  rationale: 对应 veritas；在本节末世启示的语境中，“真理”比“真实”更符合名词所指，同时不额外限定其神学内容。
- source_word: sine fructu fuit
  choice: 未曾结果
  rationale: 保留“果实/结果”的原文意象，也表达此前长期没有产生可见成效或成果的状态，避免用“毫无用处”过度解释。
- source_word: tantis temporibus
  choice: 长久以来
  rationale: 自然表达持续了如此长时间的意思；较逐字的“如此多的时期”更符合现代汉语习惯。
theological_decisions:
- issue: “真理未曾结果”的含义
  choice: 保留结果意象，不说明真理为何或怎样未结果
  alternative: 译作“长期没有发挥作用的真理”或“长期徒然的真理”
  rationale: 原文只说真理长期 sine fructu，并未明确是无人接受、未被实行，还是尚未显出成效；保留其张力可避免加入解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句首用“那”承接上下文并引出带定语的“真理”；保留原文的将来被动意义和“结果”的比喻。末尾引号依照所给经文片段保留。
