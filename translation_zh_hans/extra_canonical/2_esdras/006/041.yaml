id: 2ES.6.41
reference: 2 Esdras 6:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et in die secundo iterum creasti spiritum firmamenti et imperasti ei, ut divideret et divisionem faceret inter aquas, ut pars quidem sursum recederet, pars vero deorsum maneret.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/041.yaml
  text: And again[a], on the second day, you created the spirit of the firmament, and commanded it to divide and make a division between the waters, so that one part might recede upward and the other part remain below.
translation:
  language: zh_hans
  text: 第二日，你又创造了穹苍之灵[a]，吩咐它把众水分开，使水彼此隔开，一部分退到上方，另一部分留在下方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又在第二日，你创造了穹苍之灵。”
    reason: iterum（“又、再次”）在句中的修饰范围可以有不同理解。
lexical_decisions:
- source_word: spiritum firmamenti
  choice: 穹苍之灵
  rationale: 按拉丁文保留“灵”与“穹苍”的明确组合，不将其简化为“穹苍”或解释为“风”，以保存原文可能的位格化意味与歧义。
- source_word: divideret et divisionem faceret inter aquas
  choice: 把众水分开，使水彼此隔开
  rationale: 体现原文“分开”与“造成间隔”的双重表达，同时避免汉语中机械重复。
- source_word: recederet
  choice: 退到
  rationale: 传达向上移开、退去之意，比单纯的“升到”更贴近拉丁文 recedere。
- source_word: maneret
  choice: 留在
  rationale: 准确表达持续停留之意，并与“退到上方”形成对照。
theological_decisions:
- issue: spiritum firmamenti 的所指
  choice: 直译为“穹苍之灵”
  alternative: “穹苍”或“穹苍的风”
  rationale: 原文明确使用 spiritum；直译可避免预先判定它是受造的灵体、风，还是对穹苍的拟人化表达。
- issue: iterum 的修饰范围
  choice: 正文作“第二日，你又创造了”并加注说明另一种理解
  alternative: “又在第二日，你创造了”
  rationale: 拉丁语序允许 iterum 既作为叙事承接语，也可能紧接“创造”理解；正文采用自然汉语，但不消除其范围歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“穹苍”保留创造叙事的传统语汇；句式清晰，适合普通读者，同时尽量贴近拉丁文的结构与神学张力。
