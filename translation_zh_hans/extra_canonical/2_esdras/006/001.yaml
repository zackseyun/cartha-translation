  text: 'Et dixit ad me: initium terreni orbis, et antequam starent exitus saeculi et antequam spirarent conuentiones uentorum, Et antequam sonarent uoces tonitruum, et antequam splenderent nitores coruscuum et antequam confirmarentur'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/001.yaml
  text: And he said to me[a], “At the beginning of the earthly world, before the ends of the age were established, and before the gatherings of the winds blew,
translation:
  language: zh_hans
  text: 他对我说：“在尘世之初，在世界的边界尚未立定[a]、风的聚集尚未吹拂、雷声尚未响起、闪电的光辉尚未闪耀，并且……尚未被坚立以前……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世界的边界”也可译作“时代的终局”；拉丁语短语既可能具有空间含义，也可能具有时间含义。
    reason: 保留 exitus saeculi 在宇宙空间与时代终局之间的真实歧义。
lexical_decisions:
- source_word: initium terreni orbis
  choice: 尘世之初
  rationale: initium 表示“开始、起初”，terrenus orbis 指属地的世界；译为“尘世之初”简洁自然，也保留其宇宙论语境。
- source_word: exitus saeculi
  choice: 世界的边界
  rationale: exitus 可指尽头、出口或边界，saeculum 既可指时代，也可在此宇宙创造清单中指世界；正文采用符合空间语境的“世界的边界”，脚注保留另一种理解。
- source_word: starent
  choice: 立定
  rationale: stare 在这里有站立、确立、固定之意；“立定”既贴近原文意象，也符合现代汉语表达。
- source_word: conuentiones uentorum
  choice: 众风……汇聚
  rationale: conuentiones 是聚集、会合，uentorum 是众风；译为“众风尚未汇聚”保留原文将风视为集合之物的宇宙论图景。
- source_word: spirarent
  choice: 吹动
  rationale: spirare 可指呼吸或吹风；用于风时译作“吹动”最自然，同时未把动作与前面的“汇聚”混为一义。
- source_word: uoces tonitruum
  choice: 雷声
  rationale: 字面为“雷的声音”；现代汉语以“雷声”准确而自然。
- source_word: nitores coruscuum
  choice: 闪电的光辉
  rationale: nitores 表示光辉、闪光，coruscuum 在此指闪电；采用“闪电的光辉”保留名词结构。
- source_word: confirmarentur
  choice: 被坚立
  rationale: 该词为复数被动虚拟式，意为“被坚固、被确立”；因本节所给拉丁文至此中断，保留被动形式及未完成感，不擅自补出主语。
theological_decisions:
- issue: exitus saeculi 的时空含义
  choice: 正文译作“世界的边界”
  alternative: “时代的终局”或“世代的尽头”
  rationale: 上下文连续列举风、雷和闪电等受造界现象，空间性的“世界边界”更符合宇宙论语境；但 saeculum 本身可表“时代”，故在脚注中保留时间性读法，避免消除原文歧义。
- issue: 残缺句尾的处理
  choice: 以省略号保留未完成结构
  alternative: 根据后续经文补足 confirmarentur 的主语和宾语
  rationale: 用户所给原文停在 confirmarentur，且缺少其语法主语；不以推测补文，以免引入来源未提供的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以并列的“尚未……”重现拉丁文反复出现的 antequam，并保留原文在本节所给文本末尾突然中断的句法状态。
