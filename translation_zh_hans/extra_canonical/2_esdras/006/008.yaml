base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/008.yaml
  text: And he said to me[a], “From Abraham to Abraham, because from him Jacob and Esau were born; for Jacob’s hand held Esau’s heel from the beginning. For Esau is the end of this age[b], and the beginning
translation:
  language: zh_hans
  text: 他对我说：“从亚伯拉罕到亚伯拉罕[a]，因为雅各和以扫是从他而生的；原来雅各的手从起初就抓住以扫的脚跟。因为以扫是这个时代的终结，而开端……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从亚伯拉罕到亚伯拉罕”在拉丁文见证中含义晦涩。叙利亚文、埃塞俄比亚文和阿拉伯文等旁系见证作“从亚伯拉罕到以撒”；下文说雅各和以扫“从他而生”，也支持“以撒”这一读法。
    reason: textual_variant
  - marker: b
    text: 原文在“而开端”之后中断，句意延续到下一节。
    reason: incomplete_source_excerpt
lexical_decisions:
- source_word: saeculi
  choice: 时代
  rationale: 拉丁语 saeculum 在此指现今的世代或时代；译作“时代”既自然，也保留末世论语境。
- source_word: calcaneum
  choice: 脚跟
  rationale: 准确对应“heel”，并与雅各出生时抓住以扫脚跟的传统叙述相呼应。
- source_word: ab initio
  choice: 从起初
  rationale: 按原文位置修饰“抓住”，保留其可能具有的象征意味，不将其弱化为单纯的出生时间说明。
theological_decisions:
- issue: “从亚伯拉罕到亚伯拉罕”的明显文本困难
  choice: 正文依所提供的拉丁见证译为“从亚伯拉罕到亚伯拉罕”，并以脚注说明其晦涩
  alternative: 依据叙利亚文、埃塞俄比亚文和阿拉伯文等旁系见证校作“从亚伯拉罕到以撒”
  rationale: 任务指定的原文是清理后的拉丁文本，且其明确重读 Abraham；不应在正文中静默改校，但需让读者知道异文及上下文支持的校读。
- issue: 残句“et principium”
  choice: 译作“而开端……”并保留未完状态
  alternative: 依据下一节补足“下一个时代的开端是雅各”
  rationale: 所给原文在 principium 处截断；本节翻译不越过证据擅自补全，同时用省略号自然标示句意延续。
- issue: 以扫与时代终结的对应
  choice: 直译为“以扫是这个时代的终结”
  alternative: 解释性改写为“以扫代表这个时代的终结”
  rationale: 原文使用系词直接等同，具有浓缩的启示文学象征张力，应予保留，不额外加入“代表”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“原来”连接出生叙事的解释，“因为”保留 enim 的论证关系。正文严格保存拉丁文本的困难读法，并借脚注呈现重要旁系见证；末尾保持原文片段的未完形式。
