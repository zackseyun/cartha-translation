  naturalness: “好满了”在现代汉语中不自然，且“满了”易被理解为已经完成，不适合表达目的。“为要补足……”更合乎现代书面经文语体。
  terminology: 将 ebdomadas 译为“周”是现代汉语对“七日一组”的通常表达；“那三周”保留定指，并不引入特定的日历或神学解释。
