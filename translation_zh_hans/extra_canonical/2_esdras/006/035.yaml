  yaml_path: translation/extra_canonical/2_esdras/006/035.yaml
  text: And it happened after this that I wept again, and likewise I fasted seven days, so that I might complete the three weeks that had been spoken to me.
translation:
  language: zh_hans
  text: 此后，我又哭泣，也同样禁食了七天，为要补足曾向我说过的那三周。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est post haec
  choice: 此后
  rationale: 这是拉丁叙事承接语；简洁译为“此后”比逐字译作“这些事以后，事情发生了”更符合现代汉语叙事习惯。
- source_word: flevi iterum
  choice: 我又哭泣
  rationale: 保留 iterum 的重复意味，并直接表达 flevi。
- source_word: similiter ieiunavi septem diebus
  choice: 也照样禁食了七天
  rationale: “照样”保留 similiter 与先前禁食方式相同或相应的含义；“七天”准确传达 septem diebus。
- source_word: ut suppleam
  choice: 好满了
  rationale: 表达目的，并保留 suppleam 补足、完成既定总数的语义。
- source_word: tres ebdomadas
  choice: 三个七天
  rationale: 拉丁文 ebdomadas 通常可译“周”，但这里按连续禁食天数计数；“三个七天”自然保留古代文本以七日为一组的表达，也避免现代日历周的联想。
- source_word: quae dictae sunt mihi
  choice: 曾向我说过的
  rationale: 贴近 dictae sunt mihi 的被动表达“向我说过”，不将其解释为“指定”或“命定”。
