source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'factum est cum audissem, et surrexi super pedes meos et audiui, et ecce uox loquens, et sonus eius sicut sonus aquarum multarum. Et dixit : ecce dies ueniunt, et erit quando adpro-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/017.yaml
  text: And it happened, when I heard, that I stood upon my feet and listened, and behold, a voice was speaking, and its sound was like the sound of many waters.
translation:
  language: zh_hans
  text: 我听见以后，就站起身来，侧耳倾听。看哪，有声音在说话；那声音如同众水的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est cum audissem
  choice: 我听见以后
  rationale: 以自然现代汉语表达拉丁文的叙事衔接；“factum est”在此主要起推进叙事的作用，不必机械译出。
- source_word: surrexi super pedes meos
  choice: 站起身来
  rationale: 准确传达“起身站立”的动作，避免生硬直译为“站在我的脚上”。
- source_word: audiui
  choice: 侧耳倾听
  rationale: 上下文先说“听见”，随后再次使用听觉动词；译为“侧耳倾听”可体现主动专注聆听，同时保持动作次序。
- source_word: ecce
  choice: 看哪
  rationale: 保留原文提示读者注意突发异象性事件的语气。
- source_word: uox loquens
  choice: 有声音在说话
  rationale: 保留“声音”作为说话主体的表达，不擅自补明说话者身份。
- source_word: sonus aquarum multarum
  choice: 众水的声音
  rationale: 采用庄重且具有圣经互文感的表达；“众水”可指大量或多处水流，保留原文意象。
theological_decisions:
- issue: 说话者的身份
  choice: 不指明身份，仅译作“有声音在说话”
  alternative: 译作“有一个声音对我说话”或直接认定为上帝的声音
  rationale: 本节拉丁文本只出现“uox loquens”，未明确说话者，也未明确受话对象；不应加入神学身份判断。
translation_notes:
  register: '采用现代、庄重而易懂的叙事语言。“看哪”和“众水的声音”保留经文的异象语域与回响感。所给拉丁文本末尾“Et dixit: ecce dies ueniunt...”已进入下一节且残缺，因此本稿依照指定的6:17范围及英语审校层，止于“众水的声音”。'
