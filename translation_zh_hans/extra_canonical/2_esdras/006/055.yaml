  text: haec autem omnia dixi coram te, Domine, quoniam dixisti quia propter nos creasti primogenitum saeculum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/055.yaml
  text: But I have said all these things before you[a], Lord, because you said that for our sake you created the first world.
translation:
  language: zh_hans
  text: 主啊，然而我在你面前说了这一切[a]，是因为你曾说，你为了我们创造了头生的世界[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你面前说了这一切”也可译作“把这一切都陈明在你面前”。
    reason: 保留 coram te 在祷告语境中既可表示当面说出，也可表示向神陈明的语义幅度。
  - marker: b
    text: 拉丁文直译为“头生的世界（或世代）”；叙利亚文、埃塞俄比亚文和阿拉伯文古译本作“这个世界（或今世）”。
    reason: primogenitum saeculum 的字面意义不寻常，并存在重要古译本异文；脚注使读者看见真实的文本问题，而不在正文中暗自裁定。
lexical_decisions:
- source_word: haec autem omnia dixi
  choice: 我……说了这一切
  rationale: 准确传达完成时 dixi；autem 在此承接并转折上下文，汉语不必生硬逐词译出，可由整句语气体现。
- source_word: coram te
  choice: 在你面前
  rationale: 保留 coram 的空间性和祷告语境，也可理解为“当着你的面”。
- source_word: propter nos
  choice: 为了我们
  rationale: 表达“为我们的缘故、以我们为目的”的含义，不将其收窄为单纯因果。
- source_word: primogenitum saeculum
  choice: 最初的世界
  rationale: 按所给拉丁文本保留 primogenitum 的先在含义，同时以自然汉语表达；另用脚注说明其直译及其他古译本的重要异文。
theological_decisions:
- issue: primogenitum saeculum 所涉及的宇宙论表述及文本异文
  choice: 正文译作“最初的世界”
  alternative: “这个世界／今世”；或直译“头生的世界”
  rationale: 所给拉丁正文明确为 primogenitum saeculum，不宜在正文中无声改从其他古译本；但“头生的世界”在现代汉语中极不自然，且可能制造超出文本的拟人化含义。因此正文采用“最初的世界”，脚注同时保留拉丁字面意义和古译本所见“这个世界”的异文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主啊”符合祷告称呼；句式清楚，避免仿古腔。正文以所给拉丁文本为主要依据，同时通过脚注公开重要异文。
