  text: ea. Et dedisti Behemoth unam partem quae siccata est tertio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/051.yaml
  text: And you gave Behemoth one part, which was dried up on the third day, to dwell in it, where there are a thousand mountains;
translation:
  language: zh_hans
  text: 你把一片地方赐给了贝希摩斯，就是第三日干涸的那一片。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现提供的拉丁文底本摘录到“第三日”为止。英文审校文本在此后还有“让它住在那里，那里有一千座山”，但这部分没有出现在所提供的拉丁文摘录中，故正文未据此补入。
    reason: 明确区分现有原文证据与英文咨询层，避免把当前拉丁文摘录未见的内容当作有原文依据的正文。
lexical_decisions:
- source_word: Behemoth
  choice: 贝希摩斯
  rationale: 保留专名的传统音译；此处指与前文利维坦相对的巨兽，不将其普通化为“河马”等具体动物。
- source_word: unam partem
  choice: 一片地方
  rationale: 直译为“一部分”在现代汉语中指代不够清楚；结合 quae siccata est，译作“一片地方”自然地表达从受造领域中划出的一处陆地，同时不额外限定其范围。
- source_word: quae siccata est tertio
  choice: 就是第三日干涸的那一片
  rationale: 保留关系从句及 tertio 所指的“第三日”；“干涸”贴近 siccata est，并与创世叙事中旱地显露的语境相合。
theological_decisions:
- issue: 贝希摩斯的身份
  choice: 保留专名“贝希摩斯”
  alternative: 解释性翻译为某种现实动物或神话怪兽
  rationale: 原文仅使用专名，未在本节界定其物种或性质；保留专名可避免引入特定解释传统。
- issue: 第三日与创世叙事的关联
  choice: 直译“第三日”，不增译“创造的”
  alternative: 译为“创造的第三日”
  rationale: 上下文可能明确呼应创世第三日，但本句拉丁文只写 tertio；不补入原文未明说的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赐给了”体现 dedisti 的完成动作；以“就是……那一片”承接关系从句，兼顾清晰与原文结构。所给拉丁文开头的“ea.”应是前句残片，未纳入本节正文。
