  text: congregata, ut procrearet animalia, uolatilia et pisces; Et ita fiebat aqua muta et sine anima, quod ei iubebatur, animalia
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/048.yaml
  text: 'gathered together[a], that it might produce animals, birds, and fish; and so it happened: the mute water, which had no life, produced living creatures as it had been commanded.'
translation:
  language: zh_hans
  text: 聚集起来，为要生出兽类、飞鸟和鱼类；事情便这样成了：无声而没有生命的水，照着所受的命令，生出了活物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无声而没有生命的水，生出所吩咐它要生出的活物。”拉丁文末尾的关系代词结构较为压缩，可作此连接理解。
    reason: 说明拉丁文 quod ei iubebatur, animalia 的压缩关系结构所容许的替代连接，且不改变“水按命令生出活物”的基本意思。
lexical_decisions:
- source_word: congregata
  choice: 聚集起来
  rationale: 保留被动含义所体现的水聚集成一处，同时用自然的现代汉语表达；其主语承接上下文中的“水”。
- source_word: animalia, uolatilia et pisces
  choice: 兽类、飞鸟和鱼类
  rationale: 此处三项并列，animalia宜按与飞鸟、鱼类相对的陆上兽类理解，避免译成现代广义的“动物”而与后两项重叠。
- source_word: aqua muta et sine anima
  choice: 那无声、没有生命的水
  rationale: 较直接地保留muta与sine anima的双重描述，以及无生命之水生出活物的反差；不额外赋予其神学含义。
- source_word: animalia
  choice: 活物
  rationale: 句末所指为水所生出的有生命受造物；“活物”既体现与“没有生命的水”的对照，也比重复“兽类”更符合这里的概括用法。
- source_word: quod ei iubebatur
  choice: 照着所受的命令
  rationale: 保留水被命令并遵命产生生命的拟人表达，同时补足拉丁文省略而汉语必需的句法连接。
theological_decisions:
- issue: 无生命的水与所生活物之间的创造张力
  choice: 保留“无声、没有生命的水”与“生出了活物”的鲜明对照
  alternative: 弱化为“水中出现了生物”
  rationale: 原文刻意强调水本身无声且无生命，却因命令而生出活物；译文不把这一点解释成自然过程，也不额外界定创造方式。
- issue: 命令发出者
  choice: 使用“所受的命令”，不在本节补明发令者
  alternative: 译为“照着你/上帝的命令”
  rationale: 拉丁文本在本句只用被动结构ei iubebatur；虽然上下文可确定发令者，仍不宜在本节明文之外增添称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“兽类、飞鸟和鱼类”保持创造叙事的分类节奏；“事情果然如此”自然承接拉丁文Et ita fiebat。脚注标记置于相关末句之后。
