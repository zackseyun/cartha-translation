  yaml_path: translation/extra_canonical/2_esdras/006/049.yaml
  text: 'Then you preserved two living creatures: the name of the one you called Behemoth[a], and the name of the second you called Leviathan.'
translation:
  language: zh_hans
  text: 那时，你保存了两个活物：一个你称为“贝希摩斯”[a]，第二个你称为“利维坦”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 贝希摩斯和利维坦是犹太圣经及后圣经传统中的太初活物；在这里，它们是以斯拉重述创造时所说被保存下来的活物。
    reason: 交代这两个专名的传统背景和本节中的叙事作用，而不把它们等同于某种现代动物。
lexical_decisions:
- source_word: conseruasti
  choice: 保存了
  rationale: 表达使之存留、保全之意，同时避免擅自补入它们所受威胁或被安置之处。
- source_word: duo animalia
  choice: 两个活物
  rationale: animalia 可泛指有生命的受造物；“活物”比“动物”更符合此处庄重的创世叙述语域，也不预先限定其自然类别。
- source_word: nomen uni uocasti
  choice: 一个你称为
  rationale: 按现代汉语自然表达译出“你给其中一个所称的名字”，保留上帝命名的动作而避免生硬直译。
- source_word: Behemoth
  choice: 贝希摩斯
  rationale: 采用音译，将其作为太初活物的专名处理，不译作某种现代动物。
- source_word: Leviathan
  choice: 利维坦
  rationale: 采用通行音译，将其作为太初活物的专名处理，不以“鳄鱼”等具体动物名称消解文本意象。
theological_decisions:
- issue: 两个活物的性质
  choice: 保留为“活物”，并将两个名称音译
  alternative: 把它们解释性译为河马、鳄鱼或怪兽
  rationale: 本节将二者置于以斯拉重述创造的语境中，却没有在本句明确界定其物种或本体；译文不替文本消除这种张力。
- issue: “保存”所暗示的方式与目的
  choice: 仅译“保存了”
  alternative: 增译为“为末时保留”或“保护起来”
  rationale: conservasti 本身没有在本句明说保存的地点、期限或末世用途，因此不将相关传统解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“那时”承接创造叙事；“一个……第二个……”贴近原文的配对结构。所提供的拉丁文本在 et（“和”）处截断；“第二个……利维坦”依据本节完整文本传统及经审核的英文咨询层补足。
