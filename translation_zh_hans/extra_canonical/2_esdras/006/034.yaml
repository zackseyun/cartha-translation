  text: et noli festinare in prioribus temporibus cogitare vana, ut non properes a novissimis temporibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/034.yaml
  text: and do not hasten to think vain thoughts about the former times[a][b], so that you may not be hasty concerning the last times.’”
translation:
  language: zh_hans
  text: 不要急着思量先前时代的虚妄之事[b]，免得你对末后的时代[a]操之过急。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧译作：“免得你匆匆离开末后的时代。”此处拉丁文介词 a 结合上下文和前后时间短语的平行，更适合理解为“关于”或“就……而言”。
    reason: previous_rendering
  - marker: b
    text: 这句警告的句法和具体所指较难确定。大意是：不可急躁地思量先前时代的虚妄之事，以致对末后的时代也操之过急。
    reason: textual_variant
lexical_decisions:
- source_word: noli festinare ... cogitare
  choice: 不要急于……思索
  rationale: 保留禁止命令以及 festinare 所表达的急切意味；“思索”比“想”更符合庄重语体。
- source_word: vana
  choice: 虚妄的
  rationale: 既可表达思想空洞、徒然，也不把原文过度具体化为某一种错误推测。
- source_word: prioribus temporibus
  choice: 先前的时代
  rationale: 按时间意义直译，并与后文“末后的时代”形成平行。
- source_word: ut non properes
  choice: 免得你……操之过急
  rationale: 将 ut non 理解为警戒所要避免的结果；properes 延续急躁、冒进的语义。
- source_word: a novissimis temporibus
  choice: 对末后的时代
  rationale: 将 a 解作“关于、就……而言”，维持与先前时代的平行，也符合以斯拉急切追问末世的语境。
theological_decisions:
- issue: 警告与末世的关系
  choice: “对末后的时代操之过急”
  alternative: “匆匆离开末后的时代”
  rationale: 拉丁文 a 在此可有歧义，但分离义会破坏前后时代的平行，也不合以斯拉盼望终局来临的上下文；正文采用“关于、针对”的关系义，同时以脚注保留旧译可能。
- issue: “虚妄”所指的范围
  choice: 不限定为特定类型的末世论错误
  alternative: 译作“作无益的推测”
  rationale: 原文仅有 vana，保持其宽泛性，避免加入宗派性或解释性的限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“先前的时代／末后的时代”保留原文的平行结构；“急于／操之过急”再现两个近义动词的呼应。所有脚注标记均置于相关正文处。
