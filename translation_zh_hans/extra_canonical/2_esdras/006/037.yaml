  text: For my spirit was greatly inflamed, and my soul was distressed.
translation:
  language: zh_hans
  text: 因为我的灵极其激动，我的心忧闷不安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inflammabatur
  choice: 激动
  rationale: 该词字面意为“被点燃、燃烧起来”，在此描述内在情绪强烈翻腾；译作“激动”既自然，也保留强烈程度，避免中文“燃烧”可能造成的生硬或过度具象。
- source_word: spiritus meus
  choice: 我的灵
  rationale: 直译为“我的灵”，保留原文与后半句“我的心（anima mea）”之间的平行关系。
- source_word: anima mea
  choice: 我的心
  rationale: anima 可指生命、灵魂或内在自我；此处与 anxiabatur 连用，译为现代汉语自然的“我的心”，表达内心忧苦而不强行作灵魂论区分。
- source_word: anxiabatur
  choice: 忧闷不安
  rationale: 兼顾该词所含的忧苦、焦灼和受压迫感；双词表达比单用“忧愁”更充分。
- source_word: valde
  choice: 极其
  rationale: 准确表达强烈程度，并保持庄重简洁。
theological_decisions:
- issue: spiritus 与 anima 的关系
  choice: 分别译为“灵”与“心”，保留修辞上的并列而不界定二者是否为不同的人性组成部分。
  alternative: 分别译为“灵”与“灵魂”，或都意译为“内心”。
  rationale: 原句的重点是双重平行地表达强烈的内在激动与忧苦，并不足以建立特定的人性二分或三分理论。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体。句式保留原文“因为……，……”的因果衔接及两个分句的平行结构；不加脚注，因为本节无必要的文本异读或不可由正文承载的歧义。
