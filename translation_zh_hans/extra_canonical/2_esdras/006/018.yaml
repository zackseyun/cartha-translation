  text: And it said, “Behold, days are coming, and it will be that when I begin to draw near to visit those who dwell on the earth,
translation:
  language: zh_hans
  text: 我开始临近[a]，为要察访住在地上的人；而当……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文本从 pinquare 开始，看来是 appropinquare（“临近”）一词的后半部分；本译文按此作最低限度复原。
    reason: 向读者说明源文本在词中间起始，以及译文所依据的最低限度复原。
lexical_decisions:
- source_word: pinquare incipio
  choice: 我开始临近
  rationale: 现存引文似从 appropinquare（“临近”）一词中间起始；依可辨认的词尾及英语校订层译出，同时不补入所给拉丁文本未载的句子。
- source_word: uisitem
  choice: 察访
  rationale: 既保留“前往探察、眷顾或施行处置”的宽广语义，也不预先判定此次到访是恩待还是审判。
- source_word: habitantes in terra
  choice: 住在地上的人
  rationale: 按拉丁语直译，采用现代汉语中自然且庄重的表达。
- source_word: Et quando
  choice: 并且当……
  rationale: 原文在从属连词之后中断；保留未完句式，不擅自补足下文。
theological_decisions:
- issue: “察访”的性质
  choice: 保留中性而庄重的“察访”
  alternative: “审判”或“眷顾”
  rationale: uisitem 本身可随语境涵盖探察、眷顾及审判性临到；本节残句不足以限定其性质。
- issue: 是否补入英语校订层中的引言
  choice: 不补入“它说：‘看哪，日子将到……’”
  alternative: 依英语 POB 补全引言
  rationale: 所提供的拉丁原文证据没有这些词；翻译以原文证据为先，英语文本仅作校订参考。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“察访”保留原词可能兼有眷顾与审断的张力；末尾以省略号明确表示所给原文止于未完的“当……”。
