id: 2ES.6.32
reference: 2 Esdras 6:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam auditu audita est vox tua apud Altissimum. vidit enim Fortis directionem tuam et providit pudicitiam quam a iuventute tua habuisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/032.yaml
  text: For your voice has indeed been heard before the Most High; for the Mighty One has seen your conduct and has taken note of the purity that you have had from your youth.
translation:
  language: zh_hans
  text: 因为你的声音确实已蒙至高者垂听；大能者看见了你的品行，也留意到你自年轻时就有的纯洁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auditu audita est vox tua
  choice: 你的声音确实已蒙……垂听
  rationale: 保留拉丁文同源词叠用所加强的肯定语气，以“确实”自然表达；“蒙……垂听”符合向至高者祈求的语境，也比机械直译更合乎现代汉语。
- source_word: Altissimum
  choice: 至高者
  rationale: 准确保留最高级称号及其庄重宗教语域。
- source_word: Fortis
  choice: 大能者
  rationale: 作为神圣称号处理，表达强大、有能力之意，同时避免增添原文未明说的专名。
- source_word: directionem tuam
  choice: 你的品行
  rationale: 此处指受察看的行为表现或生活操守；译作“品行”较“正直”更少预断其评价，也比“方向”更符合语境。
- source_word: providit
  choice: 留意到
  rationale: 表达察看、关注之意，不将其误解为现代汉语常说的“供应”或把神学上的“预定”含义带入。
- source_word: pudicitiam
  choice: 纯洁
  rationale: 涵盖端庄、贞洁和道德纯净的语义范围；原文未限定具体层面，故采用较宽而庄重的表达。
- source_word: a iuventute tua habuisti
  choice: 你从年轻时就持守的
  rationale: 自然表达自青年时期以来一直具有的状态；“持守”体现持续性，但不把起点具体限定为童年。
theological_decisions:
- issue: “纯洁”的具体所指
  choice: 保留为较宽泛的“纯洁”
  alternative: 译为“贞洁”或“端庄”
  rationale: pudicitia 可偏指性方面的贞洁，也可泛指端庄纯洁；上下文不足以把含义缩窄，因此保留原文的语义张力。
- issue: directionem 是否含“正直”评价
  choice: 译为中性的“品行”
  alternative: 译为“正直”或“正直的生活”
  rationale: 原文宾语本身可指行为、道路或操守；积极评价可由整体语境体现，不宜在该词中额外强化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号保留原句的因果展开；“至高者”“大能者”保持神圣称号的平行感。无脚注标记。
