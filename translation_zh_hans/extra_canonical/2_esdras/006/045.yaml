  text: quarta autem die imperasti fieri solis splendorem, lunae lumen stellarum dispositionem,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/045.yaml
  text: On the fourth day you commanded the brightness of the sun[a], the light of the moon, and the arrangement of the stars to be made,
translation:
  language: zh_hans
  text: 第四天，你吩咐造出太阳的光辉、月亮的光和群星的排列。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quarta autem die
  choice: 第四天
  rationale: autem在此承接叙述，汉语无需机械译出“而”；“第四天”自然准确。
- source_word: imperasti fieri
  choice: 你吩咐造出
  rationale: 保留imperasti的命令含义，并以“造出”表达fieri在创造叙事中的“形成、被造”。
- source_word: solis splendorem
  choice: 太阳的光辉
  rationale: splendor指明亮的光辉，与下文lumen有所区分。
- source_word: lunae lumen
  choice: 月亮的光
  rationale: 直译lumen，同时使用自然的现代汉语。
- source_word: stellarum dispositionem
  choice: 群星的排列
  rationale: dispositio在此指星辰的安排或布局；“排列”既简洁又保留其秩序性。
theological_decisions:
- issue: fieri的管辖范围
  choice: 让“造出”统摄太阳的光辉、月亮的光和群星的排列三项
  alternative: 仅将“造出”直接连接第一项，后两项作并列补充
  rationale: 拉丁文fieri位于整个宾格并列系列之前，在句法上自然统摄三项；中文将三项置于“造出”之后可清楚反映这一结构。
- issue: “太阳的光辉”等是否指天体本身
  choice: 依原文保留为光辉、光和排列
  alternative: 释义为创造太阳、月亮和众星
  rationale: 原文明确使用splendor、lumen和dispositio，不应将其同化为天体本身，以免消除文本与《创世记》叙述之间可能存在的表达张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；句式简明，适合经文朗读。无需脚注，因为中文语序能够明确表示“造出”统摄全部三项，且不产生英文旧译中的悬垂歧义。
