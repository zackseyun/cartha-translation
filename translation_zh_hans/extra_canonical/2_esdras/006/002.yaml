lexical_decisions:
- source_word: voces tonitruum
  choice: 雷霆发声
  rationale: 保留“声音”与“雷霆”的意象，同时用现代汉语自然表达雷声响起。
- source_word: nitores coruscuum
  choice: 闪电发光
  rationale: 按拉丁文的光亮、闪耀意象译出，避免生硬直译为“闪电的光辉”。
- source_word: confirmarentur fundamenta paradisi
  choice: 乐园的根基立定
  rationale: “立定”既表达 confirmarentur 的确立、稳固之意，也适合“根基”这一搭配；paradisi 译作“乐园”，保留其宇宙起源语境中的神学意象。
