  text: et nunc, Domine, ecce istae gentes quae in nihilum deputatae sunt dominari nostri et devorarenos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/057.yaml
  text: And now, Lord, behold, these nations, which have been reckoned as nothing, rule over us and devour us.
translation:
  language: zh_hans
  text: 如今，主啊，看哪，这些被算作无有的列国竟统治我们，吞吃我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nunc
  choice: 如今
  rationale: 自然承接当前处境，并保留拉丁文“现在”的时间意味。
- source_word: ecce
  choice: 看哪
  rationale: 保留呼告中的强调语气，文体庄重而为现代读者所能理解。
- source_word: gentes
  choice: 列国
  rationale: 在此指以色列之外、如今施行统治的各民族或邦国；“列国”符合经文语域。
- source_word: in nihilum deputatae sunt
  choice: 被视为虚无
  rationale: 贴近“被算作毫无价值/如同无有”的被动表达，不额外指定是谁如此看待它们。
- source_word: dominari nostri
  choice: 统治我们
  rationale: 原文此处形式可能受传抄影响，语境及英语审校层均支持“统治我们”；用现代汉语直接表达受辖制之意。
- source_word: devorarenos
  choice: 吞吃我们
  rationale: 按 devorare nos 理解，保留“吞噬、毁灭”的强烈比喻，不弱化为一般的压迫。
theological_decisions:
- issue: “被视为虚无”的施事者
  choice: 采用不明示施事者的被动句
  alternative: 被你视为虚无
  rationale: 拉丁文本身没有明确说是谁作此判断；不补入“你”可保留原文歧义，避免把判断直接归于上帝。
- issue: 列国地位与当前统治之间的张力
  choice: 以“竟”凸显反差
  alternative: 不加语气副词，直译为“统治我们”
  rationale: “被视为虚无”与“统治我们”形成明显反差；“竟”自然呈现原句申诉语气，却不增加新的命题内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主啊，看哪”保留祷告与呼告色彩；整体句式简洁，维持申诉中的反差和力度。
