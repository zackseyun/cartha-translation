  text: And the trumpet will sound, and when all hear it, they will suddenly be terrified.
translation:
  language: zh_hans
  text: 号角将鸣响；众人一听见，就会突然惊恐万分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuba
  choice: 号角
  rationale: 指用于发出重大信号的号筒类乐器；“号角”在现代汉语中自然庄重，也符合末世异象的语境。
- source_word: canet cum sono
  choice: 必吹响
  rationale: 拉丁文直陈号角将发声；“吹响”已自然包含发出响声之意，无须重复译成“带着响声吹响”。“必”表达将来事件的确定性。
- source_word: omnes
  choice: 众人
  rationale: 保留“所有人”的总体范围，同时使汉语行文简洁自然。
- source_word: subito expavescent
  choice: 便会突然惊恐万分
  rationale: expavescent 表示骤然陷入强烈恐惧；“惊恐万分”体现强度，“突然”保留 subito，“便会”自然连接听见之后的反应。
