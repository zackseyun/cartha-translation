    text: 所提供的拉丁文引文止于“泉源的水道”；本句后半“停流三小时”依据该节完整文本传统及所附审校英译补出。
    reason: source_excerpt_truncation
lexical_decisions:
- source_word: debellabunt amici amicos ut inimici
  choice: 朋友会像仇敌一样彼此争战
  rationale: 保留朋友反目、彼此交战的强烈意象；“争战”自然庄重，也不把 debellare 的语气弱化为一般争执。
- source_word: expauescet terra cum his qui inhabitant eam
  choice: 大地和住在地上的人都必惊恐
  rationale: 将 cum 按伴随、联合关系处理，明确大地及其居民一同惊恐，避免误解为居民使大地惊恐。
- source_word: uenae fontium
  choice: 泉源的水道
  rationale: uenae 字面为“脉络”，在水泉语境中指水流所经的通道；“水道”比直译“脉”更符合现代汉语。
- source_word: stabunt ut non decurrant in tribus horis
  choice: 也必停流三小时
  rationale: 凝练表达“停住而不流淌三小时”，保持事件及持续时间不变。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“到那时”承接末世异象语境；用分号区分人际争战与受造界惊恐、停流两组征兆。未沿用所附英译中位置与内容不相符的旧脚注，而以文本资料截断说明取代。
