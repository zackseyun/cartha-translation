  yaml_path: translation/extra_canonical/2_esdras/006/026.yaml
  text: It will be turned into another understanding[a]. For evil will be blotted out, and deceit will be extinguished. But faith will flourish, and corruption will be overcome[b],
translation:
  language: zh_hans
  text: 将转变为另一种理解[a]。因为邪恶必被消除，诡诈必被消灭；信实却要兴盛，败坏也必被制伏[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所给拉丁文本没有明说“将转变”的主语；“理解”也可译作“心思”或“心态”。
    reason: source_ambiguity
  - marker: b
    text: “信实”也可译作“信心”或“信仰”；“败坏”也可译作“腐朽”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: conuertetur
  choice: 它将转变
  rationale: 拉丁文为第三人称单数被动式；本节所给片段没有明说主语，因此保留代词所指的含混。
- source_word: sensum alium
  choice: 另一种心思
  rationale: sensus 可指思想、心态或理解；“心思”在现代汉语中自然，并保留其内在认知与倾向的广度。
- source_word: Delebitur ... malum
  choice: 邪恶必被除去
  rationale: delebitur 有涂去、消除之意；“除去”清楚自然，又不额外引入毁灭方式。
- source_word: extinguetur dolus
  choice: 诡诈必被扑灭
  rationale: extinguere 本义为熄灭；“扑灭”保留形象，dolus 译作“诡诈”以涵盖欺骗与奸诈。
- source_word: Florebit ... fides
  choice: 信实却要兴盛
  rationale: florebit 为“开花、繁盛”；译作“兴盛”较自然。fides 在此可指信心、信仰或忠信，选择“信实”以与社会性的诡诈形成对应，同时不排除忠信之义。
- source_word: uincetur corruptela
  choice: 败坏也必被制伏
  rationale: uincetur 是“被战胜、被克服”；corruptela 可指腐败、败坏或朽坏，译作“败坏”以保留较宽语义。
theological_decisions:
- issue: fides 的意义范围
  choice: 信实
  alternative: 信心／信仰
  rationale: 上下文将 fides 与 dolus、corruptela 对照，可能侧重忠信与诚实；但拉丁词本身也能表达信心或信仰，因此以脚注保留其他可能。
- issue: conuertetur 的未明主语
  choice: 使用“它”，不补出具体对象
  alternative: 补作“居民的心”或“世人的心思”
  rationale: 所提供的拉丁文本没有显式主语；不依据其他文本传统补足，可避免将未确定内容写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“必……／要……”呈现预言语气，并用“却”表达 autem 的转折。末尾保留逗号，以反映所给拉丁文本仍接续下文。
