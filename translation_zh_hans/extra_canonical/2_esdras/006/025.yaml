  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/025.yaml
  text: And it will be that everyone who is left from all these things that I have foretold to you will be saved and will see my salvation and the end of my age[a].
translation:
  language: zh_hans
  text: 那时，凡经历我预先告诉你的这一切事而仍存留下来的人，必得救，并将看见我的救恩和我的时代的终结。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时代”也可译作“世代”或“世界”。
    reason: 拉丁文 saeculum 兼有时代、世代和世界秩序等含义；此处存在真实的词义歧义。
lexical_decisions:
- source_word: derelictus fuerit ex omnibus istis
  choice: 这一切事发生以后，凡存留下来的人
  rationale: 该短语指经历前述灾难后仍留下的人。这样表达比逐字译作“从这一切事中被留下”更符合现代汉语，同时保留其幸存、余留的含义。
- source_word: salvabitur
  choice: 必得救
  rationale: 保留将来被动语态及救赎含义。
- source_word: videbit salutare meum
  choice: 将看见我的救恩
  rationale: 较贴近拉丁文，保留“看见”与“我的救恩”的措辞，不擅自具体化为某种事件或人物。
- source_word: finem saeculi mei
  choice: 我的时代的终结
  rationale: saeculum 可指时代、世代或世界秩序；正文采用“时代”，以保留时间性的末世含义及原文不寻常的第一人称所有格。
theological_decisions:
- issue: “我的时代的终结”中 saeculi 的含义
  choice: 时代
  alternative: 世界／世代
  rationale: “时代”既自然，又不把该词过早限定为物质世界的毁灭；脚注保留其词义范围。
- issue: salutare meum 的表达
  choice: 我的救恩
  alternative: 我所施的拯救
  rationale: “我的救恩”忠实保留原文所有格可能具有的多重含义，避免把它只解释为上帝施行拯救的行动。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“发生以后”使拉丁文 ex omnibus istis 所表达的经历并存留关系在汉语中自然呈现；保留“我的救恩”和“我的时代”的所有格张力，不作教派化解释。
