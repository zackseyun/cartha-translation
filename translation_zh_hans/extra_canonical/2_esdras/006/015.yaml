  yaml_path: translation/extra_canonical/2_esdras/006/015.yaml
  text: do not be terrified, because the word concerns the end, and the foundations of the earth will tremble and be shaken, because the discourse is about them.
translation:
  language: zh_hans
  text: 你不要惊恐，因为这话关乎终局；大地的根基将战栗震动，因为所论的正是它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: expauescas
  choice: 你不要惊恐
  rationale: 按经校订所体现的否定命令理解，保留对单数听者的直接劝告；“惊恐”自然传达强烈惧怕。
- source_word: de fine uerbum
  choice: 这话关乎终局
  rationale: verbum 在此指所传达的话或信息；finis 在末世语境中译为“终局”，既保留“终结”之义，也不额外限定具体神学体系。
- source_word: fundamenta terrae
  choice: 大地的根基
  rationale: 采用贴近原文的宇宙论意象，不将其解释性改写为山岳、地层或世界秩序。
- source_word: tremescet et commoue-
  choice: 将战栗震动
  rationale: 依残缺处经校订及上下文所支持的两个并列动词处理；“战栗”与“震动”分别保留恐惧般颤抖和物理摇动的双重力度。
- source_word: de ipsis sermo
  choice: 所论的正是它们
  rationale: sermo 指谈论的内容；ipsis 带强调意味，故用“正是”，其复数所指回接“大地的根基”。
theological_decisions:
- issue: “终局”的具体所指
  choice: 保留为“终局”
  alternative: 译作“世界末日”或“末世”
  rationale: 原文只说 finis，没有明确限定为世界毁灭、某一时代结束或特定末世阶段，因此不作教义性收窄。
- issue: 大地根基的震动是字面还是象征
  choice: 保留原有意象，不加解释
  alternative: 解释为受造界、政权或世界秩序的动荡
  rationale: 原文没有说明该表达的象征范围，直译可保存其诗性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“你不要惊恐”保持直接劝告语气；分号清楚呈现关于终局的话与大地根基震动之间的推进关系。
