  yaml_path: translation/extra_canonical/2_esdras/006/016.yaml
  text: Because the speech concerns them[a], they will tremble and be shaken, for they know that their end must be changed.”
translation:
  language: zh_hans
  text: “因为论到这些事的话语必颤抖并震动；它知道他们的结局必须改变。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文的单数动词使“论到这些事的话语”成为“颤抖、震动”和“知道”的主体。由于此句意异常，也可理解为：所论到的那些人将颤抖并震动，因为他们知道自己的结局必须改变。
    reason: 保留拉丁文单数句法，同时说明英语审校轨迹所采用的另一种主体理解。
lexical_decisions:
- source_word: sermo de his (由本节上文及英语审校层保留的句意复原)
  choice: 论到这些事的话语
  rationale: 保留拉丁语中“话语”作主语的反常拟人表达，不改写为“这些事物／人将颤抖”。
- source_word: tremebit et commovebitur (所给片段仅保存后一个动词的词尾 -bitur)
  choice: 将颤抖震动
  rationale: 用两个并列动词传达颤抖与受震动的叠加语势，同时保持中文简洁。
- source_word: scit
  choice: 它知道
  rationale: 拉丁语为第三人称单数，与前文单数 sermo（话语）呼应；不依英语层改为复数“他们知道”。
- source_word: finem eorum
  choice: 这些事的结局
  rationale: eorum 回指前文 his；“结局”较自然地表达 finis，并保留所指对象的概括性。
- source_word: oportet commutari
  choice: 必须改变
  rationale: oportet 表示必然或必要，commutari 为被动不定式；中文以自然的“必须改变”表达。
theological_decisions:
- issue: “话语”是否应作为颤抖并知道的主体
  choice: 保留“话语”的拟人化主体地位
  alternative: 按英语POB正文理解为“所论到的那些对象将颤抖，他们知道……”
  rationale: 拉丁语可复原的句法以单数 sermo 为主语，且所给片段中的单数 scit 与之吻合。虽表达奇特，也不应为求顺畅而消解原文的张力。
- issue: “结局改变”的对象
  choice: 译作“这些事的结局”
  alternative: 译作“他们的结局”
  rationale: 上下文指向“这些事”，而非明确的人群；避免擅自把中性或概括性所指人格化。
translation_notes:
  register: 采用庄重而现代的普通话。“为什么呢”承接上文问句；“话语将颤抖震动”虽不寻常，却有意保存拉丁文本的拟人表达和神秘语气。
