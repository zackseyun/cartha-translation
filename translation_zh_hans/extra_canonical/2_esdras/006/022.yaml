  text: And suddenly places sown will appear unsown, and full storehouses will suddenly be found empty, and the trumpet will sound, which when all hear, they will suddenly be terrified.
translation:
  language: zh_hans
  text: 已播种的地方会突然显为未播种；装满的仓库会突然被发现是空的。号角将鸣响；众人一听见，便会顿时惊恐万分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminata loca non seminata
  choice: 已耕种的田地……显得从未耕种
  rationale: 保留“已经耕种”与“未曾耕种”的突兀反转；将泛指的 loca 按农业语境自然译为“田地”。
- source_word: plena prumptuaria ... uacua
  choice: 装满的仓库……变得空空如也
  rationale: prumptuaria 指储藏物资之处，译作“仓库”简明自然；“空空如也”传达 uacua 的彻底空缺。
- source_word: tuba canet cum sono
  choice: 号角将要吹响
  rationale: tuba 在末世征兆语境中指发声的号角；拉丁文 cum sono 语义有重复性，汉语以“吹响”自然涵盖其声响。
- source_word: subito expauescent
  choice: 便会顿时惊恐万分
  rationale: expauescere 表示突然而强烈地受惊；“顿时”对应 subito，“惊恐万分”体现其强度。
theological_decisions:
- issue: 号角的施动者及性质
  choice: 不补出吹号者，也不明确解释为审判号或末日号
  alternative: 译为“天使将吹响审判的号角”
  rationale: 原文仅说号角将响，未交代施动者或为号角赋予明确神学名称，因此保留原文的开放性。
- issue: 田地变化是实际状态还是视觉表象
  choice: 采用“显得从未耕种”
  alternative: 采用“变成未耕种之地”
  rationale: apparebunt 可指“显现为、看起来”；译作“显得”保留现象与实际变化之间的歧义。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。以两个句号和一个分号组织连续异象，保留两次“突然/顿时”的急剧节奏，同时避免生硬照搬拉丁语序。
