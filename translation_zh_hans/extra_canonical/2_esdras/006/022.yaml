revisions:
- from: 已耕种的田地会突然显得从未耕种，装满的仓库也会突然变得空空如也。号角将要吹响；众人一听见，便会顿时惊恐万分。
  to: 已播种的地方会突然显为未播种；装满的仓库会突然被发现是空的。号角将鸣响；众人一听见，便会顿时惊恐万分。
  rationale: 修订仅恢复 seminata 与 non seminata 的“播种”词汇对照，并以“鸣响”更贴近 tuba canet cum sono，同时保留原文未说明变化究竟是表象还是实体转变的余地，也不补加号角的施动者或神学性质。
