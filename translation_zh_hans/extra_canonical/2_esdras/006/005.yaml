- from: 在现今这些年日被查明[a]以前，在如今犯罪之人的计谋被摒弃以前，也在那些积存信心的人受印记以前——
  to: 在现今的岁月被查究以前，在现今犯罪之人的谋算被弃绝以前，也在那些积蓄信心的人受印以前——
  rationale: 修订仅改善语义精确度和现代汉语的自然度：以“现今的岁月”替换不自然的“现今这些年日”，以“被查究”避免将查究强化为查明结论；同时将“计谋”调整为较中性的“谋算”，并以“积蓄信心的人受印”保留原文的储存意象和被动受印。三个“以前”及末尾破折号均保留，确保末句仍是 antequam 时间序列的一部分。
