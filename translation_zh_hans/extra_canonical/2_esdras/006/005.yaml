  text: Sion, Et antequam inuestigarentur praesentes anni, et antequam abalienarentur eorum qui nunc peccant adinuentiones, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/005.yaml
  text: and before the present years were searched out[a], and before the devices of those who now sin were estranged, and before those who have stored up faith were sealed—
translation:
  language: zh_hans
  text: 在现今的岁月被查究以前，在现今犯罪之人的谋算被弃绝以前，也在那些积蓄信心的人受印以前——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inuestigarentur
  choice: 被查明
  rationale: 保留“查究、探明”的被动含义；在年日的语境中表达其尚未被探定或确知。
- source_word: praesentes anni
  choice: 现今这些年日
  rationale: 直译 praesentes 的“现今、当前”，并以“年日”使中文自然而庄重。
- source_word: abalienarentur
  choice: 被摒弃
  rationale: 该词可指被疏离、移除或排除；与“计谋”搭配时，“被摒弃”较自然，同时不把动作具体化为毁灭。
- source_word: adinventiones
  choice: 计谋
  rationale: 指人的构想、设计或谋划；结合犯罪者的语境译为“计谋”，但不额外断定其具体内容。
- source_word: consignarentur
  choice: 受印记
  rationale: 表达加印、盖印的被动动作，并保留其象征性，不擅自解释印记的性质。
- source_word: fidem thesaurizaverunt
  choice: 积存信心
  rationale: 保留 thesaurizare“像珍宝一样积蓄”的意象，并将 fides 译作“信心”，避免扩展为特定教派意义。
theological_decisions:
- issue: 末一分句是否仍受 antequam 支配
  choice: 重复“以前”，使“受印记”继续属于时间从句序列
  alternative: 把“那些积存信心的人受了印记”译成独立陈述
  rationale: consignarentur 与前面的虚拟式动词平行，语法上延续 antequam 所统领的“在……以前”结构；独立处理会改变原文的时间关系。
- issue: “受印记”的神学含义
  choice: 保留未解释的象征性措辞
  alternative: 明确译为蒙拣选、得救或受神保护
  rationale: 拉丁文本只陈述加印，并未在本句界定印记，因此不应替作者消解神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以三个“在……以前”呈现原文平行结构，并用破折号保留句子向下文延续的未完感。所给拉丁引文末尾似有截断；末一分句依据所附经校订英文层及修订说明中明确引用的拉丁词 consignarentur、fidem thesaurizaverunt 还原处理。
