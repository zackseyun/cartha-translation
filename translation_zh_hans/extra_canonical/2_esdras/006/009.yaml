  yaml_path: translation/extra_canonical/2_esdras/006/009.yaml
  text: For Esau is the end of this age[a], and Jacob is the beginning of the one that follows.
translation:
  language: zh_hans
  text: 因为以扫是这个时代的终结，雅各是随后的时代的开端。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculi
  choice: 时代
  rationale: 此处指现今的世代或时代，而非物质世界；译作“时代”既自然，也能与随后而来的时代形成对照。
- source_word: finis
  choice: 终结
  rationale: 保留时间进程走到尽头的含义，并与“开端”构成清楚、庄重的对应。
- source_word: sequentis
  choice: 随后时代的
  rationale: 拉丁文省略了被修饰的名词，语境所指为随后而来的时代；中文补出“时代”，使表达完整自然。
- source_word: principium
  choice: 开端
  rationale: 与“终结”平行，保留原文关于前一时代结束、后一时代开始的结构。
theological_decisions:
- issue: 以扫和雅各与两个时代的关系
  choice: 采用系词判断句：“以扫是……终结，雅各是……开端”
  alternative: “这个时代的终结是以扫，随后时代的开端是雅各”
  rationale: 原文语法允许按主语—表语关系理解；本译法直接贴近拉丁文词序，同时不额外解释以扫、雅各究竟象征人物、族群还是时代秩序，从而保留原文的象征张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两分句保持严格平行；不添加原文没有的末世论解释。
