  text: colligerentur innumerabiles militiae angelorum, Et antequam extollerentur altitudines aerum, et antequam nominarentur mensurae firmamentorum, et antequam aestimaretur scabellum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/004.yaml
  text: and before the heights of the air were lifted up[a], and before the measures of the firmaments were named, and before the footstool was measured,
translation:
  language: zh_hans
  text: 在天空的高处被举起以前，在众穹苍的尺度被命名以前，在脚凳被测定[a]以前，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“估定”或“评定”。
    reason: 拉丁文 aestimaretur 可表示估定、评定；正文“测定”是依上下文作出的表达。
lexical_decisions:
- source_word: extollerentur altitudines aerum
  choice: 天空的高处被举起
  rationale: 保留拉丁文被动结构及“举起、升高”的空间意象；aerum虽为复数，现代汉语用“天空”比“诸空气”自然。
- source_word: mensurae firmamentorum
  choice: 诸天穹的尺度
  rationale: firmamentorum为复数，以“诸天穹”保留这一形式；mensurae译作“尺度”，并保留其“被命名”这一不寻常却明确的源文表达。
- source_word: scabellum
  choice: 脚凳
  rationale: 采用该词通常而具体的含义，不擅自补入拉丁文没有的“锡安的”。
- source_word: aestimaretur
  choice: 被测定
  rationale: 结合受造秩序及尺度语境译为“测定”；该词本义范围也包括估定、评定，故以脚注保留。
theological_decisions:
- issue: “脚凳”的所属对象
  choice: 不补明所属对象
  alternative: 锡安的脚凳
  rationale: 现存拉丁文本此处只有scabellum；补入“锡安的”会超出所给源文证据。
- issue: aestimaretur所表达的动作
  choice: 测定
  alternative: 估定／评定
  rationale: “测定”适合紧接“尺度”的宇宙创造语境，但不把词义收窄为字面称重，也不引申为“建立”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留三重“在……以前”的平行结构。所给拉丁文开头的colligerentur innumerabiles militiae angelorum属于前一节延续的上下文，依本节边界及审校层正文不收入2 Esdras 6:4。
