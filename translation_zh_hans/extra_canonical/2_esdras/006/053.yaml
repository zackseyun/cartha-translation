  text: And on the sixth day you commanded the earth to create before you livestock and beasts and creeping things;
translation:
  language: zh_hans
  text: 第六日，你吩咐大地在你面前造出牲畜、野兽和爬行动物；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sexto autem die
  choice: 第六日
  rationale: 按自然的现代汉语表达日序；autem 在此承接上下文，不必机械译出。
- source_word: imperasti terrae ut crearet
  choice: 你吩咐大地……造出
  rationale: 保留“命令大地进行创造”的句法与拟人化表达。
- source_word: coram te
  choice: 在你面前
  rationale: 直译该介词短语，保留万物在上帝面前受造的空间性和神学意象。
- source_word: iumenta
  choice: 牲畜
  rationale: 此处与野兽并列，泛指家养役用动物；“牲畜”比“牛”范围更准确。
- source_word: bestias
  choice: 野兽
  rationale: 与 iumenta 的家养动物相对，译为“野兽”清楚自然。
- source_word: reptilia
  choice: 爬行动物
  rationale: 表达在地面爬行的一类生物；现代读者易懂，且与上下文的生物分类相称。
