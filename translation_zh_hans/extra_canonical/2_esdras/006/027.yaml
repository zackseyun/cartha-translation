  text: For evil will be blotted out[a], and deceit will be extinguished.
translation:
  language: zh_hans
  text: 因为邪恶必被除去，诡诈必被消灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: delebitur
  choice: 必被抹去
  rationale: 保留拉丁语将来时被动语态，并传达 deleo“擦除、消除”的形象。
- source_word: malum
  choice: 邪恶
  rationale: 在此末世性语境中指恶或邪恶这一概念；中文不强行限定为某一种恶事。
- source_word: extinguetur
  choice: 必被熄灭
  rationale: 直接保留 extinguo“使熄灭”的比喻及将来时被动意义，并与前句构成平行。
- source_word: dolus
  choice: 诡诈
  rationale: 涵盖欺骗、奸诈和诡计，不将含义缩窄为单次的谎言。
- source_word: enim
  choice: 因为
  rationale: 明确表达该连接词的解释或因果作用。
theological_decisions:
- issue: 恶与诡诈的终结由谁施行
  choice: 采用被动表达“必被抹去／必被熄灭”，不补出施事者
  alternative: 译作“上帝必抹去邪恶，并熄灭诡诈”
  rationale: 原文使用两个被动动词而未明说施事者；保留这一含蓄表达，避免添加原文没有明示的神学主语。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；两分句保持原文的被动平行结构。未收入英文咨询层脚注所载的另一译文，因为该内容对应后续拉丁文，而不对应本节所给原文。
