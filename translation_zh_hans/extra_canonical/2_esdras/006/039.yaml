  text: et erat tunc spiritus volans, et tenebrae circumferebantur et silentium, sonus vocis hominis nondum erat abs te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/039.yaml
  text: And at that time the spirit was moving[a], and darkness and silence were surrounding everything; the sound of a human voice was not yet from you.
translation:
  language: zh_hans
  text: 那时，灵正飞翔[a]，黑暗和寂静正弥漫着；人的声音还没有从你而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“风”或“气息”；“飞翔”也可译作“运行”。
    reason: 保留拉丁文 spiritus 的词义范围，以及 volans 可按具体或较中性的动态意义理解的可能。
lexical_decisions:
- source_word: spiritus
  choice: 灵
  rationale: “spiritus”可指灵、风或气息；在创世语境中译作“灵”最贴近传统语义，同时以脚注保留词义范围。
- source_word: volans
  choice: 正飞翔
  rationale: 直接体现拉丁文“volans”的动态意象；脚注列出较中性的“运行”，避免把具体动作解释得过死。
- source_word: tenebrae circumferebantur et silentium
  choice: 黑暗和寂静笼罩四周
  rationale: 以自然现代汉语表达黑暗与寂静环绕、遍布周围的状态，并保留两个并列主项。
- source_word: sonus vocis hominis
  choice: 人的声音
  rationale: 拉丁文直译为“人声的声响”，汉语中“人的声音”更自然，信息未受损。
- source_word: nondum erat abs te
  choice: 还没有从你而来
  rationale: 保留“abs te”所表达的来源或施动关系，不擅自限定为“由你创造”或“由你发出”。
theological_decisions:
- issue: spiritus在创世叙述中指“灵”还是“风/气息”
  choice: 正文译作“灵”，脚注保留“风”或“气息”
  alternative: 风正吹动；气息正运行
  rationale: 拉丁词本身具有多义性；正文采用最符合此处创世语境的“灵”，但不排除其他真实可能。
- issue: abs te表示来源还是创造/发声的施动者
  choice: 从你而来
  alternative: 由你发出；由你创造
  rationale: 较贴近原文并保留神学张力，不把含混的来源关系扩展为明确的创造行为。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“笼罩四周”使 circumferebantur 的环绕意象自然可读；末句刻意保留“从你而来”的来源表达，不替原文消除含混。
