  text: On the fifth day you said to the seventh part, where the water was gathered, that it should bring forth living creatures, birds, and fish;
translation:
  language: zh_hans
  text: 第五天，你吩咐第七部分，就是有水的地方，生出活物、飞鸟和鱼；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinto autem die
  choice: 第五天
  rationale: 自然表达时间次序；此处 autem 主要承接叙述，无须机械译出。
- source_word: dixisti
  choice: 你吩咐
  rationale: 在创造叙事语境中，此词指以话语发出命令，译作“吩咐”比单纯“说”更贴合其功能。
- source_word: septimae parti
  choice: 第七部分
  rationale: 保留拉丁文的序数与部分概念，不把其具体所指解释性地改写为“海洋”等。
- source_word: ubi erat aqua
  choice: 就是水聚集的地方
  rationale: 以自然中文表达水所在之处；采用英文本所保存的“聚集”这一创造叙事语境，同时维持拉丁文单数 aqua 的集合意义。
- source_word: living creatures, birds, and fish
  choice: 活物、飞鸟和鱼
  rationale: 所给拉丁文片段止于 aqua，后半句据经审校的英文咨询层补足；措辞保持类别并列，避免添加物种层面的解释。
theological_decisions:
- issue: “第七部分”的具体指代
  choice: 保留“第七部分”
  alternative: 解释为“水域”或“海洋”
  rationale: 原文表述本身较为特殊，直译可保留其宇宙论叙述中的张力，避免代入特定解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“活物、飞鸟和鱼”简明保留创造叙事的类别列举。所给拉丁文证据在 aqua 处中止，因此后半句谨依经审校的英文咨询文本呈现。
