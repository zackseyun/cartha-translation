  text: And year-old infants will speak with their voices[a], and pregnant women will give birth to premature infants of three and four months[b], and they will live.
translation:
  language: zh_hans
  text: 一岁的婴孩要开口说话[a]；孕妇将生下三个月或四个月的早产婴儿[b]，而且他们会活下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“用自己的声音说话”。
    reason: 保留原文措辞，并说明正文所采用的自然汉语表达。
  - marker: b
    text: 也可译作“未足月的婴儿”；“三个月或四个月”指这些早产婴儿的未成熟程度。
    reason: 说明 immaturos 的译法，并明确并列数字所描述的是未足月的异常情形。
lexical_decisions:
- source_word: anniculi infantes
  choice: 一岁的婴孩
  rationale: anniculi 表示约一岁，infantes 指婴幼儿；译文既保留年龄信息，也使用自然的现代汉语。
- source_word: loquentur uocibus suis
  choice: 开口说话
  rationale: 原文直译为“用自己的声音说话”；汉语中“开口说话”自然地表达一岁婴孩将发声说话这一异象，未增添原文没有的内容。
- source_word: immaturos ... infantes trium et quatuor mensium
  choice: 只有三四个月大的早产婴儿
  rationale: immaturos 表示未足月、过早出生；trium et quatuor mensium 指三个月和四个月大。用“只有……大的”清楚传达胎龄极短的反常情形。
- source_word: uiuent
  choice: 却能存活
  rationale: 基本义为“他们将活着/存活”。“却”显明这些极早产婴儿仍存活的反常对比，但不改变命题内容。
theological_decisions:
- issue: 异象性征兆中的反常出生与存活
  choice: 按原文直陈早产婴儿能够存活
  alternative: 将其解释为象征某种特定末世教义
  rationale: 本节只陈述征兆，未解释其象征含义；译文保留其张力，不导入宗派性末世解释。
translation_notes:
  register: 采用现代、庄重而通俗的叙述语体。正文以分号划分两个并列征兆，并用“却”自然呈现极早产而仍存活的反常性。所有脚注标记均已置于正文相应位置。
