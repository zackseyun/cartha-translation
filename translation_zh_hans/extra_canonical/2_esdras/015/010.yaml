  text: ecce populus meus quasi grex ad occisionem ducitur. iam non patiar illum habitare in terra Aegypti,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/010.yaml
  text: Behold, my people are being led like a flock to the slaughter. I will no longer allow them to dwell in the land of Egypt,
translation:
  language: zh_hans
  text: 看哪，我的子民如同畜群被牵去宰杀。我不再容许他们住在埃及地，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留引人注意的宣告语气，并符合庄重的经文体例。
- source_word: populus meus
  choice: 我的子民
  rationale: 自然表达所属关系，也保留“populus”作为一个群体的含义。
- source_word: quasi grex
  choice: 如同羊群
  rationale: “grex”本可泛指畜群；上下文涉及被牵去宰杀，译作“羊群”在汉语中形象自然，并与经文常见意象相合。
- source_word: ad occisionem ducitur
  choice: 被牵去宰杀
  rationale: 保留被动结构及走向死亡的目的含义；“牵去”与群畜意象协调。
- source_word: iam non patiar
  choice: 我不再容许
  rationale: 准确传达说话者将不再忍受或准许此事继续的意思。
- source_word: illum habitare
  choice: 他们住
  rationale: 拉丁文单数代词 illum 回指集合名词 populus；现代汉语以复数“他们”指群体成员更自然。
- source_word: terra Aegypti
  choice: 埃及地
  rationale: 保留传统而清楚的地理表达。
theological_decisions:
- issue: “埃及”是否具有象征意义
  choice: 直译为“埃及地”
  alternative: 按象征意义意译为压迫或流亡之地
  rationale: 原文明确使用地名 Aegypti，单节本身未要求将其解释为象征，故不加入额外神学诠释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“看哪”的宣告色彩和原文句末逗号所显示的未完语势；不增补主语身份或埃及的象征解释。
