  text: cum inebriata es? Exorna speciem uultus tui! Merces fornicariae in sinus tuos, propterea redditionem recipies. Sicut facies electis meis, dicit dominus, sic faciet tibi deus et tradet te in malis. Et nati tui fame interient, et tu rumphea cades, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/054.yaml
  text: When were you made drunk? Adorn the beauty of your face! The wages of a harlot are in your bosom[a]; therefore you will receive repayment.
translation:
  language: zh_hans
  text: 你什么时候喝醉了？[a] 装扮你的容貌吧！妓女的酬金就在你怀中；因此，你必得到报偿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文开头的 cum 可表示“什么时候”或“当……时／既然”；抄本标点将本句作为问句。
    reason: 原句 cum inebriata es? 在句法和标点上较为突兀，应向读者保留其真实歧义。
lexical_decisions:
- source_word: inebriata es
  choice: 喝醉了
  rationale: 保留完成式被动在此处表示进入醉酒状态的自然含义，并以阴性单数“你”继续城市女性化的拟人表达。
- source_word: Exorna speciem uultus tui
  choice: 把你的面容装扮得美丽吧
  rationale: 兼顾 exorna 的命令语气与 speciem vultus tui 所指的面容外观；中文采用自然的使役式表达。
- source_word: Merces fornicariae
  choice: 妓女所得的酬金
  rationale: fornicariae 是“妓女”的属格单数，不抽象化为“卖淫的酬金”，从而保留被责备对象如妓女般受拟人化的意象。
- source_word: in sinus tuos
  choice: 就在你怀中
  rationale: sinus 可指胸怀、衣襟或怀中；“怀中”既保留身体意象，也符合财物被收在身边的语境。
- source_word: redditionem recipies
  choice: 必得到相应的报偿
  rationale: 保留“按所行得到回报”的基本含义；“报偿”比单纯“偿还”自然，又不像“惩罚”那样提前消除原文措辞的张力。
theological_decisions:
- issue: 报偿的性质
  choice: 相应的报偿
  alternative: 报应／惩罚
  rationale: 上下文显然带有审判意味，但 redditionem 本身是“偿还、回报”，译文不直接改写成明确的刑罚术语，以保留原文由语境产生的负面力量。
- issue: 女性化拟人
  choice: 以“妓女”和“你”保留拟人意象
  alternative: 改译为抽象的“卖淫所得”
  rationale: 拉丁文 fornicariae 为阴性单数人物名词，指向被当作妓女责备的城市或群体；保留人物意象更贴近源文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。命令句保持讥讽性的修辞力度；“怀中”和“报偿”保留启示文学的形象与审判语气，而不添加宗派性解释。仅翻译本节在 recipies 处结束的内容；其后的 Sicut facies electis meis 属于后续经文。
