  yaml_path: translation/extra_canonical/2_esdras/015/005.yaml
  text: 'Behold, I am bringing evils upon the world, says the Lord: sword and famine and death and destruction,'
translation:
  language: zh_hans
  text: 看哪，主说，我要使灾祸临到世上：刀剑、饥荒、死亡和毁灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留原文引人注意并带有宣告色彩的提示语。
- source_word: induco ... super orbem terrarum
  choice: 使……临到世上
  rationale: 自然表达“带来并使之降临于全世界”的含义，同时保留主动施行的语气。
- source_word: mala
  choice: 灾祸
  rationale: 此处由刀剑、饥荒、死亡和毁灭具体说明，译作“灾祸”比泛指道德邪恶的“恶”更符合语境。
- source_word: gladium
  choice: 刀剑
  rationale: 保留其战争与暴力灾难的常见经文意象。
- source_word: famem
  choice: 饥荒
  rationale: 准确表达大范围缺粮的灾害。
- source_word: mortem
  choice: 死亡
  rationale: 采用直接、庄重的现代汉语对应词。
- source_word: interitum
  choice: 毁灭
  rationale: 与“死亡”有别，表达灭亡、彻底败坏的结果。
theological_decisions:
- issue: 灾祸的施行者
  choice: 保留第一人称“我要使灾祸临到世上”
  alternative: 弱化为“灾祸将临到世上”
  rationale: 原文明确以主为语法主语，不应弱化其中的神学张力。
- issue: mala 的性质
  choice: 译为“灾祸”
  alternative: 译为“恶事”或“诸恶”
  rationale: 后列的刀剑、饥荒、死亡和毁灭表明这里主要指灾难性祸患，而非道德意义上的邪恶。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“看哪”保留预言宣告的经文语体，并用冒号清楚引出四项灾祸。
