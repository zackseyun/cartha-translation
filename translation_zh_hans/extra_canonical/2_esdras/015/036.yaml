lexical_decisions:
- source_word: femur hominis
  choice: 人的大腿
  rationale: femur 指大腿；保留原文简洁的身体部位表述。
- source_word: suffraginem cameli
  choice: 骆驼的后腿关节
  rationale: suffrago 指动物后腿的关节、跗关节；用普通读者较易理解的功能性名称表达。
- source_word: timor et tremor multus
  choice: 充满恐惧和战栗
  rationale: 原文以 multus 强调整体程度；此译自然地表达极大的恐惧与颤抖，同时保留两个并列概念。
- source_word: super terram
  choice: 地上
  rationale: 准确、自然地对应“在大地之上／遍及大地”。
