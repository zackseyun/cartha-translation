  text: because they are faithful and true. Do not fear the thoughts against you, nor let the unbelief of those who speak against you trouble you.
translation:
  language: zh_hans
  text: 因为这些话可信而真实。不要害怕那些针对你的念头，也不要因那些反对你之人的不信而不安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fideles et ueri
  choice: 可信而真实
  rationale: 分别保留 fideles 的“可靠、可信”和 ueri 的“真实”之义，并使现代汉语表达自然庄重。
- source_word: cogitationibus aduersum te
  choice: 那些针对你的念头
  rationale: cogitationibus 直指思想、念头；aduersum te 表示敌对指向。避免将其具体化为原文未明说的“阴谋”。
- source_word: incredulitates
  choice: 不信
  rationale: 保留宗教语境中“不相信、不信从”的含义，不擅自改释为一般性的“怀疑”。
- source_word: contra dicentium
  choice: 反驳你的人的
  rationale: 该分词短语指说反对话、出言反驳的人；补出“你的”以符合汉语句法并承接 aduersum te 的语境。
- source_word: turbent
  choice: 使……不安
  rationale: 表达内心被搅扰、惊乱的状态，语气自然且不过度强化。
theological_decisions:
- issue: “不信”所指的性质
  choice: 保留为“不信”
  alternative: “怀疑”或“不忠”
  rationale: incredulitas 可涵盖不信或不肯相信；此处不将其限定为心理疑虑或道德不忠，以保留原文的神学张力。
- issue: 敌对者的思想是否指阴谋
  choice: 译作“针对你的念头”
  alternative: “针对你的阴谋”
  rationale: 原文 cogitationes 本身仅表示思想、意念；不加入“阴谋”所含的具体策划意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；两句之间保留因果承接，并以“也不要”再现拉丁文 nec 的并列否定。
