  yaml_path: translation/extra_canonical/2_esdras/015/018.yaml
  text: For because of their pride the cities will be thrown into confusion, the houses will be destroyed, and men will be afraid.
translation:
  language: zh_hans
  text: 因为他们的骄傲，城邑必陷入混乱，房屋必被摧毁，人们必感到惧怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter superbiam enim eorum
  choice: 因为他们的骄傲
  rationale: 直接保留原因关系；superbia 译为“骄傲”，自然且不额外限定为傲慢、自大或悖逆。句中的 enim 在本节孤立呈现时不宜机械译作“因为……所以”，以免汉语重复。
- source_word: civitates turbabuntur
  choice: 城邑必陷入混乱
  rationale: civitates 可指城市或城邑；“城邑”符合古代语境。被动态 turbabuntur 表示受到扰乱、陷入动荡，译为“陷入混乱”比“被扔进混乱”自然。
- source_word: domus exterentur
  choice: 房屋必被摧毁
  rationale: 按上下文将 domus 理解为实体房屋；exterentur 表达毁坏、灭除，采用清楚而庄重的“被摧毁”。
- source_word: homines metuent
  choice: 人们必感到惧怕
  rationale: homines 泛指人；metuent 是将来时，表达将要害怕。“感到惧怕”自然保留其心理状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；三个并列的将来结果均用“必”表达预告性质，并维持拉丁文的递进节奏。
