  text: And you[a], Asia, partner in the splendor of Babylon and in the glory of her person—
translation:
  language: zh_hans
  text: 亚细亚啊，你也与巴比伦的华美和她本人的荣耀有分[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里称亚细亚为与巴比伦有分者，反映出一个不同于《以斯拉四书》犹太核心部分的写作层次。此处的修辞属于较晚的拉丁基督教附录，通常称为《以斯拉六书》。
    reason: compositional_layer
lexical_decisions:
- source_word: Asia
  choice: 亚细亚
  rationale: 采用圣经语境中通行的历史地名译法，所指为罗马帝国的亚细亚地区，而非现代意义上的整个亚洲。
- source_word: consors
  choice: 与她有分
  rationale: 表达共同分享、同属一份的含义，并保留亚细亚与巴比伦之间关系的修辞张力，不将其具体化为政治同盟或道德同谋。
- source_word: specie Babylonis
  choice: 巴比伦的华美
  rationale: specie 在此可指外观、华丽或壮美；结合并列的 gloria，译作“华美”较自然，同时不过度限定为财富或权势。
- source_word: gloria personae
  choice: 她形貌的荣耀
  rationale: personae 可涉及人身、形貌或外在身份；“形貌”承接本句外观性的语义，又保留原文略显不寻常的表达。“她”按上下文指巴比伦。
theological_decisions:
- issue: 亚细亚与巴比伦“有分”的性质
  choice: 保持关系开放，不明确解释为有罪同谋、文化模仿或政治结盟
  alternative: 译作“巴比伦华美与荣耀的同谋”或“伙伴”
  rationale: 拉丁文 consors 表示共同有分，但本节本身没有明确界定这种关系的具体性质；直译为“有分”可保存其审判修辞与解释空间。
- issue: 文本层次说明
  choice: 在脚注中指出本段属于后期拉丁基督教附录的修辞层次
  alternative: 不作文本历史说明，或把它直接归入《以斯拉四书》的犹太核心
  rationale: 该说明有助于读者理解对亚细亚的称呼及其历史文学背景，同时不改变正文的神学措辞。
translation_notes:
  register: 采用庄重而自然的现代汉语。以“你也一样，亚细亚啊”再现直接呼告；句末破折号保留原段落向下文延展的未完语势。
