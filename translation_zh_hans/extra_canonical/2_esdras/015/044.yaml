  text: Babylonem et exterent eam. Conuenient ad ipsam et circuibunt eam et effundent sidus et omnem iram super eam, et subibit puluis et fumus usque ad caelum, et omnes in circuitu lugebunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/044.yaml
  text: Babylon[a], and they will destroy her. They will gather against her and surround her and pour out a storm and all wrath upon her, and dust and smoke will rise up to heaven, and all around her will mourn.
translation:
  language: zh_hans
  text: 巴比伦[a]；他们必毁灭她。他们必聚集到她那里，围住她，把星辰[b]和一切烈怒倾倒在她身上；尘土和烟雾必升到天上，她周围的人都必哀哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴比伦”在拉丁文本中承接上文，作“毁灭”的宾语；本节的谓语是“他们必毁灭她”。
    reason: 说明跨节句法，同时准确反映本节含有 exterent（“他们将毁灭”）。
  - marker: b
    text: 直译“星辰”；也有人依据语境理解为“风暴”。
    reason: 说明 sidus 的通常字面义及其可能的语境性理解，保留原文歧义。
lexical_decisions:
- source_word: exterent
  choice: 毁灭
  rationale: 该动词在此表示摧毁、消灭；用“毁灭”准确传达将来时和强烈的审判语气。
- source_word: conuenient ad ipsam
  choice: 聚集攻击她
  rationale: conuenient 表示聚集、会合，ad ipsam 指向她；结合随后“围困她”的敌对语境，补出“攻击”使现代汉语自然，同时不把聚集与围困合并。
- source_word: circuibunt eam
  choice: 围困她
  rationale: 字面为环绕她；军事审判语境中“围困”比单纯“环绕”更自然。
- source_word: sidus
  choice: 星辰
  rationale: sidus 的通常含义是星辰、天体。虽然“倾倒星辰”意象突兀，仍保留原文的末世异象语言，不按英文修订层的语境性解释直接改作“风暴”。
- source_word: omnem iram
  choice: 全部烈怒
  rationale: 保留 omnem 的总体性和 ira 的强烈审判意味。
- source_word: subibit
  choice: 必升到
  rationale: 表达向上升起的动作及将来意义。
- source_word: lugebunt
  choice: 必哀哭
  rationale: 该词表示哀悼、悲恸；原文未明说哀哭的对象，因此不补“为她”。
theological_decisions:
- issue: “星辰”作为被倾倒之物的异常审判意象
  choice: 在正文保留“星辰”
  alternative: 按上下文译为“风暴”
  rationale: 拉丁文 sidus 明指星辰或天体；即使意象难解，也不应在正文中以推测性的气象解释消除原有张力。
- issue: 末尾哀哭是否明确以巴比伦为对象
  choice: 译作“她周围的人都必哀哭”，不补宾语
  alternative: 译作“她周围的人都必为她哀哭”
  rationale: 拉丁文仅有 omnes in circuitu lugebunt，没有表示“为她”的成分；保留对象未明的状态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留本节开头因分节造成的句法断裂，并以脚注说明；审判意象用“倾倒”“烈怒”等清晰有力的词语呈现。
