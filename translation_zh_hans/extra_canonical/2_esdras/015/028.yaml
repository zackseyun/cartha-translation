  text: Behold, a dreadful vision, and its face is from the east.
translation:
  language: zh_hans
  text: 看哪，有一个可怕的异象，它的面来自东方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留引人注意、宣告异象的语气，符合庄重的经文体。
- source_word: visio horribilis
  choice: 一个可怕的异象
  rationale: visio 译为“异象”，horribilis 表达令人恐惧、骇然的性质，译作“可怕的”自然清楚。
- source_word: facies illius
  choice: 它的面
  rationale: 紧贴 facies 的“面、脸”之义，也保留原文将异象拟人化而形成的不寻常表达，不改释为较泛化的“形貌”或“显现”。
- source_word: ab oriente
  choice: 朝向东方
  rationale: 在 facies 的空间意象下，将 ab 依语境表达为面朝东方；比机械直译“来自东方”更符合现代汉语，同时保留东方这一方位信息。
theological_decisions:
- issue: facies ab oriente 的空间关系
  choice: 它的面朝向东方
  alternative: 它的面来自东方
  rationale: 拉丁语 ab 通常可表示“从、来自”，但与 facies 连用时语义略显含混。正文采用自然且具象的“面朝向东方”，同时不把“异象”具体认定为某个人物或势力。
translation_notes:
  register: 采用现代、庄重而易懂的经文语言；“看哪”保留宣告感，“它的面”刻意保留原文的拟人化与些许陌生感。
