  text: sicut facies electis meis, dicit Dominus, sic faciet tibi Deus et tradet te in malis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/056.yaml
  text: As you do to my chosen ones[a], says the Lord, so God will do to you and will hand you over to evils.
translation:
  language: zh_hans
  text: 主说：“你怎样对待我的选民，神也必怎样对待你，并把你交在种种灾祸中。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “种种灾祸”或译“诸般恶事”或“患难”。早先的译文“你的城邑必被粉碎，你田野里所有的人都必倒在刀下”实际对应下一节的拉丁文，并非本节原文。
    reason: 说明 malis 的词义歧义，并记录先前错置下一节文本的译法；正文中的脚注标记与此对应。
lexical_decisions:
- source_word: sicut facies electis meis
  choice: 你怎样对待我的选民
  rationale: 按拉丁文直译其对应结构；facies 在这里表示“你将怎样做/对待”，electis meis 为“我的选民”。
- source_word: sic faciet tibi Deus
  choice: 神也必怎样对待你
  rationale: 保留 sicut...sic...（怎样……也必怎样……）的对称和报应意味；将 tibi 自然译作“对待你”。
- source_word: tradet te in malis
  choice: 把你交在种种灾祸中
  rationale: tradet te 表示“把你交出/交付”；复数 malis 可指诸般恶事、患难或灾祸。上下文是审判警告，故正文采用自然且不暗示神作恶的“种种灾祸”。
theological_decisions:
- issue: 报应关系中的施行者称谓
  choice: 主说……神也必……
  alternative: 主说……他也必……
  rationale: 原文先用 Dominus 引出话语，随后明确用 Deus 作主语；译文保留这一称谓转换，不将其抹平。
- issue: in malis 的含义
  choice: 交在种种灾祸中
  alternative: 交给诸般邪恶／陷在患难中
  rationale: malis 具有“恶事、祸患、灾难”等语义空间。结合审判语境采用“灾祸”，同时用脚注保留原词的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怎样……也必怎样……”保留拉丁文的平行结构和审判语气；“选民”沿用常见圣经用语。
