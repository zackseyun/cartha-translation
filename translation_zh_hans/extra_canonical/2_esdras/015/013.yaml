review_pass:
  verdict: revise
  source_fidelity: 原文的劝令、农业灾害意象及三项毁坏因素均已传达。惟“种子必失收”在汉语中搭配不当：通常是庄稼或收成“失收”，而非种子本身；应明确为所播种子不能收成。
  naturalness: “耕种土地的人要哀哭”庄重自然。“种子必失收”不合现代标准汉语农业表达，改为“所播的种子必不能收成”更清楚自然。将“枯萎病”改作较宽泛的“病害”，避免把含义有弹性的 uredine 锁定为特定现代植物病名。
  terminology: “哀哭”“耕作土地的人”“冰雹”恰当。“可怕的星”保留 sidus 的天体指涉和未定性，不解释为彗星或灾星。uredine 可涵盖灼枯、锈病等植物灾害，译为“病害”较稳妥。
  issues:
  - severity: medium
    issue: “他们的种子必失收”
    rationale: “失收”的常规主语是作物、田地或收成，不是“种子”。该表述既不自然，也可能使读者难以把握 deficient semina 所指的播种落空、不能收成。
  - severity: low
    issue: “枯萎病”对 uredine 的限定偏窄
    rationale: uredine 的词义可指多类使植物受害、枯焦或生锈的灾害；没有语境依据将其确定为“枯萎病”。采用“病害”可保留原文的词义弹性。
  revised_text: 耕作土地的人要哀哭，因为他们所播的种子必不能收成，他们的树木必遭病害、冰雹和一颗可怕的星毁坏。
