- from: 耕种土地的人要哀哭，因为他们的种子必失收，他们的树木必遭枯萎病、冰雹和一颗可怕之星的毁坏。
  to: 耕作土地的人要哀哭，因为他们所播的种子必不能收成，他们的树木必遭病害、冰雹和一颗可怕的星毁坏。
  rationale: 修正“种子必失收”的不自然搭配，并以“所播的种子必不能收成”表达农业语境中种子落空的结果。以“病害”保留 uredine 的不确定植物灾害含义；其余措辞维持原文的庄重语气、被动毁坏意象与“可怕的星”的歧义。
