  text: Let those who cultivate the land mourn, because their seed will fail, and their trees will be laid waste by blight and hail and by a dreadful star.
translation:
  language: zh_hans
  text: 耕作土地的人要哀哭，因为他们所播的种子必不能收成，他们的树木必遭病害、冰雹和一颗可怕的星毁坏。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugeant
  choice: 要哀哭
  rationale: 保留拉丁语劝令式的语气，并采用自然、庄重的现代汉语表达。
- source_word: cultores operantes terram
  choice: 耕种土地的人
  rationale: 兼顾 cultores（耕作者）与 operantes terram（耕作土地）的含义，避免不必要地限定为现代职业意义上的“农民”。
- source_word: deficient semina eorum
  choice: 他们的种子必失收
  rationale: deficient 表示缺乏、落空或失败；结合农业语境译为“失收”，传达所播种子不能带来收成，同时不扩写具体原因。
- source_word: vastabuntur ligna eorum
  choice: 他们的树木必……遭毁坏
  rationale: ligna 在此农业灾害语境中自然指树木；vastabuntur 用被动表达严重毁坏。
- source_word: uredine
  choice: 枯萎病
  rationale: 拉丁语 uredo 可指灼枯、植物枯萎或锈病；“枯萎病”保留植物病害的宽泛含义，不武断限定为某一种现代病名。
- source_word: grandine
  choice: 冰雹
  rationale: 直接对应拉丁语 grando 的工具格形式，指雹灾。
- source_word: a sidus terribile
  choice: 一颗可怕之星
  rationale: 按传本拉丁文保留 sidus 的天体意象及其不确定性；不擅自解释为彗星、灾星或其他具体天象。
theological_decisions:
- issue: “可怕之星”的性质
  choice: 保留为“一颗可怕之星”
  alternative: 译作“灾星”或具体解释为彗星
  rationale: 原文只说 sidus terribile，没有明确其天文学类别或神学象征意义；直译可保留末世异象的张力与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“要哀哭”呈现劝令语气；全句保留预言性的“必”。未添加脚注，因为本节虽有词义空间，但正文可在不强行消歧的情况下自然呈现。
