translation_notes:
  register: 采用庄重而通顺的现代标准汉语。原文首尾都明显跨节衔接：开头保留“和死亡”的残句性质，结尾以“那时——”保存cum所造成的未完结构。英文脚注所述异文并不见于所给拉丁文本，且其标记附在“death”后容易误导，因此不纳入正文或脚注。
