  text: 和死亡。你力量的荣耀必像花一样枯萎，当……时——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortem
  choice: 死亡
  rationale: 按拉丁文保留本节开头与上文相连的宾格名词残句，不擅自补出本节未载的谓语。
- source_word: gloria uirtutis tuae
  choice: 你力量的荣耀
  rationale: gloria译为“荣耀”，uirtus在此指力量、威势；直译能够保留二者的修饰关系。
- source_word: sicut flos siccabitur
  choice: 必像花一样枯萎
  rationale: siccabitur本义为“将干枯”，用于花的意象时，“枯萎”是自然且准确的现代汉语。
- source_word: cum
  choice: 那时——
  rationale: 原始材料止于引导后续从句的cum。用破折号明确句意悬而未完，不从其他文本或旧译补入内容。
