id: 2ES.15.47
reference: 2 Esdras 15:47
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eius, Vae tibi, misera, propter quod adsimilasti ei, ornasti filias tuas in fornicatione ad placendum et gloriandum in amatoribus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/047.yaml
  text: Woe to you, miserable one, because you made yourself like her and adorned your daughters for prostitution, to please and glory in your lovers.
translation:
  language: zh_hans
  text: 祸哉，你这可怜的女子！因为你使自己与她相像，又装扮你的女儿们去行淫，好取悦你的情人，并以他们为荣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae tibi
  choice: 祸哉
  rationale: 保留先知性灾祸宣告的庄重语气，比单纯的“你有祸了”更凝练有力。
- source_word: misera
  choice: 你这可怜的女子
  rationale: misera 为阴性单数，既可表达悲惨、可怜，也呼应受斥责对象的女性拟人形象。
- source_word: adsimilasti ei
  choice: 使自己与她相像
  rationale: 按与格 ei 保留“与她相像”的关系，不进一步推断所指对象。
- source_word: ornasti filias tuas
  choice: 装扮你的女儿们
  rationale: 直译 ornasti 与 filias tuas，保留母女拟人意象及为后续行为作准备的含义。
- source_word: in fornicatione
  choice: 去行淫
  rationale: 在此语境中 fornicatione 指涉性不贞或卖淫行为；“行淫”既保留道德谴责，也不把含义限定为现代商业性交易。
- source_word: ad placendum et gloriandum in amatoribus
  choice: 好取悦你的情人，并以他们为荣
  rationale: 将两个目的动名词结构并列呈现；gloriari in 译为“以……为荣”，amatores 译为带有不正当关系意味的“情人”。
theological_decisions:
- issue: “行淫”是否应明确译作“卖淫”
  choice: 行淫
  alternative: 卖淫
  rationale: 拉丁文 fornicatione 可涵盖淫乱、性不贞或卖淫；上下文虽有装扮女儿取悦情人的意象，但原文未使用更专指商业卖淫的词，因此保留一定语义宽度。
- issue: gloriandum in amatoribus 的关系
  choice: 以他们为荣
  alternative: 在情人中炫耀
  rationale: gloriari in 通常表示以某人或某物夸耀；译文保留其对象关系，不额外解释为向情人炫耀自身。
translation_notes:
  register: 采用现代、庄重而清楚的先知性谴责语体；保留女性拟人、女儿及情人的意象，不补入拉丁原文没有的修饰语。
