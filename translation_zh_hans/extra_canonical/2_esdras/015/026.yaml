  yaml_path: translation/extra_canonical/2_esdras/015/026.yaml
  text: God knows those who sin against him[a]; therefore he will hand them over to death and slaughter.
translation:
  language: zh_hans
  text: 上帝知道那些得罪他的人[a]；因此，他必把他们交给死亡和杀戮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为上帝知道那些得罪他的人；”
    reason: 保留先前译法及其与上下文衔接的可能性，同时说明“因为”并非现存拉丁文本明写。
lexical_decisions:
- source_word: novit
  choice: 知道
  rationale: 直接表达拉丁文的认知动词；这里强调上帝清楚谁得罪他，不额外引入“认得”所可能暗示的关系含义。
- source_word: qui peccant in eum
  choice: 那些得罪他的人
  rationale: peccare in 加宾格表示“得罪、冒犯”；此译法比笼统的“犯罪”更清楚保留行为指向上帝的含义。
- source_word: tradet eos
  choice: 必把他们交给
  rationale: 保留 tradere 的“交付、交在……之下”含义，并以“必”体现将来时。
- source_word: in mortem et in occisionem
  choice: 给死亡和杀戮
  rationale: 保留两个并列名词及其严厉意象；“死亡”表示结局，“杀戮”表示暴力处死或毁灭。
theological_decisions:
- issue: 上帝的认识与审判之间的逻辑关系
  choice: 以分号连接，并译出“因此”
  alternative: 将前半句处理为“因为上帝知道……”，使其从属于更大语境
  rationale: 原文没有表示“因为”的连词，故不补入；propterea 明确表示后半句的结果或推论，应译为“因此”。
- issue: tradet 所表达的审判行动
  choice: 译作“必把他们交给”
  alternative: 译作“必使他们死亡并遭杀戮”
  rationale: “交给”保留原文中上帝将人置于死亡与杀戮之下的间接表达，不把它强化为原文未明说的直接执行。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“得罪他”准确、自然地传达 peccant in eum；“死亡和杀戮”刻意保留原文两个并列概念，不将其合并或弱化。
