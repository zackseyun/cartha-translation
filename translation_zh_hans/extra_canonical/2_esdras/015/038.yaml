  text: 从南方和北方，另有一部分从西方而来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a meridiano
  choice: 从南方
  rationale: meridianus 在方位语境中指“南方”；保留介词 a 所表达的来源方向。
- source_word: et septentrione
  choice: 和北方
  rationale: septentrio 指“北方”；承接前面的“从”，中文中无需重复也能清楚表达并列来源。
- source_word: portio alia
  choice: 另有一部分
  rationale: 直译为“另一部分”；加入“有”使现代汉语自然，同时不补定该“部分”具体所指。
- source_word: ab occidente
  choice: 从西方而来
  rationale: occidens 在此指“西方”；“而来”明确来源关系，使独立经节在中文中完整顺畅。
