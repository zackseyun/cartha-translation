  text: I will surely avenge them[a], says the Lord, and I will require from them all innocent blood for myself.
translation:
  language: zh_hans
  text: 主说：“我必为他们伸冤[a]，并要向他们追讨一切无辜者的血，使这血归到我这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我伸冤，必为他们伸冤。”这是原文加强语气的表达。
    reason: 说明拉丁文 vindicans vindicabo 的同源词强调结构，并保留其较直译形式供读者参考。
lexical_decisions:
- source_word: vindicans vindicabo
  choice: 我必为他们伸冤
  rationale: 拉丁文同源词叠用构成强调，意为确定、强烈地施行伸冤；现代汉语以“必”表达这一强调，避免生硬重复。
- source_word: accipiam ... sanguinem innocuum ex illis
  choice: 我要向那些人追讨一切无辜者的血
  rationale: 这里的“血”指无辜者被杀所造成的血债；“向……追讨”既符合审判语境，也保留从加害者那里索取偿还的方向。
- source_word: ad me
  choice: 归于我自己
  rationale: 直译保留原文不寻常的归向表达，不擅自将其解释为某种特定的赎罪或司法理论。
theological_decisions:
- issue: vindicare 的受益对象与含义
  choice: 为他们伸冤
  alternative: 替他们报仇
  rationale: “伸冤”兼具纠正不义和施行公正审判的含义，比“报仇”较少带私人复仇色彩，也与主作为说话者的司法语境相称。
- issue: 无辜之血的追讨
  choice: 保留“归于我自己”
  alternative: 省略该短语，或解释为“由我亲自追讨”
  rationale: 原文 ad me 明确存在但语义略显突兀；正文予以保留，以免消解其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主说”置于引语前以改善汉语行文；“必”传达原文的强调。“那些人”承接上下文中的迫害者，而“他们”指受害者。
