  yaml_path: translation/extra_canonical/2_esdras/015/025.yaml
  text: I will not spare them. Depart[a], you apostate children; do not defile my sanctification.
translation:
  language: zh_hans
  text: 我必不放过他们。离开吧，你们这些背道的儿女！不要玷污我的圣物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文 sanctificationem meam 直译为“我的神圣之物”或“我的圣洁之事”。该词也可指分别为圣、属于上帝的事物；这里与“玷污”连用，正文译为“我的圣物”，但原文未必专指“圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: non parcam illis
  choice: 我必不怜惜他们
  rationale: 直译拉丁文，保留将来时所表达的坚定审判语气。
- source_word: discedite
  choice: 离开吧
  rationale: 采用自然的复数命令表达；“吧”使现代汉语流畅，但不削弱命令语气。
- source_word: filii apostatae
  choice: 你们这些背道的儿女
  rationale: apostatae 表示离弃、背叛信仰者；“背道”准确而通俗。“儿女”保留 filii 在群体称呼中可涵盖男女的用法。
- source_word: sanctificationem meam
  choice: 我的圣物
  rationale: 该词字面可指“我的成圣/圣洁”，也可具体指分别为圣之物；与 contaminare（玷污）搭配时，“圣物”较自然，同时以脚注保留其语义宽度。
theological_decisions:
- issue: sanctificationem meam 所指为何
  choice: 正文译作“我的圣物”，并以脚注说明字面及其他可能含义
  alternative: 我的成圣；我的圣洁；我的圣所
  rationale: 拉丁文本没有明确限定为建筑意义上的“圣所”，不宜在正文中把所指过度具体化；“圣物”既适合“玷污”的语境，又保留对一切归属上帝圣洁之事物的开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“背道的儿女”保留先知式责备与亲属称谓之间的张力；句间标点强化审判宣告和命令的力度。
