  text: Woe to the world and to those who dwell in it![a]
translation:
  language: zh_hans
  text: 世界和住在其中的人有祸了！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“世代有祸了。”
    reason: 保留拉丁词 saeculum 可表示“世代、时代”的词义歧义。
lexical_decisions:
- source_word: vae
  choice: 有祸了
  rationale: 保留先知性灾祸宣告的语气；现代中文自然庄重，也比单用“祸哉”更易懂。
- source_word: saeculo
  choice: 这世界
  rationale: saeculum 可指“世代/时代”或“世界”；此处与“住在其中的人”搭配，空间意义“世界”更为自然，同时以脚注保留词义歧义。
- source_word: qui habitant in eum
  choice: 住在其中的人
  rationale: 贴近拉丁文，清楚表达居住于该世界之人，并保留原句对世界及其居民并列宣告灾祸的结构。
theological_decisions:
- issue: saeculum 是末世论的“时代”还是空间意义的“世界”
  choice: 正文采用“世界”
  alternative: 世代／时代
  rationale: 本节位于后期灾变语境，且 habitant in eum（住在其中）强烈支持空间意义；但不排除“时代”这一真实词义，故在脚注中注明。
translation_notes:
  register: 采用现代、庄重而通俗的灾祸宣告句式；正文中的[a]与脚注对应。
source_grounding:
  english_pob_role: consult_only
