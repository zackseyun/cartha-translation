- issue: “想起自己的来历”的晦涩意象
  choice: 正文保留这一反常表达，并加文本说明
  alternative: 按推测改写为更顺畅的历史或军事陈述
  rationale: 拉丁文本本身晦涩，应保存真实的不确定性，而非以神学或历史推断消除张力。
