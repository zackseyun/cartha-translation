lexical_decisions:
- source_word: supervalescet
  choice: 必占上风
  rationale: 表达其将变得强盛并压倒对方的将来含义，也符合争战语境。
- source_word: draco
  choice: 那龙
  rationale: 直译其末世异象意象，不擅自指明所象征的国家或势力。
- source_word: nativitatis memoria suae
  choice: 想起自己的来历
  rationale: 按 memoria 与 nativitatis suae 的可能关系译出“记得／想起自身起源”，同时以脚注保留原文措辞和句法的晦涩。
- source_word: conspirantes
  choice: 联合起来
  rationale: 在军事追赶的语境中表示结盟、合力；避免“密谋”在现代汉语中过度强调秘密策划。
- source_word: in virtute magna
  choice: 以强大的力量
  rationale: 保留 virtus 在此处表示力量、实力的意义。
- source_word: persequendos eos
  choice: 追赶他们
  rationale: 以目的性表达追击、追赶；代词所指按原文保留，不擅自澄清。
