  text: 主说：“你若不是一向杀害我所拣选的人，一面拍手欢庆，一面谈论他们的死，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dicit dominus
  choice: 主说
  rationale: 按拉丁文保留本节开头的引语提示，简洁自然。
- source_word: Nisi occidisses
  choice: 你若不是……杀害
  rationale: 保留 nisi 加虚拟式所形成、尚待下节完成的条件句，不在本节擅自补足结论。
- source_word: electos meos
  choice: 我所拣选的人
  rationale: 准确表达 electos 的被拣选含义，又比名词化的“我的选民”稍少预设群体身份。
- source_word: in omni tempore
  choice: 一向
  rationale: 在此表示持续一贯的行为；“一向”符合现代汉语，也避免生硬译作“在所有时候”。
- source_word: exultans percussione manuum
  choice: 一面拍手欢庆
  rationale: percussio manuum 字面为手的拍击；与 exultans 连用时自然指拍手庆幸、幸灾乐祸。
- source_word: dicens super mortem eorum
  choice: 一面谈论他们的死
  rationale: 保留 dicens 的言说动作及 super 的宽泛关系，不把未明说的具体话语内容补入译文。
theological_decisions:
- issue: “我所拣选的人”的身份
  choice: 不具体界定其所属群体
  alternative: 译成带特定群体意味的“我的选民”
  rationale: 原文只称 electos meos，本节不足以进一步限定其身份。
- issue: 未完条件句的处理
  choice: 保留句法悬置，以逗号结尾
  alternative: 从下一节补入条件结果或疑问内容
  rationale: 本节原文止于 eorum；补入下一节会混淆经节边界，并提前消解原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。保留本节作为跨节未完句的形态；“拍手欢庆”体现恶意庆幸的语境，但不额外加入“幸灾乐祸”等解释性措辞。
