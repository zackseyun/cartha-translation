lexical_decisions:
- source_word: Filios tuos
  choice: 你的儿子
  rationale: 拉丁文 filios 明确为阳性复数“儿子”，因此不泛化为“儿女”。
- source_word: captiuos ducent
  choice: 掳走
  rationale: 直译为“作为俘虏带走”；“掳走”以自然、简洁的现代汉语表达被强行带去作俘虏。
- source_word: censum tuum
  choice: 你的财产
  rationale: census 在此指可被敌人夺取的财物或财富；“财产”比“税赋”更符合劫掠语境，同时避免过度限定其范围。
