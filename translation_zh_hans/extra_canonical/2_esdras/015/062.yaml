  text: 他们必把你的儿子掳去作俘虏；你的财产……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在本节末止于“以及你的财产”，句子未完，未明载其后的谓语或对财产所作的行动；省略号保留这一未完结构。
