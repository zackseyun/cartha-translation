  text: et superinvalescent venti ab oriente et recludent eum et nubem quam suscitavit in ira, et sidus ad faciendam exteritionem ab orientalem notum et occidentem violabitur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/039.yaml
  text: And the winds from the east will grow strong and shut it in[a], along with the cloud that he raised up in wrath; and the star appointed to bring destruction will be violently assailed by the east wind, the south wind[b], and the west wind.
translation:
  language: zh_hans
  text: 东方的众风必越发强盛，把它和他在震怒中兴起的云一同封闭起来[a]；那颗为施行毁灭的星，必遭东风、南风[b]和西风猛烈冲击。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节是本章拉丁文本中较难解释的一处。这里按东方诸风把某物连同云封闭起来理解，但句法、代词所指及各异象之间的关系都不确定。
    reason: textual_variant
  - marker: b
    text: 另一种断句和理解是：“以及他在震怒中兴起的云；那颗为向东、西施行毁灭的星，必陷入混乱。”不过，这种解释较难说明原文中的“南风”和介词所表示的施事关系。
    reason: previous_rendering
lexical_decisions:
- source_word: superinvalescent
  choice: 越发强劲
  rationale: 表达加强语气的前缀 super- 与将来时含义，符合风势增强的语境。
- source_word: recludent
  choice: 封闭起来
  rationale: 保留“关闭、封住”的基本意义；其宾语和指代关系在残存拉丁文中并不完全清楚。
- source_word: nubem quam suscitavit in ira
  choice: 他在震怒中兴起的云
  rationale: 紧贴宾格 nubem 及关系从句；“他”的所指按原文保留，不擅自明确。
- source_word: sidus ad faciendam exteritionem
  choice: 那颗受命施行毁灭的星
  rationale: 将目的结构自然表达为被指定承担毁灭使命，同时保留宇宙异象的意象。
- source_word: violabitur
  choice: 必遭……猛烈冲击
  rationale: 该被动动词可表达遭侵袭、摧残；结合诸风作施事者，以“猛烈冲击”呈现其强烈程度。
- source_word: ab orientalem notum et occidentem
  choice: 遭东风、南风和西风
  rationale: 按晚期拉丁语 ab 加宾格理解为施事或来源；notus 指南风，而非笼统的“南方”。
theological_decisions:
- issue: “他”在震怒中兴起云的身份
  choice: 保留代词“他”
  alternative: 明确作“上帝”
  rationale: 本节拉丁文本身只有动词第三人称单数所隐含的主语；不在译文中补入神学身份。
- issue: 星与毁灭的关系
  choice: 受命施行毁灭
  alternative: 为毁灭而出现
  rationale: 目的结构说明这星与施行毁灭有关，但未说明是谁任命；译文不补出任命者。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“震怒”“施行毁灭”保留启示文学语体；对破损且句法不稳的拉丁文不作过度顺畅化，并以脚注明确不确定性。
