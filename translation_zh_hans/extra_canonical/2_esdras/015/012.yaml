id: 2ES.15.12
reference: 2 Esdras 15:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugeat Aegyptus et fundamenta eius a plaga verberati et mastigati quam inducet Dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/012.yaml
  text: Let Egypt mourn[a], and its foundations, because of the plague of blows and scourging that the Lord will bring upon it.
translation:
  language: zh_hans
  text: 埃及及其根基都要哀哭，因为主要降下击打和鞭笞之灾。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击打和鞭笞之灾”：拉丁文此处结构不甚规整，也可理解为“遭击打和鞭笞的灾祸”；两个词都强调猛烈的身体击打。
    reason: 保留原文语法关系的不确定性，并说明两个近义词叠加所形成的强烈语气。
lexical_decisions:
- source_word: lugeat
  choice: 要哀哭
  rationale: 以自然的现代汉语表达拉丁语虚拟式在命令、宣告语境中的语气，同时保留公开哀悼的意味。
- source_word: fundamenta eius
  choice: 其根基
  rationale: 直译“它的根基”，保留可指埃及根基、根本或基础的形象，不擅自具体化。
- source_word: plaga
  choice: 灾
  rationale: 在审判语境中可指灾祸、打击；与后面的击打和鞭笞合译为“……之灾”，简洁而有力度。
- source_word: verberati et mastigati
  choice: 击打和鞭笞
  rationale: 保留两个近义暴力词的叠加效果；“鞭笞”准确传达 mastigati 的具体身体惩打含义，避免弱化为泛指的“惩戒”。
- source_word: inducet Dominus
  choice: 主要降下
  rationale: inducet 表示使某事来临或带来；灾祸语境中“降下”自然、庄重，也明确主是施行动作的一方。
theological_decisions:
- issue: 灾祸的施行者
  choice: 明确译作“主要降下”
  alternative: 译作“将临到”而淡化主的主动作用
  rationale: 拉丁文明确以 Dominus 为 inducet 的主语，因此保留主主动带来灾祸的表述。
- issue: verberati et mastigati 的语法关系
  choice: 理解为说明 plaga 特征的两个名词性概念，即“击打和鞭笞之灾”
  alternative: 译作“遭击打、受鞭笞者的灾祸”
  rationale: 现存拉丁文词形和结构不够规整；结合并列词的语义及上下文，将其理解为灾祸的具体表现最为通顺，但在脚注中保留结构上的不确定性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“哀哭”“根基”“降下”保留启示文学的宣告感；避免使用生僻古语，也不把具象的“鞭笞”弱化为抽象的“惩戒”。
