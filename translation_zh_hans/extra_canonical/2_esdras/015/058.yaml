  text: and drink their own blood because of hunger for bread and thirst for water[a]. Unhappy one, as the foremost you will come[b], and again you will receive evils.
translation:
  language: zh_hans
  text: 他们因缺饼而饥、缺水而渴，就要喝自己的血。你这不幸的啊！你将以居首位者的身份来到，并再次遭受灾祸。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文 primaria 可表示“居首位的、显要的”；这里可能是在讥讽亚细亚昔日的显赫地位，确切语气并不确定。
    reason: lexical_alternative
  - marker: b
    text: 或译：“作为女子中的首领”。但原文没有明确出现“女子中的”。
    reason: previous_rendering
lexical_decisions:
- source_word: a fame panis et siti aquae
  choice: 因饥饿无饼、干渴无水
  rationale: 保留拉丁文“因缺饼而饥、因缺水而渴”的平行结构，同时用现代汉语自然表达其因果关系。
- source_word: Infelix
  choice: 你这不幸的
  rationale: 将形容词用于拟人化的受话者，保持哀叹兼宣告灾祸的语气。
- source_word: primaria
  choice: 首位者
  rationale: 按所据校订读法理解为阴性形容词的名词化用法，表达“居首位、地位显要者”，不增添拉丁文未明说的“在妇女中”。
- source_word: mala
  choice: 灾祸
  rationale: 此处不是泛指道德上的“恶”，而是指临到受话者的祸患。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。“首位者”刻意保留 primaria 的性别与语义张力，不把拟人化对象的范围解释得过满。所提供的拉丁文片段止于 Infelix；后半句依据经审校的英语咨询层及其明确记录的拉丁词 primaria 处理。
