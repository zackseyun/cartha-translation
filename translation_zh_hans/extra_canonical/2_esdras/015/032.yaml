  text: et isti turbabuntur et silebunt in virtute illorum et convertent pedes suos in fugam,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/032.yaml
  text: then these will be thrown into confusion and fall silent because of their strength[a], and they will turn their feet to flight.
translation:
  language: zh_hans
  text: 那时，这些人必陷入混乱，因他们的力量而默不作声[a]，并掉转脚步逃跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“面对他们的力量而默不作声”。
    reason: 拉丁语介词 in 可使该短语理解为原因，也可理解为面对或处于其力量之下；两种读法均不把主动词 silebunt 改成被动。
lexical_decisions:
- source_word: turbabuntur
  choice: 必陷入混乱
  rationale: 该词为将来时被动形式，可表示“受到扰乱、陷入慌乱”；此处用自然的中文状态表达，同时保留其受外力震慑的意味。
- source_word: silebunt
  choice: 默不作声
  rationale: 该词是主动形式，意为“沉默、不作声”，不译成被动的“被压得无话可说”。
- source_word: in virtute illorum
  choice: 因他们的力量
  rationale: 介词短语在此最自然地表达原因，即这些人由于对方的力量而沉默；“他们”所指承接上下文，不在本节擅自明定。
- source_word: convertent pedes suos in fugam
  choice: 掉转脚步逃跑
  rationale: 保留“脚步”的原文意象，并以现代汉语自然表达转而逃亡的动作。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”体现拉丁语将来时在预言语境中的确定语气；句法尽量贴近原文，同时避免生硬直译。
