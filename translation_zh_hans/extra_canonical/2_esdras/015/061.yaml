  text: They will be fire to you. And they will devour you and your cities, your land and your mountains; all your forests and your fruitful trees they will burn with fire.
translation:
  language: zh_hans
  text: 他们对你必如烈火，吞噬你和你的城邑、你的土地和山岭；你所有的森林和结果子的树木，他们都要用火焚烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erunt tibi ignis
  choice: 他们对你必如烈火
  rationale: 保留拉丁文“对你成为火”的意象，同时用现代汉语自然表达其敌对和毁灭性的作用。
- source_word: deuorabunt
  choice: 吞噬
  rationale: 对应“吞吃、吞灭”的强烈毁灭意象，比一般的“毁坏”更贴近原词。
- source_word: ciuitates
  choice: 城邑
  rationale: 既可涵盖城市和设防聚落，又保持庄重的经文语体。
- source_word: ignis
  choice: 火／烈火
  rationale: 首句用“烈火”使比喻自然有力，末句用“火”直译焚烧的手段，避免重复显得生硬。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句保留“成为火”的比喻，不把其明确解释为战争、审判或某种特定灾害。后半句依据经审核的英文咨询层补足；用户所附拉丁文本在 terram（“土地”）处截断。
