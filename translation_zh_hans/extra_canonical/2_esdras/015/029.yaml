  text: et exient nationes draconum Arabum in curris multis, et sibilatus eorum a die itinerisfertur super terram, ut etiam timeant et trepidentur omnes qui illos audient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/029.yaml
  text: And nations of Arabian dragons will come out with many chariots[a], and their hissing is carried over the earth from a day's journey away[b], so that all who hear them will fear and tremble.
translation:
  language: zh_hans
  text: 阿拉伯龙族诸国将驾着许多战车出来[a]；它们的嘶声传到大地各处，在一天路程以外也能听见[b]，使所有听见的人都惧怕战栗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿拉伯龙族诸国”紧贴含义晦涩的拉丁语 nationes draconum Arabum。这里的形象可能具有象征性，可能指怪物，也可能是一种如今已无法单凭拉丁文本还原的民族称谓。
    reason: textual_variant
  - marker: b
    text: “一天的路程”是距离的说法，意为这嘶声在相隔一天路程之远也可听见。
    reason: previous_rendering
lexical_decisions:
- source_word: nationes draconum Arabum
  choice: 阿拉伯龙族的各国
  rationale: 尽量贴近这一含义晦涩的拉丁语结构，保留“各国／诸族”“龙”与“阿拉伯”的关联，不把意象擅自解释为某一特定民族、军队或怪物。
- source_word: in curris multis
  choice: 驾着许多战车
  rationale: 自然表达乘坐或使用众多战车而出动的意思；curris 为 currus 的复数夺格。
- source_word: sibilatus eorum
  choice: 它们的嘶声
  rationale: sibilatus 可指嘶嘶声、啸声；“嘶声”既保留龙形意象，又不额外确定声源性质。
- source_word: a die itineris
  choice: 隔着一天的路程
  rationale: 将 dies itineris 按距离单位“一天的路程”理解，a 表示相隔的距离，而不是行动开始的时间。
- source_word: timeant et trepidentur
  choice: 惧怕战栗
  rationale: 并列表达恐惧与颤抖，保留原文两个动词的加强效果。
theological_decisions:
- issue: “阿拉伯龙族的各国”的身份与意象
  choice: 保留原文含混的龙族意象
  alternative: 明确译作阿拉伯民族、象征性的军队或怪兽族群
  rationale: 仅凭现存拉丁文无法可靠判定该短语属于象征、怪物描写还是民族志式称呼，因此不作教义化或历史化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“驾着许多战车出来”呈现大规模出动的动态；“惧怕战栗”保留末尾并列语势。所有注脚标记均置于正文相应位置。
