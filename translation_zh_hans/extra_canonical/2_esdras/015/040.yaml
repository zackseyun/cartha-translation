  text: et exaltabuntur nubes magnae et validae plenaeirae et sidus, ut exterant omnem terram et inhabitantes eam, et fundent super omnemaltum et eminentem sidus terribile.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/040.yaml
  text: And great and mighty clouds full of wrath[a], and a star, will be lifted up to destroy all the earth and those who dwell in it, and they will pour out a dreadful star upon every high and lofty place.
translation:
  language: zh_hans
  text: 满载愤怒的巨大而强盛的云彩，以及一颗星，都将升起，要毁灭全地和住在地上的人；这些云和那颗星要把一颗可怕的星倾泻在每一处高耸之地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每一处高耸之地”：拉丁文直译近于“每一个高而突出的”，中心词可能省略；也可理解为“每一个高大显赫之物”。
    reason: 原文形容词组的中心词未明，译作地点虽合语境，却不宜掩盖语法和指称上的不确定性。
lexical_decisions:
- source_word: nubes magnae et validae
  choice: 巨大而威力强盛的云团
  rationale: 既保留 magnae 与 validae 的双重修饰，也以“云团”自然表达复数 nubes。
- source_word: plenae irae
  choice: 满载愤怒的
  rationale: 保留属格结构所表达的“充满愤怒”，并维持原文拟人化、审判性的意象。
- source_word: exaltabuntur
  choice: 都将升起
  rationale: 该词为复数，统摄“云团”和“星”；中文用“升起”自然表达其向上出现的图景，不擅自补出施动者。
- source_word: sidus
  choice: 星
  rationale: 两次出现均直译为“星”，保留原文同一词语的重复及其异象性。
- source_word: fundent super
  choice: 倾泻在
  rationale: 保留 fundere 的液体倾倒意象，即使其宾语“星”在语义上不同寻常，也不将其改写为较常规的动作。
- source_word: omnem altum et eminentem
  choice: 每一处高耸之地
  rationale: 拉丁文形容词组似省略了“地方”等中心词；中文补出“之地”以成句，同时保留“高而突出”的空间意义。
theological_decisions:
- issue: “云团”和“星”是否同为升起并施行动作的主体
  choice: 按并列主体处理，并以“都”“它们”指代二者
  alternative: 把“星”理解成云中所充满的内容
  rationale: sidus 是中性主格形式，不能与 plenae 构成“充满星”的结构；复数 exaltabuntur 和 fundent 也支持并列主体。
- issue: 是否把异象中的第二个“星”解释为火、灾祸或陨石
  choice: 保留为“星”
  alternative: 按具体灾象意译为“流星”“火焰”或“灾祸”
  rationale: 原文 sidus 本身未作这种限定；保留措辞可避免过早消解经文的异象张力。
translation_notes:
  register: 采用庄重而清楚的现代汉语。“满载愤怒”“倾泻……星”有意保留拉丁文强烈且反常的末世异象；不以解释性词语替换。
