  to: 满载愤怒的巨大而强盛的云彩，以及一颗星，都将升起，要毁灭全地和住在地上的人；这些云和那颗星要把一颗可怕的星倾泻在每一处高耸之地[a]。
  rationale: 将“连同”改为“以及”，明确云彩和星同为“将升起”及后续动作的主体；略微调整云的措辞以合现代汉语；并将脚注锚点移至所注释的短语之后。其余保留原译对异象性与语法歧义的谨慎处理。
