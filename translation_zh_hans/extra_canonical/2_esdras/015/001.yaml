  yaml_path: translation/extra_canonical/2_esdras/015/001.yaml
  text: Behold, speak in the hearing of my people the words of prophecy
translation:
  language: zh_hans
  text: 看哪，你要向我的子民宣讲预言的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce
  choice: 看哪
  rationale: 保留原文用于引起注意的庄重提示语，也符合经文体例。
- source_word: loquere in aures
  choice: 向……宣讲
  rationale: 拉丁文直译为“说在……耳中”；此处自然表达为让众人亲耳听见的公开传讲。“宣讲”既传达说话行为，也避免生硬的“对着耳朵说”。
- source_word: plebi meae
  choice: 我的子民
  rationale: plebs 在此指上帝所属的民众；“子民”庄重而通俗，并清楚体现 meae 的归属关系。
- source_word: sermones prophetiae
  choice: 预言的话
  rationale: 按原文保留“话”与“预言”的属格关系，不擅自限定为某一则预言或某种特定预言体裁。
theological_decisions:
- issue: “预言的话”的性质与范围
  choice: 保留概括性的“预言的话”
  alternative: “这预言的信息”或“众先知的话”
  rationale: 原文 sermon(es) prophetiae 未说明是单一信息，也未指向多位先知；因此不补入原文没有的限定。
translation_notes:
  register: 采用现代、庄重且可诵读的普通话。“看哪”保留经文语域；其余措辞避免机械拉丁式表达。
