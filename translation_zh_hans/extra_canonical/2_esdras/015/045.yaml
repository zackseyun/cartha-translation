lexical_decisions:
- source_word: subremanserint
  choice: 留下来的人
  rationale: 准确表达“其后仍留下、剩余”的意思，不额外强化为“幸存”。
- source_word: servient
  choice: 必服事
  rationale: 保留拉丁语“服事、受役于”的基本含义及预言语气，不擅自明确为奴役。
- source_word: exteruerunt
  choice: 使她惊恐
  rationale: 按 exterrere 的完成时形式理解，译出“使……惊恐”，而不是缺乏依据的“毁灭”。
