  text: et conlident se invicem et effundent sidus copiosum super terram et sidus illorum, et erit sanguis a gladio usque ad ventrem equi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/035.yaml
  text: And they will strike one another and pour out an abundant storm upon the earth[a], their storm[b]; and there will be blood from the sword up to the horse's belly.
translation:
  language: zh_hans
  text: 他们将彼此相击，把一场浩大的风暴倾泻在地上[a]，又倾泻他们的风暴[b]；血将从刀剑一直到马腹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文 sidus 在这里及本段中均为单数。它通常可指“星”，也可指“风暴”；在末世异象的语境中，还可能指天象征兆。这里依上下文译作“风暴”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把一颗巨大的星倾泻在地上，又倾泻他们的星。”
    reason: previous_rendering
lexical_decisions:
- source_word: conlident se invicem
  choice: 彼此冲撞
  rationale: 保留动词所表达的相互碰撞、交战之意；比单纯的“彼此击打”更贴近 conlidere 的力度。
- source_word: sidus copiosum
  choice: 滂沱的风暴
  rationale: sidus 虽通常指“星”，但也有“风暴”之义；effundent（倾泻）和 copiosum（丰沛、大量）在此更支持风暴语境。“滂沱”自然传达其倾泻而下且量大的形象。
- source_word: a gladio usque ad ventrem equi
  choice: 从刀剑之处一直涨到马腹
  rationale: 保留原文从“刀剑”到“马腹”的不寻常范围表达，并用“涨到”呈现血水达到马腹高度的末世战争图景。
theological_decisions:
- issue: sidus 的末世意象
  choice: 正文译作“风暴”，脚注保留“星”或天象征兆的可能
  alternative: 星；天象征兆
  rationale: 上下文和动词搭配明显偏向“风暴”，但该词的常用义确为“星”，不应把原文的词义张力完全抹去。
- issue: sidus illorum 与前句的关系
  choice: 译作同位说明“那是他们的风暴”
  alternative: “以及他们的风暴”
  rationale: 拉丁文重复 sidus 且结构生硬；采用同位式可形成可读的中文，同时不把它解释成另一场独立风暴。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“滂沱的风暴”兼顾 copiosum 的丰沛感与 effundent 的倾泻形象；分号保留原句由相互攻击、风暴转入血流成河景象的推进。
