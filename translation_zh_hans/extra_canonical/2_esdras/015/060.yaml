review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了攻打安逸之城、蹂躏土地、毁去部分荣耀、从被倾覆的巴比伦归回，以及禾秸与烈火的比喻。惟拉丁文 rursum（“再次、再度”）修饰 reuertentes（“归回”），现译漏译，需补出。
