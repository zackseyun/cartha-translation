  yaml_path: translation/extra_canonical/2_esdras/015/060.yaml
  text: They will strike the idle city and lay waste some portion of your land, and they will destroy part of your glory, returning again from devastated Babylon. And you will be broken down by them like stubble, and they will be to you like fire.
translation:
  language: zh_hans
  text: 他们必攻击那安逸之城，使你土地的一部分荒废，毁灭你荣耀的一部分；他们要从已被摧毁的巴比伦再次返回。你必被他们摧毁，如同禾秸；他们必如烈火临到你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ciuitatem otiosam
  choice: 那安逸之城
  rationale: otiosam 在此可指安闲、无所戒备或安逸；“安逸之城”保留其负面语气，又不额外断定是懒惰还是太平无忧。
- source_word: exterent aliquam portionem terrae tuae
  choice: 使你土地的一部分荒废
  rationale: exterent 有磨灭、蹂躏、毁坏之意；结合战争语境译为“使……荒废”，自然表达土地遭破坏的结果。
- source_word: partem gloriae tuae exterminabunt
  choice: 毁灭你荣耀的一部分
  rationale: 保留 gloria 的“荣耀”及原文较含混的指涉，不擅自具体化为财富、建筑或居民。
- source_word: a Babylonia subuersa
  choice: 从已被摧毁的巴比伦
  rationale: subuersa 表示被倾覆、摧毁；用“已被摧毁”清楚呈现完成状态。
- source_word: pro stipula
  choice: 如同禾秸
  rationale: stipula 指收割后留下的秸秆或碎秸，常带易被焚毁之意；“禾秸”简洁而具经文意象。
theological_decisions:
- issue: “你荣耀的一部分”所指为何
  choice: 保留抽象表达“荣耀”
  alternative: 解释为城邑、财富、圣所或显贵之人
  rationale: 拉丁文仅作 gloriae tuae，无法据本句确定具体所指；直保留可避免加入特定历史或神学解释。
- issue: 返回动作与巴比伦被毁的关系
  choice: 译作“他们要从已被摧毁的巴比伦返回”
  alternative: 译作“他们返回，再度摧毁巴比伦”
  rationale: a 表示“从”，subuersa 与 Babylonia 一致，最自然是“从被摧毁的巴比伦返回”；不把“再度”误连于摧毁巴比伦。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“你”延续原文对城市或其所代表群体的单数第二人称称呼；保留“荣耀”“禾秸”“烈火”等核心意象，不作解释性扩写。
