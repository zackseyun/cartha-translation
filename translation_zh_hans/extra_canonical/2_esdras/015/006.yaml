  text: propter quod superposuit iniquitas omnem terram et adimpletae sunt operationes eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/006.yaml
  text: because iniquity has spread over the whole earth[a], and their deeds have been filled up.
translation:
  language: zh_hans
  text: 因为不义已经覆盖全地，他们的所作所为也已满盈[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已满盈”也可理解为“已经完成”或“已经达到满数”。
    reason: 说明 adimpletae sunt 在“充满、达到满数”与“完成”之间的语义幅度，避免正文单方面消解其含混性。
lexical_decisions:
- source_word: propter quod
  choice: 因为
  rationale: 按因果连接语处理，承接上下文并引出本句所述原因；现代汉语中简明自然。
- source_word: superposuit iniquitas omnem terram
  choice: 不义遍布全地
  rationale: superposuit在此表达覆盖、扩展到全地；译作“遍布”比逐字译为“加在……之上”更符合汉语，同时保留其范围遍及全地的意思。iniquitas译为“不义”，不额外限定为某一种罪恶。
- source_word: operationes eorum
  choice: 他们的所作所为
  rationale: operationes指他们所做的事或行为；“所作所为”自然且不擅自加入拉丁原文没有的“有害”一义。
- source_word: adimpletae sunt
  choice: 已满盈
  rationale: 保留“被充满、达到满数”的意象，也符合审判语境中的庄重表达；不把潜在含义收窄为单纯“完成”。
theological_decisions:
- issue: 他们的行为“满盈”所表达的含义
  choice: 正文保留“满盈”的比喻
  alternative: 译作“已经完成”或“已经达到极点”
  rationale: 拉丁文adimpletae sunt既可突出充满、达到满数，也可能指完成。正文保留较贴近词形且具有神学张力的“满盈”，脚注说明另一种理解。
- issue: 是否把operationes明确译成恶行或有害的行为
  choice: 译为中性的“所作所为”
  alternative: “恶行”或“有害的行为”
  rationale: 所据拉丁文本只有operationes eorum，没有表示“有害”或“邪恶”的修饰词；虽有“不义”的语境，也不应把语境推断写进该词本身。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不义”“满盈”保留经文语体，但句法简洁自然；未沿用英译脚注中缺乏本版拉丁原文支持的“有害的行为”。
