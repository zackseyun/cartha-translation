source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam omnis incredulus in incredulitate sua morietur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/004.yaml
  text: For every unbeliever will die in his unbelief.
translation:
  language: zh_hans
  text: 因为每个不信的人都必死在自己的不信中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnis incredulus
  choice: 每个不信的人
  rationale: omnis 与单数名词 incredulus 搭配，逐一涵盖所有不信者；译作“每个不信的人”既准确又符合现代汉语。
- source_word: in incredulitate sua
  choice: 在自己的不信中
  rationale: 保留拉丁文介词结构及 sua 的反身归属，不把“不信”进一步解释为原因、状态或罪责，从而保存原文的简洁与张力。
- source_word: morietur
  choice: 都必死
  rationale: 拉丁文将来时在此表达确定将发生的结局；“必死”自然传达这种确定性，“都”与前面的“每个”呼应。
theological_decisions:
- issue: “死”是否特指永恒灭亡
  choice: 保留为“死”
  alternative: “灭亡”或“遭受永死”
  rationale: morietur 本义为“将死”，本节自身没有明确限定为肉身死亡或永恒灭亡，因此不在译文中替原文作神学限定。
- issue: 不信与死亡的关系
  choice: 译作“死在自己的不信中”
  alternative: “因自己的不信而死”
  rationale: 原文使用 in 而非明确的原因介词；保留“在……中”可避免将状态关系单一化为直接因果关系。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“不信”与上下文可能涉及的信仰和忠信含义相容，不额外引入宗派性术语。
