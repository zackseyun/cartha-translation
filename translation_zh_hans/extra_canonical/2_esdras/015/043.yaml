lexical_decisions:
- source_word: pratorum
  choice: 牧场
  rationale: 该词为复数属格，承接上文，表示“（他们的）草场、牧地”；译作“牧场”自然且准确。
- source_word: frumenta
  choice: 粮食
  rationale: frumentum 可指谷物或粮食；此处用复数并与牧场并列，译作较宽泛的“粮食”，保留其涵盖农作物收成的可能。
- source_word: constanter
  choice: 坚定地
  rationale: 表示持续、坚决而不退缩地行动；“坚定地”较好保留其方式副词色彩。
- source_word: transibunt
  choice: 前行
  rationale: 基本义为“经过、越过、继续行进”；因句末 usque 指向下文尚未给出的终点，译作“前行”能自然衔接。
- source_word: usque
  choice: 直到
  rationale: 该词引出尚在下一节或后续片段中的终点；保留未完句式，不擅自补入目的地或行动。
