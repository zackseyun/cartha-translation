  text: As chief you will come[a], and again you will receive evils. And in passing
translation:
  language: zh_hans
  text: 你将以首要者的身份前来[a]，并且还要再次遭受祸患。而在经过时——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首要者”也可译作“居首位的（人或城）”。原文为阴性形式，未明说所指对象。
    reason: 保留 primaria 的阴性语法形式及其未明所指，避免将其定为某位首领或某座城。
lexical_decisions:
- source_word: primaria
  choice: 以居首者的身份
  rationale: 该词为阴性单数形式，可指“首要的、居首位的（人或城）”；结合第二人称动词，采用身份性表达，同时不擅自补出具体对象。
- source_word: uenies
  choice: 你将……前来
  rationale: 准确表达第二人称单数将来时，并以“前来”保留朝向说话者或叙事焦点而来的语感。
- source_word: rursum accipies mala
  choice: 并且还要遭受灾祸
  rationale: rursum 表示“再次、又、还”；accipere mala 直译为“领受恶事”，现代汉语自然表达为“遭受灾祸”。
- source_word: Et in transitu
  choice: 而在经过时——
  rationale: 保留原文位于本节末尾的未完结构；破折号提示句意延续至下文，避免将下一节内容擅自补入。
