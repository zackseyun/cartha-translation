source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam enim venerunt super orbem terrarum mala, et manebitis in illis; non enim liberabit vos Deus, propter quod peccastis in eum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/027.yaml
  text: For already evils have come upon the world, and you will remain in them; for God will not deliver you, because you have sinned against him.
translation:
  language: zh_hans
  text: 因为灾祸已经临到世上，你们必留在其中；上帝不会搭救你们，因为你们得罪了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: 灾祸
  rationale: 此处指临到世界、使人身陷其中的祸患，而非抽象的道德之恶；译作“灾祸”更符合上下文。
- source_word: orbem terrarum
  choice: 世上
  rationale: 拉丁语惯用表达，指整个有人居住的世界；“世上”自然简明。
- source_word: manebitis in illis
  choice: 你们必留在其中
  rationale: 保留 manere 的“停留、继续处于”含义，也保留 illis 回指复数“灾祸”的表达张力。
- source_word: liberabit
  choice: 搭救
  rationale: 表达从所临灾祸中解救出来，符合此处具体语境，且为现代汉语常用表达。
- source_word: peccastis in eum
  choice: 你们得罪了他
  rationale: in eum 表明犯罪所针对的对象；“得罪了他”自然传达对上帝犯罪的关系性含义。
theological_decisions:
- issue: 上帝不施搭救与人的罪之间的因果关系
  choice: 保留“因为”所表达的直接因果关系
  alternative: 弱化为“既然你们得罪了他”或解释为暂时不搭救
  rationale: 原文 propter quod 明确把不获搭救归因于他们得罪上帝；不补入原文没有说明的时间限制或教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原文严厉的审判语气和分号连接的因果结构。
