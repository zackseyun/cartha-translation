  text: ecce ego convoco, dicit Deus, omnes reges terrae ad movendum, qui sunt a borea et a noto et ab euro et a libano, ad convertendos in se et reddere quae dederunt illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/020.yaml
  text: Behold[a], I am summoning, says God, all the kings of the earth to stir up, those who are from the north and the south and the east and Lebanon, to turn against one another and repay what they gave them.
translation:
  language: zh_hans
  text: 看哪，上帝说：“我要召集地上所有的王，叫他们行动起来；他们来自北方、南方、东方和西南方[a]。我要使他们转而彼此相向，并把他们给了他们的还给他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本作“黎巴嫩”；但这里依次列举北风、南风、东风和第四种风，末词很可能是传写讹误，原指“西南风”。
    reason: 说明正文采用基于四风结构的文本校勘，同时保留现存拉丁读法。
  - marker: b
    text: 原文“他们给了他们的”中代词的具体所指不明确。
    reason: 保留并说明拉丁文 quae dederunt illis 所含的代词歧义，避免将其解释为明确的报应对象或受害者。
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留先知宣告中引人注意的语气，庄重而为现代读者所熟悉。
- source_word: convoco
  choice: 召集
  rationale: 准确表达把各方君王召聚而来的意思。
- source_word: ad movendum
  choice: 叫他们行动起来
  rationale: 拉丁文表达略显突兀；此译保留“发动、行动”的宽泛含义，不擅自限定为出征或作战。
- source_word: a borea et a noto et ab euro et a libano
  choice: 来自北方、南方、东方和西南方
  rationale: 前三项是风名所代表的方位；末项抄本作 libano（黎巴嫩），但在四风并列结构中很可能源于表示西南风的希腊词 λίψ/λιβός 的传写讹误，故正文采用“西南方”，并以脚注保留现存拉丁文本。
- source_word: ad convertendos in se
  choice: 使他们彼此攻击
  rationale: 直译为“使他们转向彼此”；在审判和列王被发动的语境中指彼此敌对，译为“彼此攻击”自然且不增加具体战术含义。
- source_word: reddere quae dederunt illis
  choice: 照他们从前怎样待人，报应他们
  rationale: 原文直译近于“把他们曾给他们的还给他们”，代词所指含混。中文以对等报应的惯用表达传达其意义，同时避免武断指定受害者。
theological_decisions:
- issue: 上帝在列王互相攻击中的主动作用
  choice: 我要使他们彼此攻击
  alternative: 让他们彼此攻击
  rationale: 拉丁文目的结构与上帝召集列王的宣告相连，正文保留上帝主动施行审判的力度，不弱化为单纯许可。
- issue: 报应对象及先前行为的代词歧义
  choice: 照他们从前怎样待人，报应他们
  alternative: 把他们曾给那些人的还给他们
  rationale: 拉丁文 quae dederunt illis 中 illis 的先行词不明确；采用中文概括式表达，保留按行为施报的意思，而不虚构明确对象。
translation_notes:
  register: 采用现代、庄重、清楚的经文体。保留“看哪”和直接引语的宣告感；对生硬的拉丁句法作适度调整，但不消除末项方位及报应代词所涉及的文本与语义张力。
