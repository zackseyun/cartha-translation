source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et a territorio Assyriorum subsessor subsedebiteos et consumet unum ex illis, et erit timor et tremor in exercitum illorum et inconstabilitio in regno illorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/033.yaml
  text: And from the territory of the Assyrians an ambusher will lie in wait for them and consume one of them, and there will be fear and trembling in their army and instability in their kingdom.
translation:
  language: zh_hans
  text: 必有一个伏击者从亚述人的疆域而来，伏击他们，消灭他们中的一人；他们的军队必陷入恐惧战兢，他们的国必动荡不安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: territorio Assyriorum
  choice: 亚述人的疆域
  rationale: 按拉丁文直译其领土概念，同时使用现代汉语中自然而庄重的“疆域”。
- source_word: subsessor subsedebit eos
  choice: 伏击者……埋伏袭击他们
  rationale: 保留施事者“伏击者”及埋伏等候、伺机攻击的语义；原文连写或讹写不影响其基本句法判断。
- source_word: consumet unum ex illis
  choice: 消灭他们中的一人
  rationale: 保留 unum ex illis 的单数指向，不把“一人”解释为某支军队、某位王或某一国。
- source_word: timor et tremor
  choice: 恐惧战兢
  rationale: 以常见的庄重搭配再现两个并列名词，兼顾惧怕与身体震颤。
- source_word: inconstabilitio in regno illorum
  choice: 他们的国中必动荡不安
  rationale: inconstabilitio 表示不稳、失序；译为“动荡不安”比生硬的“没有稳定”更符合现代汉语。
theological_decisions:
- issue: “他们中的一人”的具体所指
  choice: 维持泛指，不作身份说明
  alternative: 解释为他们的一位君王、一个国家或一支军队
  rationale: 拉丁文本仅有 unum ex illis，语境不足以在本节中确定其身份，故保留原有含混性。
- issue: “他们的国”是单一还是集合意义
  choice: 译作单数“他们的国”
  alternative: 译作“他们的诸国”或“他们的政权”
  rationale: 原文 regno 为单数；中文依照其语法形式，不主动协调可能的复数群体所指。
translation_notes:
  register: 采用现代、庄重且易懂的叙事—预言体。用“必”表达拉丁文将来时的预告语气；避免古奥词和额外的历史或神学解释。
