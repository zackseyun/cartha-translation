  yaml_path: translation/extra_canonical/2_esdras/015/011.yaml
  text: but I will lead them out with a mighty hand and an uplifted arm, and I will strike Egypt with plagues as before, and I will destroy all its land.
translation:
  language: zh_hans
  text: 但我要用大能的手和高举的膀臂把他[a]领出来；我要照从前那样以灾殃[b]击打埃及，毁坏埃及全境。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文作“他”，也可能以单数统称前文所说的民众。
    reason: 提示原文与英语审校层所采用复数之间的差异，并保留指称歧义。
  - marker: b
    text: 拉丁文用单数“灾殃”，在这里也可作集合性用语，指诸般灾祸。
    reason: 说明语法数与上下文意义之间的张力，避免正文强行确定单数或复数。
lexical_decisions:
- source_word: educam
  choice: 领出来
  rationale: 准确表达从一地带领出去的动作，并保留出埃及叙事的呼应。
- source_word: in manu potenti et brachio excelso
  choice: 用大能的手和高举的膀臂
  rationale: 保留原文庄严的身体意象及两个并列短语；“高举”贴近 excelso，而不改写为解释性的“伸出的”。
- source_word: plaga
  choice: 灾殃
  rationale: 拉丁文为单数，但可作集合性用语；“灾殃”既自然，也不强行限定为一次或多次灾害。
- source_word: corrumpam
  choice: 毁坏
  rationale: 在针对土地的审判语境中表示使之败坏、荒废；“毁坏”比“毁灭”更自然，同时保留严厉程度。
- source_word: terram omnem eius
  choice: 其全地
  rationale: 简洁保留“它的全部土地”之意，其中代词指向埃及。
theological_decisions:
- issue: eum 的单数所指
  choice: 译作“他”，并加注说明可能是集合性单数
  alternative: 按上下文译作“他们”
  rationale: 原文明确使用阳性单数宾格 eum；正文保留其语法形式，以免无声消除所指对象的歧义。
- issue: plaga 的数与出埃及灾祸的呼应
  choice: 采用不明确标示单复数的“灾殃”
  alternative: “一次灾殃”或“诸般灾殃”
  rationale: 既尊重拉丁文单数形式，也容许其集合性含义及对先前埃及灾祸的整体指涉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“手”“膀臂”等经文传统意象，同时避免过度古雅。分号呈现带领与审判两个紧密相连的动作。
