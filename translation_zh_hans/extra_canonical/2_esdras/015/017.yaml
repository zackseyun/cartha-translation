review_pass:
  verdict: revise
  source_fidelity: “因为”恰当地传达 enim 的承接／说明作用；“人”保留 homo 的泛指。“进城”准确对应 in civitatem ire。不过，concupiscet 比普通的“想”更强，宜译为“渴望”或“切望”。non poterit 的直接意思是“不能／将不能”，不必在正文中补成“进不去”。
  naturalness: “因为人渴望进城，却不能。”简洁自然，带有与本段灾祸预言相称的庄重语气；“却”也自然表现愿望无法实现的反差。
  terminology: 无专门神学术语或专名。以“渴望”表达 concupiscet，避免将其误解为现代汉语中仅属轻微意愿的“想”。
  issues:
  - severity: medium
    issue: “想”弱化了 concupiscet 的语义力度。
    rationale: 该动词表示强烈的欲求／渴望；在此虽不应引入性欲含义，但“渴望”比“想”更贴近原文。
  - severity: medium
    issue: 脚注对拉丁文的说明不准确，且正文锚点不必要。
    rationale: 原文不只是“只明说‘不能’”，而是完整地说“将渴望进城，却不能”。non poterit 虽未重复 ire 的补语，却由前一不定式自然承接；中文“不能”可同样保留这一表达。删除该脚注可避免误导。
  revised_text: 因为人渴望进城，却不能。
  revised_footnotes: []
