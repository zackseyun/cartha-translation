lexical_decisions:
- source_word: enim
  choice: 因为
  rationale: 保留该词承接上文、说明缘由的解释性连接作用。
- source_word: homo
  choice: 人
  rationale: 泛指人，不限定为某个特定男子。
- source_word: concupiscet
  choice: 想
  rationale: 此处表示强烈希望前往；现代汉语用“想”自然清楚，且不引入情欲等无关含义。
- source_word: in civitatem ire
  choice: 进城
  rationale: 准确而自然地表达进入一座城的动作；拉丁文未指定是哪一座城。
- source_word: non poterit
  choice: 却进不去
  rationale: 表达将无能力实现前述愿望；“却”自然呈现愿望与不能实现之间的反差。
