  yaml_path: translation/extra_canonical/2_esdras/015/041.yaml
  text: fire and hail and flying swords and many waters[b][a], so that even all the fields and all the rivers will be filled from the abundance of those waters.
translation:
  language: zh_hans
  text: 火、冰雹、飞舞的刀剑[a]和大量的水，以致连所有田野和所有溪流都被那些水的充沛所充满[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刀剑”或译“阔剑”。
    reason: romphaea可特指较大型的阔刃兵器，但在此也可作一般性的刀剑理解。
  - marker: b
    text: “连”或译“也”。
    reason: etiam既可表达强调性的“连／甚至”，也可表达附加性的“也”。
lexical_decisions:
- source_word: rompheas volantes
  choice: 飞舞的刀剑
  rationale: romphaea本可指一种大型阔刃兵器，但在晚期圣经与启示文学语境中通常泛指施行审判的刀剑；“刀剑”既保留意象，也避免过度技术化。“飞舞的”自然表达volantes。
- source_word: aquas multas
  choice: 大量的水
  rationale: 按拉丁文复数直译成“许多水”不合现代汉语习惯；“大量的水”准确传达数量之多。
- source_word: campi
  choice: 田野
  rationale: campus在此指开阔的田地或原野；“田野”符合洪水漫溢的场景，也通俗自然。
- source_word: rivi
  choice: 溪流
  rationale: rivus通常指溪流或较小水道，比“河流”更贴近原词尺度。
- source_word: a plenitudine aquarum illarum
  choice: 因那些水的丰沛而充满
  rationale: 保留a所表达的来源或原因关系，并以自然汉语传达plenitudo所指的充盈、丰沛水量。
theological_decisions:
- issue: 启示文学中romphaea所指兵器的具体类型
  choice: 正文采用一般性的“刀剑”
  alternative: 阔剑／大型刀剑
  rationale: 原词具有具体兵器背景，但此处重点是飞舞兵刃的审判意象；正文不强行限定形制，脚注保留较具体的可能译法。
- issue: etiam的强调范围
  choice: 译为“甚至”，修饰田野和溪流都被水充满这一结果
  alternative: 译为“也”或不单独译出
  rationale: 拉丁文明确有etiam，且语境可能强调水量之大，连田野也被充满；同时脚注保留较弱的附加语气，以免消除其语义弹性。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体；并列灾象保持紧凑有力。避免“许多水”这类生硬仿古表达，同时保留原文的夸张规模与末世审判意象。
