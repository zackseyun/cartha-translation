  yaml_path: translation/extra_canonical/2_esdras/015/021.yaml
  text: 'As they have done to my chosen ones to this day[a], so I will do and repay into their lap. Thus says the Lord God:'
translation:
  language: zh_hans
  text: 他们怎样对待我的选民，直到今日，我也要照样对待他们，把报应倒在他们的衣襟里。主上帝如此说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electis meis
  choice: 我的选民
  rationale: 保留“被拣选者”的神学含义，并采用现代中文圣经语体中自然、凝练的表达。
- source_word: reddam
  choice: 把报应倒在
  rationale: reddere 在此不是普通的“归还”，而是按其所行施以回报；结合 in sinum 的容器意象，译作“把报应倒在”既显出报偿含义，也保留具体画面。
- source_word: in sinum ipsorum
  choice: 他们的衣襟里
  rationale: sinus 在此指衣服折叠形成、可承接物品的前襟，而非现代汉语通常理解的胸怀；“衣襟里”比“怀中”更清楚地保留承接报应的物质性意象。
- source_word: haec dicit Dominus Deus
  choice: 主上帝如此说
  rationale: 采用庄重而通行的先知宣告格式，并保留 Dominus Deus 的双重称谓。
theological_decisions:
- issue: 报应是否明确为同态性的回应
  choice: 用“照样对待他们”保留 sic 所表达的对应关系
  alternative: 译作“我也必这样行”
  rationale: 经文强调上帝将按他们对选民所做的施行回应；当前译法明确宾语，又不额外规定报应的具体形式。
- issue: 是否将 electi 解释为特定群体
  choice: 仅译作“选民”
  alternative: 具体化为“以色列民”或“圣徒”
  rationale: 原文未在本节限定其身份，不应导入额外的群体认定。
translation_notes:
  register: 采用现代、庄重且易懂的圣经叙述语体。保留原文“怎样……照样……”的对应结构，以及“倒在衣襟里”的古代衣着意象；不添加原文没有的“也”作为独立强调词，但中文结构中用“也要”自然表达前后对应。
