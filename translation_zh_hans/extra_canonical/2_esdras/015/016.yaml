base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/016.yaml
  text: For there will be instability among men; overpowering one another[a], they will pay no attention to their king or to the chief of their nobles, in their power.
translation:
  language: zh_hans
  text: 因为人间必有动乱；人们彼此压倒，不顾自己的王和他们权贵的首领；他们行事只凭自己的势力。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: constabilitio
  choice: 动乱
  rationale: 此处拉丁词形罕见且文本可能有讹误；结合语境，它指人群中秩序不稳、相互争胜的状态。“动乱”既自然，也避免把含义限缩为单纯的心理不安。
- source_word: alisalios supervalescentes
  choice: 人们彼此压制
  rationale: 将疑为连写的 alii alios 理解为“彼此”，supervalescentes 表示凭强势胜过或压倒对方；“彼此压制”保留相互争强的动态。
- source_word: regem suum
  choice: 自己的王
  rationale: 忠实表达 suum 的反身所属关系。
- source_word: principem megestanorum suorum
  choice: 他们权贵的首领
  rationale: principem 为单数“首领”，megestanorum 为复数属格，指显贵、权贵阶层；此译保留“一个首领统领众权贵”的语法结构。
- source_word: in potentia sua
  choice: 仗着自己的势力
  rationale: 该短语位于句末，修饰关系略有弹性；结合彼此压倒并无视统治者的语境，译为行为所凭借的势力最为自然，同时未引入额外神学含义。
