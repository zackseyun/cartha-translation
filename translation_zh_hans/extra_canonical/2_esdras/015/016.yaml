review_pass:
  verdict: revise
  source_fidelity: 草稿对 constabilitio（动乱）、alii alios supervalescentes（彼此压倒）及单数 principem 加复数属格 megestanorum（权贵的首领）的把握基本准确。不过，句末 in potentia sua 在拉丁文中位于全句末，修饰范围有弹性；将其前置并明确连到“彼此压制”为“仗着自己的势力”，会把它限定为压制的手段。较稳妥的是将其作为独立的结果性陈述，表达他们行事由自身势力支配。
  naturalness: 原文整体庄重自然。“不顾”较“放在眼里”更适合预言性、书面语的语域；将末语另成分句也使中文句法更清晰。
  terminology: “动乱”“王”“权贵的首领”均恰当，并保留了“首领”为单数这一关键语法信息。
  issues:
  - severity: medium
    issue: 句末“in potentia sua”的句法归属被过度限定
