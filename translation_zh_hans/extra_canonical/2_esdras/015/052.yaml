  text: Would I be so zealous against you[a], says the Lord,
translation:
  language: zh_hans
  text: “难道我会这样向你大发烈怒吗？[a]”主说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道我会这样忌恨你吗？”
    reason: 保留 zelabo 可指“忌恨／嫉妒”或热切之意的词义余地；正文依审判语境译为“大发烈怒”。
lexical_decisions:
- source_word: Numquid
  choice: 难道……吗
  rationale: 用反问句式表达拉丁文预期否定回答的语气，同时保留其修辞力量。
- source_word: sic
  choice: 这样
  rationale: 直接保留方式副词的指示意义，并让它自然承接上下文所描述的审判。
- source_word: zelabo
  choice: 会……发烈怒
  rationale: 该词为将来时；在此审判语境中表达强烈、热切的敌对或义愤，而不是现代汉语通常所说的嫉妒。用“会”保留将来或条件结果色彩，用“烈怒”传达其强度。
- source_word: te
  choice: 向你
  rationale: 保留第二人称单数指向；现代汉语的“你”与原文单数一致。
theological_decisions:
- issue: zelabo 所表达的是神圣嫉妒、热忱还是审判之怒
  choice: 发烈怒
  alternative: 忌恨你／为你大发热心
  rationale: 上下文涉及对流血罪行的报应，“发烈怒”最自然地呈现敌对性的审判热忱，并避免把神的行动误解为羡慕或情感占有；脚注保留较贴近词源的另一种理解。
- issue: 混合条件句中的时态
  choice: 难道我会……吗
  alternative: 难道我早已……了吗
  rationale: 拉丁文 zelabo 是将来时，作为条件句的结果部分宜保留“会”，不改写成完成时。
translation_notes:
  register: 采用现代、庄重而易懂的反问句。“发烈怒”比生硬的“向你发热心”自然，也避免“嫉妒”在现代汉语中常有的羡慕或情爱占有含义。引语后的“主说”依据经审核的英语咨询层所保存的句段归属呈现；所给拉丁文截句本身止于逗号。
