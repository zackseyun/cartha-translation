source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce nubs ab oriente et a septentrione usque ad meridianum, et facies illorum horrida valde, plena irae et procellae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/034.yaml
  text: Behold, clouds from the east and from the north as far as the south, and their appearance is very dreadful, full of wrath and storm.
translation:
  language: zh_hans
  text: 看哪，有云从东方和北方而来，延伸直到南方；它们的景象极其可怕，充满愤怒和风暴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留先知性宣告中引人注意的语气，庄重而易懂。
- source_word: nubs
  choice: 云
  rationale: 原文应为拉丁语 nubes（云）；按上下文理解为集合意义，并以单数集合名词自然表达。
- source_word: facies illorum
  choice: 云的形状
  rationale: facies 可指外观、面貌或形状；illorum 虽为阳性复数，与 nubes 的常规语法不完全协调，但语境明确回指所见之云。译文明确指代，同时保留可怖的视觉意象。
- source_word: plena irae et procellae
  choice: 充满愤怒和风暴
  rationale: 尽量保留 ira 与 procella 的并列及拟人化张力，不将“愤怒”解释为神怒或人的怒气。
theological_decisions:
- issue: “愤怒”的归属
  choice: 不说明愤怒属于谁，仅译为“充满愤怒”
  alternative: 充满神的愤怒／带着盛怒
  rationale: 拉丁文只说 plena irae，并未明确愤怒的主体；应保留其启示文学中的含混性。
- issue: 云的移动与覆盖范围
  choice: 译作“从东方和北方而来，延伸直到南方”
  alternative: 从东方和北方直到南方都有云
  rationale: usque ad meridianum 表示范围达到南方；加入“延伸”使汉语通顺，但不额外断定这些云已覆盖整个区域。
translation_notes:
  register: 采用现代、庄重且具有启示文学画面感的普通话。“看哪”保留宣告语气；分号对应原文由方位景象转入可怖外观的结构。
