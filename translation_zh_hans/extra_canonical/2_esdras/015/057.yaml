  text: ciuitates tuae conterentur, et omnes tui in campo gladio cadent; Et qui sunt in montibus fame peribunt, et manducabunt carnes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/057.yaml
  text: Your cities will be shattered[a], and all your people in the field will fall by the sword. And those in the mountains will perish by famine and will eat flesh.
translation:
  language: zh_hans
  text: 你的城邑必被摧毁；你在田野中的人都必倒在刀下。山里的人必因饥荒灭亡，并且要吃肉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 若与下一节开头的“自己的”连读，也可理解为：“并且要吃自己的肉。”
    reason: 拉丁文修饰语 suas（“自己的”）落在下一节的节界内；脚注说明跨节连读的可能性，而正文严格依照本节所给文本。
lexical_decisions:
- source_word: ciuitates tuae conterentur
  choice: 你的城邑必被摧毁
  rationale: conterentur 表示遭压碎、摧毁；“城邑”既准确表达 ciuitates，也符合庄重的经文语体。
- source_word: omnes tui in campo
  choice: 你所有在田野的人
  rationale: tui 是名词化的所有格，直译为“所有属你的人”；在此用“你所有……的人”补足拉丁文省略成分，使现代汉语自然，同时不限定其具体身份。
- source_word: gladio cadent
  choice: 倒在刀下
  rationale: 保留“倒下”与“刀剑”构成的死亡意象；“倒在刀下”是自然、庄重的汉语表达。
- source_word: fame peribunt
  choice: 必因饥荒灭亡
  rationale: fame 是原因或手段性的夺格，表示因饥饿、饥荒而死；此处群体性灾祸语境下译作“饥荒”。
- source_word: manducabunt carnes
  choice: 要吃肉
  rationale: 严格按本节所给拉丁文翻译；carnes 仅意为“肉”，修饰语 suas 位于下一节的文本范围内，不在正文中提前补入“自己的”。
theological_decisions:
- issue: 所吃之肉是否明确为“自己的肉”
  choice: 正文仅译“吃肉”，并以脚注说明与下一节连读时的可能理解
  alternative: 正文译为“吃自己的肉”
  rationale: 本节拉丁文止于 carnes，并未包含 suas。为尊重给定节界和原文证据，正文不提前补词；同时保留跨节连读产生的理解。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“城邑”“倒在刀下”“因饥荒灭亡”保持审判宣告的严肃语气；避免生硬直译“所有属你者”，也不擅自说明这些人的具体身份。脚注标记置于实际存在文本问题的“吃肉”之后。
