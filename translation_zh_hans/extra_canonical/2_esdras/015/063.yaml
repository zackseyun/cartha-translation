  text: and they will have plunder and wipe out the glory of your face.
translation:
  language: zh_hans
  text: 他们必掳得财物，除灭你脸上的荣光。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praeda habebunt
  choice: 他们必掳得财物
  rationale: praeda 指掠夺所得的财物；用“掳得财物”既保留掠夺语义，也比直译“拥有战利品”更符合此处灾祸宣告的语境。
- source_word: gloriam faciei tuae
  choice: 你脸上的荣光
  rationale: 保留拉丁文“脸”与“荣光”的具体意象，不擅自解释为美貌、尊严或威势。
- source_word: exterminabunt
  choice: 除灭
  rationale: 表达彻底毁去、消除之意，并保持预言性审判语体的庄重力度。
theological_decisions:
- issue: “你脸上的荣光”所指为何
  choice: 保留原文意象，不作具体化解释
  alternative: 译作“你的美貌”或“你的尊荣”
  rationale: 原文可能涉及外在光彩、尊荣或显赫地位；正文保留其语义张力，避免加入原文未明确限定的解释。
translation_notes:
  register: 采用现代、庄重而易懂的预言性语体；两个并列动作用“必……，……”连接，简洁地保留拉丁文结构与力度。
