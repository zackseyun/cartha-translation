  naturalness: “写在卷上”略显生硬；“写在书卷上”在现代庄重汉语中更自然，且仍不限定书写材料或具体卷轴形制。
  terminology: “主说”及“放在你口中”恰当保留先知性宣告公式与源文意象。“书卷”可对应 carta 在此处的书写载体含义。
