  yaml_path: translation/extra_canonical/2_esdras/015/002.yaml
  text: that I will put into your mouth, says the Lord, and cause them to be written on a scroll,
translation:
  language: zh_hans
  text: “就是我要放在你口中的那些话，”主说，“你要使这些话写在书卷上，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quos
  choice: 那些话
  rationale: 关系代词为阳性复数宾格，承接上文所指的话语；中文补出“话”以使所指清楚，同时保留本节作为跨节句段的结构。
- source_word: inmisero in os tuum
  choice: 我要放在你口中
  rationale: 按拉丁文未来完成时形式直译其将来指向；“放在你口中”保留先知受命传言的源语意象。
- source_word: dicit dominus
  choice: 主说
  rationale: 采用简洁庄重、现代读者熟悉的先知宣告公式。
- source_word: fac ut
  choice: 要使
  rationale: fac为命令式，要求受话者促成随后之事；译为“要使”保留命令及使役含义，不擅自明确书写者。
- source_word: in carta
  choice: 在卷上
  rationale: carta可指纸张、书写材料或文卷；依古代书写语境译作“卷”，但不具体限定材质。
theological_decisions:
- issue: 话语进入先知之口的施事者
  choice: 保留第一人称“我”及“主说”的插入结构
  alternative: 改写为“主放在你口中的话”
  rationale: 源文以第一人称动词配合插入语“主说”，直接呈现上帝发言；不将其改成第三人称叙述。
- issue: 书写行动的执行者
  choice: 译作“要使这些话写在卷上”
  alternative: 译作“你要把这些话写在卷上”
  rationale: 源文fac ut表达使役，未直接说受话者亲自执笔；采用被动表达以避免补入未经明示的执行者。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。破折号标示插入语“主说”。经文是承接前后文的句段，因此末尾保留逗号。
