source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam non silebo impietates eorum quae inreligiose agunt, nec sustinebo in his quae inique exercent. ecce sanguis innoxius et iustus clamat ad me, et animae iustorum clamant perseveranter.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/008.yaml
  text: I will no longer keep silent about their impieties[a], which they commit irreligiously, nor will I endure the things they carry out unjustly. Behold, innocent and righteous blood cries out to me, and the souls of the righteous cry out continually.
translation:
  language: zh_hans
  text: 我不再对他们不敬虔地所行的恶事[a]缄默，也不再容忍他们所行的不义。看哪，无辜而公义的血向我呼喊，义人的灵魂也不断呼喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他们不敬虔地所行的不敬虔之事”。
    reason: 拉丁文 impietates 与 inreligiose agunt 形成刻意的语义重复；正文以“恶事”配合“不敬虔地”作自然汉语表达，注释保留原文的强调。
lexical_decisions:
- source_word: impietates
  choice: 不敬神的恶行
  rationale: 既保留其宗教层面的悖逆含义，也自然表达复数所指的种种恶行，避免仅译作泛指的“邪恶”。
- source_word: inreligiose agunt
  choice: 不敬神的恶行
  rationale: 与 impietates 合并为自然的汉语表达；拉丁文同源语义的强调在注脚中保留，避免正文出现生硬重复。
- source_word: nec sustinebo
  choice: 也不再容忍
  rationale: 表达说话者不再忍受这些行为，符合此处审判宣告的语气。
- source_word: sanguis innoxius et iustus
  choice: 无辜义人的血
  rationale: 拉丁文可形式化理解为“无辜而公义的血”，但此处血代表遭害的义人；该译法在汉语中自然，同时由注脚保留形容词结构的可能读法。
- source_word: animae iustorum
  choice: 义人的灵魂
  rationale: 直接保留 animae 的“灵魂”意象及复数群体含义。
- source_word: perseveranter
  choice: 不断
  rationale: 准确传达持续、坚持不止地呼喊的意义。
theological_decisions:
- issue: 血与灵魂向神呼喊的意象
  choice: 按原文直译为“向我呼喊”
  alternative: 解释为“向我求伸冤”
  rationale: 原文只明说 clamant（呼喊），没有明确补出呼求的具体内容；保留其意象及开放性，不作神学性增译。
- issue: sanguis innoxius et iustus 的修饰关系
  choice: 译作“无辜义人的血”并加注
  alternative: “无辜而公义的血”
  rationale: 正文采用自然且合乎语境的汉语，注脚保留拉丁文形式上的另一种理解，避免完全消除原文张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“缄默”“容忍”“看哪”保持宣告与审判语气；整体以最佳对等为原则，并对拉丁文的语义重复作适度汉语化处理。
