    issue: “宽容”弱化 parcet 的审判性否定
    rationale: 拉丁文 non parcet 在此是不会饶过、不会放过犯罪者，并非一般意义上的不宽容。
  - severity: low
    issue: 后半句增设并名词化“所发的攻击”
    rationale: nec cessabit romphea super ... 的意思是刀剑对这些人不停施行；“所发的攻击”并非原文显性成分，且中文表达不够自然。
  revised_text: 我的右手必不放过犯罪的人；刀剑也必不停止攻击那些在地上流无辜人之血的人。
