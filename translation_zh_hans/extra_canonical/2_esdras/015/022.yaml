  yaml_path: translation/extra_canonical/2_esdras/015/022.yaml
  text: My right hand will not spare the sinners[a], nor will the sword cease against those who shed innocent blood upon the earth.
translation:
  language: zh_hans
  text: 我的右手必不放过犯罪的人；刀剑也必不停止攻击那些在地上流无辜人之血的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dextera mea
  choice: 我的右手
  rationale: 保留原文以“右手”象征施行能力与审判的具体意象，不改写为抽象的“能力”。
- source_word: peccantes
  choice: 犯罪的人
  rationale: 拉丁文为现在分词的名词化用法，着重指行犯罪之事的人；此译比单纯的身份标签“罪人”更贴近其形式。
- source_word: romphea
  choice: 刀剑
  rationale: 该词源于希腊语 ῥομφαία，在此指施行审判的剑；“刀剑”自然庄重，又避免加入特定古代兵器形制。
- source_word: effundentes sanguinem innocuum
  choice: 流无辜人之血的人
  rationale: 按闪语及拉丁语惯用表达保留“流血”，其含义是杀害无辜者；“无辜人之血”准确表达 innocuum 对 sanguinem 的修饰。
- source_word: super terram
  choice: 在地上
  rationale: 直译空间范围，保留原文所指在世上发生的流血行为。
theological_decisions:
- issue: 审判主体与兵器意象的关系
  choice: 保留“我的右手”与“刀剑”两个并列意象
  alternative: 将两者统合解释为“我必惩罚”
  rationale: 原文先说“我的右手”，再说“刀剑”，没有明确说明二者是否完全同指；保留原有张力，避免将意象神学化或抽象化。
- issue: super 与 cessabit 的关系
  choice: 译为刀剑对流无辜人之血者所发的“攻击”不停息
  alternative: 译为“刀剑必不离开他们”或“刀剑在他们之上不停”
  rationale: 此处 super 表示敌对指向；中文用“对……所发的攻击”既自然，也不误解为单纯的空间位置。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“右手”“刀剑”“流……之血”等原文意象；以“所发的攻击，也必不停息”自然表达 nec cessabit ... super 的持续敌对含义。
