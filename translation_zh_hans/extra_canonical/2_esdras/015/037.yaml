  text: And those who see that wrath will shudder[a], and trembling will seize them. And after this, abundant storm-clouds will be stirred up.
translation:
  language: zh_hans
  text: 看见那忿怒的人都必战栗[a]，颤抖必抓住他们。此后，众多的暴风云将翻腾起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有旧译将“地上将大有恐惧和颤抖”并入本节；按本版拉丁文本，这句话属于第36节末尾。
    reason: 说明先前译法的分节归属，不将非本节的文字误作本节可选译文。
lexical_decisions:
- source_word: horrebunt
  choice: 必战栗
  rationale: 表达因目睹烈怒而惊惧发抖，既保留原词的强烈反应，也符合现代汉语表达。
- source_word: iram illam
  choice: 那烈怒
  rationale: 保留指示词 illam，并用“烈怒”传达 ira 在审判语境中的强烈含义。
- source_word: tremor adprehendet illos
  choice: 颤抖必抓住他们
  rationale: 较直接地保留 adprehendet“抓住、攫住”的拟人化力度。
- source_word: nimbi copiosi
  choice: 密布的风暴云
  rationale: nimbi 指带来暴风雨的云；copiosi 强调数量众多、云层密集，不译作“强劲”，以免与第40节 validae 混同。
- source_word: movebuntur
  choice: 将翻腾起来
  rationale: 被动形式可表示云层受到激动或开始运行；“翻腾起来”在中文中自然呈现风暴云被搅动的动态，同时不明确添加施动者。
