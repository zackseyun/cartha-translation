  yaml_path: translation/extra_canonical/2_esdras/015/048.yaml
  text: 'You have imitated that hateful prostitute in all her works and devices; therefore God says:'
translation:
  language: zh_hans
  text: 你仿效了那个可憎的淫妇，在她一切的行为和诡计上都照样行；因此，便说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文直译为“因此，便说”，没有明写说话者；有些译文依上下文补作“上帝说”。
    reason: 说明英语咨询文本所补出的主语，并保留拉丁文本身未明示说话者的状态。
lexical_decisions:
- source_word: fornicariam odibilem
  choice: 可憎的淫妇
  rationale: “fornicaria”指从事淫乱或卖淫的女子；“淫妇”既保留原文强烈的谴责意味，也符合庄重的经文语体。“odibilem”译为“可憎的”比“可恨的”更自然地表达道德上的厌恶。
- source_word: imitata es
  choice: 你……仿效了
  rationale: 准确保留第二人称单数及完成时所表达的既成行为；拉丁文阴性形式表明受话对象在语法上为阴性，中文无须额外标示。
- source_word: in omnibus operibus eius et adinuentionibus eius
  choice: 在她一切的行为和种种伎俩上
  rationale: 保留两个并列范畴及两次指向“她”的所有关系；“伎俩”传达 adinventiones 在此谴责语境中的负面含义。
- source_word: propterea dicit
  choice: 所以，他说
  rationale: 拉丁文只写“因此/所以，他说”，没有明写主语“上帝”；译文不依英语咨询层擅自补入“上帝”。
theological_decisions:
- issue: “dicit”的主语是否明确为上帝
  choice: 正文译作“他说”，并用脚注说明原文未明说主语
  alternative: “所以，上帝说”
  rationale: 英语 POB 依据上下文补出了 God，但所给拉丁文仅有 dicit。为保留原始证据中的指代含混，不在正文中将主语确定为上帝。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可憎的淫妇”保留启示性审判话语的力度；句末冒号显示下文将接续所说的话。所给拉丁文开头的“tuis qui te cupierunt semper”显然是上一节残句，未纳入本节正文。
