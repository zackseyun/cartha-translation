reference: 2 Esdras 15:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia adpropinquavit gladius et extritio illorum, et exsurget gens contra gentem ad pugnam, et romphea in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/015.yaml
  text: For the sword and their destruction have drawn near[a], and nation will rise against nation for battle, and broadswords will be in their hands.
translation:
  language: zh_hans
  text: 因为刀剑和他们的毁灭已经临近，一国必起来与另一国交战，阔剑必在他们手中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gladius
  choice: 刀剑
  rationale: 泛指临到的兵刃或战争之剑；“刀剑”在现代汉语中自然庄重，也不把它误解为他们所拥有的武器。
- source_word: extritio illorum
  choice: 他们的毁灭
  rationale: illorum最自然地修饰extritio，表示临到他们的毁灭；extritio在此末世灾难语境中指毁灭、灭亡，而非字面的“压碎”。
- source_word: adpropinquavit
  choice: 已经临近
  rationale: 体现拉丁语完成时所表达的逼近已成为现实，同时保持预言语气。
- source_word: gens contra gentem ad pugnam
  choice: 一国必起来与另一国交战
  rationale: 保留“国攻打国”的对应结构，并将ad pugnam自然表达为“交战”。
- source_word: romphea
  choice: 长剑
  rationale: 该词源自希腊语ῥομφαία，指大型剑刃武器；“长剑”比特指中国兵器形制的“大刀”更中性。
- source_word: in manibus eorum
  choice: 必在他们手中
  rationale: 保留原文独立的存在性分句，而不弱化为附带状语。
theological_decisions:
- issue: illorum的修饰范围
  choice: 仅理解为修饰extritio，即“他们的毁灭”
  alternative: 同时或只修饰gladius，译作“他们的刀剑和毁灭”
  rationale: illorum紧随extritio，且上下文中的刀剑是临到他们的审判工具，并非强调他们所拥有的刀剑。
- issue: 预言性将来语气
  choice: 后两分句用“必”
  alternative: 用一般将来表达“将”
  rationale: “必”自然传达预告事件的确定性，但不额外引入特定教派的末世解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。首个复合主语拆为两个并列分句，使“他们的”只限定“毁灭”，避免中文歧义；后半保持“一国……另一国”的对应结构和原文末句的独立陈述。
