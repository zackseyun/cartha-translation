  text: Carmonii insanientes in ira exient de silva et advenient in virtute magna et constabunt in pugnam cum illis et vastabunt portionem terrae Assyriorum in dentibus suis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/030.yaml
  text: The Carmonians[a], raging in wrath, will come out from the forest, and they will come with great force and stand for battle against them, and they will lay waste the portion of the land of the Assyrians with their teeth.
translation:
  language: zh_hans
  text: 迦尔莫尼人[a]在愤怒中发狂，要从树林中出来；他们将带着强大的兵力前来，列阵与他们交战，并要用自己的牙齿毁坏亚述人之地的一部分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦尔莫尼人”按拉丁文 Carmonii 音译；此名也可能是 Carmanii 的异写，指迦尔马尼亚地区的居民。
    reason: 说明底本文字的专名形式及可能的历史族群识别，不在正文中将不确定的异写校正当作确定文本。
lexical_decisions:
- source_word: Carmonii
  choice: 迦尔莫尼人
  rationale: 按拉丁文本的专名形式 Carmonii 音译，不擅自改作 Carmanii 所指的“迦尔马尼亚人”；脚注说明可能的历史识别。
- source_word: insanientes in ira
  choice: 怒气狂暴
  rationale: 兼顾 insanientes 的失控、狂烈意味和 in ira 的愤怒含义。
- source_word: in virtute magna
  choice: 以强大的兵力
  rationale: 在出兵交战的语境中，virtus 表示力量或军力；译作“兵力”较自然，同时保留其强盛意味。
- source_word: constabunt in pugnam
  choice: 列阵……交战
  rationale: 表达站定迎战、摆开阵势的军事图景。
- source_word: vastabunt
  choice: 蹂躏
  rationale: 传达使土地荒废、毁坏的含义，并适合军事侵袭语境。
- source_word: in dentibus suis
  choice: 用牙齿
  rationale: 保留原文突兀而鲜明的比喻，不将其解释性改写为武器或吞噬。
theological_decisions:
- issue: “用牙齿”是字面动作还是象征意象
  choice: 保留“用牙齿”的原始意象
  alternative: 解释为“凶猛地吞噬”或“用武器毁坏”
  rationale: 原文没有解释这一意象；直译可保存其末世预言式的张力与歧义。
- issue: Carmonii 的族群识别
  choice: 正文按抄本形式音译为“迦尔莫尼人”
  alternative: 按历史地名校正并译为“迦尔马尼亚人”
  rationale: 现有拉丁底本文字为 Carmonii；历史识别虽有根据，却涉及文本校正，故放入脚注而不静默替换正文。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。“列阵与他们交战”呈现军事语境；“用牙齿”刻意保留原文奇特意象。
