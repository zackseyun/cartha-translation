  text: 'deus: Inmittam tibi mala, uiduitatem, paupertatem et famem et gladium et pestem ad deuastandas domus tuas, ad uiolationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/049.yaml
  text: 'I will send evils upon you: widowhood and poverty and famine and sword and pestilence[a], to lay waste your houses, for violation'
translation:
  language: zh_hans
  text: 上帝说：“我要把灾祸降在你身上：丧偶、贫穷、饥荒、刀剑和瘟疫，为要使你的房屋荒废，并使你遭受侵害[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侵害”所译的拉丁词也可指“摧残”或“毁坏”；原文在此使用第二个表示目的的短语，其句法可能延续到下一节。
    reason: 说明 uiolatio 的语义范围，并保留第二个 ad 短语与下一节相连的可能性。
lexical_decisions:
- source_word: mala
  choice: 灾祸
  rationale: 此处指将要临到的多种祸患；“灾祸”比笼统的“恶事”更符合后列的丧偶、饥荒、刀剑和瘟疫。
- source_word: uiduitatem
  choice: 丧偶
  rationale: 拉丁词指寡居或失去配偶的状态；“丧偶”在现代汉语中自然，并不擅自限定性别。
- source_word: gladium
  choice: 刀剑
  rationale: 这里是战争与杀戮的转喻；保留“刀剑”可兼顾原文意象和经文语体。
- source_word: pestem
  choice: 瘟疫
  rationale: 在灾难清单中指致命疫病，“瘟疫”准确而通俗。
- source_word: domus tuas
  choice: 你的家园
  rationale: 复数 domus 可指房屋、家庭或居所；“家园”能自然涵盖这些意义，同时与“荒废”搭配。
- source_word: uiolationem
  choice: 侵害
  rationale: 保留该词“侵犯、伤害、摧残”的核心意义，不将它直接收窄为一般性的“毁灭”或误作修饰前一目的短语的方式状语。
theological_decisions:
- issue: 灾祸的施行者
  choice: 保留上帝以第一人称主动降下灾祸的表述
  alternative: 弱化为灾祸被容许临到
  rationale: 原文明确使用 Inmittam（“我要降下／派来”），不应以解释性措辞减弱其直接性。
- issue: 两个目的结构的关系
  choice: 译为“为要使……荒废，使……遭受侵害”两个并列目的
  alternative: 译为“以侵害的方式使你的家园荒废”
  rationale: 原文连续使用 ad deuastandas 与 ad uiolationem，句法上宜保留并列目的关系，而不是把后者改成方式状语。
translation_notes:
  register: '采用现代、庄重而易懂的普通话。“上帝说”将来源文本中的说话者标记 deus: 自然地纳入正文；灾难清单保留紧凑的并列节奏。'
