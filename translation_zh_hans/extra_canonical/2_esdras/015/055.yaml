  text: The wages of a prostitute are in your bosom[a]; therefore you will receive repayment.
translation:
  language: zh_hans
  text: 妓女的酬劳在你怀中；因此，你必得到报偿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有旧译作：“主说：你怎样对待我的选民，上帝也必怎样对待你，并把你交给灾祸。你的儿女必饿死，你也必倒在大刀之下。”这段文字实际对应后续经文，并非本节拉丁文本。
    reason: previous_rendering
lexical_decisions:
- source_word: merces fornicariae
  choice: 妓女的工价
  rationale: fornicariae是fornicaria（妓女）的属格，修饰merces（工价、酬劳）；按具体人物表达，不译作抽象的“淫乱的代价”。
- source_word: in sinus tuos
  choice: 在你怀中
  rationale: sinus可指胸怀、衣襟或怀抱；“在你怀中”保留原文具象而略含隐喻的表达。拉丁文tuos与复数sinus一致，汉语无需体现数。
- source_word: redditionem percipies
  choice: 你必得着报应
  rationale: redditio有归还、偿还或回报之义；结合审判语境译为“报应”，而percipies以“必得着”表达将来时及领受结果的含义。
theological_decisions:
- issue: “redditionem”所指回报的性质
  choice: 报应
  alternative: 偿还／回报
  rationale: 上下文带有审判意味，“报应”自然传达行为所得的相应后果；同时不具体说明由谁施行，也不超出原文建立额外教义。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“妓女的工价”紧贴拉丁文结构；“在你怀中”保留原文意象；分号呈现前因后果。脚注标记已在正文中列出。
