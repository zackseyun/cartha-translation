- source_word: non observant
  choice: 不遵守
  rationale: observare 在此指遵行、持守命令；“不遵守”清楚而自然。
- source_word: mandata mea
  choice: 我的诫命
  rationale: “诫命”准确体现 mandata 在神圣命令语境中的含义。
- source_word: dicit Dominus
  choice: 主说
  rationale: 按自然汉语引语结构前置，内容与语气不变。
