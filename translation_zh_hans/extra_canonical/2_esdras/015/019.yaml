base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/019.yaml
  text: A man will have no pity on his neighbor, but will rush upon their houses with the sword, plundering their possessions because of hunger for bread and great distress.
translation:
  language: zh_hans
  text: 人将不怜悯邻舍，反倒持刀剑闯入他们的家，抢夺他们的财物，因为缺粮和极大的患难。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non miserebitur homo proximo suo
  choice: 人将不怜悯邻舍
  rationale: 贴近拉丁文的单数泛指结构，保留“邻舍”所表达的社会与伦理关系。
- source_word: ad irritum faciendum in domos eorum in gladium
  choice: 反倒持刀剑闯入他们的家
  rationale: 原句这一短语的拉丁文形态不规则，语境明显指以刀剑侵袭住宅；采用自然中文表达暴力冲入之意，同时不添加原文没有的具体行动细节。
- source_word: ad diripiendas substantias eorum
  choice: 抢夺他们的财物
  rationale: diripere 表示掠夺、抢劫；substantiae 在此指所有物或财产，译为“财物”简明自然。
- source_word: propter famem panis
  choice: 因为缺粮
  rationale: 字面为“因面包的饥荒”，实指基本食物短缺；“缺粮”符合现代汉语灾荒语境，也保留原因关系。
- source_word: tribulationem multam
  choice: 极大的患难
  rationale: 保留 tribulatio 的苦难、困厄含义及 multam 的强度，使用庄重而通俗的圣经语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将不规则的拉丁短语按上下文译成“持刀剑闯入”，避免机械直译造成中文难解；不加入英文咨询文本之外的神学解释。
