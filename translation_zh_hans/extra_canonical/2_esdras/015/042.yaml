  text: And they will tear down cities and walls, mountains and hills, trees of the forests and grass of the meadows.
translation:
  language: zh_hans
  text: 他们必摧毁城邑和城墙、山岭和丘陵、森林中的树木和干草。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demolient
  choice: 必摧毁
  rationale: 保留第三人称复数主语与将来意味；“摧毁”既适用于城墙，也能自然涵盖山岭、树木和青草等随后列出的对象。
- source_word: ciuitates et muros
  choice: 城邑和城墙
  rationale: 逐项保留拉丁文并列结构；“城邑”庄重而仍为现代读者易懂。
- source_word: montes et colles
  choice: 山岭和冈陵
  rationale: 区分较大的 montes 与较低的 colles，同时避免中文表达过于生硬。
- source_word: ligna siluarum
  choice: 森林中的树木
  rationale: 此处 ligna 结合 siluarum 指森林里的树木或林木；按具体可见的毁坏对象译出。
- source_word: fena
  choice: 草场上的青草
  rationale: fena 可指草或干草；语境列举自然景物，采用较宽泛自然的“青草”，并依英语审校层补出其所在的草场。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并保留原文连续列举灾毁对象的节奏。所给拉丁文开头“campi et omnes ruii plenitudine aquarum illarum”属于前一句的残尾；本节依句首“Et demolient”起译，与审校后的英语分节一致。
