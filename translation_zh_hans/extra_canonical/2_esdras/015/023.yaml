  text: et exiit ignis ab ira eius et devoravit fundamenta terrae et peccatores quasi stramen incensum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/023.yaml
  text: And fire went out from his wrath and devoured the foundations of the earth[a], and sinners like straw set ablaze.
translation:
  language: zh_hans
  text: 有火从他的烈怒中发出，吞噬了大地的根基，也吞噬了罪人；他们如同燃烧的禾秸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“吞噬了大地的根基和罪人，如同燃烧的禾秸。”
    reason: 说明原文以“和”直接连接两个宾语；正文为符合现代汉语表达而复现了“吞噬了”，并用分号明确比喻主要描述罪人。
lexical_decisions:
- source_word: ignis
  choice: 火
  rationale: 直译“火”，保留审判景象，不将其抽象化为“怒火”。
- source_word: ab ira eius
  choice: 从他的烈怒中
  rationale: 表达火源自他的忿怒；“烈怒”自然庄重，也保留 ira 的强烈语气。
- source_word: fundamenta terrae
  choice: 大地的根基
  rationale: 按原文保留宇宙性的形象，不弱化为地上的建筑根基。
- source_word: devoravit
  choice: 吞噬了
  rationale: 保留原文把火拟作吞食者的强烈意象。
- source_word: peccatores
  choice: 罪人
  rationale: 采用现代汉语中清楚而传统的对应语。
- source_word: quasi stramen incensum
  choice: 如同燃烧的禾秸
  rationale: stramen 指禾秆、草秸一类易燃之物；“禾秸”比泛称“草”更贴近原义，incensum 译为“燃烧的”。
theological_decisions:
- issue: 火所吞噬的对象
  choice: 将“大地的根基”和“罪人”都作为“吞噬了”的宾语
  alternative: 把后半句处理成较松散、可能独立的“罪人如同燃烧的禾秸”
  rationale: 拉丁文以 et 连接 fundamenta terrae 与 peccatores，两者最自然地同受 devoravit 支配；分号和代词只是使中文层次清楚，并未改变句法关系。
- issue: “他的”所指
  choice: 保留原文的代词，不补明身份
  alternative: 根据上下文补作“上帝的”或其他明确称谓
  rationale: 本节拉丁文本仅用 eius；不在单节中加入原文未明说的神学指认。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“禾秸”保留农业意象；句式避免过度古雅。正文中的[a]与脚注对应。
