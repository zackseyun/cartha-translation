  source_fidelity: 译文总体准确保留了拉丁文的审判、火焰与受击意象，也正确地没有依英语审校记录擅自补出末句缺失的不定式。惟“你不能……你自己的人”在汉语正文中难以辨识为抄本中断，而像是不通顺的句子；应以更明确的残缺标记呈现。
  naturalness: “因打击而困苦”自然且不把 paupera 限缩为经济贫穷。“被创伤鞭笞”刻意保留原文尖锐的修辞，但稍显生硬；“又遭创伤鞭笞”较合现代汉语，同时仍保持创伤作为施行鞭笞之物的反常意象。
  terminology: “烈焰”“衰弱”“打击”“鞭笞”均与 ardor、infirmaberis、plaga、mastigata 相称。“属于你的人”比“你自己的人”更符合现代汉语，并保留 tuos 的未具体化指涉。
  issues:
