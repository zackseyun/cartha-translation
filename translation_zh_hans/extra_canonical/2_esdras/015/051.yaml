  to: 那向你发出的烈焰必升起；你必衰弱，因打击而困苦，又遭创伤鞭笞，以致你不能……［属于你的人］。[a]
  rationale: 修订仅改善末句残缺在汉语中的可读性，并以方括号明确其为残存而未完成的句段；同时将“你自己的人”调整为更自然、但同样未具体化的“属于你的人”。其余内容保留原译对拉丁文意象与歧义的谨慎处理。
