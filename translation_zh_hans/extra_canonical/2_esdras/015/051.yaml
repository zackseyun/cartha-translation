  text: exsurget ardor qui emissus est super te. Et infirmaberis et paupera a plaga et mastigata a uulneribus, ut non possis tuos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/051.yaml
  text: The burning that has been sent out against you will rise up[a], and you will be weakened and made poor by the blow, and scourged by wounds, so that you will not be able to receive your own.
translation:
  language: zh_hans
  text: 那向你发出的烈焰必升起；你必衰弱，因打击而困苦，又遭创伤鞭笞，以致你不能……［属于你的人］。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在“属于你的人”处中断：possis（“能”）之后所需的动作词已经缺失。方括号内译出残存的 tuos，意为“属于你的人”；不应据此确定补作任何动作，如“接纳”。
    reason: 说明源文本的句法残缺，标示残存词语，并避免将英语审校层的补足当作确定原文。
lexical_decisions:
- source_word: ardor
  choice: 烈焰
  rationale: 该词可指灼热、燃烧或烈火；结合“发出”和“升腾”，译作“烈焰”自然地保留火焰意象。
- source_word: exsurget
  choice: 必升腾起来
  rationale: 表达“起来、升起”，与烈焰搭配时“升腾起来”符合现代汉语。
- source_word: infirmaberis
  choice: 你必衰弱
  rationale: 保留被动／状态变化的含义，不擅自限定为疾病或军事失败。
- source_word: paupera a plaga
  choice: 因打击而困苦
  rationale: plaga在“鞭笞、创伤”的语境中更可能指打击而非瘟疫；paupera既可涉及贫乏，也可描述凄惨困顿的状态，“困苦”避免过度限定为经济贫穷。
- source_word: mastigata a uulneribus
  choice: 被创伤鞭笞
  rationale: 尽量保存原文将“鞭笞”与“创伤”并置的强烈刑罚意象，虽在汉语中略显反常，却不将两者合并或改写。
- source_word: tuos
  choice: 你自己的人
  rationale: 阳性复数所有形容词名词化，可指“属于你的人”；不补入原文没有明示的具体群体。
theological_decisions:
- issue: 末句在现存拉丁文本中语法未完
  choice: 以省略号保留缺口，并直译tuos为“你自己的人”
  alternative: 依英语咨询文本补作“接纳你自己的人”
  rationale: possis之后通常需要不定式，但所给拉丁文本直接止于tuos；补入“接纳”会把未经现存文本证实的动作写入正文，因此以脚注说明残缺更忠于来源。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留第二人称审判宣告的力度、火焰与肉体惩罚的意象，并以省略号如实呈现末句残缺。
