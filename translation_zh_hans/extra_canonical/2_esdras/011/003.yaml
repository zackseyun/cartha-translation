  source_fidelity: 需作小幅修订。“纤弱”并非 minutis et modicis 的明确含义；这两个词均主要强调小、微小或有限。另正文的“相对的翅膀”虽可理解，但可更清楚地表达 contrariae 所保留的方位／对立歧义。
  naturalness: 原文整体庄重通顺，但“细小而纤弱的小翼”在汉语中略显堆叠，且“纤弱”带出原文未明说的脆弱性。改为“细小的小翼”更自然、准确。
  terminology: 两处 penna 均译为“翅膀”是正确且一致的；pennaculum 译为“小翼”恰当。contrariae 宜保留为“相对的”，并以脚注提示“相抗的”这一可能。
