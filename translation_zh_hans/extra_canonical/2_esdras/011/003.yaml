source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et de pennis eius nascebantur contrariae pennae, et ipsae fiebant in pennaculis minutis et modicis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/003.yaml
  text: And I looked[a], and from its wings there grew opposite wings, and these became little pinions, small and slight.
translation:
  language: zh_hans
  text: 我观看，看见从它的翅膀上长出与之相对的翅膀；这些翅膀变成细小的小翼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennis ... pennae
  choice: 翅膀……翅膀
  rationale: 两处都是同一拉丁名词 penna 的变格；在本章鹰的异象中均指翅膀。保持同词对应，也避免无根据地把前者改译为“羽毛”。
- source_word: contrariae
  choice: 相对的
  rationale: 直接保留 contrarius 所表达的相对、相反方位；上下文没有充分依据把它明确解释为敌对或争斗。
- source_word: pennaculis minutis et modicis
  choice: 细小而纤弱的小翼
  rationale: pennaculum 是指小翼或翼端羽部的指小形式；minutis et modicis 叠加描写其微小、有限、不强盛，译文以自然汉语再现其弱小形态。
- source_word: nascebantur ... fiebant
  choice: 生出……变成
  rationale: 分别对应“出生、长出”和“成为”，保留异象中先萌生、后形成小翼的过程。
theological_decisions:
- issue: contrariae 是否含敌对意义
  choice: 正文译“相对的”
  alternative: 相抗的／敌对的
  rationale: 拉丁词可指位置相对，也可引申为对抗；本节本身不足以确定敌意，因此正文不把含义收窄，并以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我观看，见……”自然传达异象叙述中的 Et vidi；保留“翅膀”一词的重复，以反映原文刻意重复 penna 的视觉形象。
