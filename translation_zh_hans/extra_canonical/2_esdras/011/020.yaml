review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了 et ipsae 的“也”和 ut tenerent principatum 的目的关系，但“从右边”把 a dextera parte（在右边／右侧）误作来源或方向；“掌了权”也较像已经取得权位，未充分反映 tenebant 的持续“掌权”状态。
  naturalness: “竖立起来”虽可字面对应 erigebantur，却不如异象语境中的“兴起”自然；“到了适当的时候”比“到了时候”更符合现代汉语，并传达 in tempore 的“到适时／适当时机”。
  terminology: “翅膀”“掌权”均合适。保留“看哪”和句末破折号，维持庄重的异象叙事语体及 sed 未完的转折。
  issues:
  - severity: medium
    issue: “从右边竖立起来”
    rationale: a dextera parte 表示位置“在右边／右侧”，不是“从右边”这一来源或运动起点。
  - severity: medium
    issue: “其中有些掌了权”
    rationale: ex his erant quae tenebant 表示其中有些正在／确实执掌统治权；“掌了权”偏向完成性地获得权力，且弱化 tenebant 的持续状态。
  - severity: low
    issue: “到了时候”及“竖立起来”
    rationale: 前者在现代汉语中略显生硬，后者对异象中的翅膀不够自然；分别改为“到了适当的时候”和“兴起”更自然，同时不损失原文含义。
