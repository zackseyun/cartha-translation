  text: gerere et iterum nusquam conparere. Et uidi et ecce in tempore sequentes pennae erigebantur et ipsae a dextera parte, ut tenerent principatum; et ex his erant quae tenebant, sed
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/020.yaml
  text: And I looked[a], and behold, in due time the following wings also rose up on the right side, to hold rule; and among them were some that held it, but
translation:
  language: zh_hans
  text: 我观看，看哪，到了适当的时候，随后那些翅膀也在右边兴起，要掌权；其中有些在掌权，但是——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 我观看，看哪
  rationale: 保留异象叙事中“观看”与提示注意的“看哪”，语气庄重而自然。
- source_word: in tempore
  choice: 到了时候
  rationale: 直译为“在时候中”不合现代汉语；此处表达时机来到，不额外加入“所定”等原文没有的神学限定。
- source_word: sequentes pennae
  choice: 接下来的翅膀
  rationale: sequentes 指随后出现或依次而来的翅膀；“接下来的”能保留其顺序含义。
- source_word: erigebantur et ipsae a dextera parte
  choice: 也从右边竖立起来
  rationale: “也”体现 et ipsae 的包含或强调意味；以“竖立起来”对应未完成过去时 erigebantur，同时在汉语中自然呈现异象中的动作。
- source_word: ut tenerent principatum
  choice: 要掌权
  rationale: tenere principatum 表示取得或执掌统治权；“要掌权”简洁保留目的含义。
- source_word: ex his erant quae tenebant
  choice: 其中有些掌了权
  rationale: 保留有些实际执掌权柄、并非全部如此的区别；宾语可由上文“权”自然补足。
theological_decisions:
- issue: 翅膀竖立与掌权之间的关系
  choice: 译作“竖立起来，要掌权”
  alternative: “兴起执政”
  rationale: 原文以目的从句 ut tenerent principatum 表达意图或趋向；不把异象动作直接解释为已经开始统治。
- issue: in tempore 是否指神所预定的时刻
  choice: 译作“到了时候”
  alternative: “到了所定的时候”
  rationale: 拉丁文本本身未明说“所定”，因此保留时间表达，不加入额外的预定论含义。
translation_notes:
  register: 采用现代、庄重、易懂的异象叙事语体。“但是——”保留本节以 sed 戛然而止并延续至下节的句法张力。英文脚注所列内容实际是先前译法，不构成拉丁文本的实质异文，故不设中文脚注。
