  text: And after this I looked[a], and behold, the middle head suddenly disappeared, just as the wings had done.
translation:
  language: zh_hans
  text: 中间的头突然消失了，也像那些翅膀一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文此处省略了重复的动词，直译为“这也像那些翅膀一样”，意思是中间的头如同那些翅膀一样消失了。
    reason: 说明 et hoc sicut alae 的省略结构，同时保留其简略的比较关系。
lexical_decisions:
- source_word: medium caput
  choice: 中间的头
  rationale: 按拉丁文直译其位置性描述；上下文所指为鹰的中间一个头。
- source_word: subito non conparuit
  choice: 突然消失了
  rationale: non conparuit 字面为“不再显现／看不见了”，在此叙事语境中自然表达为“消失了”。
- source_word: alae
  choice: 那些翅膀
  rationale: 使用“那些”承接上文已经提到并消失的翅膀。
