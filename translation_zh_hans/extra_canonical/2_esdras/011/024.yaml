  text: 我观看，看哪，六根小翎羽中有两根分离出来，留在右边的那个头下面；因为
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennacula
  choice: 小翎羽
  rationale: 这是 pennaculum 的复数形式，指前文与鹰相关的较小羽状构造；“小翎羽”既保留其羽毛意象，也体现指小形式。
- source_word: diuisa sunt duo
  choice: 有两根分离出来
  rationale: 按拉丁文语序和数的一致关系，表达六根之中有两根被分开或离开其余部分，不额外说明施事。
- source_word: sub capite
  choice: 在……头下面
  rationale: 直译空间关系 sub，保留异象描写的具体位置。
- source_word: ad dexteram partem
  choice: 右边的
  rationale: 自然表达“位于右侧”的方位限定，修饰“那个头”。
- source_word: nam
  choice: 因为
  rationale: 保留拉丁文的因果连接；本节句意未完，继续指向下一节。
