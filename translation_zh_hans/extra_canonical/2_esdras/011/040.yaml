base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/040.yaml
  text: And the fourth that came overcame all the beasts that had passed before[a], and held the age by its power with great trembling, and the whole world with most grievous oppression[b], and for so long inhabited the world with deceit.
translation:
  language: zh_hans
  text: 那第四只兽来到以后，战胜了先前出现的一切兽类[a]；它凭权势掌控这个世代，使这个世代极为恐惧，又使全世界遭受极其沉重的苦难[b]，并以诡诈在世上盘踞了如此之久。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节拉丁文本有几处文字粗糙。这里依照可辨认的意思理解为：第四只兽胜过此前的诸兽，并以恐惧、苦难和诡诈辖制这个世代和世界。
    reason: textual_variant
  - marker: b
    text: 也可译作：“它凭权势掌控这个世代，使之大大震恐，并使全世界陷于极其沉重的苦难。” “苦难”所译的拉丁词可指劳苦、困苦；在此统治语境中也可包含压迫。
    reason: previous_rendering
lexical_decisions:
- source_word: animalia
  choice: 兽类
  rationale: 在异象语境中指先前出现的诸兽；译作“兽类”既保留复数总称，也与“第四只兽”衔接自然。
- source_word: potentatu
  choice: 凭权势
  rationale: 保留拉丁文所明说的权力或统治手段，不将其省略。
- source_word: saeculum
  choice: 这个世代
  rationale: 该词可指时代、世代或世界秩序；此处与后面的“全世界”并列，译作“这个世代”可避免合并两者。
- source_word: tremore multo
  choice: 极大的恐惧
  rationale: 按统治造成的效果自然表达，同时保留强烈程度。
- source_word: labore pessimo
  choice: 极其沉重的压迫
  rationale: labore本可指劳苦、困苦；在强权辖制世界的语境中，“压迫”较能传达所受的惨重苦难。
- source_word: inhabitabant
  choice: 盘踞
  rationale: 底本文字粗糙且动词为复数，与上下文主语不协调；依可辨认的整体意思译为带贬义的长期占据，并在脚注说明。
theological_decisions:
- issue: “第四只兽”与此前诸兽的关系
  choice: 战胜了先前出现的一切兽类
  alternative: 胜过了先前的一切兽类
  rationale: deuicit通常表示击败、征服；采用“战胜”而不把它解释为单纯程度上的超越。
- issue: saeculum与orbis的区分
  choice: 分别译为“这个世代”和“全世界”
  alternative: 两者都译作“世界”
  rationale: 保留原文并列的两个不同名词及其可能的意义张力。
- issue: 末句残损文字的处理
  choice: 依上下文表达为以诡诈长期盘踞世上
  alternative: 仅按现存残文直译而留下不完整句子
  rationale: 正文需可读，但不把不确定性伪装成确定文本，因此以脚注明示拉丁文的粗糙和残缺。
translation_notes:
  register: 采用现代、庄重而清楚的异象叙事语言。“掌控”突出tenens的持续控制，“盘踞”体现长期占据及负面语气。脚注标记[a]、[b]均已置于正文相应位置；不对第四兽作超出本节的历史或宗派性认定。
