  source_fidelity: “labore pessimo”基本义为“极其沉重的劳苦、困苦／苦难”；正文译为“压迫”虽与英语审校轨迹相合，却把原文较宽的苦难语义收窄为特定施压行为。将其译为“极其沉重的苦难”更贴近拉丁文，也不排除压迫所造成的苦难。其余关键成分——第四兽、胜过先前诸兽、凭权势、世代与全世界的并列，以及末句文本不稳——均得到保留。
  naturalness: 修订后句子仍保持现代汉语庄重、流畅的异象叙事体。“使这个世代极为恐惧”比“掌控这个世代，带来极大的恐惧”更直接地对应“tenens saeculum cum tremore multo”。
  terminology: 保留“兽”“权势”“世代”“全世界”。“苦难”对应labore，避免将其限定为“压迫”；脚注说明可包括压迫的语境性理解。
