base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/010.yaml
  text: And I looked, and behold, a voice did not come out from its heads, but from the middle of its body.
translation:
  language: zh_hans
  text: 我看见，看哪，有声音发出，却不是从它的众头发出的，而是从它身体的中部发出的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 我观看，看哪
  rationale: 保留异象叙事中连续观看与引起注意的表达；“看哪”以庄重而易懂的方式对应 ecce。
- source_word: uox
  choice: 有声音
  rationale: 拉丁文无冠词；译作“有声音”自然地呈现一个声音出现，同时避免擅自将其限定为先前已知的特定声音。
- source_word: de capitibus eius
  choice: 从它的头中
  rationale: 保留 capitibus 的复数意义，并按现代汉语习惯用“中”表达声音从这些头那里发出。
- source_word: de medietate corporis eius
  choice: 从它身体的中部
  rationale: 直译 medietate 为“中部”，保留其空间位置含义，不进一步推定具体器官或部位。
theological_decisions: []
