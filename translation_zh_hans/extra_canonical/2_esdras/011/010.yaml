  source_fidelity: 译文基本保留了拉丁文的对照：声音并非出自其多个头，而是出自身体的中部。不过“从它的头中发出”容易被理解为从头的内部发出，且未清楚呈现复数；“有声音不是从……发出”句法也不够顺畅。
  naturalness: “我观看，看哪”带有经文语体，但现代汉语中“我看见，看哪”更自然。将“有声音不是从……发出”改为“有声音发出，却不是从……发出的”可使否定和转折关系清楚、自然。
  terminology: “看哪”适合保留 ecce 的庄重提示语气。“众头”明确对应 capitibus 的复数，且不擅自解释异象形象；“身体的中部”准确对应 de medietate corporis eius。
  issues:
