  text: 第二只也没有出现；它比前一只更快地消失了。我看见，看哪，有两只……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non conparuit
  choice: 没有再出现……消失了
  rationale: 该短语可直译为“不再出现／不见了”，在此叙事语境中表示消失；采用兼顾字面形式与实际语义的表达。
- source_word: uelocius quam prior
  choice: 比前一只更快地
  rationale: 准确保留比较级及与前一只的比较；“只”呼应上下文中的鹰头。
- source_word: Et uidi et ecce
  choice: 我又观看，看哪
  rationale: 保留异象叙事中“观看—看哪”的强调结构，同时用“又”自然承接前文。
- source_word: duae quae
  choice: 有两只……
  rationale: 原文在此截断并延续至下节；译文不擅自补足关系从句，以省略号标明句意未完。
