  source_fidelity: “non conparuit”直义为“没有出现／不再显现”，不宜用“而是”把它与“消失”构成排他的转折；该处应保留原文简略而略带紧凑的叙述。译文末尾须保留“Et uidi et ecce duae quae”所开启、并延至下一节的未完成关系结构。
