  text: Then I saw, and behold, something like a lion roused from the forest.
translation:
  language: zh_hans
  text: 我看见，看哪，仿佛有一头狮子从林中奋起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi
  choice: 我就观看
  rationale: 按拉丁文直译其叙事推进；“观看”比单纯“看见”更能承接异象场景。
- source_word: et ecce
  choice: 看哪
  rationale: 保留异象文学中提示突现景象、引起注意的表达。
- source_word: sicut leo
  choice: 仿佛有一头狮子
  rationale: 保留 sicut 的比拟性质，不把所见之物直接等同于狮子。
- source_word: suscitatus
  choice: 奋起
  rationale: 该词可表示被唤起、起来或振起；此处用“奋起”自然呈现狮子由静止转为行动的有力形象，同时不明确添加唤醒者。
- source_word: de silua
  choice: 从林中
  rationale: 准确表达来源或出来的方位，采用简洁庄重的现代汉语。
theological_decisions:
- issue: 狮子形象是实体还是比拟
  choice: 用“仿佛”保留比拟
  alternative: 有一头狮子
  rationale: 拉丁文 sicut 明示相似关系；不应在译文中消除异象本体与狮子形象之间的张力。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；保留“看哪”这一圣经异象叙事的提示语。前置残句“sidera quod uides”明显属于上一节或残片衔接，不纳入本节正文。
