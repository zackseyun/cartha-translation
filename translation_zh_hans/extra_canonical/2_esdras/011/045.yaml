  text: Propterea non apparens non appareas tu aquila et alae tuae horribiles et pennacula tua pessima et capita tua maligna et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/045.yaml
  text: Therefore may you never appear again—you[a], eagle, and your dreadful wings and your most wicked pinions and your evil heads and your wicked claws and all your worthless body—
translation:
  language: zh_hans
  text: 所以，愿你永远不再出现[a]——你这鹰，还有你可怕的翅膀、你极其邪恶的翎羽、你凶恶的头颅、你邪恶的利爪，以及你整个毫无价值的躯体——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以重复的否定形式加强语气，近似直译为“并不出现，愿你不要出现”；也可表达为“愿你彻底消失”。
    reason: 说明 non apparens non appareas 的强调结构，避免把它理解为目的或结果从句。
lexical_decisions:
- source_word: Propterea
  choice: 所以
  rationale: 自然承接上文所述理由，保留因果关系。
- source_word: non apparens non appareas
  choice: 愿你永远不再出现
  rationale: 这一重复否定结构具有加强语气的作用；用“永远不再”表达彻底消失、不复出现的诅咒或愿望，同时保留非直陈语气。
- source_word: aquila
  choice: 鹰
  rationale: 采用该异象中这一形象的普通、准确称呼。
- source_word: alae tuae horribiles
  choice: 你可怕的翅膀
  rationale: 直译核心意象；“可怕”准确传达 horribiles。
- source_word: pennacula tua pessima
  choice: 你极其邪恶的翎羽
  rationale: pennacula 指较小的羽翎或翅羽，但汉语不宜机械加入“小”；pessima 在此表达强烈的道德贬义，译为“极其邪恶”。
- source_word: capita tua maligna
  choice: 你凶恶的头颅
  rationale: “凶恶”兼顾 maligna 的恶意与邪恶色彩；“头颅”适合异象中多个头的庄重叙述。
theological_decisions:
- issue: non apparens non appareas 的语气与结构
  choice: 译作带愿望、诅咒意味的“愿你永远不再出现”
  alternative: “彻底消失”或“消失，好叫你不再出现”
  rationale: 拉丁文的分词加限定动词重复结构主要加强否定，并非清楚的目的从句；所选译法既体现强调，也保留 appareas 的虚拟语气。
- issue: 是否补入所给拉丁文之外的“利爪”和“整个躯体”
  choice: 不补入
  alternative: 依据英文咨询层补译“邪恶的利爪和整个毫无价值的躯体”
  rationale: 用户提供的拉丁文在 capita tua maligna et 处中断；英文层虽含后续内容，但本稿优先受所给原文证据约束，不把当前拉丁引文未提供的词语无标记地写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的异象文学语体。“愿你永远不再出现”保留宣告式诅咒的力度。所给拉丁文末尾止于连词 et（“和”），显然不完整，因此正文以破折号收束，不擅自补入当前原文引文未见的成分。
