  text: ungues tui pessimi et omne corpus tuum uanum, Vti refrigeret omnis terra et releuetur liberata de tua ui et speret iudicium et misericordiam eius qui fecit eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/046.yaml
  text: and your wicked claws and your whole worthless body[a], so that the whole earth may be refreshed and relieved, freed from your violence, and may hope for the judgment and mercy of him who made it.”
translation:
  language: zh_hans
  text: 你那邪恶的利爪和你整个毫无价值的躯体，使全地得以复苏[a]、得蒙舒缓，脱离你的暴虐，并盼望那创造全地的那一位的审判和怜悯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得享安息”。
    reason: refrigeret 可指恢复清凉、振作或从压迫中获得喘息；正文以“复苏”表达恢复之意，脚注保留传统的“安息”译法。
lexical_decisions:
- source_word: ungues tui pessimi
  choice: 你那邪恶的利爪
  rationale: 直译意象并保留责斥语气；pessimi 表明极恶或邪恶，现代汉语用“邪恶”自然庄重。
- source_word: omne corpus tuum uanum
  choice: 你整个毫无价值的躯体
  rationale: uanum 在此描述鹰的身体为虚妄、无用或不堪存留；“毫无价值”比单纯“虚空”更符合此处毁灭宣告的语境。
- source_word: refrigeret
  choice: 得以复苏
  rationale: 该词可指变得清凉、恢复精神或获得喘息；“复苏”表达受压之后重新恢复的含义，也与审定英文的 refreshed 相符。
- source_word: releuetur
  choice: 得到舒缓
  rationale: 保留“减轻重负、获得缓解”的意义，并与后面的“摆脱”区分。
- source_word: liberata de tua ui
  choice: 摆脱你的暴虐
  rationale: liberata 表示获得释放，uis 在此指强力、暴力或暴虐统治；此译兼顾动作与压迫语境。
- source_word: speret iudicium et misericordiam
  choice: 盼望……审判和怜悯
  rationale: 保留审判与怜悯并列所形成的神学张力，不把审判弱化为单纯的伸冤或拯救。
- source_word: eius qui fecit eam
  choice: 那创造全地者的
  rationale: eam 回指 terra；明确译为“全地”可避免汉语代词指向不清，同时不额外加入原文没有的称号。
theological_decisions:
- issue: 审判与怜悯的并列
  choice: 保留“审判和怜悯”
  alternative: 解释为“公正而怜悯的拯救”
  rationale: 拉丁文将 iudicium 与 misericordiam 并列；应保留二者之间真实的张力，不作教义性合并。
- issue: 创造者的称谓
  choice: 那创造全地者
  alternative: 创造主／上帝
  rationale: 原文为关系从句“创造它的那一位”，没有明用 Deus 或 Dominus，因此采用描述性称谓，避免增译。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。经文从承接上节的宾语短语开始，保留所给拉丁文本和标准分节形成的句法残缺感；结尾引号承接讲话语境。
