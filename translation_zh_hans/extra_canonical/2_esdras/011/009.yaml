lexical_decisions:
- source_word: Capita
  choice: 这些头
  rationale: 保留异象中“头”的具体意象；拉丁文虽无指示词，但汉语在承接上下文时加“这些”更自然，也不改变所指。
- source_word: seruentur
  choice: 要留到
  rationale: 用“要留到”表达第三人称复数现在时被动虚拟式在命令、安排语境中的语气，较直译“被保留”更符合现代汉语。
- source_word: in nouissimo
  choice: 到最后
  rationale: 表示留待末后阶段，译作“到最后”自然准确，同时不额外界定具体终末事件。
