  text: regnare in saeculo meo, et ut per ea ueniret finis temporum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/039.yaml
  text: Are you not the one that remains of the four beasts which I had made to reign in my age[a], so that through them the end of my times might come?
translation:
  language: zh_hans
  text: 你不就是那四兽中余下的一个吗？我曾使它们在我的时代[a]掌权，使诸时代的终局借着它们得以到来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在我的世代”。
    reason: saeculum 可指“时代”或“世代”；正文采用较符合现代汉语语境的“时代”。
lexical_decisions:
- source_word: regnare
  choice: 掌权
  rationale: 不及物动词表示执掌统治权；“掌权”比“作王”更适合以兽象征政权的语境。
- source_word: in saeculo meo
  choice: 在我的世代
  rationale: saeculum 在此可指一个时代或世代；采用“我的世代”保留说话者以其所定时代为框架的表达。
- source_word: per ea
  choice: 借着它们
  rationale: per 加宾格表示媒介或途径；中性复数代词回指四兽。
- source_word: finis temporum
  choice: 时代的终局
  rationale: 保留 finis 的终结含义和 temporum 的复数时代观，同时避免把它过度限定为某一教义化的“末世”。
- source_word: ueniret
  choice: 到来
  rationale: 未完成时虚拟式受 ut 引导，表达预期或目的性的结果；“好让……到来”自然呈现这一关系。
theological_decisions:
- issue: 四兽与终局之间的关系
  choice: 好让时代的终局借着它们到来
  alternative: 以致我的时代借着它们结束
  rationale: 拉丁文 ut per ea ueniret finis temporum 可有目的或结果色彩；正文以“好让”贴近英语审校层及语法上的目的读法，但不解释兽本身如何促成终局。
- issue: “我的”修饰范围
  choice: 我的世代
  alternative: 我的时代的终局
  rationale: 现存拉丁短语明确为 in saeculo meo，而 finis temporum 本身没有所有格；因此把“我的”保留在 saeculum 上，不移到“终局/时代”上。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“你不就是……吗”承接问责式反问；“四兽中余下的一个”按英语审校层所反映的上文拉丁语义译出。所给拉丁原文仅保存本节后半句，因此前半句依据经审校的英语咨询层表达，并避免加入额外解释。
