  yaml_path: translation/extra_canonical/2_esdras/011/030.yaml
  text: And behold, the head turned with those who were with it,
translation:
  language: zh_hans
  text: 看哪，那头和与它同在的那些都转过身来，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et ecce
  choice: 看哪
  rationale: 保留异象叙事中引人注意的提示语，同时省去在现代汉语中略显累赘的连接词“并且”。
- source_word: conuersum est
  choice: 转过身来
  rationale: 拉丁语完成时被动形式在此具有中间意义，表示主体转身；译法自然，并保留动作已经发生的意味。
- source_word: caput
  choice: 那头
  rationale: 直译为“头”，并用“那”承接上下文中特指的异象形象；不擅自解释其象征所指。
- source_word: cum his qui cum eo erant
  choice: 和跟随它的那些一同
  rationale: 表达这些对象与“头”同在并随之行动；“那些”保留原文未明说其身份的含混性，“它”与非人异象形象相称。
theological_decisions:
- issue: “头”的象征身份
  choice: 保留“那头”这一异象称谓，不作解释
  alternative: 按上下文将其释为某位统治者或某种势力
  rationale: 本节原文本身只说 caput；直译可保留异象的神学张力，避免把解释写入正文。
- issue: 随从者的身份
  choice: 译作“跟随它的那些”，不补出“人”或其他实体
  alternative: “跟随它的那些人”
  rationale: 拉丁语 his qui 并未明确说明其类别；不补出“人”可保存原文的指代开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留经文异象语体；全句以逗号结尾，以对应所给原文为未完句并衔接下节。
