- source_word: Nam et
  choice: 因为……也
  rationale: 同时保留 nam 的解释或因由关系，以及 et 的附加意义，不弱化为单纯的“而”。
- source_word: aliquae ex eis
  choice: 其中也有一些
  rationale: 保留 aliquae 的不定数量和 ex eis 的部分关系；其阴性所指由上文确定，本节不擅自补明。
- source_word: erigebantur
  choice: 竖立起来
  rationale: 保留未完成时被动形式所表达的过程性状态；在此语境中可自然理解为“起来、立起”。
