  rationale: 既保留“保持清醒、守望”的语义，也符合异象语境中较庄重的表达；前后两处采用同一译法。
- source_word: in loco suo
  choice: 在自己的位置
  rationale: 直译其空间含义，不擅自具体化为巢、岗位或住处。
- source_word: per tempus
  choice: 一段时间
  rationale: 准确表达有限时段，而不增添原文没有明确表达的“轮流”之意。
