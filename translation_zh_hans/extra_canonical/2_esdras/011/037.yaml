  text: 'roaring; and I heard how it sent out a human voice to the eagle and said[a], saying: “Hear, and I will speak to you; the Most High says to you:'
translation:
  language: zh_hans
  text: 吼叫着；我听见它向那鹰发出人的声音，说[a]：“你要听，我要对你说话；至高者对你说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作：“我观看，看哪，仿佛有一头狮子从林中奋起，吼叫着；我听见它向那鹰发出人的声音，说了。”
    reason: 先前译法；其中包含现行分节中属于11:36末尾的文字。
lexical_decisions:
- source_word: mugiens
  choice: 吼叫着
  rationale: 保留现在分词所表达的持续动作，并维持本节承接上一节的残句式开头。
- source_word: emisit uocem hominis
  choice: 发出人的声音
  rationale: 贴近拉丁文的具体表达，不改写为较抽象的“用人的声音说话”。
- source_word: aquilam
  choice: 那鹰
  rationale: 上下文所指明确，以“那”体现特指。
- source_word: dixit dicens
  choice: 说了……说道
  rationale: 有意保留“说—说道”的重复结构，以反映原文带有闪语色彩的套语，而不完全压平为单一的“说”。
- source_word: Audi tu
  choice: 你要听
  rationale: 保留第二人称代词的强调意味及命令语气。
- source_word: altissimus
  choice: 至高者
  rationale: 采用自然、庄重且不额外限定其神学含义的称谓。
theological_decisions:
- issue: “至高者”话语的引述层级
  choice: 保留“至高者对你说：”后的冒号与未完引语
  alternative: 补足或概述至高者随后所说的话
  rationale: 本节原文本就在引出后文之处结束；不跨越经节边界补入内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句首“吼叫着”刻意保留原文跨节承接的形态；“说了……说道”虽略显重复，但用于呈现拉丁文 dixit dicens 背后的闪语式表达。脚注标记已在正文中以[a]标出。
