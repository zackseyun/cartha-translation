source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nam capita eius erant quiescentia, et medium caput erat maius aliorum capitum, sed et ipsa quiescebat cum eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/004.yaml
  text: For its heads were at rest[a], and the middle head was larger than the other heads, yet it too was at rest with them.
translation:
  language: zh_hans
  text: 因为[a]它的头都静止不动；中间的头比其他各头大，但它也和它们一同静止不动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“原来”。
    reason: Nam 可按上下文译为解释性的“因为”或“原来”；锚点置于对应的连接词后，以保留其语篇功能上的细微弹性。
lexical_decisions:
- source_word: Nam
  choice: 因为
  rationale: 拉丁文 Nam 在此引出对上文情形的解释，具有说明或因果意味；译作“因为”可与后文 sed 的转折清楚区分。
- source_word: capita eius
  choice: 它的几个头
  rationale: capita 是复数；“几个头”在现代汉语中自然，也明确表达鹰有多个头。
- source_word: quiescentia / quiescebat
  choice: 静止不动
  rationale: quiescere 在异象场景中表示处于静止、没有行动的状态；两处采用相同措辞，以保留原文的重复与对应。
- source_word: medium caput
  choice: 中间的头
  rationale: 直接保留 medium 的空间含义，不将其解释为权位或象征地位。
- source_word: maius aliorum capitum
  choice: 比其他几个头更大
  rationale: 按拉丁文比较结构表达体量上的“大”；不额外解释为更强或更尊贵。
- source_word: sed et ipsa
  choice: 但它也
  rationale: sed 表示转折，et ipsa 强调连那个较大的中间头也处于相同状态。
theological_decisions:
- issue: 中间较大的头是否暗示更高权势
  choice: 仅译为“更大”
  alternative: 译为“更强大”或“更有权势”
  rationale: 原文 maius 本身只明确表达“大”，象征意义应留待上下文说明，不在本节中预先判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文前后两次“静止不动”的重复，并用分号呈现先述各头、再聚焦中间之头的句法层次。
