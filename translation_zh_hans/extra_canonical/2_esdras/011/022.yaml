  naturalness: 现有译文整体庄重自然，但首句补出承接上文的“他们”更符合汉语句法，也使否定的主体清楚。以“这些事以后，我观看”对应异象叙事公式，简洁且自然。
  terminology: “掌权”不预断 *principatum* 是王位、帝权或其他特定政治制度，术语选择恰当。“看哪”适合保留 *ecce* 的经文式提示功能。
