  text: 但他们没有掌权。这些事以后，我观看，看哪，并没有——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tenebant principatum
  choice: 掌权
  rationale: 该短语指持有或执掌统治权；“掌权”在现代汉语中自然、凝练，也保留政治统治的含义。
- source_word: Et uidi post haec
  choice: 此后我又观看
  rationale: “此后”对应时间推进，“又观看”延续异象叙事中反复出现的观看公式。
- source_word: ecce
  choice: 看哪
  rationale: 保留拉丁文提示读者注意的异象用语，并维持庄重的经文语体。
- source_word: non
  choice: 并没有——
  rationale: 原始材料在non之后截断，本节语法未完；以破折号明确保留残缺和悬置，不从后文擅自补足宾语或谓语。
theological_decisions:
- issue: principatum所指统治地位的具体性质
  choice: 译作“掌权”，不进一步限定为王位、帝国或最高统治权
  alternative: 执掌王权／占据统治地位
  rationale: 本句本身只表明未能持有统治权，具体政治或象征指向应由上下文决定，不在译文中预先作神学或历史解释。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“看哪”保留经文式警示词；末尾用破折号表示现存分节文本在否定词后中断。
