  text: quod erat medium, euigilabat, hoc enim erat duorum capitum maius. Et uidi quomodo conplexa est duo capita secum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/029.yaml
  text: the one that was in the middle awoke[a], for it was larger than the two heads. And I saw how it drew the two heads to itself,
translation:
  language: zh_hans
  text: 中间的那个头醒了，因为它比另外两个头大。我看见它把那两个头收拢到自己身边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收拢到自己身边”或译“抱住”。
    reason: 拉丁语 conplexa est 可兼有环抱、抱住和聚拢之意，具体动作存在词义幅度。
lexical_decisions:
- source_word: quod erat medium
  choice: 中间的那个头
  rationale: 结合上下文，关系代词所指是三个头中居中的那个；补出“头”可使现代汉语清楚自然。
- source_word: euigilabat
  choice: 醒了
  rationale: 直译其“从睡眠或静止中醒来”的基本意义，并保留叙事中的拟人表达。
- source_word: maius
  choice: 大
  rationale: 此处比较三个头的大小；译作“大”比抽象的“更伟大”更符合具体形象。
- source_word: conplexa est ... secum
  choice: 把……收拢到自己身边
  rationale: complector 可表示抱住、环抱或聚拢；“收拢到自己身边”既符合动作方向，也避免过度具体化为人的拥抱姿势。
theological_decisions: []
