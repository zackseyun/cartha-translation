  text: those that remained were planning among themselves to reign as well; and while they were planning this[a], behold, one of the resting heads,
translation:
  language: zh_hans
  text: 那些剩下来的也彼此盘算着要掌权。正当它们这样盘算时，看哪，那些正在安歇的头中有一个……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superauerunt
  choice: 那些剩下的
  rationale: 依上下文作实体化表达，指先前异象中余下的对象；不擅自在本节补明其具体名称。
- source_word: apud semetipsas cogitabant
  choice: 彼此盘算着
  rationale: 表达这些对象在自己中间谋划的意思；“盘算”符合争相掌权的语境。
- source_word: et ipsae regnare
  choice: 也要掌权
  rationale: 保留 et ipsae 的“它们也”之意；regnare 在此指行使统治权。
- source_word: in eo cum cogitarent
  choice: 正当它们这样盘算时
  rationale: 将 in eo 理解为回指前述掌权的谋划，同时自然呈现拉丁语的时间从句。
- source_word: ecce
  choice: 看哪
  rationale: 保留异象叙事中提示突发景象的庄重语气。
- source_word: unum de quiescentium capitum
  choice: 那几个静伏的头中有一个
  rationale: quiescentium 表示处于静止、安歇状态；“静伏”兼顾异象画面与现代汉语表达，并保留句子跨至下一节才完成的结构。
