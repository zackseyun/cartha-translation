  yaml_path: translation/extra_canonical/2_esdras/011/017.yaml
  text: 'I announce this to you before you begin to disappear: after you, no one will hold it for as long, not even half as long.”'
translation:
  language: zh_hans
  text: “我在你开始消失以前，把这事宣告给你：在你以后，没有谁能像你一样维持这么久，甚至连一半那么久也不能。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hoc annuntio
  choice: 我要……把这事告诉你
  rationale: annuntio 表示郑重宣告或告知；此处用自然而庄重的现代汉语表达，hoc 译为“这事”。
- source_word: antequam incipias
  choice: 在你开始……以前
  rationale: 保留 antequam 引导的时间关系，以及 incipias 所表达的“开始”。
- source_word: non parere
  choice: 消失
  rationale: pareo 可指“显现、出现”，non parere 在此语境中表示不再出现，即“消失”；避免译成带有顺服含义的“不服从”，那属于另一同形动词的语义。
- source_word: Nemo post te
  choice: 在你以后，没有谁
  rationale: 按拉丁语直接保留时间或继承次序上的“在你以后”，不擅自明确为某一具体人物或王朝。
- source_word: hold it for as long
  choice: 维持得像你这么久
  rationale: 所给拉丁文在 Nemo post te 后截断，完整时长比较由经审校的英文咨询层提供；“维持”自然表达持续占有地位或权势，同时不擅自补出“统治”等更具体对象。
- source_word: not even half as long
  choice: 甚至连你的一半也达不到
  rationale: 以现代汉语自然表达持续时间不足一半的比较关系，避免生硬的“连一半长也没有”。
theological_decisions:
- issue: “维持”的具体对象
  choice: 不明说是统治、权位或国度
  alternative: 译作“没有谁能统治得像你这么久”
  rationale: 现有拉丁文片段没有给出具体宾语；采用较开放的表达，以保存语境中的含混性，不引入额外的历史或神学解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。冒号连接预告内容与其具体陈述；整体保留直接 خطاب 的预言语气，同时避免古奥或宗派化措辞。
