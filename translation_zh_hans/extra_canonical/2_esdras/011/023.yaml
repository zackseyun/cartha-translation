  text: the twelve wings and the two little pinions disappeared. And nothing remained on the eagle’s body except the three resting heads and six little pinions.
translation:
  language: zh_hans
  text: 十二只翅膀和两片小翼都不见了[a]。鹰身上只剩下安歇着的三个头和六片小翼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不见了”：拉丁文本作 conparuerunt，按通常词义可译为“出现了”；但下文说鹰身上“只剩下”三个头和六片小翼，语境表明这里所述的是十二只翅膀和两片小翼消失。
    reason: 保留原文动词通常词义与本句语境之间的张力，同时说明正文依上下文所作的译法。
lexical_decisions:
- source_word: conparuerunt
  choice: 不见了
  rationale: 该动词按通常拉丁语义可指“出现”，但这与下句“只剩下”以及本段所述鹰身各部分相继消失的语境冲突。正文依上下文译为“不见了”，并以脚注保留原文措辞上的疑点。
- source_word: pennae
  choice: 翅膀
  rationale: 指鹰的十二只主要翅膀；用现代汉语常用且清楚的“翅膀”。
- source_word: pennacula
  choice: 小翼
  rationale: 这是 penna 的指小形式，并与主要的 pennae 构成对照；译作“小翼”可简洁保留大小之别。
- source_word: quiescentia
  choice: 静止不动的
  rationale: 修饰三个头，表示它们处于静止、未行动的状态；避免译成可能含睡眠意味的“安睡”。
- source_word: superauit
  choice: 剩下
  rationale: 此处按晚期拉丁语及句境表示“存留、剩余”，自然译作“剩下”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“十二只翅膀”按汉语习惯使用量词“只”，“小翼”则用“片”以体现其较小、附属的形态。
