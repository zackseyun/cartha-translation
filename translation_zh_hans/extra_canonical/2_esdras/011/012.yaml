  yaml_path: translation/extra_canonical/2_esdras/011/012.yaml
  text: And I looked, and behold, on the right side one wing rose up and reigned over all the earth.
translation:
  language: zh_hans
  text: 我观看，看哪，右边有一只翅膀兴起，统治全地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi
  choice: 我观看
  rationale: 保留异象叙述中第一人称的视觉动作，并采用庄重自然的现代汉语。
- source_word: ecce
  choice: 看哪
  rationale: 保留原文提示读者注意异象中新情况的突显语气。
- source_word: a dextera parte
  choice: 右边
  rationale: 直接表达空间方位；原文未明确说明是谁或何物的右边，因此不作补足。
- source_word: una penna
  choice: 一只翅膀
  rationale: penna 在本段鹰的异象语境中指翅膀；量词“一只”符合现代汉语通常搭配。
- source_word: surrexit
  choice: 兴起
  rationale: 兼顾从所在位置升起及开始掌权的语义，并与随后“统治”自然衔接。
- source_word: regnauit
  choice: 统治
  rationale: 准确传达 regnare 在此处施行王权、掌权的含义。
- source_word: super omnem terram
  choice: 全地
  rationale: 保留 terra 可指大地或天下的宽广表达，不擅自限定为某一地区。
theological_decisions:
- issue: “翅膀”兴起并统治的拟人化异象语言
  choice: 按原文直译为“一只翅膀兴起，统治全地”
  alternative: 解释性译作“翅膀所代表的王兴起，统治天下”
  rationale: 原文让翅膀直接成为动作主体；不在正文中提前解开象征，以保留异象的文学形式与解释张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体；保留“看哪”的经文提示语和异象本身的凝练、象征性表达。
