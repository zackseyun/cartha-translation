  yaml_path: translation/extra_canonical/2_esdras/011/032.yaml
  text: And this head held sway over the whole earth and ruled those who inhabited it with much oppression, and it held dominion over the inhabited world more than all the wings that had been before it. And I saw after these things, and behold,
translation:
  language: zh_hans
  text: 这个头掌控了全地，使地上的居民受尽劳苦；它辖制天下，胜过先前所有的翅膀。此后我观看，看哪，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: caput
  choice: 这头
  rationale: 按异象中鹰的身体意象直译为“头”，并用“这”承接上下文所指。
- source_word: percontinuit
  choice: 掌控了
  rationale: 该词在此表达全面控制、牢牢支配；“掌控”自然传达其统治范围及力度。
- source_word: omnem terram / orbis terrarum
  choice: 全地 / 天下
  rationale: 以不同汉语表达保留原文两个近义地理措辞，同时避免生硬重复。
- source_word: cum labore multo
  choice: 以极大的压迫
  rationale: 拉丁语字面可指“许多劳苦/艰难”；在受统治居民的语境中，表达其使人承受沉重苦难的压迫性统治，但不进一步具体化其方式。
- source_word: potentatum tenuit
  choice: 辖制
  rationale: 表达“掌握权势、拥有统治权”，用“辖制”保留强势支配的意味。
- source_word: super omnes alas quae fuerunt
  choice: 胜过先前所有的翅膀
  rationale: super在比较语境中译为“胜过”；quae fuerunt结合异象的时间次序译作“先前……的”。
- source_word: Et uidi post haec et ecce
  choice: 此后我观看，看哪，
  rationale: 保留异象叙事的公式化转折与未完句式；“看哪”维持原文ecce的提示和强调作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；保留异象中的“头”和“翅膀”意象，不作解释性替换。末尾逗号有意保留，因为原文以“看哪”引出下一节内容。
