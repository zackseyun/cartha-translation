revisions:
- from: 必持续到你的时期，却连那时期的一半也不到。随后，第三只振翅而起，像先前那些一样掌了权；它消失了，接着——
  to: 必占据你的时期，却连其中的一半也不到。随后，第三只升起，像先前那些一样执掌权柄；它不再显现，接着——
  rationale: 修订只处理可安全确定的语义和中文表达：以“升起”对应 leuauit se，避免“振翅”的增译；以“不再显现”贴近 non apparuit；调整开头及“执掌权柄”使中文更自然且维持原文的统治语义。未采纳英文审校轨迹中的脚注，因为该脚注明确属于先前误排的英文版本，并不对应本节所给拉丁文。
