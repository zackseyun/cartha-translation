  text: will hold your time[a], but not even half of it. Then the third rose up and held the rule as the former ones had, and it disappeared, and
translation:
  language: zh_hans
  text: 必占据你的时期，却连其中的一半也不到。随后，第三只升起，像先前那些一样执掌权柄；它不再显现，接着——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tenebit tempus tuum
  choice: 必持续到你的时期
  rationale: tenebit 在此承接上下文，表达某事延续、占有一段时期；tempus tuum 直指“你的时期”。中文补出“持续到”，既保留人称指向，也避免生硬的“持有你的时间”。
- source_word: sed nec dimidium eius
  choice: 却连那时期的一半也不到
  rationale: sed 表转折，nec dimidium 强调“甚至不到一半”；eius 回指 tempus，译出“那时期”以明确所指。
- source_word: leuauit se tertia
  choice: 第三只振翅而起
  rationale: 字面为“第三个把自己举起”。本段异象语境中的主体是翅膀，中文用量词“只”，并以“振翅而起”自然传达动作，同时不把主体另行解释为统治者。
- source_word: tenuit principatum
  choice: 掌了权
  rationale: principatus 指统治权、首领地位；“掌了权”简洁自然，并保留开始执政的意味。
- source_word: sicut et priores
  choice: 像先前那些一样
  rationale: 保留 priores 的复数和比较关系，不擅自限定其具体身份。
- source_word: non apparuit
  choice: 它消失了
  rationale: 字面为“不再显现”；在叙事中“消失了”是自然、准确的中文表达。
theological_decisions:
- issue: “第三只”的具体所指
  choice: 只按异象语境译作“第三只”，不作历史或神学身份判定
  alternative: 译作“第三位统治者”或指明某一历史人物
  rationale: 拉丁文仅有阴性序数 tertia，其所指须由上下文补足；翻译不应导入特定历史解释。
- issue: 经节末尾未完句
  choice: 以“接着——”保留 et 的承接和原文断句的不完整性
  alternative: 删去末尾 et，或从下一节补足句子
  rationale: 给定拉丁文本以 et 结尾，必须保留其跨节延续的特征，不把下一节内容提前并入。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。经文从上一节中途接续，因此开头保留不完整句式；末尾同样明确表现向下一节延续。未设置脚注，因为现有英文脚注内容实际是先前误排版本，并非本节拉丁文本中的真实异文。
