  text: qui te non nocuerunt. Et ascendit contumelia tua ad altissimum et superbia tua ad fortem. Et respexit altissimus super sua tempora, et ecce finita sunt, et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/043.yaml
  text: who did not harm you. And your insolence has gone up to the Most High, and your pride to the Mighty One. And the Most High has looked upon his times, and behold, they are ended, and his ages are completed.
translation:
  language: zh_hans
  text: 那些没有伤害你的人。你的狂妄已经上达至高者，你的骄傲也达到大能者。至高者察看了自己的时期；看哪，那些时期已经终结，他的时代也已经完结了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的时代”：拉丁文为 eius（“他的”）。它可按最近的语法先行词理解为至高者；但结合上下文，也可能指受审判者（鹰或其所象征的权势）的时代。前文“自己的时期”所用的拉丁文 sua 则反指本句主语“至高者”。
    reason: 保留 eius 在语境中的可能指代，同时不把反身代词 sua 误作同等歧义的普通“他的”。
lexical_decisions:
- source_word: qui te non nocuerunt
  choice: 那些并没有伤害你的人
  rationale: 保留关系从句承接上文的片段性质；nocuerunt 直译为“伤害”，不补出原文未明说的行为。
- source_word: contumelia
  choice: 狂妄
  rationale: 此处与 superbia 平行，指向对至高者的傲慢冒犯；“狂妄”既自然，又保留其僭越意味。
- source_word: altissimum
  choice: 至高者
  rationale: 采用尊称式名词，准确体现对上帝的称谓。
- source_word: fortem
  choice: 大能者
  rationale: 保留与“至高者”平行的神圣称号，并体现 fortis 的力量含义。
- source_word: tempora
  choice: 所定的时期
  rationale: tempora 为复数，可指划定的时限或时期；补入“所定的”使汉语自然，并契合察看期限是否届满的语境。
- source_word: saecula
  choice: 世代
  rationale: 保留该词可表示时代、世代或长时期的时间意义，避免径直解释为“世界”。
- source_word: conpleta sunt
  choice: 已经满了
  rationale: 表达期限或时代达到规定的完整程度，保留与“结束”之间的细微差别。
theological_decisions:
- issue: “他的时期／世代”中 eius 的指代
  choice: 在正文中保留“他”的形式，并以“他所定的时期”表达
  alternative: 译作“你的时期／世代”，明确指向鹰或帝国
  rationale: 拉丁文 eius 在语法上可回指至高者，也可能按语境指受审判者；不应无注释地消除这一指代张力。
- issue: 时代终结的含义
  choice: 译为“这些时期已经结束，他的世代也已经满了”
  alternative: 解释为整个世界历史已经终结
  rationale: 原文仅陈述 tempora 与 saecula 的完结，并未明确等同于宇宙终末，故不作扩张性神学解释。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。开头故意保留承接上文的不完整句式；称号使用“至高者”“大能者”。时间术语避免过度解释，同时用脚注保存代词指向的歧义。
