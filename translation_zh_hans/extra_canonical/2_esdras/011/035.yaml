  yaml_path: translation/extra_canonical/2_esdras/011/035.yaml
  text: The head on the right side devoured the one on the left. And I heard a voice saying to me, “Look before you, and—”
translation:
  language: zh_hans
  text: 右边的头吞吃了左边的那个头。我听见有声音对我说：“看你面前，并且——”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在此处中断，止于一个未写完的词（con-）；本句余文无法确定。
    reason: 说明正文破折号源于底本残缺，而非修辞性停顿。
lexical_decisions:
- source_word: deuorauit
  choice: 吞吃了
  rationale: 准确传达“吞噬、吃掉”的强烈动作，也符合异象叙事的语体。
- source_word: caput a dextera parte
  choice: 右边的头
  rationale: 按拉丁文空间关系直译，清楚指出实施动作的是右侧的头。
- source_word: illud quod est a laeua
  choice: 左边的那个头
  rationale: 原文直译为“左边的那个”；根据同句的明确先行语“头”补出“头”，使现代汉语自然清楚。
- source_word: conspice contra te
  choice: 看你面前
  rationale: conspice 是命令式“看、察看”；contra te 在此表示朝向说话对象前方，译作“你面前”而不额外解释其所见内容。
theological_decisions:
- issue: 残句是否补全
  choice: 保留中断，以破折号表示
  alternative: 根据后续经文或推测补足句意
  rationale: 现存所给拉丁文本止于“con-”，无法确定未完词句；保留中断可避免把推测写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“吞吃”保留异象场景的力度；引语保持简洁。正文不补入底本没有的“我观看”或“看哪”等内容。
