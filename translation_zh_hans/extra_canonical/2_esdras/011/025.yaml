lexical_decisions:
- source_word: quattuor
  choice: 四只
  rationale: 所指为异象中的翼，汉语以“只”作量词较自然；拉丁文此处省略了所指名词，译文保留上下文依赖。
- source_word: manserunt in loco suo
  choice: 仍留在原处
  rationale: 准确表达持续停留于各自位置的含义，同时符合现代汉语习惯。
- source_word: Et uidi et ecce
  choice: 我观看，看哪
  rationale: 保留异象叙述中“观看—看哪”的强调结构与庄重语气。
- source_word: subalares
  choice: 翼下的小翅膀
  rationale: 该词指位于大翼之下的次级翼；用描述性译法传达空间关系，并避免生硬术语。
