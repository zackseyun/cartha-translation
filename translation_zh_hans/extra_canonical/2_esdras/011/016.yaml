  text: 有声音传到它那里，说：“你这一直以来掌控大地的，听吧，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emissa est illi
  choice: 有声音传给它
  rationale: 拉丁文是阴性单数被动式，主语承接上文，可理解为“声音”；汉语补出“声音”，避免无主语的生硬表达，同时保留“传给它”的方向。
- source_word: Audi tu
  choice: 你……听着
  rationale: 保留直接、带命令语气的呼告；把“你”与后面的定语结构自然结合。
- source_word: toto tempore
  choice: 一直
  rationale: 表达“整个这段时间／一直以来”，不误译为强调时长的“如此长久”。
- source_word: tenuisti terram
  choice: 掌控大地
  rationale: tenere 在此并非仅指物理上的“抓住”，而是持续占有、控制；“掌控”保留其统治意味，又不过度具体化为某种政权。
theological_decisions:
- issue: 受话者 illi 的性别及指代
  choice: 它
  alternative: 他
  rationale: 上下文受话者是异象中的鹰，现代汉语通常以“它”指动物；拉丁语 illi 本身在此格形式上不标明自然性别。
- issue: 省略主语的补出
  choice: 声音
  alternative: 话语／直译为“被传给它”
  rationale: emissa 为阴性，承接上下文中的 vox 最为自然；补出“声音”使本节可读，但不增添新的神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的异象叙事语体。“你这……的，听着”保留原文强烈的直接呼告；句末逗号表明话语尚未结束。
