source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi quomodo subiecti erant ei omnia sub caelo, et nemo illi contradicebat neque unus de creatura, quae est super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/006.yaml
  text: And I saw how everything under heaven was subjected to it[a], and no one contradicted it, not even one creature that is upon the earth.
translation:
  language: zh_hans
  text: 我看见，天底下的一切都臣服于它；没有谁反对它，甚至地上的受造物中也没有一个反对它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subiecti erant ei
  choice: 都臣服于它
  rationale: 准确表达被置于其权下、受其统治的状态；“臣服”也符合本段政治—异象语境。
- source_word: omnia sub caelo
  choice: 天底下的一切
  rationale: 保留拉丁文的普遍范围，并采用自然、庄重的现代汉语。
- source_word: nemo illi contradicebat
  choice: 没有谁反抗它
  rationale: contradicere字面可指反驳、反对，但在普遍臣服和统治的语境中，主要表示抗拒或反抗；“反抗”比单纯言语性的“反驳”更贴合上下文。
- source_word: neque unus de creatura, quae est super terram
  choice: 地上的受造物连一个也没有
  rationale: 保留强调性的“连一个也没有”，并将creatura译作涵盖一切被造存在的“受造物”。
theological_decisions:
- issue: 受造界对异象中统治者的全面臣服
  choice: 使用“臣服”和“反抗”描述统治关系
  alternative: 使用“顺服”和“反驳”
  rationale: 原文陈述的是异象中的普遍支配，并未评价这种权柄在神学上是否合法；所选措辞既呈现政治性力量关系，也不额外赋予道德认可。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“我又看见”承接异象叙述；末句保留原文加强语气的结构。
