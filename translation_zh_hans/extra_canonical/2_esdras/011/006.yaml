revisions:
- from: 我又看见，天底下的一切都臣服于它，没有谁反抗它，地上的受造物连一个也没有。
  to: 我看见，天底下的一切都臣服于它；没有谁反对它，甚至地上的受造物中也没有一个反对它。
  rationale: 修订明确末句所否定的行为，避免“没有受造物”的误读；并以“反对”保留 contradicebat 的宽泛含义，而不把它限定为单纯言语上的反驳或武力性的反抗。“我看见”直接对应 Et uidi。
