  text: And I looked[a], and behold, the eagle rose up on its claws and uttered a voice to its wings, saying,
translation:
  language: zh_hans
  text: 我观看，只见那只鹰用爪子站起身来，向自己的翅膀发声，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: surrexit aquila super ungues suos
  choice: 那只鹰用爪站起
  rationale: 保留鹰以爪支撑、挺身而起的异象画面；“用爪站起”比逐字译作“在自己的爪上起来”更符合现代汉语。
- source_word: misit uocem pennis suis
  choice: 向自己的翅膀发声
  rationale: misit vocem 是“发声、出声”的惯用表达，而 pennis suis 表明声音所指向的对象是鹰自己的翅膀；译文既保留原文略显奇异的拟人化表达，也不把它弱化为普通的“对……说”。
- source_word: dicens
  choice: 说
  rationale: 作为引出随后直接引语的分词，简洁译作“说”。
