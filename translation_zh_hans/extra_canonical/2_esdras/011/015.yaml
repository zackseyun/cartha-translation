  text: its end was coming[a], so that it did not appear like the former. And behold, a voice
translation:
  language: zh_hans
  text: 它的结局正在临近[a]，以致它看起来不再像先前那一只。看哪，有一个声音——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的结局正在临近，以致它像先前那一只一样不再显现。”
    reason: 保留审校记录所反映的另一种句法理解：否定的“不再显现”可与“像先前那一只一样”相连，而正文采用较直接、自然的“看起来不再像先前那一只”。
lexical_decisions:
- source_word: ueniebat finis eius
  choice: 它的结局临近了
  rationale: 直译为“它的终结正在来到”不合现代汉语习惯；“结局临近了”保留未完成时所表达的渐进过程，也不把所指擅自具体化为死亡或毁灭。
- source_word: ut non appareret sicut prior
  choice: 使它不再像先前那一只那样显现
  rationale: 保留目的或结果连词 ut 的张力，并按 appareret 的基本义译作“显现”，不改译为较强的“消失”。“先前那一只”使比较对象在汉语中清楚，但不额外判定其具体身份。
- source_word: Et ecce uox
  choice: 看哪，有一个声音——
  rationale: “看哪”保留 ecce 的叙事提示和庄重语气；原文在“声音”处跨入下一节，破折号表示句意未完，而不补入下一节内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“看哪”的经文风格，并用破折号忠实呈现本节在“一个声音”处中断、下文续接的结构。
