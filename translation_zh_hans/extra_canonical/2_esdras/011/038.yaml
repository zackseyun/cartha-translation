  text: Are you not the one who prevailed over the four beasts that I had made[a]
translation:
  language: zh_hans
  text: 你不就是我所造的四兽中胜出的那一位吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nonne tu es
  choice: 你不就是……吗
  rationale: 保留拉丁文期待肯定回答的反问语气，并使现代汉语自然。
- source_word: superasti
  choice: 胜过了
  rationale: 该动词可指战胜、压倒或超越；结合以兽为对象的语境，译作“胜过了”既贴近原文，也避免将含义限缩为仅仅“存活下来”。
- source_word: de quattuor animalibus
  choice: 四个兽
  rationale: animalibus在异象语境中指四兽；拉丁介词de与superasti连用略显特殊，依现有文本理解为胜过这四兽，不另行补入原文没有的解释。
- source_word: quae feceram
  choice: 我所造的
  rationale: 保留第一人称主语及愈过去时所表达的先行创造动作；汉语无需显式标出相对时态。
theological_decisions:
- issue: 说话者所称“我所造的”是否应明译为至高者创造
  choice: 保留第一人称“我所造的”
  alternative: 译为“至高者所造的”
  rationale: 本节原文仅使用第一人称，不应在正文中把语境中的说话者身份替换为明确称号，以免增加原文未明说的内容。
- issue: superasti表达战胜还是幸存
  choice: 译作“胜过了”
  alternative: 译作“从……中存留下来”
  rationale: superare的核心义包括胜过、克服；“幸存”虽可能受特殊介词结构支持，却会弱化主动压倒或超越的语义。正文保留较宽的“胜过”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文反问句式、四兽意象与第一人称创造表述，不沿用旧译中属于上一节的错位内容。
