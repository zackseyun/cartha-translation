  yaml_path: translation/extra_canonical/2_esdras/011/002.yaml
  text: And I looked[a], and behold, it spread its wings over all the earth, and all the winds of heaven were blowing upon it[b], and the clouds were gathering to it.
translation:
  language: zh_hans
  text: 我观看，看哪，它向全地展开翅膀；天上的风都向它吹来[a]，云彩也向它聚拢[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在它周围吹动”。
    reason: previous_rendering
  - marker: b
    text: “云彩也向它聚拢”在整理后的本斯利拉丁文本中存在，但以方括号标出，文本归属并不确定。
    reason: textual_variant
lexical_decisions:
- source_word: expandebat alas suas in omnem terram
  choice: 它向全地展开翅膀
  rationale: 保留“展开翅膀”这一具体意象，并以“向全地”表达翅膀伸展、覆盖所及的广度，避免过度解释为统治或遮盖。
- source_word: omnes uenti caeli insufflabant ad eam
  choice: 天上的风都向它吹来
  rationale: “ad eam”主要表示朝向它的方向；“向它吹来”既保留动态方向，也自然地表达 insufflabant 的吹动含义。
- source_word: nubes ad eam colligebantur
  choice: 云彩也向它聚拢
  rationale: “聚拢”对应 colligebantur，“向它”保留 ad eam 的方向性，不改成单纯的“在它周围”。
