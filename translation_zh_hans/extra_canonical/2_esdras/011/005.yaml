  yaml_path: translation/extra_canonical/2_esdras/011/005.yaml
  text: And I looked, and behold, the eagle flew on its wings to reign over the earth and over those who dwell in it.
translation:
  language: zh_hans
  text: 我观看，看哪，那鹰用自己的翅膀飞翔，为要统治大地和住在地上的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 我观看，看哪
  rationale: 保留异象叙述中“观看”与提示词“看哪”的重复和庄重语气。
- source_word: aquila
  choice: 那鹰
  rationale: 以“鹰”直译；加“那”使异象中已被聚焦的对象在现代汉语中自然明确。
- source_word: uolauit in pennis suis
  choice: 展开双翼飞翔
  rationale: 拉丁文直义为“用自己的翅膀飞翔”；汉语以“展开双翼飞翔”自然表达飞行方式，同时不增添方向或高度。
- source_word: ut regnaret
  choice: 要统治
  rationale: 保留 ut 加虚拟式所表达的目的指向，不把它弱化为单纯结果。
- source_word: super terram et super eos qui habitant in ea
  choice: 大地和住在地上的人
  rationale: 保留对地域及其居民的双重统治对象；“大地”适合异象文学的广阔语境。
theological_decisions:
- issue: 鹰飞翔与统治之间的关系
  choice: 译作“飞翔，要统治”，保留目的关系
  alternative: 译作“飞翔，并统治”或“飞翔，因而统治”
  rationale: 原文 ut regnaret 最自然地表达目的，不应将其改写为并列行动或确定结果。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体；以“我观看，看哪”保留原文突出的见证与惊异感。无脚注标记。
