  text: et respexit Altissimus super sua tempora, et ecce finita sunt et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/044.yaml
  text: And the Most High has looked upon his times, and behold, they have ended, and his ages are complete.
translation:
  language: zh_hans
  text: 至高者察看了他的时期；看哪，这些时期已经结束，他的世代也已满了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respexit
  choice: 察看了
  rationale: 既保留“转目察看、关注”的基本语义，也符合庄重而自然的现代汉语表达。
- source_word: super sua tempora
  choice: 他的时期
  rationale: 保留 sua 所指对象在上下文中的可能歧义，不擅自将其解释为至高者或鹰的时期；“时期”对应 tempora 的复数时间阶段含义。
- source_word: saecula eius
  choice: 他的世代
  rationale: saecula 可指世代、时代或漫长时期；此处用“世代”与 tempora 区分，同时保留 eius 的第三人称指向。
- source_word: conpleta sunt
  choice: 已满了
  rationale: 直承“达到完满、届满”的完成意义，并保留与“已经结束”的平行而不完全同义的表达。
theological_decisions:
- issue: sua 与 eius 的所指
  choice: 均译作“他的”，不明确指定所指对象
  alternative: 译作“它的”或明确译为“那鹰的”
  rationale: 拉丁文代词本身依赖上下文判断；本节不宜在译文中消除这种指代张力。
- issue: “时期结束”与“世代满了”的关系
  choice: 保留两个平行分句及不同措辞
  alternative: 合并为“他的时代已经终结”
  rationale: 原文 tempora 与 saecula、finita 与 conpleta 分别对应，合并会损失修辞结构和语义层次。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语；保留“看哪”以传达 ecce 的提示和强调作用。代词刻意不作上下文外的解释性展开。
