  text: cum ueritate ; Tribulasti enim mansuetos et laesisti quiescentes, odisti uerum dicentes et dilexisti mendaces, et destruxisti habitationes eorum qui fructificabant, et humiliasti muros eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/042.yaml
  text: For you afflicted the meek and injured the peaceable; you hated those who spoke truth and loved liars; you destroyed the dwellings of those who bore fruit, and humbled their walls.
translation:
  language: zh_hans
  text: 因为你苦害温和的人，伤害安静度日的人；你憎恨说真话的人，却喜爱说谎的人；你摧毁了那些结出果实之人的住处，并削低了他们的城墙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mansuetos
  choice: 温顺的人
  rationale: 保留 mansuetus 所表达的温和、谦顺之意；这里指受压迫的一类人。
- source_word: quiescentes
  choice: 安分的人
  rationale: 该词字面指安静、平静生活的人；“安分的人”在现代汉语中自然，并能表达不滋事、安居之意。
- source_word: uerum dicentes
  choice: 说真话的人
  rationale: 直接对应“说真实之事的人”，表达清楚而不增加特殊身份含义。
- source_word: mendaces
  choice: 说谎的人
  rationale: 以常用现代汉语指惯于或正在弄虚作假的人，符合与“说真话的人”的对照。
- source_word: fructificabant
  choice: 结出果实
  rationale: 保留“结果子”的具体比喻及其可能的多重含义，不擅自限定为农业丰产、善行或属灵成果。
- source_word: habitationes
  choice: 住处
  rationale: 可涵盖居所、聚居地等含义，避免将范围过度限定为单栋房屋。
- source_word: humiliasti muros eorum
  choice: 拆毁了他们的城墙
  rationale: humiliare 在城墙语境中表示使之降低、夷平；“拆毁”比逐字译作“使城墙降卑”更符合现代汉语，同时保留毁坏防御工事的实际意象。
theological_decisions:
- issue: “结出果实”所指为何
  choice: 保留比喻性的“结出果实”
  alternative: 译为“使土地丰产”或“行善”
  rationale: 拉丁文本没有明确限定果实是物质、道德还是属灵成果，应保留原文张力。
- issue: humiliasti 的形象表达
  choice: 按城墙语境译为“拆毁”
  alternative: 较形式化地译为“使他们的城墙降低”或“降卑了他们的城墙”
  rationale: 现代汉语不自然地把“降卑”用于城墙会妨碍理解；语境中的动作是使墙低下、倾覆，但不引入“他们未曾伤害你”等原文没有的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；分句保持拉丁原文的三组控诉及平行结构。“却”明确呈现憎恨诚实者与喜爱说谎者之间的反差。
