base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/001.yaml
  text: And it happened on the second night that I saw a dream, and behold, an eagle was coming up from the sea, and it had twelve feathered wings and three heads.
translation:
  language: zh_hans
  text: 第二夜，我做了一个梦。看哪，一只鹰从海中上来；它有十二只长着羽毛的翅膀和三个头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est secunda nocte
  choice: 第二夜
  rationale: 用自然简洁的汉语交代梦发生的时间；拉丁语惯用叙事引语“Et factum est”不机械译为“事情发生了”，以免生硬。
- source_word: uidi somnium
  choice: 我做了一个梦
  rationale: 按现代汉语习惯表达“看见一个梦”，同时保留第一人称经历。
- source_word: ecce
  choice: 看哪
  rationale: 保留异象叙述中引人注意、带有突现感的提示语。
- source_word: ascendebat de mari
  choice: 从海中上来
  rationale: 保留未完成过去时所呈现的动态景象，不额外解释海的象征意义。
- source_word: aquila
  choice: 一只鹰
  rationale: 直接对应拉丁语，采用现代汉语常用量词。
- source_word: duodecim alae pennarum
  choice: 十二只长着羽毛的翅膀
  rationale: 保留“羽毛”这一明确成分，也避免直译成不自然的“羽毛之翼”。
- source_word: capita tria
  choice: 三个头
  rationale: 直接保留异象形象及数量，不作释义。
theological_decisions:
- issue: 鹰、海、翅膀和头的象征意义
  choice: 正文仅呈现异象本身，不加解释
  alternative: 在正文中把这些形象解释为特定帝国、君王或权势
  rationale: 本节只报告梦中景象；源文本没有在此处给出解释，应保留其象征张力，避免引入后文解释或特定教派观点。
translation_notes:
  register: 采用现代、庄重而清楚的异象叙事语体。“看哪”保留经文的突现感；其余句式按自然现代汉语调整。
