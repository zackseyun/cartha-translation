  text: And I looked, and behold, one rose up, but immediately disappeared; then the second, and this one also
translation:
  language: zh_hans
  text: 我观看，看哪，其中一个兴起，却立刻消失了；接着是第二个，这一个也……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在“这一个也”之后中断，句子没有完结。
    reason: 提示读者此处的不完整来自底本文本残缺，而非译文遗漏；同时避免引入未经该拉丁见证支持的补文。
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 我观看，看哪
  rationale: 保留异象叙事中“观看—看哪”的提示结构；“看哪”以庄重而易懂的现代汉语传达 ecce 的引人注意作用。
- source_word: una erecta est
  choice: 其中一个兴起
  rationale: una 为阴性单数，所指对象须由上文确定；译作“其中一个”避免在本节擅自补明对象。“兴起”自然表达 erecta est 在争夺统治权语境中的动作，同时不额外规定是主动站起还是被立起。
- source_word: statim non conparuit
  choice: 却立刻消失了
  rationale: 直译意为“立刻不再显现”；“消失了”符合现代汉语表达，并保留其突然不见之意。
- source_word: Et secunda, et haec
  choice: 接着是第二个，这一个也……
  rationale: 原文残缺于 et haec（“而这一个也”）之后。译文保留未完成状态，不采用缺乏现存拉丁文本支持的补文。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我观看，看哪”保留启示文学的异象语气；末尾用省略号并加脚注，明确呈现原文断裂。
