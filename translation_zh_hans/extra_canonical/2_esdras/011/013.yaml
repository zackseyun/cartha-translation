source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum regnaret et uenit ei finis et non apparuit, ita ut non appareret locus eius; et sequens exsurrexit et regnauit et ipsa multum tenuit tempus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/013.yaml
  text: And it happened that when it reigned, its end came and it did not appear, so that its place did not appear; then the next rose up and reigned, and it held power for a long time.
translation:
  language: zh_hans
  text: 事情是这样的：它掌权的时候，结局临到它，它没有出现，以致连它所在之处也没有出现；随后，下一只兴起，掌权，并且掌权很久。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnaret / regnauit
  choice: 掌权
  rationale: 在异象中主语是鹰翼，以“掌权”表达其统治，不生硬地把动物称作“作王”。
- source_word: uenit ei finis
  choice: 结局临到了
  rationale: 贴近拉丁文“它的终局来到”，同时符合现代汉语表达。
- source_word: non apparuit ... non appareret locus eius
  choice: 它便不再出现，连它所在之处也不见了
  rationale: 保留原文两次 apparere 的呼应及“其所在之处”这一意象，不改写成解释性的“消失得无影无踪”。
- source_word: sequens exsurrexit
  choice: 接着，下一只兴起
  rationale: 上下文所指为下一只鹰翼，补出量词“只”使中文自然；“兴起”保留 exsurrexit 的政治—异象色彩。
- source_word: multum tenuit tempus
  choice: 掌权很久
  rationale: 该短语直指持续相当长的统治时间；用简洁自然的中文传达。
theological_decisions:
- issue: “不再出现”与“消失”的关系
  choice: 保留“不再出现／所在之处也不见了”的重复意象
  alternative: 译作“消失得无影无踪”
  rationale: 原文强调“不显现”而非明确陈述其消灭方式；保留措辞可避免过度解释异象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“它”承接异象中的鹰翼；“下一只”依据上下文补足汉语量词，但不额外解释其历史身份。
