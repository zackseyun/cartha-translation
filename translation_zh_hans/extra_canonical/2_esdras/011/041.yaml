  yaml_path: translation/extra_canonical/2_esdras/011/041.yaml
  text: And you judged the earth not with truth.
translation:
  language: zh_hans
  text: 你并没有按真理审判大地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicasti
  choice: 审判
  rationale: 采用司法语义明确且符合庄重经文语体的译法；拉丁文为第二人称单数完成时，故译作“你……审判”。
- source_word: terram
  choice: 大地
  rationale: 此处指受统治和审判的世界；译作“大地”既自然，也避免把含义过度限定为土地。
- source_word: non cum veritate（据完整句意）
  choice: 没有按真理
  rationale: cum在此表达方式或准则；“按真理”保留原文以真理为审判标准的含义，不扩展为更窄的“公正”。
theological_decisions:
- issue: 对受责者审判性质的指控
  choice: 保留“没有按真理审判”的直接责备
  alternative: 译为“审判不公”
  rationale: “不公”虽通顺，却将veritas的“真理／真实”语义收窄为公平或正义；正文保留原有神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的普通话；以“并没有”承接上下文中的责斥语气。所给拉丁文本在本节开头显然承接前句（“……以诡诈统治世界”），本稿仅翻译本节对应的完整分句。
