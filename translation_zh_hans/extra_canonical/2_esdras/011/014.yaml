- issue: cum regnaret 的句法开放性
  choice: 译作未完句“它执政的时候，”
  alternative: 补足为完整陈述
  rationale: 拉丁文止于从属结构并以 et 继续，当前节选本身未完成；不凭后文擅自补足。
