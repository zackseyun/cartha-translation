lexical_decisions:
- source_word: ipsa
  choice: 它
  rationale: 阴性单数代词承接上文所指的鹰翼；中文以“它”自然回指，不额外明确所指。
- source_word: multum...tempus
  choice: 很久
  rationale: 自然表达持续时间很长，避免生硬直译为“许多时间”。
- source_word: tenuit
  choice: 掌权
  rationale: 结合异象中的统治语境，表示维持权势或统治；不把含义收窄为单纯“存在”。
- source_word: Et factum est
  choice: 后来
  rationale: 以现代汉语自然表达叙事推进公式，同时保留事件随之发生的意味。
- source_word: cum regnaret
  choice: 它执政的时候
  rationale: 保留未完成时虚拟式所表达的统治期间背景，不预先补出尚未出现的主句事件。
theological_decisions:
