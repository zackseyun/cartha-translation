  text: 但有两个头仍存留着；它们也统治了大地和住在地上的人。我看见，看哪，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auerunt
  choice: 存留下来
  rationale: 据上下文及英译所反映的校勘理解，此处表达其余诸头之后仍有两个头留下；“存留下来”自然且保留残余之意。
- source_word: capita
  choice: 头
  rationale: 保留异象中鹰之“头”的具体意象，不作象征性释义。
- source_word: regnauerunt
  choice: 统治了
  rationale: 准确表达实行王权、掌权统治的含义。
- source_word: super terram et super eos qui inhabitant in ea
  choice: 大地和住在地上的人
  rationale: 以自然汉语表达双重管辖对象，同时保留“大地”与其居民的并列结构。
- source_word: Et uidi et ecce
  choice: 我观看，看哪，
  rationale: 保留异象叙述的固定引介语及句末未完结构；“看哪”传达 ecce 的提示和强调作用。
