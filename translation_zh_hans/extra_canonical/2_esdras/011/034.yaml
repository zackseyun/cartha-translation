  source_fidelity: “两个头”“也统治了大地和住在地上的人”准确对应拉丁文 capita、et ipsa regnauerunt 及 super terram et super eos qui inhabitant in ea；末尾保留“Et vidi et ecce”的承接性亦属必要。
  naturalness: “我观看”在现代汉语中通常指主动观看某一对象，作为 vidi（“我看见”）的译法略显不自然；改为“我看见”既忠实又符合异象叙事的惯用表达。“但有两个头仍存留着”也比“但还有两个头存留下来”更简洁，避免“还有”与“存留下来”的残余意义叠加。
  terminology: 保留“头”的异象意象，不作解释性转换；“统治”“大地”“住在地上的人”均适合庄重的现代经文语体。
