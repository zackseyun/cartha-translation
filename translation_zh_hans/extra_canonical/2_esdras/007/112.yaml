  text: 'Et respondit ad me et dixit: praesens saeculum non est finis, gloria in eo non frequens manet, propter hoc oraverunt qui potuerunt pro invalidis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/112.yaml
  text: And he answered me and said[a], “The present age is not the end; glory does not remain in it continually. Therefore those who were able prayed for the weak.
translation:
  language: zh_hans
  text: 他回答我说：“现今的世代并不是终局；荣耀在其中不能长存。[a] 因此，那些有能力的人为软弱的人祈祷。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荣耀在其中并非常存。”拉丁文也可能被理解为“荣耀在其中并不常见”。
    reason: frequens 可涉及持续、经常或常见；正文依上下文采用“不长存”，脚注保留词义上的真实歧义。
lexical_decisions:
- source_word: praesens saeculum
  choice: 现今的世代
  rationale: 既保留 saeculum 的时代、世代含义，也自然表达当前世界秩序，与末世语境相符。
- source_word: finis
  choice: 终局
  rationale: 这里不只是时间上的结束，也指最终阶段或终极状态；“终局”保留这种末世意味。
- source_word: gloria
  choice: 荣耀
  rationale: 采用直接且庄重的对应词，不预先限定荣耀的主体或具体性质。
- source_word: non frequens manet
  choice: 不能长存
  rationale: 结合 manet 的“存留”和 frequens 在此语境中“持续、常在”的含义，表达现世荣耀缺乏恒久性。
- source_word: qui potuerunt
  choice: 那些有能力的人
  rationale: 保留原文笼统的能力表述，不擅自解释为义人、强者或有功德者。
- source_word: invalidis
  choice: 软弱的人
  rationale: 自然表达缺乏力量、无能为力者，同时避免把含义缩窄为身体残疾。
theological_decisions:
- issue: 现世与终局的关系
  choice: “现今的世代并不是终局”
  alternative: “现今的世代并不是终点”
  rationale: “终局”更能体现末世性的最终秩序，又不进一步解释其具体神学构造。
- issue: 为软弱者祈祷的主体
  choice: 保留为“那些有能力的人”
  alternative: 解释为“义人”或“刚强的人”
  rationale: 原文只说 qui potuerunt，未明确说明这种能力是道德、属灵还是其他性质，因此保持开放。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“世代”“终局”“荣耀”维持经文语域；句法简洁，适合普通读者朗读和理解。
