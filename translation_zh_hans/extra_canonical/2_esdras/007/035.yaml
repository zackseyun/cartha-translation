  text: et opus subsequetur et merces ostendetur. et iustitiae vigilabunt et iniustitiae non dormibunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/035.yaml
  text: And the deed will follow, and the reward will be shown, and acts of righteousness will keep watch, and acts of unrighteousness will not sleep.
translation:
  language: zh_hans
  text: 行为必随之而来，报偿必显明；义行必守望，不义之行必不沉睡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus
  choice: 行为
  rationale: 此处指人在审判中随之而来的所作所为；译作“行为”比“工作”自然，也保留单数集合意义。
- source_word: subsequetur
  choice: 必随之而来
  rationale: 保留“跟随、随后来到”的动态意象，并以“必”表达将来陈述。
- source_word: merces
  choice: 报偿
  rationale: 该词可指工价、赏报或应得的回报；“报偿”不预先限定为奖赏或惩罚，保留上下文中的审判张力。
- source_word: ostendetur
  choice: 必显明
  rationale: 准确表达被动意义“将被显出”，中文以“显明”自然呈现。
- source_word: iustitiae
  choice: 义行
  rationale: 拉丁语复数可指正义之事或义的行为；结合与 opus 的关系，译作“义行”简洁且具体。
- source_word: vigilabunt
  choice: 必警醒
  rationale: 保留“醒着、守望”的拟人化意象，而不弱化为一般的“显现”。
- source_word: iniustitiae
  choice: 不义之行
  rationale: 与 iustitiae 构成平行对照，明确指不义的行为，同时避免译成抽象的“不义”。
- source_word: non dormibunt
  choice: 必不沉睡
  rationale: 直译睡眠意象，与“警醒”相呼应，并保留这些行为不会湮没或被遗忘的隐含力度，而不将隐意写入正文。
theological_decisions:
- issue: merces 所指是奖赏、惩罚，还是广义报应
  choice: 报偿
  alternative: 赏赐／报应
  rationale: 原词本身可指所应得的回报，当前句子并未将其仅限于善人的奖赏；采用中性词以保留审判语境中的开放性。
- issue: iustitiae 与 iniustitiae 是抽象性质还是具体行为
  choice: 义行／不义之行
  alternative: 正义／不义
  rationale: 复数形式及其与前文“行为”的并列更支持具体化理解；同时仍保留拟人化的“警醒／不沉睡”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号呈现两组并列关系；保留“警醒／沉睡”的拟人化对照，不另加解释性词语。
