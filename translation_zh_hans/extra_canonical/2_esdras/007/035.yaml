review_pass:
  verdict: revise
  source_fidelity: “行为必随之而来，报偿必显明”准确传达 opus subsequetur 与 merces ostendetur 的将来和被动／显现意味；“报偿”也恰当地不把 merces 预设为单指赏赐或刑罚。后半的 iustitiae／iniustitiae 采用具体的复数“义行／不义之行”可成立，并保留原文拟人化。不过 vigilabunt 的核心是“守望、守夜”，而不只是内在状态的“警醒”。
  naturalness: 整体庄重、简洁，符合现代标准汉语的经文语体。“义行必守望”虽保留拟人化，却比“义行必警醒”更直接对应原词的守望意象，并与“必不沉睡”形成更清楚的对照。
  terminology: “行为”对应 opus、“报偿”对应 merces、“义行／不义之行”对应 iustitiae／iniustitiae，均前后一致且不引入特定教派解释。
  issues:
