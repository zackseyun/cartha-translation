  yaml_path: translation/extra_canonical/2_esdras/007/127.yaml
  text: 'And he answered and said[a], “This is the thought of the struggle that the man born on the earth has fought:'
translation:
  language: zh_hans
  text: 他回答说：“这就是关于生在地上的人曾经争战过的那场争战的思量：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是生在地上的人必须进行的那场争战之思量。”拉丁文 certavit 为完成时，直译为“曾经争战过”。
    reason: 保留关系结构可能引出的情态性替代理解，同时明确现存拉丁文本完成时的直接译法。
lexical_decisions:
- source_word: cogitamentum
  choice: 意念
  rationale: 保留“思想、意念”这一基本义，不把它解释性地改成“意义”或“道理”。
- source_word: certaminis / certavit
  choice: 争战／曾经争战过
  rationale: 用同一词根的中文表达再现拉丁文的词语呼应，并以“曾经……过”反映 certavit 的完成时态。
- source_word: homo
  choice: 人
  rationale: 这里泛指生在地上的人类个体；中文“人”自然保留其普遍范围，也避免误指某一特定男子。
- source_word: super terram natus est
  choice: 生在地上的
  rationale: 贴近原文空间表达，同时符合现代汉语习惯。
theological_decisions:
- issue: 争战是已经发生，还是人必须进行
  choice: 正文按 certavit 译作“曾经争战过”
  alternative: “必须争战”
  rationale: 拉丁文 certavit 是完成时，直接表示已经争战；“必须”虽可能符合上下文的普遍性理解，却不是该动词形式明说的情态，故仅列入脚注。
- issue: homo 是否指特定人物
  choice: 译作泛指的“人”
  alternative: “那个人”
  rationale: 原文虽有关系结构，但 homo 在此适合按类指理解；不擅自解释为亚当、弥赛亚或其他特定人物。
translation_notes:
  register: 采用庄重而可懂的现代书面语。保留“意念”以贴近 cogitamentum，也保留 certaminis 与 certavit 的词根呼应；句末冒号承接后文。
