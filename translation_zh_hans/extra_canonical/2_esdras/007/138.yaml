source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et donator, quoniam si non donaverit de bonitate sua, ut adleventur hii qui iniquitates fecerunt de suis iniquitatibus, non poterit decies millesima pars hominum vivificari,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/138.yaml
  text: And he is generous[a], because if he did not give from his goodness, so that those who have committed iniquities might be relieved of their iniquities, not even a ten-thousandth part of mankind could be made alive,
translation:
  language: zh_hans
  text: 他也是慷慨的；因为他若不本着自己的良善施予，使那些行过不义之事的人从自己的罪孽中得以解脱[a]，人类中连万分之一也不能获得生命，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罪孽的重担得以减轻”或“从自己的罪孽中获释”。
    reason: 拉丁语 adleventur ... de 可侧重于罪孽负担得到减轻，也可侧重于从罪孽中被释放；正文保留后一意象，不预断其具体神学机制。
lexical_decisions:
- source_word: donator
  choice: 慷慨的
  rationale: 拉丁词本义为“施予者”；在此作一连串属性陈述的一项，译作“慷慨的”更符合现代汉语，同时保留其乐于施予的含义。
- source_word: de bonitate sua
  choice: 本着自己的良善
  rationale: 表达施予源于他的良善；比直译“从自己的良善中”更自然，且不添加原文没有的教义限定。
- source_word: adleventur ... de suis iniquitatibus
  choice: 从自己的罪孽中得以解脱
  rationale: adleventur 有“被减轻、卸下重担”的意思，de 可表示脱离；此译保留人从罪孽束缚或重担中被释放的意象。
- source_word: decies millesima pars hominum
  choice: 人类连万分之一
  rationale: decies millesima pars 表示“万分之一”；以“连……也”自然传达 non 所强调的极小比例。
- source_word: vivificari
  choice: 得着生命
  rationale: 该被动不定式意为“被赋予生命、得以活着”；“得着生命”既自然，也避免预先限定为肉身复活或属灵重生。
theological_decisions:
- issue: 罪孽被减轻或从罪孽中解脱
  choice: 从自己的罪孽中得以解脱
  alternative: 自己的罪孽得以减轻／罪孽的重担得以卸下
  rationale: 拉丁语 adleventur ... de 同时容许“脱离”和“减轻负担”的理解。正文采用自然的“得以解脱”，脚注保留另一种可能，避免把赦罪、洁净或刑罚减免中的某一种解释定死。
- issue: vivificari 所指的生命
  choice: 得着生命
  alternative: 得以存活／被复活
  rationale: 上下文可能带有末世得生的意味，但该词本身并未在本句明确限定生命的方式，因此采用较宽的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“作恶的人”对应字面上的“行了不义之事的人”。末尾保留逗号，因为原文此句在上下文中仍未完结。
