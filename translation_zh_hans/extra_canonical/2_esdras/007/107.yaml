  text: et Iesus qui post eum pro Israhel in diebus Achar, et Samuhel in diebus Saul,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/107.yaml
  text: and Joshua after him for Israel in the days of Achar[a], and Samuel in the days of Saul,
translation:
  language: zh_hans
  text: 在他之后，还有约书亚[a]在亚甲的日子为以色列代求，以及撒母耳在扫罗的日子为以色列代求，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文 Iesus 既是“约书亚”也可用于“耶稣”。在这里的旧约背景中，所指的是嫩的儿子约书亚。
    reason: lexical_alternative
lexical_decisions:
- source_word: Iesus
  choice: 约书亚
  rationale: 拉丁文 Iesus 可指约书亚或耶稣；此处处于旧约人物序列中，所指是嫩的儿子约书亚。
- source_word: Achar
  choice: 亚甲
  rationale: 按本节拉丁文本的人名形式音译，不擅自改成其他文本传统中的“亚干”。
- source_word: pro Israhel
  choice: 为以色列代求
  rationale: pro Israhel 本义为“为以色列”；根据本段列举代求者的句法语境，补出汉语所需的隐含谓语“代求”。
- source_word: post eum
  choice: 在他之后
  rationale: 保留原文与上一位人物衔接的顺序关系。
theological_decisions:
- issue: 原文省略的代求谓语
  choice: 补出“代求”
  alternative: 仅译作“为以色列”
  rationale: 拉丁文此处承接上下文省略谓语；补出“代求”使现代汉语完整，同时不改变本段关于为他人祈求的论述。
translation_notes:
  register: 采用庄重而自然的现代汉语；保留原句作为人物列举一部分的未完句式，并将重复的隐含谓语适度补明，以免“在扫罗的日子”悬置不清。
