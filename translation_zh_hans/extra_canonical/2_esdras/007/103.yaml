  text: iudicii iusti impios excusare poterint uel deprecari pro eis Altissimum, Si patres pro filiis, uel filii pro parentibus, si fratres pro fratribus, si adfines pro proximis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/103.yaml
  text: will they be able to excuse the ungodly at the righteous judgment[a], or to entreat the Most High for them, as fathers for children, or children for parents, brothers for brothers, relatives for neighbors,
translation:
  language: zh_hans
  text: 在公义的审判中，他们能为不敬虔者开脱，或替他们向至高者求情吗——如同父亲为儿女、儿女为父母、兄弟为兄弟、亲属为邻舍那样？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicii iusti
  choice: 公义的审判中
  rationale: 将属格结构按上下文自然译作审判场景；iustus 表明审判的公义性质。
- source_word: impios
  choice: 不敬虔的人
  rationale: 保留 impius 的宗教与伦理含义，避免仅译作一般性的“坏人”。
- source_word: excusare
  choice: 申辩
  rationale: 此处指为受审者提出辩解或开脱；“申辩”既贴近原义，又不预断申辩能否成功。
- source_word: deprecari pro eis Altissimum
  choice: 替他们向至高者求情
  rationale: deprecari pro 表示代人恳求；Altissimus 采用尊称“至高者”。
- source_word: adfines
  choice: 亲属
  rationale: adfinis 可指姻亲或关系相连者；此处用较宽泛自然的“亲属”，保留关系范围。
- source_word: proximis
  choice: 邻舍
  rationale: proximus 可指邻人或亲近者；在关系清单中译作“邻舍”，不额外添加原文没有的亲密程度。
theological_decisions:
- issue: 末后审判时能否代求
  choice: 保留问句形式，不明说答案
  alternative: 译成断言，直接说明无人能够代求
  rationale: 本节拉丁文本以疑问方式探讨为不敬虔者申辩、求情的可能性；译文不应提前消解其修辞张力。
- issue: iudicii iusti 的关系
  choice: 理解为“公义的审判”
  alternative: 理解为“义人的审判”
  rationale: iusti 在此最自然地修饰 iudicii，描述审判的性质；上下文也支持司法性的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为使后半关系清单在中文中语法完整，补出原文承前省略的“能……求情吗”，但不增加新的关系类别或神学结论。
