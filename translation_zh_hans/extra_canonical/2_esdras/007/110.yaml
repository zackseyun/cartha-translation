  text: and Hezekiah for the people in the days of Sennacherib, and many for many?
translation:
  language: zh_hans
  text: 难道希西家在西拿基立的时代没有为百姓祈求过，许多人没有为许多人祈求过吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pro
  choice: 为……祈求
  rationale: 本节处于列举义人为他人代求的语境中；单译“为了”在现代汉语中语意不足，因此将上下文隐含的祈求行为明确表达出来。
- source_word: in diebus Sennacherib
  choice: 在西拿基立的日子
  rationale: 保留原文的闪语式时间表达及庄重语体，意为西拿基立在世或掌权时期。
- source_word: multi pro multis
  choice: 许多人……为许多人祈求
  rationale: 保留 multi 与 multis 的重复和群体对群体的对应关系，不将后一个“许多人”具体化为某类对象。
theological_decisions:
- issue: 原文省略了 pro 所关联的具体行为
  choice: 依语境补出“祈求”
  alternative: 直译为“希西家为了百姓……许多人为了许多人”
  rationale: 拉丁文为承接前文而采用省略表达；现代汉语若不补出谓语便不完整。补出“祈求”呈现代求语境，但不进一步规定祷告的功效或性质。
- issue: 疑问句的修辞性质
  choice: 译作两个并列的反问分句
  alternative: 译作一个连续疑问句：“希西家为百姓……以及许多人为许多人吗？”
  rationale: 原文末尾问号涵盖整个并列结构，语境上是在援引公认事例。中文用“不是……吗？……不也……吗？”能自然保留其反问力度。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“西拿基立”沿用现代中文圣经常见的人名译法；保留“在……的日子”这一较正式的时代措辞。
