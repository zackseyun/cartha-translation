  text: 'patientur amodo qui neglexerint. Et respondi et dixi : ergo dabitur tempus animabus postquam separatae fuerint de corporibus, ut uideant de quo mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/100.yaml
  text: And I answered and said, “Then will time be given to the souls, after they have been separated from the bodies, to see that of which you told me?”
translation:
  language: zh_hans
  text: 我回答说：“那么，灵魂与身体分离以后，会有一段时间，让它们看见你向我提到的那件事吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文引文到“向我……”处中断；“提到的那件事”依据句法、上下文及古译本传承补足其含义。
    reason: 告知读者源文本在末句不完整，避免把补足的措辞误当作完整保存的拉丁文。
lexical_decisions:
- source_word: animabus
  choice: 灵魂
  rationale: 准确对应拉丁文复数名词，且符合本段讨论人死后灵魂状态的语境。
- source_word: separatae fuerint de corporibus
  choice: 与身体分离以后
  rationale: 保留完成时态所表达的先后关系；“与身体分离”比直译“从身体被分开”更符合现代汉语，同时不增添死亡方式等解释。
- source_word: dabitur tempus
  choice: 会有一段时间，让它们……吗
  rationale: 自然表达拉丁文“时间将被给予”的被动结构，并保留对死后是否有机会看见该事的询问。
- source_word: uideant
  choice: 看见
  rationale: 采用基本视觉义，不将其解释性地改为“明白”或“经历”。
- source_word: de quo mihi
  choice: 你向我提到的那件事
  rationale: 现存引文在此处语法未完；依据上下文及审校后的英语咨询层表达其所指，同时以脚注说明原文状况。
theological_decisions:
- issue: 死后灵魂是否获得时间观看某事
  choice: 保持问句，不预先断定答案
  alternative: 译成肯定陈述，暗示灵魂必然获得这种机会
  rationale: 拉丁文在叙事语境中是以斯拉提出的问题；译文应保留其未决状态，避免先行确定死后状态的教义含义。
- issue: 灵魂与身体的关系
  choice: 直译为“灵魂与身体分离”
  alternative: 释义为“人死后”或“灵魂脱离肉身”
  rationale: 直译保留原文的人论措辞，也避免“肉身”等词可能附带的贬义或特定神学色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我回答说”保留古代叙事公式；其余语序按现代汉语调整。问句结构和“那件事”的指代刻意保留原文的含混性。
