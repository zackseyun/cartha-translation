  source_fidelity: 译文准确保留拉丁文的叙事问句：animabus 对应“灵魂”，postquam separatae fuerint de corporibus 对应“与身体分离以后”，dabitur tempus 对应“会有一段时间，让它们……吗”，uideant 对应“看见”。末尾 de quo mihi 在所给拉丁引文中确实中断；正文以“你向我提到的那件事”作审慎补足，并以脚注明确说明，未将残缺文本伪作完整原文。
