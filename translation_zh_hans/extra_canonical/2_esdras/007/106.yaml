  text: And I answered and said[a], “How then do we now find that first Abraham prayed for the Sodomites, and Moses for the fathers who sinned in the wilderness,
translation:
  language: zh_hans
  text: 我回答说：“那么，我们如今怎会看到，先有亚伯拉罕为所多玛人祈求，又有摩西为那些在旷野犯罪的祖先祈求，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: rogavit
  choice: 祈求
  rationale: 此处指向上帝代求；“祈求”既符合语境，也保留拉丁词本身较宽泛的‘请求’意味。
- source_word: primus Abraham
  choice: 首先有亚伯拉罕
  rationale: primus为阳性主格，与Abraham呼应，表示亚伯拉罕是随后所列代求者中的第一位，而非表示他先为所多玛祈求、后来又为别事祈求。
- source_word: propter Sodomitas
  choice: 为所多玛人
  rationale: propter在此表达代求所关涉的对象；Sodomitas直指所多玛的居民。
- source_word: patribus
  choice: 祖先
  rationale: 此处指以色列人在旷野犯罪的先辈；现代汉语中“祖先”比“父辈”更自然，也不误解为亲生父亲。
- source_word: in deserto
  choice: 在旷野
  rationale: 采用圣经叙事中自然且通行的地理表达。
theological_decisions:
- issue: 死者是否可由他人代求
  choice: 按原文保留亚伯拉罕和摩西为他人祈求的论证陈述，不补充其功效或适用范围
  alternative: 将句子解释为对已死之人的代祷，或明确否定这种解释
  rationale: 本节本身仅援引历史上的代求事例，神学张力须由上下文展开，不宜在译文中预先裁定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我回答说”保留拉丁文的闪语式叙事公式；句末逗号保留原节未完句结构，使其自然衔接下一节。
