  text: of the glory of the Most High[a], by which all will begin to see what has been set before them[b]. A period
translation:
  language: zh_hans
  text: 至高者的荣光[a]，众人由此开始看见摆在他们面前的一切[b]。时段
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣光”也可译作“荣耀”或“光辉”。
    reason: lexical_alternative
  - marker: b
    text: “摆在他们面前的一切”也可译作“预先陈列的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: claritatis
  choice: 荣光
  rationale: 该词为 claritas 的属格，可指光辉、荣光或荣耀；“荣光”既保留光明意象，也适合此处庄重的启示文学语体。开头的属格关系承接上文，因此不擅自补出本片段未提供的中心词。
- source_word: Altissimi
  choice: 至高者
  rationale: 准确保留 Altissimus 作为神的尊称，不改写为特定神名。
- source_word: unde
  choice: 由此
  rationale: 保留其来源或凭借关系；拉丁文可理解为“从那里”或“借此”，本译不进一步限定。
- source_word: omnes incipiant uidere
  choice: 众人由此开始看见
  rationale: 保留 omnes 的全称意味和 incipiant 的起始体意义。
- source_word: quae anteposita sunt
  choice: 那摆在他们面前的一切
  rationale: anteponere 在这里表示置于面前；“一切”自然承接中性复数关系代词 quae，同时不具体化其所指。
- source_word: Spatium
  choice: 时段
  rationale: 该词可指空间、间隔或持续的一段时间；上下文涉及时间长度，故译“时段”。原文片段到此中断，因此不补入后续谓语。
theological_decisions:
- issue: claritas 的光明意象与神学上的“荣耀”含义
  choice: 荣光
  alternative: 荣耀；光辉
  rationale: “荣光”同时容纳可见的光辉和属于至高者的荣耀，不把原词压缩成纯抽象荣誉或纯物理亮光。
- issue: unde 所表达的关系
  choice: 由此
  alternative: 从那里；借着这荣光
  rationale: 拉丁文允许来源或凭借两种侧重；“由此”保留这种开放性，避免断定众人究竟从某处观看，还是借荣光而看见。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。经文是跨节切分后的拉丁文残句：开头为属格结构，末尾“时段”也在下一片段继续；译文保留这种未完句状态，不凭上下文擅补词句。
