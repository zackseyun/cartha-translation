base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/104.yaml
  text: 'And he answered me and said[a], “Because you have found favor before my eyes, I will show you this also: the day of judgment is a decisive day and will display to all the seal of truth. For just as a father does not send a son, or a son a father, or a master a servant, or a friend a beloved one[b], to speak on his behalf in the judgment'
translation:
  language: zh_hans
  text: 他回答我说[a]：“因为你在我眼前蒙了恩，我也要把这事指示你：审判之日是决定性的日子，必向众人显明真理的印记。正如父亲不会差遣儿子，儿子不会差遣父亲，主人不会差遣仆人，朋友不会差遣所爱的人，去在审判中替当事人申辩；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节这部分文字出自后来寻回的残篇，多数中世纪拉丁文抄本没有保存。以下例子以日常生活中不能由亲近者替代本人之事，类比最后的审判。
    reason: recovered_fragment
lexical_decisions:
- source_word: dies decretorius
  choice: 作出裁决的日子
  rationale: decretorius 表示具有决定、裁断性质；译成动词性短语，既保留司法语境，也符合现代汉语表达。
- source_word: signaculum ueritatis
  choice: 真理的印记
  rationale: 直译其印记、印证意象，不把它解释为某种特定教义概念。
- source_word: seruum
  choice: 仆人
  rationale: 此处列举家庭和社会关系，以“仆人”自然表达 servus，同时不弱化其从属身份。
- source_word: fidus carissimum
  choice: 忠实的人……自己至爱的人
  rationale: fidus 字面为“忠实的（人）”，carissimum 为“最亲爱、至爱的人”；避免无充分依据地把两者限定为普通朋友关系。
- source_word: ut pro
  choice: 在审判中替自己申辩
  rationale: 拉丁引文在 ut pro 之后中断；依本节连续语境补足其目的含义，同时用分号提示句意尚续至下文。
theological_decisions:
- issue: 终审中能否由亲近者代为申辩
  choice: 保留亲属、主仆和亲爱关系均不能转移个人审判责任的类比
  alternative: 将其概括为“无人能为别人代求”
  rationale: 原文通过具体关系说明不可替代性，并未在此处全面界定“代求”的神学范围；不宜扩大命题。
- issue: “真理的印记”的含义
  choice: 保留原有象征说法
  alternative: 解释为“真实判决的凭据”或特定末世印记
  rationale: 原文意象有一定开放性，直译可保存其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙了恩”“审判之日”“真理的印记”保留经文语体；关系清单采用平行句式。因所给拉丁文本首尾均为残句，本译文承接恢复段落，并以分号保留向下一节延续的句法状态。
