  text: nem, neque pluuiam, neque rorem, Neque meridiem, neque noctem, neque ante lucem, neque nitorem, neque claritatem, neque lucem, nisi solummodo splendorem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/042.yaml
  text: neither rain nor dew, neither noon nor night nor dawn, neither brightness nor splendor nor light, but only the radiance of the glory of the Most High, by which all will begin to see what has been set before them.
translation:
  language: zh_hans
  text: 既没有雨，也没有露；既没有正午，也没有黑夜或破晓前；既没有亮光、明亮或光明，只有光辉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pluuiam
  choice: 雨
  rationale: 直接表达拉丁文所指的雨水。
- source_word: rorem
  choice: 露
  rationale: 对应露水，与“雨”并列。
- source_word: meridiem
  choice: 正午
  rationale: 保留表示一天时段的具体含义。
- source_word: noctem
  choice: 黑夜
  rationale: 自然而庄重地对应“夜”。
- source_word: ante lucem
  choice: 黎明
  rationale: 该短语字面为“天亮以前”，在此与正午、黑夜并列，语境所指为黎明时分。
- source_word: nitorem
  choice: 亮光
  rationale: 以普通现代汉语表达可见的明亮，并与后续近义词保持区别。
- source_word: claritatem
  choice: 光辉
  rationale: 保留其明耀、辉煌的语义色彩。
- source_word: lucem
  choice: 光明
  rationale: 采用自然且较宽泛的用词，与“亮光”“光辉”形成三项并列。
- source_word: nisi solummodo splendorem
  choice: 只有荣光
  rationale: “nisi solummodo”表示排除前项后的唯一例外；“splendor”可指灿烂、辉耀或荣光，此处选“荣光”，但不补出拉丁文所无的所属对象。
theological_decisions:
- issue: 是否补入“至高者的荣耀”和“众人将由此看见摆在他们面前之物”
  choice: 不补入
  alternative: 依照英文咨询层译作“只有至高者荣耀的光辉，众人由此将开始看见摆在他们面前的一切”
  rationale: 所提供的拉丁文止于“nisi solummodo splendorem”，没有“至高者”、看见者或所见之物等对应词。按原文证据优先的原则，不从英文咨询层补入无拉丁文依据的内容。
- issue: splendorem 是否明确为神的荣耀
  choice: 保留为未明说所属对象的“荣光”
  alternative: 译作“至高者荣耀的光辉”
  rationale: 拉丁文只出现单独的 splendorem；补出神圣所属会消除现存文本的省略与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的排比句式，保留原文连续否定和末尾唯一例外的结构。所给拉丁文开头的“nem”显然是残缺词尾，未擅自重构或译出；译文从第一个完整成分“neque pluuiam”开始。
