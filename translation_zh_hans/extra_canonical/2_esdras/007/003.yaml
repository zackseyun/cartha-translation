  text: And I said, “Speak, my lord.” And he said to me, “The sea is set in a broad place, so that it might be deep and immense.
translation:
  language: zh_hans
  text: 我说：“请说吧，我主。”他对我说：“海被安置在一处宽广之地，为要深邃而浩瀚。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: loquere
  choice: 请说吧
  rationale: 用自然的现代汉语表达命令式，同时借“请”体现说话者对‘我主’的敬意。
- source_word: dominus meus
  choice: 我主
  rationale: 保留原文尊称及其可能指向天使或上位者的开放性，不擅自译成带特定身份判断的称谓。
- source_word: mare positum est
  choice: 海被安置
  rationale: 保留拉丁文被动结构及‘设置、安放’的意象。
- source_word: in spatioso loco
  choice: 在宽阔之处
  rationale: 贴近 spatiosus 的空间广阔含义，并与后文关于海的尺度相衔接。
- source_word: altum et inmensum
  choice: 深邃无边
  rationale: altum 在此依海的语境取‘深邃’，inmensum 译为‘无边’，自然凝练地保留其不可测度、广大无际之意。
theological_decisions:
- issue: dominus meus 所指对象的身份
  choice: 译作“我主”
  alternative: “我的主”或明确译作“主啊”
  rationale: 上下文在本节内未明说对象身份；采用“我主”保留尊称和指称上的含混，不将其固定为上帝或其他特定身份。
- issue: 海被安置的目的或结果关系
  choice: 译作“使它……”
  alternative: “以致它……”
  rationale: ut esset 可表达目的或结果；“使它”在中文中仍可涵盖两者，不额外判定其逻辑关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留直接引语、被动意象及原文在身份和目的/结果关系上的含混。
