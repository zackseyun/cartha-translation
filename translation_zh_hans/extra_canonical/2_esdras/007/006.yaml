  text: 'Again, another example: a city is built and set in a plain, and it is full of every good thing.'
translation:
  language: zh_hans
  text: 再举一个例子：有一座城建在平原上，城中满有一切美好之物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: item aliud
  choice: 再举一个例子
  rationale: 拉丁文直译近于“再者，另一个”，在上下文中用于引出另一则比喻或例证；这样表达自然，并保留其承接作用。
- source_word: civitas
  choice: 一座城
  rationale: 准确表达“城市、城邑”，并符合现代汉语叙述习惯。
- source_word: aedificata et posita
  choice: 建在
  rationale: 两词合指城被建造并坐落于某处；汉语用“建在”简洁自然，未额外引入建造者。
- source_word: in loco campestri
  choice: 平原上
  rationale: campestris 指开阔平坦之地；“平原上”准确且通俗。
- source_word: plena omnium bonorum
  choice: 满是各种美物
  rationale: bonorum 是中性复数，可泛指一切好的事物、福物或佳美之物；“各种美物”保留具体与概括之间的宽度，避免限定为道德上的“善”或财富。
theological_decisions:
- issue: omnium bonorum 的语义范围
  choice: 各种美物
  alternative: 一切美好之物／各种好东西
  rationale: 原文可涵盖一切可喜、可享的佳美事物，并无必要将其神学化为抽象的“善”；所选措辞庄重而易懂。
translation_notes:
  register: 采用现代、简洁而庄重的叙述语体。“再举一个例子”清楚呈现经文由前例转入另一例证的结构；句式流畅，适合普通读者。
