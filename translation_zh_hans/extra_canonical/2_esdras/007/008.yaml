source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: semita autem est una sola inter eos posita, hoc est ignis et aqua, ut non capiat semita nisi solummodo vestigium hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/008.yaml
  text: But there is only one path laid between them[a], that is, between the fire and the water, so that the path can hold only a man's footprint.
translation:
  language: zh_hans
  text: 但在两者之间只设有一条小径，也就是火和水之间；这条小径只能容下一个人的脚印。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: semita
  choice: 路
  rationale: 指狭窄的小径；结合后文仅容一个脚印的宽度，以“路”自然表达，并由上下文显明其狭窄。
- source_word: una sola
  choice: 只有一条
  rationale: 同时保留 una 与 sola 所强调的唯一性，符合现代汉语习惯。
- source_word: inter eos posita
  choice: 铺在两者之间
  rationale: 保留 posita 的设置、铺设之意；“两者”承接上下文，并由随后的解释语明确所指。
- source_word: hoc est ignis et aqua
  choice: 也就是在火与水之间
  rationale: hoc est 是解释语，说明“两者”即火与水；汉语补出“在……之间”可使句法清楚，同时不改变所指。
- source_word: ut non capiat semita nisi solummodo vestigium hominis
  choice: 这条路窄得只能容下一只人的脚印
  rationale: 直陈结果：道路所能容纳的宽度仅为人的一个脚印。“窄得”把拉丁语结果结构自然转成现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“一只人的脚印”保留单数尺度概念，强调道路极窄；不把比喻进一步解释为特定神学教义。
