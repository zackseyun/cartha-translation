  text: For how long has the Most High shown long-suffering to those who inhabit the age—not for their sake, but because of the times that he has foreseen! And I answered and said, “If I have found favor
translation:
  language: zh_hans
  text: 他们在末后的时期将怎样回答呢？至高者宽容那些居住在这世代中的人，已经多久了！这不是为了他们，而是为了他所预见的那些时期！于是我回答说：“我若蒙了恩……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: modo respondebunt
  choice: 将怎样回答呢
  rationale: modo 在此处所承接的确切语气因片段起首而不完全明确；结合将来时 respondebunt，译出质问性的“将怎样回答呢”，不强行补足上文。
- source_word: in nouissimis temporibus
  choice: 在末后的时期
  rationale: 保留复数 temporibus，并以庄重而易懂的末世性表达“末后的时期”呈现。
- source_word: longanimitatem habuit
  choice: 宽容……已经多久了
  rationale: longanimitas 指长期忍耐、宽容；结合 Quantum enim tempus，以持续时长的问句自然表达。
- source_word: Altissimus
  choice: 至高者
  rationale: 采用传统且透明的神圣称号，不额外补作“上帝”。
- source_word: his qui inhabitant saeculum
  choice: 那些住在这世代的人
  rationale: saeculum 可指时代、世界或世代；此处选择“世代”，同时保留“居住于其中”的原文意象。
- source_word: quae prouidit tempora
  choice: 他所预定的那些时期
  rationale: providere 可含预见、预先安排之意；语境中“为了那些时期”更自然地指向预先定下的时序，但不具体说明其内容。
- source_word: si inueni gratiam
  choice: 我若蒙了恩
  rationale: 采用自然、庄重的固定表达，并保留未完条件句。
theological_decisions:
- issue: 至高者宽容世人的原因
  choice: “这不是为了他们，而是为了他所预定的那些时期”
  alternative: “不是为了他们，而是因为他所预见的那些时期”
  rationale: 保留原文明确的否定对照，不将其解释为人的功德；prouidit 的“预见/预定”张力通过正文选择与说明保留。
- issue: saeculum 的宇宙论或时代论含义
  choice: “这世代”
  alternative: “这个世界”或“这时代”
  rationale: “世代”既可承载时间含义，也不完全排除人所居领域的意味，避免把经文过早限定为纯空间意义。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。开头保留其作为残片承接上文的突兀感；末句以省略号显示原始引文在条件句中截断。
