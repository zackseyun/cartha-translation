  text: 'The fourth way: they consider for themselves in the last times the torment laid up for them.'
translation:
  language: zh_hans
  text: 第四种途径：在末后的时候，他们会思量那为自己存留的苦刑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quarta uia
  choice: 第四条路
  rationale: 直译为“第四条路”，保留原文对死后经历之不同路径或阶段的列举表达，不擅自解释为某一特定教义类别。
- source_word: considerabunt sibi
  choice: 他们会……想到
  rationale: considerabunt 表示思量、察看或意识到；汉语用“想到”自然表达其内在省察意味。sibi 的关涉性由后文“为他们”一并体现，避免生硬重复“为自己想到”。
- source_word: in nouissimis
  choice: 在末后的时候
  rationale: 保留原文具有末世意味但也可能指最终阶段的时间表达，不具体限定为某一套末世论框架。
- source_word: tormentum laid up for them（由残行 repo- 及经校勘的连续文本支持）
  choice: 那为他们存留的苦刑
  rationale: “存留”对应预备、保留之意；“苦刑”传达 tormentum 的惩罚性痛苦，比单纯“痛苦”更贴近语义。
theological_decisions:
- issue: in nouissimis 的时间所指
  choice: 末后的时候
  alternative: 末日／临终之时
  rationale: 原文可指最终阶段或末后的时刻；采用较宽泛的表达，以保留其末世性及语境上的开放性。
- issue: 为他们存留之苦刑的性质
  choice: 苦刑
  alternative: 痛苦／折磨
  rationale: tormentum 可兼具受苦与惩罚意味；“苦刑”保留两者张力，同时不进一步界定施刑方式或持续时间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第四条路”维持原文列举结构；整句尽量贴近拉丁语次序，同时避免把 sibi 与“为他们”机械重复。
