base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/095.yaml
  text: 'The fourth order: they understand the rest in which[a], now gathered in their storehouses, they will rest in great silence, guarded by angels, and the glory that remains for them in the last times.'
translation:
  language: zh_hans
  text: 第四等：他们明白：他们如今被聚集在库房中，必在极深的寂静中安息，受天使守护；并且明白在末后的日子为他们存留的荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文本中“在末后的日子为他们存留的荣耀”这一短语的文句不确定；但义人如今在守护中安息、日后得荣耀的整体意思是明确的。
    reason: textual_variant
lexical_decisions:
- source_word: Quartus ordo
  choice: 第四等
  rationale: ordo 在上下文中指义人经历或状态的第四个等级；“第四等”简洁保留列举结构。
- source_word: requiem ... requiescent
  choice: 安息……必……安息
  rationale: 保留拉丁文名词与同源动词的重复，并以“必”体现 requiescent 的将来时。
- source_word: in promptuariis congregati
  choice: 被聚集在库房里
  rationale: promptuaria 字面指储藏之处；译作“库房”保留原文具体而略带奥秘的意象，不擅自解释为其他世界。
- source_word: cum silentio multo
  choice: 在极深的寂静中
  rationale: 自然表达 multo 的强度，同时保持庄重语域。
- source_word: ab angelis conseruati
  choice: 由天使守护
  rationale: 准确表达被动分词所指的保护状态。
- source_word: in nouissimis ... manentem gloriam
  choice: 在末后的日子为他们存留的荣耀
  rationale: “存留”贴近 manentem，“末后的日子”自然传达 in nouissimis 的末世时间含义，同时不增加具体教义解释。
theological_decisions:
- issue: 当前受守护的安息与末后荣耀之间的时间关系
  choice: 译文区分“如今”被聚集、将要安息，以及末后为他们存留的荣耀
  alternative: 将安息与荣耀合并为同一当前状态
  rationale: 原文同时包含 nunc、将来时 requiescent 和 in nouissimis；应保留其中的时间张力。
- issue: “库房”的所指
  choice: 保留意象，不解释其具体宇宙论位置
  alternative: 译作“阴间住处”“灵魂居所”或“天上仓房”
  rationale: promptuariis 的具体指涉并不完全明确；直译可避免输入特定宗派或解释传统。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“第四等”承接分级列举；分号帮助读者看清安息与末后荣耀两个相关层面。脚注标记置于相关不确定短语之后。
