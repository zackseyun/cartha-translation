  yaml_path: translation/extra_canonical/2_esdras/007/039.yaml
  text: This is such a day[a], which has neither sun nor moon nor stars,
translation:
  language: zh_hans
  text: 这一天是这样的[a]：既没有太阳，也没有月亮，也没有星辰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按原文语序译：“这就是这样的一天：没有太阳，没有月亮，也没有星辰。”
    reason: 原文 Hic talis 是承接“审判之日”的简略引介语；主译文采用自然汉语表达，脚注保留较贴近原文引介结构的译法。
lexical_decisions:
- source_word: Hic
  choice: 这
  rationale: 采用近指词“这”，保留拉丁文 hic 的近指、引介作用，不译作远指的“那”。
- source_word: talis
  choice: 这样的一天
  rationale: 结合上下文所指的“审判之日”补出“一天”，使现代汉语自然，同时保留 talis“如此、这样”的描述意味。
- source_word: neque solem neque lunam, neque stellas
  choice: 没有太阳，没有月亮，也没有星辰
  rationale: 以重复的“没有”再现 neque…neque…neque 的并列否定；“星辰”庄重而通俗。
theological_decisions:
- issue: 审判之日没有天体的表述应按字面陈述，还是解释为不需要天体照明
  choice: 按字面译为“没有太阳，没有月亮，也没有星辰”
  alternative: 译为“不需要太阳、月亮或星辰照明”
  rationale: 原文只说该日不具有这些天体，并未明说其原因或功能；不增添启示文学意象的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这就是这样的一天”保留原文较突出的引介结构；冒号使随后三项特征在汉语中清楚自然。
