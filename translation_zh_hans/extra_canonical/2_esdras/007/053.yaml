  text: you will sort them for yourself by their number[a], but lead and clay are abundant. And
translation:
  language: zh_hans
  text: 你要按它们的数目为自己把它们整理；但铅和陶器却很多。并且——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad numerum eorum
  choice: 按它们的数目
  rationale: 保留介词短语的字面关系，不擅自判定所指对象或把“数目”解释为类别、次序。
- source_word: compones eos tibi
  choice: 为自己把它们整理好
  rationale: compones 是第二人称单数将来时，可指整理、排列或归置；“整理好”在现代汉语中自然，同时保留动作方式的开放性。tibi 译作“为自己”。
- source_word: plumbum
  choice: 铅
  rationale: 直接对应拉丁语所指金属。
- source_word: fictile
  choice: 陶土
  rationale: 此处与 plumbum 并列，并由 abundat 作为物质性、集合性表达支配；译作“陶土”承接来源文本及审校后的英文咨询层，避免擅自具体化为某类陶器。
- source_word: abundat
  choice: 很多
  rationale: 表达“充裕、数量众多”，措辞简明自然。
- source_word: Et
  choice: 并且——
  rationale: 来源文本在连词 Et 处截断；用破折号明确显示句意延续而本节未完，避免删除或臆补下文。
theological_decisions:
- issue: 代词所指与按数目整理的具体含义
  choice: 保留“它们”及“按它们的数目”的模糊性
  alternative: 把所指对象具体化，或译为“分类／挑选／分别留下”
  rationale: 现有拉丁语片段没有提供足够信息来锁定所指对象或具体操作；不应以神学背景补足。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。分号体现前后分句的转折关系；末尾破折号忠实标示来源片段以连词结束。
