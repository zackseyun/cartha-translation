source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quomodo corruptibile effugerint nunc, et futurum quomodo hereditatem possidebuut, adhuc autem uidentes angustum et [labore] plenum, quoniam liberati sunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/096.yaml
  text: 'The fifth order: they rejoice that they have now escaped what is corruptible[a], and how they will inherit what is to come, while still seeing the narrow and toil-filled way, because they have been delivered.'
translation:
  language: zh_hans
  text: 第五类：他们欢喜他们如今如何逃脱了那必朽坏的，又将如何承受将来之事[a]；他们仍看见那狭窄、充满劳苦的道路，因为他们已经蒙了解救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如何……又将如何”也可译作“他们如今已经逃脱了那必朽坏的，又将承受将来之事”。
    reason: 拉丁文两处 quomodo 既可保留通常“如何”的意义，也可能按后期拉丁语用法引出间接陈述；两处译法应保持平行。
lexical_decisions:
- source_word: corruptibile
  choice: 那必朽坏的
  rationale: 保留拉丁文中形容词名词化的概括性，可指必朽坏的处境、领域或事物，不擅自限定为身体或世界。
- source_word: futurum
  choice: 未来的一切
  rationale: 原文为中性单数名词化用法，泛指将来之事或未来的福分；译作“未来的一切”既自然，也保留其宽泛性。
- source_word: hereditatem possidebunt
  choice: 承受
  rationale: 该词组表达取得并拥有产业；“承受”符合现代中文圣经语体，也保留继承产业的意象。
- source_word: angustum et labore plenum
  choice: 狭窄而充满劳苦的道路
  rationale: angustum在此名词化，结合上下文自然理解为狭窄的道路；补出“道路”使中文完整，并保留艰难行程的意象。
- source_word: liberati sunt
  choice: 已经蒙了解救
  rationale: 使用被动表达，不补出施救者或明确说明从何处获救，以保留原文的省略。
theological_decisions:
- issue: 两个quomodo是方式疑问还是后期拉丁语中引导间接陈述
  choice: 两处均按“怎样”处理，保持平行结构
  alternative: 两处均译作“已经……并将……”或“他们已经……、他们将……”
  rationale: 原文两次使用quomodo，形式上明显平行；译作“怎样”保留达成拯救与承受未来产业之方式的开放性，不把原文可能存在的语义张力静默化解。
- issue: liberati sunt所指的获救对象
  choice: 不明说是从狭窄劳苦的道路、必朽坏之境或其他对象中获救
  alternative: 译作“因为他们已从这条路上获救”
  rationale: 拉丁文没有与liberati sunt连用的明确补语，故不添加原文未明说的神学或空间关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第五等”承接本段依次列举的结构；分号划分欢喜的缘由与仍然看见艰难道路的情形。脚注标记[a]已置于相关平行分句之后。
