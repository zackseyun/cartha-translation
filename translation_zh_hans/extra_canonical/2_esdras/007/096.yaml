revisions:
- from: 第五等：他们欢喜自己如今怎样逃脱了那必朽坏的，又将怎样承受未来的一切[a]；他们仍看见那狭窄而充满劳苦的道路，因为他们已经蒙了解救。
  to: 第五类：他们欢喜他们如今如何逃脱了那必朽坏的，又将如何承受将来之事[a]；他们仍看见那狭窄、充满劳苦的道路，因为他们已经蒙了解救。
  rationale: 修订仅改善中文的自然度并避免将 futurum 扩展为“未来的一切”。保留两个 quomodo 的平行和其可能的歧义，保留“道路”作为 angustum 在上下文中的自然中文补足，并不指定“蒙了解救”的施救者或所脱离的对象。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:06:27Z'
