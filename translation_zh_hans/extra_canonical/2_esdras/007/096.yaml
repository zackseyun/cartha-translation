  source_fidelity: 译文总体保留了两个平行的 quomodo、corruptibile 的名词化概括性、futurum 的未明确范围，以及 liberati sunt 的施救者和对象未明说之处。然“自己如今怎样逃脱了”在中文中不自然，且“怎样”与完成动作的组合略显生硬；可改为“他们如今如何逃脱了……，又将如何承受……”，更准确地承载原文平行句式。
  naturalness: “第五等”可理解，但“第五类”更合现代中文的分类列举语感。“狭窄而充满劳苦的道路”可通，但用顿号并改为“充满劳苦”更顺畅。
  terminology: “必朽坏的”“承受”“蒙了解救”均合乎庄重的现代中文圣经语体，且没有过度限定原文。将 futurum 译为“将来之事”比“未来的一切”更贴近中性单数名词化表达，也避免无依据地加强为“一切”。
