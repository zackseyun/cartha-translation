  text: et convertetur saeculum in antiquum silentium diebus septem sicut in prioribus initiis, ita ut nemo derelinquatur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/030.yaml
  text: And the age will return to the ancient silence for seven days, as in the former beginnings, so that no one is left behind.
translation:
  language: zh_hans
  text: 这个时代将回归远古的寂静，持续七日，正如在最初的开端一样，以致不留下任何人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: 世代
  rationale: 此处指现存的时代或世界秩序；“世代”既保留时间层面的含义，也避免把原文过度具体化为物质世界。
- source_word: convertetur
  choice: 将回归
  rationale: 采用自然的现代汉语表达其转回、复归之意，不额外强调被动语态。
- source_word: antiquum silentium
  choice: 亘古的寂静
  rationale: “亘古”传达 antiquum 所指向的远古、原初意味，“寂静”直译 silentium，并保持庄重语体。
- source_word: in prioribus initiis
  choice: 起初的时候
  rationale: 保留复数 initiis 所体现的原初阶段之概括意义，同时使用普通读者易懂的表达。
- source_word: nemo derelinquatur
  choice: 无人留下
  rationale: 直译其无人被遗留、存留的含义；不擅自补明是“存活”还是“被落下”，以保留语境中的张力。
theological_decisions:
- issue: “无人留下”所指的具体状态
  choice: 保持概括，不解释为无人存活或无人被遗弃
  alternative: 以致无人存活／以致无人被落下
  rationale: 拉丁文 derelinquatur 可表达被留下或遗留；本节本身没有明确限定其神学或生存意义，故不替原文消除歧义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“亘古的寂静”保留末世异象的肃穆感；句法简洁，适合公开诵读。
