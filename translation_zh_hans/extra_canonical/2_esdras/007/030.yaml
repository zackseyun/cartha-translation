  rationale: 将 saeculum 译为“时代”，使其在末世语境中更准确且自然；以“持续七日”明确时间范围；将“亘古”调整为“远古”，并将结尾改为“不留下任何人”，以更直接反映 derelinquatur 的被动和原文未限定的含义。
