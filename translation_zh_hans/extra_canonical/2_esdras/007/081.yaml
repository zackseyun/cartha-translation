  text: enter[a], but from now on they will wander in torments, always grieving and sad.
translation:
  language: zh_hans
  text: 进入[a]；但从今以后，他们必在煎熬中漂泊，一直悲痛忧伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 句首的“进入”承接上一节末尾的“不”，连起来是“不能进入”。
    reason: 说明跨节句法，防止因分节位置而误读原文意思。
lexical_decisions:
- source_word: ingredientur
  choice: 进入
  rationale: 该词为第三人称复数将来时，意为“他们将进入”；本节句首承接上一节末尾的否定词，因此正文按本节所给拉丁语的分节保留为“进入”，并用脚注说明句法衔接。
- source_word: uagantes erunt
  choice: 必……漂泊
  rationale: 保留将来时及持续游荡、无所归依的意味；“漂泊”比单纯“行走”更贴近 uagantes。
- source_word: amodo
  choice: 从今以后
  rationale: 直接表达从此刻起持续下去的时间意义。
- source_word: in cruciamentis
  choice: 在种种煎熬中
  rationale: cruciamenta 可指折磨、苦刑或痛苦；“煎熬”既传达强烈痛苦，又不擅自限定其施加方式，复数意味以“种种”体现。
- source_word: dolentes semper et tristes
  choice: 永远悲痛忧伤
  rationale: dolentes 表示痛苦、悲痛，tristes 表示忧愁；以两个近义而有区别的词保留原文叠加的情感力度，semper 译作“永远”。
theological_decisions:
- issue: 句首 ingredientur 与上一节末尾 non 的关系
  choice: 正文保留本节范围内的“进入”，脚注说明须与上一节的否定词连读
  alternative: 直接译作“不能进入”
  rationale: 拉丁文的分节使 non 位于上一节末尾，而 ingredientur 位于本节开头。脚注既忠实于指定经节的文本跨度，也避免读者误以为此处肯定他们会进入。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”自然体现拉丁语将来时，同时不额外引入教派性解释；分号显示本节句首承接前文，随后由 sed 转折进入新的陈述。
