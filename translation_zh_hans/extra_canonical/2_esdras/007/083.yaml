  text: 'The third way: they see the reward laid up for those who have trusted the covenants of the Most High.'
translation:
  language: zh_hans
  text: 第三种情形：他们看见为那些信赖至高者所立的诸约的人所存留的赏赐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tertia uia
  choice: 第三种情形
  rationale: 直译为“第三条路”在现代汉语中容易被理解为一条可选择的道路；本段是在依次列举亡魂所经历的情形，因此译为“第三种情形”更自然，也保留列举结构。
- source_word: uident
  choice: 他们看见
  rationale: 按拉丁文直陈语气译出，不把视觉性的表达弱化为“得知”或“意识到”。
- source_word: repositam mercedem
  choice: 存留的赏赐
  rationale: repositam 表示已经为人存放、保留；mercedem 可指报偿或赏赐，此处采用自然且庄重的“赏赐”。
- source_word: his qui
  choice: 为那些……的人
  rationale: 保留赏赐所预备对象的关系结构。
- source_word: testamentis altissimi crediderunt
  choice: 信赖至高者诸约
  rationale: 所给拉丁文节选止于 his qui，完整措辞依据该节经校核的英译咨询层复原；用“信赖”表达 crediderunt 所含的信靠意味，并以“诸约”对应复数 covenants/testamentis。
theological_decisions:
- issue: “约”的单复数及其神学含义
  choice: 至高者诸约
  alternative: 至高者的约／至高者的遗命
  rationale: 采用复数以保留咨询文本所反映的源文数；不将其统一为单一之约，也不把 testamenta 限定为“遗命”，从而避免预先消解其可能涵盖的盟约性含义。
- issue: 赏赐与信赖之间的关系
  choice: 按原句并列呈现“为那些信赖……的人存留”
  alternative: 加译为因信而赢得赏赐
  rationale: 原文只说明赏赐为这类人存留，并未明确论述功德、因果或称义机制，因此不作教义性扩写。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“第三种情形”与上下文的编号列举相配；句法简洁，保留“看见”“存留”“赏赐”等原文意象。所提供的拉丁文片段在 his qui 处截断，后半句参考经审校的英文咨询层，但没有据此加入超出其见证范围的解释。
