  text: Non crediderunt autem ei, sed nec post eum prophetis, sed nec mihi qui locutus sum ad eos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/130.yaml
  text: But they did not believe him, nor the prophets after him, nor even me, who spoke to them.
translation:
  language: zh_hans
  text: 可是，他们不信他，也不信他之后的众先知，甚至不信我——我曾向他们说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Non crediderunt
  choice: 他们不信
  rationale: 直接表达拉丁文完成时所述的拒绝相信，简洁自然。
- source_word: ei
  choice: 他
  rationale: 保留原文阳性单数代词，不在本节内擅自补明所指。
- source_word: post eum prophetis
  choice: 他之后的众先知
  rationale: 忠实呈现时间次序；汉语补出“众”以自然表达复数 prophetis。
- source_word: mihi qui locutus sum ad eos
  choice: 我——我曾向他们说话
  rationale: 保留说话者自指及关系从句的强调；破折号使汉语衔接清楚。
theological_decisions:
- issue: 代词 ei 的身份
  choice: 译作“他”，不解释身份
  alternative: 按上下文补译具体人物名称
  rationale: 本节原文只用代词；保留其指代关系可避免把上下文解释直接写入正文。
- issue: 对“我”的强调程度
  choice: 译作“甚至不信我”
  alternative: 译作“也不信我”
  rationale: sed nec mihi 在层递结构中带有加强意味，“甚至”自然传达高潮，同时不增添教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以“可是……也不……甚至……”再现原文连续否定与递进，保留原文代词所具有的上下文依赖性。
