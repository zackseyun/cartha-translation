base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/116.yaml
  text: 'And I answered and said[a], “This is my first and last word: it would have been better not to give the earth to Adam, or else, when it had already been given, to restrain him so that he would not sin.”'
translation:
  language: zh_hans
  text: 我回答说：“这是我最初也是最后的意见：大地若没有生出亚当，本来更好；即使已经生出了他，也该约束他，使他不至犯罪。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不把大地赐给亚当；即使已经赐给了他，也该约束他，使他不至犯罪。”拉丁文在这里可以有两种句法理解。
    reason: Adam 在拉丁文中不变格，dare terram Adam 既可理解为“大地生出亚当”，也可理解为“把大地赐给亚当”；正文依上下文采用前者。
lexical_decisions:
- source_word: dare terram Adam
  choice: 大地若没有生出亚当
  rationale: 将 terram 理解为不定式 dare 的宾语式主语，将不变格的 Adam 理解为宾语；结合《以斯拉四书》3:5中大地尘土“生出亚当”的相近表达，dare 在此取“产出、生出”之意。
- source_word: hic sermo meus primus et novissimus
  choice: 这是我最初也是最后的意见
  rationale: sermo 在这里指发言或主张；“意见”比直译“话”更自然，同时保留“最初也是最后”所表达的定论语气。
- source_word: coercere eum ut non peccaret
  choice: 约束他，使他不至犯罪
  rationale: coercere 表示遏制、约束；ut 加虚拟式表达目的或结果，译文不强行排除二者，但在汉语中自然呈现为“使他不至”。
theological_decisions:
- issue: 是“大地生出亚当”，还是“把大地赐给亚当”
  choice: 正文采用“大地生出亚当”
  alternative: “不把大地赐给亚当；既已赐给了他……”
  rationale: 拉丁文因 Adam 不变格而在句法上存在歧义；但上下文传统及3:5的平行措辞支持以“大地”为 dare 的逻辑主语、以亚当为其产物。脚注保留另一种语法分析，避免消除真实歧义。
- issue: 谁约束亚当
  choice: 不明说施事者
  alternative: 明确译作“上帝也该约束他”
  rationale: 拉丁文 coercere 的施事者未明说；虽可由神学语境推知为上帝，正文仍不补入原文没有的名称。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“本来更好”保留反事实判断的力度；“最初也是最后的意见”表达说话者把此言当作首要且最终结论。脚注标记已在正文中出现。
