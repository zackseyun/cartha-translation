  text: neither air nor darkness nor evening nor morning[a], neither summer nor spring nor heat nor winter, neither frost nor cold nor hail,
translation:
  language: zh_hans
  text: 既没有空气，也没有黑暗；既没有傍晚，也没有早晨〔a〕；既没有夏天，也没有春天；既没有炎热，也没有冬天；既没有霜冻，也没有寒冷，也没有冰雹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aerem
  choice: 空气
  rationale: 按其通常义直译，并保留本节开头在现有拉丁文本中的词项。
- source_word: sero
  choice: 晚上
  rationale: 这里与“早晨”（mane）相对，采用现代汉语自然表达。
- source_word: aestum
  choice: 炎热
  rationale: 区别于表示季节的“夏天”（aestatem），保留“热度”与“季节”的并列差异。
- source_word: gelu
  choice: 霜冻
  rationale: 既体现冰霜、冻结之意，也与后面的“寒冷”（frigus）有所区别。
- source_word: grandinem
  choice: 冰雹
  rationale: 拉丁文本末尾虽因换行显示为 grandi-，完整词为 grandinem，意为冰雹。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话，以重复的“既没有……也没有……”再现拉丁文 neque 的排比，同时适度分组，避免中文句式过于拖沓。本节严格依照所给拉丁文的节界，不加入属于下一节的“雨”或“露水”。
