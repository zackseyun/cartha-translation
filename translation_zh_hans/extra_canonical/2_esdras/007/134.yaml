  text: and long-suffering, because he shows long-suffering toward those who have sinned, as toward his own works,
translation:
  language: zh_hans
  text: 又是恒久忍耐的，因为他向那些犯了罪的人显出恒久忍耐，仿佛对待自己的造物一样，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: longanimis / longanimitatem
  choice: 恒久忍耐／恒久忍耐
  rationale: 保留同根词的重复及神持久忍耐的含义；“恒久忍耐”比单说“耐心”更庄重，也更贴近 longanimitas。
- source_word: praestat
  choice: 以……对待
  rationale: 在此与 longanimitatem 连用，表达向某些人施予、显出恒久忍耐；译为“以恒久忍耐对待”符合现代汉语表达。
- source_word: his qui peccaverunt
  choice: 那些犯了罪的人
  rationale: 准确呈现完成时 peccaverunt，指已经犯罪的人，不额外限定其身份。
- source_word: quasi suis operibus
  choice: 如同对待自己的作品一样
  rationale: 保留 quasi“如同、仿佛”的比较意味，并将省略的对待关系明示，使汉语完整自然；opera 译作“作品”，维持受造之物的宽泛含义。
theological_decisions:
- issue: quasi suis operibus 所表达的关系
  choice: 如同对待自己的作品一样
  alternative: 因为他们是他亲手所造的
  rationale: 原文使用 quasi，形成比较而非直接作因果或身份断言；正文保留这种语义张力，不将其解释为明确的创造论陈述。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并保留原文“恒久忍耐”的修辞重复。句末逗号表明本节是上下文中连续列举的一部分。
