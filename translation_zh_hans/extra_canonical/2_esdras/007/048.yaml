  to: 因为邪恶的心在我们里面滋长，使我们与上帝[a]疏远，引我们陷入败坏，走上死亡之路，向我们显出灭亡的路径，使我们远离生命；而这并非关乎少数人，而是关乎几乎所有受造的人。”
