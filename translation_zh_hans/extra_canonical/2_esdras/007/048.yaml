source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tinebit futuram saeculi iocunditatem facere, multis autem tormenta. Increuit enim in nos cor malum, quod nos abalienauit ab his, et deduxit nos in corruptionem, et in itinera mortis, ostendit nobis semitas perditionis et longe fecit nos a uita; et hoc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/048.yaml
  text: For an evil heart has grown in us[a], which has alienated us from these things and led us into corruption and into the ways of death, shown us the paths of perdition, and taken us far from life; and this not for a few, but for almost all who have been created.”
translation:
  language: zh_hans
  text: 因为邪恶的心在我们里面滋长，使我们与上帝[a]疏远，引我们陷入败坏，走上死亡之路，向我们显出灭亡的路径，使我们远离生命；而这并非关乎少数人，而是关乎几乎所有受造的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文作“与这些事疏远”；但叙利亚文、埃塞俄比亚文、阿拉伯文和亚美尼亚文等古代译本作“与他疏远”，所指为上帝，可能保存了更早的文本读法。
    reason: 说明现存拉丁文 ab his 与多种古代译本所见“与他疏远”之间的重要文本差异，并交代正文采用“上帝”的依据。
lexical_decisions:
- source_word: cor malum
  choice: 恶心
  rationale: 直译为“邪恶的心”，在上下文中指人里面趋向罪恶、引向死亡的内在倾向；采用简洁而庄重的“恶心”，但按现代汉语语义可能被误解，因此正文以整体句意加以限定。
- source_word: Increuit ... in nos
  choice: 在我们里面滋长
  rationale: 保留拉丁文“增长、滋长”的动态意象，并自然表达其在人里面发展的意思。
- source_word: abalienauit
  choice: 使……疏远
  rationale: 表达关系上的隔绝，不将其强化为彻底弃绝。
- source_word: corruptionem
  choice: 败坏
  rationale: 兼顾道德败坏与走向毁灭的语义张力。
- source_word: itinera mortis
  choice: 死亡之路
  rationale: 保留道路隐喻和复数所表达的多种趋向，以汉语集合性单数自然呈现。
- source_word: semitas perditionis
  choice: 灭亡的路径
  rationale: 与“死亡之路”形成近义并列，同时保留 semitas 较细小路径的意象。
- source_word: longe fecit nos a uita
  choice: 使我们远离生命
  rationale: 贴近原文的空间隐喻，不把“生命”限定为今生或永生。
- source_word: omnibus qui creati sunt
  choice: 所有受造的人
  rationale: 在此语境中明确所指为受造的人类，而非所有受造物。
theological_decisions:
- issue: ab his 的指称及其底本讹误可能
  choice: 正文译作“与上帝疏远”，并加注说明
  alternative: 按现存拉丁文直译为“与这些事疏远”
  rationale: 现存拉丁文 ab his 字面是“离开这些”，但叙利亚文、埃塞俄比亚文、阿拉伯文和亚美尼亚文等古译本共同支持“离开他”，所指为上帝；这很可能反映已佚希腊文 ἀπ’ αὐτοῦ 被误读为 ἀπ’ αὐτῶν。采用多重古译见证所保存的较早读法，同时以脚注交代拉丁文本。
- issue: 末句责任主体
  choice: 译为“受此影响的并非少数”
  alternative: 直连为“这并非临到少数人”
  rationale: 拉丁引文在 et hoc 处截断，后半句由完整经文传统补足。用“受此影响”承接恶心所造成的疏远、败坏与死亡，而不额外断定具体神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留“滋长”“道路/路径”“远离生命”等原文意象。因“恶心”在现代口语中常指恶心呕吐，出版时也可考虑“邪恶的心”；本稿选择“恶心”以保持简洁和经文语体，但需由上下文避免误读。
