  yaml_path: translation/extra_canonical/2_esdras/007/057.yaml
  text: 'So judge for yourself which things are precious and desirable: what is abundant, or what is born rare?'
translation:
  language: zh_hans
  text: 你也自己衡量一下：哪些是宝贵而可羡慕的——是繁衍增多的，还是罕见产生的？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Aestima
  choice: 判断一下
  rationale: 该词有衡量、估定之意；此处要求听者比较两类事物的价值，译作“判断一下”自然且贴合语境。
- source_word: pretiosa et desiderabilia
  choice: 宝贵、可羡慕
  rationale: 分别保留“价值珍贵”与“令人向往”的双重含义，不将二者合并。
- source_word: quod multiplicatur
  choice: 数量众多的
  rationale: 表达事物增多、数量充足的意思，并与后面的“稀少”形成清楚对比。
- source_word: quod rarum nascitur
  choice: 生来稀少的
  rationale: 保留 nascitur 的“出生、产生”意象，同时用现代汉语表达某物出现得稀少。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以反问式二选一保留原文的修辞张力。所给拉丁文本开头“æramentum, plumbum super ferrum, et fictile super plumbum”在句法和内容上显然是上一节比较清单的残尾；依本节经文边界及经审核的英文咨询层，本节从“Aestima et tu”起译。
