  text: But now understanding grows with us[a], and because of this we are tormented, because we perish knowing it.
translation:
  language: zh_hans
  text: 可是如今，意识随着我们一同增长；正因如此，我们备受折磨，因为我们明知自己终将灭亡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们是在明知中灭亡的。”
    reason: 保留拉丁文分词scientes的伴随状态或方式意味，说明这里不是“虽然知道”的让步关系。
lexical_decisions:
- source_word: sensus
  choice: 知觉
  rationale: 此处不只是理智上的“理解”，而是人对自身处境和结局的意识；“知觉”既能涵盖意识，也能与上下文中无知觉的状态形成对照。
- source_word: nobiscum crescit
  choice: 随着我们一同增长
  rationale: 贴近拉丁文的共同成长意象，同时符合现代汉语表达。
- source_word: scientes（据审校所保留的本节后半句）
  choice: 明知自己要灭亡
  rationale: 将分词理解为伴随方式或处境，强调人在清楚知道结局的情况下灭亡，而非让步意义的“虽然知道”。
theological_decisions:
- issue: 人的知觉与受苦、灭亡之间的关系
  choice: “正因如此，我们备受折磨，因为我们明知自己要灭亡”
  alternative: “尽管我们知道，我们仍要灭亡”
  rationale: 上下文的论点是，知觉使人意识到自己的结局，从而带来痛苦；不采用让步式译法，以免暗示知识本应使人免于灭亡。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“知觉”比“悟性”更能表达此处对自身命运的意识；句式保留原文因果推进。所给拉丁文本截于“知觉随着我们一同增长”，后半句依照经过源文审校的经文范围表述。
