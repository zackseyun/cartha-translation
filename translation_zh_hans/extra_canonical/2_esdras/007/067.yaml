  text: nec enim sciunt cruciamenta nec salutem post mortem repromissam sibi. Nobis autem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/067.yaml
  text: for they do not know torments[a], nor the salvation promised to them after death. But as for us,
translation:
  language: zh_hans
  text: 因为他们既不知道种种苦刑，也不知道死后应许给他们的救恩。至于我们，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cruciamenta
  choice: 种种苦刑
  rationale: 该词指折磨、酷刑或由此而来的痛苦；译作“种种苦刑”保留复数含义，也避免将其过度限定为某一种末世刑罚。
- source_word: salutem
  choice: 救恩
  rationale: 在此末世语境中，“救恩”比一般的“拯救”更能表达死后蒙救助、得以保全的整体含义。
- source_word: repromissam sibi
  choice: 应许给他们
  rationale: repromissam在此表示已经郑重应许，sibi回指前文复数主体；现代汉语用“应许给他们”自然、准确，无须机械译出前缀re-。
- source_word: Nobis autem
  choice: 至于我们，
  rationale: 保留原文转折并保持未完句式，使本节自然衔接下节。
theological_decisions:
- issue: 死后救恩与苦刑的关系
  choice: 按原文并列陈述他们不知道苦刑，也不知道应许给他们的死后救恩
  alternative: 将苦刑解释为获得救恩前必经的炼净过程
  rationale: 拉丁文本仅以nec…nec并列两项，并未说明二者之间的次序或因果关系，因此不加入特定教义解释。
- issue: post mortem的修饰范围
  choice: 译为“要在死后得到的救恩”
  alternative: 译为“死后才作出的应许”
  rationale: 语序和语义更自然地表明救恩是在死后实现，而非应许是在死后才发出。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“既不……也不……”对应拉丁文nec…nec；末尾保留逗号和未完结构，以忠实呈现“Nobis autem”向下一节的过渡。
