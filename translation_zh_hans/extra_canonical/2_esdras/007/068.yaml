  text: quid prodest, quoniam salutati saluabimur, si tormento tormentabimur? Omnes enim qui nati sunt, conmixti sunt iniquitatibus, et pleni sunt peccatis, et grauidi delictis;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/068.yaml
  text: What does it profit that we will be saved[a], if we will be tormented? For all who have been born are mixed with iniquities, and are full of sins and burdened with transgressions.
translation:
  language: zh_hans
  text: 若我们要受折磨，得救[a]有什么益处呢？因为所有出生的人都与不义混杂，充满罪恶，背负着过犯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文在“得救”处使用同源词复叠，直译近似“得救而得救”；这里按自然汉语简译。
    reason: 说明源文形式，同时避免武断判定该复叠必然表示强调或确定性。
lexical_decisions:
- source_word: quid prodest
  choice: 有什么益处呢
  rationale: 保留反问语气，同时符合现代汉语的自然表达。
- source_word: salutati saluabimur
  choice: 得救
  rationale: 拉丁文本采用同源词复叠；正文不擅自加入“必定”等源文未明说的强化含义，并用脚注说明其形式。
- source_word: tormento tormentabimur
  choice: 受折磨
  rationale: 以自然汉语表达拉丁文名词与动词的同源复叠，不额外加入“严酷地”等强度修饰。
- source_word: conmixti sunt iniquitatibus
  choice: 与不义混杂
  rationale: 较直接保留 conmixti 的“混合、掺杂”意象，而不解释为更具体的“受缠绕”或“陷入”。
- source_word: grauidi delictis
  choice: 背负着过犯
  rationale: grauidi 表达沉重负担的意象；“背负”在现代汉语中庄重自然，也避免“怀着过犯”可能引起的非本义联想。
theological_decisions:
- issue: 得救与受折磨并置所形成的张力
  choice: 保留“若还要受折磨，得救有什么益处”的反问
  alternative: 将“得救”解释为最终救恩，或将“折磨”限定为暂时惩罚
  rationale: 源文没有说明两者的时间、性质或关系，因此不以特定教义体系消解其张力。
- issue: 人普遍与罪恶相连的表述
  choice: 译为“凡出生的人都与不义混杂”
  alternative: 译为“所有人本性上都有罪”
  rationale: 后者会把源文的形象性陈述系统化为教义命题；正文仅传达原句所说的普遍状态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不义—罪恶—过犯”保留源文三个相关但不完全相同的罪责词语；句式维持先反问、后说明人类处境的结构。
