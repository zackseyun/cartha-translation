  yaml_path: translation/extra_canonical/2_esdras/007/051.yaml
  text: One age, but two. For you have said that the righteous are not many, but few,
translation:
  language: zh_hans
  text: 一个世代，却有两个。因为你曾说，义人不多，只有少数，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: 世代
  rationale: 拉丁语 saeculum 可指时代、世代或世界时期；此处保留时间层面的含义，并避免擅自补明原文所省略的“两者”具体所指。
- source_word: iustos
  choice: 义人
  rationale: 以现代中文圣经语域中自然且准确的称谓表达“公义的人”。
- source_word: paucos
  choice: 少数
  rationale: 与前面的“不多”形成原文所具的同义强调，同时保持句尾尚未完结的衔接感。
theological_decisions:
- issue: “一个世代，却有两个”的省略与张力
  choice: 直译为“一个世代，却有两个”
  alternative: “只有一个时代，却分为两个”
  rationale: 原文 unum saeculum, sed duo 本身简略且语法上有所省略；不补入“部分”“世界”或具体末世阶段，以保存原文的歧义和张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“因为”对应 enim；“曾说”自然表达 dixisti 的完成动作。本节以逗号结束，以反映所给拉丁文本和上下文中句意尚待续接。
