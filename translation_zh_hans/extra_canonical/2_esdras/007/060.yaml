id: 2ES.7.60
reference: 2 Esdras 7:60
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod difficile est, gaudet super eum, qui uabet abundantiam ; Sic et a me repromissa creatura, iocundabor enim super paucis et qui saluabuntur, propterea quod ipsi sunt qui gloriam meam nunc dominatiorem fecerunt, et per quos nunc nomen meum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/060.yaml
  text: 'So also with the creation promised by me: I will rejoice over the few who will be saved[a], because they are the ones who have now made my glory more dominant, and through whom my name is now named.'
translation:
  language: zh_hans
  text: 我所应许的受造界也是如此：我要因那少数将要得救的人[a]而欢喜，因为正是他们使我的荣耀如今越发显为尊大；也正是借着他们，我的名如今得以被人称说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得救的人”。
    reason: 汉语可用无时态标记的名词短语表达这一群体；正文则依拉丁文将来时明确译出“将要”。
lexical_decisions:
- source_word: repromissa creatura
  choice: 我所应许的受造界
  rationale: creatura 可指受造之物或整体受造界；结合单数集合性用法，译作“受造界”较自然，并保留其广度。repromissa 直译为“所应许的”。
- source_word: saluabuntur
  choice: 将要得救的人
  rationale: 这是将来时被动直陈式，明确保留末世性的将来指向。
- source_word: dominatiorem fecerunt
  choice: 使……越发显为尊大
  rationale: 比较级 dominatiorem 含“更居主导、更显强盛”之意；“越发显为尊大”既保留比较意味，也避免生硬地说荣耀“更具支配性”。
- source_word: nomen meum … nominatur
  choice: 我的名如今得以被人称说
  rationale: 采用与英语审校层“is now named”一致的保守表达，不擅自具体化为“称颂”或“传扬”。
theological_decisions:
- issue: 得救的时间指向
  choice: 将要得救
  alternative: 得救的人／正在得救的人
  rationale: 拉丁文 saluabuntur 是将来时被动式，应保留未来审判与拯救的时间张力。
- issue: 荣耀“更占主导”的含义
  choice: 越发显为尊大
  alternative: 更有支配力／得胜
  rationale: 原文措辞不寻常；所选译法保留荣耀增强、居于显著地位的意思，同时不把它解释成特定的得胜论或统治教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“得以被人称说”略带形式对应色彩，是为了保留原文被动表达及语义开放性；分号呈现原因句内部两个并列关系。
