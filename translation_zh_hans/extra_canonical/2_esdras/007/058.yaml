  yaml_path: translation/extra_canonical/2_esdras/007/058.yaml
  text: And I said[a], “O Lord, ruler, what is more abundant is of less value[b], for what is rarer is more precious.”
translation:
  language: zh_hans
  text: 我说：“统治者啊，主啊，越多的，价值越低；因为越稀少的，越宝贵。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: 主啊，统治者
  rationale: 两个呼格称号均予保留，以直接反映拉丁文的双重称呼；措辞庄重，并避免把 dominator 改写成关系从句。
- source_word: quod abundat
  choice: 越多的东西
  rationale: 在格言式对比中自然表达“数量较多、较常见之物”，并与后面的“越稀少”形成对应。
- source_word: uilius
  choice: 越不值钱
  rationale: 既可表达价格较低，也能涵盖价值较低；与 pretiosius 的比较级结构对应。
- source_word: rarius pretiosius
  choice: 越稀少……越宝贵
  rationale: 保留两个比较级及稀少与珍贵之间的因果性格言对照。
theological_decisions:
- issue: dominator domine 的称号关系
  choice: 主啊，统治者
  alternative: 至高主宰啊；统治万有的主啊
  rationale: 原文是并列的两个呼格称号，译文不把它们合并为单一复合尊号，也不补入原文未明说的“万有”，从而保留形式及可能的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的格言式表达。“主啊，统治者”略带正式称号感，旨在贴近原文双呼格；后半句用“越……越……”清楚呈现比较结构。
