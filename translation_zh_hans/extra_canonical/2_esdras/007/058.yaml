- from: 我说：“主啊，统治者，越多的东西越不值钱[a]，因为越稀少的东西越宝贵。”
  to: 我说：“统治者啊，主啊，越多的，价值越低；因为越稀少的，越宝贵。”
  rationale: 修订避免将中性泛指的 quod 限为“东西”，以“越多的／越稀少的”保留原文简洁的格言性。将“越不值钱”调整为“价值越低”，更贴合 uilius 与 pretiosius 的价值对照并保持庄重语体；脚注保留价格义。双呼格调整语序，使现代汉语更自然而不合并称号。
