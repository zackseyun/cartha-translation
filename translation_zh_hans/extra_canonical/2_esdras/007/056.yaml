translation:
  language: zh_hans
  text: 银、铜、铁、铅和陶土；然而，银多于金，铜多于银，铁多于……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所据拉丁文本到“铁多于”便中断；比较的对象接在下一节。
    reason: 说明经节切分造成的未完句，避免擅自补足源文本范围之外的内容。
lexical_decisions:
- source_word: argentum
  choice: 银
  rationale: 对应拉丁文“银”，并与后文“金”形成材质与数量上的对比。
- source_word: æramentum
  choice: 铜
  rationale: 该词可泛指铜或铜制合金；此处材料序列中用现代汉语通称“铜”最自然，也保留原文的大类含义。
- source_word: ferrum
  choice: 铁
  rationale: 直接对应拉丁文，保持材料列表及后续比较结构。
- source_word: plumbum
  choice: 铅
  rationale: 直接对应拉丁文所指金属。
- source_word: fictile
  choice: 陶土
  rationale: 拉丁文可指陶制品或陶质材料；与金属并列时译为“陶土”更能自然表示材料类别。
- source_word: Multiplicatur ... super
  choice: 多于
  rationale: 此处表达相对数量更多、更加丰富；“多于”简洁地保留逐项比较关系。
theological_decisions:
- issue: 经文在“et ferrum super”处截断
  choice: 以破折号明确保留未完比较句
  alternative: 补出下一节所含的比较对象
  rationale: 所给拉丁文经节范围止于“铁多于……”，不可把下一节内容移入本节；破折号既忠实呈现截断，也避免读者误以为句意完整。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留材料清单的简洁节奏，并以破折号呈现跨节延续的句法。
