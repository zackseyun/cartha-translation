  yaml_path: translation/extra_canonical/2_esdras/007/123.yaml
  text: And because paradise will be shown, whose fruit remains incorruptible, in which there is fullness and healing,
translation:
  language: zh_hans
  text: 又因为乐园将要显现，其中的果实永不朽坏，那里有饱足和医治，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: 因为
  rationale: 表示原因而非条件，与拉丁文连词的通常含义及上下文修订一致。
- source_word: paradisus
  choice: 乐园
  rationale: 采用庄重而通行的圣经用语，保留末世性乐园的意涵。
- source_word: ostendetur
  choice: 将要显现
  rationale: 反映将来时被动形式；“显现”比“被展示”更符合现代汉语，也保留乐园向人显明之意。
- source_word: fructus
  choice: 果实
  rationale: 直接对应原文，既可作集合意义，也不限定具体果类。
- source_word: incorruptus perseverat
  choice: 永不朽坏
  rationale: “朽坏”传达 incorruptus，“永不”自然表达 perseverat 所强调的持续状态。
- source_word: saturitas
  choice: 饱足
  rationale: 保留满足、丰足且不再匮乏的意涵。
- source_word: medella
  choice: 医治
  rationale: 该词指医治或疗愈；“医治”简洁、自然，并保留其可能兼具身体与整体恢复的广度。
theological_decisions:
- issue: 乐园显现的确定性
  choice: 又因为乐园将要显现
  alternative: 又如果乐园将要显现
  rationale: quoniam 表示原因，故不把此事译为假设条件。
- issue: “果实”的不朽坏与持续性
  choice: 其中的果实永不朽坏
  alternative: 其中的果实一直保持不朽坏
  rationale: 简明表达 incorruptus perseverat 的持续不败坏状态，不额外说明其原因或性质。
- issue: 医治的范围
  choice: 医治
  alternative: 疗愈
  rationale: 不限定为肉体、灵性或末世性的某一种医治，以保留原文开放性。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。保留原句作为较长论证中的从属分句，以逗号收束；“其中”指乐园，“那里”避免连续重复同一结构。
