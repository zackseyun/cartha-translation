source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc ergo tu quare conturbaris, corruptibilis cum sis? et quid moveris tu, cum sis mortalis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/015.yaml
  text: So now why are you disturbed[a], seeing that you are corruptible? And why are you shaken, seeing that you are mortal?
translation:
  language: zh_hans
  text: 那么，你既是会朽坏的，为什么还心烦意乱？你既是必死的，为什么还动摇不安？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris
  choice: 心烦意乱
  rationale: 该词表示内心受到搅扰、陷入不安；译为“心烦意乱”既自然，又保留反问中的心理动荡。
- source_word: corruptibilis
  choice: 会朽坏的
  rationale: 保留拉丁文所指向的可朽坏性，不将其缩窄为单纯的道德败坏。
- source_word: moveris
  choice: 动摇不安
  rationale: 此处与 conturbaris 平行，表示受震动、被扰乱；“动摇不安”避免现代汉语“感动”的正面情感含义。
- source_word: mortalis
  choice: 必死的
  rationale: 准确表达凡人终有一死的处境，比“会死的”更凝练庄重。
theological_decisions:
- issue: corruptibilis 的含义范围
  choice: 会朽坏的
  alternative: 腐败的／败坏的
  rationale: 上下文将其与“必死的”并列，重点是受朽坏与死亡辖制的人类处境；译文不额外断定其专指道德败坏。
- issue: 两个反问之间的平行关系
  choice: 分别译为“心烦意乱”和“动摇不安”
  alternative: 两处都译为“烦乱”
  rationale: 保留原文 conturbaris 与 moveris 的词汇差异，同时呈现二者相近而递进的心理动荡。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么”承接上文；两个“你既是……为什么还……”的句式保留原文对称反问。无脚注标记，因为正文没有需要另列的实质性异文或难以容纳的译法。
