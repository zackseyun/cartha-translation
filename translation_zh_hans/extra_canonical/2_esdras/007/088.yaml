translation:
  language: zh_hans
  text: 他们将在末后的时期开始审判他。因为那些持守道路的……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文在这里中断，且断在“持守/遵守”这一动词之内；“他”所指的人、审判者的身份以及后续句文，都须由缺失的上下文确定。
    reason: 说明残缺的实际位置及未定指代，不补入其他文本形态的内容。
lexical_decisions:
- source_word: quem
  choice: 他
  rationale: 拉丁文为阳性单数宾格关系代词；因本节从残缺的上文续接，中文以“他”承接，但具体所指须由前文确定。
- source_word: incipient ... iudicari
  choice: 他们将开始审判
  rationale: 按拉丁文结构将 incipient 译为“将开始”，将被动不定式 iudicari 在中文中自然转换为主动表达；未补明未见于片段的主语。
- source_word: in nouissimis temporibus
  choice: 在末后的时期
  rationale: 保留复数 temporibus 的时期性，并以“末后的”传达 nouissimis 的末世语义，不把它收窄为某个单一时刻。
- source_word: Nam
  choice: 因为
  rationale: 保留本句对前文作解释或论证的连接关系。
- source_word: eorum qui uias seruaue-
  choice: 那些持守了……道路的人
  rationale: eorum qui 表示“那些……的人”，uias 为复数“道路”；seruaue- 是跨页或残片处截断的词形，故用省略号显明正文残缺，不擅自补出道路的所属者。
theological_decisions:
- issue: quem 的指代及审判主体
  choice: 译作“他们……审判他”，不具体说明双方身份
  alternative: 补作“他们将开始审判某一类人”或依其他文本形态改写
  rationale: 现存片段本身缺少足以确定指代的上文；补明身份会消除原文真实的不完整与歧义。
- issue: 残句 uias seruaue- 的补全
  choice: 保留为残句“那些持守了……道路的人”
  alternative: 补成“那些持守了至高者道路的人”
  rationale: 所给拉丁文在 seruaue- 后中断，也未保存 uias 后可能出现的限定语；不从其他文本形态移入神学性称谓。
translation_notes:
  register: 采用庄重而易懂的现代汉语。“末后的时期”保留经文语域；以省略号和破折号明确显示句子在原始材料中未完结。
