  text: Si enim non multiplicaverit, non vivificabitur saeculum cum his qui habitant in eo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/137.yaml
  text: For if he does not multiply them[a], the age will not be given life with those who dwell in it.
translation:
  language: zh_hans
  text: 因为他若不使他们[a]增多，这个世界及其中居住的人就不会得着生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文没有明说“他们”；此处按上下文补出。
    reason: 说明原文省略的宾语，保留文本的真实含混。
lexical_decisions:
- source_word: multiplicaverit
  choice: 使……增多
  rationale: 该词为使役意义的“增多、繁衍”，采用“使……增多”保留施事者与受事者的关系；拉丁文宾语省略，译文按上下文补出“他们”。
- source_word: saeculum
  choice: 时代
  rationale: saeculum 可指“时代、世代”或“世界”；此处选“时代”，以保留末世论语境中的时间维度，同时用脚注注明另一译法。
- source_word: vivificabitur
  choice: 得着生命
  rationale: 该词是被动式，意为“被赋予生命、得以活着”；“得着生命”在现代汉语中自然而庄重，也保留被赋予生命的含义。
- source_word: cum his qui habitant in eo
  choice: 连同住在其中的人一起
  rationale: 直译其伴随结构，并让“其中”明确回指前面的“时代”；虽略显形象化，却忠实保留原文表达。
theological_decisions:
- issue: multiplicaverit 的省略宾语
  choice: 正文补出“他们”，并以脚注说明
  alternative: 不补宾语，译作“他若不使之增多”
  rationale: 拉丁文没有明说宾语，但汉语若完全省略会不自然；“他们”符合上下文和英语审校层，同时脚注明示这是补译，避免把推定内容伪装成明文。
- issue: 未来条件句的语气
  choice: “若……也就不会……”
  alternative: “要不是……就不会……”
  rationale: multiplicaverit 与 vivificabitur 构成面向未来或一般逻辑的真实条件，不宜译成与事实相反的假设。
- issue: saeculum 的末世论含义
  choice: 时代
  alternative: 世界
  rationale: 原词本身可兼具时间与世界层面的含义；正文不将其限定为物质世界，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“也就不会”清楚呈现条件与结果；“连同……一起”保留拉丁文 cum 的伴随关系。
