revisions:
- from: 因为，他若不使他们[a]增多，这时代也就不会连同住在其中的人一起得着生命。[b]
  to: 因为他若不使他们[a]增多，这个世界及其中居住的人就不会得着生命。
  rationale: 修正正文中 saeculum 的译法，使其与“住在其中的人”的空间性指称相协调；同时调整标点和句法，使译文更自然。保留未来真实条件“若……就不会……”、省略宾语的脚注说明，以及 vivificabitur 的“得着生命”。脚注 b 不在正文设置锚点，故不应保留为有效脚注；已提供其内容仅供需要保留译注时在“世界”后设置锚点。
