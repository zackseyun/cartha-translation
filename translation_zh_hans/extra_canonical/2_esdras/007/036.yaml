  text: Et apparebit lacus tormenti, et contra illum erit locus requietionis ; et clibanus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/036.yaml
  text: And the pit of torment will appear[a], and opposite it will be the place of rest; and the furnace of Gehenna will be shown[b], and opposite it the paradise of delight.
translation:
  language: zh_hans
  text: 并且，刑罚之坑将显现[a][b]，在它对面将是安息之地；欣嫩子谷的火炉将显露，在它对面将是喜乐的乐园。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 7:36—105是本斯利所称的“失落片段”。大多数中世纪拉丁文抄本删去了这段——很可能是因为本段说，为受罚之人代求不会蒙应允，这令后来的基督徒敬虔传统难以接受。因此，武加大译本和1611年《英王钦定本》都没有这段；其中7:35之后直接接上了旧版在约七十节之后编号为7:36的内容。罗伯特·本斯利于1875年从一份西班牙抄本中重新发现了这段文字；现代校勘本现已普遍将其恢复。
    reason: recovered_fragment
  - marker: b
    text: 旧译作：“那时，刑罚之坑将显现出来。”
    reason: previous_rendering
lexical_decisions:
- source_word: lacus tormenti
  choice: 刑罚之坑
  rationale: lacus 可指湖、水池或坑；此处与受刑之处相连，译作“坑”较符合启示文学的空间意象，同时不扩写为特定教义术语。
- source_word: locus requietionis
  choice: 安息之地
  rationale: 直译其“地方”与“安息”的含义，并与前面的受刑之处形成鲜明对照。
- source_word: clibanus
  choice: 火炉
  rationale: 该词指烘炉或熔炉；“火炉”自然、清楚，也保留审判意象。
- source_word: Et apparebit
  choice: 将显现出来
  rationale: 保留将来时和“显现”的语义；句首 Et 以“并列延续”的方式体现于上下文，不改成表示时间推进的“那时”。
theological_decisions:
- issue: 受刑之处的空间称谓
  choice: 刑罚之坑
  alternative: 刑罚之湖
  rationale: 拉丁文 lacus 有歧义；选择符合本段传统语境的“坑”，但不将其直接等同于后世系统化的地狱观。
- issue: Gehenna 的表达
  choice: 欣嫩子谷
  alternative: 地狱
  rationale: 采用名称本义，保留其历史地理意象，避免用“地狱”提前消解原文意象及其神学张力。
- issue: 首句连接关系
  choice: 延续性的“并且/将”结构
  alternative: 那时，刑罚之坑将显现
  rationale: 拉丁文 Et 是并列连接词，并不明确表达时间递进；因此不增添“那时”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留连续并列的启示文学节奏，并以“在它对面”重现两组对照。所给拉丁文在 clibanus 处截断；后半句措辞参考经审校的英文咨询层恢复，因此未把未见于所给拉丁片段的词列作直接拉丁词汇判断。
