  text: et omnis qui liberatus est de praedictis malis, ipse videbit mirabilia mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/027.yaml
  text: And everyone who is delivered from the evils foretold will see my wonders[a].
translation:
  language: zh_hans
  text: 凡从所预言的灾祸中获救的人，他必看见我的奇事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnis qui
  choice: 凡……的人
  rationale: 表达涵盖每一个符合条件之人的普遍范围，同时保持现代汉语自然。
- source_word: liberatus est
  choice: 获救
  rationale: 拉丁文为完成时形式，但在关系从句中描述将来得以脱离灾祸的人；“获救”保留被动获解救的含义，又不过度限定时间体。
- source_word: praedictis malis
  choice: 上述灾祸
  rationale: praedictis 在此可指前面已经说到或预告的事；结合上下文指先前提及的灾难，“上述”较自然，并避免误解为一般道德上的恶。
- source_word: ipse videbit
  choice: 他必看见
  rationale: 以复指代词“他”对应强调性的 ipse，保留原文主语后再复指的句法特色；“必”体现直陈将来语气。
- source_word: mirabilia mea
  choice: 我的奇事
  rationale: mirabilia 指令人惊奇的作为或奇妙之事；“奇事”简洁、庄重，并不擅自限定为神迹。
theological_decisions:
- issue: “mirabilia”是否明确译作“神迹”
  choice: 我的奇事
  alternative: 我的神迹／我的奇妙作为
  rationale: 原词范围比“神迹”更宽，可能包括上帝令人惊奇的作为或景象；采用“奇事”以保留语义开放性。
- issue: 是否保留 ipse 的复指强调
  choice: 凡……的人，他必……
  alternative: 凡……的人必……
  rationale: ipse 在复杂主语之后具有复指和强调作用；汉语虽略带古朴色彩，但仍清楚可懂，也保存了原文启示文学的突出语势。
translation_notes:
  register: 采用现代、庄重而清楚的经文语体。“凡……的人，他……”有意保留拉丁文 omnis qui … ipse 的复指结构；全节无须脚注，因为正文已直接体现该句法特色，且英文脚注“Or ‘will see’”在中文中没有相应的实质性异读。
