reference: 2 Esdras 7:46
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: beati praesentes et obseruantes quae a te constituta sunt; Sed et [de] quibus erat oratio mea, quis enim est de praesentibus, qui non peccauit, uel quis natus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/046.yaml
  text: Blessed are those who are present and keep what has been established by you. But as for those about whom my prayer was made, who indeed is there among those now present who has not sinned, or what one born has not transgressed your covenant?
translation:
  language: zh_hans
  text: 那些现今在世、遵守你所定之事的人有福了！但至于我为他们祈求的那些人——现今在世的人中，究竟有谁没有犯过罪？凡出生的人中，又有谁没有违背你的约呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文摘录止于“凡出生的人中，又有谁……”；末句“没有违背你的约”依据经审校的英语参照层补足。
    reason: 明确区分现有拉丁摘录可直接支持的内容与参照层所保存的句末，避免把缺失部分误称为当前可见的拉丁文本。
lexical_decisions:
- source_word: beati
  choice: 有福了
  rationale: 采用现代汉语圣经语体中自然而庄重的表达，保留宣告福分的含义。
- source_word: praesentes
  choice: 现今在世的人
  rationale: 此处不是单纯指空间上的“在场”，上下文讨论活着并守命的人；译法也保留“当前存在”的时间意味。
- source_word: obseruantes
  choice: 遵守
  rationale: 准确表达持续留意并实行所规定之事。
- source_word: quae a te constituta sunt
  choice: 你所定之事
  rationale: 保留拉丁文较宽泛的表达，不擅自具体化为某一套律法、诫命或礼仪。
- source_word: de quibus erat oratio mea
  choice: 我为他们祈求的那些人
  rationale: oratio 在此可指言说或祷告；结合英语审校层及上下文，译作“祈求”，并用“为他们”自然表达 de quibus。
- source_word: peccauit
  choice: 犯过罪
  rationale: 使用通行而清楚的神学词汇，并以“过”呈现无人能声称从未犯罪的反问语气。
- source_word: quis natus
  choice: 凡出生的人中，又有谁
  rationale: 保留原文对一切生而为人的人的概括，不把它缩限为成年男性。
theological_decisions:
- issue: 守神所定之事者有福，与无人未曾犯罪之间的张力
  choice: 并列保留两项陈述，不加解释调和
  alternative: 将前句弱化为理想状况，或把后句限定为某一群人
  rationale: 原文先宣告遵守者有福，随即以反问强调普遍犯罪；译文应保存这一张力。
- issue: “违背你的约”的对象范围
  choice: 采用“你的约”，不指明某一特定圣约
  alternative: 译为“你的律法”或明确指定摩西之约
  rationale: 英语审校层作 covenant，而提供的拉丁摘录在 natus 后截断；不应额外加入宗派性或历史性限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“那些现今在世、遵守……”避免生硬直译“在场者”；两个反问句保持原文的修辞力度。“你所定之事”有意保持概括性，不擅自释为“律法”或“诫命”。
