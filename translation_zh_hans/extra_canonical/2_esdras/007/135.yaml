  text: et munificus, quoniam quidem donare vult pro exigere,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/135.yaml
  text: and generous, because indeed he is willing to give rather than demand,
translation:
  language: zh_hans
  text: 又慷慨，因为他确实愿意赐予，而不愿索取；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: munificus
  choice: 慷慨
  rationale: 准确表达乐于施予的品格，现代汉语自然庄重，也与下文“愿意赐予”相呼应。
- source_word: quoniam quidem
  choice: 因为他确实
  rationale: “因为”表达原因关系，“确实”体现 quidem 的强调语气。
- source_word: donare
  choice: 赐予
  rationale: 保留“给予、赠予”的意义；在论及上帝的语境中，“赐予”比普通的“给予”更庄重自然。
- source_word: pro exigere
  choice: 而不愿索取
  rationale: 按“宁愿赐予而非索取”的对比理解；补出第二个“愿”使汉语顺畅，但不增加实质含义。“索取”保留 exigere 所含要求交付、追讨之意。
theological_decisions:
- issue: 赐予与索取的对比是否应具体化为恩典、债务或审判
  choice: 保持概括性的“赐予”与“索取”
  alternative: 译作“施恩而不追讨”或“赐下恩典而不要求偿还”
  rationale: 拉丁文本本身未明说恩典、债务、偿还或审判；不作神学上的具体化，以保留原文的开放性。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。以“又”承接本节列举式上下文；句末用分号，显示这可能是较长句子中的并列分句。
