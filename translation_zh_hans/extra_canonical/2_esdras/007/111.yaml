  text: Si ergo modo, quando corruptibile increvit et iniustitia multiplicata est, exoraverunt iusti pro impiis quare et tunc sic non erit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/111.yaml
  text: If then now[a], when corruption has increased and unrighteousness has multiplied, the righteous prayed for the ungodly, why will it not also be so then?”
translation:
  language: zh_hans
  text: “那么，如果如今，在朽坏[a]加剧、不义越发增多的时候，义人曾为不敬虔的人祈求，为什么到那时也不会如此呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朽坏”也可理解为“腐败”或“可朽坏的状态”。
    reason: 拉丁文 corruptibile 为中性名词化形式，具体所指存在词义范围上的含混。
lexical_decisions:
- source_word: corruptibile
  choice: 朽坏
  rationale: 拉丁文为中性形容词名词化，可指“可朽坏之物、朽坏的状态”或概括性的“腐败”。“朽坏”保留其范围，不把含义缩限为道德败坏。
- source_word: iniustitia
  choice: 不义
  rationale: 既可涵盖不公正，也保留其伦理和神学层面的含义。
- source_word: exoraverunt
  choice: 祈求
  rationale: 该词有恳切请求之意；与 pro impiis 连用时，“为……祈求”自然表达替他人代求，同时不额外规定代求的具体形式。
- source_word: impiis
  choice: 不敬虔的人
  rationale: 保留 impius 相对于敬虔和对神忠诚的宗教伦理含义，不弱化为一般的“坏人”。
- source_word: et tunc
  choice: 到那时……也
  rationale: 明确呈现 et 的添加、类比作用：既然如今如此，到那时为何不能也如此。
theological_decisions:
- issue: 义人届时是否能够为不敬虔者代求
  choice: 保留说话者的反问，不将其改写成肯定或否定的教义陈述
  alternative: 直接断言末后仍可代求，或断言绝不可代求
  rationale: 原文只提出反问；其答案和相关神学张力应由上下文展开。
- issue: corruptibile 所指为何
  choice: 正文采用较宽泛的“朽坏”，并以脚注说明词义范围
  alternative: 明确译作“道德败坏”或“必朽坏的世界”
  rationale: 拉丁文本本身没有明确限定其所指，译文不宜擅自缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留条件句和反问结构；用“到那时……也”清楚传达原文 et 的添加意味。
