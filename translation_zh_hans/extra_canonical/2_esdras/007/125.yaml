  text: Et quoniam super stellas fulgebunt facies eorum qui abstinentiam habuerunt, nostrae vero facies super tenebras nigrae?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/125.yaml
  text: And because the faces of those who practiced self-control will shine above the stars[a], but our faces will be blacker than darkness?
translation:
  language: zh_hans
  text: 又因那些曾实行节制的人，他们的面容将比星辰更明亮，而我们的面容却要比黑暗更黑吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: 因为
  rationale: 按通常因果义翻译，并保留本句承接上文、构成疑问的句法。
- source_word: abstinentiam habuerunt
  choice: 曾经节制自己
  rationale: abstinentia 可指克制、节制或禁欲；采用现代读者易懂且不过度限定为特定宗教苦修的表达。
- source_word: super stellas fulgebunt
  choice: 将比星辰更加明亮
  rationale: 结合与后半句 super tenebras nigrae 的平行结构，将 super 理解为比较用法，而非空间上的“在星辰之上”。
- source_word: super tenebras nigrae
  choice: 比黑暗更加乌黑
  rationale: 保留原文强化性的悖论式比较及其与前半句的对称。
theological_decisions:
- issue: abstinentia 是否特指禁欲修行
  choice: 节制自己
  alternative: 实行禁欲
  rationale: 原词语义较宽；译为“节制自己”可保留道德克制之义，而不导入特定教派的禁欲制度。
- issue: super stellas 是空间义还是比较义
  choice: 比星辰更加明亮
  alternative: 在星辰之上发光
  rationale: 同句后半的 super tenebras nigrae 明显形成比较性平行，因此前半也按比较结构处理更连贯。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留原文的反问形式、未来时指向和明暗对照。
