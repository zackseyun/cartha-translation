base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/126.yaml
  text: For while we lived and committed iniquity[a], we did not consider what we would begin to suffer after death.”
translation:
  language: zh_hans
  text: 因为我们活着时作恶，并没有想过死后将开始遭受什么。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死后将不得不遭受什么”。拉丁文的动词带有“开始”的意思。
    reason: 说明既有的非起始性译法，同时简明交代本译文保留拉丁文 incipere 起始义的依据。
lexical_decisions:
- source_word: iniquitatem faciebamus
  choice: 作恶
  rationale: 直译为“行不义”也可，但“作恶”在现代汉语中更自然，并保留持续从事不义之事的含义。
- source_word: viventes
  choice: 活着的时候
  rationale: 按拉丁文作时间性表达，与后面的“死后”形成清楚对照。
- source_word: incipiemus … pati
  choice: 会开始遭受
  rationale: 保留 incipere 的起始体意义，明确表达死后苦难的开始，而不改写成义务或必然性的“不得不遭受”。
- source_word: quid
  choice: 什么
  rationale: 保留所受之事或苦难内容未明说的开放性，不擅自具体化为“刑罚”。
theological_decisions:
- issue: 死后受苦的起始性与必然性
  choice: 会开始遭受
  alternative: 将不得不遭受
  rationale: 传世拉丁文本虽然有连写或讹误，但所反映的动词是表示“开始”的 incipere；译文因此保留起始含义，不把它解释为义务或命定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作恶”比“行不义”更通顺；“会开始遭受什么”保留原文语义与其对死后状态起始时刻的强调。句末保留引语结束标点，以衔接上下文。
