  text: 'The fifth way: they see the dwelling place of the others guarded by angels[a]'
translation:
  language: zh_hans
  text: 第五种情形：他们看见其他人的居所由天使守护着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinta uia
  choice: 第五种情形
  rationale: 字面为“第五条路”，但上下文是在列举亡灵所经历的不同情形；译作“第五种情形”更符合现代汉语，同时保留序列结构。
- source_word: aliorum habitaculum
  choice: 其他人的居所
  rationale: habitaculum 是单数，故译为单数“居所”；aliorum 保持为未进一步界定的“其他人”，不在正文中擅自明确其身份。
- source_word: ab angelis conseruari
  choice: 由天使守护着
  rationale: 这是依附于 uidentes 的被动不定式结构；conseruari 在此表示被看守、保守，译为“守护着”自然且不额外引入方式或程度。
theological_decisions:
- issue: “其他人”的身份
  choice: 保留为“其他人”
  alternative: 译作“义人”或“其余的人”
  rationale: 本句拉丁文仅作 aliorum，并未明说这些人的神学身份；为保存原文含混性，不根据上下文推定为“义人”。
- issue: 居所的数
  choice: 采用单数“居所”
  alternative: 复数“住处”
  rationale: 拉丁文 habitaculum 明确为单数；不沿用缺乏本句语法依据的复数读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第五种情形”避免将 uia 生硬直译为“道路”；句式简洁，未加入源文没有的“在极大的寂静中”等内容。
