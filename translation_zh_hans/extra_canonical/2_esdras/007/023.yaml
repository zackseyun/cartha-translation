source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et proposuerunt sibi circumventiones delictorum. et superdixeruntAltissimum non esse, et vias eius non cognoverunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/023.yaml
  text: and set before themselves schemes of sins, and even said that the Most High does not exist, and they did not know his ways.
translation:
  language: zh_hans
  text: 他们为自己设下犯罪的诡计，甚至说至高者并不存在，也不认识他的道路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: proposuerunt sibi
  choice: 为自己设下
  rationale: 保留“摆在自己面前、为自己谋划”的反身意味，同时使现代汉语自然。
- source_word: circumventiones delictorum
  choice: 犯罪的诡计
  rationale: circumventiones 有诡计、欺骗性谋划之意；delictorum 表示过犯或罪行，译为“犯罪的”简洁而不弱化道德含义。
- source_word: superdixerunt
  choice: 甚至说
  rationale: 此处表示在先前恶行之上又加上一项言论，“甚至说”自然呈现递进关系。
- source_word: Altissimum
  choice: 至高者
  rationale: 采用尊称形式，保留拉丁文指向上帝的称号及其庄重语体。
- source_word: vias eius
  choice: 他的道路
  rationale: 保留圣经常见的“道路”隐喻，可兼指上帝的行事方式、旨意和生活规范，不将含义窄化。
theological_decisions:
- issue: non esse 的存在论表述
  choice: 至高者并不存在
  alternative: 没有至高者
  rationale: 原文直接否认 Altissimum 的存在；“并不存在”准确保留其明确的存在论否定，不改写为较含混的“不承认至高者”。
- issue: non cognoverunt 的认知或关系含义
  choice: 不认识他的道路
  alternative: 不了解他的道路
  rationale: “认识”既可表达认知，也可保留圣经语境中实践与关系层面的张力；不擅自解释为单纯无知或故意拒绝。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文；句式保留原文三项递进结构，并以“甚至”凸显第二项的加重语气。
