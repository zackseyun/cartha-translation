  text: First[a], they see with great joy the glory of him who receives them.
translation:
  language: zh_hans
  text: 首先[a]，他们满怀极大的喜乐，看见接纳他们的那一位的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 先前有译本在本节末加：“因为他们将在七个等次中安息。”所据拉丁文本将这句话列在第92节。
    reason: 说明旧有译法及本版按拉丁底本划分经节的依据。
lexical_decisions:
- source_word: Imprimis
  choice: 首先
  rationale: 准确表达次序的开端，并与随后各项形成自然衔接。
- source_word: cum exultatione multa
  choice: 满怀极大的喜乐
  rationale: 保留 exultatio 所表达的强烈欢欣，也符合现代汉语的自然表达。
- source_word: gloriam eius qui suscipit eas
  choice: 接纳他们的那一位的荣耀
  rationale: 忠实保留关系结构与指称方式，不擅自把“那一位”明确为某个称号；eas 在上下文中指复数灵魂，汉语依语境译作“他们”。
theological_decisions:
- issue: “接纳他们的那一位”的身份
  choice: 保留间接指称，不增译为“上帝”或“主”
  alternative: 那接纳他们的上帝／主的荣耀
  rationale: 拉丁文仅用 eius qui suscipit eas，并未在本句中直接给出称号；保留原文指称可避免消除其语境性。
- issue: “因为他们将在七个等次中安息”一句的经节归属
  choice: 不纳入第91节正文
  alternative: 接在本节末尾
  rationale: 所提供的拉丁文第91节止于 suscipit eas；该句在底本分节中属于第92节。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“满怀极大的喜乐”传达强烈欢欣；“接纳他们的那一位”保留原文的神学指称张力。
