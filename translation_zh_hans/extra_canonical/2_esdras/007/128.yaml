  text: ut si victus fuerit patiatur quod dixisti, si autem vicerit recipiet quod dico,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/128.yaml
  text: if he is defeated, he will suffer what you have said; but if he conquers, he will receive what I say.
translation:
  language: zh_hans
  text: 如果他被击败，就要承受你所说的；但如果他得胜，就会领受我所说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: victus fuerit
  choice: 被击败
  rationale: 准确表达完成被动式所设想的失败结果，并与后句主动的“得胜”形成鲜明对照。
- source_word: patiatur
  choice: 就要承受
  rationale: 保留拉丁文“遭受、承受”的含义；在此语境中比单用“受苦”更自然，也不擅自补出所承受之事的具体内容。
- source_word: quod dixisti
  choice: 你所说的
  rationale: 直译关系结构，保留所指内容由上下文确定的开放性。
- source_word: vicerit
  choice: 得胜
  rationale: 表达完成主动式的胜利结果，并采用庄重而通行的圣经语体。
- source_word: recipiet
  choice: 就会领受
  rationale: 传达“接受、获得”之意；“领受”语体庄重自然，同时不额外规定所领受之物的性质。
- source_word: quod dico
  choice: 我所说的
  rationale: 保留现在时及其与“你所说的”的平行对照，不将其改释为应许、奖赏或判决。
theological_decisions:
- issue: 失败后所承受与得胜后所领受之内容均未明说
  choice: 保留“你所说的／我所说的”这一指代结构
  alternative: 依据上下文明确补出惩罚、生命或奖赏等内容
  rationale: 原文刻意依赖上下文，明确补足会消除其真实的语义开放性，并可能引入解释性或宗派性判断。
- issue: 条件句的语气与结果
  choice: 译为“如果……就要／就会……”
  alternative: 译为“即使……也……”或确定发生的陈述
  rationale: 忠实呈现 si 引导的两项条件及相应结果，不把假设关系改成让步或既成事实。
translation_notes:
  register: 采用现代、简洁而庄重的普通话；通过“被击败／得胜”和“你所说的／我所说的”保留原文的对称结构。无需脚注。
