  yaml_path: translation/extra_canonical/2_esdras/007/101.yaml
  text: And he said[a], “For seven days they will have freedom, so that they may see the things that were foretold.”
translation:
  language: zh_hans
  text: 他说：“他们将有七天的自由，好让他们看见那些预先所说的事。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据拉丁文中，“预先所说的”这一短语的名词在下一节才补足。某些较长的译文传统还在此后加上：“此后他们将被聚集到自己的住处。”
    reason: 说明本节末尾短语跨入下一节，并区分未载于所给本节拉丁文本的较长传统内容。
lexical_decisions:
- source_word: Et dixit
  choice: 他回答说
  rationale: 拉丁文直译为“他就说”；结合前文问答语境，用“回答说”在现代汉语中自然，同时不增添原文没有的“对我”。
- source_word: septem diebus erit libertas earum
  choice: 它们将有七天的自由
  rationale: 保留 libertas 的核心意义“自由”，并按自然汉语表达七天这一时段；earum 为阴性复数代词，因本节截句未明示所指，译作中性的“它们”以保留指代含混。
- source_word: ut uideant
  choice: 好让它们看见
  rationale: 表达目的从句；复数动词的主语承接 earum 所指群体。
- source_word: qui praedicti
  choice: 那些预先说过的事
  rationale: 所给拉丁文本在此处是不完整的跨节短语，结合审校资料所指出的后续 sermones，praedicti 表示“预先说过／预告过”；中文用“事”自然承接“看见”，但以脚注说明文本跨入下一节。
theological_decisions:
- issue: “自由”所指对象及性质
  choice: 按原文保留“它们”和“自由”的宽泛表达
  alternative: 明确译为“灵魂将获得自由”或解释为某种特定的死后状态
  rationale: 本节所给片段仅有阴性复数代词 earum，并未在本句内重述先行词；不应借神学体系补明对象或自由的性质。
- issue: 预先说过之内容
  choice: 译为“那些预先说过的事”
  alternative: 译为“你所听见的事”或“对你所说的事”
  rationale: praedicti 是被动意义，不明确限定为对以斯拉本人所说，因此避免将受话对象具体化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“它们”刻意保留拉丁文代词在本节内指代不明的特点；不补入“对我”，也不把下一节材料并入正文。
