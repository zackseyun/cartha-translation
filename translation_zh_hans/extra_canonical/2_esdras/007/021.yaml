  source_fidelity: 译文总体准确传达了主的吩咐、行为与生命的关联，以及遵守与不受惩罚的关联；“活”也恰当地保留了viverent的开放性。惟“那些来到的人：他们来到时”的冒号使原文刻意的重复在汉语中显得断裂，且“来到的人”不如“前来的人”自然。
  naturalness: 建议改用“那些前来的人，当他们前来时”，既保留venientibus ... quando venerunt的重复，也形成可读、庄重的现代汉语。将“该做什么”调整为“要做什么”，更适合承接“主吩咐”的内容。
