  text: mandans enim mandavit Dominus venientibus quando venerunt, quid facientes viverent, et quid observantes non punirentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/021.yaml
  text: For the Lord indeed commanded those who came, when they came, what they should do to live, and what they should observe so as not to be punished.
translation:
  language: zh_hans
  text: 因为主确实吩咐那些前来的人，当他们前来时，要做什么才得以活着，又要遵守什么才不受惩罚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mandans enim mandavit
  choice: 因为主确实吩咐了
  rationale: 保留 enim 的承接或解释语气，并以“确实”体现同源动词重复所带的强调，避免译成“严厉吩咐”而加入原文没有的强度含义。
- source_word: venientibus quando venerunt
  choice: 那些来到的人：他们来到时
  rationale: 保留分词与限定时间从句的重复表达；用冒号使现代汉语句法清楚，而不消除原文的重复。
- source_word: quid facientes viverent
  choice: 该做什么才可以活
  rationale: “做什么”对应 facientes，“才可以活”表达其结果或目的关系，同时保留“活”可能涉及生命、存活或得生命的语义张力。
- source_word: quid observantes non punirentur
  choice: 该遵守什么才不受惩罚
  rationale: 以“遵守”对应 observantes，以“不受惩罚”准确表达被动式 non punirentur，不额外指定所遵守的是律法、诫命或礼仪。
theological_decisions:
- issue: “活”的含义
  choice: 直译为“活”
  alternative: “得生命”或“存活”
  rationale: 拉丁文 viverent 本身未明确区分今世存活、末世生命或属灵生命；直译保留上下文可决定的歧义。
- issue: 行为、遵守与免受惩罚之间的关系
  choice: 保留“做什么才可以活……遵守什么才不受惩罚”的条件或结果结构
  alternative: 解释为凭行为得救，或解释为单纯的盟约生活准则
  rationale: 原文陈述行为及遵守与生命、免罚之间的关联，却未在本句系统说明其神学机制，因此不作宗派化展开。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“该……才……”清楚传达间接问句和结果关系；保留“来到”的重复，以尽量反映拉丁文本的修辞结构。
