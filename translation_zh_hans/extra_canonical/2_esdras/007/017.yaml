  yaml_path: translation/extra_canonical/2_esdras/007/017.yaml
  text: Then I answered and said[a], “O sovereign Lord, behold, you have ordained in your law that the righteous will inherit these things[b], but the ungodly will perish.
translation:
  language: zh_hans
  text: 我回答说：“掌权的主啊，看哪，你已经在你的律法中规定，义人必承受这一切，不敬虔的人却必灭亡。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: 至高的主啊
  rationale: 这是双重呼格式的庄严称谓，表达主的至高权柄；译成自然的现代汉语称呼，避免处理成描述性从句。
- source_word: ecce
  choice: 看哪
  rationale: 保留原文引人注意并加强论述语气的标记。
- source_word: disposuisti
  choice: 已经……规定
  rationale: 在律法语境中表示制定、确立；“规定”准确且自然。
- source_word: iusti hereditabunt haec
  choice: 义人必承受这一切
  rationale: 保留“承受产业”一词的继承含义，并以“这一切”对应复数中性的 haec。
- source_word: impii
  choice: 不敬虔的人
  rationale: 表达对上帝缺乏敬畏、悖逆上帝之意，不仅指一般道德上的坏人。
- source_word: peribunt
  choice: 必灭亡
  rationale: 直接保留与义人承受产业相对的终局性表述。
theological_decisions:
- issue: 义人与不敬虔者的结局对照
  choice: 义人必承受这一切，不敬虔的人却必灭亡
  alternative: 义人会继承这些，恶人则会消失
  rationale: 保留原文鲜明的末世性对照与“灭亡”的力度，不弱化或额外解释其具体性质。
- issue: dominator domine 的称谓
  choice: 至高的主啊
  alternative: 掌权的主啊
  rationale: 按正式的主权称号处理，同时避免译为解释性的关系从句；不引入特定宗派术语。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“看哪”保留启示文学对话中的修辞强调；句式尽量贴近拉丁文的论证结构，同时保持自然可读。
