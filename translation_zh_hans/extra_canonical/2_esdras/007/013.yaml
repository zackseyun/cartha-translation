  yaml_path: translation/extra_canonical/2_esdras/007/013.yaml
  text: For the entrances of the greater age are broad and secure[a], and they produce the fruit of immortality.
translation:
  language: zh_hans
  text: 因为通往那更大时代[a]的入口都宽阔而安全，并带来不朽的果实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有古译本作“将来时代的入口”。这可能反映较早的原文读法。
    reason: 保存跨语种文本见证中“将来的”与拉丁底本“更大的”之间的重要异文，并将标记置于相关词语之后。
lexical_decisions:
- source_word: nam
  choice: 因为
  rationale: 作解释性连接词，承接上文说明缘由；不译为表示转折的“但是”。
- source_word: maioris saeculi
  choice: 那更大世代的
  rationale: 依所给拉丁文本直译 maioris 为“更大”，saeculi 在本段末世语境中译为“世代”；其他古译本可能支持“将来世代”，故以脚注说明。
- source_word: introitus
  choice: 入口
  rationale: 保留原文复数所表达的进入之处；汉语采用集合性单数“入口”较自然。
- source_word: spatiosi et securi
  choice: 宽阔而安稳
  rationale: 分别传达 spatiosi 的宽广和 securi 的安全、无险之意。
- source_word: facientes inmortalitatis fructum
  choice: 结出不朽的果实
  rationale: 以自然汉语表达“产生果实”，同时保留“不朽的果实”这一意象。
theological_decisions:
- issue: maioris saeculi 是否按跨语种见证校订为“将来的世代”
  choice: 正文采用“那更大世代”
  alternative: “将来的世代”或“来世”
  rationale: 当前指定的原语言来源明确读作 maioris，正文不越过所给拉丁底本作推定校改；但“将来的世代”可能反映更早文本及本段“今世／来世”的末世对照，因此在脚注中保存这一重要异文可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安稳”比“安全”更能与道路或入口意象自然搭配；“结出果实”保留经文的形象表达。
