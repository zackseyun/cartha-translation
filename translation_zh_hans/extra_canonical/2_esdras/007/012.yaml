source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et facti sunt introitus huius saeculi angusti et dolentes et laboriosi, paucae autem et malae et periculorum plenae et laborum magnorum fultae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/012.yaml
  text: And the entrances of this age became narrow and painful and laborious[a], few and evil, full of dangers and burdened with great hardships.
translation:
  language: zh_hans
  text: 于是，今世的入口变得狭窄，令人痛苦而费力[a]；它们又少又险恶，充满危险，并被重重劳苦所压。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令人痛苦”或译“令人忧苦”。
    reason: dolentes 可指造成疼痛、痛苦，也可带有忧伤、忧苦的色彩；脚注保留其语义幅度。
lexical_decisions:
- source_word: introitus huius saeculi
  choice: 今世的入口
  rationale: 直译核心意象，保留通往或进入“今世”的入口这一表述，不擅自改成道路。
- source_word: angusti
  choice: 狭窄
  rationale: 准确对应拉丁文形容词，并保留入口受限的空间意象。
- source_word: dolentes
  choice: 痛苦
  rationale: 在修饰无生命的“入口”时，表达使人感到疼痛或痛苦之意；同时保留其也可涉及忧苦的语义余地。
- source_word: laboriosi
  choice: 艰难
  rationale: 在此语境中指进入过程费力、艰辛；译为“艰难”符合现代汉语搭配。
- source_word: paucae autem et malae
  choice: 又少又险恶
  rationale: paucae 表数量少；malae 若仅译“坏”较生硬，“险恶”既自然，也与后文危险相衔接，但不消除其广义的恶劣含义。
- source_word: periculorum plenae
  choice: 充满危险
  rationale: 按拉丁文属格结构自然转述。
- source_word: laborum magnorum fultae
  choice: 承受着重重劳苦
  rationale: fultae 通常有支撑、托住之义，但此处与重大劳苦连用，语义近于由其压持或负载；采用“承受着”避免不自然的“由劳苦支撑”。
theological_decisions:
- issue: “今世的入口”所指对象
  choice: 保留原文的入口意象，不解释为得救之路、来世之路或人生道路
  alternative: 将其意译为“今世的道路”或赋予特定救恩论含义
  rationale: 本节拉丁文只说 introitus huius saeculi；上下文的神学张力应由经文本身呈现，不在译文中预先定论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留排比节奏：“狭窄、痛苦而艰难”“又少又险恶”“充满危险”“承受着重重劳苦”。脚注标记已在正文中对应出现。
