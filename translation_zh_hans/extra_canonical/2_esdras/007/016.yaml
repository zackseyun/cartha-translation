source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quare non accepisti in corde tuo quod futurum, sed quod in praesenti?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/016.yaml
  text: And why have you not taken to heart what is to come, rather than what is present?”
translation:
  language: zh_hans
  text: 你为什么不把将来的事放在心上，反倒把现今的事放在心上呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: accepisti in corde tuo
  choice: 放在心上
  rationale: 这一拉丁表达直译为“接纳在心里”，在现代汉语中“放在心上”自然、清楚，也保留认真思量和关注之意。
- source_word: quod futurum
  choice: 将来的事
  rationale: 保留原文中性而宽泛的指向，不擅自限定为来世、审判或某一特定事件。
- source_word: quod in praesenti
  choice: 现今的事
  rationale: 对应“当下存在之事”，与“将来的事”形成简明对照。
- source_word: sed
  choice: 反倒
  rationale: 在否定疑问句中自然表达原文的转折和对比，比单用“而”更清楚。
theological_decisions:
- issue: “将来的事”的具体所指
  choice: 维持宽泛表述“将来的事”
  alternative: 译作“来世的事”或“未来的审判”
  rationale: 本节拉丁文本没有明确限定其所指；保留歧义可避免加入经文本身未明说的末世论解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“将来的事／现今的事”呈现原文的平行对比，不添加解释性术语。
