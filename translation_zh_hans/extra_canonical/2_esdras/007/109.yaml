  source_fidelity: 拉丁文保留了两个由 pro 引出的代求对象：“那些得雨的人”与“那死者”；ut viveret 是指向死者的目的从句。译文应保留这两个对象及“使其得生”的目的，不将其术语化为“复活”。
  naturalness: “那死人”在现代汉语中较生硬，且可带口语或贬抑色彩；“那死者”较庄重自然。以“好叫”表达 ut 的目的关系，也比“使”更少暗示以利亚本人直接施行使人复生的动作。
  terminology: “以利亚”是通行译名。“得雨”适合庄重经文语体，并忠实反映 pluviam acceperunt。保留“祈求”作为本段上下文中 pro 短语所省略的动作。
