  yaml_path: translation/extra_canonical/2_esdras/007/109.yaml
  text: and Elijah for those who received rain and for the dead man, that he might live,
translation:
  language: zh_hans
  text: 以利亚也为那些得雨的人祈求，也为那死者祈求，好叫他活过来，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Helias
  choice: 以利亚
  rationale: 采用该圣经人物在现代简体中文中的通行译名。
- source_word: pro his qui pluviam acceperunt
  choice: 为那些得到雨水的人祈求
  rationale: pro 在本段列举代求者的语境中表示“为……祈求”；将语境隐含的动作补出，使中文句意完整。acceperunt 保留“得到”的领受意味。
- source_word: pro mortuo
  choice: 为那死人祈求
  rationale: mortuo 为单数，指以利亚相关叙事中那个死去的人；用“那死人”保留指称的具体性。
- source_word: ut viveret
  choice: 使他活过来
  rationale: 目的从句表达让死者重新得生；“活过来”比单纯“活着”更准确地传达此处从死亡中恢复生命的语境。
theological_decisions:
- issue: 是否把经文改写为明确的“复活”术语
  choice: 使他活过来
  alternative: 使他复活
  rationale: 拉丁文仅用 viveret（使他活／得生），没有使用专门表示复活的名词或动词；当前译法既符合叙事情境，也避免强化原文未明说的术语。
- issue: 是否明确补出以利亚“祈求”
  choice: 两处补出“祈求”
  alternative: 直译为“以利亚也为那些得到雨水的人，又为那死人”
  rationale: 本节是省略谓语的并列列举，pro 表示代求对象；现代汉语若不补出谓语会成为残句。补出“祈求”依据上下文恢复省略成分，不额外引入教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留本节与上下文相连的句末逗号；以“也……又……”呈现拉丁文两个并列的 pro 短语。
