  text: 'But hear this about the multiplication of the ungodly: if you have very few choice stones,[a]'
translation:
  language: zh_hans
  text: 但关于不敬虔的人增多，请听这话：假如你只有极少几块精选的石头，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精选的石头”也可译为“被选出的石头”。拉丁语electos的基本意思是“被挑选的”；在此比喻中可带有品质优良的意味。
    reason: 说明electos的字面含义及其在比喻语境中的可能含义，同时避免将其正文含义限定为“珍贵”。
lexical_decisions:
- source_word: impios
  choice: 不敬虔之人
  rationale: 准确表达拉丁语所指向的悖逆、缺乏敬畏神的人，同时保持经文语体。
- source_word: multiplicari
  choice: 增多
  rationale: 采用自然的现代汉语表达其人数增加之意，不预先解释增加的原因或方式。
- source_word: Lapides electos
  choice: 上选的石头
  rationale: electos可指被挑选出来、品质上乘；“上选”既保留选择之意，也符合此处以石头贵贱作比的语境。
- source_word: paucos ualde
  choice: 极少几块
  rationale: 保留ualde对“少”的加强，并按汉语习惯为可数的石头添加量词。
theological_decisions:
- issue: “不敬虔之人增多”与后续比喻的关系
  choice: 不补充解释，只用“关于……的事”引出下文
  alternative: 译为“为什么不敬虔的人如此众多”或直接说明其神学含义
  rationale: 原文只要求听取有关其增多的话，并未在本节明说原因；保留论证尚未展开的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你要听听这话”保留直接劝告的语气；句末逗号反映本节原文在条件从句处未完，内容将在下一节继续。
