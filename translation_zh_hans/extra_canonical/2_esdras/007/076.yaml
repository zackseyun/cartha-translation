translation:
  language: zh_hans
  text: “愿那些时候来到[a]，就是你将开始更新受造界的时候；还是我们从现在起就受苦呢？”他回答我说：“这件事我也要指示你；至于你，不要与他们混在一起。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的开头承接前一句话；有些旧译因经节划分不同，将这里的一部分文字归入前一节，并将下一节关于藐视者和受苦者的话收入本节。
    reason: 说明拉丁文本传统中的经节边界差异，避免把下一节内容误并入本节。
lexical_decisions:
- source_word: ueniant tempora illa
  choice: 愿那些时候来到
  rationale: 以愿望式表达拉丁语虚拟式 veniant 在此处的祈愿或促成语气，同时保留“那些时候”的复数形式。
- source_word: creaturam renouare
  choice: 更新受造界
  rationale: creatura 可指整个被造秩序；“受造界”比单指某个“受造物”更能保留其整体性，renouare 译作“更新”。
- source_word: amodo
  choice: 从现在起
  rationale: 准确表达时间起点，不译成表示即时性的“立刻”。
- source_word: cruciamur
  choice: 受苦
  rationale: 该词可指遭受折磨或痛苦；此处采用自然且不过度限定具体方式的“受苦”。
- source_word: ostendam tibi et hoc
  choice: 这件事我也要指示你
  rationale: 保留 et hoc 的“也”以及 ostendam 的将来含义；“指示”符合庄重叙事语体。
- source_word: tu autem
  choice: 至于你
  rationale: 体现独立人称代词 tu 的强调，并以“至于”表达 autem 的转折。
- source_word: noli commisceri cum eis
  choice: 不要与他们混在一起
  rationale: 自然表达禁止式，并保留 commisceri 的混同、混杂意味及 eis 所指对象未在本节内明确的状态。
theological_decisions:
- issue: creatura 的范围
  choice: 受造界
  alternative: 受造物
  rationale: 上下文谈到末后更新，“受造界”容纳整体创造秩序的可能含义，但不进一步说明更新的具体性质。
- issue: cruciamur 所指的受苦
  choice: 受苦
  alternative: 受折磨
  rationale: 选择较宽泛的表达，以保留它可能指当前痛苦或惩罚性折磨的张力，不预先作神学判定。
- issue: “他们”的指代
  choice: 保留代词“他们”
  alternative: 补明为“那些受苦的人”或“藐视的人”
  rationale: 本节拉丁文本仅作 eis，具体所指依赖后文或上下文；不从相邻经节补入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。问句以“不然，难道……”呈现 aut 的选择或反问关系；保留“至于你”的强调和“他们”指代上的开放性。
