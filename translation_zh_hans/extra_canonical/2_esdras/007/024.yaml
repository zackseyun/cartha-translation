  naturalness: “不实行他的作为”在现代汉语中搭配不自然：人通常“实行/遵行”法令或主张，却不“实行作为”。改作“不完成他的工作”既自然，也更直接对应 opera eius non perfecerunt，同时不擅自具体化“工作”的所指。
