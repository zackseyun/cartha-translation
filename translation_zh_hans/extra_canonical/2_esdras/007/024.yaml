source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et legem eius spreverunt et sponsiones eius abnegaverunt et legitimis eius fidem non habuerunt et opera eius non perfecerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/024.yaml
  text: They despised his law and denied his promises[a], and they did not keep faith with his statutes and did not perform his works.
translation:
  language: zh_hans
  text: 他们藐视他的律法，否认他的应许[a]，不信守他的律例，也不完成他的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“否认他的承诺”。
    reason: 说明 sponsiones 指承诺、保证或应许；不采用证据较弱的“约”。
lexical_decisions:
- source_word: spreverunt
  choice: 藐视
  rationale: 准确表达主动轻蔑、弃绝之意，并保持庄重语体。
- source_word: sponsiones eius
  choice: 他的应许
  rationale: sponsio 在此指承诺、所作的保证；依该书拉丁语用法，不译作“约”。
- source_word: legitimis eius
  choice: 他的律例
  rationale: legitima 为中性复数，指上帝所规定的法令或规章；“律例”自然且适合经文语体。
- source_word: fidem non habuerunt
  choice: 不信守
  rationale: 保留 fides 所含的忠信、守信含义，且与“律例”搭配自然；避免仅译为主观上的“不相信”。
- source_word: opera eius non perfecerunt
  choice: 不实行他的作为
  rationale: 尽量保留 opera eius 的字面张力，即“他的作为/工作”；perfecerunt 在此表示付诸实行、完成。
theological_decisions:
- issue: sponsiones 是否指“应许”或“约”
  choice: 应许
  alternative: 约
  rationale: 拉丁文 sponsiones 通常指承诺或保证；本书表达“约”另有 testamentum 等用语，因此正文采用“应许”。
- issue: opera eius 是上帝自己的作为，还是人应履行的工作
  choice: 他的作为
  alternative: 他所吩咐的事
  rationale: 原文保留所有格 eius，并未明确补出“吩咐”；直译可保存其语义张力，避免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。四个并列动词短语保持原文的递进与节奏；避免古奥的“典章”等词，也不把 opera eius 解释性改写为某一特定神学概念。
