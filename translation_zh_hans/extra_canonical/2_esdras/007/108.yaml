  text: and David for the destruction[a], and Solomon for those in sanctification,
translation:
  language: zh_hans
  text: 大卫为那场毁灭祈求，所罗门为那些处于分别为圣之中的人祈求[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为那些在圣化中的人”。拉丁文“在分别为圣之中”的句法不寻常，所指不完全确定；也可能与献殿时的分别为圣有关。
    reason: 保留 qui in sanctificationem 的句法与所指歧义，同时说明献殿解释只是可能的历史语境，而非正文所能确定的意思。
lexical_decisions:
- source_word: confractione
  choice: 那次毁灭
  rationale: 该词基本义涉及打碎、破坏或毁灭；译作“毁灭”既贴近拉丁文，也避免缩窄为来源未明说的“瘟疫”。
- source_word: sanctificationem
  choice: 献殿礼
  rationale: 在所罗门的语境中，很可能指圣殿的分别为圣、奉献典礼；现代汉语用“献殿礼”可自然表达这一历史场景。
- source_word: pro
  choice: 为……祈求
  rationale: 本节上下文列举代求者；补出“祈求”使汉语句意完整，而不改变关系。
theological_decisions:
- issue: qui in sanctificationem 的句法与所指
  choice: 那些在献殿礼中的人
  alternative: 那些在成圣中的人
  rationale: 拉丁文本身表达不寻常，且可能保留底本或传抄上的含混。正文采用最符合所罗门献殿代祷背景的理解，同时以脚注保留较直译的可能。
- issue: 大卫所代求事件的具体身份
  choice: 那次毁灭
  alternative: 那场灾疫
  rationale: 不把 confractione 具体限定为灾疫，避免以叙事联想取代现存拉丁措辞。
translation_notes:
  register: 采用庄重而易懂的现代汉语；因这是连续列举中的分句，保留末尾逗号。正文补出承前省略的“祈求”，并将脚注标记置于主文中。
