  text: Tunc ergo nemo poterit misereri eius qui in iudicio victus fuerit, neque demergere eum qui vicerit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/115.yaml
  text: Therefore no one will then be able to have mercy on one who has been defeated in the judgment[a], nor to cast down one who has prevailed.
translation:
  language: zh_hans
  text: 所以到那时，没有人能怜悯那在审判中败诉的人[a]，也不能把那胜诉的人压倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被击败的人”。
    reason: 拉丁文 victus 本义较宽，可指“被击败”；但因本句明确说“在审判中”，正文采用司法语境更自然的“败诉”。
lexical_decisions:
- source_word: victus fuerit
  choice: 败诉
  rationale: 该词与“in iudicio”（在审判中）连用，语境属于司法裁决；“败诉”既传达被击败之意，也避免不合语境的军事色彩。
- source_word: vicerit
  choice: 胜诉
  rationale: 与前面的“victus fuerit”构成司法语境下的反义对应，表示在案件审判中获胜。
- source_word: demergere
  choice: 使……落败
  rationale: 本义含使下沉、压倒或拉下之意；此处承接胜诉与败诉的对照，用“使……落败”表达推翻胜诉者结果的意思，同时保留动作色彩。
- source_word: misereri
  choice: 怜悯
  rationale: 直接表达对败诉者施以怜悯，符合庄重而自然的现代汉语。
theological_decisions:
- issue: 审判结果是否可由他人改变
  choice: 保留两项绝对否定：无人能怜悯败诉者，也无人能使胜诉者落败
  alternative: 将后半句解释为无人能定罪或贬抑得胜者
  rationale: 原文以“nemo poterit”统摄两个不定式，并用败诉与胜诉形成严格平行；译文不额外解释审判主体或最终结局。
translation_notes:
  register: 采用现代、庄重且通俗的司法用语。“败诉／胜诉”清楚呈现拉丁文 victus／vicerit 的对称关系；“到那时”对应 tunc，“所以”对应 ergo。
