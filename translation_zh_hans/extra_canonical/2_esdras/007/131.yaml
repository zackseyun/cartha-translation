source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam non esset tristitia in perditione eorum, sicut et futurum est gaudium super eos quibus persuasa est salus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/131.yaml
  text: For there should be no grief over their destruction[a], just as there will be joy over those to whom salvation has been promised.”
translation:
  language: zh_hans
  text: 因为，他们的灭亡不会令人悲伤；正如对于那些已确信自己必得救的人[a]，将会有喜乐一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“那些救恩已向他们确证的人”。拉丁文 quibus persuasa est salus 的表达也可理解为“那些救恩已应许给他们的人”。
    reason: 说明被动式 persuasa est 与与格 quibus 的不寻常关系，并保留“确证”与“应许”两种可行理解，不把争议完全消解。
lexical_decisions:
- source_word: quoniam
  choice: 因为
  rationale: 按通常因果用法译出，承接上文说明理由，不误作“所以”。
- source_word: non esset tristitia
  choice: 不该……悲伤
  rationale: 用“不该”体现未完成时虚拟式 esset 的非直陈语气；汉语中补出“为……而”使表达自然。
- source_word: perditione eorum
  choice: 他们的灭亡
  rationale: perditio 在此指毁灭、灭亡；保留其严重而终局性的语义，不先行解释为特定神学概念。
- source_word: gaudium super eos
  choice: 有喜乐临到他们
  rationale: 保留 super eos 所含“在他们之上／临到他们”的空间性表达，同时避免把喜乐主体明确限定为旁观者。
- source_word: quibus persuasa est salus
  choice: 那些救恩已向他们确证的人
  rationale: 按被动结构与与格 quibus 直译其核心关系：救恩向这些人得到确证。这样比“救恩被说服”自然，也不把 persuasa est 无根据地单一化为“应许”。
theological_decisions:
- issue: 喜乐是“为这些人而有”，还是“临到这些人”
  choice: 将有喜乐临到他们
  alternative: 将为他们欢喜
  rationale: 拉丁文 super eos 可容许不同关系理解；正文采用较贴近形式且不指定欢喜者的译法，以保留歧义。
- issue: persuasa est salus 表示确证还是应许
  choice: 救恩已向他们确证
  alternative: 救恩已应许给他们
  rationale: persuadeo 的被动式配与格更直接指向“使某人确信／向某人确证”；“应许”虽合语境，却不是该动词最直接的词义，因此列入脚注作为可选理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不该……悲伤”自然传达虚拟式语气；“救恩已向他们确证”略带书面色彩，以尽量贴近拉丁文结构。脚注标记置于正文相应句末。
