lexical_decisions:
- source_word: pondera
  choice: 分量
  rationale: 保留拉丁文“重量、分量”的复数意象，同时在汉语中可表达思想所具有的权重；不把疑难文本改写成命令句。
- source_word: quæ cogitasti
  choice: 你所思量之事
  rationale: 按关系从句直译，既保留 cogitasti 的思想、考虑之意，也避免补入原文没有的具体对象。
- source_word: in te stant
  choice: 在你里面
  rationale: 原文此处可能讹损；采用贴近现存拉丁文的表达，不擅自消解其含混。
- source_word: qui habet
  choice: 那拥有……的人
  rationale: 所给拉丁文本在此中断，因此用省略号明确保留未完句式，不补写后续内容。
theological_decisions:
- issue: 疑难文本是否应解释为劝告以斯拉自行权衡
