  text: factus est de puluere, sicut et cetera creatura! Melius enim erat ipsum pulverem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/063.yaml
  text: For it would have been better if the dust itself had not come into being, so that understanding might not have come from it.
translation:
  language: zh_hans
  text: 因为，尘土本身若不曾存在，反倒更好，免得悟性从其中产生。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给拉丁文片段在“尘土本身”处中断；本句后半依照该节完整句意的校勘见证译出。
    reason: 透明说明提供的原文证据是不完整句，避免让读者误以为后半句全部直接见于所引拉丁片段。
lexical_decisions:
- source_word: pulverem
  choice: 尘土
  rationale: 保留拉丁文指向受造物质来源的具体意象，也与本节关于从尘土形成的语境相合。
- source_word: Melius enim erat
  choice: 因为……倒还更好
  rationale: 既表达 enim 的承接和解释作用，也自然传达反事实判断“本来不形成反而更好”。
- source_word: factus est
  choice: 形成／产生
  rationale: 采用适用于尘土及由尘土而出的事物的受造表达，避免用通常指生物出生的“生下来”。
- source_word: understanding（完整句意的校勘见证；所给拉丁片段未包含对应词）
  choice: 悟性
  rationale: “悟性”可指人由尘土而成后所具有的理解能力，语体庄重且不把含义过度限定为纯粹逻辑理性。
theological_decisions:
- issue: “尘土若未形成更好”所表达的反事实张力
  choice: 直译保留这一强烈判断
  alternative: 弱化为“人若未受造也许更好”
  rationale: 原文以“尘土”为主语并作反事实评价；译文不将其改写为较温和的人类学陈述，也不替作者消解其中的神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“倒还更好”保留反事实语气；“从其中产生”维持“悟性”源自尘土的意象，不额外解释为灵魂、理性或道德意识。
