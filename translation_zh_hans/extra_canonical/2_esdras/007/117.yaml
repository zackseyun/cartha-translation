id: 2ES.7.117
reference: 2 Esdras 7:117
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim prodest omnibus in praesenti vivere in tristitia et mortuos sperare punitionem?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/117.yaml
  text: For what does it profit all to live in sorrow in the present and[a], when dead, to expect punishment?
translation:
  language: zh_hans
  text: 因为，众人在今世活在忧愁中，死后又要等候惩罚，这对他们有什么益处呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnibus
  choice: 众人……对他们
  rationale: 保留“所有人、众人”的普遍范围；中文以“众人”作主语，并在问句后部用“对他们”自然表达拉丁文与格所指的受益者。
- source_word: in praesenti
  choice: 在今世
  rationale: 不仅表达“现在”，也保留本段中现今秩序与未来审判相对照的末世语境。
- source_word: vivere in tristitia
  choice: 活在忧愁中
  rationale: 贴近原文结构，同时是自然、庄重的现代汉语。
- source_word: mortuos
  choice: 死后
  rationale: 拉丁文直译为“死了的时候/作为死人”；中文“死后”简洁自然，且不额外规定死亡与惩罚之间的状态。
- source_word: sperare punitionem
  choice: 等候惩罚
  rationale: sperare 在此以惩罚为宾语，不宜译作带正面意味的“盼望”；“等候”保留对未来结果的预期。
- source_word: Quid enim prodest
  choice: 因为……有什么益处呢
  rationale: 保留 enim 与上文的论证联系，并用汉语反问句准确传达 prodest。
theological_decisions:
- issue: “in praesenti”的时代性含义
  choice: 今世
  alternative: 现在／当下
  rationale: “今世”保留现今时代与未来审判之间的张力；“现在”虽可行，却容易削弱本章的末世论对照。
- issue: 死亡与惩罚的时间关系
  choice: 死后又要等候惩罚
  alternative: 死了的时候等候惩罚
  rationale: 采用自然汉语表达先后关系，但不说明中间状态，也不判定惩罚是否立即临到。
translation_notes:
  register: 采用现代、庄重且易懂的反问句。用“今世”承载原文的末世语境；不添加原文没有的教派性解释。
