  text: O tu quid fecisti, Adam? si enim tu peccasti, non est factum solius tuus casus sed etnostrum qui ex te advenimus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/118.yaml
  text: O Adam[a], what have you done? For if you sinned, your fall was not yours alone, but also ours, we who have come from you.
translation:
  language: zh_hans
  text: 亚当啊，你究竟做了什么？因为，即使犯了罪的是你[a]，你的堕落也不只是你一人的，也同样是我们这些从你而来者的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果是你犯了罪。”拉丁文 si 既可表示条件，也可依上下文表示让步。
    reason: 保留原文 si 在条件式与让步式之间的语义可能。
lexical_decisions:
- source_word: O tu ... Adam
  choice: 亚当啊
  rationale: 用呼语“啊”传达拉丁文 O 的哀叹语气；汉语无需另译 tu，后文再体现其强调作用。
- source_word: quid fecisti
  choice: 你究竟做了什么
  rationale: “究竟”自然传达质问和悲叹的语气，同时保留“做了什么”的直接表达。
- source_word: si enim tu peccasti
  choice: 因为，即使是你犯了罪
  rationale: enim 译为“因为”；用“即使是……你”体现 tu 的强调，并按论证语境将 si 作让步理解，但以脚注保留其条件式可能。
- source_word: casus
  choice: 堕落
  rationale: 在亚当犯罪的语境中指其败落或坠落；“堕落”是现代汉语中自然且能保留神学关联的表达。
- source_word: qui ex te advenimus
  choice: 我们这些从你而来之人
  rationale: 贴近关系从句，表达后世人类源出亚当，不额外限定具体的生育或遗传机制。
theological_decisions:
- issue: 亚当犯罪与后世之人的关系
  choice: “你的堕落……也是我们这些从你而来之人的”
  alternative: “你的罪责也归到我们身上”
  rationale: 原文说 casus（堕落、败落）是“我们的”，并未明确说罪责如何归算；因此不引入特定的原罪归算理论。
- issue: si 的条件或让步含义
  choice: 正文采用让步式“即使是你犯了罪”，脚注保留条件式
  alternative: “如果是你犯了罪”
  rationale: 上下文并非明显怀疑亚当是否犯罪，且 tu 带有对比强调；但 si 本身容许条件式理解，故不应完全抹去这一歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“亚当啊”保留哀叹呼语，“究竟”加强原句的悲痛质问；结句避免生硬重复“也是我们的，我们……”，改用“也是我们这些……之人的”，同时维持原文由亚当个人转向其后裔群体的结构。
