  text: But judgment alone will remain, and truth will stand, and faith will grow strong.
translation:
  language: zh_hans
  text: 但唯有审判将存留；真理将屹立，信心将日益刚强。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicium
  choice: 审判
  rationale: 保留司法与末世裁决的语义，符合上下文的庄重语域。
- source_word: solum remanebit
  choice: 唯有……将存留
  rationale: 准确表达 solum 的排他意味和 remanebit 的将来持续状态。
- source_word: veritas stabit
  choice: 真理将屹立
  rationale: 保留 stabit“站立、坚定不倒”的形象，同时使现代汉语自然有力。
- source_word: fides convalescet
  choice: 信实将坚固
  rationale: fides 可指信心、信仰或信实；这里不强行限定为人的主观信心。convalescet 表示变得强健、稳固，译为“将坚固”保留其动态意味。
theological_decisions:
- issue: fides 的所指
  choice: 信实
  alternative: 信心将刚强／信仰将兴盛
  rationale: 拉丁词本身存在语义幅度，句中又与“真理”并列；采用“信实”可保留客观真实性与可靠性的可能含义，避免擅自限定为个人心理状态或制度化宗教。
translation_notes:
  register: 采用简洁、庄重而现代的标准普通话；以分号体现两个并列分句的节奏和递进关系。
