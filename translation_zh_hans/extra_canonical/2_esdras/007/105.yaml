revisions:
- from: 或最亲爱的朋友，也不能使他替自己明白，或替自己睡觉、吃饭、得医治；同样，绝不会有人为别人祈求，因为到那时，所有人都要各自担当自己的不义之事或义行。”
  to: 或最亲爱的朋友，也不能代替他明白、睡觉、吃饭或得医治；因此，绝不会有人为别人祈求，因为到那时，所有人都要各自担当自己的不义之事或义行。”
  rationale: 修订仅澄清代行关系并调整连接词，使之更符合拉丁文 eo 与 Sic 的功能；其余保留草稿对个人责任、代求及“担当不义或义行”这一未加解释的措辞。
