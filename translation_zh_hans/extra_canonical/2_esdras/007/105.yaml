  yaml_path: translation/extra_canonical/2_esdras/007/105.yaml
  text: or a friend who is most dear[a], that he may understand, or sleep, or eat, or be healed for him; so no one will ever pray for another, for all will then bear, each one, his own unrighteousnesses or righteousnesses.”
translation:
  language: zh_hans
  text: 或最亲爱的朋友，也不能代替他明白、睡觉、吃饭或得医治；因此，绝不会有人为别人祈求，因为到那时，所有人都要各自担当自己的不义之事或义行。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eo intellegat, aut dormiat, aut manducet, aut curetur
  choice: 使他替自己明白，或替自己睡觉、吃饭、得医治
  rationale: 拉丁文在此承接上文，以一连串不能由他人代行的行为说明个人责任；中文补出“替自己”以自然表达这种代理关系，同时保留“明白、睡觉、吃饭、得医治”的并列结构。
- source_word: Sic
  choice: 同样
  rationale: 表示由前述日常行为的不可替代性推及祈求，不译成带强因果色彩的连接词。
- source_word: nunquam nemo pro aliquo rogabit
  choice: 绝不会有人为别人祈求
  rationale: 拉丁文双重否定在此加强否定语气；“为别人祈求”保留 pro aliquo rogabit 的代求含义。
- source_word: omnes ... unusquisque
  choice: 所有人都要各自
  rationale: 同时体现 omnes 的普遍性和 unusquisque 的逐一、个体性。
- source_word: iniustitias suas aut iustitias
  choice: 自己的不义之事或义行
  rationale: 保留复数所指的具体行为及“不义／义”的对称，不将其抽象化为单纯的身份或结局。
theological_decisions:
- issue: 末后审判中代求与个人责任的关系
  choice: 保留“绝不会有人为别人祈求”以及人人各自担当的绝对表述
  alternative: 弱化为他人的代求不能改变审判结果
  rationale: 原文直接否定届时一人为另一人祈求，并以个人担当自己的不义或义作为理由；译文不另行调和其与其他代求传统之间的张力。
- issue: 担当“义行”的含义
  choice: 直译为“担当自己的不义之事或义行”
  alternative: 解释为接受各自行善或作恶的报应
  rationale: 原文 portabunt 可表达承担、背负，但未明确说是行为本身还是其后果，故不在正文中补入“报应”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。经文从上文中途接入，因此保留起首的“或”；以“替自己”清楚表达他人不能代替当事人完成这些行为。末句保持普遍而个别的审判语气。
