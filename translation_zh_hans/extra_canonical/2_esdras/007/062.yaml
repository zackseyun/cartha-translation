  text: 'feruerunt et extincti sunt. Et respondit et dixi: O tu terra, quid peperisti, si sensus'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/062.yaml
  text: And I answered and said, “O earth, what have you brought forth, if understanding has been made from dust, like the rest of creation?
translation:
  language: zh_hans
  text: 我回答说：“大地啊，你究竟生出了什么？如果悟性也像其余受造之物一样，是由尘土造成的，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respondit et dixi
  choice: 我回答说
  rationale: 原文疑有抄传或整理造成的人称形式不一致；依叙事主体与英语审校层，采用自然的第一人称表达，避免生硬重复“回答并说”。
- source_word: O tu terra
  choice: 大地啊
  rationale: 保留直接呼告及庄重语气；现代汉语无需逐字译出强调性的 tu。
- source_word: quid peperisti
  choice: 你究竟生出了什么
  rationale: peperisti 是“生出、产生”，将大地人格化；“究竟”传达质问和哀叹的力度，而不额外解释。
- source_word: sensus
  choice: 悟性
  rationale: 此处可指感知、心智或理解能力；“悟性”在上下文中较自然，并保留其作为人类心智能力的宽泛含义。
- source_word: pulvis (from the continuation reflected in the audited English layer)
  choice: 尘土
  rationale: 用户提供的拉丁引文止于 si sensus，句意未完；英语审校层保存了后续“made from dust”的内容，译作传统而自然的“由尘土造成”。
- source_word: cetera creatura (from the continuation reflected in the audited English layer)
  choice: 其余受造之物
  rationale: 用“受造之物”表达 creation 的集合意义，同时避免误解为一次抽象的“创造”活动。
theological_decisions:
- issue: sensus 所指是一般感知、理性还是属灵悟性
  choice: 译作“悟性”，不限定其为纯理性或专门的属灵能力
  alternative: “理解力”或“知觉”
  rationale: 拉丁词义宽泛，语境带有对人类心智及其尘土来源的张力；不宜在译文中把含义收窄。
- issue: “由尘土造成”与“其余受造之物一样”的关系
  choice: 保留比较结构，不解释为特定的人论或创造次序
  alternative: 改写为“既然人和万物同由尘土而造”
  rationale: 改写会加入原句没有明说的主语与推论；当前措辞保留未完条件句的开放性。
translation_notes:
  register: 采用现代、庄重而可懂的叙事语言。原文片段在 si sensus 处中断，英语审校层所示句子也显然跨入后续文本，因此译文以逗号收尾，保留未完条件句，不擅自补出结论。
