  yaml_path: translation/extra_canonical/2_esdras/007/025.yaml
  text: Therefore, Ezra, empty things are for the empty, and full things for the full.
translation:
  language: zh_hans
  text: 因此，以斯拉，空的归空的，满的归满的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: 所以
  rationale: 自然表达由上文引出的结论，同时保留原文简洁的因果衔接。
- source_word: vacua vacuis
  choice: 空虚的归于空虚的
  rationale: 保留中性复数形容词名词化所产生的概括性，也重现原文词根重复；拉丁语中省略的关系以“归于”作最低限度补足。
- source_word: plena plenis
  choice: 充实的归于充实的
  rationale: 与前半句形成严格对称，保留中性复数的概括性及词根重复，且不擅自限定为人、事物或地方。
theological_decisions:
- issue: vacua/vacuis 与 plena/plenis 所指对象未明
  choice: 采用名词化的“空虚的／充实的”，不补明对象
  alternative: 译为“空虚之物归空虚之人，充实之物归充实之人”等
  rationale: 原文的中性复数形式保持对象宽泛，而与格形式只显示某种归属、适配或关联；明确区分“物”与“人”会过度解释。
- issue: 省略系词或关系词所表达的关系
  choice: 以“归于”连接
  alternative: 译为“是给……的”或“与……相配”
  rationale: “归于”可自然表达与格可能具有的归属关系，同时避免把目的、受益或适配中的某一种解释定死。
translation_notes:
  register: 采用简洁、庄重的现代汉语；保留原句格言式的对称结构、重复和语义含混。专名 Ezra 译作通行形式“以斯拉”。
