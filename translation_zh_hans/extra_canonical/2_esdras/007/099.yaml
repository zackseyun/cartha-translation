review_pass:
  verdict: revise
  source_fidelity: 需修订。拉丁文节首为残存的 *[eius], cui*，并承接前文；译文应保留其不完整的承接性质，而不把方括号中的“他”误作可独立引出后句的主语。*ut a modo adnuntiatur* 是“正如现今所宣告的”，不宜译成完成体的“如今已宣告出来”。末尾 *quas* 为关系代词，须在汉语中以“那些……”保留其续接下节的未完结构。
  naturalness: 原译前半句“[他]，活着的人都侍奉他”在现代汉语中句法悬空；改用破折号并将关系从句自然化。将“受苦之路，也就是……”改为“痛苦之路，那些……”可同时更贴近 *quas* 的语法功能，并避免无根据地把关系从句解释为定义说明。
  terminology: “侍奉”“报偿”“义人的灵魂”“次序”均可保留。“那些得荣耀的人”可自然表达 *gloriosi*，而不预设其教义身份。“痛苦之路”较直接对应 *uiae cruciatus*；此处不强加“地狱”或特定刑罚体系。
  issues:
  - severity: medium
    issue: 节首方括号内容在汉语中形成悬空结构。
    rationale: 源文开头是承接上文的残片，英语审计文本以方括号标出补足。原译将“[他]”直接置于逗号前，无法在汉语中自然地与“活着的人都侍奉他”连接。
  - severity: medium
    issue: “如今已宣告出来”将 *adnuntiatur* 的现在时被动误成完成性表述。
    rationale: '*ut a modo adnuntiatur* 表示“正如现今/从现在起所宣告的”；译作“正如现今所宣告的”既保留时态，也不强定 *a modo* 的时间方向。'
  - severity: medium
    issue: “也就是……”未体现末尾 *quas* 的关系代词及其续接结构。
    rationale: 本节止于 *quas*，下节继续其关系从句；汉译应以“那些……”保留未完成的指代，而非改作解释性的“也就是”。
