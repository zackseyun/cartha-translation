  text: '[him][a], whom the living serve and from whom the glorious begin to receive their reward. This is the order of the souls of the righteous, as it is now announced; [and these are] the previously described ways of torment, which'
translation:
  language: zh_hans
  text: '[他]——活着的人所侍奉、得荣耀的人开始从他那里领受报偿的那一位。这就是义人的灵魂的次序，正如现今所宣告的；[以下是]前面所说的痛苦之路，那些……'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruiunt
  choice: 侍奉
  rationale: 既保留对神服事、敬奉的语义，也符合庄重而自然的现代汉语。
- source_word: gloriosi
  choice: 那些得荣耀的人
  rationale: 拉丁词可指“荣耀的人”；结合其开始领受报偿的语境，用“得荣耀的人”表达其蒙受荣耀的状态，同时不增添具体身份。
- source_word: mercedem
  choice: 报偿
  rationale: 兼顾奖赏与按行为所得回报的含义，避免把语义缩窄为工资。
- source_word: ordo
  choice: 次序
  rationale: 此处承接义人灵魂经历的分项次序，直译清楚。
- source_word: a modo adnuntiatur
  choice: 如今已宣告出来
  rationale: a modo 在此可表达“现在、从现在起”；依本节总结前述内容的语境，译为自然的“如今”，不强行解释为单一时间方向。
- source_word: uiae cruciatus
  choice: 受苦之路
  rationale: 保留“道路/途径”与“痛苦、刑罚”的组合意象；“受苦”不预先限定苦楚的具体性质。
theological_decisions:
- issue: gloriosi 所指身份
  choice: 那些得荣耀的人
  alternative: 荣耀的人
  rationale: 保留蒙荣耀者与从神领受报偿的关系，但不将其明确等同于某一教义类别。
- issue: 残句与下节的衔接
  choice: 以“也就是……”保留未完结构
  alternative: 补入下节内容使句子完整
  rationale: 现有拉丁来源在 quas 处中断并延续到下一节；不应擅自补全本节。
- issue: 两组内容之间省略的系词
  choice: 以方括号补出“以下则是”
  alternative: 不补词，形成生硬残句
  rationale: 拉丁文在 praedictae uiae cruciatus 前省略可由上下文理解的连接成分；方括号明确标示为译文为汉语通顺所作的补足。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留节首承接上文及节末延续下文的残句性质；补足语均置于方括号内，省略号表示原文在本节末尚未完成。
