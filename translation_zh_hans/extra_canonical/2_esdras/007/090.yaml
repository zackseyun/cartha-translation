  text: periculum, uti perfecte custodirent legislatoris legem. Propter quod hic de his
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/090.yaml
  text: 'the danger, that they might perfectly keep the law of the Lawgiver. Therefore this is concerning them:'
translation:
  language: zh_hans
  text: 这种危险，为要使他们能完全遵守立法者的律法。因此，这里所说的是关于他们的：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: periculum
  choice: 这危险
  rationale: 保留拉丁文名词“危险”，并以“这”承接残篇上下文；本节开头显然是跨节延续的句子片段。
- source_word: uti
  choice: 为要使
  rationale: 表达目的或预期结果，同时不把拉丁文在目的与结果之间的细微弹性完全抹平。
- source_word: perfecte custodirent
  choice: 能完全遵守
  rationale: custodire 在律法语境中自然译为“遵守”；“完全”对应 perfecte，“能”体现未完成虚拟式所处的目的结构。
- source_word: legislatoris legem
  choice: 立法者的律法
  rationale: 保留同源概念的强调，并以“立法者”而非直接指称上帝，避免加入原文没有明说的解释。
- source_word: Propter quod hic de his
  choice: 因此，关于他们的情形是这样
  rationale: 按残缺而简略的拉丁语承接下文；补入“情形”使现代汉语可读，但不擅自译成“教导”等原文没有的概念。
theological_decisions:
- issue: “立法者”是否直接译作“上帝”
  choice: 保留“立法者”
  alternative: 上帝
  rationale: 原文使用 legislator，而非 Deus；保留称谓可避免消除原文的修辞与神学含蓄。
- issue: 结尾 hic de his 的补足方式
  choice: 关于他们的情形是这样
  alternative: 关于他们的教导如下
  rationale: “教导”在拉丁文中没有明确对应词，会增加解释；“情形是这样”较中性，并自然引出后文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。由于所给拉丁文从上一句中段开始，本节中文也保留承接感；末尾冒号表明论述将在下一节继续。
