  yaml_path: translation/extra_canonical/2_esdras/007/020.yaml
  text: For let many of those now present perish[a], rather than the law of God that has been set forth be neglected.
translation:
  language: zh_hans
  text: 因为，宁可让现今在世的许多人灭亡[a]，也不可让被置于前面的上帝律法被忽视。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“现今在场的许多人灭亡”。
    reason: praesentes 既可指现今存在、在世的人，也可较字面地指当时在场的人。
lexical_decisions:
- source_word: enim
  choice: 因为
  rationale: 保留原文解释或因果性的连接词，承接上文。
- source_word: multi praesentes
  choice: 现今在世的许多人
  rationale: praesentes 可指当前存在、如今活着的人；此译在现代汉语中自然，同时不把它局限为空间上的“在场”。
- source_word: pereant
  choice: 让……灭亡
  rationale: 保留虚拟式在“宁可……也不可……”结构中的取舍意味，并准确表达 pereant 的强烈语义。
- source_word: anteposita est
  choice: 已经颁布
  rationale: 表达律法已被置于人前、公开提出；“颁布”符合律法语境，又不补出拉丁文未明说的间接宾语。
- source_word: neglegatur
  choice: 被忽视
  rationale: 保留原文被动形式及“疏忽、不予重视”的含义。
theological_decisions:
- issue: 人的灭亡与上帝律法之间的强烈取舍
  choice: 保留“宁可……也不可……”的张力
  alternative: 弱化为“许多人会灭亡，因为他们忽视上帝的律法”
  rationale: 原文没有明确说人因忽视律法而灭亡，而是以 quam 引出比较取舍；不应改写为直接的报应因果关系。
- issue: 律法的施予对象
  choice: 不补出“给他们”或“摆在他们面前”
  alternative: 已经摆在他们面前的上帝律法
  rationale: 拉丁文 anteposita est 未明说对象；保持这一省略，避免加入解释性限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为”明确承接上文；“宁可……也不可……”自然呈现原文的比较取舍。正文中的脚注标记与脚注对应。
