source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: revelabitur enim Filius meus Iesus cum his qui cum eo, et iucundabit qui relicti sunt annis quadringentis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/028.yaml
  text: For my son Jesus will be revealed with those who are with him[a][b], and he will make glad those who remain for four hundred years.
translation:
  language: zh_hans
  text: 因为我的儿子耶稣将同那些与他同在的人一同显现[a][b]；他要在四百年间使余下的人欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文“在四百年间”的句法位置紧随“余下的人”，但按其作为持续时间夺格的通常用法，并结合下一节的时间推进，通常理解为修饰“使……欢喜”。
    reason: 说明时间短语的句法位置，同时避免将其误译为“存留四百年的人”。
  - marker: b
    text: 本段拉丁文的措辞很醒目：7:28作“我的儿子耶稣”，7:29则作“我的儿子基督”。这段话描述四百年的时期，随后是弥赛亚之死、七天如创世之初的寂静，以及之后的复活，是早期犹太启示文学中格外突出的弥赛亚段落之一。
    reason: 说明相邻两节不同的弥赛亚称谓及本段的文学神学背景。
lexical_decisions:
- source_word: revelabitur
  choice: 将……显现
  rationale: 保留拉丁语被动形式及末世启示语境；中文以“显现”自然表达被揭示、出现之意。
- source_word: Filius meus Iesus
  choice: 我的儿子耶稣
  rationale: 按现存拉丁文本直译，并保留与下一节“我的儿子基督”之间引人注目的措辞差异。
- source_word: cum his qui cum eo
  choice: 和那些与他同在的人一同
  rationale: 保留原文两个 cum 所形成的重复关系，不具体断定这些人的身份。
- source_word: iucundabit
  choice: 使……欢喜
  rationale: 采用使役表达，对应动词“使喜乐、使欢欣”，不额外解释为统治或赐福。
- source_word: qui relicti sunt
  choice: 余下的人
  rationale: 表达被留下、存留之人，同时不擅自限定为末世余民等特定神学类别。
- source_word: annis quadringentis
  choice: 四百年
  rationale: 拉丁语夺格短语可表示持续时间；其句法所修饰的成分存在一定含混，正文保留接近原语序的表达，并以脚注说明另一种理解。
theological_decisions:
- issue: “耶稣”与“基督／弥赛亚”的措辞关系
  choice: 正文照录“我的儿子耶稣”
  alternative: 将其统一译为“我的儿子弥赛亚”或“我的儿子基督”
  rationale: 本节拉丁文本明确作 Iesus，而下一节作 Christus；不应为取得术语一致而抹平文本差异。
- issue: 四百年的句法归属
  choice: “他要使余下的人欢喜四百年”
  alternative: “他要使那些存留四百年的人欢喜”
  rationale: annis quadringentis 最自然可作持续时间，修饰“使欢喜”；但原语序也容许读者将其较紧密地联系于“余下的人”，故在脚注保留另一种理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“显现”“与他同在”“余下的人”等措辞贴近原文，不额外确定同行者身份，也不把“四百年”直接释义为“统治期”。
