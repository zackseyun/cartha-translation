revisions:
- from: 大地要交还那些睡在其中的人[a]，尘土要交还那些默然住在其中的人；储藏之处也要交还受托保管的灵魂。
  to: 大地要交还那些睡在其中的人[a]；尘土要交还那些住在其中、默然无声的人；各储藏所也要交还那交托给它们的灵魂。
  rationale: 修订不改变复活与灵魂暂存的意象，仅改善第二分句的现代汉语表达，明确“储藏所”的复数，并更准确表达灵魂被交托给这些储藏所的被动关系。脚注改为实际可辨的替代语序。
