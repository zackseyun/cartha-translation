  text: et terra reddet qui in eam dormiunt, et pulvis qui in eo silentio habitant, et promptuaria reddent quae eis commendatae sunt animae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/032.yaml
  text: And the earth will give back those who sleep in it[a], and the dust those who dwell in it in silence, and the storehouses will give back the souls entrusted to them.
translation:
  language: zh_hans
  text: 大地要交还那些睡在其中的人[a]；尘土要交还那些住在其中、默然无声的人；各储藏所也要交还那交托给它们的灵魂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些在寂静中住在其中的人”。
    reason: 保留英文审计记录所反映的另一语序；正文则按拉丁文现有的平行分句译出。
lexical_decisions:
- source_word: reddet
  choice: 要交还
  rationale: 重复译出三处分句共同的动词，保留原文的排比和“归还所存之人”的意象。
- source_word: dormiunt
  choice: 睡在其中
  rationale: 保留以睡眠指死亡的原文隐喻，不直接释为“死去”。
- source_word: pulvis
  choice: 尘土
  rationale: 直译其物质意象，并与“大地”形成平行而不强行合并。
- source_word: in eo silentio habitant
  choice: 默然住在其中
  rationale: 兼顾 habitant 的“居住”和 silentio 的寂静状态，保留原文略显神秘的表达。
- source_word: promptuaria
  choice: 储藏之处
  rationale: 采用自然且宽泛的中文，保留复数所指的存放空间意象，不具体化为某种神学场所。
- source_word: commendatae sunt animae
  choice: 受托保管的灵魂
  rationale: 表达灵魂被交付给这些储藏之处看守、将来须归还的含义，并保留被动关系。
theological_decisions:
- issue: 死者复起时身体与灵魂分别被交还的图景
  choice: 保留“大地／尘土”交还人、“储藏之处”交还灵魂的并列结构
  alternative: 将全句概括译为“死人都要复活”
  rationale: 概括译法会抹去原文关于身体与灵魂暂存之处的独特意象，并替文本解决其神学张力。
- issue: “睡在其中”与“默然住在其中”的句法关系
  choice: 正文按现存拉丁文本分别落实到“大地”和“尘土”两个分句，并加注说明另一种断句可能
  alternative: 把两种表述合并为同一群人：“那些默然住在其中的人”
  rationale: 拉丁文本的平行结构支持正文译法，但既有传统提示另一种理解，宜在脚注中保留其可能性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“交还”贯穿三个分句，以再现拉丁文 reddet 的反复；保留“睡”“尘土”“储藏之处”等末世性意象，不作教派化解释。
