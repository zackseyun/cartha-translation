  yaml_path: translation/extra_canonical/2_esdras/007/129.yaml
  text: For this is the way that Moses spoke of to the people while he lived, saying, ‘Choose life for yourself, that you may live.’
translation:
  language: zh_hans
  text: 因为这就是摩西在世时对百姓所说的道路：“你要为自己选择生命，好使你存活。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: via
  choice: 道路
  rationale: 保留原文“道路”的比喻意义，指向应当选择和遵行的生命之路。
- source_word: cum viveret
  choice: 在世时
  rationale: 自然表达摩西尚在人间、仍活着的时间背景。
- source_word: elige tibi vitam
  choice: 你要为自己选择生命
  rationale: 保留命令语气以及 tibi 的反身受益意味，不将“生命”解释性改写为某种具体生活方式。
- source_word: ut vivas
  choice: 好使你存活
  rationale: 表达目的或结果关系，并保留“生命—存活”的原文重复。
theological_decisions:
- issue: “道路”与摩西引语之间的关系
  choice: 保留“这就是……道路”的表述
  alternative: 意译为“这就是摩西所教导的选择”
  rationale: 原文明确使用 via；保留道路意象，避免把它收窄为抽象教导。
- issue: elige tibi 中 tibi 的表达
  choice: 译出“为自己”
  alternative: 仅译“选择生命”
  rationale: 虽然汉语中可省略，但译出有助于保留拉丁文本对选择者自身利益与归属的强调。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。将较长的拉丁句拆为两句，使引语关系清楚，同时保留原文的道路意象、命令语气和“生命—存活”的修辞呼应。
