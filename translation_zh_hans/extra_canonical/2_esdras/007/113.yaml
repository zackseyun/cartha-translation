source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dies enim iudicii erit finis temporis huius et initium futuri inmortalistemporis, in quo pertransivit corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/113.yaml
  text: For the day of judgment will be the end of this time and the beginning of the immortal time to come[a], in which corruption has passed away,
translation:
  language: zh_hans
  text: 因为审判之日将是现今这个时期的终结，也是那将要来临的不朽时期的开端[a]；在那个时期，朽坏已经消逝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“未来的不朽时期”。
    reason: 保留 futuri 较直接的时间性译法；正文采用更符合启示文学语感的“将要来临”。
lexical_decisions:
- source_word: Dies enim iudicii
  choice: 因为审判之日
  rationale: 保留 enim 的因果衔接，并以现代中文圣经语体自然表达“审判之日”。
- source_word: temporis huius
  choice: 现今这段时期
  rationale: 直译为“这个时期”虽可行，但上下文是现今与将来两个时期的对照；加入“现今”使指向清楚，同时不把 tempus 强行解释为特定神学术语“世代”。
- source_word: futuri inmortalis temporis
  choice: 那将要来临的不朽时期
  rationale: futuri 在启示文学中具有“将要来临”的末世意味；“不朽时期”保留 inmortalis 对 tempus 的修饰，不改释为“永恒”。
- source_word: pertransivit corruptela
  choice: 朽坏已经消逝
  rationale: pertransivit 是完成时，表达已经过去、消失；corruptela 可指腐朽或败坏，“朽坏”既保留本体性含义，也不排除更广的败坏意味。
theological_decisions:
- issue: futuri temporis 的末世论表达
  choice: 将要来临的……时期
  alternative: 未来的……时期
  rationale: 前者较自然地呈现两个时期之间的末世性转换，但不把 tempus 明确定为“时代”或“世界”，从而保留原文范围。
- issue: corruptela 的含义范围
  choice: 朽坏
  alternative: 败坏
  rationale: “朽坏”更能与“不朽”形成语义呼应，同时仍可涵盖受造秩序的衰残；避免仅将其限定为道德败坏。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句末保留逗号，以反映本节原文尚未结束；正文脚注标记与脚注一致。
