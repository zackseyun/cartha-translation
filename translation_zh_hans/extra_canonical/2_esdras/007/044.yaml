  text: 因为它将持续如同一个七年期那样。这就是我的审判及其定例，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ebdomada annorum
  choice: 七年之久
  rationale: 字面为“一周的年”，即由七年构成的周期；现代汉语用“七年之久”自然表达其时长，同时不额外引入经文未明说的专门术语。
- source_word: iudicium
  choice: 审判
  rationale: 保留司法及末世审判语境中的核心含义；“判断”虽可行，但在本段语境中力度偏弱。
- source_word: constitutio
  choice: 定例
  rationale: 表达已经确立的规定或安排，并与“审判”形成自然并列；不擅自具体化为判决执行方式。
theological_decisions:
- issue: eius所指为何
  choice: 其定例
  alternative: 它的定例／有关这事的定例
  rationale: 拉丁语eius的指代存在一定含混；采用“其”保留这种含混，不武断判定它指“审判”、前述期限或整个事件。
- issue: ebdomada annorum是否采用象征性术语
  choice: 七年之久
  alternative: 一个七年期／一周的年数
  rationale: 原文说明的是由七年构成的时段；译文传达基本意义，但不额外断定它具有某种特定末世论体系中的技术含义。
