  rationale: 调整末句以更贴合“loqueris dicens ad eos”的第二人称单数和引语衔接，并将“苦刑”改为现代汉语更自然、语义更宽的“折磨”。保留“审判之日”，因为英语审计文本明确显示这是残缺拉丁片段中“in”之后的续文内容。
