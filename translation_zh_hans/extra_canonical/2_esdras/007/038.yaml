  yaml_path: translation/extra_canonical/2_esdras/007/038.yaml
  text: 'Look on this side and on that: here are delight and rest, and there are fire and torments. These are the words he will speak to them on the day of judgment.'
translation:
  language: zh_hans
  text: “看这边，再看那边：这里有喜乐和安息，那里有火和折磨。”你要在审判之日对他们这样说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Videte contra et in contra
  choice: 你们看看这一边，也看看那一边
  rationale: “Videte”是复数命令式；“contra et in contra”形成两相对照，按自然汉语表达为分别观看两边。
- source_word: iocunditas
  choice: 喜乐
  rationale: 表达愉悦、欢欣的状态，与后面的“安息”并列，语体庄重而通俗。
- source_word: requies
  choice: 安息
  rationale: 既保留停止劳苦、得享休息之意，也符合经文语域。
- source_word: ignis et tormenta
  choice: 火与苦刑
  rationale: “tormenta”为复数，指种种折磨或刑罚；“苦刑”简洁保留其惩罚和痛苦色彩。
- source_word: loqueris
  choice: 你要……说
  rationale: 拉丁文是第二人称单数形式，因此遵从原文译作“你要”，不采用英文咨询层的第三人称“他会”。
theological_decisions:
- issue: 审判场景中说话者的人称
  choice: 你要在审判之日对他们说这些话
  alternative: 这些就是他在审判之日要对他们说的话
  rationale: 现存拉丁文“loqueris”明确指向第二人称单数。虽然英文咨询层采用第三人称，但译文优先依据原文证据，不把说话者改为“他”。
- issue: 两种终局状态的对照
  choice: 这里是喜乐和安息，那里是火与苦刑
  alternative: 这里有快乐和休息，那里有火和折磨
  rationale: 保留原文鲜明并列，不解释其持续时间、性质或具体对象，以免消解经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“安息”“审判之日”保留经文语感；引号标明前句是被吩咐要向众人宣告的话。
