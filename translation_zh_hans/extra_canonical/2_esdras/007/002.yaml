  text: And he said to me, “Rise, Ezra, and hear the words that I have come to speak to you.”
translation:
  language: zh_hans
  text: 他对我说：“以斯拉，起来，听我前来对你说的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: surge
  choice: 起来
  rationale: 直接表达命令语气，符合现代汉语习惯，并保留拉丁文的动作要求。
- source_word: audi
  choice: 听
  rationale: 保留原文命令式及其直接含义，不扩展为“留心听”等解释性表达。
- source_word: sermones
  choice: 话
  rationale: 此处指将要说出的言语；译作“话”自然清楚，也避免“言论”或“训词”所带来的额外色彩。
- source_word: quos veni loqui ad te
  choice: 我要来对你说的
  rationale: 尽量保留 veni（来）与 loqui ad te（对你说）的结构；汉语以“我要来”自然表达来意，而不把它简化为仅仅“我要说”。
