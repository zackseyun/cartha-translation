  yaml_path: translation/extra_canonical/2_esdras/007/045.yaml
  text: 'But to you alone I showed these things. Then I answered and said[a], “Lord, then I said, and now I say:'
translation:
  language: zh_hans
  text: 但我只把这些事显明给了你。我回答说[a]：“主啊，我那时说过，如今也这样说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我当时回答说：‘主啊，现在我说：’”这是较严格依照现存拉丁文词序的译法；其他古译本所反映的意义支持正文“那时……如今……”的对照。
    reason: 现存拉丁文中 tunc 的句法归属略有歧义；脚注呈现其可修饰“回答”的读法，同时正文保留与 nunc 构成对照的理解。
lexical_decisions:
- source_word: tibi autem soli
  choice: 但我只……给了你
  rationale: 保留 autem 的转折语气和 soli 的排他含义，同时采用自然的现代汉语语序。
- source_word: ostendi haec
  choice: 把这些事显给了你
  rationale: ostendi 在启示语境中不只是一般的“给看”，译为“显给”既贴近原义，也保持庄重语体。
- source_word: respondi ... et dixi
  choice: 我回答说
  rationale: 拉丁语的并列动词在汉语中合译为惯用表达，避免生硬重复。
- source_word: tunc ... et nunc
  choice: 那时……现在仍……
  rationale: 体现 tunc 与 nunc 的时间对照；“仍”清楚表达过去所说之话延续到现在，但不改变命题内容。
theological_decisions:
- issue: tunc 在句中的归属
  choice: 正文按“我那时这样说，现在仍这样说”理解，使 tunc 与 nunc 构成修辞对照
  alternative: 按现存拉丁语标点和词序译为“于是我回答说：‘主啊，现在我说……’”
  rationale: 现存拉丁文的词序略显参差，但 tunc 与 nunc 很可能构成有意对照；正文保留这一意义，同时用脚注呈现严格依照拉丁词序的读法，避免掩盖文本歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“显给”保留启示语境；引文以冒号结尾，因为本节话语在下一节继续。
