  text: 'gehennae ostendetur, et contra eum iocunditatis paradisus. Et dicet tunc Altissimus ad excitatas gentes : uidete et intellegite quem negastis, uel cui non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/037.yaml
  text: And then the Most High will say to the awakened nations[a], “Look and understand whom you denied, or whom you did not serve, or whose ways you despised.
translation:
  language: zh_hans
  text: 那时，至高者要对苏醒的万民[a]说：“你们要看，要明白：你们所否认的是谁，所没有侍奉的是谁，所藐视的又是谁的道路。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被唤醒的万民”。
    reason: 说明拉丁文 excitatas 的被动色彩；正文“苏醒”更自然，并保留上下文睡眠与醒来的意象。
lexical_decisions:
- source_word: Altissimus
  choice: 至高者
  rationale: 保留这一称号的崇高语体，并与原文定冠称谓相称。
- source_word: excitatas gentes
  choice: 苏醒的万民
  rationale: excitatas 有“被唤醒、苏醒”的含义；结合上下文关于睡眠与醒来的意象，用“苏醒”比泛化为“兴起”更能保留原文图像。gentes 在此指受审判的众民，用“万民”自然且庄重。
- source_word: uidete et intellegite
  choice: 你们要看，要明白
  rationale: 保留两个并列命令及其递进关系，不合并为单一的“认清”。
- source_word: quem negastis
  choice: 你们所否认的是谁
  rationale: 维持 quem 的人称指向以及原文质问式的强调结构。
- source_word: cui non [servistis]
  choice: 所没有侍奉的是谁
  rationale: 依照经审校的咨询文本所保存的句子续文表达，同时保持 cui 的人称宾语结构。
- source_word: cuius vias sprevistis
  choice: 所藐视的又是谁的道路
  rationale: “道路”保留行为方式与生活道路的经文意象；“藐视”准确传达 sprevistis 的轻蔑、弃绝意味。
theological_decisions:
- issue: excitatas 是否明确译作复活
  choice: 译为“苏醒的”，不直接译作“复活的”
  alternative: 复活的万民／从死里被唤起的万民
  rationale: 上下文确与复活和审判有关，但 excitatas 本身延续睡眠—醒来的比喻；正文保留该意象，避免把隐喻完全解释化。
- issue: quem、cui、cuius 的指向
  choice: 连续保留三个“谁”的人称问句结构
  alternative: 统合为“你们曾否认、不侍奉并藐视其道路的那一位”
  rationale: 原文刻意重复关系代词，形成审判宣告的节奏和强调；不把所指者进一步具体命名，以保留原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要看，要明白”保留宣告式命令的力度；后半句以三个平行分句呈现原文的审判修辞。
