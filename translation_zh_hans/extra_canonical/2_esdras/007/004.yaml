  text: But its entrance will be set in a narrow place[b][a], so that it would be like a river.
translation:
  language: zh_hans
  text: 然而，它的入口将设在狭窄之处，以致入口如同一条河。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erit ... introitus ... positus
  choice: 入口将设在
  rationale: 保留“erit”所表达的将来时，并以现代汉语自然的被动含义“将设在”传达“positus”，避免生硬的“将被放置”。
- source_word: in angusto loco
  choice: 在狭窄之处
  rationale: 贴近拉丁文的空间表达，保留入口所在之处狭窄的含义。
- source_word: ut esset similis fluminis
  choice: 使入口如同一条河
  rationale: “ut”加虚拟式可表达目的或结果；“使”保留这种张力，不强行限定为单纯事实陈述。重复“入口”以明确“similis”在语法上所指的是阳性主语“introitus”，避免汉语代词含混。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留本节由“然而”引出的转折，以及拉丁文从将来时到目的／结果从句的语法层次；不沿用缺乏充分原文依据的现在时异文脚注。
