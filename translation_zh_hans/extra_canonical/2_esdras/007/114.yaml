  text: soluta est intemperantia, abscisa est incredulitas, crevit autem iustitia, orta est veritas.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/114.yaml
  text: self-indulgence has been ended, unbelief has been cut off, but righteousness has grown and truth has arisen.
translation:
  language: zh_hans
  text: 放纵已经止息，不信已被剪除；正义却日益增长，真理也已兴起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: intemperantia
  choice: 放纵
  rationale: 该词指缺乏节制、任由欲望支配的状态；“放纵”自然简洁，并保留其道德含义。
- source_word: soluta est
  choice: 已经止息
  rationale: 拉丁语在此表达该恶行已被解除、终结；译作“止息”符合汉语搭配，也避免机械地译为“被解开”。
- source_word: incredulitas
  choice: 不信
  rationale: 可指不相信或不忠信；“不信”保留简洁度及一定语义张力，不把它限定为某一教义术语。
- source_word: abscisa est
  choice: 已被剪除
  rationale: 保留原文“砍下、切除”的强烈意象和被动语态。
- source_word: iustitia
  choice: 正义
  rationale: 在此与放纵、不信相对，兼具正直、公义的道德意味；“正义”是现代普通读者易懂的表达。
- source_word: crevit
  choice: 日益增长
  rationale: 准确呈现“增长、增多”的动态过程，并使中文表达自然。
- source_word: veritas
  choice: 真理
  rationale: 可表示真实、真理；本句将其拟人化为兴起之物，“真理”最能保留庄重和抽象意味。
- source_word: orta est
  choice: 已兴起
  rationale: 该动词可指升起、出现、产生；“兴起”保留其动态意象和庄重语体。
theological_decisions:
- issue: incredulitas 的语义范围
  choice: 不信
  alternative: 不忠／不信实
  rationale: 原词既可能偏向拒绝相信，也可能涵盖不忠信；正文采用较直接的“不信”，但不扩写对象，以免把含义限定为特定教义判断。
- issue: iustitia 的译法
  choice: 正义
  alternative: 公义／正直
  rationale: “正义”在现代汉语中清楚自然，也能与邪恶状态形成对照；不专门采用带有特定宗派语感的术语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留四个并列分句及前后对照，用“却”呈现 autem 的转折。无脚注标记。
