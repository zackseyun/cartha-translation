  text: requiescent enim per septem ordines. Ordo primus, quoniam cum labore multo certati sunt, ut uincerent cum eis plasmatum cogitamentum malum, ut non eas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/092.yaml
  text: 'The first order: because with much struggle they have fought to overcome the evil thought formed with them, so that it might not lead them astray from life into death.'
translation:
  language: zh_hans
  text: 第一层：他们经过许多艰苦的争战，为要胜过与他们一同受造的恶念，免得它把他们从生命引到死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ordo primus
  choice: 第一层
  rationale: 这里的“ordo”指义人安息时依次经历的层次或阶段；译作“层”既简洁，也与“七层”的上下文相合。
- source_word: cum labore multo certati sunt
  choice: 历经许多艰苦争战
  rationale: 保留“劳苦”与“争战”两层含义，同时采用自然庄重的现代汉语表达。
- source_word: uincerent
  choice: 胜过
  rationale: 准确表达“战胜、克服”，并适合以“恶念”为宾语。
- source_word: cum eis plasmatum cogitamentum malum
  choice: 与他们一同受造的恶念
  rationale: 直译拉丁文的共同形成或受造意象，不擅自解释为原罪、内在本性或外来诱惑。
- source_word: ut non eas
  choice: 不让它迷惑他们
  rationale: 现存引文在此处残缺；依据所给英语审校层保留“恶念迷惑他们”的关系，并用现代汉语明确代词所指。
- source_word: a uita in mortem
  choice: 使他们离开生命、走向死亡
  rationale: 保留从生命到死亡的方向性对照，不将其限缩为肉身死亡或某一特定神学解释。
theological_decisions:
- issue: 恶念与人的关系
  choice: 与他们一同受造
  alternative: 在他们里面形成／与他们一同被塑造
  rationale: “cum eis plasmatum”本身带有不寻常且可能含混的共同形成意象；正文采用较形式对应的译法，以保留神学张力，不把恶的来源解释得过于确定。
- issue: 生命与死亡的含义
  choice: 生命、死亡
  alternative: 永生、永死
  rationale: 原文只使用一般性的“生命”和“死亡”；不额外加入“永恒”以避免超出文本。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“历经许多艰苦争战”保留原文的强烈奋斗感；“离开生命、走向死亡”呈现清楚的方向性对比。
