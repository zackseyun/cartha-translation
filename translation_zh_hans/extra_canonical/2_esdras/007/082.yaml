  text: 'The second way: because they cannot now make a good repentance so as to live[a].'
translation:
  language: zh_hans
  text: 第二条路：因为他们不能作出良善的悔改[a]，以便得生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悔改”直译为“良善的回转”或“回转归正”。
    reason: 说明拉丁词 reuersio 的“回转”意象，并保留其可指回转、归正或悔改的语义范围。
lexical_decisions:
- source_word: Secunda via
  choice: 第二条路
  rationale: 直译重复出现的计数结构，保留“via（路）”这一形象及其与上下文各条“路”的呼应。
- source_word: reuersionem bonam facere
  choice: 作良善的悔改
  rationale: reuersio本义为回转，在此指悔改；采用现代读者熟悉的“悔改”，同时以脚注保留“回转归正”的词源意象。bonam译作“良善的”，避免加入原文没有的“真诚”“彻底”等限定。
- source_word: ut vivant
  choice: 使自己得以存活
  rationale: 保留ut所表达的目的或结果关系；“自己”顺应汉语表达，所指仍是主语“他们”，不增添新的神学判断。
theological_decisions:
- issue: 是否加入“如今／现在”来体现死后处境
  choice: 正文不加入时间副词
  alternative: 因为他们如今不能作良善的悔改
  rationale: 现存拉丁文non possunt本身没有nunc或iam等时间标记；上下文虽可能暗示此时已无悔改机会，但不应把语境推论写成明示的原文内容。
- issue: “得生”指现世存活还是终末生命
  choice: 译作“得以存活”，不进一步界定
  alternative: 得永生／获得救恩
  rationale: vivant只表达“活”，原文未明说“永生”或“救恩”；保留其在末世审判语境中的神学张力。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；保留原文“第二条路”的列举形式。句法尽量贴近拉丁文，同时避免生硬直译及语境性增补。
