  yaml_path: translation/extra_canonical/2_esdras/007/124.yaml
  text: but we will not enter[a], for we have lived in ungrateful places?
translation:
  language: zh_hans
  text: 可是，我们难道就因为曾在令人不悦的地方生活过，便不能进去吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ingrediemur
  choice: 进去
  rationale: 拉丁语 ingredi 表示“进入”；原文未明说进入何处，因此不擅自补出宾语。
- source_word: ingratis
  choice: 令人不悦的
  rationale: ingratus 修饰 locis，在此自然义为“不讨喜的、令人不快的、不受欢迎的”，并非通常表示道德羞耻的“可耻的”；“令人不悦的”既贴近词义，也能自然修饰“地方”。
- source_word: conversati sumus
  choice: 曾住在
  rationale: conversari 在处所语境中表示居住、生活；完成时以“曾”体现既往经历。
- source_word: enim
  choice: 只因
  rationale: 原文以 enim 引出理由；在整句反问中译作“只因”，使其论证关系在现代汉语中清楚，同时保留质疑语气。
theological_decisions:
- issue: 是否把未明说的进入对象补为某一末世归宿
  choice: 不补出对象，仅译“进去”
  alternative: 译作“进入那地方／进入来世／进入乐园”
  rationale: 拉丁原文没有宾语；补明具体归宿会消除原文依赖上下文而产生的开放性，并可能带入额外的神学解释。
- issue: ingratis 是否带有道德上的“可耻”含义
  choice: 译为“令人不悦的”
  alternative: 译为“可耻的”或“不蒙悦纳的”
  rationale: ingratus 的常见语义是令人不快、不受欢迎或不合意；原文并未明确把所住之地定性为道德污秽，故不强化为“可耻”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。整句保留拉丁文的反问结构；“却”对应 vero 的转折强调，“只因”清楚呈现 enim 所引理由。未添加原文没有的进入对象，也不沿用英语咨询层中语义生硬的“忘恩负义的地方”。
