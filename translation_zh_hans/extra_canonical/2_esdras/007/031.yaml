  text: et erit post dies septem, et excitabitur qui nondum vigilat saeculum et morietur corruptum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/031.yaml
  text: And after seven days, the age that is not yet awake will be awakened, and what is corrupt will die.
translation:
  language: zh_hans
  text: 七日之后，那尚未苏醒的世界将被唤醒，败坏的将死去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post dies septem
  choice: 七天以后
  rationale: 直接表达时间顺序，符合现代汉语习惯。
- source_word: excitabitur
  choice: 必被唤醒
  rationale: 保留拉丁文将来时的确定性和被动语态，也与“尚未醒来”的意象呼应。
- source_word: saeculum
  choice: 世代
  rationale: 此处指尚未来临并如同沉睡的时代或世代；“世代”能保留其时间性与一定的人格化色彩，避免把它具体化为某一神学术语。
- source_word: corruptum
  choice: 败坏的
  rationale: 按中性单数的概括用法译为“败坏的”，不擅自补出具体所指，也不弱化为仅仅“会朽坏的”。
- source_word: morietur
  choice: 必死亡
  rationale: 保留原文的将来陈述及“死”的直白力度。
theological_decisions:
- issue: saeculum所指的范围
  choice: 译为“世代”，保留可指时代、世代或世界秩序的语义张力
  alternative: 时代／世界
  rationale: 上下文所描绘的是未来秩序的觉醒，但本节本身没有把所指完全限定；采用“世代”而不加解释，可避免过度判定。
- issue: corruptum是否明确指某一受造物或现世秩序
  choice: 保留为不具名的“败坏的”
  alternative: 败坏的世界／必朽坏之物
  rationale: 拉丁文只用中性形容词名词化，并未明说其所指；译文不应补入“世界”或改成单纯的可朽性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式尽量贴近原文的两个并列将来事件；不添加主语解释，也不消解“世代被唤醒”这一人格化表达。
