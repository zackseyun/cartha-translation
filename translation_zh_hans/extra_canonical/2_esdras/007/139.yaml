  text: et iudex, si non ignoverit his qui creati sunt verbo eius et deleverit multitudinem contemptionum, non fortassis derelinquenturinnumerabilem multitudinem nisi pauci valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/139.yaml
  text: And if the Judge did not forgive those who were created by his word and blot out the multitude of acts of contempt[b][a], perhaps only a very few would be left from an innumerable multitude.
translation:
  language: zh_hans
  text: 审判者若不宽恕那些借着他的话受造的人，也不抹去众多藐视之举，那么，从不可胜数的众人中，或许只会剩下极少数。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudex
  choice: 审判者
  rationale: 保留拉丁文的身份称谓，同时符合现代汉语的庄重语体。
- source_word: verbo eius
  choice: 借着他的话
  rationale: 表达工具或媒介含义，并保留“话”在创造语境中的神学分量。
- source_word: deleverit
  choice: 抹去
  rationale: 贴近 deleo 的删除、涂抹之意，也自然表达过犯被除去。
- source_word: multitudinem contemptionum
  choice: 众多轻慢之举
  rationale: contemptio 指轻蔑、藐视或蔑视；译作“轻慢之举”既保留主动抗拒的意味，又避免泛化为一般“过犯”。
- source_word: innumerabilem multitudinem nisi pauci valde
  choice: 从不可胜数的人中……只会剩下极少数
  rationale: 依上下文和句意，将人数上的强烈对比译得清楚自然：原本人数不可胜数，最终留下的却极少。
- source_word: fortassis
  choice: 恐怕
  rationale: 保留原文的推测语气，而不把结果表述成绝对断言。
theological_decisions:
- issue: 否定词 non 是否同时管辖“宽恕”和“抹去”
  choice: 译作“不宽恕……也不抹去”
  alternative: “不宽恕……却抹去……”
  rationale: 虽然拉丁文第二个动词前未重复 non，但并列结构与整句论证表明两项均属于否定条件；如此处理也避免产生审判者一面不宽恕、一面抹去轻慢行为的矛盾读法。
- issue: 句首 et iudex 与条件句的关系
  choice: 译作“审判者若……”
  alternative: “而他是审判者；他若……”
  rationale: 原文缺少表示“因为”的连词，故不补入明确因果；同时将 iudex 自然纳入条件句，保留其称谓功能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不可胜数”保留原文人数极多的强调；“极少数”与之形成鲜明对照。正文不补出拉丁文没有的因果连词，并以脚注保存旧译可能性。
