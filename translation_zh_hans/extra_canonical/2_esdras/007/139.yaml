revisions:
- from: 审判者若[a]不宽恕那些借着他的话受造的人，也不抹去众多轻慢之举[b]，那么，从不可胜数的人中，恐怕只会剩下极少数。
  to: 审判者若不宽恕那些借着他的话受造的人，也不抹去众多藐视之举，那么，从不可胜数的众人中，或许只会剩下极少数。
  rationale: 删除无原文依据的 a 脚注，避免把旧译的因果补足误作本节的可选译法。以“或许”对应 fortassis 的中性推测语气，并将“轻慢”微调为更直接对应 contemptionum 的“藐视”。其余句法、否定范围和人数对比均予保留。
