  text: Quid enim nobis prodest, si promissum est nobis inmortale tempus, nos vero mortalia opera egimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/119.yaml
  text: For what does it profit us if an immortal age has been promised to us, but we have done mortal works?
translation:
  language: zh_hans
  text: 因为，若有不朽的时代应许给我们，我们所行的却是必朽的行为，这对我们有什么益处呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inmortale tempus
  choice: 不朽的时代
  rationale: 直译其核心意象；“时代”比“时间”更自然地表达所应许的未来世代，同时保留“不朽”与下文“必朽”的对照。
- source_word: mortalia opera
  choice: 必朽之人的行为
  rationale: 拉丁文可直译为“必朽的行为”，但汉语略显费解；补出“之人”以显明这些行为属于必死、必朽的现世生命，仍保留与“不朽”的修辞张力。
- source_word: prodest
  choice: 有什么益处
  rationale: 符合反问句语气，也准确传达“有益、获利”的含义。
- source_word: promissum est nobis
  choice: 应许给我们
  rationale: 采用庄重而通行的圣经语体，并保留被动结构的重点。
- source_word: egimus
  choice: 所行的
  rationale: 在伦理行为语境中译作“行”比泛泛的“做”更庄重自然。
theological_decisions:
- issue: “不朽的时代”与“必朽的行为”之间的张力
  choice: 保留不朽/必朽的词根呼应
  alternative: 译作“永生的世代”与“属世的行为”
  rationale: 原文刻意以 inmortale 与 mortalia 对举；不改写为“属世”或“致死”，以免加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式；保留原文中应许与人的行为之间的尖锐对照。
