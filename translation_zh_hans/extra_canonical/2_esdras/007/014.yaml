source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si ergo non ingredientes ingressi fuerint qui vivunt angusta et vana haec, non poterunt recipere quae sunt reposita.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/014.yaml
  text: Therefore[a], if those who live do not enter these narrow and vain things, they cannot receive what has been stored up.
translation:
  language: zh_hans
  text: 所以，那些活着的人若不进入这些狭窄而虚空的事，就不能领受那所存放的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui vivunt
  choice: 那些活着的人
  rationale: 直译关系从句，保留其泛指现今活着之人的表达。
- source_word: angusta et vana haec
  choice: 这些狭窄而虚空的事
  rationale: 保留 angusta 与 vana 的并列及指示词 haec；“事”承接中性复数，避免擅自具体化为道路、世事或考验。
- source_word: recipere
  choice: 领受
  rationale: 既表达接受所得，也符合庄重的经文语体。
- source_word: quae sunt reposita
  choice: 那存留下来的福分
  rationale: reposita 表示被存放、留存之物；结合“领受”的正面语境，以“福分”使中文自然，但不具体界定其内容。
theological_decisions:
- issue: 双重进入表达 ingredientes ingressi fuerint 的强调程度
  choice: 译作“进入”
  alternative: 译作“确实进入”或“真正进入”
  rationale: 拉丁文的分词加限定动词可能保存闪语式强调，但在否定条件句中也可视为译文腔的重复；正文采用自然汉语，不额外加入可能过度解释的强调词。
- issue: “所存留之物”的性质
  choice: 译作“存留下来的福分”
  alternative: 直译为“所存留的东西”或解释为“所预备的赏赐”
  rationale: 上下文表明这是可领受的正面之物；“福分”保持一定开放性，同时避免将其限定为某种特定末世奖赏。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文“若不……就不能……”的条件关系，并保留“狭窄而虚空”之间不易化解的张力。
