  text: Not a few[a], but nearly all who have been created. And he answered me and said, “Hear
translation:
  language: zh_hans
  text: 不是少数，而是几乎所有受造的人。他回答我说：“你听着——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non paucos
  choice: 不是少数
  rationale: 保留拉丁文否定式的强调，不将其改写为较弱的“许多人”。
- source_word: pene omnes
  choice: 几乎所有
  rationale: 准确保留 pene 所表达的接近全体、但并非绝对全体的限定。
- source_word: qui creati sunt
  choice: 受造的人
  rationale: 被动完成式表示“已经被创造的”；依上下文所指为人，译作“受造的人”自然且明确。
- source_word: audi
  choice: 你听着
  rationale: audi 是第二人称单数命令式；此处为引出下文的郑重吩咐。破折号表明引语在所给片段末尾尚未完结。
theological_decisions:
- issue: “几乎所有”与“所有”的范围差异
  choice: 保留“几乎所有”
  alternative: 所有受造的人
  rationale: pene 明确限制 omnes；不应为追求概括性而消除这一可能涉及人类结局范围的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。所给拉丁文本是承接上文并开启下句的残片，因此开头不补入主语或谓语，结尾用破折号标示话语未完。英文层的脚注涉及本片段中并不存在的 corripiam，故不移植为本节脚注。
