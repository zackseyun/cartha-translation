  yaml_path: translation/extra_canonical/2_esdras/007/011.yaml
  text: For their sake I made the world[a], and when Adam transgressed my ordinances, what had been made was judged.
translation:
  language: zh_hans
  text: 因为我创造世界原是为他们的缘故[a]；当亚当违背我的律例时，所造的就受了审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“时代”。
    reason: 拉丁文 saeculum 可指“世界”或“时代”；此处因作“创造”的宾语并与“所造的”呼应，正文译作“世界”，脚注保留其词义歧义。
lexical_decisions:
- source_word: propter eos
  choice: 为他们的缘故
  rationale: 在此与“创造”连用，主要表达受益或目的关系，即世界是为了他们而造；此译法也比单纯的“因为他们”更符合上下文。
- source_word: saeculum
  choice: 世界
  rationale: saeculum 可指“世代、时代”，但在这里是 feci（创造）的宾语，又与后文“所造的”呼应，因此正文译作“世界”更自然；其词义歧义保留在脚注中。
- source_word: constitutiones meas
  choice: 我的条例
  rationale: constitutiones 指神所设立并要求遵守的规定；“条例”兼顾规范性和庄重语体。
- source_word: iudicatum est
  choice: 受了审判
  rationale: 保留拉丁文被动结构及司法性语义，不将其具体化为“被定罪”或“遭到惩罚”。
- source_word: quod factum est
  choice: 所造的
  rationale: 按字面保留中性关系结构，所指可能是受造界或已经造成的整体，不擅自缩窄范围。
theological_decisions:
- issue: “所造的”受审判的范围
  choice: 保留“所造的”这一宽泛表述
  alternative: 译作“受造界”或“世界”
  rationale: 原文 quod factum est 没有明确限定范围；保留其概括性可避免替作者解决其神学张力。
- issue: 亚当违命与世界受审判之间的关系
  choice: 以时间从句“当……时”连接
  alternative: 译成明确因果关系“因为亚当……所以……”
  rationale: 原文 quando 明示时间关系；虽上下文暗含后果关系，但不宜在译文中加强为显式因果。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“为他们的缘故”准确表达目的或受益关系；分号保持原句两个紧密相关分句的结构。
