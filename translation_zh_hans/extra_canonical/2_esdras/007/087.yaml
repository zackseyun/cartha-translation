  yaml_path: translation/extra_canonical/2_esdras/007/087.yaml
  text: The seventh way is greater than all the ways mentioned above[a], because they will waste away in confusion and be consumed in horrors and wither in fears, seeing the glory of the Most High, before whom they sinned while they lived[b], and before whom they will begin to be judged in the last times.
translation:
  language: zh_hans
  text: 第七条路比以上所说的一切路都更为严重[a]，因为他们必在困惑中渐渐衰残，被种种恐怖吞噬，在惧怕中枯萎；他们将看见至高者的荣耀，就是他们活着时曾在他面前犯罪、并将在末后的时候在他面前开始受审判的那一位[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节在拉丁文本传统中有几处措辞不甚规整，但大意仍然清楚：恶人面对至高者的荣耀时，将经历最剧烈的痛苦，因为他们生前曾在他面前犯罪。
    reason: textual_variant
  - marker: b
    text: 或译：“第七条路比以上所说的一切路都更甚：他们在困惑中渐渐衰残，在羞耻中被消耗，在惧怕中枯萎，因为他们看见至高者的荣耀；他们活着时曾在他面前犯罪，末后的时候也将在他面前受审判。”
    reason: previous_rendering
lexical_decisions:
- source_word: Septima uia
  choice: 第七条路
  rationale: 保留本段对死后遭遇之“道路”的连续编号和比喻表达。
- source_word: maior
  choice: 更为严重
  rationale: 字面义为“更大”；在比较诸种刑苦的语境中译作“更为严重”更符合现代汉语，同时不把它具体化为某一种刑罚。
- source_word: detabescent
  choice: 渐渐衰残
  rationale: 该将来时动词有逐渐消瘦、衰败之意；“渐渐衰残”兼顾过程感与将来意义。
- source_word: in confusione
  choice: 在困惑中
  rationale: confusio 可指困惑、混乱或羞惭；正文采用较直接且不缩窄语义的“困惑”，文本传统的粗糙另见脚注。
- source_word: consumentur in horroribus
  choice: 在恐怖中被消耗
  rationale: 保留被动式和复数 horroribus 所表达的多重恐怖，不误译为“羞耻”。
- source_word: maereescent / marcescent in timoribus
  choice: 在惧怕中枯萎
  rationale: 依据校勘所反映的 marcescent 理解为“枯萎、衰败”；timoribus 译作“惧怕”，保留复数所加强的语气。
- source_word: uidentes gloriam Altissimi
  choice: 他们看见至高者的荣耀
  rationale: 将现在分词按伴随情状自然译出，不另添“因为”，以免改变 quoniam 所引出的因果结构。
- source_word: incipient … iudicari
  choice: 将……开始受审判
  rationale: 明确保留 incipient 的“开始”和不定式的被动意义。
theological_decisions:
- issue: “第七条路更大”的性质
  choice: 译为“更为严重”
  alternative: “更大”或“更甚”
  rationale: 上下文谈恶人所受的痛苦；“严重”传达比较关系，但不额外断定刑罚的具体机制。
- issue: 人在至高者面前犯罪并受审
  choice: 两处均译“在他面前”
  alternative: “得罪了他／由他审判”
  rationale: 保留原文 coram 的临在性和平行结构，不将“在……面前犯罪”简化为仅指犯罪对象，也不擅自改明审判者的句法角色。
- issue: 末后审判的起始性
  choice: “末后的时候也将在他面前开始受审判”
  alternative: “末后将受审判”
  rationale: 保留原文“开始”的神学张力，不把审判处理成没有阶段性的单一事件。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至高者”延续犹太—基督教文献中 Altissimus 的常见称谓；三个并列分句保留原文逐层累积的强烈节奏。破折号用于澄清“至高者”与后续两个 coram 从句的关系。
