revisions:
- from: 第七条路比以上所说的一切路都更为严重[a]，因为他们必在困惑中渐渐衰残，在恐怖中被消耗，在惧怕中枯萎；他们看见至高者的荣耀——他们活着时曾在他面前犯罪[b]，末后的时候也将在他面前开始受审判。
  to: 第七条路比以上所说的一切路都更为严重[a]，因为他们必在困惑中渐渐衰残，被种种恐怖吞噬，在惧怕中枯萎；他们将看见至高者的荣耀，就是他们活着时曾在他面前犯罪、并将在末后的时候在他面前开始受审判的那一位[b]。
  rationale: The revision makes the two parallel coram clauses unambiguously dependent on “至高者,” while preserving the future tense, the causal scope of quia/quoniam, the participial sense of uidentes, and the inceptive “开始受审判.” It also improves the idiomatic expression of the passive “consumentur in horroribus.” The alternate-rendering footnote is retained as an audit-trail note and therefore continues to report its earlier divergent renderings rather than silently harmonizing them with the main text.
