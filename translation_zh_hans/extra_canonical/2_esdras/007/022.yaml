  yaml_path: translation/extra_canonical/2_esdras/007/022.yaml
  text: But they were not persuaded and contradicted him[a], and they formed for themselves vain thoughts[b],
translation:
  language: zh_hans
  text: 可是这些人不肯信服，反而反对他[a]，又为自己构想出虚妄的念头[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“反驳他”或“抗拒他”。
    reason: 说明 contradixerunt 的语义范围，保留其可能偏重言语抵触或实际抗拒的歧义。
  - marker: b
    text: 较直译：“为自己立定虚妄的意念”。
    reason: 显示 constituerunt sibi cogitamenta vanitatis 的拉丁文结构，同时正文采用较自然的现代汉语。
lexical_decisions:
- source_word: non sunt persuasi
  choice: 不肯信服
  rationale: 拉丁文形式为“未被说服”，在此语境中表示他们拒绝接受劝服；“不肯”自然传达其意志上的抗拒，同时保留“信服”的核心意义。
- source_word: contradixerunt ei
  choice: 反对他
  rationale: contradicere 可指反驳、顶撞或抗拒；“反对他”既比单纯“反驳”更能涵盖对上帝的抗拒，也不过度将其解释为公开叛逆。
- source_word: constituerunt sibi
  choice: 为自己构想出
  rationale: constituerunt 在此以“念头”为宾语，表示形成、设定或谋划；“构想出”符合现代汉语搭配，并保留 sibi 所表达的“为自己”。
- source_word: cogitamenta vanitatis
  choice: 虚妄的念头
  rationale: vanitatis 是性质属格，修饰“念头”；“虚妄的念头”自然表达这些思想的空幻、无实或错误性质，而不采用生硬的“虚妄之念”。
theological_decisions:
- issue: 他们对“他”的回应应理解为言语反驳还是更广泛的抗拒
  choice: 正文译作“反对他”
  alternative: “反驳他”或“抗拒他”
  rationale: 原文 contradixerunt ei 本身兼有言语抵触与实际反对的可能；正文采用范围较宽的“反对”，不把经文限定为口头争辩，也不强化为明确叛乱。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不肯信服”与“反而反对他”表现前后递进；末尾保留逗号，以顺接下一节或同一长句的后文。
