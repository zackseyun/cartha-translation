  text: 'Et respondi et dixi: scio, domine, quoniam nunc vocatus est Altissimus misericors, in eo quod misereatur qui nondum in saeculo advenerunt,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/132.yaml
  text: And I answered and said[a], “I know, Lord, that the Most High is now called merciful because he has mercy on those who have not yet come into the age,”
translation:
  language: zh_hans
  text: 我回答说：“主啊，我知道，至高者如今被称为仁慈的，因为他怜悯那些尚未来到世上的人，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“尚未来到这时代的人”；这里可能是指尚未出生的人。
    reason: 保留 in saeculo 的字面时代含义，同时说明该短语在本句中的自然理解。
lexical_decisions:
- source_word: misericors / misereatur
  choice: 仁慈的 / 怜悯
  rationale: 分别保留形容词与动词的对应关系，同时采用现代汉语中自然、庄重的表达。
- source_word: qui nondum in saeculo advenerunt
  choice: 那些尚未来到世上的人
  rationale: 这里的拉丁语短语按语境是指尚未出生、尚未进入人世的人；译为“来到世上”既符合习语，也避免误读为已进入某个末世时代。
- source_word: Altissimus
  choice: 至高者
  rationale: 这是该书对上帝的称号，直译且符合汉语宗教文本的庄重语体。
- source_word: nunc vocatus est
  choice: 如今被称为
  rationale: 保留 nunc 的时间意味和被动结构，不擅自解释“如今”所指的神学阶段。
theological_decisions:
- issue: in saeculo 是否应作为两时代框架中的“时代”来理解
  choice: 译作“来到世上”
  alternative: “来到这时代”或“进入这世代”
  rationale: 在 advenerunt in saeculo 这一表达中，重点是进入人的现世生命，即出生；正文采用自然汉语，脚注保留较贴近 saeculum 字面的可能表达。
- issue: “如今被称为仁慈的”所表达的时间张力
  choice: 原样保留“如今”
  alternative: 省略“如今”或释为“在今世”
  rationale: 原文明确有 nunc；不应在译文中替作者界定其具体神学指向。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我回答说”保留原文常见的叠加言说公式；句末逗号显示本节句意尚未完结。
