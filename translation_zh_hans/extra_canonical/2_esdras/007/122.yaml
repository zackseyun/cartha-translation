  text: Et quoniam incipiet gloria Altissimi protegere eos qui caste conversati sunt, nos autem pessimis viis ambulavimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/122.yaml
  text: And since the glory of the Most High will begin to protect those who have conducted themselves chastely[a], but we have walked in the most evil ways?
translation:
  language: zh_hans
  text: 既然至高者的荣耀将开始庇护那些生活纯正的人[a]，而我们却走在最邪恶的道路上呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“品行纯洁的人”。
    reason: 说明 caste conversati sunt 可从行为层面表达，并保留其广义的道德纯正含义。
lexical_decisions:
- source_word: gloria Altissimi
  choice: 至高者的荣耀
  rationale: 直译属格结构，并保留“至高者”这一称号。
- source_word: protegere
  choice: 庇护
  rationale: 表达遮护、保护之意；“庇护”与“荣耀”搭配自然，又不增添原文没有的具体方式。
- source_word: caste conversati sunt
  choice: 生活纯正
  rationale: caste 在这里指广义的道德与宗教纯洁，不宜限缩为现代汉语中偏重性伦理的“贞洁”；conversati sunt 指一贯的生活和行为。
- source_word: pessimis viis ambulavimus
  choice: 我们却走了最邪恶的道路
  rationale: 保留“行走—道路”的原文比喻，并以“最邪恶”对应最高级 pessimis。
theological_decisions:
- issue: caste 的伦理范围
  choice: 生活纯正
  alternative: 生活贞洁
  rationale: 上下文以“最邪恶的道路”作宽泛对照，因此采用涵盖整体品行的译法，避免把意义缩限于性方面。
- issue: 疑问句在摘录中的不完整性
  choice: 以“岂不也是祸患吗”补足中文问句所需的承接语气
  alternative: 直译为“既然……而我们却……？”
  rationale: 拉丁文 Et quoniam 显示本句属于前文连续列举的疑问；中文若完全照搬会成为突兀残句。所补措辞只明确其祸患式反问功能，不改变两项对比的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“荣耀”“至高者”及“走道路”的经文意象；以“却”突出受庇护者与说话者之间的强烈对照。
