  text: Et quoniam reposita sunt habitacula sanitatis et securitatis, nos vero male conversati sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/121.yaml
  text: And if dwellings of health and safety have been laid up, but we have conducted ourselves wickedly?
translation:
  language: zh_hans
  text: 既然健康与安全的居所已经存留，我们却行事邪恶吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reposita sunt
  choice: 已经……存留
  rationale: 表达事物已被存放、保留以待将来享用的完成状态；较“预备”更贴近拉丁文，同时符合现代汉语。
- source_word: habitacula
  choice: 居所
  rationale: 保留复数所指的集合意义，又比“住处”更庄重自然。
- source_word: sanitatis et securitatis
  choice: 健康与安宁
  rationale: sanitas 指健康、健全；securitas 指免于危险与忧惧的安全安稳。译作“安宁”可与“健康”自然搭配，并保留其平安稳妥之意。
- source_word: male conversati sumus
  choice: 我们却行事邪恶
  rationale: conversari 在此指生活方式或行为表现，male 带有明确的负面道德评价；“行事邪恶”既贴近原文，也保持庄重语体。
theological_decisions:
- issue: 句首 quoniam 的逻辑语气
  choice: 既然
  alternative: 如果
  rationale: quoniam 通常表达原因或已知事实，宜译“既然”；本句的疑问形式仍保留上下文中的反诘张力，不依照英文咨询层的 if 将其条件化。
- issue: 存留之居所的受益对象
  choice: 为我们存留
  alternative: 已经存留
  rationale: 原文未明说受益者，但上下文第一人称复数和汉语表达允许补出“为我们”；这不进一步界定居所的神学性质。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。保留原句问号所呈现的反诘或未完论证感，不擅自改成陈述句，也不解释“居所”的末世论性质。
