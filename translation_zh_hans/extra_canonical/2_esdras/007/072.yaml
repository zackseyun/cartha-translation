  text: Qui ergo commorantes sunt in terra, hinc cruciabuntur, quoniam sensum habentes iniquitatem fecerunt, et mandata accipientes non seruauerunt ea, et legem consecuti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/072.yaml
  text: Therefore those who dwell on the earth will be tormented for this reason, because though they had understanding they committed iniquity, and though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it.
translation:
  language: zh_hans
  text: 因此，住在地上的人必因这事受苦：他们虽有理智，却行了不义；虽领受了诫命，却不遵守；虽得到了律法，却以诡诈待它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存所引拉丁文本在“虽得到了律法”处中断；本句末尾“却以诡诈待它”依据校订所保存的续文含义补出。
    reason: 明确区分用户提供的拉丁文本与英语审校层所保存的末句，避免把未显示的拉丁词句误称为直接可见的原文证据。
lexical_decisions:
- source_word: commorantes sunt in terra
  choice: 住在地上的人
  rationale: 贴近拉丁文“居住在地上”的表达，同时符合现代汉语经文语体。
- source_word: cruciabuntur
  choice: 必……受苦
  rationale: 该词可表示受折磨、受痛苦；“受苦”自然庄重，又不额外限定痛苦的施加方式。
- source_word: sensum habentes
  choice: 有理智
  rationale: 保留“具有理解、判断能力”的含义，不将其强化为已经拥有属灵知识。
- source_word: iniquitatem fecerunt
  choice: 行了不义
  rationale: 对应“作出不义之事”，保留其道德和神学分量。
- source_word: mandata accipientes non seruauerunt ea
  choice: 领受了诫命，却不遵守
  rationale: 准确呈现“接受—未守”的对照，并以现代汉语自然表达复数诫命。
- source_word: legem consecuti
  choice: 得到了律法
  rationale: consecuti在此表示获得、领受；“得到了”避免与上一分句“领受”机械重复。
- source_word: dealt deceitfully with it（英语审校层所保存的残句续文）
  choice: 以诡诈待它
  rationale: 简洁保留欺诈、不忠实对待律法的含义；代词“它”明确回指律法，不擅自解释具体行为。
theological_decisions:
- issue: 受苦的依据与人的责任
  choice: 保留三个“虽……却……”的递进对照
  alternative: 将经文概括为“因明知故犯而受罚”
  rationale: 原文具体列出理智、诫命和律法三个层面；逐项保留可呈现其神学张力，避免用解释性概括取代文本。
- issue: cruciabuntur所指痛苦的性质
  choice: 译为“受苦”
  alternative: 译为“受刑罚”或“受折磨”
  rationale: 原词语义较强，但本句本身未明确痛苦的执行方式；“受苦”保留结果而不加入原文未明说的刑罚机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。用分号保持三个平行分句的节奏，以“虽……却……”清楚呈现原文的让步与反差。
