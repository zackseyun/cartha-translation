source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et nunc de sermonibus tuis intellege, quoniam dixisti, quia nobiscum crescit sensus;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/071.yaml
  text: And now understand from your own words, because you said that understanding grows with us.
translation:
  language: zh_hans
  text: 现在，你要从自己的话中明白这一点，因为你曾说，悟性与我们一同增长。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de sermonibus tuis
  choice: 从自己的话中
  rationale: 保留拉丁文“从你的话语中”的论证关系，表示说话者要对方根据自己先前所说的话来领会。
- source_word: intellege
  choice: 你要……明白
  rationale: 以自然庄重的现代汉语表达第二人称单数命令式。
- source_word: sensus
  choice: 悟性
  rationale: 此处指人的理解、认知能力；“悟性”既区别于具体的某项“理解”，也能自然地与“增长”搭配。
- source_word: nobiscum crescit
  choice: 与我们一同增长
  rationale: 贴近原文结构，不把“我们”具体化为年龄、身体或人生阶段，从而保留原文的概括性。
theological_decisions:
- issue: sensus所指的是理解能力还是具体认识
  choice: 译为“悟性”，侧重理解能力
  alternative: “理解随着我们增长”
  rationale: 拉丁文sensus具有一定语义宽度；结合crescit，理解能力更为顺畅，但不进一步解释其增长方式，以保留文本张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“现在”承接上文；“这一点”为汉语中补出的命令宾语，不添加新的实质信息。
