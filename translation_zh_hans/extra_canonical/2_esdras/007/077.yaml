  text: qui speruerunt, neque connumeres te cum his qui cruciantur. Etenim est tibi thesaurus operum repositus apud Altissimum, sed non tibi demonstrabitur usque in nouissimis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/077.yaml
  text: who have shown contempt[a], and do not count yourself among those who are tormented. For a treasury of works is laid up for you with the Most High, but it will not be shown to you until the last times.
translation:
  language: zh_hans
  text: 就是那些曾心怀轻蔑的人；不要把自己算在受折磨的人中。因为在至高者那里，有为你积存的善行宝藏；但直到末后的日子，这宝藏才会向你显明。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: speruerunt
  choice: 藐视
  rationale: 拉丁文 spernere 表示轻蔑、拒斥；此处保留其强烈的贬义，并承接上文未完的关系从句。
- source_word: connumeres te
  choice: 把自己算在……中
  rationale: 贴近 connumerare 的‘列入、算在其中’，同时符合现代汉语表达。
- source_word: cruciantur
  choice: 受折磨
  rationale: 准确传达 cruciare 的痛苦、折磨含义，不预先限定折磨的具体性质。
- source_word: thesaurus operum
  choice: 善行宝藏
  rationale: 直译核心意象‘行为/功业的宝藏’；结合为人积存并在末后显明的正面语境，以‘善行’自然传达 operum 的语境含义。
- source_word: repositus apud Altissimum
  choice: 在至高者那里，有为你积存的
  rationale: 保留 apud Altissimum 的所在关系和 repositus 的被动、存留之意。
- source_word: nouissimis
  choice: 末后的日子
  rationale: 该形容词在此省略所修饰名词；依上下文译为末后的时期，同时不细化为某一特定末世事件。
theological_decisions:
- issue: thesaurus operum 是否译成具有特定教义色彩的‘功德宝库’
  choice: 善行宝藏
  alternative: 功德宝库／行为的宝藏
  rationale: ‘功德宝库’容易引入后世宗派术语；‘行为的宝藏’虽形式更近，却不够自然且正面语义不清。‘善行宝藏’兼顾语境、清晰度和神学中立。
- issue: 宝藏何时及向谁显明
  choice: 直到末后的日子，这宝藏才会向你显明
  alternative: 但在末后以前，它不会显给你看
  rationale: 保留原文被动 demonstrabitur 及受事对象 tibi，不说明显明者，也不把‘末后’具体解释为审判或复活。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。首句是承接上一节的残句，译文以‘就是那些……的人’保留这一跨节句法关系；不另加脚注，因为所给英文脚注内容与现行正文重复，且不能说明真实的文本异读。
