  yaml_path: translation/extra_canonical/2_esdras/007/066.yaml
  text: For it is much better for them than for us, for they do not expect judgment, nor do they know torments or the salvation promised after death.
translation:
  language: zh_hans
  text: 因为他们比我们好得多；他们不期待审判，也不知道死后所应许的刑罚或救恩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现提供的拉丁文摘录到“审判”为止；本句后半“也不知道死后所应许的刑罚或救恩”依据经审校的英文文本补出。“死后所应许的”在原句中的修饰范围也可理解为仅指“救恩”。
    reason: 如实标明原语言摘录不完整，并保留后半句修饰范围的歧义。
lexical_decisions:
- source_word: Multum enim melius est illis quam nobis
  choice: 因为他们比我们好得多
  rationale: 直译拉丁文的比较结构，并以自然现代汉语表达；“illis”依上下文译为“他们”。
- source_word: non enim sperant iudicium
  choice: 他们不必等候审判
  rationale: “sperant”通常有“盼望、期待”之意，但其宾语为“审判”，这里表达他们没有面对审判的预期；译作“不必等候”可避免中文“期待审判”可能带来的正面盼望色彩，同时保留与“我们”的处境对比。
- source_word: torments or the salvation promised after death
  choice: 死后所应许的刑罚或救恩
  rationale: 此部分依据经审校的英文咨询层补足；“刑罚或救恩”保留两种死后结局并列所形成的张力，不把“所应许的”只限定于“救恩”。
theological_decisions:
- issue: “死后所应许的”修饰“刑罚或救恩”中的哪一项
  choice: 让“所应许的”在中文中修饰整个并列结构
  alternative: 译作“刑罚，或死后所应许的救恩”
  rationale: 英文咨询文本在语法上可能只修饰“救恩”，但相关表述也可理解为死后等待人的刑罚或救恩；正文保留这种范围上的含混，不擅自作教义性限定。
- issue: 未期待审判是否表示免受审判
  choice: 译作“不必等候审判”，只陈述其不面对审判的处境
  alternative: “他们不期待审判”或“他们没有审判可等候”
  rationale: 避免把该句扩展成关于普遍审判范围的系统教义断言，同时使现代汉语通顺。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“因为……；……”保留原文的论证关系。摘录开头的“iocundentur”（“愿他们欢喜”）在标点上属于前一句，且英文审校文本未将其列入本节，因此未纳入7:66正文。
