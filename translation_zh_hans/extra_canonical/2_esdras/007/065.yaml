  text: et propter hoc torquemur, quoniam scientes perimus. Lugeat hominum genus, et agrestes bestiae laetentur, lugeant omnes qui nati sunt, quadripedia uero et pecora
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/065.yaml
  text: And because of this we are tormented, because though we know, we perish. Let the race of man mourn, and let the beasts of the field rejoice; let all who have been born lament, but let the four-footed animals and the cattle be glad.
translation:
  language: zh_hans
  text: 正因如此，我们受折磨，因为我们明明知道，却仍然灭亡。愿人类哀哭，愿田野的野兽欢喜；愿所有生而为人的都悲叹，但愿四足动物和牲畜欢乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: torquemur
  choice: 受折磨
  rationale: 保留动词所表达的痛苦与受苦意味，同时不擅自限定为肉体刑罚或末世惩罚。
- source_word: scientes perimus
  choice: 我们明明知道，却仍走向灭亡
  rationale: scientes 为带让步意味的分词，译作“明明知道，却仍”；perimus 可指毁灭、丧亡，译作“走向灭亡”既自然，也保留过程或结局上的一定开放性。
- source_word: agrestes bestiae
  choice: 田野的走兽
  rationale: 体现 agrestes 的野外、非家养性质，并采用现代中文圣经语体中自然易懂的表达。
- source_word: genus hominum
  choice: 人类
  rationale: 简洁传达人这一族类整体，不机械译为“人的种族”。
- source_word: quadripedia uero et pecora
  choice: 四足动物和牲畜却要欢乐
  rationale: quadripedia 直译为“四足动物”；pecora 指家畜、牲口，译为“牲畜”。uero 在此形成与生而为人的众人悲叹相对的转折。
theological_decisions:
- issue: “知道”与“灭亡”之间的关系
  choice: 因为我们明明知道，却仍走向灭亡
  alternative: 因为我们虽有知识，仍然灭亡
  rationale: 保留原文“知道却灭亡”的张力，不补入所知道的具体对象，也不将其解释为某种特定教义中的知识。
- issue: 动物欢喜与人类哀哭的对照
  choice: 按原文保留直接对照
  alternative: 将动物的欢喜解释为免受审判或免于责任
  rationale: 原文未说明动物为何欢喜，因此不在正文中加入神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“愿……；愿……”再现拉丁文祈愿式的排比；末句用“却”强化人与动物之间的鲜明对照。原文后半句在所给片段中止于 pecora，英文审校层补出“be glad”以承接前句 laetentur；中文同样依平行结构补出“要欢乐”，使句意完整而不增加新的观念。
