revisions:
- from: 正因如此，我们受折磨，因为我们明明知道，却仍走向灭亡。愿人类哀哭，愿田野的走兽欢喜；愿一切生而为人的悲叹，四足动物和牲畜却要欢乐。
  to: 正因如此，我们受折磨，因为我们明明知道，却仍然灭亡。愿人类哀哭，愿田野的野兽欢喜；愿所有生而为人的都悲叹，但愿四足动物和牲畜欢乐。
