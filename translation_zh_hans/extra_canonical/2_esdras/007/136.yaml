  text: et multae misericordiae, quoniam multiplicat magis misericordias his qui praesentes sunt et qui praeterierunt et qui futuri sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/136.yaml
  text: and of great mercy[a], because he multiplies mercies for those who are present and those who have passed away and those who are to come.
translation:
  language: zh_hans
  text: 并且满有怜悯[a]，因为他为现今在世的人、已经离世的人和将来的人增添更多怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并且有极大的怜悯，因为他为现今在世的人、已经离世的人和将来的人使怜悯更加增多。”
    reason: 保留 multae misericordiae 的较直译表达，并反映 multiplicat magis misericordias 中“使怜悯增多”以及 magis 的加强或比较意味。
lexical_decisions:
- source_word: multae misericordiae
  choice: 大有怜悯
  rationale: 这是表示性质的属格结构，意为“有极大的怜悯”；“大有怜悯”既贴近原文，也符合现代汉语的庄重表达。
- source_word: multiplicat magis misericordias
  choice: 广施怜悯
  rationale: 原文表达增加、扩展怜悯；“广施”自然传达怜悯丰多而及于各时代的人，同时不把 magis 强行解释成持续递增的“越来越多”。
- source_word: praesentes ... praeterierunt ... futuri sunt
  choice: 如今在世的人、已经离世的人和将来的人
  rationale: 按三个时间范围表达原文：当下、过去与未来；结合指人的语境，将 praeterierunt 译为“已经离世的人”，但不进一步限定其神学状态。
theological_decisions:
- issue: 怜悯是否及于已死之人
  choice: 保留“向……已经离世的人……广施怜悯”的原文陈述
  alternative: 将其弱化为“过去世代的人”
  rationale: praeterierunt 与指人的复数结构相连，英语审校层也理解为“已经去世的人”；译文不解释这种怜悯的方式、时间或救赎含义，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“大有怜悯”与经文语体相称；“如今在世、已经离世、将来”清楚呈现三个时间范围。
