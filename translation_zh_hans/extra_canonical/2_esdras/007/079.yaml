  to: 到那赐下它的一位那里，首先敬拜至高者的荣耀。若它确实是那些弃绝至高者的道路、不持守其道路之人中的一个，也是那些藐视律法之人中的一个，[b]
  rationale: 调整“首先”的位置，使其明确修饰“敬拜”，并以较清楚的归类表达呈现 esse eorum。保留“它”的未明指称、对“至高者的荣耀”的直译，以及源文在句中截断的状态。
