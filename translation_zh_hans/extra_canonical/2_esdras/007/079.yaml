  naturalness: “先到赐下它的那一位那里”在现代汉语中既重复又不自然；改为“到那赐下它的一位那里，首先敬拜……”更顺畅，且不改变残句性质。“若它确实属于……”可以理解，但“是……中的一个”更清楚地表达 esse eorum 的归类关系。
  terminology: “至高者”“荣耀”“敬拜”“弃绝”“持守……道路”“藐视律法”均合适，保持庄重且符合宗教文本语域。“律法”不应擅自补成“他的律法”，因为所给拉丁文只作 legem。
