  text: ad eum qui dedit adorare gloriam Altissimi primum. Et si quidem esset eorum qui spreuerunt et non seruauerunt uiam Altissimi, et eorum qui contempserunt legem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/079.yaml
  text: to him who gave it[a], to worship the glory of the Most High first of all. And if indeed it is one of those who have spurned and have not kept the way of the Most High, and of those who have despised the law,
translation:
  language: zh_hans
  text: 到那赐下它的一位那里，首先敬拜至高者的荣耀。若它确实是那些弃绝至高者的道路、不持守其道路之人中的一个，也是那些藐视律法之人中的一个，[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 所提供的拉丁文在这里截断，句子尚未结束；本节开头也承接前一节的句子。
    reason: 标明源文本分节错位造成的首尾残句，避免误以为这是完整句子。
lexical_decisions:
- source_word: adorare
  choice: 敬拜
  rationale: 表达向神献上崇敬的宗教行为，比“爱慕”或一般性的“尊崇”更符合此处语境。
- source_word: gloriam Altissimi
  choice: 至高者的荣耀
  rationale: 保留属格结构及“Altissimus”作为神圣称号的表达，不将“荣耀”改释为“至高者本人”。
- source_word: spreuerunt
  choice: 弃绝
  rationale: 体现主动轻弃、拒斥的强烈意味，并与后面的“不持守”区分。
- source_word: seruauerunt uiam
  choice: 持守……道路
  rationale: “持守”对应守护、遵行之意；“道路”保留原文常见的伦理与宗教隐喻。
- source_word: contempserunt legem
  choice: 藐视律法
  rationale: 准确传达 contemnere 的轻蔑意味，并以“律法”呈现宗教语境中的 lex。
theological_decisions:
- issue: “敬拜至高者的荣耀”是否应释为直接敬拜至高者
  choice: 保留“敬拜至高者的荣耀”
  alternative: 敬拜荣耀的至高者／敬拜至高者
  rationale: 拉丁文直接以 gloriam 作 adorare 的宾语；虽表达在汉语中略显特殊，仍应保留原文措辞及其神学张力，不静默改释。
- issue: “它”所指对象
  choice: 正文保留代词，并以脚注说明按上下文指灵魂
  alternative: 直接译作“灵魂”
  rationale: 所给拉丁文片段没有明说名词；补出“灵魂”会消除片段本身的照应关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。因源文本片段实际从前一节末尾开始，并在本节句中截断，译文保留这种不完整性；用脚注交代文本边界问题。
