  source_fidelity: 译文总体忠实保留了拉丁文中“新妇”与“正在显现的城”的并列，也没有把推定的希腊文重构写入正文。可是“那正在显现的城，以及如今从地上隐去的，都将显露出来”把两个不同的拉丁谓语关系合并为“都将显露”，弱化了 apparescens（正在显现）与 ostendetur（将被显露）的区别。
  naturalness: 现有中文庄重通顺，但“征兆将要来到”略显重复且生硬；末段以“以及……都……”统摄两个短语，虽顺畅，却造成不必要的句法合并。
  terminology: “看哪”“新妇”“城”均合乎现代中文圣经语体。“从地上隐去的”可以保留指称未明的含混；改为“从地上被移去的”更明确反映 subducitur 的被动语态，但不指定其对象。
  issues:
