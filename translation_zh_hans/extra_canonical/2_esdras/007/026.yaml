    rationale: 拉丁文将 apparescens civitas（正在显现的城）与 ostendetur quae nunc subducitur terra（如今从地上被移去的将被显露）以不同形式呈现。中文宜分别表达，避免把城直接作为 ostendetur 的受事或主语。
  - severity: low
