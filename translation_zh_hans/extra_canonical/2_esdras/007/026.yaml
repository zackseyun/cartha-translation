source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce enim tempus veniet, et erit quando venient signa quae praedixi tibi, et apparebit sponsa et apparescens civitas et ostendetur quae nunc subducitur terra.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/026.yaml
  text: For behold[a], the time will come, and it will be when the signs that I foretold to you will come, and the bride will appear, and the city that is appearing[b], and what is now withdrawn from the earth will be shown.
translation:
  language: zh_hans
  text: 看哪[a]，时候将到；那时，我预先告诉你的征兆将会出现；新妇将显现，也会有一座正在显现的城出现；如今从地上被移去的，将被显露出来。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新妇”与“城”这两个并列意象，很可能浓缩了锡安或耶路撒冷复兴的启示文学图景。拉丁文十分简略，没有说明新妇与城之间究竟是什么关系。
    reason: compositional_layer
  - marker: b
    text: 末句也可理解为：“那如今从地上被移开的，将要显现。”拉丁文没有明确指出这是什么。
    reason: ambiguity
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留启示文学中引人注意的庄重提示语气。
- source_word: sponsa
  choice: 新妇
  rationale: 既准确表达婚娶意象，也符合中文圣经传统用语。
- source_word: apparescens civitas
  choice: 那正在显现的城
  rationale: 直接反映拉丁文现在分词 apparescens，不以推定的希腊文重构取代现存拉丁文本。
- source_word: subducitur terra
  choice: 从地上隐去
  rationale: 将 terra 理解为与介词性来源短语相连的夺格，表达某物目前从地上被移开、隐藏；中文采用自然的被动状态表达。
- source_word: ostendetur
  choice: 将显露出来
  rationale: 保留将来时和被动含义，同时使中文流畅。
theological_decisions:
- issue: 新妇与城的关系
  choice: 按拉丁文并列呈现“新妇”与“正在显现的城”，不明说二者是否同一
  alternative: 将新妇直接解释为城，或合并为“作为新妇的城”
  rationale: 拉丁文本措辞简约，未明确说明二者关系；译文应保留这种启示文学意象中的张力。
- issue: apparescens civitas 的文本处理
  choice: 译为“那正在显现的城”
  alternative: 依据推定的希腊文译为“如今隐藏的城将要显现”
  rationale: 指定底本明确作 apparescens civitas，故以现存拉丁文为翻译依据，不把文本重构写入正文。
- issue: 末句被隐藏之物的指称
  choice: 用“如今从地上隐去的”保留未明说的指称对象
  alternative: 补成“如今隐藏的城”或其他具体对象
  rationale: 拉丁文 quae 的先行关系和意象衔接存在张力，正文不应擅自消解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“看哪”“新妇”等词保留经文语体；用分号梳理拉丁文连续并列结构，同时保留其末世启示式的节奏与含混性。
