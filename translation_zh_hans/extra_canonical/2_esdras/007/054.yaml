  text: 'dixi: domine, quomodo poterit? Et dixit ad me: non hoc solummodo, sed interroga'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/054.yaml
  text: I said[a], “Lord, how can it be?” And he said to me, “Not only this, but ask—
translation:
  language: zh_hans
  text: 我说：“主啊，这怎么可能呢？”他对我说：“不但如此，你还要问——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domine
  choice: 主啊
  rationale: 保留直接呼语及其庄重语气。
- source_word: quomodo poterit?
  choice: 这怎么可能呢？
  rationale: 自然表达对前述之事如何可能的疑问；拉丁文未明说主语，中文以“这”承接上下文。
- source_word: non hoc solummodo
  choice: 不但如此
  rationale: 保留对前述内容的递进关系，不擅自补出后文。
- source_word: sed interroga
  choice: 你还要问——
  rationale: interroga 是单数命令式；因本节在动词后截断，用破折号显示句意延续。
theological_decisions:
- issue: “主”的所指
  choice: 保留“主啊”而不进一步限定身份
  alternative: 译作“我的主啊”或明确为“上帝啊”
  rationale: domine 本身可作尊称或神圣称谓；本句不宜替原文消除所指上的语境依赖。
- issue: 截句处是否补入大地及其拟人化内容
  choice: 不补入，只以破折号表示未完
  alternative: 补译“问大地，她就会告诉你”等后续内容
  rationale: 所给拉丁文本止于 interroga；后续内容属于下一节或后续文本，不能并入本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。问答节奏简洁；末尾破折号忠实呈现原文在命令动词后的开放式截断。
