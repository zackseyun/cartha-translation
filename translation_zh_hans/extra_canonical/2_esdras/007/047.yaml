  text: And now I see that the age to come will bring joy to few[a], but torments to many.
translation:
  language: zh_hans
  text: 如今我明白，来世的喜乐只属于少数人，苦刑却属于许多人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来世”指“将要来到的时代”。也可译作：“如今我明白，将来时代的喜乐只属于少数人，苦刑却属于许多人。”
    reason: 说明futuri saeculi的字面范围，并保留原文中喜乐与苦刑分别归于少数和许多人的平行结构。
lexical_decisions:
- source_word: futuri saeculi
  choice: 来世
  rationale: 指“将要来到的时代”，在本段末世审判的语境中译作“来世”简洁自然，也避免误解为普通的未来世代。
- source_word: iocunditatem
  choice: 喜乐
  rationale: 表达欢欣、愉悦的状态；“喜乐”庄重而易懂，适合与后面的“苦刑”对举。
- source_word: tormenta
  choice: 苦刑
  rationale: 该词为复数名词，指痛苦或刑罚；“苦刑”保留审判语境中的惩罚意味，也避免把它误读成动词“折磨”。
- source_word: ad paucos pertinebit … multis autem
  choice: 会给少数人带来……却给许多人带来……
  rationale: 以自然汉语呈现少数人与多数人的鲜明对比，并让省略于后一分句的谓语关系清楚可辨。
theological_decisions:
- issue: 来世的喜乐与苦刑如何分配
  choice: 保留“少数人得喜乐、许多人受苦刑”的直接对比
  alternative: 弱化为仅描述不同结果，不明说人数对比
  rationale: 原文明确使用 paucos 与 multis，译文不应消解其具有张力的人数对照。
- issue: futuri saeculi 的含义
  choice: 译为“来世”
  alternative: 译为“将来的时代”
  rationale: 上下文涉及终末审判与最终结局；“来世”较符合语境，但脚注保留较贴近字面的表达。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“如今我明白”承接说话者当下所得的认识；“却”明确呈现少数与多数、喜乐与苦刑的双重对照。
