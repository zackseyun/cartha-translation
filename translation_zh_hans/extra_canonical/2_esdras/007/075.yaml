  yaml_path: translation/extra_canonical/2_esdras/007/075.yaml
  text: Before you[a], Lord, show your servant, Lord, whether after death, or now when each of us gives up his soul, whether, if we are kept, we will be kept in rest until
translation:
  language: zh_hans
  text: 主啊，在你面前，求你向你的仆人显明，主啊：是在死后，还是在如今我们各自交还自己灵魂的时候，我们是否必会蒙保守，得享安息，直到……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram te
  choice: 在你面前
  rationale: 按拉丁文保留空间性或关系性的表达，不擅自补成“若我在你面前蒙恩”等原文此片段没有的内容。
- source_word: reddimus unusquisque animam suam
  choice: 我们各自交还自己灵魂
  rationale: reddere 有“交还、归还”之意；采用“交还”既体现生命归还的意象，也避免只译作较弱的“失去生命”。
- source_word: in requie
  choice: 在安息中
  rationale: requies 指停止劳苦、安歇的状态；“安息”庄重自然，也保留其末世语境可能具有的神学分量。
- source_word: donec
  choice: 直到……
  rationale: 原始资料在 donec 处中断，因此保留未完结构，不从后文补足宾语或事件。
theological_decisions:
- issue: conseruati conseruabimur 的重复和语气
  choice: 我们若蒙保守，是否会在安息中一直蒙保守
  alternative: 我们是否必会蒙保守，安息等候
  rationale: 拉丁文以完成分词和将来被动式重复同一词根，既可读作条件结构，也可能带强调意味。正文保留条件性和词根重复，脚注说明强调式理解，不把死后状态的确定性预先定死。
- issue: 死后与交还灵魂之时的关系
  choice: 是在死后，还是在如今……的时候
  alternative: 死后，也就是如今……的时候
  rationale: vel 通常表达选择或并列。正文保留“还是”所呈现的张力，不把两者无依据地解释为完全同义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主啊”按原文重复两次；分号帮助读者辨明两个间接问句。末尾以省略号明确反映现存拉丁文片段未完，不补入本节后续内容。
