review_pass:
  verdict: revise
  source_fidelity: “在你面前”和“交还自己灵魂”基本贴合 coram te 与 reddimus ... animam suam，且以“直到……”保留 donec 处的残缺。可是正文将 si conseruati conseruabimur 定为条件句，并用“若蒙保守……一直蒙保守”处理，既未充分体现将来式 conseruabimur，也使重复显得不自然。该重复更适宜按强调性结构译出，同时以脚注保留字面条件式的可能性。
  naturalness: 原文的两个“主啊”都应保留，但现有“主啊，在你面前，主啊，求你……”在现代汉语中断裂感较强。调整呼语位置后可保持庄重、自然，并不删减重复。
  terminology: “安息”“仆人”“灵魂”均合乎本段庄重语域。“交还自己的灵魂”可保留，以反映 reddere 的归还意象。
  issues:
