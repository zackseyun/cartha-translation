    issue: conseruati conseruabimur 的译法未表达将来和强调
    rationale: conseruabimur 是将来被动式；与同根完成分词并列的重复可表达强化。正文“若蒙保守，是否会……蒙保守”虽保留一种字面分析，却不够清楚地传达“必会／确实会”的强调。
  - severity: low
    issue: 重复呼语的汉语语序不够顺畅
    rationale: 保留两次 domine 是必要的，但可将第二个呼语置于“仆人”后，以减少连续插入语造成的阻滞。
  - severity: low
    issue: 脚注的替代译文“安息等候”补入了原片段未明说的动作
    rationale: in requie 是“在安息中”，而“等候”主要由未完成的 donec 结构引发，不宜在脚注替代译文中作为已明示内容加入。
