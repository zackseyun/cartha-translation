  yaml_path: translation/extra_canonical/2_esdras/007/073.yaml
  text: They have defrauded her whom they received. And what will they have to say in the judgment[a], or how will they answer in the last times?
translation:
  language: zh_hans
  text: 他们欺骗了自己所领受的那一位。他们在审判中又[a]有什么可说的呢？在末后的日子，他们将怎样回答呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，他们有什么可说的呢？”
    reason: 说明 Et quid 可按语境译为带推论色彩的“那么”；正文以“又”保留其通常的并列连接语气。
lexical_decisions:
- source_word: fraudauerunt
  choice: 欺骗了
  rationale: 该动词表示以欺诈或不忠的方式对待；译作“欺骗了”保留其直接宾语结构，也不把含义缩窄为金钱上的侵占。
- source_word: eam quam acceperunt
  choice: 自己所领受的她
  rationale: 拉丁文以阴性代词 eam 指代前文某一阴性对象；正文保留“她”的拟人化和指代张力，不擅自明说为“律法”或“智慧”。
- source_word: in iudicio
  choice: 到了审判的时候
  rationale: 兼顾拉丁文介词结构与自然汉语，表达他们在审判中面对质问的处境。
- source_word: in novissimis temporibus
  choice: 在末后的时期
  rationale: 较贴近复数 temporibus，同时保留末世性表达，不强行解释为某个单一时刻。
theological_decisions:
- issue: 阴性代词 eam 的所指
  choice: 保留为“她”
  alternative: 译明为“律法”或其他前文对象
  rationale: 本节拉丁文本身只使用代词；明确补出所指会消除原文保留的语篇依赖和可能的拟人意味。
- issue: Et quid 的连接语气
  choice: “他们又有什么”
  alternative: “那么，他们有什么”
  rationale: Et 首先是并列连接词；用“又”自然地保留连续追问的并列风格，而不把它解释为较强的推论关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。两个反问句分别呈现“可说什么”和“怎样回答”，保留原文的递进与末世审判张力；“她”刻意保留原文阴性代词的拟人化表达。
