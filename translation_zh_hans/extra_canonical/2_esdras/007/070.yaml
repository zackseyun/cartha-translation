  text: 'Et respondit ad me et dixit: et quando Altissimus faciens faciebat saeculum, Adam et omnes qui cum eo uenerunt, primum praeparauit iudicium et quae sunt iudicii.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/070.yaml
  text: And he answered me and said[a], “When the Most High was making the age, he first prepared judgment and the things of judgment for Adam and all who came with him.”
translation:
  language: zh_hans
  text: 他回答我说：“至高者创造世代的时候，先为亚当和所有与他一同来到的人[a]预备了审判和审判的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有传本作“从他而来的人”。
    reason: 说明“从他而来”这一异文传统，同时以拉丁底本 cum eo 的“与他一同”作为正文。
lexical_decisions:
- source_word: Altissimus
  choice: 至高者
  rationale: 沿用圣经语体中自然、庄重的称谓，准确表达最高至上者。
- source_word: saeculum
  choice: 这世代
  rationale: 拉丁词可指时代、世代或世界；此处保留其时间维度，不径自解释为物质世界。
- source_word: cum eo uenerunt
  choice: 与他一同来到的人
  rationale: 直接反映底本 cum eo（与他一起），不采用缺乏本拉丁底本支持的“从他而来”。
- source_word: iudicium et quae sunt iudicii
  choice: 审判，以及审判所涉及的一切
  rationale: 既保留“审判”与其相关事项的并列，又避免生硬直译“审判的事物”。
- source_word: praeparauit
  choice: 预备了
  rationale: 准确表达事先安排、备妥之意，并与“先”共同呈现 primum 的语义。
theological_decisions:
- issue: 亚当与后来之人的关系
  choice: 与他一同来到的人
  alternative: 从他而来的人
  rationale: 拉丁底本明确作 cum eo，而不是 ex eo 或 ab eo；正文不以神学或谱系上的合理化取代底本文义。
- issue: “审判所涉及的一切”的具体所指
  choice: 保持概括表达
  alternative: 解释为刑罚、程序或审判工具
  rationale: 原文 quae sunt iudicii 本身宽泛，译文不将其限定为某一种审判内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“与他一同来到”虽在语义上略显突兀，但这是拉丁底本的真实表述，故不在正文中改写为较顺畅却非底本所载的谱系关系。
