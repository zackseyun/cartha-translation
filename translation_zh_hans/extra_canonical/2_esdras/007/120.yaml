review_pass:
  verdict: revise
  source_fidelity: “永恒的盼望”和“已经预告给我们”准确传达 perennis spes 与 praedicta est nobis。可是“全然虚空”把 pessime 的强烈程度处理成“完全”，且用于“我们变得……”在现代汉语中稍显生硬；原词更自然的重点是人变得空虚、徒然、无益，而非断言其绝对不存在或毫无价值。
  naturalness: 原句的“既然……我们却……了吗？”可理解，但省略的反诘连接在中文中略突兀。“我们却变得如此徒然无益了吗？”保留拉丁文的反诘、省略感和对比，同时更合现代书面汉语。
  terminology: “盼望”应保留，不宜改作“应许”。“徒然无益”恰当地表达 vani 在此的空虚／徒劳语义，避免“虚荣”的现代联想；“如此”表达 pessime 的强烈程度，较“全然”不易造成全称化。
  issues:
  - severity: medium
    issue: “全然虚空”对 pessime vani 的程度和汉语搭配均不够理想。
    rationale: pessime 是强烈程度副词，并非严格的“完全”；且“人变得全然虚空”不如“变得如此徒然无益”自然。后者也更清楚避免把 vani 误解为爱慕虚荣。
  revised_text: 既然永恒的盼望已经预告给我们，我们却变得如此徒然无益了吗？[a]
