  text: Et quoniam praedicta est nobis perennis spes, nos vero pessime vani facti sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/120.yaml
  text: And if everlasting hope has been foretold to us[a], but we have become utterly vain?
translation:
  language: zh_hans
  text: 既然永恒的盼望已经预告给我们，我们却变得如此徒然无益了吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “徒然无益”也可译作“极其空虚”。
    reason: 说明拉丁语 pessime vani 可指极其空虚、徒然或无益；此处不宜理解为“虚荣”，也不应强化为对人绝对价值的断言。
lexical_decisions:
- source_word: quoniam
  choice: 既然
  rationale: 在疑问句中表达基于已述事实而发出的追问；拉丁词也可作“因为”，但“既然”更符合现代汉语句法。
- source_word: praedicta est nobis
  choice: 已经预告给我们
  rationale: 保留被动结构及 nobis 的受益、指向含义，不擅自改成“应许”。
- source_word: perennis spes
  choice: 永恒的盼望
  rationale: perennis 表示恒久、长存；“盼望”符合经文语体，也保留客观所盼之事与主观期待之间的张力。
- source_word: pessime vani facti sumus
  choice: 我们却变得全然虚空了
  rationale: vani 的核心意象是空虚、徒然，而非现代汉语中偏指浮夸不实的“虚荣”；pessime 在此加强程度，译作“全然”。
theological_decisions:
- issue: “永恒的盼望”是否译作带有明确盟约色彩的“应许”
  choice: 盼望
  alternative: 永恒的应许
  rationale: 原文是 spes（盼望），并非 promissio（应许）；保留原词可避免把预告的内容和预告行为合并。
- issue: vani 是否解释为道德上的败坏或没有价值
  choice: 虚空
  alternative: 徒然无益
  rationale: “虚空”保留原词关于空洞、落空和无实质的语义张力，不将其强化为对人的绝对价值判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“既然……却……”清楚呈现原句的反差和疑问语气；避免使用容易被理解为爱慕虚荣的“虚妄”或“虚荣”。
