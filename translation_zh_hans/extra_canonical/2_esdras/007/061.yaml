  to: 我不会为那些已经灭亡的众人悲伤[a]，因为他们正是那些被比作水汽和火焰、又被与烟雾相比，并且曾熊熊燃烧的人。
  rationale: 修订以“曾熊熊燃烧”对应 exarserunt，避免“焚尽”所添加的烧完结果，同时保留完成动作的语感。调整语序使强调结构和两个比较关系在现代普通话中更自然。脚注改为真实反映既有另一分组，并不把该分组当作正文的来源判断。
