  text: nominatum est; Et non contristabor super multitudinem eorum qui perierunt, ipsi enim sunt qui uapori assimilati sunt et flammae, fumo adaequati sunt et exarserunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/061.yaml
  text: And I will not grieve over the multitude of those who have perished[a], for they are the ones who have been made like vapor and likened to flame, compared to smoke, and have burned up.
translation:
  language: zh_hans
  text: 我不会为那些已经灭亡的众人悲伤[a]，因为他们正是那些被比作水汽和火焰、又被与烟雾相比，并且曾熊熊燃烧的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另译：“因为他们像水汽，又被拿来与火焰和烟雾相比。”
    reason: 保留英文审校轨迹中已有的另一种断句／分组；但正文遵循现存拉丁文句法，将“水汽和火焰”同归于第一项比较，将“烟雾”归于第二项。
lexical_decisions:
- source_word: contristabor
  choice: 我不会……悲伤
  rationale: 保留第一人称将来时的否定语气；现代汉语用“不会”自然表达。
- source_word: multitudinem eorum qui perierunt
  choice: 那许多已经灭亡的人
  rationale: 以“已经灭亡”体现拉丁语完成时，并用“许多……的人”自然传达 multitudinem。
- source_word: uapori
  choice: 水汽
  rationale: 既表达 vapor 短暂、消散的意象，也比“蒸汽”更适合庄重经文语体。
- source_word: flammae
  choice: 火焰
  rationale: 直接对应 flamma，保留与水汽并列的原文句法。
- source_word: fumo
  choice: 烟雾
  rationale: 直接对应 fumus，并与第二个比较表达相连。
- source_word: exarserunt
  choice: 已经焚尽
  rationale: 表达猛烈燃烧所导致的烧尽，并保留完成体；不添加“熄灭”等原文未明说的过程。
theological_decisions:
- issue: 灭亡者与水汽、火焰、烟雾之间的句法关系
  choice: 正文按拉丁语现存句法，将“水汽和火焰”归于第一组比较，将“烟雾”归于第二组比较
  alternative: 将“火焰和烟雾”并为一组，或笼统译为“他们像水汽、火焰和烟雾”
  rationale: uapori assimilati sunt et flammae 将两个与格名词并列于 assimilati sunt，而 fumo adaequati sunt 另成一组；应保留这种结构，不以神学解释重组意象。
- issue: “已经焚尽”是否暗示彻底消灭
  choice: 仅按 exarserunt 译出燃烧至焚尽的图像，不作教义性扩展
  alternative: 译作“永远消灭”或补出“熄灭”
  rationale: 原文提供燃烧意象，却未在本句明确界定其完整末世论含义；应保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正是那些”对应 ipsi enim sunt qui 的强调结构；重复“被比作”以清楚呈现拉丁语两组比较关系。
