  text: seducat a uita in mortem. Secundus ordo, quoniam uident complicationem, in qua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/093.yaml
  text: 'The second order: because they see the entanglement in which the souls of the ungodly wander[a], and the punishment that awaits them.'
translation:
  language: zh_hans
  text: 第二种情形：他们看见不敬虔者的灵魂游荡其中的错综困局[a]，也看见等待这些灵魂的刑罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“困惑之境”。
    reason: complicatio 可侧重复杂纠结的处境，也可引申为困惑；正文保留较强的缠结、迷失意象，脚注呈现另一可能。
lexical_decisions:
- source_word: Secundus ordo
  choice: 第二种情形
  rationale: ordo 在此指亡者经历中依次列出的第二项情形或层面；译作“情形”比生硬的“次序”更符合现代汉语上下文。
- source_word: complicationem
  choice: 错综困局
  rationale: 该词有折叠、缠结、复杂纠葛之意，并与表示“游荡”的动词搭配；“错综困局”既保留空间性的纠缠意象，也不把含义缩减为纯心理上的困惑。
- source_word: uagantur
  choice: 游荡
  rationale: 保留其无定向徘徊的空间性含义，并与“错综困局”自然搭配。
- source_word: animae impiorum
  choice: 不敬虔者的灵魂
  rationale: impiorum 指对神不敬虔的人；“灵魂”直接对应 animae，并符合本段死后状态的语境。
- source_word: poenam quae manet eos
  choice: 等待这些灵魂的刑罚
  rationale: 保留刑罚尚在前方等候他们的表达；补明“这些灵魂”以消除汉语代词指向不清，但不改变所指。
theological_decisions:
- issue: 不敬虔者死后灵魂所处状态的描述
  choice: 按原文保留“游荡于错综困局”及未来刑罚的并列表述
  alternative: 将其解释为灵魂主观上的困惑或特定教义中的固定刑罚阶段
  rationale: 原文兼有空间性纠缠与可能的心理困惑，且未界定完整的死后状态体系，因此不作宗派性细化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“错综困局”略带文学色彩，用来保存拉丁文 complicationem 与“游荡”结合所形成的纠缠、迷失意象。
