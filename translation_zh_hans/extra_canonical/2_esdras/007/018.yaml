  yaml_path: translation/extra_canonical/2_esdras/007/018.yaml
  text: But the righteous will endure narrow things[a], hoping for broad things[b]; for those who have acted ungodly have both suffered narrowness and not seen the broad things.
translation:
  language: zh_hans
  text: 但义人将忍受狭窄[a]，盼望宽广[b]；因为那些行事不敬虔的人，既受过狭窄，也没有见到宽广。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狭窄”也可译作“困苦”；这里保留空间意象，与下文“宽广”相对。
    reason: 说明直译所保留的隐喻及自然汉语替代译法。
  - marker: b
    text: “宽广”也可译作“宽阔之境”；原文没有明确说明具体所指。
    reason: 保留实词化形容词的含混性，避免过度解释。
lexical_decisions:
- source_word: iusti
  choice: 义人
  rationale: 准确表达“公义的人”，并符合现代汉语宗教文献的庄重语体。
- source_word: ferent
  choice: 会忍受
  rationale: 保留将来时意味，并传达承受艰难处境之意。
- source_word: angusta / angustiam
  choice: 狭窄 / 狭窄之苦
  rationale: 维持原文与 spatiosa 构成的空间隐喻和词汇呼应；后者用“之苦”使汉语自然，同时不丢失“狭窄”意象。
- source_word: sperantes
  choice: 盼望
  rationale: 表达带着期待而忍受的持续姿态。
- source_word: spatiosa
  choice: 宽广
  rationale: 与“狭窄”形成鲜明而一致的空间对照，并保留实词化形容词所指内容未明的特点。
- source_word: qui enim impie gesserunt
  choice: 因为那些行事不敬虔的人
  rationale: 保留 enim 的因果衔接，并将 impie gesserunt 译为行为层面的“不敬虔”，不额外限定具体罪行。
- source_word: et... et...
  choice: 既……也……
  rationale: 再现拉丁文关联结构所强调的双重结局。
- source_word: non viderunt
  choice: 没有见到
  rationale: 直译视觉动词，保留原文“见到宽广”的空间意象。
theological_decisions:
- issue: “狭窄”与“宽广”的所指
  choice: 保留空间隐喻，不解释为今世苦难、末世福乐或救恩
  alternative: 直接译作“苦难”与“福乐”
  rationale: 原文以 substantivized adjectives 保持概括和含混；明说其神学所指会超出文本。
- issue: 恶人的双重经历
  choice: 译作“既受过狭窄之苦，也没有见到宽广”
  alternative: 译作“也曾受苦，却没有见到宽广”
  rationale: 保留 et...et... 的并列强调，不把第二项改写成原文未明示的转折关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“狭窄／宽广”贯穿全节，保留拉丁文刻意设置的空间对照；在第二个“狭窄”处加入“之苦”，使中文句法自然，但不改换核心意象。
