source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si quis enim volens voluerit ingredi mare videre eum vel dominari eius, si non transierit angustum, in latitudinem venire quomodo poterit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/005.yaml
  text: For if anyone desires to enter the sea[a], to see it or to master it, how will he be able to come into the broad place unless he passes through the narrow place?
translation:
  language: zh_hans
  text: 因为，若有人想进入大海，看见它或掌控它，若不经过那狭窄之处，怎能到达宽阔之地呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: volens voluerit
  choice: 想
  rationale: 这一叠用表达意愿；现代汉语以“想”自然传达其义，不机械重复，也不额外强化为“迫切想要”。
- source_word: ingredi mare
  choice: 进入大海
  rationale: 保留拉丁文中“进入”的宾语“海”，并采用自然的现代汉语搭配。
- source_word: videre eum
  choice: 亲眼看看它
  rationale: eum按上下文回指mare；“亲眼看看”自然表达进入海中而观看它的意思。
- source_word: dominari eius
  choice: 掌控它
  rationale: dominari加属格表示支配、控制；“掌控”比“征服”少添军事色彩，也比“统治”更适用于海。
- source_word: angustum
  choice: 狭窄之处
  rationale: 原文为中性形容词名词化，所指地点未明说，译作“狭窄之处”保留这种概括性。
- source_word: in latitudinem
  choice: 到达宽阔之地
  rationale: 将名词latitudo的空间意义译为“宽阔之地”，并与前文“狭窄之处”形成对照。
theological_decisions:
- issue: 狭窄与宽阔的比喻是否应在译文中解释为特定救恩教义
  choice: 保留空间比喻，不在正文中作神学释义
  alternative: 译成“经过艰难才能进入救恩的宽广境地”
  rationale: 本节自身仅陈述进入宽阔之地须经过狭窄之处；具体神学所指应由上下文呈现，不宜在翻译中预先限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；保留原文反问句及“狭窄—宽阔”的鲜明对照。
