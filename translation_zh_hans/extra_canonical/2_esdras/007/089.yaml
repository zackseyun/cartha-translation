source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: runt Altissimi ordo est hic, quando incipient seruari a uaso corruptibili. In eo tempore commoratae seruierunt cum labore Altissimo, et omni hora sustinuerunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/089.yaml
  text: This is the order of the Most High, when they began to be kept from the corruptible vessel. In that time they dwelt in it, they served the Most High with labor, and every hour they endured danger, so that they might perfectly keep the law of the Lawgiver.
translation:
  language: zh_hans
  text: 他们住在其中的日子，曾辛劳地事奉至高者，时时忍受危险，为要完全遵守立法者的律法。这就是至高者所定的次序：当他们开始蒙保守，脱离那必朽的器皿[a]时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必朽的器皿”指人现今会死亡、会朽坏的身体。
    reason: 帮助普通读者理解原文保留的器皿隐喻，而不在正文中将其扁平化。
lexical_decisions:
- source_word: Altissimi ordo
  choice: 至高者所定的次序
  rationale: “ordo”可指次序、安排或等次；结合上下文，以“所定的次序”自然表达其由至高者规定的含义，同时不把它具体化为某种教义体系。
- source_word: uaso corruptibili
  choice: 必朽的器皿
  rationale: 保留拉丁文以“器皿”指身体的隐喻；“必朽”准确传达 corruptibilis 的可败坏、会朽坏之意。
- source_word: commoratae
  choice: 居住
  rationale: 按灵魂寓居于器皿中的语境处理，既保留原文的居留意味，也避免直接把隐喻释成“活在肉身中”。
- source_word: cum labore
  choice: 辛劳地
  rationale: 表达带着劳苦、付出艰辛事奉的意思，符合现代汉语表达。
- source_word: omni hora sustinuerunt
  choice: 时时忍受危险
  rationale: “时时”对应 omni hora；sustinuerunt 表示承受、忍耐。宾语“危险”见审校英文层，补足所给拉丁片段末尾悬空的及物含义。
- source_word: legem legislatoris
  choice: 立法者的律法
  rationale: 保留“律法—立法者”的词根呼应，不将“立法者”直接解释为某一特定称谓。
theological_decisions:
- issue: “必朽的器皿”所指为何
  choice: 正文保留身体作为器皿的隐喻，并以脚注说明
  alternative: 直接译作“必朽的身体”
  rationale: 隐喻本身承载了灵魂与现世身体之关系的表达；直接改成“身体”虽清楚，却会抹平原文意象。
- issue: “完全遵守”是否暗示绝对无罪
  choice: 保留“完全遵守”而不作教义化解释
  alternative: 弱化为“忠心遵守”
  rationale: 审校英文层明确有 perfectly，且此处是在描述义人的志向与持守；译文不应自行消解其神学张力。
- issue: “开始脱离”还是“开始被保守、免受”
  choice: 译作“开始脱离”
  alternative: “开始得蒙保守，免受必朽器皿的影响”
  rationale: 所给拉丁 seruari 字面可作“被保存”，但上下文和审校英文反映的是与必朽身体分离的过程；“脱离”较符合该段论灵魂离身后次序的语境，同时脚注提示文本表达。
translation_notes:
  register: 采用庄重而现代的叙述语体。“至高者”“律法”“立法者”保留经文语域；句法经过适度调整，使长句在现代普通话中清楚顺畅。所给拉丁文本开头有残缺的“runt”，结尾也停在 sustinuerunt；正文参照可辨识的拉丁内容及经审校的英文咨询层补足完整句意。
