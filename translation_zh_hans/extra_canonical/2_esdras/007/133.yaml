  text: and compassionate, because he shows compassion to those who turn back to his law,
translation:
  language: zh_hans
  text: 又满有怜悯，因为他怜悯那些回转归向他律法的人，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: miserator
  choice: 有怜悯
  rationale: 保留拉丁文表示施怜悯者或富有怜悯这一性质的表达，并使其能自然承接上下文的并列结构。
- source_word: miseretur
  choice: 怜悯
  rationale: 用同一词根的重复对应拉丁文 miserator / miseretur，保留原文的修辞呼应。
- source_word: conversionem faciunt
  choice: 回转归向
  rationale: 表达悔改、转回的动作，同时避免把含义缩限为单纯改变想法。
- source_word: in lege eius
  choice: 归向他律法
  rationale: 此处 in 与回转表达结合，可自然理解为转向并归入其律法所指引的道路；用“归向”呈现其方向性，同时保留“律法”。
theological_decisions:
- issue: 回转与律法之间的关系
  choice: 那些回转归向他律法的人
  alternative: 那些在他律法中悔改的人
  rationale: 拉丁文 conversionem faciunt in lege eius 可有“归向他的律法”或“在他的律法中回转”的理解；正文采用较自然且与英语审校层一致的方向性表达，不额外加入得救条件等神学解释。
translation_notes:
  register: 采用庄重而易懂的现代汉语。“又”用于承接本段连续列举的神性属性；句末逗号保留其作为长句中一项的未完结构。
