  yaml_path: translation/extra_canonical/2_esdras/007/050.yaml
  text: For this reason the Most High did not make one age, but two.
translation:
  language: zh_hans
  text: 正因如此，至高者所造的时代[a]不是一个，而是两个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时代”也可译作“世界”；这里指现今与将来的两个时代。
    reason: 拉丁文 saeculum 可兼具时间性的“时代”和秩序性的“世界”之意。
lexical_decisions:
- source_word: Propter hoc
  choice: 正因如此
  rationale: 直接表达前文所述事实所引出的因果关系，并保留强调语气。
- source_word: Altissimus
  choice: 至高者
  rationale: 这是对上帝的尊称，既贴近拉丁文含义，也符合庄重而自然的现代汉语。
- source_word: saeculum
  choice: 时代
  rationale: 此处指彼此有别的两个时代，即现今与将来的秩序；“时代”比“世界”更能保留其时间层面的含义。
- source_word: non ... unum ... sed duo
  choice: 不是一个，而是两个
  rationale: 保留原文鲜明的否定—转折对照结构。
- source_word: fecit
  choice: 所造的
  rationale: 将“创造、造成”的动作自然地纳入汉语定语结构，同时明确两个时代出于至高者的创造安排。
theological_decisions:
- issue: saeculum 所指的是“时代”还是“世界”
  choice: 时代
  alternative: 世界
  rationale: 上下文的末世论张力集中于现今时代与将来时代的区分；采用“时代”避免把原文过早具体化为两个空间性的世界，同时以脚注保留另一种可能译法。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“所造的时代不是一个，而是两个”既自然清楚，又保留原文的对照与神学张力。所提供的拉丁文片段止于 Altissimus；本节后半句依据该版本所对应的完整经文及经审校的英语咨询层呈现。
