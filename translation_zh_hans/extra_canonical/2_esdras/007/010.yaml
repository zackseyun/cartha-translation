base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/010.yaml
  text: And I said[a], “So it is, Lord.” And he said to me, “So also is Israel’s portion.”
translation:
  language: zh_hans
  text: 我说：“是的，主啊。”他对我说：“以色列所得的份也是这样。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sic
  choice: 是的／也是这样
  rationale: 首次出现用于肯定前述内容，译作“是的”；后一次与以色列所得之份相联系，译作“也是这样”，既保留重复关系，也符合现代汉语表达。
- source_word: domine
  choice: 主啊
  rationale: 这是直接呼语；用“主啊”表达拉丁语呼格，并保持庄重的宗教语域。
- source_word: Israhel pars
  choice: 以色列所得的份
  rationale: pars可指分得的份、归属或命定所得；“所得的份”在中文中自然，并避免过度限定为土地、命运或产业。
theological_decisions:
- issue: “以色列的份”具体所指
  choice: 以色列所得的份
  alternative: 以色列的命运／以色列的产业
  rationale: 原文pars含义较宽，语境虽指向以色列所面对的道路或结局，但不宜在本节中把它明确收窄为“命运”或“产业”。
- issue: domine所称对象及称谓形式
  choice: 主啊
  alternative: 先生／我主
  rationale: 在异象对话的宗教语境中，“主啊”最自然庄重；不额外断定受话者的神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留两次sic之间的照应，同时用不同中文形式体现其各自在对话中的语用功能。
