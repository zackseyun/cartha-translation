  text: Say to it, ‘You produce gold and silver and bronze, and iron also and lead and clay;
translation:
  language: zh_hans
  text: 你要对大地说：“你出产金、银、铜，也出产铁、铅和陶土；”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terrae
  choice: 大地
  rationale: 此处指受造的土地，并被拟人化为听话者；“大地”比单说“地”更自然清楚。
- source_word: creas
  choice: 出产
  rationale: 拉丁词本义为“创造、产生”；用于大地与金属、陶土的关系时，“出产”符合现代汉语，也避免暗示大地具有神圣的创造权。
- source_word: aes
  choice: 铜
  rationale: 该词可泛指铜或铜合金；此处列举原材料，译作较宽泛的“铜”，不强行限定为青铜。
- source_word: argillam
  choice: 陶土
  rationale: 指可塑的黏土；“陶土”既通俗，也能与作为整体的“大地”区分。
theological_decisions: []
