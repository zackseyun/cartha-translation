  source_fidelity: “主”并非拉丁文 qui plasmauit eas 所明载，虽上下文指向造物者，仍不宜在正文补入称号。“第三重”可理解，但此处 ordo 是列举的类别，译为“第三类”更自然。正文应更清楚地将见证的内容与“他们活着时遵守律法”连接起来。
  naturalness: 原译基本通顺，但“那位塑造他们的主为他们所作的见证，就是……”定语链较长，且“就是”容易使句子关系含混。改为“创造他们的那一位为他们所作的见证：……”更符合现代汉语的庄重表达。
  terminology: 以“创造他们的那一位”对应 qui plasmauit eas，既保留造物意象，又避免无来源补入“主”。“交托给他们的律法”可表达所给律法及 in fidem 所涉及的托付语义；不将其教义化为“凭信心”。
