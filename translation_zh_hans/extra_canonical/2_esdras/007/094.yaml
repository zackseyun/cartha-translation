  text: uagantur impiorum animae, et quae in eis manet punitio. Tertius ordo, uidentes testimonium quod testificatus est eis qui plasmauit eas, quoniam uiuentes serua-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/094.yaml
  text: 'The third order: seeing the testimony that he who formed them bore concerning them[a], that while they lived they kept the law that was entrusted to them.'
translation:
  language: zh_hans
  text: 第三类：他们看见创造他们的那一位为他们所作的见证：他们活着的时候，遵守了交托给他们的律法。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他们所作的见证”也可译作“向他们所作的见证”。
    reason: 拉丁文 eis 的语法关系有歧义；可理解为造物者为这些人作见证，也可理解为向他们作见证。
lexical_decisions:
- source_word: Tertius ordo
  choice: 第三重
  rationale: ordo在此指一系列体验或层次中的一项；“第三重”既保留枚举结构，也比生硬的“第三秩序”更符合现代汉语。
- source_word: uidentes
  choice: 他们看见
  rationale: 保留拉丁文分词所表达的“看见”，不改写成因果关系。
- source_word: qui plasmauit eas
  choice: 那位塑造他们的主
  rationale: plasmare指塑造、造就；补出“主”以自然指称施造者，同时不采用带特定宗派色彩的称谓。
- source_word: testimonium quod testificatus est eis
  choice: 为他们所作的见证
  rationale: 既表达testimonium/testificatus的同根强调，也体现eis与这些灵魂的关系；该与格也可能理解为“向他们”。
- source_word: seruauerunt legem quae data est eis in fidem
  choice: 遵守了交托给他们的律法
  rationale: 按该句在残篇续文中的完整措辞表达；in fidem在此具有托付、交托保守之意，不将其窄化为抽象的“信心”。
theological_decisions:
- issue: 见证是“为他们”还是“向他们”作的
  choice: 为他们所作的见证
  alternative: 向他们所作的见证
  rationale: 拉丁文eis可作利益与格，也可作间接受词。上下文描述义人看见造物主对其生前守法的认可，因此正文采用“为他们”，脚注保留另一种语法可能。
- issue: in fidem的含义
  choice: 交托给他们
  alternative: 凭信心赐给他们
  rationale: 此处与“遵守律法”连用，更自然地指受托持守；避免把语义未经证明地限定为有关称义或主观信心的教义陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第三重”承接上下文的分项结构；整句保留“看见”的结构变化及见证内容的同位说明。
