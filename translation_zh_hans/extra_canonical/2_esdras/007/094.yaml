    rationale: 拉丁文仅称“那位塑造/创造他们的”，没有 dominus 一类称号。即使语境所指明确，也应避免将推定的神学称谓写入译文。
  - severity: low
    issue: “第三重”对 ordo 的汉语搭配不够自然
    rationale: 此处是连续列举的类别或层次；“第三类”更清晰自然，且不改变结构含义。
  - severity: low
