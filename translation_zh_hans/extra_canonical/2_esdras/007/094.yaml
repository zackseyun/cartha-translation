  to: 第三类：他们看见创造他们的那一位为他们所作的见证：他们活着的时候，遵守了交托给他们的律法。[a]
  rationale: 修订删除原文未明载的“主”，将 ordo 译为更自然的“类”，并调整标点和语序以清楚呈现“见证”及其内容。保留 uidentes 的“看见”结构、plasmauit 的造物含义，以及律法被交托给他们的表达；脚注继续保留 eis 的语法歧义。
