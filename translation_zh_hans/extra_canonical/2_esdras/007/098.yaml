  text: incipient stellarum adsimilarí lumini, amodo non corrupti. Septimus ordo, qui est omnibus supradictis maior, quoniam exultabunt cum fiducia et quoniam confidebunt non confusi, et gaudebunt non reuerentes, festinant enim uidere uultum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/098.yaml
  text: 'The seventh order[a], which is greater than all the orders mentioned above: they will exult with confidence, and trust without being put to shame, and rejoice without fear, for they hasten to see the face of him whom they served while living, and from whom they, being glorified, are to receive their reward.'
translation:
  language: zh_hans
  text: 第七个等级[a]，比以上所说的一切都更为崇高：他们必满怀信心地欢腾，信靠而不至蒙羞，喜乐而毫无惧怕；因为他们急切地要看见那一位的面容——他们活着时曾服侍他，并且要在荣耀中从他领受赏赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等级”也可译作“次序”或“类别”。
    reason: 拉丁语 ordo 可指次序、等级或类别；此处为依次列举的第七项，故正文以“等级”呈现其分类与排序含义。
lexical_decisions:
- source_word: ordo
  choice: 境况
  rationale: 这里承接前文对灵魂死后经历的分项描述，所指不只是人的等级，也包括其所处的阶段或状态；“境况”在现代汉语中较自然，同时保留分类意味。
- source_word: exultabunt cum fiducia
  choice: 满怀信心地欢腾
  rationale: 兼顾 exultabunt 的强烈喜乐和 cum fiducia 的坦然、确信之意。
- source_word: confidebunt non confusi
  choice: 信靠而不至蒙羞
  rationale: confidere 表示信靠或确信；confundi 在此更接近因盼望落空而蒙羞，而非单纯的困惑。
- source_word: gaudebunt non reuerentes
  choice: 喜乐而毫无惧怕
  rationale: reuereri 可指敬畏、畏惧；此处与坦然见那位的面相连，译作“惧怕”最符合语境。
- source_word: festinant
  choice: 急切地
  rationale: 表达迫切趋向目标，不必机械译成身体动作上的“赶快”。
- source_word: uultum
  choice: 面
  rationale: 保留原文“看见……的面”这一庄重而具神学张力的表达，不改写为较抽象的“见到他”。
- source_word: gloriosi
  choice: 他们得了荣耀以后
  rationale: 依拉丁语主格复数，修饰领受赏赐的人，而不是修饰宾格单数的“赏赐”；用时间性表达使汉语关系清楚，但不把荣耀转移到赏赐上。
- source_word: mercedem
  choice: 赏赐
  rationale: 既可表达服侍之后所得的报偿，也符合宗教语境中的庄重用法，避免“工资”的世俗色彩。
theological_decisions:
- issue: “得荣耀”修饰谁
  choice: 译为领受者“他们得了荣耀以后”
  alternative: 译为“领受荣耀的赏赐”
  rationale: gloriosi 为主格复数，语法上描述“他们”；mercedem 为宾格单数，不能由 gloriosi 直接修饰。
- issue: “看见那位的面”的指称
  choice: 保留“那位”，不在正文中明说为上帝或基督
  alternative: 译成“看见上帝的面”或“看见基督的面”
  rationale: 本句所给拉丁文只以关系性指称表达对象；为避免加入原文未明说的身份，保留其含蓄性。
- issue: “不至蒙羞”的含义
  choice: 保留信靠不会落空、不会蒙羞的表达
  alternative: 译为“毫不困惑”
  rationale: non confusi 与 confidebunt 相连，更自然地表示信靠者不被羞辱或不致失望，而非认知上的不困惑。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“看见……的面”“蒙羞”“赏赐”等具有经文色彩但仍通顺的表达；以分号呈现三组平行结构及其原因。所给拉丁文片段在 uultum 处中止；末两句依据所附经审核的英译咨询层及修订记录所保存的拉丁语法信息译出，并特别维持 gloriosi 修饰领受者的关系。
