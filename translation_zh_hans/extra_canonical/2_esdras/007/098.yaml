revisions:
- from: 第七种境况[a]比以上所说的一切都更为崇高：他们必满怀信心地欢腾，信靠而不至蒙羞，喜乐而毫无惧怕；因为他们急切地要看见那位的面。他们活着时曾服侍他；他们得了荣耀以后，要从他领受赏赐。
  to: 第七个等级[a]，比以上所说的一切都更为崇高：他们必满怀信心地欢腾，信靠而不至蒙羞，喜乐而毫无惧怕；因为他们急切地要看见那一位的面容——他们活着时曾服侍他，并且要在荣耀中从他领受赏赐。
  rationale: 修订“境况”为“等级”，以对应 septimus ordo 的排序性分类。将“那位的面”调整为“那一位的面容”，提高现代汉语自然度而不明确其身份。将“得了荣耀以后”改为“在荣耀中”，维持 gloriosi 修饰领受者的语法关系，同时避免把原文状态性表述限定为严格的时间先后。
