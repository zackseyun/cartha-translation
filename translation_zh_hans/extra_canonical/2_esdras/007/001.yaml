source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum finissem loqui verba haec, et missus est ad me angelus, qui missus fuerat ad me primis noctibus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/001.yaml
  text: And it happened, when I had finished speaking these words, that the angel who had been sent to me in the first nights was sent to me again,
translation:
  language: zh_hans
  text: 我说完这些话以后，那位最初几夜奉差遣到我这里来的天使，又奉差遣来到我这里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est cum finissem loqui verba haec
  choice: 我说完这些话以后
  rationale: 用自然的现代汉语表达拉丁文叙事衔接语，同时保留动作完成后的时间关系。
- source_word: angelus
  choice: 天使
  rationale: 采用现代中文圣经传统中通行且清楚的对应词。
- source_word: primis noctibus
  choice: 先前几夜
  rationale: 保留复数“夜”及其指向此前数夜的含义，不将其具体化为某一夜。
- source_word: missus est ... qui missus fuerat
  choice: 又奉差遣……先前……奉差遣
  rationale: 保留原文两次使用 mittere 被动式所形成的重复与呼应；以“奉差遣”自然表达未明说差遣者的被动结构。
theological_decisions:
- issue: 天使的差遣者在本节未明说
  choice: 采用“奉差遣”的被动表达，不补出差遣者
  alternative: 译作“上帝又差遣”
  rationale: 原文两处均为被动式，没有在本节明确指出施事者；不补入“上帝”，以保存原文的表达方式和潜在含义。
- issue: 同一位天使再次被差来
  choice: 以“那位天使，又奉差遣”明确同一指称与再次发生
  alternative: 仅译作“有一位天使被差来”
  rationale: 关系从句 qui missus fuerat 指明这是先前几夜已被差来的同一位天使；中文用“那位”和“又”准确呈现。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式略作汉语化调整，把时间从句置于句首，并保留原文关于“差遣”的重复、先前数夜的复数含义，以及未明说差遣者的被动表达。
