  yaml_path: translation/extra_canonical/2_esdras/007/080.yaml
  text: these spirits will not enter habitations[a], but will wander from now on in torments, always grieving and sad, in seven ways.
translation:
  language: zh_hans
  text: 这些灵魂不能进入居所[a]，反要从此在苦刑中漂泊，常常悲痛忧伤，以七种方式受苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “居所”也可译作“住处”；原文没有说明具体指何种居所。
    reason: 保留 habitationes 的语义宽度，避免读者将其误认作已经明确命名的末世地点。
lexical_decisions:
- source_word: inspirationes
  choice: 灵魂
  rationale: 此处指人死后仍存续并受审判的灵；译作“灵魂”比直译为“气息”更符合本段语境，也更自然易懂。
- source_word: habitationes
  choice: 居所
  rationale: 保留拉丁词“住所、居处”的宽泛含义，不擅自解释为某一特定的末世地点。
- source_word: per septem vias
  choice: 经历七重苦境
  rationale: “viae”字面为“道路、途径”，但下文逐项列举的是七方面的苦楚；此译既呈现七重结构，也避免生硬的“沿七条路”。
- source_word: vagabuntur
  choice: 漂泊
  rationale: 表达不得安居、持续游荡的状态。
- source_word: in tormentis
  choice: 在苦刑中
  rationale: 保留受折磨、受惩罚的强烈含义，不弱化为一般痛苦。
theological_decisions:
- issue: 死者之灵所不得进入的“居所”具体为何处
  choice: 不作具体界定，仅译“居所”
  alternative: 译为“安息之所”或“住处”
  rationale: 原词本身未明确指天堂、乐园或其他特定领域，应保留其开放性。
- issue: “七种方式”的语义性质
  choice: 译为“七重苦境”
  alternative: 较形式地译为“以七种方式”或“经过七条道路”
  rationale: 上下文紧接着逐一说明恶者所受的七重痛苦；“苦境”传达其功能，但不把七项另行教义化。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“反要”突出不能进入居所与此后漂泊受苦之间的转折；“七重苦境”自然引出后文逐项列举的“第一重”。
