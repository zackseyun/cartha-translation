  text: et revelabitur Altissimus super sedem iudicii, et pertransibunt misericordiae, et longanimitas congregabitur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/033.yaml
  text: And the Most High will be revealed upon the seat of judgment[a], and mercies will pass away, and long-suffering will be gathered up,
translation:
  language: zh_hans
  text: 至高者必在审判的宝座上显现；怜悯必消逝，宽容必被收回。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被收回”直译为“被聚拢”或“被收聚”。
    reason: 保留拉丁文 congregabitur 的字面意象及其可能歧义。
lexical_decisions:
- source_word: revelabitur
  choice: 必显现
  rationale: 保留拉丁文被动形式的基本含义，同时用现代汉语自然表达末世性的显现。
- source_word: super sedem iudicii
  choice: 在审判的宝座上
  rationale: sedes 可指座位或宝座；在至高者施行审判的语境中译作“宝座”庄重而自然。
- source_word: misericordiae
  choice: 怜悯
  rationale: 拉丁文为复数，但此处表示怜悯的施予或诸般怜悯；汉语以不可数抽象名词表达更自然。
- source_word: pertransibunt
  choice: 必消逝
  rationale: 表达“过去、不再存留”的末世语义，并与后句宽容终止相呼应。
- source_word: longanimitas
  choice: 宽容
  rationale: 此处指长久忍耐、暂缓惩罚；“宽容”比“恒忍”更符合普通现代汉语。
- source_word: congregabitur
  choice: 必被收回
  rationale: 字面为“被聚拢、收集起来”，在此与怜悯消逝并列，语境指宽容不再延续；“收回”传达该含义，同时以脚注保存字面可能。
theological_decisions:
- issue: 审判临到时怜悯与宽容的终止
  choice: 译为“怜悯必消逝，宽容必被收回”
  alternative: “诸般怜悯必过去，长久忍耐必被聚拢”
  rationale: 忠实保留经文中审判与怜悯终止之间的张力，不补入有关悔改期限或救恩秩序的教派性解释。
- issue: congregabitur 的语义
  choice: 正文采用语境义“被收回”
  alternative: 字面译作“被聚拢”或“被收聚”
  rationale: 拉丁词本身具有“聚集”之义，但在并列的剥夺性语境中很可能表达撤去、收回；用脚注保留形式上的歧义。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语；以“必”呈现未来审判的确定性，分号体现三个并列分句的结构。
