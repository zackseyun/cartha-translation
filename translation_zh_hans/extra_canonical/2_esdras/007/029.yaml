  text: And after these years, my Son the Messiah will die, and all who have human breath.
translation:
  language: zh_hans
  text: 这些年之后，我的儿子——弥赛亚将死去；凡有人的气息者也都将死去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filius meus Christus
  choice: 我的儿子弥赛亚
  rationale: “Filius meus”直译为“我的儿子”；“Christus”在此为称号，译作“弥赛亚”既表达“受膏者”之义，也与英语审校层一致。拉丁文抄本此处的大小写不决定中文神学称谓，故不以现代汉语中不自然的书面方式额外标示尊称。
- source_word: morietur
  choice: 将死去
  rationale: 保留简单将来时及“死亡”的直接陈述，不弱化为委婉说法。
- source_word: omnes qui spiramentum habent hominis
  choice: 凡有人的气息的，也都将死去
  rationale: 按拉丁文保留“人的气息”这一具体表达，并依据前一分句共享谓语“将死去”；加入“也”使汉语并列关系自然清楚。
theological_decisions:
- issue: “我的儿子弥赛亚将死去”所形成的神学张力
  choice: 直接保留死亡陈述
  alternative: 以“离去”“被取走”等措辞缓和
  rationale: 原文明确使用 morietur（将死），翻译不应因后世基督论理解而改写或消解其张力。
- issue: Christus 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 两者都可表达受膏者称号；此处采用“弥赛亚”可避免普通读者把 Christus 误读为姓名，并准确呈现其称号性质。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句法略保留原文的并列力度，同时补出后一分句省略的谓语，以免中文产生歧义。
