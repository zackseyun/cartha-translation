  yaml_path: translation/extra_canonical/2_esdras/007/069.yaml
  text: And if after death we were not coming into judgment, perhaps it would have been better for us.”
translation:
  language: zh_hans
  text: 如果我们死后不面对审判，或许对我们会更好。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post mortem
  choice: 死后
  rationale: 直接、自然地表达时间关系，忠实对应拉丁文。
- source_word: in iudicio uenientes
  choice: 面对审判
  rationale: 字面为“来到审判中”；现代汉语用“面对审判”更自然，同时保留死后受审的含义。
- source_word: melius fortassis nobis uenisset
  choice: 或许我们的境况还会好些
  rationale: 保留 fortassis 的不确定语气，并以自然汉语传达“对我们而言本会更好”的反事实意味。
theological_decisions:
- issue: 死后审判的表述
  choice: 面对审判
  alternative: 来到审判台前
  rationale: 原文只说进入或来到审判，并未明说“审判台”；故不增添原文没有的具体意象。
- issue: 反事实条件的力度
  choice: 如果……不用……或许……还会好些
  alternative: 如果……不受审判，也许对我们更好
  rationale: “不用面对”清楚表达与现实相反的设想，而“或许”保留原文没有断然下结论的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句末保留引号，以符合所给经文属于连续引语的版式线索；本节无脚注。
