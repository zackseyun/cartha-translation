lexical_decisions:
- source_word: Sexta via
  choice: 第六条路
  rationale: 直译序列表达，并与上下文所列各条道路保持一致。
- source_word: videntes
  choice: 他们看见
  rationale: 将拉丁语复数现在分词按汉语自然句法处理为限定动词；其主语承接上下文。
- source_word: quemadmodum
  choice: 怎样
  rationale: 保留他们所目睹之过程或情形的意味，不额外解释。
- source_word: de eis
  choice: 自己中间有些人
  rationale: 按部分用法理解为“他们当中的一些人”，避免误译为表示强调的“他们自己”。
- source_word: pertransient in cruciamentum
  choice: 将进入苦刑
  rationale: pertransire in 表示越过而进入某种境地；cruciamentum 为单数，译作集合性或状态性的“苦刑”，不擅自改为复数。
theological_decisions:
- issue: 进入苦刑者的范围
  choice: 自己中间有些人
  alternative: 他们自己
  rationale: 拉丁语 de eis 是部分结构，指该群体中的一部分；若表示“他们自己”，通常应有 ipsi 等强调形式。
- issue: cruciamentum 的数与性质
  choice: 苦刑
  alternative: 各种苦刑
  rationale: 原文为单数，译文保留其单数或整体状态意义，不将其扩展为多种刑罚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第六条路”保留原文列举结构；“将怎样进入苦刑”保留观看过程的表达及末世审判语境中的张力，不补入原文没有说明的施刑者、地点或方式。
