  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/009.yaml
  text: If a city is given to a man for an inheritance[a], if the heir does not pass through the danger set before him, how will he receive his inheritance?
translation:
  language: zh_hans
  text: 若一座城赐给一个人作产业[a]，继承人若不穿越摆在他面前的险境，又怎能得到自己的产业呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“若一座城已经赐给某人作产业。”拉丁文在此以同根词重复表达“赐给”。
    reason: 准确提示data dabitur的同根重复形式，同时不在正文中武断界定其语用强调。
lexical_decisions:
- source_word: civitas
  choice: 一座城
  rationale: 按拉丁文不定指语义自然译出；“城”比“城市”更符合本段寓意性、庄重的语境。
- source_word: in hereditatem / hereditatem suam
  choice: 作产业／自己的产业
  rationale: hereditas既可指继承所得，也可指所承受的产业；用“产业”保留城作为应许之承受物的意象，并避免中文连续重复“继承”。
- source_word: heres
  choice: 继承人
  rationale: 直接对应法律及比喻语境中的“承受产业者”。
- source_word: antepositum periculum
  choice: 摆在他面前的险境
  rationale: 保留antepositum“置于面前”的空间意象，以及periculum所表达的危险、考验意味，但不额外解释为特定神学概念。
- source_word: pertransierit
  choice: 穿越
  rationale: 体现per-的贯穿意味，也与上下文中通往城邑的危险道路意象相称。
theological_decisions:
- issue: 进入产业是否以先经过危险为条件
  choice: 保留双重条件句与反问，不解释其救恩论机制
  alternative: 意译为“人必须先受考验，才配承受产业”
  rationale: 原文只陈述继承人须经过摆在面前的危险，并未使用“配得”等词；直译可保存其神学张力。
- issue: data dabitur的重复形式
  choice: 译为“赐给”，不另加“确实”
  alternative: 译为“确实赐给”
  rationale: 拉丁文的同根重复可能带有强调，也可能反映底层语言的句法仿译；现代中文若加“确实”会过度确定其语用功能，正文采用自然表达，并以脚注提示较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文“若……若不……怎能……”的推论结构；用“又怎能”使反问在中文中自然有力。
