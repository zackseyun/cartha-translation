  text: 'temporibus. Nam de morte sermo est: quando profectus fuerit terminus sententiae ab Altissimo ut homo moriatur, recedente inspiratione de corpore ut dimittatur iterum'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/078.yaml
  text: 'Concerning death, the matter is this: when the decree has gone forth from the Most High that a man should die, as the breath departs from the body so that it may be sent back again,'
translation:
  language: zh_hans
  text: 论到死亡，事情是这样的：至高者关于人必须死亡的判决一经发出，气息[a]便离开身体，好再次被遣回去，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”所译的拉丁词也可理解为赋予生命的气息或“灵”；原文在这里没有进一步说明。
    reason: 保留 *inspiratio* 在生命气息与灵性含义之间的语义张力。
lexical_decisions:
- source_word: sermo est
  choice: 情形是这样
  rationale: 此处引出对死亡过程的说明；译为“情形是这样”比“教导如下”更贴近语境，也避免给 sermo 加上原文没有明确表达的教义意味。
- source_word: terminus sententiae
  choice: 判定……的期限
  rationale: terminus 表示期限、界限或终点，sententia 可指判定、裁决；合译为“判定……的期限”，保留“裁决”与“时限”两层意思。
- source_word: inspiratio
  choice: 气息
  rationale: 在“离开身体”的死亡语境中，inspiratio 首先可指赋予生命的气息；译作“气息”避免径直把它限定为具有独立位格含义的“灵”。
- source_word: dimittatur iterum
  choice: 再次被送回去
  rationale: 采用被动表达以对应 dimittatur，并以“再次”对应 iterum；“送回去”符合上下文所说气息离体后的去向，同时不补出原文未明说的接受者。
theological_decisions:
- issue: inspiratio 指“气息”还是“灵”
  choice: 气息
  alternative: 灵／灵魂
  rationale: 拉丁词本身可带生命气息或灵性生命原则的含义；本句直接描写其离开身体，译为“气息”较贴近词面，并以脚注保留其他可能性，不预先解决人论上的神学问题。
- issue: 气息被送回何处或归给谁
  choice: 不补明接受者
  alternative: 归还赐气息的上帝／至高者
  rationale: 所给拉丁文本只有“再次被送回去”，没有明说归给谁；因此不从相关经文或后续传统补入接受者。
translation_notes:
  register: 采用庄重而自然的现代汉语。“论到死亡”承接主题，“情形是这样”简明引出说明。句末保留逗号，以反映所给拉丁文本和本节内容尚未完结。
