  text: And he said to me[a], “You are not a judge over the Lord, nor one who understands over the Most High.”
translation:
  language: zh_hans
  text: 他对我说：“你在判断上并不胜过主；在见识上也不超过至高者。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“你不是在主之上的审判者，也不是在至高者之上的、更有理解力的人。”拉丁文两处 super 可表示“在……之上”；在这里也可理解为比较义，即“胜过、超过”。
    reason: 保留拉丁文介词 super 的形式歧义，并说明正文采用平行比较义。
lexical_decisions:
- source_word: iudex
  choice: 论判断
  rationale: 拉丁文意为“审判者、判断者”。结合 super 所形成的平行比较结构，译作“论判断”既自然，又避免把以斯拉称为某种正式法官。
- source_word: Dominum
  choice: 主
  rationale: 保留 Dominus 在宗教语境中的通常称谓，并与“至高者”相区别。
- source_word: intellegens
  choice: 论见识
  rationale: 该词指有理解力、明达；“见识”在现代汉语中简洁自然，也能与前句“判断”形成平行。
- source_word: Altissimum
  choice: 至高者
  rationale: 准确保留最高级神圣称号的名词化形式。
- source_word: super
  choice: 胜过／超过
  rationale: 两处 super 位于严格平行的结构中，按比较义处理，可传达“比……更善判断／更有见识”的语意，同时避免生硬且含义不明的“在……之上”。
theological_decisions:
- issue: 人是否有资格在判断和见识上凌驾于上帝
  choice: 采用平行比较表达：“不胜过主……不超过至高者”
  alternative: 直译为“不是主之上的审判者，也不是至高者之上的明白人”
  rationale: 比较译法符合两小句的结构对应，也清楚表达人不能自居为比上帝更公正、更明达；脚注保留 super 的形式直译可能性，不把语法上的张力完全隐去。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；以“论判断……论见识……”呈现原文两小句的平行关系。“主”和“至高者”沿用普通读者熟悉的圣经称谓。
