base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/007.yaml
  text: But its entrance is narrow and set on a precipice, so that on the right there is fire and on the left deep water.
translation:
  language: zh_hans
  text: 但它的入口狭窄，且位于险峻之处；右边是火，左边是深水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  choice: 入口
  rationale: 直接表达进入这座城的通道起点，符合上下文意象。
- source_word: angustus
  choice: 狭窄
  rationale: 准确保留入口窄小、难以通行的含义。
- source_word: in praecipiti positus
  choice: 设在悬崖之上
  rationale: 保留通道位于陡险高处的空间意象及危险感；“悬崖”比抽象的“险境”更贴近 praecipitium 的地形含义。
- source_word: a dextris quidem ignis
  choice: 右边是火
  rationale: 以自然简洁的现代汉语保留原文左右对举。
- source_word: a sinistris vero aqua alta
  choice: 左边是深水
  rationale: aqua alta 在此指深水，既保留危险意象，也与右边的火形成鲜明对照。
theological_decisions:
- issue: 入口两侧火与深水的意象是否作象征性解释
  choice: 仅按原文呈现地形与危险意象，不在正文中解释其象征意义
  alternative: 将火与深水明译为审判、患难或属灵危险
  rationale: 本节原文只描绘入口的险峻，并未明确解释象征含义；译文应保留这种开放性，避免加入宗派性或推测性的阐释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；保留“右边……左边……”的平衡结构，并以“又”自然连接入口狭窄及其所在位置两个特征。
