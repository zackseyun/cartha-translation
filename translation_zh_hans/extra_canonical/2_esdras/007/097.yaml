  text: et spatiosum, [quod incipient] recipere fruniscentes et immortales. Sextus ordo, quando eis ostendetur, quomodo incipiet uultus eorum fulgere sicut sol, et quomodo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/097.yaml
  text: 'The sixth order: when it will be shown to them how their face will begin to shine like the sun, and how they will begin to be made like the light of the stars, being from then on incorruptible.'
translation:
  language: zh_hans
  text: 第六等：届时，他们将被指示：他们的面容将如何开始如太阳般发光，以及如何……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现提供的拉丁文本在“以及如何”之后中断。英语审校文本接作：“他们将怎样开始变得像星辰的光，从此不再朽坏。”
    reason: 明确交代现有拉丁源文的断裂；英语文本所保存的后续读法仅置于脚注，不作为当前拉丁文本可确证的正文。
lexical_decisions:
- source_word: Sextus ordo
  choice: 第六等
  rationale: ordo在上下文中指依次排列的境况或阶段；译作“等”既简洁，也保留其分类、次序之意。
- source_word: quando eis ostendetur
  choice: 那时，他们将蒙指示
  rationale: 保留拉丁文将来时和被动结构；“蒙指示”用庄重而自然的汉语表达“将向他们显明”。
- source_word: uultus eorum
  choice: 自己的面容
  rationale: 字面为“他们的面容”；在“他们将看见/蒙指示”的汉语语境中用“自己的面容”更自然，并不改变所指。
- source_word: fulgere sicut sol
  choice: 像太阳一样发光
  rationale: 直接保留明喻及“发光、闪耀”的基本意象。
- source_word: et quomodo
  choice: 以及怎样……
  rationale: 所提供的拉丁文本止于尚未完成的连接语，故以省略号如实显示残缺，不据英语咨询层补写源文未提供的内容。
theological_decisions:
- issue: 是否补入“像星光、从此不朽坏”等内容
  choice: 不补入正文，以残文形式呈现
  alternative: 依据英语POB补译为“怎样开始变得像星辰的光，从此不再朽坏”
  rationale: 所给拉丁原文在et quomodo（“以及怎样”）处中断；英语文本虽提供完整句意，但按原文证据优先的原则，不应把当前拉丁证据中没有的措辞无标记地写入正文。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语。“第六等”承接条列式异象结构；句末省略号并配脚注，忠实反映所提供拉丁证据的断裂。
