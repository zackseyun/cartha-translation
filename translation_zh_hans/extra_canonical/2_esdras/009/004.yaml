  text: 那时你就会明白：至高者从起初以前的日子起所说的，正是这些事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Altissimus
  choice: 至高者
  rationale: 这是犹太—基督教经文中对上帝这一称号的自然、庄重译法；所给拉丁文本行首的“simus”是该词末尾，英语审校层也印证了完整读法。
- source_word: de his ipsis
  choice: 所说的正是这些事
  rationale: 用“正是”表达 ipsis 的强调意味，同时保持现代汉语自然流畅。
- source_word: a diebus qui fuerunt ante ab initio
  choice: 从起初的往昔岁月起
  rationale: 概括原文叠加的时间表达，既保留“起初”和“往昔”的要素，也避免生硬重复。
- source_word: tunc intelleges
  choice: 那时你就会明白
  rationale: “那时”承接前文条件或时序，“就会明白”准确表达将来时含义。
