  text: turbabatur sicut et ante. Et apertum est os meum et inchoaui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/028.yaml
  text: And my mouth was opened, and I began to speak before the Most High, and I said,
translation:
  language: zh_hans
  text: 我的口就开了，我开始说话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所供拉丁文本到“我开始了”为止；有些版本接作“在至高者面前说话，我说”。
    reason: 说明当前拉丁来源与英语咨询文本在句尾内容上的差异，并避免正文无依据地补文。
lexical_decisions:
- source_word: apertum est os meum
  choice: 我的口就开了
  rationale: 保留拉丁文被动式所表达的事件发生感，同时采用现代汉语自然措辞；不擅自补出使口张开的主体。
- source_word: inchoaui
  choice: 我开始说话
  rationale: 原文直译为“我开始了”，未明说所开始的动作；结合“我的口开了”的近邻语境，以“说话”补足现代汉语所需的自然表达，但不加入所供拉丁文本没有的后续内容。
theological_decisions:
- issue: 是否加入“在至高者面前”
  choice: 不加入正文
  alternative: “我开始在至高者面前说话”
  rationale: 所供拉丁文止于 inchoaui，并无 coram Altissimo；即使英语咨询文本含有这一短语，也不应在缺少当前原文证据时将其写入正文。
- issue: 是否加入“我说”
  choice: 不加入正文
  alternative: “我说”
  rationale: 所供拉丁文没有 et dixi；为避免把英语咨询层的扩展当作原文，正文仅翻译现有拉丁证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就”承接前文事件；本节开头未收入 turbabatur sicut et ante（“像先前一样感到不安”），因其句法上显然属于前一句。
