  text: For all who did not know me while they were alive, though they had received benefits,
translation:
  language: zh_hans
  text: 因为所有活着时不认识我、虽已领受恩惠的人，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quotquot enim
  choice: 因为所有……的人
  rationale: “quotquot”概括全部符合条件者；“enim”承接上下文说明理由，译为“因为”。
- source_word: non cognoverunt me
  choice: 不认识我
  rationale: 直译“未认识我”，保留关系性与认知性兼具的含义，不擅自解释为“不承认”或“不敬拜”。
- source_word: viventes
  choice: 活着时
  rationale: 将拉丁语现在分词按时间状语处理，表达他们在世期间的状态。
- source_word: beneficia consecuti
  choice: 虽已领受恩惠
  rationale: “consecuti”表示得到、获得；“beneficia”可指所受的好处或恩惠。依据句法与英语审校层的理解，以“虽”显出领受恩惠与不认识上帝之间的让步张力。
theological_decisions:
- issue: “认识我”的性质
  choice: 保留“不认识我”的宽泛表达
  alternative: 译作“不承认我”或“不信我”
  rationale: 原文“cognoverunt”本身未限定为单纯知识、承认或信仰关系，故不把某一种神学解释写入正文。
- issue: 恩惠与不认识之间的逻辑关系
  choice: 用“虽”表达让步关系
  alternative: 不加连接词，译作“领受了恩惠却不认识我”
  rationale: 分词短语与主句形成明显反差；“虽已”自然传达这种张力，同时不说明恩惠的具体性质或救赎效力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。此节在现有引文中是未完句，因此保留句末逗号，以便与下一分句衔接。
