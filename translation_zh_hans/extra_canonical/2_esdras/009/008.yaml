  yaml_path: translation/extra_canonical/2_esdras/009/008.yaml
  text: will be left from the foretold dangers and will see my salvation in my land and within my borders[a], which I sanctified for myself from of old.
translation:
  language: zh_hans
  text: 必将从所预告的危险[a]中存留下来，并将在我的土地上、在我的疆域内看见我的救恩；这土地和疆域，是我自古以来为自己分别为圣的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所预告的危险”也可译作“预先宣告的危险”。
    reason: 对应 praedictis periculis，并保留英语审校轨迹所记录的两种自然语序。
lexical_decisions:
- source_word: relinquetur
  choice: 存留下来
  rationale: 保留拉丁文被动式“被留下、剩存”的基本意象，同时在灾难语境中自然表达劫后存留；不直接释作“幸存”或“蒙搭救”，以免过度解释。
- source_word: praedictis periculis
  choice: 预先宣告的危险
  rationale: praedictis 表示事先说出或预告；译为“预先宣告的”既贴近词义，也比单纯“预言的”少加限定。
- source_word: salutare meum
  choice: 我的救恩
  rationale: salutare 在此作名词，指上帝所施行或显明的拯救；“救恩”保留其神学分量及原文表达。
- source_word: in terra mea et in finibus meis
  choice: 在我的土地上、我的疆界以内
  rationale: 分别呈现 terra 的土地/国土含义与 fines 的边界、疆域含义，并保留两个并列介词短语。
- source_word: a saeculo
  choice: 自古以来
  rationale: 表达从久远年代起的时间意义，不武断强化为严格形而上的“从永恒”。
theological_decisions:
- issue: relinquetur 是单指幸存，还是强调被留下的余民意象
  choice: 译作“存留下来”
  alternative: “幸存下来”或“被留下”
  rationale: 原文被动式可兼具蒙保全与成为余留者的意味；“存留下来”较自然，并保留这层张力。
- issue: quae sanctificavi 的先行对象
  choice: 在正文中概括为“这土地和疆界”
  alternative: 只修饰“土地”或只修饰“疆界”
  rationale: 现存拉丁文的关系代词配合并不清晰，英语审校层也按二者合指处理；概括承接可避免无依据地把修饰范围缩到其中一项。
- issue: sanctificavi 的神学语气
  choice: “分别为圣”
  alternative: “使……神圣”或“圣化”
  rationale: 该词表示为上帝自己划归并使之成圣；“分别为圣”清楚保留归属和圣洁两方面，不引入宗派性解释。
translation_notes:
  register: 采用庄重而现代的普通话。“预先宣告的危险”保持原文次序与预告意味；分号厘清地点短语与关系从句。主语承接上下文，依原文未在本节补明。
