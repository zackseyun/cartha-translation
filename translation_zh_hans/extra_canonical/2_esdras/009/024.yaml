  yaml_path: translation/extra_canonical/2_esdras/009/024.yaml
  text: Go into a field where no house has been built, and eat only the flowers of the field. You shall not taste meat, and you shall not drink wine, but only flowers. And pray to the Most High without ceasing, and
translation:
  language: zh_hans
  text: 你要到一处没有建造过房屋的田野去，只吃田野里的花。不可尝肉，也不可喝酒，只吃花。要不住地向至高者祈求，并且
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: campi
  choice: 田野
  rationale: 对应拉丁文属格“田野的”，并保留开阔、未建房屋之地的语境。
- source_word: flores
  choice: 花
  rationale: 按通常词义直译；不将其解释为草木、菜蔬或其他食物。
- source_word: deprecare
  choice: 祈求
  rationale: 该动词在此表示恳切祷告、求告；“祈求”既自然又保留请求意味。
- source_word: altissimum
  choice: 至高者
  rationale: 保留作为上帝称号的名词化表达，不另行增补“上帝”。
- source_word: sine intermissione
  choice: 不住地
  rationale: 准确表达持续而不间断之意，也符合现代汉语宗教语境中的自然用法。
theological_decisions:
- issue: 禁食命令的具体范围
  choice: 不可尝肉，也不可喝酒，只吃花
  alternative: 不要吃肉，也不要喝酒，只以花为食
  rationale: 保留原文“尝肉”的措辞和命令的绝对语气，不把这种操练扩展解释为一般性禁食制度。
- issue: 末尾未完句
  choice: 以“并且”收尾
  alternative: 删去连接词或补全下一节内容
  rationale: 拉丁文以 et 结束，显然与后文相连；保留未完结构，忠实反映本节的文本边界。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法尽量贴近拉丁文的连续命令结构；“没有建造房屋的田野”避免加入原文没有的“开满花”等限定。末尾有意保留“并且”，因源文本节止于连接词。
