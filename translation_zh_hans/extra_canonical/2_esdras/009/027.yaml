  text: And after seven days I was lying on the grass, and my heart again as before
translation:
  language: zh_hans
  text: 七天后，我躺在草地上，我的心又像先前一样……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所据拉丁文本在“我的心又……”处残缺；“像先前一样”据传本所保存或反映的残句意义译出，具体谓语不详。
    reason: 说明文本残缺，并交代为何不补入“忧愁”或“烦乱”等具体状态。
lexical_decisions:
- source_word: discumbebam supra fenum
  choice: 我躺在草地上
  rationale: discumbebam 表示躺卧或斜倚；supra fenum 直指在草或干草之上。结合上下文，译作自然的现代汉语“躺在草地上”。
- source_word: cor meum iterum
  choice: 我的心又
  rationale: 保留 cor 的“心”和 iterum 的重复意味，不补入原文没有明确表达的情绪或动作。
- source_word: sicut prius（由英语审校层反映的后续残句意义）
  choice: 像先前一样
  rationale: 给定拉丁文本在 iterum 后显然残缺，而英语审校层保留“as before”。正文以省略号和脚注标明残缺性质，避免把未保存的谓语补实。
theological_decisions:
- issue: 残句中“心”发生了什么
  choice: 不补出“忧愁”“烦乱”等谓语，以省略号保留未完状态
  alternative: 译作“我的心又像先前一样忧愁”或“烦乱”
  rationale: 现存拉丁文只到“我的心又”，英语审校层也已删除无直接依据的“was troubled”。补出具体心理状态会消解原文残缺所形成的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“七天后”简洁对应 septem 所代表的时间表达；以省略号直观显示句末残缺，脚注则保留文献层面的谨慎。
