source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: seruietur acinus meus et plantatio mea, quia cum multo labore perfeci haec. Tu autem si adhuc intermittas septem dies alios—
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/022.yaml
  text: Let my grape and my planting be preserved, because I completed these with much labor. But if you still delay another seven days—
translation:
  language: zh_hans
  text: 愿我的葡萄和我所栽种的得以保全，因为我费了许多辛劳才完成这些。至于你，若还要再耽搁七天——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruietur
  choice: 得以保全
  rationale: 此处依上下文取“被保存、受保全”之意，并保留拉丁文被动语气。
- source_word: acinus meus
  choice: 我的葡萄
  rationale: acinus 可指单颗葡萄或葡萄果实；这里用自然的集合表达“我的葡萄”，不强行具体化为葡萄串或葡萄园。
- source_word: plantatio mea
  choice: 我所栽种的
  rationale: plantatio 可指栽种之物或栽植；译作“我所栽种的”既自然，也与“葡萄”并列而不限定具体植物。
- source_word: cum multo labore
  choice: 费了许多辛劳
  rationale: 准确表达付出大量劳苦的方式和代价。
- source_word: perfeci haec
  choice: 才成就这一切
  rationale: perficere 表示完成、做成；“才”体现 cum multo labore 所强调的艰辛，但不译为带有额外神学意味的“使之完全”。
- source_word: intermittas
  choice: 停
  rationale: 该词可表示中断、暂停或留出间隔；结合“再七天”，译为“再停七天”以保留其未明确说明暂停何事的含混性。
theological_decisions:
- issue: “葡萄”和“栽种之物”的象征所指
  choice: 保留原文意象，不解释其所指
  alternative: 明确解释为以色列、义人或某一群体
  rationale: 本节本身没有明说象征对象，译文不应导入特定解释。
- issue: perfeci 是否含“使之完美”的神学意义
  choice: 译为“成就”
  alternative: 译为“使之完全”或“使之完美”
  rationale: 拉丁文首先表达完成、做成；采用“成就”既符合语境，也避免过度神学化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。末尾保留破折号，表明句子延续至下一节；“至于你”呈现 Tu autem 的转折和话题转换。
