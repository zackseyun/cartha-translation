  text: et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum in quo inhabitarent, et nemo contradixit mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/018.yaml
  text: And then[a], when I was preparing for them—for those who now exist—before the age was made for them in which they would dwell, no one contradicted me.
translation:
  language: zh_hans
  text: 那时，当我正为他们——就是如今存在的人——作预备时，在为他们造出他们将要居住的时代以前，没有人反对我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那时，当我为他们——即如今存在的人——作预备时，在他们将要居住的时代尚未为他们造出以前，没有人反对我。”
    reason: 原句中“为他们作预备”未明示所预备的对象；本译以另一种汉语语序保留其与“时代为他们被造出”之间的关系，且不加入拉丁文本所无的“因为当时没有人存在”。
lexical_decisions:
- source_word: et tunc
  choice: 那时
  rationale: 表达时间推进；中文不必机械保留句首连接词“并且”。
- source_word: parans eis, his qui nunc
  choice: 为他们——就是为如今存在的人——预备
  rationale: 保留 eis 与同位说明 his qui nunc 的关系，以破折号清楚呈现；“如今存在的人”对应省略谓语的拉丁语表达。
- source_word: saeculum
  choice: 时代
  rationale: 此处指为人预备、供其居住的世界时期；译作“时代”既保留时间意义，也避免径自解释为单纯物质世界。
- source_word: inhabitarent
  choice: 居住
  rationale: 直接对应居住、栖居之义，并保留其宾语为 saeculum 所带来的原文表达。
- source_word: nemo contradixit mihi
  choice: 没有人反对我
  rationale: 准确传达 contradicere 的反驳、反对之意，不增添拉丁文本没有的原因说明。
theological_decisions:
- issue: 受造者在创造以前是否已存在
  choice: 不补入“因为当时没有人存在”
  alternative: 依其他古译本补译“因为当时没有人存在”
  rationale: 主要拉丁文本只有“没有人反对我”，没有原因从句；不以其他见证的解释性增文消解此处张力。
- issue: saeculum 的宇宙论含义
  choice: 译为“时代”
  alternative: 译为“世界”或“世代”
  rationale: “时代”较贴近拉丁词的时间维度，同时保留经文中该时代可供人居住的不寻常意象，不擅自将其纯空间化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文以破折号标明同位说明，尽量保存拉丁原句的层次和歧义；脚注标记已在正文中出现。
