lexical_decisions:
- source_word: per singulas horas et per singulos dies
  choice: 每时每天
  rationale: 保留逐时逐日的反复强调，同时采用自然简洁的现代汉语表达。
- source_word: in annis triginta his
  choice: 在那三十年里
  rationale: 按校勘后拉丁文理解为“在那三十年期间”；“那”自然指向上下文已提及的三十年。
- source_word: deprecabar
  choice: 祈求
  rationale: 该词表示恳切祷告、求告；“祈求”兼顾宗教语境与恳求意味。
- source_word: Altissimum
  choice: 至高者
  rationale: 准确保留拉丁文对上帝的尊称，不额外补入原文未明说的称谓。
- source_word: nocte ac die
  choice: 昼夜不停地
  rationale: “昼夜”对应原文“夜与日”；补入“不停地”自然传达与前文逐时逐日共同形成的持续性强调。
