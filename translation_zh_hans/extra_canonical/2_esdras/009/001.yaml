  text: He answered me and said[a], “Measure carefully within yourself, and when you see that some part of the signs foretold has passed by,
translation:
  language: zh_hans
  text: 他回答我说：“你要在自己里面仔细衡量[a]；当你看见那些预先说过的征兆中有一部分已经过去时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“一面衡量，一面衡量”；这种重复用法表示强调。也可译作“你要在自己里面衡量”。
    reason: 说明 metiens metire 的强调结构，并保留 in temetipso 更贴近字面的译法。
lexical_decisions:
- source_word: metiens metire
  choice: 仔细衡量
  rationale: 拉丁文以分词加命令式重复同一词根，带有加强语气；译作“仔细衡量”既传达强调，也符合现代汉语表达。
- source_word: in temetipso
  choice: 在自己心里
  rationale: 原义为“在你自己里面”；这里指个人内在的审察和判断，译作“在自己心里”自然且不额外限定为理智或情感。
- source_word: transiuit pars quaedam signorum
  choice: 那些征兆已有一部分过去
  rationale: 保留“一部分征兆已经过去”的时序含义，不将其具体化为“应验完毕”，以免超出原文。
- source_word: quae praedicta sunt
  choice: 预先说过的
  rationale: 准确表达被动完成式“已经预先说出／预告”，并以自然简明的汉语修饰“征兆”。
theological_decisions:
- issue: “衡量”的对象和方式
  choice: 保留“在自己心里衡量”的开放表达
  alternative: 译为“自己仔细计算这些征兆”或“省察自己”
  rationale: 原文没有明说衡量的直接对象，也未明确表示道德上的自我省察；保留其含混性可避免加入解释。
- issue: 征兆“过去”的含义
  choice: 译为“过去”
  alternative: 译为“应验”或“实现”
  rationale: 拉丁文 transiuit 的直接意义是“过去了”；虽然语境可能涉及预言应验，但不宜在正文中消除这一措辞所保留的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“仔细衡量”传达原文重复结构的强调作用；句末保留逗号，因为本节语法在下一节继续。
