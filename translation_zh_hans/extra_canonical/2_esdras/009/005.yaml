id: 2ES.9.5
reference: 2 Esdras 9:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'omne quod factum est in saeculo, initium per consummationem et consummatio manifesta, Sic et altissimi tempora : initia'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/005.yaml
  text: For just as everything that has come to be in the age has a beginning through an end[a], and the end is manifest,
translation:
  language: zh_hans
  text: 因为，正如这世代中一切已经出现的事物，开端借着终结，终结也显明[a]；至高者的时期也是这样：它们的开端……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“开端借着终结”。此处拉丁文语意困难；有校勘读法作“开端清楚可见”，并有其他古代译本支持。
    reason: 说明所给拉丁文本 per consummationem 与校勘读法 patet 之间的重要异文；正文保留指定底本的困难读法，避免将校勘性复原无提示地写入正文。
lexical_decisions:
- source_word: saeculo
  choice: 这世代中
  rationale: 保留 saeculum 的时间性，不简单等同于物质性的“世界”；在现代汉语中用“这世代”自然表达当前时代。
- source_word: factum est
  choice: 已经形成的
  rationale: 表达 fio/facio 被动结构所指的“成为、形成”，避免只译成“发生”而缩窄到事件。
- source_word: initium patet / initium per consummationem
  choice: 开端清楚可见
  rationale: 采用校勘所支持、并获古代译本旁证的 patet 读法；所给清理文本的 per consummationem 语义异常，宜在脚注中保留其文本问题。
- source_word: consummatio manifesta
  choice: 终结也显明
  rationale: consummatio 在此与 initium 对举，指终点或结局；manifesta 直译为“显明”。
- source_word: altissimi tempora
  choice: 至高者所定的时期
  rationale: tempora 为复数“时期、时段”；补出“所定的”以自然表达这些时期属于至高者的安排，但不加入具体末世体系。
theological_decisions:
- issue: “至高者的时期”是否明确解释为末世阶段
  choice: 译作“至高者所定的时期”
  alternative: “至高者的末世时期”
  rationale: 原文只说 altissimi tempora，没有明言“末世”；保留其较宽泛而带神学张力的表达。
- issue: 是否将残缺的 initia 补足为具体神迹内容
  choice: 以省略号保留未完句
  alternative: 依据后续经文补译“它们的开端有奇事和大能的作为”
  rationale: 当前所给源文止于 initia；不越过所提供的原文擅自补全下一部分。
translation_notes:
  register: 采用庄重而现代的书面普通话。“开端……终结……”保持原文的平行结构；分号连接类比的两部分。末尾省略号表明所给拉丁文本在 initia 处未完。
