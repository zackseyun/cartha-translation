lexical_decisions:
- source_word: populorum turbatio
  choice: 民众的混乱
  rationale: 保留名词性列举结构；turbatio 在此表示混乱、骚动，populorum 指各民众或人民群体。
- source_word: gentium cogitationes
  choice: 列国的思虑
  rationale: cogitationes 本义为思想、盘算或思虑；采用中性的“思虑”，不擅自解释为阴谋。
- source_word: ducum inconstantia
  choice: 领袖的反复无常
  rationale: duces 可指领袖或首领；inconstantia 表示不稳定、无恒或反复无常，此处选用自然且能表现行为不定的表达。
- source_word: principum turbatio
  choice: 统治者的动荡
  rationale: principes 指居首位者、统治者；为避免与前项机械重复，以“动荡”表达 turbatio，同时保留局势不安之意。
- source_word: Tunc intelleges
  choice: 那时你就会明白
  rationale: 直接体现时间副词 Tunc 和第二人称单数将来式 intelleges。
- source_word: quoniam de his erat altis-
  choice: 至高者所说的正是这些事——
  rationale: 原文在 altis- 处断裂，显然通向“至高者”相关表达，但句法未完；根据上下文以自然汉语呈现，同时用破折号和脚注保留残缺状态。
theological_decisions:
- issue: altis- 所指及残句的处理
  choice: 译为“至高者所说的正是这些事——”，并注明原文残缺
  alternative: 直译为“这些事是关于至高者的”或补足后续经文
  rationale: altis- 很可能是 Altissimus（至高者）的词形开端，但现存引文在此截断，完整谓语关系不能仅凭本节确定；不补入超出所给拉丁文本的内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前四项尽量维持拉丁文并列名词结构，并避免把中性的 cogitationes 神学化或贬义化。
