  source_fidelity: 译文整体准确呈现了将来时的审判结果、对“我的道路”的滥用，以及轻蔑弃置后的受苦状态。将 commorabuntur 译为“留在”合乎“停留、持续处于”的意思；但“苦刑”在现代汉语中较容易特指拷打或刑讯手段，较拉丁文 cruciamentis（折磨、痛苦）具体，宜改为较宽的“痛苦之中”。
  naturalness: “滥用我道路”虽可理解，但现代汉语通常需要结构助词，改为“滥用我的道路”更自然。第二分句用“弃绝它们”比“将它们抛弃”更凝练，并仍保留 contemptu 所表明的轻蔑弃置。
  terminology: 保留“我的道路”的复数意象，不以“律法”或“旨意”替代。“痛苦”不预设具体刑罚形式或持续期限，较稳妥地对应 cruciamentis。
