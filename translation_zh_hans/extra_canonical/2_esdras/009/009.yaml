  yaml_path: translation/extra_canonical/2_esdras/009/009.yaml
  text: Then those who now have abused my ways will be astonished, and those who cast them aside in contempt will remain in torments.
translation:
  language: zh_hans
  text: 那时，那些如今滥用我的道路的人必惊愕；那些轻蔑地弃绝它们的人，必留在痛苦之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mirabuntur
  choice: 必惊愕
  rationale: 该词可表示惊奇、诧异；在审判语境中译作“惊愕”更自然，也保留面对结局时震惊的意味。
- source_word: abusi sunt vias meas
  choice: 滥用我道路
  rationale: 按现存拉丁文直译其反常搭配，保留“abusi”所表达的误用、糟践之意，而不擅自改成“弃绝”或“不遵行”。
- source_word: proiecerunt in contemptu
  choice: 轻蔑地将它们抛弃
  rationale: 将proicere译为“抛弃”，并以“轻蔑地”表达in contemptu；代词“它们”承接前文“我道路”。
- source_word: in cruciamentis commorabuntur
  choice: 必留在苦刑之中
  rationale: commorari表示停留、逗留；cruciamenta指折磨或刑罚，故译为“苦刑”，兼顾受苦与惩罚色彩。
theological_decisions:
- issue: “苦刑”的性质与持续时间
  choice: 必留在苦刑之中
  alternative: 必永远受刑罚
  rationale: 原文只说明他们将停留在cruciamenta之中，并未明说“永远”，因此不增添持续时间或更具体的末世论解释。
- issue: “我道路”的指向
  choice: 保留复数意象“我道路”
  alternative: 我的律法／我的旨意
  rationale: viae meae字面为“我的道路”，可涵盖上帝的行事准则、命令和生活之道；保留原有意象，避免缩窄为单一神学概念。
translation_notes:
  register: 采用庄重而易懂的现代书面汉语。“我道路”略带经文语体，以忠实保留拉丁文复数道路意象；两处“必”体现拉丁将来时在审判宣告中的确定性。
