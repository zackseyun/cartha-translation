  terminology: 以“所接纳之物”对应 suscepta，以“容纳它们的载体”对应 susceptoria；“仍然存留”对应 manent；“因为在我们这里并非如此”保留 apud nos enim 的解释性衔接，不预先解释“我们”的具体所指。
