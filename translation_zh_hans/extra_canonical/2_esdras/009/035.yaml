  yaml_path: translation/extra_canonical/2_esdras/009/035.yaml
  text: and when what was received is destroyed[a], these are destroyed, but the receptacles remain. For with us it has not happened so.
translation:
  language: zh_hans
  text: 当所接纳之物被毁灭时，它们便被毁灭；容纳它们的载体却仍然存留。[a] 因为在我们这里并非如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “容纳它们的载体”所译拉丁词 susceptoria，指接纳或容纳前述事物的载体或处所；原文没有说明具体是哪一种载体。
    reason: 说明罕见词 susceptoria 的语义范围，并避免将其限定为具体器皿或与“所接纳之物”混同。
lexical_decisions:
- source_word: suscepta
  choice: 所承受的东西
  rationale: 这是 suscipere 的中性复数过去分词，核心意思是“被接纳、承受的事物”；既保留原文的概括性，也不加入“播种”或“差遣”等上下文推断。
- source_word: exterminentur
  choice: 毁灭
  rationale: 此处指所承受之物不复存在；译为“毁灭”符合语势，并保留原文较强的消亡含义。
- source_word: susceptoria
  choice: 承载它们的
  rationale: 该中性复数名词指接纳或容纳前述事物的载体。正文采用关系表达，较“容器”自然，也避免把比喻过度具体化。
- source_word: apud nos
  choice: 我们的情形
  rationale: 字面为“在我们这里”；结合比较论证，汉语译作“我们的情形”更清楚自然。
- source_word: enim
  choice: 因为
  rationale: 保留其解释、论证作用，不误译为转折关系。
theological_decisions:
- issue: “我们”的情形与前述承载者之比的具体所指
  choice: 保留“我们的情形并非如此”的概括说法
  alternative: 解释为人领受律法后，领受者也随罪灭亡
  rationale: 本节止于概括性比较，后文才展开律法、犯罪与灭亡；正文不提前补入神学解释，以保留原文的推进和张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文“所承受的东西……这些东西”的指代重复，以呈现其强调结构；用“却”表达 vero 的对照，用“因为”维持 enim 的论证衔接。
