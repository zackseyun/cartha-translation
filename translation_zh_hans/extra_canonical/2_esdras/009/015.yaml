  text: “从前我已经讲过，现在说，日后还要说：灭亡的人，比将要得救的人更多，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: olim locutus sum
  choice: 我从前已经讲过
  rationale: 用“讲过”表达完成时，并与后面的 dico/dicam（“说”）保持原文的词汇变化；olim 在此自然译为“从前”。
- source_word: nunc dico et postea dicam
  choice: 现在还要说，将来也要说
  rationale: dico/dicam 侧重所陈述的内容，统一译为“说”；以“还要……也要……”自然传达当前与将来的反复宣告。
- source_word: plures sunt qui pereunt quam qui salvabuntur
  choice: 灭亡的人，比将要得救的人更多
  rationale: 保留 pereunt 的现在时与 salvabuntur 的将来被动语态之间的不对称，也不额外限定灭亡或得救的性质。
theological_decisions:
- issue: “灭亡”与“得救”的范围和性质
  choice: 不加解释，保留“灭亡”“得救”
  alternative: 明确译作永远沉沦或末日获救
  rationale: 拉丁文本本身没有进一步界定，译文不应预先解决其末世论含义。
translation_notes:
  register: 采用庄重而自然的现代汉语。“讲过／说”保留 locutus sum 与 dico/dicam 的细微词汇差别；句末保留逗号，以对应所给经文片段尚未完结的引语。
