id: 2ES.9.32
reference: 2 Esdras 9:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nam patres nostri accipientes legem non servaverunt et legitima mea non custodierunt. et factum est fructumlegis non periens; nec enim poterat, quoniam tuus erat.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/032.yaml
  text: Yet our fathers, after receiving the law, did not keep it and did not observe my statutes. And the fruit of the law did not perish, for it could not, because it was yours.
translation:
  language: zh_hans
  text: 然而，我们的祖先领受了律法，却没有遵守，也没有谨守我的律例。律法的果实并没有消失，因为它既是你的，就不可能消失。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: patres nostri
  choice: 我们的祖先
  rationale: 这里泛指前代先祖；“祖先”比直译“父辈”更符合现代汉语叙事语境。
- source_word: legem
  choice: 律法
  rationale: 保留犹太宗教语境中指神所赐之法的常用表达。
- source_word: legitima mea
  choice: 我的律例
  rationale: 明确保留拉丁文 mea“我的”；“律例”自然体现 legitima 所指规定、法令。
- source_word: fructum legis
  choice: 律法的果实
  rationale: 保留原文的果实隐喻，不把其具体所指解释性地窄化。
- source_word: non periens
  choice: 并没有消失
  rationale: 清楚表达分词 periens 所含“灭亡、失落、不复存在”之意，并与下句“不可能消失”衔接。
theological_decisions:
- issue: “律法的果实”具体指什么
  choice: 保留“律法的果实”这一开放性隐喻
  alternative: 译作“律法所结的善果”或具体解释为义人、义行
  rationale: 原文未明确说明该果实的所指，不应在译文中加入特定神学解释。
- issue: tuus 的指代与性别形式
  choice: 译为“它既是你的”
  alternative: 译为“律法是你的”或“果实是你的”
  rationale: 拉丁文 tuus 为阳性单数，与 fructus“果实”一致，最直接指向律法的果实；用“它”承接前句，同时保留语势。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“然而……却……”呈现转折；第二句保留原文因果论证及“果实”隐喻。
