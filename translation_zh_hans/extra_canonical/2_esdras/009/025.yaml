  text: I will come and speak with you. And I went out, as he told me, into the field that is called
translation:
  language: zh_hans
  text: “我会来和你说话。”我就照他所说的，前往那片名叫……的田野。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ueniam
  choice: 我会来
  rationale: 保留第一人称将来意义，简洁自然。
- source_word: loquar tecum
  choice: 与你说话
  rationale: 准确表达与对方交谈，不额外限定谈话内容。
- source_word: profectus sum
  choice: 前往
  rationale: 表示动身出去、前去；结合目的地“田野”，译作“前往”较符合现代汉语。
- source_word: sicut dixit mihi
  choice: 照他对我说的
  rationale: 保留原文“正如他告诉我的”之意，同时不擅自补出“吩咐”等更强语气。
- source_word: in campum
  choice: 那片……田野
  rationale: campus 可指田野、旷野或平地；此处采用较中性的“田野”，并用量词使中文自然。
- source_word: quod uocatur
  choice: 名叫……的
  rationale: 原文在名称出现前即中断，故用省略号明确保留未完句式，不补写地名。
theological_decisions:
- issue: 说话者及代词所指
  choice: 按上下文显见关系译为“我”与“他”，不在本节补明身份
  alternative: 将“他”具体译成天使或其他人物
  rationale: 拉丁文本仅有动词人称和 mihi，未在本句明示人物身份；避免把上下文解释直接写入正文。
- issue: 未完句的处理
  choice: 以省略号保留“名叫……”的悬置状态
  alternative: 根据后续经文补入田野名称
  rationale: 所给原文止于 quod uocatur，本节自身并未提供名称，应忠实保留文本边界及未完成结构。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。引语结束后以“于是”衔接叙事；不把上一节内容并入本节，也不依据后文补足地名。
