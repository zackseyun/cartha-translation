  yaml_path: translation/extra_canonical/2_esdras/009/007.yaml
  text: And it shall be that everyone who is saved[a], and who is able to escape by his works or by the faith in which he believed,
translation:
  language: zh_hans
  text: 到那时，凡得救的人[a]，并且能凭自己的行为，或凭他所信的信仰逃脱的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡得救的人”。
    reason: 保留不单独译出et erit的另一种句法处理，与既有译法相对应。
lexical_decisions:
- source_word: et erit
  choice: 到那时
  rationale: 以自然的现代汉语保留这一带有预告意味的表达，并体现其末世宣告的语气。
- source_word: salvus factus fuerit
  choice: 得救
  rationale: 准确表达完成被动形式所指的获救状态，同时避免生硬直译。
- source_word: effugere
  choice: 逃脱
  rationale: 保留从即将临到的危险或灾难中脱身的含义。
- source_word: per opera sua
  choice: 凭自己的行为
  rationale: 直译工具或途径用法，并保留原文所引发的神学张力，不加解释。
- source_word: per fidem in qua credidit
  choice: 凭他所信的信仰
  rationale: 尽量保留原文中“信仰”与“相信”的重复结构，不将其具体化为某一宗派性的信仰观。
theological_decisions:
- issue: 逃脱与行为或信仰之间的关系
  choice: 凭自己的行为，或凭他所信的信仰
  alternative: 因自己的善行或因信而逃脱
  rationale: 原文明确使用vel（“或”）并以per表达途径；译文保留这种并列及其神学张力，不把二者调和或重释。
- issue: et erit的预告语气
  choice: 到那时
  alternative: 事情将是这样
  rationale: “到那时”在汉语中较自然，也保留未来性与末世语境；脚注列出可不单独表达这一公式的旧译式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。经文在此处句意未完，故以逗号收束，等待下一节续接；不擅自补出后续谓语。
