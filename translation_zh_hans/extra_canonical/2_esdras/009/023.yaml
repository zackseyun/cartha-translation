lexical_decisions:
- source_word: non ieiunabis
  choice: 不可禁食
  rationale: 准确表达否定的将来陈述在此处所具有的指示或命令意味；现代汉语自然、庄重。
- source_word: in eis
  choice: 在这些日子里
  rationale: 拉丁文代词所指承接上文的若干日子；补出“日子”使中文指代清楚，但不把本节残存拉丁文本没有明说的数目纳入正文。
- source_word: Ibis autem
  choice: 却要……去
  rationale: 保留与前句的转折，并表达第二人称将来时在语境中的指示意味。
- source_word: in campum florum
  choice: 到一片开满鲜花的田野
  rationale: 自然表达属格 florum；既可理解为生有花朵的田野，也避免生硬直译为“花的田野”。
- source_word: ubi
  choice: 在那里
  rationale: 原文句子在关系副词处未完，中文同样保持开放，等待下节续接。
