id: 2ES.9.13
reference: 2 Esdras 9:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti salvabuntur, et quorum saeculum et propter quos saeculum et quando.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/013.yaml
  text: Therefore do not be curious any longer about how the ungodly will be tormented, but inquire how the righteous will be saved, and whose the age is, and for whose sake the age is, and when.
translation:
  language: zh_hans
  text: 所以，你不要再好奇不敬虔的人将怎样受折磨；却要探究义人将怎样得救，这世代属于谁、为谁而有，以及何时。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句十分简略，直译为“这世代属于谁、为谁而有，以及何时”；“何时”所问的具体事件没有明说。“世代”也可译作“时代”或“世界”。
    reason: 说明原文 saeculum 的词义范围及 et quando 的刻意省略，防止读者把译文误当作完整明确的时间问题。
lexical_decisions:
- source_word: curiosus esse
  choice: 好奇
  rationale: 直接表达带有不当探究意味的“好奇”，并由“不要再”保留 noli…adhuc 的劝止语气。
- source_word: impii
  choice: 不敬虔的人
  rationale: 保留 impii 在宗教与伦理层面的含义，避免仅译作一般性的“坏人”。
- source_word: cruciabuntur
  choice: 将受折磨
  rationale: 保留将来时和遭受痛苦、刑罚的含义，不额外规定施罚者或具体方式。
- source_word: iusti
  choice: 义人
  rationale: 采用简洁、通行的圣经用语，表达被视为公义的人。
- source_word: salvabuntur
  choice: 将得救
  rationale: 保留被动与将来意义，不增添救恩方式。
- source_word: saeculum
  choice: 世代
  rationale: saeculum 可指时代、世代或世界秩序；此处选“世代”以保留时间性，同时不把它明确解释为现世或来世。
theological_decisions:
- issue: saeculum 所指的时代或世界
  choice: 译作“这世代”，不明确指定为今世或来世
  alternative: “世界”“时代”“来世”
  rationale: 原文两次使用 saeculum，却未在本节明确界定；译文避免把它锁定为某一末世论范畴。
- issue: 末尾 et quando 的省略结构
  choice: 保留为“以及何时”
  alternative: 补作“以及它何时来到”或“以及末日何时来到”
  rationale: 拉丁文没有明说何事在何时发生；保留省略可避免擅自补足具体事件。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。分号呈现从禁止无益探问到鼓励探究得救之道的转折；末尾保留原文不寻常的并列和省略。
