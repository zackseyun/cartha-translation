id: 2ES.9.12
reference: 2 Esdras 9:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreverunt, hos oportet post mortem in cruciamento cognoscere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/012.yaml
  text: and while a place of repentance was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
translation:
  language: zh_hans
  text: 当他们尚有悔改的余地时，他们却不明白，反而加以藐视；这些人死后必须在苦刑中明白这一点。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明白”在原文中没有明说宾语；“这一点”是为使中文完整而补出的，也可译作“认识”。
    reason: 说明原文 cognoscere 的宾语是隐含的，避免把补出的指代误认为原文明示。
lexical_decisions:
- source_word: paenitentiae locus
  choice: 悔改的余地
  rationale: locus 在此表示可供悔改的空间或机会；“余地”既自然，又保留“仍然开放”的含义。
- source_word: spreverunt
  choice: 加以藐视
  rationale: 准确表达主动轻蔑、弃绝之意，并以上文“悔改的余地”为隐含宾语。
- source_word: in cruciamento
  choice: 在苦刑中
  rationale: 保留 cruciamentum 所指的折磨、刑罚意味，不弱化为一般性的痛苦。
- source_word: cognoscere
  choice: 明白这一点
  rationale: 原文动词没有明说宾语；中文补出指代性的“这一点”，使句子通顺，同时不具体限定他们最终明白的内容。
theological_decisions:
- issue: 死后在苦刑中的认知
  choice: 这些人死后必须在苦刑中明白这一点
  alternative: 这些人死后必因受苦而认识真相
  rationale: 紧贴 post mortem in cruciamento cognoscere，不把苦刑明确解释为认知的原因，也不擅自补定所认识的具体“真相”。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“悔改的余地”比逐字的“悔改之地”自然；分号保留前后两层判断之间紧密而正式的关系。
