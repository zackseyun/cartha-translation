  text: 凡在仍有自由时厌弃我律法的人，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quotquot
  choice: 凡……的人
  rationale: 表达“所有这样的人”，符合汉语自然句式，并保留涵盖无遗的语气。
- source_word: fastidierunt
  choice: 厌弃
  rationale: 该词不只是一般的“不喜欢”，还含嫌恶、轻蔑而拒斥之意；“厌弃”简洁地保留这一力度。
- source_word: legem meam
  choice: 我律法
  rationale: “律法”准确传达宗教语境中的 lex，并保留说话者的第一人称所有关系。
- source_word: cum adhuc erant habentes libertatem
  choice: 在仍有自由时
  rationale: 直译其时间关系，不额外限定这里的“自由”具体指选择、悔改机会或其他意义，以保存原文的开放性。
theological_decisions:
- issue: “libertatem”的具体所指
  choice: 自由
  alternative: 自由选择的机会／悔改的机会
  rationale: 拉丁文仅说 libertatem，未明确说明是哪一种自由；正文保留其概括性，避免加入解释性神学限定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“凡……的人”使残句能自然承接上下文；保留句末逗号，以对应原文尚未完结的句法结构。
