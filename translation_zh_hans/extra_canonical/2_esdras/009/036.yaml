id: 2ES.9.36
reference: 2 Esdras 9:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos quidem qui legem accepimus peccantes peribimuset cor nostrum quod suscepiteam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/036.yaml
  text: For we indeed[a], who received the law, will perish because we sinned, and also our heart, which received it[b];
translation:
  language: zh_hans
  text: 我们这些领受了律法的人，的确会因犯罪而灭亡[a]；我们的心，就是那领受了律法的心，也会灭亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节附近的拉丁文本有些不整。这里的主要意思是：领受律法的人会灭亡，律法本身却不灭亡，仍保持尊荣。
    reason: textual_variant
  - marker: b
    text: 或译：“我们这些领受了律法的人，将在罪中灭亡；领受了律法的我们的心，也将灭亡。”
    reason: previous_rendering
lexical_decisions:
- source_word: nos quidem
  choice: 我们……的确
  rationale: quidem 带强调意味；译作“的确”既保留强调，也不把它误解为因果连接词。
- source_word: qui legem accepimus
  choice: 我们这些领受了律法的人
  rationale: 准确表达关系从句，并以自然的现代汉语修饰先行词“我们”。
- source_word: peccantes peribimus
  choice: 会因犯罪而灭亡
  rationale: peccantes 是修饰主语的现在分词，可表达“犯罪着／作为犯罪的人”；此处用“因犯罪而”自然呈现其与灭亡的紧密关系，同时在脚注注明另一种较贴近形式的理解。
- source_word: cor nostrum
  choice: 我们的心
  rationale: 保留 nostrum 明确的第一人称复数所有关系，不泛化为“那颗心”。
- source_word: quod suscepit eam
  choice: 就是那领受了律法的心
  rationale: quod 回指“心”，eam 回指阴性名词“律法”；补出“律法”可避免汉语代词指向含混。
theological_decisions:
- issue: 领受律法者与其心的灭亡
  choice: 两者都明确译为“灭亡”
  alternative: 把后半句理解为心仅仅承受罪的后果，或省略谓语而弱化其灭亡
  rationale: 拉丁文后半句与 peribimus 共用灭亡的语义，译文不应以神学推论改变这一强烈陈述。
- issue: peccantes 的逻辑关系
  choice: 正文译为“因犯罪而”
  alternative: “在罪中灭亡”或“犯罪的人将灭亡”
  rationale: 分词本身未明示严格的因果连词，但语境自然呈现犯罪与灭亡的关联；脚注保留较形式对应的另一译法，以免过度消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“领受”适合宗教及正式语境，但仍为普通读者所理解；用分号呈现两个并列而共用“灭亡”概念的分句，并在后句补出谓语，以免汉语残缺。
