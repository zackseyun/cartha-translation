  yaml_path: translation/extra_canonical/2_esdras/009/026.yaml
  text: So I went[a], as he told me, into the field called Ardat, and I sat there among the flowers. I ate the herbs of the field, and their food satisfied me.
translation:
  language: zh_hans
  text: 于是，我照他所吩咐的，来到名叫阿尔达特的田野，坐在花丛中。我吃了田间的草；从这些草所得的食物使我饱足了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译："它们的食物成了我的饱足。"这里指从这些草所得的食物。
    reason: 说明拉丁语 esca earum 的来源性表达，避免现代汉语中“它们的食物”可能造成的所有关系误解。
lexical_decisions:
- source_word: Ardat
  choice: 阿尔达特
  rationale: 按专名音译，保留拉丁文本中的地名形式。
- source_word: in floribus
  choice: 在花丛中
  rationale: 直译为“在花中”在现代汉语中略显生硬；“在花丛中”自然表达身处花草之间。
- source_word: herbis agri
  choice: 田间的草
  rationale: herbae 可指草本植物或可食野草；“田间的草”既贴近原文，也不擅自限定具体种类。
- source_word: facta est esca earum in saturitatem
  choice: 这些草作食物，使我吃饱了
  rationale: 表达这些草成为食物并达到饱足之效，避免把 earum 生硬译成容易误解为所有关系的“它们的食物”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。主句简洁叙事，地名音译；结尾保留原文“食物—饱足”的关系而避免生硬所有格。所给拉丁文本末尾 Et factum est post dies 是下一叙事单位未完的起始语，因此本节正文不纳入该残句。
