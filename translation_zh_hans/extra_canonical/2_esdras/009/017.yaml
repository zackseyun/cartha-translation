  text: qualis ager, talia et semina, et quales flores, tales et tincturae, et qualis opera, talis et creatio, et qualis agricola, talis et area. quoniam tempus erat saeculi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/017.yaml
  text: He answered me and said[a], “As the field is, so also are the seeds; and as the flowers are, so also are the colors; and as the work is, so also is the creation; and as the farmer is, so also is the threshing floor. For there was a time of the age,”
translation:
  language: zh_hans
  text: 他回答我说：“田地怎样，种子也怎样；花朵怎样，色彩也怎样；作为怎样，创造也怎样；农夫怎样，禾场也怎样。因为那是这世代的一个时期[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世代”也可译作“时代”或“世界”；“时期”也可译作“时机”。本句在下一节继续。
    reason: saeculi 与 tempus 均有一定语义幅度；原文句法延续至下一节。
lexical_decisions:
- source_word: ager
  choice: 田地
  rationale: 对应耕作的土地，并与后文的种子、农夫和禾场保持农耕意象。
- source_word: tincturae
  choice: 色彩
  rationale: 在花朵的语境中指其着色或颜色；“色彩”比“染料”更符合此处自然意象。
- source_word: opera
  choice: 工作
  rationale: 保留拉丁文与 creatio 之间“工作—成果/受造物”的对应，不将其具体化为某一种行为。
- source_word: creatio
  choice: 受造之物
  rationale: 此处与 opera 构成类比，既可指创造，也可指所造的成果；正文采用较自然的具体表达，同时以脚注保留另一可能。
- source_word: area
  choice: 禾场
  rationale: 准确表达用于打谷、扬场的场地，并保留与农夫相连的古代农耕背景。
- source_word: saeculi
  choice: 这世代
  rationale: saeculum 可指世代、时代或世界；“这世代”保留其时间性，也避免过早解释为物质世界。
theological_decisions:
- issue: opera 与 creatio 的对应关系
  choice: “工作怎样，受造之物也怎样”
  alternative: “工程怎样，创造也怎样”
  rationale: 不把“创造”专门限定为神学上的创世行动；保留工作者及其成果相互对应的张力。
- issue: tempus erat saeculi 的含义
  choice: “这世代曾有它的时期”
  alternative: “那时正是这世代的时期”
  rationale: 拉丁文没有表示“这样的”指示成分；译文表达某个属于该世代的时期曾经存在，并让句意自然延续到下一节，而不擅自说明该时期的性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。四组类比保留原文反复的“怎样……也怎样”结构；末句保留未完待续的逗号，以反映它与下一节的句法连接。未加入所给拉丁文本中没有的“他回答我说”。
