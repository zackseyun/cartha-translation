lexical_decisions:
- source_word: fles
  choice: 哭泣
  rationale: 准确表达持续或正在发生的哭泣，语体自然庄重。
- source_word: doles
  choice: 悲痛
  rationale: 既可表达内在忧伤，也保留强烈的哀痛意味。
- source_word: animo
  choice: 心里
  rationale: 拉丁语 animus 可指心、心思或灵；“心里”在现代汉语中自然，并避免把此处过度限定为专门的人论术语。
- source_word: et dixit ad me
  choice: 她对我说
  rationale: 完整保留本节末尾引出妇人回答的叙述句，并根据上下文明确阴性主语。
