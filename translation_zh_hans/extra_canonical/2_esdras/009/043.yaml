  text: She said to me, “I, your female servant, was barren and did not bear a child, though I had a husband for thirty years.”
translation:
  language: zh_hans
  text: 她对我说：“我，你的婢女，原是不育的；虽有丈夫已有三十年，却没有生过孩子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: famula tua
  choice: 你的婢女
  rationale: famula 是阴性名词，可指女仆或女奴；“婢女”既保留其女性身份及卑微、自称服属的语气，也比现代汉语中的“女奴”更适合直接称呼对方的庄重叙事语境。
- source_word: sterilis fui
  choice: 曾不能生育
  rationale: 准确表达过去持续的不育状态；相较“曾是不生育的”，“曾不能生育”更符合现代汉语。
- source_word: non peperi
  choice: 没有生过孩子
  rationale: peperire 指生产、分娩；结合不育语境，译为“没有生过孩子”自然且不额外限定孩子性别。
- source_word: habens maritum annis triginta
  choice: 我有丈夫三十年
  rationale: 保留拉丁文对婚姻关系持续三十年的直接表述，不擅自改成“结婚三十年”或明确其起止时间。
