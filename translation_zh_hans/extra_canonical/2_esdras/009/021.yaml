  text: ualde et saluaui mihi acinum de botru et plantationem de tribu multa. Pereat ergo multitudo quae sine causa nata est et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/021.yaml
  text: And I saw[a], and I spared them with very great difficulty, and I saved for myself one grape from the cluster, and one planting from a great forest.
translation:
  language: zh_hans
  text: 我看见了，就极其宽待了他们；我为自己从一串葡萄中保存了一颗葡萄，又从一大片森林中保存了一株幼苗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文作“从一个大支派中”；其他古代译本作“从一大片森林中”。这里采用“森林”，因其与上半句的比喻结构相呼应。
    reason: 说明现存拉丁文本与据其他古代译本及上下文所采用读法之间的重要异读。
lexical_decisions:
- source_word: peperci eis valde（由经文上下文及校勘文本补足；所给片段仅存 ualde）
  choice: 极其艰难才饶过他们
  rationale: valde 本义为“非常、极其”；结合完整拉丁校勘文本中 peperci eis 的语境，以“极其艰难才……”自然表达强调程度，同时保留“饶过”的意义。
- source_word: saluaui mihi
  choice: 我为自己……保留
  rationale: 这里不是一般意义上的救援，而是从将毁灭的整体中为自己保存少数，故译作“为自己保留”。
- source_word: acinum de botru
  choice: 从一串葡萄中保留了一颗葡萄
  rationale: acinum 指单颗葡萄，botrus 指一串葡萄；明确呈现个体与整体的对照。
- source_word: plantationem
  choice: 一株树苗
  rationale: 该词可指栽种之物或植株；与“森林”对应时，“一株树苗”在现代汉语中自然，并保留从大片林木中存留一株的意象。
- source_word: de tribu multa
  choice: 从一大片森林中
  rationale: 现存拉丁文直读为“从一个大支派中”，但此处反映希腊文传抄中“森林”与“支派”的混淆；叙利亚文、埃塞俄比亚文、阿拉伯文和亚美尼亚文均支持“森林”，且与前句“一颗葡萄/一串葡萄”的平行结构相合。
theological_decisions:
- issue: 少数被保留与多数灭亡之间的张力
  choice: 直译“为自己保留”，不解释被保留者的身份或原因
  alternative: 将其释义为特定宗派意义上的“余民”或“选民”
  rationale: 原文使用保存少量葡萄和植株的比喻，却未在本节界定其系统神学含义；译文保留这种张力，不作教派化阐释。
- issue: “饶过他们”的困难程度
  choice: 译作“极其艰难才饶过他们”
  alternative: 弱化为“勉强饶过他们”或解释为上帝能力有限
  rationale: 原文强调过程之艰难，但没有说明这种艰难的性质；译文既保留强调，也不额外推导神学结论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“极其艰难才”比生硬的“非常困难地”更自然；“一颗葡萄/一串葡萄”与“一株树苗/一大片森林”形成清楚的平行对照。所给拉丁片段末尾的 Pereat ergo multitudo 属下一节起句，未纳入本节。
