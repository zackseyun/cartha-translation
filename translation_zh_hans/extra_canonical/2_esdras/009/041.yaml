  text: She said to me, “Leave me, my lord, so that I may weep for myself and add to my sorrow, for I am very bitter in spirit and greatly humbled.”
translation:
  language: zh_hans
  text: 她对我说：“我主，请别管我，好让我为自己哀哭，增添我的愁苦；因为我心中十分愁苦，也极其受辱。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte me
  choice: 请让我独自待着
  rationale: 表达让说话者不受打扰、独自哀哭的请求；比单说“离开我”更符合现代汉语语境，同时不增添实质内容。
- source_word: dominus meus
  choice: 我主
  rationale: 保留对对方尊敬的直接称呼，也与本书古典、庄重的语域相称。
- source_word: ut defleam me
  choice: 好让我为自己哭泣
  rationale: defleam 表示哀哭；反身宾语 me 译作“为自己”，保留她因自身境况而哭泣的含义。
- source_word: et adiciam dolorem
  choice: 愁上加愁
  rationale: 传达“增添愁苦”的意思，并采用自然、凝练的现代汉语表达。
- source_word: valde amara sum animo
  choice: 我心里十分苦楚
  rationale: 将 animo 处理为内在心境，“苦楚”自然表达 amara 的情绪意义，避免生硬直译为“心灵苦涩”。
- source_word: humiliata sum valde
  choice: 深感卑微
  rationale: 保留 humiliata 的受压低、卑微状态，同时避免武断限定为外在羞辱或单纯谦卑。
theological_decisions: []
