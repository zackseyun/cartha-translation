  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/033.yaml
  text: For those who received it perished[a], because they did not keep what had been sown in them. And behold, it is the custom that, when the earth has received seed,
translation:
  language: zh_hans
  text: 因为那些领受的人灭亡了[a]，因他们没有持守那撒在他们里面的。看哪，惯常的情形是：土地一接受种子后，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但那些领受的人灭亡了。”
    reason: 保留此前将句首连词理解为转折的译法；但按上文语境及拉丁文Nam，正文采用解释性的“因为”。
lexical_decisions:
- source_word: acceperunt
  choice: 领受了它
  rationale: 承接上文所说的律法；拉丁文宾语在本节片段中省略，中文补出“它”以使指代自然。
- source_word: perierunt
  choice: 灭亡了
  rationale: 保留该词强烈的毁灭、丧失生命之意，也与前文关于律法果实并未灭亡的对照相呼应。
- source_word: custodientes
  choice: 守住
  rationale: 既表达保存，也含遵守、持守之意，适合内在所撒之物的语境。
- source_word: seminatum fuerat
  choice: 所撒……的
  rationale: 保留完成时的被动播种意象，不把比喻提前解释为某一特定教义概念。
- source_word: consuetudo est
  choice: 通常
  rationale: 以自然现代汉语表达“这是常例／惯常情形”，并顺畅引出未完的比喻。
- source_word: terra
  choice: 大地
  rationale: 保持土地接受种子的拟人化农业意象；“大地”庄重而易懂。
theological_decisions:
- issue: 首句与上文的逻辑关系
  choice: 因为
  alternative: 但是
  rationale: 结合校勘上下文中位于本句开头的 Nam，应表达解释关系：律法的果实并未灭亡，因为灭亡的是领受者。
- issue: “撒在他们里面的”所指为何
  choice: 保留隐喻，不明确释为律法、道或种子
  alternative: 译作“撒在他们心里的律法／道”
  rationale: 拉丁文仅以中性关系结构 quod 指称所撒之物；明确化会消除原文留有的含混和比喻张力。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。正文保留本节末尾未完句式，因为原始分节在此截断，下一节续接比喻。
