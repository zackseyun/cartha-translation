  yaml_path: translation/extra_canonical/2_esdras/009/002.yaml
  text: then you will understand that this is the time when the Most High will begin to visit the world that was made by him[a]. And when a shaking of places is seen in the world,
translation:
  language: zh_hans
  text: 那时，你就会明白：这正是至高者开始察看他所造的世界[a]的时候。而当世上出现各地的震动时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察看”在这里也可指“临到并介入”，并可能含有审判的意味。
    reason: 说明 uisitare 在末世语境中的语义力度，同时保留原文未明确限定的多义性。
lexical_decisions:
- source_word: tempus, in quo
  choice: 这正是……的时候
  rationale: 以自然的现代汉语表达所指明的特定时刻，并保留原文关系从句的结构意义。
- source_word: incipiet
  choice: 开始
  rationale: 直接保留将来起始体意义。
- source_word: altissimus
  choice: 至高者
  rationale: 这是该书对上帝的庄严称谓，中文圣经语体中清楚而自然。
- source_word: uisitare
  choice: 察看
  rationale: 既保留“临到、鉴察”的圣经传统意味，也避免现代汉语“访问”所带来的普通社交含义；上下文仍容纳审判性介入的意味。
- source_word: saeculum qui ab eo factus est
  choice: 他所造的世界
  rationale: 按拉丁文关系结构表达受造世界，并以符合现代汉语的方式处理阳性关系代词与 saeculum 的搭配。
- source_word: motio locorum
  choice: 各地震动
  rationale: 保留复数 locorum 的地域分布意味，不武断限定为地震，也不将 motio 泛化为社会动乱。
- source_word: quando uidebitur
  choice: 若出现……的景象
  rationale: 表达可见征兆出现之时；承接未完句时，用“若”使中文自然，同时不把它处理成纯粹不确定条件。
theological_decisions:
- issue: uisitare 的末世性含义
  choice: 察看
  alternative: 干预／眷临／审判
  rationale: 原词在末世语境中可能包含主动介入和审判，但仅译“干预”会弱化其圣经惯用语的多义张力，译“审判”则过度明确。正文用“察看”，脚注提示其可有“临到并介入”的含义。
- issue: motio locorum 所指的现象
  choice: 各地震动
  alternative: 地震／各处动荡
  rationale: 原文没有明确限定为地质地震或社会动乱，因此保留较宽泛而具象的表达。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“世上若出现各地震动的景象”刻意保留为未完句，以对应原文在本节末尾继续引向下文的句法。
