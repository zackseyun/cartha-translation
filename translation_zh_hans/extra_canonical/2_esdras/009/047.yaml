lexical_decisions:
- source_word: cum crevisset
  choice: 他长大了
  rationale: 准确表达完成时虚拟式在时间从句中的含义，指儿子已经成年。
- source_word: venissem accipere illi uxorem
  choice: 我便为他娶妻
  rationale: 按拉丁文语境表达父亲为儿子迎娶妻子；避免生硬直译“来为他取一个妻子”。
- source_word: feci diem epuli
  choice: 设宴庆贺了一天
  rationale: 自然传达“举办一日宴席”的意思，同时保留宴庆持续一天的信息。
