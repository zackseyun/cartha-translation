  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/034.yaml
  text: And behold[a], it is the custom that when the earth receives seed, or the sea a ship, or any other vessel food or drink,
translation:
  language: zh_hans
  text: 或海接纳船只，或别的器皿盛装食物或饮料；当所撒下的或所放入的东西将被毁灭时，或……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文在此以“或”（vel）中断，句意接续下文。
    reason: 说明本节末尾的拉丁文本为未完句，并保留原文以 vel 结束的结构。
lexical_decisions:
- source_word: nauem mare
  choice: 海接纳船
  rationale: 拉丁文以“船”为宾格、“海”为主格，承接上文省略的“接纳”之意；汉语调整语序，使关系清楚自然。
- source_word: uas aliud
  choice: 别的器皿
  rationale: 保留 aliud“别的、另一个”，维持海、地与其他容器之间的修辞类比。
- source_word: escas uel potus
  choice: 食物或饮料
  rationale: escas 为复数宾格，泛指食物；potus 在此指饮料。
- source_word: exterminetur
  choice: 毁灭
  rationale: 该词在此表示被除灭、毁掉，不把原因或方式具体化。
- source_word: quod seminatum est uel quod missum est
  choice: 所撒下的或所放入的东西
  rationale: 保留两个被动表达的区别；missum 在容器语境中译为较宽泛的“放入”，避免限定为投掷或差遣。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代汉语；以“接纳／盛装”补足拉丁文承前省略的谓语，同时用省略号保留底本末尾未完的“或”。
