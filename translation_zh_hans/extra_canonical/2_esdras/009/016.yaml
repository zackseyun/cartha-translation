  text: just as waves are multiplied beyond a drop.” And he answered me and said,[a]
translation:
  language: zh_hans
  text: “正如波涛比一滴水多得多。”他回答我说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正如一道波浪大过一滴水。”
    reason: fluctus 可按单数主格理解；此处比较也可能侧重一道波浪与一滴水之间的大小悬殊，而不只侧重数量。
lexical_decisions:
- source_word: multiplicat
  choice: 远远超过
  rationale: 该动词基本义涉及增多、扩大；在此比较结构中译为“远远超过”，既表达数量或规模上的悬殊，也避免生硬直译为“被增多”。
- source_word: fluctus
  choice: 波涛
  rationale: fluctus 的形态在此可被理解为单数主格，也可能因语境而有集合性或复数意味；“波涛”在现代汉语中自然，并保留其集合性。
- source_word: guttam
  choice: 一滴水
  rationale: gutta 指液滴；比较波涛时补出“水”，符合现代汉语习惯且不改变意象。
- source_word: et respondit ad me et dixit
  choice: 他回答我说
  rationale: 完整保留本节末尾的对话引语句，并以冒号表明下文将承接其话语。
theological_decisions:
- issue: 波涛与水滴的比较究竟强调数量还是大小
  choice: 采用较开放的“远远超过”
  alternative: “波涛的数量远多于一滴水”或“一道波浪大过一滴水”
  rationale: 拉丁文 multiplicat 与 super 构成的表达并不完全等同于单纯的“更大”或“更多”；正文保留比较维度的张力，脚注列出偏向单数和大小的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“波涛”保留原文意象；句末冒号严格保留本节中的引语导入功能。
