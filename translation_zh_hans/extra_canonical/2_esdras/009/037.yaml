  yaml_path: translation/extra_canonical/2_esdras/009/037.yaml
  text: For the law does not perish[a], but remains in its honor.”
translation:
  language: zh_hans
  text: 因为律法并不消逝，而是在自己的尊荣中长存。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lex
  choice: 律法
  rationale: 在本段语境中指上帝所赐的律法；“律法”是准确、自然且具有经文语体的对应词。
- source_word: non perit
  choice: 并不消逝
  rationale: 表达 perire 的“不灭亡、不消失”之意；用于律法时，“消逝”比“死亡”自然。
- source_word: sed permanet
  choice: 反而始终保有
  rationale: 用“反而”保留 sed 与前项否定之间的鲜明转折；“始终”传达 permanere 的持续性，并与后面的介词短语自然衔接。
- source_word: in suo honore
  choice: 它的尊荣
  rationale: honor 可指尊荣、尊贵地位；译作“尊荣”保留原文措辞，不将其解释性地改写为“效力”或“权威”。
theological_decisions:
- issue: 律法会否随领受者犯罪灭亡而消失
  choice: 明确保留“律法并不消逝，反而持续处于尊荣中”的对照
  alternative: 解释为律法仍然有效或仍有权威
  rationale: 原文强调 lex 与人的灭亡形成张力，但 in suo honore 的含义不应被收窄为单一的“效力”观念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”对应 Nam，“反而”对应 sed。开头的 suscepit eam 属于上一句的收尾，未纳入本节正文。
