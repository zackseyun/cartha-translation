source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Iacob intendite sermonibus meis. Ecce enim semino in uobis legem meam, et faciet in uobis fructum, et glorificabimini in eo per saeculum. Nam patres nostri accipientes legem non seruauerunt et legitima non custodierunt, et factus est fructus legis non periens; nec enim poterat quoniam tuus erat. Nam qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/031.yaml
  text: For behold, I sow my law in you, and it will bear fruit in you, and by it you will be glorified forever.’
translation:
  language: zh_hans
  text: 看哪，我把我的律法撒在你们里面；它必在你们里面结出果实，你们也必因它[a]得荣耀，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因它”也可译作“在其中”。
    reason: 原文in eo兼有工具、缘由和范围等可能含义。
lexical_decisions:
- source_word: semino
  choice: 撒
  rationale: 保留播种的具体意象，并与后文“结出果实”自然呼应。
- source_word: legem meam
  choice: 我的律法
  rationale: 准确保留所有格及宗教、法律语境中的核心用语。
- source_word: in uobis
  choice: 在你们里面
  rationale: 原文为复数，可指律法在听众群体内部或各人里面运行；此译保留其内在性，不缩减为单纯“给你们”。
- source_word: faciet in uobis fructum
  choice: 它必在你们里面结出果实
  rationale: 按拉丁语的结果性表达译出，并保留播种—结果的贯穿比喻。
- source_word: glorificabimini
  choice: 你们必得荣耀
  rationale: 保留被动语态，又采用自然的现代汉语表达，不擅自补出施动者。
- source_word: per saeculum
  choice: 直到永远
  rationale: 在此语境中表达持续无尽的时间，是自然且庄重的对应。
theological_decisions:
- issue: in eo所表达的律法与得荣耀之间的关系
  choice: 因它得荣耀
  alternative: 在其中得荣耀
  rationale: 拉丁语in加夺格可表达凭借、缘由或范围；正文采用较自然的工具性理解，同时以脚注保存范围性译法，避免将歧义完全消除。
- issue: 得荣耀的施动者
  choice: 不补明施动者
  alternative: 被上帝赐予荣耀
  rationale: 原文只用被动式，并未明说谁使他们得荣耀；不加入“上帝”可避免超出本文的明确表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“撒种—结果”的完整意象及被动的“得荣耀”，并避免增添原文未明说的神学主体。
