  text: 'dicere coram altissimo et dixi: O domine in nobis ostendens ostensus es patribus nostris in deserto quando erant exientes de Aegypto et quando ueniebant in deserto quod non calcatur et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/029.yaml
  text: O Lord[a], you showed yourself among us to our fathers in the wilderness, when they were coming out of Egypt and were entering the untrodden and fruitless desert,
translation:
  language: zh_hans
  text: 主啊，你确实曾在我们中间向我们的祖先显现；那时，他们正从埃及出来，进入无人踏足、毫无出产的旷野，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendens ostensus es
  choice: 你确实曾……显现
  rationale: 拉丁文以同源形式重复“显现”，很可能保留了闪语式强调；用“确实”传达强调，同时避免生硬直译。
- source_word: in nobis
  choice: 在我们中间
  rationale: 按其空间或群体含义直译，保留显现发生于共同体中的意味。
- source_word: patribus nostris
  choice: 我们的祖先
  rationale: 现代汉语中“祖先”比“父辈”更自然，也符合这里所指的出埃及世代。
- source_word: deserto quod non calcatur
  choice: 无人踏足的旷野
  rationale: 保留“未被踩踏”的具体意象，并以自然汉语表达其荒无人烟。
- source_word: infructuoso
  choice: 毫无出产
  rationale: 依据经校勘补足的短语及英语审校层所反映的完整读法，表达旷野不能生产果实或作物的含义。
theological_decisions:
- issue: in nobis 与 patribus nostris 的句法关系
  choice: 在我们中间向我们的祖先显现
  alternative: 向我们，也就是向我们的祖先显现
  rationale: 正文采用最直接的群体内显现之读法；脚注保留把“我们”与“我们的祖先”视为同位关系的可能，不消解原文张力。
- issue: ostendens ostensus es 的强调程度
  choice: 以“确实”明示强调
  alternative: 只译作“显现”
  rationale: 重复结构很可能具有强调功能；汉语无法自然复制该同源重复，因此以副词补偿，但不扩展为更强的神学断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主啊”保留祷告式呼告；“旷野”沿用读者熟悉的圣经用语。源文本截于连词 et，但完整短语由校勘传统及审校层支持为“无人踏足、毫无出产的旷野”。
