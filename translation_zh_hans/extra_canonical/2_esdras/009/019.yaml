  yaml_path: translation/extra_canonical/2_esdras/009/019.yaml
  text: But those created in this prepared world[a], with an unfailing table and an unsearchable law, have been corrupted in their ways. And I considered my age, and behold,
translation:
  language: zh_hans
  text: 当这一切预备妥当，又有永不匮乏的筵席和无法穷究的律法[a]时，他们的品行竟败坏了。我察看我的世代，看哪，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永不匮乏的筵席和无法穷究的律法”在拉丁文中含义较难确定。前者可指永不缺乏的席桌或供应，后者指难以穷究的律法；此处保留原文的并列意象，不确定其更具体的所指。
    reason: textual_variant
lexical_decisions:
- source_word: hoc parato
  choice: 在这预备好的世界里
  rationale: 拉丁文直译为“这预备好的”，所修饰的名词须由上下文补出；依语境及校审层译文补作“世界”，并以处所结构形成自然汉语。
- source_word: mensa indeficienti
  choice: 取用不尽的筵席
  rationale: mensa 可指桌子或摆设食物的筵席；indeficiens 表示不会缺乏、不会耗尽。译作“取用不尽的筵席”保留供应充足的意象。
- source_word: lege inuestigabili
  choice: 测不透的律法
  rationale: inuestigabilis 表示无法穷究或探明；“测不透”既保留原文的难以穷究，也不擅自解释律法的具体性质。
- source_word: corrupti sunt moribus eorum
  choice: 品行却败坏了
  rationale: moribus 指行为、品行或生活方式；采用自然简洁的汉语表达其道德败坏之意。
- source_word: saeculum meum
  choice: 我的世代
  rationale: saeculum 在此可指时代或世代；“我的世代”保留说话者审视其所处人世的表达。
- source_word: ecce
  choice: 看哪
  rationale: 保留引出后文、唤起注意的叙事语气，并维持本节未完的句法张力。
theological_decisions:
- issue: 筵席与律法所表达的神学含义
  choice: 保留“取用不尽的筵席”和“测不透的律法”的并列意象
  alternative: 解释为上帝已向人类赐下完备的物质供应与启示
  rationale: 拉丁文措辞本身艰涩；正文不将意象化约为单一教义解释，以保留原文的含混与张力。
- issue: 受造之人败坏的转折关系
  choice: 以“虽有……却……”表达
  alternative: 仅按原文并列各分句
  rationale: 该结构自然呈现人已得供应与律法、品行仍然败坏的反差，但不进一步判定败坏的机制或责任性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“看哪”保留经文叙事的提示语气；句末逗号反映原文在此尚未说完，并与下一节衔接。
