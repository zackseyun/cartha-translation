  naturalness: “我察看我的世代”既有词义问题，也使两次“察看”显得不必要地重复。改为“我看见……”的并列句式，更贴合启示性叙述的节奏；“勉强饶过了他们”自然表达 peperci eis uix。
  terminology: perditum 译“败坏”可保留；orbis 译“我所居住的世界”以区别 mundus；cogitationes 译“图谋”可行，但不应加定其来源。peperci 应译为“饶过／宽恕”，不可省略；uix 应体现“勉强／几乎不能”。
