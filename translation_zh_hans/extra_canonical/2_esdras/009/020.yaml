  text: erat perditum, et orbem meum, et ecce erat periclitans propter cogitationes quae in eo aduenerunt. Et uidi et peperci eis uix
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/020.yaml
  text: And I considered my world, and behold, it was ruined; and my inhabited world, and behold, it was in peril because of the schemes that had come into it.
translation:
  language: zh_hans
  text: 我看见我的世界，看哪，它已经败坏；又看见我所居住的世界，看哪，它因其中出现的图谋而处于危境。我看见了，就勉强饶过了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erat perditum
  choice: 已经败坏
  rationale: perditum 可表示毁坏、丧失或败坏；此处描述世代的状态，用“败坏”自然庄重，也保留道德与毁灭两方面的张力。
- source_word: orbem meum
  choice: 我的世界
  rationale: orbis 在这里指有人居住的世界；现代汉语中“我的世界”简明自然，并保留物主含义。
- source_word: erat periclitans
  choice: 陷入危境
  rationale: 该词表示正处于危险、面临覆亡；“陷入危境”保留进行中的危急状态。
- source_word: cogitationes
  choice: 图谋
  rationale: cogitationes 本义范围包括思想、谋划；语境带来危害，故译“图谋”，但不进一步指定其主体或性质。
- source_word: quae in eo aduenerunt
  choice: 其中出现的
  rationale: 直陈这些图谋来到或出现在世界之中，不补入原文未明说的来源。
theological_decisions:
- issue: “败坏”是否仅指道德腐化或彻底毁灭
  choice: 保留兼具败坏与毁坏意味的表达
  alternative: 译作“已经毁灭”或“已经堕落”
  rationale: perditum 语义具有张力，单独限定为物质毁灭或道德堕落都会缩窄原文。
- issue: 造成世界危险的 cogitationes 如何理解
  choice: 译作“图谋”，不指明是人的、邪灵的或世界自身的
  alternative: 译作“恶念”或“人的计谋”
  rationale: 拉丁文没有明示主体或增加“恶”的形容词，应避免导入额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“看哪”保留启示文学中提示读者注意的语气。所给拉丁文本开头似从句中截入，结尾“Et uidi et peperci eis uix”则很可能属于下一节；本节正文依本节的完整语义范围及审校层处理，不把下一节内容并入。
