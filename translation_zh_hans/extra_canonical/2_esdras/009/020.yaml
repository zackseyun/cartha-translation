  to: 我看见我的世界，看哪，它已经败坏；又看见我所居住的世界，看哪，它因其中出现的图谋而处于危境。我看见了，就勉强饶过了他们。
  rationale: 修订补足原文末句，并将首个对象由“世代”校正为“世界”。“我所居住的世界”对应 orbis 的有人居住之域；末句的“他们”保留 eis 的复数指代，未擅自具体化其所指。“勉强”表达 uix 的限制语气。
