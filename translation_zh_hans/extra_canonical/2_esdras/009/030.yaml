  text: and you said[a], saying, ‘Hear me, O Israel, and give ear to my words, O seed of Jacob.’
translation:
  language: zh_hans
  text: 你开口说道[a]：“以色列啊，要听我；雅各的后裔啊，要侧耳听我的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你说着，说道。”原文以重复式的言说表达引出下文。
    reason: 说明拉丁文 dicens dixisti 的重复式表达，避免“又说”所添加的再次说话含义。
lexical_decisions:
- source_word: dicens dixisti
  choice: 你又开口说道
  rationale: 拉丁文以两个同源言说表达构成重复式措辞；正文用自然的现代汉语合并表达，并以脚注保留其字面形式。
- source_word: Tu Israel audi me
  choice: 以色列啊，要听我
  rationale: 保留直接呼语及命令语气；“啊”清楚标示“以色列”为受呼唤者。
- source_word: semen [Iacob]
  choice: 雅各的后裔
  rationale: semen 在群体称谓中意为“后裔”；依据本节经文传承中完整的平行呼语补足“雅各”。
theological_decisions:
- issue: 言说动词的重复表达
  choice: 正文采用“开口说道”，脚注注明直译
  alternative: 你又说，宣告道
  rationale: 既不把源文的重复误解为两个不同的言语行动，也不完全抹去其闪语式重复痕迹。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“侧耳听”保留诗性平行，与“要听我”形成自然对应；呼语次序依照拉丁文“Tu Israel audi me”处理。
