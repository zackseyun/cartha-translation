revisions:
- from: 过了三十年，神垂听了我这婢女[a]，看见我的卑微，留意我的苦难，赐给我一个儿子。我因他大大欢喜；我、我的丈夫和所有同城的人都欢喜，并且极其尊崇那大能者。
  to: 过了三十年，神垂听了我——你的婢女[a]，看见我的卑微，留意我的苦难，赐给我一个儿子。我、我的丈夫和所有同城的人都因他大大欢喜；我们又极其尊崇那大能者。
  rationale: 修订将“我、我的丈夫和所有同城的人”明确作为“因他大大欢喜”的共同主语，并将末句的“我们”对应原文随后共同尊崇神的动作。以破折号标明“你的婢女”是对“我”的同位语；其替代性句法理解仍由脚注保留。
