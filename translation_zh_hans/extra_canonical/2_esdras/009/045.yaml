source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post triginta annos, exaudivit me Deus ancillae tuae et pervidit humilitatem meam et adtendit tribulationi meae et dedit mihi filium. et iucundata sum super eum valde ego et vir meus et omnes cives mei, et honorificabamus valde Fortem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/045.yaml
  text: And it happened after thirty years that God heard me[a], your female servant, and saw my humiliation, and paid attention to my distress, and gave me a son. And I rejoiced over him greatly, I and my husband and all my fellow citizens, and we greatly honored the Mighty One.
translation:
  language: zh_hans
  text: 过了三十年，神垂听了我——你的婢女[a]，看见我的卑微，留意我的苦难，赐给我一个儿子。我、我的丈夫和所有同城的人都因他大大欢喜；我们又极其尊崇那大能者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文直译也可能被理解为“你婢女的神垂听了我”，但这里更可能是“神垂听了我，就是你的婢女”。
    reason: 说明拉丁文ancillae tuae的格位歧义及其可能反映的翻译腔。
lexical_decisions:
- source_word: exaudivit
  choice: 垂听
  rationale: 既表达神听见祈求，也体现应允、眷顾之意，符合此处祷告蒙应允的语境。
- source_word: ancillae tuae
  choice: 我这婢女
  rationale: 按拉丁译文背后的句法，理解为与“我”同位的自称，而非“你婢女的神”；“婢女”保留女性身份及卑微的仆属语气。
- source_word: humilitatem
  choice: 卑微
  rationale: 可兼顾低微处境与受屈状态，不把含义过度限定为主观谦卑。
- source_word: tribulationi
  choice: 苦难
  rationale: 自然表达困苦、患难的处境。
- source_word: cives mei
  choice: 同城的人
  rationale: 此处指与说话者同属一城的居民；比现代政治意义较强的“公民”更自然。
- source_word: Fortem
  choice: 那大能者
  rationale: 保留 substantivized 形容词作为神的称号，并用“那”标示特指。
theological_decisions:
- issue: “Deus ancillae tuae”的句法关系
  choice: 神垂听了我这婢女
  alternative: 你婢女的神垂听了我
  rationale: 拉丁文的格位不整很可能反映希腊底本中受词代词与同位语的结构；上下文也支持说话者自称“你的婢女”。
- issue: humilitas 的语义
  choice: 我的卑微
  alternative: 我的屈辱
  rationale: 原词可指低微、卑下或受辱处境；正文采用较宽泛的“卑微”，避免无根据地只取“羞辱”一义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“垂听”“赐给”“尊崇”保留经文语体，但避免生硬古奥；分号用于清楚呈现共同欢喜的复合主语。
