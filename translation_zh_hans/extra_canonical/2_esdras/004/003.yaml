  yaml_path: translation/extra_canonical/2_esdras/004/003.yaml
  text: And I said, “Yes, my lord.” And he answered me and said, “I have been sent to show you three ways, and to set three comparisons before you.
translation:
  language: zh_hans
  text: 我说：“是的，我主。”他回答我说：“我奉差遣来向你指明三条路，并在你面前提出三个比喻。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus meus
  choice: 我主
  rationale: 保留对受尊敬者的直接称呼及原文较庄重的语气，不擅自判定其神学身份。
- source_word: tres uias
  choice: 三条路
  rationale: 按字面保留“路”的意象；上下文可能赋予其论证或选择层面的含义，但本节不先行解释。
- source_word: missus sum
  choice: 我奉差遣来
  rationale: 准确表达拉丁文完成时被动结构，同时保持差遣者未明说的原文状态。
- source_word: similitudines
  choice: 比喻
  rationale: 此处指为说明问题而提出的类比性例证；“比喻”自然易懂，并保留一定语义宽度。
- source_word: proponere coram te
  choice: 在你面前提出
  rationale: 兼顾 proponere 的“提出、摆出”与 coram te 的当面呈示意味。
theological_decisions:
- issue: 差遣者的身份
  choice: 采用“奉差遣”而不补出主语
  alternative: 译作“上帝差遣我”
  rationale: 原文只说“我被差遣”，没有在本节明确指出差遣者；不应在译文中补足。
- issue: dominus meus 所指身份
  choice: 译为“我主”
  alternative: 译为“我的主人”或“先生”
  rationale: 保留原称谓的尊敬与庄重，也避免把该称呼明确限定为神性称号或世俗主仆关系。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。保留原文重复的“他回答我说”，以呈现其经文风格；不添加解释性内容。
