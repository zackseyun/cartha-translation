source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: De quibus si mihi renunciaueris unam ex his, et ego tibi demonstrabo uiam quam desideras uidere, et doceam te quare cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/004.yaml
  text: If you report to me one of these[a], then I also will show you the way that you desire to see, and I will teach you why the heart is evil.”
translation:
  language: zh_hans
  text: “在这些事中，你若向我说明一件[a]，我也会向你指明你想要看见的那条路，并教导你心为何邪恶。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这些事中，你若向我报告一件。”
    reason: renunciaueris 可较字面地译为“报告、告知”；依此处问答语境，正文译为“说明”。
lexical_decisions:
- source_word: renunciaueris
  choice: 向我说明
  rationale: 该动词基本义为“报告、告知”；在此语境中，天使要求以斯拉回答前述问题，因此译作“说明”既保留陈述答案之意，也符合现代汉语表达。拉丁文是直接条件句，正文不另加“能够”。
- source_word: uiam
  choice: 那条路
  rationale: 直译“路、道路”，并以“那条”承接说话者所指、以斯拉渴望看见的途径。
- source_word: cor malignum
  choice: 人心邪恶
  rationale: cor 是“心”，malignum 是“恶的、邪恶的”。汉语补出“人”以明确这里泛指人的内心，而不把短语实体化为“一个邪恶的心”。
theological_decisions:
- issue: quare cor malignum 的句法省略与含义
  choice: 人心为何邪恶
  alternative: 为何有邪恶的心
  rationale: 拉丁文省略系词，既可理解为“心为何是邪恶的”，也可能按存在式补足。结合上下文与自然汉语，采用前者，但不进一步解释恶的来源或性质。
- issue: 条件句是否表达能力
  choice: 你若……说明
  alternative: 你若能说明
  rationale: si 与将来完成时 renunciaueris 构成直接条件，并未明说能力；正文因此避免把“能否”作为命题重点。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你若……，我也会……”清楚呈现条件关系；避免文言化措辞。正文脚注标记与脚注相对应。
