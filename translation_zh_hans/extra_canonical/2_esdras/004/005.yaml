  yaml_path: translation/extra_canonical/2_esdras/004/005.yaml
  text: And I said[a], “Speak, my lord.” And he said to me, “Go, weigh for me the weight of fire, or measure for me the measure of wind, or call back for me the day that has passed.”
translation:
  language: zh_hans
  text: 我说：“请说吧，我主。”他对我说：“去，给我称出火的重量，量出风的量[a]，或把已经过去的那一天给我召回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文这里的措辞不甚顺畅。其大意显然是要求人量出风的多少，这是一项不可能完成的任务；但原文所指的具体量度或单位并不确定。
    reason: textual_variant
lexical_decisions:
- source_word: loquere
  choice: 请说吧
  rationale: 保留命令式“说”的直接含义，同时用“请”和语气词使对尊长的请求在现代汉语中自然得体。
- source_word: dominus meus
  choice: 我主
  rationale: 直译其尊称性质，不擅自将所指明确为上帝或普通先生。
- source_word: pondera mihi ignis pondus
  choice: 给我称出火的重量
  rationale: 保留原文“称量—重量”的同根式强调，以及任务不可能完成的修辞效果。
- source_word: mensura mihi satum uenti
  choice: 量出风的量
  rationale: 拉丁文本此处措辞和具体量度单位不明；译文保留“量度风”的明确大意及原文略显生硬的重复，不武断补入特定单位。
- source_word: reuoca mihi diem quae praeteriit
  choice: 把已经过去的日子给我召回来
  rationale: “召回来”对应 reuoca，保留让过去之日返回这一不可能要求的形象。
theological_decisions:
- issue: dominus meus 所指身份
  choice: 译作“我主”
  alternative: 译作“主啊”或“先生”
  rationale: 上下文中的称呼可表达对超自然使者或尊长的敬称；“我主”既贴近原文，也不把身份或神性预先解释确定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。三个并列命令均保留“不可能完成”的修辞张力；“火的重量—风的量—过去的日子”尽量对应原文结构。脚注标记放在实际涉及文本问题的“风的量”之后。
