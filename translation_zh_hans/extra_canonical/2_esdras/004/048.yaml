  source_fidelity: 整体忠实保留了 demonstrabo、interpretationem similitudinis、steti et uidi、ecce、fornax ardens、transiit coram me，以及 factum est cum 在本节末尾未完成的句法。可是“我站着观看”较偏向持续观看，未明确译出 uidi（“看见”）；末句“事情发生在……的时候——”虽意在保留残句，措辞和标点不够自然，也将拉丁文的逗号式中断改成了破折号。
