  text: I will show you the interpretation of the likeness. And I stood and saw, and behold, a blazing furnace passed before me, and it happened when
translation:
  language: zh_hans
  text: 我要向你说明这比喻的解释。我站着，看见，看哪，一座燃烧的炉子从我面前经过；事情发生在……的时候，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demonstrabo
  choice: 我要向你显明
  rationale: 保留将来时和向受话者揭示之意；“显明”比“展示”更适合解释异象的庄重语境。
- source_word: interpretationem similitudinis
  choice: 这比喻的解释
  rationale: similitudo 可指比喻、类比或异象性的形象；此处译作“比喻”，同时保留其需要解释的象征性质。
- source_word: steti et uidi
  choice: 我站着观看
  rationale: 自然表达“我站立并看见/观看”，不额外加入原文没有的动作。
- source_word: ecce
  choice: 看哪
  rationale: 保留异象叙事中提示读者注意的语气。
- source_word: fornax ardens
  choice: 一座燃烧的火炉
  rationale: fornax 是炉、熔炉；“火炉”通俗而庄重，ardens 直译为“燃烧的”。
- source_word: transiit coram me
  choice: 从我面前经过
  rationale: 准确表达移动经过观看者面前，而不把它弱化为单纯“出现”。
- source_word: factum est cum
  choice: 事情发生在……的时候
  rationale: 原文在 cum 后戛然而止，保留未完句式，不从后文擅自补足内容。
theological_decisions:
- issue: similitudo 的性质
  choice: 比喻
  alternative: 形象／异象
  rationale: 拉丁词本身具有一定语义幅度；“比喻”能自然衔接“解释”，且不预先判定其究竟是纯文学比喻还是异象中的象征形象。
- issue: 残句是否补全
  choice: 保留未完句
  alternative: 依据后续经文补写完整
  rationale: 所给原文止于 cum，故不越过现有文本证据补全，以忠实呈现这一节的文本边界。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文异象体的提示语气。末尾用省略号和破折号标示原文句法未完，并非内容本身的停顿。
