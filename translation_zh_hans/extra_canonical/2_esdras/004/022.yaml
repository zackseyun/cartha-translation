  yaml_path: translation/extra_canonical/2_esdras/004/022.yaml
  text: what is above the height of the heavens.” And I answered and said[a], “I beg you, Lord, why has understanding been given to me?”
translation:
  language: zh_hans
  text: 那在诸天高处之上的事。”我回答说：“主啊，我恳求你，为何给了我悟性呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super altitudinem caelorum
  choice: 高过诸天之上
  rationale: 保留原文的空间意象和比较关系；“诸天”符合庄重的经文语体。
- source_word: deprecor te, domine
  choice: 主啊，我恳求你
  rationale: deprecor 表达恳切请求；采用自然、庄重的现代汉语呼语。
- source_word: sensus intellegendi
  choice: 明悟的能力
  rationale: sensus 与动名词 intellegendi 合起来指理解、领悟的官能或能力，不仅是已经获得的知识。
theological_decisions:
- issue: “为什么赐给我明悟的能力”是询问目的还是质疑恩赐
  choice: 保留“为什么”的开放问法
  alternative: 译作“赐给我明悟的能力有什么用呢”或“为何要使我能够明白”
  rationale: 拉丁文 ut quid 可询问原因或目的；直译为“为什么”可保留其修辞张力，不替作者消解语气。
- issue: domine 所指对象
  choice: 译作“主啊”而不进一步明确身份
  alternative: 译作“我主啊”或直接称“天使啊”
  rationale: 原文只用 domine；保留称谓本身的指向弹性，避免加入原文没有的身份判断。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“那高过诸天之上的事”承接上一节未完的关系结构，因此保留片段式开头和结束引号，以忠实反映本节的源文本分段；不另设英文稿中关于“And I answered and said”的旧译脚注，因为该脚注在中文中没有实质异文信息。
