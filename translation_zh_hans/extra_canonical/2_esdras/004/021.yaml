source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: metipso? Quemadmodum enim terra siluae data est et mare fluctibus suis, sic et qui super terram inhabitant quae sunt super terram intellegere solummodo possunt, et qui super caelos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/021.yaml
  text: For just as the earth has been given to the forest[a], and the sea to its waves, so also those who dwell upon the earth can understand only what is on the earth, and he who is above the heavens, what is above the heavens.”
translation:
  language: zh_hans
  text: 因为正如大地被赐给了树林，海洋被赐给了它的波涛，同样，住在地上的人只能明白地上的事；而那位[a]在诸天之上的，能明白诸天之上的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文 qui 的形式可作单数或复数；其他古代语文见证支持这里作单数，即“那位”。
    reason: 说明拉丁文形式本身存在的语法歧义，以及采用单数译法的文本依据。
lexical_decisions:
- source_word: terra siluae data est
  choice: 大地交给了树林
  rationale: 保留拉丁文“土地被给予树林”的被动含义和比喻结构；“树林”自然表达 silua 的集合意义。
- source_word: mare fluctibus suis
  choice: 海洋交给了自己的波涛
  rationale: 依照前句补出拉丁文省略的“交给了”，并用“自己的”对应 suis，维持两句的平行。
- source_word: quae sunt super terram
  choice: 地上的事
  rationale: 用现代汉语自然表达“在地上的诸事物”，不把范围缩窄为某一类知识。
- source_word: super caelos
  choice: 在诸天之上／诸天之上的事
  rationale: caelos 为复数；译作“诸天”既保留形式，也符合庄重的经文语域。
theological_decisions:
- issue: 第二个 qui 的单复数及所指
  choice: 那位
  alternative: 那些人
  rationale: 拉丁文 qui 单复数形式相同，但与其对应的希腊文传统及叙利亚文、埃塞俄比亚文旁证支持单数，语境也将地上的人类与诸天之上的那一位相对照。译文不直接补称“上帝”，以免把文本的含蓄所指明说出来。
- issue: 末句省略的谓语
  choice: 补出“能明白”
  alternative: 保留省略：“而那位在诸天之上的，诸天之上的事”
  rationale: 拉丁文现存引文在此省略或残缺；依据前句 intellegere...possunt 的平行结构补出谓语，使现代汉语完整可读，同时不增加新的思想内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以“正如……同样……”保留原文论证结构，以分号呈现地上居民与诸天之上那一位之间的对照。
