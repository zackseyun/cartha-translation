lexical_decisions:
- source_word: mare bellum
  choice: 与海交战
  rationale: 所给拉丁文本从上一句延续而来，按校勘后的句法对应“向海发动战争”；译文用现代汉语自然表达其敌对行动。
- source_word: recedat coram nos
  choice: 使它从我们面前退去
  rationale: 保留 recedat 的退却含义和 coram nos 的空间意象；“使”体现目的从句。
- source_word: alias siluas
  choice: 另造一些森林
  rationale: alias 是“别的、另外的”，不是“更多”；结合 faciamus nobis，以“另造一些”表达另辟森林之意。
- source_word: cogitauerunt
  choice: 谋划起来
  rationale: 该词在此指拟定对抗方案；“谋划起来”既自然，也让未完句顺接下一节。
