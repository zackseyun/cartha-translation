  text: and said, ‘Come, let us go up and subdue the forest of the plain, so that there too we may gain for ourselves another region.’ But the plan concerning the forest was in vain, for fire came and consumed it.
translation:
  language: zh_hans
  text: 他们说：“来吧，我们上去征服平原上的森林，好让我们在那里也为自己取得另一片疆域。”可是，关于森林的谋划落了空，因为火来了，把森林烧尽了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ascendentes debellemus
  choice: 我们上去征服
  rationale: 保留“上去”的空间意象，并以“征服”表达 debellare 所含以争战制服之意。
- source_word: silvam campi
  choice: 平原上的森林
  rationale: 按拉丁文属格结构直译为自然的现代汉语，不将 campus 过度具体化。
- source_word: consumemus nobismetipsis aliam regionem
  choice: 为自己取得另一片疆域
  rationale: 此处 consumere 依语境表示取得或占有；nobismetipsis 的强调由“为自己”体现，regionem 译作“疆域”以配合征服土地的语境。
- source_word: cogitatus silvae
  choice: 关于森林的谋划
  rationale: 拉丁文属格关系可有不同理解；“关于”既通顺，也避免擅自判定这是森林所作的谋划或专门针对森林的计划。
- source_word: in vano
  choice: 落了空
  rationale: 用自然汉语表达计划归于徒然、未能实现。
- source_word: consumpsit eam
  choice: 把森林烧尽了
  rationale: 明确阴性代词所指为 silva，并结合 ignis 采用“烧尽”，使动作在汉语中清楚自然。
