  text: 'Dicebas fortassis mihi : in abyssum non descendi, neque in infernum adhuc, neque in caelis unquam ascendi.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/008.yaml
  text: Perhaps you would have said to me[a], ‘I have not descended into the abyss, nor yet into Hades, nor have I ever ascended into heaven.’
translation:
  language: zh_hans
  text: 也许你会对我说：“我没有下到深渊，也还没有下到阴间[a]，更从未升上天。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”：拉丁文 infernum，指死者所在的地下世界；也可译作“冥府”。
    reason: 说明该词的古代宇宙观含义，并避免读者将其误解为专指最终刑罚之地。
lexical_decisions:
- source_word: Dicebas fortassis mihi
  choice: 也许你会对我说
  rationale: fortassis 表示不确定的“也许”；拉丁文未完成过去时 dicebas 在此用于设想对方可能作出的回答，现代汉语以“会……说”自然传达。
- source_word: abyssum
  choice: 深渊
  rationale: 保留“深不可测之处”的空间意象，并与后面的 infernum 区分。
- source_word: infernum
  choice: 阴间
  rationale: 此处指死者所在的地下世界；“阴间”在现代汉语中清楚自然，也避免直接引入希腊神话色彩。
- source_word: caelis
  choice: 天
  rationale: caelis 虽为复数形式，但在此惯常指天上领域；汉语用“天”最自然，不强行体现语法数。
theological_decisions:
- issue: abyssum 与 infernum 是否合并为同一领域
  choice: 分别译作“深渊”和“阴间”
  alternative: 将二者都泛译为“地下深处”
  rationale: 原文并列两个不同名词，应保留其概念张力，不把二者悄然等同。
- issue: infernum 的宗教术语选择
  choice: 阴间
  alternative: 冥府／哈得斯
  rationale: “阴间”能表达古代犹太语境中的死者领域，又不预设它必然等同于最终刑罚之地。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；三个否定分句以“也还……更从未……”递进，保留原文的并列节奏与强调。
