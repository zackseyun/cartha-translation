theological_decisions:
- issue: 恶的“收割”所指为何
  choice: 保留农业意象，不解释为审判或毁灭
  alternative: 译作“毁灭它的时候还没有到”
  rationale: 拉丁文本及紧邻措辞支持“收割”，而具体神学所指在本节尚有张力，不宜在正文中替作者定论。
