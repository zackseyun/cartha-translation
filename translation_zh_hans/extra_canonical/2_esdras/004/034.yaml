  text: 'respondit ad me et dixit: non festinas tu super altissimum, tu enim festinas propter temetipsum, nam excelsus pro multis. Nonne de his interrogauerunt animae iustorum in promptuariis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/034.yaml
  text: And he answered me and said[a], “You do not hasten more than the Most High, for you hasten for your own sake, but the Most High for many. Have not the souls of the righteous in their chambers asked about these things?”
translation:
  language: zh_hans
  text: 他回答我说[a]：“你并不比至高者更急切，因为你之所以急切，是为了自己；至高者之所以急切，却是为了众人。在储藏之所的义人灵魂，难道不曾为这些事发问吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他回答我说：‘难道你比至高者更急切吗？因为你急切，是为你自己……’”
    reason: 保留将 non festinas tu super altissimum 理解为反问句的传统译法；正文则依拉丁文表面句法，并参照后文以 nonne 明确标记反问的用法，采用陈述句。
lexical_decisions:
- source_word: festinas
  choice: 急切
  rationale: 表达因盼望事情早日实现而迫切的语气，同时避免把两处主动表达改成纯粹的名词结构。
- source_word: Altissimum / excelsus
  choice: 至高者
  rationale: 两词在本节均指上帝；中文统一称为“至高者”，既自然，也保留尊称。
- source_word: pro multis
  choice: 为众人
  rationale: 直译拉丁文，保留其与“为你自己”的鲜明对照，不擅自补明至高者所急切推动的具体事项。
- source_word: animae iustorum
  choice: 义人的灵魂
  rationale: 按原文保留“灵魂”及其复数群体意义，不改写为泛称“义人”。
- source_word: in promptuariis
  choice: 在储藏之所
  rationale: promptuarium 基本义为储藏处；此处似指义人灵魂被安置、保守的处所，正文保留原有意象，不直接解释为特定宇宙论地点。
- source_word: de his interrogauerunt
  choice: 曾为这些事发问
  rationale: de his 指前文所论之事；译作“为这些事发问”兼顾简洁和原文指涉的开放性。
theological_decisions:
- issue: non festinas tu super altissimum 的句式
  choice: 你并不比至高者更急切
  alternative: 难道你比至高者更急切吗
  rationale: non 在此按陈述否定处理；同节后句明确用 nonne 引出反问，支持首句不是问句。脚注保留传统反问理解。
- issue: 省略谓语的 nam excelsus pro multis
  choice: 至高者却是为众人
  alternative: 至高者却为众人急切
  rationale: 中文补出判断结构，使其与“你急切，是为你自己”平行，同时避免过度断言“急切”是否须完整补入；上下文仍清楚暗示这一省略。
- issue: 义人灵魂所在之处的性质
  choice: 储藏之所
  alternative: 密室／居所
  rationale: 不把 promptuariis 教义化为天堂、阴间或某一特定中间状态；保留其储存、保守的空间意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“急切”贯穿前后对照；“储藏之所”略带古朴色彩，以保存原文特殊意象。脚注标记[a]已置于正文相应位置。
