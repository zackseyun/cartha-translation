revisions:
- from: 他回答我说[a]：“你并不比至高者更急切；因为你急切，是为你自己，至高者却是为众人。义人的灵魂在储藏之所，不也曾为这些事发问吗？”
  to: 他回答我说[a]：“你并不比至高者更急切，因为你之所以急切，是为了自己；至高者之所以急切，却是为了众人。在储藏之所的义人灵魂，难道不曾为这些事发问吗？”
  rationale: 修订仅补足拉丁文省略而中文不可省略的谓语“急切”，并调整末句语序。这样既维持“为自己／为了众人”的开放对照，也使汉语表达完整自然；未改变对 promptuariis 的谨慎、非教义化处理。
