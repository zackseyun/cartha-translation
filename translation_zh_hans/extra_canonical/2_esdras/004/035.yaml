- from: 义人的灵魂不是也曾在他们的居所[a]问起这些事，说：‘我还要这样盼望多久？我们所得报偿的禾场何时才会结出果实？’耶利米勒回答他们说：[b]
  to: 义人的灵魂岂不是也曾在各自的居所中问起这些事，说：“我还要这样盼望多久？我们报偿的禾场所出的果实何时才会来到？”耶利米勒回答他们：[b]
  rationale: 仅作必要修订：恢复 *fructus venit* 中“果实来到”的句法和意象，并将处所表达调整得更自然。保留现存拉丁文在“我／我们”之间的数不一致，且保留相应脚注说明。
