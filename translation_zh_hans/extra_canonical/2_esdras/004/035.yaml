  text: Did not the souls of the righteous ask about these things in their chambers[a], saying, ‘How long shall I hope thus? And when will the fruit of the threshing floor of our reward come?’ And Jeremiel answered them[b],
translation:
  language: zh_hans
  text: 义人的灵魂岂不是也曾在各自的居所中问起这些事，说：“我还要这样盼望多久？我们报偿的禾场所出的果实何时才会来到？”耶利米勒回答他们：[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “我还要这样盼望多久”按现存拉丁文的单数动词翻译；但说话者是复数，下句又说“我们的报偿”。叙利亚文和埃塞俄比亚文支持译作“我们还要这样盼望多久”。
    reason: textual_variant
lexical_decisions:
- source_word: suis
  choice: 他们的居所
  rationale: 所给拉丁文本在此仅作所有格代词使用，所修饰的名词须由上文补足；译作“居所”既保留省略，也避免把并未明见于本节的具体名词过度确定为“仓房”或“内室”。
- source_word: usquequo spero sic?
  choice: 我还要这样盼望多久？
  rationale: 按现存拉丁文 spero 的第一人称单数直译，保留其与复数说话者之间的语法张力，不擅自改作复数。
- source_word: fructus areae mercedis nostrae
  choice: 我们所得报偿的禾场……结出果实
  rationale: 保留 fructus（果实）、area（打谷场/禾场）和 merces（报偿）的复合意象；“禾场”较自然，也能涵盖打谷场的农耕图景。
- source_word: Hieremiel
  choice: 耶利米勒
  rationale: 按拉丁名字音译，并与常见的“耶利米”区分。
theological_decisions:
- issue: 义人灵魂所在之处的性质
  choice: 居所
  alternative: 仓房／内室
  rationale: 拉丁文本只保存 suis，具体处所名词依赖上文或其他见证；正文采用中性表达，脚注说明传统补法及其与后文意象的联系。
- issue: 引语中单复数不一致
  choice: 保留“我……我们”
  alternative: 统一译为“我们……我们”
  rationale: spero 是单数，而 nostrae 是复数；保留现存文本的张力，并在脚注交代其他古译本所支持的复数读法。
translation_notes:
  register: 采用庄重而自然的现代书面汉语。保留农耕意象及拉丁见证中“我／我们”的数不一致；人名用清晰音译。所有脚注标记均已置于正文。
