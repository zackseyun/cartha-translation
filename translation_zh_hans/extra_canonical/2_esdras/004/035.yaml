review_pass:
  verdict: revise
  source_fidelity: 译文整体保留了义人的灵魂、其所处之地、盼望、报偿与禾场的复合意象，以及耶利米勒的回应。可是 *quando venit fructus* 的主语是“果实”，动词是“来到／临到”，而非“禾场结出果实”；现译改变了句法关系并轻微改写了意象。
  naturalness: “在他们的居所”可理解，但“在各自的居所中”更符合现代汉语，也较清楚地表达 *suis* 与复数“灵魂”的关系。将“果实何时才会来到”译出后，句子自然且保留原文的盼望语气。
  terminology: “义人”“灵魂”“报偿”“禾场”均合适；“耶利米勒”可保留，以区别于耶利米。脚注对现存拉丁文单数 *spero* 与其他见证所支持的复数读法交代适当。
  issues:
  - severity: medium
    issue: “禾场何时才会结出果实”将 *quando venit fructus* 译为禾场“结出”果实。
    rationale: 拉丁文 *fructus* 是 *venit* 的主语，意思是“果实何时来到／临到”；*areae mercedis nostrae* 是限定“果实”的属格结构。应避免把“来到”的动作改成“禾场结实”。
  - severity: low
    issue: “他们的居所”略显指代生硬。
    rationale: 用“各自的居所中”可在不把未明示的处所具体化为仓房或内室的前提下，更自然地表达 *suis*。
