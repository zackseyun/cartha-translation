  text: 得着怜悯。可是，他要为自己的名做什么呢——那名……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misericordiam consequi
  choice: 得着怜悯
  rationale: consequi 表示“获得、得着”，misericordiam 表示“怜悯”；保留本节开头承接上文的不完整句式。
- source_word: quid faciet nomini suo
  choice: 他要怎样对待自己的名
  rationale: 拉丁语直译近于“他要为／对自己的名做什么”；汉语用“怎样对待”自然表达 faciet 与与格 nomini 的关系，同时不预先判定具体行动。
- source_word: quod
  choice: 就是那……
  rationale: quod 是引出修饰“名”的关系代词，但本节在此中断；用省略号明确保留原文跨节未完的结构，不把下一节文字移入本节。
theological_decisions:
- issue: “他的名”与下一节的关系
  choice: 保留关系从句尚未完成的悬置结构
  alternative: 补译为“那称在我们身上的名”，并加入“我所问的就是这些事”
  rationale: 所给拉丁文本止于 quod；补足后续内容会把第26节的文字移入第25节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留开头承上和结尾启下的残句形态；省略号仅用来提示本节在关系代词处中断。
