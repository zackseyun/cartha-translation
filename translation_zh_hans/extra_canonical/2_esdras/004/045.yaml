  text: possibile est, et si idoneus sum, Demonstra mihi et hoc, si plus quam praeteriit habet uenire, aut plura pertransierunt super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/045.yaml
  text: 'If it is possible[a], and if I am fit, show me this also: whether more is to come than has passed, or whether more has passed over.'
translation:
  language: zh_hans
  text: “若可能，而且我也配得知道，就请也把这件事指示给我：将要来到的是否比已经过去的更多，还是有更多已经从我们身上过去。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在拉丁文本的分节处跨节延续：本节末为“从……之上过去”，其宾语“我们”位于下一节开头；这里按连续句译出。
    reason: 说明“我们”来自跨节句法，并解释为何中文在本节补足原文因分节而悬置的介词宾语。
lexical_decisions:
- source_word: possibile est
  choice: 若这是可能的
  rationale: 保留拉丁文表示可能性的条件语气，不把它改写成请求许可。
- source_word: si idoneus sum
  choice: 如果我也配得知道
  rationale: idoneus 表示合宜、够资格；补出“知道”使现代汉语自然，同时与求指示的语境相合。
- source_word: Demonstra mihi et hoc
  choice: 就请再把这件事指示给我
  rationale: 准确表达 demonstra 的“显明、指示”和 et hoc 的“这件事也”。
- source_word: si plus quam praeteriit habet uenire
  choice: 将要来的是否比已经过去的更多
  rationale: 保留原文对未来与过去之量的比较；habet venire 在此表达尚待来到。
- source_word: aut plura pertransierunt super
  choice: 还是已经有更多从我们身上流逝而过
  rationale: pertransierunt super 直指从某人身上经过；按跨节连续句，以次节开头的 nos 补足 super 的宾语，并用“流逝”传达时间经过的语境。
theological_decisions:
- issue: “配得”的具体所指
  choice: 译作“配得知道”
  alternative: 仅译作“我是合宜的”或“我有资格”
  rationale: 原文没有说明这种合宜性源自身份、德行或启示资格，因此不作教义化解释；“知道”只是依语境补足汉语表达。
- issue: 过去与未来的比较是否应补成完全对称句
  choice: 保留第二分句“从我们身上流逝而过”的原有意象
  alternative: 译成“还是过去的比将要来的更多”
  rationale: 后者虽更对称，却会抹去 pertransierunt super nos 的实际措辞及其时间从人身上经过的意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“配得知道”避免生硬直译 idoneus；“从我们身上流逝而过”保留原文带有闪语色彩的时间经过意象。
