  yaml_path: translation/extra_canonical/2_esdras/004/042.yaml
  text: They are likened to the womb of souls. For just as she who gives birth hastens to escape the necessity of childbirth[a], so also these
translation:
  language: zh_hans
  text: 它们被比作灵魂的母胎。正如正在生产的妇人急于摆脱分娩之苦[a]，这些也同样如此……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摆脱分娩时不得不经历的困迫”。
    reason: 说明 necessitatem partus 的较字面含义，同时保留它在语境中可表示痛苦、困迫的语义张力。
lexical_decisions:
- source_word: animarum matrici
  choice: 灵魂的母胎
  rationale: matrici 指孕育生命的子宫或母胎；“母胎”既保留生育意象，也比单说“子宫”更符合庄重的经文语体。animarum 译作“灵魂的”，不额外限定为死者或义人的灵魂。
- source_word: festinabit quae parit
  choice: 正在生产的妇人急于
  rationale: 按拉丁语关系结构直译其主体与动作，同时用现代汉语自然表达分娩过程中的迫切感。
- source_word: necessitatem partus
  choice: 分娩之苦
  rationale: necessitas 在此生育比喻中指分娩时无法回避的困迫、痛苦，而非抽象的逻辑“必要性”；正文采用符合语境的表达，并以脚注保留较字面的可能性。
- source_word: sic et haec
  choice: 这些也同样如此
  rationale: 保留 haec 的中性复数指代及未完句式，不擅自从后续经文补入本段拉丁文没有的内容。
theological_decisions:
- issue: “灵魂的母胎”所指为何
  choice: 保持比喻和指代开放
  alternative: 明确解释为阴间、受造界或灵魂的居所
  rationale: 本节片段本身没有说明“它们”或“母胎”的具体所指；为避免导入特定末世论解释，译文不作补释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“母胎”维持原文的生育意象；末尾以省略号标明所给拉丁文止于未完的比较句，未补入源文之外的后文。
