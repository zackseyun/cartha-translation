  text: would you begin to justify[a], or whom condemn?” And I answered and
translation:
  language: zh_hans
  text: 你会开始判谁为义[a]，又定谁的罪呢？”我回答，又……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你会开始判哪一个为义，又定哪一个的罪呢？”
    reason: quem 可因前文所指为拟人化的海与树林而译作“谁”，也可侧重其事物本体译作“哪一个”。
lexical_decisions:
- source_word: incipiebas iustificare
  choice: 你会开始判谁为义
  rationale: 保留 incipiebas 的起始意味，并把 iustificare 按审判语境译为“判……为义”；拉丁文在首个动词后省略了宾语，中文依平行结构补出“谁”。
- source_word: quem condemnare
  choice: 又定谁的罪
  rationale: quem 指被审判的拟人化对象，译为“谁”；condemnare 在司法语境中自然译作“定……的罪”。
- source_word: Et respondi et
  choice: 我回答，又……
  rationale: 源文止于第二个 et，句子残缺；以省略号明确保留断裂，不擅自补入后文。
theological_decisions:
- issue: iustificare 的司法与神学含义
  choice: 判……为义
  alternative: 称……为义／为……辩护
  rationale: 上下文与 condemnare 构成裁判性的反义平行；“判……为义”既保留司法意味，也不额外引入特定宗派的称义体系。
- issue: quem 所指对象的人称表达
  choice: 谁
  alternative: 哪个／哪一个
  rationale: 前文的海与树林被人格化并作出谋划、争战等行动，因此用“谁”可保留这种拟人效果；脚注同时交代也可按事物译为“哪一个”。
translation_notes:
  register: 采用现代、庄重而易懂的司法用语。“我回答，又……”刻意保留现存拉丁文本在 et 处中断的状态。
