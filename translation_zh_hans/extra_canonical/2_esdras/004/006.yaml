  yaml_path: translation/extra_canonical/2_esdras/004/006.yaml
  text: And I answered and said, “Who among those born can do this, that you ask me about these things?”
translation:
  language: zh_hans
  text: 我回答说：“生而为人的，有谁能做到这事，以致你问我这些事呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: natorum
  choice: 生在世上的人
  rationale: 原意为“出生者中的人”；此译自然表达“凡生而为人者”的范围，同时避免仅译作“人”而失去出生这一语义。
- source_word: poterit hoc facere
  choice: 能做到这事
  rationale: 贴近拉丁文“能够做这事”，并承接上文所指的任务。
- source_word: ut me interroges de his
  choice: 竟使你问我这些事
  rationale: 保留结果或情势色彩以及反问语气；“这些事”直接对应 de his，不扩译为“这样的事”。
theological_decisions:
- issue: 反问所表达的人类能力限度
  choice: 保留“有谁能……”的开放式反问
  alternative: 译为“没有人能……”的明确断言
  rationale: 原文以疑问表达，虽明显暗示无人能做到，却没有直接作绝对陈述；保留形式可维护原文的修辞张力。
- issue: ut 从句与前句的逻辑关系
  choice: 译作“竟使你问我……”
  alternative: 译作“以致你问我……”或“所以你问我……”
  rationale: 拉丁文 ut 在此关系略有弹性；“竟使”既呈现前项能力与后项询问之间的结果意味，也符合说话者惊讶而自谦的语气，不把它硬定为目的关系。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“我回答说”保留经文式叙事公式，但不机械重复为“我回答并说”。全句保持反问力度，并尽量贴近拉丁文本的指示词和逻辑结构。
