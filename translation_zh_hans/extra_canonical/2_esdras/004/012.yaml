lexical_decisions:
- source_word: quam
  choice: 倒不如
  rationale: 该词承接上文的比较结构；因所给拉丁文本从比较项中间起首，中文保留其承接和残缺感。
- source_word: aduenientes
  choice: 来到世上
  rationale: 字面为“来到”；结合 vivere（生活）所指的生存语境，补出“世上”使现代中文自然，但不扩展为特定的出生观念。
- source_word: uiuere in impietatibus
  choice: 活在不敬虔中
  rationale: impietatibus 为复数，概括多种不敬虔的行为或处境；中文以集合性表达传达其含义。
- source_word: pati
  choice: 受苦
  rationale: 不及物用法在此指遭受痛苦，译为简洁自然的“受苦”。
- source_word: non intelligere de qua re
  choice: 不明白缘由
  rationale: de qua re 字面近于“是因什么事”，此处自然表达为“不明白缘由”，并保留原因未明的意味。
- source_word: proficiscens
  choice: 动身——
  rationale: 现在分词意为“动身、出发”；它与下一节相连，本节独立呈现时刻意保留未完句，并以破折号提示跨节延续。
theological_decisions:
- issue: impietatibus 的道德与宗教含义
  choice: 不敬虔
  alternative: 邪恶／不法
  rationale: “不敬虔”同时保留对上帝缺乏敬畏及由此表现出的生活状态，不把词义缩窄为一般道德恶行。
- issue: 本节开头残缺的比较结构
  choice: 保留“倒不如”的承接感并加脚注
  alternative: 从前文补足完整主句
  rationale: 所给拉丁文本仅保存 quam 起始的比较项；不擅自补入本节来源之外的文字，同时让中文读者知道句法依赖上文。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。保留原文开头承接上文、结尾跨入下一节的片段性；引号承接前文说话内容，末尾以破折号表示 proficiscens 尚未形成完整陈述。
