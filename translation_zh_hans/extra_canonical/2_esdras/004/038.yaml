- issue: 对 dominator domine 的称谓处理
  choice: 掌权的主啊
  alternative: 主宰之主啊／统治者主啊
  rationale: “掌权的主”准确传达统治权，又避免不自然的名词堆叠或额外强化神学含义。
- issue: 残句的处理
  choice: 以省略号明确句子未完
