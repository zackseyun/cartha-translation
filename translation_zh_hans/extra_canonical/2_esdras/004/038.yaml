lexical_decisions:
- source_word: Et respondi et dixi
  choice: 我回答说
  rationale: 这是拉丁语叙事公式的自然现代汉语表达；不机械重复“回答并说”，同时保留回应性。
- source_word: O dominator domine
  choice: 掌权的主啊
  rationale: 保留 dominator 所强调的统治、掌权之意及 domine 的呼告语气，措辞庄重而自然。
- source_word: sed et
  choice: 可是也
  rationale: 保留转折连词 sed 与附加副词 et 的组合，不根据后文猜补其具体关系。
