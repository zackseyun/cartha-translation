  text: 那么，若你是这些事的审判者，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Si enim
  choice: 那么，如果
  rationale: 这里承接上文并引出条件句；“那么，如果”在现代汉语中自然地保留了推论与假设的关系。
- source_word: eras
  choice: 你是
  rationale: 拉丁语为未完成过去时，但在这一假设结构中表达非现实或设想条件；汉语以“如果你是”自然呈现，无需机械标出过去时。
- source_word: iudex
  choice: 审判者
  rationale: 保留司法判断的核心含义，也符合本段庄重的论辩语体。
- source_word: horum
  choice: 这些事的
  rationale: 中性复数属格在当前残句中所指并不完全明确；译作“这些事”保留宽泛指涉，不擅自限定为某些人或受造物。
theological_decisions:
- issue: horum所指对象不明确
  choice: 这些事
  alternative: 这些人的／这一切的
  rationale: 源文片段没有足够信息确定其指人还是指事；采用中性的“这些事”较自然，也避免加入特定神学解释。
translation_notes:
  register: 采用简洁、庄重而现代的论辩语气。原文在“quem”处继续进入下一分句，本节所给英文咨询文本止于条件句，因此中文以逗号结尾，保留未完句法。
