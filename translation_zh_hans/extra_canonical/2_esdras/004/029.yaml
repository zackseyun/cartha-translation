id: 2ES.4.29
reference: 2 Esdras 4:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod seminatum est, et discesserit locus ubi seminatum est malum, non ueniet ager ubi seminatum est bonum. Quoniam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/029.yaml
  text: For if what has been sown is not reaped[a], and the place where the evil has been sown does not pass away, the field where the good has been sown will not come.
translation:
  language: zh_hans
  text: 因为，如果所播下的还没有收割[a]，恶所播下之处也尚未消逝，善所播下的田地就不会来到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文本在“所播下的”之后似有缺文；“还没有收割”是依上下文补足。句首也可译作“所以”。
    reason: 所给拉丁文本在 *quod seminatum est* 后缺少直接对应“收割”的动词；脚注说明补足的依据，并保留连接词可作“所以”理解的可能。
lexical_decisions:
- source_word: seminatum est
  choice: 撒下
  rationale: 原文三次重复同一完成时被动结构；中文统一译作“撒下”，保留播种意象和三处平行关系，同时避免生硬地逐次补出“已经被”。
- source_word: locus
  choice: 地方
  rationale: 与后面的 ager“田地”区别开来，保留原文由一般的“地方”转向耕作性的“田地”的措辞变化。
- source_word: malum / bonum
  choice: 恶／善
  rationale: 采用宽泛而庄重的对应词，不把原文抽象且具有神学张力的“恶、善”擅自具体化。
- source_word: discesserit
  choice: 消逝
  rationale: 表达该处境或领域离去、不复存在的末世性含义；比单纯“离开”更适合无生命主语“地方”。
- source_word: veniet
  choice: 到来
  rationale: 保留原文“来”的动态和末世性表达，不改释为“出现”或“产生”。
theological_decisions:
- issue: 恶之地与善之田的时间关系
  choice: 保留“若……不……，就不会……”的条件关系
  alternative: 解释为恶彻底除去之后善的时代才必然显现
  rationale: 原文以条件式和未来式构成张力，只说明二者到来的次序关联，不进一步界定其机制或教义含义。
- issue: 三次 seminatum est 的完成体
  choice: 三处均统一译为“撒下”
  alternative: 分别译作“已经撒下／曾撒下／将撒下”
  rationale: 统一措辞忠实呈现原文刻意的重复，也不额外规定善与恶各自播种的精确时间。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“撒下恶的地方／撒下善的田地”维持原文紧密平行；句首“因为”承接前文论证，并保留原文末尾 Quoniam 很可能引向下一节的文本边界问题，不在本节擅自展开。
