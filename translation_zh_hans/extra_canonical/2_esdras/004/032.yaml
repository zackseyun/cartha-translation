  yaml_path: translation/extra_canonical/2_esdras/004/032.yaml
  text: When ears of grain without number are sown[a], how great a threshing floor they will begin to make! And he answered and said to me, “Until—
translation:
  language: zh_hans
  text: 数不清的麦穗若都播种下去[a]，将会开始形成何等大的禾场啊！他回答了，我便说：“直到——”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若那些多得无法计数的麦穗都播种下去。”
    reason: 保留关系从句 quarum non est numerus 的较形式对应译法。
  - marker: b
    text: 现有拉丁文本直译为“他回答了，我便说”；此处人称转换突兀。英语 POB 作“他回答并对我说”。本句在“直到”之后中断，续文见下一节。
    reason: 提示原文 respondit 与 dixi 的人称不一致，以及残片在 usque- 处断开，避免读者误以为译文遗漏。
lexical_decisions:
- source_word: seminatae fuerint
  choice: 若都播种下去
  rationale: 保留完成时虚拟式在此所表达的假设、将来情境，也不把原文略显反常的“麦穗被播种”改成“被收割”。
- source_word: spicae quarum non est numerus
  choice: 数不清的麦穗
  rationale: 以自然简洁的现代汉语表达“其数目不存在（即无法计数）的麦穗”。
- source_word: area
  choice: 禾场
  rationale: 指打谷、扬谷所用的场地；“禾场”较“打谷场”凝练庄重，并适合经文语体。
- source_word: incipient facere
  choice: 将会开始形成
  rationale: 明确保留 incipient“将开始”，并将 facere 按语境译作“形成”，避免汉语中“制造禾场”的误解。
- source_word: Et respondit et dixi
  choice: 他回答了，我便说
  rationale: 严格反映所给拉丁文本中第三人称 respondit 与第一人称 dixi 的转换，不依英语咨询层将其无声校正为“他回答并对我说”。
theological_decisions:
- issue: 无数麦穗与巨大禾场的比喻是否应解释为末世审判或恶果累积
  choice: 保留农业比喻，不在正文中明定所指
  alternative: 直接解释为罪恶累积或末世收割
  rationale: 本节自身仍以问句和比喻推进论证；提前释义会消除上下文保留的张力。
- issue: 末句说话者身份
  choice: 按现有拉丁文本保留“他回答了，我便说”的人称转换，并用脚注说明文本问题
  alternative: 依英语 POB 译为“他回答，对我说”或据常见校勘改为“我回答说”
  rationale: 所给原文明确为 respondit（他回答）与 dixi（我说）；在没有另一拉丁见证明列于任务中的情况下，不宜在正文中暗自改读。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“数不清”“若都播种下去”自然明白；“禾场”保留古代农业背景。末句以破折号和脚注呈现来源在 usque- 处的断裂，不擅自补足下一节内容。
