source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Non enim uolui interrogare de superioribus uiis, sed de his quae pertranseunt per nos cotidie: propter quod, Israel datus est in obprobrium gentibus, quem dilexisti populum datus est tribubus impiis, et lex patrum nostrorum in inritum deducta'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/023.yaml
  text: 'For I did not want to ask about the ways above[a], but about the things that happen among us daily: why Israel has been given over as a reproach to the nations, why the people whom you loved has been given over to ungodly tribes, and why the law of our fathers has been brought to nothing.'
translation:
  language: zh_hans
  text: 因为我并不想询问上面的道路，而是想问每天发生在我们中间的事[a]：为什么以色列被交出去，成为列国的羞辱；为什么你所爱的百姓被交给不敬虔的部族；为什么我们祖先的律法被废为无效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较贴近字面可译作“每天经过我们的事”。
    reason: 原文 pertranseunt per nos 带有“经过我们”的字面形象；在此上下文中很可能指群体每天亲身遭遇或发生在他们中间的事。
lexical_decisions:
- source_word: superioribus uiis
  choice: 高天之上的道路
  rationale: 保留“在上面的道路”这一空间性表达，同时用现代汉语自然地传达与人间日常遭遇相对的天上或高远之事，不把它具体解释为某种神学体系。
- source_word: quae pertranseunt per nos cotidie
  choice: 每天发生在我们中间的事
  rationale: 按闪语式表达在上下文中的实际意义译为群体每天经历的事件，避免直译成“从我们身上经过”而造成物理移动的误解；脚注保留较贴近字面的另一种理解。
- source_word: in obprobrium gentibus
  choice: 受列国羞辱
  rationale: obprobrium 表示羞耻、辱骂或受辱的处境；此译法自然表达以色列被交付后成为列国羞辱对象的意思。
- source_word: tribubus impiis
  choice: 不敬虔的各族
  rationale: impiis 在此具有宗教与道德双重色彩，“不敬虔”比单纯“不法”或“邪恶”更贴近原词，又不额外指定民族身份。
- source_word: in inritum deducta
  choice: 归于无效
  rationale: 表达律法被置于不起作用、仿佛落空的状态，保留原文强烈控诉，同时不武断解释为律法在神学意义上已正式废除。
theological_decisions:
- issue: “高天之上的道路”所指为何
  choice: 保留为开放性的“高天之上的道路”
  alternative: 明确译作“上帝的道路”或“天上的奥秘”
  rationale: 原文只说 superioribus uiis，并未明说是上帝的道路或天上奥秘；保留意象可避免过度释义。
- issue: 祖先的律法“归于无效”的含义
  choice: 按哀诉者眼中的现实处境直译为“归于无效”
  alternative: 译为“被废除”或“无人遵守”
  rationale: 原文没有说明是正式废除、实践失效还是被人蔑视；当前措辞保留这种神学张力和语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。三个“为什么”构成平行哀诉；用分号保持经文节奏。避免古奥措辞，也不将原文未明说的因果或神学解释加入正文。
