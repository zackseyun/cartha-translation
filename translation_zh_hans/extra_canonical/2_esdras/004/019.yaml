  text: I said, “Both have devised a vain plan, for the earth has been given to the forest, and the place of the sea to bear its waves.” And he answered
translation:
  language: zh_hans
  text: 我说：“两者都作了徒然的盘算，因为土地已赐给树林，海的地方则是为承载它自己的波浪而赐予的。”他便回答说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: utrique
  choice: 双方
  rationale: 指前文所设想的森林与海两方；用“双方”简洁保留二者相对的结构。
- source_word: uanam cogitationem cogitauerunt
  choice: 所想的都是虚妄
  rationale: 保留同源词“思想／想”的意味，同时以自然现代汉语表达其设想徒然、不切实际；不额外解释为道德上的邪恶。
- source_word: terra enim data est siluae
  choice: 因为大地赐给了森林
  rationale: 贴近拉丁文被动结构及 data est 的完成意味，不擅自补明赐予者。
- source_word: maris locus
  choice: 海的所在
  rationale: 较直译地保留 locus 的空间含义，并避免把它过度具体化为海床或疆域。
- source_word: portare fluctus suos
  choice: 要承载自己的波浪
  rationale: 以“承载”对应 portare，以“自己的”保留反身物主 suos 所指向的海。
- source_word: Et respondit
  choice: 于是他回答说：
  rationale: 本节在未给出回答内容处结束；用冒号自然引向下节，同时保留叙事衔接。
