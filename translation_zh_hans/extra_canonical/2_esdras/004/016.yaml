  text: 海浪的谋算也是如此：因为沙地坚立不动，把它们拦住了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在此处残缺，且句法跨越节界；“沙地”及“把它们拦住了”是根据相邻语境和英文审校轨迹所作的补足。保存下来的“坚立”支持沙稳固不移的图像，但残缺处的具体措辞不能确定。
    reason: 明确区分保存的拉丁词句与为使句意完整而作的语境性重构，并避免把“sumpsit eam”误作“拦住了它们”的直接词汇依据。
lexical_decisions:
- source_word: cogitatus
  choice: 谋算
  rationale: 该词表示心中的意图或筹划；“谋算”既保留拟人化色彩，也比“思想”更符合海浪企图推进却受阻的语境。
- source_word: fluctuum maris
  choice: 海浪的
  rationale: 按拉丁文属格结构直译，作为“谋算”的所属者，保留原文对海浪的拟人化表达。
- source_word: stetit
  choice: 屹立不动
  rationale: 兼顾“站立、立定”的基本意义和阻挡海浪时稳固不移的语境。
- source_word: sumpsit eam
  choice: 挡住了它们
  rationale: 结合英译审校层及上下文表达阻遏作用；中文以复数“它们”回指海浪，使指代自然。
