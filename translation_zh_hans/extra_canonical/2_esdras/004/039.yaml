    rationale: ne forte 与 prohibeatur（虚拟式）表达的是“恐怕／或许会”的担忧或可能性；“或许……会因……而受阻”较贴近这一语气，也更自然。
  revised_text: 我们都充满了不敬虔。或许，义人的禾场会因我们、因居住者的罪而受阻[a]。
