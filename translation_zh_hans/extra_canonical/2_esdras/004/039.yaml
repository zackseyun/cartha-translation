  text: We are all full of impiety. And perhaps because of us the threshing floor of the righteous is kept back[a], because of the sins of those who dwell there.
translation:
  language: zh_hans
  text: 我们都充满了不敬虔。或许，义人的禾场会因我们、因居住者的罪而受阻[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被耽延”。
    reason: prohibeatur 的基本义为“被阻止、妨碍、扣住”；在此处也可能侧重结果上的延迟。
lexical_decisions:
- source_word: impietatem
  choice: 不敬虔
  rationale: 表达对上帝的不敬与悖逆，较“邪恶”更贴近拉丁文的宗教伦理含义。
- source_word: area
  choice: 禾场
  rationale: 保留原文的农耕意象；此词指打谷、扬谷的场地，并在本节中具有比喻意味。
- source_word: prohibeatur
  choice: 受到阻碍
  rationale: 拉丁文表示被阻止、妨碍或扣住；“受到阻碍”保留其广义，不把含义收窄为单纯的时间延迟。
- source_word: inhabitantium
  choice: 住在那里之人
  rationale: 按作名词用的现在分词译为居住者；“那里”顺应上下文所指，却不擅自补出“地上”等原文没有的地点。
theological_decisions:
- issue: “义人的禾场”受到阻碍的具体所指
  choice: 保留禾场比喻，不解释为义人的赏赐、末世收成或特定群体
  alternative: 直接意译为“义人的赏赐被延迟”
  rationale: 原文只给出农业意象及受阻状态；直解其神学所指会消除文本本有的开放性。
- issue: ne forte 的语气
  choice: 译为“或许”
  alternative: 译为“免得”或“恐怕”
  rationale: 结合句法及传本所呈现的推测语气，采用“或许”较自然；同时不把说话者的推测强化为确定因果。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不敬虔”“禾场”保留经文的宗教与农耕语域；以“受到阻碍”避免过度解释比喻。
