  to: 我们都充满了不敬虔。或许，义人的禾场会因我们、因居住者的罪而受阻[a]。
  rationale: 修订删除原文未明示的“那里”，并调整语序和情态表达，以保留 ne forte 加虚拟式的推测性，同时维持“禾场”这一未加解释的农业比喻及“受阻”的宽泛含义。
