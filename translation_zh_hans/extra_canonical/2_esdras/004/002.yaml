  text: and said to me[a], “Your heart has gone far beyond in this age, and do you think to comprehend the way of the Most High?”
translation:
  language: zh_hans
  text: 他对我说：“你的心思在今世已经走得太远了，难道还想领会至高者的道路吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excedens excessit cor tuum
  choice: 你的心……已经完全迷乱了
  rationale: “excedens excessit”以同根词叠用加强语气；此处“心”指人的心思、理解力。结合上下文由今世之事推论至至高者之道，译作“完全迷乱”比字面“远远越过”更能表达认知受困、无力理解之意。
- source_word: in saeculo hoc
  choice: 在今世
  rationale: saeculum在此指当前的世代或时代；“今世”简洁保留其末世论语境，也不把含义缩窄为“这个世界”。
- source_word: comprehendere cogitas
  choice: 还想领会……吗
  rationale: cogitas表示意图或以为能够，comprehendere指把握、理解；反问语气用“还想……吗”自然传达。
- source_word: uiam altissimi
  choice: 至高者的道路
  rationale: 保留“道路”的比喻及“至高者”这一神圣称谓，不具体化为计划、作为或旨意。
theological_decisions:
- issue: “心越出”的语义
  choice: 理解为心思完全迷乱、认知失措
  alternative: 你的心在今世已经远远越出了界限
  rationale: 拉丁文保留了强烈的同根叠用，字面可指“越出”；但闪语式“心越出”可表达心智惊乱或失措，而后半句明确谈及能否领会，语境支持认知层面的含义。避免译成“越界”，以免把话语变成对僭越行为的神学谴责。
- issue: 反问所表达的能力限制
  choice: 保留反问，不补出“不能”
  alternative: 所以你不能领会至高者的道路
  rationale: 原文以疑问保持修辞张力；直陈结论会消除原有形式，并加重文本没有明说的断言。
translation_notes:
  register: 采用庄重而自然的现代普通话。“心”保留古代人论中兼指思想与理解力的表达；“完全迷乱”传达加强结构和语境中的认知失措。
