  text: 'And he said to me[a], “Consider for yourself: just as the rain is greater than the drops, and the fire greater than the smoke, so what has passed has greatly exceeded the measure, but the drops and the smoke remain.”'
translation:
  language: zh_hans
  text: 他对我说：“你自己想一想：正如雨水比雨滴多，火比烟大，已经过去的部分也照样多得多；雨滴和烟却仍存留。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogita tibi
  choice: 你自己想一想
  rationale: 保留反身意味，同时采用自然、庄重的现代汉语表达。
- source_word: pluvia amplius quam guttae
  choice: 雨水怎样多过雨滴
  rationale: amplius 表示数量或程度上的“更多”；这里以“多过”保持比喻的比较关系。
- source_word: ignis amplius quam fumus
  choice: 火怎样大过烟
  rationale: 对火与烟而言，“大过”比单说“多过”更自然，同时不把比较关系具体化为强度或体积。
- source_word: quae transivit mensura
  choice: 已经过去的量
  rationale: 按 quae 与后置的阴性名词 mensura 呼应来理解，尽量保留原文紧缩且略显含混的措辞。
- source_word: superaverunt
  choice: 还剩着
  rationale: superare 可表示“剩余、留存”；此义也与雨滴和烟作为余下部分的上下文相合。
theological_decisions:
- issue: 过去的量与余下部分之间的末世时间对比
  choice: 保留“已经过去的量”与“还剩着”的对照
  alternative: 将其明确解释为“过去的时间远多于余下的时间”
  rationale: 原文以雨、雨滴、火、烟作比，并未在本节中明说“时间”；译文不把隐含意义直接写入正文。
- issue: superabundavit quae transivit mensura 的句法与意义
  choice: 译作“已经过去的量也照样远远更多”
  alternative: “已经过去的，已远远超过了限量”
  rationale: 拉丁语可将 mensura 视为 quae 的先行词，也可能把 mensura 理解为被超过的“限量”。正文采用较符合比较语境的读法，并以脚注保存另一种可能。
translation_notes:
  register: 采用现代标准汉语，语气庄重而易懂。正文保留原文比喻及其含混处，不擅自补出“时间”或“只剩下”等解释性成分。
