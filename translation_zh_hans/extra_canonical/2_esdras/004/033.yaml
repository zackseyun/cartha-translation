  text: And I answered and said, “How long, and when will these things be? Why are our years few and evil?”
translation:
  language: zh_hans
  text: 我回答说：“这些事还要等多久？又会在何时发生？为什么我们的年日又少又苦？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quo et quando haec?
  choice: 这些事还要多久，何时才会发生？
  rationale: 拉丁文本的“quo”在此处形式或传抄情况不甚明确；结合并列的“quando”及英译所保存的时间性理解，译为“还要多久，何时”，同时用“才会发生”补足现代汉语问句。
- source_word: modici
  choice: 少
  rationale: 表示数量有限，用“少”自然对应年日短少。
- source_word: mali
  choice: 苦
  rationale: 在描述人生年日时，拉丁语“mali”可指艰难、不幸；“苦”比直译“恶”更符合现代汉语表达，也不把它误解为人的道德邪恶。
- source_word: anni nostri
  choice: 我们的年日
  rationale: “年日”既保留“anni”的时间意象，又以庄重而通顺的汉语表达人生岁月。
theological_decisions:
- issue: “mali”所指的是道德邪恶还是困苦患难
  choice: 译作“苦”，理解为年日充满困苦
  alternative: 译作“恶”
  rationale: 上下文是对人生短促艰难的哀问；译作“苦”保留悲叹意味，避免无根据地断定这些年日本身具有道德罪恶。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；保留连续两个时间疑问所形成的急切感，并以“又少又苦”凝练呈现原文并列结构。
