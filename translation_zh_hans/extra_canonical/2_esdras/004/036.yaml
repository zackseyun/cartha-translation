  text: And the archangel answered and said, ‘When the number of those like you is completed, for he has weighed the age in a balance,
translation:
  language: zh_hans
  text: 天使长说：“等到和你们一样的人的数目满了，因为他已经用天平称量了世代，并且用尺度……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: archangelus
  choice: 天使长
  rationale: 直接对应拉丁语“archangelus”，不补入本节原文未出现的专名。
- source_word: impletus fuerit numerus similium uobis
  choice: 等到和你们一样的人的数目满了
  rationale: 保留“数目达到满额”的表达，也保留复数“你们”及“相似者”所指对象的开放性。
- source_word: saeculum
  choice: 这个世代
  rationale: “saeculum”可指时代、世代或世界时期；此处选用自然且具有时间含义的“世代”，不把它限定为物质世界。
- source_word: in statera ponderauit
  choice: 用天平称量了
  rationale: 保留原文称量的具体意象和完成时意义。
- source_word: Et mensura
  choice: 又用尺度……
  rationale: 底本在短语中断；译出“mensura”的尺度意象，并以省略号明确本节残缺、句意未完。
theological_decisions:
- issue: 称量者的身份
  choice: 他
  alternative: 上帝
  rationale: 拉丁文仅由第三人称单数动词隐含主语，并未在本节明说是上帝，因此不在正文中补明。
- issue: “和你们一样的人”的身份
  choice: 保持泛指
  alternative: 义人／殉道者
  rationale: 本节没有明示其身份；不依据上下文传统或神学解释将其具体化。
- issue: 残句之间的逻辑关系
  choice: 保留“因为”
  alternative: 分作独立陈述
  rationale: “quoniam”明确引出原因，但其完整论证因底本截断而未呈现，译文不替原文补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“数目满了”略带经文语体，但清楚保留原文的满额观念。译文有意保留句末未完状态，以对应所给拉丁文本止于“Et mensura”。
