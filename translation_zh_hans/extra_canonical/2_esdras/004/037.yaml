source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mensurauit tempora, et numero numerauit tempora, et non commouebit nec excitabit usque dum impleatur praedicta
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/037.yaml
  text: and measured the times[a], and numbered the times, and he will not move or stir them until what was foretold is fulfilled.’”
translation:
  language: zh_hans
  text: 他衡量了各个时期[a]，又数算了各个时期；在预言之事成就以前，他不会使它们变动，也不会使它们兴起。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各个时期”也可译作“时限”。
    reason: tempora 可指时间阶段，也可强调已划定的期限；正文采用较自然且保留复数意味的表达。
lexical_decisions:
- source_word: mensurauit tempora
  choice: 衡量了各个时期
  rationale: 保留 mensuravit 的“衡量”意象；tempora 在此指一段段由上帝掌管的时期，而非泛指时间。
- source_word: numero numerauit tempora
  choice: 数算了各个时期
  rationale: 以“数算”传达 numero/numeravit 的计数语义及原文与前句平行的表达，不机械重复“用数目数”。
- source_word: non commouebit nec excitabit
  choice: 不会使它们变动，也不会使它们兴起
  rationale: 两个拉丁动词均为及物形式，宾语可由前文 tempora 补出；分别保留“移动、扰动”与“唤起、发动”的双重表达，避免过早把它们解释为单一事件。
- source_word: usque dum impleatur praedicta
  choice: 在预言之事成就以前
  rationale: praedicta 是中性复数，可作“预先说出的事”；不增补原文没有的“尺度”。impleatur 用“成就”符合预言实现的语境。
theological_decisions:
- issue: 谁使各时期变动或兴起
  choice: 保留主语“他”，并将隐含宾语译为“它们”
  alternative: 译作“它们不会变动，也不会兴起”
  rationale: 拉丁文 commouebit、excitabit 是第三人称单数主动式，形式上以上帝为主语更直接；同时不解释这些动作具体指何种末世事件。
- issue: praedicta 的所指
  choice: 译作“预言之事”
  alternative: “预定的尺度”或“上述之事”
  rationale: 该词可指“预先说出的／预言的事”，上下文有预言实现的意味；原文并无“尺度”一词，因此不把该概念加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“衡量—数算”保留原文平行结构；分号呈现两项安排与其后限制之间的层次。所有脚注标记均已置入正文。
