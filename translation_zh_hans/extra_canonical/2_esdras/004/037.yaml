  source_fidelity: 译文忠实呈现拉丁文的平行结构：mensurauit tempora／numero numerauit tempora 译为“衡量了各个时期／数算了各个时期”。后半句保留第三人称单数主动主语“他”，并补出由 tempora 承接的“它们”。“在预言之事成就以前”准确表达 usque dum impleatur praedicta，且没有把原文未明说的“尺度”加入正文。
  naturalness: 整体为自然、庄重的现代书面汉语。“衡量—数算”和“不会使……变动，也不会使……兴起”的对举清楚。尽管“使时期兴起”在汉语中略显非常规，但这恰好保留了原文 commouebit／excitabit 的双动词及其未具体化的宾语，不宜擅自具体化为某一末世事件。
  terminology: “时期”适合 tempora 的复数和末世论语境；脚注说明“时限”的可能性，恰当地保留语义范围。“预言之事”适切对应中性复数 praedicta，即预先说出、所预言的事。
