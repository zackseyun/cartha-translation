  text: For what has passed I know, but what is to come I do not know.”
translation:
  language: zh_hans
  text: 因为已经过去的事，我知道；但将来会发生什么，我不知道。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod pertransiuit
  choice: 已经过去的事
  rationale: 按拉丁文直译其时间含义；用现代汉语自然表达已经发生、成为过去之事。
- source_word: quid autem futurum sit
  choice: 但将来会发生什么
  rationale: 保留间接疑问结构和 futurum 的未来含义；“会发生什么”比生硬的“什么将是”更符合现代汉语。
- source_word: scio … [nescio]
  choice: 我知道……我不知道
  rationale: 保留原句鲜明的对照。所给清理文本开头的“nos;”显然不能在当前位置独立成句，而英译及句法语境表明末句是否定“知道”。
