  text: And I said[a], “It cannot, Lord.” And he said to me, “In Hades the storehouses
translation:
  language: zh_hans
  text: “她的母腹能把胎儿留在其中吗？”我说：“不能，主啊。”他对我说：“在阴间[a]，库房……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“阴间”指死者所在的领域，并非特指最终受惩罚之处。
    reason: cultural_note
lexical_decisions:
- source_word: matrix
  choice: 母腹
  rationale: 此处指孕育并容纳胎儿的子宫；“母腹”在现代汉语中自然、庄重，也保留生育意象。
- source_word: foetum
  choice: 胎儿
  rationale: 直接表达尚在母腹中的生命，符合上下文。
- source_word: inferno
  choice: 阴间
  rationale: 指死者所在的领域，并不专指最终受刑之处；“阴间”是现代中文圣经语境中较准确且易懂的对应词。
- source_word: prumptuaria (promptuaria)
  choice: 库房
  rationale: 该词意为储藏之所；原文在此中断，因此只译出名词而不补足其用途或比喻关系。
theological_decisions:
- issue: infernum所指的死者领域
  choice: 阴间
  alternative: 地狱
  rationale: “地狱”容易被理解为最终惩罚之地，而此处拉丁词本身可泛指死者所在之境；译作“阴间”避免过度限定。
- issue: 残篇末尾的不完整句子
  choice: 以省略号标明原文中断，不补出谓语或解释
  alternative: 按上下文补成“阴间的库房就像母腹”
  rationale: 现存所给拉丁文本止于“in inferno prumptuaria”，补写比喻或“灵魂”等内容缺乏直接文本依据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主啊”保留对话中的尊称。末句依据残存拉丁文保持未完状态，以省略号显示文本中断。
