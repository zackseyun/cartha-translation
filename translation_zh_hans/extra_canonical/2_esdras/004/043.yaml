base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/043.yaml
  text: They hasten to return the things that were entrusted from the beginning. Then what you desire to see will be shown to you.
translation:
  language: zh_hans
  text: 它们急于交还从起初所托付的东西。那时，你渴望看见的事就会向你显明。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinant
  choice: 急于
  rationale: 表达赶紧、迫切行动之意，同时保持现代汉语自然简洁。
- source_word: reddere
  choice: 交还
  rationale: 保留“归还、交回”之义，也与后面的“托付”形成自然搭配。
- source_word: ea quae commendata sunt
  choice: 托付给它们的东西
  rationale: commendata sunt 在此指受托保管之物；被动结构译为自然汉语，并保留复数主语所指并不明确的状态。
- source_word: ab initio
  choice: 从起初就
  rationale: 既保留时间起点，也借“就”体现托付自起初已经成立。
- source_word: Tunc
  choice: 那时
  rationale: 保留原文的时间承接，不擅自解释为因果关系。
- source_word: quae concupiscis uidere
  choice: 你渴望看见的事
  rationale: concupiscis 表示强烈愿望，此处译作“渴望”；中性复数关系结构按语境译作“……的事”。
- source_word: demonstrabitur
  choice: 会向你显明
  rationale: 保留被动语态及启示、展示的开放含义，不明确补出施事者。
theological_decisions:
- issue: 首句复数主语的指代
  choice: 译作“它们”，不补明具体对象
  alternative: 按上下文解释成某一类受造物、时代或灵魂等
  rationale: 本节所给拉丁文本仅有动词第三人称复数，具体先行对象需由上下文判断；为避免导入解释，保留代词的指代张力。
- issue: 显明行为的施事者
  choice: 采用“会向你显明”的无施事被动表达
  alternative: 译作“上帝会让你看见”
  rationale: 原文 demonstrabitur 未明说施事者，不应以神学推断补出“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。首句保留原文未明指的复数主语；末句保持被动和启示性措辞，不额外解释显明者是谁。
