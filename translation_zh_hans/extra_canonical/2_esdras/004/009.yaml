id: 2ES.4.9
reference: 2 Esdras 4:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nunc autem non interrogaui te nisi de igne et uento et die, per quae transisti, et sine quibus esse non potes, et non respondisti mihi de eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/009.yaml
  text: But now I have asked you only about fire and wind and day[a], through which you have passed and without which you cannot exist, and you have not answered me about them.
translation:
  language: zh_hans
  text: 但现在，我只问过你火、风和白昼；你经历过这些，没有这些你就不能存在，可是你没有回答我有关这些的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nunc autem
  choice: 但现在
  rationale: 保留转折和当前话语推进的意味。
- source_word: die
  choice: 白昼
  rationale: 拉丁语 dies 在此与火、风并列，指人所经历且赖以生存的白昼；译作“白昼”比“日子”更明确。
- source_word: per quae transisti
  choice: 你经历过这些
  rationale: 保留 per 与 transire 所表达的经过、经历之意，同时使现代汉语自然。
- source_word: sine quibus esse non potes
  choice: 也离不开这些而生存
  rationale: esse non potes 直指不能存在；结合上下文，以“不能生存”的自然表达传达依赖关系，且不增添神学解释。
- source_word: non respondisti mihi de eis
  choice: 可你并没有回答我
  rationale: 汉语中宾语已由上文明确，无须机械重复“关于这些”；“可”传达拉丁语并列结构中的反差。
theological_decisions:
- issue: 人“不能存在”与火、风、白昼的关系
  choice: 离不开这些而生存
  alternative: 没有这些你就无法存在
  rationale: 采用较自然的现代汉语，同时保留受造者对这些基本事物的依赖，不进一步界定这种依赖的哲学或神学性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号理清长句层次，并保持说话人在下一节继续发言的开放性，不添加结束引号。
