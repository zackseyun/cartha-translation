  text: Consider now for yourself how much fruit of ungodliness a seed has produced. When
translation:
  language: zh_hans
  text: 你自己想想，一粒种子结出了多少不敬虔的果实。当[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当”在本节末尾开启一个尚未说完的分句，内容接续下文。
    reason: 说明拉丁文 Quando 的跨节未完结构，避免读者误以为译文残缺。
lexical_decisions:
- source_word: seminis
  choice: 一粒种子
  rationale: 按单数属格理解为“种子”；用量词“一粒”自然表达不定单数，不添加原文没有的“邪恶”等修饰语。
- source_word: fructum impietatis
  choice: 不敬虔的果实
  rationale: 保留“果实”意象及 impietas 的宗教与道德张力；“不敬虔”比单纯的“邪恶”更贴近原词。
- source_word: generauerit
  choice: 生出了
  rationale: 表达“产生、生出”的完成意义，也维持种子与果实之间的比喻联系。
- source_word: Quando
  choice: 当
  rationale: 保留原文在本节末尾开启下一分句的未完结构，不擅自补足其内容。
theological_decisions:
- issue: impietas 的含义范围
  choice: 不敬虔
  alternative: 邪恶／不虔诚
  rationale: “不敬虔”兼具背离上帝与道德败坏的意味，避免把词义缩减为一般性的恶。
- issue: 种子本身是否被明说为邪恶
  choice: 不添加“邪恶的”
  alternative: 邪恶的种子
  rationale: 现存拉丁文本只有 seminis，并没有修饰种子的形容词；罪恶性质由“不敬虔的果实”表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你自己想想”保留劝读者亲自思量的语气；末尾刻意保留“当”的悬接结构，以对应所给拉丁文本。
