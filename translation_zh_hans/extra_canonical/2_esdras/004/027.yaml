  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam festinans festinat saeculum pertransire; Non enim capiet portare quae in temporibus iustis repromissa sunt, quoniam plenum mesticia est saeculum hoc et infirmitatibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/027.yaml
  text: because the age is hastening quickly to pass away. For it cannot bear the things that have been promised for the righteous in their proper times, because this age is full of sorrows and weaknesses.
translation:
  language: zh_hans
  text: 因为这世代正急速地走向消逝。因为它无法承载那些在适当的时候为义人所应许的事；这世代充满了忧伤和软弱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: 世代
  rationale: 此处既可指现今的时代或世界秩序，也带有终将过去的时期之意；“世代”能较自然地保留这种时间性。
- source_word: festinans festinat ... pertransire
  choice: 正急速奔向终结
  rationale: 拉丁文以同源词叠加强调迅速趋向过去；中文不机械重复，而以“正急速”体现强调，并用“奔向终结”自然表达其动态。
- source_word: capiet portare
  choice: 承受不了
  rationale: 字面涉及“有能力承载”；“承受不了”保留了承载能力不足的意象，也符合现代汉语。
- source_word: quae ... repromissa sunt
  choice: 那些已应许……的事
  rationale: 保留被动的应许表达；repromissa 在此按已作出的应许理解，不额外引入“再次应许”。
- source_word: in temporibus iustis
  choice: 在适当的时候
  rationale: iustis 可有正当、合宜之意；结合复数 tempora，译为“适当的时候”，避免误解为“义人的时代”。
- source_word: mesticia ... et infirmitatibus
  choice: 忧愁和软弱
  rationale: 分别对应悲苦与衰弱、无力；采用庄重而通俗的现代汉语。
theological_decisions:
- issue: 应许之物与义人的关系
  choice: 已应许要……赐给义人的事
  alternative: 已向义人应许的事
  rationale: 拉丁文 pro iustis 更直接表示“为义人”，并非明确表示应许的受话者；译文以“赐给义人”表达受益关系，而不把它改成“向义人”说出的应许。
- issue: 现今世代不能承受应许之事的含义
  choice: 保留“它承受不了”的拟人化说法
  alternative: 现今的世界无法容纳这些福分
  rationale: 原文把 saeculum 拟人化为无法承载应许之物；不进一步解释这些事的性质，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“世代”贯穿两句，维持原文的重复与论证联系；句式略作汉语化处理，但保留因果结构、拟人意象及应许实现时间上的张力。
