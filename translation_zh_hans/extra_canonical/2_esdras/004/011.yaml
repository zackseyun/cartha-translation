  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uas tuum capere altissimi uiam, et iam exteritus corrupto saeculo intelligere incorruptionem? et cum haec audissem, cecidi in faciem meam, Et dixi illi: melius erat nos non adesse,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/011.yaml
  text: how can your vessel grasp the way of the Most High[a], and, already worn out by the corrupt age, understand incorruption?” And when I heard these things, I fell on my face, and I said to him, “It would have been better for us not to exist,”
translation:
  language: zh_hans
  text: 你的器皿怎能容得下至高者的道路？你已经被这败坏的世代耗损，又怎能明白不朽呢？”我听见这些话，就俯伏在地，对他说：“我们若不曾存在，反倒更好。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uas tuum
  choice: 你的器皿
  rationale: 保留拉丁文“器皿”的具体比喻；此处指人有限的承受与理解能力，但不在正文中将比喻解释掉。
- source_word: capere
  choice: 容得下
  rationale: 兼顾“容纳、承受”和“领会”的语义，并与“器皿”意象自然搭配。
- source_word: altissimi uiam
  choice: 至高者的道路
  rationale: 直译属格结构，保留“道路”可能兼指作为与旨意的开放性。
- source_word: exteritus
  choice: 耗损
  rationale: 表达被磨损、消耗殆尽的状态，同时避免过度具体化为身体衰老。
- source_word: corrupto saeculo
  choice: 这败坏的世代
  rationale: saeculum在此可指时代或现世秩序；“世代”自然且保留其道德与受造界败坏的张力。
- source_word: incorruptionem
  choice: 不朽
  rationale: 表达与“败坏”相对的不腐坏状态；不限定为单纯的肉身不朽或抽象永恒。
- source_word: cecidi in faciem meam
  choice: 俯伏在地
  rationale: 采用现代汉语中自然而庄重的俯伏表达，传达面伏于地的动作。
- source_word: melius erat nos non adesse
  choice: 我们若不曾存在，反倒更好
  rationale: 准确传达反事实意味及adesse在此“存在、来到世上”的含义。
theological_decisions:
- issue: “器皿”是否应直接解释为人的心智或理解力
  choice: 保留“器皿”比喻
  alternative: 译为“你的心智怎能领会”
  rationale: 源文使用具体比喻；保留它可呈现人的有限性，而不替文本预先界定器皿所指。
- issue: incorruptio的范围
  choice: 译作“不朽”
  alternative: 译作“不腐坏”或“永恒”
  rationale: “不朽”在中文中可自然表达与败坏相反的状态，又避免将其明确等同于某一套末世论概念。
- issue: 以斯拉末句的绝望性陈述
  choice: 保留“我们若不曾存在，反倒更好”
  alternative: 弱化为“我们不来到世上也许更好”
  rationale: 源文语气强烈，译文不应为缓和神学张力而削弱其存在性的哀叹。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。问句保留天使责问中对人类有限性的强调；末句按本节拉丁文本完整收入，不移至下一节。
