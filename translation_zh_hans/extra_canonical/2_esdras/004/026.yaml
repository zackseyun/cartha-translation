  text: And he answered me and said, “If you are, you will see; and if you live, you will often marvel,”
translation:
  language: zh_hans
  text: 他回答我说：“你若还在[a]，就会看见；你若活着，就会屡屡惊叹，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你若还在”：拉丁文为“如果你是／将会是”一类说法；此处按语境译作“你若还在”。有些译法理解为“你若还活着”，但原文这里与下句“你若活着”所用的动词不同。
    reason: 说明前句sum与下句vivo的措辞差别，同时避免把“仍然存在”误说成前句动词本身的严格直译。
lexical_decisions:
- source_word: si fueris
  choice: 你若还在
  rationale: fueris是sum的将来完成时或完成虚拟式形式；在此条件句中直译近于“如果你仍存在/还在”。译作“你若还在”保留其与下句si vixeris“你若活着”的用词差别，也不擅自补入“活得够久”等原文没有的意思。
- source_word: uidebis
  choice: 就会看见
  rationale: 保留简单将来意义；原文未明说看见什么，中文也不补出宾语。
- source_word: si uixeris
  choice: 你若活着
  rationale: vivo明确指“活着、生活”，与前句sum的fueris相区别。
- source_word: frequenter miraberis
  choice: 就会屡屡惊叹
  rationale: frequenter表示“时常、屡次”，mirari在此为“惊叹、诧异”；“屡屡惊叹”兼顾频率和庄重自然的语体。
theological_decisions:
- issue: si fueris与si uixeris之间是否应视为同义重复
  choice: 分别译为“你若还在”和“你若活着”
  alternative: 两处都译为“你若活着”，或将前句扩译为“你若活得够久”
  rationale: 拉丁文本刻意使用不同动词；经文的具体所指并不明朗，因此保留其措辞差异与含混，不用解释性扩译消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他回答我说”保留原文应答公式；“屡屡”比“经常”略具经文语体，但仍属现代通用表达。
