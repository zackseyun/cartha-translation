  yaml_path: translation/extra_canonical/2_esdras/004/052.yaml
  text: You ask insistently; I can tell you in part[a], but concerning your life, I have not been sent to tell you, and I do not know.
translation:
  language: zh_hans
  text: 你一再追问；我可以告诉你一些[a]。但关于你的寿命，我并没有奉命告诉你；不过，我不知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 乌列的回答有意保持有限：他能透露一些，却不能告知以斯拉的寿命。这种拒绝体现了本书的一个主题：人对上帝所定时间的认识是有限的。
    reason: compositional_layer
lexical_decisions:
- source_word: perrogas
  choice: 你一再追问
  rationale: perrogas带有反复、执意询问的语气；译为“一再追问”既传达加强意味，也符合现代汉语表达。
- source_word: ex parte
  choice: 一部分
  rationale: 直译其“部分地、在某种程度上”的含义，并保留回答有限而未穷尽的意味。
- source_word: de vita autem tua
  choice: 但关于你的寿命
  rationale: 此处vita结合上下文指以斯拉余生的长短，而非泛指生活或生命；“寿命”能清楚表达所问的是尚可活多久。
- source_word: non sum missus dicere tibi
  choice: 我并没有奉命告诉你
  rationale: 保留“被差遣”的神圣授权背景；汉语用“奉命”自然表达说话者未获授权告知。
- source_word: sed nescio
  choice: 而且我也不知道
  rationale: sed在此衔接进一步的限制；译为“而且”较自然，同时保留说话者既未奉命、也不知情的双重陈述。
theological_decisions:
- issue: 天使对神圣时间的认知与授权均受限制
  choice: 明确保留“没有奉命”与“我也不知道”两项陈述
  alternative: 将“不知道”解释为仅仅无权透露，或省略其中一项
  rationale: 拉丁文本并列陈述未受差遣和不知道；译文不将真实的神学张力化约为单纯拒绝透露。
- issue: 可披露内容的范围
  choice: 保留笼统的“一部分”
  alternative: 补明为“有关征兆的一部分”
  rationale: 本节拉丁文本没有重复“征兆”；虽可由上下文推知，正文不补入，以忠实保留原句的简约与部分性。
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“一再追问”传达perrogas的加强语气；“奉命”保留差遣与授权意味。正文不补入拉丁文未明说的“征兆”，脚注则说明上下文及其神学作用。
