  text: 'super terram. Et respondit ad me et dixit: uade et interroga praegnantem, si quando impleuerit nouem menses suos adhuc'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/040.yaml
  text: And he answered me and said, “Go and ask a pregnant woman whether, when she has completed her nine months, she can still keep the child within her.”
translation:
  language: zh_hans
  text: 他回答我说：“你去问一个孕妇：她怀孕满了九个月以后，还能把孩子留在腹中吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnantem
  choice: 一个孕妇
  rationale: 直接、自然地表达“怀孕的女子”，符合现代标准汉语。
- source_word: impleuerit nouem menses suos
  choice: 她怀孕满了九个月以后
  rationale: “她自己的九个月满了”在汉语中不自然；补明“怀孕”可准确传达妊娠期满九个月之意。
- source_word: adhuc
  choice: 还
  rationale: 保留时间推进后“仍然”的语义。
- source_word: interroga
  choice: 问
  rationale: 在此语境中是向孕妇提出问题，并非正式审问。
theological_decisions:
- issue: 本节开头的“super terram”归属
  choice: 不纳入本节正文
  alternative: 译作“在地上。”置于本节开头
  rationale: 该短语在所引拉丁文本中显然是上一句的句尾，而本节经审校的分节正文从“Et respondit”开始；将其强行并入会造成残句。
- issue: 拉丁引文在“adhuc”处截断后的问句内容
  choice: 依本节经审校文本表达为“还能把孩子留在腹中吗”
  alternative: 仅译至“还……”并保留残句
  rationale: 现有拉丁摘录在副词“adhuc”后机械截断，无法独立成句；经审校的咨询层保存了该问句的完整语意。译文不额外指定子宫为主语，以免增加源文未明确表达的细节。
translation_notes:
  register: 采用自然、庄重而易懂的现代汉语。“留在腹中”既清楚表达胎儿仍在母体内，也避免使用过于医学化的措辞。保留直接问句的修辞力度。
