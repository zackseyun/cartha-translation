  text: est, et dispositionis scriptae nusquam sunt. Et pertransimus de saeculo ut locustae, et uita nostra ut uapor, et nec digni sumus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/024.yaml
  text: and the written ordinances are nowhere to be found. And we pass through the age like locusts[a], and our life is like vapor, and we are not worthy,
translation:
  language: zh_hans
  text: 而成文的规条也无处可寻。[a]我们如蝗虫般穿行于这世代；我们的生命如同一缕水汽，而我们又不配，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成文的规条也无处可寻”很可能是说，在灾难之下，以色列那具有权威的成文秩序实际上已经丧失或失效；这未必表示每一份抄本都已从物质上消失。
    reason: lexical_alternative
lexical_decisions:
- source_word: dispositionis scriptae
  choice: 成文的规条
  rationale: 以“成文”体现 scriptae，以“规条”表达 dispositio 在此处指权威性秩序或规定的含义，同时避免把它过窄地限定为某一种法律文书。
- source_word: nusquam sunt
  choice: 无处可寻
  rationale: 既保留“哪里都没有”的力度，也容纳文本可能指灾难之下成文秩序失效或散佚，而不武断断言所有抄本均已物理消失。
- source_word: pertransimus de saeculo
  choice: 经过这个世代
  rationale: pertransimus 表示穿行、经过；saeculum 在此可指时代或现世。“这个世代”保留其时间与世界秩序方面的张力。
- source_word: ut locustae
  choice: 像蝗虫一样
  rationale: 直译明喻，不擅自补出蝗虫短命、成群或被驱散等具体比喻重点。
- source_word: uita nostra ut uapor
  choice: 我们的生命如同一缕水汽
  rationale: uapor 指蒸气、水汽；“一缕水汽”自然地表现生命短暂易逝，同时不改作更具诗意但语义偏移的“云烟”。
- source_word: nec digni sumus
  choice: 而我们又不配
  rationale: 保留 digni 的补语悬而未决，因为本节拉丁文本在此以逗号结束，句意延续至下文。
theological_decisions:
- issue: “成文的规条”无处可寻的范围
  choice: 正文保持概括，并以脚注说明可能指以色列权威性成文秩序在灾难中实际丧失或失效
  alternative: 明确译成所有律法书卷都已遗失
  rationale: 原文没有明说每一份文本都已物理消失；避免将历史与神学含义不必要地收窄。
- issue: “不配”的对象或结果
  choice: 不补足宾语，保留未完结构
  alternative: 补译为“不配蒙怜悯”或“不配生存”
  rationale: 当前所给原文止于 nec digni sumus，补足具体内容会提前解释下文并消除原有悬念。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“水汽”比“蒸气”更自然，“规条”则兼顾制度性与规范性。末尾保留逗号，显示原文句子尚未完结。
