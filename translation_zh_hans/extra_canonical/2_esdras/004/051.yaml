  yaml_path: translation/extra_canonical/2_esdras/004/051.yaml
  text: And I prayed and said, “Do you think I shall live until those days? Or who will be in those days?”
translation:
  language: zh_hans
  text: 我祷告说：“你认为我能活到那些日子吗？又有谁会在那些日子呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: oravi
  choice: 祷告
  rationale: 直接表达拉丁文所指向上帝祈求的动作，符合经文语域。
- source_word: putas
  choice: 你认为
  rationale: 保留原文直接询问对方判断的语气，不额外解释为预言或保证。
- source_word: vivo usque in diebus illis
  choice: 我能活到那些日子
  rationale: 按语境自然表达存活直到所说时期之意；原文的 in 很可能承载时间用法。
- source_word: quis erit in diebus illis
  choice: 有谁会在那些日子活着
  rationale: 清理文本中的 quiserit 应分读为 quis erit；补出“活着”使中文承接前句自然，同时保留询问届时谁仍在世的含义。
theological_decisions:
- issue: 说话者能否亲历末后所预示的日子
  choice: 采用疑问表达，不断定说话者会活到那时
  alternative: 将问题解释成对复活后身处那些日子的询问
  rationale: 本句只问是否能活到那些日子以及谁会在那些日子，并未明确提到复活；应保留其开放性。
translation_notes:
  register: '采用现代、庄重且易懂的叙事语言；保留连续两个疑问句。所给拉丁文本末尾“respondit ad me et dixit: de signis de quibus me”显然进入下一句且残缺，因此本节正文依照所给参考范围止于第二个问题。'
