revisions:
- from: 因为从起初，一粒邪恶的种子就撒在了亚当心里；它直到如今生出了多少不敬虔，还要继续生出，直到打谷场来到！但你要在自己心里思量这邪恶的种子。
  to: 因为从起初，一粒邪恶的种子就撒在了亚当心里；它直到如今已经生出多少不敬虔之事，并且还要生出多少，直到打谷场来到！但你要在自己心里思量这粒邪恶的种子。
  rationale: 修订仅调整数量短语的范围和汉语搭配：补出将来项所含的“多少”，并以“不敬虔之事”使“生出”在现代汉语中自然。保留“打谷场来到”的原始意象、未指明的播种者，以及末句开放而省略性的衔接。
