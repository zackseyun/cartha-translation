  text: granum seminis mali seminatum est in corde Adam ab initio, et quantum impietatis generauit usque nunc et generabit usque cum ueniat area. Aestima autem apud te granum mali
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/030.yaml
  text: For a grain of evil seed was sown in Adam’s heart from the beginning, and how much ungodliness it has produced until now, and will still produce until the threshing floor comes! But consider within yourself the grain of evil
translation:
  language: zh_hans
  text: 因为从起初，一粒邪恶的种子就撒在了亚当心里；它直到如今已经生出多少不敬虔之事，并且还要生出多少，直到打谷场来到！但你要在自己心里思量这粒邪恶的种子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: granum seminis mali
  choice: 一粒邪恶的种子
  rationale: 按拉丁文意象直译其核心含义，同时避免生硬重复成“一粒邪恶种子的籽粒”。
- source_word: impietatis
  choice: 不敬虔
  rationale: 既可涵盖对上帝的不敬，也保留由此引申的邪恶、不义意味。
- source_word: area
  choice: 打谷场
  rationale: 保留原文具体的农业及审判意象，不擅自解释为“审判”或“末日”。
- source_word: Aestima autem apud te
  choice: 但你要在自己心里思量
  rationale: 表达 apud te 的内在反思意味，并以自然的现代汉语呈现命令语气。
theological_decisions:
- issue: 邪恶种子与亚当之心的关系
  choice: 保留“撒在了亚当心里”的被动表述
  alternative: 译成“亚当把邪恶带入人心”或明确指出播种者
  rationale: 原文没有说明播种者，也没有系统阐释罪如何传递；译文不补入特定教义。
- issue: “打谷场来到”的末世含义
  choice: 保留原有隐喻
  alternative: 释译为“直到审判之日来到”
  rationale: 原文使用 area，可能唤起收割、扬场和审判等关联，但并未明说；应保存其神学张力与意象。
- issue: 末句的衔接与所指
  choice: 译为“但你要在自己心里思量这邪恶的种子”
  alternative: 将其并入下一节或补出思量的具体结论
  rationale: 依据所给拉丁文本保留该未完全展开的劝告，不从后文预先补足含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“不敬虔”“打谷场”等词保留经文语域与原文意象；末句略带悬而未决的感觉，反映拉丁文本在本节结尾处的开放衔接。
