  text: 'Et dixit ad me : si eram interrogans te dicens : quantae habitationes sunt in corde maris, aut quantae uenae sunt in principio abyssi, aut quantae uiae sunt super firmamentum, aut qui sunt exitus paradisi ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/007.yaml
  text: And he said to me, “If I had asked you, saying, ‘How many dwellings are in the heart of the sea? Or how many springs are at the source of the deep? Or how many ways are above the firmament? Or what are the exits of paradise?’
translation:
  language: zh_hans
  text: 他对我说：“假如我问你：‘大海深处有多少居所？深渊的源头有多少泉脉？穹苍之上有多少条道路？乐园有哪些出口？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: habitationes
  choice: 居所
  rationale: 保留拉丁文“居住之处”的基本含义，不具体化为房屋或区域。
- source_word: in corde maris
  choice: 海心之中
  rationale: 按原文保留“海的心脏/中心”这一诗性空间意象；现代汉语中“海心”简洁而庄重。
- source_word: uenae
  choice: 泉脉
  rationale: 本义为“脉络、矿脉、水脉”；结合深渊源头的语境译作“泉脉”，既表达水源支脉，也避免单纯译成泉眼而缩窄含义。
- source_word: in principio abyssi
  choice: 深渊的源头
  rationale: principium 可指开端、起源或源头；此处与水脉搭配，译作“源头”最自然，同时保留宇宙论意象。
- source_word: uiae
  choice: 道路
  rationale: 采用宽泛直译，保留其可能指路径、通道或运行轨迹的开放性。
- source_word: firmamentum
  choice: 穹苍
  rationale: 对应古代宇宙观中的天穹，较“天空”更能保留原文的宇宙结构意象。
- source_word: exitus paradisi
  choice: 乐园的出口
  rationale: exitus 为出口、出路；采用“出口”保留原文复数所问的类别意义，而不擅自解释为边界或门。
theological_decisions:
- issue: 古代宇宙结构意象
  choice: 保留“深渊”“穹苍”“乐园”等实体性空间语言
  alternative: 按现代宇宙观弱化为“海底、天空、天堂”
  rationale: 原文以不可测的宇宙领域反问人的知识限度；保留这些术语可维持其神学张力与古代世界图景。
- issue: qui sunt exitus 的疑问方式
  choice: 译为“出口在哪里”
  alternative: 译为“有哪些出口”或“出口是什么”
  rationale: 拉丁文 qui 在此可询问出口为何或何在；汉语“在哪里”最自然，也与一连串空间性问题协调，但不进一步断定出口的性质。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语体。连续四个问句保留原文的层递结构；“海心”“深渊”“穹苍”“乐园”维持诗性及古代宇宙论色彩。
