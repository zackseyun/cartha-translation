  text: to me and said, “You have judged rightly, so why have you not judged for yourself?”
translation:
  language: zh_hans
  text: 对我说：“你判断得对，那么为什么不为自己作判断呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bene
  choice: 对
  rationale: 在“判断”这一语境中表示判断正确；译为“对”自然、简明。
- source_word: iudicasti
  choice: 判断
  rationale: 保留原文前后重复的同一动词，使反问与前句紧密对应。
- source_word: tibi
  choice: 为自己
  rationale: 按拉丁语与格的通常含义直译为受益者“为自己”，不擅自具体化为“你自己的事”。
theological_decisions:
- issue: 反问所指的范围
  choice: 不补出具体案件或属灵含义
  alternative: 译作“为什么不判断你自己的事”或“为什么不省察自己”
  rationale: 原文仅有 tibi（为你自己），具体所指在本节中并未明说，应保留其含蓄与张力。
translation_notes:
  register: 采用现代、庄重而口语自然的表达；用“那么……呢”清楚呈现 et quare 的承接与反问语气。
