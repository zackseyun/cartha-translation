lexical_decisions:
- source_word: profectus sum
  choice: 我……去
  rationale: 拉丁文为简单完成时，表示“我动身／去了”，没有“有一次”等时间副词；中文以“我到……去”自然表达。
- source_word: siluam lignorum campi
  choice: 平原上的树林
  rationale: 按字面是“平原树木的森林”。译作“平原上的树林”既保留 campi 的修饰关系，也符合现代汉语习惯。
- source_word: cogitauerunt cogitationem
  choice: 想出了一个计策
  rationale: 原文采用同源词重复，意为谋划、形成一个计划；中文不机械重复“思想了一个思想”，而传达其谋划意味。
- source_word: Et dixerunt
  choice: 说
  rationale: 承接前句，以“树木”为复数主语；汉语无需重复代词。
- source_word: uenite et eamus
  choice: 来吧，我们去
  rationale: 分别保留邀请式命令“来吧”和第一人称复数劝勉“我们去”。
- source_word: et faciamus ad
  choice: 发动一场针对——
  rationale: faciamus ad 在本节末尾尚未完成，后续内容不在所给拉丁文本内；译文以破折号保留句法中断，而不擅自补足宾语。
