  text: 他对我说：“站在右边，并且……”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et dixit ad me
  choice: 他对我说
  rationale: 直接保留叙事连接和说话对象；句首的 Et 在汉语中无需机械译作“并且”。
- source_word: sta
  choice: 站到……去
  rationale: 拉丁语命令式；结合方位表达，现代汉语用“站到……去”自然清楚。
- source_word: super dexteram partem
  choice: 右边
  rationale: 按其空间方位义翻译；不增添原文没有说明的对象或象征意义。
- source_word: et
  choice: 然后
  rationale: 保留本节末尾尚待下文承接的连接词，同时使中文比悬空的“并且”更自然。
