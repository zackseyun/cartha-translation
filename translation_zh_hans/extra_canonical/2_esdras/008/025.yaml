  text: Ne aspicias populi tui delicta, sed qui tibi in ueritate serui-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/025.yaml
  text: Do not look upon the offenses of your people[a], but upon those who have served you in truth.
translation:
  language: zh_hans
  text: 不要看你子民的过犯，却要看那些忠实事奉你的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在真理中事奉你的人”。
    reason: translation
lexical_decisions:
- source_word: aspicias
  choice: 看
  rationale: 在祈求语境中表达“注视、察看并加以考虑”，与后半句的对照保持一致。
- source_word: delicta
  choice: 过犯
  rationale: 指违法或罪责性的过失；“过犯”庄重自然，又不把含义收窄为某一种罪。
- source_word: in ueritate
  choice: 真诚
  rationale: 此处修饰“事奉”，可表达忠实、真实无伪地事奉；避免生硬直译为“在真理中”。
- source_word: seruierunt
  choice: 事奉
  rationale: 在对上帝的宗教语境中，拉丁语 servire 宜译为“事奉”。
theological_decisions:
- issue: 祈求上帝不要察看过犯、而要察看忠诚事奉者之间的张力
  choice: 保留“不要看……只要看……”的直接对照
  alternative: 解释为不要按过犯审判，而按义行施恩
  rationale: 原文只提出对比性的祈求，并未说明审判或施恩的具体机制，因此不作神学扩展。
- issue: in ueritate 的含义
  choice: 真诚事奉
  alternative: 在真理中事奉／忠实地事奉
  rationale: “真诚”保留真实无伪与忠诚的语义范围，且符合现代汉语搭配；脚注列出较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“不要……只要……”自然呈现拉丁文 ne...sed... 的对照。依据本节拉丁文补足跨行断开的 serui-erunt，不纳入属于上一节的句子。
