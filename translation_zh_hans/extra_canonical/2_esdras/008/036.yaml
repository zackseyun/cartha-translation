source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'deliquit. In hoc enim adnuntiabitur iusticia tua et bonitas tua, domine, cum misertus fueris eis qui non habent substantiam operum bonorum. Et respondit ad me et dixit: recte locutus es aliqua, et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/036.yaml
  text: For in this your righteousness and your goodness will be declared, Lord, when you have mercy on those who have no store of good works.”
translation:
  language: zh_hans
  text: 因为，主啊，当你怜悯那些没有善行积存的人时，你的公义和良善就会在这件事上彰显出来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iusticia
  choice: 公义
  rationale: 在向主陈述其施怜悯之正当与信实时，“公义”兼顾司法和伦理含义，也符合庄重的经文语域。
- source_word: bonitas
  choice: 良善
  rationale: 表达上主本性的善美与恩慈，不将其缩窄为单纯的“仁慈”，因为后文 misertus 已明确表达怜悯。
- source_word: substantiam operum bonorum
  choice: 善行积存
  rationale: substantia 在此指可据以倚靠的存量或积蓄；“善行积存”保留原文近乎财物储备的意象，同时不暗示特定宗派的功德体系。
- source_word: adnuntiabitur
  choice: 彰显出来
  rationale: 拉丁文为将来时被动态，可指被宣告、显明；此处强调上主的公义与良善借怜悯之举显露，中文用“就会……彰显出来”自然且保留将来意味。
- source_word: misertus fueris
  choice: 当你怜悯……时
  rationale: 准确表达完成时形式所构成的将来条件/时间关系，并保留怜悯作为彰显公义与良善的具体行动。
theological_decisions:
- issue: 没有善行者与上主怜悯之间的关系
  choice: 译作“没有善行积存的人”，保留他们缺少可倚靠善行而蒙怜悯的张力
  alternative: 译作“没有善功的人”或“毫无善行的人”
  rationale: 原文并非明确断言其绝无任何善举，而是说没有善行的 substantia（存量、根基）；所选译法避免把文本推向功德论或彻底无善行的绝对判断。
- issue: 公义与怜悯的并置
  choice: 按原文同时保留“公义”“良善”和“怜悯”
  alternative: 将“公义”解释性改译为“信实”或将二者合并为“仁慈”
  rationale: 原文有意让公义与怜悯并存；不应以解释性译法消除其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主啊”保留呼格；句序按中文习惯调整，将时间从句前置。“在这件事上”对应 In hoc，明确上主的怜悯正是其公义和良善彰显的场域。原始摘录开头的 deliquit. 属于前句，结尾 Et respondit... 属于下一句，均不纳入本节正文。
