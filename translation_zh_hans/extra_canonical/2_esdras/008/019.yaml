  yaml_path: translation/extra_canonical/2_esdras/008/019.yaml
  text: Therefore hear my voice and understand my words[a][b], and I will speak before you.” The beginning of the words of Ezra’s prayer before he was taken up.
translation:
  language: zh_hans
  text: 所以，请听我的声音，明白我的话；我要在你面前陈说。”以斯拉的祷告之言的开端：在他被接去以前。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是以斯拉的祷告之言的开端，在他被接去以前。”
    reason: previous_rendering
  - marker: b
    text: 末句“以斯拉的祷告之言的开端：在他被接去以前”似乎是编纂或抄写者所加的过渡性题记。因本译本所依据的拉丁文见证含有此句，故保留在正文中。
    reason: compositional_layer
lexical_decisions:
- source_word: audi meam uocem
  choice: 听我的声音
  rationale: 贴近拉丁文措辞，同时在祷告语境中自然庄重。
- source_word: intellege sermonum meorum
  choice: 明白我的话
  rationale: 原文 sermonum 为复数属格形式；汉语以“我的话”自然表达其整体含义，不强加解释。
- source_word: loquar coram te
  choice: 我要在你面前陈说
  rationale: 保留 coram te 的“在你面前”，并用“陈说”体现祷告中的郑重语体。
- source_word: adsumeretur
  choice: 被接去
  rationale: 保留被动及去向未明的含混性，不擅自说明是升天、死亡或其他事件。
- source_word: Initium uerborum orationis Ezrae
  choice: 以斯拉……祷告之言的开端
  rationale: 按拉丁文无谓语的题记式名词短语翻译，不补入“这是”。
theological_decisions:
- issue: adsumeretur 所指事件的性质
  choice: 被接去
  alternative: 被提上去／升天
  rationale: 拉丁文仅表达“被取去、被接去”，没有明确交代方向或事件性质；采用中性译法以保存神学与叙事上的含混。
- issue: 末句是正文还是编纂题记
  choice: 作为无谓语的题记式句子保留在正文
  alternative: 补译为“这是以斯拉……祷告之言的开端”
  rationale: 原文 Initium 开头的末句没有显式系词，形态上像编纂或抄写过渡语；保留其断片式、标题式特征。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“请”使汉语祈求句自然；末句刻意不补“这是”，以保存拉丁文题记式的无谓语结构。脚注标记均已置于正文。
