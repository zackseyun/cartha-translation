    issue: 末句中“以斯拉”与“祷告之言”的所属关系和“被接去以前”的修饰范围不清。
    rationale: 拉丁文 orationis Ezrae 明确是“以斯拉的祷告”，priusquam adsumeretur 则修饰以斯拉。原译的线性排列可被读作“以斯拉在被接去以前所祷告的话”，并不充分呈现题记原有的属格结构。
