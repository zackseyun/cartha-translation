  text: but I will rejoice over the formation of the righteous[a], and over their pilgrimage also, and their salvation, and the reception of their reward.
translation:
  language: zh_hans
  text: 但我要因义人的受造，也因他们寄居、得救并领受赏赐而欢喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plasma iustorum（由经审校的上下文补足）
  choice: 义人的受造
  rationale: “plasma”指被塑造、被造而成之事；译作“受造”既简洁，又保留造物主塑造人的含义，不把它具体化为“出生”或“身体”。
- source_word: peregrinationis
  choice: 他们的寄居
  rationale: 该词指在异乡暂居或尘世旅居的状态；“寄居”自然、庄重，并由上下文补出其所指为义人。
- source_word: saluationis
  choice: 得救
  rationale: 这里与义人的经历并列，译为“他们得救”所对应的名词性表达“得救”，比抽象的“救恩”更贴合具体所指。
- source_word: mercedis receptionis
  choice: 领受赏赐
  rationale: 保留“赏赐”与“领受”两层语义，避免只译作“报偿”而漏掉 receptionis。
theological_decisions:
- issue: “寄居、得救、领受赏赐”是否具体属于义人
  choice: 以“他们的”明确回指义人
  alternative: 不加所属关系，译成抽象的“寄居、救恩和领受赏赐”
  rationale: 拉丁语连续属格在语境中承接“义人”；汉语补出“他们的”可避免误解为泛指抽象概念。
- issue: plasma 的含义
  choice: 受造
  alternative: 塑造／形成
  rationale: “受造”保留神创造或塑造义人的神学向度，同时不额外限定为肉身形成、出生或属灵更新。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因……而欢喜”自然表达拉丁语 de 所引出的欢喜缘由；并列项保持简洁，避免过度解释其末世论内涵。
