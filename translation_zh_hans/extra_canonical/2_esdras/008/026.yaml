  yaml_path: translation/extra_canonical/2_esdras/008/026.yaml
  text: but upon those who have served you in truth[a]. Do not pay attention to the pursuits of those who act impiously,
translation:
  language: zh_hans
  text: 却要眷顾那些真诚事奉你的人。不要留意[a]行事不敬虔之人的图谋，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要顾念”。
    reason: adtendas 可指留意、关注，也可在此语境中理解为顾念或看重。
lexical_decisions:
- source_word: in veritate tibi servierunt（据本句开头残留的 -erunt 及上下文复原）
  choice: 真诚事奉你
  rationale: in veritate 直译为“在真实中”，在此修饰事奉，表达忠实、真诚地事奉；“真诚”自然通顺，同时不把它收窄为某一教义术语。
- source_word: adtendas
  choice: 留意
  rationale: 表示把注意力转向、关注或顾念；“留意”符合现代汉语，也避免译成带有“照料”意味的表达。
- source_word: impie agentium
  choice: 行事不敬虔之人
  rationale: 保留 agentium 的行为层面和 impie 的宗教伦理含义，不泛化为单纯的“恶人”。
- source_word: studia
  choice: 图谋
  rationale: 此处指这些人所热衷追求、筹划的事；“图谋”符合负面语境，但仍保留其行动意向。
theological_decisions:
- issue: in veritate 所表达的事奉性质
  choice: 真诚事奉你
  alternative: 按真理事奉你／忠实地事奉你
  rationale: 拉丁语可涉及真实、诚实或忠信。这里不强行判定为命题性的“真理”，采用“真诚”以保留祷告语境中的品格含义。
- issue: 神对不敬虔者 studia 的态度
  choice: 不要留意
  alternative: 不要顾念／不要关注
  rationale: 保留祈求式否定命令的张力，不将其解释成神全然不知道或无法察觉他们的行为。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“眷顾”与下句“留意”形成语义呼应；句末逗号保留原文片段尚未结束的状态，因为所给拉丁文本接着以 sed qui tua 引出对比分句。
