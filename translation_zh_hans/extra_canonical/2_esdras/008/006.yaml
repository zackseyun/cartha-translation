  text: O domine super nos, si permittes seruo tuo ut oremus coram te et des nobis semen cordis et sensui culturam unde fructum fiat, unde uiuere possit omnis corruptus qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/006.yaml
  text: O Lord over us[a], if you permit your servant to pray before you, and give us seed for the heart and cultivation for the understanding, from which fruit may come, by which every corruptible one may live[b],
translation:
  language: zh_hans
  text: 统管我们的主啊[a]，若你准许你的仆人，让我们在你面前祈求，并赐给我们心灵的种子和悟性的培育，从而结出果实，使每一个必朽的人都能借此存活[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主啊，你在我们之上。”
    reason: 拉丁文 O domine super nos 可作对主统治权的呼求；正文采用较自然的中文呼求语。
  - marker: b
    text: “必朽的人”或译“已败坏的人”；在此处与生命有关的语境中，更可能指会朽坏、会衰亡的人。
    reason: 拉丁文 corruptus 可指已败坏，也可在此类末世性语境中指必朽者。
lexical_decisions:
- source_word: semen cordis
  choice: 心田的种子
  rationale: 保留“种子—耕耘—果实”的连续农耕意象；加入“田”使现代汉语表达自然，同时不把“心”仅限于情感。
- source_word: sensui culturam
  choice: 悟性的耕耘
  rationale: sensui 指理解、领悟的能力；culturam 与前后的种子和果实构成耕作意象，故译为“耕耘”。
- source_word: omnis corruptus
  choice: 一切会朽坏的人
  rationale: 此处主要指必朽、会败坏的受造生命，而非道德上已经败坏的人；译文保留其必朽性含义。
- source_word: uiuere possit
  choice: 都能因此存活
  rationale: 表达 possit 的可能/能力语气，并以“因此”承接果实作为生命来源。
theological_decisions:
- issue: 单数“你的仆人”与复数 oremus 的张力
  choice: “准许你的仆人……祈求，使我们得着……”
  alternative: “准许你的仆人，使我们能在你面前祈求……”
  rationale: 拉丁文由单数 seruo tuo 转入复数 oremus，句法略显突兀。正文以自然汉语保留仆人代表群体祈求的意味，并在注释说明复数读法，避免完全抹平这一转换。
- issue: corruptus 的含义
  choice: 会朽坏的人
  alternative: 败坏的人
  rationale: 上下文关乎生命与必朽性；选择不带强烈道德定罪色彩的表达，同时以脚注保留另一种字面可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文未完句末的逗号，以反映本节与下文相连；保留种子、耕耘、果实的整体比喻，并以脚注呈现真实的词义与句法歧义。
