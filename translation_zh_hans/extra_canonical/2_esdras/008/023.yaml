  text: 'terribilis, cuius aspectus arefacit abyssos et indignatio tabescere facit montes et ueritas testificatur : Exaudi, domine, orationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/023.yaml
  text: 'terrible, whose appearance dries up the depths, and whose indignation makes the mountains melt, and whose truth bears witness: Hear, O Lord, the prayer'
translation:
  language: zh_hans
  text: 可畏者啊，你的面容使深渊干涸，你的愤怒使群山消融，你的真理作证：主啊，求你垂听这祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terribilis
  choice: 可畏者啊
  rationale: 按呼格理解，保留对上帝直接称呼的语气；译为“可畏者”既表达令人敬畏、惧怕之意，也不在此处擅自补入拉丁文未明说的“主”字。
- source_word: aspectus
  choice: 面容
  rationale: 此词可指外观、面貌或注视；“面容”在此拟人化颂赞语境中自然庄重，同时保留其所指究竟是容貌还是目光的部分张力。
- source_word: arefacit abyssos
  choice: 使深渊干涸
  rationale: 直译其使役结构；“深渊”对应复数 abyssos 的总体意象，汉语不必机械标出复数。
- source_word: indignatio
  choice: 愤怒
  rationale: 表达针对冒犯或不义而发的强烈怒气，不额外加入特定神学术语。
- source_word: tabescere facit montes
  choice: 使群山消融
  rationale: 保留使役结构；“消融”能体现 tabescere 所含逐渐融化、衰败的意象。
- source_word: ueritas testificatur
  choice: 你的真理作证说
  rationale: 保留原文中“真理”作为作证主体的特殊表达，并用“说”自然引出后面的祈求，不解释其具体作证内容。
- source_word: Exaudi, domine, orationem
  choice: 主啊，求你垂听这祷告
  rationale: “垂听”符合庄重祷告语体；“这祷告”自然表达上下文中正在献上的祈祷。
theological_decisions:
- issue: terribilis 的称呼对象及是否补出“主”
  choice: 译作“可畏者啊”
  alternative: 译作“可畏的主啊”或“可畏啊”
  rationale: 拉丁文此处只有形容词性呼格 terribilis；将其名词化为“可畏者”既符合汉语，也避免在原文首词处补入称号。后文 domine 则明确译作“主啊”。
- issue: “真理作证”的含义
  choice: 保留人格化而不阐释
  alternative: 译作“你的信实为你作证”或“真理证明这一点”
  rationale: 原文未明说真理为谁、为何事作证；直保其神学与修辞张力，避免把 ueritas 限定为“信实”或擅补宾语。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留原文连续呼告和宇宙性意象；“可畏者啊……主啊”体现拉丁文称呼推进，不添加宗派性解释。
