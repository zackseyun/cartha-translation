  language: zh_hans
  text: 他们教导得何等卓越！也不要向那些比野兽还不如的人发怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: splendide docuerunt
  choice: 他们教导得何等卓越
  rationale: splendide 作副词修饰 docuerunt，表示教导得出色、卓越；保留其感叹色彩，并避免误作形容教导内容的“辉煌”。
- source_word: Neque indigneris eis
  choice: 也不要向……发怒
  rationale: indignor 在此表达愤怒、恼怒；eis 是对象与格，现代汉语自然表达为“向……发怒”。
- source_word: qui bestiis peius sunt
  choice: 那些比野兽还不如的人
  rationale: peius 是比较级，配合 bestiis 表达“比野兽更糟”；“还不如”在现代汉语中自然且保留强烈贬义。
theological_decisions:
- issue: 是否加入“被认为/被判定”的被动判断含义
  choice: 不加入
  alternative: 那些被认为比野兽还不如的人
  rationale: 所提供的清理后拉丁文本只有 qui bestiis peius sunt，并无 iudicati；因此按当前源文本直译其状态描述，不从异文或旧注补入判断动词。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“何等卓越”承接片段开头的赞叹语气；后句用“还不如”清楚表达比较关系。所给文本似跨越句界，首句仍按源文保留。
