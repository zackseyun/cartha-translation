translation:
  language: zh_hans
  text: 在你面前行事虚假；但求你记念那些甘心敬畏你的人。[a]不要执意毁灭那些具有牲畜习性的人，[b]却要眷顾那些——你的律法……[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “甘心”也可译作“出于自己的意愿”；“敬畏你”所译原文直作“你的敬畏”，其中“认识”也可能含有“承认”的意思。
    reason: 说明 ex uoluntate 与 cognouerunt tuum timorem 的语义，并消除“你的恐惧”的歧义。
  - marker: b
    text: 原文直译为“有牲畜习性的人”；这是一个比喻性说法。
    reason: 保留 pecorum mores 的具体比喻，不扩展为“野兽”。
  - marker: c
    text: 现存所给拉丁文本在“你的律法”之后中断，句意未完。
    reason: 明确末句残缺，不把译者补文当作原文。
lexical_decisions:
- source_word: false conuersati sunt
  choice: 行事虚假
  rationale: conuersari 表示生活、行事或为人，false 表示虚假、不忠实；译为“行事虚假”既贴近拉丁文，也保持庄重自然。
- source_word: ex uoluntate
  choice: 甘心
  rationale: 表示出于意愿、自愿而为；“甘心”比机械的“按自己的意志”更符合现代汉语，同时保留主动自愿的意味。
- source_word: tuum timorem cognouerunt
  choice: 认识何为敬畏你
  rationale: timor 加属格意义上指向对上帝的敬畏，而非上帝自身感到的恐惧；cognouerunt 可指认识、承认。此译避免“认识你的恐惧”的歧义。
- source_word: Neque uolueris perdere
  choice: 不要执意毁灭
  rationale: 字面为“不要愿意毁灭”；汉语“不要执意毁灭”保留意志层面的表达，又较为自然。
- source_word: pecorum mores habuerunt
  choice: 行为如牲畜
  rationale: pecora 是牲畜、群畜，mores 是习性、品行；这里是对人的兽性行为所作的强烈比喻。
- source_word: respicias
  choice: 眷顾
  rationale: 可表示看顾、垂顾；祷告语境中“眷顾”自然、庄重，并不额外指定拯救等结果。
- source_word: qui legem tuam
  choice: 那些……你的律法的人
  rationale: 所给拉丁文本在关系从句中止于“你的律法”，缺少后续成分；译文以省略号保留残缺，不擅自补入“遵守”等动词。
theological_decisions:
- issue: tuum timorem 的语义关系
  choice: 敬畏你
  alternative: 你的敬畏／你的恐惧
  rationale: 这里自然指人对上帝的敬畏；译成“敬畏你”可避免误解为上帝所感受的恐惧。
- issue: 牲畜比喻是否弱化
  choice: 行为如牲畜
  alternative: 行为粗野／有兽性
  rationale: 保留原文 pecorum 的具体且尖锐的比喻，不将其抽象化或作教派性解释。
- issue: 残缺末句是否补全
  choice: 以省略号明确保留文本残缺
  alternative: 补作“遵守你律法的人”
  rationale: 原文片段止于 qui legem tuam，无法仅凭现有证据确定后续谓语；不应静默补足其神学或伦理含义。
translation_notes:
  register: 采用现代、庄重的祷告语体，以“求你记念”“眷顾”呈现对上帝的呼求。首句承接上文，因此保留其片段性质；末句严格按所给拉丁文本呈现中断，不擅自补足。
