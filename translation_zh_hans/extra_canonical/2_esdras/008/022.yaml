id: 2ES.8.22
reference: 2 Esdras 8:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: firmum et dicta perseuerantia, Cuius dispositio fortis et iussio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/022.yaml
  text: whose service turns to wind and fire[a], whose word is sure and whose sayings endure, whose ordering is strong and whose command is fearful[b],
translation:
  language: zh_hans
  text: 他们的职事化为风和火[a]；他的言语可靠，他所说的长存；他的安排有力，他的命令令人敬畏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文此处有 seruatio（“保存、守护”），但在天使的语境中通常按“职事”或“服役”理解；文本还用 conuertitur，意为“转变、化为”。本译文按上下文译出，同时保留这一文本疑难。
    reason: textual_variant
  - marker: b
    text: 较早的译法作：“他们的职事在风和火中。”
    reason: previous_rendering
lexical_decisions:
- source_word: seruatio / conuertitur
  choice: 职事化为
  rationale: 在天使的语境中，seruatio 的字面义“保存、守护”难以直接成立；结合 conuertitur“转变、化为”以及风与火的意象，译为“职事化为”既保留动作，也避免把疑难词伪装成毫无争议。
- source_word: firmum
  choice: 可靠
  rationale: 用于“言语”时表达坚定、确实、可信，比生硬的“坚固”更符合现代汉语。
- source_word: dicta perseuerantia
  choice: 他所说的长存
  rationale: 保留 dicta 与 perseuerantia 所表达的“所说之言持续、恒存”的意思。
- source_word: dispositio fortis
  choice: 安排有力
  rationale: dispositio 可指安排、部署或秩序；“安排”保留其宽泛性，fortis 直译为“有力”。
- source_word: iussio
  choice: 命令
  rationale: 准确表达权威性的吩咐或命令。
theological_decisions:
- issue: 前一分句与后续分句的指称转换
  choice: 前句用“他们的”，后句用“他的”
  alternative: 各句均用“他的”
  rationale: 前句在上下文中回指众天使，后续单数关系代词则指向上帝；中文明确区分，可保存拉丁文数的转换及其神学张力。
- issue: 风与火是职事所在还是职事所化成
  choice: “化为风和火”
  alternative: “在风和火中”
  rationale: 保留 conuertitur 所表达的转变动作，不将其弱化为静态方位关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他们的”与“他的”清楚呈现天使复数指称转为上帝单数指称；分号保持赞颂语句的并列节奏。
