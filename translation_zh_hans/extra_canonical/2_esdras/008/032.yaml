  text: For if you desire to have mercy on us, then you will be called merciful, for we are sinners.
translation:
  language: zh_hans
  text: 你若愿意怜悯我们，就会被称为有怜悯的，因为我们是罪人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desideraueris
  choice: 愿意
  rationale: 表达意愿与意向，符合此处条件句语境；比直译为“渴望”更符合现代汉语表达。
- source_word: nostri miserearis
  choice: 怜悯我们
  rationale: 准确传达 misereor 的施怜悯之意，并保留祈求者为受惠对象。
- source_word: misericors
  choice: 仁慈的
  rationale: 与前面的“怜悯”形成自然呼应，同时避免汉语中“被称为怜悯的”这一生硬说法。
- source_word: peccatores
  choice: 罪人
  rationale: 直接保留原文对说话者群体的道德与神学定性。
theological_decisions:
- issue: 上帝的“仁慈”与是否施行怜悯之间的条件性表述
  choice: 保留“若……就……”的句式
  alternative: 弱化为“当你怜悯我们时，人便称你为仁慈”
  rationale: 原文明确使用条件结构 si…tunc，不应替作者消解其中的神学张力。
- issue: “我们是罪人”在句中的逻辑关系
  choice: 以末尾原因从句呈现
  alternative: 按现存拉丁词序在句首另译为“因我们这些罪人，你已被称为仁慈的”
  rationale: 依据经审校的英文咨询层及修订说明，将 propter nos peccatores 的内容完整保留为原因说明，同时形成连贯完整的本节句子；现存拉丁片段首尾可能涉及断句或衔接问题。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“因为你若……”保留原文的论证连接与条件关系；不增添原文未明说的称呼者或教派性解释。
