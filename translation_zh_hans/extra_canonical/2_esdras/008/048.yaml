  text: But in this also you will be marvelous before the Most High,[a]
translation:
  language: zh_hans
  text: 但在这件事上，你在至高者面前也必显得奇妙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sed et in hoc
  choice: 但在这件事上……也
  rationale: 保留 sed 的转折和 et 的递进语气；hoc 指向上下文所述之事，译作“这件事”自然明确。
- source_word: mirabilis eris
  choice: 你……必成为奇妙的人
  rationale: mirabilis 表示令人惊奇、非同寻常；“奇妙的人”比现代汉语中的“可钦佩”更能保留其强烈的惊异色彩，也避免把含义缩减为道德称许。
- source_word: coram Altissimo
  choice: 在至高者面前
  rationale: 直译 coram 的临在与评判语境，并以“至高者”对应 Altissimus，保持尊称。
theological_decisions:
- issue: mirabilis 所表达的是受称许还是令人惊奇
  choice: 采用“奇妙的人”，保留较广的惊异、非凡含义
  alternative: “在至高者面前也必蒙称许”或“也必为至高者所赞赏”
  rationale: 拉丁文没有明确限定为道德赞许；不应把其神学张力收窄为单纯蒙神认可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“成为奇妙的人”略带超常色彩，切合启示文学语境，并忠实传达 mirabilis 的力度。
