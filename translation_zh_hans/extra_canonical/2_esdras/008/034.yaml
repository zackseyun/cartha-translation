source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid est enim homo, ut ei indigneris, aut genus corruptibile, ut ita amariceris de ipso.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/034.yaml
  text: For what is man, that you should be angry with him, or a corruptible race, that you should be so embittered against it?
translation:
  language: zh_hans
  text: 人算什么，你竟向他发怒？可朽坏的人类算什么，你竟如此怨恨他们？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homo
  choice: 人
  rationale: 泛指人或人类中的个体；用“人”既自然，也保留与后半句“人类”的递进关系。
- source_word: indigneris
  choice: 发怒
  rationale: 此处表示对人动怒、愤然以待；“发怒”符合现代汉语，并保持反问语气。
- source_word: genus corruptibile
  choice: 必朽坏的人类
  rationale: genus 指人类、族类，corruptibile 表示会败坏、会朽坏或必归败坏；“必朽坏”保留人的可朽性及败坏含义，不将其缩减为单纯道德上的“腐败”。
- source_word: amariceris
  choice: 愤懑
  rationale: 该词表达变得苦涩、恼恨或心怀强烈不悦；“如此愤懑”比直译为“苦毒”更符合现代汉语，同时保留其强烈而持续的负面情绪。
- source_word: de ipso
  choice: 对他们
  rationale: 拉丁文以单数形式回指作为集合整体的 genus；中文用复数“他们”自然地指向“人类”，但不改变集合性所指。
theological_decisions:
- issue: corruptibile 所指的是道德败坏还是必朽性
  choice: 译作“必朽坏”，保留身体必朽与受败坏辖制的双重可能
  alternative: “腐败的”或“必死的”
  rationale: 拉丁词可涉及易朽、会败坏，不宜只解释成道德腐败，也不宜只收窄为死亡。
- issue: amariceris 是否暗示上帝内在地变得苦毒
  choice: 译作“对他们如此愤懑”
  alternative: “如此苦待他们”或“对他们如此苦毒”
  rationale: 原文描述针对人类的强烈苦涩或恼恨状态；译文保留情感张力，同时避免引入行动层面的“苦待”，也避免现代汉语中“苦毒”的特殊宗教化色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留原文两个平行反问句。前句用单数“他”对应 homo，后句以“人类／他们”呈现 genus 的集合意义。
