  terminology: 以“可朽坏”译 corruptibile，保留其并非单指道德腐败、也不窄化为死亡的范围。以“如此怨恨他们”译 amariceris de ipso，表达苦涩而敌对的情绪状态，不误译为施加苦待的行动。
