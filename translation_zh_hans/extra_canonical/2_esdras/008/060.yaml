lexical_decisions:
- source_word: qui fecit eos
  choice: 那创造他们的那一位
  rationale: 拉丁文以关系从句承接上文；译文保留这种承接性，同时用“那一位”使现代汉语自然可懂，不擅自补出源文未明说的称号。
- source_word: ingrati fuerunt ei
  choice: 他们却忘恩负义，辜负了
  rationale: ingrati 表示不知感恩、忘恩；加入“辜负了”自然呈现其针对施恩者的关系含义。
- source_word: praeparauit eis uitam
  choice: 为他们预备生命
  rationale: 直译 praep aravit 与 vitam，保留“生命”所可能包含的今生、存活或更广义生命之含混，不解释为特定神学概念。
- source_word: iudicium meum modo adpropinquat
  choice: 我的审判如今临近了
  rationale: modo 在此取“如今”，adpropinquat 取“临近”，保留审判迫近的语气。
- source_word: Quod non
  choice: 这是我未曾……
  rationale: 所给拉丁文在 non 后中断；译文不凭后文补全，使用省略号明确保留残句状态。
theological_decisions:
- issue: 创造者与预备生命者是否应明确称为“上帝”或“至高者”
  choice: 不补称号，以“那一位”承接关系从句
  alternative: 译作“创造他们的上帝”或“至高者”
  rationale: 本段拉丁文本身只有关系代词 qui 及第三人称指称；补入神名会消除原文依赖上文的结构。
- issue: “生命”的具体所指
  choice: 保留为“生命”
  alternative: 解释为“今生”“永生”或“生路”
  rationale: 源文 vitam 未限定其神学范围，应保留其真实的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。开头保留其承接上文的关系从句性质；结尾用省略号反映所给拉丁文本的不完整状态。
