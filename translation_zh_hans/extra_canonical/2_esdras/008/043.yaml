  text: your rain in its time; and if it is ruined by the abundance of rain, it perishes. But man, who has been formed by your hands and is called your image
translation:
  language: zh_hans
  text: 你的雨水按时降下；若它因雨水过多而毁坏，它就消亡。然而，人是你亲手塑造的，而且……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现提供的拉丁文在 et（“而且／并且”）处中断；英文审校文本后接“被称为你的形象”，但这几个词不见于本段所给的拉丁文。
    reason: 说明底本文本在句中截断，并交代为何未将仅见于英文审校文本的后续措辞直接纳入正文。
lexical_decisions:
- source_word: pluuiam tuam in tempore
  choice: 你的雨水按时而降
  rationale: 拉丁文直译为“你按时的雨水”，在当前残缺句境中用“按时而降”补足汉语表达所需的自然谓语，同时不增添超出“雨在适当时候来到”的实质含义。
- source_word: corruptum fuerit multitudine pluuiae
  choice: 因雨水过多而毁坏
  rationale: 保留被过量雨水损坏的因果关系；“雨水过多”比生硬的“雨的众多”更符合现代汉语。
- source_word: Hoc perit
  choice: 这东西……也就消亡了
  rationale: Hoc是中性指示代词，而所给片段没有明确交代其所指；译作“这东西”以保留指称上的不确定性，不擅自确定为庄稼、种子或土地。
- source_word: manibus tuis plasmatus est
  choice: 是你亲手塑造的
  rationale: plasmatus含塑形、塑造之意；“亲手塑造”自然传达manibus tuis，并保留受造意象。
theological_decisions:
- issue: 是否收入英文咨询文本中的“被称为你的形象”
  choice: 不收入正文，并以省略号标示拉丁文在et（“并且”）处中断
  alternative: 按英文POB补译“并被称为你的形象”
  rationale: 所提供的拉丁文证据止于et，并不含“被称为你的形象”对应词语。依原文证据优先的原则，不用英文咨询层补齐当前来源未提供的内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这东西”有意保留拉丁文Hoc所指不明的状态；末尾省略号反映来源片段未完，不将后文静默补入。
