- from: 你的雨水按时而降；即使这东西因雨水过多而毁坏，也就消亡了。然而，人是你亲手塑造的，并且……[a]
  to: 你的雨水按时降下；若它因雨水过多而毁坏，它就消亡。然而，人是你亲手塑造的，而且……[a]
  rationale: 将让步式“即使”改为条件式“若”，并以“它”保留 hoc 的指代歧义。保留句末未完成的“而且……”及脚注，以如实呈现所提供拉丁文止于 et 的状态；不依据英文审校文本补足未见于该拉丁文片段的后文。
