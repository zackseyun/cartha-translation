  text: You nourished him with your righteousness, and instructed him in your law, and corrected him by your understanding.
translation:
  language: zh_hans
  text: 你以你的公义养育他，在你的律法中教导他，又以你的明辨责备他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enutristi
  choice: 养育
  rationale: 既保留“供养、培育”的基本意象，也符合人在受造后蒙上帝栽培的语境。
- source_word: tuae iustitiae
  choice: 以你的公义
  rationale: 拉丁语属格与动词的关系可表达所凭借或所供给的内容；译作“以你的公义”自然，并避免误读为仅处于某种状态。
- source_word: erudisti
  choice: 教导
  rationale: 准确表达使人受训、受教的含义，现代汉语清楚自然。
- source_word: in lege tua
  choice: 以你的律法
  rationale: 此处介词短语可指教导所依据或涉及的领域；“以你的律法教导”简洁地保留这种关系。
- source_word: corripuisti
  choice: 纠正
  rationale: 兼有责备并使之归正之意；“纠正”在本句中稳妥，不额外强化惩罚色彩。
- source_word: tuo intellectu
  choice: 以你的智慧
  rationale: intellectus 可指理解力、明智或洞察；用于上帝时，“智慧”比生硬的“理解力”更符合现代汉语，同时保留其明辨、洞察的内涵。
theological_decisions:
- issue: 上帝的公义与人的养育之间的关系
  choice: 译作“以你的公义养育他”
  alternative: “在你的公义中养育他”
  rationale: “以”较贴近此处公义作为养育所凭借或所赐内容的语义，也不将其解释成特定的称义教义。
- issue: intellectus 的神学语感
  choice: 译作“智慧”
  alternative: “理解”或“洞察”
  rationale: “智慧”在汉语宗教语境中自然庄重，又不把原词限缩为单纯认知能力；但原文所含的理解、洞察意味仍存在。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个分句保持平行结构“以……养育／教导／纠正”，对应拉丁原文的递进句法；不添加原文没有的神学限定。
