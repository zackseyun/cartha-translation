  yaml_path: translation/extra_canonical/2_esdras/008/063.yaml
  text: you have shown me a multitude of signs that you will begin to do in the last times[a], but you have not shown me at what time.”
translation:
  language: zh_hans
  text: 你已经向我显明了许多你将在末后的日子开始施行的征兆[a]，却没有向我显明是在什么时候。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你将在末后的时期施行的许多征兆。”这里的“开始施行”也可理解为单纯表示将来的“施行”。
    reason: 保留 in nouissimis 所省略名词的范围，以及 incipies facere 可能作为迂回将来表达的歧义。
lexical_decisions:
- source_word: multitudinem signorum
  choice: 许多征兆
  rationale: 自然表达数量众多的征兆；拉丁语无冠词，不强行译成特指的“那些征兆”。
- source_word: incipies facere
  choice: 将开始施行
  rationale: 贴近 incipies 的起始义及 facere 的行动义，同时保留其未来指向。
- source_word: in nouissimis
  choice: 在末后的日子
  rationale: nouissimis 为省略中心词的复数形式，按末世语境补出“日子”，但以脚注保留较宽泛的理解。
- source_word: quo tempore
  choice: 在什么时候
  rationale: 以现代汉语自然表达所问的具体时间。
theological_decisions:
- issue: 末世时间用语 in nouissimis 的范围
  choice: 末后的日子
  alternative: 末后的时期／末世
  rationale: “末后的日子”符合相关启示文学语境，又不把它限定为某一宗派性的末世时间表。
- issue: incipies facere 是否仅表示未来行动
  choice: 将开始施行
  alternative: 将要施行
  rationale: 正文保留拉丁文本明确的“开始”成分；脚注提示也可按迂回将来表达理解，避免过度确定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“显明”承接启示语境；“征兆”比“神迹”更中性，避免预先判断这些 signa 的性质。
