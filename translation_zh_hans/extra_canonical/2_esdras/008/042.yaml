  text: For if the farmer’s seed does not come up[a], for it did not receive,
translation:
  language: zh_hans
  text: 因为农夫的种子若没有长起来，那是因为它没有领受……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文在“没有领受”之后中断，因此句意未完整。另一较长的文本形态作：“没有按时领受你的雨水，或因雨水过多而毁坏。”
    reason: 说明现存拉丁文本的截断，并呈现较长文本形态的续文，但不将其并入正文。
lexical_decisions:
- source_word: Quoniam
  choice: 因为
  rationale: 保留原文开头的因果、论证连接，承接上一节的话。
- source_word: semen agricolae
  choice: 农夫所撒的种子
  rationale: 直译为“农夫的种子”在现代汉语中略显生硬；补出“所撒”符合农业语境，且不改变所指。
- source_word: si non ascenderit
  choice: 若没有长起来
  rationale: 在种子语境中，ascendere 指发芽后长出、长起来；“若”保留条件结构。
- source_word: non enim accepit
  choice: 那是因为它没有领受
  rationale: 保留 enim 的解释性因果关系以及 accepit 未明说宾语的状态，不擅自补入“雨水”等内容。
theological_decisions:
- issue: 残缺句中 accepit 的隐含宾语
  choice: 不补出宾语，以省略号显示现存文本在此中断
  alternative: 补作“没有按时领受你的雨水”
  rationale: 所给拉丁文只到 accepit，并未载明所领受之物；补入雨水虽可来自较长的文本形态或重构，却超出了本条原文证据。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为”保留与上文的论证联系；省略号明确呈现原文残缺，避免把后世重构或较长读法无标记地写入正文。
