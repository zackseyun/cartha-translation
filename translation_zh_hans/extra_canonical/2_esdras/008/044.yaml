  yaml_path: translation/extra_canonical/2_esdras/008/044.yaml
  text: called your image[a], because he has been made like you, through whom you formed all things, and you have likened him to the farmer’s seed. No, Lord
translation:
  language: zh_hans
  text: 被称作你的形象，因为他被造得与你相似；你为了他塑造了万物，又使他如同农夫的种子[a]。不，主啊——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文直译可作“你借着他塑造了万物”；但结合本书上下文及其可能反映的底层希腊文，此处也可理解为“你为了他塑造了万物”。
    reason: per quem 的拉丁文形式表面上容许工具性翻译，但本处须保留其可能的目的性/缘由性来源；正文采用与本段思想脉络相符、且不将人误作创造中介的读法。
lexical_decisions:
- source_word: tua imago nominatus
  choice: 被称为你的形像
  rationale: 保留 nominatus“被称为”及 imago“形像”的谓语结构；本节开头承接上文，中文也保留片段性质。
- source_word: similatus est
  choice: 被造得与你相似
  rationale: 拉丁文表达“被使成相似/被造成相似”；补出语境中指向上帝的“与你”，使现代汉语通顺。
- source_word: per quem omnia plasmasti
  choice: 你借着他塑造了万物
  rationale: 按现存拉丁文 per quem 的通常工具性读法直译；plasmasti 采用“塑造”，保留造物者成形、制作的意象。另以脚注保存可能反映底层希腊文目的性表达的读法。
- source_word: semini agricolae
  choice: 农夫的种子
  rationale: 直译属格结构，保留“种子属于农夫/供农夫播种”的简洁意象，不扩展为解释性措辞。
- source_word: Non, domine
  choice: 不，主啊——
  rationale: 保留否定词和呼格，并用破折号提示所给拉丁文本在此骤然中断。
theological_decisions:
- issue: per quem 所表达的人与创造万物之间的关系
  choice: 正文作“你借着他塑造了万物”
  alternative: “你为他塑造了万物”或“你为了他而塑造万物”
  rationale: 现存拉丁文 per quem 通常表示“借着谁”，故正文不擅自改写；但此读法可能令人理解为人是创造的中介，而相关语境及可能的底层希腊文可支持“为了谁”。脚注明确保留这一具有神学分量的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“形像”沿用经文语体中表示上帝之 image 的传统写法；句末破折号标明残句，不补入现存拉丁文没有的内容。
