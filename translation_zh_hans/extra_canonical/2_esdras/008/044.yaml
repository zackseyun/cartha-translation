  source_fidelity: “per quem”若孤立按现存拉丁文常可理解为“借着他”，但本句在《以斯拉二书》的上下文中表达世界为人而造；并且该拉丁文很可能保留了底层希腊文目的/缘由性结构的痕迹。正文译作“为了他”避免把人误作创造万物的中介。similasti eum semini agricolae 是“使他如同农夫的种子”，不只是修辞性的“把他比作”。
  naturalness: 原译整体庄重通顺，但“你借着他塑造了万物”在现代汉语中明确表示人是创造的媒介，既突兀也误导。“使他如同农夫的种子”更贴近原文动词，也自然。
  terminology: “形象”是现代标准汉语及当代中文圣经中较通行的对应语；“主啊”合宜。“塑造”可保留 plasmasti 的成形意象。
