  text: gloriam. Vobis enim apertus est paradisus, plantata est arbor uitae, paratum est futurum tempus, praeparata est habundantia, aedificata est ciuitas, probata est requies, perfecta est bonitas,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/052.yaml
  text: For paradise has been opened to you[a], the tree of life has been planted, the age to come has been prepared, abundance has been made ready, the city has been built, rest has been approved, goodness has been perfected,
translation:
  language: zh_hans
  text: 因为乐园已经向你们敞开，生命树已经栽种，将来的时代已经预备妥当，丰盛已经备齐，那城已经建成，安息已经得到认可，美善已经成全。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: paradisus
  choice: 乐园
  rationale: 对应拉丁语“paradisus”，沿用圣经语境中对末世福乐之园的常见称呼，且不额外限定其具体形态。
- source_word: futurum tempus
  choice: 将来的时代
  rationale: 直译其时间与时代含义，保留其末世指向，不简化为较含混的“未来”。
- source_word: habundantia
  choice: 丰盛
  rationale: 表达“充足、富足”的抽象状态，与后面的“已经备齐”自然搭配。
- source_word: probata est
  choice: 已经证实
  rationale: 保留“probare”所含的检验后确认、证明为真的意味；相较“获准”或“被指定”，更贴近拉丁词义，同时中文表达尚属自然。
- source_word: bonitas
  choice: 美善
  rationale: 兼顾“良善”和“美好”的含义，避免仅指道德品格。
theological_decisions:
- issue: “probata est requies”中安息被“证实”的具体含义
  choice: 安息已经证实
  alternative: 安息已经认可／安息已经验证
  rationale: 原文可有“经过检验而确认、认可”的语义张力；正文采用较宽泛的“证实”，不把它解释成行政性的批准，也不引入特定教义。
- issue: “futurum tempus”的末世含义
  choice: 将来的时代
  alternative: 来世／未来的日子
  rationale: 采用形式较贴近原文且神学上较中性的表达，不预先断定它仅指死后世界或某一特定末世阶段。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。保留原文一连串完成式被动结构所营造的应许已经预备齐全的节奏；为使中文自然，在“预备”和“丰盛”两处分别用“妥当”“备齐”避免机械重复。源文开头的“gloriam.”属于上一节末尾的残余词，不纳入本节正文。
