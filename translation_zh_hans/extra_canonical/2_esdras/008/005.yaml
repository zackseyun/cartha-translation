source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Conuenisti enim obaudire et profecta es nolens, non enim tibi est datum spatium nisi solum modicum uiuere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/005.yaml
  text: For you have consented to obey and have advanced unwillingly[a], for no span has been given to you except only a little while to live.
translation:
  language: zh_hans
  text: 因为你已经同意顺服，也不情愿地踏上了路[a]；因为赐给你的生存期限，不过短短一段时间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不情愿地启程了”。
    reason: 保留 profecta es 可直译为“启程、出发”的词义，并提示正文旅程性表达的另一种译法。
lexical_decisions:
- source_word: obaudire
  choice: 顺服
  rationale: 该词不仅指听见，也含听从、服从之意；“顺服”在此简洁地保留其意志与行动层面。
- source_word: profecta es
  choice: 踏上了路
  rationale: 这是 proficiscor 的完成时阴性形式，通常表示启程、出发；以“踏上了路”传达生命旅程的语境，又避免误译为单纯的“进步”或“前进”。
- source_word: spatium
  choice: 生存期限
  rationale: 这里指获准活着的一段有限时间，而非空间距离；“生存期限”自然地体现后文 vivere 的限定作用。
- source_word: nisi solum modicum
  choice: 不过短短一段时间
  rationale: 保留 nisi solum 的强限定语气，并用现代汉语自然表达 modicum 所指的短暂时限。
theological_decisions:
- issue: profecta es 所表达的生命旅程或离世意象
  choice: 踏上了路
  alternative: 离去了／前行了
  rationale: 原文可指启程或离去，具体所指带有语境张力；正文采用较开放的旅程表达，不将其限定为死亡，也不误作抽象的进展。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句首两个 enim 均以“因为”体现论证关系；第二处用分号区隔，以免中文句式拖沓。女性语法形式在普通话中无法自然显明，未额外补入“她”。
