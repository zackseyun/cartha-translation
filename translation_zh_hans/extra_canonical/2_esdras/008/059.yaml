  text: enim uos susipient quae praedicta sunt, sic eos sitis et cruciatus quae parata sunt. non enim altissimus uoluit hominem disperdi ; Sed ipsi qui creati sunt coinquinauerunt nomen eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/059.yaml
  text: For what has been foretold will receive you[a], but thirst and torments, which have been prepared, will receive them. For the Most High did not will that man should be destroyed; but they themselves, who were created, defiled his name.
translation:
  language: zh_hans
  text: 因为那预先预告的事必接纳你们[a]；但那已经预备好的干渴和种种苦刑必接纳他们。至高者原不愿人灭亡；然而，那些受造的人却玷污了他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有旧译：“不但如此，他们还践踏了他的义人。”这句话实际对应前一节的拉丁文，而不属于本节现存正文。
    reason: 说明英语 POB 所保留的 previous_rendering 的来源，同时避免把前一节的句子误作本节译文。
lexical_decisions:
- source_word: susipient
  choice: 必接纳
  rationale: 保留拉丁文“接纳、收受”的拟人化表达，并以“必”传达语境中的确定性。
- source_word: quae praedicta sunt
  choice: 那预先说过的
  rationale: 直译关系从句，保留其所指内容未被明确说明的含混性。
- source_word: sitis et cruciatus
  choice: 干渴和……种种苦刑
  rationale: sitis 译作“干渴”；cruciatus 为复数，用“种种苦刑”体现多重痛苦。
- source_word: disperdi
  choice: 灭亡
  rationale: 此处表示被毁灭、丧亡；“灭亡”自然庄重，也不额外限定肉体或终末意义。
- source_word: coinquinauerunt nomen eius
  choice: 玷污了他的名
  rationale: 按原文保留“使其名受污”的宗教伦理表达。
theological_decisions:
- issue: 至高者的意愿与人的灭亡
  choice: 至高者原不愿人灭亡
  alternative: 至高者并没有要毁灭人的意思
  rationale: 紧贴 non enim altissimus uoluit hominem disperdi，不将其扩展为特定的预定论或普救论主张。
- issue: 受造者自身的责任
  choice: 然而，那些受造的人却玷污了他的名
  alternative: 但受造者自己污辱了他的名
  rationale: 保留 sed ipsi 的转折与强调，呈现神的意愿和受造者行为之间的张力，不进一步解释因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“接纳”刻意保留原文略显突兀的拟人法；分号体现前后两组对象的对照。主文中的脚注标记[a]与脚注对应。
