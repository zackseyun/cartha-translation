revisions:
- from: 因此，在末后的日子，许多可悲的灾祸必临到世上的居民，因为他们一向极其骄傲地行事。但你要为自己明白，也要查问与你相似的人。
  to: 因此，许多悲惨的灾祸必临到那些在末后时代住在世上的人，因为他们一直极其骄傲地行事。但你自己要明白，并查问那些与你相似的人。
  rationale: 修订仅为澄清原文中时间短语所修饰的对象，并改善两处现代汉语表达。保留原文“许多”与悲惨强调、对世上居民的指称、骄傲行事的持续概括，以及对“与你相似的人”的未限定指称。英文审校记录中的脚注属于前一节旧译，且不对应本节所给拉丁文，故不设脚注。
