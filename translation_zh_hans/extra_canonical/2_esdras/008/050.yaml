  text: Propter quod miseriae multae miserabiles efficientur qui habitant saeculum in nouissimis, quia in multa superbia ambulaūerunt. Tu autem pro te intellege et de similibus tuis inquire
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/050.yaml
  text: Therefore many grievous miseries will come upon those who inhabit the world in the last times[a], because they have walked in great pride. But understand for yourself, and inquire concerning those like yourself.
translation:
  language: zh_hans
  text: 因此，许多悲惨的灾祸必临到那些在末后时代住在世上的人，因为他们一直极其骄傲地行事。但你自己要明白，并查问那些与你相似的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: miseriae multae miserabiles
  choice: 许多可悲的灾祸
  rationale: 保留原文“许多”以及同根词叠用所加强的悲惨意味，同时避免在中文中生硬重复“悲惨的悲惨”。
- source_word: qui habitant saeculum
  choice: 世上的居民
  rationale: saeculum在此指现今的世界或世代；结合habitant，译为“世上的居民”最自然。
- source_word: in nouissimis
  choice: 在末后的日子
  rationale: 拉丁文仅作“在末后的〔时候〕”，补出“日子”以符合现代汉语，同时保留末世时间指向。
- source_word: in multa superbia ambulauerunt
  choice: 一向极其骄傲地行事
  rationale: ambulare是闪语影响下表示生活行事的惯用语；完成时在此概括他们持续以来的行为。
- source_word: pro te intellege
  choice: 要为自己明白
  rationale: 较直接保留pro te的受益或关乎自身之意，不擅自改释为“认识你自己”。
- source_word: de similibus tuis inquire
  choice: 查问与你相似的人
  rationale: 保留similibus tuis所指对象的开放性，不具体限定为义人或同伴。
theological_decisions:
- issue: “与你相似的人”的身份
  choice: 保留为“与你相似的人”
  alternative: 你的同类／像你这样的义人
  rationale: 原文没有明说这些人的属灵身份；不根据上下文增添“义人”等神学限定。
- issue: 灾祸发生的时间
  choice: 在末后的日子
  alternative: 在末世
  rationale: “末后的日子”既表达in nouissimis的时间意义，又避免把原文压缩成带有较强体系色彩的术语。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“必临到”表达未来陈述；后半句保留对“你”的直接劝告及原文两项并列命令。英文咨询层所附脚注实际属于前一节旧译，并非本节拉丁文异读，因此不收入正文或脚注。
