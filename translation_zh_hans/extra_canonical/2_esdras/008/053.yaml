  text: wisdom has been perfected beforehand. The root has been sealed by you[a], weakness has been extinguished by you, and death has been hidden; Hades has fled, and
translation:
  language: zh_hans
  text: 智慧早已得以成全。根已被你们封印，软弱已被你们消灭，死亡[a]已被隐藏；阴间已经逃遁，并且……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡”是校勘本根据上下文补出的词。
    reason: 原文资料以方括号标示 mors，需说明其补订性质。
lexical_decisions:
- source_word: ante perfecta sapientia
  choice: 智慧早已成全
  rationale: 将 ante 理解为“预先、早已”，保留原文简短的完成时被动表达；不擅自补出施事者。
- source_word: Radix signata est
  choice: 根已被……封住
  rationale: 直译被动结构，并保留“根”这一未加解释的意象；signata 在此译作“封住”，不将其具体化为某种宗教印记。
- source_word: infirmitas extincta est
  choice: 软弱已被……消灭
  rationale: infirmitas 可指软弱、衰弱或病弱；“软弱”最能保留其宽泛含义，extincta 则表达彻底除去。
- source_word: infernus
  choice: 阴间
  rationale: 指死人所在之境，译作“阴间”比“地狱”更少引入后世刑罚观念，也符合本句拟人化的“逃遁”。
theological_decisions:
- issue: a vobis 的施事或分离含义
  choice: 被你们
  alternative: 从你们中／离开你们
  rationale: 在被动动词 signata est、extincta est 后，a vobis 最自然地标示施事者，即“被你们”；但这种说法在上下文中颇为突兀，因此以脚注保留另一种语义可能。
- issue: mors 是否属于可确定的原文
  choice: 正文译作“死亡”，并加脚注说明
  alternative: 省略“死亡”或在正文中用方括号标示
  rationale: 所据校勘文本以方括号补出 mors；其与 absconsa est 在语法和上下文上相合，但仍应向读者公开其补订性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。保留原文连续句末未完的状态，以“并且……”表示本节仍接下文；不采纳旧英译脚注中实属上一节的错位内容。
