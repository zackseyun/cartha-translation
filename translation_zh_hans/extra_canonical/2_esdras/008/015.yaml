  text: 'est tuo iussu, facili ordine, et utquid fiebat? Et nunc dicens dicam: de omni homine tu magis scis, de populo autem tuo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/015.yaml
  text: 'It is by your command[a], in an easy order, and why was it done? And now I will speak: concerning every man you know better, but concerning your people'
translation:
  language: zh_hans
  text: 这事是出于你的命令，以简易的秩序而成；它为什么会这样发生呢？现在我要开口说：论到每一个人，你比我更清楚；但论到你的子民……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节拉丁文到“你的子民”便中断，句意在下一节继续。
    reason: 说明源文的跨节未完句，避免读者误以为正文遗漏内容。
lexical_decisions:
- source_word: tuo iussu
  choice: 出于你的命令
  rationale: 准确表达夺格结构所指的依据或施行权柄，同时符合现代汉语表达。
- source_word: facili ordine
  choice: 按着简易的次序
  rationale: 保留 facilis 与 ordo 的基本含义；拉丁文在此语意略显突兀，因此不擅自具体化为“自然规律”或“轻而易举”。
- source_word: utquid fiebat?
  choice: 为什么要这样做呢？
  rationale: utquid 表示“为什么”，fiebat 可指事情被做成或发生；采用自然的汉语疑问句而不强行补出未明说的主语。
- source_word: dicens dicam
  choice: 我要开口说
  rationale: 原文是同源动词的加强式表达；“开口说”在自然汉语中略带郑重意味，又避免生硬直译为“说着我要说”。
- source_word: de omni homine
  choice: 论到每一个人
  rationale: 保留 omni 的逐一或全称范围，不将其窄化为某一类人。
- source_word: tu magis scis
  choice: 你比我更清楚
  rationale: magis 为比较表达；汉语需补出语境中隐含的比较对象“我”，方能自然传达说话者承认上帝所知更多。
- source_word: de populo autem tuo
  choice: 但论到你的子民……
  rationale: 保留 autem 的转折以及源文在此尚未完成的句法，不从下一节擅自补入哀痛等内容。
theological_decisions:
- issue: 上帝的命令与受造秩序之间的关系
  choice: 直译为“出于你的命令，按着简易的次序成就”
  alternative: 解释为“你一吩咐，一切便轻易而有秩序地形成”
  rationale: 源文的修饰关系并不完全明确；正文不将其明确解释成创造方式或神学命题，以保留文本张力。
- issue: “你的子民”之后未完成的思想
  choice: 以省略号保留未完句
  alternative: 从下一节补译“我为他们痛苦”
  rationale: 所给第15节拉丁文止于 de populo autem tuo；不跨节补文，也不加入比较级“我的痛苦更大”等源文没有的内容。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这一切”是为了承接拉丁文句首孤立的 est，使汉语成句；“但论到你的子民”刻意保留悬而未决的结构。
