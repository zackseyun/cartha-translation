  text: 'so also is the course of the present age: many indeed have been created[a], but few will be saved.'
translation:
  language: zh_hans
  text: 现今这个世代的进程也是如此[a]：被造的人固然多，但将得救的人却少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“现今这个世代的作为也是如此”。
    reason: 拉丁文 actus 可指“进程、运行”，也可指“作为／行为”。正文依上下文的结构性类比采用“进程”，脚注保留英文审校记录中的另一词义可能。
lexical_decisions:
- source_word: actus praesentis saeculi
  choice: 现今这个世代的进程
  rationale: actus在此为单数，结合上下文的类比，指这个世代的进程、情形或运行方式，而非人的道德行为；praesentis saeculi译为“现今这个世代”，保留时间与时代意味。
- source_word: Multi quidem creati sunt
  choice: 被造的人固然多
  rationale: 将隐含的人类对象明示为“人”，以符合现代汉语表达；被动式“被造”保留受造含义，quidem用“固然”体现与后句的转折配对。
- source_word: pauci autem saluabuntur
  choice: 但得救的人却少
  rationale: 保留将来被动式所表达的“将得救”之结果指向；汉语中以“得救的人却少”自然表达，并用“但……却……”再现autem的对比。
theological_decisions:
- issue: 受造者众多与得救者稀少之间的张力
  choice: 直译为“被造的人固然多，但得救的人却少”
  alternative: 将“得救”解释为某一特定宗派意义上的救恩范围或预定论结论
  rationale: 原文只陈述数量对比，并未说明其机制、条件或系统神学含义，因此保留张力，不作教派化阐释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“进程”准确承接上下文中的结构性类比，避免“行为”可能引出的道德行动误读。
