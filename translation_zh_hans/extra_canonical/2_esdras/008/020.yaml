  text: 'Et dixit : domine qui inhabitas seculum, cuius oculi elati et superiora in aerem, Cuius thronus inextimabilis et gloria incon-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/020.yaml
  text: And he said[a], “Lord, you who inhabit eternity, whose eyes are exalted and whose heights are in the air,
translation:
  language: zh_hans
  text: 他说：“主啊，你住在永恒中；你的眼目高举，你的高处在空中；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inhabitas seculum
  choice: 住在永恒中
  rationale: seculum 在此语境指永恒或永世；以“住在永恒中”保留居住意象，并采用自然庄重的现代汉语。
- source_word: oculi elati
  choice: 眼目高举
  rationale: 保留 elati 的被举高、崇高之意，不擅自补入“观看”等原文没有的动作。
- source_word: superiora in aerem
  choice: 高处在空中
  rationale: superiora 与 oculi 平行，宜理解为属于主的高处，而非眼目所观看的宾语；“高处”比“楼阁”更贴近现存拉丁文本，并保留其可能指天上居所的含义。
- source_word: Et dixit
  choice: 他说
  rationale: 按拉丁文直接译出叙事引语公式；具体所指由上下文确定。
theological_decisions:
- issue: superiora 是否指上层楼阁或泛指高处
  choice: 高处
  alternative: 上层楼阁
  rationale: “上层楼阁”可反映可能的希腊语及闪语背景，但拉丁 superiora 本身较宽泛；正文采用“高处”以避免过度限定。
- issue: seculum 的时间含义
  choice: 永恒
  alternative: 世代／世界
  rationale: 在对上帝居所的呼告中，“永恒”最符合语境，也与句中宇宙性尊称协调，但不扩展为额外的教义陈述。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。原始引文在 gloria incon- 处截断；本节所给英文咨询文本也只译至此前一个完整分句，因此译文保留未完句式，以分号结尾，不补译残缺词。
