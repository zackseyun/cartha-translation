translation:
  language: zh_hans
  text: 败坏归于遗忘。痛苦已经过去，而且已经显明了……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corruptio
  choice: 败坏
  rationale: 既可涵盖腐朽、毁坏的状态，也保留该词可能具有的道德与受造界层面的含义。
- source_word: in obliuionem
  choice: 归于遗忘
  rationale: 按方向性短语直译，表达败坏被带入或落入遗忘之中，不擅自补出拉丁文本未明说的动词。
- source_word: dolores
  choice: 痛苦
  rationale: 自然概括身体或心灵的痛楚，保留复数所表达的各种苦楚。
- source_word: Transierunt
  choice: 已经过去
  rationale: 准确表达完成时态，指痛苦已经消逝。
- source_word: ostensus est
  choice: 所要显明的也已经显明
  rationale: 拉丁语为阳性单数被动完成式，但本片段未保留其主语；中文采用无明确名词先行项的结构，以免擅自补足下文或失落文本中的主语。
theological_decisions:
- issue: ostensus est 的隐含主语
  choice: 不补出具体事物，以“所要显明的”保留悬而未决的指代
  alternative: 译作“它也已经显明”或依据后续传统文本补作“永生的宝藏已经显明”
  rationale: 所给拉丁片段只有阳性单数谓语，缺少明示主语；补出具体神学对象会超出本节提供的原文证据。
- issue: corruptio 的意义范围
  choice: 译作“败坏”
  alternative: 译作“腐朽”或“腐败”
  rationale: “败坏”能同时容纳朽坏与更广泛的堕落意味，不把原文限定为纯物质腐烂或纯道德腐败。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文片段式边界：首句缺少显式动词，末句缺少明示主语并显然尚待后文承接，因此以省略号提示语意未完，而不从其他见证中补文。
