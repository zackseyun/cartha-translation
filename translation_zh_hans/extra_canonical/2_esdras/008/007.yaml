  text: will bear the place of a man. For you alone are one[a], and we are one thing formed by your hands, as you have spoken.
translation:
  language: zh_hans
  text: 将承担人的位置[a]。因为唯有你是独一的；我们是你手所塑成的一个造物，正如你所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有古译本证据显示，“人的位置”背后的原文或为“人的形像”。
    reason: 说明 locum 可能反映早期传抄误读，并将说明锚定在相关词语上。
lexical_decisions:
- source_word: portabit
  choice: 将承担
  rationale: 保留拉丁文将来时和“承受、承担”的基本语义；因本节是承接上文的句段，不擅自补出主语。
- source_word: locum hominis
  choice: 人的位置
  rationale: 按现存拉丁文本直译为“人的位置”；虽有据推测其背后希腊文可能是“人的形像”，但所给拉丁底本明确作 locum，故将异文问题收入脚注。
- source_word: Solus enim es, et una plasmatio nos sumus
  choice: 因为唯有你是一体的，而我们都是……同一造物
  rationale: 原句结构紧缩且语义有张力；把 solus 与 una 的呼应译出，同时将 plasmatio 理解为被塑造之物，而非塑造这一动作。
- source_word: manuum tuarum
  choice: 你双手所塑成的
  rationale: 结合 plasmatio 的塑造含义，用自然汉语表达“你双手的塑成之物”，不另加“工作”等底本没有的名词。
- source_word: sicut locutus es
  choice: 正如你所说的
  rationale: 贴近拉丁文，并保留其可能指向先前神谕或经文的开放性。
theological_decisions:
- issue: Solus enim es, et una plasmatio nos sumus 中“一”的所指
  choice: 译作“唯有你是一体的……我们都是……同一造物”
  alternative: “唯独你存在，而我们同是你双手所塑成的”
  rationale: 保留原文 solus/una 的重复和神学张力，不将其明确解释为神的独一性、合一性或人类共同本性中的某一种。
- issue: locum 与推定希腊底本的关系
  choice: 正文遵从拉丁文“位置”
  alternative: 正文作“人的形像”
  rationale: 现有指定原文证据为拉丁文 locum；推定的希腊文 typon 虽可能由旁证支持，却不宜无标记地取代现存底本文字。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留本节作为上文续句的残缺感，不擅自补出“谁”作主语；“塑成”“造物”体现 plasmatio 的造物语境。
