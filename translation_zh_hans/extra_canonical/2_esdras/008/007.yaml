- from: 将承担人的位置。因为唯有你是一体的[a]，而我们都是你双手所塑成的同一造物，正如你所说的。
  to: 将承担人的位置[a]。因为唯有你是独一的；我们是你手所塑成的一个造物，正如你所说的。
  rationale: 修正 solus 的误译，并以较自然的现代书面汉语重组 una plasmatio nos sumus，同时保留其集体单数和“一”的表达。正文依指定拉丁底本保留“人的位置”；脚注仅以审慎措辞交代可支持“人的形像”的古译本证据，避免将推定复原读法无标记地置入正文。
