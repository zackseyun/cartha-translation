  text: plants[a], but not everything that has been sown will be saved in its time, nor will everything that has been planted take root; so also those who have been sown in the world will not all be saved.” And I answered and said, “If I have found favor before you, let me speak.”
translation:
  language: zh_hans
  text: 栽种；但所撒下的，不都会到时候得救；所栽下的，也不都会扎根。同样，那些被撒在世上的人，也不会全都得救。”我回答说：“我若在你面前蒙恩，请容我说。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plantat
  choice: 栽种
  rationale: 本节拉丁文本承接上节，以动词开头；保留这种不完整的承接结构，不擅自补入“农夫”等主语。
- source_word: saluabuntur
  choice: 得救
  rationale: 同一动词在农业比喻和指人时重复出现；统一译为“得救”，保留原文刻意形成的词义张力与神学关联。
- source_word: in tempore
  choice: 在各自的时候
  rationale: 贴近“在其时候”的含义，并使现代汉语较为自然；不解释成“适当的时候”，以免额外引入评价意味。
- source_word: radicabunt
  choice: 扎根
  rationale: 准确传达植物生根的意象，且符合现代汉语习惯。
- source_word: in saeculo
  choice: 在世上
  rationale: saeculum 此处可指世界或时代；上下文以人被撒播于其生存领域为喻，“世上”自然且与咨询层一致，但以脚注保留“时代中”的可能。
- source_word: si inueni gratiam coram te
  choice: 我若在你面前蒙恩
  rationale: 采用庄重而通行的请愿表达，保留 coram te 的关系性措辞。
- source_word: loquar
  choice: 请容我说
  rationale: 拉丁语虚拟式在条件句后表达请求许可；译成礼貌请求比直陈“我就说”更符合语用。
theological_decisions:
- issue: 农业对象与人都使用 saluabuntur
  choice: 两处均译为“得救”
  alternative: 前一处译为“存留”，后一处译为“得救”
  rationale: 原文重复同一拉丁动词，显然借农业意象连接人的终局；统一译法可保存这种不寻常但重要的张力，不替作者消解。
- issue: in saeculo 的范围
  choice: 正文译为“在世上”
  alternative: “在时代中”或“在今世中”
  rationale: “世上”最符合本句播种意象和现代汉语表达，同时不把 saeculum 限定为某一神学化的“今世”；异译列入脚注。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语。刻意保留开头“栽种”的承接性和两次“得救”的重复，不补出原文没有的农夫或种子数量。引号标明前一位说话者的话在本节结束，随后转入叙述者回应。
