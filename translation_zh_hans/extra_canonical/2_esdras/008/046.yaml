  text: 'Et respondit ad me et dixit: quae sunt praesentia praesentibus et quae futura futuris. Multum enim tibi restat ut'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/046.yaml
  text: And he answered me and said[a], “What is present is for the present, and what is future is for the future.
translation:
  language: zh_hans
  text: 他回答我说：“现今的事，是为现今的人；将来的事，是为将来的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae sunt praesentia
  choice: 现今的事
  rationale: 将中性复数关系表达译为概括性的“事”，既自然，也保留“现今存在之事”的含义。
- source_word: praesentibus
  choice: 现今之人
  rationale: 按与 futuris 平行的与格复数理解为“给现今之人”，避免把它直接化约为抽象的时间阶段。
- source_word: quae futura
  choice: 将来的事
  rationale: 原文省略与前半句相应的系词，中文补出“事”，使平行结构清楚而不增加解释。
- source_word: futuris
  choice: 将来之人
  rationale: 按与格复数译作将来时代的人，与“现今之人”形成原文的末世性对照。
theological_decisions:
- issue: praesentibus 与 futuris 所指的是人群还是时期
  choice: 正文译为“现今之人／将来之人”
  alternative: “现今的事属于现今，将来的事属于将来”
  rationale: 两个词在拉丁文中均为复数与格，较自然地可指相应时代的人；但其形式也容许较抽象的理解，因此在脚注保留另一种译法，不把文本的张力完全消除。
translation_notes:
  register: 采用庄重而通顺的现代汉语，以“现今……将来……”重现原文紧密的平行结构。所给拉丁文本末尾的“Multum enim tibi restat ut”是下一节开头的不完整片段，未纳入本节正文。
