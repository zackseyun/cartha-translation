  yaml_path: translation/extra_canonical/2_esdras/008/016.yaml
  text: which causes me pain[a], and concerning your inheritance, for which I mourn, and concerning Israel, for whom I am sorrowful, and concerning the seed of Jacob,
translation:
  language: zh_hans
  text: 这使我痛苦；我为你的产业哀恸，为以色列忧伤，也为雅各的后裔[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“雅各的后裔”之后接续到下一节；本节的拉丁文在此处结束，相关谓语在下一节才出现。
    reason: 保留本节末尾跨节悬置的句法，不把下一节的谓语提前补入正文。
lexical_decisions:
- source_word: quod mihi dolet
  choice: 这使我痛苦
  rationale: 保留关系从句承接上一节所指对象的功能；拉丁文直译为“这使我痛苦”。
- source_word: hereditate tua
  choice: 你的产业
  rationale: “产业”自然保留 hereditas 所含继承所得、归属之民的经文语义。
- source_word: propter quam lugeo
  choice: 我也为……哀恸
  rationale: lugeo 表示哀悼、哀恸；中文以介词结构清楚关联阴性先行词 hereditate。
- source_word: propter quem tristis sum
  choice: 为以色列忧伤
  rationale: tristis sum 是“感到忧伤”；避免与较强的哀悼动词 lugeo 完全合并。
- source_word: semine Iacob
  choice: 雅各的后裔
  rationale: semen 在族裔语境中指后代；“后裔”比字面的“种子”自然准确。
theological_decisions:
- issue: “你的产业”所指为何
  choice: 保留“你的产业”这一称谓，不解释为特定群体
  alternative: 明确译为“你的子民”或“以色列”
  rationale: 原文随后另提以色列和雅各的后裔；直译可保留这些称谓之间可能重叠而未被明说的关系。
- issue: 末句的情感谓语是否属于本节
  choice: 依据所给本节拉丁文本，以“并为雅各的后裔悲痛”补明并列结构所承载的情感，但加注说明严格句法
  alternative: 仅译“以及雅各的后裔，”并将谓语留待下一节
  rationale: 拉丁文本在 et de semine Iacob 后截断，严格说本节没有为该短语提供显式谓语；然而中文若机械悬置极不自然。脚注保留跨节句法和文本分界信息。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“产业、哀恸、后裔”等常见经文词汇保持尊严感，同时避免古奥句式。三个 de 短语按中文自然并列处理；分号显示开头承接上一节，脚注说明结尾跨节。
