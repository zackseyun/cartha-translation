source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in veritate enim nemo de genitis est qui non impie gessit, et de confitentibus qui non deliquit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/035.yaml
  text: For truly there is no one among those born who has not acted impiously[a], and among those who confess, no one who has not sinned.
translation:
  language: zh_hans
  text: 因为确实，凡生而为人的，没有一个不曾以不敬虔的方式行事；凡存活于世的，没有一个不曾犯罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文作“那些承认（或宣认）的人”；多种古代译本所反映的读法则是“那些存在的人”，可能保存了较早的原文。
    reason: 说明现存拉丁传本的 confitentibus 与子译本共同支持的 consistentibus 之间的重要文本异读，并交代正文采用后者。
lexical_decisions:
- source_word: in veritate enim
  choice: 因为事实上
  rationale: 既表达 enim 的承接因果，也以自然庄重的现代汉语传达 in veritate 的强调语气。
- source_word: de genitis
  choice: 凡生而为人的
  rationale: 按语境指所有出生的人；此译法比直译“被生的”自然，并与后半句形成普遍性平行。
- source_word: impie gessit
  choice: 行恶
  rationale: 表示以不敬虔、邪恶的方式行事；“行恶”简洁自然，同时保留道德与宗教层面的负面含义。
- source_word: de confitentibus
  choice: 凡存活于世的
  rationale: 现存拉丁文作 confitentibus（承认、宣认者），但多种古代子译本共同支持 consistentibus（存在者、活着的人），且与 de genitis 构成严整平行，因此正文采用文本校勘后的读法。
- source_word: deliquit
  choice: 犯罪
  rationale: 准确表达犯错、犯罪之义，并与前半句“行恶”保持词义上的递进与变化。
theological_decisions:
- issue: 经文是否断言所有人普遍行恶并犯罪
  choice: 保留两个“没有一个未曾”的绝对陈述
  alternative: 弱化为“大多数人都曾”
  rationale: 拉丁文两次使用 nemo ... qui non，明确表达无一例外；不应为缓和神学张力而削弱。
- issue: confitentibus 的文本问题
  choice: 正文据子译本证据校订为“存活于世的”
  alternative: 按现存拉丁文译作“承认的人”或“宣认的人”
  rationale: 叙利亚文、埃塞俄比亚文、阿拉伯文和亚美尼亚文的共同见证支持 consistentibus；该读法也更能解释与“生而为人的”之间的平行。脚注保留现存拉丁读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“凡生而为人的／凡存活于世的”形成平行；句末设置文本校勘脚注，不在正文中掩盖传本差异。
