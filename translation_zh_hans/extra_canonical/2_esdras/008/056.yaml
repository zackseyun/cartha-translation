  text: to inquire about the multitude of those who perish. For they too[a], having received freedom, despised the Most High and his law
translation:
  language: zh_hans
  text: 去查究那些灭亡者人数众多的事。因为他们也领受了自由，藐视了至高者和他的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inquirendo
  choice: 去探究
  rationale: 拉丁文为动名词夺格，语法上承接前文；用“去探究”保留其目的或所涉行动的衔接性，不擅自补足主句。
- source_word: multitudine eorum qui pereunt
  choice: 那许多灭亡之人
  rationale: multitudo 表示人数众多；qui pereunt 是“正在灭亡／走向灭亡的人”。译文以自然汉语表达其群体之多，同时保留“灭亡”的神学力度。
- source_word: libertatem
  choice: 自由
  rationale: 原词本身是“自由”，未明确限定为“自由意志”或其他神学术语，因此不作教派化扩展。
- source_word: spreuerunt
  choice: 藐视
  rationale: 该词表示轻蔑、弃绝或不放在眼里；“藐视”既贴近语义，也能自然地同时支配“至高者”和“他的律法”。
- source_word: altissimum
  choice: 至高者
  rationale: 按其称号含义直译，并采用现代中文宗教语境中庄重而通行的表达。
theological_decisions:
- issue: “领受自由”是否应解释为自由意志
  choice: 保留为“自由”
  alternative: 译作“自由意志”或“选择的自由”
  rationale: 拉丁文 libertatem 没有明说“意志”；保留较宽泛措辞，可避免把特定神学体系带入文本。
- issue: qui pereunt 的时态体意义
  choice: 译作“灭亡之人”
  alternative: “已经灭亡的人”或“正在走向灭亡的人”
  rationale: 拉丁文现在时可表达正在发生或作为类别特征的灭亡；简洁的“灭亡之人”保留这种范围，不强行确定时间阶段。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。首句保留原文承接上文的片段性质；不沿用英文旧脚注，因为该脚注所引旧译属于错位经文，与本节拉丁文无对应关系。
