  text: but to those who have kept your covenants with sorrows. Do not think on those who have conducted themselves falsely before you,
translation:
  language: zh_hans
  text: 却要顾念那些在痛苦中持守了你诸约的人。不要顾念那些在你面前行事诡诈的人，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testamenta
  choice: 你诸约
  rationale: 拉丁文为复数，指上帝所立的约；译作“诸约”保留数的形式，也避免“遗嘱”在现代汉语中的误解。
- source_word: cum doloribus
  choice: 在痛苦中
  rationale: cum 表示伴随情形；“在痛苦中”自然表达持守诸约时伴随着痛苦，同时不把它强解为工具或原因。
- source_word: custodierunt
  choice: 持守了
  rationale: 体现谨守、守护并忠于所立之约的含义。
- source_word: cogites
  choice: 顾念
  rationale: 在向上帝祈求的语境中，既表达“想到”，也表达带有关注和眷顾意味的记念。
theological_decisions:
- issue: testamenta 的圣约含义与复数形式
  choice: 你诸约
  alternative: 你的约
  rationale: 选择保留拉丁文复数，不将不同约的关系归并为单数，也不引入特定的圣约神学体系。
- issue: cum doloribus 所表达的痛苦与持守之间的关系
  choice: 在痛苦中持守
  alternative: 借着痛苦持守／带着忧伤持守
  rationale: 原文只明确伴随关系；“在痛苦中”保留其开放性，不把痛苦解释为持守的手段，也不把 dolores 限定为内心忧伤。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“却要顾念……不要顾念……”保留祈祷中的对照和平行结构；末尾逗号表明原句在下一节或后续文本中尚未完结。
