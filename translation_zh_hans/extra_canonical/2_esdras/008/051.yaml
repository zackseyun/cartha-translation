  text: But understand for yourself[a], and seek glory among those like you.
translation:
  language: zh_hans
  text: 但你自己要明白，并寻求那些和你相似之人的荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些和你相似之人的荣耀”直译为“关于／有关与你相似者的荣耀”。拉丁语 de similibus tuis 与“寻求荣耀”的关系可理解为关于、在……中，或为……；也可译作“在与你相似的人中寻求荣耀”或“为与你相似的人寻求荣耀”。
    reason: 拉丁语 de 的句法关系并不完全确定；脚注保留歧义，避免正文武断限定为范围义或受益义。
lexical_decisions:
- source_word: tu autem
  choice: 但你
  rationale: 保留 autem 的转折作用，并突出对受话者“你”的直接劝告。
- source_word: pro te intellege
  choice: 要为自己领悟
  rationale: intellege 是“明白、领悟”的命令式；pro te 保留为“为自己”，不擅自扩展为特定的教义含义。
- source_word: de similibus tuis
  choice: 在与你相似的人中
  rationale: 按 de 的范围或关联用法译出，并与审定后的英文咨询文本一致；同时以脚注保留“关于／为”的句法可能。
- source_word: inquire gloriam
  choice: 寻求荣耀
  rationale: inquire 表示寻求、探求，gloriam 直译为“荣耀”，保持原文措辞及其含义张力。
theological_decisions:
- issue: 荣耀与“与你相似的人”的关系
  choice: 在与你相似的人中寻求荣耀
  alternative: 为与你相似的人寻求荣耀／探求与你相似之人的荣耀
  rationale: 拉丁语 de 可表达范围、来源或论及对象，句法关系并非完全单一；正文采用较自然且符合审定咨询层的范围义，脚注提示其他可能，避免把荣耀的受益者武断确定下来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领悟”较“理解”更适合劝诫语境；全句保留原文简洁的命令语气。未收入旧英译脚注所引的长句，因为该句属于前一节的错位译文，并非本节的文本异读。
