  yaml_path: translation/extra_canonical/2_esdras/008/024.yaml
  text: Hear[a], Lord, the prayer of your servant, and give ear to the petition of your creature; pay attention to my words. For while I live I will speak, and while I have understanding I will answer.
translation:
  language: zh_hans
  text: 主啊，求你垂听你仆人的祷告，侧耳听你所造的人的祈求；留心听我的话。因为趁着我仍活着，我就要说话；趁着我尚有悟性，我就要回答。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: serui tui
  choice: 你仆人的
  rationale: 忠实保留属格关系及祈祷语境中的谦卑自称。
- source_word: auribus percipe
  choice: 侧耳听
  rationale: 按拉丁文的听觉意象译为自然、庄重的汉语祈祷用语，避免生硬直译为“用耳朵领受”。
- source_word: figmenti tui
  choice: 你所造之人
  rationale: figmentum 指被塑造、被造之物；此处说话者指自己，译为“所造之人”既保留受造含义，也符合现代汉语。
- source_word: intende uerba mea
  choice: 留心听我的话
  rationale: intende 表示专注、留意；补出“听”使汉语自然，并承接前文的听觉语义。
- source_word: Dum enim uiuo
  choice: 因为我一息尚存
  rationale: 表达“只要仍活着”的持续条件，同时保持祈祷文的庄重语气。
- source_word: dum sapio
  choice: 只要我还有理智
  rationale: sapio 在此指具有理解、判断或清醒思考的能力；“还有理智”自然且不把含义缩窄为智慧。
- source_word: respondeam
  choice: 就要回答
  rationale: 保留 respondeo 的基本义“回答”，不擅自改作“申辩”或“回应祷告”。
theological_decisions:
- issue: figmentum 所表达的人与创造者的关系
  choice: 你所造之人
  alternative: 你的受造物／你所塑造的
  rationale: “所造之人”保留受造者对创造者的谦卑，又避免“受造物”可能产生的非人格化感觉；原文并未进一步说明创造方式。
- issue: sapio 的心智能力含义
  choice: 我还有理智
  alternative: 我尚能明白／我有智慧
  rationale: 原文可涵盖理解与判断能力；选择较宽泛的“理智”，避免把它神学化为特殊智慧。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷文体。“垂听”“侧耳听”保留经文语感，但整句结构遵循现代普通话；两个 dum 分句以“一息尚存”和“只要……还有……”表达持续条件。
