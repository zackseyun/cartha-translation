  source_fidelity: 草稿完整涵盖拉丁文各分句，并将 figmenti tui 恰当地理解为祈祷者作为上帝所造者的自称；但遗漏了本节祈祷对象“主啊”（英语审校轨迹亦明确保留 Lord），使呼求对象未在译文中明示。
  naturalness: 整体庄重自然。“一息尚存”“侧耳听”符合现代汉语经文语体。末句改为“趁着……尚有悟性”更贴近两个 dum 分句的平行时间/持续条件，也避免“就要”带来的条件结果语气。
  terminology: “仆人”“祷告”“所造的人”均合宜。“悟性”可自然涵盖 sapio 此处的理解、明辨能力，不将其限定为抽象“理智”或特殊属灵智慧。
