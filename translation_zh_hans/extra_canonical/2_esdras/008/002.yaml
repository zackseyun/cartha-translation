  text: Dicam autem coram te similitudinem, Ezra. quomodo autem interrogas terram et dicet tibi quoniam dabit terram multam magis unde fiat fictile, paruum autem puluerem unde aurum fit,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/002.yaml
  text: But I will set forth a comparison before you[a], Ezra. Just as, if you ask the earth, it will tell you that it yields much clay, from which earthen vessels are made, but little dust from which gold comes[b],
translation:
  language: zh_hans
  text: 但以斯拉啊，我要在你面前举一个比喻[a]：正如你若问大地，它会告诉你：它出产多得多的泥土，可用来制成陶器；却只出产少量尘土，金子由此炼成[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要告诉你一个比喻。”
    reason: dicam similitudinem 可作较直接的表达；正文保留 coram te“在你面前”。
  - marker: b
    text: 直译：“（它出产）少量尘土，金子由此而成。”
    reason: 拉丁文 unde aurum fit 指金子由该尘土而成；“多得多”与“少量”保留 magis 所强调的数量反差。
lexical_decisions:
- source_word: Dicam autem coram te similitudinem
  choice: 但……我要在你面前讲一个比喻
  rationale: 保留 autem 的转折、coram te“在你面前”的明确成分，并以自然庄重的现代汉语表达 dicam similitudinem。
- source_word: terram multam magis
  choice: 泥土多得多
  rationale: terram 在制陶语境中指泥土；“多得多”保留 magis 的比较力度及两种产物数量悬殊的重点。
- source_word: fictile
  choice: 陶器
  rationale: 该词指由泥土制成的陶制器皿；汉语用集合性的“陶器”简洁自然。
- source_word: paruum autem puluerem unde aurum fit
  choice: 而能炼成金子的尘土却很少
  rationale: 保留 puluerem“尘土”的形象及 autem 的对照；“炼成”按金子从含金尘土中取得的语境自然表达 fit，同时不把 puluerem 直接改译为“金砂”。
theological_decisions:
- issue: 泥土与含金尘土之间的数量对比
  choice: 以“多得多……却很少”明确保留强烈反差
  alternative: 只译作“许多泥土……少量尘土”
  rationale: 拉丁文 magis 带有比较意味；这种悬殊是本比喻的核心，不宜弱化，但本节本身不提前解释其神学所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；“以斯拉啊”自然呈现呼语，“你若问……它会告诉你”保留比喻的拟人表达。句末用逗号，反映本节在后文中尚未完结。
