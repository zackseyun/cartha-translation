  text: your work. If therefore you destroy the one who was formed with such great labors[a], why then was he made?
translation:
  language: zh_hans
  text: 你的作品。因此，你若毁灭那经过如此辛劳才被塑造的人[a]，他又何必被造呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些较长的文本传统可译作：“你若以一道轻易的命令，毁灭那按你的命令、经过如此巨大辛劳才被塑造的人。”但这些词不见于此处所给的拉丁文本。
    reason: 交代英语旧译脚注及修订记录所反映的较长异文，同时以当前提供的 Bensly 拉丁文本为正文依据。
lexical_decisions:
- source_word: tuum opus
  choice: 你的作品
  rationale: 按所给拉丁文本直译，并保留其承接上文的片段性质。
- source_word: perdideris
  choice: 毁灭
  rationale: 表达使之灭亡、毁掉之意，符合此处向上帝发问的语境，又不额外限定具体方式。
- source_word: plasmatus
  choice: 被塑造
  rationale: 保留动词关于塑造、成形的具象意味，并用被动式对应拉丁文。
- source_word: tantis laboribus
  choice: 经过如此辛劳
  rationale: 体现 tantis 所强调的程度；用自然汉语表达形成过程所付出的巨大劳苦。
theological_decisions:
- issue: 被塑造者的身份与创造主体
  choice: 译作“那……被塑造的人”，不在本句明说塑造者
  alternative: 译作“你如此辛劳塑造的人”
  rationale: 拉丁文本采用被动分词 plasmatus，未在所给片段中明确写出施事者；正文避免补入原文未明说的“你”。
- issue: 结尾反问的呈现
  choice: 他又何必被造呢？
  alternative: 那么，他为什么被造呢？
  rationale: 保留原文所反映的神学张力：若最终被毁灭，创造他的目的何在；不替文本回答此问题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你的作品”有意保留原文承接前句的残句形式；正文不加入所给拉丁文没有的“按你的命令”或“以一道轻易的命令”。
