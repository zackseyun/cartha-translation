  text: But I have heard the swiftness of the judgment that is to come.
translation:
  language: zh_hans
  text: 但我听说，那将要来临的审判会迅速临到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sed
  choice: 但是
  rationale: 承接前文并形成转折，采用现代汉语中自然而庄重的表达。
- source_word: audiui
  choice: 我听说了
  rationale: 拉丁文以直接宾语承接所听见的内容；中文用“听说了”自然表达获悉之意，同时保留完成意味。
- source_word: celeritatem
  choice: 何等迅速
  rationale: 原词为名词“迅速、快捷”；若直译为“审判的迅速”不够自然，转为程度表述，可清楚传达审判迅速临到的含义。
- source_word: iudicii
  choice: 审判
  rationale: 保留司法及末世语境中的核心含义，不额外指定审判者或受审对象。
- source_word: quod futurum est
  choice: 那将要来临的
  rationale: 关系从句修饰“审判”，表达其未来临到而不增添具体时间信息。
theological_decisions:
- issue: “审判迅速”的具体所指
  choice: 保留为“那将要来临的审判何等迅速”
  alternative: 那即将施行的审判来得多么快
  rationale: 原文可侧重审判来临或施行之迅速；译文不进一步界定，保留原有张力。
translation_notes:
  register: 采用现代标准普通话，语气庄重清晰。以“何等迅速”避免生硬的名词化结构，同时不弱化 celeritatem 的强调。原始摘录开头的“terram.”属于前一语句残片，未纳入本节正文。
