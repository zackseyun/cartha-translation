translation:
  language: zh_hans
  text: 在地上撒下许多种子，栽种许多植物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: serit
  choice: 撒下……，栽种
  rationale: 拉丁文动词为第三人称单数，主语须由上文补足；中文省略主语可保持经文片段与上文的衔接。结合两个宾语分别译作“撒下”和“栽种”，使表达自然。
- source_word: super terram
  choice: 在地上
  rationale: 直接表达播种发生的地点，符合现代汉语习惯。
- source_word: semina multa
  choice: 许多种子
  rationale: 忠实保留 multa 所表达的数量之多。
- source_word: plantationis multitudinem
  choice: 许多植物
  rationale: 该短语字面涉及大量栽种之物；译为“栽种许多植物”既与 semina 的播种意象平行，也避免生硬的“许多栽植”。
theological_decisions:
- issue: 本节与前一节之间的句法衔接
  choice: 不补出具体主语
  alternative: 补作“他”或明确承接上文的名词
  rationale: 拉丁文仅以动词形式暗示第三人称单数主语；省略主语可避免在脱离上文时擅自指认，同时符合汉语表达。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。旧英译脚注所列“因此，正如我所说的，事情就是这样”属于此前错位的经文内容，不是本节拉丁文的异读，故不保留脚注。
