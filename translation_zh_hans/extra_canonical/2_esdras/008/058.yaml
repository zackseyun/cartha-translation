  text: they trampled his righteous ones. And they said in their hearts that there is no God[a], though they indeed know that they will die. Just as
translation:
  language: zh_hans
  text: 他们践踏了他的义人，并在心里说：“没有上帝。”[a]其实他们明明知道自己必死。正如
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧译作：“因为他们虽然得了自由，却藐视至高者，轻看他的律法，离弃他的道路。”这段话对应前文，并非本节现存拉丁文本。
    reason: 交代英文咨询层保留的 previous_rendering 脚注，同时明确该文字是先前错位译文，不应被理解为本节拉丁文本的异读。
lexical_decisions:
- source_word: iustos eius
  choice: 他的义人
  rationale: iustos 是 substantivized adjective，指属于上帝的义人；“他的义人”简洁保留所属关系。
- source_word: conculcauerunt
  choice: 践踏了
  rationale: 准确表达 conculcare 的强烈动作及压迫、凌辱意味。
- source_word: in corde suo
  choice: 心里
  rationale: 现代汉语自然表达，同时保留内心自语的语义。
- source_word: non esse deum
  choice: 没有上帝
  rationale: 按拉丁文不定式陈述内容，直译其否认上帝存在之意。
- source_word: et quidem scientes sciunt
  choice: 尽管他们明明知道
  rationale: scientes sciunt 是带强调色彩的重复表达；“明明知道”自然传达确知，而“尽管”体现与前述否认之间的张力。
- source_word: quoniam moriuntur
  choice: 自己必死
  rationale: moriuntur 形式为现在时，但在此表达死亡的确定命运；汉语用“必死”传达其确定性。
- source_word: Sicut
  choice: 正如
  rationale: 保留句末引向下文的比较连接词及未完结构。
theological_decisions:
- issue: “没有上帝”的否认对象
  choice: 没有上帝
  alternative: 上帝不存在
  rationale: 前者庄重而自然，也较贴近经文中“心里说”的措辞，不额外把话语改写成哲学命题。
- issue: 死亡知识的逻辑关系
  choice: 尽管他们明明知道自己必死
  alternative: 而且他们确实知道自己会死
  rationale: 拉丁文 et quidem 本身可作强调连接；结合语境，否认上帝与确知死亡之间存在让步张力。采用“尽管”与审校后的英文一致，但不进一步解释这种知识的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“践踏”“义人”“明明知道”“必死”兼顾源文力度与汉语自然度。保留末尾“正如”的悬接，以反映原始摘录在下一节继续。
