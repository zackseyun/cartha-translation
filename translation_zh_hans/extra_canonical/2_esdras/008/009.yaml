  naturalness: 整体庄重通顺；不过“所怀之物”虽符合孕育语境，却在本节截断处预先补足了原文尚未给出的内容。以省略号标示关系结构和句意延续，既较符合现代汉语，也更忠于所给文本边界。
  terminology: “保全／被保全／得以保全”恰当地呈现同词根反复，且没有把 seruatio 过度神学化。“子宫”比“母腹”更准确对应 matrix；此处并非泛指母亲或腹中状态，而是指孕育器官。
