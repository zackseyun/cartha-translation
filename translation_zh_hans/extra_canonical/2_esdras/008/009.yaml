  text: But both what preserves and what is preserved will be preserved by your preservation. And when the womb again gives back
translation:
  language: zh_hans
  text: 但那保全的和那被保全的，二者都要因你的保全而得以保全。当子宫再次交还其所怀的……时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruat / seruatur / seruabuntur / seruatione
  choice: 保全／被保全／得以保全／保全
  rationale: 保留原文同一词根的反复及主动、被动之间的对应；此处语境涉及孕育中的生命，“保全生命”使现代汉语更自然，同时未具体限定保全者和被保全者各指什么。
- source_word: matrix
  choice: 母腹
  rationale: 拉丁文指孕育胎儿的子宫；“母腹”自然、庄重，也适合经文语体。
- source_word: reddit
  choice: 交还
  rationale: 保留“归还、交回”的基本意象，不把它释义性地简化为“生出”。
- source_word: quae
  choice: 所怀之物
  rationale: 原句在关系代词处截断，先行内容须由下文补足；译文采用概括表达以维持句法悬接，不预断下节的具体所指。
theological_decisions:
- issue: “保全者”与“被保全者”的具体身份
  choice: 维持抽象表达，不明确指认为母亲、胎儿或其他对象
  alternative: 按生育语境直译为“母亲和胎儿”
  rationale: 原文只用中性关系结构 quod seruat / quod seruatur，具体身份并未明说；保留这种含混可避免加入原文没有的解释。
- issue: “你的保全”所表达的神学含义
  choice: 直译为“因你的保全”
  alternative: 扩展为“因你的护理大能”或“因你的救恩”
  rationale: seruatio 可指保存、护佑，但此处不宜直接等同于系统神学意义上的“护理”或“救恩”。
translation_notes:
  register: 采用现代、庄重而可理解的经文语体。刻意保留 seruare 词族的重复，以呈现原文修辞；末尾保留未完句式，因为本节拉丁文本止于关系代词 quae，语意延续到下一节。
