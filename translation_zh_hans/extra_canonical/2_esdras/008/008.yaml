  terminology: 建议保持“赐生命／得生命”以反映 uiuificans uiuificas 的同根重复；保持“塑成”对应 plasmatum、“塑造”对应 plasmatio，以保存词根联系；将 creatio 与 creatura 分别译作“创造之工”与“受造物”，避免将 creatio 过度限定为具体物体。
