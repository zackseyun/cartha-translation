id: 2ES.8.8
reference: 2 Esdras 8:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam uiuificans uiuificas nunc in matrice plasmatum corpus et praestas membra, conseruatur in igni et aqua tua creatio et nouem mensibus patitur tua plasmatio tuae creaturae quae in eo creata est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/008.yaml
  text: And because[a], giving life, you now give life in the womb to the body that has been formed, and you provide its members, your creation is preserved in fire and water, and for nine months your formation bears your creature that has been created in it.
translation:
  language: zh_hans
  text: 又因你是赐生命的，如今你使那在母腹中塑成的身体得生命，并赐给它肢体；你的创造之工在火与水中得以保全；九个月间，你的塑造承载着那在其中被造的受造物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuificans uiuificas
  choice: 你是赐生命的……你使……得生命
  rationale: 保留拉丁文同根词的重复，同时用自然汉语表达施行生命的动作。
- source_word: in matrice
  choice: 在母腹中
  rationale: 此处指孕育胎儿的子宫；“母腹”庄重自然，也符合上下文。
- source_word: plasmatum corpus
  choice: 塑成的身体
  rationale: plasmatum 表示被塑造、成形，保留创造与胎体形成的意象。
- source_word: praestas membra
  choice: 赐给它肢体
  rationale: praestas 在此为供给、赐予；membra 指身体各肢体。
- source_word: in igni et aqua
  choice: 在火与水中
  rationale: tua 在语法上修饰 creatio，而非 igni et aqua，故不译为“你的火与水”。
- source_word: tua creatio
  choice: 你的创造之物
  rationale: creatio 可指创造的行动或其产物；此处作为被保存者，采用具体的“创造之物”。
- source_word: tua plasmatio
  choice: 你所塑成的
  rationale: plasmatio 字面可指塑造或所塑成者；在怀孕语境中作主语，用名词化表达保留与 plasmatum 的词根呼应。
- source_word: patitur
  choice: 怀着
  rationale: 基本义有承受、忍受；在九个月孕育的语境中，指承载胎儿，译为“怀着”既清楚又不引入额外解释。
- source_word: quae in eo creata est
  choice: 其中所造的受造物
  rationale: 关系代词所指在拉丁句中略显复杂；以“受造物”承接 creatura，并保留“在其中被造”的空间关系。
theological_decisions:
- issue: 生命、塑造与创造的施事者
  choice: 各处均保留第二人称“你”，明确生命和身体肢体来自受祷告者
  alternative: 省略部分“你”，使句子更流畅
  rationale: 原文反复使用第二人称及物主形式，具有神学和修辞意义，不宜淡化。
- issue: creatio 与 creatura 的区分
  choice: 分别译为“创造之物”和“受造物”
  alternative: 两者都译为“受造物”或将 creatio 译为“创造”
  rationale: 既呈现两个拉丁名词的联系，又避免把被“保存”的 creatio 误解为抽象创造行动。
- issue: 孕育意象中的 patitur
  choice: 译作“怀着”
  alternative: “承受着”或“忍受着”
  rationale: 上下文明确提到母腹和九个月；“怀着”呈现孕育含义，但不扩展为特定胚胎学或教义论断。
translation_notes:
  register: 采用现代、庄重而可读的经文语体。保留原文较密集的“塑成—创造—受造物”词汇联系；因本译文没有脚注，正文不设脚注标记。
