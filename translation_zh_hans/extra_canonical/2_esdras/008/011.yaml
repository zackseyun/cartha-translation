source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mamillis, praeberi lac, fructum mamillarum, Vt nutriatur id quod plasmatum est usque in tempus aliquem, et postea dispones eum tuae misericordiae. Enutristi eum tuae iusticiae et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/011.yaml
  text: from the breasts[a], milk is provided, the fruit of the breasts, so that what has been formed may be nourished for a certain time, and afterward you direct him by your mercy. You nourished him in your righteousness and instructed him in your law and corrected him by your understanding,
translation:
  language: zh_hans
  text: 乳汁——乳房的果实——从乳房供给出来，为要使那已被塑造成形的得到一段时间的哺育；此后，你必以你的怜悯引导他[a]。你曾在你的公义中养育他，以你的律法教导他，又以你的悟性责备他，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必把他交托给你的怜悯。”
    reason: dispones eum tuae misericordiae 可理解为神以怜悯主动引导，也可理解为将他交托于神的怜悯；保留替代译法而不武断消除歧义。
lexical_decisions:
- source_word: mamillis, praeberi lac, fructum mamillarum
  choice: 乳汁，就是乳房所结的果实，从乳房供给出来
  rationale: 保留原文以同位语解释乳汁的结构，同时用自然汉语表达乳汁由乳房供给。
- source_word: plasmatum est
  choice: 已经塑造成形的
  rationale: 反映 plasmo 所含塑造、成形之意，并保留原文以中性表达指称受造胎儿或婴孩的方式。
- source_word: dispones eum
  choice: 引导他
  rationale: 此处 disponere 可指安排、治理或引导；结合 misericordiae 的工具性用法，译为“以你的怜悯引导他”最能呈现主动带领的含义。
- source_word: Enutristi
  choice: 养育
  rationale: 表达持续抚养、培育之意，并与前文“哺育”形成语义衔接。
- source_word: corripuisti
  choice: 纠正
  rationale: 可表示责备、管教或纠正；“纠正”既保留训诫意味，也不无根据地加重惩戒色彩。
- source_word: intellectu
  choice: 智慧
  rationale: 在此神对人的教养语境中，intellectus 指理解力、明悟或智慧；“智慧”是自然且庄重的中文表达。
theological_decisions:
- issue: tuae misericordiae 的句法作用
  choice: 以你的怜悯引导他
  alternative: 把他交托给你的怜悯
  rationale: 将与格理解为手段或方式，与后文“在你的公义中”“以你的智慧”相呼应，也保留 dispones 的主动治理或引导意义。
- issue: 时态交替
  choice: 前句用“此后……引导”，后三句用“养育、教导、纠正”
  alternative: 全部统一为现在时或将来时
  rationale: 原文 dispones 为将来时，而 enutristi、erudisti、corripuisti 为完成时；中文不强制标明时态，但通过“此后”和语序保留其推进与回顾关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留祷告中第二人称“你”，并尽量维持原文从身体哺育转向神圣教养的平行结构。句末逗号保留原始摘录尚未结束的连续性。
