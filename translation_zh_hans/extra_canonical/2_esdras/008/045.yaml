  text: let it not be upon us[a], but spare your people and have mercy on your inheritance, for you have mercy on your own creation.”
translation:
  language: zh_hans
  text: 不要让这事临到我们；但求你宽待你的子民，怜悯你的产业，因为你怜悯你自己所造的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super nos
  choice: 临到我们
  rationale: 该短语承接上一节的否定词 Non，表达“不要让这事落在／临到我们”的祈求；译为“临到我们”既自然，也保留其与上文的句法联系。
- source_word: parce
  choice: 宽恕
  rationale: 在向上帝发出的祈求中，parcere 表示饶恕、不予惩罚；“宽恕”符合现代汉语宗教语境。
- source_word: haereditati tuae
  choice: 你的产业
  rationale: 直译“你的产业／基业”，指归属于上帝的群体；“产业”保留所有权与承受之物的意象。
- source_word: creaturae
  choice: 所造的
  rationale: 拉丁文 tuae creaturae 可指“你的受造物／你所创造的”；用“自己所造的”在汉语中自然，并保留对象范围未明的概括性。
theological_decisions:
- issue: super nos 与上一节否定词的关系
  choice: 译作“不要让这事临到我们”，视为承接8:44的 Non
  alternative: 将 super nos 理解为独立短语，或省略其承接的否定意义
  rationale: 拉丁文跨节句法为 Non, domine ... super nos，语义是祈求所述之事不要临到“我们”；补出“让这事”使中文句意完整，但不增加具体所指。
- issue: haereditas 的群体含义
  choice: 保留“产业”的圣经意象
  alternative: 释译为“属于你的百姓”或“你的选民”
  rationale: 避免把“产业”的神学意象窄化，也不额外引入身份限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“却求你”清楚表达转折与祈求语气；保留“子民”“产业”等圣经传统用语，同时避免古奥句式。
