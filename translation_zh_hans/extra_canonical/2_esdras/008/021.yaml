  text: incomprehensible, before whom the host of angels stands with trembling, whose preservation is turned into wind and fire, whose word
translation:
  language: zh_hans
  text: 不可测度的那一位，天使的军队战战兢兢地侍立在他面前；他们的保全转变为风和火[a]；他的话语……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保全”：拉丁文 seruatio 可指“保存、保全、维持”或“存立”。它在“转变为风和火”这一表述中的具体所指和含义不完全确定。
    reason: 保留 seruatio 的核心语义，同时说明此处异常措辞的解释不确定性；不将其无根据地改释为“侍奉”。
lexical_decisions:
- source_word: prehensibilis
  choice: 不可测透
  rationale: 这里是跨越分段的 incomprehensibilis 一词的后半部分，按完整词义译为“不可测透”，而不把片段 prehensibilis 孤立理解为“可领会”。
- source_word: exercitus angelorum
  choice: 天使的军队
  rationale: 保留 exercitus 的群体性和军事意象，同时使用现代汉语中清楚自然的表达。
- source_word: cum tremore
  choice: 战战兢兢地
  rationale: 表达天使在上主面前敬畏战栗的状态，比单译“颤抖”更符合庄重祷告语体。
- source_word: seruatio
  choice: 侍奉
  rationale: 该词可指保守、持守或职守；在天使军队侍立的语境中，“侍奉”最能连贯表达其奉职状态，但以脚注保留词义上的不确定性。
- source_word: conuertitur
  choice: 化为
  rationale: 直接表达“转变成”的动态意义，并保留风与火的意象。
theological_decisions:
- issue: 天使与风、火之间关系的表述
  choice: 他们的侍奉化为风和火
  alternative: 他们的存立／保全变为风和火
  rationale: 不把经文扩释为天使本体必然变成风火，也不明确引入某种天使论；用“侍奉”保留职分与显现方式之间的张力，并在脚注中说明拉丁词的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留原文作为祷告片段的呼告和未完句式；以分号呈现连续的关系从句，并用省略号表明“你的话语”仍接下文。
