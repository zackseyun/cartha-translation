  yaml_path: translation/extra_canonical/2_esdras/008/017.yaml
  text: Because of this I am troubled. Therefore I will begin to pray before you for myself and for them[a], because I see the falls of us who inhabit the earth.
translation:
  language: zh_hans
  text: 为此，我心里烦乱。因此，我要开始在你面前为自己和他们祷告，因为我看见我们这些人的跌倒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们这些人的跌倒”也可理解为“我们这些人已经跌倒（或堕落）的状态”。原文此处的语法和语义存在歧义；“跌倒”保留其比“过失”更强的含义。
    reason: 说明 lapsos nostros 的语法与语义困难，并保留“跌倒”与“已经跌倒／堕落”两种理解。
lexical_decisions:
- source_word: conturbor
  choice: 我心里烦乱
  rationale: 表达拉丁语被动式所指的内在不安与困扰，同时保持现代汉语自然庄重。
- source_word: coram te
  choice: 在你面前
  rationale: 保留原文空间性敬语意象，表示向上帝祷告。
- source_word: lapsos nostros
  choice: 我们……已经堕落
  rationale: 将较难直译的表述理解为‘我们处于跌倒、败坏的状态’，比‘过失’更能保留 lapsos 的力度，又避免生硬的‘我们的跌倒’。
- source_word: qui inhabitamus
  choice: 我们这些住在地上的人
  rationale: 按关系从句的第一人称复数含义自然转成汉语；‘地上’由本节语境和英译所保存的完整读法体现。
theological_decisions:
- issue: lapsos 所指是个别过失还是人整体的堕落状态
  choice: 已经堕落
  alternative: 我们的过失／我们的跌倒
  rationale: 原词力度更接近‘跌倒了、沦落了’的人或状态；此译保留末世哀叹中对人类败坏的严肃判断，但不进一步规定某一宗派的原罪教义。
- issue: ‘他们’的具体所指
  choice: 保留‘他们’，不补明对象
  alternative: 为那些人／为世人
  rationale: 原文只用代词 eis，具体先行对象需由上下文判断，不应在本节擅自消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言；以‘所以’对应 Ideo，保留前后因果推进。脚注标记置于相关句末。
