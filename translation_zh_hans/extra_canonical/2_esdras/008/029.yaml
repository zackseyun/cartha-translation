  text: neque volueris perdere qui pecorum mores habuerunt, sed respicias eos qui legem tuam splendide docuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/029.yaml
  text: Do not desire to destroy those who have had the ways of cattle[a], but look upon those who have taught your law splendidly.
translation:
  language: zh_hans
  text: 不要想毁灭那些有牲畜般习性的人[a]，却要眷顾那些出色地教导你律法的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“那些有牲畜习性的人”。
    reason: 保留pecorum mores habuerunt较贴近字面的表达，并说明正文“有牲畜般习性”所依据的比喻。
lexical_decisions:
- source_word: volueris perdere
  choice: 想毁灭
  rationale: 以自然现代汉语表达拉丁文“不愿／不要有意毁灭”的禁止语气，既保留意愿层面，也避免生硬的“愿意毁灭”。
- source_word: pecorum mores habuerunt
  choice: 行为如牲畜
  rationale: mores在此指行为方式或习性，并非礼貌举止；用“行为如牲畜”传达其贬义比喻，同时以脚注保留较贴近字面的译法。
- source_word: respicias
  choice: 眷顾
  rationale: 此处不只是视觉上的“看”，而是转眼关注、施以关照；“眷顾”符合祈求上帝垂看的庄重语境。
- source_word: splendide docuerunt
  choice: 出色地教导
  rationale: splendide表示卓越、可称许的方式；“出色地”自然传达其副词意义，而不把它误解为视觉上的光辉。
- source_word: legem tuam
  choice: 你的律法
  rationale: 直译所有格与核心宗教术语，保持祷告中对上帝的第二人称称呼。
theological_decisions:
- issue: “牲畜的习性”所指范围
  choice: 保留为对行为方式的比喻，不具体解释为某一种罪行
  alternative: 译成“过着禽兽般生活的人”
  rationale: 原文只作概括性的道德对比，并未列明特定罪行；较克制的译法可保留原文张力，避免额外强化或限定。
- issue: respicias所含的神圣眷顾意味
  choice: 译为“眷顾”
  alternative: 译为“看那些”或“垂看那些”
  rationale: “眷顾”自然体现祈求上帝关注并善待他们，但不进一步说明具体的拯救或奖赏，以免加入原文没有明说的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“却要”凸显两类人的对照；避免使用可能带有现代礼仪含义的“举止”，也不把“牲畜”改成更强烈的“禽兽”。
