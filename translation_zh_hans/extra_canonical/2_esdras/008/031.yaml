  text: judged, but love those who have always trusted in your glory. For we and our fathers have lived in mortal ways, but you, however,
translation:
  language: zh_hans
  text: 受审判；但愿你爱那些始终信靠你荣耀的人。因为我们和我们的祖先都以必死之人的方式行事；然而你却……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicati
  choice: 受审判
  rationale: 这是复数过去分词，且所给文本从句中间开始；保留其承接上文的残句性质，不擅自补出主语或谓语。
- source_word: diligas
  choice: 要爱
  rationale: 按语境将现在虚拟式理解为祈愿或请求，译为“要爱”，语气自然，同时不强化为命令。
- source_word: semper in tua gloria confiderunt
  choice: 始终信赖你荣耀的人
  rationale: 保留 confidere in 的信靠含义，并让“你荣耀”仍作信赖所指，不改释为信赖上帝本人。
- source_word: mortalibus moribus egimus
  choice: 按必死之人的习性行事
  rationale: mortalibus moribus 可指属于必死之人的行为方式或习性；此译保留其道德意味与人必死的处境，避免弱化成仅仅“过凡人的生活”。
- source_word: tu autem
  choice: 然而你却……
  rationale: 源文在转折语处中断；以省略号明确保留残缺，不补入后续内容。
theological_decisions:
- issue: “信赖你荣耀”的对象关系
  choice: 直译为“信赖你荣耀”
  alternative: “因你的荣耀而信靠你”
  rationale: 拉丁文明确是 in tua gloria；直译保留可能的修辞与神学张力，不把对象关系解释得更具体。
- issue: mortalibus moribus 的道德色彩
  choice: “按必死之人的习性行事”
  alternative: “过着凡人的生活”
  rationale: moribus 含行为、习性或品行之意；所选译法不把它纯粹中性化，也不擅自加强为“罪恶的行径”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。开头和结尾都依照所给拉丁文本保留残句状态；结尾用省略号标明源文在“tu autem”处中断。
