review_pass:
  verdict: revise
  source_fidelity: 译文正确保留了所给拉丁文本首尾均为残句的状态，也没有补出“tu autem”之后的内容。惟“diligas”为虚拟式，在此祈愿／请求语境中宜明确译出“但愿”，而非容易读作劝告或命令的“要”。
  naturalness: “受审判，却要爱”在现代汉语中主语和语气骤变，衔接不够清楚；以分号并采用祈愿式可保留原文残句而更通顺。“以必死之人的方式行事”较“按……习性行事”更自然，且不减损 moribus 所含的行为方式意味。
  terminology: “荣耀”“信靠”“必死之人”均适合庄重的经文语体。“信靠你的荣耀”虽带有原文 in tua gloria 的不寻常对象关系，仍应保留，不宜改释为“信靠你”。
  issues:
  - severity: medium
    issue: “diligas”译作“要爱”
    rationale: 现在虚拟式在这一祈愿性语境中应译作“但愿你爱／愿你爱”。“要爱”可被理解为对“你”的命令或普通将来／应当，未充分体现原文语气。
  - severity: low
    issue: 首句的汉语衔接不清
    rationale: “受审判，却要爱”把无明示主语的被动分词与对神的祈愿并列，汉语读者不易辨明语气转换。调整标点及“但愿”可在不补足残缺上下文的前提下改善可读性。
