source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: super plasma eorum qui peccauerunt aut mortem aut iudicium aut perditionem ; Sed iocundabor super iustorum figmentum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/038.yaml
  text: For truly I will not think upon the formation of those who have sinned[a], nor upon their death, nor their judgment, nor their destruction; but I will rejoice over the creation of the righteous,
translation:
  language: zh_hans
  text: 因为我实在不会顾念那些犯罪之人的被造，也不会顾念他们的死亡、审判或灭亡[a]；我却要因义人的被造而欢喜，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不会顾念死亡、审判或灭亡。”
    reason: 拉丁文的“他们的”紧邻“被造”；后三个并列项也可理解为不带这一所属限定。正文按并列结构和上下文，将其理解为同样指犯罪之人的死亡、审判和灭亡。
lexical_decisions:
- source_word: plasma
  choice: 受造
  rationale: 指被塑造、被造出的存在；译为“受造”既保留造物意象，也能自然地与“那些犯罪之人”相连。
- source_word: iudicium
  choice: 审判
  rationale: 在本段末世性语境中指对犯罪之人的裁决，现代汉语以“审判”最为准确。
- source_word: perditionem
  choice: 灭亡
  rationale: 表达最终毁灭或丧失的结局，同时避免擅自限定其具体性质。
- source_word: figmentum
  choice: 受造
  rationale: 与前句的 plasma 形成有意的平行；统一译法可凸显犯罪之人与义人受造结局的对照。
- source_word: iocundabor super
  choice: 要因……而欢喜
  rationale: 自然表达拉丁文“以……为欢喜、因……欢喜”的关系，并保留第一人称将来语气。
theological_decisions:
- issue: eorum（他们的）的管辖范围
  choice: 将“他们的”理解为同时限定死亡、审判和灭亡
  alternative: 只让“那些犯罪之人的”限定“受造”，其余译作泛指的“死亡、审判或灭亡”
  rationale: 虽然 eorum 紧接 plasma，但后续三个并列宾格与 plasma 同受省略的谓语支配；按语义和上下文，它们最自然地都指犯罪之人的结局，而非笼统否定对死亡、审判和灭亡的顾念。
- issue: plasma 与 figmentum 的关系
  choice: 二者都译为“受造”
  alternative: 分别译为“形体”和“创造”
  rationale: 两个拉丁词均可表示被塑造之物；保持平行可呈现原文在犯罪者与义人之间的修辞对照，而不额外引入本体论差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“顾念”兼顾“思想、留意、关切”的语义；分号保留原文前后强烈对照。句末逗号依照所给经文片段未完的形式保留。
