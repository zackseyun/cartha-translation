lexical_decisions:
- source_word: in ea
  choice: 其中
  rationale: 照应上文所指的阴性单数对象；本节是未完句，保留其指代关系，不擅自补明所指。
- source_word: creata fuerint
  choice: 所造的事物
  rationale: 以概括性的名词结构表达完成被动虚拟式；其具体语法联系因残句而略有含混。
- source_word: Imperasti
  choice: 你吩咐
  rationale: 准确传达命令、规定之意，并保持对上帝说话的庄重语气。
- source_word: ex ipsis membris
  choice: 从那些肢体本身
  rationale: “从”表达 ex 的来源义；“本身”保留 ipsis 的强调；“肢体”对应 membris，并避免过早限定为某一特定器官。
- source_word: hoc est
  choice: 也就是说
  rationale: 自然表达解释或进一步说明的引介语；保留原文句末未完状态。
theological_decisions:
- issue: “in ea”的所指
  choice: 用“其中”保留回指
  alternative: 明确译为“在子宫中”或其他具体对象
  rationale: 所给拉丁片段本身未明说先行词，不应凭本节单独补入可能带解释性的指称。
- issue: “membris”的身体含义
  choice: 译作“肢体”
  alternative: 译作“器官”或“身体各部分”
  rationale: “肢体”既保留身体部位的基本义，也维持原文在“也就是说”之后将继续解释的开放性。
translation_notes:
