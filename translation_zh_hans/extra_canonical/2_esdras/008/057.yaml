  text: 他们藐视他，离弃了他的道路。此外，他们还……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contempserunt
  choice: 藐视
  rationale: 准确表达对他及其道路轻蔑、不屑的态度，语体庄重自然。
- source_word: uias eius
  choice: 他的道路
  rationale: 保留拉丁文的道路隐喻及其复数含义，不把它收窄为具体的命令或行为。
- source_word: dereliquerunt
  choice: 离弃了
  rationale: 体现主动抛下、不再遵行之意，也符合经文语域。
- source_word: Adhuc autem et
  choice: 此外，他们还……
  rationale: 该短语引出后续内容，而本单元止于连接结构；用省略号明确正文在此处未完。
theological_decisions:
- issue: “他的道路”所指对象
  choice: 保留“他的”
  alternative: 明确为“上帝的”
  rationale: 本段拉丁文仅用代词 eius；不在本节内补明先行词，以保存原文的篇章依赖关系。
- issue: 残缺句 Adhuc autem et 的处理
  choice: 译作“此外，他们还……”
  alternative: 把它并入下一节或补足其宾语
  rationale: 严格对应所给拉丁文片段，不从后文擅自补足尚未出现的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“藐视”“离弃”“道路”保留经文语感；末尾省略号呈现源文本单元本身未完的句法状态。
