  text: I have shown these things to all[a], but to you and to a few like you. And—
translation:
  language: zh_hans
  text: 我已向所有人显明了这些事，唯独没有向你和少数几个像你的人显明。而——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文片段按字面可译为本节正文。若依通常上下文读法补入一个“不”字，也可译作：“我没有向所有人显明这些事，只向你和少数几个像你的人显明。而——”另有旧译把相邻经节的内容合并在此处。
    reason: 说明现存文本的表面句法及需补入否定词的上下文性读法，并提示旧有经节划分问题；正文不无声补字。
lexical_decisions:
- source_word: omnibus
  choice: 向所有人
  rationale: 保留与格复数的全称范围，不自行补入原文未见的否定词。
- source_word: demonstraui
  choice: 我已……显明了
  rationale: 以自然汉语表达完成时态的一人称单数动词，同时保持启示、展示之意。
- source_word: nisi tibi et tibi similibus paucis
  choice: 唯独没有向你和少数几个像你的人
  rationale: nisi 通常表示“除了、唯独不包括”；在没有明文否定词的现存拉丁语片段中，按其表面句法译出排除关系。
- source_word: et re-
  choice: 至于——
  rationale: 原文在词中断裂，无法可靠复原；用破折号保留未完的承接，不猜补后文。
theological_decisions:
- issue: 显明对象的范围
  choice: 译为向所有人显明，唯独排除以斯拉及少数同类者
  alternative: “我没有向所有人显明，只向你和少数几个像你的人显明”
  rationale: 备选读法更符合常见上下文和英译意向，却需要补入现存片段没有的 non（“不”）。正文优先遵从所给拉丁文，同时以脚注说明文本困难，不静默消解矛盾。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“显明”保留启示语境的语感；末尾破折号忠实呈现 et re- 的残缺状态。
