id: 2ES.8.1
reference: 2 Esdras 8:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: hoc saeculum fecit altissimus propter multos, futurum autem propter paucos.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/001.yaml
  text: And he answered me and said[a], “The Most High made this age for many, but the age to come for few.”
translation:
  language: zh_hans
  text: 他回答我说：“至高者为许多人创造了这一世[a]，却为少数人创造了来世。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个时代”。
    reason: saeculum 可指“世”或“时代”；正文采用“这一世”，以自然呈现它与“来世”的对照。
lexical_decisions:
- source_word: hoc saeculum
  choice: 这一世
  rationale: 保留 hoc 的指示意义，不增添原文没有的“现今”；“世”也能自然地与下文的“来世”形成末世论语境中的对照。
- source_word: fecit
  choice: 创造了
  rationale: 在至高者作主语、世代为宾语的语境中，“创造”比一般的“做成”更自然，也准确表达 fecit。
- source_word: propter multos / propter paucos
  choice: 为许多人／为少数人
  rationale: propter 在此表示目的或受益对象；中文用“为”简洁保留这种关系，不进一步解释这些人的身份。
- source_word: futurum
  choice: 来世
  rationale: 原文省略了重复的 saeculum；中文补出“世”，以清楚呈现“这一世”与未来之世的对照。
theological_decisions:
- issue: “许多人”与“少数人”的救恩含义
  choice: 按原文直译为“为许多人……为少数人”，不作解释
  alternative: 将其扩展为有关得救者人数或世界用途的明确陈述
  rationale: 本节本身保留了简练而有张力的对照；译文不应预先判定其完整神学含义。
- issue: hoc saeculum 与 futurum 的时代对照
  choice: 译作“这一世”与“来世”
  alternative: 译作“现今的世代”与“将来的世代”
  rationale: 前者自然、凝练，并避免在 hoc 中加入拉丁原文没有的 praesentis，同时保持两个时代的对称。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“他回答我说”保留原文叙事公式；“这一世／来世”便于普通读者理解，同时不把“这一世”改写成原文未明说的“现今的世代”。
