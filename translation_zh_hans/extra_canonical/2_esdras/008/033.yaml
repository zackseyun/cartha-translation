  yaml_path: translation/extra_canonical/2_esdras/008/033.yaml
  text: For the righteous[a], who have many works laid up with you, will receive their reward from their own works.
translation:
  language: zh_hans
  text: 因为义人[a]有许多善行存放在你那里，他们必从自己的行为中领受报偿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但义人有许多善行存放在你那里，他们必从自己的行为中领受报偿。”
    reason: 英文审计文本保留了将 enim 作较弱转折性承接（“But”）的既有译法；正文按拉丁文 enim 在上下文中的主要解释/因果作用译为“因为”。
lexical_decisions:
- source_word: Iusti
  choice: 义人
  rationale: 直接表达被称为公义的人，并与后文“善行”区分。
- source_word: operae multae repositae apud te
  choice: 有许多善行积存在你那里
  rationale: 保留“许多行为被存放在你那里”的意象；依语境将 operae 明确为“善行”，避免中文误解为中性的行为。
- source_word: ex propriis operibus
  choice: 按自己的行为
  rationale: 表达报偿所依据或源自他们自己的行为，同时避免加入超出原文的教义解释。
- source_word: recipient mercedem
  choice: 领受报偿
  rationale: merces 在此指按行为所得的回报；“报偿”兼顾庄重和现代可懂性。
- source_word: enim
  choice: 因为
  rationale: 承接上一节并说明理由，保留拉丁文 enim 的解释、因果功能，而不译为转折。
theological_decisions:
- issue: 义人的报偿与其行为之间的关系
  choice: 按自己的行为领受报偿
  alternative: 从自己的行为得报偿
  rationale: 原文 ex 可表达来源或依据；正文采用自然中文“按”，但不进一步断定有关功德或称义的系统教义。
- issue: enim 的论证关系
  choice: 因为
  alternative: 其实；原来
  rationale: 本句是在解释为何怜悯临到没有义行的人：有许多善行的义人则按其行为得报偿。采用因果连接最清楚地保留论证链。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“积存在你那里”保留原文储存的比喻；句首“因为”体现上下文的因果论证。
