  yaml_path: translation/extra_canonical/2_esdras/008/013.yaml
  text: And you will put him to death as your creature, and you will give him life as your creature.
translation:
  language: zh_hans
  text: 你要使他作为你的受造物死去，也要使他作为你的受造物活过来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortificabis
  choice: 使他死
  rationale: 保留拉丁语使役含义及与后半句的鲜明对照；比“杀死”更适合此处论及造物主掌管生死的语境。
- source_word: tuam creaturam
  choice: 他是你所造的
  rationale: 在现代汉语中自然表达“你的受造物”，并在两处完全重复，以忠实保留原文措辞与修辞平行。
- source_word: uiuificabis
  choice: 使他活
  rationale: 直接保留“赋予生命、使之活”的使役意义，并与“使他死”形成对应。
theological_decisions:
- issue: 死亡与生命的施行者
  choice: 两句均明确以“你”为主语，并保留“要”所表达的将来意义
  alternative: 将其弱化为泛指的生死过程
  rationale: 原文两个第二人称单数将来时动词都直接以受话者为施行者，不宜淡化其中的神学张力。
- issue: tuam creaturam在两句中的重复
  choice: 两处均译为“因为他是你所造的”
  alternative: 第二处改译为“你的作品”或省略重复
  rationale: 原文两次使用完全相同的短语；保留重复既忠实于文本，也避免引入原文没有的词义差别。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保持原文的对称和平行，不添加解释性神学术语。
