  source_fidelity: “断定自己属于义人”基本对应 *non iudicasti te inter iustos*，但“更大的荣耀”将 *plurimum* 处理成“更大”的比较级，并把被动的 *glorificeris* 弱化为“得着荣耀”。此处较稳妥的是以“极大地得荣耀”表达加强/最高程度，并保留受动意义。
  naturalness: “你……又没有……”能够理解，但“又”在此不如“并且”贴合 *et*，且“把自己列在义人中”比“断定自己属于义人”更直接自然地呈现“将自己算在……之中”。保留开头片段符合原文承接上句的结构。
  terminology: “义人”是 *iusti* 的恰当、庄重且通行的对应。“得荣耀”适合 *glorificari* 的圣经语体；“极大地”避免将拉丁语程度加强误作明确的比较关系。
  issues:
