translation:
  language: zh_hans
  text: 你[a]，并且没有把自己列在义人中，以致你极大地得荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有旧译作“因为你谦卑自己，正如你所当做的”；但按本译所据拉丁文本，这句话见于8:47末。此处开头的“你”承接上文。
    reason: 说明旧译造成的节次错位，并交代本节拉丁原文以宾格代词 te 起首所形成的承接结构。
lexical_decisions:
- source_word: iudicasti te inter iustos
  choice: 断定自己属于义人
  rationale: 直译为“把自己判断在义人中”；此处用自然现代汉语表达自我归类或认定，同时保留“判断”的语义。
- source_word: ut plurimum glorificeris
  choice: 好让你得着更大的荣耀
  rationale: 保留 ut 可表示的目的意味，并以被动式“得着荣耀”对应 glorificeris；“更大的”反映 plurimum 在此处的加强或比较意味。
theological_decisions:
- issue: ut 所表达的目的或结果
  choice: 好让你得着更大的荣耀
  alternative: 以致你得着更大的荣耀
  rationale: 拉丁语 ut 在此可表示目的或结果；正文采用目的式，但不借此引入关于得荣耀之因果机制的额外神学解释。
- issue: “义人”的身份判断
  choice: 没有断定自己属于义人
  alternative: 没有把自己列在义人中
  rationale: 措辞保留说话者对自身身份的判断，不把它解释为否认称义、谦卑功德或特定教派的义论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你”保留原文承接上句的片段式开头；“又”使汉语衔接较为顺畅，但不补出拉丁文本未明说的主句内容。
