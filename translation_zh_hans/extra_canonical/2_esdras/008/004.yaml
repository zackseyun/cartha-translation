  text: And I answered and said[a], “Therefore let the soul receive understanding, and let it devour wisdom.”
translation:
  language: zh_hans
  text: 我回答说：“因此，灵魂啊，你要吞下悟性；愿它吞食那有智慧的事物。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那有智慧的事物”也可理解为“有滋味的事物”；原文 sapit 可指明智、有智慧，也可在“吞下／吞食”的语境中唤起滋味的含义。
    reason: preserve_lexical_ambiguity
lexical_decisions:
- source_word: absorbe
  choice: 吞下
  rationale: 保留命令式及其强烈的摄取意象，并与后文“吞食”形成连贯的进食隐喻；比抽象化为“领受”更贴近拉丁文本。
- source_word: anima
  choice: 灵魂啊
  rationale: 置于命令式 absorbe 之后，最自然地理解为呼格，即说话者直接向灵魂发话，而非第三人称主语。
- source_word: sensum
  choice: 悟性
  rationale: 可表达理解、领悟的能力，符合 sensus 在此处的抽象意义。
- source_word: deuoret
  choice: 让它吞食
  rationale: 保留第三人称虚拟式与前句第二人称命令式之间不寻常的转换，不擅自把两句统一为同一人称。
- source_word: quod sapit
  choice: 那有智慧的
  rationale: 保留关系从句的形式和一定歧义，不直接抽象化为“智慧”；sapere 可涉及明智、有智慧，也可能在进食语境中唤起“滋味”的联想。
theological_decisions:
- issue: anima 的句法身份
  choice: 按呼格译为“灵魂啊”
  alternative: 按主语译为“让灵魂领受悟性”
  rationale: absorbe 是第二人称单数命令式，紧随其后的 anima 最自然是直接称呼对象。
- issue: 第二分句的人称变化
  choice: 译作“让它吞食”，保留第三人称表达
  alternative: 译作“你要吞食”，统一为第二人称
  rationale: 拉丁文由 absorbe 的第二人称命令式转为 deuoret 的第三人称虚拟式；译文保留这一真实而略显突兀的张力。
- issue: quod sapit 的具体含义
  choice: 正文译为“那有智慧的”，脚注提示语义双关
  alternative: 直接译为“智慧”或“有滋味的东西”
  rationale: 原文既可指明智、智慧之物，也因吞咽意象而可能带出品尝或滋味的回声，不宜在正文中彻底消除歧义。
translation_notes:
  register: 采用现代、庄重而可懂的表达。“灵魂啊”保留直接呼语；“吞下／吞食”有意维持原文鲜明而略显突兀的进食隐喻。
