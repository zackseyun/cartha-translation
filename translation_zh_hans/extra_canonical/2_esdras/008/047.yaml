  text: possis diligere meam creaturam super me, tu autem frequenter temetipsum proximasti iniustis, numquam Sed et in hoc mirabilis eris coram altissimo, Quoniam humiliasti te, sicut decet
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/047.yaml
  text: Can you love my creation more than I do? But you have often drawn yourself near to the unrighteous. Never do so. Yet even in this you will be marvelous before the Most High[a], because you have humbled yourself, as is fitting.
translation:
  language: zh_hans
  text: 难道你能比我更爱我所创造的万物吗？可是，你常常把自己置于不义之人的行列[a]；绝不可再这样做。然而，即使在这件事上，你在至高者面前也必令人赞叹，因为你已使自己谦卑下来；这是合宜的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己接近不义的人”。
    reason: proximasti可较字面地表示“使自己靠近”，也可在语境中表示把自己归入或置于某一类人中。
lexical_decisions:
- source_word: posses diligere meam creaturam super me
  choice: 难道你能比我更爱我所创造的吗
  rationale: 将 possis 按上下文理解为反问；super me 表示“超过我／比我更”，meam creaturam 指上帝所创造的受造物整体。
- source_word: temetipsum proximasti iniustis
  choice: 把自己置于不义之人的行列
  rationale: proximare 的基本含义是使靠近；反身结构在此表达以斯拉把自己放在不义者一边或归入其列，而非单纯作心理比较。脚注保留较字面的空间关系。
- source_word: numquam
  choice: 绝不可再这样做
  rationale: 原文的单独副词具有强烈禁止意味；按汉语补出承接前句的“这样做”，并以“绝不可”体现强调。
- source_word: mirabilis
  choice: 令人赞叹
  rationale: 此处形容人在至高者面前因谦卑而显为可赞叹；译为“令人赞叹”比形容人为“奇妙”更自然，同时不额外指定奖赏或称义。
- source_word: humiliasti te, sicut decet
  choice: 你谦卑了自己，正如所宜
  rationale: 保留反身表达及 decet 的合宜、应当之意，采用庄重而清楚的现代汉语。
theological_decisions:
- issue: 受造者能否比创造主更爱受造物
  choice: 保留反问：“难道你能比我更爱……吗？”
  alternative: 陈述为“你不可能比我更爱……”
  rationale: 拉丁文形式及语境支持反问；不将其改写成抽象教义断言，以保留原有修辞张力。
- issue: “即使在这件事上”所指及其评价
  choice: 保留指代的开放性，并直译为在至高者面前“令人赞叹”
  alternative: 明确解释为因把自己列在不义者中而蒙悦纳
  rationale: 原文的 in hoc 可联系谦卑自处，但未精确界定其逻辑范围；译文不把谦卑等同于功德，也不消除上下文张力。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的简体中文。“至高者”保留古代宗教称谓；句式清楚但不口语化。
