  text: I raised you with gladness, and I lost you with mourning and sorrow,
translation:
  language: zh_hans
  text: 我满怀喜乐养育你们，却在哀恸和悲伤中失去了你们，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Educaui
  choice: 养育成人
  rationale: 拉丁语 educavi 在此指抚养、培育；“养育成人”符合母亲对儿女说话的语境，也比单纯“教育”自然。
- source_word: cum laetitia
  choice: 欢欢喜喜地
  rationale: 传达 laetitia 的喜乐，并以现代汉语自然的状语形式表达。
- source_word: amisi
  choice: 失去了
  rationale: 忠实保留 amisi 的“失去”之意，不擅自具体化为死亡、被掳或离弃。
- source_word: cum luctu et tristitia
  choice: 在哀恸和悲伤中
  rationale: 分别保留 luctus 的哀恸、悲悼色彩与 tristitia 的悲伤之意，避免合并而损失原文并列结构。
theological_decisions:
- issue: “失去”所指的具体处境
  choice: 保留为“失去了你们”
  alternative: 译作“你们离开了我”或“你们死去了”
  rationale: 原文 amisi 未说明失去的方式；保留其开放性，避免加入原文没有明说的历史或神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留原文由喜乐转为哀伤的强烈对照，以及句末承接下文的逗号。
