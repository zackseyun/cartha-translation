translation:
  language: zh_hans
  text: 使你把他们交给羞辱，把他们的母亲交给劫掠，免得[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文止于“免得”，句意接续下文。
    reason: 提示读者原文在此为未完句，避免误以为中文遗漏内容。
lexical_decisions:
- source_word: confusionem
  choice: 羞辱
  rationale: 该词可指羞愧、耻辱或混乱；本句语境强调被交付于受辱的境地，译作“羞辱”既自然，也不把含义缩窄为内在的羞愧感。
- source_word: matrem eorum
  choice: 他们的母亲
  rationale: 按原文保留“母亲”这一形象，不擅自将其解释为某座城、某个民族或其他群体。
- source_word: in direptionem
  choice: 交给劫掠
  rationale: 体现进入被抢掠、被洗劫之境的含义，并与前半句的交付语气相呼应。
- source_word: ne
  choice: 免得
  rationale: 保留拉丁文引出否定目的或防范结果的连词功能；因本节文本止于此，后意待下文补足。
theological_decisions:
- issue: “他们的母亲”所指为何
  choice: 保留字面形象，不在正文中指明对象
  alternative: 明确译为母城、耶路撒冷或其民族共同体
  rationale: 原文在本句中没有明确释义；保留表达可避免把可能的集体或象征指涉定死。
- issue: des eis confusionem 的施受关系
  choice: 译为“任凭他们蒙受羞辱”
  alternative: 译为“赐给他们羞辱”或“使他们混乱”
  rationale: 该拉丁语结构带有使其落入某种境地的意味；中文用“任凭……蒙受”较自然，也保留审判性交付的张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“任凭……蒙受”表达审判性交付而不过度生硬；“他们的母亲”按原文保留其可能的象征性与歧义。
