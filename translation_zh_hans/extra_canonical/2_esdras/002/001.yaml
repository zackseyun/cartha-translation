source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus : ego eduxi populum istum de seruitute, quibus mandata dedi per pueros meos prophetas, quos audire noluerunt, sed irrita fecerunt mea consilia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/001.yaml
  text: 'Thus says the Lord: I brought this people out of slavery[a], and I gave them commandments through my servants the prophets, whom they were unwilling to hear, but they made my counsels void.'
translation:
  language: zh_hans
  text: 主这样说：“我把这人民从奴役中领了出来，又借着我的仆人众先知把诫命赐给他们；他们却不肯听这些先知，反倒使我的谋划落了空。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eduxi ... de seruitute
  choice: 从奴役中领了出来
  rationale: 保留“带领出来”的出离意象；“奴役”准确表达 seruitus 的受奴役状态。
- source_word: pueros meos prophetas
  choice: 我的仆人众先知
  rationale: puer 在此按从属服事者理解为“仆人”；“众先知”自然表达复数，并避免误译为年幼者。
- source_word: mandata
  choice: 诫命
  rationale: mandata 指所颁布的命令或诫令；在先知传达上帝命令的语境中，“诫命”庄重而易懂。
- source_word: quos audire noluerunt
  choice: 他们却不肯听这些先知
  rationale: 明确保留 quos 的先行词“先知”，并以“不肯听”体现 noluerunt 所表达的意志性拒绝。
- source_word: irrita fecerunt mea consilia
  choice: 使我的谋划落了空
  rationale: 直面“使……无效、落空”的强烈措辞，保留人拒绝上帝谋划所形成的神学张力，不将其弱化为单纯违背劝告。
theological_decisions:
- issue: 人是否能使上帝的谋划落空
  choice: 使我的谋划落了空
  alternative: 弃绝了我的劝告
  rationale: 原文 irrita fecerunt mea consilia 明言使其无效或落空；译文保留这一表面张力，不以系统神学预先消解。
- issue: pueros 的身份称谓
  choice: 仆人
  alternative: 奴仆／孩子
  rationale: 语境指奉差传命的先知，“仆人”最符合拉丁语此处的职分用法；“孩子”会造成错误年龄联想，“奴仆”则在本处可能过度强化法律身份。
translation_notes:
  register: 采用现代、庄重而口语可懂的经文体。“主这样说”保留宣告公式；分号呈现先知作为诫命媒介与百姓拒绝之间的转折。“反倒”对应 sed 的强对比，并使汉语行文自然。
