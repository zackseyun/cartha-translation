review_pass:
  verdict: revise
  source_fidelity: 现有拉丁引文在 de 之后截断，无法仅凭所示文字核验后续地点短语。按 Bensly 传统文本通常所见的 de lateribus terrae 理解，lateribus 表示地的边侧、各方或各处，并不直接是“隐秘之处”。因此，草稿沿用英文审校轨迹的“隐秘之处”并非最稳妥的源语对应。
  naturalness: “要记念你沉睡的儿女，因为我要把他们从地的各处领出来”庄重、通顺，且保留命令加理由的句法关系。“地的各处”比“大地隐秘之处”更自然，也较少加入原文未明说的“隐秘”概念。
  terminology: “记念”“沉睡的儿女”“领出来”均恰当。保留“沉睡”而不释作死亡或复活，维持经文的委婉与末世语境的开放性。
  issues:
  - severity: medium
    issue: “大地隐秘之处”将地点短语具体化为“隐秘”，缺少可靠的拉丁语依据。
    rationale: 若后续原文为常见的 lateribus terrae，其基本空间含义为地的边侧、各方／各处；译为“隐秘之处”改变了意象。所给源文又在 de 后截断，建议在底本文字中采用较中性的空间表达，并由人工复核缺失的拉丁续文。
  - severity: low
    issue: “大地”不必保留。
    rationale: terrae 译作“地”已足够；“地的各处”在现代汉语中更凝练自然。
  revised_text: 要记念你沉睡的儿女，因为我要把他们从地的各处领出来。
  revised_footnotes: []
  revision_rationale: 将“从大地隐秘之处”改为“从地的各处”，以较中性且符合 lateribus terrae 常见理解的方式表达地点短语；其余措辞保留，以维持原文的睡眠意象、将来时和不明确宣称复活的动词含义。由于提交的拉丁文本在 de 处截断，后续词形仍应据完整校勘底本复核。
