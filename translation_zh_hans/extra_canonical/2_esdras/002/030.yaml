  text: Filios tuos dormientes memorare, quoniam ego eos educam de
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/030.yaml
  text: Remember your sleeping children, for I will bring them out from the hidden places of the earth,
translation:
  language: zh_hans
  text: 要记念你沉睡的儿女，因为我要把他们从大地隐秘之处领出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filios tuos dormientes
  choice: 你沉睡的儿女
  rationale: 保留拉丁文现在分词 dormientes（“睡着、沉睡”）的意象；不直接改译为“死去的”，以免消除原文可能具有的委婉与末世意味。
- source_word: memorare
  choice: 要记念
  rationale: 用自然而庄重的祈使表达，既可指牢记，也可含关怀、顾念之意。
- source_word: educam
  choice: 我要……领出来
  rationale: educere 的形式可表达“带出、领出”；“领出来”保留行动主体与方向，不擅自明确为复活或召聚。
- source_word: de [lateribus terrae]
  choice: 从大地隐秘之处
  rationale: 所给拉丁文本在 de 处截断；此处依据经审校的英文咨询层所保存的续文含义表达，同时保持空间意象，不作额外神学解释。
theological_decisions:
- issue: “沉睡”是否应明译为死亡
  choice: 保留“沉睡”
  alternative: 译为“死去”或“已经安息”
  rationale: 原文以 dormientes 表达睡眠意象；直译可保存死亡委婉语与将来被唤出的潜在张力，而不把隐含意义写成明说。
- issue: “领出来”是否指复活
  choice: 仅译作“领出来”
  alternative: 译为“使他们复活”
  rationale: educam 本身没有明确说“复活”；保留较宽的动词意义，避免加入原文未明说的教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“儿女”比“孩子们”更适合经文语体，也能自然涵盖复数 filios；句式尽量贴近原文命令句加原因从句的结构。
