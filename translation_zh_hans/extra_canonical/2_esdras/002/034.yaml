  text: 'quae auditis et intellegitis: expectate pastorem uestrum, requiem aeternitatis dabit uobis, quoniam in proximo est ille, qui in finem saeculi adueniet. Parati estote ad praemia regni,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/034.yaml
  text: 'Therefore I say to you[a], Gentiles who hear and understand: await your shepherd; he will give you eternal rest, because he is near—the one who will come at the end of the age. Be ready for the rewards of the kingdom,'
translation:
  language: zh_hans
  text: 所以，我要对你们这些听见并明白的外邦人说：要等候你们的牧人；他必赐给你们永恒的安息，因为那位要在时代终结时来临的，已经近了。要预备好领受国度的赏赐，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae auditis et intellegitis
  choice: 你们这些听见并明白的
  rationale: 依句法将关系从句自然地转为修饰受话者的定语；保留“听见”与“明白”两个动作。
- source_word: gentes（由上文及英译所补明）
  choice: 外族人
  rationale: 本节承接上一节对以色列的对比；在早期基督教语境中指以色列之外的各族，即外邦人。选“外族人”既呈现对比，也避免现代汉语中“外邦人”可能带来的过强教会术语色彩。
- source_word: pastorem uestrum
  choice: 你们的牧者
  rationale: 保留牧羊者的隐喻及其领袖、护佑者含义。
- source_word: requiem aeternitatis
  choice: 永恒的安息
  rationale: 按拉丁文属格结构表达为持久至永恒的安息，采用自然且庄重的汉语。
- source_word: in proximo est
  choice: 已经近了
  rationale: 表达其临近、即将来到，而不强行限定为空间或时间意义。
- source_word: in finem saeculi
  choice: 在时代终结时
  rationale: saeculum 在末世语境中指现今时代；“时代终结”比“世界末日”更贴近原文，也避免额外灾变含义。
- source_word: praemia regni
  choice: 国度的赏赐
  rationale: 保留 praemia 的奖赏、报偿意义以及 regnum 的国度意象。
theological_decisions:
- issue: 受话者与以色列的关系
  choice: 外族人
  alternative: 万族／外邦人
  rationale: 依上下文保留作者将其与以色列相对举的尖锐区分，但不在正文中加入对这种神学立场的解释或认同。
- issue: 牧者的身份
  choice: 不在译文中明指其身份
  alternative: 基督／弥赛亚
  rationale: 原文只说“你们的牧者”，虽带有弥赛亚意味，仍应保留其指称上的含蓄。
- issue: 末世时间陈述
  choice: 那位要在时代终结时来临的，已经近了
  alternative: 末日将临者就在附近
  rationale: 保留“临近”与“将来临”的张力，不把 ille 明确替换成特定称号，也不把时间性的“近”改成纯空间意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以，我要……说”补足汉语主句衔接，以承接残存拉丁文本开头的关系从句；不添加原文没有的教派性解释。结尾逗号保留该节与后文在句法和内容上的连续性。
