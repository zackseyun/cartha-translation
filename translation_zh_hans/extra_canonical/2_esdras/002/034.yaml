  source_fidelity: 译文整体准确呈现了“听见并明白”“等候你们的牧者”“永恒的安息”“临近”以及“时代终结时来临”的末世张力，也保留了末尾与下文相连的逗号。不过，gentes 在紧接着与以色列相对的早期基督教语境中应译为“外邦人”；“外族人”通常指外国人或外来族群，未能充分表达此处犹太人与非犹太人之别。
  naturalness: 句子庄重、通顺。“所以，我要对……说”虽比所给拉丁残存句段更具显性主句形式，却与英文审校轨迹及汉语表达相合。将“牧者”改作“牧人”可更直接保留 shepherd 的牧羊意象，避免“牧者”在现代汉语中较易联想到教会职分。
  terminology: “外邦人”是本段与以色列相对时较准确、也较通行的术语；这只是忠实呈现文本的群体区分，并不认同或强化其论战立场。“国度”“永恒的安息”均合适。
