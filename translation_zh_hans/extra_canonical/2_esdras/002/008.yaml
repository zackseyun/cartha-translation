  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/008.yaml
  text: Woe to you[a], Assyria, who hide the unrighteous with you! O evil nation,
translation:
  language: zh_hans
  text: 亚述啊，你有祸了！你把不义之人藏在自己身边！邪恶的民族啊，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae tibi
  choice: 你有祸了
  rationale: 以现代汉语中庄重而清楚的警告语表达拉丁语的灾祸宣告，并以“啊”保留直接呼告的语气。
- source_word: Assur
  choice: 亚述
  rationale: 按传统地名译作“亚述”；本句将其拟人化，直接向其发言。
- source_word: abscondis
  choice: 藏
  rationale: 保留“隐藏、窝藏”的核心含义；与“不义之人”连用时，语境自然带出包庇意味，但不额外加入原文没有明说的司法术语。
- source_word: iniquos
  choice: 不义之人
  rationale: 将形容词复数的名词化用法明确译为人，保留其道德与宗教层面的“不义”，而不缩窄为一般的“坏人”或法律意义的“罪犯”。
- source_word: penes te
  choice: 在自己那里
  rationale: 表达这些不义之人被亚述留在其身边、掌控范围或庇护之下；避免限定为单纯的地理性“境内”，同时保持原语义的宽度。
- source_word: gens mala
  choice: 邪恶的民族啊
  rationale: 保留呼格语气，并让这一称呼自然衔接下文；“民族”比“国家”更贴近 gens 所指的人民共同体。
theological_decisions:
- issue: iniquos 的道德—法律语义范围
  choice: 不义之人
  alternative: 恶人／罪犯
  rationale: “不义之人”既保留原文的道德判断，也不将其未经依据地限定为已受法律定罪的人。
- issue: gens mala 与上下文的句法关系
  choice: 作为呼语译出，并以逗号承接下一节
  alternative: 作为“亚述”的同位称呼，在本节内收束
  rationale: 拉丁文本在 gens mala 后用逗号，较自然地把这一呼语引向下一节的命令；脚注同时提示其也可视为对亚述的补充称呼。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“亚述啊……你……”保留先知式直接呼告；句末逗号有意反映原文尚未完结，并使“邪恶的民族啊”衔接下一节。
