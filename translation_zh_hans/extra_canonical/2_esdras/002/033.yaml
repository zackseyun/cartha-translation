base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/033.yaml
  text: I[a], Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and spurned the commandment of the Lord. Therefore I say to you, O nations,
translation:
  language: zh_hans
  text: 我以斯拉在何烈山领受了主的命令，要我到以色列人那里去；可是我到了他们那里，他们却弃绝我，摒弃主的诫命。因此，我要对你们列国说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reprobauerunt me
  choice: 弃绝我
  rationale: reprobare 在此表示拒绝、不接纳；“弃绝”既保留其明确的排斥意味，也符合庄重的经文语体。
- source_word: respuerunt mandatum domini
  choice: 摒弃主的诫命
  rationale: respuere 本义带有强烈排拒、唾弃之意，不只是心里轻视；“摒弃”体现主动而坚决的拒斥，又避免过度字面化。
- source_word: gentes
  choice: 列国
  rationale: 此处为呼语，指以色列之外的各民族；“列国”保留集体和经文语境中的民族含义，不预先赋予贬义。
- source_word: Ideoque uobis dico
  choice: 因此，我要对你们……说
  rationale: 保留因果连接及第二人称复数对象；句末用冒号承接下一节将要说出的内容。
theological_decisions:
- issue: “主的诫命”的所指
  choice: 保留为“主的诫命”
  alternative: 译作“主的命令”，并与先知所领受的差遣完全等同
  rationale: 拉丁文 mandatum 可指命令或诫命；这里不进一步限定它究竟专指差遣以斯拉的命令，还是更广义的神圣吩咐，以保留原文张力。
- issue: gentes 的身份范围
  choice: 译作“列国”
  alternative: 译作“外邦人”
  rationale: “列国”较少预设宗教身份，既可涵盖以色列之外的民族，也保留后文进一步界定听众的空间。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“我以斯拉”保留自我点名的郑重语气；“可是……却……”自然表达转折。“摒弃”对应 respuere 的强烈主动拒斥。所给拉丁文本从 ut irem ad Israel 起句，开头关于以斯拉在何烈山领命的内容依据经审核的英文咨询层纳入正文；末尾保留未完待续的引语结构。
