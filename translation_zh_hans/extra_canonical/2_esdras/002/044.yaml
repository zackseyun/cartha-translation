  yaml_path: translation/extra_canonical/2_esdras/002/044.yaml
  text: Then I asked the angel and said, “Who are these, lord?”
translation:
  language: zh_hans
  text: 于是我问那天使说：“主啊，这些人是谁？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tunc
  choice: 于是
  rationale: 承接上文并推进叙事，符合此处“随后、于是”的语篇功能。
- source_word: interrogaui angelum et dixi
  choice: 我问那天使说
  rationale: 保留拉丁文“询问……并说”的表达内容，同时采用自然的现代汉语引语结构。
- source_word: qui sunt hi
  choice: 这些人是谁
  rationale: hi在语境中指所见的一群人；译出“人”可使现代汉语清楚自然。
- source_word: domine
  choice: 主啊
  rationale: 保留直接呼语及尊称，不增添原文没有的领属词“我的”。
theological_decisions:
- issue: domine所指对象及称谓力度
  choice: 译作“主啊”
  alternative: “大人”或“我主啊”
  rationale: 原文以呼格domine称呼受问者；“主啊”直接保留尊称及可能的语义张力，而不擅自添加“我”或将其弱化为世俗官称。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“问……说”略带经文叙事风格，但仍易于普通读者理解。
