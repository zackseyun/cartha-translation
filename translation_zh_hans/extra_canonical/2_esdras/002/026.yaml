id: 2ES.2.26
reference: 2 Esdras 2:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nemo ex eis interiet, ego enim eos requiram de numero tuo, Noli satagere, cum uenerit enim dies pressurae et angustiae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/026.yaml
  text: None of them will perish[a], for I will require them from your number. Do not be anxious, for when the day of distress and anguish comes,
translation:
  language: zh_hans
  text: 他们中没有一个会灭亡，因为我要从你的人数中把他们一一寻回。不要忧虑，因为困苦和患难的日子来到时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interiet
  choice: 会灭亡
  rationale: 保留拉丁语所表达的死亡或毁灭之意，也维持其末世语境中的庄重语气。
- source_word: requiram
  choice: 一一寻回
  rationale: 该词可指寻找、索求或追讨；结合“没有一个会灭亡”，译作“寻回”最自然，同时以“一一”传达逐一清点、不遗漏之意。
- source_word: de numero tuo
  choice: 从你的人数中
  rationale: 尽量保留原文较不寻常的计数表达及其歧义，不擅自具体化为“你的儿女”或“你的百姓”。
- source_word: satagere
  choice: 忧虑
  rationale: 在否定命令中表示焦急挂虑；现代汉语“不要忧虑”准确而自然。
- source_word: pressurae et angustiae
  choice: 困苦和患难
  rationale: 用两个并列词保留原文双重表达；“困苦”侧重压迫窘迫，“患难”侧重艰难危急。
theological_decisions:
- issue: “ego enim eos requiram de numero tuo”中上帝行动的性质
  choice: 我要从你的人数中把他们一一寻回
  alternative: 我要从你的人数中追讨他们
  rationale: “requiram”本身可含寻找、索求或追讨之意。上下文先说无人灭亡，故“寻回”较连贯；但不增添复活、拯救方式或群体身份等原文未明说的教义解释。
- issue: 句末未完结构
  choice: 以逗号收束，保留从句悬接
  alternative: 补足后续内容使句子完整
  rationale: 所给拉丁文本止于“当……来到时”，明显延续至下一节；不应把旧译或相邻经文的材料补入本节。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留本节句末向下一节延续的未完结构；不采用英文旧脚注中源文未包含的后续内容。
