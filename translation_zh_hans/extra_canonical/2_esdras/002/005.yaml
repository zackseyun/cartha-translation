  source_fidelity: 正文准确保留了呼求“父”为证人、证词针对孩子们的母亲，以及孩子们出于不愿而不遵守“我的约”的内容。然“我呼求你作证，指控……”在汉语句法上容易使“指控”成为父所作的另一行动，而非限定其“证人”身份；改为“作证指证”更明确地表达拉丁文的司法关系。
  naturalness: “父啊”置于呼求对象之后较符合庄重现代汉语的呼告节奏。“作证指证”虽有一定正式色彩，但在司法及经文语域中自然，并避免“作证，指控”的并列歧义。
  terminology: “我的约”恰当对应testamentum meum；“不肯遵守”准确传达noluerunt seruare的意愿性拒绝。“指证”适合在此表达证词不利于某人，而不把证人直接等同于控告者。
  issues:
  - severity: medium
    issue: “我呼求你作证，指控孩子们的母亲”中“指控”的句法角色不够明确。
    rationale: 原文是呼求父“作为证人，反对/不利于”这位母亲；现有汉语可读作呼求父去作证并去控告。改作“作证指证”使后项明确为证言所指向的对象。
  - severity: low
    issue: 脚注的“在孩子们的母亲之上”过于字面，不能构成自然汉语的可行替代译文。
    rationale: 可说明super的基本空间义及其关系义的不确定性，但应避免将不自然的逐词对应呈作中文直译。
  revised_text: 但我呼求你，父啊，作证指证孩子们的母亲，因为他们不肯遵守我的约，
  revised_footnotes:
