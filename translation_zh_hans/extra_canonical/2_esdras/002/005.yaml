  yaml_path: translation/extra_canonical/2_esdras/002/005.yaml
  text: But I call on you[a], Father, as a witness against the mother of the children, because they were unwilling to keep my covenant,
translation:
  language: zh_hans
  text: 但我呼求你，父啊，作证指证孩子们的母亲，因为他们不肯遵守我的约，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testem inuoco
  choice: 我呼求你作证
  rationale: 保留“呼求/请来作证”的司法语气，同时使现代汉语自然清楚。
- source_word: super matrem filiorum
  choice: 指控孩子们的母亲
  rationale: 在testem inuoco的司法语境中，super加宾格较可能表达敌对、控告的关系；后文的惩罚语境也支持这一理解。filiorum没有指示词，因此不增译“这些”。
- source_word: testamentum meum
  choice: 我的约
  rationale: 此处testamentum指具有约束力的约，而非现代汉语通常所说的“遗嘱”。
- source_word: noluerunt seruare
  choice: 不肯遵守
  rationale: noluerunt不仅表示没有遵守，也突出意愿上的拒绝；“不肯”比单纯“不”更准确。
theological_decisions:
- issue: super matrem filiorum的关系性质
  choice: 将父呼求为指控母亲的证人
  alternative: 理解为较中性的“关于/在……之上作证”
  rationale: 司法搭配与下一节的敌对性惩罚支持“指控”，但拉丁语介词super本身保留一定歧义，故以脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“父啊”保留直接呼告；逗号结尾承接下一节。源文开头的misericordiam是上一句残留的末词，不纳入本节正文。
