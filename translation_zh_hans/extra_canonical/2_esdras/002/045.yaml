  text: He answered and said to me, “These are the ones who have put off the mortal garment and put on the immortal, and they have confessed the name of God. Now they are being crowned and receiving palms.”
translation:
  language: zh_hans
  text: 他回答我说：“这些人脱下了必死的衣裳，穿上了不朽的衣裳，并且承认了上帝的名。如今，他们正在被加冕，并领受棕榈枝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortalem tunicam
  choice: 必死的衣裳
  rationale: tunicam本指贴身衣或长衣，此处具有比喻性；译作“衣裳”既自然，也保留原文脱下与穿上的形象。“必死的”准确表达mortalem。
- source_word: inmortalem
  choice: 不朽的衣裳
  rationale: 原文省略了第二个tunicam，中文补出“衣裳”以使“穿上”的宾语明确；“不朽”保留与“必死”相对的生命状态。
- source_word: confessi sunt nomen dei
  choice: 承认了上帝的名
  rationale: confiteri可指公开承认、宣认；“承认”在此保留其基本意义，又不额外限定为某种礼仪性“宣信”。
- source_word: coronantur
  choice: 正受冠冕
  rationale: 采用被动表达，保留拉丁文现在时被动语态；“受冠冕”在庄重经文语体中自然，并避免擅自补出授冠者。
- source_word: accipiunt palmas
  choice: 领受棕榈枝
  rationale: palmas在此指象征胜利的棕榈枝；明确译出“棕榈枝”，避免现代汉语将“掌”误解为手掌。
theological_decisions:
- issue: “脱下必死、穿上不朽”所指的具体状态
  choice: 保留衣裳的比喻，不解释为复活、殉道或灵魂状态
  alternative: 意译为“摆脱必死的身体，获得不死的生命”
  rationale: 原文以衣服意象表达转变，并未在本节明确界定其具体教义含义；直译可保留神学张力。
- issue: confessi的见证性质
  choice: 译为“承认了”
  alternative: 译为“宣认了”或“为……作了见证”
  rationale: 原文可以含公开宣认之意，但没有明确说明其方式或处境，因此不将其专门化为殉道见证或礼仪告白。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。保留“脱下／穿上”“冠冕／棕榈枝”等原文意象，并以“正”体现modo与现在时所表达的当下进行状态。
