base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/020.yaml
  text: Vindicate the widow, judge for the orphan, give to the needy, protect the fatherless, clothe the naked, care for the broken and the weak, the lame
translation:
  language: zh_hans
  text: 要为寡妇伸张正义，为孤儿主持公道；要周济穷乏的人，保护无父的孩子，给赤身的人衣服穿；要照料受伤和虚弱的人；瘸腿的人……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据拉丁文本在“瘸腿的人”之后中断，因此这里保留未完的语气，不补写后文。
    reason: 说明来源文本的句法残缺，防止读者误以为中文漏译或原句本来完整。
lexical_decisions:
- source_word: Viduam iustifica
  choice: 为寡妇伸张正义
  rationale: iustifica 在此处与弱势者受公正对待有关，译为“伸张正义”比字面上的“使……称义”更符合语境，也避免引入不相干的神学含义。
- source_word: pupillo iudica
  choice: 为孤儿主持公道
  rationale: iudica 是司法、裁断用语；“主持公道”自然表达替无依无靠者施行公正。
- source_word: egenti da
  choice: 周济穷乏的人
  rationale: 保留“给予有需要者”的实际行动，以现代汉语“周济”简洁表达。
- source_word: orfanum tuere
  choice: 保护无父的孩子
  rationale: 为与前面的 pupillus“孤儿”保持词汇区分，将 orfanum 译作“无父的孩子”；tuere 表示守护、保护。
- source_word: nudum uesti
  choice: 给赤身的人衣服穿
  rationale: 直接表达“给没有衣服的人穿上衣服”，具体且易懂。
- source_word: Confractum et debilem cura
  choice: 照料受创伤和软弱的人
  rationale: confractum 可指被摧残、受创伤的人，debilem 指软弱或衰弱者；cura 译为“照料”。
- source_word: claudum
  choice: 至于瘸腿的人……
  rationale: claudum 指跛足、瘸腿者；所给拉丁文本在该词后中断，故不补写原文未提供的谓语。
theological_decisions:
- issue: iustifica 是否采用“称义”这一神学术语
  choice: 译为“伸张正义”
  alternative: 使寡妇称义
  rationale: 上下文是一连串保护和救助弱势者的伦理命令，司法性译法更符合拉丁语境，同时避免把保罗式称义概念强加于此。
- issue: 是否为末尾 claudum 补出命令动词
  choice: 保留残句，并以省略号标示
  alternative: 将其并入 cura，译作“照料……瘸腿的人”
  rationale: 所给原文在 claudum 处骤然中止；不应无依据地补足句法。这样既保持可读性，也忠实呈现来源的不完整状态。
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语体，以重复的“要”呈现命令结构；用分号划分各项救助行动。所给拉丁文本开头的“filios tuos（你的儿女）”显然是前一语句的收尾，依本节英文本的分节不纳入正文。
