  yaml_path: translation/extra_canonical/2_esdras/002/013.yaml
  text: Ask[13], and you will receive; pray that your few days may be shortened. The kingdom is already prepared for you[a]; keep watch.
translation:
  language: zh_hans
  text: “你们祈求，就必领受；要祷告，使你们这为数不多的日子得以缩短。[a]国度已经为你们预备好了；你们要警醒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里关于“为数不多的日子得以缩短”的说法，在拉丁文中较难理解。它很可能是指现今世代或眼前患难的时期被缩短，而不是祈求自己的寿命缩短。另一种理解是：“要祷告，使你们的日子不多，并且得以缩短。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Petite et accipietis
  choice: 你们祈求，就必领受
  rationale: 保留命令式与将来应许的对应结构；“祈求”自然传达向上帝求告的语境。
- source_word: rogate uobis dies paucos ut minorentur
  choice: 要祷告，使你们这为数不多的日子得以缩短
  rationale: 按前置宾格（proleptic accusative）理解 dies paucos：它是 ut 从句逻辑上的主语，而非两个并列谓语；译文保留其末世性表达及原文略显艰涩之处。
- source_word: iam paratum est uobis regnum
  choice: 国度已经为你们预备好了
  rationale: iam 译作“已经”，paratum est 译作完成状态“预备好了”，不擅自补出国度的性质。
- source_word: uigilate
  choice: 你们要警醒
  rationale: 采用经文语域中自然且准确的命令式表达，兼含保持警觉、守望之意。
theological_decisions:
- issue: “日子缩短”所指
  choice: 不明确断定是个人寿命，而以脚注说明更可能指现今世代或患难时期的缩短
  alternative: 解释为祈求个人余生短暂
  rationale: 拉丁文本本身未明说所指；末世语境支持“时期缩短”的理解，但正文应保留真实歧义。
- issue: regnum 的所指
  choice: 译为“国度”
  alternative: 明确译为“上帝的国”或“天国”
  rationale: 原文只写 regnum；不在正文中补入拉丁文未明示的限定语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以“祈求／祷告／国度／警醒”保持经文语体，同时避免古奥句式。正文保留拉丁语句法所形成的末世性张力，并用脚注交代另一种可能理解。
