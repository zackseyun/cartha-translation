  yaml_path: translation/extra_canonical/2_esdras/002/043.yaml
  text: And in the midst of them was a young man of lofty stature, taller than all the rest, and he was placing crowns on the heads of each one of them, and he was more exalted still; and I was held in wonder.
translation:
  language: zh_hans
  text: 在他们中间，有一个身材高大的年轻人，比众人都高。他逐一把冠冕戴在他们每个人的头上；他显得更加尊高。我惊异不已。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuuenis
  choice: 年轻人
  rationale: 自然对应拉丁语“青年、年轻人”，不额外确定其身份。
- source_word: statura celsus
  choice: 身材高大
  rationale: 表达身量高而挺拔，符合现代汉语习惯。
- source_word: eminentior omnibus illis
  choice: 比众人都高
  rationale: 保留与身材高度直接相关的比较意义，同时不将其扩展为抽象地位。
- source_word: coronas
  choice: 冠冕
  rationale: 保留礼仪性、尊荣性的冠饰含义，也与本段异象语境相称。
- source_word: magis exaltabatur
  choice: 更显尊高
  rationale: 保留 exaltabatur 可指被高举或显得崇高的张力；用“更显”避免武断指定施动者。
- source_word: miraculo tenebar
  choice: 我看得惊奇不已
  rationale: 以自然汉语表达“被惊奇所攫住、充满惊异”的状态。
theological_decisions:
- issue: 年轻人的身份与尊荣性质
  choice: 不在正文中指明其身份，以“更显尊高”表达其超越众人的形象
  alternative: 译为“他又被高举得更高”或明确认定为某一弥赛亚人物
  rationale: 本节拉丁文本没有明说身份；exaltabatur 也可兼具空间高度与尊荣提升之意，因此不作教义性补足。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以短句呈现异象中人物的身量、行动与尊荣递进；没有需要添加的文本异读脚注。
