  text: and I will give you the first seat in my resurrection[23]. Pause and rest[a],
translation:
  language: zh_hans
  text: 我必在我的复活中赐你首席。[a]你要安息，静下来，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首席”直译涉及“第一个座位”，可能指在复活中享有优先地位或尊荣，并非只说坐下。
    reason: lexical_alternative
lexical_decisions:
- source_word: tibi
  choice: 你
  rationale: 与上下文中的单数受话者相应。
- source_word: primam sessionem
  choice: 首席
  rationale: sessionem 字面涉及座位或席位，primam 表示居首；“首席”既保留座次意象，也自然表达优先与尊荣，避免仅译作泛泛的“第一位”。
- source_word: in resurrectione mea
  choice: 在我的复活中
  rationale: 直译保留第一人称所属关系及介词短语的歧义，不擅自改成“在你复活时”或“在复活之日”。
- source_word: Pausa et quiesce
  choice: 你要安息，静下来
  rationale: 后期拉丁语 pausare 可指安息，尤其可带末世或死亡安息色彩；quiescere 则有安静、止息之意。译文保留近义并列而不合并。
theological_decisions:
- issue: “我的复活”所指为何
  choice: 保留“我的复活”
  alternative: 在复活中／在你复活时
  rationale: 拉丁文明确为 mea，但其具体指涉可能存在文本或诠释上的张力；译文不替原文消解。
- issue: “首席”表示座位还是复活中的优先尊荣
  choice: 正文采用兼具座席和尊荣含义的“首席”
  alternative: 第一个座位／第一位
  rationale: 原文有具体的座席词，同时语境可能指优先或尊荣；“首席”可较好保存双重可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“安息，静下来”保留拉丁文两个近义命令的并列；句末逗号依所给片段保留，表示话语尚未结束。
