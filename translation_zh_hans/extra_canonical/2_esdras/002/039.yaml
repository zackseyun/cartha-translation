base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/039.yaml
  text: Those who have passed over from the shadow of the age have received splendid garments from the Lord[a].
translation:
  language: zh_hans
  text: 那些已经脱离世代的阴影的人，从主那里领受了华美的衣袍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世代”也可译为“世界”或“时代”。
    reason: 说明拉丁文 saeculi 的词义范围，同时不在正文中将其限定为单一含义。
lexical_decisions:
- source_word: transtulerunt
  choice: 离开
  rationale: 这里表示从一种境域转移出去；“离开”自然清楚，也保留了脱离“世代阴影”的空间隐喻。
- source_word: umbra saeculi
  choice: 世代阴影
  rationale: 直译其核心意象；saeculum 可指“世代、时代”或“世界”，正文采用“世代”，不擅自增添拉丁文没有明说的“这”。
- source_word: splendidas tunicas
  choice: 华美的衣袍
  rationale: splendidas 表示光彩夺目、华美；tunicas 指衣服或长衣，用“衣袍”符合庄重语境，又不作过度具体化。
- source_word: a domino acceperunt
  choice: 已经从主那里领受了
  rationale: 准确表达来源结构 a domino 与完成时 acceperunt；“领受”适合恩赐语境。
theological_decisions:
- issue: “世代的阴影”所指为何
  choice: 保留为“世代阴影”
  alternative: 译作“尘世的阴影”或“今世的阴影”
  rationale: 拉丁文 saeculi 本身可涵盖“世代、时代、世界”的意义；正文不把它限定为特定末世论术语，以保留原文张力。
- issue: 句法是否承接上一节
  choice: 作为独立陈述句处理
  alternative: 把“那些……的人”处理为上一句的关系从句，并补出“又”
  rationale: 完整拉丁句中 Qui...transtulerunt 是主语性关系结构，acceperunt 是主句谓语；无需补出原文没有的并列连词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“世代阴影”保留原文凝练的比喻；“华美的衣袍”避免生硬直译为“灿烂的束腰衣”。
