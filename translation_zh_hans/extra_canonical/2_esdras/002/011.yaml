  text: And I will take for myself their glory[a], and I will give them everlasting tabernacles[b],
translation:
  language: zh_hans
  text: 我要取那等人的荣耀归自己，并赐给他们永恒的帐幕，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sumam mihi
  choice: 把……归给自己
  rationale: 既保留“取来归自己”的方向，也比生硬的“为自己拿取”更符合现代汉语表达。
- source_word: gloriam illorum
  choice: 那些人的荣耀
  rationale: illorum 带较强的远指意味；译作“那些人的”可保留它与后文 eis 可能存在的指代差异。
- source_word: tabernacula aeterna
  choice: 永恒的帐幕
  rationale: tabernacula 是复数，可指帐幕或居所；“帐幕”保留原文意象，aeterna 译作“永恒的”。
theological_decisions:
- issue: illorum 与 eis 是否指同一群人
  choice: 正文用“那些人的……他们”，保留代词形式上的差别，并加注说明歧义
  alternative: 将两者都译作“他们”，或明确译作“那些人的……赐给我的子民”
  rationale: 拉丁文使用不同代词，结合上文可能形成两组人的对照，但本节自身并未明说 eis 的所指；不宜在正文中完全消除或过度确定这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留原句并列结构和末尾逗号，以衔接下一节。
