  text: My hands will cover you, so that your children may not see Gehenna. Rejoice,
translation:
  language: zh_hans
  text: 我的双手必遮护你，使你的儿女不致看见革亨拿[a]。要欢喜，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “革亨拿”对应拉丁文 Gehenna；此名源于耶路撒冷附近的欣嫩子谷，后来常用来指受审判和刑罚之处。
    reason: 保留原文专名及其审判语义，同时简要说明其历史地理来源。
lexical_decisions:
- source_word: Manus meae
  choice: 我的双手
  rationale: 按拉丁文复数直译，保留说话者亲自保护的形象。
- source_word: tegent te
  choice: 必遮护你
  rationale: tegere既有遮盖也有保护之意；“遮护”兼顾动作意象和语境中的护佑含义。
- source_word: filii tui
  choice: 你的儿女
  rationale: filii可泛指子女或后裔；此处采用自然且包容的“儿女”，不把所指扩大为未经明示的“后裔”。
- source_word: gehennam
  choice: 欣嫩子谷
  rationale: Gehenna源于地名；音译并辅以脚注，保留其具体名称及审判意涵，避免直接替换为解释性的“地狱”。
- source_word: Iocundare
  choice: 要欢喜
  rationale: 准确表达单数命令式，并保留原文在本节末尾未完的衔接感。
theological_decisions:
- issue: gehennam应译作地名还是解释为终末刑罚之地
  choice: 正文译“欣嫩子谷”，脚注说明其常指受审判和刑罚之处
  alternative: 地狱
  rationale: 原词保留地名形式，同时具有引申的审判含义；正文不替作者消除这层张力。
- issue: ne所表达的结果或目的关系
  choice: “使……不致……”
  alternative: “免得……”
  rationale: 两者均可表达拉丁文结构；所选译法自然地连接遮护行动与儿女不看见欣嫩子谷这一结果，而不进一步界定其救赎机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遮护”保留双手覆盖并保护的具体意象；末尾保留逗号，以反映“Iocundare”在此开启下一段话、句意尚未完结。
