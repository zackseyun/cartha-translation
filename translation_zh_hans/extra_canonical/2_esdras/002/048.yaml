  to: 他们为主的名勇敢地站立。于是，天使对我说：“去吧，向我的子民宣告你所看见的主上帝的奇事何等奇异、何等伟大。”
  rationale: 保留首句“站立”的具体而开放的意象。后句调整语序以合乎现代汉语，并用“奇事”对应 mirabilia、“何等奇异、何等伟大”分别呈现 qualia et quanta 的平行修饰，不引入对这些奇事性质的具体化解释。
