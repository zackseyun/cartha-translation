  yaml_path: translation/extra_canonical/2_esdras/002/048.yaml
  text: They stood boldly for the name of the Lord. Then the angel said to me[a], “Go, announce to my people what and how great are the wonders of the Lord God that you have seen.”
translation:
  language: zh_hans
  text: 他们为主的名勇敢地站立。于是，天使对我说：“去吧，向我的子民宣告你所看见的主上帝的奇事何等奇异、何等伟大。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortiter
  choice: 勇敢地
  rationale: 表达坚定无畏之意，并自然修饰“站立”。
- source_word: pro nomine domini
  choice: 为主的名
  rationale: 保留拉丁文介词短语的简洁表达及“名”所承载的身份、权柄意涵，不擅自具体化为“信仰”或“缘故”。
- source_word: steterunt
  choice: 站立
  rationale: 保留其具体动作及坚守的潜在含义，不直接释作“坚持到底”。
- source_word: adnuntia
  choice: 宣告
  rationale: 体现公开传达信息的命令语气，比一般的“告诉”更庄重。
- source_word: qualia et quanta mirabilia
  choice: 那些何等奇妙、何等伟大的事
  rationale: 将qualia与quanta作为并列修饰语处理，分别表达性质与程度，同时使现代汉语流畅自然。
- source_word: domini dei
  choice: 主上帝
  rationale: 直接保留两个称号的组合，避免删减其中之一。
theological_decisions:
- issue: “为主的名站立”的具体含义
  choice: 保留“为主的名勇敢地站立”
  alternative: 为主的名勇敢地坚守／为主的名挺身而出
  rationale: 原文没有明确限定是殉道、作见证还是争战；直译式表达可保留这层开放性。
- issue: qualia et quanta的修饰关系
  choice: 两者都修饰“奇妙的事”
  alternative: 把qualia名词化为“什么事”，再另说这些奇事何等伟大
  rationale: 拉丁文中二者是并列形容语，共同限定mirabilia；中文以两个“何等”结构保留平行关系。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“去吧”传达命令中的推进感；“我的子民”自然对应populo meo。无脚注，因为正文可直接而清楚地保留原文结构与语义。
