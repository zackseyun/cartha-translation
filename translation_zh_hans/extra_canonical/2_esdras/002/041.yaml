  text: domini compleuerunt. Filiorum tuorum, quos optabas, plenus est numerus, roga imperium domini, ut sanctificetur populus tuus, qui uocatus est ab initio.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/041.yaml
  text: The number of your children[a], whom you desired, is complete. Ask for the Lord’s authority, that your people, who were called from the beginning, may be sanctified.
translation:
  language: zh_hans
  text: 你所盼望的儿女，数目已经满了。祈求主的权柄[a]，使你从起初就蒙召的子民得以成圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的权柄”所译的拉丁文也可指“主的统治”或“主权”。
    reason: 保留 imperium 在权柄、统治和主权之间的语义幅度，同时不将其改写为主施行权柄的动作。
lexical_decisions:
- source_word: optabas
  choice: 盼望
  rationale: 既表达对这些儿女的期待与渴望，又比单纯的“想要”更符合庄重语体。
- source_word: plenus est numerus
  choice: 数目已经满了
  rationale: 保留拉丁文“数目已达到满额”的意象，不将其过度解释为单纯的“人数齐了”。
- source_word: roga
  choice: 求
  rationale: 在向主祈求的语境中，自然且准确。
- source_word: imperium domini
  choice: 主施行权柄
  rationale: imperium 可指权柄、统治或主权；用动词化表达使现代汉语自然，同时保留“主的权柄发挥作用”的含义。
- source_word: sanctificetur
  choice: 得以成圣
  rationale: 保留被动或蒙受性的语义，不具体限定成圣的施行者或方式。
- source_word: uocatus est ab initio
  choice: 从起初就蒙召
  rationale: 忠实体现完成时被动结构及 ab initio 的时间含义，并采用现代中文圣经语域中易懂的“蒙召”。
theological_decisions:
- issue: “从起初就蒙召”所修饰的对象
  choice: 按拉丁文关系从句处理，修饰“你的子民”
  alternative: 将其理解为独立陈述，或与“成圣”形成较松散的关系
  rationale: qui 在性、数上与 populus 一致，语法上明确回指“子民”；中文将该从句紧接在“子民”之前，以避免歧义。
- issue: imperium domini 的表达
  choice: 主施行权柄
  alternative: 主的统治／主权／国度
  rationale: 上下文要求向主祈求某种权能的施行；“权柄”不预先限定为政治统治、国度或某一宗派性的神学概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“数目已经满了”保留原文意象；“使……得以成圣”呈现目的从句和被动语态。清理本所给文本开头的“domini compleuerunt.”看似承接前文的残句，不纳入本节正文。
