review_pass:
  verdict: revise
  source_fidelity: 正文对残缺拉丁文以校订传承和英文审校轨迹作了明示性补足，整体句意可接受。不过，英语审校文本的“heavenly kingdoms”以及其所反映的校订传承应译得较“天国”更具限定性；“天上的国度”既保留天上／属天的修饰，也避免将复数“kingdoms”解释为某一特定教义体系。
  naturalness: “从主那里领受……，并要欢欣，感谢……”自然、庄重，适合公开诵读。“天上的国度”在此语境中通顺；不必采用生硬的“诸天之国”或容易引起现代政治联想的“众国”。
  terminology: 保留“主”“荣耀”“欢欣”“感谢”等稳定的庄重宗教语体。将“天国”调整为“天上的国度”，以避免把原文／英文所保留的复数和属天限定压缩为汉语传统中常作专名理解的单数“天国”。
  issues:
  - severity: medium
    issue: “天国”未充分表达校订传承中的“heavenly kingdoms”。
    rationale: 原始拉丁片段在 ad 后中断，不能由残片独自确定目标语；但英文学术审校轨迹明确采用复数 heavenly kingdoms。译作“天上的国度”较忠实地保留其属天性质及非专名化的复数／集合含义，而不引入教义性说明。
  revised_text: 你们要从主那里领受你们荣耀的喜乐[a]，并要欢欣，感谢那召你们进入天上国度的主[b]。
  revised_footnotes:
  - marker: a
    text: 所提供的拉丁文本此处只保存“主的／从主……领受”，宾语似有脱漏；“你们荣耀的喜乐”依据现有校订层补出。
    reason: 如实标明主要名词短语并未完整保存在所提供的拉丁文本中，避免把补足内容误作确定无疑的原文。
  - marker: b
    text: 所提供的拉丁文本止于“召你们到／进入……”之前；“召”的完整表达和“天上的国度”依据本节的校订传承补出。
    reason: 交代句尾属于残缺文本的补足；“天上的国度”对应校订传承中的 heavenly kingdoms，避免将其缩为单数专名。
  revision_rationale: 仅作一项必要的语义精确化：将“天国”改为“天上的国度”。其余措辞准确传达命令、欢欣与感谢的连续劝勉，并且脚注已恰当界定残缺拉丁文本与校订性补足之间的区别。
