review_pass:
  verdict: revise
  source_fidelity: 译文的命令语气、欢欣与感谢的连续劝勉，以及“召你们进入……”的关系从句，均与所给拉丁文可见部分相符。由于所给拉丁文在领受的宾语处及 ad 之后截断，正文中“你们荣耀的喜乐”和目标语只能依校订传承及英文审校轨迹补足，脚注应继续明确这一点。英文审校轨迹的 heavenly kingdoms 以及通常所见的拉丁语 regna 均不宜在正文中压缩为单数、专门化的“天国”。
  naturalness: “你们要从主那里领受……，并要欢欣，感谢那召你们进入……的主”庄重、通顺，也适合公开诵读。“天上的国度”比“天国”更忠实地保留“heavenly kingdoms”的普通、非专门术语表达；汉语名词不必以“众”强行标示复数。
  terminology: 将“天国”改为“天上的国度”，避免把复数的 heavenly kingdoms／regna 收窄为汉语圣经传统中常具特定指向的单数术语。保留“荣耀的喜乐”，不把其属格关系解释为奖赏、所托付之物或某一特定教义性的末世福分。
  issues:
  - severity: medium
    issue: “天国”将英文审校轨迹中的 heavenly kingdoms（以及其对应的 regna）收窄为单数的固定术语。
    rationale: 原文在此处残缺，不能以残缺本身确定目标名词；但英文审校轨迹明确为复数 kingdoms。译作“天上的国度”可自然地保留其广义和数的开放性，且不引入特定教义联想。
  - severity: low
    issue: 脚注 b 将补足目标仅称为“天国”。
    rationale: 应与修订正文一致，说明补足的是“天上的国度”，并避免将英文审校轨迹的复数表达改写为单数。
  revised_text: 你们要从主那里领受你们荣耀的喜乐[a]，并要欢欣，感谢那召你们进入天上的国度的主[b]。
  revised_footnotes:
  - marker: a
    text: 所提供的拉丁文本在“领受”一词周围只保存了与“主”有关的残片，领受的宾语似有脱漏；“你们荣耀的喜乐”依据本节的校订传承及英文审校轨迹补出。
    reason: 如实区分所给拉丁残文可直接确认的内容与正文为使经文完整而采用的补足。
  - marker: b
    text: 所提供的拉丁文本止于“召你们到／进入……”之前；“天上的国度”及“召”的完整表达依据本节的校订传承及英文审校轨迹补出。
    reason: 说明句尾来自残缺处的补足；“天上的国度”保留 heavenly kingdoms 的广义表达，不将其解释为特定教义术语。
  revision_rationale: 修订仅处理“heavenly kingdoms／regna”的数与术语范围：以“天上的国度”替代“天国”。其余结构维持原译，并以脚注持续标明题供拉丁文本的首尾残缺及正文补足的依据。
