  text: Receive the joy of your glory from the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.
translation:
  language: zh_hans
  text: 你们要从主那里领受你们荣耀的喜乐[a]，并要欢欣，感谢那召你们进入天上国度的主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文本此处只保存“主的／从主……领受”，宾语似有脱漏；“你们荣耀的喜乐”依据现有校订层补出。
    reason: 如实标明主要名词短语并未完整保存在所提供的拉丁文本中，避免把补足内容误作确定无疑的原文。
  - marker: b
    text: 所提供的拉丁文本止于“召你们到／进入……”之前；“召”的完整表达和“天上的国度”依据本节的校订传承补出。
    reason: 交代句尾属于残缺文本的补足；“天上的国度”对应校订传承中的 heavenly kingdoms，避免将其缩为单数专名。
lexical_decisions:
- source_word: domini ... accipite
  choice: 从主那里领受
  rationale: 将属格 domini 按来源关系自然表达为“从主那里”；但所给拉丁文本在 accipite 前后的宾语不完整，因此不把某一具体名词说成无可争议的原文。
- source_word: iocundamini
  choice: 要欢欣
  rationale: 保留命令语气，并用庄重而通顺的现代汉语表达喜乐、欢庆之意。
- source_word: gratias agentes ei
  choice: 感谢……的主
  rationale: 以汉语伴随动作表达拉丁文现在分词结构，所感谢的对象与后面的关系从句所指同一位。
- source_word: qui uos ad
  choice: 那召你们进入天国的主
  rationale: 所给拉丁文本止于介词 ad，谓语和目标语均有缺失；此处依据经文的校订传承及审校用英文所保存的完整句意补足。
theological_decisions:
- issue: “天国”是单数还是复数
  choice: 天国
  alternative: 诸天之国／天上的众国
  rationale: 汉语圣经语体通常以“天国”表达 heavenly kingdoms；不据此引入关于多个天上国度的教义解释。
- issue: 荣耀与喜乐的关系
  choice: 你们荣耀的喜乐
  alternative: 荣耀所带来的喜乐／所托付给你们的礼物
  rationale: 依照现有校订层保留属格结构可能具有的张力，不将其明确解释成礼物、奖赏或某种特定末世福分。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的简体中文。“领受—欢欣—感谢”保留原句连续的劝勉节奏。由于所给拉丁文本首尾均不完整，正文采用校订层所保存的完整意义，脚注则明确区分可直接见于拉丁文的内容与补足部分。
