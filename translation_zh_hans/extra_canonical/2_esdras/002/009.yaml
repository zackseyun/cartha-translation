  yaml_path: translation/extra_canonical/2_esdras/002/009.yaml
  text: Remember what I did to Sodom and Gomorrah[a], whose land lies in clods of pitch and heaps of ashes. So I will give those who did not listen to me, says the Lord Almighty.
translation:
  language: zh_hans
  text: 要记住我怎样处置了所多玛和蛾摩拉；它们的土地满是沥青块和灰烬堆。我必照样处置那些不听从我的人；全能的主说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: memorare
  choice: 要记住
  rationale: 以自然的现代汉语表达拉丁文命令式，并保留劝诫语气。
- source_word: quid fecerim Sodomae et Gomorrae
  choice: 我怎样处置了所多玛和蛾摩拉
  rationale: facio 与地点名称的与格在此表示对二城所做之事；“处置”既传达审判语境，也为后句的平行结构留出空间。
- source_word: in picis glebis et aggeribus cinerum
  choice: 遍布沥青土块和灰烬堆
  rationale: 具体保留 glebis（块状土块）和 aggeribus（堆积物）的灾后景象；“遍布”自然表达土地处于这些物质之中的状态。
- source_word: sic dabo eos
  choice: 我也必照样处置那些人
  rationale: 晚期拉丁语 dare 在此语境中可有“使成、对待、处置”之意，并与前句 fecerim 构成明显呼应；直译“给那些人”在汉语中语义残缺，且容易误导。
- source_word: qui me non audierunt
  choice: 那些不听从我的人
  rationale: 圣经语境中的 audire 常兼有听取和顺从之意；“听从”准确传达其责备含义。
- source_word: dominus omnipotens
  choice: 全能之主
  rationale: 保留称号的庄重性，并准确对应 Dominus 与 omnipotens。
theological_decisions:
- issue: sic dabo eos 的审判含义
  choice: 我也必照样处置那些不听从我的人
  alternative: 我也必将那些不听从我的人交出去／给出去
  rationale: 上下文以所多玛和蛾摩拉的毁灭为范例，sic 表明同样的处置；dabo 若机械译作“给”在汉语中缺少接受者或结果补语，而“交出去”会额外引入弃绝或交付的特定观念。采用“照样处置”保留审判的严肃性，同时不具体断定其实施方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号维持前后审判范例与将来警告之间的紧密平行；末句独立处理宣告公式，使普通读者易于理解。
