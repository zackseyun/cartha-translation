  source_fidelity: 整体准确传达了命令、所多玛和蛾摩拉的毁灭性景象，以及对不听从者的同样审判。将 sic dabo eos 译为“照样处置”符合此处与前文 fecerim 的平行，避免把不完整的“给”或带有额外含义的“交出去”强加给原文。惟“如今”并非拉丁文 iacet 所明示；“沥青土块”也将 picis glebis 的“沥青块”混入“土”的意思。
