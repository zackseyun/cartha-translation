revisions:
- from: 要记住我怎样处置了所多玛和蛾摩拉；它们的土地如今遍布沥青土块和灰烬堆。我也必照样处置那些不听从我的人。这是全能之主说的。
  to: 要记住我怎样处置了所多玛和蛾摩拉；它们的土地满是沥青块和灰烬堆。我必照样处置那些不听从我的人；全能的主说。
