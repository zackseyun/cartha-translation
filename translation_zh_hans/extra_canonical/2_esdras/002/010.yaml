  yaml_path: translation/extra_canonical/2_esdras/002/010.yaml
  text: 'Thus says the Lord to Ezra: Announce to my people that I will give them the kingdom of Jerusalem, which I was going to give to Israel.'
translation:
  language: zh_hans
  text: 主对以斯拉这样说：“你要向我的子民宣告：我必把耶路撒冷的国度赐给他们，就是我原本要赐给以色列的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntia
  choice: 宣告
  rationale: 准确表达公开、郑重传达神谕的命令，较“告诉”更符合语体。
- source_word: populo meo
  choice: 我的子民
  rationale: 保留圣约群体意味，同时采用现代汉语中自然、庄重的表达。
- source_word: regnum Hierusalem
  choice: 耶路撒冷的国
  rationale: 直译拉丁文属格结构，保留其可能指以耶路撒冷为中心之国度或归属于耶路撒冷之国的含混性，不擅自释为“天国”或“王权”。
- source_word: quod daturus eram
  choice: 就是我原本要赐给……的
  rationale: 体现迂回过去将来结构所表达的原定意向，并使中文通顺。
theological_decisions:
- issue: “我的子民”与“以色列”的关系
  choice: 保留二者为不同指称，不在正文中解释其身份关系
  alternative: 将“我的子民”明确译作某一后来的群体，或把两者视为同一群体
  rationale: 原文有意将接受宣告的“我的子民”与原本的受赐者“以色列”并置；译文应保留这种神学张力。
- issue: regnum Hierusalem 的所指
  choice: 译为“耶路撒冷的国”
  alternative: “耶路撒冷王国”“耶路撒冷的王权”或“耶路撒冷的国度”
  rationale: 原文 regnum 可指国、国度或王权；“耶路撒冷的国”较自然，也未把含义限定为政治实体或抽象统治。
translation_notes:
  register: 采用现代、庄重且易懂的神谕体。以“主对以斯拉这样说”对应固定引语公式；命令句用“你要……”，保持郑重而不古奥。
