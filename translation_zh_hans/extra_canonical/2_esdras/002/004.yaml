  text: 'quoniam peccastis coram domino deo et quod malum est coram me fecistis. Modo autem quid faciam uobis? ego enim uidua sum et derelicta: ite, filii, et petite a domino'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/004.yaml
  text: because you sinned before the Lord God and did what is evil before me. But now what shall I do for you? For I am a widow and forsaken. Go, my children, and ask the Lord.
translation:
  language: zh_hans
  text: 因为你们在主上帝面前犯了罪，做了我眼中看为恶的事。如今我还能为你们做什么呢？我是寡妇，又被遗弃。去吧，我的孩子们，向主祈求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram domino deo
  choice: 在主上帝面前
  rationale: 保留 coram 的“在……面前”以及 domino deo 的双重称谓，表达行为是在上帝面前发生并受其鉴察。
- source_word: quod malum est coram me fecistis
  choice: 做了我眼中看为恶的事
  rationale: 以自然汉语保留 coram me 的判断视角，不把“我”改释为其他对象。
- source_word: uidua sum et derelicta
  choice: 我已成了寡妇，又被遗弃
  rationale: 分别保留 uidua 与 derelicta；“已成了”符合说话者对当前凄凉处境的陈述。
- source_word: petite a domino
  choice: 向主祈求
  rationale: petere a 可表示向某人请求；中文若直译“求主”容易显得宾语残缺，“向主祈求”自然且不增添原文未说明的具体所求。
theological_decisions:
- issue: petite a domino 所求内容未明
  choice: 向主祈求
  alternative: 向主求怜悯
  rationale: 拉丁文没有“怜悯”一词，因此保留请求内容的开放性，不作神学性补足。
- issue: 说话者“我”的身份
  choice: 保留第一人称，不在正文中解释
  alternative: 明确译为母亲、锡安或耶路撒冷
  rationale: 本节只以寡妇和被遗弃者自述；不在译文中加入原文未明说的身份解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我还能为你们做什么呢”传达 Modo autem quid faciam uobis? 在当前绝境中的反问语气；“去吧，我的孩子们”保留亲子称呼及命令语气。
