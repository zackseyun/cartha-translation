  text: and I will show mercy to them, because I am merciful, says the Lord Almighty.
translation:
  language: zh_hans
  text: “我必怜悯他们，因为我是有怜悯的。”全能的主说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misericordiam ... faciam
  choice: 我要怜悯
  rationale: 按拉丁语直译为“施行怜悯”，中文用“怜悯”作动词更自然，并保留主动施怜悯的含义。
- source_word: misericors
  choice: 满有怜悯
  rationale: 保留与前一句“怜悯”的词根呼应，同时用现代汉语自然表达主语所具有的怜悯属性。
- source_word: dominus omnipotens
  choice: 全能的主
  rationale: 准确对应拉丁语称号，措辞庄重且为现代中文读者熟悉。
theological_decisions:
- issue: 上帝施怜悯的理由
  choice: 保留“因为我满有怜悯”的自我宣告
  alternative: 改写为“因为我愿意怜悯人”
  rationale: 原文强调上帝本身是 misericors，而不只是表达一时的意愿；译文不进一步解释其神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留原文中 misericordiam 与 misericors 的重复呼应。所给拉丁文本开头的“latibulis terrae”属于前文残句，末尾的“Amplectere natos”属于后文起句，均未纳入本节正文。
