  yaml_path: translation/extra_canonical/2_esdras/002/046.yaml
  text: And I said to the angel[a], “Who is that young man who places crowns on them and palms in their hands?”
translation:
  language: zh_hans
  text: 我对天使说[a]：“那位给他们戴上冠冕，并把棕榈枝放在他们手中的年轻人是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是我对天使说”。
    reason: Et 是普通并列连词；汉语叙事中可依篇章衔接译作“于是”，但正文不将其固定译出。
lexical_decisions:
- source_word: Et dixi
  choice: 我……说
  rationale: Et 是普通并列连词，承接上文可自然译出而不必机械加“然后”；正文保留流畅的汉语叙事，脚注说明也可译作“于是我说”。
- source_word: ille iuuenis
  choice: 那位……年轻人
  rationale: ille 具有指示作用，iuuenis 指年轻男子；“那位年轻人”自然、庄重，并保留人物身份尚待说明的语气。
- source_word: coronas inponit
  choice: 把冠冕戴在他们头上
  rationale: inponere 指放置于其上；结合冠冕，汉语以“戴在……头上”最自然，也清楚表达加冠动作。
- source_word: palmas in manus
  choice: 把棕榈枝放在他们手里
  rationale: palmas 在此指作为得胜象征的棕榈枝；补出汉语所需的动词“放”，表达拉丁文中由 inponit 统摄的并列成分。
theological_decisions:
- issue: palmas 的象征含义
  choice: 棕榈枝
  alternative: 得胜的棕树枝
  rationale: 正文只译具体物件，不把得胜等象征解释直接写入，以免增添原文未明说的神学诠释。
- issue: 年轻人的身份
  choice: 保留为“那位年轻人”
  alternative: 预先称为基督或上帝的儿子
  rationale: 本节以疑问提出其身份，译文不提前用后文或解释性称谓消除叙事悬念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“冠冕”保留经文语体，“棕榈枝”避免把 palma 误解为手掌。正文中的脚注标记与脚注相对应。
