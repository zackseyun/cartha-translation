  text: Mother, with your children, because I will deliver you, says the Lord.
translation:
  language: zh_hans
  text: 母亲啊，连同你的儿女[a]，因为我要救你——主说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在“母亲啊，连同你的儿女”处没有明说相应的动作；本译文保留这一省略或断裂，不补作“欢喜”等词。
    reason: 说明原文真实的句法困难，并防止读者误以为译文遗漏了一个明确存在的动词。
lexical_decisions:
- source_word: mater
  choice: 母亲啊
  rationale: 按呼格处理；用“啊”自然标示直接呼唤，同时不补入原文没有的称谓或命令。
- source_word: cum filiis tuis
  choice: 和你的儿女们一起
  rationale: 保留 cum 短语的伴随意义；filiis 在此可包括子女，译作“儿女们”比单译“儿子们”更符合语境且不缩窄所指。
- source_word: eripiam
  choice: 救
  rationale: 表达从危险或困境中解救的核心意义；“救”简洁庄重，不额外限定具体的救援方式。
- source_word: dicit dominus
  choice: 主说
  rationale: 采用简洁庄重的先知性宣告格式，忠实对应拉丁文。
theological_decisions:
- issue: te 的单数所指
  choice: 译作单数“你”，直接指向受呼唤的“母亲”
  alternative: 按母亲及其儿女的群体意义扩译为“你们”
  rationale: 拉丁文 te 明确为单数；即使“母亲”可能具有群体或象征意义，译文仍保留原文的语法张力，不将其解释性改为复数。
- issue: 开头省略成分或句法断裂
  choice: 保留“母亲啊，和你的儿女们一起”这一未明说动作的结构
  alternative: 补作“母亲啊，你要和你的儿女们一起欢喜”或“待在一起吧”
  rationale: 现存拉丁文本没有相应动词；不补入“欢喜”或其他命令，以免把文本残缺或省略之处武断地确定下来。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。破折号突出“主说”作为宣告公式，同时尽量保留原文前半句的突兀和未决性。
