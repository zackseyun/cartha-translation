id: 2ES.2.16
reference: 2 Esdras 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et resuscitabo mortuos de locis suis et de monumentis educam illos, quoniam cognoui nomen meum in illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/016.yaml
  text: And I will raise the dead from their places[16], and I will bring them out from the tombs[a], because I have known my name in them.
translation:
  language: zh_hans
  text: 我要使死人从他们各自所在之处复活[a]，领他们从坟墓中出来，因为我在他们身上认出了我的名。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节仅有拉丁文见证。
    reason: textual_variant
  - marker: b
    text: 拉丁文直译近于“因为我在他们里面知道了我的名”，措辞不寻常；也有人理解为“因为我的名在他们中被人认识”，或推测原意为“因为他们认识了我的名”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: resuscitabo mortuos
  choice: 使死人……复活
  rationale: 直接表达使死者重新起来、复生的意思，既符合拉丁文，也自然庄重。
- source_word: de locis suis
  choice: 从他们各自所在之处
  rationale: 保留 suis 所表达的归属或各自之意，不把 locis 具体化为原文没有明说的地点。
- source_word: de monumentis educam illos
  choice: 领他们从坟墓中出来
  rationale: monumenta 在此语境指墓穴或坟墓；educam 表示从里面带出、领出。
- source_word: cognoui nomen meum in illis
  choice: 我在他们身上认出了我的名
  rationale: 将完成式 cognoui 理解为认出、辨认出，使中文可读，同时保留“我的名在他们里面/身上”这一不寻常表述及其主体关系。
theological_decisions:
- issue: 上帝与其名在复活之人身上的关系
  choice: 因为我在他们身上认出了我的名
  alternative: 因为我的名在他们中被人认识；因为他们认识了我的名
  rationale: 现存拉丁文以“我”为 cognoui 的主语，不宜无文本依据地改成被动式或以“他们”为主语。正文采用可成立的晚期拉丁文语义“认出”，脚注说明其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“各自所在之处”与“坟墓中”保留原句两组地点表达；末句正文不擅自改换主语，并以脚注呈现其真实歧义。
