  text: Bear witness[a], bear witness, O heaven and earth, for I have put away evil and created good, because I live, says the Lord.
translation:
  language: zh_hans
  text: “请天地作证，请作证！因为我已经除去恶，创造了善；因为我活着。”主说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Testare, testare caelum et terram
  choice: 请天地作证，请天地作证
  rationale: 拉丁文以两个连续的单数命令式 testare 强调呼召作证；将 caelum et terram 理解为其宾语，既合语法，也保留重复所表达的急切和庄重。
- source_word: omisi malum
  choice: 我已经除去恶
  rationale: omisi 可表示放下、撇开或除去；“除去”与后面的“创造”构成清楚而不失庄重的对照。
- source_word: creaui bonum
  choice: 创造了善
  rationale: 直译 creavi 与 bonum，保留“恶”与“善”、“除去”与“创造”的对称张力。
- source_word: quia uiuo ego
  choice: 因为我活着
  rationale: 按字面保留 quia 的因果表达及 ego 的强调意味，不擅自改写成较常见的起誓套语“我指着永生起誓”。
theological_decisions:
- issue: “因为我活着”是否应处理为神圣起誓公式
  choice: 保留“因为我活着”
  alternative: “我指着我的永生起誓”或“我确实活着”
  rationale: 原文含 quia（因为），并非标准的“我指着我的永生起誓”形式；直译可保留其不寻常的因果关系和神学张力。
- issue: 天地是受命作证，还是有人受命召天地作证
  choice: 将“天地”处理为被召来作证的对象
  alternative: “天地啊，要作证，要作证”
  rationale: testare 是单数命令式，而“天和地”是两个并列名词；因此将其视为 testare 的宾语在语法上更自然。脚注保留另一种修辞性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请天地作证”的重复完整对应原文重复命令式；分号帮助呈现两个 quia 从句与前文的层次。
