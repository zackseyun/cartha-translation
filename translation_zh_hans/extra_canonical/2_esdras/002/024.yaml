  text: My people, for your rest will come. Good nurse, nourish your children, and strengthen their feet.
translation:
  language: zh_hans
  text: 我的子民啊，因为你的安息将要来临。善良的乳母啊，要养育你的儿女，使他们的脚健壮。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文摘录止于“要养育”（nutri）；“你的儿女，使他们的脚健壮”依据经审校的英文参照层所保存的本节续文译出。
    reason: 明确交代本次所给拉丁文底本摘录不完整，避免把参照层补足的文字误称为直接见于所提供的拉丁文。
lexical_decisions:
- source_word: populus meus
  choice: 我的子民啊
  rationale: 保留单数集合名词所表达的整体性，并用“啊”自然呈现直接呼语。
- source_word: requies tua
  choice: 你的安息
  rationale: “安息”既可表达停止劳苦、得享休憩，也保留可能具有的末世性意味，不将其窄化为一般的“休息”。
- source_word: Nutrix bona
  choice: 善良的乳母啊
  rationale: 按拉丁文呼格理解，保留“乳母／养育者”的具体形象及称呼语气。
- source_word: nutri
  choice: 要养育
  rationale: 用现代汉语中自然庄重的命令表达，涵盖喂养和抚育之意。
- source_word: confirma pedes eorum
  choice: 使他们的脚强健
  rationale: 依英语审校层所保存的拉丁语续文含义，保留“脚”这一身体意象，不释义为较抽象的“使他们站立得稳”。
theological_decisions:
- issue: “安息”的含义
  choice: 保留“安息”
  alternative: 你的休息／你得解脱的日子
  rationale: 原文 requies 可兼有休息、安宁与终末安息等意味；译文不替读者判定其神学范围。
- issue: “乳母”所指对象
  choice: 保留为未明确身份的呼语
  alternative: 明确解释为锡安、教会或某位领袖
  rationale: 本句本身没有点明“乳母”的身份，不应加入特定宗派或解释传统的认定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两处呼语均以“啊”呈现；整体尽量贴近拉丁文结构，同时保持汉语可读性。
