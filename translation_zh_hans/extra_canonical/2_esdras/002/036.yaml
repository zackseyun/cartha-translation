  text: uestrae; ego testor palam saluatorem meum. Commendatum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/036.yaml
  text: Flee the shadow of this age; receive the gladness of your glory[a]. I openly call my Savior to witness.
translation:
  language: zh_hans
  text: 你们要逃离这世代的阴影，领受你们荣耀的喜乐。我公开请我的救主作证。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: umbra saeculi huius
  choice: 这世代的阴影
  rationale: 保留“阴影”这一意象；saeculum 在此指现今的世代或时代，而非单纯的物质世界。
- source_word: iucunditatem gloriae vestrae
  choice: 你们荣耀的喜乐
  rationale: 按拉丁语属格结构直译，并以自然汉语表达因荣耀而有、属于荣耀的喜乐，不额外限定“荣耀”的具体性质。
- source_word: testor ... saluatorem meum
  choice: 请我的救主作证
  rationale: testor 后接人称宾格时是“请某人作证、援引某人为证”的惯用结构，不宜译成“为我的救主作见证”。
- source_word: palam
  choice: 公开
  rationale: 表达当众、明白公开之意，并修饰“请……作证”。
theological_decisions:
- issue: “我的救主”在句中的角色
  choice: 作为被郑重请来作证者
  alternative: 说话者公开为救主作见证
  rationale: 拉丁语 testor 与宾格 saluatorem meum 的句法支持“请救主作证”；这样也避免把原文的司法性、宣告性措辞改成一般见证陈述。
- issue: “你们荣耀的喜乐”的关系
  choice: 保留属格的宽泛关系
  alternative: 明确译为“将来得荣耀的喜乐”或“救恩的喜乐”
  rationale: 原文未明确说明荣耀的时间或神学内容，因此不作超出文本的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“你们要……”传达劝告语气，保留“世代的阴影”这一鲜明意象。所给清理拉丁文本从 gloriae vestrae 的末词及下一句开始，但前两分句可由该节经校勘的连续文本及咨询层确认。
