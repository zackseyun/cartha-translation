  text: transtulerunt, splendidas tunicas a domino acceperunt. Recipe, Sion, numerum tuum et conclude candidatos tuos, qui legem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/040.yaml
  text: Receive your number[40], Zion, and gather in your white-robed ones[a], who have fulfilled the law of the Lord.
translation:
  language: zh_hans
  text: 锡安啊，接纳你的人数[a]，并收聚你那些身穿洁白衣袍的人[b]，就是那些已经遵行了主的律法的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的人数”直译为“你的数目”；也可指属于锡安、被数点的全体人众。
    reason: 保留 numerum tuum 在“数目”与“被数点的人群”之间的含混。
  - marker: b
    text: “身穿洁白衣袍的人”也可直译为“穿白衣者”；拉丁词还可作“候选者”解。这里按异象中的白衣形象翻译。
    reason: 说明 candidatos 的白衣词源意象及另一词义，而不在正文指定其身份。
lexical_decisions:
- source_word: Recipe
  choice: 接纳
  rationale: 保留命令语气；此处不仅是抽象的“接受”，也是锡安迎接属自己之人的图景。
- source_word: numerum tuum
  choice: 属于你的数目
  rationale: 直译并保留拉丁文略显含混的“数目”意象，避免擅自解释为某一特定群体或预定名额。
- source_word: conclude
  choice: 聚拢起来
  rationale: 该词本义可指围住、收拢或纳入；在锡安迎接众人的语境中，“聚拢起来”自然，同时没有过度强化禁闭意味。
- source_word: candidatos tuos
  choice: 你那些身穿洁白衣袍的人
  rationale: candidatos 与耀眼洁白及穿白衣有关；结合异象中的衣袍意象，明说洁白衣袍比泛称“穿袍的人”更充分传达词义。
- source_word: qui legem [domini impleverunt]
  choice: 他们已经遵行了主的律法
  rationale: 所给拉丁文本在 qui legem 处截断；依据经文连续文本及审校用英文补足其谓语和 domini。中文用“遵行”自然表达履行律法，而不额外引入无罪或功德圆满的含义。
theological_decisions:
- issue: “遵行／成全律法”的程度含义
  choice: 遵行了主的律法
  alternative: 完全成全了主的律法
  rationale: “遵行”可表达履行而不把句子系统化为绝对无罪或某种特定功德论，保留原句的神学张力。
- issue: 白衣者的身份
  choice: 仅译作身穿洁白衣袍的人
  alternative: 明确解释为受洗者、殉道者或得胜者
  rationale: 拉丁词带有白衣形象，但本句没有明定这些人的具体身份；正文不导入后期或宗派性的身份解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。呼语“锡安啊”保留经文语体；“聚拢起来”比生硬的“圈闭”更符合迎接群体的场景。所给拉丁引文末尾残缺，因此译文对末句的补足参考了经文连续文本与经审校的英文咨询层。
