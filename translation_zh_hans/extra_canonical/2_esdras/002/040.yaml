  naturalness: 原文庄重自然，但分号后的“他们”把拉丁文限定性关系从句稍微改成了独立陈述。改作“就是那些……”能在现代中文中更清楚地维持其对“白衣者”的限定。
  terminology: “锡安”“主的律法”“白袍”均合乎现代汉语圣经语体。白衣者不应在正文具体界定为受洗者、殉道者等；脚注保留“候选者”的词义可能即可。
