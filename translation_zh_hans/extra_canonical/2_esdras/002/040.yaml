revisions:
- from: 锡安啊，接纳属于你的数目[a]，把你那些身穿洁白衣袍的人聚拢起来[b]；他们已经遵行了主的律法。
  to: 锡安啊，接纳你的人数[a]，并收聚你那些身穿洁白衣袍的人[b]，就是那些已经遵行了主的律法的人。
  rationale: 修订仅提升中文的自然度并更贴近拉丁句法：“你的人数”取代较解释性的“属于你的数目”；“就是那些”恢复关系从句对前面群体的限定。保留白衣意象及其脚注中的词义说明，也保留原文未明说的群体身份。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:05:21Z'
