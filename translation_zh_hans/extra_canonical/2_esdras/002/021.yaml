  yaml_path: translation/extra_canonical/2_esdras/002/021.yaml
  text: Do not mock; shelter the lame and the blind[a], admit them to the sight of my glory. Keep the old and the young within your walls.
translation:
  language: zh_hans
  text: 不要嘲笑[a]；要庇护肢体残缺的人，让盲人得以瞻仰我的荣光。要把老人和年轻人都保守在你的城墙之内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节拉丁文本没有明说“嘲笑”的对象；按上下文，也可理解为“不要嘲笑跛脚的人”。
    reason: 说明原文因分节而留下的宾语省略，并保留上下文可能的理解。
lexical_decisions:
- source_word: inridere noli
  choice: 不要嘲笑
  rationale: 保留拉丁文否定命令的简洁形式；本节所给文本没有明说嘲笑的对象。
- source_word: tutare mancum
  choice: 要保护残疾人
  rationale: tutare 表示保护、照料；mancum 指肢体有残缺或行动不便的人，用现代且尊重人的称呼表达。
- source_word: caecum ad uisionem claritatis meae admitte
  choice: 使盲人得见我的荣光
  rationale: 直达原文“准许盲人进入观看我荣光的境地”之意，以自然汉语表达，同时保留由神使其得见的含义。
- source_word: Senem et iuuenem
  choice: 老人和年轻人
  rationale: 两个单数名词具有类别性的概括意义，汉语以泛指形式表达。
- source_word: intra muros tuos serua
  choice: 守护在你的城墙内
  rationale: serua 可指保守、保护；intra muros 明确是城墙范围以内，译文兼顾地点与安全保护的语义。
theological_decisions:
- issue: “得见我的荣光”是否明确表示医治盲眼
  choice: 保留为“使盲人得见我的荣光”
  alternative: 译作“领盲人来瞻仰我的荣光”
  rationale: 原文既可呈现进入观看的许可，也可能暗含超自然地得见；不把它明确限定为身体医治或仅为引领参加敬拜。
- issue: 禁止嘲笑的对象
  choice: 正文不补出对象，并加注说明
  alternative: 补译为“不要嘲笑跛脚的人”
  rationale: 所提供的本节拉丁文本未出现宾语；虽然上下文及旧有分节可能使前节末尾的 claudum 成为隐含对象，但正文不宜无标记地补入。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“残疾人”“盲人”避免贬损性旧称；句式保持命令语气，并以分号呈现原文连续劝令。
