  text: generatio eorum fiat. Dispergantur in gentes, nomina eorum deleantur a terra, quoniam spreuerunt testamentum meum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/007.yaml
  text: May their offspring cease. Let them be scattered among the nations; let their names be blotted out from the earth, because they despised my covenant.
translation:
  language: zh_hans
  text: 愿他们的后代断绝[a]。愿他们分散到列国之中；愿他们的名从地上被抹去，因为他们藐视了我的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本此处直译近于“愿他们的世代形成（或：愿他们的后代出现）”，但按上下文通常理解为愿其后代断绝；原文可能有讹误或缺字。
    reason: 保留 generatio eorum fiat 的字面意义与上下文解释之间的真实文本歧义。
lexical_decisions:
- source_word: generatio eorum fiat
  choice: 愿他们的后代断绝
  rationale: generatio 在这里取“后代、族类”之意；结合下文一连串审判性的祈愿，以自然庄重的中文译为“愿……断绝”。不过，现存拉丁文本的 fiat 本身没有明说“断绝”，故以脚注保留文本疑难。
- source_word: Dispergantur in gentes
  choice: 愿他们分散到列国之中
  rationale: 保留拉丁文被动祈愿语气；gentes 译作圣经语体中自然且准确的“列国”。
- source_word: nomina eorum deleantur a terra
  choice: 愿他们的名从地上被抹去
  rationale: deleantur 表示擦除、除灭；“名”用单数集合表达符合现代汉语，也保留从地上消失的强烈意象。
- source_word: spreuerunt testamentum meum
  choice: 他们藐视了我的约
  rationale: spreuerunt 表示轻蔑、弃绝；“藐视”兼顾其态度和行为。testamentum 在此译为“约”。
theological_decisions:
- issue: 开头短句是否明确表达后代断绝
  choice: 正文按审判语境译为“愿他们的后代断绝”，并加注说明拉丁文本的字面疑难
  alternative: 直译为“愿他们的世代形成”或“愿他们的后代出现”
  rationale: 直译会与紧接的咒诅性祈愿明显冲突，也不符合经审核的英译所反映的上下文判断；但拉丁文表面缺少否定或“止息”动词，因此不能默默掩盖这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句式，三个“愿”呈现原文连续的审判性命令/祈愿。避免过度古雅，同时保留“列国”“约”等稳定的圣经用语。
