  yaml_path: translation/extra_canonical/2_esdras/002/047.yaml
  text: He answered and said to me[47], “He is the Son of God, whom they confessed in the age.” Then I began to magnify those who had stood bravely for the name of the Lord.
translation:
  language: zh_hans
  text: 他回答我说：“他就是上帝的儿子[a]，是他们在世时所承认的那一位。”于是，我开始颂扬那些曾为主的名勇敢站立的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里明确把戴冠的人物认定为“上帝的儿子”，是本章较晚的基督教编写层次所具有的显著特征；不应未经审慎辨析，就把这一认定反向套用于第3—14章的犹太启示文学部分。
    reason: compositional_layer
lexical_decisions:
- source_word: ipse est filius dei
  choice: 他就是上帝的儿子
  rationale: “ipse”在此有明确指认和强调作用，用“就是”自然传达；“filius dei”直译为“上帝的儿子”。
- source_word: quem in saeculo confessi sunt
  choice: 是他们在世上所承认的那一位
  rationale: 保留关系从句的指向和“confessi sunt”的公开承认含义；“in saeculo”可指今世、世间或时代，此处译作“在世上”，不把其限定为某一特定末世论时期。
- source_word: magnificare eos coepi
  choice: 我开始颂扬那些……的人
  rationale: “magnificare”在此表示称扬、尊崇；“颂扬”比字面的“使之为大”更符合现代汉语。
- source_word: fortiter steterunt
  choice: 勇敢站立
  rationale: 依据经审校的英语咨询文本补足所给拉丁片段在“qui”之后缺失的内容，同时保留“站立”的具体意象，不扩释为某种特定形式的殉道或争战。
theological_decisions:
- issue: 戴冠者的身份
  choice: 明确译为“上帝的儿子”
  alternative: 将其泛化为“上帝之子般的人物”或“受膏者”
  rationale: 拉丁文“filius dei”明确作此认定，不宜因文本层次问题而弱化正文措辞。
- issue: “in saeculo”的时间或空间含义
  choice: 译为“在世上”
  alternative: “在这个时代”或“在今世”
  rationale: 拉丁词组本身有一定语义幅度；“在世上”在现代汉语中自然，并避免过度确定其末世论时段。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“颂扬”和“勇敢站立”保留原文的赞誉语气与形象表达。所给拉丁文本止于关系代词“qui”，末句余文依据经审校的英语咨询层补足，因此没有进一步增添具体历史或教义解释。
