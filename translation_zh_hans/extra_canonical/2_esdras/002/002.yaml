  yaml_path: translation/extra_canonical/2_esdras/002/002.yaml
  text: The mother who bore them says to them, “Go, children, for I am a widow and forsaken.”
translation:
  language: zh_hans
  text: 生下他们的母亲对他们说：“去吧，孩子们，因为我是寡妇，又被遗弃。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater, quae eos generauit
  choice: 生养他们的母亲
  rationale: 准确表达关系从句“生了他们的母亲”；“生养”在现代汉语中自然庄重，也保留母亲与孩子之间的亲缘关系。
- source_word: ite, filii
  choice: 去吧，孩子们
  rationale: “去吧”传达复数命令式 ite；filii 作直接称呼，译为“孩子们”，不增添原文没有的“我的”。
- source_word: uidua sum
  choice: 我已成了寡妇
  rationale: 表达其当前寡居状态；加入“成了”使中文自然，并与下文的遭遇状态协调。
- source_word: derelicta
  choice: 被人遗弃
  rationale: 保留该词的被动含义；补出泛指施事“人”以符合现代汉语习惯，但不指定遗弃者。
theological_decisions:
- issue: “母亲”所指的身份
  choice: 不在正文中明确其象征对象
  alternative: 将“母亲”解释性地译作某一城、民族或群体
  rationale: 本节拉丁文本只称其为“母亲”，正文应保留上下文中的象征张力，不把解释写进译文。
- issue: “寡妇”与“被遗弃”的关系
  choice: 并列保留两种状态
  alternative: 将后一项解释为前一项的同义复述
  rationale: 原文以 et 连接 uidua 与 derelicta，应分别呈现，不合并或神学化解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语简洁有力；不添加“我的”，忠实保留原文称呼形式。
