  naturalness: “生下他们的母亲”准确且符合现代汉语；“我是寡妇，又被遗弃”自然、庄重，并清楚保留两个并列状态。
  terminology: “寡妇”对应 uidua 恰当；“被遗弃”对应 derelicta，且没有擅自指定遗弃者。“孩子们”保留 filii 的称呼功能，未添加“我的”。
