  yaml_path: translation/extra_canonical/2_esdras/002/019.yaml
  text: and as many springs flowing with milk and honey[a], and seven mighty mountains having roses and lilies, in which I will fill your children with joy.
translation:
  language: zh_hans
  text: 又有同样多的泉源，流着奶和蜜；还有七座巍峨的山，山上有玫瑰和百合[a]。在那里，我要使你的儿女充满喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文直译为“有玫瑰和百合”，其中两个花名均为单数，可作集合意义理解。
    reason: 说明原文单数形式及译文按集合意义处理，保留其形式上的细微差异。
lexical_decisions:
- source_word: totidem fontes
  choice: 同样多的泉源
  rationale: 保留 totidem 所表达的“数目相同”，其比较对象由上文提供；“泉源”自然且符合庄重语体。
- source_word: fluentes lac et mel
  choice: 流着奶和蜜
  rationale: 直接表达泉源所流出的内容，保留经文意象，不把它弱化为一般的丰盛。
- source_word: montes inmensos septem
  choice: 七座巍峨的山
  rationale: 保留明确数目；inmensos 表示巨大、宏伟，“巍峨”在现代汉语中自然地修饰山。
- source_word: habentes rosam et lilium
  choice: 长满玫瑰和百合
  rationale: 拉丁文直译为“有玫瑰和百合”；以“长满”自然呈现山上花木繁盛的景象，同时将单数植物名词按集合意义译出。
- source_word: in quibus
  choice: 在那里
  rationale: 其先行词在语法上可指前述复数地点；汉语用“在那里”保留空间意义，并避免生硬的“在其中”。
- source_word: gaudio replebo
  choice: 使……充满喜乐
  rationale: 对应 replebo 的“充满”及 gaudio 的喜乐含义，并保留使役结构。
theological_decisions:
- issue: “in quibus”的所指范围
  choice: 在那里
  alternative: 在那些山中
  rationale: 拉丁文关系代词 quibus 为复数，最直接可回指七座山，但也可能笼统承接前述景象；“在那里”既忠于地点含义，也不将所指范围限定得超过原文。
- issue: “rosam et lilium”的数
  choice: 玫瑰和百合
  alternative: 一朵玫瑰和一朵百合
  rationale: 拉丁文虽用单数，但植物名称常具集合意义；上下文描绘丰盛景象，不宜强行理解为每种仅一朵。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奶和蜜”比“乳与蜜”更贴近日常现代汉语，同时保持传统经文意象；分号和句号用于理清并列景象与应许之间的关系。所给拉丁文本开头的 fructibus 看来属于前一语句或抄录分节的残余，本节正文依其完整句法从 Et totidem fontes 起译。
