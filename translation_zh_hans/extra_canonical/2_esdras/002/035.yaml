id: 2ES.2.35
reference: 2 Esdras 2:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia lux perpetua lucebit uobis per aeternitatem temporis. Fugite umbram saeculi huius, accipite iocunditatem gloriae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/035.yaml
  text: For everlasting light will shine for you through all eternity. Flee the shadow of this age; receive the joy of glory.
translation:
  language: zh_hans
  text: 因为永恒的光必为你们照耀，直到永永远远。你们要逃离这个世代的阴影，领受荣耀的喜乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lux perpetua
  choice: 永恒的光
  rationale: 直译为“永恒的光”，自然庄重，也保留此光恒久不息的含义。
- source_word: lucebit uobis
  choice: 必为你们照耀
  rationale: 保留将来时与受益对象“你们”，并用“必”表达拉丁文陈述的确定语气。
- source_word: per aeternitatem temporis
  choice: 直到永永远远
  rationale: 原文强调贯穿时间的永恒；采用现代中文中自然且庄重的惯用表达，避免生硬的“历经时间的永恒”。
- source_word: Fugite
  choice: 你们要逃离
  rationale: 保留复数命令语气；“逃离”准确传达主动避开的紧迫感。
- source_word: umbram saeculi huius
  choice: 这个世代的阴影
  rationale: saeculum 可指时代、世代或现世；“这个世代”保留其时代性与末世张力，不擅自解释为物质世界。
- source_word: accipite
  choice: 领受
  rationale: 既可表达接受赐予之物，也符合庄重的经文语体。
- source_word: iocunditatem gloriae
  choice: 荣耀的喜乐
  rationale: 保留属格结构的开放性，不将其限定为“因荣耀而有的喜乐”或“荣耀中的喜乐”。
theological_decisions:
- issue: “这个世代”的含义
  choice: 这个世代
  alternative: 今世
  rationale: 选择较贴近 saeculi huius 的措辞，既可指当前时代，也保留与将来永恒之光的对照，不把它过早系统化为特定的两世论术语。
- issue: “荣耀的喜乐”中属格关系
  choice: 保留“荣耀的喜乐”
  alternative: 荣耀中的喜乐
  rationale: 拉丁文 gloriae 可有多种属格关系；直保留中文属格结构，以免将其唯一解释为空间、来源或对象关系。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。首句保留 quia 的承接/说明意味，用“因为”连接上文；两项复数命令采用“你们要……”与省略重复主语的并列结构，使中文自然有力。
