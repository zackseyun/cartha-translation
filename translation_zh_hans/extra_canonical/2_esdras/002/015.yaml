  text: Mater, complectere filios tuos, educa illos cum laetitia sicut columba, confirma pedes eorum, quoniam te elegi, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/015.yaml
  text: Mother, embrace your children; bring them up with gladness like a dove; strengthen their feet, for I have chosen you, says the Lord.
translation:
  language: zh_hans
  text: 母亲啊，拥抱你的儿女；要像鸽子一样欢喜地养育他们；要使他们的脚站稳，因为我拣选了你。主说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater
  choice: 母亲啊
  rationale: 保留直接呼告及母性称谓；加“啊”使现代汉语中的呼语自然、庄重。
- source_word: complectere
  choice: 拥抱
  rationale: 直接表达环抱、怀抱之意，兼有亲爱与保护的色彩。
- source_word: educa
  choice: 养育
  rationale: 在此指将儿女抚养成人；“养育”比单纯“教育”更符合语境。
- source_word: cum laetitia
  choice: 欢欢喜喜地
  rationale: 传达带着喜乐、欣然养育的方式，语言自然且富有温度。
- source_word: sicut columba
  choice: 像鸽子一样
  rationale: 保留原文明确的明喻，不擅自解释鸽子所象征的具体品质。
- source_word: confirma pedes eorum
  choice: 使他们的脚站稳
  rationale: 保留“脚”的具象意象，同时以“站稳”自然传达 confirma 所指的坚固、稳固。
- source_word: elegi
  choice: 拣选
  rationale: 准确传达主动选择，在圣经语体中庄重而通行，不额外限定拣选的目的。
- source_word: dicit dominus
  choice: 这是主说的
  rationale: 采用自然、庄重的汉语先知宣告公式，明确话语来源。
theological_decisions:
- issue: “我拣选了你”的对象与目的
  choice: 保留第二人称单数“你”，不补明身份或拣选目的
  alternative: 解释为拣选母亲、锡安或某一群体承担特定使命
  rationale: 拉丁文仅有 te elegi，没有进一步界定对象的象征身份或拣选目的；译文保留这一开放性。
- issue: 鸽子比喻的作用范围
  choice: 译作“要像鸽子一样，欢欢喜喜地养育他们”
  alternative: 将“像鸽子一样”专门解释为温柔保护、聚集或多产
  rationale: 原文 sicut columba 的具体比拟点并未明说，译文保留明喻而不加入神学或象征性阐释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以分号呈现连续命令，以句号分开主的宣告；保留母亲、鸽子、脚等原文具象意象，同时避免生硬的拉丁语序。
