id: 2ES.2.27
reference: 2 Esdras 2:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: alii plorabunt et tristes erunt, tu autem hilaris et copiosa eris. Zelabunt gentes et nihil aduersus te poterunt, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/027.yaml
  text: Others will weep and be sorrowful[a], but you will be cheerful and abundant. The nations will be jealous, and they will be able to do nothing against you, says the Lord.
translation:
  language: zh_hans
  text: 别人将要哀哭忧愁，你却要欢喜丰足。列国必嫉妒你，却不能对你怎样。这是主说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: alii
  choice: 别人
  rationale: 直译为“其他人、别人”，与后文第二人称“你”形成对照。
- source_word: plorabunt et tristes erunt
  choice: 将要哀哭忧愁
  rationale: 保留两个并列概念：外在的哀哭与内在的忧愁。
- source_word: hilaris et copiosa
  choice: 欢喜丰足
  rationale: hilaris 表示喜乐、欢快；copiosa 阴性单数与所称对象一致，表示丰盛、富足。译文保留其具体所指未明的张力。
- source_word: Zelabunt gentes
  choice: 列国必嫉妒你
  rationale: zelare 在此结合 adversus te 的语境，表达列国对“你”的嫉妒；补出宾语“你”使现代汉语自然。
- source_word: nihil aduersus te poterunt
  choice: 却不能对你怎样
  rationale: 拉丁文直义近于“不能做任何对付你的事”；采用自然汉语，并保留行为内容未具体说明的概括性。
- source_word: dicit dominus
  choice: 这是主说的
  rationale: 采用庄重、清楚的先知宣告公式。
theological_decisions:
- issue: 第二人称阴性单数 tu / hilaris / copiosa 所指
  choice: 保留为“你”，不明确指认其为锡安、母亲或某一群体
  alternative: 将“你”解释性译为“锡安”或“你这位母亲”
  rationale: 本节自身没有明说所指；保留代词可避免把上下文解释直接写入正文。
- issue: copiosa 的丰足具体为何物
  choice: 译作“丰足”，不补充人口、财物或福分
  alternative: 译作“儿女众多”或“富饶”
  rationale: 原文形容词含义宽泛，具体层面需由上下文判断，不宜在本节中缩窄。
- issue: 列国敌意的结果
  choice: “不能对你怎样”
  alternative: “不能胜过你”
  rationale: 原文没有明确使用“战胜”一词；较宽泛的译法更忠实于 nihil adversus te poterunt。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“哀哭忧愁／欢喜丰足”维持原文的平行对照；不沿用所给英文脚注，因为该脚注文字与英文正文后半重复，且属于先前漏译造成的遗留信息，并非拉丁原文中的真实异文或歧义。
