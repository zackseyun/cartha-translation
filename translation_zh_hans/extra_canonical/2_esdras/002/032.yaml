  text: tuos usque dum uenio et praedica illis misericordiam, quoniam exuberant fontes mei, et gratia mea non deficiet. Ego Ezra accepi praeceptum a domino in monte Choreb,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/032.yaml
  text: Embrace your children until I come[a], and proclaim mercy to them, because my springs overflow and my grace will not fail.
translation:
  language: zh_hans
  text: 你要拥抱你的儿女，直到我来；要向他们宣讲怜悯，因为我的众泉源满溢，我的恩典必不枯竭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuos
  choice: 你的儿女
  rationale: 现存引文从形容词性物主代词 tuos 开始，句首成分显然残缺；依上下文及校勘传统补明其所指为“你的儿女”，使汉语句子完整。
- source_word: usque dum uenio
  choice: 直到我来
  rationale: 保留第一人称现在时在时间从句中表达将来临到的拉丁语习惯，不额外说明来者身份。
- source_word: praedica illis misericordiam
  choice: 要向他们宣告怜悯
  rationale: praedica 是命令式，意为公开宣告；misericordiam 保留为“怜悯”，不擅自具体化为某种教义术语。
- source_word: exuberant fontes mei
  choice: 我的泉源满溢
  rationale: 按 fontes 的具体意象译作“泉源”，以“满溢”表达 exuberant 的充盈涌流。
- source_word: gratia mea non deficiet
  choice: 我的恩典必不止息
  rationale: deficiet 是将来时，故用“必不”表达未来应许；“不止息”自然传达不会枯竭、耗尽之意。
theological_decisions:
- issue: “怜悯”与“恩典”的关系
  choice: 分别译作“怜悯”和“恩典”
  alternative: 将两者统一译为同一词语
  rationale: 原文分别使用 misericordiam 与 gratia，应保留二者的词汇区别，不将其教义性地合并。
- issue: 恩典不会止息的时态
  choice: 译为将来应许“必不止息”
  alternative: 译为现在陈述“并不止息”
  rationale: deficiet 是将来主动直陈式；译文保留从泉源现在“满溢”转向恩典将来“不止息”的时态变化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“怀抱”兼具实际拥抱与爱护之意；分号保留两项命令之间的紧密联系。所给拉丁文本末尾“Ego Ezra accepi praeceptum a domino in monte Choreb”属于下一节的起句，依本节编号及英文学术校核层的节界未收入2:32。
