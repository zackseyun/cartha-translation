  text: I will send you help—my servants Isaiah and Jeremiah. By their counsel I have sanctified and prepared for you twelve trees laden with various fruits,
translation:
  language: zh_hans
  text: 我要差遣我的仆人以赛亚和耶利米来帮助你；我已照着他们的劝告，为你分别为圣并预备了十二棵结满各样果子的树。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mittam tibi adiutorium
  choice: 我要把帮助赐给你
  rationale: 保留拉丁文“差遣/送出帮助”的基本意象，同时用自然汉语表达上帝主动赐下援助。
- source_word: pueros meos
  choice: 我的仆人
  rationale: 此处 pueri 指受差遣服事者，并非强调年龄；译作“仆人”符合以赛亚和耶利米的身份及现代汉语习惯。
- source_word: ad quorum consilium
  choice: 按他们的谋划
  rationale: consilium 可指谋划、计议或劝告；“按他们的谋划”保留其与后文预备事物之间的关系，不把含义限定为单纯口头劝告。
- source_word: sanctificaui
  choice: 分别为圣
  rationale: 准确保留 sanctificare 的宗教性含义，表示为神圣用途而分别出来。
- source_word: arbores xii grauatās uariis
  choice: 十二棵结满各样果子的树
  rationale: grauatas 表示因所结之物而沉重、满载；依英语校勘咨询层及语境补明省略的“果子”，使汉语完整自然。
theological_decisions:
- issue: 先知的谋划与上帝行动之间的关系
  choice: 我已按他们的谋划，为你分别为圣并预备了
  alternative: 我已借着他们的劝告，为你分别为圣并预备了
  rationale: 拉丁文 ad quorum consilium 的关系可理解为依照、关于或借着其谋议；正文采用较贴近句法的“按”，不进一步界定先知在上帝预备行动中的作用。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留第一人称神谕语气，并以分号清楚连接所赐的帮助与后续预备。
