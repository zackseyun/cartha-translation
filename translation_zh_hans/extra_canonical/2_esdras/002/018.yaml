    rationale: Mittam 的核心意义是“我将差遣／送出”；adiutorium 与 pueros meos 表明以赛亚和耶利米就是所赐下的帮助。
  - severity: low
    issue: “按他们的谋划”对 consilium 的表述偏向计划、谋略。
    rationale: consilium 在此可指劝告、建议或商议；“照着他们的劝告”更常规地对应该词，并保留原文所呈现的关系，不额外解释其神学机制。
