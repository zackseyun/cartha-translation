  text: Wherever you find the dead, mark them and commit them to the grave, and I will give
translation:
  language: zh_hans
  text: 无论你在哪里发现死者，都要给他们作上记号，并把他们安葬在坟墓里；我将赐予——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mortuos
  choice: 死者
  rationale: 采用概括性的复数称谓，准确表达拉丁文所指的死去之人。
- source_word: ubi inueneris
  choice: 无论在哪里发现
  rationale: 保留 ubi 配合虚拟式所表达的泛指地点含义，并以自然现代汉语呈现。
- source_word: signans
  choice: 给他们作上记号
  rationale: 直译分词 signans 的标记之意；不擅自说明记号的形式或目的。
- source_word: commenda sepulchro
  choice: 安葬在坟墓里
  rationale: commendo 与 sepulchrum 连用表示将遗体托付坟墓，汉语用“安葬”自然且庄重。
- source_word: et dabo
  choice: 我也必赐下——
  rationale: 保留“我将给予”的未完句法；用破折号提示本节所给拉丁文本在宾语出现前中断，避免擅补内容。
theological_decisions:
- issue: et dabo 的宾语缺失
  choice: 保留为“我也必赐下——”
  alternative: 根据后续经文补足所赐之物
  rationale: 当前原文证据仅止于 et dabo，补出宾语会超出所提供的源文本，并可能提前消解上下文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“作上记号”保留原文动作的具体性；末尾破折号明确反映源文片段未完，而非把句子误作完整陈述。
