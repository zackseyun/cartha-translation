  text: which I had prepared for them. The tree of life shall be for them as the fragrance of perfume[a], and they shall neither labor nor grow weary.
translation:
  language: zh_hans
  text: 就是我为他们预备的。生命树必为他们作香膏的芬芳[a]；他们必不劳苦，也不疲乏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“生命树必为他们成为香膏的芬芳。”
    reason: 保留 erit illis in odorem unguenti 较为形式对应的表语或结果读法；原文没有明确表示“像”的比较词。
lexical_decisions:
- source_word: quae praeparaueram illis
  choice: 就是我为他们预备的
  rationale: 承接上文的关系从句，保留拉丁文本在本节开头的残句性质及过去完成时所表达的预先预备。
- source_word: Lignum uitae
  choice: 生命树
  rationale: 采用清楚、传统且与圣经相关语境一致的现代汉语表达。
- source_word: erit illis in odorem unguenti
  choice: 必为他们散发香膏的芬芳
  rationale: 将“erit illis in odorem”理解为对他们成为或产生香气的结果，而非明确的明喻；“香膏”贴近 unguentum 的芳香膏油含义。
- source_word: non laborabunt neque fatigabuntur
  choice: 他们必不劳苦，也不疲乏
  rationale: 分别保留 laborare 的劳苦和 fatigari 的疲乏，并呈现两个并列否定。
theological_decisions:
- issue: 生命树与香膏芬芳之间的关系
  choice: 译作“散发香膏的芬芳”，不加入“如同”
  alternative: “必像香膏的芬芳一样”或“必成为香膏的芬芳”
  rationale: 拉丁文 in odorem 表示结果或功用，不含明确的比较词；汉语用“散发”自然表达树给他们带来香气，同时不将其硬译成生命树本身等同于香气。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“就是我为他们预备的”有意保留本节开头承接上文的句法；“劳苦／疲乏”保持语义区分。
