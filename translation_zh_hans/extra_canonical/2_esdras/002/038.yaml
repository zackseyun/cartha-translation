review_pass:
  verdict: revise
  source_fidelity: “caelestia regna”是中性复数，形式上可作主语或宾语；但“uocauit”为单数，正可与中性复数主语搭配。将其断定为“他召唤了天上的诸国度”会造成语义不通，也忽略了这一更自然的句法分析。此处宜译为“天上的国度已经召唤了（你们）”，其中受召者须由语境补足，但不应无标示地当作原文显出的宾语。后半句忠实保留原文在“numerum”处的截断。
  naturalness: “起来，站立”可懂但略显生硬；“起来，站稳”在现代庄重汉语中更自然，也保留两个并列命令的动作递进。“看看那数目”自然，且不擅自说明数目所指。
  terminology: “国度”可对应 regna；“天上的国度”保留复数，不合并成单数“天国”。“召唤”适合 uocauit。为忠实反映拉丁文未明说的受事，宜以括号标出“你们”为语境补足。
  issues:
  - severity: high
    issue: 首句将“caelestia regna”处理为“uocauit”的直接宾语。
    rationale: 中性复数主语常配单数动词；故“caelestia regna uocauit”更自然的读法是“天上的国度召唤了……”。现译“他召唤了天上的诸国度”语义突兀，且脚注将有争议的句法判断说得过于确定。
  - severity: medium
    issue: 脚注a称原文没有“人”或“进入”等词，却未说明译文所需的受召者同样没有在此残存片段中明示。
    rationale: 若按较自然的主语读法，受事“你们”须从劝勉对象及上下文补足；应用括号和脚注如实标示，而不把它当作原文显出的成分。
  revised_text: 天上的国度已经召唤了（你们）。[a]起来，站稳，看看那数目。[b]
  revised_footnotes:
  - marker: a
    text: “天上的国度”：拉丁文 caelestia regna 为中性复数；中性复数作主语可配单数动词，故此处可理解为“天上的国度已经召唤了……”。“你们”是按本段受劝勉的对象补出的，原文这句话并未明说。
    reason: 说明中性复数与单数动词的句法，并明确标示中文补出的受事。
  - marker: b
    text: 本节所给拉丁文本止于“数目”，没有说明是谁或什么的数目。
    reason: 防止读者误以为译文遗漏了原文已有的限定语。
  revision_rationale: 改正首句的主要句法处理：中性复数 caelestia regna 配单数 uocauit 可自然作主语，避免将其译成语义不通的被召对象。以括号标示从语境补出的“你们”，不把补足内容冒充为原文。后半句及其截断说明予以保留。
