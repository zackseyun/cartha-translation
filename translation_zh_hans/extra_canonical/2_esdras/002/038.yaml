  text: He has called the heavenly kingdom. Rise and stand, and see the number
translation:
  language: zh_hans
  text: 他召唤了天上的诸国度。[a]起来，站立，看看那数目。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的诸国度”：拉丁文为复数；现存句子直译如此。也有译法根据上下文理解为“他呼召人进入天国”，但所给文本没有“人”或“进入”等词。
    reason: 说明拉丁文复数及不寻常的宾格结构，保留文本歧义。
  - marker: b
    text: 本节所给拉丁文本止于“数目”，没有说明是谁或什么的数目。
    reason: 防止读者误以为译文遗漏了原文已有的限定语。
lexical_decisions:
- source_word: caelestia regna
  choice: 天上的诸国度
  rationale: 保留 regna 的复数形式，并以“天上的”表达 caelestia；不依照英文咨询层将复数合并为单数。
- source_word: uocauit
  choice: 召唤了
  rationale: 按现存拉丁文本将 caelestia regna 视为直接宾语；“召唤”比“称为”更符合本段劝勉和召集的语境，同时不补入原文未见的宾语或介词。
- source_word: Surgite et state
  choice: 起来，站立
  rationale: 保留两个复数命令语气及其递进关系，措辞简洁庄重。
- source_word: uidete numerum
  choice: 看看那数目
  rationale: 保留 numerum 未说明所指数目的悬置状态，不擅自补成“受印者的数目”等。
theological_decisions:
- issue: “天上的诸国度”在句中的语法角色
  choice: 译作被召唤的对象：“他召唤了天上的诸国度”
  alternative: “他召你们进入天国”或“他呼召了天国”
  rationale: 所给拉丁文本中 caelestia regna 是复数宾格，且没有可见的 vos 或 ad；因此不补出“你们”或“进入”。此译法虽不寻常，却保存现存文本的语法张力。
- issue: “数目”所指为何
  choice: 保持未明确
  alternative: 补作“受印之人的数目”或“赴主筵席之人的数目”
  rationale: 本节所给原文只到 numerum，没有限定成分；避免引入本句没有的末世论或礼仪性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“起来，站立”保留原文并列命令的节奏；不为使句意顺畅而补入现存拉丁文本没有的成分。
