  source_fidelity: “caelestia regna”是中性复数宾格；在所提供的残存拉丁语中可按“天上的诸国度”作“uocauit”的直接宾语。译文不应补出“人”“你们”或“进入”。“Surgite et state et uidete numerum”应保留复数命令及“数目”未受限定的状态。
  naturalness: 原译整体忠实，但“看看”略偏口语，且与庄重劝勉语体不完全协调。改为“观看”更适合本书的现代庄重书面语体，同时仍不添加解释性内容。
  terminology: “天上的诸国度”恰当保留复数，避免将其预设为单数“天国”。“召唤”可对应 uocauit；“站立”和“观看”分别对应 state、uidete。
  issues:
  - severity: low
    issue: “看看那数目”的语体较口语化。
    rationale: uidete 是庄重的复数命令；在此文体中“观看那数目”较自然且更贴合原文的正式劝勉口吻。
  revised_text: 他召唤了天上的诸国度。[a]起来，站立，观看那数目。[b]
