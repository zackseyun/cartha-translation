  text: I, Ezra, saw on Mount Zion a great multitude that I could not number, and they all were praising the Lord with songs.
translation:
  language: zh_hans
  text: 我以斯拉看见锡安山上有一大群人，多得无法数算；他们都一同唱歌赞美主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ego Ezra
  choice: 我以斯拉
  rationale: 保留拉丁文强调式自称，并采用现代中文自然、庄重的表达。
- source_word: in monte Sion
  choice: 锡安山上
  rationale: 准确表达地点，沿用通行圣经地名译法。
- source_word: turbam magnam, quam numerare non potui
  choice: 一大群人，多得无法数算
  rationale: 既保留“大群人”的群体意象，也自然表达叙述者不能计数。
- source_word: omnes canticis conlaudabant dominum
  choice: 他们都一同唱歌赞美主
  rationale: conlaudabant 含共同赞美之意，canticis 表示以歌唱的方式；译文兼顾二者。
theological_decisions:
- issue: dominum 的指称
  choice: 主
  alternative: 上主
  rationale: 原文仅作一般性的“主”，没有在本节进一步明确指称；采用中文圣经中常见的“主”，不额外限定其身份。
translation_notes:
  register: 采用现代标准普通话，句式清楚庄重，适合公开诵读；不添加原文没有的解释。
