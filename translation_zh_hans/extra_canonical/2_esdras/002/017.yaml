  text: “不要害怕，儿女的母亲啊，因为我拣选了你。”主说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Noli timere
  choice: 不要害怕
  rationale: 准确表达拉丁文否定命令，并采用自然、庄重的现代汉语。
- source_word: mater filiorum
  choice: 多子女的母亲
  rationale: 保留 filiorum 所表达的复数子女含义；用“多子女的”使呼语在现代汉语中清楚自然，且不把 filii 限定为仅指儿子。
- source_word: elegi
  choice: 拣选了
  rationale: 体现主动选择及宗教语境中的庄重色彩，同时保留完成体意义。
- source_word: dicit dominus
  choice: 主这样说
  rationale: 采用自然的汉语引语收束方式，忠实表达“主说”。
theological_decisions:
- issue: “母亲”所指对象的身份
  choice: 不在正文中明确其象征对象
  alternative: 将其解释为锡安、耶路撒冷或某一信仰群体
  rationale: 原句只称其为“多子女的母亲”，未明言具体身份；译文保留这一开放性，避免加入解释性神学判断。
- issue: “拣选”的神学含义
  choice: 保留为一般而庄重的神圣拣选用语
  alternative: 扩译为“拣选你得救”或“立你为我的子民”
  rationale: 原文没有说明拣选的目的或结果，因此不作补充。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。将说话者标记置于引语之后，符合汉语表达习惯；无脚注。
