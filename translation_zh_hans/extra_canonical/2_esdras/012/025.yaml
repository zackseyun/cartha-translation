  text: 那鹰的头。这些头正是要使它的种种恶行达到顶点[a]，并且
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“归总它的种种恶行”。
    reason: 保留 recapitulabunt 可指“归总、总结”的词义可能；正文则体现其在诸“头”意象及末世语境中“使之达到顶点”的含义。
lexical_decisions:
- source_word: recapitulabunt
  choice: 使……达到顶点
  rationale: 该词既可表示“归总”，也有“聚于首、推至顶点”的意味；在鹰的诸“头”这一异象语境中，此译保留恶行发展至高潮的含义，并尽可能呼应上下文的“头”。
- source_word: impietates
  choice: 种种恶行
  rationale: 复数形式表示多项不敬虔、邪恶的行为；“种种恶行”自然易懂，并保留复数意味。
- source_word: et
  choice: 并且
  rationale: 原文在此以连词结束，说明句子延续至下一节；译文保留这一未完结构。
theological_decisions:
- issue: recapitulabunt 的双关及末世语境
  choice: 使它的种种恶行达到顶点
  alternative: 归总它的种种恶行
  rationale: “归总”较贴近词的字面义，却容易被理解成口头概括；“达到顶点”更准确传达恶行臻于极盛或满盈的语境含义，同时以“顶”间接呼应前文诸“头”的意象。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。因本节从前句中途开始，并以 et 接续后文，译文相应保留开头和结尾的不完整句法。
