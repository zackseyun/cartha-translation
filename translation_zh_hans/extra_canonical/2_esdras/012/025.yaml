  source_fidelity: 核心译意准确："使它的种种恶行达到顶点"恰当传达 recapitulabunt 在此处使恶行臻于极盛、并暗合前文“头”之意象的语境含义；脚注也保留了“归总”的较字面可能。末尾“并且”忠实保留拉丁文 et 所标示的跨节延续。惟本节开头孤立译作“那鹰的。”在汉语中无法构成可理解的残句；拉丁属格所依附的“头”虽承自前文，但为使指代和 isti（“这些人”）在中文中成立，应补出承前省略的“头”。
