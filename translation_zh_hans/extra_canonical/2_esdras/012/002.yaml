  naturalness: 整体庄重自然。“被立起掌权”虽可理解，但稍显生硬；改作“被立为掌权者”更合现代汉语，也能表达 erectae sunt 的被动设置／拥立及 ut regnarent 的目的。
  terminology: “看哪”“掌权”“动乱”“正在燃烧”均适合异象叙事和现代庄重语体。“没有出现”避免将视觉描写释作毁灭或消失。脚注a应紧贴其所说明的翅膀短语，而非置于“我观看”之后。
