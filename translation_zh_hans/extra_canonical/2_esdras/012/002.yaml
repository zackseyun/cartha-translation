  text: aquilam, et uidi Et ecce quod superauerat caput non conparuit. et surrexerunt alae duae quae ad eum transierunt et erectae sunt ut regnarent, et erat regnum eorum exile et tumulti plenum. Et uidi et ecce ipsa non apparesebant, et omne corpus aquilae incendebatur, et expauescebat terra ualde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/002.yaml
  text: that I looked[a], and behold, the head that had remained did not appear. And the two wings that had gone over to it arose and were set up to reign, and their reign was brief and full of turmoil. And I looked, and behold, they too did not appear, and the whole body of the eagle was burning[b], and the earth was greatly terrified.
translation:
  language: zh_hans
  text: 我观看，看哪，那剩下的头没有出现。那两只曾转到它那里的翅膀起来，并被立为掌权者[a]；它们掌权的时期很短，并且充满动乱。我又观看，看哪，它们也没有出现；鹰的整个身体正在燃烧[b]，大地极其惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那两只曾转到它那里的翅膀起来掌权。”
    reason: 保留先前将“起来”和“被立起”合并处理的译法；正文则依原文分别表达两个连续动作。
  - marker: b
    text: 或译：“正被焚烧”。
    reason: incendebatur 可突出被动意义；正文“正在燃烧”自然地保留未完成时所表示的持续过程。
lexical_decisions:
- source_word: superauerat
  choice: 剩下的
  rationale: 此处描述此前存留下来的头；译为“剩下的”自然且符合异象上下文。
- source_word: non conparuit / non apparesebant
  choice: 不见了
  rationale: 两处采用一致措辞，保留“不再显现”的视觉描写，不擅自解释为毁灭。
- source_word: surrexerunt ... erectae sunt
  choice: 起来，又被立起
  rationale: 分别保留主动的“起来”和被动的“被立起”，呈现原文两个连续动作。
- source_word: regnarent / regnum
  choice: 掌权 / 掌权的时期
  rationale: 在象征性政治语境中，用现代汉语“掌权”比机械重复“作王／国度”更通顺，并保留统治之意。
- source_word: exile
  choice: 很短
  rationale: 此处形容统治期短促、微弱；结合上下文，译为“很短”最清楚。
- source_word: tumulti plenum
  choice: 充满动乱
  rationale: 准确表达统治期间骚乱纷扰的状态。
- source_word: incendebatur
  choice: 正在燃烧
  rationale: 拉丁文未完成时呈现持续进行的燃烧过程，而非已经烧尽。
- source_word: expauescebat ... ualde
  choice: 极其惊恐
  rationale: 保留强烈程度及持续场景，采用庄重自然的现代汉语。
