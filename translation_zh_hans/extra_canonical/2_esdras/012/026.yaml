  text: qui perficient nouissima eius. Et quoniam uidisti caput maius non apparescens, quoniam unus ex eis super lectum suum morietur, et tamen cum tormentis. Nam duo qui superauerunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/026.yaml
  text: and complete its final acts. And because you saw the larger head disappearing[a], it means that one of them will die on his bed, yet with torments. For the two who survived,
translation:
  language: zh_hans
  text: 并完成它最后的事。[a] 因为你看见那较大的头消失了，[b] 这表示他们中有一个将死在自己的床上，却仍要忍受痛苦。至于那两个存留下来的，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并完成它最终的作为。”
    reason: nouissima 可指最后发生的事，也可按上下文理解为最终的行动或作为。
  - marker: b
    text: 直译：“不再显现了。”
    reason: non apparescens 字面强调不显现；“消失”是异象叙事中自然的表达。
lexical_decisions:
- source_word: perficient nouissima eius
  choice: 完成它末后的作为
  rationale: 保留复数 nouissima 所指的末后之事或最终行动；用“作为”承接上下文中的统治行动，同时不把含义限定为单一事件。
- source_word: caput maius
  choice: 那较大的头
  rationale: 按原文比较级直译，并保留异象的具体形象。
- source_word: non apparescens
  choice: 消失了
  rationale: 在异象叙述中自然表达“不再显现、看不见了”的状态；脚注保留更贴近字面的译法。
- source_word: super lectum suum morietur
  choice: 将死在自己的床上
  rationale: 直接保留 lectum suum 的意象，不将其解释性改写为“自然死亡”。
- source_word: cum tormentis
  choice: 受痛苦
  rationale: tormenta 可指折磨或剧痛；此处不明确施加者，故采用不预设外力的宽泛表达。
- source_word: duo qui superauerunt
  choice: 那两个存留下来的
  rationale: superauerunt 在此语境指其余两者仍然存留；保持句尾未完，以对应所给拉丁文本。
theological_decisions:
- issue: 一人在床上死亡与“受痛苦”的张力
  choice: 将死在自己的床上，却仍要受痛苦
  alternative: 将在床上受折磨而死
  rationale: 原文把死亡地点或处境与 cum tormentis 并列，并未明确痛苦发生的方式；现译保留这种张力，避免补入“被折磨致死”。
- issue: non apparescens 的状态或动作含义
  choice: 正文译“消失了”，脚注注明“不再显现”
  alternative: 没有显现
  rationale: 上下文是先看见头、继而看不见，因此“消失”较自然；但拉丁分词本身可较静态地表示“不显现”，故以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。首句和末句都保留原文作为跨节连续句的结构，不擅自补全主语或后续内容。
