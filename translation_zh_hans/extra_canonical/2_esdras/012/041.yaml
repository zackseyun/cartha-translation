  text: me. And they said to me[a], “How have we sinned against you, and what wrong have we done to you, that you have utterly forsaken us and
translation:
  language: zh_hans
  text: 我。他们对我[a]说：“我们得罪了你什么？我们对你做了什么不义的事，以致你竟彻底撇下我们，并且——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们在什么事上得罪了你？”
    reason: 拉丁文 Quid peccauimus tibi 的问法既可理解为询问“得罪了什么”，也可自然表达为询问“在什么事上得罪了”。
lexical_decisions:
- source_word: Quid peccauimus tibi
  choice: 我们得罪了你什么
  rationale: 按拉丁文直译接近“我们向你犯了什么罪”，这里用自然的现代汉语表达，同时保留质问的力度。
- source_word: quid iniuste egimus in te
  choice: 我们对你做了什么不义的事
  rationale: 保留 iniuste 的“不义”含义及 in te 所表示的针对对象，不将其泛化为一般的“做错事”。
- source_word: derelinquens dereliquisti nos
  choice: 你竟彻底撇下我们
  rationale: 拉丁文以同源词重复加强语气；汉语用“竟彻底”传达这种强调，避免生硬重复“撇下而撇下”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文起首的“我”承接上一节未完的句子，末尾同样保留未完状态；用破折号表明本节在“并且”之后中断，须接下节阅读。
