  yaml_path: translation/extra_canonical/2_esdras/012/039.yaml
  text: But you, remain here still for seven more days, so that whatever it may please the Most High to show you may be shown to you.” And he departed from me.
translation:
  language: zh_hans
  text: 要保守这些秘密。至于你，再在这里停留七天，好让凡至高者认为合宜的事都向你显明。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruare secreta haec
  choice: 要保守这些秘密
  rationale: 按拉丁文保留这一不定式短语的命令性语气；“秘密”自然传达 secreta，且不额外指定保密对象。
- source_word: sustine hic
  choice: 在这里等候
  rationale: sustine 在此语境指继续留下、耐心等候；“等候”比生硬的“忍受”更符合现代汉语。
- source_word: alios dies septem
  choice: 七天
  rationale: alios 表示再有七天；由“还要”表达持续、追加之意，避免冗赘。
- source_word: quicquid uisum fuerit altissimo
  choice: 至高者认为合宜的一切
  rationale: uisum fuerit 加与格 altissimo 是‘至高者所认为合宜/所乐意的’，保留由至高者决定启示内容的含义。
- source_word: ostendatur
  choice: 都指示给你
  rationale: 保留被动虚拟式的目的含义，并以自然汉语表达‘被显明给你’。
theological_decisions:
- issue: 至高者决定启示内容的表述
  choice: 至高者认为合宜的一切
  alternative: 至高者愿意指示的一切
  rationale: 前者更贴近拉丁文 quicquid uisum fuerit altissimo，既表达神的意旨，也不把‘认为合宜’简化为一般意愿。
- issue: 是否加入英文咨询层末尾的‘他就离开我去了’
  choice: 不加入
  alternative: 加入‘他就离开我去了’
  rationale: 所给拉丁文原文在 ostendatur 处结束，并不含该句；依原文证据优先的原则不作增补。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于你”对应 Tu autem 的转折与强调；句式尽量贴近原文，同时避免拉丁语式的生硬被动表达。
