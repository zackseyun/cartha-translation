  text: And it will be[a], when he has reproved them, then he will destroy them[b]. For the remnant
translation:
  language: zh_hans
  text: 当他责备他们之后，他就会毁灭他们。因为余下的……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: arguerit
  choice: 责备
  rationale: 该词在此表示指出过错、斥责或定罪；“责备”自然明白，同时不额外限定为审判宣告。
- source_word: corrumpet
  choice: 毁灭
  rationale: 在针对敌对众人的语境中，corrumpere 表示使之败亡、毁灭；“毁灭”比“败坏”更符合此处及物用法。
- source_word: residuum
  choice: 那余下的
  rationale: 保留名词化的“剩余部分/余下之事”及其未完性质；本节所给拉丁文本在此截断，不擅自从后文补足。
theological_decisions:
- issue: 施行责备与毁灭者的身份
  choice: 沿用阳性单数代词“他”，不在本节补称“受膏者”或“至高者”
  alternative: 明确译作“受膏者”
  rationale: 本节拉丁文仅以动词第三人称单数承接上文；补出具体称号会把前一节内容带入本节，并掩盖现存分节错位问题。
- issue: 责备与毁灭之间的关系
  choice: 译为先责备、随后毁灭
  alternative: 将责备解释为毁灭本身或审判宣判
  rationale: cum arguerit… tunc corrumpet 清楚呈现时间次序，但不说明两者更细的神学关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“到那时……以后，就……”传达 et erit cum… tunc… 的时间结构。末尾以省略号明确显示所给拉丁文本停在 Nam residuum，避免把残句误作完整句。英文咨询层的脚注 a、b 与当前拉丁正文不相符，显然残留自错位的旧译，因此不移植。
