lexical_decisions:
- source_word: unusquisque uestrum
  choice: 你们各自
  rationale: 准确表达“你们每一个人”，同时符合现代汉语的自然表达。
- source_word: in domum suam
  choice: 回家
  rationale: 此处表示各人到自己的家去；译作“回家”简洁自然，也保留各自归家的含义。
- source_word: post dies istos
  choice: 这些日子过后
  rationale: 贴近拉丁文的时间表达，不擅自明确其具体天数或所指时期。
- source_word: ueniam ad uos
  choice: 我会到你们那里去
  rationale: 保留“来到你们那里”的方向含义，并以现代汉语自然表达将来的行动。
