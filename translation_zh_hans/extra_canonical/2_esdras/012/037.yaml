lexical_decisions:
- source_word: Scribe
  choice: 写下来
  rationale: 准确表达命令语气；在现代汉语中比单用“写”更自然，也符合记录启示内容的语境。
- source_word: ergo
  choice: 所以
  rationale: 保留与上文的推论或承接关系。
- source_word: omnia ista
  choice: 这一切
  rationale: 简洁、自然地保留原文对前述诸事的整体指称。
- source_word: in
  choice: 把……写下来
  rationale: 所给拉丁文本止于介词“in”，其宾语缺失；不凭后世补文擅自加入“书中”等内容，而以汉语可成立的表达翻译现存明确语义。
theological_decisions:
- issue: 残缺文本是否按英语咨询层补出“在一本书里”
  choice: 不补出缺失的介词宾语
  alternative: 所以，要把这一切都写在一本书里。
  rationale: 提供的拉丁原文仅为“Scribe ergo omnia ista in”，在“in”处中断；英语文本中的“a book”没有出现在所给原文证据内。为避免把推测当作正文，译文仅呈现可确证内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句末逗号反映所给拉丁片段在介词处未完，但中文译文不保留无法自然呈现的悬空介词。
