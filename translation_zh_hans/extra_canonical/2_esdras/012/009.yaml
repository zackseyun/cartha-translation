  text: 为要向我显明时代的终局和时代最后的事。”[a] 他对我说：“这异象的解释是：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另可断句作：“为要向我显明时代的终局和时代最后的事。”
    reason: 拉丁文本在此处的引语边界可因经文分节与上下文处理而异；此注保留英语咨询文本所记录的另一种断句可能。
lexical_decisions:
- source_word: temporum finem
  choice: 时代的终局
  rationale: 保留复数 temporum 所指向的时代进程，并以“终局”表达 finis 在末世语境中的终点含义。
- source_word: temporum nouissima
  choice: 时代末后的事
  rationale: nouissima 为中性复数，既可指最后阶段，也可指末后发生的事；此译保留其概括性，并避免与前面的“终局”重复。
- source_word: interpretatio
  choice: 解释
  rationale: 自然、准确地表达对异象意义的阐明。
- source_word: uisionis huius
  choice: 这异象
  rationale: 按现代汉语自然语序翻译，同时保留指示词 huius。
theological_decisions:
- issue: “时代的终局”与“时代末后的事”的关系
  choice: 保留两个并列而不合并
  alternative: 译作“时代的末了”一项
  rationale: 拉丁文以 et 并列两个短语，可能包含意义重叠，也可能分别强调终点与末后诸事；译文不替作者消解这种张力。
- issue: 经文末尾 quam 的未完句法
  choice: 用冒号保留未完待续结构
  alternative: 补出关系从句内容，使本节成为完整句
  rationale: 源文本止于关系代词 quam，后文尚未给出；不可擅自补足。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“好把……指示给我”承接上文目的结构；末尾用冒号明确表示解释内容将在下一节继续。
