  text: “But you alone were worthy to know this secret of the Most High[a].
translation:
  language: zh_hans
  text: 但唯有你配得知道至高者的这个奥秘[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但唯有你曾配得知道至高者的这个奥秘。”
    reason: fuisti 是完成时形式，可在汉语中显明为“曾”，但上下文也容许自然地译作现时相关的“配得”。
lexical_decisions:
- source_word: Tu autem solus
  choice: 但唯有你
  rationale: 保留 autem 的转折语气和 solus 的排他强调；现代汉语中“唯有你”自然庄重。
- source_word: dignus fuisti
  choice: 配得
  rationale: 拉丁文直译为“你曾是配得的／你配得”，并无“被看为”或“被认定”的动词；汉语用“配得”既准确又简洁。
- source_word: scire
  choice: 知道
  rationale: 对应“知晓”，在此指获知启示的内容；“知道”比“认识”更符合宾语为奥秘的语境。
- source_word: altissimi
  choice: 至高者的
  rationale: 将最高级名词化称号译作“至高者”，保留其神圣称谓性质。
- source_word: secretum hoc
  choice: 这个奥秘
  rationale: secretum 可指秘密或奥秘；在启示异象的语境中“奥秘”更自然，并保留 hoc 的指示意义。
theological_decisions:
- issue: “配得”是否表达被判定为配得
  choice: 正文译作“配得”
  alternative: “被认为配得”或“被算为配得”
  rationale: 原文 dignus fuisti 只陈述“是配得的”，未说明评定者或判定过程，不宜加入被动判断的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“唯有你”突出原文的排他性；“至高者”和“奥秘”延续启示文学的语域。
