  text: have sat in this place? For you surpass for us all the prophets, like a cluster from the vintage, and like a lamp in a dark place,"
translation:
  language: zh_hans
  text: 你曾坐在这里吗？因为对我们来说，你胜过所有先知[a]，如同葡萄收成中的一串葡萄，又如同暗处的一盏灯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胜过”所译的拉丁词也可能含有“存留下来”或“幸存”的意思；本句也可理解为：“在所有先知中，你为我们存留了下来。”
    reason: 保存 superasti 在此处真实存在的词义与语境歧义。
lexical_decisions:
- source_word: sedisti
  choice: 你坐在这里吗
  rationale: 拉丁语为第二人称单数完成时；现代汉语在缺少上文所限定的时间语境时不强加“已经”或“一直”，以自然的疑问句保留其完成体语感及片段性。
- source_word: superasti
  choice: 胜过
  rationale: 按 supero 的比较义译为“胜过”，与 ex omnibus prophetis（所有先知）形成自然比较；同时用脚注保留该词在语境中可能含有“存留、幸存”意味的歧义。
- source_word: botrus de vindemia
  choice: 葡萄收成中的一串葡萄
  rationale: 保留 botrus“一串葡萄”和 vindemia“葡萄采收、收成”的具体意象，不擅自增添“仅剩”或“遗落”等原文未明说的信息。
- source_word: lucerna in loco obscuro
  choice: 暗处的一盏灯
  rationale: 以简洁、自然的现代汉语直译灯与黑暗处的对照意象。
theological_decisions:
- issue: 以斯拉与众先知的关系
  choice: 译作“你胜过所有先知”
  alternative: “在所有先知中，只有你为我们存留下来”
  rationale: 现存拉丁文本 superasti 首先容许“胜过”的读法，但也可能在此语境中表达存留或幸存；正文采用直接比较义，脚注注明另一可能，不把经文收窄为某种先知论立场。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“葡萄收成中的一串葡萄”略带书面色彩，以保留原文农业意象；整体不补足本节开头可能依赖上文的省略成分。
