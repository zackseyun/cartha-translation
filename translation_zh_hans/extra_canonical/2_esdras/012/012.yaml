  text: or as I have interpreted it. Behold, days are coming, and a kingdom will arise,
translation:
  language: zh_hans
  text: 或照我所解释的：看哪，日子将到，必有一个国兴起，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uel
  choice: 或
  rationale: 保留拉丁文表示另一种表述或承接前文的选择关系；本节是残句，避免擅自补足上下文。
- source_word: interpretatus sum
  choice: 我所解释的
  rationale: 以完成性表达对应第一人称完成时，兼顾现代汉语自然度。
- source_word: Ecce
  choice: 看哪
  rationale: 保留先知性宣告中引人注意的庄重语气。
- source_word: dies ueniunt
  choice: 日子将到
  rationale: 采用自然而庄重的汉语末世宣告句式，同时贴近字面“日子来到”。
- source_word: exsurget
  choice: 兴起
  rationale: 准确传达‘起来、出现’之意，与‘国’搭配自然。
- source_word: regnum
  choice: 一个国
  rationale: 此处可指王国、国度或统治权；正文采用语境中最直接的政治实体表达，并以不定数量词反映拉丁文无定冠词的性质。
theological_decisions:
- issue: regnum 的指称范围
  choice: 一个国
  alternative: 一个王国／一种统治
  rationale: 拉丁词既可指国家实体，也可指王权或统治；本句本身不足以确定其神学性质，因此不译成带特定神学含义的‘国度’。
- issue: 残句的句法连续性
  choice: 以逗号结尾
  alternative: 补成完整句并加句号
  rationale: 原文在此继续到下一节，保留未完结构，不从后文或英文旧稿补入‘在地上’等成分。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。保留“看哪”的经文宣告色彩；不补入原拉丁文没有的地点或神学限定。
