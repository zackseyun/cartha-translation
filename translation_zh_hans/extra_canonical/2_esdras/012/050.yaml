  text: And the people departed into the city, as I told him.
translation:
  language: zh_hans
  text: 众人便如同我对他所说的那样，往城里去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus est
  choice: 去了
  rationale: 在此表示众人动身离开并前往城中；结合目的地短语，译作“去了”自然简洁，也保留行动的完成感。
- source_word: populus
  choice: 众人
  rationale: 此处指聚集的民众；“众人”比抽象的“人民”更符合具体叙事场景。
- source_word: in ciuitatem
  choice: 进城
  rationale: 拉丁语in加宾格表示朝向城里，现代汉语自然表达为“进城”。
- source_word: sicut dixi ei
  choice: 照我对他说的
  rationale: 保留ei的阳性或通性单数所指，译作“他”，不改成复数“他们”；sicut在这里表达依照先前所说的话。
