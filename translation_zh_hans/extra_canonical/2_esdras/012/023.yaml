source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quiescentia, Haec est interpretatio : in nouissimis eius suscitabit altissimus tria regna et renouabit in ea multa et dominabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/023.yaml
  text: 'And because you saw three heads at rest[a], this is the interpretation: in its last days the Most High will raise up three kingdoms and renew many things in it, and they will rule.'
translation:
  language: zh_hans
  text: 至于你所看见的三个静止不动的头，解释如下：在它末后的日子，至高者将兴起三个王国，并在它里面更新许多事，而它们将掌权。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quiescentia
  choice: 静止不动
  rationale: 按上下文作描述三个头的状态，保留拉丁词所含的静止、安歇之意；译为“静止不动”比单作“安歇”更符合异象画面。
- source_word: in nouissimis eius
  choice: 在它末后的日子
  rationale: 保留 eius 的单数指称及“末后时期”的时间意义，不擅自明确其先行词。
- source_word: suscitabit
  choice: 将兴起
  rationale: 用于王国出现或被建立，既自然又贴近“使之起来”的使役意义。
- source_word: tria regna
  choice: 三个王国
  rationale: 直接对应拉丁文中性复数，保持政治实体的含义。
- source_word: renouabit in ea multa
  choice: 在其中更新许多事
  rationale: in ea 是阴性单数，故用单数指向的“其中”，不误译成指三个王国的复数“在它们中”；multa 保持宽泛，不补出具体对象。
- source_word: dominabunt
  choice: 它们将掌权
  rationale: 主语承接“三个王国”，表达统治、执掌权柄之意。
theological_decisions:
- issue: “它／其中”的指代对象
  choice: 保留单数而不明确说明所指
  alternative: 明确译为“在鹰中”或“在地上”
  rationale: 拉丁文 eius 与 in ea 均为单数，但本节截取的文本不足以无歧义判定先行词；应保存原文的指代张力。
- issue: 三个王国的兴起主体
  choice: 译明“至高者将兴起”
  alternative: 弱化为“三个王国将兴起”
  rationale: 原文明确以 altissimus 为主语，保留神主动使这些王国兴起的表述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“解释如下”自然对应解释公式；“末后的日子”保留启示文学语域。正文没有脚注，因为所给英文脚注内容与其标记位置不相符，且拉丁文清楚支持 in ea 的阴性单数，不能据此提出“在它们中”的等值异文。
