  source_fidelity: 译文准确保留了拉丁文的主要句法关系：至高者为“兴起”和“更新”的主语，三个王国为“掌权”的主语；“末后的日子”也恰当传达 in nouissimis eius。惟“在其中”在现代汉语中可自然指向复数的“三个王国”，不足以清楚承载 in ea 的阴性单数。
  naturalness: 整体庄重通顺，适合启示文学语境。“三个静止不动的头”和“解释如下”自然。“并在它里面”较“在其中”更明确地维持单数回指，同时仍不越过原文去判定该单数代词究竟指鹰或地。
  terminology: “至高者”“末后”“兴起”“王国”“掌权”均合乎本书语域和原文含义。无需采用英文审计轨迹中已被拉丁文否定的复数脚注方案。
