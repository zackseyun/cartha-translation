translation_notes:
  register: 采用现代、庄重而自然的书面汉语；保留原文港湾与船的比喻，不作神学扩释。原始拉丁材料后接“Aut non sufficiunt”，但英语审校层及本节给定文本止于前一句；为避免将疑似下一句残片擅自并入，正文亦止于此。
