  text: 又像港湾之于一艘从风暴中脱险的船。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: portus
  choice: 港湾
  rationale: 准确表达船只避风停泊之处，也保留比喻中的安稳感。
- source_word: naui saluatae
  choice: 避过……的船
  rationale: saluatae 在此指船从风暴中获救、幸存；译为“避过”符合现代汉语表达，又不额外引入施救者。
- source_word: tempestate
  choice: 风暴
  rationale: 在航海语境中自然准确，比泛指的“暴风雨”更凝练。
