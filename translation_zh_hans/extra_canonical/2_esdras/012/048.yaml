source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et fortis non est oblitus uestri in contentione. Ego enim non dereliqui uos neque excessi a uobis, sed ueni in hunc locum ut deprecarer pro desolatione Sion, et ut quererem misericordiam pro humilitate sanctificationis uestrae. Et nunc ite unusquisque uestrum in domum suam et ego ueniam ad uos post dies istos. Et profectus est populus sicut dixi ei in ciuitatem. Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/048.yaml
  text: For I have not forsaken you, nor have I departed from you, but I came to this place to pray for the desolation of Zion and to seek mercy for the humiliation of your sanctuary.
translation:
  language: zh_hans
  text: 因为我没有离弃你们，也没有离开你们；我来到这地方，是要为荒凉的锡安祈求，并为你们圣所所受的屈辱求怜悯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”所译的拉丁文也可直译为“你们的圣化”或“你们的圣洁之物”。
    reason: 保留 sanctificationis uestrae 的词义与所指歧义。
lexical_decisions:
- source_word: dereliqui
  choice: 离弃
  rationale: 准确表达主动抛弃、遗弃之意，也符合庄重的经文语体。
- source_word: excessi a uobis
  choice: 离开你们
  rationale: 贴近拉丁文“从你们那里离去”，并与前面的“离弃”保持语义区别。
- source_word: deprecarer pro desolatione Sion
  choice: 为荒凉的锡安祈求
  rationale: 避免“为锡安的荒凉祈求”可能被误解为祈求锡安变得荒凉，同时保留代求含义。
- source_word: querer misericordiam
  choice: 求怜悯
  rationale: 自然简洁地表达寻求、恳求怜悯，不把动作过度具体化。
- source_word: humilitate
  choice: 所受的屈辱
  rationale: 保留受贬抑、蒙羞的意味；比单纯的“卑微”更适合圣所遭难的语境。
- source_word: sanctificationis uestrae
  choice: 你们圣所
  rationale: 按上下文将抽象的“圣化／圣洁之物”理解为群体的圣所，但以脚注保留拉丁文措辞的歧义。
theological_decisions:
- issue: sanctificationis 是指“圣所”还是“圣化／圣洁”
  choice: 正文译作“圣所”
  alternative: 你们的圣化／你们的圣洁之物
  rationale: 锡安荒凉及群体蒙羞的语境支持具体指圣所；但拉丁词本身较抽象，因此不把另一可能性隐去，而在脚注中说明。
- issue: 为锡安的荒凉祈求所表达的祷告方向
  choice: 译作“为荒凉的锡安祈求”
  alternative: 为锡安的荒凉祈求
  rationale: 明确这是因锡安荒凉而代求，并非祈求荒凉临到锡安；没有增添祷告结果或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“离弃／离开”保留原文平行但不完全同义的两个动词；后半句使用“祈求／求怜悯”呈现两个相应动作。
