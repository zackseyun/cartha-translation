  yaml_path: translation/extra_canonical/2_esdras/012/021.yaml
  text: whose times will be brief and whose years swift. Two of them will perish when the middle time draws near[a], but four will be preserved for the time when its end begins to draw near,
translation:
  language: zh_hans
  text: 它们的时期将很短[a]，年岁也会飞逝。其中两个会在中期临近时灭亡；但有四个会在它的时期开始临近终结时被保留下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文 leuia 也可按字面译为“轻”；用于时间时可指短暂、易逝。
    reason: 保留 levis 的字面义与语境义之间的词义幅度，并说明正文选择“很短”的依据。
lexical_decisions:
- source_word: leuia
  choice: 很短
  rationale: levis用于时间语境可表示短暂、易逝；结合后面的“年岁飞逝”，此处译作“很短”最合语境，同时在脚注保留其“轻”的字面可能。
- source_word: anni citati
  choice: 年岁也会飞逝
  rationale: citatus有迅速、急速之意；“飞逝”自然表达年岁迅速过去。
- source_word: perient
  choice: 灭亡
  rationale: 准确传达 pereo 的毁灭、消亡含义，并保持预言体的庄重语气。
- source_word: seruabuntur
  choice: 会被保留下来
  rationale: 保留被动语态以及“保存、留存”的含义，不擅自说明施事者或保存目的。
- source_word: tempore medio
  choice: 中期
  rationale: 直译“中间的时期”，以简洁的“中期”保留其时间分段含义。
theological_decisions:
- issue: tempus eius中第三人称所有格的指向
  choice: 它的时期
  alternative: 终期／这个国度的终期
  rationale: 拉丁文仅用 eius，指代对象在本节内并不明说；采用“它的时期”以保留原文的指代含混，不补入特定末世论解释。
- issue: 四个被保存的施事者与目的
  choice: 会被保留下来
  alternative: 上帝会保全四个
  rationale: 原文为无人称被动 seruabuntur，没有明示施事者；译文不增补“上帝”，也不解释其被保留的神学目的。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“飞逝”“灭亡”“保留下来”维持预言文体的力度；分号呈现“两者灭亡”与“四者被保留”的对照。
