  text: hic est unctus, quem reservavit Altissimus in finem ad eos et impietates ipsorum. arguet illos de iniustitiis ipsorum et infulciet coram ipsis spretiones eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/032.yaml
  text: This is the Anointed One[a], whom the Most High has reserved for the end against them and their impieties[b]. He will rebuke them for their injustices and will set their contempt before them.
translation:
  language: zh_hans
  text: 这就是受膏者[a]，至高者把他保留到末期，用来对付他们和他们的不敬虔[b]。他必因他们的不义责备他们，并把他们的藐视摆在他们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文 unctus 的字面意思是“受膏的”。在这个异象中，此人物是末期的拯救者，责备鹰所象征的国度，并拯救余民，因此这里也含有弥赛亚的意味。
    reason: messianic_passage
  - marker: b
    text: 早先的译本在本节误置了上一节关于狮子从林中奋起、向鹰吼叫并责备它的内容；这里依现有拉丁文本翻译。
    reason: previous_rendering
lexical_decisions:
- source_word: unctus
  choice: 受膏者
  rationale: 保留拉丁文“受膏的”这一称号，同时让本异象中的弥赛亚意味自然呈现。
- source_word: reservavit
  choice: 保留到
  rationale: 表达至高者特意将此人留待末期的含义，比单纯的“保存”更符合语境。
- source_word: impietates
  choice: 不敬虔
  rationale: 涵盖对上帝的不敬与恶行，不将其窄化为一般性的邪恶。
- source_word: arguet
  choice: 责备
  rationale: 既可表达揭露过错，也符合审判语境中的斥责意味。
- source_word: infulciet coram ipsis
  choice: 摆在他们面前
  rationale: 按上下文表达将其罪状当面陈列、使其无法回避；拉丁词形较少见，译文避免过度具体化。
- source_word: spretiones
  choice: 所显出的藐视
  rationale: 保留复数所指的多次轻蔑表现，并用“所显出的”使现代汉语自然。
theological_decisions:
- issue: unctus的弥赛亚含义
  choice: 正文译作“受膏者”
  alternative: 弥赛亚
  rationale: “受膏者”直接对应拉丁文，也保留读者辨认其弥赛亚功能的空间，不以解释性称谓取代原文。
- issue: ad eos et impietates ipsorum的关系
  choice: “用来对付他们和他们的不敬虔”
  alternative: “为他们和他们的不敬虔”
  rationale: ad在此与末世审判语境相连，带有针对、对付之意；同时保留“他们”与“他们的不敬虔”两个并列对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至高者”“受膏者”“不敬虔”等保留经文语体；句法作适度调整，以清楚呈现末世审判的对象和行动。
