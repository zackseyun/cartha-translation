lexical_decisions:
- source_word: Nam
  choice: 因为
  rationale: 表示解释或原因，承接上下文，不译作转折性的“但是”。
- source_word: secundus
  choice: 那第二个
  rationale: 保留序数含义，并以“那”自然指回异象中所说的统治者。
- source_word: incipiet regnare
  choice: 开始掌权
  rationale: regnare 可指作王、统治；此处用“掌权”既自然，也避免补入原文未明说的王位称号。
- source_word: ipse tenebit amplius
  choice: 掌权的时间必更长
  rationale: tenebit 在语境中指维持统治或权力；amplius 表示更久。中文补出“时间”以使比较关系自然，但不补明比较对象。
theological_decisions:
- issue: “更长”的比较对象
  choice: 正文保留未明说的比较对象
  alternative: 译作“比十二个中的任何一个都更久”
  rationale: 所给本节拉丁文本只说 amplius，并未明列比较对象；不从下一节或历史认定中补入，以保留文本边界和原有省略。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“掌权的时间必更长”符合普通话表达，同时避免添加“十二个中的任何一个”等本节拉丁文本未载的信息。
