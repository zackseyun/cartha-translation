  text: uidisti; et leonem quem uidisti de silua euigilantem mugientem et loquentem ad aquilam et arguentem eam iniustitias ipsius et omnes sermones eius, sicut audisti; Hic est unctus, quem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/031.yaml
  text: as you saw. And the lion that you saw rousing itself from the forest[a], roaring and speaking to the eagle and reproving it for its injustices and all its words, as you heard—
translation:
  language: zh_hans
  text: 正如你所看见的。至于你所看见的那头狮子，它从森林中醒来，咆哮着，对鹰说话，斥责它的不义和它所说的一切话，正如你所听见的——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: euigilantem
  choice: 醒来
  rationale: 直译其从睡眠或静止状态中苏醒、振起的动态；结合“从森林中”保持异象叙述的画面感。
- source_word: mugientem
  choice: 咆哮着
  rationale: 该词本义可指牛鸣或低吼；用于狮子时，现代汉语以“咆哮”最自然，也符合其向鹰发声的威势。
- source_word: arguentem
  choice: 斥责
  rationale: 兼顾揭露过错和责备之意，不增添审判或定罪等原文未明说的含义。
- source_word: iniustitias
  choice: 不义
  rationale: 保留复数所涵盖的多项不公、不正行为；汉语集合名词“不义”比“不公正”更凝练庄重。
- source_word: omnes sermones eius
  choice: 它所说的一切话
  rationale: sermones 在此指鹰所说的话语；明确所属关系，同时不将其窄化为命令、宣告或亵渎之言。
theological_decisions:
- issue: 本节末尾是否纳入“Hic est unctus, quem”
  choice: 不纳入正文
  alternative: 译作“这就是那位受膏者，他……”并置于本节末尾
  rationale: 所给拉丁文本在此进入下一句且明显未完；依据现有分节和英语审校层，本节止于 sicut audisti，避免把下一节的开头错误并入本节。
- issue: 是否将狮子的斥责解释为特定形式的神圣审判
  choice: 仅译为“斥责”
  alternative: 译为“审判”或“定罪”
  rationale: arguentem 表示责备、指明过错；本节虽有神学张力，却没有在这一分句中明说正式审判，因此不作教义性扩展。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“至于”自然引出异象解释对象；连续使用“醒来，咆哮着，对鹰说话，斥责……”保留拉丁分词链的推进感。开头“正如你所看见的”保留 uidisti 与上文的衔接，末尾破折号显示解释尚未完结。英语脚注所示另一种旧有处理并无清楚的拉丁文本差异支撑，故不设置中文脚注。
