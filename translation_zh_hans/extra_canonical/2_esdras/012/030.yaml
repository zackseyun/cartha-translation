base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/030.yaml
  text: '“And because you saw two little wings passing over to the head on the right side, this is the interpretation: these are the ones whom the Most High has preserved for its end. This was a brief kingdom and full of turmoil,”'
translation:
  language: zh_hans
  text: “至于你看见两只小翅膀转到右边的头那里，解释是这样：它们就是至高者保留到末期的那些王。这国短暂而且充满动乱。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “短暂”也可译作“微小”或“弱小”；“到末期”也可理解为“直到这国的末期”。
    reason: 说明 exilis 的语义范围，并保留 finem suam 所属关系的真实歧义。
lexical_decisions:
- source_word: finem suam
  choice: 到末期
  rationale: 拉丁文直译近于“到它／自己的终局”，但所属对象并不十分明确；正文用自然且保留一定开放性的“到末期”，不强行指定是谁的末期。
- source_word: regnum exile
  choice: 这国短暂
  rationale: exile（exilis）可表示微小、薄弱或短促；结合一连串统治者迅速更替的异象语境，译作“短暂”最能传达这里的时间意味，同时在脚注交代其他可能。
- source_word: turbationis plenum
  choice: 充满动乱
  rationale: turbatio 表示扰乱、混乱或骚动；“充满动乱”既贴近原文，又符合现代汉语历史叙事语体。
theological_decisions:
- issue: “那些”所指为何
  choice: 补出“那些王”
  alternative: 仅译“那些人”
  rationale: 异象解释的上下文把小翅膀所代表者理解为相继掌权的统治者；译作“那些王”使中文指代清楚，但不加入其身份或历史对应。
- issue: finem suam 的所属关系
  choice: 正文译为不明示所属者的“末期”
  alternative: “这国的末期”或“他们的末日”
  rationale: 现存拉丁措辞及咨询层对所属关系并不完全一致，因此避免在正文中作神学或历史上的过度判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至高者”沿用犹太启示文学中对上帝的称谓；“动乱”比“纷扰”更贴合王国政治局势。正文补足咨询层所载的完整句意；所给拉丁片段直接支持后半句及其歧义。
