review_pass:
  verdict: revise
  source_fidelity: “转到”没有表达 transisse（经过／飞到）的移动含义；并且拉丁文 hi（“这些人”）本身未明说“王”，正文补出“那些王”会增加原文未直接表达的身份限定。finem suam 的所属对象确有歧义，宜保持不明说。
  naturalness: “右侧的头”比“右边的头那里”更合乎现代汉语；“被……保留到终局的人”既自然，也避免将“末期”误解为一个明确指定的历史阶段。
  terminology: “至高者”“国度”“动乱”均适切，保持庄重的启示文学语域。“终局”可对应 finis，且不预断其所属对象。
  issues:
  - severity: medium
    issue: “转到右边的头那里”未准确表达两只小翅膀的移动。
    rationale: transisse ad caput 的核心是“经过／飞到头部”，而“转到”主要表示改变方向，可能不表示实际经过或抵达。
  - severity: medium
    issue: 正文补出“那些王”。
    rationale: 原文此处只说 hi quos（“这些……人／者”）；即使上下文涉及统治者，直接限定为“王”仍较英文审校轨迹和本句拉丁文更具体。
  revised_text: “至于你看见两只小翅膀飞到右侧的头上，解释是这样：这些人就是被至高者保留到终局的人。这是一个短暂而充满动乱的国度。”[a]
  revised_footnotes:
  - marker: a
    text: “短暂”也可译作“微小”或“弱小”；“到终局”也可理解为“直到这国的终局”，其所属对象在拉丁文中并不完全明确。
    reason: 说明 exilis 的语义范围，并保留 finem suam 所属关系的真实歧义。
  revision_rationale: 修正“转到”以体现 transisse 的移动义，并以“这些人”对应 hi quos，避免把原文未明确说出的身份直接定为“王”。其余措辞保留原译对 finem suam 和 regnum exile 的审慎处理。
