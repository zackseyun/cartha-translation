  yaml_path: translation/extra_canonical/2_esdras/012/003.yaml
  text: Then I awoke from great bewilderment of mind and from great fear[a], and I said to my spirit, “See, you have brought these things upon me, because
translation:
  language: zh_hans
  text: 我从极大的心神恍惚和极大的恐惧中醒来[a]，对自己的心灵说：“看，是你使这些事临到我，因为
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心神恍惚”也可译作“出神状态”。拉丁文指心神脱离常态的强烈状态。
    reason: 说明 excessus mentis 的语义范围，保留它可能指异象性出神或精神迷乱的含义。
lexical_decisions:
- source_word: a multo excessu mentis
  choice: 从极度的心神恍惚中
  rationale: excessus mentis 表示心神脱离常态的迷离、恍惚或出神状态；结合 uigilaui（醒来），译为“心神恍惚”既自然，也保留其心理与异象语境，且不把它过度限定为“深度昏睡”。
- source_word: a magno timore
  choice: 从巨大的恐惧中
  rationale: 保留 magno 的强度以及与前一介词短语并列的结构。
- source_word: uigilaui
  choice: 醒来
  rationale: 此处指从先前的异象性或恍惚状态恢复清醒；现代汉语用“醒来”最自然。
- source_word: spiritui meo
  choice: 对自己的心灵
  rationale: spiritus 可指人的灵或内在心灵；上下文是人物向内在自我说话，译作“心灵”自然，同时不将其解释为外在灵体。
- source_word: haec
  choice: 这些事
  rationale: 准确反映中性复数 haec，所指应为先前经历或所见诸事。
- source_word: in eo quod
  choice: 因为
  rationale: 该短语引出原因从句，而本节在此处截断；用“因为”保留未完句式及其与下一节的衔接。
theological_decisions:
- issue: spiritui meo 所指为何
  choice: 自己的心灵
  alternative: 我的灵
  rationale: “心灵”能表达人物向其内在生命发言，又不预设灵魂构成论；“我的灵”更形式对应，但现代读者可能误解为一个与说话者分离的灵体。
- issue: excessus mentis 是否特指超自然入迷
  choice: 心神恍惚
  alternative: 出神状态；深度昏睡
  rationale: 拉丁语可涵盖出神、迷离或精神震荡。正文保留一定语义宽度，不武断判定其机制；脚注提示另一种较偏异象性的理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文两个由“从”引出的并列状态，并以“因为”结束本节，忠实呈现拉丁文本在此处尚未完成、需接续下节的句法。
