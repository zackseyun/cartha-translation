  yaml_path: translation/extra_canonical/2_esdras/012/047.yaml
  text: For the memory of you is before the Most High[a][b],
translation:
  language: zh_hans
  text: 雅各家啊，因为在至高者面前，有对你们的记念。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文直作：“因为在至高者面前，有对你们的记念。”其中 uestri 表示被记念的对象。
    reason: 说明 memoria uestri 的客体关系，并保留 coram altissimo 的“在……面前”表述。
lexical_decisions:
- source_word: domus Jacob
  choice: 雅各家
  rationale: 保留圣经传统中的家族—群体称谓，指雅各的后裔或以色列民。
- source_word: memoria uestri
  choice: 记念你们
  rationale: uestri 是 memoria 所指向的对象，即“对你们的记念”，不是“你们所作的纪念”；用动词表达可使现代汉语自然明晰。
- source_word: coram altissimo
  choice: 至高者记念
  rationale: 拉丁文直陈“对你们的记念在至高者面前”；正文以自然汉语表达其含义，同时在脚注保留原文的空间性表述。
theological_decisions:
- issue: 谁在记念雅各家
  choice: 将“至高者”作为“记念”的主语
  alternative: 在至高者面前有对你们的记念
  rationale: 这是拉丁语存在句在汉语中的自然表达，并未增添原文以外的施事者；脚注保留较为形式对应的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅各家啊”保留直接呼告；“记念”沿用现代汉语圣经语体中表示郑重眷念的常用词。未收入较早英译中“全能者没有在争战中忘记你们”等内容，因为所提供的拉丁文本没有这些词句。
