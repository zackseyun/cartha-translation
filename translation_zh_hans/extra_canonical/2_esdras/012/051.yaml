  yaml_path: translation/extra_canonical/2_esdras/012/051.yaml
  text: But I sat in the field seven days[a], as he commanded me, and I ate only the flowers of the field; in those days my food was made from herbs.
translation:
  language: zh_hans
  text: 我却照他所吩咐的，在田野里坐了七天，只吃田野里的花；那些日子，我的食物是用草本植物制成的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: campo
  choice: 田野
  rationale: 此处指城外或旷野中的田地；“田野”自然、宽泛，符合上下文。
- source_word: floribus solummodo agri
  choice: 只吃田野里的花
  rationale: 保留 solummodo 的排他意义和 flores 的具体意象，不将“花”泛化为植物。
- source_word: de herbis facta est mihi esca
  choice: 我以草本植物为食
  rationale: 按拉丁文表达其食物来自 herbae；“草本植物”可涵盖草和可食野菜，避免现代汉语“药草”的偏义，同时以自然中文传达被动结构的实义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我却”承接前文的转折；分号保留原文后两分句间的紧密解释关系。英文脚注所列内容实际对应正文末句而非“七天”，且不构成拉丁文的实质异读，故中文稿不设置脚注。
