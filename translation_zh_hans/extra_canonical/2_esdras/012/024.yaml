revisions:
- from: 大地和住在其中的人，施加的压迫比他们以前所有的人都更甚；因此，他们被称为“头”。
  to: 他们以极大的压迫统治大地和住在其中的人，超过在他们以前所有的人；因此，他们被称为“头”。
  rationale: 重构中文句法以清楚表达隐含承接上文的统治者为施事，并使“极大的压迫”和“超过在他们以前所有的人”的比较关系自然落在其统治方式上。保留“头”的字面象征称谓、因果连接及未明示的代词所指。
