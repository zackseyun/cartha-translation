  yaml_path: translation/extra_canonical/2_esdras/012/024.yaml
  text: the earth and those who dwell in it, with much oppression, more than all who were before them; therefore they are called the heads
translation:
  language: zh_hans
  text: 他们以极大的压迫统治大地和住在其中的人，超过在他们以前所有的人；因此，他们被称为“头”。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum labore multo
  choice: 施加的压迫……更甚
  rationale: 结合统治者作用于“大地和住在其中的人”的句法与上下文，将 labor 表达为使人受苦的压迫；补出“施加的”以使残句在现代汉语中关系清楚，同时保留程度比较。
- source_word: capita
  choice: “头”
  rationale: 直译鹰异象中的形象称谓，保留其象征意象，不提前解释为君王或统治者。
- source_word: super omnes qui fuerunt ante hos
  choice: 比他们以前所有的人都更甚
  rationale: 保留拉丁文的比较结构及时间先后关系，不限定先前之人的具体身份。
theological_decisions:
- issue: “头”的象征身份
  choice: 保留“头”这一异象称谓
  alternative: 译作“首领”或“君王”
  rationale: 本句解释其为何被称作 capita，却未在此处直接将该词等同于某一类政治人物；直译可避免过早消解象征张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号连接因果两部分，对应 propter hoc 与前句的紧密联系。经文为跨节残句，开头保留承接上文的宾语结构。
