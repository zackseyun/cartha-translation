review_pass:
  verdict: revise
  source_fidelity: 草稿将 cum labore multo 理解为“压迫”可与英文审校轨迹及本段统治语境相合，但“施加的压迫比……更甚”在句法上悬空，且没有清楚表达该比较所修饰的是这些统治者对大地及居民的统治／压迫。修订以“以极大的压迫统治”明确保留原文的方式语和比较结构，同时不擅自具体化“他们”或“头”的身份。
  naturalness: “大地和住在其中的人，施加的压迫……”不符合现代汉语的主谓搭配：该并列宾语不能充当“施加”的施事，定语“施加的”也缺少明确中心语关系。改为“他们以极大的压迫统治大地和住在其中的人”庄重、自然，并保留跨节承接的代词指向。
  terminology: “头”作为 capita 的异象性称谓应保留，不宜改作“首领”或“君王”。“极大的压迫”对应英文审校轨迹中的 much oppression，并在汉语中合乎统治语境。
  issues:
  - severity: medium
    issue: “施加的压迫比他们以前所有的人都更甚”句法悬空且语义关系不清。
    rationale: 原句开头的“大地和住在其中的人”是统治／压迫的对象，不是“施加”的主体；比较结构也应说明是这些人以压迫统治得超过先前者。
  revised_text: 他们以极大的压迫统治大地和住在其中的人，超过在他们以前所有的人；因此，他们被称为“头”。
