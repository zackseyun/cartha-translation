  text: but this one also will fall by the sword in the last days[a]. And because you saw
translation:
  language: zh_hans
  text: 但这一个也必在最后的日子死于刀剑[a]。你既看见了……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有旧译：“但那剩下的两个，刀剑必吞灭他们；其中一个的刀剑必吞灭与他同在的那一个。”这段文字对应的是前文，而非本节现存拉丁文本。
    reason: 保留英语 POB 所载 previous_rendering，同时说明该异文式旧译与当前拉丁源文的错位，避免将其误认为本节拉丁文的直接译法。
lexical_decisions:
- source_word: sed tamen
  choice: 但
  rationale: 表达转折；中文若同时译出“然而”和“也”，会显得叠床架屋。
- source_word: et hic
  choice: 这一个也
  rationale: 保留 hic 的指示性和 et 的追加意义，并承接上文所指的人物。
- source_word: gladio
  choice: 死于刀剑之下
  rationale: 在 cadet 的语境中表示被刀剑杀死；此译比直译“因刀剑倒下”更自然，同时保留死亡含义。
- source_word: in nouissimis
  choice: 在末后的日子
  rationale: 保留末世性时间表达；拉丁文名词化用法可理解为末后的时期。
- source_word: Et quoniam uidisti
  choice: 至于你所看见的
  rationale: 这是引向下文解释的未完结构；用省略号明确本节在从句处截断，避免误作完整句。
theological_decisions:
- issue: in nouissimis 的末世色彩
  choice: 在末后的日子
  alternative: 到最后
  rationale: 选择较明确的时间性表达，但不进一步界定具体末世体系或事件。
- issue: hic 所指对象
  choice: 这一个
  alternative: 此人
  rationale: 原文只用指示代词，译文不补入身份或头衔，以保留其依赖上下文的指称。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“死于刀剑之下”符合启示文学语境；末尾以省略号标示源文片段在“你所看见的”之后尚待下文续接。
