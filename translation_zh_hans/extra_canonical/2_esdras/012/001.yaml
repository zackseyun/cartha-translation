  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est
  choice: 发生了这样的事
  rationale: 保留叙事转换公式的作用；句末用冒号体现原文未完、下文承接的句法。
- source_word: dum loqueretur
  choice: 正……说……的时候
  rationale: 准确表达拉丁语 dum 加虚拟式所表示的同时发生背景。
- source_word: leo
  choice: 狮子
  rationale: 按其普通名词义直译，并保持异象中的形象。
- source_word: uerba haec
  choice: 这些话
  rationale: 自然对应指示词 haec 与复数名词 uerba。
- source_word: ad
  choice: 对
  rationale: 结合 loqueretur 表达讲话的对象；英文校勘层补明对象为鹰，但所给拉丁文本在 ad 后截断。
- source_word: aquilam（据英文审校层及句子续文）
  choice: 鹰
  rationale: 所给拉丁引文止于介词 ad，显然残缺；依据经审校的英文咨询层补出其宾语“鹰”，使本节成为可读文本。
