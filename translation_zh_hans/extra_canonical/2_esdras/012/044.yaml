  yaml_path: translation/extra_canonical/2_esdras/012/044.yaml
  text: Or are not the evils that have happened to us enough? If then you forsake us[a], how much better it would have been for us if we too had been burned in the fire
translation:
  language: zh_hans
  text: 难道我们所遭遇的灾祸还不够吗？那么，你若离弃我们，我们若也在火中被焚烧，岂不比这好得多吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala quae contigerunt nobis
  choice: 我们所遭遇的灾祸
  rationale: mala 指临到群体的祸患、灾难；“所遭遇的灾祸”准确且符合现代汉语表达。
- source_word: dereliqueris
  choice: 离弃
  rationale: 保留“抛下、不再眷顾”的强烈语气，也契合祈求语境中的庄重语体。
- source_word: quanto erat nobis melius
  choice: 我们还不如
  rationale: 以自然汉语表达反事实比较，即相较于被离弃，先前与他人一同被烧反倒更好。
- source_word: succensi et nos in incendio
  choice: 我们也被烈火焚烧
  rationale: succensi 是被焚烧，et nos 表示“我们也”；incendium 指火灾或大火，译作“烈火”简洁自然，并保留毁灭性的意象。
theological_decisions:
- issue: “你”所指对象及“离弃”的神学含义
  choice: 保留第二人称“你”及“离弃”，不补明身份或原因
  alternative: 将“你”明确译为“上帝”，或解释为撤回保护
  rationale: 本节拉丁文本只用第二人称动词，未在本句明说对象；不应在译文中补入解释而消除原有语境依赖。
- issue: 反事实愿望的力度
  choice: 译为“我们还不如也被烈火焚烧”
  alternative: 译为“那时我们若也被烧死，倒好得多”
  rationale: 原文强调被离弃与在火中被焚之间的尖锐比较，但未明说“死”；正文不额外补入死亡结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……还不够吗”保留反问语气；“那么，你若……”衔接条件句；不补出拉丁文本未明说的主语身份或“烧死”等结果。
