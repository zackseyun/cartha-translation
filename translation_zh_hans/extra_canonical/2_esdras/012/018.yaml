source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'capitibus eius exientem sed de medio corpore eius, Haec est interpretatio: quoniam post tempus regni illius nascentur contentiones non modicae, et periclitabitur ut cadat, et non cadet'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/018.yaml
  text: 'This is the interpretation: after the time of that kingdom[a], no small contentions will arise, and it will be in danger of falling; but it will not fall.'
translation:
  language: zh_hans
  text: 解释如下：那国延续一段时期以后，将发生不小的纷争；那国将面临倾覆的危险，然而不会倾覆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post tempus regni illius
  choice: 那国延续一段时期以后
  rationale: 拉丁语短语可指该国存在一段时期之后，而不必表示其时代已经结束；结合下文“面临倾覆……却不会倾覆”，此译法更贴合语境，也避免中文“在那国的时期以后”造成王国已经终结的误解。
- source_word: contentiones non modicae
  choice: 不小的纷争
  rationale: 保留否定式加强语气，同时以现代中文自然表达规模或程度相当大的争斗。
- source_word: periclitabitur ut cadat
  choice: 以致那国面临倾覆的危险
  rationale: periclitabitur 表示处于危险中；ut cadat 在此说明所面临的是倾覆之险。“倾覆”适合描述政权或国家倒台。
- source_word: et non cadet
  choice: 然而它不会倾覆
  rationale: 保留与前句的鲜明转折，不添加原文没有的时间副词。
theological_decisions:
- issue: 纷争是在王国终结后还是其存续期间发生
  choice: 译作“那国延续一段时期以后”，表示王国存续一段时间后发生
  alternative: 译作“那国的时期过后”，表示王国时代结束后发生
  rationale: post tempus 本身存在一定伸缩性，但紧接着说该国将有倾覆之险而实际不倾覆，更支持纷争发生时该国仍然存在；译文据语境传达此义，而不引入额外的末世论解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“解释如下”自然对应启示文学中的解释公式；重复“倾覆”保留拉丁原文 cadat / cadet 的呼应。开头残存短语“不是从它的头，而是从它身体中间出来”属于上一节或残缺衔接，依本节英文审校文本及句法边界不纳入本节正文。
