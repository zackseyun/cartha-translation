  text: spiritu meo inualidus sum ualde, et nec modica est in me uirtus a multo timore quem expaui nocte hac. Nunc ergo orabo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/005.yaml
  text: and in my spirit I am very weak[a], and there is not even a little strength in me because of the great fear that terrified me this night.
translation:
  language: zh_hans
  text: 我的心灵极其虚弱；因今夜那使我惊恐万分的极大恐惧，我连一点力气也没有。现在，我要祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiritu meo
  choice: 我的心灵
  rationale: 这里指说话者内在的精神状态；“心灵”比单用“精神”更自然，也保留了 spiritus 的内在层面。
- source_word: inualidus sum ualde
  choice: 极其虚弱
  rationale: 准确表达 ualde 的强烈程度，并以现代汉语自然呈现 inualidus 的无力状态。
- source_word: nec modica est in me uirtus
  choice: 我连一点力气也没有
  rationale: uirtus 在此依上下文指体力或力量，而非道德上的“美德”；“连一点……也没有”保留 nec modica 的强调。
- source_word: a multo timore
  choice: 因……巨大恐惧
  rationale: a 在此表示原因；multus 修饰 timor，强调恐惧之强烈。
- source_word: quem expaui
  choice: 那使我惊恐万分的
  rationale: expaui（expavesco 的完成时）表达强烈、骤然的惊恐；此译法避免弱化为普通的“感到害怕”，同时使汉语通顺。
- source_word: Nunc ergo orabo
  choice: 现在，我要祷告
  rationale: 保留 nunc 的时间推进和 orabo 的将来意向；汉语中无需机械译出 ergo，前后关系已由语境清楚表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文对心灵虚弱、全然无力和强烈惊恐的递进描写，不将 spiritus 神学化为特定教义概念。原文末句“现在，我要祷告”也予以保留。
