  text: upon the earth[a], and it will be the terror of all the kingdoms that were before it.
translation:
  language: zh_hans
  text: 在地上，它将成为所有在它以前的王国所惧怕的对象。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另可译：“在地上，它会比所有在它以前的王国更令人恐惧。”
    reason: 拉丁词 timoratio 也曾依据校勘读作比较级 timoratior，因而可产生比较级译法。
lexical_decisions:
- source_word: super terram
  choice: 在地上
  rationale: 保留本节开头的地点短语及其原有节界，不将其移至上一节。
- source_word: timoratio omnium regnorum
  choice: 所有王国的恐惧
  rationale: 按所提供的拉丁文本将 timoratio 作为名词处理，表达它将成为众王国惧怕的对象；同时用脚注保留另一种比较级读法的可能。
- source_word: quae fuerunt ante eam
  choice: 在它以前所有
  rationale: 将 ante 理解为时间上的“在……以前”，并以中性的“它”承接上下文所指对象，避免在本残句中擅自明确其所指。
theological_decisions:
- issue: timoratio 是否应按比较级理解
  choice: 正文采用名词性表达“成为……的恐惧”
  alternative: “比……更令人恐惧”
  rationale: 现给出的清理后拉丁文本为 timoratio，并非明确的比较级 timoratior；但抄本校勘及既往译法支持比较级理解，因此不在正文中强行消除这一文本与语义张力，而在脚注中保留异译。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。因本节从上一句延续而来，保留开头“在地上”的片段式衔接；“在它以前”明确表示时间先后，同时不越过本节有限语境指定先行对象。
