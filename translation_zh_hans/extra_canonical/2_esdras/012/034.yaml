revisions:
- from: 他必以怜悯拯救我的子民，就是那些在我疆界之内得以保全的人；他要使他们欢喜，直到末期——也就是我从起初便对你说过的审判之日——来到。这就是那梦。
  to: 他必以怜悯拯救我的子民，就是那些在我的境内得以保全的人；他要使他们欢喜，直到终局——就是我从起初便对你说过的审判之日——来到。这就是那梦。
  rationale: 作两处轻微的汉语措辞修订：“终局”更贴合 finis，且与“来到”搭配自然；“在我的境内”更符合现代标准汉语。正文仍严格限于所给12:34拉丁文，并保留 Hoc est somnium。英语审计轨迹中的旧长读法实际含12:33内容，非本节源文异文，故不在本节设置脚注或锚点。
  reviewer_model: gpt-5.6-terra
