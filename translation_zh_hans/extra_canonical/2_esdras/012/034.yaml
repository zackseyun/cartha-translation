source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populum meum liberabit cum misericordia, qui saluati sunt super fines meos, et iocundabit eos, quoadusque ueniat finis, dies iudicii, de quo locutus sum tibi ab initio. Hoc est somnium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/034.yaml
  text: he will deliver my people with mercy[a], those who have been preserved within my borders, and he will make them rejoice until the end comes, the day of judgment, of which I spoke to you from the beginning. This is the dream,
translation:
  language: zh_hans
  text: 他必以怜悯拯救我的子民，就是那些在我的境内得以保全的人；他要使他们欢喜，直到终局——就是我从起初便对你说过的审判之日——来到。这就是那梦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: liberabit cum misericordia
  choice: 必以怜悯拯救
  rationale: 保留介词短语所表达的方式或伴随意味，中文自然且不额外限定“怜悯”的神学内涵。
- source_word: qui saluati sunt
  choice: 那些……得以保全的人
  rationale: 这里的完成时被动式指此前存留下来或蒙保全的人；译作“得以保全”可与前面的“拯救”区分，避免中文重复。
- source_word: super fines meos
  choice: 在我疆界之内
  rationale: 拉丁语短语在此表示处于其边界或疆域范围内；采用自然汉语表达，不具体化为政治国境。
- source_word: iocundabit eos
  choice: 要使他们欢喜
  rationale: 准确表达使役意义，并保持庄重、通俗的现代汉语。
- source_word: quoadusque ueniat finis, dies iudicii
  choice: 直到末期——也就是……审判之日——来到
  rationale: 将“审判之日”理解为对“末期”的同位说明，同时用破折号清楚呈现拉丁语结构。
- source_word: Hoc est somnium
  choice: 这就是那梦
  rationale: 保留本节结句，避免与下一节发生节号错位；“那梦”回指先前所述异象之梦。
theological_decisions:
- issue: “我的子民”与“那些得以保全的人”的关系
  choice: 用“就是”把后者作为前者的解释性说明
  alternative: 译为非限制性的“他们是那些……”或另起一句
  rationale: 关系代词 qui 最自然地回指 populum meum；“就是”保留其限定或解释作用，不加入“余民”等本节拉丁文本未出现的词。
- issue: “末期”与“审判之日”的关系
  choice: 将“审判之日”作为“末期”的同位语
  alternative: 并列为两个相继事件
  rationale: 拉丁语 finis, dies iudicii 的并置最自然地构成同位关系；译文不把二者拆成不同的末世阶段。
- issue: 是否纳入前一节的责备、毁灭和“余民”措辞
  choice: 不纳入正文
  alternative: 沿用旧译较长读法并置于脚注
  rationale: 所给12:34拉丁文本从 populum meum 开始，旧译内容属于前一节的节号范围；本节须严格按所提供的源文跨度翻译。
translation_notes:
  register: 采用庄重而现代的标准普通话。句式尽量贴近拉丁原文的逻辑层次，同时以“就是”和破折号澄清关系词及同位结构。正文不设置脚注，因为所给拉丁源文在本节范围内没有需要以异文脚注保留的词句；英语旧脚注所载长读法实为前一节内容，并非本节源文异文。
