  text: the fourth kingdom that was seen in a vision by Daniel your brother. But it was not interpreted to him as I now interpret it to you,
translation:
  language: zh_hans
  text: 就是你弟兄但以理在异象中所看见的第四个国；但这国并没有像我如今向你解释的这样，向他解释过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnum quartum
  choice: 第四个国
  rationale: 按拉丁文直译，保留《但以理书》异象中诸国的政治含义。
- source_word: Danihelo fratri tuo
  choice: 你弟兄但以理
  rationale: 保留原文的亲属式称呼；此处“弟兄”表达同属一族或信仰群体，不擅自改释为“同胞”。
- source_word: interpretatum / interpretor
  choice: 解释明白／解释
  rationale: 以同一词根对应原文重复，同时用“解释明白”自然表达被动结构及说明异象含义的语境。
theological_decisions:
- issue: 第四个国与但以理异象的关系
  choice: 保留“你在异象中看见”与“但以理所见”的同一指涉
  alternative: 明确认定该国为某一历史帝国
  rationale: 原文只把以斯拉所见之国与但以理所见的第四国相联，并未在本节点明其历史身份，因此不作教派性或历史性补释。
- issue: 启示解释的差异
  choice: 表达为但以理当时未得到如今赐给以斯拉的这种解释
  alternative: 断言但以理完全没有得到任何解释
  rationale: quomodo ego nunc tibi interpretor 强调解释的方式或程度之对比；译文避免把原文绝对化。
translation_notes:
  register: 采用庄重而易懂的现代汉语；以“就是……也就是……”承接上文并理清拉丁文片段式句法，保留“异象”“国”“弟兄”等经文用语。
