    text: 所提供的拉丁文本止于介词 in（“在……中”），句子在此尚未完结。
    reason: source_fragment
lexical_decisions:
- source_word: subalares
  choice: 小翅膀
  rationale: 该词指异象中较小、次一级的翅膀；“小翅膀”自然明白，并与上下文意象相符。
- source_word: treicentes super caput
  choice: 飞到……头上方
  rationale: treicentes 是表示越过、移到或飞越的分词；结合翅膀的异象，以“飞到”表达运动，同时用“上方”保留 super 的空间含义。
- source_word: quod est a dextera parte
  choice: 右边那个
  rationale: 直译其方位限定，不把“右边”解释为象征性的尊位。
- source_word: conseruauit
  choice: 保全
  rationale: 可涵盖保存、保留和护佑之意；此处宾语为人，“保全”在现代汉语中自然且不预断具体方式。
- source_word: altissimus
  choice: 至高者
  rationale: 保留传统而通行的神圣称谓，不额外补出“上帝”，以维持原文表达。
theological_decisions:
- issue: 至高者所“保全”的具体时间、处境或目的
  choice: 保留“在……中”的未完状态
  alternative: 依上下文补成“在末后的日子中”或其他完整表述
  rationale: 所给拉丁文本止于介词 in，无法仅凭本节确定其补语；不应擅自消除原始材料的残缺与可能的释义空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“解释如下”清楚标示异象与解释之间的转换；省略号与脚注共同如实呈现所给拉丁片段的不完整性。
