  text: Therefore I will pray to the Most High, that he may strengthen me to the end.”
translation:
  language: zh_hans
  text: 所以，我要向至高者祷告，求他坚固我到底。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimum
  choice: 至高者
  rationale: 准确传达拉丁文最高级称号，并保持其作为神圣称谓的庄重与简洁。
- source_word: me confortet
  choice: 坚固我
  rationale: confortet 表示使人刚强、得力量；“坚固我”既贴近原文，也符合现代中文宗教语境。
- source_word: usque in finem
  choice: 到底
  rationale: 保留“直至终点／终局”的开放含义，不擅自限定为生命终结或异象结束。
theological_decisions:
- issue: usque in finem 所指的终点
  choice: 译作“到底”，不明确限定
  alternative: 直到最后／直到终结
  rationale: 原文没有说明是坚持到生命终点、事件结束还是异象终局；“到底”自然地保留这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“所以”承接上文推论，不加入原文没有的“现在”。句末引号表明本节延续并结束前文人物的话。
