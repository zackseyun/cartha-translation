  text: 锡安。因为我们并不比那些死在那里的人更好。”他们便放声大哭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sion
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的专名译法；原文位于承接上文的位置，保留其片段式开头。
- source_word: Nec enim nos meliores sumus eorum
  choice: 因为我们并不比……更好
  rationale: 按拉丁文比较结构直译其自我评判，中文自然且不额外解释“更好”所指的是道德、命运还是资格。
- source_word: qui ibi mortui sunt
  choice: 那些死在那里的人
  rationale: 保留 ibi“在那里”的指向性，不自行补明地点。
- source_word: plorauerunt uoce magna
  choice: 放声大哭
  rationale: 以现代汉语惯用表达传达“大声哭泣”，兼顾力度与自然度。
theological_decisions:
- issue: “我们并不比……更好”的含义范围
  choice: 保持笼统，不补作道德优越、配得或命运方面的解释
  alternative: 译成“我们并不比他们更义”或“我们不比他们更配活着”
  rationale: 拉丁文 meliores 仅表示“更好”，上下文本身的神学张力不应由译者单向限定。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“锡安”作为承接上文的残句予以保留；后半句用“放声大哭”避免生硬的“以大声哭泣”。
