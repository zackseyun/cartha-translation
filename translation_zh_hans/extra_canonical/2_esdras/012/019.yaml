translation:
  language: zh_hans
  text: 那时，它却将再次恢复到起初的状态。[a] 因为
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恢复到它原有的起点。”
    reason: 说明 in suum initium 可较直译为“到它自己的／原有的起点”；正文按恢复的语境译为“起初的状态”。
lexical_decisions:
- source_word: tunc
  choice: 那时
  rationale: 保留原文的时间副词，并使这一残句自然承接上文。
- source_word: iterum constituetur
  choice: 要再次恢复
  rationale: 被动式 constituetur 在此表示重新建立或恢复；结合 iterum，译作“再次恢复”简洁自然。
- source_word: in suum initium
  choice: 到起初的状态
  rationale: 直义为“到它自己的开端”；在“恢复”的语境中，“起初的状态”比“起点”更自然，同时不具体限定所恢复的政治或历史形态。
- source_word: Et quoniam
  choice: 因为
  rationale: 保留引出下文原因从句的残缺衔接；中文段首用“因为”即可自然表达。
theological_decisions:
- issue: “恢复到起初”所指的具体对象或形态
  choice: 保持泛指，不补出具体政权、国度或制度
  alternative: 按上下文解释性地补明所恢复的对象
  rationale: 本句拉丁文本只用物主形式 suum，并未在此残句中明说具体形态；译文不应替原文消除这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留句首“那时，却”及句末“因为”的片段性，以忠实呈现所给拉丁文本与上下文的衔接。
