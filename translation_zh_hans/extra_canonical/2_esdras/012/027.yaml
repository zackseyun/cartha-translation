  text: the sword will devour them[a]. For one sword will devour him who is with it,
translation:
  language: zh_hans
  text: 刀剑必吞噬他们。[a]因为其中一人的刀剑，必吞噬与他同在的那一个，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 先前译文曾在这里误接上一节关于“大头消失”的解释；现据本节拉丁文本翻译。
    reason: 说明旧译的经节错位，且不对缺乏本任务材料支持的“较早编排或译本”作额外断言。
lexical_decisions:
- source_word: gladius eos comedet
  choice: 刀剑必吞噬他们
  rationale: 直译“刀剑吞噬他们”的强烈意象；“吞噬”在现代汉语中自然，也保留原文拟人化表达。
- source_word: Vnius … gladius
  choice: 其中一个的刀剑
  rationale: Vnius 是属格，较自然地理解为“其中一个的”，而不是把它直接处理为数词“一把”；这样也保留此残句的关系结构。
- source_word: qui cum eo
  choice: 与他同在的那一个
  rationale: qui 指阳性单数对象，eo 也为阳性单数；译作“与他同在的那一个”保留指代上的含混，不擅自确定具体人物。
theological_decisions:
- issue: Vnius enim gladius comedet qui cum eo 的残缺句法与指代关系
  choice: 因为其中一个的刀剑，必吞噬与他同在的那一个
  alternative: 因为一把刀剑必吞噬与它同在的人
  rationale: 拉丁文 Vnius 更直接是属格“一个人的／其中一个的”，而 qui 与 eo 均为阳性形式；采用人物指代但不点明身份，可最大限度保留原文含混。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“刀剑必吞噬”保留启示文学的强烈意象；末尾逗号反映所给拉丁文本在此处尚未完句。
