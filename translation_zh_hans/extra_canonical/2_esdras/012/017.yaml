- from: 你又听见有声音说话，不是从它的那些头发出，而是从它身体中间发出；
  to: 又因为你听见一个声音在说话，不是从它的各个头发出，而是从它身体中间发出；
  rationale: 修复因果连接的遗漏，并消除“头发”这一会改变意象理解的中文词界歧义。修订仍按英语审校层补足拉丁残片之后的来源对比，保留原句未完的分号以及异象性、非解释性的“头”和“身体中间”。
