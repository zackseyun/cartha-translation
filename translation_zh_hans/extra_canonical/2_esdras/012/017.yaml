  text: 又因为你听见一个声音在说话，不是从它的各个头发出，而是从它身体中间发出；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et quoniam audisti
  choice: 你又听见
  rationale: 承接前文所见异象；“又”自然表达拉丁文 Et 的连接作用，句式保持未完待续。
- source_word: uocem quae locuta est
  choice: 有声音说话
  rationale: 贴近“一个说话的声音”，同时采用现代汉语自然表达。
- source_word: non de
  choice: 不是从……发出
  rationale: 现存拉丁文本在此截断，但英语审校层及经文连续内容表明这是来源对比；补出“发出”使汉语完整，不增加新的语义。
- source_word: capitibus eius ... de medio corporis eius
  choice: 从它的那些头……从它身体中间
  rationale: 依据英语审校层所保存的本节完整内容译出；“那些头”对应异象中复数的头，“身体中间”保留空间意象。
