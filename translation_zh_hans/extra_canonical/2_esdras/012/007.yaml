  text: nator domine, si inueni gratiam ante oculos tuos, et si iustificatus sum apud te prae multis, et si certum ascendit deprecatio mea ante faciem tuam, Conforta me et ostende seruo tuo mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/007.yaml
  text: And I said[a], “O Sovereign Lord, if I have found favor before your eyes, and if I have been justified before you more than many, and if my petition has surely gone up before your face, strengthen me and show yourself to me, your servant.”
translation:
  language: zh_hans
  text: 我说：“主宰上主啊，我若在你眼前蒙恩，若我在你面前被判为义，胜过许多人，若我的恳求确实已经上达你面前，求你使我刚强，并向我——你的仆人——显明[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“并向你的仆人——我——显明”。“显明”的宾语在本节中没有明说，句意可能延续到下一节。
    reason: 说明拉丁文ostende seruo tuo mihi中未明示的宾语，并避免将其确定解释为“显明你自己”。
lexical_decisions:
- source_word: dominator domine
  choice: 主宰上主啊
  rationale: 该称呼跨经节保存为拉丁文残形 nator domine；“主宰上主”既表达 dominator 的统治权，也保留 domine 的神圣称谓，语气庄重自然。
- source_word: iustificatus sum apud te
  choice: 我在你面前被判为义
  rationale: 采用被动、裁断性的表达，保留 iustificatus 的司法与神学张力，不将其弱化为一般的“得到认可”。
- source_word: prae multis
  choice: 胜过许多人
  rationale: 直陈比较关系，不擅自把 multis 扩展为“所有人”或“其他所有人”。
- source_word: certum ascendit deprecatio mea ante faciem tuam
  choice: 我的恳求确实已经上达你面前
  rationale: “确实”对应 certum，“上达”保留 ascendit 的上升意象，也符合现代汉语祈祷语境。
- source_word: Conforta me
  choice: 求你使我刚强
  rationale: 准确表达使役意义，并以“求你”自然呈现祈求中的命令式。
- source_word: seruo tuo
  choice: 你仆人
  rationale: 在向上主祈求的语境中，“仆人”准确表达从属与服事关系，比现代汉语的“奴隶”更符合此处自称的语域。
theological_decisions:
- issue: iustificatus 的含义
  choice: 被判为义
  alternative: 称义；看为正直
  rationale: “被判为义”保留被动语态和裁断色彩，同时不把此处系统化为某一宗派的称义教义。
- issue: ostende 的未明宾语
  choice: 并指示我这仆人
  alternative: 向我这仆人显明你自己
  rationale: 拉丁文 ostende 在本节所给文本中没有明示宾语，而且句意可能承接下一节；不补入反身宾语“你自己”，以免消除原文的不完整性和歧义。
translation_notes:
  register: 采用庄重而现代的祈祷语体。“主宰上主”保留复合神圣称谓；“上达你面前”保留古代宫廷与祷告意象。结尾不擅自补足宾语，并用脚注交代其可能承接下节。
