  yaml_path: translation/extra_canonical/2_esdras/012/020.yaml
  text: '“And because you saw eight little wings clinging to its wings, this is the interpretation: eight kings will arise in it,'
translation:
  language: zh_hans
  text: “因为你看见八只小翼紧贴着它的翅膀，其解释是：因为将有八位王在它里面兴起，他们的时期……”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subalares octo
  choice: 八只小翼
  rationale: subalares 在此指附属于大翅膀的较小翅膀；译作“小翼”既保留异象意象，也与上下文中的“翅膀”相区分。
- source_word: coherentes alis eius
  choice: 紧贴着它的翅膀
  rationale: coherentes 表示黏连、依附或紧密相接；“紧贴着”自然传达其依附状态，而不额外解释具体位置。
- source_word: exsurgent enim in ipso octo reges
  choice: 将有八位王在其中兴起
  rationale: 保留 in ipso 的代词含混性，以“其中”指向异象中的主体，不擅自明确为某个帝国或国度；exsurgent 译为“兴起”符合君王出现掌权的语境。
- source_word: quorum erunt tempora
  choice: 他们的时期……
  rationale: 原句在所给经节处未完，直译保留后续将说明这些王之时期的悬接结构，并以省略号提示句意延续。
theological_decisions:
- issue: in ipso 所指为何
  choice: 译作“在其中”，保留所指的含混性
  alternative: 译作“在那帝国中”或“在那鹰身上”
  rationale: 拉丁文仅用阳性单数代词 ipso；本节自身未明确补出其先行词，不宜把解释性的身份判断写入正文。
- issue: 八位王的性质
  choice: 仅译为“八位王”
  alternative: 译作“八个统治者”或指定为某王朝君主
  rationale: reges 的直接含义是“王”；不把历史鉴别或特定末世解释加入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。经节从异象细节转入解释，保留“解释如下”的正式语气。拉丁文本止于未完成的 quorum erunt tempora，因此中文以省略号收束，避免制造原文没有的完整句意。
