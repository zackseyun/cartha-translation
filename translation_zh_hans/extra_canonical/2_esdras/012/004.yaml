  text: because you search out the ways of the Most High. Behold, I am still weary in my spirit, and
translation:
  language: zh_hans
  text: 因为你探究至高者的道路。看哪，我心中仍感疲惫，而且——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutas
  choice: 探究
  rationale: 表达细察、寻索之意，比单纯“寻找”更贴近拉丁文的探查意味。
- source_word: uias altissimi
  choice: 至高者的道路
  rationale: 保留“道路”的比喻及“至高者”这一称号，不将其解释性改写为旨意或作为。
- source_word: animo
  choice: 心里
  rationale: animus 可指心灵、内在精神或心志；“心里”在现代汉语中自然，并保留较宽泛的内在含义。
- source_word: fatigatus sum
  choice: 疲惫
  rationale: 准确传达身心劳顿、困乏的状态，措辞自然而庄重。
- source_word: Ecce
  choice: 看哪
  rationale: 保留提示听者注意的语用功能及经文语体。
theological_decisions:
- issue: “至高者的道路”的所指
  choice: 保留比喻性表述“道路”
  alternative: 译作“至高者的旨意”或“作为”
  rationale: 原文 uias 本身具有开放性，可能涵盖行事方式、安排或旨意；不在译文中缩窄其神学含义。
- issue: animus 的人论含义
  choice: 译作“心里”
  alternative: 译作“灵里”或“灵魂”
  rationale: 拉丁词在此未必指一个严格区分于身体的神学实体；“心里”避免过度界定，同时自然表达内在疲惫。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”保留经文式提示语。末尾保留“而且”，以反映所给拉丁文本在此处未完的句法连接。
