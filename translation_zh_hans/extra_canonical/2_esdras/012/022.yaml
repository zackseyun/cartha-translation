  text: but two will be preserved until the end. And because you saw three heads
translation:
  language: zh_hans
  text: 但有两个将被保留到末了。又因你看见了三个头，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: duo uero
  choice: 但有两个
  rationale: uero 在上下文中带转折意味，译作“但”；duo 保持为“两个”，其所指承接上文，不擅自补明。
- source_word: in finem
  choice: 到末了
  rationale: 保留时间终点的表达，也避免把 finem 过度限定为某一特定末世事件。
- source_word: seruabuntur
  choice: 将被保留
  rationale: 用被动式对应拉丁文将来被动语态，保留“保存、留存”的基本含义及施事者未明的特点。
- source_word: Et quoniam uidisti
  choice: 至于你所看见的
  rationale: 此处引出对异象细节的解释；采用自然汉语衔接，同时保留“你看见”这一已发生动作。
- source_word: tria capita
  choice: 三个头
  rationale: 直译异象意象，不将 capita 解释性改写为君王、政权或领袖。
theological_decisions:
- issue: “末了”的具体所指
  choice: 不加限定地译为“末了”
  alternative: 译为“末世”或“最后时期”
  rationale: 拉丁文 in finem 本身没有明确限定其末世论细节，应保留原文的宽度。
- issue: 被保留者及保留者的身份
  choice: 维持省略与被动表达
  alternative: 补作“两个王将被上帝保全”
  rationale: 本句只说“两个”将被保留，并未在该分句中明说其身份或施事者，不宜加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“末了”略带经文语体但仍属现代常用表达。末尾逗号保留原句未完的结构，表明下一节或后文将继续解释“三个头”。
