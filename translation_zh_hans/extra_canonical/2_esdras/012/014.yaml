  text: And twelve kings will reign in it[a], one after another.
translation:
  language: zh_hans
  text: 其中将有十二位王相继掌权。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Regnabunt
  choice: 掌权
  rationale: 表达“作王、统治”的语义；与主语“十二位王”搭配自然，又不增添原文没有的统治方式。
- source_word: in ea
  choice: 其中
  rationale: 保留阴性代词所回指的前文对象，不在本节擅自明确其所指。
- source_word: XII reges
  choice: 十二位王
  rationale: 忠实保留数目与君王称谓；用量词“位”符合现代汉语庄重表达。
- source_word: unus post unum
  choice: 相继
  rationale: 简洁自然地传达“一个接一个”的先后次序。
theological_decisions:
- issue: 阴性代词 ea 的所指
  choice: 译作“其中”，保留上下文回指
  alternative: 明确译作某一国、某一兽或某一权势
  rationale: 本节自身没有明说先行词，明确化会消除原文保留的上下文依赖。
translation_notes:
  register: 采用现代、简洁而庄重的叙述语体。“相继掌权”自然传达十二位王依次统治之意；不保留英文旧稿中已判定为排版残留的引号，也不设置缺乏实质异文内容的脚注。
