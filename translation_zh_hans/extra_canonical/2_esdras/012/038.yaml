  yaml_path: translation/extra_canonical/2_esdras/012/038.yaml
  text: And you shall teach them to the wise among your people, whose hearts you know are able to comprehend and keep them secret.
translation:
  language: zh_hans
  text: 你要把这些事教给你百姓中的智者，就是那些你知道他们心里能领会、也能守密的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在“并且”之后中断；“也能守密”依据句法续意及传本所反映的语境译出。
    reason: 说明所给拉丁文本在本节末尾残缺，避免让读者误以为保密短语在该文本中完整保存。
lexical_decisions:
- source_word: docebis ea
  choice: 把这些事教给
  rationale: ea指前文所见并记录之事；译为“这些事”比单用代词更符合现代汉语，同时不额外具体化其内容。
- source_word: sapientes de populo tuo
  choice: 你百姓中的智慧人
  rationale: 保留sapientes的“智慧人”以及de populo tuo所表达的群体范围。
- source_word: quorum scis corda posse capere
  choice: 那些你知道其内心能够领会……的人
  rationale: corda按古代语境指人的内在理解能力；capere在此为“领会、容纳”，译作“内心能够领会”既保留心的意象，也自然清楚。
- source_word: et
  choice: 也能守住秘密
  rationale: 所给拉丁文本止于连接词et，句意未完；依审校层所保存的续意译出保密要求，但不把所保守的内容扩写为特定的“这些奥秘”。
theological_decisions:
- issue: 智慧人的资格
  choice: 理解为既能领会、又能保密的人
  alternative: 仅理解为有知识或社会身份的智者
  rationale: 经文把资格落在其“心”所具备的能力上，而不是某种制度性身份；译文保留这一重点。
- issue: 末尾隐含宾语
  choice: 译作“守住秘密”
  alternative: 译作“保守这些奥秘”或省去未完部分
  rationale: “守住秘密”表达保密之义，又避免把残缺文本中过度明确的宾语或“奥秘”这一神学色彩较强的名词补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“守住秘密”比“保守奥秘”更自然，也避免不必要的神学扩义；句式保留原文对这些智慧人内在能力的界定。
