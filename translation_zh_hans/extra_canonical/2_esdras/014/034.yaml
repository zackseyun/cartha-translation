  text: you will be kept alive[a], and after death you will obtain mercy. For judgment will come after death, when again
translation:
  language: zh_hans
  text: 你们必得保全性命，死后也必蒙怜悯；因为审判必在死后到来，到那时又……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文至此句未完；后文接续其意思。
    reason: 说明拉丁文分节在 quando iterum 处中断，避免读者误以为正文残缺或译者遗漏。
lexical_decisions:
- source_word: uiui conseruati eritis
  choice: 你们将得以存活
  rationale: 按拉丁文直译为“你们将活着被保全”，这里用自然的现代汉语表达其被保全而存活之意，并保留第二人称复数和将来含义。
- source_word: post mortem misericordiam consequemini
  choice: 死后也必蒙怜悯
  rationale: consequemini 指“获得、得到”；“蒙怜悯”既准确传达被动领受的语义，也符合庄重而通俗的经文语体。
- source_word: Iudicium enim post mortem ueniet
  choice: 因为审判将在死后临到
  rationale: 保留 enim 的因果关系、post mortem 的时间定位，以及 ueniet“将来临”的意象。
- source_word: quando iterum
  choice: 那时又……
  rationale: 本节所给拉丁文在 quando iterum 处中断，谓语属于下一节；以省略号保留未完句法，不擅自补入“复活”等内容。
theological_decisions:
- issue: 死后审判与后续复生语句的关系
  choice: 本节止于“那时又……”，不补足下一节谓语
  alternative: 译作“那时我们将再次活过来”
  rationale: 所提供的本节拉丁文仅到 quando iterum；reuiuiscemus 属于下一源文本分段。依源文边界保留悬置，可避免机械错节并不提前消解语义。
- issue: misericordiam 的表达
  choice: 蒙怜悯
  alternative: 得到慈悲
  rationale: “怜悯”在现代汉语中清楚自然，也保留神学语境中 mercy 的核心意义，而不额外指定施怜悯者。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“得以存活”传达被保全而活着的含义；末尾用省略号忠实呈现源文跨节未完的句子。
