  text: 百姓；我说：“以色列啊，要听这些话：寄居者，寄居——”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文在 pere- 处中断；这里用破折号保留残缺状态。“寄居者”也可理解为“漂泊者”，其句法作用因原文残缺而不能完全确定。
    reason: 说明底本文字的物理中断，并保留 Peregrinantes 的词义及句法不确定性。
lexical_decisions:
- source_word: populum
  choice: 百姓
  rationale: 保留拉丁文宾格名词的承接性质；本节从前文句中截入，因此不擅自补出源文未提供的支配动词。
- source_word: dixi
  choice: 我说
  rationale: 以现代汉语明确表达拉丁文第一人称单数完成时；“然后”自然呈现 et 的叙事承接作用。
- source_word: Audi, Israel
  choice: 以色列啊，要听
  rationale: 保留直接呼语和命令语气，同时采用自然、庄重的现代汉语表达。
- source_word: Peregrinantes
  choice: 寄居者啊
  rationale: 该词可指寄居、漂泊在外的人；按其主格复数及当前语境译作呼语，但不进一步界定其身份。
- source_word: pere-
  choice: 寄居——
  rationale: 以重复词干和破折号表现残缺的拉丁文，而不猜补其完整词形或句意。
theological_decisions:
- issue: Peregrinantes 的句法功能
  choice: 按对“寄居者”的呼语处理
  alternative: 译作分词性从句，如“当你们寄居时”或“漂泊着”
  rationale: 现存片段缺少后续语境，句法不能完全确定；正文采用与呼告“以色列啊”相衔接的可读方案，脚注明确保留不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。开头“百姓”刻意保留为承接前文的残句，不补写未见于所给拉丁文片段的动作；末尾则用破折号清楚标示底本中断。
