  text: For your law has been burned, and therefore no one knows the things done by you
translation:
  language: zh_hans
  text: 因为你的律法已被焚毁，所以无人知道你所行的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lex tua
  choice: 你的律法
  rationale: 直译所有格和名词，保留经文中指向上帝之律法的表达。
- source_word: incensa est
  choice: 已被焚毁
  rationale: 拉丁文为完成时被动式；“焚毁”比单纯“烧了”更自然地表达文献遭火焚烧而毁坏。
- source_word: propter quod
  choice: 所以
  rationale: 清楚表达前句与后句之间的因果关系，符合现代汉语。
- source_word: nemo scit
  choice: 无人知道
  rationale: 简洁、庄重地对应绝对否定。
- source_word: quae a te
  choice: 你所行的事
  rationale: 现存拉丁文片段字面为“由你……的事”，语法似有省略或文本残缺；依英语审校层所反映的理解译出隐含的“行”，同时不作更具体的神学限定。
theological_decisions:
- issue: “quae a te”所指内容
  choice: 你所行的事
  alternative: 出于你的事／你所作的事
  rationale: 拉丁文本在此似不完整；采用最自然且与审校层一致的补足，但不将其窄化为“神迹”“旨意”或“审判”。
translation_notes:
  register: 采用现代、庄重而易懂的书面语；保留“律法”这一圣经传统术语。因本节拉丁文末尾疑有省略或残缺，正文采取克制的语义补足。
