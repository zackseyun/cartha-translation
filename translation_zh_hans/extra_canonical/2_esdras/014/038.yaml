  text: and behold[a], a voice called me, saying, “Ezra, open your mouth and drink what I am giving you.” And I opened my mouth, and behold, a full cup
translation:
  language: zh_hans
  text: 看哪[a]，有声音呼唤我说：“以斯拉，张开你的口，喝下我给你的。”于是我张开口；看哪，有一个盛满的杯子——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 先前跨节译法作：“第二天，事情发生了。看哪，有声音呼唤我说：‘以斯拉，张开你的口，喝下我给你喝的。’于是我张开口；看哪，有一个盛满的杯子递到我面前。”
    reason: 保留先前译法供参照；其中开头和结尾的措辞分别来自相邻经节的拉丁文本，不在本节所给的原文范围内。
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留原文两次出现的提示语及其庄重、引人注意的语气。
- source_word: uox uocauit me
  choice: 有声音呼唤我
  rationale: 忠实保留声音发出者未明的表达，不擅自补出身份。
- source_word: bibe quod te potiono
  choice: 喝下我给你的
  rationale: 以自然现代汉语表达“我给你喝的／我正给你饮用的”，避免生硬重复，同时不增添原文未明说的饮品名称。
- source_word: calix plenus
  choice: 一只盛满的杯
  rationale: 保留杯中盛满某物却未在本节说明为何物的悬置，也保留本节结尾未完的句法状态。
theological_decisions:
- issue: 呼唤以斯拉之声音的身份
  choice: 仅译为“有声音”
  alternative: “上帝的声音”或“主的声音”
  rationale: 拉丁原文只说 uox，没有在本节明指声音属于谁；不以神学推断取代文本的含混。
- issue: 杯中之物
  choice: 不说明盛满何物
  alternative: 补作“盛满水／饮料的杯”
  rationale: 原文 calix plenus 只说杯是满的，本节内没有宾语，应保留其悬念。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪”延续经文叙事语体；末尾用破折号提示原文在“一只盛满的杯”处中断，并避免从下一节补入谓语。
