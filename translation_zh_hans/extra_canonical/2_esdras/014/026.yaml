  text: When you have completed them[a], some things you shall make public, and some things you shall hand over in secret to the wise. For tomorrow at this hour you shall begin to write.” And I went away, as he commanded me, and I gathered all the
translation:
  language: zh_hans
  text: “你写完以后[a]，要把一部分公开，把另一部分秘密交给有智慧的人，因为明天这个时候，你就要开始写。”于是我照着他的吩咐离去，召集了所有的……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文没有明说“写完”的宾语；可按上下文理解为“写完这些书”。
    reason: 说明源文宾语省略，并保留其语法上的含混。
lexical_decisions:
- source_word: cum perfeceris
  choice: 你写完以后
  rationale: 按时间从句直译；结合下文“开始写”补出汉语中自然的动词“写”，但不擅自指定宾语。
- source_word: quaedam palam facies
  choice: 要把一部分公开
  rationale: palam 表示公开地；facies 在此依语境译为“公开”，quaedam 与后一个 quaedam 构成“一部分……另一部分……”的对举。
- source_word: sapientibus absconse trades
  choice: 把另一部分秘密交给有智慧的人
  rationale: trades 是“交付、交给”，absconse 是“隐秘地、秘密地”；保留 sapientibus 的一般性称谓，不加宗派性解释。
- source_word: enim
  choice: 因为
  rationale: 保留其解释前述命令与次日写作安排之间关系的功能。
- source_word: profectus sum
  choice: 我……离去
  rationale: 表示动身离开；以现代汉语叙事自然表达。
- source_word: congregaui omnem
  choice: 召集了所有的……
  rationale: 原始引文在 omnem 后截断；用省略号明确本节文本未完，不猜补其宾语。
theological_decisions:
- issue: 公开内容与秘密传授内容的区分
  choice: 直译为“一部分公开……另一部分秘密交给有智慧的人”
  alternative: 将其解释为特定正典与秘传书卷的分类
  rationale: 本句本身未明确两类内容的具体身份或权威地位，因此保留文本的概括性，不加入后来的正典或宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“有智慧的人”比单用“智者”更透明；句末保留省略号，以对应所给拉丁文本在本节末尾的不完整状态。
