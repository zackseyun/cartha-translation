revisions:
- from: 把这五个人带来，因为他们已经准备好，可以迅速书写。你要到这里来，我要在你心里点燃一盏悟性的灯；这灯不会熄灭，直到你开始写的都写完为止。
  to: 这五个人已经准备好迅速书写。你要到这里来；我要在你心里点燃一盏悟性的灯，这灯不会熄灭，直到你所开始写的一切都完成。
  rationale: 修订避免把承接上文的 hos 具体补译为“带来”，同时使结尾的完成对象和被动含义更清晰。其余关键意象、语气与含义均予保留。
