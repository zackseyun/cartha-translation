review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了“迅速书写”“在心里点燃……灯”及该灯持续至写作完成的核心意思。不过，所给拉丁文以承接上文的宾格 hos（“这五个人”）开头，并未在本节明载“带来”这一动词；译作“把这五个人带来”会将承接关系具体化为本节中的命令。结尾“你开始写的都写完”意思可理解，但“都写完”略显口语且句法指向不够清晰。
  naturalness: “悟性的灯”庄重、易懂，适合本段语体。将首句处理为独立的“这五个人已经准备好迅速书写”可避免汉语中不完整的承接宾格，也不额外补出“带来”。结尾改为“你所开始写的一切都完成”更清楚自然，并保留原文被动式所表达的“事情完成”。
  terminology: “悟性”可恰当地表达 intellectus 的理解、领悟能力，并保留 lucerna 的“灯”这一比喻；无需作神学性扩展。
  issues:
  - severity: medium
    issue: “把这五个人带来”补出了本节拉丁文未明载的动作。
    rationale: hos 是承接前文的宾格；虽上下文可能提供相关命令，但本节所给文本和英语审校层只呈现“这五个人，因为……”。宜避免将该承接关系明确化为“带来”。
  - severity: low
    issue: “直到你开始写的都写完为止”表达略显口语且范围不够清楚。
    rationale: quae incipies scribere 指“你将开始写的一切”，finiantur 指这些事项完成；改为“直到你所开始写的一切都完成”为宜。
  revised_text: 这五个人已经准备好迅速书写。你要到这里来；我要在你心里点燃一盏悟性的灯，这灯不会熄灭，直到你所开始写的一切都完成。
