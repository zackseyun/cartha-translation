  text: these five, because they are ready to write quickly. And you shall come here, and I will kindle in your heart a lamp of understanding that will not be extinguished until the things that you begin to write are finished.
translation:
  language: zh_hans
  text: 这五个人已经准备好迅速书写。你要到这里来；我要在你心里点燃一盏悟性的灯，这灯不会熄灭，直到你所开始写的一切都完成。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hos
  choice: 这五个人
  rationale: 代词本身意为“这些人”；结合本节给出的上下文与英语审校层，明确指前文所说的五人。
- source_word: parati sunt ad scribendum uelociter
  choice: 已经准备好，可以迅速书写
  rationale: 兼顾 parati 的“准备好”和 uelociter 的“迅速”，表达自然且不增添抄写技巧等原文未明说的信息。
- source_word: lucernam intellectus
  choice: 一盏悟性的灯
  rationale: 保留“灯”的具体比喻，并以“悟性”表达 intellectus 所指的理解、领悟能力。
- source_word: quoadusque finiantur quae incipies scribere
  choice: 直到你开始写的都写完为止
  rationale: 保留被动式所强调的写作内容得以完成，同时用现代汉语顺畅表达。
theological_decisions:
- issue: 内在启示的比喻
  choice: 在你心里点燃一盏悟性的灯
  alternative: 使你心中充满理解
  rationale: 原文明确使用“灯”及“点燃”的意象，应予保留，不将其抽象化，也不进一步界定其神学机制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留原文的灯与点燃意象。清理本节首尾残留的连接词，按完整经节处理。
