  rationale: 此处指分别计数的著作或书卷；“卷书”既便于与数词搭配，也符合经籍语境。
- source_word: Scripti sunt
  choice: 写成了
  rationale: 保留被动式的结果重点，不擅自补出执笔者。
- source_word: DCCCClIIII
  choice: 九十四
  rationale: 传抄的罗马数字形式存在文本困难；依本章后文公开二十四卷、另藏七十卷的合计，正文采用广泛认可的九十四。
