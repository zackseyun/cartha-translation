  text: since he is a judge[a], he took away from you in due time what he had given. And
translation:
  language: zh_hans
  text: 既然他是审判者，他就在适当的时候从你们那里收回了他曾赐下的。并且[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “并且”承接下一节；原文在此以连接词结尾。
    reason: 说明本节保留原文句末 Et 所造成的跨节未完句式，避免读者误以为正文残缺。
lexical_decisions:
- source_word: iudex cum sit
  choice: 既然他是审判者
  rationale: cum加虚拟式在此自然表达原因；iudex直译为“审判者”，不增添拉丁文本未明说的“公义”。
- source_word: abstulit a uobis
  choice: 从你们那里收回了
  rationale: abstulit表示拿走；结合先前所赐之物，汉语用“收回”自然且保留施予者取回之意。
- source_word: in tempore
  choice: 在所定的时候
  rationale: 该短语可指在适当或指定的时间；译文避免过度明确为“及时”，并符合庄重的叙事语体。
- source_word: quod donauerat
  choice: 他曾赐下的
  rationale: quod为中性关系代词，所指事物未明；以“……的”保留其未具体说明的特点，donaverat用“曾赐下”体现过去完成意义。
- source_word: Et
  choice: 并且
  rationale: 保留原文句末连接词，表明语意延续到下一节。
theological_decisions:
- issue: 审判者是否应明确为“公义的”
  choice: 仅译“审判者”
  alternative: “公义的审判者”
  rationale: 所给本节拉丁文本只有iudex；虽校勘说明前一文本块可能有Iustus修饰它，但本节所提供原文没有该词，因此不在正文补入，以免无依据地强化神学描述。
- issue: 所赐之物的具体所指
  choice: 保留为未具体说明的“他曾赐下的”
  alternative: 补明为生命、律法或恩赐
  rationale: 中性关系代词quod没有在本句中具体指明对象，译文保留原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“既然”清楚表达原因关系；“所定的时候”保持经文语体但不过分古雅。句末“并且”刻意保留原文跨节延续的结构，并以脚注说明。
