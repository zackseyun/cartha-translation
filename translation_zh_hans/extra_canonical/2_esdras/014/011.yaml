  yaml_path: translation/extra_canonical/2_esdras/014/011.yaml
  text: For the age has been divided into twelve parts[a], and ten of its parts have already passed, and half of the tenth part.
translation:
  language: zh_hans
  text: 因为这个时代被划分为十二个部分，其中十个部分已经过去，以及第十部分的一半也已经过去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 多种古代译本作“其中九个部分已经过去，第十部分的一半也已经过去了”。这一读法也与下一节所说尚余两个半部分相符。现存拉丁文本则作“十个部分”。
    reason: 说明重要的古代文本异文，以及现存拉丁读法造成的数字张力。
lexical_decisions:
- source_word: saeculum
  choice: 这世代
  rationale: 此处指被划分为若干阶段、走向终局的时代；“世代”既自然，也保留其时间与末世论色彩。
- source_word: partibus
  choice: 部分
  rationale: 直译其分段、份额之义，并与后文计算相呼应。
- source_word: transierunt
  choice: 已经过去
  rationale: 准确表达这些时段已经流逝。
- source_word: X
  choice: 十个
  rationale: 正文依所给拉丁文本的明确读法 X；但其他古译本及上下文支持“九个”，故在脚注说明文本问题。
- source_word: dimidium xmae partis
  choice: 第十部分的一半
  rationale: 形式对应拉丁文，保留现存拉丁文本中“十个部分”与“第十部分的一半”之间的张力，不在正文中擅自调和。
theological_decisions:
- issue: 末世时间分段中的数目
  choice: 正文译作“十个部分”，并以脚注交代“九个”的异文
  alternative: 正文采用“九个部分”，使本节及下一节的计算一致
  rationale: 所提供的拉丁原文明确作 X（十），应优先如实翻译；同时，多种古代译本所见“九”能消除内部计算困难，因此该重要异文不可省略。
translation_notes:
  register: 采用庄重而清楚的现代汉语。“连……也……”使拉丁文并列结构在中文中自然可读；脚注保留文本证据中的真实歧义，不在正文中无声修正。
