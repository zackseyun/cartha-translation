source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu enim reciperis ab hominibus, et conuerteris residuum cum filio meo et cum similibus tuis usquequo finiantur tempora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/009.yaml
  text: For you will be taken up from among men[a], and you will remain with my son and with those like you until the times are finished.
translation:
  language: zh_hans
  text: 因为你将从人间被接去，并在余下的时间里与我儿子和与你相似的人同在，直到诸时期终结。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reciperis ab hominibus
  choice: 从人群中被接去
  rationale: 保留被动语态及“离开人群”的含义；“被接去”也保留目的地未明的含混性。
- source_word: conuerteris residuum
  choice: 一同留下
  rationale: 结合 residuum 所表达的剩余时段，译为“留下”，避免把 conuerteris 过度具体化为“居住”或“归回”。
- source_word: cum filio meo et cum similibus tuis
  choice: 与我儿子和与你相似的人一同
  rationale: 忠实保留两个 cum 短语，并让现代汉语表达自然清楚。
- source_word: usquequo finiantur tempora
  choice: 直到那时期结束
  rationale: tempora 为复数，但此处整体指终末前的一段时期；汉语用集合性的“时期”较自然，同时不具体解释其神学所指。
theological_decisions:
- issue: “我儿子”的身份与称谓
  choice: 我儿子
  alternative: 我的儿子／我的子
  rationale: 直译 filio meo，不增添“弥赛亚”等解释性称号，也不以特殊宗派措辞预先界定其身份。
- issue: 被接去之后的状态
  choice: 留下
  alternative: 居住／归回
  rationale: “留下”保留原句关于持续共处的重点，而不额外断定所在地或行动方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句法尽量贴近拉丁文的因果与时间结构，并保留“被接去”的神学含混性。
