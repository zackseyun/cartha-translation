  source_fidelity: “一同留下”未明确表达 residuum（“余下的时间／其余时日”）所限定的持续时段，且“留下”在此与后面的同伴结构搭配不够准确。修订以“在余下的时间里……同在”表达持续共处，而不擅自说明地点或具体行动。tempora 保留复数的开放性，译作“诸时期”。
  naturalness: 原句“并与我儿子和与你相似的人一同留下”略显生硬，且“一同”可误修饰“留下”而非共处关系。修订后的“并在余下的时间里与……同在”符合现代庄重书面汉语。
  terminology: “从人间被接去”保留 reciperis ab hominibus 的被动及离开世人的含义；“我儿子”忠实对应 filio meo，不加入身份性释义；“与你相似的人”保留 similibus tuis 的非特指范围。
