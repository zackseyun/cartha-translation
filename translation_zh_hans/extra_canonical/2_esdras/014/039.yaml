  text: Something like water was being offered to me[a], but its color was like fire.
translation:
  language: zh_hans
  text: 有东西正递给我，里面盛满了像水一样的液体，它的颜色却像火。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: porrigebatur mihi
  choice: 有东西递给我
  rationale: porrigebatur 是未完成时被动式，表示某物当时正被递来或伸到说话者面前；mihi 表示“给我”。拉丁文本未在此残句中明说该物为何，故不擅自补作“杯”。
- source_word: plenum sicut aqua
  choice: 其中盛满了像水一样的液体
  rationale: plenum 表示承载之物是满的，sicut aqua 表示内容物外观或性质如水。汉语补出“其中”和“液体”，使残缺句法自然，同时保留比较含义。
- source_word: color autem
  choice: 颜色却
  rationale: autem 在这里形成反差：内容物像水，颜色却像火；译作“却”自然体现转折。
- source_word: sicut ignis
  choice: 像火
  rationale: 直译比较结构，不进一步解释为火焰、发光或红色，以保留原文意象。
theological_decisions:
- issue: 被递来的器物是否应明确为杯
  choice: 不在正文中明确为“杯”
  alternative: 有一只杯递给我
  rationale: 现存所给拉丁文本只凭中性单数 plenum 暗示一个容器，却未保留明确名词；为避免从上下文或传统译本过度补足，正文采用“有东西”，并以“其中盛满”表达其容器性质。
- issue: “像水”修饰盛满程度还是内容物
  choice: 理解为其中所盛之物像水
  alternative: 它仿佛盛满了水
  rationale: 结合 plenum 与 sicut aqua，最自然的语义是容器中有类似水的东西；但拉丁表达压缩且文本可能残缺，因此以脚注保留较贴近字面的另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文不擅自补出“杯”，并通过脚注保存简略拉丁句式的另一种可能理解。
