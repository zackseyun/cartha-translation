  text: But keep the last seventy[a], so that you may hand them over to the wise among your people.
translation:
  language: zh_hans
  text: 至于最后七十卷[a]，你要保存起来，好交给你百姓中的智者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 最后七十卷被描写为留给以斯拉本族中智者的隐秘智慧；这是《以斯拉四书》刻画隐藏启示时一个重要的篇章结构特征。
    reason: compositional_layer
lexical_decisions:
- source_word: Nouissimos autem LXX
  choice: 至于最后七十卷
  rationale: “LXX”即七十；结合本章书卷的语境，将省略的名词明示为“卷”。“至于”自然表达 autem 的转折与话题转换。
- source_word: conseruabis
  choice: 你要保存起来
  rationale: 保留将来时在命令语境中的指示意味，也准确传达妥善留存、不公开流传之意。
- source_word: sapientibus de populo tuo
  choice: 你百姓中的智慧人
  rationale: 按拉丁语结构直译所属范围，不将“智慧人”窄化为特定宗教职分或群体。
theological_decisions:
- issue: 七十卷书的隐秘性质
  choice: 正文只说保存并交给智慧人，脚注说明其作为隐秘智慧的叙事功能
  alternative: 在正文中增译为“秘藏”或“只交给”智慧人
  rationale: 避免把上下文所暗示的限制性流传强化成拉丁文本未明说的排他措辞，同时保留作品关于隐藏启示的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“七十卷”补出语境中省略的“书卷”。所给拉丁文本在 ut（“好使／为要”）处截断；后半句依本节通行的拉丁文本内容及所提供的审校层译出。
