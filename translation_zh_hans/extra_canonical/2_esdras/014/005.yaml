source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et enarraui ei mirabilia multa, et ostendi ei temporum secreta et temporum finem, et praecepi ei dicens:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/005.yaml
  text: And I told him many wonders, and I showed him the secrets of the times and the end of the times, and I commanded him, saying,
translation:
  language: zh_hans
  text: 我向他讲述了许多奇妙的事，向他显明了各时代的奥秘和各时代的终局，又吩咐他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enarraui
  choice: 讲述
  rationale: 表达详加叙说、告知之意，比单纯的“告诉”更贴近拉丁文动词的语气。
- source_word: mirabilia multa
  choice: 许多奇妙的事
  rationale: 保留名词化表达的宽泛性，不限定为神迹或具体事件。
- source_word: temporum secreta
  choice: 各时代的奥秘
  rationale: tempora 为复数，可指时代或时期；“各时代”自然呈现其复数含义，secreta 译为“奥秘”以保留被隐藏、启示性内容的色彩。
- source_word: temporum finem
  choice: 各时代的终局
  rationale: finem 为单数，表示这些时代共同趋向的结局；“终局”比“末日”更少预设具体神学解释。
- source_word: praecepi
  choice: 吩咐
  rationale: 准确表达带权柄的命令，同时符合庄重叙事语体。
theological_decisions:
- issue: “时代的终局”是否明确译为“末日”
  choice: 各时代的终局
  alternative: 时代的末日
  rationale: 原文仅用 finem，并未使用专指末日的术语；保留其末世意味而不把解释写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；保留原文连续重复“各时代”的修辞，并以句末冒号承接下一节的直接引语。
