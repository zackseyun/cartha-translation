  text: From the beginning[a], our fathers sojourned in Egypt, and they were delivered.
translation:
  language: zh_hans
  text: 从起初，我们的祖先在埃及寄居，并蒙了拯救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: patres nostri
  choice: 我们的祖先
  rationale: 在现代汉语中自然表达群体先祖之意；比直译“我们的父辈”更符合此处以色列历史语境。
- source_word: grinati sunt
  choice: 寄居
  rationale: 依上下文及英语审校层所反映的源文意义，表达在异地作客居住；现存拉丁形式可能有文本或拼写问题。
- source_word: ab initio
  choice: 起初
  rationale: 保留时间起点的表达，同时不把它扩展为“自创世以来”等过度明确的含义。
- source_word: liberati sunt
  choice: 蒙拯救
  rationale: 保留被动语态及施行者未明说的特点，也符合庄重自然的经文语体。
theological_decisions:
- issue: 拯救的施行者
  choice: 不明说施行者，以“蒙拯救”保留被动表达
  alternative: 译作“上帝拯救了他们”
  rationale: 源文没有明确写出施行者；虽可由语境理解为上帝，正文不宜补入。
- issue: ab initio与“在埃及”的修饰关系
  choice: 正文译作“起初寄居在埃及”
  alternative: “从起初，我们的祖先就在埃及寄居”
  rationale: 拉丁语序存在一定附着歧义；正文采用较自然且符合历史次序的理解，脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祖先”“寄居”“蒙拯救”兼顾经文语感与日常可理解性；用“后来”自然呈现两个事件的先后关系，但不补入“从那里”等源文没有的信息。
