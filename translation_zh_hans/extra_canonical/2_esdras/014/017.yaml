base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/017.yaml
  text: upon those who dwell in it. For truth will withdraw farther away, and falsehood will draw near. For already the eagle that you saw in the vision is hastening to come.”
translation:
  language: zh_hans
  text: 临到其中居民的灾祸。因为真理将越发远离，虚假却要逼近；你在异象中所看见的那只鹰，已经急速临近了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super inhabitantes in eo mala
  choice: 临到其中居民的灾祸
  rationale: 承接上文，将省略谓语的拉丁语片段自然译出；super 表示灾祸临到居民。
- source_word: Prolongabit enim magis ueritas
  choice: 因为真理将越发远离
  rationale: prolongabit 在此语境指真理退远、难以企及；保留比较意味 magis 为“越发”。
- source_word: adpropinquabit mendacium
  choice: 虚假却要逼近
  rationale: adpropinquabit 与前句形成远离/逼近的对照；mendacium 可指谎言或虚假，选“虚假”以保留较宽泛含义。
- source_word: iam enim festinat aquila uenire
  choice: 那只鹰，已经急速临近了
  rationale: festinat uenire 直指赶快到来；“急速临近”在中文中自然，并与前句“逼近”形成末世迫近感。
- source_word: quam uidisti in uisionem
  choice: 你在异象中所看见的
  rationale: 按拉丁语意义直译；in uisionem 属格位不规范，但语义明确为“在异象中”。
theological_decisions:
- issue: 鹰的象征身份
  choice: 只译作“那只鹰”
  alternative: 明确解释为某一帝国或末世势力
  rationale: 本节仅回指先前异象，没有在正文中解释其身份，因此保留象征的开放性。
- issue: 真理与虚假的动作关系
  choice: 译为“真理将越发远离，虚假却要逼近”
  alternative: 译为真理被延迟、谎言临近
  rationale: 依据上下文及动词对照呈现道德与启示层面的张力，不额外指定行动主体。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。经文开头保留其承接上一节的片段性质；以“灾祸”作主语补足中文表达，但不添加原文没有的具体灾难。
