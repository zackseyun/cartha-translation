id: 2ES.14.20
reference: 2 Esdras 14:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem iterum nati fuerint, quis commonebit ? Positum est enim saeculum in tenebris, et qui inhabitant in eo sine lumine ;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/020.yaml
  text: But those who will be born afterward—who will warn them? For the age lies in darkness[a], and those who dwell in it are without light.
translation:
  language: zh_hans
  text: 可是，以后出生的人，谁来警告他们呢？因为这个世代处在黑暗中[a]，住在其中的人没有光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被置于黑暗中”。
    reason: 保留 positum est 较字面的被动表达，同时正文采用更符合此处拉丁语用法的状态性译法。
lexical_decisions:
- source_word: iterum nati fuerint
  choice: 以后出生的人
  rationale: 结合上下文，将字面上较含混的“再次／后来出生”理解为后世出生的人；避免译成“重生”，以免引入原文未必具有的神学含义。
- source_word: commonebit
  choice: 警告
  rationale: 该词可表示提醒、劝诫或警告；此处面对世代处于黑暗的危险，译作“警告”自然，并保留劝人警醒的力度。
- source_word: saeculum
  choice: 这个世代
  rationale: 此处指当前的时代或世代，而非物质世界；“这个世代”既贴近语境，也便于现代读者理解。
- source_word: positum est ... in tenebris
  choice: 处在黑暗中
  rationale: positum est 加处所成分在此自然表达静态处境，即“处于／位于”，不强调某一主体主动把世代放入黑暗。
- source_word: sine lumine
  choice: 没有光
  rationale: 直译其缺乏光明的状态，与前面的“黑暗”形成清晰对应。
theological_decisions:
- issue: positum est 是否暗示有主体把世代置于黑暗中
  choice: 正文采用静态的“处在黑暗中”
  alternative: “被置于黑暗中”
  rationale: 拉丁语结构可作状态性表达；正文不额外断定是谁造成这种处境，同时用脚注保留较形式对应的被动理解。
- issue: iterum nati 是否指宗教意义的重生
  choice: 理解为后来出生的人
  alternative: “再次出生／重生的人”
  rationale: 上下文关心未来世代无人教导的问题；译成“重生”会引入不必要的特定神学概念。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“谁来警告他们呢”保留原文的反问语气；“这个世代”“住在其中的人”维持原句意象和结构。
