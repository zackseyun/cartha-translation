  yaml_path: translation/extra_canonical/2_esdras/014/042.yaml
  text: And the Most High gave understanding to the five men[a], and they wrote in succession the things that were spoken, in characters that they did not know[b]. And they sat there forty days.
translation:
  language: zh_hans
  text: 我的口已经张开，不再闭合。至高者赐给那五个人悟性；他们把所说的话轮流[b]写下来，用的是他们不认识的书写符号[a]。他们坐了下来。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书写符号”也可指字形、记号或速记式符号；单凭拉丁文无法进一步确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“依次”；这里较可能指五个人相继接替书写。
    reason: previous_rendering
  - marker: c
    text: 所提供的拉丁文本到“他们坐了下来”为止；英语审校文本另有“四十天”，但这一时长未见于本次提供的拉丁原文。
    reason: textual_source_discrepancy
lexical_decisions:
- source_word: apertum est os meum et non est clausum amplius
  choice: 我的口张开了，不再闭上
  rationale: 贴近拉丁文的被动状态表达，同时用自然的现代汉语保留前后对照。
- source_word: dedit intellectum
  choice: 赐给……悟性
  rationale: intellectus 在此指受神赋予的理解或领悟能力；“悟性”简洁、庄重，也不额外限定其具体运作方式。
- source_word: ex successione
  choice: 轮流
  rationale: 此处较可能描述五人依次接替书写，而非材料本身按次序排列；“轮流”能清楚表达书写者相继接替。
- source_word: notis
  choice: 字符
  rationale: nota 可指书写符号、字形或速记符号；“字符”保留其范围，不武断指定为某一种文字或速记体系。
- source_word: quas non sciebant
  choice: 连他们自己也不认识
  rationale: 明确关系代词所指的是字符，并自然表达书写者并不识得这些符号这一反常情形。
- source_word: et sederunt
  choice: 他们坐了下来
  rationale: 严格翻译所提供拉丁文本；该文本止于 sederunt，并未出现“四十天”。
theological_decisions:
- issue: 五人书写陌生字符的方式
  choice: 不说明这是何种超自然书写机制
  alternative: 解释为神赐速记、异文字符或自动书写
  rationale: 拉丁文只说他们书写自己不认识的字符，并未进一步界定其性质；译文保留这种含混和神秘性。
- issue: 本节末尾的“四十天”
  choice: 正文不补入“四十天”
  alternative: 依英语咨询文本译作“他们在那里坐了四十天”
  rationale: 所提供的拉丁原文仅有 et sederunt，没有 quadraginta diebus；按照原文证据优先的原则，不把当前底本文本中缺失的词直接补进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“至高者”延续经文常用称谓；“悟性”“轮流”“字符”兼顾准确与可读性。正文严格按所给拉丁文本翻译，并以脚注公开说明其与英语咨询层在节末的差异。
