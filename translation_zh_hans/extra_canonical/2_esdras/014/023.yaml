lexical_decisions:
- source_word: uiuere ... uiuant
  choice: 要活……可以存活
  rationale: 保留原文同一动词的重复，同时用“存活”自然表达目的或结果。
- source_word: in nouissimis
  choice: 在末后日子
  rationale: 此处为末世时间表达；补出“日子”使现代汉语清楚自然，又不额外限定具体时期。
- source_word: uadens congrega populum
  choice: 你去召集百姓
  rationale: 自然传达拉丁文前行动词与命令语气；“百姓”符合叙事语域。
- source_word: ut non te quaerant
  choice: 告诉他们不要来找你
  rationale: 以汉语自然的间接命令表达目的从句；“来找你”比单说“寻求你”更符合此处寻找人的语境。
theological_decisions:
- issue: 末后时期中人的生存含义
  choice: 存活
  alternative: 得生命
  rationale: 原文 uiuant 可指活着或存活；不采用较强的救恩术语“得生命”，以免消除原文语义张力。
