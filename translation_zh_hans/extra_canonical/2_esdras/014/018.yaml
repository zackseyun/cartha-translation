lexical_decisions:
- source_word: Et respondi et dixi
  choice: 于是我……回答说
  rationale: 将拉丁语惯用的双动词表达自然地译为现代汉语“回答说”，并以“于是”承接上文。
- source_word: coram te
  choice: 在你面前
  rationale: 直接保留 coram 的空间性和当面陈说之意。
- source_word: domine
  choice: 主啊
  rationale: 按呼格处理，以现代汉语庄重而自然的称呼表达。
- source_word: Ecce enim ego abibo
  choice: 看哪，我就要走了
  rationale: “看哪”保留 ecce 的提示和强调作用；“就要走了”表达 abibo 的将来意义，并以自然汉语传达 enim 在此处的强调、承接语气，避免生硬译成“因为”。
