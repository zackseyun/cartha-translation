  yaml_path: translation/extra_canonical/2_esdras/014/043.yaml
  text: They wrote by day, but at night they ate bread. As for me, I spoke by day, and at night I was not silent.
translation:
  language: zh_hans
  text: 四十天之久，他们白天书写，夜里吃饼；至于我，我白天讲说，夜里也不住口。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: XL diebus
  choice: 四十天之久
  rationale: 按拉丁文直译时间长度，并用自然汉语表达持续之意。
- source_word: scribebant
  choice: 书写
  rationale: 保留未明说所写内容的概括性，不擅自补入“经书”等宾语。
- source_word: manducabant panem
  choice: 吃饼
  rationale: 忠实保留 panem 的具体意象；“饼”符合圣经语体，也易为现代读者理解。
- source_word: loquebar
  choice: 讲说
  rationale: 表达持续口述的动作，同时不把内容具体化为“启示”或“经文”。
- source_word: non [tacebam]
  choice: 不住口
  rationale: 原文末尾省略了可由上下文补出的谓语；采用自然汉语呈现“没有沉默/不停讲说”的意思。
theological_decisions:
- issue: 以斯拉夜间是否完全不说话
  choice: 夜里也不住口
  alternative: 夜里并不沉默
  rationale: 拉丁文 et nocte non 在传本语境中承接“沉默”之意；译文保留其持续讲说的含义，而不增添默示方式等神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以分号呈现书记员与叙述者之间的对照。“至于我”对应拉丁文 ego autem，突出主语转换。
