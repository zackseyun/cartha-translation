  naturalness: 建议用“荆棘丛中”和“向摩西说话”。“在埃及受奴役”是现代汉语中自然、庄重且清楚的表述。
  terminology: “我的子民”恰当保留原文的盟约性称谓。将 *rubum* 译为“荆棘丛”符合出埃及记典故和汉语惯用说法。没有必要在正文中以“确实”等词强行落实同根重复可能带有的强调。
