  text: I revealed myself in the bush[a], and I spoke to Moses when my people were serving in Egypt.
translation:
  language: zh_hans
  text: 我曾在荆棘丛中显现，并且在我的子民在埃及受奴役的时候向摩西说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Reuelans reuelatus sum
  choice: 我……显现自己
  rationale: 拉丁文以同根分词和限定动词叠用，可能反映闪语式强调；但中文若机械译为“显现着显现了”极不自然，而加上“确实”又可能过度明确其语气，因此以自然庄重的“显现自己”表达核心意义。
- source_word: super rubum
  choice: 在荆棘中
  rationale: super 在此结合燃烧荆棘的传统场景，表示显现所在或所凭借的地点；译为“在荆棘中”比字面“在荆棘之上”更合现代汉语，也保留神从荆棘中显现的图景。
- source_word: locutus sum Moysi
  choice: 对摩西说话
  rationale: 忠实表达与格 Moysi 所标明的受话者，并采用自然的现代汉语措辞。
- source_word: seruiebat in Aegypto
  choice: 在埃及服役
  rationale: servire 可指服事、受役或为奴；此处描述以色列人在埃及的处境。“服役”保留受支配劳动的含义，同时不把原文进一步具体化为某一种法律身份。
theological_decisions:
- issue: 同根重复是否明确译作强调语气
  choice: 正文不另加“确实”或“公开地”
  alternative: “我确实在荆棘中显现自己”
  rationale: Reuelans reuelatus sum 很可能是经由希腊文保存的闪语式同根强调结构，但现存拉丁文本本身并未规定应具体落实为“确实”还是“公开地”。正文保留简洁表达，避免把可能的强调类型解释得过窄。
- issue: 埃及处境的表述
  choice: 服役
  alternative: 为奴
  rationale: 上下文确实指向受奴役的历史处境，但拉丁文 seruiebat 的词义范围较宽；采用“服役”既传达受辖制的劳役，也不超出本节措辞。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“我的子民”保留盟约性称谓；句法尽量贴近原文两项行动的并列结构。
