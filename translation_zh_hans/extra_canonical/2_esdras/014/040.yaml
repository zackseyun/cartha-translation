  text: 'eius ut ignis similis. Et accepi et bibi, et in eo cum bibissem cor meum eructuabat intellectum et in pectus meum increscebat sapientia, nam spiritus meus conseruabat memoriam : Et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/040.yaml
  text: And I took it and drank[a], and when I had drunk it, my heart poured forth understanding, and wisdom increased in my breast, for my spirit retained memory.
translation:
  language: zh_hans
  text: 我拿起它喝了。喝下之后，我的心便涌出悟性，智慧也在我胸中增长，因为我的灵保留着记忆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“保存着记忆。”
    reason: 拉丁文 memoriam 可指所保留的记忆内容，也可指记忆的能力；正文保留其范围。
lexical_decisions:
- source_word: eructuabat intellectum
  choice: 涌出悟性
  rationale: eructuabat 字面有“吐出、喷涌而出”之意；“涌出”保留其强烈意象，又比字面直译自然庄重。intellectum 依语境译为“悟性”。
- source_word: in pectus meum increscebat sapientia
  choice: 智慧也在我胸中增长
  rationale: 贴近拉丁文的身体意象和动态表达，不将“胸中”解释性改写为“心里”或“思想中”。
- source_word: spiritus meus conseruabat memoriam
  choice: 我的灵保存着记忆
  rationale: conservabat 表示持续保存、保全；memoriam 可指记忆内容或记忆能力，正文用“记忆”保留这种范围。
theological_decisions:
- issue: “灵”与记忆的关系
  choice: 我的灵保存着记忆
  alternative: 我仍记得一切／我的心保存着记忆
  rationale: 保留 spiritus meus 的明确主语，不把“灵”弱化为一般心理活动，也不额外断定所保存的是全部内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；以短句呈现饮下之后的连续变化，并保留“心”“胸”“灵”三个不同的原文身体及内在人格意象。
