  source_fidelity: 整体忠实呈现了拉丁文的动作次序及内在意象：取、饮、心涌出悟性、胸中智慧增长、灵保全记忆。惟“接过来”在现代汉语中较强调从他人手中接取，原文 accepi 仅说“拿/取”，不宜附加该情境。
  naturalness: “我的灵保存着记忆”可以理解，但“保留着记忆”更符合现代庄重叙事语感，也更贴近 conseruabat 的“保全、持守”义。原脚注“维持着记忆力”搭配不自然，且将 memoriam 过度收窄为能力。
  terminology: “悟性”“智慧”“胸中”“灵”均合宜，并保留 intellectum、sapientia、pectus、spiritus 的区分。正文的“记忆”恰当保留 memoriam 可指记忆内容或记忆能力的未定范围。
