source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Signa quae demonstraui, et somnia quae uidisti, et interpretationes quas tu audisti, in corde tuo repone ea;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/008.yaml
  text: The signs that I have shown[a], and the dreams that you have seen, and the interpretations that you have heard—store them up in your heart.
translation:
  language: zh_hans
  text: 我所显示的征兆、你所看见的梦，以及你所听见的解释——要把这一切存记在心里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Signa
  choice: 征兆
  rationale: 表示具有启示意义、指向未来之事的标记；“征兆”比泛指的“记号”更贴合此处异象语境。
- source_word: demonstraui
  choice: 显示
  rationale: 保留“使其显明、展示给看”的意义，并与后面的“看见”有所区别。
- source_word: somnia
  choice: 梦
  rationale: 直接对应梦中所见的启示，采用现代汉语自然用词。
- source_word: interpretationes
  choice: 解释
  rationale: 保留对征兆和梦之含义的说明，不额外限定为某种特定神学术语。
- source_word: in corde tuo repone ea
  choice: 你要把这一切珍藏在心里
  rationale: “这一切”对应复指代词 ea，并保留三个前置宾语之后才出现命令的修辞结构；“珍藏在心里”自然表达牢记、妥善保存之意。
theological_decisions:
- issue: 是否明确征兆、梦和解释的启示来源或性质
  choice: 不作源文以外的补充，只译为“征兆”“梦”“解释”
  alternative: 译为“神所赐的征兆、异梦和启示的讲解”
  rationale: 拉丁文本没有在本节逐项加入这些限定；避免替源文消解其简洁性或导入额外解释。
- issue: 是否把命令改写为普通动宾语序
  choice: 保留三项内容前置、最后以命令收束的结构
  alternative: “你要把我向你显示的征兆……珍藏在心里”
  rationale: 源文先列出三个宾语，再以 ea 复指并发出命令；中文用破折号和“这一切”可自然保存这种强调和悬置结构。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句法保留拉丁文的左置结构：先累列以往领受的内容，再用破折号引出命令；“这一切”明确呈现源文复指代词 ea。
