  text: 'sicut praecepisti mihi, et corripiam praesentem populum : qui'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/019.yaml
  text: “Behold[a], I will go, as you have commanded me, and I will reprove the people now living.
translation:
  language: zh_hans
  text: 我要照你所吩咐我的，责备现今活着的百姓。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据拉丁文在此后还有“……的人”（qui），用来引出下一句；本节所给文本至此截断。
    reason: 说明源文末尾未完成的关系从句，避免正文擅自补足。
lexical_decisions:
- source_word: sicut praecepisti mihi
  choice: 照你所吩咐我的
  rationale: 贴近拉丁文“正如你吩咐我的”，同时采用自然的现代汉语语序。
- source_word: corripiam
  choice: 我要……责备
  rationale: 该词在此指严正指出过错、加以训诫；“责备”既清楚自然，也不额外引入惩罚之意。
- source_word: praesentem populum
  choice: 现今活着的百姓
  rationale: 下一节将他们与后来出生的人对照，因此 praesentem 在这里主要是时间意义，指当前世代，而非空间上在场的人。
- source_word: qui
  choice: 不在本节正文中直译
  rationale: 所给拉丁文末尾的关系代词 qui 显然引出后续未完整提供的分句；为避免在本节凭空补足其所指，将这一文本现象记入脚注。
theological_decisions:
- issue: 责备的对象是“在场者”还是“当代活着的人”
  choice: 现今活着的百姓
  alternative: 在场的百姓
  rationale: 后文与将来出生的人形成时间对照，故应保留世代层面的含义，不将其误解为空间上的临场。
- issue: 是否加入“看哪，我必去”
  choice: 不加入
  alternative: “看哪，我必去，照你所吩咐我的……”
  rationale: 所提供的拉丁文证据始于 sicut praecepisti mihi，并不包含 ecce 或 vadam；虽然英语审校层有这句话，但源文优先，不能据此补入当前所给拉丁文本没有的措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“百姓”适合此处面向共同体的称呼；“现今活着的”明确表达 praesentem 的时间含义。由于所给拉丁文片段似从一个较长句子中截取，正文不补入英语咨询层中的“看哪，我必去”。
