  text: And it happened when the forty days were completed[a], the Most High spoke to me, saying, “The former things that you wrote, set them out publicly, and
translation:
  language: zh_hans
  text: 四十天满了以后，至高者对我说：“你先前所写的，要公之于众，并且[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文止于“并且”，句子在下一节继续。
    reason: 说明异常的跨节断句，并防止读者误以为正文残缺或漏译。
lexical_decisions:
- source_word: conpleti essent XL dies
  choice: 四十天满了以后
  rationale: 准确表达四十天已经届满的时间背景，符合现代汉语叙事习惯。
- source_word: altissimus
  choice: 至高者
  rationale: 保留拉丁文对上帝的尊称，不额外加入原文没有的神学称谓。
- source_word: priora quae scripsisti
  choice: 你先前所写的
  rationale: priora 在此指先前写下的内容；译为“先前所写的”既保留指代范围，也避免误解为按次序最先写的部分。
- source_word: in palam pone
  choice: 要公之于众
  rationale: 表达把所写内容公开、让公众得知之意，比逐字译作“摆在公开处”更自然。
- source_word: et
  choice: 并且
  rationale: 保留本节末尾的连接词，因为原文句子跨至下一节，不能把下一节内容提前补入。
