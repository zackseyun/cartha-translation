  text: or the things that are about to happen[a]. For if I have found favor before you, send the Holy Spirit into me, and I will write everything that has happened in the world from the beginning, the things that were written in your law, so that men may be able to find the path[c][b], and that those who wish
translation:
  language: zh_hans
  text: 已经发生的事，或将要发生的事。因为我若在你面前蒙了恩，求你使圣灵进入我；我要写下自起初以来在世上所发生的一切，就是写在你律法中的事，使人能够找到道路，也使愿意……的人
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae incipient operari
  choice: 将要发生的事
  rationale: 该短语直指即将开始发生的事；用现代汉语“将要发生”比逐字译作“将开始运作”自然，也与前面的“已经发生”形成清楚对应。
- source_word: inmitte in me spiritum sanctum
  choice: 求你使圣灵进入我
  rationale: 保留 inmitte（使进入、遣入）和 in me（进入我里面）的方向性，不弱化为笼统的“赐给我”。
- source_word: in saeculo ab initio
  choice: 自太初以来世上
  rationale: 在 ab initio 的限定下，saeculum 指受造世界自起初以来的历史进程；译作“世上”比“在世代中”更符合此处语境。
- source_word: semitam
  choice: 道路
  rationale: semitam 本指路径、小道；此处用于人所寻得的生活或真理之路，“道路”既自然又保留其比喻空间。
- source_word: homines
  choice: 人们
  rationale: 此处泛指人类众人，现代汉语用“人们”准确且不造成仅指男性的误解。
theological_decisions:
- issue: spiritum sanctum 是否作为专名处理
  choice: 圣灵
  alternative: 圣洁的灵
  rationale: 在祈求神使其灵进入说话者、赐其书写能力的语境中，“圣灵”是自然且传统的汉语表达；译文不进一步界定其后期教义含义。
- issue: 律法中所写之事与“所发生的一切”的关系
  choice: 以“就是”呈现同位解释
  alternative: 译作两个并列宾语：“一切……以及律法中所写的事”
  rationale: 拉丁文 quae erant in lege tua scripta 最自然地回指前面的内容，说明这些事原先记在律法中；“就是”较能呈现这种同位关系，但不额外解释律法的范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文首尾均为跨节残句：开头用“或”承接上文，结尾保留“那些愿意……的人”的未完结构，以免擅自补足下一节内容。
