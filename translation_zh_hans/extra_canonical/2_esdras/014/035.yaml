  text: we will live again; and then the name of the righteous will appear, and the deeds of the ungodly will be disclosed. But let no one come near me now, nor
translation:
  language: zh_hans
  text: 我们必再活过来；那时，义人的名必显明，不敬虔之人的行为也必被揭露。不过，现在谁也不可接近我，也不可……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuiuiscemus
  choice: 我们必再活过来
  rationale: 直译其第一人称复数及“重新活过来”的含义，不进一步界定复活的方式或时间。
- source_word: iustorum nomen
  choice: 义人的名
  rationale: 保留拉丁文单数集合表达“名”，避免改写为较解释性的“名声”或“身份”。
- source_word: apparebit
  choice: 必显明
  rationale: 表达“出现、显现”的被认识含义，同时保持庄重简洁。
- source_word: impiorum facta
  choice: 不敬虔之人的行为
  rationale: impiorum 指对上帝不敬虔者；facta 用“行为”概括其所作之事。
- source_word: ostendentur
  choice: 必被揭露
  rationale: 保留被动语态，并体现原先隐藏之事被显出的语境。
- source_word: Ad me autem nemo accedat nunc
  choice: 至于我，现在谁也不要近前来
  rationale: 自然表达禁止任何人此刻接近说话者；autem 按语篇转折译作“至于我”。
- source_word: neque
  choice: 也不要……
  rationale: 原文在并列否定连词后中断；用省略号明确保留未完句，而不擅自补足宾语或动作。
theological_decisions:
- issue: reuiuiscemus 是否明确译作末日复活
  choice: 译为“我们必再活过来”
  alternative: “我们必复活”
  rationale: 前者忠实保留“再次活着”的基本语义，不把此处本身未明说的复活性质进一步术语化。
- issue: iustorum nomen 的含义
  choice: 保留“义人的名”
  alternative: “义人的名声”或“义人的身份”
  rationale: 原文可能涉及名字、名分或受承认的身份；直译可保存这种含义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留经节开头与结尾承接上下文的残句性质，尤其以省略号呈现 neque 后文本未完，不自行补文。
