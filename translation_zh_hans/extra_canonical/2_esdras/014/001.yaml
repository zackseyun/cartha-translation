lexical_decisions:
- source_word: Et factum est
  choice: 第三天，
  rationale: 这是拉丁叙事中常见的承接语。逐字译作“事情发生了”在现代汉语中生硬；通过时间状语自然开启叙事，同时不增添原文没有的信息。
- source_word: tertio die
  choice: 第三天
  rationale: 准确保留序数和时间指向。
- source_word: ego sedebam
  choice: 我坐在
  rationale: 保留第一人称主语；未完成过去时在此表示当时正处于坐着的状态，现代汉语无需另加时态标记。
- source_word: sub quercu
  choice: 在一棵橡树下
  rationale: quercus 通常指橡树；拉丁语无不定冠词，汉语加入“一棵”使表达自然，但不特指某一棵已知的树。
