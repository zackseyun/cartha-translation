  yaml_path: translation/extra_canonical/2_esdras/014/002.yaml
  text: 'And behold, a voice came to me from a bush and said, “Ezra, Ezra!” And I said, “Here I am, Lord.” And I stood on my feet, and it said to me:'
translation:
  language: zh_hans
  text: 看哪，有声音从荆棘丛中向我传来，说：“以斯拉，以斯拉！”我回答：“主啊，我在这里。”我便站起身来，那声音对我说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留原文引人注意、标示异象中突发事件的语气。
- source_word: uox exiuit contra me de rubo
  choice: 有声音从荆棘丛中向我传来
  rationale: 既表达声音源自荆棘丛并朝向叙述者，也避免把拉丁语的空间表达生硬直译为“出来反对我”。
- source_word: ecce ego
  choice: 我在这里
  rationale: 采用现代汉语中自然且庄重的应答方式，准确表达听命回应。
- source_word: surrexi super pedes meos
  choice: 我便站起身来
  rationale: 自然传达“起身站立”的动作，无须机械保留“站在我的双脚上”。
- source_word: dixit ad me
  choice: 那声音对我说
  rationale: 拉丁文主语可由前述“声音”承接；汉语补明主语，以免误读为“主”在叙述层面被明确指定。
theological_decisions:
- issue: 发声者的身份
  choice: 叙述句中称“那声音”，而在以斯拉的回应中保留“主啊”
  alternative: 将叙述句直接译为“主对我说”
  rationale: 原文只明确写“声音”，以斯拉则称其为“主”；译文保留这一区分，不将回应者的理解提前写入叙述。
- issue: 荆棘丛与出埃及记意象
  choice: 译作“荆棘丛”，不增添“燃烧”等描述
  alternative: 译作“燃烧的荆棘”或“荆棘火焰”
  rationale: 原文仅有 de rubo，虽可能唤起摩西蒙召的互文联想，却没有在本节明说燃烧，因此不作增补。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“看哪”的经文语体和末尾冒号，以承接下一节的话语。专名 Ezra 按中文圣经传统译作“以斯拉”。
