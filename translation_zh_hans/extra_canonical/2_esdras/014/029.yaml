  yaml_path: translation/extra_canonical/2_esdras/014/029.yaml
  text: And they received the law of life, which they did not keep, which you also transgressed after them.
translation:
  language: zh_hans
  text: 于是，他们领受了生命的律法，却没有遵守；在他们之后，你们也违犯了这律法。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文在第二个关系代词 quem（“这律法，……的”）处中断；本句后半依据审校英文所反映的续文译出。若严格只按现存引文，句子只能读到“他们没有遵守这生命的律法，……”，句意未完。
    reason: 交代所提供的拉丁文证据在句中截断，以及后半译文的依据；不把未展示的续文冒充为现存拉丁文。
lexical_decisions:
- source_word: acceperunt
  choice: 领受了
  rationale: 既表达“接受、获得”，也符合“领受律法”的庄重宗教语境。
- source_word: legem uitae
  choice: 生命的律法
  rationale: 保留拉丁文属格结构及其可能兼具“赐生命的律法”与“关乎生命的律法”的含义，不将其单一解释化。
- source_word: non custodierunt
  choice: 没有遵守
  rationale: custodire用于律法时指持守、遵行；“没有遵守”是现代汉语中自然明确的表达。
- source_word: transgressed（见审校英文所反映的续文）
  choice: 违犯
  rationale: 准确表达越过律法界限、触犯律法之意，语体庄重而通俗。
- source_word: post eos（见审校英文所反映的续文）
  choice: 后来……也像他们一样
  rationale: 兼顾时间上的“在他们之后”与行为上步其后尘的语意；正文采用自然汉语表达。
theological_decisions:
- issue: “生命的律法”的含义
  choice: 保留“生命的律法”
  alternative: “赐人生命的律法”
  rationale: 原文属格关系可以有多种理解；不在译文中断定律法必然是生命的来源，从而保留神学张力。
- issue: 后半句与前人的关系
  choice: “后来你们也像他们一样违犯了这律法”
  alternative: “在他们之后，你们也违犯了这律法”
  rationale: 前者在现代汉语中更清楚地传达后人重复前人悖逆行为的意思，同时保留时间先后。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接上下文；用分号呈现两个彼此对应的违背行为。代词“你们”按英文咨询层的复数处理。
