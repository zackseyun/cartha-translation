  yaml_path: translation/extra_canonical/2_esdras/014/010.yaml
  text: For the age has lost its youth, and the times are drawing near to old age.
translation:
  language: zh_hans
  text: 因为这个时代已经失去了青春，时日也将步入衰老。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: 这世代
  rationale: 此处指当前的时代或世代；译作“这世代”既保留时间整体的含义，也与拟人化的“青春”自然衔接。
- source_word: perdidit iuuentutem suam
  choice: 已经失去了青春
  rationale: 直译其拟人化表达，不弱化时代由盛转衰的意象。
- source_word: tempora
  choice: 时序
  rationale: 拉丁语复数可指各个时期或时代进程；“时序”在中文中自然凝练，并保留复数所体现的时间推移感。
- source_word: adpropinquant senescere
  choice: 渐渐临近衰老
  rationale: 保留“临近”与“衰老”两个语义要素；加入“渐渐”使中文准确呈现趋近的过程。
theological_decisions:
- issue: 末世临近的时间意象
  choice: 保留时代失去青春、时序临近衰老的拟人化说法
  alternative: 意译为“世界已接近末日”
  rationale: 原文并未直接说“末日”，而是以衰老隐喻时代进程；不应把隐喻所含的张力解释成更明确的末世断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留原文两分句的平行结构和时代衰老的拟人意象。
