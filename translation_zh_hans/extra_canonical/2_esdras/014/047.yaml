  text: tradas eos sapientibus de populo tuo; In his enim est uena intellectus et sapientiae fons et scientiae flumen.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/047.yaml
  text: you may hand them over to the wise among your people. For in them is the vein of understanding[a], the fountain of wisdom, and the river of knowledge.”
translation:
  language: zh_hans
  text: 你可以把这些书交给你百姓中的智者，因为其中有悟性的矿脉[a]、智慧的泉源和知识的河流。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“悟性的泉源”。
    reason: 拉丁语 vena 可表示脉、矿脉或水脉，在此也可能引申为源泉；两种译法分别侧重词的具体意象和语境中的来源之义。
lexical_decisions:
- source_word: tradas
  choice: 你可以……交给
  rationale: 该虚拟式承接上一节的 ut 从句；用“可以”自然表达其许可或安排的语气，同时保留本节开头的句法承接。
- source_word: eos
  choice: 这些书
  rationale: 拉丁语阳性复数代词指向上文所说的书卷；汉语明示所指，比译作含混的“它们”更自然。
- source_word: sapientibus de populo tuo
  choice: 你百姓中的智者
  rationale: 准确表达“从你百姓中/属于你百姓的智者”，措辞简洁庄重。
- source_word: uena intellectus
  choice: 悟性的矿脉
  rationale: 保留 vena 的核心意象，即蕴藏并输送珍贵资源的“脉”；“矿脉”在现代汉语中比直译“静脉”更符合此处比喻，并与后面的泉源、河流构成丰富意象。
- source_word: sapientiae fons
  choice: 智慧的泉源
  rationale: fons 可指泉、源头；“泉源”兼顾具体水源意象和抽象来源之义。
- source_word: scientiae flumen
  choice: 知识的河流
  rationale: 直译 flumen 的河流意象，保留与“泉源”相呼应的诗性排比。
theological_decisions:
- issue: 书卷中智慧与知识的来源性表述
  choice: 保留“其中有……”的意象性陈述
  alternative: 释义为“这些书能使人获得悟性、智慧和知识”
  rationale: 原文以矿脉、泉源、河流三个名词性隐喻描述书卷中的丰富资源，并未明确阐释其作用机制；不将其改写成更强的教义性或功能性断言。
- issue: vena 的多义性
  choice: 正文译作“矿脉”，脚注列出“泉源”
  alternative: 正文译作“悟性的泉源”
  rationale: “矿脉”较贴近 vena 的基本意象并避免与紧接的 fons 完全同义；但 vena 在比喻语境中也可理解为水脉或源泉，因此以脚注保留另一合理读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文“矿脉—泉源—河流”的三重比喻及递进排比；引号承接上下文中的直接引语。
