  yaml_path: translation/extra_canonical/2_esdras/014/013.yaml
  text: Therefore now set your house in order[a], and reprove your people, and comfort their humble ones, and renounce the corruptible life now.
translation:
  language: zh_hans
  text: 所以，现在要整顿好你的家，劝戒你的百姓，安慰他们中卑微的人，并且如今要舍弃这必朽的生命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“败坏的生活”。
    reason: corruptae vitae 可指会朽坏、终将消逝的生命，也可被理解为道德上败坏的生活；近邻语境较支持前者。
lexical_decisions:
- source_word: dispone domum tuam
  choice: 把你的家安排妥当
  rationale: 保留“整顿、安排好家中事务”的命令语气，同时采用现代汉语自然表达；“家”也保留可指家庭或家务安排的范围。
- source_word: corripe populum tuum
  choice: 劝戒你的人民
  rationale: corripe 带责备、纠正之意；“劝戒”兼顾责备与引导，不把语气过度强化为严厉斥责。
- source_word: consolare humiles eorum
  choice: 安慰他们中卑微的人
  rationale: humiles 可指卑微、低下或受压的人；直译为“卑微的人”，避免无根据地限定为谦卑品格或贫困处境。
- source_word: renuntia
  choice: 舍弃
  rationale: 表达放弃、告别之意，符合以斯拉受命脱离现今生命的上下文。
- source_word: corruptae uitae
  choice: 必朽的生命
  rationale: 结合下节“必死的思想、人的重担、软弱的本性”等语境，主要表达会败坏、会消逝的生命状态，而非单指道德败坏。
theological_decisions:
- issue: corruptae uitae 是指生命的必朽性，还是道德败坏的生活
  choice: 正文采用“必朽的生命”
  alternative: “败坏的生活”
  rationale: 拉丁词本身可容纳“败坏”与“会朽坏”两层意义；近邻语境更支持死亡与可朽性，但以脚注保留道德意义的另一种理解，避免消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。连续使用命令式动词，保留原文四项吩咐的节奏；将 iam 译作“现在”，统摄整句，也符合拉丁语开头 Nunc ergo 的强调。
