  yaml_path: translation/extra_canonical/2_esdras/014/030.yaml
  text: And you transgressed after them. And the land was given to you in the land of Zion[a], but both you and your fathers committed iniquity and did not keep the ways that the Most High commanded you.
translation:
  language: zh_hans
  text: 你们继他们之后也违背了。土地赐给了你们，在锡安之地[a]；但你们和你们的祖先都行了不义，没有遵守至高者吩咐你们走的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给拉丁文本在 in 处截断；因此，此处“在锡安之地”与前句其余成分的确切句法关系无法仅凭所给片段确定。
    reason: 保留源文截断所造成的句法不确定性，不添加“产业”等未获支持的内容。
lexical_decisions:
- source_word: transgressi estis
  choice: 违背了
  rationale: 保留拉丁文“不服从、越界”的含义；原句未明说所违背的宾语，译文也不擅自补出“律法”。
- source_word: post eos
  choice: 继他们之后
  rationale: 表达时间上的承接，同时不排除沿袭前人行为的意味。
- source_word: et uos et patres uestri
  choice: 你们和你们的祖先都
  rationale: 用“都”体现双重 et 的关联强调，表明当代人与祖先共同有责。
- source_word: fecistis iniquitatem
  choice: 行了不义
  rationale: 采用庄重而易懂的表达，保留道德和神学层面的“不义”，不缩窄为某一种具体罪行。
- source_word: vias quas praecepit uobis Altissimus
  choice: 至高者吩咐你们走的道路
  rationale: “道路”保留原文隐喻，并以“走”使现代汉语自然；“至高者”对应 Altissimus。
theological_decisions:
- issue: 违背行为的宾语
  choice: 不补出“律法”或“诫命”
  alternative: 你们也违背了律法
  rationale: transgressi estis 在此为绝对用法；补出宾语会消除原文的开放性。
- issue: 跨世代责任的强调
  choice: 你们和你们的祖先都行了不义
  alternative: 你们和你们的祖先行了不义
  rationale: “都”忠实体现 et...et 的强调，同时不引申为遗传罪责等特定教义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“行了不义”“至高者”“道路”保留经文语体，但避免过度古雅。鉴于所给拉丁文本在句中截断，后半句参照已审校的英文咨询层谨慎复原，并以脚注提示锡安短语的句法不确定性。
