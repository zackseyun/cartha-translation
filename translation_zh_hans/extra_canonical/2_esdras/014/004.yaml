  yaml_path: translation/extra_canonical/2_esdras/014/004.yaml
  text: And I sent him, and he led my people out of Egypt, and I brought him up onto Mount Sinai, and I kept him with me many days.
translation:
  language: zh_hans
  text: 我差遣了他，他便领我的子民出了埃及；我又领他上了西奈山，把他留在我身边多日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misi eum
  choice: 我差遣了他
  rationale: 保留拉丁文“差遣”的主动结构及上帝作为主语的语气。
- source_word: eduxit populum meum de Aegypto
  choice: 他便领我的子民出了埃及
  rationale: 准确表达“带领……离开埃及”，并以“便”自然衔接差遣与行动。
- source_word: adduxi eum super montem Sina
  choice: 我又领他上了西奈山
  rationale: super在此表示登上山；“西奈山”是现代汉语通行译名。
- source_word: detinui eum apud me diebus multis
  choice: 让他与我同住多日
  rationale: apud me意为“在我这里、与我同在”；detinui带有使其留下之意，译作“让他与我同住”比生硬的“扣留”更符合此处语境。
theological_decisions:
- issue: 上帝与摩西在西奈山上的关系
  choice: 让他与我同住多日
  alternative: 把他留在我身边多日
  rationale: 前者自然庄重，并保留上帝使摩西留在其面前的含义，不额外说明其目的或具体时长。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体；保留原文连续的第一人称神圣发言与第三人称所指，不在本节补明“他”是摩西。
