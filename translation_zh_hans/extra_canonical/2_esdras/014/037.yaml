- source_word: mansimus ibi
  choice: 就留在那里
  rationale: 保留mansimus“停留、留在”的完成时意义，并用“就”自然衔接前句。
- source_word: in crastinum
  choice: 第二天
  rationale: 这是现代汉语中表达“次日”的清楚、自然说法。
- source_word: Et factum est
  choice: 事情发生了
  rationale: 保留拉丁叙事公式的字面开放性；原文在本节末形成悬接，不预先补明随后发生的具体事件。
