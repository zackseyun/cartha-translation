  text: These words you shall make public, and these you shall hide.
translation:
  language: zh_hans
  text: 这些话，你要公开；另一些话，你要隐藏。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Haec ... uerba
  choice: 这些话
  rationale: 按拉丁文直译，指示代词与“话”相连，表达将被公开的这一部分内容。
- source_word: in palam facies
  choice: 要公开
  rationale: 该短语意为使之显露、公布；现代汉语用“公开”简洁自然。
- source_word: et haec
  choice: 另一些话
  rationale: 拉丁文两次使用 haec，借对举区分两组内容；汉语补出“另一些话”，避免误解为同一批话，同时不增加具体所指。
- source_word: abscondes
  choice: 要隐藏
  rationale: 保留原文与“公开”相对的动作及命令/将来语气，不具体化隐藏方式。
theological_decisions:
- issue: 两组“话”的关系
  choice: 译作“这些话……另一些话……”
  alternative: “这些话你要公开，这些话你要隐藏”
  rationale: 原文以重复的 haec 构成对举，语境要求所指为不同部分；译文仅明示这种语篇关系，不解释哪些内容属于哪一组。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以分号呈现公开与隐藏之间的鲜明对举。
