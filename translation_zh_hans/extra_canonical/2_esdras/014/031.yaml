  yaml_path: translation/extra_canonical/2_esdras/014/031.yaml
  text: the inheritance in the land of Zion, and you and your fathers committed iniquity and did not keep the ways that the Most High commanded you; the Righteous One
translation:
  language: zh_hans
  text: 在锡安地的产业；你们和你们的祖先都行了不义，未曾遵行至高者吩咐你们的道路；那公义者……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sortem
  choice: 产业
  rationale: 拉丁词可指分得的份额、地业或产业；结合“在锡安地”及英语审校层的 inheritance，译作“产业”既自然，也保留承受之份的含义。
- source_word: iniquitatem fecistis
  choice: 行了不义
  rationale: 较贴近原文的道德与宗教语义，同时保持庄重而清楚的现代汉语表达。
- source_word: uias
  choice: 道路
  rationale: 保留原文“道路”的比喻性表达，指至高者所命定的生活方式和行为准则，不窄化为单纯的“命令”。
- source_word: altissimus
  choice: 至高者
  rationale: 这是犹太宗教语境中对上帝的尊称，直接对应拉丁文最高级称号。
- source_word: Iustus
  choice: 那公义者
  rationale: 原文为阳性单数、名词化的形容词，可作称号理解；“那公义者”保留其称号性质及与后文衔接的开放性。
theological_decisions:
- issue: 片段末尾 Iustus 的句法归属
  choice: 译为“那公义者……”并保留未完状态
  alternative: 译为“公义的”或将其补成“公义者必……”
  rationale: 所给拉丁文本在 Iustus 处截断，其可能开启下一分句，也可能是称号。不可凭本节残片擅自补足谓语或确定完整句法，因此用省略号明确文本未完。
- issue: sortem 的圣约土地含义
  choice: 译作“产业”
  alternative: “份额”“基业”
  rationale: “产业”能表达锡安之地作为所分得、所承受之份，又避免用更具特定译经传统色彩的词强行解释其神学内涵。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。此处所给拉丁文显然是跨节或残句片段：开头“在锡安地的产业”缺少本片段内的支配成分，结尾 Iustus 也未构成完整分句，因此保留其片段性，不按上下文臆补。
