  text: 要赶快离开这些日子；因为你现在所看见的这些事
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festina
  choice: 要赶快
  rationale: 表达拉丁语命令式所含的急迫催促，现代汉语自然简明。
- source_word: transmigrare
  choice: 离开
  rationale: 此处指从当前时代迁离；译作“离开”自然，也避免过度具体化为地理迁徙。
- source_word: a temporibus his
  choice: 这个时代
  rationale: 拉丁语为复数“这些时候/时期”，语境中整体指当下这一时代；汉语用单数集合表达更自然。
- source_word: Quae
  choice: 这些事
  rationale: 中性关系代词指所见之事；不从下一节提前补入“恶事”等限定。
- source_word: enim
  choice: 因为
  rationale: 保留原文解释或说明前句的连接关系。
- source_word: uidisti nunc
  choice: 你现在所看见的
  rationale: 依照原文时态和副词次序，保留“现在”以及已经看见之意；作为未完分句留待下一节续接。
theological_decisions:
- issue: 是否把下一节的“恶事”和“发生”提前补入本节
  choice: 不补入，使本节止于未完的“这些事”
  alternative: 译成“因为你现在所看见发生的这些恶事”
  rationale: 本节所给拉丁文本仅有“Quae enim uidisti nunc”，其关系从句在下一节完成。按原文节界保留悬接结构，避免跨节增词并预先消解句法。
- issue: “离开这个时代”的具体含义
  choice: 保持宽泛表达
  alternative: 明确译作“离世”或“迁往另一时代”
  rationale: transmigrare a temporibus his 可暗示离世或从现时代迁离，但本句未明确说明方式；保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号体现两分句的紧密连接；末尾刻意保留未完句式，因为原文在下一节才完成关系从句。
