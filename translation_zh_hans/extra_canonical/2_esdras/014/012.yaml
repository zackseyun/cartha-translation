  text: But two of its parts remain after the middle of the tenth part[a].
translation:
  language: zh_hans
  text: 但在第十部分过半之后，它还剩下两个部分[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它还剩下两个部分。”
    reason: 拉丁文末尾短语的句法关系较为紧缩；此译法保留核心陈述，而不明确它与“第十部分过半”的关系。
lexical_decisions:
- source_word: Superant
  choice: 还剩下
  rationale: 准确表达“余下、尚存”的意思，并以现代汉语自然呈现。
- source_word: eius
  choice: 它……的（以“它还剩下”表达）
  rationale: 保留拉丁文属格代词与上一节“世代”的明确联系，不省略“属于它”的含义。
- source_word: duae ... partis
  choice: 两个部分
  rationale: 保留数目“二”和“部分”的分段意象。
- source_word: post medium decimae partis
  choice: 在第十部分过半之后
  rationale: 贴近拉丁文的次序和结构；“medium”在此指第十部分的中点或过半之处。
- source_word: autem
  choice: 但
  rationale: 保留转折或承接语气。
theological_decisions:
- issue: 世代分段所表达的末期进程
  choice: 按原文保留“第十部分过半”与“还剩两个部分”的并置
  alternative: 按算术关系改写为“还剩两个半部分”
  rationale: 原文措辞本身具有张力，译文不替作者进行算术协调，也不引入特定末世论解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“部分”与前文关于世代划分的表达相呼应；正文保留原文略显紧缩且具有张力的时间表述。
