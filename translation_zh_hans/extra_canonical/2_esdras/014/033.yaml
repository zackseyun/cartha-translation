  yaml_path: translation/extra_canonical/2_esdras/014/033.yaml
  text: Now you are here[a], and your brothers are within you. If, therefore, you will command your mind and instruct your heart,
translation:
  language: zh_hans
  text: 如今你们在这里，而你们的弟兄在你们里面[a]。因此，你们若管束自己的心思，教导自己的心，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文 introrsum uestrum 字面为“在你们里面／之内”；也可按空间范围理解为“在你们的境内”。
    reason: 保留该简略拉丁短语的字面意义及其可能的空间性理解，避免将其具体化为“更深入内地”。
lexical_decisions:
- source_word: nunc
  choice: 如今
  rationale: 表达当前时点，语体庄重而自然。
- source_word: introrsum uestrum
  choice: 在比你们更深入内地的地方
  rationale: introrsum 表示向内、在更里面；结合此处对两群弟兄所在位置的对照，译作更深入内地较为通顺，同时以脚注保留其字面歧义。
- source_word: imperaueritis sensui uestro
  choice: 管束自己的心思
  rationale: imperare 可指命令或支配；对自己的 sensus 而言，中文用“管束”自然地表达使心思受控制。sensus 在这里可涵盖思想、理解力，译作“心思”而不将含义限缩为理智。
- source_word: erudieritis cor uestrum
  choice: 教导自己的心
  rationale: 贴近 erudire（教导、训练）与 cor（心），并保留原文“心思／心”的并列表达。
theological_decisions:
- issue: introrsum uestrum 所指的位置关系
  choice: 正文理解为弟兄处在比听众更深入内地之处
  alternative: 直译为“你们的弟兄在你们里面”
  rationale: 上下文以“你们在这里”与弟兄所在之处相对照，因此空间性的理解更连贯；但拉丁短语形式简略，字面上也可能读作“在你们里面”，故不在正文中消除该歧义，而以脚注注明。
- issue: 条件句在本节末尾未完结
  choice: 保留未完成的条件从句，以逗号收尾
  alternative: 从下一节补入条件句的结果
  rationale: 所给拉丁文仅包含条件句前件，结果句属于下一节；严格维持本节边界，避免错置经文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“更深入内地”呈现地理空间关系；“管束自己的心思，教导自己的心”保留原文两个内在层面的并列。末尾逗号刻意表明句意将在下一节续完。
