  source_fidelity: 首项“你心中”是原文没有的定位性补充；“人世的”也将 humana 较具体地解释为现世生活。拉丁文所表达的是弃绝属必死之人的思想、卸下人的负担、脱去软弱的本性，并把最使听者烦扰的思虑置于一边。修订保留四个连续命令、iam（“现在”）和句末未完的连接形式。
  naturalness: 原译总体通顺，但“你心中必死之人的念头”修饰关系不够清楚，容易理解为“在你心里的、其他必死之人的念头”。以“凡人的念头”表达 mortales cogitationes 在现代汉语中更自然。
  terminology: “本性”恰当地保留 natura 的宽泛性，不预设其为肉体或罪性；“思虑”可保留。将 humana 译为“人的”避免把原文未明说的“现世”含义加重。
