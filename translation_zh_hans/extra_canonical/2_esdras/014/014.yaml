  text: Et dimitte abs te mortales cogitationes, et proice abs te pondera humana, et exue te iam infirmam naturam, et repone in unam partem molestissima tibi cogitamenta, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/014.yaml
  text: And put away from yourself mortal thoughts, and cast off from yourself human burdens, and strip off now your weak nature, and set aside the thoughts that are most grievous to you,
translation:
  language: zh_hans
  text: 要摒弃凡人的念头，卸下人的重担，现在脱去你软弱的本性，把那些最使你苦恼的思虑搁在一旁，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte abs te mortales cogitationes
  choice: 除去你心中必死之人的念头
  rationale: “mortales”可指凡人或必死之人；译出“必死之人”以保留死亡性这一含义，并补入“心中”使现代汉语自然。
- source_word: proice abs te pondera humana
  choice: 摆脱人世的重担
  rationale: “pondera”直指重物、负担；“humana”在此表示属于人类现世生活的，译为“人世的”较流畅。
- source_word: exue te iam infirmam naturam
  choice: 脱下你这软弱的本性
  rationale: 保留“exue”的脱衣隐喻；“natura”译作“本性”，不将其具体化为身体或罪性。
- source_word: repone in unam partem
  choice: 搁在一旁
  rationale: 这是自然的现代汉语表达，对应移置一边、暂且放下。
- source_word: molestissima tibi cogitamenta
  choice: 最令你苦恼的思虑
  rationale: “molestissima”表达极度困扰或烦扰，“思虑”贴合“cogitamenta”的内在思想活动。
theological_decisions:
- issue: “软弱的本性”是否特指罪性或肉体
  choice: 保留为“软弱的本性”
  alternative: 脱去你软弱的肉体／罪性
  rationale: 拉丁文“infirmam naturam”本身未明确限定为身体或罪性，不作宗派性或体系化解释。
- issue: “必死之人的念头”所指范围
  choice: 保留死亡性与人的思想之间的张力
  alternative: 世俗的念头／凡人的思想
  rationale: “mortales”首先是“必死的、属必死之人的”；避免直接等同于“世俗”或道德上邪恶。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原文连续四项命令的排比，以及句末未完的逗号，以对应所给经节在下一节延续的句法。
