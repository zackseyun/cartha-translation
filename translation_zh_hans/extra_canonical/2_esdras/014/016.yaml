source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'contigisse mala, iterum horum deteriora facientur : Quantum enim inualidum fit saeculum a senectute, tantum multiplicabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/016.yaml
  text: —worse things than these will happen again. For the weaker the age becomes through old age[a], the more evils will multiply.
translation:
  language: zh_hans
  text: ——比这些更坏的事还会再次发生。因为这个时代因衰老而变得越衰弱[a]，灾祸就越发增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这个时代”也可译作“这个世代”；原文把它描写成因年老而日渐衰弱。
    reason: 说明 saeculum 的语义范围，并保留 a senectute 的拟人化表达。
lexical_decisions:
- source_word: deteriora
  choice: 更坏的事
  rationale: 保留中性复数比较级的宽泛含义，不将其过度限定为某一类灾难。
- source_word: facientur
  choice: 会发生
  rationale: 按未来被动形式在此处的非人称／事件性用法处理，避免误译为“使……发生”的主动因果关系。
- source_word: saeculum
  choice: 时代
  rationale: 在末世语境中指当前的世界时代或世代；“时代”自然易懂，同时不把含义缩窄为某一代人。
- source_word: inualidum fit
  choice: 变得衰弱
  rationale: 准确表达逐渐失去力量、趋于虚弱的状态变化。
- source_word: multiplicabunt
  choice: 灾祸就越发增多
  rationale: 拉丁文以复数动词承接上文的 mala（灾祸／恶事）；中文明确补出所指，使句意完整自然。
theological_decisions:
- issue: facientur 是否表达当前灾祸主动造成更严重后果
  choice: 译为“更坏的事还会再次发生”
  alternative: “这些灾祸还会造成更坏的事”
  rationale: 未来被动形式以 deteriora 为主语，强调更坏之事将要发生；不额外引入当前灾祸与未来灾祸之间的自然因果，也保留其末世性陈述的张力。
- issue: 时代“衰老”的表达是否仅作修辞意译
  choice: 保留时代因衰老而衰弱的拟人意象
  alternative: 意译为“时代越接近终结”
  rationale: 原文明确使用 senectute（衰老／老年），保留这一意象，不径直将其解释成特定末世时间表。
translation_notes:
  register: 采用庄重而现代的普通话。开头用破折号承接上一节未完的句法；“越……越……”自然呈现拉丁文 Quantum…tantum… 的对应结构。
