  text: 'misi pueros meos prophetas ad uos, quos acceptos interfecistis et laniastis corpora illorum : quorum sanguinem exquiram, dicit dominus. Haec dicit dominus omnipotens : domus uestra de-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/032.yaml
  text: I sent my servants the prophets to you, whom you received and killed and tore their bodies apart; their blood I will require, says the Lord.
translation:
  language: zh_hans
  text: 我差遣了我的仆人——众先知——到你们那里；你们接待了他们，却杀害他们，撕裂他们的身体。我要追讨他们的血，主说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pueros meos prophetas
  choice: 我的仆人众先知
  rationale: pueros 在此指受差遣服事主的人，译作“仆人”；prophetas 与之同位，译作“众先知”，既准确又符合现代汉语圣经语体。
- source_word: acceptos
  choice: 接待了他们
  rationale: 保留 acceptos 的基本含义“接纳、接待”，不采用推断性的“抓住”；加“却”自然呈现接待后又杀害的强烈反差。
- source_word: laniastis corpora illorum
  choice: 撕裂他们的身体
  rationale: laniastis 表示撕裂、残害；此处直译以保留原文暴烈而具体的意象。
- source_word: sanguinem exquiram
  choice: 我要追讨他们的血
  rationale: exquiram 在血债语境中表示追究、索偿；“追讨……的血”保留审判与问责含义，也避免擅自补明追讨对象或方式。
- source_word: dicit dominus
  choice: 主这样说
  rationale: 采用自然、庄重的现代汉语先知宣告句式。
theological_decisions:
- issue: “追讨他们的血”的含义
  choice: 保留血债追讨的表达，不明说惩罚方式
  alternative: 我要为他们被杀而惩罚你们
  rationale: 原文只说 sanguinem exquiram，含有神追究流血之罪的意思，却没有明定惩罚对象、形式或时间；直译可保存这种张力。
- issue: acceptos 所表达的行为
  choice: 译为“接待了他们”
  alternative: 抓住了他们／接收了他们
  rationale: acceptos 本身可表示接纳或接收；上下文的反差虽令人意外，但不应因后续杀害而将其解释成原文未明说的逮捕。
translation_notes:
  register: '采用庄重而清楚的现代标准汉语。“众先知”说明“仆人”与“先知”为同位关系；分号与“却”使原文连续分词结构在汉语中自然清晰。原始引文末尾的“Haec dicit dominus omnipotens : domus uestra de-”属于下一节的开头，未纳入本节译文。'
