  text: Nempe ego uos mare traieci et plateas uobis in inuia munitas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/013.yaml
  text: Surely I brought you through the sea[a], and in trackless places I made roads secure for you.
translation:
  language: zh_hans
  text: 的确[a]，是我领你们渡过了海，也在无路之地为你们筑成了稳固的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧译作：“耶和华如此说：我领你们渡过了海，并在无路之地为你们修筑了坚固的道路。”本节拉丁文本则以“的确，是我……”起首。
    reason: previous_rendering
lexical_decisions:
- source_word: Nempe
  choice: 的确
  rationale: 表达确认和强调语气，与拉丁文“确实、的确”的含义相符，不把上一节的引语公式带入本节。
- source_word: ego uos mare traieci
  choice: 是我领你们渡过了海
  rationale: “是我”保留ego的强调；“领你们渡过了海”自然表达traicere加宾语mare所指的带领过海。
- source_word: plateas
  choice: 道路
  rationale: 此处指在原本无路之处开出的可通行道路；译作“道路”比现代汉语中的“街道”更符合语境。
- source_word: in inuia
  choice: 在无路之地
  rationale: 保留invia所含“不可通行、没有道路之处”的形象，措辞简明而不额外指定为旷野或荒漠。
- source_word: munitas
  choice: 筑成了稳固的
  rationale: 兼顾munire的修筑、加固和使之安全可通行之义，也保留与plateas搭配的完成结果。
theological_decisions:
- issue: 本节是否以“耶和华如此说”起首
  choice: 不加入该引语公式，以“的确，是我……”起首
  alternative: “耶和华如此说：我……”
  rationale: 现有拉丁原文明确以Nempe ego起首；“耶和华如此说”属于把上一节措辞带入本节的旧译处理，并非本节拉丁文本所载。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“是我”凸显施事者，“无路之地”保留原文意象；全句避免古奥措辞，也不把上一节的引语公式误并入本节。
