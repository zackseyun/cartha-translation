  yaml_path: translation/extra_canonical/2_esdras/001/034.yaml
  text: And your sons will not produce offspring, because they neglected my commandment among you and did what is evil before me.
translation:
  language: zh_hans
  text: 你们的儿子将不能生育后代，因为他们轻忽了我在你们中间的命令，并且行了我眼中看为恶的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creationem non facient
  choice: 必不能生育后代
  rationale: 拉丁语直译近于“不会产生受造之物”，但在此语境中指不能繁衍后代；采用现代汉语自然且庄重的表达。
- source_word: mandatum meum
  choice: 我……所颁的命令
  rationale: mandatum 指具有权威性的命令或诫命；“所颁的命令”保留其权威意味，同时避免额外引入特定宗教术语。
- source_word: uobiscum
  choice: 在你们中间
  rationale: 其基本义为“与你们同在/和你们一起”，在此修饰命令存在并施行的群体处境；“在你们中间”符合上下文，也保留拉丁语关系上的一定开放性。
- source_word: quod malum est coram me fecerunt
  choice: 行了我眼中看为恶的事
  rationale: 保留 coram me（在我面前）的评价视角，并采用中文圣经文体中自然、易懂的表达。
theological_decisions:
- issue: 不能生育后代的性质
  choice: 按审判后果陈述，不进一步说明其生理或社会机制
  alternative: 明确解释为不育、绝后或子女死亡
  rationale: 原文只说他们不会“产生后代”，未交代具体实现方式，译文不替原文消除这种含混。
- issue: mandatum 的译法
  choice: 命令
  alternative: 诫命
  rationale: “命令”直接对应拉丁语 mandatum，并避免在无更多语境支持时赋予其特定法典或宗派性含义。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体；句式清楚自然，保留神谕式审判宣告的力度。原文末尾的“Tradam”（“我必交出/交付”）语义未完，显然开启下一句，故本节正文不纳入。
