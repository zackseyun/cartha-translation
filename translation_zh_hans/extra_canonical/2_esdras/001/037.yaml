revisions:
- from: 那将来之民所蒙的恩惠[a]；他们的孩子欢欣喜乐，虽未曾用肉眼看见我，却会在灵里相信我所说的话。如今，父啊，求你在荣耀中察看，看看那将来的民。
  to: 那正在来到的民之恩惠[a]；他们的小孩子欢欣喜乐，虽不用肉眼看见我，却要在灵里相信我所说的话。如今，父啊，求你以荣耀垂顾，并看见那正在来到的民。
  rationale: 修订避免将不完整拉丁文片段中的属格关系解释为“所蒙”，以“民之恩惠”保留原文歧义；将 uenientis 一致译为“正在来到的”，并调整末句，使并列动词在现代汉语中自然而不重复。其余关键术语保持原有的谨慎处理。
