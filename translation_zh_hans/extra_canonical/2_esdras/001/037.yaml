source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populi uenientis gratiam, cuius paruuli exultant cum laetitia, me non uidentes oculis carnalibus, sed spiritu credent quae dixi. Et nunc, pater, aspice cum gloria et uide populum uenientem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/037.yaml
  text: the favor of the people that is coming[a], whose little ones rejoice with gladness, not seeing me with bodily eyes, but in spirit believing what I have said. And now, Father, look with glory and see the people that is coming
translation:
  language: zh_hans
  text: 那正在来到的民之恩惠[a]；他们的小孩子欢欣喜乐，虽不用肉眼看见我，却要在灵里相信我所说的话。如今，父啊，求你以荣耀垂顾，并看见那正在来到的民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在此承接上文，直译为“那正在来到的民之恩惠（或：恩典）”；现存句段未明说支配这一宾格短语的动词，且该属格短语与“恩惠”的具体关系未能由本句断定。
    reason: 说明 gratiam 的词义范围、句首的句法不完整，以及不将 populi uenientis 擅自限定为恩惠的领受者。
lexical_decisions:
- source_word: gratiam
  choice: 所蒙的恩惠
  rationale: gratia在此可指恩惠、恩宠或恩典；结合属格短语populi venientis，译作“那将来之民所蒙的恩惠”较自然，同时不把它误解为百姓给予别人的好意。
- source_word: paruuli
  choice: 孩子
  rationale: paruuli直指幼小者；“孩子”是现代汉语中自然、清楚且不额外赋予象征意义的表达。
- source_word: oculis carnalibus
  choice: 肉眼
  rationale: 这是现代汉语对“属肉身的眼睛”的惯用表达，保留与随后“在灵里”的对照。
- source_word: spiritu
  choice: 在灵里
  rationale: 拉丁文未明说是人的灵还是圣灵；“在灵里”保留这一可能具有神学意义的含混，不擅自限定。
- source_word: cum gloria
  choice: 在荣耀中
  rationale: 贴近拉丁文“带着／在荣耀中”的表达，避免把荣耀明确归为方式、伴随者或父自身的属性。
- source_word: populum uenientem
  choice: 那将来的民
  rationale: 保留uenientem的动态和将来指向，也与本节开头populi venientis形成呼应。
theological_decisions:
- issue: spiritu所指为何
  choice: 在灵里
  alternative: 靠着圣灵／用心灵
  rationale: 原文没有限定是圣灵还是人的灵，因此采用不作定论的译法。
- issue: gratia的领受者与性质
  choice: 那将来之民所蒙的恩惠
  alternative: 那将来之民的恩典／那将来之民的好意
  rationale: 上下文片段只留下gratiam这一宾格短语，句法依附成分可能已在前文；正文以自然汉语表达最可能的关系，脚注同时提示原文的片段性和词义范围。
- issue: 未见与相信之间的时态关系
  choice: 虽未曾……却会……
  alternative: 没有……却在……相信
  rationale: non uidentes是现在分词，而credent是将来时；译文保留“未见”与“将相信”的时态张力。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“父啊”保留直接呼告；“欢欣喜乐”传达exultant cum laetitia的加强语气。句首按现存拉丁文作为承上片段处理，不擅自补写谓语。
