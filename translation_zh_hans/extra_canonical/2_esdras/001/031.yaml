source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: obtulleritis, auertam faciem meam a uobis ; dies enim festos uestros et neomenias et circumcisiones carnis repudiavi. Ego
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/031.yaml
  text: When you bring offerings to me[a], I will turn my face from you; for I have rejected your feast days and new moons and circumcisions of the flesh.
translation:
  language: zh_hans
  text: 你们献上供物时[a]，我必转脸不顾你们；因为你们的节期、朔日和肉身的割礼，我都已弃绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章属于较晚的基督教编纂层，通常称为“第五以斯拉”。这里弃绝“节期、朔日和肉身的割礼”的说法，反映了这一编纂层的论辩立场，不应与第3—14章犹太启示文学主体的神学思想混为一谈。
    reason: compositional_layer
lexical_decisions:
- source_word: obtulleritis
  choice: 你们献上供物时
  rationale: 该形式应对应 offerre 的完成时态虚拟式，承接献礼语境；按条件或时间从句自然译为“献上供物时”。
- source_word: auertam faciem meam a uobis
  choice: 我必转脸不顾你们
  rationale: 保留“转脸”的身体意象，同时以“不顾”表达拉丁文 a vobis 所表示的拒绝与疏离。
- source_word: dies enim festos uestros et neomenias
  choice: 因为你们的节期、朔日
  rationale: dies festos 为节期，neomenias 指每月初一的新月庆典，采用中文圣经传统且准确的“朔日”。
- source_word: circumcisiones carnis
  choice: 肉身的割礼
  rationale: 直译 carnis，保留文本对外在肉身割礼的明确限定及其论辩张力。
- source_word: repudiavi
  choice: 我都已弃绝
  rationale: 表达 repudiavi 强烈的拒斥含义，并用“已”反映完成时。
theological_decisions:
- issue: 对节期、朔日和肉身割礼的弃绝
  choice: 按现存拉丁文本直接保留这一强烈陈述
  alternative: 将其弱化为只拒绝不虔诚或虚伪的礼仪
  rationale: 原文没有附加“不虔诚”或“虚伪”等限定；不应在正文中替作者化解其论辩性。脚注则交代该段的后期基督教编纂层背景，避免把它无差别归于本书第3—14章的犹太启示文学主体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“转脸不顾”既保留原文意象，也避免生硬直译；“朔日”“肉身的割礼”保留经文语域及原文的历史神学张力。
