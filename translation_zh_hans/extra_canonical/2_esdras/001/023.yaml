  yaml_path: translation/extra_canonical/2_esdras/001/023.yaml
  text: I did not give you fire for your blasphemies, but by casting wood into the water I made the stream sweet.
translation:
  language: zh_hans
  text: 我没有因你们的亵渎而把火给你们；相反，我把木头投进水中，使河水变甜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pro blasphemiis
  choice: 因你们的亵渎
  rationale: pro 在此表达与亵渎行为相应的缘由或报应；译为“因”既保留语义，也避免额外解释。blasphemiae 直译为“亵渎”。
- source_word: ignem ... dedi
  choice: 把火降给你们
  rationale: 拉丁文直义是“把火给你们”；中文以“降火”更自然地表达作为惩罚临到人的火，同时保留“给你们”的受事关系。
- source_word: mittens lignum in aqua
  choice: 把木头投进水里
  rationale: 以方式性结构承接 mittens 的分词用法；lignum 保持较宽泛的“木头”，不擅自具体化其树种或形状。拉丁文 aqua 为夺格，但与表示投入的动作连用时，依语义译作“进水里”。
- source_word: dulce feci flumen
  choice: 使那河水变甜
  rationale: 保留使役结构“使……变甜”。flumen 可指河流或流水；按水质由苦转甜的语境译作“河水”，更符合现代汉语。
theological_decisions:
- issue: 火是否明确指惩罚
  choice: 不在正文中增添“惩罚”一词
  alternative: 我没有因你们的亵渎而用火惩罚你们
  rationale: 原文以“因你们的亵渎而把火给你们”形成对照，暗示惩罚，却未明说“惩罚”；正文保留这种含蓄关系。
- issue: 木头使水变甜的作用方式
  choice: 仅陈述神把木头投进水里，并使河水变甜
  alternative: 木头本身使河水变甜
  rationale: 原文的主语持续为神，未明确断定木头具有独立功效；译文避免添加因果机制或象征解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“相反”清楚呈现 sed 的转折；全句保留第一人称神谕口吻及“你们”的复数对象。
