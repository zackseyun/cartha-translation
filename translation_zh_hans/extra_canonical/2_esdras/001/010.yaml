  text: Reges multos propter eos subuerti, Pharaonem cum pueris suis et omnem exercitum eius percussi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/010.yaml
  text: For their sake I overthrew many kings; I struck Pharaoh with his servants and all his army.
translation:
  language: zh_hans
  text: 我为了他们推翻了许多君王；我击打了法老和他的臣仆，以及他的全军。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter eos
  choice: 为了他们
  rationale: 表达“为他们的缘故”，保留行动以他们为受益对象的含义。
- source_word: subuerti
  choice: 推翻了
  rationale: 对应颠覆、倾覆之意，用于君王时自然且有力度。
- source_word: pueris suis
  choice: 他的臣仆
  rationale: pueri 在此语境中并非通常意义的儿童，而是法老的侍从或臣仆；“臣仆”符合君王语境，也与出埃及叙事的表达相称。
- source_word: percussi
  choice: 击打了
  rationale: 保留拉丁词的直接性及经文庄重语体，不把所施打击具体化为原文未明说的“杀灭”。
- source_word: omnem exercitum eius
  choice: 他的全军
  rationale: 简洁准确地表达法老全部军队。
theological_decisions:
- issue: “击打”是否明确表示杀灭
  choice: 保留为“击打了”
  alternative: 消灭了
  rationale: 原文 percussi 可指击打、打击；虽然叙事背景可能涉及毁灭，译文不应消除原词所保留的语义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；以分号对应原文两个紧密相连的神圣行动。
