  rationale: 直译为“主的话”亦可；此处采用现代中文圣经叙事中自然而庄重的先知性表达，“耶和华”明确呈现 domini 在该固定措辞中所指的以色列之神。
- source_word: factum est ... ad me
  choice: 临到我
  rationale: 拉丁文直译近于“发生/来到我这里”；“临到我”准确传达启示性话语到达先知的惯用意义，也符合现代中文宗教文体。
- source_word: dicens
  choice: 说
  rationale: 保留引出后续直接话语的分词结构，不提前补出原文未明说的内容。
