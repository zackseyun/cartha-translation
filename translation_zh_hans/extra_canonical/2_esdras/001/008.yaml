  text: Tu autem excute comam capitis tui et proice omnia mala super illos, quoniam non obaudierunt legi meae; populus autem indisciplinatus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/008.yaml
  text: But you[a], shake out the hair of your head and cast all evils upon them, because they have not obeyed my law; they are an undisciplined people.
translation:
  language: zh_hans
  text: 你要抖散你头上的头发，把一切灾祸都抛在他们身上，因为他们没有听从我的律法；他们是没有管教的百姓。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有管教”也可译作“缺少教导”或“不守纪律”；原词强调缺乏教导、训练或约束，不只是一般意义上的悖逆。
    reason: 保留 indisciplinatus 的语义幅度，并说明为何正文不采用较宽泛的“悖逆”。
lexical_decisions:
- source_word: excute comam capitis tui
  choice: 把头发抖落下来
  rationale: 直译这一象征性动作，保留拉丁文“抖落你头上的头发”的具体意象，同时用自然汉语表达。
- source_word: omnia mala
  choice: 一切灾祸
  rationale: mala 在此是被倾到人身上的恶事或祸患，并非道德意义上的“罪恶”；译作“灾祸”更合语境。
- source_word: non obaudierunt legi meae
  choice: 没有听从我的律法
  rationale: obaudire 带有听从、服从之义；“听从”同时保留聆听与顺服的关联。
- source_word: populus autem indisciplinatus
  choice: 他们实在是一个不受管教的民族
  rationale: indisciplinatus 指缺少纪律、教导或管束；“不受管教”比笼统的“悖逆”更贴近词义。autem 在此更自然地作为强调或补述处理。
theological_decisions:
- issue: 灾祸的施加与先知的象征性行动
  choice: 保留命令式“把一切灾祸都倾在他们身上”
  alternative: 把一切恶事归到他们身上
  rationale: 原文 proice omnia mala super illos 是直接命令，不宜弱化为单纯宣告或归因；“灾祸”避免误读为把道德邪恶转嫁给他们。
- issue: indisciplinatus 的性质
  choice: 不受管教
  alternative: 悖逆
  rationale: 保留该词与 disciplina（教导、训练、纪律）的词源联系，不将其神学含义收窄为主动反叛。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“民族”用于 populus，以表达群体身份；“律法”用于 lex，符合经文语境。脚注标记置于其所解释的句末。
