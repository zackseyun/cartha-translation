  timestamp: '2026-07-14T10:04:46Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实呈现 domus uestras、populo uenienti、credunt（现在时）与 facient（将来时）的对比，也正确未将下一句的 Prophetas 纳入本节。然“没有听见我”容易被理解为已经未曾听过，未充分保留 non audientes 的同时性；并且原文“quibus signa non ostendi”直接修饰同一群体，宜使关系更清晰。
  naturalness: 整体庄重自然。“一个将要来的民族”略显生硬；“正在来到的一个民族”既自然，也较贴近现在分词 uenienti。“他们没有听见我，却相信我”可改为“他们不听我，却相信”，更简洁且较好体现分词与现在时的并置。
  terminology: “房屋”“民族”“神迹”“吩咐”均可用。“神迹”作为 signa 的正文译法可接受，脚注保留“记号”的可能性适当。为避免无依据地将原文未明说的宾语重复加入“相信我”，可采用汉语中自然的“却相信”；上下文中“我”仍是所言者。
  issues:
  - severity: medium
    issue: “他们没有听见我”弱化了 non audientes 的同时性。
    rationale: audientes 为现在分词，配合 credunt 的现在时，表达他们在“不听我／未听我”的状态下仍相信；“没有听见”在现代汉语通常偏向既往经历。
  - severity: low
    issue: “一个将要来的民族”对 uenienti 的进行性表达稍弱。
    rationale: uenienti 是现在分词；“正在来到的一个民族”能保留其正在临近的意象，同时汉语顺畅。
  - severity: low
    issue: 第二分句的关系指向可更明确。
    rationale: quibus 指前述“正在来到的民族”；改写后用“我没有向他们显过神迹”明确其所指，而不改变语义。
  revised_text: 我必把你们的房屋交给正在来到的一个民族；他们不听我，却相信；我没有向他们显过神迹，他们却必照我所吩咐的去做。[a]
  revised_footnotes:
