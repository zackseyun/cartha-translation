  text: domus uestras populo uenienti, qui me non audientes credunt ; quibus signa non ostendi, facient quae praecepi. Prophetas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/035.yaml
  text: I will give your houses to a people that is coming[a], who, without hearing me, believe; to whom I have shown no signs, yet they will do what I have commanded.
translation:
  language: zh_hans
  text: 我必把你们的房屋交给正在来到的一个民族；他们不听我，却相信；我没有向他们显过神迹，他们却必照我所吩咐的去做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹”也可译作“记号”。
    reason: 保留 signa 既可指超自然神迹、也可指作为凭证之记号的词义范围。
lexical_decisions:
- source_word: domus uestras
  choice: 你们的房屋
  rationale: 按复数直译，既可指实际房屋，也保留家业、居所的语义空间。
- source_word: populo uenienti
  choice: 一个将要来的民族
  rationale: uenienti 是现在分词，结合语境表达正在来到或即将出现的群体；“民族”较自然地传达 populus 的集体含义。
- source_word: me non audientes credunt
  choice: 他们没有听见我，却相信我
  rationale: 保留 audientes 与 credunt 的同时性对照，并以现在时“相信”区别于下文未来时 facient；“却”呈现原句明显的反差。
- source_word: signa
  choice: 神迹
  rationale: 在宗教语境中，signa 指作为凭证的超自然记号；“神迹”是现代汉语中自然且易懂的对应词。
- source_word: facient quae praecepi
  choice: 他们却会照我所吩咐的去做
  rationale: 用“会”体现 facient 的将来时，并以“所吩咐的”表达 quae praecepi。
theological_decisions:
- issue: 未听见却相信的时间关系
  choice: “没有听见我，却相信我”
  alternative: “虽然还没有听见我，却会相信我”
  rationale: 拉丁文 credunt 是现在时，audientes 是现在分词；正文保留当前相信与将来遵行之间的时态张力，不改成未来相信。
- issue: signa 的宗教含义
  choice: “神迹”
  alternative: “记号”
  rationale: 此处强调未获超自然凭证仍相信并顺服；“神迹”在现代汉语中更清楚，但脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。以“我必……”“却……”呈现宣告和对比；严格区分 credunt 的现在时与 facient 的将来时。末尾 Prophetas 属下一句开头，未纳入本节。
