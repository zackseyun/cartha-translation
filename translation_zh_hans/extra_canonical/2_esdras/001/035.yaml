revisions:
- from: 我必把你们的房屋交给一个将要来的民族。他们没有听见我，却相信我[a]；我没有向他们显过神迹，他们却会照我所吩咐的去做。
  to: 我必把你们的房屋交给正在来到的一个民族；他们不听我，却相信；我没有向他们显过神迹，他们却必照我所吩咐的去做。[a]
  rationale: 修订以“正在来到的”对应 uenienti，以“不听我，却相信”避免把现在分词误解为单纯过去未曾听闻，并保留 credunt 的现在性和 facient 的将来性。“却必”使将来顺服与当前相信的对照清楚。脚注内容可保留；但其锚点移至“神迹”后，符合脚注所说明的词语。
