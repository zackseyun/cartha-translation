  text: 'ad me dicentes: Vtquid nos in desertum istud adduxisti interficere nos? melius nobis fuerat seruire Aegyptiis quam mori in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/018.yaml
  text: saying, “Why have you brought us into this wilderness, to kill us? It would have been better for us to serve the Egyptians than to die in this wilderness.”
translation:
  language: zh_hans
  text: 对我说：“你为什么把我们领到这片旷野，要杀死我们呢？我们服侍埃及人，也比死在这里好。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desertum istud
  choice: 这片旷野
  rationale: “旷野”准确体现拉丁文 desertum 的荒凉无人之地，也符合出埃及叙事的语境；指示词 istud 译为“这片”。
- source_word: interficere nos
  choice: 要杀死我们
  rationale: 保留目的性表达及原话中的强烈控诉，不弱化为“让我们死”。
- source_word: seruire Aegyptiis
  choice: 服侍埃及人
  rationale: 直译 seruire，既可表达受役使，也保留与相关出埃及传统相呼应的措辞。
theological_decisions:
- issue: 百姓将被领入旷野解释为蓄意杀害
  choice: 保留“要杀死我们”
  alternative: 以致我们死去
  rationale: 原文使用目的不定式 interficere，呈现说话者的控诉；译文不替说话者缓和或重新解释其动机判断。
translation_notes:
  register: 采用自然、庄重的现代汉语，保留直接引语的质问语气。拉丁文本在所给引文末尾止于介词 in，但英语审校层依据完整句意补出“在这旷野”；中文为避免从残缺拉丁证据重复补足地点，末句译作自然且含义完整的“死在这里”。
