translation:
  language: zh_hans
  text: 亚希雅的儿子，非尼哈的儿子，以利的儿子，亚玛利雅的儿子，亚西雅的儿子，米拉约的儿子，亚拿的儿子，乌西雅的儿子，波利特的儿子，亚比书的儿子，非尼哈的儿子，以利亚撒的儿子，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filii
  choice: ……的儿子
  rationale: 逐项保留拉丁文反复出现的 Filii 及其家谱链结构；现代汉语清楚易懂。
- source_word: Achiae
  choice: 亚希雅
  rationale: 按拉丁名 Achia 的通常对应译作“亚希雅”，同时以脚注保留既有异读。
- source_word: Oziae
  choice: 乌西雅
  rationale: 拉丁文 Ozia 对应 Uzziah；采用现代中文圣经人名中通行的“乌西雅”，而非 Uzzi。
- source_word: Abissei
  choice: 亚比书
  rationale: 此名位于祭司家系中，对应 Abishua；避免误认作大卫的外甥亚比筛。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名尽量依照中文圣经的通行形式；对较少见且无统一译法的名字按拉丁文音译。正文为承接上一节的家谱片段，因此保留句末逗号。
