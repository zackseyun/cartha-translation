  text: You ate the bread of angels for food. When you were thirsty[a], did I not split the rock, and waters flowed in abundance? Because of the heat I covered you with the leaves of trees.
translation:
  language: zh_hans
  text: 你们把天使的饼当作食物吃了。你们口渴时，我岂不是劈开磐石，水便充沛地涌流吗？因酷热，我用树叶遮蔽你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文摘录止于“因酷热”；“我用树叶遮蔽你们”据经审核的英文参照文本补出。
    reason: textual_source_boundary
lexical_decisions:
- source_word: in escam
  choice: 作为食物
  rationale: 保留目的或用途意味，同时使中文衔接自然。
- source_word: panem angelorum
  choice: 天使的饼
  rationale: 直译属格结构，不把“天使”解释为饼的来源、拥有者或食用者。
- source_word: petram excidi
  choice: 劈开磐石
  rationale: 保留第一人称施事和强烈的动作意味；“磐石”符合庄重的经文语体。
- source_word: fluxerunt aquae in satietate
  choice: 让水丰丰富富地涌出
  rationale: 以结果式表达解决拉丁文问句中 et 后接陈述语气造成的汉语衔接问题；“丰丰富富”体现 in satietate 的充足、满足之意。
- source_word: propter aestus
  choice: 因天气炎热
  rationale: aestus 可指热气或酷热；此处用普通读者易懂且不过度限定的表达。
theological_decisions:
- issue: “天使的饼”的属格关系
  choice: 保留“天使的饼”这一开放表达
  alternative: 天使所吃的饼／天使赐下的饼
  rationale: 拉丁文 panem angelorum 本身没有明确说明属格关系，不应在译文中加入特定解释。
- issue: 劈石与水涌出的逻辑关系
  choice: 译为“劈开磐石，让水……涌出”
  alternative: “劈开磐石，水就……涌出”
  rationale: 既保持两个动作的紧密联系，也使整个反问句在现代汉语中语法完整，不额外引入神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丰丰富富地涌出”比生硬的“流到饱足”自然，同时保留水量充足的强调。末句因所给拉丁文在 propter aestus 后截断，正文依英文审核层保留完整语意，并以脚注透明说明来源边界。
