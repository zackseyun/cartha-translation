  yaml_path: translation/extra_canonical/2_esdras/001/021.yaml
  text: I covered you with the leaves of trees[a]. I divided fertile lands for you; I drove out the Canaanites and Perizzites and Philistines from before you. What shall I do for you? says the Lord.
translation:
  language: zh_hans
  text: 我曾用树叶遮盖你们。我把肥沃的土地分给你们[a]；我从你们面前赶走了迦南人、比利洗人和非利士人。我为你们做什么呢？主说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文直译为“我把肥沃的土地分给你们”；这是一种简略说法，可能指把土地分配给以色列各支派。
    reason: 说明原文的压缩表达及其可能所指。
lexical_decisions:
- source_word: folia arborum uos texi
  choice: 我曾用树叶遮盖你们
  rationale: 直译拉丁文的意象；texi 表示遮盖、覆盖，保留原文较为突兀但清楚可辨的表达。
- source_word: Diuisi uobis terras pingues
  choice: 我把肥沃的土地分给你们
  rationale: pingues 在土地语境中指肥沃、丰饶；diuisi 译为“分给”，保留划分或分配土地的含义。
- source_word: a facie uestra proieci
  choice: 我从你们面前赶走了
  rationale: 按拉丁习语自然表达，同时保留敌族被从以色列人面前逐出的空间意象。
- source_word: quid faciam
  choice: 我还能为你们做什么呢
  rationale: 在连续列举恩惠的语境中，“还能”自然传达反问语气；不将其扩展为原文没有的具体责备。
theological_decisions:
- issue: 末句反问的语义指向
  choice: 我还能为你们做什么呢？
  alternative: 我该为你们做什么呢？
  rationale: 上下文列举上主已经施行的作为，反问较可能表达“尚有什么可做”；但没有补入“更多”等更强限定，以免过度消解 quid faciam 的简约性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。族名使用中文圣经中通行的译名；保留“树叶遮盖”的原始意象及土地分配表达的含混性。
