lexical_decisions:
- source_word: ab oriente
  choice: 从东方来
  rationale: 按拉丁语直译为“从东方”；结合 quibus 所指的人群，补出“来”使这一承接上文的片段在现代汉语中自然。
- source_word: quibus dabo
  choice: 我要把……赐给他们
  rationale: 保留 dabo 的“赐予”语义，以及 quibus 的复数受益对象。
- source_word: ducattum
  choice: 作领袖
  rationale: 该词形可能是 ducatus/ducatum 一类传抄或拼写变体；依句法和英译审校层，将其理解为领导、引领之职。汉语用“作领袖”自然表达所赐予的角色。
- source_word: Abraham, Isaac et Iacob
  choice: 亚伯拉罕、以撒和雅各
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
theological_decisions:
- issue: 亚伯拉罕、以撒和雅各所承担角色的性质
  choice: 作领袖
  alternative: 作引路者／作领导
  rationale: 原文只表明领导或引领功能，并未规定具体制度性职分；故不用“君王”“族长”等可能增添神学或体制含义的称谓。
