source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vade et nuntia populo meo facinora ipsorum et filiis eorum iniquitates, quas in me admiserunt, ut nuntient filiis filiorum suorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/005.yaml
  text: “Go and declare to my people their evil deeds, and to their children the iniquities that they have committed against me, so that they may tell their children's children.
translation:
  language: zh_hans
  text: “你去，向我的子民宣告他们的恶行，向他们的儿女宣告他们得罪我的罪孽，好让他们把这些事传给自己儿女的儿女。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vade
  choice: 你去
  rationale: 保留直接命令的语气，同时符合现代汉语表达。
- source_word: nuntia
  choice: 告诉
  rationale: 此处指向百姓宣告其恶行；“告诉”自然清楚，也能与后半句“传给”区分。
- source_word: facinora
  choice: 恶行
  rationale: 准确表达严重的邪恶行为，不额外限定为某一类罪行。
- source_word: iniquitates
  choice: 罪孽
  rationale: 体现道德与宗教层面的罪责，并与前面的“恶行”保持词义差别。
- source_word: quas in me admiserunt
  choice: 得罪我的
  rationale: 自然表达针对上帝所犯的罪，同时保留拉丁文“against me”的关系。
- source_word: filiis filiorum suorum
  choice: 子孙后代
  rationale: 以现代汉语惯用语表达“他们儿女的儿女”，清楚传达代际延续。
theological_decisions:
- issue: 罪行针对上帝的性质
  choice: 得罪我的罪孽
  alternative: 他们对我所犯的罪孽
  rationale: 两者都忠实于原文；正文选择更自然凝练的表达，不进一步界定这些罪的具体性质。
- issue: 末句主语的指向
  choice: 他们传给子孙后代
  alternative: 他们的儿女传给自己的儿女
  rationale: 拉丁文复数主语可从语境理解为前述后代；中文用“他们”保留一定的指代弹性，并突出世代相传。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留命令句的力度，并用“恶行／罪孽”呈现原文 facinora 与 iniquitates 的近义并列。
