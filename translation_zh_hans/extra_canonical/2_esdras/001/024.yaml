  text: Quid tibi faciam, Iacob ? noluisti me obaudire, Iuda. transferam me ad alias gentes et dabo eis nomen meum, ut custodiant legitima mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/024.yaml
  text: What shall I do to you, Jacob? You would not obey me, Judah. I will turn to other nations, and I will give them my name, that they may keep my statutes.
translation:
  language: zh_hans
  text: “雅各啊，我该怎样待你呢？犹大啊，你不肯听从我。我要转向别的民族，把我的名赐给他们，使他们遵守我的律例。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi faciam
  choice: 我该怎样待你呢
  rationale: 保留反问的开放性及责问语气；“怎样待你”在现代汉语中自然，也比具体化为惩罚或帮助更忠于原文的含混表达。
- source_word: noluisti me obaudire
  choice: 你不肯听从我
  rationale: noluisti 表示意愿上的拒绝，而不只是未能做到；“不肯”准确传达这一点。
- source_word: transferam me ad alias gentes
  choice: 我要转向别的民族
  rationale: 按字面保留主体自身转向其他民族的动作，同时采用自然汉语表达。
- source_word: dabo eis nomen meum
  choice: 把我的名赐给他们
  rationale: 保留“赐予我的名”这一身份与归属意味浓厚但未被原文进一步解释的表达。
- source_word: legitima mea
  choice: 我的律例
  rationale: legitima 指依法设立、应当遵行的规定；“律例”符合经文语域，又为现代读者所能理解。
theological_decisions:
- issue: 雅各与犹大所指对象之间的关系
  choice: 分别保留“雅各”和“犹大”两个呼语
  alternative: 将二者合并解释为同一群体，或改作“雅各，就是犹大”
  rationale: 原文连续使用两个名称，却没有明说二者关系；译文不替原文消除这种修辞张力。
- issue: “赐给他们我的名”的含义
  choice: 直译并保留其含义空间
  alternative: 解释为“使他们作我的子民”或“让他们归在我名下”
  rationale: 原文可能涉及身份、归属或神圣授权，但并未限定其中一种，故不在正文中作教义化释义。
- issue: 转向其他民族的范围
  choice: 译作“别的民族”
  alternative: 译作“外邦人”
  rationale: alias gentes 本身强调其他民族；“外邦人”可能预先引入特定的犹太—非犹太分类，超过本句明说的范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。呼语加“啊”以清楚呈现拉丁文中的直接称呼；整体保留先知式责问与宣告的节奏，不使用生硬古语。
