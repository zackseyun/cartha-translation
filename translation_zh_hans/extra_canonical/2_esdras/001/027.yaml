base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/027.yaml
  text: It is not as though you have forsaken me[a], but yourselves, says the Lord.
translation:
  language: zh_hans
  text: 主说：“你们所离弃的，与其说是我，不如说是你们自己。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Non quasi ... sed
  choice: 与其说……不如说……
  rationale: 此结构表达带修正意味的对比，并非简单否定前项；这样既保留修辞张力，也使现代汉语自然清楚。
- source_word: dereliquistis
  choice: 所离弃的
  rationale: 拉丁语为第二人称复数完成时，指已经发生且具有现实后果的离弃；借助“所”字结构可让“我”和“你们自己”共同充当对比宾语。
- source_word: uos ipsos
  choice: 你们自己
  rationale: 准确传达反身强调形式 ipsos，突出他们的行为最终伤害、弃绝的是自身。
- source_word: dicit dominus
  choice: 主说
  rationale: 采用庄重而通行的圣经叙述用语，并前置为引语框架，使汉语表达顺畅。
theological_decisions:
- issue: 是否将前项理解为绝对否认他们离弃了主
  choice: 保留“与其说……不如说……”的修辞性修正
  alternative: “你们不是离弃了我，而是离弃了自己”
  rationale: Non quasi ... sed 字面带有“并非仿佛/不是说……而是……”的比较修正色彩；上下文已经说他们离弃主，因此不宜译成逻辑上的绝对否认。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。译文保留原句的悖论式对比，不另加解释，也不引入特定宗派含义。
