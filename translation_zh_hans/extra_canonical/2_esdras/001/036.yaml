  text: They have not seen[a], yet they will remember their antiquity[b]. I call to witness
translation:
  language: zh_hans
  text: 他们未曾见过，却会记起他们的古事[a]。我请……作证——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处拉丁文本的形式和句法有疑难。“他们的古事”也可译作“他们的古时”或“他们的往事”；其中也可能指与他们有关的古代之人或事物。动词按现存形式也可理解为“他们的古事将被记念”。
    reason: textual_variant
lexical_decisions:
- source_word: non uiderunt
  choice: 他们未曾见过
  rationale: 按拉丁文直译其否定完成时；原文没有明说所见的对象，因此不擅自补入“先知”等词。
- source_word: memorabuntur
  choice: 会记起
  rationale: 形式上是将来时被动语态，但此处与后接属格搭配不规则，传本也不稳定；依上下文及审定咨询层取主动意义，同时以脚注说明语法上的另一可能。
- source_word: antiquitatum eorum
  choice: 他们的古事
  rationale: antiquitas 的复数属格可指古时、往事或古代之事；“古事”较能保留时间与事物两方面的开放性，避免缩窄成单纯“他们从前的日子”。
- source_word: Testor
  choice: 我请……作证
  rationale: testor 在此引出下一句的见证对象；本节止于该词，故保留未完结构，不补写原文未提供的宾语。
