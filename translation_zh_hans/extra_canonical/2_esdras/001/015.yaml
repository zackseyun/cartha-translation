  yaml_path: translation/extra_canonical/2_esdras/001/015.yaml
  text: 'But you have forgotten me[a], says the Lord. Thus says the Lord Almighty: Quail were a sign for you; camps were for you'
translation:
  language: zh_hans
  text: 但你们却忘记了我，主说。全能的主如此说：鹌鹑曾作你们的记号；营地是给你们的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “营地”所译的拉丁词castra形式上为复数，但常指一个营地或营盘。较自由的旧译作：“我赐给你们一个营地作保护。”现存本节拉丁文本并未明说“我赐给”或“作保护”。
    reason: 说明castra的复数形式及其常见集合／单数意义，并区分较自由旧译与现存拉丁文本所明确表达的内容。
lexical_decisions:
- source_word: mei obliti estis
  choice: 你们却忘记了我
  rationale: 直译其完成时含义，并以“却”承接前文的转折语气。
- source_word: dominus omnipotens
  choice: 全能的主
  rationale: 按拉丁文通常、庄重而自然地表达。
- source_word: coturnix ... in signo fuit
  choice: 鹌鹑曾作你们的记号
  rationale: 保留单数集合名词“鹌鹑”以及“作记号”的明确措辞，不将“记号”解释为神迹、凭据或警戒。
- source_word: castra uobis
  choice: 营地是为你们设的
  rationale: castra虽为复数形式，却常作集合性或单数意义的“营地、营盘”；补出汉语所需的系词和“设”字，以表达与格uobis的受益关系，同时不加入原文未明说的“保护”。
theological_decisions:
- issue: “记号”的性质
  choice: 保留为“记号”
  alternative: 译作“神迹”或“警戒”
  rationale: 原文signum没有在本句中限定其神学功能，应保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“主说”与“全能的主如此说”保留原文连续两次宣告公式。末句依照所给拉丁文本的不完整边界处理，不擅自补入下一节内容。
