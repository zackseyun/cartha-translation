  text: 'Quando inuocabitis me, ego non exaudiam uos: maculastis enim manus uestras sanguine, et pedes uestri inpigri sunt ad committenda homicidia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/026.yaml
  text: When you call upon me, I will not hear you, for you have defiled your hands with blood, and your feet are swift to commit murder.
translation:
  language: zh_hans
  text: 你们呼求我时，我必不垂听你们；因为你们的手沾满了血，你们的脚急于杀人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inuocabitis
  choice: 呼求
  rationale: 准确表达向神呼告、求助之意，也符合现代汉语经文语体。
- source_word: non exaudiam
  choice: 必不垂听
  rationale: exaudire 不只是听见，也含应允呼求之意；“垂听”自然传达神俯允祈求的语境。
- source_word: maculastis
  choice: 沾满了
  rationale: 原义为玷污、染污；与“手”和“血”搭配时，“沾满了血”既保留罪责意象，也比抽象的“玷污”更自然。
- source_word: inpigri sunt
  choice: 急于
  rationale: 该词在此表示积极、迅速而不迟疑；“急于”保留行动倾向，同时避免添加原文没有的速度比喻。
- source_word: committenda homicidia
  choice: 杀人
  rationale: homicidia 指杀人、凶杀行为；简洁译为“杀人”，不把复数机械化，也不弱化其严重性。
theological_decisions:
- issue: 神“不垂听”呼求的含义
  choice: 保留为“必不垂听”，不解释为绝对听不见或仅仅不应允
  alternative: “我必不听你们”或“我必不应允你们”
  rationale: 拉丁文 exaudiam 可兼有垂听和应允之意；译文保留这一语义张力，不额外建立有关祷告的系统性结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以分号保留原句中宣告与原因之间的紧密关系。
