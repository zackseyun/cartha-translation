  text: in this wilderness[a]. I grieved over your groanings and gave you manna.
translation:
  language: zh_hans
  text: 在这旷野里，我为你们的呻吟而悲伤[a]，并赐给你们吗哪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我怜悯你们的呻吟。”
    reason: 保留将 dolui 按语境理解为怜悯的替代译法；正文仍按该词通常所表达的悲伤、痛苦之意翻译。
lexical_decisions:
- source_word: deserto hoc
  choice: 在这旷野里
  rationale: 保留拉丁文指示词 hoc 和处所表达；本节所给文本由承接上文的片段开头，因此不补出源文没有的成分。
- source_word: dolui
  choice: 悲痛
  rationale: doleo 表示忧伤、痛苦；“悲痛”保留其强烈情感色彩，不弱化为单纯的“怜悯”。
- source_word: gemitos uestros
  choice: 你们的哀叹
  rationale: gemitus 可指呻吟、叹息或哀号；“哀叹”在此自然庄重，也能表达百姓在困苦中的声音。
- source_word: mannam
  choice: 吗哪
  rationale: 采用现代中文圣经语境中通行的专名译法。
- source_word: dedi
  choice: 赐给了
  rationale: 说话者为上帝，译作“赐给”符合语境，同时准确表达给予之意。
theological_decisions:
- issue: dolui 是否译为“怜悯”
  choice: 我因你们的哀叹而悲痛
  alternative: 我怜悯你们的哀叹
  rationale: 拉丁文 dolui 首先表达悲伤或痛苦，而不是通常由 misereor 表达的怜悯；正文据此保留上帝因百姓哀叹而悲痛的表述，脚注列出较宽泛的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀叹”比“呻吟”更适合叙事与宗教文本语域；不添加“于是”“作为食物”等拉丁文未明说的内容。
