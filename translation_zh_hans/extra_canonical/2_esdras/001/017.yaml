  text: nunc usque murmuratis. Vbi sunt beneficia quae praestiti uobis? nonne in deserto cum esuriretis et sitiretis proclamastis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/017.yaml
  text: Until now you have kept murmuring. Where are the benefits that I bestowed on you? Did you not cry out in the wilderness when you were hungry and thirsty,
translation:
  language: zh_hans
  text: 直到如今，你们还一直发怨言。我赐给你们的种种恩惠在哪里呢？你们在旷野中饥渴的时候，不是曾呼求吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nunc usque
  choice: 直到如今
  rationale: 直接表达时间延续，符合现代汉语庄重叙事语体。
- source_word: murmuratis
  choice: 一直发怨言
  rationale: 保留以色列人在旷野中抱怨、埋怨的经文语境；“一直”传达拉丁文结合上下文所呈现的持续意味。
- source_word: beneficia
  choice: 种种恩惠
  rationale: “恩惠”兼顾所受益处与施予者的恩待；“种种”自然体现复数。
- source_word: praestiti
  choice: 赐给
  rationale: 表达主动施予，语气庄重自然，又不把一般性的施惠过度神学化。
- source_word: proclamastis
  choice: 呼求
  rationale: 在困苦中大声呼喊的语境里，“呼求”比单纯“喊叫”更自然；不补出拉丁文未明说的呼求对象。
theological_decisions:
- issue: proclamastis是否补明呼求对象
  choice: 不补“向我”
  alternative: 向我呼求
  rationale: 拉丁原文只说“你们呼求”，并未明示对象；保留这一省略，避免以语境推断取代正文。
- issue: beneficia的神学色彩
  choice: 种种恩惠
  alternative: 种种好处／我为你们所行的善事
  rationale: “恩惠”能体现赐予者的善待，但不引入特定宗派关于“恩典”的术语含义。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。首句保留责备语气；两个问句延续原文的反诘。末句按本节独立呈现而加问号，未擅自补出呼求对象。
