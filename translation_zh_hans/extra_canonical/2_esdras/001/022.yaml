  yaml_path: translation/extra_canonical/2_esdras/001/022.yaml
  text: 'Thus says the Lord Almighty: In the wilderness, when you were thirsty at the bitter stream and blasphemed my name,'
translation:
  language: zh_hans
  text: 全能的主如此说：“在旷野，你们在苦水河边口渴、亵渎我的名，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus omnipotens
  choice: 全能的主
  rationale: 准确传达拉丁文对主的称号，并采用现代中文圣经语体中自然庄重的表达。
- source_word: in deserto
  choice: 在旷野时
  rationale: 保留地点背景并照应后续时间从句，使中文句法自然。
- source_word: in flumine amaro
  choice: 在苦水河边
  rationale: flumen 指河流或水道，amarum 表示苦的；译作“苦水河边”既保留水味之苦，也符合口渴发生的场景。
- source_word: blasphemantes
  choice: 亵渎
  rationale: 该词不只是一般抱怨，而是对神名的冒犯；“亵渎”准确保留其宗教与道德分量。
theological_decisions:
- issue: “苦”的所指
  choice: 苦水河
  alternative: 苦河／苦涩的河流
  rationale: 拉丁文 amaro 在语法上修饰 flumine，可能指河水苦涩，也可能近似地名；“苦水河”保留两种理解，不额外判定。
- issue: 亵渎行为与口渴处境的关系
  choice: 以“并”连接两项同时发生的行为状态
  alternative: 译成带因果色彩的“因口渴而亵渎”
  rationale: 原文仅以并列分词表达，没有明说因果，因此不补入因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留宣告公式“全能的主如此说”，正文依拉丁文呈现旷野、苦水河、口渴与亵渎神名等全部要素。原始摘录开头的“uobis adhuc? dicit dominus.”显然属于前一节残句，依本节英文审校层及句法边界不纳入本节。
