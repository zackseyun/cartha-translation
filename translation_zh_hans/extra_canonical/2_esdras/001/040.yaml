  naturalness: 人名列举和“也被称为”的措辞均为自然、庄重的现代汉语。以分号及重复“玛拉基”清楚限定后句只回指玛拉基，适合避免汉语中代词或后置修饰语的歧义。
  terminology: 那鸿、哈巴谷、西番雅、哈该、撒迦利亚、玛拉基均为通行中文圣经人名。“主的天使”保留 angelus domini 的称号性和可能的传统背景；脚注谨慎说明“使者”这一词义可能，且不将“被称为”扩展为身份上的确定等同。脚注锚点[a]位于相关术语后，恰当。
