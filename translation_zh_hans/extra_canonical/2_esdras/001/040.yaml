base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/040.yaml
  text: Nahum and Habakkuk[a], Zephaniah, Haggai, Zechariah, and Malachi[b], who is also called the angel of the Lord.”
translation:
  language: zh_hans
  text: 那鸿和哈巴谷、西番雅、哈该、撒迦利亚，以及玛拉基；玛拉基也被称为主的天使[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的天使”也可按这个拉丁词较宽泛的词义译作“主的使者”。这里说玛拉基“被称为”这一称号，不必据此断定他就是其他经文中那位特定的“主的天使”。
    reason: 说明 angelus 的词义范围，并避免把原文的称谓陈述扩大为明确的身份认定。
lexical_decisions:
- source_word: angelus domini
  choice: 主的天使
  rationale: 按此处拉丁语的通常含义直译为“主的天使”，保留作者把这一称号用于玛拉基的表达，不以其名字的词源意义“使者”取代原文用词。
- source_word: qui
  choice: 玛拉基；玛拉基也……
  rationale: 拉丁语阳性单数关系代词最自然地回指紧邻的“玛拉基”。为使现代汉语指向清楚，重复人名，而不把关系从句误解为修饰整组先知。
- source_word: uocatus est
  choice: 被称为
  rationale: 保留被动称谓结构及其陈述性质，不进一步断定这是身份本质、别名，还是传统称号。
theological_decisions:
- issue: 玛拉基与“主的天使”的关系
  choice: 保留“玛拉基也被称为主的天使”的直接陈述
  alternative: 译作“玛拉基，也就是主的使者”
  rationale: 原文说的是“也被称为”，并使用 angelus；译文不应借玛拉基名字的词源预先消解此处可能具有的天使意涵，也不应把称号强化为完全等同的身份定义。
- issue: angelus 的译法
  choice: 正文译“天使”，脚注注明“使者”这一词义可能
  alternative: 正文译“使者”
  rationale: 在该拉丁语语境中，“天使”是更直接、较具历史语感的理解；但 angelus 本身可有“使者”义，因此在脚注保留词义层面的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的列名方式。以“以及”标出名单末项，并通过重复“玛拉基”消除关系从句指代不清；保留 verse 所属引语的闭合引号。
