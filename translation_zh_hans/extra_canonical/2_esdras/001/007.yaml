source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nonne ego eos eduxi de terra Aegypti, de domo seruitutis? ipsi autem irritauerunt me et consilia mea spreuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/007.yaml
  text: Was it not I who brought them out of the land of Egypt, out of the house of slavery? But they provoked me and despised my counsels.
translation:
  language: zh_hans
  text: 难道不是我把他们从埃及地、从为奴之家领出来的吗？他们却惹我发怒，藐视我的劝告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domo seruitutis
  choice: 为奴之家
  rationale: 保留原文“家／屋”与“奴役”构成的具体意象，也呼应出埃及传统的固定表达。
- source_word: irritauerunt me
  choice: 惹我发怒
  rationale: 拉丁语表示激怒、触怒；此译明确表达行为使上帝发怒，而不弱化为一般的冒犯。
- source_word: consilia mea
  choice: 我的劝告
  rationale: consilia 可指谋略、计划或劝告；在受话者藐视上帝教导的语境中，“劝告”自然，同时不将其过度限定为隐秘计划。
- source_word: spreuerunt
  choice: 藐视
  rationale: 准确传达轻蔑、弃置不顾的含义，语体庄重且符合现代汉语。
theological_decisions:
- issue: 上帝带领以色列出埃及与他们悖逆之间的张力
  choice: 以“难道不是我……吗？他们却……”保留反问和强烈转折
  alternative: 改为平铺直叙：“我曾领他们出来，但他们……”
  rationale: 原文 Nonne 的反问强调上帝施行拯救这一无可否认的事实，autem 则凸显百姓回应与恩典之间的反差。
- issue: consilia 是否译作上帝的“计划”
  choice: 译为“劝告”
  alternative: “旨意”或“谋划”
  rationale: 原词具有多义性；本句的 spreuerunt 更自然地与可被拒斥的劝告相连。避免用“旨意”预先引入特定神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留出埃及叙事中的“埃及地”和“为奴之家”意象，并以反问句再现责问语气。
