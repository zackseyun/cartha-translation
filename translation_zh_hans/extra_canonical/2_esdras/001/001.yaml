  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Liber Ezrae prophetae secundus, filii Sarei, filii Azarei, filii Helchiae, filii Salame, filii Sadoch, filii Acitob,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/001.yaml
  text: The second book of Ezra the prophet, son of Seraiah, son of Azariah, son of Hilkiah, son of Shallum, son of Zadok, son of Ahitub,
translation:
  language: zh_hans
  text: 先知以斯拉第二书。以斯拉是西莱雅的儿子，西莱雅是亚撒利雅的儿子，亚撒利雅是希勒家的儿子，希勒家是沙龙的儿子，沙龙是撒督的儿子，撒督是亚希突的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Liber Ezrae prophetae secundus
  choice: 先知以斯拉第二书
  rationale: 按拉丁文的书名结构译出“以斯拉”“先知”与“第二书”；采用现代中文常见、庄重而清楚的书名表达。
- source_word: filii
  choice: 是……的儿子
  rationale: 拉丁文以连续属格家谱列出世系；逐代展开为完整中文分句，可清楚保留父子链条，避免一连串“之子”造成歧义。
- source_word: Sarei
  choice: 西莱雅
  rationale: 对应传统经名 Seraiah，采用现代中文圣经人名中通行的音译。
- source_word: Azarei
  choice: 亚撒利雅
  rationale: 对应 Azariah，采用通行音译。
- source_word: Helchiae
  choice: 希勒家
  rationale: 对应 Hilkiah，采用通行音译。
- source_word: Salame
  choice: 沙龙
  rationale: 对应 Shallum；采用通行圣经译名，不按拉丁词形另造音译。
- source_word: Sadoch
  choice: 撒督
  rationale: 对应 Zadok，采用通行音译。
- source_word: Acitob
  choice: 亚希突
  rationale: 对应 Ahitub，采用通行音译。
theological_decisions:
- issue: “prophetae”与以斯拉的关系
  choice: 将“先知”置于书名中，译作“先知以斯拉第二书”
  alternative: 译作“先知以斯拉的第二书”或在正文中称“先知以斯拉”
  rationale: 拉丁文标题式短语可理解为关于或属于先知以斯拉的第二卷；置于书名中最贴合原文结构，也不额外扩充其先知身份的神学含义。
- issue: 家谱是否暗示每一代均为直接父子
  choice: 按原文重复的 filii 直译为逐代“儿子”关系
  alternative: 用较宽泛的“后裔”表达
  rationale: 源文本明确反复使用 filius 的属格形式；本节没有文本依据将其弱化为泛指后裔，因此保留直接的字面关系。
translation_notes:
  register: 采用现代标准普通话和简体中文。书名简洁庄重；家谱改写为逐代完整分句，以提高普通读者的可读性，同时完整保留原文顺序与关系。无脚注。
