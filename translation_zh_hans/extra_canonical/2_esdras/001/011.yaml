  text: Omnes gentes a facie eorum perdidi et in oriente prouinciarum duarum populum, Tyri et Sidonis, dissipaui et omnes aduersarios eorum interfeci.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/011.yaml
  text: I destroyed all the nations before them, and in the east I scattered the people of the two provinces, Tyre and Sidon, and killed all their enemies.
translation:
  language: zh_hans
  text: 我从他们面前灭绝了列国；在东方，我驱散了两个地区——推罗和西顿——的居民，又杀死了他们所有的仇敌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a facie eorum
  choice: 从他们面前
  rationale: 保留拉丁文的空间性习语及其“为他们清除前路”的含义，不将其简化为单纯的“替他们”。
- source_word: prouinciarum duarum
  choice: 两个地区
  rationale: 拉丁语 provincia 可指地域或行政区域；此处用现代读者容易理解且不过度限定行政性质的“地区”。
- source_word: populum
  choice: 居民
  rationale: 与推罗、西顿两个地域名称搭配时，“居民”比单数形式的“人民”更自然，也准确表达当地人口。
- source_word: dissipaui
  choice: 驱散了
  rationale: 对应“使分散、驱散”，保留其与“灭绝”和“杀死”不同的动作层次。
- source_word: aduersarios
  choice: 仇敌
  rationale: 符合经文庄重语域，并表达与他们敌对的人。
theological_decisions: []
