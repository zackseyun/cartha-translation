  text: 我要容忍那些我曾赐给如此大恩惠的人到几时呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vsquequo
  choice: 到几时
  rationale: 保留原文质问的语气，并采用庄重自然的现代汉语表达。
- source_word: sustinebo
  choice: 我要容忍
  rationale: 此处指持续忍受、容忍一群悖逆者；“容忍”既贴近拉丁语义，也符合上下文中的责问语气。
- source_word: tanta beneficia
  choice: 如此大的恩惠
  rationale: beneficia 指所赐的好处、恩泽；“恩惠”可体现赐予者的善意，又不额外限定具体内容。
- source_word: contuli
  choice: 曾赐给
  rationale: 表达已经施予的行动；“赐给”符合神向人施恩的语境，但不增添原文没有的神学限定。
theological_decisions:
- issue: 神的容忍与既往施恩之间的张力
  choice: 保留反问，并将关系从句译成独立陈述句
  alternative: 我要容忍那些我曾赐予如此大恩惠的人到几时呢？
  rationale: 原文以反问并列神的忍耐和对人的厚待。拆为两句更符合现代汉语，同时保留责问中的神学张力，不解释容忍是否已经终止。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我要……到几时呢”保留先知性责问语气；不使用古奥措辞。
