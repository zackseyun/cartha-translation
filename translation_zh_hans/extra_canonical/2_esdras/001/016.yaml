  yaml_path: translation/extra_canonical/2_esdras/001/016.yaml
  text: I gave for protection[a], and there you grumbled. You did not exult in my name over the destruction of your enemies, but still
translation:
  language: zh_hans
  text: 我赐下作保护[a]，而你们在那里发怨言。你们没有奉我的名，因你们仇敌的灭亡而欢欣；但仍然……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“赐下”之物，宾语须由上文补足；也可译作“我赐下作为保障”。
    reason: 说明拉丁文 ad tutelam dedi 中宾语承前省略，避免将未明载的对象或受事加入正文。
lexical_decisions:
- source_word: ad tutelam dedi
  choice: 我把它赐给你们作保护
  rationale: 拉丁文直译为“我赐下作保护”，宾语承前省略；中文以“它”承接上文，避免擅自指明所赐之物。
- source_word: illic murmurastis
  choice: 你们却在那里抱怨
  rationale: illic 表示“在那里”；murmurastis 在此指不满、发怨言，译作现代而庄重的“抱怨”。
- source_word: triumphastis
  choice: 欢欣
  rationale: 此处与 de perditione 连用，表示因某事欢欣庆贺，而不是战胜“灭亡”本身。
- source_word: in nomine meo
  choice: 奉我的名
  rationale: 保留“在我的名里／凭我的名”的宗教表达范围，同时使现代中文自然。
- source_word: de perditione inimicorum uestrorum
  choice: 因仇敌的灭亡
  rationale: de 加夺格在此表示欢欣所缘由的事情；“灭亡”保留 perditione 的毁灭性含义。
- source_word: sed adhuc
  choice: 反而仍然……
  rationale: 现存引文在 adhuc 后中断；用省略号明确保留未完句，不补写原文没有的谓语或时间限定。
theological_decisions:
- issue: “奉我的名”与仇敌灭亡之间的关系
  choice: 你们没有奉我的名，因仇敌的灭亡而欢欣
  alternative: 你们没有因仇敌的灭亡而以我的名夸胜
  rationale: 所选译法把 in nomine meo 与 triumphastis 相连，并将 de perditione 表为欢欣的缘由，既不暗示以神之名击败“灭亡”，也不弱化原文对仇敌灭亡的陈述。
- issue: 残句 sed adhuc 的处理
  choice: 反而仍然……
  alternative: 反而直到如今仍在抱怨
  rationale: 后者补入了原文此处没有明说的谓语和“直到如今”；正文保留原始残缺与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“奉我的名”保留经文语域；句末省略号显示所给拉丁文本本身未完。
