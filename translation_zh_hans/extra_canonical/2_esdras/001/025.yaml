base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/025.yaml
  text: Because you have forsaken me, I also will forsake you. When you ask me for mercy, I will not have mercy on you.
translation:
  language: zh_hans
  text: 因为你们离弃了我，我也必离弃你们；当你们向我求怜悯时，我必不怜悯你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquistis / derelinquam
  choice: 离弃了 / 必离弃
  rationale: 以同一词根对应拉丁文重复使用的 derelinquere，保留行为与回应之间鲜明的对称关系；“离弃”也符合庄重而自然的经文语体。
- source_word: petentibus uobis a me misericordiam
  choice: 当你们向我求怜悯时
  rationale: 将拉丁文夺格绝对结构自然地表达为时间从句，并保留“向我求”及 misericordia 的核心含义。
- source_word: non miserebor uestri
  choice: 我必不怜悯你们
  rationale: 直接保留否定性的将来宣告，并用“怜悯”呼应前句的“怜悯”，再现 misericordiam / miserebor 的词源关联。
theological_decisions:
- issue: 神的离弃与拒绝怜悯是否应作缓和解释
  choice: 按原文保留直接、绝对的审判宣告
  alternative: 译为较缓和的“任凭你们”或“暂不回应你们”
  rationale: 拉丁文明确使用 derelinquam 和 non miserebor，译文不应加入原文没有的限制、期限或解释，以保留其神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的普通话；以分号呈现两句紧密相连的因果与审判推进，并保留原文第二人称复数。
