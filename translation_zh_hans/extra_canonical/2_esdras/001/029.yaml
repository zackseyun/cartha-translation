source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vt essetis mihi in populum, et ego uobis in deum, et uos mihi in filios, et ego uobis in patrem ? Ita uos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/029.yaml
  text: that you should be my people[a], and I should be your God, and you should be my sons, and I should be your father?
translation:
  language: zh_hans
  text: 使你们作我的子民，我作你们的上帝；你们作我的儿子[a]，我作你们的父亲，不是吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿女”。
    reason: 提示 filios 在指称群体时可作较宽泛理解；正文仍保留其阳性复数的字面意义及与“父亲”相对的父子意象。
lexical_decisions:
- source_word: populum
  choice: 子民
  rationale: 在“我的……我作你们的上帝”这一盟约式表达中，“子民”比泛指的“人民”更自然，也准确体现所属关系。
- source_word: deum
  choice: 上帝
  rationale: 对应拉丁文 deum，采用现代汉语中庄重且通行的称呼。
- source_word: filios
  choice: 儿子
  rationale: 拉丁文为阳性复数 filios，直译为“儿子”，并保留与“父亲”相对的父子意象及上下文的词汇联系。
- source_word: patrem
  choice: 父亲
  rationale: 与 filios 构成明确的父子关系；“父亲”自然、现代而庄重。
theological_decisions:
- issue: filios 的性别特指与群体涵盖范围
  choice: 正文译“儿子”
  alternative: 译“儿女”或“孩子”
  rationale: 原文明确使用阳性复数 filios；正文保留其形式和父子意象，同时以脚注提示较宽泛的可能表达，不据此推断或加入特定教义。
- issue: 问句语气
  choice: 以“不是吗？”收束
  alternative: 仅用问号，或译成陈述句
  rationale: 原文以问号呈现这一预期肯定回答的反问；“不是吗？”在现代汉语中能自然保留该语气。
translation_notes:
  register: 采用现代、庄重而易懂的盟约式措辞，并以分号呈现“子民—上帝”与“儿子—父亲”的平行结构。所给拉丁文本末尾的“Ita vos”是不完整的后续短语（“你们也这样……”），未纳入本节正文，以免把残缺的下一语段强行并入完整问句。
