  text: collegi ut gallina pullos suos sub alas suas. modo autem quid faciam uobis ? proiciam uos a facie mea. Oblationes mihi cum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/030.yaml
  text: Thus I gathered you as a hen gathers her chicks under her wings[a]. But now what shall I do with you? I will cast you out from before my face.
translation:
  language: zh_hans
  text: 我就是这样把你们聚集起来，如同母鸡把自己的雏鸡聚在翅膀下[a]。可是现在，我该拿你们怎么办呢？我要把你们从我面前赶走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我把你们聚集起来。”
    reason: “就是这样”对应前一节末尾、在拉丁文中跨越节界而修饰本节“聚集”的 Ita；也可按本节现存起首作较简略处理。
lexical_decisions:
- source_word: collegi
  choice: 聚集起来
  rationale: 准确表达将分散者招聚到一起的动作，也与母鸡聚拢雏鸡的比喻自然衔接。
- source_word: ut gallina pullos suos sub alas suas
  choice: 如同母鸡把自己的雏鸡聚在翅膀下
  rationale: 保留母鸡、自己的雏鸡和翅膀下三个意象要素；中文补出“聚”以清楚呈现拉丁文中由 collegi 延续到比较从句的动作。
- source_word: modo autem quid faciam uobis?
  choice: 可是现在，我该拿你们怎么办呢？
  rationale: 以现代自然的疑问句传达 modo autem 的转折和 quid faciam vobis 的措辞，不预先解释其修辞作用。
- source_word: proiciam uos a facie mea
  choice: 我要把你们从我面前赶走
  rationale: 保留“从我面前”这一带有临在与弃绝意味的空间表达；“赶走”自然传达 proiciam 的强烈排斥动作。
theological_decisions:
- issue: 聚集保护与随后弃绝之间的张力
  choice: 同时直译保留母鸡护雏的亲密意象和“从我面前赶走”的严厉宣告
  alternative: 将后句弱化为“我将离开你们”或解释为暂时管教
  rationale: 原文刻意并置招聚与弃绝，不应通过弱化或教义化释义消除这种张力。
- issue: 跨节连接词 ita 的体现
  choice: 译作“就是这样”
  alternative: 仅译“我把你们聚集起来”
  rationale: 本节开头 collegi 受前一节末尾 Ita uos 支配；“就是这样”恢复跨节句法联系，同时脚注提示较简略的译法。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“我该拿你们怎么办呢”保持口语可懂性，但整体语气仍符合审判宣告的严肃场景。未纳入末尾残留的“Oblationes mihi cum”，因其属于下一节开头。
