  text: 'Haec dicit dominus omnipotens : nonne ego uos rogaui ut pater filios et ut mater filias et nutrix paruulos suos,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/028.yaml
  text: 'Thus says the Lord Almighty: Have I not entreated you[a], as a father his sons, and as a mother her daughters, and a nurse her little children,'
translation:
  language: zh_hans
  text: 全能的主如此说：“我岂没有恳求你们[a]，如同父亲恳求自己的儿子、母亲恳求自己的女儿、乳母恳求她所乳养的幼儿吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我岂没有请求你们？”
    reason: 拉丁文 rogaui 可指请求、恳求；本句按上下文的郑重迫切语气译为“恳求”。后三个比较成分在原文中省略共同的谓语。
lexical_decisions:
- source_word: rogaui
  choice: 恳求
  rationale: 该词在这里不只是一般的询问或请求，而带有郑重、迫切劝求的意味；“恳求”符合上下文中父母般的深切呼唤。
- source_word: nutrix
  choice: 乳母
  rationale: 准确保留指乳养、照料幼儿之妇人的具体含义，也与父亲、母亲的家庭意象协调。
- source_word: paruulos suos
  choice: 自己乳养的孩子
  rationale: paruulos 指年幼的孩子，suos 表明与乳母的归属关系；补出“乳养的”使现代汉语读者清楚理解这里并非必指乳母亲生的孩子。
theological_decisions:
- issue: 三个亲子比喻是否共用“恳求”这一动作
  choice: 在三个比喻中都补出“恳求”
  alternative: 只在主句出现“恳求”，其后按拉丁文省略谓语，译作“如同父亲对儿子、母亲对女儿、乳母对自己乳养的孩子”
  rationale: 拉丁文后三项省略共同谓语；汉语若照样省略，会使关系含混。重复动词明确保留三重平行比喻，但不额外规定恳求的具体内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我岂没有……吗”保留原文反问语气；三项家庭意象保持平行。正文中的“自己乳养的孩子”用于避免把乳母与幼儿的关系误解为必然的亲生关系。
