  text: Filii Aaron ex tribu Leui, qui fuit captiuus in regione Medorum, in regno Artaxersis regis Persarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/003.yaml
  text: sons of Aaron[a], of the tribe of Levi, who were captives in the region of the Medes, in the reign of Artaxerxes king of the Persians.
translation:
  language: zh_hans
  text: 亚伦的子孙，出自利未支派；他们在波斯王亚达薛西统治期间，被囚在米底地区。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filii Aaron
  choice: 亚伦的子孙
  rationale: Filii为复数；在族谱和支派语境中指亚伦的后裔，译作“子孙”比直译“儿子们”自然且准确。
- source_word: ex tribu Leui
  choice: 出自利未支派
  rationale: 准确表达来源或归属关系，符合现代汉语经文语体。
- source_word: captiuus
  choice: 被囚
  rationale: 原文是系词fuit加表语captiuus，着重被掳后的受囚状态，而非被捕动作；“被囚”在汉语中简明表达这种身份和处境。
- source_word: in regione Medorum
  choice: 在米底地区
  rationale: Medorum为复数属格，字面是“米底人的”；按地理意义自然译为“米底地区”。
- source_word: in regno Artaxersis regis Persarum
  choice: 在波斯王亚达薛西统治期间
  rationale: 此处regnum结合人名表达君王在位或统治时期；将Persarum明确连于“波斯王”，避免生硬仿译。
theological_decisions:
- issue: 关系代词qui的数及所指
  choice: 按复数先行词Filii Aaron译为“他们”
  alternative: 按单数理解为某一位未明说的人物
  rationale: 现存拉丁文本中qui形式可兼容主格阳性单数与复数，但谓语fuit是单数，与复数Filii存在语法张力；然而经校订的咨询文本及上下文方案将整体理解为复数群体。中文采用复数以对应明确的Filii，同时不增添具体人物。
- issue: captiuus所表达的是状态还是事件
  choice: 表达受囚状态
  alternative: 译为“被掳去”或“被俘”以突出事件
  rationale: fuit captiuus是系词加表语，首先表示“是俘虏／处于被囚状态”，不宜默默改成一次性的被捕动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。用分号连接身份说明与历史处境，使这一节作为上一节人物介绍的延续仍然通顺。未设置脚注，因为中文正文已直接体现captiuus的状态义；原英文脚注所保留的“被掳”读法不如拉丁语法所支持的状态义准确。
