  text: 'Thus says the Lord Almighty: Your house is desolate. I will cast you out like stubble before the wind.'
translation:
  language: zh_hans
  text: 全能的主如此说：“你们的家已经荒凉；我要像风吹散秸秆一样把你们抛出去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deserta est
  choice: 已经荒凉
  rationale: 现存拉丁文开头仅保留词尾“serta est”，结合经审校的英文咨询文本可还原为“deserta est”，表达房屋被撇下、陷于荒凉的状态。
- source_word: proiciam uos
  choice: 我要把你们抛出去
  rationale: 保留第一人称将来时和强烈的驱逐意象，不弱化为一般的“赶走”。
- source_word: sicut uentus stipulam
  choice: 如同风吹走碎秸
  rationale: 按拉丁语直译其比喻结构；“碎秸”比“糠秕”更贴近 stipula（禾秆、残梗），并以“吹走”自然表达拉丁文省略而由语境带出的动作。
theological_decisions:
- issue: 说话者称号 Dominus omnipotens
  choice: 全能的主
  alternative: 全能的上主
  rationale: 采用现代普通读者熟悉且庄重的表达，不引入特定宗派用语。
- issue: 审判对象的集体性
  choice: 你们的家／你们
  alternative: 你的家／你
  rationale: proiciam uos 明确为复数；相应采用复数“你们”，保留对群体发言的语气。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号连接荒凉的宣告与随后的驱逐审判，保留原文简短有力的先知性语气。
