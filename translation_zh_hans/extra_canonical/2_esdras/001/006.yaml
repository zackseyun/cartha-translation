- from: 因为他们祖先的罪在他们身上日益加重；他们忘记了我，向别的神献祭。
  to: 因为他们祖先的罪在他们身上滋长；因为他们忘记了我，向别的神献祭。
  rationale: 以“滋长”替换“日益加重”，使译文更贴近 creuerunt 的增长含义，同时不把祖先之罪与后代的关系解释为特定教义上的罪责归算或单纯效法。补出第二个“因为”以反映 enim 的说明语气；其余措辞维持原稿。
