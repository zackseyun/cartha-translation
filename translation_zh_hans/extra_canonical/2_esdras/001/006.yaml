    issue: “日益加重”弱化了 creuerunt 的增长意象。
    rationale: 拉丁文 creuerunt 的基本意思是“长大、增长、增多”。“加重”容易理解为原有罪过变得更严重，或罪责加重；这比原文更具体。
  - severity: low
    issue: 第二个解释性连接词未在译文中明示。
    rationale: enim 与首句的 quia 一同构成连续的说明；补译“因为”能更完整呈现原句结构，且不造成汉语生硬。
  revised_text: 因为他们祖先的罪在他们身上滋长；因为他们忘记了我，向别的神献祭。
