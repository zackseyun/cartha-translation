review_pass:
  verdict: revise
  source_fidelity: “日益加重”将 creuerunt（增长、滋长、增多）的核心意象较明显地转为罪责或严重程度的“加重”。改为“滋长”可保留原文所说前代之罪在后代中延续、发展的表达，而不界定其具体机制。第二分句补出“因为”，对应 enim 的解释性语气。
  naturalness: 修订句保持现代汉语的庄重和通顺。“在他们身上滋长”虽稍具文学性，但在经文语体中自然，并比“在他们里面增长”更符合现代习惯。
  terminology: “祖先”“别的神”“献祭”均恰当。“祖先”在此保留 parentum 可涵盖前代的范围；“别的神”对应 diis alienis，避免无根据地限定为民族意义上的“外邦神”。
  issues:
