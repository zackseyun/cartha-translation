  text: 'Quia peccata parentum illorum in illis creuerunt: obliti enim me sacrificauerunt diis alienis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/006.yaml
  text: For the sins of their fathers have increased in them; for they forgot me and sacrificed to foreign gods.
translation:
  language: zh_hans
  text: 因为他们祖先的罪在他们身上滋长；因为他们忘记了我，向别的神献祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: peccata parentum illorum
  choice: 他们祖先的罪
  rationale: parentum 可指父母或祖先；在群体世代相承的语境中译作“祖先”自然，也保留前代之罪的含义。
- source_word: in illis creuerunt
  choice: 在他们身上日益加重
  rationale: 直译为“在他们里面增长了”；此处用“在他们身上日益加重”表达罪在后代中累积、扩大的意思，同时不明确断定具体的归罪机制。
- source_word: obliti enim me
  choice: 他们忘记了我
  rationale: 忠实对应拉丁文，保留说话者为上帝的第一人称。
- source_word: diis alienis
  choice: 别的神
  rationale: alienis 在此指不属于以色列所敬拜之上帝的其他神明；“别的神”比“外国的神”更符合现代汉语宗教语境。
- source_word: sacrificauerunt
  choice: 献祭
  rationale: 采用简洁、通行的礼仪用语，准确表达向神明奉献祭物的行为。
theological_decisions:
- issue: 祖先之罪与后代的关系
  choice: 译为“祖先的罪在他们身上日益加重”
  alternative: “他们祖先的罪在他们里面增长”
  rationale: 保留原文所呈现的跨世代延续和加增，同时避免额外解释为遗传罪责、单纯模仿或特定教义。
- issue: diis alienis 的神学指向
  choice: 译为“别的神”
  alternative: “外邦神”或“异神”
  rationale: “别的神”忠实而中性，不预先加入民族身份或关于这些神是否真实存在的解释。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文；分号保留原句前后因果解释的紧密联系。
