  text: 但你要对他们说：“主这样说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tu uero
  choice: 但你
  rationale: uero在这里是转折或强调性的承接词，不是表示因果的“所以”；“但你”既保留与上文的对比，也突出受命者。
- source_word: loquere ad eos dicens
  choice: 要对他们说
  rationale: 按现代汉语习惯合并“向他们讲话，说”，自然表达命令语气，同时不增添原文没有的内容。
- source_word: haec dicit dominus
  choice: 主这样说
  rationale: 保留先知宣告公式及其引出下文的功能；句末冒号对应后续信息。
theological_decisions:
- issue: 神谕引介公式的归属与分节
  choice: 将“主这样说”保留在本节
  alternative: 移至下一节或省略
  rationale: 拉丁文本明确在本节含有haec dicit dominus；保留于此符合原文句法和分节，不预先处理下一节内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但你”保留原文转折与强调；整句以未闭合的引号和冒号结束，表明主的话将在下一节继续。
