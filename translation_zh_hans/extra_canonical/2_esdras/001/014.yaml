  yaml_path: translation/extra_canonical/2_esdras/001/014.yaml
  text: I gave you Moses as a leader and Aaron as a priest. I provided you light by a pillar of fire, and I did great wonders among you.
translation:
  language: zh_hans
  text: 我把摩西赐给你们作领袖，把亚伦赐给你们作祭司；我借着火柱为你们提供亮光，并在你们中间行了伟大的奇事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ducem
  choice: 领袖
  rationale: 准确表达带领群体之人的含义，现代汉语自然庄重，且不额外限定为军事统帅。
- source_word: sacerdotem
  choice: 祭司
  rationale: 采用通行的圣经宗教职分用语，准确对应拉丁文。
- source_word: per columnam ignis
  choice: 借着火柱
  rationale: 保留工具或媒介关系，也保留“火柱”这一具体形象。
- source_word: Lucem … praestiti
  choice: 为你们提供亮光
  rationale: 体现 praestiti 的“供给、提供”之意，并避免与前两处“赐给”机械重复。
- source_word: magna mirabilia
  choice: 伟大的奇事
  rationale: 兼顾 magna 的程度和 mirabilia 的惊异、神奇含义，不把它过度专门化为某一神学术语。
- source_word: in
  choice: 在你们中间
  rationale: 现存引文止于介词 in，语句显然残缺；依英语审校层所保存的理解补足为“在你们中间”，使本节在汉语中完整可读。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前两分句用平行结构呈现摩西与亚伦的不同职分；后两分句保留“火柱”“奇事”等经文意象。源文本所引末尾仅见 in，疑因截取不全；正文依审校层作最低限度补足。
