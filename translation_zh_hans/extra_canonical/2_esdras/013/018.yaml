  text: understanding what is stored up in the last days and not encountering them[a]. But also those who are left behind
translation:
  language: zh_hans
  text: 他们明白为末后的日子所存留的事，却没有遇到这些事[a]；但也有那些被留下的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却没有达到这些事。”
    reason: occurrentes 的具体语义存在歧义；其他古代译本所反映的底本可能支持“达到”。
lexical_decisions:
- source_word: intellegentes
  choice: 明白
  rationale: 用现代汉语自然表达分词“领会、明白”的含义，并保留其与上下文主语的连接。
- source_word: reposita
  choice: 所存留的
  rationale: 对应“被储存、保留”的被动含义，不具体断定这些事是福是祸。
- source_word: in novissimis diebus
  choice: 末后的日子
  rationale: 保留末世语境中的传统圣经表达，同时使现代读者易懂。
- source_word: non occurrentes eis
  choice: 却没有经历这些事
  rationale: occurrentes eis 可指遇到、遭逢前述诸事；译作“经历”在汉语中较自然，并以“这些事”体现 eis 回指复数 quae。
- source_word: qui derelicti sunt
  choice: 那些被留下的人
  rationale: 保留 derelicti sunt 的被动形式及其未说明由谁留下、为何留下的含混性。
theological_decisions:
- issue: 末后所存留之事与人是否实际遭逢这些事
  choice: 却没有经历这些事
  alternative: 却没有达到这些事；却没有遇见这些事
  rationale: 拉丁语 occurrere 的语义可涵盖遇到、遭逢，也可能依潜在底本理解为达到。正文采用合乎此处事件语境的“经历”，脚注保留另一种可能。
- issue: “被留下”的价值判断
  choice: 那些被留下的人
  alternative: 那些剩余的人；那些被遗弃的人
  rationale: 不把该群体预先解释为得救的余民或遭弃绝者，维持原文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“末后的日子”保留经文语域；分号连接原文中语法上延续但语义转折的末句。
