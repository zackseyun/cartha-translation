  text: 即他们在自己的地方没有遵守的那些；但经由入口……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae
  choice: 那些
  rationale: 这是承接上文的关系代词；本节残片未明示先行词，因此不擅自补出“律例”等名词。
- source_word: seruantes
  choice: 遵守
  rationale: 拉丁文 servo 在此语境中指持守、遵行；译作“遵守”自然且不增加对象。
- source_word: in regione sua
  choice: 在自己的地方
  rationale: regio 可指地区、地域或国土；因上下文在本节所给材料中不完整，采用较宽泛的“地方”，保留范围上的不确定性。
- source_word: Per introitus autem
  choice: 但他们从入口……
  rationale: per 表示经由，introitus 为入口或通道；autem 译作“但”。原文止于未完成短语，以省略号表明句子延续。主语“他们”依汉语表达需要从上下文承接补出。
theological_decisions:
- issue: 关系代词 quae 的先行词
  choice: 不补明具体对象，仅译“那些”
  alternative: 补作“那些律例”或“那些规条”
  rationale: 现存本节拉丁文没有给出先行词；补出具体宗教或法律术语会消除原文残片保留的句法依赖并引入未经本节证实的解释。
- issue: 不完整句的处理
  choice: 保留“但他们从入口……”这一未完结构
  alternative: 依据后文或其他译本补全句意
  rationale: 提交的原文证据止于 Per introitus autem，故不以推测内容补足。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。由于经文片段从上文半句开始并在下文前中断，译文刻意保留这种不完整性；未使用脚注标记。
