  yaml_path: translation/extra_canonical/2_esdras/013/004.yaml
  text: And wherever a voice went out from his mouth[a], all who heard his voice burned[b], just as wax melts when it senses the fire.
translation:
  language: zh_hans
  text: 无论他口中发出的声音传到哪里，凡听见他的声音的人都燃烧起来，如同蜡一遇到火就熔化一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ubicumque exiebat vox de ore eius
  choice: 无论从他口中发出的声音传到哪里
  rationale: 按语境将无冠词的 vox 理解为从此人口中发出的声音，同时保留拉丁文 ubicumque 所表达的范围意义。
- source_word: ardescebant
  choice: 燃烧起来
  rationale: ardescebant 是 ardesco 的未完成过去时主动形式，带有起始义，表示“开始燃烧、烧起来”，不译成被动的“被点燃”。
- source_word: sicut liquescit cera quando senserit ignem
  choice: 如同蜡遇到火就熔化一样
  rationale: senserit ignem 直译为“感受到火”在现代汉语中生硬；“遇到火”自然表达蜡接触或感受到火势后熔化的比喻。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“燃烧起来”保留主动、起始性动作，并使后半句蜡熔化的比喻自然清楚。
