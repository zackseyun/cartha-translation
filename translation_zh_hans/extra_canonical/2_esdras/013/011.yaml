source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multitudo tempestatis. Et concidit super multitudinis impetum quod paratum erat pugnare, et succendit omnes, ut subito nihil uideretur de innumerabili multitudine nisi solummodo puluis cineris et fumi odor. et uidi et extiti. Et post haec uidi ipsum hominem descendentem de monte et aduocantem ad se multitudinem aliam pacificam. Et accedebant ad eum uultus hominum multorum, quorundam gaudentium, quorundam tristantium, aliqui uero alligati, aliqui adducentes ex eis qui offerebantur. et ego a multitudine pauoris expergefactus sum et deprecatus sum altissimum et dixi : Tu ab initio demonstrasti seruo tuo mirabilia haec, et dignum me habuisti ut susciperes deprecationem meam; Et nunc demonstra mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/011.yaml
  text: And all these were mixed together—the wave of fire, the breath of flame, and the great storm—and it fell upon the assault of the multitude that had prepared to fight, and burned them all up, so that suddenly nothing could be seen of the innumerable multitude except only the dust of ashes and the smell of smoke. And I saw it and was astonished.
translation:
  language: zh_hans
  text: 这一切混合在一起——火焰的洪流、火焰的气息和巨大的风暴——便落在那群准备作战之人的进攻上，把他们全都烧尽。顷刻之间，在那无数的人群中，除了灰烬的尘埃和烟的气味，什么也看不见。我看见了，就惊愕不已。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multitudo tempestatis
  choice: 猛烈的风暴
  rationale: multitudo 在此表达风暴的浩大、强烈；结合上文并参考经审校的英文层，以自然汉语呈现为“猛烈的风暴”。
- source_word: concidit super multitudinis impetum
  choice: 冲向……大军
  rationale: 字面涉及“落在／袭向群众的攻势”；此处描写异象中的烈焰与风暴迎击来犯者，“冲向”既保留猛烈动态，也符合现代汉语。
- source_word: quod paratum erat pugnare
  choice: 那已准备交战的
  rationale: 保留关系从句的备战含义，不额外断定其战争性质或道德身份。
- source_word: succendit omnes
  choice: 把他们全都烧尽
  rationale: succendere 表示点燃、焚烧；上下文说其后只余灰尘和烟味，因此译作“烧尽”最为贴切。
- source_word: puluis cineris
  choice: 灰尘
  rationale: 该短语可直译为“灰烬的尘土”；现代汉语用“灰尘”简洁表达焚烧后残留的灰末。
- source_word: fumi odor
  choice: 烟味
  rationale: 直译为“烟的气味”，用“烟味”自然、准确。
- source_word: extiti
  choice: 惊愕不已
  rationale: 此处拉丁词形在传本语境中表达强烈反应；参考英文审校层的 astonished，以“惊愕不已”呈现异象带来的震撼。
theological_decisions:
- issue: 异象中施行毁灭者的身份与行动方式
  choice: 维持异象本身的描写，不补称为弥赛亚、审判者或神迹
  alternative: 明确解释为某一特定末世人物施行神圣审判
  rationale: 本节只描写火焰、气息和风暴焚尽大军；译文不应把后文解释或特定神学体系提前写入正文。
- issue: “大军”的道德定性
  choice: 仅称“已准备交战的大军”
  alternative: 译作“邪恶的敌军”或“反叛者”
  rationale: 原文说明其准备作战，却未在本句直接使用“邪恶”等定性词，故保留原有张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。开头依照紧接上文的列举关系和经审校英文咨询层补足“这一切汇合在一起”，使残缺起首在中文中可读；破折号保留异象三重景象的并列力度。句式由长句适度拆分，以符合普通读者阅读习惯，同时保持末世异象的急迫感与视觉冲击。
