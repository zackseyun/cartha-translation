revisions:
- from: 这一切汇合在一起——火焰的洪流、燃烧的气息和猛烈的风暴——冲向那已准备交战的大军，把他们全都烧尽。顷刻之间，那数不清的大军便消失无踪，只剩下灰尘和烟味。我看见这一切，惊愕不已。
  to: 这一切混合在一起——火焰的洪流、火焰的气息和巨大的风暴——便落在那群准备作战之人的进攻上，把他们全都烧尽。顷刻之间，在那无数的人群中，除了灰烬的尘埃和烟的气味，什么也看不见。我看见了，就惊愕不已。
  rationale: 修订恢复“落在……的进攻上”的句法与动作关系，避免把来战者泛化为“大军”而遗漏其攻势；并以“灰烬的尘埃”保留 puluis cineris 的具体残余意象。其余措辞遵循英文审校层，同时不对异象人物或事件作神学性补充。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:08:08Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了火焰、气息、风暴焚毁来战者，以及灰烬与烟味的异象图景；但“冲向那已准备交战的大军”将 concidit super…impetum（落在／临到……的进攻上）改成了向大军冲去，并弱化了 impetum 的“进攻”语义。pulvis cineris 也不宜简化为通常指尘土的“灰尘”，应明确为灰烬的尘埃。
  naturalness: 现有中文庄重流畅。修订版以“混合在一起”对应英文审校层的 mixed together，并用“那群准备作战之人的进攻”自然地表达拉丁文的结构；“灰烬的尘埃”和“烟的气味”清楚保留原文的两个仅存可见／可感的残余。
  terminology: 不加入对“人”身份、军队道德属性或审判性质的解释。“火焰的洪流、火焰的气息和巨大的风暴”保留异象性并列，也更贴合英文审校层的 wave of fire, breath of flame, and great storm。
  issues:
  - severity: medium
    issue: “冲向那已准备交战的大军”未充分反映 concidit super multitudinis impetum。
    rationale: 原文及英文审校层均明确说这混合之物“落在／临到”准备作战之众人的“进攻（assault）”上；“冲向”改变动作方向，而“大军”没有表达其正在发动的攻势。
  - severity: low
    issue: “灰尘”过度简化 puluis cineris。
    rationale: 该短语是“灰烬的尘埃／灰烬之尘”，不是一般的尘土；应保留焚烧后留下灰烬的意象。
  - severity: low
    issue: “猛烈的风暴”略偏离英文审校层的 great storm。
    rationale: “巨大的风暴”更直接对应 great，并仍可传达异象规模；不必额外强调风暴的烈度。
  revised_text: 这一切混合在一起——火焰的洪流、火焰的气息和巨大的风暴——便落在那群准备作战之人的进攻上，把他们全都烧尽。顷刻之间，在那无数的人群中，除了灰烬的尘埃和烟的气味，什么也看不见。我看见了，就惊愕不已。
