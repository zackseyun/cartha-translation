  text: Again the Most High will hold back the channels of the river, so that they may cross. Therefore you saw the multitude gathered in peace.
translation:
  language: zh_hans
  text: 因此，你看见一大群人平安地聚集在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: 因此
  rationale: 准确表达承接前文原因并引出所见异象含义的因果关系。
- source_word: multitudinem
  choice: 那群人
  rationale: 指异象中已出现的特定群体；“那群人”比“群众”更自然，也保留集体含义。
- source_word: collectam
  choice: 聚集在一起
  rationale: 对应完成被动分词，表达这群人已经被聚拢的状态，不额外指明聚集者。
- source_word: cum pace
  choice: 平安地
  rationale: 保留拉丁文“带着平安／在平安中”的语义范围，以自然汉语表达其和平、安然聚集的状态。
theological_decisions:
- issue: 是否补入英文咨询文本中的河道受阻与渡河内容
  choice: 不补入，仅翻译本节所给拉丁文的完整句子
  alternative: 译作“至高者又要拦住河流的水道，使他们可以渡过。因此，你看见那群人平安地聚集在一起。”
  rationale: 所给拉丁文本本节仅含“propter hoc uidisti multitudinem collectam cum pace”；英文前半句看来来自紧邻上文或不同分节。以原文证据优先，避免把本节之外的材料并入正文。
- issue: cum pace所描述的是和平关系还是安然状态
  choice: 用“平安地”保留两者之间的开放性
  alternative: “和平地”或“安然地”
  rationale: “平安地”既可指没有冲突，也可指安稳无虞，不将原文的语义张力限缩为单一解释。
translation_notes:
  register: 采用现代、简洁而庄重的叙述语体。所给拉丁文末尾的“Sed et qui”显然开启下一句且在此截断，因此未纳入本节译文；正文无需脚注标记。
