  yaml_path: translation/extra_canonical/2_esdras/013/048.yaml
  text: But those of your people who are left[a], who are found within my holy border, shall be saved.
translation:
  language: zh_hans
  text: 但你百姓中余下的，就是那些在我圣洁疆界以内被寻见的人，必蒙拯救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在这里残缺，没有保留本句的谓语；叙利亚文作“必存活”，埃塞俄比亚文和阿拉伯文作“必蒙拯救”。
    reason: 说明正文补足“必蒙拯救”的文本依据，并保留古代译本之间的差异。
lexical_decisions:
- source_word: derelicti sunt de populo tuo
  choice: 你百姓中余下的
  rationale: derelicti 在此指灾变后留下、幸存的人；译作“余下的”既贴近原文，也保留末世余民的语境。
- source_word: qui inueniuntur
  choice: 被寻见的人
  rationale: 保留拉丁文被动形式及其判定意味，不简化为单纯的“住在”。
- source_word: intra terminum meum Sanctum
  choice: 在我圣洁疆界以内
  rationale: terminus 可指边界或所界定的地域；“疆界以内”自然表达空间范围，同时保留边界意象。
- source_word: erit ergo, quando incipiet perdere multitu-
  choice: 必蒙拯救
  rationale: 现存拉丁文本在此残缺，下一分句也被截断；依据叙利亚文“必存活”及埃塞俄比亚文、阿拉伯文“必得救”的旁证，补出本节主句。
theological_decisions:
- issue: 残缺拉丁文本中缺失的谓语
  choice: 正文译作“必蒙拯救”
  alternative: “必存活”或保留悬句
  rationale: 拉丁传本缺少主句谓语，显然属于文本残缺；古代译本共同见证正面结局，但在“存活／得救”之间有差异。正文采用多种旁证支持的“蒙拯救”，脚注说明异文，避免把传抄残缺误当作作者有意留下的悬句。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“圣洁疆界”保留原文的神圣领域与边界意象；句法略作顺整，使双重关系从句在中文中清楚自然。
