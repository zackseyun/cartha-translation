  text: 'For this is the interpretation of the vision: because you saw a man coming up from the heart of the sea,[a]'
translation:
  language: zh_hans
  text: 原来，这异象的解释是：你看见一个男子从海的中心升上来，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这异象的解释是：你看见一个男子从海的中心升上来。”
    reason: enim 通常是解释性的“因为／原来”；在汉语中可不明译该连接词，直接引出解释。
lexical_decisions:
- source_word: interpretatio enim visionis haec
  choice: 因为这异象的解释是这样
  rationale: 将后置的 enim 译为“因为”，保留其承接上下文、引出说明的作用；haec 译为“是这样”，自然引出后文。
- source_word: virum
  choice: 一个人
  rationale: 拉丁文 virum 在此指异象中所见的一名男子；现代汉语用“一个人”自然且不预先加入身份解释。
- source_word: ascendentem
  choice: 升上来
  rationale: 保留从海中向上出现的动态含义，并避免仅译作静态的“出现”。
- source_word: de corde maris
  choice: 从海心
  rationale: 直译 corde maris 的形象性表达；“海心”在庄重语体中可理解为海的深处或中央，同时不消解原文意象。
theological_decisions:
- issue: 异象中人物的身份
  choice: 一个人
  alternative: 那人／一位男子
  rationale: 本节只描述所见形象，并未在此直接确认其神学身份，因此不加入“弥赛亚”等解释性称谓。
- issue: quia 与前句的逻辑关系
  choice: 你看见
  alternative: 至于你看见／因为你看见
  rationale: 保留 quia 的表层因果结构，由句首“因为”统摄全句；不将其改写成纯话题结构，以免弱化原文逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“海心”保留拉丁文的鲜明意象；句法尽量贴近原文，同时避免生硬欧化。
