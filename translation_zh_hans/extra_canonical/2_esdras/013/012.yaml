  text: et post haec vidi ipsum hominem descendentem de monte et advocantem ad se multitudinem aliam pacificam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/012.yaml
  text: And after this I saw that man coming down from the mountain and calling to himself another peaceful multitude[a].
translation:
  language: zh_hans
  text: 此后，我又看见那人从山上下来，把另一群和平的人召到自己跟前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“接着，我看见……”。
    reason: 句首 et post haec 可按汉语叙事习惯译为“此后，我又”，也可译为“接着”；脚注保留连接语气的另一种自然表达。
lexical_decisions:
- source_word: et post haec
  choice: 此后，我又
  rationale: “此后”表达时间推进，“又”承接句首 et，保留原文连续叙述的语气，同时符合现代汉语表达。
- source_word: ipsum hominem
  choice: 那人
  rationale: ipsum 在此指回前文已经出现的人物；译作“那人”即可自然体现指称，不额外加入原文未明确强调的“同一个”。
- source_word: descendentem de monte
  choice: 从山上下来
  rationale: 直接表达从山而下的动作，语序自然。
- source_word: advocantem ad se
  choice: 召到自己跟前
  rationale: 既保留“召唤”的主动含义，也明确 ad se 所表示的朝向。
- source_word: multitudinem aliam pacificam
  choice: 另一群和平的人
  rationale: 保留 aliam 的“另一群”和 pacificam 的“和平”含义；以“人”承接集合名词 multitudo，使中文自然清楚。
theological_decisions:
- issue: pacificam 所描述的是群体的和平性质，但原文未进一步说明其具体含义
  choice: 和平的人
  alternative: 爱好和平的人／安然无争的人
  rationale: 采用较为中性、贴近字面的译法，不把该词限定为个人品格、政治立场或无争状态，从而保留原文的解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“召到自己跟前”比生硬的“召向自己”更自然，同时准确表达方向；整体保留原文简洁的并列推进结构。
