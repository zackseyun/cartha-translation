source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et post haec vidi, et ecce omnes, qui congregati sunt ad eum ut expugnarent eum, timebant valde, tamen audebant pugnare.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/008.yaml
  text: And after this I looked, and behold, all those who had gathered against him to attack him were greatly afraid, yet they still dared to fight.
translation:
  language: zh_hans
  text: 此后，我看见：看哪，所有聚集来攻击他的人都非常害怕，却仍敢于交战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et post haec vidi
  choice: 此后，我观看
  rationale: 保留叙事异象中“此后”与“我看见/观看”的推进公式；“观看”在现代汉语中自然且庄重。
- source_word: et ecce
  choice: 看哪
  rationale: 保留拉丁文提示读者注意异象中新景象的语气，而不弱化为普通连接词。
- source_word: omnes, qui congregati sunt ad eum ut expugnarent eum
  choice: 所有聚集起来要攻打他的人
  rationale: 将目的从句自然嵌入汉语；“攻打”准确表达 expugnare 的敌对军事行动。
- source_word: timebant valde
  choice: 都非常害怕
  rationale: 直接传达强烈恐惧，并用“都”呼应 omnes。
- source_word: tamen audebant pugnare
  choice: 却仍敢交战
  rationale: 保留 tamen 所形成的反差以及 audebant 的“敢于”意味；“交战”符合群体军事场景。
theological_decisions:
- issue: 敌对者的恐惧与继续作战之间的张力
  choice: “都非常害怕，却仍敢交战”
  alternative: “虽极其惧怕，仍然开战”
  rationale: 原文同时陈述强烈恐惧和仍敢战斗，不解释其动机，也不消除这种叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留异象文学的“看哪”和原文简洁有力的转折结构。
