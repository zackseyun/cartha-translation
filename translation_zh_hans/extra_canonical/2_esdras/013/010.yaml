  text: but I only saw how he sent out from his mouth like a wave of fire, and from his lips a breath of flame, and from his tongue he shot out sparks of storm.
translation:
  language: zh_hans
  text: 但我只看见他从口中发出如同火浪一般的东西，从嘴唇吐出火焰之气，又从舌头射出暴风的火星。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sicut fluctum ignis
  choice: 仿佛火浪的气流
  rationale: 保留 sicut 的明喻性质和 fluctus ignis 的火浪意象；补出“气流”使“喷出仿佛火浪”在现代汉语中句法完整，但不把该意象解释成具体兵器。
- source_word: spiritum flammae
  choice: 火焰之气
  rationale: spiritus 在此可指气息、风或灵；“气”既符合从嘴唇发出的画面，也尽量保留原词的开放性。
- source_word: scintillas tempestatis
  choice: 暴风的火星
  rationale: 按原文保留“火星”与“暴风”之间奇特而富张力的组合，不擅自改释为雷电、冰雹或武器。
- source_word: emittit / emittebat
  choice: 喷出／吐出／射出
  rationale: 根据口、嘴唇、舌头三个并列意象采用自然且有区别的现代汉语动词，同时共同表达 emitto 的发出、放出之意。
theological_decisions:
- issue: spiritum 是否应明确译作“灵”
  choice: 译为“气”
  alternative: 火焰之灵／火焰的气息
  rationale: 语境描绘从嘴唇发出的烈焰气流，译作“气”最自然；同时“气”不像“气息”那样过度具象，也避免无充分依据地将其人格化或神学化。
- issue: 异象中的三种现象是否应解释为超自然兵器
  choice: 保留火浪、火焰之气和暴风火星的原始意象
  alternative: 译成火焰武器、雷电或审判之力
  rationale: 原文只陈述所见异象，没有在本节内解释其象征意义，因此不把解释写进正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，维持异象文学的强烈画面感与三重并列结构。以“但我只看见”承接前文的否定对比；不纳入所给拉丁文本开头残留的“aliquod uas bellicosum”，因该短语在句法上属于前接内容，而本节对应正文从 nisi solummodo uidi 起译。
