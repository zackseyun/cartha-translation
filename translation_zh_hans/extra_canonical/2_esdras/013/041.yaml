review_pass:
  verdict: revise
  source_fidelity: 译文保留了计划、离开、迁往无人居住之地及遵守本身律例的目的。惟“列国的人群”较易理解为各国中的一群人，未充分表达 multitudo gentium 的“众多民族／列国众民”；“地方”也比 regio 的“地区”略弱。
  naturalness: 整体庄重通顺。“从未有人类居住”可以理解，但“从来没有人类居住过”更合现代汉语习惯；以分号连接地点说明与目的，结构更清晰。
  terminology: “律例”适切对应 legitima，保留法律及经文语域，不把它限定为特定宗派意义。“至少”可保留 vel 的退让性语气。
  issues:
  - severity: medium
    issue: “列国的人群”对 multitudinem gentium 的表达不够准确。
    rationale: 原文指“众多民族／列国的众民”，而非主要指一群人的聚集；改为“列国的众民”可保留 gentium 的民族、列国含义。
  - severity: low
    issue: “更遥远的地方”及“从未有人类居住”可稍作调整。
    rationale: regio 更接近“地区”；“从来没有人类居住过”是更自然的现代汉语，同时不改变 genus humanum 的普遍范围。
  revised_text: 他们彼此商定了这个计划：离开列国的众民，前往更遥远的地区；那里从来没有人类居住过，为要至少能在那里遵守自己的律例。
