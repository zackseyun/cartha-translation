  text: consilium hoc, ut derelinquerent multitudinem gentium, et proficiscerentur in ulteriorem regionem, ubi nunquam inhabitauit genus humanum, Vt uel ibi obseruarent legitima sua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/041.yaml
  text: But they formed this plan among themselves, that they would leave the multitude of the nations and go on into a more distant region, where no human race had ever lived, so that there they might keep their statutes,
translation:
  language: zh_hans
  text: 他们彼此商定了这个计划：离开列国的众民，前往更遥远的地区；那里从来没有人类居住过，为要至少能在那里遵守自己的律例。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: consilium hoc
  choice: 这个计划
  rationale: 按上下文译为具体的谋划；“计划”自然清楚，又保留原文的中性语气。
- source_word: multitudinem gentium
  choice: 列国的人群
  rationale: 兼顾 multitudo 的群体含义和 gentes 的“列国／各民族”含义，避免误译成单一国家。
- source_word: in ulteriorem regionem
  choice: 前往更遥远的地方
  rationale: ulterior 表示更远、远方；“地方”符合普通现代汉语，也不额外限定其政治或地理性质。
- source_word: ubi nunquam inhabitauit genus humanum
  choice: 那里从未有人类居住
  rationale: 贴近拉丁文的普遍表述 genus humanum，并以自然汉语表达无人居住之意。
- source_word: Vt uel ibi obseruarent legitima sua
  choice: 好让他们至少可以在那里遵守自己的律例
  rationale: 保留目的从句；uel 在此可表达退让或最低限度的“至少”，legitima 指其应守的条例、律例。
theological_decisions:
- issue: legitima sua 的宗教法律色彩
  choice: 自己的律例
  alternative: 自己的规条／法令
  rationale: “律例”保留经文语域及宗教法律色彩，但不进一步指定为某一套具名律法。
- issue: uel 的语气
  choice: 至少
  alternative: 就／也许
  rationale: 在“离开列国、迁往无人之地”的语境中，uel ibi 最自然地呈现“至少在那里”的最低限度或退让语气；同时不将其解释为确定的神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句式紧贴拉丁文的计划—行动—地点—目的结构，同时避免生硬直译。
