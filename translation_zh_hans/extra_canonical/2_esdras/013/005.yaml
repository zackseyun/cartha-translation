source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi post haec, et ecce congregabatur multitudo hominum, quorum non erat numerus, de quattuor ventis caeli, ut debellarent hominem qui ascenderat de mari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/005.yaml
  text: And after this I looked, and behold, a multitude of men was gathering, whose number was beyond counting, from the four winds of heaven, to make war against the man who had come up from the sea.
translation:
  language: zh_hans
  text: 此后，我观看，看哪，有一大群人，数不胜数，从天的四方聚集而来，要与那从海里上来的人交战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et vidi post haec
  choice: 此后，我观看
  rationale: 保留异象叙事中“此后”与“我观看”的先后结构；“观看”比普通的“看见”更符合庄重的启示文学语体。
- source_word: et ecce
  choice: 看哪
  rationale: 保留拉丁文提示读者注意异象新景象的标记，并沿用中文圣经文学中自然、庄重的表达。
- source_word: multitudo hominum, quorum non erat numerus
  choice: 一大群人数不胜数的人
  rationale: 表达群体庞大且无法计数，不把它误解为绝对没有数目；措辞兼顾原文结构与现代中文可读性。
- source_word: de quattuor ventis caeli
  choice: 从天的四方
  rationale: 原文直译为“从天的四风”；该习语指四个方位。正文采用现代中文更易理解的“天的四方”，同时保留宇宙性的意象。
- source_word: ut debellarent
  choice: 要……交战
  rationale: 表示聚集的目的，即发动战争或作战；“交战”在中文中庄重自然，且不预先断定胜负。
- source_word: hominem qui ascenderat de mari
  choice: 那从海里上来的人
  rationale: 紧贴关系从句与完成动作的含义，保留“人”这一称谓，不作弥赛亚身份等解释性增补。
theological_decisions:
- issue: “从海里上来的人”的身份
  choice: 仅按原文译作“那从海里上来的人”
  alternative: 解释为某一特定的弥赛亚或末世人物
  rationale: 本节本身只称其为“人”，翻译不应把上下文可能引出的神学身份直接写入正文。
- issue: 聚集者行动的结果
  choice: 译作“要与……交战”，只陈述目的
  alternative: 译作“要击败”或“要征服”
  rationale: ut debellarent 在此说明其敌对目的；为避免暗示他们必然得胜，采用结果中性的“交战”。
translation_notes:
  register: 采用现代、庄重而清楚的异象文学语体。“看哪”保留启示性叙述的强调效果；整体语序略作中文化处理，使“从天的四方聚集而来”自然连贯，同时忠实呈现人数无法计数、聚集来源及交战目的。
