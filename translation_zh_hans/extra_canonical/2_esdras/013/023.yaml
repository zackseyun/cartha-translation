  text: qui adferet periculum in illo tempore, ipse custodibit qui in periculo inciderint, qui habent operas et fidem ad Fortissimum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/023.yaml
  text: he who brings the danger at that time will himself protect those who fall into danger[a], those who have works and faith toward the Most Mighty.
translation:
  language: zh_hans
  text: 那时带来危难的那一位，必亲自保护陷入危难的人；这些人有行为，也信靠至强者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “至强者”原文是最高级形式，也可译作“最强者”。
    reason: 说明Fortissimum的最高级语义及其作为神圣称号的用法，避免弱化为一般的“大能者”。
lexical_decisions:
- source_word: adferet periculum
  choice: 带来危难
  rationale: 保留拉丁文“带来危险、危难”的主动表达；“危难”比单纯“危险”更符合此处末世性困境的语境。
- source_word: custodibit
  choice: 保护
  rationale: 该词基本义为看守、守护；此处对象是陷入危难的人，译作“保护”自然且准确。
- source_word: operas
  choice: 行为
  rationale: 保留“行为、作为”的宽泛含义，不擅自添加“善”或限定其功德性质。
- source_word: fidem ad Fortissimum
  choice: 信靠至强者
  rationale: 将指向神的fides自然译为“信靠”；Fortissimum是最高级形式且在此名词化作神的称号，故译“至强者”，保留其最高级力度。
theological_decisions:
- issue: 行为与信心的并列
  choice: 这些人有行为，也信靠至强者
  alternative: 这些人凭行为和信心归向至强者
  rationale: 按原文保留operas与fidem并列，不说明二者如何使人蒙保护，也不引入“凭……得救”等原文未明说的因果或工具关系。
- issue: 带来危难者同时施行保护
  choice: 那时带来危难的那一位，必亲自保护
  alternative: 那时使危难临到的那一位，也必保护
  rationale: 保留原文由同一主体带来危难并亲自保护的神学张力，不把“带来”弱化为仅仅允许，也不解释危难的性质。
translation_notes:
  register: 采用庄重而现代的叙述语体。“那一位”体现原文关系代词所指主体的特殊身份；分号清楚连接受保护者及其特征，同时避免冗长欧化句。
