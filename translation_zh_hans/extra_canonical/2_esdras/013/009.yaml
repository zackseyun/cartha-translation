  yaml_path: translation/extra_canonical/2_esdras/013/009.yaml
  text: And behold, when he saw the assault of the coming multitude, he did not lift his hand, nor did he hold a spear, nor any weapon of war;
translation:
  language: zh_hans
  text: 看哪，当他看见那正在逼近的群众发起猛攻时，他没有举起手，也没有手持长矛或任何作战的兵器；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et ecce
  choice: 看哪
  rationale: 保留叙事中引人注意的提示语，同时采用庄重而自然的现代汉语表达。
- source_word: impetum multitudinis uenientis
  choice: 那涌来的群众攻上前来
  rationale: impetus 表示冲击、猛攻；multitudinis uenientis 表示正在到来的群众。译文兼顾群众涌来与发动攻击两层意思，避免只译成中性的“来到”。
- source_word: non leuauit manum suam
  choice: 却没有举起手
  rationale: 贴近拉丁文措辞，不擅自补明举手的目的或方式。
- source_word: frameam
  choice: 长矛
  rationale: framea 可指矛、枪一类兵器；依英语审校层并结合此处战争语境译为“长矛”。
- source_word: neque
  choice: 也没有……或任何……
  rationale: 按汉语习惯呈现连续否定，并保留原文列举兵器的节奏。
theological_decisions:
- issue: 他没有举手的含义
  choice: 直译为“没有举起手”
  alternative: 解释为“没有出手”或“没有举手攻击”
  rationale: 原文没有说明举手是为攻击、施行神迹还是采取其他行动，因此保留其开放性。
- issue: 句末是否补入“任何作战的兵器”
  choice: 依据经审校的英语咨询层保留该短语
  alternative: 仅止于“也没有拿着长矛”
  rationale: 所给拉丁文本在 neque 处截断，显然跨越经节边界；英语审校层保存了续接语义。译文据此完整呈现本节，同时不添加特定神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“涌来的群众攻上前来”较自然地传达来势与攻击性；分号保留本节未完待续的句法感觉。
