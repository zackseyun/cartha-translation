  naturalness: 修订后以“这位就是……”和“在许多时代中一直保全”的表达保留庄重语体，也更符合现代汉语的时间关系。“那些余留下来的人”通顺且保留原文未明说其身份的余地。
  terminology: “至高者”“解救”“亲自”“引导”均适切。“他的受造物”对应 creaturam suam，不将其预先限定为“万物”或特定神学术语。
