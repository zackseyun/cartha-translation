source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ipse est quem conservat Altissimus multis temporibus, qui per semet ipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/026.yaml
  text: This is he whom the Most High has kept for many ages, who will by himself deliver his creation, and he himself will direct those who are left.
translation:
  language: zh_hans
  text: 这位就是至高者在许多时代中一直保全的那一位；他要亲自解救他的受造物，也要亲自引导那些余留下来的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conservat
  choice: 保存了
  rationale: 拉丁文形式虽可按现在时理解，但在此与“许多世代”连用，表达至高者长期保留、护存此人的行动；译作“保存了”自然体现截至叙述时点的完成状态，同时不额外引入隐藏或保护等限定含义。
- source_word: multis temporibus
  choice: 许多世代
  rationale: 直义为“许多时期/时代”。上下文涉及长久等待与末后人物，“许多世代”既符合时间跨度，也比“许多岁月”更庄重。
- source_word: per semet ipsum
  choice: 亲自
  rationale: 强调由他自己施行拯救，不借他者；“亲自”以自然现代汉语保留反身强调。
- source_word: liberabit
  choice: 解救
  rationale: 保留从困境或辖制中释放的基本意义，不预先把此处限定为某一套系统神学意义上的“救赎”。
- source_word: creaturam suam
  choice: 自己所造的万物
  rationale: creatura 可指受造物或受造界；“所造的万物”在中文中自然，并保留其集合性与较宽广的指涉。
- source_word: disponet
  choice: 引导
  rationale: 该词可有安排、整顿、治理或引导之意；依英语审校层的 direct 并结合人的宾语，选择“引导”，同时不扩写具体方式。
- source_word: qui derelicti sunt
  choice: 那些余留下来的人
  rationale: 按被动完成结构直译其“被留下/剩下”的状态；“余留下来的人”保留末后幸存者或余民的可能指向，而不直接采用带较强神学标签的“余民”。
theological_decisions:
- issue: “他”与“自己所造的万物”之间的创造者关系
  choice: 保留原文表层语法，译为“自己所造的万物”
  alternative: 译为“他的受造物”，弱化直接创造主体
  rationale: 拉丁文 creaturam suam 直指“他的受造物/他所造的”，而句中最近的主语是这位被保存者。译文不为消除潜在的基督论张力而改换所有关系或另加解释。
- issue: “那些余留下来的人”的身份
  choice: 采用描述性译法，不明定其为某特定群体
  alternative: 译为“余民”或“幸存者”
  rationale: 原文只说“被留下的人”；“余民”可能导入特定圣经神学术语，“幸存者”则增添从灾难中存活的明确含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号划分身份说明与两项将来行动，使长句层次清楚；重复“亲自”以保存原文两处 ipse/反身强调。
