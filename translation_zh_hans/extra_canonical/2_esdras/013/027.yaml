  text: et quoniam vidisti de ore eius exire ut spiritum et ignem et tempestatem,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/027.yaml
  text: And because you saw breath and fire and storm coming out from his mouth,[a]
translation:
  language: zh_hans
  text: 又因你看见仿佛有气息、火焰和风暴从他口中发出，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”也可译作“风”或“灵”；“仿佛”保留原文的比较表达。
    reason: 说明 spiritum 的词义范围，并说明 ut 所表达的异象性相似，而不改变正文的自然语序。
lexical_decisions:
- source_word: quoniam
  choice: 至于
  rationale: 本节处于异象解释之中，这里引出对先前所见事项的说明；译作“至于”比孤立的“因为”更符合汉语衔接，同时不预先补出后文解释。
- source_word: ut
  choice: 仿佛
  rationale: 保留拉丁文表示相似或异象表象的比较成分，避免将所见直接等同于这些事物。
- source_word: spiritum
  choice: 气息
  rationale: 该词可指气息、风或灵；从口中发出且与火焰、风暴并列时，“气息”最贴合意象，但以脚注保留其他可能。
- source_word: ignem
  choice: 火焰
  rationale: 自然呈现从口中发出的可见毁灭性形象，语体庄重而通顺。
- source_word: tempestatem
  choice: 风暴
  rationale: 准确表达猛烈的暴风或风暴，保留异象的强烈意象。
- source_word: de ore eius exire
  choice: 从他口中发出
  rationale: 按原文保留来源与运动方向；“发出”在现代汉语中比“出来”更适合庄重的异象叙述。
theological_decisions:
- issue: spiritum 是否应作人格性的“灵”
  choice: 正文译作“气息”
  alternative: “灵”或“风”
  rationale: 上下文描绘从口中发出的力量，并与火焰和风暴并列，因此不宜在正文中径直赋予人格性或神学意义；脚注保留词义开放性。
- issue: ut 的异象性比较是否保留
  choice: 以“仿佛……的东西”明示
  alternative: 省略比较词，直译为“气息、火焰和风暴”
  rationale: 原文明确含 ut；保留它可避免把异象中的相似形态无条件实化。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“至于你看见……”适合作为异象解释中的承接句；“仿佛……的东西”虽略作显化，却自然保留拉丁文 ut 的比较意义。
