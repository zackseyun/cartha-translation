  yaml_path: translation/extra_canonical/2_esdras/013/055.yaml
  text: For you have ordered your life in wisdom, and have called understanding your mother.
translation:
  language: zh_hans
  text: 因为你以智慧安排了自己的一生，并称悟性为你的母亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vitam enim tuam disposuisti
  choice: 因为你……安排了自己的一生
  rationale: 保留 enim 的因果承接，并以自然汉语表达 disponere vitam，即有意识地规划、整顿自己的生活。
- source_word: in sapientiam
  choice: 以智慧
  rationale: 拉丁文介词结构在此表示生活安排所遵循的智慧取向；译作“以智慧”简洁自然，也避免把它过度具体化为某套教义。
- source_word: sensum
  choice: 悟性
  rationale: sensum 可指理解力、明辨能力；“悟性”在此能与人格化的“母亲”自然搭配，并保留其抽象含义。
- source_word: vocasti matrem
  choice: 称……为你的母亲
  rationale: 直接保留称谓结构及智慧传统中的亲属隐喻，不解释或弱化其张力。
theological_decisions:
- issue: 将“悟性”人格化并称为母亲
  choice: 按原文保留“称悟性为你的母亲”
  alternative: 把悟性视为母亲／以悟性为母
  rationale: 原文使用明确的 vocasti（称呼、称为），直译可保存人格化修辞，而不额外判定这是本体论陈述还是比喻。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；句式紧贴拉丁文两分结构，同时避免生硬欧化。
