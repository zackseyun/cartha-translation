  text: 'And I said[a], “Lord Master, show me this: why did I see the man coming up from the heart of the sea?” And he said to me:'
translation:
  language: zh_hans
  text: 我说：“主宰啊，主啊，求你向我说明：为什么我看见那人从海的中心升上来？”他对我说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dominator Domine
  choice: 主宰啊，主
  rationale: 保留拉丁文两个呼格称谓的叠用及其庄严语气；“主宰”对应 Dominator，“主”对应 Domine，避免将二者合并而损失原文形式。
- source_word: hoc mihi ostende
  choice: 求你向我说明
  rationale: 自然表达 ostende 的请求语气；“这事”在后接具体疑问时可不明说，中文更流畅。
- source_word: propter quod
  choice: 为什么
  rationale: 在此引出对异象缘由的询问，译作“为什么”最符合现代汉语。
- source_word: virum
  choice: 那人
  rationale: 指说话者刚才在异象中所见的特定人物，中文用“那人”自然明确；不额外解释其身份。
- source_word: ascendentem de corde maris
  choice: 从海心升上来
  rationale: “海心”较直接保留 corde maris 的形象，且“升上来”体现 ascendentem 的上升动作与朝向观察者的语感。
- source_word: et dixit mihi
  choice: 他对我说
  rationale: 完整保留本节末尾引出下一节答语的叙事句。
theological_decisions:
- issue: Dominator Domine 的称谓关系
  choice: 主宰啊，主
  alternative: 主啊，主宰；至高的主；主宰之主
  rationale: 原文并列两个呼格称谓，译文不将其解释为复合神名或特定教义称号，以保留其修辞张力。
- issue: “那人”的身份
  choice: 仅译为“那人”
  alternative: 那个人子；那位弥赛亚
  rationale: 本句 virum 本身只说“人”，不在译文中提前加入基督论或弥赛亚身份判定。
translation_notes:
  register: 采用庄重而现代的叙事语体。“主宰啊，主”有意保留原文双重呼告，虽略显隆重，却符合启示文学语境；句末冒号保留原文引出后续答语的结构。
