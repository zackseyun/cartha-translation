  yaml_path: translation/extra_canonical/2_esdras/013/036.yaml
  text: But he will stand upon the summit of Mount Zion. And Zion will come and be shown to all, prepared and built, just as you saw the mountain carved out without hands.
translation:
  language: zh_hans
  text: 但他必站在锡安山顶。锡安必来到，并以预备妥当、建造完成的样子向众人显现，正如你所看见的那座非人手凿成的山。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cacumen montis Sion
  choice: 锡安山顶
  rationale: “cacumen”指山峰或顶端；译作“山顶”自然准确，并与“montis Sion”构成现代汉语常用表达。
- source_word: ueniet
  choice: 必来到
  rationale: 保留拉丁文所表达的移动意象，不将锡安的“来到”弱化为单纯的出现。
- source_word: ostendetur omnibus
  choice: 向众人显现
  rationale: 采用被动含义的自然汉语表达，保留锡安被公开展示、人人可见的意思。
- source_word: parata et aedificata
  choice: 已经预备好、建造完成
  rationale: 分别传达“parata”的预备就绪和“aedificata”的建造完成；补入体貌词使汉语顺畅。
- source_word: sculpi sine manibus
  choice: 非人手凿成
  rationale: “sculpi”有雕刻、凿出的含义；“非人手凿成”既贴近原文，也保留其超自然意象。
theological_decisions:
- issue: 锡安被描述为“来到”并“显现”
  choice: 保留锡安主动“来到”、随后向众人显现的表述
  alternative: 释义为锡安从天降下，或仅译作锡安出现
  rationale: 原文没有明确说明锡安从何处来，也没有直接使用“降下”；保留原有意象和未决之处，避免加入特定末世论解释。
- issue: “非人手”所表达的建造者
  choice: 译作“非人手凿成”
  alternative: 明译为“上帝所造”
  rationale: 原文只否定人手参与，并未在本句直接指明行动者；不替文本补明神学推论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。首句依据经文连续语境及经审校的英语咨询层补足“但他必站在”，因为所给拉丁片段以“锡安山顶”承接前文；后句则紧随拉丁文句法和意象。
