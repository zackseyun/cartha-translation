  to: 但他必站在锡安山顶。锡安必来到，并以预备妥当、建造完成的样子向众人显现，正如你所看见的那座非人手凿成的山。
  rationale: 仅删除“已经”所引入的额外时序断言，并重组后句以自然表达拉丁文中修饰“锡安”的两个完成分词；其余意象、语气和歧义均予保留。
