  source_fidelity: 译文准确对应拉丁文。‘从起初’对应 ab initio，‘把这些奇事显给了你的仆人’保留 demonstrasti、mirabilia haec 和 servo tuo 的启示及自谦语气。‘认为我配得你接纳我的恳求’恰当表达 dignum me habuisti 与 ut susciperes deprecationem meam 的紧密关系；‘接纳’没有过度具体化为必然照所求成就。
