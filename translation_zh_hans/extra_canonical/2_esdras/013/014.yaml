  text: tu ab initio demonstrasti servo tuo mirabilia haec et dignum me habuisti, ut susciperes deprecationem meam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/014.yaml
  text: From the beginning you have shown these wonders to your servant[a], and you have counted me worthy to receive my supplication.
translation:
  language: zh_hans
  text: 你从起初就把这些奇事显给了你的仆人，又认为我配得你接纳我的恳求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又看我为配得，使你接纳我的恳求。”
    reason: 拉丁文 ut susciperes 可作为“认为我配得”的补足内容，也可较形式地译出目的或结果意味。
lexical_decisions:
- source_word: ab initio
  choice: 从起初
  rationale: 保留时间起点的表达，不将其弱化为一般的“早先”。
- source_word: demonstrasti
  choice: 显给了
  rationale: 表达主动使仆人看见、知道这些奇事，语体庄重而自然。
- source_word: mirabilia haec
  choice: 这些奇事
  rationale: mirabilia 指令人惊奇的非凡之事；“奇事”简洁，并符合经文语域。
- source_word: servo tuo
  choice: 你的仆人
  rationale: 直译所有格与身份称谓，并保留说话者自称仆人的谦卑语气。
- source_word: dignum me habuisti
  choice: 认为我配得
  rationale: 准确反映“视我为配得”的判断，而不是声称说话者本身具有功德。
- source_word: deprecationem meam
  choice: 我的恳求
  rationale: deprecatio 在此指恳切的祈求；“恳求”自然，并可与前节的同源动词保持词义联系。
- source_word: susciperes
  choice: 接纳
  rationale: 在祈求语境中表示接受、垂允；不直接译成“应允”，以免把接受祈求进一步解释为必定按所求成就。
theological_decisions:
- issue: “配得”与祈求蒙接纳之间的关系
  choice: 又认为我配得你接纳我的恳求
  alternative: 又看我为配得，使你接纳我的恳求
  rationale: 保留拉丁文 dignum me habuisti 与 ut susciperes 的紧密联系，同时避免增添有关功德或祈祷必然应验的神学解释。
- issue: ut 从句的语义功能
  choice: 正文采用自然的补足表达，脚注保留目的／结果式理解
  alternative: 使你接纳我的恳求
  rationale: 此处 ut 可被理解为“认为我配得（你接纳……）”的内容，也可较形式地呈现为目的或结果关系；正文不强行展开，脚注说明另一种译法。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“显给了”保留启示性的色彩；“接纳我的恳求”既贴近原文，也避免将意思过度解释为已经照所求应允。
