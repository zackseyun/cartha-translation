  terminology: ‘奇事’适切表达 mirabilia；‘仆人’保留宗教文本中 servo 的谦卑自称；‘恳求’对应 deprecationem，且不预设特定宗派的祷告神学。脚注准确呈现 ut 从句可作较形式化目的／结果式理解的译法。
