  text: ego autem quaesivi videre regionem vel locum, unde sculptus esset mons, et non potui.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/007.yaml
  text: But I sought to see the region or place from which the mountain had been carved, and I could not.
translation:
  language: zh_hans
  text: 但我试图看看那座山是从哪个地区或地方凿出来的，却办不到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaesivi videre
  choice: 想要看清
  rationale: 表达主动设法察看的意思；“看清”也自然承接后文“却没能看见”，但不把动作强化为已经查明。
- source_word: regionem vel locum
  choice: 哪个地区或地方
  rationale: 保留拉丁文两个近义空间词及其选择关系 vel，不擅自合并。
- source_word: sculptus esset mons
  choice: 那座山是……凿出来的
  rationale: 以被动结构对应未完成虚拟式被动形式；“凿出来”适合山体被雕凿而成的视觉意象，同时不额外说明施事。
- source_word: et non potui
  choice: 却没能看见
  rationale: 按上下文补足 videre 所支配的动作，使现代汉语自然；“却”准确呈现结果与意图之间的转折。
theological_decisions:
- issue: 山的来源或形成方式是否具有象征性解释
  choice: 仅陈述叙述者未能看见山从何处被凿出
  alternative: 将其解释为山凭神迹出现或非人手所造
  rationale: 原文只描写异象中的观察及失败，没有明说成因或神学解释，因此保留其神秘性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“地区或地方”的并列张力，并以“凿出来”呈现 sculptus 的具体形象。
