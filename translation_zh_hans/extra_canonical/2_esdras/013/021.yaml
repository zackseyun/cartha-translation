  text: And he answered me and said, “I will tell you the interpretation of the vision, and I will also explain to you the matters about which you have spoken.”
translation:
  language: zh_hans
  text: “我会告诉你这异象的解释，也会向你阐明你所谈到的那些事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: visionis interpretationem
  choice: 这异象的解释
  rationale: 直译拉丁语所有格结构，同时以“这”自然承接上文已见的异象。
- source_word: dicam tibi
  choice: 告诉你
  rationale: 准确表达“向你说出、告知”的意思，符合现代汉语习惯。
- source_word: adaperiam tibi
  choice: 向你阐明
  rationale: adaperire在此有揭开、说明之意；“阐明”既区别于前句的“告诉”，又自然表达解释清楚。
- source_word: de quibus locutus es
  choice: 你所说的那些事
  rationale: 保留关系结构所指事项的概括性，不擅自限定具体内容。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留原文两个并列承诺及“异象的解释”与“所说的那些事”之间的区分。原拉丁文本未含英语咨询层中的“and said”之外的额外内容，译文以“回答我说”自然对应其叙事表达。
