  source_fidelity: “进入了”准确传达 introierunt 的进入动作；“幼发拉底河”是 Eufratis 的规范现代汉语河名。不过，angustos 为复数、且语义为河流中的狭窄通行处；“狭窄河道”较易被理解为整条河的单一河床或河道，未能充分呈现“narrow passages”的意思。
  naturalness: 原文通顺，但“幼发拉底河的狭窄河道”略显生硬，且“河道”通常指河流的水流通道或河床。改为“狭窄水道”更自然，也更贴合叙事中可进入、通行的狭窄水路。
  terminology: “幼发拉底河”符合现代汉语通行地名译法。此处没有需要调整的神学术语或专名。
