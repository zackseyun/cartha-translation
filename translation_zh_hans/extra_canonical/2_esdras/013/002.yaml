  text: And behold[a], a wind arose from the sea to stir up all its waves.
translation:
  language: zh_hans
  text: 看哪，有一阵风从海上刮起，搅动海中所有的波浪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留异象叙述中引人注意的提示语，语体庄重且符合现代汉语圣经文体。
- source_word: de mari
  choice: 从海上
  rationale: 直接表达来源；此处不添加现存拉丁文本没有的内容。
- source_word: ventus exsurgebat
  choice: 有一阵风……刮起
  rationale: 以自然汉语表达风的兴起；拉丁语未完成时在异象叙事中描述当时显现的动态景象。
- source_word: ut conturbaret
  choice: 搅动
  rationale: 表达使水波翻腾、扰动之意，同时避免生硬直译目的或结果从句。
- source_word: omnes fluctus eius
  choice: 海中所有的波浪
  rationale: 将代词 eius 的所指明确为海，避免汉语中“它所有的波浪”的拗口表达。
theological_decisions:
- issue: 是否补入其他古译本所保存的“人形从海中出现”段落
  choice: 不补入本节正文
  alternative: 依据叙利亚语、埃塞俄比亚语等见证补写缺失段落
  rationale: 所给底本本节仅含风从海上刮起并搅动波浪的句子；按当前分节与拉丁原文翻译，不把底本之外、且可能属于后续文本的材料并入本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留异象文体的突显作用；句式简洁，不加入英文旧稿脚注中仅涉及标点的无实质异文。
