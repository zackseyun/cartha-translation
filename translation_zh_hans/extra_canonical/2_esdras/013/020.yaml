  text: Yet it is easier for one in danger to come into these things than to pass through the age like a cloud and not see what happened in the last days.” And he answered me and said:[a]
translation:
  language: zh_hans
  text: 然而，一个身处险境的人进入这些事中，比像云一样离开这世界[a]，而看不见末后所发生的事，还容易些。”他回答我说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像云一样从这世代过去”。“世代”也可指“世界”；此处可能指人在末后的事发生以前离世。
    reason: 说明 a saeculo 的“世代／世界”语义及其可能的离世含义，并将锚点置于所说明的短语之后。
lexical_decisions:
- source_word: periclitantem
  choice: 身处险境的人
  rationale: 该词指正在遭遇危险或危难的人；此译法保留其处境含义，同时符合现代汉语表达。
- source_word: venire in haec
  choice: 经历这些事
  rationale: 直译为“进入这些事”在汉语中生硬；语境所指是临到或置身于这些事件之中，因此译作“经历这些事”。
- source_word: pertransire sicut nubem a saeculo
  choice: 像云一样从这世代消逝
  rationale: a saeculo带有从“世代／世界”离去的分离意味，结合云的比喻，译作“消逝”可自然表达离世，同时不把它误解为漫无目的地度过一生。
- source_word: in novissimo
  choice: 末后
  rationale: 拉丁语可指末了、终局或末后的时期；“末后”保留其时间与终末意味，而不强行限定为某一套末世论术语。
- source_word: Et respondit ad me et dixit
  choice: 他回答我说
  rationale: 按所给拉丁文本保留本节末尾的叙事引语框架，使用简洁自然的汉语圣经文体。
theological_decisions:
- issue: a saeculo所表达的离世含义
  choice: 从这世代消逝
  alternative: 穿过这世代；离开这世界
  rationale: 主译兼顾介词a的分离含义和saeculum的“世代／世界”语义，并借“消逝”与云的意象表达死亡，但不将其神学含义过度明说。
- issue: in novissimo的终末指向
  choice: 末后发生的事
  alternative: 在末日发生的事；最终发生的事
  rationale: “末后”保存原文可指末期或终局的张力，不把单数形式机械限定为某个具体日期。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经历这些事”避免生硬直译，“像云一样从这世代消逝”保留原文比喻及其语义张力。引号承接上文话语；末句依照所给拉丁文本置于本节。
