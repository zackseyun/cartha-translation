  yaml_path: translation/extra_canonical/2_esdras/013/031.yaml
  text: And bewilderment of mind will come upon those who inhabit the earth. And they will plan to make war, one against another, city against city, place against place,
translation:
  language: zh_hans
  text: 心智昏乱必临到住在地上的人。他们将筹划相互交战，城攻打城，地方攻打地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excessus mentis
  choice: 心智昏乱
  rationale: 该短语字面涉及心智失常、失去常态；结合语境，译为“心智昏乱”既保留其强烈程度，也自然表达普遍的困惑与失序。
- source_word: ueniet ... super eos
  choice: 必陷入
  rationale: 拉丁文直译为某事“临到他们身上”；汉语用“陷入”更自然地表达这种状态临到并笼罩世人。
- source_word: alii ... in alios
  choice: 彼此
  rationale: 表达不同群体互相敌对，简洁保留相互性的结构。
- source_word: cogitabunt bellare
  choice: 图谋争战
  rationale: 同时保留 cogitabunt 的谋划、意图含义和 bellare 的作战含义，避免仅译为已经开战。
- source_word: ciuitates ciuitatem
  choice: 城攻打城
  rationale: 原文形式略显不整齐，但与后面的“地方对地方”构成敌对双方的排比；以惯用汉语呈现，不额外限定具体城市。
- source_word: locus locum
  choice: 地方攻打地方
  rationale: 保留原文宽泛的地域单位及排比关系，不擅自具体化为国家或地区。
theological_decisions:
- issue: “心智昏乱”的性质
  choice: 保留为普遍临到世人的精神与认知失序
  alternative: 明确解释为神所降的迷惑或疯狂
  rationale: 本节只陈述该状态将临到世人，并未在措辞中明确其直接施事者或神学机制，因此不作超出原文的归因。
- issue: 战争表达的时间与阶段
  choice: 译作“图谋争战”
  alternative: 译作“彼此开战”
  rationale: 原文 cogitabunt 表明先有谋划或意图；保留这一层次，可避免把预谋直接等同于战争已经爆发。
translation_notes:
  register: 采用现代、庄重而清晰的叙述语体。两句结构由内在昏乱推进到群体间战争谋划，并以“城攻打城，地方攻打地方”的排比保留原文节奏。无脚注。
