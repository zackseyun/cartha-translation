  text: propter hoc vae, viderunt enim pericula magna et necessitates multas, sicut ostendunt somnia haec.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/019.yaml
  text: But as for those who are left—woe to them for this reason! For they will see great dangers and many distresses[a], as these dreams show.
translation:
  language: zh_hans
  text: 因此有祸了！因为他们将看见极大的危险和许多困苦，正如这些梦所显示的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc vae
  choice: 因此，他们有祸了
  rationale: 直译为“因此有祸了”。中文补出“他们”，承接下句复数主语，但不加入拉丁文本中没有明说的“那些留下来的人”。
- source_word: viderunt
  choice: 他们将看见
  rationale: 该词形通常是完成时“他们看见了”，但这里梦所显示的是将临之事，可按预示性语境译为将来；另以脚注保留时态上的歧义。
- source_word: pericula magna
  choice: 极大的危险
  rationale: 贴近拉丁文的程度与复数概念，用自然现代汉语表达。
- source_word: necessitates multas
  choice: 许多困苦
  rationale: necessitates 在此指逼迫人的艰难、窘迫或患难；“困苦”保留较宽的语义范围。
- source_word: sicut ostendunt somnia haec
  choice: 正如这些梦所显示的
  rationale: 保留 somnia 的复数“梦”和 ostendunt 的“显示、表明”之意。
theological_decisions:
- issue: 灾祸所指对象是否明确为“那些留下来的人”
  choice: 正文仅以“他们”承接后句，不增译“那些留下来的人”
  alternative: 至于那些留下来的人——他们因此有祸了
  rationale: 所提供的拉丁正文没有 qui derelicti sunt（“那些被留下的人”）；不应仅据英语咨询层补入该限定，以免增加原文未明说的末世群体身份。
- issue: viderunt 的时间指向
  choice: 按异象预示语境译作“将看见”
  alternative: 按拉丁语法形态译作“已经看见了”或“看见了”
  rationale: 拉丁完成时与异象所指的未来灾难之间存在张力；正文采用语境上自然的将来表达，脚注明确记录字面时态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“有祸了”保留经文式警告语气；“遭遇许多困苦”使并列关系符合现代汉语习惯。正文不照搬英语层中缺乏当前拉丁文本支持的“那些留下来的人”。
