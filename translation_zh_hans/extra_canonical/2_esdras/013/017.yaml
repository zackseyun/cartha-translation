  text: For those who are not left will be sorrowful,
translation:
  language: zh_hans
  text: 因为那些未被留下的人将会悲伤，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui enim
  choice: 因为那些……的人
  rationale: “enim”承接并解释上文，译为“因为”；“qui”引出以关系从句界定的人群。
- source_word: non sunt derelicti
  choice: 没有被留下
  rationale: 保留拉丁文被动结构及 derelinquere 在此处“留下、遗留”的基本含义，不擅自判定是“被遗弃”还是“存留”。
- source_word: tristes erunt
  choice: 必将悲伤
  rationale: 用“将”表达未来时，并以“必”体现陈述的确定语气；tristes 在此作表语，指忧伤的状态。
theological_decisions:
- issue: “没有被留下”的具体所指
  choice: 维持措辞开放，不补出被谁留下、留在哪里或为何留下
  alternative: 译作“没有被遗弃的人”或“没有存留下来的人”
  rationale: 单凭本节拉丁文无法排除 derelicti 的多重语义；直译可保存与上下文相连的张力，避免预先作神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留句末逗号，以对应本节在上下文中未完结的句法关系。
