  yaml_path: translation/extra_canonical/2_esdras/013/057.yaml
  text: And I departed and went into the field[a], greatly glorifying and praising the Most High for the wonders that he did in their times,
translation:
  language: zh_hans
  text: 于是我动身来到田野，为至高者历来所行的奇事，大大尊崇并赞美他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus sum et transii in campum
  choice: 我动身来到田野
  rationale: 既表达“出发、离去”的动作，也自然呈现“进入田野”的结果；避免生硬直译为“越过到田野”。
- source_word: glorificans et laudans
  choice: 尊崇并赞美
  rationale: 保留两个并列分词的区别：“glorificans”指尊他为大、归荣耀给他，“laudans”指开口赞美。
- source_word: Altissimum
  choice: 至高者
  rationale: 这是此书对上帝的尊称，准确而庄重。
- source_word: de mirabilibus
  choice: 为……奇事
  rationale: 此处“de”说明尊崇和赞美的缘由或内容；汉语用“为”表达较自然。
- source_word: per tempus faciebat
  choice: 历来所行
  rationale: “per tempus”带有贯穿时间、在各时期施行之意；“历来”保留时间延展性，同时不加入“间歇而行”的含义。
theological_decisions:
- issue: 奇事的施行者
  choice: 明确以“他”指至高者
  alternative: 省略主语，仅作“历来所行的奇事”
  rationale: 拉丁文“faciebat”的主语承接“Altissimum”；明示“他”使现代汉语关系清楚，又不增加新的神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“大大尊崇并赞美”保留原文程度副词及两个并列动作；不采用英文本中源于旧有错置经文的脚注，因为它不是本节拉丁文的异读。
