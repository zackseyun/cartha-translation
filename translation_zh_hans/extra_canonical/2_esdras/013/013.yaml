  yaml_path: translation/extra_canonical/2_esdras/013/013.yaml
  text: 'And many human faces were coming to him: some rejoicing, some grieving; some were bound, and some were bringing those who were being led. And I awoke from the greatness of my fear, and I made supplication to the Most High and said,'
translation:
  language: zh_hans
  text: 许多人的面孔向他而来：有的欢喜，有的悲伤；有的被捆绑，有的则带领其中被带来的人。我因极度恐惧而惊醒，就向至高者恳求说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vultus hominum multorum
  choice: 许多人的面孔
  rationale: 按拉丁文保留异象中“面孔”这一具体意象；用“人的”自然表达 hominum，并避免将其限定为男性。
- source_word: accedebant ad eum
  choice: 向他而来
  rationale: 表达趋近、来到他面前的动态，同时保持异象叙述的庄重感。
- source_word: alligati
  choice: 被捆绑
  rationale: 直接呈现受缚状态，不擅自解释其身份或原因。
- source_word: adducentes ex eis qui offerebantur
  choice: 押送那些被带来的人
  rationale: adducentes 表示带领或押送；offerebantur 在此较宜理解为被带到前面，而非作祭物献上。“押送”也与被捆绑者的语境相称。
- source_word: a multitudine pavoris
  choice: 因极度恐惧
  rationale: 拉丁语字面近于“因恐惧之大/繁多”；现代汉语以“极度恐惧”自然传达其强烈程度。
- source_word: deprecatus sum Altissimum
  choice: 向至高者恳求
  rationale: deprecari 在此是祈求、哀求；“至高者”沿用圣经语体中对 Altissimus 的庄重称谓。
theological_decisions:
- issue: offerebantur 是否含有献祭意义
  choice: 译作“被带来的人”
  alternative: “被献上的人”
  rationale: 上下文描述人群被捆绑、被带领到某处，语境支持“带到面前”的意义；译成“献上”会无根据地引入献祭含义。
- issue: vultus 是否转喻为“人”
  choice: 保留“面孔”意象
  alternative: “许多人”
  rationale: 原文明确使用 vultus（面孔、容貌）；保留这一异象性表达，不把可能有意义的视觉细节抹平。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“有的……有的……”形成自然排比；句末用冒号承接下一节的祷告内容。
