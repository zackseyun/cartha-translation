  rationale: 修订仅处理前半句的汉语句法和 uirum ascendentem 的表达：以“那位正在上升的人”明确对应“你所看见的一个正在上升的人”。后半保留原有的自然处理，即以“离开本地、停止战争”表达同一 derelinquet 所支配的两个对象；不引入任何神学身份判断或战争结果的扩展。
