  yaml_path: translation/extra_canonical/2_esdras/013/033.yaml
  text: my Son will be revealed, whom you saw as a man ascending. And it shall be, when all the nations hear his voice, each will leave his own land and the war that they have against one another,
translation:
  language: zh_hans
  text: 我的儿子，就是你所看见的那位正在上升的人，必显现出来。到那时，万国一听见他的声音，各自就会离开本地，也会停止彼此之间的战争，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: filius meus
  choice: 我那儿子
  rationale: 直译为“我的儿子”亦可；此处用“我那儿子”自然衔接后面的解释性定语，并保留原文的所属关系与称谓。
- source_word: reuelabitur
  choice: 必显现出来
  rationale: 表达被动式“将被显明、显现”，不额外说明是谁使他显现。
- source_word: uirum ascendentem
  choice: 如同一个人升上去的
  rationale: 保留宾格结构所表达的所见形象，并按 ascendentem 译出向上升的动态；“如同”使现代汉语表达自然，但不把异象人物简单等同于普通人。
- source_word: omnes gentes
  choice: 万国
  rationale: gentes 可指各国、各族；“万国”在庄重叙事中简洁自然，并保留群体范围的广泛性。
- source_word: derelinquet unusquisque regionem suam
  choice: 各自就会离开本地
  rationale: unusquisque 译作“各自”，regionem suam 译作“本地”，避免过度限定为现代民族国家的国土。
- source_word: bellum quod habent in alterutro
  choice: 也会停止彼此之间的战争
  rationale: 拉丁文直面为“离开……他们彼此所有的战争”；依并列宾语关系，在汉语中补出“停止”以传达离弃战争之意，同时不添加战争结果的细节。
theological_decisions:
- issue: “我儿子”的身份与异象中‘人’的关系
  choice: 保留“我那儿子”及“如同一个人”的异象描述
  alternative: 直接译成“我儿子，就是你看见升天的那个人”
  rationale: 原文称其为 filius meus，同时描述为 quem uidisti uirum ascendentem；译文不进一步界定其本体、身份或升行目的，以保留文本本身的张力。
- issue: 列国离弃战争的动作关系
  choice: 将 derelinquet 的语义自然延伸至并列的“本地”和“战争”，译为离开本地、停止战争
  alternative: 严格保留省略结构：“各自会离开本地和彼此之间的战争”
  rationale: 后者在现代汉语中可能误解为“离开战争所在地”；分用“离开”和“停止”能清楚表达同一支配关系，而不引入和平、悔改等神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“必……”“到那时”“万国”保持经文语感，但避免生硬文言。句末逗号保留原节未完的连续结构，表明语意接续下一节。
