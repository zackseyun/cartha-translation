  language: zh_hans
  text: 因为你离弃了自己的事，专心于我的事，并且查考了我的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquisti enim tua
  choice: 因为你离弃了自己的事
  rationale: “tua”是中性复数，指“属于你自己的事物／事务”；译作“自己的事”自然简洁，并保留与下文“我的事”的对照。
- source_word: circa mea vacasti
  choice: 专心于我的事
  rationale: “vacare circa”在此表示腾出自己、专注从事；“专心于”既表达投入，也避免机械直译。
- source_word: legem meam exquisisti
  choice: 寻求了我的律法
  rationale: “exquirere”含认真查考、探求之意；“寻求”保留其主动而深入的意味，“律法”准确对应宗教语境中的 lex。
