  yaml_path: translation/extra_canonical/2_esdras/013/038.yaml
  text: with which they are about to be tormented, which are likened to a flame; and he will destroy them without effort, and the law, which is likened to fire.
translation:
  language: zh_hans
  text: 他们将开始受这些折磨；这些好比火焰。他必毫不费力地毁灭他们，也毁灭那好比火的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: incipient cruciari
  choice: 将……开始受折磨
  rationale: 保留拉丁文所表达的动作起始，不将其弱化为单纯的“将要受折磨”。
- source_word: adsimilatae sunt flammae
  choice: 好比火焰
  rationale: 以自然的现代汉语表达比拟关系，同时保留“火焰”的具体意象。
- source_word: sine labore
  choice: 毫不费力地
  rationale: 直接表达“不需劳苦或费力”的含义。
- source_word: legem quae igni adsimilata est
  choice: 那好比火的律法
  rationale: 保留 lex 的“律法”含义及其与火的明示比拟。
theological_decisions:
- issue: “律法”与毁灭动作之间反常而有张力的句法关系
  choice: 译作“也毁灭那好比火的律法”，将“律法”保留为 perdet 的并列宾语
  alternative: 译作“借着那好比火的律法毁灭他们”
  rationale: 现存拉丁文以宾格 legem 通过 et 与 eos 并列，并无表示工具关系的介词；因此不擅自加入“借着”，即使直译在神学与语义上显得突兀。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。分号使关系代词 quibus 与 Quae 所承接的前文保持可读性；末句明确呈现原文的并列结构，不替原文消解其异常之处。
