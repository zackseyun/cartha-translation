  text: And then he will show them very many wonders.
translation:
  language: zh_hans
  text: 那时，他要向他们显明极多的奇事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et tunc
  choice: 那时
  rationale: 自然表达时间推进；此处 et 兼有承接作用，无须机械译为“并且”。
- source_word: ostendet eis
  choice: 他要向他们显明
  rationale: 保留第三人称单数主语及间接宾语；“显明”既可涵盖展示，也可涵盖使人看见。
- source_word: multa plurima portenta
  choice: 极多的奇事
  rationale: portenta 指异常、令人惊异并可能具有征兆意味的事；译作“奇事”避免擅自限定为神迹或凶兆。multa plurima 是强化数量的表达，以“极多”传达。
theological_decisions:
- issue: portenta 是否应明确译为“神迹”
  choice: 奇事
  alternative: 神迹／异兆
  rationale: 拉丁词本身可指奇异现象、预兆或神奇之事；上下文未在本节内明确其性质，故保留语义张力，不预先作神学归类。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；句式简洁，并保留原文对奇事数量的强调。
