  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi, et ecce convolabat ipse homo cum nubibus caeli. et ubi vultum suum convertebat ut consideraret, tremebant omnia quae sub eo videbantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/003.yaml
  text: And I looked[a], and behold, that man was flying with the clouds of heaven; and wherever he turned his face to look, everything seen beneath him trembled.
translation:
  language: zh_hans
  text: 我观看，看哪，那人正随着天上的云飞行；他无论转脸看向哪里，凡在他下方可见的[a]，都战栗起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡被他看见的”。现存拉丁文直译为“凡在他下方可见的”。
    reason: 保留 sub eo 可能反映施事含义之底本的文本与翻译歧义，同时不取代拉丁正文最直接的空间性读法。
lexical_decisions:
- source_word: convolabat
  choice: 正……飞行
  rationale: 表达未完成过去时所描绘的持续景象；不额外限定飞行方式。
- source_word: cum nubibus caeli
  choice: 随着天上的云
  rationale: 贴近拉丁文 cum 的伴随含义，同时保持自然的现代汉语。
- source_word: vultum suum convertebat ut consideraret
  choice: 转脸看向哪里
  rationale: 将“转过自己的面容，为要察看”自然凝练为现代汉语，并保留主动察看的动作。
- source_word: tremebant
  choice: 战栗起来
  rationale: 既可描写受惊，也可描写震颤，保留原文未明确说明原因的张力。
- source_word: quae sub eo videbantur
  choice: 凡在他下方可见的
  rationale: 按现存拉丁文本的通常句法直译 sub eo 为“在他下方”，并以“可见的”表达被动形式 videbantur。
theological_decisions:
- issue: sub eo 与 videbantur 的关系
  choice: 在他下方可见的
  alternative: 被他看见的
  rationale: 现存拉丁文 sub eo 最直接的意思是“在他下方”；虽然有观点依据假定的希腊文底本及其他古译本把它理解为施事关系“被他看见”，但该读法并非拉丁文本本身的自然表达，因此正文从所给原文出发，并在脚注保留另一种理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我观看，看哪”保留异象叙事的反复观看公式；分号呈现景象与其震撼效果之间的推进关系。
