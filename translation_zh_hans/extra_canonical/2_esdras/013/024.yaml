  yaml_path: translation/extra_canonical/2_esdras/013/024.yaml
  text: Therefore know that those who are left are more blessed than those who have died.
translation:
  language: zh_hans
  text: 所以你要知道，留下来的人比已经死去的人更有福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scito ergo
  choice: 所以你要知道
  rationale: 保留推论连接词 ergo，并以自然的现代汉语表达拉丁语命令式 scito。
- source_word: magis beatificati sunt
  choice: 更有福
  rationale: 准确表达比较意义 magis，并以常用、庄重的圣经语汇“有福”传达 beatificati。
- source_word: qui derelicti
  choice: 留下来的人
  rationale: 按上下文理解为仍存留、尚活着的人；“留下来”比“被遗下”更符合现代汉语，同时不额外说明其如何存留。
- source_word: qui mortui sunt
  choice: 已经死去的人
  rationale: 保留完成状态的含义，以自然汉语表达与存留者的对比。
theological_decisions:
- issue: 存留者与死者之间福分的比较
  choice: 留下来的人比已经死去的人更有福
  alternative: 存留的人胜过死去的人，是更蒙福的
  rationale: 直接保留原文的比较判断，不补充福分的性质、原因或末世次序，以免消解上下文中的神学张力。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“所以”承接上文论证；“你要知道”保留劝告式命令语气。
