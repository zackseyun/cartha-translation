  yaml_path: translation/extra_canonical/2_esdras/013/045.yaml
  text: For through that region there was a long way to travel, of a year and a half; and that region is called Arzareth.
translation:
  language: zh_hans
  text: 因为穿过那一带，要走一年半的漫长路程；那地方名叫亚撒勒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimidii
  choice: 半
  rationale: 与语境中的“年”合成“一年半”，表达行程所需时间；现存引文从该词前后截断，完整句意由校勘本上下文及英语审校层印证。
- source_word: regio illa
  choice: 那地方
  rationale: regio 可指地区、地带或地方；此处作为名为 Arzareth 的地域，用现代汉语“那地方”自然清楚。
- source_word: Arzareth
  choice: 亚撒勒
  rationale: 按专名音译，不将其解释为具有特定神学含义的名称。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“要走一年半的漫长路程”保留原文以时间衡量路程的表达，同时避免生硬直译。所给拉丁文本片段还包含下一句开头“Tunc inhabitauerunt ibi”（于是他们住在那里），未纳入本节正文，以免越过13:45的节界。
