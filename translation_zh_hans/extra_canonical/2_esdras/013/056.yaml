  text: et propter hoc ostendi tibi haec, merces apud Altissimum. erit enim post alios tres dies, ad te alia loquar et exponam tibi gravia et mirabilia.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/056.yaml
  text: Therefore I have shown you these things; for there is a reward with the Most High. For after three more days I will speak further with you and explain to you weighty and wondrous things.”
translation:
  language: zh_hans
  text: 所以，我把这些事指示给你，因为至高者那里有赏赐。再过三天，我还要向你讲别的事，并向你解明重大而奇妙的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendi
  choice: 指示
  rationale: 既表达使人看见、显明的意思，也符合异象启示的语境。
- source_word: merces apud Altissimum
  choice: 至高者那里有赏赐
  rationale: 保留 apud 所表达的“在……那里”，不擅自具体化赏赐的来源、领取方式或对象。
- source_word: post alios tres dies
  choice: 再过三天
  rationale: 自然表达 alios 的“另外、再”之意，即又过三天。
- source_word: gravia et mirabilia
  choice: 重大而奇妙的事
  rationale: gravia 在此指分量重、意义重大的内容；mirabilia 指令人惊奇、奇妙之事。
theological_decisions:
- issue: 赏赐与指示异象之间的逻辑关系
  choice: 因为至高者那里有赏赐
  alternative: 这是至高者那里的赏赐
  rationale: 原文以独立短语 merces apud Altissimum 表述，语法略显省略；依上下文及英译补出“有”，同时不把“赏赐”直接等同于所见异象。
translation_notes:
  register: 采用庄重而清晰的现代书面汉语。“我还要对你说话”保留原文 ad te alia loquar 的直接表达；“解明”兼顾 exponam 的解释、阐明之意。
