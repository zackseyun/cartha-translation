  text: haec est interpretatio somnii quem vidisti, et propter quod inluminatus es haec solus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/053.yaml
  text: This is the interpretation of the dream that you saw[53], and why you alone have been enlightened concerning these things.
translation:
  language: zh_hans
  text: 这就是你所见之梦的解释；也解释了为什么唯独你在这些事上蒙了光照。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文后半句语序紧缩，直译可作“也因这缘故，唯独你在这些事上蒙了光照”。因此也可理解为：前述梦的解释或所述之事，说明了你为何独自得到光照。
    reason: 保留 propter quod 的紧缩句法及其“为什么／因这缘故”的关联，不在正文中强行消除歧义。
lexical_decisions:
- source_word: interpretatio
  choice: 解释
  rationale: 直接表达对异梦含义的阐明，符合现代汉语习惯。
- source_word: inluminatus es
  choice: 蒙了光照
  rationale: 保留拉丁文“被照亮”的被动意象，同时以“蒙”体现所领受的启示并非出于自己。
- source_word: haec
  choice: 这些事
  rationale: 按上下文指异梦及其所启示的内容，不把所指范围缩窄为单一事项。
- source_word: solus
  choice: 唯独你
  rationale: 准确保留排他性强调，且比“你独自”更自然地表达只有以斯拉获此光照。
theological_decisions:
- issue: “蒙光照”与“得启示”的关系
  choice: 正文保留“蒙了光照”，并以“得以明白”说明其结果
  alternative: 唯独你得了启示，明白这些事
  rationale: “得启示”较流畅，但会取代原文的光照意象；当前译法既保留隐喻，也让普通读者容易理解。
- issue: propter quod的句法关系
  choice: 译作“也说明为什么”
  alternative: 译作“也正因如此”
  rationale: 拉丁文短语可以引出原因或结果；依照句中解释异梦的语境，正文采用疑问关系，但以脚注保留另一种可行理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“异梦”在本句以“梦”表达，避免无必要的古雅化；“蒙了光照”保留经文意象，并以“得以明白”补足现代汉语语义。未采用英文稿中与本节内容不相符的脚注。
