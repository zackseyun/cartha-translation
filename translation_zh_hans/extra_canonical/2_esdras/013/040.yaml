  text: these are the ten tribes that were led away captive from their own land in the days of King Hoshea[40], whom Shalmaneser king of the Assyrians led away captive; and he carried them across the River[a], and they were taken into another land.
translation:
  language: zh_hans
  text: 这十个支派，就是在何细亚王[a]的日子从自己的土地被掳走的。亚述王撒缦以色把他们掳去，带他们过河；他们被迁到另一片土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本作“约西亚”；叙利亚文、埃塞俄比亚文和阿拉伯文古译作“何细亚”。后者与北方十支派遭亚述掳走的历史背景相符。
    reason: textual_variant
lexical_decisions:
- source_word: terra sua
  choice: 自己的土地
  rationale: 直译所有关系与地域含义，语言自然，也不额外限定为“故土”或某一王国。
- source_word: captiuum duxit / transtulit
  choice: 掳去／带过
  rationale: 分别表达被强制掳走与被转移过河，保留两个动作的递进。
- source_word: trans flumen
  choice: 带过大河
  rationale: 拉丁文仅作 flumen，没有明说河名；“大河”符合圣经语域，同时不在正文中擅自补成“幼发拉底河”。
- source_word: in terram aliam
  choice: 迁到另一片土地
  rationale: 保留 aliam 的不确定性，不把目的地具体化。
theological_decisions:
- issue: 王名 Iosiae 与多语种古译所见何细亚之间的文本差异
  choice: 正文采用“何细亚”，并以脚注说明拉丁文本作“约西亚”
  alternative: 正文依现存拉丁文译作“约西亚”
  rationale: 本句叙述北方十支派被亚述掳走；叙利亚文、埃塞俄比亚文和阿拉伯文古译保存与该历史语境相符的“何细亚”，显示拉丁文 Iosiae 很可能是传抄讹误。脚注明示拉丁读法，以免掩盖文本证据。
translation_notes:
  register: 采用庄重而清楚的现代汉语。“这些人就是十个支派”承接上文指代；以分号和两个短句理清拉丁文较长的结构。王名使用现代中文圣经中通行的“何细亚”和“撒缦以色”。
