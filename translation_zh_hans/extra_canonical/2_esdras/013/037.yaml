revisions:
- from: 但他[37]，就是我的儿子，要斥责那些已经来到的列国和他们的不虔之行，就是那些如暴风般逼近的；他还要当面痛斥他们邪恶的意念和种种折磨[a]，
  to: 但他[37]，我的儿子，要斥责那些已经来到的列国的不虔之行，就是那些如暴风般逼近的恶行；他还要当面痛斥他们邪恶的意念和种种折磨[a]，
  rationale: 修正 arguet 的句法范围，使“列国”限定“不虔之行”而不被提升为并列宾语；以“恶行”承接原文中指回 impietates 的 has，保留其同位和暴风意象的困难性。末句保留“种种折磨”的施受关系歧义及与下节相连的句末逗号。
