  text: Ipse autem filius meus arguet quae aduenerunt gentes impietates eorum, has quae tempestati adpropiauerunt, et inproperabit coram eis mala cogitamenta eorum et cruciamenta,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/037.yaml
  text: But he[37], my Son, will rebuke the impieties of the nations that have come, these things that have drawn near like a storm; and he will reproach them to their faces with their evil thoughts and torments[a],
translation:
  language: zh_hans
  text: 但他[37]，我的儿子，要斥责那些已经来到的列国的不虔之行，就是那些如暴风般逼近的恶行；他还要当面痛斥他们邪恶的意念和种种折磨[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: '37'
    text: 这里的解释把“锡安山”和“非人手凿成的山”联系在一起。这个意象有意呼应由上帝造就或启示的圣洁之地，而不是人力修筑的普通山岭。
    reason: cross_reference
  - marker: a
    text: 或译：“他还要把他们邪恶的意念和种种折磨摆在他们面前。”
    reason: previous_rendering
lexical_decisions:
- source_word: arguet
  choice: 斥责
  rationale: 保留该动词揭露、责备罪行的审判语气；比单纯的“指出”更符合上下文。
- source_word: impietates
  choice: 不虔之行
  rationale: 既表达对上帝的不敬虔，也使复数所指的具体恶行在现代汉语中自然可懂。
- source_word: tempestati adpropiauerunt
  choice: 如暴风般逼近
  rationale: 依照上下文表达列国来势汹汹的暴风意象，同时避免生硬直译为“逼近暴风”；拉丁语句法本身较为参差。
- source_word: inproperabit coram eis
  choice: 当面痛斥他们
  rationale: inproperabit 含责骂、严厉斥责之意，coram eis 表示在他们面前、当着他们的面。
- source_word: cruciamenta
  choice: 种种折磨
  rationale: 保留其“折磨、苦刑”的基本义，不擅自判定这是他们施加的折磨还是将临到他们的刑罚。
theological_decisions:
- issue: “我的儿子”的身份称谓
  choice: 我的儿子
  alternative: 我儿
  rationale: 直译 filius meus，不额外加入基督论称号或解释。
- issue: mala cogitamenta eorum et cruciamenta 的归属关系
  choice: 他们邪恶的意念和种种折磨
  alternative: 他们邪恶的意念和他们所受的刑罚
  rationale: 拉丁文只用 eorum 明确修饰“意念”，未明确说明“折磨”的施受关系，因此不在正文中替作者消除歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是那些如暴风般逼近的”保留原文略显突兀的同位结构和暴风意象；句末逗号依照所给拉丁文本，表明句意仍与下节相连。
