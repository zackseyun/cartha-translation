    issue: “飞到山上”将 volavit super eum 译为抵达山上。
    rationale: 原文只说他在／越过那山之上飞行（super eum）；没有明说落在山上或到达山上。为保留原文的空间歧义及动作画面，宜译作“在山上飞行”。
  - severity: low
    issue: “我观看”不如“我看见”符合 vidi 的叙事性完成动作。
    rationale: vidi 是“我看见”；“我看见，看哪”在现代庄重汉语中自然，并保留异象叙事的突现效果。
