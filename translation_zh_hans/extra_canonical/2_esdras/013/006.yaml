  text: And I looked, and behold, he carved out for himself a great mountain and flew upon it.
translation:
  language: zh_hans
  text: 我看见，看哪，他为自己凿出一座大山，在山上飞行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vidi
  choice: 我观看
  rationale: 保留异象叙事中主动注视的语气，比单纯的“我看见”更能体现观看过程。
- source_word: ecce
  choice: 看哪
  rationale: 保留原文提示读者注意突现景象的庄重语气。
- source_word: sibimet ipso
  choice: 为自己
  rationale: sibimet 带强调意味；现代汉语以“为自己”自然表达其反身含义，不生硬重复“他自己”。
- source_word: sculpsit
  choice: 凿出
  rationale: 表达从材料中雕凿、刻削成形的动作，也保留大山以非寻常方式形成的强烈意象。
- source_word: montem magnum
  choice: 一座大山
  rationale: 符合现代汉语量词习惯，并准确保留山之宏大。
- source_word: volavit super eum
  choice: 飞到山上
  rationale: super 后接宾格，含朝向其上而去的动态；“飞到山上”自然表达飞临并抵达山上的画面，且不额外加入原文没有的“向上”。
theological_decisions:
- issue: 异象中人物造山并飞到其上的超自然描写
  choice: 按原文直译为“凿出一座大山，又飞到山上”
  alternative: 将大山解释为象征性的国度、权势或避难所
  rationale: 本节只陈述异象画面，未在此处给出解释；译文不提前引入特定神学释义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；以“我观看，看哪”保留异象文学的节奏，以“凿出”“飞到山上”呈现连续、鲜明的动作。
