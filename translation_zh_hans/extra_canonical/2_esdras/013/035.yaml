  text: wanting to come and attack him[a].
translation:
  language: zh_hans
  text: 想要前来攻打他。他自己却要站在[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在此处未完，接续下一节。
    reason: 所给拉丁文本以介词 super 结束，其宾语位于后文；脚注提示读者这是跨节句法，而非中文残句或漏译。
lexical_decisions:
- source_word: uolentes uenire
  choice: 想要前来
  rationale: 保留分词结构所表达的意图，并自然承接上文所指的人群。
- source_word: expugnare eum
  choice: 攻取他
  rationale: expugnare 不仅指发动攻击，也含以武力攻克、制伏之意；“攻取”比单纯“攻击”更充分地传达这一语义，同时不预断行动必然成功。
- source_word: Ipse autem stabit super
  choice: 至于他，却要站在
  rationale: 按所给拉丁文本译出本节末尾跨句未完的结构；ipse 带强调，autem 表转折，super 的宾语应在后文出现，故不擅自补足。
theological_decisions:
- issue: 是否将 expugnare 译成已经成功征服
  choice: 译作“攻取”，表达企图以武力攻克
  alternative: “征服他”或“攻击他”
  rationale: “征服”容易暗示结果已经或必将实现，“攻击”则弱化了 expugnare 所含的攻克意味；“攻取”保留行动目标与结果未定之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“攻取”保留军事语境及攻克意图；结尾刻意维持原文跨节未完的句法，并以脚注说明。
