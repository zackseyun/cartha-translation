  source_fidelity: “攻取他”试图表达 expugnare 的攻克目标，但在现代汉语中“攻取”通常以城邑、土地等为宾语，用于人称代词较不自然。此处可译为“攻打他”，表达他们前来以武力对付他的意图，而不误示行动已经成功。句末的“站在”忠实保留了拉丁文 stabit super 的跨节未完结构。
  naturalness: “想要前来攻打他”比“想要前来攻取他”更符合现代标准汉语。为保留 ipse 的强调和 autem 的转折，采用“他自己却要”。末尾虽因跨节而悬置，脚注已作必要说明。
  terminology: “攻打”在此是对 expugnare 的自然、审慎处理：保留军事敌对行动及攻克意图，但不将未实现的企图译成既成的“征服”。
  issues:
  - severity: medium
    issue: “攻取他”搭配不够自然。
    rationale: 现代汉语的“攻取”多用于攻占城池、土地或据点；以“他”为宾语显得生硬。译作“攻打他”既自然，也不把原文意图性不定式误译为成功结果。
  - severity: low
    issue: “至于他，却要”对 ipse autem 的处理稍显松散。
    rationale: “他自己却要”更直接体现 ipse 的强调及 autem 的转折。
