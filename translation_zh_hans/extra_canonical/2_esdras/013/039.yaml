  text: And as for your seeing him gathering to himself another peaceful multitude[a], these are the ten tribes that were taken captive from
translation:
  language: zh_hans
  text: 至于你看见他把另一群和平的人聚集到自己那里[a]，他们就是被掳离……的十个支派。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“另一群安宁的人”。
    reason: pacificam 既可侧重“和平的”，也可表示“安宁的”；正文保留较直接的译法，脚注提示语义范围。
lexical_decisions:
- source_word: colligentem ad se
  choice: 把……聚集到自己那里
  rationale: 保留拉丁文“聚集归向自己”的方向性，同时使用自然的现代汉语表达。
- source_word: aliam multitudinem pacificam
  choice: 另一群和平的人
  rationale: multitudo 指一大群人；pacifica 可描述这群人和平、安宁的性质。译作“和平的人”既通顺，也不额外限定为他们主动缔造和平。
- source_word: decem tribus
  choice: 十个支派
  rationale: 按以色列宗族历史语境，将 tribus 译为“支派”。
- source_word: captiuae factae sunt de
  choice: 被掳离……
  rationale: captiuae factae sunt 表示成为俘虏、被掳；句末 de 的宾语延续到下一节，因此用省略号保留原文在本节边界处未完的句法。
theological_decisions:
- issue: “和平的群众”与十支派的关系
  choice: 直接译为“他们就是……十个支派”
  alternative: 将“和平的人”解释为得救者或末世群体
  rationale: 拉丁文 Haec sunt 明确指认前述群体，但没有进一步说明其神学身份或状态，故不增添解释。
- issue: 本节末尾未完成的 de 短语
  choice: 以“被掳离……的”保留悬接
  alternative: 从下一节补入 de 的宾语，使本节成为完整句
  rationale: 所给拉丁文本在 de 处截断；按指定经节边界翻译，不提前移入下一节内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于你看见……”对应异象解释的承接结构；末尾省略号有意反映源文本在本节结束处句意未完。
