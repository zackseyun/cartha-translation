  text: nation against nation[a], and kingdom against kingdom. And it shall be, when these things happen, and the signs occur that I showed you before, then
translation:
  language: zh_hans
  text: 民族与民族相争，国度与国度敌对。当这些事发生、我先前向你显示的征兆出现时，那时……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gens ad gentem
  choice: 民族攻击民族
  rationale: gens在此指具有群体身份的民族或邦族；结合末世性固定表达及下一句的平行结构，译作“民族”比泛指的“人”更准确。介词ad在敌对语境中表达对抗，译作“攻击”使现代汉语自然，并与adversus相呼应。
- source_word: regnum aduersus regnum
  choice: 国度攻击国度
  rationale: regnum指王权统治下的国家或国度；采用“国度”保留经文语体。adversus明确表达敌对关系，译作“攻击”。
- source_word: Et erit cum fient haec
  choice: 到这些事发生……时
  rationale: 将拉丁语存在式结构按现代汉语的时间句式表达，同时保留其预告语气。
- source_word: contingent signa quae ante ostendi tibi
  choice: 我先前指给你看的那些征兆出现
  rationale: signa在异象和末世语境中译作“征兆”；ostendi保留“指给……看”的视觉启示意味。
- source_word: et tunc
  choice: 那时……
  rationale: 原句止于承接词tunc，显然延续至下一节；保留未完句式，不擅自补足内容。
theological_decisions:
- issue: gens的群体含义
  choice: 民族
  alternative: 人民／族群
  rationale: “民族”能体现gens作为政治或族裔共同体的含义，也符合“民族攻击民族、国度攻击国度”的末世性平行表达；脚注保留“族群”的可能译法。
- issue: 本节结尾的不完整句法
  choice: 以省略号保留“那时”的悬置
  alternative: 补入下一节谓语使句子完整
  rationale: 拉丁文本本节确实止于et tunc；不提前引入下一节内容，以保持分节和原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。保留“民族……国度……”的平行结构，并用省略号显示本节在“那时”之后尚未说完。
