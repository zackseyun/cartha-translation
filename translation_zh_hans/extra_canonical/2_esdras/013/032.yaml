review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了“gens ad gentem / regnum adversus regnum”的群体—国度平行，以及随后“这些事发生”和先前所示征兆出现的双重时间条件；句末“et tunc”未擅自补足下一节内容。不过，“攻击”将“against”的对抗关系具体化为军事行动，较原文略强；两处介词虽有差别，但均可用较宽泛的相争／敌对表达。
  naturalness: “民族攻击民族，国度攻击国度”可懂，但现代汉语中“与……相争／与……敌对”更自然地表达这一固定的末世性对抗句式，也避免把民族或国度误解为单向施袭者。“当……时，那时……”能保留原文刻意重复的承接与未完句法。
  terminology: “民族”对应gens合适，“国度”对应regnum并保留庄重经文语体；“征兆”适合signa。将“指给你看的”调整为“向你显示的”，更符合启示／异象语境中的ostendi tibi，也更自然。
