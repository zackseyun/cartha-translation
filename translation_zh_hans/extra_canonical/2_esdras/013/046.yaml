  text: Then they lived there until the last time[46]; and now they have begun to come again; again the Most High has stopped up the channels of the river[a], so that they can cross.
translation:
  language: zh_hans
  text: 他们一直住在那里，直到末后的时候；如今，他们又开始前来。至高者再次使河流的水道断流，好让他们渡过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: usque in nouissimo tempore
  choice: 直到末后的时期
  rationale: 保留单数“时期”的末世意味；避免译成“上一次”，也不把原文扩展为复数的“末世时期”。
- source_word: iterum coeperunt uenire
  choice: 又开始前来
  rationale: 以“又”对应 iterum，以“开始”对应 coeperunt；uenire 只表示“来、前来”，不擅自补成“归来”。
- source_word: uenas fluminis
  choice: 河道
  rationale: 字面为河流的“脉络、水道”，现代汉语用“河道”既自然，又保留复数水道的整体概念。
- source_word: statuit
  choice: 使……停流
  rationale: 结合渡河语境表达水流被止住；比直译为“设立”更符合此处动作结果，同时不具体化为筑坝或堵塞。
- source_word: ut possint transire
  choice: 好让他们渡过
  rationale: 表达目的与可能性；在河流语境中 transire 自然译为“渡过”。
theological_decisions:
- issue: nouissimo tempore 的末世含义
  choice: 末后的时期
  alternative: 最后一次
  rationale: 此处 tempore 是单数的“时期、时刻”，语境具有终末指向；“最后一次”会误导读者理解为此前某一次事件。
- issue: 至高者止住河水的方式
  choice: 使河道停流
  alternative: 堵住河道
  rationale: 原文没有说明具体手段；采用结果性表达，既保留神主动施行的意思，也不添加筑坝、填塞等细节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号保留前后时序的紧密联系，句号则清楚区分至高者的行动。英文咨询层中的脚注“46”谈及本节未出现的地名 Arzareth，脚注 a 的内容也与其所标位置不相符，因此均未纳入正文或脚注。
