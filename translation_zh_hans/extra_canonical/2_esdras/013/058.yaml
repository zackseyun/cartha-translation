id: 2ES.13.58
reference: 2 Esdras 13:58
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quoniam gubernat tempora et quae sunt in temporibus inlata. et sedi ibi tribus diebus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/058.yaml
  text: and because he governs the times and the things that are brought about in the times[a]. And I sat there for three days.
translation:
  language: zh_hans
  text: 也因为他掌管时期，以及各时期中所发生的事[a]。我在那里坐了三天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有先前译法把上一节的内容并入本节：“我就离开那里，走到田野，因至高者在各时期所行的奇事，极力荣耀并赞美他，也因为他掌管时期，以及各时期中所发生的事。我在那里坐了三天。”
    reason: 说明先前译法的节界差异；所给拉丁文本的本节只从“也因为他掌管时期”开始。
lexical_decisions:
- source_word: gubernat
  choice: 掌管
  rationale: 表达治理、支配之意，既自然庄重，也保留主语对时期及其中事件的统辖含义。
- source_word: tempora
  choice: 时期
  rationale: 此处指不同的时段或时代；译作“时期”可与下文重复出现的 temporibus 保持词义呼应。
- source_word: quae sunt in temporibus inlata
  choice: 各时期中所发生的事
  rationale: inlata 是被动分词，字面可指被带入、被引入其中的事；汉语用“所发生的事”较自然，同时避免擅自指定施事者。
- source_word: sedi
  choice: 坐了
  rationale: 按拉丁文 sedeo 的直接含义翻译，不扩展为停留或居住。
theological_decisions:
- issue: 谁掌管时期及其中发生的事
  choice: 保留代词“他”
  alternative: 明确译为“至高者”或“上帝”
  rationale: 本节拉丁文仅以动词第三人称单数承接上文；保留“他”可避免在本节内补入原文未明说的称谓。
- issue: inlata 是否暗示神使事件发生
  choice: 译为“所发生的事”
  alternative: 译为“他在各时期所成就的事”或“被带入各时期的事”
  rationale: 原文为被动表达，未明确施事者；译文保留这种含蓄，不将神学因果关系说得比原文更确定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“掌管时期”保留原文重复的 tempora/temporibus，并让本节以“也因为”开头，以忠实反映其承接上文的句法。
