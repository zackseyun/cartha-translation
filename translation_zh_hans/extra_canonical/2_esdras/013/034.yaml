  text: and an innumerable multitude will be gathered into one, as you saw,
translation:
  language: zh_hans
  text: 又有不可胜数的群众将被聚集成一体，正如你所看见的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: colligetur in unum
  choice: 将聚成一体
  rationale: 既表达被聚集的将来被动含义，也直接保留“归于一体”的语义，比仅译为“聚集起来”更贴近原文。
- source_word: multitudo innumerabilis
  choice: 不可胜数的群众
  rationale: “不可胜数”准确传达 innumerabilis；“群众”自然表达 multitudo 所指人数众多的一群人。
- source_word: sicut uidisti
  choice: 正如你所看见的
  rationale: 按原文保留对先前异象所见的明确回指。
theological_decisions:
- issue: “聚成一体”是否暗示神学或组织意义上的合一
  choice: 保留原文“聚成一体”的表述，不具体说明合一的性质
  alternative: 聚集起来
  rationale: 拉丁文 in unum 明确带有“归于一个整体”的意味，但上下文本句并未界定这种一体性；译文应保留其张力而不作教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；“又有”承接句首 Et，并保持本节作为连续长句一部分的语感。
