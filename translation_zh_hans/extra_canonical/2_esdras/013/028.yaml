  text: 'et quoniam non tenebat frameam neque vas bellicosum, corrumpitenim impetum eius multitudinis quae venerat ad expugnare eum, haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/028.yaml
  text: 'and that he held neither sword nor weapon of war, yet destroyed the assault of the multitude that had come to attack him, this is the interpretation:'
translation:
  language: zh_hans
  text: 至于他既没有持剑，也没有作战的兵器，却摧毁了那群前来攻击他的人的攻势，其解释如下：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: frameam
  choice: 刀剑
  rationale: 此处指剑一类的手持利刃；译作“刀剑”既符合上下文，也避免现代汉语中单用“剑”可能显得过于特定。
- source_word: vas bellicosum
  choice: 作战的兵器
  rationale: 拉丁语直译近于“战争器具”，在此泛指武器；采用自然而庄重的现代汉语表达。
- source_word: corrumpit ... impetum
  choice: 摧毁了……的攻势
  rationale: 保留 corrumpit 的强烈破坏意味，并将 impetum 按敌对群众发动的攻击译为“攻势”。
- source_word: multitudinis
  choice: 众人
  rationale: 指聚集而来攻击他的庞大人群；“众人”比“群众”更适合经文语体。
- source_word: ad expugnare eum
  choice: 前来攻打他
  rationale: 表达以武力攻击、意图战胜他的含义，同时保持汉语流畅。
- source_word: haec interpretatio
  choice: 其解释如下
  rationale: 这是引出下文解释的固定过渡语，译法简洁自然。
theological_decisions:
- issue: 无武器却击溃敌方攻势的方式
  choice: 仅陈述他没有兵器却摧毁攻势
  alternative: 明确说他以超自然能力或言语摧毁敌人
  rationale: 本节本身没有说明摧毁攻势的具体方式；保留原文的叙事张力，不提前引入下文或特定神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。句式保留原文“至于……其解释如下”的承上启下功能；不增补原文未明说的行动方式。
