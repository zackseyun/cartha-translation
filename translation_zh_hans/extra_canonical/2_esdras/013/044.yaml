  yaml_path: translation/extra_canonical/2_esdras/013/044.yaml
  text: For then the Most High performed signs, and held back the channels of the river until they had crossed.
translation:
  language: zh_hans
  text: 因为那时，至高者施行神迹，止住河流的各条水道，直到他们过去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  choice: 至高者
  rationale: 保留这一神圣称号的名词性形式，符合现代汉语圣经语体。
- source_word: signa
  choice: 神迹
  rationale: 此处指至高者所施行的超自然征兆；译作“神迹”比泛称“征兆”更符合语境。
- source_word: statuit
  choice: 止住
  rationale: 该动词在此表达使河道停住、受阻，译作“止住”简洁自然，且不额外说明具体方式。
- source_word: uenas fluminis
  choice: 河流的各条水道
  rationale: uenas为复数，字面有“脉络、支流、水道”之意；此译保留复数意象，同时以现代汉语表达河流的通道。
- source_word: usquequo transirent
  choice: 直到他们都过去
  rationale: 保留未明确宾语的“过去/渡过”表达；“他们”来自动词第三人称复数，“都”自然呈现群体完成通行之意。
theological_decisions:
- issue: signa的语义强度
  choice: 神迹
  alternative: 征兆
  rationale: 上下文将河道受阻归于至高者的作为，因此“神迹”准确表达其超自然行动，但不对神迹的机制作进一步解释。
- issue: 河道停止的具体方式
  choice: 止住河流的各条水道
  alternative: 截断河水
  rationale: 拉丁文只说使河流的水道停住，并未明确是分开、干涸还是筑坝；采用较中性的“止住”以保留原文余地。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“至高者”保留原文称号；整体句式简洁，适合叙事经文朗读。原始拉丁摘录在signa处呈省略式，但依语法残迹、上下文及审校英文层，以“施行神迹”自然补足汉语谓语。
