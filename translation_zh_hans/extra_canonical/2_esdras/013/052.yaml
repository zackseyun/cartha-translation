source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut non potest hoc vel scrutinare vel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram videre Filium meum vel eos qui cum eo sunt nisi in tempore diei.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/052.yaml
  text: And he said to me, “Just as no one can search out or know what is in the depths of the sea, so no one on earth can see my Son, or those who are with him, except at the time of that day.”
translation:
  language: zh_hans
  text: 他对我说：“正如没有人能探究或知道海的深处有什么，地上也没有人能看见我的儿子，或那些与他同在的人；唯有在那日的时候才可以。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinare
  choice: 探究
  rationale: 表达仔细查明、探察之意，并与后面的“知道”形成自然并列。
- source_word: in profundo maris
  choice: 海的深处
  rationale: 忠实保留空间意象，同时符合现代汉语表达。
- source_word: Filium meum
  choice: 我的儿子
  rationale: 按拉丁文直译，保留其称谓与神学含义，不额外加上解释性头衔。
- source_word: nisi in tempore diei
  choice: 除非到了那日的时候
  rationale: 保留“时候”与“日”两个成分，并将定指性自然表达为“那日”，避免解释成“他的日子”。
theological_decisions:
- issue: “我的儿子”的身份与称谓
  choice: 我的儿子
  alternative: 我儿／我的圣子
  rationale: 原文仅有 Filium meum；采用普通而庄重的直译，不添加原文没有的敬称或教派化措辞。
- issue: 末句所指的时间
  choice: 那日的时候
  alternative: 他的日子／那一天
  rationale: 拉丁文 diei 本身没有明确的物主成分；译作“那日”保留末世语境中的指向，同时不把它明确归属于“儿子”。
- issue: “或那些与他同在的人”的逻辑范围
  choice: 看见我的儿子，或那些与他同在的人
  alternative: 看见我的儿子和那些与他同在的人
  rationale: 保留原文 vel 的“或”及其可能的分列意味，不擅自改成合取关系。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；句式尽量贴近拉丁文的对称比较结构，同时避免生硬欧化。
