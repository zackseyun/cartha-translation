  text: 因为你所说的那些被留下的人和那些没有被留下的人，解释如下：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: 因为
  rationale: 保留因果连接，承接上文，贴近拉丁文的论述推进。
- source_word: derelicti sunt
  choice: 被留下的人
  rationale: 用被动表达保留原文状态含义及其潜在歧义，不擅自解释为“幸存”或“被遗弃”。
- source_word: non derelicti sunt
  choice: 没有被留下的人
  rationale: 与前一短语形成清楚而对称的否定，不额外判定这些人的结局。
- source_word: haec interpretatio
  choice: 解释如下
  rationale: 符合现代汉语引出后续说明的自然表达，并保留冒号所表示的承接关系。
theological_decisions:
- issue: “被留下”可能指存留、幸存，也可能带有被遗留之意
  choice: 被留下的人
  alternative: 幸存的人／被遗弃的人
  rationale: 上下文之外，拉丁词组本身不足以排除这些含义；采用较直译的中性措辞，以保存神学与叙事上的张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语；句式简洁，并以冒号引出下一节的解释。
