  text: et regnabit quem non sperant qui inhabitant super terram; et volatilia conmigrationem facient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/006.yaml
  text: And one whom those who dwell on the earth do not expect will reign, and the birds will migrate.
translation:
  language: zh_hans
  text: 地上的居民所意想不到的那一位必掌权，飞鸟也必迁徙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnabit
  choice: 必掌权
  rationale: 表达“作王、统治”的核心含义，同时避免在身份未明时额外补入“王”这一称号。
- source_word: quem non sperant
  choice: 所意想不到的那一位
  rationale: 拉丁语 sperant 可指盼望或期待；此处保留“未曾料想、并不期待”的语义范围，不说明这种期待是正面盼望还是中性预期。
- source_word: qui inhabitant super terram
  choice: 地上的居民
  rationale: 以自然简洁的现代汉语表达“居住在地上的人”。
- source_word: volatilia
  choice: 飞鸟
  rationale: 在此语境中自然表达能飞的鸟类。
- source_word: conmigrationem facient
  choice: 必迁徙
  rationale: 准确传达“进行迁移”；不添加原文未明确要求的“一同”。
theological_decisions:
- issue: 掌权者的身份
  choice: 译作“那一位”，不指明其身份
  alternative: 补译为“那位王”或认定为某一末世人物
  rationale: 原文只用关系代词指称此人，没有明说其身份；译文保留这种含混性。
- issue: sperant 的情感色彩
  choice: 译作“意想不到”
  alternative: “不盼望”或“不期待”
  rationale: “意想不到”较自然地覆盖未预料、未期待之意，又不把该群体对掌权者的态度限定为盼望或拒绝。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；两个分句以逗号连接，保留预言式并列结构。未增添“共同迁徙”等源文没有明确表达的内容。
