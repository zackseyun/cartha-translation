source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit inconposita vestigio quam nunc vides regnare regionem, et videbunt eam desertam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/003.yaml
  text: And the region that you now see ruling will be a trackless waste, and they will see it desolate.
translation:
  language: zh_hans
  text: 你现在所看见掌权的地区，将成为一片杳无人迹的荒地；人们将看见它一片荒凉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regionem
  choice: 地区
  rationale: 对应拉丁文所指的地域范围；比“土地”更贴近原词，也避免误解为土壤或地产。
- source_word: regnare
  choice: 掌权
  rationale: 保留“统治、掌权”的明确政治意象，不把它弱化为单纯的兴盛或居于优势。
- source_word: inconposita vestigio
  choice: 无路可走的荒野
  rationale: 该表达在拉丁文中较为生硬，语义涉及没有足迹、路径或无法通行；此译法自然呈现“trackless”的核心图景，同时以“荒野”配合后文的荒凉景象。
- source_word: desertam
  choice: 一片荒凉
  rationale: 表达被看见时处于荒废、无人烟的状态；不加入“遭毁灭”等原文未明说的致因。
theological_decisions:
- issue: “地区掌权”的拟人化政治意象
  choice: 保留“掌权”
  alternative: 译作“占优势”或“兴盛”
  rationale: 原文 regnare 直接表达统治，不宜替读者解释其具体所指或削弱其末世政治张力。
- issue: 荒凉状态是否由外力造成
  choice: 只译状态，不说明原因
  alternative: 译作“被毁成荒地”
  rationale: desertam 说明荒凉、荒废，并未明确施事者或毁坏方式，故保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你现在所看见掌权的地区”有意保留原文略显突出的拟人结构；分号连接未来的转变与人们所见的结果。
