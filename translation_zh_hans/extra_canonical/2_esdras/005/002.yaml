  text: And unrighteousness will be multiplied beyond what you yourself see, and beyond what you heard long ago.
translation:
  language: zh_hans
  text: 不义将增多，超出你自己所见的，也超出你从前所听闻的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicabitur
  choice: 将日益增多
  rationale: 表达拉丁语将来时被动形式所指的不义不断增加；汉语不必机械保留被动语态。
- source_word: iniustitia
  choice: 不义
  rationale: 采用庄重而通行的圣经用语，涵盖不公与邪恶行为。
- source_word: super ... et super ...
  choice: 超过……也超过……
  rationale: 保留两个并列比较结构，以及不义增长到超出既往所见所闻的含义。
- source_word: quam ipse tu vides
  choice: 你亲眼所见的
  rationale: 以“亲眼”自然传达 ipse tu 的强调意味，同时不添加原文没有的“如今”。
- source_word: quam audisti olim
  choice: 你从前所听闻的
  rationale: olim 表示从前、昔日；“听闻”自然表达 audisti 在此语境中的意思。
