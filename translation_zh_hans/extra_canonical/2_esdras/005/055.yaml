source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: his qui ante uos, Et qui post uos quam et uos, quasi iam senescentis creaturae et fortitudinem iuuentutis praeterientis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/055.yaml
  text: 'Therefore consider also for yourself: you are smaller in stature than those before you, and those who come after you will be smaller than you, as of a creation already growing old and passing beyond the strength of youth.'
translation:
  language: zh_hans
  text: 所以，你也当想一想：你的身量不及你以前的人；你以后的人在身量上也将不及你。这仿佛受造界已经渐渐衰老，正在越过青春强盛的时期。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: his qui ante uos
  choice: 你以前的人
  rationale: 直译时间上的比较对象，保持原文所指的前代之人。
- source_word: qui post uos
  choice: 你以后的人
  rationale: 与“你以前的人”形成清楚而自然的对称，指后来的世代。
- source_word: senescentis creaturae
  choice: 受造界已经日渐衰老
  rationale: creatura 可指整个受造秩序；“日渐衰老”准确表达 senescentis 的持续过程。
- source_word: fortitudinem iuuentutis praeterientis
  choice: 青春的力量也正在消逝
  rationale: 保留“青春之力”的拟人化意象，并以“正在消逝”表达 praeterientis 所含的逝去过程。
theological_decisions:
- issue: 受造界衰老与世代身量递减之间的关系
  choice: 以“这正如”保留类比表达
  alternative: 译作“因为受造界已经日渐衰老”而明确为因果关系
  rationale: 拉丁文 quasi 更直接表示相似或比拟；不把原文可能保留的类比关系收窄为确定的因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“身量”保留原文及英语审校层中的 stature 概念；后句维持受造界衰老、青春力量消逝的诗性意象。
