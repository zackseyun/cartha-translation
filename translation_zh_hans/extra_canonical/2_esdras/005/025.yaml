  text: and from all the depths of the sea you filled for yourself one stream[a], and from all the cities that have been built you sanctified Zion for yourself,
translation:
  language: zh_hans
  text: 你从海中一切深渊里，为自己使一条溪流充盈[a]；又从所有建成的城邑中，为自己将锡安分别为圣，归给自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 先前的译文作：“你从一切受造的飞鸟中，为自己选定了一只鸽子；又从一切被造的牲畜中，为自己预备了一只羊。”此读法对应下一节的拉丁文本，并非本节的异文。
    reason: 保留英文审校轨迹所记录的先前译文，同时更正其并非本节另一文本传统的事实，并使脚注锚点继续明确对应首分句。
lexical_decisions:
- source_word: abyssis maris
  choice: 海的一切深渊
  rationale: 按拉丁文本直译，保留复数与深邃意象。
- source_word: replesti tibi rivum unum
  choice: 为自己充满了一条溪流
  rationale: 保留原文“充满”和“一条溪流”的表达及其不寻常张力，不擅自改成“选出”。
- source_word: aedificatis civitatibus
  choice: 建成的城
  rationale: 自然表达已被建造完成的众城；“城”在此作集合性复数理解。
- source_word: sanctificasti tibimet ipsi Sion
  choice: 为自己把锡安分别为圣
  rationale: “分别为圣”准确传达 sanctificasti 的奉献、圣化含义，并保留强调性的“为自己”。
theological_decisions:
- issue: 锡安被神分别为圣
  choice: 为自己把锡安分别为圣
  alternative: 为自己使锡安成圣
  rationale: 前者较清楚地表达被指定、奉献为圣的含义，同时不进一步界定锡安在此指城市、圣所还是群体。
- issue: “一条溪流”与异文传统
  choice: 正文采用现有拉丁底本的“海的一切深渊……一条溪流”
  alternative: 采用“一只鸽子……一只羊”的先前版本
  rationale: 所给 Bensly 拉丁底本文字明确支持正文读法；另一读法作为既有译本传统保留于脚注，不混入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；平行分句保留原文的礼仪性节奏。正文中的脚注标记[a]与脚注对应。
