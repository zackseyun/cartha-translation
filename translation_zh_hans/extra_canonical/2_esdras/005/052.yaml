  yaml_path: translation/extra_canonical/2_esdras/005/052.yaml
  text: For you will say to her, "Why are those whom you have now borne not like those who came before, but smaller in stature?"
translation:
  language: zh_hans
  text: 你要对她说：“为什么你如今所生的这些人不像从前的那些人，反而身量较小呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: peperisti
  choice: 生下
  rationale: 直译其完成时态及生育含义；“现在生下的”在现代汉语中自然清楚。
- source_word: his qui ante
  choice: 从前那些人
  rationale: 保留原文对先前所生之人的概括比较，不额外限定具体世代。
- source_word: minores statu
  choice: 身量较小
  rationale: statu在此指身体的大小或身量；“身量较小”既保留比较意味，也避免擅自解释为年龄、地位或品格较低。
- source_word: dicet
  choice: 要问
  rationale: 拉丁文引文在此处承接对妇人的发问；用“要问她”符合现代汉语对直接问题的自然引入方式。
