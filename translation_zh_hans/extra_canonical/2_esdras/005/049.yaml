  yaml_path: translation/extra_canonical/2_esdras/005/049.yaml
  text: For just as an infant does not bear children[a], nor does one who has grown old bear any longer, so I ordered the age that I created.'
translation:
  language: zh_hans
  text: 因为，正如婴孩不能生育，年老的妇人也不再生育；我就是这样安排了我所创造的时代。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: infans non parit
  choice: 婴孩不能生育
  rationale: parit 本义为“生育、生产”；保留原文以婴孩不具生育能力为喻的表达，不将其泛化为“结果子”。
- source_word: ea quae senuit adhuc
  choice: 年老的也不再生育
  rationale: 原文省略了第二分句的动词，承接 parit；adhuc 在否定结构中表示“不再”。中文补出“生育”，使句意自然清楚。
- source_word: saeculum
  choice: 世代
  rationale: saeculum 可指时代、世代或世界秩序；此处指受造世界按时期展开的过程，译作“世代”可保留时间层面的含义。
- source_word: disposui
  choice: 安排了
  rationale: 表达设定秩序、作出安排之意，避免译成过强的“命定”而引入额外神学色彩。
theological_decisions:
- issue: 受造秩序与时间进程的表述
  choice: 我就是这样安排了我所创造的世代
  alternative: 我就是这样规定了我所创造的世界
  rationale: 原文 saeculum 兼有“时代”与“世界”之义；上下文用生命阶段作类比，侧重受造秩序的时间进程，因此采用“世代”，同时不把其具体化为某一教义体系。
translation_notes:
  register: 采用庄重而自然的现代汉语。“婴孩不能生育，年老的也不再生育”保留拉丁文对称结构；末句以“安排”呈现受造世代的秩序。引文末尾保留闭引号，以反映本节是前文话语的结尾；拉丁文随后“我便问道……”应属下一节，不纳入本节。
