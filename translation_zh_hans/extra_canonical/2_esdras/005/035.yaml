  text: 'et dixit ad me: non potes. et dixi: quare, domine, aut quidnascebar, aut quare non fiebat matrix matris meae mihi sepulchrum, ut non viderem laborem Iacob et defatigationem generis Israhel?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/035.yaml
  text: And he said to me[a], 'You cannot.' And I said, 'Why, Lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see the trouble of Jacob and the weariness of the stock of Israel?'
translation:
  language: zh_hans
  text: 他对我说：“你不能。”我说：“主啊，为什么？我又为何出生？我母亲的母腹为何没有成为我的坟墓，好让我不必看见雅各的劳苦和以色列族的困乏？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non potes
  choice: 你不能
  rationale: 直译其能力或可能性上的否定，不擅自补出所不能做的具体事项。
- source_word: matrix matris meae
  choice: 我母亲的腹中
  rationale: matrix在此指孕育他的母腹；采用现代汉语自然且庄重的表达。
- source_word: labor Iacob
  choice: 雅各的苦难
  rationale: labor可指劳苦、患难；上下文是以斯拉因目睹民族处境而哀叹，译作“苦难”较贴切。
- source_word: defatigationem
  choice: 困乏
  rationale: 保留因长期劳苦而疲惫不堪的含义，与前面的“苦难”形成相关而不重复的表达。
- source_word: generis Israhel
  choice: 以色列后裔
  rationale: genus在此指族类、血统或后裔；“后裔”是自然中文，并保留群体延续之意。
theological_decisions:
- issue: domine的称谓对象与神学身份
  choice: 主啊
  alternative: 我主啊／先生啊
  rationale: 拉丁文domine是尊称，语境中的具体身份不宜由译文擅自判定；“主啊”保留原文庄重而开放的称谓。
- issue: “母腹成为坟墓”的强烈哀叹
  choice: 按原意保留死亡意象
  alternative: 意译为“为何不胎死腹中”
  rationale: 原文刻意并置母腹与坟墓；保留这一意象能呈现其诗性力度和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与哀叹语体。保留连续的反问和“母腹成为坟墓”的鲜明意象，不依据英文旧脚注制造原文并不存在的异读。
