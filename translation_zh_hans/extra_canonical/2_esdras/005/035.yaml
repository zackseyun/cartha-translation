review_pass:
  verdict: revise
  source_fidelity: “我母亲的腹中”主要指母腹的内部空间，未能准确对应 matrix（子宫、母腹）作为可“成为我的坟墓”的主体；宜改为“我母亲的母腹”。此外，labor 与 defatigationem 并列，分别表达劳苦／患难与疲惫困顿；“雅各的劳苦”和“以色列族的困乏”可较清楚地保留这一区分。其余句法、反问的推进及“你不能”的未明说宾语均忠实于拉丁文。
  naturalness: 原译整体庄重通顺，但“我母亲的腹中没有成为我的坟墓”在现代汉语中略显搭配不当，因为“腹中”通常不是可成为坟墓的实体。“我母亲的母腹为何没有成为我的坟墓”既自然，也保留原文刻意的母腹—坟墓意象。
  terminology: “主啊”适当保留 domine 的敬称开放性；“雅各”“以色列”及“后裔”均无专名问题。为贴近 genus 的群体性并与“雅各”构成对应，采用“以色列族”；“困乏”可传达 defatigationem 所指耗竭、疲惫的状态。
  issues:
  - severity: medium
    issue: matrix matris meae 译为“我母亲的腹中”
    rationale: matrix 指母腹／子宫本身；拉丁文以母腹为“成为我的坟墓”的主语。“腹中”偏指内部位置，弱化并轻微改变了这一比喻的语义结构。
  - severity: low
    issue: labor Iacob 与 defatigationem generis Israhel 的语义区分可更明确
    rationale: “苦难”和“困乏”可以成立，但“劳苦”和“困乏”更直接反映 labor 的辛劳与 defatigationem 的疲惫耗竭，并保留二者并列而不完全重叠的表达。
