lexical_decisions:
- source_word: in nocte secunda
  choice: 第二天夜里
  rationale: 按叙事中的时间顺序自然表达“第二个夜晚”，避免生硬的“第二夜”。
- source_word: Phalthiel
  choice: 法勒铁
  rationale: 按拉丁文名 Phalthiel 音译，并尽量保留其中的辅音结构。
- source_word: dux populi
  choice: 百姓的领袖
  rationale: dux 在此指民众中的领导者，不必强化为军事性的“统帅”。
- source_word: ubi eras
  choice: 你到哪里去了
  rationale: 结合来访者追问对方此前去向的语境，以现代汉语自然表达；拉丁文也可直译为“你在哪里”。
- source_word: quare uultus tuus tristis
  choice: 为什么面带愁容
  rationale: 以自然而庄重的汉语传达“你的面容为何忧伤”。
