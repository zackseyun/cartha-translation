  text: And it happened on the second night that Phaltiel, leader of the people, came to me and said, 'Where were you, and why is your face sad?
translation:
  language: zh_hans
  text: 第二天夜里，百姓的领袖法勒铁来到我这里，对我说：“你到哪里去了？为什么面带愁容？”
