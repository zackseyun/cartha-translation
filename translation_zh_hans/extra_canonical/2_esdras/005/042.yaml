source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'me : coronae adsimilabo iudicium meum ; sicut non nouissimorum tarditas, sic nec priorum uelocitas. Et respondi et dixi :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/042.yaml
  text: 'And he said to me[a], ''I will liken my judgment to a crown: as there is no delay for the last, so there is no haste for the first.'''
translation:
  language: zh_hans
  text: 他对我说：“我要把我的审判比作冠冕[a]：末后者并不迟延，先前者也不迅速。”于是我回答说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冠冕”也可理解为“圆环”或“环”，这样，这个比喻所强调的就是先与后的对称。
    reason: lexical_alternative
lexical_decisions:
- source_word: coronae
  choice: 冠冕
  rationale: 保留拉丁语 corona 的通常含义及其庄重意象；该词也可能指环形之物，故以脚注说明。
- source_word: adsimilabo
  choice: 比作
  rationale: 直接表达“使之相似、拿来类比”的意思，现代汉语自然且不弱化比喻关系。
- source_word: iudicium meum
  choice: 我的审判
  rationale: iudicium 在此可指审判或裁断；“审判”保留其司法及神学张力。
- source_word: nouissimorum tarditas
  choice: 末后者并不迟延
  rationale: 保留复数属格所指对象的概括性，不擅自限定为某一代人；将抽象名词结构转为自然汉语。
- source_word: priorum uelocitas
  choice: 先前者也不迅速
  rationale: 与“末后者并不迟延”形成对称，并保留原文关于先后次序与速度的张力。
- source_word: Et respondi et dixi
  choice: 于是我回答说
  rationale: 完整译出所给拉丁文本末尾的叙事衔接，并以冒号表示话语将在下节继续。
theological_decisions:
- issue: “末后者”与“先前者”的具体所指
  choice: 不补出“世代”“人”或“受审者”
  alternative: 译作“末后的世代”与“先前的世代”
  rationale: 拉丁文仅使用形容词名词化复数，具体所指并未明说；保留这种含混可避免加入解释性限定。
- issue: 冠冕比喻的重点
  choice: 正文采用“冠冕”，脚注说明也可理解为圆环
  alternative: 正文直接译作“圆环”
  rationale: corona 的常用义是冠冕，但其环形意义可能更能凸显首尾对称；正文与脚注共同保留两种可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“末后者／先前者”保持原文的平行结构和指称含混；末尾保留“于是我回答说：”，忠实反映所提供拉丁文本的跨节衔接。
