  text: Rise therefore and eat some bread[a], and do not abandon us like a shepherd his flock into the hands of evil wolves.
translation:
  language: zh_hans
  text: 所以，请起来吃点饼吧[a]；不要抛弃我们，像牧人把自己的羊群丢在恶狼手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧译作：“我对他说：‘离开我，七天之内不要靠近我；之后你可以再来见我。’他听从我的话，就离开了我。”这段文字实际对应下一节，而非本节拉丁文本。
    reason: previous_rendering
lexical_decisions:
- source_word: exsurge
  choice: 起来
  rationale: 准确表达命令式“起身、起来”，并符合现代汉语自然表达。
- source_word: gusta panem alicuius
  choice: 吃点饼吧
  rationale: gusta 在此指吃、尝食；panem 指饼或食物。alicuius 字面可理解为“某人的”，但在此结构中自然表达为不定量的“点”，与语境及审校英文相符。
- source_word: derelinquas nos
  choice: 不要抛弃我们
  rationale: 保留 derelinquere 所表达的撇下、弃置之意。
- source_word: in manibus luporum malignorum
  choice: 丢在恶狼手中
  rationale: 直译其被交由恶狼控制、伤害的形象；“恶狼手中”虽为拟人化表达，却能保留拉丁文的比喻力度。
