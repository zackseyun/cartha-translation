  text: 'uidere. Et dixi: dominator domine, quis enim est qui potest haec scire, nisi qui cum hominibus habitationem non habet?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/038.yaml
  text: And I said, 'Lord, Master, who indeed can know these things, except one who does not dwell among men?'
translation:
  language: zh_hans
  text: 我说：“主宰啊，主啊，除了不与世人同住的那一位，谁能知道这些事呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: 主宰啊，主啊
  rationale: 保留原文两个呼格称谓及其递进语气；“主宰”体现 dominator 的统治权，“主”对应 domine。
- source_word: quis enim est qui potest haec scire
  choice: 谁能知道这些事呢
  rationale: 以自然的现代汉语反问句表达拉丁文强调性的疑问；“这些事”对应 haec。
- source_word: nisi qui cum hominibus habitationem non habet
  choice: 除了不与世人同住的那一位
  rationale: “同住”自然传达 habitationem habet 的居住含义；“世人”在庄重语体中对应 hominibus，并用“那一位”保留所指对象未明说的特点。
theological_decisions:
- issue: “不与世人同住者”的身份
  choice: 不与世人同住的那一位
  alternative: 不住在人间的人／不与人同住者
  rationale: 原文没有明确指明其身份，因此不增补“天使”“上帝”等解释，保留其指代及神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“主宰啊，主啊”保留双重呼告；整体维持原文反问结构，不添加解释性内容。
