    issue: “那些征兆”含有原文未明示的指示限定。
    rationale: de signis autem 只是转换到“征兆”这一话题；没有对应“那些”的限定词。
  - severity: medium
    issue: “遍地”可能把 regio 扩大为全世界，并弱化 sterilis 的荒芜隐喻。
    rationale: regio 指一地域、地区，未明示普世范围；sterilis a fide 的表达不仅是“不再有”，也含在信仰方面荒芜、贫瘠的意象。
  - severity: low
    issue: 脚注未充分呈现 excessus 的语义歧义。
    rationale: “极度惊惶失措”与正文“极大的恐慌”意义过近；可注明“震惊或恍惚”，以保留其可能反映的 ekstatic bewilderment 意涵。
  revised_text: 至于征兆：看哪，日子将到，住在地上的人必陷入极大的恐慌[a]；真理的道路必被隐藏，那地区必在信仰上荒芜。
