- from: 至于那些征兆：看哪，日子将到，住在地上的人必陷入极大的恐慌[a]；真理的道路必被隐藏，遍地必不再有信仰。
  to: 至于征兆：看哪，日子将到，住在地上的人必陷入极大的恐慌[a]；真理的道路必被隐藏，那地区必在信仰上荒芜。
  rationale: 删除无原文依据的“那些”，以“那地区”对应未限定范围的 regio，并用“在信仰上荒芜”保留 sterilis a fide 的地域与荒芜隐喻。更新脚注以更准确保留 disputed excessus 的语义范围。
