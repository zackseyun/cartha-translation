  text: 'de signis autem: ecce dies venient, et adprehendentur qui inhabitant super terram in excessu multo, et abscondetur veritatis via, et sterilis erit a fide regio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/001.yaml
  text: 'But concerning the signs: behold[a], days are coming when those who dwell on the earth will be seized with great terror, and the way of truth will be hidden, and the land will be barren of faith.'
translation:
  language: zh_hans
  text: 至于征兆：看哪，日子将到，住在地上的人必陷入极大的恐慌[a]；真理的道路必被隐藏，那地区必在信仰上荒芜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“陷入极大的震惊或恍惚”。
    reason: 拉丁语 in excessu multo 可能反映含有恐慌、震惊、恍惚或困惑等义的希腊语表达；正文依其启示文学语境采用“恐慌”，脚注保留歧义。
lexical_decisions:
- source_word: de signis autem
  choice: 至于那些征兆
  rationale: 保留话题转换结构；“征兆”自然表达末世语境中的 signa。
- source_word: ecce
  choice: 看哪
  rationale: 保留拉丁文提示听者注意的庄重语气。
- source_word: adprehendentur ... in excessu multo
  choice: 必陷入极大的恐慌
  rationale: adprehendentur 表示被一种状态攫住；excessus 在此启示文学语境中很可能反映表示惊惶、失神的希腊语，因此正文采用“恐慌”，并以脚注保留“惊惶失措”的可能。
- source_word: abscondetur veritatis via
  choice: 真理的道路必被隐藏
  rationale: 尽量保留原文被动式及属格结构，不将“真理”具体化为某种教义体系。
- source_word: sterilis erit a fide regio
  choice: 遍地必不再有信仰
  rationale: sterilis a fide 字面为“在信仰方面贫瘠”；采用自然汉语表达其匮乏之意，同时保留 regio 所指地域的广泛性。
theological_decisions:
- issue: fides 的含义
  choice: 信仰
  alternative: 忠信／信实
  rationale: 拉丁语 fides 可涵盖信仰、信靠与忠信；本句描述土地在 fides 方面荒芜，“信仰”最自然，但不额外限定为特定宗派教义。
- issue: 真理之路被隐藏的施事者
  choice: 保留无施事者的被动表达
  alternative: 上帝使真理的道路隐藏／人找不到真理之路
  rationale: 原文没有说明是谁隐藏，也没有明确解释结果，应保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；以“看哪”“必”保留启示文学的宣告语气。脚注标记已置于相关短语之后。
