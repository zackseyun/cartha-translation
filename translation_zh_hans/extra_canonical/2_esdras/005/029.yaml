base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/029.yaml
  text: And those who opposed your promises have trampled those who believed your covenants[a].
translation:
  language: zh_hans
  text: 那些反对你应许的人，践踏了那些相信你的约的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 早期版本曾将下一节的话误列于此：“如果你憎恶你的百姓，他们就应当受你亲手的管教。”
    reason: 说明既有译本中的错节旧译；正文依本节拉丁文订正。
lexical_decisions:
- source_word: conculcaverunt
  choice: 践踏了
  rationale: 保留拉丁文所表达的强烈压迫意象，既可指实际践踏，也可引申为欺压、蹂躏。
- source_word: qui contradicebant
  choice: 那些反对……的人
  rationale: 准确表达持续抵触、反对之意，且符合现代汉语习惯。
- source_word: sponsionibus tuis
  choice: 你的应许
  rationale: sponsio 在此指郑重作出的承诺；译为“应许”符合经文语域，并与 testamentis 区分。
- source_word: tuis testamentis
  choice: 你所立之约
  rationale: testamentum 在经文语境中常指盟约；加入“所立”使汉语自然，同时不增加宗派性解释。
- source_word: credebant
  choice: 信靠
  rationale: 既保留“相信”的基本意义，也体现人对上帝之约的信赖；不将其过度解释为特定教义概念。
theological_decisions:
- issue: credebant 与 testamentis 的关系
  choice: 信靠你所立之约
  alternative: 相信你的约
  rationale: “信靠”在现代汉语中更自然地表达对上帝之约的信赖，但仍保留拉丁文可理解为“相信”的基本含义。
- issue: 两个关系从句所指的群体
  choice: 明确译为两组人：反对应许者与信靠盟约者
  alternative: 采用可能造成主语关系含混的压缩表达
  rationale: 拉丁文 qui… quique… 的并列结构显示，前一群体实施践踏，后一群体承受践踏。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“应许”与“约”保留经文语域中的关键词区分；句法清晰呈现施事者与受事者。
