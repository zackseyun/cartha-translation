  text: And he said to me, 'So I also gave the womb of the earth to those who were sown upon it in their time.'
translation:
  language: zh_hans
  text: 他对我说：“同样，我也把大地的母腹赐给那些在各自的时日被播种在其上的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terrae
  choice: 大地的
  rationale: 保留土地被人格化为孕育生命之母体的意象，并与“母腹”自然搭配。
- source_word: seminati sunt super eam
  choice: 被播种于其上
  rationale: 保留拉丁文的被动结构和把人比作种子的隐喻，不将其弱化为一般的“居住”或“出生”。
- source_word: per tempus
  choice: 在自己的时日
  rationale: 依照上下文及经审校的英文咨询层，表达这些人各有其相应的时日，同时避免擅自明确为某个特定的预定时刻。
theological_decisions:
- issue: 大地作为孕育生命之母体的比喻
  choice: 母腹
  alternative: 子宫
  rationale: “母腹”既保留孕育意象，也符合庄重、自然的现代汉语经文语体；“子宫”过于解剖学化。
- issue: 人被播种在大地上的被动意象
  choice: 明确保留“被播种”
  alternative: 生在地上
  rationale: 原文的播种隐喻可能承载受造、死亡或复生等多层含义，译文不替读者将其限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而可理解的书面汉语。“于其上”略带经文语体，用以清楚回指“大地”；保留原文较为突出的播种隐喻和时间表达。
