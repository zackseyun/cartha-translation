  text: And he said[a], 'Ask a woman who bears, and she will tell you. For you will say to her, "Why
translation:
  language: zh_hans
  text: 他说[a]：“你问一个生孩子的妇人，她会告诉你。因为你会问她：‘为什么……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他回答我说。”
    reason: 部分传统译法采用较完整的应答公式，但现存拉丁文本此处只有“他说”。
lexical_decisions:
- source_word: interroga
  choice: 你去问
  rationale: 用自然的现代汉语表达拉丁文命令式，同时保留直接吩咐的语气。
- source_word: quae parit
  choice: 一个生孩子的妇人
  rationale: 这是泛指正在生育或经历生产的妇人；用“一个”避免误译为特指。
- source_word: dicet tibi
  choice: 她会告诉你
  rationale: 直接对应将来时，并保持简明自然。
- source_word: Dices enim ei
  choice: 因为你会问她
  rationale: dices 字面为“你会说”，但在向对方提出 quare（为什么）的语境中，汉语用“问”更自然；“因为”保留 enim 的论证衔接。
- source_word: quare
  choice: 为什么
  rationale: 准确表达疑问副词；原文在此截断，译文保留未完句式。
