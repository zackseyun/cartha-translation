  text: and from all the birds that have been created you named for yourself one dove[a], and from all the cattle that have been formed you provided for yourself one sheep,
translation:
  language: zh_hans
  text: 从一切受造的飞鸟中，你为自己指定了一只鸽子；从一切被塑成的牲畜中，你为自己预备了一只羊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex omnibus creatis volatilibus
  choice: 在一切受造的飞鸟中
  rationale: 保留拉丁文“从所有受造的飞鸟中”的范围和创造语义，同时采用自然的现代汉语表达。
- source_word: nominasti tibi
  choice: 你为自己选定了
  rationale: nominare 基本义为“命名、指名”；此处在从众多受造物中特别指定一个的语境中，译作“选定”较自然，并保留“为自己”的关系。
- source_word: columbam unam
  choice: 一只鸽子
  rationale: 直译其单数及强调性的 unam。
- source_word: ex omnibus plasmatis pecoribus
  choice: 在一切被塑造的牲畜中
  rationale: plasmatis 带有塑造、成形之意，译作“被塑造的”以保留与前半句“受造”相近而不完全相同的措辞；pecoribus 在此泛指牲畜。
- source_word: providisti tibi
  choice: 你为自己预备了
  rationale: providere 可表示预见、照料或备妥；此处以“预备”表达为己提供、安排之意，同时避免过度具体化。
- source_word: ovem unam
  choice: 一只羊
  rationale: ovis 可指羊，未明确限定绵羊或母羊，因此采用较宽泛的“一只羊”。
theological_decisions:
- issue: 鸽子与羊是否明确解释为象征特定群体
  choice: 仅保留经文中的动物意象，不在正文中解释其象征对象
  alternative: 将鸽子或羊直接释义为以色列、选民或教会
  rationale: 本节拉丁文本只陈述上帝为自己选定鸽子并预备羊；直接指明象征对象会消除原文保留的诗性与神学张力。
- issue: nominasti 的译法
  choice: 选定
  alternative: 命名／指名
  rationale: “选定”符合从所有飞鸟中取其一的语境，但不把动作扩展为救赎、拣选等更强的教义术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两分句保持平行结构，并以“受造／被塑造”“选定／预备”呈现拉丁文用词的对应与差异。英文脚注所载内容属于下一节的异位旧译，并非本节拉丁原文的文本异读，因此不纳入脚注。
