  text: And I said to him[a], 'Go away from me, and do not come near me until seven days have passed, and then you may come to me.' And he did as I said and withdrew from me.
translation:
  language: zh_hans
  text: 我对他说[a]：“你离开我；在七天满了以前，不要到我这里来。等七天满了以后，你再来见我。”他听从了我的话，便离开了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧译作：“我禁食七天，悲号哭泣，正如天使乌列吩咐我的。”这句话实际反映相邻经节的内容，并不对应本节所给的拉丁原文。
    reason: 保留英文 POB 审校记录所要求的先前译法，同时准确说明其属于经节错位的旧译，不作为本节的替代翻译。
lexical_decisions:
- source_word: vade a me
  choice: 你离开我
  rationale: 准确表达命令对方从说话者身边离开；现代汉语自然，同时保留原文直接而坚决的语气。
- source_word: non ad me accedas usque diebus septem
  choice: 七天之内不要到我这里来
  rationale: 将较不规则的拉丁语时间表达理解为在七天期限内不得接近，避免误译成仅持续七天的动作。
- source_word: et tunc venies ad me
  choice: 七天以后，你再来见我
  rationale: 明示tunc承接前述七天期限；“来见我”自然表达venire ad me在人物交往语境中的含义。
- source_word: audivit ut dixi
  choice: 听从了我的话
  rationale: audire在此不只是听见，而是依言而行；“听从”兼顾听取和顺从，且较“照我说的做了”更贴近原词。
- source_word: recessit a me
  choice: 便离开了我
  rationale: 保留叙事动作及与说话者分开的含义；“便”自然呈现其响应命令的结果。
theological_decisions:
- issue: 英译脚注所载旧译与本节拉丁原文不一致
  choice: 正文依所给拉丁原文翻译以斯拉遣走对方的叙事，并用脚注记录旧译
  alternative: 采用“我禁食七天……”的旧译
  rationale: 旧译对应相邻经节内容，属于历史上的经节错位；正文应以本节现存拉丁原文为准，但按资料要求保留该异文式旧译说明。
- issue: audivit的语义力度
  choice: 译作“听从了我的话”
  alternative: 译作“听见了我所说的”
  rationale: 后接“离开了我”表明对方执行了命令；译为“听从”符合语境，同时不添加神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语保持命令的坚定语气；“七天之内……七天以后”清楚表达期限。脚注标记[a]置于“他说”之后，与所提供英文POB的位置一致。
