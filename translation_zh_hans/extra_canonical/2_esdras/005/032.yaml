  yaml_path: translation/extra_canonical/2_esdras/005/032.yaml
  text: the angel who had come to me on the previous night was with me[a], and he said to me, 'Hear me, and I will instruct you; pay attention to me, and I will add further.'
translation:
  language: zh_hans
  text: 前一夜来到我这里的那位天使在我身边[a]，对我说：“听我说，我要指教你；留心听我，我还要补充。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按另一种旧有分节，本处译作：“我说：‘请说，我主。’他对我说：‘你为以色列心神激荡得太过了吗？难道你爱他，胜过那创造他的吗？’”这段文字在所据拉丁文本中属于后续经文。
    reason: 说明旧有分节及先前译法所反映的经文归属差异，避免读者误以为有关内容被删去。
lexical_decisions:
- source_word: est angelus ad me
  choice: 那位天使在我身边
  rationale: 拉丁文此处字面结构略显生硬；按语境自然表达天使来到或留在叙述者身旁，同时不补入原文没有的动作细节。
- source_word: praeterita nocte
  choice: 前一夜
  rationale: 准确表达相对于当前叙事时点的上一夜，符合现代汉语习惯。
- source_word: audi me
  choice: 听我说
  rationale: 比单说“听我”更自然，同时保留命令语气。
- source_word: instruam te
  choice: 我要指教你
  rationale: 表达 instruere 在此处教导、使人明白之意，语体庄重而通俗。
- source_word: intende mihi
  choice: 留心听我
  rationale: 体现专心注意说话者的要求；补出“听”是汉语语境所需，并与上句形成递进。
- source_word: adiciam
  choice: 我还要接着说
  rationale: 原词意为“增添、继续补充”；宾语省略，译文保留开放性，不擅自指定所增添的内容。
theological_decisions:
- issue: adiciam 所省略宾语的理解
  choice: 我还要接着说
  alternative: 我还要补充更多
  rationale: 两者都可表达“增添”；正文采用更自然且适合直接引语的说法，不把所补充的内容具体化。
- issue: 本节与后续经文的分节错位
  choice: 严格翻译所给拉丁文 5:32 的范围
  alternative: 采用旧译中属于后续经文的问答内容
  rationale: 源文本明确以天使出现及其劝听的话构成本节；不把下一节内容移入正文。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留原文末句未明说宾语的特点；引语使用自然汉语节奏。脚注标记[a]已在正文中出现。
