  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quaeretur a multis et non invenietur, et multiplicabitur iniustitia et incontinentia super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/010.yaml
  text: And it will be sought by many and will not be found, and unrighteousness and lack of self-control will be multiplied on the earth.
translation:
  language: zh_hans
  text: 许多人将寻求，却寻不见；不义和放纵将在地上增多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaeretur
  choice: 将寻求
  rationale: 保留拉丁文无人称被动式所未明说的宾语，不擅自补出“真理”“智慧”等对象；汉语以主动形式自然表达，并由“许多人”承接施事。
- source_word: non invenietur
  choice: 却寻不见
  rationale: 保留所寻之物未明的含混性；用“却”清楚呈现寻求与未找到之间的转折。
- source_word: iniustitia
  choice: 不义
  rationale: 既涵盖不公正，也保留其道德与神学色彩，比单用“不公”范围更广。
- source_word: incontinentia
  choice: 放纵
  rationale: 表达缺乏自制、不能约束欲望或行为的含义，符合上下文中社会败坏的描述。
- source_word: multiplicabitur
  choice: 增多
  rationale: 自然传达数量或程度增长的意思，同时避免生硬直译为“被加倍”。
- source_word: super terram
  choice: 在地上
  rationale: 忠实保留空间范围，指世上的普遍情形。
theological_decisions:
- issue: 所寻求之物的身份
  choice: 不补明宾语
  alternative: 译作“许多人将寻求真理／智慧”
  rationale: 拉丁文本只说“它将被许多人寻求”，本节没有明说对象；补入具体神学概念会消除原文的真实含混。
- issue: incontinentia 的道德范围
  choice: 译作“放纵”
  alternative: 译作“缺乏自制”或“不节制”
  rationale: “放纵”在现代汉语中自然凝练，并保留广义道德失控的意味，不把它局限于某一种具体罪行。
translation_notes:
  register: 采用现代、庄重而简洁的书面普通话。分号对应两个并列的末世性陈述；不添加原文没有的主语或宾语。
