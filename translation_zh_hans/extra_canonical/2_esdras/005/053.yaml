  rationale: 仅将可能误解 nati sunt 的“生下的”改为“出生的”。其余措辞保留原译对两组出生者的对称比较、对“临近老年”的趋近含义，以及原文未说明“不同”具体为何的开放性。英文审校轨迹中的 a 注仅记录先前不完整译文，并非原文异文或需在中文正文设置的注释。
