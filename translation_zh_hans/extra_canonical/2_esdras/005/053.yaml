  text: And she herself will say to you[a], "Different are those born in the strength of youth, and different are those born toward the time of old age, when the womb is failing."
translation:
  language: zh_hans
  text: 她自己也会对你说：“在青春强盛时出生的，和在临近老年、子宫机能衰退时出生的，是不同的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sub tempus senectutis
  choice: 临近老年
  rationale: sub 加宾格可表达趋近某一时期；译作“临近”保留逐渐接近老年的意味，而非静态的“在老年时”。
- source_word: deficiente matrice
  choice: 子宫渐渐衰弱时
  rationale: matrix 在此指生育的子宫；deficiente 表示机能衰退、渐失能力，“渐渐衰弱”既准确又符合现代汉语表达。
- source_word: alii ... et alii
  choice: ……和……是不同的
  rationale: 拉丁语以两组 alii 构成对比，强调两类所生之人的差异；此译保留对称关系并使中文自然。
- source_word: et ipsa
  choice: 她自己也
  rationale: 保留 ipsa 的强调作用和 et 的承接意味，不擅自明确“她”的身份。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。依据经文逻辑完整呈现两类出生者的对比；不补充差异的具体性质，以保留原文未明说之处。
