  text: and women will give birth to monstrous things in menstruation. And in sweet waters salty waters will be found[a], and all friends will make war on one another, and then understanding will be hidden, and insight will withdraw into its storehouse.
translation:
  language: zh_hans
  text: 妇女将生下与月经有关的怪异之物。[a]淡水中会出现咸水；所有朋友都将彼此攻伐。那时，悟性必被隐藏，明辨之力必退入自己的库房；许多人将寻求它，却寻不见。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与月经有关的怪异之物”所据拉丁文 menstruata monstra 含义晦涩。该短语明确带有月经相关的成分，但此成分与“怪异之物”及分娩动作的确切关系并不清楚。
    reason: lexical_alternative
  - marker: b
    text: “它”在拉丁文中没有明示所指，可能指“明辨之力”，也可能概括前面的“悟性”和“明辨之力”。
    reason: referential_ambiguity
lexical_decisions:
- source_word: mulieres parient menstruata monstra
  choice: 妇女将在经期生下怪胎
  rationale: 保留 parient 的“生下”、monstra 的异常或怪异含义，以及 menstruata 与月经相关的成分；同时用脚注说明该短语在现存拉丁文中晦涩，避免把具体关系表达得过于确定。
- source_word: dulcibus aquis salsae
  choice: 淡水中会出现咸水
  rationale: dulcis 与水连用指不咸的淡水，salsae 在语境中省略 aquae，故补出“咸水”。
- source_word: amici omnes semetipsos expugnabunt
  choice: 所有朋友都要彼此争战
  rationale: semetipsos 在复数互指语境中表达相互敌对；expugnabunt 含攻打、征战之意。
- source_word: sensus
  choice: 悟性
  rationale: 此处与 intellectus 并列，指理解、判断的能力；译作“悟性”以保持拟人化抽象名词。
- source_word: intellectus separabitur in promptuarium suum
  choice: 明辨之力必退回自己的库房
  rationale: separabitur 表示离开、退隐，promptuarium 是储藏处或库房；保留原文“自己的库房”这一拟人化意象。
- source_word: queretur a multis et non inuenietur
  choice: 许多人要寻求它，却寻不见
  rationale: 按被动结构自然转为中文主动句；“它”可能回指前述悟性或明辨之力，正文不强行限定，并以脚注提示。
theological_decisions:
- issue: “悟性”与“明辨之力”的关系
  choice: 保留为两个并列且拟人化的概念
  alternative: 将二者合并译作单一的“智慧”
  rationale: 拉丁文分别使用 sensus 与 intellectus，并赋予不同动作；合并会抹去原文结构及其张力。
- issue: 末句代词的回指
  choice: 使用不明确的“它”
  alternative: 明确译成“明辨之力”或“悟性和明辨之力”
  rationale: 拉丁文非人称被动 queretur / inuenietur 没有明示宾语，可能承接最近的 intellectus，也可能概括前述两者，因此保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留末世异象的突兀意象与抽象概念的拟人化。分号和句号用于厘清层次，但不消除原文连续“并且”所形成的推进感。
