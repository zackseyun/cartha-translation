  text: pertransiit iustitia, iustum faciens ? et haec negabit. Et erit in illo tempore, et sperabunt homines et non impetrabunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/012.yaml
  text: Has righteousness passed through[a], or one who does righteousness? And it will say no. And it will be at that time that men will hope and not obtain;
translation:
  language: zh_hans
  text: 公义或行公义的人已经过去了吗？它会回答说：“没有。”到那时，人们虽有盼望，却得不着；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pertransiit
  choice: 已经过去了吗
  rationale: 按完成时形式及问句语境译出；“过去”保留其可指经过、消逝或离去的语义张力。
- source_word: iustitia
  choice: 公义
  rationale: 与智慧文学和末世语境相称，也与后面的“行公义”保持词根关联。
- source_word: iustum faciens
  choice: 行公义的人
  rationale: 按闪语式表达理解为实行公义者，而非“使人称义的人”。
- source_word: negabit
  choice: 回答说：“没有。”
  rationale: 字面为“将否认/说不”；在承接疑问时，现代汉语自然表达为否定回答。
- source_word: sperabunt
  choice: 虽有盼望
  rationale: 表达“将盼望”，并以“虽……却……”自然呈现其与后文落空的反差。
- source_word: non impetrabunt
  choice: 却得不着
  rationale: impetrare 指请求或企求后获得；“得不着”保留对象未明的原文表达。
theological_decisions:
- issue: iustitia 的人格化可能性
  choice: 以“它”承接“公义”作回答主体
  alternative: 将主语理解为“行公义的人”或不明说主语
  rationale: 拉丁文 haec 为阴性单数，更自然回指阴性名词 iustitia；保留公义人格化的修辞，不另作教义化解释。
- issue: 经节开头与前节问题的衔接
  choice: 将两个成分都译成问句
  alternative: 将“公义已经过去”译作陈述或残句
  rationale: 源文问号及上下文表明这是承接前节的疑问；中文独立呈现时补足平行问句最清楚。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留源文突兀的末世性问答，并以分号维持本节末尾尚未完全收束的语势；不纳入属于下一节的内容。
