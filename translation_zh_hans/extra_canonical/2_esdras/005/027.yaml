  to: 你从一切繁多的民族中，为自己得了一个民族；又把众人所认可的律法赐给了这你所渴望的民族。
  rationale: 修订仅调整两处汉语措辞：“繁多”使 multiplicatis populis 的表达更合乎现代庄重汉语；“所渴望的”直接对应 desiderasti，避免“爱慕”的恋爱色彩。保留“得了”“为自己”“一个民族”以及“众人所认可的律法”，以维持原文的句法、强调和未限定的语义范围。英译审计记录中的脚注实际对应下一节，故本节不设脚注。
