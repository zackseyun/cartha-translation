  text: and from all the multiplied peoples you acquired for yourself one people[a], and to this people whom you desired you gave the law approved by all.
translation:
  language: zh_hans
  text: 你从一切繁多的民族中，为自己得了一个民族；又把众人所认可的律法赐给了这你所渴望的民族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicatis populis
  choice: 繁衍增多的民族
  rationale: 保留 multiplicatis 所表达的人口繁衍、数目增加之意，也延续本段“一切民族”与“一个民族”的对比。
- source_word: adquisisti tibi populum unum
  choice: 为自己得了一个民族
  rationale: 直接体现 adquisisti tibi 的取得并归于自己的含义，同时保留 unum 的“一”与 omnibus 的“一切”之间的对照。
- source_word: ab omnibus probatam legem
  choice: 众人所认可的律法
  rationale: 按拉丁文被动结构理解为“被所有人认可/验证的律法”；“认可”较自然，也不把 probatam 过度解释为某种特定神学意义上的证明。
- source_word: desiderasti
  choice: 所爱慕的
  rationale: 兼顾 desiderare 的渴望、珍爱意味；用于上帝与所拣选民族的关系时庄重自然，又不擅自改写为技术性的神学术语。
theological_decisions:
- issue: “一个民族”与“一切民族”的拣选张力
  choice: 保留“从一切……民族中，为自己得了一个民族”的直述
  alternative: 译作“从万民中拣选了你的子民”
  rationale: 原文使用 adquirere 而非明确表示“拣选”的动词，并刻意对照 omnibus 与 unum；因此不以惯用神学措辞替代原文。
- issue: 律法“被众人认可”的范围与性质
  choice: 不进一步说明“众人”是谁，也不把“认可”解释为“完美”或“无可指摘”
  alternative: 译作“赐下了公认完美的律法”
  rationale: ab omnibus 的指代范围在本句中未作限定，probatam 也不必然等于“完美”；保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；重复“民族”以保存拉丁原文 populis／populum／populo 的修辞连贯。未收入英译所附的旧译脚注，因为该文字实际对应下一节的拉丁文，并非本节的文本异读。
