  revision_rationale: 修订将 sustinebit 与 portare 区分为“存续”与“承载”，避免将前者提前译成承载动作；并将“所有现存的人”改为“现存者”，保留 praesentes 的指称范围。其余关键术语和语义取向维持原稿。
