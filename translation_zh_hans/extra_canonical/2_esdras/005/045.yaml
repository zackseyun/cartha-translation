revisions:
- from: 我说：“那么，你怎么对你的仆人说，你要使你所创造的受造界[a]全都同时活过来呢？如果活着的都要同时活着，而受造界也承受得住，那么它现在也能同时承载所有现存的人。”
  to: 我说：“那么，你怎会对你的仆人说：‘你必使你所创造的受造界[a]一同活过来’呢？若活着的都一同活着，受造界也能存续，那么它如今也能一同承载现存者。”
  rationale: 修订将 sustinebit 与 portare 区分为“存续”与“承载”，避免将前者提前译成承载动作；并将“所有现存的人”改为“现存者”，保留 praesentes 的指称范围。其余关键术语和语义取向维持原稿。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:05:55Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确反映了拉丁文的未来语气、creatura 的集合性理解及 in unum 的“一同”含义。不过，“所有现存的人”把 praesentes 限定为“人”，原文仅作名词化的“在场者／现存者”，不宜在正文中增添该限定；sustinebit creatura 也应以“受造界存续／维持得住”为主，而非“承受得住”。
  naturalness: 原文“活着的都要同时活着”虽保留了同根重复，但现代汉语略显生硬；改为“活着的若都一同活着”较自然，仍保留原文刻意的重复。将末句译为“承载现存者”简洁且保留原文未明说其具体所指的余地。
  terminology: “受造界”恰当表现 creatura 在此处的集合性用法，也保留“创造／受造”的词根呼应。“使……活过来”没有过早将 vivificabis 教义化为特定的“复活”术语，处理可取。脚注可保留单数“受造物”的可能。
  issues:
  - severity: medium
    issue: “受造界也承受得住”对 sustinebit 的表达不够准确。
    rationale: sustinebit 的主语是 creatura，主要是受造界本身能够存续、维持，而后一句 portare 才是受造界承载现存者。应分别译出两项近义但不相同的谓语。
  - severity: medium
    issue: “所有现存的人”将 praesentes 窄化为“人”。
    rationale: 拉丁文仅称“现存者／在场者”，尽管语境可能指当下活着的人，正文不应加入原文未明示的类别限定。
  - severity: low
    issue: “活着的都要同时活着”在现代汉语中略显拗口。
    rationale: 可借“若”组织条件句，同时保留 viventes vivent 的重复和强调。
  revised_text: 我说：“那么，你怎会对你的仆人说：‘你必使你所创造的受造界[a]一同活过来’呢？若活着的都一同活着，受造界也能存续，那么它如今也能一同承载现存者。”
