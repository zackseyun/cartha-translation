source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'cabis a te creatam creaturam in unum ? si ergo uiuentes uiuent in unum et sustinebit creatura, poterit et nunc portare praesentes in unum. Et dixit ad me : interroga matricem mulieris et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/045.yaml
  text: And I said[a], “How then did you say to your servant that you will surely give life to the creation created by you all at once? If then the living will live all at once and the creation will endure, it can also now bear those who are present all at once.”
translation:
  language: zh_hans
  text: 我说：“那么，你怎会对你的仆人说：‘你必使你所创造的受造界[a]一同活过来’呢？若活着的都一同活着，受造界也能存续，那么它如今也能一同承载现存者。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你所创造的受造物”。
    reason: 拉丁文 creatura 在形式上可指单个受造物；但本节下文提到复数的“活着的”，且说 creatura 能够承载他们，故正文按集合性含义译为“受造界”。
lexical_decisions:
- source_word: vivificabis
  choice: 使……活过来
  rationale: 保留拉丁文未来时及“使之有生命、复活”的使役含义，同时不预先限定为某一套复活术语。
- source_word: a te creatam creaturam
  choice: 你所创造的受造界
  rationale: 保留creatam与creaturam的同根呼应；结合下文复数的“活着的”，将creatura理解为集合性的整个受造秩序，而不是单个生物。
- source_word: in unum
  choice: 全都同时／同时
  rationale: 此处强调众生共同、同时存在；中文按上下文分别译作“全都同时”和“同时”，避免机械重复而不损失含义。
- source_word: sustinebit creatura
  choice: 受造界也承受得住
  rationale: sustinebit与后面的portare意义相近，既可表达受造界能够维持，也保留其承载众生的语境。
- source_word: praesentes
  choice: 所有现存的人
  rationale: 指目前在世、现今存在的人；加入“人”使中文指称清楚，但不扩大到原文未明说的其他类别。
theological_decisions:
- issue: creatura是单个受造物还是集合性的受造界
  choice: 正文采用集合性的“受造界”
  alternative: 你所创造的受造物
  rationale: 下句以复数“活着的”为讨论对象，并说creatura能够承受他们，较支持集合性的创造秩序；脚注保留单数理解。
- issue: vivificabis是否明确译为末日“复活”
  choice: 译为“使……活过来”
  alternative: 使……复活
  rationale: 语境涉及将来众生一同活着，但拉丁词本身可指使之有生命；采用较宽的表达以保留文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“受造界”保留原文的集合性与神学语感；“承受得住／承载”再现sustinere与portare的近义呼应。所给拉丁文开头残缺为“cabis”，依据可恢复的vivificabis及经审校英文咨询层补足本节起句；末尾“他对我说：你去问妇人的子宫……”属于下一节，未收入正文。
