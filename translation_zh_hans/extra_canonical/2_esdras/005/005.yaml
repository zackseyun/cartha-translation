source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et de ligno sanguis stillabit, et lapis dabit vocem suam; et populi commovebuntur, et gressus commutabuntur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/005.yaml
  text: And blood will drip from wood[a], and the stone will give its voice, and peoples will be shaken, and steps will be changed.
translation:
  language: zh_hans
  text: 木头必滴下血来，石头必发出声音；各族必震动，脚步必改变。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de ligno
  choice: 木头
  rationale: 保留拉丁文的泛指与具体物质意象，不擅自解释为树木、十字架或木制器物。
- source_word: sanguis stillabit
  choice: 必滴下血来
  rationale: stillabit 表示液体滴落；采用自然中文，同时保留末世异象的鲜明画面。
- source_word: lapis dabit vocem suam
  choice: 石头必发出声音
  rationale: 直译“给出自己的声音”在现代汉语中生硬；“发出声音”自然表达拟人化意象，又不把它具体化为呼喊或说话。
- source_word: populi commovebuntur
  choice: 各族必震动
  rationale: populi 为复数，可指诸民族、各族群或众民；“各族”保留群体复数。commovebuntur 可表示被摇动、震动或骚动，此处采用“震动”以保持歧义。
- source_word: gressus commutabuntur
  choice: 脚步必改变
  rationale: gressus 的本义是脚步、步伐，也可延伸为行程或行动方式；直译“脚步”以保留异象语言及其解释空间。
theological_decisions:
- issue: 木头流血的象征所指
  choice: 不加解释，译作“木头必滴下血来”
  alternative: 译作“树木必流血”或将其关联于十字架
  rationale: 拉丁文本只有 lignum，未明确说明树、木器或特定神学象征，不应在正文中补足。
- issue: 末句 gressus 的含义
  choice: 保留为“脚步”
  alternative: 译作“道路”“行程”或“行为”
  rationale: 原文可有字面与隐喻双重可能；采用字面表达，避免提前化解其末世预兆中的含混性。
translation_notes:
  register: 采用简洁、庄重而现代的预言体。四个分句结构平行，以两个分号组织节奏；不用文言词汇，也不添加原文没有的解释。
