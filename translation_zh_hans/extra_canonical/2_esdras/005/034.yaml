  yaml_path: translation/extra_canonical/2_esdras/005/034.yaml
  text: him more than he who made him?' And I said[a], 'No, lord, but I have spoken in grief, for my inward parts torment me every hour as I seek to grasp the path of the Most High and to search out part of his judgment.' And he said to me, 'You cannot.' And I said, 'Why, lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see Jacob's trouble?'
translation:
  language: zh_hans
  text: 他比创造他的那一位更……吗？”我说：“不，主啊！我只是因悲痛而这样说，因为我时时心如绞痛，想要领会至高者的道路，探究他审判的一部分。”他对我说：“你不能。”我说：“为什么，主啊？我又为什么生下来？我母亲的母腹为什么不成为我的坟墓，使我不至于看见雅各的苦难？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: torquent enim me renes mei
  choice: 因为我时时心如绞痛
  rationale: 拉丁文直译为“我的肾脏折磨我”，按古代身体语言指内心深处的痛苦；译作“心如绞痛”既自然，也保留强烈的身心煎熬感。
- source_word: semitam altissimi
  choice: 至高者的道路
  rationale: 保留 semita 的道路意象，并以“至高者”对应 altissimi。
- source_word: inuestigare partem iudicii eius
  choice: 探究他审判的一部分
  rationale: 保留 partem 的限定，不将说话者的诉求扩大为完全理解上帝的审判；iudicium 在此可兼有判断、裁决之意，正文采用经文语域自然的“审判”。
- source_word: laborem Iacob
  choice: 雅各的苦难
  rationale: labor 在语境中指雅各群体所遭受的患难与痛苦；“苦难”比“劳作”更符合此处哀叹。
theological_decisions:
- issue: 人能否理解至高者的道路和审判
  choice: 以“你不能”保留绝对而简短的回答
  alternative: 你无法完全明白
  rationale: 原文 non potes 没有“完全”一词；不添加限定，以保留原文关于人类认知限度的张力。
- issue: “雅各”的指称
  choice: 保留“雅各”
  alternative: 雅各的子民／以色列
  rationale: 原文直接使用 Iacob，既可能是族长之名，也可转喻其民族；保留名称，不在正文中消解这种指称张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。开头保留其承接上一节的残句形态；对身体隐喻作适度自然化处理，其余尽量维持原文的反复问句、强烈哀叹和神学张力。
