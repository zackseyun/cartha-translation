  text: And I said[a], 'Sovereign Lord, from every forest of the earth and from all its trees you have chosen one vine,
translation:
  language: zh_hans
  text: 我说：“主宰，主啊，你从地上所有的树林和其中一切树木中，拣选了一座葡萄园，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有旧译本在此作：“你从世上所有的土地中为自己选了一块田地，又从世上所有的花中为自己选了一朵百合花。”这段内容按现存拉丁文本属于下一节；本节作：“你从地上所有的树林和其中一切树木中，拣选了一座葡萄园。”
    reason: 说明旧译因经节错位而形成的异文，并明确本节依据所给拉丁底本的译文。
lexical_decisions:
- source_word: Dominator Domine
  choice: 主宰，主啊
  rationale: 保留拉丁文两个呼格称谓的叠加及庄严语气；“主宰”对应 Dominator，“主啊”对应 Domine。
- source_word: ex omni silva terrae
  choice: 从地上的一切树林中
  rationale: 按现有拉丁文本直译，同时用自然的现代汉语表达范围。
- source_word: ex omnium arborum eius
  choice: 从其中所有的树木中
  rationale: 将 eius 理解为回指“地/树林”所涵盖的树木，保留原文由树林进一步聚焦到树木的平行结构。
- source_word: elegisti
  choice: 拣选了
  rationale: 表达有意选取，符合经文庄重语域，且不额外加入“为自己”等原文未明说的成分。
- source_word: vineam unam
  choice: 一棵葡萄树
  rationale: 此处与 arborum 构成植物个体的对比，译作“葡萄树”比“葡萄园”更合语境；unam 明译为“一棵”。
theological_decisions:
- issue: “一棵葡萄树”可能具有象征意义
  choice: 不在正文中明指其象征对象
  alternative: 将其解释性译为某一群体或民族
  rationale: 本节只陈述拣选意象；为保留上下文逐步展开的神学张力，不把解释写入译文。
- issue: Dominator Domine 的称谓关系
  choice: 并列保留为“主宰，主啊”
  alternative: 合并为“主宰万有的主啊”或仅译“主啊”
  rationale: 并列译法最能呈现原文重复而庄严的呼告，又不添加“万有”等文本外信息。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。保留祷告式呼格和排比结构；不用生僻文言，也不把象征意义预先解释进正文。
