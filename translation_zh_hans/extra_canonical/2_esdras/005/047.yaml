  text: 照着它的时节。”他对我说：“我赐下了母腹
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: secundum tempus
  choice: 按着它的时节
  rationale: 保留原文残句的承接性质；“时节”比单纯“时间”更能表达按所定时机发生的含义。拉丁文未明说物主代词，但上下文所需的“它的”以自然汉语补出。
- source_word: Et dixit ad me
  choice: 他又对我说
  rationale: “又”自然表达叙事推进中的 et，同时保留说话者在本残片中未具名的状态。
- source_word: et ego dedi
  choice: 是我赐下了
  rationale: 用“是我”体现 ego 的强调；dedi 采用完成体“赐下了”，并以“赐”传达给予生命孕育之所的庄重语域。
- source_word: matricem
  choice: 母腹
  rationale: matrix 在此指孕育生命的子宫或母胎；“母腹”自然、庄重，也避免过度医学化。
theological_decisions:
- issue: ego 的强调是否指向神圣施予者
  choice: 以“是我”保留强调，但不在译文中明说身份
  alternative: 译作“我赐下了”或“我创造了”
  rationale: 原文只以第一人称强调施予者，未在本句残片中明说其身份；不宜把 dedi 扩译为带额外创造论含义的“创造”。
- issue: matricem 的具体所指
  choice: 译为“母腹”，保留生育与孕育的语义范围
  alternative: “子宫”或“母胎”
  rationale: “子宫”偏医学，“母胎”可能偏向胎儿或胎中状态；“母腹”更符合经文叙事语体，同时不过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文和英文咨询层都在“母腹”处截断，因此译文不补足后文，并保留开头作为上文残句的形态。
