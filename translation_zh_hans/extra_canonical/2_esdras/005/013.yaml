  text: laborabunt et non dirigentur uiae eorum. Haec signa dicere tibi permissum est mihi, et si oraueris iterum et ploraueris sicut et nunc et ieiunaueris septem diebus, audies iterato horum maiora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/013.yaml
  text: They will labor[a], but their ways will not be directed. I have been permitted to tell you these signs; and if you pray again and weep as you do now, and fast for seven days, you will hear again things greater than these.
translation:
  language: zh_hans
  text: 他们必劳碌，但他们的道路不会被引导。[a]我获准把这些征兆告诉你；如果你再次祷告，像现在这样哭泣，并禁食七天，你会再次听到比这些更大的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的道路不会亨通”。
    reason: 拉丁文 non dirigentur uiae eorum 字面为“他们的道路不会被引导／修直”；道路的表达也可能带有行事不顺、不得亨通的习语性含义。
lexical_decisions:
- source_word: laborabunt
  choice: 他们必劳碌
  rationale: 保留第三人称复数及将来意义；“劳碌”自然表达付出辛劳，但不额外限定具体工作。
- source_word: non dirigentur uiae eorum
  choice: 他们的道路不会通达
  rationale: 兼顾拉丁文被动式“被引导、被修直”和闪语式“道路顺利、亨通”的可能背景；正文用现代汉语“通达”保留道路意象，并以脚注说明较直译的读法。
- source_word: signa
  choice: 征兆
  rationale: 本段指预示将来之事的迹象，“征兆”比泛指的“记号”更符合语境。
- source_word: permissum est mihi
  choice: 我获准
  rationale: 准确保留非人格被动结构所表达的许可意味，不擅自补出许可者。
- source_word: audies iterato horum maiora
  choice: 你还会听见比这些更大的事
  rationale: 自然表达iterato的“再次”以及horum maiora的比较意义，同时不具体界定“大事”的内容。
theological_decisions:
- issue: “道路不会被引导”与“道路不会亨通”的歧义
  choice: 正文译作“道路不会通达”，脚注列出较直译的可能
  alternative: 他们的道路不会得到引导／他们的道路不会亨通
  rationale: 拉丁文dirigentur字面可指“被引导、被修直”，但“道路”搭配也可能表达行事顺利。正文不把意义完全收窄为成功或神圣引导，以保留原文张力。
- issue: 许可者的身份
  choice: 不补出是谁准许
  alternative: 上帝准许我
  rationale: 原文只说“我获准”，未明说许可者；译文避免加入原文没有明示的神学主语。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必劳碌”“获准”“禁食”保持经文语体；句法简洁，避免古奥措辞。
