  text: reuirida mihi aridos flores, Et aperi mihi clausa prumptuaria et produc mihi inclusos in eis flatos, aut monstra mihi uocis imaginem, et tunc ostendam tibi eum laborem quem rogas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/037.yaml
  text: Restore to me the dried flowers[a], and open for me the storehouses that are shut, and bring out for me the winds enclosed in them, or show me the image of a voice; then I will show you that labor which you ask.
translation:
  language: zh_hans
  text: 为我使枯萎的花重新鲜活，打开紧闭的仓库，把封存在其中的风放出来，或向我显明声音的形象；那时我就会向你显明你所问的那场患难。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuirida mihi aridos flores
  choice: 使枯萎的花为我复原
  rationale: reuirida 是命令式，意为使重新鲜活、复原；保留“枯萎的花”这一悖论式意象，不据英语脚注改写。
- source_word: prumptuaria
  choice: 仓库
  rationale: 指储藏之处；“仓库”自然清楚，也与其中封存着风的意象相容。
- source_word: flatos
  choice: 风
  rationale: 此处可指吹动之气或风；结合被封存在仓库中的语境，译作“风”最自然。
- source_word: uocis imaginem
  choice: 声音的形象
  rationale: 按原文保留抽象而反常的表达，不解释成回声、可见标记等特定含义。
- source_word: eum laborem quem rogas
  choice: 你所问的那场患难
  rationale: eum 具回指作用；labor 在上下文回指5:35的 laborem Iacob，意为雅各所遭的困苦、患难，而非劳作。
theological_decisions:
- issue: laborem 的上下文含义及回指关系
  choice: 那场患难
  alternative: 那项劳苦／那件你所求问的事
  rationale: 本节 eum laborem 回指前文“雅各的患难”；译出“那场”保留指示词的回指力度，也避免将末世苦难误解为劳动。
- issue: 不可能任务的意象是否解释化
  choice: 保留枯花复原、风被封存、声音具有形象等张力
  alternative: 将这些意象解释为自然现象或修辞谜语
  rationale: 原文刻意列举人不能完成或展示之事；译文不替作者消解其神学与修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“你若能……我就……”呈现原文连续命令后接条件结果的实际语用关系；未添加原文没有的“看见”。
