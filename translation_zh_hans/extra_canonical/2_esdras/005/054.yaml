  text: Therefore consider also for yourself[a], that you are smaller in stature than those before you,
translation:
  language: zh_hans
  text: 所以，你自己也要想一想：你们的身量比先前的人矮小。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Considera
  choice: 想一想
  rationale: 该命令式在此要求以眼前的人类世代作比较和反思；“想一想”自然清楚，同时保留劝诫语气。
- source_word: et tu
  choice: 你自己也
  rationale: 保留单数第二人称及强调意味，表明说话者直接要求以斯拉本人也作思量。
- source_word: minores statu
  choice: 身量……矮小
  rationale: statu 在此按身材、体格解释；结合 minores，译为“身量……矮小”比泛化为地位或身份更贴合上下文。
- source_word: prae his qui ante vos
  choice: 比先前的人
  rationale: 表达比较关系；ante vos 指你们以前的世代，简洁译为“先前的人”。
theological_decisions:
- issue: 后世人类相较前人的衰减
  choice: 按身体身量的比较直译，不扩展为属灵或道德地位的下降
  alternative: 译作“地位比先前的人低”或加入道德衰败含义
  rationale: 拉丁文 minores statu 在本段世代与受造秩序逐渐衰减的语境中最自然地指身量；原文没有明说属灵或道德评价。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文从单数“你自己”转为复数“你们”的人称变化。所给清理文本开头的 nati 属前节残句；本节依据校勘信息所确认的完整句子 Considera ergo et tu, quoniam minores statu estis prae his qui ante vos 翻译。
