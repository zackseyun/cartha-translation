  text: And if you indeed hate your people[a], they ought to be chastised by your own hands.
translation:
  language: zh_hans
  text: 如果你确实恨你的子民，就该亲手惩戒他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 先前曾译作：“我说完这些话以后，前一夜来见我的那位天使又奉差遣来到我这里。”这句话实际上属于下一节。
    reason: previous_rendering
lexical_decisions:
- source_word: odiens odisti
  choice: 确实恨
  rationale: 这是带有强调意味的同源重复表达；译作“确实恨”既体现强调，又避免“极其恨”等可能过度强化的说法。
- source_word: populum tuum
  choice: 你的人民
  rationale: 直译其所属关系，并保留这里对上帝之民的集体称呼。
- source_word: tuis manibus
  choice: 由你亲手
  rationale: 将拉丁语复数“用你的双手”按现代汉语习惯译为“亲手”，保留行动必须出自对方本人的重点。
- source_word: castigari
  choice: 惩戒
  rationale: 兼顾处罚与管教的意味，比单纯的“惩罚”更能保留 castigari 所含的纠正性语义。
theological_decisions:
- issue: 说话者关于上帝恨自己人民的条件性陈述
  choice: 保留“即使你确实恨”的尖锐条件句
  alternative: 弱化为“即使你不再喜爱”或改写成反问
  rationale: 原文直接使用“恨”，并以 si 引出条件；翻译不应替说话者消解其中的神学张力。
- issue: 惩戒的施行者
  choice: 明确译为“由你亲手”
  alternative: 泛化为“他们应受惩戒”
  rationale: 原文特意强调 tuis manibus，主张若要惩戒，也当由上帝亲自施行，因此不能省略。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“确实恨”传达原文强调结构，“亲手惩戒”简洁保留施行者和纠正性处罚两层含义。
