    issue: praeparasti 译作“栽培”
    rationale: 该词基本义为“预备、安排、设立”；“栽培”容易表示培育、扶植，且与“在其他根之上”组合不自然。
  - severity: low
    issue: “众多的人”及第二分句的语序略显生硬
    rationale: “许多人”是自然的复数泛指；将“使它在其他根之上”置于“预备了一根”之后，能更清晰传达 super alias，同时不强行限定为纯粹的地位意义。
