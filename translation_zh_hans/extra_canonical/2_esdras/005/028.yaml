review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了三重质问、“一”与“多”的对照，以及未明说的指称。惟“栽培”通常指培育植物，较易把 praeparasti 的“预备／设立”缩窄为长期培植，且“在其他根之上栽培这一根”的汉语搭配不够清楚。
  naturalness: 整体庄重通顺，但“众多的人”和“在其他根之上栽培这一根”略显生硬。改为“许多人”及将“在……之上”与“预备”拆开，可保持原文的空间／优越张力而更适合现代汉语。
  terminology: “主啊”“交给”“根”“分散”均恰当。将 unicum tuum 译为“你独有的那一个”，可保留其未明言的对象及“独一／专属”含义，不把它确定为某一民族或个人。
  issues:
