  text: et nunc Domine, ut quid tradidisti unum plurimiset praeparasti unam radicem super alias et dispersisti unicum tuum in multis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/028.yaml
  text: And now[a], Lord, why have you handed over the one to the many, and prepared one root above the others, and scattered your only one among the many?
translation:
  language: zh_hans
  text: 如今，主啊，你为什么把那一个交给许多人，又预备了一根，使它在其他根之上，并把你独有的那一个分散在许多人中间？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tradidisti
  choice: 交给
  rationale: 保留拉丁词“交出、交付”的核心含义；在此处可自然表达蒙拣选的一方被置于众多敌对者手中的语意，同时不擅自补出“敌人”。
- source_word: unum / unicum tuum
  choice: 这一个 / 你那独一的
  rationale: 保留原文由“一个”到“你那独一的”的呼应，以及所指对象未被明说的含混性。
- source_word: plurimis / in multis
  choice: 众多的人 / 众人中间
  rationale: 依上下文将 substantivized 复数理解为人群；两处采用略有变化的自然汉语，同时维持“一”与“多”的对照。
- source_word: praeparasti
  choice: 栽培
  rationale: 在“根”的比喻中译为“栽培”比抽象的“预备”更自然，但仍表达使其得以建立、成长的意思。
- source_word: radicem super alias
  choice: 在其他根之上……这一根
  rationale: 保留 super 的空间或优越性张力，不明确改译为“胜过”，以免过度解释。
- source_word: dispersisti
  choice: 分散
  rationale: 直译其使之散布、离散的含义，不预断这是流亡、受压迫还是人口散居。
theological_decisions:
- issue: “一个／独一的／一根”的具体所指
  choice: 不在正文中补明，保留代称和比喻
  alternative: 明确译作“你的百姓以色列”
  rationale: 上下文很可能指蒙拣选的民族，但本节拉丁文本本身没有明说；保留含混可维持其修辞和神学张力。
- issue: super alias 所表达的是位置还是优越性
  choice: 译作“在其他根之上”
  alternative: 译作“胜过其他根”
  rationale: “之上”可兼容位置、地位和优越性的含义，不将原文张力单一化。
- issue: tradidisti 是否暗含受敌人辖制
  choice: 仅译“交给众多的人”
  alternative: 译作“交在众多敌人手中”
  rationale: 原文没有“敌人”一词，避免把上下文推论写入正文。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“主啊”保留直接呼告；全句维持三个并列质问的推进，并突出“一”与“多”的反复对照。未采用英文咨询层中标为旧译的脚注，因为该句属于下一节的错位文本，与本节拉丁原文无关。
