source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborauit, ut deficeret. Et tenuit me qui uenit angelus, qui loquebatur in me, et confortauit me et statuit me super pedes.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/015.yaml
  text: it labored to the point of failing. And the angel who had come, who was speaking in me, took hold of me and strengthened me and set me on my feet.
translation:
  language: zh_hans
  text: 它劳苦到了几乎衰竭的地步。那位来到、在我里面说话的天使[a]扶住我，使我刚强，又叫我站立起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我里面说话”是依拉丁文本直译；也可能意指“对我说话”或“与我说话”。
    reason: 原文 loquebatur in me 的介词结构不同寻常，应向读者保留其真实歧义。
lexical_decisions:
- source_word: laborauit, ut deficeret
  choice: 它劳苦到了几乎衰竭的地步
  rationale: 保留拉丁文第三人称单数主语未明的特点，以“它”承接上文；“劳苦到了……地步”表达 ut 所引出的程度或结果，“几乎衰竭”自然传达 deficeret 的耗尽、支撑不住之意。
- source_word: tenuit me
  choice: 扶住我
  rationale: tenere 基本义是抓住、托住；在叙述者虚弱且随后被扶起站立的语境中，“扶住”既具体自然，也不过度解释动作。
- source_word: confortauit me
  choice: 使我刚强
  rationale: 直译其使役含义，既可包括身体得力，也不排除内在受到坚固。
- source_word: statuit me super pedes
  choice: 叫我站立起来
  rationale: 以现代汉语自然表达“使我立在双脚之上”，保留天使使叙述者重新站立的动作。
theological_decisions:
- issue: loquebatur in me 中介词 in 的异常表达
  choice: 在我里面说话
  alternative: 对我说话／与我说话
  rationale: 拉丁文明确用 in me，而非通常表示“对我说”的 mihi 或 mecum；正文保留这一可能具有内在启示意味、但含义未定的表达，不将其悄然常规化。
- issue: qui uenit 与 loquebatur 的时态关系
  choice: 那位来到、在我里面说话的天使
  alternative: 那位曾来、曾对我说话的天使
  rationale: uenit 可按完成动作理解，而 loquebatur 是未完成过去时，呈现持续或当时正在进行的说话；译文避免把后者改成已经结束的“曾说过”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“衰竭”“使我刚强”保留经文语体，但不显古奥；并用脚注说明异常介词结构，避免正文擅自消解歧义。
