- issue: 说话者自称 insipiens 的力度
  choice: 愚昧
  alternative: 无知／愚蠢
  rationale: “愚昧”既保留自我贬抑和智慧层面的张力，又避免“愚蠢”在现代汉语中过强的辱骂色彩；不将其解释为特定神学意义。
- issue: 残缺句是否补全
  choice: 不补全，以省略号标示中断
  alternative: 依据上下文补作“你所问我的事”
  rationale: 所给原文在 quibus 处中断，补全会加入没有直接源文依据的内容。
