  yaml_path: translation/extra_canonical/2_esdras/005/041.yaml
  text: And I said[a], 'But behold, Lord, you preside over those who are at the end. And what will those do who were before us, or we ourselves, or those who will be after us?'
translation:
  language: zh_hans
  text: 我说：“可是请看，主啊，你掌管那些处在末期的人。那么，那些在我们以前的人、我们自己，以及那些在我们以后的人，又该怎么办呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praees
  choice: 掌管
  rationale: 表达居于其上、治理或主持的含义；比“领导”更符合向主祈问的庄重语境。
- source_word: qui in fine sunt
  choice: 那些处在末期的人
  rationale: 保留拉丁文“在末期”的末世性和时间含义，不擅自具体化为“末世出生的人”。
- source_word: quid facient
  choice: 又该怎么办呢
  rationale: 直译为“将做什么”在现代汉语中生硬；此处是在追问这些人的处境或出路，用“该怎么办”自然表达，同时不限定具体结果。
- source_word: qui ante nos sunt ... hi qui post nos
  choice: 那些在我们以前的人……那些在我们以后的人
  rationale: 保留相对于说话者的时间次序，不额外解释为死者、先祖或后代。
theological_decisions:
- issue: “末期”所指的范围
  choice: 保留“处在末期的人”
  alternative: 译作“活到末世的人”或“生在末世的人”
  rationale: 原文只说 qui in fine sunt，并未明确是出生、存活还是到达末期，故保留其开放性。
- issue: 对 domine 的称呼
  choice: 主啊
  alternative: 主人啊
  rationale: 在向神直接呼告的语境中，“主啊”自然、庄重，也不引入额外宗派含义。
- issue: 连接词 et
  choice: 那么……又
  alternative: 但是……又
  rationale: 原文第二句以 et 引出问题，并非再次使用 sed；汉语用“那么……又”承接前句，体现推论式追问。
translation_notes:
  register: 采用现代、庄重而易懂的祈问语体。“可是请看”对应 sed ecce，保留转折和引人注意的语气；列举部分用“那些在我们以前的人、我们自己，以及那些在我们以后的人”，使三组对象清晰。英文脚注所示差异主要涉及英语标点或大小写，在简体中文中不构成可表达的实质异文，因此不设脚注。
