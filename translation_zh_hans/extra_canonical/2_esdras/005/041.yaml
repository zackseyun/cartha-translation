  source_fidelity: 译文准确反映拉丁文的句法与论旨："可是请看"对应 sed ecce；"主啊"对应 domine；"掌管"恰当地表达 praees；三组人（我们以前的、我们自己、我们以后的）均完整保留。将 quid facient 译为“又该怎么办呢”在此追问他们处境与出路的语境中自然，未实质缩窄原意。
  naturalness: 措辞符合现代标准汉语且保持祈问语体的庄重。“那么……又该怎么办呢？”顺畅地承接前句的追问；“处在末期的人”虽较正式，但清楚并保留原文的开放指向。
