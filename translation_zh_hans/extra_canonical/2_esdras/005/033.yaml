  yaml_path: translation/extra_canonical/2_esdras/005/033.yaml
  text: '...before you.'' And I said[a], ''Speak, my lord.'' And he said to me, ''You have become greatly beside yourself in mind over Israel; or have you loved him more...'
translation:
  language: zh_hans
  text: ……在你面前。”我说[a]：“请说，我主。”他对我说：“你在以色列的事上，竟如此心神恍惚；莫非你爱他胜过……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我说：‘不，我主；但我是在愁苦中说话，因为我每时每刻都被内心煎熬，竭力领会至高者的道路，并探究他审判的一部分。’”
    reason: 此处有异文传统；该读法对应审校轨迹所记录的另一段较长文本，故以脚注呈现而不混入本节所给拉丁正文。
lexical_decisions:
- source_word: loquere
  choice: 请说
  rationale: 以自然、恭敬的现代汉语表达命令式“说吧”，符合以斯拉对天使的回应语境。
- source_word: dominus meus
  choice: 我主
  rationale: 保留拉丁文的尊称及其字面关系，不将所指擅自解释为上帝或普通先生。
- source_word: ualde in excessu mentis factus es
  choice: 心神竟如此失常
  rationale: 该短语不只是“苦恼”，而有心智超出常态、近乎失去自持之意；译文保留责问的力度，同时避免现代医学诊断色彩。
- source_word: in Israel
  choice: 为了以色列
  rationale: 此处表达因以色列而产生的强烈心理状态；汉语用“为了”较自然，也与下句“爱他”衔接。
- source_word: aut plus dilexisti
  choice: 莫非你爱他胜过
  rationale: 保留疑问性的转折/选择结构及未完句式；“他”承接阳性指称的以色列，不预先补出比较对象。
theological_decisions:
- issue: “我主”的所指
  choice: 保留“我主”
  alternative: 译作“主啊”或“先生”
  rationale: 原文仅有dominus meus；上下文虽可识别说话者，但本节不宜在称谓中额外判定其神性或身份。
- issue: 以色列的人称表达
  choice: 译为“他”
  alternative: 译为“它”或重复“以色列”
  rationale: 原文后续dilexisti的宾语须由跨节语境补足；英语审校层采用him。用“他”可保留以色列被人格化的语气，又不额外解释为某个个体。
- issue: 句末比较对象
  choice: 保留省略号，不补足
  alternative: 补作“胜过创造他的那一位”
  rationale: 所给拉丁文本止于plus dilexisti，本节本身残缺；不从下一节擅自补文，以保存原始分节和未完成的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。开头与结尾均保留源片段的跨节残句形态；“心神竟如此失常”力求传达in excessu mentis的强烈责问，而不弱化成单纯忧伤，也不使用带临床诊断意味的术语。
