lexical_decisions:
- source_word: euigilaui
  choice: 我醒了
  rationale: 准确表达从睡眠或异象中醒来的动作，符合现代汉语自然表达。
- source_word: corpus meum
  choice: 我的身体
  rationale: 直译 corpus，保留身体与后文“心灵”的对应。
- source_word: horruit ualde
  choice: 剧烈战栗
  rationale: horruit 表示因惊惧等而颤栗，ualde 加强程度；“剧烈战栗”兼顾力度与庄重语体。
- source_word: anima mea
  choice: 我的心灵
  rationale: anima 在此与 corpus 对举，译作“心灵”可保留身心之间的张力；原文句子残缺，因此不补足谓语。
theological_decisions:
- issue: anima 的语义及残句处理
  choice: 译为“心灵”，并保留未完句式
  alternative: 译为“灵魂”，或根据下节补出谓语
  rationale: “心灵”可自然表达与身体相对的内在生命，同时避免把 anima 过度限定为某一特定灵魂论概念；现有拉丁文本止于 et anima mea，忠实保留其残缺状态，不擅自补文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。经文按所给拉丁文本保留在“我的心灵”处中断，不添加原文没有的内容。
