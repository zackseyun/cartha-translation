  yaml_path: translation/extra_canonical/2_esdras/005/011.yaml
  text: Injustice and lack of self-control will be multiplied upon the earth. And one region will ask its neighbor and say, 'Has righteousness passed through you?'
translation:
  language: zh_hans
  text: 地上的不义和无节制必日益增多。一个地区会问它邻近的地区，说：“公义曾经过你那里吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的这段拉丁文本在“经过你那里吗”这一问句中断；“公义”及问句的完整措辞依据相关文本脉络和经审核的校勘层补出。
    reason: 提示读者所给拉丁见证在此处残缺，避免把补足的措辞误作完整保存的拉丁原文。
lexical_decisions:
- source_word: iniustitia
  choice: 不义
  rationale: 既可表达道德上的邪恶与不公，也与后文“公义”形成自然对照。
- source_word: incontinentia
  choice: 无节制
  rationale: 拉丁词指缺乏自制、放纵；“无节制”简明自然，并避免把含义局限于某一种欲望。
- source_word: multiplicabitur
  choice: 必日益增多
  rationale: 传达事物大量增加的预告语气；汉语用“日益增多”比直译“被增多”自然。
- source_word: regio proximam suam
  choice: 一个地区……邻近的地区
  rationale: 保留 regio 的地域含义，并将 proximam suam 所表达的相邻关系清楚译出。
- source_word: numquid per te
  choice: 公义曾经过你那里吗
  rationale: 所给拉丁文本在 per te 处中断；依照经审核的咨询文本补足问句，同时用“经过你那里”自然表达 per te 的空间意象。
theological_decisions:
- issue: iustitia 的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”在庄重的宗教语境中自然，也能与“不义”直接呼应；不加入“使人称义”等原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留末句的空间性拟人表达，不作额外神学阐释。
