id: 2ES.5.4
reference: 2 Esdras 5:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem tibi dederit Altissimus vivere, et videbis post tertiam turbatam, et relucescet subito sol noctu et luna interdie.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/004.yaml
  text: But if the Most High grants that you live[a], you will see after the third disturbance that the sun will suddenly shine at night, and the moon by day.
translation:
  language: zh_hans
  text: 但至高者若赐你活下去，你就会看见：第三次动乱[a]之后，太阳会忽然在夜间发光，月亮会在白昼发光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第三次动乱”：拉丁文本如此；其他古译本作“第三声号角之后”。
    reason: 说明现存拉丁文本的疑难读法和重要古译本异文，避免把有争议的校勘结论悄然写入正文。
lexical_decisions:
- source_word: Altissimus
  choice: 至高者
  rationale: 准确保留拉丁文对上帝的尊称，也符合现代中文圣经语体。
- source_word: dederit … vivere
  choice: 赐你活下去
  rationale: 表达“使你得以继续存活”的条件含义，比生硬的“赐你生活”自然。
- source_word: post tertiam turbatam
  choice: 第三次动乱之后
  rationale: 依现存拉丁文本 turbatam 的“扰乱、动荡”之义翻译，同时以脚注说明重要异文。
- source_word: relucescet subito sol noctu
  choice: 太阳会忽然在夜间发光
  rationale: 保留 subito 的突发意味及太阳夜间发光的末世异象。
- source_word: luna interdie
  choice: 月亮会在白昼发光
  rationale: interdie 指白昼；补出“发光”是承接前一分句谓语，符合拉丁文省略和自然中文。
theological_decisions:
- issue: “第三次动乱”与“第三声号角”的文本差异
  choice: 正文按所给拉丁底本译作“第三次动乱”
  alternative: 第三声号角之后
  rationale: 现存拉丁文明确作 turbatam，虽语法可疑且其他古译本支持“号角”，但不宜在正文中无说明地改写底本；以脚注保存异文及末世意象上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“但……若……”承接上文的转折和条件关系；冒号使“你就会看见”的具体内容清楚展开。
