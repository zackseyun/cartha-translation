  text: nec enim poteras facere qui facti sunt et qui sunt et qui futuri sunt in unum, ut celerius iudicium tuum ostendas ? Et re-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/043.yaml
  text: And I answered and said[a], 'For could you not make those who have been made, and those who are, and those who will be, all at once, so that you might show your judgment more quickly?'
translation:
  language: zh_hans
  text: 因为难道你不能把已经受造的、现今存在的和将要存在的，都一同造出来，以便你更快显明你的审判吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你不能”也可译作“你难道不能早已……吗？”拉丁语动词 poteras 为未完成过去时，可能带有过去未实现的可能性，也可能只是一般能力反问。
    reason: 保留 poteras 在一般能力反问与带过去反事实色彩的理解之间的歧义；避免“你本来不能”所造成的“原本无能力”误解。
lexical_decisions:
- source_word: nec enim poteras
  choice: 因为，难道你不能
  rationale: 保留 enim 所表达的解释或推论关系，并把 nec…poteras 作为带否定意味的反问来处理；中文用“难道……不能”自然传达这一语气。
- source_word: qui facti sunt et qui sunt et qui futuri sunt
  choice: 已经受造的、现今存在的和将来才有的
  rationale: 对应过去、现在、未来三组对象；facti sunt 采用“受造”以保留被造之意，futuri sunt 则译得自然，同时不将其范围擅自限定为某一类人。
- source_word: in unum
  choice: 全都同时
  rationale: 在此指把三个时代的受造者集中在同一时刻造出；“全都同时”比字面“一处”更符合上下文。
- source_word: ut celerius iudicium tuum ostendas
  choice: 好更早显明你的审判
  rationale: 保留目的关系；celer ius 在语境中既可指“更快”也可指“更早”，这里用自然的“更早”；ostendas 译为“显明”，不把审判本身等同于执行审判。
theological_decisions:
- issue: poteras 的未完成过去时是否表示过去未实现的可能性
  choice: 正文译作“你不能……吗”
  alternative: “你本来不能……吗”或“你不能早已……吗”
  rationale: 拉丁语未完成过去时可使问题带有过去能力或反事实色彩，但中文若直接加入“本来”会更强地断定一种未实现的过去可能性；正文保持较开放的反问，脚注说明另一译法。
- issue: 审判是被显明还是被执行
  choice: 显明你的审判
  alternative: 施行你的审判
  rationale: ostendas 的直接意义是“显示、显明”，不应擅自改成“施行”，以免消除原文关于审判如何被展示的张力。
translation_notes:
  register: 采用现代、庄重而易懂的问句。保留“因为”所表达的上下文衔接，不加入所给拉丁文本中没有的“我回答说”。“全都同时”清楚表达 in unum 在本节的时间集中含义。
