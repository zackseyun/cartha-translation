  terminology: “受造”“审判”均合适，且“显明”忠实对应 ostendas，不应改作“施行”。脚注中“你本来不能”在中文里通常表示原本缺乏能力，不能准确表达拉丁语未完成过去时可能带有的过去未实现／反事实意味，须改正。
