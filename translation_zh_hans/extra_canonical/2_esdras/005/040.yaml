lexical_decisions:
- source_word: facere
  choice: 做到
  rationale: 保留“做、完成”的基本含义；这里指以斯拉无力完成先前所说的任何一件事。
- source_word: unum de his quae dicta sunt
  choice: 以上所说的这些事中任何一件
  rationale: 准确表达 unum de his 的部分关系，并以自然汉语呈现 quae dicta sunt。
- source_word: inuenire
  choice: 探明
  rationale: 此处不是偶然“找到”，而是凭探究获知；“探明”符合语境，也不额外加入“理解”等解释。
- source_word: iudicium
  choice: 那审判
  rationale: 保留 iudicium 的核心司法及神学含义，并避免擅自补入拉丁文没有的“我的”。
theological_decisions:
- issue: iudicium 所指的范围
  choice: 那审判
  alternative: 审判的奥秘／我的审判
  rationale: 拉丁文只写 iudicium，未明说是审判的奥秘，也没有物主代词；译文保留其简洁及指涉上的张力。
- issue: 英译脚注所述“所应许之爱的目标”
  choice: 不收入正文或脚注
  alternative: 补入“我应许给我子民之爱的目标／结局”
  rationale: 该内容不见于用户提供的本节拉丁文，显然属于另一读法、异文或错置的资料；依据现有原文证据不宜补译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正如……也……”对应拉丁文 quomodo…sic 的比较结构；“他又对我说”使叙事衔接自然，但不消除原文开头的突兀，相关问题以脚注说明。
