  yaml_path: translation/extra_canonical/2_esdras/005/008.yaml
  text: And chaos will come in many places[a], and fire will often break out, and wild beasts will leave their own region,
translation:
  language: zh_hans
  text: 许多地方将发生混乱[a]，火将屡屡喷发，野兽将迁离原来的栖息地，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“许多地方将出现深渊”；此词也可能指地面裂开形成的裂谷。
    reason: chaos 可指混乱，也可能在本处按灾变图景指深渊或裂隙；脚注保留语义歧义。
lexical_decisions:
- source_word: chaos
  choice: 深渊
  rationale: 拉丁语 chaos 在古代及启示文学语境中可指张开的深渊、裂谷，而不只是现代意义上的抽象“混乱”；此处与各地出现的灾变征兆相配。
- source_word: fiet per loca multa
  choice: 许多地方将出现
  rationale: fiet 表示“将发生、出现”，per loca multa 表示遍及许多地点；中文调整语序以求自然。
- source_word: ignis frequenter emittetur
  choice: 火焰将屡屡喷发
  rationale: 保留 emittetur 所表达的发出、喷出之动态，并以“屡屡”对应 frequenter。
- source_word: bestiae agrestes
  choice: 野兽
  rationale: 指野生动物；“野兽”简洁、庄重，也符合异象语境。
- source_word: transmigrabunt regionem suam
  choice: 将迁离自己的地界
  rationale: transmigrabunt 表示迁徙、移居；结合宾格 regionem suam，语义为离开其原有地域。“地界”比“地区”更适合此处庄重文体。
theological_decisions:
- issue: chaos 是抽象混乱还是地貌性的深渊
  choice: 正文译作“深渊”
  alternative: “混乱”或“裂谷”
  rationale: 该词在启示文学灾兆清单中更可能描写地面裂开形成的深渊；不过拉丁词本身保有“混沌、混乱”的可能，故以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面语；“屡屡喷发”“迁离自己的地界”保持启示文学的动态画面。原文开头的“uocem eius”（“他的声音”）属于上一句残余，依本节英文分界不纳入正文。
