source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dices ad eam : decem si paris, quare per tempus ? roga ergo eam ut det decem in unum. Et dixi : non utique poterit, sed'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/046.yaml
  text: And he said to it, “If you bear ten, why over time? Ask it therefore to give birth to ten at one time.” And I said, “Certainly it cannot, but—”
translation:
  language: zh_hans
  text: “你要对她说：‘你若生十个，为什么要分开时间生呢？那么，求她一次生下十个吧。’”我说：“她当然不能，不过——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dices ad eam
  choice: 你要对她说
  rationale: dices是第二人称单数将来时，宜译为指示性的“你要说”，而不是“他对它说”；eam为阴性单数代词，译作“她”。
- source_word: decem si paris
  choice: 你若生十个
  rationale: paris指生育；原文省略所生对象，中文也不擅自补入“孩子”。
- source_word: per tempus
  choice: 分时生
  rationale: 表达不是同时生下、而是隔着时间逐个生的意思，同时避免过度解释具体间隔。
- source_word: det decem in unum
  choice: 一次生下十个
  rationale: det在生育语境中指“生下”，in unum表示合在一次、同时完成；如此译法符合现代汉语习惯。
- source_word: non utique poterit
  choice: 她当然不能
  rationale: utique加强否定的确定性，poterit表示能力或可能性，译为“当然不能”简洁准确。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代普通话。保留原文从直接对“她”说话转回“求她”的人称结构，也以破折号保留句末sed（“不过”）所形成的未完语势。
