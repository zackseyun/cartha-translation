base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/044.yaml
  text: And he answered me and said[a], 'The creature cannot hasten faster than the Creator, nor can the age sustain those who were created in it all at once.'
translation:
  language: zh_hans
  text: 他回答我说：“受造物不能比造物主更快；这世代也不能同时容纳其中所有受造的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spondit ad me et dixit
  choice: 他回答我说
  rationale: 清理后的拉丁文开头显然承接常见表达 respondit ad me et dixit；用自然中文表达应答引语。
- source_word: creatura
  choice: 受造物
  rationale: 按拉丁词的单数形式直译，并保留其可泛指受造界或受造者的张力；上下文中的 creator 与之形成直接对照。
- source_word: festinare ... super
  choice: 比……更快
  rationale: 此处 super 与 festinare 构成比较意义，表示受造物不能赶得比造物主更快，而非空间上的“越过”。
- source_word: creator
  choice: 造物主
  rationale: 采用现代汉语中庄重而通行的称谓，清楚保留创造者与受造物的对照。
- source_word: saeculum
  choice: 世代
  rationale: 保留该词可指时代、世界秩序或现世的语义幅度；此处重点是其中受造者所处的时代性框架。
- source_word: sustinere
  choice: 容纳
  rationale: 上下文谈所有受造者若同时出现，该世代无法承载；“容纳”在中文中自然表达这种容量限制。
- source_word: qui in eo creati sunt in unum
  choice: 同时容纳所有在其中受造的人
  rationale: in unum 修饰总体聚集，译作“同时”；关系代词所指为在该世代中被造者，按语境用“人”使中文清楚，同时不扩大为一切存在物。
theological_decisions:
- issue: creatura 是个体“受造物”还是集合性的“受造界”
  choice: 受造物
  alternative: 受造界
  rationale: 拉丁文采用单数 creatura，并与单数 creator 对举；“受造物”较贴近形式，同时仍可作为类称理解，不将集合义明确定死。
- issue: saeculum 的宇宙论或时间意义
  choice: 世代
  alternative: 世界
  rationale: “世代”保留时间层面的核心意义，也避免把经文明确解释为物质宇宙；后句关于其中受造者的承载能力仍然通顺。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。引语简洁，保留“受造物—造物主”与“世代—其中受造者”的平行关系。原始引文末尾已进入下一节未完词组，因此本稿只翻译本节完整句子。
