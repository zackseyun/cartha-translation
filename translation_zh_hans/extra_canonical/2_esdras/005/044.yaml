  rationale: 仅作微小的汉语明确化：在“世代”前补入“这”，以自然表达 saeculum 作为当前时代或世代的指称。原文的比较义、承载意象及受造者范围均予保留。英文审校轨迹中的“beyond”替代译法在中文定稿中没有形成仍需保留的歧义，故无需脚注。
