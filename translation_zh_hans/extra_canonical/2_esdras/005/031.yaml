  rationale: 拉丁文为过去完成时虚拟式，表示主句事件发生前已经完成的动作；“说完……以后”准确而自然。
- source_word: et missus
  choice: 有一位被差来
  rationale: missus 是阳性单数被动分词，暗示某位男性所指者“被差遣”；本节在句法上未完，谓语及身份须由下一节补足。汉语加入“有一位”以承载原文隐含的阳性单数主语，同时保持悬接。
