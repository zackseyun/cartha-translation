  yaml_path: translation/extra_canonical/2_esdras/005/050.yaml
  text: 'And I asked and said[a], ''Since you have now given me a way, I will speak before you: is our mother, of whom you spoke to me, still young, or is she already drawing near to old age?'''
translation:
  language: zh_hans
  text: 我便问道[a]：“既然你如今给我开了口，我就要在你面前说话；因为我想问：我们那位你对我提到的母亲，仍然年轻，还是已经接近老年了？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文残段始于“在你面前”。“还是”所对应的拉丁词 an 在该版本中置于方括号内，表示校勘性补字；若不采纳此补字，后半句可理解为：“我们那位你对我提到的母亲，仍然年轻吗？”
    reason: 说明本节所给拉丁残段的起点，并准确保留方括号 an 所反映的文本不确定性及由此产生的替代理解。
lexical_decisions:
- source_word: coram te
  choice: 在你面前
  rationale: 保留拉丁语表示当面陈说、向对方直言的空间性表达，中文自然且庄重。
- source_word: nam
  choice: 因为
  rationale: 明确保留原文的解释性连接词，使这个问题承接前文的比喻；虽在现代汉语中略显突兀，却反映拉丁文本的逻辑关系。
- source_word: mater nostra
  choice: 我们的母亲
  rationale: 直译亲属隐喻，不擅自把“母亲”解释为锡安、耶路撒冷或世界。
- source_word: adhuc iuuenis est
  choice: 她还年轻呢
  rationale: “还”对应 adhuc，并以代词复指前置的“我们的母亲”，保持原句话题结构。
- source_word: iam senectuti adpropinquat
  choice: 已经渐近老年了
  rationale: 分别体现 iam 的“已经”、adpropinquat 的趋近过程及 senectus 的老年阶段。
theological_decisions:
- issue: “我们的母亲”所指为何
  choice: 保留为“我们的母亲”
  alternative: 释作“锡安”“耶路撒冷”或“现今世代”
  rationale: 本节本身只使用母亲隐喻，未在此明确其所指；为保留释义空间，不将可能的象征对象写入正文。
- issue: nam 与前文的关系
  choice: 译出“因为”
  alternative: 为汉语流畅而省略
  rationale: 现给拉丁文本明确含 nam，译出可保留以斯拉的问题对前文论述所作的解释性承接。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“开了一条路”保留“使人得以发言”的隐喻；问句使用“她……呢，还是……”的自然汉语结构，同时保留原文话题前置的语气。
