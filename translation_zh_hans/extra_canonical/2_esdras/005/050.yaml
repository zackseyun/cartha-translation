- from: 我便问道[a]：“既然你如今给我开了一条路，我就要在你面前说：因为你对我提到的我们的母亲，她还年轻呢，还是已经渐近老年了？”
  to: 我便问道[a]：“既然你如今给我开了口，我就要在你面前说话；因为我想问：我们那位你对我提到的母亲，仍然年轻，还是已经接近老年了？”
  rationale: 修订保留 coram te、nam、mater nostra、adhuc、iuuenis、iam、senectuti adpropinquat 的核心意义。以“因为我想问”自然表达 nam 对前文的承接，避免不合汉语习惯的“因为……还是……”。脚注改为直接说明 [an] 的校勘性质，避免将文本问题误说成单纯的断句差异。
