  text: nem facient. Et mare Sodomiticum pisces reiciet, et dabit uocem noctu, quam non nouerunt multi, omnes autem audient
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/007.yaml
  text: And the Sea of Sodom will cast out fish[a], and by night it will utter a sound that many have not known[b], but all will hear it.
translation:
  language: zh_hans
  text: 索多玛海将鱼抛出[a]；在夜间，它将发出一种许多人未曾听闻的声音[b]，但人人都会听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “索多玛海”很可能指死海；这里保留拉丁文含蓄的地名称呼，不直接换成后来通行的名称。
    reason: cultural_note
  - marker: b
    text: 或译：“在夜间，它将发出一种许多人未曾知道的声音，但人人都会听见。”
    reason: translation_alternative
lexical_decisions:
- source_word: mare Sodomiticum
  choice: 索多玛海
  rationale: 按地理关系直译为“索多玛海”，保留原文对索多玛的含蓄指称，同时避免直接以较晚形成的惯用名称“死海”替代。
- source_word: pisces reiciet
  choice: 将把鱼抛出来
  rationale: reiciet 有“抛回、抛出、排出”之意；“抛出来”既保留异常征兆的动态感，也不额外说明鱼为何或向何处被抛。
- source_word: dabit vocem
  choice: 将发出……声音
  rationale: 拉丁文直译近于“给出声音”；现代汉语以“发出声音”表达自然，并保留主体是海这一反常意象。
- source_word: non nouerunt multi
  choice: 许多人未曾听闻
  rationale: nouerunt 是完成时态，基本义为“认识、知道”；在“声音”的语境中译作“未曾听闻”较自然，并保留此前没有经验或认知的意味。
- source_word: omnes autem audient
  choice: 但人人都会听见
  rationale: 保留 autem 的转折，突出“许多人从未听闻”与“人人终将听见”的张力；宾语按上下文省略，符合现代汉语。
theological_decisions:
- issue: “索多玛海”的地理所指
  choice: 正文保留“索多玛海”
  alternative: 译作“死海”
  rationale: 该名称很可能指死海，但原文使用与索多玛相连的称谓；正文不把可能的所指直接等同为后来的通名。
- issue: “许多人未曾知道”的语义范围
  choice: 依声音语境译作“许多人未曾听闻”
  alternative: 较形式化地译作“许多人未曾知道”
  rationale: 原文动词可指认知或经验，未明说“听过”；正文采用自然的听觉表达，脚注保留较贴近字面的另一译法，以免消除原文措辞的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“抛出来”呈现征兆的突兀动态；分号划分两个并列的末世征兆。正文与脚注标记[a]、[b]完全对应。
