  text: and from all the lands of the world you chose for yourself one pit[a], and from all the flowers of the world you chose for yourself one lily,
translation:
  language: zh_hans
  text: 你从世上所有的土地中，为自己拣选了一个坑[a]；又从世上所有的花中，为自己拣选了一朵百合花。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作：“你从海的一切深处，为自己充满了一道溪流；又从一切建成的城中，为自己使锡安成圣。”这是先前的译文，但其内容对应下一节的拉丁文本。
    reason: previous_rendering
lexical_decisions:
- source_word: ex omnium terrarum orbis
  choice: 从世上所有的土地中
  rationale: 按现存拉丁文本的字面结构翻译；其中属格搭配略显不规则，但整体意义是从世界各地或所有土地中作出拣选。
- source_word: elegisti tibi
  choice: 为自己拣选了
  rationale: 同时保留 elegisti 的主动拣选含义和 tibi 所表达的归己意味。
- source_word: foveam unam
  choice: 一个坑
  rationale: fovea 通常指坑、洞或凹穴；上下文中的所指并不明确，因此不擅自解释成某一地点或象征。
- source_word: lilium unum
  choice: 一朵百合花
  rationale: lilium 明确指百合；中文以量词“朵”自然表达，同时保留“一个/一朵”的单一性。
theological_decisions:
- issue: “一个坑”的象征所指
  choice: 保留直译“一个坑”
  alternative: 解释为某一圣地、园地或其他象征性地点
  rationale: 拉丁文本仅作 foveam，意义突兀且可能涉及文本传承问题；在缺乏充分依据时应保留原文张力，不作神学化补足。
- issue: 旧译异文与本节经文的关系
  choice: 正文采用所给第24节拉丁文本，旧译内容仅收入脚注
  alternative: 将“海的深处……一道溪流；众城……锡安”列入正文
  rationale: 该内容对应后续经节，而非所给第24节拉丁文本；脚注只用于记录先前译法及其错位情况。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原句两项平行结构，并以分号清楚呈现；不修平“一个坑”这一难解表达。
