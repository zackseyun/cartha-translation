  yaml_path: translation/extra_canonical/2_esdras/005/022.yaml
  text: And my soul recovered the spirit of understanding[a], and again I began to speak before the Most High.
translation:
  language: zh_hans
  text: 我的心灵重新获得了明悟之灵；我又开始在至高者面前说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: resumpsit
  choice: 重新得着
  rationale: 表达在一度失去或衰弱之后重新恢复，符合该动词在此处的语境。
- source_word: anima mea
  choice: 我的灵
  rationale: 拉丁文直译为“我的魂”；现代汉语在此以“我的灵”较自然地指说话者内在的生命与心神，同时避免误解为一个与本人分离的对象。
- source_word: spiritum intellectus
  choice: 悟性的气息
  rationale: 保留 spiritus 可指“气息”或“灵”的意象，也呈现 intellectus 所表达的理解、领悟能力，不将短语过早解释为单纯的“理智”。
- source_word: coram Altissimo
  choice: 在至高者面前
  rationale: 贴近原文空间性表达，并保留“至高者”这一神圣称号。
- source_word: sermones
  choice: 说话
  rationale: 与 loqui 合并为自然汉语；若另译“言语”，会显得重复，但动作本身仍完整传达。
theological_decisions:
- issue: spiritum intellectus 是人的心神、理解能力，还是外来的灵
  choice: 译作“悟性的气息”
  alternative: “明悟之灵”或“理解力”
  rationale: 原文允许“灵／气息”与“理解能力”之间的张力；采用较具意象而不作教义性定性的表达，避免断言这是独立的神圣位格或仅仅是心理机能。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“重新得着了悟性的气息”略带文学色彩，以保存拉丁文 anima、spiritus 与 intellectus 的复合意象；后半句用简洁自然的“说话”，避免机械重复“说言语”。
