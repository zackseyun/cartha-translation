id: 2ES.16.9
reference: 2 Esdras 16:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mala, et quis repell(et) ea? Exiet ignis ex iracundia eius, et quis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/009.yaml
  text: Evils[a], and who will repel them? Fire will come forth from his wrath, and who is there to quench it?
translation:
  language: zh_hans
  text: 灾祸临到，谁能将它们击退？火必从他的烈怒中发出，谁能将它熄灭？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: 灾祸
  rationale: 中性复数作名词，指临到的祸患或灾难；“灾祸”比“邪恶”更符合与“击退”搭配的语境。
- source_word: repellet
  choice: 将它们击退
  rationale: 保留动词“抵挡、击退”的力度，并用“它们”对应复数 mala。
- source_word: Exiet
  choice: 必……发出
  rationale: 这是 exire 的将来时，表示火从烈怒中出来、发出；避免译成中文里可能表示火熄灭的说法。
- source_word: ignis
  choice: 火
  rationale: 直译并保留审判意象。
- source_word: ex iracundia eius
  choice: 从他的烈怒中
  rationale: 保留来源关系及第三人称指代；iracundia 在此表示强烈的愤怒。
- source_word: quis
  choice: 谁能
  rationale: 两处均译作反问，表达无人能够抵挡或熄灭。
theological_decisions:
- issue: “他的”所指是否明说为上帝
  choice: 保留“他的”
  alternative: 译作“上帝的”或“主的”
  rationale: 本节残存拉丁文本仅有 eius（他的），不在译文中补明先行词，以保留原文指代方式。
- issue: 火与烈怒的关系
  choice: 译作“火必从他的烈怒中发出”
  alternative: 译作“他的烈怒必发出火”
  rationale: 保留原文以“火”为主语及 ex 所表达的来源关系，不把比喻关系进一步解释化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“灾祸临到”补出汉语自然句法所需的谓语，使残篇开头的名词短语可独立成句；两句反问保持原文强烈、宣告性的语气。
