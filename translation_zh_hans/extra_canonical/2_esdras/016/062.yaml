  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: medio corporis, et misit ei spiritum et uitam et intellectum, Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/062.yaml
  text: He formed man, and put a heart in the midst of the body, and gave him spirit and life and understanding,
translation:
  language: zh_hans
  text: 他塑造了人，把心安置在身体中央，又把灵、生命和悟性赐给他，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: medio corporis
  choice: 身体中央
  rationale: 直译该短语的空间含义，语言自然，并保留“身体中间”的具体表达。
- source_word: misit ei
  choice: 赐给他
  rationale: 拉丁文 misit 本义为“送出、放入”，在灵、生命和悟性这一并列宾语结构中，译作“赐给他”最符合汉语习惯，也与英译审校层的理解一致。
- source_word: spiritum
  choice: 灵
  rationale: 保留 spiritus 在此处可能兼有生命气息与属灵之灵的语义张力，不具体化为“灵魂”或“气息”。
- source_word: uitam
  choice: 生命
  rationale: 准确表达 vita，采用现代汉语中庄重而通行的说法。
- source_word: intellectum
  choice: 悟性
  rationale: 表达理解、领悟的能力，比单纯的“知识”更贴近 intellectus。
- source_word: finxit hominem（由审校层保存的上文语境）
  choice: 塑造了人
  rationale: 所给拉丁文摘录从 medio corporis 起，显然始于句中；英译审校层保存了本节前半句。“塑造”体现 finxit 的造作、成形之意。
theological_decisions:
- issue: spiritum 的含义
  choice: 灵
  alternative: 气息；灵魂
  rationale: “灵”既不把该词限制为生理呼吸，也不强行等同于后期系统神学中的“灵魂”，从而保留原文的开放性。
- issue: “心”在身体中央的表达
  choice: 按空间意象直译为“把心安置在身体中央”
  alternative: 意译为“赋予他内心”
  rationale: 原文明确使用 medio corporis；保留这一身体性意象，避免把古代人观改写成现代抽象心理概念。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。句末保留逗号，以反映所给原文和英译均为延续中的句子。所给拉丁文摘录从句中开始，因此前半句依据审校层所保存的对应语境译出。
