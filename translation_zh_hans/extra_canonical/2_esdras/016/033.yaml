base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/033.yaml
  text: And the land will be left desolate[a], and its fields will grow old, and its roads and all its paths will sprout thorns, because sheep will not pass through them.
translation:
  language: zh_hans
  text: 那地将被弃置，变得荒凉；田野将日渐衰败[a]，道路和一切小径都将长出荆棘，因为羊群不会从那里经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“将变得衰老（或陈旧）”。拉丁文此处动词形式也可直译为“已经衰老”，但上下文的其他动词均为将来时。
    reason: 说明 inveteraverunt 的词义意象及其与上下文时态不一致之处，避免把它误译成“长满荆棘”。
lexical_decisions:
- source_word: terra
  choice: 那地
  rationale: 此处指一片因无人和无羊经过而荒废的土地；“那地”比“地球”或泛指的“大地”更符合上下文。
- source_word: relinquetur deserta
  choice: 将被弃置，变得荒凉
  rationale: 保留被动语态及“遭弃置而荒凉”的结果关系，同时使现代汉语自然。
- source_word: agri
  choice: 田野
  rationale: 指该地所属的田地或田野；采用“田野”可自然承接荒废景象。
- source_word: inveteraverunt
  choice: 将日渐衰败
  rationale: invetero 的基本意象是变旧、衰老；用于无人照管的田野时，“日渐衰败”既保留其衰旧含义，又比直译“变老”自然。拉丁文此处形式为完成时，但相邻动词均指向未来，故按段落时序译为将来。
- source_word: viae eius et omnes semitae
  choice: 道路和一切小径
  rationale: 分别表达 viae 的道路与 semitae 的较窄路径，并以“一切”保留 omnes。
- source_word: germinabunt spinas
  choice: 都将长出荆棘
  rationale: 直译“萌生荆棘”；“长出荆棘”是清楚自然的汉语，并未把 spinas 改释为其他灌木。
- source_word: oves
  choice: 羊群
  rationale: 拉丁文复数 oves 指羊；在经过土地的场景中，汉语用“羊群”更自然。
- source_word: per eam
  choice: 从那里经过
  rationale: 阴性单数 eam 在语法上回指 terra，而不是复数的道路和小径；“那里”自然保留对整片土地的回指。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被弃置”“日渐衰败”“长出荆棘”形成清晰的荒凉图景；不沿用旧译中将 inveteraverunt 解释为长满荆棘的处理。
