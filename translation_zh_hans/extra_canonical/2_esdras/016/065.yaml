  text: Therefore the Lord will search out all their works and will expose you all. And you
translation:
  language: zh_hans
  text: 所以，主必查究他们的一切作为，把你们众人揭露出来。而你们
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinabit
  choice: 必查究
  rationale: 表达仔细察验、追查之意；“必”体现拉丁语将来时在此处的断定语气，并非额外加强词。
- source_word: omnia opera eorum
  choice: 他们的一切作为
  rationale: 忠实保留 omnia 的全称范围，并以现代汉语常用的“作为”表达 opera。
- source_word: traducet
  choice: 揭露出来
  rationale: 此处指将人公开揭发、暴露；“揭露出来”自然传达其使之显明并蒙羞的含义，同时不额外限定审判方式。
- source_word: uos omnes
  choice: 你们众人
  rationale: 保留第二人称复数及 omnes 所强调的无一例外。
- source_word: Et uos
  choice: 而你们
  rationale: 原文在本节末为未完结构，直译保留与下节衔接的悬置状态，不擅自补足谓语。
theological_decisions:
- issue: 审查者“主”的明示
  choice: 保留“主”
  alternative: 仅译为隐含主语“他”或省略
  rationale: 所给拉丁片段本身的 scrutinabit 未明示主语，但上下文及经审校的英语咨询层确定为 Dominus 所承接的主语；译出“主”可使现代汉语清楚，同时不增加宗派性解释。
- issue: 句末未完成的“Et uos”
  choice: 保留为“而你们”
  alternative: 删除或根据下节补全
  rationale: 该词组属于现存原文，并明显跨节延续；保留其未完成状态，既忠实文本边界，也避免预先解释下一节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“查究”兼具细察和追究意味；末尾刻意保留“而你们”的悬置句式，以对应拉丁文本跨节未完的结构。
