  yaml_path: translation/extra_canonical/2_esdras/016/066.yaml
  text: And you will be put to shame when your sins come forth before men[a], and your iniquities will stand as accusers on that day.
translation:
  language: zh_hans
  text: 你们的罪在众人面前显露时，你们必蒙羞；到那日，你们的不义必作为控告者站立。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusi eritis
  choice: 你们必蒙羞
  rationale: 表达因罪公开显露而受羞辱、羞愧的被动结果，语气庄重自然。
- source_word: processerint
  choice: 显露
  rationale: 该词本义为“出来、向前出现”；在罪呈于众人面前的语境中译作“显露”，既自然又保留公开暴露之意。
- source_word: coram hominibus
  choice: 在众人面前
  rationale: 准确传达公开在人面前的场景；“众人”比笼统的“人类”更符合此处语境。
- source_word: iniquitates
  choice: 不义之事
  rationale: 保留道德与司法色彩，也便于承接下文拟人化的控告行动。
- source_word: accusatores stabunt
  choice: 必站出来控告你们
  rationale: 将“不义之事”拟人为出庭控告者；“站出来控告”自然呈现司法场景，并传达其作为控告者站立的含义。
- source_word: in die illo
  choice: 到那日
  rationale: 采用庄重而通行的末世审判语汇，不额外界定“那日”的神学细节。
theological_decisions:
- issue: 罪行本身作为控告者的拟人化
  choice: 你们的不义之事必站出来控告你们
  alternative: 你们的不义必作为控告者站立
  rationale: 保留原文中罪行亲自成为控告者的张力，同时避免生硬直译；未增添魔鬼、良心或特定审判者等原文没有说明的主体。
translation_notes:
  register: 采用现代、庄重而易懂的审判场景语言。分号呈现罪公开显露与罪在末日作证控告之间的递进关系。原文末尾孤立的“Quid”显然属于下一句，未纳入本节。
