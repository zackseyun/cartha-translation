    reason: 拉丁文 processerint 可直译为“出来、出现”；正文依罪在众人面前被揭露的语境译为“显露”。
  revision_rationale: 修订仅调整末句，以更明确保留原文将“不义”拟人为在那日站立的控告者这一司法图像。前句及脚注的处理可保留。
