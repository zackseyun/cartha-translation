review_pass:
  verdict: revise
  source_fidelity: “你们必蒙羞”“在众人面前显露”准确传达 confusi eritis 与 peccata ... coram hominibus。末句“站出来控告你们”虽通顺，但将 accusatores stabunt 的“作为控告者站立”的法庭拟人化结构改写得较自由；修订恢复这一结构，同时不额外界定审判主体。
  naturalness: 修订后的措辞保持现代汉语可懂性和庄重的审判语境。“作为控告者站立”略具正式书面语色彩，适合本段先知性、司法性的语体，也比“站出来控告”更贴近原文的拟人化表达。
  terminology: “罪”对应 peccata，“不义”对应 iniquitates；二者在本节的并列得以保留。“那日”适当地保留 in die illo 的末世性而不作教义扩展。
  issues:
  - severity: medium
    issue: 末句将“作为控告者站立”简化为“站出来控告你们”。
    rationale: 拉丁文 iniquitates erint quae accusatores stabunt 突出“不义本身”成为、并站立作为控告者的拟人化法庭意象。原译虽传达控告结果，却弱化了“站立作为控告者”的结构；且“站出来”可能与前句 processerint 的“显露/出现”发生不必要的重复。
  revised_text: 你们的罪在众人面前显露时，你们必蒙羞；到那日，你们的不义必作为控告者站立。
  revised_footnotes:
  - marker: a
