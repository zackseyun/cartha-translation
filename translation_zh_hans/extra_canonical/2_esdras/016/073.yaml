lexical_decisions:
- source_word: deuastabunt
  choice: 必毁坏
  rationale: 保留将来时及“使荒废、毁坏”的强烈含义；“必”自然表达预告中的确定性。
- source_word: diripient
  choice: 掠夺
  rationale: 准确表达以暴力抢掠、夺取之意。
- source_word: substantias eorum
  choice: 这些人的财物
  rationale: 此处 substantiae 指产业、财产；译作“财物”通顺明确，eorum 依语境译为“这些人的”。
- source_word: domos
  choice: 房屋
  rationale: 直接对应“房屋、家宅”，不增添“把他们赶出去”等原文没有明说的动作。
