source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'omnia opera hominis et adinuentiones illorum et cogitatum illorum et corda illorum. Qui dixit: fiat terra, et facta est :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/055.yaml
  text: all the works of men and their devices and their thoughts and their hearts. He who said[a], “Let the earth be made,” and it was made;
translation:
  language: zh_hans
  text: 人的一切行为、他们的谋划、他们的思想和他们的内心。那位曾说[a]：“要有大地”，大地就有了；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句承接上节所说的主；也可连上节译作：“看哪，主知道人的一切行为、他们的谋划、他们的思想和他们的内心。他曾说……”
    reason: 说明拉丁文 Qui 的跨节承接关系，并澄清旧有译法所反映的经节切分差异，而不把上一节的文字纳入本节正文。
lexical_decisions:
- source_word: opera
  choice: 行为
  rationale: 在 omnia opera hominis 中指人所做的一切，译为“行为”自然且概括性强。
- source_word: adinventiones
  choice: 谋划
  rationale: 指人的设计、谋略或构想；“谋划”既保留筹谋之意，也不必然带贬义。
- source_word: cogitatum
  choice: 思想
  rationale: 原文形式可能是异体或讹误，语境明确指人的思念、意念；“思想”与并列结构相称。
- source_word: corda
  choice: 内心
  rationale: 拉丁语“心”在此指人的内在心思；现代汉语用“内心”可避免仅作生理器官理解。
- source_word: fiat terra
  choice: 要有大地
  rationale: fiat 是命令/愿望式的创造宣告；“要有……”简洁庄重，并与创世叙事的传统表达相呼应。
- source_word: facta est
  choice: 就有了
  rationale: 与 fiat 构成宣告及实现的对应；用“就有了”表达大地随命而成，符合现代汉语。
theological_decisions:
- issue: Qui 的先行词及本节与上节的衔接
  choice: 译作“那位曾说”，保留其承接上文所指之主的关系，不在本节补出“主知道”。
  alternative: 补译为“看哪，主知道……；他曾说”
  rationale: 所给拉丁文本以 omnia opera 开始，而“Ecce dominus cognoscit”属于上一节边界；不应把上一节文字移入本节。Qui 在语法上承接上文所指者，译为“那位”可保持跨节衔接。
- issue: 创造命令 fiat terra 的表达
  choice: “要有大地”
  alternative: “让大地被造出来”
  rationale: 前者更自然、庄重，也保留原文简短有力的施行性言语；后者虽形式更显被动，却较生硬。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。开头保留为承接上节的宾语串，反映所给拉丁文本的经节边界；以句号呈现原文从并列宾语转入关系从句的突兀衔接。末尾分号保留其继续下文的开放性。
