  text: quemadmodum praegnans in nono mense filium suum inadpropinquante hora partus eius, ante horas duas vel tres gementes dolores circum ventrem eius, et prodiente infante de ventre non tardabit uno puncto,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/039.yaml
  text: As when a pregnant woman in the ninth month[a], when the hour of her delivery draws near, two or three hours beforehand labor pains surround her womb, and when the child comes forth from the womb, it does not delay a single moment,
translation:
  language: zh_hans
  text: 正如一个怀孕到了第九个月的妇人，临近分娩的时候，在分娩前两三个小时，阵痛环绕着她的腹部；婴孩一从腹中出来，就一刻也不耽延，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnans in nono mense
  choice: 怀孕已到第九个月的妇人
  rationale: 直接表达妊娠月份，符合现代汉语习惯；“in nono mense”修饰孕期阶段。
- source_word: inadpropinquante hora partus eius
  choice: 临近分娩的时候
  rationale: 保留“分娩时刻临近”的时间含义，同时避免生硬直译。
- source_word: ante horas duas vel tres
  choice: 在生产前两三个小时
  rationale: ante 表示“在……之前”，不是持续“两三个小时”；明确其相对于生产的时间关系。
- source_word: gementes dolores
  choice: 阵痛
  rationale: 语境指临产疼痛；“阵痛”是现代汉语自然、准确的产科表达，也反映疼痛反复发作的语义。
- source_word: circum ventrem eius
  choice: 环绕着她的腹部
  rationale: 较形式地保留 circum（环绕）与 ventrem（腹部），不擅自缩窄为“子宫”。
- source_word: non tardabit uno puncto
  choice: 就一刻也不耽延
  rationale: 表达丝毫不迟延的意思；“一刻”在此为极短瞬间，并非现代计时单位十五分钟。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留原文贯穿全句的比喻结构和句末逗号，因为本节语法与论述在下一节延续。未沿用英文咨询层关于“第九个月”的脚注，因为拉丁文清楚区分 in nono mense 与 ante horas duas vel tres，并无该处异读或真实歧义。
