  text: The grape will yield itself for the vintage[a], and who will gather it? For there will be great desolation in places.
translation:
  language: zh_hans
  text: 葡萄要献上自己，供采收；谁来收取它呢？因为各处将有大荒凉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uva
  choice: 葡萄
  rationale: 直接对应拉丁语单数集合名词，可指葡萄果实，也可泛指葡萄收成。
- source_word: tradet se ad vindemiam
  choice: 要献上自己，供人收获
  rationale: 保留“交出自己”的拟人色彩；vindemia在此指葡萄的收获、采收，而非单纯“成熟”。
- source_word: adligabit
  choice: 采集
  rationale: 该词本义与捆扎、聚拢有关；在葡萄收获语境中译作“采集”较自然，同时不误译为“踩榨”。
- source_word: locis desertio multa
  choice: 许多地方将一片荒凉
  rationale: 以自然汉语表达“在许多地方有大规模荒废、荒凉”的意思；multa与locis的句法存在一定歧义，此译与上下文及英语审校层相符。
