  text: 灾祸来临时，他们在这一切中该怎么办呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: In his
  choice: 在这一切中
  rationale: 保留指向当前所述种种情势的复数指示含义，同时使现代汉语表达自然。
- source_word: malorum / mala
  choice: 灾祸
  rationale: 拉丁词可泛指各种恶事、祸患或灾难；此处语境着重临到的患难，译作“灾祸”既自然，也不额外限定具体种类。
- source_word: quid facient
  choice: 他们……该怎么办
  rationale: 采用英语审校层所反映的第三人称复数读法，并以现代汉语疑问句自然表达。
- source_word: cum venerint
  choice: 来临时
  rationale: 准确表达时间关系，不把灾祸说成已经发生。
