  yaml_path: translation/extra_canonical/2_esdras/016/010.yaml
  text: Will there be anyone to extinguish him? He will flash forth, and who will not fear?
translation:
  language: zh_hans
  text: 有谁能将它扑灭呢？它必闪耀，谁能不惧怕呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: extinguat
  choice: 扑灭
  rationale: 该动词表示使火熄灭；现代汉语谈到火时，“扑灭”自然、准确，也保留反问的力度。
- source_word: eum
  choice: 它
  rationale: 拉丁语阳性代词依语法指向上下文中的阳性名词（火）；汉语按实际所指用“它”，不把火误作人物。
- source_word: Coruscabit
  choice: 他必闪出电光
  rationale: coruscare 可指闪耀、发出闪电；此处以“闪出电光”保留动作和神显般的强烈意象，又不擅自增添“雷鸣”。
- source_word: timebit
  choice: 惧怕
  rationale: 直接表达敬畏或恐惧，未将语义缩窄为单纯“受惊”。
theological_decisions:
- issue: Coruscabit 的主语及神显意象
  choice: 用“他”承接隐含的行动者，并译为“闪出电光”
  alternative: 译作“它必闪耀”或明确增补“上帝必发出闪电”
  rationale: 拉丁语动词主语未明说；上下文可指向上帝，但正文不补出专名，以保留原文的衔接方式。“闪出电光”也避免把闪电意象解释成特定教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个反问句保留原文的修辞力度；不沿用缺乏本节拉丁文本依据的“他必打雷，谁能不战栗”等增补。
