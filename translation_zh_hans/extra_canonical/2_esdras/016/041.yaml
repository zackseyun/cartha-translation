base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/041.yaml
  text: 'Hear the word, my people: prepare yourselves for battle, and in the midst of evils be like strangers on the earth.'
translation:
  language: zh_hans
  text: “我的子民啊，听这话：你们要准备作战；在种种患难中，要在地上如寄居者一般。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文在“在种种患难中”（et in malis）处中断；后半句“要在地上如寄居者一般”依据所附英文审校参照文本补出。
    reason: 明确区分所引拉丁文中实际可见的文字与审校参照文本所保留的续文。
lexical_decisions:
- source_word: Audite uerbum
  choice: 要听这话
  rationale: 保留命令语气；这里的“话”指即将宣告的信息，比孤立译作“言语”更自然。
- source_word: plebs mea
  choice: 我的子民啊
  rationale: plebs 在此是对群体的直接呼告；“子民”庄重而符合现代汉语经文语体。
- source_word: parate uos in pugnam
  choice: 你们要准备作战
  rationale: 直译其反身结构和战斗含义，不将 pugna 具体化为某一场战争。
- source_word: in malis
  choice: 在种种灾祸中
  rationale: malis 为复数，含义宽泛，可指患难、灾害或恶劣处境；“种种灾祸”保留其复数及末世灾难语境。
- source_word: be like strangers on the earth (consultation-layer continuation)
  choice: 要像寄居者一样生活在地上
  rationale: “寄居者”既表达身处当地却不以当地为永久家园的人，也保持该劝勉的比喻性质；补出“生活”使现代汉语通顺。
theological_decisions:
- issue: “像寄居者一样”是否意味着脱离世界或否定尘世
  choice: 保持比喻，不加神学解释
  alternative: 译成“不要贪恋世上的一切”或“把自己看作天国公民”
  rationale: 这些替代译法会把经文的开放性收窄，并引入原句没有明说的教义解释。
- issue: malis 的道德性或灾难性
  choice: 译作“灾祸”
  alternative: 译作“邪恶之中”
  rationale: 上下文是备战和患难中的生活姿态，因此处境性的“灾祸”较合适；不把它限定为伦理意义上的邪恶。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我的子民啊”保留呼告感；分号呈现“预备作战”与“灾祸中如寄居者生活”这两个并列劝命。由于所给拉丁文不完整，以脚注如实标明续文的依据。
