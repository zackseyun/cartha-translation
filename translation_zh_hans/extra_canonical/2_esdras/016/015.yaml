lexical_decisions:
- source_word: Ignis
  choice: 火
  rationale: 直接对应拉丁文“火”，保留简洁而具审判意象的表达。
- source_word: succenditur
  choice: 已经燃起
  rationale: 拉丁文为现在时被动形式；汉语用“已经燃起”自然表达火已被点燃、现正燃烧的状态，同时不明说点火者。
- source_word: non extinguetur
  choice: 必不熄灭
  rationale: 对应将来时被动否定；“必不熄灭”兼顾将来指向和确定语气，并避免补入原文未有的时限或结果。
theological_decisions:
- issue: 火的施动者及持续时间
  choice: 不明说是谁点火，也不添加火燃烧到何时
  alternative: 译作“上帝点燃了火”或补入“直到吞灭大地的根基”
  rationale: 拉丁文被动式没有明示施动者，本节所给文本也没有说明终止时间或结果；保留这些未明说之处，避免神学性增补。
translation_notes:
