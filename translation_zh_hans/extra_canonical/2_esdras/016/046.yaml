review_pass:
  verdict: revise
  source_fidelity: “徒然劳作”将拉丁文 sine causa 明确解释为劳作无效或无成果；虽在灾变语境中可以理解，却比原文和英文审校轨迹的“without cause”更窄。应保留“没有缘由／无故”的较开放表述。原文的 nubunt 与 quasi uidui 的反常比较应直接保留，不补充丧偶的时间或原因。
  naturalness: 原译整体通顺、庄重。“他们结婚，却像丧偶的人一样”自然，但“却”并非原文明确的转折连接；用“如同”可更直接对应 sic quasi，同时仍保留其反常张力。“劳作的人无故劳作”稍显重复但可接受，并保留原文 qui laborant…laborant 的重复。
  terminology: “丧偶的人”是对 uidui 的中性、现代且不预设性别的处理；“劳作”适合此处庄重语体。将 sine causa 译为“无故”避免把其限定为“徒然”。
  issues:
  - severity: medium
    issue: “徒然”对 sine causa 的解释性较强。
    rationale: sine causa 的基本意义是“没有缘由／无故”，英文审校轨迹也明确采用“without cause”。“徒然”把意思收窄为没有成效，属于可推断但未明说的结果。
  - severity: low
    issue: “却”增添了原文未明示的转折语气。
    rationale: sic quasi 是“如同／仿佛”的比较表达；该处的悖论已经由比较本身呈现，无需以“却”加强。
  revised_text: 他们结婚，如同丧偶的人；因此，劳作的人无故劳作。
