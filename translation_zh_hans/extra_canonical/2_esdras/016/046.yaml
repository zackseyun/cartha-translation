  text: they marry, as though widowed; therefore those who labor labor without cause
translation:
  language: zh_hans
  text: 他们结婚，如同丧偶的人；因此，劳作的人无故劳作。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nubunt
  choice: 他们结婚
  rationale: 直译拉丁文现在时复数动词，措辞自然明确。
- source_word: sic quasi uidui
  choice: 却像丧偶的人一样
  rationale: 保留“如同丧偶者”的反常张力；以“却”自然呈现语义反差，但不额外解释其原因。
- source_word: qui laborant
  choice: 劳作的人
  rationale: 保留泛指关系从句的含义，并与后面的动词形成原文式重复。
- source_word: sine causa
  choice: 徒然
  rationale: 在此语境中表示劳作没有成效、归于空无；“徒然”比生硬的“无缘无故”更符合中文表达，同时不限定具体原因。
theological_decisions:
- issue: 婚后‘如同丧偶’的含义
  choice: 不解释其具体所指，保留末世灾祸语境中的悖论式表达
  alternative: 译成‘结了婚也很快丧偶’或‘有配偶却像没有一样’
  rationale: 原文仅作比较，没有明说死亡时间或婚姻状态的具体变化；释义性扩展会消除原有歧义。
- issue: 劳作‘sine causa’的性质
  choice: 译为‘徒然劳作’，表达劳作归于无效
  alternative: 译为‘无缘无故地劳作’或‘毫无理由地劳作’
  rationale: 上下文更可能强调灾难中劳作不能带来预期成果，而非行为缺少动机；但不补出具体损失。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“劳作的人徒然劳作”的重复，以体现拉丁文 qui laborant…laborant 的修辞结构。
