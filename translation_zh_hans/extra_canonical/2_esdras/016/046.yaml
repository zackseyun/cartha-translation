- from: 他们结婚，却像丧偶的人一样；因此，劳作的人徒然劳作。
  to: 他们结婚，如同丧偶的人；因此，劳作的人无故劳作。
  rationale: 修订以“如同”直接对应 sic quasi，删除未明示的转折连接；并将“徒然”改为“无故”，以保留 sine causa 的较宽、较字面的“没有缘由”含义，同时保留“劳作的人……劳作”的重复结构。
