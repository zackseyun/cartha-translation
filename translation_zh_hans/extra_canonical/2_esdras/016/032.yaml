    issue: “持刀而来”是无根据的扩展。
    rationale: in romphea 表示与刀剑相关的方式或伴随情状，并不包含“而来”的动作。
  - severity: medium
    issue: “能幸存”将 remanebunt 的“留下／剩下”收窄为明确生还。
    rationale: 本节灾难语境可使“幸存”成为可能理解，但拉丁文本身使用的是较宽的 remanere，宜在正文保留其开放性。
  - severity: low
