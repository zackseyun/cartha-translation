    rationale: ab scrutantibus 的关系较压缩；修订以“在……人手下”作自然的灾难语境表达，避免增加“持刀而来”这一额外叙事动作。
  revised_text: 那时，在那些带着刀剑搜查他们房屋的人手下，仅会留下三四个人。
