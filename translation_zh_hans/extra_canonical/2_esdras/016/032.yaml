revisions:
- from: 所以在那些日子，搜查他们房屋的人持刀而来，只有三四个人能幸存。
  to: 那时，在那些带着刀剑搜查他们房屋的人手下，仅会留下三四个人。
  rationale: 修订删除原文没有的“而来”，以“带着刀剑”呈现 in romphea，并将“幸存”改为“留下”以贴近 remanebunt。句子仍在不强加特定神学或历史解释的前提下，传达持械搜查所构成的威胁。
