  verdict: revise
  source_fidelity: 草稿正确保留了“三四人”、搜查房屋及刀剑等核心意象，但将压缩而略有歧义的 ab scrutantibus ... in romphea 明确扩展为“持刀而来”及搜查行动造成灾祸后的“幸存”。“而来”并无原文依据；“幸存”也较 remanebunt（留下、剩下）更强。修订以“在……人手下”表达危险处境，同时保留“留下”的较宽含义。
  naturalness: 原译流畅，但“搜查他们房屋的人持刀而来”把“刀”与“来”绑定，且后半句的因果关系被说得过满。修订后的句子符合现代汉语，并使“带着刀剑”自然修饰搜查者。
  terminology: “刀剑”比单称“刀”更适合概括 romphea 所指的刃器，且不需不必要地指定武器类别。“留下”对应 remanebunt，避免把文本未明说的死亡／存活结果完全定为“幸存”。
  issues:
