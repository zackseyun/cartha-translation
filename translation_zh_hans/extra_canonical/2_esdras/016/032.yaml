  yaml_path: translation/extra_canonical/2_esdras/016/032.yaml
  text: So in those days, three or four will remain from those who search their houses with the sword.
translation:
  language: zh_hans
  text: 那时，在那些带着刀剑搜查他们房屋的人手下，仅会留下三四个人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: remanebunt
  choice: 能幸存
  rationale: 这里指在持刀搜查造成的灾难中仍然存活；译作“幸存”比机械地译作“留下”更符合现代汉语，同时保留结果含义。
- source_word: tres vel quattuor
  choice: 三四个人
  rationale: 拉丁文直译为“三个或四个”；汉语以“三四个人”自然表达约数。
- source_word: scrutantibus domos eorum
  choice: 搜查他们房屋的人
  rationale: 保留 scrutari 的仔细搜查之意及 domos eorum 的所属关系。
- source_word: in romphea
  choice: 持刀而来
  rationale: romphea 指大型刀剑类武器；此处用“刀”作通俗总称，并以“持……而来”表达工具或伴随关系，避免生硬的“用刀搜查”。
theological_decisions:
- issue: 幸存者与搜查者之间的句法关系
  choice: 将三四人理解为在持刀搜查者造成的灾祸中幸存的人
  alternative: 译作“三四个人将从持刀搜查他们房屋的人那里留下来”
  rationale: 拉丁文 ab scrutantibus 可表达施事或摆脱、存留于某群体行动之后的关系，原句较为压缩。中文正文作自然化处理，但不增加特定神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。将原文压缩且略显含混的结构重组为自然汉语，突出末世灾难语境中的少数幸存者；不用古奥的“刀剑”或音译武器名。
