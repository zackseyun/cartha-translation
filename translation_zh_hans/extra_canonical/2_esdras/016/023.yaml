id: 2ES.16.23
reference: 2 Esdras 16:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et aporiant vitam super terram, et gladius dispersit quae superaverint a fame.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/023.yaml
  text: And they will lose their lives upon the earth[a], and the sword will scatter those who survive the famine.
translation:
  language: zh_hans
  text: 他们将在地上失去生命[a]；刀剑必驱散那些从饥荒中幸存的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一种拉丁文本作：“因为住在地上的许多人将死于饥荒；刀剑必毁灭那些从饥荒中幸存的人。”
    reason: 说明广为流传的另一文本形式；其前半句和“毁灭”均不同于本译所据底本。
lexical_decisions:
- source_word: aporiant vitam
  choice: 失去生命
  rationale: 按所给拉丁文本直译其结果含义；aporiant 的文本和词义较罕见，保留“生命匮乏／丧失”的表达，不改从另一异文的“死于饥荒”。
- source_word: super terram
  choice: 在地上
  rationale: 对应拉丁语地点短语，保持简洁自然。
- source_word: gladius
  choice: 刀剑
  rationale: 既可指实际兵器，也可转指战争杀戮；“刀剑”保留原文意象。
- source_word: dispersit
  choice: 必驱散
  rationale: 依据上下文将拉丁完成时形式按预言性将来理解，同时保留 dispergere 的“驱散”而不改译为异文中的“毁灭”。
- source_word: quae superaverint a fame
  choice: 那些从饥荒中幸存的人
  rationale: 按意义处理关系代词 quae；superaverint 表示存留下来，a fame 表示从饥荒之中逃过。
theological_decisions:
- issue: 灾难预言中刀剑的作用
  choice: 驱散
  alternative: 毁灭
  rationale: 所给文本是 dispersit，而“毁灭”来自另一拉丁异文 perdet；不以更强的毁灭含义取代当前底本。
- issue: 前半句是否明确说死于饥荒
  choice: 不明确加入饥荒为死因
  alternative: 许多住在地上的人将死于饥荒
  rationale: 当前底本前半句只写 aporiant vitam super terram；饥荒明确出现在后半句，因此不把另一异文的信息并入正文。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“失去生命”紧贴罕见的拉丁表达；分号呈现两个相连的灾难结果。
