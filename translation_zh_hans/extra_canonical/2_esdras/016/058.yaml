  text: He searches the deep and its treasures; he has measured the sea and what it contains; he has enclosed the sea in the midst of the waters and suspended the earth.
translation:
  language: zh_hans
  text: 他探察深渊和其中的宝藏；他量了海和其中所容纳的一切；他把海封闭在众水之中，又将大地悬挂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: thesauros illorum
  choice: 其中的宝藏
  rationale: 按上下文承接“深渊”，以自然汉语表达“属于其中的宝藏”；拉丁语节选从这一宾语短语起首，前一分句据经文连续文本及审校层保留。
- source_word: metitus est mare
  choice: 量过海
  rationale: 保留 metiri 的“测量”含义，并以“过”表达已完成的动作。
- source_word: conceptum eius
  choice: 海中所容的一切
  rationale: conceptum 在此指海所包容、容纳之物；避免把具体内容限定为某一类受造物。
- source_word: conclusit mare in medio aquarum
  choice: 把海封闭在众水之中
  rationale: 贴近 conclusit 的围住、封闭之意，并保留“海”与“众水”并置所形成的原文张力。
- source_word: suspendit terram
  choice: 使大地悬在空中
  rationale: 用现代汉语清楚表达“使大地悬起”；“在空中”是汉语为说明悬置状态所需的自然补足，并不指定其支撑机制。
theological_decisions:
- issue: 施行动作的主语
  choice: 连续使用“他”指向上下文中的神
  alternative: 重复使用“那一位”或“他就是那……”
  rationale: 拉丁文关系代词 qui 延续前文所指；简明的“他”既自然，也不额外加入神名或解释性称号。
- issue: 海在众水之中被封闭的宇宙图景
  choice: 直译为“把海封闭在众水之中”
  alternative: 解释为“为海划定界限”
  rationale: 原文措辞本身带有古代宇宙图景的张力；不将其消解为较抽象的边界观念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。各分句保持平行节奏，尽量保存原文的受造秩序意象，不添加宗派性解释。
