  text: So be as strangers in the land; the one who sells, as one who will flee;
translation:
  language: zh_hans
  text: 所以，你们要像在这地上寄居的人一样；卖东西的，要像将要逃走的人一样；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sic
  choice: 所以
  rationale: 承接上下文所作的劝告或结论；在本节独立呈现时，“所以”比生硬的“如此”更符合现代汉语。
- source_word: aduenae terrae
  choice: 在这地上……寄居者
  rationale: aduenae 指外来者、寄居者；terrae 在此表达身处此地而不以此为永久家园的意味。译作“在这地上要像寄居者”自然且保留原文张力。
- source_word: Qui uendit
  choice: 卖东西的
  rationale: 保留泛指结构，不增补原文没有出现的买方。
- source_word: quasi qui fugiet
  choice: 要像即将逃离的人
  rationale: 保留 quasi 的比拟关系和 fugiet 的将来意味；“即将逃离”传达因迫近危机而离去，不额外说明原因。
theological_decisions:
- issue: “寄居者”的属灵或末世含义
  choice: 保留为一般性的“寄居者”比喻
  alternative: 明确译成“不属于这世界的人”或“世上的客旅”
  rationale: 拉丁文本只说 aduenae terrae；不把可能的末世背景扩写成特定神学解释。
- issue: 卖东西者与逃离者的关系
  choice: 保留简略比拟句式
  alternative: 解释为“卖东西时要像马上就得逃走一样”
  rationale: 原文表达凝练，未明确说明出售行为的方式或动机，因此不应过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。用“你们”明示拉丁语复数命令 estote 的对象；分号对应两项相连的劝告，并保留原文末尾未完待续的节奏。
