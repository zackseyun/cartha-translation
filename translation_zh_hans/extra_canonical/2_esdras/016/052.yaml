  text: Quoniam ecce adhuc pusillum et tolletur iniquitas a terra, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/052.yaml
  text: For behold[a], yet a little while, and iniquity will be taken away from the earth, and
translation:
  language: zh_hans
  text: 因为看哪，再过不久，不义就要从地上除去，并且……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quoniam
  choice: 因为
  rationale: 保留因果连接，表明本句承接上文；不将其弱化为单纯叙述。
- source_word: ecce
  choice: 看哪
  rationale: 保留提示读者注意的语气，采用庄重而易懂的现代圣经语体。
- source_word: adhuc pusillum
  choice: 再过不久
  rationale: 自然表达时间上的短暂延后；比逐字译作“尚有一点”更符合现代汉语。
- source_word: tolletur
  choice: 就要……除去
  rationale: 体现将来时与被动意义，不擅自指明执行者。
- source_word: iniquitas
  choice: 不义
  rationale: 涵盖邪恶、违法与不正的抽象含义，不窄化为某一种具体罪行。
- source_word: a terra
  choice: 从地上
  rationale: 准确保留介词所表达的移除起点及 terra 的广义范围。
- source_word: et
  choice: 并且……
  rationale: 原文止于连接词，显然句意未完；以省略号保留跨节延续性。
theological_decisions:
- issue: 不义被除去的施事者
  choice: 采用被动式“就要从地上除去”
  alternative: 译作“上帝就要从地上除去不义”
  rationale: 拉丁文本未明说施事者；虽可理解为神圣被动，但正文不应补入原文没有明确表达的主语。
- issue: 句末未完成结构
  choice: 保留“并且……”
  alternative: 删去句末连接词，形成完整独立句
  rationale: 源文本以 et 结束，说明本节与下文连成一句；保留这一张力可避免掩盖分节边界与句法边界不重合的事实。
translation_notes:
  register: 采用现代、庄重、可朗读的简体中文。“看哪”保留经文提示语气；句末省略号仅用于显示源文本在“并且”处中断，需接续下一节。
