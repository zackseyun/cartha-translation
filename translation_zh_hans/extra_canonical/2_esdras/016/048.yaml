  yaml_path: translation/extra_canonical/2_esdras/016/048.yaml
  text: And those who conduct business do so for plunder[a], as long as they adorn themselves;
translation:
  language: zh_hans
  text: 那些经商的，为掠夺而经商[a]，只要他们还在装点[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在劫掠中经商”。“掠夺”也可指掠得之物；按上下文，此处可能是说他们经营所得将沦为掠物。
    reason: 拉丁文 in rapina 的关系含混；正文保留较直接的“为掠夺而”表达，注释说明可能的语境性理解。
  - marker: b
    text: 原文只说“装点”，没有说明所装点的是自己、货物还是别的对象；也可译作“置办”。
    reason: exornant 是及物动词，但此处宾语省略；不宜无注释地补作“自己”。
lexical_decisions:
- source_word: negociantur
  choice: 经商
  rationale: 该词指从事买卖、贸易；重复译出，以保留原文“经商的人经商”的强调结构。
- source_word: in rapina
  choice: 所得不过成为掠物
  rationale: 结合上下文中财物将被夺走的主题，表达经营所得最终沦为他人掠物；同时不将其定解为商人主动从事劫掠。
- source_word: quamdiu
  choice: 只要……还……
  rationale: 保留时间或条件持续义，且与后续语境衔接自然。
- source_word: exornant
  choice: 装点
  rationale: 拉丁文动词可指装饰、布置或置办，原句未明说宾语；译文不擅自补定对象。
theological_decisions:
- issue: in rapina所表达的是主动劫掠还是财物成为掠物
  choice: 译作“所得不过成为掠物”
  alternative: “经商如同劫掠”或“经商是为了掠夺”
  rationale: 本段描写末世灾难使日常劳作及产业归于徒然，前者较符合语境，也避免把商人描写成主动掠夺者；脚注保留语法上的其他可能。
- issue: exornant的隐含宾语
  choice: 不补出明确宾语
  alternative: 补作“装饰自己”
  rationale: 拉丁文没有反身代词，所装点的可能是自己、货物或其他对象；保留原文省略造成的开放性。
translation_notes:
  register: 采用庄重而通俗的现代汉语。保留原文重复句式及句末未完的衔接感；以逗号收束，对应所给拉丁文本似乎仍承接下文。
