  text: He placed pools upon the mountain tops[a], to send forth rivers from the heights so that the earth might drink.
translation:
  language: zh_hans
  text: 他又在山巅安置湖泊[a]，使河流从高处流出，好让大地得以饮水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “湖泊”或译“水池”。
    reason: 拉丁文 lacus 兼有湖泊、水池或蓄水处等义，具体规模未被限定。
lexical_decisions:
- source_word: lacus
  choice: 湖泊
  rationale: 该词可指湖泊、水池或蓄水之处；结合“山巅”以及由此发出河流的图景，正文采用自然的“湖泊”，并以脚注保留另一种可能。
- source_word: ad emittendum flumina
  choice: 使河流……奔涌而出
  rationale: 表达目的或功用；“奔涌而出”既传达 emittendum 的“发出、放出”，也符合河水自高处流出的动态画面。
- source_word: ab eminenti
  choice: 从高处
  rationale: 依照拉丁文保留其概括表达，不擅自具体化为某一山峰或地点。
- source_word: ut potaret terra
  choice: 好让大地得以饮水
  rationale: terra 是 potaret 的主语；此译保留“大地饮水”的拟人化诗意，而不改写成“浇灌大地”。
theological_decisions:
- issue: 本节开头省略的主语
  choice: 以“他”承接上下文，并用“又”反映 et 的连接作用
  alternative: 明说“上帝”或其他称谓
  rationale: 所给拉丁文此分句没有明示主语；采用代词可忠实承接上下文，避免在本节自行补入源文未出现的神名或称号。
- issue: 所给拉丁文末尾残留下一分句“Qui finxit hominem, et posuit cor in”
  choice: 不纳入本节正文
  alternative: 把未完句译作“他塑造了人，并把心放在……”
  rationale: 该短语明显未完，且经审定的英文咨询层将本节止于 terra；不应把下一节残句并入本节或强行补足。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“山巅”“奔涌而出”保留高处水源流下的宏阔意象；“大地得以饮水”忠实保留原文拟人表达。
