    issue: “恶行”对 iniquities 的语义过窄。
    rationale: “恶行”主要指人所作的坏事；英文审校轨迹的 iniquities，以及该处预期的拉丁平行词，更适宜译作“罪孽”，以保留其可指罪责、不义和罪过的较宽含义。
