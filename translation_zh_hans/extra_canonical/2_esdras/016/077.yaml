  yaml_path: translation/extra_canonical/2_esdras/016/077.yaml
  text: For God is your guide. And you who keep my commandments and my ordinances, says the Lord God, do not let your sins weigh you down, nor let your iniquities prevail over you.
translation:
  language: zh_hans
  text: 因为上帝是你们的引路者。主上帝说：“你们这些遵守我的诫命和律例的人，不要让你们的罪压垮你们，也不要让你们的罪孽胜过你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dux
  choice: 引路者
  rationale: 既保留“带领、引导者”的核心意义，也比偏军事性的“统帅”更符合此处劝勉语境。
- source_word: mandata et praecepta
  choice: 诫命和律例
  rationale: 用两个自然且有区别的汉语宗教法律词，保留拉丁文并列结构，而不将两词合并。
- source_word: praeponderent
  choice: 压垮
  rationale: 传达原词“重量压过、压倒”的形象，在现代汉语中自然有力。
- source_word: iniquitates … prevail
  choice: 恶行胜过
  rationale: 依审校英文补足的平行分句译出；“恶行”避免把 iniquitas 仅抽象化为状态，“胜过”保留其占上风的意味。
theological_decisions:
- issue: 上帝的引导角色
  choice: 引路者
  alternative: 领袖／统帅
  rationale: 不把 dux 限定为军事或政治身份，保留上帝带领其子民的宽广含义。
- issue: 罪与人的关系所用意象
  choice: 罪压垮、恶行胜过
  alternative: 罪孽加重、过犯辖制
  rationale: 保留两个不同的意象，不引入“辖制”等较强的体系化神学措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“你们这些……的人”明确拉丁文 qui seruatis 的呼语功能；引语标点则使 dicit dominus deus 的说话层次清楚。所给拉丁文本在 ne praeponderent uos 后止住，句法上似不完整；末尾关于“罪”和“恶行”的完整平行表达依据经审校的英文咨询层译出。
