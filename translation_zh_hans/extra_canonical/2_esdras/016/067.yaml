  text: What will you do? Or how will you hide your sins before God
translation:
  language: zh_hans
  text: 你们要怎么办呢？又怎能在上帝面前隐藏你们的罪？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: facietis
  choice: 你们要怎么办呢
  rationale: 该词是第二人称复数将来时；结合独立问句语境，译为自然的反问“要怎么办”，保留对众人的直接质问。
- source_word: abscondetis
  choice: 隐藏
  rationale: 直译其“藏匿、掩藏”之义，不改译为“逃避”或“否认”。
- source_word: peccata uestra
  choice: 你们的罪
  rationale: 保留复数所指的多项罪过；现代汉语以集合名词“罪”表达最自然。
- source_word: coram deo
  choice: 在上帝面前
  rationale: 准确保留 coram 的临在与面对之意，且采用现代、庄重而易懂的宗教用语。
theological_decisions:
- issue: 人能否向上帝隐藏罪
  choice: 保留原文反问，不增添解释
  alternative: 明说“你们绝不能向上帝隐藏罪”
  rationale: 原文以反问形成警告和张力，译文不把其改写为明确的教义陈述。
- issue: 经文结尾范围
  choice: 止于“上帝”
  alternative: 增添“和他的天使”
  rationale: 所提供的拉丁文只到 et 之前；“和他的天使”不见于本节给定的源文证据，因此不补入。
translation_notes:
  register: 采用现代标准普通话和庄重的经文语体。“你们”明确反映两个动词的第二人称复数；两个问句简洁有力。源文末尾残留连词 et，显示句子可能接续下文，但不凭缺失内容擅自补译。
