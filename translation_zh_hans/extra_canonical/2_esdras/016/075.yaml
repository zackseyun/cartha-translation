  text: 'Hear, my chosen ones, says the Lord: behold, days of tribulation are here, and from them I will deliver you. Do not fear or hesitate,'
translation:
  language: zh_hans
  text: “我所拣选的人哪，你们要听，”主说，“看哪，患难的日子已经来到，我必救你们脱离这些患难。不要惧怕，也不要迟疑，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electi mei
  choice: 我的选民
  rationale: 准确保留“被拣选者”的群体身份和所属关系；“选民”是庄重而通行的现代汉语表达。
- source_word: adsunt
  choice: 已经来到
  rationale: 表达这些日子已临到、已在眼前，而非仅仅临近；“已经来到”比生硬的“在这里”更符合汉语习惯。
- source_word: dies tribulationis
  choice: 患难的日子
  rationale: 保留原文的复数意象和患难性质，语言自然且具有经文庄重感。
- source_word: de his liberabo uos
  choice: 我要救你们脱离这些患难
  rationale: 将拉丁文代词 his 的所指明确为前述患难，同时保留“从其中解救出来”的含义。
- source_word: haesitemini
  choice: 动摇
  rationale: 该词在语境中可指迟疑、踌躇或失去坚定；“动摇”与“惧怕”并列自然，也保留面对患难时不要迟疑退缩的含义。
theological_decisions:
- issue: 患难已经临到与蒙拯救之间的张力
  choice: 患难的日子“已经来到”，但主将救选民脱离这些患难
  alternative: 将 adsunt 译为“临近了”
  rationale: 原文 adsunt 表示在场、已临到，不应为缓和张力而改成未来性的“临近”；译文保留患难现实与应许拯救并存的表达。
- issue: “救你们脱离这些患难”的范围和方式
  choice: 不补充获救的时间、方式或终末论含义
  alternative: 解释为免遭患难或经过患难后得救
  rationale: 拉丁文只陈述将从这些事中解救，并未明确具体方式；译文保留这一开放性。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。“我的选民哪”体现直接呼告；以“看哪”保留 ecce 的郑重提示功能。末尾逗号依照所给节文，表明句意在下一节继续。
