  text: Mourn for them[a], because your destruction has drawn near.
translation:
  language: zh_hans
  text: 要为他们哀痛，因为你们的毁灭已经临近。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dolete eos
  choice: 要为他们哀哭
  rationale: dolete 是复数命令式，表示悲痛、哀悼；eos 指阳性复数对象。译为“为他们哀哭”既保留对象，也符合庄重的预言语体。
- source_word: contritio vestra
  choice: 你们的毁灭
  rationale: contritio 在此末世灾祸语境中指毁坏、覆灭；vestra 为复数第二人称所属，故译作“你们的毁灭”。
- source_word: adpropinquauit
  choice: 已经临近
  rationale: 完成时表示临近已成为现实；“已经临近”自然传达迫近的紧迫感。
theological_decisions:
- issue: contritio 的具体意象
  choice: 毁灭
  alternative: 被摧毁／粉碎
  rationale: 原词既可带有压碎的具体意象，也可泛指毁坏或覆灭。正文采用符合先知性灾祸语境的“毁灭”，脚注保留较字面的可能性，不把灾祸的方式解释得过于具体。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。保留复数第二人称“你们”及“他们”这一未在本节内明确交代的指代关系；不纳入末尾属于下一句的 Inmissus。
