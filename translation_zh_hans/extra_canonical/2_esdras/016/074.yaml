  text: Then the testing of my chosen ones will appear[a][b], like gold that is tested by fire.
translation:
  language: zh_hans
  text: 那时，我所拣选的人所受的考验将会显明，如同金子受火试验一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那时，我所拣选的人经考验所证实的真实品质将会显明，如同金子受火试验一样。”拉丁语 probatio 既可指考验的过程，也可指经考验后所证实的真实性或真实品质。
    reason: lexical_alternative
lexical_decisions:
- source_word: probatio
  choice: 所经受的考验
  rationale: 首先保留拉丁词的过程义，即在患难中受到试验；同时借助脚注说明它也可指经试验后显出的真实品格。
- source_word: parebit
  choice: 就会显明
  rationale: 对应“将显现、将变得明显”，不把何者显明进一步解释为获救、得胜或被认出。
- source_word: ut aurum quod probatur ab igne
  choice: 如同金子经火检验一样
  rationale: 保留原文的明喻，并以“检验”呼应同词根的 probatio 与 probatur。
theological_decisions:
- issue: 考验的过程与考验所证实的品格之间的歧义
  choice: 正文采用“所经受的考验”，侧重试炼的过程
  alternative: “经考验而证实的品格”
  rationale: probatio 通常可指考验、验证，也可转指验证所得的真实性；紧接的 probatur 和火炼金子的比喻支持正文的过程义，但不足以排除结果义，因此在脚注中保留另一读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我所拣选的人”清楚表达 electorum meorum；“经火检验”避免过度文学化，也保留原文“考验—检验”的词义呼应。所给拉丁文本开头的 suas eos eicient 是上一句残留的句尾，英语审校层也未将其纳入本节正文，故本稿从 Tunc 起译。
