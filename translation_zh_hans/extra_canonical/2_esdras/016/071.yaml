  text: For there will be much uprising in place after place and in the neighboring cities.
translation:
  language: zh_hans
  text: 因为这地方那地方和邻近的城里都将发生许多起事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: locis locus
  choice: 各处
  rationale: 原文这一短语文字可能有传抄或格形问题；结合英语审校层所理解的“place after place”，译作“各处”，既自然，也避免过度修补原文。
- source_word: uicinas ciuitates
  choice: 邻近的城中
  rationale: 直译其空间含义，指邻近的城市；加“中”使汉语句法自然。
- source_word: exsurrectio multa
  choice: 许多骚乱
  rationale: exsurrectio 可指起事、暴动或骚乱；multa 表示数量多或程度广。选“许多骚乱”保留其广义社会动荡含义，不擅自指定对象或政治性质。
theological_decisions:
- issue: 骚乱是否针对敬畏主的人
  choice: 不补出任何对象
  alternative: 译作“反对敬畏主之人的大规模起事”
  rationale: 本节拉丁文没有表示对象的成分；依原文不加入神学或叙事上的补足。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“因为”承接上文的 enim；整体语序按自然汉语调整，同时保持原文关于多地及邻城发生动乱的信息。
