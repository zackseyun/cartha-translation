  text: 他们的城邑、房屋、财产和自身；越发如此[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节为残句，并在“越发如此”处接续下文；拉丁文没有说明这里所比较的具体动作。
    reason: 提示读者源文在节界处句意未完，且防止将后世或上下文推断直接写入正文。
lexical_decisions:
- source_word: ciuitates
  choice: 城邑
  rationale: 准确表达复数的城市或城镇，并采用庄重而易懂的经文语体。
- source_word: domus
  choice: 房屋
  rationale: 在与城邑、财产并列的语境中，指具体的住宅或房舍。
- source_word: possessiones
  choice: 财产
  rationale: 概括所拥有的产业与财物，保留拉丁文的宽泛含义。
- source_word: personas suas
  choice: 自身
  rationale: 表达‘他们自己的人身’，避免生硬的‘他们自己的人’，并保留与外在财产相对的人身含义。
- source_word: Tanto
  choice: 越发如此
  rationale: 这是跨越经节边界的比较关联语；译文保留其未完待续的性质，不补入源文没有的动作。
theological_decisions:
- issue: 残句中的比较关系
  choice: 保留‘越发如此’这一开放式比较语
  alternative: 补译为‘他们越发装饰……’或补出下一节所承接的动作
  rationale: 现有拉丁文本只提供 Tanto，不能据上下文擅自补足谓语；应保留原文的句法张力与跨节承接。
translation_notes:
  register: 采用现代、庄重且简明的普通话。正文保留拉丁残句的列举结构和分号，并以脚注说明 Tanto 的开放式承接。
