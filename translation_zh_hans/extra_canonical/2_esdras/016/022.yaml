  yaml_path: translation/extra_canonical/2_esdras/016/022.yaml
  text: 'Behold[a], grain will soon be cheap upon the earth, so that they will think peace has been secured for them[b]. Then evils will spring up upon the earth: sword and famine.'
translation:
  language: zh_hans
  text: 看哪[a]，不久以后，地上的粮食将会便宜，以致他们以为自己已经得享稳固的太平[b]。随后，灾祸必在地上滋生：刀剑和饥荒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章的拉丁文本传统在第22—35节附近有一段重复材料。本译文采用较完整的次序译出一次，不把同样的审判内容重复两遍。
    reason: compositional_layer
  - marker: b
    text: “稳固的太平”也可译作“太平已经为他们确立”或“太平已经为他们得到保障”。
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留先知性宣告中的警示和引人注意的语气。
- source_word: annonae vilitas
  choice: 粮食将会便宜
  rationale: annona 指粮食供应或粮价，vilitas 指低廉；此处用现代汉语自然表达粮价低廉的表象。
- source_word: in brevi
  choice: 不久以后
  rationale: 明确保留原文的时间成分，表示事情很快发生。
- source_word: directam pacem
  choice: 安稳的太平
  rationale: directam 修饰 pacem，语义可涉及太平已获确立、安排妥当或保障；译文表达他们误以为局势已经安定，同时避免过度限定。
- source_word: superflorescent mala
  choice: 灾祸必在地上滋生
  rationale: 保留 florescere ‘生长、繁盛’的植物意象；用‘滋生’符合现代汉语且传达灾祸突然蔓延。
- source_word: gladius et famis
  choice: 刀剑和饥荒
  rationale: ‘刀剑’在此转喻战争与杀戮，‘饥荒’对应 famis；不加入本底文本没有的‘大混乱’。
theological_decisions:
- issue: 表面繁荣与真实审判之间的张力
  choice: 保留人们因粮价低廉而误判太平已经安稳，随后灾祸临到的反差
  alternative: 将前半句解释为上帝真实赐下和平
  rationale: 原文以 putent（‘他们以为’）标明这是人的判断，并未肯定太平实际已经实现。
- issue: 灾祸的范围
  choice: 只译‘刀剑和饥荒’
  alternative: 加入重复文本传统中的‘大混乱’
  rationale: 所给校订拉丁文本只有 gladius et famis，应按本节提供的源文翻译，不混入重复段落的扩充读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。‘看哪’保留启示文学的宣告语气；‘粮食将会便宜’直白易懂；‘滋生’保存原文灾祸如植物繁盛的意象。所有脚注标记均已置于正文相应位置。
