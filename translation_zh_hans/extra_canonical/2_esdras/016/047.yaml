- from: 他们劳苦；因为外族人要收割他们的果实，抢走他们的财物，拆毁他们的房屋，掳走他们的儿女；他们竟在被掳和饥荒中生儿育女。
  to: 他们劳苦，因为外族人要收割他们的果实，抢走他们的财物，拆毁他们的房屋，掳走他们的儿女，因为他们在被掳和饥荒中生养儿女。
  rationale: 'The revision preserves the supplied Latin’s repeated causal particles (enim and quia) without adding an unmarked adversative nuance. It retains the draft’s otherwise faithful and idiomatic lexical choices, including “外族人”、“拆毁”与“被掳.” No footnote is needed: domus euertent is adequately and unambiguously rendered here as demolition of houses.'
