review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the main sequence: foreign peoples reap the victims’ produce, seize their property, demolish their houses, and carry off their children. However, “竟” adds an adversative/emotive inference not expressed by quia, and the semicolon weakens the explicit causal connection introduced by quia. The closing clause should retain a plain “因为.”'
  naturalness: “他们劳苦” appropriately preserves the excerpt’s opening, which is syntactically dependent on prior context. “拆毁他们的房屋” and “掳走他们的儿女” are natural modern Mandarin. A direct causal closing is also clear and idiomatic.
  terminology: “外族人” suitably conveys alienigenae without importing modern nationality categories; “被掳” accurately represents captiuitas. “生养儿女” naturally conveys generant natos suos without unnecessarily limiting the subject to either fathers or mothers.
  issues:
  - severity: medium
    issue: The rendering “他们竟在被掳和饥荒中生儿育女” introduces “竟” and is separated from quia by a semicolon.
    rationale: Latin quia explicitly gives a reason; it does not itself mark surprise or contrast. “竟” adds interpretive emphasis, while the punctuation makes the causal relation less direct. Render the conjunction plainly as “因为.”
  revised_text: 他们劳苦，因为外族人要收割他们的果实，抢走他们的财物，拆毁他们的房屋，掳走他们的儿女，因为他们在被掳和饥荒中生养儿女。
