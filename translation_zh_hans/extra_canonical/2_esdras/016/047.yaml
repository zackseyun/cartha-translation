reference: 2 Esdras 16:47
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborant; Fructus enim illorum alienigenae metent et substantiam illorum rapient et domus euertent et filios eorum captiuabunt, quia in captiuitate et fame generant natos suos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/047.yaml
  text: for foreigners will reap their fruits and plunder their goods and overturn their houses and take their children captive[a], because in captivity and famine they beget their children.
translation:
  language: zh_hans
  text: 他们劳苦，因为外族人要收割他们的果实，抢走他们的财物，拆毁他们的房屋，掳走他们的儿女，因为他们在被掳和饥荒中生养儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborant
  choice: 他们劳苦
  rationale: 保留拉丁文独立出现的现在时动词及其承接上文的性质；“劳苦”比单纯“工作”更能表达语境中的辛劳。
- source_word: alienigenae
  choice: 外族人
  rationale: 表示本族之外的人，既自然，也不把含义收窄为现代国籍意义上的“外国人”。
- source_word: Fructus ... metent
  choice: 收割他们的果实
  rationale: 保留农业意象；“果实”可涵盖收成，并与 metent 的收割动作相配。
- source_word: substantiam ... rapient
  choice: 抢走他们的财物
  rationale: substantia 在此指财产、资财；rapient 带有强行夺取之意。
- source_word: domus euertent
  choice: 拆毁他们的房屋
  rationale: everto 以房屋为宾语时表示推倒、毁坏；“拆毁”既贴近动作意象，又符合现代汉语搭配。
- source_word: filios eorum captiuabunt
  choice: 掳走他们的儿女
  rationale: captivare 指使人成为俘虏；“掳走”简洁传达强制俘获。filii 在群体语境中可泛指子女。
- source_word: in captiuitate et fame
  choice: 在被掳和饥荒中
  rationale: 保留两个并列的苦难处境；captiuitas 在此可指被掳、囚 captive 状态。
- source_word: generant natos suos
  choice: 生儿育女
  rationale: 自然表达“生育自己的后代”，不额外规定父亲或母亲单一视角。
theological_decisions:
- issue: quia 所表达的因果关系
  choice: 译作“他们竟在……生儿育女”，以分号承接前述灾祸
  alternative: 直译为“因为他们在……生儿育女”
  rationale: 拉丁文 quia 明示因果，但此处逻辑关系在现代汉语中较突兀，可能承接更大语境。正文保留其解释性关联，同时用“竟”表现悲惨反差，不擅自补出未明说的神学因果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他们劳苦”保留原文 verse opening 中可能承接上文的残句感；其后用分号呈现一连串灾祸。未沿用英文脚注，因为其所列异文与正文重复，且拉丁文 domus euertent 在此无须以脚注制造并不存在的文本歧义。
