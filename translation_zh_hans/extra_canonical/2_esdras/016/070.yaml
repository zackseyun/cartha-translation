  yaml_path: translation/extra_canonical/2_esdras/016/070.yaml
  text: some of you[a], and they will feed you food sacrificed to idols. And those who consent to them will be for them an object of derision and reproach and trampling underfoot.
translation:
  language: zh_hans
  text: 他们要使你们中间的一些人吃献给偶像的食物[a]。那些附和他们的人，必成为他们讥笑、羞辱和践踏的对象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文直译近于“为偶像宰杀的（东西）”；这里指献给偶像的食物，可能特指祭肉。
    reason: 说明原文 idolis occisam 的不规则省略表达及其历史语境，同时避免在正文中过度限定为肉。
lexical_decisions:
- source_word: cibabunt
  choice: 给你们吃
  rationale: 该动词意为“喂养、给……吃”；结合上下文，以自然现代汉语表达其使役含义。
- source_word: idolis occisam
  choice: 献给偶像的食物
  rationale: 拉丁文措辞在语法形式上不规则，所指是为偶像宰杀、献祭之物，即祭偶像的食物，而非把人杀死献给偶像。
- source_word: consenserint eis
  choice: 顺从他们
  rationale: consentire 可表示同意、附和或顺从；此处涉及在逼迫者要求下接受其做法，“顺从”既自然又保留主动同意的意味。
- source_word: in derisum et in inproperium et in conculcationem
  choice: 嘲笑、辱骂和践踏的对象
  rationale: 保留原文三个并列名词及 erint illis 的“成为他们……的对象”结构，不把最后一项弱化为泛指羞辱。
theological_decisions:
- issue: 祭偶像之物的具体所指
  choice: 献给偶像的食物
  alternative: 祭过偶像的肉
  rationale: 上下文很可能涉及被迫食用祭偶像之物，但拉丁文未明说“肉”；采用较宽的“食物”，避免超出文本作限定。
- issue: consenserint 所表达的回应
  choice: 顺从他们
  alternative: 赞同他们
  rationale: “顺从”适合逼迫语境，同时不额外判定这种同意的内在动机或神学性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。开头“你们中间的一些人”保留原文承接上一节的残句性质；后半句保留“嘲笑、辱骂和践踏”三重并列，以体现原文力度。
