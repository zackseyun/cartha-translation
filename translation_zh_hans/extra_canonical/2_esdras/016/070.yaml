  - severity: low
    issue: “辱骂”对 improperium 稍嫌狭窄
    rationale: improperium 是“羞辱、凌辱、责难”一类的名词；“羞辱”可保留其较广泛的贬抑含义。
  - severity: low
    issue: “顺从”弱化 consentire 的同意、附和义
    rationale: consentire eis 首先是同意或附和他们；“附和”较贴合词义，且不对内在动机作额外判断。
