  source_fidelity: 首句现译“你们中间的一些人，并要给你们吃”在汉语句法上主客关系不清，且“给你们吃”把拉丁文 quosdam ex uobis（“你们中的一些人”）未能明确地作为 cibabunt 的受事呈现。应译出“使／让你们中间的一些人吃”。后句基本忠实保留 erint illis 及三项并列结果。
  naturalness: 修订后首句成为完整、自然的现代汉语；“讥笑、羞辱和践踏的对象”比“嘲笑、辱骂和践踏的对象”更准确地对应 derisum、improperium、conculcationem，也避免将 improperium限定为言语性的“辱骂”。
  terminology: “献给偶像的食物”恰当地表达 idolis occisam 所指的祭偶像之物，并没有把文本未明说的“肉”写入正文。“附和他们”比“顺从他们”更贴近 consentire eis 的“同意／赞同他们”，同时在本段逼迫语境中仍可理解为接受其要求。
