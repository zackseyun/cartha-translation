  text: A sword has been sent upon you, and who is there to turn it back?
translation:
  language: zh_hans
  text: 有刀剑临到你们，谁能使它退回呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: est uobis gladius
  choice: 有刀剑临到你们
  rationale: 拉丁文直译近于“对你们有刀剑”；结合下一句“使它退回”，自然表达为灾祸性的刀剑已经临到他们，同时不补入原文未明说的施动者。
- source_word: quis est qui auertat illum?
  choice: 谁能使它退回呢？
  rationale: auertat 表示使之转开、撤回；译作“使它退回”保留刀剑来势不可阻挡的反问语气。
- source_word: Inmissus est
  choice: 临到
  rationale: 该短语在所给文本末尾似为与“被放出／派出”有关的残留或衔接语。参照句义将其体现为“临到”，避免机械重复，也避免明确补出未出现的施动者。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代汉语；以“刀剑”保留经文中战争、杀戮或审判工具的意象，并保留反问所表达的不可逆转性。
