  text: He who hung the earth upon the water by his word[a], and stretched out the heaven like a vault;
translation:
  language: zh_hans
  text: 那位借着他的话把大地悬在水上[a]，又把天像穹顶一样展开的；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作：“他把海封闭在众水之中，又借着他的话把大地悬在水上。”现提供的拉丁摘录从“在水上，借着他的话”起，前文依完整文本传统补足。
    reason: 保留英语 POB 审校记录所载的替代读法，并说明所提供拉丁片段在句中起始，避免将补足部分误作该片段的明文。
lexical_decisions:
- source_word: super aquam uerbo suo
  choice: 以自己的话……悬在水上
  rationale: 保留介词短语的单数“水上”和工具意义“以自己的话”；“悬”依据本节完整句意及见证传统补明拉丁摘录中省略的谓语。
- source_word: Qui extendit caelum
  choice: 那位……又把天铺展……的
  rationale: 将关系代词 Qui 译为承接上下文的“那位……的”，保留连续颂赞句的从属结构；extendit 译作“铺展”，自然呈现展开天穹的意象。
- source_word: quasi cameram
  choice: 如穹顶
  rationale: camera 在此指拱形覆盖物或穹隆；“穹顶”比现代住宅意义的“房间”更符合宇宙图景，同时保留比喻。
theological_decisions:
- issue: 施行创造的方式
  choice: 以自己的话
  alternative: 借着他的话
  rationale: 两者均可表达 uerbo suo 的工具意义；选用“以自己的话”简洁自然，不额外界定“话”的位格或神学含义。
- issue: 关系从句的指向
  choice: 那位……的
  alternative: 他……
  rationale: 保留 Qui 的关系从句形式，使本节继续修饰上文所指的主，不将其改成独立陈述。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。“把天铺展如穹顶”保留古代宇宙诗歌的形象，不将其改写为现代科学术语；句末分号显示颂赞性关系从句仍向下延续。
