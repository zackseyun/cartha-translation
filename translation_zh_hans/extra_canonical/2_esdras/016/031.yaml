  text: or as in a harvested vineyard an exposed cluster remains from those who carefully search the vintage,[a]
translation:
  language: zh_hans
  text: 又如在采收过的葡萄园里，一串露在外面的葡萄，在那些仔细搜寻采收成果的人之后仍然留着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又如在采收过的葡萄园里，一串露在外面的葡萄，仍由那些仔细搜寻采收成果的人留下。”
    reason: 拉丁文 ab 可按“在……之后／从……而来”理解，也可理解为施事关系；正文避免将其具体化为“躲过”或有意留下。
lexical_decisions:
- source_word: vinea vindemiata
  choice: 已经采收的葡萄园
  rationale: 直接表达完成被动分词 vindemiata，说明葡萄园已经过采收。
- source_word: subremanet racemus
  choice: 仍留着一串……葡萄
  rationale: 保留 racemus 的单数，并以“仍留着”表达 subremanet 的残存含义。
- source_word: patens
  choice: 显眼的
  rationale: 表达“显露、可见”，保留这串葡萄虽显眼却未被搜到的张力。
- source_word: scrutantibus vindemiam diligenter
  choice: 那些仔细搜寻收成的人
  rationale: 区分 vindemiam（收成、采收所得）与 vineam（葡萄园），不误译为“搜寻葡萄园”。
- source_word: ab
  choice: 躲过了
  rationale: 在此以自然汉语表达残留之物未被搜寻者发现；不把语法关系过度解释为搜寻者有意留下。
