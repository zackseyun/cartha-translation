revisions:
- from: 又像在已经采收的葡萄园里，仍留着一串显眼的葡萄，躲过了那些仔细搜寻收成的人。[a]
  to: 又如在采收过的葡萄园里，一串露在外面的葡萄，在那些仔细搜寻采收成果的人之后仍然留着。[a]
  rationale: 修订删除“躲过了”这一原文未明说的推断，以“在……之后仍然留着”自然呈现残存与搜寻者之间的关系；将 patens 明确译为“露在外面的”，并保留 racemus 的单数和 vindemiam 不等于“葡萄园”的区分。
  reviewer_model: gpt-5.6-terra
