  text: to the ends of the earth. Behold, evils are sent out, and they will not return until
translation:
  language: zh_hans
  text: 到地极。看哪，灾祸正被差遣出去，必不返回，直到——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的本节原文在“直到”一词之后中断，句意未完。
    reason: 向读者说明正文末尾破折号并非修辞停顿，而是源文本在此残缺，且译文没有擅自补足。
lexical_decisions:
- source_word: in fines terrae
  choice: 直到地极
  rationale: 承接上一节或上一分句，直译其空间终点含义；“地极”自然、庄重，也保留经文语体。
- source_word: Ecce
  choice: 看哪
  rationale: 保留拉丁文用于引起郑重注意的提示词及其经文语气。
- source_word: mala
  choice: 灾祸
  rationale: 此处复数中性名词指临到世上的祸患或灾难；译作“灾祸”比泛泛的“恶事”更切合末世灾难语境，同时不把具体种类说死。
- source_word: mittuntur
  choice: 已被差出
  rationale: 保留现在时被动形式的动作图景；汉语用“已”表达灾祸已经奉命发出的状态，而“差出”保留其被派遣、放出的意味。
- source_word: non reuertentur
  choice: 必不返回
  rationale: 按拉丁文将来时翻译，并以“必”自然体现明确的将来断言。
- source_word: donec
  choice: 直到——
  rationale: 原始材料在连接词处中断；保留“直到”并用破折号显明句意尚未完结，不补入来源没有的内容。
theological_decisions:
- issue: 灾祸是否具有被神差遣的明确施事者
  choice: 采用无施事者的被动表达“已被差出”
  alternative: 译作“上帝差出灾祸”或“灾祸出动了”
  rationale: 拉丁文使用被动式，却未在本片段点明施事者；译文保留这种神学上的含蓄，不擅自补出上帝，也不抹去被动结构所暗示的差遣。
- issue: 残句 donec 的处理
  choice: 保留未完成的“直到——”并加注
  alternative: 依据后文补全句子
  rationale: 所给原文确实止于 donec。为避免把其他版本或后续经文内容未经说明地并入本节，正文忠实呈现其残缺状态。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“直到地极”作为承接上文的片段保留在句首；“看哪”维持警告性的宣告语气。用破折号和脚注明示拉丁材料在 donec 处中断。
