  yaml_path: translation/extra_canonical/2_esdras/016/078.yaml
  text: your sins[a], nor let your iniquities prevail over you. Woe to those who are bound fast by their sins and covered over by their iniquities, just as a field is hemmed in by a forest and its seed is covered by thorns, through which no man passes; it is shut off and given over to be devoured by fire.
translation:
  language: zh_hans
  text: 你们的罪[a]，也不要让你们的不义胜过你们。那些被自己的罪牢牢捆住、被自己的不义遮盖的人有祸了！正如一块被树林围困的田，田里的种子被荆棘覆盖，无人从中经过；这田被封闭起来，交给火吞噬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头承接上一节尚未完结的句子，因此从“你们的罪”开始。
    reason: 说明拉丁文本的分节边界与句法衔接，避免读者误以为译文缺少句首。
lexical_decisions:
- source_word: supereleuent
  choice: 胜过
  rationale: 表达不义占据上风、压倒人的含义，同时保留原文拟人化的力度。
- source_word: constringuntur
  choice: 牢牢捆住
  rationale: 体现被罪束缚、箍紧的被动状态，并以自然现代汉语传达其强度。
- source_word: obteguntur
  choice: 遮盖
  rationale: 与后文种子被荆棘覆盖的比喻相呼应，并忠实保留原文的被动意象。
- source_word: ager constringitur a silua
  choice: 一块被树林围住的田
  rationale: 按语境将 constringitur 译为田地受树林围困、限制，避免生硬直译为“被捆绑”。
- source_word: semina eius
  choice: 田里的种子
  rationale: 拉丁文 semina 是复数形式，可指播下的种子；译文明确其与田地的所属关系。
- source_word: per quem non transit homo
  choice: 无人从中经过
  rationale: 保留原文直陈语气，不改写成表示可能性的“无人能够经过”。
- source_word: mittitur ad deuorationem ignis
  choice: 交给火吞噬
  rationale: 简洁保留被交付以及火焚毁吞噬的双重意象。
theological_decisions:
- issue: 罪与不义对人的辖制
  choice: 保留“捆住”“遮盖”“胜过”等拟人化表达
  alternative: 解释为人因犯罪习惯而无法自拔
  rationale: 原文以强烈形象描述罪与不义的辖制，却没有系统说明其机制；译文不加入额外教义解释。
- issue: 田地比喻的指向
  choice: 维持比喻本身，不明确说明田地代表何人或何种群体
  alternative: 将田地直接解释为罪人或其生命
  rationale: 原文只作类比，解释空间应予保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“有祸了”保留先知性警告语气；比喻部分尽量保持树林、荆棘、封闭与火吞噬的连续画面。
