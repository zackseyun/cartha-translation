  text: righteousness will reign over us[a]. Let not the sinner say that he has not sinned,
translation:
  language: zh_hans
  text: 公义必统治我们[a]。罪人不可说自己没有犯过罪，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“公义必在我们中掌权。”
    reason: 拉丁文 in nos 可按较宽的空间／群体关系理解；正文则优先体现 regnare in 人称代词所表达的统治关系。
lexical_decisions:
- source_word: iusticia
  choice: 公义
  rationale: 既可表达正直、公正的品格与秩序，也符合经文庄重语域。
- source_word: regnabit in nos
  choice: 必在我们中间掌权
  rationale: regnabit 表示如君王般统治；in nos 直译可作“在我们之上”，此处用“在我们中间掌权”自然表达其对群体的统治，同时避免误解为公义在人体内部运行。
- source_word: Non dicat
  choice: 不可说
  rationale: 保留拉丁文否定命令的语气，简洁而庄重。
- source_word: peccator
  choice: 罪人
  rationale: 直接保留其道德与神学含义。
- source_word: non se peccasse
  choice: 自己没有犯过罪
  rationale: 准确表达间接陈述及完成不定式所指的既成犯罪行为。
theological_decisions:
- issue: 公义与“我们”的关系
  choice: 公义必在我们中间掌权
  alternative: 公义必统治我们
  rationale: 两者均能反映 regnabit in nos；所选译法保留公义作统治主体的意象，并用较自然的现代汉语表达群体范围，不额外界定其神学机制。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“必……掌权”保留宣告语气；末尾逗号依照所给拉丁文片段，表示句意仍接续下文。
