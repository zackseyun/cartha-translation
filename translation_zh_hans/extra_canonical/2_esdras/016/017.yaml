  text: Woe is me, woe is me! Who will deliver me in those days?
translation:
  language: zh_hans
  text: 它们被遣到地上。我有祸了！我有祸了！谁能救我？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: missa fuerint in terram
  choice: 它们被降到地上
  rationale: 保留拉丁文被动结构及“到地上”的空间意象；这几个词承接上文，所指须由上下文确定。
- source_word: Vae mihi, vae mihi!
  choice: 祸哉，我有祸了！
  rationale: 以庄重而自然的现代汉语表达重复的哀号；用两个相近而不机械重复的短句再现强调。
- source_word: quis me liberabit
  choice: 谁能救我？
  rationale: liberabit 表示从危难中解救；“救我”简洁自然，并保留反问中的绝望语气。
theological_decisions:
- issue: 是否补出“在那些日子”
  choice: 不补出
  alternative: 谁能在那些日子救我？
  rationale: 现存拉丁文本本节只有 quis me liberabit，没有“在那些日子”的对应词；因此不采用英语咨询文本中的增补。
- issue: missa fuerint 的主语所指
  choice: 用“它们”保持泛指
  alternative: 按上文明确译出具体事物
  rationale: 所给片段未包含其先行词，不应仅凭本节擅自确定所指。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。译文以所给拉丁文本为首要依据；句首残句明显承接前文，予以保留。
