  text: so also the evils will not delay to come forth upon the earth, and the age will groan, and pains will surround it.
translation:
  language: zh_hans
  text: 照样，灾祸必不迟延地在地上出现；这个时代必呻吟，痛苦必环绕它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sic
  choice: 照样
  rationale: 承接上文的比较关系，保留拉丁文简洁的连接方式。
- source_word: mala
  choice: 灾祸
  rationale: 此处为复数、中性实体化用法，指将临到大地的种种祸患；“灾祸”比抽象的“邪恶”更合语境。
- source_word: non morabuntur ... ad prodiendum
  choice: 必不迟延，临到
  rationale: 保留“不耽延”的核心意义，并将 prodiendum 按灾祸出现、降临于地上的语境自然表达。
- source_word: saeculum
  choice: 这世代
  rationale: saeculum 可指时代、世代或世界；选“这世代”以保留时间维度，同时不把它直接等同于物质世界。
- source_word: gemet
  choice: 必呻吟
  rationale: 直接传达痛苦中的哀鸣，语体庄重而清楚。
- source_word: dolores circumtenent illum
  choice: 痛苦必环绕它
  rationale: 贴近 circumtenent 的“围住、环绕”，并保留 illum 回指 saeculum 的拟人表达。
theological_decisions:
- issue: saeculum 的指涉范围
  choice: 这世代
  alternative: 世界／时代
  rationale: 原词具有“时代、世代、世界秩序”等语义空间；正文采用“这世代”，不将其神学含义过度限定为物质宇宙或末世时代。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；保留原文末世灾难意象及“世代呻吟”的拟人手法。
