    issue: “临到地上”略将灾祸的“出现”具体化为“降临”。
    rationale: prodiendum 的基本意象是出来、显现；super terram 表示其出现的范围或地点。译作“在地上出现”更为中性、贴近原文。
  - severity: low
    issue: “这世代”在现代汉语中可能主要理解为一代人。
    rationale: saeculum 保有时代、世代或世界秩序等开放语义；“这个时代”更自然地保留其时间性，且不排除其更广的拟人化指涉。
