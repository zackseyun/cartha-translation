  rationale: 调整“临到地上”为“在地上出现”，以贴近 ad prodiendum super terram 而不添加灾祸由上而降的方向；将“这世代”润饰为“这个时代”，使现代汉语更自然，并保留 saeculum 的语义开放性。其余措辞忠实保留原文的末世灾祸与拟人化描写。
