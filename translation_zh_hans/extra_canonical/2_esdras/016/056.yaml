  text: 'fiat caelum, et factum est: Et in uerbo illius stellae fundatae'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/056.yaml
  text: He who said, “Let heaven be made,” and it was made; and by his word the stars were founded.
translation:
  language: zh_hans
  text: 他说：“要有天”，天就有了；众星也因他的话而立定。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fiat caelum
  choice: 要有天
  rationale: 保留拉丁文命令式的创造宣告，并以现代中文中自然、庄重的表达呈现。
- source_word: factum est
  choice: 天就有了
  rationale: 明确承接前句的“天”，传达所命之事随即实现。
- source_word: in uerbo illius
  choice: 因他的话
  rationale: 拉丁语介词结构在此表示凭借或施行的媒介；译为“因他的话”简洁自然。
- source_word: stellae fundatae
  choice: 众星……立定
  rationale: fundatae 字面有奠基、建立之意；星辰并非建筑物，译作“立定”既保留稳定建立的意象，也符合中文诗性语体。
theological_decisions:
- issue: 说话者的身份
  choice: 仅以“他”指称，不补出“神”或其他称号
  alternative: 他说（即神说）／神说
  rationale: 本节所给拉丁文本只有 illius 所对应的第三人称指称；不在译文中添加原文未明说的身份，以免替上下文作过度解释。
- issue: 创造之言与众星建立的关系
  choice: 译作“众星也因他的话而立定”
  alternative: 众星在他的话里被奠定
  rationale: 保留神圣言语作为众星得以建立之媒介的含义，同时避免将拉丁语 in 机械处理为位置性的“在……里面”。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“要有天”呼应中文读者熟悉的创造宣告句式；“立定”保留 fundatae 的建立与稳固意象。
