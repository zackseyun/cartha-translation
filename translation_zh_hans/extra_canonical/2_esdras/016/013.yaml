id: 2ES.16.13
reference: 2 Esdras 16:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quoniam fortis dextera eius quae arcum tendit : sagittae eius acutae quae ab ipso mittuntur, non deficient cum coeperint mitti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/013.yaml
  text: For mighty is his right hand that bends the bow; his arrows that are shot by him are sharp[a], and they will not fail when they begin to be shot.
translation:
  language: zh_hans
  text: 因为他那拉弓的右手大有能力；他所射出的箭锋利无比，一旦发射，必不落空。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortis
  choice: 大有能力
  rationale: 修饰“右手”，表达强健有力；比直译为“强壮”更符合现代汉语的庄重语体。
- source_word: dextera eius quae arcum tendit
  choice: 他那拉弓的右手
  rationale: 保留“右手”和拉开弓弦的具体意象，语序则按自然汉语调整。
- source_word: sagittae eius acutae
  choice: 他所射出的箭锋利无比
  rationale: 准确保留箭“锐利”的意义；“无比”使谓语自然有力，但不额外改变命题内容。
- source_word: ab ipso mittuntur
  choice: 他所射出的
  rationale: 在弓箭语境中，mittere自然指“射出”，比泛称“发出”更具体。
- source_word: non deficient
  choice: 必不落空
  rationale: deficere本可泛指失败、失效或未能达到；在射箭意象中译为“不落空”，既自然又保留箭不会失效、不中目标的语境含义。
- source_word: cum coeperint mitti
  choice: 一旦发射
  rationale: 保留“开始被射出时”的时间关系，并以简洁、自然的汉语表达；主语仍是箭。
theological_decisions:
- issue: 右手与箭的施动者
  choice: 维持第三人称“他”，不在经文中明指其身份
  alternative: 译作“上帝的右手”或“主的右手”
  rationale: 拉丁文本只有eius和ipso，虽上下文可能明确所指，但本节本身未出现神名；不应在译文中擅自补明。
- issue: non deficient的结果含义
  choice: 译作“必不落空”
  alternative: “必不失败”或“必不失效”
  rationale: 此处完整语境是拉弓与射箭，“不落空”最能延续具体意象；同时不进一步规定究竟是“不偏离目标”还是“必然完成审判”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号保留原句两幅紧密相连的意象；避免古奥措辞，也不添加拉丁文没有的地点、目标或神学解释。
