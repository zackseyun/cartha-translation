  text: Those who marry[a], as though they will have no children; and those who do not marry, as widowers.
translation:
  language: zh_hans
  text: 结婚的人[a]，要像不会有儿女的人；不结婚的人，要像鳏夫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文承接第42节的省略句；也可译作：“结婚的人，要如同不会有儿女的人；不结婚的人，要如同鳏夫。”
    reason: 说明本节的命令语气承接上文，并保留原文简练、平行的句式。
lexical_decisions:
- source_word: nubunt
  choice: 结婚
  rationale: 直译其现在时复数含义，用现代汉语常用而庄重的表达。
- source_word: filios non facturi
  choice: 不会生儿育女
  rationale: 该短语字面为“将不会生育儿女”，这里用自然汉语表达未来不生育后代之意；不把重点窄化为仅指儿子。
- source_word: vidui
  choice: 丧妻的人
  rationale: 拉丁语为阳性复数，具体指鳏夫；“丧妻的人”比泛称“丧偶的人”更准确，也便于普通读者理解。
- source_word: quasi
  choice: 像
  rationale: 保留比较性的劝勉，不将其解释为身份事实。
theological_decisions:
- issue: 本节省略的命令语气
  choice: 两分句均补出“要”
  alternative: 按孤立句面译为“结婚的人，像……；不结婚的人，像……”
  rationale: 本节延续16:42起受 estote（“你们要……”）支配的一连串省略结构。汉语补出“要”才能清楚传达上下文中的劝诫语气，同时不增添教义解释。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体；保留两分句的平行结构和“像”的比较意味。
