  text: Fire has been sent upon you, and who is there to quench it?
translation:
  language: zh_hans
  text: 火已经降在你们身上了，谁能扑灭它呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ignis
  choice: 烈火
  rationale: 拉丁文意为“火”；译作“烈火”既符合审判语境，也保留其具体而强烈的意象，不添加不定性。
- source_word: uobis
  choice: 临到你们
  rationale: 与后文残存的“Inmissa sunt”所呈现的“被降下、被送来”语义相衔接，并自然表达火所针对的对象。
- source_word: extinguat
  choice: 扑灭
  rationale: 这是现代汉语中用于熄灭火势的自然表达，准确对应拉丁文的虚拟式动词。
theological_decisions:
- issue: 反问句所表达的不可抗拒性
  choice: 谁能将它扑灭？
  alternative: 有谁能将它扑灭呢？
  rationale: 用简洁反问保留原文的修辞力量，暗示无人能够扑灭，却不把这一含义改写为明说的教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“烈火临到你们”保留审判宣告的力度；后半句以紧凑反问再现原文结构。原始引文末尾的“Inmissa sunt”看似属于后续残句或文本接缝，因此未机械重复译入本节。
