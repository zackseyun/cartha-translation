  text: and the one who buys, like one who is about to lose; and the one who trades, like one who will gain no profit;
translation:
  language: zh_hans
  text: 买的人，要像将要失去的人；做买卖的人，要像不会获利的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emit
  choice: 买东西的
  rationale: emit 是 emo（买、购买）的第三人称单数形式；用“买东西的”既准确，也符合现代汉语表达。
- source_word: perditurus
  choice: 将要失去
  rationale: 这是表达即将发生之事的将来主动分词；原文没有明确失去什么，因此不擅自补出宾语。
- source_word: mercatur
  choice: 做买卖的
  rationale: mercatur 指经商、交易；“做买卖”比单纯的“购买”更能保留其商业交易含义。
- source_word: quasi qui
  choice: 像……的人
  rationale: 所提供的拉丁文本至此中断；以省略号显明句意未完，不依据英文咨询层擅自补译。
theological_decisions:
- issue: 第二分句在所提供的拉丁原文中残缺
  choice: 保留未完状态，译作“像……的人”并加脚注
  alternative: 依英文 POB 补作“像不会获利的人”
  rationale: “不会获利”在所提供的原语言证据中没有对应词；保留残缺可避免把咨询层的补足误当作现存拉丁文本。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；两个分句保持平行结构。第一分句不补明“失去”的对象，第二分句则以省略号忠实呈现所给拉丁文本的中断。
