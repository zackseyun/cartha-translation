  text: in illis diebus? Initium dolorum et multi gemitus, initium famis et multi interient, initium bellorum et formidabunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/018.yaml
  text: 'In those days: the beginning of pains and much groaning, the beginning of famine and many will perish, the beginning of wars and they will be afraid, the beginning of evils and all will tremble.'
translation:
  language: zh_hans
  text: 在那些日子里：痛苦的开端，许多哀号；饥荒的开端，许多人将要丧命；战争的开端，他们将会惧怕；灾祸的开端，众人都要战栗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文本在“他们将会惧怕”处结束，未列出“灾祸的开端，众人都要战栗”这一末句；该末句依据本节所附的英语 POB 审校轨迹保留。
    reason: 明确区分所列拉丁文证据与英语审校轨迹，同时保留给定经节审校形态中的末句。
lexical_decisions:
- source_word: dolorum
  choice: 痛苦
  rationale: 保留“疼痛／苦难”的宽泛含义，不把它特定解释为生产之痛或某一种末世灾难。
- source_word: multi gemitus
  choice: 哀号四起
  rationale: 自然表达大量、持续的呻吟哀叹；避免生硬直译为“许多呻吟”。
- source_word: famis
  choice: 饥荒
  rationale: 在灾难语境中，“饥荒”比一般的“饥饿”更准确。
- source_word: multi interient
  choice: 许多人将要丧命
  rationale: 准确表达许多人将灭亡或死亡，同时保持庄重、易懂。
- source_word: bellorum
  choice: 战争
  rationale: 保留拉丁文复数所表达的多处或接连发生的战争；汉语集合名词无需机械标示复数。
- source_word: formidabunt
  choice: 人们将会惧怕
  rationale: 拉丁文只有隐含的复数主语，不增添“掌权者”等原文未明说的身份。
theological_decisions:
- issue: “痛苦”是否特指末世生产之痛
  choice: 采用宽泛的“痛苦”
  alternative: 阵痛／生产之痛
  rationale: dolorum 本身不足以限定为生产阵痛，应保留其语义开放性。
- issue: formidabunt 的主语身份
  choice: 译作泛指的“人们”
  alternative: 掌权者／统治者
  rationale: 所给拉丁文没有名词主语，不能凭传统译法补入特定群体。
- issue: 末句的文本依据
  choice: 正文依审校层保留“灾祸开始，众人都要战栗”，并以脚注说明所给拉丁文本缺此句
  alternative: 在正文中完全删去末句
  rationale: 这样既维持给定经节的完整审校形态，又不掩盖所提供原文证据在“formidabunt”处结束这一事实。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，并以三个平行分句重现拉丁文反复使用 initium 的节奏。开头的问号视为版本中的标点疑问，不译成实际问句；“在那些日子里”作为时间状语处理。末句因不见于所给拉丁文本而加文本说明脚注。
