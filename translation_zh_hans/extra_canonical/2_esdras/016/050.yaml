  text: the more I will be zealous against them for their sins, says the Lord. How
translation:
  language: zh_hans
  text: 我就越发因他们的罪而愤然对付他们，主说。怎么
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magis
  choice: 越发
  rationale: 承接上文所表达的递进或程度增加；本节是跨节句段，保留其连接性质。
- source_word: adzelabor
  choice: 激愤地对付
  rationale: 该动词含热切、妒忌或愤激情绪；在介词 super 引出的敌对语境中，不宜弱化为单纯“发怒”，也不宜直译成现代汉语中含义偏正面的“热心”。此译兼顾强烈情绪与针对性的行动。
- source_word: eos super peccata
  choice: 因他们的罪……对付他们
  rationale: 将 super peccata 理解为采取敌对态度或行动的缘由，同时保留 eos 的受事对象。
- source_word: dicit dominus
  choice: 主说
  rationale: 采用简洁庄重、符合现代中文经文习惯的引语插入语。
- source_word: Quomodo
  choice: 怎么
  rationale: 原文在此开启下一句，不能因本节截断而省略；用“怎么”明确保留未完的疑问或说明结构。
theological_decisions:
- issue: adzelabor 所表达的神圣情感与行动
  choice: 激愤地对付
  alternative: 向他们大发热心／因他们的罪向他们发怒
  rationale: 拉丁词兼有“热切、嫉愤”色彩。译文不把它归约为普通怒气，也不采用在中文中容易产生正面关怀含义的“热心”，从而保留神因罪而强烈反对他们的张力。
- issue: 节末 Quomodo 的不完整句法
  choice: 保留“怎么”作为下一句开端
  alternative: 省略，或补全其后未见于本节的内容
  rationale: 忠实反映原文及篇章跨节结构，不擅自补足，也不把本节润饰成独立完整句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“激愤地对付”较直白地传达敌对语境，又保留 adzelabor 超出一般“发怒”的热烈情感。末尾“怎么”刻意保持跨节未完状态。
