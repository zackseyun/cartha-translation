  text: 难道有人能使强壮的弓箭手射出的箭折返吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: recutiet
  choice: 使……折返
  rationale: 该词在此表示使已经射出的箭返回、退回；译为“使……折返”既保留反问力度，也避免误解为仅仅挡开箭矢。
- source_word: sagittam inmissam
  choice: 射出的箭
  rationale: 简洁表达箭已经由弓箭手发射出去的状态，符合现代汉语习惯。
- source_word: a sagittario forte
  choice: 强壮的弓箭手
  rationale: forte在此按形容词fortis的夺格形式理解，修饰sagittario；“强壮”比“强大”更直接体现射手本身的力量。
