  source_fidelity: 现存拉丁文的“nouit numerum stellarum”准确对应“他知道众星的数目”。结合所说明的完整承接句“Verbo illius stellae factae sunt”，facienda/factae sunt 的基本意思是“成为／被造”，不宜弱化为单纯“立定”。修订为“众星借着他的话而成”较贴近原文，同时不超出英文审计层所确认的上帝话语与星辰存在之间的关系。
  naturalness: “众星因他的话而立定”可理解，但“因……而立定”的搭配略显生硬，且“立定”常带安置、稳固之意。“众星借着他的话而成”在庄重的现代汉语经文语体中更自然。
  terminology: 保留“众星”“他的话”“数目”等中性、清楚的措辞；“借着”表达拉丁文 verbo 的媒介关系，避免将其限定为特定教派的术语解释。
  issues:
