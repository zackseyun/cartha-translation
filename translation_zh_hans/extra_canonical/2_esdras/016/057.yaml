  text: By his word the stars were established, and he knows the number of the stars.
translation:
  language: zh_hans
  text: 众星借着他的话而成；他知道众星的数目。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sunt（结合句首缺失的上下文：Verbo illius stellae factae sunt）
  choice: 众星因他的话而立定
  rationale: 现存引文从 sunt 开始，显然承接前面的复合谓语。参照该拉丁传统的完整句式及经审核的英文层，译为“因他的话而立定”，既自然，也保留“藉话语使众星存在／确立”的含义。
- source_word: nouit numerum stellarum
  choice: 他知道众星的数目
  rationale: 直译拉丁文，清楚保留 nouit“知道”和 numerum“数目”的陈述。
theological_decisions:
- issue: 上帝的话与众星存在之间的关系
  choice: 译作“因他的话而立定”
  alternative: “由他的话造成”或“藉着他的话被创造”
  rationale: 拉丁传统的 factae sunt 可表达“形成、造成”，英文咨询层采用“were established”。“立定”保留创造性权能的语意，同时不把动词过度限定为某一神学术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以分号连接两项紧密相关的陈述，并用“众星”避免同一句中机械重复“星辰”。
