source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dominus: Ecce adpropinquant mala et non tardantur. Quemadmodum praegnans in nono mense filium suum, adpropinquante hora partus eius, ante horas duas uel tres gementes dolores circum uentrem eius, et prodiente infante de uentre non tardabit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/038.yaml
  text: Behold, evils are drawing near and are not delayed, just as a pregnant woman in the ninth month with her child, when the hour of her delivery draws near, for two or three hours great pains surround her womb, and when the child comes forth from the womb, it will not delay.
translation:
  language: zh_hans
  text: 主说：“看哪，灾祸正在临近，并不迟延。正如一个怀胎九个月的妇人，临产的时刻将近，分娩前两三个小时，她腹部四周的阵痛使她呻吟；婴儿从腹中出来时，便不再迟延。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句拉丁文单数动词“不会迟延”的语法主语并不完全明确；也可理解为“婴儿不会迟延出来”或“生产不会迟延”。
    reason: 保留 non tardabit 在所指上的真实含混，不在正文中指定为婴儿或生产。
lexical_decisions:
- source_word: mala
  choice: 灾祸
  rationale: 此处指正在逼近、带来痛苦的灾难性事件；译作“灾祸”比抽象的“恶”更符合语境，同时保留复数所表达的接连灾患。
- source_word: adpropinquant
  choice: 正在临近
  rationale: 保留拉丁文现在时所呈现的迫近过程和紧迫感。
- source_word: non tardantur / non tardabit
  choice: 绝不迟延 / 也不会迟延
  rationale: 前句保留复数被动形式的确定语气，末句保留单数表达及其主语上的含混，不擅自解释为某一特定事件。
- source_word: gementes dolores
  choice: 使她呻吟的阵痛
  rationale: 既表达疼痛引发呻吟，也以现代汉语自然的“阵痛”呈现临产疼痛。
- source_word: circum uentrem eius
  choice: 腹部四周
  rationale: 较贴近原文空间意象，不缩窄为现代医学意义上的子宫。
theological_decisions:
- issue: “灾祸”与分娩之痛的类比是否暗示特定末世时间表
  choice: 仅保留逼近且不可迟延的比喻
  alternative: 将其明确解释为某一特定末世事件或固定时限
  rationale: 原文强调灾祸临近的必然性和紧迫性，却没有在本节内规定具体教义框架或时间表。
- issue: 末句 non tardabit 的主语
  choice: 以“也不会迟延”保留含混，并加脚注说明
  alternative: 明确译为“婴儿不会迟延出来”或“生产不会迟延”
  rationale: 拉丁文单数动词的语法所指并不完全明确；不应在正文中无声消解这种含混。
translation_notes:
  register: '采用现代、庄重而易懂的普通话。“看哪”保留宣告式语气；“阵痛”使分娩意象自然清楚。将 dominus: 处理为“主说：”，按原文冒号呈现为引语引入语。'
