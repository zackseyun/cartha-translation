  text: Woe to those who sin and want to hide their sins!
translation:
  language: zh_hans
  text: 那些犯罪又想把自己的罪隐藏起来的人有祸了！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uae
  choice: 有祸了
  rationale: 准确表达拉丁文的灾祸宣告语气，同时比单独使用“祸哉”更符合现代汉语表达。
- source_word: peccantibus
  choice: 犯罪……的人
  rationale: 保留现在分词所指的行为者及其持续、概括性的含义。
- source_word: uolentibus
  choice: 想
  rationale: 自然表达其意愿，不额外强化为已经付诸行动或坚决图谋。
- source_word: occultare peccata sua
  choice: 把自己的罪隐藏起来
  rationale: 保留“隐藏”的动作及反身所有关系；“自己的罪”清楚对应 sua。
theological_decisions:
- issue: 灾祸宣告的对象
  choice: 那些犯罪又想把自己的罪隐藏起来的人
  alternative: 犯罪并隐藏自己罪行的人
  rationale: 原文分别陈述“犯罪”和“想要隐藏自己的罪”，并未说隐藏已经成功或已经实施，因此保留意愿层面的区别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有祸了”保留先知式警告力度；“又想”清楚连接两个并列特征，不引入原文没有的因果关系。
