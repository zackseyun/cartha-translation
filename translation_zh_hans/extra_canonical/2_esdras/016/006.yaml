  text: Can anyone beat back a hungry lion in the forest, or quench a fire when straw has been set ablaze?
translation:
  language: zh_hans
  text: 谁能在林中击退饥饿的狮子？又有谁能在干草已经燃起来时把火扑灭？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: recutiet
  choice: 击退
  rationale: 此处动词表达迎击并逼退之意；“击退”自然有力，也保留反问所强调的不可抵挡性。
- source_word: leonem esurientem
  choice: 饥饿的狮子
  rationale: 直接对应拉丁语，保留饥饿使狮子更加凶猛危险的意象。
- source_word: in silva
  choice: 在林中
  rationale: 简洁对应地点状语，采用庄重而自然的现代汉语。
- source_word: extinguet ignem
  choice: 把火扑灭
  rationale: “扑灭”是现代汉语中处理火势最自然的动词，比单纯“熄灭”更贴合主动灭火的语境。
- source_word: stramen
  choice: 干草
  rationale: 该词可指铺垫用的禾秆、稻草或干草；此处重点是易燃物，“干草”在现代汉语中形象清楚且不作过度限定。
- source_word: incensum fuerit
  choice: 已经点燃
  rationale: 保留完成状态及被点燃的含义，呈现火势一经燃起便难以扑灭的反问张力。
