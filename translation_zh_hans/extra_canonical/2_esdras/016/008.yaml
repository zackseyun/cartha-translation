  text: A strong archer has shot an arrow; who will turn it back? The Lord God sends evils, and who will drive them away?
translation:
  language: zh_hans
  text: 强大的弓箭手射出的一支箭，谁能把它召回呢？主上帝降下祸患[a]，谁能将它们驱散呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”：原文所用词也可指“恶事”或“灾难”；本节语境侧重上帝审判所带来的灾祸。
    reason: 说明拉丁语 mala 的语义范围，避免中文读者将其仅理解为道德上的邪恶，同时不掩盖原文措辞。
lexical_decisions:
- source_word: sagittam a sagittario forti missam
  choice: 强壮的弓箭手射出的箭
  rationale: 按拉丁语直译核心意象，同时调整为自然的现代汉语定语结构。
- source_word: revocabit（据完整经文语境补足）
  choice: 召回
  rationale: 保留箭一经射出便无法追回的修辞力度，比笼统的“阻挡”更贴近原词。
- source_word: Dominus deus
  choice: 主上帝
  rationale: 采用现代中文圣经语体中清楚、庄重且通行的称谓。
- source_word: mittit
  choice: 降下
  rationale: 在上帝施行审判的语境中，比一般的“发送”自然，也保留主动施行的意味。
- source_word: mala（据完整经文语境）
  choice: 祸患
  rationale: 这里指临到人的灾祸或灾难；“祸患”既符合上下文，也避免让“恶事”误传为上帝施行道德上的邪恶。
- source_word: avertet（据完整经文语境补足）
  choice: 使它们转离
  rationale: 贴近“使转开、避开”的基本义，并与前句“召回”形成平行问句。
theological_decisions:
- issue: 上帝“降下 mala”的含义
  choice: 译为“降下祸患”
  alternative: 译为“降下诸恶”或“降下灾难”
  rationale: “祸患”保留审判性灾祸的含义，又不把上帝描述为道德邪恶的施行者；脚注说明原词的语义范围，以保留原文张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两句都保留反问和平行结构；“召回”与“转离”体现原文不可逆转、无人能够拦阻的力度。用户所给清理后拉丁文本在问词及后半句处呈片段状态，因此依据该版本完整经文的通行读法及已审校英文层恢复句法，但译词仍以拉丁语证据为主。
