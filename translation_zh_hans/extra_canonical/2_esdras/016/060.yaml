  text: super aquas fundauit eum; Qui posuit in deserto fontes aquarum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/060.yaml
  text: He stretched out heaven like a vaulted chamber, and founded it upon the waters; who placed springs of waters in the desert.
translation:
  language: zh_hans
  text: 他把天立在众水之上，又在旷野安置水泉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fundauit
  choice: 立
  rationale: 表达“奠基、建立”之意，同时保留以众水为其所立之处的形象。
- source_word: super aquas
  choice: 在众水之上
  rationale: 按拉丁文直译其空间关系；复数 aquas 译为“众水”，保留经文体色彩。
- source_word: in deserto
  choice: 在旷野
  rationale: “旷野”自然、庄重，也符合圣经语境中 desertum 的常见含义。
- source_word: fontes aquarum
  choice: 水泉
  rationale: 简洁表达“水的泉源／泉水”，避免汉语中不自然的重复。
theological_decisions:
- issue: 代词 eum 的所指
  choice: 明确译作“天”
  alternative: 译作“它”
  rationale: eum 是阳性单数代词，须承接前文的阳性名词；英语校订层明确其所指为“天”。中文若仅译“它”，在独立呈现本节时指代不清，因此明示所指，但不增添其他解释。
- issue: Qui 引出的关系分句
  choice: 以“又”连接同一施事者的下一行动
  alternative: 译作“那在旷野安置水泉的”
  rationale: 拉丁文 Qui 延续描述同一位施事者；中文用“又”衔接更自然，同时不改变其身份或加入神学称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。译文紧扣所提供的拉丁文；英语咨询层中“如穹顶般铺展天空”的前半句在本次提供的拉丁文本内没有对应词句，因此未纳入正文。
