id: 2ES.16.68
reference: 2 Esdras 16:68
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelis eius? Ecce iudex deus, timete eum; desinite a peccatis uestris et obliuiscimini iniquitates uestras iam agere eas sempiterno, et deus educabit uos et liberabit de omni tribulatione.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/068.yaml
  text: Behold[a], God is judge; fear him. Cease from your sins, and forget your iniquities, never to practice them again; and God will lead you out and deliver you from every tribulation.
translation:
  language: zh_hans
  text: 看哪，上帝是审判者；你们要敬畏他。要停止犯罪，忘掉你们的恶行，永远不要再犯[a]；上帝必领你们出来，救你们脱离一切患难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永远不再行那些恶事。”
    reason: 拉丁文 iam agere eas sempiterno 的表达不寻常；正文以自然汉语表达永久不再作恶的含义，脚注保留其较贴近字面的“实行那些恶事”的表述。
lexical_decisions:
- source_word: iudex
  choice: 审判者
  rationale: 保留拉丁文表语名词的身份宣告，比译作单纯动作“审判”更贴近原文。
- source_word: timete
  choice: 要敬畏
  rationale: 既表达对审判者的畏惧，也保留宗教语境中尊崇、敬惧的含义。
- source_word: desinite a peccatis uestris
  choice: 要停止犯罪
  rationale: 用自然现代汉语表达停止继续陷于自身罪行的命令。
- source_word: obliuiscimini iniquitates uestras
  choice: 忘掉你们的恶行
  rationale: 保留“忘掉”的修辞力度；“恶行”自然对应复数 iniquitates，并与下文不再实行相连。
- source_word: educabit uos
  choice: 必领你们出来
  rationale: 保留 educere 所含“领出、带出”的方向意义，而不笼统弱化为“引导”。
- source_word: tribulatione
  choice: 患难
  rationale: 符合庄重而通俗的圣经汉语，并涵盖压迫、困苦与灾难。
theological_decisions:
- issue: 悔改命令与上帝拯救之间的关系
  choice: 按原文顺序并列呈现：停止犯罪、不再作恶；上帝必领出并拯救
  alternative: 加入“若……就……”等明确条件结构
  rationale: 拉丁文以命令句后接 et deus educabit 构成劝诫与应许，但没有明说条件连词；译文不额外规定其神学逻辑。
- issue: “敬畏”所表达的态度
  choice: 敬畏他
  alternative: 害怕他
  rationale: “敬畏”能够同时容纳惧怕审判与尊崇上帝的张力，不将词义缩减为单纯恐惧。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。短句和分号保留原文劝诫与应许的节奏；避免古奥用语，也不补入原文未明说的条件关系。
