  text: 'Behold, the word of the Lord: receive it; do not disbelieve what the Lord says.'
translation:
  language: zh_hans
  text: 看哪，主的话：你们要领受它；不要不信主所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留引人注意的宣告语气，符合庄重而易懂的现代经文表达。
- source_word: verbum Domini
  choice: 主的话
  rationale: 直接对应拉丁文，保留其可能指当前宣告或主之信息的宽度。
- source_word: excipite eum
  choice: 你们要领受
  rationale: excipere 在此语境中表示接受、领受；代词 eum 按语义回指 verbum。中文省去宾语代词更自然。
- source_word: ne discredatis
  choice: 不要不信
  rationale: 保留原文否定“不信”的措辞及劝戒力度，不改写为解释性的“不要怀疑”。
- source_word: de quibus dicit Dominus
  choice: 主所说的
  rationale: 原句形式略显异常，依上下文表达为“主所说的”，既自然，也不额外限定所说内容。
theological_decisions:
- issue: “主的话”的所指范围
  choice: 保留为“主的话”
  alternative: 译作“主的道”或具体化为“主的预言”
  rationale: 拉丁文 verbum 可指话语、信息；原文没有明确要求术语化或限定为预言，因此不作神学性窄化。
translation_notes:
  register: 采用现代、庄重且口语可懂的经文体。“看哪”呈现宣告感；两个祈使句保持原文直接的劝告语气。
