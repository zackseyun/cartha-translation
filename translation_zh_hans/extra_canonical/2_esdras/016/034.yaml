source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugebunt virgines non habentes sponsos, lugebunt mulieres non habentes viros, lugebunt filiae earum non habentes adiutorium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/034.yaml
  text: Virgins will mourn, having no bridegrooms; women will mourn, having no husbands; their daughters will mourn, having no help.
translation:
  language: zh_hans
  text: 童女必哀哭，因为没有新郎；妇人必哀哭，因为没有丈夫；她们的女儿必哀哭，因为无人扶助。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: virgines
  choice: 童女
  rationale: 直译拉丁文复数名词，指未婚女子；用语庄重，并与后面的“没有新郎”相应。
- source_word: sponsos
  choice: 新郎
  rationale: 保留 sponsus 在婚配语境中的直接含义，也保留经文所呈现的关系缺失。
- source_word: mulieres
  choice: 妇人
  rationale: 采用自然而庄重的概括称谓，并与前句“童女”区分。
- source_word: viros
  choice: 丈夫
  rationale: 在 non habentes viros 的上下文中指妇人的配偶，而非泛指男人。
- source_word: adiutorium
  choice: 扶助
  rationale: 拉丁文意为帮助、援助；“无人扶助”自然表达缺少援助者或援助的处境，而不额外限定其具体来源。
theological_decisions:
- issue: adiutorium 是指“帮助”还是“帮助者”
  choice: 无人扶助
  alternative: 得不到帮助／没有帮助者
  rationale: 原文使用抽象名词 adiutorium，可能着重帮助本身，也可能在语境中暗示提供保护和供养的人；译作“无人扶助”保留这种张力，不具体断定所缺的是哪一类人。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语；三句保持平行结构和反复的哀歌节奏。
