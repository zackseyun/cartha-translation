  text: Behold, famine and plague and tribulation have been sent as scourges for correction.
translation:
  language: zh_hans
  text: 灾祸临到时，他们会怎么办呢？看哪，饥荒、瘟疫和患难[a]……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文本止于“患难”，句子在此尚未完结。
    reason: 向读者说明省略号反映的是所据原文片段的不完整，而非自由删节。
lexical_decisions:
- source_word: mala
  choice: 灾祸
  rationale: 此处为复数中性名词，指临到人的种种祸患；“灾祸”比笼统的“恶事”更符合语境。
- source_word: fames
  choice: 饥荒
  rationale: 在灾难清单中指普遍缺粮，而非个人一时的饥饿。
- source_word: plaga
  choice: 瘟疫
  rationale: 在“饥荒”并列的灾难语境中，plaga可指灾疫；采用现代读者易懂的“瘟疫”。
- source_word: tribulatio
  choice: 患难
  rationale: 保留其宽泛含义，不擅自增译为另一项“困苦”或特定形式的迫害。
theological_decisions:
- issue: 是否译入“被差来作为管教人的鞭子”
  choice: 不译入
  alternative: 看哪，饥荒、瘟疫和患难已经被差来，作为管教人的鞭子。
  rationale: 这层内容虽见于英文咨询文本，却不在所提供的拉丁原文片段中；遵循原文证据优先的原则，不以英文层补足。
- issue: 灾祸清单后句意未完
  choice: 以省略号保留残缺状态
  alternative: 依英文咨询文本补成完整陈述
  rationale: 所给拉丁文止于tribulatio，语法和语意显然尚待下文；不应无原文依据地补全。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留Ecce的宣告和警示语气；首句调整为符合汉语习惯的条件句次序，同时保留反问。
