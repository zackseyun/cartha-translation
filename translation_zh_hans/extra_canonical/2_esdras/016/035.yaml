  text: Not having help, their bridegrooms will be consumed in war, and their husbands will perish by famine.
translation:
  language: zh_hans
  text: 她们的新郎得不到帮助[a]，必在战争中丧命；她们的丈夫必因饥荒而灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文直译为“没有帮助”。其中“她们的”在语义上可理解为帮助属于她们，或帮助来自她们；原文未明确说明。
    reason: 准确说明 earum 的属格含义及其语义归属的不确定性，同时不把修饰新郎的阳性复数分词误说成句法不明。
lexical_decisions:
- source_word: earum non habentes adiutorium
  choice: 她们的新郎将孤立无援
  rationale: 拉丁文直译近于“没有帮助”，其中阳性复数分词 habentes 可与后句阳性复数的 sponsi（新郎）相呼应。中文将这一状态自然地归于“新郎”，同时用脚注保留 earum 的归属及句法歧义。
- source_word: sponsi earum
  choice: 她们的新郎
  rationale: sponsi 指已订婚或将成婚的男子，与后面的 uiri（丈夫）形成用词区别，故译作“新郎”。
- source_word: in bello consumentur
  choice: 在战争中丧命
  rationale: consumentur 字面有“被耗尽、被毁灭”之意；用于战争中的人，译作“丧命”自然而庄重。
- source_word: uiri earum
  choice: 她们的丈夫
  rationale: uiri 在此与 sponsi 并列，按婚姻关系译作“丈夫”。
- source_word: in fame exterentur
  choice: 将因饥荒而消亡
  rationale: fames 指饥荒或饥饿；exterentur 表示被磨灭、耗尽直至灭亡，“因饥荒而消亡”保留其强烈程度。
