  text: Do not fear or hesitate, for God is your guide.
translation:
  language: zh_hans
  text: 不要害怕，也不要犹豫，因为上帝是你们的引路者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: timeatis
  choice: 害怕
  rationale: 准确表达 timeo 的基本含义，且符合现代汉语自然表达。
- source_word: haesitemini
  choice: 犹豫
  rationale: haesito 在此表示踌躇、迟疑；译作“犹豫”比“怀疑”更贴近原文。
- source_word: dux
  choice: 引路者
  rationale: dux 可指领袖、统帅或向导；结合“你们”在困境中受上帝带领的语境，“引路者”既保留带领之意，也避免无依据地强化军事色彩。
theological_decisions:
- issue: Deus dux vester est 中 dux 的神学意象
  choice: 上帝是你们的引路者
  alternative: 上帝是你们的领袖／向导
  rationale: 原文强调上帝亲自带领，因此采用自然且涵盖导引意义的“引路者”，不额外引入宗派性解释。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语；两个并列禁令保留原文节奏，并明确复数第二人称为“你们”。
