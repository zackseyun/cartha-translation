  text: Evils have been sent upon you, and who is there to drive them away?
translation:
  language: zh_hans
  text: 灾祸临到你们，谁能将它们挡回去呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: 灾祸
  rationale: 该中性复数名词在此指临到众人的祸患或灾难；“灾祸”比泛指道德邪恶的“恶事”更符合语境。
- source_word: repellat
  choice: 挡回去
  rationale: 保留 repellere 所含抵挡、击退并使之退去的动态含义，同时采用普通现代汉语的自然表达。
- source_word: uobis
  choice: 临到你们
  rationale: 拉丁文仅有与格“给你们／对你们”，汉语需结合灾祸来临的语义补出自然谓语；不照搬英语层的“被差来”，以免加入现存拉丁文本未明说的被动差遣概念。
theological_decisions:
- issue: 灾祸能否被人消除这一反问的力度
  choice: 谁能将它们挡回去呢？
  alternative: 谁在那里把它们挡回去？
  rationale: quis est qui repellat 是反问，重点在无人有能力阻挡灾祸；译作“谁能”自然传达这种修辞作用，但不进一步指明灾祸的施行者或神学原因。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“临到”保留经文语体感，但仍为普通读者熟悉；句式简洁，维持原文反问的警告语气。
