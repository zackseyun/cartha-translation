  yaml_path: translation/extra_canonical/2_esdras/016/016.yaml
  text: As an arrow shot by a strong archer does not return, so the evils that have been sent upon the earth will not return.
translation:
  language: zh_hans
  text: 正如有力的弓箭手所射出的箭不会返回，降在地上的灾祸也不会返回。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagitta missa
  choice: 射出的箭
  rationale: 直接表达已离弦射出的箭，保留拉丁文“被射出”的被动含义，同时符合现代汉语习惯。
- source_word: sagittario ualido
  choice: 强壮的弓箭手
  rationale: ualido 表示强健、有力；译为“强壮”既贴近字面，也突出箭势不可逆转的比喻。
- source_word: non redit / non reuertentur
  choice: 不会返回 / 不会返回
  rationale: 在比喻和本体两处使用同一措辞，保留原文刻意的对应关系及“不会折返、不会被撤回”的语义张力。
- source_word: mala
  choice: 灾祸
  rationale: 此处复数 mala 指临到世上的祸患或灾难；“灾祸”比泛泛的“恶事”更契合上下文。
- source_word: quae [missa sunt super terram]
  choice: 降在地上的
  rationale: 所给拉丁文在 quae 处截断；依据英语审校层所保存的句意补足关系从句，用“降在地上”自然表达灾祸被差遣、临到大地。
theological_decisions:
- issue: 灾祸“不会返回”的含义
  choice: 保留“不会返回”这一原文意象
  alternative: 译作“不会撤回”或“必不落空”
  rationale: 原文以箭不返回类比灾祸不返回，可能兼有不可撤回、必然临到之意；直译可避免替读者单一定义其神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文平行比喻和“返回”的重复，不将其解释性改写为“无法避免”或“必定应验”。
