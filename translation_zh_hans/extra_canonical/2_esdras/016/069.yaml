  text: For behold[a], a burning wrath is kindled against you, a great multitude[b], and they will seize some of you and feed them with meat sacrificed to idols.
translation:
  language: zh_hans
  text: 看哪，一大群人的怒火正向你们燃起[a]；他们要抓走你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁语此处的词形搭配不规则。也可断句理解为：“怒火正向你们燃起；一大群人要抓走你们。”
    reason: textual_and_syntactic_ambiguity
  - marker: b
    text: 本题所提供的拉丁原文到“他们要抓走”便结束，句意似乎尚未完结。英文咨询文本另有“给他们吃祭过偶像的肉”，但这部分没有出现在所提供的拉丁文本中，因此未收入正文。
    reason: source_truncation
lexical_decisions:
- source_word: Ecce enim
  choice: 看哪
  rationale: 保留提示读者注意并加强下文警告的语气；中文不必机械译出 enim，因其承接、解释作用可由语境表达。
- source_word: incenditur ardor super uos
  choice: 怒火正向你们燃起
  rationale: 以自然中文保留“燃起”的火焰意象，并把 super vos 在敌对语境中的方向译为“向你们”。
- source_word: turba copiosae
  choice: 一大群人的
  rationale: 现有拉丁文本的词形搭配不规则；依最可能的 turbae copiosae（属格）理解为“广大人群的”，修饰 ardor，但不掩盖文本疑难。
- source_word: rapient
  choice: 他们要抓走你们
  rationale: rapient 表示强行夺取、抓走；主语自然承接前面的“大群人”，宾语“你们”由上下文补明。
theological_decisions:
- issue: 是否纳入英文咨询层所载“给他们吃祭过偶像的肉”
  choice: 正文不纳入
  alternative: 译作“并给他们吃祭过偶像的肉”
  rationale: 用户提供的本节拉丁原文止于 et rapient，并无相应词语。依从原文证据优先原则，不把咨询层中未见于所给原文的内容补进正文；以脚注说明材料截断。
- issue: turba copiosae 与 ardor 的句法关系
  choice: 译作“一大群人的怒火”
  alternative: 把二者并列处理为“怒火向你们燃起；一大群人……”
  rationale: 若按最可能的词形校正 turbae copiosae，则是修饰 ardor 的属格短语；但传本文字本身不规则，因此脚注保留另一种断句可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“怒火燃起”保留原文 ardor/incenditur 的意象；“抓走”传达 rapient 的暴力强制意味。正文避免依据英文咨询层补足所给拉丁文本中缺失的后半句。
