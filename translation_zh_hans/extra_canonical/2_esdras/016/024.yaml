  text: et mortui quasi stercora proicientur, et non habent qui consolentur eos. et derelinquetur deserta terra, et civitates eius demolientur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/024.yaml
  text: And the dead will be cast out like dung[a], and they will have no one to comfort them, and the earth will be left desolate, and its cities will be demolished.
translation:
  language: zh_hans
  text: 死者将像粪便一样被丢弃；他们没有人安慰他们[a]。大地将被撇下，成为荒地；它的城邑将被拆毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文直译为“他们没有安慰他们的人”；“没有”是现在时，夹在本节前后主要的未来时动词之间。
    reason: 保留原文由现在时夹在未来时之间所产生的时态张力。
lexical_decisions:
- source_word: stercora
  choice: 粪便
  rationale: 保留原文刻意强烈、贬抑的意象；用现代读者容易理解且不过度文饰的词表达。
- source_word: proicientur
  choice: 将……被抛弃
  rationale: 表达未来被动意义；在死者与粪便的比喻语境中，“抛弃”比单纯“扔出”更自然，同时保留弃置之意。
- source_word: consolentur
  choice: 安慰
  rationale: 直接对应“安慰、慰藉”，不因安慰对象是死者而改写原文的异常张力。
- source_word: derelinquetur deserta
  choice: 将被撇下，一片荒凉
  rationale: 兼顾被动的“撇下”与表语性质的“荒凉”，避免只译结果而遗漏 derelinquetur。
- source_word: civitates eius
  choice: 地上的城邑
  rationale: 自然表达 terra 与其所属城邑的关系；“城邑”兼容城市及设防聚落，不把范围缩窄为现代大城市。
- source_word: demolientur
  choice: 将被拆毁
  rationale: 准确表达未来被动及摧毁建筑、城邑的含义。
theological_decisions:
- issue: 无人安慰死者这一不寻常表述
  choice: 保留“无人安慰他们”
  alternative: 改写为“无人为他们哀悼”或“无人埋葬他们”
  rationale: 拉丁文明确使用 consolentur eos；虽语义不寻常，也不应以较符合预期的丧葬概念替代。
- issue: non habent 的时态
  choice: 正文依上下文译作“也将无人安慰他们”，并以脚注说明形式上的现在时
  alternative: 直译为“他们无人安慰”
  rationale: 前后主要动词均为未来时，中文正文采用未来语境较连贯；脚注保留拉丁文时态转换造成的张力。
translation_notes:
  register: 采用现代、庄重而清楚的书面语；保留“粪便”的刺目意象和“安慰死者”的语义张力，不作神学性弱化或解释性改写。
