id: 2ES.16.72
reference: 2 Esdras 16:72
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: super timentes dominum. Erint quasi insani neminem parcentes ad diripiendum et deuastandum adhuc timentes dominum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/072.yaml
  text: They will be like madmen[a], sparing no one, plundering and ravaging those who still fear the Lord.
translation:
  language: zh_hans
  text: 他们必像疯子一样[a]，谁也不放过，抢掠并毁坏那些仍然敬畏主的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必像疯子一样，谁也不放过，仍在抢掠并毁坏那些敬畏主的人。”
    reason: 保留 adhuc 也可能被理解为修饰抢掠、毁坏动作的旧有译法，尽管其紧邻 timentes，正文所采用的理解更符合拉丁语词序。
lexical_decisions:
- source_word: quasi insani
  choice: 像疯子一样
  rationale: 直译比较结构，保留其强烈而形象的描述；现代汉语自然易懂。
- source_word: neminem parcentes
  choice: 谁也不放过
  rationale: 准确表达“对任何人都不留情”的意思，同时采用简洁自然的现代汉语。
- source_word: diripiendum et deuastandum
  choice: 抢掠并毁坏
  rationale: 分别保留 diripere 的掠夺含义和 devastare 的破坏、蹂躏含义，避免合并为单一动作。
- source_word: adhuc timentes dominum
  choice: 那些仍然敬畏主的人
  rationale: adhuc 紧接 timentes，最自然地修饰“敬畏”，强调这些人至今仍敬畏主；“敬畏主”也符合该宗教语境中的固定含义。
theological_decisions:
- issue: timentes dominum 中 timere 的宗教含义
  choice: 敬畏主
  alternative: 害怕主
  rationale: 此处指人对主的虔敬与畏服；“敬畏”既保留“畏”的成分，又不把它缩减为单纯恐惧。
- issue: adhuc 的修饰范围
  choice: 修饰“敬畏主的人”
  alternative: 修饰“抢掠并毁坏”
  rationale: 拉丁语词序为 deuastandum adhuc timentes dominum，adhuc 紧邻分词 timentes，语法上更自然地构成“仍然敬畏主的人”；但旧译所体现的另一种理解在脚注中保留。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“像疯子一样”保留原文的强烈比喻；“谁也不放过”使句子自然有力。正文中的脚注标记 [a] 与脚注对应。
