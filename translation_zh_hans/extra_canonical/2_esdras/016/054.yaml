  text: 'quoniam carbones ignis conburet super caput eius qui dicit: non peccaui coram deo et gloria ipsius. Ecce dominus cognoscit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/054.yaml
  text: For coals of fire will burn upon the head of the one who says[a], “I have not sinned before God and his glory.” Behold, the Lord knows.
translation:
  language: zh_hans
  text: 因为他必在那说：“我在上帝和他的荣耀面前并没有犯罪”之人的头上焚烧火炭。看哪，主知道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: 因为
  rationale: 保留原文与上文相接的因果关系；本节虽为片段，仍不擅自补出所指内容。
- source_word: carbones ignis
  choice: 炭火
  rationale: 对应“火炭”，采用现代汉语较自然的合成表达，并保留惩罚意象。
- source_word: conburet
  choice: 他要……烧在
  rationale: 按拉丁文第三人称单数将来主动式处理，以未明说的单数主语“他”对应；不把复数宾语“炭火”误作主语。
- source_word: super caput eius
  choice: 在那人的头上
  rationale: 直译空间关系，同时用“那人”自然承接后面的关系从句。
- source_word: coram deo et gloria ipsius
  choice: 在上帝和他的荣耀面前
  rationale: 保留“上帝”与“他的荣耀”由et并列的异常而可能有意的结构，不改写为较顺但解释性的表达。
- source_word: Ecce
  choice: 看哪
  rationale: 保留提示、强调语气，符合庄重经文语体。
- source_word: dominus cognoscit
  choice: 主知道
  rationale: 简洁对应原文；原文未明说所知道的宾语，译文也不补足。
theological_decisions:
- issue: conburet的隐含主语
  choice: 译作“他要……烧在”，保留代词而不明确点名
  alternative: 译作“主／上帝要把炭火烧在”
  rationale: 动词是第三人称单数主动式，需有隐含主语，但本节现存拉丁文本没有明说其身份；不应借末句“主知道”强行补明。
- issue: “上帝和他的荣耀”之间的关系
  choice: 保留并列结构
  alternative: 译作“在荣耀的上帝面前”或“在上帝荣耀的面前”
  rationale: 这些替代译法会消解原文et所保留的语法与神学张力。
- issue: 末句所知内容
  choice: 只译“主知道”
  alternative: 补作“主知道一切／主知道他是否犯罪”
  rationale: 原文宾语省略，译文保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句首“因为”保留片段与上下文的连接；分号使惩罚陈述与说话者身份清楚衔接。未沿用英文咨询层把“炭火”误作复数主语的语法分析。
