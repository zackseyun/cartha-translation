review_pass:
  verdict: revise
  source_fidelity: 拉丁文 conburet 是第三人称单数将来主动式，carbones ignis 为其宾语；现译“他要把炭火烧在”虽试图保留这一句法，汉语搭配却容易误解为把炭火本身点燃，且“烧在”不自然。改为“他必在……头上焚烧火炭”保留隐含单数施事者、将来意义、火炭作宾语及地点短语。末句不补出“主”所知道的内容。
  naturalness: “在那人的头上；那人说”虽可理解，但指代与分号连接显得生硬。使用“在那说……之人的头上”可使关系修饰清楚，并保持庄重、现代的经文语体。
  terminology: “火炭”是经文语体中对 carbones ignis 更稳妥而常见的表达；“上帝”“主”“荣耀”“犯罪”均恰当。“上帝和他的荣耀面前”保留拉丁文并列结构，不擅自释义。
