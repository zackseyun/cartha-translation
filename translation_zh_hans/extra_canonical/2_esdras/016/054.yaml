  rationale: 仅调整“焚烧火炭”的句法和关系从句的汉语表达，以准确反映拉丁文单数将来主动动词及其宾语，并提升可读性；保留原文隐含主语、并列的“上帝和他的荣耀”及末句未说明的宾语。英文审校轨迹中的替代译法脚注属于英文既往译法说明，在此中文定稿中无须设置对应脚注。
