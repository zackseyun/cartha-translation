lexical_decisions:
- source_word: quemadmodum
  choice: 就像
  rationale: 自然引出明喻，并保留本节与后文相连的句法功能。
- source_word: relinquentur
  choice: 将只剩下
  rationale: 保留将来时和被动结果所表达的“被留下／剩下”；“只”自然凸显三四颗所体现的极度稀少。
- source_word: in oliveto
  choice: 橄榄园里
  rationale: olivetum 指种植橄榄树的园地；按园子整体理解，不增添“每棵树上”。
- source_word: tres vel quattuor olivae
  choice: 三四颗橄榄
  rationale: 现代汉语通常用“三四”自然表达拉丁文 tres vel quattuor（三个或四个）；“颗”适合计数橄榄果。
theological_decisions:
- issue: 灾难图景中余剩数量的范围
  choice: 把三四颗理解为整个橄榄园中所剩的果实
  alternative: 每棵树上剩下三四颗
  rationale: 拉丁文只有 in oliveto（在橄榄园里），没有“每棵树上”；不应添加信息而减弱极度匮乏的图景。
