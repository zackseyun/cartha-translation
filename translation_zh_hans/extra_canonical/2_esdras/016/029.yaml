  text: relinquentur enim decem de civitate et duo exagro, qui absconderint se in silva et in fissuras petrarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/029.yaml
  text: For ten will be left from a city[a], and two from the countryside, who have hidden themselves in the forest and in clefts of the rocks.
translation:
  language: zh_hans
  text: 因为将从一座城中留下十个人，从乡间留下两个人；他们藏身在森林和岩石的裂缝中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: relinquentur
  choice: 只剩下
  rationale: 拉丁文为将来时被动式，表示灾难过后有人被留下；现代汉语用“只剩下”自然传达人数极少及将来的结果。
- source_word: de civitate
  choice: 一座城里
  rationale: de 在此表示从某一群体或范围中余留下来；按汉语习惯译为“一座城里”，而不生硬直译为“从一座城”。
- source_word: ex agro
  choice: 乡间
  rationale: ager 在此与 civitas 对举，指城外的田野、乡野地区；“乡间”简洁自然。
- source_word: in silva
  choice: 在森林
  rationale: silva 通常意为树林或森林；采用庄重且不增添“茂密”等原文没有的限定的“森林”。
- source_word: in fissuras petrarum
  choice: 岩石的裂缝中
  rationale: fissura 指裂缝、裂隙，petra 指岩石；此译保留具体藏身地点。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“因为”保留 enim 与上下文的因果衔接；分号呈现城与乡之间的并列，并避免关系从句在汉语中产生指代含混。
