  source_fidelity: 译文准确传达 relinquentur 的将来结果、十人与二人的存留数目，以及他们在森林和岩石裂缝中藏身。惟“城里只剩下十个人，乡间只剩下两个人”把原文的 de civitate / ex agro（从一城、从乡野地区而出的幸存者）较强地改写成两个地点各自的存留数量；可更贴近地保留“从……中”的范围关系。
  naturalness: 原译自然通顺，但“城里只剩下……，乡间只剩下……”虽流畅，略会使“他们”的所指和人数分配显得更绝对。改为“从一座城中……，从乡间……”，既自然也更贴合原句结构。
