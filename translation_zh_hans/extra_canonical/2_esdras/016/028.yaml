  text: For a man will long to see another man[a], or at least to hear his voice.
translation:
  language: zh_hans
  text: 因为人会渴望见到另一个人，或至少听见他的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: concupiscet
  choice: 会渴望
  rationale: 表达强烈而持续的盼望；在此语境中不是通常带负面色彩的“贪恋”。
- source_word: homo hominem
  choice: 人……另一个人
  rationale: 保留同一名词的重复及人与人之间的区分，同时使现代汉语自然清楚。
- source_word: videre
  choice: 见到
  rationale: 按其基本义译为实际看见、遇见某人。
- source_word: vel certe
  choice: 哪怕至少……也好
  rationale: 体现较低层级的退一步选择：若不能见面，至少听见声音；不译作递进性的“甚至”。
- source_word: vocem eius audire
  choice: 听见他的声音
  rationale: 直接对应拉丁文，并保留代词所指为前述另一个人。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“哪怕至少……也好”传达灾难语境中退而求其次的迫切愿望。原文没有需要另加脚注才能保存的实质歧义。
