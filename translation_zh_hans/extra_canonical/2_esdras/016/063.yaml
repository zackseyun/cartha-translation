  text: the breath of God Almighty[a], who made all things and searches out hidden things in hidden places. Surely he knows your devising.
translation:
  language: zh_hans
  text: 全能上帝的气息；他创造了万物，探察隐秘之处的隐秘事。他确实知道你们的图谋。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiramentum
  choice: 气息
  rationale: 保留拉丁词表示“气息、呼吸”的具体意象，并与“全能上帝”构成原文的名词短语；不擅自补入本节原文没有的连词。
- source_word: scrutatur
  choice: 探察
  rationale: 表达细致查考、洞悉之意，语体庄重而自然。
- source_word: absconsa in absconsis
  choice: 隐秘处的隐秘事
  rationale: 保留原文同根词叠用及“隐藏之物位于隐藏之处”的张力，不将其简化为一般的“秘密”。
- source_word: adinuentionem uestram
  choice: 你们的图谋
  rationale: adinuentionem 为单数，可指设计、谋划；此处用集合意义的“图谋”，保留单数语义并符合警告语境。
- source_word: Certe hic nouit
  choice: 他确实知道
  rationale: 将 hic 按指回前述上帝的代词理解；certe 译作“确实”，保留强调语气。
theological_decisions:
- issue: spiramentum dei omnipotentis 的句法与神学指涉
  choice: 译作“全能上帝的气息”，不解释为特定的位格称谓
  alternative: 全能上帝的灵
  rationale: 拉丁 spiramentum 首先具有气息、呼吸之义；译作“气息”可避免在原文未明确之处加入位格化的神学判断。
- issue: 本节与相邻经节的边界
  choice: 不加入句首“并”，也不加入“以及你们心里所想的”
  alternative: 按旧有合并式译文纳入相邻经节语句
  rationale: 所给拉丁本节以 spiramentum 起首，并止于 adinuentionem uestram；相邻语句分别属于16:62和16:64。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。尽量保存拉丁原文的压缩句法和重复意象，同时按中文需要补出“他”作为后一句主语；不添加超出本节经文边界的内容。
