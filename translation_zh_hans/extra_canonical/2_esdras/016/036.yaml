  text: Audite uero ista et cognoscite ea, serui domini. Ecce uerbum domini, excipite eum, ne discredatis de quibus dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/036.yaml
  text: But hear these things and know them, servants of the Lord. Behold, the word of the Lord; receive it; do not disbelieve the things he speaks.
translation:
  language: zh_hans
  text: 但你们要听这些事，并要知道这些事，主的仆人哪！看哪，这是主的话；你们要领受它，不要不信他所说的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite
  choice: 要听
  rationale: 保留命令语气；“听”直接对应拉丁文，并符合经文劝告的庄重语域。
- source_word: cognoscite
  choice: 要明白
  rationale: 此处不仅指获得知识，也指听后领会；“明白”在现代汉语中自然，并避免生硬的“认识这些事”。
- source_word: serui domini
  choice: 主的仆人
  rationale: servi 可指奴仆或服事者；“仆人”保留从属与服事含义，同时符合现代中文圣经语域，不额外强化社会身份。
- source_word: Ecce
  choice: 看哪
  rationale: 保留提示、强调功能及庄重的先知性语气。
- source_word: uerbum domini
  choice: 主的话
  rationale: 按其通常宗教语义直译，指从主而来的话语或信息。
- source_word: excipite eum
  choice: 你们要领受
  rationale: excipere 在此有接纳、接受之意；代词 eum 在拉丁文中与阳性 uerbum 呼应，中文无需重复宾语即可自然承接“主的话”。
- source_word: ne discredatis
  choice: 不要不信
  rationale: 保留原文否定命令及“不相信”的明确含义；虽有双音节否定感，但在中文宗教语境中清楚有力。
- source_word: de quibus dicit
  choice: 他所说的事
  rationale: 原句结构略不寻常，可理解为不要不信他所谈到的那些事；此译保留内容指向而不擅自具体化。
theological_decisions:
- issue: “主的话”与后续阳性代词的关系
  choice: 将“领受”的对象理解为前句“主的话”，中文省略重复宾语
  alternative: 译为“领受他”
  rationale: 拉丁文 eum 在语法上与阳性的 uerbum 一致，首先指向“话”；译成“他”会在中文中容易被理解为人格化对象，从而加入原文未必要求的神学判断。
- issue: 末句 dicit 的主语
  choice: 译作“他所说的事”，保留隐含的男性单数主语
  alternative: 译作“主的话所说的事”或“其中所说的事”
  rationale: 拉丁文 dicit 没有明示主语，可能承接“主”或语境中的发言者；采用“他”保留原文的隐含性，不明确判定其所指。
translation_notes:
  register: 采用现代、庄重而易懂的劝告语体。以“你们……哪”呈现呼语，以“看哪”保留原文强调。未添加脚注，因为主要歧义可在正文中保持，无需以异文或解释性信息打断阅读。
