revisions:
- from: 然而，你们要听这些事，也要明白；你们这些主的仆人哪！看哪，这是主的话；你们要领受，不要不信他所说的事。
  to: 但你们要听这些事，并要知道这些事，主的仆人哪！看哪，这是主的话；你们要领受它，不要不信他所说的事。
  rationale: 将“明白”改为“知道”，直接对应cognoscite ea；补出“领受它”的宾语，以保留eum对“主的话”的回指。其余措辞保留原有庄重、自然的劝告语气，并维持末句主语指向的原文歧义。
