  text: Vae tibi, Babylon et Asia, uae tibi, Aegypte et Syria! Praecingite uos saccis et ciliciis et plangite filios uestros et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/001.yaml
  text: Woe to you, Babylon and Asia! Woe to you, Egypt and Syria!
translation:
  language: zh_hans
  text: 巴比伦和亚细亚啊，你们有祸了！埃及和叙利亚啊，你们有祸了！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae tibi
  choice: 你们有祸了
  rationale: 保留“vae”的审判与哀叹语气；依汉语对并列地域的自然指称使用复数“你们”，并以“啊”呈现直接呼告。
- source_word: Babylon
  choice: 巴比伦
  rationale: 采用现代中文圣经及历史文献中通行的地名译法。
- source_word: Asia
  choice: 亚细亚
  rationale: 采用古代罗马行省语境下的传统地名译法，避免让读者直接等同于现代所称的整个亚洲。
- source_word: Aegypte
  choice: 埃及
  rationale: 采用现代汉语通行译名。
- source_word: Syria
  choice: 叙利亚
  rationale: 采用现代汉语通行译名，同时保留原文地域名称，不扩展其历史疆域含义。
theological_decisions:
- issue: “Vae”兼具哀叹与灾祸宣告的张力
  choice: 译作“你们有祸了”
  alternative: “你们有祸啊”或“你们要遭殃了”
  rationale: “你们有祸了”既可表达悲叹，也能传达先知式审判宣告；不像“要遭殃了”那样偏口语，也不把语义限定为单纯咒诅。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文两组平行呼告和两个感叹句的修辞结构。所给拉丁文本在本句之后接有“Praecingite...”等词，但按章节划分属于下一节，因此本稿只翻译2 Esdras 16:1。
