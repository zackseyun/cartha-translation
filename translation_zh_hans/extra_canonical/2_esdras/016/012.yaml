  text: non funditus conteretur a facie ipsius? Terra tremuit et fundamenta eius, mare fluctuatur de profundo, et fluctus eius disturbabuntur et pisces eius a facie domini et a gloria uirtutis eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/012.yaml
  text: Will not the earth be utterly crushed before him? The earth quakes[a], and its foundations; the sea surges from the deep, and its waves and its fish will be troubled before the Lord and before the glory of his power.
translation:
  language: zh_hans
  text: 难道大地不会在他面前被彻底压碎吗？大地震动了[a]，连它的根基也震动；海从深处翻腾，它的波浪和鱼都将在主面前、在他大能的荣耀面前受到搅扰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大地震颤”。
    reason: 拉丁文 tremuit 是完成时，可表示一次已经发生的震动，也可在生动叙述中呈现震颤景象。
lexical_decisions:
- source_word: funditus conteretur
  choice: 被彻底压碎
  rationale: 保留 funditus“彻底、从根本上”和 conteretur“将被压碎”的被动、将来意义。
- source_word: a facie ipsius / a facie domini
  choice: 在他面前／在主面前
  rationale: a facie 表示面对其临在或威势；直译为“在……面前”既自然，也不把这种表达窄化为单纯因果关系。
- source_word: mare fluctuatur de profundo
  choice: 海从深处翻腾
  rationale: fluctuatur 描写海水起伏动荡；“翻腾”在现代汉语中自然，并保留 de profundo“从深处”的意象。
- source_word: disturbabuntur
  choice: 都将……惊惶不安
  rationale: 保留该词第三人称复数、将来被动的时间指向；按上下文用于波浪和鱼群时，“惊惶不安”兼顾扰乱和震荡之意。
- source_word: gloria uirtutis eius
  choice: 他大能的荣耀
  rationale: uirtus 在此指能力、威力；译作“大能”符合庄重的圣经语域，同时保留“荣耀”与“大能”的属格关系。
theological_decisions:
- issue: “在他／主面前”是否改译为“因他／因主”
  choice: 保留“在……面前”
  alternative: “因他／因主”
  rationale: 拉丁文 a facie 可在语境中带有原因意味，但字面首先呈现面对其临在的图景；保留原表达可避免过早消解这层张力。
- issue: 混合时态的处理
  choice: 分别译出“震动了”“翻腾”“将……惊惶不安”
  alternative: 全部统一为现在时或将来时
  rationale: 原文依次使用完成时、现在时和将来时；保留这种变化比依照英语咨询层统一时态更忠于现存拉丁文本。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“连它的根基也震动”补出原文并列结构中省略的谓语，使汉语通顺；末句以“都将”同时统摄“波浪和鱼群”，对应复数将来式 disturbabuntur。
