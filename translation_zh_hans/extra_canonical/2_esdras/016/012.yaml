revisions:
- from: 难道大地不会在他面前被彻底压碎吗？大地震动了[a]，连它的根基也震动；海从深处翻腾，它的波浪和鱼群都将在主面前、在他大能的荣耀面前惊惶不安。
  to: 难道大地不会在他面前被彻底压碎吗？大地震动了[a]，连它的根基也震动；海从深处翻腾，它的波浪和鱼都将在主面前、在他大能的荣耀面前受到搅扰。
