  text: zelatur fornicariam mulierem idonea et bona ualde, Sic zela bitur iusticia iniquitatem cum exornat se, et accusat eam in faciem, cum uenerit qui defendat exquirentem omnem peccatum super terram. Propterea nolite similari eam nec operibus eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/051.yaml
  text: As a respectable and very beautiful woman is indignant toward a prostitute[a], so righteousness will be indignant toward iniquity when it adorns itself, and will accuse it to its face when he comes who defends the one who searches out every sin upon the earth[b]. Therefore do not be like it or its works.
translation:
  language: zh_hans
  text: 正如端庄而极美的妇人憎恶淫妇[a]，正义也必憎恶不义；当不义妆饰自己的时候，那维护鉴察全地一切罪恶者的来到时，正义必当面指控它[b]。所以，你们不要效法不义，也不要效法它的行为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句拉丁文简练而艰涩。其意象似乎以端庄妇人与淫妇作对照，描写正义公开揭露不义。
    reason: textual_variant
  - marker: b
    text: 拉丁文中“维护者”和“鉴察全地一切罪恶者”的关系并不十分明确；也可理解为“当那位维护者来到、维护那鉴察全地一切罪恶者时”。无论如何，“来到时”在句法上限定正义当面指控不义的时刻。
    reason: source_ambiguity
lexical_decisions:
- source_word: zelatur / zelabitur
  choice: 憎恶／必憎恶
  rationale: 拉丁语 zelari 在此表达强烈的反感或义愤；译作“憎恶”既保留力度，也比“嫉妒”更符合正义与不义的对照。
- source_word: fornicariam mulierem
  choice: 淫妇
  rationale: 直接表达从事淫乱的女子，并与 idonea et bona ualde 所描绘的端庄妇人形成鲜明对比。
- source_word: iusticia / iniquitatem
  choice: 正义／不义
  rationale: 保留抽象概念的拟人化对立，不将其具体化为某类人或某种宗派性的神学范畴。
- source_word: cum exornat se
  choice: 不义妆饰自己的时候
  rationale: 保留反身动作及女性形象所带出的修饰意象，同时在中文中明示主语以避免歧义。
- source_word: accusat eam in faciem
  choice: 当面指控它
  rationale: 准确传达公开、直接控告之意。
- source_word: exquirentem omnem peccatum super terram
  choice: 鉴察全地一切罪恶者
  rationale: exquirere 有彻底搜寻、查究之意；“鉴察”符合庄重语体，并保留其所指者身份未明的状态。
- source_word: nolite similari eam nec operibus eius
  choice: 不要效法不义，也不要效法它的行为
  rationale: 中文补明“不义”，使代词指向清楚；similari 译为“效法”自然表达不要变得像它、不要仿行其作为。
theological_decisions:
- issue: “那维护……者”与“鉴察……者”是否为同一主体
  choice: 按拉丁语法将“鉴察全地一切罪恶者”作为 defendat 的受词，保留两者可能有别
  alternative: 将其合并为“那位鉴察全地一切罪恶、施行维护的来到时”
  rationale: 原文 qui defendat exquirentem 的关系清楚度有限，不宜在译文中把两个角色强行认定为同一位。
- issue: 正义与不义的拟人化性别
  choice: 用“它”回指“不义”，但保留“妆饰”的女性意象
  alternative: 全程使用“她”强化拟人化
  rationale: 现代汉语通常以“它”回指抽象概念；原文 eam/eius 的阴性也受拉丁名词语法性影响，因此不将自然性别教义化。
- issue: 来者身份
  choice: 不明确称为上帝、基督或审判者
  alternative: 译作“审判者来到时”
  rationale: 原文仅说“那维护……者”，未直接指名；译文保留这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留正义和不义的拟人化、原文压缩句法所造成的歧义，以及来者身份未明的特点；为中文清晰度适度补出主语，但不增添宗派性解释。
