translation:
  language: zh_hans
  text: 他必发出雷鸣，谁能不战栗呢？主必威吓，谁又……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在这里止于“谁又”，句子没有写完。
    reason: 说明正文以省略号结束是由于现存文本残缺，并准确反映拉丁语止处，不补出未存的谓语或情态成分。
lexical_decisions:
- source_word: tonabit
  choice: 必发雷声
  rationale: 拉丁语 tonabit 指发出雷鸣；用“发雷声”保留具体意象及将来时语气。
- source_word: horrebit
  choice: 战栗
  rationale: horrebit 在此表示因恐惧而发抖；“战栗”比单纯“害怕”更贴近其身体反应。
- source_word: Dominus
  choice: 主
  rationale: 采用中文圣经传统中对 Dominus 的标准、庄重译法。
- source_word: comminabitur
  choice: 必发出威吓
  rationale: comminari 表示威吓、发出威胁；此译保留行动性，且不擅自补出威吓的内容或对象。
theological_decisions:
- issue: 残句是否补全
  choice: 保留未完结状态，并以省略号标示
  alternative: 依据后续文本或推测补成完整问句
  rationale: 所给拉丁语止于 et quis（“谁又……”），没有足够原文依据补出谓语；保留断裂可避免引入未经支持的神学含义。
- issue: tonabit 的主语
  choice: 译作“他”，与英文审校层一致，并让上下文中的主所指保持可能关联
  alternative: 直接补译为“主必发雷声”
  rationale: 拉丁语动词本身未明说主语；译作“他”不把后一分句明确出现的 Dominus 倒填进前句，从而保留原文句法上的含蓄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“发雷声—战栗—发出威吓”保留原文紧迫、审判性的修辞节奏；不补写残缺部分。
