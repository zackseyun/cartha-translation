  source_fidelity: 首句准确传达 tonabit（“他将雷鸣/发出雷鸣”）及 horrebit 的恐惧性颤抖。第二句的 comminabitur 宜简洁译为“威吓”。拉丁残文仅止于“et quis”（“而谁/谁又”）；草稿正文及注释中的“谁又能”多添了“能”，虽属汉语顺接，却不是现存文本所含。
  naturalness: “他必发出雷鸣，谁能不战栗呢？”庄重、清楚且符合现代汉语。“主必威吓，谁又……”在保留残句的前提下自然可读；省略号和脚注足以说明断裂并非译者删节。
  terminology: “主”适合 Dominus 的庄重宗教语域；“威吓”准确对应 comminabitur，较“发出威吓”更简洁自然。“战栗”准确表达 horrebit。
