  text: doing in all things as Adam and all his generations did[a]; for they too had an evil heart.
translation:
  language: zh_hans
  text: 他们所行的一切，都像亚当和他的历代后裔所行的一样；因为他们也有一颗邪恶的心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in omnibus facientes
  choice: 凡事都……去行
  rationale: 既保留“在一切事上行”的全面含义，也使汉语句子自然顺畅。
- source_word: sicut fecit Adam et omnes generationes eius
  choice: 照亚当和他历代子孙所行的
  rationale: generationes 在此指亚当以后相继的世代；译作“历代子孙”比直译“各世代”更符合现代汉语，同时不限定具体亲属层级。
- source_word: utebantur enim et ipsi cor malignum
  choice: 因为他们也有一颗邪恶的心
  rationale: 晚期拉丁语 utebantur 与 cor malignum 连用，在此表达具有某种内在状态，宜译为“有”，不译成带有主动利用意味的“使用”；malignum 译为“邪恶的”。
theological_decisions:
- issue: “邪恶的心”是内在状态还是被主动使用的工具
  choice: 译为“有一颗邪恶的心”，表达其所具有的内在状况
  alternative: “使用邪恶的心”或“利用邪恶的心”
  rationale: 拉丁语此处的 utor 属于表示具有某种性质或状态的用法；译成“使用”会不必要地强化主动操弄之意。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“凡事都照……所行的去行”保留原文重复“行”的修辞联系；“历代子孙”自然呈现 generationes eius 的世代延续含义。
