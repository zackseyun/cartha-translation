source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tremere fecisti abyssos, et conturbasti saeculum. Et transiit gloria tua portas quattuor, ignis et terrae motus et spiritus et gelus; ut dares semini Iacob legem, et generationi Israel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/019.yaml
  text: and made the depths tremble and troubled the age. And your glory passed through the four gates—fire and earthquake and wind and frost—that you might give the law to the seed of Jacob[19], and your commandment to the generation of Israel.
translation:
  language: zh_hans
  text: 你使深渊战栗，使世界动荡。你的荣耀经过四道门——火、地震、风和霜[a]——为要把律法赐给雅各的后裔和以色列的世代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的荣耀经过四道门——火、地震、风和霜”在文本和意象上都很难解释。这里保留拉丁文本奇特的神显描写，不按《出埃及记》的叙述加以协调。
    reason: textual_variant
lexical_decisions:
- source_word: abyssos
  choice: 深渊
  rationale: 保留复数拉丁词所指的原始深水或深渊意象；汉语用集合性单数表达更自然。
- source_word: saeculum
  choice: 世界
  rationale: 该词可指“时代”或“世界”；此处与深渊震动及神显场景并列，“世界”更符合宇宙受震动的语境，同时不把它窄化为某一历史时代。
- source_word: portas quattuor
  choice: 四道门
  rationale: 直译这一难解意象，不将其协调为《出埃及记》中较熟悉的神显描写。
- source_word: gelus
  choice: 霜
  rationale: 保留其寒冷、霜冻之义，并与火、地震、风构成原文奇特的四项并列。
- source_word: legem
  choice: 律法
  rationale: 在犹太经文语境中自然对应赐给雅各后裔的神圣律法。
- source_word: semini Iacob ... generationi Israel
  choice: 雅各的后裔和以色列的世代
  rationale: 保留“雅各／以色列”的平行称谓，以及“后裔／世代”之间近义而不完全相同的表达。
theological_decisions:
- issue: 末句中“律法”是否同时支配两个受词
  choice: 把“律法”理解为同时赐给“雅各的后裔”和“以色列的世代”
  alternative: 依英语咨询文本补出“你的诫命”，形成“把律法赐给雅各的后裔，把你的诫命赐给以色列的世代”
  rationale: 现有拉丁文本只有一个明确宾语 legem（律法），后接两个与格对象；将同一宾语用于两者最贴近所给原文，也避免补入原文没有的“诫命”。
- issue: 四道门的神显意象
  choice: 原样保留火、地震、风和霜四项
  alternative: 按《出埃及记》的神显传统改写或解释这些意象
  rationale: 原文措辞确实奇特；保留其张力，不以熟悉的经文图景消解文本困难。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“战栗”“动荡”传达宇宙性震撼；破折号保留“四道门”与随后四项之间既像同位说明、又难以确解的关系。
