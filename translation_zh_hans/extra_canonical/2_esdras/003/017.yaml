  text: 在众多人中。后来，当你领那后裔出来时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in multitudine magna
  choice: 人数众多
  rationale: 按现存拉丁文本保留承接上文的结果性短语；用自然现代汉语表达“大量、众多”的意思，不补入本片段没有明说的谓语或对象。
- source_word: Et factum est
  choice: 后来
  rationale: 这是叙事推进的惯用表达；译为“后来”比逐字译作“事情发生了”更符合现代汉语，同时不预断后续事件的具体内容。
- source_word: educeres
  choice: 你领……出来时
  rationale: 未完成虚拟式受 cum 引导，构成时间从句；“领……出来”保留拉丁词的引出、带出之意。
- source_word: semen
  choice: 那后裔
  rationale: 此处 semen 是集合性单数，可指“种子”或“后裔”；叙事语境下“后裔”较自然，但不补入原片段未明说的所属代词。
theological_decisions:
- issue: semen 的所指与所属
  choice: 译作“那后裔”，不加“他的”或其他所属语
  alternative: 译作“他的后裔”或“种子”
  rationale: 拉丁片段只有 semen，没有显式所属成分；“后裔”符合人物群体语境，而省去所属代词可避免把上下文信息无标记地加入本节。
- issue: 是否补出“埃及”和“西奈山”
  choice: 不补出
  alternative: 按较完整上下文译为“你领他的后裔出埃及，就把他们带到西奈山”
  rationale: 所提供的校勘文本片段止于 semen；新增地点和后续主句会超出本节给定的原文证据。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。由于原文在时间从句中截断，中文也以逗号结尾，保留跨节延续的句法，不擅自补全下一节内容。
