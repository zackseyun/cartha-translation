source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lex tua in eis fructum. Cor enim malignum baiolans primus Adam transgressus et uictus est, sed et omnes qui ex eo nati
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/021.yaml
  text: For the first Adam, bearing an evil heart, transgressed and was overcome; and so also did all who were born from him.
translation:
  language: zh_hans
  text: 因为第一个亚当怀着一颗邪恶的心，违犯了，并且被制伏了；所有从他而生的人也同样如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: primus Adam
  choice: 最初的亚当
  rationale: 直接保留“第一／最初的亚当”之意；在现代汉语中，“最初的亚当”比“第一个亚当”更自然，也避免误解为序数编号。
- source_word: Cor enim malignum baiolans
  choice: 因为……怀着一颗邪恶的心
  rationale: baiolans 表示携带、承受或怀有；“怀着”自然传达其主动承载的含义，又不额外引入“受重压”等解释。cor malignum 直译为“邪恶的心”。
- source_word: transgressus
  choice: 行了违背之事
  rationale: 拉丁文在此绝对使用该动词，没有明说所违背的对象；此译保持这一省略，不擅自补入“律法”或“诫命”。
- source_word: uictus est
  choice: 被制伏了
  rationale: 保留被动语态及“被胜过、被击败”的核心意思；“被制伏”在此比生硬的“被胜过”更符合现代汉语。
- source_word: omnes qui ex eo nati
  choice: 所有从他而生的人
  rationale: 贴近原文，保留全称范围及源自亚当的关系。
theological_decisions:
- issue: 亚当之后众人的“同样如此”具体涵盖什么
  choice: 所有从他而生的人也同样如此
  alternative: 所有从他而生的人也都违背了，并且被制伏了
  rationale: 原文 sed et 以省略方式把前述谓语施用于众人；保留“同样如此”既忠实于简练结构，也不额外界定其神学机制。
- issue: 是否补明亚当所违背的是律法
  choice: 不补明对象
  alternative: 违背了律法
  rationale: 虽然上下文涉及律法，但本句 transgressus 本身没有明示宾语；不补入对象可保存原文的表达张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留原文的因果开头、被动结果和后半句的省略对应。所给拉丁文本开头“lex tua in eis fructum.”在语法上显然是前文残句或跨节材料，未纳入本节正文；本节依从以“Cor enim malignum…”起句的节界。
