source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc ergo pondera in statera nostras iniquitates et eorum qui habitant in saeculo, et invenietur momentum puncti ubi declinet.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/034.yaml
  text: Now therefore weigh our iniquities in the balance[a], and those of the inhabitants of the world; and it will be found at what point it inclines.
translation:
  language: zh_hans
  text: 所以，现在就把我们的罪孽和世上居住的人的罪孽放在天平上称量，就会看出指针偏向哪一边。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可较直译为：“就会看出那一点在何处倾斜。”拉丁文 momentum puncti 的具体所指并不完全确定；在天平语境中，可能指指示点或指针的偏转。
    reason: 保留拉丁语短语的词义与句法歧义，并说明正文采用“指针”是依天平语境作出的解释性表达。
lexical_decisions:
- source_word: pondera in statera
  choice: 放在天平上称一称
  rationale: 保留命令语气和称量的具体意象，同时符合现代汉语表达。
- source_word: iniquitates
  choice: 罪孽
  rationale: 表达道德与宗教意义上的罪恶，语体庄重，并避免弱化为一般的“过错”。
- source_word: qui habitant in saeculo
  choice: 世上居民
  rationale: 此处 saeculum 指现世或世界；“世上居民”自然地传达居住于世界之人的整体。
- source_word: momentum puncti
  choice: 指针会偏向哪一边
  rationale: 结合天平语境，momentum puncti 可理解为指示点或指针的偏转；这样译出比直译“点的动势”更清楚。
- source_word: ubi declinet
  choice: 偏向哪一边
  rationale: 按间接疑问理解 ubi，表达称量结果所显示的倾向方向。
theological_decisions:
- issue: 比较双方罪孽的结果是否明说
  choice: 只说看天平指针偏向哪边，不明说哪一方更重
  alternative: 译成“就会发现谁的罪孽更重”
  rationale: 原文保留称量意象，也未在本节直接说出结果；译文不提前消解其修辞张力。
- issue: saeculum 的宇宙论或时代含义
  choice: 译为“世上”
  alternative: 译为“这个世代”或“今世”
  rationale: 在此与“居住者”连用时，“世上居民”最符合上下文；同时不额外引入特定末世论解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称一称”使命令自然；“罪孽”保持经文语体。正文保留天平比喻和结论的开放性，脚注交代末句的文本歧义。
