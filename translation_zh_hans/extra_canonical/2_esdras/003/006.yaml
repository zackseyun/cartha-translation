source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et induxisti eum in paradisum, quem plantauit dextera tua antequam terra adueṅtaret.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/006.yaml
  text: And you brought him into paradise, which your right hand had planted before the earth came into being.
translation:
  language: zh_hans
  text: 你把他领进乐园；在大地形成之前，你的右手就栽植了这乐园。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: induxisti
  choice: 领进
  rationale: 准确表达“带领进入”，比单纯的“带到”更能保留进入乐园的动态。
- source_word: paradisum
  choice: 乐园
  rationale: 采用现代中文圣经语境中自然、庄重的对应词，并保留其作为特定园子的含义。
- source_word: dextera tua
  choice: 你的右手
  rationale: 直译原文拟人表达，不改写为抽象的“能力”，以保留其诗性和神学意象。
- source_word: plantauit
  choice: 栽植了
  rationale: “栽植”适用于园林并具有庄重文体，准确对应“栽种、建立园子”。
- source_word: antequam terra adueṅtaret
  choice: 在大地形成之前
  rationale: 此处所指并非大地移动到来，而是尚未出现或成为现实；“形成”在现代汉语中自然表达其创世语境，同时避免过度规定具体的创造机制。
theological_decisions:
- issue: 乐园先于大地的时间关系
  choice: 在大地形成之前
  alternative: 在大地出现之前／在大地成形以前
  rationale: 保留原文明确的先后关系，不借解释消解乐园与大地之间可能存在的宇宙论张力；“形成”也与英文审校层的“came into being”相符。
- issue: “右手”的拟人意象
  choice: 保留“你的右手”
  alternative: 借着你的能力
  rationale: 原文明确使用 dextera；保留身体意象，既忠实于文本，也不预先将它化约为某种系统神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你把他领进乐园”自然明确；分号使后面的关系从句在中文中更清楚，并避免连续使用两个“你”造成句法含混。
