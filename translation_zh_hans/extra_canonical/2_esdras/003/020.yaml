  yaml_path: translation/extra_canonical/2_esdras/003/020.yaml
  text: Yet you did not take away from them the evil heart, so that your law might bear fruit in them.
translation:
  language: zh_hans
  text: 然而，你并没有从他们身上除去邪恶的心，使你的律法能在他们里面结出果实。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的拉丁文节选在“ut faceret”（使……能……）处中断；“你的律法……结出果实”据所附经审核的英文参照层补足。
    reason: 明确区分现有拉丁文证据与参照文本所保存的残缺后文，避免把未提供的拉丁词句当作直接可见的原文。
lexical_decisions:
- source_word: cor malignum
  choice: 邪恶的心
  rationale: 直译这一拉丁短语，保留“心”作为人内在意志与倾向之中心的表达。
- source_word: abstulisti ab eis
  choice: 从他们身上除去
  rationale: 准确体现 auferre ab 的移除含义，同时符合现代汉语习惯。
- source_word: ut faceret
  choice: 使……能……结出
  rationale: 保留 ut 加虚拟式所表达的目的或预期结果关系；中文措辞不强行判定其仅为目的还是结果。
theological_decisions:
- issue: 未除去邪恶之心与律法结果之间的关系
  choice: 使你的律法能在他们里面结出果实
  alternative: 所以你的律法可以在他们里面结出果实
  rationale: 前者把后半句理解为本应由“除去邪恶的心”带来的结果，并在否定主句下保留原文的张力；避免把“不除去邪恶的心”误说成律法结果子的原因。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“结出果实”保留原文的结果隐喻；句法尽量贴近拉丁文，同时使否定范围在中文中清楚可读。
