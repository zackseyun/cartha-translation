  text: because I saw the desolation of Zion and the abundance of those who lived in Babylon.
translation:
  language: zh_hans
  text: 因为我看见锡安的荒凉，也看见住在巴比伦之人的富足。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desertionem
  choice: 荒凉
  rationale: 此处指锡安遭弃置、荒废的景象；“荒凉”自然凝练，并保留原文的悲惨意味。
- source_word: habundantiam
  choice: 富足
  rationale: 与锡安的“荒凉”形成鲜明对照；该词可指丰盛、充裕，译作“富足”不额外限定为人口众多或物质财富。
- source_word: habitant in Babilone
  choice: 住在巴比伦之人
  rationale: 贴近拉丁文关系从句，同时符合庄重、清楚的现代汉语表达。
theological_decisions:
- issue: 锡安荒凉与巴比伦富足之间的张力
  choice: 直接并列两幅景象，不添加因果或道德评断
  alternative: 将巴比伦的富足明确解释为恶人兴盛或掳掠所得
  rationale: 原文仅陈述所见的反差，未在本节内说明其神学原因；译文保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；重复“看见”以清楚呈现两个并列宾语，并强化锡安与巴比伦的对照。
