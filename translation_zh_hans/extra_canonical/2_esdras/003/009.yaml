  text: Iterum autem in tempore induxisti diluuium super habitantes saeculum, et perdidisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/009.yaml
  text: Again, in time, you brought the flood upon the inhabitants of the world, and destroyed them.
translation:
  language: zh_hans
  text: 后来，你又使洪水临到世上的居民，把他们消灭了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iterum autem
  choice: 后来……又
  rationale: 承接上文并表达再次发生；“后来”自然体现 autem 在叙事中的推进作用，“又”对应 iterum。
- source_word: in tempore
  choice: 后来
  rationale: 此处表示在随后的时序中，而非强调某个抽象的“时间之内”；合并译入“后来”，符合现代汉语叙事习惯。
- source_word: diluuium
  choice: 洪水
  rationale: 准确对应洪水事件，措辞简明且为现代中文读者熟悉。
- source_word: habitantes saeculum
  choice: 世上的居民
  rationale: 按拉丁文直译其居住于世界的人群之意；“世上”比“时代”更符合此处 saeculum 的空间性用法。
- source_word: perdidisti eos
  choice: 把他们消灭了
  rationale: 保留 perdere 在此处使人灭亡、毁灭的强烈含义，并明确宾语所指。
theological_decisions:
- issue: 洪水行动的施事者
  choice: 保留第二人称“你”作为使洪水临到并消灭居民的主体
  alternative: 弱化为“洪水临到世人，他们便灭亡了”
  rationale: 原文两个动词 induxisti、perdidisti 均明确以“你”为施事者，不应弱化其中的神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“后来……又”避免生硬照译“再次，在时间中”，同时完整保留事件次序、洪水对象及毁灭结果。
