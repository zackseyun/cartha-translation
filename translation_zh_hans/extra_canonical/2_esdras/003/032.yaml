id: 2ES.3.32
reference: 2 Esdras 3:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut alia gens cognovit te praeter Israhel? aut quae tribus crediderunt testamentis sicut haec Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/032.yaml
  text: Or has any other nation known you besides Israel? Or what tribes have believed the covenants like this Jacob?[a]
translation:
  language: zh_hans
  text: 除了以色列，还有别的民族认识你吗？又有哪些部族像雅各的这些支派一样相信诸约呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像雅各的这些支派一样”：拉丁文此处措辞不规则或十分简略，也可理解为“像这雅各一样”。
    reason: 说明sicut haec Iacob的语法困难及可能的另一种理解，避免把有争议的指代默默定死。
lexical_decisions:
- source_word: alia gens
  choice: 别的民族
  rationale: alia gens并无疑问限定词，置于疑问句中自然表达“还有别的民族／任何其他民族”。
- source_word: cognovit te
  choice: 认识你
  rationale: 保留cognoscere在关系与宗教语境中的“认识”，不弱化为仅仅“听说过”。
- source_word: tribus
  choice: 部族／支派
  rationale: 首次按一般意义译作“部族”；与雅各相连时用中文圣经语境中自然的“支派”。
- source_word: crediderunt testamentis
  choice: 相信诸约
  rationale: credere接与格可表示相信、信赖；testamentis为复数，译作“诸约”，不擅自添加“你的”。
- source_word: haec Iacob
  choice: 雅各的这些支派
  rationale: 将不规则或简缩的haec理解为回指阴性复数tribus，即“雅各的这些支派”，在性数上较为可信。
theological_decisions:
- issue: “认识你”是否仅指以色列对上帝的认知
  choice: 保留“认识你”
  alternative: 承认你／知道你
  rationale: 原文的cognovit既可包含认知，也可带关系性含义；直译能保留这种张力。
- issue: 对诸约的回应性质
  choice: 相信诸约
  alternative: 信守诸约／信靠诸约
  rationale: “信守”偏向履行义务，“信靠”则可能过度人格化约；“相信”较直接对应crediderunt，并保留解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的疑问句式；“诸约”略具经文语体，但能简洁保留拉丁文复数。
