  yaml_path: translation/extra_canonical/2_esdras/003/018.yaml
  text: you bent down the heavens[a], established the earth, and moved the world,
translation:
  language: zh_hans
  text: 你使诸天俯下[a]，使大地立定，又使世界震动，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有古译本所反映的读法可译作：“你使诸天俯下，使大地震动，又使世界摇动。”
    reason: 说明拉丁文“使大地立定”背后可能存在的古老异文，并保留 commouisti 译法上的语义差别。
lexical_decisions:
- source_word: inclinasti caelos
  choice: 使诸天俯下
  rationale: 直译其使役结构，并以自然、庄重的现代汉语表达天穹下倾的意象。
- source_word: statuisti terram
  choice: 使大地立定
  rationale: 按所给拉丁文本翻译 statuisti（建立、使稳立），不以其他古译本推定的“震动”取代正文读法。
- source_word: commouisti orbem
  choice: 使世界震动
  rationale: commouisti 表示使之移动、摇动；在西奈显现的语境中译为“震动”自然有力，orbis 在此作“世界”。
theological_decisions:
- issue: statuisti terram 的文本张力
  choice: 正文采用“使大地立定”
  alternative: “使大地震动”
  rationale: 现有拉丁底本明确作 statuisti；虽有叙利亚文和埃塞俄比亚文旁证支持可能源自“震动”的异文，仍不应无标记地改写所指定底本，故将异文保留在脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；三个并列分句保留拉丁文的宇宙性排比。因本节为句中片段，末尾保留逗号以衔接下文。
