id: 2ES.3.5
reference: 2 Esdras 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dedit tibi Adam, corpus mortuum ? sed et ipsum figmentum manuum tuarum erat, et insufflasti in eum spiritum uitae, et factus est uiuens coram te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/005.yaml
  text: And you gave Adam a dead body? Yet he too was the work of your hands, and you breathed into him the spirit of life, and he became alive before you.
translation:
  language: zh_hans
  text: 你把一个死的身体赐给了亚当吗？然而，他也是你亲手塑造的；你把生命之气吹入他里面，他就在你面前成了活人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dedit tibi Adam
  choice: 你把……赐给了亚当
  rationale: 拉丁文本此处传本措辞或标点存在困难；依上下文及英语审校层将动词主语理解为“你”，并把 tibi 所呈现的疑难关系按自然汉语表达为向亚当赐予身体，同时保留问句。
- source_word: corpus mortuum
  choice: 一个死的身体
  rationale: 直译核心意象，表明身体在生命之气吹入以前没有生命。
- source_word: figmentum manuum tuarum
  choice: 你亲手塑造的
  rationale: figmentum 指被塑成之物；用“亲手塑造”自然传达“你双手的作品”，并呼应创造叙事。
- source_word: spiritum uitae
  choice: 生命之气
  rationale: spiritus 可指气息、风或灵；在“吹入”的语境中译作“生命之气”，既自然又保留气息与生命赋予之间的联系。
- source_word: factus est uiuens coram te
  choice: 他就在你面前成了活人
  rationale: “成了活人”符合汉语创造叙事的庄重表达；“在你面前”对应 coram te，不将其弱化为单纯“因你而活”。
theological_decisions:
- issue: 亚当身体在受气以前被称为“死的”
  choice: 保留“死的身体”及问号
  alternative: 译为“没有生命的身体”或改作陈述句
  rationale: 原文明确使用 mortuum，且所给清理文本带问号；保留其突兀和修辞张力，不替作者消解。
- issue: spiritus 的语义范围
  choice: 生命之气
  alternative: 生命之灵
  rationale: 动词 insufflasti“吹入”突出气息意象；译作“生命之气”避免预先将其限定为特定的圣灵论含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”保留转折，“亲手塑造”比“你手中的制品”更自然。首句底本文法和标点较为困难，正文依上下文作最可读的处理，但不增添底本未有的神学解释。
