  text: impietatem facere plus quam priores. Et factum est cum iniquitatem facerent coram te, elegisti tibi ex his unum, cui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/013.yaml
  text: And it happened, when they were committing iniquity before you, you chose for yourself one from among them,
translation:
  language: zh_hans
  text: 他们在你面前行不义的时候，你就从他们中间为自己拣选了一个，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniquitatem facerent
  choice: 行不义
  rationale: 直接表达持续作恶、违背正道之意，并保留原文较庄重的伦理措辞。
- source_word: coram te
  choice: 在你面前
  rationale: 保留拉丁文的空间性表达，也传达其行为处于上帝鉴察之下。
- source_word: elegisti tibi
  choice: 为自己拣选了
  rationale: “拣选”符合庄重的经文语体；“为自己”明确保留 tibi，不将其弱化或省略。
- source_word: ex his unum
  choice: 从他们中间……一个
  rationale: 不补出“男人”或具体身份，保留 unum 仅指“一个”的原文开放性。
theological_decisions:
- issue: 被拣选者的身份
  choice: 一个
  alternative: 一个人
  rationale: 拉丁文只有 unum，没有明说 vir 或 homo；因此不补出“人”，以避免超出源文。
- issue: 叙事连接语 Et factum est cum
  choice: 以“……的时候……就……”表达
  alternative: 事情是这样：当……时……
  rationale: 现代汉语中用时间从句自然传达事件发生的结构；避免生硬直译，同时不改变事件关系。
translation_notes:
  register: 采用现代、庄重而自然的简体中文经文语体。句末逗号予以保留，因为源文在“一个”之后以 cui 引出后续关系从句，本节本身并未构成完整句意。
