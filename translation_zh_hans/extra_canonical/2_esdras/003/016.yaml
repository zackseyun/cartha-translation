  yaml_path: translation/extra_canonical/2_esdras/003/016.yaml
  text: him, and you gave him Isaac, and to Isaac you gave Jacob and Esau. And you set apart Jacob for yourself, but Esau you separated, and Jacob became
translation:
  language: zh_hans
  text: 他；你赐给他以撒，又赐给以撒雅各和以扫。你把雅各分别出来归你，却把以扫分开；雅各便成了——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dedisti
  choice: 赐给
  rationale: 保留两次“赐给”的重复，并以自然而庄重的现代汉语表达上帝的赐予。
- source_word: segregasti tibi
  choice: 分别出来归你
  rationale: 既表达 segregasti 的分别，也明确保留 tibi“归你、为你”的含义。
- source_word: separasti
  choice: 分开
  rationale: 与前句“分别出来归你”有所区别，同时不擅自补出以扫被分离的对象、目的或神学结论。
- source_word: factus est
  choice: 便成了
  rationale: 忠实保留句末未完成的“成为”结构，不从后续经文补全宾语或结果。
theological_decisions:
- issue: 雅各与以扫受到不同处置的含义
  choice: 你把雅各分别出来归你，却把以扫分开
  alternative: 你拣选雅各归你，却弃绝以扫
  rationale: 拉丁文使用 segregasti 与 separasti，原句并未明确说“拣选”或“弃绝”；译文保留措辞上的对应与神学张力，避免过度解释。
- issue: 残句的处理
  choice: 以破折号标明“雅各便成了——”尚未完结
  alternative: 根据下一节补全句意
  rationale: 所给原文止于 factus est Iacob，属于跨节残句；不应擅自把后文内容移入本节。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。开头“他”承接上一节，虽在本节中显得残缺，仍按来源保留；结尾同样保留原文的未完成状态，并用破折号提示续接。
