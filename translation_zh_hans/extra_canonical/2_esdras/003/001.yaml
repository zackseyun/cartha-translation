source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: anno tricesimo ruinae civitatis eram in Babylone, ego Salathihel qui et Ezras, et conturbatus sum super cubili meo recumbens, et cogitationes meae ascendebant super cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/001.yaml
  text: In the thirtieth year after the ruin of the city[a], I was in Babylon—I, Salathiel, who am also Ezra—and as I lay on my bed, I was troubled, and my thoughts came up upon my heart,
translation:
  language: zh_hans
  text: 城毁后的第三十年，我在巴比伦。我，就是撒拉铁，又名以斯拉，躺在床上，心里烦乱，思绪涌上心头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: anno tricesimo ruinae civitatis
  choice: 城毁后的第三十年
  rationale: 按上下文将属格结构理解为从城遭毁灭起计算的第三十年；译文简洁自然，同时保留原文未明说城名的特点。
- source_word: Salathihel qui et Ezras
  choice: 撒拉铁，又名以斯拉
  rationale: qui et 表示同一人另有此名；采用现代汉语常用的身份说明方式。
- source_word: conturbatus sum
  choice: 心里烦乱
  rationale: 表达 conturbatus 所指的内在不安和搅扰，不额外限定其原因或程度。
- source_word: cogitationes meae ascendebant super cor meum
  choice: 思绪涌上心头
  rationale: 保留 ascendebant 的上涌意象，并以自然汉语传达 super cor meum 所反映的闪族式内心表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将拉丁文较长的并列句适度分句，以免中文结构拖沓；不补出原文未注明的城市名称，也不把“思绪”具体解释为祷告、异象或某种教义性反省。英文咨询层所给脚注标记位置与脚注内容彼此不符，且拉丁原文在此无需异文说明，因此正文不设脚注。
