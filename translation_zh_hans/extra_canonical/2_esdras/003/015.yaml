  text: And you established with him an everlasting covenant, and said that you would never forsake his seed.
translation:
  language: zh_hans
  text: 你与他立了永远的约，并应许永不离弃他的后裔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: disposuisti ei testamentum aeternum
  choice: 你与他立了永远的约
  rationale: “testamentum”在此指上帝与人所立的约；“与他立约”符合现代汉语习惯，也准确表达拉丁文关系。
- source_word: dixisti
  choice: 应许
  rationale: 字面为“说了”，但其后内容是上帝所作的承诺；译为“应许”自然地传达语用意义。
- source_word: non unquam derelinqueres
  choice: 永不离弃
  rationale: 保留否定词的绝对力度，简洁表达“不在任何时候离弃”。
- source_word: semen
  choice: 后裔
  rationale: 此处“种子”是集体性血脉用语，现代中文宜译作“后裔”，不限定单数或复数。
theological_decisions:
- issue: 永约与永不离弃之应许的表述
  choice: 直接保留“永远”与“永不”的绝对措辞
  alternative: 按后续叙事附加条件或限定
  rationale: 本节拉丁文本没有明示任何条件；译文不以体系神学消解原文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；句式简洁，适合普通读者，并保留盟约术语。拉丁文开头“temporum finem solo secrete noctu”看似属于上一节的残余片段，依经文划分及英文审校层，本节从“Et disposuisti”起译。
