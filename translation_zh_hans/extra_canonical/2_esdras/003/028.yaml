  yaml_path: translation/extra_canonical/2_esdras/003/028.yaml
  text: Then I said in my heart[28], ‘Do those who live in Babylon act better, and is that why Zion is ruled?’
translation:
  language: zh_hans
  text: 那时，我心里说[a]：“住在巴比伦的人难道行得更好吗？锡安是因此才受辖制吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的拉丁文较为生硬，可能反映文本传抄过程中出现了讹乱。以斯拉的申诉把巴比伦表面的兴盛与锡安的败落相对照；本译文保留修辞性疑问，不强行采用更顺畅的重构。
    reason: alternative_reading
lexical_decisions:
- source_word: in corde meo
  choice: 我心里
  rationale: 自然表达内心自语，同时贴合拉丁文“在我心中”的含义。
- source_word: meliora faciunt
  choice: 行得更好
  rationale: 保留比较意味及行为层面的宽泛含义，不擅自具体化为更公义或更善良。
- source_word: dominabit Sion
  choice: 锡安……受辖制
  rationale: 拉丁文本形式生硬；依上下文将锡安理解为受统治者，同时不明说施行统治的是巴比伦，以保存原文的表达张力。
theological_decisions:
- issue: 巴比伦兴盛与锡安受辖制之间是否存在神意上的因果关系
  choice: 以连续反问“是因此才……吗”呈现以斯拉的质疑
  alternative: 断言巴比伦因行为更好而统治锡安
  rationale: 原文的numquid及整体语境构成修辞疑问，并未确认这种因果解释。
- issue: 谁辖制锡安
  choice: 采用无施事的“受辖制”
  alternative: 译作“巴比伦辖制锡安”
  rationale: 拉丁文本未在第二分句明确指出施事者；避免把语境中的推断直接写入正文。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“那时，我心里说”保留叙事语气；两个反问句简洁明白。脚注标记已在正文中以[a]标出。
