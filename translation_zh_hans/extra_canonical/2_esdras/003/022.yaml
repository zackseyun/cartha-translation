  rationale: 以“永久的状态”明确 permanens 的持续意义；删除未见于原文的让步连接，改用“与恶根同在”保留 cum 的伴随／共存关系及其句法歧义。末句维持“良善”与“邪恶”的概括性对照，并以“仍存留”表达 mansit。
