source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sunt. Et facta est permanens infirmitas, et lex in corde populi cum malignitate radicis, et discessit quod bonum est, et mansit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/022.yaml
  text: Thus weakness became permanent, and the law was in the heart of the people with the evil root; and what was good departed, and what was evil remained.
translation:
  language: zh_hans
  text: 于是，软弱成了永久的状态；律法在百姓心中，与恶根同在。良善离去了，而邪恶仍存留。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: permanens infirmitas
  choice: 软弱成了常态
  rationale: “infirmitas”可指软弱、无力；“permanens”表示持续存在。译作“成了常态”自然地表达其持久不去，而不额外限定为身体疾病。
- source_word: lex in corde populi
  choice: 律法虽在百姓心中
  rationale: 保留“律法”“心中”的核心意象；加入“虽”显明此句与恶根并存所形成的张力，但不解释这种并存的具体方式。
- source_word: cum malignitate radicis
  choice: 恶根也与之同在
  rationale: 拉丁语字面近于“与根的恶性同在”，上下文所指为“恶根”。“与之同在”保留 cum 的共存关系，避免误译成律法源于恶根。
- source_word: quod bonum est
  choice: 良善的
  rationale: 将中性的概括表达译为“良善的”，指一切良善之事，不擅自具体化。
- source_word: mansit
  choice: 留了下来
  rationale: 依据上下文补出与前句对称的主语“邪恶的”，并以“留了下来”表达持续存留。
theological_decisions:
- issue: 律法与恶根在百姓心中的关系
  choice: 表达二者同时存在而彼此对立
  alternative: 把恶根解释为律法本身的性质，或解释为律法主动压制恶根
  rationale: 原文只陈述律法在百姓心中并与恶根同在，没有说明因果、归属或胜负关系，应保留这种神学张力。
- issue: “软弱”的性质
  choice: 保留为概括性的“软弱”
  alternative: 具体译为原罪、败坏、疾病或死亡状态
  rationale: infirmitas 本身语义宽泛；上下文虽涉及人的道德困境，但本节没有明确采用这些更具体的神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号和前后对称句式呈现原文层层推进的节奏；“虽……也……”使律法与恶根并存的反差在中文中清楚可读，同时不消解原文的歧义。
