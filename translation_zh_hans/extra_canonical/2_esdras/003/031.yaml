  text: nothing to anyone about how this way should be abandoned[a]. Does Babylon do better than Zion?
translation:
  language: zh_hans
  text: 没有向任何人说明该怎样离弃这条道路。[a]难道巴比伦做得比锡安更好吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头在语法上承接上一节的“没有说明”。
    reason: 拉丁文在本节起首只有 nihil nemini quomodo debeat derelinqui via haec，谓语须由上一节末尾 et non significasti 补足；脚注说明跨节句法，避免误认为译文擅自增补。
lexical_decisions:
- source_word: derelinqui via haec
  choice: 离弃这条道路
  rationale: 保留被动不定式所表达的“这条道路应当被离弃”之意，并用现代汉语自然表达。
- source_word: facit meliora
  choice: 做得更好
  rationale: 直译其比较意义，不把含义限定为道德行为、成就或具体善行。
- source_word: Babylon / Sion
  choice: 巴比伦／锡安
  rationale: 采用现代中文圣经语境中通行的专名译法。
theological_decisions:
- issue: 巴比伦与锡安的比较所指为何
  choice: 保留概括性的“做得更好”
  alternative: “行得比锡安更好吗”或“所作所为胜过锡安吗”
  rationale: 拉丁文 facit meliora 本身没有明确限定比较的是道德行为、政治成就还是其他方面，因此不作神学性收窄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句按拉丁文跨节句法补足汉语所需的“说明”，但不补出主语，以尽量保存本节作为承接成分的形式；问句保留原文的反诘语气。
