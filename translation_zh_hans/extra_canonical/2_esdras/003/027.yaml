lexical_decisions:
- source_word: tradidisti
  choice: 交在
  rationale: 准确表达“交付、交出”的完成动作，并与“手中”自然搭配。
- source_word: civitatem tuam
  choice: 你的城
  rationale: 保留第二人称所属关系；“城”简洁、庄重，符合上下文所指的圣城。
- source_word: in manus inimicorum tuorum
  choice: 在你仇敌手中
  rationale: 保留原文“在……手中”的权势与控制意象；“仇敌”较“敌人”更符合经文语体。
theological_decisions:
- issue: 上帝主动交城与许可城被交出的张力
  choice: 你把你的城交在你仇敌手中
  alternative: 你任凭你的城落入仇敌手中
  rationale: 拉丁文 tradidisti 直接陈述“你交付了”，不宜以“任凭”弱化其主动语态；译文保留原文的神学张力。
translation_notes:
  register: 采用现代、简洁而庄重的经文语体；紧贴拉丁文句法，同时保持自然汉语表达。
