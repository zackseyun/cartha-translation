    issue: “同一个结局”对 in uno casus eorum 的对应不够准确。
    rationale: casus 可指命运、遭际；“结局”较易窄化为事件的最终结果。“一个命运”既保留单一、共同的表达，也不预断其具体性质。
  - severity: low
    issue: “遭遇”重复使比较句略显生硬。
    rationale: 原文以死亡和洪水“临到”不同对象构成平行；采用“临到”可更自然、简洁地保留这一结构。
