  to: 他们众人同遭一个命运：死亡怎样临到亚当，洪水也怎样临到这些人。
  rationale: 修订将“结局”改为“命运”，以较完整保留 casus 的语义，并以“临到”重现死亡与洪水分别临到不同对象的平行比较。仍保留“这些人”所呈现的指示与对照，不附加审判、罪责或救赎历史的解释。
