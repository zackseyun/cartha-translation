  text: 'And one fate came upon them all: as death came to Adam, so the flood came to these also.'
translation:
  language: zh_hans
  text: 他们众人同遭一个命运：死亡怎样临到亚当，洪水也怎样临到这些人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in uno casus eorum
  choice: 他们众人遭遇了同一个结局
  rationale: 拉丁文本措辞略显生硬，直指众人共同承受一种命运或结局；译作“同一个结局”既保留“uno”的单一、共同之意，也符合现代汉语表达。
- source_word: sicut Adac mors
  choice: 亚当怎样遭遇死亡
  rationale: 将简省的拉丁比较结构展开为自然的汉语，同时保留死亡临到亚当这一含义。
- source_word: sic et his diluuium
  choice: 这些人也照样遭遇洪水
  rationale: “his”指前述众人，译作“这些人”；“也照样”同时体现“sic”和“et”的对应与追加关系。
theological_decisions:
- issue: 亚当之死与洪水之间的类比性质
  choice: 保留平行比较，不说明二者在罪责、审判方式或救赎历史上的具体关系
  alternative: 将其解释为同一种神圣审判或同一罪罚
  rationale: 原文只陈述死亡临到亚当、洪水临到这些人的对应关系，并未进一步界定其神学机制；译文不应替原文消除这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“遭遇”重复出现，以清楚呈现原文两项平行关系；全句不添加原文未明说的因果或神学解释。
