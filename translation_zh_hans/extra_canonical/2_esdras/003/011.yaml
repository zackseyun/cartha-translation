revisions:
- from: 但你从他们中留下了一个人，就是挪亚和他全家；所有的义人都从他而出。
  to: 但你从他们中留下了一个——就是挪亚和他的全家；所有义人都出自他。
  rationale: 修订仅改善汉语同位结构和现代语感。“一个”仍对应 unum ex his；“挪亚和他的全家”仍对应 Noe cum domo sua；“所有义人都出自他”保留 ex eo iustos omnes 所表达的来源关系及其全称范围，未将其改释为“他的后裔全都是义人”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:04:22Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了上帝留下挪亚一家、并以挪亚为后续义人之来源的基本意思。惟“一个人，就是挪亚和他全家”在汉语中将单数“一个人”与“全家”直接并列，逻辑和句法略显别扭。
  naturalness: “从他而出”可懂，但在现代标准汉语中，“出自他”更自然，也同样保留后裔／来源的简洁表达。以破折号引出同位说明，可避免“一个人”和“全家”的表面冲突。
  terminology: “挪亚”“义人”均为合宜且一致的圣经汉语用语。“他的全家”准确表达 cum domo sua 的家属意义。
  issues:
  - severity: low
    issue: “一个人，就是挪亚和他全家”搭配不够自然。
    rationale: 拉丁文 unum 与 Noe cum domo sua 的表述本身带有“一个〔存留者〕，即挪亚连同其家”的压缩性；汉语若明确说“一个人”，随后再包括“全家”，会造成轻微的数目与指称不协调。
  - severity: low
    issue: “从他而出”较为书面且略显生硬。
    rationale: “出自他”是现代汉语中表达后裔或来源关系的自然措辞，且不额外解释原文。
  revised_text: 但你从他们中留下了一个——就是挪亚和他的全家；所有义人都出自他。
