  yaml_path: translation/extra_canonical/2_esdras/003/011.yaml
  text: But you left one of them, Noah with his household; from him came all the righteous.
translation:
  language: zh_hans
  text: 但你从他们中留下了一个——就是挪亚和他的全家；所有义人都出自他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dereliquisti
  choice: 你……留下了
  rationale: 直接表达拉丁文第二人称单数完成时，保留上帝使其存留之意。
- source_word: unum ex his
  choice: 从他们中……一个人
  rationale: 保留“众人中一个”的对比关系，并按现代汉语语序调整。
- source_word: Noe cum domo sua
  choice: 挪亚和他全家
  rationale: domus 在此指家属或全家，而非建筑物“房屋”。
- source_word: ex eo
  choice: 从他而出
  rationale: 保留来源或后裔关系；不增补原文未明说的“繁衍”等解释。
- source_word: iustos omnes
  choice: 所有的义人
  rationale: 依拉丁文保留“义人”这一伦理与神学用语及 omnes 的全称范围。
theological_decisions:
- issue: “所有的义人”与挪亚的关系
  choice: 译作“所有的义人都从他而出”
  alternative: “从他而出的全是义人”
  rationale: 拉丁语词序更自然地支持 iustos omnes 为主语性成分，即“所有义人”皆源自挪亚；所选译法也与上下文所述洪水后人类出自挪亚一家相符，同时不把意思改成其后裔全都为义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是”对应同位说明 id Noe；分号呈现原句后半部的结果或来源关系。
