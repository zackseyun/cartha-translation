  text: 这事持续了许多年。住在城里的人离弃了这城，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est hoc annis multis
  choice: 这样的事持续了许多年
  rationale: 按拉丁文直译近于“这事发生了许多年”，现代汉语略显生硬；译作“持续了许多年”自然地表达该情形延续多年，同时不增添原文没有的道德判断。
- source_word: dereliquerunt
  choice: 离弃了
  rationale: 保留该动词“撇下、离弃”的力度，不误译为“犯罪”；依上下文补出省略的宾语“这城”。
- source_word: qui habitabant civitatem
  choice: 城里的居民
  rationale: 以自然简洁的现代汉语表达“那些居住在城里的人”。
theological_decisions:
- issue: dereliquerunt是否含有犯罪之意
  choice: 离弃了这城
  alternative: 犯了罪
  rationale: 拉丁文只表达离弃或撇下，并未明说犯罪；译文不加入原文没有的神学或道德判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句末保留逗号，以反映本节在现存句法中尚未结束，并与后文衔接。
