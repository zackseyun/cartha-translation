id: 2ES.3.33
reference: 2 Esdras 3:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quarum merces non conparuit neque labor fructificavit? pertransiens enim pertransivi in gentibus, et vidi abundantes eas et non memorantes mandatorum tuorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/033.yaml
  text: Yet their reward has not appeared[a], nor has their labor borne fruit. For I have passed through the nations and seen them prospering, though they do not remember your commandments.
translation:
  language: zh_hans
  text: 可是，这些支派的报偿并未显现，他们的劳苦也没有结出果实。因为我走遍列国，看见他们富足兴旺[a]，却不记念你的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看见他们生活富裕”。
    reason: 拉丁文 abundantes 表示处于丰盛、富足的状态，既可侧重物质富裕，也可较广义地表达兴旺。
lexical_decisions:
- source_word: merces
  choice: 报偿
  rationale: 保留劳动所得回报或奖赏的语义，并与下文“劳苦”相呼应。
- source_word: labor fructificavit
  choice: 劳苦……结出果实
  rationale: 依照拉丁文的结果隐喻直译，同时符合现代汉语表达。
- source_word: pertransiens enim pertransivi
  choice: 因为我走遍
  rationale: 用“走遍”自然传达同根词重复所加强的遍历、亲自察看之意，避免生硬复叠。
- source_word: abundantes
  choice: 富足兴旺
  rationale: 该词在此表示列国处于丰盛、昌盛的状态；双词表达兼顾物质富足与整体繁荣。
- source_word: non memorantes
  choice: 不记念
  rationale: 保留“没有把诫命放在心上、加以遵守”的圣经语域，不把含义收窄为单纯遗忘。
theological_decisions:
- issue: 以色列各支派未得报偿与不守诫命的列国反而兴旺之间的张力
  choice: 直接并列两者，不补充因果解释
  alternative: 把列国兴旺解释为暂时现象，或把以色列的报偿限定为来世
  rationale: 原文提出义人受苦、列国兴盛的神义论张力，却没有在本节作出解释；译文不应预先化解。
- issue: 首句问号的句法作用
  choice: 按承接上文的陈述句处理
  alternative: 译作独立反问句：“他们的报偿岂没有显现……吗？”
  rationale: 拉丁文问号很可能收束始于上文的长问句；本节内部的内容语义上是明确的否定陈述。这样处理也与经审校的英文咨询层一致，同时不改变命题内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这些支派”承接上文，避免中文代词所造成的指代含混；“报偿”“劳苦”“记念诫命”保留经文语域，但整体句法保持普通读者易懂。
