id: 2ES.3.8
reference: 2 Esdras 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et ambulauit unaquaeque gens in uoluntate sua, et impie agebant coram te et spernebant, et tu non prohibuisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/008.yaml
  text: And each nation walked according to its own will[a], and acted impiously before you and despised you, and you did not hinder them.
translation:
  language: zh_hans
  text: 各国都随从自己的意愿而行[a]，在你面前作恶，藐视你；你却没有阻止他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在自己的意愿中行走”。
    reason: 说明拉丁文 in uoluntate sua 的字面形式，并保留“行走”这一圣经惯用意象。
lexical_decisions:
- source_word: ambulauit
  choice: 而行
  rationale: 保留圣经语体中“行走”表示生活行事的意象，同时与“随从自己的意愿”组合成自然的现代汉语。
- source_word: unaquaeque gens
  choice: 各国
  rationale: 准确表达“每一个民族／国家”；此处泛指各族群，简洁译作“各国”符合上下文和现代汉语。
- source_word: in uoluntate sua
  choice: 随从自己的意愿
  rationale: 既传达按自身意志行事的含义，又避免生硬直译为“在自己的意愿中”。
- source_word: impie agebant
  choice: 作恶
  rationale: 表示不敬虔、邪恶地行事；“作恶”通俗庄重，且适合其在神面前的伦理与宗教语境。
- source_word: spernebant
  choice: 藐视你
  rationale: 保留对神轻蔑、拒斥的强烈含义。
- source_word: non prohibuisti eos
  choice: 你却没有阻止他们
  rationale: 直接保留神未加制止这一神学张力，不将其解释为许可、容忍或遗弃。
theological_decisions:
- issue: 神没有阻止列国作恶
  choice: 你却没有阻止他们
  alternative: 你任凭他们如此
  rationale: 拉丁文只说神没有禁止或阻止他们；“任凭”会进一步解释神的作为与意图，因此不采用，以保留原文张力。
- issue: 列国按自身意愿而行
  choice: 随从自己的意愿而行
  alternative: 任意而行
  rationale: 所选译法明确保留 sua（自己的）和 uoluntas（意愿），不额外加入“顽梗”等原文未明说的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“随从自己的意愿而行”兼顾拉丁文结构与自然汉语；分号突出人的悖逆与神未阻止之间的张力。
