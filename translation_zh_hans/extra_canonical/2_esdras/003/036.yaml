  text: homines quidem per nomina invenies servasse mandata tua, gentes autem non invenies.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/036.yaml
  text: Men indeed, by name, you may find who have kept your commandments, but nations you will not find.
translation:
  language: zh_hans
  text: 你固然能逐名找出遵守了你诫命的人，却找不出一个遵守你诫命的民族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homines
  choice: 一些……人
  rationale: 这里与后面的“民族”形成个人与群体的对照；汉语补出“一些”，自然表达可找到个别人的含义。
- source_word: quidem
  choice: 确实
  rationale: 保留让步兼强调语气，并与后面的“却”构成自然对应。
- source_word: per nomina
  choice: 有名有姓
  rationale: 按字面是“凭名字／逐名”；此处表示可以具体点名、辨认出个别人。“有名有姓”比“按名字”更符合现代汉语，同时不理解为“著名”。
- source_word: servasse mandata tua
  choice: 遵守了你诫命
  rationale: 以完成体“了”反映拉丁文完成不定式所表达的既成遵守行为。
- source_word: gentes
  choice: 民族
  rationale: 保留与个人相对的整体族群概念；语境中并非单纯指政治国家。
- source_word: non invenies
  choice: 找不到一个这样的民族
  rationale: 补入“一个这样的”明确承接“遵守了你诫命”，避免汉语误解为根本找不到民族，同时不改变原意。
theological_decisions:
- issue: 经文是在断言无人守诫命，还是没有整个民族守诫命
  choice: 保留“个别人”与“整个民族”的对照
  alternative: 译作“你找不到外邦人”
  rationale: homines 与 gentes 构成个体和群体的对比；本句承认可以点名找到守命令的人，却否定能找到作为整体如此行的民族。把 gentes 专门解释为“外邦人”会过度限定其含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有名有姓”在这里指可具体点名的人，并非“知名人士”；“这样的”使省略的谓语在汉语中清楚可辨。
