  text: Factum est autem cum venissem huc, et vidi impietates quorum non est numerus, et delinquentes multos vidit anima mea hoc tricesimo anno. et excessit cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/029.yaml
  text: But when I came here and saw impieties beyond number[a], my soul saw many sinners in this thirtieth year, and my heart overflowed.
translation:
  language: zh_hans
  text: 可是，当我来到这里，看见不敬虔的事多得数不清；在这第三十年，我的心灵看见许多犯罪的人，我的心便承受不住了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心便昏厥了。”拉丁语此处也可指内心因震惊而失去力量或失去常态。
    reason: 说明excessit cor meum这一表达的语义幅度，并保留其究竟指不堪承受、昏厥还是心神失常的含混性。
lexical_decisions:
- source_word: impietates
  choice: 不敬虔的事
  rationale: 保留拉丁词对不虔、不敬与邪恶行为的宗教伦理色彩，同时避免擅自补出原文未明说的对象。
- source_word: delinquentes
  choice: 犯罪的人
  rationale: 该词指越轨、犯错或犯罪者；此处用“犯罪的人”与前面的行为名词区分，并符合经文语域。
- source_word: anima mea
  choice: 我的心灵
  rationale: 保留原文以“我的心灵”作观看主体的强调表达，不把它完全平化为普通的“我”。
- source_word: excessit cor meum
  choice: 我的心便承受不住了
  rationale: 这是描述内心因所见之事而不堪承受的惯用表达；如此译法比字面的“我的心越出了”自然，也不采用缺乏语境支持的“满溢”。
theological_decisions:
- issue: impietates是否明确译成对上帝的悖逆
  choice: 不敬虔的事
  alternative: 悖逆上帝的事
  rationale: 拉丁词带有宗教含义，但本句未明说对象；译文保留这种含义而不额外补出“上帝”。
- issue: excessit cor meum所表达的心理状态
  choice: 我的心便承受不住了
  alternative: 我的心满溢了／我的心惊骇不已
  rationale: 原文可以表达心神失常、昏厥或因震惊而不堪承受；正文采用范围较宽的自然说法，并以脚注说明其他可能理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“就在这第三十年”保留原文的时间强调；“我的心灵又看见”刻意保留原文第二次使用“看见”以及以“心灵”为主体的修辞，虽略带古雅，但仍可理解。
