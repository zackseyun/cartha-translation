id: 2ES.3.7
reference: 2 Esdras 3:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et huic mandasti diligentiam tuam ; et praeteriit eam, et statim instituisti in eum mortem et in nationibus eius, et natae sunt ex eo gentes et tribus, populi et cognationes, quorum non est numerus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/007.yaml
  text: And to him you gave your command; but he transgressed it, and at once you appointed death for him and for his descendants, and from him were born nations and tribes, peoples and clans, without number.
translation:
  language: zh_hans
  text: 你把你的命令交给他；他却违背了。你就立刻定下死亡，临到他和他的后裔。从他生出了不可胜数的邦国、支派、民族和宗族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mandasti diligentiam tuam
  choice: 把你的命令交给他
  rationale: 依上下文将较为特殊的拉丁语表达理解为上帝交付的命令；不加入“唯一”等原文没有明说的限定。
- source_word: praeteriit eam
  choice: 违背了
  rationale: 此处指越过、违反所交付的命令；“违背”在现代汉语中自然，并保留道德性的含义。
- source_word: instituisti ... mortem
  choice: 定下死亡
  rationale: 保留 instituisti 所表达的设立、定下之意，避免改写成更具解释性的“判处死刑”。
- source_word: in eum ... et in nationibus eius
  choice: 临到他和他的后裔
  rationale: nationibus eius 字面近于“他的诸族/后代”；结合随后列举由他而生的群体，译作“后裔”较清楚。
- source_word: gentes et tribus, populi et cognationes
  choice: 邦国、支派、民族和宗族
  rationale: 用四个有区别但语义相近的群体称谓对应原文的并列铺陈，保留其累积效果。
- source_word: quorum non est numerus
  choice: 不可胜数
  rationale: 自然、庄重地表达“其数无法计量”。
theological_decisions:
- issue: 死亡的对象与性质
  choice: “定下死亡，临到他和他的后裔”
  alternative: “判定他和他的后裔都必死”
  rationale: 原文说死亡被设立并临到他们，没有进一步界定为肉体死亡、属灵死亡或刑罚的全部范围，因此译文不替原文消除这种张力。
- issue: mandasti diligentiam tuam 的含义
  choice: “把你的命令交给他”
  alternative: “吩咐他谨慎遵守”
  rationale: diligentia 本身可涉及勤谨、责任或受托之事，但上下文及代词 eam 指向一项可被违背的要求；采用“命令”而不扩展具体内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用短句呈现违命、死亡与人类繁衍之间的推进关系；不增添原文未明确表达的教派性解释。
