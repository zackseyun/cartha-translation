  text: whose name was Abraham. And you loved him, and revealed to him
translation:
  language: zh_hans
  text: 他名叫亚伯拉罕。你爱他，并向他启示了
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nomen erat Abraham
  choice: 他名叫亚伯拉罕
  rationale: 按现代汉语自然表达译出“名字是亚伯拉罕”，并承接上文所指的人。
- source_word: dilexisti eum
  choice: 你爱他
  rationale: 直接保留第二人称对上帝的陈述和完成时语义。
- source_word: demonstrasti ei
  choice: 向他启示了
  rationale: demonstrasti 在此可指使人看见或显明；“启示”符合宗教语境，也保留原文未说明启示内容的开放性。句末“了”提示动作已发生，同时保留经文在此处未完的衔接感。
theological_decisions:
- issue: 未明说启示的内容
  choice: 不补出宾语，译作“向他启示了”
  alternative: 向他显明了某事／向他启示了时代的终局
  rationale: 所给拉丁文本止于 demonstrasti ei，没有提供启示内容；不从其他文本传统补入“时代的终局”等材料。
- issue: 是否加入“惟独”或秘密、夜间等限定
  choice: 不加入任何限定语
  alternative: 惟独向他秘密地在夜间启示
  rationale: 这些成分在所给拉丁原文中不存在，加入会超出源文证据。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“他名叫”比直译“他的名字是”更流畅；末句依源文保持未完状态，以便与下一节或后续残句衔接。
