  yaml_path: translation/extra_canonical/2_esdras/003/035.yaml
  text: Or when have those who dwell on the earth not sinned in your sight? Or what nation has so kept your commandments?
translation:
  language: zh_hans
  text: 又有何时，住在地上的人未曾在你面前犯罪呢？又有哪个民族曾如此遵守你的诫命呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aut quando
  choice: 又有什么时候……呢？
  rationale: 保留原文反问语气，并以现代汉语自然表达。
- source_word: qui habitant terram
  choice: 住在地上的人
  rationale: 贴近拉丁文定语结构，指世上的居民，不额外限定范围。
- source_word: in conspectu tuo
  choice: 在你面前
  rationale: 保留“在你看来并受你鉴察”的空间性表达及审判意味。
- source_word: quae gens
  choice: 哪一个民族
  rationale: gens在此指民族或邦国；“民族”较为自然，也不把问题局限于政治国家。
- source_word: sic observavit mandata tua
  choice: 如此遵守了你的诫命
  rationale: 保留sic“如此”的承接和强调作用；observavit译为“遵守”，mandata译为传统且清楚的“诫命”。
theological_decisions:
- issue: 反问是否明说人人都犯罪
  choice: 保留反问形式
  alternative: 直陈“住在地上的人都在你面前犯过罪”
  rationale: 原文以两个反问表达普遍犯罪与无人完全守命令的张力；不将其改写为系统性教义陈述。
- issue: sic的语义指向
  choice: 译作“如此”
  alternative: 译作“这样完全地”或省略
  rationale: 原文没有明说“完全”，增译会强化特定神学解读；保留“如此”维持其可能指前文标准或强调程度的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；两个“又有……”保持原句平行结构和诘问力度。无须脚注。
