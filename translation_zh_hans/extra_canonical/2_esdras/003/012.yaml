source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum coepissent multiplicari qui habitabant super terram, et multiplicauerunt filios et populos et gentes multas, et coeperunt iterato impietatem facere plus quam priores.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/012.yaml
  text: And it happened that when those who lived on the earth began to multiply, they multiplied children and peoples and many nations, and they began again to act impiously, more than those before them.
translation:
  language: zh_hans
  text: 后来，住在地上的人开始增多；他们的儿子、众民和许多民族也增多起来。他们又开始行不敬虔的事，比先前的人更甚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est
  choice: 后来
  rationale: 这是拉丁叙事推进语。译为“后来”符合现代汉语叙事习惯，又不额外强化因果关系。
- source_word: qui habitabant super terram
  choice: 住在地上的人
  rationale: 贴近原文，并保留“地上”这一空间表达。
- source_word: multiplicari / multiplicauerunt
  choice: 开始增多／也增多起来
  rationale: 保留原文同一词根的重复；后句以“他们的儿女、族群和许多邦国”为并列主语，避免把动词具体化为原文没有明说的“生育”。
- source_word: filios et populos et gentes multas
  choice: 儿女、族群和许多邦国
  rationale: “儿女”对应 filios 的语境性复数；populos 译作“族群”；gentes 可指民族或国家共同体，此处用“邦国”与前项区分，同时保留古代叙事语感。
- source_word: impietatem facere
  choice: 行不敬虔的事
  rationale: 表达对上帝缺乏敬畏并付诸行为的含义，不将其泛化为单纯的“作恶”。
- source_word: plus quam priores
  choice: 比先前的人更甚
  rationale: 保留 priores 所指对象未完全明确的特点，不擅自限定为祖先或某一代人。
theological_decisions:
- issue: impietas 的宗教与伦理含义
  choice: 不敬虔
  alternative: 邪恶／不虔诚
  rationale: “不敬虔”兼顾对上帝的悖逆和由此表现出的行为，也避免只作一般伦理判断。
- issue: priores 的比较对象
  choice: 先前的人
  alternative: 他们的先祖／以前的世代
  rationale: 原文只用比较级名词化形式 priores，没有明确指定亲属关系或世代范围，因此保持开放。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号划分人口增长与再次不敬虔两个叙事层次；保留“增多”的词语复现和末句比较关系，不为原文补入具体因果或生育动作。
