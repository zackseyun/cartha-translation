  text: And I said, “O Lord who rules, did you not speak from the beginning, when you formed the earth—and this you did alone—and commanded the dust
translation:
  language: zh_hans
  text: 我说：“掌权的主啊，你岂不是从起初曾说过：当你塑造大地时，这事是你独自成就的；你又吩咐尘土——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: 统管万有的主啊
  rationale: 保留呼格和掌权、统治的含义，同时避免生硬地重复译作“主宰者主啊”。“万有”是为使汉语称谓自然所作的语境性补足。
- source_word: ab initio
  choice: 从起初
  rationale: 准确体现拉丁文所表达的起始点，与“在起初”相比，更贴近原文介词 ab。
- source_word: plasmasti
  choice: 塑造
  rationale: 该词有如塑匠塑形的具体意味；“塑造”既保留意象，也适用于上帝造地的庄重语境。
- source_word: terram
  choice: 大地
  rationale: 此处创造语境中的 terra 指土地或大地；译作“大地”自然，并不强行限定为现代意义的行星。
- source_word: et hoc solus
  choice: 而且是你独自完成的
  rationale: 原句较为压缩，hoc 的具体所指略有含混；用“这……完成”承接塑造大地，同时保留“唯独你”的强调。
- source_word: imperasti pulueri
  choice: 你又吩咐尘土
  rationale: imperare 可指命令、吩咐；“吩咐”符合上帝向尘土发令的语境，也较适合现代中文经文语体。
theological_decisions:
- issue: 上帝独自创造的强调
  choice: 而且是你独自完成的
  alternative: 那时只有你存在
  rationale: solus 在句法上修饰主语“你”，强调该行动由上帝独自施行；不将其扩展为关于当时绝无其他存在者的明确命题。
- issue: dixisti 与后续 imperasti 的关系
  choice: “发了话吗”后另译“又吩咐”
  alternative: 将两者合并为一次发令
  rationale: 保留原文两个动词及其并列张力，不预先判定前一个“说”是否完全等同于后一个“吩咐尘土”。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。原文在“尘土”处句意未完，因此以破折号收尾，提示本节直接延续到下一节；不擅自补足命令内容。
