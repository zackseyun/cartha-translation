    rationale: 原文为“did you not speak from the beginning, when …”，其中 ab initio 与 quando 引出的创造行为紧密相关。现译用“发了话”“那时”拆开后，时序和句法联系较弱；“就”也可能误示持续动作。
  - severity: low
    issue: “统管万有”含有原文未明确表达的宾语。
    rationale: dominator 表示统治者、掌权者；虽不构成实质性误译，但“万有”是解释性补足。以“掌权的主”可更贴近原文并保持中文庄重自然。
