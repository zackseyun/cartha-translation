  yaml_path: translation/extra_canonical/2_esdras/003/003.yaml
  text: And my spirit was greatly stirred[a], and I began to speak fearful words to the Most High,
translation:
  language: zh_hans
  text: 我的灵大受激荡，我就开始战战兢兢地向至高者说话，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uentilatus est
  choice: 大受激荡
  rationale: 该词本义有被扬动、翻搅之意；此处描述内在的灵受到强烈触动，“大受激荡”既保留其力度和动态意象，也符合现代汉语表达。
- source_word: spiritus meus
  choice: 我的灵
  rationale: 直译拉丁文，保留“灵”可能指人的内在生命、心神或精神状态的语义空间。
- source_word: altissimum
  choice: 至高者
  rationale: 采用尊称形式，准确表达最高者，并维持经文庄重语体。
- source_word: uerba timorata
  choice: 怀着敬畏……说话
  rationale: timorata 修饰所说的话，表示话语带着惧怕、战兢或敬畏；汉语若直译“说惧怕的话”容易被理解为话语内容令人害怕，因此转化为说话时的态度，同时不把它弱化为一般焦虑。
theological_decisions:
- issue: timorata 所表达的是惧怕、敬畏还是焦虑
  choice: 怀着敬畏
  alternative: 怀着惧怕；说出战兢的话
  rationale: 面对“至高者”的语境使该词兼具畏惧与敬畏色彩。“怀着敬畏”自然庄重，并保留人在神面前战兢发言的张力，而不限定为心理焦虑。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我的灵”保留原文的人论表达；“大受激荡”呈现 uentilatus est 的强烈动态感。句末逗号依照所给经节作为后续话语的引入。
