  yaml_path: translation/extra_canonical/2_esdras/003/030.yaml
  text: For I saw how you endure those who sin and have spared those who act impiously[a], but have destroyed your people and preserved your enemies, and have not made it clear
translation:
  language: zh_hans
  text: 因为我看见你怎样容忍那些犯罪的人，又饶过了那些行不敬虔之事的人[a]；你却毁灭了你的子民，保全了你的仇敌，也没有显明——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又饶过那些行不敬虔之事的人；你却毁灭了你的子民，保全了你的仇敌。”
    reason: 拉丁语连接词与标点容许略有不同的修辞分组；脚注保留这一断句可能。
lexical_decisions:
- source_word: sustines
  choice: 容忍
  rationale: 保留现在时所表达的持续状态，并自然传达上帝暂且忍受犯罪者之意。
- source_word: peccantes
  choice: 那些犯罪的人
  rationale: 按拉丁语现在分词直译，避免把它抽象化为“罪”。
- source_word: pepercisti
  choice: 宽恕了
  rationale: 以完成体表达过去已经施行的饶恕；“宽恕”在本语境中比单纯“不惩罚”更自然。
- source_word: impie agentibus
  choice: 行恶的人
  rationale: 表达不敬虔、悖逆上帝的行为，同时采用普通读者易懂的现代汉语。
- source_word: perdidisti
  choice: 毁灭了
  rationale: 保留完成性及强烈语义，指已经发生的毁灭行动。
- source_word: conservasti
  choice: 保全了
  rationale: 与“毁灭了”形成鲜明对照，并保留完成体。
- source_word: non significasti
  choice: 没有显明
  rationale: 原文在此戛然而止，宾语或内容未明；译文不补足后文或解释其所指。
theological_decisions:
- issue: 上帝对犯罪者与自己子民、仇敌的不同处置所构成的张力
  choice: 按原文直接保留质问式对照
  alternative: 通过补充因果或审判理由来调和这种张力
  rationale: 本节刻意呈现以斯拉困惑中的神学张力，译文不替作者作解释。
- issue: pepercisti 与后面两个完成时动词的关系
  choice: 译为“又宽恕了……；你却毁灭了……保全了……”
  alternative: 把 pepercisti 与后面的“却”并列理解为另一种断句
  rationale: 拉丁语连接关系容许不同的修辞分组；正文采用较自然的递进后转折结构，脚注保留另一种读法。
- issue: 末尾 non significasti 的未完成表达
  choice: 以破折号保留悬而未决的句尾
  alternative: 根据后续传统或语境补出“你没有说明什么”
  rationale: 现有拉丁语源文只到“也没有显明”，不可擅自增补宾语或内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。通过“容忍”与三个带“了”的动词保留拉丁语从现在时转向完成时的变化；末尾以破折号表现现存源文的突然中止。
