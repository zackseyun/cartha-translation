  - severity: low
    issue: “宽恕了”可能把 pepercisti 窄化为赦罪。
    rationale: parcere 的基本语义为饶过、宽免、留存；在本节与“毁灭了／保全了”的处境对照中，“饶过”较为中性并贴合原文。
