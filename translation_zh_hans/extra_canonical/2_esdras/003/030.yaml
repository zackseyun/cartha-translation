revisions:
- from: 因为我看见，你怎样容忍那些犯罪的人，又宽恕了行恶的人[a]；你却毁灭了你的子民，保全了你的仇敌，也没有显明——
  to: 因为我看见你怎样容忍那些犯罪的人，又饶过了那些行不敬虔之事的人[a]；你却毁灭了你的子民，保全了你的仇敌，也没有显明——
  rationale: 修订仅提高两处词义精确度，并微调语序。“饶过”对应 pepercisti，且继续以“了”表达完成动作；“行不敬虔之事的人”保留 impie 的宗教伦理维度。其余对照、时态以及未完成句尾均维持原稿处理。
