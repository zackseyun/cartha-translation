  yaml_path: translation/extra_canonical/2_esdras/010/008.yaml
  text: She has been humbled; mourn most bitterly. And now[a], since we all mourn and are sad, since we are all grieved—but you
translation:
  language: zh_hans
  text: 她受了屈辱；你们要痛切哀悼。如今[a]，既然我们众人都在哀悼，而你们也满怀悲伤；既然我们全都忧愁，而你却……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存拉丁文本在此的人称不整齐：lugete（“你们要哀悼”）和 tristes estis（“你们是悲伤的”）均为复数第二人称，但前后为第一人称复数及句末单数第二人称。有人按上下文推定前二者原为 luget（“她哀悼”）和 tristes sumus（“我们悲伤”）；按此推定可译作：“她受了屈辱；她痛切哀悼。如今，既然我们众人都在哀悼，也都满怀悲伤；既然我们全都忧愁，而你却……”
    reason: 说明现存文本的人称不整齐及常见的语境性订正，同时使替代译文的人称与所说明的推定读法一致。
lexical_decisions:
- source_word: humiliata est
  choice: 她受了屈辱
  rationale: 保留完成被动式及其受辱、降卑之意；不改写为“她哀悼”。
- source_word: lugete ualidissime
  choice: 你们要极其悲痛
  rationale: 按现存拉丁文本保留复数命令式 lugete；ualidissime 在此加强哀痛的程度。
- source_word: tristes estis
  choice: 也都满怀悲伤
  rationale: 按现存文本保留第二人称复数，但汉语借“众人……都”自然承接；此处抄本措辞与上下文的人称并不整齐。
- source_word: tu
  choice: 而你却……
  rationale: 保留单数第二人称和潜在对比语气；原文在此中断，不补入下一句内容。
theological_decisions:
- issue: 哀悼者究竟是受辱的“她”还是听者
  choice: 按现存文本译为“她受了屈辱；你们要极其悲痛”
  alternative: “她极其悲痛”
  rationale: 现有拉丁文明确写作 humiliata est 与复数命令式 lugete；虽有人据语境推测文本讹误，正文不应无明证地订正。
- issue: 句末残缺及对比关系
  choice: 以“而你却……”保留未完句
  alternative: 补作“而你却为一个儿子忧愁”或改成问句
  rationale: 所给原文只到 tu；不从后文或旧译补足，也不加入原文没有的疑问语气。
translation_notes:
  register: 采用庄重而现代的普通话。“受了屈辱”准确传达被动意义；句末用省略号忠实呈现所给拉丁片段的突然中断。
