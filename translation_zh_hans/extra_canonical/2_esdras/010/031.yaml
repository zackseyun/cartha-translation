  text: 'pedes meos et dixit mihi: Quid tibi est, et quare conturbaris, et quid conturbatus est intellectus tuus et sensus cordis tui ? et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/031.yaml
  text: and said to me, “What is the matter with you? And why are you troubled? And why are your understanding and the perception of your heart troubled?”
translation:
  language: zh_hans
  text: 对我说：“你怎么了？为什么不安？为什么你的悟性和你心中的感知都陷入困扰？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi est
  choice: 你怎么了
  rationale: 这是现代汉语中自然、准确的问法，表达“你出了什么事／你怎么回事”。
- source_word: conturbaris
  choice: 这样不安
  rationale: 保留因受扰而不安的含义，也与下句同源词的译法有所区分，使中文自然。
- source_word: intellectus tuus
  choice: 你的悟性
  rationale: 对应理解、领悟的能力；“悟性”简洁庄重，又不额外限定为理性或智力。
- source_word: sensus cordis tui
  choice: 你心里的知觉
  rationale: 较形式地保留“心”与“知觉”的组合，不把它窄化为情感、思想或良知。
- source_word: conturbatus est
  choice: 受到搅扰
  rationale: 保留与前一问 conturbaris 的词义呼应，并自然涵盖并列的“悟性”和“心里的知觉”。
theological_decisions:
- issue: intellectus 与 sensus cordis 的关系
  choice: 保留为两个并列而相关的内在认识层面：“悟性”和“心里的知觉”
  alternative: 合并为“心思意念”或解释为“理智和情感”
  rationale: 拉丁文明确并列两项；合并或按现代心理学二分会消除原文的张力并加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。所给拉丁文本开头的 pedes meos 显然承接上一节句法，本节按英语审校层所划定的内容从 et dixit mihi 起译；末尾 et 亦为连接下一节的连词，不在本节中文中孤立呈现。
