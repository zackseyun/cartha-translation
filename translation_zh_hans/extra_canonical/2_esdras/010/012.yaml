  yaml_path: translation/extra_canonical/2_esdras/010/012.yaml
  text: But if you say to me, ‘My lament is not like the earth’s, because I have lost the fruit of my womb,’
translation:
  language: zh_hans
  text: 但如果你对我说：‘我的哀痛与大地的哀痛不同，因为我失去了腹中所生的孩子。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: planctus meus
  choice: 我的哀痛
  rationale: 既表达因丧失而有的深切悲伤，也保留与大地之哀痛相比较的含义。
- source_word: terrae
  choice: 大地的
  rationale: 按拉丁文属格直译，并结合上下文理解为“大地的哀痛”，避免将“大地”改释为居民或世界。
- source_word: fructum uentris mei
  choice: 腹中所生的孩子
  rationale: 保留“腹中所生”这一生育意象，同时明确所失去的是孩子，使现代读者自然理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留说话者与大地之间的比较，不额外解释其象征意义。拉丁文开头的“uno doles?”按上下文及英文本的经节划分视为上一节末尾，本节从“Si autem”起译。
