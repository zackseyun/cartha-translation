- from: “我在悲哀中生下他，在痛苦中将他产下；然而，大地按着大地的常道逝去，如今在其中的众人也同样逝去。”——
  to: “我在悲哀中生下他，在痛苦中将他产下；然而，大地按照大地的常道离去，如今在其中的众人也离去。”——
  rationale: 作两项轻微措辞修订：“离去”更贴近abiit，且避免把大地明确译成“消亡”；“按照”提升现代汉语的流畅度。保留原有句法处理：大地离去，现今在其上的众人也离去；不为残缺或歧义的拉丁句法补入额外的方式说明。
