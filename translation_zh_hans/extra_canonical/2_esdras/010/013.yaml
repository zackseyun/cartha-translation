  text: whom I bore with sorrows and brought forth with pains; but the earth, according to the way of the earth, goes away, as does the multitude now present in it’—
translation:
  language: zh_hans
  text: “我在悲哀中生下他，在痛苦中将他产下；然而，大地按照大地的常道离去，如今在其中的众人也离去。”——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quem
  choice: 他
  rationale: 拉丁文为阳性单数关系代词，承接上文所指的男性对象；汉语以“他”自然表达。
- source_word: cum meroribus ... cum doloribus
  choice: 在悲哀中……在痛苦中
  rationale: 保留两个介词短语的平行结构，并区分 meroribus 的哀伤与 doloribus 的生产痛苦。
- source_word: peperi ... genui
  choice: 生下……产下
  rationale: 两词语义相近，译文保留原文的重复加强；“产下”也凸显分娩语境。
- source_word: secundum uiam terrae
  choice: 按着大地的常道
  rationale: 直译为“按照大地的道路”不自然；“常道”表达大地所循的既定过程，同时不具体解释其所指。
- source_word: abiit
  choice: 逝去
  rationale: 原词基本义为“离去、过去”；此处涉及大地及其上的众人，“逝去”既自然又保留消逝意味。
- source_word: multitudo praesens
  choice: 如今……的众人
  rationale: praesens 表示目前存在、在场；结合 in ea，译为“如今在其中的众人”。
theological_decisions:
- issue: 大地与其中众人之消逝的关系
  choice: 大地逝去，其中的众人也同样逝去
  alternative: 把“众人”单独作为 abiit 的主语，或理解为众人按来时的方式离去
  rationale: 现存拉丁文句法不整齐，但 Terra 是 abiit 前最明确的主语；依照经审校的英文咨询层，将后面的 multitudo 理解为与大地一同逝去，避免加入原文没有的“怎样来就怎样去”。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语言。保留“悲哀／痛苦”和“生下／产下”的平行与加强效果；句末破折号显示本节话语仍与上下文相连。
