  text: noli facere sermonem hunc, sed consenti persuaderi – quid enim casus Sion – et consolare propter dolorem Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/020.yaml
  text: Do not say this[a], but consent to be persuaded—for how great is Zion’s downfall!—and be comforted because of Jerusalem’s sorrow.
translation:
  language: zh_hans
  text: 不要说这样的话；你要接受劝导——锡安的倾覆何等令人痛心！[a]——并要因耶路撒冷的悲痛而得安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句拉丁文省略谓语，语气可理解为感叹，也可能带有反问色彩。
    reason: 保留 quid enim casus Sion 的突兀省略句法和修辞语气，不把不甚自然的替代性释义写入正文。
lexical_decisions:
- source_word: noli facere sermonem hunc
  choice: 不要说这样的话
  rationale: 按拉丁语习惯表达处理；直译“不要作这话”不合现代汉语，“说这样的话”自然且准确。
- source_word: consenti persuaderi
  choice: 要肯受劝
  rationale: 保留 consenti 所含主动同意、愿意接受的意味，也体现 persuaderi 的被动含义。
- source_word: casus Sion
  choice: 锡安的倾覆
  rationale: casus 在此指锡安的败落、倾覆；“倾覆”兼具城邑毁灭和整体衰败的庄重语感。
- source_word: consolare propter dolorem Hierusalem
  choice: 要因耶路撒冷的悲痛而得到安慰
  rationale: 保留 propter 的因由关系及原文中“因悲痛而得安慰”的张力，不擅自改成“忘却”或“胜过”。
theological_decisions:
- issue: quid enim casus Sion 的突兀句法和修辞力度
  choice: 译作感叹：“锡安的倾覆是何等惨重！”
  alternative: 也可能按字面疑问理解为“锡安的倾覆又算什么呢？”或把该短语与前后句连读
  rationale: quid enim 后直接接名词短语，结构省略而突兀；结合上下文中个人哀痛与锡安灾难的对照，感叹读法最能呈现其修辞重点，但以脚注保留句法上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“肯受劝”比“同意被说服”自然，同时保留原文要求当事人主动接受劝告的意味；破折号呈现拉丁文中突然插入的感叹。
