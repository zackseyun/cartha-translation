  to: 不要说这样的话；你要接受劝导——锡安的倾覆何等令人痛心！[a]——并要因耶路撒冷的悲痛而得安慰。
  rationale: 修订避免以“惨重”固定原文未明确的程度，同时以“何等令人痛心”自然呈现 quid enim 的感叹性。调整末句为“并要……而得安慰”，保留命令语气及 propter 的因由关系。脚注保留原文句法与语气的不确定性，但删除会使锡安灾变显得无足轻重的“又算什么呢”式替代译法。
