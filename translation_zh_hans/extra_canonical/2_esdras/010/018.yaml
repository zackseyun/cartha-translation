lexical_decisions:
- source_word: non faciam
  choice: 我不这样做
  rationale: 拉丁文直译为“我不做”，所指承接上文；补入“这样”使现代汉语自然，同时不擅自明确具体行动。
- source_word: neque ingrediar civitatem
  choice: 也不进城
  rationale: 准确表达 ingrediar 的第一人称将来/意愿语气及 civitatem 的宾语，简洁自然。
- source_word: sed hic moriar
  choice: 我要死在这里
  rationale: 保留 sed 的转折和 hic 的地点强调；“我要”自然传达 moriar 在语境中的坚决意愿，而非单纯预测。
