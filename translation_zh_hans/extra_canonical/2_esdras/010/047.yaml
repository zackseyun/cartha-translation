  yaml_path: translation/extra_canonical/2_esdras/010/047.yaml
  text: And as for what she said to you[a], ‘I nourished him with toil,’ this was the dwelling of Jerusalem.
translation:
  language: zh_hans
  text: 至于她对你所说的：“我辛劳地养育了他”，这句话指的就是耶路撒冷有人居住的时期[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶路撒冷的居住状态”。拉丁文 habitatio Hierusalem 指居住或定居的状态，而非一所住宅。
    reason: 说明 habitatio 的状态性含义，并保留较贴近原文名词结构的译法。
lexical_decisions:
- source_word: nutrivi eum cum labore
  choice: 我辛苦地把他养大
  rationale: nutrivi 表示养育、抚养；cum labore 表示在劳苦中或费尽辛劳。“辛苦地把他养大”既自然，也保留长期劳苦养育的意味。
- source_word: habitatio Hierusalem
  choice: 耶路撒冷有人居住
  rationale: habitatio 在此主要指居住、定居的状态，而不是一所“住处”或建筑物；用“有人居住”可避免把它误解为耶路撒冷的一栋房屋，同时保留该短语与城市历史之间的对应。
- source_word: haec erat
  choice: 这指的是
  rationale: 本段是在解释异象中的话语所象征的对象；译为“这指的是”比机械的“这曾是”更符合现代汉语，并清楚表达解释关系。
theological_decisions:
- issue: 妇人养育儿子的陈述与耶路撒冷之间的象征关系
  choice: 以“这指的是”表达对应，不进一步说明儿子、养育年日或城市历史的具体神学含义
  alternative: 把句子解释性扩写为耶路撒冷被建立、受养育或其居民生活的某一特定时期
  rationale: 拉丁文本只明确建立象征对应，并未在本节内细分其历史或神学含义；不宜替原文消除其张力或添加特定解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“辛苦地把他养大”适合妇人谈论儿子的语境；“耶路撒冷有人居住”避免生硬的抽象名词，也避免将 habitatio 误读为建筑物。
