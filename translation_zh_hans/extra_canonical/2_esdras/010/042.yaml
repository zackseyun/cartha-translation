  text: 'non speciem mulieris uides, sed apparuit tibi ciuitas aedificari; Et quoniam enarrabat tibi de casu filii sui, haec absolutio est:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/042.yaml
  text: 'You no longer see the form of a woman[a], but a city appeared to you being built. And as for her telling you about the misfortune of her son, this is the interpretation:'
translation:
  language: zh_hans
  text: 你所看见的并非女人的形象[a]；向你显现的乃是一座正在建造的城。至于她向你讲述她儿子的遭遇，其解释如下：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你现在不再看见女人的形象，而是有一座正在建造的城向你显现。”
    reason: 保留英文审计轨迹所反映的、按上下文将否定理解为“现在不再”的替代译法；正文则不把该时间限定当作拉丁文的明示成分。
lexical_decisions:
- source_word: speciem mulieris
  choice: 一个女人的形象
  rationale: “speciem”在此指所显现、可见的外在形态；译作“形象”既贴近拉丁文，也与异象语境相称。
- source_word: ciuitas aedificari
  choice: 一座正在建造的城
  rationale: 保留被动不定式所表达的建造过程，不擅自补出建造者。
- source_word: casu filii sui
  choice: 她儿子的遭遇
  rationale: “casus”可指遭遇、变故或不幸；此处用较中性的“遭遇”保留其语义幅度，并由上下文说明具体所指。
- source_word: absolutio
  choice: 解释
  rationale: 在解释异象的语境中，该词指说明或解明其含义；“解释”自然清楚，也与后文引出释义的功能相符。
theological_decisions:
- issue: 女人与城的关系
  choice: 按异象由女人形象转为城的显现来表达，不明确断言二者本体关系
  alternative: 译成“女人就是这座城”
  rationale: 原文只对所见形态与城的显现作对照，并未在本句直接使用等同结构。
- issue: 儿子的casus所指
  choice: 译为较宽泛的“遭遇”
  alternative: 译为“死亡”或“不幸”
  rationale: 虽然上下文可能指儿子的死亡或灾祸，但本词本身更宽泛，不宜在此句中提前限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；“至于……这解释如下”保留原文转入异象释义的结构和句末引出下文的冒号。
