  yaml_path: translation/extra_canonical/2_esdras/010/046.yaml
  text: Three things Solomon built in the city and offered offerings; then it was that the barren woman bore a son. And what it told you, that
translation:
  language: zh_hans
  text: 所罗门在城中建造了三样东西，并献上祭物；就在那时，那不生育的妇人生了一个儿子。至于她对你所说的，就是——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句在原文中没有说完，内容接续下一节。开头的拉丁文句法也较难确定，直译近于“所罗门建造了三……城”；有些传统文本则将这里理解为时间表达。
    reason: 说明跨节未完句，并诚实标示开头现存拉丁文的语法与文本歧义。
lexical_decisions:
- source_word: tres
  choice: 三样东西
  rationale: 按现存拉丁文通常义译为不带明示名词的“三个／三样”，不采用较晚传统中“（三）千年以后”的读法。
- source_word: aedificauit Salomon ciuitatem
  choice: 所罗门在城中建造了
  rationale: 该短语在现存拉丁文中句法不规则；结合 tres 以及审校层的理解，将 ciuitatem 处理为地点关系，以保留“三样东西”为 aedificauit 的宾语。
- source_word: obtulit oblationes
  choice: 献上祭物
  rationale: 用现代汉语中自然且庄重的祭祀表达，保留动词与同根名词所表达的献祭行为。
- source_word: sterilis
  choice: 那不生育的妇人
  rationale: 以人物化表达对应阴性名词化形容词，避免带有贬义色彩的现代措辞。
- source_word: Et quod tibi dixit quoniam
  choice: 至于她对你所说的，就是——
  rationale: 这是引向下节内容的未完结构；用破折号保留句子悬而未完的特点。拉丁文 dixit 的隐含主语依上下文理解为那妇人。
theological_decisions:
- issue: “不生育的妇人”所生之子的象征意义
  choice: 仅按异象解释的话语直译，不在正文中指明其神学所指
  alternative: 将“儿子”直接解释为圣殿、耶路撒冷或某一特定救赎人物
  rationale: 本节本身尚未完成解释，提前确定象征对象会消除原文保留的叙事张力。
- issue: 开头数字短语的文本解释
  choice: 按所给 Bensly 拉丁文本 tres 译作“三样东西”
  alternative: 依传统版本译作“三千年以后”或其他时间表达
  rationale: 所给原文没有“千”或“以后”的对应词；不将传统扩展读法纳入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那不生育的妇人”承接前文异象人物；末尾以破折号显示原文 quoniam 引出的内容尚待下节完成。
