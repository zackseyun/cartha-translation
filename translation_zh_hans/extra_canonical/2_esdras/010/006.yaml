  text: In anger at her, I said, “Most foolish of all women, do you not see our mourning and what has happened to us?
translation:
  language: zh_hans
  text: 我对她发怒，说：“你是所有妇人中最愚昧的！难道你没有看见我们的哀痛，以及发生在我们身上的事吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iracundia ad eam
  choice: 我向她发怒
  rationale: 按上下文将拉丁文的“愤怒”表达为自然的现代汉语动作，同时保留怒气所指向的对象。
- source_word: Stulta super omnes mulieres
  choice: 你是所有妇人中最愚昧的
  rationale: super omnes在此表示最高程度的比较；译文既保留责备的强烈语气，也避免不自然的直译“愚昧超过所有妇人”。
- source_word: non
  choice: 难道……没有……吗
  rationale: 将拉丁文否定疑问词按汉语反问句式处理；本节所给拉丁文本在non之后截断，问句内容依据经审校的英语咨询层补足。
