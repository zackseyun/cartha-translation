  text: For because you were grieved from your soul, and because you suffer for her from your whole heart, he showed you the splendor of her glory and the beauty of her majesty. Therefore I told you to remain in
translation:
  language: zh_hans
  text: 因为你内心忧伤，又全心全意地为她受苦，他便向你显明了她荣耀的光辉和她威严的美丽。因此，我才吩咐你留在……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex animo contristatus es
  choice: 你从心灵深处为她忧伤
  rationale: 保留 ex animo 所表达的内在深度，并以自然的现代汉语表达 contristatus es；“为她”由后文语境补明，避免汉语指向含混。
- source_word: ex toto corde pateris pro ea
  choice: 全心为她受苦
  rationale: 贴近 ex toto corde 与 pateris pro ea 的结构，保留“受苦”而不弱化为单纯的同情或难过。
- source_word: claritatem gloriae eius
  choice: 她荣耀的光辉
  rationale: claritas 可指光辉、明亮或荣美；“荣耀的光辉”保留属格结构及庄重语体。
- source_word: pulchritudinem decoris eius
  choice: 她威仪之美
  rationale: decor 可涵盖美饰、尊荣与威仪；选择“威仪”以免与前面的“光辉”重复，同时保留其尊贵庄严的意味。
- source_word: Propterea enim dixi tibi ut maneres in
  choice: 因此，我才吩咐你留在……
  rationale: dixi tibi ut 在此具有指示或吩咐意味；原文止于介词 in，故以省略号明确保留残句状态，不擅自补足地点。
theological_decisions:
- issue: 显明者的身份
  choice: 使用“他”，不补作“至高者”
  alternative: 明确译作“至高者向你显明”
  rationale: 拉丁文本只有动词 ostendit 所含的第三人称主语，未在本节明说身份；保留代词可避免把上下文推断写进正文。
- issue: 因果关系的表达
  choice: 以“因为……又……，他便……”保留两个原因分句
  alternative: 改写为“至高者看见……所以……”
  rationale: 原文没有“看见”一词；直接呈现 quoniam… et quoniam… 的双重因由，更忠于来源，也不额外解释神如何知晓。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。保留原文的因果推进、第三人称主语及末尾残缺状态；用省略号提示本节在介词“in”后中断。
