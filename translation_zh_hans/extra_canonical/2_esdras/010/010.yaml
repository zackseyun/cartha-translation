  text: germinantium. Et ex ipsa initia omnes nacti, et alii ueniunt, et ecce pene omnes in perditionem ambulant et in exterminium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/010.yaml
  text: From her all have had their beginnings, and others come; and behold, nearly all walk to destruction and to extermination.
translation:
  language: zh_hans
  text: 众人都从她得了开端，另一些人也来到。看哪，几乎所有人都走向沉沦和灭绝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex ipsa
  choice: 从她
  rationale: 保留拉丁文阴性代词及其回指关系，不擅自以具体名词替代。
- source_word: initia omnes nacti
  choice: 众人都……得了开端
  rationale: 贴近“所有人获得起始”的表达，同时以现代汉语传达生命或存在由此开始之意。
- source_word: et alii veniunt
  choice: 后来的人也接踵而来
  rationale: alii 指其余、后来出现的人；“接踵而来”自然表达持续有人来到，但不额外限定其身份。
- source_word: in perditionem ambulant
  choice: 走向沉沦
  rationale: 保留 ambulant 的行走意象及 perditionem 所含走向败亡的意味。
- source_word: in exterminium
  choice: 灭绝
  rationale: 与“沉沦”有所区分，传达 exterminium 更彻底的消灭、除尽之义。
theological_decisions:
- issue: “她”的所指
  choice: 保留代词“她”
  alternative: 按上下文明确译作某一具体对象
  rationale: 本节所给拉丁文本仅有 ipsa；保留其语法性别与回指开放性，避免把解释写入正文。
- issue: perditio 与 exterminium 的关系
  choice: 并列译为“沉沦和灭绝”
  alternative: 合并为单一的“毁灭”
  rationale: 原文以两个不同名词并列，译文维持其语义张力，不将二者压缩为一个概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留 ecce 的提示和强调作用；句式简洁，适合经文朗读。篇首 germinantium 看来是上一句残留的词尾，未纳入本节正文。
