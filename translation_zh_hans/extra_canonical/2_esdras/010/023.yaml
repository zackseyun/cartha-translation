  yaml_path: translation/extra_canonical/2_esdras/010/023.yaml
  text: And what is greatest of all[a][23], the seal of Zion—for now she has been unsealed from her glory and handed over into the hands of those who hate us.
translation:
  language: zh_hans
  text: 而最重大的，是锡安的印记；如今她已从自己的荣耀中被解封[a]，被交在那些恨我们的人手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她如今已失去了自己的荣耀”或“她如今已被剥夺了自己的荣耀”。“锡安的印记”一语难解，可能指锡安独有的荣耀、蒙认可的地位，或某种象征性的尊荣标记；正文保留拉丁文“印记／解封”的意象，未作限定解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: quod omnium maius
  choice: 最令人痛心的是
  rationale: 直译为“其中最大的是”在中文中所指不明；结合本段哀悼语境，用“最令人痛心”自然表达其程度之最，但不增添具体事件。
- source_word: signaculum Sion
  choice: 锡安的印记
  rationale: 保留拉丁文 signaculum 的印记／印章意象及其难解性，不将其限定解释为荣耀、身份凭证或荣誉标志。
- source_word: resignata est de gloria sua
  choice: 她已被解除了荣耀的封印
  rationale: resignata 与 signaculum 形成封印意象，且阴性单数谓语指向锡安；此译保留该意象和原文略显异常的搭配。
- source_word: tradita est in manibus eorum qui nos oderunt
  choice: 被交在那些恨我们的人手中
  rationale: 贴近拉丁文被动结构和“交在……手中”的支配意象，语言自然庄重。
theological_decisions:
- issue: “锡安的印记”具体所指
  choice: 不作具体解释，保留“锡安的印记”
  alternative: 译作“锡安独有的荣耀”或“锡安蒙认可的身份”
  rationale: 原文意象本身含混，可能涉及锡安的独特荣耀、受认可的地位或荣誉标志；正文不应替读者消除这种张力。
- issue: resignata 的意象与意义
  choice: 译为“被解除了荣耀的封印”
  alternative: 译为“被剥夺了荣耀”
  rationale: 前者延续 signaculum 的封印意象；后者较易懂，却会抹去原文的词汇关联。脚注保留这一语义替代。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“锡安”以阴性代词“她”承接，反映拉丁文阴性单数谓语指向锡安，而非中性的“印记”。正文保留“印记—解除封印”的词汇呼应，并以脚注提供较顺畅的意义译法。
