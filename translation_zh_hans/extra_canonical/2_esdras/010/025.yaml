  text: Et factum est cum loquebar ad eam, et ecce facies eius fulgebat ualde subito et species coruscus fiebat uultus eius, ut etiam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/025.yaml
  text: And it happened[25], while I was speaking to her, that behold, her face suddenly shone exceedingly, and the appearance of her face became flashing[a], so that even [I was greatly afraid of her].
translation:
  language: zh_hans
  text: 我正对她说话的时候，看哪，她的脸忽然大放光芒，面容变得闪闪发光[a]，以至于连［我也非常害怕她］。[25]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的脸忽然大放光芒，她面容的样子变得闪耀。”
    reason: 说明拉丁语 species…uultus eius 可较贴近形式地译作“她面容的样子”，但所指仍是同一面容，并非另一个主语。
  - marker: '25'
    text: 现存拉丁文本在本节末尾的 ut etiam（“以至于连……”）处中断。方括号内的“我也非常害怕她”依据叙利亚文和埃塞俄比亚文子译本补出；这些版本也有“害怕靠近她”的读法差异。
    reason: 交代文本残缺、补文依据及版本差异。
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留启示文学中提示突发异象的醒目标记，而不弱化为普通连接词。
- source_word: fulgebat ualde subito
  choice: 忽然大放光芒
  rationale: 同时表达 subito 的突然性、ualde 的强烈程度和 fulgebat 的发光动作。
- source_word: species coruscus fiebat uultus eius
  choice: 面容变得闪闪发光
  rationale: 将 species…uultus eius 作为一个整体理解，避免把“外观”和“面容”误译为两个独立主语；用自然汉语表达 coruscus 的闪耀之意。
- source_word: ut etiam
  choice: 甚至使
  rationale: 保留现存拉丁文本在断裂前留下的结果结构，并与补出的后文自然衔接。
theological_decisions:
- issue: 残缺拉丁文本的补足
  choice: 正文以方括号补出“我非常害怕她”
  alternative: 在“甚至”处戛然而止，或补作“我害怕靠近她”
  rationale: Bensly 拉丁文本止于 ut etiam，句子未完；依据叙利亚文和埃塞俄比亚文子译本所保存的结果句，补出恐惧反应。方括号明确区分现存拉丁文与版本旁证恢复的内容，同时不把旁证之间关于“怕她”或“怕靠近她”的差异完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留异象叙事的突发感；方括号清楚标示非现存拉丁正文而由古代子译本恢复的文字。
