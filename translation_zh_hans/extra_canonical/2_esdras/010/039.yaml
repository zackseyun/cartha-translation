  text: rectam uiam tuam, quoniam sine intermissione contristabaris pro populo tuo et ualde lugebas propter Sion. Hic ergo intel-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/039.yaml
  text: For he has seen your upright way[a], because you were grieving without ceasing for your people and mourning greatly for Zion.
translation:
  language: zh_hans
  text: 原来，他看见了你所走的正直道路[a]，因为你不断为你的百姓忧伤，为锡安深深哀痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你正直的行事为人”。
    reason: 说明“道路”在此可指人的品行，同时保留原文表达可能产生的字面理解。
lexical_decisions:
- source_word: rectam uiam tuam
  choice: 你所走的正直道路
  rationale: 保留“道路”的原文比喻，同时用“正直”表明这里主要指正直的品行，而非地理上的直线路径。
- source_word: sine intermissione contristabaris
  choice: 不断……忧伤
  rationale: 准确表达持续而无间断的悲伤，措辞自然简洁。
- source_word: ualde lugebas
  choice: 深深哀痛
  rationale: 既传达 ualde 的强烈程度，也体现 lugebas 所含的哀悼、悲痛意味。
- source_word: Sion
  choice: 锡安
  rationale: 采用现代中文圣经及宗教文献中通行的专名译法。
theological_decisions:
- issue: rectam uiam 是实际道路还是道德行为
  choice: 以“正直道路”保留道路隐喻，并使道德含义清楚
  alternative: 正道；正直的行事为人；直路
  rationale: 上下文以持续为百姓和锡安悲伤说明这条“道路”，重点在人的正直行为；但原文仍明确使用 uia（道路），不宜完全消解其隐喻。
- issue: quoniam 的关系
  choice: 译为因果性的“因为”
  alternative: 译为解释性的“就是”或使用冒号
  rationale: quoniam 在此自然说明他为何认可这条正直道路；保留因果关系，避免把后两项仅处理成同位解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“原来”承接上下文中相当于英文 For 的说明语气；拉丁文本末尾的“Hic ergo intel-”属于下一句的开头，未纳入本节。
