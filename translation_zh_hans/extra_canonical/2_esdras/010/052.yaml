  text: campo, ubi domus non est aedificata. Sciebam enim ego quoniam altissimus incipiebat tibi ostendere haec. Propterea dixi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/052.yaml
  text: For I knew that the Most High was beginning to show you these things[a]. Therefore I said
translation:
  language: zh_hans
  text: ……到那片没有建造房屋的田野。因为我知道，至高者正开始把这些事显给你[a]。所以我才说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正要把这些事显给你”。
    reason: incipiebat 加不定式既可按拉丁文表层理解为“正开始”，在此类翻译体拉丁文中也可能带有“正要、即将”的前瞻意味。
lexical_decisions:
- source_word: campo
  choice: 田野
  rationale: 按通常义译出；原文从上一句中间接续，因此以省略号提示句法承接。
- source_word: ubi domus non est aedificata
  choice: 没有建造房屋的
  rationale: 保留关系从句的限定作用，说明这是尚未建房的田野。
- source_word: altissimus
  choice: 至高者
  rationale: 采用庄重而通行的神圣称谓，与拉丁文最高级名词化用法相符。
- source_word: incipiebat … ostendere
  choice: 正开始……显给
  rationale: 直接保留未完成过去时与“开始+不定式”的起始性含义，不将其无标记地改成单纯将来。
- source_word: Propterea dixi
  choice: 所以我才说
  rationale: “才”自然表达 propterea 所强调的因果关系；冒号提示后文将接所说的话。
theological_decisions:
- issue: 至高者启示行动的时态和阶段
  choice: 正开始把这些事显给你
  alternative: 正要把这些事显给你
  rationale: 拉丁文 incipiebat ostendere 表面上表示行动正在开始；“正要”虽可能符合其底层翻译腔及叙事次序，却会把起始体明确改为即将发生，故正文保留较形式对应的表达，并以脚注记录另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“显给你”保留启示语境的庄重色彩。开头是承接上一节的残句，故加省略号，不擅自补入原文没有的谓语。
