  yaml_path: translation/extra_canonical/2_esdras/010/055.yaml
  text: Therefore do not fear, and do not let your heart be terrified, but go in and see the splendor or the greatness of the building, as much as your eyes are able to see.
translation:
  language: zh_hans
  text: 所以，不要害怕，也不要让你的心惊惶；进去吧，观看那建筑的辉煌或宏伟；你的双眼能看见多少，就看多少。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: noli timere
  choice: 不要害怕
  rationale: 直接保留禁止命令的语气，符合现代汉语自然表达。
- source_word: neque expavescat cor tuum
  choice: 也不要让你的心惊恐
  rationale: 保留原文以“心”为惊恐主体的表达，同时用“让”使汉语句法自然。
- source_word: ingredere
  choice: 进去
  rationale: 按语境译作进入建筑之中，简洁明确。
- source_word: splendorem vel magnitudinem
  choice: 辉煌或宏伟
  rationale: 以“或”对应拉丁文 vel，不将原文的并列关系擅自改成“和”；“辉煌”偏重光彩壮丽，“宏伟”偏重规模气势。
- source_word: aedificii
  choice: 那建筑
  rationale: 用“建筑”保留其一般性，并以“那”符合上下文所指对象。
- source_word: quantum capax est tibi visu oculorum videre
  choice: 能看多少，就按你双眼所能看见的观看
  rationale: 原句表明观看受双眼视觉容量限制；译文保留这一强调，虽略有复沓，却与拉丁文的 videre／visu oculorum 相应。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“辉煌或宏伟”中的选择性连接词，不消解原文 vel 的含混；末句适度保留原文关于“观看／双眼所能看见”的重复强调。
