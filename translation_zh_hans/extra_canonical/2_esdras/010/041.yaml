- source_word: lugentem
  choice: 悲伤
  rationale: 表示哀恸、悲痛；结合本句未明说具体哀悼行为，译作“悲伤”自然且保留语义范围。
- source_word: inchoasti consolare
  choice: 就开始安慰
  rationale: 准确表达开始体 inchoasti 与不定式 consolare 的组合，并用“就”自然衔接前一动作。
- source_word: eam
  choice: 她
  rationale: 明确保留拉丁文阴性单数宾格代词所指的女子。
- source_word: Nunc autem iam
  choice: 但如今
  rationale: 兼顾 nunc、autem 的转折与时间推进；iam 在此强化当前阶段，汉语以“如今”简洁承载。
