  yaml_path: translation/extra_canonical/2_esdras/010/030.yaml
  text: And behold, I was lying there like a dead man, and my understanding had been taken away; and he took my right hand and strengthened me and set me on my feet,
translation:
  language: zh_hans
  text: 起初曾到我这里来的那位天使看见了我。看哪，我躺在那里，像死人一样，心智恍惚；他握住我的右手，使我刚强起来，并使我站起来。〔a〕
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: angelus qui in principio uenerat ad me
  choice: 起初曾到我这里来的那位天使
  rationale: 按拉丁文保留定语从句及其回指作用；“起初”自然传达 in principio，不将其具体化为某一次未明说的事件。
- source_word: positus ut mortuus
  choice: 躺在那里，像死人一样
  rationale: positus 表示处于倒卧或被放置的状态；结合语境译为“躺在那里”，ut mortuus 保留明喻而不译成真的死亡。
- source_word: intellectus meus alienatus erat
  choice: 神智尽失
  rationale: 该短语表示理解、意识离开正常状态；“神智尽失”以自然汉语传达昏迷失神之意，同时不额外说明原因。
- source_word: tenuit dexteram meam
  choice: 拉住我的右手
  rationale: 准确保留 dexteram 的“右手”；tenuit 在扶起的语境中用“拉住”较自然。
- source_word: confortauit me
  choice: 使我恢复力量
  rationale: 表达获得力量、被振作起来的使役含义，不局限于言语安慰。
- source_word: statuit me super
  choice: 扶我站起来
  rationale: 原文在 super 后似有省略或文本不完整；结合固定表达及动作次序，译出使其起身站立的基本意义，不添加具体地点。
theological_decisions:
- issue: “神智离去”是否解释为超自然夺取或普通昏厥
  choice: 神智尽失
  alternative: 我的悟性被夺去了
  rationale: 拉丁文只陈述神智处于离常状态，未明确施事者；所选译法保留结果而不引入神学上的施事判断。
- issue: 天使“坚固”叙述的性质
  choice: 使我恢复力量
  alternative: 坚固我
  rationale: confortauit 可有坚固、鼓励、恢复体力等含义；上下文是倒卧后被扶起，因此采用身体与精神均可涵盖的自然说法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。拉丁文开头包含“起初曾到我这里来的那位天使……看见了我”，虽英文咨询文本未呈现，仍依原文保留。末尾拉丁文止于 statuit me super，疑为残缺表达；正文按语境译为“扶我站起来”，不增添“脚”或地面等原文未明说的细节。
