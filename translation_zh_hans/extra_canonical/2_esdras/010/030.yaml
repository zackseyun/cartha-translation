revisions:
- from: 起初曾到我这里来的那位天使看见了我。看哪，我躺在那里，像死人一样，神智尽失；他便拉住我的右手，使我恢复力量，扶我站起来。
  to: 起初曾到我这里来的那位天使看见了我。看哪，我躺在那里，像死人一样，心智恍惚；他握住我的右手，使我刚强起来，并使我站起来。〔a〕
  rationale: 修订收窄了对 intellectus alienatus 的解释，按原文保留心智脱离常态的含义；以“握住”“使我刚强起来”“使我站起来”分别较直接地对应 tenuit、confortauit、statuit，同时用脚注透明处理现存拉丁文本在 super 处中断的情况。
