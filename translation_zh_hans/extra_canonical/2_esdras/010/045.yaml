  text: fuit annis triginta, propter quod erant anni saeculo tres, quando non erat in ea adhuc oblatio oblata. Et factum est post annos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/045.yaml
  text: And as for her saying to you that she had been barren for thirty years[a][45], this is because there were three thousand years in the world when no offering had yet been offered in her.
translation:
  language: zh_hans
  text: 至于她对你说，她已经三十年不生育，这是因为世界经历了三千年[a][45]，那时在她中间尚未献上祭物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在这时代中”。
    reason: previous_rendering
  - marker: '45'
    text: 拉丁文中“三千年”所据的措辞十分压缩，也很难理解。这里的译法依照本章的象征性年代关系：妇人的三十年对应锡安尚未有人献祭以前一段长得多的时期。
    reason: textual_variant
lexical_decisions:
- source_word: saeculo
  choice: 世上
  rationale: 这里指从创世起延续的一段世界历史，而不是专门指末世论中与“来世”相对的“今世”；用“世上”较自然地表达这一历史语境，同时以脚注保留“世代”的可能译法。
- source_word: oblatio oblata
  choice: 祭物……献上
  rationale: 保留原文同根词形成的重复意味，并明确这是献祭语境中的供物。
- source_word: in ea
  choice: 在她里面
  rationale: 直译阴性代词，维持妇人与锡安之间尚未完全明说的象征关系，不提前将其解释为“在锡安”。
- source_word: sterilem / contextual sense of fuit annis triginta
  choice: 不生育已经三十年
  rationale: 现存拉丁片段从“已有三十年”起句，结合本章上文妇人的陈述及英译审校层，补足所指的不育状态；“不生育”比口语化或带贬义的表达更庄重。
theological_decisions:
- issue: 妇人的三十年与锡安献祭前漫长年代之间的象征对应
  choice: 正文译作“三千年”，并用脚注说明拉丁文压缩而艰涩
  alternative: 按现存拉丁文字面译作“三年”
  rationale: 本章的象征解释要求妇人的三十年对应锡安尚无祭物献上之前的更长历史时期；但拉丁文“erant anni saeculo tres”本身高度压缩，因此不在正文中伪装成毫无疑问，而以文本脚注披露难点。
- issue: “她里面”的指代
  choice: 保留“她”
  alternative: 明译为“锡安”或“城中”
  rationale: 保留原文拟人化和解释逐步展开的张力，避免在本节提前消除象征歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不生育”避免过度口语化；“祭物在她里面献上”略保留原文陌生感，以承载妇人象征锡安的意象。脚注标记紧随“三千年”，因为“世上/世代”的选择和拉丁文数字难题都直接关联该短语。
