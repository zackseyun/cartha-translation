  language: zh_hans
  text: 因此，我叫你到田野[a]去，那里没有建筑物的地基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“郊野”。
    reason: agrum 既可指田地、田野，也可泛指城外的郊野；正文采用较具体且切合上下文的“田野”。
lexical_decisions:
- source_word: agrum
  choice: 田野
  rationale: 拉丁语 agrum 在这里指以斯拉受命前往的特定空旷地带；译作“田野”既保留具体地点感，也与上下文中尚未建造的场所有关。
- source_word: fundamentum aedificii
  choice: 建筑物的地基
  rationale: 按单数属格结构直译其基本关系，避免增添“任何”等原文没有的限定，同时符合现代汉语表达。
