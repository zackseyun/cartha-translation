  yaml_path: translation/extra_canonical/2_esdras/010/057.yaml
  text: But you are blessed above many[a], and you have been called by the Most High, as only a few have been.
translation:
  language: zh_hans
  text: 但你比许多人更有福；你在至高者面前蒙召[a]，像你这样蒙召的人寥寥无几。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在至高者面前蒙召”也可按语境理解为“蒙至高者召唤”。拉丁文 apud 主要表示“在……那里、与……同在、在……面前”，本身并不明确标示召唤者。
    reason: 保留介词 apud 的语义张力，并说明另一种合乎语境的理解。
lexical_decisions:
- source_word: beatus es prae multis
  choice: 你比许多人更有福
  rationale: 按拉丁文比较结构直译其核心含义，同时采用自然、庄重的现代汉语表达。
- source_word: uocatus es
  choice: 你……蒙召
  rationale: 保留完成时被动语态及其宗教语境中的“召唤/选召”意味，不擅自具体化召唤的方式。
- source_word: apud
  choice: 在……面前
  rationale: apud通常表示与某者同在、在某者那里或面前，而非明确标示施事者；此译法避免把拉丁文直接改成“被……召唤”。
- source_word: prae multis / as only a few have been
  choice: 像你这样的人寥寥无几
  rationale: 后半句在所给拉丁文本中未完整呈现；依审校参考层表达为自然汉语，并维持“仅少数人有此经历”的意思。
theological_decisions:
- issue: “至高者”是召唤的施事者，还是蒙召发生于其面前
  choice: 在至高者面前蒙召
  alternative: 蒙至高者召唤
  rationale: 现存措辞使用apud而不是通常标示施事者的ab；故正文保留位置或临在关系，不把可能的神学含义强行确定为直接施事。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“蒙召”是普通中文宗教文本中可理解的固定表达；“寥寥无几”简洁呈现只有少数人如此的强调。所给拉丁文本在apud处截断，因此对其后的内容参考已审校的英语咨询层，但不让该层覆盖apud本身的语法证据。
