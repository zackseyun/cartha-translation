  text: I will remind you.” And I said[a], “Speak, my lord; only do not
translation:
  language: zh_hans
  text: “我会提醒你。”我说[a]：“我主，请说吧，只是不要对我——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一种译法作：“他对我说：‘要像个男子汉一样站起来，我会指教你。’”这句话对应上一节末尾的拉丁文本。
    reason: 交代英语审校层所保留的另一种译法，并说明本译依照拉丁文的分节范围。
lexical_decisions:
- source_word: commonebo
  choice: 我会提醒
  rationale: 拉丁语 commonebo 可指提醒、劝告或告诫；此处采用“提醒”，贴近基本词义，同时不把语气强化为“教导”。
- source_word: Loquere
  choice: 请说吧
  rationale: 命令式直译为“说吧”；加“请”符合对“我主”的恭敬语气，现代汉语也更自然。
- source_word: domine meus
  choice: 我主
  rationale: 保留拉丁语称呼的尊敬和从属意味，不具体判定对方身份。
- source_word: tantum me noli
  choice: 只是不要——
  rationale: 原文在 noli（不要）之后截断，宾语 me 已在句中，但后续不定式位于下一节；以破折号明确保留未完句，不擅自补足动作。
theological_decisions:
- issue: 说话者身份及“我主”的指称
  choice: 保留“我主”，不作身份说明
  alternative: 译作“主啊”或明确为天使
  rationale: 本节拉丁语只给出尊称 domine meus，明确身份会超出所给源文。
- issue: commonebo 的语义强度
  choice: 译为“提醒”
  alternative: “教导你”“告诫你”
  rationale: “提醒”最贴近 commoneo 的常见义，并保留其也可能含劝告意味的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文从上一节的引语中间开始，又在本节末尾中断；用开头引号和末尾破折号保留这一分节现象。
