  text: this woman whom you saw is Zion, whom you now see as a city being built.
translation:
  language: zh_hans
  text: 你所看见的这个妇人就是锡安；如今你看见她显为一座已建成的城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ut ciuitatem aedificatam
  choice: 成为一座正在建造的城
  rationale: ut 在此表达妇人显现为城的形态；aedificatam 是完成被动分词，但语境着眼于所见之城正在成形，译作“正在建造”较自然，也与经审核的英文咨询文本一致。
- source_word: Sion
  choice: 锡安
  rationale: 采用现代汉语圣经传统中通行的专名译法。
- source_word: mulier
  choice: 妇人
  rationale: 用庄重而通俗的叙事称谓，保留异象中人物的成年女性身份。
theological_decisions:
- issue: 妇人与锡安的关系
  choice: 就是锡安
  alternative: 象征锡安
  rationale: 保留原文直接认同的表达，不额外加入“象征”等解释性神学术语。
- issue: 城的建造状态
  choice: 正在建造的城
  alternative: 已经建成的城
  rationale: 拉丁语分词形式本身可偏向完成状态，但上下文及咨询文本支持动态呈现；此译法不进一步解释其末世论含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。分号划分身份揭示与异象形态两个层次。所给拉丁文本仅保存本节末尾并接续下一句开头；本节前半依照该版本的完整经文见证及经审核的英文咨询层复原翻译。
