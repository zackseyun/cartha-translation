  yaml_path: translation/extra_canonical/2_esdras/010/002.yaml
  text: Then we all put out the lamps[a], and all my fellow citizens rose up to comfort me, and I rested until the next day, until night.
translation:
  language: zh_hans
  text: 于是，我们大家都熄灭了灯[a]；我城里的居民也都起来安慰我。我一直歇息到次日夜里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们熄灭了所有的灯。”
    reason: 原文词序可能使人作此理解；但按拉丁语形态，omnes 更可能修饰主语“我们大家”，而非 lumina（灯）。
lexical_decisions:
- source_word: evertimus
  choice: 熄灭了
  rationale: 在“灯”的语境中表示使灯火熄灭；现代汉语用“熄灭”自然明确。
- source_word: omnes
  choice: 我们大家都
  rationale: 拉丁语 omnes 为主格复数，修饰省略的主语“我们”，而非中性复数宾格 lumina。
- source_word: cives mei
  choice: 我的同城人
  rationale: 保留 cives 所表达的同一城邑居民关系；较“市民”更适合叙事语境，也不额外引入现代公民身份含义。
- source_word: ad consolandam me
  choice: 安慰我
  rationale: 准确表达目的结构，汉语无需另译“为了”也能自然呈现。
- source_word: quievi
  choice: 我歇息
  rationale: 兼顾“休息、安静下来”的语义范围；“歇息”自然且不将含义限缩为睡眠。
- source_word: usque in alium diem usque noctem
  choice: 到第二天，直到夜里
  rationale: 贴近原文重复的 usque，并保留时间表述略显不寻常的延展关系，不擅自解释为具体时刻。
