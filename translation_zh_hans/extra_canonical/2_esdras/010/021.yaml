  text: vides enim, quoniam sanctificatio nostra deserta effecta est et altare nostrum demolitum est et templum nostrum destructum est,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/021.yaml
  text: For you see that our sanctuary has been laid waste, our altar has been torn down, and our temple has been destroyed.
translation:
  language: zh_hans
  text: 你看，我们的圣所已成荒凉，我们的祭坛已被拆毁，我们的圣殿已被毁坏。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sanctificatio nostra
  choice: 我们的圣所
  rationale: 拉丁语 sanctificatio 在此与祭坛、圣殿并列，指分别为圣的宗教场所；译作“圣所”既符合上下文，也保留其神圣空间的含义。
- source_word: deserta effecta est
  choice: 已经荒废
  rationale: 直译为“已变得荒凉”；“已经荒废”自然凝练，并表达被弃置、成为荒凉之地的结果状态。
- source_word: altare nostrum
  choice: 我们的祭坛
  rationale: 准确对应 altare，并保留三项陈述中反复出现的“我们的”。
- source_word: demolitum est
  choice: 已经拆毁
  rationale: demoliri 表示拆除、毁坏；“拆毁”与祭坛搭配自然，并区别于下一分句的 destructum。
- source_word: templum nostrum
  choice: 我们的圣殿
  rationale: templum 在耶路撒冷敬拜语境中特指圣殿，译为“圣殿”比泛称“殿宇”准确。
- source_word: destructum est
  choice: 已经摧毁
  rationale: 表达彻底毁坏的结果，并与前文“拆毁”形成源文中的近义变化。
theological_decisions:
- issue: sanctificatio 所指是抽象的“圣洁”还是具体的“圣所”
  choice: 圣所
  alternative: 圣洁之地／神圣之物
  rationale: 其后紧接“祭坛”和“圣殿”，且谓语为“成为荒凉”，具体地点意义最合语境；但不进一步限定为圣殿内某一区域。
- issue: 三项名词是否指彼此完全独立的建筑实体
  choice: 保留“圣所—祭坛—圣殿”的并列措辞
  alternative: 合并或解释为圣殿建筑群的各部分
  rationale: 源文以三个平行分句表达，可能带有修辞性重叠；译文不替文本消解各词之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个分句重复“我们的”和“已经”，对应拉丁文的平行结构与完成结果状态；“荒废—拆毁—摧毁”保留谓语的语义差异。
