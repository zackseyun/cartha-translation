  text: Now therefore, keep your grief within yourself, and bravely bear the misfortunes that have happened to you.
translation:
  language: zh_hans
  text: 因此，现在你要把自己的悲痛留在心里，勇敢地承受临到你的不幸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: retine apud temet ipsam dolorem tuum
  choice: 把悲痛藏在心里
  rationale: 直译为“把你的悲痛留在你自己里面”；中文用“藏在心里”自然表达克制并把悲痛留在内心，同时保留对阴性单数听者的直接劝告，但中文不标语法性别。
- source_word: fortiter fer
  choice: 勇敢地承受
  rationale: 保留 fortiter 的勇毅意味和 fer 所表达的忍受、承担之意，语气简洁而庄重。
- source_word: quae tibi contigerunt casus
  choice: 临到你的这些不幸
  rationale: 按清理后的拉丁文理解为“发生在你身上的不幸遭遇”；“临到”保留事件落在当事人身上的意味，“这些”对应具体已发生的遭遇。
- source_word: nunc ergo
  choice: 所以现在
  rationale: 同时体现 nunc 的时间推进和 ergo 的推论连接，比单用“现在”更完整。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“藏在心里”不是赞许压抑情绪的一般原则，而是在本节劝告语境中自然传达拉丁文所说将悲痛留在自己里面。
