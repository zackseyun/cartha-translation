  to: 我们的琴被贬抑了，我们的颂歌沉寂了，我们的欢腾消散了；我们灯台的光熄灭了，我们的约柜被掳掠了，我们的圣物被玷污了，那被称在我们身上的名也几乎被亵渎了。我们的儿女受了凌辱，我们的祭司被焚烧了，我们的利未人被掳而去；我们的童女被玷污了，我们的妇女遭受强暴；我们的义人被掳走了，我们的幼儿被交了出去[b]，我们的青年沦为奴仆，我们的勇士变得软弱。
