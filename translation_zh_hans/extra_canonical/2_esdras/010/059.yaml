  text: futura est manebis hic, Et ostendet tibi altissimus eas uisiones somniorum quae faciet altissimus his qui habitant super terram in nouissimis diebus. Et dormiui illam noctem et aliam sicut praecepit mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/059.yaml
  text: and the Most High will show you those dream-visions that the Most High will bring about for those who dwell on the earth in the last days.”[a]
translation:
  language: zh_hans
  text: 你要留在这里。至高者要把那些梦中异象显示给你，显明至高者在末后的日子将使住在地上的人经历什么。[a]于是我照他所吩咐的，睡了那一夜和又一夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可译作：“至高者要把那些梦中异象显示给你，就是至高者在末后的日子要为住在地上的人所成就的事。”
    reason: 原文 quae 的所指以及与格 his qui habitant 的语义关系均有歧义；另一译法保留“为他们成就”的可能。
lexical_decisions:
- source_word: manebis hic
  choice: 你要留在这里
  rationale: 直译第二人称将来时，语气自然明确。
- source_word: altissimus
  choice: 至高者
  rationale: 保留原文对上帝的称号及同句中的重复，不改用代词消解其庄重语气。
- source_word: uisiones somniorum
  choice: 梦中异象
  rationale: 表达由梦而来的异象，比生硬的“梦的异象”更符合现代汉语。
- source_word: faciet
  choice: 将使……经历什么
  rationale: 在不预断所行之事必为恩惠或惩罚的前提下，表达末世事件临到地上居民。
- source_word: in nouissimis diebus
  choice: 在末后的日子
  rationale: 采用清楚而庄重的末世性时间表达。
- source_word: dormiui illam noctem et aliam
  choice: 睡了那一夜和次夜
  rationale: 保留原文提到两个夜晚；aliam 在这里自然理解为随后的一夜。
theological_decisions:
- issue: his qui habitant 的受益或受事关系
  choice: 将使住在地上的人经历什么
  alternative: 要为住在地上的人成就什么／要对住在地上的人做什么
  rationale: 拉丁语与格本身可容许不同关系；“经历”既不强定为赐福，也不强定为敌对审判，同时符合启示文学中事件临到世人的语境。
- issue: quae 的所指与句法关系
  choice: 把异象理解为显明至高者将使世人经历之事
  alternative: 把 quae 直接看作修饰“异象”，译为“至高者将成就的那些梦中异象”
  rationale: quae 形式上可与阴性复数 uisiones 呼应，也可能承载“那些事”的意义；正文用“显明……什么”保留异象与将来事件的关联，避免汉语中“成就异象”的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原始拉丁文本开头的“futura est”显然是前一句残留的片段，缺少足以独立翻译的句法成分，因此正文从完整分句 manebis hic 起译；同时收入原文末尾关于两个夜晚的叙述。
