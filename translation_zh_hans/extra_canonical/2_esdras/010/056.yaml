lexical_decisions:
- source_word: post haec
  choice: 此后
  rationale: 简洁表达时间上的先后关系，也可涵盖“这些事以后”的含义。
- source_word: audies
  choice: 你将听见
  rationale: 保留拉丁文第二人称单数将来时及听觉意象。
- source_word: quantum capit
  choice: 所能领受的那么多
  rationale: capit 在这里表示容量或承受限度；“领受”既自然，又保留听见并理解、接受信息的开放含义。
- source_word: auditus aurium tuarum
  choice: 你耳朵所能领受的
  rationale: 原文近似“你耳朵的听觉”，带有强调听觉容量的表达；译文保留“耳朵”，同时避免生硬的“耳朵的听觉”。
