  text: autem contristaris in uno filio. Interroga enim terram et dicet tibi, quoniam haec est quae debeat lugere tantorum super eam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/009.yaml
  text: But you are grieving over one son. For ask the earth[a], and it will tell you that it is she who ought to mourn for so many upon her.
translation:
  language: zh_hans
  text: 但你只为一个儿子悲伤。你只管问大地[a]，它会告诉你：理当为其上的这么多人哀悼的，是它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“问大地。”
    reason: 保留英语审校层所记录的既有直译提示；正文“你只管问大地”以自然汉语表达原文直接的命令和劝促语气。
lexical_decisions:
- source_word: autem
  choice: 但
  rationale: 承接上文并形成转折，保留拉丁文的篇章衔接。
- source_word: contristaris
  choice: 悲伤
  rationale: 自然表达持续处于忧伤之中的状态，不额外强化为特定哀悼仪式。
- source_word: in uno filio
  choice: 只为一个儿子
  rationale: in在此表示悲伤所关涉的对象；加入“只”传达uno与后文“这么多人”的对比。
- source_word: Interroga enim terram
  choice: 你不妨问问大地
  rationale: 保留命令式“问大地”，以“不妨”自然承载enim引出的劝说和理由语气。
- source_word: haec est quae debeat lugere
  choice: 应当……哀悼的，是它
  rationale: 保留强调结构以及debeat所表达的应当、理当之意；以“它”照应“大地”。
- source_word: tantorum super eam
  choice: 地上这么多人
  rationale: tantorum省略了表示人的名词，按上下文译为“这么多人”；super eam直译其在大地之上的空间关系，不加入原文没有的“生长”等含义。
theological_decisions:
- issue: 大地的拟人化
  choice: 保留“大地会告诉你”以及大地应当哀悼的拟人表达
  alternative: 解释为地上的居民或受造界
  rationale: 拉丁文直接将terra作为询问、回答和哀悼的主体；不把诗性和神学张力消解为解释性措辞。
- issue: tantorum所指对象
  choice: 译作“这么多人”
  alternative: 这么多死者／这么多儿女
  rationale: 原文只用复数属格tantorum而省略中心词；上下文明显指许多人，但其身份和状态不宜进一步限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“儿子”对应单数filius；“地上这么多人”既符合汉语习惯，也避免加入拉丁原文没有的动作或身份说明。
