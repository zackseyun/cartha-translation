- from: 但你只为一个儿子悲伤。你不妨问问大地[a]，它会告诉你：为地上这么多人哀悼的，应当是它。
  to: 但你只为一个儿子悲伤。你只管问大地[a]，它会告诉你：理当为其上的这么多人哀悼的，是它。
  rationale: 将“你不妨问问”改为“你只管问大地”，以恢复 Interroga 的命令性，并在汉语中表达 enim 所支持的论证性劝促。将“地上这么多人”调整为“其上的这么多人”，更明确对应 super eam，且不增加原文未说明的人群身份或状态。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:07:16Z'
review_pass:
  verdict: revise
  source_fidelity: “不妨问问”将拉丁文 Interroga 的直接命令语气弱化为许可或建议；enim 所引出的论证关系也未在正文中得到清晰体现。“地上这么多人”基本传达 super eam，但“其上”更明确地使“大地”成为空间指向和拟人化哀悼的主体。
  naturalness: 原译整体通顺、庄重。改为“你只管问大地”保留汉语自然性，同时更贴近原文带有劝促和确信的命令式；“其上”在此语体中自然。
  terminology: “儿子”“大地”“悲伤”“哀悼”均恰当。保留“这么多人”，不擅自补出死者、儿女或生长者等原文未明言的身份或动作。
  issues:
  - severity: medium
    issue: 命令式语气被弱化
    rationale: Interroga enim terram 是“因为／你只管问大地”的直接劝促，不是“你不妨”所表达的可做可不做的建议。
  - severity: low
    issue: 空间关系的指向可更清楚
    rationale: super eam 指“在大地之上”；译为“其上的这么多人”既避免歧义，也保留大地被拟人化为哀悼主体的句法关系。
