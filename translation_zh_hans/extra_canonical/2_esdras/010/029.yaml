  text: And while I was speaking these things, behold, the angel who had come to me at the beginning came to me and saw me.
translation:
  language: zh_hans
  text: 我正说这些话的时候，看哪，那起初到我这里来的天使来到我这里，看见了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et cum essem loquens ego haec
  choice: 我正说这些话的时候
  rationale: 用现代汉语自然表达拉丁语未完成时与时间从句，保留动作正在进行之意。
- source_word: et ecce
  choice: 看哪
  rationale: 保留叙事中引人注意、标示突发事件的语气。
- source_word: qui in principio venerat ad me
  choice: 那起初到我这里来的
  rationale: 按原文关系从句翻译；“起初”保留 in principio 的时间指向，不具体限定为哪一次开端。
- source_word: venit ad me
  choice: 又来到我这里
  rationale: “又”使汉语清楚呈现同一位天使继先前来访之后再次前来；该重复关系由上下文和关系从句明确支持。
- source_word: et vidit me
  choice: 看见了我
  rationale: 直译 vidit，保留其朴素而可能略显突兀的叙述，不擅自解释为察看、安慰或注意到。
