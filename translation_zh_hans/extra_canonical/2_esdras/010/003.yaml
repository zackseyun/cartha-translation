  yaml_path: translation/extra_canonical/2_esdras/010/003.yaml
  text: And it happened, when all had stopped comforting me so that I might rest, that I rose by night and fled and came, as you see, into this field.
translation:
  language: zh_hans
  text: 事情是这样的：等众人都停止安慰我，好让我休息以后，我就在夜里起来逃走，来到这片田野，正如你所看见的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quievissent
  choice: 不再
  rationale: 此处与不定式“安慰我”连用，表示众人停止安慰；译为“不再”比直译“歇息”更符合现代汉语，同时保留动作终止之意。
- source_word: ut me consolarentur ut quiescerem
  choice: 为了让我休息，不再安慰我
  rationale: 拉丁语连续两个 ut 所表达的关系略显曲折；按语境理解为众人原先为使叙述者安歇而安慰他，后来停止了。此译尽量保留“安慰”与“休息”两个要素。
- source_word: surrexi nocte et fugi
  choice: 我便在夜里起来逃走
  rationale: 依次保留“起来”“夜里”“逃走”三个信息，并用“便”自然承接前句。
- source_word: in hoc campo
  choice: 来到这片田野
  rationale: campus 可指开阔地、田野；结合现场指示 hoc 及叙事场景，译作“这片田野”自然明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。省去机械对应 et factum est 的“事情发生了”，以汉语时间结构自然表达；未加入原文没有的神学解释。
