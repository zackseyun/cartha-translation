  yaml_path: translation/extra_canonical/2_esdras/010/027.yaml
  text: And behold[a], the woman no longer appeared to me, but a city was being built, and a place with great foundations was being revealed. Then I was afraid and cried out with a loud voice and said,
translation:
  language: zh_hans
  text: 看哪，那妇人不再出现在我眼前；可是，一座城正在被建造，一个有宏大根基的地方正在显现出来[a]。我就害怕，放声呼喊说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个地方正从宏大的根基中显现出来。”
    reason: 保留 de fundamentis magnis 可按来源性短语理解的句法可能性。
lexical_decisions:
- source_word: et ecce
  choice: 看哪
  rationale: 保留异象叙事中引人注意、表示突变的提示语；中文简洁而庄重。
- source_word: mulier non conparebat mihi
  choice: 那妇人不再出现在我眼前
  rationale: 准确表达 mihi 所指的感知视角，并保留“不再显现”的状态变化。
- source_word: civitas aedificabatur
  choice: 有一座城正在建造
  rationale: 以进行体表达拉丁文未完成时被动态，保留建造过程正在展开的图景。
- source_word: locus demonstrabatur
  choice: 一处……地方正在显露出来
  rationale: demonstrabatur 在异象语境中表示被展示、显明；“显露出来”比机械的“被指出”自然。
- source_word: de fundamentis magnis
  choice: 有宏大根基的
  rationale: 把翻译体拉丁文 de 加夺格理解为性质描述，修饰 locus；“宏大”兼顾根基的规模与异象的庄严感。
- source_word: clamavi voce magna
  choice: 放声呼喊
  rationale: 自然凝练地传达“以大声呼喊”，避免不必要的欧化重复。
theological_decisions:
- issue: de fundamentis magnis 的句法关系
  choice: 理解为描述该地方具有宏大的根基
  alternative: 理解为该地方‘从宏大的根基中’显露出来
  rationale: 后期及翻译体拉丁文常以 de 加夺格承担性质或所属功能；但原句仍容许来源义，因此用脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重且易懂的异象叙事语体。“反而”突出妇人消失与城出现之间的强烈转折；末尾保留“说：”，以衔接下一节的话语。
