  source_fidelity: 译文准确传达拉丁文的条件—应许结构。iustificaveris 译为“承认……是公正的”恰当地表达认可上帝所定之事为义，未误作人使上帝成为公义；terminum Dei 译为“上帝的裁决”在此语境中可接受；recipies 的恢复性由“得回”充分表达。in tempore 保持了未具体说明的时间开放性，in mulieribus conlaudaberis 也保留了“在妇女中”及被动受赞的意思。
