id: 2ES.10.16
reference: 2 Esdras 10:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si enim iustificaveris terminum Dei, et filium tuum recipies in tempore et in mulieribus conlaudaberis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/016.yaml
  text: For if you acknowledge the justice of God’s decree, you will receive your son in due time and will be praised among women.
translation:
  language: zh_hans
  text: 因为，如果你承认上帝的裁决是公正的，你就会在适当的时候得回你的儿子，并在妇女中受到称赞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustificaveris
  choice: 承认……是公正的
  rationale: 此处不是使上帝的裁决成为公正，而是认可、宣告其为公正；这样译符合拉丁语在本句中的语义，也使现代汉语自然。
- source_word: terminum Dei
  choice: 上帝的裁决
  rationale: terminus 可指所定的界限、决定或谕令；结合语境，译作“裁决”既保留上帝所定之意，也与公正这一评价自然搭配。
- source_word: recipies
  choice: 得回
  rationale: 表示重新领受失去的儿子；“得回”比单纯“得到”更准确地呈现恢复关系的语境。
- source_word: in tempore
  choice: 在适当的时候
  rationale: 既可直译为“在时候来到时”，也有“到时候、届时”之意；采用自然汉语而不进一步限定具体时间。
- source_word: in mulieribus conlaudaberis
  choice: 在妇女中受到称赞
  rationale: 保留原文“在妇女中”的群体范围及被动语态，不擅自说明称赞者或称赞缘由。
theological_decisions:
- issue: iustificaveris terminum Dei 所表达的人与上帝裁决的关系
  choice: 承认上帝的裁决是公正的
  alternative: 证明上帝的定旨为义／顺服上帝的裁决
  rationale: 原文强调对上帝所定之事作出正面、公义的认可；“承认”避免暗示人使上帝称义，也不把认定公正缩减为单纯顺服。
- issue: 应许“得回儿子”的时间性质
  choice: 在适当的时候
  alternative: 到时候／按所定的时间
  rationale: 原文仅说 in tempore，没有明确说明这是末世复活、今世恢复或另一特定时刻，因此保留时间上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文“因为，如果……就……”的劝告与应许结构；不添加原文未明说的复活、审判或救赎解释。
