  text: Therefore go into the city to your husband.” And he said to me:[a]
translation:
  language: zh_hans
  text: “所以，你进城到你丈夫那里去吧。”她[a]对我说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 拉丁文此处省略主语，动词本身不标示性别；“她”是按上下文所补。
    reason: 保留原文隐含主语所带来的形式歧义，并说明中文代词的补译依据。
lexical_decisions:
- source_word: ingredere
  choice: 进……去吧
  rationale: 以自然的现代汉语表达拉丁文命令式，并保留劝令语气。
- source_word: civitatem
  choice: 城
  rationale: 准确对应“城市、城邑”，在本语境中用“城”简洁自然。
- source_word: ad virum tuum
  choice: 到你丈夫那里
  rationale: virum 在 tuum 限定及上下文中指“你的丈夫”；ad 表示趋向其所在之处。
- source_word: Et dixit ad me
  choice: 她对我说
  rationale: dixit 本身不标示性别，主语亦未明说；按叙事中正在与以斯拉交谈的妇人补出“她”，并用脚注说明原文形式。
theological_decisions:
- issue: “Et dixit ad me”隐含主语的性别与指向
  choice: 正文按上下文译为“她对我说”
  alternative: 译为“他对我说”或不补明性别的“对方对我说”
  rationale: 拉丁文 dixit 不编码主语性别，但最近的显著叙事主体是妇人；“她”最符合上下文和自然汉语。脚注保留原文在语法形式上未明示主语的事实，避免把推断冒充为明文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以”承接前文推论；句末冒号保留原文引出下文话语的功能。
