  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tibi ut uenires in agrum, ubi non est fundamentum aedificii. Nec enim poterat opus aedificii hominis sustinere in loco ubi incipiebat altissimi ciuitas ostendi. Tu ergo noli timere, neque expauescat cor tuum, sed ingredere et uide splendorem et magnitudinem aedificii, quantum capax est tibi uisus oculorum uidere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/054.yaml
  text: For no work of human building could endure in the place where the city of the Most High was beginning to be shown.
translation:
  language: zh_hans
  text: 因为在至高者的城开始显现的地方，任何人所建造的工程都无法存立。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus aedificii hominis
  choice: 人手所造的建筑
  rationale: 拉丁语直指人的建造之作；译为“人手所造的建筑”既自然，也清楚地与至高者之城形成对照。
- source_word: sustinere
  choice: 承受
  rationale: 保留“支撑、经受而存立”的语义张力，不擅自具体化为倒塌或毁坏。
- source_word: altissimi ciuitas
  choice: 至高者的城
  rationale: “至高者”是 Altissimi 的庄重、通行对应，并保留属格关系。
- source_word: incipiebat ... ostendi
  choice: 开始显现
  rationale: 反映未完成过去时加被动不定式所表达的过程起始，并保留城市被展示、显现的被动意味。
theological_decisions:
- issue: 人类建筑与至高者之城的关系
  choice: 以“人手所造的建筑”与“至高者的城”并置
  alternative: 译作“人的工程”或明确解释为“属世建筑”
  rationale: 原文只作人类建造与神圣城市之间的对照，没有使用“属世”等神学限定，因此不增添解释。
- issue: sustinere 所指的无法存立或无法承载
  choice: 译为较宽泛的“无法承受”
  alternative: “无法存立”
  rationale: 拉丁文可涉及承受、支撑或经受；“承受”保存一定歧义，避免断定究竟是建筑无法存立，还是地点无法承载建筑。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；句式紧凑，保留原文因果关系和显现过程。
source_grounding:
  english_pob_role: consult_only
