  text: Vbi est Vriel angelus, qui a principio uenit ad me ? quoniam ipse me fecit uenire in multitudinem excessus mentis huius, et factus est finis meus in corruptione, et oratio mea in inproperium. Et cum essem loquens ego haec, et ecce uenit ad me
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/028.yaml
  text: “Where is Uriel the angel[28], who came to me at the beginning? For it was he who brought me into this great bewilderment of mind, and my end has become corruption[a], and my prayer a reproach.”
translation:
  language: zh_hans
  text: “起初来见我的天使乌列在哪里？因为正是他使我陷入这极大的心神迷乱[a]；我的结局归于败坏[b]，我的祷告成了羞辱。”我正说这些话的时候，看哪，他来到我这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心神迷乱”也可译作“心神出离”或“恍惚之境”。原文措辞生硬而强烈，指压倒性的异象状态，并非普通的困惑，更不是喜悦的“狂喜”。
    reason: lexical_alternative
  - marker: b
    text: “败坏”也可译作“腐朽”或“毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: multitudinem excessus mentis huius
  choice: 这极深的心神迷乱
  rationale: 此短语直译近于“这心神出离的深广之境”，拉丁文表达生硬而有力度。excessus mentis 可指心神脱离常态、恍惚或迷乱；结合以斯拉此处的惊惧，用“心神迷乱”避免现代汉语“狂喜”所带来的喜悦含义，同时“极深”体现 multitudinem 所表示的强烈程度。
- source_word: fecit uenire
  choice: 使我陷入
  rationale: 保留使役意义；汉语“陷入”自然表达他被带进一种压倒性的异常心神状态，并符合上下文的负面感受。
- source_word: finis meus in corruptione
  choice: 我的结局成了毁灭
  rationale: corruptio 可表示腐坏、败坏或毁灭；此处谈个人结局，“毁灭”较自然，同时不把含义限定为肉体腐烂。
- source_word: oratio mea in inproperium
  choice: 我的祷告成了羞辱
  rationale: oratio 在此可指祷告或陈说；上下文是向上帝发出的哀诉，故取“祷告”。inproperium 可指羞辱、责骂或受人耻笑的对象，译作“羞辱”保留凝练和张力。
- source_word: et ecce uenit ad me
  choice: 看哪，他来到我这里
  rationale: 保留叙事提示语 ecce 的突显作用，并依上下文将省略的主语理解为乌列；原文在本节末似乎接续下一节，中文仍保留这句。
theological_decisions:
- issue: 乌列使以斯拉进入异常心神状态是否意味着欺骗或罪责
  choice: 按原文保留“正是他使我陷入”的因果指控
  alternative: 弱化为“自从他来后，我便感到迷乱”
  rationale: 原文明确使用使役结构 ipse me fecit uenire。译文保留以斯拉哀诉中的神学张力，不替叙述者裁定乌列是否有过错。
- issue: “我的祷告成了羞辱”的对象和方式
  choice: 保持未说明
  alternative: 解释为“我的祷告使我蒙羞”或“我的祷告遭人讥笑”
  rationale: 拉丁文没有明确说明是谁羞辱谁，也没有指出祷告为何成为羞辱，因此不在正文中补足。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留古代叙事中突然显现的提示力度；正文避免过度古雅。末句依所给拉丁文收入本节，虽然其叙事在下一节继续。
