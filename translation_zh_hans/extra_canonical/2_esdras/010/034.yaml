  text: And I said, “Speak, my lord; only do not forsake me, lest I die for nothing.
translation:
  language: zh_hans
  text: 我说：“我主，请说吧；只是不要离弃我，免得我白白死去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquere
  choice: 离弃我
  rationale: 拉丁文是不定式“离弃”；结合现存片段的句法和经文语境，补出受词“我”，用“离弃”保留恳求中庄重而强烈的语气。
- source_word: ut non frustra moriar
  choice: 免得我白白死去
  rationale: frustra 表示“徒然、毫无结果”；“白白死去”自然清楚，并保留说话者担心死亡归于徒然的含义。
theological_decisions:
- issue: “白白死去”的含义是否应解释为“希望落空”
  choice: 保留“白白死去”
  alternative: 免得我怀着落空的希望死去
  rationale: 现有拉丁文仅作 frustra moriar，并未明说“希望”；不把可能的语境解释写入正文，以保存原文的简洁与开放性。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语气。“请说吧”自然表达对上位者继续发言的请求；“我主”保留称谓的敬意。所给拉丁文本末尾 Quoniam uidi quae non（“因为我看见了我所不……”）显然是下一句未完的开头，因此未纳入本节正文。
