  text: Therefore I beg you to show your servant the meaning of this departure.” And he answered me and[a]
translation:
  language: zh_hans
  text: “求你向你的仆人说明这次出神[a]的意义。”他回答我说：……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出神”或译“离去”或“脱离”。拉丁语 excessus 可指离开，也可指脱离平常状态而进入恍惚或异象状态。
    reason: 保留 excessus 的词义歧义；正文依本段异象语境采用“出神”。
lexical_decisions:
- source_word: excessu
  choice: 出神
  rationale: 拉丁语 excessus 在异象语境中可指人脱离平常意识状态，即出神或恍惚；“出神”在现代汉语中既自然，也避免把它误解为欢欣陶醉。
- source_word: demonstres seruo tuo de ... hoc
  choice: 求你向你的仆人说明……是怎么回事
  rationale: 以自然汉语表达请求和说明内容；“你的仆人”保留原文自谦称谓。
- source_word: Et respondit ad me et
  choice: 他回答我，接着——
  rationale: 保留原文末尾第二个 et 所形成的未完承接关系，用破折号表明话语在下一节继续，避免擅自补入尚未出现的内容。
theological_decisions:
- issue: excessus 所指的是异象中的意识状态，还是字面上的离去
  choice: 正文译作“出神”
  alternative: “离去”或“脱离”
  rationale: 本段异象语境支持“出神、恍惚”这一先知性经验含义，但拉丁词本身仍可表示离开，因此用脚注保留其词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“是怎么回事”自然表达原文要求说明该经历之意；节末破折号保留拉丁文本以 et 戛然而止、承接下文的形式。
