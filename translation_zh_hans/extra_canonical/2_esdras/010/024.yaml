review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达劝勉、神再次施恩及赐安息的主旨。不过“心中”是原文未明说的限定；末尾“卸下劳苦”虽可理解，却没有明确表达 requietionem laborum（从劳苦中得到安歇／舒缓）对“安息”的补充，且在句法上略显游离。
  naturalness: “摆脱深重的悲伤”及“大能者／至高者”自然庄重。“除去心中重重的痛苦”可更贴近原文并避免“重重”在同句中的重复；将末句改为“使你从劳苦中得安歇”更完整顺畅。
  terminology: “大能者”对应 fortis、“至高者”对应 altissimus，均适切，并保留原文平行称谓。“再次施恩”准确体现 repropitietur 的“再度恩待”之意。
  issues:
  - severity: medium
    issue: “心中”增加了原文没有的范围限定。
    rationale: multitudinem dolorum 仅指众多的愁苦／痛苦，未限定为内心感受；删去可避免不必要的解释。
  - severity: medium
    issue: “卸下劳苦”未充分表达“从劳苦中得安歇”，且与前文连接松散。
    rationale: requietionem laborum 是对所赐“安息”的补充，重点是劳苦后的安歇或舒缓，并非主要指人主动卸下工作。
  revised_text: 所以，你要摆脱深重的悲伤，除去众多的愁苦，好让大能者再次施恩于你，至高者也使你得安息，使你从劳苦中得安歇。”
