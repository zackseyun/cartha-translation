  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu ergo excute tuam multam tristitiam, et depone abs te multitudinem dolorum, ut tibi repropitietur fortis, et requiem faciat tibi altissimus, requietionem laborum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/024.yaml
  text: Therefore shake off your great sadness, and put away from yourself the multitude of sorrows, so that the Mighty One may again be gracious to you, and the Most High may give you rest, relief from your labors.”
translation:
  language: zh_hans
  text: 所以，你要摆脱深重的悲伤，除去众多的愁苦，好让大能者再次施恩于你，至高者也使你得安息，使你从劳苦中得安歇。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excute
  choice: 摆脱
  rationale: 原义有“抖落、甩掉”之意；此处以自然的现代汉语表达主动挣脱悲伤，同时保留劝勉的力度。
- source_word: multam tristitiam
  choice: 深重的悲伤
  rationale: 兼顾 multam 所表达的强烈程度与汉语的自然搭配。
- source_word: multitudinem dolorum
  choice: 重重的痛苦
  rationale: 保留“众多、层叠”的意象，不将 dolor 狭义化为身体疼痛。
- source_word: fortis
  choice: 大能者
  rationale: 作为对上帝的称谓，体现“强有力者”；避免直译为不自然的“强者”。
- source_word: repropitietur
  choice: 再次施恩
  rationale: re- 表示“再次”，propitietur 表达转而恩待、施予恩惠；措辞不额外限定赦罪等特定含义。
- source_word: requiem faciat tibi altissimus
  choice: 至高者也使你得安息
  rationale: 贴近拉丁文结构，并使用庄重而通俗的宗教语汇。
- source_word: requietionem laborum
  choice: 卸下劳苦
  rationale: 将其作为前句“安息”的解释或结果，表达从劳苦中得到舒缓与解脱。
theological_decisions:
- issue: 劝勉与神施恩之间的关系
  choice: 译作“好让……再次施恩于你”
  alternative: “于是……就会再次施恩于你”
  rationale: 保留 ut 所表达的目的或结果张力，不将人的摆脱悲伤明确塑造成换取神恩的功德条件。
- issue: fortis 与 altissimus 是否指同一位上帝
  choice: 并列保留“大能者”和“至高者”两个称谓
  alternative: 合并为单一称谓或重复“上帝”
  rationale: 忠实呈现原文的平行称谓，不擅自消除其修辞层次。
- issue: requietionem laborum 的句法功能
  choice: 译为对“安息”的补充说明“卸下劳苦”
  alternative: “从劳苦中得安息”
  rationale: 拉丁文同位或解释关系略显浓缩；采用自然汉语呈现，同时不扩展为永恒安息等特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文直接劝勉的语气及“大能者／至高者”的平行结构；句末引号依所给经文片段保留。
