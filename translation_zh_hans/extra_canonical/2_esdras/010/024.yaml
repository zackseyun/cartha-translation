  to: 所以，你要摆脱深重的悲伤，除去众多的愁苦，好让大能者再次施恩于你，至高者也使你得安息，使你从劳苦中得安歇。”
  rationale: 修订删除原文未明说的“心中”，以“众多的愁苦”对应 multitudinem dolorum；并将末尾明确译为“使你从劳苦中得安歇”，保留其作为“安息”之解释性补充的作用，避免将其转化为人主动“卸下”劳苦。其余关键称谓、劝勉语气及 ut 的目的／结果张力均予保留。
