  text: This woman whom you saw is Zion[a], whom you now see
translation:
  language: zh_hans
  text: 你所看见的这个女人，就是你现在所看见的锡安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些旧译文在此作：“至于她向你讲述她儿子遭遇的不幸，解释如下：”这句话对应拉丁文本上一节的后半句，并非本节正文。
    reason: 说明既有译文与拉丁文节次错位；本节据 Haec mulier quam uidisti haec est Sion, quam nunc conspicis 翻译。
lexical_decisions:
- source_word: Haec mulier
  choice: 这个女人
  rationale: 直接表达指示词与名词，并与异象中先前所见的女人相衔接。
- source_word: quam uidisti
  choice: 你所看见的
  rationale: 保留完成时所指的先前看见，与后面的“现在”形成时间对照。
- source_word: haec est Sion
  choice: 就是锡安
  rationale: 准确表达身份认定；“锡安”采用现代中文圣经传统通行译名。
- source_word: quam nunc conspicis
  choice: 也就是你现在所看到的
  rationale: 保留关系从句及 nunc“现在”；conspicis 译为“看到”，自然地指向眼前显现的对象。
theological_decisions:
- issue: 女人与锡安的关系
  choice: 译作直接身份认定“这个女人就是锡安”
  alternative: 译作较弱的象征关系“这个女人代表锡安”
  rationale: 拉丁文 haec est Sion 明确使用系词“是”，原文没有另加“代表”的解释性措辞。
- issue: 末尾关系代词 quam 的所指
  choice: 以“也就是”承接锡安，同时保留原句所见对象的连续性
  alternative: 直译为“你现在所看见的她”
  rationale: quam 在语法上回指阴性名词 Sion，但异象中的女人与锡安已被认定为同一对象；中文用“也就是你现在所看到的”可避免生硬，又不额外消解这种重合。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你所看见的”与“你现在所看到的”保留原文的时间对照；用“也就是”适度再现拉丁文重复指示结构，避免中文过度冗赘。
