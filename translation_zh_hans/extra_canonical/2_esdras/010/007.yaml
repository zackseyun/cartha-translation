  source_fidelity: 译文完整对应拉丁文的两个问句／陈述单元：`uides`恰当地译为“你看见……吗”，`luctum nostrum`为“我们的哀恸”，`quae nobis contigerunt`保留为概括的“临到我们的事”。后半将锡安称为“我们众人的母亲”，并保留其人格化。`in tristitia contristatur et humilitate`译作“正在悲伤和屈辱中哀恸”，虽保留了原文同源强化的痕迹，仍未越出“忧伤／受压低蒙羞”的语义范围。
