  yaml_path: translation/extra_canonical/2_esdras/010/007.yaml
  text: see our mourning and what has happened to us? For Zion[a], the mother of us all, is grieving in sorrow and humiliation
translation:
  language: zh_hans
  text: 你看见我们的哀恸和临到我们的事吗？因为锡安——我们众人的母亲——正在悲伤和屈辱中哀恸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: luctum
  choice: 哀恸
  rationale: 指共同经历的深切哀伤；“哀恸”既保留强度，也符合庄重的经文语体。
- source_word: quae nobis contigerunt
  choice: 临到我们的事
  rationale: 贴近拉丁文“发生于我们、临到我们”的表达，并保留所指事件未明说的概括性。
- source_word: Sion mater nostra omnium
  choice: 锡安——我们众人的母亲
  rationale: 将“锡安”与“我们众人的母亲”按同位关系处理，准确表达 nostra omnium，同时用破折号使现代中文清楚自然。
- source_word: in tristitia contristatur
  choice: 正在悲伤……中哀恸
  rationale: 保留同源词式强调所形成的强烈哀伤感，不把它解释性地改成“痛苦地”等副词。
- source_word: humilitate
  choice: 屈辱
  rationale: 此处与锡安的哀伤并列，指受压低、蒙羞的处境；“屈辱”比品德意义的“谦卑”更合语境。
theological_decisions:
- issue: 锡安被人格化为母亲
  choice: 保留“锡安——我们众人的母亲”这一人格化称谓
  alternative: 将“母亲”解释为具体城市、民族或宗教群体
  rationale: 原文只明确作母亲式人格化，并未进一步限定其神学指涉，因此不替读者消解其张力。
- issue: tristitia contristatur 的强调方式
  choice: 译为“正在悲伤……中哀恸”
  alternative: 译为“悲痛万分”或“悲痛地哀恸”
  rationale: 现译较直接地保存原文重复而强化的表达，不额外规定悲伤的程度或性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀恸”承载本节较强的悲伤语气；“临到我们的事”保留原文概括性。破折号清楚标示“我们众人的母亲”是“锡安”的同位说明。
