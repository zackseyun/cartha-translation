  text: fit multitudo eorum. Quis ergo debet lugere magis nisi haec quae tam magnam multitudinem perdidit, quam tu quae pro
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/011.yaml
  text: Who then ought to mourn more, if not she who has lost so great a multitude, rather than you, who grieve for one?
translation:
  language: zh_hans
  text: 那么，谁更应该哀哭呢？岂不是那失去了如此众多的人的，比你这只为一个人悲伤的更应该哀哭吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugere
  choice: 哀哭
  rationale: 既表达内心的哀痛，也保留公开哀悼的意味，符合本节反问语气。
- source_word: haec
  choice: 那……的
  rationale: 拉丁文为阴性指示代词，承接上下文中的女性形象；汉语中以关系结构自然表达，不擅自补明身份。
- source_word: multitudinem
  choice: 众多子民
  rationale: multitudo 指大量人群；结合 perdidit 所表达的丧失，以“众多子民”使中文语义完整，同时保留群体性。
- source_word: perdidit
  choice: 失去了
  rationale: 准确传达失丧、丧失之意，不额外限定其具体方式。
- source_word: pro uno
  choice: 只为一个人
  rationale: 与“如此众多”构成原文的数量对比；“只”明示拉丁文比较结构中隐含的强烈反差。
theological_decisions:
- issue: 阴性代词 haec 所指对象的身份
  choice: 保留为未明说的女性对象
  alternative: 明确译作“锡安”或“这座城”
  rationale: 本节截取文本只提供阴性代词；不借解释性传统直接确定其身份，以保存原文在本节中的指代方式。
- issue: “一个”所指
  choice: 译为“一个人”但不进一步说明身份
  alternative: 明确译作“你的儿子”
  rationale: 现存片段为 pro uno，英语咨询层也仅作“one”；补出“人”符合现代汉语，但不越过本节证据具体指认为儿子。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以双层反问重现 quis ergo... nisi... quam... 的论辩力度，并清楚呈现“众多人”与“一个人”的对比。
