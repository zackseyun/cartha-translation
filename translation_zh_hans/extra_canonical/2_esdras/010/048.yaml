source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'nutriuit eum cum labore, haec erat habitatio Hierusalem : Et quoniam dixit tibi quod filius meus ueniens in suo thalamo mortuus esset et contigisset ei casus, haec erat quae facta est ruina Hierusalem. Et ecce uidisti similitudinem eius, quomodo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/048.yaml
  text: And as for her saying to you[a], ‘My son, when he entered his bridal chamber, died, and disaster befell him,’ this was the ruin that came upon Jerusalem.
translation:
  language: zh_hans
  text: 至于她对你说[a]：“我儿进入洞房后死了，又有灾祸临到他”，这就是耶路撒冷的毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的儿子进入洞房后死了，又有灾祸临到他。”
    reason: 拉丁文 quod 可作引出间接引语的连词；但其后的 meus（“我的”）也支持把妇人的话作为直接引语。
lexical_decisions:
- source_word: thalamo
  choice: 洞房
  rationale: 指婚房或新婚卧房；“洞房”在现代汉语中简洁自然，也保留婚礼场景。
- source_word: casus
  choice: 灾祸
  rationale: 此处指临到儿子的祸患或不幸；译作“灾祸”既呼应叙事语境，也不过度限定其具体性质。
- source_word: ruina Hierusalem
  choice: 耶路撒冷所遭受的毁灭
  rationale: ruina 在此指耶路撒冷的倾覆、毁灭；采用自然汉语表达，并保留历史灾难的力度。
theological_decisions:
- issue: quod 引出的内容是直接引语还是间接引语
  choice: 正文按直接引语处理：“我儿……”
  alternative: 按间接引语处理：“她儿子……”
  rationale: 拉丁文保留第一人称 meus（“我的”），表明 quod 很可能具有引出直接话语的功能。正文以引号呈现，可避免误将“我儿”理解为解释者自己的儿子；脚注保留间接引语的语法可能性。
- issue: 象征解释的对应关系
  choice: 译为“这指的就是……”
  alternative: 直译为“这就是……”
  rationale: 上下文正在解释妇人异象与耶路撒冷遭遇之间的象征对应；“指的就是”使现代汉语关系清楚，却不增添具体神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“洞房”保留婚礼语境；句式明确区分妇人的话与异象解释。
