  text: and behold[a], suddenly she let out a great cry, full of terror, so that the earth was shaken by the sound. And I saw,
translation:
  language: zh_hans
  text: 看哪，[a]她忽然发出一声充满恐惧的高喊，声音震动了大地。我看见，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她忽然发出一声充满恐惧的高喊，声音震动了大地。”
    reason: 记录一种不显译 ecce（“看哪”）的先前译法，同时正文保留原文明确存在的提示词。
lexical_decisions:
- source_word: ecce
  choice: 看哪
  rationale: 保留拉丁文引人注意、提示突发景象的语气。
- source_word: emisit sonum vocis magnum
  choice: 发出一声……的高喊
  rationale: 按现代汉语自然表达传达她发出巨大声音；“高喊”比直译“发出巨大的嗓音”更通顺。
- source_word: timore plenum
  choice: 充满恐惧的
  rationale: 保留 timor 的基本义及其修饰声音的关系，不擅自解释为惊吓他人或敬畏。
- source_word: ut commoveretur terra a sono
  choice: 声音震动了大地
  rationale: 简洁保留声音造成大地震动的结果关系。
- source_word: et vidi
  choice: 我又看见
  rationale: vidi 译为“看见”较“观看”准确；“又”承接异象叙事。句末逗号保留与下一节相连的未完结构。
theological_decisions: []
