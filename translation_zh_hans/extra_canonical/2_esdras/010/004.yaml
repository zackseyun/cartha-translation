source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ueni, sicut uides, in hoc campo. Et cogito iam non reuerti in ciuitate sed hic consistere, et neque manducabo neque bibam, sed sine intermissione lugere et ieiunare usque dum moriar.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/004.yaml
  text: And I have come[a], as you see, into this field. I intend to return to the city no more, but to stay here; and I will neither eat nor drink, but without ceasing I will mourn and fast until I die.”
translation:
  language: zh_hans
  text: 我来到这片田野，如你所见。我打算不再回城，而留在这里；我既不吃也不喝，要不断地哀哭和禁食，直到死去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogito
  choice: 我已决定
  rationale: 该词后接不定式，在这里表达打算、定意，而非尚未确定的思量；结合下文坚决禁食至死的语气，译为“决定”自然且贴合语境。
- source_word: iam non reuerti
  choice: 不再回城
  rationale: iam non 在此表示“再也不、不再”，而不是“现在不”；reuerti in ciuitate 指返回城里。
- source_word: hic consistere
  choice: 留在这里
  rationale: consistere 在与“回城”相对的语境中指停留、待在此处。
- source_word: sine intermissione lugere et ieiunare
  choice: 不停地哀哭禁食
  rationale: 保留“毫不中断”的强烈语气，并以现代汉语中自然、庄重的表达呈现哀悼与禁食两个并列行动。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。首句按拉丁文完成时译作“我来到”，避免生硬的“我已经来”；末句保留人物禁食至死的决绝语气。英文咨询文本中的脚注源于先前译法，且标记位置与内容不相符；拉丁文在此无需借脚注呈现实质歧义，因此不收入正文。
