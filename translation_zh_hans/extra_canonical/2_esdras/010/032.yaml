base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/032.yaml
  text: And I said, “Because you have utterly forsaken me. For I did according to your words and went out into the field, and behold, I saw and still see what I am not able to describe.”
translation:
  language: zh_hans
  text: 我说：“因为你彻底撇弃了我。我确实照你的话做了，出去到田野；看哪，我曾看见，如今仍看见我所不能述说的事。”他对我说：“你要站立得像个男子汉，并且——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquens dereliquisti me
  choice: 你彻底撇弃了我
  rationale: 以“彻底”传达拉丁语同根分词与限定动词叠用所形成的加强语气，同时保持自然的现代汉语。
- source_word: secundum sermones tuos
  choice: 照你的话
  rationale: sermones 在此指先前所说的吩咐或话语；译作“照你的话”简洁且符合上下文。
- source_word: exiui in campum
  choice: 来到田野
  rationale: 原文直译为“出去到田野”；汉语用“来到田野”更自然，并保留地点含义。
- source_word: ecce
  choice: 看哪
  rationale: 保留原文提示读者注意、表达惊异的语用作用及经文庄重感。
- source_word: uidi et uideo
  choice: 我曾看见、如今仍看见
  rationale: 明确呈现完成时与现在时的对照，强调异象从过去延续到当前。
- source_word: quod non possum enarrare
  choice: 我无法述说的景象
  rationale: 补出汉语所需的中心语“景象”，依据前文“看见”确定所指；“述说”保留 enarrare 详述、讲明的意味。
- source_word: Sta ut uir
  choice: 你要像个男子汉一样站稳
  rationale: 保留 ut vir 的性别化比喻和刚强站立之意，不将其抽象化为单纯“勇敢”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原始拉丁文本在“et”（“并且”）处中断，正文以破折号明确保留残缺状态；英文咨询层未收入后半句，但本稿依所给拉丁原文译出。
