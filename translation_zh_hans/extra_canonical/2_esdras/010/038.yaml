  text: 'dixit: audi me, et doceam te et dicam tibi de quibus times, quoniam altissimus reuelauit tibi mysteria multa. Vidit enim'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/038.yaml
  text: And he said, “Listen to me, and I will teach you, and I will tell you about the things you fear, because the Most High has revealed many mysteries to you.
translation:
  language: zh_hans
  text: 他说：“听我说，我要教导你，也要告诉你有关你所惧怕之事的事，因为至高者已经向你启示了许多奥秘。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: audi me
  choice: 听我说
  rationale: 自然地表达拉丁语命令式“听我”，符合现代汉语对话习惯。
- source_word: doceam te
  choice: 我要教导你
  rationale: 保留 doceam 的教导含义及后续行动语气，不弱化为一般性的“解释”。
- source_word: de quibus times
  choice: 你所惧怕的那些事
  rationale: 保留关系结构及 times 的“惧怕”语义，不擅自具体化其所指。
- source_word: altissimus
  choice: 至高者
  rationale: 采用尊严而通行的神圣称谓，准确对应最高级名词化用法。
- source_word: mysteria multa
  choice: 许多奥秘
  rationale: 保留 mysteria 的隐秘、神圣启示内涵以及 multa 的数量意义。
- source_word: reuelauit tibi
  choice: 已经向你启示了
  rationale: “启示”准确表达揭开隐秘使人知晓之意；“已经”体现完成时。
theological_decisions:
- issue: “奥秘”的性质
  choice: 不具体说明奥秘的内容或类别
  alternative: 译作“许多隐秘的事”或加入神圣计划等解释
  rationale: 原文仅用 mysteria，保持其宽泛而带启示色彩的含义，避免导入额外神学解释。
- issue: 至高者启示与说话者教导之间的关系
  choice: 按原文并列保留，不解释二者如何关联
  alternative: 将“因为”解释为听者有资格或有能力领受进一步教导
  rationale: quoniam 表明因由，但其具体逻辑仍有张力，译文不应替原文消解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。严格依照本节可独立成句的文本止于 multa；原始资料末尾的“Vidit enim”显然开启下一句，未纳入本节正文。
