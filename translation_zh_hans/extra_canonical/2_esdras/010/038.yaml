  to: 他说：“听我说，我要教导你，也要告诉你有关你所惧怕之事的事，因为至高者已经向你启示了许多奥秘。”
  rationale: 仅调整 dicam tibi de quibus times 的汉语表达，以明确保留 de 的“有关”关系。其余措辞均可保留；本节止于 multa，未将下一句开头的“Vidit enim”纳入。
