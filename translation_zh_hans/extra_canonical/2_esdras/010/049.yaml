  text: filium luget, et tu inchoasti consolare eam de his quae contigerunt †haec erant tibi aperienda†. Et nunc uidens altissimus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/049.yaml
  text: And behold[a], you saw her likeness, how she mourns for her son, and you began to comfort her concerning what had happened. These things had to be revealed to you.
translation:
  language: zh_hans
  text: 她为儿子悲哀，你便开始就所发生的事安慰她。这些事必须向你显明[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向你开启。”
    reason: 拉丁文 aperienda 的字面意思可作“被开启”，在此语境中也可表示“被揭示、显明”。
lexical_decisions:
- source_word: luget
  choice: 悲哀
  rationale: 表达持续为死去的儿子哀悼的状态，语气庄重自然。
- source_word: inchoasti consolare
  choice: 开始……安慰
  rationale: 保留拉丁文所强调的动作起始，不简化为单纯的“安慰”。
- source_word: de his quae contigerunt
  choice: 就所发生的事
  rationale: 保持原文对事件内容及承受者的含蓄，不擅自补成“她所遭遇的事”。
- source_word: aperienda
  choice: 显明
  rationale: 在启示文学语境中表示揭示、披露；比机械直译为“打开”更符合现代汉语，同时由脚注保留字面意象。
theological_decisions:
- issue: aperienda是否具有专门的神圣启示含义
  choice: 译作“显明”
  alternative: 译作“开启”或“揭示”
  rationale: “显明”能表达这些事必须让以斯拉知晓，又不额外断定启示的具体方式；脚注保留字面译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。依照所给拉丁文本翻译本节完整句意；末尾“Et nunc uidens altissimus”语法上开启下一句，未纳入本节。英语咨询层中的“看哪，你看见了她的形象”在所给拉丁文本中无对应词句，因此未增补。
