  text: propterea enim dixi tibi, ut maneres in campo, ubi domus non est aedificata.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/051.yaml
  text: For this reason I told you to remain in the field where no house has been built[a].
translation:
  language: zh_hans
  text: 正因如此，我叫你留在那片还没有房屋建成的田野里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有房屋被建造的田野里。”
    reason: 拉丁语 est aedificata 由现在时 est 和完成被动分词构成，可表达尚未完成建造的当前结果状态；正文以自然汉语表达该状态，脚注保留被动表达。
lexical_decisions:
- source_word: propterea enim
  choice: 正因如此
  rationale: 表达承接上文的因果关系；“正”体现 enim 的强调和说明语气，不生硬译作独立的“因为”。
- source_word: dixi tibi
  choice: 我才吩咐你
  rationale: 在要求对方留在某处的语境中，dixi tibi 不只是陈述“对你说”，而是带有指示意味；“吩咐”自然体现这一语用功能。
- source_word: maneres
  choice: 留在
  rationale: 未完成过去虚拟式受 dixi 引导，表示先前吩咐的内容；汉语以“吩咐你留在”自然呈现。
- source_word: in campo
  choice: 在那片……田野里
  rationale: campus 指开阔的田野；加入量词“片”符合现代汉语，并由语境用“那”指明有关地点。
- source_word: ubi domus non est aedificata
  choice: 没有建造房屋的
  rationale: 保留关系从句对田野的限定，并将拉丁语完成时被动态表达的现存结果状态译为“没有建造”，不误作过去完成时。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“正因如此，我才……”清楚呈现因果承接；“没有建造房屋”保持原文单数 domus 在汉语中的非特指、类指用法。脚注标记已置于正文相应句末。
