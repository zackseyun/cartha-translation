  text: 我便停下仍在说的话，愤怒地回答说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: 停下了
  rationale: 此处指中止正在进行的言语；译作“停下”比字面的“离弃”更符合现代汉语语境。
- source_word: sermones in quibus adhuc eram
  choice: 自己仍在说的那些话
  rationale: 拉丁语直译近于“我仍在其中的那些话”，实际表示尚在进行中的一番话；此译保留“仍在”的未完状态，同时使中文自然。
- source_word: respondi
  choice: 回答说
  rationale: 兼顾“回答”的语义，并以“说”自然引出下文直接引语。
- source_word: cum
  choice: 愤怒地
  rationale: 现存引文以 cum 结尾，句法本身残缺；依据校勘文本及英语审校层所反映的连续读法，将其理解为引出方式状语，并表达为“愤怒地”。
