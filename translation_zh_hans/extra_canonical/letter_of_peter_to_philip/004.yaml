translation:
  language: zh_hans
  text: '“那么，关于诸永世的[缺损]，其情形如下：母的悖逆和轻率显露出来时，她脱离了父之伟大的秩序，想要设立诸永世。她一开口，那专横者便随之而来；但她舍下一部分时，专横者就将它夺去，于是它成了缺损。这就是诸永世的缺损。


    “专横者夺得那一部分后，便将它栽下，又在其上设置众权势和众权柄，并把它限制在必死的诸永世之内。宇宙中的一切权势都因自己得以产生而欢喜。[][a] 然而，他们不认识那先存的[父]，因为他们与他素不相属。[反而，这]专横者得了权柄，他们便敬拜他，赞美他。


    “由于众权势的赞美，专横者心里越发骄傲。他成了敌对者，想用[另一个像]替换一个像，用另一种形态替换一种形态。于是，他指派自己权下的众权势塑造必死的身体；这些身体因所造之像的不一致而产生。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处的空方括号“[]”保留所据见证对抄本残损或缺文的标示。
    reason: 让读者知道空括号并非排印错误，同时不臆补缺失内容。
  - marker: b
    text: 本段据所提供的公版英文见证暂译；科普特语原文尚待直接复核。方括号中的文字保留见证所标示的残损或编者复原。
    reason: 明确目前的文本基础及其暂定性质，避免把英文中介层当作已经完成的原文校勘。
lexical_decisions:
- source_word: aeons
  choice: 诸永世
  rationale: 保留该词在本篇宇宙论中既可指超世领域、又可指其人格化层级的含混性；用“诸”标明复数，不把它简化为普通的“时代”或“世代”。
- source_word: deficiency
  choice: 缺损
  rationale: 表达残缺、亏缺的状态及其宇宙论含义，同时避免用带有后设教义色彩的术语过度解释。
- source_word: Mother
  choice: 母
  rationale: 作为宇宙论中的称号处理，保留其专名式用法与简洁庄重的语体。
- source_word: the tyrannical one
  choice: 专横者
  rationale: 兼顾其施行压制、僭越权位的性质；不直接译作世俗政治意义较强的“暴君”。
- source_word: powers and authorities
  choice: 众权势和众权柄
  rationale: 保留两类超自然统治实体之间的并列，不将二者合并。
- source_word: pre-existent Father
  choice: 先存的父
  rationale: 直译其在其他存在者以前已经存在的含义，不进一步规定其形而上性质。
- source_word: image / form
  choice: 像／形态
  rationale: 维持原文两个近义而不完全相同的概念及其重复结构。
- source_word: disparity of the likeness
  choice: 所造之像的不一致
  rationale: 保留原句晦涩之处，避免擅自断定这是与某一神圣原型的偏离。
theological_decisions:
- issue: 母的行动与父之秩序的关系
  choice: “脱离了父之伟大的秩序”
  alternative: “在父的伟大所定的秩序之外”
  rationale: 保留其行动在既定秩序以外发生的意思，但不把原因解释成明确的道德堕落或预定事件。
- issue: 专横者所得权柄的来源
  choice: “得了权柄”
  alternative: “被授予权柄”或“夺取了权柄”
  rationale: 原见证采用被动表达，却未指明授予者；中文不补出施事者，也不改成主动篡夺。
- issue: 必死身体产生的原因
  choice: “因所造之像的不一致而产生”
  alternative: “由于所造之像偏离原型而产生”
  rationale: 保留见证文本中关系不明、语义紧张的表述，不增补一个未明说的原型。
- issue: “敌对者”的对象
  choice: 不补出对象
  alternative: “成了父的敌对者”
  rationale: 原文仅说其成为 opponent，未明确敌对谁；译文保持这一开放性。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。宇宙论称号与复数实体用“母”“父”“诸永世”“众权势”等表达；保留方括号、重复句法和末句的语义含混，不以宗派术语消解文本张力。
