    reason: 正文以脚注标记呈现见证中的空缺信息，避免在中文正文中留下难以理解的空方括号。
  revision_rationale: 修订仅纠正无底本依据的“圣”字增译，并恢复末句不明复数主体；同时微调两处祷文措辞，使现代汉语更自然而不消解原见证的重复、并列与句法张力。空校补标记继续以脚注保存，未将英语见证所排除的侵入性裸页码收入译文。
