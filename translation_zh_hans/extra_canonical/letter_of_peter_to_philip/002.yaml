translation:
  language: zh_hans
  text: '彼得于是把其余的人召集起来。他们前往那座名叫橄榄山的山；从前，那蒙福的基督住在肉身中时，他们常与他一同在那里聚集。


    使徒们聚集之后，便跪下祷告，说：


    “父啊，父啊，光明之父啊，

    那些不可毁灭者都属于你，

    求你垂听我们；

    正如你喜悦了你的圣子耶稣基督，

    因为他为我们的缘故，成了黑暗中的光[a]。

    实在地，求你垂听我们。”


    随后，他们再次祷告，说：


    “生命之子，不朽之子，

    住在光明中的那一位，

    圣子，不朽的基督，

    我们的救赎者，

    求你赐给我们力量，

    因为有人正在追捕我们，要杀害我们。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原见证在“光”之后保留一个空的校补标记“[]”，表示此处可能有缺文，但未提供可恢复的文字。
    reason: 正文以脚注标记呈现见证中的空缺信息，避免在中文正文中留下难以理解的空方括号。
lexical_decisions:
- source_word: Olivet
  choice: 橄榄山
  rationale: 采用现代中文读者熟悉的传统地名，同时保留原文“那座名叫……的山”的表述。
- source_word: blessed Christ
  choice: 蒙福的基督
  rationale: 保留“blessed”的被动或受福意味，不改写为容易产生不同神学侧重的“赐福的”。
- source_word: dwelt in the body
  choice: 住在肉身中
  rationale: 较形式地保留身体与居住的意象，不将其释义为单纯的“在世时”。
- source_word: indestructible ones
  choice: 不可毁灭者
  rationale: 保留原见证中称谓所指的开放性，不擅自解释为天使、圣徒或不朽者。
- source_word: deathlessness
  choice: 不朽
  rationale: 以自然而庄重的现代汉语表达不受死亡支配的状态；与下文基督称号保持一致。
- source_word: redeemer
  choice: 救赎者
  rationale: 保留救赎性称号，避免较狭义的“解救者”。
- source_word: they are hunting for us
  choice: 有人正在追捕我们
  rationale: 原文代词所指不明，中文以不定主体自然呈现，而不补定具体迫害者。
theological_decisions:
- issue: “那些不可毁灭者都属于你”的所指
  choice: 保留“不可毁灭者”这一不明确的群体称谓
  alternative: 解释为“不朽者”“圣徒”或“天上众灵”
  rationale: 现有依据仅为英语公共领域见证，科普特语复核尚待进行；不应提前锁定其本体论或群体身份。
- issue: 基督“住在肉身中”的表达
  choice: 直译为“住在肉身中”
  alternative: 意译为“在世时”或“成为肉身时”
  rationale: 原表达可能承载特殊的身体观或基督论张力，故不以较顺畅但解释性更强的措辞消解。
- issue: “生命之子／不朽之子／圣子／不朽的基督”的称号关系
  choice: 依原见证逐项保留重复称号
  alternative: 合并为一个顺畅的复合称号
  rationale: 祷文中的重复与并列可能具有礼仪和神学功能，不宜压缩。
- issue: “正如你喜悦了你的圣子”的语义
  choice: 译作“正如你喜悦了你的圣子”
  alternative: “正如你以你的圣子为乐”或“既然你喜悦你的圣子”
  rationale: 保留原见证中“just as”连接所产生的句法张力，不明确改成因果关系。
translation_notes:
  register: 采用现代、庄重而可朗读的祷文体。鉴于科普特语原文复核尚待进行，本稿以所给公共领域英语见证为临时底本；保留原文的重复、称号并列、代词指向不明及身体观表达。英语见证中的裸页码“[1]”视为侵入性页码，不收入正文；空校补标记则以[a]脚注说明。
