translation:
  language: zh_hans
  text: '随后，一道明亮的光显现出来；山因那显现者的显现而发光。有声音向他们呼喊说：


    “留心听我的话，好让我对你们说。

    你们为什么寻找我？

    我就是耶稣基督，始终与你们同在。”


    使徒回答说：


    “主啊，我们愿意明白众永世[a]的缺欠，

    也明白它们的圆满，

    以及我们为何被困在这居所里。

    我们是怎样来到这里的？

    我们将怎样离开？

    [……][b] 我们怎样才能有权柄坦然发言？

    那些权势[c]为什么与我们争战？”


    于是，有声音从光中向他们呼喊说：“正是你们见证我已把这一切告诉了你们；但因你们不信[d]，我要再说一遍。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永世”译自常译作 aeons 的术语；在这类古代文献中，它既可指漫长的时代，也可指宇宙性的领域或位格化存在。
    reason: 该词是关键术语，单一汉语词无法涵盖其全部语义。
  - marker: b
    text: 此处原文有缺损或残缺标记，无法确定是否遗漏了文字。
    reason: 保留底本所示的文本损坏信号，不作无根据的补写。
  - marker: c
    text: “权势”可能指宇宙性或超人间的势力；本段没有进一步说明其身份。
    reason: 防止读者将其误解为普通能力，也避免过度确定其性质。
  - marker: d
    text: “不信”也可理解为“缺乏信心”或“不忠信”。
    reason: 见证所用英文底本的对应词具有信与信实之间的语义幅度；科普特原文尚待复核。
lexical_decisions:
- source_word: aeons
  choice: 众永世
  rationale: 保留该文献中兼具宇宙时代与位格化领域意味的术语，不将其简化为普通的“世代”或直接音译，以便现代读者理解，同时由脚注说明其语义范围。
- source_word: fullness
  choice: 圆满
  rationale: 与“缺欠”构成原文的神学性对照，并保留其可能指完整状态或总体领域的开放性。
- source_word: dwelling-place
  choice: 居所
  rationale: 采用中性而庄重的表达，不预先断定这里特指世界、身体、物质界或监牢。
- source_word: authority for boldness of speech
  choice: 有权柄坦然发言
  rationale: 同时保留“获准/有权”与“勇敢、公开发言”两层含义，避免仅译成主观的勇气。
- source_word: powers
  choice: 权势
  rationale: 保留可能指超人间或宇宙性势力的含义，不擅自具体化为鬼魔、政权或普通能力。
- source_word: unfaithfulness
  choice: 不信
  rationale: 自然传达缺乏信心或信实的核心意义；脚注保留“缺乏信心/不忠信”的可能范围。
theological_decisions:
- issue: “众永世”的缺欠与圆满
  choice: 保留“缺欠—圆满”的对举，不解释其宇宙论体系
  alternative: 释译为“宇宙时代为何有所欠缺、又如何达到完全”
  rationale: 原文术语具有特定但未在本段充分界定的思想背景，正文不应代替作者补足体系。
- issue: “居所”的所指
  choice: 译作中性的“这居所”
  alternative: 译作“这个世界”“肉身”或“物质牢狱”
  rationale: 本段本身没有明确限定其指向，应保留真实歧义。
- issue: 与使徒争战的“权势”
  choice: 不指明其善恶类别或具体身份
  alternative: 译作“邪灵”“黑暗权势”或“统治者”
  rationale: 避免将后设神学分类导入未明说的句子。
- issue: 耶稣因门徒“不信”而重复教导
  choice: 直译责备性的因果关系
  alternative: 弱化为“因为你们还没有完全明白”
  rationale: 原文的张力在于门徒既作见证又受到不信的责备，不宜用“未明白”消解。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；保留原段落的呼告、问答和重复结构。由于科普特语原文复核尚未完成，本稿以所供公共领域英文见证为临时依据；对关键宇宙论术语、文本缺损和语义歧义均以正文或脚注明确保留，未引入宗派性解释。
