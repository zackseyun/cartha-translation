  naturalness: 译文总体庄重、可朗读。“山因那显现者的显现而发光”虽可理解，但重复生硬；调整为“山因那显现者显现的景象而发光”较合现代汉语，同时保留原句的重复强调。将“有权柄坦然发言”调整为“获得坦然发言的权柄”，语法关系更清晰。
  terminology: “永世”“圆满”“居所”“权势”均保留了文本的宇宙论及指涉歧义，脚注也没有作教派化解释。“不忠信”比“不信”更能覆盖英文见证的 unfaithfulness；脚注继续说明其可涵盖信心不足与不忠实两个方向。
