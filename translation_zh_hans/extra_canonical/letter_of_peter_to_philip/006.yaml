translation:
  language: zh_hans
  text: '“不过，至于你们被拘禁，那是因为你们属于我。你们除去自身那会朽坏的，就必在世人中成为光。


    “至于你们与诸权势争战，这是因为他们不像你们，得不到安息，也不愿你们得救。”


    使徒们又俯伏敬拜，说：“主啊，请教导我们：既然那些统治者比我们强大，我们该怎样与他们争战呢？”


    随即，有声音从显现中向他们呼喊说：“你们必须这样与他们争战，因为那些统治者攻击里面的人[a]。你们必须这样与他们争战：


    “你们要聚集在一起，向世人传讲救恩和应许[b]；要以我父的能力束腰，陈明你们的请求。父必帮助你们，正如他差遣我时曾帮助你们一样。〔……〕[c]不要[d]害怕，〔我要常与你们同在〕[e]，正如我从前住在肉身中时对你们说过的。”


    随后，闪电和雷声从天而来；他们先前在那里于显现中所看见的那一位，被接到天上去了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “里面的人”也可译作“内在的人”；这里保留其特殊称谓，不具体解释为灵魂、心灵或某种教义体系中的自我。
    reason: 原表达具有神学和人论上的开放性。
  - marker: b
    text: 本句也可理解为：“带着应许向世人传讲救恩。”
    reason: “救恩”与“应许”之间的句法关系并不完全确定。
  - marker: c
    text: 此处原见证以空方括号标示文本缺损；本译用“〔……〕”保留这一情况。
    reason: 忠实呈现手稿残缺信号。
  - marker: d
    text: “不要”中的相关文字为残缺后的补足。
    reason: 标明编辑性复原。
  - marker: e
    text: “我要常与你们同在”为残缺后的补足。
    reason: 标明编辑性复原，避免将推定文本呈现为完整存文。
lexical_decisions:
- source_word: detention
  choice: 被拘禁
  rationale: 保留受限制、被扣留的语义，不擅自具体化为监狱刑罚。
- source_word: powers
  choice: 诸权势
  rationale: 在本文超自然争战语境中采用兼具位格性与权力含义的表达，并与后文“统治者”有所区分。
- source_word: archons
  choice: 统治者
  rationale: 对应古代宗教文献中掌权者或宇宙统治势力的称谓，避免音译造成不必要隔阂。
- source_word: Inner Man
  choice: 里面的人
  rationale: 保留原表达的人论张力，不解释成特定教派所定义的“灵魂”或“属灵自我”。
- source_word: gird yourselves
  choice: 束腰
  rationale: 保留古代预备行动、装备自己的形象，同时用上下文“以……能力”使现代读者可理解。
- source_word: apparition
  choice: 显现
  rationale: 表达可见的超常显现，不预断其具体形态是异象、幻影还是实体显现。
- source_word: dwelt in the body
  choice: 住在肉身中
  rationale: 较贴近见证文本的身体表述，避免改写成带有额外基督论判断的措辞。
theological_decisions:
- issue: 诸权势不得安息与信徒安息之间的对比
  choice: “他们不像你们，得不到安息”
  alternative: “这争战是因他们没有你们所有的安息”
  rationale: 保留比较关系，同时避免断言这里的“安息”具有某一特定救恩论定义。
- issue: 救恩与应许的句法关系
  choice: “传讲救恩和应许”并加脚注
  alternative: “带着应许向世界传讲救恩”
  rationale: 底本措辞可理解为救恩伴随应许，也可理解为并列传讲；正文采用自然表达，脚注保留歧义。
- issue: 父帮助门徒与帮助受差遣者的表述
  choice: “正如他差遣我时曾帮助你们一样”
  alternative: “正如他差遣我时曾帮助我一样”
  rationale: 依所提供见证的代词保留“帮助你们”，不以神学顺畅为由擅改，但承认该句可能受文本传承或翻译影响。
- issue: 残缺处的重构
  choice: 以方括号及省略号标示缺文，并将补足文字置于方括号内
  alternative: 无标记地译成完整句子
  rationale: 明确区分现存文字与编辑补足，不让读者误以为残缺部分完全确定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。因科普特语原文复核尚未完成，本稿依据所提供的公共领域英文见证拟定；方括号所反映的缺损与复原信息予以保留。
