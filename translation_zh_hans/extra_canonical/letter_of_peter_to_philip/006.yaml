  source_fidelity: 整体准确反映所给英文见证，且没有把“诸权势”“统治者”或“内在的人”过度教义化。不过，“得不到安息”把“lacking rest”加强为无法获得安息；“俯伏敬拜”则为 worshipped 增添了原见证未明说的姿势。残缺及复原文字在正文中的括号标示也须更严格对应英文见证。
  naturalness: 文体庄重、现代，整体通顺。将“里面的人”改为较自然且仍保留术语性质的“内在的人”；将“陈明你们的请求”改为“提出你们的请求”，表达更符合现代汉语。
  terminology: 保留“诸权势”与“统治者”的区分是合宜的；“内在的人”保留 Inner Man 的特殊称谓而不预设其教义含义；“显现”“肉身”也与见证的措辞和体裁相称。
