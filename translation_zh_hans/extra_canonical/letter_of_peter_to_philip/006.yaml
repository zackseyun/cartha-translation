review_pass:
  verdict: revise
  source_fidelity: 整体忠于所提供的英文见证，并适当地保留了残缺和复原标记；但“不得安息”将“lacking rest”略微强化为不能得到安息，“攻击里面的人”也比原文反复使用的“war against”更具体。末句语序则不够清楚地对应“in that place…in the apparition”。
  naturalness: 文体庄重、可读。个别措辞可更自然准确：以“没有安息”表达状态，以“交战”维持动词的一致性；“陈明你们的请求”改为“提出你们的请求”；末句重组以消除“先前在那里于显现中”的歧义。
  terminology: “诸权势”“统治者”“里面的人”“显现”“肉身”等核心术语处理审慎。“统治者比我们强大”可改为“统治者胜过我们”，较贴近 superior 而不专指武力。残缺处应使用方括号，且保留英文见证中的空方括号信号。
  issues:
  - severity: medium
    issue: “得不到安息”较原见证的“lacking rest”更具不能获得的含义。
    rationale: 原文所给见证陈述诸权势“没有／缺乏安息”，未明确其不能获得安息；改为“没有安息”更中性。
  - severity: low
    issue: “攻击里面的人”收窄了“war against the Inner Man”的争战意象。
    rationale: 同段两次要求门徒“争战”；译为“与‘里面的人’交战”可保留原见证的用词和比喻力度。
  - severity: low
    issue: 末句“他们先前在那里于显现中所看见的那一位”语序不自然，地点与显现的修饰关系不清。
    rationale: 重组为“他们在那地方、在显现中所看见的那一位”可清楚保留两个修饰语。
  - severity: low
    issue: 空方括号被改写为“〔……〕”，未逐字保留见证所示的空方括号。
    rationale: 既然译注说明要保留残缺信号，正文宜用“[]”；中文复原内容仍以方括号标记。
  revised_text: '“不过，至于你们被拘禁，是因为你们属于我。你们若除去自身那会朽坏的，就必在世人中成为光。


    “至于你们与诸权势的争战，是因为他们没有安息，不像你们；他们也不愿你们得救。”


    使徒们又俯伏敬拜，说：“主啊，请教导我们：既然那些统治者胜过我们，我们该怎样与他们争战呢？”


    随即，有声音从那显现中向他们呼喊说：“你们必须这样与他们争战，因为那些统治者与里面的人[a]交战。你们必须这样与他们争战：


    “你们要聚集在一起，向世人传讲救恩，连同应许[b]；要以我父的能力束腰，提出你们的请求。父必帮助你们，正如他差遣我时曾帮助你们一样。[] [不要]害怕，[我要常与你们同在]，正如我从前住在肉身中时对你们说过的。”


    随后，闪电和雷声从天而来；他们在那地方、在显现中所看见的那一位，被接到天上去了。'
