base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/008.yaml
  text: 'Peter [then] gathered [the others] and said, “Our Lord Jesus Christ, author of our rest, give us a spirit of understanding so that we too may perform wonders!”


    Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each one performed healings. They went out to proclaim the Lord Jesus. Later they gathered again, greeted one another, and said, “Amen.”


    Jesus then appeared and said to them, “Peace be with [all] of you and with everyone who is faithful in my name. As you go, joy, grace, and power will be yours. Do not be afraid. I will be with you always.”


    The apostles then parted from one another for their four preaching missions, and they went in peace with the power of Jesus.


    The Letter of Peter to Philip.'
translation:
  language: zh_hans
  text: '彼得[随后]召集了[其余的人]，说：“我们的主耶稣基督，成就我们安息的那一位，求你赐给我们悟性的灵，使我们也能行奇事！”


    彼得和其他使徒随后看见了[他]。他们被圣洁的灵充满，各人都施行医治。他们出去宣扬主耶稣；后来又聚在一起，彼此问安，说：“阿们。”


    耶稣随后显现，对他们说：“愿平安临到你们[众人]，也临到所有忠于我名的人。你们出去时，必有喜乐、恩典和能力与你们同在。


    “不要害怕。看哪，我必常与你们同在。”


    使徒随后彼此分开，分作四路去传道；他们带着耶稣的能力，平安地前行。


    《彼得致腓力书》'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: author of our repose
  choice: 成就我们安息的那一位
  rationale: 保留“安息”这一具有神学意味的核心意象，同时避免把“author”机械译成现代著作意义上的“作者”。
- source_word: a spirit of insight
  choice: 悟性的灵
  rationale: “悟性”自然表达洞察和理解能力；保留“灵”的措辞，不将其直接等同于后文的圣灵。
- source_word: a holy Spirit
  choice: 圣洁的灵
  rationale: 英文见证保留不定表达；译作“圣洁的灵”可避免在源语言复核前过早确定为专名“圣灵”。
- source_word: performed healings
  choice: 施行医治
  rationale: 准确表达使徒实际医治他人的行动，比“进行了治疗”更符合庄重叙事语体。
- source_word: four messages / four preaching missions
  choice: 分作四路去传道
  rationale: 底本文句异常，英文POB将其理解为四项传道使命；此译法保留“四”的信息，又不把不确定的“messages”实体化为四篇信息。
- source_word: with peace
  choice: 平安地前行
  rationale: 在现代汉语中自然呈现他们带着平安出发的状态，同时不把“平安”弱化为单纯的安全。
theological_decisions:
- issue: “a holy Spirit”是否直接译作专名“圣灵”
  choice: 圣洁的灵
  alternative: 圣灵
  rationale: 所供材料注明科普特语复核尚待完成，且英文见证特意使用不定冠词和小写“holy”；因此暂不替文本消除其可能的语法与神学张力。
- issue: 耶稣应许同在的持续性
  choice: 我必常与你们同在
  alternative: 我会一直与你们同在
  rationale: “常”兼具自然、庄重和持续之意，并忠实呈现 continually/always，而不额外界定其方式。
- issue: “faithful in my name”的关系含义
  choice: 忠于我名的人
  alternative: 信我名的人
  rationale: “忠于”保留 faithful 可能包含的信靠与忠诚，不把它仅缩减为一次性的认信。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留见证文本中表示残缺复原的方括号；删除打断句意的裸页码。结尾重复材料按用户所给 English POB 的结论范围译出。由于科普特语源文复核尚待完成，对“圣洁的灵”和“四路去传道”等不确定处采取审慎表达。
