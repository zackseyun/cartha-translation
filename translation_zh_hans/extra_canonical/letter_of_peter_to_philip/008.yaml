    彼得和其他使徒随后看见了[他]。他们被圣洁的灵充满，各人都施行医治。他们出去宣扬主耶稣；后来又聚在一起，彼此问安，说：“阿们。”


    耶稣随后显现，对他们说：“愿平安临到你们[众人]，也临到所有对我的名忠信的人。你们出去时，必有喜乐、恩典和能力与你们同在。


    “不要害怕。看哪，我必常与你们同在。”


    使徒随后彼此分开，分为四个传道使命；他们带着耶稣的能力与平安前行。


    《彼得致腓力书》'
  revised_footnotes: []
