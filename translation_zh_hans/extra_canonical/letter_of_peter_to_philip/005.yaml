base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/005.yaml
  text: “Now concerning the fullness, I, [yes] I, was sent down into the body for the sake of this seed that had been lost, and I descended into their mortal mold. But they did not recognize me, because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you also have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. Since he was deficiency, he became fullness.
translation:
  language: zh_hans
  text: “现在，关于圆满：是我，[正是]我，为了这失落的种子，被差遣降到身体里；我降入了他们必死的形体中。然而，他们没有认出我，以为我是一个必死的人。我与那属于我的人说话，他留心听了我，正如你们今天也留心听了一样。我赐给他权柄，使他得以进入其父性所承受的产业；我带了[他]……[……]充满[……]借着他的救恩。因为他原是欠缺，后来成了圆满。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英文见证译出；科普特文原文复核尚待完成。方括号与省略号表示补字、残缺或抄本损坏；“我带了[他]……充满……”一段文字残缺，句法与确切含义无法确定。
    reason: 明确底本限制，并保存抄本残损与复原标记所反映的不确定性。
lexical_decisions:
- source_word: fullness
  choice: 圆满
  rationale: 保留本文中与“欠缺”相对的抽象、宇宙论意味；较“丰盛”更能呈现完整状态。
- source_word: seed
  choice: 种子
  rationale: 采用直译，保留其可指群体、本源或属灵后裔的多义性，不擅自解释。
- source_word: mortal mold
  choice: 必死的形体
  rationale: “形体”表达被塑成的外在样式，“必死的”保留与说话者身份之间的张力。
- source_word: the one who is mine
  choice: 那属于我的人
  rationale: 保留所属关系，不具体认定其身份。
- source_word: fatherhood
  choice: 父性
  rationale: 保留抽象名词及其可能的神学专门含义，避免缩窄为“父亲的身份”或“父的国度”。
- source_word: deficiency
  choice: 欠缺
  rationale: 与“圆满”形成概念对照，同时保持自然、可懂的现代汉语。
theological_decisions:
- issue: “身体”是单数，而“他们的必死形体”含群体指向
  choice: 依原见证保留“身体”与“他们……形体”的数和指向差异
  alternative: 统一译为某一个人的肉身
  rationale: 该段可能同时涉及降临、群体及代表性人物；不应在译文中消除这种张力。
- issue: “进入其父性所承受的产业”的关系
  choice: 保留“父性”与“产业”的抽象组合
  alternative: 解释为“承受他父亲的产业”
  rationale: 原见证的措辞异常且可能具有专门宇宙论意义，宜避免将其普通化为家庭继承。
- issue: 结尾救恩的归属
  choice: 译作“借着他的救恩”
  alternative: 译作“借着我对他的拯救”或“借着他所施的拯救”
  rationale: 代词关系在现有英文见证中并不明确，故保留属格歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“圆满／欠缺”“父性”“种子”等可能具有专门神学或宇宙论含义的词，不作宗派化阐释。由于直接科普特文审校尚未完成，本稿属于基于公版英文见证的暂定译稿。
