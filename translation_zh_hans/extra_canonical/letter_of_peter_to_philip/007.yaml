translation:
  language: zh_hans
  text: '使徒们便用各样赞美感谢主，然后返回耶路撒冷。


    他们下山往耶路撒冷去的时候，一路谈论那显现出来的光；随后，他们为主的事争论起来，说：“我们的主尚且受了苦，何况我们呢？”


    彼得回答说：“他为我们受了苦；我们也必须受苦，因为我们是微小的。”


    随后有声音临到他们，说：“我多次告诉过你们，你们必须受苦。你们必被拉到会堂里，又被带到总督面前，因而受苦。然而，那不受苦的人，他也[必]不……[……我的]父[……]，使他能够[……]。”[a]


    使徒们却非常喜乐，便上耶路撒冷去。他们进了圣殿，奉主耶稣基督的名教导人得救之道，并医治了许多人。


    彼得开口对门徒说：“我们的主耶稣住在肉身中时，把一切都告诉了我们，因为他亲自降了下来。我的弟兄们，要留心听我的话。”


    他被一位圣灵充满，就这样说：


    “我们的光耶稣[降]下，

    被钉在十字架上；

    他戴上荆棘冠冕，

    披上紫袍，

    被挂在木头上，

    被安葬在坟墓里，

    又从死人中复起。


    “我的弟兄们，耶稣与这样的苦难本不相干；然而，我们才是因母亲的过犯而受苦的人。因此，他在我们中间时，用象征的含义宣告了这一切。主耶稣是父无量荣耀之子，也是我们生命的创始者。


    “我的弟兄们，我们不要理会这些不敬神的人，也不要行在……[……]中。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此句在手稿中严重残缺；方括号和省略号表示残损或推定恢复的文字，因此无法确定完整句意。
    reason: 提醒读者不可从残句建立确定的受苦或得救教义。
  - marker: b
    text: 结尾处手稿残缺，无法确定“行在”之后的内容。
    reason: 如实标明文本中断，避免猜补。
lexical_decisions:
- source_word: on account of our being small
  choice: 因为我们是微小的
  rationale: 保留见证文本中不寻常且可能具有宇宙论或属灵含义的“small”，不擅自解释为软弱、卑微或人数少。
- source_word: synagogues
  choice: 会堂
  rationale: 采用现代中文中对犹太宗教集会场所的常用译法。
- source_word: governors
  choice: 总督
  rationale: 保留政治司法场景，避免泛化成普通官员。
- source_word: dwelt in the body
  choice: 住在肉身中
  rationale: 贴近原见证的身体—居住表述，不改写成较具教义定向的“道成肉身”。
- source_word: a holy Spirit
  choice: 一位圣灵
  rationale: 英文见证使用不定冠词；译文保留其非特指形式，不静默等同于定冠的“圣灵”。
- source_word: hanged on a tree
  choice: 被挂在木头上
  rationale: 保留“tree/wood”的表达及其传统回响，不与前句“十字架”合并。
- source_word: alien to such suffering
  choice: 与这样的苦难本不相干
  rationale: 表达“alien to”的疏离、非本属关系，同时避免误读为民族意义的“外人”。
- source_word: the Mother
  choice: 母亲
  rationale: 保留原见证的称谓及其含混宇宙论背景，不擅自确认具体所指。
- source_word: author of our life
  choice: 我们生命的创始者
  rationale: 兼顾源头、发起者之义；不窄化为单纯的作者或救主。
- source_word: Godless ones
  choice: 不敬神的人
  rationale: 用自然而庄重的现代汉语表达，避免“无神论者”这一现代哲学标签。
theological_decisions:
- issue: 耶稣受苦与“与这样的苦难本不相干”之间的张力
  choice: 两种表述并置保留
  alternative: 将后句解释为耶稣只在表象上受苦，或解释为苦难并非他应得
  rationale: 文本本身先叙述受难，后又称耶稣与这种苦难不相干；译文不替文本消解这一神学张力。
- issue: “母亲的过犯”的身份
  choice: 直译为“母亲的过犯”
  alternative: 明确解释为夏娃、智慧或某一宇宙论实体
  rationale: 现有见证不足以无歧义确定所指，应保留称谓的开放性。
- issue: 圣灵是否特指
  choice: 译作“一位圣灵”
  alternative: 译作“圣灵”或“圣灵充满了他”
  rationale: 英文证据明确呈现不定形式；在科普特语直接复核完成前保留这一差异。
- issue: 受苦是否是得救条件
  choice: 仅按残存文字译出，不补足逻辑
  alternative: 补成“不受苦的人不能认识我的父”之类完整命题
  rationale: 关键句严重残缺，任何补全都会导入未经证实的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。诗性受难段落按行排列，以保留原见证的节奏。底本为公共领域英文见证，尚待科普特语直接复核；译文因此保留方括号、残缺、省略和关键术语的真实含混。裸露的手稿页码[4]、[5]未收入正文；英文中的拼写误植已按“使徒”处理。
