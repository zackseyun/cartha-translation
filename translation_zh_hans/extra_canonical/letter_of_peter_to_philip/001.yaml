    issue: 第二处缺文锚点位置不对应
    rationale: 英文见证的“[] our Lord Jesus Christ”将缺损／复原不确定性置于“我们的主耶稣基督”之前；草稿却在“救恩”之后标注[b]，而脚注文字又说缺损在该称号之前。应将[缺文][b]直接移至相应位置。
  - severity: medium
    issue: “到我们这里来”无来源依据
    rationale: 见证仅说“to come in accordance with the directives”，并未明说腓力须到彼得等人所在之处。加入“到我们这里”缩窄了原文含义，应删去。
