base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/001.yaml
  text: '[] The Letter of Peter, which he sent to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our beloved brother and fellow apostle, and also to the brothers who are with you. Greetings.


    I want you to understand, our brother, that we received instructions from our Lord, the Savior of the whole world, to gather together so that we might teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to gather together to learn how we could coordinate with one another so that we might proclaim the message.


    Therefore, our brother, would it be acceptable to you to come in accordance with the instructions of our God, Jesus?


    When Philip received and read this, he went to Peter, rejoicing with delight.'
translation:
  language: zh_hans
  text: '[缺文][a] 彼得写给腓力的信。


    耶稣基督的使徒彼得，写信给我们亲爱的弟兄、与我们同作使徒的腓力，也写给和你在一起的众弟兄。问候你们！


    我们的弟兄，我希望你明白：我们已经从我们的主、全世界的救主那里领受了指示，要我们聚集在一起，好教导并宣讲我们的主耶稣基督向我们应许的救恩[b]。


    可是，你离开了我们，不愿和我们聚集在一起，学习我们该怎样彼此配合，好传扬这信息。


    所以，我们的弟兄，你愿意遵照我们的上帝耶稣所给的指示，到我们这里来吗？[c]


    腓力收到这封信，读过以后，就满心欢喜地到彼得那里去了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处抄本有缺损；现存文字从缺文之后开始。
    reason: 保留原见证在标题前以方括号标出的抄本残缺。
  - marker: b
    text: “我们的主耶稣基督”之前，抄本有缺损。
    reason: 标明原见证第二处方括号所表示的残缺或复原不确定性。
  - marker: c
    text: 原文直译为“遵照我们的上帝耶稣的指示”；这里保留了对耶稣的这一称呼。
    reason: 提醒读者该句不寻常但具有神学意义的同位表达并非译者自行增添。
lexical_decisions:
- source_word: apostle / co-apostle
  choice: 使徒／与我们同作使徒
  rationale: 采用现代中文基督教文献中通行且清楚的“使徒”；“与我们同作使徒”保留共同职分的含义。
- source_word: directives
  choice: 指示
  rationale: 既表达权威性的吩咐，又避免把原文过度具体化为正式法规或单一命令。
- source_word: assemble together
  choice: 聚集在一起
  rationale: 保留共同聚集的动作，不预设礼仪性或制度性的“聚会”。
- source_word: coordinate ourselves
  choice: 彼此配合
  rationale: 用自然现代汉语表达共同协调行动的意思，同时避免加入原文未明说的组织架构。
- source_word: announce the message
  choice: 传扬这信息
  rationale: “信息”保留所传内容未被进一步界定的开放性；“传扬”符合庄重而易懂的语体。
- source_word: delighting with glee
  choice: 满心欢喜
  rationale: 自然传达强烈喜悦，避免中文中显得重复或轻佻的措辞。
theological_decisions:
- issue: “our God, Jesus”中耶稣与“我们的上帝”的同位关系
  choice: 我们的上帝耶稣
  alternative: 我们的上帝所吩咐的，耶稣／我们的主耶稣
  rationale: 见证文本直称耶稣为“我们的上帝”；译文保留这一神学表述及其张力，不将其改写为较熟悉的称号。
- issue: “the salvation promised to us by ... our Lord Jesus Christ”的施事关系
  choice: 我们的主耶稣基督向我们应许的救恩
  alternative: 所应许给我们的、出于我们主耶稣基督的救恩
  rationale: 按所据英文见证，将应许的发出者理解为主耶稣基督；同时以脚注标明该处前有缺文，避免掩盖文本不确定性。
- issue: “the savior of the entire world”
  choice: 全世界的救主
  alternative: 整个世界的拯救者
  rationale: “救主”庄重自然，也直接保留其普世范围，不附加有关救恩实现方式或范围的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文书信体。称呼与叙事尽量自然，同时保留抄本缺损和“我们的上帝耶稣”等不寻常表达。由于科普特文原文复核尚未完成，本稿以所提供的公版英文见证为暂定依据；后续应对照《拿戈玛第文库》VIII,2及《恰科斯抄本》的科普特文本校订。
