base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/073.yaml
  text: And in the spirit of every man who exists with me[a], and the women who are in me— I am the honored one[f][e][d][c][b], and the one who is praised.
translation:
  language: zh_hans
  text: '在每一个与我同在之人的灵里，


    也在那些在我里面的女人身上，


    我就是那受尊崇的，


    也是那受颂赞的。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲙ̄ⲡⲛⲁ
  choice: 在……的灵里
  rationale: ⲡⲛⲁ在此指人的灵或内在生命；与属人的ⲣⲱⲙⲉ相连时，“灵”比“气息”或“风”更合语境。
- source_word: ⲣⲱⲙⲉ ⲛⲓⲙ ⲉⲧϣⲟⲟⲡ
  choice: 每一个……之人
  rationale: 依校订所指出的分词方式，将OCR连写理解为ⲣⲱⲙⲉ ⲛⲓⲙ加关系从句ⲉⲧϣⲟⲟⲡ，即“每一个存在/在场的人”。中文用“每一个……之人”保留单数泛指。
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: 与我同在
  rationale: 这是“存在、在场”与“和我一起”的自然组合；“同在”兼顾存在和陪伴之意。
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: 女人
  rationale: 该词通常意为“女人”；此处与前面的“人”形成并列，不宜释为“妻子”。
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: 那些在我里面的
  rationale: 将ⲛ̄ϩⲏⲧ按带第一人称单数后缀的介词理解为“在我里面”，并与前句“与我同在”相呼应，而不补出原文没有的“心”。
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: 那受尊崇的
  rationale: 按ⲧⲁⲉⲓⲟ“尊崇、尊荣”的被动/状态意义理解，为阴性定冠词关系结构，指女性说话者是受尊崇者。
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ
  choice: 那受颂赞的
  rationale: ⲥⲙⲟⲩ在此作“颂赞、称颂”，结构可直译为“他们所颂赞的”；中文被动表达保留其意义并与上一句平行。
theological_decisions:
- issue: 说话者与众人的内在关系
  choice: 保留“在人的灵里”及“女人在我里面”的双向内在表达
  alternative: 将两处都泛化为陪伴或象征性关联
  rationale: 原文刻意并置“与我同在”和“在我里面”，形成富有张力的互在关系；译文不将其系统化为某种特定教义。
- issue: “受尊崇”与“受颂赞”的身份宣告
  choice: 按两个平行的被动称谓翻译
  alternative: 译作“我的形体”和“你的名字”
  rationale: 词形与语法更支持“受尊崇者”和“受颂赞者”；这样也保留作品连续自我宣告的修辞，但不额外赋予神性称号。
translation_notes:
  register: 采用现代、庄重而可诵读的简体中文。“灵”“同在”“在我里面”贴近原文的空间与内在意象；末两行保持平行句式。因本段虽有OCR问题，但校订后的主要词义足够明确，正文不加脚注。
