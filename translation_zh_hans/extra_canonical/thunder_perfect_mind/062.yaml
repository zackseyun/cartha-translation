  language: zh_hans
  text: 认识我的人，以及认识我肢体的人，你们要把大的和小的安置在最初的受造物中；你们要认识幼年，不要厌弃它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的科普特文实际包含“认识我”“我的肢体”“大的和小的”“最初的受造物”“幼年”及“不要厌弃它”等语句，并未清楚出现英文校订层所译的“你们隐藏自己／我将被看见”。因此正文依现有原文证据翻译；本段编号与底本行文可能错位，仍需据校勘本重新核对。
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲙⲓⲛⲉ
  choice: 安置
  rationale: 该词在此处后接“大者和小者”，按“设立、安置、使稳固”的常见及物义理解；所给科普特文没有充分依据把它译作“隐藏自己”。
- source_word: ⲙⲉⲗⲟⲥ
  choice: 肢体
  rationale: 保留希腊借词 melos 所含的“身体部位／成员”双重可能，不限定为某一宗教组织中的“成员”。
- source_word: ⲕⲧⲓⲥⲙⲁ
  choice: 受造物
  rationale: 该希腊借词可指被创造之物；“受造物”比抽象的“创造”更符合复数语境。
- source_word: ⲧⲙⲛⲧϣⲏⲣⲉ ϣⲏⲙ
  choice: 幼年
  rationale: 字面涉及“小孩子的状态／幼小”，译作“幼年”简洁保留生命阶段或幼小状态的开放性。
- source_word: ⲙⲡⲣⲙⲉⲥⲧⲱⲥ
  choice: 不要厌弃它
  rationale: ⲙⲡⲣ 表否定命令，后续动词表达憎恨或厌恶；用“厌弃”符合庄重诗性语域，并以“它”回指幼年。
theological_decisions:
- issue: “我的肢体”是否专指宗教共同体成员
  choice: 保留“肢体”这一身体性表达
  alternative: 我的成员／属我的人
  rationale: 原文可同时唤起身体部分与群体成员的含义，不应在译文中预先限定其教会论意义。
- issue: “最初的受造物”所指为何
  choice: 不具体指认其宇宙论身份
  alternative: 最初受造的人／最初的诸灵
  rationale: 原文仅给出受造物及先后关系，未明确其类别，故保留开放性。
translation_notes:
  register: 采用现代、庄重而易懂的散文诗语体；以分号呈现两组相连的劝告。由于OCR文本及分段映射存在明显疑点，正文优先服从实际提供的科普特文，不据英文咨询层补入原文未见的“隐藏／显现”对举。
