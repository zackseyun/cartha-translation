  terminology: “肢体”“受造物”可保留，且不应把 ⲙⲉⲗⲟⲥ 限定为宗教团体成员。ⲧⲙⲛⲧϣⲏⲣⲉ ϣⲏⲙ 宜译为“幼童的状态／幼小状态”，不可译作“认识幼年”。ⲡⲉⲧⲛⲟⲩⲟⲉⲓⲉ 的连写与句法受 OCR 分词影响，暂译“可见者”，并以脚注说明其不确定性。
