base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/046.yaml
  text: 'and she who has no image among the barbarians[1].

    I am the one they have hated in many places,

    and I am the one they have loved in many places[b][a][3][2].

    I am the one they call “Death,”

    and I am the one they call “the Law.”'
translation:
  language: zh_hans
  text: '她也是在异族人中没有形像的那一位。[a]


    我是那在各处被人憎恨的，

    也是那在各处被人爱的。[b]


    我是他们称为“死亡”的那一位，

    也是他们称为“律法”的那一位。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “形像”也可理解为“样式”或“相似之处”；本句原文简略，具体所指并不明确。
    reason: lexical_ambiguity
  - marker: b
    text: “在各处”也可译为“在每一处”；也有意见把这一表达理解为较宽泛的“在许多地方”。
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲉⲧⲉ ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ ⲙⲙⲁⲩ
  choice: 没有形像的那一位
  rationale: 按科普特文否定所有结构直译，并保留“形像／样式”所具有的开放含义，不补入先前误译中的反问。
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: 在异族人中
  rationale: 该词是希腊语 barbaros 的借词；“异族人”既传达希腊文化中的内外之分，也避免现代汉语“野蛮人”不必要的强烈贬义。
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: 我是……那一位
  rationale: 保持诗歌反复出现的自我宣告句式，同时使用自然庄重的现代汉语。
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ / ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: 被人憎恨／被人爱戴
  rationale: 保留原文鲜明的憎恨与爱之对偶；“爱戴”适合此处公开承认或尊崇的语境。
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: 在各处
  rationale: 将 ⲙⲁ ⲛⲓⲙ 理解为“每一处／各处”；表达分布广泛而不将其扩写成绝对性的“无处不在”。
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ / ϣⲁⲩⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ
  choice: 他们称为
  rationale: ϣⲁ- 在此作习惯体／泛指用法，不译作将来时；两行均以一般现在意义处理，以保持平行。
- source_word: ⲡⲙⲟⲩ
  choice: 死亡
  rationale: 保留抽象而人格化的自称，不额外解释其神学含义。
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: 律法
  rationale: 希腊语 nomos 借词在此最自然地译为“律法”；不把它缩窄为某一特定宗教法典。
theological_decisions:
- issue: “死亡”与“律法”作为说话者的并列称号
  choice: 直接保留二者的悖论式并置
  alternative: 将其解释为敌对者强加的误称，或赋予特定宗派寓意
  rationale: 原文只说人们如此称呼她，并未明确评价这些称呼；译文不替文本消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗性散文。重复“我是……那一位”以保存原作宣告式节奏；避免仿古虚词和宗派化术语。
