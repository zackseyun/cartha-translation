base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/035.yaml
  text: 'Do not despise my lowliness[a];

    and my self-control toward you—love her in my poverty.

    Do not laugh at me excessively;

    and do not despise my fault[d][c][b], and do not curse my boasting.'
translation:
  language: zh_hans
  text: '不要轻视我的卑微；


    我的自制——你们要在我的贫困中珍爱它[a]。


    不要过分嘲笑我[b]；


    也不要鄙视我的过失[c]，


    不要咒诅我的夸耀[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们要……珍爱它”也可按 ⲛ̄ⲧⲉⲧⲛ̄ 与“我的自制”的关系理解为“我对你们的自制”或“我在你们之上的自制”；此处句法关系有歧义。
    reason: 句法歧义
  - marker: b
    text: “过分”所译的词表示程度加强，也可译作“多多地”或“极其”。
    reason: 词义选择
  - marker: c
    text: “过失”也可译作“偏离”或“错误”。
    reason: 词义范围
  - marker: d
    text: “夸耀”也可译作“夸口”或“荣耀”；这里不预先判定其褒贬。
    reason: 保留语义与神学张力
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲙⲉⲥⲧⲉ
  choice: 不要轻视
  rationale: 这是由否定命令式构成的劝止语；“轻视”既保留贬抑意味，也比“憎恨”更符合本段与“卑微”相连的语境。
- source_word: ⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: 卑微
  rationale: 该抽象名词表示低微、微不足道或受轻贱的状态；“卑微”不把它预先解释为道德美德意义上的“谦卑”。
- source_word: ⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: 自制
  rationale: 这是希腊语 ἐγκράτεια 的借词，指自我节制或克制；“自制”是现代汉语中自然且准确的表达。
- source_word: ⲙⲉⲣⲓⲧⲥ
  choice: 珍爱它
  rationale: 动词意为爱、珍爱，后附阴性单数宾语代词，回指阴性名词“自制”；汉语以“它”保留明确回指。
- source_word: ⲙⲛ̄ⲧϭⲱⲃ
  choice: 软弱
  rationale: 该词本义围绕弱小、无力，也可延伸为贫乏或困窘；“软弱”最直接地保留其状态性。
- source_word: ⲕⲱ ⲧⲏⲛⲉ
  choice: 过分嘲笑
  rationale: ⲧⲏⲛⲉ 加强程度；结合以说话者为对象的结构，用“过分嘲笑”自然表达讥笑及其强度。
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: 鄙视
  rationale: 希腊语来源的动词表示藐视、看不起；“鄙视”与首句“轻视”形成原文近义复现而不完全抹平差异。
- source_word: ⲣⲓⲕⲉ
  choice: 过失
  rationale: 可表示偏离、弯曲，继而指错误或过犯；“过失”保留道德与一般失误之间的开放性。
- source_word: ⲥⲁϩⲟⲩ
  choice: 咒诅
  rationale: 在此按动词“咒诅”理解，而非把相近字形误读为“聚集、会众”。
- source_word: ϣⲟⲩϣⲟⲩ
  choice: 夸耀
  rationale: 该词表示夸口、夸耀或荣耀；“夸耀”保留说话者行为与可被他人非议之事两方面的张力。
theological_decisions:
- issue: “卑微”是否解释为德性的“谦卑”
  choice: 卑微
  alternative: 谦卑
  rationale: 上下文要求听者不要轻视说话者的低微状态，并未明确将其界定为一项德性，因此不作神学化处理。
- issue: 末句 ϣⲟⲩϣⲟⲩ 的评价色彩
  choice: 夸耀
  alternative: 荣耀
  rationale: “荣耀”容易把该词直接正面化，“夸口”又可能直接负面化；“夸耀”较能维持原作悖论式自述的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留原文连续的否定劝止句和第一人称悖论式自述；避免古奥词汇，并以分行呈现诗性节奏。
