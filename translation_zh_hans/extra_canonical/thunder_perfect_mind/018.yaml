base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/018.yaml
  text: '[...] and the one who boasts brings these to me[a]. I am the silence that is incomprehensible, and the thought whose remembrance is great. I am the voice whose sound is manifold[f][e][d][c][b], and the word that is multiple.'
translation:
  language: zh_hans
  text: '**13.** [……]那以此夸口的人把这些带给我。[a]


    我是无法把握的静默，

    也是被深深记念的意念；[b]

    我是有万千声响的声音，

    也是多样的言语。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段开头承接处残缺，夸口所针对的对象以及“这些”具体指什么，现存摘录不能确定。
    reason: textual_uncertainty
  - marker: b
    text: 原文较直译为“其记念是大的”，也可理解为“其记忆浩大”或“广受记念的意念”。
    reason: lexical_alternative
  - marker: c
    text: “言语”所译的ⲡⲗⲟⲅⲟⲥ是希腊语λόγος的借词，也可译作“话语”或“道”。
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲧϣⲟⲩⲟⲩϣⲟⲩ ⲙⲙⲟϥ
  choice: 那以此夸口的人
  rationale: 重叠动词在此表示夸耀、夸口；宾语代词所指承接残缺的上文，因此用“以此”保留其未明的指向。
- source_word: ⲡⲕⲁⲣⲱϥ
  choice: 静默
  rationale: 按ⲕⲁ ⲣⲱ⸗（闭口、沉默）的结构理解，而不采纳旧稿中缺乏词法依据的“后裔”。
- source_word: ⲉⲧⲉⲙⲁⲩⲧⲁϩⲟϥ
  choice: 无法把握的
  rationale: ⲧⲁϩⲟ可表示达到、触及或领会；“把握”在中文中兼顾认知上的不可理解与无法企及之意。
- source_word: ⲧⲉⲡⲓⲛⲟⲓⲁ
  choice: 意念
  rationale: 这是希腊语ἐπίνοια的借词，指思想、意念；“意念”自然且不额外限定为理性思考或计划。
- source_word: ⲉⲧⲉⲛⲁϣⲉ ⲡⲉⲥⲣⲡⲙⲉⲉⲩⲉ
  choice: 被深深记念的
  rationale: 原文较直译为“其记念是大的”；中文采用被动表达以保持可读性，同时在脚注说明结构上的开放性。
- source_word: ⲧⲉⲥⲙⲏ
  choice: 声音
  rationale: 该词在此是“声音、嗓音”，不是“名字”；与下文“声响”构成刻意的声音意象。
- source_word: ⲉⲧⲉⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: 有万千声响的
  rationale: ⲛⲁϣⲱⲥ表示多、丰富，ϩⲣⲟⲟⲩ表示声音或声响；“万千”传达繁多，并保留诗性排比。
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: 言语
  rationale: 希腊语λόγος在此与“声音”并列；译作“言语”既保持庄重，也不预先把它限定为后世某种专门的神学称号。
theological_decisions:
- issue: λόγος是否应译成带专名意味的“道”
  choice: 言语
  alternative: 道
  rationale: 本段着重声音、声响与言说的排比。译作“道”容易把后来的特定神学含义直接带入此处；“言语”保留λόγος的一般语义及其潜在张力。
- issue: “无法把握”应理解为认知上不可理解，还是空间意义上不可触及
  choice: 采用可兼容两者的“无法把握”
  alternative: 不可理解／无法触及
  rationale: 原动词可表示达到、抓住、领会；正文不替原文排除其中一种可能。
translation_notes:
  register: 采用现代、庄重而可诵读的简体中文；保留原作连续“我是……”的宣告体和静默／声音、意念／言语之间的悖论张力。首句以方括号省略号标示文本承接残缺，不据旧稿臆补。
