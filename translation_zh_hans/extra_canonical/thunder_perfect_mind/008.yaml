  text: I am the whore and the holy one[a][b].
translation:
  language: zh_hans
  text: '**3.** 我是娼妓[a]，也是圣洁者[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “娼妓”（ⲡⲟⲣⲛⲏ，pornē）指以性交易为业的女子；也可译作“妓女”。“娼妓”较能保留原文在当时语境中的贬抑色彩和冲击力。
    reason: lexical_alternative
  - marker: b
    text: “圣洁者”（ⲥⲉⲙⲛⲏ，semnē）本义可指“受尊崇的、庄严的”或“神圣的”；也可译作“受尊崇者”或“庄严者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: 我是
  rationale: 这是第一人称系词认同句；保留反复出现的“我是”，以呈现诗歌式的自我宣告。
- source_word: ⲡⲟⲣⲛⲏ
  choice: 娼妓
  rationale: 这是源自希腊语 pornē 的借词，指以性交易为业的女子。“娼妓”直接而带有原文的社会贬抑色彩，能够保留它与下文“圣洁者”并置时的冲击力。
- source_word: ⲁⲩⲱ
  choice: 也是
  rationale: 原词是并列连词“和”；汉语在两个身份判断之间用“也是”更自然，同时保留二者同属说话者的并列关系。
- source_word: ⲥⲉⲙⲛⲏ
  choice: 圣洁者
  rationale: 该词可表示“受尊崇的、庄严的、神圣的”，此处作名词性用法。“圣洁者”既与“娼妓”形成身份称谓上的平行，也保留神圣与受鄙弃身份之间的张力。
theological_decisions:
- issue: 同一说话者并列宣称相反的身份
  choice: 不解释或调和，直接译为“我是娼妓，也是圣洁者”
  alternative: 把后半句弱化为“又是受尊敬的”或将两者理解为不同人物
  rationale: 原文以并列结构把两种身份同时归于“我”；译文应保留其悖论和开放性，不替文本作教义化解释。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。用“也是”使并列身份判断在汉语中自然清楚；保留“娼妓／圣洁者”的尖锐对照，不作释义性扩写。
