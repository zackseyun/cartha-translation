base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/085.yaml
  text: 'Vision and self-control

    of the heart[a], existing within me—

    I am the hearing that is attainable to everyone[d][c][b],

    and the speech that cannot be grasped.'
translation:
  language: zh_hans
  text: '心中的异象与自制，[a]


    存在于我里面——[b]


    我就是人人皆可得的听闻，[c]


    也是那无法把握的话语。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头也有人译作“心灯”，但这里所据的科普特文 OCR 读作两个希腊语借词，意为“异象”和“自制”。
    reason: lexical_alternative
  - marker: b
    text: “存在于我里面”按阴性关系形式回指“异象与自制”；若依另一种断句，也可能译成“我心中的”。
    reason: grammar_and_previous_rendering
  - marker: c
    text: “皆可得”所译的词义并不确定，也可理解为“人人都可接近”或“临到人人”；这里的“听闻”是名词性的“听”。
    reason: lexical_alternative
  - marker: d
    text: “无法把握”也可译作“无法领会”或“无法抓住”；原表达可能兼有身体上抓住和心智上理解两层意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲟⲣⲁⲥⲓⲥ
  choice: 异象
  rationale: 此词是希腊语借词，可指视觉、看见或异象；在“心中”的内在感知语境下，“异象”自然且保留抽象意味。
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ
  choice: 自制
  rationale: 对应希腊语 ἐγκράτεια，指自我节制或控制；“自制”简洁、现代，不额外引入禁欲色彩。
- source_word: ⲙⲫⲏⲧ
  choice: 心中的
  rationale: 将 m- 主要理解为属格，同时保留与内在心灵相关的意味。
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ ⲁⲛⲟⲕ
  choice: 存在于我里面
  rationale: ϣⲟⲟⲡ 表示存在或在场；阴性关系形式应回指前面的阴性名词“异象与自制”，而不是阳性的“心”。中文以另起一行避免误接“心”。
- source_word: ⲡⲥⲱⲧⲙ
  choice: 听声
  rationale: 保留名词性的“听见/听”，并与后面的“话语”构成听觉悖论；“听声”比“顺从”更贴近基本词义。
- source_word: ⲉⲧϣⲏⲡ
  choice: 可听见
  rationale: 上下文表达这种“听”向人人可及；中文用“可听见”使句意自然，同时在脚注说明原词也可侧重可获得或临到。
- source_word: ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: 人人
  rationale: 准确表达普遍范围，简洁而有诗性。
- source_word: ⲡϣⲁϫⲉ
  choice: 话语
  rationale: 既可指言说，也可指所说的话；“话语”与“听声”相配，又不局限为一个单词。
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: 无法领会
  rationale: 该表达可涵盖抓住、把握及理解；“领会”突出认知层面的悖论，脚注保留更具身体意味的译法。
theological_decisions:
- issue: 说话者与内在异象、自制的关系
  choice: 将“存在于我里面”回指“异象与自制”
  alternative: 理解为“在我里面的心”
  rationale: 关系形式为阴性，应与前面的阴性名词一致，不能自然地修饰阳性的“心”；此为语法判断，不作神学身份推断。
- issue: “听”与“话语”的悖论
  choice: 保留“人人可听”与“无法领会”的张力
  alternative: 解释为只有属灵者才能理解
  rationale: 原文并未限定特定群体，也未解释悖论，故不加入宗派性或秘传性的解说。
translation_notes:
  register: 采用现代、庄重而简洁的诗体。保留第一人称宣告与“听声—话语”的悖论。为避免中文将关系从句误接到“心”，把“存在于我里面”单独成行。
