  text: And what you see outside you, you see inside you; it is what is visible, and it is your garment.
translation:
  language: zh_hans
  text: '**7.** 你们在自身之外所看见的，也在自身之内看见；那是可见之物，也是你们的衣裳。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所附科普特语OCR片段与本句不能可靠对应；本段定位的对齐置信度较低。译文依据所给校勘咨询文本及词汇证据拟定，原页影像或可靠转写仍需复核。
    reason: 如实标明底本文本对齐与OCR证据的不确定性，避免把重建文本当作无疑的逐字转写。
lexical_decisions:
- source_word: ⲛⲁⲩ
  choice: 看见
  rationale: 这是萨希德科普特语中表示视觉感知的常用动词；“看见”直接自然，并能贯穿本句反复出现的视觉意象。
- source_word: ⲉⲃⲟⲗ
  choice: 在自身之外
  rationale: 此处与表示内部的ⲉϩⲟⲩⲛ相对；“在自身之外”明确保留针对“你们”的外在空间关系。
- source_word: ⲉϩⲟⲩⲛ
  choice: 在自身之内
  rationale: 与“在自身之外”形成整齐对应，同时不把空间性的内外关系解释成特定的心理或神秘体验。
- source_word: ⲟⲣⲁⲧⲟⲛ（希腊语借词 ὁρατόν）
  choice: 可见之物
  rationale: 原词为形容词名词化用法；“可见之物”既保留其名词功能，也呼应前面的“看见”。
- source_word: ⲓⲙⲁⲧⲓⲟⲛ（希腊语借词 ἱμάτιον）
  choice: 衣裳
  rationale: “衣裳”自然而略具诗性，能保留原文的衣物隐喻，又不擅自限定为外袍或斗篷。
theological_decisions:
- issue: “外面／里面”的所指
  choice: 译作“在自身之外／在自身之内”，保留空间与象征两种可能
  alternative: 解释为外在世界与人的内心
  rationale: 原文的对举具有开放性；不应把它收窄为某种固定的心理学、宇宙论或神秘主义教义。
- issue: “可见之物”与“衣裳”的关系
  choice: 保留两个并列谓语，不解释衣裳象征什么
  alternative: 将“衣裳”阐释为肉身、物质世界或显现形态
  rationale: 诗句本身只作隐喻性认同，没有明说其神学含义；直译可保存其张力。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“自身之外／自身之内”维持诗句的对称和指向；分号保留前后两组陈述之间的紧密转折。“衣裳”比“服装”更具诗性，又比具体的“外袍”少一层未经证实的限定。
