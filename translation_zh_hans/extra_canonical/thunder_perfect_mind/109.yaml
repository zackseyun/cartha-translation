- source_word: ⲉⲃⲟⲗ
  choice: 在自身之外
  rationale: 此处与表示内部的ⲉϩⲟⲩⲛ相对；“在自身之外”明确保留针对“你们”的外在空间关系。
- source_word: ⲉϩⲟⲩⲛ
