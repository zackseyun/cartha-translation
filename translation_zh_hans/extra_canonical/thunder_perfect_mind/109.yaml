  rationale: 与“在自身之外”形成整齐对应，同时不把空间性的内外关系解释成特定的心理或神秘体验。
- source_word: ⲟⲣⲁⲧⲟⲛ（希腊语借词 ὁρατόν）
  choice: 可见之物
  rationale: 原词为形容词名词化用法；“可见之物”既保留其名词功能，也呼应前面的“看见”。
- source_word: ⲓⲙⲁⲧⲓⲟⲛ（希腊语借词 ἱμάτιον）
  choice: 衣裳
  rationale: “衣裳”自然而略具诗性，能保留原文的衣物隐喻，又不擅自限定为外袍或斗篷。
