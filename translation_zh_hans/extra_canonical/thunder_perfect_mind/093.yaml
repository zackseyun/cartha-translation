base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/093.yaml
  text: 'The calling of my name—it is I.

    I am the crying out, and I am the hearing.

    You hear me in your calling of me; you call me with a sound you …'
translation:
  language: zh_hans
  text: '我名字的呼唤——就是我。


    我是呼喊，也是聆听。


    你们呼唤我时，就听见我；你们用自己发出的声音呼唤我……[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一行在换页处残缺。现存文字为“用一个/一种 p…”及“你们所发出的”；这里依上下文暂补作“声音”，但原词及后续句意不能确定。
    reason: 原稿残缺及重构不确定性
lexical_decisions:
- source_word: ⲡⲱϣ(ⲥ) ⲙ̄ⲡⲁⲣⲁⲛ
  choice: 对我名字的呼唤
  rationale: 这里较可能是带定冠词的 ⲱϣ（“呼喊、呼唤”），而不是表示一般“声音”的词。“对我名字的呼唤”既体现动作名词，也保留“名字”与“呼唤”的诗性关联。
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: 就是我
  rationale: 这是强调性的系词断言；汉语用“就是我”保持简洁有力。科普特语形式带阴性一致，但汉语第一人称在此无需另行标示性别。
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: 呼喊
  rationale: 按经校订的词根理解为 ⲁϣⲕⲁⲕ ⲉⲃⲟⲗ（“喊出、呼喊”）的名词性用法，而非“无玷污”。
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: 聆听
  rationale: 在与“呼喊”并列的结构中按名词化的“听、聆听”处理。“聆听”比“听见”更适合独立名词性的诗句，同时保留主动听取与听觉行为之间的张力。
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: 你们……听见我
  rationale: 明确呈现第二人称复数和直接宾语关系；“听见我”自然地承接上一句的“聆听”。
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: 呼唤我
  rationale: 该动词可指称名或呼叫；此处与名字和呼喊的反复意象相连，译作“呼唤我”最为顺畅。
- source_word: ϩⲛ ⲟⲩⲡ… ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: 用自己发出的声音
  rationale: 残缺处似以不定冠词和 ⲡ- 起首，后文明确有“你们发出/说出”。依语境暂译为“声音”，但以省略号和脚注标明重构并不确定。
theological_decisions:
- issue: 说话者同时自称为“呼喊”和“聆听”
  choice: 保留两个并列的名词性身份断言
  alternative: 解释为“我是呼喊者，也是听见的人”
  rationale: 原文的悖论式自我宣告具有诗学和神学张力；不把它改写成两个行动者角色，以免消解说话者与呼喊、聆听本身的认同。
translation_notes:
  register: 采用庄重而清楚的现代汉语，保留原诗反复、并列和悖论式的节奏。“呼唤—呼喊—聆听—听见”形成可感知的词义回响；末句不擅自补全，以省略号保存残篇状态。
