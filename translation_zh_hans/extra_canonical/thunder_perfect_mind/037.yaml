translation:
  language: zh_hans
  text: '你们要谨慎看待我的软弱[a]。


    但我是在每一种恐惧中存在的那一位[b]，

    也是颤抖中的力量[c]。


    我就是那位……[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谨慎看待”也可译作“要提防”或“要警觉”；“软弱”也可译作“衰弱”或“脆弱”。原文不是“夸口”。
    reason: lexical_alternative
  - marker: b
    text: 科普特语用阴性形式指说话者；现代汉语的“那一位”不显明语法性别。
    reason: grammatical_note
  - marker: c
    text: 手稿OCR作ⲡⲛⲏϣⲁⲧ；这里按校勘所指的ⲡⲛⲁϣⲧ“力量”理解。ⲥⲧⲱⲧ意为“颤抖”。
    reason: textual_note
  - marker: d
    text: 这句话在所给片段中中断，后文应接续关系从句。
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲁϩⲟⲩ（第二人称复数祈使式）
  choice: 你们要谨慎看待
  rationale: 该词表示谨慎、警觉或提防；结合关系介词短语，译文保留劝诫语气，同时不把它误解为“咒诅”。
- source_word: ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: 我的软弱
  rationale: ϣⲟⲩϣⲟⲩ在此指软弱、衰弱；ⲙ̄表示所关涉的对象。此译法比“夸口”更符合科普特语词义。
- source_word: ⲧⲉⲧϣⲟⲟⲡ ⲛ̄ⲛ̄ⲫⲟⲃⲟⲥ ⲧⲏⲣⲟⲩ
  choice: 在每一种恐惧中存在的那一位
  rationale: ϣⲟⲟⲡ表示存在或临在；ⲧⲏⲣⲟⲩ表达全体性。用“每一种”保留分配意味。
- source_word: ⲡⲛⲏϣⲁⲧ ⲛ̄ⲟⲩⲥⲧⲱⲧ
  choice: 颤抖中的力量
  rationale: 依校勘判断，ⲡⲛⲏϣⲁⲧ应反映ⲡⲛⲁϣⲧ“力量”，ⲥⲧⲱⲧ意为“颤抖”；译文保留“力量”与“颤抖”的悖论张力。
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ-
  choice: 我就是那位……
  rationale: ⲧⲉ及关系形式为阴性，但现代汉语代词和系词不标语法性别；“那位”保持庄严语气，省略号反映原片段未完。
theological_decisions:
- issue: 说话者与恐惧、颤抖及力量之间的悖论关系
  choice: 保留“在恐惧中存在”及“颤抖中的力量”的并置
  alternative: 解释为说话者克服恐惧，或把颤抖直接等同于怯懦
  rationale: 原文以自我宣告并置看似相反的状态；不应加入原文没有明说的胜过、消除或道德评判。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留反复的“我”式宣告、诗性换行以及“恐惧—颤抖—力量”的悖论；不依据英语咨询文本中较早的误读加入“咒诅”或“夸口”。
