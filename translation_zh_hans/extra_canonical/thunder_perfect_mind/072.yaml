  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/072.yaml
  text: 'The voice of the angels who were sent forth in the word[a], and of the gods,

    the gods that go out by means of the counsel;

    and the spirits of humans who exist with me,

    and the women who exist within[m][l][k][j][i][h][g][f][e][d][c][b].

    I am she — you [pl.] ...'
translation:
  language: zh_hans
  text: '**拥抱我——9**


    天使的声音[a]——他们在“道”中被差遣出去[b]——

    以及众神[c]，

    就是那些借着谋议而出去的神明[d]；

    还有与我同在之人的灵[e]，

    以及存在于内里的女人[f]。


    我就是她——你们……[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的 ⲥⲓⲥ 词形或切分不确定；也可能与“寂静、安静”有关。这里依句列结构暂译作“声音”。
    reason: 原文读法不确定，且不同分析会显著改变意象。
  - marker: b
    text: “他们被差遣出去”所据词形很可能跨行书写，末尾的 ⲟⲩ 是宾格代词；也可理解为“被发出／被说出”。
    reason: 说明 OCR 换行和动词语义范围。
  - marker: c
    text: ⲛⲟⲩⲧⲉ 在科普特语中可指“神”或“上帝”；这里按句法和平行结构译为复数“众神”。
    reason: 保留单复数及神学指称的真实歧义。
  - marker: d
    text: “谋议”译自 ⲡϣⲟϫⲛⲉ，也可译作“计谋、计划、劝告”。本句的结构略显残缺，“出去的神明”是依现有文本作出的顺读。
    reason: 交代词义选择和 OCR 摘录造成的句法不稳。
  - marker: e
    text: “灵”应是 ⲡⲛⲉⲩⲙⲁ 的缩写。后面的关系语究竟修饰“人”还是“灵”，因 OCR 读文可疑而不能完全确定。
    reason: 保留名词识别与修饰范围的不确定性。
  - marker: f
    text: “女人”是 ⲛⲓϩⲓⲟⲙⲉ 的通常意思；末语“在内里”也可能具体理解为“在心中”。
    reason: 纠正可能的误读并标示空间／内在语义。
  - marker: g
    text: 摘录止于第二人称复数词头 ⲧⲉⲧ-，句子尚未完成，因此以省略号保留残缺状态。
    reason: 忠实反映所给源文的截断处。
lexical_decisions:
- source_word: ⲥⲓⲥ
  choice: 声音
  rationale: 该词形及其切分不确定；依本段属格串列和现有校勘语境暂译为“声音”，同时用脚注保留“寂静／安静”等可能。
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: 天使
  rationale: 这是源自希腊语 ἄγγελος 的科普特语借词；此处语境较适合传统的超自然含义“天使”，而非一般的“使者”。
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟⲟⲩ
  choice: 他们被差遣出去
  rationale: 按关系式完成时及末尾宾格代词分析为“他们被差遣／发出”；OCR 将末尾 ⲟⲩ 切到下一行，不宜分析成“最先者”。
- source_word: ϩⲙ̄ ⲡⲗⲟⲅⲟⲥ
  choice: 在“道”中
  rationale: ϩⲙ̄ 表示“在……中”；ⲗⲟⲅⲟⲥ 是希腊语 λόγος 借词。“道”既自然简洁，也保留其可能的专门含义，以引号提示其术语性。
- source_word: ⲛ̄ⲛⲟⲩⲧⲉ
  choice: 众神／神明
  rationale: 重复形式和串列结构较支持复数；译文先作“众神”，后用“神明”避免中文机械重复，同时不把它神学化为单数“上帝”。
- source_word: ⲡϣⲟϫⲛⲉ
  choice: 谋议
  rationale: 该词通常表示“计议、谋划、劝告”，不是“声音”；“谋议”兼顾名词性、庄重感及计划／商议两层含义。
- source_word: ⲡⲛⲁ
  choice: 灵
  rationale: 这里应是带上划线的 ⲡⲛⲉⲩⲙⲁ 缩写，即“灵”，而不是表示心智的普通词。
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: 女人
  rationale: 这是“女人”的复数形式，不是“智慧人”；用普通现代汉语“女人”直接传达。
- source_word: ⲛ̄ϩⲏⲧ
  choice: 在内里
  rationale: 字面涉及内部／心中；“在内里”保留空间与内在性之间的开放张力，不限定为具体的“心里”。
theological_decisions:
- issue: ⲛ̄ⲛⲟⲩⲧⲉ 的数与神学指称
  choice: 译作复数“众神／神明”
  alternative: 单数“上帝”或较抽象的“神性存在”
  rationale: 源文重复形式及并列关系更支持复数；改成单数会在证据不足时改变文本的神学图景。
- issue: ⲗⲟⲅⲟⲥ 是否作人格化专名
  choice: 译作带引号的“道”
  alternative: 普通名词“话语”或音译“逻各斯”
  rationale: “道”可读作具有专门含义，也仍保留“言语”的语义背景；引号避免武断断定其必为特定人格。
- issue: “人的灵”后关系从句的归属
  choice: 正文采用自然但仍可开放理解的“与我同在之人的灵”
  alternative: 明确译成“人的灵，就是那些与我同在的”
  rationale: OCR 在此处疑有讹误，关系从句究竟修饰“人”还是“灵”不够稳固；不宜用解释性增词彻底消除这种句法张力。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留源文的串列节奏与突转的自我宣告；不补足残句，也不把“众神”“道”“灵”等词强行纳入某一宗派体系。标题中的编号按所给区块保留。
