translation:
  language: zh_hans
  text: '**10.** 你们在你们对我的呼唤中听见我[a]，在你们所说出的某个……中[b]。你们没有听见[c]。我是那辩护[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存科普特文可直译为“你们在你们对我的呼唤中听见我”。“呼唤我”也可译作“向我呼求”或“召唤我”；“在……中”保留原文介词所表示的关联，不将其限为单纯时间关系。
    reason: lexical_alternative
  - marker: b
    text: 原文在不定冠词“某个”之后只存一个以 ⲡ 开头的残字，随后为“你们所说出的”。因此无法确定所说出的是声音、言语，还是别的事物。
    reason: textual_lacuna
  - marker: c
    text: 原文是“你们没有听见”的否定完成式；这里与前一句“听见我”形成有意而未加解释的张力。
    reason: grammatical_and_literary_note
  - marker: d
    text: “辩护”对应希腊语借词 ἀπολογία，也可指“答辩”“申辩”或“回答”。这一句的连接文字有残损，具体句法并不完全确定。
    reason: lexical_alternative_and_textual_lacuna
