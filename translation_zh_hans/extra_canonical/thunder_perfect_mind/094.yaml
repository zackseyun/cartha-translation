- source_word: ⲛⲉⲧⲛ ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: 在呼唤我时
  rationale: 这一串文字很可能表示名词化的“你们呼唤我”；ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ 也可理解为“向我呼求”或“召唤我”，译文不把它限定为单纯给人命名。
- source_word: ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: 你们所说出的
  rationale: 按关系从句处理；ⲧⲁⲩⲟ 在此有说出、发出之意，不按条件句解释。
- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: 你们没有听见
  rationale: 这是第二人称复数否定完成式陈述，不宜补成“如果你们没有听”。
- source_word: ⲁⲛⲟⲕ ⲡ[... ] ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: 我是那辩护
  rationale: 保留作品反复出现的“我是”认同句式；ⲁⲡⲟⲗⲟⲅⲓⲁ 是希腊语借词，核心义为辩护、答辩。冠词及断损处使句法细节不完全确定。
theological_decisions:
- issue: “我是那辩护”的身份性陈述
  choice: 直译为“我是那辩护”
  alternative: 我是那答辩／我是辩护者
  rationale: 原文以抽象名词作身份表述，构成本篇特有的张力；不擅自人格化为“辩护者”，也不将其解释成特定教义概念。
