base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/002.yaml
  text: 'Consider me[1], and I found myself among those who seek me,

    you who watch for me—you yourselves;[3]

    and you hearers, listen to me.

    You who are troubled in heart, receive me to yourselves[d][c][b][a][4][3][2],

    and do not turn away from me.[4]'
translation:
  language: zh_hans
  text: '**2.** 要思想我；我在那些寻找我的人中找到了自己。[a]

    守望我的人——就是你们自己——要留心我；

    聆听的人啊，要听我。

    心里不安的人啊，要把我接到你们那里；

    不要逃离我。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存OCR作 ⲁⲓϭⲓⲛⲉ，按字面是“我找到了”；但因上下文是一连串命令，也可能校读或理解为：“要在那些寻找我的人中找到我。”另有可能译作：“我在那些寻找我的人中被找到。”
    reason: 文本形态与语境之间存在真实歧义，需保留主要异读。
  - marker: b
    text: “逃离”原文直指“跑、逃”；也可按关系含义译作“不要离开我”或“不要背离我”。
    reason: 说明原词的空间意象及可行的语境译法。
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: 要思想我
  rationale: ⲙⲉⲉⲩⲉ 表示思想、思量或默想；此处采用直接的命令式“要思想我”，既自然，又不额外赋予专门宗教含义。
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: 我在那些寻找我的人中找到了自己
  rationale: 按现存OCR字形，ⲁⲓϭⲓⲛⲉ 是第一人称单数完成式，而 ⲙⲙⲟⲓ 可作第一人称宾语，故正文保留较形式对应且语义奇特的“我找到了自己”；不凭上下文擅改为命令式，异读见脚注。
- source_word: ⲧⲉⲧⲛⲉⲣⲟⲉⲓⲥ … ⲉⲣⲟⲓ
  choice: 守望我的人……要留心我
  rationale: ⲣⲟⲉⲓⲥ 的核心义是警醒、守望或看守，并非“认识”。中文以“守望”保留其警醒意味；“留心我”表达介词短语与呼语的指向关系。
- source_word: ⲉⲧⲏⲩⲧⲛ
  choice: 就是你们自己
  rationale: 这是带强调作用的独立代词；显译为“就是你们自己”，保留原文强调语势。
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ
  choice: 聆听的人
  rationale: ⲣⲉϥ- 构成施事名词，前有复数冠词，故译作复数泛指的“聆听的人”，而非未来关系从句。
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: 要听我
  rationale: 命令式直译为“要听我”，保留听见与听从之间的开放性。
- source_word: ⲛⲉⲧⲧⲟϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ
  choice: 心里不安的人
  rationale: ⲧⲟϣⲧ 表示受惊、困扰或不安，ϩⲏⲧ 是心或内在；“心里不安”在现代汉语中自然，并保留情绪范围。
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: 要把我接到你们那里
  rationale: ϣⲟⲡⲧ 宜分析为 ϣⲱⲡ“接纳、接受”的命令式并带第一人称单数宾语后缀，ⲉⲣⲱⲧⲛ 表示朝向“你们”；该译法保留原文接纳并带到自身之处的空间表达。
- source_word: ⲙⲡⲣⲡⲱⲧ ⲛⲥⲱⲓ
  choice: 不要逃离我
  rationale: ⲙⲡⲣ- 构成否定命令，ⲡⲱⲧ 本义为跑、逃；与 ⲛⲥⲱⲓ 连用时译作“逃离我”，保留强烈的运动意象。
theological_decisions:
- issue: “我找到了自己”与“找到我”之间的文本和句法张力
  choice: 正文按现存OCR保留第一人称陈述“我……找到了自己”
  alternative: 将字形理解或校订为命令式：“要在那些寻找我的人中找到我”
  rationale: 原文证据所给字形明确包含完成式第一人称前缀 ⲁⲓ-，但上下文连续的命令语气以及“寻找我”的搭配支持命令式异读。为避免把诗歌中关于说话者、自我发现和寻求者关系的潜在张力静默消解，正文从现有字形，脚注列出语境所支持的另一读法。
- issue: 接纳说话者的措辞是否应神学化
  choice: 译作具体而关系性的“把我接到你们那里”
  alternative: 译作“接受我”或“把我接入你们里面”
  rationale: 原文可表达接纳及朝向自身的关系，不足以确定某种内住、合一或皈依教义，因此不作教派性阐释。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。以短句和呼语重现神谕式排比；避免古奥文言和特定宗派术语。正文优先服从科普特文现有字形，同时通过脚注交代OCR、校读和句法上的不确定性。
