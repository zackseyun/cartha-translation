base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/005.yaml
  text: Be watchful,[1] and as for your hearing, do not be deaf to me in any place or in any other thought[2]; and do not be ignorant of me. For I am the first[a][2], and I am the last.
translation:
  language: zh_hans
  text: 要警醒[a]；你们听我时，无论在何处，或抱着别样的念头，都不要对我充耳不闻[b]；也不要不认识我。因为我是首先的，也是末后的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要警戒”或“要留心”。
    reason: lexical_alternative
  - marker: b
    text: 本句在现存文本对应行中的衔接位置并不完全确定；有些编排可将其中部分接于前一句或后一句。
    reason: alignment_note
lexical_decisions:
- source_word: ⲧⲱⲉⲓ
  choice: 要警醒
  rationale: 用劝诫式命令表达警觉、留心之意，保持开篇庄重而直接的语气。
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ / ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ
  choice: 至于你们所听的，不要……对我充耳不闻
  rationale: 前者按“你们的听／你们所听的”处理，后者保留否定命令“不要成为不听的、耳聋的”，避免误译为“你们听的人，要听我”。中文以“充耳不闻”自然传达对说话者不肯听从或听不进去的强烈告诫。
- source_word: ⲕⲁⲧⲁ ⲙⲁ
  choice: 在任何地方
  rationale: 按此处习语义处理，而不机械译成“按照一个地方”。
- source_word: ⲛⲕⲉⲟⲩⲙⲉⲩⲉ
  choice: 任何别的念头
  rationale: 保留“念头／思想”的基本义及原文略显奇特的搭配，不擅自解释为某种特定教义上的“理解”或“意见”。
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: 不要不认识我
  rationale: 保留否定命令和“认识／知道”的语义张力；不弱化为单纯“不要忽视我”。
- source_word: ⲧϣⲟⲣⲡ … ⲑⲁⲉ
  choice: 首先的……末后的
  rationale: 直译成对称的自我宣称，保存原文首尾相对的诗性和神学张力。
- source_word: ⲁⲛⲟⲕ … ⲁⲛⲟⲕ
  choice: 我是……也是……
  rationale: 在自然中文中维持两个谓语的平行关系，同时避免不必要的重复造成生硬。
theological_decisions:
- issue: “我是首先的，也是末后的”这一自我宣称的身份与含义
  choice: 保留原文自我宣称，不加身份说明
  alternative: 将说话者明确解释为某一神圣位格、智慧形象或特定人物
  rationale: 本段本身没有在此处明确界定说话者身份；译文应保留其开放性及神学张力，不导入宗派或解释者的限定。
translation_notes:
  register: 采用现代、庄重而可懂的劝诫语体。“至于你们所听的”有意保留科普特文以“你们的听”起题的结构痕迹；“任何别的念头”也保留原文不寻常的表达，不作教义化阐释。
