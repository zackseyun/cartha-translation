  source_fidelity: 首句及末句均忠实传达原文的劝诫和首末自我宣称。原译“至于你们所听的”却容易被理解为“听见的内容”，未能恰当表达ⲡⲉⲧⲛⲥⲱⲧⲙ所指的“你们的听／聆听”。修订为“你们听我时”，以自然汉语表达其与后接“不要对我充耳不闻”的关系；“无论在何处，或抱着别样的念头”保留ⲕⲁⲧⲁ ⲙⲁ及“另一思想”的并列，且不作教义化解释。
