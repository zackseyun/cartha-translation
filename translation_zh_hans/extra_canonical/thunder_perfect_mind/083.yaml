base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/083.yaml
  text: 'I am the division and the stripping[a].

    I am the dwelling[c].

    And I am the robbery; I am

    the one who sees what comes

    down to me.

    I am the flight of the release[d][b][a][d][c][b].

    I am I.'
translation:
  language: zh_hans
  text: '我是分裂与剥除。[a]


    我是居所。[b]


    我也是抢夺；我是那看见


    下到我这里之事的人。


    我是释放之逃离。[c]


    我就是我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头两个名词的辨读和确切词义并不完全确定；这里依次译作“分裂”和“剥除”，也有将前者理解为空间意义“里面”的意见。
    reason: lexical_alternative
  - marker: b
    text: “居所”所对应的词借自希腊语 μονή，可指住所、居处，也可含停留、居住之意。
    reason: cultural_note
  - marker: c
    text: 原文直译近于“释放之逃离”。“之”所表达的关系并不明确，也可能理解为“获释后的逃离”或“逃离释放”；“释放”还可有放开、舍弃、赦免等语义。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: 我是
  rationale: 保留科普特语反复出现的第一人称系词句式及其宣告式节奏。
- source_word: ⲡⲡⲱⲧⲣ
  choice: 分裂
  rationale: 依当前读法取分开、分裂之意；该词的辨读和词义并不十分稳固，故加注说明。
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: 剥除
  rationale: 将该复合形式理解为剥去、除去，而不与后文 ⲡⲕⲱⲗ 混同为同一空间词。
- source_word: ⲧⲙⲟⲛⲏ
  choice: 居所
  rationale: 这是希腊语 μονή 的借词，基本义为居处、住所；“居所”自然且保留具体空间意象。
- source_word: ⲡⲕⲱⲗ
  choice: 抢夺
  rationale: 按科普特语动词 ⲕⲱⲗ“偷、抢夺”理解，而非误作“外面”。名词化表达与冠词相合。
- source_word: ⲡⲉⲧⲛⲁⲩ
  choice: 那看见……的
  rationale: 按关系结构直译为“那看见……的”，保留其动词性。
- source_word: ⲉⲧⲛⲏⲟⲩ ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: 临到我这里之事
  rationale: 将 ⲛⲏⲟⲩ 识别为“来”的状态形式，并将整个方向短语理解为“下来到我这里”，而非“可见之物在面前”。中文用“临到我这里”自然呈现其趋向。
- source_word: ⲫⲱⲧ
  choice: 逃
  rationale: 按科普特语本族词“逃跑、逃离”处理，不误认作希腊语 φῶς“光”的借词。
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: 释放之
  rationale: 把 ⲙ- 读作属格连接词，把 ⲕⲱ ⲉⲃⲟⲗ 的名词化形式译为“释放”；不用否定完成式“没有熄灭”的旧解。
- source_word: ⲁⲛⲟⲕ ⲁⲛⲟⲕ
  choice: 我就是我
  rationale: 以自然而庄重的汉语保留双重“我”的强调和收束效果。
theological_decisions:
- issue: 末句 ⲁⲛⲟⲕ ⲁⲛⲟⲕ 是否应套用圣经神名公式
  choice: 我就是我
  alternative: 我是我／我，我
  rationale: 该句确有强烈的自我宣告语气，但不额外加入“自有永有”等带有特定经典和神学解释的措辞。
- issue: “释放之逃”的关系
  choice: 保留属格结构的开放性
  alternative: 逃离释放／因释放而逃／获释后的逃离
  rationale: 原文属格可表达多种语义关系；正文不擅自判定是逃离释放、释放所带来的逃离，还是获释后的逃离。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文，保留连续“我是”的诗性宣告。对原文刻意形成的悖论和末行属格歧义不作教派化消解；分行大体顺应原文意群，而非机械复制 OCR 行界。
