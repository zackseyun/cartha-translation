base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/007.yaml
  text: 'Do not be ignorant of me.

    For I am the first and the last;

    I am the honored and the scorned[a];

    I am the whore and the holy one[d];

    I am the wife[b] and the virgin[c][e].'
translation:
  language: zh_hans
  text: '不要不了解我。


    因为我是首先的，也是末后的；


    我是受尊崇的，也是受蔑视的[a]；


    我是娼妓，也是圣洁者[b]；


    我是女人，也是童女[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处OCR作ϣⲏϣ，通常可指“众多”或“伟大”，与“受尊崇的”并不构成明显反义。许多编者据上下文读作或校作含“被轻视、受蔑视”之意的形式；本译依此对举，但读法仍不确定。
    reason: 文本与抄读不确定性
  - marker: b
    text: ⲥⲉⲙⲛⲏ也可译作“纯洁者”或“贞洁者”。这里译“圣洁者”，以兼顾其宗教和伦理色彩。
    reason: 词义范围
  - marker: c
    text: ⲡⲁⲣ是拿戈玛第抄本中希腊语παρθένος（“童女、处女”）的缩写。前面的ⲥϩⲓⲙⲉ基本义是“女人”，也可依语境理解为“妻子”。
    reason: 抄写惯例与词义备选
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: 不要不认识我
  rationale: 保留否定命令及认知动词的力度；现代汉语虽带双重否定，却清楚而庄重，也不弱化为单纯“不要忽视我”。
- source_word: ⲧϣⲟⲣⲡ / ⲑⲁⲉ
  choice: 首先的／末后的
  rationale: 直接保存成对的次序称谓和神谕式节奏，不擅自改释为“起初／终结”。
- source_word: (ⲧ)ⲧⲁⲉⲓⲏⲩ
  choice: 受尊崇的
  rationale: 表达被尊敬、得荣耀的状态，并与下一项形成对称的被动性称谓。
- source_word: (ⲧ)ϣⲏϣ（OCR读法）
  choice: 受蔑视的
  rationale: 按语境中预期的悖论性对举翻译，但以脚注明确抄读和词义并不确定。
- source_word: ⲡⲟⲣⲛⲏ
  choice: 娼妓
  rationale: 保留原文希腊借词的直接和冲击性；比“妓女”稍庄重，适合文学文本。
- source_word: ⲥⲉⲙⲛⲏ
  choice: 圣洁者
  rationale: 该词可指圣洁、纯洁或贞洁；“圣洁者”保存宗教意味，同时避免特定教会称号。
- source_word: ⲥϩⲓⲙⲉ
  choice: 女人
  rationale: 采用科普特词的基本义，不为强化与“童女”的反差而擅自限定为“妻子”。
- source_word: ⲡⲁⲣ（παρθένος的缩写）
  choice: 童女
  rationale: 对应希腊语παρθένος；“童女”在庄重中文中兼具未婚与贞洁语感，并保持与“女人”的张力。
theological_decisions:
- issue: 一连串相反身份称谓的关系
  choice: 逐项并列保留，不解释为寓意、历史人物或特定神学身份
  alternative: 将说话者明确认定为某位神祇、智慧形象、教会或救赎者
  rationale: 原文刻意维持悖论和身份张力；本段本身没有授权唯一的教义化认定。
- issue: ⲥⲉⲙⲛⲏ的宗教与伦理含义
  choice: 译作“圣洁者”并在脚注保留“纯洁／贞洁”的可能
  alternative: 译作“贞女”或特定宗教称号“圣徒”
  rationale: 避免把与“娼妓”的对照仅缩减为性伦理，也避免导入制度化教会含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，以“我是……也是……”复现科普特原文反复的ⲁⲛⲟⲕ ⲧⲉ及并列节奏。保留悖论，不为追求鲜明反义而把ⲥϩⲓⲙⲉ正文改成词义较窄的“妻子”。所有脚注标记均置于相关正文之后。
