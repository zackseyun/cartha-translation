  text: And you embrace me[a]. You despised me, and you saw me[e][d][c][b]. Do not scatter the first things [...] Do not ponder [...] your limbs [...]
translation:
  language: zh_hans
  text: '**3.** 你们也尊重我[a]。你们曾轻蔑我，也曾看见我。不要把起初的事物[b]分散……不要思量……你们的肢体[c]……'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲧⲁⲉⲓⲟ 在这里是“尊重、尊敬”，不是“拥抱”。现存句式也较适合读作陈述：“你们尊重我。”
    reason: lexical_correction
  - marker: b
    text: 原文可直译为“最先的／起初的那些事物”。抄本在随后数行残损严重，具体所指无法确定。
    reason: textual_uncertainty
  - marker: c
    text: ⲗⲁⲁⲧⲉ 也可译作“身体各部分”或“成员”。此处残句仅保存到“你们的肢体……”附近，后面的句法关系不能可靠复原。
    reason: lexical_and_textual_uncertainty
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲟ
  choice: 尊重
  rationale: 此处该动词的基本义是“尊重、尊敬、给予荣誉”；句式为第二人称复数陈述“你们尊重我”，并非“拥抱我”。
- source_word: ϣⲱϥ
  choice: 轻蔑
  rationale: ⲁⲧⲉⲧⲛϣⲱϥ 中的 ⲁ- 是完成时标记的一部分，不能拆作表示“无、不”的私有前缀；此处意为“你们曾轻蔑我”，也可有“鄙弃”之意。
- source_word: ⲛⲁ
  choice: 看见
  rationale: 按现存句法与修订校勘理解为第二人称复数完成式“你们曾看见我”；保留简明的感知义，不补入来源未明说的评价。
- source_word: ⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: 分散
  rationale: 在否定命令 ⲙⲡⲣ- 后表示“不要散开、倒出或抛散”；“分散”能自然连接后面的宾语“起初的事物”。
- source_word: ⲛϣⲟⲣⲡ
  choice: 起初的事物
  rationale: 词形与“首先、起初”有关；因残文未明确所指，译为较宽泛的“起初的事物”，不擅自解释为原则、开端或先人。
- source_word: ⲙⲉⲗⲉⲧⲁ
  choice: 思量
  rationale: 希腊语借词可表示思想、默想、操练；残句中宾语不存，故采用涵盖面较广的“思量”。
- source_word: ⲗⲁⲁⲧⲉ
  choice: 肢体
  rationale: 可指身体的各部分或成员；此处上下文残缺，“肢体”既保留身体意味，也不额外确定其象征含义。
theological_decisions:
- issue: 残文中的“起初的事物”所指
  choice: 保留字面而不作神学解释
  alternative: 译作“起初的原则”“最初的人”或“开端”
  rationale: 现存文字及其低置信度分段不足以确定指涉；具体化会消除原文真实的不确定性。
- issue: 尊重与轻蔑并置所形成的张力
  choice: 保留两种相反行动的直接并列
  alternative: 调和为先轻蔑、后尊重的时间发展
  rationale: 原文没有明确给出因果或时间解释；不应替诗歌化解其悖论式张力。
translation_notes:
  register: 采用现代、庄重而简明的普通话。以现存科普特文为主，不沿用错位的英文咨询文本所给出的“羞耻／无耻—拥抱”段落。用省略号标示抄本缺损，不把彼此断裂的词组强行补成完整句；“你们”保留第二人称复数。
