base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/114.yaml
  text: '… with those who were sent[a];

    I am the one cast out;

    among the dead — but I am the one who exists alone[g][f][e][d][c][b], and the everlasting.'
translation:
  language: zh_hans
  text: '……与那些奉差遣的人同在[a]；


    我是那被赶逐的[b]，


    在死人中间——然而，我是那独自存在的，也是永恒者[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头承接前文，现存摘录只保留“……与那些奉差遣的人”。关系结构也可理解为“与他们所差遣的人”。
    reason: 残文与句法歧义
  - marker: b
    text: “被赶逐”也可译作“被赶出”或“被驱逐”。
    reason: 词义选择
  - marker: c
    text: 原摘录到ⲙⲛⲧⲁⲓ即中断；这里可能续成表示“永恒／世代”的词，因此译作“永恒者”，但文本并不完整。
    reason: 残缺文本
lexical_decisions:
- source_word: ⲙⲛ̄ ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: 与那些奉差遣的人同在
  rationale: ⲙⲛ̄ 表示“与……一起”；ⲧⲛ̄ⲛⲟⲟⲩ是“差遣”。关系结构可按被动意义理解为“那些奉差遣的人”，同时在脚注保留“他们所差遣的人”的句法可能。
- source_word: ⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: 被赶逐
  rationale: 该词组有“赶出、逐出”之意。“被赶逐”保留受排斥的力度，也符合本段简短而庄严的语气。
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: 在死人中间
  rationale: ⲙⲟⲟⲩⲧ是表示死亡状态的形式，应译为“死了的／死人”，而非“正在死去的人”；ϩⲛ在复数人群前自然译作“在……中间”。
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ ⲟⲩⲁⲁⲧ
  choice: 那独自存在的
  rationale: ϣⲟⲟⲡ兼有“存在、在场”之义，ⲟⲩⲁⲁⲧ表示“独自、单独”。此译保留存在性的表达，不把“独自”解释成某种特定教义上的“独一”。
- source_word: ⲙⲛⲧⲁⲓ(ⲱⲛ)
  choice: 永恒者
  rationale: 现存摘录在ⲙⲛⲧⲁⲓ处中断，较可能续成与“永恒／世代”有关的形式。正文依上下文采用“永恒者”，并以脚注注明残缺。
theological_decisions:
- issue: “在死人中间”与“独自存在、永恒”之间的悖论
  choice: 保留并列张力，不作调和
  alternative: 把“死人”灵意化，或将后句改写为解释前句
  rationale: 《雷霆，完美的心智》的第一人称宣告常以悖论构成意义；原文没有提供足够根据来消除此张力。
- issue: ⲟⲩⲁⲁⲧ的神学含义
  choice: 译作“独自”，不扩充为“独一无二”
  alternative: 独一者／唯一存在者
  rationale: “独自”最直接地保留原词的单独性，同时避免把本句预先纳入某一特定本体论体系。
translation_notes:
  register: 采用现代、庄严而易懂的汉语，以短行和破折号保留宣告体的节奏及悖论感。“奉差遣”略带典雅色彩，但仍属现代宗教与一般书面语可理解范围。未沿用英文咨询层中已被纠正的“未曾认识”读法，也将ⲙⲟⲟⲩⲧ按状态形式译为“死人”。
