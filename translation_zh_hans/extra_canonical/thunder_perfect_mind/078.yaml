  choice: 保留两个不同概念，不将二者统一解释为“团体内外”或“神性内外”
  alternative: 按特定宇宙论或教会论将两句具体化
  rationale: 原文以关联/共同存在与本质/所有关系形成张力；现有证据不足以指定单一教义解释。
- issue: 靠近、远离与认识之间的悖论
  choice: 按原文保留悖论，不补充因果说明
  alternative: 解释为身体距离与属灵认识的对比
  rationale: 文本本身没有明说距离属于身体、伦理或灵性层面，解释性增译会消除其刻意的多义性。
- issue: 末两句残缺及平行补足
  choice: 正文按上下文补成完整的反向平行句，并加注说明
  alternative: 将末句截断，或在正文中使用方括号
  rationale: OCR 摘录在末句中断，但标准段落结构和现存开头支持这一补足；注脚明确证据状况，避免把重构伪装成完全可见的原文。
