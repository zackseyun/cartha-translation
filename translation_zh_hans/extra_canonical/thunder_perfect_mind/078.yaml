base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/078.yaml
  text: 'Those who exist outside my association are ignorant of me[a],

    and those who exist in my substance are the ones who know me.

    Those who are close to me have been ignorant of me,

    and those who are far away from me are the ones who have known me.

    On the day when I am close to you, you are far away from me,

    and on the day when you are close to me, I am far away from you.'
translation:
  language: zh_hans
  text: '那些不与我相伴的人不认识我[a]；


    那些在我的本质之中的人，才是认识我的。



    那些与我相伴的人曾不认识我；


    那些远离我的人，才是认识了我的。



    在我靠近你们的日子，你们远离我；


    在你们靠近我的日子，我远离你们。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不与我相伴的人”所译的词组直指在说话者的“共同存在、交往、相伴关系”之外的人；该词也可按语境译作“同在”或“关联”。
    reason: lexical_alternative
  - marker: b
    text: 所提供的OCR摘录在本句第二个时间从句开始后中断；此处依前句及本段清楚的反向平行结构补足。
    reason: textual_note
lexical_decisions:
- source_word: ⲛⲉⲧϣⲟⲟⲡ ⲉⲃⲟⲗ ϩⲛ ⲧⲁⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: 那些在我的相交之外的人
  rationale: ⲥⲩⲛⲟⲩⲥⲓⲁ 的基本义是共同存在、交往或相伴；“相交”保留关系性的“同在”含义，又与后文“本质”形成原文的词语张力。
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: 不认识我
  rationale: 该形式按上下文表示缺乏认识；用“不认识”比“不知道”更适合人与说话者之间的关系语境。
- source_word: ⲛⲉⲧϣⲟⲟⲡ ⲛⲧⲁ ⲟⲩⲁ
  choice: 那些在我的本质之中的人
  rationale: OCR 分词不稳，但与前句“在我的相交之外”构成对举；依现有校订所反映的 substance 读法译作“本质”，同时不把它解释成某种特定神学体系。
- source_word: ⲛⲉⲧⲙⲏⲛ ⲉⲣⲟⲉⲓ
  choice: 那些靠近我的人
  rationale: 此处在段落对举中表达临近或贴近关系；译作“靠近”可与后面的“远离”保持鲜明平行。
- source_word: ⲛⲉⲧⲟⲩⲏⲏⲩ ⲛⲥⲁⲛⲃⲟⲗ ⲙⲙⲟⲉⲓ
  choice: 那些远离我的人
  rationale: 保留空间距离意象，并与“靠近我的人”构成原文悖论式对照。
- source_word: ϩⲙ ⲡⲉϩⲟⲟⲩ
  choice: 在……的日子
  rationale: 直译其时间表达，保留宣告体庄重而重复的节奏。
