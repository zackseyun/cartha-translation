  yaml_path: translation/extra_canonical/thunder_perfect_mind/118.yaml
  text: 'And there are ignorances,

    and passions that are about to come,

    and pleasures toward you[a],

    and a power that you will take[b],

    a clear‑mindedness[c]—

    they will run up into their emptiness[d].'
translation:
  language: zh_hans
  text: '又有种种无知，

    有将要临到的种种情欲，

    也有朝向你们的种种享乐[a]，

    有一种你们将要取得的力量[b]，

    还有清醒[c]——

    它们必奔上去，进入自己的虚空[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文ⲡⲣⲟⲥ ⲡⲉ没有明说介词的宾语；“你们”是根据周围劝诫性的语境补出的。
    reason: alignment_note
  - marker: b
    text: 这里按“你们将要取得它”解析；相关动词也可能意为“领受”或“抓住”，主语也可能另作“它们”。
    reason: alternative_reading
  - marker: c
    text: 原文ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ是动词形式，可理解为“直到他们清醒”或“使他们清醒”；正文为保持列举结构而译成名词。
    reason: alignment_note
  - marker: d
    text: ⲡⲟⲩⲕⲏⲛⲏ在此理解为“他们的虚空”；也可能译作“他们的贫乏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲉⲛⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: 种种无知
  rationale: ⲙⲛⲧ-将否定形式名词化，表示“不知、无知”；复数冠词ϩⲉⲛ以“种种”体现其复数性。
- source_word: ϩⲉⲛⲡⲁⲑⲟⲥ
  choice: 种种情欲
  rationale: 希腊语借词πάθος在此类伦理性列举中通常指支配人的欲情或激情；“情欲”比“苦难”更切合该语境。
- source_word: ⲉⲧϣⲁⲉⲓⲏⲧ
  choice: 将要临到的
  rationale: 关系形式ⲉⲧ-与将来成分ϣⲁ-表达将要来到；“临到”自然保留其趋近意味。
- source_word: ϩⲉⲛⲏⲇⲟⲛⲏ
  choice: 种种享乐
  rationale: 希腊语借词ἡδονή的常见伦理含义是“享乐、快感”；复数用“种种”表示。
- source_word: ⲡⲣⲟⲥ
  choice: 朝向
  rationale: 保留希腊语借词πρός的基本方向意义，不改释为“反对”或“关于”。
- source_word: ⲟⲩⲉⲓϣ
  choice: 一种力量
  rationale: ⲉⲓϣ表示力量或能力；不定冠词ⲟⲩ译作“一种”，避免把它实体化为特定神能。
- source_word: ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟ
  choice: 你们将要取得的
  rationale: 按关系形式加第二人称复数将来式理解；动词可能表示拿取、领受或抓住，“取得”较少预设其主动强度。
- source_word: ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ
  choice: 清醒
  rationale: ⲛⲏⲫⲉ源于希腊语νήφω，意为清醒、警醒；正文依列举结构名词化，但以脚注说明原形式实际是动词。
- source_word: ⲛⲥⲉ ⲡⲱⲧ
  choice: 它们必奔
  rationale: ⲡⲱⲧ可指奔跑或逃跑；这里取中性的“奔”，不预断其是否带逃离意味。
- source_word: ⲉϩⲣⲁⲓ
  choice: 上去
  rationale: 直接保留向上的方向成分。
- source_word: ⲡⲟⲩⲕⲏⲛⲏ
  choice: 自己的虚空
  rationale: 按与希腊语κενή／κένωμα相关的形式理解为“他们的虚空”；中文以“自己的”使回指复数事物更自然，“贫乏”仍是可能读法。
