  yaml_path: translation/extra_canonical/thunder_perfect_mind/001.yaml
  text: 'Thunder, Perfect Mind.


    I was sent forth from the Power[a],

    and I have come[b] to those who meditate on me,

    and I was found[c] among those who seek me.'
translation:
  language: zh_hans
  text: '雷霆，完美的心智


    我从大能[a]中被差遣出来，

    我来到[b]那些默想我的人那里，

    又在那些寻求我的人中被找到[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能”很可能对应科普特语所借用的希腊语 δύναμις（意为“能力、权能”）。本段OCR所见文字没有完整显示这一短语及其冠词；“从大能中”依据通行文本补足。
    reason: 说明底本残缺及推定读法，避免把称号性质说得过于确定。
  - marker: b
    text: 通行校本在这里读作“我来到”。但本段OCR显示的是 ⲛⲧⲁⲓⲥⲱⲧⲙ，即“我被听见”；若该字形无误，本句也可译作：“那些默想我的人听见了我。”
    reason: 保留OCR与通行校读之间的重要异文。
  - marker: c
    text: 这里的科普特语也可理解为“我发现自己”或“他们找到了我”。正文采用“被找到”，以保留施事者未明的表达。
    reason: 说明语态和施事关系的真实歧义。
lexical_decisions:
- source_word: ⲧⲃⲣⲟⲛⲧⲏ
  choice: 雷霆
  rationale: 源自希腊语 βροντή，意为雷鸣、雷霆；标题中采用凝练而庄重的“雷霆”。
- source_word: ⲛⲟⲩⲥ
  choice: 心智
  rationale: 希腊语 νοῦς 可指心智、理智或智性；“心智”既保留思想能力的含义，也避免单纯译作“心”所可能产生的情感化理解。
- source_word: ⲛⲧⲉⲗⲉⲓⲟⲥ
  choice: 完美的
  rationale: 希腊语 τέλειος 可指完美、完全、成熟；标题中“完美的”最贴近传统含义，同时保留其崇高语气。
- source_word: ⲧⲁⲛⲧⲁⲟⲩⲟⲉⲓ ... ⲉⲃⲟⲗ
  choice: 我……被差遣出来
  rationale: 保留被动语态及向外而出的方向感，表明这一行动由另一施事者发起。
- source_word: (implied) ⲛⲧⲉ ⲧⲉ ⲇⲩⲛⲁⲙⲓⲥ
  choice: 从大能中
  rationale: “大能”适合表达希腊语 δύναμις 的力量、权能义；“中”保留“由其而出”的空间性，而标题式指称所涉及的文本问题交由脚注说明。
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: 默想我的
  rationale: ⲙⲉⲉⲩⲉ 在此带有思索、反省意味；“默想”符合全篇沉思性的语调。
- source_word: ⲛⲧⲁⲓⲥⲱⲧⲙ (OCR) / ⲛⲧⲁⲓⲉⲓ (expected)
  choice: 我来到
  rationale: 依据通行校读采用“来到”；现有OCR字形则可能支持“我被听见”，故在脚注中保留异读。
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: 我……在那些寻求我的人中被找到
  rationale: 这一表达可作反身、被动或不定施事理解；正文采用“被找到”，以保留与前文被动结构的呼应，并在脚注列出其他可能。
theological_decisions:
- issue: “大能”是否应明确人格化或视为神名
  choice: 采用“大能”，不增添人格化称谓
  alternative: 译作“那位大能者”或“权能”
  rationale: 源词可具有称号性质，但现存OCR片段并未完整显示相关冠词；因此保留可能的神圣称号意味，却不把人格身份确定化。
- issue: 说话者被找到这一表述的施事与语态
  choice: 译为“被找到”
  alternative: “我发现自己”或“他们找到了我”
  rationale: 科普特语结构容许多种理解；选择汉语被动式可保留施事者未明的张力，不把自我发现或他人发现定为唯一解释。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。标题保留原文三个名词性成分的陌生感；正文维持三行平行句式。“默想”“寻求”“差遣”适合宗教诗性语境，但仍为普通现代读者所能理解。
