  revision_rationale: 修订集中处理两处会影响语法关系的关键问题：脚注b改正OCR异读的主动态；末句改译为原文直接支持的主动反身式。另将首句调整为更自然的现代汉语，未改变其被差遣、由“大能”而出的含义。
