  naturalness: 原译整体庄重自然，但“从大能中被差遣出来”在现代汉语中略显滞涩，且“从……中”容易强化空间内部的意思。“由大能差遣而出”更符合汉语搭配，也保留源文的出发来源与被动/受使动意涵。
  terminology: “心智”“默想”“寻求”“大能”均合乎现代汉语宗教—哲思语域；“大能”不作人格化处理是审慎的。“由大能差遣而出”比“从大能中被差遣出来”更准确顺畅。
