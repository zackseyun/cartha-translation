  yaml_path: translation/extra_canonical/thunder_perfect_mind/065.yaml
  text: 'greatness in parts from smallness[a].

    For they know smallness from greatness.

    Why do you curse me and honor me?

    You have wounded, and you have shown mercy.

    Do not cast out the first things[c][b],'
translation:
  language: zh_hans
  text: '伟大在若干方面出于微小[a]。


    因为人们从伟大认识微小。


    你们为什么咒诅我，却又尊荣我？


    你们已经伤害，又施了怜悯[b]。


    不要把起初之物抛出去[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一行似乎承接上文。“微小”所据词形可能受 OCR 影响，但它与“伟大”的对照支持此译。
    reason: textual_and_alignment_note
  - marker: b
    text: 原文没有明说“伤害”和“施怜悯”的对象；按上下文也可理解为“你们伤害了我，却又怜悯我”。
    reason: preserve_grammatical_ambiguity
  - marker: c
    text: “抛出去”所据词形和切分不十分确定；也可能有“倒出”或“分开”的意思。“起初之物”也可译作“最初的事物”或“首要之物”。
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ⲙⲛⲧⲛⲟϭ ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ ⲉⲃⲟⲗ ϩⲛ ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: 从微小而来、分散在各部分中的伟大
  rationale: 按修订后的句法，将 ⲉⲃⲟⲗ ϩⲛ 读作“从……而来”，并保留“伟大—微小”的悖论性对照；原文片段起首可能承接上文，因此不强行补成完整陈述句。
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: 因为人们……认识
  rationale: 将 ⲉϣⲁⲩ- 识别为习惯性第三人称复数前缀，而非把 ϣⲁⲩ 单独理解为“衰老”；中文用泛指“人们”自然表达。
- source_word: ⲉⲧⲕⲉ ⲟⲩ
  choice: 为什么
  rationale: 依上下文及校勘判断为 ⲉⲧⲃⲉ ⲟⲩ 的 OCR 误读，作为疑问词处理。
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  choice: 你们咒诅我
  rationale: ⲥⲁϩⲟⲩ 表示“咒诅”，与后面的“尊荣”构成鲜明对立。
- source_word: ⲧⲉⲧⲛⲧⲁⲉⲓⲟ
  choice: 你们尊荣我
  rationale: ⲧⲁⲉⲓⲟ 的通常义为“尊荣、看重”，不取旧释“抛弃”。
- source_word: ⲁⲧⲉⲧⲛϣⲱϥ
  choice: 你们伤害了
  rationale: 把 ⲁ- 识别为完成时标记；ϣⲱϥ 在此取“伤害、毁伤”，与随后“施怜悯”形成张力。
- source_word: ⲁⲧⲉⲧⲛⲛⲁ
  choice: 你们施了怜悯
  rationale: 把 ⲁ- 识别为完成时，ⲛⲁ 取“怜悯”义。
- source_word: ⲙⲡⲣⲡⲟⲩϩⲧ ⲉⲃⲟⲗ ⲛⲛϣⲟⲣⲡ
  choice: 不要把起初之物抛出去
  rationale: ⲙⲡⲣ- 为否定命令；末尾动词的确切读法不稳，正文采用与“抛出、倒出”相近的直观译法，并将复数 ⲛⲛϣⲟⲣⲡ 译为“起初之物”。
theological_decisions:
- issue: 伤害与怜悯是否具有同一受事者
  choice: 正文以泛指“人”补足“伤害”的宾语，但不明确等同于说话者
  alternative: 译作“你们伤害了我，却又怜悯我”
  rationale: 现存科普特文在这两个动词后未明示宾语；补成“我”虽符合上下文，却会消除原文的句法开放性。
- issue: “起初之物”的本体含义
  choice: 保留抽象复数表达
  alternative: 译作“起源”“最初的人”或“首要之物”
  rationale: ⲛⲛϣⲟⲣⲡ 可指最初、先前或首要的事物；本段不足以确定其宇宙论或人物所指，不作教义化限定。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话；以“伟大／微小、咒诅／尊荣、伤害／怜悯”保留诗歌连续的悖论结构。避免把含混的“起初之物”解释成特定宗派的宇宙论术语。
