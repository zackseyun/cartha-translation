base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/102.yaml
  text: 'Take hold of yourselves[a];

    for your inside is your outside[c][b],

    and the one who fashions your outside

    is the one who shaped it.'
translation:
  language: zh_hans
  text: '**18.** 要把握住你们自己；

    因为你们的里面就是你们的外面，

    而那塑造你们外在的，

    正是使它成为样式[a]的那一位。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “样式”所译的词是 ⲧⲩⲡⲟⲥ（源自希腊语 τύπος），也可指“印痕”“模型”或“范型”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲱⲧⲛ
  choice: 要把握住你们自己
  rationale: 将 ⲁⲙⲁϩⲧⲉ 按命令式“抓住、把握”理解，反身意义由后接第二人称复数形式表达；避免误译为“显现”。
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ
  choice: 你们的里面
  rationale: ⲥⲁϩⲟⲩⲛ 指“里面、内部”；用“里面”与下句“外面”构成原文鲜明对举。
- source_word: ⲡⲉⲧⲛⲥⲁⲃⲟⲗ
  choice: 你们的外面
  rationale: ⲥⲁⲃⲟⲗ 指“外面、外部”，不按校改读成“忍耐”。
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: 塑造
  rationale: 该词源自希腊语 πλάσσειν，带有塑形、造作的工匠意象；“塑造”既自然又保留形体形成的语义。
- source_word: ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ
  choice: 使它成为样式
  rationale: τύπος 可指印痕、模样或范型；依使役结构译作“使它成为样式”，不把它弱化为一般的“塑成”，同时在脚注保留其他可能。
theological_decisions:
- issue: “里面就是外面”的悖论性陈述
  choice: 直译为“你们的里面就是你们的外面”
  alternative: 解释为内外一致或内在显露于外
  rationale: 原文以系词名词句直接等同“里面”与“外面”；不在正文中替作者消解其思想张力。
- issue: 末句代词的所指
  choice: 用中性“它”承接“你们的外在”
  alternative: 译作“他”，理解为所塑造的人
  rationale: 科普特语形式为第三人称阳性单数，但其具体先行词并不完全明确；现代汉语用“它”可自然回指“外在”，又不额外引入人格化解释。
translation_notes:
  register: 采用庄重而通顺的现代汉语，以“里面／外面”“塑造／样式”保留原文的对举和造型意象。OCR 中有疑似重复字串，但不把该重复反映在译文中。
