lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ
  choice: 不要
  rationale: 这是科普特语的否定劝诫结构；用直接禁令“不要”保留诗歌的命令语气。
- source_word: ⲥⲱⲧⲙ
  choice: 听／听从
  rationale: 现存OCR摘录中此词本义为“听”；但该摘录与本段的启发式对齐并不稳固，因此只在脚注中说明可能的显式“听我”读法，不据此改写正文。
- source_word: ⲕⲁⲧⲁ
  choice: 在／就……而言
  rationale: 这是希腊语借词；在空间或时间的分配性表达中，汉语以“在”或“无论……”最自然。
- source_word: ⲙⲁ
  choice: 地方
  rationale: 保留空间范畴，与后面的时间范畴构成平行。
- source_word: ⲟⲩⲙⲉⲩⲉ
  choice: 时候
  rationale: 可有“时刻”一类理解；正文采用日常而庄重的“时候”，具体歧义见脚注。
- source_word: ⲛⲕⲉ-
  choice: 任何／别的
  rationale: 该成分有“另一个、别的”之意，在分配性语境中可表达不定范围。
- source_word: ⲁⲩⲱ
  choice: 不在正文译出
  rationale: 该段OCR摘录开头虽有连接词，但对齐资料及后续校勘指出目标句本身未必以此连接词起首；正文不加“并且”，脚注保留另一种分句可能。
theological_decisions:
- issue: “不认识我”的认知力度
  choice: 不要不认识我
  alternative: 不要对我一无所知／不要忽视我
  rationale: “不认识”保留认识、知晓之间的张力，不把原文收窄为单纯的疏忽，也不强化为特定宗教意义上的属灵认识。
translation_notes:
