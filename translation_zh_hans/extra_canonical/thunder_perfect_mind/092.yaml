  source_fidelity: 草稿将ⲧⲥⲟⲃⲧⲉ译为“预备”，缺乏该词在此的直接词义支持；它通常指教导、训诲或教训。ⲡⲁⲛⲟⲩⲥ确为“我的心思”，ⲉϩⲟⲩⲛ保留“在内／向内”的空间或内向意味。ⲧⲡⲱϣⲥ的基本义与划分、区别有关；在“名字”的搭配中译作“发音”可以成立为语境化处理，但应以脚注明确其非唯一、也非字面核心义。其余两行忠实保留了“向外呼喊”与“听见者”的对应。
