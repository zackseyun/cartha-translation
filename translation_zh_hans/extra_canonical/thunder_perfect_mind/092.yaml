base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/092.yaml
  text: 'I am the understanding of every person, my mind within.

    I am the knowledge of my name.

    I am the cry that goes out,

    and I am the one who hears.'
translation:
  language: zh_hans
  text: '**8.** 我是每个人的教导——我在内的心思。[a]


    我是我名字的发音。[b]


    我是向外发出的呼喊，


    我也是听见的那一位。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”也可译作“训诲”或“教训”。“我在内的心思”在原文中紧接其后；其与前一短语的确切句法关系并不明确。
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: 该词的基本义可表示“划分、区别、分开”；用于名字或言语时，可理解为“音节划分、发音”或“清楚说出”。“发音”是按此处语境所作的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: 预备
  rationale: 该词的基本义是“预备、准备、装备”；采用“预备”保留名词性和原文较抽象的表达，不按上下文推演为“理解”。
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: 每个人的
  rationale: ⲣⲱⲙⲉ 指“人”，ⲛⲓⲙ 在此为“每一、所有”；“每个人”是现代汉语自然且不限定性别的表达。
- source_word: ⲡⲁⲛⲟⲩⲥ ⲉϩⲟⲩⲛ
  choice: 我内在的心思
  rationale: ⲡⲁ- 是第一人称单数所有格，“我的”；ⲛⲟⲩⲥ 源自希腊语 νοῦς，可指心思、心智；ⲉϩⲟⲩⲛ 表示向内或在内。用破折号保留它与前句关系不完全明确的并置结构。
- source_word: ⲧⲡⲱϣⲥ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: 我名字的发音
  rationale: ⲡⲱϣⲥ 的核心语义涉及分开、划分，在言语语境中可引申为音节划分、清楚说出或发音；这里不采用缺乏直接词义支持的“知识”。
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: 向外发出的呼喊
  rationale: ϣⲕⲁⲕ 表示呼喊，ⲉⲃⲟⲗ 表示向外；译文同时保留声音的力度和向外发出的方向。
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: 听见的那一位
  rationale: ⲥⲱⲧⲙ̄ 的直接意义是“听见”；“那一位”与前面的第一人称身份宣告相配，并与“呼喊”形成对应。
theological_decisions:
- issue: “我内在的心思”与“每个人的预备”之间的句法关系
  choice: 以破折号并置，不补入解释性连词
  alternative: 我是每个人的预备，我的心思在里面
  rationale: OCR 摘录中的标点和短语衔接不能明确判定二者是同位、补述还是另一个残缺分句；译文避免将“心思”擅自归给“每个人”，也不把两者解释成特定神学关系。
- issue: 名字相关短语的意义
  choice: 我名字的发音
  alternative: 我名字的划分／我名字的清楚说出
  rationale: 保留该词由“划分”向言语“发音、音节划分”发展的张力，不依主题连贯性改成“我名字的知识”。
translation_notes:
  register: 采用庄重而简明的现代标准汉语，保留反复的“我是”宣告和末两行“呼喊／听见”的声音对应。对两个词义及句法有争议之处不以顺畅为由改写成认知性术语，而用脚注呈现真实歧义。
