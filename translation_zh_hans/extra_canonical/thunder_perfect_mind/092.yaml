  source_fidelity: 译稿对ⲡⲁ-（“我的”）、ⲡⲱϣⲥ的“划分／分开”语义范围，以及ⲁϣⲕⲁⲕ ⲉⲃⲟⲗ和ⲉⲧⲥⲱⲧⲙ̄的基本意义处理审慎。首句中ⲡⲁⲛⲟⲩⲥ ⲉϩⲟⲩⲛ是一个无明确谓语、指向“我的心思／向内（在内）”的压缩片语；不宜把它译成“我内在的心思”，因为这会把ⲉϩⲟⲩⲛ限定为修饰“心思”，并遮蔽其与前文可能的句法联系。
