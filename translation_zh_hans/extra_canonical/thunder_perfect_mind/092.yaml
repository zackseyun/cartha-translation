  terminology: “预备”可保留为对ⲧⲥⲟⲃⲧⲉ的保守译法，并以注释提示“准备／装备”等可能性。“我名字的发音”是对ⲧⲡⲱϣⲥ在此处可能指向言语分划或清楚说出的可行处理；不应因英语审计轨迹的主题性推断而改作“知识”。“心思”“呼喊”“听见的那一位”均合适。
