  terminology: 不应因英语审校链中的后期裁定而采用“预备”；该裁定与ⲥⲟⲃⲧⲉ作为“教导／训诲”的常见用法不符。名字短语不宜译作“知识”，因为这掩盖了ⲡⲱϣⲥ的“划分／区别”语义。保留“发音”作为谨慎、可读的上下文译法，并在注释中说明“划分、区分、音节划分、清楚说出”等可能性。
