lexical_decisions:
- source_word: ⲁⲧⲱⲧⲙ
  choice: 未封闭者
  rationale: 按否定前缀 ⲁⲧ- 与表示“关闭、封住”的词干理解，并将其名词化，以保留原文“我是……”的身份宣告；“未封闭”也保留了该词可能涉及不受阻隔状态的开放性。
- source_word: ⲣⲙⲙⲁⲟ
  choice: 富有者
  rationale: 该词通常表示“富有的、富人”；译成“富有者”与前项保持平行，同时不额外限定为物质或属灵财富。
- source_word: ⲡϫⲓⲥⲉ
  choice: 高处
  rationale: 基本义为“高度、高处、崇高”；此处不用缺乏词源依据的“羞耻”。
- source_word: ⲛⲍⲏⲧⲉ
  choice: 寻求的
  rationale: 按希腊语 ζητεῖν（寻求）的借词或转写理解；以属格结构连接前面的“高处”，但因句段在此中断，保留其悬而未决的句法。
theological_decisions:
- issue: “富有”的性质
  choice: 不说明是物质、属灵或象征性的富足
  alternative: 译作“丰盛者”或“灵里富足者”
  rationale: 原词只表达富有，语境没有充分依据将其神学化。
- issue: “寻求的高处”的句法关系
  choice: 保留为未完的短语
  alternative: 补成完整判断句，如“我是寻求的高峰”
  rationale: 现有摘录的下一行仍继续展开，强行补入“我是”或确定主谓关系会消除原文残段的真实歧义。
translation_notes:
  register: 采用庄重而易懂的现代汉语，以“……者”维持连续身份宣告的诗性节奏。末尾保留逗号，显示源文和对照片段在此处尚未结束；所有不确定性均放入脚注，而不恢复早先缺乏词汇依据的“羞耻和骄傲”。
