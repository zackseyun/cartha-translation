    reason: 词义替代项
lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁϣⲱⲡⲉ
  choice: 那将要成为的
  rationale: 这是带定冠词的关系将来式，实词化后可指“那将成为的（人或事物）”。中文保留“的”字结构，不擅自判定所指是人还是事，也不把它改写成标题式的“将要发生的事：”。
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: 我是
  rationale: 撒希迪科普特语等同句式；直译为“我是”，既保持身份宣告，也保留原文反复而有力的节奏。
- source_word: ⲧⲉⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: 宽恕
  rationale: 源自希腊语 συγγνώμη 的借词，可表示宽恕、赦免、宽容。“宽恕”自然清楚，同时以脚注保留其他可能。
- source_word: ⲁⲩⲱ
  choice: ；／和
  rationale: 常用并列连词，基本义为“和、并且”。译文用分号呈现连续并列和吟诵节奏，并未赋予额外的逻辑关系。
theological_decisions:
- issue: ⲡⲉⲧⲛⲁϣⲱⲡⲉ 所指是人还是事
  choice: 用“那将要成为的”保持开放
  alternative: “那将成为的人”或“将要发生的事”
  rationale: 原形式虽为阳性单数实词化关系结构，却可因语境或语法泛指而存在解释空间；OCR及片段对齐可信度又低，因此不宜在正文中锁定人格或事件解释。
- issue: ⲥⲩⲛⲅⲛⲱⲙⲏ 的神学语义
  choice: 宽恕
  alternative: 赦免、宽容、体谅
  rationale: “宽恕”符合希腊语借词在基督教语境中的常见意义，却不额外指定罪得赦免的机制或教派性含义。
translation_notes:
  register: 采用现代、庄重而简明的普通话。保留原文三次完整的“我是宽恕”及末尾未完的第四次起句，用省略号反映OCR摘录在 ⲡ 后截断。分号帮助中文读者辨认循环结构；所有脚注标记均在正文出现。
