    reason: textual_variant
lexical_decisions:
- source_word: ⲧⲱⲧⲛ̄ ϩⲱⲧ ⲧⲏⲩⲧⲛ̄
  choice: 你们自己也要留意
  rationale: ϩⲱⲧ ⲧⲏⲩⲧⲛ̄宜理解为带反身强调的“你们也／你们自己也”，而非“唯独你们”。句首ⲧⲱⲧⲛ̄的形态及其与前文的衔接不够确定；为使汉语成句，谨慎译作劝告性的“要留意”，并保留直接呼告的语气。
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: 众天使
  rationale: 希腊语借词通常指天上的“天使”；“使者”在词义上也可能，但本段宇宙性呼告的语境更支持“天使”。
- source_word: ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: 那些奉差遣的人
  rationale: 核心动词应是“差遣”，不是“看见”；关系结构可自然理解为不定施事的被动，即“那些被差遣的人”。
- source_word: ⲡⲓⲛⲁ
  choice: 那标记
  rationale: 依此残段可作“标记／记号”理解；选择“标记”以避免预先赋予神迹或凭据等较具体含义。由于OCR及切分可靠度低，以脚注提示不确定性。
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: 指明出来
  rationale: 保留“向外显出、指出”的方向性；“使之出现”或“分开”亦属可能，故不在正文中把歧义强行定死。
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: 在死者中
  rationale: ϩⲛ可表示“在……中／在……当中”，而ⲛⲉⲧⲙⲟⲟⲩⲧ指“死者”。
- source_word: ⲭⲉ
  choice: 因为
  rationale: 此处字形可能对应引出说明的连接词，译作“因为”较符合后续自我宣告；OCR也可能影响读法，因此脚注列出其他衔接可能。
- source_word: ⲁⲛⲟⲕ ⲡⲉⲧ
  choice: 我就是那位……
  rationale: ⲁⲛⲟⲕ保留强调性的“我”，ⲡⲉⲧ引出关系从句，但所给摘录在此中断，故以省略号忠实呈现残缺。
