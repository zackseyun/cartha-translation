translation:
  language: zh_hans
  text: 他们必在那里找到我[a]，并且活着，不再死亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在那里”直译为“在那个地方”。由于本段与所附咨询文本的行文对应置信度很低，这里仅翻译科普特文中清楚可辨的句子。
    reason: alignment_note
  - marker: b
    text: “不再死亡”依据将 OCR 末尾的 ⲥⲱⲧ 校复为 ⲙⲟⲩ ⲟⲛ（“再死”）。现有 OCR 在此处很可能误读了字形或跨行文字。
    reason: textual_note
lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: 他们必找到我
  rationale: ⲥⲉⲛⲁϭⲓⲛⲉ 是第三人称复数将来式“他们将找到”，ⲙⲙⲟⲉⲓ 标示第一人称单数宾语“我”；直译并保留将来语气。
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: 在那里
  rationale: 字面为“在那个地方”；现代汉语用“在那里”自然表达同一指示意义。
- source_word: ⲛⲥⲉⲱⲛϩ
  choice: 并且活着
  rationale: ⲱⲛϩ 表示“活、存活”；前缀结构承接前句，可译为“并且活着”。不扩展为“得生命”，以免加入原文未明说的神学含义。
- source_word: ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ（据校勘恢复；OCR 作 ⲛⲥⲉⲧⲙⲥⲱⲧ）
  choice: 不再死亡
  rationale: 否定结构 ⲧⲙ 加 ⲙⲟⲩ“死”，并由 ⲟⲛ 表示“再、又”。现有 OCR 的 ⲥⲱⲧ 在此语境中很可能是对跨行或字形的误识。
theological_decisions:
- issue: “活着”是否应解释为属灵或永恒生命
  choice: 保留为“活着”
  alternative: “得生命”或“永远活着”
  rationale: 原文的 ⲱⲛϩ 本身可指活着或生命，但此处未明确限定生命的性质；后接“不再死亡”已形成强烈张力，无须在译文中进一步教义化。
- issue: 末句是否明确表示“不再死”
  choice: 正文采用“不再死亡”，同时以脚注说明校勘依据
  alternative: 按 OCR 字面保留难解形式，或译作“不……”
  rationale: 上下文、常见表达以及高级别复核均支持把 OCR 末尾校复为 ⲙⲟⲩ ⲟⲛ；但底本 OCR 确有不确定性，故不掩盖文本问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。译文以可辨认的科普特原文为准，没有沿用明显错位的英文咨询层；并以脚注公开末句的 OCR 与校勘不确定性。
