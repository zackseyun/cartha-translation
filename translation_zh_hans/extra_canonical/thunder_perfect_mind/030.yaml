  text: Do not leave me cast out[c][b][a], and you will find me in riches.
translation:
  language: zh_hans
  text: 不要任由我被赶出去[a]；你们必在富足中找到我。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶出去”也可译作“弃绝”或“抛出”。原文保留了被排斥、被抛出的具体动作意象。
    reason: lexical_alternative
  - marker: b
    text: 本段所给的科普特语文本是对听者的劝诫，并非作品较前出现的“我是战争，也是和平”。段末另起“也不要看……”的后续从句，语意在本摘录中未完，较可能属于下一句，故未收入正文。
    reason: alignment_note
lexical_decisions:
- source_word: ⲙⲡⲣⲕⲁⲁⲧ ⲉⲓⲛⲏϫ ⲉⲃⲟⲗ（据校订所复原）
  choice: 不要任我被抛在外面
  rationale: 否定命令式ⲙⲡⲣ-表达“不要”；ⲕⲁⲁⲧ含“任凭我、撇下我”之意，ⲛⲏϫ ⲉⲃⲟⲗ表示被抛出或被摒弃。译文保留其受排斥的具体形象，而不把它抽象化为“拒绝我”。
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: 你们必……找到我
  rationale: ⲧⲉⲧⲛ-是第二人称复数，未来式ⲛⲁ-在这里自然译为“必”；ϭⲓⲛⲉ意为找到、发现。
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: 在富足之中
  rationale: ⲙⲛⲧⲣⲙⲁⲟ指富有、财富或富足的状态。“富足之中”保留抽象名词结构，也不限定为金钱或具体财物。
theological_decisions:
- issue: “富足”是否应作属灵化解释
  choice: 保留为“富足”，不加限定
  alternative: 在属灵的丰富中／在财富中
  rationale: 原文并未说明这是物质财富还是属灵丰盛；不在正文中消解这种开放性。
- issue: 是否采用咨询文本“我是战争，也是和平”
  choice: 按本段实际映射的科普特文翻译劝诫句
  alternative: 我是战争，也是和平
  rationale: 该对句出现在作品较前位置，与本段所给科普特文不符；本段应以原文证据为先。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“任我被抛在外面”保留原句强烈的排斥意象；“富足之中”则维持原文可能兼指财富、丰盛或富有状态的含混性。
