  text: I am Justice[a]; I am the advocate[b].
translation:
  language: zh_hans
  text: 因为你们里面的，就是你们外面的；那从外面塑造你们的，正是把你们里面的塑成样式的那一位。至于你们在外面所看见的……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给科普特文在“你们在外面所看见的”之后截断，句意尚未完结；因此以省略号表示残缺。这个源文片段与所附英文咨询文本“我是正义；我是辩护者”并不对应。
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲁϩⲟⲩⲛ / ⲥⲁⲃⲟⲗ
  choice: 里面 / 外面
  rationale: 在这段科普特文中，两词构成反复出现的空间对举；ⲥⲁⲃⲟⲗ 在此句法环境下表示“外面”，不宜按所附英文层译作“正义”。
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: 塑造
  rationale: 这是源自希腊语 πλάσσειν 的借词，表示塑造、成形；“塑造”既保留形象，也适合现代中文。
- source_word: ⲣⲧⲩⲡⲟⲥ
  choice: 塑成样式
  rationale: τύπος 可指样式、模型、印记或形态；结合塑造语境译作“塑成样式”，同时避免把其具体化为单一神学术语。
theological_decisions:
- issue: 是否采用“我是正义；我是辩护者”这一法律性宣告
  choice: 不采用；按现存科普特文译出内外与塑造的对举
  alternative: 我是正义；我是辩护者。
  rationale: 所给科普特文片段没有可辨认的第一人称“我是”、表示“正义”的抽象名词用法或“辩护者”一词。把 ⲥⲁⲃⲟⲗ 在这里解释为“正义”会破坏它与 ⲥⲁϩⲟⲩⲛ（里面）的明确对举。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留“里面／外面”的反复和平行结构。因源文末句残缺，不凭后续已知文本补足。
