  naturalness: “你们里面的，就是你们外面的”庄重且可理解；改为“你们里面的，正是你们外面的”更自然。末句应以“而”承接原文ⲁⲩⲱ，而非“至于”。
  terminology: “里面／外面”和“塑造”一致、自然，且忠于此处的词汇及平行。不可将这里的ⲥⲁⲃⲟⲗ译为“正义”，也不应在中文正文加入“辩护者”；所附英文文本及其脚注属于错位的对齐材料。
