  - severity: low
    issue: “把你们里面的塑成样式”略微过度落实ⲣⲧⲩⲡⲟⲥ的句法关系。
    rationale: 该处确有τύπος（样式、形态、印记）相关的形塑词，但在残片的代词和介词关系下，采用“也塑造了你们的里面”更稳妥，并保留不确定性。
