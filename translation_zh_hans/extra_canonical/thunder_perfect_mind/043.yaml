translation:
  language: zh_hans
  text: '我既是希腊人的知识，也是对此的无知。


    我是希腊人和蛮族人[a]的审判。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛮族人”译自古希腊—罗马语境中与“希腊人”相对的传统类别，泛指非希腊人；此处保留原文的历史性称谓，并非现代译者对任何群体的评价。
    reason: 说明该历史文化术语的指称范围及其可能带有的古代贬抑色彩。
lexical_decisions:
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: 知识
  rationale: 按校勘后所恢复的名词结构，带定冠词的 ⲥⲟⲟⲩⲛ 表示“知识”，并与下句“无知”构成悖论式对举。
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ ⲉⲣⲟⲥ
  choice: 对此的无知
  rationale: 尽管所给OCR严重讹损，后续源文复核恢复为“无知”并带回指成分 ⲉⲣⲟⲥ；译作“对此的无知”，保留其所指范围可能略有含混的特点。
- source_word: ⲡϩⲁⲡ
  choice: 审判
  rationale: OCR中的 ⲫⲁⲡ 可分析为定冠词与 ϩⲁⲡ 连写，意为“审判／判断”；此处选“审判”，保留庄严而尖锐的宣告语气。
- source_word: ⲛⲉⲗⲗⲏⲛ
  choice: 希腊人
  rationale: 复数标记 ⲛ- 表明所指为“希腊人”；现代汉语中复数通常无需另加“们”。
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: 外族人
  rationale: 该词指希腊文化语境中的非希腊人。译作“外族人”既保留群体对照，又避免现代汉语“野蛮人”过强的贬义误导。
theological_decisions:
- issue: 说话者同时自称“知识”与“无知”
  choice: 保留悖论，不作调和解释
  alternative: 改译为“没有理性，却有智慧”
  rationale: 校勘恢复的名词结构更支持“知识／无知”的直接对举；这种张力是作品修辞的核心，不宜在译文中化解。
- issue: ⲡϩⲁⲡ 的语义范围
  choice: 审判
  alternative: 判断／裁决
  rationale: “审判”可涵盖判定与裁决，同时与文本庄严的自我宣告体相称，但不额外限定为末世审判。
translation_notes:
  register: 采用现代、庄重而清楚的宣告体。首句保留“知识／无知”的悖论，次句保持“希腊人／外族人”的古代文化对举。因提供的OCR与后续校勘意见冲突，本稿优先采纳能解释标准科普特语形态的校勘恢复文本。
