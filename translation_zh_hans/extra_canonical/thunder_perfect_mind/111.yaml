  yaml_path: translation/extra_canonical/thunder_perfect_mind/111.yaml
  text: 'to him who created me[a].

    I am the one who will cry out his name.

    Look then at his words,

    and all the writings that have been completed.

    Listen therefore, you hearers,

    and you yourselves also[c][b], the angels'
translation:
  language: zh_hans
  text: '在那创造我的一位面前。[a]


    我就是要宣告他名的那一位。


    所以，你们要看他的言语，

    也要看一切已经写成的文字。[b]


    所以，听着吧，你们这些听众，

    以及你们自己，所有的天使……[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段开头承接上一句，摘录仅保存其尾部。可辨的科普特语ⲉⲣⲁⲧϥ通常意为“在他面前”，故本行不是独立完整句。
    reason: fragment_boundary
  - marker: b
    text: 底本OCR在此严重讹损；依据手稿语境，可校读为“他的言语”和“一切已经写成的文字”，而不是先前误对齐文本中的“言语／听觉”对句。
    reason: textual_alignment
  - marker: c
    text: 现有摘录在“天使”一词中或其后中断，后文未收入本段；省略号表示原段边界造成的未完，不是原文的标点。
    reason: fragment_boundary
lexical_decisions:
- source_word: ⲡⲉⲛⲧⲁϥⲧⲁⲙⲓⲟⲓ
  choice: 那创造我的一位
  rationale: 关系结构直指“创造我的那一位”；用“一位”维持庄重语体，同时不额外判定其身份。
- source_word: ⲧⲛⲁⲭⲱ ⲙ̄ⲡⲉϥⲣⲁⲛ ⲉⲃⲟⲗ
  choice: 要高声宣告他名
  rationale: ⲕⲱ/ⲭⲱ…ⲉⲃⲟⲗ在这里表达把名字说出、宣扬出来；“高声宣告”兼顾公开发声的力度，避免仅译为中性的“提到”。
- source_word: ϣⲁϫⲉ
  choice: 话
  rationale: 此处为复数所有格语境中的言语内容，现代汉语“他的话”自然、清楚；不沿用误对齐咨询文本中的抽象“言语”对句。
- source_word: ⲛⲉⲥϩⲁⲓ（据语境校读；OCR作ⲛⲉⲥⲙⲏ）
  choice: 文字
  rationale: 结合校读与后接“已经完成”，此处应指写成的文字或著述，而非OCR表面所似的“声音”。译作“文字”保留广义，不限定为某类经书。
- source_word: ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: 听众
  rationale: 这是源自希腊语ἀκροατής的借词，意为听者或听众；与命令“听着吧”形成有意的词根呼应。
- source_word: ⲛ̄ⲛⲁⲅⲅⲉ…
  choice: 众天使……
  rationale: 残存字母清楚指向“天使”的复数形式，但本段在词中或其后截断，故以省略号显示残篇未完。
theological_decisions:
- issue: “创造我的一位”的身份
  choice: 保留第三人称“他／那一位”
  alternative: 明确称为“神”或其他神圣称号
  rationale: 本段只说“创造我的”，没有给出专名或足以消除歧义的称号；不把特定神学身份强加进正文。
- issue: “他的名”所指
  choice: 保留代词“他”
  alternative: 以某一神名或称号替代
  rationale: 代词的指向依赖前后文；直译可保存作品自身的指涉张力。
- issue: 对“众天使”的呼告
  choice: 按残文译出，并标明未完
  alternative: 补成完整命令或神学陈述
  rationale: 现存摘录在此中断，不能根据推测补足天使所受的命令或其角色。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“我就是那要……”保留作品反复自我宣告的诗性句式；“听着吧，你们这些听众”有意保留原文命令与称呼之间的回声。由于OCR与咨询文本明显误对齐，本稿优先依据可辨认的科普特文、已记录的手稿校读和段落边界，不复现错误的“听觉／言语”对句。
