base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/053.yaml
  text: 'I am she whom you have despised,

    and I am she upon whom you have deliberated.

    I am she whom you have seized,

    and I am she whom you have made alive.'
translation:
  language: zh_hans
  text: '我是你们所鄙视的那一位，

    也是你们所思量的那一位。


    我是你们所抓住的那一位，

    也是你们使我活着的那一位。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本随后还有一个延续到下一段的未完整分句；现有摘录可见“……当你们隐藏自己时……”之类的词语。本段不作补译。
    reason: alignment_note
lexical_decisions:
- source_word: ⲧⲉ（ⲁⲛⲟⲕ ⲧⲉ…中的阴性述语冠词）
  choice: 那一位
  rationale: 汉语代词不标明语法性别；用“那一位”自然地表达关系从句结构，同时不凭空增添“她”。作品整体的女性说话者身份仍由上下文体现。
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: 鄙视
  rationale: 这是源自希腊语 καταφρονέω 的借词，基本义为轻看、鄙视，并非“迫害”。
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: 反复思量
  rationale: 该短语表示以说话者为思想对象；“反复思量”保留主动考量的意味，又不将含义限定为敌意的“图谋”。
- source_word: ϩⲱⲡ
  choice: 抓住
  rationale: 表达抓取、拿住或拘捕；“抓住”保留语义力度，也避免在语境不足时过度具体化为“逮捕”。
- source_word: ⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ
  choice: 使之活着
  rationale: 按及物结构表达“使我活着／使我有生命”；关系从句中以“使之活着”保持原文与前句的平行和略带悖论的张力。
theological_decisions:
- issue: “抓住”与“使之活着”之间的张力
  choice: 不解释二者的因果或救赎含义，保留并列反差
  alternative: 译成“拘捕我，却又救活我”
  rationale: 原文仅以并列结构陈述，没有“却”或“救”的明示；不应替文本消解其悖论。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，以四行排比再现反复的“我是……那一位”结构。开头的 ⲛ̄ⲧⲟⲟⲧ 属于上一句的句末成分（“从我”），不译作本段的“至于你们”。
