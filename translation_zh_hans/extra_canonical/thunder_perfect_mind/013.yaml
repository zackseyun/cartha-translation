translation:
  language: zh_hans
  text: '**8.** 我是接生婆，也是母亲。[a]


    我是处女，也是女人。[b]


    我是我父亲的母亲，也是我……的处女——[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲧϣⲉⲗⲉⲉⲧ 指“接生婆”。一些英语版本读作“接生婆和不生育者”，但本摘录所示的下一词为 ⲧⲙⲁⲁⲩ（“母亲”）；鉴于对齐置信度为中等，此处按现存词形译作“母亲”。
    reason: alignment_note
  - marker: b
    text: ⲥⲱⲛⲉ 也可译作“少女”；译作“处女”突出了它与 ⲥϩⲓⲙⲉ（“女人”）的对照。
    reason: lexical_alternative
  - marker: c
    text: 手稿摘录止于 ⲙⲡⲁ—，即“我的……”，其后的对象在本摘录中未存。译文以省略号和破折号标示残缺，不作猜补。
    reason: textual_variant
lexical_decisions:
- source_word: ⲧϣⲉⲗⲉⲉⲧ
  choice: 新娘
  rationale: 该词指新娘或新妇；按现存科普特文本直译为“新娘”，不采用咨询文本的“接生婆”。
- source_word: ⲧⲙⲁⲁⲩ
  choice: 母亲
  rationale: 这是科普特语中“母亲”的常用词，也保留了“新娘／母亲”的并置张力。
- source_word: ⲧⲥⲱⲛⲉ
  choice: 姊妹
  rationale: 该词在此指姐妹；中文用不限定长幼的“姊妹”，以免擅自译成姐姐或妹妹。
- source_word: ⲧⲥϩⲓⲙⲉ
  choice: 妻子
  rationale: 该词可泛指女人，也可指妻子；与“姊妹”并列并处于亲属身份悖论的语境中，“妻子”更贴切，同时在脚注保留“女人”这一可能。
- source_word: ⲧⲉ … ⲁⲛⲟⲕ / ⲁⲛⲟⲕ ⲧⲉ
  choice: 我是……
  rationale: 用现代汉语自然的身份判断句再现科普特语的强调性认同结构及反复节奏。
- source_word: ⲧⲙⲁⲁⲩ ⲛⲧⲉ ⲡⲁⲉⲓⲱⲧ
  choice: 我父亲的母亲
  rationale: 直接保留属格关系及其刻意形成的家族身份悖论。
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁ—
  choice: 我——的姊妹
  rationale: 所给文本在“我的……”之后中断；按汉语语序重排，并以破折号标明对象缺失，不猜补亲属称谓。
theological_decisions:
- issue: 多重女性亲属身份的悖论
  choice: 逐项保留“新娘／母亲、姊妹／妻子、父亲的母亲”等互有张力的自称
  alternative: 把这些称谓解释为象征角色，或改写成逻辑一致的关系
  rationale: 原文以并列身份制造张力；翻译不替文本提供神学或寓意上的调和。
translation_notes:
  register: 采用简洁、庄重而可读的现代标准汉语，保留原文连续“我是……”的宣告节奏。“姊妹”用于避免“姐姐／妹妹”所附加的长幼信息；末句以破折号呈现摘录中断。
