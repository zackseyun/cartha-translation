lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛⲧⲏⲏⲧⲉ
  choice: 我在你们中间
  rationale: ϣⲟⲟⲡ 表示“存在、处于”，ⲛⲧⲏⲏⲧⲉ 表示“在你们中间”；按科普特文句法直译，同时保持自然汉语。
- source_word: ⲧⲏⲛⲉ
  choice: 你们／自己
  rationale: 这是第二人称复数宾格代词，并非“饼”。在前一个残缺从句中，依照主语与宾语同指的语境译为“自己”；在后文译为“你们”。
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: 释放你们
  rationale: ⲕⲁ…ⲉⲃⲟⲗ 在这里构成“放开、释放”的表达；译文明确保留受词“你们”。
- source_word: ⲛϩⲏⲧϥ
  choice: 从其中
  rationale: 该形式带第三人称阳性单数后缀，指向前文某个已经残缺的对象；“其中”保留所指不明的状态。
- source_word: ⲛⲓⲙ ⲡⲉⲧⲛⲁϣ
  choice: 谁又能……
  rationale: ⲛⲓⲙ 表示“谁”，ⲡⲉⲧⲛⲁϣ 起首表示“将能／能够……”，但后续缺失，故以省略号标明。
theological_decisions:
- issue: 释放者的身份
  choice: 保留第三人称“他”，不指明其身份
  alternative: 译作“有人”或将其解释为特定的神圣拯救者
  rationale: 原文动词形式仅给出第三人称阳性单数主语；上下文残缺，无法确定其身份，不宜加入神学解释。
- issue: “从其中”所指为何
  choice: 保留指代含混
  alternative: 具体译作“从监牢、世界或身体中”
  rationale: 先行词位于残缺处，现存文字不足以确定所指；具体化会消除原文真实的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以省略号明确标示抄本残缺，不用流畅化措辞补足缺文；疑问句的递进用“又”自然呈现，但不额外解释其神学含义。
