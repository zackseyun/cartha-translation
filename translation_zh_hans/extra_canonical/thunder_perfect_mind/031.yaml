  text: ……当我出来时，你们离开我[a]。你们必在财富中找到我。也不要在我从受尊崇的人中间出来时看我[b]……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段摘录始于未完句中。ⲉⲧⲛⲕⲁⲁⲧ可理解为“当你们离开我时／你们离开我”；ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ是第一人称单数环境式，意为“当我出来时”。
    reason: 说明摘录边界，并更正首句的人称、动词和环境式结构。
  - marker: b
    text: 摘录在词中截断；依续文，ⲛⲉⲧⲧⲁ可复原为ⲛⲉⲧⲧⲁⲉⲓⲏⲩ，意为“那些受尊崇的人”。本句在摘录之后仍有续文。
    reason: 标明原始材料的截断，并交代“受尊崇的人”的词形复原依据。
lexical_decisions:
- source_word: ⲉⲧⲛⲕⲁⲁⲧ
  choice: 任凭我
  rationale: 按ⲕⲱ“留下、任凭”及第一人称单数宾语后缀分析；本摘录从句中开始，因此不补出缺失的上文主句。
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: 我显现／我出来
  rationale: 按环境式第一人称单数“当我出来、显现时”理解；结合本篇发言者自我显露的语境，正文用自然的“显现”。
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: 你们必找到我
  rationale: ϭⲓⲛⲉ通常表示“找到、发现”，ⲧⲉⲧⲛⲁ-为第二人称复数将来式；不采用容易与ϣⲓⲛⲉ混淆的“寻找”。
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: 在财富中
  rationale: ⲙⲛⲧ-构成抽象名词，ⲣⲙⲁⲟ指富有者或富足，故译“财富”比“伟大”更切合词源。
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: 也不要注视我
  rationale: ⲙⲡⲣ-是不定过去式以外的否定命令式标记，此处是“不要看我”，不是“你们看不见我”。
- source_word: ⲛⲉⲧⲧⲁ
  choice: 受尊崇的人
  rationale: 摘录末尾单词被截断；依页面续文可还原为ⲛⲉⲧⲧⲁⲉⲓⲏⲩ“那些受尊崇的人”，不将截断形式误作“卑微者”。
