base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/036.yaml
  text: It is the utterance according to prudence of my seeking[a], and it is the knowledge of my searching[d][c][b]. But I am she who exists in all fears and in courage.
translation:
  language: zh_hans
  text: '**1.** 这是我寻求的、合乎明辨的言说[a]，也是我探究的知识。但我正是那位存在于所有恐惧以及勇气之中的她[b][c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头词组的OCR读法不确定；“言说”是暂定译法。前半句的具体句法关系亦不能完全确定；也可理解为“按着明辨而说的、关于我寻求之事的话”。
    reason: 原文残损或OCR不确定，并存在句法歧义。
  - marker: b
    text: 原词也可译作“刚勇”“胆量”，字面语义还可带“男子气概”的色彩；这里译作“勇气”，以保留它与“恐惧”的对照而不强化性别意味。
    reason: 重要词义有多个可行选择。
  - marker: c
    text: 科普特语这里使用阴性关系形式，直指“那存在着的她”。中文用“她”保留这一阴性自我指称；不译作“女子”，以免额外限定说话者的身份。
    reason: 目标语言不会仅凭语法自动显出原文的阴性形式。
lexical_decisions:
- source_word: ⲉⲧⲕⲉⲟⲩⲁⲩ
  choice: 言说
  rationale: 该词组的OCR读法和词形均不确定；依现有句法线索，暂以可受“合乎明辨”修饰的宽泛名词“言说”处理，不进一步限定为宣告或格言。
- source_word: ⲫⲣⲟⲛⲓ
  choice: 明辨
  rationale: 此词很可能对应希腊语 φρόνησις，兼有审慎、理解和辨识之意；“明辨”保留其哲思色彩，又比“谨慎”更能涵盖认知层面。
- source_word: ⲣⲓⲧⲉ
  choice: 寻求
  rationale: 保留动作名词的开放性，并与后句“探究”形成近义平行。
- source_word: ⲥⲁϩⲟⲩ
  choice: 知识
  rationale: 采用其广义认知义，避免擅自提升为带特定宗教含义的“智慧”。
- source_word: ϣⲟⲩϣⲟⲩ
  choice: 探究
  rationale: 既表达搜寻、查究之意，也与“寻求”构成有变化的平行表达。
- source_word: ϣⲟⲟⲡ
  choice: 存在于
  rationale: 保留“存在、临在”的本体性语气及介词结构，不弱化为单纯的“处在”。
- source_word: ⲫⲟⲃⲟⲥ
  choice: 恐惧
  rationale: 这是希腊语 φόβος 的借词；“恐惧”是范围较广且与“勇气”构成鲜明反义的译法。
- source_word: ⲧⲏⲣⲟⲩ
  choice: 一切
  rationale: 按复数名词后的全称限定语理解，译为“一切”，而不是所有格“他们的”。
- source_word: ⲡⲛⲏϣⲁⲧ
  choice: 勇气
  rationale: 该词可指男子气概、刚勇或胆量；“勇气”保留其与恐惧的对照，同时避免加入不必要的性别化价值判断。
- source_word: ⲧⲉⲧϣⲟⲟⲡ
  choice: 那位存在……的女子
  rationale: 按阴性关系形式理解，显明说话者的阴性自我指称，而不将其简化为无性别的存在陈述。
theological_decisions:
- issue: 说话者同时存在于相反状态之中
  choice: 保留“存在于一切恐惧和勇气之中”的并置
  alternative: 将其解释为超越恐惧、只体现勇气
  rationale: 原文刻意把恐惧与勇气并列，宣称说话者临在于两者之中；不应为消除神学张力而只保留正面一极。
- issue: 阴性自我指称
  choice: 正文译作“女子”
  alternative: 译作中性的“那一位”
  rationale: 原文关系形式为阴性；明确译出可避免丢失作品中反复出现且具有结构意义的女性声音。
translation_notes:
  register: 采用现代、庄重而略带诗性和哲思色彩的普通话。“我寻求中……／我探究中……”有意保留原文名词性属格结构的紧密与一定歧义；后半句以“一切恐惧和勇气”维持悖论式并置，并明确呈现阴性说话者。
