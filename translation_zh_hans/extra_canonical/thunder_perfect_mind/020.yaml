base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/020.yaml
  text: Why[a], you who hate me, do you love me, and hate those who love me? You who deny me, confess me[b], and you who confess me, deny me[e][d][c]. You who say—
translation:
  language: zh_hans
  text: 为什么[a]，你们这些恨我的人，却爱我，又恨那些爱我的人？你们这些否认我的人，要承认我[b]；你们这些承认我的人，要否认我[c]。你们这些说——[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段开头的 ⲉⲧⲃⲉ ⲟⲩ 意为“为什么”。它前面的 ⲡⲁⲣⲁⲛ 很可能承接上一行；因所给片段不足以确定其句法关系，正文未译。
    reason: alignment_note
  - marker: b
    text: “承认”所译的 ϩⲟⲙⲟⲗⲟⲅⲉⲓ 是希腊语借词，也可译作“宣认”或“公开表白”。
    reason: lexical_alternative
  - marker: c
    text: “否认”也可译作“拒绝承认”或“弃绝”；这里采用“否认”，以保持与“承认”的鲜明对偶。
    reason: lexical_alternative
  - marker: d
    text: 所给原文片段止于“你们这些说……”，句子尚未完结。
    reason: textual_boundary
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: 为什么
  rationale: 该固定组合表示“为什么”，而不是仅把 ⲉⲧⲃⲉ 理解为“关于”。问句形式保留了原文直接质问的语气。
- source_word: ⲙⲟⲥⲧⲉ
  choice: 恨
  rationale: 采用现代汉语中直接、常用的对应词，不以“憎恶”等较强词语加重语气。
- source_word: ⲙⲉ
  choice: 爱
  rationale: 此处 ⲙⲉ 是“爱”，与“恨”构成原文刻意设置的对照，不应译作“认识”。
- source_word: ⲁⲣⲛⲁ
  choice: 否认
  rationale: 准确表达否认、拒绝承认之意，也与后面的“承认”形成清楚的悖论式对偶。
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: 承认
  rationale: 该希腊语借词可指承认、宣认或公开表白；“承认”在现代汉语中自然，并能与“否认”直接对应。
- source_word: ⲉⲣϩⲟⲙⲟⲗⲟⲅⲉⲓ / ⲉⲣⲁⲣⲛⲁ
  choice: 要承认／要否认
  rationale: ⲉⲣ- 在这里构成命令式；用“要……”表达面向复数听众的命令，同时避免生硬的逐词翻译。
- source_word: ⲛⲉⲧϫⲉ
  choice: 你们这些说——
  rationale: 延续前面把关系结构当作呼语的句法理解；破折号保留所给原文在此中断的状态。
theological_decisions:
- issue: “否认”与“承认”的悖论关系
  choice: 按命令式译为“要承认我／要否认我”
  alternative: 按陈述式译为“承认我／否认我”
  rationale: 科普特文的命令式形态支持命令语气；不把表面的矛盾解释为某种特定神学主张，以保留作品本身的张力。
- issue: 说话者要求爱与恨、承认与否认的反转
  choice: 保留原文的直接对偶，不添加解释
  alternative: 加入“其实”“反而”等解释性措辞来调和矛盾
  rationale: 原文有意使用悖论式言辞；译文不应替读者消解其含混和张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“你们这些……”再现复数呼语和反复句式；“却”仅用来使爱与恨的强烈反差在汉语中自然显明。命令式译作“要……”，兼顾原文语法与现代可读性。
