lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: 与我同在的人
  rationale: 此处 ϣⲟⲟⲡ 按存在、同在义理解；结合关系形式，译作名词性短语，不作祈使语气。
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: 女人们
  rationale: ϩⲓⲟⲙⲉ 是“女人”的复数形式，不是“穷人”；据科普特语词形直接翻译。
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: 内在的
  rationale: 关系从句字面为“存在于里面的”；在中文中压缩为“内在的”，同时保留其所指或依附范围可能含混。
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: 那受尊崇的
  rationale: 按阴性关系结构及“尊荣、尊崇”词义处理，构成作品反复出现的“我是那……”宣告。
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: 他们所颂赞的
  rationale: ⲥⲙⲟⲩ 可指祝福或赞美；此处与后文“鄙视”对举，故取“颂赞”。
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: 他们鄙视的
  rationale: 希腊语借词 καταφρονεῖν 表示轻视、蔑视；宾语代词为阴性单数，回指说话者。
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  choice: 以轻蔑
  rationale: 依修订后的词义分析取“轻蔑、羞辱”义，并作为方式短语修饰“鄙视”，不误解为“用声音”。
- source_word: ⲁⲛⲟⲕ
  choice: 我是——
  rationale: 保留段末未完的第一人称宣告，与下一段衔接；破折号提示句子在所给节选中中断。
theological_decisions:
- issue: 女性说话者的身份表达
  choice: 以阴性关系结构“那……的”保留女性声音
  alternative: 加入“她”或具体神学身份称谓
  rationale: 原文语法标示阴性，但没有在本段明确界定说话者的神学身份，因此不作教义化补充。
- issue: 颂赞与鄙视的悖论
  choice: 并列保留两种相反评价
  alternative: 解释为不同群体或不同时间的评价
  rationale: 原文刻意维持悖论张力，译文不替读者消解。
