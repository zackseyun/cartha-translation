base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/032.yaml
  text: And you will find me in greatness; and do not look at me going out among those who are honored, and in the least places look for me.
translation:
  language: zh_hans
  text: '**10.** 你们会在伟大之中找到我[a]；不要看我从那些受尊崇的人中出来[b]，也要在最微小的地方寻找我。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伟大”也可理解为“尊荣”或语境中的“富足”；原词首先是由“伟大”构成的抽象名词。
    reason: lexical_alternative
  - marker: b
    text: “出来”所依据的科普特语词组表示向外运动，也可译作“显现出来”；其具体动向并不完全确定。
    reason: alignment_note
  - marker: c
    text: 末句在所给 OCR 中已经讹乱；这里按校勘所恢复的“你们寻找我”翻译。传统译本常将本段概括为“留意我的贫穷和富足”，但现有片段更直接地对举“伟大”与“最微小的地方”。
    reason: textual_note
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: 你们会找到我
  rationale: ⲧⲉⲧⲛⲁ- 是第二人称复数将来式，ϭⲓⲛⲉ 通常意为“找到、发现”，ⲙⲙⲟⲉⲓ 是第一人称单数直接宾语。
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: 在伟大中
  rationale: ϩⲛ 表示“在……中”；ⲙⲛⲧ- 将形容词名词化，因此以抽象名词“伟大”直译，同时不排除尊荣或富足的语义联想。
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: 不要看我
  rationale: ⲙⲡⲣ- 构成否定命令，ⲛⲁⲩ ⲉ- 表示“看、注视”。采用简洁自然的现代汉语。
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: 出来
  rationale: ⲉⲃⲟⲗ 表示向外的运动；“出来”保留动态意象，而不强行判定是从说话者还是向说话者运动。
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: 那些受尊崇的人
  rationale: 该词组宜解析为复数关系形式加 ⲧⲁⲉⲓⲟ“尊崇、尊荣”的状态式，故不是泛指“伟人”，而是“受尊崇的人”。
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: 最卑微的地方
  rationale: 希腊语借词 ⲉⲗⲁⲭⲓⲥⲧⲟⲥ 意为“最小、最微不足道”，修饰 ⲧⲟⲡⲟⲥ“地方”；“最卑微”在汉语中较好地呈现与“受尊崇”之间的社会性反差。
- source_word: ⲛⲧⲉⲧⲛϭⲱϣⲧ ⲛⲥⲱⲉⲓ (reconstructed from corrupt OCR)
  choice: 寻找我
  rationale: 所给 OCR 末尾明显讹乱；依据校勘恢复的短语意为“你们寻找我”。译文采用命令式“寻找我”，与前面的否定命令形成对照。
theological_decisions:
- issue: “伟大”与“最卑微之处”的张力
  choice: 保留“在伟大中”与“在最卑微的地方”的并置
  alternative: 按传统英译处理为“留意我的贫穷和富足”
  rationale: 现有科普特语片段明确呈现“伟大”及“最小/最卑微的地方”，并未明确出现“贫穷”一词；因此不以传统概括替代现存措辞，也不消解其悖论性。
- issue: 连接受尊崇者与卑微之处的关系
  choice: 以“也”保留并列结构
  alternative: 译作转折性的“却”或“而要”
  rationale: 原文连接词本身不足以要求强转折；并列译法保留语义张力，不额外规定说话者只在后一处可被寻找。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“受尊崇的人”准确体现被动状态；“最卑微的地方”兼顾字面上的“最小”与上下文中的社会反差。保留第二人称复数“你们”，并避免用神学术语解释说话者身份。
