  yaml_path: translation/extra_canonical/thunder_perfect_mind/044.yaml
  text: I am she — the Greek and the barbarian[a][c][d]; I am she who will be manifest[b] in Egypt.
translation:
  language: zh_hans
  text: '**9.** 我就是她——希腊人，也是异族人[a][c][d]；我就是那将在埃及显现的[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希腊人和异族人”是希腊—罗马世界常见的一组二分：说希腊语的人与所有非希腊人。本篇常让说话者同时承接这类成对的相反身份。
    reason: cultural_note
  - marker: b
    text: 或译“出现”。这里采用“显现”，以保留启示性的语调。
    reason: lexical_alternative
  - marker: c
    text: 科普特语在“希腊人”和“异族人”前都用了复数冠词。现代汉语名词在此无需另加复数标记，仍可理解为两个群体。
    reason: parallelism_note
  - marker: d
    text: 本段OCR在这些较清楚的语句之前还有两处难以辨认的片段，所附参考英文也与那些行不对应。因此，在获得更可靠的校勘和对齐之前，正文只翻译较为确定的内容。
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: 我就是她／我就是那……的
  rationale: 科普特语系词为阴性，与全篇女性说话者的声音相符；首处直译为“她”，次处按现代汉语关系结构译为“那……的”，同时保留反复出现的自我宣告句式。
- source_word: ⲛⲉⲗⲗⲏⲛ
  choice: 希腊人
  rationale: 该词前有复数定冠词，指希腊人这一群体；现代汉语“希腊人”本身不强制标示单复数，可自然涵盖群体意义。
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: 异族人
  rationale: 此处与“希腊人”构成希腊—罗马文化中的二分。“异族人”比带有强烈贬义的“野蛮人”更能传达非希腊人的类别意义，同时脚注说明历史语境。
- source_word: ⲥⲉⲓⲛⲉ
  choice: 显现
  rationale: 既可表达“出现”，又保留作品语境中的启示性语调；不把这种语调进一步解释为特定神学教义。
- source_word: ⲕⲏⲙⲉ
  choice: 埃及
  rationale: 采用现代通行地名，便于普通读者理解；原词是科普特语对埃及的本土称呼。
theological_decisions:
- issue: 说话者同时认同二元类别的张力
  choice: 保留“我就是她——希腊人，也是异族人”的并列自我认同
  alternative: 解释为说话者属于或代表希腊人和异族人
  rationale: 原文以悖论式身份宣告并置双方；译文不替读者消解其诗性和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我就是”保留原作反复、自我宣告式的节奏；破折号与“也是”使悖论式并列在中文中清楚可读，但不加解释性补语。
