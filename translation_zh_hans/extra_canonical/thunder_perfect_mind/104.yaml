base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/104.yaml
  text: '...you[a], he made him a pattern within you. And what you see outside you, you see me within you. It is visible, and it is your garment. Listen to me[d][c][b], you hearers.'
translation:
  language: zh_hans
  text: ……你们[a]；他使他成为你们里面的一个样式。你们在自己外面所看见的，也就是你们在自己里面所看见的我[c]。它显明出来，并且是你们的衣裳[d]。听我说，你们这些听者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段从残句中间开始；“……你们”之前的内容不在所给节选内，无法由本段可靠补足。
    reason: textual_fragment
  - marker: b
    text: 这一映射区段似乎没有出现“我是公义”这一句，而是延续“里面／外面”的主题，并以“听者”作结；章节或分段映射可能错位。
    reason: alignment_note
  - marker: c
    text: 抄本此处相应字形（ⲥⲁⲛϩⲟⲩ）不确定，可能含有OCR讹误；结合前面的“外面”，正文谨慎译作“里面”。
    reason: textual_uncertainty
  - marker: d
    text: “并且是你们的衣裳”依赖对疑似OCR讹误字串的校正；按现有OCR逐字直读，无法稳妥得到这一句。
    reason: ocr_reconstruction
lexical_decisions:
- source_word: ⲣⲧⲩⲡⲟⲥ
  choice: 使……成为一个样式
  rationale: 保留希腊语借词 τύπος 所含“样式、模型”的意味；原文代词所指不明，因此不擅自补明身份。
- source_word: ⲥⲁϩⲟⲩⲛ
  choice: 里面
  rationale: 这里表示内部或内在一面，与后文“外面”形成明确对举，不按“靠近”解读。
- source_word: ⲥⲁⲛⲃⲟⲗ
  choice: 外面
  rationale: 按内外对举理解，译为自然的现代汉语“外面”。
- source_word: ⲡⲉⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟϥ
  choice: 你们……所看见的
  rationale: 按关系结构处理，而非祈使语气的“看”；保留陈述性的内外对应。
- source_word: ⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: 显明出来
  rationale: 按“显现、显明”理解，不与“活着”的近形词混同；“出来”也反映 ⲉⲃⲟⲗ 的外显意味。
- source_word: ⲥⲱⲧⲙ
  choice: 听我说
  rationale: 在直接呼告中，“听我说”比单独的“听”更符合现代汉语，同时保留命令语气。
- source_word: ⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: 听者
  rationale: 保留希腊语借词 ἀκροατής 的名词性称呼，并与“听我说”形成修辞呼应。
theological_decisions:
- issue: 内外意象的关系
  choice: 保留“外面所见”与“里面见我”的并置
  alternative: 解释为外在形体反映内在神性
  rationale: 原文给出富有张力的内外对应，却没有明确说明其形上学关系；正文不加入特定神学体系的解释。
- issue: “他”及“他”的所指
  choice: 保留原文代词，不指明身份
  alternative: 将其中一方明确译为神、造物者、人或形象
  rationale: 节选从残句开始，上下文不足，代词指向不明；补出身份会不当地消除原文歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。用“样式”“显明”“衣裳”保留诗性与古典宗教文本的质感，同时避免生硬仿古。开头以省略号明确标示残句；内外对举尽量简洁，以维持原作的悖论式节奏。
