  yaml_path: translation/extra_canonical/thunder_perfect_mind/054.yaml
  text: 'I am she from whom you hide,[a]

    and you reveal me.

    But whenever you hide yourselves,[c][b]

    I myself will appear.'
translation:
  language: zh_hans
  text: '**9.** 我就是你们所躲避的那一位，[a]


    你们却将我显露出来。


    但每当你们隐藏自己，


    我自己就会显现。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 首句也可译作：“我就是你们向其隐藏的那一位。”科普特语介词结构可表达躲避她，也可能表达向她隐藏。
    reason: syntactic_ambiguity
  - marker: b
    text: 末句也可译作：“我自己就会显露自己。”所据 OCR 摘录在此后还有残缺或可能属于相邻行的字句，本段不据此补译。
    reason: textual_and_alignment_note
lexical_decisions:
- source_word: ϩⲱⲡ
  choice: 躲避／隐藏
  rationale: 此词的基本语义是“隐藏”。与 ⲉⲣⲟⲉⲓ 连用时，首句自然表达“躲避我／向我隐藏”，故译作“你们所躲避的”；以反身宾语 ⲙⲙⲱⲧⲛ 出现时则译作“隐藏自己”。这样既保留同一词根的呼应，也符合现代汉语习惯。
- source_word: ⲟⲩⲟⲛϩ / ⲟⲩⲟⲛϩⲧ
  choice: 显露／显现
  rationale: 该动词在这里与“隐藏”构成鲜明反义。带第一人称宾语 ⲙⲙⲟⲉⲓ 时采用使役性的“将我显露出来”；末句的形式可理解为说话者自身显现，译作“我自己就会显现”。
- source_word: ⲁⲛⲟⲕ ϩⲱⲱⲧ
  choice: 我自己
  rationale: 重复并强调第一人称主体，译作“我自己”以保留原文的强调语气。
- source_word: ⲧⲁ
  choice: 我就是……的那一位
  rationale: 这是指向女性说话者的系词性表达。现代汉语不标语法性别，因此用庄重自然的“我就是……的那一位”，而不额外加入“女人”等原文没有的名词。
theological_decisions:
- issue: 末句是“显现”还是“显露自己”
  choice: 我自己就会显现
  alternative: 我自己就会显露自己
  rationale: 两种理解都维持“隐藏—显露”的悖论。采用不及物的“显现”使中文自然，也与主语强调相合；脚注保留及物、反身理解的可能，不据此推导特定神学立场。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，以“躲避／隐藏”和“显露／显现”再现原文反复而对立的词汇结构。保留女性说话者的语境，但不在中文正文中强加语法性别。未沿用早期误对齐的“驱散／聚集”译法。
