review_pass:
  verdict: revise
  source_fidelity: 首句把 ⲧⲉⲧⲛϩⲱⲡ ⲉⲣⲟⲉⲓ 译成“你们所躲避的”弱化并改写了“向我隐藏／在我面前隐藏”的介词关系；更关键的是，正文和脚注均未译出 OCR 摘录中紧随“我将显现”之后的 ⲁⲩⲉⲓ ⲁⲛⲧⲉⲧⲛ ⲃⲟⲗ（“在你们之外”）。“在你们之外”虽因 OCR 断词及句法切分而应保留谨慎，却不宜无依据删去。
  naturalness: 原译整体庄重通顺。“你们却将我显露出来”中的“却”并无明确对应，可删除以保留原文并列。修订以“向我隐藏”“显露我”“在你们之外显现”表达，既自然也保持“隐藏—显露/显现”的重复对照。
  terminology: “显露／显现”适当对应 ⲟⲩⲟⲛϩ 的及物与不及物用法；“我自己”保留 ⲁⲛⲟⲕ ϩⲱⲱⲧ 的强调。汉语正文不必标示说话者的语法阴性，但可用“那一位”维持指称。
  issues:
  - severity: medium
    issue: 首句“你们所躲避的那一位”没有保留 ⲉⲣⲟⲉⲓ 的“向我／在我面前”关系。
    rationale: ϩⲱⲡ 的核心义为“隐藏”；在此介词结构下，译作“躲避我”并非最贴近的表达。采用“向我隐藏”可保留原文的歧义与反复。
  - severity: high
    issue: 遗漏“在你们之外”这一可辨识的末句成分。
    rationale: 原文摘录在 ϯⲛⲁⲟⲩⲟⲛϩⲧ 后有 ⲁⲩⲉⲓ ⲁⲛⲧⲉⲧⲛ ⲃⲟⲗ，其中 ⲁⲛⲧⲉⲧⲛ ⲃⲟⲗ 可安全地译为“在你们之外”。英语审计脚注所称“可能属于相邻行”不足以支持在中文译文中删除这一明确短语。
