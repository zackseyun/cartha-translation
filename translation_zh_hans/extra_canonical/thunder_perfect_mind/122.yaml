  register: 采用庄重而可懂的现代标准汉语。反复句式按所给科普特语 OCR 保留，以呈现宣告式节奏；不依据明显错位的英文 consult_text 改写。由于底本标明为低置信度 OCR 对齐摘录，末尾残句和重复均以脚注提示，而正文不作无据校勘。
