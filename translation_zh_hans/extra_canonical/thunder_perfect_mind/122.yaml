base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/122.yaml
  text: 'And do not make me known in another place or in another time. Do not make me known. Do not make me known in another place or in another time.

    For I am the one who has come to be, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance[f][e][d][c][b], and the one who will come to be.'
translation:
  language: zh_hans
  text: '不要在别处或别的时候对我一无所知[a][b]。不要对我一无所知。不要在别处或别的时候对我一无所知。


    因为，我是已经成为的那一位，也是将要成为的那一位[c]。


    我是宽容[d]，也是将要成为的那一位。


    我是宽容，也是将要成为的那一位。


    我是宽容，也是将要成为的那一位——[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对我一无所知”也可译作“不认识我”“不知道我”或“不了解我”。科普特语这里表达的是“处于不知道的状态”，不是“使我为人所知”。
    reason: lexical_and_grammatical_note
  - marker: b
    text: “时候”所译的词意为“时间、时刻、季节”；旧释作“人群”不合此处词义。
    reason: lexical_correction
  - marker: c
    text: “成为”原词也可译作“发生”“产生”或“存在起来”。这里保留“已经成为／将要成为”的开放性。
    reason: lexical_ambiguity
  - marker: d
    text: “宽容”所译的词也可表示“宽宥、谅解、宽大、同意”。原文把这个抽象概念作为说话者的自称。
    reason: lexical_ambiguity
  - marker: e
    text: 现存对齐材料在这里以“并且”结束，句子显然未完；本译以破折号标明残缺。所给科普特语 OCR 还三次重复“我是宽容，也是那将要成为的”，因此照录重复，不擅自删节。
    reason: textual_and_alignment_note
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: 不要……不认识我
  rationale: ⲙⲡⲣ- 是禁止式；ⲣ-ⲁⲧ-ⲥⲟⲟⲩⲛ 由“作/处于”加否定性构词成分及“知道”构成，意为“不知道、不认识”，并非使役的“使人知道”。中文保留原文双重否定式的突兀力度。
- source_word: ⲕⲉⲙⲁ
  choice: 别处
  rationale: ⲕⲉ“别的”与 ⲙⲁ“地方”合成；“别处”自然简洁。
- source_word: ⲕⲉⲟⲩⲟⲉⲓϣ
  choice: 别的时候
  rationale: ⲟⲩⲟⲉⲓϣ 在此是“时间、时候”，不是“人群”；与“别处”构成地点和时间的对举。
- source_word: ϣⲱⲡⲉ
  choice: 成为
  rationale: 该词可指“发生、成为、产生、存在起来”。“成为”既保留完成与将来的平行结构，也不把其中可能具有的存在论意味解释得过死。
- source_word: ⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: 宽容
  rationale: 希腊借词可涵盖宽宥、谅解、宽大、同意等义；作说话者的自称时，“宽容”在现代汉语中自然而仍保留抽象人格化的陌生感。
theological_decisions:
- issue: “已经成为／将要成为”的身份宣告
  choice: 维持两个分词式身份称谓，不补出神学对象或时间终点
  alternative: 译作“已经存在／将要存在”或解释为特定神圣名号
  rationale: ϣⲱⲡⲉ 本身语义宽广，原文并未说明成为何者；直保留张力可避免将其定向为某一宗派的存在论。
- issue: “宽容”的人格化
  choice: 以抽象名词直接作自称
  alternative: 补译为“我是那宽容人的”或“我是赦免”
  rationale: 原文直接说“我是 ⲥⲩⲛⲅⲛⲱⲙⲏ”，不宜添加施事者、受事者或司法性教义含义。
