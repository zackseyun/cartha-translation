base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/022.yaml
  text: 'Those who speak the truth about me[a], lie about me,

    and those who have lied about me, speak the truth about me.

    Those who know me, be ignorant of me,

    and those who have not known me[b], let them know me.'
translation:
  language: zh_hans
  text: '**17.** 那些谈论我时说真话的人[a]，却谈论我时说谎；


    那些曾谈论我说谎的人，却谈论我说真话。


    那些认识我的人，都当不认识我；


    那些未曾认识我的人，都当认识我。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给 OCR 摘录从一个分句中间开始；“那些……的人”的句式依据连续文本的语法补出。这里的 ϫⲓϭⲟⲗ 是“说谎”，不是“言语”或“宣告”。
    reason: textual_and_lexical_clarification
  - marker: b
    text: 所给 OCR 摘录在“那些还没有……”之后中断；末句依据连续文本补足。末两句的“都当……”按命令语气翻译；前两句则是陈述性的悖论。
    reason: textual_boundary_and_grammar
lexical_decisions:
- source_word: ⲙⲉ ⲉⲣⲟⲓ
  choice: 论到我说真话
  rationale: ⲙⲉ 表示“真、真实”，ⲉⲣⲟⲓ 表示言说所涉及的对象“关于我”。译为“论到我说真话”，既自然，也与下句的“论到我说谎”形成严整对照。
- source_word: ϫⲓϭⲟⲗ ⲉⲣⲟⲉⲓ
  choice: 论到我说谎
  rationale: 此处 ϫⲓϭⲟⲗ 在现存句法中指说谎，并非“言语、呼喊或宣告”；ⲉⲣⲟⲉⲓ 指“关于我”。这样翻译保留真话与谎言之间的悖论。
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: 那些认识我的人
  rationale: ⲥⲟⲟⲩⲛ 是“知道、认识”，宾语为第一人称。这里涉及对说话者本身的认识，中文用“认识我”比单纯“知道我”更贴切。
- source_word: ⲛⲉⲧⲉⲙⲡⲟⲩ…
  choice: 那些还不认识我的人
  rationale: ⲙⲡⲟⲩ 是否定完成式的开端，OCR 摘录在此截断；依连续文本补足“认识我”，并以“还不”自然表达此前未认识的状态。
theological_decisions:
- issue: “认识”与“不认识”并置的悖论
  choice: 保留命令语气：“要不认识我……要认识我”
  alternative: 改作陈述或未来式：“将不认识我……将认识我”
  rationale: 此段以彼此反转的劝令构成修辞张力。把它改成预言式陈述会消除原文的命令色彩，并替读者解释其神学含义。
- issue: 关于说话者的真话与谎言
  choice: 按字面保留相反命令，不解释何者在何种意义上为真或为假
  alternative: 增添“自以为”“其实”等解释性词语
  rationale: 原文有意让真与假并置；加入解释会过早化解文本的神学与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。四行维持原段的平行结构，以“论到我”反复对应“关于我”，并用“要”明确呈现命令语气；不增添解释来消解真/假、认识/不认识之间的刻意悖论。
