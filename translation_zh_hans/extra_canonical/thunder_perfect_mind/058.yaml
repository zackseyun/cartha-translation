translation:
  language: zh_hans
  text: '**13.** 我就是你们曾把心思放在我身上的那一位[a]，你们却弃绝了我。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“把心放在我身上”；也可译作“默想我”或“思量我”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把我赶出去。”ⲧⲱⲡ 与 ⲉⲃⲟⲗ 连用时，常有驱逐、赶出的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲕⲁϩ ⲛϩⲏⲧ（与 ϣⲟⲡ 连用）
  choice: 把心思放在……身上
  rationale: 这一表达指内在而有意的思量。译文保留“心”的意象，同时用现代汉语的“心思”传达思想和意向，避免仅译作较弱的“想过”。
- source_word: ϩⲏⲧ
  choice: 心思
  rationale: 该词既可指“心”，也可指思想与意向的所在。“心思”兼顾其身体意象和认知含义，且符合现代汉语表达。
- source_word: ⲧⲱⲡ ⲉⲃⲟⲗ
  choice: 弃绝
  rationale: 这一复合动词可表示赶出、抛出或排斥。“弃绝”既保留主动排拒的力度，也自然呈现先思量、后拒绝的反差。
