lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲡⲁⲓ
  choice: 因此
  rationale: 该短语通常表示原因或推论；“因此”自然保留与前文的因果衔接，但残缺语境使具体所指仍不明确。
- source_word: ⲙⲡⲣ ⲣⲁⲧ ⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: 不要停止听从我
  rationale: 将否定命令式与 ⲣ-ⲁⲧ- 理解为“不要不／不要未能”，即正面的持续劝告；ⲥⲱⲧⲙ ⲛⲥⲱⲓ 在此用“听从我”比被动式“不要让我被听见”更符合直接劝诫的语境与结构。
- source_word: ⲁⲩⲱ
  choice: 也
  rationale: 连接两个平行劝告；中文用“也”保持递进而不添加转折。
- source_word: ⲙⲡⲣ ⲣⲁⲧ ⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: 不要不认识我
  rationale: 保留原文否定命令与否定性构式叠加所形成的强调，并与后文重复句式对应；不改写成较强的“务要认识我”，以免抹去修辞张力。
- source_word: ⲛ ⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ
  choice: 在别处或别的时候
  rationale: 按可见文本将 ⲕⲉⲙⲁ 分析为 ⲕⲉ ⲙⲁ（另一处），将 ⲕⲉⲟⲩⲟⲉⲓϣ 理解为“另一个时候”；这比假定 OCR 遗失字母而重构为“审判……权能”更直接地依据现存字形。
theological_decisions:
- issue: 说话者要求听者“认识我”的力度
  choice: 不要不认识我
  alternative: 务要认识我
  rationale: 直译保留否定式劝告及其悖论式语气，不把“认识”具体化为某一宗派的救恩、启示或神秘知识体系。
- issue: 说话者的性别指称
  choice: 本段不补入性别代词
  alternative: 听从她／他
  rationale: 科普特语宾语形式在此不要求中文明示性别；标题或传统归属不应迫使本段添加原文没有明说的性别信息。
translation_notes:
  register: 采用庄重而可懂的现代汉语，保留原文反复的否定式劝告。首尾残缺均明确标示；不依照低置信度英文对齐层补写“我独自存在，也无人审判我”，因为这些内容不见于所给科普特语摘录。
