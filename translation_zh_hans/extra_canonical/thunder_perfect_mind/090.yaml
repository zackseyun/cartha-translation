base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/090.yaml
  text: 'Give heed to me in gentleness.[a]

    I am the one who remains upon the face of the earth,[b]

    and I am the one who is cast off the face of the earth.[c]

    I am the preparation of every person.[d][e][f][g]'
translation:
  language: zh_hans
  text: '你们要以温柔的心领受我的教导。[a]


    我是那留在大地之上的，[b]


    也是那被从大地之上抛离的。[c]


    我是每一个人的预备。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以温柔的心”也可译作“以谦柔的态度”；“领受我的教导”较贴近原文“从我领受教导”的表达。
    reason: 保留ⲙⲏϣⲉ的词义范围，并避免将ϫⲓ ⲥⲃⲱ加强为“服从”。
  - marker: b
    text: “在大地之上”字面为“在大地的面上”。此处依据校正后的科普特文读法译作“那留下的”，而不是“那坚固、居住的”。
    reason: 说明地道译法及所给OCR中的关键误识。
  - marker: c
    text: “被抛离”也可译作“被抛出”；原词的基本意思是投、抛。
    reason: 保留动作的空间义，而不预设为社会性“弃绝”。
  - marker: d
    text: “预备”也可作“准备”。原文没有说明这是为人所作的预备、使人预备的事物，还是预备本身。
    reason: 保留名词短语的语义开放性。
lexical_decisions:
- source_word: ⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  choice: 你们要……听从我的教导
  rationale: ϫⲓ ⲥⲃⲱ 字面为“领受教导”，在此是复数祈使语；译文兼顾劝勉语气与教导含义，避免仅译作笼统的“留心听”。
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ
  choice: 以温柔的心
  rationale: ⲙⲏϣⲉ 表示温柔、柔和；用自然汉语表达行为方式，同时保留“谦柔”这一可能语感。
- source_word: ⲧⲉⲧϭⲱ ⲉⲃⲟⲗ（校正OCR后的底本读法）
  choice: 那留在……的
  rationale: 现有OCR“ⲧⲁϣϭⲏⲗ ⲉⲕⲟⲗ”很可能误识；校正读法指“持续留下、存留”，故不采用缺乏词法依据的“坚固者/居住者”。
- source_word: ϩⲓϫⲙ ⲡϩⲟ ⲙⲡⲕⲁϩ
  choice: 在大地之上
  rationale: 字面为“在大地的面上”；汉语正文采用庄重而自然的“大地之上”，脚注保留更贴近形式的译法。
- source_word: ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ ⲉⲃⲟⲗ
  choice: 那……被抛弃的
  rationale: ⲛⲟⲩϫⲉ 的核心义为投、抛；此处结构宜理解为被抛出或被摒弃，而不是“松开”或“溶解”。
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: 预备
  rationale: ⲥⲟⲃⲧⲉ 表示准备、预备，并非“惧怕”；名词性表达在此保持其对象或结果的开放性。
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: 每一个人的
  rationale: 保留 ⲛⲓⲙ 的逐一分配意味，并以现代包容性汉语表达“人”。
theological_decisions:
- issue: “我是每一个人的预备”所指为何
  choice: 保留“预备”的抽象和开放表达
  alternative: 我是为每一个人所预备的／我是每一个人的准备者
  rationale: 原文名词结构没有明确说明说话者是预备的内容、状态、工具还是施行预备者；不在译文中补入神学解释。
- issue: 留下与被抛弃之间的悖论
  choice: 保持两个相反的第一人称身份陈述
  alternative: 将其解释为使大地存留又毁灭大地
  rationale: 底本文法指向说话者自身留在地上又被从地上抛弃；应保留《雷霆，完美的心智》特有的张力，不把它改写为对大地施加的两种行动。
translation_notes:
  register: 采用现代、庄重而可朗读的诗性散文；重复“我是那……的”以维持宣告节奏和悖论结构。正文不沿用英文咨询层中已被校勘否定的“坚固者”“松开”“惧怕”等旧释。
