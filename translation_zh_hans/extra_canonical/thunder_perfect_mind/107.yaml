base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/107.yaml
  text: 'I am the hearing that is attainable to all[a];

    I am the speech that cannot be grasped;

    the name of the sound and the sound of the name;

    I am the sign of this[g][f][e][d][c][b], and the manifestation.'
translation:
  language: zh_hans
  text: '我是人人皆可得的聆听[a]；


    我是人无法把握的话语；


    我是声音的名字，也是名字的声音[b]；


    我是“此”的记号[c]，也是显现。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可得”所译的词也可理解为“伟大的”。末语组也可按字面理解为“在万事万物中／关于万事万物”；此处从其表示普遍范围的用法译作“人人”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“声音”也可译作“嗓音”或“声响”。原文刻意形成“声音的名字／名字的声音”的交错结构。
    reason: lexical_alternative
  - marker: c
    text: 原文为指示语，直译近于“这个的记号”；其具体所指不明确。正文以引号中的“此”保留这种开放性，不将其限定为某件事或某个对象。
    reason: referential_ambiguity
lexical_decisions:
- source_word: ⲥⲱⲧⲙ
  choice: 听闻
  rationale: 保留其听觉性的名词意味，不将其道德化为“顺服”；“听闻”也较适合与后文“声音”相呼应。
- source_word: ⲉⲧϣⲏⲡ ⲛϩⲱⲃ ⲛⲓⲙ
  choice: 万事万物都可领受的
  rationale: ϣⲏⲡ 在此可表达可接受、可达到；ⲛϩⲱⲃ ⲛⲓⲙ 的范围表达有歧义，直译取“万事万物”，并以脚注保留“人人”的可能。
- source_word: ⲡϣⲁϫⲉ
  choice: 话语
  rationale: 表达所说出的话，同时避免把它限定为单个词语。
- source_word: ⲉⲧⲉⲙⲁⲩϣⲁⲙⲁϩⲧⲉ ⲙⲙⲟϥ
  choice: 人无法把握的
  rationale: 按连续形态分析为关系从句：否定第三人称复数形式加“把握、抓住”，而不是在换行处拆作“在那里”与“记忆”。汉语用泛指“人”自然呈现第三人称复数的非特指施事。
- source_word: ⲣⲁⲛ
  choice: 名字
  rationale: 采用基本义，并保留与“声音”构成的交错结构。
- source_word: ⲥⲙⲏ
  choice: 声音
  rationale: 既可指声音也可指嗓音、声响；此处“声音”最能保持抽象听觉意象。
- source_word: ⲥⲏⲙⲉⲓⲟⲛ
  choice: 记号
  rationale: 这是希腊语 σημεῖον 的借词；跨行的 ⲟⲛ 属于该词本身，不另译作“也”。
- source_word: ⲙⲡⲁⲓ
  choice: 这事的
  rationale: 保留指示语“这个／这事”的开放指向，不擅自指定其所指。
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 显现
  rationale: 表达显露、彰显或启示出来，而非“发出的光”；名词化“显现”与本段一连串自我认同相称。
theological_decisions:
- issue: “话语”是否作带有特定神学身份的“道”
  choice: 话语
  alternative: 道
  rationale: 原文在此首先指言说或话语；译作“道”容易引入其他文献中的专门神学含义，故不作此限定。
- issue: “显现”是否明确译作宗教性的“启示”
  choice: 显现
  alternative: 启示
  rationale: 原词容许显露、彰显及启示等意义；“显现”保留范围，不预先决定其神学机制。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；以分号维持原文自我宣告的平行节奏。“我是”在各主要分句中保留，交错句则用“也是”使汉语自然。
