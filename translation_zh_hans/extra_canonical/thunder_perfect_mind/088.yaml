lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: 我既是……也是……
  rationale: 保留第一人称断言；ⲧⲉ所标示的阴性说话者在现代汉语中无需另作语法标记。用“既……也……”自然呈现同一说话者兼具相反两面的悖论式宣告。
- source_word: ⲧⲁϣϭⲏⲗ
  choice: 自制
  rationale: 表达克制、节制自己的伦理含义，并能与下文的反义项形成简洁鲜明的对应。
- source_word: ⲉⲕⲟⲗ
  choice: 放纵
  rationale: 表达缺乏约束或不加节制，不把含义限定为性方面的淫荡；与“自制”构成自然的汉语反义对举。
- source_word: ϩⲓϫⲙ
  choice: 本段不译
  rationale: 这是意为“在……上／之上”的介词，看来引出下一行中本段未收录的补语；若在此孤立翻译，反会制造并不存在的完整意思。
theological_decisions:
- issue: 同一说话者同时宣称互相对立的性质
  choice: 保留“自制／放纵”的悖论，不加解释
  alternative: 把其中一项弱化为‘控制／不受控制’，或解释成对不同对象的不同作用
  rationale: 原文以并列方式把相反概念归于同一位说话者；译文不应替原文消解其神学及修辞张力。
translation_notes:
