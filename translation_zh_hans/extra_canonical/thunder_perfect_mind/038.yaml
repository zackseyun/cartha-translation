translation:
  language: zh_hans
  text: '但我是在一切恐惧中存在的那一位，也是在战兢中刚强的那一位。[a]

    我是软弱的那一位，却在宽阔之地得以坚固。[b]

    我是一个……[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在战兢中刚强”所据科普特文的OCR切分与释义不够确定；也可能有别的理解。这里保留了原句明显的悖论式对举。
    reason: textual_uncertainty
  - marker: b
    text: “宽阔之地”直译近于“敞开的地方”；原文同时出现两个表示“地方”的词，其中一个是希腊语借词 ⲧⲟⲡⲟⲥ。
    reason: lexical_note
  - marker: c
    text: 所提供的原文摘录止于 ⲁⲛⲟⲕ ⲟⲩ（“我是一个……”），句子未完。另附的英文咨询文本似乎对应别处，因为其中“不要恨……不要喜爱……”的禁令在本摘录中并不可见。
    reason: alignment_note
lexical_decisions:
- source_word: ⲫⲟⲃⲟⲥ
  choice: 恐惧
  rationale: 这是希腊语借词 phobos，在此保留其直接含义“恐惧”。
- source_word: ⲡⲛⲏϣⲁⲧ ⲛ̄ⲟⲩⲥⲧⲱⲧ
  choice: 在战兢中刚强
  rationale: 该词组的OCR切分和词义不够确定；结合本作品惯用的悖论式对举，译作“在战兢中刚强”，同时以脚注标明不确定性，不把 ⲥⲧⲱⲧ 强行解释为英文咨询层所说的“节制”。
- source_word: ϭⲟⲟⲃ
  choice: 软弱
  rationale: 在现有句法 ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧϭⲟⲟⲃ 中，该词描述说话者“软弱”，并非名词性的“我的顺服”；这更符合可见科普特文。
- source_word: ⲧⲁϫⲣⲟ
  choice: 得以坚固
  rationale: 表达坚固、加强或确立；采用“得以坚固”以保留动词形态与被加强的意味。
- source_word: ⲙⲁ ⲟⲩⲏⲛ / ⲧⲟⲡⲟⲥ
  choice: 宽阔之地
  rationale: ⲙⲁ 与希腊语借词 ⲧⲟⲡⲟⲥ 都涉及“地方”，ⲟⲩⲏⲛ 有开放、敞开之意；合译为自然而庄重的“宽阔之地”，避免重复“地方”。
