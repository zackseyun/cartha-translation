lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: 为什么
  rationale: 按校勘所恢复的本段实际科普特文本，保留直接而带责问意味的疑问句式。
- source_word: ⲧⲉⲧⲛⲙⲉⲥⲧⲉ
  choice: 你们憎恨
  rationale: 准确表达第二人称复数及“憎恨”的强烈语气。
- source_word: ⲧⲁϩⲟⲧⲉ
  choice: 我的可畏
  rationale: ⲁϩⲟⲧⲉ 可指“恐惧”也可指使人敬畏、惧怕的性质；“我的可畏”保留主观恐惧与说话者令人畏惧这一张力。
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  choice: 你们咒诅
  rationale: 保留第二人称复数与明确的咒诅行为。
- source_word: ⲡⲁϣⲟⲩϣⲟⲩ
  choice: 我的尊荣
  rationale: 该词可涉及夸耀、荣耀或骄傲；“尊荣”在现代汉语中自然，也避免直接把说话者定性为傲慢。
theological_decisions:
- issue: “我的恐惧/可畏”是说话者自己的恐惧，还是她令人畏惧的性质
  choice: 我的可畏
  alternative: 我的恐惧
  rationale: 原词存在语义张力；正文采用不完全消解歧义的名词化表达，并在脚注说明。
- issue: ϣⲟⲩϣⲟⲩ 的褒贬色彩
  choice: 我的尊荣
  alternative: 我的骄傲／我的荣耀
  rationale: 本诗以悖论式自述为特色；“尊荣”避免未经文本许可将其解释成罪性的骄傲，也不把它完全提升为神学化的荣耀。
translation_notes:
  register: 采用庄重、直接的现代标准汉语。“你们”体现科普特语第二人称复数；以“可畏／尊荣”保存原句的诗性张力，不把多义词过早固定为心理恐惧或罪性骄傲。
