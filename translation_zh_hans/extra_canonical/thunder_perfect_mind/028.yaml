  yaml_path: translation/extra_canonical/thunder_perfect_mind/028.yaml
  text: Look out upon the earth, and you will find me among those who see; and do not look upon the dung-heap of dung.
translation:
  language: zh_hans
  text: 向大地望去吧[a]，你们会在那些来的人中找到我；不要看那粪便的粪堆[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的 OCR 形式 ⲛⲁⲉⲃⲟⲗ 很可能是 ⲛⲁⲩ ⲉⲃⲟⲗ（“向外看、望去”）的连写或识别误差。
    reason: textual_note
  - marker: b
    text: “粪堆”对应源自希腊语的借词 κοπρία，“粪便”对应科普特语 ⲕⲱⲕ；原文叠用两个近义词，强化卑贱污秽的意象。
    reason: cultural_note
  - marker: c
    text: 对照文本将本段列作“我不知羞耻；我感到羞耻”，但现有科普特语摘录谈的是望向大地、来的人和粪堆；两者不符，很可能源于分段行号的启发式错配。
    reason: alignment_note
lexical_decisions:
- source_word: ⲛⲁⲉⲃⲟⲗ
  choice: 要……望去
  rationale: 此处OCR连写很可能代表 ⲛⲁⲩ ⲉⲃⲟⲗ，即“向外看、望去”；按命令语气处理，也与后文否定命令 ⲙⲡⲣⲛⲁⲩ 相呼应。
- source_word: ϩⲓ ⲡⲕⲁϩ
  choice: 向大地
  rationale: ϩⲓ 可表示朝向或位于表面，ⲕⲁϩ 可指地、土地或大地；“向大地望去”在此命令句中自然，并保留较宽广的意象。
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: 你们会……找到我
  rationale: 明确表达第二人称复数将来式和第一人称单数宾语。
- source_word: ϩⲛ ⲛⲉⲧⲛⲏⲟⲩ
  choice: 在那些正来的人中
  rationale: ϩⲛ 在复数群体前宜译“在……中”；ⲉⲧⲛⲏⲟⲩ 可分析为关系形式加“来”的状态式，指“那些正来的人”，而非“看见的人”。
- source_word: ⲙⲡⲣⲛⲁⲩ
  choice: 不要看
  rationale: 保留否定命令的直接语气，不增补原文没有的宾语“我”。
- source_word: ⲉⲡⲓⲧⲕⲟⲩⲡⲣⲓⲁ ⲛⲧⲉ ⲡⲓⲕⲱⲕ
  choice: 那粪便的粪堆
  rationale: 前一词是源自希腊语、表示粪堆的借词，后一词表示粪便；刻意保留原文重复而卑下的形象。
theological_decisions:
- issue: 说话者与“那些正来的人”的关系
  choice: 译作“在那些正来的人中找到我”
  alternative: 将其解释为某类先知、异象者或可见者
  rationale: 原文只陈述说话者可在该群体中被找到，没有明确界定其神学身份或群体性质，因此不作教派化阐释。
translation_notes:
  register: 采用庄重而直接的现代标准汉语。命令句保持简洁；保留“粪便的粪堆”略显突兀的重复，以呈现原文修辞，不用更文雅的词弱化其粗粝意象。
