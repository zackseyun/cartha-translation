base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/024.yaml
  text: 'Know me, let them know me.

    For I am knowledge and ignorance.

    I am shame and boldness.

    I am shameless; I am ashamed.

    I am strength, and'
translation:
  language: zh_hans
  text: '认识我；愿他们认识我。[a]


    因为我就是知识，也是无知。


    我就是羞耻，也是坦然直言。[b]


    我是不知羞耻的；我是羞怯的。[c]


    我就是力量，又是——[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头也有人读作：“愿有智慧的人有智慧”，或“有智慧的人哪，要有智慧。”这取决于如何分析 ⲥⲟⲩⲱⲛⲧ 以及祈愿式 ⲙⲁⲣⲟⲩ。
    reason: 原文的形态与句法存在真实歧义。
  - marker: b
    text: “坦然直言”所译的词（ⲡⲁⲣⲣⲏⲥⲓⲁ）也可指公开直说、畅所欲言或充满自信的无畏表达。
    reason: 说明希腊语借词的语义范围。
  - marker: c
    text: “羞怯”所译的 ϫⲓⲡⲏⲧ 与前文译作“羞耻”的 ϣⲓⲡⲉ 不同，常偏向腼腆、拘谨或羞怯。
    reason: 保留原文两个近义词之间的词汇区别。
  - marker: d
    text: 原文在“又／并且”（ⲁⲩⲱ）处接续下文，本段在语法上尚未结束。
    reason: 标明节选边界造成的残句。
lexical_decisions:
- source_word: ⲥⲟⲩⲱⲛⲧ ⲙⲁⲣⲟⲩⲥⲟⲩⲱⲛⲧ
  choice: 认识我；愿他们认识我
  rationale: 按形态将末尾的 ⲧ 理解为第一人称单数宾语后缀，并将 ⲙⲁⲣⲟⲩ 译作第三人称祈愿式“愿他们……”。同时以脚注保留另一种把相关形式理解为“有智慧”的读法。
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: 知识
  rationale: 这是“知道、认识”所形成的常见名词；“知识”与下句的“无知”构成直接悖论。
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: 无知
  rationale: 该抽象名词表示缺乏知识；简洁译法保留与“知识”的对称关系。
- source_word: ⲡϣⲓⲡⲉ
  choice: 羞耻
  rationale: 采用基本义“羞耻”，使其与后面的公开、无畏表达构成张力。
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: 坦然直言
  rationale: 该希腊语借词兼有公开直说、畅所欲言和自信无惧之意；“坦然直言”比单译“勇敢”更能保留言说层面。
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ
  choice: 不知羞耻的
  rationale: ⲁⲧ- 表示缺失；用形容性表达配合此处带不定冠词的名词化结构。
- source_word: ⲟⲩϫⲓⲡⲏⲧ
  choice: 羞怯的
  rationale: 此词与 ϣⲓⲡⲉ 并非同词，偏向羞怯、腼腆或拘谨；译作“羞怯的”既保持区别，也与“不知羞耻的”形成句法平行。
- source_word: ⲛⲁϣⲧⲉ
  choice: 力量
  rationale: 此处表示力量、坚强或坚固，并非“恐惧”；采用抽象名词以配合连续的“我就是……”宣告。
- source_word: ⲁⲩⲱ
  choice: 又是——
  rationale: 原文以连接词“并且／又”结束，句意延续到下一段；破折号标明本段并未完结。
theological_decisions:
- issue: 说话者将相反性质同时归于自身
  choice: 原样保留“知识／无知”“羞耻／坦然直言”等悖论
  alternative: 把各项解释为说话者对不同人所呈现的不同状态
  rationale: 原文没有明说条件、对象或层次；补入解释会消解作品刻意维持的神学与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以反复的“我就是／我是”保存原文宣告式节奏。相反概念不作调和；末句保留开放式接续。
