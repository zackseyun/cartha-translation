base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/101.yaml
  text: Release yourselves.[a] Or if you release yourselves from him, who will be able to seize you? For your inside is your outside,[b] and the one who fashions the outside is the one who fashions the inside.
translation:
  language: zh_hans
  text: 你们要脱离他。[a]如果你们脱离了他，谁还能抓住你们呢？因为你们的内在就是你们的外在；塑造外在的那一位，也塑造内在。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“释放自己”或“使自己自由”。原文命令与下文“抓住你们”形成对照；“他”的所指未明。
    reason: lexical_alternative
  - marker: b
    text: 所给OCR摘录在本句末尾截断；译文依照可辨认的“内在／外在”平行和“塑造”一词，并按现有段落文本所保留的完整句法译出。
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: 释放自己
  rationale: ⲕⲁ…ⲉⲃⲟⲗ在此表示放开、释放，ⲧⲏⲛⲉ为复数反身代词；译作“释放自己”既保留反身结构，也与下句“抓住”形成张力。
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: 抓住
  rationale: 该词意为抓住、控制或制伏；“抓住”与“释放”构成自然且具体的对照，同时不额外限定为政治或灵性的辖制。
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ / ⲡⲉⲧⲛⲥⲁⲃⲃⲟⲗ
  choice: 你们的里面／你们的外面
  rationale: 这里的ⲥⲁϩⲟⲩⲛ和ⲥⲁⲃⲃⲟⲗ是空间性的“里面”和“外面”，并非“理解”或“聆听”；保留原文悖论式的内外同一。
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: 塑造
  rationale: 源自希腊语πλάσσειν，指塑造、形成；“塑造”保留了造物或制作者的形象，又不预先判定其身份。
theological_decisions:
- issue: “他／那一位”的身份
  choice: 保留代词和泛称，不指明其身份
  alternative: 明确译为“造物主”“神”或某一敌对权势
  rationale: 本段没有明确交代所指对象；直接赋予神学身份会消除原文的指涉含混。
- issue: 里面与外面的关系
  choice: 译为“里面就是外面”
  alternative: 解释为内在本性与外在形体一致
  rationale: 原文以悖论式等同表达内外关系；译文不把它化约为心理、身体或宇宙论体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留第二人称复数“你们”、反问句以及“里面／外面”的诗性悖论。避免沿用早期误读所产生的“呼喊／聆听”表述。
