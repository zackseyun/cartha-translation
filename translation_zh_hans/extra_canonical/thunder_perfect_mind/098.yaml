translation:
  language: zh_hans
  text: '闭住他们的嘴！[a]


    在他们抓住你们以前，审判他们；


    因为不义的审判者就在你们当中。[b]


    当那将要释放你们的那位来临时，你们若得释放，


    或若你们释放自己……[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的科普特文OCR有误识别；按语境与校勘，此处应理解为“闭住他们的嘴”，不是“我呼喊”。
    reason: textual_ocr_correction
  - marker: b
    text: “在你们当中”也可译作“在你们里面”；原文可能指群体之中，也可能带有内在意味。
    reason: preserved_ambiguity
  - marker: c
    text: 所给原文在“或若你们释放……”处残缺并中断，因此以省略号表示未完。
    reason: source_lacuna
lexical_decisions:
- source_word: ⲭⲣⲟⲉⲓ（据语境及校勘应读作与“堵住他们的嘴”相应的词组）
  choice: 堵住他们的嘴
  rationale: 所给文本是带有误识别的摹本OCR；结合后续命令式“审判他们”和现有校勘意见，此处不是“我呼喊”，而是要求听者封住“他们的嘴”。
- source_word: ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ
  choice: 审判他们
  rationale: ⲕⲣⲓⲛⲉ 是希腊语借词，意为“审判、判断”；命令语气与上下文相合。
- source_word: ⲧⲁϩⲉ ⲉⲣⲱⲧⲛ
  choice: 抓住你们
  rationale: 此处表示临到、擒获或抓住；“抓住”自然保留威胁意味，且 ⲉⲣⲱⲧⲛ 指复数“你们”。
- source_word: ⲡⲉⲕⲣⲓⲧⲏⲥ ⲙⲡϫⲓ ⲛϭⲟⲛⲥ
  choice: 行不义的审判者
  rationale: 字面结构是“不义／压迫的审判者”；译为“行不义的审判者”既保留道德指控，也避免误解为“审判不义之事的人”。
- source_word: ⲕⲁ … ⲉⲃⲟⲗ
  choice: 释放
  rationale: 在“那将要……你们者”及条件句语境中，此短语意为释放、放走，而非“抛出”。
theological_decisions:
- issue: “审判者”是内在人物、群体成员还是象征性存在
  choice: 就在你们中间
  alternative: 就在你们里面
  rationale: ⲛⲧⲏⲏⲧⲉ 可表示“在你们中间／在你们里面”。正文采用较少预设的群体性表达，不把它明确解释成内在心理或灵性实体。
- issue: 释放者的身份
  choice: 那将要释放你们者
  alternative: 那位将要释放你们的人
  rationale: 原文没有在此明确其身份或神学角色，因此使用中性的关系结构，不擅自指认为某位救主。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留连续命令和条件句形成的紧迫感；不依照误配的英文咨询文本翻译，而以所给科普特文片段及其明确的OCR校勘信息为准。
