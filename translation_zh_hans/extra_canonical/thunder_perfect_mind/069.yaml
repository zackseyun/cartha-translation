base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/069.yaml
  text: 'I am the mind[1],

    and my rest.

    I am the knowledge of my seeking for myself,

    and the seeking of those who seek me,

    and the command of those who ask of me[c][b][a][5][4][3][2],

    and the voice of the voices of the place of the gods.'
translation:
  language: zh_hans
  text: '**6.** 我是心智[a]，


    也是我的安息。


    我是我追寻自身的知识，


    也是那些寻求我的人的寻求，


    也是那些向我求问之人的命令，


    也是诸神之地的众声之声[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心智”所译的词也可译作“理智”或“智性”。
    reason: lexical_alternative
  - marker: b
    text: “诸神”依据此处可能残缺的复数读法；按现存摘录的表面形式，也可理解为“神”或“上帝”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ⲡⲛⲟⲩⲥ
  choice: 心智
  rationale: 这是希腊语 νοῦς 的科普特语借词，兼有“心思、理智、智性”之意。“心智”既保留认知层面的含义，也适合此处人格化的自称。
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: 我的安息
  rationale: ⲧⲁ- 是第一人称单数阴性所有格冠词，明确表示“我的”；希腊语借词 ἀνάπαυσις 可指歇息、安息或止息，此处用“安息”保留其精神性和诗性。
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: 认识
  rationale: 该词表示“知道、认识、知识”。此处后接“我寻求自己”的属格内容，用“认识”比静态的“知识”更自然，同时不消解抽象名词结构。
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ-
  choice: 寻求
  rationale: 校正后的读法是“寻求、追寻”，而非 OCR 所示可能被误认的“种类”；连续重复“寻求”保留原文的回环结构。
- source_word: ⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: 命令
  rationale: 这是科普特语中表示“命令、吩咐”的常用名词，不宜拆解为“合一”与“团契”。采用“命令”保留原文中求问者与命令之间有意而未解释的张力。
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: 众声之声
  rationale: ⲥⲙⲏ 是“声音”，不是“名字”。“众声之声”贴近原文的属格叠用，也保留其诗性和可能的最高级意味。
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱ
  choice: 众神所在之处
  rationale: 结合可能残缺的读法 ⲛⲑⲉⲱⲛ，正文采用复数“众神”；现存摘录表面上也可能支持单数，因此以脚注说明。
theological_decisions:
- issue: 末句“神”是单数还是复数
  choice: 众神所在之处
  alternative: 上帝所在之处／神所在之处
  rationale: 摘录末尾可能截断了希腊语属格复数词尾，复数读法与校订意见及“众声”语境相合；但不把这一重构伪装成毫无疑问的读法，故保留脚注。
- issue: “那些向我求问之人的命令”的所属关系
  choice: 维持原文属格关系，不解释命令由谁发出
  alternative: 我给那些求问我的人的吩咐
  rationale: 原文形式可直译为“求问我的人之命令”，若补出命令的发出者便会替文本解决其刻意保留的悖论和张力。
translation_notes:
  register: 采用现代、庄重而可朗读的散文诗体；重复“我是”“寻求”和“众声之声”，以保存原文的宣告节奏、回环和悖论。避免把“命令”改写成神谕或答复，也不为“众神”加入特定宗派解释。
