  terminology: “心”依据可能的底层读法ⲙ̄ⲡϩⲏⲧ，而非将不可靠OCR的ⲙⲫⲏⲧ确定译作“本性”。“听闻”保留ⲡⲥⲱⲧⲙ的名词性；“可及”比“可获得”更贴近可接近、可达到而非占有取得的含义；“无法把握”保留校勘重建所支持的否定性；“呼唤”不将其神学化为特定意义的“召唤”。
