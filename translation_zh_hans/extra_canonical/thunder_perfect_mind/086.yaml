base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/086.yaml
  text: '...of the nature that exists within me[a]. I am the hearing that is attainable to everyone, and the speech that cannot be grasped[f][e][d][c][b]. I am the call.'
translation:
  language: zh_hans
  text: ……在我里面的心……[a]。我是人人都可获得的听闻[b]，也是无法把握的话语[c]。我就是呼唤[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处抄录的ⲙⲫⲏⲧ很可能是ⲙ̄ⲡϩⲏⲧ（“心的”）的误识；本段开头承接上文，原句残缺，所以用省略号表示。若严格依当前OCR分词，词义并不可靠。
    reason: textual_uncertainty
  - marker: b
    text: “可获得”也可译作“可及”或“够得着”；原文表达的是人人都能接近或取得，并不必然表示人人已经实际拥有。
    reason: lexical_alternative
  - marker: c
    text: 这里的OCR严重讹乱；“无法把握”依据校勘后可能的底层读法。按表面讹文译成“出现在他们面前”缺乏可靠支持。
    reason: textual_reconstruction
  - marker: d
    text: “呼唤”也可译作“呼声”或“喊声”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲫⲏⲧ
  choice: 心
  rationale: 此处OCR很可能把连写的ⲙ̄ⲡϩⲏⲧ（“心的”）误识为ⲙⲫⲏⲧ；所给片段又从上一句中间开始，因此保留省略号，不补出新的“我是”。
- source_word: ⲛϩⲏⲧ
  choice: 在我里面
  rationale: 在此结构中按带第一人称后缀的内向方位表达处理，译出“我”，而不只泛泛译作“里面”。
- source_word: ⲡⲥⲱⲧⲙ
  choice: 听闻
  rationale: 保留名词性的“听见／聆听”概念，并与后面的“话语”形成平行；不改译为发声者或具体的声音。
- source_word: ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: 人人都可获得的
  rationale: ϣⲏⲡ在这里表达可及、可获得之意；“人人”保留分配性的全称范围。
- source_word: ⲡϣⲁϫⲉ
  choice: 话语
  rationale: 既可指话或言说；“话语”保持抽象名词，并与“听闻”相称。
- source_word: ⲙⲁⲧϣⲉ ⲛⲁϩⲧⲉ ⲙⲙⲟⲩ
  choice: 无法把握
  rationale: 现存OCR在此严重讹乱；依据经校勘的底层读法，句意是否定性的“不能被抓住／把握”，不采用由讹文猜出的“出现在他们面前”。
- source_word: ⲧⲉⲕⲱ
  choice: 呼唤
  rationale: 可指呼叫、喊声；“呼唤”兼顾声音与召唤的动作，不把它限定为单纯的大喊。
theological_decisions:
- issue: “听闻”是所有人实际拥有，还是向所有人开放
  choice: 人人都可获得的听闻
  alternative: 人人都有的听闻
  rationale: 原语侧重可及性，未必断言每个人已经实际领受；译文保留这种张力。
- issue: “呼唤”是否特指神圣召唤
  choice: 呼唤
  alternative: 召唤
  rationale: 原词本身也可泛指呼声或喊声；不用更具神学定向的“召唤”，避免过度诠释。
translation_notes:
  register: 采用现代、庄重而简洁的汉语，保留原文连续“我是……”宣告的诗性节奏。段首不擅自补齐缺失的谓语；抽象名词“听闻”和“话语”尽量维持原文的平行结构。
