base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/120.yaml
  text: And they will find me in the place that is there, and they will live, and they will not perish. Because of this, do not be disobedient to me.
translation:
  language: zh_hans
  text: '**4.** 他们必在那地方找到我，并且得以存活，不至消亡。[a] 因此，不要不肯听我。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不至消亡”所据的科普特语在这份OCR摘录中不完整；也可理解为“不灭亡”或“不再死”。
    reason: 说明残损文本及其可能译法，避免把不确定的动词意义说得过于绝对。
  - marker: b
    text: 此处也可译作“不要迟疑着不听我”或“不要不愿听我”。原语含有“听”的意义，并带有不肯或迟延的语气；不必限定为“违逆”。
    reason: 保留末句在“听”和不情愿／迟延之间的语义张力，避免将其过度译为单纯的服从命令。
lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: 他们将在……找到我
  rationale: ⲥⲉⲛⲁ- 表示第三人称复数将来时，ϭⲓⲛⲉ 在这里取常见义“找到”，ⲙⲙⲟⲉⲓ 为第一人称宾语“我”；不采用与现存科普特文本不符的“顺从的人”。
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: 那地方
  rationale: 以自然的现代汉语保留 ⲉⲧⲙⲙⲁⲩ 的远指意味；直译“在那里之地方”不合汉语习惯。
- source_word: ⲱⲛϩ
  choice: 活着
  rationale: 该动词基本义为“活、存活”；“活着”在此简洁自然。
- source_word: ⲛⲥⲉⲧⲙⲥⲱⲧ ⲉⲃⲟⲗ
  choice: 不至消亡
  rationale: 上下文与既有校勘理解支持“不灭亡／不消亡”，但OCR所见形式残缺，因此采用范围较宽的“消亡”，避免过度限定为肉身死亡或被赶出去。
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: 不要不听从我
  rationale: 否定命令式与含“听／听从”意味的构词共同表达不可拒绝听从说话者；此译既保留听闻色彩，也传达不顺从之意。
theological_decisions:
- issue: “活着”与“不至消亡”所指的生命性质
  choice: 不说明是肉身、灵性还是末世性的生命
  alternative: 译作“得永生”或“永远不死”
  rationale: 原文片段没有明确加入“永远”或界定生命性质，不应将特定神学解释写入正文。
- issue: 末句是单纯听见还是顺从
  choice: 译为“不要不听从我”
  alternative: “不要不肯听我”或“不要违逆我”
  rationale: 原语兼有听闻和顺从的语义张力；正文保留“听”字，同时用“听从”呈现其劝诫力度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那地方”保留原文的指示意味；“不要不听从我”刻意保留略带强调的双重否定，以贴近原句的否定命令形式。未补入OCR中不存在的“天使”和“从死人中起来的灵”等内容。
