base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/015.yaml
  text: My father[a], and the sister of my husband—and he is my offspring. I am the servant of my husband[e][d][c][b], and I am the Lady.
translation:
  language: zh_hans
  text: ……我的父亲，以及我丈夫的姐妹[a]；而他是我的后代。我是我丈夫的仆人，又是女主人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存摘录从“我的父亲”这一短语开始，语法上显然承接前文；这里不擅自补出摘录中没有保存的谓语。“姐妹”也可译作“姊妹”。
    reason: textual_scope
lexical_decisions:
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: 我的父亲
  rationale: 按第一人称领属形式直译；所给科普特文摘录从该名词短语起首，看来承接上文。
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁϩⲁⲓ
  choice: 我丈夫的姐妹
  rationale: ⲥⲱⲛⲉ 指女性同胞，ⲙⲡⲁϩⲁⲓ 表示“我丈夫的”；不以“新娘”取代原词。
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: 而他是我的后代
  rationale: ⲛⲧⲟϥ ⲡⲉ 是阳性“他是”，ⲡⲁϫⲡⲟ 在此指“我的后代／所生者”，保留丈夫同时为其后代的悖论。
- source_word: ⲧϩⲙϩⲁⲗ
  choice: 仆人
  rationale: 该词意为女性仆役或奴仆，并非“新娘”；“仆人”既准确又避免不必要地强化现代奴隶制度语感。
- source_word: ⲛⲧⲉ ⲡⲁϩⲁⲓ
  choice: 我丈夫的
  rationale: 按领属结构自然译出，表示她是属于或服侍丈夫的仆人。
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: 女主人
  rationale: 这是“主、主人”的阴性形式；译作“女主人”可与前面的“仆人”形成原文刻意的身份对立。
theological_decisions:
- issue: 丈夫与后代身份重合的悖论
  choice: 直译为“他是我的后代”
  alternative: 他是生我的那一位
  rationale: ϫⲡⲟ 在此是“后代、所生者”，领属前缀表示“我的”；不把亲属关系反转为“生我者”。
- issue: 仆人与女主人的对立
  choice: 保留“仆人／女主人”
  alternative: 新娘／女士
  rationale: 原词分别是 ϩⲙϩⲁⲗ 与 ϫⲟⲉⲓⲥ，构成从属者与主人的明确反差；不以婚礼意象替换。
