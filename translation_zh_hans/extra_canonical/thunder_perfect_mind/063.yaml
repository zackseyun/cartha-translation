lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 显现出来
  rationale: 该词组表示显露、显现；译作“显现出来”既保留进入可见状态的动态，也与下句“隐藏自己”形成鲜明反转。
- source_word: ϩⲱⲡ
  choice: 隐藏自己
  rationale: 此处以第一人称为主语，并以“向你们”为关系对象；汉语用反身表达“隐藏自己”自然清楚，也与“你们显现出来”相对照。
- source_word: ⲇⲉ
  choice: 可是
  rationale: 实际对应行中的连接词带转折或承接意味；结合前一句“你们隐藏／我显现”的反向平行结构，译作“可是”能准确凸显对照，而不误作因果连接。
- source_word: ⲉⲧⲉⲧⲛ- / ⲉⲣⲱⲧⲛ
  choice: 你们／向你们
  rationale: 科普特语形式明确为复数第二人称，故在中文中保留“你们”，不泛化为单数“你”。
theological_decisions:
- issue: 显现与隐藏的悖论关系
  choice: 保留字面对称：“你们显现出来／我隐藏自己”
  alternative: 将其解释为启示临到或神性退隐
  rationale: 原文以悖论式对照表达，未明确说明其神学机制或对象身份；译文不替原文消解张力，也不加入特定教义解释。
