- source_word: ⲛⲧⲉⲧⲛⲧⲱⲡ
  choice: 你们却……学习
  rationale: ⲛⲧⲉⲧⲛ- 指向第二人称复数，并可有将来或意向色彩；此处依格言式诗行译作自然的现代汉语现在时。“却”明示上下句本已具有的反差，不另添实质内容。
- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: 向……
  rationale: 在“学习”这一搭配中，以“向我学习”自然表达来源关系；直译“从我学习”在现代汉语中较生硬。
