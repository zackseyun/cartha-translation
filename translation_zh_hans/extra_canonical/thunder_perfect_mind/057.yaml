base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/057.yaml
  text: 'This is mine:

    I came forth in an earth[a],

    and you came to be manifest in knowledge;

    an earth is in your heart—you receive those outside[c][b], in places.'
translation:
  language: zh_hans
  text: '**12.** 这是属于我的[a]：


    我从一片土地中出来[b]，

    你们在知识中显现；

    一片土地在你们心里——你们在各处接纳外面的事物[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的科普特语OCR读法和切词不确定；也可能原意是“这是我的话”或“这是我的声音”。
    reason: lexical_alternative
  - marker: b
    text: 这里的ⲕⲁϩ意为“土地、大地”，不是“黑暗”。不少已出版译本在这个位置另有“我是不敬神的；我的神伟大”，说明当前OCR片段与常见文本的对齐可能有误。
    reason: alignment_note
  - marker: c
    text: 直译为“外面的那些”；所指可能是人，也可能是事物。“在各处”与句中哪一部分相连，也不完全确定。
    reason: ambiguity
lexical_decisions:
- source_word: ⲧⲉ ⲡⲁⲓ ⲙⲙⲟⲉⲓ
  choice: 这是属于我的
  rationale: OCR及切词均不稳定；采用最低限度的指示、领属表达，不擅自补出“声音”或“话语”。
- source_word: ⲉⲓⲉⲃⲟⲗ
  choice: 我……出来
  rationale: 保留常见科普特语动词短语“出来、从中出来”的基本空间意象。
- source_word: ⲕⲁϩ
  choice: 土地
  rationale: ⲕⲁϩ的基本义是“土地、大地、地面”，并非“黑暗”（后者通常为ⲕⲁⲕⲉ）。不把此处的两次出现抽象化或寓意化。
- source_word: ⲛⲧⲉⲧⲛϣⲟⲟⲡ ⲉⲃⲟⲗ
  choice: 你们……显现
  rationale: ϣⲟⲟⲡ表示“存在、成为”，与ⲉⲃⲟⲗ结合可表达显露、显现；保留第二人称复数。
- source_word: ⲉⲡⲓⲥⲧⲏⲙ
  choice: 知识
  rationale: 这是希腊语ἐπιστήμη的借词；“知识”最直接，也保留作品中抽象概念的语体。
- source_word: ⲛϩⲏⲧ
  choice: 在你们心里
  rationale: 按第二人称复数语境将内在位置自然译为“在你们心里”，同时保留与“外面”的对照。
- source_word: ⲛⲧⲉⲧⲛϣⲟⲡ
  choice: 你们接纳
  rationale: 按ϣⲱⲡ“接受、取得”理解，不误作“寻找”。
- source_word: ⲛⲉⲃⲟⲗ
  choice: 外面的事物
  rationale: 将其视为复数名词性表达“外面的那些”，但源文未明确所指是人还是物；正文暂用中性的“事物”。
- source_word: ϩⲛϩⲉⲛⲧⲟⲡⲟⲥ
  choice: 在各处
  rationale: τόπος借词的复数意为“地方、处所”；译成自然的现代汉语“在各处”，不补充源文没有的具体地点。
