lexical_decisions:
- source_word: ϩⲓⲣⲏⲛⲏ（源自希腊语 εἰρήνη）
  choice: 和平
  rationale: 与“战争”构成直接而鲜明的反义张力，保留诗句的悖论。
- source_word: ⲡⲟⲗⲉⲙⲟⲥ（源自希腊语 πόλεμος）
  choice: 战争
  rationale: 比“冲突”或“争斗”更能保持与“和平”之间的最大反差。
- source_word: ⲉⲧⲃⲉ ⲁⲛⲟⲕ
  choice: 因我
  rationale: 简洁表达原因或缘由，不把关系解释为目的性的“为了我”。
- source_word: ⲝⲉⲛⲟⲥ（源自希腊语 ξένος）
  choice: 异乡人
  rationale: 既保留“外来者／陌生人”的语义，也能与“公民”形成身份上的反差；较“外国人”少一些现代国籍含义。
- source_word: ⲡⲟⲗⲓⲧⲏⲥ（源自希腊语 πολίτης）
  choice: 公民
  rationale: 准确体现城邦或共同体成员身份，与“异乡人”构成鲜明悖论。
- source_word: ⲉⲓ（“来”的完成体／不定过去形式）
  choice: 而起
  rationale: 自然表达战争发生、兴起之意，同时保留完成体事件性；“已经来到”亦可直译。
theological_decisions:
- issue: “战争因我而起”中的因果关系
  choice: 保留直接因果表述，不说明说话者主动制造战争
  alternative: 战争为了我而起／战争由我发动
  rationale: 原短语只表明“因为／由于我”，没有充分依据将其收窄为目的、责任归属或主动施为。
- issue: 异乡人与公民的双重自称
  choice: 以“既……也……”并置两种身份
  alternative: 将其中一项解释为比喻或不同层面的身份
  rationale: 原诗刻意维持矛盾张力，不宜在译文中替说话者化解。
