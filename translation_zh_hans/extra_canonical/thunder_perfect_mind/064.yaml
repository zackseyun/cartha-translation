base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/064.yaml
  text: 'For she is wise[a], and she is a small one[e][d][c][b];

    nor turn away great things in parts

    from smallness—

    for they know smallness.'
translation:
  language: zh_hans
  text: '**1.** 因为她有智慧，也是个微小者[a]；


    也不要把伟大的事物一部分一部分地从微小之中移去[b]——


    因为他们认识微小[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “微小者”直译原文表示“小、幼小、微不足道”的词；也可能带有“单纯、无知”的含义，但这里与后文“微小”重复，并和“伟大”形成对照。
    reason: lexical_alternative
  - marker: b
    text: 本句句法紧缩。“一部分一部分地”也可理解为“按部分地／分部分地”；整句亦可译作：“也不要将伟大的事物按部分从微小之中移去。”原文未明确动作是否意味着分割对象。
    reason: syntactic_ambiguity
  - marker: c
    text: “认识”所据的文字可视为常见动词“知道、认识”的拼写变体；若对该字形作另一种辨认，末句也可能有不同解释。
    reason: textual_uncertainty
lexical_decisions:
- source_word: ϫⲉ
  choice: 因为
  rationale: 该连接词在此引出解释或原因；“因为”自然承接上下文，同时保留其因果语气。
- source_word: ⲥⲥⲁⲃⲉ(ⲕ)
  choice: 她有智慧
  rationale: 按阴性第三人称单数前缀 ⲥ- 与 ⲥⲁⲃⲉ“有智慧”理解；OCR末尾的 ⲕ 很可能不稳定，不据此改成命令式。
- source_word: ⲟⲩⲕⲟⲩⲉⲓ ⲧⲉ
  choice: 也是个微小者
  rationale: 阴性单数系词 ⲧⲉ 表明这是对“她”的陈述；ⲕⲟⲩⲉⲓ 的基本义为“小、微小”，保留其与后文“伟大／微小”的词义呼应，不擅自解释为“愚昧者”。
- source_word: ⲟⲩⲧⲉ ⲙⲡⲣⲧⲥⲧⲟ
  choice: 也不要……移开
  rationale: ⲙⲡⲣ- 是否定命令式；结合后面的 ⲉⲃⲟⲗ ϩⲛ，译为“不要把……从……移开”，保留空间性意象。
- source_word: ϩⲉⲛⲙⲛⲧⲛⲟϭ
  choice: 伟大的事物
  rationale: ⲙⲛⲧⲛⲟϭ 可表示“伟大”或“伟大的事物”；此处受不定复数形式限定，译作“伟大的事物”较贴合句法。
- source_word: ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ
  choice: 一部分一部分地
  rationale: 希腊语借词 ⲙⲉⲣⲟⲥ 意为“部分”；用副词性表达呈现动作按部分进行，同时不把原文含混的结构过度具体化。
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: 从微小中
  rationale: ⲉⲃⲟⲗ ϩⲛ 表示“从……出来／离开……”；ⲙⲛⲧⲕⲟⲩⲉⲓ 是由“小”构成的抽象名词，首选“微小”，以维持与“伟大”的直接对照。
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: 他们认识
  rationale: 将 ⲉϣⲁⲩ- 按环境式／习惯性结构理解，而非“直到”；ⲥⲟⲩⲱⲛ 视为 ⲥⲟⲟⲩⲛ“知道、认识”的拼写或OCR变体。
- source_word: ⲅⲁⲣ
  choice: 因为
  rationale: 希腊语借入的解释／因果小词；在汉语中用“因为”清楚标示末句对前句的说明。
theological_decisions:
- issue: “有智慧”与“微小”的悖论关系
  choice: 保留两者并列，不把“微小者”解释成“愚昧者”
  alternative: 译作“她有智慧，也是愚昧者”，强化智慧与愚昧的反差
  rationale: 原文反复使用 ⲕⲟⲩⲉⲓ／ⲙⲛⲧⲕⲟⲩⲉⲓ，并与 ⲙⲛⲧⲛⲟϭ“伟大”相对；直译为“微小”更能保存段内的词汇链和未被解释的神学张力。
- issue: 末句的时间或习惯性意义
  choice: 译为“因为他们认识微小”
  alternative: 译为“直到他们认识微小”
  rationale: 此处形式是 ⲉϣⲁⲩ-，较适合环境式／习惯性理解；“直到”通常期待不同的限定结构。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“微小者／微小”虽略带陌生感，却有意保存原文连续复现的同一词根，以及“智慧—微小”“伟大—微小”之间未被化解的张力。分行沿用诗性宣告的节奏；不补入原文没有明说的宾语或神学身份。
