base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/117.yaml
  text: The one who will judge me at the end—judge him! You who are in many sins, and intemperances, and empty passions, and temporary pleasures!
translation:
  language: zh_hans
  text: 那要按律法[a]审判我的人——你们要审判他！你们这些身陷许多罪恶、种种放纵、虚空的情欲和短暂享乐[b]的人啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按律法”：此处 OCR 字形严重讹乱；结合上下文，可校复为“律法”（ⲛⲟⲙⲟⲥ）。若依另一种校读，也可译作“在末了”。
    reason: textual_variant
  - marker: b
    text: “短暂享乐”：现存 OCR 只保留了词组开头；这里按可能的完整词 ⲡⲣⲟⲥⲕⲁⲓⲣⲟⲥ（“暂时的、短暂的”）校复。
    reason: textual_reconstruction
lexical_decisions:
- source_word: ⲕⲣⲓⲛⲉ
  choice: 审判
  rationale: 这是希腊语 κρίνω 的科普特语借词；此处处于律法与道德责问的语境，“审判”既保留司法意味，也维持原文反复使用同一动词的修辞。
- source_word: ϩⲁ ⲡⲓⲛⲟⲙⲟⲥ（据语境校复；OCR 作 ϩⲁ ⲡⲓⲛⲉⲗⲟⲥ）
  choice: 按律法
  rationale: 结合相邻语境，残损读文最可能是“按律法”；ϩⲁ 在这里表达判断所依据的准则。由于 OCR 读文不稳，异读在脚注中保留。
- source_word: ⲉⲛⲁϣⲱⲟⲩ
  choice: 许多
  rationale: 修饰“罪恶”，明确表达数量众多，不予省略。
- source_word: ⲛⲟⲃⲉ
  choice: 罪恶
  rationale: ⲛⲟⲃⲉ 是常见的道德、宗教用语；“罪恶”在现代汉语中自然，并能承接复数意义。
- source_word: ⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: 种种放纵
  rationale: 该词表示缺乏自制、不能约束自己，而不是“无知”；用“种种放纵”呈现复数抽象名词并使汉语顺畅。
- source_word: ⲡⲁⲑⲟⲥ ⲉⲧϣⲟⲩⲉⲓⲧ（据校复；OCR 作 ⲉⲧϣⲁⲉⲓⲏⲧ）
  choice: 虚空的情欲
  rationale: πάθος 在此类恶行清单中指支配人的情欲或激情；校复后的修饰语意为“空虚的”，不取“不断增长的”。
- source_word: ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥⲕⲁⲓⲣⲟⲥ（末词据残文校复）
  choice: 短暂享乐
  rationale: ἡδονή 表示享乐，πρόσκαιρος 表示暂时、不能长存；合译为“短暂享乐”简洁自然。
theological_decisions:
- issue: 开头审判语句的对象与语气
  choice: 译作先提出“审判我的人”，继而以命令句“你们要审判他”形成戏剧性逆转。
  alternative: 可把残文连读为平直的陈述句，如“那要审判我的人将审判那些……的人”。
  rationale: 经校复的残文更支持命令式及呼语结构；这种读法也保留作品刻意制造的反转和张力，而不替文本消解其中的审判悖论。
translation_notes:
  register: 采用庄重而直接的现代标准汉语。破折号和感叹号呈现原段从关系从句突然转为命令与呼语的节奏；恶行清单保留并列推进，同时避免生硬照搬科普特语复数抽象名词。
