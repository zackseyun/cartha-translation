lexical_decisions:
- source_word: ⲅⲁⲣ
  choice: 因为
  rationale: 保留因果连接，表明这句自我宣告是对前文劝诫的说明；现代汉语中“因为”自然清楚。
- source_word: ⲁⲛⲟⲕ ... ⲧⲉ
  choice: 我是
  rationale: 科普特语以代词和阴性系词构成身份宣告；译作“我是”既符合汉语表达，也保留反复自称的庄重语气。
- source_word: ⲧϣⲟⲣⲡ
  choice: 首先的
  rationale: 此处与ⲑⲁⲉ构成对称的身份称谓；“首先的”保留“第一位／起初”之间的语义空间，并与后项相称。
- source_word: ⲁⲩⲱ
  choice: 也是
  rationale: 基本意义为“和／并且”；汉语用“也是”可清楚连接同一说话者的两个对举身份，而不改变其逻辑关系。
- source_word: ⲑⲁⲉ
  choice: 末后的
  rationale: 该词可指“最后的”或“终末”；在与ⲧϣⲟⲣⲡ的平衡结构中，“末后的”最能保留称谓性和对仗，同时以脚注说明另一可能。
