base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/082.yaml
  text: 'I am the union and the dissolution[a];

    I am the abiding[d][c][b],

    and I am the dissolution.'
translation:
  language: zh_hans
  text: '我是结合，也是瓦解；


    我是存留[a]，


    我也是瓦解。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “存留”也可译作“居所”“安息”或“长存”。原词兼有停留、居住及持续存在的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲡⲱⲧⲣ
  choice: 结合
  rationale: 此词表示联合、接合；“结合”既保留名词性的宣告，也能与下文“瓦解”形成鲜明对照，而不误读为“首先者”。
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: 瓦解
  rationale: 该表达意为松开、解体或消解。“瓦解”在现代汉语中自然凝练，并与“结合”构成源文的悖论式对偶。
- source_word: ⲧⲙⲟⲛⲏ
  choice: 存留
  rationale: 源于希腊语 monē，可指停留、长存、居所或安息。此处与“瓦解”相对，“存留”既保留抽象状态，也避免擅自限定为空间性的“居所”。
- source_word: ⲡⲕⲱⲗ
  choice: 瓦解
  rationale: 此处表示松解、解体；与前面的 ⲕⲱⲗ ⲉⲃⲟⲗ 意义相近。重复译作“瓦解”，保留原文回环复沓的结构。
- source_word: ⲁⲩⲱ
  choice: 也／和
  rationale: 按汉语句法分别译作并列的“和”意或递进并列的“也”，保持原文简洁的并列结构。
theological_decisions:
- issue: 彼此对立的自我宣告
  choice: 保留“结合／瓦解”和“存留／瓦解”之间的张力
  alternative: 将这些词解释为特定宇宙论位格或阶段
  rationale: 源文本身以并列方式呈现悖论，没有明确说明其体系含义；译文不替读者消解这种张力，也不引入特定宗派或诺斯替体系的额外解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语，保留连续“我是……”宣告的诗性节奏。没有采用旧稿中“首先者、外面、万有”等基于错误词源分析的译法。OCR 末尾孤立的 ⲁⲛⲟⲕ 很可能属于下一句，故本段不将其译入。
