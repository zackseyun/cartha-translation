base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/060.yaml
  text: 'But out of shame, receive me to yourselves in shamelessness;

    and out of shamelessness and shame, reprove my members among yourselves;

    and approach yourselves.'
translation:
  language: zh_hans
  text: '但你们要从羞耻中，以无耻接纳我；

    又要从无耻和羞耻中，在你们中间责备我的肢体；

    并要转向你们自己。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句较为费解，直译近于“并把你们的趋近引向你们自己”，也可译作“并要亲近你们自己”。
    reason: 保留原文反身趋近表达的歧义。
lexical_decisions:
- source_word: ϣⲓⲡⲉ
  choice: 羞耻
  rationale: 在本段与其否定派生词形成刻意悖论；按通常名词义直译，避免改释为“轻蔑”。
- source_word: ⲙⲛⲧⲁⲧϣⲓⲡⲉ
  choice: 无耻
  rationale: 这是由ϣⲓⲡⲉ构成的否定抽象名词，直译为“无耻”，保留原文“羞耻／无耻”的张力。
- source_word: ϣⲟⲡⲧ
  choice: 接纳我
  rationale: 分析为ϣⲱⲡ的命令式加第一人称宾语后缀，而非描述如何“对待”说话者。
- source_word: ϫⲡⲓⲟ
  choice: 责备
  rationale: 按命令式处理，表达斥责、谴责之意。
- source_word: ⲙⲉⲗⲟⲥ
  choice: 肢体
  rationale: 保留希腊语借词的身体／成员双关潜力，不武断限定为群体“成员”。
- source_word: ϩⲛⲧⲏⲩⲧⲛ
  choice: 在你们中间
  rationale: 采用自然的复数群体处所表达，避免与末句的反身对象混同。
- source_word: ⲧⲓ ⲟⲩⲟⲉⲓ ⲉ-
  choice: 转向
  rationale: 该习语表示趋近、走近；宾语为反身复数时，“转向你们自己”在中文中较自然，同时保留难解意味。
theological_decisions:
- issue: “羞耻／无耻”的悖论
  choice: 保留字面反义并置
  alternative: 释作“尊荣／轻蔑”
  rationale: 现有科普特文本清楚呈现ϣⲓⲡⲉ及其否定派生形式；不以神学解释消解修辞张力。
- issue: “我的肢体”的所指
  choice: 不明确解释其指身体部分还是群体成员
  alternative: 译为“我的成员”
  rationale: ⲙⲉⲗⲟⲥ具有语义弹性，文本本身没有充分限定。
- issue: 末句反身表达
  choice: 译为“转向你们自己”并加文本注
  alternative: “亲近你们自己”或“走近你们自己”
  rationale: 原句语法可辨但语义异常；正文采用可读而不过度阐释的表达，并在脚注中保留直译信息。
translation_notes:
  register: 采用庄重而现代的普通话，以三个并列命令句保存原文节奏；不沿用较早误判为“我是……”宣告的译法。
