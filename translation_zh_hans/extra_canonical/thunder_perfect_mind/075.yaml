base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/075.yaml
  text: I am the honored one and the one they bless[a], and the one they despise with contempt. I am Peace, and because of me there is War. I am Peace[e][d][c][b], and because of me there is War.
translation:
  language: zh_hans
  text: 我是那受尊崇的，也是他们所祝福的[a]，又是他们以轻蔑相待的。我是和平；战争因我而起[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们所祝福的”把跨行字母合读为 ⲉⲣⲟⲥ（“向她／她”）。早先也有人把可见的 ⲣⲟⲥ 补作 ⲡⲣⲱⲧⲟⲥ，译为“首先者”，但此处的平行结构更支持“他们祝福她”。
    reason: textual_reading
  - marker: b
    text: 这里也可能重构为“而我就是战争”。现存截段并不完整；正文采用“战争因我而起”，以保留本篇其他相关悖论表达的句法可能性。
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲏⲟⲩ
  choice: 受尊崇的
  rationale: 按 ⲧⲁⲉⲓⲟ（尊崇、尊敬）的性质形式理解，与后面的关系从句构成身份宣告；不按“我来了”分析。
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: 他们所祝福的
  rationale: 将跨行的 ⲣⲟⲥ 与前文合读为 ⲉⲣⲟⲥ，把 ⲥⲙⲟⲩ 理解为“祝福”，而非补出 ⲡⲣⲱⲧⲟⲥ“首先者”。
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ ϩⲛ ⲟⲩϣⲱⲥ
  choice: 他们以轻蔑相待的
  rationale: 希腊借词 καταφρονεῖν 表示“轻视、蔑视”；ϩⲛ ⲟⲩϣⲱⲥ 在此表达轻蔑的方式或态度，译入正文而不省略。
- source_word: ϯⲣⲏⲛⲏ
  choice: 我是和平
  rationale: ϯ 是第一人称单数系词与阴性名词搭配，ⲉⲓⲣⲏⲛⲏ 为希腊语 εἰρήνη 的借词；保留宣告式悖论。
- source_word: ⲛⲧⲁ ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: 战争因我而起
  rationale: 按 ⲛⲧⲁ- 的因由表达理解，并以自然汉语呈现“因我而有战争”；源文截段可能不完整，因此另注替代读法。
theological_decisions:
- issue: “和平”与“战争”的悖论关系
  choice: 我是和平；战争因我而起
  alternative: 我是和平，也是战争
  rationale: 保持说话者既宣称自身为和平、又成为战争缘由的张力，不将其系统化为特定宗派教义；同时承认截段与句法容许另一种重构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续使用“我是……”保留原作自我宣告的节奏；“受尊崇／祝福／轻蔑”呈现鲜明反衬，不重复英文咨询文本中误增的一整句。
