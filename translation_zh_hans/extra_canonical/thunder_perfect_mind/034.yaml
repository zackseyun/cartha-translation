base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/034.yaml
  text: And do not cast me out among those who are lacking in worthlessness[a]; for I—I am merciful, and I am hard‑hearted. Do not hate my obedience; and my self-control[h][g][f][e][d][c][b], love it in my weakness.
translation:
  language: zh_hans
  text: '**12.** 不要在那些缺少“无用”的人当中逐出我[a]；因为我——我满有怜悯，却也铁石心肠[b]。不要恨我的顺从[c]；至于我的节制，要在我的软弱中爱它[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“那些缺少无用（或无价值）的人”。这一表达本身反常，含义可能有意形成悖论；传统译法中的“粪堆”并非本段现存词句的直接含义。
    reason: lexical_alternative
  - marker: b
    text: 两词可较直译为“心肠柔软的人”和“无心的人”。这里译作“满有怜悯”与“铁石心肠”，以保留强烈对照。
    reason: lexical_alternative
  - marker: c
    text: “顺从”也可译作“服从”或“听从”；此处不是“羞辱”。
    reason: lexical_alternative
  - marker: d
    text: “在我的软弱中”与“爱我的节制”之间的确切逻辑关系并不明说；也可理解为“即使我软弱，也要爱我的节制”。
    reason: ambiguity
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: 不要把我……赶出去
  rationale: ⲙ̄ⲡⲣ̄ 构成否定命令，ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ 表示扔出、逐出；宾语“我”由上下文补明。
- source_word: ⲛⲉⲧ ϣⲁⲁⲧ ϩⲛ̄ ⲟⲩⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: 那些在“无用”上有所欠缺的人
  rationale: 按现有科普特文直译其反常搭配：“欠缺”加“无用/无价值”。不采用与本段不相符的传统“粪堆”意象，也不把悖论顺解为“无用的人”。
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: 满有怜悯
  rationale: 字面涉及“柔软的心”，在此以自然汉语表达其怜悯、慈悲之义，并与下句形成尖锐对照。
- source_word: ⲟⲩⲁⲧϩⲏⲧ
  choice: 铁石心肠
  rationale: 字面为“无心/没有心”，在此与“满有怜悯”相对；采用现代汉语成语保留伦理悖论。
- source_word: ⲙⲉⲥⲧⲉ
  choice: 恨
  rationale: 此处是“恨、憎恶”，不是“离开”；以否定命令“不要恨”表达。
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: 我的顺从
  rationale: 该抽象名词与“听从、服从”相关，译作“顺从”，不采用旧有的“羞辱”。
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: 我的节制
  rationale: 希腊语借词 ἐγκράτεια，指自制、克制；“节制”庄重简洁，也适合本诗语域。
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: 要……爱它
  rationale: 动词表示“爱”，代词宾语回指“节制”；不误读为“你们将找到”。
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: 我的软弱
  rationale: 源于表示“软弱”的词根 ϭⲱⲃ；并非“王国”。
theological_decisions:
- issue: 说话者同时宣称怜悯与铁石心肠
  choice: 保留“满有怜悯，却也铁石心肠”的并置
  alternative: 将后者弱化为“坚定”或解释为对不同对象采取不同态度
  rationale: 原文有意制造自我矛盾式张力；译文不以神学解释消解它。
- issue: 节制与软弱的关系
  choice: 译作“要在我的软弱中爱它”
  alternative: 意译为“即使我软弱，也要爱我的节制”
  rationale: 保留介词结构的关系含混，不擅自判定“软弱”是让步背景、节制的所在，还是二者之间更具悖论性的关联。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以“我——我”保存原文重复自称的强调；保留“怜悯/铁石心肠”“节制/软弱”的悖论张力。末尾孤立的 ⲙ̄ⲡⲣ̄ 是下一句否定命令的开头，本段不强行补译。
