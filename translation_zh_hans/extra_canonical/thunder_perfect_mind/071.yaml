review_pass:
  verdict: revise
  source_fidelity: 草稿首行“我是那些求问我的人的谕令”大体忠实于 ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ（命令、谕令）及其属格结构。其余部分却有数项不安全的重组：ⲧⲁⲟⲩⲟ(ⲩ)更通常表示“尊崇／荣耀”，不能据此译为“差遣出来”；ⲛ̄ⲛⲟⲩⲧⲉ ⲛ̄ⲛⲟⲩⲧⲉ保留了“众神”的重复，草稿的“众神之神”改变了结构；末尾 ⲉⲃⲟⲗ ϩⲓⲧⲙ̄ ⲡϣⲟϫⲛⲉ可较稳妥地译为“借着谋议而出”。ⲑⲉⲱⲥⲓⲥ虽可理解为“神化”，但整段属格和关系从句的黏连仍不确定，宜在译文和脚注中保留。
  naturalness: 原稿的自由诗体方向可取，但“他们在‘道’中被差遣出来”没有清楚的汉语指代，且不合源文动词；“在天使被神化之处”也将“天使的神化”这一可能的属格关系改写为被动事件。修订稿保持现代汉语的可读性，同时以分号和脚注保留原文断续、含混的句法。
  terminology: “谕令”“声音”“天使”“众神”“谋议”均适合庄重的现代汉语。ⲗⲟⲅⲟⲥ译作带引号的“道”可以保留术语色彩，但不应断定其为特定神学体系中的专名。ⲧⲁⲟⲩⲟ(ⲩ)应改按“尊崇”处理。
  issues:
  - severity: high
    issue: 将ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ(ⲩ)译为“被差遣出来”
    rationale: 该形式更自然地关联ⲧⲁⲓⲟ／ⲧⲁⲟ，即“尊崇、荣耀”；“差遣”缺乏可靠的词汇依据。
  - severity: high
    issue: “众神之神”改变ⲛ̄ⲛⲟⲩⲧⲉ ⲛ̄ⲛⲟⲩⲧⲉ的结构
    rationale: 前一个“众神”可与“在……中”相连，后一个“众神”则由“借着谋议而出”修饰；译成属格短语会抹去原文重复及句法歧义。
  - severity: medium
    issue: “天使被神化之处”过度确定句法
    rationale: ⲑⲉⲱⲥⲓⲥ可为“神化”，但其与后接“天使”及关系从句的关系并不完全明确；宜译作“天使的神化之地”并加注说明。
  - severity: medium
    issue: 脚注b和c的词义说明不符合较可靠的词汇分析
    rationale: ⲧⲁⲟⲩⲟ(ⲩ)不宜释为“使出去、发出”；ϣⲟϫⲛⲉ译作“谋议”可保留，但须说明末句的重复和连接仍有歧义。
  revised_text: '我是求问我的人所发的谕令，


    也是众声音的声音，


    在他们于“道”中、在众神中所尊崇的天使的神化之地[a][b]；


    众神——借着谋议而出的众神[c]。'
  revised_footnotes:
  - marker: a
    text: “神化”译自希腊语借词 ⲑⲉⲱⲥⲓⲥ（theōsis）。其后的“天使”与本词及关系从句之间如何连接，受现有转写和断行所限，不能完全确定。
    reason: textual_and_lexical_note
  - marker: b
    text: “道”译自希腊语借词 ⲗⲟⲅⲟⲥ；也可译为“话语”或音译为“逻各斯”。ⲧⲁⲟⲩⲟ(ⲩ)较通常的意思是“尊崇、荣耀”，故未译作“差遣”。
    reason: lexical_alternative
  - marker: c
    text: “谋议”译自 ϣⲟϫⲛⲉ，也可指“计策、商议、决议”。“众神”的重复以及它与前句、末句的句法关系并不完全明确；译文保留其重复和断续感。
    reason: lexical_and_syntactic_note
  revision_rationale: 修订以科普特语词形和句法优先于英语审计稿。保留已可靠校正的“谕令”，撤除无词汇依据的“差遣出来”，并将“众神”重复及“神化／天使／尊崇”部分的结构不确定性明确保留，而不以系统神学或流畅化改写消除歧义。
