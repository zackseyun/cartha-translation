base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/071.yaml
  text: 'I am the decree of those who ask me[a],

    and the voice of the voices in the place of the gods—

    the voice of the angels that they shout.

    Within the word and among the gods[f][e][d][c][b],

    the gods sent forth by means of the shout.'
translation:
  language: zh_hans
  text: '我是那些求问我的人的谕令，

    也是众声音之声，

    在天使被神化之处[a]；

    他们在“道”中被差遣出来[b]，

    还有众神之神，

    借着谋议而出[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被神化”所译的词看起来是希腊语借词 ⲑⲉⲱⲥⲓⲥ，意为“神化”或“成为神”。现存文字的分词及句法并不完全确定。
    reason: textual_and_lexical_note
  - marker: b
    text: “道”译自希腊语借词 ⲗⲟⲅⲟⲥ；也可译作“话语”或音译为“逻各斯”。
    reason: lexical_alternative
  - marker: c
    text: “谋议”译自 ϣⲟϫⲛⲉ，也可指“计策、商议、决议”；这里不宜译作“喊声”。末两行与上文的句法衔接较为含混，译文保留了这种断续感。
    reason: lexical_and_syntactic_note
lexical_decisions:
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: 谕令
  rationale: 将其按有充分词典依据的复合名词 ⲟⲩⲁϩⲥⲁϩⲛⲉ（命令、谕令）理解，不误拆为“合一的衣裳”；“谕令”兼具权威性和诗体庄重感。
- source_word: ⲥⲙⲏ
  choice: 声音
  rationale: 基本义为“声音、嗓音”；“众声音之声”保留原文的重复和超越性表达。
- source_word: ⲑⲉⲱⲥⲓⲥ
  choice: 被神化
  rationale: 按希腊语借词 θέωσις 理解为“神化、成为神”；采用动词化表达，使现代汉语较为自然，同时不将其误作“众神”。
- source_word: ⲁⲅⲅⲉⲗⲟⲥ
  choice: 天使
  rationale: 此希腊语借词在该宗教语境中自然指天界使者；“天使”比泛称“使者”更贴合上下文。
- source_word: ⲗⲟⲅⲟⲥ
  choice: “道”
  rationale: 该希腊语借词可指言语、话语或具有位格／宇宙论意味的 Logos；“道”简洁庄重，但以引号和脚注保留其语义开放性。
- source_word: ⲛⲟⲩⲧⲉ ⲛ̄ⲛⲟⲩⲧⲉ
  choice: 众神之神
  rationale: 保留原文复数形态和属格结构，不擅自改成单数的“上帝”。
- source_word: ϣⲟϫⲛⲉ
  choice: 谋议
  rationale: 该词通常表示商议、计策、谋划或决议，而非“喊叫”；“谋议”既保留行动背后的筹划意味，也适合庄重诗体。
- source_word: ⲧⲁⲟⲩⲟ
  choice: 差遣出来
  rationale: 此处形式跨行，应整体理解为“使出去、发出”；不把行首残余字母误读成“一个”。
theological_decisions:
- issue: ⲑⲉⲱⲥⲓⲥ 的宗教含义
  choice: 天使被神化
  alternative: 众神所在之处
  rationale: OCR所示连续拼写更自然地支持希腊语借词“神化”，而不是把字母拆作“众神”；脚注提示抄本和分词仍有不确定性。
- issue: ⲗⲟⲅⲟⲥ 是否作专名
  choice: “道”
  alternative: 话语／逻各斯
  rationale: 不直接断定其必为特定教义中的位格化“道”，但保留可能的术语色彩。
- issue: “众神之神”的数与神学张力
  choice: 保留复数“众神”
  alternative: 上帝之神／万神之神
  rationale: 原文复数形态应予保留；不为适应一神论表达而消解文本本身的神话性张力。
translation_notes:
  register: 采用现代、庄重而可诵读的自由诗行。保留“众声音之声”“众神之神”等源文重复结构，并以分号和分行呈现残篇式句法；不依据英文咨询稿中可疑的“喊叫”解释来统一声响意象。
