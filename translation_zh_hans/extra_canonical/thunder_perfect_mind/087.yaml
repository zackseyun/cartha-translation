- source_word: ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: 人人都接受的
  rationale: 将 ϣⲏⲡ 理解为 ϣⲱⲡ（接受、领受）的状态形式；ⲟⲩⲟⲛ ⲛⲓⲙ 表示“每个人／一切存在者”。这比将 ϣⲏⲡ 释为“首先”更符合科普特语词形。
- source_word: ⲡϣⲁϫⲉ
  choice: 话语
  rationale: 既可指“言语”也可指“所说的话”；“话语”能保留其与“聆听”以及后文“沉默”之间的诗性对应。
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: '[当说出]'
  rationale: OCR 所呈词形不确定；正文以方括号给出符合上下文的最低限度补译，不把不确定读法写成定论。
- source_word: ⲛⲁϩⲧⲉ ⲙⲙⲟⲩ
  choice: 要相信它们
  rationale: 按“相信、信赖”加宾语代词“它们”理解，作为命令句处理。
- source_word: ⲧⲉⲕⲱ
  choice: 你们的[呼唤]
  rationale: 现有 OCR 词形含混，无法可靠辨认；“呼唤”与本章主题相合，但以方括号明确其暂定性质。上下文可能是单数“你的”，中文“你们”依据复数受众作自然表达，仍属不确定。
- source_word: ⲉⲙⲁϣⲁϫⲉ
  choice: 为说话而发出的
  rationale: 保留目的意义，使其自然连接暂译的“呼唤”。
- source_word: ⲛⲁϣⲉ ⲧⲙⲛⲧϩⲁⲗⲏ ⲛϣⲁϫⲉ
  choice: 话语的沉默何其深广
  rationale: ⲛⲁϣⲉ 表示多、大或丰盛，并非“耳朵”；“深广”在中文中自然表达其程度，同时保留“话语的沉默”这一悖论。
- source_word: ϩⲛ ⲟⲩϭⲱⲛ
  choice: 在愤怒中
  rationale: ϭⲱⲛ 按“愤怒”理解，不译作“响亮的声音”。
