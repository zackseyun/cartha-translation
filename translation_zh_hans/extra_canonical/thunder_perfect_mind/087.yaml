  language: zh_hans
  text: '**3.** 我是人人都接受的聆听[a]，

    也是那[当说出]的话语[b]。

    要相信它们：我是你们为说话而发出的[呼唤][c]；

    话语的沉默何其深广！

    要在愤怒中听我，并……的[d]'
