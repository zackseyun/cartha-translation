translation:
  language: zh_hans
  text: '**3.** 我是人人都接受的聆听[a]，

    也是那[当说出]的话语[b]。

    要相信它们：我是你们为说话而发出的[呼唤][c]；

    话语的沉默何其深广！

    要在愤怒中听我，并……的[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人人都接受的”也可较直译为“被每一位存在者所接受的”。这里把 ⲉⲧϣⲏⲡ 理解为“被接受、被领受”。
    reason: 说明词形分析及“人人”的表达范围。
  - marker: b
    text: 这一处的科普特文 OCR 读法不确定；若相关动词是“询问／请求”，也可能意为“被请求的话语”。
    reason: 标示底本文字及动词辨认的不确定性。
  - marker: c
    text: 原词 ⲧⲉⲕⲱ 按现有 OCR 难以解释。“呼唤”是依本章主题所作的谨慎暂译；也有人可能据不同字母辨读理解为“你的耳朵”或与“声音”有关的词。
    reason: 避免把疑似讹读或误识别的词确定化。
  - marker: d
    text: 摘录以 ⲛⲧⲉ 结束，表明后面还有一个所属结构，但续文不在本段范围内；因此此句残缺。
    reason: 标明摘录边界造成的语法未完。
