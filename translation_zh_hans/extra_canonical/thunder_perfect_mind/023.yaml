  naturalness: 整体庄重、简洁，适合宣告体。相较“任凭他们……”，“让他们……”在现代汉语中更直接地承载ⲙⲁⲣⲟⲩ-的第三人称祈使／愿望语气；“任凭”容易读成说话者只是容忍某事发生。
  terminology: “认识我／不认识我”自然地呈现ⲥⲟⲟⲩⲛ的重复；“知识／无知”准确保留抽象名词的对照，且不附加特定神学解释。“我就是”也妥当地保留宣告式节奏。
