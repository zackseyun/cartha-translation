base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/023.yaml
  text: 'Those who lie about me tell the truth about me.[a]

    Those who know me[a], let them be ignorant of me,

    and those who have not known me—let them know me.

    For I am knowledge and ignorance[b].

    I am—'
translation:
  language: zh_hans
  text: '那些关于我说谎的人，

    说的却是关于我的真相。[a]


    认识我的人，

    让他们不认识我；[b]


    那些不认识我的人，

    让他们认识我。


    因为我就是知识，也是无知。[c]


    我就是——'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句所据抄本图像的OCR严重讹乱。依可辨字形及通行校复，底文可读作：“那些关于我说谎的人，说出了关于我的真相。”
    reason: 说明译文未机械依从讹乱的OCR串，并交代校复依据及其不确定性。
  - marker: b
    text: 此处OCR近似“将认识我”，但校复文本读作“让他们不认识我”，与下一句“那些不认识我的人，让他们认识我”形成刻意的悖论对偶。
    reason: 记录影响句义的关键文本校复，并保存原作的反向平行结构。
  - marker: c
    text: “知识”和“无知”分别译自“知道”的名词形式及其否定形式；原文把二者都直接用作说话者的自称。
    reason: 提示原文的词形联系与身份宣告，避免将其误解为仅仅“有知识又无知”。
lexical_decisions:
- source_word: ⲛⲉⲧϫⲓϭⲟⲗ ⲉⲣⲟⲉⲓ
  choice: 那些对我说谎的人
  rationale: 按校复后的科普特文本理解为“对我说谎的人”；用“说谎”保留动作本义，不扩译为“诽谤”或“作假见证”。
- source_word: ϫⲱ ⲛⲧⲙⲉ ⲉⲣⲟⲉⲓ
  choice: 却说出了关于我的真相
  rationale: ϫⲱ 是“说”，ⲧⲙⲉ 是“真理、真实”；“却”显明与前半句“说谎”的悖论性反差，但不解释悖论如何成立。
- source_word: ⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: 认识我
  rationale: 这里的宾语是说话者本人，因此现代汉语“认识我”比偏抽象的“知道我”自然，也可与后面的“不认识我”形成反复。
- source_word: ⲙⲁⲣⲟⲩⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: 任凭他们不认识我
  rationale: ⲙⲁⲣⲟⲩ- 表示第三人称复数祈使或任许，ⲣⲁⲧⲥⲟⲟⲩⲛ 表示不知；“任凭”保留其意愿语气，又避免把它硬化为单纯未来时。
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: 知识
  rationale: 带定冠词的抽象名词，与后面的“无知”构成直接对偶；采用普通现代汉语的“知识”，保留名词形式。
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: 无知
  rationale: ⲙⲛⲧ- 名词化并与 ⲁⲧ- 否定成分组合，意为“不知、无知”；“无知”简洁地保留与“知识”的悖论对照。
- source_word: ⲁⲛⲟⲕ ⲅⲁⲣ ⲡⲉ
  choice: 因为我就是
  rationale: 保留 ⲅⲁⲣ 的因果承接和该作品反复出现的“我就是”宣告节奏。
theological_decisions:
- issue: 说话者同时自称“知识”与“无知”的身份悖论
  choice: 直译为“我就是知识，也是无知”
  alternative: 我既是认知，也是不可知
  rationale: 原文使用“知道”的名词形态及其否定形态，并未明确谈论“不可知性”。译文不把悖论解释成某种特定神学体系，也不消解两极张力。
- issue: “认识我的人”受命“不认识我”的语气
  choice: 保留任许／祈使语气“任凭他们……”
  alternative: 认识我的人将不认识我
  rationale: 校复文本含 ⲙⲁⲣⲟⲩ-，不是普通未来时；保留这种令人不安的命令或任许语气，不替读者判定说话者是在审判、讽刺还是启示。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。以短行保留《雷霆，完美心灵》的宣告体节奏和对偶结构；重复“认识我／不认识我”以呈现原文词根复现。“我就是——”保留片段在此处的未完状态，不擅自补足下一项自称。
