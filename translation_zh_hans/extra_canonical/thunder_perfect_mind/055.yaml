  yaml_path: translation/extra_canonical/thunder_perfect_mind/055.yaml
  text: I am she before whose face you were ashamed[c][b][a], and you were without shame toward me.
translation:
  language: zh_hans
  text: '**10.** 我就是她[a]：你们曾在我面前感到羞愧[b]，却又在我面前毫不知耻[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”：原文此处的指示成分为阴性；中文以“她”保留说话者的阴性语法特征。
    reason: grammatical_gender
  - marker: b
    text: “在我面前感到羞愧”：也可译作“在我的面前羞愧”或“在我在场时羞愧”。此处科普特文的形态切分有不确定处，但与下句“毫不知耻”构成对照。
    reason: lexical_alternative
  - marker: c
    text: “毫不知耻”：也可译作“无耻地对待我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ
  choice: 我就是
  rationale: 保留全篇反复出现的第一人称自我宣告节奏；“就是”使现代汉语表达自然而庄重。
- source_word: ⲡⲁⲓ（据语境及校订理解为阴性指示成分 ⲧⲁⲓ）
  choice: 那一位女子
  rationale: 明确保留说话者在作品语境中具有承载意义的阴性身份，避免用中性的“那一位”将其抹平；同时以注释说明OCR所见字形的文本问题。
- source_word: ϩⲱⲱⲧ / ⲉ ⲧⲟⲟⲧϥ
  choice: 在我面前
  rationale: 以自然汉语表达“在……面前／临在中”的空间与关系含义，并保留“面前”这一具体意象。
- source_word: ⲁⲩⲉⲓ … ⲃⲟⲗ（与 ⲁⲛⲧⲉⲧⲛ 连读）
  choice: 感到羞愧
  rationale: 该处形态切分不稳，但上下句构成“羞愧／毫无羞耻”的明显反衬；译文依此语境，同时以脚注保留不确定性。
- source_word: ⲙⲛⲧⲁⲧ…
  choice: 毫无羞耻
  rationale: 保留抽象名词所表达的“无羞耻状态”，比“无耻地行事”少一层行为解释，也更贴近原文的尖锐对照。
- source_word: ⲙⲙⲟⲉⲓ
  choice: 对我
  rationale: 保留关系方向，不强行解释为敌对性的“反对我”或“冒犯我”。
theological_decisions:
- issue: 说话者的阴性身份
  choice: 译为“那一位女子”
  alternative: 译为中性的“那一位”
  rationale: 作品中的女性说话者身份具有文本意义，应予保留；这属于语法与文学声音的呈现，不引入额外教义判断。
- issue: 羞愧与无羞耻之间的张力
  choice: 保持并列反衬，不解释其原因
  alternative: 补译为先羞愧、后来却无耻地对待说话者
  rationale: 原文的悖论式并置应当保留，不宜添加时间发展、动机或道德解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“我就是”维持宣告式韵律；冒号凸显身份宣告与后续关系从句。主文本明确呈现女性说话者，并用紧凑的“曾……却又……”再现悖论式反衬。
