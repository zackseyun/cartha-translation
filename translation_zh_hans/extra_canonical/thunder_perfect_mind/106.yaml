base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/106.yaml
  text: 'And learn from my souls.

    Those who know me — I am

    the hearing that is accessible to all [b];

    I am the speech that no one can grasp [c].[d]'
translation:
  language: zh_hans
  text: '**4.** 你们要向我的众灵魂学习。[a]


    认识我的人啊——


    我就是一切事物都可领受的听闻；[b]


    我就是无人能够把握的话语。[c]


    我就是……[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本文字在 OCR 中作 ⲭⲓⲥⲃⲱ，但应读作 ϫⲓⲥⲃⲱ，意为“领受教导、学习”。“我的众灵魂”在科普特文中明确带第一人称所有关系，并采用复数。
    reason: textual_and_morphological_note
  - marker: b
    text: 这里译作“可领受”的词也可表示“被接受的”“共有的”或“合宜的”；“一切事物”也可理解为“一切事情”。
    reason: lexical_alternative
  - marker: c
    text: “把握”也可译作“抓住”“制伏”或“理解”；原词容许身体与心智两方面的含义。
    reason: lexical_alternative
  - marker: d
    text: 本段科普特文末尾另有一个没有补语的“我就是”，可能是下一项自我宣告的开头；现存节选未提供其后内容。
    reason: alignment_note
lexical_decisions:
- source_word: ϫⲓⲥⲃⲱ（OCR 作 ⲭⲓⲥⲃⲱ）
  choice: 学习
  rationale: 这里应是“领受教导、学习”，而非“审判”。采用自然的现代汉语“学习”，并以“向……学习”表达来源。
- source_word: ⲛⲁⲯⲩⲭⲏ
  choice: 我的众灵魂
  rationale: ⲛⲁ- 明示第一人称单数所有关系，ⲯⲩⲭⲏ 在此为复数。保留不寻常的复数意象，不擅自改成单数“我的灵魂”。
- source_word: ⲥⲟⲟⲩⲛ
  choice: 认识
  rationale: 既可指知道，也可指认得；“认识我的人”符合汉语表达，并保留关系性认知的可能。
- source_word: ⲡⲥⲱⲧⲙ
  choice: 听闻
  rationale: 保留名词性，与下文“话语”形成并列的自我指称；“听闻”比“听觉”更能兼顾听的行动与所听见之事。
- source_word: ϣⲏⲡ ⲛϩⲱⲃ ⲛⲓⲙ
  choice: 在万有中都可领受
  rationale: ϣⲏⲡ 可表示被接受、可获得、合宜或共有；译文选“可领受”，同时用脚注保留其他可能。ⲛϩⲱⲃ ⲛⲓⲙ 直指一切事物，故译“万有”。
- source_word: ⲡϣⲁϫⲉ
  choice: 话语
  rationale: 保持名词性和诗体庄重感，又不把它限定为某一专门神学称号。
- source_word: ⲙⲁϩⲧⲉ
  choice: 把握
  rationale: 可兼具抓住、控制和理解的含义，适合保存原文的身体性与认知性双关。
theological_decisions:
- issue: “我的众灵魂”的复数意象
  choice: 按形态保留复数
  alternative: 我的灵魂
  rationale: 原文所有词缀和复数形式可辨；即使这一意象在汉语中显得反常，也不应以神学预设将其抹平。
- issue: 末尾独立的“我就是”
  choice: 以“我就是……”保留，并加脚注说明
  alternative: 删去，视为下一段残句
  rationale: 现有文本确有裸露的 ⲁⲛⲟⲕ ⲡⲉ；保留可反映抄本边界和诗歌连续性，而省略号避免虚构缺失的自我指称内容。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。以“我就是”维持反复的自我宣告节奏；“众灵魂”“听闻”等略显陌生的表达是为保存原文刻意反常的意象和名词并列结构。
