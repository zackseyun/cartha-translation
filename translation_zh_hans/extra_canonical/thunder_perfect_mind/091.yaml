  yaml_path: translation/extra_canonical/thunder_perfect_mind/091.yaml
  text: 'I am the one beneath the earth[b][a],

    and they ascend to me from the lower part of the earth.'
translation:
  language: zh_hans
  text: '**7.** 我是在大地之下的那一位[a]，

    他们从大地的下方上到我这里[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地之下”也可译作“地下”；若译成“冥界”，则会加入原文在此没有明确说明的神话含义。
    reason: lexical_alternative
  - marker: b
    text: 科普特文在此处的文字识别结果跨行断开；本译文依本段的对齐读法，将相关词组连读为“他们……上到我这里”。不过，现有识别文本与这一读法并非完全吻合，因此本句仍有校勘上的不确定性。
    reason: alignment_note
lexical_decisions:
- source_word: ⲡϩⲟ ⲙⲡⲕⲁϩ
  choice: 大地之下／大地的下方
  rationale: 按所提供的分段与校审层，将这一短语理解为空间方位；用“大地之下”保留宇宙性的方位感，同时避免“冥界”所附带、而科普特文本未明说的神话含义。第二行改作“大地的下方”，使现代汉语自然，并保留原文的重复。
- source_word: ⲉⲧⲛⲟⲩϫⲉ
  choice: 上到
  rationale: 依本段的对齐与校审读法表达向上的运动；“上到我这里”比“升至我处”更符合现代标准汉语，同时保持庄重。
- source_word: ⲙⲙⲟⲥ
  choice: 到我这里
  rationale: 将第一人称单数所指及目标方向明确译出；“我这里”在汉语中自然地表达趋向终点。
- source_word: ⲉⲃⲟⲗ ϩⲓϫⲙ
  choice: 从
  rationale: 以“从”表达离开某一位置的起点关系，避免把科普特语复合介词机械展开成不自然的汉语。
- source_word: ⲕⲁϩ
  choice: 大地
  rationale: 上下方位的语境较适合宇宙论意义的“大地”，而不是具体地块意义的“土地”或物质意义的“泥土”。”
theological_decisions:
- issue: “大地之下”是否应解释为冥界
  choice: 保留为“大地之下”
  alternative: “冥界”
  rationale: 原文在此首先表达方位；译成“冥界”会预先确定神话或来世层面的解释，因此不在正文中作此神学化限定。
translation_notes:
  register: 采用现代、清楚而庄重的第一人称宣告体。“那一位”保留原文自我指称的强调；不用古雅的“吾”“升至我处”，也不以“冥界”消解原有的空间歧义。
