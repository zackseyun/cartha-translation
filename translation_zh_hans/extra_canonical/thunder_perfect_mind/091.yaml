review_pass:
  verdict: reject
  source_fidelity: 草稿及英语审校轨迹与所给科普特语OCR摘录不相符。OCR中的ⲡϩⲟ通常是“脸、表面”，并非“下方”；ⲉⲧⲛⲟⲩϫⲉ应为“他们抛、投掷”，并非“他们上升”。此外，OCR摘录在这几行之后继续出现“我是每一个进入之人的预备……我是我名字的分配……”，与英语所称的两句段落不是同一文本内容。
  naturalness: “我是在大地之下的那一位……上到我这里”本身可以理解，但因其不反映所提供的原文，不能批准。若按OCR逐字暂译，中文可自然处理为残篇式的“……大地的表面；他们把它从大地表面上抛出去”。
  terminology: “冥界”不宜加入正文，这一点原则上正确；但“大地之下”不是此OCR中ⲡϩⲟ ⲙⲡⲕⲁϩ的可接受译法。ⲡϩⲟ宜暂译“大地的表面/地面”。ⲧⲥⲟⲃⲧⲉ、ⲧⲡⲱϣⲥ可暂译“预备、分配/划分”，但ⲡⲁⲛⲟⲩⲥ的断词和句法仍须核对影印本或可靠转写本。
  issues:
  - severity: high
    issue: 英语审校轨迹与科普特语OCR摘录发生实质性文本不一致。
    rationale: 英语文本称“我是在大地之下的那一位，他们从大地的下方上到我这里”；OCR却可见“ⲡϩⲟ ⲙⲡⲕⲁϩ……ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ ⲉⲃⲟⲗ ϩⲓϫⲙ ⲡϩⲟ ⲙⲡⲕⲁϩ”，随后还有不同的第一人称宣告。不能以英语轨迹覆盖所给原文。
  - severity: high
    issue: 关键词误释：ⲡϩⲟ与ⲉⲧⲛⲟⲩϫⲉ。
    rationale: 在该OCR语境中，ⲡϩⲟ应按“表面、脸面”处理，ⲉⲧⲛⲟⲩϫⲉ应按“抛出、投掷”处理；草稿的“大地之下”和“上到”无法由此支持。
  - severity: medium
