    rationale: 跨行的ⲙ / ⲙⲟⲥ确可合读为ⲙⲙⲟⲥ，但这只能确认代词宾语“它/她”，并不能将动词改释为“上升”，也不能产生“到我这里”的目标结构。
  - severity: medium
