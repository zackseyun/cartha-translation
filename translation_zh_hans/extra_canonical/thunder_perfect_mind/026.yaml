base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/026.yaml
  text: 'You who know me[a], be ignorant of me;

    and those who have not known me, let them know me[b],

    for I am knowledge and ignorance.'
translation:
  language: zh_hans
  text: '你们认识我的[a]，要不认识我；

    那些不曾认识我的，要认识我[b]，

    因为我是知识，也是无知。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“不认识”所对应的科普特语词源自希腊语，亦可译作“对我无知”；本译保留“认识／不认识”的直接对举。
    reason: lexical_alternative
  - marker: b
    text: 所提供的OCR行中出现了“声音传遍大地”等语句，很可能属于邻近的另一段。本段依《雷霆：完美心灵》中“认识／无知”诗节的通行编排翻译。
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ（动词）
  choice: 认识
  rationale: 表示认知上的“知道、认识”；在涉及对象“我”时，“认识”比单用“知道”更自然，也保留两组命令句的对照。
- source_word: ⲁⲅⲛⲟⲉⲓ（动词；源自希腊语 ἀγνοεῖν）
  choice: 不认识
  rationale: 与前后的“认识我”形成直接而尖锐的悖论；相比“对我无知”，现代汉语更自然，并保留命令语气。
- source_word: ⲅⲛⲱⲥⲓⲥ（名词；源自希腊语 γνῶσις）
  choice: 知识
  rationale: 采用该希腊语借词的常规对应词，并与“无知”构成清楚的概念对举。
- source_word: ⲁⲅⲛⲱⲥⲓⲁ（名词；希腊语借词）
  choice: 无知
  rationale: 保留与“知识”相反相成的悖论；“不知”也可表达，但名词性和对举力度较弱。
theological_decisions:
- issue: 说话者同时自称“知识”和“无知”的悖论
  choice: 按原有并列直译为“我是知识，也是无知”
  alternative: 将其解释为说话者兼具知识与不可知性
  rationale: 原文的神学与修辞张力不应在译文中被解释性消解。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；保留三行诗体、命令语气及“认识／不认识”“知识／无知”的双重对举。由于源文OCR与本段对齐可信度低，正文依据所给校勘咨询层及该诗节的通行位置，脚注明确说明文本对齐问题。
