  register: 采用现代、庄重而易懂的汉语；保留三行诗体、命令语气及“认识／不认识”“知识／无知”的双重对举。由于源文OCR与本段对齐可信度低，正文依据所给校勘咨询层及该诗节的通行位置，脚注明确说明文本对齐问题。
