lexical_decisions:
- source_word: ⲁⲙⲡⲉ（见 ⲛⲁⲙⲡⲉ）
  choice: 实质
  rationale: 该词可指财物、资财或凭借，也可在此悖论式语境中表达实体性或本质。“实质”既与后面的否定形式构成鲜明对称，也不把含义局限为物质财富。
- source_word: ⲁⲧⲁⲙⲡⲉ（推定读法：否定前缀 ⲁⲧ- + ⲁⲙⲡⲉ）
  choice: 无实质者
  rationale: 采用直接的否定对应形式，保留“是实质／无实质者”的悖论和语法上的不对称，不擅自解释为某种特定神学命题。
theological_decisions:
- issue: 说话者同时自称“实质”和“无实质者”的张力
  choice: 保留表面矛盾，不作调和
  alternative: 释作“我既有财产又一无所有”或“我既有本质又超越本质”
  rationale: 原文以对立自称制造张力；任何单一解释都会缩窄其可能兼具的财产义和本体义。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“无实质者”略带文学性，用以对应原文名词与否定形式的并置，并维持反复出现的“我是……”宣告体。
