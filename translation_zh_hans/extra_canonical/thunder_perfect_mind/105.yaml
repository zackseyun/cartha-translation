lexical_decisions:
- source_word: ⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟⲓ
  choice: 你们看着我
  rationale: ⲛⲁⲩ ⲉ-通常表示“看见、看着”；直译并保留第一人称说话者面对听众的语气。
- source_word: ⲙⲡⲉⲧⲛⲥⲁⲛϩⲟⲩ
  choice: 被你们从自己中间赶出去的我
  rationale: 依照经复核的分词理解，作为“我”的补充说明；但OCR字形及切词把握有限，故加注说明。
- source_word: ⲧⲉⲧⲛⲣⲥⲱⲧⲉ
  choice: 你们却败下阵来
  rationale: 将连续字母分析为ⲧⲉⲧⲛ-ⲣ-ⲥⲱⲧⲉ，即“你们被击败／失败”，不再把ⲣⲥⲱ误切为“呼喊”。“却”呈现语义转折，但不额外规定失败的具体性质。
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: 听众啊，要听我
  rationale: ⲥⲱⲧⲙ ⲉⲣⲟⲓ为“听我”，希腊语借词ⲁⲕⲣⲟⲁⲧⲏⲥ意为“听者”；用呼语重现诗体中的直接劝告。
- source_word: ⲛⲧⲉⲧⲛⲭⲓⲥⲃⲱ ⲉⲛⲁⲯⲩⲭⲏ
  choice: 要领受我的话
  rationale: 按底本复核，将OCR的ⲭⲓⲥⲃⲱ理解为ϫⲓ-ⲥⲃⲱ“领受教导、学习”，并将后段视为误识的ⲉ-ⲛⲁ-ϣⲁϫⲉ“我的话”。“领受”兼顾学习与接受教导的含义。
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: 认识我的人啊
  rationale: 按与“听众啊”平行的呼语处理，而不将其并入随后“我是……”的系词句。
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: 我是……
  rationale: 视为下一句的开头；本段在此截断，因此以省略号保存未完状态，不补出“那一位”等宾语或表语。
theological_decisions:
- issue: ⲁⲛⲟⲕ ⲡⲉ是否构成完整的自我宣称
  choice: 译作未完的“我是……”
  alternative: “我就是那一位”
  rationale: 段落边界和复核意见表明该短语开启下一句。译成完整神学称号会人为封闭原文在此处的开放结构。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体。以“听众啊／认识我的人啊”的平行呼语保留原文节奏；避免古奥的“尔等”，也不把“我是……”解释成特定宗派性的神学称号。
