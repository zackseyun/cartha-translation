lexical_decisions:
- source_word: ⲡⲣⲁⲛ
  choice: 名字
  rationale: 该词明确意为“名字／名称”；保留原文“名字—声音”的交错平行结构。
- source_word: ⲧⲥⲙⲏ
  choice: 声音
  rationale: 此处ⲥⲙⲏ意为“声音”，且与ⲡⲣⲁⲛ构成“名字的声音／声音的名字”的对称表达；不采用与本段不相符的“里面”。
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ
  choice: 记号
  rationale: 这是希腊语σημεῖον的科普特语借词，可指记号、标志或征兆；“记号”既自然，又不额外限定其性质。
- source_word: ⲙⲡⲁⲓ
  choice: 这个的
  rationale: 现有OCR可直读为“这个／此者的”。虽然表达突兀，仍保留源文所见指代，不依据二手译文擅自补成“字母的”。
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 显现
  rationale: 该短语表示显露、揭示或显现；名词化译作“显现”，与后接属格关系相合。
- source_word: ⲧⲁϩⲉⲣⲉⲥⲓⲥ
  choice: 分裂
  rationale: 希腊语借词αἵρεσις可有选择、派别、分歧或分裂等义；在缺乏更宽上下文时采用“分裂”，同时用脚注保留其他可能。
- source_word: ⲁⲕⲣⲟⲁⲧ
  choice: 正文暂不译出
  rationale: 该词位于跨页OCR片段尾部，可能属于相邻段落，并可能与“听”有关；因分段和字形均不确定，不纳入本段正文。
theological_decisions:
- issue: “分裂／派别”是否带有异端含义
  choice: 译作“分裂”
  alternative: “派别”或“选择”
  rationale: 不将αἵρεσις自动神学化为“异端”，以免把后期教派意义强加于文本；脚注说明其语义范围。
- issue: “这个的记号”所指为何
  choice: 保留未明指代
  alternative: “字母的记号”
  rationale: OCR所见ⲙⲡⲁⲓ支持“这个的”，但其先行词不清楚。保留含混，避免按英语修订稿补入原文未清楚呈现的“字母”。
translation_notes:
