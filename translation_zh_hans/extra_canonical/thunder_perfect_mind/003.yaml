base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/003.yaml
  text: 'And you hearers, listen to me.

    You who wait for me, take me to yourselves,

    and do not cast me from your sight,

    and do not let your voice hate me, nor your hearing.'
translation:
  language: zh_hans
  text: '你们这些听者，要听我。


    你们这些等候我的人，要接纳我[a]，


    不要把我从你们眼前赶出去，


    也不要让你们的声音恨我，也不要让你们的听觉恨我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候”所译的词也可指“期待”或“渴望”；“接纳我”也可理解为“把我接到你们那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ
  choice: 听的人
  rationale: 这是由 r̄ef- 与“听”构成的复数名词性表达，用“听的人”既保留呼语身份，也比“听众”更贴近原文构词。
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: 要听我
  rationale: 保留“听”的重复和命令语气；这里不仅指听见，也含留心听从之意。
- source_word: ⲧⲟϣⲧ
  choice: 等候
  rationale: 该词可指等待、期待，也可含渴望之意；正文采用较稳妥的“等候”，不把情感意味说死。
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: 接纳我
  rationale: 表达把说话者接受到自己这里；“接纳”在现代汉语中自然，同时保留关系性的动作。
- source_word: ⲙⲡⲣⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲙ ⲡⲉⲧⲛϩⲟ
  choice: 不要把我从你们眼前赶走
  rationale: 依据经校勘的手稿读法，而不采信失真的 OCR；“从你们眼前”对应“从你们的脸面/视线中”，“赶走”传达抛出、逐出的动作。
- source_word: ⲙⲡⲣⲧⲣⲉⲡⲉⲧⲛϩⲣⲟⲟⲩ ⲙⲥⲧⲱⲉⲓ
  choice: 不要让你们的声音恨我
  rationale: 保留原文将“声音”拟人化并以“恨”为谓语的突兀表达，不改写成“使我厌恶你们的声音”。
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: 你们的听觉
  rationale: 末句结构残缺；采用名词性“听觉”与前面的“声音”并列，避免擅自补足不确定的谓语。
theological_decisions:
- issue: 声音“恨”说话者的拟人化表达
  choice: 直译为“让你们的声音恨我”
  alternative: 不要使你们的声音令我厌恶
  rationale: 原文语法使“你们的声音”成为“恨”的主体。直译保留作品特有的悖论与张力，不把主体客体关系倒置。
- issue: 末尾“你们的听觉”与前句的关系
  choice: 以省略结构译作“连你们的听觉也不要”
  alternative: 补译为“也不要让你们的听觉恨我”
  rationale: 传本在此不完整或语法关系不够清楚；正文只作最小限度的汉语补接，脚注说明其残缺，避免把可能的含义确定化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留开头“听的人／听我”的词根重复，以及“声音恨我”这一有意突兀的拟人说法。依据已核正的手稿读文翻译中段，不沿用失真的 OCR 所产生的“逃跑”“使沉重”等词。
