lexical_decisions:
- source_word: ⲙⲛⲧⲁⲧ(ⲉⲟⲣⲧⲏ)
  choice: 不守节期的
  rationale: OCR所见ⲙⲛⲧⲁⲧ-很可能是带否定、缺失意义的名词构词成分，与希腊语借词“节期”结合。译作“不守节期”既保留否定力量，也以自然汉语表达具体的礼仪行为。
- source_word: ϩⲛ ⲟⲩ ⲕⲁϩ
  choice: 节期众多的
  rationale: 此短语的读法尚属暂定，语境上与前半句“无节期”构成悖论式对照，故以“众多”传达数量或丰盛之意，同时保留文本张力。
- source_word: ⲁⲩⲱ
  choice: 也
  rationale: 原词是连接两个并列宣告的连词；汉语用“也”更自然地承接重复的“我是”，并突出两句同属一位说话者。
- source_word: ⲡⲁⲓ …（关系结构）
  choice: 我是那……的
  rationale: 保留诗中反复出现的第一人称身份宣告及女性说话者的语境；现代汉语不以代词标示阴性，因此采用庄重而自然的“我是那……的”结构。
theological_decisions:
- issue: 不守节期与节期众多之间的悖论
  choice: 不加解释地保留两句并列对立
  alternative: 将后句解释为拥有许多属灵节庆，或把前句限定为不守某类节期
  rationale: 原文以悖论式自我宣告制造张力；任何具体神学化解释都会超出本段可确定的语言证据。
translation_notes:
  register: 采用现代、庄重、易懂的诗性汉语，以“我是那……的／也是那……的”维持平行结构。脚注分别说明“节期”的词义范围及后半句底本文字的不确定性；不将悖论预先解释为任何特定宗派教义。
