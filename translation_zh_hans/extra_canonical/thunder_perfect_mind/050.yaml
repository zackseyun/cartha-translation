base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/050.yaml
  text: '...outwardly[a], and you knew me inwardly. I am she before whom you were ashamed, and you were shameless. I, I am godless, and I am the virgin[b], her God.'
translation:
  language: zh_hans
  text: '……在外面[a]，而你们在里面认识了我。

    我就是你们在她面前感到羞耻的那一位，

    你们却又对我不知羞耻。

    我是不守节期的那一位，

    也是节期众多的那一位。

    我，我是不敬神的那一位，

    也是她的神伟大的那一位。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段开头承接上一句，现有摘录只从“在外面”开始，因此译文保留省略号，不擅自补足残缺内容。
    reason: textual_fragment
  - marker: b
    text: 这一带的OCR讹误较多。按平行结构及校勘后可恢复的读法，末几句大意是“不守节期／节期众多”以及“不敬神／她的神伟大”；因此不采用把此处译成“童女”的读法。
    reason: textual_criticism
lexical_decisions:
- source_word: ⲉⲃⲟⲗ / ϩⲧⲉϩⲟⲩⲛ
  choice: 在外面／在里面
  rationale: 保留外与内的空间性对举；首词处于残句中，不补出原文没有可靠保存的谓语。
- source_word: ⲁⲧⲉⲧⲛⲥⲟⲟⲩⲛ
  choice: 你们认识了我
  rationale: 按科普特语完成时理解，保留复数第二人称；宾语“我”依据句法与校勘文本表达。
- source_word: ϣⲓⲡⲉ / ⲁⲧϣⲓⲡⲉ
  choice: 感到羞耻／不知羞耻
  rationale: 用现代汉语清楚呈现诗中“羞耻—无耻”的悖论对举。
- source_word: ⲧⲉⲛϣⲉⲛⲉⲥⲱⲥ（OCR）
  choice: 节期众多的那一位
  rationale: OCR字形明显受损；结合平行句式及通行校勘，可辨为关于节期多少的陈述，而不是“童女”。
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: 不敬神的那一位
  rationale: 该词由否定成分与“神”构成，可指“不敬神、无神”；此处采用自然且不把它强行解释为哲学无神论的译法。
- source_word: ⲧⲉⲛϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ（OCR）
  choice: 她的神伟大的那一位
  rationale: 按受损文本背后的常见校勘读法理解为“其神伟大”；保留第三人称阴性领属和原文刻意形成的神学张力。
theological_decisions:
- issue: “不敬神”与“她的神伟大”并置
  choice: 保留两句的直接矛盾感，不加解释调和
  alternative: 将“不敬神”改成“没有神”，或把后句解释为说话者自己就是神
  rationale: 诗体以悖论式自称推进；译文不应替原文消解身份与神性关系上的张力。
- issue: 节期陈述的宗教含义
  choice: 译作“不守节期／节期众多”
  alternative: 泛化为“不庆祝／庆典很多”
  rationale: “节期”既自然又保留宗教礼仪语境，同时不限定为某一宗派或特定历法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以重复的“我就是／我，我是”保存原诗自我宣告的节奏。阴性说话者通过“她”显明；不使用古奥文言，也不把悖论改写成系统神学命题。
