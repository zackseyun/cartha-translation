  source_fidelity: 首句译为“你们要注视我：我从受尊崇的人中出来”没有体现开头ⲉⲣⲟⲓ（“到我这里／向我”）所引出的呼召，且把来者与说话者混同。按可辨认的词序，宜保留“到我这里来……从受尊崇者中出来”的结构。其余各句基本采纳较可靠的校勘性复原：最低微之处“会找到我”；ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ为“不要把我丢弃／赶出去”；末词为“慈悲的、怜悯的”，而非未来性“将受卑微者”。
