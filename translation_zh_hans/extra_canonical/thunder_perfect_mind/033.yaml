base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/033.yaml
  text: 'Look at me as I come forth among those who are honored[1];

    and in the least places you will find me.

    And do not cast me out among those who are destitute in worthlessness[d][c][b][a][5][4][3][2];

    for I—I am compassionate.'
translation:
  language: zh_hans
  text: '**11** 你们要注视我：我从受尊崇的人中出来[a]；

    在最卑微之处，你们必找到我[b]。

    不要把我从那些在无用之中一无所有的人中间丢弃[c]；

    因为我——我是有怜悯的[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头几个字在OCR中分词不稳；这里按“我从受尊崇的人中出来”理解。也有校勘传统把邻近语句处理为对受压低者的呼召。
    reason: textual_variant
  - marker: b
    text: 这一处OCR严重讹乱；正文依据校勘上较可信的复原“你们必找到我”。若机械拆读OCR字形，曾可产生“房屋”或“看见”等译法，但很可能并非抄本原文。
    reason: alignment_note
  - marker: c
    text: “在无用之中一无所有”保留了原句不寻常的搭配；“无用”所对应的是一个源自希腊语、表示“无用或无价值”的名词。
    reason: lexical_alternative
  - marker: d
    text: “有怜悯的”也可译作“慈悲的”。该词不宜解析为“将要受卑微的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: 受尊崇的人
  rationale: 按可辨认的词形理解为“受尊敬、受尊崇的人”；以被动表达保留其社会地位含义，并与下文“最卑微之处”形成反差。
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: 最卑微之处
  rationale: 希腊语借词组合表示“最小、最低微的地方”；译作“最卑微之处”兼顾空间与社会意义。
- source_word: ⲛⲧⲉⲧⲛϭⲓⲛⲉ ⲙ̄ⲙⲟⲓ（据残损或讹乱字形复原）
  choice: 你们必找到我
  rationale: 现有OCR在此严重讹乱；依上下文及校勘复原为“你们将找到我”，不采用由讹字拆出的“房屋”或“看见”之说。
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: 不要把我……丢弃
  rationale: ⲛⲟⲩϫⲉ 加第一人称宾语及 ⲉⲃⲟⲗ 表示“把我扔出去、丢弃我”，并非“在我之上自高”。
- source_word: ⲛⲉⲧϣⲁⲁⲧ
  choice: 一无所有的人
  rationale: 按“缺乏、匮乏”的词根理解，指贫乏或一无所有者；不取“践踏者”之义。
- source_word: ⲙ̄ⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: 无用
  rationale: 源自希腊语 ἀχρήστ- 的借词，表示无用、无价值的状态；直译以保留原句刻意生硬而矛盾的措辞。
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: 有怜悯的
  rationale: 这是科普特语中表示“慈悲、怜悯”的常用词，不拆解为“将要受卑微的人”。
theological_decisions:
- issue: 说话者自称“有怜悯的”
  choice: 按词汇常义直译为“我是有怜悯的”
  alternative: “我是将要受卑微的”或“我是受人蔑视的”
  rationale: ⲟⲩϣⲁⲛϩⲧⲏⲥ 的标准词义支持“有怜悯的／慈悲的”；其他译法源于不可靠的形态拆分。此处不进一步界定说话者的神学身份。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。以“注视我—找到我—不要丢弃我”的动词推进保持诗性呼告；对“在无用之中一无所有”不作顺滑化改写，以保留原文的陌生感和张力。
