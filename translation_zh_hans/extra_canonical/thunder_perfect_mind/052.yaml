base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/052.yaml
  text: 'I am the one you have thought about[a],

    and you have mocked me.

    I am unlearned, and from me they learn.

    I am she whom you have scorned[g][f][e][d][c][b],

    and you think about me.'
translation:
  language: zh_hans
  text: '我就是你们曾想过的那一位，


    你们嘲弄了我。


    我未受教[a]，


    他们却从我学习。


    我就是那位被你们轻蔑的女子[b]，


    你们想着我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未受教”也可译作“没有学问”或“无知”；后者的贬义较强。
    reason: lexical_alternative
  - marker: b
    text: 原文此处明确使用阴性语法形式，直译近于“我就是她——你们所轻蔑的”。
    reason: source_gender
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ / ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: 想过我／想着我
  rationale: 两处采用同一汉语词根，保留原文的重复；同时以“曾……过”表现前一处完成式，以“……着”表现后一处现在时主句。
- source_word: ⲁⲧⲉⲧⲛϣⲟⲥⲧ
  choice: 你们却嘲弄了我
  rationale: 按ϣⲱⲥ“嘲弄、藐视”及完成式、第二人称复数主语和第一人称单数宾语解析；“却”凸显与前句的张力，但不把本句误作“隐藏”。
- source_word: ⲁⲧⲥⲃⲱ
  choice: 没有学问
  rationale: 表达“未受教、没有学识”的状态，又与下句“众人却向我学习”形成清楚自然的悖论；避免“无知”可能带来的过强贬义。
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ ⲛ̄ⲧⲟⲟⲧ
  choice: 众人却向我学习
  rationale: 保留“从我而学”的方向关系；汉语以“向我学习”最自然。“众人”用于表达未明确指称的第三人称复数。
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: 轻蔑
  rationale: 对应希腊语借词καταφρονέω的“轻看、蔑视”，语气庄重，并与前面的“嘲弄”有所区分。
- source_word: ⲧⲉ ⲧⲉⲛⲧⲁⲧⲉⲧⲛ̄…
  choice: 我就是那个……的女子
  rationale: 原文此处明确采用阴性系词和阴性关系结构；中文补出“女子”，以保留源文标明的女性身份。
theological_decisions:
- issue: 说话者在“你们所轻蔑的”一句中的语法性别
  choice: 明译为“女子”
  alternative: 只译作“那一位”，不显示性别
  rationale: 科普特文在此明确使用阴性形式。译出女性身份是保留文本证据，并非引入关于说话者身份的额外神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的短行诗体。重复“我就是”以保存宣告式节奏；以“却”呈现“没有学问／众人向我学习”的悖论。未采用咨询文本中的“律法／无法无天”，因为该措辞与本段科普特文不相符。源文摘录末尾另起的ⲁⲛⲟⲕ ⲡⲉⲛ是不完整的下一句开头，故未擅自补译。
