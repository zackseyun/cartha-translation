lexical_decisions:
- source_word: ⲉⲣⲟⲉⲓ ϩⲛ ⲟⲩϭⲱⲛ
  choice: 在愤怒中听我
  rationale: 所给摘录始于介词短语“对我／听我……在愤怒中”；支配它的动词应在前文。依现有校勘所确认的连续语句补出“听”，同时保留“愤怒中”的简洁表达。
- source_word: ⲛⲧⲉⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  choice: 向我学习
  rationale: ⲥⲃⲱ 指教导、训诲；ϫⲓ ⲥⲃⲱ 可表示领受教导、学习。译作“向我学习”符合现代汉语，也保留“我”作为学习所本的关系。
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ
  choice: 在温柔中
  rationale: OCR 此处很可能有讹误；据经核文本及句中与“愤怒”的对照，所指为温柔、柔和。译作“温柔”保留反差，不擅自将其解释为软弱或平静。
theological_decisions:
- issue: 愤怒与温柔的并置
  choice: 保留“在愤怒中……在温柔中……”的张力
  alternative: 解释为“即使你们愤怒，也要温顺地听从我”
  rationale: 原句让两种状态并列，未明确指出愤怒或温柔属于说话者还是听众；不在正文中补定主体，以保存原有歧义和悖论色彩。
- issue: 误置的“我是结合，也是解体”
  choice: 不采用
  alternative: 我是结合，也是解体
  rationale: 该句属于作品前面的另一处；当前科普特语行文实际对应“听我……向我学习……”，故不能依据错位的咨询文本替换本段。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两分句保持平行节奏；“在……中”既贴近科普特语结构，也避免擅自判定“愤怒”和“温柔”究竟是谁的状态。
