  source_fidelity: 首两项基本遵循所给科普特语：ϣⲓⲛⲉ ⲛⲥⲱ=为“寻求、追寻”，ⲁⲓⲧⲉⲓ为“请求、求取”，而非咨询文本中的“辱骂／尊崇”。不过，ⲑⲉⲱⲥⲓⲥ对应“神性／神圣性”（theosis），并非“上帝”本身；“上帝所在之处”将抽象名词具体化且改变了原文用词。
  naturalness: 原译具有诗性，但“也是”会把并列名词短语处理成完整判断句，略添原文未明示的逻辑关系。“寻求我的人所寻获的”及“神性之地众声音的声音”既较自然，也保留原文的名词性并列与重复结构。
  terminology: 应将“上帝所在之处”改为“神性之地”或近义表达，以区别“神性”与“上帝”。“向我求问”容易限缩为询问消息；“向我请求者”较贴近αἰτέω的求取／请求义。
