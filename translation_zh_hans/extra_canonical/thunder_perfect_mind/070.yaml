  source_fidelity: 译文前两组名词短语基本忠实地反映了所给科普特语：ϣⲓⲛⲉ ⲛⲥⲱ= 是“寻求、追寻”，ⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ 是“向我请求／求问”，并非失配咨询文本所称的“辱骂／尊崇”。不过，ⲑⲉⲱⲥⲓⲥ 应译为“神性／神化”，不是“上帝”；将其译成“上帝所在之处”不当地具体化并改变了词义。末一短语的句法及OCR读法仍有不确定性，宜以脚注保留。
