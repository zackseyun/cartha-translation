  text: the finding of those who seek me[a], and the command of those who ask me, and the voice of the voices of the place of God, of the angels[d][c][b], which they utter
translation:
  language: zh_hans
  text: '寻求我的人所寻见的[a]，

    向我求问的人所发的命令[b]，

    也是上帝所在之处众声音中的声音，

    就是天使所发出的[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“寻求我的人所寻见的”。这里的“寻求”不是“辱骂”或“咒诅”；所给科普特语片段也没有“为什么……”这一问句。
    reason: source_and_alignment_clarification
  - marker: b
    text: “向我求问”也可译作“向我请求”；“命令”也有“吩咐、指示”的含义。原文没有明说这命令由谁发出。
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: 末两行的修饰关系较为紧密而含混，也可较直地译作：“上帝之处众声音的声音，天使所发出的。”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ⲡⲅⲓⲛⲉ ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: 寻求我的人所寻见的
  rationale: ⲅⲓⲛⲉ 是“寻找、寻见”，ϣⲓⲛⲉ ⲛⲥⲱ= 是“寻找、追寻”。采用同根式汉语表达，保留原文“寻找者—寻见之物”的呼应；此处不是“辱骂我”。
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: 命令
  rationale: 该词通常指命令、吩咐或指示。译作“命令”最直接，也不擅自说明命令由谁发出或向谁发出。
- source_word: ⲛⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ
  choice: 向我求问的人
  rationale: ⲁⲓⲧⲉⲓ 源自希腊语 αἰτέω，意为请求、求取。依上下文译作“向我求问”，避免错误地解释为“尊崇我”。
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: 众声音中的声音
  rationale: 直译近于“众声音之声”。汉语用“众声音中的声音”保留叠词结构，同时使关系较自然。
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱⲥⲓⲥ
  choice: 上帝所在之处
  rationale: 原文可理解为“上帝之处”或“上帝所在之处”。采用后者以形成自然汉语，但不把它具体化为天堂、圣殿等特定场所。
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ
  choice: 天使所发出的
  rationale: 末句把声音与天使的发声相连。译文保留省略式收束，不补入原文没有的具体话语内容。
theological_decisions:
- issue: 是否把名词短语补成完整的第一人称身份宣告
  choice: 不补出“我是”
  alternative: 我是寻求我的人所寻见的……
  rationale: 所给片段本身是一连串带定冠词的名词短语，没有明写第一人称系词。虽然全诗上下文可能使“我是”成为自然理解，正文仍保留本片段的语法形态，避免替原文补足。
- issue: “上帝所在之处”的具体所指
  choice: 保持泛指
  alternative: 天上、天堂或上帝的圣所
  rationale: 原文只说“上帝之处”，不足以限定为某一神学空间。
translation_notes:
  register: 采用现代、庄重而可诵读的简体中文。保留原文名词短语的诗性并列和末句的省略感，不依据失配的咨询问句改写，也不以特定宗派术语解释“上帝之处”或天使的声音。
