translation:
  language: zh_hans
  text: '**6.** 我是那位[a]在惧怕的人中被寻见的[b]；

    我也是战栗中的力量[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位”在中文中不标明性别；本篇通篇确立的是女性发言声音，而科普特语 ⲁⲛⲟⲕ（“我”）本身没有性别标记。
    reason: cultural_note
  - marker: b
    text: 原文形态较自然地指“那些惧怕的人”，也有人理解为抽象的“种种恐惧”。动词形式还可直译为“将被寻见”。
    reason: lexical_alternative
  - marker: c
    text: “力量”是依据平行结构及其他文本见证谨慎补出的；在本段所给OCR片段中，该词并不清楚。“战栗”也可能理解为“战栗的人”。
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲛ
  choice: 在……中
  rationale: 保留基本的处所含义；既可表达置身某些人之中，也能自然连接后句“战栗中的力量”所形成的平行结构。
- source_word: ⲛⲉⲧⲛϣⲟϫⲛⲉ
  choice: 惧怕的人
  rationale: ⲛⲉⲧⲛ- 加动词的形态首先指向“那些正在……的人”，故不将其抽象化为“种种恐惧”。“惧怕的人”比“惧怕者”更符合现代普通话。
- source_word: ϯⲛⲁⲕⲣⲣⲱ
  choice: 被寻见
  rationale: 该形式带将来标记，直译可作“将被寻见”；但在本诗反复出现的自我宣告中可作恒常性陈述。正文采用“被寻见”，并以脚注保留时态上的可能性。
- source_word: ⲁⲛⲟⲕ
  choice: 我是
  rationale: 保留诗中反复的第一人称自我宣告及其节奏，不弱化为单纯的“我”。
- source_word: ⲛⲉⲧⲕⲗⲏϣ
  choice: 战栗
  rationale: 采用抽象名词以形成“战栗中的力量”这一凝练悖论；形态也可能指“战栗的人”，故在脚注说明。
- source_word: ⲟⲩϩⲟⲟⲩ（据其他见证补读）
  choice: 力量
  rationale: “力量”比“权能”更自然，也不额外引入宗教术语色彩；但该词在所给OCR片段中并不清楚，因此明确标注为谨慎补读。
theological_decisions:
- issue: 发言者的女性身份
  choice: 正文用不标性别的“那位”，脚注说明全篇声音为女性
  alternative: 译作“我是那女子”或以“她”显明性别
  rationale: 科普特语第一人称代词本身不标性别；中文第一人称同样无需强加性别，但全篇确立的女性声音仍值得说明。
- issue: “惧怕”与“力量”并置的悖论
  choice: 直译为“在惧怕的人中被寻见”及“战栗中的力量”
  alternative: 解释为发言者安慰惧怕者，或将其神学化为某种特定能力
  rationale: 原文只作并置，没有解释两者关系；保留张力，避免加入宗派性或心理化阐释。
