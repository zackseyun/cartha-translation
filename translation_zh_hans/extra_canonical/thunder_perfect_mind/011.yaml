  naturalness: 修订为“那不孕的女子”较准确、庄重且适合此类宣告体诗文。“我是”重复出现，较“我也是”更能再现原文反复的第一人称判断句和节奏。
  terminology: 保留“肢体”，它可自然表达身体构成部分的集合形象；脚注说明“身体的各部分”这一较明白的替代译法。用“不孕”替代“不生育”，避免将生理状态误解为个人选择。
