lexical_decisions:
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: 肢体
  rationale: 保留身体部位的集合意象；“肢体”在现代汉语中既可指身体各部分，也保有较宽的联想空间。
- source_word: ⲛⲁϣⲉ
  choice: 不生育的女人
  rationale: 上下文明确指女性；此译比“不孕者”更自然庄重，同时保留与“孩子很多”之间的悖论。
- source_word: ⲛⲉⲥϣⲏⲣⲉ
  choice: 她的孩子
  rationale: 保留阴性第三人称所有关系，并以“孩子”涵盖子女，不窄化为“儿子”。
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: 我是
  rationale: 再现诗中反复出现的第一人称判断句及其宣告式节奏。
- source_word: ⲁⲩⲱ
  choice: 也
  rationale: 连接并列的自我宣告；现代汉语中比句首“并且”更自然，同时不消解悖论。
- source_word: （表示“我母亲的”的属格短语）
  choice: 我母亲的
  rationale: 按语境呈现第一人称领属意义，但因OCR及对齐可信度有限，以脚注说明文本风险。
theological_decisions:
- issue: 说话者先称自己为“不生育的女人”，随后却说“她的孩子”很多
  choice: 保留第三人称“她的孩子”
  alternative: 改作“我的孩子”
  rationale: 科普特文提供阴性第三人称领属形式；不把突兀的人称转换解释性地抹平，以保存原文的诗性张力和身份悖论。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，保留两句“我是”宣告的平行节奏，并以破折号突出“不生育”与“孩子很多”之间未获解释的悖论。
