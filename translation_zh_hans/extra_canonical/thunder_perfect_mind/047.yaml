  terminology: “律法／不法”恰当地保存νόμος／ἀνομία的词汇对照；“死亡”作为被赋予的称号以引号呈现合适。“捉住”保留了ⲁⲙⲁϩⲧⲉ的具体把持、抓住之意，且未不当地限定为司法逮捕或抽象领会。
