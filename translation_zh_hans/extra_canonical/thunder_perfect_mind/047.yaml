  source_fidelity: 译文准确反映所给科普特语片段的三重“我是……的那一位”宣告结构。首句将ϩⲛ ⲙⲁ ⲛⲓⲙ按“在各处／每一处”处理，是面对OCR连写时较直接且审慎的分词；“死亡”“律法”“不法”以及“追赶／捉住”的对应均稳妥。第二句保留“他们称……／你们称……”的主体转换，也没有依从明显错位的英文consult_text。
