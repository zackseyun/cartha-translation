base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/047.yaml
  text: 'Among the peoples[a], they have named me “Death.”

    I am she whom they call “Law,” and you have called me “Lawlessness.”

    I am she whom you pursued, and I am she whom you seized.'
translation:
  language: zh_hans
  text: '在各处[a]，我就是他们称为“死亡”的那一位。


    我就是他们称为“律法”的那一位，而你们却称我为“不法”。


    我就是你们所追赶的那一位，也是你们所捉住的那一位。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在每一处”。底本为连写的OCR文本；若采用另一种分词，也有人理解为“在各族中”。
    reason: 说明OCR连写造成的分词可能性，同时在正文采用最直接的科普特语分析。
lexical_decisions:
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: 在各处
  rationale: 按较自然的分词理解，ϩⲛ 表示“在”，ⲙⲁ 表示“地方”，ⲛⲓⲙ 表示“每一”，合为“在每一处／在各处”。这比依据不确定连写而译成“在各族中”更直接。
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ ϫⲉ
  choice: 称为／称我为
  rationale: 这是科普特语常见的命名结构；中文按各句句法分别译为“称为”和“称我为”，既自然又保留命名意味。
- source_word: ⲡⲙⲟⲩ
  choice: “死亡”
  rationale: 定冠词与命名结构共同使该词具有称号性质；以引号标示，不额外解释其象征意义。
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: “律法”
  rationale: 希腊语借词 νόμος，译作“律法”可保留法律、规范的语义，并与“不法”形成词形和概念上的对照。
- source_word: ⲧⲁⲛⲟⲙⲓⲁ
  choice: “不法”
  rationale: 希腊语借词 ἀνομία；“不法”与“律法”构成紧密反义对应，也避免用“罪孽”等词过度神学化。
- source_word: ⲁⲛⲟⲕ ⲧⲉ …
  choice: 我就是……的那一位
  rationale: 保留反复出现的“我是”宣告及关系从句。科普特语阴性系词在现代汉语中无需强行以性别代词表达。
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: 追赶
  rationale: 该组合直译有“跟在后面跑”的意味，语境中自然表达为“追赶”，不预设追求或迫害的动机。
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: 捉住
  rationale: 保留抓获、控制的具体动作感，同时不限定为司法意义的“逮捕”。
theological_decisions:
- issue: “律法”与“不法”并列所形成的悖论性自称
  choice: 直接保留两种彼此张力强烈的称谓，不加调和
  alternative: 把“不法”解释性译为“违背律法者”或把两者处理成不同说话群体的评价
  rationale: 原文刻意让同一位说话者承受相反称号；翻译不应替文本化解这种神学与修辞张力。
- issue: “追赶”与“捉住”的性质
  choice: 使用中性的动作词
  alternative: 译作“追求／寻求”与“领会”，或“迫害”与“逮捕”
  rationale: 原文动作可以带敌对意味，却未明确交代动机；中性表达保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的宣告体。三次以“我就是……的那一位”维持原文反复结构；“而……却……”突出“律法／不法”的对照，但不增添解释。引号用来标明三个作为称号使用的名词。
