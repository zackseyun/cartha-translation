base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/042.yaml
  text: For why do you hate me[a], O Greeks? Because I am a barbarian? And I am the knowledge of the Greek and the barbarian[d][c][b]. I am the judgment.
translation:
  language: zh_hans
  text: 希腊人啊，你们为什么恨我？是因为我是蛮族人吗？我是希腊人和蛮族人的知识。[a]我是审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据OCR转写在本段有多处受损或误分；依经校勘的科普特文本，此处读作“希腊人”“蛮族人”“知识”和“审判”。旧有的“患病／医生／港湾”读法源于对受损字形的误分和误认。
    reason: textual_note
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ ⲅⲁⲣ ⲧⲉⲧⲛⲙⲉⲥⲧⲉ
  choice: 你们为什么恨我
  rationale: 按经校勘所恢复的科普特句法理解；ⲉⲧⲃⲉⲟⲩ 表示“为什么”，ⲧⲉⲧⲛ-为第二人称复数。语气词 ⲅⲁⲣ 在此不必机械译为“因为/原来”。
- source_word: ⲛⲉⲓⲉⲗⲗⲏⲛ（OCR：ⲡⲉⲓⲛⲗⲏⲛ）
  choice: 希腊人啊
  rationale: 将受损OCR依已知文本恢复为带呼语色彩的“希腊人”；中文用“啊”明确呼语。
- source_word: ⲧⲃⲁⲣⲃⲁⲣⲟⲥ（OCR：ⲧⲉⲙⲁⲩⲉⲣⲟⲥ）
  choice: 我是蛮族人
  rationale: 源词是希腊借词 βάρβαρος，指希腊人视为语言、文化之外的人。“蛮族人”保留古代希腊—非希腊的对举，不把它现代化为特定民族。
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: 知识
  rationale: 直译为“知识/认识”。保留说话者自称为知识的悖论式表达，不释义为“我认识”。
- source_word: ⲡϩⲁⲡ（OCR：ⲫⲁⲡ）
  choice: 审判
  rationale: ⲡϩⲁⲡ 可指审判、裁断或判决；“审判”最能保留其抽象自谓形式，且不误读为“医生”。
theological_decisions:
- issue: “知识”的属格关系
  choice: 我既是希腊人的知识，也是蛮族人的知识
  alternative: 我通晓希腊人和蛮族人
  rationale: 选择名词性自谓，以保留原文“我是知识”的神学与修辞张力；不将其平滑处理为主体拥有知识。
- issue: “审判”的身份性陈述
  choice: 我是审判
  alternative: 我是审判者／我是判决
  rationale: 原文以名词作表语，可能涵盖审判行为、裁断及判决结果。正文保留较宽泛的“审判”，不擅自人格化为“审判者”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“希腊人—蛮族人”保留古代文化对举；“蛮族人”仅反映源语中的希腊中心称谓，并非译者对任何族群的评价。句式保留《雷霆：完美的心智》连续自谓及悖论式节奏。
