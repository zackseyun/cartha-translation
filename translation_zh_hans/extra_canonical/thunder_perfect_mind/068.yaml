base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/068.yaml
  text: Why do you despise me among those who are small? I am the Mind[a], and my Rest[f][e][d][c][b]. You are the knowledge of my kind
translation:
  language: zh_hans
  text: '**5.** 你们为何在那些微小的人中间轻视我？[a]

    我是心智，[b]也是我的安息。

    你们是认识我族类的人。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原稿OCR多处讹误。按较可信的复原，此句也可译作：“你们竟在那些微小的人中间轻视我。”这里的“微小”也可能指年幼、卑微或不受重视。
    reason: 说明文本复原、句式与词义的不确定性。
  - marker: b
    text: “心智”音译可作“努斯”，原词是借自希腊语 νοῦς 的科普特语词，也可译作“理智”。
    reason: 保留哲学术语的词汇替代方案。
  - marker: c
    text: 这一行的OCR严重损坏；译文采用经审订的复原：“你们是认识我族类的人。”若把“认识”按抽象名词直译，也可理解为：“你们是关于我族类的知识。”
    reason: 标明关键文本复原与句法歧义。
lexical_decisions:
- source_word: ⲧⲉⲧⲉⲧⲱⲃⲡ … ⲁⲛⲟⲕ
  choice: 你们为何……轻视我？
  rationale: 依据校勘所指出的较可信读法，将OCR中的形式理解为第二人称复数主语、以“我”为宾语的“轻视/弃绝”；问句语气随经审订的英译保留，但原残损OCR也可容许陈述理解。
- source_word: ⲛⲛⲉⲧ ⲛⲉⲣⲙⲛⲥⲁⲛⲁⲓ
  choice: 在那些微小的人中间
  rationale: 保留“微小、卑微”这一较宽泛的语义，不把它限定为童年或儿童。
- source_word: ⲡⲛⲟⲩⲥ
  choice: 心智
  rationale: 这是希腊语 νοῦς 的科普特语借词；“心智”在现代汉语中既自然，也能保留其思想、理智原则的哲学分量。
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: 我的安息
  rationale: 对应希腊语 ἀνάπαυσις，兼有歇息、安歇之意；“安息”简洁庄重。
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: 认识……的人
  rationale: 该词表示知识或认识；结合较可信的复原句法，采用自然汉语关系表达，而不硬译为抽象名词“知识”。
- source_word: ⲙⲡⲁⲅⲓⲛⲉ ⲛⲥⲱ
  choice: 我族类
  rationale: 依照审订意见，将受OCR破坏的字串复原为与希腊语 γένος 有关的“我的族类”，不沿用缺乏文本支持的“我的寻求”。
theological_decisions:
- issue: “心智”与“安息”的关系
  choice: 译作两个并列的自我宣称：“我是心智，也是我的安息”
  alternative: “我是心智和我的安息”或将后句接到下一行
  rationale: 原文在“心智”后有连接词，并出现第一人称所有格“我的”；保持其反常而有张力的表达，不擅自解释为某种神学体系。
- issue: “你们是认识我族类的人”的含义
  choice: 保留“认识”与“族类”的开放含义
  alternative: 解释为“你们就是关于我族类的知识”
  rationale: 底本文字受OCR损坏，且“知识/认识”可能是表语名词；中文采用可读而不额外规定其救赎论或宇宙论含义的表达。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留《雷霆，完美的心智》中悖论式的第一人称宣告；对受损OCR不作过度确定的神学阐释。所有脚注标记均已置于正文。
