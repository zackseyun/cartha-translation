review_pass:
  verdict: revise
  source_fidelity: 首句在较可信复原中是第二人称复数的陈述“你们……轻视我”，并无明确可据以译出“为何”的疑问词；应避免把陈述句改为问句。末句的 ⲡⲥⲟⲟⲩⲛ 是“知识／认识”，不是“认识……的人”，故应保留其名词性和原文刻意的表语张力。
  naturalness: “微小的人”略显生硬，改为“微小者”较凝练，并以脚注说明可指年幼、卑微或被轻看的者。“我是心智，也是我的安息”在现代汉语中自然，且保留原文不寻常的第一人称所有格。
  terminology: “心智”适合对应希腊语借词 νοῦς；“安息”适合 ἀνάπαυσις。末句采用“对我族类的认识”，既保留“认识”的抽象名词性，也不将其解释成特定群体中“认识某族类的人”。
  issues:
  - severity: medium
    issue: 首句译为“你们为何……轻视我？”
    rationale: 所据复原为“你们轻视我，那么／竟然……”，OCR和审订记录均未提供可支持“为何”的疑问词。加入“为何”改变了句式与语气。
  - severity: medium
    issue: 末句译为“你们是认识我族类的人”
    rationale: 这将 ⲡⲥⲟⲟⲩⲛ 的抽象名词“知识／认识”转换为施事性“认识……的人”。应保留原文名词表语的开放性。
  - severity: low
    issue: 脚注c将“关于我族类的知识”称作仅是替代理解
    rationale: 这是比“认识我族类的人”更贴近名词句法的表达；脚注应相应修订。
