    reason: 说明文本复原、句式与词义的不确定性。
  - marker: b
    text: “心智”也可音译为“努斯”。原词是借自希腊语 νοῦς 的科普特语词，也可译作“理智”。
    reason: 保留哲学术语的词汇替代方案。
  - marker: c
    text: 这一行的OCR严重损坏；译文采用经审订的复原，直译为“你们是对我族类的认识”。原文在此以“认识／知识”为表语，表达较为抽象；不宜改译为“认识我族类的人”。“族类”也可理解为“种类”或“同类”。
