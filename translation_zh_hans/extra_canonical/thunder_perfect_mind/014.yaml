base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/014.yaml
  text: 'I am the daughter and the woman[a].

    I am the mother of my father

    and the daughter of my husband[d][c][b],

    and he is my offspring.'
translation:
  language: zh_hans
  text: '我是女儿，也是女人[a]。


    我是我父亲的母亲，

    也是我丈夫的女儿[b]，

    而他是我的后代[c]。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特语 ⲥϩⲓⲙⲉ 也可表示“妻子”。正文译作“女人”，以保留其较宽的语义范围，以及它与“女儿”并列时的鲜明效果。
    reason: lexical_alternative
  - marker: b
    text: 此处有版本或读法作“我丈夫的姐妹”，而非“我丈夫的女儿”。这里所据OCR读作 ⲧⲥⲱⲛⲉ（“女儿”），但不能排除字形辨认有误。
    reason: textual_variant
  - marker: c
    text: “而他是我的后代”依照此处OCR及《雷霆》的常见文本传统。若受损的词实际是 ⲡⲁϫⲟⲉⲓⲥ，则应译作“而他是我的主”。
    reason: alternative_reading
  - marker: d
