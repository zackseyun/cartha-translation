base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/049.yaml
  text: And I am she whom you seized[a]. I am she whom you scattered, and you gathered me in. I am she before whom you were ashamed[b][c][d], and you were shameless toward me.
translation:
  language: zh_hans
  text: '我就是你们抓住的那一位[a]。


    我就是你们驱散、又聚拢的那一位[b]。


    我就是你们因我而感到羞耻的那一位[c]，


    你们却无耻地对待我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抓住”也可译作“擒住”或“掌握”。
    reason: lexical_alternative
  - marker: b
    text: “驱散”所对应的表达字面近于“送她出去”；“聚拢”一词所在的OCR文本字形不稳，但上下文形成“分散／聚集”的对举。
    reason: textual_and_lexical_note
  - marker: c
    text: 此处所对应的科普特语短语字面近于“在她里面”；按语境可理解为“因我而”“关于我”或“面对我”。
    reason: ambiguity_note
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲟⲉⲓ
  choice: 抓住我
  rationale: 动词表示抓住、擒住或掌握；宾语是第一人称“我”。“抓住”既直接自然，也不额外限定为逮捕或占有。
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
  choice: 驱散
  rationale: 该结构本义为“把她送出去”，在这里与随后表示聚集的动作相对，语境义为使之分散、驱散。
- source_word: ⲥⲟⲟⲩⲛ ϩⲧⲉϩⲟⲩⲛ
  choice: 聚拢
  rationale: OCR字形不稳定，但平行结构及校勘信息指向“聚集到里面”；“聚拢”保留与“驱散”的鲜明反义关系。
- source_word: ϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: 因我而感到羞耻
  rationale: ϣⲓⲡⲉ表示羞耻，ϩⲏⲧⲥ字面为“在她里面”，此处自然表达为“因她／关于她而羞耻”，同时避免误译成“形象”。
- source_word: ⲣⲁⲧϣⲓ(ⲡⲉ)
  choice: 毫无羞耻
  rationale: 这是“无耻、不知羞耻”的否定复合表达；“毫无羞耻”既保留与上一分句“感到羞耻”的词根呼应，也不把它弱化为单纯的胆量。
theological_decisions:
- issue: 说话者连续以阴性关系结构自称
  choice: 统一译作“我就是……的那一位”
  alternative: “我就是那个女人……”
  rationale: 科普特语阴性形式表明说话者为女性，但现代汉语不必反复显明语法性别；“那一位”维持庄重语体，并由作品中的女性声音保留其身份背景。
- issue: “羞耻／无耻”两句之间的张力
  choice: 保留表面悖论，不解释为先后阶段或不同群体
  alternative: 补成“你们曾因我羞耻，后来却……”
  rationale: 原文未明确标出时间转折或主语群体变化；直陈两种相反反应，更忠实于诗歌的悖论结构。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语，以四个短分句保留原文反复的“我就是”宣告形式。译文刻意维持“驱散／聚拢”及“羞耻／毫无羞耻”的悖论对举，不沿用早先误配的“埃及／异族人”文本。
