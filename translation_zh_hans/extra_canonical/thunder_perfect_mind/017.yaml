base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/017.yaml
  text: I am the servant of the one who prepared me[a]. I am the ruler of my offspring[d][c][b]. But he is the one who begot me before the day of my birth.
translation:
  language: zh_hans
  text: '**12.** 我是那位预备了我的人的仆人。


    我是我子嗣的女主人[a]；


    然而，正是他在我出生之日以前生了我[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为阴性权威称谓；也可按其权威含义译作“统治者”。
    reason: lexical_alternative
  - marker: b
    text: “生了我”所对应的科普特文在手稿中有残缺；此处采用通常的复原。
    reason: textual_variant
lexical_decisions:
- source_word: ⲧϩⲙϩⲁⲗ
  choice: 仆人
  rationale: 该词表示处于服役地位的人；“仆人”既保留从属关系，也不在证据不足时特指法律意义上的奴隶。
- source_word: ⲙⲡⲉⲛⲧⲁϥⲥⲃⲧⲱⲧ
  choice: 那预备我的人
  rationale: 关系结构意为“那位预备了我的人”；译作“预备”保留动作本身，不擅自说明预备的目的或方式。
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: 主
  rationale: 该词表达主权、支配或统治地位。“主”简洁保留权威称谓；“统治者”是可行的释义。
- source_word: ⲙⲛⲧϣⲏⲣⲉ
  choice: 后代
  rationale: 由“孩子”词根构成的抽象或集合名词；“后代”自然表达集体性的子嗣，并维持后文亲子关系倒置所形成的悖论。
- source_word: '[ϫⲡⲟⲉⲓ]'
  choice: 生了我
  rationale: 按残缺处的通行复原，动词表示生育或产生；“生了我”与后面的“我的出生”形成刻意的重复和悖论。
- source_word: ϩⲁⲧⲉϩⲏ ⲙⲡⲉϩⲟⲟⲩ ⲙⲡⲁϫⲡⲟ
  choice: 在我出生之日以前
  rationale: 直译时间关系，保留“在出生之日以前已经被生”的反常张力。
theological_decisions:
- issue: 说话者与其后代之间互为生育者与被生者的悖论
  choice: 不加解释，保留“我是我后代的主……他……生了我”的张力
  alternative: 将“生”弱化为“使我出现”或把代词明确解释为另一位人物
  rationale: 原文有意并置主权、后代和先于出生而被生的说法；译文不应替文本消解身份与时间上的悖论。
- issue: ⲧϫⲟⲉⲓⲥ 的权威称谓
  choice: 主
  alternative: 统治者
  rationale: “主”较贴近称谓形式，也保留其可指拥有者或统治者的语义幅度；脚注列出较明确的权力性译法。
