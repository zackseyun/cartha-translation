    reason: alignment_note
lexical_decisions:
- source_word: ⲧⲙⲉⲥⲓⲱ
  choice: 接生的
  rationale: 该阴性名词在这里指助产者；用“接生的”比专业色彩较强的“助产士”更贴近古代语境，也与下句“不生育的”形成鲜明悖论。
- source_word: ⲙⲁⲥⲙⲓⲥⲉ
  choice: 不生育的
  rationale: 保留否定生育这一基本意义，不擅自解释为不孕、未婚或不愿生育。
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: 慰藉
  rationale: 表达安慰、缓解之意；“慰藉”庄重而自然，并能保留说话者既经历产痛又成为其安慰的张力。
- source_word: ⲛⲛⲁⲛⲁⲁⲕⲉ
  choice: 我产痛的
  rationale: 按带第一人称所属形式理解为“我的产痛”；译文不把产痛改释为别人的痛苦。
- source_word: ⲧϣⲉⲗⲉⲉⲧ
  choice: 新娘
  rationale: 阴性冠词支持“新娘”；现代汉语中“新娘”比“被许配的女子”更简洁，也能维持婚姻意象。
- source_word: ⲁⲛⲟⲕ
  choice: 我是
  rationale: 反复保留第一人称宣告句式，这是本篇修辞结构的核心。
theological_decisions:
- issue: 性别与亲属身份相互交叠的悖论
  choice: 逐项保留“新娘／新郎”“父亲的母亲／丈夫的姐妹”等并列身份，不作调和
  alternative: 将这些称谓解释为象征性的创造、婚姻或神性关系
  rationale: 原文刻意制造身份张力；译文不应代替文本给出单一教义解释。
