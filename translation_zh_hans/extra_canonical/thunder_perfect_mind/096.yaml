base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/096.yaml
  text: It is not my defense when they call[a], and the injustice you have considered[d][c][b], you leave it to open their mouths to judge me.
translation:
  language: zh_hans
  text: '**12.** 他们呼喊时，这并不是我的申辩[a]；至于你们所思量的不义[b]，你们任由它使他们开口审判我[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一段的开头及“呼喊”之后均有残缺；“这”所指的具体内容无法从现存文字确定。“并不是我的申辩”依现存的否定词和“申辩”重构。
    reason: textual_uncertainty
  - marker: b
    text: 原文 ⲡϫⲓⲛϭⲟⲛⲥ 指“不义、欺压”或“暴行”，不是“数目”。也可译作“你们所考虑的暴行”。
    reason: lexical_alternative
  - marker: c
    text: 末句可较直译为：“你们任它张开他们的口来审判我。”由于抄本残缺，“它”与“他们”的确切所指仍不确定。
    reason: syntactic_uncertainty
lexical_decisions:
- source_word: ⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: 申辩
  rationale: 这是源自希腊语的科普特语借词，指为自己辩护的言辞；“申辩”既保留司法语境，也比“道歉”准确。
- source_word: ⲉⲩϣⲁⲛⲙⲟⲩⲧⲉ (reconstructed from ⲉⲩϣⲁⲛⲙⲟⲩ[)
  choice: 他们呼喊时
  rationale: ⲙⲟⲩⲧⲉ 常指呼叫、称呼；在残缺结构中按第三人称复数条件/时间式译作“他们呼喊时”，但宾语或后续成分已经佚失。
- source_word: ⲡϫⲓⲛϭⲟⲛⲥ
  choice: 不义
  rationale: 这是由 ϭⲟⲛⲥ（施暴、欺压、行不义）形成的动作名词，宜译为“不义”或“暴行”，并非“数目”。本句采用“不义”，以配合申辩、审判的司法语境。
- source_word: ⲉⲓⲙⲟⲉⲓⲛ
  choice: 思量
  rationale: 表示思想、考虑；“思量”保留主动考虑之意，又不把它强化为已经作出的裁决。
- source_word: ⲭⲣⲟⲉⲓ
  choice: 开口
  rationale: 此处与“他们的口”构成开口的表达；译作“使他们开口”比逐字的“打开他们的口”更符合现代汉语。
- source_word: ⲕⲣⲓⲛⲉ
  choice: 审判
  rationale: 希腊语借词，意为判断、审理、审判；上下文涉及申辩，因此采用司法色彩较明确的“审判”。
theological_decisions:
- issue: 不义与审判者之间的关系
  choice: 保留“不义”作为“任由它”的语法指称对象，不说明它如何使人开口
  alternative: 解释为“你们任由那些不义的人开口审判我”
  rationale: 残缺文本的代词关系和句法并不完全确定；不应把“不义”擅自人格化为某一群人，也不应补入原文未明说的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“申辩—不义—审判”保留原文的司法语义场；对残缺处不作顺滑化补写，并用脚注明确代词、句法及重构的不确定性。
