base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/115.yaml
  text: I am the name cried out among those who are dead; and I am the one who is present—alone and in unity. The one who will judge me by the law—
translation:
  language: zh_hans
  text: 我是那在死人中被呼喊的名[a]；我也是那临在者——独自一位，却合而为一[b]。那要按律法审判我的人——[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本OCR作ⲡⲓⲛⲁ；这里依语境推定为ⲡⲓⲣⲁⲛ，意为“那名”。“被呼喊”也可能理解为“被宣告”或“被抛出”。
    reason: 原文读法与词义均有不确定性。
  - marker: b
    text: “独自一位，却合而为一”也可译作“孤一而处于合一之中”；原文把“独自”与“合一”并列，保留了刻意的张力。
    reason: 保留原文悖论及可能的句法差异。
  - marker: c
    text: OCR作ⲛⲉⲗⲟⲥ；这里推定为ⲛⲟⲙⲟⲥ，即希腊借词“律法”。本句在现存节选中未完。
    reason: 说明推定校读及残句状态。
lexical_decisions:
- source_word: (ⲡⲓ)ⲣⲁⲛ（OCR：ⲡⲓⲛⲁ）
  choice: 那……的名
  rationale: OCR很可能漏掉了ⲣ；按语境复原为ⲡⲓⲣⲁⲛ“那名”。中文用“那……的名”保留定指意味，并让后置修饰自然。
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: 被呼喊
  rationale: 该短语既可能表示向外发声，也可能表示被抛出；“被呼喊”保留声音意象，并符合此处修饰“名”的句法。
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: 在死人中
  rationale: ϩⲛ加复数关系形式，直指“在那些死去的人中间”；简洁译作“在死人中”。
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: 那临在者
  rationale: ϣⲟⲟⲡ可指存在或在场；“临在者”突出显现和在场，而不把意义缩减为抽象存在。
- source_word: ⲟⲩⲁⲁⲧ
  choice: 独自一位
  rationale: 表达单独、孤一的状态，并与后面的抽象“合一”形成悖论式并置。
- source_word: ⲙⲛⲧⲟⲩⲁⲁⲧ（OCR：ⲙⲛⲧⲁⲓ）
  choice: 合而为一
  rationale: 按可能的复原读作“合一、一体性”；采用现代中文表达，同时不指定与谁合一。
- source_word: ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ
  choice: 那要……审判我的人
  rationale: 保留ⲛⲁ-的将来意味和明确的施事关系。
- source_word: ϩⲁ ⲡⲓ ⲛⲟⲙⲟⲥ（OCR：ⲛⲉⲗⲟⲥ）
  choice: 按律法
  rationale: 若复原为希腊借词νόμος，则此处具有司法语气；“按律法”自然表达以律法为判断准则。
theological_decisions:
- issue: “独自”与“合一”的关系
  choice: 独自一位，却合而为一
  alternative: 独一，并且是一体
  rationale: 原文将同根的个体状态与抽象的一体性并列，形成有意张力；译文不解释其本体论含义，只以“却”凸显悖论。
- issue: “临在者”的身份
  choice: 保留为称谓“那临在者”
  alternative: 译作“那存在的一位”
  rationale: 不把说话者直接等同于任何特定神学位格；保留诗歌中的自我宣告及开放性。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语，保留反复的“我是”宣告、身份称谓和句末悬置。因底本是低置信度OCR节选，对“名”“律法”及相关短语以脚注明确标示推定，正文不作教派化解释。
