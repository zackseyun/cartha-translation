lexical_decisions:
- source_word: ⲧⲟⲛ / reconstructed hearing formula
  choice: 听我说吧
  rationale: 现存OCR片段与本节的行序对应可信度低；依据经校核的平行句式，采用“听”这一感知义，使“听见的人”与“认识我的人”形成对应。汉语“听我说吧”比孤立的“听我”自然，同时不直接把“听”解释成“顺服”。
- source_word: ϣⲁϫⲉ
  choice: 话
  rationale: 该词可指话语、言辞；在“领会”这一教导语境中，“我的话”自然庄重，也保留可指一番教导或多句话语的集合意义。
- source_word: ⲛ̄ϭⲟⲙ（可能是OCR误读）
  choice: 这些听见的人（正文依校核文本）
  rationale: OCR字形若照录可涉及“有能力、强大”，但既有分节与标准平行句支持“听见的人”。因原始对齐置信度低，不在正文中武断采用“强者”，而在注释中保留异读。
- source_word: ⲥⲙⲏ（OCR作ⲛⲉⲥⲙⲏ）
  choice: 名字（仅注释说明，未收入正文）
  rationale: OCR末尾似有“话和名字”，但很可能跨越本节边界；正文只译可稳妥归于本句的“我的话”。
theological_decisions:
- issue: “听”是否应解释为“顺服”
  choice: 正文译作“听我说”与“听见的人”
  alternative: “听从我，你们这些顺服的人”
  rationale: “听”与“认识”的诗性平行值得保留；若直接译为“顺服”，会把感知、领受与服从之间的张力预先消解。由于底本OCR和分行不稳，另一解释列入脚注。
