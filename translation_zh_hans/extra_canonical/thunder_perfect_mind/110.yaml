  register: 采用现代、庄重而易懂的汉语，并保留诗歌式的呼告和平行结构。“听我说吧”体现直接呼唤；“领会”比单纯“学习”更适合对启示性话语的接收，但不额外加入宗派性解释。所有文本批判上的不确定性均置于脚注，正文保持简洁。
