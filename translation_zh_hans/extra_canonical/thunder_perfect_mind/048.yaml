base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/048.yaml
  text: And you have called me “Lawlessness.” I am she whom you pursued[a]; and I am the one you have seized; I am she whom you scattered[g][f][e][d][c][b], and you have known.
translation:
  language: zh_hans
  text: '你们称我为“无法无天”。

    我就是你们所追逐的那一位；

    我就是你们所抓住的那一位；

    我就是你们所驱散的那一位，而你们已经知道了。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存词形 ⲥⲟⲟⲩⲛ 通常意为“知道”，所以正文照译。也有可能这里原是或应读作 ⲥⲱⲟⲩϩ，意为“聚集”；若如此，末两句可译为：“我就是你们所驱散、又所聚集的那一位。”
    reason: textual_alternative
lexical_decisions:
- source_word: ⲙⲟⲩⲧⲉ
  choice: 称……为
  rationale: 该动词意为“称呼、命名”；此处按现存肯定完成时译出，不采纳与原文不符的否定祈使分析。
- source_word: ⲁⲛⲟⲙⲓⲁ
  choice: 无法无天
  rationale: 这是希腊语 anomia 的科普特语借词，核心义为“不守法律、无视法度”；“无法无天”在现代汉语中自然有力，并保留指控性称号的语气。
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: 追逐
  rationale: ⲡⲱⲧ 与“在她后面”的回指结构表示追赶女性先行词；译成“你们所追逐的”，避免误将 ⲛⲥⲱⲥ 当作“我”的代词。
- source_word: ⲙⲁϩⲧⲉ ⲙⲙⲟⲉⲓ
  choice: 抓住
  rationale: 该动词可表示抓住、掌握或擒获；“抓住”保留动作力度，又不过度限定为正式逮捕。
- source_word: ϫⲟⲟⲩ ⲉⲃⲟⲗ
  choice: 驱散
  rationale: 此处是“送出去、遣散、分散”，不可与表示“呼喊、宣告”的近形动词混同；“驱散”适合此处受事为人的句法。
- source_word: ⲥⲟⲟⲩⲛ
  choice: 知道
  rationale: 按所提供的见证文本直译为“知道”；该词形可能涉及抄本或OCR问题，但不在正文中擅自改成另一动词。
theological_decisions:
- issue: “无法无天”是说话者的自称还是他人加给她的称号
  choice: 保留为听众对说话者的称呼
  alternative: 把它改写成说话者本质上就是“无法无天”
  rationale: 句法是“你们称我为……”，表达他人的标签，不宜将指控转化为说话者对自身本质的神学宣告。
- issue: 末句 ⲥⲟⲟⲩⲛ 的解释
  choice: 按见证文本译为肯定的“你们已经知道了”
  alternative: 依可能的词形讹误校订为“你们聚集了”
  rationale: 现有文本明确呈现肯定完成时的“知道”；尽管“聚集”可与前句“驱散”构成醒目的对偶，证据不足以直接改写正文，故以脚注保存疑问。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语，保留原文反复的“我就是……那一位”结构及女性说话者的身份提示。首句按原文肯定完成时处理；不沿用英文资料中与科普特文本不符的否定读法。
