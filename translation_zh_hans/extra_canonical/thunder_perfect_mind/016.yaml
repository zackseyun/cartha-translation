    reason: lexical_alternative
  - marker: b
    text: 现有OCR字序可表面理解为“我主人的女主人”；通行的《雷霆》文本则读作“我丈夫的姐妹”。
    reason: lexical_alternative
  - marker: c
    text: “后代”也可译作“孩子”或“儿子”；这里用较宽泛的说法，以保留原词可能涵盖的意义。
