  naturalness: “那节期众多的女子”“那位神伟大的女子”在现代汉语中均不够自然，且后一句尤其容易读成“神伟大的女子”。改为“我是那位节期众多的”“我是那位神很伟大的”，能保留宣告体、阴性指称的开放性及原文的关系结构。末句“他们却领受教导”可简化为“他们却在学习”，更符合ϫⲓⲥⲃⲱ的惯用义和中文表达。
  terminology: “神”适宜，不宜改为带有特定宗教指向的“上帝”；“没有神的”可保留，以避免“无神论者”的现代意识形态含义。“节期”可保留，脚注说明亦可译为“庆典”。
