base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/051.yaml
  text: 'And I am she whose festivals are many[a]. I, I am a godless one,

    and I am she whose God is great.

    I am the one you have pondered,

    and you have scorned me.

    I am an unlearned one[f][e][d][c][b],

    and they learn.'
translation:
  language: zh_hans
  text: '我是节期众多的那一位[a]。


    我，我是没有神的那一位，


    我也是那一位，她的神是伟大的[b]。


    我就是你们所思量的那一位，


    你们轻蔑了我。


    我是没有受过教导的，


    他们学习[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 首句的传本文字在所给OCR中讹乱；依通常的文字校正，可读作“我是节期众多的那一位”。“节期”也可译作“庆典”。
    reason: 说明OCR校正及词义选择。
  - marker: b
    text: 所给OCR表面上近似“少女——她的神”；依句法及与上一句平行的结构，通常校正并理解为“那一位，她的神是伟大的”。
    reason: 保留传本文字与校正释读之间的不确定性。
  - marker: c
    text: 原文这一表达字面近于“取得教导”，是“学习、受教”的惯用说法；末尾的方向词未另行直译。
    reason: 说明惯用语及未显译的方向成分。
lexical_decisions:
- source_word: ⲛⲁϣⲉ ⲛⲉⲥϣⲁ（OCR作 ⲧⲉⲛϣⲉⲛⲉⲥⲱⲥ）
  choice: 节期众多
  rationale: 依校正后的常见释读，ⲛⲁϣⲉ 表示“多”，ⲛⲉⲥϣⲁ 表示“她的节期／庆典”；译文保留复数与夸张性的自我宣告。
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: 没有神的
  rationale: ⲁⲧ- 是否定、缺失前缀，ⲛⲟⲩⲧⲉ 是“神”；不用“无神论者”，以免带入现代思想立场，并保留与下一句的悖论。
- source_word: ⲛⲁϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ（OCR作 ⲧⲉⲛϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ）
  choice: 神伟大
  rationale: 按经校正的句法，意为“她的神是伟大的”；以“神”而非“上帝”保留原词在此悖论中的一般性。
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: 思量我／我就是你们所思量的那一位
  rationale: ⲙⲉⲉⲩⲉ 表示思想、考虑；科普特语的回指结构在中文中转换为自然的关系结构。
- source_word: ϣⲟⲥⲧ
  choice: 轻蔑
  rationale: 该词表示蔑视、鄙弃或拒斥，并非“羞愧”；宾语“我”由上下文补足。
- source_word: ⲁⲧⲥⲃⲱ
  choice: 没有受过教导的
  rationale: 由否定前缀 ⲁⲧ- 与“教导”构成；这样可与下一句 ϫⲓⲥⲃⲱ 形成清晰的词根呼应。
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ
  choice: 领受教导
  rationale: 字面是“取得教导”，惯用义为“学习／受教”；译作“领受教导”既自然，也保留与“没有受过教导”的反衬。
theological_decisions:
- issue: “没有神”与“她的神伟大”的悖论
  choice: 并列保留两句，不加解释性调和
  alternative: 把前句解释为“不敬神”，或把后句限定为某一特定神祇
  rationale: 原文刻意以相反的自我陈述形成张力；翻译不应替原文消解这一张力。
- issue: ⲛⲟⲩⲧⲉ 的称谓
  choice: 神
  alternative: 上帝
  rationale: 上下文未明确要求专名式称谓；“神”更能保存“没有神／她的神伟大”的词语对应与语义开放性。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。反复的“我就是／我是”保留宣告体节奏；用“女子”承接阴性说话者，但不误译为“少女”。第二人称复数译作“你们”，末句第三人称复数译作“他们”，不擅自认定两者为同一群体。
