lexical_decisions:
- source_word: (ⲥ)ⲙⲙⲟⲥ ϩⲛ ⲟⲩϣⲱⲥ
  choice: 声音中的静默
  rationale: OCR疑漏ⲥ；恢复为ⲥⲙⲙⲟⲥ可形成“静默／声音”的悖论，并保留ϩⲛ“在……中”的空间关系。
- source_word: ϯⲣⲏⲛⲏ
  choice: 和平
  rationale: 这是希腊语εἰρήνη的借词，与下句“战争”构成直接对照。
- source_word: ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: 战争
  rationale: 希腊语πόλεμος的借词；汉语抽象名词无需机械体现定冠词。
- source_word: ϣⲱⲡⲉ ⲉⲧⲃⲏⲏⲧ
  choice: 因我而生
  rationale: ϣⲱⲡⲉ表示发生或形成，ⲉⲧⲃⲏⲏⲧ表达原因；“而生”兼顾诗性与“成为／发生”的意味。
- source_word: ⲟⲩϣⲙⲙⲱ
  choice: 异乡人
  rationale: 文本读法略有不确定，但与ⲣⲙⲛⲡⲟⲗⲓⲥ相对，宜译为异乡人、外来者一类身份。
- source_word: ⲟⲩⲣⲙⲛⲡⲟⲗⲓⲥ
  choice: 本城的居民
  rationale: 字面为“城里的人”；此译比现代政治意味较强的“公民”更贴近社会身份对举。
- source_word: ⲟⲩⲥⲓⲁ
  choice: 实体
  rationale: 希腊语οὐσία借词；在“有／无实体”的对举中，“实体”比“本质”更自然地保留存在论张力。
- source_word: ⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: 相交
  rationale: 可涵盖交往、共同相处与结合，并在脚注中保留其可能具有的性意味。
- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: 在……之外
  rationale: 该复合介词表示从……外或在……之外，不译作“在……之内”。
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: 都不认识我
  rationale: 按ⲥⲉ-ⲣ-ⲁⲧⲥⲟⲟⲩⲛ分析为“他们处于无知／不认识”，而非使役式“使人认识”。
theological_decisions:
- issue: οὐσία是否应作固定教义术语
  choice: 译作“实体”，不赋予后期三一论或基督论的专门含义
  alternative: 译作“本质”或“存在”
  rationale: 本段以悖论诗句并列“实体”与“没有实体者”；应保存其哲学张力，而不把后期宗派术语体系倒读进文本。
- issue: συνουσία的关系性质
  choice: 正文用含义较开放的“相交”，脚注列明交往、联结及性结合的可能性
  alternative: 明确译作“伴侣关系”“结合”或“性交”
  rationale: 源词语义范围较宽，正文不应擅自排除关系性或性意味，也不应把后者定为唯一解释。
translation_notes:
  register: 采用简体中文现代标准书面语，以短句、复沓和悖论保持神谕式诗歌节奏。“既是……也是……”自然呈现身份对举；“却”突出和平与战争之间的张力。避免古奥文言及后期宗派术语，同时在脚注中交代OCR、分词和希腊借词的真实不确定性。
