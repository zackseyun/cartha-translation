  yaml_path: translation/extra_canonical/thunder_perfect_mind/077.yaml
  text: 'I am the silence within a voice[a].

    I am peace, and because of me war came to be.

    And I am a foreigner and a citizen.

    I am the substance, and the one who has no substance[g][f][e][d][c][b]; those who exist outside my association are ignorant of me.'
translation:
  language: zh_hans
  text: '我是声音中的静默[a]。


    我是和平，战争因我而生。


    我既是异乡人[b]，也是本城的居民。


    我是实体[c]，也是没有实体的那一位；凡在我的相交[d]之外的，都不认识我[e]。


    [a] “静默”：现存OCR作ⲙⲙⲟⲥ，疑脱落词首的ⲥ；按ⲥⲙⲙⲟⲥ理解，即“静默”。原句也可译作“声音中的寂静”。


    [b] “异乡人”：ⲟⲩϣⲙⲙⲱ的读法受文本状况影响，也可译作“陌生人”或“外来者”；这里与“本城的居民”相对。


    [c] “实体”：ⲟⲩⲥⲓⲁ源自希腊语οὐσία，也可译作“本质”或“存在”。


    [d] “相交”：ⲥⲩⲛⲟⲩⲥⲓⲁ源自希腊语συνουσία，可指交往、联结、共同相处，也可能带有结合或性交的意味。


    [e] 本句按“在我的相交之外”及“他们不认识我”理解。由于OCR的分词容易误导，另一种旧读法曾将其理解为“在我的结合之内的人使我被认识”，但这里的科普特语更支持正文译法。'
  philosophy: optimal-equivalence
