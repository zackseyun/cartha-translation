base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/021.yaml
  text: 'Those who deny me confess me[a],

    and those who confess me deny me.

    Those who speak truth about me lie about me[b],

    and those who lie about me speak truth about me.'
translation:
  language: zh_hans
  text: '那些否认我的人，承认我[a]；

    那些承认我的人，否认我。


    那些说关于我的真话的人，说关于我的谎言[b]；

    那些说关于我的谎言的人，说关于我的真话。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段所附的英文参考定位文本为“我是声音多样的嗓音……”，但这里实际提供的科普特文是“否认／承认”的对句，可能是页内分段对应发生了错位；本译文依所给科普特文翻译。
    reason: alignment_note
  - marker: b
    text: 这一对句所据的科普特文 OCR 有若干字形讹误；依上下文及可辨字形，后半可复原为与本译文相应的“那些说关于我的真话的人，说关于我的谎言；那些说关于我的谎言的人，说关于我的真话”。
    reason: textual_note
lexical_decisions:
- source_word: ⲁⲣⲛⲁ
  choice: 否认
  rationale: 该词源自希腊语 ἀρνεῖσθαι；“否认”在现代汉语中既自然，又能与“承认”构成鲜明的悖论性对举。
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: 承认
  rationale: 该希腊语借词可指承认、宣认或供认；此处以“承认”与“否认”直接相对，兼顾宗教或公开宣认的意味和现代可读性。
- source_word: ϫⲉ ⲙⲉ ⲉⲣⲟⲓ
  choice: 说我真相
  rationale: 字面关系近于“关于我说真实的话”。译作“说我真相”简洁保留对象关系，并与后文“说我谎话”形成对称。
- source_word: ϫⲓϭⲟⲗ ⲉⲣⲟⲓ
  choice: 说了关于我的谎话
  rationale: ϫⲓϭⲟⲗ 表示说谎；保留“关于我”的关系，以免误解为仅仅向说话者撒谎。
- source_word: ⲛⲉⲧ–
  choice: 那些……的人
  rationale: 这是引出实体化关系从句的关系限定形式；“那些……的人”最自然地保留复数泛指。
- source_word: ⲙ̄ⲙⲟⲉⲓ
  choice: 我
  rationale: 第一人称单数宾语形式，汉语直接译作“我”。
theological_decisions:
- issue: 否认与承认、真话与谎话的悖论
  choice: 不解释其悖论，按对举形式直译，并用“反而／反倒”显明逆转关系
  alternative: 将其解释为某些人的否认实际上构成承认，或把真话／谎话限定为特定神学意义
  rationale: 原文刻意维持张力，没有说明悖论如何成立；译文不应替原文加入宗派性或私人化解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。四行保持原文平行、反转的修辞结构；以“承认”而非较宗教化的“宣认”，避免无根据地缩窄语义。所有脚注标记均置于正文相应位置。
