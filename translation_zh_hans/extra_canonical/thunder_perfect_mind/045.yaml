base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/045.yaml
  text: 'Greeks and barbarians[a],

    I am the one whose image is great in Egypt,

    and the one who has no image among the barbarians.

    I am she whom they hated in every place[d][c][b],

    and she whom they loved.'
translation:
  language: zh_hans
  text: '希腊人和外族人[a]，


    我是在埃及形象显赫的那一位[b]，


    也是在外族人中没有形象的那一位。


    我是在各处受人憎恨的那一位[c]，


    也是受人爱戴的那一位。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族人”原文为希腊语借词，在与“希腊人”的传统对举中，通常指非希腊人或不说希腊语的人；旧译常作“野蛮人”。
    reason: 说明古代族群对举，避免将该历史称谓简单理解为现代道德贬称。
  - marker: b
    text: “形象显赫”也可译作“形象众多”；原文ⲛⲁϣⲉ容许这两种相近理解。“形象”对应ⲉⲓⲛⲉ，并非“静默”。
    reason: 保留ⲛⲁϣⲉ的词义幅度，并明确与此前由连写和误分词引起的“静默”误读有别。
  - marker: c
    text: “在各处”也可能理解为“在众人中”；本译按常见短语ϩⲛ ⲙⲁ ⲛⲓⲙ，即“在每一个地方”处理。
    reason: 说明OCR连写形式ϩⲛⲙⲁⲛⲓⲙ的切分及较次要的替代解释。
lexical_decisions:
- source_word: ⲉⲗⲗⲏⲛ
  choice: 希腊人
  rationale: 这是源自希腊语的族称，与ⲃⲁⲣⲃⲁⲣⲟⲥ构成传统对举；用现代汉语常用名称最为清楚。
- source_word: ⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: 外族人
  rationale: 该词在“希腊人／非希腊人”的传统对举中泛指不说希腊语的外族人；避免用现代汉语中贬义过强的“野蛮人”。
- source_word: ⲉⲓⲛⲉ
  choice: 形象
  rationale: 此处是“形象、样式”，不是ⲥⲉⲓⲛⲉ“静默”；同一词在相邻两行重复，译文也予以重复。
- source_word: ⲛⲁϣⲉ ⲡⲉⲥⲉⲓⲛⲉ
  choice: 形象众多
  rationale: ⲛⲁϣⲉ可表达“多、众多”，此译与下一行“没有形象”形成鲜明悖论；“形象伟大”也是语义上可能的理解。
- source_word: ϩⲛ ⲕⲏⲙⲉ
  choice: 在埃及
  rationale: ⲕⲏⲙⲉ是埃及的科普特语名称，直接译出现代地名。
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ
  choice: 遭人憎恨的
  rationale: 按与下一句“爱慕”相反的意义理解为“他们憎恨她”；汉语被动式自然保留了女性说话者作为承受者的关系。
- source_word: ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: 蒙人爱慕的
  rationale: 与“遭人憎恨”平行；“爱慕”兼具爱与珍视之意，适合庄重诗体。
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: 在各处
  rationale: 按常见短语“在每一个地方”理解，修饰“遭人憎恨”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可朗读的自由诗语体。重复“我就是那……也是那……”以再现科普特文阴性自我指认结构ⲁⲛⲟⲕ ⲧⲉ及其平行节奏；汉语不标语法性别，但上下文中的女性声音不另加解释性称谓。开头“希腊人和外族人”在所给摘录中是悬置片语，译文保留其断片性质，不擅自补入谓语。
