  text: '**4.** 我是妻子，也是处女[a][b][c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特语ⲥϩⲓⲙⲉ既可译作“女人”，也可译作“妻子”。这里译作“妻子”，使它与“处女”之间的悖论更鲜明；“女人”仍是可能的译法。
    reason: lexical_alternative
  - marker: b
    text: ⲡⲁⲣⲑⲉⲛⲟⲥ是源自希腊语的借词，通常译作“处女”；在诗歌语体中也可译作“少女”。
    reason: lexical_alternative
  - marker: c
    text: 在OCR文本中，ⲡⲁⲣⲑⲉⲛⲟⲥ一词恰好跨行断开（ⲡⲁⲣ｜ⲑⲉⲛⲟⲥ），因此本段边界的对齐把握度有所降低。
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: 我是
  rationale: 保留诗中反复出现的第一人称判断句节奏，不将其淡化为其他表达。
- source_word: ⲧⲉⲥϩⲓⲙⲉ
  choice: 妻子
  rationale: ⲥϩⲓⲙⲉ既可指“女人”，也可指“妻子”；此处与“处女”并列，“妻子”更能保留原文刻意形成的悖论张力。
- source_word: ⲁⲩⲱ
  choice: 也是
  rationale: 原词是普通并列连词；汉语用“也是”既保持并列关系，也使反复的身份宣告自然流畅。
- source_word: ⲧⲡⲁⲣⲑⲉⲛⲟⲥ
  choice: 处女
  rationale: 这是源自希腊语的借词，通常指处女；该译法准确保留它与“妻子”之间的强烈反差。
theological_decisions:
- issue: “妻子”与“处女”并列所形成的身份悖论
  choice: 直接保留两项并列，不作调和或象征性解释
  alternative: 将“妻子”译为较中性的“女人”，或在正文中解释为不同层面的身份
  rationale: 原文以对立身份并置制造张力；译文不应替读者消解其文学或神学上的开放性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“我是……也是……”保留原文第一人称宣告的节奏；不以解释性措辞消除“妻子／处女”的有意张力。
