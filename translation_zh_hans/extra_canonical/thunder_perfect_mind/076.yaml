  text: and the one they despise in scorn[a]. I am peace[c][b], and because of me war has come to be.
translation:
  language: zh_hans
  text: 也是他们以轻蔑相待的那一位。[a]我就是和平，而战争因我而产生。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段所给科普特文从一个残缺词尾开始，随后以“和／也”承接上文；这里用“也”表示其延续关系。
    reason: alignment_note
  - marker: b
    text: “产生”所译的动词也可译作“发生”“出现”或“形成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ ϩⲛ ⲟⲩϣⲱϣ
  choice: 他们以轻蔑相待的那一位
  rationale: 将阴性关系结构译为“那一位”，并以“以轻蔑相待”同时表达“鄙视”这一动作及其轻蔑方式；保留说话者的女性语法指向，而不额外指定身份。
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: 我就是
  rationale: 保留诗中反复出现的第一人称自我宣告形式；“就是”自然体现表语认同。
- source_word: ϯⲣⲏⲛⲏ
  choice: 和平
  rationale: 该希腊语借词的通常意义是“和平”，并与下文“战争”构成明确悖论。
- source_word: ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: 战争
  rationale: 采用该希腊语借词在此处最直接的普通含义，与“和平”形成对举。
- source_word: ϣⲱⲡⲉ
  choice: 产生
  rationale: 表达“成为、发生、出现”的生成意味，而不把它弱化为单纯事件描述。
- source_word: ⲉⲧⲃⲏⲏⲧ
  choice: 因我
  rationale: 直接保留原文明确的原因关系，也是本句悖论的核心。
theological_decisions:
- issue: 和平与战争之间的因果悖论
  choice: 我就是和平，而战争因我而产生
  alternative: 我就是和平，战争却因我而发生
  rationale: 不解释说话者如何既是和平又成为战争产生的原因，也不将因果改写为目的、许可或间接后果；“而”保持并列中的张力，避免加入原文没有的强转折。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“以轻蔑相待”避免生硬重复“轻蔑地鄙视”；“我就是和平”保持宣告式节奏；不补入原文没有的强烈转折或神学解释。
