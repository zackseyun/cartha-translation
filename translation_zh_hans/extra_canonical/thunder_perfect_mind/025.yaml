  yaml_path: translation/extra_canonical/thunder_perfect_mind/025.yaml
  text: 'The shame and the boldness[a].

    I am shameless; I am ashamed.

    I am hard, and I am trembling.

    I am the war and the peace; within me they are.

    I am she[g][f][e][d][c][b]; heed me.'
translation:
  language: zh_hans
  text: '羞耻与坦然直言[a]。


    我无耻，也知羞耻。


    我刚强，也战栗。


    我就是战争，也是和平。


    要留心听我。


    我是那受羞辱的……[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坦然直言”所译的词也可译作“放胆发言”“公开直言”或“无所顾忌”。
    reason: lexical_alternative
  - marker: b
    text: 原文摘录在此处中断，末词的OCR辨读也不稳定；“受羞辱的”为暂译，后文原可能继续与另一身份形成对举。
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡϣⲓⲡⲉ
  choice: 羞耻
  rationale: ϣⲓⲡⲉ在此意为“羞耻”，并由下文带否定前缀的ⲁⲧϣⲓⲡⲉ得到印证；不采用早先误释的“沉默”。
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: 坦然直言
  rationale: 这是希腊语παρρησία的科普特语借词，兼有坦然、无所顾忌地公开说话之意；“坦然直言”既保留言说维度，也与“羞耻”形成张力。
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ
  choice: 无耻
  rationale: 由否定前缀ⲁⲧ-加“羞耻”构成，直指“不知羞耻、无耻”。
- source_word: ⲟⲩϫⲓⲡⲏⲧ
  choice: 知羞耻
  rationale: 现有OCR词形可疑；依上下文的对偶结构，最可能是表示“感到羞耻”的词形误识。中文用“知羞耻”与“无耻”构成自然而鲜明的悖论。
- source_word: ⲟⲩⲛⲁϣⲧⲉ
  choice: 刚强
  rationale: ⲛⲁϣⲧⲉ表示强、坚硬或刚强；在人格自述中译作“刚强”比“坚硬”自然。
- source_word: ⲟⲩⲣⲙⲧⲉ
  choice: 战栗
  rationale: OCR很可能讹识了表示颤抖、惊惧的词；结合与“刚强”的悖论式配对，译作“战栗”，同时以脚注说明文本问题。
- source_word: ⲡⲟⲗⲉⲙⲟⲥ
  choice: 战争
  rationale: 希腊语πόλεμος的借词，通常意为战争，与下文“和平”直接对举。
- source_word: ϯⲣⲏⲛⲏ
  choice: 和平
  rationale: 希腊语εἰρήνη的借词，通常意为和平。
- source_word: ϯ ϩⲧⲏⲧⲛ ⲉⲣⲟⲉⲓ
  choice: 要留心听我
  rationale: OCR连写为ⲧⲓϩⲧⲏⲧⲛⲉⲣⲟⲉⲓ；按科普特语惯用结构应是“把你们的心意转向我／留心我”。“要留心听我”符合本篇反复出现的召唤语气。
- source_word: ⲧⲣⲁⲉⲓⲏⲟⲩ
  choice: 那受羞辱的
  rationale: 末词OCR与分行均不稳定；据可辨词形和作品中的已知对偶，暂译为“受羞辱的”，并保留原摘录在此中断的状态。
theological_decisions:
- issue: 说话者同时宣称彼此对立的身份与状态
  choice: 逐项保留“无耻／知羞耻、刚强／战栗、战争／和平”的悖论
  alternative: 将这些对立解释成不同时间、不同关系或不同群体眼中的状态
  rationale: 原文以并列自称制造神学和修辞张力，并未说明如何调和；译文不替原作者消解这种含混。
- issue: “战争与和平”的系词和冠词
  choice: 译为“我就是战争，也是和平”
  alternative: 译为“我带来战争与和平”
  rationale: 原文是身份断言，不是因果或施行陈述；避免加入“带来”等原文没有的神学解释。
translation_notes:
  register: 采用简体中文现代书面语，保持诗性、庄重和短句节奏。以“我……”反复起句，重现原文宣告式结构；不把悖论改写成解释句。对明显的OCR讹误依词法、句法和对偶结构谨慎校正，并在无法确定处加注，不伪造确定性。
