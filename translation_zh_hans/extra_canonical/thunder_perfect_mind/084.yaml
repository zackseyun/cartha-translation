  yaml_path: translation/extra_canonical/thunder_perfect_mind/084.yaml
  text: '...is the one who sees what comes before me[A]. I am the light.

    I have not gone out — I, I —.B

    a non-darkness and the root of darkness is from within me.

    I am the desire of a vision,

    and the self-control of the heart that exists within me[d][c][b][a][E][D][C][B],

    I am the hearing that is acceptable to everyone.'
translation:
  language: zh_hans
  text: '……是那看见来到我面前之事的人[a]。


    我是光。


    我没有出去[b]——我，我——


    我是无暗，


    黑暗的根出自我里面。


    我是对异象的渴望，


    也是我里面的心的自制；


    我是人人都能接受的听觉。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段开头是承接上文的残句。所附对读文本预期此处为“远／近”的悖论，但现有科普特文摘录实际是光、黑暗和感知能力的宣告；本译从现有原文，暂不据对读文本改写。
    reason: alignment_note
  - marker: b
    text: ⲙⲡⲕⲱ ⲉⲃⲟⲗ 的读法不确定，也可理解为禁止式“不要出去”。这里依上下文连续的第一人称宣告译作“我没有出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁⲩ ⲉⲧⲛⲏⲟⲩ ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: 那看见来到我面前之事的
  rationale: 按残句结构保留“看见者”与“正在来到”的空间意象；开头缺失，故以省略号标明文本承接不全。
- source_word: ⲫⲱⲧ
  choice: 光
  rationale: 采用简洁、庄重的光明意象，并与下文“无暗者／黑暗”形成对照。
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: 我没有出去
  rationale: 依连续的第一人称宣告作陈述式理解，但该短语的形式和语义均有疑难，另以脚注保留其他可能。
- source_word: ⲟⲩⲁⲧⲛⲟⲕⲉ
  choice: 无暗者
  rationale: 保留否定构词所造成的刻意悖论，不将它顺滑地改写成普通的“光明”。
- source_word: ⲧⲛⲟⲩⲛⲉ ⲙⲡⲛⲟⲕⲉ
  choice: 黑暗的根
  rationale: 将ⲧⲛⲟⲩⲛⲉ辨作“根”，并按属格结构与“黑暗”连读。
- source_word: ⲟⲩⲉⲃⲟⲗ ⲛϩⲏⲧ ⲧⲉ
  choice: 从我里面生出
  rationale: 按“源自／出自我里面”表达来源关系；补入“生出”使现代汉语自然，同时不消解悖论。
- source_word: ⲧⲉⲡⲓⲑⲩⲙⲓⲁ ⲛⲟⲩϩⲟⲣⲁⲥⲓⲥ
  choice: 对异象的渴望
  rationale: 把ⲛⲟⲩ分析为属格标记加不定冠词，而非希腊语νοῦς“心智”；“异象”保留视觉经验可能带有的超常意味。
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ ⲙⲫⲏⲧ ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ
  choice: 我里面那颗心的自制
  rationale: 把“心”与“自制”按属格相连，并把“在里面”理解为“在我里面”，避免误接到前面的“异象”。
- source_word: ⲡⲥⲱⲧⲙ ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ
  choice: 人人都能接受的听闻
  rationale: 把ϣⲏⲡ理解为“被接受／可接受”，把ⲛⲟⲩⲟⲛ理解为“对人人”；“听闻”保留名词化的听觉活动。
theological_decisions:
- issue: 光、无暗与黑暗之根同出于说话者的悖论
  choice: 直译并列，不作善恶二元论或神学调和
  alternative: 将“黑暗的根”解释为被说话者支配、消灭或照亮的黑暗
  rationale: 原文故意把相反属性集中于第一人称说话者；译文应保留这种张力，不替文本建立教义体系。
- issue: “异象”与“心的自制”的关系
  choice: 按语法分别作为两个第一人称谓语并列
  alternative: 将“心”修饰“异象”，或把整句解释成单一灵性能力
  rationale: 属格结构较支持“心的自制”，并列处理也更符合本篇连续的“我是”宣告。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；以短行保留连续“我是”宣告的诗性节奏。对“无暗者”“黑暗的根”等反常搭配不作平滑处理，以保存原作的悖论修辞。
