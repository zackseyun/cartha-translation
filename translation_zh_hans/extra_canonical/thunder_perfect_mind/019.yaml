base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/019.yaml
  text: I am the voice whose sound is manifold[a], and the word whose appearance is manifold. I am the utterance of my name. Why, you who hate me, do you love me[g][f][e][d][c][b], and hate those who love me?
translation:
  language: zh_hans
  text: '我是那声音，声响繁多[a]；

    我是那“道”，显现繁多[b]。


    我是我名的话语[c]。


    你们这些恨我的人，为什么爱我，

    却恨那些爱我的人？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “繁多”也可译作“多种多样”或“变化万千”。此处指声音所发出的声响具有多样性。
    reason: lexical_alternative
  - marker: b
    text: “道”译自希腊借词 logos；也可译作“话语”，或音译为“逻各斯”。“显现”也可译作“样貌”或“形态”。此译法仅保留该词的术语性回响，并不预设特定的神学或哲学解释。
    reason: lexical_alternative
  - marker: c
    text: “我名的话语”保留原文简约的属格关系；也可能理解为“说出我名字的话”或“以我名字发出的言语”。
    reason: ambiguity
lexical_decisions:
- source_word: ⲧⲉⲥⲙⲏ
  choice: 那声音
  rationale: ⲥⲙⲏ通常指“声音”；冠词随第一人称阴性说话者构成表语。
- source_word: ⲉⲧⲉⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: 它的声响变化万千
  rationale: 按校订所指的结构理解为声音繁多、 manifold；用“变化万千”自然表达多样性，同时保留声响意象。
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: “道”
  rationale: 希腊借词 logos 兼有“话语、言说、道”等含义；正文采用“道”以保留哲学和神学回响，并用引号提示其术语性质。
- source_word: ⲉⲧⲉ ⲛⲁϣⲉ ⲡⲉϥⲉⲓⲛⲉ
  choice: 它的形态变化万千
  rationale: ⲉⲓⲛⲉ在此指外观、形态；整句与前一分句平行，表达形态繁多。
- source_word: ⲡϣⲁϫⲉ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: 我名字的言语
  rationale: ⲡϣⲁϫⲉ可指话语、言语或发言；译作“言语”既区别于 logos 的“道”，又保留“名字所发之言／关于名字的话语”的属格歧义。
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: 为什么
  rationale: 固定疑问表达，意为“为什么”，不应译作因果性的“因为”。
- source_word: ⲙⲟⲥⲧⲉ / ⲙⲉ
  choice: 恨／爱
  rationale: 保留原文尖锐而反常的爱恨对照。
theological_decisions:
- issue: ⲡⲗⲟⲅⲟⲥ 的神学和哲学含义
  choice: 译作“道”并加引号
  alternative: 话语／言辞／逻各斯
  rationale: “道”在现代汉语宗教语境中能承载 Logos 的术语回响，但原文未明确要求将其等同于某一特定基督论身份，因此不作额外解释。
- issue: “我名字的言语”的属格关系
  choice: 保留紧缩而开放的表达
  alternative: 说出我名字的话／以我名字发出的言语／关于我名字的话
  rationale: 科普特语属格结构容许不止一种关系；直译式表达避免替原文消除歧义。
- issue: 爱与恨的悖论
  choice: 保留直接质问
  alternative: 把“恨”弱化为拒绝或厌弃
  rationale: 原文有意维持对立和张力，不应以解释性措辞缓和。
translation_notes:
  register: 采用现代、庄重而可诵读的汉语；以短行保留宣告和质问的节奏。首句残留的OCR片段很可能属于前文，未据其构造“杖、青春、年老”等意义。所有脚注标记均置于相应正文之后。
