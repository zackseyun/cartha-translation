- source_word: ⲁⲩⲱ
  choice: （句间承接）
  rationale: 通常意为“并且、又”；为使残缺的中文句子自然，以句号承接，没有强行补出逻辑关系。
- source_word: ⲙⲛⲧⲁⲓ ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ
  choice: 没有人会……审判我
  rationale: ⲙⲛⲧⲁⲓ 表示“我没有”，后接将来关系结构“那将要审判我的人”；中文自然表达为“没有人会审判我”。
- source_word: ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ
  choice: 会……审判的人
  rationale: 由将来标记 ⲛⲁ- 与希腊语借词 κρίνειν 构成，保留将来或预期意味。
- source_word: ⲛⲟⲙⲟⲥ（OCR作 ⲛⲉⲗⲟⲥ）
  choice: 律法
  rationale: 若校读为希腊语借词 νόμος，基本义为“法律、律法”；但OCR字形和周围句法均不稳定。
- source_word: ϩⲛ ϩⲉⲛⲛⲟⲃⲉ ⲉⲛⲁϣⲱ
  choice: 身陷许多罪中
  rationale: 直义为“在许多罪中”；“身陷”在中文中保留处境性而不额外界定罪责来源。
- source_word: ϩⲁⲭⲉⲓⲛ
  choice: ……
  rationale: OCR形式无法可靠辨认，可能涉及羞耻、夸耀或其他希腊语借词；不凭猜测确定词义。
theological_decisions:
- issue: 是否采用“顺从我，你们这些顺从的人；接纳我”这一劝诫读法
  choice: 不采用；按现存OCR片段译为“要独自一人”，并保留后文审判、律法和罪的残句
  alternative: “要顺从，你们这些顺从的人；接纳我。”
  rationale: 所给科普特语可见文本明确含有 ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ（将要审判的人）、疑似 ⲛⲟⲙⲟⲥ（律法）和 ⲛⲟⲃⲉ（罪），却没有足以支持“你们这些顺从的人；接纳我”的对应词序。不能让低置信度的咨询层取代源语证据。
- issue: 是否把残缺的司法语句整理成完整神学命题
  choice: 保留残缺与不确定性
  alternative: 补足为关于律法审判罪人的完整陈述
  rationale: OCR处于页边且映射置信度低，关键动词 ϩⲁⲭⲉⲓⲛ 未能确定；补足会制造原证据没有明确表达的神学判断。
translation_notes:
