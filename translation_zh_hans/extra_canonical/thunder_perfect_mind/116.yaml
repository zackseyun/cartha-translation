lexical_decisions:
- source_word: ϣⲟⲟⲡ
  choice: 要……
  rationale: 该动词表示“存在、成为”；这里按祈使语气译为劝告性的“要……”。
- source_word: ⲟⲩⲁⲁⲧ
  choice: 独自一人
