  register: 采用现代、庄重而可朗读的简体中文。专名以音译保留；宇宙论称号尽量直译，并以引号提示“道”“人”“寂静”“圆满界”等技术性或人格化用法。抄本残缺以中文方括号形式保留；裸露的抄本页码不纳入正文。由于科普特语原文复核尚待完成，本稿严格依据所给公共领域英译见证起草，不把不确定的性别、实体关系或宇宙论层级擅自解释清楚。
