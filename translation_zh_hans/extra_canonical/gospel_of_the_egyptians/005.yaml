translation:
  language: zh_hans
  text: '〔……〕大光之云〔从〕那〔地方显现出来〕：她是活的能力，是那些神圣、不可毁灭者之母，是大能者米罗托埃。她生下了那一位；我三次发声，称说他的名：[a]


    伊恩


    伊恩


    埃阿


    埃阿


    埃阿。


    因为这一位就是阿达玛斯，那发光的光。他出自“人”，即“太初之人”；万有都借着他、为着他而产生，离了他，没有一样得以产生。那不可知、不可领会的父发出，并从上方降下，要消除那缺陷。


    随后，伟大的“道”、自生的神与不可毁灭的“人”阿达玛斯彼此合一。“人的道”由此产生，而“人”则借着一次言说而产生。[b] 他向以下诸位献上赞美：


    伟大、不可见、不可领会的童贞之灵，


    男性童贞者，


    三重男性的孩子，


    〔……〕以及男性〔童贞者〕尤埃尔，


    光辉的守护者埃塞费赫，


    孩子之子，


    其荣耀之冠，


    伟大的多克索墨冬永世，[c]


    其中的宝座，


    环绕它的众能力，


    众荣耀，


    众不可毁灭者，


    以及他们那整个“圆满界”——就是我先前提到的；[d]


    还有空中之地、承受神者；在那里，大光的神圣之人获得一个形像——他们是那位父的人，属于无声而活着的“寂静”；


    以及那位父和他们整个的“圆满界”，就是我先前提到的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处抄本有残缺；“三次发声”与随后保存的五行音节（“伊恩”两次、“埃阿”三次）之间的确切关系不清楚。
    reason: 说明文本损坏及计数上的真实歧义，避免替原文强行协调。
  - marker: b
    text: “道”与“言说”在这里彼此相关，却不完全相同；原文先称人格化的 Logos，后说一次发声或言说的行动。
    reason: 帮助读者看见原文术语层次，而不消除其神学张力。
  - marker: c
    text: “永世”在本文中可指一个超越时间的实体、领域或秩序；此处没有把含义限定为普通的年代。
    reason: 交代 aeon 的技术性和多义性。
  - marker: d
    text: “圆满界”译自表示“圆满、全体”的技术性称呼，指一组神圣实体或其整体领域；具体边界在此段并不明确。
    reason: 解释术语而不导入宗派化体系。
lexical_decisions:
- source_word: Logos
  choice: “道”
  rationale: 保留其作为人格化、宇宙论实体的技术含义，并以引号提示此处不是普通的“话语”；后文“借着一次言说”则译出 speech 的动作意义，以维持原文区分。
- source_word: Adamas
  choice: 阿达玛斯
  rationale: 按专名音译，不直接等同或简化为《创世记》中的“亚当”，以免消除本文独特的神话角色。
- source_word: Fullness
  choice: “圆满界”
  rationale: 译出诺斯替宇宙论中的整体领域含义；加引号表明这是技术用语，而非普通的“充满”。
- source_word: aeon
  choice: 永世
  rationale: 保留其可指永恒实体或宇宙领域的古代宗教含义，不单纯处理为时间上的“时代”。
- source_word: virginal Spirit / male virgin
  choice: 童贞之灵／男性童贞者
  rationale: 直译并保留文本刻意并置的性别张力，不将其和谐化。
- source_word: triple-male child
  choice: 三重男性的孩子
  rationale: 保留罕见复合称号及其不透明性，避免以解释性神学术语代替。
- source_word: receiver of God
  choice: 承受神者
  rationale: 保留其可能表示接纳、容纳或领受神的多义性。
- source_word: deficiency
  choice: 缺陷
  rationale: 保留宇宙论上“不足、亏缺”的抽象意义，不擅自指定某一罪论解释。
theological_decisions:
- issue: 万有与阿达玛斯的关系
  choice: “万有都借着他、为着他而产生”
  alternative: “万有都是由他并因他而造”
  rationale: 保留 through whom 与 for whom 的双重关系，同时避免擅自把 came into being 全部改写成特定创造论措辞。
- issue: 父的发出与下降
  choice: “那不可知、不可领会的父发出，并从上方降下”
  alternative: “父从自身流溢并降临”
  rationale: “发出”保留 proceeded 的开放性，不明确规定其为某套流溢论体系。
- issue: 道、神与人的合一
  choice: “彼此合一”
  alternative: “融合成一个存在”
  rationale: 原文关系可理解为联合或混合；“合一”保留亲密结合而不武断断言位格消失。
- issue: 人的产生方式
  choice: “‘人’则借着一次言说而产生”
  alternative: “人由道而生”
  rationale: 原文区分 Logos 与 act of speech；译文维持这一区分及句间张力。
- issue: “寂静”的人格化可能性
  choice: “无声而活着的‘寂静’”
  alternative: “沉默而永生的静默状态”
  rationale: 大写概念很可能是人格化实体；加引号保留这一可能，同时不作过度断定。
