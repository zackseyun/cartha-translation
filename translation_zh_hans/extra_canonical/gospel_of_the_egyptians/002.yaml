translation:
  language: zh_hans
  text: '三种权能从他而出，就是父、母、子；它们从永活的寂静而出，而这寂静从不能朽坏的父而出。它们从不可知之父的寂静[而出]；多梅顿·多克索梅顿[a]也从那里[而]出，他是[众永世的]永世，也是它们各自权能的[光]。这样，子第[四个]而出，母[第五个，父]第六个。


    他虽[未被察觉]，却也未被宣告。[他就是]那位在一切[权能]、荣耀和[不朽者]之中不可表征的。


    三种权能从那里[而]出，……三个八元体[b]；[父]在寂静中，连同先虑，从自己怀中[生出]它们，就是父、母、子。


    <第一>个八元体；三重为男的孩子[c]因它而出。它就是：


    思想，

    道，

    不朽，

    永恒的[生命]，

    意愿，

    心智，

    预知，

    兼具男女的父。


    第二个八元权能：


    母，

    童贞女巴尔贝洛，

    埃皮提提奥赫[……]艾，

    监管天界的梅梅内艾门，

    卡尔布[……]，

    超越解释的权能，

    不可言说的母。


    [她]自[生……]。她出来了。[她]与无声[寂静的]父一致。


    第三个八元[权能]：


    [无声寂静的]子，

    无声寂静的冠冕，

    [父]的荣耀，

    以及[母]的德能。


    [他]从怀中生出大光的七种权能，就是七个声音；它们完满时便成为言语。


    这就是三种[权能]，三个八元体；父借着他的先虑，从自己怀中[生出]它们。他在那里生出了它们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多梅顿·多克索梅顿”是专名 Domedon Doxomedon 的暂定音译；其准确科普特语形式及词源仍待源语复核。
    reason: 避免把尚未核验的专名词源当作确定意义译出。
  - marker: b
    text: “八元体”译自 Ogdoad，指由八项构成的一组或整体。现存文字有残缺，后面各组可见的项目数并不都完整。
    reason: 解释少见术语，并说明名单数目与名称之间表面不一致的文本原因。
  - marker: c
    text: “三重为男的孩子”直译见证文本中的复合称谓 triple-male child；具体含义与形式仍待科普特语原文复核。
    reason: 标明这一晦涩称号的暂定性质，避免过度解释。
lexical_decisions:
- source_word: powers
  choice: 权能
  rationale: 兼顾“能力、势力、具位格的神圣力量”等可能含义，不把这些实体简化为抽象的“能力”或固定解释为某类天使。
- source_word: Silence
  choice: 寂静
  rationale: 保留此词作为宇宙论实体或称号的可能性；在“silent Silence”中译作“无声寂静”，保留原文重复造成的庄严与陌生感。
- source_word: aeon
  choice: 永世
  rationale: 此处可能兼指永恒时段与超越性实体；“永世”较“时代”更能保留两者张力。
- source_word: Ogdoad
  choice: 八元体
  rationale: 表达由八项构成的整体，同时避免只译作“八个”而丢失其术语性质。
- source_word: Logos
  choice: 道
  rationale: 在汉语宗教文献中简洁而有尊严，也可涵盖话语、理则等语义；不在正文中限定其与其他文献中“道”的关系。
- source_word: Providence
  choice: 先虑
  rationale: 与后文“Precognition（预知）”作出区分，并保留预先筹思、安排的含义，避免“护理”在现代汉语中的误解。
- source_word: Precognition
  choice: 预知
  rationale: 直译事先知道，与“先虑”所含的筹思或安排相区别。
- source_word: androgynous
  choice: 兼具男女的
  rationale: 用普通现代汉语传达两性兼具，不引入现代身份分类，也不削弱原文的宇宙论称号性质。
- source_word: lap
  choice: 怀中
  rationale: 保留生出与亲密来源的身体意象，而不武断确定具体生理过程。
- source_word: virtue
  choice: 德能
  rationale: 兼顾德性与效力两层可能意义；单译“美德”会过度道德化。
theological_decisions:
- issue: 父、母、子三种权能与其来源之间的关系
  choice: 保留“从他而出”与“从永活的寂静而出”并列出现
  alternative: 将“他”明确等同于不能朽坏的父，或把寂静解释为单纯的媒介
  rationale: 见证文本的句法和宇宙论层级并不完全明朗，不在译文中替读者消解这种张力。
- issue: “多梅顿·多克索梅顿”的身份
  choice: 音译专名，并保留其后“众永世的永世”的称谓
  alternative: 按可能的词源意译或将其等同于某个已知神格
  rationale: 在科普特语原文尚未复核的情况下，音译最少引入推断。
- issue: “He/She”所指对象
  choice: 按见证文本的性别代词译为“他/她”，但不额外补出姓名
  alternative: 把每一处代词明确改写为父、母、子或巴尔贝洛
  rationale: 若先行确定指代，可能会掩盖残缺文本中真实存在的歧义。
- issue: 三重为男的孩子
  choice: 采用较贴近形式的译法并加注说明其晦涩性
  alternative: 解释为“三倍阳性的孩子”或某一特定神格称号
  rationale: 该复合称谓的确切术语背景有待源语复核，不宜在正文中教义化。
- issue: 残缺与复原
  choice: 保留方括号、尖括号和省略号
  alternative: 将复原文字无标记地并入正文，或补足残缺名单
  rationale: 让读者看见抄本残缺、编者补字及校订所造成的不确定性。
translation_notes:
  register: 采用现代、庄重而可读的简体中文；在宇宙论术语处适度保留原文的陌生感。方括号表示见证文本中的复原或缺损内容，尖括号表示校订性补入，省略号表示无法恢复的缺文。抄本页码已不置入正文。本稿依据所提供的公版英语见证拟定，科普特语源文复核尚待完成，因此专名、复合称谓及若干代词指向均采取审慎的暂译。
