review_pass:
  verdict: revise
  source_fidelity: 整体忠实地保留了英语见证中的宇宙论术语、重复修辞、残缺标记、补字及不确定指代。惟第二段将“由圣言借着圣灵所生”（begotten by the Logos through the holy Spirit）的施事与媒介倒置为“由圣灵、借着圣言所生”，改变了原句关系，须改正。第三段“their number”不宜明确落实为“这些永世的数目”；改作“其数目”以保留英语见证中可能的先行词含混。
  naturalness: 庄重书面语总体通顺。“父借着这喜悦，喜悦”虽刻意重复，符合见证的重复表达。第五段“借着众先知和守望者而有的人”略显生硬，改为“借着众先知和守望者而成的族类中的人”较自然，且更贴近括注“that came into being”。
  terminology: “永世”“族类”“种子”“统治者”“守望者”“圆满”等选择前后一致，并适当地以注释保留术语弹性。Logos仍译“圣言”，但须在正文中恢复其作为“生出”之施事、圣灵作为媒介的句法。人名和神圣称号宜照现有音译及保留方式处理。
  issues:
  - severity: high
    issue: “一个由圣灵、借着圣言所生的神圣器皿”倒置了 Logos 与圣灵的关系。
    rationale: 英语见证为“a sacred vessel begotten by the Logos through the holy Spirit”，即器皿由 Logos（圣言）借着 holy Spirit（圣灵）所生。现译使圣灵成为施事、圣言成为媒介，改变源文句法和神学表述。
  - severity: medium
    issue: “这些永世的数目”将“their number”的所指确定为诸永世。
    rationale: 英语见证中复数代词的先行词未获明确说明；在种子与诸永世相邻的复杂句法中，直接指定为“这些永世”会缩窄原有含混。宜译“其数目”。
  - severity: low
    issue: “那些借着众先知和守望者而有的人”不够自然。
    rationale: “而有的人”在现代汉语中不顺畅，且未清楚呈现括注所述族类“came into being”的限定。改为“借着众先知和守望者而成的族类中的人”既清楚又不额外解释其机制。
  revised_text: '她照着父的旨意和喜悦，得到了自己的完满和能力。父借着这喜悦，喜悦大塞特那些伟大而有能力之人的伟大、不可毁灭、不动摇的族类，为要把这族类撒种在已经产生的诸永世[a]之中，好借着她补足那缺欠。因为她从上面降到世上，是夜的形像。她出来以后，就为这个永世的统治者的种子，以及从他而出的〈那些〉掌权者祈求——也就是那将被毁灭、产生诸魔之神的污秽（种子）——又为亚当和大塞特那如同太阳的种子〔缺文〕祈求。[b]



    随后，大天使霍尔莫斯来到，要预备大塞特的种子；他借着这个永世污秽撒种（用种子）中的众童女，把种子预备在一个由圣言[c]借着圣灵所生的神圣器皿里。



    随后，大塞特带着他的种子来到，种子便撒在已经产生的诸永世中；其数目与“所多玛”一名的数值相合。[d]有人说，所多玛就是大塞特牧放的地方，也就是蛾摩拉；另有人却说，大塞特把他所栽种的从蛾摩拉移走，栽到另一个地方，并给那地方取名叫所多玛。



    这就是借着埃多克拉而出的族类，因为她一发言，就生出了真理和公义；这族类是永恒生命之种的开端。这生命之种是为那些因认识自己的流出[e]而忍耐到底的人预备的。这就是那伟大、不可毁灭的族类；它经过三个〔缺文〕世界而出，来到这世界。洪水发生，是这永世终结的预像；但它将因这族类而被差到世上。[f]



    烈火将席卷大地；恩典却要临到这族类中的人，就是那些属于借着众先知和守望者而成的族类的人；这些守望者看守这族类的生命。因着这族类，饥荒和瘟疫将要来到；这一切都将因那伟大、不可毁灭的族类而发生。因着这族类，试探也将来到，甚至会有假先知的欺骗。



    随后，大塞特看见了魔鬼的作为：他形形色色的伪装，他谋害那不可毁灭、不动摇之族类的计策，他的权势和天使所施加的逼迫，以及他们那使自己反受其害的谬误。



    随后，大塞特向以下各位献上赞美：



    那伟大、不可称名、童贞的灵，



    男性〔缺文〕童贞者巴贝隆，



    三重男性之子特尔迈勒、特尔迈勒，赫利、赫利，马哈尔、马哈尔，塞特，



    那永活的能力——ALĒTHES ALĒTHŌS，[g]



    男性童贞者尤埃尔，



    荣光的守护者埃塞费克——他荣耀的冠冕，



    伟大的多克索梅顿永世，



    其中的众宝座，



    环绕它们的众能力，



    以及整个圆满[h]，正如我先前所说的。



    他又祈求有守望者看守他的种子。'
