review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实于所给英语见证，并妥善保留残缺符号、括号、专名和多处宇宙论术语。惟第二段将“by means of the virgins”误作霍尔莫斯“借着……童女”施行预备，原句更自然地指大塞特的种子是借这些童女、在圣灵借圣言所生的圣洁器皿中被预备。第四段“through three [] worlds to the world”不宜译为“经过……而出，来到”，应保留“借着/通过三个〔缺文〕世界来到世界”的关系。
  naturalness: 整体庄重、通顺，适合现代书面普通话。个别语序可调整：首句的“照着父的旨意和喜悦”不如“凭着父的旨意和他的喜悦”自然且贴近原文；“父借着这喜悦，喜悦”可改为“他因这喜悦而喜悦”。“所栽种的”可简化为“所种植的”，但不影响原意。
  terminology: “永世”“族类”“种子”“统治者”“守望者”“圆满”等选择一致且审慎。“圣言”配合脚注可接受。人名音译和保留 ALĒTHES ALĒTHŌS 均恰当。“男性〔缺文〕童贞者”及“三重男性之子”保留文本张力，合宜。
  issues:
  - severity: medium
    issue: 第二段施事与方式关系稍有偏移。
    rationale: 见证为“to make ready the seed ... by means of the virgins ... inside a sacred vessel begotten by the Logos through the holy Spirit”。草稿的“他借着……众童女，把种子预备在一个由圣灵、借着圣言所生的……”既将方式短语明确归给霍尔莫斯，也倒置了“Logos through the holy Spirit”的表达。应译为种子“借着……众童女，在一个由圣言借着圣灵所生的神圣器皿中”被预备，仍不额外断定细节。
  - severity: medium
    issue: “through three [] worlds to the world”被译作“经过……而出，来到这世界”。
    rationale: “经过”带出穿越路径及“而出”的额外动作；见证只说该族类“through/借着三个〔缺文〕世界，来到世界”。宜以“借着/通过”保留原有关系及残缺处的不确定性。
  - severity: low
    issue: 首句及相关句式略显重复生硬。
    rationale: “照着……旨意和喜悦”“父借着这喜悦，喜悦”虽可理解，但“凭着父的旨意和他的喜悦；他因这喜悦而喜悦”更符合现代汉语，也更清楚保留 Father 的所有格。
  revised_text: '她凭着父的旨意和他的喜悦，得到了自己的完满和能力。他因这喜悦而喜悦大塞特那些伟大而有能力之人的伟大、不可毁灭、不动摇的族类，为要把这族类撒种在已经产生的诸永世[a]之中，好借着她补足那缺欠。因为她从上面降到世上，是夜的形像。她出来以后，就为这个永世的统治者的种子，以及从他而出的〈那些〉掌权者祈求——也就是那将被毁灭、产生诸魔之神的污秽（种子）——又为亚当和大塞特那如同太阳的种子〔缺文〕祈求。[b]



    随后，大天使霍尔莫斯来到，要预备大塞特的种子；这种子借着这个永世污秽撒种中的众童女，在一个由圣言[c]借着圣灵所生的神圣器皿里被预备。



    随后，大塞特带着他的种子来到，种子便撒在已经产生的诸永世中；这些永世的数目与“所多玛”一名的数值相合。[d]有人说，所多玛就是大塞特牧放的地方，也就是蛾摩拉；另有人却说，大塞特把他所种植的从蛾摩拉移走，栽到另一个地方，并给那地方取名叫所多玛。



    这就是借着埃多克拉而出的族类，因为她一发言，就生出了真理和公义；这族类是永恒生命之种的开端。这生命之种是为那些因认识自己的流出[e]而忍耐到底的人预备的。这就是那伟大、不可毁灭的族类；它借着三个〔缺文〕世界来到这世界。洪水发生，是这永世终结的预像；但它将因这族类而被差到世上。[f]



    烈火将席卷大地；恩典却要临到这族类中的人，就是那些借着众先知和守望者而有的人；这些守望者看守这族类的生命。因着这族类，饥荒和瘟疫将要来到；这一切都将因那伟大、不可毁灭的族类而发生。因着这族类，试探也将来到，甚至会有假先知的欺骗。



    随后，大塞特看见了魔鬼的作为：他形形色色的伪装，他谋害那不可毁灭、不动摇之族类的计策，他的权势和天使所施加的逼迫，以及他们那使自己反受其害的谬误。



    随后，大塞特向以下各位献上赞美：



    那伟大、不可称名、童贞的灵，



    男性〔缺文〕童贞者巴贝隆，



    三重男性之子特尔迈勒、特尔迈勒，赫利、赫利，马哈尔、马哈尔，塞特，



    那永活的能力——ALĒTHES ALĒTHŌS，[g]



    男性童贞者尤埃尔，



    荣光的守护者埃塞费克——他荣耀的冠冕，



    伟大的多克索梅顿永世，



    其中的众宝座，



    环绕它们的众能力，



    以及整个圆满[h]，正如我先前所说的。



    他又祈求有守望者看守他的种子。'
