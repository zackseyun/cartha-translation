base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/011.yaml
  text: 'She received her completion and her power by the will and pleasure of the Father. Through this pleasure, he was pleased with the great, indestructible, unmoving race of the great and mighty men of the great Seth, so that he could sow it within the aeons that had been produced and, through her, fulfill the deficiency. For she descended from above into the world, being the image of the night. When she had come forth, she petitioned on behalf of the seed of the archon of this aeon and <the> authorities who originated from him—the polluted (seed) of the demon-begetting god who will be destroyed—and (she petitioned on behalf of) the seed [] of Adam and the great Seth, which resembles the sun.


    Then the great angel Hormos arrived to prepare the seed of the great Seth, by means of the virgins of the polluted sowing (with seed) of this aeon, within a sacred vessel begotten by the Logos through the holy Spirit.


    Then the great Seth arrived with his seed, and it was sown within the aeons that had been produced, their number agreeing with the numerical value of “Sodom.” Some say that Sodom is the place where the great Seth pastures, being Gomorrah. Others, however, say that the great Seth removed his planting from Gomorrah and transplanted it to a second place, which he named Sodom.


    This is the race that came forth through Edokla, because by speaking she gave birth to Truth and Justice, being the beginning of the seed of eternal life, which is for those who will persevere because of the knowledge of their emanation. This is the great, indestructible race that has come forth through three [] worlds into the world. The deluge occurred as a type of the consummation of the aeon, but it will be sent into the world because of this race.


    A conflagration will overtake the earth, and grace will be for those of the race (that came into being) through the prophets and the watchers who watch over the life of the race. Because of this race, famines and plagues will come, but these things will happen on account of the great, indestructible race. On account of this race, temptations will arrive, even a deceit of false prophets.


    Then the great Seth witnessed the work of the devil: his many disguises, his plots against the indestructible, unmoving race, the persecutions by his powers and his angels, and their error (by which) they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit,

    and the male [] virgin Barbelon,

    and the triple-male child Telmael Telmael Heli Heli Machar Machar Seth,

    the living power, ALĒTHES ALĒTHŌS,

    and the male virgin Youel,

    and Esephech, keeper of splendor, the crown of his glory,

    and the great Doxomedon aeon,

    and the thrones within him,

    and the powers surrounding them,

    and the entire Fullness, as I mentioned previously,

    and he petitioned for watchers over his seed.'
translation:
  language: zh_hans
  text: '她照着父的旨意和喜悦，得到了自己的完满和能力。父借着这喜悦，喜悦大塞特那些伟大而有能力之人的伟大、不可毁灭、不动摇的族类，为要把这族类撒种在已经产生的诸永世[a]之中，好借着她补足那缺欠。因为她从上面降到世上，是夜的形像。她出来以后，就为这个永世的统治者的种子，以及从他而出的〈那些〉掌权者祈求——也就是那将被毁灭、产生诸魔之神的污秽（种子）——又为亚当和大塞特那如同太阳的种子〔缺文〕祈求。[b]


    随后，大天使霍尔莫斯来到，要预备大塞特的种子；他借着这个永世污秽撒种中的众童女，把种子预备在一个由圣灵、借着圣言[c]所生的神圣器皿里。


    随后，大塞特带着他的种子来到，种子便撒在已经产生的诸永世中；这些永世的数目与“所多玛”一名的数值相合。[d]有人说，所多玛就是大塞特牧放的地方，也就是蛾摩拉；另有人却说，大塞特把他所栽种的从蛾摩拉移走，栽到另一个地方，并给那地方取名叫所多玛。


    这就是借着埃多克拉而出的族类，因为她一发言，就生出了真理和公义；这族类是永恒生命之种的开端。这生命之种是为那些因认识自己的流出[e]而忍耐到底的人预备的。这就是那伟大、不可毁灭的族类；它经过三个〔缺文〕世界而出，来到这世界。洪水发生，是这永世终结的预像；但它将因这族类而被差到世上。[f]


    烈火将席卷大地；恩典却要临到这族类中的人，就是那些借着众先知和守望者而有的人；这些守望者看守这族类的生命。因着这族类，饥荒和瘟疫将要来到；这一切都将因那伟大、不可毁灭的族类而发生。因着这族类，试探也将来到，甚至会有假先知的欺骗。


    随后，大塞特看见了魔鬼的作为：他形形色色的伪装，他谋害那不可毁灭、不动摇之族类的计策，他的权势和天使所施加的逼迫，以及他们那使自己反受其害的谬误。


    随后，大塞特向以下各位献上赞美：


    那伟大、不可称名、童贞的灵，


    男性〔缺文〕童贞者巴贝隆，


    三重男性之子特尔迈勒、特尔迈勒，赫利、赫利，马哈尔、马哈尔，塞特，


    那永活的能力——ALĒTHES ALĒTHŌS，[g]


    男性童贞者尤埃尔，


    荣光的守护者埃塞费克——他荣耀的冠冕，


    伟大的多克索梅顿永世，


    其中的众宝座，


    环绕它们的众能力，


    以及整个圆满[h]，正如我先前所说的。


    他又祈求有守望者看守他的种子。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永世”译自 aeon；在本文中可指宇宙性的领域、时代或位格性存在，具体所指未必处处相同。
    reason: 说明关键宇宙论术语并保留其多义性。
  - marker: b
    text: 尖括号〈〉表示见证文本补入的字；圆括号（）保留见证文本中的解释性或不确定用语；方括号中的“缺文”表示抄本有缺损。本译稿依据所提供的公共领域英译见证，尚待科普特原文复核。
    reason: 交代文本批判符号和当前底本限制。
  - marker: c
    text: “圣言”对应 Logos，也可音译为“洛格斯”；此处不预断它是否专指某一位格。
    reason: 避免把具有专门神学含义的术语过度解释。
  - marker: d
    text: “数值”指按字母所代表的数字计算名字的总值；原段落没有说明所采用的具体算法。
    reason: 帮助现代读者理解名称数值的说法而不作推测。
  - marker: e
    text: “流出”指从更高层实在发出或显现；“他们/自己的流出”也可能指他们自身由何处而来。
    reason: 保留 emanation 的宇宙论含义及所有格歧义。
  - marker: f
    text: “它”在现存表述中的指代不明，可能回指洪水、预像或终结；正文保留这种含混。
    reason: 明确提示真实的文本歧义。
  - marker: g
    text: ALĒTHES ALĒTHŌS 为希腊语形式，含有“真实”“确实”之意；正文保留拉丁字母拼写，因为它可能作为神圣称号或呼名使用。
    reason: 兼顾语义提示与专名/神圣称号的可能性。
  - marker: h
    text: “圆满”对应 Fullness，可能是诺斯替文献中指神圣实在总体的专门称谓。
    reason: 说明术语背景，但不把某一完整体系强加给本段。
lexical_decisions:
- source_word: aeon(s)
  choice: 永世
  rationale: 既保留该词所指的超宇宙领域或位格性实体，也避免径直把它化约为普通的“时代”；复数处译作“诸永世”。
- source_word: race
  choice: 族类
  rationale: 原段落以共同属灵来源和种子意象界定群体；“族类”比现代生物学或政治色彩较强的“种族”更合适。
- source_word: seed
  choice: 种子
  rationale: 保留原文反复出现的撒种、生育、栽种等意象，不统一释义为“后裔”。
- source_word: Logos
  choice: 圣言
  rationale: 在此神学语境中采用自然而庄重的译法，同时以脚注提示其术语性质，不预断它是否专指某一位格。
- source_word: emanation
  choice: 流出
  rationale: 保留诺斯替宇宙论中由上层实在发出的动态含义，避免用“起源”消除其术语色彩。
- source_word: Fullness
  choice: 圆满
  rationale: 以名词形式表达整体性的神圣充盈，并借脚注说明它可能是专门称谓。
- source_word: archon
  choice: 统治者
  rationale: 忠实表达其掌权含义；在本段宇宙论中不额外加入善恶评价。
- source_word: watchers
  choice: 守望者
  rationale: 保留其作为特定群体或属灵存在的可能性，并与“看守”形成词义呼应。
theological_decisions:
- issue: “她”的身份
  choice: 保留代词“她”，不补出名字
  alternative: 依据上下文或其他版本认定为某一神圣位格
  rationale: 所给段落未明确先行词；补名会消除原有指称上的不确定性。
- issue: “污秽种子”的句法归属
  choice: 用破折号维持其与统治者、掌权者及产生诸魔之神之间可能的同位关系
  alternative: 明确判定它只修饰其中一方
  rationale: 见证文本本身用括号标示“种子”，结构有歧义，不宜替原文裁定。
- issue: 洪水后“它”的指代
  choice: 保留“它”这一含混指代
  alternative: 明确译为洪水、终结或预像将被差到世上
  rationale: 英语见证中的代词先行词不明确，且尚待科普特文核查。
- issue: 灾祸“因着这族类”发生的因果关系
  choice: 直译反复出现的因果表达
  alternative: 解释为惩罚这族类、保护这族类或因世人敌视这族类
  rationale: 原段落没有明确说明因果机制，须保留神学张力。
- issue: “他们的谬误”导致的结果
  choice: 译为“使自己反受其害”，同时不详定行为机制
  alternative: 解释为他们误攻自己或因罪自取灭亡
  rationale: 见证文本只表明他们的行动反过来针对自身，具体含义不明。
- issue: “男性童贞者”及“三重男性”
  choice: 保留看似矛盾的称号
  alternative: 将其调和为“兼具男女”或象征性的无性存在
  rationale: 这些称号的张力属于文本自身的神学语言，不应在正文中消解。
translation_notes:
  register: 采用现代标准普通话的庄重书面语。重复保留“族类”“种子”“因着这族类”等原文修辞链条；人名以近似音译处理。对残缺、补字、指代不明和反常神学称号不作静默调和。由于科普特原文审查尚未完成，本稿明确属于基于所给公共领域英语见证的暂定、可复核译稿。
