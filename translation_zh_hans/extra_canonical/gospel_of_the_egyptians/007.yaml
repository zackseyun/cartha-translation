translation:
  language: zh_hans
  text: '他们的同伴相继显现，使自生之神的八重体得以完满：


    恩典，属于第一道光哈摩泽尔；

    感知，属于第二道光奥罗亚埃尔；

    理解，属于第三道光达维特；

    明辨，属于第四道光埃勒勒特。


    这是自生之神的第一个八重体；父点头表示赞许，众光的整个圆满界都欢喜。


    众侍从相继显现：


    第一位，大者加马列，属于第一道大光哈摩泽尔；

    大者加百列，属于第二道大光奥罗亚埃尔；

    大者萨姆洛[a]，属于大光达维特；

    大者阿布拉萨克斯，属于〔大光〕埃勒勒特；


    同伴们也照着父所喜悦的旨意相继显现：


    记忆，属于第一位大者加马列；

    爱，属于第二位大者加百列；

    和平，属于第三位大者桑布洛[a]；

    永恒的生命，属于第四位大者阿布拉萨克斯。


    这样，五个八重体便得以完满，总数为四十，成为一种无法言说的能力。


    随后，伟大的自生者——圣言，以及四道光之圆满界的言语，向以下诸位献上赞美：


    伟大、不可见、不可称名的童贞之灵，

    就是那男性童贞者；

    伟大的多克索墨冬永世；

    其中的宝座；

    环绕他们的诸能力；

    众荣耀、众权柄和众能力；

    〈以及〉三重男性的孩子；

    男性童贞者尤埃尔；

    以塞费克——〔……〕荣光的守护者，〔孩子〕的孩子；

    其荣耀的冠冕；

    整个圆满界；

    以及居住在那里的所有荣耀；

    无穷的众圆满界；

    和不可称名的众永世。


    如此，他们就可以同那不可毁灭的族类一起称父为“第四位”，并把父的种子称为伟大塞特的种子。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 同一名字在所据英文见证中先作“Samlo”，后作“Samblo”；此处分别音译为“萨姆洛”和“桑布洛”，未擅自统一。
    reason: 保存见证内部的人名异读。
lexical_decisions:
- source_word: Ogdoad
  choice: 八重体
  rationale: 保留由八个成员构成的神学结构含义；“八重体”比单纯“八位”更能表达一个复合整体。
- source_word: self-generated God / self-generated Logos
  choice: 自生之神／自生者——圣言
  rationale: 以“自生”保留不由他者生成的术语意义；Logos 译作“圣言”，同时用破折号避免误读为两个并列主体。
- source_word: Fullness
  choice: 圆满界
  rationale: 该词在此兼具总体、领域及神学性圆满的含义；“圆满界”比普通“圆满”更能承载其实体化用法。
- source_word: aeon
  choice: 永世
  rationale: 保留其既可指永恒时期、也可指超世存在或领域的张力，不径自套用特定宗派术语。
- source_word: proceeded
  choice: 相继显现
  rationale: 上下文是在列举从神圣秩序中出现的成对成员；“显现”自然可读，同时不把来源机制定死为“流出”或“受造”。
- source_word: Discretion
  choice: 明辨
  rationale: 表达审慎判断与辨别能力，比现代汉语中容易产生保密含义的“谨慎”更贴合。
- source_word: powers
  choice: 能力
  rationale: 保留该词可指力量、权能或人格化势力的多义性；不统一改作特定阶级名称。
theological_decisions:
- issue: “the Father, the fourth”的句法关系
  choice: 称父为“第四位”
  alternative: 称那第四位父／以第四者的身份称父
  rationale: 英文见证的同位关系并不完全清楚；正文采用最直接读法并加引号，保留“第四位”作为称号的突兀性。
- issue: “male virgin”这一悖论式称号
  choice: 男性童贞者
  alternative: 男童贞者／男性处女
  rationale: 直译其性别与童贞并置的张力，不以解释性词语消解矛盾。
- issue: “the child of the child”
  choice: 〔孩子〕的孩子
  alternative: 子之子
  rationale: 保留见证中的修复标记及重复结构，不擅自解释其亲属或生成关系。
- issue: “Speech of the Fullness of the four lights”与“Logos”的关系
  choice: 伟大的自生者——圣言，以及四道光之圆满界的言语
  alternative: 伟大的自生圣言，即四道光之圆满界的言语
  rationale: 原见证以 and 连接，可能是两个主体；译文保留并列，不将二者合一。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。专名按英文见证音译；手稿页码[11]、[12]不作为正文脚注保留。尖括号与方括号所示的补字、残缺或修复信号予以保存。由于尚待科普特语直接校核，本稿属于依据所给公共领域英文见证形成的暂定译稿。
