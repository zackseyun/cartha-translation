    reason: 保留原文的性别与神学张力，防止解释性过译。
lexical_decisions:
- source_word: came in procession
  choice: 列队而出
  rationale: 保留仪式性、秩序性的出场意象，不将其弱化为普通的“出现”，也不预先解释为特定的宇宙流出学术语。
- source_word: aeon / aeon of the aeons
  choice: 世代／万世之世
  rationale: “世代”既可表达长久时代，也保留此类文献中人格化宇宙领域的可能；“万世之世”保留原文叠加结构，避免直接以宗派化术语消解歧义。
- source_word: powers
  choice: 权能
  rationale: 比“力量”更适合可能人格化的超世存有，同时不武断译作“天使”或其他特定阶序。
- source_word: indestructibilities
  choice: 不朽者
  rationale: 原表达可能指抽象的不毁坏性质，也可能指人格化存有；依上下文与复数并列关系暂取人格化译法，并用方括号保留补足状态。
- source_word: Silence
  choice: 寂静
  rationale: 保留其可能作为人格化或领域化名称的张力，并以语境中的专名功能呈现。
- source_word: speech
  choice: 言语
  rationale: 不直接译作带有既定基督论联想的“道”，以免导入原文未明确规定的身份认同。
- source_word: male virgin
  choice: 男性童贞者
  rationale: 保留原文有意形成的性别悖论，不改写成“童子”或消除张力。
theological_decisions:
- issue: 多克索米顿与“万世之世”、宝座及大光之父之间的句法关系
  choice: 保留并列和同位语式的松散结构
  alternative: 明确解释为多克索米顿就是宝座、权能或大光之父的单一身份陈述
  rationale: 见证文本句法残缺且关系含混；译文只明确较有把握的“他是万世之世”，其余不作系统化整合。
- issue: “三重男性的孩子”之性质
  choice: 直译为“[三重]男性的孩子”
  alternative: 译作“三重阳性之子”“三男童”或某一特定神学称号
  rationale: 原称号本身特殊且补文有损，直译较能保存陌生感和解释空间。
- issue: “言语”与“万有的光之父”的身份关系
  choice: 按见证文本译为“一位就是言语，是万有的[光之父]”
  alternative: 把“言语”解释为刻在版上的名字、话语内容，或等同于另一位特定神格
  rationale: 原句残缺，译文保留同位关系的可能，却不进一步确定其本体身份。
- issue: “灵”与“男性童贞者”的关系
  choice: 保留“以及[他的]男性童贞者”
  alternative: 将二者合并成同一个双性称号，或解释为父子关系
  rationale: 连接词允许区分两者，而代词又处于补足状态；因此不消除其数目和关系上的张力。
