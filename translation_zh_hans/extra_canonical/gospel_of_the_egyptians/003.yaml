translation:
  language: zh_hans
  text: '多米顿·多克索米顿列队而出[a]，他是万世之世；在他里面有宝座，环绕他的有众权能、众荣耀和[不朽者。那]从寂静中[出]来的大光之父，就是[伟大的]多克索米顿世代[b]；那[三重]男性的孩子安歇在其中，他[荣耀]的宝座也立在[其中；宝座]的版上[刻着]他不可显露的名。[……]一位就是言语，是万有的[光之父]；他从寂静中[出]来，又安歇在寂静之中；他的[]名存在于一个[不可见的]符号里。


    一个隐秘、[不可见]的奥秘列队而出：


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A。


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō，


    三种权能就是这样向那[伟大]、不可见、不可命名、童贞、不可言说的灵，以及[他的]男性童贞者献上赞美[c]。'
  philosophy: optimal-equivalence
