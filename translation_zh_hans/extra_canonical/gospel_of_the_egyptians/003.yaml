  register: 采用现代、庄重而可读的简体中文。专名按音译处理；仪式性重复字母完全保留，不擅自转写成汉语读音。删除孤立的手稿页码，但保留方括号和省略号所显示的残损与补足。因目前只有英文公共领域见证而未完成科普特语复核，本稿明确属于审慎的暂定译文。
