  terminology: 保留“世代”“权能”“寂静”“言语”“童贞者”等审慎、非宗派化的对应。“不毁坏者”比“不朽者”更贴近见证的 indestructibilities，同时仍容纳其可能的人格化的用法。专名音译统一为“多梅顿·多克索梅顿”。
  issues:
  - severity: medium
    issue: “宝座的版”改变了残缺句的句法关系。
    rationale: 英文见证仅说宝座被设立，并提及其上／与其相关的一块版及刻在版上的名字；并未称该版为“宝座的版”。应避免添加所属关系。
  - severity: medium
    issue: “一位就是言语”过度人格化 one。
