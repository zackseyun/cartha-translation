    issue: “不朽者”不足以对应 indestructibilities。
    rationale: 英文见证强调的是不可毁坏、不可败坏，而不只是不会死亡；在此文本的复数并列语境中，译作“不可毁坏者”更为贴切，亦不排除其人格化可能。
  - severity: medium
    issue: “宝座的版上”将 tablet 处理为宝座所属的“版”。
