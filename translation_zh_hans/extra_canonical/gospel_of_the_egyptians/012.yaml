lexical_decisions:
- source_word: aeon
  choice: 永世
  rationale: 在塞特派宇宙论中既可指漫长时代，也可指超世界领域或位格；采用“永世”保留术语张力，具体处以“诸大永世”“十三永世”表达。
- source_word: Fullness
  choice: 圆满界
  rationale: 既保留“圆满”的神学意涵，又以“界”提示其宇宙论领域性质，避免仅译成抽象的“圆满”。
- source_word: self-generated one
  choice: 自生者
  rationale: 用简洁尊称传达无需外在生因而自行生成的存在，不与传统基督教“独生”术语混同。
- source_word: parousias
  choice: 降临
  rationale: 此处指塞特经过的三次显现或到临；译作“降临”保留宗教术语色彩，不预断其具体形态。
- source_word: archons
  choice: 执政者
  rationale: 沿用早期基督教及诺斯替文献中较通行的对应词，也保留其宇宙统治者的含义。
- source_word: Logos
  choice: “道”
  rationale: 采用中文宗教文本熟悉的“道”，加引号提示此处为专门位格性术语。
- source_word: seals
  choice: 印
  rationale: “五印”可能兼具仪式、标记和奥秘象征意义；直译以免将其限定为某一种礼仪。
- source_word: receivers
  choice: 接纳者
  rationale: 保留其接收、迎接灵魂或族类的职能，不具体化为守门者、天使或救赎者。
- source_word: repose
  choice: 安息
  rationale: 既可指死后安歇，也可指终极救恩状态；“安息”能保持双重意涵。
theological_decisions:
- issue: 塞特与耶稣的关系
  choice: 译作“耶稣……也就是伟大的塞特所披戴的那位”
  alternative: 将耶稣直接解释为塞特的化身或肉身
  rationale: 原文使用“donned/披戴”的衣着隐喻，关系复杂；不把它系统化为化身论或道成肉身教义。
- issue: “迷失的她”的身份
  choice: 保留阴性代词“那迷失的她”
  alternative: 明确译为灵魂、智慧或某位女性神圣存在
  rationale: 见证文本未明确先行词，保留真实性别和指涉歧义。
- issue: 十三永世之神
  choice: 直译“十三永世之神”
  alternative: 解释为造物主、伪神或旧约之神
  rationale: 避免导入宗派化或反犹化认定，让文本自身的宇宙论称谓保持开放。
- issue: 耶稣与律法
  choice: 正文译“把律法中的事钉在十字架上”并加注说明歧义
  alternative: 译为废除律法、钉死律法或钉死律法之下的肉身
  rationale: 底本措辞异常且直接科普特语复核尚待完成，不应替文本解决受词和神学含义。
- issue: 洗礼的效力与主体
  choice: 保留多层长句及“由‘道’所生的身体施行的洗礼”
  alternative: 重组为耶稣亲自受洗或圣徒借耶稣身体得救
  rationale: 原段主体与工具关系纠缠；译文只做必要断句，不锁定单一圣礼解释。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。专名按英语见证所示形式音译，未与其他古代文本强行统一。因科普特语直接复核尚待完成，本稿属于基于公共领域英语见证的审慎草案；方括号缺文转为脚注标识，尖括号补文仍以〈〉保留。长串显现者名单按诗行式分段，以维持原文礼仪性和目录式节奏。
