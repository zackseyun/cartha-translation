translation:
  language: zh_hans
  text: '于是，从诸大永世中出来了四百位属灵气的天使；与他们同在的有伟大的阿埃罗西埃尔和伟大的塞尔梅刻尔。他们要看守那伟大、不可毁灭的族类、这族类的果实，以及伟大塞特的伟人们；从真理与公义的时刻开始，直到这永世及其执政者终结——伟大的审判者已经判处这些执政者死刑。


    随后，四光奉自生者的旨意，差遣了伟大的塞特；[a]这差遣也出于整个圆满界，借着〈恩赐〉，又照伟大不可见之灵的美意，借着五印和整个圆满界而成。


    他经过了我先前提到的三次降临：洪水、烈火，以及对执政者、众能力者和众掌权者的判决。这样，那迷失的她就能借着世界的和解，并借着由“道”所生的身体施行的洗礼而得救。这身体是伟大的塞特借童贞女暗中为自己预备的，为要使圣者借着圣灵、通过不可见的奥秘符号而生；又通过世界与世界的和解，通过弃绝这世界和十三永世之神，并通过那些神圣、不可言说、不可毁灭者的席位而生。这些席位在父的怀中和大光里；这大光与父的眷顾一同预先存在，并借着她设立了那超越诸天的神圣洗礼；这洗礼借着那不可毁灭者[b]——由“道”所生的那位，就是永活者耶稣，也就是伟大的塞特所披戴的那位——而设立。塞特借着他把十三永世的众能力钉在十字架上，并坚固了那些被产生又被除去的人。[c]


    他以认识这真理为铠甲装备他们，使他们具有不可战胜、不可毁灭的力量。随后，以下诸位向他们显现：


    伟大的侍从耶塞乌斯·马扎雷乌斯·耶塞德刻乌斯，就是活水；


    伟大的首领，大雅各；


    特奥蓬普托斯和伊萨维尔；


    监管真理泉源的米刻乌斯、米哈尔和姆涅西努斯；


    监管活人之洗礼的那位；


    施行洁净的诸位；


    塞森根法兰格斯；


    监管众水之门的米刻乌斯和米哈尔；


    监管高山的塞尔道和埃莱诺斯；


    接纳伟大族类的诸位；


    伟大塞特〈的〉不可毁灭的勇士；


    四光的侍者：伟大的迦玛列、伟大的加百列、伟大的桑布洛，以及伟大的[d]阿布拉萨克斯；


    监管日出的奥尔塞斯、许普纽斯和赫乌鲁迈奥斯；


    被设立管理永生安息入口的统治者米克桑特尔和米卡诺尔；


    守望蒙拣选之灵魂的阿克拉马斯和斯特伦普乌科斯；


    伟大的能力“赫利，赫利，马哈尔，马哈尔，塞特”；


    伟大、不可见、不可命名、不可言说的童贞之灵，以及寂静；


    伟大的光哈摩泽尔；


    永活自生者的居所、真理之神，以及〈陪伴他的那位〉——不可毁灭的人阿达玛斯；


    第二位奥罗亚埃尔，是伟大塞特的居所；


    还有那拥有生命的耶稣；他曾来，并把律法中的事钉在十字架上；[e]


    第三位达维特，是伟大塞特众子的居所；


    第四位埃莱莱特，是已经安息之众子的灵魂居所；


    第五位约埃尔，被设立管理那将要受任、用超越不可毁灭之天的神圣洗礼施洗之人的名。[f]


    然而，从今以后，[g]借着不可毁灭的人波伊迈尔、那些配受祈求者，以及洗礼泉边五印的弃绝仪式，他们受了有关接纳者的教导以后，就会认出自己的接纳者；接纳者也会认出他们，而他们绝不会尝到死亡。


    [a] 此处抄本有缺文，句法关系不完整。

    [b] 此处抄本有缺文。

    [c] “被产生又被除去的人”原文所指不明，也可能描述某种产生和迁移的过程。

    [d] 此处抄本在“伟大的”之后有缺文。

    [e] “把律法中的事钉在十字架上”保留原文不寻常的表述；也可能理解为“把律法之下的事物钉上十字架”。

    [f] 此句中“他的名”“将要受任者”与施洗者之间的关系不够明确。

    [g] 此处抄本有缺文，末段句法残缺。'
