translation:
  language: zh_hans
  text: '**《埃及人福音》——伟大者为众光设立宝座**


    于是，一切都震动了；震颤也攫住了那些不可毁灭者。随后，三个男孩从上方降下，来到未生者和自生者那里，也来到那些在受生者中所生的众者那里。伟大者显现出来，就是伟大基督全部的伟大。


    他在环绕他们的四个永世中，设立了千千万万荣耀的宝座，又设立了千千万万的能力、荣耀、[a]不可毁灭者；他们就这样显现出来。那不可毁灭的属灵教会，在伟大、永活、自生者——真理之神——的四光之中日益增长；他们同心合意，异口同声，以永不止息的口赞美、歌颂并颂扬：


    父，

    母，

    子，

    以及他们全部的圆满，正如我先前所说的。[b]


    拥有万千众有的五印，

    统管各永世的执政者，

    以及众首领荣耀的承载者，

    都奉命向配得的人显现。


    阿们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处抄本有缺损，无法确定在“荣耀”与“不可毁灭者”之间原有何字句。
    reason: 明确标示底本文本的物质缺损，避免把断裂处误读为完整句法。
  - marker: b
    text: “先前”是见证译本为使语意完整而补出的词；现存措辞在此处可能有省略。
    reason: 说明尖括号所标示的编辑性补足，并区分补文与可见正文。
lexical_decisions:
- source_word: indestructible ones / indestructibilities
  choice: 不可毁灭者
  rationale: 保留该启示文献中作为位格化天上存在的技术性含义；上下文列举“能力、荣耀”及复数群体，故采用名词性译法，而不抽象化为“不可毁灭性”。
- source_word: unborn
  choice: 未生者
  rationale: 直译其否定“受生”的宇宙论称谓，不改释为“永恒者”或其他神学概念。
- source_word: self-begotten / self-generated one
  choice: 自生者
  rationale: 以同一核心术语呈现自行产生或由自身而生的观念，同时避免加入“受造”等原文没有的范畴。
- source_word: aeons
  choice: 永世
  rationale: 兼顾其“时代／永恒领域”之语义及本段中作为天上领域的用法；不音译为仅供学术读者理解的术语。
- source_word: Fullness
  choice: 圆满
  rationale: 保留诺斯替文献中具有技术色彩的整体、完满领域之义，并以现代汉语可理解的名词表达。
- source_word: archons
  choice: 执政者
  rationale: 保留其统治性天上权势的含义，不预先判定这些存在为邪恶，也不采用容易混同世俗官职的专名音译。
- source_word: five seals
  choice: 五印
  rationale: 采用简洁、庄重且符合宗教文献语域的译法，不额外解释其仪式或宇宙论功能。
- source_word: myriads / countless myriads
  choice: 万千众有／千千万万
  rationale: 按不同句法分别处理：数量修饰语译作“千千万万”，名词性群体译作较开放的“万千众有”，避免虚构其具体所指。
theological_decisions:
- issue: “父、母、子”三者的称谓
  choice: 按见证文本直译为“父，母，子”
  alternative: 将“母”解释或改写为圣灵、智慧等特定身份
  rationale: 原文见证明确并列三项；不以某一宗派或解释传统替换其称谓。
- issue: “伟大者”与“伟大基督全部的伟大”的关系
  choice: 保留同位说明式表达，但不明确断言二者完全等同
  alternative: 译成“伟大者，也就是伟大的基督本人”
  rationale: 见证文本措辞重复且语义不寻常；当前译法既可读，也保留其可能的位格或属性张力。
- issue: 赞美动作的主语
  choice: 使用“他们”，保留可指教会成员或相关天上众有的开放性
  alternative: 明确改成“教会赞美”或“真理之神赞美”
  rationale: 英文见证中关系结构的先行词存在歧义；不在科普特原文复核前强行消解。
- issue: “配得的人”
  choice: 直译为“配得的人”
  alternative: 具体化为信徒、受洗者或蒙拣选者
  rationale: 文本未在本段界定配得的标准或群体，故不加入特定救恩论或仪式解释。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；保留启示文献特有的宇宙论称谓、排比和重复。由于目前仅提供公共领域英文见证，科普特原文复核尚待完成，本稿为来源受限的暂定出版草案。
