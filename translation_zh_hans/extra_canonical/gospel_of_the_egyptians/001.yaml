translation:
  language: zh_hans
  text: '〔……〕伟大不可见〔灵〕的〔神圣〕之书，


    他是名不可言说的父，

    从〔圆满〕的高处〔发源〕；

    他是光之诸永世中的光中之光，

    是眷顾之〔寂静〕的光，

    也是寂静之父；

    是言语与真理的〔光〕，

    是〔……〕〔不朽者〕的光，

    是无限的光；

    是那不可揭示、不可标示、

    不衰老、不可宣说之父的

    光之诸永世所发的光辉；

    是万世之永世；[a]

    是自生者、自我生发者、自我产生者，

    是异在者，

    是永世，

    是真理——阿勒托斯。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万世之永世”直译见证文本的“aeon of the aeons”；这里的“永世”既可能表示超越性的时代，也可能指人格化的神圣实体。
    reason: 说明关键术语的真实歧义，并对应见证文本注号[1]。
  - marker: b
    text: “阿勒托斯”音译 ALĒTHŌS。此形式与前面的“真理”并列，其确切功能可能是名称、称号或强调语；源语言复核尚待进行。
    reason: 保存特殊名称并坦陈现阶段证据限制，对应见证文本注号[2]。
lexical_decisions:
- source_word: great unseen Spirit
  choice: 伟大不可见的灵
  rationale: 保留见证文本的尊称结构与“不可见”这一核心属性；不将 Spirit 扩释为特定神学位格。
- source_word: Fullness
  choice: 圆满
  rationale: 采用适合此类古代宗教文献的常见译法，同时以方括号保留其为补足文字的状态。
- source_word: aeon / aeons
  choice: 永世／诸永世
  rationale: 此词在上下文中既可指超越性的时代，也可能指人格化的神圣实体；译作“永世”以保留张力，避免径直解释为“神灵”或单纯的时间单位。
- source_word: Providence
  choice: 眷顾
  rationale: 表达具有意志与照管意味的神圣预见，又不强行套用后世系统神学术语。
- source_word: Speech
  choice: 言语
  rationale: 保留抽象而可能人格化的表达，不擅自译成“道”。
- source_word: indestructibilities
  choice: 不朽者
  rationale: 原见证为复数抽象名词，语境可能指不灭的诸实体；中文采用可兼指属性承载者的“不朽者”，并保留补足标记。
- source_word: the alien
  choice: 异在者
  rationale: 呈现其超然、与现存秩序相异的意味；避免“外邦人”等容易误导的社会身份含义。
- source_word: TRUTH, ALĒTHŌS
  choice: 真理——阿勒托斯
  rationale: 前者按意义翻译，后者按读音转写，以保存原文并列或释名式表达。
theological_decisions:
- issue: “Father”与多个光、寂静、言语、真理和永世称号之间的关系
  choice: 维持原有并列与同位式结构
  alternative: 将各项明确拆分为不同神圣实体，或全部解释为同一位父的属性
  rationale: 见证文本的句法和此类文献的神学语汇容许多重理解，不宜在译文中消除其含混。
- issue: “self-generated, self-generating, self-producing”三重表述
  choice: 译为“自生者、自我生发者、自我产生者”
  alternative: 合并为“自有永有者”或“自生者”
  rationale: 保留三个近义而不完全相同的称号，避免以较熟悉的宗派性表达取代原文修辞。
- issue: “aeon”是否人格化
  choice: 统一译为“永世”，不在正文判定是否人格化
  alternative: 译为“灵体”“神圣实体”或“时代”
  rationale: 原段落兼具时间性与实体性语言，统一保留术语能维持这一神学张力。
translation_notes:
  register: 采用庄重、可诵读的现代标准汉语。方括号改用全角〔〕，用来保留见证文本所标示的残缺与编者补足；〔……〕表示无法复原或内容缺失。由于科普特语源文本复核尚未完成，本稿严格以所给公共领域英语见证为暂定依据，不把补足部分写成确定无疑的正文。
