  naturalness: 整体庄重、通顺，适合现代标准汉语。将“这些圣者将进入世界——黑夜的形像”处理为同位语，可比原有分号后的断裂结构更自然，同时仍不作释义性扩充。
  terminology: “逻各斯”“自生者”“永世”“显现者”“七重组”“八重组”“圆满界”及各专名均可保留。“死寂的永世”是自然且不强加体系解释的译法。
  issues:
  - severity: medium
    issue: “by means of it”被译为“借着这族类”
    rationale: 英文见证中两处it的先行词在句法和思想结构上并不完全明确；将之指定为“族类”超出见证所明示的内容。应以“借此”保留含混。
  - severity: low
    issue: “黑夜的形像”的句法连接不够清楚
    rationale: 英文见证最直接的表面连接是“世界，黑夜的形像”。中文应让该短语贴近“世界”，同时在注释中说明所指仍有不确定性。
