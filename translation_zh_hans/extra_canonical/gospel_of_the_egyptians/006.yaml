source:
  text: 'The great Logos, the self-generated God, and the indestructible Man, Adamas, presented praise. They petitioned for a power and an eternal might for the self-generated one, for the completion of the four aeons, so that by means of them there would appear [] […] the glory and power of the unseen Father of the sacred men of the great Light who will enter the world, the image of the night.


    The indestructible Man, Adamas, petitioned them that a son would come from himself, so that he would become father of the unmoving indestructible race, so that by means of it Silence and Voice might appear, and that by means of it the dead aeon would lift itself, in order that it might dissolve, and in this way there proceeded from above the power of the great Light, the Manifestation. She gave birth to the four great lights:


    Harmozel,

    Oroiael,

    Davithe,

    Eleleth,


    and the great indestructible Seth, the son of the indestructible Man, Adamas, and in this way the perfect Hebdomad, which exists in concealed mysteries, was completed. [] When she [obtains] the [glory], she becomes eleven Ogdoads, and the Father nodded approval. The entire Fullness of the lights was pleased.'
