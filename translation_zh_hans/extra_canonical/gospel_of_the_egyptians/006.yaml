translation:
  language: zh_hans
  text: '伟大的逻各斯、自生的神，以及不可毁灭的人阿达玛斯献上赞美。他们为那自生者祈求能力和永恒的大能，使四个永世得以完满，好叫借着它们显现出〔残缺〕……那不可见之父的荣耀与能力；他是大光中众圣者的父，这些圣者将进入世界——黑夜的形像。[a]


    不可毁灭的人阿达玛斯向他们祈求，愿一个儿子从他自身而出，成为那不动摇、不可毁灭族类的父；好叫借着这族类，寂静与声音得以显现，也叫那死寂的永世自行升起，以便消解。于是，大光的能力——显现者——从上面发出。她生下四位大光：


    哈摩泽尔，


    奥罗雅埃尔，


    达维特，


    埃勒勒特；


    又生下伟大而不可毁灭的塞特，就是不可毁灭的人阿达玛斯之子。这样，存在于隐秘奥秘中的完整七重组便完成了。〔残缺〕当她〔获得〕〔荣耀〕时，她成为十一个八重组；父点头表示赞同。众光的整个圆满界都欢喜了。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句原见证有残缺；“黑夜的形像”所修饰的对象不明确，译文保留这种悬置。
    reason: 标示手稿残损以及真实的句法歧义。
  - marker: b
    text: 此处原见证也有残缺；“获得”“荣耀”为补译。“七重组”“八重组”和“圆满界”是本文的宇宙论术语，其确切构成在这段文字中没有完全说明。
    reason: 说明方括号补文和技术术语的不确定性，避免读者将译文误当成完整无损的原句。
lexical_decisions:
- source_word: Logos
  choice: 逻各斯
  rationale: 保留该术语的专名化和多义性，不直接缩减为“道”“话语”或“理性”；便于读者识别其在本作品宇宙论中的位格性用法。
- source_word: self-generated
  choice: 自生的／自生者
  rationale: 对应“由自身产生”的观念，并在形容词和名词化语境中自然转换，不增添“受造”或“非受造”等解释。
- source_word: indestructible
  choice: 不可毁灭的
  rationale: 保持原见证的一贯术语，避免改成偏重肉体状态的“不朽”。
- source_word: aeon
  choice: 永世
  rationale: 以可理解的中文术语表达超越性的时代或实体，同时不武断限定为纯时间概念；首次出现不作教派化释义。
- source_word: Manifestation
  choice: 显现者
  rationale: 原文在此将“显现”人格化并以阴性代词指称，译作“显现者”可兼顾名称和主体身份。
- source_word: Hebdomad
  choice: 七重组
  rationale: 表达由七者构成的整体，比单纯“七”更能保留技术含义，也避免音译造成不必要隔阂。
- source_word: Ogdoads
  choice: 八重组
  rationale: 保留八位或八重构成单位的技术意义，并与“七重组”形成术语对应。
- source_word: Fullness
  choice: 圆满界
  rationale: 此处指由众光构成的整体性领域；加“界”体现其宇宙论用法，但不等同于某一后期教义体系。
- source_word: Adamas
  choice: 阿达玛斯
  rationale: 按专名音译，以区别于作为普通人名出现的“亚当”。
- source_word: Seth
  choice: 塞特
  rationale: 按现代中文常见音译处理该专名。
theological_decisions:
- issue: “大光中众圣者的不可见之父”这一属格关系
  choice: 译为“那不可见之父……他是大光中众圣者的父”
  alternative: “大光的众圣者之不可见的父”或“众圣者的大光、那不可见的父”
  rationale: 供应见证的句法本身可能含混；正文采用最直接的父属关系，同时借标点保留“大光”修饰范围的不确定性。
- issue: “the image of the night”的所指
  choice: 以破折号保留“黑夜的形像”为悬置同位语
  alternative: 明确解释为“世界是黑夜的形像”或“众圣者是黑夜的形像”
  rationale: 原见证无法确定该短语究竟修饰世界、进入世界者还是前述对象，故不擅自消除歧义。
- issue: “dead aeon”
  choice: 译作“死寂的永世”
  alternative: “死的永世”或“死亡的永世”
  rationale: “死寂”在现代汉语中较自然，同时保留其失去生命或不活动的张力，不解释为特定世界或历史时期。
- issue: 四位大光与塞特共同构成“完整七重组”的计数张力
  choice: 照见证保留，不重新计算或补入成员
  alternative: 增补未明说的成员来凑足七位
  rationale: 文本所列项目与“七重组”的数字关系并不透明，应保留作品自身的神秘性或传本问题。
- issue: “she becomes eleven Ogdoads”
  choice: 直译为“她成为十一个八重组”
  alternative: 解释成八十八个实体或改写为“组成十一个八元群”
  rationale: 该表述在数学和神学上都较隐晦，直译可避免添加未经来源支持的体系说明。
translation_notes:
  register: 采用现代、庄重而可读的普通话。专名按音译处理；高度技术化且具多义性的术语采取半透明意译，并避免导入特定宗派解释。由于科普特语原文复核尚待进行，本稿严格依据所给公共领域英文见证，完整保留残缺与补译信号。
