  naturalness: 整体庄重可读。修订后以“为自生者祈求能力和永恒的权能”“不动、不可毁灭的族类”等表达改善句法对应和现代汉语自然度，同时不解释该段难解的宇宙论关系。
  terminology: 保留“逻各斯”“自生者”“永世”“显现者”“七重组”“八重组”“圆满界”等既定术语是合宜的。将“死寂的永世”改为“死去的永世”，避免加入原见证没有明说的“寂静”概念；“寂静”仍仅对应Silence。
