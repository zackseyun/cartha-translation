  register: 采用现代、庄重而可读的简体中文。专名依英语见证音译；尖括号保留见证中校补或存疑文字的标示功能。本稿仅据所提供的公版英语见证拟定，科普特原文复核尚待完成，因此对缺文、非常规称号和代词歧义采取保守处理。
