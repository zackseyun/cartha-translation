translation:
  language: zh_hans
  text: '于是，伟大的塞特——那不可毁灭之人阿达玛斯的儿子——向以下诸位献上赞美：


    伟大、不可见、不可命名、不可言说、如童贞者的灵，

    就是那〈男性童贞者〉，

    〈以及三重男性的孩子〉，

    〈以及男性的〉童贞者尤埃尔，

    还有荣光的守护者埃塞斐克，

    以及他荣耀的冠冕、孩子的孩子，

    〔此处文本残缺〕[a]以及伟大的多克索梅顿诸永世，

    还有我先前提过的圆满界。


    他又为自己的后裔祈求。


    随后，伟大光明的大能普勒西忒娅从那里显现出来。她是：


    众天使之母，

    众光之母，

    荣耀之母，

    四乳的童贞者；

    她从蛾摩拉、又从所多玛结出果实，如同泉源，

    蛾摩拉泉源的果实住在她里面。


    她借着伟大的塞特显现出来。


    于是，伟大的塞特因那不可毁灭的孩子赐给他的礼物而欢喜。他从那四乳的童贞者取出自己的后裔，把这后裔同他一起安置在第四永世之内，也就是第三大光戴维特之内。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处抄本有缺文；现有英语见证以空缺符号标示，无法确定缺失内容。
    reason: 明确提示正文断裂，避免把残缺处误读为连续完整的句法。
  - marker: b
    text: “同他一起”所指不明确，可能指那不可毁灭的孩子，也可能与上下文中的另一位相关；现按见证文本保留歧义。
    reason: 原见证代词指向含混，不能在缺乏科普特文复核时擅自确定。
lexical_decisions:
- source_word: indestructible Man, Adamas
  choice: 不可毁灭之人阿达玛斯
  rationale: 保留神话性称号“人”及专名 Adamas，不将其直接等同或简化为“亚当”。
- source_word: virginal Spirit
  choice: 如童贞者的灵
  rationale: 英语见证的形容词关系不完全明晰；采用略带解释但仍保留性别与童贞意象的表达，避免径直定为“童贞之灵”。
- source_word: male virgin
  choice: 男性童贞者
  rationale: 保留原文刻意形成的性别张力，不改写成较顺畅却消解矛盾的称谓。
- source_word: triple-male child
  choice: 三重男性的孩子
  rationale: 按构词表面意义译出，避免擅自解释其宇宙论身份。
- source_word: aeon(s)
  choice: 永世
  rationale: 在诺斯替宇宙论语境中兼顾时间与实体领域的含义；不简单译作“时代”。
- source_word: Fullness
  choice: 圆满界
  rationale: 既表达“圆满”，又以“界”提示这里可能指神圣总体或领域；不直接音译专门术语。
- source_word: seed
  choice: 后裔
  rationale: 本段涉及塞特的群体性延续，译作“后裔”比“种子”自然；但末段仍保留其可被取出、安置的神话叙事张力。
- source_word: came/proceeded forth
  choice: 显现出来
  rationale: 表达从神圣领域发出并出现的动作，较“走出来”庄重自然，同时不强行规定为受造或流溢。
- source_word: great power of great light
  choice: 伟大光明的大能
  rationale: 保留“大/伟大”的重复层次，并将 power 译为具有实体称号色彩的“大能”。
theological_decisions:
- issue: 性别悖论式神圣称号
  choice: 保留“男性童贞者”“三重男性的孩子”等不寻常表述
  alternative: 按现代习惯改写为无性别或较流畅的神圣称号
  rationale: 这些张力可能属于文本的神学象征体系，不应在翻译中消解。
- issue: “后裔”既是群体又像可安置之物
  choice: 统一译为“后裔”，保留末段动作的陌生感
  alternative: 前文译“后裔”、末文译“种子”
  rationale: 统一措辞可显明本段内部联系；原有语义张力通过“取出、安置”自然保留。
- issue: 普勒西忒娅“借着塞特”显现
  choice: 译作“借着伟大的塞特显现出来”
  alternative: 译作“从伟大的塞特出来”
  rationale: through 可指媒介或穿越；“借着”保留媒介意义，又不武断断言她源自塞特。
- issue: 塞特将后裔“with him”安置
  choice: 译作“把这后裔同他一起安置”并加注说明歧义
  alternative: 省略代词或明确指向某一人物
  rationale: 代词所指不清，应保留而不替文本作神学裁决。
- issue: 所多玛与蛾摩拉意象
  choice: 直译地名与结果、泉源意象
  alternative: 按圣经传统赋予负面道德解释
  rationale: 本段用法明显属于其自身神话象征，翻译不应导入后世或其他经文语境中的评判。
