translation:
  language: zh_hans
  text: '五千年后，大光以勒勒特说：“要有一位统治者管理混沌和阴间。”于是出现了一朵云，[] [名叫]属物质的索菲娅[a]……


    [她]俯瞰[混沌]的各个区域。她的脸仿佛……她的形体……血；[大]天使迦玛列对[大天使加百列]——[大光]奥罗亚列的侍从——说。他[说：“要有一位]天使出来，[统治]混沌[和阴间]。”


    于是，那朵云[顺从了，生出]两个单子[b]，各自[具有]光。……她在[上方]的云中所设立的[宝座]。


    随后，伟大的[天使]萨克拉[看见]与他同行的大魔灵[奈布鲁]；他们[一同]成了一个能生育的地之灵。[他们生下了]服役的天使。


    萨克拉对大[魔灵]奈布鲁[说]：“要让[十二个]永世[c]在[那……]永世中产生，诸世界……”


    ……大天使[萨克拉]照着自生者[d]的旨意说：[]“要有……数目为七……”他又对[众大天使]说：“去吧，[你们各自]统治自己的[世界]。”


    这十二位[天使]各自[出现]：


    [第一位]天使是阿托[特]。[他就是]人类历代所称的……


    [第]二位是哈马斯，[他]是[火眼]。


    第三位[是加利拉]。


    [第]四位是约贝勒。


    [第五位是]阿多奈奥斯，又[称为]萨巴奥特。


    第六位[是该隐，人类]历代称他为太阳。


    [第七位是亚伯]。


    第八位是阿基雷西纳。


    [第九位是尤贝勒]。


    第十位是哈姆[皮亚勒]。


    [第]十一位是阿尔基[尔－阿多宁]。


    第十二位[是贝利亚斯]。


    [这些就是]被安置在阴间[和混沌]之上的那些天使。世界[奠基]以后，萨克拉对他的[天使]说：“我，我就是一位[忌邪的]神；除我以外，没有什么[产生过。”这是因为他]……倚仗自己的本质。


    随后，有声音从高处传来，说：“那人[e]存在，人的儿子也存在。”


    由于上方的像降下，最初的形体便被塑成；这像在高处回响自己的声音——那从上方的像向外观看之际，也向外观看的像。悔悟也因此产生。


    [a] “索菲娅”意为“智慧”；“属物质的”译自指向物质、质料的术语。

    [b] “单子”指不可再分的单一实体；此处保留本文的技术性宇宙论用语。

    [c] “永世”所译的术语也可指“世代”或人格化的宇宙领域；本段似同时涉及领域与诸世界。

    [d] “自生者”指由自身而生或自行产生者。

    [e] “那人”原文带定指意味，也可译作“人”。这里可能指天上的原型之人，但译文不直接作此解释。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “索菲娅”意为“智慧”；“属物质的”译自指向物质、质料的术语。
    reason: 解释音译专名及 hylic 的技术含义。
  - marker: b
    text: “单子”指不可再分的单一实体；此处保留本文的技术性宇宙论用语。
    reason: 普通读者可能不熟悉哲学术语 monad。
  - marker: c
    text: “永世”所译的术语也可指“世代”或人格化的宇宙领域；本段似同时涉及领域与诸世界。
    reason: 保留 aeon 的多义性和神学张力。
  - marker: d
    text: “自生者”指由自身而生或自行产生者。
    reason: 说明称号的构词意义，避免误读。
  - marker: e
    text: “那人”原文带定指意味，也可译作“人”。这里可能指天上的原型之人，但译文不直接作此解释。
    reason: 标示“the Man”的歧义及可能的宇宙论用法。
lexical_decisions:
- source_word: hylic Sophia
  choice: 属物质的索菲娅
  rationale: 保留专名 Sophia 的音译，并以“属物质的”表达 hylic 的质料性含义，避免误作普通的“智慧”。
- source_word: monads
  choice: 单子
  rationale: 这是古代哲学与诺斯替宇宙论中的技术术语；采用现代中文已有的哲学译名，并加脚注说明。
- source_word: aeons
  choice: 永世
  rationale: 该词兼有时代、领域及人格化存在等含义；“永世”保留其宇宙论色彩，脚注提示语义张力。
- source_word: self-generated one
  choice: 自生者
  rationale: 简洁表达由自身而生的称号性质，不擅自等同于其他神学称谓。
- source_word: Hades
  choice: 阴间
  rationale: 表达死者领域而非后世惩罚之地，避免译作“地狱”所带来的额外含义。
- source_word: the Man
  choice: 那人
  rationale: 保留定指性和与后文“人的儿子”的对应，同时以脚注说明也可译“人”。
- source_word: mold
  choice: 形体
  rationale: 上下文涉及作为上方之像的映现而被塑成者；“形体”较自然，同时保留成型、铸模的意象。
- source_word: Repentance
  choice: 悔悟
  rationale: 保留可能人格化或宇宙论化的抽象名词，不将其缩减为单纯行为命令。
theological_decisions:
- issue: 萨克拉自称独一且忌邪的神
  choice: 按残存文本直译其宣称，并保留叙述者关于他“倚仗自己的本质”的批判性上下文
  alternative: 把萨克拉的话改写为正统独一神信条
  rationale: 本文有意让较低层的统治者作此宣称；不可替作者消除其神学张力。
- issue: “那人”和“人的儿子”的身份
  choice: 保留称号式、定指式措辞，不直接等同于亚当或耶稣
  alternative: 译为“天上的人”和“人子基督”
  rationale: 残篇本身未在此处明确完成这些身份认定，译文应保存歧义。
- issue: “悔悟”是否为人格化存在
  choice: 以抽象名词并用较醒目的句法呈现，不另加“女神”“灵体”等限定
  alternative: 将其明确人格化为一位称作“悔悟”的存在
  rationale: 英语见证中的首字母大写提示可能人格化，但科普特语源审查尚未完成，宜保持开放。
- issue: 性别指代与云、索菲娅的关系
  choice: 依见证用“她”，但不补写两者完全同一的解释
  alternative: 明确说“索菲娅这朵云”
  rationale: 残损语境支持关联，却不足以在所有细节上消除句法歧义。
translation_notes:
  register: 采用庄重、流畅的现代标准普通话。方括号严格保留见证文本中的补足内容，省略号表示抄本残损或缺文；孤立页码标记未纳入正文。人名以音译为主，传统圣经中已有稳定译名者采用通行形式。由于科普特语直接审校尚待进行，本稿明确属于依据所供公共领域英语见证制作的暂定源据译稿。
