review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所提供的英语见证，并妥善保留方括号补足与残缺省略号；但“Eleleth”误作“以勒勒特”，个别句子将“accompanying him”等关系略作改写，末段“image/peering out”的复杂句法也需要更贴近见证且更清楚地保留其晦涩性。由于未提供科普特语逐词底本，本审查只能以英语见证为直接依据。
  naturalness: 译文总体具庄重的现代书面语风格。应将“以勒勒特”改为正常音译“埃列莱特”，并调整若干过于生硬或关系不明的表达；残损处仍须维持残损，不可借润色补出原文没有的内容。
  terminology: “混沌”“阴间”“单子”“永世”“自生者”等术语选择可用，脚注也避免了教派化解释。“属物质的索菲娅”可保留；“模形”较“形体”更能保存 mold 的成型／模具意象。专名除埃列莱特外维持现有音译，传统名称该隐、亚伯、加百列、迦玛列可保留。
  issues:
  - severity: medium
    issue: Eleleth 被译为“以勒勒特”。
    rationale: 该音译未能对应 Eleleth 的起始元音及常见转写；改作“埃列莱特”较贴近拼写与发音，且不会与其他专名混淆。
  - severity: low
    issue: “与他同行的大魔灵”弱化了 demon “accompanying him”的随从／伴随关系。
    rationale: “陪伴着他的”更直接对应见证，不额外暗示二者并肩同行。
  - severity: medium
    issue: 末段关于上方之像、声音和“向外窥视”的句子语义关系不够清楚，且“形体”未充分保留 mold 的成型意象。
    rationale: 应以较可读的中文重组英语见证的同位／修饰结构，同时不把难解宇宙论句法解释为确定教义。
  - severity: low
    issue: “人类历代”没有明确呈现 great generations of humans 中“伟大”的限定。
    rationale: 残存补足可译为“人类的[伟大世代]”，以保留见证中的限定及方括号范围。
