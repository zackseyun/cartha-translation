translation:
  language: zh_hans
  text: 'IĒ IEUS ĒŌ OU ĒŌ ŌUA，


    诚然，诚然，


    哦，Yesseus Mazareus Yessedekeus，


    哦，活水，


    哦，子之子，


    哦，荣耀之名，


    诚然，诚然，


    永恒的存在者，


    I I I I


    ĒĒĒĒ


    EEEE


    OOOO


    UUUU


    ŌŌŌŌ


    AAAA{A}，


    真实，诚然，


    ĒI AAAA ŌŌŌŌ，


    哦，观看众永世的存在者，


    真实，诚然，


    AEE


    ĒĒĒ


    I I I I


    UUUUUU


    ŌŌŌŌŌŌŌŌ，


    永永远远者，


    真实，诚然，


    存在于心中的 IĒA AIŌ，


    UAEI EISAEI EIOEI EIOSEI！


    你这伟大的名住在我里面，


    哦，自生的完美者。


    你并不在我外面，


    我看见你；


    哦，众人都不能看见的你，


    因为谁能用另一种语言领会你？


    [a]因为我已经认识你，


    如今我已经与那不改变者合而为一。


    我用光的铠甲武装了自己。


    我已经成为光，


    因为母亲为了恩典绝美的荣光而在那地方。


    所以，我把原本合拢的双手伸展开来。


    我在光之丰盛的圆环里面得以成形，


    就在我的怀中；


    这怀中生出众多由光而生者的形体，


    控告无法到达那里。


    诚然，


    我要宣告你的荣耀，


    因为我已经领会你，


    SOU IĒS IDE AEIŌ AEIE OIS，


    哦，永世，永世，哦，静默之神！


    我全心尊崇你。


    哦，子啊，你是我安息之处，


    ĒS ĒS O E，


    无形者中的无形者；


    你使那人升起，并要在他里面洁净我，


    使我照着你那不能毁灭的名，


    进入你的生命。


    因此，生命的香住在我里面。


    我照着所有掌权者的模型，把它与水调和，


    使我可以与你一同活在众圣者的福乐中；


    你是永远长存者。[b]


    诚然，诚然。'
  philosophy: optimal-equivalence
  footnotes:
