    reason: 将原见证中的空方括号转化为可读的正文脚注标记，同时不臆补缺文。
  - marker: b
    text: 此处抄本有缺损或无法复原的文字；现存见证在末次“诚然，诚然”之前标出空缺。
    reason: 保存第二处抄本缺文信号，并以规范脚注说明。
lexical_decisions:
- source_word: ALĒTHŌS
  choice: 诚然
  rationale: 该词通常是希腊语副词“真实地、确实地”；在反复吟诵中译作“诚然”既保留礼仪性的断言，也保持自然庄重。
- source_word: ALĒTHES
  choice: 真实
  rationale: 与 ALĒTHŌS 的形式差异予以保留；用“真实”对应其形容词形式，不将两种写法抹平。
- source_word: Being
  choice: 存在者
  rationale: 保留本体论意味，同时避免径直套用特定宗派的神名。
- source_word: aeons
  choice: 众永世
  rationale: 保留该词兼具漫长时代与人格化宇宙层级的可能性，不擅自解释为单纯“世代”或特定灵体。
- source_word: self-generated Perfect One
  choice: 自生的完美者
  rationale: 直译其自我产生与完满的称号性质，不加创生论解释。
- source_word: archons
  choice: 掌权者
  rationale: 表达统治、掌权之义，并保留其在本文宇宙论中可能指超人间权能者的开放性。
- source_word: incense of life
  choice: 生命的香
  rationale: 保留“香/香料/香气”的礼仪意象，不扩译为特定祭仪器物。
- source_word: Yesseus Mazareus Yessedekeus
  choice: Yesseus Mazareus Yessedekeus
  rationale: 这是意义与语源均不确定的神圣名号，保留拉丁字母形式，避免未经科普特语校勘的臆测音译。
theological_decisions:
- issue: “child of the child”的亲属与称号含义
  choice: 子之子
  alternative: 孩子的孩子／圣子的孩子
  rationale: 采用凝练直译，保留它可能是亲属表达、神圣称号或谜语式结构的歧义；不补入“圣”字。
- issue: “merged with the unchangeable one”的联合程度
  choice: 与那不改变者合而为一
  alternative: 与那不改变者联合
  rationale: 原见证的“merged”强于普通关联，因此保留深度合一的张力，但不进一步解释为本体同一或道德联合。
- issue: “the Mother”与“the Place”的身份
  choice: 母亲／那地方
  alternative: 圣母／圣所
  rationale: 保留文本中的宇宙论称号，不把“母亲”认定为马利亚，也不把“地方”限定为礼拜场所。
- issue: “raising the Man inside whom you will cleanse me”的句法关系
  choice: 你使那人升起，并要在他里面洁净我
  alternative: 你在我里面使那人升起，并要洁净我
  rationale: 英文见证本身句法紧张，译文保留“那人”为受举起者、“他里面”为洁净发生处这一较直接读法，不将“人”解释为基督、原人或内在人。
- issue: 洗礼性水、香与掌权者模型的关系
  choice: 照着所有掌权者的模型，把它与水调和
  alternative: 按众执政者的样式把香掺入水中
  rationale: 保持仪式语言及其难解关系，不把动作规范化为任何已知宗派的洗礼礼程。
- issue: 无意义或神圣发声序列
  choice: 原样保留拉丁字母、长音符号及花括号
  alternative: 按中文语音音译
  rationale: 这些序列可能是元音吟诵、神圣名或文字游戏；中文音译会丢失字母数量、长音和书写形态等证据。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话，保留赞歌的短行、呼告、反复和仪式节奏。神圣名、元音串、长音符号、AAAA{A} 的花括号，以及 ALĒTHES 与 ALĒTHŌS 的形式差别均予保留或在译义上加以区分。见证中插入的抄本页码 [15] 不属于正文，故不收入；两处空方括号则作为缺文脚注 [a]、[b] 保存。本稿依据所提供的公共领域英文见证起草；科普特语原文复核尚待完成，因此对若干晦涩句法采取审慎、保留歧义的译法。
