translation:
  language: zh_hans
  text: '他们祈求获得[a]一种能力。一个出自永活寂静的寂静显现出来，就是诸永世中的[荣耀]和不朽者、[……永世]、增添到[……]之上的万万众者、三个男性、[三个]男性后裔。众[男性]族类以[整个圆满境界]言语的能力，充满了伟大的多克索墨顿[永世]。


    随后，伟大基督的三重男性[之子]，就是那位受[伟大]不可见之灵膏立、其能力[称为]艾农的，向伟大不可见之灵、[他的]男性童贞者约珥、寂静之寂静的寂静，以及那伟大[……]献上了[赞美]。


    （抄本三第45—48页缺失；这几页对应抄本四第55—60页。）[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号内的文字表示抄本残缺处由编译者补出的内容；省略号表示文字缺损，无法复原。
    reason: 帮助读者区分现存文字与现代补文，并统一说明全文多处方括号和缺文号。
  - marker: b
