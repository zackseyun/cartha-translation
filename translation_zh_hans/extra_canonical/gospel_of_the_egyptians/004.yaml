    reason: 交代重要的手稿状况及当前文本基础，防止将暂定读法视为已完成原语校勘。
lexical_decisions:
- source_word: aeons
  choice: 永世
  rationale: 在此宇宙论语境中保留其既可指超越性时代、又可指人格化领域或实体的含混性；不径直译作“神灵”或“世界”。
- source_word: Fullness
  choice: 圆满境界
  rationale: 既传达“圆满、充盈”的基本意义，也提示此处可能指宇宙论中的整体领域；加“境界”以免普通读者误解为抽象的“充分”。
- source_word: Doxomedon
  choice: 多克索墨顿
  rationale: 专名按音译处理，不根据不确定词源作神学化意译。
- source_word: triple-male
  choice: 三重男性
  rationale: 尽量保留原见证中奇特的复合称号及其性别意象，不擅自释为“三位男性”或“三倍阳性”。
- source_word: Ainon
  choice: 艾农
  rationale: 作为能力之名音译，避免无可靠原语审查时臆测词义。
- source_word: Yoel
  choice: 约珥
  rationale: 采用现代汉语中较熟悉的圣经式专名形式，同时保留其专名性质。
- source_word: male virgin
  choice: 男性童贞者
  rationale: 保留原文有意形成的性别张力，不将其协调为单纯的“童女”或“童男”。
- source_word: Silence of silent Silence
  choice: 寂静之寂静的寂静
  rationale: 保留层叠、近似称号式的重复结构；不为了流畅而消除其神秘文本特征。
theological_decisions:
- issue: “永世”是否人格化
  choice: 采用“永世”，不加“神灵”“天使”等解释
  alternative: 诸灵体／诸世界
  rationale: 当前仅有英语公共领域见证，科普特语复核尚待进行；应保留实体、领域与时代之间的真实歧义。
- issue: “基督”与“三重男性之子”的句法关系
  choice: 译作“伟大基督的三重男性[之子]”
  alternative: “三重男性的[孩子]，即伟大基督”
  rationale: 英语见证的括号复原和属格关系存在不稳定性；本稿依现有词序给出可读译法，同时以方括号标明补文，避免把残缺句法包装成确定教义。
- issue: 受膏者与“能力名为艾农”的指代
  choice: 均承接“三重男性之子”
  alternative: “艾农”指膏立之灵的能力
  rationale: 现有见证最自然地把关系从句接在该人物之后，但因原页残损，译文继续保留方括号所示的不确定性。
- issue: “男性童贞者约珥”的称谓
  choice: 直译并保留悖论性称谓
  alternative: 童男约珥／童女约珥
  rationale: 不以常规性别分类消解文本自身的神学张力。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。对残损文本严格保留方括号和缺文号；宇宙论术语尽量不作宗派化解释。专名音译，重复和悖论性称号予以保留。
