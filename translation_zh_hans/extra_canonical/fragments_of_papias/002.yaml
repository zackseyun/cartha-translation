  language: zh_hans
  text: '现存帕皮亚的五卷著作，题为《主言释义》。爱任纽也提到，这是他所写的仅有的著作。他这样说：“这些事，古代那位可敬的人帕皮亚，在他著作的第四卷中以文字作证；他曾听过约翰，也是坡旅甲的同伴。因为他共撰写了五卷。”以上是爱任纽的话。


    然而，帕皮亚本人在其论述的序言中，显然没有声称自己曾亲耳听过圣使徒，也没有声称亲眼见过他们。相反，他所用的话表明，他是从使徒的熟识者那里领受信仰之事的：


    “凡我从前向众长老仔细学到、又仔细记住的事，我也会毫不迟疑地连同我的解释一并为你写下，并保证这些事真实可信。因为我不像许多人那样，喜欢那些滔滔不绝的人，而是喜欢那些教导真理的人；我不喜欢那些传述外来诫命的人，而是喜欢那些传述主赐给信仰、并且源自真理本身之诫命的人。再者，每逢有人来到我这里，而他曾跟随过众长老，我就会询问长老们所说的话——安得烈说过什么，彼得、腓力、多马、雅各、约翰、马太，或主的其他任何门徒说过什么；也询问主的门徒亚里斯提安和长老约翰正在说什么。[a] 因为我认为，从书本的内容所得的益处，不及从活着且长存的声音所得的益处。”


    这里值得注意的是，他两次列出约翰的名字。第一次，他把约翰与彼得、雅各、马太和其余使徒并列，显然是指那位福音书作者；但他隔了一段之后又提到另一个约翰，把他列在使徒人数以外的其他人中，先列亚里斯提安，并明确称这位约翰为“长老”。由此他十分清楚地表明，那些说亚细亚有两个同名之人的话是真实的；在以弗所也有两座坟墓，直到如今，每一座都称为约翰之墓。这一点很重要，必须留意；因为那看见以约翰之名流传的《启示录》的人，很可能是第二位约翰——除非有人坚持认为是第一位。我们现在所说的帕皮亚承认，他是从跟随过使徒的人那里领受使徒之言的；但他又说，自己曾亲耳听过亚里斯提安和长老约翰。无论如何，他常常具名提到他们，也把他们的传承记在自己的著作中。关于这些事，我想以上所引并非毫无用处。


    不过，在上面所引帕皮亚的话之外，还值得加上他的其他一些段落；其中记载了另一些奇事，说这些事同样是借着传承传给他的。前面已经说过，使徒腓力和他的女儿们住在希拉波利斯；这里还必须指出，与她们同时代的帕皮亚说，他从腓力的女儿们那里听到一件奇事。他说，在他的时代，有一个人从死人中复生。他又讲了另一个关于绰号巴撒巴的犹士都的奇事：此人喝了致命的毒物，却因主的恩典毫发无损。《使徒行传》记载，救主升天以后，圣使徒把这位犹士都和马提亚一同推举出来，并为作出正确的拣选而祷告，好让其中一人取代叛徒犹大，补足他们的数目。那段话大致如下：“于是他们推举两个人：一个是约瑟，称为巴撒巴，又名犹士都；另一个是马提亚。他们祷告说……”


    同一位作者还记下一些从口传而来的材料：救主某些奇异的比喻和教导，以及另外一些颇具神话色彩的说法。其中他说，复活之后将有约一万年的时期，基督的国将在这地上以物质的形态建立起来。[b] 我想，他形成这些观念，是因为误解了使徒的记述，没有看出他们以形象记下的事是按奥秘说的。


    从他自己的话来判断，可以说，他显然是个理解力十分有限的人。然而，正是由于他，后来许多教父都采纳了类似的看法，并以此人的古老年代为自己的依据；例如爱任纽，以及其他声称持有类似观点的人。帕皮亚在自己的著作中，还依据上文提过的亚里斯提安，记述了主的其他言语，也记载了长老约翰的传承。有兴趣的人可以查考这些材料；就我们目前的目的而言，只需在上面引述的话之外，再加上一则经由这些来源传下来的传统，内容涉及福音书作者马可：


    “长老还这样说：马可成了彼得的传译者以后，把自己所记得的一切都准确地写了下来；不过，他没有按次序记述基督所说或所做的事。因为他既没有亲耳听过主，也没有跟随过主；但后来，正如我所说，他跟随了彼得。彼得按照听众的需要施教，并不打算把主的言语编成连贯有序的记述。因此，马可照自己所记得的写下一些事，并没有犯错；因为他只专心于一件事：凡亲耳听到的，一件也不遗漏，其中也不写下任何虚假的话。”


    以上就是帕皮亚关于马可的记述。至于马太，他作了如下陈述：


    “因此，马太用希伯来语[b]编排了主的言语，各人则按自己的能力加以解释。”


    同一位作者采用了《约翰一书》以及《彼得前书》的证言。他还讲述了另一个故事，说有一个犯了许多罪的女人在主面前受到控告；这故事见于《……福音》。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里过去时“说过什么”与现在时“正在说什么”的对比，常被理解为：前一组人物属于较早一代，而亚里斯提安和长老约翰在帕皮亚询问时可能仍然在世；但语法本身不足以完全确定这一点。
    reason: 保留时态差异所产生的历史歧义。
  - marker: b
    text: 此处所据英语见证作“约一万年”；现存优西比乌希腊文本通常作“一千年”。后文“希伯来语”所对应的古代说法，也可能宽泛地指希伯来人的语言，包括亚兰语。
    reason: 正文中同一标记误用于两个位置并不理想，故出版时应将马太段的标记改为[d]；此注同时公开见证差异及语言称谓歧义。
  - marker: c
    text: 所提供的见证在“《……福音》”处中断，句子未完，无法由本见证确定福音书名称。
    reason: 明确底本文本残缺，避免猜补。
lexical_decisions:
- source_word: λογίων κυριακῶν / Oracles of the Lord
  choice: 主言
  rationale: 保留“主的言语/神谕”这一古代文类称谓的宽度；书名译作《主言释义》，自然且不预断其仅指耶稣语录。
- source_word: πρεσβύτεροι / elders
  choice: 长老们／众长老
  rationale: 沿用早期基督教文献的常见称谓，并保留其可能指教会长老或前辈见证人的歧义。
- source_word: ἑρμηνευτής / interpreter
  choice: 传译者
  rationale: 该词可指口译者或阐释者；“传译者”避免武断限定马可只是口头翻译员。
- source_word: τάξις / order
  choice: 次序／连贯有序
