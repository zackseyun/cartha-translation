review_pass:
  verdict: revise
  source_fidelity: 需修订。最关键的是“复活之后约一万年”：优西比乌《教会史》3.39所保存的希腊文通行本为“千年”（χιλίων ἐτῶν），英语见证的“ten thousand years”与此不符，且很可能源于该公版页面/OCR或转录链的问题。正文宜按原文作“一千年”，并以脚注说明所供英语见证的异读。其余内容总体保留了优西比乌叙述、帕皮亚引语和叙述者判断之间的层次；结尾应继续明确标示见证中断，不能补定福音书名称。
  naturalness: 整体庄重、通顺，适合古代教会史料。少数表达可更贴近现代书面汉语：将“古代那位可敬的人”改为不额外评价的“早期人物”；将“物质的形态”改为更贴近 σωματικῶς 的“有形／属肉身的形式”；“按奥秘说的”改为“以奥秘的方式说的”。
  terminology: 《主言释义》、长老、亚里斯提安、坡旅甲、希拉波利斯、巴撒巴、犹士都等译名可保留。“传译者”保留 ἑρμηνευτής 的口译者／阐释者双重可能。脚注标记须唯一：原稿将[b]同时用于千年问题和“希伯来语”，应拆为不同标记。
  issues:
  - severity: high
    issue: “约一万年”与优西比乌《教会史》3.39的希腊文不符
    rationale: 所存希腊文为“千年”，而非“一万年”。在已知英语见证与原文相冲突时，应优先采用原文，并说明英语见证的读法。
  - severity: medium
    issue: 脚注标记[b]在正文中用于两个不同位置
    rationale: 一个标记不能同时无歧义地指向两个不同注释主题；应将千年异文、希伯来语／亚兰语的术语问题及末句残缺分别使用[b]、[c]、[d]。
  - severity: low
    issue: “古代那位可敬的人”给 Irenaeus 的 παλαιὸς ἀνήρ 增添了“可敬”的评价
    rationale: 该词组重点是其早期／古老性，不宜在正文中无依据地加强为人格褒扬。
  - severity: low
    issue: “以物质的形态建立起来”未充分反映 σωματικῶς 的“有形、属肉身”语义
    rationale: “有形的形式”较为中性，也避免将原文直接化约为近代意义的“物质主义”。
  revised_text: '现存帕皮亚的五卷著作，题为《主言释义》。爱任纽也提到，这是他所写的仅有著作，并有如下的话：“这些事，帕皮亚——约翰的听者、坡旅甲的同伴、一位早期人物——在其著作第四卷中以文字作证；因为他写了五卷书。”以上是爱任纽的话。


    然而，帕皮亚本人在其论述的序言中，显然没有声称自己是圣使徒的听者和亲眼见证人。相反，他所用的话表明，他是从使徒的熟识者那里领受信仰之事的：


    “凡我从前向众长老仔细学到、又仔细记住的事，我也会毫不迟疑地连同我的解释一并为你记下，并保证其真实。因为我不像许多人那样，以那些滔滔不绝的人为乐，却以教导真理的人为乐；我也不以传述外来诫命的人为乐，却以传述那由主赐给信仰、并且源自真理本身之诫命的人为乐。再者，每逢有曾跟随众长老的人来到我这里，我就会询问长老们所说的话——安得烈说过什么，彼得、腓力、多马、雅各、约翰、马太，或主的其他任何门徒说过什么；也询问主的门徒亚里斯提安和长老约翰正在说什么。[a] 因为我认为，从书本的内容所得的益处，不及从活着且长存的声音所得的益处。”


    这里值得注意的是，他两次列出约翰的名字。第一次，他把约翰与彼得、雅各、马太和其余使徒并列，显然是指那位福音书作者；但他隔了一段之后又提到另一个约翰，把他列在使徒人数以外的其他人中，先列亚里斯提安，并明确称他为“长老”。由此，他十分清楚地表明，那些说亚细亚有两个同名之人的话是真实的；在以弗所也有两座坟墓，直到如今，每一座都称为约翰之墓。这一点很重要，必须留意；因为那看见以约翰之名流传的《启示录》的人，很可能是第二位约翰——除非有人坚持认为是第一位。我们现在所说的帕皮亚承认，他是从跟随过使徒的人那里领受使徒之言的；但他又说，自己曾亲耳听过亚里斯提安和长老约翰。无论如何，他常常具名提到他们，也把他们的传承记在自己的著作中。关于这些事，我想以上所引并非毫无用处。


    不过，在上面所引帕皮亚的话之外，还值得加上他的其他一些段落；其中记载了另一些奇事，说这些事同样是借着传承传给他的。前面已经说过，使徒腓力和他的女儿们住在希拉波利斯；这里还必须指出，与她们同时代的帕皮亚说，他从腓力的女儿们那里听到一件奇事。他说，在他的时代，有一个人从死里复活。他又讲了另一个关于绰号巴撒巴的犹士都的奇事：此人喝了致命的毒物，却因主的恩典毫发无损。《使徒行传》记载，救主升天以后，圣使徒把这位犹士都和马提亚一同推举出来，并祈求作出正确的拣选，好让其中一人取代叛徒犹大，补足他们的数目。那段话大致如下：“于是他们推举两个人：一个是约瑟，称为巴撒巴，又名犹士都；另一个是马提亚。他们祷告说……”


    同一位作者还记下一些从口传而来的材料：救主某些奇异的比喻和教导，以及另外一些颇具神话色彩的说法。其中他说，复活之后将有一千年的时期，基督的国将在这地上以有形的形式建立起来。[b] 我想，他形成这些观念，是因为误解了使徒的记述，没有看出他们以形象记下的事，是以奥秘的方式说的。


    从他自己的话来判断，可以说，他显然是个理解力十分有限的人。然而，正是由于他，后来许多教父都采纳了类似的看法，并以此人的年代久远为自己的依据；例如爱任纽，以及其他声称持有类似观点的人。帕皮亚在自己的著作中，还根据上文提过的亚里斯提安，记述了主的其他言语，也记载了长老约翰的传承。有兴趣的人可以查考这些材料；就我们目前的目的而言，只需在上面引述的话之外，再加上一则经由这些来源传下来的传统，内容涉及福音书作者马可：


    “长老还这样说：马可成了彼得的传译者以后，把自己所记得的一切都准确地写了下来；不过，他没有按次序记述基督所说或所做的事。因为他既没有亲耳听过主，也没有跟随过主；但后来，正如我所说，他跟随了彼得。彼得按照听众的需要施教，并不打算把主的言语编成连贯有序的记述。因此，马可照自己所记得的写下一些事，并没有犯错；因为他只专心于一件事：凡亲耳听到的，一件也不遗漏，其中也不写下任何虚假的话。”


    以上就是帕皮亚关于马可的记述。至于马太，他作了如下陈述：


    “因此，马太用希伯来语编排了主的言语，各人则按自己的能力加以解释。”[c]


    同一位作者采用了《约翰一书》以及《彼得前书》的证言。他还讲述了另一个故事，说有一个犯了许多罪的女人在主面前受到控告；这故事见于《……福音》。[d]'
