    reason: 优先遵循原文，并公开英语见证与原文的差异。
  - marker: c
    text: 古代“希伯来语／希伯来方言”的称谓可能宽泛地指希伯来人的语言，包含亚兰语；原文不足以在此完全确定现代语言学意义上的语言名称。
