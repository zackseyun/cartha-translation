lexical_decisions:
- source_word: Scribes
  choice: 经学家
  rationale: 指熟悉并讲解摩西律法的专业人士；“经学家”比传统的“文士”更便于现代普通读者理解。
- source_word: Master
  choice: 老师
  rationale: 此处是对教导者的称呼，译作“老师”自然准确，避免将其误解为主仆关系中的“主人”。
- source_word: taken in adultery, in the very act
  choice: 正在行淫时被抓住
  rationale: 保留“当场被捉”的强调，同时使用现代汉语中清楚而庄重的措辞。
- source_word: condemn
  choice: 定……的罪
  rationale: 保留司法审断的语气，也维持本段关于控告、判罪与宽免之间的张力。
- source_word: without sin
  choice: 没有罪
  rationale: 不擅自缩窄为“没有犯过同一种罪”，保留原见证较宽泛的表述。
- source_word: Woman
  choice: 妇人
  rationale: 保留庄重、直接而非侮辱性的称呼；现代语境下虽略显书面，但符合经文体裁。
theological_decisions:
- issue: “没有罪”的范围
  choice: 保留宽泛的“谁没有罪”
  alternative: 译作“谁没有犯过这种罪”或“谁在这件事上无罪”
  rationale: 现有见证并未限定罪的类别；缩窄会替文本化解其伦理与神学张力。
- issue: 耶稣“不定罪”与“不要再犯罪”的关系
  choice: 并列保留宽免与停止犯罪的命令
  alternative: 将后句解释性改写为悔改条件或赦免结果
  rationale: 不添加文本未明说的因果或条件，让怜悯与道德要求同时保持原有力度。
- issue: 耶稣在地上所写的内容
  choice: 仅译“写字”，不说明内容
  alternative: 补充所写的是控告者的罪、律法条文或姓名
  rationale: 见证没有交代所写内容，任何具体说明都会引入后世推测。
- issue: 方括号内文字的地位
  choice: 原样保留方括号
  alternative: 无标记地并入正文或删除
  rationale: 所给见证以方括号标出补入或不确定文字；保留标记可诚实呈现文本证据的不稳定性。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。叙事以简洁短句推进，对话自然但不口语化。因现阶段只有公版英文见证可供直接使用，本稿属于有明确标示的暂定译稿；没有把英文见证冒充为希腊文或拉丁文原文，也未对其方括号内容作静默取舍。
