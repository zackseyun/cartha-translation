review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实呈现所给英文见证，并保留了该见证中所有方括号所标的补入或不确定文字。需要收紧两处：英文见证只说把妇人“置于中间”，并未明确说她一直“站着”；结尾也只说妇人“在中间”，不宜补作“仍站在”。“such”宜译为较不预设性别的“这样的人”。
  naturalness: 整体为自然、庄重的现代标准汉语。将“在地上写字”调整为“在地上写”，既保留原文未说明书写内容的含混，也更紧凑。
  terminology: “经学家”“法利赛人”“律法”“定你的罪”“妇人”等术语及称呼均可保留。“行淫”符合庄重的经文语体；不应将“没有罪”缩窄为没有犯同类罪。
  issues:
  - severity: medium
    issue: “那仍站在中间的妇人”补入了持续站立的状态。
    rationale: 所给见证仅称她“where she was, in the midst”（她所在之处，在中间）；虽前文的“set her in the midst”可与站立相关，却不足以支持“仍站着”这一持续状态。应保留位置而不增添姿态。
  - severity: low
    issue: “用石头打死这样的妇人”将 such 明确限定为“妇人”。
    rationale: 语境所指确为被带来的妇人，但英文见证的 such 语法上较宽，译作“这样的人”可更贴近措辞且不改变所述案件。
  - severity: low
    issue: “写字”较“wrote”略具体。
    rationale: 见证未说明耶稣写下的是文字、符号或何种内容；译作“写”可保留未说明性。
