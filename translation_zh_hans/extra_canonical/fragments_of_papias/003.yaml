base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/003.yaml
  text: 'And each man went to his own house, but Jesus went to the Mount of Olives. Early in the morning he came again to the temple, [and all the people came to him; and he sat down and taught them]. The scribes and the Pharisees brought a woman caught in adultery, and after placing her in the middle, they said to him, “Teacher, this woman was caught in adultery, in the very act. Now in the law Moses commanded [us] to stone such. What then do you say?” [They said this to test him, so that they might have something with which to accuse him.] But Jesus stooped down and wrote on the ground with his finger. When they continued questioning [him], he straightened up and said [to them], “Let the one among you who is without sin be the first to throw a stone at her.” Again he stooped down and wrote on the ground. When they heard this, they went out one by one, beginning with the oldest. He was left alone, and the woman, where she was, in the middle. Jesus straightened up and said to her, “Woman,
    where are they? Did no one condemn you?” She said, “No one, Lord.” Jesus said, “Neither do I condemn you. Go on your way; from now on, sin no more.”


    PERICOPE ADULTERAE; see Westcott and Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 sq., 91; Lightfoot, Essays on Supernatural Religion, p. 203 sq.'
translation:
  language: zh_hans
  text: '各人都回自己家去了；耶稣却到橄榄山去。清早，他又来到圣殿，[众百姓都到他那里；他便坐下教导他们]。经学家和法利赛人带来一个行淫时被抓住的妇人，叫她站在众人中间，就对耶稣说：“老师，这妇人正在行淫时被抓住了。摩西在律法上吩咐[我们]用石头打死这样的妇人。那么，你怎么说呢？”[他们说这话，是要试探他，好找到控告他的把柄。]耶稣却弯下身子，用指头在地上写字。他们还是不断地问[他]，他便直起身来，对[他们]说：“你们中间谁没有罪，谁就先拿石头打她。”随后，他又弯下身子在地上写字。他们听见这话，就从年长的开始，一个一个地出去了。只剩下耶稣和那仍站在中间的妇人。耶稣直起身来，对她说：“妇人，他们在哪里？没有人定你的罪吗？”她说：“主啊，没有。”耶稣说：“我也不定你的罪。去吧；从今以后不要再犯罪了。”[a]


    “行淫妇人的段落”（Pericope Adulterae）；参见 Westcott 与 Hort，《原文希腊文新约》（The New Testament in the Original Greek），第一卷，第241页；第二卷，第82页及以下、第91页；Lightfoot，《论超自然宗教》（Essays on Supernatural Religion），第203页及以下。[b]'
