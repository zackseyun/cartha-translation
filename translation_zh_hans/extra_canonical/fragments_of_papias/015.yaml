base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/015.yaml
  text: 'Apollinarius: “Judas did not die by hanging, but lived on, having been cut down before he was suffocated. And the Acts of the Apostles show this, that, falling headlong, he burst asunder in the midst, and all his bowels gushed out. This fact is related more clearly by Papias, the disciple of John, in the fourth (book) of the Exposition of the Oracles of the Lord, as follows:—


    “Judas walked about in this world a terrible example of impiety; _ his flesh swollen to such an extent that, where a waggon [text unclear] pass with ease, he was not able to pass, no, not even the mass of his head merely. They say that his eyelids swelled to such an [lacuna] t that he could not see the light at all, while as for his eyes they were not visible even by a physician looking through an instrument, so far had they sunk from the surface....”


    Compiled from Cramer, Catena ad Acta SS. Apost. (1838), p. 12 sq., and other sources.'
translation:
  language: zh_hans
  text: '亚波里拿留：


    “犹大并不是吊死的；他在窒息以前被人解下来，仍然活着。《使徒行传》也说明了这一点：他一头栽下，身体从中间裂开，肠子全都流了出来。约翰的门徒帕皮亚在《主的圣言释义》第四卷中把这件事讲得更清楚，原文如下：


    ‘犹大在这世上四处行走，成了不敬虔的可怕鉴戒。他的肉身肿胀到一个地步：一辆车本可轻易通过的地方[a]，他却过不去；不，单是他那硕大的头也过不去。据说，他的眼皮肿胀得如此……[b]，以致完全看不见光；至于他的眼睛，就连医生用器械察看也看不见，因为眼睛已经深深陷入，远离表面……’”


    据克雷默《使徒行传注释链》（1838年）第12页及以下各页和其他资料汇编。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处所据英文见证文字残缺；大意似为“一辆车本可轻易通过的地方”。
    reason: 底本文字受排印或传抄损坏，句中缺失词语，不能无标记地确定补足。
  - marker: b
    text: 此处原见证有缺文，无法确定眼皮肿胀程度的完整表述。
    reason: 保留来源中的实际缺环，避免把推测补文当作正文。
lexical_decisions:
- source_word: die by hanging
  choice: 吊死
  rationale: 简洁表达死亡方式，同时保留亚波里拿留关于犹大并未因悬吊而死的主张。
- source_word: cut down
  choice: 被人解下来
  rationale: 在悬吊语境中自然明确，且不额外说明施事者身份。
- source_word: falling headlong
  choice: 一头栽下
  rationale: 符合现代汉语习惯，并保留头朝前坠落的画面。
- source_word: impiety
  choice: 不敬虔
  rationale: 保留宗教与道德双重含义，避免窄化为一般的恶行。
- source_word: Oracles of the Lord
  choice: 主的圣言
  rationale: “圣言”可涵盖神圣宣告或教导，不将其过度限定为某一特定文类。
- source_word: instrument
  choice: 器械
  rationale: 原见证没有明确器具种类，采用宽泛译法以保留不确定性。
- source_word: mass of his head
  choice: 他那硕大的头
  rationale: 依上下文表达头部异常肿大的体积，采用自然且不弱化夸张性的汉语。
theological_decisions:
- issue: 亚波里拿留如何协调犹大悬吊与《使徒行传》中的死亡叙述
  choice: 按见证原文直译为犹大在窒息前被解下，后来一头栽下而裂开
  alternative: 将两段叙述合并或解释为同一瞬间发生
  rationale: 本段明确提出一种协调方式；译文只呈现其说法，不替作者辩护，也不裁定其历史可靠性。
- issue: “约翰的门徒”中“约翰”的身份
  choice: 保留为“约翰的门徒”
  alternative: 明确译作“使徒约翰的门徒”
  rationale: 所给见证只称 John；不擅自解决古代传统中可能存在的身份问题。
- issue: 怪诞身体描写的性质
  choice: 作为引文中的传统叙述如实保留
  alternative: 弱化为比喻或道德寓言
  rationale: 文本以身体状况作为不敬虔的鉴戒来叙述，但并未明说这是比喻，因此不作寓意化处理。
