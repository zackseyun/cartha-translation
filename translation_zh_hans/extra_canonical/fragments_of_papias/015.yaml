  terminology: “吊死”“被人解下来”“不敬虔”“主的圣言”“约翰的门徒”均可保留。“主的圣言释义”是对 supplied witness 中 Exposition of the Oracles of the Lord 的审慎处理；不应擅自将“约翰”定为使徒约翰，或将“器械”具体化为某种医疗器具。
