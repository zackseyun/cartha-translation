  register: 采用现代、庄重而清楚的书面普通话。引文层级以双引号和单引号区分；保留结尾省略号及汇编说明。由于希腊文/拉丁文原始见证尚待复核，本稿明确依所提供的公版英文见证起草，并对两处损坏文字加注，不作无依据的复原。
