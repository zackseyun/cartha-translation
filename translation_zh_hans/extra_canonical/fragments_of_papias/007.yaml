base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/007.yaml
  text: 'With regard, however, to the inspiration of the book (that is, the Apocal—


    mean, the Divine) and Cyril, and men of an older generation as well, [Papias?], Irenzeus, Methodius, and Hippolytus bear testimony to its genuineness.


    ANDREAS OF C[A]ESAREA, preface to the Apocalypse.'
translation:
  language: zh_hans
  text: '不过，关于这卷书（即《启示录》）受默示一事，……[a]格列高利（我是指那位“神学家”格列高利）、居里禄，以及更早一代的人——〔帕皮亚？〕[b]、爱任纽、梅多丢和希波吕托——都为它的真实性作见证。


    ——凯撒利亚的安德烈，《启示录》序言[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据公版英文见证在此处残缺，现存文字从“Apocal—”跳至“mean, the Divine”；本译不据推测补齐缺文。通行复原可能包含《启示录》书名后的若干话以及格列高利之名，但仍须直接核对希腊文或拉丁文见证。
    reason: 明确标示底本缺损，避免把后人的复原当作确定正文。
  - marker: b
    text: 所据见证中的姓名在此处讹损；“帕皮亚”是根据上下文和本残篇的通行归属作出的可能辨认。
    reason: 保留专名辨认的不确定性。
  - marker: c
    text: 这段话由后期作者凯撒利亚的安德烈保存于其《启示录》序言中，并非帕皮亚著作的直接传本。
    reason: 说明残篇的间接传承来源。
lexical_decisions:
- source_word: inspiration
  choice: 受默示
  rationale: 沿用现代中文基督教语境中清楚而庄重的表达，同时保留原文关于该书神圣启示性质的主张。
- source_word: the Apocalypse
  choice: 《启示录》
  rationale: 采用该书在现代简体中文中的通行名称。
- source_word: the Divine
  choice: “神学家”格列高利
  rationale: 此处是格列高利的传统称号，译作“神学家”比直译为“神圣者”更能传达其历史所指；因底本残缺，置于明确的说话结构中但不补入更多失落内容。
- source_word: genuineness
  choice: 真实性
  rationale: 保留其可能涉及真伪、可信归属或正统地位的宽泛含义，不擅自窄化为“使徒著作”或“正典性”。
- source_word: bear testimony
  choice: 作见证
  rationale: 贴近原文见证用语，并符合庄重而自然的现代汉语。
theological_decisions:
- issue: 《启示录》“受默示”与“真实性”的关系
  choice: 分别译出“受默示”与“真实性”
  alternative: 将两者合并解释为“正典地位”
  rationale: 原文使用两个不同概念；合并为“正典性”会消除其潜在的历史与神学张力。
- issue: 残缺处是否据推测复原
  choice: 以省略号保留缺文，并加注说明
  alternative: 依据其他版本补成完整句子
  rationale: 所提供的见证文本在“Apocal”与“mean”之间残缺，且尚未完成希腊文或拉丁文核查，不宜把推测性复原直接写入正文。
- issue: 帕皮亚姓名的辨认
  choice: 正文以〔帕皮亚？〕标示疑读
  alternative: 无保留地写作“帕皮亚”
  rationale: 见证文本该处已经讹损；虽从本残篇的归属和通行复原看很可能是帕皮亚，仍应公开保留文本不确定性。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。人名使用现代中文学术及教会文献中较常见的译名；句法尽量自然，同时以省略号、方括号式疑读和脚注公开呈现底本残缺及传承层次。
