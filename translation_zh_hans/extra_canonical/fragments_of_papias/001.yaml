    reason: 如实呈现文本状况，避免把现代修复误当作古代原文。
lexical_decisions:
- source_word: John the Divine and Apostle
  choice: 神学家兼使徒约翰
  rationale: “Divine”在此是约翰的传统称号，意为讲论神圣之事的神学家，并非称约翰为神；译为“神学家”可避免现代汉语中的误解。
- source_word: his hearers
  choice: 他的听众
  rationale: 保留见证文本关于帕皮亚和坡旅甲曾亲自聆听约翰的关系表述，不擅自强化为正式门徒关系。
- source_word: flourished / became distinguished
  choice: 声名卓著／声名渐著
  rationale: 按古代史传语境自然表达人物在某时期活跃并享有声望的意思，避免机械译作与植物有关的“繁盛”。
- source_word: Asia
  choice: 亚细亚
  rationale: 这里指罗马帝国的亚细亚行省；沿用历史地名“亚细亚”，避免被理解为整个现代亚洲。
- source_word: diocese of Hierapolis
  choice: 希拉波利斯教区
  rationale: 依现有英语见证译出其教会辖区用语，同时不借此断定该时期教区制度的精确形态。
theological_decisions:
- issue: 约翰的称号“Divine”可能造成神性误读
  choice: 神学家兼使徒约翰
  alternative: 神圣的使徒约翰／神者约翰
  rationale: “神学家”较符合传统称号所指的宣讲、论述神圣奥秘者，也不会暗示约翰具有神性。
- issue: “his hearers”的指代与关系强度
  choice: 将“他的”理解为约翰，并译作“听众”
  alternative: 译作“门徒”或保留不明指代
  rationale: 上下文最自然地指向约翰，但原见证仅表达听闻关系；因此不将其提升为更强的师徒身份。
- issue: 第二段残缺内容
  choice: 以方括号明确标示残缺及可辨主题
  alternative: 根据其他版本补成完整句子
  rationale: 所给见证遭严重排印或OCR损坏，且尚未完成希腊文／拉丁文原始见证复核；不应以推测填补并制造虚假确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。人名使用中文基督教史常见译名：爱任纽、约翰、帕皮亚、坡旅甲、优西比乌；地名采用希拉波利斯、士每拿、亚细亚。因直接原文审查尚未完成，本稿明确维持暂译性质，并对损坏处作可见标记。
