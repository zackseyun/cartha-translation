base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/016.yaml
  text: 'Here begins the argument to the Gospel according to John.


    The Gospel of John was made known and given to the churches by John while he still remained in the body, as (one) Papias by name, of Hierapolis, a beloved disciple of John, related in his five exoteric (read: exegetical) books. But he wrote down the Gospel correctly at John’s dictation.


    A Vatican manuscript of the ninth century.


    XX


    For John, the last of these, surnamed the Son of Thunder, when he was already a very old man—as Irenaeus and Eusebius and a succession of trustworthy historians have handed down to us—about the time when terrible heresies had arisen, dictated the Gospel to his own disciple, the virtuous Papias of Hierapolis, to fill up what was lacking in those who before him had proclaimed the word to the nations throughout all the earth.


    Catena Patrum Graecorum in Saint John, published by B. Corder.'
translation:
  language: zh_hans
  text: '这里开始《约翰福音》的提要。


    约翰还在世时，就亲自使《约翰福音》为众教会所知，并将它交给众教会。希拉波立人帕皮亚——约翰的一位爱徒——在他的五卷“通俗著作”[a]中这样记述。他则按照约翰的口授，准确地写下了这部福音书。[b]


    ——梵蒂冈所藏一份九世纪抄本


    二十[c]


    约翰是这些人中最后的一位，别号“雷霆之子”。据爱任纽、优西比乌以及历代可信的史家传给我们的说法，他已年届高龄时，正值可怕的异端兴起，便把这部福音书口授给自己的门徒、品德高尚的希拉波立人帕皮亚，为要补足先前那些向普天下万民宣讲圣道之人的不足。[d]


    ——《希腊教父〈圣约翰福音〉注释链》，B. 科尔德刊行[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “通俗著作”所据见证原作 exoteric；编者建议校读为 exegetical，即“释经著作”。由于希腊文或拉丁文原始见证尚待直接复核，正文暂保留所给见证的读法。
    reason: 保存关键校勘异文，不在正文中静默采用修订。
  - marker: b
    text: 本段见于梵蒂冈所藏一份九世纪抄本。此处所说约翰口授、帕皮亚写录，是该晚期见证所保存的说法。
    reason: 说明见证年代与性质，避免读者误认为这是帕皮亚著作的直接传本。
  - marker: c
    text: 所提供的材料在“片段十九”之后又收入题为“二十”的一段；这里依原材料保留其分段编号。
    reason: 用户所标篇目与所给正文范围不完全一致，需透明标示文本边界。
  - marker: d
    text: “补足……的不足”也可能理解为补足先前宣讲者所留下的缺漏；原句没有明确说明所缺的是记事、教导，还是书面福音材料。
    reason: 保留原句真实的语义含混与历史解释空间。
  - marker: e
    text: 拉丁文书名 Catena Patrum Graecorum in S. Joannem，意为汇集希腊教父论《圣约翰福音》的“注释链”；B. 科尔德为其刊行者。
    reason: 交代引文来源标题，帮助普通读者理解“注释链”这一文献类型。
lexical_decisions:
- source_word: argument
  choice: 提要
  rationale: 此处是古代抄本中置于福音书正文之前的内容简介或序言性标题；“提要”比现代论证意义的“论点”更合语境。
- source_word: while he yet remained in the body
  choice: 还在世时
  rationale: 保留“尚活着”的意思，同时以自然现代汉语表达；不将其扩展为关于身体与灵魂关系的教义陈述。
- source_word: made known and given to the Churches
  choice: 使……为众教会所知，并将它交给众教会
  rationale: 分别保留“使人知晓”和“交付”两个动作。
- source_word: beloved disciple
  choice: 爱徒
  rationale: 简洁表达受钟爱的门徒关系，不把帕皮亚与《约翰福音》中专称的“耶稣所爱的门徒”混同。
- source_word: exoteric (read exegetical) books
  choice: “通俗著作”[a]
  rationale: 正文依现存英文见证的表层读法翻译，并在脚注保存校读为“释经著作”的文本问题。
- source_word: at the dictation of John
  choice: 按照约翰的口授
  rationale: 明确表达由约翰口述、帕皮亚执笔的见证所声称关系。
- source_word: Son of Thunder
  choice: 雷霆之子
  rationale: 保留称号的形象性及与福音书传统的呼应。
- source_word: the word
  choice: 圣道
  rationale: 在早期基督教宣讲语境中表达所传的信息，同时不擅自限定为某一卷书或单一教义。
- source_word: to fill up what was lacking
  choice: 为要补足……的不足
  rationale: 保留原句略显含混的关系，不具体断定缺少的是材料、叙事还是神学内容。
theological_decisions:
- issue: 帕皮亚与约翰的关系
  choice: 按见证直译为“约翰的一位爱徒”及“自己的门徒”
  alternative: 将约翰具体认定为使徒约翰，或区分为“长老约翰”
  rationale: 所给见证只称“约翰”；译文不替古代见证解决人物身份争议。
- issue: 《约翰福音》的写作方式
  choice: 保留约翰口授、帕皮亚写录的明确说法
  alternative: 弱化为帕皮亚协助编写或仅作见证
  rationale: 这是该片段自身的历史主张，翻译应忠实呈现而不判断其史实可靠性。
- issue: “补足不足”的对象与性质
  choice: 保留为“补足先前……之人的不足”
  alternative: 解释为补足前三卷福音书遗漏的内容
  rationale: 原见证没有在此明确说是前三卷福音书，也没有界定“不足”的具体性质。
- issue: “异端”评价
  choice: 译作“可怕的异端”
  alternative: 中性化为“严重的不同教说”
  rationale: 原见证带有强烈价值判断；历史文本翻译应保存其语气，而非现代化地消解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。因希腊文/拉丁文原文复核尚未完成，本稿以所给公版英文见证为暂定底本，并参考英文 POB 作为审校层。正文保留片段十九之后附带的片段二十及来源题记；以脚注明示校读、见证年代和篇目边界。
