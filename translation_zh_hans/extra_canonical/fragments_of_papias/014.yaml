base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/014.yaml
  text: 'Nor again (does Stephanus follow) Papias, the bishop and martyr of Hierapolis, nor Irenzeus, the holy bishop of Lyons, when they say that the kingdom of heaven will consist in enjoyment of certain material foods.


    PHOTIUS, Aibliotheca 232, on Stephanus Gobarus.'
translation:
  language: zh_hans
  text: '司提反也不赞同希拉波利的主教兼殉道者帕皮亚，也不赞同里昂的圣洁主教爱任纽，因为他们说，天国将包含对某些物质食物的享用。[a]


    ——佛提乌，《文库》第232篇，论司提反·戈巴鲁斯'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据J. B. Lightfoot所收公版英文见证翻译；希腊文或拉丁文原始见证尚待直接核校。英文见证中的“Irenzeus”及“Aibliotheca”显属排印形式，分别按Irenaeus（爱任纽）与Bibliotheca（《文库》）处理。
    reason: 资料明确说明原语言审校尚未完成，且见证含明显排印讹误；脚注向读者交代文本基础与校正常规。
lexical_decisions:
- source_word: does Stephanus follow
  choice: 司提反也不赞同
  rationale: 这里的“follow”表示接受或追随某人的观点，而非身体上的跟随；按现代汉语自然表达译为“不赞同”。
- source_word: bishop and martyr
  choice: 主教兼殉道者
  rationale: 保留两个身份称谓，并以“兼”清楚表明二者同指帕皮亚。
- source_word: the holy bishop
  choice: 圣洁主教
  rationale: 保留见证文本中的尊称性形容词，同时避免把它扩展成后世正式封圣称号。
- source_word: kingdom of heaven
  choice: 天国
  rationale: 采用现代中文基督教文献中通行且简洁的表达。
- source_word: will consist in enjoyment of certain material foods
  choice: 将包含对某些物质食物的享用
  rationale: 保留“物质食物”与“享用”的具体性，也避免将“consist in”过度解释为天国完全等同于这些享受。
theological_decisions:
- issue: 天国与物质食物享用之间关系的强度
  choice: 译作“将包含……的享用”
  alternative: “将以享用某些物质食物为其内容”或“就在于享用某些物质食物”
  rationale: 英文见证的“consist in”可表达构成或主要内容；本译文采取较不过度限定的表述，以免把片段中的概述强化为排他性的完整定义。
- issue: “holy”是否译成正式圣徒头衔
  choice: 译作描述性的“圣洁”
  alternative: “圣爱任纽主教”
  rationale: 原见证是在修饰主教，未必表示后世制度化的封圣称号；采用描述性译法较能保留历史语境而不引入宗派传统。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。人名依中文学界和教会文献常见译法处理：Papias译“帕皮亚”，Irenaeus译“爱任纽”，Photius译“佛提乌”，Stephanus Gobarus译“司提反·戈巴鲁斯”。标题Bibliotheca译作《文库》。由于当前仅有公版英文见证，整体定为暂定的最优对等译稿。
