review_pass:
  verdict: revise
  source_fidelity: 现稿正确辨认了句子的主语为司提反，并保留帕皮亚、爱任纽及其关于天国的说法；但将“will consist in”译为“将包含”明显弱化了英文见证所表达的构成性关系。由于直接希腊文／拉丁文核校仍待进行，修订仅按所给英文见证，避免进一步推断。
  naturalness: “司提反也不赞同……也不赞同……”虽可理解，重复结构略显生硬，且不如以“帕皮亚和爱任纽”为并列宾语清楚。“某些物质食物”可改为“某些物质性的食物”，使修饰关系更明确。
  terminology: “帕皮亚”“爱任纽”“佛提乌”“希拉波利”“天国”均可保留。“圣洁主教”建议改为“圣洁的主教”，在现代汉语中更自然，同时仍不将 holy 擅自处理为制度化圣号。引文出处宜保留《文库》第232篇及“论司提反·戈巴鲁斯”的关系。
  issues:
  - severity: medium
    issue: “will consist in”译作“将包含”
    rationale: “包含”只表示天国含有这类享用；英文见证说天国“将以／在于”这种享用，语义强度更高。为忠实保留见证的论断，须恢复构成性关系，而不把它扩展为排他性定义。
  - severity: low
    issue: 并列否定的汉语句式不够清晰自然
    rationale: “司提反也不赞同……，也不赞同……”可改为“司提反也不认同……帕皮亚和……爱任纽”，更清楚地表达英文中 Stephanus 不追随二人的观点。
  revised_text: '司提反也不认同希拉波利的主教兼殉道者帕皮亚和里昂圣洁的主教爱任纽；他们说，天国将以享用某些物质性的食物为其内容。[a]


    ——佛提乌，《文库》第232篇，论司提反·戈巴鲁斯'
  revised_footnotes:
  - marker: a
    text: 本段暂据 J. B. Lightfoot 所收公版英文见证翻译；希腊文或拉丁文原始见证尚待直接核校。英文见证中的“Irenzeus”及“Aibliotheca”显属排印形式，分别按 Irenaeus（爱任纽）与 Bibliotheca（《文库》）处理。
    reason: 资料明确说明原语言审校尚未完成，且见证含明显排印讹误；脚注向读者交代文本基础与校正常规。
  revision_rationale: 修订将“consist in”译为“以……为其内容”，保留其构成性含义，但不以“完全在于”添加英文见证未明说的排他性。并重组并列宾语和“holy bishop”的定语结构，使现代书面汉语更顺畅。
