review_pass:
  verdict: revise
  source_fidelity: 译稿准确传达了司提反努斯不接受帕皮亚和爱任纽所持观点这一主旨，也保留了帕皮亚的主教、殉道者身份及爱任纽的尊称。不过，“will consist in”译为“将包含”明显减弱了英文见证所表达的构成性关系；在原文语言尚待核校的前提下，宜按现有见证较直译为“在于”。
  naturalness: “司提反也不赞同……也不赞同……”可理解，但将“follow”处理为“追随……的说法”更贴合论战／意见语境，句法也更清楚。将“圣洁主教”调整为“圣洁的……主教”，符合现代汉语中形容词修饰名词的自然搭配。
  terminology: “帕皮亚”“爱任纽”“佛提乌”“天国”及《文库》均可保留。“物质食物”改为“物质性的食物”，既保留 material 的限定，也较自然。保留资料来源脚注，以明确这仍是根据英文公版见证所作的暂定翻译。
  issues:
  - severity: medium
    issue: “will consist in enjoyment”译作“将包含对……的享用”。
    rationale: “包含”只表示其中有此一项，而 consist in 在英文见证中表示天国的内容或构成所在。原译不必要地弱化了论述强度。
  - severity: low
    issue: “does Stephanus follow”译作“司提反也不赞同”。
    rationale: 虽不算误译，但 follow 在此更具体地指追随、接受有关人物的主张；译出“追随……的说法”能保留原句的论辩结构。
  revised_text: '司提反也不追随希拉波利的主教兼殉道者帕皮亚，也不追随圣洁的里昂主教爱任纽的说法；他们说，天国在于享用某些物质性的食物。[a]


    ——佛提乌，《文库》第232篇，论司提反·戈巴鲁斯'
  revised_footnotes:
