    reason: 如实披露传承来源和当前起草依据，并保留末句的文本歧义。
lexical_decisions:
- source_word: the times of the Kingdom
  choice: 国度的时期
  rationale: 保留末世性“国度”及复数时期的时间意味，不擅自具体化为某一宗派的千禧年体系。
- source_word: the righteous shall rise from the dead and reign
  choice: 义人将从死人中复起并掌权
  rationale: “复起”明确指从死亡中起来；“掌权”保留 reign 的统治含义。
- source_word: creation renewed and freed from bondage
  choice: 受造界也将焕然一新，摆脱奴役
  rationale: “受造界”比“创造”更自然地指全部被造秩序，并保留奴役/释放的意象。
- source_word: fatness of the earth
  choice: 大地的肥沃
  rationale: 以现代汉语自然表达土地丰饶，而不误译为物质性的“脂肪”。
- source_word: measures
  choice: 量器
  rationale: 原见证未提供足以确定具体容量单位的资料，故保留不确定性并加注。
- source_word: credible to them that believe
  choice: 对信的人来说是可信的
  rationale: 保留“相信”与“可信”之间刻意的语义呼应，不改写为普遍事实判断。
- source_word: all subjection
  choice: 完全顺服人
  rationale: 自然表达动物彻底服在人之下的含义，同时避免不必要的政治化措辞。
theological_decisions:
- issue: 国度时期的性质
  choice: 仅译作“国度的时期”
  alternative: 明确译为“千禧年”或某种既定末世阶段
  rationale: 见证文本本身未在此处使用“千禧年”，不应导入特定末世论框架。
- issue: 丰产描述应按字面还是象征理解
  choice: 按见证原有的具体数字和拟人化话语直译
  alternative: 解释为象征性的极大丰收
  rationale: 译文应保留古代见证的表达，不在正文中裁定其解释方式。
- issue: “约翰”身份
  choice: 保留“主的门徒约翰”及帕皮亚“曾听约翰讲道”的表述
  alternative: 明确认定为使徒约翰或长老约翰
  rationale: 相关古代传统存在身份争议，当前英文见证不足以消除歧义。
- issue: 末句“他们必看见”的指称
  choice: 译为“那些活到那时期的人必会看见”
  alternative: 译为“那些来到这些事面前的人必会看见”
  rationale: 依英文见证的 times 理解为到达/活到那些时期的人，同时以脚注提示源语言复核尚待完成。
- issue: 犹大的身份
  choice: 叛徒犹大
  alternative: 加上“加略人”
  rationale: 见证仅称“叛徒犹大”，不补入正文未明说的身份限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。引文层次以中文引号区分；保留夸张数字、受造界更新、动物顺服和葡萄串说话等古代意象，不作去神话化改写。人名采用基督教中文文献中常见译法“帕皮亚、坡旅甲、爱任纽”。
