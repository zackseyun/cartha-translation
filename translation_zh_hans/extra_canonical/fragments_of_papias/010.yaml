base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/010.yaml
  text: 'So then the more ancient expositors of the churches, I mean Philo, _ the philosopher, and contemporary of the Apostles, and the famous Papias _of Hierapolis, the disciple of John the Evangelist...and their associates, interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ.


    ANASTASIUS OF SINAI, Contempl. Anagog. in Hexaém. vii.'
translation:
  language: zh_hans
  text: '因此，教会中更古代的解经家——我是指哲学家斐洛，他与使徒们同时代；还有著名的希拉波利斯人帕皮亚，他是福音书作者约翰的门徒……以及与他们同道的人——都从属灵的意义解释有关乐园的论述，并把这些论述应用于基督的教会。[a]


    ——西奈的阿纳斯塔修斯，《六日创造默观的升义解释》第七卷[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据公版英语见证译出，尚待希腊文或拉丁文原始见证复核。见证中的省略号予以保留。“把这些论述应用于”也可理解为“认为这些论述是指”或“使这些论述与……相联系”。
    reason: 交代间接翻译依据、文本缺省及关键短语的真实歧义。
  - marker: b
    text: 作品名据拉丁文缩写 Contempl. Anagog. in Hexaém. 暂译；其书名及卷次形式仍需依据原始版本核定。
    reason: 出处标题目前仅由英语见证中的缩写提供，不能伪装成已经完成源语言校勘。
lexical_decisions:
- source_word: more ancient expositors of the churches
  choice: 教会中更古代的解经家
  rationale: 保留比较级“更古代”及其教会语境；“解经家”自然表达解释经文或教会传统论述之人。
- source_word: Philo, the philosopher
  choice: 哲学家斐洛
  rationale: 采用现代汉语中常见的人名译法，并保留其身份称谓。
- source_word: contemporary of the Apostles
  choice: 与使徒们同时代
  rationale: 直译时间关系，不额外推断斐洛与使徒之间有个人交往。
- source_word: Papias of Hierapolis
  choice: 希拉波利斯人帕皮亚
  rationale: 以籍贯表达法保存“of Hierapolis”，避免误解为头衔。
- source_word: the disciple of John the Evangelist
  choice: 福音书作者约翰的门徒
  rationale: “Evangelist”在此指福音书作者；此译法比现代汉语中可能含混的“传福音者约翰”更清楚，同时不判定其具体身份争议。
- source_word: Paradise
  choice: 乐园
  rationale: 保留基督教文献中的传统用语及其神学意涵，不缩窄为一般的“天堂”或特定地理地点。
- source_word: interpreted ... spiritually
  choice: 从属灵的意义解释
  rationale: 表达解释方法，而非断言文本只有非字面的意义。
- source_word: referred them to the Church of Christ
  choice: 把这些论述应用于基督的教会
  rationale: “referred ... to”在此表示将相关乐园之言对应或归用于教会；“应用于”保持可读性，同时在脚注说明可能译法。
theological_decisions:
- issue: 乐园论述与教会的关系
  choice: 把这些论述应用于基督的教会
  alternative: 认为这些论述是指基督的教会／使这些论述与基督的教会相联系
  rationale: 底本文句可能涵盖对应、归指或应用等意思；正文采用自然而不过度排他的说法，并以脚注保留语义范围。
- issue: “约翰”的身份
  choice: 福音书作者约翰
  alternative: 传福音者约翰／圣史约翰
  rationale: 依英语见证的称号翻译，不进一步认定此约翰必然等同于使徒约翰，以免解决原引文未解决的历史问题。
- issue: 属灵解释是否排除字面解释
  choice: 从属灵的意义解释
  alternative: 作寓意解释
  rationale: “属灵”忠实保留见证用语；不用“纯属寓意”等措辞，以免暗示作者排斥一切字面层面。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原见证的省略号和引文归属。由于源语言复核尚未完成，译文严格标为基于公版英语见证的暂定稿；不补写缺失内容，也不将“属灵解释”扩张为特定宗派的教会论。
