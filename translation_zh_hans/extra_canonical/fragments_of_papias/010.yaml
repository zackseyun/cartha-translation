review_pass:
  verdict: revise
  source_fidelity: 该稿总体忠实于所给英语见证，并适当地保留了见证本有的省略号。不过，“more ancient expositors”译作“更古代的解经家”在汉语中不自然；“interpreted ... spiritually”宜明确为“按属灵的意义领会／解释”，而非生硬的“从属灵的意义解释”。“referred them to”以“归于”较贴近其将乐园相关言论指向教会的释义动作，同时不把它限缩为实际应用。
  naturalness: 需小幅润色为庄重、自然的现代汉语：“古时教会的释经者”“按属灵的意义领会”“与他们有关的人”均较顺畅。原出处的中文拟译书名和“第七卷”缺乏可核依据；正文保留拉丁文缩写引文更稳妥。
  terminology: “斐洛”“帕皮亚”“希拉波利斯”“乐园”“基督的教会”均可保留。“福音书作者约翰”忠实反映英文 witness 的 John the Evangelist，且不额外裁决身份问题。
  issues:
  - severity: low
    issue: “更古代的解经家”表达不自然。
    rationale: 汉语比较级“更古代”需要明确比较对象；这里宜译为“古时教会的释经者”，保留其古老前辈的意思而不补加比较基准。
  - severity: medium
    issue: “把这些论述应用于基督的教会”略偏向实践性应用。
    rationale: 英语 witness 的“referred them to”在此语境更像解释上的归指或指向；“把这些话归于基督的教会”较能保留此开放范围。
  - severity: low
    issue: 出处的中文书名及“第七卷”暂不宜定译。
    rationale: 所给见证仅有拉丁文缩写及“vii.”，无法安全确定完整书名、体裁和卷次；应保留缩写，并在脚注说明。
  revised_text: '因此，古时教会的释经者，即哲学家斐洛——他与使徒们同时代——以及著名的希拉波利斯人帕皮亚——他是福音书作者约翰的门徒——……还有与他们有关的人，都按属灵的意义领会有关乐园的话，并把这些话归于基督的教会。[a]


    ——西奈的阿纳斯塔修斯，《Contempl. Anagog. in Hexaém.》vii。[b]'
  revised_footnotes:
  - marker: a
    text: 本段暂据公版英语见证译出，尚待希腊文或拉丁文原始见证复核。见证中的省略号予以保留。“把这些话归于基督的教会”也可理解为“把这些话解释为指向基督的教会”或“使这些话与基督的教会相联系”。
    reason: 交代间接翻译依据、文本缺省及关键短语的语义范围。
  - marker: b
    text: 出处仅据英语见证所载拉丁文缩写“Contempl. Anagog. in Hexaém. vii.”保留；完整书名、作品体裁及“vii.”所指的篇章或卷次，仍须依据原始版本核定。
    reason: 避免在源语言和书目版本尚未复核时，将缩写扩展为未经证实的中文书名或卷次。
  revision_rationale: 修订仅改善汉语自然度，并使“属灵地解释”和“归指于基督的教会”的释义关系更贴近见证；没有补足省略内容，也没有裁断约翰身份或引文所涉及的教会论。出处信息改为保守保留原缩写，以避免不安全的书名及卷次拟定。
