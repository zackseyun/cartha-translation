base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/008.yaml
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
translation:
  language: zh_hans
  text: '帕皮亚残篇——残篇十一


    帕皮亚是这样说的——我逐字引述如下：


    “他也把管理宇宙秩序的权柄赐给了他们中的一些；显然，这些就是起初圣洁的天使。他吩咐他们好好运用自己的权柄。”


    接着他说：


    “然而，他们的秩序竟归于崩溃；因为那大龙，就是那古蛇，也称为撒但和魔鬼，被摔了下去，确实被摔到地上；他和他的众天使也一同被摔了下去。”[a]


    ——凯撒利亚的安德烈，《启示录注释》第34章，第12讲'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段目前依据公版英文见证翻译，尚待希腊文或拉丁文原始见证直接复核。底本扫描文字在“大龙”“魔鬼”和“他的”等处有明显缺损；这里依上下文及见证译者所示补全。
    reason: 如实标明当前材料仅为英文见证及其OCR缺损，避免把暂定复原冒充已经完成的原文校勘。
lexical_decisions:
- source_word: dominion
  choice: 管理……的权柄／运用自己的权柄
  rationale: 既保留统辖权的含义，也以现代汉语自然表达受托治理的语境。
- source_word: arrangement of the universe
  choice: 宇宙秩序
  rationale: 保留“安排、秩序、构造”的宽泛含义，不具体化为创造、天体运行或世界政权。
- source_word: their array came to nought
  choice: 他们的秩序竟归于崩溃
  rationale: 现有英文见证中的 array 可指编列、秩序或有序状态；此译法保留其抽象性，并表达 came to nought 的败坏、瓦解之意。
- source_word: commissioned
  choice: 吩咐
  rationale: 表达授予权柄之后交付职责的意思，避免现代行政语汇“委任”带来的生硬感。
- source_word: was cast down
  choice: 被摔了下去／被摔到地上
  rationale: 呼应《启示录》12章的形象化措辞，并保留原文重复所产生的强调。
theological_decisions:
- issue: 赐予权柄者的身份
  choice: 译作“他”，不在正文中明确补成“上帝”
  alternative: 译作“上帝”或“主”
  rationale: 见证文本仅以大写 He 指称，当前又尚待希腊文或拉丁文直接复核；保留代词可避免擅自确定其明说程度。
- issue: 天使起初的状态
  choice: “起初圣洁的天使”
  alternative: “原先为圣的天使”
  rationale: 直陈其初始圣洁状态，但不进一步解释其堕落的性质、时间或机制。
- issue: 末句中“他的众天使”的归属
  choice: 明确承接撒但，译作“他和他的众天使”
  alternative: “他连同那些天使”
  rationale: 英文见证清楚作 he and his angels，且与《启示录》12章的传统措辞一致；不扩展说明这些天使与前段天使是否完全同一群体。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留引文的重复和启示文学意象；出处中的拉丁文书名按内容译为《启示录注释》。由于源语言复核尚未完成，对“宇宙秩序”和“他们的秩序”等可能具有术语色彩的表达采取审慎、不过度解释的译法。
