review_pass:
  verdict: revise
  source_fidelity: 草稿正确将 Irenzeus 规范为“爱任纽”，也谨慎保留了“John the Eva...”的未完成状态；但正文把原文中的人物关系性插入语改成了“爱任纽叙述说，帕皮亚曾听过……”，使“帕皮亚曾听过约翰”看起来成为“叙述”的内容，而非对帕皮亚的限定描述。残缺的“Eva”也不宜在正文意译为“传福……者”，因为这已越过英语见证所保留的字面残片。
  naturalness: 修订采用破折号包围同位说明，既保留原句“爱任纽……记述”的结构，也使汉语句法清楚。将残片原样保留为拉丁字母“Eva……”比不完整的“传福……”者更自然且更审慎。
  terminology: “门徒”“曾听过”均恰当保留关系强度，不将 hearer 扩展为正式师承。“爱任纽”“帕皮亚”可保留。引文出处保留书信双重编号及章节。
  issues:
  - severity: medium
    issue: 关系从句被改写为“叙述”的宾语内容。
    rationale: 原英语见证的“a disciple of Papias who was a hearer ...”是描述爱任纽及帕皮亚关系的插入性说明，末尾“relates”并未明示其所记述的具体内容。现有语序会造成不必要的句法和意义重组。
  - severity: medium
    issue: 将残缺的“Eva”提示性译作“传福……者”。
    rationale: 尽管脚注说明未作确定补全，但“传福……者”已在正文赋予残片一个中文语义和词类。当前仅有英语见证且源语复核未完成，宜原样保留残片并用脚注说明。
  revised_text: '爱任纽——帕皮亚的门徒；帕皮亚曾听过约翰这位“Eva……”[a]——记述道。


    ——耶柔米《致狄奥多拉书》，第75（29）封信，第3章'
  revised_footnotes:
  - marker: a
    text: 现有英语见证在“John the Eva”处中断，且未标明抄本残损。正文将“Eva……”原样保留，不对这一未完成的称号作补全或释义；仍有待希腊文或拉丁文源语复核。
    reason: 忠实呈现见证中的字面残片，避免将其推定为“福音书作者”“传福音者”或其他完整称号。
  revision_rationale: 修订恢复了原见证的句法功能：爱任纽是叙述者，“帕皮亚的门徒”和帕皮亚曾听过约翰均为其身份说明，而不是爱任纽叙述的内容。对于“Eva”则以未翻译残片加省略号和脚注处理，最大限度保留现有证据的不确定性。
