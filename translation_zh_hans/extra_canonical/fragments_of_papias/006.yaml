  text: 'Irenzeus, a disciple of Papias who was a hearer of John the Eva[...], relates.


    —Jerome, To Theodora, Letter 75 (29), chapter 3.'
translation:
  language: zh_hans
  text: '帕皮亚的门徒爱任纽叙述说，帕皮亚曾听过约翰这位“传福……”者[a]。


    ——哲罗姆《致狄奥多拉书》，第75（29）封信，第3章'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有英语见证在“John the Eva”处中断，且没有注明抄本残损；这里不作确定补全。“传福……”仅提示残存词形可能的含义，仍有待希腊文或拉丁文源语复核。
    reason: 忠实标明底本文字不完整及当前证据限度，避免把推测写入正文。
lexical_decisions:
- source_word: Irenzeus
  choice: 爱任纽
  rationale: 按通行中文译名规范化该人名；英语见证中的“Irenzeus”对应 Irenaeus。
- source_word: a disciple of Papias
  choice: 帕皮亚的门徒
  rationale: 保留人物之间的师承关系，不增添其性质。
- source_word: who was a hearer of John
  choice: 帕皮亚曾听过约翰
  rationale: 将关系从句所指明确落实为帕皮亚；“hearer”按古代文献语境直译为“曾听过”，不擅自强化为正式门徒。
- source_word: the Eva
  choice: “传福……”者
  rationale: 英语见证在 Eva 处残缺；以最小限度的中文提示呈现其可能指向 evangelist 一词，同时用省略号保留残缺，未补定为“福音书作者”或“传福音者”。
- source_word: relates
  choice: 叙述说
  rationale: 采用自然现代汉语，清楚标示引述来源。
- source_word: Jerome ad Theodoram Epist. 75 (29) c. 3
  choice: 哲罗姆《致狄奥多拉书》，第75（29）封信，第3章
  rationale: 保留拉丁文引证中的书信对象、双重编号和章节信息。
theological_decisions:
- issue: “John the Eva”残缺称号的解释
  choice: 正文作“约翰这位‘传福……’者”，并加脚注说明残缺
  alternative: 补作“约翰这位福音书作者”或“传福音者”
  rationale: 现有底本只是公共领域英语见证，且希腊文/拉丁文源语复核尚待进行；不应把残缺处的可能含义定为完整称号。
- issue: “hearer”是否表示门徒身份
  choice: 译作“曾听过”
  alternative: 译作“门徒”或“亲炙者”
  rationale: 保留原句较宽泛的关系，不把听闻关系提升为正式师承。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。由于提供的见证本身残缺，正文以引号和省略号显出未完成的称号，并用脚注交代证据状态。人名采用中文学术与教会文献中较通行的“帕皮亚、爱任纽、哲罗姆、狄奥多拉”。
