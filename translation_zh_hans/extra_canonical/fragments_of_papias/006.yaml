review_pass:
  verdict: revise
  source_fidelity: 草稿正确保留了人际关系的基本结构：爱任纽是帕皮亚的门徒，而帕皮亚是约翰的听者；也没有将“hearer”提升为正式门徒身份。然而，见证只存留“John the Eva”这一未完成的英文字符串，正文将其译为“传福……者”虽有保留，却仍把残存字母转化为中文语义并添加“者”，超出可核实的见证文本。应直接保留未完成字符串，并以脚注说明。
  naturalness: “帕皮亚的门徒爱任纽叙述说”可以理解，但以分号分开人物关系和“relates”的叙述动作更清楚，也较符合汉语中处理残篇引文的方式。“曾聆听约翰”自然，并不暗示正式师承。
  terminology: “爱任纽”“帕皮亚”“狄奥多拉”可用。“耶柔米”是现代汉语教会史及学术写作中较通行的 Jerome 译名，宜替换“哲罗姆”。对于截断的称号，不宜使用“传福……者”这类释义性重构。
  issues:
  - severity: medium
    issue: 将“Eva”译作“传福……”者
    rationale: 英语见证及英语 POB 均仅显示未完成的“Eva”/“Eva[…]”；“传福”及“者”是对其可能词源和句法角色的推断。即使脚注保留不确定性，正文仍不应把该推断作为残篇所存文字。
  - severity: low
    issue: Jerome 译名采用“哲罗姆”
    rationale: “哲罗姆”可辨识，但“耶柔米”在中文基督教历史、教父研究和圣经学术语境中通常更为规范。
  revised_text: '爱任纽是帕皮亚的门徒；帕皮亚曾聆听约翰“Eva……”，爱任纽对此有所记述。[a]


    ——耶柔米《致狄奥多拉书》，第75（29）封信，第3章'
  revised_footnotes:
  - marker: a
    text: 现有英语见证在“John the Eva”处中断，且未标明抄本残损；因此正文保留未完成的“Eva……”，不作释义性或确定性的补全。其所依据的希腊文或拉丁文源语文本尚待复核。
    reason: 如实呈现现有见证所保留的截断字符串，避免把可能的“evangelist”等补全或中文释义写入正文。
  revision_rationale: 修订只处理可安全确定之处：将残缺的“Eva”原样保留而不释义，改善汉语句法，并采用较通行的“耶柔米”。“曾聆听”继续保留 hearer 的宽泛含义；不把它解释为门徒关系，也不补全约翰的未完成称号。
