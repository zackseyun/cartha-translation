  naturalness: “是在隐晦地指向——我想——”和“圣福音书作者约翰”略显生硬。“他这样说，是隐晦地指明（我想）……”及“圣福音史家约翰”更自然、庄重。书目信息也宜避免双重书名号嵌套造成的阅读阻碍。
