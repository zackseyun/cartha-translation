lexical_decisions:
- source_word: darkly indicating
  choice: 在隐晦地指向
  rationale: 保留原见证中表达含蓄、所指不明的语气，也保留作者以“我想”作出的推测。
- source_word: Hierapolis in Asia
  choice: 亚细亚希拉波利
  rationale: “Asia”在此指古代罗马行省亚细亚，并非现代亚洲；采用常见历史地名译法。
- source_word: flourished
  choice: 活跃于
  rationale: 在人物年代说明中，现代汉语用“活跃于”比直译“兴盛”自然，同时不把它缩窄为出生或任职年代。
- source_word: holy Evangelist John
  choice: 圣福音书作者约翰
  rationale: “Evangelist”在此是传统人物称号，译出其与福音书写作的关联，避免误解为现代意义的布道家。
- source_word: Dominical Expositions
  choice: 《主言释义》
  rationale: 该书名通常与帕皮亚关于“主的言说”的阐释著作相联系；采用简洁书名，并避免扩充原文未明说的范围。
- source_word: viands
  choice: 食物
  rationale: 以现代、庄重且不古奥的词表达饮食之物。
- source_word: sources of delights in the resurrection
  choice: 复活之乐的来源之一
  rationale: 保留食物与复活喜乐之间的原有关系，不进一步解释其性质或神学含义。
- source_word: produces in support of his statements
  choice: 援引……来支持自己的论述
  rationale: 按学术引证语境自然表达其以帕皮亚为证据的意思。
- source_word: Schol. in libr. Dionys. Areopag. de eccl. hierarch.
  choice: 《〈狄奥尼修斯·亚略巴古人教会阶序论〉释注》
  rationale: 将拉丁文缩略书目信息译为可读的现代中文标题，同时保留被注释著作及其作者归称。
theological_decisions:
- issue: 复活中的食物与喜乐
  choice: 直陈帕皮亚提到食物也是复活之乐的来源之一
  alternative: 解释为千禧年筵席、象征性福乐或一般末世赏赐
  rationale: 现有见证只报告帕皮亚的说法，未交代其确切末世论框架；译文不替文本消除这种神学张力。
- issue: “约翰”的身份称谓
  choice: 保留传统称号“圣福音书作者约翰”
  alternative: 明确等同于使徒约翰，或仅译作传福音者约翰
  rationale: 见证称其为“holy Evangelist John”，但不应在翻译中加入原文未明确表达的身份论证。
- issue: 作者对所指人物的确定程度
  choice: 保留“我想”
  alternative: 直接断定所指就是帕皮亚
  rationale: 该插入语体现释注者的推测，不宜将其提升为确定陈述。
translation_notes:
  register: 采用现代标准普通话简体中文，语体庄重而易懂。正文保留片段的推测语气、复活饮食意象及省略信号，不作宗派化阐释。人名采用中文学界和基督教文献中较常见的译法：“帕皮亚”“爱任纽”“宣信者马克西穆”；古代行省 Asia 译作“亚细亚”。
