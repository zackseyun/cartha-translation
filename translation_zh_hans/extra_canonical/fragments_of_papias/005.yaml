review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿总体忠实呈现了哲罗姆转述的两段材料及其证据姿态，但“杂乱无据”给 *promiscuous statements* 加入了“无据”的否定判断；“借着作者本人”把见证中括注的 *in (the persons of) authors* 过度落实为“作者本人”，既不合上下文所指的口头传承者，也掩盖了见证文本的编辑性和不确定性。末段首句的“译成了另一种语言”虽可由下文补足，但原文此处仅称“由我翻译”。
  naturalness: 需小幅润色为更自然、准确的现代书面普通话：“约翰的听众”比“听讲者”更自然且仍不预设正式师徒关系；“亚细亚的希拉波利斯”采用较通行的地名形式；“正在传讲什么”自然保留过去所说与当时仍在说之间的时态对照。
  terminology: 《主言论释义》、长老约翰、千年、爱任纽、亚波里拿留等用语可保留。将“活的声音”调整为“活生生的声音”，并将括注处理为“在那些权威见证者身上”，较能传达英语见证所保留的编辑性补足，同时不把他们误称为著作的作者。关于肉身作王，宜译为“主将与圣徒在肉身中作王”，保留“in the flesh”在句法上可能涵盖共同作王者的张力。
  issues:
  - severity: medium
    issue: “杂乱无据的说法”
    rationale: “无据”不是所给英语见证的明确内容；该处仅对照不随从混杂／杂多的说法与以使徒为权威。应避免添加认识论上的贬抑。
  - severity: high
    issue: “那声音借着作者本人……响着”
    rationale: 英语见证的“in (the persons of) authors”带括号，显示编辑性补足；上下文所对照的是书本与活的口头见证，不宜译成“作者本人”。此译既可能错指，也消除了原有不确定性。
  - severity: low
    issue: “希拉波利”与“听讲者”
    rationale: 可分别改为较通行的“希拉波利斯”和更自然的“听众”；两者均不改变原意。
  - severity: low
    issue: “主将以肉身与众圣徒一同作王”
    rationale: “以肉身”在汉语中较易限定为主个人的方式；“主将与圣徒在肉身中作王”更贴近见证句法，并保留其古代神学表述。
  - severity: low
    issue: 末段传闻的译法
    rationale: 原句只说这些著作“被我翻译”，目标语言由下句“译成另一种语言”补出；首句不宜提前补足。
  revised_text: '帕皮亚是约翰的听众，也是亚细亚的希拉波利斯主教。他共写了五卷书，题为《主言论释义》。他在序言中声明，自己并不随从混杂的说法，而是以使徒为权威；他在书中说：


    “我常常查问：安得烈、彼得、腓力、多马、雅各、约翰、马太，或主的其他任何门徒，曾说过什么；也查问亚里斯提翁和长老约翰——主的门徒——正在传讲什么。因为书本所提供的益处，对我不如那活生生的声音；这声音直到如今仍清楚地在那些权威见证者身上回响。”[a]


    由此可见，就在他列举的名字中，有一位约翰被列在使徒之中，另有一位约翰，即长老约翰；他把后者列在亚里斯提翁之后。我们提及此事，是由于上文所说的一项主张；我们曾依据许多人的见证记载这项主张：约翰的后两封书信不是使徒所作，而是那位长老所作。[b] 据说，这位帕皮亚传播了犹太人的千年传统；爱任纽、亚波里拿留和其他人也追随他。他们说，复活之后，主将与圣徒在肉身中作王。


    ——哲罗姆《名人传》18章


    八


    此外，有一个不实的传闻传到我这里，说约瑟夫斯的著作以及帕皮亚和坡旅甲的作品是由我翻译的；但我既无闲暇，也无精力，无法把这类作品以相应的雅致译成另一种语言。


    ——哲罗姆《致路西尼乌斯书》第71（28）封，5章[c]'
