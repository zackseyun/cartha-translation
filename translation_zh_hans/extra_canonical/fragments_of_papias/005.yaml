review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实传达了所供英文见证的论旨、引语层次及其不确定性，也恰当地没有把关于两位约翰、约翰后二书作者或千年统治的古代主张提升为事实。不过，若干措辞仍可更准确地区分“听过约翰教导的人”、未加甄别的传述、书面材料与仍在世的传述者；引文末尾的编辑性括号也不应在无说明下消失。
  naturalness: 现代汉语整体通顺庄重。将“听讲者”改为“曾听过约翰教导的人”、将“杂乱无据的说法”改为“未经甄别的传述”，并使约瑟夫斯段的句法更自然，可提升可读性并避免不必要的评价色彩。
  terminology: 建议采用较通行的“希拉波利斯”和“阿波利拿留”。“长老约翰”“千年传统”“以肉身……作王”均可保留。书名《主言论释义》可维持，因所供桥接见证的“Discourses”本身不足以安全裁定更窄的术语。
  issues:
  - severity: medium
    issue: 引语末尾“in (the persons of) authors”的编辑性括号所标明的限定，在正文中未被保留或以注释说明。
    rationale: 所供英文见证明确保留括号，表明该短语带有编辑性或文本层面的不稳定性。译文应保留这一信号，而非将其无标记地解释成确定的“作者本人”。
  - severity: medium
    issue: “杂乱无据的说法”比 witness 的“promiscuous statements”增加了“无据”的断言。
    rationale: 该词主要表示混杂、未加区分或随意采集；“无据”可能把来源不可靠的判断加强。宜译为“未经甄别的传述”等较中性的表达。
  - severity: low
    issue: “约翰的听讲者”不够自然，且“hearer”更直接指曾聆听其教导或话语的人。
    rationale: “曾听过约翰教导的人”既符合现代汉语，也不擅自称其为约翰的正式门徒。
  - severity: low
    issue: 地名和人名可按较通行的现代汉语形式统一。
    rationale: “希拉波利斯”及“阿波利拿留”较常见，便于识别；不改变所指人物。
  revised_text: '帕皮亚是曾听过约翰教导的人，也是亚细亚希拉波利斯的主教。他只写了五卷书，题为《主言论释义》。他在序言中说明，自己并不采纳未经甄别的传述，而是以使徒为权威；其中他说：


    “我常常查问：安得烈说过什么，彼得说过什么，腓力、多马、雅各、约翰、马太，或主的其他任何门徒说过什么；又查问主的门徒亚里斯提翁和长老约翰正在说什么。因为供人阅读的书给我的益处，远不及那活的声音；这声音直到如今仍在传述者本人身上清楚地发出。”[a]


    由此可见，就在他的这份名单中，有一位约翰列在使徒之中；另有一位约翰，即长老约翰，帕皮亚把他列在亚里斯提翁之后。我们提到这件事，是因为上文所说的那项主张；我们根据许多人的见证记下了这项主张：约翰的后两封书信不是使徒所作，而是那位长老所作。[b] 据说，这位帕皮亚传播了犹太人的千年传统；爱任纽、阿波利拿留和其他人也追随他；他们说，复活之后，主将以肉身与众圣徒一同作王。


    ——哲罗姆《名人传》18章


    八


    此外，有一个不实的传闻传到我这里，说约瑟夫斯的著作以及帕皮亚和坡旅甲的作品都是由我翻译的；可是，我既没有闲暇，也没有精力，无法把这类作品以相称的文采译成另一种语言。


    ——哲罗姆《致路西尼乌斯书》第71（28）封，5章[c]'
