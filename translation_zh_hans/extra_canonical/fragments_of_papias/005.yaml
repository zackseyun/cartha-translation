    reason: 说明双重编号，避免读者误以为正文有两封不同书信。
lexical_decisions:
- source_word: hearer of John
  choice: 约翰的听讲者
  rationale: 比“门徒”更贴近 hearer，避免擅自断定正式师徒关系。
- source_word: An Exposition of Discourses of the Lord
  choice: 《主言论释义》
  rationale: 以“言论”涵盖 logia／discourses 可能指主的言语或相关材料的范围，以“释义”表达 exposition。
- source_word: promiscuous statements
  choice: 杂乱无据的说法
  rationale: 表达未经甄别、来源混杂之意，不采用现代汉语中易引起性含义联想的直译。
- source_word: the Elder John
  choice: 长老约翰
  rationale: 保留称号与人名，并与前一个列于使徒中的约翰清楚区分。
- source_word: the living voice
  choice: 活的声音
  rationale: 保留口传见证与书面材料之间的鲜明对照。
- source_word: a Millennium
  choice: 千年传统
  rationale: 依据上下文保留“千年”的传统表述，不扩写为带有特定宗派体系含义的术语。
- source_word: reign in the flesh
  choice: 以肉身……作王
  rationale: 保留肉身性与作王的神学张力，不解释其具体方式。
- source_word: with corresponding elegance
  choice: 以相称的文采
  rationale: 自然表达译文文体应与原作典雅程度相称的意思。
theological_decisions:
- issue: 两位约翰的身份
  choice: 按见证文本明确区分“列在使徒之中的约翰”与“长老约翰”
  alternative: 将二者视为同一人，或直接称前者为“使徒约翰”
  rationale: 哲罗姆此处的论证正依赖两者有别；但文本只说前者列于使徒中，因此不额外补足身份。
- issue: 约翰后两封书信的作者归属
  choice: 保留为哲罗姆所转述、依据多人见证的说法
  alternative: 把长老作者说陈述为译者确认的事实
  rationale: 原文呈现的是古代作者的论证与归属判断，译文不应替其提升确定程度。
- issue: 复活后主的千年统治
  choice: 译作“主将以肉身与众圣徒一同作王”
  alternative: 解释为某一特定的千禧年论体系
  rationale: 保留原见证的肉身、复活和作王措辞，不引入后世宗派分类。
- issue: “犹太人的传统”的评价色彩
  choice: 直译为“犹太人的千年传统”
  alternative: 译为“犹太人的传说”或“谬说”
  rationale: 避免加入原措辞未必具有的贬义判断。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。人名依通行基督教及古典文献译法处理；引文与叙述层次分明。保留“据说”“声称”等证据姿态，也保留关于两位约翰、书信作者和千年作王的历史神学张力。由于直接希腊文／拉丁文复核尚未完成，本稿属于以公版英文见证为桥梁的出版候选稿。
