base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/009.yaml
  text: 'Taking their start from Papias the great, of Hierapolis, the disciple of the Apostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of the Alexandrians and Ammonius, the great scholar, those ancient and first expositors who agree with each other in understanding all the work of the six days (as referring) to Christ and His Church.


    ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i.'
translation:
  language: zh_hans
  text: '那些古代最早的释经家，以希拉波利斯的伟大帕皮亚——那位曾倚靠在基督胸前的使徒的门徒——为起点，也承接革利免、亚历山大人的祭司潘泰努斯，以及博学的亚摩尼乌斯；他们彼此一致，认为六日创造的全部工作都是指向基督和他的教会。[a]


    ——西奈的阿纳斯塔修斯，《六日创造的寓意默观》第一卷[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英语见证翻译；希腊文或拉丁文原始见证尚待直接复核。句法上，革利免、潘泰努斯和亚摩尼乌斯与“以……为起点”的关系略显压缩，译文按他们共同构成早期释经传统来处理。
    reason: 资料明确标注源语言复核尚未完成，且现有英语句法存在附着关系上的不确定性。
  - marker: b
    text: 作品题名为暂译。所引缩写为 Contempl. Anagog. in Hexaém. i.，指西奈的阿纳斯塔修斯论六日创造之作的第一卷。
    reason: 保留归属与卷次，并说明缩写题名的暂定处理。
lexical_decisions:
- source_word: Papias the great, of Hierapolis
  choice: 希拉波利斯的伟大帕皮亚
  rationale: 保留地名限定和尊称；按现代汉语姓名音译习惯处理。
- source_word: the disciple of the Apostle who leaned on Christ’s bosom
  choice: 那位曾倚靠在基督胸前的使徒的门徒
  rationale: 保留原见证中修饰关系可能产生的张力，不擅自直接点明该使徒姓名。
- source_word: Pantanus the priest of the Alexandrians
  choice: 亚历山大人的祭司潘泰努斯
  rationale: 依现有英语见证直译地域与职分关系；因希腊文复核尚待进行，不将 priest 特定化为某一后世宗派职称。
- source_word: all the work of the six days
  choice: 六日创造的全部工作
  rationale: “六日”在此指创世六日；补出“创造”使现代读者易懂，同时保留整体性。
- source_word: as referring to Christ and His Church
  choice: 都是指向基督和他的教会
  rationale: “指向”自然表达解释学关联，不把这种关联进一步限定为预表、寓意或直接预言。
- source_word: Contempl. Anagog. in Hexaém.
  choice: 《六日创造的寓意默观》
  rationale: 据缩写题名作暂定意译；“anagogical”具有提升、属灵或寓意阐释等可能，现以“寓意”作便于理解的暂译，并加脚注说明。
theological_decisions:
- issue: 六日创造与基督及教会的关系性质
  choice: 译为“指向基督和他的教会”
  alternative: “预表基督和他的教会”或“应当按基督和教会来理解”
  rationale: 现有见证只表明解释上的指涉关系；“预表”会把关系定得更具体，因此不宜擅自加深。
- issue: “倚靠在基督胸前的使徒”的身份
  choice: 保留描述而不点名
  alternative: 直接译作“使徒约翰”
  rationale: 传统上通常理解为约翰，但见证文本本身未在此处具名，翻译不替原文消除这一留白。
- issue: Papias 与该使徒之间的师承关系
  choice: 按见证译作“……使徒的门徒”
  alternative: 弱化为“听过该使徒教导的人”
  rationale: 现有英语见证明确使用 disciple；虽历史传承问题可能复杂，译文仍应忠实呈现该见证的主张。
translation_notes:
  register: 采用现代、庄重且可读的学术—教会史文献语体。因本条只有公版英语转述见证，译文避免声称已直接据希腊文或拉丁文校订；人名采用常见或规则化音译，标题作透明的暂译。
