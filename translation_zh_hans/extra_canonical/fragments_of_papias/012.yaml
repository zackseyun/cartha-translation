base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/012.yaml
  text: 'Those who practiced guilelessness toward God they used to call children, as Papias also shows in the first book of the Expositions of the Lord, and Clement of Alexandria in the Paedagogue.


    —Maximus the Confessor, Scholia on the works of Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2.'
translation:
  language: zh_hans
  text: '他们把那些以纯真无伪的心对待上帝的人称为“孩子”；帕皮亚在《主言释义》第一卷中也表明了这一点，亚历山大的革利免在《导师》中也是如此。[a]


    ——认信者马克西姆，《〈论教会的阶序〉第二章注疏》（载于《亚略巴古人狄奥尼修斯著作注疏》）'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本残篇由后期作者认信者马克西姆的注疏保存。现译依据所提供的公版英译见证；希腊文或拉丁文原始见证仍有待直接核校。
    reason: 交代间接传承状况及当前底本限制，避免让读者误以为这是可直接核验的帕皮亚原文。
lexical_decisions:
- source_word: guilelessness
  choice: 纯真无伪
  rationale: 兼顾“不诡诈、无欺骗”的核心含义与现代汉语的自然表达，避免仅译作“天真”所可能带来的幼稚意味。
- source_word: towards God
  choice: 对待上帝
  rationale: 保留该品格以人与上帝的关系为指向，不扩展为笼统的虔诚。
- source_word: children
  choice: 孩子
  rationale: 保留原见证中称谓的直白性及其可能具有的比喻或群体称号意味，不擅自释为“上帝的儿女”。
- source_word: Expositions of the Lord
  choice: 《主言释义》
  rationale: 按帕皮亚著作传统名称处理；“主言”保留其可指主的言论或相关传述的空间，“释义”对应 Expositions。
- source_word: Paedagogue
  choice: 《导师》
  rationale: 采用革利免该著作通行、简明的中文书名，且符合原题“教导者”的基本意义。
theological_decisions:
- issue: “孩子”的身份含义
  choice: 保留为“孩子”
  alternative: 译作“上帝的儿女”或“属灵的婴孩”
  rationale: 现有英译见证只说他们被称为 children，并未明说所有权关系或灵性阶段；直译可避免加入神学解释。
- issue: “对上帝纯真无伪”的性质
  choice: 表述为关系中的无伪态度
  alternative: 解释为完全无罪或教义上的单纯
  rationale: 原见证强调 guilelessness toward God，不足以支持更强的无罪论或特定灵修教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。引文主体保持简洁；书名与署名按学术引证形式处理。因源语言审查尚未完成，对关键措辞采取审慎译法，并以脚注明确文本基础。
