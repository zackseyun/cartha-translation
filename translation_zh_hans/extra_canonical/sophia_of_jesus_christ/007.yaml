source:
  text: 'His disciples spoke yet again: “Tell us plainly how they descended from the invisibilities, from what is deathless to the world of mortality.”


    The perfect Savior said: “The Son of Man consorted with his companion Sophia, and manifested a mighty androgynous light. Its male name is called ‘Savior, All-Begetter.’ Its female name is ‘All-Begetter Sophia,’ some calling her ‘Pistis.’


    “Like [] a droplet from the light, everyone who enters the world is sent by him to the world of the Almighty, so that they can be watched over by him. And by the will of Sophia the fetter of his oblivion bound the light, so that by means of this, the affair could be <revealed> to the entire impoverished world, namely, (the Almighty’s) pride and blindness, and the ignorance that named him.


    “I, however, by the will of the great Light, originated from the places above, <loosing> from that fetter, having halted the activity of the thieves. I have aroused that droplet sent from Sophia, so that through me it could bear much fruit and be perfected, and never again become defective, but through me, the Great Savior, be <joined> so that his glory could be manifested, so that Sophia could also be rectified of that defect, so that her [] children could never again grow defective, but could obtain honor and glory and ascend to their Father, and understand the speech of the masculine Light.


    “And you were sent by the Son, who (himself) was sent so that you could obtain light and separate yourselves from the oblivion of the authorities, and that it could never again come to manifestation on your account, that is, the impure rubbing that originates from the fearsome fire that issued from their phallus. Tread on their evil intention.”'
