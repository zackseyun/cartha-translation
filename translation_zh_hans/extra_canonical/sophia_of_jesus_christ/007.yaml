translation:
  language: zh_hans
  text: '门徒又问：“请清楚地告诉我们，他们是怎样从不可见的领域，从不朽之处，降到这必朽的世界来的。”


    完美的救主说：“人子与他的伴侣索菲亚结合，显出一道大有能力、兼具男女两性的光。它男性的名字叫‘救主、万有之父’；女性的名字叫‘万有之母索菲亚’，也有人称她为‘皮斯蒂斯’。[a]


    “如同[]从光而来的一滴，凡进入这世界的人，都是由他差到全能者的世界，使他们受全能者看管。索菲亚有意让全能者遗忘的锁链捆住那光，好借此使这件事向整个贫乏的世界<显明>，就是全能者的骄傲和盲目，以及那给他命名的无知。[b]


    “然而，我照着大光的旨意，从上面的诸境而来，<解开>那锁链，并止住盗贼的作为。我唤醒了索菲亚所差来的那一滴，使它借着我结出许多果实，达到完美，不再有缺陷；又使它借着我这位大救主得以<联合>，好让他的荣耀显明，也使索菲亚的那缺陷得到修正，使她[]的儿女不再有缺陷，反而得着尊荣和荣耀，升到他们的父那里，并明白男性之光的话语。


    “你们也是由子差来的；子自己也奉差遣，为要使你们得着光，脱离众掌权者所造成的遗忘；也使那事不再因你们而显现，就是那从他们阳具所喷出的可怕烈火而来的不洁摩擦。[c]你们要践踏他们邪恶的意图。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “索菲亚”和“皮斯蒂斯”分别音译自希腊语名称，字面可指“智慧”和“信”。“万有之父/万有之母”译自同一个称号“All-Begetter”，按上下文的男性名与女性名分别表达。
    reason: 帮助普通读者理解专名词义与同一称号的性别对举。
  - marker: b
    text: 本段[]表示见证文本有缺损；尖括号内的字词表示编者补出的读法。“全能者遗忘的锁链”所含代词的具体指向仍有待科普特原文复核。
    reason: 保留抄本损坏和编辑补文信号，并标明当前底本限制。
  - marker: c
    text: 这里依见证文本直译其强烈的身体与性意象；“摩擦”所指的具体行为或宇宙论含义并不完全清楚。
    reason: 避免读者误以为译文已经确定该隐晦表达的解释。
lexical_decisions:
- source_word: invisibilities
  choice: 不可见的领域
  rationale: 保留复数所指的诸不可见层域，同时避免生硬的“不可见者们”；现有材料仅为英文见证，科普特原文复核尚待进行。
- source_word: Sophia / Pistis
  choice: 索菲亚 / 皮斯蒂斯
  rationale: 作为宇宙论中的专名音译；Sophia与Pistis分别有“智慧”“信”的词义，但此处直接意译可能误导读者把专名当作普通抽象名词。
- source_word: All-Begetter
  choice: 万有之父 / 万有之母
  rationale: 英语形式本身不标性别，但上下文明确区分男性名与女性名；用“父/母”自然表达生育万有的称号并保留性别对举。
- source_word: androgynous light
  choice: 兼具男女两性的光
  rationale: 直陈其双性特征，不将其弱化为泛泛的“圆满”或“中性”。
- source_word: authorities
  choice: 众掌权者
  rationale: 保留该文献中具有位格和宇宙论意味的统治势力，不窄化为世俗官长。
- source_word: phallus
  choice: 阳具
  rationale: 原见证措辞明确，采用准确而庄重的现代词，不作委婉化改写。
theological_decisions:
- issue: “Almighty”是否指至高神
  choice: 译作“全能者”，不加身份解释
  alternative: 译作“全能的神”或解释为造物主/巨匠造物主
  rationale: 本段将其与骄傲、盲目和无知相联，身份带有该文献自身的张力；译文不应以正统神学称谓或后世体系替文本消解张力。
- issue: 代词“his glory”的指向
  choice: 保留为“他的荣耀”
  alternative: 明确改作“大救主的荣耀”“那一滴的荣耀”或“父的荣耀”
  rationale: 英文见证中的代词指向不完全确定；在未核对科普特原文前不擅自判定。
- issue: 光被遗忘锁链捆绑的施事与意愿
  choice: 译作“索菲亚有意让全能者遗忘的锁链捆住那光”
  alternative: 将“his”解释为光、人或其他主体的遗忘
  rationale: 依当前英文句法，his最接近全能者；但以脚注提示原文复核尚待进行，避免把暂定理解包装成定论。
- issue: 末段性意象
  choice: 按字面保留“不洁摩擦”“阳具”“喷出的烈火”
  alternative: 灵意化为欲望、污秽行为或邪恶力量
  rationale: 原见证刻意使用身体和性意象；神学性净化会改变文本的修辞与宇宙论内容。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。尽量保留原段的宇宙论术语、代词歧义、性别意象及神学张力，不以教派术语加以同化。方括号[]和尖括号<>依所给见证保留，分别标示缺损与编辑补文。由于所提供的直接 drafting basis 是公共领域英文见证，且科普特原文复核明确标为待定，本稿属于以见证为据的审慎暂译。
