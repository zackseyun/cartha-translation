  terminology: 保留“索菲亚”“皮斯蒂斯”“全能者”“众掌权者”“阳具”等用语。“All-Begetter”统一译为“万有的生育者”，不因名称的男性／女性配对而改作父母称号。以“遗忘的束缚”保留his的未决所指，且不将其释作全能者的遗忘。
