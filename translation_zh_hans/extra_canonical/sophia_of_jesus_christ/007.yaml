    issue: “All-Begetter”被译为“万有之父／万有之母”。
    rationale: 英文见证给男性名和女性名使用同一称号“All-Begetter”；改为父／母加入原文未明说的亲属称谓，并抹去了同一称号的重复。
  - severity: high
    issue: “the fetter of his oblivion”被确定译为“全能者遗忘的锁链”。
    rationale: 见证文本中his的指向未定。将其落实为“全能者”属于解释性决定，不应在正文中固定。
  - severity: medium
    issue: “watched over”译为“看管”，“<loosing> from that fetter”译为“<解开>那锁链”。
    rationale: 前者较接近“看顾”；后者的英文更像主体从束缚中获释／松脱，而非主动解开锁链。
  - severity: medium
    issue: “the oblivion of the authorities”被补成“众掌权者所造成的遗忘”。
    rationale: 原见证的属格关系可有歧义；“所造成的”添加了未明示的因果关系。
