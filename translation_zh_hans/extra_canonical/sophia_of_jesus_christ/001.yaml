lexical_decisions:
- source_word: fundamental nature
  choice: 根本性质
  rationale: 保留关于世界本原或本质的哲学性询问，不把它限定为某一后世术语。
- source_word: plan / divine plan
  choice: 安排／神圣安排
  rationale: 兼顾秩序、规划和经纶等可能含义；避免直接采用带有特定宗派解释色彩的术语。
- source_word: divine providence / providence
  choice: 神圣的眷顾／眷顾
  rationale: 表达神性护理或预定秩序的观念，同时保留文中将其作为哲学理论加以否定的张力。
- source_word: authorities
  choice: 众掌权者
  rationale: 保留其可能指宇宙性权势或统治者的含混性，不擅自具体化为人间官长或某类灵体。
- source_word: invisible spirit
  choice: 不可见的灵
  rationale: 按见证文本直译，保留显现形态与先前可见形体之间的对照。
- source_word: Infinite Light
  choice: 无限之光
  rationale: 保留专名式、超越性的表达，不将其等同解释为另一特定神学称号。
- source_word: self-originated / self-made
  choice: 自生／自己造就
  rationale: 用两个相近但不完全相同的表达对应原见证的措辞变化，并保留论证中略显悖论的性质。
- source_word: impure rubbing
  choice: 不洁摩擦
  rationale: 原见证措辞晦涩，采取较形式对应的译法，不以解释性词语消除可能涉及性生殖的隐喻。
theological_decisions:
- issue: 救主复起后的显现方式
  choice: “不再带着先前那可见的形体，而是作为不可见的灵”
  alternative: “不是以原先的形体，而以无形之灵显现”
  rationale: 保留形体、灵与显现之间的张力，不将其系统化为某种基督论结论。
- issue: “完全纯净，是完美的肉身”的表述
  choice: 保留“肉身”
  alternative: 译作“身体”或“实体”
  rationale: 见证文本在“不可见的灵”之后又说“完美的肉身”，张力是真实文本特征，不应在翻译中调和。
- issue: 三种宇宙秩序理论
  choice: 均作为受否定的人类推测呈现
  alternative: 将“眷顾”解释为正统神意护理
  rationale: 说话者在本段明确否定自我引导、眷顾和命运三说；译文不替文本修正其神学立场。
- issue: “最初受差遣者”与“不朽者”
  choice: 保留指代开放性
  alternative: 明确补出“救主”“基督”或“神”
  rationale: 英文见证未明确其所指，故不擅自补定身份。
