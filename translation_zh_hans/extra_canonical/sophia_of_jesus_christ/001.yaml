translation:
  language: zh_hans
  text: '他从死人中复起之后，他的十二个门徒和七位妇女仍跟随他，前往加利利，来到一座名叫“收割之地与喜乐”的山。[a] 他们聚在一起，对世界的根本性质、整个安排、神圣的眷顾、众掌权者的能力，以及救主如何在神圣安排的奥秘中与他们相交，都感到困惑。救主显现了，不再带着先前那可见的形体，而是作为不可见的灵。他的形像如同一位高大而光辉的天使；至于他究竟像什么，我不可描述，因为没有凡人承受得住。他完全纯净，是完美的肉身，正如他在加利利那座名叫“橄榄山”的山上教导我们的那样。


    他说：“愿你们平安！我把我的平安赐给你们！”众人都惊惧不已，心里害怕。


    救主[b]笑了，问他们：“你们在思量什么？为什么困惑？你们在寻求什么？”


    腓力说：“我们在寻求世界的根本性质和它的安排。”


    救主对他们说：“我要你们明白：从世界奠基直到如今，凡生在地上的人既是尘土，即使曾探究神，探究他的本体和形像，也未能找到他。他们当中最有智慧的人，根据世界如何受安排、如何运行而作出推测，但他们的推测并未触及真理。


    “所有哲学家都说，宇宙秩序受三种不同方式引导，因此彼此意见不一。有些人主张世界引导自身；[c]另一些人主张是眷顾在引导；还有一些人主张是命运在引导。然而，这些说法没有一个是真的。


    “我再说一遍：我刚才讲到的三种主张都不接近真理，因为它们只是人的推测。我却源自无限之光；因为我认识他，我来到这里，是要把真理准确地告诉你们。凡自生之物，其生命都是不洁的，因为它是自己造就的。眷顾之说并不高明，命运之说也没有洞见。


    “然而，知识已赐给你们；其他任何配得知识的人也必领受，就是那不是由不洁摩擦的播种所生，而是由最初受差遣的那一位所生的人，因为他是凡人中的不朽者。”'
