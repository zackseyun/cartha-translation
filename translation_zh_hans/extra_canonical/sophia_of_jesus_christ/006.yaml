translation:
  language: zh_hans
  text: '于是，巴多罗买问他：“福音中为什么称<他>为[]‘人’和‘人子’？那么，这两个称号中，哪一个属于那位子呢？”[a]


    那位圣者对他说：“我愿你知道，太初之人称为‘生育者’、‘自成全的心智’。他与自己的伴侣大智慧一同沉思，显现出他的头生子；这子兼具男女两性。[b] 其男性之名称为‘首生的上帝之子’，女性之名称为‘首生的智慧、宇宙之母’；有人称她为‘爱’。这位称为‘基督’的头生者，凭着从父所得的权柄，从灵和光造出了无数[]服役的天使。”


    他的门徒对他说：“主啊，请向我们揭示那位称为‘人’的，好使我们也能确切明白他的荣耀。”


    完全的救主说：“凡有耳可听的，就应当听！首生之父因源自光辉灿烂的光，便名为‘亚当，光之眼’；[c] 他那些不可言说、没有影子的圣天使，因从他们的父所得的映像，不住地欢喜快乐。[d] 人子的整个国度——他也称为‘上帝之子’——充满不可言说、没有影子的喜乐，也充满永不改变的欢欣；他们因他那不朽的[]荣耀而欢欣。这荣耀直到如今，在后来产生的诸永世及其世界中，未曾有人听闻，也未曾显明。[e] 我出自那自生、太初的无限之光，为要把一切都向你们显明。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此句所据见证在“<他>”处有编者补入的文字，在“[]”处有残缺；译文保留这些文本标记。
    reason: 说明尖括号和方括号是文本状况的信号，不属于顺畅正文。
  - marker: b
    text: “兼具男女两性”对应见证中的 androgynous，指同一头生子同时具有男性与女性的名称或面向。
    reason: 帮助现代读者理解古代宇宙论语境，同时不消解原文张力。
  - marker: c
    text: “亚当”在相关传统中既是名称，也可能与“人”这一称谓相呼应；此处按名称音译。
    reason: 保留名称与“人”的潜在语义联系，而不过度解释。
  - marker: d
    text: “映像”所据词义在现有英文见证中并不完全确定，也可理解为反照或形象。
    reason: 公开呈现当前间接底本造成的词义不确定性。
  - marker: e
    text: “诸永世”译自 aeons；该词可指时代，也可在此类宇宙论文本中指永世性的领域或存在层级。
    reason: 保留术语的多义性并避免默默选定单一体系解释。
lexical_decisions:
- source_word: the Human / Son of Man
  choice: 人／人子
  rationale: 保留见证文本对两个称号的区分及其问题性，不将“人”擅自解释为普通人类或特定神学概念。
- source_word: Primal Human
  choice: 太初之人
  rationale: “太初”自然而庄重，并保留其宇宙论上的原初含义；避免使用可能暗示现代生物学的“原始人”。
- source_word: the Begetter
  choice: 生育者
  rationale: 表达使后代产生者的主动意义，同时不将其窄化为纯男性的“父生者”。
- source_word: Self-Completed Mind
  choice: 自成全的心智
  rationale: 兼顾 self-completed 的自足、完成意味与 Mind 的理智实体含义，避免译成现代心理学色彩较重的“思想”。
- source_word: Great Sophia
  choice: 大智慧
  rationale: Sophia 本义为“智慧”；在此作为人格化名称，故保留“大”及专名式表达。
- source_word: androgynous
  choice: 兼具男女两性
  rationale: 以普通读者可理解的措辞准确表达同一存在兼有男性与女性面向，避免含混或带现代身份标签的译语。
- source_word: First-Begetting / first-begotten
  choice: 首生的／头生者
  rationale: 依上下文分别处理名称中的形容语和作为实体称谓的名词；保留“首先产生、受生”的核心意义。
- source_word: aeons
  choice: 诸永世
  rationale: 保留该词既可指漫长时代、也可指宇宙论层级或实体领域的张力；不直接音译，以确保现代读者可读。
- source_word: self-begotten
  choice: 自生
  rationale: 简洁保留“不由他者而生、由自身而出”的表面意义，不进一步作本体论解释。
theological_decisions:
- issue: 头生子兼具男性与女性名称时的代词指涉
  choice: 先称“这子”，随后依男性名称用“其”、依女性名称用“她”
  alternative: 全文统一使用“他”，或使用“它”
  rationale: 原见证在表述双性存在时有代词转换；译文保留这种张力，避免强行统一性别或将位格非人格化。
- issue: “Christ”与头生者的关系
  choice: 译作“这位称为‘基督’的头生者”
  alternative: 解释为历史中的耶稣基督
  rationale: 原文只给出称号对应，未明确等同于某一后期教义框架，故不增加解释。
- issue: “Son of Man”也称“Son of God”
  choice: 并列保留“人子”与“上帝之子”
  alternative: 将二者融合为同一复合称号
  rationale: 文本有意建立称号关联但未消除其区别，译文保持原有神学张力。
- issue: “reflections”所得之物的性质
  choice: 译为“映像”
  alternative: 译为“思想”“反照”或“观想”
  rationale: 见证文本本身语义可能涉及形象、反映或心智表象；“映像”较能保留歧义，不将其固定为心理活动。
- issue: “I originated from”所表达的来源关系
  choice: 译作“我出自”
  alternative: 译作“我受生于”或“我被造于”
  rationale: “出自”保留来源陈述，而不擅自判定受生、流出或被造的特定形上机制。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。由于尚未完成科普特语底本复核，本稿以所给公共领域英文见证为临时依据；原见证中的尖括号与空方括号均予保留。称号使用引号，宇宙论术语尽量直译但不导入宗派性解释。
