  text: 'Mary asked him, “Holy Lord, where did your disciples come from, where are they going, and how should they act here?”


    The perfect Savior said to them, “I want you to know that Sophia, the Mother of the World and the consort, wanted by herself, without her male counterpart, to bring these into existence. However, by the will of the Father of the World, so that his ungraspable benevolence could be manifested, he created the curtain between the immortals and those that arrived thereafter, so that the result could follow that [ . . . ]


    (Coptic pages 115-116 missing)


    [] “[. . .] and breath, and could from two become one, just as it was from the beginning, that you could produce much fruit and ascend to He Who Is from the beginning, in unspeakable joy and glory, and [honor and] the gift of [the Father of the World].


    “[Consequently], whoever knows [the Father in perfect] knowledge [will go] to the Father [and repose in] the unbegotten [Father]. However, [whoever knows him imperfectly] will go [to the deficiency] and the repose [of the Ogdoad].


    “[Now], whoever silently knows the immortal [Spirit] of light, by reflecting and agreeing with the truth, if he gives to me signs of the Invisible One, he will become a light in the silent Spirit. Whoever knows the Son of Man in knowledge and love, if he gives me a sign of [] the Son of Man, he can go to the dwelling-places of those in the Ogdoad.”'
translation:
  language: zh_hans
  text: '马利亚问他：“圣主啊，你的门徒从哪里来？要往哪里去？他们在这里应当怎样行事？”


    完美的救主对他们说：“我希望你们知道，索菲亚——世界之母和配偶——曾想独自使这些存在，不借助她的男性配偶。然而，世界之父定意要显明他那不可测度的慈爱，于是他在不朽者与后来出现的众者之间造了帷幕，好使结果能随之发生，就是[……][a]


    （科普特文第115—116页缺失）[b]


    [……]“[……]和气息，并且能从二者成为一体，正如起初一样，使你们能结出许多果实，并在无法言说的喜乐、荣耀、[尊荣]和[世界之父的]恩赐中，上升到那位自太初即存在者那里。


    “[因此]，凡以[完全的]认识认识[父]的，[必到]父那里，并[安息于]未受生的[父]里面；但凡[对他的认识不完全]的，必到[缺失之境]，并在[八重天]中[安息]。[c]


    “[如今]，凡借着省思并认同真理，在静默中认识那不朽的光明之[灵]的，若向我出示那不可见者的标记，他就会在静默之灵中成为光。凡以认识和爱认识人子的，若向我出示人子的[……]标记，就能到八重天中那些居所去。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号和省略号表示手稿残缺或现代编者所作的补复；此句在断裂处中止，无法确定后文原貌。
    reason: 提示文本损坏，防止读者把残句误当作完整陈述。
  - marker: b
    text: 现存科普特文在此缺少第115—116页，因此上下两段之间的论述无法复原。
    reason: 明确重大物质性缺页及叙事中断。
  - marker: c
    text: “八重天”译自 Ogdoad，字面意为“八者”或“第八层领域”，在这类古代宇宙论文本中可指由八重层次构成或位于第八层的天上领域；具体所指仍取决于本书体系。
    reason: 解释技术术语，同时保留其宇宙论含义的不确定性。
lexical_decisions:
- source_word: Sophia
  choice: 索菲亚
  rationale: 保留此宇宙论人物的专名，并以音译避免将其直接等同于普通名词“智慧”；首次出现处由同位语说明其身份。
- source_word: Mother of the World
  choice: 世界之母
  rationale: 直译其宇宙论称号，保持庄重而清楚。
- source_word: consort / male (counterpart)
  choice: 配偶／男性配偶
  rationale: 保留原见证中成对关系的表达；不擅自解释为婚姻、神性配对或流出体。
- source_word: curtain
  choice: 帷幕
  rationale: 保留隔开两个领域的具体意象，不将其抽象化为“界限”。
- source_word: He Who Is from the beginning
  choice: 那位自太初即存在者
  rationale: 体现存在与起初的双重含义，同时保持称谓性质。
- source_word: unbegotten
  choice: 未受生的
  rationale: 保留“不是由他者所生”的技术性神学含义，不改写成较解释性的“永恒”。
- source_word: Ogdoad
  choice: 八重天
  rationale: 采用便于现代中文读者理解的宇宙论术语；脚注说明其技术含义及可能译法。
- source_word: repose
  choice: 安息
  rationale: 兼顾静止、归宿与救赎性安歇的含义，不额外判定其价值高低。
- source_word: signs
  choice: 标记
  rationale: 保留可供辨认或出示之物的开放含义，不具体化为“凭证”“印记”或“奥秘记号”。
theological_decisions:
- issue: 索菲亚独自创造的行动及世界之父的旨意
  choice: 按见证保留两者并置，不说明其因果关系或道德评价
  alternative: 将索菲亚的行动明确解释为堕落、过犯或世界之父预定的计划
  rationale: 现有英文见证本身没有充分展开这一段的宇宙论逻辑，且紧接着发生大段缺页，不宜补入宗派性解释。
- issue: “完全认识”与“不完全认识”所通往的不同归宿
  choice: 保留父、缺失之境及八重天之间的张力
  alternative: 将两种归宿统一解释为得救与灭亡，或不同等级的救恩
  rationale: 文本区分不同认识及归宿，却因残损而存在语义不确定性，应避免系统化。
- issue: “在静默之灵中成为光”
  choice: 保持原有象征语言
  alternative: 解释为与圣灵合一、神化或获得某种灵界身份
  rationale: 见证未明确界定其本体论或仪式意义。
- issue: “出示标记”的性质
  choice: 译为开放性的“出示……标记”
  alternative: 具体解释为圣礼、口令、印记或秘密知识
  rationale: 上下文不足以确定这些标记属于哪一种仪式或启示传统。
