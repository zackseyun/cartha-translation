translation:
  language: zh_hans
  text: '马利亚问他：“那么，主啊，我们怎样才能知道那事呢？”


    完全的救主说：“要从隐秘之物开始，直到可见之物的尽头；思想的流溢将亲自向你们显明：对不可见之物的信，如何能在可见之物中找到——这些都属于那未生的父。[a] 有耳可听的，就应当听！


    “世界之主不称为‘父’，而称为‘父祖’，〈因为父是〉那些将要成为可见之物的本原；然而他〔……〕是无始的父祖。[b] 他在自己里面观看自己，仿佛照镜子一般；他以自己肖像的样式显现为神圣的自父，又〈显现为〉众映照者之上的映照者，就是首先存在者、未生的父。他其实与〈在他面前的〉光同样古老，但在能力上并不与那光相等。


    “此后，他显明了许多映照者，就是自生者；他们同样古老，能力相等，存于荣耀之中，甚至数不胜数。他们的族类称为‘其上再无国度的世代’；你们自己正是从其中一个〈国度〉显现于这些〈国度〉之中的。[c] 那整个其上再无国度的群体，称为〔……〕‘未生之父的儿女’、‘神’、‘〔救主〕’和‘神的儿子’；他的肖像住在你们中间。[d]


    “他是不可知者，充满一切不朽坏的荣耀和不可言说的喜乐。他们全都安息在他里面，因他永不改变的荣耀而不断欢喜，享受不可言说的喜乐和无可度量的欢欣。在此以前，这事在所有永世及其诸世界中，从未有人听见，也从未有人知道。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句语法关系含混；“这些都属于那未生的父”也可能连接“不可见之物”或“可见之物”。译文保留其开放性。
    reason: 提示源见证中的句法歧义，避免读者误以为译文已确定修饰范围。
  - marker: b
    text: 尖括号表示见证译者补出的文字；〔……〕表示抄本此处有残缺或文字不可读。
    reason: 保存所供见证中的校勘和残损信号。
  - marker: c
    text: 这一从句在所供见证中语意和所指均不明确；“其中一个”可能指某一国度或相关层级。
    reason: 不以顺畅改写掩盖原文的传本困难。
  - marker: d
    text: “他的肖像”所指不明，可能回指邻近的单数称号，也可能回指前文某一存在者。
    reason: 保存代词先行词的神学与语法歧义。
lexical_decisions:
- source_word: Forefather
  choice: 父祖
  rationale: 保留其与“父”的刻意区分及原初先在意味；避免“祖父”在现代汉语中仅指亲属关系，也避免用“始祖”抹去其父性成分。
- source_word: emanation of Thought
  choice: 思想的流溢
  rationale: “流溢”保留 emanation 的发出、流出意象；“思想”保留拟人格化和术语色彩，不将其解释成普通的想法。
- source_word: unbegotten Father
  choice: 未生的父
  rationale: 直译其非由他者所生的含义，不以“永恒之父”等神学解释替代原文措辞。
- source_word: Self-Father
  choice: 自父
  rationale: 采用简洁术语形式，保留该复合称号的陌生感，不擅自解释为“自己的父”或“自有者”。
- source_word: reflecting / reflector
  choice: 映照者
  rationale: 维持镜子语境及原文重复，避免具体化为“形象”“灵体”等解释性用语。
- source_word: self-begotten ones
  choice: 自生者
  rationale: 保留与“未生”不同的生成范畴，避免将二者混同。
- source_word: The Generation Above Which There Is No Kingdom
  choice: 其上再无国度的世代
  rationale: 尽量保留称号的结构性含义及“世代/族类”的集体意味，不改写成较解释性的“至高族类”。
- source_word: aeons
  choice: 永世
  rationale: 表达该词作为宇宙论实体或时代层级的术语意味，同时保持普通读者可理解；未径自音译为“伊昂”。
theological_decisions:
- issue: “父”与“父祖”的层级关系
  choice: 保留两个不同称号，并照原文陈述其本原、先在和能力差异
  alternative: 将 Forefather 统一译作“父”或解释为至高神
  rationale: 原文有意区分多个称号和位格/层级，译文不应依后来的教义体系加以合并。
- issue: “他”及“他的肖像”的指代
  choice: 维持男性单数代词，不补明先行词
  alternative: 明确写成“未生的父”“神的儿子”或某一群体
  rationale: 见证文本中的指代存在真实歧义，明确化会替原文作神学判断。
- issue: 整个群体所承受的单数与复数称号
  choice: 保留该群体同时被称为“儿女”“神”“救主”“神的儿子”
  alternative: 按语法或教义拆分称号，分别归给不同对象
  rationale: 原文将这些形式不一的称号并列用于同一整体；译文保留其张力。
- issue: “与光同样古老”却“能力不相等”
  choice: 原样保留年代相等与能力不等的并置
  alternative: 将“光”解释为父，或调整为本体平等
  rationale: 这是文本自身的宇宙论张力，不宜以宗派性教义消解。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。对宇宙论复合称号适度保留术语陌生感，同时用常见句法承载。尖括号〈〉保留见证中的补文，方头括号〔〕用于复原或残缺信号，以免与脚注标记[a]等混淆。本稿只能依据所供公共领域英文见证起草；科普特文直接复核尚待完成。
