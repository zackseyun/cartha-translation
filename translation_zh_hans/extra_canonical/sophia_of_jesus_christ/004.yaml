  variant: Modern Standard Mandarin in Simplified Chinese
source:
  text: 'Mary asked him: “Then how, Lord, can we come to know that?”


    The perfect Savior said: “Begin from concealed things to the end of visible things, and the emanation of Thought will itself reveal to you how faith in things invisible is to be found in what is visible, things that belong to the unbegotten Father. Let whoever has ears to hear, hear!


    “The Lord of the World is not called ‘Father,’ but ‘Forefather,’ <because the Father is> the originative principle of those that will become visible, yet he [] is [the] Forefather without beginning. He beholds himself within himself, as in a mirror, having appeared in his likeness as the divine Self-Father, and <as> the reflector over the reflecting ones, the first existent, the unbegotten Father. He is in fact as old <as> the light that is before him, but he does not equal him in power.


    “Afterward he revealed many reflecting, self-begotten ones, of equal age and power, subsisting in glory, (even) without number, whose nation is called ‘The Generation Above Which There Is No Kingdom,’ from the one in which you yourselves have become visible among these <kingdoms>. And that whole multitude above which there is no kingdom is called [] ‘the Children of the Unbegotten Father,’ ‘God,’ ‘[Savior],’ and ‘Son of God,’ whose likeness dwells with you.


    “He is the Unknowable, full of every indestructible glory and unspeakable joy. They are all at repose in him, continually rejoicing in unspeakable joy over his glory that never changes and immeasurable rejoicing. Before now, this was never heard or known among all the aeons and their worlds.”'
