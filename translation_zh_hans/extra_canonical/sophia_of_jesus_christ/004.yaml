  naturalness: 文体庄重、可朗读，术语也大体一致。少数句子可在不消除原文困难的前提下略作调整：“以自己肖像的样式显现”为“以自己的形象显现”较合现代汉语；首段末句改以同位语连接，可更清楚地保留“属于未生之父”的修饰范围。
