  issues:
  - severity: medium
    issue: 第三段把不明确的“from the one in which”具体化为“从其中一个〈国度〉”。
    rationale: 英文见证的“the one”及其与“these <kingdoms>”的关系本有传本和句法困难；指定为“其中一个国度”会缩窄原有歧义。应以较字面的、仍显不甚顺畅的表达保存不确定性。
  - severity: low
    issue: “[the] Forefather”中的补文信号没有完整呈现。
    rationale: 中文通常不必译出英语定冠词，但本项目要求保存见证中的校勘信号；可用〔那〕标示该处为补出文字，且不改变意义。
  - severity: low
