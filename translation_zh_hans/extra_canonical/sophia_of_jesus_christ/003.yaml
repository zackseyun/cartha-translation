translation:
  language: zh_hans
  text: '腓力问：“主啊，那么，他是怎样向那些完全者显现的呢？”


    完全的救主对他说：“在一切可见之物显现以前，威严和权柄就存在于他里面[a]，因为他包容一切‘全体’，却没有什么能包容他。这是因为他全然是心智；他也是思想、反思、思量、推理和能力。这些都是同等的力量，是一切‘全体’的源头。它们的整个族类，从最初到末后，都在那无限、未受生的父的预知之中。”


    多马问他：“主、救主啊，这些为何会形成，又为什么被显明出来？”


    完全的救主说：“我从那无限者而出，为要把一切都告诉你们。那位‘存在的灵’施行了生育，具有生育者的能力[b]和那赋予形态者的本性，为使隐藏在他里面的丰盛财富得以显明。因着他的怜悯和慈爱，他愿意亲自结出果实，不愿独自<c>享有他的美善，而要让不动摇族类的其他诸灵，在不朽之中产生形体和灵、荣耀和尊贵，以及他无限的恩赐。这样，他的宝藏就能借着自生的神显明出来；这位神是一切不朽者的父，也是后来将要形成、却尚未显现者的父。不朽者彼此之间有很大的差别。”


    他高声说：“凡有耳能听关于那些无限者之事的，就应当听！”又说：“我已经对那些警醒的人说了！”


    他又继续[d]说：“凡从会朽坏者而生的，都必朽坏，因为它是从会朽坏者而生；但从不朽者而生的，必不朽坏，反而会成为不朽的。


    因此，许多人因不明白这种差别而陷入迷误，并且死了。”'
  philosophy: optimal-equivalence
