lexical_decisions:
- source_word: the perfect ones / perfect Savior
  choice: 完全者／完全的救主
  rationale: 保留同一形容词的词汇呼应；“完全”兼有完备、成熟之意，不将其解释为无罪或某一宗派的灵性等级。
- source_word: the Totalities
  choice: 一切‘全体’
  rationale: 这是本文宇宙论语境中的技术性复数概念；加引号以提示其特殊用法，同时保留复数观念，避免平化为普通的“万物”。
- source_word: mind
  choice: 心智
  rationale: 比“心”更准确地表达知性或理智层面的含义，并与后列的思想、反思、推理相协调。
- source_word: the Infinite
  choice: 那无限者
  rationale: 将实体化称号译作人格性名号，而非仅译为抽象属性“无限”。
- source_word: the Spirit Who Is
  choice: 那位‘存在的灵’
  rationale: 保留“存在／是”的称号性质及原文较不寻常的表达，不擅自等同于传统固定称谓。
- source_word: unbegotten Father
  choice: 未受生的父
  rationale: 直译其否定被生或受生的含义，避免用“永生之父”等可能改变概念的熟语。
- source_word: self-begotten God
  choice: 自生的神
  rationale: 保留其宇宙论技术称号及与“未受生”之间的区别，不解释其具体生成机制。
- source_word: unmoving generation
  choice: 不动摇族类
  rationale: “generation”在此更可能指族类或种属；“不动摇”保留稳定、不受扰动的特征，避免误解为静止的一代人。
- source_word: indestructibility / imperishable
  choice: 不朽／不朽者
  rationale: 以自然中文概括不可毁坏、不可败坏之义，并在名词与称谓之间保持一致。
theological_decisions:
- issue: “他”及“父”“那无限者”“存在的灵”之间的指称关系
  choice: 保留各称号和代词，不明确合并为同一位或区分为不同位格
  alternative: 把所有称号统一解释为“父神”，或明确构造位格层级
  rationale: 当前依据是英语见证文本，且科普特语复核尚待进行；原段本身具有宇宙论和指称上的张力，不宜在翻译中替读者解决。
- issue: “完全者”的神学含义
  choice: 采用中性的“完全者”
  alternative: 译作“圣徒”“得救者”或“属灵人”
  rationale: 这些替代词会引入特定救恩论或群体身份，超出文本明说范围。
- issue: “自生的神”与父的关系
  choice: 依原句语法保留并置关系，不补入“即是”或“次于”等说明
  alternative: 明确说自生的神就是父，或是父以下的神性存在
  rationale: 原见证的句法与神学关系并不完全明晰，应保留这种开放性。
- issue: 可朽与不朽之来源关系
  choice: 直陈来源决定结局的对照
  alternative: 将其解释为道德善恶、肉体灵魂或预定论命题
  rationale: 文本只明说可朽与不朽的来源差别；进一步体系化会导入文本以外的教义。
translation_notes:
  register: 采用现代、庄重而可读的普通话。宇宙论术语以稳定对应为主，必要时用引号显示技术性称谓。因直接科普特语审校尚未完成，本稿严格标示英语见证所保留的缺文、补字和不确定处，不将暂定解释伪装成确定原文。
