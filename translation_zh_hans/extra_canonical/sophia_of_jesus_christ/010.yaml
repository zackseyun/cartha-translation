  text: '“Behold! I have disclosed to you the name of the Perfect One, the entire will of the Mother of the holy angels, so that here the masculine [host] may be brought to completion, so that [in the aeons] there [could appear the infinities, as well as] those that [came into existence in the] unfathomable [riches of the Great] Invisible [Spirit, so that they] all [could partake in his benevolence], even the riches [of their repose] without any [kingdom over it].


    “I originated [from the first] sent one, that I could disclose to you He Who Is from the beginning, on account of the pride of the arch-begetter and his angels, because they boast about themselves, saying that they are gods. And I came to free them from their blindness, so that I could announce to everyone concerning the God who dwells above the world.


    [] “Tread, therefore, on their graves, shame their evil intention, break their yoke, and awaken my own. I have granted you authority over everything as the Sons of Light, so that with [your] feet you could tread on their power.”


    These are the matters [the] blessed Savior [spoke, and he vanished] from their midst. [All the disciples] were then in [great, unspeakable joy] in [the Spirit from] that day onward. [And his disciples] began preaching [the] divine Gospel of [the] eternal, indestructible [Spirit]. Amen.


    The Sophia of Jesus Christ'
