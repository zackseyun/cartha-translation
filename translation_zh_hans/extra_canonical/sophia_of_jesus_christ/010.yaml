  text: '“看哪！我已经向你们揭示了那完美者的名，以及圣天使之母的全部旨意，好使这里阳性的［群体］得以完满；也好使［在诸永世中］显现出［无限者，以及］那些［在伟大］不可见之［灵那深不可测的丰富中得以存在的，使他们］都能［分享他的恩惠］，就是他们［安息之所的丰富］，其上没有任何［国度掌权］。[a]


    “我出自［最初］受差遣的那一位，为要向你们揭示那从起初就存在者。这是因为元始生育者和他的天使心高气傲；他们夸耀自己，说自己是神。我来，是要使他们脱离盲目，好向众人宣告那位居于世界之上的上帝。


    “所以，你们要践踏他们的坟墓，使他们邪恶的意图蒙羞，折断他们的轭，并唤醒属我的人。我已经把统管万有的权柄赐给你们，使你们作光明之子，可以用［你们的］脚践踏他们的权势。”


    这些就是［那］蒙福的救主［所说的话；随后，他从］他们中间消失了。从那日起，［所有门徒］就在［灵里满有无法言喻的大喜乐］。［他的门徒］开始传扬那永恒、不可毁灭之［灵］的神圣福音。阿们。


    《耶稣基督的智慧》


