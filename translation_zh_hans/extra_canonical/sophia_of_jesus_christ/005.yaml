lexical_decisions:
- source_word: the Human
  choice: “人”
  rationale: 保留此处作为宇宙论称号的普通名词形式，以引号提示专称用法，避免擅自译成“人子”或“人类”。
- source_word: androgynous
  choice: 兼具男女的
  rationale: 清楚表达双性兼具之义，同时避免现代身份术语带来的额外含义。
- source_word: Sophia
  choice: 索菲亚
  rationale: 作为人格化、专名化的智慧形象音译；加“大”保留 Great Sophia 的称号性质。
- source_word: aeon
  choice: 永世
  rationale: 保留其既可指永恒领域、又可指人格化宇宙实体的张力，不简单等同于“时代”。
- source_word: Ogdoad
  choice: 奥格多阿德
  rationale: 音译技术性专名，避免直接译为“八重体”而过早解释其宇宙论含义。
- source_word: monad
  choice: 单一者
  rationale: 表达“第一、单一的实体”之义，并保留其可能人格化或原则化的含混性。
- source_word: unbegotten ones
  choice: 未受生者
  rationale: 直译其非由生育或产生而来的性质，不改成特定教义术语。
- source_word: interpreter
  choice: 阐释者
  rationale: 保留奉差者作为启示解释者的功能；不武断认定为某一具名人物。
theological_decisions:
- issue: “人”的位格与身份
  choice: 保留为带引号的“人”，并区分“不朽之‘人’”“原初之‘人’”
  alternative: 译作“人类”“人子”或直接认定为基督
  rationale: 见证文本将 Human 用作特殊宇宙论称号，但本段未明确等同于传统称号“人子”；不应替文本解决身份问题。
- issue: 兼具男女的原初者
  choice: 直译为“不死、兼具男女的‘人’”
  alternative: 译作“双性人”或淡化为“完整的人”
  rationale: 原见证明确保留 androgynous，属于本段神学张力，不宜消除；同时采用较中性的现代汉语。
- issue: 众神与“万神之神”
  choice: 保留“众神”“万神之神”
  alternative: 将 gods 弱化为“神圣者”或“诸灵”
  rationale: 文本明确使用复数 gods，并以“God of gods”形成层级结构；应保留其宇宙论措辞。
- issue: 受造者与未受生者的表面张力
  choice: 分别保留“受造者”与“未受生者”
  alternative: 统一改写以消除逻辑矛盾
  rationale: 末段在传世见证中存在概念张力，且源语言复核尚待完成；译文不应自行调和。
- issue: “贫乏的盗贼”及其终结
  choice: 近直译并加脚注说明晦涩
  alternative: 解释为某类宇宙掌权者或具体历史群体
  rationale: 指称对象与句法关系不确定，不能导入特定诺斯替体系解释。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。对技术性宇宙论名词，常见概念意译（如“永世”“单一者”），专名音译（如“索菲亚”“奥格多阿德”）。因科普特文源语言复核尚未完成，本稿属于依据所提供公共领域英文见证的暂定译稿；所有残缺与编辑补足均以正文脚注标记呈现。
