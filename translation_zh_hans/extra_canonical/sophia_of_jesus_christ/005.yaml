translation:
  language: zh_hans
  text: '马太问他：“主、救主，‘人’是怎样显现的？”


    完全的救主说：“我愿你们认识那位在世界以先显现者。


    “起初，那无限、自生、[a]自造的父，充满灿烂、不可言说的光。当他愿意使自己的形像成为一股大能时，那光的本原便忽然显现为不死、兼具男女的‘人’，好叫他们借着那不朽的‘人’得蒙拯救，并借着那位奉差而来作阐释者的，从遗忘中醒来；他与你们同住，直到那些贫乏的盗贼终结之时。[b]他的伴侣是大索菲亚；自起初，自生的父就命定她在他里面与他联合。她出自那首先显现的不朽之‘人’，也就是神性与国度，因为这是由那位称为‘人’、‘自父者’的父显明的。[c]他为了彰显自己的尊荣，创造了一个强大的永世，名叫奥格多阿德；它蒙赐极大的权柄，甚至统管这贫乏的受造界。


    “他从那光和三重的男性之灵——这灵属于他的伴侣索菲亚——创造了众神、天使和[d]天使长，以及无数万千服役者。这是因为这位神创造了神性与国度，所以他被称为‘万神之神’、‘万王之王’。在他里面，原初之‘人’具有他独一的心智与思想，也就是思想、思量与默观、理性[e]和能力。一切现存的属性都是完全而不死的。


    “就不朽坏而言，他们确实相等；但就能力而言，却有差别，如同父与子、子与思想、思想与其余诸者之间的差别。[f]正如我先前所说，在受造者中，单一者居首。其余一切之后所显现的，无不从他的能力中显明。由受造者出现一切被制作的；由被制作的出现被塑成的；由被塑成的出现被命名的。这样，从起初到末了，未受生者之间便产生了差别。”'
  philosophy: optimal-equivalence
