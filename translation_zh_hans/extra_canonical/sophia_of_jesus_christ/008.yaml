  text: 'Then Thomas asked [him], “Lord, Savior, how many aeons are above the heavens?”


    The perfect Savior said, “I praise you for asking about the great aeons, because your roots dwell in the infinities. When those whom I discussed before were revealed, he [supplied . . .]


    (Coptic pages 109 and 110 are missing)


    […] [] and arrive at a unity, we call them the ‘Assembly of the Ogdoad.’ It appeared as androgynous and was named partly male and partly female. The male is called ‘Assembly,’ while the female is called ‘Life,’ so that it could be shown that the life of all the aeons came from a female.


    “And all names were received from the originating principle. This was because, from his harmony with his thought, the powers appeared very quickly and were called ‘gods.’ On the basis of their wisdom, [the] gods of the gods revealed gods, <and the gods> on the basis of their wisdom revealed lords. The lords of the lords, on the basis of their acts of thought, revealed lords, and the lords, on the basis of their power, revealed archangels. The archangels, on the basis of their words, revealed angels, [] likenesses appearing from them that possessed structure, shape, and names for all the aeons and their worlds.


    “And the immortals I have just described all exercise authority from the Immortal Human, who is called ‘Silence,’ because when they contemplated silently, without outward speech, the majesty that belongs to her was brought to completion. Because the indestructible ones possessed authority, each one created a great kingdom in the Ogdoad, as well as thrones, temples, and firmaments for their respective majesties, because all of them came into being through the will of the Mother of the World.”


    Then the holy apostles said to him, “Lord, Savior, tell us about those who dwell in the aeons, because it is necessary for us to inquire about them.”


    The perfect [] Savior said, “You may ask about anything, and I will give you the answer.


    “They created angelic hosts—countless myriads—for service and for their glory. They created virgin spirits, the inexpressible and unwavering lights, because they experience no infirmity or weakness but instead display will.


    “In this way the aeons were quickly completed, together with the heavens and the firmaments, in the glory of the Immortal Human and his consort Sophia. From there, all the aeons and worlds, and those that came afterward, received the model for creating their likenesses, both in the heavens of chaos and in their worlds. And every nature, beginning with the revelation of chaos, dwells in the shadowless light, in indescribable joy, and in unspeakable rejoicing. They continually enjoy their glory, which never fades, [] and their infinite rest, which is indescribable among all the aeons and all their powers that came into being afterward. Everything I have now told you, I said so that you might shine in the light even more than these.”'
