review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实保留了英文学术见证中的残缺标记、尖括号补文、性别张力及宇宙论术语。可安全修正若干细节：对多马应使用单数“你的”；首句“above/surpass the heavens”宜译为“在诸天之上”；缺文处应保留原见证的连续残缺信号；并避免把“for service and their glory”解释为“彰显他们的荣耀”。
  naturalness: 文本庄重、可朗读，整体自然。个别长句经调整后更符合现代书面普通话，同时不消除原文的句法与指代歧义。
  terminology: 保留“永世”“八元体”“会众”“不朽之人”“寂静”“摹像”“索菲亚”等译名。删除脚注中未经本段直接证实的“希腊语背景／经科普特文传递”及“超宇宙”等说明，以免超过所供见证的证据范围。
  issues:
  - severity: medium
    issue: 第二人称数不一致
    rationale: 提问者是多马，英文学术见证此处为单数 you；“你们的根”应改为“你的根”。
  - severity: low
    issue: 首句“超越诸天”不够直接
    rationale: 见证作“above/surpass the heavens”；“在诸天之上”更自然，也不额外赋予“超越”以价值或能力含义。
  - severity: medium
    issue: 缺文信号未完整保留
    rationale: 原见证在“and arrive at a unity”前有省略残缺及一个空方括号；译文应以“[……]［］”保留这两个独立信号。
  - severity: medium
    issue: “for service and their glory”被轻微释义
    rationale: “为要服事，也彰显他们的荣耀”将并列目的解释为“彰显”；改为“供服事，也为他们的荣耀”可保留原句指代和关系的开放性。
  - severity: low
    issue: 术语脚注含有超出所供见证的断言
    rationale: 在直接科普特语复核尚待进行时，不宜断言该词的“希腊语背景（经科普特文传递）”，也不宜加入“超宇宙”等体系化描述。
