  footnotes:
  - marker: a
    text: “永世”译希腊语背景中的 aiōn（经科普特文传递），在本文中可指有位格的超宇宙实体或领域，并非仅指时间长度。
    reason: 说明核心术语在该文献中的多重语义。
  - marker: b
    text: 现存科普特文抄本在此缺少两页，前后语意无法完整衔接。
    reason: 明确重大抄本缺损及其对连贯性的影响。
  - marker: c
    text: “八元体”指由八者构成的整体或领域；此处保留其专门的宇宙论含义。
    reason: 帮助普通读者理解专门术语而不强行体系化。
  - marker: d
    text: “索菲亚”是希腊语 Sophia 的音译，意为“智慧”；此处作为名号使用。
    reason: 交代专名的来源和意义。
lexical_decisions:
- source_word: aeons
  choice: 永世
  rationale: 兼顾 aiōn 的时间、领域及有位格实体等可能含义，并以脚注说明本文的特殊宇宙论用法。
- source_word: Ogdoad
  choice: 八元体
  rationale: 使用可理解而又保留术语性质的译法，避免将其解释性地限定为“八重天”等特定体系。
- source_word: Assembly
  choice: 会众
  rationale: 保留集合、聚集之意，并让它能够自然地作为拟人化名称出现。
- source_word: Immortal Human
  choice: 不朽之人
  rationale: 保留 Human 的泛人类/原型人物张力，不擅自译成带特定教义色彩的“神人”或“原人”。
- source_word: Silence
  choice: 寂静
  rationale: 作为名号保留，并与下文默然观想、不发一言的语义联系。
- source_word: simulacra / likenesses
  choice: 摹像
  rationale: 表达依照原型形成之像，同时避免“偶像”所带来的负面宗教含义。
- source_word: Sophia
  choice: 索菲亚
  rationale: 按名号音译，并在脚注注明其本义为“智慧”，不把专名与普通名词混同。
theological_decisions:
- issue: “永世”是否只是时间单位
  choice: 正文保留“永世”，脚注指出其也可能是有位格实体或领域
  alternative: 译作“灵界”“世代”或“永恒者”
  rationale: 原文语境在时间、领域与有位格存在之间保有张力，不宜单向解释。
- issue: “寂静”的性别指代
  choice: 保留“不朽之人”与“属于她的威荣”之间的性别张力
  alternative: 统一改为男性或女性指代
  rationale: 见证文本本身出现 Human 与阴性代词并置，可能反映复杂的雌雄同体宇宙论；不应静默修平。
- issue: “生命来自一位女性”
  choice: 直译其女性起源表述
  alternative: 弱化为“来自女性的一面”
  rationale: 原见证明确说 came from a female，保留其神学表达而不加评判。
- issue: 末句“比这些更加明亮”的指代
  choice: 保留“这些”的开放指向
  alternative: 明确改成“比这些永世/权能更明亮”
  rationale: 原文代词所指并不完全明确，译文不擅自消除歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。方括号、省略号、尖括号及缺页说明均保留文本见证信号。鉴于科普特语原文复核尚待进行，本稿以所提供的公共领域英译见证为直接起草依据，并避免超出见证文本修补残缺或统一性别、数和指代。
