review_pass:
  verdict: revise
  source_fidelity: 整体忠实保留了英译见证中的残缺标记、尖括号补字、性别张力及宇宙论术语。惟有少数措辞改变了人称或稍作解释性扩展：对多马的“your roots”误作复数“你们的根”；“for service and their glory”宜避免补出“彰显”；“simulacra”一处的“对应”也比原文更具解释性。
  naturalness: 译文总体庄重、可朗读。将“有多少个永世超越诸天”调整为“有多少个永世在诸天之上”，可避免“永世超越诸天”被理解为动词性比较；“从……那里行使权柄”调整为“从……领受权柄”，更合现代汉语。
  terminology: 保留“永世”“八元体”“会众”“不朽之人”“寂静”“索菲亚”等选择是稳妥的。鉴于直接科普特语复核尚待进行，关于 aiōn 的脚注不宜断言其“经科普特文传递”的具体词源路径，改为以本篇用法说明其语义范围。
  issues:
  - severity: medium
    issue: 第二人称数不一致
    rationale: 发问者是多马一人；英语见证为“your roots”，应译“你的根”，不应改为“你们的根”。
  - severity: medium
    issue: “服务和他们的荣耀”被解释性改写
    rationale: “为要服事，也彰显他们的荣耀”将并列短语改成目的与结果，并具体化“荣耀”的关系；宜保留为“为服事和他们的荣耀”。
  - severity: low
    issue: “对应所有的永世及其世界”增添关系
    rationale: 见证仅称这些摹像具有结构、形态和名称，涉及所有永世及其世界；“对应”补入原文未明说的对应关系。
  - severity: low
    issue: 术语脚注的表述超出当前起草依据
    rationale: 所给材料明确说明直接复核科普特语尚待进行；脚注宜说明本篇中“aeons/永世”的功能，而不作“希腊语背景中的 aiōn（经科普特文传递）”的断言。
