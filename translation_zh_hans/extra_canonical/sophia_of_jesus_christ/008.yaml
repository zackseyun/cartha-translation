  language: zh_hans
  text: '于是，多马问[他]：“主啊，救主，有多少个永世[a]超越诸天？”


    完全的救主说：“你询问那些伟大的永世，我称赞你，因为你们的根居于无限之境。当我先前所说的那些显现时，他[赐下……]


    （科普特文第109页和第110页缺失）[b]


    “[……]并归于一体，我们称他们为‘八元体的会众’[c]。它显现为雌雄同体，被称为一部分是男性，一部分是女性。男性称为‘会众’，女性则称为‘生命’，为要表明所有永世的生命都来自一位女性。


    “所有的名称都是从本原得来的。因为他与自己的思想和谐一致，那些权能便极其迅速地显现出来，被称为‘诸神’；众神之神凭着他们的智慧显出诸神，<诸神>又凭着他们的智慧显出诸主；众主之主凭着他们的思想活动显出诸主，诸主凭着他们的能力显出众天使长，众天使长凭着他们的话语显出众天使。[……]从他们而出的摹像显现出来，具有构造、形态和名称，对应所有的永世及其世界。


    “我刚才所说的那些不朽者，都从那位称为‘寂静’的不朽之人那里行使权柄；因为当他们默然观想、不发一言时，属于她的威荣便得以成全。那些不可毁灭者既拥有权柄，就各自在八元体中创造了一个庞大的国度，也为各自的威荣造了宝座、殿宇和穹苍；因为他们全都是按世界之母的旨意而产生的。”


    于是，圣使徒对他说：“主啊，救主，请告诉我们那些住在永世中的，因为我们必须探究他们。”


    完全的[……]救主说：“无论什么，你们都可以问，我必回答你们。


    “他们创造了众天使的军队，数以亿万计，为要服事，也彰显他们的荣耀。他们创造了童贞的灵，就是不可言说、坚定不移的众光；因为他们没有疾病，也不软弱，反而显出意志。


    “永世就这样迅速得以完备，诸天和诸穹苍也一同在不朽之人及其伴侣索菲亚[d]的荣耀中得以完备。所有的永世和世界，以及后来出现的一切，都从那里取得范型，照着它创造自己的摹像——无论是在混沌的诸天中，还是在他们自己的世界里。从混沌显现之时开始，一切本性都住在没有阴影的光中，住在无法描述的喜乐和难以言说的欢腾中。他们不断享受那永不衰残的荣耀[……]和无限的安息；在所有永世以及后来产生的一切权能中，这安息都是无法描述的。我如今把这一切告诉你们，是要使你们在光中比这些更加明亮。”


    [a] “永世”译希腊语背景中的 aiōn（经科普特文传递），在本文中可指有位格的超宇宙实体或领域，并非仅指时间长度。


    [b] 现存科普特文抄本在此缺少两页，前后语意无法完整衔接。


    [c] “八元体”指由八者构成的整体或领域；此处保留其专门的宇宙论含义。


    [d] “索菲亚”是希腊语 Sophia 的音译，意为“智慧”；此处作为名号使用。'
