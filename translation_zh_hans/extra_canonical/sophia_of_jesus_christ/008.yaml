source:
  text: 'Then Thomas asked [him]: “Lord, Savior, how many aeons surpass the heavens?”


    The perfect Savior said: “I praise you for asking about the great aeons, because your roots dwell in the infinities. When those whom I discussed before were revealed, he [supplied . . .]


    (Coptic pages 109 and 110 are missing)


    […] [] and arrive at a unity, we name them ‘Assembly of the Ogdoad.’ It manifested as androgynous and was named part male and part female. The male is called ‘Assembly,’ whereas the female is called ‘Life,’ so that it could be demonstrated that the life for all the aeons came from a female.


    “And all names were obtained from the originative principle. This was because from his harmony with his thought, the powers appeared most rapidly who were called ‘gods,’ and on the basis of their wisdom, [the] gods of the gods revealed gods, <and the gods> on the basis of their wisdom revealed lords, and the lords of the lords on the basis of their acts of thought revealed lords, and the lords on the basis of their power revealed archangels, the archangels on the basis of their words revealed angels, [] simulacra appearing from them possessing structure and shape and appellation for all the aeons and their worlds.


    “And the immortals I have just now described, they all wield authority from the Immortal Human, who is called ‘Silence,’ because when they contemplated (silently) without (outward) speech, the majesty that is hers was brought to completion. Because the indestructible ones possessed authority, each one created a large kingdom in the Ogdoad, and thrones and temples, firmaments for their respective majesties, because all of them originated through the will of the Mother of the World.”


    The holy apostles then said to him: “Lord, Savior, speak to us of those who dwell in the aeons, because it is necessary for us to inquire concerning them.”


    The perfect [] Savior said: “You can ask about anything, and I will give you the answer.


    “They created angelic hosts, countless myriads for service and their glory. They created virgin spirits, the inexpressible and unwavering lights, because they experience no infirmity or weakness, but (instead show) will.


    “In this way were the aeons rapidly completed together with the heavens and the firmaments in the glory of the Immortal Human and his consort Sophia. From there all the aeons and worlds and those that arrived thereafter obtained the model for the creation of their likenesses, (both) in the heavens of chaos and in their worlds. And every nature, beginning with the revelation of chaos, dwells in the shadowless light and in indescribable joy and in unspeakable rejoicing. They continually enjoy their glory that never fades [] and their infinite repose, which is indescribable among all the aeons and all their powers that came into being thereafter. Everything I have now told you, I said so that you could shine in the light even more than these.”'
