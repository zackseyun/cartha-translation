  language: zh_hans
  text: '于是，多马问[他]：“主啊，救主，有多少个永世[a]超越诸天？”


    完全的救主说：“你询问那些伟大的永世，我称赞你，因为你们的根居于无限之境。当我先前所说的那些显现时，他[赐下……]


    （科普特文第109页和第110页缺失）[b]


    “[……]并归于一体，我们称他们为‘八元体的会众’[c]。它显现为雌雄同体，被称为一部分是男性，一部分是女性。男性称为‘会众’，女性则称为‘生命’，为要表明所有永世的生命都来自一位女性。


    “所有的名称都是从本原得来的。因为他与自己的思想和谐一致，那些权能便极其迅速地显现出来，被称为‘诸神’；众神之神凭着他们的智慧显出诸神，<诸神>又凭着他们的智慧显出诸主；众主之主凭着他们的思想活动显出诸主，诸主凭着他们的能力显出众天使长，众天使长凭着他们的话语显出众天使。[……]从他们而出的摹像显现出来，具有构造、形态和名称，对应所有的永世及其世界。


    “我刚才所说的那些不朽者，都从那位称为‘寂静’的不朽之人那里行使权柄；因为当他们默然观想、不发一言时，属于她的威荣便得以成全。那些不可毁灭者既拥有权柄，就各自在八元体中创造了一个庞大的国度，也为各自的威荣造了宝座、殿宇和穹苍；因为他们全都是按世界之母的旨意而产生的。”


    于是，圣使徒对他说：“主啊，救主，请告诉我们那些住在永世中的，因为我们必须探究他们。”


    完全的[……]救主说：“无论什么，你们都可以问，我必回答你们。


    “他们创造了众天使的军队，数以亿万计，为要服事，也彰显他们的荣耀。他们创造了童贞的灵，就是不可言说、坚定不移的众光；因为他们没有疾病，也不软弱，反而显出意志。


    “永世就这样迅速得以完备，诸天和诸穹苍也一同在不朽之人及其伴侣索菲亚[d]的荣耀中得以完备。所有的永世和世界，以及后来出现的一切，都从那里取得范型，照着它创造自己的摹像——无论是在混沌的诸天中，还是在他们自己的世界里。从混沌显现之时开始，一切本性都住在没有阴影的光中，住在无法描述的喜乐和难以言说的欢腾中。他们不断享受那永不衰残的荣耀[……]和无限的安息；在所有永世以及后来产生的一切权能中，这安息都是无法描述的。我如今把这一切告诉你们，是要使你们在光中比这些更加明亮。”


    [a] “永世”译希腊语背景中的 aiōn（经科普特文传递），在本文中可指有位格的超宇宙实体或领域，并非仅指时间长度。


    [b] 现存科普特文抄本在此缺少两页，前后语意无法完整衔接。


    [c] “八元体”指由八者构成的整体或领域；此处保留其专门的宇宙论含义。


    [d] “索菲亚”是希腊语 Sophia 的音译，意为“智慧”；此处作为名号使用。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永世”译希腊语背景中的 aiōn（经科普特文传递），在本文中可指有位格的超宇宙实体或领域，并非仅指时间长度。
    reason: 说明核心术语在该文献中的多重语义。
  - marker: b
    text: 现存科普特文抄本在此缺少两页，前后语意无法完整衔接。
    reason: 明确重大抄本缺损及其对连贯性的影响。
  - marker: c
    text: “八元体”指由八者构成的整体或领域；此处保留其专门的宇宙论含义。
    reason: 帮助普通读者理解专门术语而不强行体系化。
  - marker: d
    text: “索菲亚”是希腊语 Sophia 的音译，意为“智慧”；此处作为名号使用。
    reason: 交代专名的来源和意义。
lexical_decisions:
- source_word: aeons
  choice: 永世
  rationale: 兼顾 aiōn 的时间、领域及有位格实体等可能含义，并以脚注说明本文的特殊宇宙论用法。
- source_word: Ogdoad
  choice: 八元体
  rationale: 使用可理解而又保留术语性质的译法，避免将其解释性地限定为“八重天”等特定体系。
- source_word: Assembly
  choice: 会众
  rationale: 保留集合、聚集之意，并让它能够自然地作为拟人化名称出现。
- source_word: Immortal Human
  choice: 不朽之人
  rationale: 保留 Human 的泛人类/原型人物张力，不擅自译成带特定教义色彩的“神人”或“原人”。
- source_word: Silence
  choice: 寂静
  rationale: 作为名号保留，并与下文默然观想、不发一言的语义联系。
- source_word: simulacra / likenesses
  choice: 摹像
  rationale: 表达依照原型形成之像，同时避免“偶像”所带来的负面宗教含义。
- source_word: Sophia
  choice: 索菲亚
  rationale: 按名号音译，并在脚注注明其本义为“智慧”，不把专名与普通名词混同。
theological_decisions:
- issue: “永世”是否只是时间单位
  choice: 正文保留“永世”，脚注指出其也可能是有位格实体或领域
  alternative: 译作“灵界”“世代”或“永恒者”
  rationale: 原文语境在时间、领域与有位格存在之间保有张力，不宜单向解释。
- issue: “寂静”的性别指代
  choice: 保留“不朽之人”与“属于她的威荣”之间的性别张力
  alternative: 统一改为男性或女性指代
  rationale: 见证文本本身出现 Human 与阴性代词并置，可能反映复杂的雌雄同体宇宙论；不应静默修平。
- issue: “生命来自一位女性”
  choice: 直译其女性起源表述
  alternative: 弱化为“来自女性的一面”
  rationale: 原见证明确说 came from a female，保留其神学表达而不加评判。
- issue: 末句“比这些更加明亮”的指代
  choice: 保留“这些”的开放指向
  alternative: 明确改成“比这些永世/权能更明亮”
  rationale: 原文代词所指并不完全明确，译文不擅自消除歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。方括号、省略号、尖括号及缺页说明均保留文本见证信号。鉴于科普特语原文复核尚待进行，本稿以所提供的公共领域英译见证为直接起草依据，并避免超出见证文本修补残缺或统一性别、数和指代。
