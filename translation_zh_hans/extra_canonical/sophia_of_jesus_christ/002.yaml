  text: 'Matthew said [] to him, “Lord, no one can discover the truth except through you, so teach us the truth.”


    The Savior said, “He Who Is cannot be expressed. No power knew him, no authority, nothing contingent, nor anything created from the foundation of the world until now, but he alone and any to whom he wishes to grant revelation through the one who originated from the First Light. From this point on, I am the Great Savior. This is because he is deathless and eternal.


    “He is eternal, without birth, because anyone who has been born will be destroyed (in death). He is unbegotten, without beginning, because anyone who had a beginning will have an end. Because no one rules over him, he is nameless, since anyone with a name has been created by someone else. And He Who Is has an appearance uniquely his own, [] unlike anything you have seen and understood. Yet it is an enigmatic appearance that transcends everything and surpasses the world. It gazes in every direction (simultaneously) and beholds itself from itself.


    “Because it is infinite, he can never be comprehended.

    He is forever indestructible, with nothing resembling him.

    He is the good that never changes.

    He is without defect.

    He is eternal.

    He is blessed.

    He cannot be known, but he knows himself.

    He is beyond measure; he cannot be traced out.

    He is perfect, without imperfection.

    His blessedness is indestructible.

    He is called ‘Father of the World.’”'
translation:
  language: zh_hans
  text: '马太对他说：[a]“主啊，除非借着你，没有人能发现真理；所以，请把真理教导我们。”


    救主说：“那位存在者无法用言语表达。无论任何能力、任何权柄、任何依存而有之物，还是从世界奠基直到如今的一切受造之物，都不曾认识他；只有他自己认识自己，以及那些他愿意借着出自第一光的那一位向其启示的人。从现在起，我是大救主。这是因为他不死，并且永恒。


    “他永恒而无生，因为凡出生的，都会在死亡中毁灭。他非由谁所生，没有起点，因为凡有起点的，也必有终点。没有谁统治他，所以他无名，因为凡有名字的，都是由别者造出的。那位存在者有他独有的形象，[b]不同于你们所见过、所领会的任何事物；然而，那是一个奥秘莫测的形象，超越一切，胜过世界。它同时望向四面八方，并从自身观看自身。


    “因为它无限，所以他永远无法被领会。[c]


    他永远不可毁灭，没有什么与他相似。


    他是永不改变的善。


    他毫无缺陷。


    他是永恒的。


    他是有福的。


    他无法被认识，却认识自己。


    他不可测量，也无法被探究到底。


    他是完美的，毫无不完美之处。


    他的福分不可毁灭。


    他被称为‘世界之父’。”'
  philosophy: optimal-equivalence
