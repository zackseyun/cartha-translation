lexical_decisions:
- source_word: He Who Is
  choice: 那位存在者
  rationale: 保留称号性质及“存在”含义，避免直接等同于某一传统神名；“那位”也能自然承接后文的人称指代。
- source_word: inexpressible
  choice: 无法用言语表达
  rationale: 以自然现代汉语传达不可言说性，而不将其加强为绝对不可描述。
- source_word: nothing contingent
  choice: 任何依存而有之物
  rationale: contingent 在此与自存、永恒相对；“依存而有”比“偶然之物”更能表达本体上的非必然性，同时避免现代汉语中“偶然事件”的误解。
- source_word: the one who originated from the First Light
  choice: 出自第一光的那一位
  rationale: 保留其身份及“出自”的关系，不擅自解释为受造、所生或流溢。
- source_word: unbegotten
  choice: 非由谁所生
  rationale: 准确表达未被生出的意思，并与前一句“无生”略作区分。
- source_word: enigmatic appearance
  choice: 奥秘莫测的形象
  rationale: 兼顾 enigmatic 的难解性与宗教文本的庄重语体，不把它具体化为幻象。
- source_word: traced out
  choice: 探究到底
  rationale: 表达无法追索穷尽的含义，较逐字的“追踪”更符合现代汉语。
- source_word: Father of the World
  choice: 世界之父
  rationale: 保留原有称号，不扩展为“创造主”或其他神学解释。
theological_decisions:
- issue: “那位存在者”、第一光与大救主之间的关系
  choice: 依原文分别表述，不明确三者的本体关系
  alternative: 将他们解释为同一位、位格关系或流溢层级
  rationale: 见证文本的代词和关系表达存在张力，译文不导入后来的教义框架。
- issue: “从现在起，我是大救主”与随后“他不死，并且永恒”的指代转换
  choice: 保留第一人称到第三人称的转换
  alternative: 把“他”改成“我”，使逻辑更顺畅
  rationale: 原见证明确呈现代词转换；修平会消除可能有意义的歧义。
- issue: “形象”使用中性指代而“那位存在者”使用人格指代
  choice: 在相关句中分别使用“它”与“他”，保留指代张力
  alternative: 全部统一为“他”或“它”
  rationale: 原见证在 appearance/it 与 he 之间发生转换，可能反映形象和存在者之间既关联又有区分。
- issue: “世界之父”的含义
  choice: 作为称号直译
  alternative: 解释为世界的创造者、统治者或万有之父
  rationale: 原文只提供称号，不能据此确定其确切宇宙论功能。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，保留原文的短句排比。当前底本为公共领域英语见证，科普特语抄本的直接复核尚待进行，因此对缺文、术语和代词转换均采取审慎保留的处理。
