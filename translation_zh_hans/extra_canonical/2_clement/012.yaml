review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了所提供英文见证的劝勉、条件句、悖论式引语及作者随后的内部解释，也没有用其他经文协调其特殊表达。不过，“男的与女的合在一起”将原文简略的“the male with the female”较具体地译成“合在一起”，略增原文未明说的意味；“身体怎样显露出来”在汉语中也不够明确。
  naturalness: 整体为庄重、现代且可读的书面普通话。“二者合而为一”“彼此说真话”及“同有一个毫无虚假的灵魂”更合乎汉语搭配。“正如你的身体显露在外”能清楚维持身体／灵魂、外在／内在的对照。
  terminology: “上帝的国”“爱与公义”“显现”“灵魂”“善行”等术语一致且适切。保留“弟兄／姊妹”符合本文共同体语境。“动念”作为不预断具体性质的译法可保留，并应继续用脚注说明其语义未由现有英文见证限定。
  issues:
  - severity: medium
    issue: “男的与女的合在一起”略强化原句关系
    rationale: 英文见证仅作“the male with the female”，其句法与含义本身简略、悖论性强；“合在一起”可能使读者理解为特定的结合方式。改为“男与女在一起”较少添加解释，同时保留后文作者的说明。
  - severity: low
    issue: “你的身体怎样显露出来”表达不够自然明确
    rationale: 此处须表达身体作为“外面”是可见、显露在外的，并以此要求灵魂借善行显明。改为“正如你的身体显露在外”更自然，也更清楚保留对照。
  - severity: low
    issue: “在两个身体里有一个毫无虚假的灵魂”汉语搭配稍生硬
    rationale: “同有一个……”更自然地表达两个身体具有一个不虚假的灵魂，且不改变原文修辞性的说法。
  revised_text: '所以，我们要趁早在爱与公义中等候上帝的国，因为我们不知道上帝显现的日子。


