  register: 采用现代、庄重而易懂的书面普通话。引语保持格言式节奏，解释段则力求清楚。由于所提供的原始材料实际为公版英文见证，且注明希腊原文复核尚待进行，本稿是审慎的暂定译文；未虚构希腊词形或异文。
