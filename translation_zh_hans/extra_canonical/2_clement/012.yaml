review_pass:
  verdict: revise
  source_fidelity: 修订以所提供的英文见证为准。将“righteousness”由较偏向社会正义的“公义”改为“义”，并使“外面／里面”的身体与灵魂对应关系及末段“as a female/as a male”的刻意含混表述更贴近见证。由于未提供可核对的希腊文文本，仍须保留此为暂定复核的限制。
  naturalness: 原译整体庄重通顺，但“你的身体怎样显露出来”在现代汉语中略显生硬，且与命令“让你的灵魂……”衔接不够自然；修订为“身体怎样显明，灵魂也当借着善行显明出来”。末段改用“以……的身份来看待／思想”，避免“动念”在现代汉语中自动引向特定的性欲含义。
  terminology: 保留“上帝的国”“显现”“灵魂”“善行”等用语。采用“爱和义”对应“love and righteousness”，不把义预先限定为公义；“弟兄／姊妹”保留本文群体称谓及其伦理语境。
  issues:
  - severity: medium
    issue: “公义”可能将 righteousness 窄化为社会公平或司法正义。
    rationale: 本段是概括性的伦理劝勉，英文见证并未限定为该义项；“义”在此更能保留其宽广的宗教伦理含义。
  - severity: medium
    issue: “动念”容易把 have no thought of her/him as female/male 具体化为性欲或邪念。
    rationale: 见证的措辞本身没有明说欲望；虽然其语境可能涉及性别化的念头，译文应保留其范围的不确定性。
  - severity: low
    issue: “你的身体怎样显露出来”表达不够自然，且原文该句是身体可见与灵魂应藉善行显明之间的类比。
    rationale: 改写可改善汉语行文，同时保留身体／灵魂、外在／内在的对应结构。
  revised_text: '所以，让我们趁早在爱和义中等候上帝的国，因为我们不知道上帝显现的日子。


    主自己曾有人问他：“你的国何时来到？”他说：“当两者成为一，外面如同里面，男与女在一起，既非男也非女的时候。”[a]


    “两者成为一”，就是我们彼此说真话，并且在两个身体里有一个毫无虚假的灵魂。


    “外面如同里面”的意思是：里面指灵魂，外面指身体。因此，身体怎样显明，灵魂也当借着善行显明出来。


    “男与女在一起，既非男也非女”的意思是：弟兄看见姊妹时，不应以她是女性的身份来看待或思想她；姊妹看见弟兄时，也不应以他是男性的身份来看待或思想他。[b]


    他说：“你们若行这些事，我父的国就必来到。”'
  revised_footnotes:
  - marker: a
    text: 这段不寻常的引语在本章随后得到作者自己的解释；译文保留其悖论式表达，未按其他经文加以协调。
    reason: 帮助读者识别文本本身的特殊措辞和解释结构。
  - marker: b
    text: 此处所据英文见证直译为“不应把她思想为女性／不应把他思想为男性”。其确切范围仍有歧义；译文不将其武断限定为性欲、婚姻意识或一般性别辨识中的任何一种。希腊原文尚待直接复核。
    reason: 保留原文含混的伦理表达，避免“动念”一词造成过度具体化。
  revision_rationale: 修订集中处理可安全判断的语义与汉语表达问题：以“义”保留 righteousness 的宽泛性；以“真话”对应 speak truth；重整身体与灵魂的可见／显明类比；并用较中性的“以……身份来看待或思想”保留末段关于男女的特殊且未完全界定的措辞。引语的悖论性、作者自身的解释以及国度来临的未来条件句均未被协调化或教义化。
