review_pass:
  verdict: revise
  source_fidelity: 首句的希腊文句法（μετὰ τὸ ἀκουσθῆναι τὸν θεὸν τῆς ἀληθείας）及英译见证均只说“真理的上帝既已被聆听／听见”，未明说“上帝已经向我们说了话”。草稿正文加入了说话者、受话者及言说行为，虽以脚注披露，仍属不宜在正文确定的解释。末段“miserable in the times that now are”也不宜径直窄化为“受苦”，应保留现今处境困苦或不幸的较宽含义。其余主要劝勉、悔改、救恩、复活及永恒喜乐的表达基本忠于所给见证。
  naturalness: 整体庄重、流畅，适合朗读。“为……立下目标”搭配略生硬，可改为“为……立定目标”。首句改为“既已聆听了真理的上帝”虽保留原句反常的受词结构，但在汉语中仍可理解；脚注应说明此处可能是指聆听上帝所说的话，而正文不作扩展。
  terminology: “真理的上帝”“弟兄姊妹们”“不义／公义”“悔改”“救恩和生命”“复活”“列祖”均恰当且术语一致。“心里怀有二意”可保留其不专一、摇摆之义；“训诫”可对应 ordinances，且不强加特定礼仪或律法含义。
  issues:
  - severity: high
    issue: 首句将“真理的上帝已经被听见”译为“真理的上帝已经向我们说了话”。
    rationale: 这在正文中补入原句未明说的动作和对象。即使该解释很可能符合场景，也应以脚注保留，而非作为确定译文。
  - severity: medium
    issue: 末段“if he be miserable in the times that now are”译为“即使现今受苦”。
    rationale: “miserable”可涵盖困苦、不幸、凄惨等现世处境，并非必指受苦或患难；改为“在现今的日子里境遇困苦”较能保留宽度。
  - severity: low
    issue: “为……立下目标”搭配不够自然。
    rationale: “为……立定目标”或“给……树立目标”更合现代汉语搭配；前者较贴近原见证的“set a goal”。
  revised_text: '所以，弟兄姊妹们，既已聆听了真理的上帝[a]，我就给你们宣读这篇劝勉，好叫你们留心所写的事，使你们既能救自己，也能救那位在你们中间诵读的人。因为我向你们所求的回报，就是要你们全心悔改，给自己带来救恩和生命。我们若这样做，就会为所有愿意在敬虔和上帝的良善上辛勤追求的年轻人立定目标。


    我们这些愚昧的人，每当有人劝诫我们，使我们离开不义、转向公义时，不要不高兴，也不要恼怒。因为有时我们作恶，自己却没有察觉；这是由于我们心里怀有二意和不信。我们虚妄的欲望也使我们的悟性昏暗了。


    所以，我们要实行公义，好使我们最终得救。遵守这些训诫的人有福了！他们在世上纵然暂时遭受患难，日后却要收取复活所结的不朽果实。


    因此，敬虔的人即使在现今的日子里境遇困苦，也不要忧伤，因为有福的时日正等着他。他必重新活过来，在天上与我们的列祖同在，并在没有忧愁的永恒中欢喜。'
  revised_footnotes:
  - marker: a
    text: 原句直译近于“在真理的上帝被聆听之后”。这句结构凝练，可能是指会众先聆听上帝所说的话，随后再听这篇劝勉；但原句没有明确说“上帝向我们说话”。鉴于所提供材料仍待希腊文逐词复核，正文保留其未展开的表达。
    reason: 保留首句的句法与场景歧义，避免将可能的解释写成确定事实，同时披露现有原始语言核对的限制。
  revision_rationale: 修订仅处理可安全确定的问题：首句撤去正文中补入的“向我们说了话”，以脚注说明可能的场景解释；末段将“受苦”改为较宽的“境遇困苦”；并微调个别搭配，使行文自然。其余内容维持原稿的术语、会众劝诫语气及神学张力，不作宗派性协调。
