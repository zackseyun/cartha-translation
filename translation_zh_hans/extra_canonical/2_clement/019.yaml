base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/019.yaml
  text: 'Therefore, brothers and sisters, after the God of truth has been heard, I read you an exhortation so that you may pay attention to what is written, for you may save both yourselves and the one who reads among you. For I ask you, as a reward, to repent with your whole heart and give salvation and life to yourselves. By doing this, we will set a goal for all the young people who desire to labor in the study of godliness and of the goodness of God.


    And let us not be displeased and annoyed, foolish as we are, whenever anyone warns us and turns us away from unrighteousness toward righteousness. For sometimes, while we do evil things, we do not realize it because of the divided minds and unbelief within our hearts, and our understanding is darkened by our vain lusts.


    Therefore, let us practice righteousness so that we may be saved to the end. Blessed are those who obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore, let the godly person not be grieved if he is miserable in the present times; a blessed time awaits him. He will live again in heaven with our fathers and will rejoice throughout a sorrowless eternity.'
translation:
  language: zh_hans
  text: '所以，弟兄姊妹们，既然真理的上帝已经向我们说了话[a]，我就给你们宣读这篇劝勉，好叫你们留心所写的事，使你们既能救自己，也能救那位在你们中间诵读的人。因为我向你们所求的回报，就是要你们全心悔改，使自己得着救恩和生命。我们若这样做，就会为所有愿意在敬虔和上帝的良善上辛勤追求的年轻人立下目标。


    我们这些愚昧的人，每当有人劝诫我们，使我们离开不义、转向公义时，不要不高兴，也不要恼怒。因为有时我们作恶，自己却没有察觉；这是由于我们心里怀有二意和不信。我们虚妄的欲望也使我们的悟性昏暗了。


    所以，我们要实行公义，好使我们最终得救。遵守这些训诫的人有福了！他们在世上纵然暂时遭受患难，日后却要收取复活所结的不朽果实。


    因此，敬虔的人即使现今受苦，也不要忧伤，因为有福的时日正等着他。他必重新活过来，在天上与我们的列祖同住，并在没有忧愁的永恒中欢喜快乐。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原句结构十分凝练，现存英译见证直译近于“真理的上帝被听见之后”。这里按上下文译为“既然真理的上帝已经向我们说了话”，很可能指会众先听了神圣话语，随后再听这篇劝勉；但所提供材料尚待希腊文逐词复核。
    reason: 说明一个影响句法和场景理解的真实歧义，同时明确当前底本证据的限制。
lexical_decisions:
- source_word: God of truth
  choice: 真理的上帝
  rationale: 保留原见证中属格结构及其庄重称谓，不改写成较具解释性的“真实的上帝”或“赐真理的上帝”。
- source_word: brothers and sisters
  choice: 弟兄姊妹们
  rationale: 自然呈现会众中男女皆被称呼的范围，并符合早期基督徒劝勉文体。
- source_word: double-mindedness
  choice: 心里怀有二意
  rationale: 表达内在摇摆、意志不专一的含义，同时避免现代口语“三心二意”可能带来的轻佻色彩。
- source_word: practice righteousness
  choice: 实行公义
  rationale: 强调持续付诸行动，而不把“公义”缩减为一般性的善行。
- source_word: ordinances
  choice: 训诫
  rationale: 上下文是宣读劝勉并要求顺服；“训诫”兼具教导和约束力，又不预先断定其为礼仪法规。
- source_word: immortal fruit of the resurrection
  choice: 复活所结的不朽果实
  rationale: 保留复活、果实和不朽三重意象，不解释为某一套特定的末世论体系。
- source_word: our fathers
  choice: 我们的列祖
  rationale: “列祖”在庄重宗教语境中自然，并保留群体先辈的历史性指向。
theological_decisions:
- issue: 人“救自己”和“救诵读者”的表述
  choice: 直译保留“使你们既能救自己，也能救……诵读的人”
  alternative: 解释为“促使自己和诵读者得救”或改为被动式“使……蒙救”
  rationale: 原见证将劝勉、悔改与拯救紧密相连；为保存其神学张力，不在正文中加入对神人作用关系的系统解释。
- issue: “使自己得着救恩和生命”中的主动表达
  choice: 保留对听众的直接责任要求
  alternative: 改写为“领受上帝所赐的救恩和生命”
  rationale: 后者虽可能符合某些神学表述，却加入了本句未明说的施予结构；本稿不以宗派性协调消除原文的劝诫力度。
- issue: 末后的重新生活与复活
  choice: 译作“重新活过来，在天上与我们的列祖同住”
  alternative: 直接合并为“复活升天”
  rationale: 保留见证中“再活”与“在天上”的并列，不补入未明确出现的事件次序。
- issue: 现世患难与永恒福乐
  choice: 保留“暂时遭受患难”与“没有忧愁的永恒”的对照
  alternative: 解释为殉道奖赏或炼净过程
  rationale: 段落没有限定患难的具体性质，因此不导入特定历史或教义框架。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话，保留讲章式的会众称呼、劝诫语气和末世盼望。避免过度古雅的“尔等、训令”等表达，也避免把“救自己”等具有神学张力的措辞软化。当前任务所附原始语言来源注明“希腊文复核待完成”，实际可用正文为公版英语见证；因此本稿对关键歧义采取保守处理，并在脚注中披露证据限制。
