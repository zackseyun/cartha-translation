base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/009.yaml
  text: 'Let none of you say that this flesh is not judged and does not rise again.


    Understand this: In what were you saved? In what did you recover your sight, if not in this flesh?


    Therefore, we ought to guard the flesh as a temple of God.


    For just as you were called in the flesh, you will also come in the flesh.


    If Christ the Lord, who saved us, was first spirit and then became flesh, and called us in that way, in the same way we also will receive our reward in this flesh.


    Therefore, let us love one another, so that we all may enter the kingdom of God.


    While we have time to be healed, let us place ourselves in the hands of God the physician, giving him something in return.


    What shall we give in return? Repentance from a sincere heart.


    For he discerns all things beforehand and knows what is in our hearts.


    Therefore, let us give him eternal praise, not only from our lips but also from our hearts, so that he may receive us as sons.


    For the Lord also said, “These are my brothers, those who do the will of my Father.”'
translation:
  language: zh_hans
  text: '你们中间不要有人说，这肉身不受审判，也不会复起。[a]


    你们要明白：你们是在什么之中得救的？又是在什么之中重见光明的？不正是在这肉身之中吗？


    所以，我们应当守护肉身，如同守护上帝的殿。


    因为你们怎样在肉身之中蒙召，也必照样带着肉身而来。[b]


    救我们的主基督，起初是灵，后来成了肉身，并以此呼召了我们；照样，我们也必在这肉身之中领受报偿。[c]


    所以，我们要彼此相爱，好让我们众人都能进入上帝的国。


    趁着还有时间可以得医治，我们要把自己交在上帝这位医生手中，并献上给他的回报。


    什么回报呢？就是发自真诚之心的悔改。


    因为他预先洞察万事，也知道我们心里所存的。


    所以，我们要把永恒的赞美献给他，不仅用嘴唇，也要用内心，好让他接纳我们作儿子。[d]


    因为主也说过：“遵行我父旨意的人，就是我的弟兄。”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉身”在本段反复出现，指人现实、具身的存在；这里并非把肉身当作本质邪恶之物。
    reason: 帮助现代读者把握关键词的一致性，避免受常见贬义用法误导。
  - marker: b
    text: “带着肉身而来”依现有见证直译；这里的“来”具体指向何事，句中没有明说。
    reason: 显明并保存原句的指向含混，不擅自确定为复活、审判或进入国度。
  - marker: c
    text: “起初是灵，后来成了肉身”保留现有见证的表述；本句没有进一步说明“起初”和“成了”的确切神学含义。
    reason: 避免借翻译消解早期基督教文本中的神学张力。
  - marker: d
    text: “儿子”依现有见证保留其称谓；这里强调被上帝接纳进入亲子关系。
    reason: 说明称谓功能，同时不在缺乏希腊文复核时擅自改成包容性复数。
  - marker: e
    text: 这句话与《马太福音》12:50、《马可福音》3:35及《路加福音》8:21的耶稣言论相近，但此处措辞并不完全等同于其中任何一处。
    reason: 标明可能的福音传统背景，同时避免误称为逐字引文。
lexical_decisions:
- source_word: this flesh
  choice: 这肉身
  rationale: 保留本段反复出现的身体性用语及其复活论重点；不用较抽象的“身体”，也不把它贬义化为“肉体”。
- source_word: is judged
  choice: 受审判
  rationale: 采用自然的现代汉语被动表达，同时保留肉身与审判之间直接而强烈的关联。
- source_word: recover your sight
  choice: 重见光明
  rationale: 自然表达恢复视力，也不排除原句可能具有属灵启明的修辞意味。
- source_word: guard the flesh
  choice: 守护肉身
  rationale: 保留“guard”的责任和珍视意味，并与“上帝的殿”这一比喻相连。
- source_word: come also in the flesh
  choice: 也必照样带着肉身而来
  rationale: 保留“来”的方向性和原句含混之处，不擅自具体化为“复活”“受审”或“进入国度”。
- source_word: being first spirit, then became flesh
  choice: 起初是灵，后来成了肉身
  rationale: 忠实保留见证文本中的先后陈述及其神学张力，不以较晚的教义术语改写。
- source_word: receive our reward
  choice: 领受报偿
  rationale: “报偿”兼具回应行为与所得结果的含义，避免预先界定为功德、工资或恩赐。
- source_word: God the physician
  choice: 上帝这位医生
  rationale: 保留上帝为医治者的鲜明比喻，并使现代读者易懂。
- source_word: recompense
  choice: 回报
  rationale: 与下句问答衔接自然；其内容随即被界定为真诚悔改，而不是金钱或等价交换。
- source_word: receive us as sons
  choice: 接纳我们作儿子
  rationale: 保留亲子身份和原见证的阳性称谓；不改写为较宽泛的“儿女”，以免超出当前证据。
theological_decisions:
- issue: 肉身是否参与审判和复起
  choice: 明确译为肉身“受审判，也会复起”
  alternative: 把主语泛化为“人”或仅译作“身体复活”
  rationale: 本段刻意重复“这肉身”，论证救恩、蒙召和报偿都涉及人的具身存在；应保留其论证焦点。
- issue: “起初是灵，后来成了肉身”的基督论表述
  choice: 按见证文本直译并加脚注说明不作体系化展开
  alternative: 改写为“道成肉身”或加入“仍然是神”等解释
  rationale: 原句具有真实的历史神学张力；译文不应替作者消解，也不应导入某一宗派的专门表述。
- issue: “带着肉身而来”所指事件
  choice: 保留“来”的开放表达
  alternative: 明确译为末日复活、来到审判台前或进入上帝国
  rationale: 当前提供的英文见证没有明确补足目的地或事件，直译可避免无证据地缩小解释范围。
- issue: 悔改被称为给上帝的“回报”
  choice: 保留问答结构和“回报”措辞
  alternative: 弱化为“我们该做的是悔改”
  rationale: 原文修辞把悔改作为对神医治的回应；保留此说法，但不把它解释成赚取救恩的代价。
- issue: “接纳我们作儿子”与遵行旨意
  choice: 保持原有目的关系
  alternative: 改写为因行为称义或仅为已经得救的证据
  rationale: 原句本身没有系统说明二者的教义关系，译文应保留劝勉的力度而不导入外加体系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留短促问答、反复的“所以”以及“肉身”这一贯穿全段的关键词。鉴于所提供材料明确说明希腊文直接复核尚未完成，本稿以公共领域英文见证及经审校的英文咨询层为当前证据，不假称已解决希腊词形、句法或异文问题；正式出版前应据希腊手稿传统复核，尤其是“带着肉身而来”“起初是灵”“儿子”等处。
