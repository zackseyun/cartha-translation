review_pass:
  verdict: revise
  source_fidelity: 整体忠实传达了所给英文见证的劝勉、审判与盼望脉络，也保留了“我们中间”、言语或行为否认耶稣、以及按行为这一重要表达。需要修订之处主要是个别中文措辞与对源句省略结构的处理：将“属魂的享乐”改为自然的“灵魂的享乐”，并使“按各人的行为”更贴近见证文本的保留性表达，而不以“对待各人”补足原文未明说的动作。
  naturalness: 译文庄重清楚，适合讲道式早期基督教文本。“在善事上扶持软弱的人向上”与“属魂的享乐”略显生硬；改作“在善上扶助软弱的人，使他们向上进步”及“灵魂的享乐”，较合现代标准汉语，且不减损原有修辞。
  terminology: “悔改”“上帝”“长老”“诫命”“义人”等术语使用一致且不带宗派制度预设。“劝人回转”可改为“彼此归正”，在互相劝勉的语境中更简洁，也更贴近 convert 的使之转回含义。引文中的“各支派、各方言”可保留其传统经文式列举与集体范围。
  issues:
  - severity: medium
    issue: “按各人的行为对待各人”补入了源句未明确的谓语。
    rationale: 英文见证为“redeem us, each man according to his works”，其“按行为”与“救赎”的具体句法关联存在省略和歧义。“对待各人”虽意在避免教义定论，却仍额外指定了神对人所作的行动。应以“来救赎我们各人，按各人自己的行为”保留其紧邻关系，并由注释说明未决的句法关系。
  - severity: medium
    issue: “属魂的享乐”不符合自然现代汉语。
    rationale: 该词组虽试图逐词对应 pleasures of the soul，却造成不必要的术语化和理解障碍。“灵魂的享乐”既保留 soul 的限定，也更自然；脚注可继续说明其语义范围及直接希腊文复核的限制。
  - severity: low
    issue: “在善事上扶持软弱的人向上”搭配略显别扭。
    rationale: 见证的“lead the weak upward as touching that which is good”着重于在善上带领、促进软弱者。改为“在善上扶助软弱的人，使他们向上进步”更通顺，且保留向上引导的形象。
  - severity: low
    issue: “万国、万族和万种语言的人”中的“万种语言的人”范围表达不够整齐。
    rationale: 列举的是民族、支派、语言。“万国、各支派、各方言”能自然保留引文的三项集合名词，避免把“语言”不必要地转换为“说语言的人”。
  revised_text: '所以，我们要全心悔改，免得有人在途中灭亡。因为，如果我们领受了命令，要以此为己任，使人脱离偶像，并教导他们，那么，一个已经认识上帝的灵魂若灭亡，岂不是更不应该吗？


    所以，我们要彼此帮助，也要在善上扶助软弱的人，使他们向上进步，好叫我们都可以得救。我们也要彼此归正，彼此劝戒。


    我们不要以为，只有现在在这里时才需要留心和相信。回家以后，我们也要记住主的诫命，不容自己被世俗的欲望拖向别处。我们反而要更常到这里来，努力在遵行主的诫命上长进，使我们众人同心，可以一同被招聚进入生命。


    因为主说：“我来，要招聚万国、各支派和各方言。”[a] 这里说的是他显现的日子；那时他要来救赎我们各人，按各人自己的行为。[b]


    不信的人将看见他的荣耀和大能；他们看见世上的国被赐给耶稣，就会惊惶，说：“我们有祸了！原来你早已存在，我们却不知道，也不相信；长老把关乎我们得救的事告诉我们，我们也没有听从。”又说：“他们的虫不死，他们的火不灭；他们必成为所有血肉之人的景象。”[c]


    这里说的是审判的日子；那时，人们将看见我们中间那些过着不敬虔生活、虚假对待耶稣基督诫命的人。


    但义人行了善，忍受了苦楚，并且厌弃灵魂的享乐。[d] 当他们看见那些作恶、在言语或行为上否认耶稣的人，在不熄灭的火中遭受严酷的痛苦，就必将荣耀归给上帝，说：“全心事奉上帝的人必有盼望。”'
