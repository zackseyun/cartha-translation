base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/014.yaml
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church, which is spiritual and was created before the sun and the moon. But if we do not do the will of the Lord, we will belong to the scripture that says, “My house was made a den of robbers.” So then, let us choose instead to belong to the church of life, so that we may be saved.


    I do not suppose that you are unaware that the living church is the body of Christ, for the scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. And the Books and the Apostles plainly declare that the church does not exist now for the first time, but has existed from the beginning. For she was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    Now the church, being spiritual, was revealed in the flesh of Christ, thereby showing us that if any of us guards her in the flesh and does not defile her, that person will receive her again in the Holy Spirit. For this flesh is the counterpart and copy of the spirit. Therefore, no one who has defiled the copy will receive the original as their portion. This, then, is what he means, brothers and sisters: “Guard the flesh, so that you may partake of the spirit.”


    But if we say that the flesh is the church and the spirit is Christ, then whoever has treated the flesh wantonly has treated the church wantonly. Such a person, therefore, will not partake of the spirit, which is Christ>.


    So excellent are the life and immortality that this flesh can receive as its portion if the Holy Spirit is joined to it. No one can declare or tell the things that the Lord has prepared for his elect.'
translation:
  language: zh_hans
  text: '**《革利免二书》14章**


    所以，弟兄姊妹们，我们若遵行上帝我们父的旨意，就必属于那起初的教会[a]；这教会是属灵的，在日月以前就已受造。我们若不遵行主的旨意，就必归入经上所说的那一类：“我的殿成了强盗的巢穴。”因此，我们宁可选择属于生命的教会，好使我们得救。


    我想，你们并非不知道，这活着的教会就是基督的身体；因为经上说：“上帝造人，有男有女。”男的是基督，女的是教会。圣书[b]和使徒们也清楚表明：教会并不是如今才有的，而是从起初就已存在。她原是属灵的，正如我们的耶稣也是属灵的；她却在末后的日子显现出来，为要使他拯救我们。[c]


    教会既是属灵的，就在基督的肉身中显现出来。这向我们表明：我们中间若有人在肉身中守护她，不玷污她，就必在圣灵里重新领受她。因为这肉身是灵所对应的样式和摹本[d]。所以，谁玷污了摹本，谁就不能得着真本作为自己的份。弟兄姊妹们，这就是那话的意思：“要守护肉身，好使你们有分于灵。”


    我们既说肉身是教会，灵是基督，那么，谁凌辱肉身，谁就是凌辱教会。这样的人必不能有分于那灵，也就是基督。


    若圣灵与这肉身联合，这肉身所能有分的生命和不朽，是何等丰盛！主为他所拣选的人预备的事，没有人能述说，也没有人能讲明。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “起初的教会”也可较直译为“第一教会”；这里主要指她在日月以前已经存在。
    reason: 保留希腊语 πρώτη 可能具有的时间先在与次序双重色彩。
  - marker: b
    text: “圣书”原文直译为“诸书”，可能指当时被奉为权威的经卷。
    reason: 避免将早期文献中的开放称谓不加说明地等同于后世固定范围的正典。
  - marker: c
    text: 原文以阴性形式说教会“显现”，却以阳性形式表达“使……拯救”，可能转而以基督为拯救者；句法关系并不完全清楚。
    reason: 标明原文真实存在的代词和主语张力，避免译文擅自统一。
  - marker: d
    text: “所对应的样式和摹本”所译的词可指与原型相应的表样、副本或对应物；下文与“真本”相对。
    reason: 该术语意义范围较宽，且在后世神学用法中容易被过度专门化。
lexical_decisions:
- source_word: ἐκκλησία
  choice: 教会
  rationale: 保留早期基督教群体及其属灵实体的双重含义；本章又以女性代词“她”延续原文的拟人表达。
- source_word: πρώτη
  choice: 起初的
  rationale: 既可表达时间上的先在，也避免把它过度解释为等级意义的“第一”。脚注提示其较直译形式。
- source_word: τὰ βιβλία
  choice: 圣书
  rationale: 原文直译为“诸书”，语境应指被视为权威的经卷；译作“圣书”比现代定型术语“圣经”更能保留早期文献语境。
- source_word: σάρξ
  choice: 肉身
  rationale: 本段讨论可被守护、玷污并与圣灵联合的具体身体存在；“肉身”自然且保留其神学张力。
- source_word: ἀντίτυπον
  choice: 所对应的样式和摹本
  rationale: 该词表示与原型相应的表样或副本；结合下文与“真本”的对举，采用双重措辞以呈现其范围。
- source_word: αὐθεντικόν
  choice: 真本
  rationale: 与“摹本”形成清楚对照，表达具有本原、真实权威的原型，而不额外引入后世形上学术语。
- source_word: μεταλαμβάνειν
  choice: 有分于／得着
  rationale: 按宾语和语境分别处理：与“灵、生命、不朽”连用时译作“有分于”，与“真本”连用时译作“得着”，使现代汉语自然。
- source_word: ὑβρίζειν
  choice: 凌辱
  rationale: 保留原词所含侮辱、粗暴侵犯之意，不把它缩窄为某一种特定性行为。
- source_word: ἀφθαρσία
  choice: 不朽
  rationale: 表达不腐坏、不灭亡的生命状态；避免只译为物质层面的“不腐烂”。
theological_decisions:
- issue: 教会在创造以前或从起初存在
  choice: 按文本译为“在日月以前就已受造”及“从起初就已存在”
  alternative: 将其解释为上帝永恒计划中的教会
  rationale: 原文直接陈述属灵教会的先在；译文不把它改写为某种特定教义体系。
- issue: “男的是基督，女的是教会”的解释
  choice: 保留作者的对应陈述
  alternative: 将其弱化为一般婚姻象征或改写为亚当与夏娃的预表
  rationale: 作者明确作出基督—教会的寓意性对应，翻译应呈现而非替作者重新论证。
- issue: 显现者及拯救者的代词转换
  choice: 译为“她……显现……为要使他拯救我们”，并加注
  alternative: 统一主语为教会，译成“为要拯救我们”
  rationale: 原文在教会的阴性指称与“拯救”的阳性动词形式之间存在突出的语法张力，可能暗示基督为拯救者；不宜静默抹平。
- issue: 教会在基督肉身中显现
  choice: 直译保留
  alternative: 解释为教会借道成肉身而成为可见群体
  rationale: 原文措辞高度浓缩且神学关系不完全明确，译文不补入后世教会论解释。
- issue: 肉身、教会、灵与基督的对应
  choice: 保留作者逐层建立的对应关系
  alternative: 将“灵”一律明确改成“圣灵”
  rationale: 原文先说一般的“灵”，后称“那灵，也就是基督”，而另处明确说“圣灵”；译文维持这些区分。
- issue: 凌辱肉身的具体所指
  choice: 采用宽义“凌辱肉身”
  alternative: 解释为淫乱、禁欲主义或自残中的某一种
  rationale: 原词语义可涵盖多种羞辱或虐待行为，语境没有充分限定，故保留开放性。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“弟兄姊妹们”自然涵盖受众；“她”用于被拟人化且在原文中为阴性名词的教会。经文引语使用现代标点，不补出原文未明示的出处。鉴于用户材料标注希腊文复核尚待完成，本稿依据所给见证并参照可识别的希腊文本措辞作源语导向处理；出版前仍宜据指定希腊校勘本逐字复核。见证中“Christ>”后的尖括号视为排印残迹，不纳入正文。
