  naturalness: 正文总体庄重、现代且适合朗读。“为要使他拯救我们”在现代汉语中既不自然，也造成不必要的因果关系；改为“为要拯救我们”更通顺，并可由脚注说明其潜在指向。
  terminology: “教会”“肉身”“灵／圣灵”“生命和不朽”及“凌辱”均处理稳妥。“圣书”可保留，以免把“诸书”直接等同于后世固定正典。
  issues:
  - severity: high
    issue: 第二段末句“为要使他拯救我们”误作使役结构。
    rationale: 所据见证为“but was manifested in the last days that He might save us”；相应希腊目的从句表达“为要／以便拯救我们”，并不表示教会的显现“使”基督去拯救。应删除“使他”。
  - severity: medium
    issue: 脚注c称拯救动词为“阳性形式”，不准确。
    rationale: 该动词为第三人称单数主动虚拟式，本身不编码语法性别。语境中拯救者的指向确可讨论，但不能以“阳性动词形式”作为依据。
