  - severity: medium
    issue: 第5段“不要吝惜自己”搭配及语义不够清楚
    rationale: 原意不是吝啬地对待自己，而是不可因某种自我亏待而失去得着许多福分的机会；“不要亏待自己，错失……”更清楚自然。
