base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/015.yaml
  text: 'Now I do not think that I have given any insignificant counsel concerning self-control, and whoever performs it will not regret it, but will save both himself and me, his counselor. For it is no small reward to convert a wandering and perishing soul, so that it may be saved.


    For this is the recompense that we are able to pay to God who created us: if he who speaks and he who hears both speak and hear with faith and love.


    Let us therefore abide in the things we have believed, in righteousness and holiness, that we may be with boldness before God, who says, “While you are still speaking, I will say, ‘Behold, I am here.’”


    For this word is the token of a great promise; for the Lord says of himself that he is more ready to give than the one who asks is to ask.


    Seeing, then, that we are partakers of so great kindness, let us not begrudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to those who have performed them, so also is the condemnation great which they bring to those who have disobeyed.'
translation:
  language: zh_hans
  text: '《革利免二书》15


    我认为，我关于节制[a]所提出的劝告绝不是无足轻重的。凡实行这劝告的人，必不后悔，反而会救他自己和我这个劝告者。[b]因为，使一个迷失而正在灭亡的灵魂回转、得救，所得的赏赐绝非微小。


    我们所能献给创造我们的上帝作为回报的，就是：讲的人和听的人都怀着信心和爱心讲、听。


    所以，让我们持守我们所信的事，活在公义和圣洁中，好使我们可以坦然无惧地向上帝祈求。他说：“你还在说话的时候，我就要说：‘看哪，我在这里。’”[c]


    这句话是一个伟大应许的凭据；因为主论到自己说，他乐意赐予，比祈求的人乐意祈求更加迫切。


    既然我们有分于如此浩大的恩慈，就不要亏待自己，错失得着这么多美好福分的机会。因为这些话给遵行之人带来的喜乐有多大，给悖逆之人带来的定罪也同样有多大。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节制”也可译作“自制”或“克己”；在早期基督教语境中，有时特别包括性方面的贞洁或禁欲。
    reason: 原词范围较广，正文不宜擅自缩窄，故以脚注提示可能含义。
  - marker: b
    text: 这里把听从劝告之人的得救与提出劝告之人的得救联系起来；原文的表达较强，正文予以保留。
    reason: 防止读者误以为“救我”是笔误，同时不以解释取代原文的神学张力。
  - marker: c
    text: 这句话与《以赛亚书》65:24相近；作者的引述形式与现存经文传统的常见措辞略有不同。
    reason: 标明经文回声，并提醒读者这是古代引述形式，而非强行与某一后世译本统一。
lexical_decisions:
- source_word: ἐγκράτεια
  choice: 节制
  rationale: 该词可涵盖自制、克己，并在本段语境中可能特别涉及性方面的禁欲或贞洁；正文采用较宽而自然的“节制”，以免把含义不必要地缩窄。
- source_word: ἐπιστρέψαι
  choice: 使……回转
  rationale: 保留从迷失状态转回的方向性和劝化意味，比单纯译作“改变”更具体。
- source_word: παρρησία
  choice: 坦然无惧
  rationale: 表达在上帝面前自由、放胆祈求的意味，同时符合现代汉语宗教语体。
- source_word: χρηστότης
  choice: 恩慈
  rationale: 兼顾仁厚、良善与惠待之意；在“有分于”这一语境下，“恩慈”自然且不预先限定为某套神学术语。
- source_word: λόγια
  choice: 这些话
  rationale: 本词可指话语、训言或神谕；依上下文采用宽泛的“这些话”，保留其指涉范围。
theological_decisions:
- issue: 劝告者因听者遵行而“得救”
  choice: 直译为“也会救我这个劝告他的人”
  alternative: 弱化为“也使我这个劝告者得益”或“使我的劝告得到 vindication”
  rationale: 原文形成听者与劝告者同得拯救的张力；不宜为配合某种救恩论而将“救”改弱。脚注说明其修辞关联，但不替作者消解张力。
- issue: 人在上帝面前的胆量
  choice: 译为“坦然无惧地向上帝祈求”
  alternative: “在上帝面前坦然无惧”
  rationale: 希腊语句法指向带着坦然向上帝祈求；这样既准确，也与随后关于上帝乐意赐予的论述衔接。
- issue: 遵行与喜乐、悖逆与定罪的对称关系
  choice: 保留强烈对称句式
  alternative: 解释为今生的心理满足与遗憾
  rationale: 文本未限定喜乐和定罪发生的时间或性质，因此不作末世论或心理化的额外判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。段落结构依原文论证推进；避免古奥的文言句式。译文以希腊文本可恢复的措辞为主要依据，并参照所提供的公共领域英文见证及英文POB校核层；对“节制”“救劝告者”“坦然祈求”等关键处保留原文的语义宽度与神学张力。
