  source_fidelity: 整体准确保留了本章的劝勉脉络、节制主题、劝告者与受劝者相连的“得救”表述，以及遵行与悖逆所带来结果的强烈对照。第2段原文是说明一种向创造主“偿还／回报”的方式，带有条件结构；原译“就是让……”稍将条件性改写为定义性说明，宜恢复。第5段“不要吝惜自己，以致得不到”不够贴合“不要亏待自己而错失得着众多福分”的意思。
