review_pass:
  verdict: revise
  source_fidelity: 整体忠实保留了劝勉、末日审判及施舍等伦理陈述，且未擅自化解其神学张力。但“审判的日子已经临近”把见证中的“comes even now”弱化并改为“临近”；“充满这些美德”则把未明说的“these”解释为“美德”。应作保守修订。
  naturalness: 译文总体庄重通顺。首句“趁着仍有一位接纳我们的，回转归向”语序略显滞涩；“制伏自己的心”也较易被理解为压制情感，未能稳妥承载 soul 的较宽泛含义。
  terminology: “弟兄姊妹”“悔改／回转归向”“天上的众能力”“施舍”“无愧良心”均可。为避免将 soul 窄化为“心”，宜译为“克制自己”，并在句法上保留其与邪恶欲望的关系。
  issues:
  - severity: medium
    issue: “审判的日子已经临近”
    rationale: 英语见证说“the day of judgment comes even now”，重点是其正在来到／迫近，而不只是静态地“临近”。“已经临近”既加入“已经”，又未表达动态来临。
  - severity: medium
    issue: “凡被发现充满这些美德的人”
    rationale: 见证仅说“everyone found full of these”。“美德”是译者加入的分类性解释；“这些”可涵盖前述各项实践和状态，宜不具体化。
  - severity: low
    issue: 首句和第二句的措辞及语序
    rationale: “所得的悔改机会并不小”及“趁着仍有一位接纳我们的，回转归向”不够自然；“制伏自己的心”也可能窄化 soul。可在不改变含义的前提下调整。
  revised_text: '所以，弟兄姊妹，既然我们得着的悔改机会不小，又还有时间，就当趁着仍有一位接纳我们的，回转归向那召我们的上帝。


    因为，我们若告别这些享乐，克制自己，不去满足自己邪恶的欲望，就必有分于耶稣的怜悯。


    你们知道，审判的日子正在来到，如同燃烧的火炉；天上的众能力都要熔化，全地也要像铅在火中熔化一样。到那时，世人隐秘和公开的行为都要显露出来。


    所以，施舍是美善的，正如从罪中悔改也是美善的。禁食胜过祷告，施舍又胜过这两样。爱能遮盖许多的罪，而出于无愧良心的祷告能救人脱离死亡。凡被发现具备这些的人，都是有福的，因为施舍能卸下罪的重担。[a]'
  revised_footnotes:
  - marker: a
    text: 本译文依据所提供的公版英语见证起草；尚待直接校勘希腊文原始资料。英语见证中的“sin&gt;”显为转码残迹，按上下文在此处理为句号。
    reason: 所提供的文本基础明确说明尚未直接复核希腊文，且英语见证在该处有格式损坏；保留说明以透明交代文本依据及处理。
  revision_rationale: 修订以保留见证文本的动态末世语气，避免将“these”解释成“美德”，并使首段及“conquer our soul”的中文表达更自然而不窄化原意。其余关键术语和善行、罪、死亡之间未加解释的陈述均予保留。
