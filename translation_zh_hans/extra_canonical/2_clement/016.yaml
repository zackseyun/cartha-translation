    所以，施舍是美善的，正如从罪中悔改也是美善的。禁食胜过祷告，施舍又胜过这两样。爱能遮盖许多的罪，而出于无愧良心的祷告能救人脱离死亡。凡被发现充满这些的人，都是有福的，因为施舍能卸下罪的重担。[a]'
