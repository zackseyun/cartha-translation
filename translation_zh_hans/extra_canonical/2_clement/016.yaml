base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/016.yaml
  text: 'Therefore, brothers and sisters, since we have found no small opportunity for repentance, seeing that we have time, let us return to God who called us, while we still have One who receives us.


    For if we bid farewell to these enjoyments and conquer our soul by refusing to fulfill its evil desires, we shall be partakers of the mercy of Jesus.


    But you know that the day of judgment comes even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire; and then the secret and open works of human beings shall appear.


    Almsgiving, therefore, is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covers a multitude of sins, but prayer out of a good conscience delivers from death. Blessed is everyone found full of these. For almsgiving lifts off the burden of sin.'
translation:
  language: zh_hans
  text: '所以，弟兄姊妹，既然我们所得的悔改机会并不小，又还有时间，就当趁着仍有一位接纳我们的，回转归向那召我们的上帝。


    因为，我们若弃绝这些享乐，制伏自己的心，不去满足其中邪恶的欲望，就必有分于耶稣的怜悯。


    你们知道，审判的日子已经临近，如同燃烧的火炉；天上的众能力都要熔化，全地也要像铅在火中熔化一样。到那时，世人隐秘和公开的行为都要显露出来。


    所以，施舍是美善的，正如从罪中悔改也是美善的。禁食胜过祷告，施舍又胜过这两样。爱能遮盖许多的罪，而出于无愧良心的祷告能救人脱离死亡。凡被发现充满这些美德的人，都是有福的，因为施舍能卸下罪的重担。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文依据所提供的公版英语见证起草；希腊文原始资料的直接校勘尚待完成。英语见证中“sin&gt;”显然含有转码残迹，此处按句号处理。
    reason: 资料明确注明尚未直接复核希腊文，且英语见证存在格式损坏；出版草稿应透明说明文本基础。
lexical_decisions:
- source_word: brethren
  choice: 弟兄姊妹
  rationale: 英语见证中的“brethren”在共同体称呼中通常包含全体成员；用现代汉语“弟兄姊妹”自然表达其包容范围。
- source_word: repentance / turn again
  choice: 悔改／回转归向
  rationale: 保留本段重复出现的归回意象，同时用现代汉语区分名词“悔改”和行动性的“回转归向”。
- source_word: conquer our soul
  choice: 制伏自己的心
  rationale: 避免生硬直译“战胜我们的灵魂”；表达克制内在邪欲的语境含义，但不把“soul”的含义限定为纯粹情绪。
- source_word: powers of the heavens
  choice: 天上的众能力
  rationale: 保留该表达可能指宇宙力量或属天权能的歧义，不擅自具体化为星体或天使。
- source_word: almsgiving
  choice: 施舍
  rationale: “施舍”是现代汉语中简洁而传统的对应词，指向向贫乏者提供财物援助的宗教伦理行为。
- source_word: good conscience
  choice: 无愧良心
  rationale: 比“好的良心”更自然，也保留祷告发自清洁、无亏良心的伦理意味。
theological_decisions:
- issue: 施舍、祷告与脱离死亡及罪的重担之间的关系
  choice: 按见证文本保留直接陈述，不添加“象征性”“功德性”或其他解释框架
  alternative: 将其释义为施舍证明悔改，或明确限定为仅关乎今生后果
  rationale: 原文陈述具有明显神学张力；翻译不应替文本解决善行、赦罪与拯救之间的关系。
- issue: “有分于耶稣的怜悯”的语气
  choice: 译作“就必有分于耶稣的怜悯”
  alternative: 译作“便可能蒙耶稣怜悯”
  rationale: 供应的见证使用确定性的将来表达，应保留其劝勉中的应许力度。
- issue: “爱遮盖许多的罪”所指
  choice: 保留为“爱能遮盖许多的罪”
  alternative: 明确为上帝的爱、人的爱，或解释“遮盖”为获得赦免
  rationale: 见证没有明确说明爱的主体或“遮盖”的具体机制，应保存其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保持劝勉文的迫切感，并尽量保存末世审判、属天能力及善行与罪之间未经化解的神学张力。
