base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/006.yaml
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
translation:
  language: zh_hans
  text: '主说：“没有一个仆人能服事两个主人。”我们若想既服事上帝，又服事玛门[a]，对我们毫无益处。


    因为，人纵然赚得全世界，却赔上自己的生命，又有什么益处呢？


    现今的世代和将来的世代彼此为敌。现今的世代宣扬奸淫、败坏、贪财和欺骗；将来的世代却弃绝这一切。


    所以，我们不能同时作两者的朋友；我们必须弃绝这一个，与那一个相交。


    我们应当思想：恨恶此世之物才是更好的，因为这些事物微不足道、短暂而且会朽坏；要爱慕彼世之物，因为那些事物是美善而且不朽坏的。


    我们若遵行基督的旨意，就必得享安息；否则，我们若不听从他的命令，就没有什么能救我们脱离永远的刑罚。


    圣经在《以西结书》中也说：“即使挪亚、约伯和但以理起来，也不能救他们被掳的儿女。”[b]


    连这样的义人尚且不能凭自己的义行救他们的儿女，那么，我们若不持守自己所受的洗礼，使其纯洁、毫无玷污，又凭什么把握进入上帝的国呢？除非显明我们有圣洁、公义的行为，否则谁能作我们的辩护者呢？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛门”是闪语词，指钱财、财富；这里与“上帝”并列，被描写成另一个主人。
    reason: 帮助普通读者理解音译词，同时保留原文的拟人化修辞。
  - marker: b
    text: 这里按本书所引述的形式翻译；其措辞和人名次序与现存《以西结书》14:14、20的常见文本有所不同。
    reason: 标明早期文献引文与旧约传本之间的差异，避免让读者误以为这是现代译者的改写。
lexical_decisions:
- source_word: μαμωνᾶς
  choice: 玛门
  rationale: 保留经文传统中的人格化称呼，并用脚注说明其所指为财富钱财，避免只译“财富”而削弱“两个主人”的修辞。
- source_word: ψυχή
  choice: 生命
  rationale: 此处可指生命、自我或灵魂；“赔上自己的生命”符合上下文的得失对比，同时不把词义过早限缩为后世二分法意义上的“灵魂”。
- source_word: οὗτος ὁ αἰών / ὁ μέλλων
  choice: 现今的世代／将来的世代
  rationale: 保留早期基督教末世论中两个世代的对照，也维持原文将二者拟人化为敌人的表达。
- source_word: μικρά
  choice: 微不足道
  rationale: 原义偏向“小、微小”，不是明确的道德定罪；此译比“毫无价值”更克制。
- source_word: ἀνάπαυσις
  choice: 安息
  rationale: 保留该词兼具歇息、终末安歇的可能含义，不具体化为今生平安或天堂。
- source_word: παράκλητος
  choice: 辩护者
  rationale: 在审判与进入上帝国的语境中表达出援助、代言和辩护的功能；不直接套用约翰文献中常见的专名式译法。
theological_decisions:
- issue: 洗礼与进入上帝国的关系
  choice: 直译为“持守自己所受的洗礼，使其纯洁、毫无玷污”
  alternative: 解释为“持守洗礼誓言”或“保持洗礼后的生命纯洁”
  rationale: 原文“τηρήσωμεν τὸ βάπτισμα”本身可涉及洗礼、洗礼身份或洗礼生活；正文保留这种张力，不替作者作教派化阐释。
- issue: 义行、得救与辩护的关系
  choice: 保留作者以义行、进入上帝国和辩护者相连的劝诫语气
  alternative: 加入“义行只是得救的证据”等系统神学解释
  rationale: 原文没有在此展开因信、行为与恩典的系统关系；不应以注释消解其严肃警告。
- issue: 永远的刑罚
  choice: 译为“永远的刑罚”
  alternative: 译为“永恒刑罚”并进一步说明其性质或期限
  rationale: 直接反映“αἰωνίου κολάσεως”，保留其强烈而未细加定义的末世审判语言。
- issue: 以西结书引文的人名次序与措辞
  choice: 按《革利免二书》所见形式译出“挪亚、约伯和但以理起来……被掳的儿女”
  alternative: 按照现存《以西结书》14章的常见正文改写
  rationale: 这里应翻译作者实际引用的形式，而不是无提示地校正为旧约标准文本；差异另以脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留段落的讲道式推进、两个世代的拟人化对照及连续反问。鉴于提交资料注明希腊文复核尚待完成，本稿依据可核对的希腊传统一般读法，并参照所给公共领域英译见证；出版前仍宜以选定的希腊文批判本逐词复核，尤其核查以西结引文及个别异文。
