  yaml_path: translation/extra_canonical/2_clement/007.yaml
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
translation:
  language: zh_hans
  text: '《革利免二书》7


    所以，我的弟兄们，让我们奋力竞赛，因为我们知道，比赛已经迫在眉睫。许多人参加那会朽坏的比赛，但并不是人人都能得冠冕，只有那些辛苦付出、奋勇竞赛的人才能得着。


    那么，让我们奋力竞赛，好叫我们人人都得冠冕。


    因此，让我们沿着正直的道路奔跑，参加那不朽坏的比赛。让我们成群前去参赛，奋力竞赛，好叫我们也得冠冕。即使我们不能人人都得冠冕，至少也要来到冠冕近旁。[a]


    我们应当知道，参加会朽坏之比赛的人，如果被发现以不正当的手段参赛，就会先受鞭打，然后被除名，赶出赛场。


    你们想想，那以不正当的手段参加不朽坏之比赛的人，会受到怎样的处置呢？


    论到那些没有守住所受印记的人，[b]他说：“他们的虫不会死，他们的火不会熄灭；他们必成为凡有血肉之人眼中的景象。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来到冠冕近旁”直译性地保留了原句的异常表达；它可能表示至少要尽力接近得胜，但原文没有进一步说明。
    reason: 提醒读者此处措辞和逻辑张力属于文本本身，不宜静默顺译为必然得冠冕。
  - marker: b
    text: “印记”具体指什么，本文没有说明；早期基督教语境中可有多种关联，正文不作限定。
    reason: 防止把可能的礼仪或身份象征武断限定为某一教义解释。
  - marker: c
    text: 这段话呼应《以赛亚书》66:24；末尾“成为凡有血肉之人眼中的景象”反映本文所采用的引文形式。
    reason: 标明经文互文，同时保留该作品引文与常见旧约译文之间的措辞差异。
lexical_decisions:
- source_word: ἀγωνίζομαι / ἀγών (as reflected in the witness)
  choice: 奋力竞赛／比赛
  rationale: 保留竞技场的连贯意象，并用“奋力”传达努力、争战的语气；避免单译为抽象的“奋斗”而丢失冠冕、赛场等上下文联系。
- source_word: φθαρτός / ἄφθαρτος (as reflected in the witness)
  choice: 会朽坏的／不朽坏的
  rationale: 保留两者明确的对照，不将其提前解释为“属世的／属灵的”。
- source_word: στεφανόω / στέφανος (as reflected in the witness)
  choice: 得冠冕／冠冕
  rationale: 保留古代竞技优胜者获冠冕的形象，同时兼顾其宗教性引申。
- source_word: ὁδὸς εὐθεῖα (as reflected in the witness)
  choice: 正直的道路
  rationale: “直路”与“正直之道”均有可能；正文采用能兼具路径与道德意味的表达，未将其窄化为单纯的直线跑道。
- source_word: σφραγίς (as reflected in the witness)
  choice: 所受印记
  rationale: “印记”保留原有宗教象征，不在正文中断定它专指洗礼、信仰告白或其他礼仪。
- source_word: πᾶσα σάρξ / all flesh (in the cited wording)
  choice: 凡有血肉之人
  rationale: 用自然的现代汉语保留圣经式集合表达，避免直译成较生硬的“所有肉体”。
theological_decisions:
- issue: “印记”的具体所指
  choice: 保留为“所受印记”，不作教义性释义
  alternative: 明确译为“洗礼的印记”或“圣灵的印记”
  rationale: 所给见证文本本身没有明说所指；为避免导入特定传统的解释，正文保留其开放性。
- issue: “即使我们不能人人都得冠冕”的救恩与竞赛张力
  choice: 照原有条件句保留
  alternative: 改写为劝勉人人务必得冠冕，或解释为不同等级的奖赏
  rationale: 原文表述与前一句“好叫我们人人都得冠冕”之间存在真实张力，不宜通过释义消除。
- issue: 引文中“他说”的主语
  choice: 保留“他说”
  alternative: 明确为“上帝说”或“经上说”
  rationale: 当前材料未提供足以确定显式主语的直接希腊语校勘依据，因此不擅自补明。
- issue: 末句的审判图景
  choice: 保留虫、火和公开成为景象的并列意象
  alternative: 将其概括为“受永刑”
  rationale: 保留引文具体而强烈的意象，不以系统神学术语取代文本。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，以“比赛—奔跑—冠冕—赛场”维持全段竞技意象。避免古奥的“竞逐”“不灭之赛”等措辞，也避免口语化的体育报道风格。鉴于任务所附材料明确注明希腊语直接复核尚待完成，本稿以所给公共领域英文见证和审校层为依据，并在关键歧义处采取保守译法；出版前仍应逐句核对希腊文本及异文。
