    那么，让我们奋力竞赛，好叫我们都得冠冕。


    因此，让我们奔走在直的赛程上，就是那不朽坏的竞赛。让我们成群前去参加，并且奋力竞赛，好叫我们也得冠冕。即使我们不能都得冠冕，至少也要接近冠冕。[a]


