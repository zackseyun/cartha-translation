base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/001.yaml
  text: 'Brethren, we ought to think of Jesus Christ as of God, as the Judge of the living and the dead.


    And we ought not to think mean things of our Salvation; for when we think mean things of Him, we also expect to receive mean things. And those who listen as concerning mean things do wrong; and we ourselves do wrong, not knowing whence and by whom and unto what place we were called, and how many things Jesus Christ endured to suffer for our sakes.


    What recompense, then, shall we give to Him? Or what fruit worthy of His own gift to us? And how many mercies do we owe to Him!


    For He bestowed the light upon us; He spoke to us as a father to his sons; He saved us when we were perishing.


    What praise, then, shall we give to Him? Or what payment of recompense for those things which we received?


    We were maimed in our understanding, and worshipped stocks and stones and gold and silver and bronze, the works of men; and our whole life was nothing else but death. While we were thus wrapped in darkness and oppressed with this thick mist in our vision, we recovered our sight, putting off by His will the cloud in which we were wrapped.


    For He had mercy on us and, in His compassion, saved us, having beheld in us much error and perdition, even when we had no hope of salvation except that which came from Him.


    For He called us when we were not, and from not being He willed us to be.'
translation:
  language: zh_hans
  text: '弟兄们，我们应当这样看待耶稣基督：把他看作上帝，看作活人和死人的审判者。


    我们不应当轻看我们的救恩；因为我们若把他看得微不足道，也会盼望领受微不足道的事。那些把所听见的事当作无关紧要之事的人是在犯罪；我们自己若不知道自己是从何处蒙召、由谁呼召、被召到什么地方，也不知道耶稣基督为我们忍受了多少苦楚，也是在犯罪。


    那么，我们要拿什么报答他呢？我们要结出什么果子，才配得上他赐给我们的恩赐呢？我们又欠他多少圣洁之事啊！[a]


    他把光赐给了我们；他像父亲称儿子一样称我们为儿子；我们正走向灭亡时，他救了我们。


    那么，我们要献给他怎样的颂赞呢？对于所领受的一切，我们又能拿什么作为回报呢？


    从前，我们心智残缺，敬拜木头、石头、金、银和铜这些人手所造之物；我们的一生简直就是死亡。那时，我们被黑暗笼罩，眼目被浓雾遮蔽；但我们重见了光明，藉着他的旨意脱去了那包裹我们的云雾。


    他怜悯我们，因着慈悲拯救了我们；他看见我们深陷迷误与灭亡，甚至除了从他而来的救恩以外，我们没有任何得救的盼望。


    我们本不存在时，他呼召了我们；他定意使我们从不存在成为存在。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣洁之事”译自ὅσια，字面指合乎神圣、虔敬的事；在这里可包括人对他所当尽的虔敬行为或义务。
    reason: 保留该复数词的语义范围，不将其限定为单纯“本分”，也不沿用英语见证中“怜悯”的不对应译法。
  - marker: b
    text: “从不存在成为存在”可能指上帝使人从无有中存在，也可能指他借着呼召，使原本算不得一个子民的人成为他的子民；原文没有进一步说明。
    reason: 保留末句在创造与救赎性群体身份之间的真实解释张力。
lexical_decisions:
- source_word: φρονεῖν περὶ Ἰησοῦ Χριστοῦ, ὡς περὶ θεοῦ
  choice: 把耶稣基督看作上帝
  rationale: φρονεῖν περὶ 表示持有某种认识或看法；直陈“看作上帝”，保留原文明确而未加限定的基督论表述。
- source_word: μικρὰ φρονεῖν
  choice: 轻看／看得微不足道
  rationale: 保留 μικρά 的“小、微不足道”意象，同时以现代汉语表达其“低估、轻视”的语用含义。
- source_word: ὅσια
  choice: 神圣的本分
  rationale: 该词在这里更自然地指向应当履行的虔敬或神圣义务，并非英语见证所译的“怜悯”；译文避免将其误作上帝所施的恩惠。
- source_word: ὡς πατὴρ υἱοὺς ἡμᾶς προσηγόρευσεν
  choice: 他像父亲一样称我们为儿子
  rationale: προσηγόρευσεν 是“称呼、称为”，不是泛指“说话”；υἱούς 直译为“儿子”，保留父子称谓。
- source_word: πηροὶ τῇ διανοίᾳ
  choice: 心智残缺
  rationale: 保留 πηρός 所含残损、残缺的强烈比喻，而不弱化为一般的无知。
- source_word: ἀνεβλέψαμεν
  choice: 重见了光明
  rationale: 该动词可指恢复视力或抬眼看见；上下文是眼目被浓雾遮蔽，故采用自然且保留复明意象的表达。
- source_word: οὐκ ὄντας…ἐκ μὴ ὄντος εἶναι
  choice: 本来并不存在……从无有变为存在
  rationale: 尽量保留“非存在—存在”的反复与本体性措辞，不在正文中限定为创造、归信或成为一个子民。
theological_decisions:
- issue: 耶稣基督与上帝及审判者的关系
  choice: “把他看作上帝，看作审判活人和死人的主”
  alternative: “以敬重上帝和审判者的方式尊崇耶稣基督”
  rationale: 原文两个 ὡς περὶ 结构直接规定如何看待基督；不以较弱的“如同”或单纯敬重来淡化其神学张力。
- issue: “我们本来不存在”的所指
  choice: 正文保留“从无有变为存在”的开放措辞，并加注说明
  alternative: 明确译为“从前不是上帝的子民，如今成为他的子民”或“从虚无中被创造”
  rationale: 短句本身可被理解为创造语言，也可在呼召语境中指身份或群体的形成；不替原文排除任何一端。
- issue: 救恩与基督指代的衔接
  choice: 将 αὐτοῦ 译作“他”
  alternative: 译作“救恩”或明确补出“基督”
  rationale: 希腊语使用阳性代词，最自然地回指基督；保留代词也避免加入原文没有的解释。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。句式保留早期基督教劝勉文的反问、排比和强烈意象；避免仿古词汇，也不以宗派术语补足原文未说明之处。底稿依据所给英语见证，但关键措辞已按现存希腊文本核对。
