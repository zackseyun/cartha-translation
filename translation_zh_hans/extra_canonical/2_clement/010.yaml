revisions:
- from: '所以，弟兄们，我们要遵行那位召我们的父的旨意，好使我们得以存活；我们更要追求美德，离弃恶行，因为恶行是我们犯罪的先导；我们也要逃避不敬虔，免得灾祸追上我们。


    因为我们若殷勤行善，平安就会追随我们。


    正因如此，人无法得到福乐：他们把对人的惧怕招来[a]，宁可选择现今的享受，也不选择将来的应许。


    他们不知道，现今的享受会带来多大的痛苦，将来的应许又会带来何等的喜乐。


    如果他们真的只是自己做这些事，倒还可以容忍；但如今，他们不断教导无辜的心灵行恶，却不知道自己将受到加倍的定罪——他们自己和听从他们的人都要受罚。[b]'
