base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/010.yaml
  text: 'Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us rather pursue virtue, but forsake vice as the forerunner of our sins, and let us flee from ungodliness, lest evils overtake us.


    For if we are diligent in doing good, peace will pursue us.


    For this cause a person is unable to attain happiness, seeing that they call in the fears of men, preferring the enjoyment that is here to the promise that is to come.


    For they do not know how great a torment the enjoyment that is here brings, and what delight the promise that is to come brings.


    And if indeed they were doing these things by themselves alone, it would have been tolerable; but now they continue teaching evil to innocent souls, not knowing that they shall have their condemnation doubled, both themselves and their hearers.'
translation:
  language: zh_hans
  text: '所以，弟兄们，我们要遵行召唤我们的父的旨意，好使我们得以存活；我们更要追求美德，离弃那作为我们罪恶先导的邪恶；我们也要逃避不敬虔，免得灾祸追上我们。


    因为我们若殷勤行善，平安就会追随我们。


    正因如此，人无法获得幸福，因为他们受人间的恐惧所驱使，宁可爱现今的享受，过于将来的应许。


    他们不知道，现今的享受带来多大的痛苦，将来的应许又带来何等的喜乐。


    如果他们确实只是在自己身上做这些事，倒还可以容忍；但如今，他们还不断教导纯真的心灵作恶，却不知道他们自己和听他们的人都将领受双重的定罪。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: virtue
  choice: 美德
  rationale: 依现有英译见证保留与“恶行”相对的伦理范畴；在希腊文复核前不将其窄化为某一种具体善行。
- source_word: vice
  choice: 恶行
  rationale: 采用现代汉语中自然且明确的表达，并保留其作为犯罪先导的因果关系。
- source_word: ungodliness
  choice: 不敬虔
  rationale: 保留其宗教与伦理双重含义，不仅译作一般性的“邪恶”。
- source_word: peace
  choice: 平安
  rationale: 保留可能兼指安宁、福祉与神所赐和平的语义宽度。
- source_word: promise
  choice: 应许
  rationale: 使用圣经语域中通行而庄重的词，保留其所指内容未明说的开放性。
- source_word: innocent souls
  choice: 无辜的心灵
  rationale: 保留“灵魂/生命主体”的宗教语感，同时使现代读者易懂。
- source_word: condemnation doubled
  choice: 受到加倍的定罪
  rationale: 忠实保留审判性语言及“加倍”的强调，不解释为具体刑罚等级。
theological_decisions:
- issue: “得以存活”所指为何
  choice: 保留“存活”
  alternative: 得永生
  rationale: 现有见证仅作“live”；不在希腊文复核前将其明确限定为永生，以保留今生与末世生命之间的张力。
- issue: 行善与平安的关系
  choice: 译作“平安就会追随我们”
  alternative: 我们就会获得平安
  rationale: 保留原句中拟人化的“追随/追赶”意象，也与前文灾祸“追上”形成对照。
- issue: 现今享受与将来应许的对比
  choice: 保持两者直接对照
  alternative: 将“将来的应许”明确解释为天国或永生
  rationale: 原文见证没有明说应许的具体内容，不引入额外教义限定。
- issue: 加倍定罪的对象
  choice: 明确为教导者自身及听从者都受罚
  alternative: 仅指教导者因自己犯罪并误导别人而受双重刑罚
  rationale: 现有英译“both themselves and their hearers”在句法上可能涉及判罚对象；正文作自然呈现，并以脚注提示句法与责任分配仍待希腊文复核。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。保留“父、旨意、不敬虔、应许、定罪”等早期基督教文本的核心语汇，同时避免过度古雅。由于用户提供的是公版英译见证，且注明希腊文审查尚待进行，本稿属于谨慎的来源见证译稿；对第三段难解短语及末句责任分配以脚注标明不确定性。
