translation:
  language: zh_hans
  text: '所以，弟兄们，我们要离开在这世上的寄居生活，遵行那位召我们者的旨意；也不要害怕离开这世界。


    因为主说：“你们要像羊羔在群狼中间。”[a]


    彼得却回答他说：“那么，如果狼撕碎羊羔，怎么办呢？”


    耶稣对彼得说：“羊羔死后，不要怕狼；你们也不要怕那些杀害你们、不能再对你们做什么的人；却要敬畏那位在你们死后有权柄把灵魂和身体都投入火焰的欣嫩子谷[b]的。”


    弟兄们，你们知道，这肉身在世上的寄居生活卑微而短暂；但基督的应许却伟大而奇妙，就是那将要来临之国度的安息和永恒的生命。[c]


    那么，我们要怎样才能得到这些呢？除了行事圣洁公义，把这世上的事物看作不属于我们的，不贪恋它们以外，还能做什么呢？


    因为我们若贪求得到这些事物，就会偏离公义的道路。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话与《路加福音》10:3“如同羊羔进入狼群”相近，但本处措辞并不完全相同。
    reason: 标明早期基督教引语与正典福音书平行文本的关系，同时不武断认定其直接来源。
  - marker: b
    text: “欣嫩子谷”音译自希腊语 Gehenna，源于耶路撒冷城外的欣嫩谷；在犹太及早期基督教用语中，它成为终末惩罚之地的称呼。
    reason: 保留地名，并向现代读者说明其审判语义。
  - marker: c
    text: “国度的安息和永恒的生命”也可理解为：“将来国度与永生的安息。”原句各成分之间的关系存在一定歧义。
    reason: 保存“安息”“国度”“永生”之间句法关系的不确定性。
lexical_decisions:
- source_word: παροικία / sojourn（据英译所反映的希腊传统）
  choice: 寄居生活
  rationale: 保留暂居、非本乡的意象，同时用现代汉语清楚表达其生活状态。
- source_word: ἀρνία / lambs（据引文传统）
  choice: 羊羔
  rationale: 比“羊”更准确保留幼小、脆弱的形象。
- source_word: γέεννα / Gehenna
  choice: 欣嫩子谷
  rationale: 这是地名的汉语音义传统表达，避免直接以带解释性的“地狱”取代原词；脚注说明其审判含义。
- source_word: ἀνάπαυσις / rest（据英译所反映的希腊传统）
  choice: 安息
  rationale: 兼顾停止劳苦、得享终末福分的含义，并保持早期基督教语境的庄重感。
- source_word: ὁδὸς δικαία / righteous path（据英译所反映的文本）
  choice: 正义的道路
  rationale: 保留道路隐喻，并使“公义/正确”在现代汉语中自然可懂。
theological_decisions:
- issue: “离开这世界”的含义
  choice: 直译为“离开这世界”
  alternative: 解释为“死亡”或“弃绝世俗生活”
  rationale: 上下文同时涉及死亡与不依恋世界；正文保留原有张力，不把它限定为单一含义。
- issue: 死后对灵魂和身体施行审判的主语
  choice: 译作“那位”，不明确补成“上帝”
  alternative: 译作“上帝”
  rationale: 原引文以代词指称审判者；不在正文中补入原文未明说的名称。
- issue: “把灵魂和身体都投入”与复数代词关系
  choice: 按汉语表达译为“把灵魂和身体都投入”
  alternative: 译为“把它们投入”
  rationale: 中文直接复指“灵魂和身体”更清楚，也保留二者同受审判的陈述。
- issue: “基督的应许”所包含的福分
  choice: 译为“那将要来临之国度的安息和永恒的生命”
  alternative: 将“国度的安息”与“永生”合并解释为同一件事
  rationale: 并列关系可能具有释义或两个相关福分的张力，译文不强行化约。
- issue: 世界事物“与我们相异/陌生”
  choice: 译作“不属于我们的”
  alternative: 译作“与我们无关”或“是外来的”
  rationale: 强调信徒不把现世事物当作真正产业，同时避免暗示可以完全不承担现实责任。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。因所供材料明确说明尚待希腊语复核，本稿谨慎依据公共领域英译见证及可识别的引文传统起草，不声称已经完成直接原文校勘；对可能存在的句法歧义以脚注保留。
