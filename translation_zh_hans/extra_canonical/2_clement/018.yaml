base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/018.yaml
  text: 'Therefore, let us also be found among those who give thanks, among those who have served God, and not among the ungodly who are judged.


    For I myself am also an utter sinner. I have not yet escaped temptation but am still surrounded by the devices of the devil. Yet I strive to pursue righteousness, so that I may at least succeed in coming near to it, because I fear the judgment to come.'
translation:
  language: zh_hans
  text: '所以，我们也要被列在感恩的人中，列在服事过上帝的人中，而不要列在受审判的不敬虔之人中。


    因为连我自己也是个罪孽深重的人，尚未摆脱试探，仍处在魔鬼的重重机关之中。然而，我竭力追求公义，盼望自己至少能够接近它，因为我惧怕那将要来到的审判。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英文见证译出；希腊文原文尚待直接核校。英文见证中的“魔鬼的机关”可能兼有陷阱、器械或计谋的意象。
    reason: 用户提供的资料明确说明希腊文审校尚未完成；对关键隐喻的译法应向读者保持透明。
lexical_decisions:
- source_word: give thanks
  choice: 感恩
  rationale: 自然、庄重地表达向上帝献上感谢之意，同时保留原见证简洁的表述。
- source_word: served God
  choice: 服事过上帝
  rationale: “服事”符合早期基督教语境；“过”保留英文见证中完成时态的意味，不将其限定为礼仪或某种特定职分。
- source_word: ungodly
  choice: 不敬虔之人
  rationale: 比“恶人”更贴近其宗教伦理含义，也避免把范围缩窄为一般道德上的邪恶。
- source_word: utter sinner
  choice: 罪孽深重的人
  rationale: 传达强烈的自我定罪语气，同时比生硬的“彻底的罪人”更符合现代汉语。
- source_word: engines of the devil
  choice: 魔鬼的重重机关
  rationale: 保留设陷阱、施攻击的强烈意象；“机关”能兼容器械与诡计两层意味，未径直弱化为抽象的“手段”。
- source_word: follow after righteousness
  choice: 追求公义
  rationale: 采用现代汉语中自然的表达，保留持续努力趋向公义的动态。
- source_word: judgment to come
  choice: 将要来到的审判
  rationale: 保留末世性的未来指向，不额外说明审判的方式或对象。
theological_decisions:
- issue: 感恩、服事与受审判之间的关系
  choice: 并列呈现作者的劝勉，不说明这些行为是否构成得救的功劳或证据
  alternative: 将其解释为因行为得救，或明确解释为得救后的果效
  rationale: 现有见证只作群体归属与审判的对比，并未系统说明因果关系，应保留其劝诫张力。
- issue: 作者追求公义并盼望接近公义
  choice: 保留“至少能够接近它”的谦卑而紧张的措辞
  alternative: 改写为已经因信称义，或解释为道德完全
  rationale: 不以任何后设教义消解作者对自身罪、试探、追求公义及未来审判的并置。
- issue: 惧怕未来审判
  choice: 直译为“惧怕那将要来到的审判”
  alternative: 弱化为敬畏、谨慎，或强化为确定被定罪
  rationale: 原见证表达真实的惧怕，却未断言最终结局，故不应淡化或加重。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。首段保留“列在……中”的重复，以呈现原见证的排比和群体对照；次段使用“因为连我自己……”保持作者从共同劝勉转入自我陈述的语势。“上帝”依现代通行译名处理，不引入宗派性称谓。
