review_pass:
  verdict: revise
  source_fidelity: 草稿总体紧随所供英文见证，且正确保留末句的残缺。不过，“借着我们的义行赢得外人的认可”将“取悦外人”的直接表达改成“赢得认可”，并把“义”限定为“义行”，属于不必要的释义；“骗局”也比“delusion”更明确地指蓄意欺诈。末段中文的“反而讥笑我们”会造成主语转折关系不清，应明确讥笑者仍是听见教导的列国之人。
  naturalness: 整体庄重、通顺。将“在善事上保持清醒”调整为“在善上保持清醒”，更贴近伦理语境且避免把“善”过窄理解为若干善事。末段以“当……时，他们就……”重组后，可自然保留原见证的不完整宾语而不擅自校补。
  terminology: “弟兄姊妹”“悔改”“亵渎”“上帝的圣言”“那名”等选择均可接受。“空洞的故事和迷惑”比“空谈和骗局”更能保留英文见证中“idle story and a delusion”的两层否定，且不强化为诈欺指控。
  issues:
  - severity: medium
    issue: “赢得外人的认可”替代了“取悦外人”。
    rationale: 英文见证的结构是“不只彼此取悦，也借着义取悦群体外的人”。“认可”改变了所求的对象和行动的语气，“义行”也对较宽的“义”作了限定。
  - severity: medium
    issue: “骗局”强化了“delusion”的含义。
    rationale: “骗局”通常暗示有人故意设局欺骗；见证仅称所传之事为“空洞故事和迷惑/妄言”。应避免加入未明说的主观欺诈意图。
  - severity: medium
    issue: 残缺句后的叙述主语和句法关系不够清楚。
    rationale: 原意是列国之人看见信徒“不但不爱……”这一残缺事实后，便讥笑信徒；草稿的“反而”容易使“我们”成为讥笑者或使逻辑关系含混。
  revised_text: '所以，弟兄姊妹，我们要立刻悔改。我们要在善上保持清醒，因为我们充满了许多愚昧和邪恶。我们要除去从前的罪，不要让人发现我们是讨人喜欢的人。我们不要只求彼此喜欢，也要借着我们的义取悦外人，免得那名因我们而受亵渎。


    因为主说：“我的名在列国中处处受到亵渎。”又说：“那使我的名受到亵渎的人有祸了！”这名为什么受到亵渎呢？因为你们不做我所愿的事。


    列国的人从我们口中听见上帝的圣言，就因其美好和伟大而惊叹；可是，当他们发现我们的行为配不上我们所讲的话，就立刻转而亵渎，说这是空洞的故事和迷惑。


    他们从我们这里听见上帝说：“如果你们爱那些爱你们的人，这算不得可嘉；如果你们爱仇敌和恨你们的人，这才是可嘉。”我说，他们听见这些话，就因其非凡的美善而惊叹；可是，当他们看见我们不但不爱……[a]时，就讥笑我们，那名也就受到亵渎。'
  revised_footnotes:
  - marker: a
    text: 现有英文见证此处作“我们不但不爱我们……”，句式明显残缺。因尚未直接复核希腊文，本译本不据上下文擅自补足宾语。
    reason: 如实标明底本见证的文本困难，保存歧义并避免无依据的校补。
  revision_rationale: 修订撤回了对“义”的具体化和对“取悦”的语义替换，弱化“骗局”所附加的蓄意欺诈含义，并重组末句使“讥笑我们”的主语明确为前文的列国之人。残缺处继续以省略号和脚注保留，不按常见的上下文推测补写。
