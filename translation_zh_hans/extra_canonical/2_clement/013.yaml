review_pass:
  verdict: revise
  source_fidelity: 整体准确反映所给英文见证及英文POB的劝勉、引语和末段文本残缺。惟“赢得外人的认可”将“取悦”具体化为“获得认可”，且“骗局”较“delusion”多出蓄意欺骗之义；末段正文也未显出英文见证中残存的“us／我们”这一异常宾语，宜作保守调整。
  naturalness: 文体总体庄重通顺。将“在善事上保持清醒”调整为“在善事上警醒”，并将“只求彼此喜欢”调整为“只求彼此欢心”，更符合现代汉语及劝勉语境。
  terminology: “弟兄姊妹”“悔改”“亵渎”“义行”“上帝的圣言”等用语恰当。“这名”一致保留“Name”的敬称式、未明说所指的表达。
  issues:
  - severity: medium
    issue: “借着我们的义行赢得外人的认可”
    rationale: 英文见证为“please ... those ... without, by our righteousness”。“赢得认可”可理解为获得评价或接纳，较原文的“取悦／使人喜悦”增加结果和社会认可的色彩。
  - severity: medium
    issue: “空谈和骗局”
    rationale: “delusion”主要指妄想、迷惑或错谬，不必然指蓄意诈骗；“骗局”会强化说话者有意欺骗的含义。
  - severity: medium
    issue: 末段残缺处删去了“我们”
    rationale: 供应的英文见证和英文POB均保留异常的“we ... do not love us”。草稿仅作“不但不爱……”，虽有脚注，却未在正文中保留该异常宾语；译作“我们不但不爱我们自己……”可更完整地对应见证，同时以脚注说明其文本困难。
  - severity: low
    issue: “在善事上保持清醒”
    rationale: 可理解，但“be sober unto that which is good”在劝勉文体中以“在善事上警醒”更凝练自然，并保留警醒、自制的广义含义。
  revised_text: '所以，弟兄姊妹，我们要立刻悔改。我们要在善事上警醒，因为我们充满了许多愚昧和邪恶。我们要除去从前的罪，不要显为讨人喜欢的人。我们不要只求彼此欢心，也要借着我们的义行使外面的人喜悦，免得这名因我们而受亵渎。


    因为主说：“我的名在列国中处处受到亵渎。”又说：“那使我的名受到亵渎的人有祸了！”这名为什么受到亵渎呢？因为你们不做我所愿的事。


    列国的人从我们口中听见上帝的圣言，就因其美好和伟大而惊叹；可是，当他们发现我们的行为配不上我们所讲的话，就立刻转而亵渎，说这不过是空洞的故事和迷惑。


    他们从我们这里听见上帝说：“如果你们爱那些爱你们的人，这算不得可嘉；如果你们爱仇敌和恨你们的人，这才是可嘉。”我说，他们听见这些话，就因其非凡的美善而惊叹；可是，当他们看见我们不但不爱我们自己……[a]，就讥笑我们，这名也就受到亵渎。'
