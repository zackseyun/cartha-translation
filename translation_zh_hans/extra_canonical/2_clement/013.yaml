base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
translation:
  language: zh_hans
  text: '所以，弟兄姊妹，我们要立刻悔改。我们要在善事上保持清醒，因为我们充满了许多愚昧和邪恶。我们要除去从前的罪，不要让人看出我们只求讨人的喜欢。我们不要只求彼此喜欢，也要借着我们的义行赢得外人的认可，免得那名因我们而受亵渎。


    因为主说：“我的名在列国中处处受到亵渎。”又说：“那使我的名受到亵渎的人有祸了！”这名为什么受到亵渎呢？因为你们不做我所愿的事。


    列国的人从我们口中听见上帝的圣言，就因其美好和伟大而惊叹；可是，当他们发现我们的行为配不上我们所讲的话，就立刻转而亵渎，说这一切不过是空谈和骗局。


    他们从我们这里听见上帝说：“如果你们只爱那些爱你们的人，这算不得可嘉；如果你们爱仇敌和恨你们的人，这才是可嘉。”我说，他们听见这些话，就因其中非凡的美善而惊叹；可是，当他们看见我们不但不爱……[a]，反而讥笑我们，那名也就受到亵渎。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有英文见证此处作“我们不但不爱我们……”，句式明显残缺。因尚未直接复核希腊文，本译本不据上下文擅自补足宾语。
    reason: 如实标明底本见证的文本困难，保存歧义并避免无依据的校补。
lexical_decisions:
- source_word: brethren (Greek source review pending)
  choice: 弟兄姊妹
  rationale: 以现代汉语自然表达对整个信徒群体的称呼；供应材料尚未完成希腊文复核，故不对底词的语法性别作过度断言。
- source_word: be sober
  choice: 保持清醒
  rationale: 保留警醒、自制的伦理含义，并避免仅理解为不醉酒。
- source_word: men pleasers
  choice: 只求讨人的喜欢
  rationale: 表达以迎合人为行为动机的贬义，而非一般礼貌或善意。
- source_word: those men that are without
  choice: 外人
  rationale: 在早期基督徒语境中指群体之外的人；用简洁自然的现代汉语表达。
- source_word: the Name
  choice: 那名
  rationale: 保留原文以“名”敬称上帝之名的委婉表达，不擅自展开为具体称谓。
- source_word: oracles of God
  choice: 上帝的圣言
  rationale: 表达来自上帝、具有权威的话语；“圣言”比“神谕”更符合本文的教导语境。
- source_word: no thank / thank
  choice: 算不得可嘉／才是可嘉
  rationale: 此处指值得称许或蒙认可，而非现代汉语中的“感谢”。
- source_word: idle story and a delusion
  choice: 空谈和骗局
  rationale: 传达外人认为所宣讲内容空洞虚假、具有欺骗性的强烈否定。
theological_decisions:
- issue: “借着我们的义”与取悦外人的关系
  choice: 译为“借着我们的义行赢得外人的认可”
  alternative: “也要借着我们的义讨外人的喜欢”
  rationale: 将“义”落实为可见行为，以承接下文行为与言语的对比；“认可”避免暗示迎合世俗标准。
- issue: “那名”的所指
  choice: 保留“那名”
  alternative: 展开为“上帝的名”或“主的名”
  rationale: 原见证文本刻意使用敬称式的“Name”，保留其修辞和神学张力。
- issue: 末句残缺文本
  choice: 不作猜补，以省略号并加脚注标明
  alternative: 按上下文补成“我们不但不爱仇敌，甚至也不爱那些爱我们的人”
  rationale: 现有见证为不完整结构，且希腊文直接复核尚待完成；不应把合理推测写入正文冒充确定文本。
- issue: “列国／外邦人”
  choice: 主要译作“列国的人”
  alternative: “外邦人”
  rationale: 避免“外邦人”在现代读者中可能带有的宗派化或贬抑色彩，同时保留群体外诸民族的含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引语保留经训式力度，但避免古奥措辞。供应材料声明希腊文复核尚待完成，因此本稿以公开领域英文见证及英文POB为审校层，凡涉及残缺处均明确标注，不伪称已经完成原文定本。
