    我们不应当怕人，而应当怕上帝。


    因此，主说：“如果你们做这些事[a]，即使你们同我聚集在我的怀中[b]，却不遵行我的命令，我也要把你们赶出去，对你们说：‘离开我吧！我不知道你们是从哪里来的。你们这些作恶的人！’”'
