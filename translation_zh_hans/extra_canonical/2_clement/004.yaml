review_pass:
  verdict: revise
  source_fidelity: 需要修订。草稿总体忠实呈现了本章以行为承认主、不可惧怕人而当惧怕上帝的劝勉，伦理清单及末段警告也基本准确。惟末段引语前的条件语“if you do these things”（对应希腊传统所见的概括指代）被完全省略；即使该处与紧随的警告在指代和论证衔接上有张力，也不宜以译者重组句法的方式删除。另“他曾说”将现时引介语弱化为过去时，宜改为“他说”。
  naturalness: 整体庄重、流畅，适合现代中文朗读。“不通奸”在当代汉语中较偏法律或特定婚姻情境；“不犯奸淫”更自然，也较完整对应该伦理禁令。“却要节制、怜悯、仁慈”可改为动词性并列结构，使中文更顺畅。
  terminology: “主”“行义”“承认他”“节制”“彼此体恤”“上帝”均适切，且没有强加特定教派的神学解释。“在我的怀中”应保留原有亲近／庇护意象；“作恶的人”是对“workers of iniquity”的自然现代汉语表达。
  issues:
  - severity: high
    issue: 末段引语前的条件语被省略
    rationale: 原见证在“主说”前保留“if you do these things”。草稿以“正因如此”替代，改变并删去了原文的条件性表达。该处即便句法或指代不够明确，也应在译文中保留，并可用注释说明其开放性。
  - severity: low
    issue: “他曾说”改动了引介语时态
    rationale: 见证使用“he says”，早期基督教文本引述权威话语时常用现时。译为“他说”更贴近原文且自然。
  - severity: low
    issue: “不通奸”用语偏窄且稍显生硬
    rationale: “不犯奸淫”是现代中文中更自然、也更能覆盖该伦理禁令的表达。
  revised_text: '所以，我们不要只称他为“主”，因为这样并不能救我们。



    他说：“不是每一个对我说‘主啊’的人都会得救，惟有行义的人才会得救。”



    因此，弟兄们，我们要用行为承认他：彼此相爱，不犯奸淫，不彼此毁谤，不嫉妒，却要有节制，存怜悯，待人仁慈。我们应当彼此体恤，不可贪婪。我们要以这些行为承认他，不可行与此相反的事。



    我们不应当怕人，而应当怕上帝。



    因此，若你们做这些事[b]，正如主所说：“即使你们同我聚集在我的怀中[a]，却不遵行我的命令，我也要把你们赶出去，对你们说：‘离开我吧！我不知道你们是从哪里来的。你们这些作恶的人！’”'
  revised_footnotes:
  - marker: a
    text: “在我的怀中”直译保留亲近和庇护的意象；这句话的具体指涉并不明确。
    reason: 该意象在现代中文中较不寻常，且可能引发多种群体性或末世性解释，故提示读者保留其开放性。
