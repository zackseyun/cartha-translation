base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/004.yaml
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
translation:
  language: zh_hans
  text: '所以，我们不要只称他为“主”，因为这样并不能救我们。


    他曾说：“不是每一个对我说‘主啊’的人都会得救，惟有行义的人才会得救。”


    因此，弟兄们，我们要用行为承认他：彼此相爱，不通奸，不彼此毁谤，不嫉妒，却要节制、怜悯、仁慈。我们应当彼此体恤，不可贪婪。我们要以这些行为承认他，不可行与此相反的事。


    我们不应当怕人，而应当怕上帝。


    正因如此，主说：“即使你们同我聚集在我的怀中[a]，却不遵行我的命令，我也要把你们赶出去，对你们说：‘离开我吧！我不知道你们是从哪里来的。你们这些作恶的人！’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我的怀中”直译保留亲近和庇护的意象；这句话的具体指涉并不明确。
    reason: 该意象在现代中文中较不寻常，且可能引发多种群体性或末世性解释，故提示读者保留其开放性。
lexical_decisions:
- source_word: Lord
  choice: 主
  rationale: 沿用早期基督教文献中对基督的常见尊称，并保留本段“口头称主”与“实际遵命”之间的对照。
- source_word: doeth righteousness
  choice: 行义
  rationale: 简洁保留“实行正义/义”的主动含义，不扩写成特定教派的称义理论。
- source_word: confess Him
  choice: 承认他
  rationale: 此处重点是以行为公开承认并表明归属；“承认”比单纯“宣认”更易为现代读者理解，同时不削弱行为见证的意味。
- source_word: temperate
  choice: 节制
  rationale: 表达克制欲望和约束自己的伦理含义，是现代中文宗教与一般伦理语境均可理解的用词。
- source_word: fellow-feeling
  choice: 彼此体恤
  rationale: 自然表达共同感受、同情关怀之意，避免生硬直译。
- source_word: covetous
  choice: 贪婪
  rationale: 涵盖对财物与利益的过度欲求，不把词义过窄地限定为某一种财产行为。
- source_word: in My bosom
  choice: 在我的怀中
  rationale: 保留原见证所呈现的亲密、庇护性身体意象，不擅自解释为某一制度性群体。
- source_word: workers of iniquity
  choice: 作恶的人
  rationale: 用自然现代汉语表达持续行不义之事的人；不将其技术化为特定神学术语。
theological_decisions:
- issue: 称主与得救、行义之间的关系
  choice: 按原文保留“只称主不能救”与“行义的人得救”的直接张力
  alternative: 增添“真正的信心必然产生行为”等解释性措辞
  rationale: 本段本身强调言语与行为的对照；译文不导入后世有关信心、行为和称义关系的教派性框架。
- issue: 以行为“承认”基督
  choice: 保留行为具有承认或否认基督的见证作用
  alternative: 解释为行为赚取救恩，或仅仅证明既有救恩
  rationale: 原段没有明确解决这两种后设解释，因此译文不替作者作神学判定。
- issue: “同我聚集在我的怀中”却被赶出
  choice: 保留亲近主与不遵命仍受拒绝之间的警告
  alternative: 将“怀中”改释为教会成员身份、圣餐团契或末世聚集
  rationale: 这些具体指涉并非所给材料能够确定，宜保留原有意象与警告力度。
- issue: 末段引语的引介
  choice: 译作“正因如此，主说”
  alternative: 直译为“因此，如果你们做这些事，主说”
  rationale: 所给英语见证的句法在此不顺，且会与随后“不遵行我的命令”形成表面矛盾；采用不额外断定条件关系的引介，保留论证衔接。
- issue: “不知道你们从哪里来”
  choice: 按所给见证保留来源不明的措辞
  alternative: 套用较熟悉的福音书平行句，简化为“我不认识你们”
  rationale: 本段引语形式可能反映独特传统；不应以正典平行经文替换其实际措辞。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；称呼“弟兄们”保留古代会众劝勉的语气。引语使用现代标点，伦理清单保持平行节奏。当前材料明确说明希腊文直接复核尚待完成，因此本稿主要依据所给公共领域英语见证，并审慎参考其中标示的希腊传统信息；末段句法尤其应在希腊文校勘后再次核验。
