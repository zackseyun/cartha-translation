base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/020.yaml
  text: 'Do not let this trouble your minds either: that we see the unrighteous possessing wealth while the servants of God suffer hardship.


    Therefore, let us have faith, brothers and sisters. We are being trained by this present life so that we may be crowned in the life to come.


    No righteous person has quickly reaped the fruit but waits for it.


    For if God had quickly given the righteous their reward, we would immediately have been training ourselves in commerce rather than godliness. We would appear to be righteous, though we were pursuing not what is godly but what is profitable. For this reason, divine judgment overtakes a spirit that is not just and weighs it down with chains.


    To the only invisible God, the Father of truth, who sent to us the Savior and Prince of immortality, through whom he also revealed to us the truth and the heavenly life—to him be the glory forever and ever. Amen.'
translation:
  language: zh_hans
  text: '也不要再让这事困扰你们的心：我们看见不义的人拥有财富，神的仆人却身处困苦。


    所以，弟兄姊妹们，我们要有信心。今生正在操练我们，为要使我们在来世得着冠冕。


    义人没有谁很快就收获果实，而是耐心等候。


    因为，如果神很快就把报偿赐给义人，我们便会立刻操练自己去做买卖，而不是操练敬虔；我们虽然显得为义，所追求的却不是敬虔之事，而是有利可图之事。正因如此，神的审判追上不正直的灵，使它负上锁链。


    愿荣耀归于独一、看不见的神，就是真理之父。他差遣救主和不朽生命的元首到我们这里来，又借着他向我们显明真理和天上的生命。愿荣耀归于他，直到永永远远。阿们。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: straitened
  choice: 身处困苦
  rationale: 表达与不义者拥有财富相对的窘迫和患难，同时避免将含义缩窄为单纯贫穷。
- source_word: trained / training ourselves
  choice: 操练／操练自己
  rationale: 保留原文见证中训练、受锻炼的意象，并使今生的塑造与人为逐利的操练形成呼应。
- source_word: crowned
  choice: 得着冠冕
  rationale: 保留早期基督教文本中竞赛获冠与终末奖赏的形象，不改写为笼统的“得奖赏”。
- source_word: commerce
  choice: 做买卖
  rationale: 在现代汉语中自然表达逐利交易，同时与下文“有利可图”相连。
- source_word: Prince of immortality
  choice: 不朽生命的元首
  rationale: “元首”兼具首领、开创者的可能含义；加入“生命”使汉语自然，但不把称号限定为某一教义解释。
theological_decisions:
- issue: 今生的操练与来世的冠冕
  choice: 今生正在操练我们，为要使我们在来世得着冠冕
  alternative: 我们借今生操练自己，好在将来得奖赏
  rationale: 保留人处于被操练状态的措辞及“冠冕”意象，避免把受动意味和终末图景弱化。
- issue: 神审判不正直之灵的关系
  choice: 正因如此，神的审判追上不正直的灵，使它负上锁链
  alternative: 因此，不义的心灵受到神审判，被锁链捆绑
  rationale: 尽量保存“审判追上”这一拟人化表达及因果张力，不额外说明锁链是现世、死后或比喻性的。
- issue: 救主称号及其与不朽的关系
  choice: 救主和不朽生命的元首
  alternative: 救主和赐人永生的君王
  rationale: 后者会明确加入“赐人”和君王身份；所选译法保留称号本身较宽的语义空间。
- issue: 神借着救主显明真理和天上生命
  choice: 又借着他向我们显明真理和天上的生命
  alternative: 借着他使我们得到真理和永生
  rationale: 保留“显明”的启示性动作，以及“天上的生命”与“不朽”之间未被完全等同的表述。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留劝勉、竞赛冠冕、商业逐利、审判锁链等原有意象。由于所提供的直接依据是公版英文见证，且希腊文复核尚未完成，本稿属于源语言复核前的审慎草案；未添加脚注，因正文没有需要对应的脚注标记。
