review_pass:
  verdict: revise
  source_fidelity: 整体忠实地保留了不义者富足、神仆困苦、现世训练、将来冠冕、不可速得的果实、逐利与敬虔的对比，以及末尾颂赞的结构。惟“Prince of immortality”（亦与希腊传统中“ἀρχηγὸς τῆς ἀφθαρσίας”的较宽表述相符）译作“**不朽生命**的元首”添加了原文未明说的“生命”，并将“不朽／不坏”限定为“生命”。应删除该增添词，保留称号的歧义空间。
  naturalness: 文体庄重、通顺，适合现代标准汉语。“也不要再让这事困扰你们的心”可更自然地调整为“也不要再因这事心里不安”，不改变劝勉语气。“没有谁很快就收获果实”调整为“没有义人能很快收成果子；他总要等候”，使概括性的义人与其等候行为的关系更清楚。
  terminology: “神”“义人”“敬虔”“冠冕”“救主”“真理之父”均恰当。“不朽的元首”保留“Prince/ἀρχηγός”可指领袖、先导或开创者的开放性，避免加入“生命”或预设特定系统神学解释。
  issues:
  - severity: medium
    issue: “不朽生命的元首”在称号中增添“生命”。
    rationale: 所给英文见证为“Prince of immortality”，而相关希腊表达通常是“不朽／不坏的元首（或先导）”，并未出现“生命”一词。加入“生命”会缩窄并改变该称号的语义。
  - severity: low
    issue: 首句和“收获果实”句可稍作汉语顺畅化。
    rationale: 这不是实质性误译，但修订后更符合现代汉语劝勉文体，同时保留原有的重复劝勉、果实和等候意象。
