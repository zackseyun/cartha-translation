    reason: 标明耶稣语录在福音书传统中的对应经文，同时不武断限定作者所采用的具体文本形式。
  revision_rationale: 修订恢复引文中“荒凉妇人”与“有丈夫妇人”的对应，并在作者释义中保留“荒凉、被上帝遗弃”的两个描述。祷告句按“以单纯的心……献上祈求”处理，以体现ἐν ἁπλότητι。对于“正在灭亡的／正在倒下的”采用不明说“人”的汉语结构，尽量保留中性集合表达及其比喻弹性；末句也调整语序，使“来、呼召我们”与“拯救了许多人”均得到呈现而不强加二者的范围关系。
