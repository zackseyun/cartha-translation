  verdict: revise
  source_fidelity: 底稿整体准确传达了本章的引文、寓意式解释及“拯救濒临灭亡者”的论证。惟引自赛54:1的阴性形象在数处被泛化为“之人”，使“妇人—儿女—教会”的比喻链条减弱；“扶起正在倒下的”也略将“使之坚立”的动作改成了倒下后的扶起。修订保留原文对群体身份的概括及末句“许多人／我们”的句法张力。
  naturalness: 原译整体庄重、通顺。修订将“有丈夫之人”“被遗弃之人”改为“有丈夫的妇人”“孤苦妇人”，并把祷告句调整为更符合现代汉语的因果关系；“我们的民”改为“我们的民众”。
  terminology: 保留“上帝”“教会”“义人”“罪人”“基督”等既有且合乎早期基督教文献语境的译语。“ἐν ἁπλότητι”译为“单纯地”较“诚心”更直接保留“单纯、纯朴”的语义，且不额外强化内在真诚的解释。
  issues:
  - severity: medium
    issue: 赛54:1引文中的女性意象被泛化
    rationale: “被遗弃之人的儿女”“有丈夫之人的儿女”未保留原句阴性单数的妇人形象，也与随后将教会比作母亲的解释衔接较弱。应译作“孤苦妇人的儿女”“有丈夫的妇人的儿女”等。
  - severity: low
    issue: “扶起”轻微改变“建立／使坚立”的形象
    rationale: 原文及英译见证的对照是“建立正在站立的”与“建立正在倒下的”，重点在使之坚立；“扶起”较容易暗示已经倒下。
  - severity: low
    issue: “诚心”略缩窄“ἐν ἁπλότητι”的含义
    rationale: 该词可含单纯、纯朴、坦率之意；“单纯地”在此更贴近字面且不增加解释。
  revised_text: '“不能生育、从未生产的女子啊，要欢喜！未曾经历产痛的女子啊，要放声呼喊！因为孤苦妇人的儿女，比有丈夫的妇人的儿女更多。”[a] 他说：“不能生育、从未生产的女子啊，要欢喜”，指的就是我们；因为在儿女赐给我们的教会以前，她原是不能生育的。


    他说：“未曾经历产痛的女子啊，要放声呼喊”，意思是：我们不要像临产的妇人一样，因单纯地向上帝献上祈求而疲惫。


