review_pass:
  verdict: revise
  source_fidelity: 底稿总体忠实呈现本章以赛亚引文及其释义，也保留了“似乎有上帝的人”所指未明的概括性。但“荒凉的妇人”被译为“被遗弃之人”，弱化并混淆了原有女性、婚姻和生育的连续比喻；“ἐν ἁπλότητι”宜直接译为“以单纯的心／单纯地”，不宜仅译“诚心”。末段及前段的中性复数“正在灭亡的／倒下的事物（对象）”不应一律明确收窄为“人”。
  naturalness: 原稿文体庄重流畅，但“被遗弃之人的儿女”“向上帝诚心献上祈求”“扶稳那已经站立的”略显生硬或语义不够准确。修订以“荒凉妇人”“以单纯的心向上帝献上祈求”“坚立……扶持……”保留形象并使现代书面汉语更自然。
  terminology: “教会”“上帝”“义人”“罪人”“基督”均可保留。“不能生育”可用于στεῖρα；在本段引文中配合“未曾生产的妇人”，能保留原文的女性意象。将“desolate”统一处理为“荒凉的妇人／荒凉、被上帝遗弃”，避免将其变为泛指的“人”。
  issues:
  - severity: medium
    issue: 引文中的“desolate”译作“被遗弃之人”
    rationale: 原文此处与“有丈夫的妇人”相对，并以儿女、生育构成完整比喻；应明确为“荒凉的妇人”（或“被遗弃的妇人”），不可改成无性别的“人”。
  - severity: medium
    issue: “ἐν ἁπλότητι”译作“诚心”
    rationale: “诚心”虽可通，却主要突出真诚；该词也含单纯、质朴、无二心之意。译为“以单纯的心”更贴近原词且不作过度解释。
  - severity: low
    issue: 将中性集合表达全面具体化为“人”
    rationale: “正在灭亡的”和“正在倒下的”在作者的比喻性表达中可指人，但原文采用中性复数。中文可用省略中心名词的“那些正在……的”，从而保留原文较宽的措辞。
  - severity: low
    issue: “仿佛被上帝遗弃”及“荒凉凄清”加入弱化或扩充色彩
    rationale: 原文是“似乎荒凉且被上帝遗弃”；“仿佛”会使“被遗弃”的断言也成为仅是比拟，“凄清”则是原文未有的渲染。
  revised_text: '“不能生育、未曾生产的妇人啊，要欢喜！未曾经历产痛的妇人啊，要放声呼喊！因为荒凉妇人的儿女，比有丈夫妇人的儿女更多。”[a] 他说：“不能生育、未曾生产的妇人啊，要欢喜！”指的就是我们；因为在儿女赐给我们教会以前，她原是不能生育的。


    他说：“未曾经历产痛的妇人啊，要放声呼喊！”意思是：让我们不要像生产的妇人那样，以单纯的心向上帝献上祈求时感到疲倦。


    他又说：“荒凉妇人的儿女，比有丈夫妇人的儿女更多。”他这样说，是因为我们的民众似乎荒凉，并被上帝遗弃；如今我们既已相信，就比那些似乎有上帝的人更多。


    另有一处经文说：“我来不是要召义人，而是要召罪人。”[b]


    他的意思是：拯救那些正在灭亡的是合宜的。


    因为这实在是一件伟大而奇妙的工作：不是坚立那些已经站立的，而是扶持那些正在倒下的。


    基督也照样愿意拯救那些正在灭亡的。他来呼召我们；当时我们已经在走向灭亡，而他拯救了许多人。'
  revised_footnotes:
