base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/002.yaml
  text: '“Rejoice, you barren woman who never gave birth. Break out and cry aloud, you who were never in labor, for the children of the desolate woman are more numerous than the children of the woman who has a husband.” When he said, “Rejoice, you barren woman who never gave birth,” he was speaking about us, for our church was barren before children were given to her.


    And when he said, “Cry aloud, you who were never in labor,” he meant this: Let us not grow weary, like women in labor, of offering our prayers to God with simplicity.


    Again, when he said, “For the children of the desolate woman are more numerous than those of the woman who has a husband,” he spoke this way because our people seemed desolate and abandoned by God. But now, having believed, we have become more numerous than those who seemed to have God.


    Again, another Scripture says, “I did not come to call the righteous, but sinners.”


    He means this: It is right to save those who are perishing.


    For this truly is a great and marvelous work: to establish not the things that are standing, but the things that are falling.


    So Christ also desired to save the things that were perishing. And he saved many, coming and calling us when we were already perishing.'
translation:
  language: zh_hans
  text: '“不能生育、从未生产的女子啊，要欢喜！未曾经历产痛的女子啊，要放声呼喊！因为被遗弃之人的儿女，比有丈夫之人的儿女更多。”[a] 他说“不能生育、从未生产的女子啊，要欢喜”，指的就是我们；因为在儿女赐给我们的教会以前，她原是不能生育的。


    他说“未曾经历产痛的女子啊，要放声呼喊”，意思是：我们向上帝诚心献上祈求，不要像临产的妇人一样疲惫不堪。


    他又说：“被遗弃之人的儿女，比有丈夫之人的儿女更多。”他这样说，是因为我们的民看起来荒凉凄清，仿佛被上帝遗弃；如今我们既已相信，人数反倒超过了那些看似拥有上帝的人。


    另有一处经文说：“我来不是要召义人，而是要召罪人。”[b]


    他的意思是：理当拯救那些正在灭亡的人。


    因为真正伟大而奇妙的工作，不是扶稳那已经站立的，而是扶起那正在倒下的。


    基督也照样愿意拯救那些正在灭亡的人。就在我们濒临灭亡时，他前来呼召我们，拯救了许多人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《以赛亚书》54:1；本段随后以不能生育的妇人及其儿女来解释教会与信徒。
    reason: 标明经文来源，并帮助读者理解后文反复引用的背景。
  - marker: b
    text: 参《马可福音》2:17；另见《马太福音》9:13、《路加福音》5:32。
    reason: 标明耶稣语录在福音书传统中的对应经文，同时不武断限定作者所采用的具体文本形式。
lexical_decisions:
- source_word: στεῖρα
  choice: 不能生育
  rationale: 以现代汉语清楚表达“不育、未生育”的意义，并保留经文中的女性意象。
- source_word: ἐκκλησία
  choice: 教会
  rationale: 采用早期基督教文献中该词的常用译法；此处以“她”承接生育隐喻。
- source_word: ἐν ἁπλότητι
  choice: 诚心
  rationale: 该表达可指单纯、真诚、毫无二心；“诚心”在祷告语境中自然，同时不添加繁复的教义解释。
- source_word: ἀπολλύμενοι / ἀπολλύμενα
  choice: 正在灭亡的人
  rationale: 保留进行中的危急状态及“拯救—灭亡”的对照；依上下文将中性集合表达自然地落实为“人”。
- source_word: στηρίζειν
  choice: 扶稳／扶起
  rationale: 按“站立—倒下”的形象采用动态汉语，传达使之坚立、重新稳固之意。
theological_decisions:
- issue: “我们的教会”与不育妇人的对应
  choice: 保留教会的女性人格化，以“她”承接
  alternative: 将教会完全非人格化，译作“本来没有成员”
  rationale: 原文论证依赖以母亲和儿女比喻教会及其成员；保留形象可避免抹平作者的释经方式。
- issue: “那些看似拥有上帝的人”所指群体
  choice: 保持概括，不明确指定某一宗教或族群
  alternative: 直接解释为犹太人、旧约之民或其他特定群体
  rationale: 本段措辞本身具有概括性，具体指称存在解释空间，不宜在正文中替作者定论。
- issue: “义人”与“罪人”引文
  choice: 按引文原有张力直译
  alternative: 将“义人”解释为“自以为义的人”
  rationale: “自以为义”属于解释性限定，原句未明说；正文应保留其表面措辞与神学张力。
- issue: 基督拯救“许多人”
  choice: 保留“许多人”，不改为“所有人”
  alternative: 根据普遍救恩表述扩展为“众人”
  rationale: 所据文本明确为数量众多而非全称，翻译不应作教义性扩大。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。经文引语保留呼告和排比；释义段落则力求直接自然。底稿注明希腊文直接复核尚待完成，因此本稿结合所给公版英译见证与可识别的希腊措辞谨慎起草，不以英译中的解释性选择取代原文的歧义。
