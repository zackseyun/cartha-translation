source:
  text: 'Rejoice, thou barren that barest not. Break out and cry, thou that travailest not; for more are the children of the desolate than of her that hath the husband. In that He said Rejoice, thou barren that barest not, He spake of us: for our Church was barren, before that children were given unto her.


    And in that He said, Cry aloud, thou that travailest not, He meaneth this; Let us not, like women in travail, grow weary of offering up our prayers with simplicity to God.


    Again, in that He said, For the children of the desolate are more than of her that hath the husband, He so spake, because our people seemed desolate and forsaken of God, whereas now, having believed, we have become more than those who seemed to have God.


    Again another scripture saith, I came not to call the righteous, but sinners.


    He meaneth this; that it is right to save them that are perishing.


    For this indeed is a great and marvelous work, to establish, not those things which stand, but those which are falling.


    So also Christ willed to save the things which were perishing And He saved many, coming and calling us when we were even now perishing.'
