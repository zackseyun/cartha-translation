  text: 'While we are on earth then, let us repent: for we are clay under the craftsman’s hand.


    For in like manner as the potter, if he be making a vessel, and it get twisted or crushed in his hands, reshapes it again; but if he have once put it into the fiery oven, he shall no longer mend it: so also let us, while we are in this world, repent with our whole heart of the evil things which we have done in the flesh, that we may be saved by the Lord, while we have yet time for repentance.


    For after that we have departed out of the world, we can no more make confession there, or repent any more.


    Wherefore, brethren, if we shall have done the will of the Father and kept the flesh pure and guarded the commandments of the Lord, we shall receive life eternal.


    For the Lord saith in the Gospel, “If ye kept not that which is little, who shall give unto you that which is great? For I say unto you that he which is faithful in the least, is also faithful in much.”


    So then He meaneth this, “Keep the flesh pure and the seal unstained, to the end that we may receive life.”'
translation:
  language: zh_hans
  text: '所以，趁我们还在地上，应当悔改，因为我们是工匠手中的泥土。


    陶匠制作器皿时，器皿若在他手中变形或压坏了，他会重新塑造；但一旦把它放进火窑，就再也无法修补。照样，趁我们还在这个世界、尚有时间悔改，就应当为自己在肉身中所行的恶全心悔改，好使我们蒙主拯救。


    因为离开这个世界以后，我们在那里就再也不能认罪，也不能悔改了。


    所以，弟兄们，我们若遵行父的旨意，保持肉身纯洁，并谨守主的诫命，就必领受永生。


    因为主在福音中说：“你们若连小事都没有守住，谁会把大事交给你们呢？我告诉你们，在最小的事上忠信的人，在大事上也忠信。”[a]


    所以，这话的意思是：“要保持肉身纯洁，使印记不受玷污，好让我们领受生命。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这段引语与《路加福音》16:10等福音传统相近，但现存正典福音书中没有完全相同的连续措辞；作者可能是在引用或综合当时流传的耶稣言论。
    reason: 帮助读者理解“主在福音中说”并不等于逐字引用现存某一节经文。
  - marker: b
    text: “印记”在早期基督教文献中可用于洗礼、归属或蒙保守等意象；本段没有明确解释其所指，因此正文保留原有意象。
    reason: 保留神学歧义，避免把某一种解释写入正文。
lexical_decisions:
- source_word: clay / craftsman（希腊文复核待定）
  choice: 工匠手中的泥土
  rationale: 保留人如泥土、受造者在制作者手中的比喻，同时采用自然的现代汉语表达。
- source_word: repent / repentance（希腊文复核待定）
  choice: 悔改
  rationale: 既涵盖内心转变，也与上下文离恶、认罪和行为更新相连。
- source_word: in the flesh（希腊文复核待定）
  choice: 在肉身中
  rationale: 保留原文见证中的具身表达，不擅自改写为仅指肉欲或身体方面的罪。
- source_word: make confession（希腊文复核待定）
  choice: 认罪
  rationale: 在此悔改语境中比笼统的“承认”更清楚，同时不额外规定礼仪形式。
- source_word: the seal（可能对应 σφραγίς，待直接复核）
  choice: 印记
  rationale: 保留关键意象及其解释空间，不直接释为洗礼、圣灵或其他特定教义概念。
theological_decisions:
- issue: 悔改的时限与死后状态
  choice: 直译为离世后不能再认罪或悔改
  alternative: 弱化为死后悔改更加困难，或补入炼净、审判等体系性解释
  rationale: 本段措辞明确而强烈，应保留其劝诫力度，不用后世教义体系消解或扩展。
- issue: “保持肉身纯洁”的含义
  choice: 保留“肉身”及“纯洁”的直接表述
  alternative: 具体解释为性纯洁、禁欲主义或一般道德生活
  rationale: 上下文本身未把范围限定到某一种伦理议题，译文不应擅自缩窄。
- issue: 领受永生与人的行为
  choice: 保留“若……就……”的条件句结构
  alternative: 改写为行为只是已得救的证据，或将其解释为靠行为赚取救恩
  rationale: 原段同时谈主的拯救、悔改、顺服与永生；译文保留这种神学张力，不代作者作体系化裁决。
- issue: “印记”的所指
  choice: 正文不作解释，以脚注说明其可能的早期基督教背景
  alternative: 直接译成“洗礼印记”或“圣灵的印记”
  rationale: 所供材料不足以确定作者在此唯一所指，保留歧义更忠实。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留劝诫语气、陶匠比喻和条件句结构。引文使用现代标点。由于所供材料明确说明希腊文审查尚未完成，本稿以公共领域英文见证为直接起草依据，并对可能涉及的希腊词仅作审慎提示；正式出版前应据希腊抄本传统逐句复核。
