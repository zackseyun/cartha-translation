source:
  text: 'Seeing then that He bestowed so great mercy on us; first of all, that we, who are living, do not sacrifice to these dead gods, neither worship them, but through Him have known the Father of truth. What else is this knowledge to Himward, but not to deny Him through whom we have known Him?


    Yea, He Himself saith, Whoso confesseth Me, Him will I confess before the Father.


    This then is our reward, if verily we shall confess Him through whom we were saved.


    But wherein do we confess Him? When we do that which He saith and are not disobedient unto His commandments, and not only honor Him with our lips, but with our whole heart and with our whole mind.


    Now He saith also in Isaiah, This people honoreth me with their lips, but their heart is far from Me.'
