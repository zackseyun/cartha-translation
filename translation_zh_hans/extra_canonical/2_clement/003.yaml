    Now He saith also in Isaiah, This people honoreth me with their lips, but their heart is far from Me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/003.yaml
  text: 'Seeing, then, that he showed us such great mercy—first of all, that we who are alive do not sacrifice to these dead gods or worship them, but through him have come to know the Father of truth—what else is this knowledge toward him except not denying him through whom we have known him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    This, then, is our reward, if we truly confess him through whom we were saved.


    But how do we confess him? By doing what he says, not disobeying his commandments, and honoring him not only with our lips but with our whole heart and our whole mind.


    Now he also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
translation:
  language: zh_hans
  text: '所以，既然他向我们施了如此大的怜悯——首先，使我们这些活着的人不再向这些死的神明献祭，也不敬拜它们，反而借着他认识了真理之父——那么，我们对他的这种认识，岂不就是不否认那位使我们认识父的吗？[a]


    他亲自说：“凡承认我的，我也要在父面前承认他。”[b]


    所以，我们若真承认那位拯救我们的，这就是我们的赏赐。


    但我们怎样承认他呢？就是遵行他所说的，不违背他的诫命；并且不只用嘴唇尊敬他，更要全心全意地尊敬他。


    他又在《以赛亚书》中说：“这百姓用嘴唇尊敬我，心却远离我。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段现据所提供的公版英文见证译出；希腊文原文尚待直接校勘。句中代词在“父”与“借着他认识父的那一位”之间转换，原文关系可能需要希腊文复核。
    reason: 资料明确说明尚未完成希腊文审查，且此处代词指向影响意义。
  - marker: b
    text: 参《马太福音》10:32；《路加福音》12:8有相近说法。本处按《革利免二书》所保存的引文形式翻译。
    reason: 标明耶稣语录的经文关联，同时不强行将措辞统一到某一福音书文本。
  - marker: c
    text: 参《以赛亚书》29:13；亦参《马太福音》15:8及《马可福音》7:6。本处按作者所引的简短形式翻译。
    reason: 交代引文来源及新约平行用法，并保留本书自身文本形态。
lexical_decisions:
- source_word: mercy
  choice: 怜悯
  rationale: 保留早期基督教文献中神施恩怜恤的宗教语义，同时符合现代汉语表达。
- source_word: dead gods
  choice: 死的神明
  rationale: 保留原文以“活着的人”对照“死的神”的修辞；用“神明”可避免汉语中“死神”一词造成误读。
- source_word: Father of truth
  choice: 真理之父
  rationale: 采用较形式对应的表达，不擅自解释为“真实的父”或“真神父”，从而保留短语可能具有的语义张力。
- source_word: confess
  choice: 承认
  rationale: 此处既涉及公开认信，也与“否认”构成直接反义关系；“承认”在现代汉语中较自然，并能贯穿上下文。
- source_word: reward
  choice: 赏赐
  rationale: 比“报酬”更适合宗教语境，同时不预先界定赏赐的具体内容。
- source_word: whole mind
  choice: 全意
  rationale: 与“全心”组成自然、庄重的汉语搭配；表达整全的内在意向，不将其缩窄为纯理性活动。
theological_decisions:
- issue: “认识他”以及关系代词所指对象的转换
  choice: 将“借着他认识了真理之父”与“不否认那位使我们认识父的”区分表达
  alternative: 将所有“他”统一解释为基督或父
  rationale: 原句在父与中保者之间存在代词指向张力；译文尽量保留关系，同时以“认识父”避免汉语中完全无法辨认的代词混乱。
- issue: “承认”是口头认信还是行为见证
  choice: 保留“承认”，随后按原文说明其包括顺服与全心尊敬
  alternative: 直接译为“公开宣认”或“以行为见证”
  rationale: 作者本人在下文扩展其含义；不应在首次出现时把它限定为仅口头或仅行为。
- issue: “这就是我们的赏赐”的条件关系
  choice: 保留“若真承认……这就是我们的赏赐”
  alternative: 解释为因行为赚取救恩
  rationale: 原文将赏赐与承认相连，但没有系统说明功劳、恩典或救恩次序；译文不额外解决这一神学张力。
- issue: 以赛亚引文的文本形式
  choice: 按本段所引形式翻译
  alternative: 直接套用某一现代《以赛亚书》译本或福音书平行经文
  rationale: 早期基督教作者的引文措辞可能来自特定传承或记忆引用，应保留本段见证本身的形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“所以”“但”“就是”等常用连接语维持讲道式论证；避免过度古雅的“尔等”“焉”等措辞。引文使用现代标点。“全心全意”自然传达整全投入，但为保留原句“全心、全意”的双重结构，写作“更要全心全意地尊敬他”。鉴于仅提供英文公版见证而未提供希腊文正文，本稿明确标为待希腊文复核的来源受限译稿。
