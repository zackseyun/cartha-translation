    rationale: 英文见证的句法将“不否认他”界定为对那位使人认识父者应有的回应。修订须保留父与中保者之间的关系，且不可将后者误作父本身。
  - severity: low
    issue: “死的神明”略显生硬。
    rationale: “已死的神明”在现代汉语中较自然，同时保留作者把活人和死神明对照的修辞。
