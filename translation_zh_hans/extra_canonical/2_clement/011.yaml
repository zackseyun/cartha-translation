base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/011.yaml
  text: 'Therefore, let us serve God with a pure heart, and we shall be righteous; but if we do not serve him because we do not believe the promise of God, we shall be wretched.


    For the word of prophecy also says: “Wretched are the double-minded, who doubt in their hearts and say, ‘We heard these things long ago, in the days of our fathers also; yet we have waited day after day and seen none of them.’”


    You fools! Compare yourselves to a tree; take a vine. First it sheds its leaves, then a shoot comes, after this a sour berry, then a fully ripe grape.


    So likewise my people had tumults and afflictions, but afterward they shall receive good things.


    Therefore, my brethren, let us not be double-minded, but endure patiently in hope, that we also may obtain our reward.


    For faithful is he who promised to pay to each person the recompense of their works.


    Therefore, if we shall have wrought righteousness in the sight of God, we shall enter into his kingdom and receive the promises which ear has not heard, nor eye seen, nor eye seen, neither has it entered into the heart of man.'
translation:
  language: zh_hans
  text: '所以，我们要以纯洁的心事奉上帝，这样就必成为义人；但我们若因不信上帝的应许而不事奉他，就必有祸了。


    因为先知的话也说：“三心二意、心里疑惑的人有祸了！他们说：‘这些事，我们早在祖辈的日子就听说过；然而我们一天又一天地等候，却什么也没有看见。’”


    愚昧的人哪！你们可以拿一棵树来作比较，就以葡萄树为例：它先落叶，然后抽芽，接着结出酸涩的果子，最后才有完全成熟的葡萄。


    同样，我的子民曾经历动乱和患难，但后来他们必得到美好的福分。


    所以，我的弟兄们，我们不要三心二意，却要怀着盼望耐心忍受，好使我们也能得到报偿。


    因为那位应许按各人所行的给予报偿者是信实的。


    所以，我们若在上帝面前行义，就必进入他的国，并领受那些应许，就是“耳朵未曾听见，眼睛未曾看见，眼睛未曾看见，人的心也未曾想到”的。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有英文见证在这里把“眼睛未曾看见”重复了两次；本译文暂予保留。此处仍待依据希腊文本进一步核校。
    reason: 说明见证文本中的明显重复，并透明标示当前底本限制。
lexical_decisions:
- source_word: serve
  choice: 事奉
  rationale: 在宗教语境中自然、庄重，既可表达敬拜，也可表达忠诚服事。
- source_word: pure heart
  choice: 纯洁的心
  rationale: 保留心灵洁净的伦理与宗教含义，不缩窄为单纯的真诚。
- source_word: double-minded
  choice: 三心二意
  rationale: 以现代汉语常用表达传达内心摇摆、不能坚定信靠的意思。
- source_word: sour berry
  choice: 酸涩的果子
  rationale: 体现葡萄成熟前的阶段，同时避免生硬直译为“酸浆果”。
- source_word: recompense
  choice: 报偿
  rationale: 保留按行为所得回报的中性含义，不预先限定为奖赏或惩罚。
- source_word: wrought righteousness
  choice: 行义
  rationale: 简洁保留实践公义或正直行为的含义，避免译成靠行为取得义人身份。
theological_decisions:
- issue: “我们就必成为义人”与事奉上帝的关系
  choice: 保留条件性表述“这样就必成为义人”
  alternative: “这样就必被称为义”或“这样便证明我们是义人”
  rationale: 现有见证文本直接连接纯心事奉与成为义人；不加入称义机制或证明论的解释。
- issue: 按各人所行的给予报偿
  choice: 直译并保持开放
  alternative: 明确译为“按行为施行审判”或“赐下奖赏”
  rationale: 原见证的“recompense”可涵盖回报或应得结果，文本在此未明确只指奖赏或刑罚。
- issue: “进入他的国”与“行义”的关系
  choice: 保留“若……就……”的条件结构
  alternative: 弱化为“行义的人表明自己将进入他的国”
  rationale: 忠实保留作者的劝勉力度与神学张力，不引入特定宗派对救恩次序的说明。
- issue: 末句重复“眼睛未曾看见”
  choice: 正文照录重复并加注
  alternative: 按《哥林多前书》2:9的熟悉形式删除一次
  rationale: 所供见证明确重复该短语；在尚未直接核查希腊文本时不擅自校改。
translation_notes:
  register: 采用现代标准汉语，语气庄重而易懂。段落和引语层次依照见证文本处理；“弟兄们”保留古代会众劝勉的称呼。由于所供材料说明希腊原文复核尚未完成，本稿避免对疑似引文异文作无依据的修订。
