base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/015.yaml
  text: Jesus said[a], "When you see the one who was not born from a woman, throw yourselves down upon your faces and worship him[d][c][b]. That one is your Father."
translation:
  language: zh_hans
  text: 耶稣说：“当你们看见那位不是由女人所生的[a]，就要俯伏，面朝下敬拜他。那一位[b]就是你们的父。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不是由女人所生”呼应圣经传统中“由女人所生”的说法（参《约伯记》14:1；《马太福音》11:11），但这里把这一位称为“你们的父”，是《多马福音》独特的表达。
    reason: cross_reference
  - marker: b
    text: 原文采用带强调意味的指示说法，近于“那一位”，而不只是普通的“他”。
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: ⲡⲉϫⲉ引出直接引语；采用现代汉语中简洁、庄重的常规表达。
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲛⲁⲩ
  choice: 当你们看见
  rationale: ϩⲟⲧⲁⲛ引出时间条件，ⲉⲣϣⲁⲛ结构带预期或将来意味；汉语用“当……看见”自然保留这一关系。
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲡⲉⲛⲧⲟⲟⲩϫⲡⲟⲛⲧⲟϥ ⲉⲃⲟⲗ ϩⲛⲡⲥϩⲓⲙⲉ
  choice: 那不是由女人所生的
  rationale: 定指关系结构译作“那……的”；出生动词与“由女人”连用，明确表达人的出生来源，同时不进一步解释其所指。
- source_word: ⲡⲱϩⲧⲛⲧⲱⲧⲛ ⲉϫⲛⲡⲉⲧⲛϩⲟ
  choice: 俯伏在地，以脸贴地
  rationale: ⲡⲱϩⲧ带有倒下、俯伏的强烈身体动作；“以脸贴地”明确呈现原文“在你们的脸上”的姿态，并按汉语习惯表达其分配性含义。
- source_word: ⲟⲩⲱϣⲧ ⲛⲁⲛⲧⲟϥ
  choice: 敬拜他
  rationale: 该动词在俯伏语境中具有敬拜、崇拜之义；“敬拜”比单纯“致敬”更准确。
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ
  choice: 那一位
  rationale: 保留指示性和强调意味，不弱化为普通代词“他”。
- source_word: ⲡⲉⲧⲛⲉⲓⲱⲧ
  choice: 你们的父
  rationale: 直译亲属称谓“父”，不擅自补入“天父”或其他神学限定。
theological_decisions:
- issue: “不是由女人所生的”所指身份
  choice: 保留为未解释的定指称谓，并按原文称其为“你们的父”
  alternative: 明确解释为上帝、天父或某种超越存在
  rationale: 原文没有进一步说明其身份；译文应保留《多马福音》此处独特而紧张的表述，不以教派性解释消除歧义。
- issue: ⲟⲩⲱϣⲧ的宗教意味
  choice: 敬拜
  alternative: 致敬、下拜
  rationale: 俯伏姿态与“你们的父”的身份陈述使宗教性含义较强；“敬拜”保留这种分量，同时不额外界定对象的本体身份。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的书面汉语。保留原文简短有力的命令句和指示强调；“俯伏在地，以脸贴地”兼顾动作的强烈感与汉语自然度。所有注脚标记均置于正文相应位置。
