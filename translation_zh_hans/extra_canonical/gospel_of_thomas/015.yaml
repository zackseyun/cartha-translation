  - severity: low
    issue: “以脸贴地”将原文的面朝下姿态明确落在“地”上。
    rationale: 这在俯伏的惯用表达中可以理解，但原文只明说“在你们的脸上／面朝下”。改为“面朝下”可避免不必要的具体化，同时保留动作含义。
