  verdict: revise
  source_fidelity: 正文准确传达了“看见那位不是由女人所生者”“俯伏并敬拜他”以及“那一位是你们的父”的基本结构，也没有擅自界定该人物身份。不过，“以脸贴地”虽可表达俯伏姿态，却比原文“在你们的脸上／面朝下”更具体地补出了“地”；可用“面朝下”更直接保留姿态而不添加落点。
  naturalness: 整体庄重、通顺。将“那不是由女人所生的”调整为“那位不是由女人所生的”，可使汉语中的指称更明确自然；“俯伏，面朝下”简洁有力，符合现代书面汉语。
  terminology: “敬拜”恰当地保留了ⲟⲩⲱϣⲧ在此姿态和语境中的宗教性；“父”应维持，不补作“天父”。“那一位”保留了ⲣⲉⲙⲙⲁⲩ的强调性指示。
