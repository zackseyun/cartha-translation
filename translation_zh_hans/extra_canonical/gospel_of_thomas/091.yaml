base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/091.yaml
  text: They said to him[a], "Say to us who you are, so that we may believe in you." He said to them, "You test the face of the sky and the earth, and the one who is before you you do not recognize[e][d][c][b]; and this kairos you do not know how to test."
translation:
  language: zh_hans
  text: 他们对他说：“告诉我们[a]，你是谁，好让我们信你[b]。”他对他们说：“你们辨察天地的面貌[c]，却认不出那在你们面前的[d]；你们也不知道怎样辨察这个时机[e]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 印本文作“ϫⲟⲟⲥ ⲉⲣⲟⲛ”，规范化文本作“ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ”；两者都可译为“告诉我们”。
    reason: textual_variant
  - marker: b
    text: “信”也可理解为“信靠”。原词借自希腊语 πιστεύω。
    reason: lexical_alternative
  - marker: c
    text: “面貌”原文字面为“脸”，在这里也可指外观或表象。
    reason: cultural_note
  - marker: d
    text: 原文也可译作“在你们面前的事物”；但随后使用阳性单数代词，较支持这里指“在你们面前的那一位”。
    reason: ambiguity_note
  - marker: e
    text: “时机”原词是希腊语借词 καιρός，指特定、关键或适宜的时间，也可译作“时候”或“季节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲟⲟⲥ ⲉⲣⲟⲛ / ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: 请告诉我们
  rationale: 印本与规范化文本形式不同，但都表达直接请求“告诉我们”；加“请”符合现代汉语对话习惯，并不改变命令式语义。
- source_word: ⲛⲧⲕ ⲛⲓⲙ
  choice: 你是谁
  rationale: 这是询问个人身份的惯常表达，语境也明确指向说话对象的身份。
- source_word: ⲣⲡⲓⲥⲧⲉⲩⲉ
  choice: 信你
  rationale: 该词借自希腊语 πιστεύω，可表示相信或信靠；“信你”在此既自然，也保留认信与信任之间的语义空间。
- source_word: ⲣⲡⲓⲣⲁⲍⲉ
  choice: 辨察
  rationale: 该希腊语借词在两处重复，含试验、检验、察验之意；“辨察”适合观察天地征象与识别时机的共同语境，并保留两处呼应。
- source_word: ⲡϩⲟ
  choice: 面貌
  rationale: 字面为“脸、面”，在此可指外观；“面貌”既保留形象化表达，也比直译“脸”更符合现代汉语。
- source_word: ⲡⲡⲉ (ⲧⲡⲉ) ⲙⲛ ⲡⲕⲁϩ
  choice: 天地
  rationale: 原文为“天与地”；“天地”简洁自然，并避免在观察性语境中把“天”过度神学化为“天堂”。
- source_word: ⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  choice: 那在你们面前的
  rationale: 后接阳性单数宾语代词，较支持人物所指；但关系结构本身也可理解为“在你们面前的事物”，故正文采用不补出“人”的表达以保留一定歧义。
- source_word: ⲥⲟⲟⲩⲛϥ
  choice: 认不出
  rationale: 在眼前对象的语境中，动词“知道”自然呈现为“认出、认识”；“认不出”准确表达未能识别。
- source_word: ⲕⲁⲓⲣⲟⲥ
  choice: 时机
  rationale: 希腊语借词 καιρός 指特定、关键或适宜的时间；“时机”比泛指的“时间”更能传达其特定性，同时避免正文保留普通读者不熟悉的音译。
- source_word: ⲥⲟⲟⲩⲛ ... ⲛⲧⲉ ⲣⲡⲓⲣⲁⲍⲉ
  choice: 不知道怎样辨察
  rationale: 该结构表达知道如何做某事，故译为“不知道怎样辨察”，而非简单的“不辨察”。
theological_decisions:
- issue: “那在你们面前的”所指是耶稣本人还是眼前之物
  choice: 正文译作“那在你们面前的”，不补出“人”或“我”
  alternative: “站在你们面前的那一位”／“在你们面前的事物”
  rationale: 随后阳性单数代词倾向人物所指，但关系表达仍容许非人格读法。正文保留原文张力，脚注说明较可能的个人指向。
- issue: καιρός 是否应解释为末世性的“时候”
  choice: 译作中性的“时机”
  alternative: “指定的时候”／“末后的时刻”
  rationale: 原文本身没有明说末世含义；不应把特定神学框架加入译文。“时机”保留关键、适切之时的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留简洁的问答结构和后半句两次“辨察”的修辞呼应；对“面貌”与“那在你们面前的”不作过度解释，以维持原文的形象和歧义。
