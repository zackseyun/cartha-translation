base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/056.yaml
  text: 'Jesus said: Whoever has come to know the world has found a corpse[a]; and whoever has found the corpse[c][b], the world is not worthy of him.'
translation:
  language: zh_hans
  text: 耶稣说：“凡认识了世界的人，便发现了一具尸体[a]；凡发现了那具尸体的人，世界不配得着他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文第一次说“一具尸体”，第二次则说“那具尸体”，回指先前所发现的尸体；译文保留了这一由不定指转为定指的变化。
    reason: 原文定指差异
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 这是引出言论的标准叙事公式；用现代汉语简洁的过去叙事表达，不另加时态标记。
- source_word: ⲥⲟⲟⲩⲛ
  choice: 认识了
  rationale: “认识”保留对“世界”的认知含义，“了”体现该结构所带的完成或结果状态；“了解”可能偏向信息层面的熟悉。
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: 世界
  rationale: 该希腊语借词在此通常指“世界”；译作“宇宙”会增添现代技术色彩。
- source_word: ϩⲉ
  choice: 发现
  rationale: 表达遇见、找到某物的结果，又能保持原句突兀有力的语气。
- source_word: ⲟⲩⲡⲧⲱⲙⲁ / ⲡⲧⲱⲙⲁ
  choice: 一具尸体 / 那具尸体
  rationale: “尸体”准确保留原文的尖锐意象；量词“具”合乎现代汉语。前后分别用“一具”和“那具”，呈现原文由不定到定指的回指关系。
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: 配不上他
  rationale: 自然地表达“世界不配得/不值得拥有他”的关系，同时保留评价性的张力；“不配有他”较生硬，“不值得他”在汉语中搭配不完整。
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ …
  choice: 凡……的
  rationale: 对应不定关系结构，简洁表达普遍适用的“任何人/凡是……的人”。
theological_decisions:
- issue: “世界”与“尸体”的关系
  choice: 按原文直译为认识世界即发现一具尸体
  alternative: 解释性译为看透世界的死亡本质
  rationale: 原文采用凝缩的隐喻，并未明说世界为何是尸体；正文不替读者确定其神学或宇宙论含义。
- issue: “世界配不上他”的评价对象
  choice: 保留男性单数代词“他”，指发现那具尸体的人
  alternative: 改写为“这样的人，世界配不上”
  rationale: 原文明确使用第三人称阳性单数形式；保留“他”也维持格言的直接性，不扩展为特定宗派意义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留《多马福音》格言式的凝练和“世界—尸体”意象的冲击力。分号呈现两个紧密平行的分句；不加入原文没有的解释。
