revisions:
- from: 耶稣说：“凡认识了世界的，就是发现了一具尸体[a]；凡发现了那具尸体的，世界配不上他。”
  to: 耶稣说：“凡认识了世界的人，便发现了一具尸体[a]；凡发现了那具尸体的人，世界不配得着他。”
  rationale: 修订仅调整汉语句法和语体：补出“人”以清晰对应原文的泛指关系结构；以“便”而非“就是”表达前项完成后所发生的结果；将末句改为较庄重的“不配得着他”。不解释“世界”与“尸体”的隐喻关系，也不改变其歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:24:42Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了两层关系分句、“世界／尸体”的突兀并置，以及第一处不定、第二处定指的变化。可是“凡认识了世界的，就是发现了……”在汉语中容易读成定义性等同，而原文是“认识了世界的人找到了尸体”的叙述性结果；宜明确补出“人”并以“便”连接。
  naturalness: “凡认识了世界的”缺少中心词，虽可理解但不够自然；“就是发现了”也使格言句式略显生硬。改为“凡认识了世界的人，便发现了……”更合现代标准汉语，并维持原文简练的平行结构。
  terminology: “耶稣”“世界”“尸体”均恰当。“那具尸体”妥善保留定指回指。“世界不配得着他”以较庄重而仍可理解的现代书面语表达“世界不配／不值得有他”，避免“配不上他”的口语评价色彩。
  issues:
