    issue: 首分句的“就是”造成不必要的定义性语气，且“凡……的”省略中心词。
    rationale: 原文的两个分句均为“某人已经……，就找到了／世界不配他”的关系句，并不把“认识世界”直接定义为“发现尸体”。补出“人”并用“便”更准确传达句法关系。
