base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/073.yaml
  text: Jesus said[1], "The harvest indeed is plentiful, but the workers are few. Beseech the master, then[2], that he may send out workers to the harvest."
translation:
  language: zh_hans
  text: 耶稣说：“庄稼确实很多，工人却很少。因此，要恳求主人[a]，好让他派工人去收庄稼[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主人”也可译作“主”。原词既可指有权柄的主人，也常用作“主”的称谓。
    reason: 保留原词在农业场景与神学称谓之间的词义张力。
  - marker: b
    text: 与《马太福音》9:38和《路加福音》10:2的平行经文不同，本句在“主人”之后没有“庄稼的”，末尾“庄稼”之前也没有“他的”。
    reason: 说明《多马福音》此处与正典平行经文的文本差异，避免把后者的措辞补入正文。
lexical_decisions:
- source_word: ⲡⲱϩⲥ
  choice: 庄稼／收庄稼
  rationale: 该词可指“收割、收成、庄稼”。前一句用名词“庄稼”自然表达待收的作物，末句用“去收庄稼”自然传达工人被派往收割之处的意思。
- source_word: ⲛⲁϣⲉⲛⲧⲟϥ
  choice: 很多
  rationale: 表示数量多或丰盛；“庄稼很多”是现代汉语中清楚自然的表达。
- source_word: ⲥⲟⲃⲕ
  choice: 很少
  rationale: 与前面的“很多”形成原文明确的对照。
- source_word: ⲥⲟⲡⲥ
  choice: 恳求
  rationale: 这是表示恳切请求、祈求的动词，不是单纯的“询问”，也不是连接词。
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: 主人
  rationale: 该词既可作神学称谓“主”，也可指拥有权柄的主人；农业用工语境中译作“主人”较自然，同时以脚注保留“主”这一可能。
- source_word: ⲛⲁⲛⲟⲩϫⲉ ... ⲉⲃⲟⲗ
  choice: 派
  rationale: 字面有“抛出、赶出”之意，在派遣工人的语境中表示把人派出去；“派”符合现代汉语习惯。
- source_word: ϩⲓⲛⲁ
  choice: 好让
  rationale: 保留目的或预期结果关系，即恳求主人，为要让他派出工人。
theological_decisions:
- issue: ⲡϫⲟⲉⲓⲥ 应译作神学称谓还是庄园语境中的身份称谓
  choice: 主人
  alternative: 主
  rationale: 原词本身容许两种理解。正文依农业场景采用“主人”，但不把“主”的神学读法排除，故在脚注中明确说明。
- issue: 末尾的“庄稼”是否带所属关系
  choice: 不添加“他的”
  alternative: 他的庄稼
  rationale: 科普特文本末尾没有物主词；为免受马太福音和路加福音平行经文影响，正文保留无所属词的形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“确实……却……”保留原文的对照结构；“恳求”体现请求的恳切程度；“去收庄稼”比字面式的“到庄稼那里去”更符合现代汉语，同时没有补入原文缺少的所属词。
