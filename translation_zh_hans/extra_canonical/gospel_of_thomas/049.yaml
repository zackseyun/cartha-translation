base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/049.yaml
  text: Jesus said[a], "Blessed are the solitary and chosen, for you will find the kingdom. For you are from it[b][c], and you will go there again."
translation:
  language: zh_hans
  text: 耶稣说：“那些独处的人和蒙拣选的人有福了[a]，因为你们必找到国度[b]。因为你们原是出于它的[c]，还要再到那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “独处的人”所译的词也可表示“单一、独一”或“内在不分裂”。这里不采用后世制度意义较强的“修士”。
    reason: lexical_alternative
  - marker: b
    text: 手稿在“找到”之后使用了这一抄本常见的地区性介词形式；意思仍是“找到国度”。
    reason: dialect_note
  - marker: c
    text: 原文直译近于“你们是出于它的”，即“你们从它而来”；“它”指前面的“国度”。
    reason: register_note
lexical_decisions:
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: 独处的人
  rationale: 这是希腊语 μοναχός 的借词，在此不宜按后世制度化含义译作“修士”。“独处的人”保留其与独自、单一及不分心相关的语义空间；脚注说明其也可侧重内在的专一或完整。
- source_word: ⲥⲱⲧⲡ
  choice: 蒙拣选
  rationale: 手稿中的 ⲉⲧⲥⲟⲧⲡ 是被动或状态性的关系结构，意为“被拣选的”，不是主动的“作出选择”。
- source_word: ϩⲉ
  choice: 找到
  rationale: 该动词在这里与介词连用，通常表示“找到”；手稿所用介词具有方言色彩，不改变基本意义。
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: 那国
  rationale: 译作“国”保留传统而宽广的王权、国度语义；加“那”使后文“从那里来、回到那里”的指代在现代汉语中自然连贯。
- source_word: ⲟⲩⲉⲃⲟⲗ ⲛϩⲏⲧⲛⲧⲟⲥ
  choice: 是从那里来的
  rationale: 原文直译近于“是出于它的／从它出来的”。中文以来源表达传达此义，同时不进一步界定这种来源的性质。
- source_word: ⲡⲁⲗⲓⲛ ... ⲃⲱⲕ ⲙⲙⲁⲩ
  choice: 还要再回到那里
  rationale: ⲡⲁⲗⲓⲛ 表示“再次”，与来源句相连时，现代汉语“回到”自然表达再次前往来源之处的意思。
theological_decisions:
- issue: ⲙⲟⲛⲁⲭⲟⲥ 所指的身份或状态
  choice: 独处的人
  alternative: 修士；独一的人；内在专一的人
  rationale: “修士”容易把后世制度化修道身份带入文本；“独处”较贴近词面，同时脚注保留“单一、不分裂、专一”等可能内涵，不把它固定为纯社会性孤居或某种特定灵修教义。
- issue: “独处”与“蒙拣选”的关系
  choice: 译为“独处而蒙拣选的人”
  alternative: 独处的人和蒙拣选的人
  rationale: 原文复数结构将两项并列描述，语境可理解为同一群体兼具两种特征。用“而”作紧密连接，但不展开其逻辑关系。
- issue: 国的时间与性质
  choice: 保留“那国”，不加“天”“神”或“统治”等限定
  alternative: 天国；神的国；王权
  rationale: 原文只说“国”，并以来源和返回之地指称它。译文保留这种张力，不将其解释为纯未来、纯内在或特定宇宙论意义。
- issue: “从那里来”所表达的来源
  choice: 不解释来源的本体论性质
  alternative: 本来属于那国；从那国降生；由那国所生
  rationale: 原文只明确表达“出于它／从它而来”。避免加入先存、降生或归属等超出句面的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留第二人称复数“你们”以及“找到—从那里来—再回到那里”的推进。首句依据手稿的复数形式处理，不受规范化文本误作单数的影响；避免使用带明显后世制度色彩的“修士”，也不把“国”的性质作宗派化解释。
