revisions:
- from: '他的门徒对他说：“你是谁，竟对我们说这些话？”


    “从我对你们所说的话中，你们并不知道我是谁。[a] 然而，你们已经变得像犹太人：他们爱树，却恨树的果子；又爱果子，却恨树。[b]”'
  to: '他的门徒对他说：“你是谁，竟对我们说这些话？”


    “根据我对你们所说的话，你们还认不出我是谁。[a]然而，你们已经变得像犹太人：他们爱树，却恨树的果子；又爱果子，却恨树。[b]”'
  rationale: 仅作低风险的汉语措辞调整：以“根据……还认不出”替换较生硬的“从……中，并不知道”，使“所说的话”与未能辨认身份之间的关系清晰自然。其余正文和脚注均可保留，且脚注标记与正文锚点对应完整。
