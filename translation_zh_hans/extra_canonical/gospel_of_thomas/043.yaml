  naturalness: 首句和后半段自然、庄重。“根据我对你们所说的话，你们还认不出我是谁”更符合现代汉语，并保留原文“由我所说的话”这一限定及责备语气。
  terminology: “门徒”“犹太人”“树”“果子”“爱／恨”均恰当。保留“犹太人”而不改写为解释性类别，符合原文；脚注对其概括性修辞的限定处理审慎。
