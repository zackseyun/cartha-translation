base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/043.yaml
  text: 'His disciples said to him[1], "Who are you, that you say these things to us?"


    "From what I say to you, you do not know who I am. But you have become like the Jews, for they love the tree but hate its fruit[2], and they love the fruit but hate the tree."'
translation:
  language: zh_hans
  text: '他的门徒对他说：“你是谁，竟对我们说这些话？”


    “根据我对你们所说的话，你们还认不出我是谁。[a]然而，你们已经变得像犹太人：他们爱树，却恨树的果子；又爱果子，却恨树。[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里也可理解为反问：“你们难道不知道我是谁吗？”科普特语的否定现在时在此既可读作陈述，也可读作带责备意味的反问。
    reason: 保留原文句式在陈述与反问之间的真实歧义。
  - marker: b
    text: 原文把“爱”与“恨”直接并置，没有连接词；译文加“却”以符合汉语表达。这里对“犹太人”的说法属于本作品中说话者的概括性比喻，不应扩展成对所有犹太人的普遍评价。
    reason: 说明为汉语清晰度所补出的转折关系，并防止把原文的修辞性概括误当作译者的普遍断言。
lexical_decisions:
- source_word: ⲉⲓⲙⲉ
  choice: 知道
  rationale: 该词可表示“知道、明白、认识”；这里以“我是谁”为宾语，“知道”既自然，也不把身份认知过度解释为某种特定的神学认识。
- source_word: ϣⲱⲡⲉ
  choice: 变得
  rationale: 完成时形式表示状态已经发生变化；“已经变得”保留这一动态意义。
- source_word: ϣⲏⲛ
  choice: 树
  rationale: 这是该科普特词在此处直接而通常的含义，并与“果子”构成明晰对照。
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: 果子
  rationale: 采用现代圣经语体中自然且为普通读者熟悉的词，同时保留树与其产物之间的比喻关系。
- source_word: ⲙⲉ / ⲙⲟⲥⲧⲉ
  choice: 爱／恨
  rationale: 原文刻意并置两个强烈相反的动词；直译为“爱／恨”可保留其尖锐张力。
- source_word: ⲛⲓⲓⲟⲩⲇⲁⲓⲟⲥ
  choice: 犹太人
  rationale: 按原文保留群体称谓，不以解释性称呼替换，也不把它扩大为译者自己的概括判断。
theological_decisions:
- issue: 耶稣回答中的陈述句与反问句歧义
  choice: 正文译作陈述句：“你们并不知道我是谁”
  alternative: “你们难道不知道我是谁吗？”
  rationale: 否定现在时在句法上可作陈述，也可能在语境中具有反问语气。陈述句较贴近表层形式，并能自然引出“然而”的责备；另一种理解在脚注中保留。
- issue: “犹太人”这一概括性比喻的处理
  choice: 保留原文措辞
  alternative: 改写为某一部分犹太人或某类宗教人士
  rationale: 原文没有范围限定，译文不应擅自缩小或另作寓意化解释；同时用脚注说明这是作品中说话者的比喻性概括，不应由译文扩展为普遍断言。
- issue: 树与果子的象征所指
  choice: 不在正文中明确树或果子分别象征谁或什么
  alternative: 将其解释为耶稣与其教导、传统与结果等特定对应关系
  rationale: 本句没有明说比喻的对应对象；保留开放性可避免导入某一解释传统。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竟”传达门徒提问中因耶稣说这些话而追问其身份的语气；两组“爱／恨”保持平行和尖锐反差。回答前不补入“他对他们说”，因为现存科普特文本在此直接转换说话者。
