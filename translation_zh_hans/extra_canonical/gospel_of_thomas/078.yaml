base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/078.yaml
  text: 'Jesus said[a], "What did you go out into the wilderness to see? A reed shaken by the wind? And a person in soft clothing, with garments put on him? Look: those in soft clothing are in the house of your king and your magnate[f][e][d][c][b], and they are not able to know the truth."'
translation:
  language: zh_hans
  text: 耶稣说：“你们到旷野去，是要看什么？看一根被风吹动的芦苇吗？还是看一个身穿柔软衣服的人？看哪，身穿柔软衣服的人在你们君王和权贵的府中[a][b]，而他们不能认识真理[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “府中”所据原文在抄本此处有残损；规范化文本读作“在你们君王和权贵的府中”，并保留“君王”和“权贵”的单数形式。
    reason: lacuna_or_restoration
  - marker: b
    text: “权贵”所译的词是希腊语借词，也可译作“大人物”或“显贵”。
    reason: lexical_alternative
  - marker: c
    text: “认识真理”也可译作“认出真理”或“明白真理”；原文动词可表示知道、理解或辨认。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ … ⲉⲛⲁⲩ
  choice: 是要看什么
  rationale: 这里询问出去所要看的对象，而非单纯追问原因；现代汉语用“是要看什么”自然保留修辞问句。
- source_word: ⲡⲥⲱϣⲉ
  choice: 旷野
  rationale: 该词可指荒野、旷野或沙漠；“旷野”既不限定为沙地，也符合庄重的经文语域。
- source_word: ⲟⲩⲕⲁϣ … ϩⲓⲧⲛⲡⲧⲏⲩ
  choice: 一根被风吹动的芦苇
  rationale: 按语境将ⲕⲁϣ译为“芦苇”，并以“被风吹动”表达风作为施动者。
- source_word: ⲟⲩⲣⲱⲙⲉ
  choice: 一个……的人
  rationale: 此处所指为泛称人物；汉语“人”自然且不额外强调性别。
- source_word: ⲛϣⲧⲏⲛ / ϣⲧⲏⲛ
  choice: 柔软衣服
  rationale: 保留衣料柔软这一直接意象，不扩译为“华贵”或“奢华”，以免过度解释。
- source_word: ϭⲛⲟⲛ ϩⲓⲛⲧⲟϥ
  choice: 身穿
  rationale: 科普特语采用衣服被穿在身上的具体表达；现代汉语以“身穿”简洁自然地传达。
- source_word: ⲡⲉⲧⲛⲣⲣⲟ
  choice: 你们君王
  rationale: 保留第二人称复数所属关系及原文单数“君王”。
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: 权贵
  rationale: 该希腊语借词指显贵、大人物；“权贵”在现代汉语中庄重自然。
- source_word: ϣⲥⲟⲟⲩⲛ ⲡⲙⲉ
  choice: 认识真理
  rationale: 动词范围包括知道、理解、辨认；“认识真理”保留较宽语义和原句的认知意味。
theological_decisions:
- issue: 柔软衣服之人的身份与不能认识真理者的范围
  choice: 以“身穿柔软衣服的人……而他们”衔接，不补充道德或宗教身份说明
  alternative: 明确解释为宫廷权贵或属世统治者不能认识真理
  rationale: 原文形成宫廷环境与认识真理之间的张力，但没有说明原因；译文不应把隐含批判发展成特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文的提示和强调语气；两个连续问句保持警策感。将“柔软衣服”直译以保存意象，宫廷地点则用自然的“府中”表达。所有脚注标记均置于相关正文之后。
