base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/096.yaml
  text: Jesus said[a], "The Father's kingdom is like a woman. She took a little leaven, hid it in dough, and made it into big loaves. Whoever has ears[c][b], let him hear."
translation:
  language: zh_hans
  text: 耶稣说：“父的国好比一个女人。她取了一点面酵[a]，把它藏在面团里，做成了大块的饼[b][c]。有耳朵的，就应当听！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “面酵”（ⲥⲓⲣ）指传统发面使用的酵种，并非现代商品干酵母。
    reason: cultural_note
  - marker: b
    text: “做成了大块的饼”也可理解为“做成了许多饼”或“做成了大量的饼”；原文既可能强调饼的大小，也可能强调数量。
    reason: lexical_alternative
  - marker: c
    text: 抄本 NHAM02.49 此处有若干字母残损或经校订者补足，但“一个女人……把它藏在面团里……做成了大块的饼”这一基本读法可靠。
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: 国
  rationale: 该词可指王权、统治或国度；在“父的国”这一固定宗教表达中译作“国”，既简洁自然，也不把动态的统治含义排除在外。
- source_word: ⲡⲉⲓⲱⲧ
  choice: 父
  rationale: 原文明确使用阳性的“父”，在《多马福音》中通常用来称呼上帝；直译可保留其称谓特征。
- source_word: ⲥϩⲓⲙⲉ
  choice: 女人
  rationale: 基本义为“女人”；上下文没有足够依据限定为“妻子”。
- source_word: ⲕⲟⲩⲓ ⲛⲥⲓⲣ
  choice: 一点面酵
  rationale: ⲕⲟⲩⲓ 在此表示少量，ⲥⲓⲣ 指传统发面所用的酵种；“一点面酵”符合现代汉语的烘焙语境。
- source_word: ϩⲱⲡ
  choice: 藏
  rationale: 保留“隐藏、藏起”的基本动作，不弱化为单纯的“拌入”。
- source_word: ϣⲱⲧⲉ
  choice: 面团
  rationale: 烘焙语境指已经调和、可容纳面酵的面团，比“面粉”更切合叙事动作。
- source_word: ⲉⲓⲣⲉ … ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ
  choice: 做成了大饼
  rationale: 保留结果结构及饼的具体形象；中文名词不强制标示单复数，也因此可容纳“大饼”“许多饼”或“大量饼食”之间的原文歧义。
- source_word: ⲙⲁⲁϫⲉ … ⲥⲱⲧⲙ
  choice: 有耳朵的，就应当听
  rationale: 采用简洁而庄重的劝听公式；“应当听”表达科普特语祈使式的号召语气。
theological_decisions:
- issue: “父的国”是领域、王权还是正在施行的统治
  choice: 父的国
  alternative: 父的王权／父的统治
  rationale: 原词本身容许“国度”与“王权”两方面含义。正文采用自然且传统的“父的国”，不在译文中把比喻限定为某一种神学解释。
- issue: 面酵在比喻中的象征意义
  choice: 仅译出面酵及其隐藏、扩展的动作，不加善恶评价
  alternative: 明说面酵象征败坏、隐秘成长或神国扩展
  rationale: 本句没有直接解释面酵的象征意义；翻译应保留比喻的开放性，不把其他经文或宗派解释带入正文。
translation_notes:
  register: 采用现代标准汉语，句式简洁、口吻庄重，保留格言式节奏。“父的国好比一个女人”紧贴原文，不改写成“父的国好比女人所做的事”，以免消解原比喻在语法上的张力。结尾用“有耳朵的，就应当听”传达劝诫语气，同时避免过度古雅。
