  terminology: “有福了”“恨”“迫害”均恰当。“位置／地点”作为对ⲧⲟⲡⲟⲥ与ⲙⲁ的谨慎区分可接受；脚注正确避免将前者的可能神学意味当作确定含义。脚注a妥善保存第三人称复数可作无人称被动的语法歧义，脚注c的平行经文说明不扩写正文。
