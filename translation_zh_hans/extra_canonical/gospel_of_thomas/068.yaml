base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/068.yaml
  text: Jesus said, “Blessed are you when they hate you and persecute you; and they will find no place in the place where they persecuted you.”
translation:
  language: zh_hans
  text: 耶稣说：“当他们恨你们、迫害你们时，你们有福了[a]；他们必在曾迫害你们的地点，找不到位置[b][c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一连串动词在科普特文中都用第三人称复数，直译为“他们恨你们、迫害你们……他们找不到”。这种形式也常作无人称被动，因此也可理解为：“你们被人憎恨、受迫害时，你们有福了；在你们受迫害的地方，必找不到位置。”
    reason: 语法歧义
  - marker: b
    text: “位置”和“地点”对应原文两个不同的词：前者是希腊语借词 ⲧⲟⲡⲟⲥ（topos），后者是科普特语本土词 ⲙⲁ（ma）。前者在《多马福音》中有时可能含有安息之所或立足之处的意味，但这里是否特指属灵意义并不确定。
    reason: 词汇区别与语义开放性
  - marker: c
    text: 参太5:11；路6:22。与这些对观福音经文不同，本句没有说明人受迫害是“因我”或“因人子”。
    reason: 交叉参考
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: 有福了
  rationale: 这是希腊语 μακάριος 的借词，用于福言；“有福了”既符合现代汉语圣经语体，也保留宣告性的语气。
- source_word: ⲙⲉⲥⲧⲉ-
  choice: 恨
  rationale: 直接表达科普特语动词“憎恨”的通常含义，不弱化敌意。
- source_word: ⲇⲓⲱⲕⲉ
  choice: 迫害
  rationale: 该希腊语借词在这里指敌意的追逼、迫害；“迫害”最符合福言语境。
- source_word: ϩⲉ ⲉ-
  choice: 找不到
  rationale: ϩⲉ 与介词 ⲉ- 组合表示“找到”；否定式自然译为“找不到”。
- source_word: ⲧⲟⲡⲟⲥ
  choice: 位置
  rationale: 原文使用希腊语借词 τόπος；译作“位置”与后面的本土科普特词 ⲙⲁ 略作区分，同时不在正文中断定它必有特定的属灵含义。
- source_word: ⲙⲁ
  choice: 地点
  rationale: 本土科普特词通常指地方、地点；在关系从句中译作“曾迫害你们的地点”自然清楚。
theological_decisions:
- issue: 连续第三人称复数形式应译为主动还是无人称被动
  choice: 采用主动表达：“他们恨你们、迫害你们……他们……找不到”
  alternative: “你们被人憎恨、受迫害时……在你们受迫害的地方，必找不到位置”
  rationale: 科普特语第三人称复数可以作无人称被动，但原文各分句始终使用第三人称复数。主动译法保留这一表层连贯性，以及迫害者最终“找不到位置”的反转；脚注同时保留被动理解。
- issue: 两个“地方”词是否赋予明确的属灵—物理对比
  choice: 正文以“位置／地点”区分，但不明言前者必指属灵立足之处
  alternative: 将 ⲧⲟⲡⲟⲥ 解释性地译为“属灵的立足之处”，将 ⲙⲁ 译为“实际地点”
  rationale: 两个源词确实不同，且 ⲧⲟⲡⲟⲥ 在《多马福音》中可能带有更深意涵；然而本句本身没有明确界定这种对比，因此应保存开放性，避免把一种神学解释写入正文。
- issue: 是否补入受迫害的基督论缘由
  choice: 不补入“因为我”或“因人子”等缘由
  alternative: 按对观福音平行经文补足受迫害的原因
  rationale: 现存科普特文本没有这类限定语；翻译不应依据平行经文扩写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们有福了”保留福言的宣告语气；末句用“地点／位置”呈现原文两个不同名词，又避免生硬重复。标点和句序按现代汉语调整，但保留原文主动主语及末句的悖论感。
