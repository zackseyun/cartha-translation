base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/112.yaml
  text: Jesus said[a], “Woe to the flesh that depends on the soul[c][b]; woe to the soul that depends on the flesh.”
translation:
  language: zh_hans
  text: 耶稣说：“那[c]依赖[a]魂的肉体有祸了；那依赖肉体的魂[b]有祸了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “依赖”也可译作“悬挂于……”或“倚靠”，后两种译法更能保留原词可能具有的具体意象。
    reason: lexical_alternative
  - marker: b
    text: “魂”（ⲯⲩⲭⲏ）也可指“生命”或“自我”；这里译作“魂”，是为了保留它与“肉体”的鲜明对举。
    reason: lexical_alternative
  - marker: c
    text: 抄本在两个分句中均使用阴性指示词 ⲧⲁⲉⲓ；校订本规范化为 ⲡⲁⲓ。这里的指示词近于“那……的”，其性别差异不影响句意。
    reason: dialect_note
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓ / ⲟⲩⲟⲓ
  choice: 有祸了
  rationale: 保留宣告灾祸的强烈语气，也符合现代汉语宗教文体；比“哀哉”更易为普通读者理解。
- source_word: ⲥⲁⲣⲝ
  choice: 肉体
  rationale: 保留希腊借词所表达的“肉体”概念，并维持本句与“魂”的鲜明对举；译作“身体”会削弱这种张力。
- source_word: ⲯⲩⲭⲏ
  choice: 魂
  rationale: 该词也可指“生命”或“自我”，但此处“魂”最能保留与“肉体”的尖锐对举；采用单音节也使两个分句结构紧凑而对称。
- source_word: ⲉⲧⲉⲣⲉⲉⲓϣⲉ (ⲉⲓϣⲉ)
  choice: 依赖
  rationale: 准确表达倚赖、依附关系，同时不把原词可能含有的“悬在……之上”或“靠在……之上”的具体意象强行写入正文。
- source_word: ⲡⲁⲓ / manuscript ⲧⲁⲉⲓ
  choice: 那……的
  rationale: 示指词在关系结构中语义较淡；汉语用“那……的”自然承载“那一个／那事物”的结构，而不额外强调性别。
- source_word: ⲛ
  choice: 对……有祸／依赖……
  rationale: 按其在两个结构中的功能分别以汉语句法表达：在灾祸宣告中标示对象，在动词后标示依赖对象。
theological_decisions:
- issue: 肉体与魂的关系
  choice: 保留双向灾祸宣告，不解释哪一方优越，也不把句子改写为特定的人论体系。
  alternative: 将其解释为贬抑肉体、推崇灵魂，或相反地强调灵魂必须具身。
  rationale: 原文以严格平行的两句同时指向肉体对魂的依赖和魂对肉体的依赖，形成有意的神学张力；译文不应替原文消解这种张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“有祸了”传达警告和灾祸宣告的力度，避免过于古雅的“祸哉”；两个分句保持镜像式结构。正文脚注统一置于全句之后，分别说明动词意象、ⲯⲩⲭⲏ 的语义范围和抄本的指示词形式。
