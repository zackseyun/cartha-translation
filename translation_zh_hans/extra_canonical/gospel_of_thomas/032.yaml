base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/032.yaml
  text: Jesus said[1], "A city built upon a high mountain and fortified cannot fall[3][2], nor will it be able to be hidden."
translation:
  language: zh_hans
  text: 耶稣说：“一座建在高山[a]上、坚固的城，不可能倒塌[b]，也将无法隐藏起来[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文残片《俄克喜林库斯纸草》1在这里作“在一座高山的顶上”（ἐπ’ ἄκρον ὄρους ὑψηλοῦ）；科普特文本没有“顶上”。
    reason: 文本异文
  - marker: b
    text: 参《马太福音》5:14。此处又有坚固的城“不可能倒塌”的意象，可与《马太福音》7:24—25中建在磐石上而不倒塌的房屋比较。
    reason: 交叉参照
  - marker: c
    text: 科普特文本在末句转用将来式；希腊文残片则在“倒塌”和“隐藏”两个动词上都用现在时。
    reason: 文本异文
lexical_decisions:
- source_word: ⲕⲱⲧ
  choice: 建在
  rationale: 原文用未限定名词后的环境式结构表达“人们建造它”，在汉语中自然转为修饰“城”的被动含义“建在”。
- source_word: ⲧⲟⲟⲩ
  choice: 山
  rationale: 该词可指山或山冈；此处受“高”修饰，译作“高山”最自然。
- source_word: ϫⲓⲥⲉ
  choice: 高
  rationale: 阳性状态式与阳性的“山”一致，说明山是高的，而非说明城坚固。
- source_word: ⲧⲁϫⲣⲟ
  choice: 坚固
  rationale: 阴性状态式与阴性的“城”一致，意为已经被加固、成为稳固；“坚固”既保留结果状态，也避免过度限定为军事设防。
- source_word: ϩⲉ
  choice: 倒塌
  rationale: 在“没有能力/不可能”的结构中指城倒下；汉语以“倒塌”准确表达建筑或城体的坍倒。
- source_word: ϩⲱⲡ
  choice: 隐藏起来
  rationale: 潜能结构表达不能隐藏或不能被隐藏；“隐藏起来”在汉语中可自然保留其语态上的开放性。
theological_decisions:
- issue: 是否按《马太福音》5:14调和
  choice: 保留“坚固”与“不可能倒塌”
  alternative: 只译作“建在山上的城是不能隐藏的”
  rationale: 科普特文本明确含有城坚固且不可能倒塌的内容，不应按较熟悉的正典平行句删减。
- issue: 末句的时态与语态
  choice: “也将无法隐藏起来”
  alternative: “也不能被隐藏”
  rationale: “将”反映科普特文本末句的将来式；“隐藏起来”避免在原文未明确标示被动时强行锁定语态，同时在汉语中仍自然表达城无法隐匿。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一座建在高山上、坚固的城”紧贴原文各修饰语的指向；“不可能”表达科普特语“没有能力”的不可能结构；末句保留将来意味及语态上的一定开放性。
