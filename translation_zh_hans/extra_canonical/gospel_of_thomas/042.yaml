  text: Jesus said[a], Become passers-by.
translation:
  language: zh_hans
  text: 耶稣说：“你们要成为过路人。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要成为经过的人”“要作旅人”“要作暂居的人”。原文动词是一个希腊语借词，意思是“经过、走过”。
    reason: 说明关键词的语义范围，并保留该格言可能包含的旅行、经过或短暂停留等不同意味。
lexical_decisions:
- source_word: ⲡⲉϫⲉ ⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 这是科普特文中引出话语的常用格式；采用简洁、庄重的现代汉语，保留《多马福音》反复出现的公式化开头。
- source_word: ϣⲱⲡⲉ
  choice: 要成为
  rationale: 该词通常表示“成为、形成”。在此句法结构中带有命令或劝告语气；“要成为”既保留原文的变化意味，也符合格言式表达。
- source_word: ⲡⲁⲣⲁⲅⲉ（与 ⲣ- 不定式结构连用）
  choice: 过路人
  rationale: 该希腊语借词的基本意思是“经过、走过”。“过路人”简洁地保留经过而不停驻的核心意象，又不把原文限定为某一种神学解释；“你们”体现原文复数受话者。
theological_decisions:
- issue: “经过”意象可能指实际旅行、短暂停留，或对世界不依恋
  choice: 正文仅译为“过路人”
  alternative: 旅人；暂居者；转瞬即逝的人
  rationale: 原句极其简短，未说明所经过的对象，也未明言其神学含义。正文保留这种开放性，不擅自补入“世界”、禁欲或人生无常等解释。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。保留原文格言式的突兀与开放性；以“你们”明确复数受话者。
