base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/088.yaml
  text: Jesus said[a], "The angels and the prophets will come to you, and they will give you what belongs to you. And you, in turn, give them what is in your hands, and say to yourselves[b], 'On what day will they come and take what is theirs?'"
translation:
  language: zh_hans
  text: 耶稣说：“众天使和众先知将到你们这里来，把属于你们的东西[a]给你们。你们也要把你们手中的东西[b]给他们，并对自己说：‘他们哪一天会来取走属于他们的呢？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你们拥有的那些东西。”
    reason: lexical_alternative
  - marker: b
    text: “你们”的科普特语后缀采用了本抄本所见的地方性（利科波利方言）形式，而不是标准萨希迪科普特语形式；这不改变“手中的”这一基本含义。
    reason: dialect_note
lexical_decisions:
- source_word: ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ
  choice: 属于你们的
  rationale: 科普特语以ⲟⲩⲛⲧⲁ=表达领有，直译近于“你们拥有的那些东西”。译作“属于你们的”，既自然，也与末句“属于他们的”（ⲡⲉⲧⲉⲡⲱⲟⲩ）形成对应。
- source_word: ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ
  choice: 手中的
  rationale: ⲛ̄ⲧⲟⲟⲧ=意为“在某人手中、由某人拿着”。保留“手中”的具体意象，不笼统处理为“你们所有的”。
- source_word: ϩⲱⲧ̂ⲧⲏⲩⲧⲛ̄
  choice: 也
  rationale: 该强调性代词在这里表示“你们这一方面也、轮到你们”，现代汉语以“也”简洁呈现双方相应的行动。
- source_word: ⲡⲉⲧⲉⲡⲱⲟⲩ
  choice: 属于他们的
  rationale: ⲡⲱⲟⲩ是独立物主代词“他们的”；译文保留其所指事物未明的特点。
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ϫⲟⲟⲥ ⲛⲏⲧⲛ̄
  choice: 并对自己说
  rationale: 介词短语ⲛⲏⲧⲛ̄在这里指向说话者自身，即“对你们自己说”；不改写为单纯的“说”，以保留反身意味。
theological_decisions:
- issue: 交换或归还之物的性质
  choice: 以“属于你们的”与“属于他们的”保持对应
  alternative: 译作“你们所有的”与“他们的东西”
  rationale: 原文建立了领属上的对应，却没有说明这些东西究竟是什么，也没有明说交换的神学机制。译文保留这种开放性，不把它解释成启示、灵魂、属天财宝或任何特定教义。
- issue: 来者的数目与身份
  choice: “众天使和众先知”
  alternative: “天使和先知”或单数“一个天使与众先知”
  rationale: 抄本的复数定冠词支持两组均为复数。用“众”明确呈现抄本形态，同时不进一步界定他们的角色。
- issue: 末句的时间期待
  choice: 保留直接疑问“他们哪一天会来……”
  alternative: 意译为“他们何时才会来……”
  rationale: 原文问“哪一天”，没有明确表达焦急、不耐或末世时间表；因此不添加“才”等语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文反复出现的领属关系以及“手中”的具体意象；“对自己说”维持反身结构。以“众天使和众先知”反映抄本中的复数标记，不依照有误的规范化单数形式。
