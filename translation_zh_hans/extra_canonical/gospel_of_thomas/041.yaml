base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/041.yaml
  text: Jesus said[a], “Whoever has something in his hand, they will give to him; and whoever does not have[f][e][d][c][b], they will take even the little that he has from him.”
translation:
  language: zh_hans
  text: 耶稣说：“凡手里有的，要给他；凡没有的，连他所有的那一点，也要从他那里拿走。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两处都用第三人称复数动词，可能是不定施事者的表达，直译近于“他们要给……／他们要拿走……”。这里按现代汉语习惯省略未指明的主语。另参可4:25；太13:12；路8:18；19:26。
    reason: 说明科普特文的非人称复数结构，并提供相关平行语句。
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 采用简洁的叙事过去表达，符合《多马福音》语录体的风格。
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ ϩⲛⲡⲉϥϭⲓϫ
  choice: 凡手里有的
  rationale: 保留“在他手里”这一源文特有的具体意象；汉语中“有的”自然承载未明说的所有物，不必擅自限定为某种事物。
- source_word: ⲛⲧⲟⲟⲩⲛⲁϯ ⲛⲁⲛⲧⲟϥ
  choice: 还要给他
  rationale: 第三人称复数在此作不定施事者；现代汉语可省略不明身份的主语，以“要给他”自然表达，同时不把施事者具体化。“还”体现进一步给予。
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲛⲧⲁⲛⲧⲟϥ
  choice: 凡没有的
  rationale: 直接表达否定所有结构，并保留“没有什么”的开放性。
- source_word: ⲡⲕⲉϣⲏⲙ ⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: 连他所有的那一点
  rationale: ϣⲏⲙ实体化后可指少量之物；译作“那一点”保留其简约和数量含混，且用“连……也”体现ⲕⲉ-的递进语气。
- source_word: ⲛⲧⲟⲟⲩⲛⲁϥⲓϥ ⲛ̄ⲧⲟⲟⲧϥ̄
  choice: 也要从他手中拿走
  rationale: ϥⲓ译作“拿走”，分离介词译作“从他手中”；与上半句同样不具体指明不定施事者。
theological_decisions:
- issue: “有”与“没有”所指为何
  choice: 不补明为知识、信仰、财富或启示
  alternative: 按某种神学解释补成“有悟性／有真理”等
  rationale: 源文没有说明所拥有或缺少的对象；保留含混可避免把特定宗派或诠释传统写入正文。
- issue: 给予和拿走的施事者
  choice: 以汉语无主句表达不定施事者
  alternative: 译为“人们要给他／人们要从他手中拿走”或被动式
  rationale: 科普特文第三人称复数可作非人称用法，并不确定具体施事者；汉语省略主语既自然，也保留这种未定性。
translation_notes:
  register: 采用现代、庄重而易懂的语录体。保留“手里／手中”的具体意象和“那一点”的语义含混；避免用“凡有的”造成把“有”误读为人物类别，也不添加源文未明说的神学对象。
