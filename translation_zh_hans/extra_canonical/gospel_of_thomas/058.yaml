base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/058.yaml
  text: Jesus said[a], "Blessed is the person who has labored[f][e][d][c][b]; he has found life."
translation:
  language: zh_hans
  text: 耶稣说：“有福[a]的是那经历过劳苦[b]的人[c]；他找到了生命[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福”所译的词也可表达“幸福”或“幸运”；这里采用传统而庄重的祝福语气。
    reason: lexical_alternative
  - marker: b
    text: “经历过劳苦”所译的动词兼有“劳作、辛苦、受苦、困苦”等含义；也可译作“受过苦”。
    reason: lexical_alternative
  - marker: c
    text: 原词泛指“人”或“一个人”，不专指男性。
    reason: lexical_alternative
  - marker: d
    text: 手稿写作 ⲁϥϩⲉ ⲁⲡⲱⲛϩ；校订文本将末语规范为 ⲉⲡⲱⲛϩ，即“找到了生命”。这里依据手稿中的普通第三人称单数形式译作“他”，不另加表示强调的“那人自己”。
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: 有福
  rationale: 这个源自希腊语 μακάριος 的借词用于宣告某人处于可称颂、蒙福的境况。“有福”保留庄重的祝福语气；“幸福”“幸运”虽属其语义范围，却较容易被理解为主观感受或偶然好运。
- source_word: ⲡⲣⲱⲙⲉ
  choice: 人
  rationale: 该词泛指一个人或人类个体，并不要求译成男性专称；现代汉语“人”自然、简洁，也保留单数个体的指向。
- source_word: ϩⲓⲥⲉ
  choice: 经历过劳苦
  rationale: 该动词可表示劳作、辛苦、受苦或受困扰。“经历过劳苦”兼顾付出劳力与承受苦难两面，不把原文限定为纯粹的工作或纯粹的受难。
- source_word: ϩⲉ
  choice: 找到了
  rationale: 手稿中的完成式 ⲁϥϩⲉ 表示已经发生并取得结果；“找到了”符合汉语表达，也保留发现生命这一简洁意象。
- source_word: ⲡⲱⲛϩ
  choice: 生命
  rationale: 定冠词在科普特语中可以具有泛指或抽象作用；汉语用不带指示限定的“生命”最自然，并避免擅自将其解释为某种特定教义术语。
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 这是《多马福音》语录常见的简洁引语格式；“耶稣说”准确而自然。
theological_decisions:
- issue: 劳苦与找到生命之间的关系
  choice: 保留并列陈述，不添加因果连接词
  alternative: 译作“因为他经历劳苦，所以找到了生命”
  rationale: 原文先宣告这样的人有福，继而说他找到了生命，但没有明示“因为”“所以”等因果关系。译文不替原文确定劳苦究竟是原因、条件、途径还是人物经历。
- issue: “生命”的含义
  choice: 直译为“生命”
  alternative: 解释为“永生”“真生命”或“救恩”
  rationale: 原文只说“生命”，没有附加限定；直译可保留其开放性和神学张力。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保持语录体的短促节奏。“经历过劳苦”有意涵盖劳作与受苦之间的词义张力。译文以手稿实际形式 ⲛ̄ⲧⲁϩϩⲓⲥⲉ／ⲁϥϩⲉ 为主要依据，不接受规范化文本中误析出的独立强调代词。
