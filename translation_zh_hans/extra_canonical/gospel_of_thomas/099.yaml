base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/099.yaml
  text: The disciples said to him[a], "Your brothers and your mother are standing outside." He said to them, "Those here who do the will of my Father—these are my brothers and my mother[f][e][d][c][b]. They are the ones who will enter the kingdom of my Father."
translation:
  language: zh_hans
  text: '**《多马福音》第99则**


    门徒对他说：“你的弟兄和母亲站在外面。[a]”他对他们说：“这里遵行我父旨意的人[b]，就是我的弟兄和母亲。他们将进入我父的国度[c]。”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 手稿字面还可译作“站在他们面前，在外面”；其中“在他们面前”与“在外面”并列显得冗余，故正文按自然汉语简译。
    reason: dialect_note
  - marker: b
    text: “旨意”所译的科普特词也可表示“愿望”或“意愿”。
    reason: lexical_alternative
  - marker: c
    text: “国度”所译的词由“王”派生而来；也可译作“王国”，在不同语境中可指王的统治。
    reason: lexical_alternative
  - marker: d
    text: 参可3:31–35；太12:46–50；路8:19–21。与这些相近记载相比，本则又明确说这些人将进入父的国度。
    reason: cross_reference
lexical_decisions:
- source_word: ⲥⲛⲏⲩ
  choice: 弟兄
  rationale: 该词在撒希底科普特语中通常指男性兄弟，也可能宽泛指同胞手足。“弟兄”既保留原文的男性复数形式，也符合本则关于家庭亲属的表达。
- source_word: ⲙⲁⲁⲩ
  choice: 母亲
  rationale: 这是“母亲”的标准称谓；保留单数。
- source_word: ⲥⲉⲁϩⲉⲣⲁⲧⲟⲩ ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: 站在外面
  rationale: 前半是表示处于站立状态的常用结构，后半表示外部位置；现代汉语自然地合译为“站在外面”。
- source_word: ⲡⲉⲓⲙⲁ
  choice: 这里
  rationale: 原词具有明确的指示意味，直指耶稣所在之处；“这里”简洁保留这一空间指向。
- source_word: ⲉⲓⲣⲉ ⲙ̄ⲡⲟⲩⲱϣ
  choice: 遵行……旨意
  rationale: 字面为“行……所愿”，在此语境中“遵行……旨意”既自然，又保留行动与父之意愿之间的关系。
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: 我父
  rationale: 严格保留第一人称单数所属关系，不泛化为“天父”或“神”。
- source_word: ⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: 进入
  rationale: 该组合表达“往里面去”；“进入”准确、简洁，且适合庄重叙述。
- source_word: ⲙⲛ̄ⲧⲉⲣⲟ
  choice: 国
  rationale: 该抽象名词源于“王”，可指王国、国度或王权统治。“国”承接汉语圣经传统，同时不在正文中强行限定为空间领域或动态统治。
theological_decisions:
- issue: 血缘家庭与遵行父旨意者之间的关系
  choice: 用“才是”表达原文指认和强调，但不增译为对血缘亲属的否定或弃绝
  alternative: 译作“就是”，或解释为“取代了我的家人”
  rationale: 原文把在场遵行父旨意的人认作耶稣的弟兄和母亲，并强调他们将进入父之国，却没有明确说明血缘亲属必然被排除。
- issue: “我父之国”的性质
  choice: 在正文保留“国”，脚注说明也可理解为国度或王权统治
  alternative: 直接译作“我父的统治”或“我父的王国”
  rationale: 科普特词兼具领域和统治层面的可能性；保留较宽的译法，避免预先化解其神学张力。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“门徒对他说”“站在外面”保持叙事简洁；“这里遵行我父旨意的人”保留原文的现场指示；两次使用“才是”呈现科普特语指示代词与强调结构，但避免添加原文没有的排他性解释。所有亲属称谓和“我父”的第一人称关系均予保留。
