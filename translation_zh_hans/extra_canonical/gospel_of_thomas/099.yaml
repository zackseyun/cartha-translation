revisions:
- from: '**《多马福音》第99则**


    门徒对他说：“你的弟兄和母亲站在外面。”他对他们说：“这里遵行我父旨意的人[a]，才是我的弟兄和母亲。他们才是要进入我父之国[b]的人。”[c]'
  to: '**《多马福音》第99则**


    门徒对他说：“你的弟兄和母亲站在外面。[a]”他对他们说：“这里遵行我父旨意的人[b]，就是我的弟兄和母亲。他们将进入我父的国度[c]。”[d]'
  rationale: 修订删除了会造成排他性推断的“才”，以“就是”和独立的将来陈述保留原文的指认与强调。补加手稿中不易自然纳入正文的“在他们面前”脚注，并调整“国度”及其说明，使其更贴近科普特抽象名词的语义范围。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:26:19Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了门徒的报告、在场者遵行“我父”旨意、亲属称谓，以及进入父之国的应许。可是两处“才是”在现代汉语中容易引入原文未明说的排他性（尤其“他们才是要进入……”）；科普特语在此是指认／强调，而非明确排除其他人。手稿中“站立”后尚有一个字面近于“在他们面前”的短语，虽可能冗余或有文本问题，宜以脚注保留其存在。
  naturalness: “你的弟兄和母亲站在外面”“这里遵行我父旨意的人”均清楚自然。将“我父之国”改作“我父的国度”更符合现代普通话，同时保留庄重语体；以“这些人就是……；他们将进入……”取代连续的“才是”，语义更准确、句法也更流畅。
  terminology: “弟兄”“母亲”“我父”“旨意”均恰当。“国度”比单用“国”更能在汉语中表达 ⲙⲛⲧⲣⲣⲟ 所指的 kingdom，且不把它定死为疆域或单纯统治。脚注应将其说明为由“王”派生的抽象名词，不宜断言其本身必然“兼有疆域与统治”的两个意义。
  issues:
  - severity: medium
    issue: 正文两次使用“才是”，尤其“他们才是要进入……的人”。
    rationale: 原文以指示／系词结构认定在场遵行父旨意者为耶稣的弟兄和母亲，并说“他们是将要进入……的人”。“才”通常带有“唯有／经过条件筛选后”的排他含义，超过原文可安全表达的程度。
  - severity: low
    issue: 未为手稿中的“在他们面前”成分设置脚注锚点。
    rationale: ⲉⲣⲁⲧⲟⲩ（与“站立”连用）在手稿中出现；其与“外面”并置显得冗余或不易处理。正文可依自然汉语简译，但应以脚注说明，避免无痕省略。
  - severity: low
    issue: “国”的脚注对词义的表述过度确定。
    rationale: ⲙⲛⲧⲣⲣⲟ 是由“王”构成的抽象名词；可译“国度／王国”，在语境中也可指王的统治，但不能仅据构词断言必然同时含有疆域与统治。
