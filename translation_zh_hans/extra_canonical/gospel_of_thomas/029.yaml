base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/029.yaml
  text: Jesus said[1], "If the flesh came into being because of the spirit, it is a wonder; but if the spirit came into being because of the body, it is a wonder of wonders[b][a][3][2]. Yet I myself marvel at how this great wealth has made its home in this poverty."
translation:
  language: zh_hans
  text: 耶稣说：“如果肉身是因灵而产生的，这是一件奇事；但如果灵是因身体而产生的，那更是奇中之奇。[a] 然而，我自己惊叹：这莫大的富足，怎么竟安居在这贫乏之中。[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奇”所译的科普特词在别处也可指“孩子”，但这里“奇中之奇”的结构是加强级表达，语境也支持“奇事”之意。
    reason: lexical_alternative
  - marker: b
    text: 手稿中相当于“怎么”的词末字母由编者补全；现存字迹及规范化读法支持这一还原。
    reason: lacuna_or_restoration
  - marker: c
    text: 《俄克喜林库斯纸草》第一号保存的希腊文平行见证也有“这贫乏”，与此处的科普特文相合。
    reason: cross_reference
lexical_decisions:
- source_word: ϣⲱⲡⲉ
  choice: 产生
  rationale: 此处指起源或形成，而非肉体出生；“产生”自然保留了存在论意味，也维持两个条件句的平行。
- source_word: ⲡⲥⲁⲣⲝ / ⲡⲥⲱⲙⲁ
  choice: 肉身 / 身体
  rationale: 原文有意使用两个不同词；分别译作“肉身”和“身体”，避免抹平二者的措辞差异。
- source_word: ⲡⲛⲉⲩⲙⲁ
  choice: 灵
  rationale: 与肉身、身体形成原文中的基本对举；不额外限定为“圣灵”或“灵魂”。
- source_word: ⲉⲧⲃⲉ
  choice: 因
  rationale: 保留原文的因果关系，同时使两个假设句简洁对称。
- source_word: ⲟⲩϣⲡⲏⲣⲉ / ⲟⲩϣⲡⲏⲣⲉ ⲛϣⲡⲏⲣⲉ
  choice: 一件奇事 / 奇中之奇
  rationale: 后一个短语是加强级表达；“奇中之奇”准确而自然，并保留与前句“奇事”的词根呼应。
- source_word: ⲇⲉ
  choice: 但
  rationale: 明确呈现第二个条件句与第一个条件句之间的转折，避免削弱原文的修辞结构。
- source_word: ⲁⲛⲟⲕ ϯⲣϣⲡⲏⲣⲉ
  choice: 我自己惊叹
  rationale: 手稿是独立代词加第一人称现在时形式，表示强调主语，并非代词重复；“我自己”自然体现强调。
- source_word: ⲡⲉⲓⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: 这莫大的富足
  rationale: 兼顾指示语、程度和财富这一抽象状态，并与末尾“这贫乏”构成鲜明悖论。
- source_word: ⲁⲥⲟⲩⲱϩ
  choice: 竟安居
  rationale: “安居”传达居住、落脚之意；“竟”在不改变命题内容的前提下表现说话者的惊叹。
- source_word: ⲡⲉⲓⲙⲛⲧϩⲏⲕⲉ
  choice: 这贫乏
  rationale: 保留抽象名词及指示语，与“这莫大的富足”相对；不擅自把它明说成身体。
theological_decisions:
- issue: 灵、肉身与身体之间的起源关系
  choice: 保留两个假设性的因果句，不判定哪一种关系为真
  alternative: 把其中一句解释成作者认可的灵肉起源论
  rationale: 原文以“如果……但如果……”并列两种惊奇情形，重点在悖论与惊叹；译文不应替原文消除这种张力。
- issue: “富足”与“贫乏”所指为何
  choice: 保留抽象隐喻，不在正文中明确指认
  alternative: 直接解释为灵住在身体中，或神性住在物质中
  rationale: 上下文可能使读者产生这些联想，但本句本身未明确给出唯一对应关系；保留开放性更忠于原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“肉身／身体”保存原文两个希腊借词的差别；以“奇事／奇中之奇／惊叹”尽量再现同根词的修辞呼应。标点突出两个条件句及结尾悖论，但不把“富足”和“贫乏”的隐喻对象解释进正文。
