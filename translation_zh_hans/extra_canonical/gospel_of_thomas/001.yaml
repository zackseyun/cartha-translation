base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/001.yaml
  text: And he said, "Whoever finds the interpretation[1] of these sayings[2] will not taste death[3]."
translation:
  language: zh_hans
  text: 他又说：“谁找到这些话的解释[a]，谁就不会尝到死亡[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “解释”也可译作“诠释”。原词是源自希腊语的借词，可指对这些话的解释或阐明。抄本这里的指示形式支持复数“这些话”，现存希腊文残片（POxy 654）也支持复数；规范化文本则作单数形式。
    reason: lexical_and_textual_note
  - marker: b
    text: “尝到死亡”是指“经历死亡”的习语；正文保留了原文的比喻说法。
    reason: cultural_note
lexical_decisions:
- source_word: ⲁⲩⲱ
  choice: 又
  rationale: 这里是连接前文并引出一句新言论的简短连词；汉语用“又”自然保留其承接作用。
- source_word: ⲡⲉϫⲉⲛⲧⲟϥ
  choice: 他说
  rationale: 这是普通的过去时叙事说话动词；译作“他说”简洁而庄重。
- source_word: ϫⲉ
  choice: 用冒号和引号引出直接引语
  rationale: 该词在此充当引语标记；现代汉语以标点表达最自然。
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁϩⲉ
  choice: 谁找到……谁就……
  rationale: 该关系结构表示泛指的人；汉语关联格式既保留泛指意味，也自然承接后面的代词复指。
- source_word: ⲛⲁϩⲉ
  choice: 找到
  rationale: 保留“寻找而得”的基本意义，也适合这里领会解释的语境。
- source_word: ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ
  choice: 解释
  rationale: 此希腊语借词可指解释或诠释；“解释”是普通现代读者易懂而又不过度限定的对应词。
- source_word: ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ / ⲛⲡⲉⲓϣⲁϫⲉ
  choice: 这些话
  rationale: 抄本形式及希腊文残片支持复数；“话”在汉语中可自然指一组言论，比“语录”少一层体裁解释。
- source_word: ⲛⲧⲟϥ
  choice: 谁就
  rationale: 独立第三人称阳性代词复指前面的泛指关系主语；汉语用“谁……谁就……”避免不必要的性别限定。
- source_word: ϥⲛⲁ
  choice: 就会
  rationale: 表达将来结果；“就”同时自然标示前后条件与结果的联系。
- source_word: ϫⲓϯ
  choice: 尝到
  rationale: 保留原文与“死亡”搭配的鲜明比喻，不直接释义为“经历”。
- source_word: ⲁⲛ
  choice: 不
  rationale: 准确表达动词结构中的否定。
- source_word: ⲛⲡⲙⲟⲩ
  choice: 死亡
  rationale: “死亡”与“尝到”搭配庄重，并保留原文抽象名词的表达。
theological_decisions:
- issue: “不会尝到死亡”的所指
  choice: 保留原文习语，不说明它特指肉身死亡、属灵死亡或终末命运
  alternative: 直接译成“不会经历死亡”或在正文中限定其神学含义
  rationale: 原文本身没有消除这里的神学张力；直译意象可避免把某一种解释写入正文。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留《多马福音》短句式言论的凝练感。用“这些话”而非较学术化的“这些语录”，并保留“尝到死亡”的陌生化意象。
