base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/013.yaml
  text: 'Jesus said to his disciples[a], "Compare me, and tell me whom I am like."

    Simon Peter said to him, "You are like a righteous angel."

    Matthew said to him, "You are like a human being—a philosopher, a man of understanding."

    Thomas said to him, "Teacher, my mouth will not be able at all to say whom you are like."

    Jesus said, "I am not your teacher, because you have drunk and you have become intoxicated from the bubbling spring that I myself have measured out."

    And he took him; he withdrew and spoke three sayings to him.

    When Thomas came to his companions, they asked him, "What did Jesus say to you?"

    Thomas said to them, "If I should tell you one of the sayings he spoke to me, you will pick up stones and throw them at me[j][i][h][g][f][e][d][c][b], and fire will come out of the stones and consume you."'
translation:
  language: zh_hans
  text: '耶稣对门徒说：“拿我作比较，告诉我，我像谁。”[a]


    西门·彼得对他说：“你像一位公义的天使。”


    马太对他说：“你像一个人——一位哲人，一个有智慧的人。”[b]


    多马对他说：“老师，我的口根本无法说出你像谁。”


    耶稣说：“我不是你的老师，因为你从那眼汩汩涌流的泉中喝了，并且醉了；那泉是我亲自量出的。”[c][d]


    耶稣带着多马退到一旁，对他说了三句言语。


    多马回到同伴那里时，他们问他：“耶稣对你说了什么？”


    多马对他们说：“他对我说的话中，我若告诉你们一句，你们就会拿起石头向我投掷；火会从石头中冒出来，并把你们烧尽。”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头“像”所对应的科普特文动词在抄本中有一处字母补写；这不造成实质性的句意疑问。
    reason: lacuna_or_restoration
  - marker: b
    text: “一个人——一位哲人，一个有智慧的人”较直地保留原文结构；也可意译为“一个有智慧的哲人”。
    reason: lexical_alternative
  - marker: c
    text: “汩汩涌流”所译的词带有拟声色彩，也可译作“潺潺流动”或“翻涌”。
    reason: lexical_alternative
  - marker: d
    text: “量出”也可理解为“量给、分出”，甚至可能带有“汲取”的意味。原文把这一动词用于泉，意象鲜明而略显奇特，译文予以保留。
    reason: lexical_alternative
  - marker: e
    text: 原文依次写“拿起石头”和“投向我”；随后火从石头中出来，形成对投石场景的反转。
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲉⲧⲟⲛⲧⲛⲁⲛⲟⲕ
  choice: 把我比一比
  rationale: 保留命令语气和“作比较”的核心含义，同时采用自然的现代汉语表达。
- source_word: ⲁⲅⲅⲉⲗⲟⲥ ⲛⲇⲓⲕⲁⲓⲟⲥ
  choice: 公义的天使
  rationale: 在此组合中指天上使者；“天使”比泛称“使者”更符合语境，“公义”保留宗教伦理色彩。
- source_word: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ
  choice: 一个人——一位哲人，一个有智慧的人
  rationale: 保留原文三个并列或同位成分，不压缩成单一的“智慧哲人”，也保留首项对“人”的强调。
- source_word: ⲡⲥⲁϩ
  choice: 老师
  rationale: 适合门徒对教导者的称呼，现代、庄重，且不额外引入制度化宗教头衔。
- source_word: ⲃⲣⲃⲣ
  choice: 汩汩涌流
  rationale: 该词具有拟声性质；“汩汩涌流”兼顾水声和流动感。
- source_word: ϣⲓⲛⲧⲟⲥ
  choice: 量出
  rationale: 保留“量取、分配”这一有意显得奇特的泉水意象，不将其解释性改写为“赐下”或“供应”。
- source_word: ⲛⲟⲩϫⲉ ⲉⲣⲟⲉⲓ
  choice: 砸我
  rationale: 明确译出原文在“拿起石头”之后另有“投向我”的动作；汉语用“拿起石头来砸我”自然完整。
theological_decisions:
- issue: “我不是你的老师”的悖论性陈述
  choice: 我不是你的老师
  alternative: 我不再是你的老师／我不仅是你的老师
  rationale: 原文直接否定师生关系，却未说明是时间变化还是超越关系；直译保留其神学张力，不替文本消解悖论。
- issue: 泉、醉酒与量出的隐喻
  choice: 保留饮泉、醉酒及由耶稣亲自量出的并置
  alternative: 解释为领受启示、圣灵或秘密知识
  rationale: 原文未明说泉水所象征的对象；避免导入特定教派或解释传统。
- issue: 石头出火的结局
  choice: 火却会从石头中冒出来，把你们烧尽
  alternative: 将火解释为神罚或多马话语的能力
  rationale: 文本只陈述反转性的火焰意象，不点明其神学机制或来源，译文因此不作解释性增补。
translation_notes:
  register: 采用现代标准普通话和简体中文，叙事简洁庄重。对话保持口语可懂度，同时保留“我的口”“我不是你的老师”“量出的泉”等原文刻意突出的身体意象、悖论和陌生感。人名采用通行汉译“西门·彼得、马太、多马”。
