base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/054.yaml
  text: Jesus said[a], “Blessed are the poor[f][e][d][c][b], for yours is the kingdom of the heavens.”
translation:
  language: zh_hans
  text: 耶稣说：“贫穷的人[a]有福了[b]，因为诸天之国[c][d]是你们的。”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本原文用复数“穷人”；规范化文本呈单数泛指。这里译作“贫穷的人”，表达群体意义。
    reason: textual_grammar_note
  - marker: b
    text: “有福了”也可译作“幸福”或“多么有福”；这里采用祝福宣告的传统表达。
    reason: lexical_alternative
  - marker: c
    text: “国”所译的词也可指“王权”或“统治”，重点可以落在君王的主权，而不只是一个领域。
    reason: lexical_alternative
  - marker: d
    text: 原文“天”为复数，所以译作“诸天”；不宜因此直接改成“神的国”。
    reason: source_form_note
  - marker: e
    text: 参路加福音6:20：“你们贫穷的人有福了，因为神的国是你们的”；也参马太福音5:3：“心灵贫穷的人有福了，因为天国是他们的。”本句在称呼、人称和修饰语上都与二者有所不同。
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 按科普特语常见的引语引入句直译；后面的 ϫⲉ 用中文引号体现，无须另译。
- source_word: ϩⲉⲛⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: 有福了
  rationale: 这是祝福宣告的固定表达，既保留评价与宗教语感，也比“快乐”更能传达此处的郑重语气。
- source_word: ⲛϩⲏⲕⲉ / ⲡϩⲏⲕⲉ
  choice: 贫穷的人
  rationale: 抄本原文为复数“穷人”，规范化文本以单数泛指；“贫穷的人”可自然涵盖这一群体意义，又不增添“心灵上”等原文没有的限定。
- source_word: ϫⲉ
  choice: 因为
  rationale: 第二个 ϫⲉ 引出这句福语的理由；“因为”清楚保留因果关系。
- source_word: ⲧⲱⲧⲛ
  choice: 你们的
  rationale: 这是第二人称复数独立代词；保留原文从泛称“贫穷的人”转为直接称呼“你们”的人称变化。
- source_word: ⲧⲙⲛⲧⲉⲣⲟ / ⲡⲙⲛⲧⲣⲣⲟ
  choice: 国
  rationale: 该词可指王权、统治或国度；在《多马福音》中也常指人可进入、发现或临到的现实，因此正文用自然且涵义较宽的“国”，脚注说明“王权／统治”的可能。
- source_word: ⲛⲙⲡⲏⲩⲉ / ⲛⲡⲡⲉ
  choice: 诸天
  rationale: 抄本形式明确为复数。“诸天”在简体中文中简洁而庄重，并保留其与单数“天”的差异。
theological_decisions:
- issue: “贫穷”是否应解释为属灵的贫穷
  choice: 不添加“心灵贫穷”等限定
  alternative: 心灵贫穷的人
  rationale: 现存科普特语只说贫穷的人；加入属灵限定会把《马太福音》5:3 的措辞带入本句，消解本句与平行传统之间的真实差异。
- issue: ⲙⲛⲧⲉⲣⲟ 的领域义与统治义
  choice: 正文译“国”，脚注保留“王权／统治”
  alternative: 王权；统治；国度
  rationale: “国”适合《多马福音》中该词既可作为统治、又可作为可进入或显现之现实的用法；脚注避免把其动态的君王统治含义排除在外。
- issue: 泛称穷人与第二人称复数之间的转换
  choice: 保留“贫穷的人……你们的”
  alternative: 你们贫穷的人……你们的；贫穷的人……他们的
  rationale: 原文前半泛称贫穷者，后半使用第二人称复数。保留这种转换，不将其整理成单一人称，可保存文本本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诸天之国”刻意保留科普特语的复数形式，虽比通常的“天国”略显古雅，却能避免抹平本句独特措辞。整句不补入“心灵上”，并保留“贫穷的人”与“你们”之间的人称转换。
