revisions:
- from: 耶稣说：“人若不恨自己的父亲和母亲，就不能作我的门徒；人若不恨自己的兄弟和姐妹，也不像我这样背负自己的十字架，就不配得我。”[a][b][c]
  to: 耶稣说：“人若不恨自己的父亲和母亲，就不能作我的门徒；人若不恨自己的兄弟和姐妹，也不像我这样背负自己的十字架，就不配与我相称。”[a][b][c]
  rationale: 仅作必要修订：以“不配与我相称”替换不自然且可能误导的“不配得我”，从而忠实传达“worthy of me”的关系性资格判断，又不将末句改写成“不配作我的门徒”。同时微调脚注a，使其对手稿与规范化文本之间的读法差异表述准确。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:09Z'
