base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/055.yaml
  text: Jesus said, "Whoever does not hate his father and his mother cannot be my disciple; and whoever does not hate his brothers and his sisters, and does not carry his cross as I do, will not be worthy of me."[a][b][c]
translation:
  language: zh_hans
  text: 耶稣说：“人若不恨自己的父亲和母亲，就不能作我的门徒；人若不恨自己的兄弟和姐妹，也不像我这样背负自己的十字架，就不配与我相称。”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 手稿作“兄弟……姐妹”；Dilley的规范化文本则列为“儿子……女儿”。本译文依手稿读法。
    reason: textual_variant
  - marker: b
    text: “像我这样”所译的科普特语短语也可理解为“按我的方式”。原文没有明确使用“跟从”一词。
    reason: dialect_note
  - marker: c
    text: 参路加福音14:26–27、马太福音10:37–38；这些经文含有相关主题，但《多马福音》此处的措辞有其自身特点。
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲟⲥⲧⲉ
  choice: 恨
  rationale: 科普特语所用动词语气强烈；保留其尖锐张力，不弱化为“少爱”或“看轻”
- source_word: ϣⲣⲙⲁⲑⲏⲧⲏⲥ
  choice: 作门徒
  rationale: 首句含可能性构式，译为“不能作我的门徒”，既合乎现代汉语，也保留与末句单纯将来／状态表达的区别。
- source_word: ⲉⲓⲱⲧ / ⲙⲁⲁⲩ
  choice: 父亲／母亲
  rationale: 直译常见亲属称谓。
- source_word: ⲥⲛⲏⲩ / ⲥⲱⲛⲉ
  choice: 兄弟／姐妹
  rationale: 依手稿实际读法及其成对结构翻译，不采用规范化词形分析所列的“儿子／女儿”。
- source_word: ϥⲓ
  choice: 背负
  rationale: 与“十字架”搭配时，“背负”自然且保留持续承受的意味；避免为迁就对观福音措辞而译作“拿起”。
- source_word: ⲥⲧⲁⲩⲣⲟⲥ
  choice: 十字架
  rationale: 这是源于希腊语的借词，此处标准义为“十字架”。
- source_word: ⲛⲡⲁϩⲉ
  choice: 像我这样
  rationale: 该短语可指“按我的方式／如我一般”；译作“像我这样”避免现代汉语“在我的路上”的空间性误解，也不擅自加入原文没有的“跟从”。
- source_word: ⲉⲓⲣⲉ ⲛⲁⲝⲓⲟⲥ
  choice: 配得
  rationale: 保留“与我相配／够资格属于我”的关系性表达，不改写为较抽象的“有资格”。
- source_word: ⲡⲉⲧⲉⲣⲉ…
  choice: 人若
  rationale: 以自然的现代汉语条件句传达不定关系结构的普遍、格言性语气。
theological_decisions:
- issue: “恨”亲属的强烈措辞
  choice: 直译为“恨”
  alternative: 少爱／爱得不如
  rationale: 源文明确使用强烈的“恨”字；其修辞或伦理张力不应由译者预先化解。
- issue: 背十字架与耶稣的关系
  choice: “像我这样背负”
  alternative: 背着十字架跟从我／在我的路上背负
  rationale: 源文没有明确的“跟从”动词；采用方式或类比表达，既保存与耶稣的关联，也不把平行经文的措辞移入本句。
- issue: 末句的资格表达
  choice: “不配得我”
  alternative: 不配作我的门徒
  rationale: 源文直指“对我／于我”而非再次明说“门徒”；保留其简洁和可能的关系性含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“恨”“十字架”“不配得我”等尖锐、凝练的格言式表达；用“人若”形成自然条件句。所有脚注标记均置于正文句末。
