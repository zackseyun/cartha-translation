base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/048.yaml
  text: Jesus said[a], "If two make peace with each other in this one house, they will say to the mountain[c][b], ‘Move away,’ and it will move."
translation:
  language: zh_hans
  text: 耶稣说：“如果两个人在这一所房子里[a]彼此和好[b]，他们就会对山说：‘挪开[c]！’山就会挪开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一所房子”也可译作“一个房子”“这同一所房子”；ⲟⲩⲱⲧ可表示“一、单一、同一”。
    reason: lexical_alternative
  - marker: b
    text: “彼此”所译的短语字面意思是“与他们的同伴”，在这里惯用于表达相互关系。
    reason: cultural_note
  - marker: c
    text: “挪开”中的ⲉⲃⲟⲗ有“向外、离开”的意味，也可译作“移开”或“挪出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ
  choice: 如果
  rationale: 这是前瞻性条件标记；在这句格言式陈述中译作“如果”，比“当……时”更能保留条件意味。
- source_word: ⲥⲛⲁⲩ
  choice: 两个人
  rationale: 原文是基数词“二”；依上下文补出量词和所指为人，使现代汉语自然清楚。
- source_word: ⲣⲉⲓⲣⲏⲛⲏ
  choice: 和好
  rationale: 该结构表达和平、和睦的状态或行动；“和好”既自然，也保留双方达成和睦的动态意味。
- source_word: ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ
  choice: 彼此
  rationale: 字面涉及“与他们的同伴”，但此处惯用作相互关系；“彼此”不把对象缩窄为朋友。
- source_word: ϩⲛ ⲡⲉⲓⲏⲓ ⲟⲩⲱⲧ
  choice: 在这一所房子里
  rationale: 保留指示词“这”和后置词ⲟⲩⲱⲧ的“一／单一／同一”意味，同时采用可理解的现代汉语表达。
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁϫⲱ ⲛⲧⲟⲥ ⲛⲡⲧⲟⲟⲩ
  choice: 他们就会对山说
  rationale: 原文为将来表达，并以代词复指受话对象；汉语不必重复代词，直译其句法功能为“对山说”。
- source_word: ϫⲉ ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: 挪开
  rationale: ⲡⲱⲱⲛⲉ表示移动，ⲉⲃⲟⲗ带有向外、离开的方向意味；“挪开”简洁保留二者。
- source_word: ⲛⲧⲟϥ ⲛⲁⲡⲱⲱⲛⲉ
  choice: 山就会挪开
  rationale: 原文以第三人称阳性单数代词指回“山”，并用将来式；汉语重复“山”可避免无生命代词造成含混。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留“这一所房子”略带标记的表达，以呈现原文“一／单一／同一”的开放性；命令句简短有力，不额外解释移山意象。
