  naturalness: 整体为自然、庄重的现代书面汉语。“这一所房子”在日常表达中略显标记，但这恰当反映原文ⲟⲩⲱⲧ所保留的“一／单一／同一”开放性；置于格言式话语中可以接受。“对山说”和重复“山”均清楚自然。
