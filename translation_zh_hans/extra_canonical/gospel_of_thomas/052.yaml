base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/052.yaml
  text: His disciples said to him[a], “Twenty-four prophets spoke in Israel, and they all spoke about you.” He said to them, “You have left out the living one who is in your presence[d][c][b], and you have spoken about the dead.”
translation:
  language: zh_hans
  text: 他的门徒对他说：“二十四位先知曾在以色列说过话，他们全都谈论过你[a]。”他对他们说：“你们撇下了在你们面前的活着的那一位[b]，却谈论死者[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处规范化文本读作“谈论你”（ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ）；抄本字形也可读作“在你心里”或“你的心”（ϩⲣⲁⲓ ⲛ̄ϩⲏⲧⲕ）。
    reason: textual_variant
  - marker: b
    text: “撇下”也可译作“遗漏”或“忽略”。
    reason: lexical_alternative
  - marker: c
    text: 原文“死者”为形式上的单数表达，也可能泛指已经死去的人；这里保留其含混性。
    reason: source_ambiguity
lexical_decisions:
- source_word: ϫⲟⲩⲧⲁϥⲧⲉ
  choice: 二十四
  rationale: 这是标准复合数词；用现代汉语通常形式，准确保留原文数目。
- source_word: ⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: 先知
  rationale: 这是希腊语借词在科普特语中的形式；“先知”是现代汉语宗教及历史语境中的通行对应词。
- source_word: ϣⲁϫⲉ
  choice: 说话／谈论
  rationale: 原词在两处重复，但宾语结构不同；前处译“说话”保留宣讲意味，末处译“谈论”使现代汉语自然，同时维持言说这一共同语义。
- source_word: ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ
  choice: 关乎你
  rationale: 依所给规范化文本理解为以“你”为话题；“关乎你”自然且保留指涉关系。抄本转写亦可能读作“在你心里／你的心”，故加注说明。
- source_word: ⲕⲱ
  choice: 撇下
  rationale: 该词在此可表示遗漏、忽略或撇下。“撇下”保留主动转离近在面前之人的语气，又不把意义限定为无意遗漏。
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: 永活者
  rationale: 原文是单数实体化关系结构，直指“活着的那一位”。“永活者”简洁庄重，但不额外明确其身份。
- source_word: ⲛⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  choice: 在你们面前
  rationale: 该习语表示“在……面前／当着……的面”；此译兼顾空间临在和当下在场。
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲟⲩ
  choice: 死者
  rationale: 原文形式为单数实体化结构，可指“死的那一位”，也可能具有类别性、集合性。“死者”在汉语中保留这种未完全限定的张力。
theological_decisions:
- issue: “永活者”的身份
  choice: 不在译文中明说是耶稣，只按单数结构译作“永活者”
  alternative: 译作“我这位活着的人”或直接补明“耶稣”
  rationale: 上下文很可能以说话者为所指，但原文没有显式第一人称或专名；不宜在翻译中替原文消除这种含蓄。
- issue: “死者”的单数与集合含义
  choice: 译作可兼具单称与类别含义的“死者”
  alternative: 译作“那些死去的人”或“那个死者”
  rationale: 原文是形式上的单数实体化关系结构，却可能泛指先知等已死之人；“死者”避免强行确定为严格单数或复数。
- issue: 活者与死者的对照
  choice: 保留尖锐对照，不解释为对先知或经书的全面否定
  alternative: 释译为“你们重视古代先知，却忽略我”
  rationale: 原文只陈述撇下眼前的活者、谈论死者；扩大为特定教义判断会超出文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“说话—谈论”和“永活者—死者”的修辞对照；不采用古奥句式，也不补入说话者身份或二十四位先知的象征解释。所有注脚标记均已置于正文相应位置。
