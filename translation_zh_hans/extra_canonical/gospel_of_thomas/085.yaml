base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/085.yaml
  text: Jesus said[1], "Adam came into being from a great power and a great wealth, and he did not become worthy of you. For had he been worthy[2], he would not have tasted death."
translation:
  language: zh_hans
  text: 耶稣说：“亚当由强大的力量和巨大的财富而生，却没有成为配得上你们的人。[a] 因为他若配得上你们，就不会尝到死亡的滋味。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本中“配得上”以及后文“就会尝到”的部分字母残缺；这里采用依据上下文、可用版面空间和残留字迹所作的通行复原。
    reason: textual_variant
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: 源自
  rationale: 该复合表达指产生、出现或起源；在“源自……能力和财富”的结构中，“源自”既自然，也保留来源关系，避免误译为出生。
- source_word: ⲟⲩⲛⲟϭ ⲛⲇⲩⲛⲁⲙⲓⲥ
  choice: 巨大的能力
  rationale: ⲟⲩ 是单数不定冠词，短语是单数的“一种/一个巨大的能力”，不是复数“诸能力”；中文不必强加量词。
- source_word: ⲟⲩⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: 丰盛的财富
  rationale: 抽象名词表示财富或富足；“丰盛的财富”传达原文“大”的程度，同时符合现代汉语表达。
- source_word: ⲙⲡϣⲁ / ⲁⲝⲓⲟⲥ
  choice: 配得上
  rationale: 两处词语均表达相配、够资格或堪当；译作“配得上”可自然带出宾语“你们”，并保持前后呼应。
- source_word: ϫⲓ ϯⲡⲉ ⲙⲡⲙⲟⲩ
  choice: 尝到死亡的滋味
  rationale: ϫⲓ ϯⲡⲉ 是“尝味”的惯用语，并非地点表达；中文以“尝到……的滋味”保留原有意象。
theological_decisions:
- issue: “没有成为配得上你们的人”所表达的关系
  choice: 保留“配得上你们”的直接比较
  alternative: 不配与你们相比
  rationale: 原文直接以第二人称复数为“配得上”的对象；不补入“地位”“荣耀”或其他神学解释。
- issue: 亚当与死亡之间的反事实条件
  choice: 译为“他若配得上，就不会尝到死亡的滋味”
  alternative: 他若是配得的，就不会经历死亡
  rationale: 原文构成过去反事实条件；中文条件句已自然表达未实现的情况，同时保留“尝死亡”的意象，不把它释义化为单纯“经历死亡”。
- issue: “能力”和“财富”的性质
  choice: 按抽象名词直译，不指定其为属灵、物质或宇宙论实体
  alternative: 大能和属灵的丰富
  rationale: 原文没有明说这些概念的具体性质，应保留其神学与宇宙论上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亚当源自……”比“亚当从……成为”自然；“却”清楚呈现前后反差。反事实条件不另加语法脚注，以免给普通读者造成不必要负担；唯一脚注说明抄本文本残缺。
