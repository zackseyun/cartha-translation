  rationale: 修订仅提升词义贴合度和现代汉语自然度：“强大的力量”较准确地涵盖ⲇⲩⲛⲁⲙⲓⲥ，“由……而生”保留“产生”的动态意义；第二人称复数、反事实条件和“尝死亡”的意象均保持不变。脚注改为更准确地说明复原依据。
