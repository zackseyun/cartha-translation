revisions:
- from: 耶稣说：“谁找到了世界[b]，并且富有了[a]，谁就该舍弃世界。”
  to: 耶稣说：“凡找到世界[b]、又变得富有[a]的人，都应当弃绝世界。”
  rationale: 修订仅调整汉语句法与词汇：以“凡……的人，都应当……”保留泛指关系结构及ⲙⲁⲣⲉ的劝令力量；以“变得富有”准确呈现结果性动词；以“弃绝”贴近ⲁⲣⲛⲁ。保留“世界”的重复、财富／显贵的词义歧义和手稿补字说明，未对“世界”作教义性解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:12Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现了“找到世界”“变得富有”以及随后弃绝世界的基本结构，也保留了两个“世界”的重复。然“谁……谁就该……”将原文的劝令式ⲙⲁⲣⲉ（“让……／应当让……”）改造成条件式陈述，语气略弱；宜明确保留劝令。
  naturalness: “谁找到了世界，并且富有了，谁就该舍弃世界”可理解，但“富有了”在此与前面的完成性结构略显口语且有歧义，容易被读作原本已经富有；“变得富有”更直接对应ⲣⲣⲙⲙⲁⲟ。以“凡找到世界、又变得富有的人，都应当弃绝世界”较为自然庄重。
  terminology: “耶稣”“世界”及“弃绝”均恰当。“弃绝”比“舍弃”更贴近ⲁⲣⲛⲁ的否认／弃绝语义，同时不将其限为单纯放弃财物。脚注保留“显贵”等词义可能性合宜；“大人物”稍口语，可改为“伟大／显贵”。
  issues:
  - severity: medium
    issue: 劝令式语气未充分保留
    rationale: 原文ⲙⲁⲣⲉ ⲛⲧⲟϥ为第三人称劝令／命令式。“谁就该”虽可表达规范性，却把句法重心转成条件性判断；“都应当”能较自然地维持劝令性质。
  - severity: low
    issue: “富有了”不如“变得富有”明确
    rationale: ⲣⲣⲙⲙⲁⲟ表达成为／变得富有（亦可为伟大、显贵）的结果状态。“变得富有”更清楚对应该变化义。
  - severity: low
    issue: “舍弃”可更贴近原词的弃绝义
    rationale: ⲁⲣⲛⲁ可意为否认、弃绝、放弃；“弃绝”较好保留主动拒斥的伦理力度，而不额外解释“世界”的内涵。
  revised_text: 耶稣说：“凡找到世界[b]、又变得富有[a]的人，都应当弃绝世界。”
  revised_footnotes:
