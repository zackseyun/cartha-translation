base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/110.yaml
  text: Jesus said, “Whoever has found the world[b] and become wealthy[a], let that one renounce the world.”
translation:
  language: zh_hans
  text: 耶稣说：“凡找到世界[b]、又变得富有[a]的人，都应当弃绝世界。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“变得伟大／显贵”；动词ⲣⲣⲙⲙⲁⲟ既可表示变得富有，也可表示变得伟大或显贵。
    reason: lexical_alternative
  - marker: b
    text: 手稿此处略有残缺；迪利据语法在第一个“世界”前补出介词[ⲙ̄]，不影响“世界”这一译法。
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 这是引入直接引语的固定表达；简洁直译保留本句凝练的语气。
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: 谁找到了
  rationale: 不定关系结构具有泛指作用，完成时态表示已经“找到”。
- source_word: ⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: 世界
  rationale: ⲕⲟⲥⲙⲟⲥ源自希腊语κόσμος；“世界”自然清楚，并保留原文未加解释的张力。
- source_word: ⲛ̄ⲧⲉⲛⲧⲟϥ ⲣⲣⲙⲙⲁⲟ
  choice: 并且富有了
  rationale: 该动词可表示变得富有或成为大人物；正文采用在伦理语境中较可能的“富有”，同时以脚注保留另一词义。
- source_word: ⲙⲁⲣⲉ ⲛⲧⲟϥ
  choice: 谁就该
  rationale: ⲙⲁⲣⲉ构成劝令或命令；用对应式“谁……谁就该……”自然表达其泛指和劝令力量。
- source_word: ⲁⲣⲛⲁ
  choice: 舍弃
  rationale: 该词可指否认、弃绝或放弃；“舍弃”在现代汉语中自然地表达对世界的主动弃绝，又不过度限定为口头否认。
- source_word: ⲛ/ⲙ ⲡⲕⲟⲥⲙⲟⲥ
  choice: 世界
  rationale: 再次译作“世界”，保留原文首尾重复；宾语介词的形式差异不影响译义。
theological_decisions:
- issue: “找到世界”与“舍弃世界”的含义
  choice: 不加解释，保留原文的悖论式张力
  alternative: 将“世界”解释为财富、世俗体系或物质领域
  rationale: 科普特文本本身没有明说“世界”的具体所指；正文不应导入特定宗派或禁欲主义解释。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。以“谁……谁就该……”再现泛指关系句和劝令语气；两次保留“世界”，维持原文的重复与张力。所有脚注标记均置于正文相应词语之后。
