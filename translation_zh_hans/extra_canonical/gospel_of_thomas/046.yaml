base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/046.yaml
  text: 'Jesus said[1], "From Adam until John the Baptist, among the offspring of women, there is no one higher than John the Baptist, so that his eyes will not be cast down. But I have said: whoever among you becomes a child will know the kingdom[4][3][2], and will become higher than John."'
translation:
  language: zh_hans
  text: '**《多马福音》第46则**


    耶稣说：“从亚当直到施洗者约翰，在妇人所生的人中，没有谁比施洗者约翰更高；因此，他的眼睛不会低垂。[a]但我曾说：你们中间凡成为小孩子的，[b]必认识那国度，[c]也必比约翰更高。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“使他的眼睛不被压下（或折下）”。这可能是说，约翰不必因面对比自己更高的人而垂下眼睛。原文“他的”在语法上指施洗者约翰。
    reason: 说明科普特语身体意象及代词所指，同时将语境解释保留为可能性。
  - marker: b
    text: “小孩子”所译的词也可译作“小的”“幼小者”或“小人物”。原文没有说明这里特别指纯真、谦卑或其他品格。
    reason: 保留关键词的词义范围及其神学开放性。
  - marker: c
    text: “国度”也可译作“王权”或“统治”。原文没有在这里明说“神的国”或“天国”。参见《马太福音》11:11和《路加福音》7:28；本则在措辞和后半句上与它们不同。
    reason: 说明 ⲙⲛⲧⲣⲣⲟ 的语义范围，并提供相关平行经文而不抹平差异。
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: 所生的人
  rationale: 该词指生育、出生或后裔；“在妇人所生的人中”既贴近科普特文结构，也符合自然、庄重的现代汉语。
- source_word: ϫⲟⲥⲉ / ϫⲓⲥⲉ
  choice: 更高
  rationale: 原文前后使用表示“高、升高”的同一词族；译作“更高”保留两处呼应，并避免擅自把空间性比喻完全解释为“更伟大”。
- source_word: ⲟⲩⲱϭⲡ（与 ⲃⲁⲗ 连用）
  choice: 眼睛不会低垂
  rationale: 动词本义涉及折断、压下；与“眼睛”连用时表达垂下眼睛。此译保留身体意象，同时使用自然汉语。
- source_word: ⲕⲟⲩⲉⲓ
  choice: 小孩子
  rationale: 该词可表示“小、幼小者、小孩子”。上下文将其名词化；“成为小孩子”通顺且保留其形象，脚注说明词义范围。
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: 那国
  rationale: 该词可指王权、统治或国度。正文采用简洁的“那国”，不擅自补入“神”或“天”，脚注保留词义张力。
- source_word: ⲁⲉⲓϫⲟⲟⲥ
  choice: 我曾说
  rationale: 手稿形式是完成时，宜译为“我曾说”或“我已经说过”，而不是现在时“我说”。
theological_decisions:
- issue: “成为小孩子”是否应解释为灵性谦卑、纯真或合一
  choice: 正文仅译“成为小孩子”
  alternative: 成为幼小者／成为小的／变得像孩子一样
  rationale: 原文本身没有明说这是谦卑、纯真或某种神秘合一；保留具体意象，避免把特定神学解释写入正文。
- issue: ⲙⲛⲧⲣⲣⲟ 的所指
  choice: 那国
  alternative: 王权／统治／国度／神的国
  rationale: 科普特词可涵盖王权与国度，且本句未明说“神的”或“天的”；译文不补足所指，以保存原文的开放性。
- issue: 约翰“眼睛不会低垂”的含义
  choice: 保留为身体意象，不在正文中解释原因
  alternative: 他不必向任何人低头
  rationale: 上下文可能表示约翰无须因遇见更高者而垂眼，但原文只陈述眼睛不低垂；解释放入脚注，避免正文过度释义。
translation_notes:
  register: 采用现代标准普通话的简体中文，语气庄重而易懂。保留“从亚当直到……”“妇人所生的人中”等带有古代格言色彩的表达；以“更高”贯穿前后两处比较。正文不补入“神”“天”或对“小孩子”的特定灵性解释，以保存原文的歧义与张力。
