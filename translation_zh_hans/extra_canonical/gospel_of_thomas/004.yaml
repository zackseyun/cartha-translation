base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/004.yaml
  text: Jesus said[1], "An old man in his days will not hesitate to ask a small child seven days old about the place of life, and he will live. For many who are first will become last[3][2], and they will become a single one."
translation:
  language: zh_hans
  text: 耶稣说：“一个上了年纪的人，在暮年时，不会迟疑去问一个刚出生七天的小孩[c]生命所在之处；他便会活。因为许多在先的将成为在后的[a]，他们将成为一者[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文残片 P.Oxy. 654 在这里还有“在后的成为在先的”；现存科普特正文没有这句话。参《马太福音》19:30、《马可福音》10:31及《路加福音》13:30。
    reason: 记录重要文本异文，并提示相近的对观福音格言。
  - marker: b
    text: “一者”直译原文“一个、单一”；也可译作“合而为一”，但原文没有说明这种单一或合一的具体性质。
    reason: 保留关键表达的语义开放性及神学张力。
  - marker: c
    text: 科普特文中“迟疑”（ϫⲛⲁⲩ）与“询问”（ϫⲛⲉ）近音，形成文字呼应，中文无法完全重现。
    reason: 说明原文在译文中难以保留的语音修辞。
lexical_decisions:
- source_word: ϫⲛⲁⲩ
  choice: 迟疑
  rationale: 该动词意为“迟疑、踌躇、耽搁”；希腊文残片 P.Oxy. 654 的 ἀποκνήσει 也支持“迟疑”，而不是“羞于”。
- source_word: ϫⲛⲉ（源自 ϫⲛⲟⲩ）
  choice: 询问
  rationale: 此处表示向人发问；与前面的 ϫⲛⲁⲩ 在科普特文中形成近音呼应。
- source_word: ⲡⲧⲟⲡⲟⲥ ⲛⲡⲱⲛϩ
  choice: 生命所在之处
  rationale: 保留“地方、所在”（ⲧⲟⲡⲟⲥ）这一空间意象，同时使现代汉语表达自然；不擅自解释为某种特定的属灵境界。
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: 单一者
  rationale: 保留该短语“一个、单一”的数词性和名词性，不将其弱化为一般性的“团结一致”，也不把它具体化为“同一个人”。
theological_decisions:
- issue: 结尾 ⲟⲩⲁ ⲟⲩⲱⲧ 所表达的合一或单一性
  choice: 他们将成为单一者
  alternative: 他们将合而为一／他们将成为一个
  rationale: “单一者”保留原文的凝练与开放性，既可表达成为一体，也不预先裁定其本体论或伦理意义。
- issue: “在先／在后”格言的范围
  choice: 按科普特文仅译“许多在先的将成为在后的”
  alternative: 补入“在后的将成为在先的”
  rationale: 现存科普特正文没有后一分句，因此不从希腊文残片或对观福音补入正文；异文另见脚注。
- issue: “他就会活”的所指
  choice: 保留第三人称单数“他”
  alternative: 明确解释为老人或孩子将活
  rationale: 原文的代词在语境中通常回指年老人，但不宜在译文中加入原文没有的解释性名词，以免消除潜在张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“出生才七天的小孩”准确表达年龄，并避免较古旧的“七日婴孩”；“在有生之日”传达 ϩⲛ̄ⲛⲉϥϩⲟⲟⲩ 的时间意味而不过度重复“年老”。正文保持格言式的简洁和陌生感，不用解释性改写消除其悖论。
