revisions:
- from: 耶稣说：“年老的人在有生之日，不会迟疑向一个出生才七天的小孩询问[c]生命所在之处，他就会活。因为许多在先的将成为在后的[a]，他们将成为单一者[b]。”
  to: 耶稣说：“一个上了年纪的人，在暮年时，不会迟疑去问一个刚出生七天的小孩[c]生命所在之处；他便会活。因为许多在先的将成为在后的[a]，他们将成为一者[b]。”
  rationale: 修订仅处理两处汉语表达：以“在暮年时”自然且准确地表达年老者“在其年日”的语境；以“一者”替换较生硬的“单一者”，同时保留原文关于成为“一、单一”的简洁和未定性。其余正文与脚注均忠实反映科普特文本及希腊残片的异文状况。
