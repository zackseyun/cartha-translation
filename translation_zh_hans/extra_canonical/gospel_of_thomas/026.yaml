base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/026.yaml
  text: Jesus said, “The splinter that is in your brother’s eye, you see it; but the beam that is in your own eye, you do not see it. When you take the beam out of your own eye, then you will see clearly to take the splinter out of your brother’s eye.”
translation:
  language: zh_hans
  text: 耶稣说：“你弟兄眼里的木刺，你看得见；你自己眼里的房梁，你却看不见。等你把自己眼里的房梁取出来，那时你就能看清楚，好把你弟兄眼里的木刺取出来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡϫⲏ
  choice: 木刺
  rationale: 指一小片木头；“木刺”既保留木质意象，也与“房梁”形成鲜明的大小对比，避免受对观福音传统措辞影响而泛化为“微尘”。
- source_word: ⲡⲥⲟⲓ
  choice: 房梁
  rationale: 该词具体指建筑结构中的梁；“房梁”在现代汉语中自然清楚，并保留建筑意象，不译作偏向原木意象的“木头”。
- source_word: ⲛⲟⲩϫⲉ
  choice: 取出来
  rationale: 此动词可表示扔出、逐出或除去；在从眼中除去异物的语境里，“取出来”自然贴切，同时适用于房梁和木刺。
- source_word: ⲛⲁⲩ ⲉⲃⲟⲗ
  choice: 看清楚
  rationale: 字面近于“向外看见”，在这里表达视力恢复清楚的惯用含义；“看清楚”也保留前后“看见／看不见”的推进。
- source_word: ⲥⲟⲛ
  choice: 弟兄
  rationale: 原词在词汇上是阳性的“兄弟”，在本语境中也可能指同伴或同门；正文保留关系称谓，不将其解释性改译为“同伴”。
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_
  choice: 等你……那时
  rationale: 该结构引出带将来或条件色彩的时间从句；“等你……那时”自然表达先后关系，又不额外限定为一次性或反复发生。
- source_word: ⲃⲁⲗ
  choice: 眼
  rationale: 标准身体部位用词；译作“眼”简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的口语化书面语。开头两句保留科普特语的主题前置结构，以“你弟兄眼里的木刺，你看得见”对应名词短语前置后接回指成分的句法。以“却”呈现对比，以“等你……那时”清楚表达行动次序。未添加“假冒为善的人”等平行经文中的称呼，也未将“弟兄”解释性扩展为特定宗教群体。
