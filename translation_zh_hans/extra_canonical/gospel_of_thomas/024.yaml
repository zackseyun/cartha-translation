revisions:
- from: 他的门徒对他说：“请指给我们看，你所在的地方，因为我们必须寻找它。”他对他们说：“有耳朵的，就应当听。[a]光存在于光明之人里面，[b]他照亮整个世界；他若不发光，就是黑暗。”[c]
