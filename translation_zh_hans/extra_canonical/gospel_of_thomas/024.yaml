base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/024.yaml
  text: His disciples said[1], "Show us the place where you are, for it is necessary for us to seek it." He said to them, "Whoever has ears, let him hear.[1] There is light within a man of light,[2] and he lights the whole world.[3] When he does not shine[a][e][4][3][2], there is darkness."[4]
translation:
  language: zh_hans
  text: 他的门徒对他说：“请指给我们看，你所在的地方，因为我们必须寻找它。”他对他们说：“有耳朵的，就应当听。[a]光存在于光明之人里面，[b]他照亮整个世界；他若不发光，便有黑暗。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有耳朵的”按科普特语字面为“有耳朵与他同在的人”，这是表示拥有的惯用说法。
    reason: 说明源语言习语。
  - marker: b
    text: 科普特文本是陈述句：“光存在于光明之人里面。”希腊残片则作条件句：“光明之人里面若有光……”。科普特文本以下句的“他”即光明之人为主语；希腊残片则以“光”为主语。
    reason: 记录科普特正文与 POxy 655 希腊见证的文本及语法差异。
  - marker: c
    text: 科普特文本直译可作：“他若不发光，便是／有黑暗。”希腊残片通常复原为：“它若不存在，世界就在黑暗里。”
    reason: 保留末句主语和所指的不确定性，并说明希腊见证差异。
lexical_decisions:
- source_word: ϯⲧⲥⲉⲃⲟⲁⲛⲟⲛ
  choice: 请指给我们看
  rationale: 该使役表达可指“使我们知道、指示我们”；在询问地点的语境中，“指给我们看”自然且具体。
- source_word: ⲧⲟⲡⲟⲥ ⲉⲧⲉⲣⲉⲛⲧⲟⲕⲙⲙⲁⲩ
  choice: 你所在的地方
  rationale: 保留 τόπος 的“地方”义，并将地点关系从句译为现代汉语常用的“所在”。
- source_word: ⲡⲉⲓⲡⲁⲛⲁⲅⲕⲏ ⲉⲁⲛⲟⲛ ⲡⲉ
  choice: 我们必须
  rationale: 以简洁自然的汉语表达非人称必要性，不额外强化为外在强迫。
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲛⲧⲟϥ
  choice: 寻找它
  rationale: 准确传达“寻求、寻找”及其代词宾语，并保留“地方”作为所指的表层语义。
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛ ⲙⲁⲁϫⲉ ⲙⲙⲟϥ ⲙⲁⲣⲉϥ ⲥⲱⲧⲙ
  choice: 有耳朵的，就应当听
  rationale: 用庄重而通顺的汉语再现惯用的劝听公式；科普特语字面的“耳朵与他同在”属于所有结构，不宜机械直译。
- source_word: ⲟⲩⲛⲟⲩⲟⲉⲓⲛ ϣⲟⲟⲡ ⲙ̄ⲫⲟⲩⲛ
  choice: 光存在于……里面
  rationale: 体现科普特语存在陈述的性质，同时避免将其改写成希腊残片所见的条件句。
- source_word: ⲟⲩⲣ̄ⲙ̄ⲟⲩⲟⲉⲓⲛ
  choice: 光明之人
  rationale: 保留“人—光”的属格式组合及《多马福音》特有的凝练语气；比“发光的人”较少预先限定其含义。
- source_word: ϥⲣ̄ⲟⲩⲟⲉⲓⲛ ⲉⲡⲕⲟⲥⲙⲟⲥ ⲧⲏⲣϥ
  choice: 他照亮整个世界
  rationale: 按科普特文本以“光明之人”为主语，而非改以“光”为主语；κόσμος 译作“世界”。
- source_word: ⲉϥⲧⲙ̄ⲣ̄ⲟⲩⲟⲉⲓⲛ ⲟⲩⲕⲁⲕⲉ ⲡⲉ
  choice: 他若不发光，就是黑暗
  rationale: 保留否定条件及末句简短的系词判断；“就是黑暗”的主语在原文中并未明说，中文也不擅自补定。
theological_decisions:
- issue: 里面的光与光明之人的关系
  choice: 光存在于光明之人里面
  alternative: 光明之人里面若有光
  rationale: 科普特见证为陈述式存在句；不以希腊残片的条件式取代正文。
- issue: 照亮世界的主语
  choice: 他照亮整个世界
  alternative: 它照亮整个世界
  rationale: 科普特语以该人为语法主语；脚注说明希腊见证以光为主语，避免无提示地调和文本。
- issue: 末句“黑暗”的所指
  choice: 就是黑暗
  alternative: 世界就在黑暗里
  rationale: 原句未明确补出“世界”作为主语或处所，故保留其简约和指涉张力。
translation_notes:
  register: 采用现代、庄重、可朗读的简体中文。“光明之人”有意保留原文略显陌生的表达；正文紧凑，重要的见证差异集中放入脚注。
