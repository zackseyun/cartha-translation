base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/080.yaml
  text: Jesus said[a], “Whoever has come to know the world has found the body; and whoever has found the body[e][d][c][b], the world is not worthy of him.”
translation:
  language: zh_hans
  text: 耶稣说：“凡认识了世界的人，就找到了身体；凡找到了身体的人，世界配不上他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 这是《多马福音》中引出耶稣言论的惯用叙事公式；用现代汉语过去时语境中自然的“说”即可。
- source_word: ⲡⲉⲧⲉⲣⲉ…ⲥⲟⲟⲩⲛ
  choice: 凡认识了……的
  rationale: 关系式完成结构表达已经实现的认识；“认识了”既保留完成意味，也不额外解释这种认识的性质。
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: 世界
  rationale: 该希腊语借词可指宇宙秩序或人所处的世界；“世界”自然且保留其语义幅度。
- source_word: ϩⲉ ⲉ
  choice: 找到了
  rationale: 核心义为“找到”；其后的介词反映抄本中的方言或书写用法，不必在译文中另作表达。
- source_word: ⲡⲥⲱⲙⲁ
  choice: 身体
  rationale: 此处使用源自希腊语 σῶμα 的借词，基本义为“身体”。译作“身体”也保留了本句与第56则所用“尸体”一词之间的词汇差别；原文两次均带定冠词，汉语在此无需机械添加“这/那”。
- source_word: ⲙⲡϣⲁ … ⲛⲛⲧⲟϥ ⲁⲛ
  choice: 配不上他
  rationale: 直陈世界“不配得/不值得”此人；“配不上他”是自然、凝练的现代汉语，并保留价值判断的反转。
- source_word: ⲇⲉ
  choice: ；
  rationale: 该连接词可作“而、但、又”；上下两句是递进式平行关系，用分号连接可避免强加明确转折。
theological_decisions:
- issue: “身体”与“世界”的关系
  choice: 不解释“身体”究竟象征什么，也不把“认识”专门化为宗教奥秘知识
  alternative: 将身体解释为尸体、物质世界或灵知意义上的象征
  rationale: 原句本身具有格言式张力，未明说身体的象征含义；译文应保留这种开放性。
- issue: “世界配不上他”的指代与价值判断
  choice: 保留阳性单数代词所指的那位找到身体的人
  alternative: 泛化为“这样的人”或解释为超越世界者
  rationale: 原文直接使用单数代词补语；不应在正文中补入其为何高于世界的神学解释。
translation_notes:
  register: 采用简洁、庄重而口语可懂的现代标准汉语。两句保持平行结构，以“认识了—找到了—配不上”呈现原文的格言力度；不以“尸体”调和第56则，也不添加原文没有的象征阐释。
