base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/075.yaml
  text: Jesus said[a], “Many are standing at the door[e][d][c][b], but it is the solitary ones who will enter into the place of the bridal chamber.”
translation:
  language: zh_hans
  text: 耶稣说：“许多人站在门口[a]，但将要进入婚房所在之地[c]的，是那些独处者[b][d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特语的惯用说法字面为“用他们的脚站立”；这里按自然汉语译作“站”。
    reason: dialect_note
  - marker: b
    text: “独处者”（ⲙⲟⲛⲁⲭⲟⲥ，源于希腊语 μονάχος）可指独处或单一的人，后期也可指“修士”。这里保留“独处、单一”的语义，不把它限定为制度化的修士身份。
    reason: lexical_alternative
  - marker: c
    text: 原文是“婚房所在之地”（ⲡⲙⲁ ⲛϣⲉⲗⲉⲉⲧ），并非只写“婚房”；正文保留“所在之地”。
    reason: lexical_alternative
  - marker: d
    text: 抄本作复数：“那些独处者，就是将要进入的人”；所给规范化文本作单数：“那个独处者，就是将要进入的人”。正文依抄本采用复数。
    reason: textual_variant
lexical_decisions:
- source_word: ⲟⲩⲛϩⲁϩ
  choice: 许多人
  rationale: 这是存在句，表示“有许多人”；汉语无需直译出“有”，置于句首即可自然保留其强调。
- source_word: ⲱϩⲉⲣⲁⲧⲛⲧⲟⲟⲩ
  choice: 站
  rationale: 科普特语字面为“用他们的脚站立”，是表示“站立”的惯用说法；正文采用自然汉语，并以脚注说明。
- source_word: ϩⲓⲣⲛⲡⲣⲟ
  choice: 在门口
  rationale: 介词结构表示在门边、门前；“在门口”简洁自然，也保留空间关系。
- source_word: ⲁⲗⲗⲁ
  choice: 但
  rationale: 保留原文鲜明的转折对照。
- source_word: ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ
  choice: 那些独一的人
  rationale: 该词源于希腊语 μονάχος，可指独处、单一的人，后期也可指修士。“独一的人”既避免把后期制度化的“修士”含义倒置于文本，又保留《多马福音》中单一、合一与独处之间的语义张力。依手稿的复数冠词译作“那些……的人”。
- source_word: ⲛⲉⲧⲛⲁⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: 将要进入的
  rationale: 手稿采用复数关系形式和将来表达；汉语以“将要进入的”构成判断焦点句，体现“正是这些人将进入”的辨识作用。
- source_word: ⲡⲙⲁ ⲛ̄ϣⲉⲗⲉⲉⲧ
  choice: 新房所在之处
  rationale: 原文明确含“地方、所在”（ⲙⲁ），并非只写“新房”；此译保留该成分，同时用现代汉语自然表达婚礼新房。
theological_decisions:
- issue: “独一的人”是否应解释为修士、独身者或内在合一者
  choice: 正文保留“独一的人”的开放表达
  alternative: 修士；独居者；成为一体的人
  rationale: 原词具有“独处、单一”并可发展为“修士”的语义范围；本句本身没有足够信息限定为制度化修道身份、婚姻状态或特定神秘主义观念，因此不在正文中排除其真实歧义。
- issue: 进入“新房所在之处”的意象
  choice: 保留婚礼空间意象，不加解释
  alternative: 明确解释为救恩、天国、神秘婚姻或某种礼仪
  rationale: 原文只陈述进入该处，没有界定其神学所指；直译意象可避免把某一教派或解释传统写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“将要进入……的，是……”保留科普特语焦点判断结构；不增添原文没有明说的“只有”，但借“但”与判断句呈现鲜明对照。标点和代词遵循现代汉语习惯。
