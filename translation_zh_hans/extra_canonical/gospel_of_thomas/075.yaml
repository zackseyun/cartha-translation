revisions:
- from: 耶稣说：“许多人站在门口[a]，但将要进入新房所在之处[c]的，是那些独一的人[b][d]。”
  to: 耶稣说：“许多人站在门口[a]，但将要进入婚房所在之地[c]的，是那些独处者[b][d]。”
  rationale: 修订仅澄清两个汉语词义：“独处者”比“独一的人”更忠实而自然地保留μονάχος的开放语义，“婚房”比“新房”更贴近bride-chamber。保留抄本复数、原文明确的“地方”成分、将来进入的表达及对比性焦点句；未增添“只有”或任何特定神学解释。
