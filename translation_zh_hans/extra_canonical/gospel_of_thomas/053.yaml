revisions:
- from: 他的门徒对他说：“割礼有益处吗，还是没有？”他对他们说：“如果割礼有益处，他们的父亲就会使他们从母腹出生时已经受了割礼。[a]然而，在灵里的真割礼，却完全有益。[b][c]”
  to: 他的门徒对他说：“割礼有益处吗，还是没有？”他对他们说：“如果割礼有益处，他们的父亲本会使他们从母亲腹中生来就受了割礼。[a]然而，在灵里的真割礼，已经成为全然有益的。[b][c]”
  rationale: 修订仅处理两项安全且必要的对应问题：将父亲的生育动作恢复为直接施事的中文表达，并在末句体现完成式的状态变化。保留“灵”的非专名化、“真割礼”的歧义及身体割礼与真割礼之间未经扩展的对照。
