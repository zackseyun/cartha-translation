base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/053.yaml
  text: His disciples said to him[1], “Does circumcision benefit or not?” He said to them, “If it were beneficial, their father would beget them circumcised from their mother. Rather[6][5][4][3][2], the circumcision of truth in spirit has become entirely profitable.”
translation:
  language: zh_hans
  text: 他的门徒对他说：“割礼有益处吗，还是没有？”他对他们说：“如果割礼有益处，他们的父亲本会使他们从母亲腹中生来就受了割礼。[a]然而，在灵里的真割礼，已经成为全然有益的。[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以“他们的父亲”为“生出他们”的主语，并说他们“从他们的母亲”而出，且处于受割礼的状态。这里使用非现实条件：若割礼有益，本会如此。
    reason: 说明父亲作主语、母亲表示来源的特殊表达，并显明非现实条件。
  - marker: b
    text: “真割礼”也可按字面译作“真理的割礼”。
    reason: 保留 ⲡⲥⲃⲃⲉ ⲛⲙⲉ 可作属性修饰、也可按属格理解的歧义。
  - marker: c
    text: “全然有益的”承接前文“有益处”；原文末语强调全然、完全，而“有益”由上下文补明。可参概念上相关的《罗马书》2:29和《腓立比书》3:3。
    reason: 交代末句的语境补足，并将相关经文限定为概念参照。
lexical_decisions:
- source_word: ⲡⲥⲃⲃⲉ
  choice: 割礼
  rationale: 这是表示礼仪性割礼的标准科普特语词；上下文也明确以出生时身体是否受割礼为对照。
- source_word: ⲣⲱⲫⲉⲗⲉⲓ
  choice: 有益处
  rationale: 该词借自希腊语 ὠφελεῖν，表示有益、有用；译作“有益处”自然，并保留首尾呼应。
- source_word: ⲛⲉⲣⲉ…ⲣⲱⲫⲉⲗⲉⲓ
  choice: 如果割礼有益处
  rationale: ⲛⲉⲣⲉ 加不定式构成非现实条件；汉语以“如果……，就会……”结合后句表达反事实意味。
- source_word: ϫⲡⲟⲛ
  choice: 使……出生
  rationale: 原词可指“生育、生出”，且主语明确是“他们的父亲”；中文直译为“生他们”容易生硬，故以使役式保留父亲为施事，同时自然表达出生。
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲡⲉⲩⲙⲁⲁⲩ
  choice: 从母腹出生时
  rationale: 该结构表示来源，即“从他们的母亲出来”；“从母腹出生时”在现代汉语中自然，并明确出生场景。
- source_word: ⲉⲣⲉⲛⲧⲟⲟⲩ ⲥⲃⲃⲉ
  choice: 已经受了割礼
  rationale: 此谓语结构描述他们出生时所处的状态；“已经受了割礼”清楚表达该同时状态。
- source_word: ⲁⲗⲗⲁ
  choice: 然而
  rationale: 该借词引入纠正性的强烈对照；“然而”兼具庄重与自然。
- source_word: ⲡⲥⲃⲃⲉ ⲛⲙⲉ
  choice: 真割礼
  rationale: 字面可作“真理的割礼”，也可把属格理解为属性修饰，即“真正的割礼”；正文采用较自然的“真割礼”，脚注保留字面可能。
- source_word: ϩⲛ ⲡⲛⲉⲩⲙⲁ
  choice: 在灵里
  rationale: ⲡⲛⲉⲩⲙⲁ 可指灵或圣灵，文本本身未明确限定；用“灵”而不加“圣”以保留歧义。
- source_word: ⲁϥϭⲛ̄ϩⲏⲩ ⲧⲏⲣϥ
  choice: 完全有益
  rationale: 末句包含完全、全然之意，并从前文承接“有益”；译文补出语境中省略的“有益”，同时保留程度的完整性。
theological_decisions:
- issue: “在灵里”是否明确指圣灵
  choice: 在灵里
  alternative: 在圣灵里
  rationale: 原文没有足以排除普通“灵”之义的限定；不将其专名化，可避免预先作出三一论式解释。
- issue: 身体割礼与“真割礼”的关系
  choice: 保留“然而”的对照，不增译为废除或谴责身体割礼
  alternative: 唯有属灵的割礼才有效
  rationale: 原文提出益处的对照，却没有明说律法废止、圣约身份或得救条件；译文不替文本解决其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“母腹”保持经文语体但不古奥；“有益处／完全有益”形成清晰首尾呼应。正文避免用“属灵割礼”等解释性较强的术语，以保留原文“在灵里的真割礼”的结构和神学开放性。
