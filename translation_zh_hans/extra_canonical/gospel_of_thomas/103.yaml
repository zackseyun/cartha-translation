base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/103.yaml
  text: Jesus said, “Blessed is the man who knows in which part the robbers are coming in, so that he will arise, gather his kingdom, and gird his loins beforehand, before they come in.”
translation:
  language: zh_hans
  text: 耶稣说：“知道强盗们会从哪一处进来的人有福了，好叫他起来，聚集自己的国[a]，并在他们进来以前预先束紧腰带。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集自己的国”直译原文。“国”（也可译“王国、国度”）在这里与强盗将入的叙事情境并置，语义不甚寻常；也有人按情境理解为“领地、家产”或“人马”。正文保留“国”，不替原文消除这种含混。
    reason: 保留原文中“国”的字面措辞，并说明其在本句中的语义张力及可能理解，避免将解释当作定论。
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: 有福了
  rationale: 这是希腊语借词 μακάριος，在祝福句式中译作“有福了”既保留宗教语域，也符合现代汉语圣典文体。
- source_word: ⲙⲉⲣⲟⲥ
  choice: 一处
  rationale: 该希腊语借词 μέρος 基本义为“部分、区域”。此处可能指夜间的某一更次，也可能指强盗进入的方位；正文保留较宽泛的空间表达，不强行消除歧义。
- source_word: ⲗⲏⲥⲧⲏⲥ
  choice: 强盗
  rationale: 原稿以复数冠词和末尾第三人称复数呼应，故译为集合性的“强盗”，后文用“他们”明确复数。
- source_word: ⲧⲱⲟⲩⲛ
  choice: 起来
  rationale: 原词是“起来、起身”，不是符类福音平行经文中的“警醒”；直译以保留《多马福音》的独特措辞。
- source_word: ⲥⲱⲟⲩϩ
  choice: 聚集
  rationale: 基本义为“聚集、收集”，不按平行经文改写为守望、防守或阻止挖入。
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: 国
  rationale: 该词通常表示“王国、国度、王权”。正文采用“自己的国”，保留突兀而可能具有神学意味的王国意象，不以“家产”或“领地”消解它。
- source_word: ⲙⲟⲩⲣ ... ⲉϫⲛ̄ ⲡⲉϥϯⲡⲉ
  choice: 束紧腰带
  rationale: 原文直义是“在腰间系紧”，属于准备行动的惯用形象；现代汉语译为“束紧腰带”自然且保留古代动作。
- source_word: ϩⲁⲡⲉϩⲏ
  choice: 预先
  rationale: 表示“事先、在前头”，与末句“在他们进来以前”共同强调提前准备。
theological_decisions:
- issue: ⲙⲛⲧⲣⲣⲟ 在比喻语境中的含义
  choice: 自己的国
  alternative: 自己的领地／家产／人马
  rationale: 虽然“领地”或“人马”在强盗来袭的叙事情境中更顺畅，但原词是《多马福音》中具有重要神学分量的“国／国度”。保留“国”可呈现原文有意或无意的张力，不替作者解释。
- issue: 是否依照马太福音24:43、路加福音12:39改写
  choice: 保留“起来、聚集自己的国、束紧腰带”
  alternative: 译成“警醒，不让人挖透房屋”
  rationale: 科普特文本在这些位置使用了不同于符类平行经文的词汇；翻译应首先依据现存原文，不进行和谐化处理。
- issue: “哪一处”的具体指向
  choice: 正文保留“一处”的含混表达
  alternative: 明确译为“哪一更”或“哪个方位”
  rationale: ⲙⲉⲣⲟⲥ 可指部分、区域，也可能在此暗指夜间时段。上下文不足以确定，故不在正文中单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有福了”维持祝福语体；“束紧腰带”保留古代行动意象。末尾补入“做好准备”使汉语目的关系清楚，但不改变三个连续动作均以那人为主语。正文仅设置一个必要脚注，且标记[a]已在正文出现。
