revisions:
- from: 耶稣说：“那知道强盗会从哪一处进来的人有福了；这样，他就会起来，聚集自己的国[a]，预先束紧腰带，赶在他们进来之前做好准备。”
  to: 耶稣说：“知道强盗们会从哪一处进来的人有福了，好叫他起来，聚集自己的国[a]，并在他们进来以前预先束紧腰带。”
  rationale: 删去原文未明说的“做好准备”，并重组末句，使“预先”与“在他们进来以前”共同限定“束紧腰带”。将“强盗”明确为“强盗们”，对应复数冠词及末句复数代词；其余关键、非符类化的措辞均予保留。
