base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/104.yaml
  text: They said to Jesus[a], “Come, let us pray today, and let us fast.” Jesus said, “For what is the sin that I have committed, or in what have I been overcome? But when the bridegroom goes out from the bridal chamber, then let them fast[f][e][d][c][b], and let them pray.”
translation:
  language: zh_hans
  text: 他们对耶稣说：“来吧，让我们今天祷告，也让我们禁食。”耶稣说：“我犯了什么罪呢？我还是在哪件事上被胜过了呢？但新郎从新房出来的时候，那时就让他们禁食，也让他们祷告。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲁⲙⲟⲩ
  choice: 来吧
  rationale: 保留祈使邀请的简洁语气；“吧”使现代汉语表达自然。
- source_word: ϣⲗⲏⲗ
  choice: 祷告
  rationale: 这是该动词的标准宗教语境译法，也保留原文的简练。
- source_word: ⲛⲡϩⲟⲟⲩ
  choice: 今天
  rationale: 字面为“这一天／那一天”，此处是科普特语表示“今天”的习惯用法。
- source_word: ⲛⲏⲥⲧⲉⲩⲉ
  choice: 禁食
  rationale: 准确表达宗教性禁食，而非一般意义上的少吃或戒口。
- source_word: ⲡⲛⲟⲃⲉ
  choice: 罪
  rationale: 对应道德与宗教意义上的过犯；“罪”最直接且符合上下文。
- source_word: ⲟⲩ ⲡⲉ
  choice: 什么……呢
  rationale: 按疑问结构翻译，避免误作陈述；语气词“呢”自然传达反问色彩。
- source_word: ϫⲣⲟ (with ⲉ-)
  choice: 被胜过
  rationale: 此处无不定式补语，词义较合适地指被征服、被压倒或被胜过，而非“被迫去做某事”；同时保留究竟被什么胜过的开放性。
- source_word: ϩⲛ ⲟⲩ
  choice: 在哪件事上
  rationale: 保留原文椭圆而开放的疑问意义，在汉语中比生硬的“在什么中”更自然。
- source_word: ⲡⲛⲩⲙⲫⲓⲟⲥ
  choice: 新郎
  rationale: 直接保留婚礼意象，是现代汉语中自然明确的对应词。
- source_word: ⲡⲛⲩⲙⲫⲱⲛ
  choice: 洞房
  rationale: 准确而简洁地表达婚礼中的新婚房间，并保留与“新郎”相连的意象。
- source_word: ⲙⲁⲣⲟⲩ-
  choice: 就让他们
  rationale: 原文是第三人称复数祈使／愿望式，不宜译成单纯将来时；“就”承接“那时”。
theological_decisions:
- issue: 耶稣关于罪与“被胜过”的两个疑问
  choice: 译作两个反问：“我犯了什么罪呢？我又在哪件事上被胜过了呢？”
  alternative: 译为陈述，或把第二问具体解释为“被罪／试探胜过”
  rationale: 原文疑问结构清楚，但没有明说胜过他的主体或力量；译文不补入“罪”“试探”等解释，以保存神学张力与开放性。
- issue: 新郎离开洞房后的禁食与祷告
  choice: 按原文保留第三人称“让他们”，不说明新郎或“他们”分别象征谁
  alternative: 将新郎明确解释为耶稣，并把“他们”改作“你们”或“门徒”
  rationale: 原文采用婚礼意象和第三人称复数，并未在本句中明示象征关系；不把特定宗派解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文短促的对话节奏、两个反问、婚礼意象，以及第三人称祈使语气。因正文没有脚注标记，未设置脚注。
