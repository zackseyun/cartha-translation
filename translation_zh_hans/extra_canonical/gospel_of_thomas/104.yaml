revisions:
- from: 他们对耶稣说：“来吧，让我们今天祷告，也让我们禁食。”耶稣说：“我犯了什么罪呢？我又在哪件事上被胜过了呢？但新郎从洞房出来的时候，那时就让他们禁食，也让他们祷告。”
  to: 他们对耶稣说：“来吧，让我们今天祷告，也让我们禁食。”耶稣说：“我犯了什么罪呢？我还是在哪件事上被胜过了呢？但新郎从新房出来的时候，那时就让他们禁食，也让他们祷告。”
  rationale: 仅作两项低风险修订：以“还是”译出ⲏ的替代性疑问关系；以“新房”中性地译出“bridal chamber”。保留“被胜过”的未指明施事者、第三人称“他们”及原文的婚礼意象，不加入解释性神学内容。无需脚注；原草案亦无脚注锚点。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:04Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了对话、今日祷告与禁食、两个疑问、新郎／婚房意象，以及末句第三人称复数愿望式。第二个疑问的“又”却弱化了原文ⲏ（“或／还是”）所表达的二选一式并列，应改为“还是”或“或是”。“新房”比“洞房”更贴近不限定于婚夜的ⲡⲛⲩⲙⲫⲱⲛ（bridal chamber），且现代汉语更中性。
  naturalness: 整体庄重通顺。“我又在哪件事上被胜过了呢”可理解，但“我还是在哪件事上被胜过了呢”既更自然地承接前问，也更显出原文的“or”关系。
  terminology: “祷告”“禁食”“罪”“新郎”均恰当。“新房”可对应婚房／新娘房这一婚礼空间，而不将其狭窄化为汉语“洞房”常带的婚夜意味。未将未明说的胜过者、婚礼意象的象征对象或“他们”的所指擅自具体化，处理正确。
  issues:
  - severity: low
    issue: 第二问以“又”连接。
    rationale: 科普特语ⲏ为“或／还是”，与前面的“我犯了什么罪”构成明确的替代式问句；“又”较像递进，未充分呈现这一关系。
  - severity: low
    issue: “洞房”略微收窄ⲡⲛⲩⲙⲫⲱⲛ的空间含义。
    rationale: 该希腊借词指新婚房／婚房；“洞房”并非错误，但在现代汉语中较容易特指婚夜，使用“新房”较中性且保留原有婚礼意象。
