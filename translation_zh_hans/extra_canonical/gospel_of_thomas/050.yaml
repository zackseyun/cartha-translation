base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/050.yaml
  text: Jesus said[1], "If they say to you, 'From where have you come into being?', say to them, 'We have come forth from the light—the place where the light came into being by itself, stood, and was revealed in their image.' If they say to you, 'Are you it?', say, 'We are its children, and we are the chosen of the living father.' And if they ask you, 'What is the sign of your father who is in you?'[2], say to them[c][b][a][5][4][3], 'It is movement and rest.'"
translation:
  language: zh_hans
  text: 耶稣说：“若他们对你们说：‘你们是从哪里产生的？’你们就对他们说：‘我们从光而来；光在那里自行产生，站立，并在他们的形像中显现。[a]’若他们对你们说：‘你们就是它吗？’[b]你们就说：‘我们是它的儿女，也是那位活着的父所拣选的人。’若他们问你们：‘那位在你们里面的父，他的标记是什么？’你们就对他们说：‘是运动与安息。[c]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自行产生，站立，并……显现”对应原文三个简短动词。写本中与“站立”相邻的短语有部分复原；其确切作用尚不确定，也可理解为“独自”或“为自身”。“他们的形像”原文确为复数所属形式，但“他们”指谁并不清楚，因此正文未改成“他的形像”或“它的形像”。
    reason: lacuna_or_restoration_and_antecedent_ambiguity
  - marker: b
    text: 原文直译近似“你们是吗？”或“你们就是它吗？”，谓语所指被省略。正文保留这种突兀与含混；也可能按语境补作“你们就是那光吗？”。
    reason: elliptical_copular_construction
  - marker: c
    text: “运动”也可译作“活动”或“动”；“安息”也可译作“静止”或“歇息”。原文虽在两个抽象名词前使用不定冠词，现代汉语不必译成“一种运动和一种安息”。
    reason: lexical_alternative_and_abstract_noun_syntax
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: 产生
  rationale: 在关于门徒来源的问句和关于光之起源的从句中保持同一译法，表达“成为、产生”的起源含义，并与随后表示来出的 ⲉⲓ ⲉⲃⲟⲗ 区分。
- source_word: ⲉⲓ ⲉⲃⲟⲗ ϩⲛ
  choice: 从……而来
  rationale: 自然表达由某一源头出来，同时保留与 ϣⲱⲡⲉ“产生”的词义差别。
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: 光
  rationale: 直接保留原文的基本名词和宇宙论式意象。
- source_word: ϩⲓⲧⲟⲟⲧϥ ⲟⲩⲁⲁⲧϥ
  choice: 凭自身
  rationale: 保留反身、独自发生的意味，不额外说明机制或神学主体。
- source_word: ⲟⲩⲱϩⲉ ⲉⲣⲁⲧϥ
  choice: 站立起来
  rationale: 按动词的核心意义直译，并保留原文三个简短动词连续出现的节奏。
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 显现
  rationale: 表达变得可见、显明的意义，不把句子限定为由另一主体实施的“启示”。
- source_word: ⲡⲉⲩϩⲓⲕⲱⲛ
  choice: 他们的形像
  rationale: 忠实保留复数所属成分“他们的”，不擅自改成“他的”或“它的”；“形像”保持庄重且能承载原文意象。
- source_word: ⲡⲉϥϣⲏⲣⲉ
  choice: 它的儿女
  rationale: 用“儿女”表达复数后裔关系；以“它”承接前文语法上含混而省略的所指，避免擅自人格化。
- source_word: ⲡⲥⲱⲧⲡ
  choice: 所拣选的人
  rationale: 表达被选择者，既自然又不强加特定教会身份；原文可理解为“蒙拣选者”。
- source_word: ⲡⲉⲓⲱⲧ ⲉⲧⲟⲛϩ
  choice: 那位活着的父
  rationale: 将关系结构明确译出，保留“父是活着的”这一修饰，不采用可能引入固定教义术语的专名化表达。
- source_word: ⲡⲙⲁⲉⲓⲛ
  choice: 标记
  rationale: 可指辨认身份的记号或征象；“标记”在现代汉语中清楚而不过度解释。
- source_word: ⲟⲩⲕⲓⲙ
  choice: 运动
  rationale: 保留抽象的动态概念；也可译作“活动”或“动”。
- source_word: ⲟⲩⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: 安息
  rationale: 表达停止、歇息或静止状态，并保留《多马福音》中这一词可能具有的神学张力。
theological_decisions:
- issue: 光的自生表述
  choice: “光在那里凭自身产生”
  alternative: “光在那里自行产生”或“光在那里由它自己产生”
  rationale: 保留文本关于光之起源的反身表达，不将其改写为由上帝创造，也不据此建立独立的宇宙论结论。
- issue: “你们就是它吗？”的省略所指
  choice: 保留中性代词“它”
  alternative: 补作“你们就是那光吗？”
  rationale: 科普特文系词句省略谓语所指，语气突兀；不直接补成“光”，以保存真实的指代含混。
- issue: 内在之父
  choice: “那位在你们里面的父”
  alternative: “你们父的、在你们里面的标记”
  rationale: 关系转换词明确修饰“父”，因此译出父在“你们里面”，同时不解释这种内在关系的具体性质。
- issue: 运动与安息的关系
  choice: 并列为“运动与安息”
  alternative: “一种运动和一种安息”
  rationale: 原文的不定冠词可与抽象名词连用；汉语不加量词更能保留格言式、概念性的并置与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体，以重复的“如果有人问……就说……”保存箴言式口传节奏。代词和关系从句尽量清楚，但在原文确有省略或指代不明之处不加以神学调和。
source_grounding:
  english_pob_role: consult_only
