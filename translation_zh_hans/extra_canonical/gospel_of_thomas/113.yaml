    [他回答：][b]“它不是靠观察而来的。人们也不会说：‘看，在这里！’或‘看，在那里！’[c]相反，父的王权铺展在大地[d]上，人们却看不见它。”'
  to: '门徒对他说：“王权[a]要在哪一天来临？”


