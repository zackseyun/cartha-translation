base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/113.yaml
  text: 'His disciples said to him[1], "On what day will the kingship[1] come?"


    [He said], "It will not come by watching. They will not say, ‘Look, here!’ or ‘Look, there![2]’ Rather, the Father’s kingship is spread out upon the earth[3][a][3][2], and people do not see it."'
translation:
  language: zh_hans
  text: '门徒对他说：“王权[a]要在哪一天来临？”


    [他回答：][b]“它不会以可观察的方式来到。人们不会说：‘看哪，在这里！’或‘看哪，在那里！’[c]相反，父的王权铺展在大地[d]上，人们却看不见它。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王权”也可译作“国度”。原词侧重作王、统治或王的权柄，不一定指一片疆域。
    reason: lexical_alternative
  - marker: b
    text: 原文在门徒的问题之后直接进入回答，没有“他回答”或“他说”等叙述语。
    reason: source_ellipsis
  - marker: c
    text: 抄本逐行文本作“那里”，与“这里”相对；规范化文本则印作“天／天空”。按上下文采用“那里”。
    reason: textual_variant
  - marker: d
    text: “大地”也可译作“土地”。原文保留了王权铺展于地上的空间意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: 王权
  rationale: 该抽象名词由“王”构成，侧重作王、统治或王的权柄；“王权”比“国度”更能保留这一抽象意味，同时在脚注中保留传统译法。
- source_word: ⲛⲁϣ ⲛϩⲟⲟⲩ
  choice: 在哪一天
  rationale: 直译为“哪一天”，保留原文具体的时间问法，不泛化为“何时”。
- source_word: ϭⲱϣⲧ
  choice: 观察
  rationale: 原词指观看、察看；“靠观察”保留原文简短的方式表达，也呼应下文寻找可见方位的说法。
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: 看
  rationale: 采用现代汉语中直接有力的提示语，传达原文指示性的语气。
- source_word: ⲡⲓⲥⲁ
  choice: 在这里
  rationale: 字面涉及“这个地方”，在“这里／那里”的指示结构中自然译作“在这里”。
- source_word: ⲧⲏ / ⲡⲏ
  choice: 在那里
  rationale: 抄本逐行文本作指示词“那里”，与前面的“这里”形成自然配对；规范化文本的“天／天空”作为异文列入脚注。
- source_word: ⲥⲡⲱⲣϣ ⲉⲃⲟⲗ
  choice: 铺展
  rationale: 该动词有铺开、散布之意；“铺展”保留空间意象，又不额外限定是被撒散还是主动扩张。
- source_word: ϩⲓϫⲛ ⲡⲕⲁϩ
  choice: 在大地上
  rationale: 保留原文具体的空间图景；ⲡⲕⲁϩ也可指“土地”。
- source_word: ⲛⲣⲱⲙⲉ
  choice: 人们
  rationale: 原文为泛指复数，用“人们”避免不必要的性别限定。
theological_decisions:
- issue: ⲡⲙⲛⲧⲣⲣⲟ表示统治权还是领域性的国度
  choice: 正文译“王权”
  alternative: 国度／王国
  rationale: 原词的抽象构词更侧重统治、作王；脚注保留“国度”这一可能译法，不把经文预先限定为空间领域。
- issue: 父的王权是否明确表示已经完全实现
  choice: 译作“铺展在大地上”，不添加“已经”或“正在”
  alternative: 已经铺展／正铺展
  rationale: 原句呈现其在大地上的现实状态，但未明确标示汉语“已经”所暗示的完成阶段，也未明确强调持续过程；省去时间副词可保留其张力。
- issue: 回答者的叙述引语是否属于原文
  choice: 用方括号补出“[他回答：]”
  alternative: 直接进入回答，或无标记地写“他说”
  rationale: 抄本在问题之后直接进入回答，没有相当于“他说”的叙述语；方括号既使中文衔接清楚，又明确显示这是补语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。问句保留“哪一天”的具体形式；回答维持原文短促的宣告语气。“王权”虽较“国度”不常见，却能准确表达抽象的统治含义，并以脚注辅助普通读者。方括号用于显明原文省略的引语提示。
