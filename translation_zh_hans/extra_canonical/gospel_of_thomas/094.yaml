base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/094.yaml
  text: Jesus said[a], The one who seeks will find; the one who knocks to enter[c][b], it will be opened for him.
translation:
  language: zh_hans
  text: 耶稣说[a]：“寻找的人必会找到；敲击以求进入的人[b]，必有人为他打开[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本开头的“耶稣说”有部分文字残缺，现据编者复原。
    reason: lacuna_or_restoration
  - marker: b
    text: 原文直译近于“敲击、向内（进入）”，并未明说“门”或其他被敲击的对象。
    reason: cultural_note
  - marker: c
    text: 原文也可译作“必为他打开”；这里的复数主语可表示不确定的“有人”，也可具有被动意义。原文没有明说所打开的是什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: ⲡⲉϫⲉ是常用的“说”，ⲓⲏⲥⲟⲩⲥ为“耶稣”；采用《多马福音》语录开头自然、简洁的汉语表达。
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ ⲛⲧⲟϥⲛⲁϭⲓⲛⲉ
  choice: 寻找的人必会找到
  rationale: 关系结构表示泛指的“……的人”；ϣⲓⲛⲉ意为“寻找”，ϭⲓⲛⲉ意为“找到”，ⲛⲁ-表示将来。“必会”在现代汉语中兼顾将来语气和格言式断言。
- source_word: ⲡⲉⲧⲉⲣⲉⲧⲱϩⲙ ⲉϩⲟⲩⲛ
  choice: 敲门求进的人
  rationale: ⲧⲱϩⲙ意为“敲、击”，ⲉϩⲟⲩⲛ表示向内、进入的方向。正文以汉语惯用的“敲门求进”传达动作场景；“门”虽为汉语表达中自然补足的隐含宾语，但科普注说明原文并未明说。
- source_word: ⲛⲧⲟⲟⲩⲛⲁⲟⲩⲱⲛ ⲛⲁⲛⲧⲟϥ
  choice: 必有人为他打开
  rationale: 第三人称复数可作不定主语，也可产生被动含义。译作“必有人为他打开”保留原文表层的不定施事；“打开”的宾语仍不明说，不擅自限定为门。
theological_decisions:
- issue: 打开者及所打开之物均未明说
  choice: 必有人为他打开
  alternative: 必为他打开
  rationale: 原文第三人称复数既可理解为不定主语“有人”，也可按惯用法理解为被动；正文保留不定施事，脚注列出被动译法，避免赋予特定神学主体或擅自补出宾语。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留语录的格言式节奏。分号对应两个平行的泛指结构；不把寻找或敲门的对象作神学化限定。
