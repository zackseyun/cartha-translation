base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/002.yaml
  text: Jesus said[a], "Let the one who seeks not stop seeking until he finds; and when he finds, he will be disturbed; and when he is disturbed, he will marvel[e][d][c][b]; and he will reign over the All."
translation:
  language: zh_hans
  text: 耶稣说：“寻求的人不可停止寻求，直到他寻见；他寻见时，必感到不安[b]；他感到不安时，必感到惊奇；并且他必在万有之上作王[c]。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊残片 POxy 654 在后半句作：“他必惊异……作王以后，他必得安息”；科普特文则作“必感到不安……必感到惊奇”，结尾没有“得安息”。
    reason: textual_variant
  - marker: b
    text: “感到不安”也可译作“受扰动”“感到惊扰”或“受震撼”；这里特意与下文“感到惊奇”所对应的另一个动词区分开来。
    reason: lexical_alternative
  - marker: c
    text: “万有”指一切事物的总体、宇宙整体，并非“许多事物”。
    reason: cultural_note
lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ…ⲗⲟ
  choice: 不可停止
  rationale: 这是第三人称否定祈使或劝令，并非向听众发出的“不要让他……”；“不可停止”自然保留“不要停下”的意思。
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ
  choice: 寻求的人
  rationale: 定冠词化的关系结构指“进行寻求者”；此译简洁，并保留格言式语气。
- source_word: ⲉⲣⲉ ⲛⲧⲟϥ ϣⲓⲛⲉ
  choice: 寻求
  rationale: 与“不可停止”结合，已清楚表达持续动作，无须重复译作“不断寻求”。
- source_word: ϣⲁⲛⲧⲉ ⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: 直到他寻见
  rationale: ϣⲁⲛⲧⲉ引出“直到”的时间界限；“寻见”与前面的“寻求”形成自然呼应。
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: 他寻见时
  rationale: 表达预期发生之事的时间从句；简明保留“当……时”的关系。
- source_word: ϣⲧⲟⲣⲧⲣ
  choice: 受震动
  rationale: 该词表示被扰动、震撼或不安；“受震动”保留开放性，并与下一步“惊奇”区分。
- source_word: ⲣϣⲡⲏⲣⲉ
  choice: 感到惊奇
  rationale: 表示惊异、诧异；“感到惊奇”符合现代普通话，也保留递进关系。
- source_word: ⲣ̄ⲣ̄ⲣⲟ
  choice: 统治
  rationale: 动词本义为作王、掌权；“统治”在“统治万有”中自然而庄重。
- source_word: ⲉϫⲛ ⲡⲧⲏⲣϥ
  choice: 万有
  rationale: 此处指整体、宇宙万物的总和；“万有”比“所有东西”更凝练，也适合该语境。
theological_decisions:
- issue: “万有”是否应被解释为特定的宇宙论术语
  choice: 正文译作“万有”，脚注仅说明其集合性含义
  alternative: 译作“整个宇宙”或将其解释为某一特定神学体系中的实体
  rationale: 原文保留了“整体、全部”的凝练表达；不应在正文中加入超出词义本身的宗派性或体系性解释。
- issue: “受震动”与“感到惊奇”的关系
  choice: 保留为两个连续而有区别的阶段
  alternative: 合并为“惊讶”或把前者解释成悔改、恐惧等特定属灵经验
  rationale: 原文使用两个不同动词，并呈现递进；不把这种张力限定为某种特定神学经验。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。保留原文“寻求—寻见—震动—惊奇—统治”的紧凑递进和平行时间结构；避免古奥的“作王于一切之上”，也不将含混的体验术语神学化。
