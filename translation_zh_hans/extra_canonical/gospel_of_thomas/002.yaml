revisions:
- from: 耶稣说：“寻求的人不可停止寻求，直到他寻见；他寻见时，必受震动[b]；受震动时，必感到惊奇；并且他必统治万有[c]。”[a]
  to: 耶稣说：“寻求的人不可停止寻求，直到他寻见；他寻见时，必感到不安[b]；他感到不安时，必感到惊奇；并且他必在万有之上作王[c]。”[a]
  rationale: 修订仅处理现代汉语中易误解的“受震动”、恢复末句“作王”的王权语义，并删除脚注中原文未明示的“受造”限定。其余句法、递进和文本异读说明均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:24:51Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了第三人称否定劝令、持续寻求、两层平行的“当……时”结构，以及“寻见—受扰—惊奇—作王”的递进。惟“统治”未充分表达ⲣ̄ⲣ̄ⲣⲟ“作王／为王”的王权语义；脚注c将“万有”释为“整个受造世界”，添加了原文和英文学术注释均未限定的“受造”概念。
  naturalness: “寻求的人不可停止寻求”简洁庄重。“受震动”在现代普通话中容易被理解为遭遇物理震动，且搭配略生硬；“感到不安”更自然，也能保留该词与下一动词“惊奇”的语义区别。
  terminology: “寻见”“万有”适合格言体和此处的宇宙性集合表达。将末句改为“在万有之上作王”可保留动词的王权意义，避免把它泛化为一般行政性“统治”。
