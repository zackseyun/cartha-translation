  - severity: medium
    issue: “统治万有”弱化了“作王／为王”的词汇色彩。
    rationale: ⲣ̄ⲣ̄ⲣⲟ的核心意义是为王、作王、掌王权；“在万有之上作王”既自然又更贴近原文。
