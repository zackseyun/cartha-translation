base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/105.yaml
  text: Jesus said[f][e][d][c][b][a], “The one who will come to know the father and the mother—they will call him ‘the son of a prostitute.’”
translation:
  language: zh_hans
  text: 耶稣说：“将要认识[a]父亲和母亲的人，他们会称[b]他为‘妓女的儿子’[c][d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是关系从句中的将来式，直译为“将要认识的人”，而不只是“认识的人”。
    reason: lexical_alternative
  - marker: b
    text: “称”也可译作“给……起名”或“叫作”；原文用主动句，主语是“他们”。
    reason: lexical_alternative
  - marker: c
    text: 原词也可指“孩子”；这里因阳性形式及这一称谓的惯用表达而译作“儿子”。
    reason: lexical_alternative
  - marker: d
    text: “妓女”前没有定冠词。该词词首的 ⲡ 是希腊语借词本身的一部分，并非科普特语的定冠词；因此这里不是特指“那个妓女”。
    reason: textual_morphology
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉ ⲛⲁⲥⲟⲟⲩⲛ
  choice: 将要认识……的人
  rationale: 这是关系从句中的将来式；“将要认识”保留其前瞻意味，不把它化为一般性的“认识……的人”。
- source_word: ⲡⲉⲓⲱⲧ ⲙⲛ ⲡⲙⲁⲁⲩ
  choice: 父亲和母亲
  rationale: 按名词的普通意义直译，并保留原文的并列关系；现代汉语通常无需用额外词语表达此处的定冠词。
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁⲙⲟⲩⲧⲉ ⲉⲛⲧⲟϥ
  choice: 他们会称他为
  rationale: 保留原文明确的第三人称复数主语和将来意义；“称……为”适合称号或贬称语境，也比被动式更贴近表层句法。
- source_word: ⲡϣⲏⲣⲉ
  choice: 儿子
  rationale: 该词也可泛指“孩子”，但阳性冠词及其与母系属格构成的惯用侮称支持译作“儿子”。
- source_word: ⲡⲟⲣⲛⲏ
  choice: 妓女
  rationale: 这是希腊语 πόρνη 的借词；词首 ⲡ 属于借词本身，并非科普特语定冠词，因此不应译成特指的“那个妓女”。“妓女”准确且符合现代标准汉语语域。
- source_word: ⲡϣⲏⲣⲉ ⲛⲡⲟⲣⲛⲏ
  choice: 妓女的儿子
  rationale: 这是自然的现代汉语称谓；“妓女”前不加指示语，避免误作特指，同时汉语裸名词保留其未明确限定的性质。
theological_decisions:
- issue: “父亲和母亲”的身份
  choice: 不加尊称、引号或解释，译作“父亲和母亲”
  alternative: 译作带特定神学身份暗示的“父与母”或将其中一方大写、神格化
  rationale: 原文虽有定冠词，却没有在本句中明说二者的身份；译文不替文本消除这一开放性。
- issue: “妓女的儿子”是实际身世还是侮辱性称号
  choice: 保留为他人将使用的称呼，不解释其真假
  alternative: 明确译成“私生子”或断言其母亲是妓女
  rationale: 原文只陈述“他们会称他为”，没有判定该称呼是否属实；“私生子”还会增添原文没有的婚生身份概念。
translation_notes:
  register: 采用自然、庄重而直白的现代标准汉语。“妓女的儿子”保留原话的尖锐和侮辱性，但不改用更粗俗的骂语，也不增译为带有不同社会法律含义的“私生子”。
