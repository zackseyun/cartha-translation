base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/098.yaml
  text: Jesus said[a], “The Father’s kingship is like a man who wanted to kill a magnate. He drew the sword in his house and drove it into the wall, so that he might find out whether his hand would be strong enough[e][d][c][b]; then he killed the magnate.”
translation:
  language: zh_hans
  text: 耶稣说：“父的王权[a]好比一个人，他想杀死一位权贵[b]。他在家里拔出剑来，刺进墙里，要看看自己的手是否够有力[c]；然后，他杀死了那位权贵。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王权”所译的词主要指统治或作王的权柄；也可译作“国度”或“统治”。
    reason: lexical_alternative
  - marker: b
    text: “权贵”原文是希腊语借词，指身居高位、颇有权势的“大人物”；也可译作“显贵”或“大人物”。
    reason: lexical_alternative
  - marker: c
    text: 原文短语兼有“有力量”和“进去”的意味，也可较直译为“他的手能否进去”。这里按刺剑入墙的语境译作“是否够有力”。
    reason: source_ambiguity
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: 王权
  rationale: 该抽象名词主要表示统治、王者权柄，而非疆域；“王权”在现代汉语中简明自然，并保留与“国度”之间的词义张力。
- source_word: ⲡⲉⲓⲱⲧ
  choice: 父
  rationale: 原文为定指“父”，并非“我的父”；采用《多马福音》中自然、庄重的称谓。
- source_word: ⲉⲣⲉⲛⲧⲟⲥⲧⲟⲛⲧⲛ
  choice: 好比
  rationale: 这是引入比喻的常见科普特语结构；“好比”符合现代汉语叙事习惯。
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: 权贵
  rationale: 该希腊语借词指有显赫地位的大人物；“权贵”兼顾社会地位和权势，比泛称“大人物”更准确。
- source_word: ϣⲱⲗⲙ ⲛⲡⲥⲏϥⲉ
  choice: 拔出剑来
  rationale: ϣⲱⲗⲙ 表示抽出；与“剑”搭配译作“拔出”自然准确。
- source_word: ϫⲟⲧⲥ ⲛⲡϫⲟ
  choice: 刺进墙里
  rationale: 表达以剑猛刺墙壁并进入其中的动作，保留原文的力度和方向。
- source_word: ⲉⲓⲙⲉ
  choice: 看看
  rationale: 目的从句表示借此查明或验证；上下文中“要看看”比抽象的“知道”更自然。
- source_word: ⲧⲱⲕ ⲉϩⲟⲩⲛ
  choice: 是否够有力
  rationale: ⲧⲱⲕ 有强健、有能力之意；结合刺墙的测试语境，译文突出手是否有足够力量，同时以脚注保留短语中“进去”的字面成分。
- source_word: ϩⲱⲧⲙ
  choice: 杀死
  rationale: 采用不附加司法或道德色彩的普通动词，保留原文直白语气。
theological_decisions:
- issue: “父的王权”所指为何
  choice: 不在正文中解释比喻所指，也不将“王权”具体化为疆域性的国度
  alternative: 译作“父的国度”，或在译文中补明其属灵、末世或伦理意义
  rationale: 原文只陈述比喻，未说明对应关系；保留其开放性和张力，避免导入特定神学体系。
- issue: 刺墙动作与随后杀人的关系
  choice: 按原文顺序呈现为力量测试，随后杀死权贵
  alternative: 解释为操练、预演、确保剑术纯熟或证明勇气
  rationale: 原文没有明确说明测试对象究竟是手力、剑力还是穿透能力；正文仅作最低限度表达，避免过度释义。
translation_notes:
  register: 采用现代标准普通话，句式简洁而庄重。“拔出剑来”“刺进墙里”保持叙事的具体性；“权贵”通俗可懂，又能体现对象的高位身份。脚注仅处理影响理解的词义与原文歧义，不解释比喻的神学寓意。
