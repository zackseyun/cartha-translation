base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/092.yaml
  text: Jesus said[a], “Seek, and you will find. But the things that you asked me about in those days, which I did not tell you on that day—now I am willing to tell them[e][d][c][b], and you are not seeking them.”
translation:
  language: zh_hans
  text: 耶稣说：“你们要寻求，就必寻见。但你们在那些日子向我问起的那些事，就是我在那一天没有告诉你们的——如今我愿意告诉你们[a]，你们却不寻求这些事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我愿意告诉”也可译作“我就要告诉”或“我准备告诉”。原文结构既可表示意愿，也可表示即将采取行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲓⲛⲉ
  choice: 寻求
  rationale: 既表达主动寻找，也与下文“寻见”形成简洁对应，保留本句格言式语气。
- source_word: ϭⲓⲛⲉ
  choice: 寻见
  rationale: 是ϣⲓⲛⲉ的常见对应词；“寻见”在现代中文中庄重而易懂，并保持两词的语义关联。
- source_word: ⲁⲗⲗⲁ
  choice: 但
  rationale: 直接呈现突转和对比，不增加解释。
- source_word: ⲛⲉⲧⲁ… / ⲡⲉⲧⲉⲣⲉ…
  choice: 那些事
  rationale: 抄本正文为复数关系形式，后续复数代词也支持复数理解；译为“那些事”自然且前后一致。
- source_word: ϫⲛⲟⲩⲉⲓ ⲉⲣⲟⲟⲩ
  choice: 问我的那些事
  rationale: ϫⲛⲟⲩ表示询问，ⲉⲣⲟⲟⲩ标明所问及的事项；中文以“问我的那些事”自然涵盖“向我询问关于那些事”。
- source_word: ⲛⲛⲓϩⲟⲟⲩ
  choice: 从前
  rationale: 字面为“那些日子里”；此处与“如今”对照，中文“从前”最自然。
- source_word: ⲙⲫⲟⲟⲩ ⲉⲧⲙⲙⲁⲩ
  choice: 在那一天
  rationale: 保留原文明确的单数“那一天”，不简化为泛指的“当时”。
- source_word: ϫⲱ / ϫⲟⲟⲩ
  choice: 告诉
  rationale: 原句同时涉及所说的内容与受话者，“告诉”比单纯的“说”更符合汉语表达。
- source_word: ⲧⲉⲛⲟⲩ
  choice: 如今
  rationale: 明确呈现与先前时段的时间对照。
- source_word: ⲉϩⲛⲁ + ϫⲟⲟⲩ
  choice: 我愿意告诉
  rationale: 该迂回结构可表达意愿、准备或即将行动；上下文与先前未告知形成对比，因此正文采用“愿意”。
- source_word: ϣⲓⲛⲉ ⲁⲛ ⲛⲥⲱⲟⲩ
  choice: 却不再寻求了
  rationale: 直陈他们现在没有寻求这些事；“不再”借上下文呈现昔今反差，但不说明其动机。
theological_decisions:
- issue: 耶稣如今的态度是“愿意”还是“即将”告知
  choice: 正文译作“如今我愿意告诉你们”
  alternative: “如今我就要告诉你们”或“如今我准备告诉你们”
  rationale: 科普特语ⲉϩⲛⲁ加不定式可表达意愿或将行；上下文强调先前未说、如今态度改变，采用“愿意”较贴切，同时用脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而口语可懂的句式。保留“从前／在那一天／如今”的时间层次以及末句的反差；不把未告知的原因或听者不再寻求的动机作神学化解释。
