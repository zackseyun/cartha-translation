revisions:
- from: 耶稣说：“你们要寻求，就必寻见。但你们从前问我的那些事，就是我在那一天没有告诉你们的——如今我愿意告诉你们[a]，你们却不再寻求了。”
  to: 耶稣说：“你们要寻求，就必寻见。但你们在那些日子向我问起的那些事，就是我在那一天没有告诉你们的——如今我愿意告诉你们[a]，你们却不寻求这些事。”
  rationale: 修订仅消除两处可安全判定的偏移：以“向我问起的那些事”明确保留询问对象与询问内容的关系；以“不寻求这些事”对应原文当前的否定陈述，避免“不再”所附加的先前行为预设。其余时间层次、复数事项和ⲉϩⲛⲁ结构的歧义均予保留。
