base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/007.yaml
  text: Jesus said[a], “Blessed is this lion which the human will eat, so that the lion becomes human; and accursed is this human whom the lion will eat[d][c][b], and the lion will become human.”
translation:
  language: zh_hans
  text: 耶稣说：“这头狮子是有福的[a]：人[b]将吃掉它，从而狮子成为人[c]；而狮子将吃掉的这个人是可憎的[d]，狮子将成为人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福的”也可译作“幸福的”或“幸运的”。原词是希腊语 μακάριος 的借词，在这里带有祝福语的庄重色彩。
    reason: lexical_alternative
  - marker: b
    text: 原文的“人”是泛称，不限定性别，也可按语境理解为“一个人”或“人类个体”。
    reason: lexical_alternative
  - marker: c
    text: 原文第一次说狮子“成为人”时采用与前句紧密相连的结构，可表示随之发生的结果，所以译作“从而”；末句则采用独立的将来时“将成为人”。抄本中“成为人”的补语标记有方言或拼写变体，不改变基本意义。
    reason: grammar_and_dialect_note
  - marker: d
    text: “可憎的”也可译作“被厌弃的”或较强的“受咒诅的”。原词侧重令人憎恶或遭人憎弃。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: 有福的
  rationale: 这是希腊语 μακάριος 的科普特语借词；“有福的”既保留祝福语的庄重色彩，也与格言体相称。
- source_word: ⲡⲙⲟⲩⲓ / ⲡⲙⲟⲩⲉⲓ
  choice: 狮子
  rationale: 按该词的通常意义直译；两种拼写不构成语义差别。
- source_word: ⲡⲁⲓ
  choice: 这头／这个
  rationale: 保留后置指示词的指示和强调作用；“狮子”按现代汉语量词习惯译作“这头狮子”。
- source_word: ⲡⲣⲱⲙⲉ
  choice: 人
  rationale: 该词泛指人或人类个体，不限定性别；简体中文“人”自然且准确。
- source_word: ⲛⲁⲟⲩⲱⲙⲛⲧⲟϥ
  choice: 将吃掉它／将吃掉的
  rationale: ⲛⲁ- 表将来，动词意为“吃”；首处宾语代词回指狮子。第二处按汉语关系从句表达为“狮子将吃掉的这个人”。
- source_word: ϣⲱⲡⲉ ⲛ/ⲣ ⲣⲱⲙⲉ
  choice: 成为人
  rationale: 保留结果性的“成为”以及原文两次出现的鲜明表述，不擅自解释其象征意义。
- source_word: ⲃⲱⲧⲉ
  choice: 可憎的
  rationale: 该词表示令人厌恶、遭憎弃；“可憎的”与“有福的”形成强烈对照，同时避免把它过度限定为正式咒诅。
theological_decisions:
- issue: 狮子与人互相吞吃并“成为人”的象征意义
  choice: 不在正文中解释，保留格言的悖论与含混性
  alternative: 将狮子明确解释为欲望、肉体、死亡或某种灵性力量
  rationale: 原文没有给出寓意解释；指定某一象征体系会引入文本之外的神学立场。
- issue: ⲃⲱⲧⲉ 的神学力度
  choice: 译作“可憎的”
  alternative: 译作“受咒诅的”
  rationale: “受咒诅的”可与“有福的”构成更整齐的神学反义，但原词核心也可指被憎恶、可厌恶；“可憎的”较能保留词义范围而不过度神学化。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。保留“这头狮子／这个人”的指示强调和两次“狮子成为人”的重复；首处以“从而”反映连接性的结果关系，末处以“将”反映独立将来时。没有补入任何寓意解释。
