base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/108.yaml
  text: Jesus said[a], “Whoever drinks from my mouth will become like me. I myself shall become he[e][d][c][b], and the hidden things will be revealed to him.”
translation:
  language: zh_hans
  text: 耶稣说：“谁从我口中喝，就会变得像我；我自己也要成为他，而隐藏的事将向他显明。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲱ
  choice: 谁……喝
  rationale: 关系将来式在这里表达普遍而不限定的条件；现代汉语用“谁……就……”自然地传达这一格言式结构。
- source_word: ⲥⲱ ⲉⲃⲟⲗ ϩⲛ ⲡⲁⲧⲁⲡⲣⲟ
  choice: 从我口中喝
  rationale: 保留科普特语以“口”为来源的鲜明意象，不擅自释作“领受我的话”或“喝我的教导”。
- source_word: ⲛ ⲡⲁϩⲉ / manuscript ⲛ̄ⲧⲁϩⲉ
  choice: 像我
  rationale: 手稿的 ⲛ̄ⲧⲁϩⲉ 是“以我的方式、如同我”的惯用表达；译作“像我”优于把它实体化为“与我平等的人”。
- source_word: ϣⲱⲡⲉ
  choice: 变得／成为
  rationale: 该动词表示“成为、变成”；前句按汉语搭配译为“变得像我”，后句译为“成为他”。
- source_word: ⲁⲛⲟⲕ ϩⲱⲱ ⲁⲛⲟⲕⲛⲁϣⲱⲡⲉ ⲉⲣⲉⲛⲧⲟϥ ⲡⲉ
  choice: 我自己也要成为他
  rationale: “我自己”保留 ϩⲱⲱ 的强调，“也”体现相互对应；不解释或弱化“成为他”这一突出的身份互涉表达。
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ
  choice: 隐藏的事
  rationale: 实体化关系结构可指“所隐藏的／隐藏之事”；汉语用“隐藏的事”保留其泛指性。
- source_word: ⲟⲩⲱⲛϩ ⲉⲛⲧⲟϥ
  choice: 将向他显明
  rationale: ⲟⲩⲱⲛϩ 表示显现、显明，介词短语标示接受者；“向他显明”兼顾被显露与被认识的语义。
theological_decisions:
- issue: “从我口中喝”的隐喻所指
  choice: 保留原始口饮意象，不在正文中解释
  alternative: 译为“领受我的话／教导”
  rationale: 原文没有明说所喝的是话语或教导；直译可保留其开放性和神学张力。
- issue: “我自己也要成为他”的身份互涉
  choice: 按原文保留“成为他”
  alternative: 释作“我将住在他里面”或“他将与我合一”
  rationale: 这些解释可能反映特定神学理解，却超出原文明确所说；正文应保留紧凑而令人惊异的互为表达。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“从我口中喝”和“成为他”虽不寻常，却是原文刻意而核心的表达，因此不作平滑改写。经文短促，未设脚注，以免用解释取代原文的开放性。
