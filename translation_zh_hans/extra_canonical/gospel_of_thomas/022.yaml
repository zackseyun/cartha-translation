  naturalness: 译文总体为自然、庄重的现代普通话。将“几个”改为“一些”可避免暗示一个特定的少量数目；将“形像”改为较通行的“像”，同时保留原文的陌生重复。身体部位系列仍须保留其刻意的、不寻常的句式。
