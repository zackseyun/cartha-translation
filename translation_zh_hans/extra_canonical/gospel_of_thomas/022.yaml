  rationale: 本次修订仅消除首个身体部位对举中的两项额外限定：将“双眼”改为不定复数“多只眼”，并将“代替”改为原文的“处在……的位置”结构。其余保留草稿已正确处理的上下对举、性别对举、王国术语及手稿残损说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:20Z'
