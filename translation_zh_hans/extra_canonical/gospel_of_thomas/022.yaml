  yaml_path: translation/extra_canonical/gospel_of_thomas/022.yaml
  text: Jesus saw some little ones being suckled[a]. He said to his disciples, “These little ones who are being suckled are like those who are to enter the Kingdom.” They said to him, “Shall we, being little ones, enter the Kingdom?” Jesus said to them, “When you make the two one; and when you make the inner like the outer and the outer like the inner, and the upper like the lower; and when you make the male and the female into a single one, so that the male is not male and the female not female; and when you make eyes in the place of an eye, and a hand in the place of a hand, and a foot in the place of a foot[h][g][f][e][d][c][b], and an image in the place of an image—then you will enter the Kingdom.”
translation:
  language: zh_hans
  text: 耶稣看见一些正在吃奶的小孩子[a]，就对门徒说：“这些正在吃奶的小孩子，好比那些要进入王国的人[b]。”门徒问他：“那么，我们作为小孩子，也会进入王国吗？”耶稣对他们说：“当你们使二者成为一，使里面如同外面、外面如同里面，又使上面如同下面[c]；当你们使男与女成为同一个，使男的不再是男的，女的不再是女的[d]；当你们使多只眼处在一只眼的位置，一只手处在一只手的位置，一只脚处在一只脚的位置，又使一个像处在一个像的位置[e]——那时，你们就会进入王国。”[f]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正在吃奶”所译的科普特语动词专指吃母乳；也可译作“正在受乳”。
    reason: lexical_alternative
  - marker: b
    text: “王国”所译的词也可表示“王权”或“统治”；本篇常把它说成可以“进入”的境界。
    reason: lexical_alternative
  - marker: c
    text: “上面／下面”也有人按其空间含义译作“天上／地下”或“天／地”；这里不预先限定其象征意义。
    reason: lexical_alternative
  - marker: d
    text: “使男的不再是男的，女的不再是女的”直译原文；它如何与前一句“成为同一个”相连，原文没有解释。
    reason: ambiguity
  - marker: e
    text: 原文先说复数的“眼”处在单数“一只眼”的位置，随后“手”“脚”“像”均以单数重复。原文并未指定这些“眼”恰为两只，也没有解释这一系列意象的含义；译文保留其位置结构与字面上的陌生感。
    reason: ambiguity
  - marker: f
    text: 末句“进入王国”在手稿上有轻微残损；“王国”依现行校勘本复原。
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲕⲟⲩⲓ
  choice: 小孩子
  rationale: 本义为“小的、幼小者”；吃奶的语境指幼儿，但保留其可兼指“小者”的宽度，不窄化为“婴儿”。
- source_word: ϫⲓⲉⲣⲱⲧⲉ
  choice: 正在吃奶
  rationale: 该动词专指吃母乳；现代汉语“吃奶”自然、具体，也保留进行中的动作。
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: 王国
  rationale: 词形本可表示王权或统治，但本句与“进入”连用，译作“王国”最自然，同时以脚注保留抽象义。
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: 使二者成为一
  rationale: 紧贴原文凝练而反常的表达，不解释“二者”具体所指。
- source_word: ⲛϩⲟⲩⲛ / ⲛⲃⲟⲗ
  choice: 里面／外面
  rationale: 保留原文空间性对举及双向平行结构。
- source_word: ⲡⲥⲁ ⲛⲧⲡⲉ / ⲡⲥⲁ ⲙⲡⲓⲧⲛ
  choice: 上面／下面
  rationale: 原文是一组上下对举，不增添并不存在的“前面／后面”；也不径自解释为“天／地”。
- source_word: ⲡϩⲟⲟⲩⲧ / ⲥϩⲓⲙⲉ
  choice: 男／女
  rationale: 保留原文性别对举，避免“男人／女人”带入年龄或社会角色色彩。
- source_word: ϩⲓⲕⲱⲛ
  choice: 形像
  rationale: 对应源自希腊语的“像、形像”；“形像”较庄重，也不将其限定为宗教圣像。
theological_decisions:
- issue: “使男与女成为同一个”的含义
  choice: 按原文保留悖论式陈述，不说明为婚姻结合、无性别状态或灵性整合
  alternative: 将其解释性翻译为“超越男女之别”
  rationale: 原文有意保持象征性的张力；任何单一神学解释都会缩窄其意义。
- issue: “王国”的性质
  choice: 正文译“王国”，脚注说明也可指王权或统治
  alternative: 正文译“王权”或“统治”
  rationale: “进入”使地点或状态的意象突出，但词本身的抽象义仍应保留在注释中。
- issue: 身体部位与形像的替代系列
  choice: 保持字面、重复而晦涩的结构
  alternative: 解释为身体或人格的更新与完整
  rationale: 源文没有明说这些意象的所指，不应由译者替文本解决。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“小孩子”“正在吃奶”自然易懂；核心对偶则保留原文的重复、陌生感和象征张力。标点将耶稣的长句分为三个平行条件，以帮助普通读者把握句法而不添加解释。
