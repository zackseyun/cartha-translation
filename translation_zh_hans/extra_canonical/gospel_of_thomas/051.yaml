base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/051.yaml
  text: 'His disciples said to him[a], "On what day will the rest of the dead take place, and on what day will the new world come?"

    He said to them, "That which you are expecting has come[b][c], but you yourselves do not know it."'
translation:
  language: zh_hans
  text: '他的门徒问他：“死者的安息会在哪一天到来？新世界又会在哪一天来临？”


    他对他们说：“你们所盼望的那安息[a]来了，但你们自己[b]却不知道。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里使用阴性单数指示代词，在语法上回指前面的“安息”，而不是阳性的“世界”。
    reason: 说明代词所指及原文保留的语法联系。
  - marker: b
    text: 原文在动词前另用独立的“你们”，带有强调意味，因此译作“你们自己”。
    reason: 呈现原文代词的强调语气。
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  choice: 在哪一天
  rationale: 保留原文直接询问具体日子的形式，而不笼统译作“何时”。
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: 安息
  rationale: 该希腊语借词表示歇息、安歇；“安息”既自然庄重，也保留其可能具有终末意味而未加以教义化解释。
- source_word: ϣⲱⲡⲉ
  choice: 到来
  rationale: 此处所问的是死者的安息何日发生；结合后文“已经来了”，译作“到来”使中文连贯，同时表达事件的实现。
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲃⲃⲣⲣⲉ
  choice: 新世界
  rationale: ⲕⲟⲥⲙⲟⲥ 是“世界”，ⲃⲃⲣⲣⲉ 是“新的”；按其直接组合翻译。
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ-
  choice: 盼望
  rationale: 该习语有向前观看、期待之意；“盼望”在现代汉语中自然，并能表达带有期待的等候。
- source_word: ⲧⲏ
  choice: 那安息
  rationale: 阴性单数指示代词在语法上回指阴性名词 ⲁⲛⲁⲡⲁⲩⲥⲓⲥ，因此明确译作“那安息”，而不含混地译作“那事”。
- source_word: ⲁⲥⲉⲓ
  choice: 已经来了
  rationale: 科普特语完成时表达“它来了／已经来到”；汉语加入“已经”自然体现完成状态，但不把该词误认作原文另有“已经”副词。
theological_decisions:
- issue: 所期待之事究竟回指“死者的安息”还是同时包括“新世界”
  choice: 明确回指“那安息”
  alternative: 译作“你们所盼望的已经来了”，使所指保持宽泛
  rationale: 原文指示代词 ⲧⲏ 为阴性单数，与阴性名词“安息”在语法上相应；“世界”则为阳性。因此正文按语法回指安息，并用脚注说明。
- issue: 未来期待与已经实现之间的张力
  choice: 保留“所盼望的……已经来了”
  alternative: 解释为某种特定的内在、属灵或末世实现
  rationale: 完成时清楚宣告它已经来临，但原文没有说明其方式或性质；译文保留张力，不加入特定神学体系的解释。
- issue: “死者的安息”的含义
  choice: 直译，不解释为复活、救恩或死亡后的长眠
  alternative: 将其具体化为“死者复活”或“永恒安息”
  rationale: 原文只说“死者的安息”，其确切所指具有解释空间，应避免在正文中消除这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“安息”“盼望”“来临”符合宗教格言体裁，但避免古奥措辞。首问用“到来”、次问用“来临”，中文自然且与答语“已经来了”形成呼应。所有脚注标记均已置于正文相应位置。
