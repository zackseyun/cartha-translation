revisions:
- from: 耶稣说：“一个人不可能骑两匹马，又拉两张弓；一个仆人也不可能服侍两个主人，否则他会尊重一个，侮辱另一个。人不会喝了陈酒，立刻又想喝新酒。他们不把新酒倒进旧皮囊，免得皮囊破裂；也不把陈酒倒进一个新皮囊，免得酒把皮囊毁坏。[a]他们不把旧布块缝在节庆礼服上，[b]因为这样一来，就会裂开。”
  to: 耶稣说：“一个人不可能骑两匹马，又拉两张弓；一个仆人也不可能服侍两个主人，否则他会尊敬这个，却轻慢那个。人不会喝了陈酒，立刻又想喝新酒。他们不把新酒倒进旧皮囊，免得皮囊破裂；也不把陈酒倒进一个新皮囊，免得酒把皮囊毁坏。[a]他们不用旧布块补在节庆的衣服上，[b]因为这样就会裂开。”
  rationale: 作两项低风险文字修订：以“尊敬这个，却轻慢那个”改善主人对照句的现代汉语表达；以“用旧布块补在”明确末句的补缀动作。保留文本本身的新旧次序、节庆衣服的字面含义，以及关于皮囊毁坏的明确施事者。脚注继续仅作文本与平行经文说明，不赋予这些差异特定神学解释。
