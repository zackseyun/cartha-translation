base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/047.yaml
  text: Jesus said[1], "It is impossible for a person to mount two horses and to draw two bows. And it is impossible for a servant to serve two masters, or he will honor the one and insult the other. A person does not drink old wine and immediately desire to drink new wine. And they do not pour new wine into old wineskins, lest they burst. And they do not pour old wine into a new wineskin, lest it ruin it. They do not sew an old patch onto a festal garment[3][2], because a tear will result."
translation:
  language: zh_hans
  text: 耶稣说：“一个人不可能骑两匹马，又拉两张弓；一个仆人也不可能服侍两个主人，否则他会尊敬这个，却轻慢那个。人不会喝了陈酒，立刻又想喝新酒。他们不把新酒倒进旧皮囊，免得皮囊破裂；也不把陈酒倒进一个新皮囊，免得酒把皮囊毁坏。[a]他们不用旧布块补在节庆的衣服上，[b]因为这样就会裂开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里保留现存科普特文本的不寻常说法：不仅说新酒不可倒进旧皮囊，也说陈酒不可倒进一个新皮囊。参《马太福音》9:17；《马可福音》2:22；《路加福音》5:37–39。
    reason: 说明与对观福音平行说法的差异，防止读者误以为译文误置“新”“旧”。
  - marker: b
    text: “节庆的衣服”直译为“节庆的衣服”。对观福音的相近比喻说把新布补在旧衣服上；这里却说把旧布块补在节庆的衣服上。参《马太福音》9:16；《马可福音》2:21；《路加福音》5:36。
    reason: 保留源文独特措辞，并交代其与熟悉平行经文的关系。
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ
  choice: 不可能
  rationale: 该结构字面为“没有能力”，在这里表达实际上的不可能；“不可能”既准确又符合现代汉语。
- source_word: ϫⲱⲗⲕ ⲛⲡⲓⲧⲉ
  choice: 拉……弓
  rationale: ϫⲱⲗⲕ 在弓的语境中指拉开、张开；汉语惯用“拉弓”。
- source_word: ⲣⲧⲓⲙⲁ / ⲣϩⲩⲃⲣⲓⲍⲉ
  choice: 尊重／侮辱
  rationale: 两个希腊借词形成鲜明对照，分别表示尊敬、看重与凌辱、轻慢；译为“尊重／侮辱”保留其力度和对应关系。
- source_word: ⲁⲥⲕⲟⲥ
  choice: 皮囊
  rationale: 此希腊借词指盛酒的兽皮囊；上下文已明确是酒，译作简洁的“皮囊”自然清楚。
- source_word: ϣⲧⲏⲛ ⲛϣⲁⲓ
  choice: 节庆礼服
  rationale: 字面是“节庆的衣服”。“节庆礼服”保留节庆含义，也传达这是节日所穿的衣服，而不直接改写为对观传统中的“新衣服”。
- source_word: ⲡⲱϩ
  choice: 破裂／裂开
  rationale: 该词表示撕裂、裂开；用于皮囊时译“破裂”，用于衣服时译“裂开”，按汉语搭配调整而不改变语义。
theological_decisions:
- issue: 是否按对观福音的熟悉形式协调新旧意象
  choice: 保留《多马福音》的次序：陈酒倒进新皮囊、旧布块缝在节庆礼服上
  alternative: 改成“新酒倒进新皮囊”或“新布补旧衣”等对观福音的常见措辞
  rationale: 现存科普特文本明确呈现这些不寻常的组合。译文不以平行经文纠正文句，也不进一步断定这些倒置所代表的神学体系。
- issue: 毁坏新皮囊的施事者
  choice: 译作“免得酒把皮囊毁坏”
  alternative: 较含混地译作“免得把它毁坏”
  rationale: 科普特语的代词结构可按陈酒毁坏皮囊来理解；汉语若连续使用两个“它”会含混不清，因此明确重复名词，同时不添加超出句法关系的解释。
- issue: “节庆礼服”是否等同于“新衣服”
  choice: 正文保留“节庆礼服”，脚注仅说明平行经文的差异
  alternative: 正文直接译成“新衣服”
  rationale: 源文说的是节庆衣服，并未直接使用“新”字；保持这一差异可避免以平行传统取代本见证。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“骑两匹马／拉两张弓”保留成对格言的节奏；酒、皮囊和补衣三个比喻以并列短句连接。避免采用带特定宗派解释色彩的术语，也不把文本的不寻常新旧次序神学化。
