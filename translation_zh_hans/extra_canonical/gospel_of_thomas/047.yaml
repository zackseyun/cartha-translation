review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实呈现科普特文本的三组格言及其与对观福音不同的新旧组合；“陈酒……新皮囊”和“旧布块……节庆衣服”均未被协调化。惟末句的“缝在”可更明确为补缀动作，且第二组主人关系可按原文的指示性对照更自然地表达。
  naturalness: 整体通顺、庄重。将“尊重一个，侮辱另一个”改为“尊敬这个，轻慢那个”，以及将“旧布块缝在”改为“用旧布块补在”，可使汉语更凝练自然，也更贴近比喻语境。
  terminology: “仆人”“主人”“新酒／陈酒”“皮囊”“节庆的衣服”用语一致、现代且无宗派化增译。“轻慢”准确传达原文希腊借词所表示的轻侮，而不必强化为人身侮辱。
  issues:
  - severity: low
    issue: “他们不把旧布块缝在节庆礼服上”未充分显出补缀关系。
    rationale: 末句所说的是将旧的布片／补片缝补到节庆衣服上；“用旧布块补在……上”在汉语中更明确，且不改变原文异常的旧／节庆组合。
  - severity: low
    issue: “尊重一个，侮辱另一个”的对照略显生硬。
    rationale: 原文为尊敬一个、轻慢另一个的固定式对照。用“尊敬这个，却轻慢那个”更符合现代汉语的指称和节奏。
  revised_text: 耶稣说：“一个人不可能骑两匹马，又拉两张弓；一个仆人也不可能服侍两个主人，否则他会尊敬这个，却轻慢那个。人不会喝了陈酒，立刻又想喝新酒。他们不把新酒倒进旧皮囊，免得皮囊破裂；也不把陈酒倒进一个新皮囊，免得酒把皮囊毁坏。[a]他们不用旧布块补在节庆的衣服上，[b]因为这样就会裂开。”
  revised_footnotes:
  - marker: a
    text: 这里保留现存科普特文本的不寻常说法：不仅说新酒不可倒进旧皮囊，也说陈酒不可倒进一个新皮囊。参《马太福音》9:17；《马可福音》2:22；《路加福音》5:37–39。
    reason: 说明与对观福音平行说法的差异，防止读者误以为译文误置“新”“旧”。
  - marker: b
    text: “节庆的衣服”直译为“节庆的衣服”。对观福音的相近比喻说把新布补在旧衣服上；这里却说把旧布块补在节庆的衣服上。参《马太福音》9:16；《马可福音》2:21；《路加福音》5:36。
    reason: 保留源文独特措辞，并交代其与熟悉平行经文的关系。
