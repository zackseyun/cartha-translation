base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/072.yaml
  text: A man said to him[a], "Tell my brothers, so that they may divide my father's property with me." He said to him, "Man, who has made me a divider?" He turned to his disciples and said to them, "I am not a divider, am I?"
translation:
  language: zh_hans
  text: 有一个人对他说[a]：“请告诉我的弟兄[b]，让他们和我分我父亲的财产[c]。”他对那人说：“人哪，谁立我作分配人呢？”他转向[d]自己的门徒，对他们说：“我并不是分配人，对吗？”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本此句开头有少量残缺；“有一个人对他说”部分依据尚存字迹复原。
    reason: lacuna_or_restoration
  - marker: b
    text: 抄本印本文本作复数“我的弟兄”，规范化文本则作单数“我的弟兄（一个）”。正文采用复数。
    reason: textual_variant
  - marker: c
    text: 原词也可译作“产业”“所有物”或“遗产”。
    reason: lexical_alternative
  - marker: d
    text: 抄本与规范化文本在“转向”的拼写上有所不同，属于撒希地语与利科波利语特征相关的形式差异，不影响基本意思。
    reason: dialect_note
  - marker: e
    text: 句首的ⲙⲏ在这里引出预期否定回答的反问，因此也可译作：“难道我是分配人吗？”
    reason: grammatical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲟⲩⲣⲱⲙⲉ ⲛⲁⲛⲧⲟϥ
  choice: 有一个人对他说
  rationale: 按科普特语常用叙事句式直译，同时采用自然的现代汉语表达。
- source_word: ϫⲱⲛⲧⲟⲥ
  choice: 请告诉
  rationale: 原词在这里具有请求兼命令的语气；加“请”符合汉语对当面请求的自然表达，不改变其指令内容。
- source_word: ⲛⲛⲁⲥⲛⲏⲩ / ⲛⲡⲁⲥⲟⲛ
  choice: 我的弟兄
  rationale: 抄本印本文本为复数，规范化文本却作单数；正文依较直接的抄本证据采用复数，并以脚注保留异文。
- source_word: ⲛⲡϩⲛⲁⲁⲩ
  choice: 父亲留下的财产
  rationale: 该词可指财物、产业或遗产。家族分配语境暗示父亲留下的财物，但“财产”避免过度引入正式继承法术语。
- source_word: ⲛⲣⲉϥⲡⲱϣⲉ
  choice: 分配人
  rationale: 保留原文由“分、划分”构成的施事名词，并避免与《路加福音》平行叙述中的“审判官”相调和。
- source_word: ⲁϥⲕⲟⲧϥ / ⲕⲱⲧⲛⲧⲟϥ
  choice: 他转向自己的门徒
  rationale: 原文表达转身朝向门徒；汉语用“转向”简洁自然。
- source_word: ⲙⲏ
  choice: 对吗？
  rationale: 此处按源自希腊语 μή、预期否定回答的疑问标记理解，译成反问句，而不译作“看哪”或禁止语气。
theological_decisions:
- issue: 耶稣是否否认一切意义上的分配或裁断职分
  choice: 仅保留本段所说“分配人”的具体措辞
  alternative: 扩译为“不作审判官或仲裁者”
  rationale: 原文只用“分配人”，没有“审判官”；不将平行经文中的概念或更广泛的神学结论加入正文。
- issue: 末句的语气
  choice: 译为期待肯定认同的否定反问：“我并不是分配人，对吗？”
  alternative: 陈述句：“看哪，我不是分配人。”
  rationale: ⲙⲏ在此最适合作引出预期否定回答的反问，但正文仍保留说话者拒绝该角色所形成的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“人哪”保留原文直接而略显尖锐的呼语；“分配人”虽不如“仲裁人”常见，却准确保留原文反复出现的“分配”词根，并避免补入原文没有的司法含义。
