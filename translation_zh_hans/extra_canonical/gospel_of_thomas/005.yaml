base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/005.yaml
  text: 'Jesus says: Know what is before your face[a], and what is hidden from you will be uncovered[c] to you. For there is nothing hidden that will not be made manifest[d].[b]'
translation:
  language: zh_hans
  text: 耶稣说：“要认识你眼前的事[a]，而向你隐藏的事，也必向你显露[c]。因为没有什么隐藏之物不会显明[d]。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你眼前”直译为“在你脸面前”，意思是就在你面前。
    reason: cultural_note
  - marker: b
    text: 希腊文见证 POxy 654 在末尾另有一句：“以及（没有什么）埋藏之物不会被兴起。”括号内的词反映该处文本／复原的不确定性。纳戈·哈玛第科普特文本没有这句；正文依从科普特文本。
    reason: textual_variant
  - marker: c
    text: “显露”所译的词本义是“揭开”或“除去遮盖”，也可译作“揭示”。
    reason: lexical_alternative
  - marker: d
    text: “显明”在这里指显露、出现或变得可见，并不是“活着”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  choice: 认识
  rationale: 这里是命令式劝诫。“认识”既保留“知道、认知”的基本意义，也比单用“知道”更自然地表达对眼前事物加以辨识的要求，同时不扩展为特定的神秘知识。
- source_word: ⲡⲉⲧⲉⲣⲉ ⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ ⲉⲃⲟⲗ
  choice: 你眼前的事物
  rationale: 科普特语直译为“在你面前／脸前的东西”。“眼前”是现代汉语自然且具体的空间表达；“事物”保留关系代词所指的开放性。
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ ⲉⲛⲧⲟⲕ
  choice: 那向你隐藏的
  rationale: 保留“隐藏”这一遮蔽意象，也体现与人的关系；不擅自说明隐藏者或隐藏原因。
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: 揭开
  rationale: 该词本义带有揭去遮盖的具体意象。“揭开”与前面的“隐藏”相应，比单纯译作“启示”更少神学化。
- source_word: ⲙⲛⲗⲁⲁⲩ ⲅⲁⲣ
  choice: 因为没有什么
  rationale: 自然表达科普特语的全称否定，并保留格言式因果连接。
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 显明
  rationale: 此结构表示出现、成为明显或显露出来，并非“活着”。“显明”庄重简洁，也与前句“揭开”保持词义区分。
theological_decisions:
- issue: 隐藏之物被揭开的主体与方式
  choice: 采用“必向你揭开”的无明确施事表达
  alternative: “必有人向你揭示”或“上帝必向你启示”
  rationale: 原文没有明确指出揭示者。中文保留这种开放性，避免加入上帝、人或某种启示机制。
- issue: “眼前的事物”的所指
  choice: 保留宽泛的“事物”
  alternative: 解释为可见世界、现实、经文或自我知识
  rationale: 原文未限定所指；不把这句话收窄为某一宇宙论、认识论或宗派教义。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。以“眼前”自然传达原文“脸前”的具体意象，并用脚注保存其字面形式；“揭开”与“显明”分别对应两个不同的科普特语动词。
