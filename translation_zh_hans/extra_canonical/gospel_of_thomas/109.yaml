base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/109.yaml
  text: Jesus said[1], "The kingdom is like a man who has a hidden treasure in his field, without knowing about it. And after he died, he left it to his son. The son did not know. He took that field and sold it. And the one who bought it came, and while he was plowing, he found the treasure[2]. He began to lend money at interest to whomever he wished."
translation:
  language: zh_hans
  text: 耶稣说：“国度[a]好比一个人；他的田里有一份藏着的宝藏，他自己却不知道。后来他死了，把那宝藏留给了儿子。儿子也不知道；他接手了那块田，把它卖了。买了田的人来耕作时，发现了那宝藏[b]，便开始向自己愿意借给的任何人放贷取息。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“国度”或“王权/统治”，没有明说“天”。本说法与《马太福音》13:44的藏宝宝喻明显不同：原田主并不知道宝藏，后来买田的人才发现它。
    reason: lexical_and_cross_reference
  - marker: b
    text: 此处前后有若干字词由抄本缺损处复原；根据残存字母和上下文，这些复原相当可靠。
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: 天国
  rationale: 原文直译为“国”或“王权”；按耶稣比喻在现代汉语中的惯用表达译作“天国”，同时以脚注说明原文未明说“天”。
- source_word: ⲁϩⲟ
  choice: 宝藏
  rationale: 指埋藏或储藏的财宝；“宝藏”自然、准确，并保留比喻意象。
- source_word: ⲉϥϩⲏⲡ
  choice: 藏着
  rationale: 明确保留原文“隐藏”的状态，修饰田中的宝藏。
- source_word: ⲉϥⲟ ⲛⲁⲧⲥⲟⲟⲩⲛ ⲉⲣⲟϥ
  choice: 自己却不知道
  rationale: 自然表达原田主对宝藏毫不知情，并使代词所指清楚。
- source_word: ϥⲓ
  choice: 接手
  rationale: 此处可指拿取、承接或取得；“接手”既符合儿子承受田地的叙事，又不把词义过度限定为正式继承。
- source_word: ⲉϥⲥⲕⲁⲉⲓ
  choice: 耕地时
  rationale: 该形式是伴随情状，表示买主在耕作过程中偶然发现宝藏，而非专程寻找。
- source_word: ϯ ϩⲟⲙⲧ ⲉ ⲧⲙⲏⲥⲉ
  choice: 把钱借给……收取利息
  rationale: 原文字面为“按利息给钱”；明确译出放贷取息，不以“投资”等词淡化原意。
theological_decisions:
- issue: ⲡⲙⲛⲧⲣⲣⲟ 的指称
  choice: 天国
  alternative: 国／王权
  rationale: 汉语读者熟悉“天国好比……”这一比喻句式，但科普特原文只写“国／王权”，故以脚注保存词义范围。
- issue: 放贷取息的伦理张力
  choice: 把钱借给任何他愿意借的人，收取利息
  alternative: 把钱投资给任何他愿意的人
  rationale: 原文明确提及利息；译文不因古代犹太或基督教对取息的伦理争议而软化，也不额外解释其象征意义。
- issue: 与《马太福音》13:44的关系
  choice: 按本说法自身的叙事翻译
  alternative: 使细节与《马太福音》的藏宝比喻协调
  rationale: 本说法中原田主和儿子都不知道宝藏，后来买田的人才发现；这些差异应如实保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“田”“宝藏”“耕地”“收取利息”等常用词保持具体意象；不补入原文没有的动机或道德评价。
