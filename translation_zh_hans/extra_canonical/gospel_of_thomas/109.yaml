  naturalness: 原译整体通顺、叙事自然；“把钱借给任何他愿意借的人”略有施受方向歧义，改为“向自己愿意借给的任何人放贷取息”更清楚。
  terminology: “宝藏”“耕作”“放贷取息”均恰当；将“天国”改为“国度”可避免在正文补入原文未明说的限定，同时保留庄重的比喻体裁。
