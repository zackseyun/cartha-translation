revisions:
- from: 耶稣说：“天国[a]好比一个人，他的田里藏着一份宝藏，自己却不知道。他死后，把田留给了儿子。儿子也不知道，就接手那块田，把它卖了。买田的人来了，耕地时发现了宝藏[b]，便开始把钱借给任何他愿意借的人，收取利息。”
  to: 耶稣说：“国度[a]好比一个人；他的田里有一份藏着的宝藏，他自己却不知道。后来他死了，把那宝藏留给了儿子。儿子也不知道；他接手了那块田，把它卖了。买了田的人来耕作时，发现了那宝藏[b]，便开始向自己愿意借给的任何人放贷取息。”
  rationale: 修订依据科普特文本的词义和代词性别：以“国度”忠实呈现ⲡⲙⲛⲧⲣⲣⲟ，并将“留下”的对象改为“宝藏”。保留买主在耕作中发现宝藏的伴随情状，以及明确的放贷取息，未添加寓意、伦理判断或教派性解释。
