base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/017.yaml
  text: Jesus said[a], “I will give you what eye has not seen, and what ear has not heard[e][d][c][b], and what hand has not touched—and it has not arisen upon the human heart.”
translation:
  language: zh_hans
  text: 耶稣说：“我要[e]把眼睛未曾看见、耳朵未曾听见、手未曾触摸过的[d]，以及未曾升到人心上[b]的，赐给你们[a]。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们”在科普特语中是复数。
    reason: dialect_note
  - marker: b
    text: 原文直译为“在人心上”或“升到人心上”，不是较为顺畅的“进入人心”。
    reason: lexical_alternative
  - marker: c
    text: 可参以赛亚书64:4和哥林多前书2:9中“眼睛未曾看见……”这一相近的组合；这里仍按科普特语原文翻译。
    reason: cross_reference
  - marker: d
    text: 抄本第一分句在感知动词后明确写出代词性宾语，意为“看见它”；其余分句也以代词形式指向同一未明说的对象。规范化文本统一呈现了这种关系。
    reason: textual_variant
  - marker: e
    text: 抄本写的是普通的第一人称单数将来式“我要给”，并没有独立强调代词；因此不译作“我亲自要给”。
    reason: textual_variant
lexical_decisions:
- source_word: ϯⲛⲁϯ
  choice: 我要……赐给
  rationale: 抄本原文是普通的第一人称单数将来式，意为“我将给”；不加入原抄本没有的强调代词“我亲自”。“赐给”符合耶稣发言的庄重语域，同时保留“给”的基本意义。
- source_word: ⲛⲏⲧⲛ̄ / ⲛⲁⲛⲧⲱⲧⲛ
  choice: 给你们
  rationale: 间接受词为第二人称复数；现代汉语用“你们”可直接表达其数。
- source_word: ⲙ̄ⲡⲉⲃⲁⲗ ⲛⲁⲩ ⲉⲣⲟϥ
  choice: 眼睛未曾看见的
  rationale: 保留否定完成体与概括性的单数身体器官表达；汉语用“未曾”自然体现截至此时从未发生。
- source_word: ⲙ̄ⲡⲉⲙⲁⲁϫⲉ ⲥⲟⲧⲙⲉϥ
  choice: 耳朵未曾听见的
  rationale: 与“眼睛未曾看见”保持平行，直接传达听觉感知。
- source_word: ⲙⲡⲉϭⲓϫ ϭⲙ̄ϭⲱⲙϥ̅
  choice: 手未曾触摸过的
  rationale: ϭⲙϭⲱⲙ在此表示触觉接触或摸到；“触摸过”比“掌握”更适合眼、耳、手构成的感官排比。
- source_word: ⲙ̄ⲡⲉϥⲉⲓ ⲉϩⲣⲁⲓ̈
  choice: 未曾升到
  rationale: ⲉϩⲣⲁⲓ具有“向上、升起”的方向意象；不顺译成“进入”，以保留《多马福音》此处独特的措辞。
- source_word: ϩⲓ ⲫⲏⲧ
  choice: 到人心上
  rationale: ϩⲓ本义接近“在……上、到……上”；译作“心上”既保留表面/上方意象，也符合现代汉语表达。
- source_word: ⲣ̄ⲣⲱⲙⲉ / ⲡⲣⲱⲙⲉ
  choice: 人
  rationale: 此处泛指人类或人；现代汉语的“人心”自然、无性别限定，也不必机械复制科普特语定冠词。
theological_decisions:
- issue: 末句与前三个感官分句所指是否完全相同
  choice: 以“以及……的”并列，保留其为同一受赐之物的自然读法，但不额外说明其本体
  alternative: 译成独立句“而它也未曾升到人心上”
  rationale: 科普特语以连接词继续陈述同一未明说之对象；中文并列结构既保持关联，又不把对象解释成某种特定启示、天国或救恩。
- issue: “升到人心上”的意义
  choice: 保留方向性意象
  alternative: 解释性地译作“进入人的思想”或“被人想到”
  rationale: 原文可引出思想、想象或内在领受等不同理解；直译意象可避免提前消解这种神学与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“眼睛—耳朵—手—人心”的递进排比，并用“未曾”统一否定完成体。句法略带格言式庄重感，但避免生硬地逐词仿造科普特语。
