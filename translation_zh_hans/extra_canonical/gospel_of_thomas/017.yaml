  terminology: “耶稣”“赐给”“人心”等用语一致且语域恰当；未引入任何教派性解释。“你们”正确反映复数。脚注e正确依据实际抄本的ϯⲛⲁϯ，避免把规范化文本所呈现的ⲁⲛⲟⲕ误作抄本中独立的强调代词。
