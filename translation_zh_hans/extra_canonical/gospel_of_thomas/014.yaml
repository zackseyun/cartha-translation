base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/014.yaml
  text: Jesus said to them[1], "If you fast, you will acquire a sin for yourselves; and if you pray, you will be condemned; and if you give alms, you will do evil to your spirits. And if you go into any land and walk in the regions, if they receive you, eat what they set before you, and heal the sick among them. For what goes into your mouth will not defile you, but what comes out of your mouth[3][2], that is what will defile you."
translation:
  language: zh_hans
  text: '耶稣对他们说：“如果你们禁食，就会给自己招来罪[a]；如果你们祷告，就会被定罪[b]；如果你们施舍，就会伤害你们的灵[c]。


    “无论你们进入哪一片土地，在各地行走，若有人接待你们，摆在你们面前的，就吃；他们中间患病的，就医治[d]。因为进入你们口里的，不会玷污你们；但从你们口里出来的，才会玷污你们。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “招来”所译的科普特语动词也可译作“生出”或“获得”；较字面的译法是“给自己生出罪来”。
    reason: 保留 ϫⲡⲟ 的词义幅度及原文突兀、强烈的表达。
  - marker: b
    text: 原文直译为“他们会定你们的罪”；这里的不定主语“他们”通常用来表达被动。
    reason: 说明科普特语被动式习语，避免把“他们”误认作一群特定的人。
  - marker: c
    text: 原文的“灵”为单数，由复数的“你们”领属，也可理解为“你们各人的灵”。
    reason: 保留数的一致关系所带来的集合性或个体性歧义。
  - marker: d
    text: 原文采用强调性的主题结构，近似直译为：“摆在你们面前的，吃它；他们中间患病的，医治他们。”
    reason: 说明译文所保留的主题前置和命令语气，并交代“他们中间”指接待门徒的人群。
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: 招来
  rationale: 该动词可指“生出、获得、招致”。与“罪”搭配时，“给自己招来罪”在现代汉语中自然，也保留行为使罪临到自身的强烈意味；脚注注明更字面的可能译法。
- source_word: ⲕⲁⲧⲁⲕⲣⲓⲛⲉ
  choice: 被定罪
  rationale: 这是源自希腊语 κατακρίνω 的借词，意为“定罪”。科普特语用不定主语的第三人称复数表达被动，汉语译作“被定罪”最自然。
- source_word: ⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  choice: 施舍
  rationale: 源自希腊语 ἐλεημοσύνη，指向穷人施予财物；“施舍”是简洁、通行且符合宗教语境的现代汉语表达。
- source_word: ⲕⲁⲕⲟⲛ
  choice: 伤害
  rationale: 字面义为“恶、坏事”。在“对你们的灵行恶”这一结构中译作“伤害”较自然，同时不淡化原文对施舍行为的尖锐否定。
- source_word: ⲕⲱ ϩⲁ-
  choice: 摆在……面前
  rationale: 该习语字面为“放在……之下”，在待客和食物语境中表示“摆在某人面前”。
- source_word: ϫⲱϩⲙ̄
  choice: 玷污
  rationale: 该词表示使之不洁、污染，既可带礼仪含义，也可带道德含义；“玷污”保留这两层可能。
theological_decisions:
- issue: 对禁食、祷告和施舍的反常评价
  choice: 直接保留“招来罪、被定罪、伤害你们的灵”的尖锐表述
  alternative: 将其解释为对虚伪、错误方式或特定情境下宗教行为的批评
  rationale: 原文没有加入“虚伪地”“以错误方式”等限制语。译文不替文本化解其刻意造成的神学张力。
- issue: 入口之物与出口之物所造成的玷污
  choice: 保留“不会玷污／会玷污”的绝对对比
  alternative: 把“出口之物”明确解释为恶言或内心之恶
  rationale: 原文只说从口里出来的，并未进一步界定内容；译文保留其概括性与歧义，不作解释性增补。
- issue: “你们的灵”的数与所指
  choice: 译作“你们的灵”
