base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/089.yaml
  text: Jesus said[3][2][1], "Why do you wash the outside of the cup?[1] Do you not know[2] that the one who made[3] the inside is also the one who made[3] the outside?"
translation:
  language: zh_hans
  text: 耶稣说：“你们为什么洗杯子的外面？[a]难道你们不知道，那造里面的，不也造了外面吗？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外面”直译为“杯子外边的那一面”；后文“里面”采用与之相配的表达。
    reason: 说明原文内外短语的结构对应。
  - marker: b
    text: “知道”也可译作“明白”或“意识到”；“造”也可译作“制作”或“塑造”。原文在这里没有重复前面的“洗”字。
    reason: 交代词义范围，并保留“洗”与“造”的关键对比。
lexical_decisions:
- source_word: ⲉⲓⲱⲉ
  choice: 洗
  rationale: 该动词的基本义是洗涤；用于杯子时，“洗”具体、自然，也保留了它与后文“造”的区别。
- source_word: ⲡⲥⲁ ⲛⲃⲟⲗ / ⲡⲥⲁ ⲛϩⲟⲩⲛ
  choice: 外面 / 里面
  rationale: 两个短语结构对应，直指杯子的外侧与内侧；用成对的“外面／里面”既自然又保留原文的平行。
- source_word: ⲡⲡⲟⲧⲏⲣⲓⲟⲛ
  choice: 杯子
  rationale: 这是源于希腊语 ποτήριον 的借词，在此指普通的杯；“杯子”是现代汉语中自然、无标记的表达。
- source_word: ⲣ̄ⲛⲟⲉⲓ
  choice: 知道
  rationale: 该词也可表示“明白”或“意识到”；“知道”保留较直接而中性的认知含义。
- source_word: ⲧⲁⲙⲓⲟ
  choice: 造
  rationale: 该词表示制作、塑造；“造”简洁地表达制造之意，并避免与前面的“洗”混同。
- source_word: ⲟⲛ
  choice: 也
  rationale: 此处表示追加和同一主体兼具两项行动；“也”准确传达其并列包含关系。
theological_decisions:
- issue: “造里面的”与“造外面的”是否指创造主
  choice: 保留“那一位”的泛指关系，不明确加上“上帝”或“创造主”
  alternative: 译作“创造里面的上帝，也创造了外面”
  rationale: 原文使用关系结构“造……的那一位”，并未明说身份。直译可保留其神学指向以及原有的含蓄性。
translation_notes:
  register: 采用简洁、庄重而口语可懂的现代标准汉语。问句保持原文直接的诘问语气；“外面／里面”和“洗／造”的对照清晰呈现，不补入原文未明说的神学主体。
