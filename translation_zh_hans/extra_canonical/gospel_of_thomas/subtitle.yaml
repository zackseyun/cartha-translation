translation:
  language: zh_hans
  text: 《多马福音》[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “福音”也可译作“好消息”。原词 ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ 借自希腊语 εὐαγγέλιον；作为文献体裁和书名，通常译作“福音”。
    reason: lexical_alternative
  - marker: b
    text: 科普特原文的标题结构直译为“福音，按照多马”（ⲡⲕⲁⲧⲁ ⲑⲱⲙⲁⲥ，意为“按照多马”）。这是一种固定的标题格式，表示作品与多马有关联或归属；它本身不必然是现代意义上的作者署名。
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: 福音
  rationale: 该词借自希腊语 εὐαγγέλιον，本义可理解为“好消息”；但在古代抄本的文献标题中，“福音”是现代汉语中通行、庄重且最易辨识的体裁名称。
- source_word: ⲡⲕⲁⲧⲁ
  choice: 以“《多马福音》”这一汉语书名结构表达
  rationale: ⲕⲁⲧⲁ 借自希腊语 κατά，在抄本标题套语中表示“按照……／据……所传”。现代汉语惯用“《多马福音》”作书名；若直译为“按照多马的福音”，虽更形式对应，却不如通行书名自然。相关含义在脚注中保留。
- source_word: ⲑⲱⲙⲁⲥ
  choice: 多马
  rationale: 采用该人名在现代中文基督教及相关学术文献中的标准译名。
theological_decisions:
- issue: 标题是否断言多马为作者
  choice: 正文采用传统书名《多马福音》，脚注说明原文是“按照多马”的标题套语
  alternative: 多马所著的福音
  rationale: 原文 κατά／ⲕⲁⲧⲁ 表示归属或传承关系，并不明确等同于现代意义上的作者署名；避免把标题强化为确定的著者声明。
translation_notes:
  register: 采用现代标准汉语的通行书名形式，简洁、庄重，适合作为副标题。正文保留两处脚注标记，以解释“福音”的词义范围及“按照多马”这一古代标题格式。
