review_pass:
  verdict: approve
  source_fidelity: 译文准确反映科普特文的两组将来/条件式结构：使“二者”为一，便成为“人”的儿子；对山发令，它便移开。尤其正确将ⲉⲧⲉⲧⲛ̄ϣⲁⲛ⳿ϫⲟⲟⲥ理解为“当你们说（如下的话）”，没有采纳英语审校轨迹先前已纠正的“高声说”误读。未擅自落实“二者”的含义，也没有把复数短语ⲛϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ改造成单数固定称号“人子”。
  naturalness: “当……时……就会……”及“山，移开吧！”均为自然、简洁的现代汉语，适合格言式语境。“二者合而为一”庄重而不晦涩；“它就会移开”对“山”的回指明确。
  terminology: “‘人’的儿子”保留原文复数表达及其有意陌生的“人”短语，不预设其等同于“人子”称号。虽然汉语的“儿子”不显性标示复数，但在“你们就会成为”这一复数主语支配下可自然作分配性复数理解。脚注恰当地提示“儿女”这一可能译法，并说明不采用“人子”的理由。
