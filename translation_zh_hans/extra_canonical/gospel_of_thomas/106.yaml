base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/106.yaml
  text: Jesus said[a], “When you make the two one, you will become sons of the Human; and when you say, ‘Mountain[e][d][c][b], move away,’ it will move.”
translation:
  language: zh_hans
  text: 耶稣说：“当你们使二者合而为一时，你们就会成为‘人’的儿子[a]；当你们说：‘山，移开吧！’它就会移开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “‘人’的儿子”也可译作“‘人’的儿女”。科普特语ϣⲏⲣⲉ在复数中可作集合称呼；正文保留较直译的“儿子”，且不把这个复数短语改写成固定称号“人子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ … ⲉⲣϣⲁⲛ
  choice: 当……时
  rationale: 这一结构引出带将来意味的条件或时间从句；“当……时”简洁自然，并保留话语实现后的结果关系。
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: 使二者合而为一
  rationale: 保留“二者／一”的鲜明对照和格言式含混；“合而为一”符合现代汉语，但不说明二者具体所指。
- source_word: ⲛϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ
  choice: ‘人’的儿子
  rationale: ϣⲏⲣⲉ直译为“儿子”，复数意义由主语“你们”和整体句法表达；给“人”加引号，以保留定冠词短语可能具有的特殊称谓色彩，同时避免直接套用规范化的“人子”称号。
- source_word: ⲉⲧⲉⲧⲛ̄ϣⲁⲛ⳿ϫⲟⲟⲥ / ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛϫⲱⲛⲧⲟⲥ
  choice: 当你们说
  rationale: 手稿的ϫⲟⲟⲥ是“说”加后缀代词“它”，该代词前指或预示后面的直接引语；不能把规范化分词误读成“高声地”。汉语引出直接引语时不必另译“它”。
- source_word: ⲡⲧⲟⲟⲩ
  choice: 山
  rationale: 原文虽带定冠词，但在直接呼语中汉语自然译作“山”，不另加“那座”。
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: 移开吧
  rationale: 动词与方向成分合起来表示移走、挪开；“移开”既准确又适合作为对山发出的命令。
- source_word: ϥⲛⲁⲡⲱⲱⲛⲉ
  choice: 它就会移开
  rationale: 保留将来标记以及条件实现后随之发生的结果；代词明确回指“山”。
theological_decisions:
- issue: ⲡⲣⲱⲙⲉ是否套用“人子”这一固定称号
  choice: 译作“‘人’的儿子”
  alternative: 人子；那人的儿子；人的儿女
  rationale: 原文是复数“儿子”加定冠词名词“人”，并非句法上的单数称号“人子”。此译保留《多马福音》措辞的陌生感与潜在称谓色彩，又不预先断定它等同于对观福音中的固定称号。
- issue: “使二者为一”的所指
  choice: 不加解释性对象
  alternative: 使内外、男女或分裂的自我合一
  rationale: 本句没有说明“二者”是什么；译文应保留其真正的开放性，不把某种神学或人类学解释写入正文。
translation_notes:
  register: 采用简洁、庄重而现代的格言体。正文维持原句的两个条件分句及其递进关系；不增补“高声地”，因为手稿中的后缀代词属于“说它”的结构，并非方式副词。引号中的“人”用于提示原文定冠词短语的特殊性，而非断言某一教义身份。
