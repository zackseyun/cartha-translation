base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/062.yaml
  text: Jesus said[1], "I tell my mysteries to those [who are worthy] of [my] mysteries. What your right hand will do[4][3][2], do not let your left hand know what it is doing."
translation:
  language: zh_hans
  text: 耶稣说：“我把我的奥秘告诉那些配得我的奥秘的人。[a] 你的右手要做什么，不要让你的左手知道它在做什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本此处有残损；“配得”及后一处“我的”是根据残存字迹、上下文和古代平行材料所作的通行补复。
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲩⲥⲧⲏⲣⲓⲟⲛ
  choice: 奥秘
  rationale: 这是希腊语 μυστήριον 的借词；科普特语所有格冠词显示此处为复数概念。汉语“奥秘”本身不强制标示单复数，重复作“我的奥秘”既自然，也不额外把它解释成秘密教义。
- source_word: ⲙⲡϣⲁ
  choice: 配得领受
  rationale: 该词表示“配得、值得”。补入“领受”使现代汉语对象关系清楚，但不规定这种配得的依据。
- source_word: ⲟⲩⲛⲁⲙ
  choice: 右手
  rationale: 该词可指“右边、右手”；与后文“左手”成明确对举，因此译作“右手”。
- source_word: ϩⲃⲟⲩⲣ
  choice: 左手
  rationale: 标准含义为“左边、左手”；在肢体对举中译作“左手”。
theological_decisions:
- issue: 右手与左手之言的语境
  choice: 按《多马福音》现有措辞保留为紧接“奥秘”陈述的格言
  alternative: 依《马太福音》6:3明确解释为暗中施舍
  rationale: 本句没有提到施舍。译文不从正典平行经文补入对象，也不武断断定它专指秘传教导，从而保留文本自身的张力。
- issue: “配得”的含义
  choice: 保留资格判断，但不说明谁判定或凭什么配得
  alternative: 解释为已经受教、属灵成熟或属于特定群体的人
  rationale: 原文只表达“配得”，没有交代标准；译文不导入特定宗派或解释传统。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“把……告诉……”清楚表达说话与受词的关系；第二句保留右手、左手的形象和未来/预期语气，不补入“施舍”等原文没有的内容。
