base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/066.yaml
  text: Jesus said, "Show me this stone that the builders threw out; it is the cornerstone."[a][b][c][d]
translation:
  language: zh_hans
  text: 耶稣说：“把建造者所扔掉的这块石头指给我看；它就是房角石。”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使我看见”，意思是“指给我看”。
    reason: lexical_alternative
  - marker: b
    text: “扔掉”也常译作“弃绝”；原文用的是较具体的“扔出去”。
    reason: lexical_alternative
  - marker: c
    text: “房角石”直译为“角的石头”；原文没有说明它具体是墙基的角石还是其他转角处的石头。
    reason: lexical_alternative
  - marker: d
    text: 参见《诗篇》118:22（七十士译本117:22）；这句话也见于《马可福音》12:10、《马太福音》21:42、《路加福音》20:17、《使徒行传》4:11和《彼得前书》2:7。
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲧⲥⲁⲃⲟⲁⲛⲟⲕ
  choice: 指给我看
  rationale: 这一结构直译为“使我看见”或“给我看”；“指给我看”符合现代汉语习惯，也保留命令式的语气。
- source_word: ⲡⲱⲛⲉ ⲡⲁⲓ
  choice: 这块石头
  rationale: 保留指示词所表达的明确指向；量词“块”使中文自然。
- source_word: ⲛ̄ⲧⲁⲩⲥⲧⲟϥ ⲉⲃⲟⲗ
  choice: 扔掉
  rationale: 原动词具有“扔出去”的形象含义；不直接译作“弃绝”，以免把具体意象抽象化。
- source_word: ⲛ̄ϭⲓ ⲛⲉⲧ ⲕⲱⲧ
  choice: 建造的人
  rationale: 按原文保留“那些建造的人”的描述性表达；相比“工匠”，不额外限定其职业身份。
- source_word: ⲡⲱⲛⲉ ⲛⲕⲱϩ
  choice: 房角石
  rationale: 原意为“角的石头”；“房角石”是现代中文圣经语境中自然且易懂的固定表达，同时保留石头与建筑的意象。
theological_decisions:
- issue: “扔掉”是否应解释性译为“弃绝”
  choice: 扔掉
  alternative: 弃绝
  rationale: 科普特语的动词首先呈现具体的抛出动作；译文保留这一生动措辞，不在正文中预先决定其比喻或神学含义。
- issue: “角的石头”的具体建筑功能
  choice: 房角石
  alternative: 基石／拱顶石
  rationale: 原文没有明确说明石头位于墙基还是拱顶；采用较宽泛的传统称谓“房角石”，不把歧义收窄为某一种建筑构件。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“建造的人”贴近原文而不生硬；“扔掉”保留具体动作和言语张力；分号对应原句由指示到断言的转折。
