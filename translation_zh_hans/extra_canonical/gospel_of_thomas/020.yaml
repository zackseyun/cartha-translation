base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/020.yaml
  text: The disciples said to Jesus[a], “Tell us what the kingdom of the heavens is like.” He said to them, “It is like a mustard seed—the smallest of all seeds; but when it falls upon worked soil[f][e][d][c][b], it produces a great branch and becomes a shelter for the birds of the sky.”
translation:
  language: zh_hans
  text: 门徒对耶稣说：“请告诉我们，诸天之国[a]像什么？”他对他们说：“它像一粒芥菜种[b]，比所有种子都小；但它落在耕作过的土里[c]时，就长出一根大枝子，并成为天上飞鸟的荫蔽处[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文近于“请告诉我们，诸天之国像什么？”此处“天／诸天”也常按惯用法译作“天国”。
    reason: lexical_alternative
  - marker: b
    text: 字面为“一粒芥菜的籽粒”。
    reason: lexical_alternative
  - marker: c
    text: “耕作过的土”原文近于“人们在其上劳作的土地”，是指经过耕种的土壤。
    reason: cultural_note
  - marker: d
    text: “荫蔽处”也可译作“遮蔽处”“庇护处”或“阴凉处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: 请告诉我们
  rationale: 该祈使结构直译为“对我们说”，现代汉语以“请告诉我们”自然传达请求语气。
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲡⲉ
  choice: 诸天的国
  rationale: ⲙⲛⲧⲣⲣⲟ可指国、王权或统治；此处保留熟悉的“国”。ⲡⲡⲉ在该短语中宜作“天”，译作“诸天”以保留原文的复数意味。
- source_word: ⲉⲛⲓⲙ
  choice: 像什么
  rationale: 该疑问表达询问相似性或样态；“像什么”自然衔接下文的比喻。
- source_word: ⲁⲟⲩⲃⲗⲃⲓⲗⲉ ⲛϣⲗⲧⲁⲙ
  choice: 一粒芥菜种
  rationale: 字面为“一粒芥菜的籽粒”；“一粒芥菜种”在现代汉语中简洁自然，并保留颗粒意象。
- source_word: ⲛⲧⲟⲥ ⲥⲃⲟⲕ ⲡⲁⲣⲁⲡϭⲣⲟϭ ⲧⲏⲣⲛⲧⲟⲟⲩ
  choice: 比所有种子都小
  rationale: 保留原文比较式的表达，不强行改写成绝对命题“最小”。
- source_word: ⲉⲣϣⲁⲛ ⲛⲧⲟⲥ ϩⲉ ⲉϫⲛⲡⲕⲁϩ
  choice: 它落在……土里时
  rationale: 时间结构译为“……时”；农业语境下ⲕⲁϩ译作“土”，汉语中种子“落在土里”较自然。
- source_word: ⲉⲧⲉⲣⲉ ⲛⲧⲟⲟⲩ ⲣϩⲱⲃ ⲉⲛⲧⲟϥ
  choice: 耕作过的
  rationale: 原文近于“人们在其上劳作的”，在农业语境中指经过耕作的土地。
- source_word: ϣⲁⲣⲉⲛⲧⲟϥ ⲧⲉⲩⲟ ⲉⲃⲟⲗ ⲛⲟⲩⲛⲟϭ ⲛⲧⲁⲣ
  choice: 就长出一根大枝子
  rationale: ⲧⲁⲣ指枝、枝条；动词短语有使之发出、长出的含义，故译作“长出一根大枝子”。
- source_word: ⲥⲕⲉⲡⲏ
  choice: 荫蔽处
  rationale: 该词可指遮蔽、庇护或荫凉处；“荫蔽处”兼顾枝叶所成的阴蔽与飞鸟获得遮护的意象。
- source_word: ϩⲁⲗⲏⲧ ⲛⲡⲡⲉ
  choice: 天上飞鸟
  rationale: 字面为“天的鸟”；现代汉语以“天上飞鸟”自然表达。
theological_decisions:
- issue: ⲡⲙⲛⲧⲣⲣⲟ应译作领域性的“国”还是动态的“统治”
  choice: 国
  alternative: 王权／统治
  rationale: 原词兼有领域与统治的意义。这里采用“国”以维持比喻传统及通俗可懂性，但不据此排除动态的王权含义。
- issue: “天”在国度短语中的数
  choice: 诸天的国
  alternative: 天国
  rationale: 原文明确使用ⲡⲡⲉ“天／天空”的形式，译作“诸天”保存其复数意味，也避免直接同化为固定术语“天国”。
- issue: 种子的大小陈述
  choice: 比所有种子都小
  alternative: 是所有种子中最小的
  rationale: 原文以比较结构表达，可自然产生最高级含义；选用比较式以较贴近措辞，并不替该陈述作植物学或象征性解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙述体。保留简短的问答和比喻节奏；使用“诸天的国”呈现原文措辞，以脚注说明较熟悉的译法。“大枝子”忠实于ⲧⲁⲣ的具体枝条意象，避免误译为“大植物”。
