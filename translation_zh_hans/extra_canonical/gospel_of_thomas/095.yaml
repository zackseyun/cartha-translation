base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/095.yaml
  text: Jesus said[a], “If you have money, do not lend at interest; rather[f][e][d][c][b], give it to the one from whom you will not take it back.”
translation:
  language: zh_hans
  text: 耶稣说[a]：“如果你们有钱，不要放贷取利[b]；倒要把钱给那位你们不会从他那里把钱收回的人。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 手稿这一句开头略有残损，“耶稣说”是根据残存字迹和本书反复出现的引语格式复原的。
    reason: lacuna_or_restoration
  - marker: b
    text: 原词指“利息”。在古代语境中，英语“usury”可泛指一切按利息放贷，并不只指利率过高的借贷；本句不限定利率的高低。
    reason: cultural_note
  - marker: c
    text: 末句的句法方向有歧义。正文按较常见的理解译为“你们不会从他那里把钱收回的人”；也可理解为“不会把钱还给你们的人”。手稿在“给”之后有轻微残损：残存文字可能支持“把它给出”，规范文本则可读作“给他”。两种读法都指向把钱给由后面关系从句所限定的人。原文以复数代词指钱，可能把钱设想为一枚枚钱币。
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ⲉϣⲱⲡⲉ
  choice: 如果
  rationale: 这是条件标记，在这里表达一般性的条件，而不是确定的时间先后。
- source_word: ⲟⲩⲛⲧⲁⲛⲧⲱⲧⲛ ϩⲟⲙⲧ
  choice: 你们有钱
  rationale: 科普特语用存在结构表达领有；现代汉语自然译作“你们有钱”。
- source_word: ϩⲟⲙⲧ
  choice: 钱
  rationale: 该词可指铜钱、钱币或钱财；此处泛指可供借贷或给予的钱。
- source_word: ⲙⲡⲣϯ ⲉⲡⲙⲏⲥⲉ
  choice: 不要放贷取利
  rationale: ϯ 与 ⲉ 加“利息”构成按利息借出的金融表达；“放贷取利”既自然，也保留收取利息之意。
- source_word: ϯ ⲛⲛⲧⲟϥ / ϯ̣ ⲙ̣[ⲙⲟϥ]
  choice: 倒要把钱给那……的人
  rationale: 规范文本可理解为“给他”，手稿残存文字也可能是“把它给出”；汉语补出“把钱”，可自然表达两种读法共有的整体意义。
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁϫⲓⲛⲧⲟⲟⲩ ⲁⲛ ⲛⲧⲛⲛⲧⲟϥ
  choice: 那你们不会向他收回的人
  rationale: 按“你们不会从他那里取回它们”的常见句法理解翻译；“收回”自然传达取回所给钱财的意思。
theological_decisions:
- issue: 本句对利息和给予对象的伦理要求应译作绝对命令还是一般劝诫
  choice: 保留原文直接的命令形式：“不要……；倒要……”
  alternative: 弱化为“最好不要……而应当……”
  rationale: 原文使用否定命令和肯定命令；译文不把其适用范围扩展或缩小，也不引入特定教派对借贷、施舍或放债的解释。
- issue: 末句行为方向存在句法歧义
  choice: 正文采用“你们不会向他收回”
  alternative: “不会把钱还给你们的人”
  rationale: “从那人手中取回”的分析较合乎所给规范文本及常见读法，但另一方向仍有可能，因此在脚注中明确保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“放贷取利”比直译“给利息”清楚，又不使用容易让现代读者误以为仅指过高利率的“高利贷”。末句用“向他收回”保留财物移动的方向；脚注交代可反向分析的真实歧义及手稿残损。
