base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/039.yaml
  text: Jesus said[a], “The Pharisees and the scribes have received the keys of knowledge; they have hidden them. They did not enter, and they did not allow those who wished to enter[e][d][c][b]. But you—become prudent like serpents and innocent like doves.”
translation:
  language: zh_hans
  text: 耶稣说：“法利赛人和经学家拿到了知识的钥匙，却把钥匙藏了起来。他们自己没有进去，也不让那些想进去的人进去。[a] 至于你们，要像蛇一样机敏，像鸽子一样纯真。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参路加福音11:52（“知识的钥匙”）和马太福音23:13（阻挡人进去），两处与本句主题相近。
    reason: cross_reference
  - marker: b
    text: 手稿正文这里用复数形式，直译为“像众蛇……像众鸽子”；汉语以“像蛇……像鸽子”作类比，已可表达同类事物的一般特性。参马太福音10:16的相近说法。
    reason: textual_and_cross_reference
lexical_decisions:
- source_word: ⲡⲫⲁⲣⲓⲥⲁⲓⲟⲥ
  choice: 法利赛人
  rationale: 科普特文以单数形式作群体称谓；现代汉语用复数概念的“法利赛人”自然传达这一集体所指。
- source_word: ⲡⲅⲣⲁⲙⲙⲁⲧⲉⲩⲥ
  choice: 经学家
  rationale: 指熟悉并讲授宗教经典与律法的文士阶层；“经学家”比单纯“文士”更便于现代普通读者理解，同时不过度限定其职能。
- source_word: ϫⲓ
  choice: 拿到了
  rationale: 该动词可表示“拿、取得、领受”；完成体强调已经取得且后果延续至今。“拿到了”也与随后“藏了起来”构成自然动作链。
- source_word: ϣⲁϣⲧ
  choice: 钥匙
  rationale: 手稿此处表达复数，汉语名词通常不以形态标复数；“知识的钥匙”可自然涵盖一把或多把，避免生硬添加“多把”。
- source_word: ⲅⲛⲱⲥⲓⲥ
  choice: 知识
  rationale: 虽是希腊语借词，此处无需技术化为“灵知”；译作普通的“知识”保留语义开放性。
- source_word: ϩⲱⲡ
  choice: 藏了起来
  rationale: 准确表达“隐藏、遮藏”，并与钥匙这一具体宾语自然搭配。
- source_word: ⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: 进去
  rationale: 直译为“往里面去”；中文“进去”简洁保留空间隐喻，不擅自说明进入何处。
- source_word: ⲟⲩⲱϣ
  choice: 想
  rationale: 表达意愿，现代汉语自然清楚，语气不过分书面。
- source_word: ⲕⲁⲁⲩ
  choice: 让
  rationale: 手稿原文意为没有放任或准许他们；“不让……进去”准确且符合现代汉语习惯。
- source_word: ϣⲱⲡⲉ
  choice: 要……
  rationale: 本义为“成为、做”；在劝诫句中以“要……”表达命令或劝勉，比机械译成“变得”更自然。
- source_word: ⲫⲣⲟⲛⲓⲙⲟⲥ
  choice: 机敏
  rationale: 兼有明智、审慎、精明之意；“机敏”保留与蛇有关的实际智慧，又避免将其定性为奸诈。
- source_word: ⲁⲕⲉⲣⲁⲓⲟⲥ
  choice: 纯真
  rationale: 希腊语借词可指纯净、无杂质、无恶意；“纯真”在此与“机敏”形成自然而不互相消解的张力。
theological_decisions:
- issue: “知识”是否应译作带诺斯替色彩的术语
  choice: 知识
  alternative: 灵知
  rationale: 源词虽为希腊语借词 ⲅⲛⲱⲥⲓⲥ，但本句自身不足以证明技术性的宗派含义；用普通词“知识”避免把后来的思想体系预先带入文本。
- issue: “进去”的目标是什么
  choice: 保留绝对用法“进去”
  alternative: 进入天国／进入知识之门
  rationale: 原文没有明说所进入的对象。译文保留空间隐喻及其含混性，不借平行经文补足神学对象。
- issue: 蛇与鸽子的伦理对比
  choice: 机敏／纯真
  alternative: 有智慧／无邪
  rationale: 所选措辞保留实践智慧与道德纯正之间的张力，不把蛇的形象解释成欺诈，也不把鸽子的形象缩减为幼稚。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“钥匙—藏起—进去”的连续隐喻，不补出门、国度或知识领域。“至于你们”突出原文转折与对照。动物比喻按手稿原貌理解为复数类别，但依汉语通用类指表达译为无数量标记的“蛇”“鸽子”。
