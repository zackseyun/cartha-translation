base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/076.yaml
  text: 'Jesus said[a], “The Reign of the Father is like a merchant. He had a consignment of goods, and he found a pearl. The merchant was prudent: he sold the consignment and bought the one pearl for himself. You too, seek his treasure that does not fail, that endures—the place where no moth comes in to eat it[e][d][c][b], and no worm destroys.”'
translation:
  language: zh_hans
  text: 耶稣说：“父的国好比一个商人。他有一批货物，又发现了一颗珍珠。那商人很精明，就卖掉那批货物[a]，为自己买下那一颗珍珠。你们也要寻求他那永不耗尽、长存的宝藏[b]；在那里，蛾子不会进去啃食，虫子也不会毁坏[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卖掉”直译近于“把……给出去”；在前后买卖的语境中，指将货物出售或变现。
    reason: lexical_alternative
  - marker: b
    text: “他那……宝藏”：抄本此处有书写和改写痕迹；译文采用校订本的规范读法，作“他的宝藏”。
    reason: lacuna_or_restoration
  - marker: c
    text: 原文说的是“虫子”，不是某些相似传统中的“锈”；这里描绘的是蛾啃食和虫子造成的毁坏。
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: 父的国
  rationale: ⲙⲛⲧⲣⲣⲟ可指王权、统治或国度；“父的国”在现代汉语中自然庄重，并保留国度与统治两方面的开放性。
- source_word: ⲣⲱⲙⲉ ⲛϣⲱⲧ / ⲡϣⲱⲧ
  choice: 商人
  rationale: 字面为“经商的人”，后文又以交易名词回指此人；“商人”准确而自然。
- source_word: ⲫⲟⲣⲧⲓⲟⲛ
  choice: 一批货物
  rationale: 该希腊语借词本指载荷、货载；商业语境中“一批货物”比“重担”或“货运”更贴切。
- source_word: ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: 珍珠
  rationale: 这是希腊语μαργαρίτης的借词，标准义为“珍珠”。
- source_word: ⲥⲁⲃⲉ
  choice: 精明
  rationale: 表示智慧、明智；在商贸抉择的语境中，“精明”突出实际判断力，但不必带贬义。
- source_word: ϯⲡⲫⲟⲣⲧⲓⲟⲛ ⲉⲃⲟⲗ
  choice: 卖掉那批货物
  rationale: 字面近于“把货物给出去”；与随后的“买下”相对，在交易语境中自然理解为出售。
- source_word: ⲧⲟⲟⲩ
  choice: 买下
  rationale: 该动词表示购买；“买下”符合汉语叙事与交易语境。
- source_word: ⲟⲩⲱⲧ
  choice: 那一颗
  rationale: 强调单一的一颗珍珠；“那一颗”保留其独一性和确定性。
- source_word: ϩⲱⲱⲛⲧⲱⲧⲛ
  choice: 你们也
  rationale: 这是强调兼加形式，意为“你们也／你们这方面也”，不另译为“为自己”，以免重复增译。
- source_word: ⲡⲉϥⲁϩⲟ
  choice: 他那……宝藏
  rationale: 按校订后的规范读法理解为“他的财富／宝藏”；此处与寻求及长存相连，“宝藏”最合语境。
- source_word: ⲱϫⲛ
  choice: 耗尽
  rationale: 该词可指终止、用完或耗竭；“永不耗尽”准确表达否定关系，并与宝藏搭配自然。
- source_word: ⲙⲟⲩⲛ ⲉⲃⲟⲗ
  choice: 长存不朽
  rationale: 基本义为持续、存留。“长存”对应原义；加“不朽”使其与前面的“永不耗尽”形成自然而庄重的汉语并列。
- source_word: ϫⲟⲟⲗⲉⲥ / ⲡϥⲛⲧ
  choice: 蛾子／虫子
  rationale: 分别指蛾与虫；保留原文两种有机侵蚀的意象，不改作“锈”。
theological_decisions:
- issue: ⲡⲙⲛⲧⲣⲣⲟ应译作“统治”还是“国”
  choice: 父的国
  alternative: 父的统治
  rationale: 原词兼有王权、统治与国度含义；“父的国”是现代中文宗教文本中自然且可理解的表达，又不把意象局限为纯抽象统治。
- issue: “他那宝藏”中代词的指向
  choice: 保留“他”
  alternative: 改译为“你们自己的”或直接译“那宝藏”
  rationale: 规范化科普特文本为第三人称所属形式，可能回指商人或比喻中的对象；译文不擅自消除这种指向上的张力。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。句式清楚简洁，保留比喻的商贸背景、珍珠的单一性、宝藏所属代词的歧义，以及蛾与虫的具体意象；避免把ϩⲱⲱⲛⲧⲱⲧⲛ误作反身代词。
