revisions:
- from: 耶稣说：“父的国好比一个商人。他有一批货物，又发现了一颗珍珠。那商人很精明，就卖掉那批货物[a]，为自己买下那一颗珍珠。你们也要寻求他那永不耗尽、长存不朽的宝藏[b]——在那里，没有蛾子进去蛀食，也没有虫子毁坏[c]。”
  to: 耶稣说：“父的国好比一个商人。他有一批货物，又发现了一颗珍珠。那商人很精明，就卖掉那批货物[a]，为自己买下那一颗珍珠。你们也要寻求他那永不耗尽、长存的宝藏[b]；在那里，蛾子不会进去啃食，虫子也不会毁坏[c]。”
  rationale: 修订仅处理两处轻微的忠实性与汉语表达问题：以“长存”对应持续、存留，避免“不朽”的额外强化；并将“地方”所引的蛾与虫意象清楚、自然地译为独立分句。其余译法均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:24Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实呈现了商人、货物、珍珠、出售与购买的叙事，也正确将ϩⲱⲱⲛⲧⲱⲧⲛ译作“你们也”，没有误增“为自己”。“为自己买下”则有原文第三人称间接宾语的根据。末句的地点关系宜在中文中更清楚地表达；原文的“长存”不必强化为“不朽”。
  naturalness: “蛾子进去蛀食”在现代汉语中不够自然，且“蛀”较偏向虫蛀。改作“蛾子不会进去啃食”更贴近原文“进去吃”，并保留对象省略的句法。将“在那里”另起分句，能避免把“宝藏”直接说成一个地点所造成的轻微不顺。
  terminology: “父的国”“商人”“一批货物”“珍珠”“宝藏”均适切、庄重且保留原文的开放性。“精明”可用，表达此处实际而审慎的智慧。
  issues:
  - severity: low
    issue: “长存不朽”略强化原文
    rationale: ⲙⲟⲩⲛ ⲉⲃⲟⲗ表达存留、持续；“不朽”在汉语中带有比“长存”更强的绝对意味。仅译“长存”已足以忠实表达。
