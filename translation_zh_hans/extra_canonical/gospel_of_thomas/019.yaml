base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/019.yaml
  text: Jesus said[a], “Blessed is the one who has come to be before he comes to be. If you become my disciples and listen to my words, these stones will minister to you. For you have five trees in Paradise; they do not move in summer or in winter, and their leaves do not fall[d][c][b]. Whoever comes to know them will not taste death.”
translation:
  language: zh_hans
  text: 耶稣说：“在尚未成为之前就已成为的人有福了。[a]如果你们成为我的门徒，听我的话，这些石头就会服侍你们。[b]因为你们在乐园里有五棵树；无论夏天或冬天，它们都不摇动，叶子也不落。认识它们的人，必不尝死味。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在尚未成为之前就已成为”直译原文中重复出现的“成为／开始存在”，保留其刻意的悖论；也有人将其具体理解为“出生以前就已存在”，但原文没有使用“出生”一词。
    reason: lexical_alternative
  - marker: b
    text: 现存抄本在此可读作复数：“我的话……这些石头”；本译文采用这一读法。所据版本的规范化文本则校订为单数：“我的话语……这块石头就会服侍你们。”
    reason: textual_variant
  - marker: c
    text: “尝死味”保留原文“尝死亡”的惯用表达，意思不是把死亡当作实物品尝；参见《马可福音》9:1和《马太福音》16:28中的相近说法。
    reason: cross_reference
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: 有福了
  rationale: 保留祝福语的庄重和格言色彩，不弱化为一般的“幸运”或“快乐”。
- source_word: ϣⲱⲡⲉ
  choice: 成为
  rationale: 原文前后重复同一动词，意为“成为、形成、开始存在”；中文也重复“成为”，以保留刻意的悖论，而不限定为“出生”。
- source_word: ⲉⲣϣⲁⲛ ⲛⲧⲱⲧⲛ ϣⲱⲡⲉ
  choice: 如果你们成为
  rationale: 该结构可表达将来条件或时间关系；此处用“如果”保留条件意味。
- source_word: ⲙⲁⲑⲏⲧⲏⲥ
  choice: 门徒
  rationale: 这是希腊语借词，在相关宗教语境中惯常指跟从并学习的人；“门徒”自然且准确。
- source_word: ⲥⲱⲧⲙ ⲉ-
  choice: 听从
  rationale: 表达专心听取的意味；“听从”较自然，但不在正文中进一步扩展为完全等同于“遵行”。
- source_word: ⲁⲛⲁϣⲁϫⲉ / ⲛⲉⲉⲓⲱⲛⲉ
  choice: 我的话／这些石头
  rationale: 依现存抄本表面文字按复数理解；现代汉语“话”本身可作集合名词，而“这些”明确呈现石头的复数。规范化文本的单数读法列入脚注。
- source_word: ⲛⲁⲣⲇⲓⲁⲕⲟⲛⲉⲓ
  choice: 会服侍
  rationale: 保留希腊语借词所带的服务、照料意味，并维持石头服侍人的奇异意象。
- source_word: ⲕⲓⲙ
  choice: 摇动
  rationale: 原词可指移动或受扰动；用于不受季节影响的树，“摇动”兼顾字面意象与自然中文。
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: 尝死味
  rationale: 保留科普特语“尝死亡”的惯用比喻及其格言式力度，不改写为单纯的“不会死”。
theological_decisions:
- issue: “在尚未成为以前就已经成为”所指的存在状态
  choice: 保留悖论，不说明为先存、出生或属灵觉醒
  alternative: 译为“出生以前就已存在”或“在成为自己以前已经存在”
  rationale: 原文只重复“成为／开始存在”这一动词，没有明确限定其本体论或人生阶段；直译能保留真实的神学张力。
- issue: 五棵树的象征意义
  choice: 仅译作“乐园里的五棵树”
  alternative: 解释为五种感官、属灵实体或生命树群
  rationale: 原文没有解释其象征所指，正文和脚注都不引入特定传统的释义。
- issue: “认识它们”与不尝死味的关系
  choice: 保留直接陈述
  alternative: 将“认识”解释为得救知识或神秘启蒙
  rationale: 原文陈述认识这些树的人不尝死亡，却未界定“认识”的性质；译文不替文本解决这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句特意保留重复的“成为”，不以更顺畅的解释性措辞消除原文悖论。“乐园”“门徒”“有福了”沿用普通读者熟悉的宗教语汇；“尝死味”略带经典格言色彩，以保存原文习语。所有脚注标记均已置于正文相应位置。
