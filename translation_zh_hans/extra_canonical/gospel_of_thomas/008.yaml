revisions:
- from: 他又说：“人[a]好比一个有智慧的渔夫。他把自己的网撒[b]进海里，又从海里把网拉上来，网中满是小鱼。在这些鱼中，那有智慧的渔夫发现[c]了一条又大又好的鱼。他把所有小鱼都扔回海里[d]，毫不费力[e]地选了那条大鱼。有耳可听的，就应当听！”
  to: 他对他们说：“人[a]好比一个有智慧的渔夫。他把自己的网撒[b]进海里，又从海里把网拉上来，网中满是小鱼。在这些鱼中，那有智慧的渔夫发现[c]了一条又大又好的鱼。他把所有小鱼都扔回海里[d]，毫不费力[e]地选了那条大鱼。有耳可听的，就让他听吧！”
  rationale: 修订仅处理两处细微但可安全校正之处：删除开头无原文依据的“又”，并以“就让他听吧”保留末句劝告式语气；同时使方言脚注准确说明抄本中ϩ代替ϥ的现象。其余译文和注释均保留，因为它们忠实、自然，并保留原比喻的解释开放性。
