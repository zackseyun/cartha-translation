base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/008.yaml
  text: And he said, "The human is like a wise fisherman who cast his net into the sea. He drew it up from the sea full of small fish. Among them, the wise fisherman found a large, fine fish. He threw all the small fish back down into the sea; he chose the large fish without difficulty. Whoever has ears to hear, let him hear."
translation:
  language: zh_hans
  text: 他对他们说：“人[a]好比一个有智慧的渔夫。他把自己的网撒[b]进海里，又从海里把网拉上来，网中满是小鱼。在这些鱼中，那有智慧的渔夫发现[c]了一条又大又好的鱼。他把所有小鱼都扔回海里[d]，毫不费力[e]地选了那条大鱼。有耳可听的，就让他听吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特语ⲡⲣⲱⲙⲉ可译作“人”或“那人”；此处作泛指，意思近于“一般的人”。
    reason: lexical_alternative
  - marker: b
    text: 抄本此处第三人称阳性单数后缀代词写作ϩ，而非常见的ϥ；这是本书常见的地域方言拼写特征。句义仍是“他把自己的网撒进海里”。
    reason: dialect_note
  - marker: c
    text: “发现”所译的科普特语表达，字面近于“碰上”或“遇见”。
    reason: lexical_alternative
  - marker: d
    text: 抄本这里有一个很小的缺文，通常可靠地补作“向下”；正文依汉语习惯译为“扔回海里”。
    reason: textual_variant
  - marker: e
    text: 本比喻可与《马太福音》13:47—48参照阅读，但两者重点不同：这里是一位渔夫丢回许多小鱼，选取一条又大又好的鱼；原文并未提到末世时把好鱼和坏鱼分开。
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲣⲱⲙⲉ
  choice: 人
  rationale: 此处带定冠词而作泛指，指一般的人，并非特指某一男子；现代汉语用“人”最自然，也保留其普遍性。
- source_word: ⲟⲩⲱϩⲉ ⲛⲣⲙⲛϩⲏⲧ
  choice: 有智慧的渔夫
  rationale: ⲟⲩⲱϩⲉ 指捕鱼者；ⲣⲙⲛϩⲏⲧ 字面与“心／心思”有关，惯用义为明智、有见识。译作“有智慧的渔夫”既贴近形式，也适合庄重叙事。
- source_word: ⲡⲉϥⲁⲃⲱ
  choice: 自己的网
  rationale: 原文含第三人称阳性单数领属成分，明确是渔夫自己的网；“自己的”在汉语回指主语清楚自然。
- source_word: ϩⲉ ⲉ-
  choice: 发现
  rationale: 该结构字面近于“碰上／遇见”，在此语境中惯用义为“发现”。
- source_word: ⲉⲛⲁⲛⲟⲩϥ
  choice: 好的
  rationale: 形容这条大鱼质量优良。译作“又大又好的鱼”，不额外限定其价值、可食性或象征意义。
- source_word: ⲭⲱⲣⲓⲥϩⲓⲥⲉ
  choice: 毫不费力
  rationale: 由希腊语成分“没有”与科普特语“劳苦／困难”构成；“毫不费力”准确而自然。
- source_word: ⲡⲉⲧⲉⲟⲩⲛⲙⲁⲁϫⲉ ⲙⲙⲟϥ ⲉⲥⲱⲧⲙ ⲙⲁⲣⲉϥⲥⲱⲧⲙ
  choice: 有耳可听的，就应当听
  rationale: 保留劝听格言的简洁与命令意味；汉语省去泛指单数男性代词，以免误解为只指男性。
theological_decisions:
- issue: 与《马太福音》13:47–48相似段落的关系
  choice: 严格保留本段对一个有智慧的渔夫和一条大鱼的集中描写
  alternative: 按《马太福音》的撒网比喻补入各样的鱼、好坏分类或末世审判含义
  rationale: 现存科普特文本写的是渔夫丢回所有小鱼并选择一条又大又好的鱼，并未明说末世审判或好鱼坏鱼的分类；翻译不应借平行传统补足其神学意义。
- issue: “大鱼”的象征意义
  choice: 只译出“大”与“好”，不在正文解释其所象征的对象
  alternative: 明确解释为天国、真知、独一者或得救者
  rationale: 比喻本身没有明说对应关系。保留开放性，可避免把某一解释写进正文。
- issue: 泛称“人”的范围
  choice: 采用不限定性别的泛称“人”
  alternative: 译为“男人”或“那个人”
  rationale: 原文在比喻引言中作泛指；性别限定不是本句神学重点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“有智慧的渔夫”保留原文重复，突出其明智选择；末句使用熟悉但不过度古雅的劝听格式。正文所有注释均以连续字母标记出现。
