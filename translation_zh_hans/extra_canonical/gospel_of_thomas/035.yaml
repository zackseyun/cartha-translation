base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/035.yaml
  text: Jesus said, "It is not possible for someone to enter the strong man’s house and take it by force unless he binds his hands; then he will overturn his house."
translation:
  language: zh_hans
  text: 耶稣说：“没有人能进壮汉的家，强行夺走他[a]，除非捆住他的双手；这样，他就能把那人的家翻倒[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的阳性单数代词可指“壮汉”，也可指“家”；若指“家”，本句可理解为“强行夺走它”。
    reason: 保留原文代词所指的语法歧义。
  - marker: b
    text: 原文动词短语可指“倒出、翻倒”或“倒空”。它并非对观福音平行语句中通常译作“抢夺／掠夺”的动词。
    reason: 说明此处动词的词义范围及其与对观平行语句的措辞差异。
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ
  choice: 谁也不能
  rationale: 科普特语以“没有能力/不可能”的结构表达否定可能性；译为现代汉语“谁也不能”，既自然，也保留能力与可能性的含义。
- source_word: ⲡϫⲱⲱⲣⲉ
  choice: 壮汉
  rationale: 形容词“强壮的”在此名词化，指一个强壮的人；“壮汉”简洁自然，并与房屋主人的形象相符。
- source_word: ϫⲓⲧϥ ⲛϫⲛⲁϩ
  choice: 强行夺取他
  rationale: ⲛϫⲛⲁϩ 在此作副词，意为“强行、凭武力”；阳性单数代词所指有歧义，正文用“他”贴近语法形式，并以脚注说明也可能指“家”。
- source_word: ⲙⲟⲩⲣ ⲛⲛⲉϥϭⲓϫ
  choice: 捆住他的双手
  rationale: 原文直指那人的“手”；汉语用“双手”表达自然，同时不增添“绳索”等原文没有的工具。
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: 翻个底朝天
  rationale: 该动词短语可表示“倒出、翻倒”；这里译作“翻个底朝天”，保留对房屋进行彻底翻动的鲜明图像，避免直接套用对观福音平行处的“抢劫”。
theological_decisions:
- issue: 强行夺取的宾语
  choice: 正文译作“他”，并加脚注保留歧义
  alternative: “它”（指房子）
  rationale: 科普特语阳性单数后缀既可回指阳性名词“家”，也可回指“壮汉”。不应凭神学或平行经文替原文消除歧义。
- issue: 末句动作的性质
  choice: 把那人的家翻个底朝天
  alternative: 抢劫／洗劫他的家
  rationale: 原文使用的是“倒出、翻倒”类动词，而非对观福音科普特文本常用的“抢夺”动词；因此保留《多马福音》此处特有的措辞和张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“壮汉”比“强者”更具体，也适合房屋被闯入的比喻场景；“翻个底朝天”略具口语色彩，但形象鲜明，准确传达原文“翻倒/倒出”的动作。引号及分号按现代汉语标点处理。
