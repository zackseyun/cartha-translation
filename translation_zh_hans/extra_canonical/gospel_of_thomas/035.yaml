revisions:
- from: 耶稣说：“谁也不能进壮汉的家，强行夺取他[a]，除非先捆住他的双手；然后，他才会把那人的家翻个底朝天[b]。”
  to: 耶稣说：“没有人能进壮汉的家，强行夺走他[a]，除非捆住他的双手；这样，他就能把那人的家翻倒[b]。”
  rationale: 修订删除原文未明说的“先”，以较中性的“翻倒”替代口语化且强化动作的“翻个底朝天”，并调整末句衔接，使执行动作的闯入者在汉语中较易辨识。脚注保留宾语代词的真实歧义和末句动词的词义张力。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:55Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿正确表达了否定可能性、“壮汉”、强行夺取、捆住双手及末句不同于对观平行处“抢夺/掠夺”的动词。可是“除非先捆住”中的“先”并非原文明确所有，宜不增添时间限定；末句“翻个底朝天”虽形象，却带有较强口语和彻底搜翻的附加意味。
  naturalness: “强行夺取他”在现代汉语中略显生硬，但为保留宾语所指歧义可接受。改作“强行夺走他”更自然；以“这样，他就能……”明确末句主语仍是闯入者，避免“然后，他才会”的指代摇摆。
  terminology: “壮汉”适切。脚注a应说明科普特语的阳性单数后缀可指壮汉或其家，且汉语“他”不能自行保留该语法歧义。脚注b应将词义说明限于“倒出／翻倒／倒空”等范围，不把对观福音的措辞混入正文。
  issues:
  - severity: low
    issue: “先”添加了原文未明说的时间先后。
    rationale: 原文以“除非……捆住他的双手”设定条件；尽管语境可推知捆绑须在后续行动前发生，译文不必将此推论明说。
  - severity: medium
    issue: “翻个底朝天”语体偏口语，并强化为彻底搜翻。
    rationale: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ 的核心意象是倒出、翻倒或倒空；“翻个底朝天”可以是解释性表达，但不如“翻倒”贴近且中性。
  - severity: low
    issue: 末句“然后，他才会”在汉语中主语指向不够清楚。
    rationale: 前句含有壮汉及闯入者两个男性指称对象；改以“这样，他就能”较清楚地延续泛指的闯入者。
  revised_text: 耶稣说：“没有人能进壮汉的家，强行夺走他[a]，除非捆住他的双手；这样，他就能把那人的家翻倒[b]。”
