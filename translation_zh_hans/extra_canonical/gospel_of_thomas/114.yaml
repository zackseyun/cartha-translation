base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/114.yaml
  text: 'Simon Peter said to them, “Let Mary go out from among us, for the female is not worthy of life.” Jesus said, “Look: I myself will lead her, so that I will make her male, so that she too may become a living spirit like you males. For every female who makes herself male will enter the kingdom of the heavens.”'
translation:
  language: zh_hans
  text: 西门·彼得对他们说：“让马利亚从我们中间离开，因为女性[a]不配得生命。”耶稣说：“看哪，我要亲自带领她[b]，使她成为男性[c]，也使她成为一个有生命的灵，像你们这些男性一样。因为凡使自己成为男性的女性，都将进入诸天的国[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女性”所译的ⲥϩⲓⲙⲉ也可译作“女人”。这里采用“女性”，是为了与下文“男性”（ϩⲟⲟⲩⲧ）保持原文鲜明的对应。
    reason: lexical_alternative
  - marker: b
    text: 手稿此处的宾语代词写作ⲙ̄ⲙⲟⲥ，规范化文本写作意义相同的ⲛⲛⲧⲟⲥ；二者都是第三人称阴性单数宾语，即“她”。
    reason: textual_variant
  - marker: c
    text: “男性”一词在文本传统的拼写中可见ⲛϩⲟⲟⲧ与ⲛϩⲟⲟⲩⲧ等形式；这是正字法或方言差异，不造成意义差别。
    reason: dialect_note
  - marker: d
    text: “诸天”译自ⲡⲡⲉ；这一词也常译作单数的“天”。译文保留“诸天”的形式，以对应原文的复数表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲁⲣⲉ- … ⲉⲓ ⲉⲃⲟⲗ
  choice: 让……离开
  rationale: ⲙⲁⲣⲉ-表达命令或意愿，ⲉⲓ ⲉⲃⲟⲗ意为“出去、离开”；“让……离开”在现代汉语中自然保留了祈使语气。
- source_word: ϩⲛⲁⲛⲟⲛ
  choice: 离开我们
  rationale: 与ⲉⲃⲟⲗ连用，表示“从我们中间出去”；汉语简洁译作“离开我们”。
- source_word: ⲥϩⲓⲙⲉ
  choice: 女性
  rationale: 上下文与ϩⲟⲟⲩⲧ“男性”形成鲜明对举；“女性”比“女人”更准确地保留这种性别范畴上的平行。
- source_word: ⲙⲡϣⲁ ⲁⲛ
  choice: 不配得
  rationale: 这是表示“不配、不相称”的否定结构；“不配得”保留原文关于资格或价值的强烈判断。
- source_word: ⲡⲱⲛϩ
  choice: 生命
  rationale: 该词词义为“生命”；不把它限定解释为现世生存、永生或救恩，以保留原文的开放性。
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: 看哪
  rationale: 这是引人注意的指示语；“看哪”简洁、庄重，也保留原文突出的语势。
- source_word: ⲥⲱⲕ
  choice: 带领
  rationale: 该动词可指“带领、牵引”；“带领”既保留行动方向，也不预先规定这一转变的具体性质。
- source_word: ⲉⲓⲣⲉ … ⲛϩⲟⲟⲩⲧ
  choice: 使……成为男性
  rationale: 直译其“使／做成……男性”的谓语结构，并保留原文刻意而突兀的表达，不改写为抽象的“男性化”。
- source_word: ⲡⲛⲉⲩⲙⲁ ⲉϥⲟⲛϩ
  choice: 一个活的灵
  rationale: ⲡⲛⲉⲩⲙⲁ在此为普通名词“灵”，ⲉϥⲟⲛϩ修饰它，意为“活的”；不用专名化的“圣灵”。
- source_word: ⲉⲓⲛⲉ ⲙ̄ⲙⲱⲧⲛ ⲛ̄ϩⲟⲟⲩⲧ
  choice: 像你们这些男性一样
  rationale: 清楚保留比较关系以及对受话者“男性”的明示。
- source_word: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲛⲙ̄ⲡⲏⲩⲉ
  choice: 诸天的国
  rationale: 保留“国／王权”与复数“诸天”的形式联系，避免在正文中直接化约为惯用的单数“天国”。
theological_decisions:
- issue: “成为男性”的性质
  choice: 按原文直译为“使她成为男性”及“使自己成为男性”
  alternative: 解释为属灵完整、超越性别，或取得男性身份
  rationale: 原文没有说明这一转变是身体的、社会身份的还是象征性的；译文不替作者消解其尖锐性与神学张力。
- issue: “生命”的具体所指
  choice: 保留为未加限定的“生命”
  alternative: 永生、救恩或生存资格
  rationale: 上下文可能引发救恩论或存在论理解，但词本身并未明确限定，故不作教义化增译。
- issue: “活的灵”的身份
  choice: 译为普通名词“一个活的灵”
  alternative: “圣灵”或某种特定神性存在
  rationale: 原文语法并不把它标示为专名或圣灵称号；保持普通名词可避免输入额外教义。
translation_notes:
  register: 采用现代、庄重而可读的普通话。保留原文“女性／男性”“使……成为男性”“诸天的国”等刻意尖锐或陌生的措辞，不以较柔和的解释性语言消除其性别张力。人名采用通行的中文圣经形式“西门·彼得”“马利亚”“耶稣”。
