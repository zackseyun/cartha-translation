revisions:
- from: 西门·彼得对他们说：“让马利亚离开我们，因为女性[a]不配得生命。”耶稣说：“看哪，我要亲自带领她[b]，使她成为男性[c]，好让她也成为一个活的灵，像你们这些男性一样。因为凡使自己成为男性的女性，都将进入诸天的国[d]。”
  to: 西门·彼得对他们说：“让马利亚从我们中间离开，因为女性[a]不配得生命。”耶稣说：“看哪，我要亲自带领她[b]，使她成为男性[c]，也使她成为一个有生命的灵，像你们这些男性一样。因为凡使自己成为男性的女性，都将进入诸天的国[d]。”
  rationale: 作出小幅修订以明确“从我们中间出去”的方位关系，并使两个目的分句在汉语中更清楚地对应原文的连续结构。“有生命的灵”比“活的灵”更符合现代普通话搭配，未改变其普通名词性质。脚注d删去超出词汇说明的解释性界定。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:58Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实于科普特文本：彼得要求马利亚“从我们中间出去”，并称女性“不配得生命”；耶稣说自己要带领她、使她成为男性，继而使她成为如同受话男性的“活的灵”，并以“每一个使自己成为男性的女性”进入天上的国作结。惟“好让”较易把第二个目的分句读成仅从属的结果，改作并列的“使她也成为……”更贴近原文连续的目的结构。
  naturalness: “离开我们”在汉语中可理解，但没有明确表达“从我们中间”这一空间／群体脱离关系；“从我们中间离开”更自然且更准确。“一个活的灵”可读，但“一个有生命的灵”在现代汉语中更顺畅，同时保留普通名词和“living”的属性。
  terminology: 人名及“女性／男性”“生命”“灵”均恰当，且没有将“灵”专名化。“诸天的国”虽较陌生，适合保留原文复数形式；脚注应称其为“天／诸天”，不宜以“神圣统治的领域”作过强的解释性界定。
  issues:
  - severity: low
    issue: “离开我们”弱化了ϩⲛⲁⲛⲟⲛ与“出去”组合所表达的“从我们中间离开”。
    rationale: 补出“从我们中间”可恢复原文的群体方位关系，且不增添解释。
  - severity: low
    issue: “好让她也成为”使第二个目的分句在汉语中显得从属于前一目的。
    rationale: 原文以连续目的结构表达“使她成为男性，以便她也成为……灵”；改为“使她成为男性，也使她成为……”可较清楚地保持并列推进。
  - severity: low
    issue: 脚注d将该表达界定为“神圣统治的领域”，略有解释性。
    rationale: 原文短语本身只给出“国／王权”与“天（复数）”的属格关系；脚注宜只说明词形与常见译法，避免界定其所指。
