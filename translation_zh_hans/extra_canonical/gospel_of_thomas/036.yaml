base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/036.yaml
  text: Jesus said[a], Do not be anxious from morning until evening, and from evening until morning[c][b], about what you will put on yourselves.
translation:
  language: zh_hans
  text: 耶稣说：“不要从早到晚，也不要从晚到早，为自己将要穿什么[c]而忧虑[a]。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“忧虑”的科普特语动词ϥⲓⲣⲟⲟⲩϣ也可译为“担心”；旧式译法有“思虑”。
    reason: lexical_alternative
  - marker: b
    text: 《俄克喜林库斯纸草》655号所保存的第36则还包含食物、百合花和身量等内容；它与这里的文本只有关于衣着的分句相合。本译文依据拿戈玛第科普特文本。
    reason: textual_variant
  - marker: c
    text: 手稿此处的连写形式ⲡⲉ⟨ⲧ⟩ⲉ…含有编者补出的⟨ⲧ⟩；迪利的规范化文本将整段理解为无先行词的关系结构，并带有将来意味，因而译作“自己将要穿什么”。
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ
  choice: 不要……忧虑
  rationale: 这是带否定命令形式的表达；ϥⲓⲣⲟⲟⲩϣ可表示忧虑、担心。选择“忧虑”既自然庄重，也不采用陈旧的“不要思虑”。
- source_word: ϫⲓⲛϩⲧⲟⲟⲩⲉ ϣⲁⲣⲟⲩϩⲉ
  choice: 从早到晚
  rationale: 直接表达由早晨延续到晚上的时间跨度，并保留原文平行结构。
- source_word: ϫⲓⲛϩⲓⲣⲟⲩϩⲉ ϣⲁϩⲧⲟⲟⲩⲉ
  choice: 从晚到早
  rationale: 与前一时间短语对称，保留科普特文本的节奏和全面涵盖昼夜的表达。
- source_word: ⲟⲩ ⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁ–
  choice: 你们要拿什么
  rationale: 将无先行词关系结构和将来表达自然译为汉语疑问性宾语结构；“要”保留将来或预期意味。
- source_word: ϯⲛⲧⲟϥ
  choice: 穿
  rationale: 该动词在此指把衣物穿上；现代汉语用“穿”最简洁自然，衣物宾语由“什么”承担。
- source_word: ϩⲓⲱⲧⲛⲧⲱⲧⲛ
  choice: 穿在自己身上
  rationale: 保留原文介词与反身表达，明确是把东西穿到自己身上，而不额外引入“身体”等解释。
- source_word: ⲁⲩⲱ
  choice: 又
  rationale: 连接两个对称的时间跨度；“又”在汉语中比重复使用“和”更自然，同时保留并列关系。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“从早到晚、又从晚到早”保留原文的对称排比；“穿在自己身上”兼顾汉语自然度与科普特语反身结构。三个脚注标记均置于相关整句末尾，避免打断正文朗读。
