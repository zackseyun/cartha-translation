base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/031.yaml
  text: Jesus said[1], "No prophet is acceptable in his village[3][2]; a physician does not heal those who know him."
translation:
  language: zh_hans
  text: 耶稣说：“先知在自己的村里不受接纳[a]；医生也不医治认识他的人。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文残片P.Oxy. 1在这里作“故乡”（πατρίδι），并作“施行医治”；科普特文本则作“村”。另参路加福音4:24：“没有先知在自己家乡被接纳。”
    reason: 说明希腊平行见证的文本差异，并提示正典平行经文，避免在正文中加以协调。
  - marker: b
    text: 科普特文本这里的ⲙⲁⲣⲉ-是地区性拼写，功能相当于标准萨希德语的否定aorist（不定过去时）形式ⲙⲉⲣⲉ-，表达一般事实，即“并不医治”，不是“让……医治”的祈使形式。
    reason: 说明可能影响句义的方言形态，排除同形祈使结构造成的误读。
lexical_decisions:
- source_word: ⲙⲛⲡⲣⲟⲫⲏⲧⲏⲥ ϣⲱⲡ
  choice: 先知……不受接纳
  rationale: ⲙⲛ-构成否定存在句，ϣⲱⲡ在这里表示“被接受、受接纳”；译文保留普遍否定的格言语气，并以自然的现代汉语表达。
- source_word: ϩⲛⲡⲉϥϯⲙⲉ
  choice: 在自己的村里
  rationale: ϯⲙⲉ通常指“村庄、村镇”；按科普特文本译作“村”，不以希腊残片及正典平行经文的“故乡”取代它。
- source_word: ⲥⲟⲓⲛ
  choice: 医生
  rationale: 这是ⲥⲁⲉⲓⲛ的拼写变体，意为“医生”，并非表示“做、施行”的助动成分。
- source_word: ⲣⲑⲉⲣⲁⲡⲉⲩⲉ
  choice: 医治
  rationale: 源自希腊语θεραπεύειν，意为治疗、医治；在医生这一语境中译作“医治”准确而自然。
- source_word: ⲛⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟϥ
  choice: 认识他的人
  rationale: 关系结构指“那些认识他的人”；汉语集合名词“人”自然涵盖复数，不额外解释他们与医生的具体关系。
theological_decisions:
- issue: 是否与正典福音及希腊残片协调为“故乡”
  choice: 村里
  alternative: 故乡
  rationale: 科普特文本明确使用ϯⲙⲉ“村庄、村镇”。译文以所给科普特见证为主，不静默协调为路加福音4:24等处的“故乡”；希腊异文另在脚注说明。
- issue: 医生格言所指对象
  choice: 认识他的人
  alternative: 熟悉他的人／自己人
  rationale: 原文只说“认识他”，没有说明亲属、乡亲或病人身份，因此保留其范围与含义上的开放性。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留两句并列格言的节奏。用“不受接纳”对应被接受的状态，用“医生也不医治”自然承接前句；不加入“通常”“能够”等原文没有的限定。
