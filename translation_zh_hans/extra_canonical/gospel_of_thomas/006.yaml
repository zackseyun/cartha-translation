base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/006.yaml
  text: 'His disciples questioned him and said to him[1], "Do you want us to fast? And how shall we pray? Shall we give alms? And what shall we observe concerning eating?"


    Jesus said, "Do not lie, and what you hate, do not do. For all things are revealed before heaven. For there is nothing hidden that will not be revealed[2], and nothing covered that will remain without being uncovered."'
translation:
  language: zh_hans
  text: '他的门徒问他，说：“你要我们禁食吗？我们该怎样祷告？该施舍吗？在饮食方面，我们该遵守什么？”


    耶稣说：“不要说谎；你们所厌恶的事，不要去做。因为一切都显露在天面前。[a]没有什么隐藏的事不会显露，也没有什么遮盖的事会一直不被揭开。[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊残片《俄克喜林库斯纸草》654在这里作“在真理面前”，不是“在天面前”。
    reason: textual_variant
  - marker: b
    text: 希腊残片《俄克喜林库斯纸草》654在这里作“没有什么被埋葬的不会被唤起”，不是“没有什么遮盖的事会一直不被揭开”。
    reason: textual_variant
lexical_decisions:
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ
  choice: 禁食
  rationale: 该词源自希腊语 νηστεύω，指宗教或操练意义上的禁食；“禁食”是现代汉语中准确而自然的对应词。
- source_word: ⲉϣ ⲧⲉ ⲑⲉ
  choice: 怎样
  rationale: 字面为“是什么方式”，在科普特语中是询问方式的惯用表达，译作“怎样”自然准确。
- source_word: ϯⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  choice: 施舍
  rationale: 希腊借词所表达的是向穷人施予财物；“施舍”既保留古代宗教语境，也为现代读者所理解。
- source_word: ⲣⲡⲁⲣⲁⲧⲏⲣⲉⲓ
  choice: 遵守
  rationale: 该希腊借词有留意、谨守之意；在饮食规条的语境中，“遵守”最为贴切。
- source_word: ϭⲓⲛⲟⲩⲱⲙ
  choice: 饮食方面
  rationale: 这是表示吃、食物或饮食的名词；译作“在饮食方面”保留其论题性质，避免误译成时间从句“吃饭时”。
- source_word: ϫⲉϭⲟⲗ
  choice: 说谎
  rationale: 字面是“说虚假之言”；汉语用“说谎”简洁地保留格言式语气。
- source_word: ⲙⲡⲉⲙⲧⲟ ⲉⲃⲟⲗ ⲛⲧⲡⲉ
  choice: 在天面前
  rationale: 这是“在……面前／临在中”的复合介词结构，宾语为“天”；不可拆解为与“遮盖”有关的短语。
- source_word: ϩⲏⲡ / ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 隐藏／显露
  rationale: 两词形成语义对照；“隐藏／显露”在现代汉语中清楚、庄重，并保留启示性的意象。
- source_word: ϩⲟⲃⲥ / ϭⲟⲗⲡ
  choice: 遮盖／揭开
  rationale: 原文以同一意象构成反义对应；译文保留覆盖物被移除的具体画面。
theological_decisions:
- issue: 科普特文“在天面前”与希腊残片“在真理面前”的异文
  choice: 正文采用“在天面前”
  alternative: 在真理面前
  rationale: 现译所依据的科普特抄本明确作“天”；希腊重叠见证的异文具有重要性，但不应替换正文，故列入脚注。
- issue: 科普特文“遮盖／揭开”与希腊残片“埋葬／复起”的差异
  choice: 正文采用“没有什么遮盖的事会一直不被揭开”
  alternative: 没有什么被埋葬的不会复起
  rationale: 科普特文明确使用“遮盖”和“揭开”，侧重隐蔽之物的显明；希腊残片则可能带有复起或复活色彩。译文不以希腊读法消解科普特文本自身的启示性表达。
- issue: “一切都显露”的时态
  choice: 采用现在状态“都显露”
  alternative: 都将显露
  rationale: 科普特文本此处是现在时表达；随后关于隐藏之物的句子才带将来指向。保留这种时态张力，不统一改成将来时。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。问句保持门徒对禁食、祷告、施舍和饮食规条的连续追问；耶稣的回答则保持简洁的格言节奏。正文严格以科普特文本为主，希腊重叠见证仅在脚注中标明。
