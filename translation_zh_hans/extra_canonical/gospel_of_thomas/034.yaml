translation:
  language: zh_hans
  text: 耶稣说：“如果一个盲人给另一个盲人领路，两个人都会掉进一个坑里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲃⲗⲗⲉ
  choice: 盲人
  rationale: 该名词泛指失明的人；“盲人”准确、自然，也不额外限定性别。
- source_word: ⲥⲱⲕ ϩⲏⲧ
  choice: 给……领路
  rationale: 字面涉及“拉在前面”，在科普特语中是带领、引路的惯用表达；汉语用“给……领路”自然传达其义。
- source_word: ϣⲁⲣⲉⲛⲧⲟⲟⲩϩⲉ
  choice: 两个人都会掉
  rationale: ϣⲁⲣⲉ-表达习惯性或格言性事实；在“如果”条件句中，“都会”自然呈现一般规律，而非特指一次未来事件。
- source_word: ⲡⲥⲛⲁⲩ
  choice: 两个人
  rationale: 原文直译为“那两个”；此处指前述两个盲人，汉语以“两个人”清楚保留双方一同遭遇结果的强调。
- source_word: ⲉⲡⲉⲥⲏⲧ
  choice: 掉
  rationale: 该短语表示“向下”；汉语动词“掉”本身已包含向下运动，避免生硬重复为“向下掉”。
- source_word: ⲉⲟⲩϩⲓⲉⲓⲧ
  choice: 进坑里
  rationale: ⲉ-表示进入，ⲟⲩ-是不定冠词，ϩⲓⲉⲓⲧ可指坑、沟或井；语境中“进坑里”自然且保留不定所指。
theological_decisions:
- issue: 格言性陈述与将来结果
  choice: 用“两个人都会掉”表达一般性规律
  alternative: 两个人都将掉进坑里
  rationale: 科普特语形式表达习惯性、普遍性的事实。这里不把话语限定为单次未来预言，从而保留其格言性质。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“一个盲人给另一个盲人领路”避免传统译法中可能显得过度书面或性别化的措辞；“掉进坑里”自然整合了原文“落下”与“进入一个坑”的空间意义。
