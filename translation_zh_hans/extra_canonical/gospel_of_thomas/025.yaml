base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/025.yaml
  text: Jesus said[a], Love your brother as your soul[e][d][c][b]; guard him as the pupil of your eye.
translation:
  language: zh_hans
  text: 耶稣说：“要爱你的弟兄，像爱你自己的灵魂[a][b]；要保护他[c]，像保护你眼中的瞳仁[d][e]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵魂”所译的 ⲯⲩⲭⲏ（希腊语 ψυχή）也可指“生命”或“自身”。
    reason: lexical_alternative
  - marker: b
    text: 表示比较的词在手稿中写作 ⲛ̄ⲑⲉ，规范化文本作 ⲛⲡϩⲉ；这是撒希迪科普特语与利科波利方言特征的差异，两者都意为“像、如同”。
    reason: dialect_note
  - marker: c
    text: 手稿作 ⲙ̄ⲙⲟϥ，以“他”为直接宾语；规范化文本作 ⲛⲛⲧⲟϥ，可理解为“为他”。两种读法在这里都表达守护、保护他的意思。
    reason: textual_variant
  - marker: d
    text: “瞳仁”是原词的字面意思；原文未使用汉语中表示珍爱之物的引申成语。
    reason: lexical_alternative
  - marker: e
    text: 可比较《申命记》32:10、《诗篇》17:8和《箴言》7:2中以眼中瞳仁表示谨慎守护的意象。
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 这是科普特语常见的引语公式“ⲡⲉϫⲉ＋人名”；译为简洁自然的现代汉语叙述语。
- source_word: ⲙⲉ
  choice: 爱
  rationale: 该词可指爱、喜爱或渴望；此处以人为宾语并具有伦理劝诫性质，译作“爱”最合适。
- source_word: ⲥⲟⲛ
  choice: 弟兄
  rationale: 基本义为“兄弟”；“弟兄”既保留亲属般的共同体称谓，又不擅自改译为“邻舍”或泛化为“他人”。
- source_word: ⲛ̄ⲑⲉ / ⲛⲡϩⲉ
  choice: 像
  rationale: 手稿形式与规范化形式均表达“如同、像”；“像”使两个比较结构在现代汉语中简洁平行。
- source_word: ⲯⲩⲭⲏ
  choice: 灵魂
  rationale: 这是希腊语 ψυχή 的借词，可指灵魂、生命或自身；正文用“灵魂”保留原文鲜明用语，并以脚注呈现语义范围。
- source_word: ⲉⲓⲣⲉ ⲧⲏⲣⲉ(ⲓ)
  choice: 保护
  rationale: 这一迂说结构表达看守、守护或保护；以人为宾语时，“保护”比直译为“看守”更自然，同时保留积极守护之意。
- source_word: ⲡⲉⲗⲟⲩ
  choice: 瞳仁
  rationale: 该词具体指眼睛的瞳孔；“瞳仁”自然、庄重，也比带有引申义的汉语成语更贴近原文的身体意象。
- source_word: ⲃⲁⲗ
  choice: 眼
  rationale: 基本义为眼睛；在“眼中的瞳仁”这一结构中用“眼”最自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄”保留原文共同体式的亲属称谓；两个“像……”结构维持原句的平行节奏。“灵魂”保留 ψυχή 的语义张力，其他可能含义列入脚注，不在正文中替原文作单一解释。
