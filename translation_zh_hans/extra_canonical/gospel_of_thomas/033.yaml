base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/033.yaml
  text: Jesus said, "What you will hear in your ear—in the other ear[a] proclaim it upon your rooftops; for no one lights a lamp and puts it under a measuring-basket[b], nor does one put it in a hidden place, but rather one puts it on the lampstand, so that those who enter and those who go out may see its light.[c]"
translation:
  language: zh_hans
  text: 耶稣说：“你在一只耳朵里所听见的——在另一只耳朵里[a]——要在你们的房顶上宣扬出来。因为没有人点了灯，却把它放在量斗[b]底下，也没有人把它放在隐蔽之处；反倒把它放在灯台上，好让进来和出去的人都能看见它的光。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特文本直译为“你在你耳朵里所听见的，在另一只耳朵里”。这句话的结构不寻常。希腊文残片（POxy 1）在此处的措辞有所不同，通常理解为“你用一只耳朵所听见的”。
    reason: 说明现存科普特文本的异常表达及希腊重叠见证，避免在正文中擅自校正。
  - marker: b
    text: “量斗”是用来量谷物的容器；这里指把灯遮在这种容器底下。科普特文此处的词形与前面的“耳朵”相同，但语境及希腊文平行见证支持“量斗”的意思。
    reason: 解释同形词造成的词义歧义，并交代译词的文本依据。
  - marker: c
    text: 科普特文本作“进来和出去的人”；一些相近的灯的比喻只提到进来的人。
    reason: 标明本见证独特的双向表述，防止读者误以为“出去”是为了顺畅而增补。
lexical_decisions:
- source_word: ⲧⲁϣⲉⲟⲉⲓϣ
  choice: 宣扬出来
  rationale: 该动词表示公开传扬、宣告；“宣扬出来”既保留公开发布之意，也与房顶这一场景自然衔接。
- source_word: ⲛⲉⲧⲛϫⲉⲛⲉⲡⲱⲣ
  choice: 你们的房顶
  rationale: 原文是第二人称复数所有格和复数“房顶”；保留由前句单数“你”转为复数“你们”的变化。
- source_word: ϩⲏⲃⲥ
  choice: 灯
  rationale: 指可点燃并置于灯台上的油灯；现代汉语用“灯”自然且准确。
- source_word: ⲙⲁⲁϫⲉ
  choice: 量斗
  rationale: 此处依灯的比喻及希腊平行见证理解为盛量谷物的斗器，而非前句同形的“耳朵”；译作“量斗”保留器具及量器双重性质。
- source_word: ⲗⲩⲭⲛⲓⲁ
  choice: 灯台
  rationale: 这是源自希腊语的词，指安放灯的台架；“灯台”是准确、简洁的现代汉语表达。
- source_word: ⲟⲩⲟⲉⲓⲛ
  choice: 光
  rationale: 直译为“光”，不额外解释为启示、教导或救恩，以免消解比喻的开放性。
theological_decisions:
- issue: “一只耳朵……另一只耳朵”的异常措辞
  choice: 在正文中保留这一重复而奇特的表达，并加脚注说明
  alternative: 按希腊残片或常见译法简化为“你耳中所听见的”
  rationale: 现存科普特文本确实两次提到耳朵，第二次明确为“另一只耳朵”；不应静默校正，以保存本文见证的歧义。
- issue: 灯的光所象征的内容
  choice: 只译出比喻，不作神学解释
  alternative: 明确解释为耶稣的教训、真理、启示或福音
  rationale: 原文没有指明象征对象；保持开放可避免输入特定传统的解释。
- issue: “进来和出去的人”
  choice: 保留双向动作
  alternative: 概括为“所有人”或只译“进来的人”
  rationale: 科普特手稿明确并列进入与出去，虽与若干正典平行经文不同，仍应忠实保存。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。正文保留原文中单数“你”转为复数“你们”、两次提到耳朵以及“进来和出去”等不寻常特征；用脚注处理文本与词义问题，不在正文中加入教义性阐释。
