- from: 耶稣说：“也许人们以为，我来是要把和平投到世上；他们却不知道，我来是要把分裂投到地上：火、刀剑、战争。因为一家之中将有五个人：三人反对两人，两人反对三人；父亲反对儿子，儿子反对父亲。他们将作为独自者站立。”[a][b]
