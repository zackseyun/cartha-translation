base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/016.yaml
  text: 'Jesus said[1], "Perhaps people think that I have come to cast peace upon the world, and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there will be five in a house: there will be three against two, and two against three, father against son, and son against father[3][2]. And they will stand as solitary ones."'
translation:
  language: zh_hans
  text: 耶稣说：“也许人们以为，我来是要把和平投到世上；他们却不知道，我来是要把分裂投到地上：火、刀剑、战争。因为一家之中将有五个人：三人反对两人，两人反对三人；父亲反对儿子，儿子反对父亲。他们将站立，成为独自者。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “独自者”原文是希腊语借词 monachos，可指“单独的人”或“独处的人”；这里不一定具有后世“修士”的制度性含义。
    reason: 说明关键借词的语义范围，并避免时代错置。
  - marker: b
    text: 可参《路加福音》12:51–53和《马太福音》10:34–35。
    reason: 标明内容相近的平行传统，但不据此改写本段。
lexical_decisions:
- source_word: ⲧⲁⲭⲁ
  choice: 也许
  rationale: 这是希腊语借词，语境中表示推测；“也许”保留了原文并未断言所有人都如此认为的语气。
- source_word: ⲛⲟⲩϫⲉ
  choice: 投到
  rationale: 原词基本义为“投、扔”。和平与分裂两处沿用同一译法，保留原文刻意而强烈的悖论式意象，不弱化为“带来”。
- source_word: ⲡⲱⲣϫ
  choice: 分裂
  rationale: 可指分开、隔离或分裂；此处随后列举家庭成员彼此反对，故译“分裂”最贴合上下文，同时不额外限定其性质。
- source_word: ⲉϫⲛ
  choice: 反对
  rationale: 在“三对二”及父子关系的语境中表示敌对或相对而立；“反对”既自然，也保留冲突关系。
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: 独自者
  rationale: 该希腊语借词可表示单独、独处的人。译作“独自者”保留名词性和语义张力，并避免时代错置地直接译为后世制度意义上的“修士”。
theological_decisions:
- issue: 结尾ⲙⲟⲛⲁⲭⲟⲥ的含义
  choice: 独自者
  alternative: 独一者；孤独者；修士
  rationale: 原词本身容许“单独者／独处者”等理解，但文本没有明说这是灵性合一、社会孤立或修道身份。正文采用较中性的“独自者”，脚注说明词义范围，不替作者消除歧义。
- issue: 火、刀剑、战争与分裂的句法关系
  choice: 以冒号列为“分裂”的具体展开
  alternative: 将四项并列为“分裂、火、刀剑和战争”
  rationale: 科普特文在“分裂”之后无显式连接词，句法可理解为一连串投到地上的事物，也可将后三项视为分裂的展开。冒号保留紧密关系而不加入原文没有的连词。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“把……投到……”略带陌生感，是为保留原文连续两次使用“投、扔”的强烈意象；家庭冲突部分采用短句和平行结构，体现原文节奏。
