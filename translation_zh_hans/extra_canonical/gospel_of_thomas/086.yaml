base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/086.yaml
  text: Jesus said, "The foxes have their holes, and the birds have their nest, but the Son of Man does not have a place to lay his head and rest."
translation:
  language: zh_hans
  text: 耶稣说：“狐狸有自己的洞[a]，飞鸟有自己的巢[b]；但人子没有地方可以低头安歇[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本此处可读作“一个洞”，但通常依上下文及后句“自己的巢”校读为“自己的洞”。
    reason: 文本异文
  - marker: b
    text: 原文用单数“巢”，且没有正典福音平行经文中的“空中的”一语。
    reason: 原文措辞与平行经文差异
  - marker: c
    text: 原文在“低头”之后另有“安歇”，这一短语不见于《马太福音》8:20和《路加福音》9:58的平行经文。
    reason: 平行经文差异
lexical_decisions:
- source_word: ⲃⲁϣⲟⲣ
  choice: 狐狸
  rationale: 原文为复数类称；现代汉语用无标记的“狐狸”即可自然表达复数。
- source_word: ⲃⲏⲃ
  choice: 洞
  rationale: 可指洞穴、兽穴；“洞”简明自然，也保留狐狸栖身处的具体意象。
- source_word: ϩⲁⲗⲏⲧ
  choice: 飞鸟
  rationale: 原文意为鸟类，未带“空中”之类的修饰；译作“飞鸟”符合庄重的汉语格言体，同时不另加地域限定。
- source_word: ⲙⲁϩ
  choice: 巢
  rationale: 原文为单数“巢”，带复数领属成分；汉语“飞鸟有自己的巢”可自然保留这种集合式单数。
- source_word: ⲣⲓⲕⲉ
  choice: 低头
  rationale: 本义是弯下、倾斜；在此指把头靠下，译作“低头”比套用英语习语“枕头”更贴近科普特语动作。
- source_word: ⲙⲧⲟⲛ
  choice: 安歇
  rationale: 反身结构表示使自己休息；“安歇”兼顾休息与安顿的语感，适合本句庄重语域。
theological_decisions:
- issue: ⲡϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ 的理解
  choice: 人子
  alternative: 人的儿子／人
  rationale: 该固定表达既可能作为称号，也保留一般“人之子”的语义张力。采用传统而简洁的“人子”，不在正文中预先裁定其仅指耶稣、末世人物或一般人类。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号突出前两项与“人子”处境的对照；“自己的”传达两处复数领属，不把单数“巢”擅改为复数。“低头安歇”尽量保留原文两个动作的衔接。
