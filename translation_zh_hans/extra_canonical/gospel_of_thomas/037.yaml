base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/037.yaml
  text: His disciples said, "When[a] will you be revealed[f] to us, and when will we see you?" Jesus said, "When you strip naked without being ashamed,[b] and you take your clothes and put them under your feet like[e] the little children,[c] and trample on them, then[d] you will see the Son of the Living One,[g] and you will not be afraid."
translation:
  language: zh_hans
  text: 他的门徒说：“什么时候[a]你会向我们显现[f]，什么时候我们会看见你？”耶稣说：“当你们脱下衣服，赤身露体而不觉得羞耻[b]；又拿起自己的衣服，像那些小孩子[e][c]一样，把它们放在脚底下，践踏它们；到那时[d]，你们就会看见活着者的儿子[g]，并且不会害怕。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “什么时候”直译为“哪一天”；这里问的是何时，并不必然指一个确定的日历日期。
    reason: 说明科普特语习语，同时保留时间表达的开放性。
  - marker: b
    text: 原文也可较简洁地译作“当你们脱去衣服而不羞耻”。这句话的象征含义没有明说。
    reason: 避免把赤裸意象限定为某一种神学解释。
  - marker: c
    text: “小孩子”在原文中带有幼小、年幼之意。
    reason: 交代词义，不把儿童形象解释为无罪、天真或其他特定教义。
  - marker: d
    text: “到那时”对应原文明确的时间承接词。
    reason: 显示条件与结果之间的结构。
  - marker: e
    text: “像那些小孩子一样”最自然地与随后的放置和践踏衣服的举动相连。
    reason: 说明较自然的修饰关系，同时不把这一比较语的象征意义具体化。
  - marker: f
    text: “显现”也可译作“显露出来”或“被显明”。
    reason: 保留 ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ 的语义范围。
  - marker: g
    text: “活着者”直译为“那活着者”；也可译作“活着的那一位”。
    reason: 说明称号的字面形式，避免把“活着”预先解释为“永活”或直接补入特定神名。
lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 向我们显现
  rationale: 该动词短语表示显露、显现；保留门徒所问的启示性语气，不将其具体化为再次来临或公开现身。
- source_word: ⲕⲱⲕ ... ⲁϩⲏⲩ
  choice: 脱去衣服，赤身露体
  rationale: 原文表达脱去自身所穿之物而裸露；此译既呈现动作，也使后文“衣服”所指清楚。
- source_word: ϥⲓ ⲛⲛⲉⲧⲛϣⲧⲏⲛ
  choice: 拿起自己的衣服
  rationale: ϥⲓ 的基本义为拿起、提起；不弱化为单纯“把”。
- source_word: ϫⲟⲡϫⲡ
  choice: 践踏
  rationale: 该词表达用脚踩踏；采用庄重而自然的现代汉语。
- source_word: ⲡϣⲏⲣⲉ ⲙⲡⲉⲧⲟⲛϩ
  choice: 永活者的儿子
  rationale: 字面结构为“那活着者的儿子”。“永活者”在中文中兼顾称号感及持续生命之意，但不直接等同于某一预设神名。
theological_decisions:
- issue: 脱衣与践踏衣服的象征意义
  choice: 保留具体意象，不在正文解释
  alternative: 释作舍弃肉身、恢复无罪纯真或超越羞耻
  rationale: 原文没有明确说明象征所指；直接释义会消除文本有意保留的张力。
- issue: “永活者的儿子”的身份
  choice: 按属格结构直译为“永活者的儿子”
  alternative: 译为“永生神的儿子”或直接认定为特定基督论称号
  rationale: 原文称号本身具有解释空间；不额外补入“神”，也不削弱“儿子”的称谓。
- issue: “看见你”与“看见永活者的儿子”的关系
  choice: 维持前后不同称谓
  alternative: 统一改译为“看见我”
  rationale: 原文明显由第二人称转为第三人称称号，应保留其叙事和神学张力。
translation_notes:
  register: 采用现代、庄重、可朗读的简体中文。问答保持直接；用分号梳理耶稣回答中的连续条件。正文不替原文解释赤裸、孩童、衣服或“永活者的儿子”的象征与身份，以保存其歧义和神学张力。
