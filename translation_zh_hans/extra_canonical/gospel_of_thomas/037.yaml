  to: 他的门徒说：“什么时候[a]你会向我们显现[f]，什么时候我们会看见你？”耶稣说：“当你们脱下衣服，赤身露体而不觉得羞耻[b]；又拿起自己的衣服，像那些小孩子[e][c]一样，把它们放在脚底下，践踏它们；到那时[d]，你们就会看见活着者的儿子[g]，并且不会害怕。”
