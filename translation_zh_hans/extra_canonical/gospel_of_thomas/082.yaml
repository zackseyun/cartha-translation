base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/082.yaml
  text: Jesus said[a], “The one who is near me is near the fire[c][b], and the one who is far from me is far from the kingdom.”
translation:
  language: zh_hans
  text: 耶稣说：“那离我近的，便离火近；那离我远的，便离国度[a]远。”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “国度”所译的科普特语 ⲙⲛⲧⲣⲣⲟ 也可指“王权”或“统治”。
    reason: lexical_alternative
  - marker: b
    text: 手稿在相应处用“向我／离我”的介词代词形式（ⲉⲣⲟⲓ／ⲙ̄ⲙⲟⲓ）；规范化文本则用独立代词结构。手稿与规范化文本中“国度”前的冠词形式也不同。
    reason: textual_variant
  - marker: c
    text: 可比较《路加福音》12:49的“火”意象；两处在主题上有所呼应，但并非同一句话。
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲏⲛ
  choice: 靠近
  rationale: 此处表示位置或关系上的接近，而非趋近的动作；“靠近”既自然，又保留与“远离”的鲜明对照。
- source_word: ⲉⲣⲟⲓ / ⲙ̄ⲙⲟⲓ
  choice: 靠近我／远离我
  rationale: 科普特语介词代词分别表达朝向与离开的关系；汉语用“靠近／远离”可清楚保留这种方向性。
- source_word: ⲥⲁⲧⲉ
  choice: 火
  rationale: 采用基本义“火”，不细化为“火焰”，以保留原文简洁而强烈的意象。
- source_word: ⲟⲩⲏⲩ
  choice: 远离
  rationale: 与前句“靠近”构成紧凑平行；“远离”也自然体现原文相对于“我”和“国度”的距离关系。
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: 国度
  rationale: 该词可指王权、统治或国度；正文采用《多马福音》语境中自然且为普通读者熟悉的“国度”，并以脚注保留其语义幅度。
- source_word: ⲡⲉⲧ-
  choice: 那……的
  rationale: 保留单数泛指关系结构及格言式语气；相比“凡……的人”，不额外增强普遍条件句色彩。
theological_decisions:
- issue: “火”的价值与所指
  choice: 保留未经解释的“火”意象
  alternative: 解释为审判、净化、苦难或神圣临在
  rationale: 原文没有明确说明“火”的性质；正文不应替读者消除这一神学张力。
- issue: ⲙⲛⲧⲣⲣⲟ 的神学范围
  choice: 正文译作“国度”，脚注说明也可指“王权”或“统治”
  alternative: 直接译作“神的国”或“天国”
  rationale: 原文只说带定冠词的“国度”，没有出现“神”或“天”；不补入限定语可避免过度阐释。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留原文两句之间的平行结构和格言式力度。“靠近／远离”比“在……附近／离……很远”更自然紧凑，也保留方向关系。脚注标记均置于正文中；词义脚注紧随“国度”，文本异文与参照脚注置于全句之后。
