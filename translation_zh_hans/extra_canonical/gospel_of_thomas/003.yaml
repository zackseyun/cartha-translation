base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/003.yaml
  text: Jesus says[a], "If those who lead you say to you, 'Look, the kingdom is in the sky,' then the birds of the sky will precede you. If they say to you, 'It is in the sea,' then the fish will precede you. Rather, the kingdom is inside you and it is outside you. When you come to know yourselves, then you will be known, and you will realize that you are the children of the living Father. But if you do not know yourselves[b], you are in poverty[i][h][g][f][e][d][c], and you are poverty."
translation:
  language: zh_hans
  text: 耶稣说：“如果带领你们的人[a]对你们说：‘看哪，国度在天空中[b]’，那么，天上的飞鸟将先于你们。如果他们对你们说：‘国度在海里’，那么，鱼将先于你们。其实，国度在你们里面，也在你们外面。[c]当你们认识自己时，你们就会被认识[d]，并且会明白，你们是那位活着的父的儿女。[e]但如果你们不认识自己，你们就处在贫穷之中，而且你们就是贫穷。”[f]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带领你们”：科普特语 ⲥⲱⲕ 可指“拉、牵引、带领”。原文没有明说“领入歧途”。
    reason: lexical_alternative
  - marker: b
    text: “天空”也可译作“天”。这里紧接“天上的飞鸟”，因此正文采用具体的空间用语“天空”。
    reason: lexical_alternative
  - marker: c
    text: 科普特文本只说“国度”，没有“神的”一语；“里面”和“外面”的具体所指也未加解释。
    reason: textual_variant
  - marker: d
    text: “会被认识”原文形式上是“他们会认识你们”。这里的第三人称复数没有指明主体，在萨希迪科普特语中可表达无施事者的被动意义。
    reason: dialect_note
  - marker: e
    text: 手稿原貌作复数“儿女／众子”（ⲛ̄ϣⲏⲣⲉ），与复数“你们”相应；所给规范化文本在此作了单数形式，正文依据手稿读法。
    reason: textual_variant
  - marker: f
    text: 本段所有第二人称都是复数。结尾两次使用同一个“贫穷”名词，字面为“你们处在贫穷中，而且你们就是贫穷”。
    reason: dialect_note
lexical_decisions:
- source_word: ⲥⲱⲕ ϩⲏⲧⲛⲧⲱⲧⲛ
  choice: 带领你们
  rationale: ⲥⲱⲕ 的基本义为“拉、牵引、带领”；原文没有明说“引入歧途”，因此采用中性的“带领”以免增添判断。
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: 国度
  rationale: 既可表达王权统治，也可表达其领域；“国度”在现代中文中简洁自然，并保留原文未说明“谁的国度”的特点。
- source_word: ⲡⲉ / ⲛⲧⲉⲡⲡⲉ
  choice: 天空／天上的
  rationale: 与飞鸟的具体形象相配；避免把此处直接限定为神学意义上的“天国”或“天堂”。
- source_word: ⲣϣⲟⲣⲡ ⲉⲛⲧⲱⲧⲛ
  choice: 比你们先到
  rationale: 字面意义为“在你们之前／先于你们”；中文补出“到”可清楚表达语境中的先行抵达，而不改变论旨。
- source_word: ⲛⲡⲉⲧⲛϩⲟⲩⲛ … ⲛⲡⲉⲧⲛⲃⲟⲗ
  choice: 在你们里面……在你们外面
  rationale: 保留内外相对的空间表达，不将其解释为特定的心理、宇宙论或教会论概念。
- source_word: ⲥⲟⲟⲩⲛ ⲛⲧⲱⲧⲛ
  choice: 认识自己
  rationale: 直译反身结构，保留“认识”既可能指认知也可能指深层识得的语义张力。
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁⲥⲟⲟⲩⲛ ⲛⲧⲱⲧⲛ
  choice: 你们就会被认识
  rationale: 科普特语不定第三人称复数可起被动作用；被动译法避免擅自指定认识他们的主体。
- source_word: ⲛ̄ϣⲏⲣⲉ
  choice: 儿女
  rationale: 手稿原貌为复数，且与复数“你们”一致；“儿女”可自然涵盖群体，不把所有受话者限定为男性。
- source_word: ⲙⲛⲧϩⲏⲕⲉ
  choice: 贫穷
  rationale: 同一名词在“处在贫穷之中”和“就是贫穷”中重复出现；中文保留这一刻意且尖锐的重复。
theological_decisions:
- issue: “国度”的所属者
  choice: 只译“国度”
  alternative: “神的国度”
  rationale: 现存科普特文本此处只有“国度”，没有“神的”；不依据希腊残片的常见复原或平行传统补入。
- issue: 国度“在里面和外面”的含义
  choice: 保持空间性陈述，不加解释
  alternative: 解释为内在心灵、普遍临在或特定救恩状态
  rationale: 原文的简短对举具有真实歧义；译文不应替作者消解其神学张力。
- issue: “会被认识”的施事者
  choice: 使用无施事者的被动句
  alternative: “神会认识你们”或“人们会认识你们”
  rationale: 原文没有明示施事者，故不指定是神、人或其他主体。
- issue: “活着的父”
  choice: 那位活着的父
