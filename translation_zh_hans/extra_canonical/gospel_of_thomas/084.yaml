base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
translation:
  language: zh_hans
  text: 耶稣说：“在你们看见自己的相貌的那一天，你们便欢喜。但当你们看见那些在你们之前就已形成[b]的形像[a]——它们既不死，也不显现[c]——你们要承受多少呢！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “形像”所对应的科普特语ϩⲓⲕⲱⲛ，是希腊语εἰκών（eikōn）的借词。原文在这里不用前面的ⲉⲓⲛⲉ（“相貌”），因而译文也保留两者的区别。
    reason: 说明原文有意使用两个不同词，并避免将这种区别过度神学化。
  - marker: b
    text: 抄本中的ⲛ̄ⲧⲁϩϣⲱⲡⲉ使用地方性形式ϩ，功能相当于第三人称复数代词ⲩ，意思是“它们形成了／产生了”。
    reason: 交代抄本的方言形式及其语法功能。
  - marker: c
    text: 抄本在“死”和“显现”前使用的ⲙⲁ-，是通常否定习惯式前缀ⲙⲉⲣⲉ-的地方性变体。
    reason: 交代抄本的方言否定形式，说明“既不……也不……”的译法。
lexical_decisions:
- source_word: ⲉⲓⲛⲉ
  choice: 样貌
  rationale: 指可见的相貌或样子；采用“样貌”以便与后文借自希腊语的ϩⲓⲕⲱⲛ（形像）保持词汇区别，同时不预先断定其神学性质。
- source_word: ϩⲓⲕⲱⲛ
  choice: 形像
  rationale: 这是希腊语εἰκών的借词。“形像”既保留其与“样貌”的区别，也不把含义过度解释成“神圣对应体”或其他特定学说。
- source_word: ϣⲱⲡⲉ
  choice: 形成
  rationale: 此处表达这些形像在受话者以前已经产生或存在；“形成”保留起源含义，又避免明确指定创造者。
- source_word: ϩⲓⲧⲉⲧⲛⲉϩⲏ
  choice: 在你们之前
  rationale: 可表达时间或次序上的先于；上下文谈到形像的形成，中文自然理解为时间上的在先，同时未加入“先存”等术语。
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 显现
  rationale: 该短语有显露、显明、变得可见之意；“显现”简洁地保留其状态性和神秘张力。
- source_word: ϥⲓ ϩⲁ
  choice: 承受
  rationale: 这是表示负担、忍受或承担的习语；“承受多少”保留宾语未明的开放性，不补入原文没有的“重担”或“痛苦”。
theological_decisions:
- issue: ⲉⲓⲛⲉ与ϩⲓⲕⲱⲛ的关系
  choice: 分别译作“样貌”与“形像”
  alternative: “相似之处”与“诸形体”，或均译作“形像”
  rationale: 原文有意使用两个不同词。译文保留区别，却不把后者直接定性为永恒、神圣或灵性的本体。
- issue: “在你们之前形成”的所指
  choice: 保留形像先于受话者形成这一陈述
  alternative: 解释为“你们先存的神圣原型”
  rationale: 原文表达先后关系，但没有明说这些形像是谁创造、如何存在或具有何种本体地位，因此不引入特定宇宙论。
- issue: 结尾反问的含义
  choice: 译作“你们要承受多少啊”
  alternative: “你们将何等难以忍受”或“你们要承担多大的重担”
  rationale: 保留原文反问及其宾语不明确的张力，不擅自说明所承受的是震惊、启示、审判还是负担。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“在……的那一天”对应开头的时间表达，以“就欢喜”呈现一般性陈述；结尾保留感叹式反问。脚注标记均置于正文相应词语之后。
