base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/070.yaml
  text: Jesus said, “When you bring it forth within yourselves, this—what you have—will save you; otherwise, poverty is in you. This—what you do not have within yourselves, inside—will kill you.”
translation:
  language: zh_hans
  text: 耶稣说：“当你们使那在自己里面的生发出来[a]时，这——你们所拥有的——会救你们[b]；否则[c]，贫穷[d]就在你们里面。这——你们内里[f]所没有的——会杀死你们[e]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生发出来”对应一个带使成意味的表达，较直译可作“使之产生／使之成为”。原文没有说明那“在自己里面的”究竟是什么。
    reason: lexical_alternative
  - marker: b
    text: “救”也可译作“解救”或“拯救”；鉴于它与末句“杀死”形成对举，这里译作“救”。
    reason: lexical_alternative
  - marker: c
    text: 此处的 ⲡⲏ 按转折或另择关系译作“否则”；也有人理解为“或是”“宁可”，或为使译文流畅而不单译此词。
    reason: alternative_reading
  - marker: d
    text: “贫穷”直译抽象名词 ⲙⲛⲧⲁⲁⲛⲟⲛ；为保留原文突兀而有力的措辞，不意译为“缺乏”。
    reason: cultural_note
  - marker: e
    text: 手稿第 45 页第 33 行末尾有破损；“会杀死”一词中的未来成分部分由编者补出，但整体读法和句意可靠。
    reason: lacuna_or_restoration
  - marker: f
    text: “内里”对应 ϩⲛⲧⲏⲛⲉ，即“在里面／内在地”；译文明确译出，以保留原文对内在性的再次强调。
    reason: dialect_note
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ
  choice: 若
  rationale: 该时间从属词在这里引出一般性条件；汉语用“若”既保留条件意味，也符合格言体的庄重简洁。
- source_word: ϣⲁϫⲡⲉ ⲡⲏ ϩⲛ̄ⲧⲏⲩⲧⲛ̄
  choice: 把自己里面的生发出来
  rationale: ϫⲡⲟ/ϫⲡⲉ 表示产生、生出；“生发出来”保留由内而外产生之意，又不把未明说的对象具体化。
- source_word: ⲡⲁⲓ̈ ⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛϥ
  choice: 你们所有的
  rationale: 存在结构 ⲟⲩⲛ 与人称形式连用表达领有；用“所有的”保留所指对象未明的特点。
- source_word: ⲧⲟⲩϫⲉ
  choice: 救
  rationale: 该词可表示拯救、解救；与后文“杀死”构成鲜明对举，因此译作“救”最贴切。
- source_word: ⲉϣⲱⲡⲉ ⲙⲛ̄ⲧⲛ̄ ⲡⲏ ϩⲛ̄ⲧⲏⲩⲧⲛ̄
  choice: 你们若没有那在自己里面的
  rationale: 按手稿连续句法，ⲉϣⲱⲡⲉ 引出条件，ⲙⲛ̄ⲧⲛ̄ 表示“你们没有”，ⲡⲏ ϩⲛ̄ⲧⲏⲩⲧⲛ̄ 是其宾语“那在你们里面的”。
- source_word: ϩⲛ̄ⲧⲏⲛⲉ
  choice: 里面
  rationale: 指内部、内里；译文再次明确译出，以保留原文反复强调内在性的表达。
- source_word: ⲙⲟⲩⲟⲩⲧ
  choice: 杀死
  rationale: 这是使役性的“使死”，用“杀死”保留与“救”的强烈反差。
theological_decisions:
- issue: “里面的”究竟指什么
  choice: 保留为未指明的“自己里面的／那在自己里面的”
  alternative: 解释为真理、神的国、灵性知识或某种内在本质
  rationale: 原文没有明说其所指；把它具体解释为任何神学概念都会消除格言本有的开放性和张力。
- issue: 第二句的句法与“贫穷”读法
  choice: 依手稿句法译作“你们若没有那在自己里面的”
  alternative: 依所给规范化文本的异常切分译作“否则，贫穷在你们里面”
  rationale: 手稿原文 ⲉϣⲱⲡⲉ ⲙⲛ̄ⲧⲛ̄ ⲡⲏ ϩⲛ̄ⲧⲏⲩⲧⲛ̄ 自然构成“如果你们没有那在你们里面的”；所谓“贫穷”来自规范化串中将相邻形式合并为 ⲙⲛⲧⲁⲁⲛⲟⲛ 的处理，既与手稿分词不合，也破坏后半句的平行结构。
translation_notes:
  register: 采用现代、庄重而简洁的格言体。“生发出来”略带书面色彩，用来传达原文“从里面产生并带出来”的动作；其余措辞尽量通俗。重复“里面”是有意保留原文对内在性的反复强调。
