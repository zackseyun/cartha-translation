- source_word: ⲭⲣⲏⲥⲧⲟⲥ
  choice: 善良
  rationale: 按抄本所见希腊语借词 χρηστός 译为“善良”，保留其“良善、仁厚”的通常意义；异读可能性另见脚注。
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: 佃农
  rationale: 指受托耕作葡萄园并向园主交付果实的农人；“佃农”比泛称“农夫”更能自然呈现叙事中的租佃关系。
- source_word: ϩⲙϩⲁⲗ
  choice: 奴仆
  rationale: 原词可指奴隶或仆役；“奴仆”既不把其弱化为普通雇员，也符合庄园语境和现代中文叙事语体。
- source_word: ⲕⲉⲕⲟⲩⲉⲓ
  choice: 差点
  rationale: 相关科普特语短语是表示“几乎、险些”的惯用表达；“差点把他杀死”自然且准确。
- source_word: ⲥⲟⲩⲱⲛ
  choice: 认识
  rationale: 依抄本的人称形式直译为“他不认识他们”，不改成符合理想化寓言逻辑的“他们不认识他”。
- source_word: ϣⲓⲡⲉ ϩⲏⲧ-
  choice: 敬重
  rationale: 该结构表示在某人面前感到羞愧、敬畏或尊重；此处“敬重”最符合现代中文语境，同时不引入额外解释。
- source_word: ϭⲱⲡⲉ
  choice: 抓住
  rationale: 准确表达拿住、捉住之意，适合叙事中的暴力行动。
theological_decisions:
- issue: 是否按对观福音中的平行寓言补足或协调细节
  choice: 严格保留《多马福音》科普特文本自身的叙事形式
  alternative: 参照对观福音补入酒榨、瞭望楼、多名奴仆或园主审判等细节
  rationale: 本段没有那些细节，也没有给出结尾审判；补入会掩盖《多马福音》版本独有的简洁结构与张力。
- issue: 园主所说“他不认识他们”的人称张力
  choice: 保留抄本读法“他不认识他们”
  alternative: 校改为“他们不认识他”
  rationale: 现存抄本的语法指向奴仆不认识佃农；虽然叙事逻辑不同寻常，却仍可理解为园主猜测奴仆找错了人，因此不应无提示地校改。
- issue: “儿子”与“继承人”的寓意身份
  choice: 只翻译叙事明说的身份，不在正文中将其明确等同于任何神学人物
  alternative: 在译文中直接称儿子为弥赛亚、基督或上帝之子
  rationale: 原文让寓意关系保持开放；译文不应把可能的神学指涉变成正文中的明示解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。叙事以短句推进，保留口传寓言的直接感；用“佃农”“奴仆”“继承人”等明确但不过度解释的词语。结语“有耳朵的，就应当听”保留原文劝听式格言的凝练力度。
