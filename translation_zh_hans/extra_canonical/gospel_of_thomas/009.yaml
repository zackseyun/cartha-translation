- from: 耶稣说：“看哪，撒种的人出去了；他抓满一手，把种子撒出去。[a]有些落在路上，飞鸟来了，把它们收走了。[b]另有些落在岩石上；它们没有向下扎根到土里，也没有向上抽穗到天空。[c]另有些落在荆棘中；荆棘把种子挤住了，虫子又吃了它们。[d]还有些落在好土里；好土向着天空结出佳美的果实，收成有六十份，又有一百二十份。”[e]
  to: 耶稣说：“看哪，撒种的人出去了；他抓满一手种子，把种子撒出去。[a]有些落在路上，飞鸟来了，把它们收走了。[b]另有些落在岩石上；它们没有向下扎根到土里，也没有向上抽穗到天空。[c]另有些落在荆棘中；荆棘把种子挤压住了，虫子又吃了它们。[d]还有些落在好土里；好土向着天空结出好果实，收成有六十份，又有一百二十份。”[e]
  rationale: 作两项轻微而安全的修订：补出“种子”以使“抓满一手”的汉语表达完整；将“挤住”改为“挤压住”，更充分表达荆棘对种子的压迫／窒息动作。另将“佳美的果实”简化为“好果实”，更直接对应原文的“好”。其余独特细节、数字与计量歧义均予保留，脚注锚点完整有效。
