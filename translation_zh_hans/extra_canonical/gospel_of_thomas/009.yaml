base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/009.yaml
  text: 'Jesus said, "Behold, the sower went out; he filled his hand and cast seed. Some indeed fell on the path; the birds came and gathered them. Others fell on the rock, and they did not cast root down to the ground, and they did not send ears of grain up to the sky. And others fell on the thorns; they gathered them, choked the seed, and the worm ate them. And others fell on the good ground, and it gave good fruit up to the sky: it yielded sixty measures and one hundred twenty measures."'
translation:
  language: zh_hans
  text: 耶稣说：“看哪，撒种的人出去了；他抓满一手种子，把种子撒出去。[a]有些落在路上，飞鸟来了，把它们收走了。[b]另有些落在岩石上；它们没有向下扎根到土里，也没有向上抽穗到天空。[c]另有些落在荆棘中；荆棘把种子挤压住了，虫子又吃了它们。[d]还有些落在好土里；好土向着天空结出好果实，收成有六十份，又有一百二十份。”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文特意写撒种的人先“抓满一手”再撒；这一动作细节不见于对观福音的平行叙述。
    reason: textual_variant
  - marker: b
    text: 这里的科普特语动词意为“聚拢、收取”；因此译作“收走”，没有按照对观福音改成“吃尽”。
    reason: lexical_ambiguity
  - marker: c
    text: 原文把“向下扎根到土里”和“向上抽穗到天空”并列，形成鲜明的上下意象。
    reason: textual_variant
  - marker: d
    text: 种子又被虫子吃掉，是《多马福音》这个版本特有的破坏细节。
    reason: textual_variant
  - marker: e
    text: “份”所译的词可指量度或产量；原文列出六十和一百二十，具体可理解为“六十份、一百二十份”，也可能表示相应的收成量。这里不按对观福音改作“三十倍、六十倍、一百倍”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲥⲓⲧⲉ
  choice: 撒种的人
  rationale: 按科普特语施事表达直译为“撒种的人”，在现代汉语中自然且保留比喻角色。
- source_word: ⲙⲉϩⲧⲟⲟⲧϥ
  choice: 抓满一手
  rationale: 保留“使自己的手满了”的具体动作；比“取了种子”更能呈现《多马福音》文本独有的身体细节。
- source_word: ⲕⲱⲧϥ
  choice: 收走
  rationale: 该动词在此表示聚拢、收取，不按对观福音的平行叙述改成“吃尽”；“收走”也符合飞鸟对种子的动作。
- source_word: ⲧⲉⲩⲉϩⲙⲥ
  choice: 抽穗
  rationale: 复合表达含“发出”和“谷穗”之意；“向上抽穗”自然传达与“向下扎根”相对的垂直意象。
- source_word: ⲱϭⲧ
  choice: 挤住
  rationale: 词义可涵盖压迫、挤压或窒息；结合荆棘与种子，译作“挤住”既具体又不把意象过度解释为植物被完全闷死。
- source_word: ϥⲛⲧ
  choice: 虫子
  rationale: 通常指虫、蠕虫；现代汉语“虫子”比“蛆”更中性，也不增加原文没有明确给出的种类。
- source_word: ⲉⲥⲟⲧⲉ
  choice: 份
  rationale: 该词涉及量度或产量，具体计量方式不够明确；正文用“份”保持可读性，脚注说明也可理解为“量”或收成倍数。
theological_decisions:
- issue: 是否与对观福音的撒种比喻协调
  choice: 保留《多马福音》的独特细节和数目
  alternative: 把飞鸟写成“吃尽”，把产量改成三十倍、六十倍、一百倍等对观福音措辞
  rationale: 现存科普特文本明确呈现“抓满一手”、飞鸟“收走”、根向下与穗向上的对照、虫子以及六十和一百二十等差异；协调文本会掩盖本见证的独立形态。
- issue: 好土“向着天空”结果的意象
  choice: 按原文保留方向性表达
  alternative: 简化为“结出好果实”
  rationale: 原文重复向上的空间表达，与前文未能向上抽穗形成呼应；不宜把它解释成特定的属灵升天教义，也不宜删去。
- issue: 六十与一百二十的产量表达
  choice: 译为“六十份，又有一百二十份”，并以脚注保留词义不确定性
  alternative: 断定为“六十倍和一百二十倍”或具体容积单位
  rationale: 科普特语数量结构及ⲉⲥⲟⲧⲉ可涉及量度或产量，但不足以确定现代计量单位；避免用对观福音的“倍”预先消解歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。用“看哪”保留宣告语气；用分号呈现原文连续而简洁的动作链。植物意象采用普通读者熟悉的“扎根、抽穗、好土、收成”，同时保留原文不寻常的垂直方向、虫子和产量数字。
