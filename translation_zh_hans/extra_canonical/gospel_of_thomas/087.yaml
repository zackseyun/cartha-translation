base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/087.yaml
  text: Jesus said[a], “Wretched is the body that depends on a body[d][c][b], and wretched is the soul that depends on these two.”
translation:
  language: zh_hans
  text: 耶稣说：“依赖[a]一个身体的身体真可悲；依赖这两个[b]的灵魂也真可悲。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “依赖”所译的ⲉⲓϣⲉ（ⲁϣⲉ）与ⲛ加宾语可表示“靠在、倚靠”或“建立在……之上”；此处译为“依赖”。
    reason: 说明动词的词义选择
  - marker: b
    text: 原文直译为“这两个”。它通常被理解为回指前半句所涉及的两个身体：依赖的身体和它所依赖的身体；正文不补出“身体”，以保留原文的简略表达。
    reason: 说明双数代词的可能指向并保留原文表达
lexical_decisions:
- source_word: ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲛ / ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ
  choice: 可悲的是
  rationale: 这个希腊语借词意为“悲惨、可怜”。译作“可悲的是”保留强烈的负面评价，同时比“有祸了”更少引入审判或咒诅意味。
- source_word: ⲥⲱⲙⲁ
  choice: 身体
  rationale: 这是希腊语 σῶμα 的借词，通常指身体。
- source_word: ⲉⲓϣⲉ（关系形式：ⲉⲧⲉⲣⲉⲉⲓϣⲉ）+ ⲛ
  choice: 依赖
  rationale: 该结构可表达立于、靠在或倚赖某物；“依赖”自然地保留这里持续的关系含义，而不强行译成起源性的“产生于”。
- source_word: ⲯⲩⲭⲏ
  choice: 灵魂
  rationale: 这是希腊语 ψυχή 的借词；在本句身体与灵魂的对举中，“灵魂”最为清楚。
- source_word: ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ
  choice: 这两个身体
  rationale: 原文直译为“这两个”，回指前半句所涉及的两个身体。正文补出“身体”，避免现代汉语读者误以为是身体与灵魂。
theological_decisions:
- issue: “这两个”所指为何
  choice: 理解为前句涉及的两个身体，即依赖者与被依赖者
  alternative: 理解为身体和灵魂
  rationale: 双数短语紧接在灵魂所依赖的对象位置，并回指第一分句中明说和隐含的两个身体；若指身体与灵魂，会使灵魂依赖自身，并削弱原句刻意形成的递进关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“另一个身体”把科普特语不定形式在汉语中自然表达出来；保留身体与灵魂之间尖锐而略显费解的张力，不加入特定宗派的解释。
