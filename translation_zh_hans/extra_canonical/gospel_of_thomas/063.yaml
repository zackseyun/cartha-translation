revisions:
- from: 耶稣说：“有一个财主，拥有许多钱财[a]。他说：‘我要运用我的钱财，好让我撒种、收割[b]、栽种，并把我的仓房[c]装满出产，使我什么也不缺。’这些就是他心里所盘算的事。就在那一夜，他死了。凡有耳朵的，都应当听[d]。”
  to: 耶稣说：“有一个财主，拥有许多钱财[a]。他说：‘我要运用我的钱财，好让我撒种、收割[b]、栽种，并把我的仓房[c]装满出产，使我什么也不缺。’这些就是他心里所盘算的事。就在那一夜，他死了。有耳朵的，就让他听吧[d]。”
  rationale: 仅作一处低风险的语气校正：以“有耳朵的，就让他听吧”对应原文简短的“有耳朵的，让他听”，不增添“可听”，也不以“应当”强化为义务命令。其余译文及脚注均可保留。
