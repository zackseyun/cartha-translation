base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/063.yaml
  text: Jesus said[a], “There was a rich man who had a lot of money. He said, ‘I will use my money, so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce, so that I will lack nothing.’ These were the things he was thinking in his heart. And in that night, he died. Whoever has ears[i][h][g][f][e][d][c][b], let that one hear.”
translation:
  language: zh_hans
  text: 耶稣说：“有一个财主，拥有许多钱财[a]。他说：‘我要运用我的钱财，好让我撒种、收割[b]、栽种，并把我的仓房[c]装满出产，使我什么也不缺。’这些就是他心里所盘算的事。就在那一夜，他死了。有耳朵的，就让他听吧[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钱财”所译的科普特词也可指“财富”或“财物”。
    reason: lexical_alternative
  - marker: b
    text: “收割”一词在手稿中有字母受损；这里采用校勘本的复原读法。
    reason: lacuna_or_restoration
  - marker: c
    text: “仓房”也可译作“谷仓”或“储藏室”。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“有耳朵的，让他听”，没有对观福音某些平行句式中的“有耳可听”一语。
    reason: source_distinction
lexical_decisions:
- source_word: ⲛⲡⲗⲟⲩⲥⲓⲟⲥ
  choice: 财主
  rationale: 该词是源自希腊语 πλούσιος 的借词，指富有的人；“财主”在现代汉语中简洁自然，也保留其社会经济含义。
- source_word: ⲭⲣⲏⲙⲁ
  choice: 钱财
  rationale: 此词可指钱、财富或财物。上下文两次重复该词，又说要将其投入农业活动；“钱财”既具体，又不把含义缩窄为现金。
- source_word: ⲣⲭⲣⲱ
  choice: 运用
  rationale: 表达主动使用、支配钱财；“运用”比单说“用”略显庄重，同时保持语义直接。
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: 好让我
  rationale: 该连词引出目的，而非原因；译文明确表现“为了使我能够”的逻辑。
- source_word: ϫⲟ / ⲱϩⲥ / ⲧⲱⲱϭⲉ
  choice: 撒种、收割、栽种
  rationale: 按科普特文本保留三个农业动词及其原有次序，不依照相似经文改写为建筑活动。
- source_word: ⲁϩⲟ
  choice: 仓房
  rationale: 该词可指储藏室、谷仓或粮仓；“仓房”保留储存农产的具体图景，又不过度限定建筑类型。
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: 出产
  rationale: 源自希腊语 καρπός，在农业储藏语境中泛指土地的产物；“出产”比“果子”范围更合适。
- source_word: ⲣϭⲣⲱϩ ⲛⲗⲁⲁⲩ
  choice: 什么也不缺
  rationale: 直接表达否定结构“在任何事上都不匮乏”，符合现代汉语习惯。
- source_word: ⲡⲉⲧⲉⲩⲛⲙⲁϫⲉ ⲛⲛⲧⲟϥ
  choice: 凡有耳朵的
  rationale: 保留原文简短措辞；原文没有相当于“可听”的补语，不与对观福音的惯用句式协调化。
theological_decisions:
- issue: 与《路加福音》12:16—21相似叙事的关系
  choice: 按《多马福音》现存科普特文本独立翻译，保留“栽种”和简短的“有耳朵”句式
  alternative: 依照《路加福音》的平行叙事译成“盖更大的仓房”，并补成“有耳可听的”
  rationale: 现存文本使用农业动词ⲧⲱⲱϭⲉ，并未出现“建造”；结尾也没有“可听”这一补语。避免协调化，才能保存本文自身的措辞和强调。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“财主”“钱财”“仓房”保持具体图景；连续的“撒种、收割、栽种”虽次序略显出人意料，仍依原文保留。结尾用“凡……的，都应当……”自然呈现泛指劝告，同时不增添原文没有的“可听”。
