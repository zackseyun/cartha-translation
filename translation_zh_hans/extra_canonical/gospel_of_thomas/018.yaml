base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/018.yaml
  text: The disciples said to Jesus[a], “Tell us how our end will be.” He said, “Have you found the beginning, then, that you are seeking the end? For in the place where the beginning is, there the end will be. Blessed is the one who will stand in the beginning; he will know the end[d][c][b], and he will not taste death.”
translation:
  language: zh_hans
  text: 门徒们对耶稣说：“请告诉我们，我们的结局会是怎样的？”耶稣说：“那么，你们已经发现了开端，才来寻求结局吗？[a] 因为开端所在之处，结局也将在那里。[b] 那将要在开端中立在其面前的人是有福的；[c] 他将知道结局，也不会尝到死亡的滋味。[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那么……才来……吗？”原文的语气词组合使这句话带有反问意味；也可较直地理解为：“你们已经发现了开端，因此才寻求结局吗？”
    reason: lexical_alternative
  - marker: b
    text: 原文直陈“开端所在的地方，结局也将在那里”，明确保留了“地方/所在之处”的说法。
    reason: cultural_note
  - marker: c
    text: “立在其面前”中的“其”对应阳性单数后缀，可能指“开端”，也可能暗指一位未明说的“本原”或“第一者”；原文没有消除这种歧义。
    reason: dialect_note
  - marker: d
    text: “尝到死亡的滋味”是原文表示经历死亡的固定说法。
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲟⲟⲥ ⲉⲣⲟⲛ（规范化作 ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ）
  choice: 请告诉我们
  rationale: 原文是“说给我们”的命令式请求；“请告诉我们”符合现代汉语对话习惯，又保留请求语气。
- source_word: ⲡϩⲁⲏ
  choice: 结局
  rationale: 该词可指末端、终结或完成；此处与“开端”相对。“结局”既适用于门徒所问“我们的结局”，也保留随后关于终末的张力。
- source_word: ⲡⲁⲣⲭⲏ
  choice: 开端
  rationale: 这是希腊语 ἀρχή 的借词，可指开始或本源。“开端”能与“结局”形成清楚而紧凑的对照，同时不预先把它解释为某个具位格的“本原”。
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: 发现了
  rationale: 该动词表示发现、找出；“发现”比单纯“找到”稍能体现揭示、寻得之意，但不额外加入启示论解释。
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ ⲡϩⲁⲏ
  choice: 寻求结局
  rationale: ϣⲓⲛⲉ 与 ⲛⲥⲁ 构成“寻找、寻求”的表达；“寻求”保留语句的郑重和主动追索意味。
- source_word: ϩⲛ ⲡⲙⲁ ⲉⲧⲉⲣⲉ … ⲙⲙⲁⲩ
  choice: 所在之处……在那里
  rationale: 原文明确使用“地方/所在之处”的结构；译文保留前后呼应的处所表达。
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: 是有福的
  rationale: 源自希腊语 μακάριος。“有福”符合庄重的宗教格调，也比“幸运”更能保留祝福宣告的语气。
- source_word: ⲁⲱϩⲉ ⲉⲣⲁⲧϥ
  choice: 立在其面前
  rationale: 保留“站立”以及 ⲉⲣⲁⲧϥ 所含“在它/他面前”的成分，不把代词所指悄然确定下来。
- source_word: ⲥⲟⲟⲩⲛ
  choice: 知道
  rationale: 采用该词最直接的常用义，维持“知道结局”的简洁表达，不扩展为“参透”或“领悟”。
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: 尝到死亡的滋味
  rationale: 这是表示经历死亡的固定表达；中文“尝到死亡的滋味”既保留原文意象，也自然可懂。
theological_decisions:
- issue: “开端”究竟只是时间或宇宙论意义的开始，还是暗指具位格的“本原/第一者”
  choice: 正文译作“开端”，并以“其”保留后文代词的开放性
  alternative: 译作“本原”或“第一者”，并写成“立在他面前”
  rationale: 原文的 ⲡⲁⲣⲭⲏ 可表示开始或本源，而第三人称阳性单数后缀既可回指语法上为阳性的“开端”，也可能让读者听出具位格的含义。正文不替文本作神学定论。
- issue: “不会尝到死亡”是免于肉身死亡，还是指终极、属灵意义上的死亡
  choice: 保留原文习语，不加解释性限定
  alternative: 译作“不会经历死亡”或明确解释为某一种死亡
  rationale: 原文没有限定死亡的性质；直译其意象可保存这项神学张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“开端—结局”贯穿全段，以保留原文反复和对称结构；不使用艰深的哲学术语。“在开端中立在其面前”略带陌生感，是为保留原文处所结构与代词指向的真实歧义，而不将其顺译成单一神学解释。
