  to: 门徒对耶稣说：“我们知道你将要离开我们。[a] 谁将在我们之上为大呢？[b]”耶稣对他们说：“无论你们在哪里，[c] 都要到义人雅各那里去；就是这位，天地因他而成。[d]”
