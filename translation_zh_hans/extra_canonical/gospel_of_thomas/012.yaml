base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/012.yaml
  text: The disciples said to Jesus[a], "We know that you will depart from us. Who will be great over us?" Jesus said to them, "Wherever you are, you are to go to James the Just—this one[f][e][d][c][b], for whose sake heaven and earth came into being."
translation:
  language: zh_hans
  text: 门徒对耶稣说：“我们知道你将要离开我们。[a] 谁将在我们之上为大呢？[b]”耶稣对他们说：“无论你们在哪里，[c] 都要到义人雅各那里去；就是这位，天地因他而成。[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开”所译的词基本义是“去”；结合“从我们”也可译作“从我们这里走”。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“谁将在我们之上成为大的？”也有人把这句话理解为“谁将统领我们”，但原文没有直接使用“统治”一词。
    reason: lexical_alternative
  - marker: c
    text: 手稿原文直译近于“你们来到的地方”。这是表示所处之地的习语，因此正文译作“无论你们在哪里”；原文并没有“你们自己”的反身强调。
    reason: alternative_reading
  - marker: d
    text: “因他而成”也可译作“为他的缘故而成”或“因为他”；原文容许原因、关联及“为其缘故”的色彩相互交叠。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲁⲑⲏⲧⲏⲥ
  choice: 门徒
  rationale: 这是源自希腊语 μαθητής 的借词；在早期基督教语境中，“门徒”既准确又符合现代汉语习惯。
- source_word: ⲛⲧⲟⲕⲛⲁⲃⲱⲕ ⲛⲧⲛⲁⲛⲟⲛ
  choice: 你将要离开我们
  rationale: ⲃⲱⲕ 基本义为“去”，与表示来源、分离的“从我们”连用时，译作“离开我们”能自然表达语境，同时不具体说明离开的方式或原因。
- source_word: ⲉⲧⲉⲣⲉⲛⲁⲣⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲛⲁⲛⲟⲛ
  choice: 会在我们之上为大
  rationale: 保留 ⲣⲛⲟϭ 的“为大”和 ⲉϩⲣⲁⲓ ⲉϫⲛ- 的“在……之上”，避免直接解释成“统治”或正式的教会职位。
- source_word: ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ
  choice: 无论你们在哪里
  rationale: 手稿实际读法是关系式完成时结构，直译近于“你们来到的地方”；这里没有独立反身代词。按科普特语习语译为“无论你们在哪里”最为自然。
- source_word: ⲉⲧⲉⲧⲛⲁⲃⲱⲕ ϣⲁ
  choice: 都要到……那里去
  rationale: 表达面向某人的行动指示；“要……去”保留指令语气，而不过度强化为命令。
- source_word: ⲓⲁⲕⲱⲃⲟⲥ ⲡⲇⲓⲕⲁⲓⲟⲥ
  choice: 公义的雅各
  rationale: ⲇⲓⲕⲁⲓⲟⲥ 是希腊语借词，意为“公义的、正直的”；采用透明的描述性译法，不预先断定它只是固定称号。
- source_word: ⲡⲁⲉⲓ ⲛ̄ⲧⲁⲧⲡⲉ ⲙⲛ̄ⲡⲕⲁϩ ϣⲱⲡⲉ ⲉⲧⲃⲏⲧϥ
  choice: 天地是为了他而产生的
  rationale: ϣⲱⲡⲉ 表示“成为、产生”，ⲉⲧⲃⲏⲧϥ 可表达“为了他、因他缘故”；正文采用目的/受益色彩较明确的译法，并以脚注保留因果理解。
theological_decisions:
- issue: 雅各在门徒中的地位
  choice: 保留“到公义的雅各那里去”的直接指示
  alternative: 解释为雅各将统治、接任或担任教会领袖
  rationale: 原文确实将门徒指向雅各，却没有明确使用“接班”“统治”或某种职衔；不把隐含的领导意义扩写成制度性结论。
- issue: “天地为他而产生”的语义力度
  choice: 按原文保留强烈的宇宙性陈述
  alternative: 弱化为“天地都敬重他”或把“他”解释为另一对象
  rationale: 原文明确以单数阳性代词回指最近的雅各，并使用“天地成为/产生”的措辞；译文不缓和其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。问句“在我们之上为大”有意保留原文略显生硬的空间隐喻，以免把它直接制度化为“领导”或“统治”。“公义的雅各”保持描述语与称号之间的开放性；末句保留原文惊人的宇宙性断言，不加释义性缓和。
