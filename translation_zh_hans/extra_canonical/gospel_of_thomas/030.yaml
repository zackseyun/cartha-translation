base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/030.yaml
  text: Jesus says[1], "Where there are three gods, they are gods. Where there are two or one[a][3][2], I am with him."
translation:
  language: zh_hans
  text: 耶稣说：“有三个神的地方，他们是神[a]；有两个或一个的地方，我与他同在[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特抄本此处作“ϩⲛ̄ⲛⲟⲩⲧⲉ ⲛⲉ”，按字面可理解为“他们在一个神里面”；规范化文本则作“ⲟⲩⲛⲟⲩⲧⲉ ⲡⲉ”（约作“是一个神”）。本译文根据抄本的复数系词，并参照希腊文残片 POxy 1，译作“他们是神”。
    reason: textual_variant
  - marker: b
    text: 希腊文残片 POxy 1 此处没有“两个”，只说“只有一人时”；随后还有“举起石头……劈开木头……”等话，这些话在科普特抄本中另见于语录77。
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: ⲡⲉϫⲉ 是《多马福音》引出语录的惯用形式；用现代汉语现在时“说”，保留语录鲜明、直接的表达。
- source_word: ⲡⲙⲁ ⲉⲣⲉ- … ⲙⲙⲁⲩ
  choice: 有……的地方
  rationale: 原文直译为“……所在的地方”；汉语用“有……的地方”既保留地点意象，又自然清楚。
- source_word: ϣⲟⲙⲧ ⲛⲛⲟⲩⲧⲉ
  choice: 三个神
  rationale: 保留 ⲛⲟⲩⲧⲉ 的复数和原文引人不安的直白措辞，不改译为较弱的“神明”或作单数处理。
- source_word: ⲟⲩⲛⲟⲩⲧⲉ ⲡⲉ / 抄本 ϩⲛ̄ⲛⲟⲩⲧⲉ ⲛⲉ
  choice: 他们是神
  rationale: 依抄本复数系词及希腊文旁证作复数表语理解，同时以脚注交代科普特抄本与规范化文本之间的困难，避免掩盖异文。
- source_word: ⲥⲛⲁⲩ ⲏ ⲟⲩⲁ
  choice: 两个或一个
  rationale: 逐一保留科普特文的两个数词及选择连词；不因希腊旁证省略“两个”而删改现存科普特正文。
- source_word: ⲁⲛⲟⲕ ϯϣⲟⲟⲡ ⲛⲙⲙⲁϥ
  choice: 我与他同在
  rationale: 抄本的独立代词 ⲁⲛⲟⲕ 加第一人称现在时形式表示明确或强调的主语，并非两个彼此并列的“我”；汉语以自然庄重的“我与他同在”表达。
- source_word: ⲛⲙⲙⲁϥ
  choice: 与他同在
  rationale: 保留原文阳性单数代词“他”，不把所指解释成群体或抽象存在。
theological_decisions:
- issue: “三个神……他们是神”的多神措辞
  choice: 按字面保留“神”的复数
  alternative: 改作“神明”，或从神学上重释为其他对象
  rationale: 原文确实使用“神”的复数；译文不以任何教派体系消解这句语录本身的张力。
- issue: “两个或一个”与“我与他同在”的数与指代关系
  choice: 保留原句不协调之处
  alternative: 补成“我与他们同在”或解释“两个”中的某一人
  rationale: 科普特文末尾是阳性单数“他”；不擅自使其与前面的“两个”在数上协调，也不指定代词所指。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留语录体的凝练和原文的突兀感。“同在”自然表达陪伴与临在，但不进一步规定其神学含义。脚注标记均已置于正文相应位置。
