base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/059.yaml
  text: Jesus said[a], “Seek after the Living One while you are living[g][f][e][d][c][b], so that you do not die and then seek to see him—and you will not be able to see.”
translation:
  language: zh_hans
  text: 耶稣说：“趁你们还活着，要寻求那位活着的[a]，免得你们死了，再去寻求见他，却不能见。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位活着的”直译为“正在活着的那一位”；也可译作“那活着的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱϣⲧ ⲛⲥⲁ
  choice: 寻求
  rationale: 该动词与介词组合表示追寻、寻找；“寻求”既自然，又保留主动追求的意味。
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: 那位活着的
  rationale: 按关系结构直译为“那位活着的”，既保留其可能具有称号意味的分量，也不预先断定具体身份。
- source_word: ϩⲱⲥ ⲉⲣⲉⲛⲧⲱⲧⲛⲱⲛϩ
  choice: 趁你们还活着
  rationale: 此环境从句在这里具有时间意义；该表达符合现代汉语，并凸显行动时机。
- source_word: ϩⲓⲛⲁ ϫⲉ ⲛⲛⲉ…ⲙⲟⲩ
  choice: 免得你们死后才……
  rationale: 否定目的结构可译为“免得”；结合后续并列动作，用“死后才”清楚呈现警告中的时间推进。
- source_word: ϣⲓⲛⲉ ⲉⲛⲁⲩ
  choice: 寻求见
  rationale: ϣⲓⲛⲉ通常表示“寻求”，也是本书反复出现的主题词；保留为“寻求”而不改译“试图”，并以“见”表达后接不定式。
- source_word: ϣϭⲙϭⲟⲙ ⲁⲛ ⲉⲛⲁⲩ
  choice: 不能见
  rationale: ϣϭⲙϭⲟⲙ在不定式前惯用来表达能力，故译为“不能”；末尾省略的宾语在汉语中也可自然省略。
theological_decisions:
- issue: “那位活着的”是否明确作为神学称号
  choice: 采用“那位活着的”，不加专名号或身份说明
  alternative: “永活者”或“生命者”
  rationale: 原文是“那位正在活着的”这一关系短语，可能带有称号色彩，却没有在本句明确指出其身份；译文保留这种开放性。
- issue: 死亡是肉身死亡还是属灵死亡
  choice: 仅译“死”，不加限定
  alternative: “灵性死亡”或“肉身死去”
  rationale: 原文未限定死亡的性质；不应在译文中消解其神学张力。
translation_notes:
  register: 采用简洁、警策而庄重的现代标准汉语。“趁……还……”呈现原文的时间紧迫感；“那位活着的”有意保留原文在普通描述与称号之间的含混。脚注标记紧随对应短语。
