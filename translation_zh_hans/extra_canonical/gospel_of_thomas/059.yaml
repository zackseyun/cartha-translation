  to: 耶稣说：“趁你们还活着，要寻求那位活着的[a]，免得你们死了，再去寻求见他，却不能见。”
  rationale: 修订仅删除“永活者”这一超出原文语义的脚注替代项，并微调后半句，以更忠实、自然地表达死亡之后寻求看见他而不能看见的结果；不判定“那位活着的”的具体身份，也不限定“死”的性质。
