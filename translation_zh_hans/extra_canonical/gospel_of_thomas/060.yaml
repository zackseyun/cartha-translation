base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/060.yaml
  text: '⟨They saw⟩ a Samaritan carrying a lamb[a], going into Judea. He said to his disciples, "That one around the lamb?"

    They said to him, "So that he may kill it and eat it."

    He said to them, "As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse."

    They said, "Otherwise he will not be able to do it."

    He said to them, "You yourselves, seek a place for yourselves in rest[b][c], so that you will not become a corpse and they eat you."'
translation:
  language: zh_hans
  text: '**《多马福音》第60则**


    ⟨他们看见⟩[a]一个撒玛利亚人扛着一只羊羔，正进入犹太地。耶稣对门徒说：“那个在羊羔周围的呢？”[b]


    他们对他说：“为要杀了它，吃掉它。”


    他对他们说：“只要它还活着，他不会吃它；但他若杀了它，它就会成为尸体。”


    他们说：“否则，他将不能这样做。”


    他对他们说：“你们自己要在安息中为自己寻找一处地方，免得你们成为尸体，而他们吃掉你们[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄本此处缺少主要动词，字面只读作“一个撒玛利亚人”。编者据语意补出“他们看见”（ⲁⲩⲛⲁⲩ）。尖括号表示补文。
    reason: textual_variant
  - marker: b
    text: 科普特语原句高度省略，近于“那个在羊羔周围的呢？”门徒回答“为要杀了它，吃掉它”，表明他们将这句话理解为询问那人的意图；正文不把这种理解补写为明确的“为什么”问句。
    reason: lexical_alternative
  - marker: c
    text: 原文采用主动的第三人称复数，字面为“而他们吃掉你们”；“他们”未被明确指明，故正文保留这一主动而未定的表达。
    reason: register_note
lexical_decisions:
- source_word: ⲥⲁⲙⲁⲣⲉⲓⲧⲏⲥ
  choice: 撒玛利亚人
  rationale: 按族群与地域称谓直译，符合现代汉语圣经及历史文献的通行表达。
- source_word: ϩⲓⲉⲓⲃ
  choice: 羊羔
  rationale: 指幼羊；“羊羔”自然且保留其作为待宰动物的语境。
- source_word: ⲡⲏ ⲙⲡⲕⲱⲧⲉ ⲙⲡⲉϩⲓⲉⲓⲃ
  choice: 羊羔旁边的那个人呢？
  rationale: 原文是省略性很强的问句，近于“那个在羊羔周围的呢？”译文保留未明说“为什么”或“要做什么”的悬宕，同时使现代汉语尚可理解。
- source_word: ⲡⲧⲱⲙⲁ
  choice: 尸体
  rationale: 希腊语借词 πτῶμα，意为倒下的身体、尸体。前后两次采用同一译词，以保留羊羔与门徒之间刻意建立的对应；虽用于动物时“尸体”不如“尸骸”惯常，却更能保留原文重复。
- source_word: ϣⲁ
  choice: 能
  rationale: 表达能力或可能性；结合将来时结构译作“就不能这样做”。
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: 安息
  rationale: 希腊语借词 ἀνάπαυσις，可指歇息、安歇或终极的安息。译作“安息”既保留其神学分量，也不限定其具体所指。
- source_word: ⲧⲟⲡⲟⲥ
  choice: 一个……之处
  rationale: 希腊语借词 τόπος，意为地方、处所；与“安息”组合译成自然的“一个安息之处”。
theological_decisions:
- issue: 省略问句的解释
  choice: 羊羔旁边的那个人呢？
  alternative: 那个人为什么扛着羊羔？
  rationale: 原文没有明说“为什么”或“扛着”；门徒的回答显示他们把问题理解为询问那人的目的，但正文不替原文补足这一层解释。
- issue: “安息”的性质
  choice: 保留为“安息”，不加“永恒”“属灵”等限定
  alternative: 永恒的安息／灵里的安息
  rationale: 原文本身未界定这种安息的性质；保留开放性，避免导入特定宗派或解释传统。
- issue: “尸体”意象在羊羔与门徒之间的对应
  choice: 两处均译“尸体”
  alternative: 前译“尸骸”，后译“尸体”
  rationale: 统一译词保留本则言论的警告结构和神学张力，不弱化门徒可能像被宰食之羊一样成为尸体的尖锐意象。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。叙事部分力求自然；关键问句则有意保留原文的省略与突兀。对“尸体”“安息”等反复出现或具有神学分量的词，不作解释性扩写。
