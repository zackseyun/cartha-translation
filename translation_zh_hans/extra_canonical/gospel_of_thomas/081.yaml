base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/081.yaml
  text: Jesus said[a], "Whoever has become rich, let him be king; and whoever has power[c][b], let him renounce it."
translation:
  language: zh_hans
  text: 耶稣说：“凡已富有的人，让他作王[a]；凡有能力的人[b]，让他弃绝它[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作王”也可译作“掌权”或“统治”；原词是由“王”形成的动词，因此正文保留“作王”这一鲜明说法。
    reason: lexical_alternative
  - marker: b
    text: “能力”原文是一个源自希腊语的借词，也可指“力量”“权能”，在某些语境中还可指施行神迹的能力。
    reason: lexical_alternative
  - marker: c
    text: 原文没有明说“弃绝”的对象；译文补出“它”，将其理解为紧接在前面的“能力”。“弃绝”也可译作“否认”或“舍弃”。
    reason: implicit_object
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: ⲡⲉϫⲉ 是叙事中常见的引语动词；用现代汉语惯用的“说”直接引出话语，同时保留原文的简洁。
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲣⲣⲙⲙⲁⲟ
  choice: 那已经富足的人
  rationale: 关系完成式表示此人已经成为富足者；“已经富足”既体现完成意味，也保持措辞自然，并避免把财富限定为纯粹的金钱。
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲣⲣⲣⲟ
  choice: 让他作王
  rationale: ⲙⲁⲣⲉ- 表示命令或劝令；ⲣⲣⲣⲟ 是由“王”形成的动词，可指作王、掌权或统治。“作王”保留原文鲜明而突兀的表达。
- source_word: ⲁⲩⲱ
  choice: ；
  rationale: 原词是简单连接词“和”。汉语用分号连接两个平行分句，更自然地呈现其紧密并列关系，并未改变语义。
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ ⲛⲟⲩⲇⲩⲛⲁⲙⲓⲥ
  choice: 那拥有能力的人
  rationale: 该所有结构意为“有……的人”；希腊借词 ⲇⲩⲛⲁⲙⲓⲥ 可指能力、力量或权能。“能力”保持较宽的语义范围，不预先限定为政治权力或神迹之能。
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲁⲣⲛⲁ
  choice: 让他舍弃它
  rationale: ⲁⲣⲛⲁ 可指否认、拒绝承认或放弃；此处以“舍弃”表达主动放弃前述能力。科普特文未明说宾语，译文用“它”补出自然承接。
theological_decisions:
- issue: 富足者“作王”与有能力者“舍弃”的张力
  choice: 按原文保留两个并列命令，不加解释或调和
  alternative: 把“作王”解释为属灵统治，或把“能力”明确解释为世俗权力
  rationale: 原文没有说明财富、王权和能力各自的性质，也没有解释两句之间看似反常的关系；译文不应代替文本解决这种神学与伦理张力。
- issue: ⲇⲩⲛⲁⲙⲓⲥ 的所指
  choice: 译作“能力”
  alternative: “权力”“力量”“权能”或“神迹之能”
  rationale: “能力”较能保留该词的宽泛含义，避免将其专门化为政治统治、身体力量或神迹能力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留《多马福音》语录体的短促和平行结构；“富足”“作王”“能力”“舍弃”均避免过度口语化，也不加入宗派性解释。
