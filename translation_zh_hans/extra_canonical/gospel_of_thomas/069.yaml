base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/069.yaml
  text: Jesus said[1], “Blessed are those who have been persecuted in their heart; those are the ones who have truly known the Father. Blessed are those who have gone hungry[a][3][2], so that the belly of the one who desires will be filled.”
translation:
  language: zh_hans
  text: 耶稣说：“那些在他们心中受过迫害的人有福了[a]；这些人真正认识了父。饥饿的人有福了[b]，为要使那渴求之人的肚腹得饱足[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他们心中”中的“他们”可以指迫害者，也可以指受迫害者；原文容许两种理解。手稿此处采用复数表达，即“那些受迫害的人”。
    reason: 语法歧义与手稿数的一致性
  - marker: b
    text: 手稿作复数“饥饿的人”。这里的状态式表达其处于饥饿状态；也可译作“正在挨饿的人”。
    reason: 文本形式与词义选择
  - marker: c
    text: “肚腹”也可译作“胃”或“肚子”；原词是具体的身体用语。“得饱足”兼有被充满和得到满足的意思。
    reason: 词汇备选
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: 有福了
  rationale: 保留祝福语的庄重格式；比“快乐”或“幸运”更能表达原文的宣告语气。
- source_word: ⲇⲓⲱⲕⲉ
  choice: 受过迫害
  rationale: 该希腊语借词在这里具有敌意追逼、迫害的含义；被动表达反映原文代词结构所产生的被动意义。
- source_word: ϩⲣⲁⲓ ϩⲙ̄ⲡⲟⲩϩⲏⲧ
  choice: 在他们心中
  rationale: 贴近原文介词短语，并保留“他们”可能指迫害者，也可能指受迫害者的歧义。
- source_word: ⲥⲟⲟⲩⲛ ⲡⲉⲓⲱⲧ ϩⲛ̄ⲟⲩⲙⲉ
  choice: 真正认识了父
  rationale: “真正”自然表达 ϩⲛ̄ⲟⲩⲙⲉ 的副词意义，“认识了”体现已经发生的认识。
- source_word: ⲛⲉⲧϩⲕⲁⲉⲓⲧ
  choice: 挨过饿的人
  rationale: 既表达饥饿经历，也与手稿的复数关系形式相符；避免把原文限定为单数。
- source_word: ⲡϩⲏ
  choice: 肚腹
  rationale: 保留原文具体、质朴的身体意象，同时比口语“肚子”略显庄重。
- source_word: ⲥⲓⲟ
  choice: 得饱足
  rationale: 兼顾“充满”和“满足”的语义，并与“肚腹”构成自然搭配。
- source_word: ⲟⲩⲱϣ
  choice: 有所渴求
  rationale: 保留意愿、欲求的主动含义，却不擅自补出其所渴求的具体对象。
- source_word: ϩⲓⲛⲁ
  choice: 为要使
  rationale: 明确表达原文的目的或结果关系，同时不在两者之间作过度限定。
theological_decisions:
- issue: “父”的指称
  choice: 父
  alternative: 天父／上帝
  rationale: 原文只说“父”；不添加“天”或“上帝”，以免把隐含指称扩写成明说内容。
- issue: 迫害发生于“心中”的主体
  choice: 保留“他们”的指代歧义
  alternative: 在受迫害者心中／迫害者从心里迫害他们
  rationale: 科普特语允许代词关联到迫害者或受迫害者；译文不替原文消除这一神学和语义张力。
- issue: 末句“渴求者”与“挨饿者”的关系
  choice: 不明说二者是否同一群人
  alternative: 使他们自己的肚腹得饱足
  rationale: 原文从复数挨饿者转为单数“有所渴求的人”，关系并未明示，故保留其突兀与开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留《多马福音》本句较为突兀的意象和指代，不以解释性增译消除歧义；“肚腹”保留原文质朴的身体性，“有所渴求”则避免误指为单纯食欲。
