  source_fidelity: 首句的复数受事、被动意义及“在他们心中”的指代歧义均得到保留；“父”未被扩写。惟第二福语的手稿形式 ⲛⲉⲧϩⲕⲁⲉⲓⲧ 为复数关系形式加状态式，表达“饥饿的／正处于饥饿中的人”，而非明确的完成经历“挨过饿的人”。应按科普特语源文改正，尽管英语审校轨迹偏向完成式。末句保留从复数转为单数“渴求者”的未明关系，并保留具体的“肚腹”意象。
  naturalness: “饥饿的人有福了”是现代普通话中庄重、自然的福语表达。“那有所渴求之人的肚腹”略显书面但可理解；改为“那渴求之人的肚腹”更简洁，同时不补足其欲求对象。
  terminology: “有福了”“迫害”“父”及“肚腹”均与本句的庄重、具体语域相称。“得饱足”可传达 ⲥⲓⲟ 的饱满／满足之义。
