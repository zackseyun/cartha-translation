base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/107.yaml
  text: Jesus said[a], The kingship is like a shepherd who had a hundred sheep. One of them—the great one—went astray. He left the ninety‑nine and searched for the one until he found it. After he had toiled, he said to the sheep[i][h][g][f][e][d][c][b], I love you more than the ninety‑nine.
translation:
  language: zh_hans
  text: 耶稣说：“王权[a]好比一个牧人，他有一百只羊。其中一只走失了，正是那只大的[b]。他撇下九十九只[c]，去寻找那一只，直到找到了它。劳苦之后[d]，他对那只羊[e]说：‘我爱你，胜过那九十九只。’[f]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王权”所译的科普特语是一个抽象名词，也可译作“统治”或传统所说的“国度”；这里侧重掌权、为王的状态。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“那只大的”或“那只伟大的”；在羊群语境中也可理解为“最大的”，但原文未明确使用最高级形式。
    reason: lexical_alternative
  - marker: c
    text: “九十九”对应抄本中的特殊词形ⲡⲥⲧⲉⲯⲓⲧ，可能受到希腊语数词形式的影响。
    reason: dialect_note
  - marker: d
    text: 原文表示他劳苦、费力之后，也可能含有疲惫之意。
    reason: lexical_alternative
  - marker: e
    text: 抄本“羊”字中有一个经校订恢复的字母（NHAM02.50，第27行），但读法没有实质疑问。
    reason: lacuna_or_restoration
  - marker: f
    text: “爱”也可译作“偏爱”或“更中意”；原句本身带有比较意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: 王权
  rationale: 该词由抽象名词前缀与“王”构成，主要表示为王、统治或王权；“王权”既保留其抽象性，也避免把它单纯理解为空间性的国度。
- source_word: ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ
  choice: 一个牧人
  rationale: 此处是“牧养之人”的结构，意为牧人；后面的ⲟⲩⲛⲧⲁ=才表达“有”。
- source_word: ⲛϣⲉ
  choice: 羊
  rationale: 该词可泛指绵羊或山羊一类的小牲畜；本则牧羊语境中译作“羊”最自然。
- source_word: ⲥⲱⲣⲙ
  choice: 走失了
  rationale: 该动词可指迷失、走迷或犯错；在牧群语境中“走失”贴切且不额外加入道德解释。
- source_word: ⲡⲛⲟϭ
  choice: 那只最大的
  rationale: ⲛⲟϭ可表示大、伟大；用于羊时，“最大的”是自然读法，同时以脚注保留“那只大的／重要的”这一语义幅度。
- source_word: ⲕⲱ
  choice: 撇下
  rationale: 基本义是放下、留下；“撇下”符合现代叙事表达，又不采用语气过强的“抛弃”。
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ
  choice: 寻找
  rationale: 该结构表示寻找、追寻某对象。
- source_word: ϩⲓⲥⲉ
  choice: 辛苦一番
  rationale: 该词表示劳苦、费力或疲惫；此译自然传达找到羊之前付出的努力。
- source_word: ⲟⲩⲟϣⲕ
  choice: 爱你
  rationale: 该动词在此可理解为爱或偏爱；正文采用直接自然的“爱”，并在脚注说明另一可能。
theological_decisions:
- issue: ⲡⲙⲛⲧⲣⲣⲟ应表达统治本身还是空间性的国度
  choice: 王权
  alternative: 国度／统治
  rationale: 源词形态为抽象名词，正文保留“为王、掌权”的概念，不把它限定为领土或地点。
- issue: 迷失之羊为何受特别对待
  choice: 保留“最大的”以及“爱你胜过”的突兀张力
  alternative: 淡化为普通的一只羊，或把结尾解释为寻回后的喜乐
  rationale: 原文明确称其为ⲡⲛⲟϭ，并以比较句结束；不借平行传统替本文补充或改写神学含义。
- issue: ⲟⲩⲟϣⲕ表示爱还是偏爱
  choice: 正文译“爱”，脚注保留“偏爱／更中意”
  alternative: 正文译“我更中意你”
  rationale: 两种理解都有词义依据；采用较自然的直接话语，同时公开其比较和偏爱色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。以“牧人”准确表达ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ，以“他有”对应随后明确表示拥有的结构。正文保持简洁，并用脚注呈现“王权／国度”“最大／伟大”“爱／偏爱”等真实词义张力。
