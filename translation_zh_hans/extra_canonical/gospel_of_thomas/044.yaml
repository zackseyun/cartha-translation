base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/044.yaml
  text: Jesus said, "Whoever blasphemes against the Father will be forgiven, and whoever blasphemes against the Son will be forgiven. But whoever blasphemes against the Holy Spirit will not be forgiven, neither on earth nor in heaven."
translation:
  language: zh_hans
  text: 耶稣说：“亵渎父的，会蒙赦免；亵渎子的，也会蒙赦免；但亵渎圣灵的，无论在地上还是在天上，都不会蒙赦免。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句直译为“既不在地上，也不在天上”；这里说的是空间范围，不是“今世或来世”。原文的“会蒙赦免”采用“他们会赦免他”这一惯用的被动表达，并未明说赦免者。
    reason: 说明原文的空间对举及被动迂回结构，防止按平行传统改写或补出未明言的施事者。
lexical_decisions:
- source_word: ϫⲓⲟⲩⲁ（抄本作 ϫⲉⲟⲩⲁ）
  choice: 亵渎
  rationale: 这是科普特语中表示“亵渎、咒骂”的固定动词表达；译作“亵渎”准确保留其宗教与言语冒犯的强烈含义，避免弱化为一般的“说话反对”。
- source_word: ⲕⲱ ⲉⲃⲟⲗ
  choice: 蒙赦免
  rationale: 原文以第三人称复数主动式“他们会赦免他”迂回表达被动意义；汉语用“蒙赦免”自然、庄重，并保留施事者未明说的特点。
- source_word: ⲡⲕⲁϩ
  choice: 地上
  rationale: 该词意为“地、土地、大地”，在与“天上”成对的宇宙空间表达中译作“地上”最自然。
- source_word: ⲡⲡⲉ（抄本作 ⲧⲡⲉ）
  choice: 天上
  rationale: 意为“天”，与“地上”构成明确的空间对举。
- source_word: ⲡⲡⲛⲉⲩⲙⲁ ⲉⲧⲉⲣⲉⲟⲩⲟⲡ（抄本作 ⲡⲡⲛⲁ ⲉⲧⲟⲩⲁⲁⲃ）
  choice: 圣灵
  rationale: 直译为“神圣的灵”；“圣灵”是现代汉语中准确、简洁而通行的对应表达。
theological_decisions:
- issue: 结尾是空间范畴还是时间／末世范畴
  choice: 无论在地上还是在天上
  alternative: 无论今世还是来世
  rationale: 科普特原文明说“在地上……在天上”，形成空间对举；不以对观福音的时间表达取代它，也不借此进一步断定作者的神学体系。
- issue: 赦免的施事者是否明说
  choice: 用“蒙赦免”，不补出赦免者
  alternative: 神会赦免他／他们会赦免他
  rationale: 原文的第三人称复数是常见的被动迂回说法，施事者没有明说；汉译同样保持含蓄，避免加入原文未明言的主语。
- issue: 圣灵亵渎不可赦免的范围
  choice: 都不会蒙赦免
  alternative: 绝不会蒙赦免／永不得赦免
  rationale: 保留原文否定及“地上—天上”的全面范围，但不额外加入时间上的“永远”概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亵渎”保留原词力度；“蒙赦免”呈现原文被动含义。前两句适度保留平行结构，末句用“无论……还是……都……”自然传达科普特语“既不……也不……”的全面否定。
