revisions:
- from: 耶稣说：“诸天将卷起，大地也要在你们眼前卷起；那从活者而活的人，必不见死亡。”耶稣岂不是说过[a]：“找到自己的人[b]，世界配不上他”吗？
  to: 耶稣说：“诸天和大地都将在你们眼前卷起；那从活者而活着的人，必不见死亡。”耶稣岂不是说[a]：“找到自己的人[b]，世界配不上他”吗？
  rationale: 修订仅校正由原文句法和时态可安全确认的问题，并改善一处直译造成的汉语生硬感。保留“活者”的未定指向、后半段突兀转为第三人称的叙述声音，以及“自己／独自”的词汇余义；脚注标记均保留在相应锚点。
