base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/111.yaml
  text: Jesus said[a], "The heavens will roll up, and the earth, in your presence, and the one who lives from the living one will not see death." Does not Jesus say, "Whoever finds himself[b], the world is not worthy of him"?
translation:
  language: zh_hans
  text: 耶稣说：“诸天和大地都将在你们眼前卷起；那从活者而活着的人，必不见死亡。”耶稣岂不是说[a]：“找到自己的人[b]，世界配不上他”吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里突然改用第三人称，把耶稣作为外在权威来引用。这种元叙述式评语在《多马福音》中很特殊，可能是编纂者的评注或后来并入正文的修订痕迹。
    reason: textual_variant
  - marker: b
    text: 科普特语短语ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ在语法上可表达“找到自己”；其中ⲟⲩⲁⲁϥ也有“独自、单独”的含义，因此还可能让人联想到“发现自己独自一人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱⲗ
  choice: 卷起
  rationale: 该词可指折起、卷起；此处用于诸天和大地，带有末世性图景。“卷起”既贴近原义，也符合现代汉语表达。
- source_word: ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  choice: 在你们眼前
  rationale: 这一短语表示“在……面前／当着……的面”。译作“在你们眼前”自然地传达亲眼目睹之意。
- source_word: ⲡⲉⲧⲟⲛϩ ⲉⲃⲟⲗ ϩⲛ̄ ⲡⲉⲧⲟⲛϩ
  choice: 那从活者而活的人
  rationale: 尽量保留原文“活”一词的重复，以及生命源自“活者”的关系，不改译成解释性较强的“获得永生”。
- source_word: ⲟⲩⲭ ϩⲟⲧⲓ
  choice: 岂不是……吗
  rationale: 此处引出期待肯定回答的反问；汉语“岂不是……吗”准确保留其语气。
- source_word: ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ
  choice: 找到自己
  rationale: ⲟⲩⲁⲁϥ在句法上构成反身意义，故正文译作“自己”；它也可能带有“独自／单独”的回响，另在脚注说明。
- source_word: ⲙ̄ⲡϣⲁ
  choice: 配不上
  rationale: 原词表达“不配／不值得”。“世界配不上他”在现代汉语中自然，同时保持世界与此人的价值对比。
theological_decisions:
- issue: “活者”的身份
  choice: 保留为未加限定的“活者”
  alternative: 译作“永生的神”或“永活者”
  rationale: 原文没有明确说明所指是父、耶稣还是一般意义上的神圣生命源头；不添加“神”或“永”可保留这一真实歧义。
- issue: 叙述声音突然转为第三人称提及耶稣
  choice: 正文照原文保留，并加脚注提示
  alternative: 把后半句继续处理为耶稣第一人称的话
  rationale: 原文确实从“耶稣说”转为以耶稣为外在权威的反问；不应为求连贯而消除这一文本张力。
- issue: “找到自己”与“发现自己独自一人”
  choice: 正文采用句法上较直接的“找到自己”
  alternative: “发现自己独自一人”
  rationale: 反身读法最符合短语在句中的基本功能，但“独自”的语义共鸣仍值得保留在脚注中，避免把可能的《多马福音》主题直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诸天”“活者”保留原文较为凝练的宗教语域；“卷起”“在你们眼前”“配不上”则避免过度古雅。正文保留后半段突兀的第三人称转折，并确保脚注标记[a]、[b]均在正文对应位置出现。
