base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/064.yaml
  text: Jesus said[1], "A man had some guests. And when he had prepared the dinner, he sent his servant so that he might invite the guests. He went to the first. He said to him, 'My master invites you.' He said, 'I have some money with some merchants; they are coming to me in the evening. I will go to give them orders. I excuse myself from the dinner.' He went to another. He said to him[2], 'My master has invited you.' He said to him, 'I have bought a house, and they are asking for me for a day. I will not have time.' He came to another. He said to him, 'My master invites you.' He said to him, 'My friend is going to marry, and I am the one who will make the dinner. I will not go. I excuse myself from the dinner.' He went to another. He said to him, 'My master invites you.' He said to him, 'I have bought a village. I am going to collect rent. I will not go. I excuse myself.' The servant came. He said to his master, 'Those whom you invited to the dinner have excused themselves.' The master
    said to his servant, 'Go outside to the streets. Those whom you will find, bring them, so that they may dine[4][3]. Buyers and merchants will not enter the places of my father.'"
translation:
  language: zh_hans
  text: '耶稣说：“有一个人有一些宾客。晚宴预备好以后，他就打发仆人去请那些宾客。


    “仆人到第一个人那里，对他说：‘我主人请你赴宴。’那人说：‘我有些钱在几个商人那里；他们今晚要到我这里来。我要去给他们交代事情，请容我辞谢这场晚宴。’


    “仆人又到另一个人那里，对他说：‘我主人已经请你了。[a]’那人对他说：‘我买了一所房子，他们要我抽出一天来。我没有空。’


    “仆人又到另一个人那里，对他说：‘我主人请你赴宴。’那人对他说：‘我的朋友要成婚，我得操办宴席。我不能去；请容我辞谢这场晚宴。’


    “仆人又到另一个人那里，对他说：‘我主人请你赴宴。’那人对他说：‘我买了一个村庄，正要去收租。我不能去；请容我辞谢。’[b]


    “仆人回来，对主人说：‘你请来赴宴的人都辞谢了。’主人对仆人说：‘到外面的街道上去，把你遇见的人带来，让他们赴宴。买主和商人进不了我父的地方。[c]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一次原文用完成式，意思是“已经请你了”；其余几次用现在式“请你”。
    reason: 保留原文细微的时态变化。
  - marker: b
    text: 这里及前一处的“不能去”，原文所用形式是“去”这一动词的方言或异体形式；不宜理解成单独的“不能”。
    reason: 说明容易混淆的科普特语词形。
  - marker: c
    text: 抄本此处有缺损；“进不了”依据残存字迹、篇幅及通行复原译出。
    reason: 标明结语所依据的文本复原。
lexical_decisions:
- source_word: ϣⲙⲙⲟ
  choice: 客人
  rationale: 本义可指陌生人或外来者；在设宴并发出邀请的语境中，译为“客人”最自然，同时不与后文的“仆人”混淆。
- source_word: ϩⲙϩⲁⲗ
  choice: 仆人
  rationale: 可指奴仆或仆役；叙事重点在其受主人差遣的身份，“仆人”既准确又符合现代中文叙事语体。
- source_word: ϩⲟⲙⲧ
  choice: 钱
  rationale: 字面可指铜，延伸指铜钱或钱财；此处与商人及经济事务并列，译作“钱”保留具体经济细节。
- source_word: ⲟⲩⲉϩⲥⲁϩⲛⲉ
  choice: 交代事情
  rationale: 该动词有吩咐、下令之义；在商人来访的语境中，“给他们交代事情”自然地保留其指令性。
- source_word: ⲥⲣϥⲉ
  choice: 有空
  rationale: 表示有闲暇或有时间；否定形式自然译为“没有空”。
- source_word: ⲣϣⲉⲗⲉⲉⲧ
  choice: 成婚
  rationale: 表示娶亲、结婚；主语是说话者的朋友，用中性的“成婚”避免擅自补定性别。
- source_word: ϫⲓ ⲛϣⲱⲙ
  choice: 收租
  rationale: 这是表示收取租金的惯用表达；“收租”简洁准确。
- source_word: ⲣⲉϥⲧⲟⲟⲩ
  choice: 买主
  rationale: 由“购买”构成的施事名词，意为购买者；译作“买主”可与随后的“商人”保持区别。
- source_word: ϣⲟⲧⲉ
  choice: 商人
  rationale: 指商人或贸易者；用现代通行的“商人”。
- source_word: ⲧⲟⲡⲟⲥ
  choice: 地方
  rationale: 希腊语借词，意为地方、处所；复数形式在中文中可由语境涵盖，不把它神学化为“天国”或“居所”。
theological_decisions:
- issue: 结语对买主和商人的排除
  choice: “买主和商人进不了我父的地方”
  alternative: 将其意译为世俗贪财者不能进入天国
  rationale: 原文直接点出两类从事买卖的人，并说他们不能进入“我父的地方”。译文保留这一尖锐而有张力的表述，不将其弱化为泛指贪婪，也不把“地方”直接解释为天国。
- issue: 与正典宴席比喻的差异
  choice: 按《多马福音》现存科普特文本独立翻译
  alternative: 依据《路加福音》14章或《马太福音》22章调整细节
  rationale: 本段的借口及结语具有自身措辞，不应为与正典平行段落一致而改写或补充。
translation_notes:
  register: 采用现代、庄重而清楚的叙事中文。对话保持口语可读性，但避免过度生活化；重复的邀请与辞谢句式尽量保留原文的节奏。未把“我父的地方”解释性改写为特定神学术语。
