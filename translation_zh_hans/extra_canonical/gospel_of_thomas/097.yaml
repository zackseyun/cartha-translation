base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/097.yaml
  text: Jesus said, "The kingdom of the Father is like a woman carrying a jar full of meal. While she was walking on the road, still far away, the handle of the jar broke. The meal emptied out behind her on the road. She did not know it; she had not noticed the trouble. When she reached her house, she set the jar down and found it empty."
translation:
  language: zh_hans
  text: 耶稣说：“父的国度好比一个女人，带着一只装满面粉的坛子走在路上。她还在远处时，坛子的提耳[a]断了，面粉便沿路漏在她身后。她并不知道，也没有察觉出了岔子[b]。她到了家，把坛子放下来，发现坛子空了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“耳朵”，这里指坛子耳状的把手。
    reason: 说明器皿用语所保留的字面意象。
  - marker: b
    text: 或译“麻烦”“困境”；原词也可指“劳苦”。
    reason: 保留 ϩⲓⲥⲉ 的语义幅度。
lexical_decisions:
- source_word: ϭⲗⲙⲉⲉⲓ
  choice: 坛子
  rationale: 指可盛装面粉的陶制容器；“坛子”在现代汉语中自然，并能与其提耳相配。
- source_word: ⲛⲟⲉⲓⲧ
  choice: 面粉
  rationale: 该词可指面粉或磨成的谷粉；此处坛中所装、能够沿路漏出的粉状物译作“面粉”清楚自然。
- source_word: ⲙⲁⲁϫⲉ
  choice: 提耳
  rationale: 字面义为“耳朵”，用于器皿时指耳状把手；“提耳”兼顾器物结构和原文形象。
- source_word: ⲟⲩⲱϭⲡ
  choice: 断了
  rationale: 准确表达器皿提耳折断的事件，简洁自然。
- source_word: ϣⲟⲩⲟ
  choice: 漏
  rationale: 该词有倒空、流出之义；因女人未察觉且面粉落在身后，汉语用“漏”最贴合叙事情境。
- source_word: ϩⲓⲥⲉ
  choice: 出了岔子
  rationale: 原词涵盖劳苦、麻烦、困境；在此具体指坛耳断裂所造成的意外状况，“出了岔子”保留其宽泛性且符合现代叙事语言。
theological_decisions:
- issue: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ 的翻译
  choice: 父的国
  alternative: 神的国／天国
  rationale: 原文明确说“父的国”，故不按其他福音书惯用语加以协调，保留《多马福音》此处特有的表达。
- issue: 比喻意义是否在正文中解释
  choice: 只翻译比喻叙事，不补充寓意
  alternative: 将面粉流失解释为国度、生命或属灵资源的隐秘消逝
  rationale: 原文没有明说比喻各元素的对应意义；不在译文中替读者解决其开放性和张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“父的国”保留原文措辞；“背着”对应负载而行，“她还在远处时”保留 ⲟⲩⲉ 的距离信息而不擅自补出离何处尚远。主文中的脚注标记与脚注完全对应。
