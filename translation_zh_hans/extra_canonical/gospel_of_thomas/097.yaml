revisions:
- from: 耶稣说：“父的国好比一个女人，背着一只装满面粉的坛子走在路上。她还在远处时，坛子的提耳[a]断了，面粉便沿路漏在她身后。她并不知道，也没有察觉出了岔子[b]。她到了家，把坛子放下来，才发现里面空了。”
  to: 耶稣说：“父的国度好比一个女人，带着一只装满面粉的坛子走在路上。她还在远处时，坛子的提耳[a]断了，面粉便沿路漏在她身后。她并不知道，也没有察觉出了岔子[b]。她到了家，把坛子放下来，发现坛子空了。”
  rationale: 仅作安全且必要的微调：以“带着”避免原文未明示的背负方式，并将“父的国”调整为现代汉语更自然的“父的国度”。脚注标记均保留在所注词语之后，脚注集完整对应正文。
