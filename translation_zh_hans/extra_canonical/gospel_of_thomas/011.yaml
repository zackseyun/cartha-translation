  rationale: 修正了第三句的主语和现代汉语句法，并将“一”句恢复为明确的时间从句。其余修改仅为自然性和脚注措辞的审慎化；未解释“光”“一”“二”或“活／死”的象征含义，也未改变原文的开放性。
