base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/011.yaml
  text: Jesus said[1], “This heaven will pass away, and the one above it will pass away. And the dead are not alive, and the living will not die. On the days when you ate what is dead, you made it alive. When you come to be in the light, what will you do? On the day when you were one, you became two. But when you become two[5][4][3][2], what will you do?”
translation:
  language: zh_hans
  text: 耶稣说：“这重天将要消逝，它上面的那重天也将要消逝。[a]死去的人并不活着，活着的人也不会死。当你们吃死物的时候，你们使它活了。[b]当你们进入光中时，你们要做什么呢？[c]在你们为一的那一天，你们成了二。[d]但是，当你们成为二时，你们要做什么呢？”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这重天”也可译作“这片天空”。下文提到“它上面的”一重天，似乎反映层叠的宇宙观。
    reason: lexical_alternative
  - marker: b
    text: “使它活了”：原文中的“它”很可能指先前所吃的“死物”；句式具有“使之成为活着的”的使动意义。
    reason: lexical_alternative
  - marker: c
    text: “你们要做什么呢”：原文另有一个阳性单数宾语代词，也可理解为“你们要怎样处置它呢”；它可能只是语法上的赘词，也可能回指“光”或前文提到的活着者。
    reason: lexical_alternative
  - marker: d
    text: “在你们为一的那一天，你们成了二”：原文“为一”也可理解为“成为一”或“使自己成为一”。有人把整句理解为将来的事，但随后“成了二”采用过去叙述形式，较支持此处的过去理解。
    reason: alternative_reading
  - marker: e
    text: 末句的“做”在抄本中写作不同于前一问题所用动词的形式，可有“取”或“对它做”的意味；本译文依上下文将其理解为与前一问题相应的提问。
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲓⲡⲉ
  choice: 这重天
  rationale: ⲡⲉ可指“天空”或“天”；下文说“它上面的”一重，呈现层叠宇宙观。“这重天”既保留“天”的宗教—宇宙含义，也自然表达层次。
- source_word: ⲛⲁⲣⲡⲁⲣⲁⲅⲉ
  choice: 将要消逝
  rationale: 该希腊语借词在此带将来意义，可指经过或过去；“消逝”符合庄重的末世语境，又不具体解释其方式。
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ / ⲛⲉⲧⲟⲛϩ
  choice: 死者／活着的人
  rationale: 保留两者的平行与张力；前者用类称“死者”，后者用自然汉语“活着的人”，避免把“活”预先解释为属灵生命。
- source_word: ⲟⲩⲱⲙ ⲙ̄ⲡⲉⲧⲙⲟⲟⲩⲧ
  choice: 吃那死物
  rationale: 直译进食动作，并以“死物”保留所吃之物的泛指性质，不限定为肉类或祭物。
- source_word: ⲉⲓⲣⲉ ⲙ̄ⲙⲟϥ ⲙ̄ⲡⲉⲧⲟⲛϩ
  choice: 使它活了
  rationale: ⲉⲓⲣⲉ ⲛ-加谓语构成使动；“使它活了”简洁保留由死到活的悖论表达。
- source_word: ϣⲱⲡⲉ ϩⲙ̄ⲡⲟⲩⲟⲉⲓⲛ
  choice: 进入光中
  rationale: 原文较直为“成为／处在光中”；现代汉语“进入光中”表达趋入状态，同时不解释“光”的象征所指。
- source_word: ⲟⲩ ⲡⲉⲧⲉⲧⲛⲁⲁϥ
  choice: 你们要做什么呢
  rationale: 原句含阳性单数宾语代词，可能为赘词，也可能回指“光”或先前对象；正文不明定宾语，以脚注说明。
- source_word: ⲉⲧⲉⲧⲛ̄ⲟ ⲛ̄ⲟⲩⲁ
  choice: 你们原为一
  rationale: ⲉⲓⲣⲉ/ⲟ ⲛ-与数词可表示“为一”或“成为一”；结合随后过去时“成了二”，译作过去状态而保留格言的时间张力。
- source_word: ⲉⲧⲉⲧⲛ̄ϣⲁϣⲱⲡⲉ ⲛ̄ⲥⲛⲁⲩ
  choice: 当你们成为二时
  rationale: 条件—将来结构表达未来或预期状态；“成为二”保留原文数字象征的开放性。
theological_decisions:
- issue: “光”的含义
  choice: 保留为未加解释的“光”
  alternative: 译作“真光”“神圣之光”或明确指向救恩状态
  rationale: 原文没有限定语；加上神学定性会消除本语录有意保留的象征开放性。
- issue: “一”与“二”的含义
  choice: 直译数字，不说明为身体与灵魂、男女或统一与分裂
  alternative: 按某一人类学、性别观或宇宙论解释
  rationale: 文本本身未说明所指；应保留其谜语性质和神学张力。
- issue: “活着的人不会死”所指的生命
  choice: 不区分肉身生命与属灵生命
  alternative: 明确译为“有永生的人不会死”
  rationale: 原文仅使用“活”与“死”，若补入“永生”会把可能的象征意义固定为特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留语录的短促、悖论和谜语色彩。以“这重天／那重天”自然呈现层叠关系；不为“光”“一”“二”“活”“死”添加宗派性解释。所有脚注标记均置于相应正文之后。
