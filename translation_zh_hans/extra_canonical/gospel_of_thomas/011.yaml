  revised_text: 耶稣说：“这重天将要消逝，它上面的那重天也将要消逝。[a]死去的人并不活着，活着的人也不会死。当你们吃死物的时候，你们使它活了。[b]当你们进入光中时，你们要做什么呢？[c]在你们为一的那一天，你们成了二。[d]但是，当你们成为二时，你们要做什么呢？”[e]
