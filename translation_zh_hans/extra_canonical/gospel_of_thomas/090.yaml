base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/090.yaml
  text: Jesus said[a], “Come to me; for my yoke is good, and my lordship is gentle[c][b]; and you will find rest for yourselves.”
translation:
  language: zh_hans
  text: 耶稣说：“到我这里来，因为我的轭是好的[a]，我的权柄是温和的[b]；你们必为自己找到安息[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好的”所译的词是 ⲭⲣⲏⲥⲧⲟⲥ，借自希腊语 χρηστός，意为“好、宜人、和善”；并非意为“基督”的 ⲭⲣⲓⲥⲧⲟⲥ。
    reason: lexical_alternative
  - marker: b
    text: 参《马太福音》11:28–30；但本句的表述不同：这里说“我的权柄是温和的”，并说“为自己”找到安息，而不是“为你们的灵魂”。
    reason: cross_reference
  - marker: c
    text: “安息”译自希腊语借词 ⲁⲛⲁⲡⲁⲩⲥⲓⲥ（ἀνάπαυσις）。抄本中该词的拼写处有删改和补写，但读法可靠。
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲉⲓⲛⲧⲱⲧⲛ ϣⲁⲁⲛⲟⲕ
  choice: 到我这里来
  rationale: 以自然的现代汉语表达复数命令式和趋向目标；复数由后文“你们”显明。
- source_word: ⲟⲩⲭⲣⲏⲥⲧⲟⲥ
  choice: 好的
  rationale: 该词借自希腊语 χρηστός，核心义为“好、宜人、和善”；译作“好的”保留宽泛语义，也避免误认作“基督”。
- source_word: ⲛⲁϩⲃ
  choice: 轭
  rationale: 保留农业器具及其比喻性负担、约束含义。
- source_word: ⲙⲛⲧϫⲟⲉⲓⲥ
  choice: 主权
  rationale: 这是由“主、主人”构成的抽象名词；“主权”保留其支配或作主的含义，不将其弱化为一般的教导。
- source_word: ⲟⲩⲣⲙⲣⲁϣ
  choice: 温和的
  rationale: 表达柔和、温良的性质，用来修饰“主权”在现代汉语中自然且庄重。
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ
  choice: 你们必……找到
  rationale: 明确表达第二人称复数及将来意义。
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: 安息
  rationale: 对应希腊语借词 ἀνάπαυσις，表示休息、歇息；“安息”符合庄重语体。
- source_word: ⲛⲁⲛⲧⲱⲧⲛ
  choice: 为自己
  rationale: 保留受益与反身意味，且不改写为“灵魂得安息”。
theological_decisions:
- issue: ⲙⲛⲧϫⲟⲉⲓⲥ 所指的支配关系
  choice: 我的主权
  alternative: 我的管辖／我的统治
  rationale: 原文使用抽象名词，既可指作主的身份，也可指管辖；“主权”保留这种张力，不把它具体化为政治统治。
- issue: 与《马太福音》11:28–30的关系
  choice: 按《多马福音》现存科普特文本独立翻译
  alternative: 采用《马太福音》的惯用措辞，如“我的担子是轻省的”或“心里得享安息”
  rationale: 本句虽与《马太福音》相近，却明确说“我的主权是温和的”和“为自己”，应保留其不同表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“轭”“主权”“安息”保留原文的核心意象和抽象性；分号体现两个理由与结果之间的句法层次。
