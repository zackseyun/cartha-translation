base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/100.yaml
  text: They showed Jesus a gold coin,[1] and they said to him[1], "Those who belong to Caesar demand the tax from us."[2] He said to them, "Give the things of Caesar to Caesar; give the things of God to God[a][3][2]; and what is mine—give it to me."[3]
translation:
  language: zh_hans
  text: 他们给耶稣看了一枚金币[a]，对他说：“属凯撒的人向我们索要税款[b]。”他对他们说：“把属于凯撒的东西给凯撒，把属于上帝的东西给上帝；还有，那属于我的，给我。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一块金子”；在这里的纳税语境中，指一枚金币，但没有说明具体币种。
    reason: lexical_alternative
  - marker: b
    text: “属凯撒的人”也可理解为“为凯撒办事的人”；“索要”所译的动词本义是“寻求、要求”，在这里指要求缴税。
    reason: lexical_alternative
  - marker: c
    text: “还有，那属于我的，给我”是《多马福音》在凯撒与上帝两项之后增添的第三项命令；对观福音的相应记载没有这一句。
    reason: cross_reference
lexical_decisions:
- source_word: ⲧⲥⲉⲃⲉⲓⲥ
  choice: 拿……给……看
  rationale: 此动词意为“显示、给人看”；结合递上一枚金币的场景，用现代汉语“拿……给……看”自然准确。
- source_word: ⲟⲩⲛⲟⲩⲃ
  choice: 一枚金币
  rationale: ⲛⲟⲩⲃ 本义为“金子”，在纳税语境中借指金制钱币；“金币”既明确所指，又不擅自指定币种。
- source_word: ⲛⲉⲧⲏⲡ ⲁⲕⲁⲓⲥⲁⲣ
  choice: 属凯撒的人
  rationale: 保留原文“归属/隶属凯撒者”的表达，不把身份过度限定为税吏、官员或士兵。
- source_word: ⲥⲉϣⲓⲧⲉ
  choice: 索要
  rationale: 基本义为“寻求、索取、要求”；在征税语境中“索要”体现要求缴纳之意，同时不过度强化为暴力强征。
- source_word: ⲡϣⲱⲙ
  choice: 税款
  rationale: 此处指税或贡税；“税款”是清楚、自然的现代汉语。
- source_word: ⲛⲁⲕⲁⲓⲥⲁⲣ / ⲛⲁⲡⲛⲟⲩⲧⲉ
  choice: 属于凯撒的东西／属于上帝的东西
  rationale: 原文采用复数所属形式，直指“凯撒的那些东西”和“上帝的那些东西”；译作“……的东西”保留其与末句单数“属于我的”之间的语法对照。
- source_word: ⲡⲉⲧⲉⲡⲱⲉⲓ ⲡⲉ
  choice: 属于我的
  rationale: 忠实保留关系结构“那属于我的（东西）”，也保留《多马福音》此处突出的第三项要求。
theological_decisions:
- issue: 凯撒、上帝与耶稣三项所属关系的解释
  choice: 按原文并列呈现，不说明“属于我的”具体指什么
  alternative: 将“属于我的”解释为门徒、人、灵魂或信仰忠诚
  rationale: 原文没有明说耶稣所主张的对象；保留开放性可避免把某种神学解释写入正文。
- issue: “属凯撒的人”的身份
  choice: 保留宽泛的所属表达
  alternative: 译作“凯撒的税吏”或“凯撒的官员”
  rationale: 原文只表达这些人与凯撒的归属关系，并未明确其职务；不应凭征税场景擅自限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“凯撒”保留历史称号，“上帝”采用现代标准普通话常用称谓。命令句保持简洁、平衡；用“东西”承载原文复数所属形式，并以“至于”自然引出末句的单数转折，而不消解其神学张力。
