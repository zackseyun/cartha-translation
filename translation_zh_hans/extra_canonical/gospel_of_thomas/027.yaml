base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/027.yaml
  text: If you do not fast the world[a], you will not find the kingdom; and if you do not make the Sabbath a Sabbath[e][d][c][b], you will not see the Father.
translation:
  language: zh_hans
  text: 如果你们不禁食世界[a]，就找不到那国；如果你们不使安息日成为安息日[b]，就看不见父。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禁食世界”是原文不寻常的说法：这里“世界”是“禁食”的宾语。也可按其含意理解为禁绝或戒除世界，但正文保留原文的突兀表达。
    reason: lexical_alternative
  - marker: b
    text: “使安息日成为安息日”直译原文的重复结构，可能意为使安息日真正成为安息日，也就是按其本义遵守它。希腊文纸草本 POxy 1 在前一句作“神的国”，而科普特文本只作“那国”。
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ / ⲉⲣⲉ-…ⲧⲙ-
  choice: 如果……不……
  rationale: 条件式引出未来或一般性的条件；“如果”符合本则格言的结构，两句均以否定条件表达。
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ ⲉⲡⲕⲟⲥⲙⲟⲥ
  choice: 禁食世界
  rationale: ⲣⲛⲏⲥⲧⲉⲩⲉ 是“禁食”；此处 ⲉ- 标示受词，与希腊见证的直接宾语相合。用不寻常的及物结构“禁食世界”，保留原文刻意压缩且突兀的表达，不解释成“向世界禁食”或“对世界禁食”。
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: 世界
  rationale: 这是希腊借词 κόσμος，在本句中通常指“世界”；“世界”比“宇宙”更自然，也不缩窄其含义。
- source_word: ⲁϩⲉ
  choice: 找到
  rationale: 直译其“找到、发现”的基本义，措辞简洁。
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: 那国
  rationale: 原文只有定冠词和“国度／王权”，没有“神的”。“那国”既保留定指意味，也避免擅自补入所属者；“国”较适合简洁格言体。
- source_word: ⲉⲓⲣⲉ ⲛⲡⲥⲁⲃⲃⲁⲧⲟⲛ ⲛⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: 使安息日成为安息日
  rationale: 保留“使X成为X”的述语宾语结构和原文重复，不直接释为“守安息日”，以免消除其压缩表达及可能的言外之意。
- source_word: ⲛⲁⲩ
  choice: 看见
  rationale: 采用普通而直接的“看见”，保留与“父”相连时可能具有的认识或启示意味，而不在正文中加以解释。
- source_word: ⲡⲉⲓⲱⲧ
  choice: 父
  rationale: 原文为带定冠词的“父”，在此具有称号性质；汉语圣典语体中“父”自然且不需另加“那位”或“天”。
theological_decisions:
- issue: “国”的所属
  choice: 不补“神的”
  alternative: 神的国
  rationale: 科普特文本仅作“那国／国度”；虽然希腊 POxy 1 见证作“神的国”，正文按指定的科普特底本翻译，并以脚注说明异文。
- issue: “使安息日成为安息日”的意义
  choice: 保留字面重复
  alternative: 真正守安息日
  rationale: 原文的述语结构可能意味着使安息日名副其实或按其本义遵守，但直译能保存其神学张力，不把一句高度凝缩的话固定为单一礼仪解释。
- issue: “禁食世界”的理解
  choice: 保留反常的及物说法
  alternative: 禁绝世界／向世界禁食／脱离世界而禁食
  rationale: 科普特语及希腊重叠见证都以“世界”为宾语；不把它顺畅化为某种明确的禁欲主义解释。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。两组条件句保持平行；“禁食世界”和“使安息日成为安息日”有意保留原文不寻常、凝缩的措辞。脚注标记均已置于正文。
