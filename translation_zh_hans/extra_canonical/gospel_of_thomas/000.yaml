    reason: lexical_alternative
  - marker: b
    text: “狄狄摩斯”来自希腊语，意为“双生子”；“多马”这一名字也与“双生子”有关。手稿所列的完整称名是“狄狄摩斯·犹大·多马”。
    reason: cultural_note
  revision_rationale: 修订删除“永”以保留“活着的”在原文中的描述性及可能的称号性，而不作额外神学断定；将Didymos改作通行音译“狄狄摩斯”；并将末句改为带复数宾语的主动句，以贴合原文“他写下它们”的表达。脚注标记仍准确锚定于“隐秘”和完整称名。
