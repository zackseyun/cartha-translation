base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/000.yaml
  text: These are the hidden sayings which the living Jesus spoke[4][3][2][1], and Didymos Judas Thomas wrote them.
translation:
  language: zh_hans
  text: 以下是活着的耶稣所说的隐秘言语[a]，狄狄摩斯·犹大·多马把它们写下了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐秘”也可译作“隐藏的”或“秘密的”。这里保留其遮蔽、未显露的含义，不进一步断定这些言语属于某种秘传体系。
    reason: lexical_alternative
  - marker: b
    text: “狄狄摩斯”来自希腊语，意为“双生子”；“多马”这一名字也与“双生子”有关。手稿所列的完整称名是“狄狄摩斯·犹大·多马”。
    reason: cultural_note
lexical_decisions:
- source_word: ⲛⲁⲉⲓ ⲛⲉ ⲛ̄ϣⲁϫⲉ
  choice: 以下是……言语
  rationale: 手稿原文使用复数指示词和复数名词，指向随后收录的一系列话语；“以下是”符合现代汉语篇首体例，“言语”比“教导”少一层解释，也能保留作品箴言集的性质。
- source_word: ϩⲏⲡ
  choice: 隐秘
  rationale: 该词兼有“隐藏、秘密”之义；“隐秘”既保留未显露的意味，又不预设只有入门者才能领受的秘传体系。
- source_word: ⲓ︤ⲥ︥ ⲉⲧⲟⲛϩ / ⲁⲓⲏⲥⲟⲩⲥ ⲉⲧⲉⲣⲉⲱⲛϩ
  choice: 永活的耶稣
  rationale: 原结构是“活着的耶稣”。汉语“永活的耶稣”简洁、庄重，并保留其近似称号的语感；“永”在汉语中表达持续活着的状态，但不展开其具体神学含义。
- source_word: ϫⲟⲟⲩ / ϫⲱⲛⲧⲟⲟⲩ
  choice: 所说的
  rationale: 动词带复数宾语，直指这些言语；汉语关系结构中“所说的”自然地表达这一关系，无须重复“这些话”。
- source_word: ⲥϩⲁⲓ
  choice: 写下
  rationale: 保留实际书写动作；“写下”比“记载”更贴近原文普通的书写动词，也不额外断定其编纂方式。
- source_word: ⲛϭⲓ
  choice: 由
  rationale: 该粒子在后置名词前标明施事者；汉语被动式中的“由”清楚表明写下这些言语的人。
- source_word: ⲇⲓⲇⲩⲙⲟⲥ ⲓⲟⲩⲇⲁⲥ ⲑⲱⲙⲁⲥ
  choice: 低土马·犹大·多马
  rationale: 按手稿保留完整称名，并采用便于现代汉语读者辨认的音译；不在正文中把“低土马”直接意译为“双生子”，以免抹去原文的命名形式。
theological_decisions:
- issue: “活着的耶稣”是否作为神学称号处理
  choice: 永活的耶稣
  alternative: 活着的耶稣
  rationale: 原文可作一般描述，也可能带称号色彩；译文采用自然而庄重的表达，却不说明其具体指复活、永生或其他教义，从而保留语义张力。
- issue: ϩⲏⲡ 是否暗示秘传教义
  choice: 隐秘言语
  alternative: 秘密教导
  rationale: “隐秘”保留隐藏或不显露之意；避免“秘密教导”，因为“教导”及其搭配可能把文本预先框定为特定秘传体系。
translation_notes:
  register: 采用现代、庄重而易懂的篇首语体。保留原文的复数“言语”、隐秘性措辞及完整称名；不把称名简化为“使徒多马”，也不补入手稿未有的身份说明。
