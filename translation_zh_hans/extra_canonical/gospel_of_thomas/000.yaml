revisions:
- from: 以下是永活的耶稣所说的隐秘言语[a]，由低土马·犹大·多马写下[b]。
  to: 以下是活着的耶稣所说的隐秘言语[a]，狄狄摩斯·犹大·多马把它们写下了[b]。
  rationale: 修订删除“永”以保留“活着的”在原文中的描述性及可能的称号性，而不作额外神学断定；将Didymos改作通行音译“狄狄摩斯”；并将末句改为带复数宾语的主动句，以贴合原文“他写下它们”的表达。脚注标记仍准确锚定于“隐秘”和完整称名。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:42Z'
review_pass:
  verdict: revise
  source_fidelity: “永活的”在现代汉语中通常带有“永远活着”的神学断言，超过科普特语ⲉⲧⲟⲛϩ／ⲉⲧⲉⲣⲉⲱⲛϩ（“活着的／在世的”）本身所表达的范围。应改为“活着的”。原文末句为主动句，宜明确保留“狄狄摩斯·犹大·多马”作为“写下”的施事，并译出复数宾语“它们”。“低土马”不是通行、可辨认的现代汉语音译；“狄狄摩斯”更贴合希腊语Didymos及中文学术惯例。
  naturalness: 修订后的篇首句保持简洁庄重。“以下是……所说的……”自然引出随后的言语集；“把它们写下了”明确且符合汉语主动句表达。
  terminology: “隐秘言语”可保留，以对应ϩⲏⲡ和ϣⲁϫⲉ，同时不将其解释为秘传教义。人名采用“狄狄摩斯·犹大·多马”，保留手稿的完整称名；不把Didymos或Thomas直接译作“双生子”。
  issues:
  - severity: medium
    issue: “永活的耶稣”增添原文未明说的永久性含义。
    rationale: ⲉⲧⲟⲛϩ意为“活着的／生活的”；虽可能具有称号色彩，但“永活”将其限定为永恒存活，属于不必要的神学强化。
  - severity: medium
    issue: “低土马”不宜作为Didymos的中文译名。
    rationale: 该形式不合通行的希腊人名汉译，且难以使中文读者辨识原名。应使用“狄狄摩斯”。
  - severity: low
    issue: 正文的“由……写下”弱化了原文的主动句及复数宾语。
    rationale: 原文直接说Didymos Judas Thomas“写了它们”。改为主动表达并补出“它们”，可更完整反映句法关系。
  revised_text: 以下是活着的耶稣所说的隐秘言语[a]，狄狄摩斯·犹大·多马把它们写下了[b]。
