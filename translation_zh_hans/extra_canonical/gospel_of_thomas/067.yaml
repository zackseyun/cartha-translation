base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/067.yaml
  text: Jesus said[1], "The one who knows the All, yet lacks himself[a][x][t][3][2], is lacking in every respect."
translation:
  language: zh_hans
  text: 耶稣说：“认识万有[a]、自己却有所欠缺[b]的人，在各方面都有欠缺[c][d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万有”也可译作“一切”或“整体”。原词 ⲡⲧⲏⲣϥ 在本书中可能带有宇宙整体的意味。
    reason: lexical_alternative
  - marker: b
    text: “自己却有所欠缺”也可理解为“缺少自己”，或较贴近字面地译作“独自处于缺乏中”。原文“独自”与代词的组合支持反身理解，但句法仍有一定含混性。
    reason: lexical_alternative
  - marker: c
    text: “在各方面都有欠缺”所译的短语按字面涉及“所有地方”，在此表示全面的欠缺；也可译作“完全有所欠缺”或“全然欠缺”。
    reason: dialect_note
  - marker: d
    text: 现存手稿在第二个“有欠缺”前漏写了主语代词；校订本补出该代词，句子的基本含义不受影响。
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ（见 ⲡⲉⲧⲥⲟⲟⲩⲛ）
  choice: 认识
  rationale: 这是关系现在时，表达“认识的人”，适合格言式陈述；不译作“已经认识”，以免误加完成体含义。
- source_word: ⲡⲧⲏⲣϥ
  choice: 万有
  rationale: 该词可指“整体、所有的一切”；“万有”既简洁，又保留在《多马福音》中可能具有的宇宙性范围，不将其缩窄为某一类知识。
- source_word: ⲣϭⲣⲱϩ
  choice: 缺失
  rationale: 原词表示处于缺乏、不足的状态。“缺失”能在两个分句中重复使用，保留原文围绕欠缺与整体所形成的反差。
- source_word: ⲟⲩⲁⲁϥ / ⲟⲩⲁⲁ + ⲛⲧⲟϥ
  choice: 自身
  rationale: “独自”与代词结合可产生反身意味。“缺失自身”保留原句刻意形成的悖论，同时不排除“自身有所欠缺”这一理解。
- source_word: ⲙ̄ⲡⲙⲁ ⲧⲏⲣϥ
  choice: 处处都有缺失
  rationale: 该短语按字面涉及“所有地方”，在这里起总体化的副词作用。“处处都有缺失”自然地表达全面、无一例外的欠缺，并略微保留“地方”的意象。
theological_decisions:
- issue: “万有”的范围
  choice: 保留可能涵盖宇宙整体的“万有”
  alternative: 一切；整体
  rationale: 上下文没有明确限定其范围，因此不把它解释成单纯的世俗知识或特定的神学实体。
- issue: “缺失自身”的含义
  choice: 保留反身性的悖论表达
  alternative: 自身有所欠缺；独自处于缺乏中
  rationale: 原文容许不止一种句法理解；直译式表达可保留“认识整体却失去/欠缺自己”与“自己仍有欠缺”之间的张力，而不替读者作单一裁决。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。以“认识……的人”对应科普特语关系现在时；两个分句都用“缺失”，保留原文的词语复现与悖论张力。“万有”略带陌生感，但适合此处可能的整体性或宇宙性含义。
