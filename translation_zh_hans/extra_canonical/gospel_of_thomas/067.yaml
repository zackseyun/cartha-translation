  naturalness: 修订后的句子采用自然、庄重的现代汉语格言体。“在各方面都有欠缺”比“处处都有缺失”更符合此处副词性总体表达；“自己却有所欠缺”也避免了“缺失自身”的歧义和生硬搭配。
