base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/040.yaml
  text: Jesus said[a], "A grapevine was planted outside the Father, and since it is not established[e][d][c][b], it will be uprooted from its root and will perish."
translation:
  language: zh_hans
  text: 耶稣说：“一株葡萄藤被栽种在父之外[a]；它既未稳固[b]，人会把它从根部[d]拔除[c]，它也将灭亡。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在父的外面／父之外”；这里是“父”，不是“我的父”。
    reason: 保留原文的空间性表达，并防止与《马太福音》15:13的措辞相互替换。
  - marker: b
    text: 也可译作“没有坚立”“不坚固”或“没有立稳”；原动词本身没有明说“扎根”。
    reason: 说明词义范围，同时避免在正文中添加原文未明确表达的根部意象。
  - marker: c
    text: 原文用第三人称复数作不定施事，字面近于“他们会拔除它”；这里译为“人会把它……拔除”，不指定拔除者是谁。
    reason: 交代从科普特语不定复数到现代汉语不定施事表达的转换，并避免补出施事身份。
  - marker: d
    text: 原文介词短语可译为“从它的根部”，也可能带有“由／凭借它的根部”的意味；正文采用较自然的“从根部”。
    reason: 保留介词所容许的来源、分离或凭借意味。
lexical_decisions:
- source_word: ⲟⲩⲃⲁⲡⲉⲗⲟⲟⲗⲉ
  choice: 一棵葡萄树
  rationale: 该词源自希腊语ἄμπελος，指葡萄藤或葡萄树；“葡萄树”在现代汉语中自然明确，并保留农业意象。
- source_word: ⲁⲩⲧⲟϭⲥ
  choice: 被种
  rationale: 原文是第三人称复数完成式，带“它”这一宾语；此处复数主语为不定施事，汉语用被动式可自然表达。
- source_word: ⲙ̄ⲡⲥⲁ ⲛⲃⲟⲗ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: 在父之外
  rationale: 紧贴表示外部位置的短语，并保留定冠词所标明的“父”；不增添“我的”，也不把空间性措辞解释成某种特定神学关系。
- source_word: ⲥⲧⲁϫⲣⲏⲩ ⲁⲛ
  choice: 没有扎稳
  rationale: 该状态式动词表示未被稳固、未坚立；在葡萄树语境中“扎稳”自然，但不像“扎根”那样把原文未明说的根部意象提前加入。
- source_word: ⲥⲉⲛⲁⲡⲟⲣⲕⲥ
  choice: 就会被人拔除
  rationale: 原文用第三人称复数表达不特定施事；“被人”既保留有人执行动作的意味，又符合现代汉语表达。
- source_word: ϩⲁⲧⲉⲥⲛⲟⲩⲛⲉ
  choice: 从根部
  rationale: 保留来源或分离关系；不径直扩写成“连根”，以免消除“从其根”与“抓住其根”等可能语感之间的细微差别。
- source_word: ⲧⲁⲕⲟ
  choice: 灭亡
  rationale: 表达走向毁坏、归于灭亡的结果，保持格言式话语的庄重语气。
theological_decisions:
- issue: “父之外”的所指及葡萄树比喻的解释
  choice: 直译“在父之外”，不说明葡萄树象征谁或什么
  alternative: 译作“不是我父栽种的”，或明确解释为某一群体、教训或制度
  rationale: 科普特文本说的是“在父之外”，且没有“我的”或“所栽种的”这类限定；应避免与《马太福音》15:13协调，也不替原文解开比喻。
- issue: 拔除者的身份
  choice: 用不定施事“被人”
  alternative: 明确为父、上帝、天使或审判者
  rationale: 原文只有不特指的第三人称复数，未交代施事身份；译文不作神学补足。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留《多马福音》格言简短突兀的节奏。“父之外”刻意不作顺滑改写，以保存原文真实的神学张力；“被人”则使不定施事在汉语中清楚可读。
