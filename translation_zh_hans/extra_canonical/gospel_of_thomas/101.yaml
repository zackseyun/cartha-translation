base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/101.yaml
  text: Whoever does not hate his father and his mother as I do cannot become my disciple[a]; and whoever does not love his father and his mother as I do cannot become my disciple. For my mother [...][c], but my true[b] [mother] gave me life.
translation:
  language: zh_hans
  text: 凡不按我的方式恨自己父母的，不能作我的门徒[a]；凡不按我的方式爱自己父母的，不能作我的门徒。因为我的母亲……[b]，但我真正的[c]母亲赐给了我生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按我的方式”也可译作“像我一样”或“以我的方式”。
    reason: 说明比较短语 ⲛ̄ⲧⲁϩⲉ 的语义范围；脚注置于首处，并适用于后一句同样的表达。
  - marker: b
    text: 抄本此处残损，无法确定原文。有人推测其意思类似“生我走向死亡”或“给了我虚假”，但这些补法都不确定。
    reason: 如实标明手稿缺损，并区分可读文本与现代重构。
  - marker: c
    text: “真正的”字面意思是“属真理的”或“真实的”。原文没有说明这位母亲是谁。
    reason: 保留 ⲙ̄ⲙⲉ 的字面色彩，并避免将“母亲”未经文本支持地等同于某一特定神学形象。
lexical_decisions:
- source_word: ⲙⲉⲥⲧⲉ
  choice: 恨
  rationale: 这是该科普特语动词的直接常用义；保留原话中“恨”与“爱”的尖锐张力，不弱化为“少爱”。
- source_word: ⲙⲣ̄ⲣⲉ
  choice: 爱
  rationale: 对应“爱”的动词，与前句“恨”构成刻意的对照。
- source_word: ⲛ̄ⲧⲁϩⲉ
  choice: 照我这样
  rationale: 原短语可表示“以我的方式”或“像我一样”；此译自然地修饰前面的行为，同时保留比较关系。
- source_word: ϣ ... ⲁⲛ
  choice: 不能
  rationale: 能力助动词与否定词合用，表示“不能”或“无法”。
- source_word: ⲙⲁⲑⲏⲧⲏⲥ
  choice: 门徒
  rationale: 该希腊语借词在此指跟随并受教的人；“门徒”符合本书语境和现代中文宗教文献惯用语。
- source_word: ⲙ̄ⲙⲉ
  choice: 真正的
  rationale: 字面为“属真理的／真实的”，在此作定语；“真正的”既通顺，又不预先判定其具体身份。
- source_word: ⲱⲛϩ
  choice: 生命
  rationale: 直接对应“生命”，并保留末句有关生命来源的神学表达。
theological_decisions:
- issue: “恨父母”与“爱父母”并列所形成的张力
  choice: 两句分别直译为“恨”和“爱”，均以“照我这样”修饰
  alternative: 把“恨”解释性弱化为“爱得较少”，或把第二句改解为“爱父母胜过爱我”
  rationale: 现存科普特语文本明确使用两个相反动词，并在两句中重复比较短语。译文不借平行传统消解这一反常并列。
- issue: “真正的母亲”的身份
  choice: 保留为“我真正的母亲”，不指明具体身份
  alternative: 明确译为圣灵、神圣智慧或其他超越性母性形象
  rationale: 文本本身没有给出身份；明确命名会引入解释性或宗派性判断。
- issue: 残缺处所表达的生母与真正母亲之间的对照
  choice: 以省略号标示无法恢复的文字，仅译出后半句“但我真正的母亲赐给了我生命”
  alternative: 补作“生我至死”或“给了我虚假”
  rationale: 抄本在关键谓语处受损，各种补文均有推测性；正文应保留真实的文本不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“作我的门徒”保留传统经文语感但仍属当代常用表达。以“自己父亲和母亲”消除中文中主语所属关系的歧义。残缺处用省略号而不擅自补文；所有脚注标记均已在正文出现。
