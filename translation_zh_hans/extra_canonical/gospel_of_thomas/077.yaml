base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/077.yaml
  text: Jesus said, "I am the light that is over them all. I am the All. It is from me that the All came forth, and to me that the All reached. Split a piece of wood; I am there. Lift up the stone, and you will find me there."
translation:
  language: zh_hans
  text: 耶稣说：“我是那在万有之上的光。我就是万有。万有从我而出，也达到我这里。[a]劈开一块木头，我就在那里；举起石头，你们会在那里找到我。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“万有达到我这里”与下句“劈开”中连续使用同形词ⲡⲱϩ（pōh）：前者意为“达到、抵达”，后者意为“劈开、裂开”；中文无法完整重现这一双关。
    reason: 说明源文有意的同形词双关。
  - marker: b
    text: 希腊文残片《俄克喜林库斯纸草》1号把“举起石头”和“劈开木头”两项命令的次序颠倒，并将它们接在语录30末尾。
    reason: 记录重要的异文及语录分段差异。
lexical_decisions:
- source_word: ⲡⲟⲩⲟⲉⲓⲛ ⲡⲁⲓ ⲉⲧϩⲓϫⲱⲟⲩ ⲧⲏⲣⲟⲩ
  choice: 那在万有之上的光
  rationale: 保留定冠结构及“在……之上”的空间性和超越性，不把代词所指过度限定为人或物。
- source_word: ⲡⲧⲏⲣϥ
  choice: 万有
  rationale: 这是名词化的整体概念，指一切存在的总体；“万有”在现代中文中凝练庄重，并保留其绝对性。
- source_word: ⲉⲓ ⲉⲃⲟⲗ ⲛ̄ϩⲏⲧ
  choice: 从我而出
  rationale: 直译来源方向，并以“是……的”句式体现科普特语第二完成时对“从我”的强调。
- source_word: ⲡⲱϩ ϣⲁⲣⲟⲉⲓ
  choice: 向我而达到
  rationale: 保留动词“达到、抵达”和朝向说话者的终点含义；措辞略显突兀，以免擅自解释为回归、归一或得救。
- source_word: ⲡⲱϩ ⲛ̄ⲛⲟⲩϣⲉ
  choice: 劈开一块木头
  rationale: 此处同形动词意为劈开、裂开；ϣⲉ 可指木头或一块木料，译文采取自然的数量表达。
- source_word: ϥⲓ ⲙ̄ⲡⲱⲛⲉ ⲉϩⲣⲁⲓ
  choice: 掀起石头
  rationale: ϥⲓ 与向上副词组合表示抬起；“掀起”符合查看石头下面时的现代汉语表达，同时保留向上移动之意。
- source_word: ⲧⲉⲧⲛⲁϩⲉ ⲉⲣⲟⲉⲓ
  choice: 你们会找到我
  rationale: ϩⲉ 加介词表示找到、遇见，不译作“看见”；保留复数第二人称。
theological_decisions:
- issue: “万有”与耶稣的认同
  choice: 我就是万有
  alternative: 我是一切／我就是整体
  rationale: 按原文直接保留身份断言，不将其系统化为泛神论、万有在神论或任何特定宗派教义。
- issue: 光与“万有”的关系
  choice: 在万有之上的光
  alternative: 照在众人之上的光／在一切之上的光
  rationale: 原文代词具有一定开放性；结合紧接着的“万有”，译作“万有”较连贯，但不进一步说明是统治、空间位置还是超越地位。
- issue: 万有“达到”耶稣
  choice: 向我而达到
  alternative: 归到我这里／延伸到我
  rationale: 保留终点方向和动词的语义张力，不把它解释成救赎性的归回或宇宙论上的重新合一。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。核心宇宙论用语译为“万有”，避免生硬的“大写整体”等英语式表达；保留原文短句、反复和神秘性的张力。脚注标记均置于相关正文处。
