revisions:
- from: 耶稣说：“我是那在万有之上的光。我就是万有。万有是从我而出的，万有也是向我而达到的。[a]劈开一块木头，我就在那里；掀起石头，你们会在那里找到我。”[b]
  to: 耶稣说：“我是那在万有之上的光。我就是万有。万有从我而出，也达到我这里。[a]劈开一块木头，我就在那里；举起石头，你们会在那里找到我。”[b]
  rationale: 修订只处理两处安全且必要的汉语表达：以“达到我这里”自然保留原文“到我”的终点和与“从我而出”的平行，不作神学扩展；以“举起”直接对应“抬起／向上举”。同时同步更新两条脚注中与正文相应的措辞和脚注a的转写说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:13Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达科普特文的重复、宇宙性“万有”、木头与石头的命令，以及“找到我”的含义。惟“万有也是向我而达到的”虽试图保留原文的终点方向和强调，现代汉语中不自然，且“向我而达到”搭配生硬。改为“万有从我而出，也达到我这里”可保留其来源与终点的平行，而不把“达到”释义为救赎性的“归回”。“举起石头”比“掀起石头”更直接对应ϥⲓ与向上副词ⲉϩⲣⲁⲓ。
  naturalness: 除上述一句外，行文庄重、简洁，适合现代书面普通话。“万有”作为此处名词化整体的译法可用，且重复保留得当。将“掀起”改为“举起”、将“向我而达到”改为“达到我这里”后，语句更自然，语义亦更明确。
  terminology: “耶稣”“光”“万有”“劈开”“木头”“石头”“找到我”均稳定且合乎原文。“万有”不应在译文或注释中附加泛神论、万有在神论等系统神学解释。脚注a恰当地说明ⲡⲱϩ的同形双关；脚注b准确概述P.Oxy. 1中命令顺序及语录位置的差异。
  issues:
