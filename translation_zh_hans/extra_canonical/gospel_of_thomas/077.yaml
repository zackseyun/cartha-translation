    issue: “万有也是向我而达到的”不合现代汉语惯用搭配。
    rationale: 原文ⲡⲱϩ ϣⲁⲁⲛⲟⲕ表达“万有达到／抵达我（这里）”，并以第二完成时突出终点。“向我而达到”机械复制介词方向，造成不必要的生硬。
  - severity: low
    issue: “掀起石头”不如“举起石头”贴近原文动作。
    rationale: ϥⲓ配ⲉϩⲣⲁⲓ的基本意思是“举起、抬起”。“掀起”可以成立，但常带掀开覆盖物的语感；“举起”更中性、直接。
