revisions:
- from: 耶稣说：“人不从荆棘上摘葡萄，也不从蒺藜上采无花果[a]，因为这些植物不结果子。善人从自己的宝库[b]里取出善来；恶人从自己心里的恶宝库[c]取出恶来，并说出恶言[d]；因为心里所充满的，他就从中取出恶来。”
  to: 耶稣说：“人不会从荆棘上摘葡萄，也不会从蒺藜上采无花果[a]，因为它们不结果子。善人从自己的库藏[b]中取出善来；恶人从自己的库藏中取出恶来，就是那在他心里的恶[c]；他也说出恶来[d]，因为他从心中的充盈中取出恶来。”
  rationale: 修订仅处理原文的句法歧义和末句的来源意象：以中性的“库藏”对应储藏处，并将“在他心里的恶”独立表达，避免草稿把它固定为“心里的恶宝库”。植物、善恶的概括性和本抄本末句重复“恶”的措辞均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:15Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了本抄本中“荆棘／蒺藜—葡萄／无花果”、善人和恶人从其储藏处取出善恶，以及末句再次明确说“取出恶”的结构。可是正文“自己心里的恶宝库”把原文中“储藏处”与“在他心里的恶”之间压缩而有歧义的修饰关系定为“恶的宝库在心里”，并把“恶”直接加作“宝库”的属性；这不是原文唯一可确证的意思。末句“心里所充满的，他就从中取出恶来”也将“从心的充盈／丰盛中”较明显地对象化。
  naturalness: “摘葡萄”“采无花果”“荆棘”“蒺藜”及整体庄重的现代汉语语体均自然。“心里的恶宝库”虽可读，却因将歧义固定而不宜保留。改为“从自己的库藏中取出恶来，就是那在他心里的恶”可使正文通顺，同时不把库藏本身解释成“恶宝库”。
  terminology: “善／恶”适合保留科普特语名词化形容词的概括性；“库藏”比“宝库”更中性地表达储存处／积存，避免“宝”在汉语中带来的正面价值色彩。植物词“蒺藜”可保留，但应以脚注说明其物种辨识不确定。
  issues:
  - severity: medium
    issue: “恶人从自己心里的恶宝库取出恶来”过度确定修饰关系。
    rationale: 原文在“自己的储藏处”之后接“在他心里的恶”，其句法关系紧凑且存在歧义；不能无注释地将其落实为“心里的恶宝库”，更不应把“恶”确定为修饰“宝库”。
  - severity: low
    issue: “宝库”可能在汉语中附带正面或贵重的色彩。
    rationale: 原词可指储藏处或积存；译为“库藏”更中性，也仍保留容器隐喻。
  - severity: low
    issue: 末句的“心里所充满的”略将来源短语改造成所取出的对象。
    rationale: 原文说从“心的充盈／丰盛”中取出恶；译文宜保留“从……中”的来源意象。
