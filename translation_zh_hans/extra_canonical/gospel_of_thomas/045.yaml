base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/045.yaml
  text: Jesus said, “They do not pick grapes from thorns, nor do they gather figs[b] from thistles—for they do not give fruit. A good person[a] brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart[c], and he speaks evil[d], for from the overflow of the heart he brings out evil.”
translation:
  language: zh_hans
  text: 耶稣说：“人不会从荆棘上摘葡萄，也不会从蒺藜上采无花果[a]，因为它们不结果子。善人从自己的库藏[b]中取出善来；恶人从自己的库藏中取出恶来，就是那在他心里的恶[c]；他也说出恶来[d]，因为他从心中的充盈中取出恶来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒺藜”所译的科普特词可能特指“骆驼刺”一类有刺植物；确切物种不明。
    reason: 植物名称在词源和物种辨识上存在不确定性。
  - marker: b
    text: “库藏”也可理解为“积存”或“储藏处”。这里保留原文把人内在所有比作库藏的意象。
    reason: 说明容器隐喻及词义范围。
  - marker: c
    text: 原文此处句法紧凑。“在他心里的恶”也可能与前面的“库藏”有不同的连接方式；译文不把它确定为“恶的库藏”。
    reason: 保留修饰关系的真实歧义，避免将“恶”直接定作“库藏”的属性。
  - marker: d
    text: 此处直译为“说出恶来”；上下文中的“说”表明这里指说出来的恶，但未限定其具体类别。
    reason: 保留原文“恶”的概括性，不预设为某一类恶言。
lexical_decisions:
- source_word: ϣⲟⲛⲧⲉ
  choice: 荆棘
  rationale: 该词泛指有刺的灌木；“荆棘”既自然，又保留植物类别的宽泛性。
- source_word: ⲥⲉⲣϭⲁⲙⲟⲩⲗ
  choice: 蒺藜
  rationale: 字面构词可能指“骆驼刺”一类有刺植物，确切物种不明；“蒺藜”在汉语中能自然表达与荆棘并列的有刺植物，脚注说明其不确定性。
- source_word: ⲡⲉϥⲁϩⲟ
  choice: 自己的宝库
  rationale: 该词表示储藏财物之处或其中的积存；“宝库”保留容器隐喻，并与后文“心里”相连。
- source_word: ⲁⲅⲁⲑⲟⲛ / ⲡⲟⲛⲏⲣⲟⲛ
  choice: 善／恶
  rationale: 原文使用可作名词的中性形容词，既可指善恶之物，也可指善恶之言行；简洁译作“善／恶”可保留这种概括性。
- source_word: ⲡϩⲟⲩⲟ ⲛⲡϩⲏⲧ
  choice: 心里所充满的
  rationale: 原意是“心的充盈、满溢”；此译在现代汉语中自然，并保留由内在丰盈而流出的意象。
theological_decisions:
- issue: “宝库”与“心”的关系
  choice: 恶人从自己心里的恶宝库取出恶来
  alternative: 恶人从自己的恶宝库取出心里的恶来
  rationale: 科普特语的修饰关系略显压缩，可理解为宝库本身在心里，也可理解为其中储藏的是心里的恶。正文采用前一种较直接的句法连接，脚注保留另一种可能。
- issue: 末句是否泛化为普遍原则
  choice: 保留原文明确的“恶”
  alternative: 译作“心里所充满的，口里就说出来”
  rationale: 本抄本末句明确重复“取出恶来”，不宜按平行传统改写为中性的普遍格言。
- issue: “说出恶”是否专指亵渎或假教导
  choice: 译作“说出恶言”
  alternative: 译作“说邪恶的话”或赋予特定教义含义
  rationale: 原文只说“说出恶”，没有限定恶言的具体类别，因此不引入宗派性或特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“摘葡萄／采无花果”符合汉语搭配；“宝库”“取出”“心里所充满的”维持原文连续的储藏与满溢意象。正文不借用平行福音传统来补足或改写本抄本，尤其保留末句重复出现的“恶”及其张力。
