base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/028.yaml
  text: Jesus said[1], "I stood in the midst of the world, and I appeared to them in flesh.[1] I found them all drunk; I found not one of them thirsting.[2] And my soul was pained over the children of humanity,[3] for they are blind in their heart and they do not see that they came into the world empty, seeking also to go out of the world empty.[4] But now they are drunk. When they have shaken off their wine[a][5][4][3][2], then they will repent."[5]
translation:
  language: zh_hans
  text: 耶稣说：“我曾站在世界中央，并以肉身向他们显现。[a]我发现他们全都醉了；他们中间没有一个口渴的。[b]我的心灵为人的儿女[c]而痛苦，因为他们心里盲目，看不见自己空空地来到世上，又在寻求空空地离开世上。[d]如今他们仍然醉着；等他们摆脱了酒意，[e]就会悔改。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现”也可译作“显露出来”或“发出光来”。原词的语义包括显明与照耀。
    reason: lexical_alternative
  - marker: b
    text: 科普特语句式较紧凑；希腊语残篇《俄克喜林库斯纸草》1明确作“没有发现他们中间有一个口渴的”，支持这里的否定读法。
    reason: textual_witness
  - marker: c
    text: 原文直译为“人的儿女”，泛指人类的儿女，并不限于男性。
    reason: inclusive_scope
  - marker: d
    text: “又在寻求”是伴随前句的情状表达；也可理解为“同时寻求”。“离开”直译为“从世界出去”。
    reason: syntax_and_lexical_alternative
  - marker: e
    text: 原文的习语较直白地说他们除去或摆脱“他们的酒”；也可按结果译作“等他们酒醒以后”。
    reason: idiom
lexical_decisions:
- source_word: ⲱϩⲉ ⲉⲣⲁⲧ ϩⲛⲧⲙⲏⲧⲉ ⲙⲡⲕⲟⲥⲙⲟⲥ
  choice: 站在世界中央
  rationale: 保留“站立”及“在……中央”的空间意象；“世界”是ⲕⲟⲥⲙⲟⲥ在现代汉语中的自然对应。
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 显现
  rationale: 该词组可指显露、显现或发出光来；“显现”既保留被看见的含义，也不强行加入发光的意象。
- source_word: ϩⲛ ⲥⲁⲣⲝ
  choice: 以肉身
  rationale: 直译“在肉中”在汉语里生硬；“以肉身”保留其具体而鲜明的肉身措辞。
- source_word: ⲧⲁϩⲉ ⲙⲡⲓϩⲉ / ⲧⲟϩⲉ
  choice: 醉了／醉着
  rationale: 前后与“酒”相呼应，采用具体直接的“醉”，不抽象化为迷乱或无知。
- source_word: ⲉϥⲟⲃⲉ
  choice: 口渴的
  rationale: 按“渴”的基本意义翻译；希腊语重叠见证也明确支持“没有一个口渴的”。
- source_word: ⲯⲩⲭⲏ
  choice: 心灵
  rationale: 该希腊借词可指灵魂、生命或内在自我；“心灵”在此能自然承接“感到痛苦”，同时避免把语义范围限定为后世术语。
- source_word: ⲛϣⲏⲣⲉ ⲛⲣⲣⲱⲙⲉ
  choice: 人的儿女
  rationale: 贴近原文“人的子女”的集合性表达，不缩减为男性，也不直接改写为较宽泛的“世人”。
- source_word: ⲉⲩϣⲟⲩⲉⲓⲧ
  choice: 空空地
  rationale: 保留原文两次出现的“空”及其首尾呼应，不擅自具体化为赤身、空手或一无所有。
- source_word: ⲉⲩϣⲓⲛⲉ ⲟⲛ
  choice: 又在寻求
  rationale: 将其作为伴随情状分句处理；ⲟⲛ译为“又”，同时保留“寻求”所表达的主动趋向。
- source_word: ⲛⲉϩ ⲡⲟⲩⲏⲣⲡ
  choice: 摆脱了酒意
  rationale: 原文酒与醉的习语在汉语中若逐字译为“甩掉他们的酒”难以理解；“摆脱酒意”保留酒的意象和状态转变。
- source_word: ⲣⲙⲉⲧⲁⲛⲟⲉⲓ
  choice: 悔改
  rationale: 该动词表示心意与方向的改变；“悔改”是简明、通行且不额外限定其方式的对应。
theological_decisions:
- issue: “以肉身显现”是否应解释为特定的基督论主张
  choice: 保留“以肉身向他们显现”
  alternative: 成为肉身来到他们中间
  rationale: 原文表达显现的方式或范围，并未使用“成为”的动词；译文不将其扩展为更明确的道成肉身公式，也不削弱“肉身”一词。
- issue: “空空地来到／离开世界”的含义
  choice: 保留重复而开放的“空空地”
  alternative: 一无所有地来，又一无所有地离去
  rationale: 原文没有说明“空”具体指物质财产、属灵状态或身体状态，因此不替读者作神学定论。
- issue: “醉”是否纯属比喻
  choice: 保留酒醉意象，不在正文解释其象征对象
  alternative: 他们全都陷于无知
  rationale: 上下文可能赋予醉酒象征意义，但原文刻意持续使用“醉”和“酒”；直译可保存其张力。
translation_notes:
  register: 采用现代标准普通话的庄重叙述体。保留“世界中央”“以肉身”“心里盲目”“空空地来／离开”及醉酒等核心意象；在“摆脱酒意”等处适度顺应现代汉语，同时用脚注标明原文可能的直译与替代读法。
