base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/093.yaml
  text: Do not give what is holy to the dogs[a], lest they throw them onto the dung-heap. Do not throw pearls to the pigs[f][e][d][c][b], lest they do it [...].
translation:
  language: zh_hans
  text: 不要把圣物给狗[a]，免得它们把它们扔到粪堆上[b]。不要把珍珠扔给猪，免得它们对它做……[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”原文是形容词名词化结构，字面为“圣的〔东西〕”。
    reason: lexical_alternative
  - marker: b
    text: “粪堆”所译的词是希腊语借词，指村落生活中的粪便堆或垃圾堆。
    reason: cultural_note
  - marker: c
    text: 这里的抄本残缺。残缺前尚可读出“它们对它做……”一类表达，但具体会“做”什么已无法确定；有些编者参照《马太福音》7:6补作“践踏”，本译文不作补入。
    reason: lacuna_or_restoration
  - marker: d
    text: 原文的代词在数上并不协调：前句说狗把“它们”扔掉，虽“圣物”为单数性表达；后句说猪对“它”做某事，虽“珍珠”按语境为复数或集合概念。译文保留这种不一致。
    reason: textual_grammar
lexical_decisions:
- source_word: ϫⲉⲙⲡⲣϯ
  choice: 不要……给
  rationale: ⲙⲡⲣ加不定式构成禁止命令；ϯ的基本义为“给”。
- source_word: ⲡⲉⲧⲟⲩⲁⲁⲃ
  choice: 圣物
  rationale: 这是形容词名词化结构，字面为“圣的〔东西〕”；“圣物”简洁保留其事物指向，不限定为某种宗教礼仪用品。
- source_word: ⲛⲡⲟⲩϩⲟⲣ
  choice: 给狗
  rationale: ϩⲟⲟⲣ意为“狗”，原文为复数、泛指；现代汉语用无定复数“狗”自然表达。
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: 免得
  rationale: 表达预防性的目的或结果，与箴言式警告的语气相称。
- source_word: ⲛⲟⲩⲛⲟⲩϫⲉⲛⲧⲟⲟⲩ
  choice: 它们把它们扔
  rationale: 动词意为“扔”，主语与宾语后缀都为复数。虽与前面的单数性“圣物”不一致，仍保留抄本的数不协调。
- source_word: ⲕⲟⲡⲣⲓⲁ
  choice: 粪堆
  rationale: 这是希腊语借词，指粪便或垃圾堆；“粪堆”具体而通俗。
- source_word: ⲙⲡⲣⲛⲟⲩϫⲉ
  choice: 不要……扔
  rationale: 与前句同一动词，译文保留重复。
- source_word: ⲛⲡⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: 珍珠
  rationale: 希腊语借词“珍珠”；按语境用汉语集合式名词，不强加数量。
- source_word: ⲛⲡⲉϣⲁⲩ
  choice: 给猪
  rationale: ϣⲁⲩ意为“猪”；采用现代、具体的常用词。
- source_word: ϩⲓⲛⲁ ϫⲉ
  choice: 免得
  rationale: 在此引出预防性从句，并与前半句形成平行。
- source_word: ⲛⲟⲩⲁⲁϥ / ⲉⲓⲣⲉ ⲛⲧⲟϥ
  choice: 它们对它做……
  rationale: 抄本保留了“它们做它/对它做”的成分，但后续残缺；不依据《马太福音》补出“践踏”等动词内容。
theological_decisions:
- issue: 是否以《马太福音》7:6补足残缺内容
  choice: 保留残缺，不补“践踏”
  alternative: 译作“免得它们践踏珍珠”
  rationale: 现存科普特文不足以支持具体补词；平行传统可供比较，却不能取代本抄本证据。
- issue: 代词数的不一致
  choice: 保留“圣物”之后的复数宾语和“珍珠”之后的单数宾语
  alternative: 按汉语语义统一为单数或复数
  rationale: 这种交错的不一致确实见于传抄文本；保留它可避免静默修正文义。
translation_notes:
  register: 采用现代标准汉语，语气简洁、庄重而具箴言感。保留“给／扔／免得”的平行结构，也保留抄本中代词数的不协调和末尾残缺，不用平行经文消解文本张力。
