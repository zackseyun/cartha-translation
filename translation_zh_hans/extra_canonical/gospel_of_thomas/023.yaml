base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/023.yaml
  text: Jesus said to you, “I will choose you, one out of a thousand and two out of ten thousand, a single one; they will stand, and they will stand as a single one.”
translation:
  language: zh_hans
  text: 耶稣说：“我要拣选你们：从一千人中拣选一个，从一万人中拣选两个；他们[a]将站立，作为一个单一者[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里由第二人称复数“你们”突然转为第三人称复数“他们”；译文保留这一转换。
    reason: grammatical_shift
  - marker: b
    text: “一个单一者”直译原文 ⲟⲩⲁ ⲟⲩⲱⲧ，意为“一个、单一的”。原文在此以状态性表达说他们“作为”一个单一者，并未进一步说明这种“单一”具体指什么。
    reason: lexical_theological_ambiguity
lexical_decisions:
- source_word: ⲥⲉⲧⲡ
  choice: 拣选
  rationale: 该动词意为“选择、拣选”。“拣选”既贴近原文，也保留了此处郑重的语气，而不额外限定其神学含义。
- source_word: ϣⲟ / ⲧⲃⲁ
  choice: 一千 / 一万
  rationale: 分别按科普特语数词的通常数值译出；ⲧⲃⲁ 是“一万”，不采用现代汉语中不够明确的“万千”。
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: 站立
  rationale: 这是表示“站立”的惯用结构，字面涉及“以自己的脚站着”，并非“站在你们面前”。
- source_word: ⲉⲩⲟ
  choice: 成为
  rationale: 此处表示他们处于某种存在状态。汉语用“成为”自然连接“站立”与后面的“单一者”，但不把它误解为主动的“制造”。
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: 单一者
  rationale: 原语强调“一个、单一”。译作“单一者”保留《多马福音》中这一用语的特殊分量，避免以“团结一致”或“合而为一”预先解释其含义。
theological_decisions:
- issue: ⲟⲩⲁ ⲟⲩⲱⲧ 所表达的合一或单一状态
  choice: 单一者
  alternative: 合为一体；成为一人；同一者
  rationale: 原文可以指成为“一个、单一的”，但没有明说这是群体团结、人格整合或其他特定神学观念。“单一者”保留其开放性和思想张力。
- issue: 由第二人称复数转为第三人称复数
  choice: 保留“你们”到“他们”的转换
  alternative: 统一译为“你们”
  rationale: 手稿先说“我要拣选你们”，随后说“他们将站立”。保留这一突变，避免擅自修正文法或认定后者必然与前者完全同指。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“从一千人中拣选一个，从一万人中拣选两个”保留原文醒目的数量对比；分号使人称转换清楚可见。没有照搬英语咨询层中重复出现的“单一者／他们将站立”，因为科普特手稿只出现一次“他们将站立，成为单一者”。
