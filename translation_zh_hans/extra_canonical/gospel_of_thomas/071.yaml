base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/071.yaml
  text: Jesus said[a], I will cast down this house[c][b], and no one will be able to build it.
translation:
  language: zh_hans
  text: 耶稣说：“我要拆毁这座房子[a]，谁也[c]不能把它建起来[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这座房子”所在位置的抄本有残缺。现存文字为ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϯⲛⲁϣⲟⲣ[ϣⲣ ⲙⲡⲉⲉ]ⲓ̣ⲏ̣ⲉⲓ；迪利的规范文本复原为ⲛⲡⲉⲓⲏⲓ，即“这座房子”。
    reason: lacuna_or_restoration
  - marker: b
    text: ϣⲕⲱⲧ的意思是“能够”。原文没有明说“建”这一动作；这里根据宾语“房子”和上下文补出。“重建”也是常见译法，但科普特文并没有明说“重新”。
    reason: lexical_alternative
  - marker: c
    text: ⲙⲛ̄ⲗⲁⲁⲩ由否定成分和不定代词构成，意为“没有人”；ⲗⲁⲁⲩ在萨希迪语和吕科波利语中都很常见。
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: 耶稣说
  rationale: 这是由“说”加说话者构成的固定引语引入式；将抄本中的耶稣圣名缩写按规范文本展开。
- source_word: ⲁⲛⲟⲕ
  choice: 我
  rationale: 独立第一人称代词带有强调作用；现代汉语用“我”已可自然表达，不另加“我亲自”，以免过度强化。
- source_word: ϣⲟⲣϣⲣ
  choice: 拆毁
  rationale: 该动词可指拉倒、拆毁；“拆毁”与宾语“房子”搭配自然，也保留原文直截了当的力度。
- source_word: ⲡⲉⲓⲏⲓ
  choice: 这座房子
  rationale: ⲏⲓ意为房屋、住处，指示成分表示“这”；“这座房子”是现代汉语中最直接自然的表达。
- source_word: ⲙⲛ̄ⲗⲁⲁⲩ
  choice: 谁也不
  rationale: 否定成分与不定代词结合，意思是“没有人”；在本句中译作“谁也不能”比“没有人能够”更自然。
- source_word: ϣⲕⲱⲧ
  choice: 能
  rationale: 该词本义为“有能力、能够”；原文未明说后续动作，动作由“房子”和语境推知。
- source_word: ⲛⲧⲟϥ
  choice: 把它
  rationale: 这是指向前述房子的第三人称单数宾语形式；配合汉语所补出的“建起来”，译作“把它”。
theological_decisions:
- issue: “房子”是否应解释为圣殿、身体或某种宗教制度
  choice: 保留为“这座房子”
  alternative: 译成“这座圣殿”或加入象征性说明
  rationale: 科普特文本本身只说“房子／房屋”，没有明示其象征所指；不在正文中预先裁定神学解释。
- issue: 是否译作“重建”
  choice: 译作“建起来”
  alternative: 重建
  rationale: 语境可能暗示再次建造，但科普特文没有明示“再、重新”；因此不把这一层意思写死。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“拆毁”保持原句的强烈、简洁语气；“谁也不能把它建起来”自然表达原文，同时用脚注说明“建”是从语境补出的。未将“房子”解释为“圣殿”或其他象征对象。
