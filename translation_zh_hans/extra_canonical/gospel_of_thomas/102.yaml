base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/102.yaml
  text: 'Jesus said[d][c][b][a], “Woe to the Pharisees! For they are like a dog lying on the manger of the cattle: it neither eats nor lets the cattle eat.”'
translation:
  language: zh_hans
  text: 耶稣说：“法利赛人有祸了！因为他们好像一条狗，卧在牲畜[a]的食槽上：自己不吃，也不让牲畜吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 手抄本中“食槽”之后、指“牲畜”的短语有字母残损，字形可能被读成“日子”。这里依据校订读法，并由后文再次出现的“牲畜”得到印证，译为“牲畜的食槽”。原词泛指家畜，因此不特指“牛”。
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲟⲩⲟⲓ
  choice: 有祸了
  rationale: 保留警告和谴责的力度，也符合现代中文宗教文本的庄重语体；不弱化为单纯的哀叹。
- source_word: ⲉⲓⲛⲉ
  choice: 好像
  rationale: 简洁自然地表达“像、类似”的比喻关系。
- source_word: ⲟⲩϩⲟⲣ
  choice: 一条狗
  rationale: 按基本词义直译，保留比喻的尖锐和直白。
- source_word: ⲛⲛⲕⲟⲧⲕ
  choice: 卧
  rationale: 此处主要描写姿势；“卧”比“睡”更少加入状态判断，且庄重简练。
- source_word: ϩⲓϫⲛ
  choice: 在……上
  rationale: 准确保留空间关系。
- source_word: ⲡⲟⲩⲟⲙϥ
  choice: 食槽
  rationale: 直接表达牲畜进食所用的槽，现代读者容易理解，也避免“马槽”把牲畜种类具体化。
- source_word: ⲛϩⲉⲛⲉϩⲉ / ⲡⲉϩⲉ
  choice: 牲畜
  rationale: 科普特语所指为泛称的家畜，不必限定为牛；两处采用同一译法以保持照应。
- source_word: ⲟⲩⲱⲙ
  choice: 吃
  rationale: 保留基本、直接的动作词义。
- source_word: ⲕⲱ (ⲛⲡⲉϩⲉ ⲉⲟⲩⲱⲙ)
  choice: 让牲畜吃
  rationale: 该动词与不定式连用表示容许；在否定结构中自然译为“不让……吃”。
- source_word: ϫⲉ (causal)
  choice: 因为
  rationale: 明确而自然地传达第二个ϫⲉ引出的因果关系。
theological_decisions:
- issue: 对法利赛人的祸语是否解释其具体所指
  choice: 仅保留原文中的比喻和谴责，不增添教义性解释
  alternative: 把狗和食槽解释为宗教领袖阻挡他人获得救恩或知识
  rationale: 原文没有明说食物象征何物；直译可保留比喻本身的开放性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有祸了”保留警告力度；“食槽”比“马槽”更准确，因为原文没有限定动物种类。标点使比喻的两部分清楚对应，同时保持语句简洁。
