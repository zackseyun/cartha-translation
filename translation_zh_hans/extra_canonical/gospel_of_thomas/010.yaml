base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/010.yaml
  text: Jesus said[a], “I have cast a fire upon the world, and look[c][b], I am guarding it until it blazes.”
translation:
  language: zh_hans
  text: 耶稣说：“我已经把一把火投到世上[c]。看哪，[a]我正守着它[b]，直到它燃烧起来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”所译的ⲉⲓⲥϩⲏⲏⲧⲉ是唤起注意的指示性惯用语，也可译作“请看”或“留意”。
    reason: lexical_alternative
  - marker: b
    text: “守着”所译的ϩⲁⲣⲉϩ也可理解为“看守着”或“守护着”；原文没有说明这种看守的具体性质。
    reason: lexical_alternative
  - marker: c
    text: 参路加福音12:49：“我来是要把火投在地上……”；本句说的是“世上”，后文也不同：“我正守着它，直到它燃烧起来。”
    reason: cross_reference
lexical_decisions:
- source_word: ⲁⲁⲛⲟⲕ … ⲛⲟⲩϫⲉ
  choice: 我已经……投到
  rationale: ⲛⲟⲩϫⲉ表示“投、扔”；完成体配合强调代词，译作“我已经……”，既表达动作已经完成，也保留其当前关联。中文以“投到世上”自然表达动作及落点。
- source_word: ⲛⲟⲩⲕⲱϩⲧ
  choice: 一把火
  rationale: ⲕⲱϩⲧ意为“火”，前有不定冠词；“一把火”是现代汉语中自然、形象的对应说法，又不把它具体化为别的事物。
- source_word: ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: 到世上
  rationale: ⲉϫⲛ表示“在……之上、到……之上”，ⲕⲟⲥⲙⲟⲥ是希腊语借词，指“世界”；结合“投”的汉语搭配，译作“投到世上”最自然。
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: 看哪
  rationale: 这是指示兼唤起注意的固定用语。“看哪”保留原文突出的语气和简洁性，正文脚注列出较口语的可能表达。
- source_word: ϩⲁⲣⲉϩ
  choice: 正守着
  rationale: 该动词可指看守、守护或留心看顾；“正守着”保留持续动作和一定的保护意味，同时不明确说明为何要守。
- source_word: ⲉⲛⲧⲟϥ
  choice: 它
  rationale: 第三人称阳性单数宾语代词回指语法上为阳性的“火”；现代汉语自然地用“它”。
- source_word: ϣⲁⲛⲧⲉ
  choice: 直到
  rationale: 该连词标明持续动作的时间终点，“直到”准确而简洁。
- source_word: ϫⲉⲣⲟ
  choice: 燃烧起来
  rationale: 该词表示着火、燃旺或熊熊燃烧；“燃烧起来”表达起始并保留火势显现的动态，不仅是静态的“烧着”。
theological_decisions:
- issue: “火”的象征含义
  choice: 不在正文中解释火所象征的事物
  alternative: 明确解释为审判、净化、纷争、圣灵或启示
  rationale: 原文只给出火的意象，并未在本句说明其象征意义；译文保留这一神学张力，不替读者作教派性判断。
- issue: 耶稣“守着”火的目的
  choice: 保留“守着”而不补充目的或结果
  alternative: 译成“保护它”“控制它”或“照料它”
  rationale: ϩⲁⲣⲉϩ的语义范围允许看守或守护，但原文没有说明这一行动是保护、约束还是照管；正文避免消除这种含混。
translation_notes:
  register: 采用简洁、庄重而可懂的现代标准汉语。“看哪”略带经文语体，用来保留原文突然而有力的指示语气；其余措辞保持自然，不使用艰深或宗派化术语。
