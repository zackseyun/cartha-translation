revisions:
- from: 耶稣说：“父的国好比一个人，他有好种子。他的仇敌夜里来了，把一株稗子[a]撒在好种子中。那人不许他们去拔那株稗子。他对他们说：‘免得你们去拔稗子时，连麦子也一同拔出来。因为到了收割的日子，稗子就会显露出来；人们会把它们拔出，烧掉。’”
  to: 耶稣说：“父的国好比一个有好种子的人。他的仇敌夜里来了，把一株稗子[a]撒在好种子上。那人不许他们去拔那株稗子。他对他们说：‘免得你们说：“我们要拔掉那株稗子。”而把麦子也同它一起拔掉。因为在收割的日子，稗子会显露出来；人们会把它们拔出来，烧掉。’”
  rationale: 补回原文中由“免得”引出的“说：‘我们要拔掉……’”这一内层引语，同时保留其后“连麦子也同它一起拔掉”的警告。其余仅作不改变意义的现代汉语顺译，并保留脚注锚点[a]及单数转复数的说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:24:56Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确呈现了“父的国”、好种子、敌人夜间撒下ζιζάνιον、不可拔除以免伤及麦子、收割日显露并被拔出焚烧的比喻。可是原文在禁令说明中明确含有“你们会说：‘我们要拔……’”这一未来引语；现译将这一层引语完全省略，削弱了原文的句法和话语内容，须补出。
  naturalness: 整体为自然、庄重的现代汉语。“一个人，他有好种子”可顺为“一个有好种子的人”；“撒在……中”改为“撒在……上”更合乎播种动作和原文介词的通常表达。补出内层引语后，以中文双层引号清晰呈现引语关系。
  terminology: “父的国”忠实且不增添“天”或“上帝”；“稗子”可保留，符合汉语圣经语境。脚注适当说明原文由单数转复数；不宜把该词的植物学对应说得超过文本所能确定的程度。
  issues:
  - severity: medium
    issue: 遗漏“我们要拔掉那株稗子”的内层未来引语
    rationale: 科普特文在“免得”之后有ϫⲉ及第一人称复数将来式ⲉⲛⲁϩⲱⲗⲉ（“我们要／将要拔”）。现译直接成为“免得你们去拔……时”，未保留“说”的内容及内层引语。
  - severity: low
    issue: 开头和播种动作可略作汉语顺译
    rationale: “一个有好种子的人”比“一个人，他有好种子”更凝练；种子通常“撒在……上”，也更贴近原文“在好种子之上”的表达。
  revised_text: 耶稣说：“父的国好比一个有好种子的人。他的仇敌夜里来了，把一株稗子[a]撒在好种子上。那人不许他们去拔那株稗子。他对他们说：‘免得你们说：“我们要拔掉那株稗子。”而把麦子也同它一起拔掉。因为在收割的日子，稗子会显露出来；人们会把它们拔出来，烧掉。’”
  revised_footnotes:
  - marker: a
    text: 原文先说“一株稗子”，随后说“那株稗子”，到结尾却改用复数“稗子／它们”。这里译作“稗子”的词指一种可混生于麦田的有害草类；也可泛译为“杂草”。
    reason: 说明原文由单数转为复数的显著变化，并交代植物名称的翻译范围。
