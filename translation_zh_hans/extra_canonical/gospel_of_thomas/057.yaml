base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
translation:
  language: zh_hans
  text: 耶稣说：“父的国好比一个有好种子的人。他的仇敌夜里来了，把一株稗子[a]撒在好种子上。那人不许他们去拔那株稗子。他对他们说：‘免得你们说：“我们要拔掉那株稗子。”而把麦子也同它一起拔掉。因为在收割的日子，稗子会显露出来；人们会把它们拔出来，烧掉。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说“一株稗子”，随后说“那株稗子”，到结尾却改用复数“稗子／它们”。这里译作“稗子”的词指一种可混生于麦田的有害草类；也可泛译为“杂草”。
    reason: 说明原文由单数转为复数的显著变化，并交代植物名称的翻译范围。
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: 父的国
  rationale: 直译其属格结构，保留“父”与“国”的神学关联，不擅自扩展为“天国”或“上帝的国”。
- source_word: ⲟⲩϭⲣⲟϭ ⲉⲣⲉⲛⲁⲛⲟⲩⲛⲧⲟϥ
  choice: 好种子
  rationale: 对应“种子”及修饰语“好的”，用现代汉语自然表达，不限定具体谷种。
- source_word: ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: 稗子
  rationale: 该希腊语借词指混生于麦田、幼苗期难与麦子区分的有害草类；“稗子”符合汉语圣经传统且比泛称“杂草”更具田间语境。正文以“一株／那株”体现前段单数，末句用“稗子／它们”体现原文转为复数。
- source_word: ⲕⲱ ... ⲉϩⲱⲱⲗⲉ
  choice: 许……去拔
  rationale: ⲕⲱ 配不定式在此表示允许，ϩⲱⲗⲉ 表示拔除。
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: 显露出来
  rationale: 保留“变得明显、显现”的语义，表明到收割时稗子可被辨认。
- source_word: ⲡⲱϩⲥ
  choice: 收割
  rationale: 该词意为收割或收获；“收割的日子”准确对应田间情境。
theological_decisions:
- issue: “父的国”的表达
  choice: 父的国
  alternative: 父的王国／天父的国
  rationale: “父的国”最直接对应科普特语，既不补入原文没有的“天”，也不以“王国”强化政治领土色彩。
- issue: 稗子单复数的变化
  choice: 前段用“一株／那株”，末段转为复数指代
  alternative: 全文一律用复数“稗子”
  rationale: 原文先用单数不定形式，继而用单数定指，最后转为复数；译文尽可能保留这一不寻常的数变化，不把它整齐化。
- issue: 末句不定主语的处理
  choice: 人们会把它们拔出，烧掉
  alternative: 它们会被拔出烧掉
  rationale: 原文形式上是带不定主语的主动句，功能近似被动；用“人们”保留动作执行者未指明的特点，同时使现代汉语顺畅。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。引语层次以中文引号清楚区分；避免过度古雅的“恐怕”“容让”等措辞。正文只设置一个必要脚注，标记[a]已置于相关词后。
