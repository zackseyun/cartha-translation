base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/079.yaml
  text: A woman said to him in the crowd[a], “Blessed is the womb that bore you, and the breasts that nursed you.” He said to her, “Blessed are those who have heard the word of the Father and have kept it in truth; for days will come when you will say, ‘Blessed is the womb that has not conceived[e][d][c][b], and the breasts that have not given milk.’”
translation:
  language: zh_hans
  text: 人群中有一个女人对他说：“那曾怀着你、把你生下来的母腹，和曾使你吃奶的乳房，有福了[a]！”他对她说：“听过父的话，并在真理中持守这话的人有福了[b]！因为日子将到，那时你们要说：‘未曾怀胎的母腹[e]和未曾使婴儿吃奶的乳房有福了！’”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特文直译为“你的乳房”；这是指曾给你哺乳的乳房，正文依汉语习惯译作“曾使你吃奶的乳房”。
    reason: dialect_note
  - marker: b
    text: “在真理中持守这话”也可译作“真实地遵守这话”或“在真理中守护这话”。
    reason: lexical_alternative
  - marker: c
    text: 手抄本中“女人”“母腹”“乳房”“哺育”等词有少量字母残损或抄写修正，但不影响本句的基本意思。
    reason: lacuna_or_restoration
  - marker: d
    text: 参路加福音11:27—28（女人对母腹和乳房的祝福及耶稣的回答）和23:29（“不能生育的……未曾哺乳的”有福）。
    reason: cross_reference
  - marker: e
    text: 这里的动词特指怀孕、受孕；也可按汉语语境译作“未曾受孕”。它不同于前文表示怀着、把人生下来的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲥϩⲓⲙⲉ
  choice: 一个女人
  rationale: 不定冠词ⲟⲩ-表明这是人群中未特指的一名女子。
- source_word: ⲙⲏⲏϣⲉ
  choice: 人群
  rationale: 准确表达“众人、聚集的人群”，且符合现代汉语叙事习惯。
- source_word: ⲡϩⲏ
  choice: 母腹
  rationale: 该词可泛指腹部，但在怀胎语境中指子宫或孕育生命的腹中；“母腹”自然、庄重，也保留身体意象。
- source_word: ϥⲓ ϩⲁ
  choice: 怀过
  rationale: 此结构在这里表示为某人怀胎、生育；“怀过你的母腹”既自然，又不把后文表示“受孕”的不同动词混同。
- source_word: ⲓⲃⲉ
  choice: 乳房
  rationale: 原词为乳房，且上下文明确涉及哺乳；不弱化为较含蓄的“胸怀”。
- source_word: ⲥⲁⲛⲟⲩϣ
  choice: 哺育过
  rationale: 原动词表示使婴儿吃奶、哺乳；此处用“哺育过”搭配“乳房”，符合现代汉语表达。
- source_word: ⲉⲓⲁⲧ
  choice: 有福了
  rationale: 沿用祝福宣告的庄重表达，比“快乐”更能保留格言体与宗教语境。
- source_word: ⲥⲱⲧⲙ
  choice: 听过
  rationale: 原文关系式完成时表示已经发生的聆听；“听过”保留其完成意味。
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: 话
  rationale: 希腊借词λόγος在这里可指话语或信息；“父的话”自然清楚，并避免把此处过度术语化。
- source_word: ⲡⲉⲓⲱⲧ
  choice: 父
  rationale: 保留原文称号，不擅自增补“上帝”等解释。
- source_word: ϩⲁⲣⲉϩ ⲉⲣⲟϥ
  choice: 持守这话
  rationale: ϩⲁⲣⲉϩ兼有保守、遵守之意；“持守”保留两方面含义，并明确代词所指。
- source_word: ϩⲛ ⲟⲩⲙⲉ
  choice: 在真理中
  rationale: 按介词短语直译，保留可能表示真实、忠实或真理领域的开放性，不简化为单一副词“真正地”。
- source_word: ⲱ (in ⲙ̄ⲡⲥⲱ)
  choice: 受孕
  rationale: 该动词具体表示怀孕、受孕，与前文表示怀胎生育的ϥⲓ ϩⲁ有所区别。
- source_word: ϯ ⲉⲣⲱⲧⲉ
  choice: 哺乳
  rationale: 原短语直指“给奶”；“哺乳”简洁准确，并与前文的哺育意象呼应。
theological_decisions:
- issue: 肉身母亲的福与听从父之话者的福之间的关系
  choice: 保留耶稣回答中的直接并置，不加入“反而”“更有福”等比较词
  alternative: 译作“然而，更有福的是……”
  rationale: 科普特文本宣告后者有福，却没有明示比较级或否定前一祝福；增添比较关系会替原文消解张力。
- issue: 末后关于未受孕、未哺乳者有福的宣告
  choice: 照录其未来指向和反常祝福，不说明具体灾难或末世事件
  alternative: 在正文中解释为某场灾祸或末世审判
  rationale: 原文只说“日子将到”，没有在本句中指明历史事件；应保留其开放而严峻的语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留两次“有福了”的格言式呼应，以“父的话”避免不必要的神学术语化；不增添原文没有的比较级、因果解释或具体末世背景。
