review_pass:
  verdict: revise
  source_fidelity: 首句将ⲡϩⲏ（母腹）译为“怀过你的母腹”造成主客关系倒置：按汉语字面，是“你怀过母腹”，不能表达“母腹怀着／生下你”。此外，ⲥⲁⲛⲟⲩϣ的哺乳动作由乳房作主语时，需以自然的汉语方式表达。末句ⲙⲡⲥⲱ所指“未曾怀胎／受孕”应与前句“怀着并生下”所用的不同表达保持区别。
  naturalness: 除上述关键搭配外，整体语序、庄重格言体和“日子将到”的未来警告语气均自然。修订以“使你吃奶”处理乳房的转喻主语，既清楚也符合现代汉语。
  terminology: “有福”“父”“真理”“持守”均可保留；不应加上“更有福”或“反而”等原文未明说的比较关系。“母腹”适合本段的庄重身体意象；“怀胎”适合末句的受孕义。
  issues:
  - severity: high
    issue: “怀过你的母腹”主客关系倒置，且没有表达生下你的意思。
    rationale: 原文ⲡϩⲏ ... ⲉⲧⲉⲣⲉ...ϥⲓ ϩⲁ ⲛⲧⲟⲕ指“那怀着／生下你的母腹”，而非“你怀过母腹”。
  - severity: medium
    issue: “哺育过你的乳房”搭配不够自然，也弱化了使婴儿吃奶的具体动作。
