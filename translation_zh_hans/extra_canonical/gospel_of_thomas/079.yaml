revisions:
- from: 人群中有一个女人对他说：“怀过你的母腹和哺育过你的乳房有福了[a]！”他对她说：“听过父的话，并在真理中持守这话的人有福了[b]！因为日子将到，那时你们要说：‘未曾受孕的母腹[e]和未曾哺乳的乳房有福了！’”[c][d]
  to: 人群中有一个女人对他说：“那曾怀着你、把你生下来的母腹，和曾使你吃奶的乳房，有福了[a]！”他对她说：“听过父的话，并在真理中持守这话的人有福了[b]！因为日子将到，那时你们要说：‘未曾怀胎的母腹[e]和未曾使婴儿吃奶的乳房有福了！’”[c][d]
  rationale: 修订仅纠正首句母腹与“你”的语法关系，并以自然汉语明确乳房的哺乳功能；末句采用“未曾怀胎”保留ⲱ“受孕”的词义，且不将之与前文的生育表达混同。脚注同步消除指代和引文概括的不准确处，所有原有锚点均保留并按原位置对应。
