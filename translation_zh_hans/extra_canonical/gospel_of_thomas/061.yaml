base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
translation:
  language: zh_hans
  text: '耶稣说：“两个人将安歇在一张卧榻上；一个将死，一个将活。”


    撒罗米说：“人哪，你是谁？你仿佛从一而来[a]，竟登上我的卧榻，又吃我桌上的食物。”


    耶稣对她说：“我就是那从同等者[b]而来的。我从我父所有之物中受赐。”


    [撒罗米说：]“我是你的门徒。”[c]


    [耶稣说：]“因此我说：人若变为空虚的[d]，就会充满光；人若变为分裂的，就会充满黑暗。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“仿佛从一而来”。“一”可指“某一位”，也可能带有“独一”或“合一”的意味；原文没有进一步说明。
    reason: lexical_alternative
  - marker: b
    text: 科普特语ⲡⲉⲧϣⲏϣ可译为“同等的那一位”或“同等者”，也可较非人格化地理解为“同等之物”。
    reason: theological_note
  - marker: c
    text: 原文在最后两句话前没有注明说话者；方括号中的“撒罗米说”和“耶稣说”是根据对话脉络补出的。
    reason: textual_clarity
  - marker: d
    text: 抄本作ϣⲏϥ，意为“空的”或“荒凉的”，并与后面的“充满”形成反差。有些学者校改为ϣⲏϣ，译作“同等的”，使它与前文“同等者”呼应，并与“分裂的”相对。
    reason: textual_variant
lexical_decisions:
- source_word: ϭⲗⲟϭ
  choice: 卧榻
  rationale: 兼顾可供躺卧、安歇和用餐的榻，且能在首句与撒罗米的话中保持同一意象。
- source_word: ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛ̄ⲟⲩⲁ
  choice: 仿佛从一而来
  rationale: 尽量保留原文“如同／仿佛从一”的简约和歧义；“一”既可被理解为某一位，也可能带有合一或独一的意味。
- source_word: ⲡⲉⲧϣⲏϣ
  choice: 那同等者
  rationale: 按ϣⲓϣ“相等、同等”的词义翻译其名词化形式，不擅自改作“未分者”或“同一者”。
- source_word: ⲛⲁⲡⲁⲉⲓⲱⲧ
  choice: 我父所有之物
  rationale: 保留复数领属结构，表达“属于我父的事物／我父所有之物”，避免简化成“从我父而来”。
- source_word: ϣⲏϥ
  choice: 空的
  rationale: 保留抄本所见ϣⲏϥ（空、荒凉）的读法，并与随后“充满”形成反差。
- source_word: ⲡⲏϣ
  choice: 分裂的
  rationale: 这是ⲡⲱϣ“分开、分裂”的状态形式，并非数词“二”。
theological_decisions:
- issue: ⲡⲉⲧϣⲏϣ所指的性质
  choice: 那同等者
  alternative: 那同一者／那未分者／同等之境
  rationale: 原词直接表达“同等、相等”；译文保留其人格化或非人格化均有可能的张力，不将其明确解释为某种特定神学本体。
- issue: 末段ϣⲏϥ是否校改为ϣⲏϣ
  choice: 按抄本译作“空的”
  alternative: 依校改译作“同等的”
  rationale: 抄本读法可成立，并与“充满”形成文字上的悖论；校改虽可与前文“同等者”呼应并和“分裂”直接对照，但不应静默取代现存文本。
- issue: 末两句的说话者
  choice: 以方括号补出撒罗米和耶稣
  alternative: 不补说话者，连续直译
  rationale: 原文没有这两个引语标签；补出仅为帮助读者辨认对话，同时用方括号及脚注明确其属于编辑性补充。
- issue: “从一而来”的解释
  choice: 保留“一”的开放性
  alternative: 译作“从某一位而来”或“从那独一者而来”
  rationale: 原文既未明确泛指“某人”，也未明确将“一”定为神学称号，因此不在正文中消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“卧榻”保留古代躺卧与宴饮场景；“同等者”虽略显陌生，却能贴近原词并避免过度神学化。“成为空的／成为分裂的”刻意保留原文简洁而悖论性的表达。
