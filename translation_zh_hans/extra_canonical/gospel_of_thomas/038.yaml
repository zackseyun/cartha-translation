base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/038.yaml
  text: Jesus said[a], “Many times you have desired to hear these words that I am saying to you, and you have no other from whom to hear them. There will be days when you will seek me[d][c][b], and you will not find me.”
translation:
  language: zh_hans
  text: 耶稣说：“你们曾多次渴望听这番话[a]，就是我正对你们说的这些话；你们也没有别人，可以从他那里听到这些话[b]。将来会有一些日子[c]，那时你们会寻找我[d]，却找不到我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特语先用单数“这句话／这番话”，随后却改用复数代词“它们”。译文以“这番话”接“这些话”，保留这种数的转换。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“你们没有另一个人可以从他那里听到它们”；“他”回指“别人”。
    reason: dialect_note
  - marker: c
    text: 原文直译近似“会有一些日子成为现实”，是科普特语表达未来存在的一种句式。
    reason: cultural_note
  - marker: d
    text: 参见《约翰福音》7:34；8:21；13:33，其中也有寻找却找不到的相似主题；此处仍按《多马福音》自身的措辞翻译。
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲁϩ ⲛⲥⲟⲡ
  choice: 多次
  rationale: 这是科普特语中表示“许多次、屡次”的常用表达；“多次”保留了原文直接而简洁的语气。
- source_word: ⲣⲉⲡⲓⲑⲩⲙⲉⲓ
  choice: 渴望
  rationale: 该希腊语借词含“想要、渴求”之意；“渴望”自然表达听众强烈的愿望，又不额外引入顺服等解释。
- source_word: ⲉⲥⲱⲧⲙ
  choice: 听
  rationale: 采用其基本听觉义，不扩展为“听从”或“领受”，以免加入原文未明说的含义。
- source_word: ⲡⲉⲓϣⲁϫⲉ ⲡⲁⲓ（后接复数代词 ⲛⲛⲧⲟⲟⲩ）
  choice: 这番话／这些话
  rationale: 原文先用单数“这句话／这番话”，随后以复数代词回指。中文先译“这番话”、后译“这些话”，既自然，也显出原文的数变化。
- source_word: ⲉⲧⲉⲣⲉ … ϫⲱ ⲛⲛⲧⲟⲟⲩ ⲛⲁⲛⲧⲱⲧⲛ
  choice: 我现在对你们说的
  rationale: 原结构具有持续、正在进行的意味；“现在……说”保留话语发生于当下的临场感。
- source_word: ⲙⲛⲧⲁⲛⲧⲱⲧⲛ ⲕⲉⲟⲩⲁ
  choice: 你们也没有别人
  rationale: 依照否定领有结构直译其意义，保留“另一个人／别人”的不定指称。
- source_word: ⲛ̄ⲧⲟϥ
  choice: 可从他那里
  rationale: 该代词承接“别人”，表达话语来源；译为“从他那里”比直接改写成“听谁讲”更贴近原文结构。
- source_word: ⲟⲩⲛ ϩⲉⲛϩⲟⲟⲩ ⲛⲁϣⲱⲡⲉ
  choice: 将来会有一些日子
  rationale: 保留未来存在句以及不定复数“日子”的形式，不将其过度压缩为单一时点“有一天”。
- source_word: ⲛⲧⲉ … ϣⲓⲛⲉ ⲛⲥⲁⲁⲛⲟⲕ
  choice: 那时你们会寻找我
  rationale: 将时间从句自然地译成现代汉语，并保留“寻找／寻求我”的语义开放性。
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ ⲁⲛ ⲉⲁⲛⲟⲕ
  choice: 却找不到我
  rationale: “找到”是该动词在此处最直接的意义；“却”清楚呈现寻找与未找到之间的转折。
theological_decisions:
- issue: “寻找我”的含义
  choice: 直译为“寻找我”，不说明是身体上的寻找、属灵寻求或末世性的寻求
  alternative: 译作“寻求我”并赋予明确的宗教含义
  rationale: 原文并未限定寻找的性质；保留这一开放性，可避免以特定神学框架消解文本的张力。
- issue: 话语来源的排他性
  choice: 保留“没有别人可从他那里听到”这一陈述
  alternative: 解释为只有耶稣才有独一启示或救赎知识
  rationale: 文本强调听众没有另一个来源，却没有进一步界定这句话的教义范围，因此不补入排他性救恩论或特定启示论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式尽量保持原文简短直接的宣告语气；“将来会有一些日子”略带书面色彩，以保存原文不定复数和未来存在句，而不简化为“有一天”。
