base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/074.yaml
  text: He said[1], "Lord, there are many around the drinking trough[3][2], but there is nothing in the well."
translation:
  language: zh_hans
  text: 他说[a]：“主啊，蓄水池周围有许多人，井中却什么也没有。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他说：‘主啊……’”。这里没有说明是谁说话，也没有说明“主”指谁；也有人认为这句话可能承接上一则语录。
    reason: 保留说话者与受话者身份的原文歧义。
  - marker: b
    text: “什么也没有”所译的科普特词也可指“一个人也没有”；因此末句也可译作“井中却一个人也没有”。“蓄水池”和“井”对应两个不同的科普特词，但两词的词义范围都有“井”或“蓄水设施”之义。
    reason: 说明否定代词的两种可能指向，以及两个设施名称虽有区分但语义范围重叠。
lexical_decisions:
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: 主啊
  rationale: 定冠词在此可用于呼格；译作“主啊”保留直接称呼，同时不判定说话者与受话者的身份。
- source_word: ⲡϫⲱⲧⲉ / ⲧϫⲱⲧⲉ
  choice: 井槽
  rationale: 该词可指井或蓄水池。采用“井槽”以表达众人围聚的取水设施，并与后文的“井”区别；其确切设施类型仍不完全确定。
- source_word: ⲡϣⲱⲛⲉ / ⲧϣⲱⲛⲉ
  choice: 井
  rationale: 该词可指井、蓄水池或坑；在取水语境中，“井”最自然，也与前面的外围聚集形成空间对照。
- source_word: ⲗⲁⲁⲩ
  choice: 什么也没有
  rationale: 在否定存在句中既可表示“什么也没有”，也可表示“一个人也没有”。正文采用较自然的中性读法，并在脚注保留另一可能。
theological_decisions:
- issue: 说话者与受话者的身份
  choice: 他说：“主啊……”
  alternative: “主说……”；或明确为耶稣向上帝说、门徒向耶稣说
  rationale: 科普特文本的句法是“他说：‘主……’”，而不是明确的“主说”。因此不补定说话者，也不决定“主”所指是谁，以保留原文的歧义。
- issue: 井中缺少的是物还是人
  choice: 井里却什么也没有
  alternative: 井里却一个人也没有
  rationale: ⲗⲁⲁⲩ 在否定结构中可指物也可指人。取水场景使“什么也没有”较顺，但“没有人”的隐喻读法在语法上成立，故列入脚注。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“井槽”略带具体物象，用来避免把相邻的两个不同科普特词都译成“井”。脚注标记置于正文句末，涵盖全句的两项歧义。
