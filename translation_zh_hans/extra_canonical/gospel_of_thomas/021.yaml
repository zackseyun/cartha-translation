  text: 'Mary said to Jesus[a], "Whom are your disciples like?"


    He said, "They are like little children who have settled in a field that is not theirs. When the owners of the field come, they will say, ''Leave our field to us.'' They strip naked before them in order to leave it to them and give their field to them.


    "Therefore I say: If the master of the house knows that the thief is coming, he will keep watch before he comes and will not let him dig into his house of his kingdom to carry away his goods.


    "But you, keep watch against the world. Gird yourselves upon your loins with great power, so that the robbers will not find a way to come to you. Because the advantage you expect will be found.


    "Let there be among you a person of understanding. When the fruit ripened, he came quickly, his sickle in his hand; he harvested it. Whoever has ears to hear[b][c], let him hear."'
translation:
  language: zh_hans
  text: '马利亚对耶稣说：“你的门徒像谁呢？”


    他说：“他们像一些住在不属于他们的田里的小孩子。田的主人来的时候，会对他们说：‘把我们的田还给我们。’他们就在田主面前脱得赤身露体[a]，好把那田留给他们，并把田交给他们。


    “所以我说：如果家主知道贼要来，他就会在贼来到以前警醒，不让贼挖穿他王国的房屋[b]，搬走他的财物。


    “至于你们，要面对这世界警醒。要以大能束紧腰带，免得强盗找到通向你们的路；因为你们所等候的需要[c]，必会被寻见。


    “你们中间要有一个明白事理的人。果子一成熟，他就赶快来，手里拿着镰刀，把果子收割了。有耳可听的，就应当听。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 科普特语明确说他们“赤身露体”。这里保留这一意象，但原句本身没有说明赤裸所象征的具体含义。
    reason: 说明容易被弱化或被过度神学解释的源语意象。
  - marker: b
    text: 原文直译近于“挖进他王国的房屋”。这一表达不同于相似的对观福音比喻中较简单的“他的房屋”，其确切关系仍不明确。
    reason: 保存独特措辞及其语法、神学张力，避免协调文本。
  - marker: c
    text: 这里的词是希腊语借词 χρεία，可表示“需要、必要、用处、益处”，有时也可在语境中指“困境”或“难处”；本句确切所指有争议。
    reason: 交代关键多义词，并保留原文的语义不确定性。
lexical_decisions:
- source_word: ϭⲉⲗⲓⲧ
  choice: 住在
  rationale: 该词表示寄居、居住或落脚；“住在别人田里”在现代汉语中自然，也不额外断定长期定居。
- source_word: ⲕⲁⲕⲁϩⲏⲩ
  choice: 脱得赤身露体
  rationale: 明确保留“赤裸”的源语意象；结合动作语境译为“脱得”，而不是误把后面的“在他们面前”理解为衣物。
- source_word: ϣⲟϫⲧ
  choice: 挖穿
  rationale: 兼顾“挖掘”与盗贼破墙闯入的语境，比单译“挖”更清楚，同时仍保留源语的具体动作。
- source_word: ⲭⲣⲉⲓⲁ
  choice: 需要
  rationale: 希腊借词 χρεία 可指需要、必要、用处或困境；正文采用基本义“需要”，以脚注保留语境中的其他可能。
- source_word: ⲡⲱϩ
  choice: 成熟
  rationale: 此处主语为果子，表示达到成熟阶段；“成熟”是自然准确的汉语搭配。
- source_word: ϩⲁⲥ-
  choice: 收割
  rationale: 表示收割、收获；与镰刀和成熟果子的意象相合。
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: 王国
  rationale: 这是科普特语中表示“王国”的标准词，也是《多马福音》的重要神学用语，不弱化为“领域”或“产业”。
- source_word: ⲣⲱⲙⲉ ⲛⲉⲡⲓⲥⲧⲏⲙⲱⲛ
  choice: 明白事理的人
  rationale: 希腊借词所构成的短语指有知识、明白或有见识的人；此译比“知识分子”更符合寓言语境。
theological_decisions:
- issue: 是否与对观福音的家主比喻协调
  choice: 他王国的房屋
  alternative: 他的房屋
  rationale: 科普特文本确有“他的房屋”和“他的王国”相连的独特表达；正文保留其突兀性，不按《马太福音》24:43或《路加福音》12:39简化。
- issue: 赤裸意象的处理
  choice: 脱得赤身露体
  alternative: 脱下衣服
  rationale: 保留原文明确的赤裸状态，但不在正文中把它解释为某种特定的救赎论、身体观或返璞归真教义。
- issue: 对世界警醒的关系
  choice: 面对这世界警醒
  alternative: 提防这世界
  rationale: 源语介词关系可表达针对、面对或防备；采用较少解释性的说法，避免预先把“世界”完全定性为敌对力量。
- issue: χρεία在劝诫中的含义
  choice: 需要
  alternative: 困难／益处／必要之事
  rationale: 该词在此句的确切语义有争议；正文选用范围较宽的基本义，并以脚注保留其他可能，不将其神学化为某种确定的末世事件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。对话保持简洁；寓言中的田主、家主、贼、强盗、镰刀等具体意象均予保留。对“他王国的房屋”和“你们所等候的需要”等不寻常表达不作顺滑改写，以保存原文的真实含混与张力。
