  language: zh_hans
  text: '《约翰密典》——卑劣的灵


    1 我却问道：“主啊，卑劣的灵从哪里来？”


    2 他对我说：“那满有怜悯的母父、以各种形态显现的圣灵、怜悯并体恤你们众人的那一位——也就是光明天意的映照——使完美族类的种子、这族类的理智，以及‘人’的永恒之光兴起。


    3 首席执政者发觉，他们在高处比他更高，理智也胜过他，就想掌握他们的意向；他却不知道，他们的理智胜过他，他根本无法掌握他们。


    4 他便同自己的执政者，也就是他的众权势，共谋诡计，一起与索菲亚行淫；他们由此生下了苦涩的命运——最后那不稳定的锁链。它本性摇摆不定，却比那与诸神、天使、鬼魔以及直到今日的一切世代行淫的女子更持久、更强大。[a] 因为一切过犯、不义、亵渎、遗忘与无知的锁链、一切严酷的命令及其严重的过犯，还有压倒人的恐惧，都从这命运而出。


    5 这样，一切受造之物也都瞎了眼，不能认识那位在万有之上的上帝。由于遗忘的锁链，他们的罪被遮蔽；因为他们被尺度、时期和时刻束缚，而命运正是统辖万有的主宰。[b]


    6 后来，他为一切因他而发生的事懊悔。


    7 这一次，他密谋降下洪水，淹没人类的产物；但光明天意的伟大者预先告诉了挪亚。挪亚便向人类子孙的一切种子宣讲，那些与他疏远的人却不听从他。


    8 事情并不像摩西所说的：‘他们藏在方舟里。’其实，他们藏在一个地方——不只是挪亚，还有许多出自不动族类的人。


    9 他们进入一个地方，藏身于明亮的云中。挪亚知道自己的权柄，那属光的女子也与他同行。[c]


    10 她曾照耀他们，因为那执政者已经使黑暗笼罩全地，又同自己的众权势共谋诡计。


    11 他差遣自己的天使到人类的女子那里，要为自己娶一些女子，生养后代供他们享乐；但起初他们没有得逞。


    12 他们没有成功，就再次聚集，一同共谋诡计。


    13 他们造出一个与那曾降下的灵相似的卑劣之灵，要借此玷污众灵魂。那些天使又把自己的形貌变成那些女子配偶的形貌，使她们充满黑暗之灵；这黑暗之灵是他们为女子把邪恶混合而成的。[d]


    14 他们拿出金银，也拿铜铁和各种金属制成的物件作为礼物。他们用层出不穷的诡计迷惑跟随自己的人，使这些人陷入极大的患难。


    15 这些人日渐衰老，却没有享受任何乐趣。


    16 他们既没有发现真理，也不认识真上帝，就这样死去了。于是，一切受造之物都落入长久的奴役，从世界奠基之时一直延续到如今。


    17 他们还挑选女子，照着自己灵的形貌，从黑暗中生下儿女。他们封闭自己的心，借着卑劣之灵的刚硬使自己刚硬，直到如今。”


    [a] 第4节原文见证的句法和代词关系含混；这里保留“命运”与“女子”的对比，不断定“女子”究竟专指索菲亚还是另有所指。

    [b] “统辖万有的主宰”在句法上最可能指前文的“命运”，但原文见证中的代词所指并非完全明确。

    [c] 第9节“他”可能指挪亚，也可能指首席执政者；本译文按较近的叙事对象理解为挪亚，但保留脚注说明。

    [d] 第13节若干复数代词所指含混；本译文按天使为女子调制黑暗之灵来处理，仍有其他句法理解的可能。'
