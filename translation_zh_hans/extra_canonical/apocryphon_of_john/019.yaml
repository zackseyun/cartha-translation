  register: 采用现代、庄重而可诵读的标准普通话；保留诺斯替宇宙论中的专门称谓，但尽量用透明词汇表达。删除仅属抄本分页的«28»—«30»。本稿以所提供的公共领域英文见证为直接起草依据；科普特语手稿的直接核校尚待完成，因此对关键代词和句法歧义以脚注公开标示。
