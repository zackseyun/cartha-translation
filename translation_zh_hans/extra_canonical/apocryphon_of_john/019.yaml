lexical_decisions:
- source_word: vile spirit
  choice: 卑劣的灵／卑劣之灵
  rationale: “卑劣”既传达道德上的恶劣，也避免将其窄化为现代汉语中偏重卫生或粗俗意味的“污秽”；在定名处用“卑劣的灵”，作修饰语时用“卑劣之灵”。
- source_word: Mother-Father
  choice: 母父
  rationale: 保留原见证刻意并置母性与父性的复合称谓，不改写为较熟悉但会消除张力的“父母”。
- source_word: Reflection of Radiant Providence
  choice: 光明天意的映照
  rationale: “映照”保留 Reflection 的反映、显现意味；“天意”表达 Providence 的安排与眷顾，但不强行套入后期教义术语。
- source_word: chief archon
  choice: 首席执政者
  rationale: “执政者”是 archon 的透明直译，也适合本文宇宙论语境；“首席”表达其居首地位。
- source_word: Sophia
  choice: 索菲亚
  rationale: 作为拟人化的专名音译，避免直接译成“智慧”而令普通读者误以为只是抽象品质。
- source_word: Destiny
  choice: 命运
  rationale: 保留其拟人化宇宙力量的性质，并以语境中的“主宰”说明其统治功能。
- source_word: unmoving race
  choice: 不动族类
  rationale: 保留该群体不受动摇、不被移动的专门称谓，不释义为“坚定的人”，以免消除文本的宇宙论分类。
- source_word: seed
  choice: 种子／后代
  rationale: 涉及完美族类和人类整体时保留象征性的“种子”；明确指生育结果时用自然汉语“后代”，兼顾术语关联与可读性。
- source_word: the Man
  choice: ‘人’
  rationale: 加引号显示这里可能是宇宙论中的称号或原型性存在，而非泛指某个男人。
theological_decisions:
- issue: “母父”与圣灵的关系
  choice: 依原见证并列保留“母父、以各种形态显现的圣灵、……那一位”的复杂同位结构
  alternative: 把诸称谓拆成多个不同主体，或统一解释为一个传统三一位格
  rationale: 现有英文见证支持同位性，但科普特原文复核尚待进行；不应先行导入宗派化本体论。
- issue: 第4节命运、索菲亚与行淫者之间的关系
  choice: 保留命运由执政势力与索菲亚行淫而生，以及命运比“那女子”更强的张力
  alternative: 明确断定“那女子”就是索菲亚，或改写成命运强过诸神天使鬼魔
  rationale: 见证句法高度含混，明确化会超出证据。
- issue: 洪水叙事与摩西记载的冲突
  choice: 直译文本对摩西说法的否定
  alternative: 将其弱化为寓意性补充或协调为方舟内另有光云
  rationale: 该冲突是本文神学立场的一部分，翻译不应消解。
- issue: 第6节懊悔者的身份
  choice: 保留单数“他”，顺接首席执政者
  alternative: 明确写成上帝或另一更高存在
  rationale: 上下文最自然指首席执政者，但原语复核尚待完成，故不添加专名。
- issue: 命运作为普世主宰
  choice: 正文将代词理解为命运，并以脚注注明不确定性
  alternative: 理解为时间、锁链或首席执政者
  rationale: 前文拟人化的“命运”及其束缚功能最切合，但代词指向仍有歧义。
