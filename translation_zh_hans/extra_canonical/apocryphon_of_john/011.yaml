review_pass:
  verdict: revise
  source_fidelity: 本稿总体忠实于所提供的英语见证，并谨慎保留方括号、‹是›及不透明记号的文本状态；由于尚未直接复核科普特文，判断为基于该见证的暂定审校。第1节将“five over the deep of the abyss”明确扩展为另设“五位”，并无见证依据，宜改为保留其与七位王及诸穹苍之间关系的含混。第15节的方括号范围未按见证保留。第18节将未释编辑记号{move:3}汉化，损失了应保留的原状记号。
  naturalness: 行文整体为自然、庄重的现代书面汉语。第5节“四……有一条七头[龙]的脸”不合汉语习惯，改作“有一张七头[龙]的面孔”。第11节以“连同”表达配对关系，比反复使用“同在”更清楚。
  terminology: “执政者／能力／权柄”“穹苍”“永世”“撒拉弗”及专名音译均前后一致，且未作教义化增释。“忌邪”与作为能力名的“嫉妒”保留了见证中的词汇关联与语境差别。
  issues:
  - severity: high
    issue: 第1节无依据地增加“五位”王。
    rationale: 见证说设立“七位王”，随后提及“深渊之上的五个”；其句法和所指虽不够明晰，却没有说另设五位王。译文应保留这一不确定关系。
