translation:
  language: zh_hans
  text: '1. 就在那时，[当我正思索这些事的时候]，看哪，[诸天敞开了，]天底下的[整个]受造界都发出光来，[大地]也震动了。


    2. [我害怕起来；看哪，我]看见[光中有一个孩子站在]我身旁。


    3. 我注视着[他，他就变得]像一位老人；随后，他又[改变了]形貌，变得像一个儿子[a]。


    4. 在我面前的[并不是几个不同的存在]，而是[光中]有一个显出多种形貌的[形象]；[那些相貌]彼此交替显现，[那]形象共有三种形貌。


    5. 他问我：“约翰，约翰，你为什么惊奇？为什么[害怕]？


    6. 难道你们都不认识这个形象吗？


    7. 我是说，不要[灰心胆怯]。


    8. 我就是那位始终[与你们众人同在]的。


    9. 我[是父]，我是母，我是子。


    10. 我是纯洁无玷污的那一位。


    11. [如今我来，是要告诉你]现在之事、[过去之事]和将要[发生的事]，使你[明白]尚未显明的事[和已经显明的事，并把]“完美之人”的[坚定不移的族类]告诉你。


    12. [所以，抬起]你的[脸来，好让]你[领受]我今天[要告诉你的]事，并把这些事[传给与你同作]“完美之人”那[坚定不移之]族类的灵[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有英文见证在“儿子”后带有注记标号，但所给材料没有附上注释内容；底层科普特语尚待核校。因此此处暂按“儿子”译出，也可能只是指“年轻人”。
    reason: 保留见证中 son 的词义与年龄称谓之间的真实歧义，并说明源语复核状态。
  - marker: b
    text: “与你同作……族类的灵”所依据的英文见证句法不够明确，也可理解为“你的同伴——那些属于……族类的灵”。
    reason: 标明末句 companion spirits 与“族类”之间可能存在的不同句法连接。
lexical_decisions:
- source_word: glowed
  choice: 发出光来
  rationale: 自然表达整个受造界被光照亮或焕发光辉的景象，同时不额外判定光的来源。
- source_word: appearance
  choice: 形象
  rationale: 保留所见显现既是一个整体、又具有多种形貌的张力；避免译成“本体”而作本体论判断。
- source_word: forms / resemblances
  choice: 形貌／相貌
  rationale: 分别传达外在形态与相似样貌，并维持三种形貌彼此显现的叙述。
- source_word: unpolluted and untainted
  choice: 纯洁无玷污
  rationale: 以庄重而通顺的中文保留两重洁净用语，不将其专门化为礼仪或道德术语。
- source_word: unmoving race
  choice: 坚定不移的族类
  rationale: 比字面“不可移动的族类”更符合现代汉语，同时保留其稳定、不动摇的特征。
- source_word: Perfect Man
  choice: “完美之人”
  rationale: 直译关键称号并加引号标示其术语性质；不预先把它等同于某一特定神学人物或群体。
theological_decisions:
- issue: 一个显现与三种形貌的关系
  choice: 译为“并不是几个不同的存在……一个……形象……共有三种形貌”
  alternative: 译作“不是不同的实体……三个位格”
  rationale: 保留见证文本对单一显现及多重形貌的陈述，不引入后期神学术语“位格”，也不把文本的否定对象过度哲学化。
- issue: “我是父，我是母，我是子”
  choice: 按三重自称直译
  alternative: 将“母”解释成圣灵或智慧
  rationale: 原见证明确并列父、母、子；正文不应以宗派性或推测性的对应关系消解其张力。
- issue: “完美之人”的族类
  choice: 保留称号及群体语言
  alternative: 译成“完全人的后裔”或“完美人类”
  rationale: “族类”可兼容血统、类别或属灵群体等含义；“完美之人”作为称号保留原文可能的专名性质。
- issue: 末句 companion spirits 的句法关系
  choice: 译作“与你同作……族类的灵”并加注说明
  alternative: 译作“你的同伴，那些灵”
  rationale: 现有英文见证句法有歧义，正文采用较连贯的一种理解，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。方括号严格保留见证文本中补足或重建的内容；未擅自补全残缺处。删除了打断正文的手稿页码“«2»”。由于科普特语源语审查尚未完成，本稿以所给公共领域英文见证为临时校译依据，避免作超出材料的确定性判断。
