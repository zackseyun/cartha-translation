review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实于所提供的英语见证，且对技术性群体称谓保持审慎。不过，“在你耳中”虽贴近字面，却不是现代汉语的自然说法；“传给”也稍弱化了 distribute 的分发／传布意味。书名《约翰秘传》未明确表达 According to John 的“据／所传”关系。
  naturalness: 正文庄重且总体通顺。将开头改为“我已在你亲耳听见时，为你的缘故把一切都讲完了”仍保留听觉意象，但比“在你耳中”自然。“与你同为灵者”略显生造，改为“与你相伴的诸灵”可保留 spirits 的复数和身份歧义。
  terminology: “救主”“奥秘”“不动族类”“阿们”均可保留。“不动族类”作为技术性称谓保留引号和脚注说明是合宜的。“封存保管”可更准确地译为“锁藏起来”，对应 locked away。
  issues:
  - severity: medium
    issue: “在你耳中”不符合现代标准汉语的惯用表达。
    rationale: 该表达机械对应 in your hearing，读者易误解为“在耳内”。须保留“听见”的意象，同时改为自然汉语。
  - severity: low
    issue: “暗中传给”未充分表达 distribute，且“与你同为灵者”措辞生硬。
    rationale: “秘密地分发给”较完整体现传布动作；“与你相伴的诸灵”保留 spirits 的复数及其身份不确定性，而不预设为人或特定教派。
  - severity: low
    issue: 书名《约翰秘传》未显出 According to John。
    rationale: 改作《约翰所传的秘文》可保留这是一篇归于／据约翰所传的秘密文字，而不额外作神学解释。
  revised_text: '“我已在你亲耳听见时，为你的缘故把一切都讲完了。我把这一切都告诉你，是要你把它们写下来，秘密地分发给与你相伴的诸灵，因为这就是‘不动族类’的奥秘。”[a]


    救主也把这些话托付给他，要他写下来并锁藏起来；又对他说：“凡拿这些话换取馈赠的，无论是食物、饮料、衣服，还是任何诸如此类的东西，都要受咒诅。”


    这些话也在奥秘中托付给了他。忽然，他从他面前消失了；他便到他的同伴门徒那里，把救主对他说的话告诉了他们。


    耶稣基督。阿们。


    《约翰所传的秘文》'
  revised_footnotes:
  - marker: a
    text: “与你相伴的诸灵”和“不动族类”均可能是本文的特殊称谓；由于科普特文原文复核尚待完成，这里保留其歧义，不作进一步解释。
    reason: 提示两个关键群体称谓在现有英语见证中的不确定性，避免中文译文造成过度定论。
  revision_rationale: 修订仅处理可安全判定的汉语自然度、动词语义和标题的归属关系：以“亲耳听见时”替代不自然的“在你耳中”；以“秘密地分发给”表达 distribute；以“诸灵”保留 spirits 的复数；以“锁藏起来”对应 locked away；并在书名中补足“According to John”的归属关系。删除原脚注 b，因为修订后的“他的同伴门徒”已直接而自然地保留 companion disciples 的关系，毋须额外制造歧义说明。
