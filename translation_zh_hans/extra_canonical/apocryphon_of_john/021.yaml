review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实反映所给英语见证的结语、嘱咐秘密传递、禁止以言语换取馈赠、救主消失及书名结语。个别措辞略超出或偏离见证：‘从他眼前消失’将‘vanished from him’具体化为视觉场景；‘报酬’偏向劳务报偿，未充分保留 gift 可指一般馈赠的范围。
  naturalness: 整体庄重流畅，但‘在你耳中’和‘与你同为灵者’在现代汉语中不够自然。前者可在不丧失亲授语境的前提下译为‘亲自向你’；后者宜以‘你的同伴诸灵’保留技术性、歧义性的原有措辞，并以注释说明。
  terminology: ‘救主’、‘奥秘’、‘不动族类’及独立的‘耶稣基督。阿们。’均可保留。书名《约翰秘传》可接受。将 gift 译为‘馈赠’比‘报酬’更准确，且与食物、饮料和衣服的列举相称。
  issues:
  - severity: medium
    issue: ‘以这些话换取报酬’
    rationale: 英语 witness 的 gift 是广义的‘礼物／馈赠’，下文列举实物；‘报酬’较易限定为劳动或服务的酬劳。
  - severity: low
    issue: ‘救主忽然从他眼前消失了’
    rationale: 见证仅称他‘从他那里消失’，并未明确说是从视野中消失；应避免补足视觉细节。
  - severity: low
    issue: ‘在你耳中’及‘与你同为灵者’的现代汉语可读性
    rationale: 前者是直译式搭配，后者容易被理解为‘和你一样是灵体的人’；可用更自然的措辞，同时以脚注保留 companion spirits 的身份歧义。
  revised_text: '“我已经亲自向你，为你的缘故把一切都讲完了；我把这一切都告诉你，是要你把它们写下来，暗中传给你的同伴诸灵，因为这就是‘不动族类’的奥秘。”[a]



