translation:
  language: zh_hans
  text: '“我已经在你耳中，为你的缘故把一切讲完了。我把这一切都告诉了你，是要你将它们写下来，暗中传给与你同为灵者，因为这就是‘不动族类’的奥秘。”[a]


    救主又把这些话托付给他，要他写下来，封存保管；救主对他说：“凡以这些话换取报酬的，无论所换的是食物、饮料、衣服，还是任何诸如此类的东西，都要受咒诅。”


    这些话也在奥秘中托付给了他。救主忽然从他眼前消失了；他便到同作门徒的人那里，把救主对他说的话告诉了他们。[b]


    耶稣基督。阿们。


    《约翰秘传》'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与你同为灵者”和“不动族类”均可能是本文的特殊称谓；由于科普特文原文复核尚待完成，这里保留其歧义，不作进一步解释。
    reason: 提示两个关键群体称谓在现有英译见证中的不确定性，避免中文译文造成过度定论。
  - marker: b
    text: “同作门徒的人”也可理解为“他的同伴门徒”。
    reason: 保留 companion disciples 在关系结构上的细微歧义。
lexical_decisions:
- source_word: in your hearing
  choice: 在你耳中
  rationale: 保留所据英译见证中略显特殊的听觉意象，不擅自化约为普通的“当面”或“亲耳听见”。
- source_word: companion spirits
  choice: 与你同为灵者
  rationale: 原见证措辞含义不够明确；此译避免生硬的“同伴之灵”，也不将其具体解释为某一教派群体。
- source_word: mystery
  choice: 奥秘
  rationale: 保留宗教语境中的隐秘启示意味，并与一般性的“秘密”有所区别。
- source_word: unmoving race
  choice: 不动族类
  rationale: 采用较形式对应的表达，保留这一群体称谓的特殊性，不解释成“坚定者”或“永恒种族”。
- source_word: keep them locked away
  choice: 封存保管
  rationale: 自然表达限制接触、妥善藏存之意，且不强行加入具体容器或地点。
- source_word: trade these sayings for a gift
  choice: 以这些话换取报酬
  rationale: “报酬”能统摄下文食物、饮料、衣服等实物回馈；“换取”保留交易和牟利的含义。
- source_word: The Secret Writing According to John
  choice: 《约翰秘传》
  rationale: “秘传”简洁体现归于约翰的秘密著作，并符合现代中文书名习惯。
theological_decisions:
- issue: “不动族类”的性质
  choice: 保留为带引号的特殊群体称谓，不作解释
  alternative: 译作“坚定不移的一族”或“永恒的族类”
  rationale: 所据见证本身保留了技术性和神学张力；意译会提前判定“不动”的伦理或本体含义。
- issue: “与你同为灵者”的身份
  choice: 采用宽泛而保留歧义的措辞
  alternative: 明确译为“属灵同伴”“同道”或“同伴诸灵”
  rationale: 在科普特文直接审校尚未完成时，不宜断定这是人的属灵同伴、无形灵体，还是特定群体称号。
- issue: “在奥秘中托付”的表达
  choice: 译作“在奥秘中托付”
  alternative: 译作“秘密地托付”
  rationale: 保留“奥秘”可能具有仪式性或启示性含义的空间，而不只理解为保密方式。
- issue: 末尾“耶稣基督。阿们。”的功能
  choice: 按抄本式结语独立保留
  alternative: 扩写为赞颂句或并入标题
  rationale: 不为简短结语补入原见证没有的谓语或礼仪含义。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。引语保持启示文献的肃穆语气，叙事段落则力求清楚自然。底本目前是公共领域英语见证，科普特文原文审校尚待完成，因此对技术性称谓采取较审慎、少解释的译法。
