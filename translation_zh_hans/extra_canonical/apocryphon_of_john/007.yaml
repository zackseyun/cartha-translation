translation:
  language: zh_hans
  text: '《约翰秘传》——四光体


    1. 永恒生命连同他的意志，以及心智连同预知，都侍立在那不可见的灵和巴贝洛面前，颂扬他们，因为这些都是因她而产生的。


    2. 圣灵也与巴贝洛一同使自生的神——他的儿子——达到完满，好让他侍立在那伟大、不可见、童贞的灵面前；他就是自生的神基督，曾高声颂扬那灵。[a]


    3. 他借着天命而出，那不可见、童贞的灵便立这真正自生的神统管万有。


    4. 那灵又使一切权柄都服在他之下，并使真理住在他里面，好让他认识万有。他所得的名超乎万名之上，因为这名将向配得的人说出。


    5. 因为从光——就是基督——和不朽坏，借着灵的恩赐，以及从自生的神而来的四个[伟大]光体……[b]。他等候他们侍立在自己面前：


    6. 就是三者：意志、思想和生命；


    7. 以及四种能力：悟性、恩典、知觉和明辨。


    8. 此外，恩典属于光之永世阿摩泽——他是第一位天使。与这永世同在的还有三个永世：恩典、真理和形态；[c]


    9. 还有第二个光体俄里埃尔，他被立在第二个永世之上。


    10. 与他同在的也有三个永世：省思、知觉和记忆。


    11. 此外，第三个光体是达维泰，他被立在第三个永世之上；与他同在的还有三个永世：悟性、爱和理想形态。


    12. 此外，第四个永世被立在第四个光体埃勒勒特之上。[d]


    13. 与他同在的还有三个永世：完满、和平和索菲亚。[e]


    14. 这就是侍立在自生的神面前的四个光体。


    15. 这就是借着不可见之灵的意愿和恩赐，侍立在大能者之子——那自生者基督——面前的十二个永世；这十二个永世属于那自生之子。


    16. 此外，万有都是借着圣灵的意愿、经由那自生者而设立的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文见证的句法和代词所指不够明确；“自生的神”“他的儿子”和“基督”之间可能是同位关系，也可能有不同的分句方式。
    reason: 标示真实的句法歧义，避免译文造成过度确定的神学关系。
  - marker: b
    text: 此处原稿残缺；方括号表示补足的字词，省略号表示文本缺损。
    reason: 保留手稿损坏与现代补足的文本状态。
  - marker: c
    text: “永世”译自常译作 aeon 的术语，在本书中可指超越性的领域或人格化的属灵存在。
    reason: 帮助普通读者理解此处并非仅指漫长的时间。
  - marker: d
    text: 所据见证作“第四个永世被立在第四个光体之上”，与第9、11节“光体被立在永世之上”的句式方向不同；译文未加协调。
    reason: 保存文本内部的不一致及其可能的传抄问题。
  - marker: e
    text: “索菲亚”是希腊语“智慧”的音译；此处作为专名保留。
    reason: 说明专名的字面含义，同时避免正文将位格名称普通名词化。
lexical_decisions:
- source_word: self-generated
  choice: 自生的／自生者
  rationale: 保留该宇宙论术语的核心含义，不改写为带有后期教义色彩的“受生”或“被造”；作称号时用“自生者”。
- source_word: aeon
  choice: 永世
  rationale: 该词在本文既指超越性的领域，也指人格化的实体；“永世”保留其时间与宇宙论双重色彩，避免直接音译造成理解障碍。
- source_word: light(s)
  choice: 光体
  rationale: 这里的“四光”并非普通光线，而是具位格或宇宙论功能的存在；译为“光体”可与单数的“光——就是基督”有所区分。
- source_word: attended
  choice: 侍立在……面前
  rationale: 表达随侍、服事和临在之意，同时避免将关系窄化为单纯“崇拜”。
- source_word: Providence
  choice: 天命
  rationale: 表达神圣预先安排与眷顾的宇宙论作用；不直接等同于本文另列为实体的“预知”。
- source_word: Indestructibility
  choice: 不朽坏
  rationale: 保留抽象、近乎人格化的性质，表达不能被毁坏或败坏。
- source_word: Discretion
  choice: 明辨
  rationale: 在能力清单中指分辨判断的能力；“明辨”比现代行政语境中的“酌情权”合适。
- source_word: Sophia
  choice: 索菲亚
  rationale: 保留专名形式，避免直接译作“智慧”而抹去其在该文本中的人格化身份。
- source_word: Barbelo
  choice: 巴贝洛
  rationale: 按专名音译，并保留其女性指代。
theological_decisions:
- issue: 第2节“自生的神、他的儿子、基督”之间的同位关系
  choice: 以破折号和分号保留原句可能的同位与指代关系
  alternative: 明确改写为“圣灵与巴贝洛使他的儿子基督完满”
  rationale: 见证文本的句法存在张力；不武断判定所有称谓如何彼此对应。
- issue: “真理住在他里面”的实体性
  choice: 直译为“使真理住在他里面”
  alternative: 解释为“使他拥有真理”
  rationale: 保留真理可能被人格化或作为永世实体的宇宙论含义。
- issue: 超乎万名之上的名
  choice: 保留“将向配得的人说出”
  alternative: 释义为“只有配得的人才能听见或知道”
  rationale: 原文强调名字被说出，且施事者并不明确，不宜补足。
- issue: 第12节永世与光体的统辖方向
  choice: 按所供见证译为“第四个永世被立在第四个光体……之上”
  alternative: 按前文平行结构改为“第四个光体被立在第四个永世之上”
  rationale: 虽与第9、11节的模式不一致，仍保留见证文本的真实张力，不擅自协调。
- issue: 圣灵、不可见之灵与童贞之灵的称谓
  choice: 依各节原有称谓分别翻译
  alternative: 全部统一为“圣灵”
  rationale: 这些称号可能重叠，却具有各自修辞与神学功能，不应默默合并。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留宇宙论名词清单的重复和层级结构；专名按常见汉语音译处理。由于科普特语原文复核尚待完成，本稿严格以所供公共领域英语见证为临时来源依据，并明确保留残文、句法歧义和内部不一致。
