    13. The tenth is Armoupieel.


    14. The eleventh is Melcheir-Adonein.


    15. The twelfth is Belias, who is over the depths of Hades.'
translation:
  language: zh_hans
  text: '1. 他抓取那至今仍存在的明亮火花，为自己创造了更多的永世。他因内心的骄傲而惊叹，又为自己生出了众掌权者。


    4. 第一个名叫阿托特，世世代代称他为[收割者]。


    5. 第二个是哈玛斯，[就是]邪恶的[眼][a]。


    6. 第三个是卡利拉－翁布里。


    7. 第四个是雅贝尔。


    8. 第五个是阿多奈乌，又称萨巴奥特。


    9. 第六个是该隐，人类世世代代称他为太阳。


    10. 第七个是亚伯。


    11. 第八个是阿布里塞内。


    12. 第九个是约贝尔。


    13. 第十个是阿穆皮埃尔。


    14. 第十一个是梅尔凯尔－阿多内因。


    15. 第十二个是贝利亚斯，掌管阴间的深渊。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 底本见证在“眼”处带有嵌入式校勘或复原标记；科普特原文复核尚待完成，因此此处保留方括号，表示文本或复原存在不确定性。
    reason: 原始资料明确要求保留方括号及嵌入式复原信息；中文正文以脚注说明无法自然复制的技术标记。
lexical_decisions:
- source_word: aeons
  choice: 永世
  rationale: 保留诺斯替文献中可指人格化宇宙层级或领域的专门概念，避免径直解释为普通“时代”；但因科普性与可读性，采用直观的“永世”。
- source_word: authorities
  choice: 众掌权者
  rationale: 此处指被生出的统治性灵界存在；“掌权者”既保留权柄语义，也比抽象的“权势”更能表达其人格性。
- source_word: generations
  choice: 世世代代
  rationale: 按上下文表达历代群体的称呼传统；第9节补出“人类”，对应见证文本明确的 humanity/men。
- source_word: Hades
  choice: 阴间
  rationale: 采用现代中文宗教文献中对死者领域的通行译法，不解释为最终刑罚之地“地狱”。
- source_word: deeps/depths
  choice: 深渊
  rationale: 表现阴间深不可测的领域，并保留复数所传达的广阔层次感，而不作宇宙论细化。
theological_decisions:
- issue: “永世”（aeons）是时间段还是人格化领域
  choice: 译作“永世”，不在正文中消解其多义性
  alternative: “诸永恒领域”或“诸灵体”
  rationale: 此类文献中的术语兼具时间、领域和灵界实体色彩；正文宜保留张力，避免过度阐释。
- issue: “明亮火花”与创造行为的关系
  choice: 译作“抓取……火花，为自己创造……”
  alternative: “借着……火花创造”
  rationale: 英文见证中的 with 可表伴随、工具或材料；译文维持“抓取”及火花参与创造的关系，不断言其精确机制。
- issue: 贝利亚斯与阴间深渊的关系
  choice: “掌管阴间的深渊”
  alternative: “位于阴间深渊之上”
  rationale: over 更可能表达管辖权；结合本段列举掌权者的语境，采用“掌管”，但不扩展其职能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。专名按英文见证音译；Cain、Abel 采用中文读者熟悉的传统译名“该隐、亚伯”。保留原有非连续节号4—15；删除约贝尔之后仅属手稿页码的“«11»”。鉴于科普特原文审校尚未完成，本稿明确属于基于公共领域英文见证的暂定源证据译稿。
