  naturalness: 修订后仍采用庄重、现代的书面汉语。“借着……抓取并创造”虽带有原文特有的宇宙论表达，但可避免擅自厘定“火花”究竟是工具、媒介还是材料。
  terminology: “诸永世”保留 aeons 的技术性和可能的人格化／宇宙论含义；“众掌权者”可对应 authorities。专名音译及“该隐、亚伯”的惯用译名可保留。“阴间的诸深渊之上”避免将 Hades 或 over 教义化、职能化。
