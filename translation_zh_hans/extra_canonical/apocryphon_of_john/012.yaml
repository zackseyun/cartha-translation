base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/012.yaml
  text: '1. I said, however, “Lord, what does ‘she moved back and forth’ mean?” He grinned and said, “Do not think that it agrees with what Moses said, ‘above the {waters:2}.’ No!


    2. Instead, when she witnessed the evil that had occurred and the theft her son had committed, she repented. She was overwhelmed by oblivion within the darkness of ignorance and began to feel ashamed. [And she did not dare] to return, but [she moved] about.


    3. This movement, however, is “to go back and forth.” And the proud one obtained power from his mother because he was ignorant and assumed that no one but his mother existed.


    4. When he saw the host of angels he had created, however, he exalted himself above them.


    5. Furthermore, when the mother realized that the garment of darkness was flawed, she understood that her companion had not agreed with her.


    6. She repented, «14» weeping profusely, and the entire Fullness listened to her prayer of repentance. On her behalf, they praised the unseen, virginal Spirit.


    7. And [he] agreed. But when [the unseen Spirit] had agreed, the holy Spirit poured out upon her from their entire Fullness. For it was not that her companion approached her (alone), but he approached her by means of the Fullness so that he could correct her deficiency. She was taken up—not to her own aeon, however, but above her son—so that she would dwell in the Ninth until she had corrected her deficiency.


    8. A voice also came from the lofty heavenly aeon: “The Man exists, and the Son of Man.” The chief archon, Yaltabaoth, overheard it and assumed that the voice had come from his mother, but he did not know where it had come from.


    9. He also taught them—that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came into being, the Primal Man—because he made his likeness manifest in a male form.


    10. Furthermore, the entire aeon of the chief archon shook, and the foundations of the abyss moved. The bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest. When all the authorities and the chief archon looked, they saw the entire region beneath them illuminated.'
translation:
  language: zh_hans
  text: '1. 我却问道：“主啊，‘她来回移动’是什么意思？”他微微一笑，说：“不要以为这与摩西所说的‘在{众水:2}之上’相合。不是的！


    2. 其实，她看见所发生的恶事，以及她儿子犯下的窃取之举，就悔悟了。她在无知的黑暗中被遗忘所笼罩，开始感到羞愧；[她不敢]返回，只是[四处移动]。


    3. 这种移动，就是“来来回回”。那狂傲者从他母亲那里取得了一种能力，因为他无知，以为除他母亲以外再没有谁存在。


    4. 可是，他看见自己所造的天使大军以后，就高抬自己，凌驾于他们之上。


    5. 此外，母亲发觉黑暗的衣袍有缺陷，便明白她的伴侣并没有赞同她。


    6. 她悔悟了，痛哭不止；整个圆满界[a]垂听她悔悟的祈求，并为她赞美那不可见的、童贞的灵。


    7. [他]也同意了。当[那不可见的灵]同意以后，圣灵便从他们整个圆满界倾注在她身上。因为并不是她的伴侣独自临到她，而是他借着圆满界临到她，好补正她的缺欠。她被提升上去，却不是回到她自己的永世[b]，而是被提升到她儿子之上，好让她住在第九层[c]，直到她补正自己的缺欠。


    8. 又有声音从高天的永世发出：“那人存在，人的儿子也存在。”首领执政者雅达巴沃听见了，以为这声音来自他的母亲，却不知道它究竟从哪里来。


    9. 他也把他们显明出来[d]——也就是神圣而完美的母父、完美的护理、那不可见者的形象；这不可见者是万有之父，万物都借着他而成；还有原初之人——因为他以男性的形态显明了自己的样式。


    10. 此外，首领执政者的整个永世都震动了，深渊的根基也摇动起来。物质上方众水的底部，被这个显现出来的形象所发的光照亮。所有掌权者和首领执政者观看时，就看见他们下方的整个区域都亮了起来。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圆满界”译自见证文本的 Fullness，指神圣实在的整体或圆满领域。
    reason: 该词在本文宇宙论中具有专门含义，普通读者可能只理解为抽象的“圆满”。
  - marker: b
    text: “永世”译自 aeon；在这类文献中，它既可指永恒的层次，也可指超世的领域或其中的神圣存在。
    reason: 保留术语的多义性，避免将其单纯时间化或空间化。
  - marker: c
    text: “第九层”原文见证作“第九”；所指层级未在本段中进一步说明。
    reason: 译文为汉语通顺补出“层”，同时说明该补充并非原文明确名词。
  - marker: d
    text: 本句所据英语见证作“他也教导他们”，但后文句法和所列称号使“他也把他们显明出来”成为一种可能理解。科普特语原文复核尚待完成。
    reason: 标示第9节显著的句法与语义疑难，不掩盖当前底本仅为英语见证的限制。
lexical_decisions:
- source_word: Fullness
  choice: 圆满界
  rationale: 保留诺斯替文献中作为整体神圣领域的专门概念，同时用“界”提示其并非单指抽象的圆满状态。
- source_word: aeon
  choice: 永世
  rationale: 采用可表达时间与超世领域双重含义的译词，不将其武断解释为普通“时代”或具体“天界”。
- source_word: chief archon / authorities
  choice: 首领执政者／掌权者
  rationale: 保留统治权力的语义及二者的层级差别，避免用带有特定宗派色彩的名称。
- source_word: Mother-Father
  choice: 母父
  rationale: 保留原文有意并置母性与父性称谓的张力，不改写成单一性别称号。
- source_word: Providence
  choice: 护理
  rationale: 表达神圣预知与照管的概念；此处作为称号使用，故译为“完美的护理”。
- source_word: deficiency
  choice: 缺欠
  rationale: 既可指不足，也保留该文宇宙论中需要被补正的失序状态。
- source_word: the Man / Son of Man / Primal Man
  choice: 那人／人的儿子／原初之人
  rationale: 维持三个相互关联而不完全等同的称谓，并保留“人”在此处可能具有原型性身份的歧义。
- source_word: garment of darkness
  choice: 黑暗的衣袍
  rationale: 保留衣服意象，不将其解释为身体、物质或世界。
theological_decisions:
- issue: 第7节同意者及临到者的代词指向
  choice: 保留[他]与[那不可见的灵]的校补标记，并维持“伴侣”与“圆满界”的复杂关系
  alternative: 明确统一为不可见的灵，或统一为她的伴侣
  rationale: 见证文本在主语与所指上并不稳定，明确化会消除真实的文本歧义。
- issue: 第9节句法与“他也教导他们”的含义
  choice: 译作“他也把他们显明出来”，并以脚注说明见证文本也可理解为“教导他们”
  alternative: 直译为“他也教导他们”
  rationale: 后续同位语列举的是神圣人物或称号，而非明显的受教对象；但现有依据仅为英语见证，不能无保留定案。
- issue: 母亲的悔悟与缺欠
  choice: 使用“悔悟”“补正缺欠”
  alternative: 译作带有制度性宗教含义的“悔罪”“赎罪”
  rationale: 原段强调认知与宇宙秩序的转变，未明确陈述替代性赎罪或特定教会礼仪。
- issue: “人的儿子”称号
  choice: 直译并保留与“那人”的并列
  alternative: 将其直接等同于特定基督论身份并加以解释
  rationale: 文本本身保持宣告式并列；译文不应导入后世宗派性的唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留方括号校补信号及{众水:2}见证标记，删除纯页码«14»。由于科普特语原文审校尚未完成，本稿以所提供的公共领域英语见证为暂定依据；在代词、术语和第9节句法上尤其避免制造虚假的确定性。
