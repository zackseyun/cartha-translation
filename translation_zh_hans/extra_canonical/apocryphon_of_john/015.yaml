translation:
  language: zh_hans
  text: '1. 他们向下观看时，发现他的心智胜过他们自己的，于是便同众执政者和所有天使一起聚集商议。


    2. 他们取来火、土和水，又把这三样同四股炽热的风混合在一起；他们把这一切揉合起来，发出巨大的喧响。他们把他带进死亡的阴影里，好再一次用土、水、火和风塑造他。这身体源于物质，也就是黑暗的无知、欲望和他们虚假的灵。


    3. 这就是身体模型的坟墓；强盗们用它给那人穿上外衣。这也是遗忘的锁链，于是他成了必死的人。


    4. 这是第一个降下来的，也是第一次分离；但住在他里面的光之映照唤醒了他的心智。


    5. 随后，执政者把他带去，安置在乐园里，对他说：“吃吧。”意思是叫他陷入懒散。因为他们的享乐确实苦涩，他们的美丽已经败坏；他们的享乐是骗局，他们的树木是不敬神之事，他们的果实是无药可治的毒物，他们所应许的是死亡。


    6. 然而，他们把自己的生命树安置在乐园中央。我要把他们那种生命的奥秘教给你们众人；这奥秘就是他们共同策划的阴谋，是他们之灵的样式。


    7. 它的根苦涩，枝条是死亡；它的阴影是憎恶，骗局住在它的叶子里面；它的花是邪恶的膏抹，果实是死亡；欲望是它的种子，它在黑暗中萌芽。


    8. 凡尝过它的人，阴间就是他们的居所，黑暗就是他们安歇之处。


    9. 然而，为了不让他向上仰望自己的完满，也不让他意识到自己赤身的羞耻，他们便留在那棵所谓“分别善恶树”前；这树就是光之映照。[a] 不过，使他们吃下去的正是我。”


    10. 我又问救主：“主啊，难道不是蛇指示亚当吃的吗？”


    11. 救主微微一笑，说：“蛇指示他们吃下性欲和毁灭的邪恶，好利用他。


    12. 此外，他知道，因为住在亚当里面的光之映照，亚当不顺从他；这光之映照使亚当的心智比首席执政者更敏锐。他想把自己曾赐给亚当的能力抽取出来，便使亚当陷入一种‘恍惚’。”[b]


    13. 我又问救主：“什么是‘恍惚’？”


    14. 他回答：“这并不是摩西所写的，也不是你们所听见的。因为摩西在第一卷书中说：‘他使那人沉睡。’其实，他使那人的知觉沉睡了。正如他确实借着先知所说：‘我要使他们的心迟钝，使他们不能留意，也不能看见。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的句法关系不确定。也可能理解为：光之映照留在他们称为“分别善恶树”的那棵树前。所据英译见证本身保留了不寻常的结构，尚待科普特语原文复核。
    reason: 保存第9节关于“他们”、树与“光之映照”关系的真实歧义。
  - marker: b
    text: 本节原文见证中的多个“他”指向不够明确。这里按上下文理解为首席执政者知道亚当不顺从，并企图从亚当身上取回能力；其他指称方式仍有可能。
    reason: 避免汉语正文混乱，同时明确译者对代词所作的暂定判断。
lexical_decisions:
- source_word: archons
  choice: 执政者
  rationale: 保留此文献中宇宙统治者的专门称谓；“执政者”较“统治者”更具术语辨识度，又不预先断定其本体性质。
- source_word: intellect
  choice: 心智
  rationale: 兼顾理解、辨识和理智能力，避免“智力”过于现代测量化，也避免“灵性”添加原文没有明说的神学含义。
- source_word: Reflection of Light
  choice: 光之映照
  rationale: 保留“光”与反映、映现之间的关系，并按拟人角色处理；不擅自等同于其他命名实体。
- source_word: false spirit
  choice: 虚假的灵
  rationale: 采用直译以保留其可能指一种灵、气息或支配性力量的开放性。
- source_word: Hades
  choice: 阴间
  rationale: 表达亡者领域，而不直接译作“地狱”，以免引入后世刑罚之地的固定观念。
- source_word: trance
  choice: 恍惚
  rationale: 保留其与普通睡眠不同的意识受抑状态；引号维持文本对该词的特别解释。
- source_word: perception
  choice: 知觉
  rationale: 与“心智”区分，突出感知和注意能力被压制，而非单指肉体睡眠。
- source_word: evil anointing
  choice: 邪恶的膏抹
  rationale: 保留“膏抹”这一宗教性隐喻，不将其解释成特定礼仪或教派观念。
theological_decisions:
- issue: “光之映照”在分别善恶树段落中的句法身份
  choice: 译为“这树就是光之映照”，同时加注说明句法可能性
  alternative: 译为“光之映照留在他们称为分别善恶树的那棵树前”
  rationale: 所据英译的语序与分句关系异常，且科普特语校勘尚待完成；正文顺承当前见证文本，脚注保存另一种可能读法。
- issue: 第12节多处男性代词的指称
  choice: 正文按上下文暂以首席执政者为“他”，以亚当为受作用者
  alternative: 持续使用无明确指称的“他”，或将部分代词理解为其他执政者
  rationale: 汉语若完全复制英文代词会严重妨碍理解；但不把这一判断提升为确定教义，并以脚注声明原文见证存在歧义。
- issue: 身体、物质与死亡的负面描写
  choice: 按文本自身的宇宙论语言直译
  alternative: 改写为一般性的道德堕落或传统创世论表述
  rationale: 这是该文献真实的神学张力，不应为迎合其他经典传统而弱化或调和。
- issue: 蛇与救主在进食事件中的不同作用
  choice: 保留救主说“正是我使他们吃”与蛇教唆性欲和毁灭两项陈述并置
  alternative: 解释为两次不同的进食，或把其中一方改成象征意义
  rationale: 文本本身留下张力，翻译不替读者完成体系化调和。
- issue: 摩西记载与救主解释之间的冲突
  choice: 直译为“并不是摩西所写的……其实，他使那人的知觉沉睡了”
  alternative: 缓和为摩西使用了比喻说法
  rationale: 原段明确纠正传统叙述，译文应保留其论辩锋芒。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。术语“执政者”“光之映照”“膏抹”“阴间”保留古代宗教文献的异质感；句式适度拆分，以免长串并列妨碍普通读者理解。删除见证文本中的页码与花括号编号，但保留其所标示的词义。鉴于科普特语源文审校尚待完成，本稿属于依据所提供公共领域英译见证制作的暂定出版草案。
