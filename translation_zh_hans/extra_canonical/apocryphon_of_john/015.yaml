    14. 他回答：“这不是摩西所写的，也不是你们所听见的；因为他在第一卷书中说：‘他使他沉睡。’相反，是使（他的）知觉沉睡；因为他确实借着先知说：‘我要使他们的心迟钝，使他们不能留意，也不能看见。’”'
