  yaml_path: translation/extra_canonical/apocryphon_of_john/006.yaml
  text: 'He also peered into Barbelo with the pure light that surrounds the unseen Spirit, and his spark, and from him she conceived.


    He begot a light-spark by means of a light similar to blessedness, but (the latter) is not equal to his greatness.


    Such was an only-begotten one of the Mother-Father who had issued forth, he being his only offspring, the only-begotten one of the Father, the pure light.


    The unseen, virginal Spirit also rejoiced because of the light who had come into being, who had issued forth from the first power of his Providence—which is Barbelo—


    and he anointed him with his anointing until he became perfect, lacking nothing of the anointing because he had anointed him with the anointing of the unseen Spirit, and he attended him as he poured onto him, and as soon as he had received of the Spirit, he extolled the holy Spirit and the perfect Providence on whose account he had issued forth.


    He also entreated to give him a companion laborer, which is Mind, and he agreed gladly.


    And when the unseen Spirit had agreed, «7» Mind approached, and he attended Christ (the anointed), extolling him and Barbelo, and all of these came to dwell inside silence.


    Mind also willed to make something by means of the Logos of the unseen Spirit, and his (potential) will became actual, and approached with Mind and Light extolling him.


    And the Logos followed Will, because by means of the Logos, Christ, the self-generated God, created the All.'
translation:
  language: zh_hans
  text: '1. 他又借着环绕那不可见之灵的纯净之光，注视巴贝洛；他的火花显现，巴贝洛便从他受孕。


    2. 他借着一种与福乐相似的光，生出一道光之火花；但这光并不等同于他的伟大。


    3. 这就是从母父而出的独生者，是他唯一的后裔，是父的独生者，是纯净之光。


    4. 那不可见、童贞的灵也因这已经产生的光而欢喜；这光是从他的天意之第一权能——也就是巴贝洛——而出的。


    5. 他以自己的膏膏了他，直到他成为完全，丝毫不缺这膏；因为他以不可见之灵的膏膏了他。他倾注这膏时，也在他身旁服侍；他一领受了那灵，就颂扬圣灵和那完全的天意，因着这天意，他才从中而出。


    6. 他又恳求赐给他一位同工，就是心智；那灵欣然同意了。


    7. 不可见之灵同意以后，心智便前来，在基督[a]身旁服侍，颂扬他和巴贝洛；这一切都住在静默之中。


    8. 心智又愿意借着不可见之灵的圣言[b]造出某物；他的意愿便成为现实，并同心智和光一起来到，颂扬他。


    9. 圣言随着意愿而来，因为基督——那自生的神[c]——借着圣言创造了万有。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”。
    reason: 说明称号的字面意义，并与本段施膏主题相连。
  - marker: b
    text: “圣言”译自 Logos；此词也可指“言语”“道”或具有理性、创造作用的“言”。
    reason: 保留该术语的语义广度，避免单一译词掩盖其可能含义。
  - marker: c
    text: “自生的神”也可译作“自己产生的神”或“自生神”；这里保留其宇宙论称号，不进一步界定其产生方式。
    reason: 提示该称号的特殊含义，并避免将其强行纳入后世教义范畴。
lexical_decisions:
- source_word: Barbelo
  choice: 巴贝洛
  rationale: 作为此文献特有的专名，采用音译，不以带有解释性的神学称号替代。
- source_word: spark / light-spark
  choice: 火花／光之火花
  rationale: 保留原见证中反复出现的光与火花意象，并使普通读者易于理解。
- source_word: Mother-Father
  choice: 母父
  rationale: 直译这一复合称谓，保留其兼具母性与父性的张力，不改写为单一性别称号。
- source_word: Providence
  choice: 天意
  rationale: 在此为人格化、宇宙论性的实体或属性；“天意”自然凝练，同时避免擅自明确其本体地位。
- source_word: Mind
  choice: 心智
  rationale: 作为拟人化的宇宙论名称处理；“心智”比日常的“思想”更适合此处。
- source_word: Logos
  choice: 圣言
  rationale: 以中文宗教语境中可辨识的表达传达作为创造媒介的 Logos，并以脚注说明其语义范围。
- source_word: Will
  choice: 意愿
  rationale: 保留其作为拟人化原则的可能性，同时避免“旨意”过度引入特定经典传统。
- source_word: the All
  choice: 万有
  rationale: 表达宇宙整体，符合庄重的现代中文用法。
- source_word: self-generated
  choice: 自生的
  rationale: 直译其自身产生或非由他者产生的宇宙论称号，不解释为传统教义术语。
theological_decisions:
- issue: 第1节代词所指与受孕关系
  choice: 保留“他的火花”及“巴贝洛便从他受孕”
  alternative: 明确解释究竟是谁发出火花、谁使巴贝洛受孕
  rationale: 所供英文见证的代词链存在歧义，且尚待科普特文复核，因此不作超出证据的消歧。
- issue: 第5节施膏者、服侍者及领受者的代词链
  choice: 尽量按见证次序保留男性代词，仅以句法使中文可读
  alternative: 把各动作明确归于不可见之灵或基督
  rationale: 原见证中的指称并不完全清楚；明确归属会暗中解决文本的神学张力。
- issue: 基督与“受膏者”的关系
  choice: 正文用“基督”，脚注说明本义为“受膏者”
  alternative: 正文只译作“受膏者”
  rationale: 既保留作品中的称号辨识度，也使词义透明，避免读者把后世完整的基督论体系直接带入。
- issue: “自生的神”的神格表述
  choice: 保留“神”及“自生的”称号
  alternative: 弱化为“神圣者”或“自生者”
  rationale: 见证明确使用 God；弱化会消除原文宇宙论中的神学力度。
- issue: 第8节“他的意愿”及随后“来到”的主语
  choice: 按见证保留“他的意愿便成为现实，并同心智和光一起来到”
  alternative: 将“来到”明确归于意愿、圣言或某一位格
  rationale: 英文见证在此结构含混，科普特文审查尚未完成，故保留可感知的歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。专名音译，宇宙论实体的称号适度保留大写英文所传达的专名感，但不依赖中文大写。由于所供材料明确注明尚待科普特原文复核，本稿以公共领域英文见证为临时来源依据，尤其谨慎保留第1、5、8节的代词和主语歧义。见证中的裸页码“«7»”不属于正文，故不收入。
