review_pass:
  verdict: revise
  source_fidelity: 在只能以所给英文见证为桥接底本、尚未直接校核科普特文的前提下，译稿总体保留了叙事顺序、反复强调的“未经同意”、产物先以非人格称呼而后用阳性代词指称的张力，以及圣灵与“众生之母”的同位关系。不过，数处将原文较开放的表述作了不必要的解释性转换，尤其是把“the knowledge of her companion”译成“没有让伴侣知晓”，改变了知识／知悉的归属和语义方向；“together with the conception...”也被弱化为泛泛的“有关”。
  naturalness: 整体为庄重、通顺的现代书面普通话。修订后以“构想”“知悉”“男性面貌”等措辞，使行文更自然，同时避免“她那男性一面的面容”这一略显拗口且过度阐释的说法。
  terminology: “永世”“索菲娅”“形像”“伴侣”“首要的执政者”和“雅尔达巴沃特”均可暂予保留。“狮面龙”保留英文见证的 dragon 读法，并以脚注说明该处的编辑标记和源语待核状态。
  issues:
  - severity: medium
    issue: “也同那不可见之灵的意念和预知有关”弱化并模糊了首句的并列构成。
    rationale: 英文见证为“together with the conception of the unseen Spirit and Precognition”，并非仅称该念头“与……有关”。在不预断专名或人格化程度的前提下，应较直接表达为“连同……的构想”。
  - severity: high
    issue: “也没有让伴侣知晓”改变了“apart from ... the knowledge of her companion”的语义。
    rationale: 见证所说的是行动脱离其伴侣的 knowledge，未明说索菲娅主动不告知伴侣。译为“未经她伴侣知悉”可保留原文对“知识／知悉”归属和具体情形的开放性。
  - severity: medium
    issue: “她那男性一面的面容”对“the face of her maleness”作了过度解释，且中文不够自然。
    rationale: “一面”把含义限定为人格或本体的某个侧面；译作“她的男性面貌”较贴近见证措辞，并保留其古怪、可能具技术性的表达。
  - severity: low
    issue: “眼睛好像闪烁的电光火焰”未充分呈现“lightning fires that flash”的比较结构。
    rationale: 改为“好像闪电般闪耀的火焰”较完整保留火焰与闪电的双重意象。
  revised_text: '此外，身为一个永世的思虑的索菲娅，独自起了一个念头，连同那不可见之灵和预知的构想。


    她想从自身生出一个形像，却没有得到那灵的同意——那灵并未认可此事；也没有得到她伴侣的同意，未经他的筹议，尽管她的男性面貌并未认可此事。


    此外，她虽未找到自己的伴侣，仍生了出来；她脱离那灵的同意和她伴侣的知悉而自行筹划。由于她里面住着不可伤损的力量，


    她的念头没有落空。她从自身生出了一个不完整、外貌与她不同的东西；因为她没有伴侣而造了他，所以他与母亲的外貌不同，具有另一种形态。


    此外，她看见自己意愿所产生的结果时，他变成了狮面龙[a]的形态，


    他的眼睛好像闪电般闪耀的火焰。


    她把他从自己身边推开，赶到那些地方以外，免得任何不朽者看见他，因为她是在无知中造了他。


    她又用一朵发光的云把他围住，并在云中设立一个宝座，使谁也看不见他，只有圣灵——其名为“众生之母”——能看见。她给他起名叫雅尔达巴沃特[b]。


    这就是首要的执政者；他从母亲那里取得了强大的能力，


    便脱离她，离开了自己出生的那些地方。'
