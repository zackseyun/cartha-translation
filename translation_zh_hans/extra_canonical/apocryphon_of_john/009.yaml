lexical_decisions:
- source_word: aeon
  choice: 永世
  rationale: 此处指诺斯替宇宙论中的超世存有或领域；保留“永世”这一传统而较中性的术语，避免直接释作“神灵”而增添本体论判断。
- source_word: Sophia of Reflection
  choice: 思虑的索菲娅
  rationale: 保留专名 Sophia 的音译，并将限定语译为“思虑”，以呈现其思想、反思层面的含义。
- source_word: likeness
  choice: 形像
  rationale: 译作“形像”以保留相似物、对应形态之意，不预断其是否等同于“肖像”或“后裔”。
- source_word: companion
  choice: 伴侣
  rationale: 采用关系中性的“伴侣”，不擅自规定其婚姻身份或特定配偶神学。
- source_word: deliberation
  choice: 筹议／筹划
  rationale: 依句法分别表达与伴侣共同商议及索菲娅自行谋划的动作，同时保留有意作决定的意味。
- source_word: chief archon
  choice: 首要的执政者
  rationale: archon 在此是宇宙论中的统治者；“执政者”既保留职能，也避免直接套用后世专名体系。
- source_word: Yaltabaoth
  choice: 雅尔达巴沃特
  rationale: 按常见学术音译处理专名，不以解释性称号替代。
theological_decisions:
- issue: 索菲娅的行动与不可见之灵的关系
  choice: 明确保留“没有得到那灵的同意”及“那灵并未认可此事”
  alternative: 弱化为“未经商议”
  rationale: 原见证反复强调 Spirit 的不同意或未接受；不可将冲突仅化为程序上的缺席。
- issue: 产物的性别与非人格称谓之间的张力
  choice: 先称“一个……东西”，随后以“他”指称
  alternative: 全程统一为“他”或“它”
  rationale: 原文先用不定的 something，继而使用阳性代词；译文保留从未定形产物到人格化男性存有的表达张力。
- issue: “在无知中造了他”的施事与状态
  choice: 译为“她是在无知中造了他”
  alternative: 译为“因为她无知，便造了他”
  rationale: 前者保留原文可能指行动环境、状态或欠缺知识的宽度，避免强化道德责备。
- issue: 圣灵与“众生之母”的同一表达
  choice: 以破折号保留“其名为‘众生之母’”
  alternative: 解释为另一独立存在
  rationale: 所给见证在语法上将该称号归于圣灵；不另行拆分人物，也不扩展其神学身份。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。保留段落推进与重复结构，但删去见证中的页码符号“«10»”。本稿依据所提供的公共领域英文见证起草，科普特文原典尚待直接复核，因此对“永世”“狮面龙”等关键处采取审慎、不过度解释的译法。
