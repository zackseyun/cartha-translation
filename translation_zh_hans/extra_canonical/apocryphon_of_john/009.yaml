translation:
  language: zh_hans
  text: '此外，思虑的索菲娅身为一个永世，凭自己起了一个念头，也同那不可见之灵的意念和预知有关。


    她想从自身生出一个形像，却没有得到那灵的同意——那灵并未认可此事；她也没有得到伴侣的同意，没有经过他的筹议，尽管她那男性一面的面容并未认可此事。


    此外，她没有找到自己的伴侣，却仍生了出来；她没有得到那灵的同意，也没有让伴侣知晓，就自行筹划。由于她里面住着不可伤损的力量，


    她的念头没有落空。她从自身生出了一个不完整、外貌与她不同的东西；因为她没有伴侣而造了他，所以他与母亲的外貌不同，具有另一种形态。


    此外，她看见自己意愿所产生的结果时，他变成了狮面龙[a]的形态，


    他的眼睛好像闪烁的电光火焰。


    她把他从自己身边推开，赶到那些地方以外，免得任何不朽者看见他，因为她是在无知中造了他。


    她又用一朵发光的云把他围住，并在云中设立一个宝座，使谁也看不见他，只有圣灵——其名为“众生之母”——能看见。她给他起名叫雅尔达巴沃特[b]。


    这就是首要的执政者；他从母亲那里取得了强大的能力，


    便脱离她，离开了自己出生的那些地方。'
