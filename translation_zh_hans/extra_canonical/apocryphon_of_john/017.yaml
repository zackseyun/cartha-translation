  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  language: zh_hans
  text: '1. “我以鹰的形态显现在知识树上；这棵树就是纯光之眷顾的映像。我这样做，是要教导他们，把他们从沉睡中唤醒，因为他们二人都处于堕落的境况，也知道自己赤身露体。


    2. 映像以光的样式向他们显现，唤醒了他们的心思。可是，雅达巴沃特[a]发觉他们已经离开了他，就诅咒自己的土地。


    3. 他遇见那女人时，她正为自己的丈夫作准备。


    4. 他是辖制她的主，却不知道那借着神圣谕令而发生的奥秘。他们不敢指控他。他向自己的天使显露了自己里面的无知，又把他们逐出乐园，给他们披上幽暗。


    5. 首席执政者也看见那站在亚当身旁的童女，并看见生命那光辉的映像已经显现在她里面。雅达巴沃特充满无知。万有的眷顾看见这事，就差遣使者；他们迅速把生命从夏娃里面带走。


    6. 随后，首席执政者玷污了她，与她生了两个儿子，就是长子和次子：埃洛伊姆和雅韦。[b]


    7. 埃洛伊姆长着熊的脸，雅韦却长着猫的脸。


    8. 雅韦是公义的，埃洛伊姆却是不义的。


    9. 雅韦受命掌管火与风，埃洛伊姆则受命掌管水与地。可是，他为了欺骗，给他们取名叫该隐和亚伯。


    10. 直到今天，性交仍因首席执政者而延续。正是他把性欲植入那属于亚当的女人里面；他借着性交复制出一个个身体，又把自己的虚假之灵吹入其中。


    11. 他又立这两个执政者管理若干权势，使他们统治坟墓。[c]


    12. 然而，亚当认识到自己预知的形像时，就生出了人子之形像，给他取名叫塞特；这与永世诸界中那族类存在的样式相合。[d]


    13. 同样，母亲也把自己的灵降下；这灵有她自己的形像，也有那位住在圆满境中的一幅摹像，因为她要为将要降下的永世诸界预备居所。[e]


    14. 他还使他们喝下从首席执政者而来的遗忘之水，使他们不知道自己源自何处。


    15. 这样，那种子存留了一段时期，为要施行帮助；等到灵从神圣的永世诸界出来时，他就会使那种子起来，医治它的缺欠，使整个圆满境成为圣洁、毫无瑕疵。”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅达巴沃特”是本文对首席执政者的专名；不同转写体系也可见“亚达巴沃特”等形式。
    reason: 说明陌生专名及转写差异。
  - marker: b
    text: “埃洛伊姆”和“雅韦”按本文的人名形式音译；这些名称与希伯来圣经中的神称谓有关，但本文将它们置于自身独特的宇宙论叙事中。
    reason: 防止读者无条件把本文角色与正典用法完全等同，同时不替作者化解张力。
  - marker: c
    text: “坟墓”也可能象征受死亡辖制的身体或物质世界；正文保留其字面表达。
    reason: 指出可能的象征义而不将其写入正文。
  - marker: d
    text: “永世诸界”所译的词既可指永恒的属灵实体，也可指它们所属的超越领域。
    reason: 保留术语的本体与空间双重含义。
  - marker: e
    text: “圆满境”指本文宇宙论中的神圣圆满领域；“摹像”强调仿照某一原型而成的形像。
    reason: 帮助普通读者理解两个技术性术语。
  - marker: f
    text: 本段结尾的代词所指并不完全清楚；“种子”可能指一个群体、后裔，或以单数表达的属灵族类。
    reason: 公开原文见证中的真实指代歧义。
lexical_decisions:
- source_word: Reflection
  choice: 映像
  rationale: 保留原文中作为拟人化宇宙论实体的意味，同时避免把它仅仅理解为人的“思想”或“反思”。
- source_word: Providence
  choice: 眷顾
  rationale: 兼顾主动照料、筹划与拟人化神圣实体的含义；正文中“纯光之眷顾”“万有的眷顾”均保留专名感。
- source_word: chief archon / archon
  choice: 首席执政者／执政者
  rationale: 以较自然的现代汉语表达统治性灵界权势，并保留该文献特有的宇宙论职衔。
- source_word: aeons
  choice: 永世诸界
  rationale: 该词在本文既可指永恒实体，也可指超越性的领域；采用复合表达以保留这层歧义。
- source_word: Fullness
  choice: 圆满境
  rationale: 表达宇宙论中的“圆满”领域，而不是普通意义上的充足或完整。
- source_word: precognition / foreknowledge
  choice: 预知
  rationale: 保留“预先知晓”的直接意义，不擅自认定其必为某个专名实体。
- source_word: simulacrum
  choice: 摹像
  rationale: 区别于一般“形像”，传达衍生、仿照而成之像的意味。
- source_word: false spirit
  choice: 虚假之灵
  rationale: 保留其可能指欺骗性的灵或赝造之灵的张力，不解释为特定教义概念。
- source_word: seed
  choice: 种子
  rationale: 保留原文可兼指后裔、属灵族类或潜在生命原则的象征性歧义。
theological_decisions:
- issue: 首席执政者“玷污”夏娃的性质
  choice: 直译为“玷污了她”
  alternative: 解释为“强暴了她”或弱化为“使她不洁”
  rationale: 见证文本只明确表达污染、亵渎或侵犯；不把行为性质进一步确定，以保留原有含混和叙事张力。
- issue: “雅韦”与正典神名的关系
  choice: 按音译保留为“雅韦”
  alternative: 译作“耶和华”或“上主”
  rationale: 本文把该名用于宇宙论中的执政者；采用音译可避免无说明地与正典传统中的称谓完全等同。
- issue: “人子”的身份
  choice: 保留“人子”
  alternative: 解释为基督、原型人或一般“人的儿子”
  rationale: 原文身份指向并不充分明确，不在译文中加入基督论或其他体系化解释。
- issue: 第15节代词所指
  choice: 以“那种子”承接宾语，并保留“灵”的阳性行动主体
  alternative: 将所有代词统一解释为个人、群体或灵魂
  rationale: 英文见证中单复数及代词指向存在张力；中文通过重复名词减少语法混乱，但不裁定“种子”究竟是个人还是群体。
- issue: 性交与首席执政者的关系
  choice: 保留“因首席执政者而延续”的因果陈述
  alternative: 弱化为“与首席执政者有关”
  rationale: 忠实呈现该文献本身鲜明而具争议的宇宙论主张，不以其他神学传统修正。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留诺斯替宇宙论的专门概念，但以“执政者、眷顾、圆满境、永世诸界”等较易理解的表达呈现。因科普特语原文复核尚待完成，本稿依据所提供的公共领域英文见证，并把关键歧义通过正文措辞和脚注保留下来；手稿页码«24»、«25»未纳入正文，以免打断句意。
