review_pass:
  verdict: revise
  source_fidelity: 第13节把并列的两个宾语误连为同一“灵”的属性：见证文本是母亲差下“她的灵”（与她相像）以及“住在圆满境者的一个摹像”，而非该灵同时“有……一幅摹像”。此外，aeons在第13、15节是可“降下”或“出来”的复数行动者，译作“永世诸界”会将其固定为领域，且与句法不合。第11节“placed ... over several principalities”宜表达为置于/派定在若干权势之上，而不是“管理若干权势”。其余关键歧义（第9节命名对象、第15节代词所指）保留。
  naturalness: 原稿整体庄重、通顺。修订将第13节调整为自然的并列句，并以“永世者”统一可行动的技术性复数名词。第15节保留代词而不把其所指裁定为“种子”。
  terminology: “映像”“眷顾”“首席执政者”“圆满境”“摹像”等选择可用。将Yaldabaoth统一为较贴近拉丁转写的“雅尔达巴奥特”。“永世者”用于 aeons，以避免“诸界”在本段被拟人化、行动化的冲突；脚注说明该术语在不同上下文仍可能兼具实体与领域关联。
  issues:
  - severity: high
    issue: 第13节将“她的灵”和“一个摹像”误译为同一对象的属性。
    rationale: 英文见证以“as well as”并列母亲所差下的灵和摹像；原稿“这灵有她自己的形像，也有……一幅摹像”改变了两个对象的关系。
  - severity: medium
    issue: “永世诸界”不适合本段所有 aeons 的用例。
    rationale: 第13节的 aeons 将要“降下”，第15节灵从它们中“出来”；见证的语法将其呈现为复数行动者或实体，而“诸界”使译文产生语义和搭配冲突。
  - severity: medium
    issue: 第11节“管理若干权势”偏离“placed ... over several principalities”的上下级关系。
    rationale: 原句是把两个执政者安置/指派在若干 principalities 之上；修订以“置于若干权势之上”保留其统辖关系，不把 principalities 误作其管理对象。
  - severity: low
    issue: 雅达巴沃特的音译遗漏了原名Yaldabaoth中的l音，且以“沃特”对应结尾不够贴近。
    rationale: 改为“雅尔达巴奥特”，并以脚注交代其他常见转写，增强专名可辨识性。
