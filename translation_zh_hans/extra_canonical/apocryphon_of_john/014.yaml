  text: 'However, all the angels and demons labored until they had formed the psychic body. Their creation was entirely inert and without movement for a prolonged time.


    When, however, the mother wished to regain the power she had granted to the chief archon, she entreated the Most Merciful Mother-Father of the All.


    With the sacred decree, he dispatched the five lights down onto the place of the angels of the chief archon, and they counseled him that they should bring forth the power of the mother, and they said to Yaltabaoth, “Blow of your Spirit into his face, and his body will stand up.” And he blew into his face his Spirit, which is the power of his mother.


    He was unaware, because he exists in ignorance, and the power of the mother went forth from Yaltabaoth into the psychic body they had formed according to the image of he who is from the beginning.


    The body moved and attained strength, and it was radiant, and at that time the rest of «20» the powers grew envious, because he had come into existence through all of them, and they had bestowed their power on the man, and his intellect surpassed (that of) those who had made him, and the chief archon.


    When, however, they saw that he was radiant, and that he could reason better than they, and that he was unburdened by evil, they took him up and thrust him down into the nethermost region of all matter.


    However, the Blessed One, the Mother-Father, the beneficent and merciful one, showed mercy to the power of the mother which had been brought forth from the chief ruler, because they might acquire power over the psychic and sensory body, and through his beneficent Spirit and his great mercy he dispatched to Adam a helper, Radiant Reflection who emerges out of him, who is called “{Life:1}.”


    She, however, helps the entire creation by laboring together with him, and by restoring to him his perfection, and by instructing him concerning the descent of his seed, and by instructing him concerning the way of ascent, the way by which it descended.


    Further, Reflection of Light was concealed inside Adam, so that the archons would be unknowing, but that Reflection would be a rectification of the deficiency of the mother, and the man became visible on account of the light-shadow inside him, and his intellect surpassed (that of) all those who had made him.'
translation:
  language: zh_hans
  text: '**《约翰密传》——灵被吹入亚当里面**


    所有天使和魔灵都劳作，直到造出了属魂的身体[a]。他们所造的形体却长久僵卧，纹丝不动。


    母亲想要收回自己曾赐给首领执政者的能力，便向万有至慈的母父恳求。


    母父依照神圣的定旨，差遣五光降到首领执政者众天使所在之处。五光向他献策，要使母亲的能力显露出来。他们对雅达巴沃说：“把你的灵吹进他的脸里，他的身体就会站起来。”于是，雅达巴沃把自己的灵吹进他的脸里；这灵就是他母亲的能力。


    他并不知道这一点，因为他活在无知之中。母亲的能力便从雅达巴沃里面出来，进入他们照着那位自太初便存在者的形象所造的属魂身体。


    那身体动了起来，变得强健，并且发出光辉。其余的众能力便嫉妒起来，因为这人是借着他们所有的能力而成的，他们也都把自己的能力赋予了他；然而，这人的心智能力却超过了那些造他者，也超过了首领执政者。


    他们见他发出光辉，推理胜过他们，又没有邪恶的重担，就把他抓起来，投入一切物质最底层的区域。


    然而，那当受称颂的母父，就是施恩而怜悯者，怜悯从首领执政者里面被引出的母亲之能力，因为众执政者可能会辖制属魂和感官的身体。于是，母父借着自己施恩的灵，凭着浩大的怜悯，给亚当差来一位帮助者，就是从母父而出的“光明映照”[b]，她名叫“生命”[c]。


    她与亚当一同劳作，帮助整个受造界，使他恢复完全；她教导他认识自己后裔的下降，也教导他认识上升的道路，就是其下降时所循之路。


    此外，“光明映照”隐藏在亚当里面，使众执政者毫不知情，也使这映照能够补正母亲的缺失。人因里面那光的影子[d]而显现出来；他的心智能力超过了所有造他者。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属魂的”对应见证文本 psychic，指与“魂”相关的生命层面，不是现代汉语中“心理的”之意。
    reason: 这是本段反复出现的专门术语，普通读者容易按现代心理学误解。
  - marker: b
    text: “光明映照”也可理解为“发光的映像”或“光的反照”；所给英文见证先作 Radiant Reflection，后作 Reflection of Light。
    reason: 说明同一称谓在见证文本中的两种形式及译词所保留的语义范围。
  - marker: c
    text: 见证文本作“{Life:1}”；此处按其词义译作“生命”，数字及花括号视为资料标记，不纳入正文。
    reason: 区分古代文本内容与现代资料编码，避免把技术标记误作正文。
  - marker: d
    text: “光的影子”直译见证文本 light-shadow；其确切含义可能是光的影像、反照或光所形成的影子。
    reason: 原表达含混且近似悖论，脚注列出可能范围而不在正文中武断定解。
lexical_decisions:
- source_word: psychic body
  choice: 属魂的身体
  rationale: 保留该文献对魂性层面的专门区分，不简化为容易误解的“精神身体”或现代心理学意义的“心理身体”。
- source_word: chief archon
  choice: 首领执政者
  rationale: 以“执政者”表达 archon 的统治性称号，并用“首领”标明其居首地位，避免导入后世宗派术语。
- source_word: Mother-Father of the All
  choice: 万有至慈的母父／母父
  rationale: 保留原文并置母性与父性称谓的张力；“万有”对应 the All，首次出现时连同“至慈”完整表达。
- source_word: five lights
  choice: 五光
  rationale: 按该文献的位格化宇宙论用语直译，不擅自解释为天使或发光体。
- source_word: Radiant Reflection / Reflection of Light
  choice: 光明映照
  rationale: 用“映照”同时保留反射、映像和显明的语义空间，并以“光明”表达其发光性质；两种英文表述统一处理以保持篇章指称连贯。
- source_word: intellect
  choice: 心智能力
  rationale: 比单用“理性”更宽，兼顾理解、认识和推理功能；上下文出现比较时自然通顺。
- source_word: sensory body
  choice: 感官的身体
  rationale: 保留与“属魂的身体”并列的身体层面，不把 sensory 泛化为“肉体”。
- source_word: rectification
  choice: 补正
  rationale: 表达修补缺失、恢复正确状态的含义，同时避免预先赋予完整的救赎论解释。
theological_decisions:
- issue: 吹入亚当之灵的来源与身份
  choice: 译为雅达巴沃“自己的灵”，随即保留“这灵就是他母亲的能力”的同一说明
  alternative: 将其解释为雅达巴沃所占有、但并非真正属于他的能力
  rationale: 原文有意让“他的灵”与“母亲的能力”并置；正文不消解这种所有权与来源之间的张力。
- issue: “那位自太初便存在者”的身份
  choice: 保持描述性称谓，不指名为某一神格或人物
  alternative: 译成“太初之人”或直接认定为至高神
  rationale: 所给见证文本未明确所指，故保留真实的指称开放性。
- issue: 帮助者的性别指称
  choice: 使用“她”
  alternative: 使用中性的“它”或不重复代词
  rationale: 见证文本明确使用阴性代词，且名称“生命”与帮助者在叙事中被人格化；保留这一特征而不延伸为特定教义身份。
- issue: 后裔下降与上升道路的关系
  choice: 直译为“上升的道路，就是其下降时所循之路”
  alternative: 解释为灵魂沿原路返回天界
  rationale: 正文保留道路与下降之间略显含混的照应，不补入见证文本未明说的主体和终点。
- issue: 光的影子
  choice: 保留悖论式表达“光的影子”
  alternative: 顺译为“光辉”或“光的映像”
  rationale: 该短语可能具有文本传统中的特殊宇宙论含义，不应为求顺畅而抹去其张力。
