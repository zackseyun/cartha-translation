review_pass:
  verdict: revise
  source_fidelity: 草稿整体忠实于所给英文见证，并谨慎保留了该段的宇宙论术语与指称张力；但少数动词、指代及引文位置有所偏移。“Blow ... into his face”应译为“向他脸上吹入”，而非“吹进……里面”；“bring forth”不宜弱化为“显露”；“because they might acquire power”应明确其防范/恐惧语气。见证中的“{Life:1}”是明确呈现的锚记，宜以脚注锚点说明而不将其数字内容擅自当作可删除的资料噪音。
  naturalness: 原稿庄重流畅，适合现代标准普通话。修订将“属魂的身体”统一为较凝练的“魂性身体”，将“心智能力”简化为上下文足够清楚的“心智”，并调整若干长句的连接，使逻辑关系更清晰而不增加解释。
  terminology: “执政者”“母父”“五光”“魂性身体”“光明映照”等处理可以保留。雅达巴沃的名称宜保持既有音译。“光的影子”保留其悖论性，且用脚注提示英文桥接见证的含混，避免定论。
  issues:
  - severity: medium
    issue: 标题及第三段将“blow ... into his face”处理为“吹入亚当里面／吹进他的脸里”。
    rationale: 见证明确定位在“脸/面上”，标题也不应将该动作泛化为“吹入亚当里面”。修订为“灵被吹入亚当脸上”及“向他脸上吹入”。
  - severity: medium
    issue: “bring forth the power of the mother”译作“使母亲的能力显露出来”。
    rationale: “bring forth”可指引出、使其出来；紧接下文确说该能力“从雅达巴沃出来”，故“引出”比“显露”更贴近叙事动作。
  - severity: medium
    issue: 第七段的“because they might acquire power”被译为平直的“因为众执政者可能会辖制”。
    rationale: 该从句说明施怜悯的缘由，含有避免其取得控制权的意味。译为“免得他们取得……的支配权”可保留这一关系，且不强行确定“他们”的具体范围。
  - severity: low
    issue: 脚注c断言花括号和数字只是现代资料标记，且正文完全删除见证中显式的“{Life:1}”。
    rationale: 在仅有英文桥接见证、尚未直接复核科普特语及版面锚记功能的情况下，不能确定其非文本性。可译出“生命”，以脚注如实记录该见证在此带有“{Life:1}”标记，而不把“1”写入正文。
  - severity: low
    issue: “through all of them”译为“借着他们所有的能力而成”。
    rationale: 原句首先强调此人经由“他们全体”而存在，随后才说他们把自己的能力给了他。修订分别表达两层意思，避免提前合并。
  revised_text: '**《约翰密传》——灵被吹入亚当脸上**


    所有天使和魔灵都劳作，直到造出了魂性身体[a]。他们所造的形体长久毫无生气，纹丝不动。


    母亲想要收回自己曾赐给首领执政者的能力，便向万有至慈的母父恳求。


    母父依照神圣的定旨，差遣五光降到首领执政者的天使所在之处。五光劝他引出母亲的能力；他们对雅达巴沃说：“把你的灵向他脸上吹入，他的身体就会站起来。”于是，他把自己的灵吹入他的脸上；这灵就是他母亲的能力。


    他并不知道这一点，因为他存在于无知之中。母亲的能力便从雅达巴沃出来，进入他们照着那位自太初而有者的形象所造的魂性身体。


    那身体动了起来，得着力量，并且发出光辉。那时，其余的众能力都嫉妒起来，因为这人是经由他们全体而存在的，他们也把自己的能力赋予了这人；这人的心智超过那些造他的人，也超过首领执政者。


    他们看见他发出光辉，推理胜过他们，又不受邪恶拖累，就把他抓起来，猛力投进一切物质最深的区域。


    然而，那当受称颂的母父，就是施恩而怜悯者，怜悯那从首领执政者中被引出的母亲之能力，免得他们取得对魂性和感官身体的支配权。母父借着自己施恩的灵，凭着浩大的怜悯，给亚当差来一位帮助者，就是从他而出的“光明映照”[b]；她名叫“生命”[c]。


    她与他一同劳作，帮助整个受造界，使他恢复完全；她教导他关于他后裔的下降，也教导他关于上升的道路，就是它下降时所循的道路。


    此外，“光明映照”隐藏在亚当里面，使众执政者不知情；这映照也要补正母亲的缺失。人因他里面那光的影子[d]而显现出来；他的心智超过所有造他的人。'
