base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/016.yaml
  text: 'Reflection of Light then hid herself inside him. The chief archon wanted to extract her from his rib, but Reflection of Light cannot be grasped.


    Although the darkness pursued her, it could not catch her. He extracted a portion of his power from him and made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him. He brought «23» the portion he had extracted from the man’s power inside the female mold—not, as Moses said, “his rib”—and he saw the woman beside him.


    At that moment, Radiant Reflection also appeared. She lifted the veil that had covered his mind, and he regained his sobriety after the intoxication of darkness. He recognized the counterpart of his own image and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother, and he will cling to his wife, and both of them will become one flesh,” because his companion will be sent to him. He will leave his father and his mother—even Sophia, our sister, who descended in innocence to correct her deficiency, because of which she was called “Life,” who is “the mother or the living”—through the Providence of the sovereignty of Heaven and [Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
translation:
  language: zh_hans
  text: '光之映像便藏在他里面。首领执政者想从他的肋旁把她取出来，但光之映像是无法捉住的。


    黑暗虽然追逐她，却抓不到她。于是，他从那人身上取出其力量的一部分，又照着曾向他显现的映像之样式，造了另一个女性形体。他把从那人的力量中取出的那一部分放进女性形体里——并不像摩西所说的，是“他的肋骨”。随后，他看见那女人在自己身旁。


    就在那时，光辉的映像也显现了。她揭去蒙住他心智的帷幕，使他从黑暗的沉醉中清醒过来。他认出与自己形象相对应的那一位，便说：“这确实是我骨中的骨、肉中的肉。


    因此，男人要离开父母，与妻子连合，二人成为一体。”这是因为他的伴侣将被差到他那里。他将离开他的父亲和母亲——甚至离开索菲娅[a]，我们的姊妹；她无知无觉地降下，为要补正自己的缺失，因此被称为“生命”，就是“母亲，或活着的”[b]——这是借着天上主权的眷顾，也借着那向他显现的〔映像〕[c]。他们借着她尝到了完全的知识。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “索菲娅”是希腊语 Sophia 的音译，意为“智慧”。
    reason: 保留作品中的人格化专名，同时帮助普通读者理解其字面意义。
  - marker: b
    text: 所据英文见证作“母亲，或活着的”（the mother or the living），语义和句法不甚确定；可能涉及“众生之母”这一传统表述。直接科普特语复核尚待进行。
    reason: 忠实标示底本见证的疑难，不在尚未完成原语言复核时静默订正。
  - marker: c
    text: 方括号表示见证文本中的补字；“映像”并非在现存措辞中完全确定。
    reason: 保留原见证所标示的文本修复信号。
lexical_decisions:
- source_word: Reflection of Light / Radiant Reflection
  choice: 光之映像／光辉的映像
  rationale: “映像”既保留 Reflection 所含的反映、对应之意，又比“反思”更适合此处人格化女性形象；不同修饰语按见证文本分别译出。
- source_word: chief archon
  choice: 首领执政者
  rationale: “执政者”保留诺斯替文献中 archon 的技术性称谓，“首领”表达其居首地位，避免直接套用其他神学传统中的称号。
- source_word: mold
  choice: 形体
  rationale: 此处指被塑造、可承载力量的女性形态；“形体”在现代中文中自然，也保留其作为造型或模子的含义。
- source_word: counterpart of his own image
  choice: 与自己形象相对应的那一位
  rationale: 保留 counterpart 的对应、配对关系，不把它过度解释为“另一半”。
- source_word: cleave
  choice: 连合
  rationale: 采用庄重而通行的创世记婚姻语汇，既表达亲密结合，也不把含义缩窄为身体动作。
- source_word: perfect knowledge
  choice: 完全的知识
  rationale: 直陈其完整、圆满之意；不擅自改为带特定宗派色彩的“救赎知识”或专门术语。
theological_decisions:
- issue: 光之映像是否等同于索菲娅或男人的伴侣
  choice: 依上下文保留各称谓及代词，不明说三者完全等同
  alternative: 将“光之映像”“索菲娅”“伴侣”统一译作同一位格
  rationale: 见证文本在叙事中彼此关联，却没有在本段用清晰同位语彻底消除区别；译文不替文本化解其位格关系的张力。
- issue: “离开父母”与索菲娅之间的句法关系
  choice: 用破折号保留“甚至离开索菲娅”作为突入式说明
  alternative: 重组为男人明确离开作为母亲的索菲娅
  rationale: 英文见证的长句关系不稳，且直接科普特语复核尚待进行；保留插入结构比确定索菲娅单一亲属身份更审慎。
- issue: 结尾“借着天上主权的眷顾……”所修饰的内容
  choice: 保留为相对独立的“这是借着……”句，维持其可能回指前述事件的开放性
  alternative: 明确连接到索菲娅得名、伴侣受差或人离开父母中的某一项
  rationale: 见证文本的修饰范围含混，译文不应擅自锁定唯一回指对象。
- issue: 创世记引文的权威关系
  choice: 保留文本对摩西“肋骨”说法的明确否定，同时按引文形式译出婚姻语句
  alternative: 调和为肋旁、力量与肋骨是同一事件的不同描述
  rationale: 本篇有意重述并修正摩西叙事；调和会抹去原文的论辩性神学张力。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。引文措辞适度贴近中文圣经传统，以呈现其与《创世记》的互文关系，但叙述部分不用古奥或宗派化术语。由于直接科普特语审校尚待进行，本稿以所供公共领域英文见证为审慎依据，并通过脚注公开标示关键文本疑难。
