  naturalness: 整体庄重、通顺，适合现代标准汉语。将“无知无觉地”改为“以纯真之态”，既自然，也避免将该词过度道德化为“无罪”。“天上权柄的眷顾”较“天上主权的眷顾”更合汉语搭配，仍不预断其句法所指。
  terminology: “光之映像／光辉的映像”“首领执政者”“索菲娅”“完全的知识”等选择可保留；不宜把 Reflection、Sophia 或 companion 擅自合并为同一位格。保留“映像”的方括号修复信号，并以脚注说明。“母亲，或活着的”仍须按见证保留为疑难语句。
  issues:
