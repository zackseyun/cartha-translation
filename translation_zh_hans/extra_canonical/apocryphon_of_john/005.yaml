  text: '1. She became the universal womb because she is the one who exists before all of them: the Mother-Father, the Primal Human, the holy Spirit, the triple-male, the triple-powerful, the triple-named androgynous one, and the eternal aeon among the unseen ones, even the first one to come forth.


    2. ‹She› asked the unseen, virginal Spirit—that is, Barbelo—to grant her Precognition, and the Spirit agreed.


    3. When he had [agreed], Precognition approached and attended Providence, she who originates from the Idea of the unseen, virginal Spirit.


    4. She praised him [and] his perfect power, Barbelo, because they had come into being on account of her.


    5. She asked once more that he grant her [Indestructibility], and he agreed.


    6. When he had [agreed], Indestructibility [approached] and attended Idea and Precognition.


    7. She praised the unseen one and Barbelo, the one on whose account they had come into being.


    8. Barbelo also asked that he grant her eternal life, and the unseen Spirit agreed. When he had agreed, Eternal Life approached,


    9. and they [attended] and praised the unseen [Spirit] and Barbelo, on whose account they had come into being.


    10. She asked once more that he grant her truth. And [he agreed], and [when he had] agreed,


    11. Truth approached, and they attended and praised the unseen, admirable Spirit and his Barbelo, on whose account they had come into being.


    12. This is the aeonic pentad of the Father, which is the Primal Human, the image of the unseen Spirit.


    13. This is Providence—that is, Barbelo—and Idea, Precognition, Indestructibility, Eternal Life, and Truth.


    14. This is the androgynous aeonic pentad, being the aeonic decad, which is the Father.'
translation:
  language: zh_hans
  text: '1. 她成了万有的母胎，因为她先于这一切而存在；她是母父、太初之人、圣灵、三重为男者、三重有能者、三重有名的双性者，也是众不可见者中的永恒永世，正是首先发出的那一位。


    2. ‹她›祈求那不可见、童贞的灵——也就是巴贝洛——赐给她预知；灵应允了。


    3. 他[应允]以后，预知便前来，侍立在眷顾身旁；眷顾是从那不可见、童贞之灵的意念而出的。


    4. 她颂扬他[和]他完美的大能巴贝洛，因为他们是因她而产生的。


    5. 她又祈求他赐给她[不朽坏]，他也应允了。


    6. 他[应允]以后，不朽坏便[前来]，侍立在意念和预知身旁。


    7. 她颂扬那不可见者和巴贝洛；他们是因巴贝洛而产生的。


    8. 巴贝洛又祈求他赐给她永恒的生命；那不可见的灵应允了。他应允以后，永恒的生命便前来，


    9. 他们就[侍立]，颂扬那不可见的[灵]和巴贝洛；他们是因巴贝洛而产生的。


    10. 她又祈求他赐给她真理。[他应允了]；[他]应允以后，


    11. 真理便前来；他们侍立着，颂扬那不可见、可赞叹的灵和属他的巴贝洛；他们是因巴贝洛而产生的。


    12. 这就是父的永世五体，也就是太初之人、那不可见之灵的形像。


    13. 这就是眷顾——也就是巴贝洛——以及意念、预知、不朽坏、永恒的生命和真理。


    14. 这就是双性的永世五体；它也是永世十体，也就是父。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段据所提供的公共领域英文见证暂译；科普特语原文尚待直接校勘。方括号表示见证文本中的补足或残缺复原，尖括号表示编辑恢复的词。“永世五体／十体”对应 aeonic pentad／decad，指永世领域中由五个／十个成员构成的整体；第13节表面列出的名称与“五体”称谓之间的计数关系，本文未作解释性调整。
    reason: 说明翻译基础、文本符号及原文保留的计数张力。
lexical_decisions:
- source_word: universal womb
  choice: 万有的母胎
  rationale: 保留“womb”的生育意象，并以“万有”表达其宇宙性范围。
- source_word: Mother-Father
  choice: 母父
  rationale: 以紧凑复合词保留原文有意并置的母性与父性，不改释为单一性别。
- source_word: Primal Man / Primal Human
  choice: 太初之人
  rationale: “人”兼顾原文的人类性称谓与现代汉语的性别包容性，同时保持庄重。
- source_word: aeon
  choice: 永世
  rationale: 既表达永恒领域或超世存有的技术含义，也避免直接音译造成不必要的阅读障碍；具体含义仍由上下文限定。
- source_word: Providence
  choice: 眷顾
  rationale: 作为拟人化名称处理，保留神圣照管、关顾之义；不采用偏现代行政语感的“天意安排”。
- source_word: Idea
  choice: 意念
  rationale: 在此作为位格化名词，兼有思想、观念之义，且与上下文自然衔接。
- source_word: Precognition
  choice: 预知
  rationale: 准确表达事先知道，并作为位格化名称处理。
- source_word: Indestructibility
  choice: 不朽坏
  rationale: 保留不能败坏、毁灭的本体性含义，比单纯“不朽”更贴近词义范围。
- source_word: attended
  choice: 侍立在……身旁
  rationale: 表达前来伴随、服侍或列立的含混关系，不把它过度解释为从属职分。
- source_word: androgynous
  choice: 双性的
  rationale: 直陈兼具两性特征，保留文本的神学张力，不弱化为“中性”。
- source_word: pentad / decad
  choice: 五体 / 十体
  rationale: 表达由五个或十个成员构成的整体，同时避免误解为普通数字序列。
theological_decisions:
- issue: 巴贝洛与童贞之灵在第2节的同位关系
  choice: 按见证文本译为“那不可见、童贞的灵——也就是巴贝洛”
  alternative: 把巴贝洛理解为祈求者，而非童贞之灵
  rationale: 所给英文见证的句法存在与后文称谓关系不易协调之处；正文忠实保留其表层同位表达，不擅自消解。
- issue: 第4节“他完美的大能，巴贝洛”的关系
  choice: 译作“他完美的大能巴贝洛”
  alternative: 译作“他和他的完美大能，以及巴贝洛”
  rationale: 标点及同位关系有歧义；选择较贴近见证文本语序的读法，同时保留括号所示残缺。
- issue: 第12—14节五体、十体与父的等同关系
  choice: 保留“也就是父”等直接等同措辞
  alternative: 解释为属于父的属性或层级
  rationale: 原见证有意使用本体性、同位性语言，翻译不应以某一体系预先化解。
- issue: 性别代词的交替
  choice: 依见证文本保留“她／他”的交替
  alternative: 统一使用无性别称谓或全部改为“它”
  rationale: 性别交替与“母父”“双性者”等主题相关，统一处理会抹去文本张力。
translation_notes:
  register: 采用现代、庄重而可读的普通话。位格化抽象名词以名称方式处理；保留性别转换、同位关系、残缺标记及五体／十体的张力。未保留见证文本中的裸页码“«6»”，因其属于抄本分页信息而非正文。
