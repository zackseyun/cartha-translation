translation:
  language: zh_hans
  text: '1. 所以，我——万有完美的眷顾——使自己化为我自己的种子，因为我是首先存在的；我行遍一切道路，因为我是光的丰盛。


    2. 我是圆满境界的记忆；但我进入了黑暗的领域，坚持前行，直到进入监牢中央。混沌的根基震动了；因他们邪恶，我便向他们隐藏自己，他们也没有认出我。


    3. 我又第二次返回，四处行走。


    4. 我从那些属光者中出来；这光就是我，因为我是眷顾的记忆。[a]


    5. 我进入黑暗中央和阴间深处，因为我正照管自己的使命。混沌的根基震动，几乎要坍塌在住于混沌的人身上，将他们毁灭；我便再次迅速上升，回到我的光之根，使他们不至于在预定的时候以前被毁灭。


    6. 我又第三次出来；我就是光中之光，就是眷顾的记忆。我进入黑暗中央和阴间深处，使自己的脸充满他们永世终局之光。[b] 我进入他们监牢的中央，也就是身体的监牢[c]，说：“凡听见的，要从沉沉的睡梦中起来！”他便哭泣，泪水流了下来。


    7. 他擦去自己苦涩的眼泪，说：“是谁呼唤我的名字？我既被监牢的锁链捆绑，这盼望又是从哪里临到我的？”


    8. 我又说：“我是纯净之光的眷顾。


    9. 我是童贞之灵的意念；她要把你提升到那配受赞美之地。[d]


    10. 起来吧！要记得，你就是那留心听从的人；要跟随你的根源，就是我这怜悯者。你要提防贫乏的天使、混沌的邪灵和一切设网罗捕捉你的人；也要警醒，防备沉沉的睡梦和阴间深处的禁锢。”


    11. 我又把他提升起来，以五印之水的光给他盖印，使死亡从此不能胜过他。看哪，我现在要升到完美的永世去了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我从那些属光者中出来；这光就是我”所依据的见证文本句法较为含混，也可理解为“我从属光者那里出来，而我属于光”。
    reason: 保留第4节身份关系与从属关系的真实歧义。
  - marker: b
    text: “他们永世终局之光”也可理解为“他们的永世达到完成时的光”；这里的“永世”还可能兼指一个时代或超世领域。
    reason: 说明aeon及consummation短语的多义性而不在正文中强行定解。
  - marker: c
    text: 见证文本在“身体”前有补入标记；“身体的监牢”中的“的”属于编者复原。
    reason: 保存原见证所注明的文本复原信息。
  - marker: d
    text: “童贞之灵”也可译作“处女之灵”；这里保留其称号性质，不进一步判定“灵”的身份。
    reason: 避免导入特定教义身份认定，同时交代词义选择。
lexical_decisions:
- source_word: Providence
  choice: 眷顾
  rationale: 保留具有位格色彩的神圣照管含义；较“天意”少宿命色彩，较“护理”更适合普通现代读者。
- source_word: Fullness
  choice: 圆满境界
  rationale: 此处是该文献宇宙论中的专门概念；加入“境界”以免被误读为单纯的充足状态。
- source_word: chaos
  choice: 混沌
  rationale: 保留其宇宙论领域与势力的双重色彩，不解释为一般的混乱。
- source_word: Hades
  choice: 阴间
  rationale: 表达死者或地下幽冥领域，不采用带有最终刑罚意味较强的“地狱”。
- source_word: aeon
  choice: 永世
  rationale: 保留其可指时代、永恒领域或位格化宇宙层级的张力，避免用某一学派固定译名消解歧义。
- source_word: root
  choice: 根源／光之根
  rationale: 依上下文分别译作较自然的“根源”和意象鲜明的“光之根”，保留归属与本源意象。
- source_word: five seals
  choice: 五印
  rationale: 直译仪式性术语，不擅自说明其具体礼仪或神学内涵。
theological_decisions:
- issue: Providence是否作为位格化发言者
  choice: 以“眷顾”为专名式称谓，并保留第一人称自述
  alternative: 译为抽象的“天意”或“神的护理”
  rationale: 原文将Providence作为行动、说话并自我认定的主体；译文不将其还原成抽象属性，也不额外认定为某一传统中的特定位格。
- issue: 身体作为监牢
  choice: 直译为“身体的监牢”
  alternative: 弱化为“肉身的限制”
  rationale: 保留文本鲜明且有张力的人类学表达，不以较温和措辞改写。
- issue: virginal Spirit的性别指涉
  choice: 在后续代词中译作“她”
  alternative: 用无性别指代或译作“它”
  rationale: 依见证文本的关系从句保留阴性指涉，同时不进一步界定其与传统圣灵论的关系。
- issue: aeon的终局之光
  choice: 译为“他们永世终局之光”并加注歧义
  alternative: 解释为“他们时代结束时的光”或“其宇宙层级完成之光”
  rationale: 原表达语义与归属关系不够明确，应在正文保持紧凑，在脚注呈现可能理解。
- issue: 五印之水的光
  choice: 保留语法关系为“以五印之水的光”
  alternative: 解释为五重洗礼、膏抹或特定入门仪式
  rationale: 不把可能的仪式背景转化为未经文本明确说明的宗派性解释。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。保留原文反复出现的“我就是／我是”自我宣告、宇宙论术语和身体监牢意象；适度调整长句标点以提高可读性。所给材料注明科普特语复核尚待完成，因此本稿严格作为依据公开领域英文见证形成的暂定译稿；删除打断句子的手稿页码«31»，并以脚注保存“身体”前复原标记的信息。
