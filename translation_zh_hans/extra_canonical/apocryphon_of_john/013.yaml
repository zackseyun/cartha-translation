id: APOJ.013
reference: Apocryphon of John — The Authorities Create Adam
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  text: '1. Further, through the light they saw the shape of the image inside the water, «15» and he said to the authorities attending him: ‘Come, let us create a man according to the image of God, and according to our likeness, so that his image will become a light for us.’


    2. Further, they created by means of their individual powers in agreement with the allotted attributes, and each authority provided an attribute by means of the shape of the image he had seen in its psychic (dimension).


    3. He created an entity according to the likeness of the perfect Primal Man, and they said: ‘Let us call him Adam, so that his name will become for us a power of light,’ and the powers commenced:


    4. The first one, {Goodness:2}, created a living bone, and the second, Providence, created a living sinew.


    5. The third, Divinity, created a living flesh, and the fourth, Lordship, created a living marrow.


    6. The fifth, Kingdom, created living blood.


    7. The sixth, Jealousy, created a living skin.


    8. The seventh, Understanding, created living hair.


    9. However, the host of the angels attended him, and they obtained from the authorities the seven substances of the life-soul to be able to create the sizes of the limbs and the sizes of the torso, and the correct functioning of all the parts with each other.


    10. The first one began creating the head; Eteraphaope-Abron created his head; Meniggesstroeth created the brain; Asterechmen, the right eye; Thaspomocham, the left eye; Yeronumos, the right ear; Bissoum, the left ear; Akioreim, the nose; «16» Banen-Ephroum, the lips; Amen, the teeth; Ibikan, the molars; Basiliademe, the tonsils; Achcha, the staphyle; Adaban, the neck; Chaaman, the vertebrae; Dearcho, the throat; Tebar, the right shoulder; N[..., the] left shoulder; Mniarchon, the right elbow; [...e, the] left elbow; Abilrion, the right underarm; Evanthen, the left underarm; Krys, the right hand; Beluai, the left hand; Treneu, the right-hand fingers; Balbel, the left-hand fingers; Kriman, the nails of the hands; Astrops, the right breast; Barroph, the left breast; Baoum, the right shoulder joint; Ararim, the left shoulder joint; Areche, the belly; Phthave, the navel; Senaphim, the abdomen; Arachethopi, the right ribs; Zabedo, the left ribs; Barias, the right hip; Phnouth, the left hip;
    Abenlenarchei, the marrow; Chnoumeninorin, the bones; Gesole, the stomach; Agromauma, the heart; Bano, the lungs; Sostrapal, the liver; Anesimalar, the spleen; Thopithro, the intestines; Biblo, the kidneys; Roeror, the sinews; Taphreo, the bodily spine; Ipouspoboba, the veins; Bineborin, the arteries; Aatoimenpsephei, to them belong the breath in every limb; Entholleia, all of the flesh; Bedouk, the right {bottom:6}; Arabeei, the left penis; Eilo, the twin; Sorma, the genitals; Gorma-Kaiochlabar, the right thigh; Nebrith, the left thigh; Pserem, the right leg kidneys; Asaklas, the left kidney; Ormaoth, the right leg; Emenun, the left leg; Knyx, the «17» right shin-bone; Tupelon, the left shin-bone; Achiel, the right knee; Phneme, the left knee; Phiouthrom, the right foot; Boabel, its toes; Trachoun, the left foot; Phikna, its toes; Miamai, the feet nails; Labernioum, [...]. However, those set over all these are seven: Athoth, Armas, Kalila, Jabel, Sabaoth, Cain, Abel. However, especially
    at work in the limbs are these: The head, Diolimodraza; the neck, Yammeax; the right shoulder, Yakoubib; the left shoulder, Yerton; the right hand, Oudidi; the left (hand), Arbao; the right-hand fingers, Lampno; the left-hand fingers, Leekaphar; the right breast, Barbar; the left breast, Imae; the chest, Pisandraptes; the right shoulder joint, Koade; the left shoulder joint, Odeor; the right ribs, Asphixix; the left ribs, Synogchouta; the belly, Arouph; the womb, Sabalo; the right thigh, Charcharb; the left thigh, Chthaon; all the genitals, Bathinoth; the right leg, Choux; the left leg, Charcha; the right shin-bone, Aroer; the left shin-bone, Toechtha; the right knee, Aol; the left knee, Charaner; the right foot, Bastan; its toes, Archentechtha; the left foot, Marephnounth; its toes, Abrana.


    11. Those who wield power over all these are seven, 7: Michael, Ouriel, Asmenedas, Saphasatoel, Aarmouriam, Richram, Amiorps.


    12. Further, those who control the senses: Archendekta; and he who controls perception: Deitharbathas; and he who controls imagination: Oummaa; and he who controls proportioning: «18» Aachiaram; and he who controls all impulses: Riaramnacho.


    13. However, the origin of the demons that dwell in all the body is set at four: heat, cold, wetness, and dryness.


    14. However, the mother of all of them is matter, but he who rules over heat, Phloxopha; but he who rules over cold, Oroorrothos; but he who rules over dryness, Erimacho; but he who rules over wetness, Athuro.


    15. However, the mother of all of these, Onorthochras, stands among them, because she is the one who is without limit, and she combines with them all, and she really is matter, because she nourishes them.


    16. The four chief demons (are): Ephememphi, who pertains to pleasure; Yoko, who pertains to lust; Nenentophni, who pertains to grief; Blaomen, who pertains to fear.


    17. However, the mother of all of them (is) Esthensis-Ouch-Epi-Ptoe.


    18. Passions issued forth from the four demons, but from grief: envy, jealousy, misfortune, trouble, pain, cruelty, anxiety, lamentation, and so on.


    19. However, from pleasure arise plentiful evil, and vacuous arrogance, and the like.


    20. However, from lust: anger, fury, and bitterness, and bitter passion, and never being satisfied, and the like.


    21. However, from fear: horror, groveling, misery, and humiliation.


    22. All these resemble things virtuous, but also things vicious.


    23. However, insight into their reality (comes from) Anaro, the chief of the hylic soul, «19» because it pertains to the seven senses, to Ouch-Epi-Ptoe.


    24. Here is the number of the angels: all together, they are 365.


    25. All of them worked on it, limb by limb, until they finished both the psychic and the hylic body.


    26. In addition to these, there are others who control the remaining passions.


    27. Although I have not listed them for you, if you want to know who they are, this is (all) written in the Book of Zoroaster.'
