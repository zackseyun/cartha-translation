    9. However, the host of angels attended him, and they obtained from the authorities the seven substances of the life-soul, so that they could create the sizes of the limbs and the sizes of the torso, and the proper functioning of all the parts with one another.


    10. … However, those especially at work in the limbs are these: the head, Diolimodraza; the neck, Yammeax; the right shoulder, Yakoubib; the left shoulder, Yerton; the right hand, Oudidi; the left (hand), Arbao; the right-hand fingers, Lampno; the left-hand fingers, Leekaphar; the right breast, Barbar; the left breast, Imae; the chest, Pisandraptes; the right shoulder joint, Koade; the left shoulder joint, Odeor; the right ribs, Asphixix; the left ribs, Synogchouta; the belly, Arouph; the womb, Sabalo; the right thigh, Charcharb; the left thigh, Chthaon; all the genitals, Bathinoth; the right leg, Choux; the left leg, Charcha; the right shinbone, Aroer; the left shinbone, Toechtha; the right knee, Aol; the left knee, Charaner; the right foot, Bastan; its toes, Archentechtha; the left foot, Marephnounth; its toes, Abrana.


    17. However, the mother of all of them (is) Esthensis-Ouch-Epi-Ptoe.


    23. However, insight into their reality (comes from) Anaro, the chief of the hylic soul, because it pertains to the seven senses, to Ouch-Epi-Ptoe.


    27. Although I have not listed them for you, if you want to know who they are, this is (all) written in the Book of Zoroaster.'
translation:
  language: zh_hans
  text: '2. 此外，他们各自运用自己的能力，按照所分配的属性进行创造。每一位掌权者都照着自己在那形象的魂性层面[a]所看见的样式，赋予一个属性。


    9. 然而，众天使在他身旁侍立；他们从众掌权者那里取得生命之魂的七种成分，好塑造四肢和躯干各自的尺度，并使身体各部分彼此协调、正常运作。


    10. ……然而，在各肢体中特别发挥作用的有这些：头部由迪奥利姆德拉扎掌管；颈部，雅梅阿克斯；右肩，雅库比布；左肩，耶尔顿；右手，乌迪迪；左手，阿尔巴奥；右手的手指，兰普诺；左手的手指，莱卡法尔；右胸，巴尔巴尔；左胸，伊迈；胸膛，皮桑德拉普特斯；右肩关节，科阿德；左肩关节，奥德奥尔；右侧肋骨，阿斯菲克西克斯；左侧肋骨，西诺格库塔；腹部，阿鲁夫；子宫，萨巴洛；右大腿，哈尔哈尔布；左大腿，赫塔翁；全部生殖器官，巴提诺特；右腿，库克斯；左腿，哈尔哈；右胫骨，阿罗埃尔；左胫骨，托埃赫塔；右膝，阿奥尔；左膝，哈拉内尔；右脚，巴斯坦；右脚趾，阿尔亨特埃赫塔；左脚，马雷夫农特；左脚趾，阿布拉纳。


    17. 然而，它们共同的母亲是埃斯滕西斯－乌赫－埃皮－普托厄。


    23. 然而，对它们实情的认识来自阿纳罗——属质之魂[b]的首领；因为这与七种感官有关，也与乌赫－埃皮－普托厄有关。[c]


    27. 我虽没有为你一一列出它们，但你若想知道它们是谁，这一切都记在《琐罗亚斯德书》中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “魂性”译自技术词 psychic，指与“魂”相关的层面或维度；这里不宜简单理解为现代意义上的“心理”。
    reason: 解释技术术语，同时避免过度诠释。
  - marker: b
    text: “属质”译自 hylic，意为属于物质层次或由物质构成；这是本文的技术用语。
    reason: 保留该文献的层次区分，并帮助现代读者理解。
  - marker: c
    text: 本句在现有见证中的句法和指代关系不够明确；“这”究竟主要指认识、阿纳罗、属质之魂，还是与七种感官及乌赫－埃皮－普托厄之间的关系，尚难确定。
    reason: 公开呈现源文本歧义，不在译文中擅自消解。
lexical_decisions:
- source_word: psychic (dimension)
  choice: 魂性层面
  rationale: 保留该文献中与魂相关的技术性层次观念，同时用现代汉语“层面”使句子可读；不径自解释为“精神”或“心理”，以免抹平其宇宙论含义。
- source_word: authorities
  choice: 掌权者
  rationale: 既表达这些存在所拥有的权柄，也避免直接套用某一教派的固定阶级名称。
- source_word: life-soul
  choice: 生命之魂
  rationale: 保留“生命”与“魂”的复合关系，不简化为一般的“灵魂”。
- source_word: hylic soul
  choice: 属质之魂
  rationale: hylic 源于表示物质的术语；译为“属质”可与“魂性”区别，又不武断等同于现代哲学意义上的唯物主义。
- source_word: proper functioning
  choice: 彼此协调、正常运作
  rationale: 自然表达身体各部分相互配合并发挥适当功能的意思。
- source_word: Book of Zoroaster
  choice: 《琐罗亚斯德书》
  rationale: 采用现代汉语中较通行的人名译法，并保留书名形式；不判断其与现存或已知琐罗亚斯德文献的关系。
theological_decisions:
- issue: “魂性”与“属质”两个技术范畴
  choice: 保留为彼此有别的技术表达，并加注说明
  alternative: 统一译作“灵性”或“物质性”
  rationale: 原文所呈现的层次区分具有神学和宇宙论意义，统一或通俗化会提前解决文本本身的张力。
- issue: 第23节句法和指代关系不明确
  choice: 正文尽量贴近见证文本，并以脚注说明歧义
  alternative: 明确断定“它”只指阿纳罗、七种感官或乌赫－埃皮－普托厄之一
  rationale: 现有英文见证中的关系链并不清楚，且科普特语原文复核尚待进行，不宜在译文中强行确定。
- issue: 众掌权者和天使参与造人的叙述
  choice: 按文献自身叙事直译，不以正典《创世记》的术语体系加以协调
  alternative: 改写为与某一传统创造论一致的措辞
  rationale: 应保存本篇文献独特的神学张力，不导入宗派性解释。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。技术词保留必要的陌生感，人名按英文见证作近似音译；未将其强行规范为其他传统中的既定译名。省略号依照所给英文 POB 节选保留，表明第10节前文未收入本段。当前草案依据所给公共领域英文见证及其审校层，科普特语原文复核尚待进行。
