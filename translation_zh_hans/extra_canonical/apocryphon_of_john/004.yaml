translation:
  language: zh_hans
  text: '1. 这是因为，除了那位从他而出的，也就是[父]以外，[我们并不]明白[不可言说之事，也]不明白那[不可测度的事]；因为唯有他向我们[阐明]了这一切。他在环绕自己的光中察看自[己]；这光就是活水的泉源。他供应[每一个永世]，又凝望[灵]的泉源，同时从各个方向观看自己的形像。


    2. 他把自己的意愿置于他的[水之]光中；这光[住在]环绕他的[纯净光]水泉源里。他[潜在的意念化为]实在；她近前来，[就是]那曾在他面前、在他光的[辉耀中显现]的。


    3. 她是第一[能力，在万有]以先[就已存在]，并且从他的心思中[发出]。


    4. 她[是万有的眷顾]——她的光[如同他的]光辉耀——是[完全的]能力，是那完全、不可见、童贞之灵的形像。


    5. [第一能力]就是巴贝罗的荣耀，是永世之中的完全荣耀，是启示的荣耀。[a]


    6. 她尊崇童贞之灵，赞美他，因为她是因他而发出的。


    7. 她就是第一意念，是他的形像。'
