lexical_decisions:
- source_word: aeon
  choice: 永世
  rationale: 此处指超越普通时间单位的属灵领域或存在层次；“永世”保留其时间与宇宙论双重含义，避免直接音译造成正文晦涩。
- source_word: Providence
  choice: 眷顾
  rationale: 原词可指预见、筹划或护理；采用“眷顾”保留人格化的女性形象，又不把含义限定为后期教义术语“天命/护理”。
- source_word: power
  choice: 能力
  rationale: 既可指能力，也可指人格化的权能；“能力”较贴近见证文本，并让上下文中的女性代词表明其人格化。
- source_word: thought
  choice: 意念
  rationale: 区别于一般思考活动，并适合此处人格化、由潜在转为实在的宇宙论语境。
- source_word: Barbelo
  choice: 巴贝罗
  rationale: 作为专名音译，不用解释性称号替代。
- source_word: virginal Spirit
  choice: 童贞之灵
  rationale: 保留原文不寻常的修饰关系及其神学张力，不改写为“纯洁的灵”或加入性别解释。
- source_word: the All
  choice: 万有
  rationale: 表达宇宙整体，符合现代宗教汉语，同时不把它窄化为受造界。
- source_word: water-light / light-water
  choice: 水之光／光水
  rationale: 保留见证文本刻意交叠的水与光意象；不将两种复合表达强行统一。
theological_decisions:
- issue: “从他而出”的所指及父与启示者的关系
  choice: 保留代词链，并以“那位从他而出的，也就是[父]”直译见证文本
  alternative: 明确改写为“从父而出的那一位”或认定“从他而出的”就是父
  rationale: 现有英文见证的句法和所指含混，且科普特语复核尚待进行；不宜替文本消除歧义。
- issue: 第一能力/第一意念的人格与性别
  choice: 依见证文本使用“她”
  alternative: 使用中性“它”或把她直接等同于某一教义位格
  rationale: 文本明确以女性代词人格化此形象；保留这种表达，但不额外作教义认定。
- issue: “眷顾”与巴贝罗的关系
  choice: 按上下文并列呈现为同一女性形象的称号与荣耀
  alternative: 把“眷顾”解释成独立位格，或在正文中直接加注“即巴贝罗”
  rationale: 段落结构暗示关联，但没有必要在正文中增加超出见证的明确同一化公式。
- issue: 灵的“泉源”与“童贞”称号
  choice: 保留原有意象和称号
  alternative: 改写成正统教义化表达或抽象哲学术语
  rationale: 这些表达构成文本自身的宇宙论语言，应保留其陌生感与神学张力。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。因科普特语源文复核尚待完成，本稿以所提供的公共领域英文见证为暂定依据；保留方括号、代词歧义及水—光复合意象，不以宗派术语消解文本张力。
