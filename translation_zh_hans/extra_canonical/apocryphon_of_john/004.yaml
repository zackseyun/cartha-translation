  naturalness: 整体庄重、可读，符合现代书面汉语。个别处可通过调整语序和复合意象的连接方式，既减少歧义，也不消除原见证本有的含混。
  terminology: “永世”“万有”“眷顾”“童贞之灵”“巴贝罗”等选择可保留。为与复合词的呈现一致，water-light / light-water 宜译作“[水]光”及“[纯净光]水”，避免“水之光”引入原文未明示的属格关系。
  issues:
  - severity: medium
