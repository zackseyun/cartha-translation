translation:
  language: zh_hans
  text: '《约翰秘传》——约翰与法利赛人


    1. 救主的教导、[奥秘的启示]，以及隐于静默中的话语，就是他教给[他的]门徒约翰的这些话。[a]


    2. [有一天]，约翰——雅各的[兄弟]，二人都是西庇太的儿子——上圣殿去。有一个名叫阿里马尼奥斯的法利赛人[来到]他面前，[对]他说：“你一直跟随的老师[在哪里]？”


    3. 他[回答]说：“他已经回到自己所[来自]的地方去了。”


    4. 那法利赛人[对他说：“这个拿撒勒人用诡诈]欺骗了你们所有人；他把[谎言灌进你们耳中]，又封闭[你们的心，使你们]背离[祖先的]传统。”


    5. [我约翰]听见这些话以后，[便离开]圣殿，[往一处群山环绕的荒野去]。我心里[万分悲痛，问道]：


    6. “救主是怎样[被设立]的？为什么[他的父]差遣他[到世上来]？差遣他的父究竟是谁？我们[将要前往的]又是怎样的永世[b]？


    7. 因为他对我们所说的这句话究竟是什么意思：‘你们[将要前往的]那个永世，是一个[不可毁灭的]永世’？


    8. [可是，他并没有]告诉我们那究竟是[怎样的永世]。”'
