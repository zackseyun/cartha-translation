lexical_decisions:
- source_word: savior
  choice: 救主
  rationale: 采用现代中文宗教文献中自然且庄重的对应语，不额外限定其神学身份。
- source_word: aeon
  choice: 永世
  rationale: 此处既可指时代、永恒领域或超越性的世界秩序；“永世”保留时间与领域两方面的张力，并以脚注说明。
- source_word: appointed
  choice: 被设立
  rationale: 保留原见证中“appointed”的被动意味，不擅自解释为受造、受膏或任命担任某一特定职分。
- source_word: dispatched
  choice: 差遣
  rationale: “差遣”自然表达由父派出执行使命，同时避免加入目的或方式。
- source_word: Nazarene
  choice: 拿撒勒人
  rationale: 按地域称谓翻译，不将其扩展成教派名称。
- source_word: traditions of your fathers
  choice: 祖先的传统
  rationale: 以现代中文表达世代承袭的传统；不把“fathers”专门解释为某一特定宗教权威群体。
- source_word: Arimanios
  choice: 阿里马尼奥斯
  rationale: 按所供英文见证音译人名，不猜测其词源或身份。
theological_decisions:
- issue: 救主“被设立”的性质
  choice: 直译为“被设立”
  alternative: 被任命、被差遣、受膏或受造
  rationale: 底本文句本身留下救主如何取得其地位的问题；译文不预先解决相关基督论张力。
- issue: 父与救主的关系
  choice: 保留约翰关于“他的父究竟是谁”的发问
  alternative: 将“父”明确等同于某一预设的神学身份
  rationale: 叙事在此有意悬置答案，应让后文自行展开。
- issue: aeon 的含义
  choice: 译作“永世”并加注
  alternative: 永恒、时代、世界、神域
  rationale: 单一译作“时代”会削弱其空间或超越领域色彩，译作“世界”又会丢失时间维度。
