translation:
  language: zh_hans
  text: '《约翰密传》——太一


    1. [我也]求问，要[明白这事；他便对]我说：“太一[a][是独一的，任何事物都不]在它之上。


    2. [它就是那位作为]上帝、作为万有之父而[存在]的[不可见者]；他高于[万有，以]不朽、[以]纯净的光[存在]，没有任何[眼睛]能够注视这光。


    3. 他[是]不可见的[灵]。把他[想成]一位神或任何类似的事物，都是不恰当的，因为他不只是一位神；没有什么在他之上，也没有谁统治他。


    4. [这是因为他]并不[存在于]任何从属于[他的事物之中；万物]反而存在于他里面，因为他是自[立]的。


    5. [他是永恒的]，因为他一无所需；[他]是完全的完美。


    6. [他毫无欠缺]，不需要由[任何事物]使他达到完全。


    7. [相反]，他在[光中]永远全然完美。


    8. 他[没有界限]，因为在他[以前]没有谁能为他划定界限。


    9. 他深不可测，[因为]在他以前没有谁能[测透他]。


    10. [他]不可度量，因为在他以前没有谁[能度量]他。


    11. [他不可见，因为没]有人见过[他]。


    12. [他是永恒的]，因为他[永远存在]。


    13. 他[不可言说，因为]没有谁能够构想他，从而谈论[他]。


    14. 他不可命名，因为[在他以前没有谁]能为[他]命名。


    15. 他是[无量的光]，纯净、神圣、[毫无玷污]。


    16. 他不可言说，[存在于完全的]不朽之中。


    17. 他[不]受限于完美之内，也不受限于福乐或神性之内；他远远超越（这一切）。


    18. 他既不是有形体的，也[不是]无形体的。


    19. 他既不大，[也]不小。


    20. [不能]说他有数量或[有性质]，因为没有人能[领悟他]。


    21. 他不是众[存在者]中的一个存在者，却远远超越；[这并]不是说他仿佛比别的存在者更高，而是说他本身就是崇高的。


    22. 他既不[属于]诸永世[b]，也不属于时间，因为凡属于一个先前已设立的[永世]者……


    23. 他[并非]没有被赋予时间的尺度[c]，[因为]他不从别人那里取得任何东西；[若取得，就会是]借来的。那先于别人而存在的，[不需要]从[别人]接受什么。


    24. 这是因为他在[自己的]光中注视自己，静候着；因为那……是荣耀的。


    25. 无量的纯净属于他。


    26. 他是赐下诸永世的永世。


    27. 他是赐下生命的[生命]。


    28. 他是赐下福乐的有福者。


    29. 他是赐下知识的知识。


    30. [他是]赐下良善的良善。


    31. [他是]怜悯和救赎，[赐下怜悯]。


    32. 他是赐下恩典的恩典；


    33. [这并]不是因为恩典归他所有，而是因为他赐下那无量而不可领悟的[光]。


    34. [我怎能向]你述说他呢？[他的永世]不受毁坏，安息并住在[静默中，宁静不动]；他先于[万物而存在，因为他]是[一切]永世的首领，[并且]以自己的良善赐给它们力量。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太一”译自 Monad，指不可再分、没有任何事物在其上的最高统一体；这里不应自动等同于中国传统思想中的同名概念。
    reason: 核心术语具有特定古代宇宙论含义，且中文现成词可能引发跨传统联想。
  - marker: b
    text: “永世”译自 aeon。本文中它既可表示超越通常时间的永恒领域，也可指属于这些领域的位格化存在。
    reason: 保留原词在宇宙论和存在论层面的多义性。
  - marker: c
    text: 本句底本呈双重否定：“[并非]没有被赋予……”。由于文本残损且读法困难，正文按现有见证保留，未改成较顺的“没有被赋予”。
    reason: 明确标示文本难点，避免把推测性校订当作确定原文。
lexical_decisions:
- source_word: monad
  choice: 太一
  rationale: 用“太一”表达不可再分、无物在其上的最高统一体；加注说明，以免与中国传统哲学概念完全等同。
- source_word: the All
  choice: 万有
  rationale: 保留宇宙论语境中总体性的称谓，比“所有事物”更凝练庄重。
- source_word: aeon
  choice: 永世
  rationale: 该词在本文既可指超时间领域，也可指其位格化的存在；“永世”保留这种张力，并以脚注交代。
- source_word: indestructibility
  choice: 不朽
  rationale: 在此指不受败坏与毁灭的状态；“不朽”自然而庄重。
- source_word: self-established
  choice: 自立
  rationale: 表达其存在不依赖外在根据；避免译成带现代政治意味的“自主”。
- source_word: somatic / non-somatic
  choice: 有形体的／无形体的
  rationale: 保留原文对两类范畴同时否定的悖论，不改写为单纯的“非物质”。
theological_decisions:
- issue: “more than a god”的超越性表述
  choice: “他不只是一位神”
  alternative: “他高于神”
  rationale: 避免暗示存在一个独立于他的等级标准，同时保留文本否定普通神类范畴的力度。
- issue: 第17—21段的否定神学
  choice: 保留成对否定和“本身就是崇高的”
  alternative: 概括为“他超越一切范畴”
  rationale: 原文藉悖论维持神不可归类的张力，不宜替作者系统化。
- issue: 第23段疑难双重否定
  choice: “他[并非]没有被赋予时间的尺度”
  alternative: 校顺为“他没有被赋予时间的尺度”
  rationale: 按所给见证保留困难读法，不擅自消除可能源自残损或传抄的双重否定，并加注提示。
- issue: 第33段“not because it belongs to him”
  choice: 直译为“不是因为恩典归他所有”
  alternative: 解释为“不是说他领受了恩典”
  rationale: 原句所指与论证关系并不完全清楚，直译可避免过早消解歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。方括号、圆括号和省略号依所给见证保留，以标示补足、编辑性说明及残缺。当前只能依据所提供的公共领域英文见证起草；科普特语原文复核仍待进行，因此对第22—24、31—34段尤其采取审慎直译。
