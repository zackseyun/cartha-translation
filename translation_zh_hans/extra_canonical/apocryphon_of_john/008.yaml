translation:
  language: zh_hans
  text: '1. 此外，从完美心智的预知，借着不可见之灵与自生者旨意的显明，出现了完美的人——最初的显现，也就是真理。


    2. 他就是童贞之灵所命名的皮革拉—阿达马斯[a]。童贞之灵立他在第一永世之上，使他与大能者——自生者基督——同在；他处于第一道光阿摩泽尔那里，由阿摩泽尔的众能力护送。


    3. 此外，那不可见者赐给他一种属灵、不可伤害的力量。


    4. 他开口尊崇、颂赞不可见之灵，说：“万有因你而产生，万有也必归回于你。


    5. 我要颂赞、尊崇你和自生者，以及三个永世——父、母、子——那完美的能力。”


    6. 他也立自己的儿子塞特在第二永世之上，处于第二道光奥罗伊埃尔面前；在第三永世之内，塞特的后裔被立在第三道光达维泰那里，圣者的灵魂也被安置在其中。


    7. 此外，在第四永世之内，安置了那些不认识圆满境界的人之灵魂；他们没有立刻悔改，反而有一段时间仍旧不悔改，后来才悔改。


    8. 这些就是第四道光埃勒勒特。[b]


    9. 这些是颂赞不可见之灵的受造者。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮革拉—阿达马斯”是音译名；所据英语见证作 Pigera-Adama(s)，末尾字母是否属于名称尚有不确定性。
    reason: 说明专名的文本不确定性，并避免中文音译制造虚假的确定感。
  - marker: b
    text: 本句照所据见证保留“这些”与单数“第四道光”的不寻常搭配；也可能涉及传抄、翻译或句法理解问题。
    reason: 保存第8段真实的语法及文本张力，不作无依据的调和。
lexical_decisions:
- source_word: Precognition of Perfect Mind
  choice: 完美心智的预知
  rationale: 保留该宇宙论术语的抽象性与可能的位格意味；因尚未完成科普特文复核，不擅自改作“先见”或“预先认识”。
- source_word: unseen Spirit
  choice: 不可见之灵
  rationale: 采用自然且形式对应的现代汉语，保留“不可见”这一神学属性。
- source_word: self-generated one
  choice: 自生者
  rationale: 以简洁名词形式表达技术性称号，避免释为“受造者”或“独生者”而混入其他神学范畴。
- source_word: Perfect Man
  choice: 完美的人
  rationale: 保留“人”的基本含义及作为宇宙论原型的称号感，不将其解释性地译为“完人”或“原人”。
- source_word: aeon
  choice: 永世
  rationale: 兼顾该词的时空领域及拟位格化背景；不直接音译，以便普通读者理解，同时避免简化为纯粹的“时代”。
- source_word: the All
  choice: 万有
  rationale: 表达总体存在界，符合汉语宗教哲学语域，并保留其整体性。
- source_word: Fullness
  choice: 圆满境界
  rationale: 既保留技术词的“圆满”含义，又用“境界”提示这里指神圣圆满领域，而非一般意义的充足。
- source_word: seed of Seth
  choice: 塞特的后裔
  rationale: 在群体语境中译作“后裔”比字面的“种子”自然，同时不限定为肉身血统。
- source_word: invulnerable strength
  choice: 不可伤害的力量
  rationale: 保留其不受损害或攻击的性质，不进一步解释为“不朽”。
theological_decisions:
- issue: “完美的人”的发出或出现方式
  choice: 译为“出现了”，并以破折号标明其同位说明
  alternative: “发出了”或“流溢出了”
  rationale: 英语见证以括号补出 issued forth，底本复核尚待进行；采用较中性的“出现了”以免过度确定流溢论机制。
- issue: 第一永世段落中人物及地点关系
  choice: 保留“与……同在；处于第一道光……那里”的层次
  alternative: 将阿摩泽尔直接解释为基督的能力或把所有成分合并为单一同位结构
  rationale: 原句句法密集且关系可能有歧义，中文不强行消除其宇宙论层级的张力。
- issue: 父、母、子与“三个永世”的关系
  choice: 用破折号保留同位关系
  alternative: 译成“三个永世中的父、母、子”或把“完美的能力”只限定于“子”
  rationale: 见证文本标点不能完全解决“完美的能力”的修饰范围，因此保留开放性。
- issue: 悔改者灵魂的状态
  choice: 明确其先延迟、后来悔改的时间顺序
  alternative: 将 continued 理解为一般意义的“持续存在”
  rationale: 上下文括注支持“不悔改状态持续一段时间”，但不进一步规定其末世归宿。
- issue: 第8段复数指示词与单数“第四道光”的异常搭配
  choice: 直译为“这些就是第四道光埃勒勒特”
  alternative: 调和为“这就是第四道光”或“他们属于第四道光”
  rationale: 按要求保存见证中的异常措辞，不在科普特文复核前擅自校正。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。宇宙论技术词尽量稳定统一，专名音译；避免套用后世宗派术语。由于目前仅据公共领域英语见证起草、科普特文复核尚待完成，凡句法或文本有疑处均采取较保守译法，并以脚注标示关键不确定性。
