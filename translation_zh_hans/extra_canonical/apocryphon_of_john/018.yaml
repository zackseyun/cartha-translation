  revised_text: '1. 我又问救主：“主啊，那么所有的灵魂都会被平安引入纯净的光中吗？”


    2. 他回答我说：“你心里生出了重大的问题，因为这些事很难向别人解释，只有那不动摇族类的人例外。[a]


    3. 生命之灵将临到一些人身上，并赐给他们能力；他们必得救，成为完全，也配得那‘伟大者’。[b] 在那里，他们必得洁净，脱离一切邪恶，也不再参与邪恶。


    4. 因此，他们只关心不朽，从今以后也一心专注于此；他们没有愤怒、嫉妒、猜忌、情欲，也不贪求任何东西。除了肉身生存的处境，没有什么能搅扰他们；他们会忍受这种处境，热切等候接收者来迎接他们的时候。[c]


    5. 所以，这样的人配得不朽的永恒生命和蒙拣选的福分，因为他们抵挡一切、忍耐一切，好完成竞赛，承受永恒生命。”


    6. 我问他：“主啊，有些人虽有那能力〈和〉生命之灵临到他们身上，却没有行出这些事；他们的灵魂会被［弃绝］吗？”[d]


    7. 他回答我说：“如果那灵临到他们身上，他们仍会得救，也会改正，因为那能力将临到所有人身上；离了它，没有人能忍耐到底。


    8. 然而，在人出生以后，随着生命之灵增长，那能力来到并坚固那灵魂，就没有人能用恶行使它走入歧途。


    9. 但虚假之灵临到的人，却被它拖走，引入歧途。”


    10. 我问：“主啊，他们的灵魂离开肉身以后，会到哪里去呢？”


    11. 他微微一笑，对我说：“若一个灵魂里面的能力胜过卑劣之灵——因为这能力强盛，使它逃避邪恶——那么，借着那不朽者的介入，它必得救，被带上去，进入诸永世的安息。”[e]


    12. 我问：“主啊，那些不知道自己属于谁的人，他们的灵魂会住在哪里呢？”


    13. 他对我说：“在这些人里面，卑劣之灵强盛起来时，他们就走入歧途。它压制灵魂，把灵魂拖去行恶，又将它抛入遗忘之中。灵魂离开肉身以后，就被交给那些借着统治者而产生的掌权者；他们用锁链捆绑它，把它投入监牢，并押解看守它，直到它从遗忘中醒来，获得知识。它若这样达到完全，就必得救。”[f]


    14. 我问：“主啊，灵魂怎么会变小，回到其母亲的自然状态，或进入男人里面呢？”[g]


    15. 我这样问，他就欢喜，对我说：“你实在有福，因为你已经明白：这样的灵魂将被使接续另一个人；那人里面有生命之灵。[h]


    16. 它会借着那人得救，


    17. 不会再被投入另一个肉身。”


    18. 我又问：“主啊，那些原本知道、后来却背离的人，他们的灵魂会到哪里去呢？”


    19. 他对我说：“他们会被带到贫乏天使所去的地方；那里没有悔改。他们会被拘禁，等候亵渎那灵的人受折磨之日，并要受到历经一个世代的惩罚。”[i]'
