translation:
  language: zh_hans
  text: '1. 我又问救主：“主啊，那么所有的灵魂都会被平安引入纯净的光中吗？”


    2. 他回答我说：“你心里生出了重大的问题，因为这些事很难向别人解释，只有那不动摇族类的人例外。[a]


    3. 生命之灵将临到一些人身上，并赐给他们能力；他们必得救，成为完全，也配得那‘伟大者’。[b] 在那里，他们必得洁净，脱离一切邪恶，也不再参与邪恶。


    4. 因此，他们只关心不朽，从今以后也一心专注于此；他们没有愤怒、嫉妒、猜忌、情欲，也不贪求任何东西。除了肉身生存的处境，没有什么能搅扰他们；他们会忍受这种处境，热切等候被接引者迎接的时刻。[c]


    5. 所以，这样的人配得不朽的永恒生命和蒙拣选的福分，因为他们抵挡一切、忍耐一切，好完成竞赛，承受永恒生命。”


    6. 我问他：“主啊，有些人虽有那能力和生命之灵临到他们身上，却没有行出这些事；他们的灵魂会被［弃绝］吗？”[d]


    7. 他回答我说：“如果那灵临到他们身上，他们仍会得救，也会改正，因为那能力将临到所有人身上；离了它，没有人能忍耐到底。


    8. 然而，在人出生以后，随着生命之灵增长，那能力来到并坚固那灵魂，就没有人能用恶行使它走入歧途。


    9. 但虚假之灵临到的人，却被它拖走，引入歧途。”


    10. 我问：“主啊，他们的灵魂离开肉身以后，会到哪里去呢？”


    11. 他微微一笑，对我说：“若一个灵魂里面的能力胜过卑劣之灵——因为这能力强盛，使它逃避邪恶——那么，借着那不朽者的介入，它必得救，被带上去，进入诸永世的安息。”[e]


    12. 我问：“主啊，那些不知道自己属于谁的人，他们的灵魂会住在哪里呢？”


    13. 他对我说：“在这些人里面，卑劣之灵强盛起来时，他们就走入歧途。它压制灵魂，把灵魂拖去行恶，又将它抛入遗忘之中。灵魂离开肉身以后，就被交给那些借着统治者而产生的掌权者；他们用锁链捆绑它，把它投入监牢，并押解看守它，直到它从遗忘中醒来，获得知识。它若这样达到完全，就必得救。”[f]


    14. 我问：“主啊，灵魂怎么会变小，回到母腹原有的状态，或进入男人里面呢？”[g]


    15. 我这样问，他就欢喜，对我说：“你实在有福，因为你已经明白：这样的灵魂会被安排接续另一个人；那人里面有生命之灵。[h]


    16. 它会借着那人得救，


    17. 不会再被投入另一个肉身。”


    18. 我又问：“主啊，那些原本知道、后来却背离的人，他们的灵魂会到哪里去呢？”


    19. 他对我说：“他们会被带到贫乏天使所去的地方；那里没有悔改。他们会被拘禁，等候亵渎那灵的人受折磨之日，并要受到历经一个世代的惩罚。”[i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不动摇族类”是本书中的特殊称谓，也可理解为“不受动摇的族类”。这里不确定它是描述性质，还是一个固定群体名称。
    reason: 保留专门术语的可能性及源文语义范围。
  - marker: b
    text: “那‘伟大者’”原见证直译为“伟大（Greatness）”，可能是对至高神圣实在的称号，也可能指其伟大境界。
    reason: 避免把抽象名词的神学所指过度确定化。
  - marker: c
    text: “接引者”指负责迎接或接收他们的存在；其确切身份在本段没有说明。
    reason: 解释不常见的宇宙论职能词而不增添身份判断。
  - marker: d
    text: 方括号表示“弃绝”是残缺处的编者补词；“能力和生命之灵”中的“和”也来自编者补入。
    reason: 保存见证文本的校勘信号。
  - marker: e
    text: “诸永世”译自复数 aeons；在本书语境中，它既可指漫长的永世，也可能指宇宙中的超越领域。
    reason: 提示该术语的时间与空间双重可能。
  - marker: f
    text: “统治者”与“掌权者”是本书宇宙论中的辖制性存在；本段说后者借着前者而产生。
    reason: 帮助读者理解两个相近但有区别的称谓。
  - marker: g
    text: 本问句的措辞含混。“回到母腹原有的状态，或进入男人里面”也可能涉及灵魂再次进入人的生育或肉身状态；现有见证不足以确定。
    reason: 标明英文见证本身难解之处，避免误定为明确的轮回论。
  - marker: h
    text: “接续另一个人”也可理解为“继承另一个人”或“被交给另一个人”。这里所说的具体过程并不清楚。
    reason: 保存 succeed another 的词义歧义。
  - marker: i
    text: “历经一个世代”译自 age-long；它可以强调属于一个“世代／永世”的持续时间，是否等于无穷无尽，本句本身没有完全说明。
    reason: 保留惩罚期限的神学与词义张力。
lexical_decisions:
- source_word: unmoving race
  choice: 不动摇族类
  rationale: 保留该文献的专门群体称谓及其陌生感；“不动摇”兼顾稳定、不受扰动之义，不把它解释为某一具体教派。
- source_word: Spirit of life
  choice: 生命之灵
  rationale: 采用自然而正式的汉语结构，并与“虚假之灵”形成文本中的对照。
- source_word: the Greatness
  choice: 那‘伟大者’
  rationale: 英文见证使用带定冠词的抽象名词，语境可能指超越性的神圣实体；以引号提示其称号性质，同时不武断等同于特定神名。
- source_word: indestructibility / indestructible one
  choice: 不朽／那不朽者
  rationale: 前者表达不可败坏的状态，后者保留人格化称号；用相关词形呈现二者联系。
- source_word: receivers
  choice: 接引者
  rationale: 表达迎接并接收灵魂的职能，避免擅自明确其身份为天使或其他存在。
- source_word: false spirit / vile spirit
  choice: 虚假之灵／卑劣之灵
  rationale: 见证文本使用两个不同表达，译文维持区别，不将二者自动合并为同一术语。
- source_word: aeons
  choice: 诸永世
  rationale: 保留复数和该传统中的宇宙论色彩；不简化成单数“永恒”，也不音译成普通读者难懂的术语。
- source_word: archon
  choice: 统治者
  rationale: 取该词的基本统治、辖制之义；与后文“掌权者”相区别，同时避免无解释音译。
- source_word: knowledge
  choice: 知识
  rationale: 保留原见证的一般词义及其可能具有救赎意义的张力，不扩译为带特定宗派含义的“灵知”。
- source_word: age-long punishment
  choice: 历经一个世代的惩罚
  rationale: 呈现与“世代／永世”相关的时限表达，避免直接定为“永远的惩罚”或短暂刑罚。
theological_decisions:
- issue: 能力是否普遍临到所有人
  choice: “那能力将临到所有人身上”
  alternative: 将“所有人”限制为前述某类人
  rationale: 见证文本明确使用“all people”，译文保留其普遍措辞，不以体系化教义缩小范围。
- issue: 未行相应行为者是否仍能得救
  choice: “仍会得救，也会改正”
  alternative: 把得救严格解释为行为结果，或把“改正”改成特定悔改程序
  rationale: 保留第6—7节中行为、圣灵临到、得救与改正之间的张力。
- issue: 死后拘禁与获得知识后的得救
  choice: 照原文保留灵魂从遗忘醒来、获得知识、达到完全而得救的次序
  alternative: 按某种末世论解释为炼狱、轮回或死后第二次机会
  rationale: 文本本身具有独特宇宙论，不导入后世宗派框架。
- issue: 灵魂接续另一人
  choice: 保留“被安排接续另一个人”的模糊表述
  alternative: 明确解释为投胎、附身、转生或借他人代赎
  rationale: 第14—17节的机制在当前英文见证中含混，且科普特语复核尚未完成，不宜消除歧义。
- issue: 亵渎那灵者的惩罚期限
  choice: “历经一个世代的惩罚”
  alternative: “永刑”或“暂时的惩罚”
  rationale: 原见证的“age-long”存在语义张力，译文不预先裁定其无限或有限。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。叙事问答保持简洁；宇宙论术语尽量直译并以脚注说明，不用带有后世宗派定论的术语替代。由于科普特语源文复核尚待完成，本稿明确以所给公共领域英文见证为暂定依据，并保留其校勘括号与关键歧义。
