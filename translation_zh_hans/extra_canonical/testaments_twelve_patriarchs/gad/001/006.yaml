  text: And Joseph told our father that the sons of Zilpah and Bilhah were slaughtering the best of the livestock and eating them without the consent of Reuben and Judah.
translation:
  language: zh_hans
  text: 6 约瑟告诉我们的父亲，说悉帕和辟拉的儿子们宰杀上好的牲畜，没有征得流便和犹大的同意就吃了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θύουσι
  choice: 宰杀
  rationale: 在牲畜与食用的语境中，指宰杀动物；译作“献祭”会无根据地引入祭祀含义。
- source_word: τὰ θρέμματα τὰ καλά
  choice: 上好的牲畜
  rationale: θρέμματα 指饲养的牲畜，καλά 在此表示品质优良；“上好的”自然传达原文含义。
- source_word: παρὰ γνώμην
  choice: 没有征得……的同意
  rationale: 该短语表示违背某人的意见或未经其认可；结合人名属格，以“没有征得……的同意”准确而自然。
