  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/004.yaml
  text: So Joseph my brother was shepherding all the livestock with us for thirty days, and being young, he was weakened by the heat.
translation:
  language: zh_hans
  text: 于是，我的兄弟约瑟跟我们一起放牧了三十天。他那时年纪还小，因酷热而变得虚弱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινε
  choice: 放牧
  rationale: 该动词表示牧养、放牧；原文未明说所牧放牲畜的具体范围，因此不增添“所有牲畜”。
- source_word: ἕως ἡμέρας τριάκοντα
  choice: 三十天
  rationale: 此处表达持续的时段，译作“放牧了三十天”符合现代汉语习惯。
- source_word: νέος
  choice: 年纪还小
  rationale: 保留约瑟尚年轻这一含义，同时采用自然易懂的现代汉语表达。
- source_word: ἐμαλακίσθη
  choice: 变得虚弱
  rationale: 此处为被动形式，语境中指身体因热而衰弱，不采用可能引起品格联想的“软弱”。
- source_word: καύσων
  choice: 酷热
  rationale: 该词可指灼热天气或热风；上下文未明确限定，故用涵盖性较强的“酷热”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我的兄弟约瑟”保留ἀδελφός的泛称，不擅自具体化为“哥哥”或“弟弟”；分为两句以提高可读性，并保留因年轻而不耐酷热的因果关联。
