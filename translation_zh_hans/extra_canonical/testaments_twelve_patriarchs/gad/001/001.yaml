revisions:
- from: 迦得遗训的抄本，是他在一百二十五岁那年对众子所说的。他对他们说：
  to: 迦得遗训的抄本：他在一百二十五岁那年向儿子们讲述这遗训，对他们说：
  rationale: 修订以冒号保留原文的标题式开篇，并明确“他所讲述”的是“遗训”而非“抄本”。“一百二十五岁那年”准确、自然地表达“在他生命的第一百二十五年”；末尾“对他们说”保留原文引出后续直接引语的分词功能。
