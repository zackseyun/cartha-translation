  text: 'The copy of the testament of Gad, which he spoke to his sons in the one hundred and twenty-fifth year of his life, saying to them:'
translation:
  language: zh_hans
  text: 迦得遗训的抄本：他在一百二十五岁那年向儿子们讲述这遗训，对他们说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 直接表达“副本、抄录本”之意，同时保留标题式开篇的文献性质。
- source_word: διαθήκης
  choice: 遗训
  rationale: 在族长临终训言这一文体中，译作“遗训”比“约”或“遗嘱”更自然，也能涵盖其最后嘱咐的含义。
- source_word: ἐλάλησε
  choice: 所说的
  rationale: 忠实反映一般性的“说、讲”，不额外强化为宣告或教导。
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: 在一百二十五岁那年
  rationale: 以自然现代汉语表达“在他生命的第一百二十五年”，含义不变。
- source_word: λέγων αὐτοῖς
  choice: 他对他们说
  rationale: 保留原文引出下文直接言语的分词结构所起的叙事功能。
