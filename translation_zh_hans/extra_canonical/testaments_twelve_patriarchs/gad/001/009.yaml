base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/009.yaml
  text: And the spirit of hatred was in me, and I did not want to perceive Joseph, neither through hearing nor through sight, because he rebuked us to our face, saying that we were eating the livestock without Judah. For in everything he said to our father, he believed him.
translation:
  language: zh_hans
  text: 9 仇恨的灵在我里面；我既不愿听约瑟说话，也不愿见他，因为他曾当面责备我们，说我们在没有犹大在场时吃了牲畜。凡他对父亲所说的，父亲都信他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句希腊文的主语和与格代词所指有所压缩；正文按上下文理解为父亲相信约瑟。动词也可有“听从”之意，因而存在把该句理解为约瑟听从父亲的可能，但在此语境中较不顺畅。
    reason: 保留ἐπείθετο αὐτῷ的句法及语义余地，同时使正文采用与紧邻语境和英文审校轨迹一致的理解。
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: 仇恨的灵
  rationale: 保留原文把仇恨描述为“灵”的表达，不将其弱化为单纯的情绪或心态。
- source_word: οὔτε δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν ἰδεῖν
  choice: 既不愿听见……也不愿看见他
  rationale: 原文直译近似“既不借听觉、也不借眼睛看见约瑟”，措辞不对称；译文用自然汉语表达拒绝从听觉和视觉接触约瑟，同时保留两种感官。
- source_word: κατὰ πρόσωπον ἤλεγξεν ἡμᾶς
  choice: 曾当面责备我们
  rationale: κατὰ πρόσωπον 表示当着人的面；ἐλέγχω 在此为指出过错、责备。
- source_word: χωρὶς Ἰούδα
  choice: 撇开犹大
  rationale: χωρίς 可表示“没有、不带、离开”；“撇开”保留他们未让犹大参与或未与犹大同在的含义，而不额外判定原因。
- source_word: τὰ θρέμματα
  choice: 牲畜
  rationale: 该词指饲养的动物或家畜；“牲畜”准确且符合叙事语境。
- source_word: ἐπείθετο αὐτῷ
  choice: 父亲都信了他
  rationale: πείθομαι 加与格可表示相信或听从某人；结合前句约瑟向父亲陈说兄长之事，此处取“父亲相信约瑟”。
theological_decisions:
- issue: “仇恨的灵”是否仅译作心理状态
  choice: 保留“仇恨的灵”
  alternative: 译作“仇恨之心”或“仇恨的念头”
  rationale: 原文明确使用 πνεῦμα；保留这一人格化或属灵化措辞，避免预先裁定作者所说的是外在灵体还是内在驱动力。
- issue: 末句相信行为的主语
  choice: 按语境译为父亲相信约瑟
  alternative: 理解为约瑟凡事听从父亲
  rationale: 希腊文代词指向略有压缩，但前文聚焦约瑟向父亲告发，且 αὐτῷ 与 πείθομαι 自然表示“相信他”；仍以脚注说明语法上的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“撇开犹大吃了牲畜”刻意保留原文简略关系，不擅自补成偷吃、私宰或未经许可。
