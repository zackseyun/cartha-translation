    issue: “听见约瑟”搭配生硬
    rationale: 希腊文以“借听觉”与“借眼睛”并列，汉语宜译作“听他说话，也不愿见他”，既自然又不丢失两种感官。
  - severity: medium
    issue: “撇开犹大”可能强化原文含义
    rationale: χωρὶς Ἰούδα 首要意思是“没有犹大／不与犹大同在”；“撇开”较容易理解为故意将犹大排除。译作“没有犹大在场”较为中性。
  - severity: low
    issue: 脚注的替代译法表述可更审慎
    rationale: 末句在现有上下文中以父亲相信约瑟最顺；仍可注出主语和与格代词的压缩及“听从”的可能语义，但不宜将语境较困难的替代读法当作同等顺畅的译文。
