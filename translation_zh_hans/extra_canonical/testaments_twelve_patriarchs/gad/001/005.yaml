base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/005.yaml
  text: And he returned to Hebron to our father. And he made him recline near himself, because he loved him very much.
translation:
  language: zh_hans
  text: 5 他回到希伯仑，到我们的父亲那里。他让他在自己身旁躺下，因为他非常爱他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: 回到
  rationale: 表达返回先前所在之处的动作，符合上下文及不定过去时的叙事功能。
- source_word: πρὸς τὸν πατέρα ἡμῶν
  choice: 到我们的父亲那里
  rationale: 自然传达方向介词 πρὸς，同时保留第一人称复数“我们的”。
- source_word: ἀνέκλινεν
  choice: 让……躺下
  rationale: 保留使役意义以及 ἀνακλίνω 所表达的躺卧、斜倚动作，不擅自限定为用餐或就座。
- source_word: πλησίον αὐτοῦ
  choice: 在自己身旁
  rationale: 表达空间上的靠近；“自己”保留其回指关系，而不额外指明具体人物。
- source_word: πάνυ
  choice: 非常
  rationale: 准确传达强程度副词“很、非常”。
theological_decisions:
- issue: 连续代词所指的人物
  choice: 保留“他让他……因为他非常爱他”的代词表达
  alternative: 明确写成“父亲让他……因为父亲非常爱他”或直接补出约瑟等姓名
  rationale: 希腊文本仅使用代词，所指需由上下文判断；不在本节中擅自补明人物，可保存原文的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在自己身旁躺下”略带古代生活场景色彩，同时避免把动作过度解释为坐席或赴宴。
