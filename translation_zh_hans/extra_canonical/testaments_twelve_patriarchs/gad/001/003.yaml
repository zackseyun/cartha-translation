base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/003.yaml
  text: I therefore guarded the flock by night; and when a lion or a wolf or any wild beast came against the flock, I would chase it down, and overtaking it I would seize its foot with my hand, and hurl it about a stone's throw, and so kill it.
translation:
  language: zh_hans
  text: 所以，我夜间看守羊群；每逢狮子、狼或任何野兽来袭击羊群，我就追赶它；追上它时，就用手抓住它的脚，把它投到约一石之遥，就这样杀死它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον
  choice: 看守
  rationale: 未完成时态在此表示过去持续或惯常的行动；“看守羊群”自然且准确。
- source_word: ὅταν ἤρχετο
  choice: 每逢……来
  rationale: ὅταν配合过去时语境表达反复发生的情形，因此译为“每逢”。
- source_word: πᾶν θηρίον
  choice: 任何野兽
  rationale: 保留πᾶν的周遍意义，并以现代汉语常用词“野兽”表达θηρίον。
- source_word: κατεδίωκον
  choice: 追赶
  rationale: 该词在语境中指紧追来袭的野兽；“追赶”比单纯“追”更清楚。
- source_word: φθάνων ἐκράτουν
  choice: 追上以后……抓住
  rationale: φθάνων在此表示赶上、追及，ἐκράτουν表示牢牢控制；用顺畅的时间结构呈现两动作的先后。
- source_word: τὸν πόδα αὐτοῦ
  choice: 它的脚
  rationale: 直译πόδα，同时避免擅自具体化为“后腿”或“爪子”。
- source_word: ἠκόντισα
  choice: 扔
  rationale: 表达用力投掷；在现代汉语中“扔”自然明白，而上下文已显出非轻微动作。
- source_word: ὡσεὶ λίθου βολήν
  choice: 约有一块石头所能投到的距离
  rationale: 保留近似词ὡσεὶ及“投石距离”的古代表述，避免误解为把野兽像石头一样投掷。
- source_word: ἀνῄρουν
  choice: 杀死
  rationale: 在此语境中明确指除灭、杀死野兽；未完成时与全句惯常行动一致。
