  text: 'Listen, my children: I was the ninth son born to Jacob, and I was brave over the flocks.'
translation:
  language: zh_hans
  text: “我的孩子们，请听：我是雅各的第九个儿子，在牧放羊群时，我很勇敢。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: 请听
  rationale: 采用自然庄重的劝告语气，保留希腊语命令式的直接性。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: τέκνα为复数，直译并保留父亲临终训诲的称呼。
- source_word: ἔννατος υἱὸς τῷ Ἰακώβ
  choice: 雅各的第九个儿子
  rationale: 希腊语与英译所表达的是在雅各众子中的排行；中文如此表达最自然。
- source_word: ἀνδρεῖος
  choice: 英勇无畏
  rationale: 该词表示勇敢、勇猛；用四字表达凸显品格与行动能力，而不额外引入军事含义。
- source_word: ἐπὶ τῶν ποιμνίων
  choice: 在牧放羊群时
  rationale: ἐπί加属格在此语义较宽，结合牧群语境表达他照管羊群时所显出的勇敢；避免生硬直译为“在羊群之上”。
