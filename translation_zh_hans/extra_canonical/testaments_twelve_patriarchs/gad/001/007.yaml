  to: 因为他曾看见我从一只熊的口中救出一只羊羔，并杀了那只熊；我却把那只羊羔宰了——我为它忧伤，因为它无法活下去——我们也把它吃了。
  rationale: 修订删除“母”以保留希腊语语法性别与实际生物性别之间的歧义，删除原文未明示的“后来”，并以“却”对应δέ在此处的转折。其余动作、羊羔无法存活所引发的忧伤，以及众人食用羊羔的内容均予保留。
