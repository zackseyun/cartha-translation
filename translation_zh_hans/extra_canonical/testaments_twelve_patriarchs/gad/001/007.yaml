source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. *Ἦν γὰρ ἰδὼν⁴⁶ ὅτι ἀρνα⁴⁷ ἐξειλάμην⁴⁸ *ἐκ τοῦ⁴⁹ στόματος τῆς⁵⁰ ἄρκου, κἀκείνην⁵¹ ἐθανάτωσα, *τὸν δὲ⁵² ἀρνὸν ἔθυσα· *περὶ οὗ ἐλυπούμην⁵³, ὅτι οὐκ *ἠδύνατο ζῆν⁵⁴, καὶ⁵⁵ ἐφάγομεν αὐτόν⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/007.yaml
  text: For he had seen that I rescued a lamb from the mouth of a bear, and I killed her, but I slaughtered the lamb — over which I grieved, because it could not live — and we ate it.
translation:
  language: zh_hans
  text: 因为他曾看见我从一只熊的口中救出一只羊羔，并杀了那只熊；我却把那只羊羔宰了——我为它忧伤，因为它无法活下去——我们也把它吃了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξειλάμην
  choice: 救出
  rationale: 该中动词在此表示从危险中解救、夺回；“从母熊口中救出”自然保留动作与险境。
- source_word: ἄρκου / κἀκείνην
  choice: 母熊 / 母熊
  rationale: ἄρκτος本身可不标性别，但后续阴性代词κἀκείνην指回该熊；汉语以“母熊”明确呈现希腊语的阴性照应。
- source_word: ἔθυσα
  choice: 宰了
  rationale: θύω可指献祭或宰杀；本句没有明示祭祀语境，且随后说众人吃了羊羔，因此采用不额外引入祭祀含义的“宰了”。
- source_word: οὐκ ἠδύνατο ζῆν
  choice: 活不成了
  rationale: 表达羊羔已无法继续存活；现代汉语自然，同时不擅自说明伤势或具体死因。
- source_word: ἐλυπούμην
  choice: 忧伤
  rationale: 保留因羊羔无法存活而悲痛、难过的情感，语体庄重而易懂。
theological_decisions:
- issue: ἔθυσα是否具有献祭含义
  choice: 译作“宰了”
  alternative: “献作祭牲”或“献祭了”
  rationale: 上下文只说明羊羔无法存活，随后被吃，并未交代祭坛、祭礼或献给神；故不把θύω可能具有的祭祀义强加于文本。
- issue: 母熊的性别是否应显明
  choice: 译作“母熊”
  alternative: “熊”
  rationale: 希腊语以阴性名词和阴性代词指称该熊；中文若只说“熊”，会失去原文明确的语法性别照应。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事表达。以分号和破折号呈现原句层次，使“我为它忧伤，因为它活不成了”清楚修饰羊羔，同时保留原文动作顺序。句首“因为”承接前文因果关系；“他”依原文保留，所指须由上下文确定。
