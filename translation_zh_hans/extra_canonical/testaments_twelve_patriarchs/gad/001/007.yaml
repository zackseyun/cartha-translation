  naturalness: 原译整体通顺，破折号内的说明也自然。改为“无法活下去”较贴近οὐκ ἠδύνατο ζῆν；以“却”呈现δέ所引出的转折，句意更清晰。
  terminology: “救出”“宰了”“忧伤”均恰当。“熊”应保持原文对实际性别的未定；不宜译作“母熊”。
