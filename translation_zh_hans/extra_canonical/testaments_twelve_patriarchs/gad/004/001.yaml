  text: Therefore guard yourselves, my children, from hatred, because it even commits lawlessness against the Lord himself.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要防备仇恨，因为仇恨甚至会冒犯主自己，行不法之事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: 你们要提防
  rationale: 中间语态命令式在此表示谨慎防备、使自己远离某事；“提防”自然传达警戒之意。
- source_word: μίσους
  choice: 仇恨
  rationale: 保留该词所指的敌意与憎恨，不弱化为一般的“不喜欢”。
- source_word: ἀνομίαν ποιεῖ
  choice: 行不法之事
  rationale: 较直接地保留“行出不法”的表达及其道德、宗教分量，而不笼统改写为“犯罪”或“作恶”。
- source_word: αὐτὸν τὸν Κύριον
  choice: 主自己
  rationale: 体现αὐτόν的强调作用，表明这种不法甚至是针对主本身。
theological_decisions:
- issue: ἀνομία的译法
  choice: 行不法之事
  alternative: 犯罪／作恶
  rationale: 采用较贴近原文的措辞，避免把“违背律法、行不法”的含义过早归入某一特定神学术语。
- issue: 不法行为的主语
  choice: 重复“仇恨”作为主语
  alternative: 用代词“它”
  rationale: 希腊文动词的主语承接“仇恨”；中文重复名词可消除歧义，同时不改变将仇恨拟人化的原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的孩子们”保留父辈训诫的亲切语气；整体句式紧凑，并保留原文“甚至……主自己”的强调。
