  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/002.yaml
  text: For it does not want to hear the words of his commandments concerning love for his neighbor, and it sins against God.
translation:
  language: zh_hans
  text: 因为它不愿聆听他关于爱邻舍的诫命之言，并且得罪上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλει ἀκούειν
  choice: 愿听从
  rationale: ἀκούειν在“诫命”的语境中不只是听见，也含接受、顺从之意；译作“听从”自然且贴合上下文。
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: 他的诫命
  rationale: 原文的“话语/诫命”组合在汉语中若逐字重叠会显生硬；以“诫命”承载命令性内容，同时保留αὐτοῦ的所属关系。
- source_word: ἀγάπης τοῦ πλησίον
  choice: 爱邻舍
  rationale: 保留犹太—基督教传统中“邻舍”的伦理用语；属格在此表达以邻舍为爱的对象。
- source_word: εἰς Θεὸν ἁμαρτάνει
  choice: 得罪上帝
  rationale: 该结构表示向上帝犯罪；“得罪上帝”是现代汉语中自然、庄重且准确的表达。
theological_decisions:
- issue: αὐτοῦ（“他的”）所指对象
  choice: 保留“他的”，不明确指定先行词
  alternative: 译为“上帝的”
  rationale: 本节片段本身未明确给出代词所指，故保留原文的指代开放性，不以神学推断替代文本。
- issue: 主语“它”的所指
  choice: 保留中性代词“它”
  alternative: 依据上下文明确译为某种情欲、恶念或灵
  rationale: 本句承接前文且本节所给文本未显示主语名词；照原文隐含主语及英语审校层保留“它”，避免擅自消解指代。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“因为”保留γάρ的因果承接；整句不增补原文未明说的主语或代词所指。
