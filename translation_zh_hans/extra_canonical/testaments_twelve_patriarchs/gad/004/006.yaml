revisions:
- from: 正如爱愿意使死人活过来，并把被判死刑的人召回来；同样，恨也想杀死活人，连犯了小过错的人也不愿让他活着。
  to: 正如爱愿意使死人活过来，并把被判死刑的人召回来；同样，恨也想杀死活人，并不愿意让那些在小事上犯了罪的人活着。
  rationale: 修订仅消除末句未经原文支持的递进强调，并以“在小事上犯了罪”更直接对应ἐν ὀλίγῳ ἁμαρτήσαντας；其余结构和关键措辞均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:19:44Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了原文的爱与恨的对照、θέλει（愿意／想要）的意愿性，以及“使死人活过来”“召回被判死刑者”的表达。不过，末句的“连”加入了原文未明示的递进强调；原文仅以“并且／而且”连接。此外，“让他活着”虽可理解为泛指，但前面的复数“人”与后置单数代词搭配不够严整。
  naturalness: 句式庄重自然，平行结构清晰。将末句改为“并不愿意让那些在小事上犯了罪的人活着”，既更贴近希腊文的复数宾语，也避免无依据的“连……也……”强化。
  terminology: “爱／恨”“死人／活人”“被判死刑的人”均合宜。“在小事上犯了罪”较“犯了小过错”更贴近ἁμαρτήσαντας（犯罪、犯错）与ἐν ὀλίγῳ（在小事上／在微小的事上）的开放表达，且不预先将其限定为仅属轻微过失。
  issues:
  - severity: low
    issue: “连……也……”增添递进语气
    rationale: καί只作连接，原文未显明使用“甚至、连”的强调词；为最佳对等，应以“并且”保留较中性的并列。
  - severity: low
    issue: “小过错”略收窄“在小事上犯了罪”的表达
    rationale: ἐν ὀλίγῳ可表“在小事上”或“在微小之事上”，而ἁμαρτήσαντας仍使用“犯罪／犯错”语汇。改译可保留原文对行为性质与轻微程度之间的开放性。
  - severity: low
    issue: 复数先行词后接“他”
    rationale: “犯了……的人”是复数概括，改用“那些……的人活着”可使指代和句法更一致。
  revised_text: 正如爱愿意使死人活过来，并把被判死刑的人召回来；同样，恨也想杀死活人，并不愿意让那些在小事上犯了罪的人活着。
