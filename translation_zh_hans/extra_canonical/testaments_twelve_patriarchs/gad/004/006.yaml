source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ὥσπερ²³ ἡ ἀγάπη Γκαὶ¹ τοὺς νεκροὺς *θέλει ζωοποιῆσαι²⁴ καὶ τοὺς ἐν²⁵ ἀποφάσει θανάτου θέλει²⁶ ἀνακαλέσασθαι, οὕτως καὶ²⁷ τὸ μῖσος τοὺς ζῶντας θέλει ἀποκτεῖναι, καὶ *τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας²⁸ οὐ θέλει ζῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/006.yaml
  text: Just as love wants to make the dead alive and to call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned in a little matter to live.
translation:
  language: zh_hans
  text: 正如爱愿意使死人活过来，并把被判死刑的人召回来；同样，恨也想杀死活人，并不愿意让那些在小事上犯了罪的人活着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: 直接表达无私之爱的通常含义，且在本句中与“恨”形成清楚对照。
- source_word: θέλει ζωοποιῆσαι
  choice: 愿意使……活过来
  rationale: 保留 θέλει 的意愿语气，并以自然汉语表达 ζωοποιῆσαι“使活、赋予生命”。
- source_word: τοὺς ἐν ἀποφάσει θανάτου
  choice: 被判死刑的人
  rationale: ἀπόφασις θανάτου 指死亡判决；此译简洁自然，也保留司法语境。
- source_word: ἀνακαλέσασθαι
  choice: 召回来
  rationale: 保留“叫回、召回”的基本意象，不擅自明确为赦免或复活。
- source_word: μῖσος
  choice: 恨
  rationale: 与 ἀγάπη“爱”形成原文所设的直接对比。
- source_word: τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: 犯了小过错的人
  rationale: ἐν ὀλίγῳ 可指在小事上或轻微程度上的犯罪；“小过错”在现代汉语中自然地保留其轻微性。
theological_decisions:
- issue: “使死人活过来”是否特指末日复活
  choice: 保留一般性的“使死人活过来”
  alternative: 使死人复活
  rationale: 原文 ζωοποιῆσαι 表示使之活，不足以单独限定为末日复活；避免加入原文未明说的末世论含义。
- issue: “召回被判死刑者”是否表示赦免
  choice: 译为“把……召回来”
  alternative: 赦免被判死刑的人
  rationale: ἀνακαλέσασθαι 的字面意象是召回；原文没有明确使用“赦免”，故保留其开放性。
- issue: “罪”与“小过错”的措辞
  choice: 犯了小过错
  alternative: 在小事上犯了罪
  rationale: 此处重点是恨对轻微冒犯也不容人活；“小过错”清楚传达轻微性，同时避免在汉语中造成只指特定宗教罪类的误读。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；大体保留原文“正如……同样……”的平行结构。“连……也……”自然呈现后半句对恨之极端性的强调。
