    issue: “迫不及待地设法对付他”过度解释σπεύδει περὶ αὐτοῦ。
    rationale: περὶ αὐτοῦ字面为“关于他／为他的事”；原文没有明说所采取的行动是“对付”。后面的ἵνα从句说明其急切所指向的结果，宜以较中性的“为他的事奔走”保留这种表达。
  - severity: low
    issue: “急于立刻”在现代汉语中语义重复。
    rationale: 虽反映希腊语的急切和即时性，改作“立刻急着”可同样保留两层强调而更自然。
