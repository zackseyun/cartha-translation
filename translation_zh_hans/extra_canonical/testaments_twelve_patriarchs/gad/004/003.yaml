- from: 因为弟兄若跌倒，它就急于立刻向众人告发，还迫不及待地设法对付他，好叫他受审、受罚，最终丧命。
  to: 因为弟兄若跌倒，它就立刻急着向众人报告，并急着为他的事奔走，好叫他受审、受罚，最终丧命。
  rationale: 修订仅收回“对付”这一原文未明说的行动性解释，并微调急迫副词的位置以改善汉语自然度；保留省略主语的“它”、跌倒的含混性，以及审判、惩罚、死亡的过程关系。
