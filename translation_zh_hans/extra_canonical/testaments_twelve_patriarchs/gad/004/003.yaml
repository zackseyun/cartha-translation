source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. ΓἘὰν γὰρ πέσῃ ὁ ἀδελφός⁹, *σπουδάζει εὐθὺς¹⁰ ἀναγγεῖλαι τοῖς¹¹ πᾶσιν, καὶ σπεύδει *περὶ αὐτοῦ ἵνα κριθεὶς¹² καὶ κολασθεὶς ἀποθάνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/003.yaml
  text: For if a brother falls, it is eager at once to report it to everyone, and it hastens concerning him so that, having been judged and punished, he may die.
translation:
  language: zh_hans
  text: 因为弟兄若跌倒，它就立刻急着向众人报告，并急着为他的事奔走，好叫他受审、受罚，最终丧命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέσῃ
  choice: 跌倒
  rationale: 保留原文可指实际倒下、失足或道德过犯的含混性，不擅自限定为“犯罪”。
- source_word: σπουδάζει εὐθὺς
  choice: 急于立刻
  rationale: 同时表达σπουδάζει的急切与εὐθύς的即时性。
- source_word: ἀναγγεῖλαι τοῖς πᾶσιν
  choice: 向众人告发
  rationale: 在敌意语境中，ἀναγγέλλω不只是中性“报告”，而带有揭发其过失的意味；“向众人”对应τοῖς πᾶσιν。
- source_word: σπεύδει περὶ αὐτοῦ
  choice: 迫不及待地设法对付他
  rationale: σπεύδει表达急切促成某事；περὶ αὐτοῦ直译为“关于他”在现代汉语中生硬，结合后接目的从句，译为“设法对付他”较自然，同时不具体添加原文未说明的手段。
- source_word: κριθεὶς καὶ κολασθεὶς ἀποθάνῃ
  choice: 受审、受罚，最终丧命
  rationale: 依次保留两个被动分词与主要动词所呈现的过程；“丧命”自然表达ἀποθάνῃ，并避免暗示一定是正式处决。
theological_decisions:
- issue: 省略主语的指代
  choice: 译作“它”，让读者从上文辨认其所指
  alternative: 明确译作“仇恨”或其他上文概念
  rationale: 本节希腊文本的σπουδάζει、σπεύδει均省略主语，其指代依赖前文；孤立经节未提供先行词，故不擅自补明，以保留篇章关系。
- issue: 弟兄“跌倒”的性质
  choice: 保留“跌倒”
  alternative: 译作“犯罪”或“堕落”
  rationale: πέσῃ本身没有明确限定为某类罪或彻底背道，宜保留其比喻张力与语义宽度。
- issue: 死亡与惩罚的关系
  choice: 译为“受审、受罚，最终丧命”
  alternative: 译为“被判死刑并处决”
  rationale: 原文只说经审判和惩罚后死亡，并未明说惩罚必然是司法处决，故避免强化为死刑。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文因果推进和急迫语气；“告发”“对付”呈现上下文中的敌意，但不补入具体司法程序。
