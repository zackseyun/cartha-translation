review_pass:
  verdict: revise
  source_fidelity: “跌倒”恰当地保留了πέσῃ的未限定含义；“受审、受罚，最终丧命”也准确呈现了κρινθεὶς、κολασθεὶς与ἀποθάνῃ的先后关系。不过，“设法对付他”把περὶ αὐτοῦ（“关于他／为他的事”）具体化为敌对行动，超出了原文明确措辞。
  naturalness: 原译整体通顺、语体庄重。“急于立刻”略显叠沓，但可理解为保留σπουδάζει与εὐθύς双重急迫。改为“立刻急着”更符合现代汉语。
  terminology: “弟兄”“跌倒”“受审”“受罚”“丧命”均适切。“向众人告发”在本段仇恨的语境中可成立，但ἀναγγεῖλαι本身首先是“报告／传报”；采用“报告”能较稳妥地保留原词而不预先界定行为性质。省略主语译作“它”保留了本节脱离上下文时的指代开放性。
  issues:
