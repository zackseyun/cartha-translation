  text: 5. *Τῷ γὰρ φθόνῳ συνεργεῖ τὸ μῖσος¹⁹, καὶ²⁰ κατὰ τῶν εὐπραγούντων· *ἐν προκοπῇ²¹ ἀκούων καὶ²² ὁρῶν πάντοτε ἀσθενεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/005.yaml
  text: For hatred works together with envy, even against those who prosper; hearing and seeing them in their progress, it is always weakened.
translation:
  language: zh_hans
  text: 因为仇恨与嫉妒联手，一同敌对那些顺遂的人；嫉妒的人听见并看见他们的进展，就总会衰弱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“听见、看见”是阳性单数形式，末句省略的主语最自然是“嫉妒的人”，而不是中性的“仇恨”。“衰弱”也可指变得软弱或患病。
    reason: 说明希腊文阳性分词所显示的省略主语，并保留ἀσθενεῖ的基本语义范围。
lexical_decisions:
- source_word: φθόνῳ
  choice: 嫉妒
  rationale: 表示因他人拥有福分或成就而产生的妒意，与“仇恨”保持为两个相互配合但不同的概念。
- source_word: συνεργεῖ
  choice: 联手
  rationale: 传达“一同工作、协力”的含义；用于“仇恨”与“嫉妒”人格化的语境，自然且有力。
- source_word: εὐπραγούντων
  choice: 顺遂的人
  rationale: 涵盖行事顺利、处境兴旺的意思，避免仅限于财富上的“发达”。
- source_word: ἐν προκοπῇ
  choice: 不断进展
  rationale: προκοπή指前进、长进或进展；结合听见和看见的对象，译成“他们不断进展”最符合汉语表达，同时不把进展限定为某一领域。
- source_word: ἀσθενεῖ
  choice: 衰弱
  rationale: 保留该动词“变得软弱、衰弱”的基本意义，不按修订意见改成及物的“削弱它”，因为希腊文动词在此为不及物形式。
theological_decisions:
- issue: 末句的主语与所指
  choice: 以“它”就近回指“仇恨”，并用脚注保留语法上的歧义
  alternative: 补出“怀恨的人”作为听见、看见并衰弱的主体
  rationale: 邻近的显式主语是中性名词“仇恨”（τὸ μῖσος），但“听见、看见”的分词为阳性单数，可能暗含“怀恨的人”。正文不武断消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“联手”保留人格化修辞，“顺遂”比“成功”更宽泛。分号呈现原文由原则陈述转入结果描述的结构；脚注明确保留主语和末句语义的真实歧义。
