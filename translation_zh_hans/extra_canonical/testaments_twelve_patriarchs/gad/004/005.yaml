revisions:
- from: 因为仇恨与嫉妒联手，敌对那些顺遂的人；听见、看见他们不断进展，它就总会衰弱。[a]
  to: 因为仇恨与嫉妒联手，一同敌对那些顺遂的人；嫉妒的人听见并看见他们的进展，就总会衰弱。[a]
  rationale: 修订解决了原译末句的语法主语错配：正文不再让中性的“仇恨”执行阳性分词所表达的听见、看见行为。保留原文的概括性与道德劝诫语气，以“嫉妒的人”作为最有根据的隐含主体，并删除原文未明说的“不断”。
