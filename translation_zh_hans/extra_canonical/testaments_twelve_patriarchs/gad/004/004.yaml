source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ *δοῦλός τις ᾖ¹³, συμβαλεῖ¹⁴ αὐτὸν πρὸς τὸν κύριον αὐτοῦ, καὶ ἐν πάσῃ θλίψει¹⁵ *ἐπιχαίρει αὐτῷ¹⁶, εἴπως¹⁷ θανατωθῇ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/004.yaml
  text: And if someone is a servant, it slanders him to his master, and in every distress it rejoices over him, if perhaps he may be put to death.
translation:
  language: zh_hans
  text: 如果有人是奴隶，仇恨就会向他的主人控告他；在他一切患难中，仇恨都因他而欢喜，盼望他或许会被处死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλός
  choice: 奴仆
  rationale: 既保留受主人支配的身份含义，也比单用“奴隶”更适合庄重的汉语叙述语体。
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: 就会在他的主人面前诬告他
  rationale: 结合上下文以“仇恨”为省略主语；该短语在此表示使此人受到主人敌视或控告，译为“诬告”符合英译审校层，也使汉语关系清楚。
- source_word: ἐν πάσῃ θλίψει
  choice: 每逢患难
  rationale: 自然表达“在每一次苦难/困境中”，并保留反复、普遍的意味。
- source_word: ἐπιχαίρει αὐτῷ
  choice: 幸灾乐祸
  rationale: 准确传达因对方遭难而欢喜的含义，符合现代汉语惯用表达。
- source_word: εἴπως θανατωθῇ
  choice: 巴不得他被处死
  rationale: 保留εἴπως所表达的企盼而非确定结果，也保留θανατωθῇ的被动语态和致死含义。
theological_decisions:
- issue: 省略主语的指代
  choice: 明确为“仇恨”
  alternative: 反复使用不明确的“它”
  rationale: 本段上下文论述仇恨；现代汉语若使用“它”容易失去所指，明示“仇恨”不改变论旨。
- issue: εἴπως的愿望色彩
  choice: 译作“巴不得”
  alternative: “或许”
  rationale: 这里与“幸灾乐祸”相连，表达恶意期待对方死亡；“巴不得”保留这种愿望色彩，同时没有把死亡说成既成事实。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“奴仆”保留古代主仆制度背景；“幸灾乐祸”“巴不得”使敌意递进在汉语中清楚有力。原文无须添加脚注，正文也无脚注标记。
