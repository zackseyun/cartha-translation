  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Τὸ γὰρ πνεῦμα τοῦ μίσους *διὰ τῆς²⁹ ὀλιγοψυχίας συνεργεῖ τῷ Σατανᾷ ἐν πᾶσιν εἰς θάνατον τῶν ἀνθρώπων, τὸ δὲ πνεῦμα τῆς ἀγάπης *ἐν μακροθυμίᾳ³⁰ συνεργεῖ *τῷ νόμῳ³¹ τοῦ Θεοῦ εἰς σωτηρίαν τῶν³² ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/007.yaml
  text: For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through longsuffering, works together with the law of God for the salvation of men.
translation:
  language: zh_hans
  text: 因为仇恨的灵借着心志软弱，在一切事上与撒但同工，使人死亡；爱的灵却以恒久忍耐与神的律法同工，使人得救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: 仇恨的灵
  rationale: 保留属格结构及原文对“仇恨之灵”的人格化表达，并与下文“爱的灵”形成鲜明对照。
- source_word: διὰ τῆς ὀλιγοψυχίας
  choice: 借着心志软弱
  rationale: ὀλιγοψυχία可指胆怯、灰心或心志狭小；“心志软弱”保留其较宽泛的心理与道德含义，不将其限缩为单纯恐惧。
- source_word: συνεργεῖ
  choice: 同工
  rationale: 准确呈现“共同工作、协力”的含义，并在两处分句中保持平行。
- source_word: ἐν πᾶσιν
  choice: 在一切事上
  rationale: 按其与συνεργεῖ的自然关系理解，表示仇恨之灵在各样事情上与撒但协力。
- source_word: ἐν μακροθυμίᾳ
  choice: 以恒久忍耐
  rationale: μακροθυμία指长期忍耐、克制而不轻易发怒；“恒久忍耐”自然且保留其持续性。
- source_word: τῷ νόμῳ τοῦ Θεοῦ
  choice: 神的律法
  rationale: 直译原文，保留“爱的灵”与“神的律法”同工这一独特陈述。
- source_word: εἰς θάνατον / εἰς σωτηρίαν
  choice: 使人死亡／使人得救
  rationale: 以自然汉语表达εἰς所指向的结果或目的，同时维持死亡与得救的对称。
theological_decisions:
- issue: “爱的灵”与“神的律法”同工的关系
  choice: 直接译为“与神的律法同工”
  alternative: 解释为“遵行神的律法”或“配合神的旨意”
  rationale: 原文明确使用συνεργεῖ及与格τῷ νόμῳ，不宜把这种协作关系改写为遵行或泛化为神的旨意。
- issue: 死亡与得救是目的还是结果
  choice: 译作“使人死亡／使人得救”
  alternative: “为要使人死亡／为要使人得救”或“以致人死亡／以致人得救”
  rationale: εἰς可表达趋向、目的或结果；“使”在现代汉语中较简洁，也不必绝对限定为主观目的或纯粹结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留两个分句在“灵—方式—同工对象—结局”上的平行结构。未为希腊文本中的校勘符号添加脚注，因为所给资料未列出相应异文内容。
