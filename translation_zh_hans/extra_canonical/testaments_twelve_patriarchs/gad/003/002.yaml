base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/002.yaml
  text: Whatever the one who hates may do is abominable. If anyone does the law of the Lord, the hater does not praise him. If anyone fears the Lord and desires what is righteous, the hater does not love him.
translation:
  language: zh_hans
  text: 心怀仇恨的人无论做什么，都是可憎的。若有人遵行主的律法，心怀仇恨的人不称赞他；若有人敬畏主，渴望正义，心怀仇恨的人不爱他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μισῶν
  choice: 心怀仇恨的人
  rationale: 保留分词的持续性含义，指怀有仇恨、受仇恨支配的人；比单用“恨人的”更自然庄重。
- source_word: βδελυκτόν
  choice: 可憎的
  rationale: 准确表达令人厌恶、可憎之意，并保持原文强烈的道德评价。
- source_word: ποιῇ τὸν νόμον Κυρίου
  choice: 遵行主的律法
  rationale: 希腊语直译为“行主的律法”，现代汉语通常以“遵行律法”表达实行律法要求，而非仅仅知道或谈论律法。
- source_word: φοβεῖται Κύριον
  choice: 敬畏主
  rationale: 采用汉语宗教文献中自然且准确的固定表达，兼顾敬重与畏惧。
- source_word: θέλει τὸ δίκαιον
  choice: 渴望正义
  rationale: θέλει在此表示意愿或愿望；τὸ δίκαιον可指正义、公正或正确之事。“渴望正义”自然凝练，同时不把意义收窄为某一种具体行为。
- source_word: ἐπαινεῖ
  choice: 称赞
  rationale: 直接表达认可、赞许之意，符合上下文中怀恨者拒绝肯定义人的意思。
theological_decisions:
- issue: 首句是在陈述怀恨者所做之事客观上可憎，还是说怀恨者把别人的一切行为视为可憎
  choice: 按句法译为怀恨者无论做什么都是可憎的
  alternative: 凡别人所做的，怀恨者都看为可憎
  rationale: 现存希腊文本以ὁ μισῶν作ποιῇ的主语，并以βδελυκτόν ἐστιν作判断，没有“看为”之类的感知动词；因此不把可能的语境解释写入正文。
- issue: 后两句省略主语的指代
  choice: 将“不称赞”和“不爱”的主语明确译为“心怀仇恨的人”
  alternative: 保留汉语零主语，或理解为不定指的他人
  rationale: 希腊语动词为第三人称单数，最自然地承接首句的ὁ μισῶν；汉语明示主语可避免误读，并与经审核的咨询文本一致。
- issue: τὸ δίκαιον的范围
  choice: 译作“正义”
  alternative: 译作“正直之事”或“正确的事”
  rationale: 原词保持一定抽象性，可涵盖公义、公正和正确之事；“正义”保留这种宽度，不额外限定为守律法的某项具体行为。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。三次重复“心怀仇恨的人”，保留原段论述的主线，并消除汉语中代词指向不清的问题；分号呈现后两句并列结构。
