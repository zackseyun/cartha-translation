base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/003.yaml
  text: He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.
translation:
  language: zh_hans
  text: 他斥责真理，嫉妒亨通的人[a]，欣然接受毁谤，喜爱骄傲；因为仇恨使他的心灵失明，正如从前我看着约瑟时，仇恨也使我的心灵失明一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亨通的人”也可译作“行事正直的人”或“做事成功的人”。
    reason: 希腊词κατορθοῦντι兼有做得正确与做得成功、顺遂的语义范围；上下文不足以完全排除其中任何一面。
lexical_decisions:
- source_word: ψέγει
  choice: 斥责
  rationale: 表达公开责难、非难之意，比一般的“不赞同”更符合该动词的力度。
- source_word: τῷ κατορθοῦντι
  choice: 亨通的人
  rationale: κατορθόω可指做得成功、凡事顺遂；结合“嫉妒”的宾语，译为“亨通的人”自然且贴合语境，同时以脚注保留另一种可能。
- source_word: καταλαλιὰν ἀσπάζεται
  choice: 欣然接受毁谤
  rationale: ἀσπάζεται本义为欢迎、欣然接纳；此处保留其主动拥抱毁谤的鲜明意象，而不缩减为仅仅“毁谤人”。
- source_word: ὑπερηφανίαν ἀγαπᾷ
  choice: 喜爱骄傲
  rationale: 按原文保留“爱”与“骄傲”的直接搭配及其道德力度。
- source_word: ἐκτυφλοῖ τὴν ψυχὴν
  choice: 使他的心灵失明
  rationale: 保留“使……失明”的比喻以及ψυχή所指的内在人格与感知中心。
theological_decisions:
- issue: 末句比较关系中的省略
  choice: 正如我当时看着约瑟时那样
  alternative: 正如仇恨使我在看约瑟时心灵失明一样
  rationale: 希腊文末句较简略，直陈“正如我当时也看着约瑟”；译文让比较关系在中文中成立，却不把原文省略的成分全部明说，以保留其修辞张力。
- issue: 前四个动词的隐含主语
  choice: 他
  alternative: 仇恨
  rationale: 后文说仇恨使“他的”心灵失明，表明行为主体是受仇恨支配的人，而非把仇恨人格化为拥有自己心灵的主体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。四个并列分句保持原文紧凑的责备语气；末句保留约瑟之名及原文略带省略的比较结构。
