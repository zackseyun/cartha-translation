source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: III. Καὶ νῦν ἀκούσατε¹ λόγον² ἀληθείας³, *τοῦ ποιεῖν⁴ δικαιοσύνην, καὶ πάντα⁵ νόμον⁶ ὑψίστου, καὶ μὴ⁷ πλανᾶσθε⁸ τέκνα *τῷ πνεύματι⁹ τοῦ μίσους¹⁰, ὅτι κακόν ἐστιν ἐπὶ πάσαις ταῖς¹¹ πράξεσι τῶν¹¹ ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/001.yaml
  text: 'And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, children, by the spirit of hatred, because it is evil in all the deeds of men.'
translation:
  language: zh_hans
  text: 现在，你们要听真理的话，为要行公义，遵行至高者的一切律法。孩子们，不要被仇恨之灵迷惑，因为它在人的一切行为中都是恶的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”最可能指前面的“仇恨之灵”；原文末句没有明说主语。“在人的一切行为中”也可理解为“对人的一切行为而言”。
    reason: 说明原文省略主语及介词短语的语义范围，保留真实歧义。
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: 真理的话
  rationale: 保留属格结构及庄重语气；既可指真实可靠的教诲，也可指关于真理的话。
- source_word: ποιεῖν δικαιοσύνην
  choice: 行公义
  rationale: 用现代汉语中自然且庄重的表达，准确传达“实行正义／做正直之事”。
- source_word: πάντα νόμον ὑψίστου
  choice: 至高者的一切律法
  rationale: ὑψίστου作属格，指“至高者”；πάντα νόμον按整体意义译为“一切律法”。
- source_word: πλανᾶσθε
  choice: 被……迷惑
  rationale: 保留希腊语被动式所表达的受影响、被引入歧途之意。
- source_word: τῷ πνεύματι τοῦ μίσους
  choice: 仇恨之灵
  rationale: 直译属格短语，不预先判定这里的“灵”是人格化力量、内在倾向还是灵界存在。
- source_word: ἐπὶ πάσαις ταῖς πράξεσι τῶν ἀνθρώπων
  choice: 在人的一切行为中
  rationale: 尽量保留介词ἐπί在此处较宽泛的关联／范围意义，而不把它收窄为某一种因果关系。
theological_decisions:
- issue: “仇恨之灵”的性质
  choice: 保留“灵”的直译
  alternative: 仇恨的心态／仇恨的势力
  rationale: 原文πνεῦμα具有真实语义张力；译文不将其限定为单纯心理状态或特定灵界存在。
- issue: 末句代词所指
  choice: 使用“它”并加注说明
  alternative: 明确译作“仇恨”或“仇恨之灵”
  rationale: 希腊语中ἐστιν没有明示主语；上下文最可能回指“仇恨之灵”，但不宜在正文中消除其形式上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“现在”“孩子们”保留劝诫语气；不添加原文没有的“我的”。将略显生硬的目的结构自然处理为“为要……”，同时维持原文从听见真理到实践公义与律法的逻辑。
