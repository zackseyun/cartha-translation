  text: '《迦得遗训》第一章


    1 这是迦得遗训的抄本，记载他在一百二十五岁那年对众子所说的话。他对他们说：[a]


    2 “孩子们，你们要听。我是雅各的第九个儿子；我牧放羊群时勇猛过人。


    3 我在夜间看守羊群；每逢狮子、狼或任何野兽来袭击羊群，我就追赶它；赶上后，我用手抓住它的腿，把它猛掷出去，约有一掷石那么远，并杀死它。


    4 我弟弟约瑟曾和我们一同牧放羊群三十天。他那时年纪还小，因炎热而浑身乏力，


    5 便回到希伯仑，到我们父亲那里。父亲让他躺在自己身旁，因为父亲非常爱他。


    6 约瑟告诉我们的父亲，说悉帕和辟拉的儿子们宰杀上好的牲畜，并吃了它们，违背吕便和犹大的意思。


    7 原来，他看见我从一头熊口中救出一只羊羔，又杀了那头熊；至于那只羊羔，我因它活不成了，虽然难过，还是把它宰了，我们也吃了它。


    8 因这件事，我一直怨恨约瑟，直到他被卖的那一天。


    9 仇恨的灵在我里面；我既不愿听他，也不愿亲眼看见约瑟，因为他当面责备我们，说我们吃那些牲畜时没有犹大在场。凡他告诉父亲的事，父亲都相信他。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊抄本在这段开篇叙事的若干措辞和衔接上较为困难；本译文按所给希腊文本译出，不以其他较长或次序不同的版本补写。
    reason: textual_variant
lexical_decisions:
- source_word: διαθήκη
  choice: 遗训
  rationale: 在族长临终训诫文体中，指所留下的遗言与训诫；“遗训”比现代法律语境中的“遗嘱”更贴合此文体。
- source_word: ἀνδρεῖος ἐπὶ τῶν ποιμνίων
  choice: 牧放羊群时勇猛过人
  rationale: 保留ἀνδρεῖος的勇武含义，同时用自然汉语交代其施展勇力的牧群场景。
- source_word: ἐμαλακίσθη ὑπὸ τοῦ καύσωνος
  choice: 因炎热而浑身乏力
  rationale: 表达受酷热影响而变得软弱、无力，不引入疾病或中暑等原文未明说的诊断。
- source_word: παρὰ γνώμην
  choice: 不顾……的意见
  rationale: 该短语表示违反或不经有关人的意见、认可；中文保留其未获同意的意味，而不强化为正式禁令。
- source_word: ἐνεκότουν
  choice: 一直怨恨
  rationale: 表示持续怀怨，不只是短暂发怒；也与下文“仇恨的灵”形成语义呼应。
- source_word: πνεῦμα τοῦ μίσους
  choice: 仇恨的灵
  rationale: 保留原文将仇恨呈现为一种支配人的属灵力量的表达，不将其弱化为单纯情绪。
- source_word: κατὰ πρόσωπον ἤλεγξεν
  choice: 当面责备
  rationale: 自然地保留面对面公开指责、揭露的语气。
- source_word: τὰ θρέμματα
  choice: 牲畜
  rationale: 此词泛指饲养的动物；上下文虽以羊群为主，但此处不必限定为羊。
theological_decisions:
- issue: “仇恨的灵”是人格化灵体还是道德倾向
  choice: 直译为“仇恨的灵”
  alternative: 译作“仇恨之心”或“仇恨的力量”
  rationale: 希腊文明确使用πνεῦμα；直译保留古代文本中道德与属灵层面相互交叠的张力，不预先判定其本体性质。
- issue: 约瑟告发事件中的责任归属
  choice: 按现存希腊文译作约瑟看见迦得救羊羔、杀熊并宰羊后向父亲报告
  alternative: 依其他复述传统重构成不同的引语或参与者组合
  rationale: 所给希腊文本在叙事衔接上虽有困难，仍应优先翻译现存措辞，不借后来的平行叙述替换它。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；保留族长遗训的第一人称口吻。仅翻译用户所给希腊文实际涵盖的1—9节，不把英语咨询层中其余段落或次序不同的材料并入正文。
