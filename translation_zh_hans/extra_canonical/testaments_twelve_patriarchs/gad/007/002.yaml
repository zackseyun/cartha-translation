  text: 2. Καὶ ἐὰν ἐπὶ πλεῖον ὑψοῦται, μὴ φθονεῖτε ⌜αὐτῷ⌝⁷, μνημονεύοντες ὅτι πᾶσα σὰρξ ἀποθανεῖται. Κυρίῳ δὲ ὕμνους⁸ προσφέρετε⁹ τῷ παρέχοντι τὰ καλὰ καὶ¹⁰ συμφέροντα *πᾶσιν ἀνθρώποις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/002.yaml
  text: And if he is exalted still more, do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who provides good and beneficial things to all people.
translation:
  language: zh_hans
  text: 如果他越发高升，不要嫉妒他；要记住，凡有血肉的都必死。你们却要向那位把美好而有益的事物供应给所有人的主献上赞歌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον ὑψοῦται
  choice: 越发高升
  rationale: 保留被动式“被抬高、地位上升”的含义，同时用现代汉语自然表达程度进一步增加。
- source_word: μὴ φθονεῖτε αὐτῷ
  choice: 不要嫉妒他
  rationale: φθονέω在此指因他人高升而嫉妒；汉语直接表达宾语即可。
- source_word: πᾶσα σὰρξ
  choice: 凡有血肉的
  rationale: 保留闪语色彩浓厚的希腊表达，泛指一切必死的人，而不简化为抽象的“人人”。
- source_word: ὕμνους προσφέρετε
  choice: 献上赞歌
  rationale: προσφέρω含“献上”之意，ὕμνος为颂赞性的诗歌；此译兼顾敬拜语境和现代可懂性。
- source_word: παρέχοντι
  choice: 赐给
  rationale: 表达主供应、给予的动作；在宗教语境中自然庄重。
- source_word: τὰ καλὰ καὶ συμφέροντα
  choice: 美好而有益的事物
  rationale: 分别体现καλά的美好、良善与συμφέροντα的有益、带来益处，避免把后者狭义化为经济上的“有利可图”。
- source_word: πᾶσιν ἀνθρώποις
  choice: 所有人
  rationale: 准确表达对全体人类的普遍范围，且符合现代汉语。
theological_decisions:
- issue: “凡有血肉的”所指范围
  choice: 保留“凡有血肉的都必死”
  alternative: “人人都必死”
  rationale: 原文πᾶσα σὰρξ具有具体而传统的表达张力；保留其形象性，不额外限定为某类人。
- issue: 主所赐之物的范围与性质
  choice: “把美好而有益的事物赐给所有人”
  alternative: “把一切美好而有益的事物赐给所有人”
  rationale: 原文有定冠词但没有明确表示“一切”的词；不增添总括性，以免扩大陈述强度。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“你们却要”体现复数命令和δέ的转折；分号连接劝诫与其理由，使句势清晰。
