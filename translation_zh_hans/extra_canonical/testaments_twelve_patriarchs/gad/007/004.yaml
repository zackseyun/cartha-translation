  to: 但如果有人像我父亲的兄弟以扫那样，靠恶事变得富有，你们不要嫉妒；因为要等候主所定的界限。[a]
  rationale: 将“因恶行而富足”改为“靠恶事变得富有”，以更准确反映ἐκ κακῶν与πλουτήσει；其余译文及脚注可保留，因其忠实且以适当方式保存ὅρον的歧义。
