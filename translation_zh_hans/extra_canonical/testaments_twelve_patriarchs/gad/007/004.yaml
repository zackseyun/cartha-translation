  text: 4. Ἐὰν δὲ¹⁵ ἐκ κακῶν¹⁶ τις πλουτήσει, ὡς Ἡσαῦ ὁ πατράδελφός¹⁷ μου, μὴ ζηλώσητε¹⁸· ὅρον¹⁹ γὰρ²⁰ Κυρίου ἐκδέξασθε²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/004.yaml
  text: But if someone becomes rich through evil, like Esau my father's brother, do not be jealous; rather, await the appointed limit of the Lord.
translation:
  language: zh_hans
  text: 但如果有人像我父亲的兄弟以扫那样，靠恶事变得富有，你们不要嫉妒；因为要等候主所定的界限。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “界限”也可理解为“期限”或“终点”；原文没有明说具体所指。
    reason: ὅρον在此有真实的语义歧义，可能涉及主所设定的限度、期限或终点，不宜在正文中单一定义。
lexical_decisions:
- source_word: ἐκ κακῶν
  choice: 因恶行
  rationale: ἐκ 表示财富的来源或手段，κακά 在此指邪恶之事、恶行；译作“因恶行”既简明，也不把含义过度限定为某一种不义手段。
- source_word: πλουτήσει
  choice: 富足
  rationale: 直译其“变得富有”的意思；在条件句中用“而富足”符合现代汉语表达。
- source_word: πατράδελφος
  choice: 父亲的兄弟
  rationale: 保留希腊词明确表达的亲属关系，不径译为较口语且可能区分长幼的“伯父”或“叔父”。
- source_word: μὴ ζηλώσητε
  choice: 不要嫉妒
  rationale: ζηλόω 在此语境指因恶人富足而心生嫉妒或艳羡；“不要嫉妒”自然且直接。
- source_word: ὅρον
  choice: 所定的界限
  rationale: ὅρος 本义为界限、边界，也可指规定的限度；“所定的界限”保留意象，并以最少补足说明此界限出于主。
- source_word: ἐκδέξασθε
  choice: 要等候
  rationale: 该词表达期待、等候；“要等候”以自然汉语传达命令语气。
theological_decisions:
- issue: “主的界限”（ὅρον Κυρίου）所指为何
  choice: 主所定的界限
  alternative: 主所定的期限／主的裁决
  rationale: 原文可指主所设定的限度、终点或期限，具体所指并未明说。正文保留“界限”，不把它解释为死亡、审判或惩罚；脚注提示其语义开放性。
- issue: γάρ 的逻辑关系
  choice: 因为
  alternative: 而要／倒要
  rationale: 原文明确有 γάρ，宜保留其说明理由的功能；不以转折性的“反而”取代。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“父亲的兄弟”虽略显直译，但能准确保留亲属称谓而不擅自判定长幼；句末保留原文“因为”的因果衔接，并通过脚注保存“界限”的歧义。
