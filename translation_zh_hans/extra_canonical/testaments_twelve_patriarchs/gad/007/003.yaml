  text: 3. Ἐξέτασον *κρίματα Κυρίου¹² καὶ †καταλάμψει¹³ καὶ ἡσυχάσει¹⁴ τὸ διαβούλιόν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/003.yaml
  text: Examine the judgments of the Lord, and your purpose will be illumined and be at rest.
translation:
  language: zh_hans
  text: 你要省察主的判决，你的筹划就会明朗[a]，安定下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明朗”所译的希腊词通常有“照耀、发光”的意思；这里的文本和句法有疑难，也可理解为“蒙光照”。
    reason: 原文 καταλάμψει 为主动词形，而语境及传统理解可支持被照明之意，需向读者保留歧义。
lexical_decisions:
- source_word: Ἐξέτασον
  choice: 省察
  rationale: 表达仔细查考、审视之意，比单纯“看”更贴合命令语气。
- source_word: κρίματα Κυρίου
  choice: 主的判决
  rationale: κρίματα 可指判断、判决或典章；此处保留其司法性和神学张力，不泛化为“教导”。
- source_word: τὸ διαβούλιόν σου
  choice: 你的筹划
  rationale: 指经过思量的计划、意向或谋划；“筹划”在现代汉语中自然，也保留思想与行动目的之间的含义。
- source_word: ἡσυχάσει
  choice: 安定下来
  rationale: 既可表达停止扰动、归于平静，也适合修饰人的筹划或心中所定的计划。
theological_decisions:
- issue: 省察主的 κρίματα 与人的筹划之间的关系
  choice: 保留“省察……就会……”的结果关系
  alternative: 译作对主判决的服从会直接使计划获得神圣认可
  rationale: 原文只陈述人的筹划因省察主的判决而明朗、安定，并未明确说该筹划因此得到上帝认可。
- issue: καταλάμψει 的语态和句法疑难
  choice: 正文译为“会明朗”，脚注说明也可理解为“蒙光照”
  alternative: 直接确定为“将蒙光照”
  rationale: 现存希腊文本是主动形式，通常有“照耀、发光”之意，但英译所据理解偏向被照亮；用脚注保留文本疑难，避免无声消解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“省察”“判决”“筹划”保留原文的劝诫语气和思辨色彩；句式简洁，适合普通读者诵读。
