  text: Therefore cast out hatred from your souls, and love one another in uprightness of heart.
translation:
  language: zh_hans
  text: 因此，你们要从你们的心灵中除去仇恨，并以正直的心彼此相爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρατε
  choice: 除去
  rationale: 该命令式动词有“拿走、除掉”之意；“除去”既保留主动而彻底的语气，也符合现代汉语表达。
- source_word: τὸ μῖσος
  choice: 仇恨
  rationale: 准确表达对他人的憎恨，语体庄重自然。
- source_word: ἀπὸ τῶν ψυχῶν ὑμῶν
  choice: 从心灵中
  rationale: ψυχή在此指人的内在生命或内心；译作“心灵”与下文“心”有所区分，同时避免生硬的“灵魂中”。
- source_word: ἀγαπήσατε ἀλλήλους
  choice: 彼此相爱
  rationale: 保留复数命令语气及相互关系，是自然且清楚的现代汉语。
- source_word: ἐν εὐθύτητι καρδίας
  choice: 以正直的心
  rationale: εὐθύτης含正直、坦诚、不弯曲之意；此处译为“正直”贴近原文，并以“以……的心”自然表达方式或内在态度。
theological_decisions:
- issue: ψυχή与καρδία在同一句中的区分
  choice: 分别译为“心灵”和“心”
  alternative: 均译为“心”或将ψυχή译为“灵魂”
  rationale: 保留原文两个不同身体—内在用语的轻微区别，又不把ψυχή过度实体化为特定灵魂论概念。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体；保留“所以”的推论关系和两个并列命令，不增加原文没有的解释。
