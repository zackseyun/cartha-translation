  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/005.yaml
  text: For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment.
translation:
  language: zh_hans
  text: 因为，如果他以恶行夺取的东西被收走，或是他悔改了，他就蒙赦免；但他若不肯悔改，就被留待永远的刑罚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφαιρεῖται
  choice: 被收走
  rationale: 保留被动语态及“除去、拿走”的基本意义，并与前文所夺取之物形成自然对应。
- source_word: ἐν κακοῖς
  choice: 以恶行
  rationale: 按手稿标示的疑难措辞作工具或方式理解；中文保持简洁，同时不将“恶”具体化为某一种罪。
- source_word: μετανοήσαντι
  choice: 他悔改了
  rationale: 表达转变心意、悔改的含义，符合本句条件结构。
- source_word: ἀφίησι
  choice: 蒙赦免
  rationale: 采用中文宗教与一般伦理语境都能理解的常用表达；原文动词形态和句法略显不整齐，译文依上下文表达被赦免之意。
- source_word: ἀμετανόητος
  choice: 不肯悔改
  rationale: 自然表达持续处于未悔改状态，也保留其道德意志色彩。
- source_word: τηρεῖται εἰς αἰωνίαν κόλασιν
  choice: 被留待永远的刑罚
  rationale: 保留被动的“看守、保留”以及趋向刑罚的结构，不擅自说明施行者或刑罚方式。
theological_decisions:
- issue: 悔改、赦免与刑罚之间的关系
  choice: 按并列条件译为“或是他悔改了，他就蒙赦免；但……被留待永远的刑罚”
  alternative: 把财物被收走解释为悔改或赦免的必要条件
  rationale: 希腊文本以ἢ连接分句，句法本身存在张力；译文不额外建立系统性的救赎次序。
- issue: “永远的刑罚”的时长与性质
  choice: 直译为“永远的刑罚”
  alternative: 译作“长期管教”或具体解释为某种末世刑罚
  rationale: 保留αἰώνιος与κόλασις的通常语义和原文神学张力，不弱化也不扩展。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。原文中若干词带有校勘标记，尤其句首条件结构及“αὐτά／ἐν κακοῖς”关系不够稳定；正文依现有希腊文本及上下文作最小限度的句法补足，不添加无依据的专名或教派解释。
