revisions:
- from: 因为，穷人若凡事不嫉妒[a]，蒙主喜悦，他就比所有人都富足，因为他没有虚妄之人的牵累。
  to: 因为，穷人若凡事慷慨无吝[a]，蒙主喜悦，他就比所有人都富足，因为他没有虚妄之人的烦扰。
  rationale: 将ἄφθονος的正文译法由“不嫉妒”改为“慷慨无吝”，并以脚注保留相关歧义；将“牵累”改为“烦扰”，使其更贴近περισπασμός。其余句法、称谓及贫穷与富足的对照不变。
