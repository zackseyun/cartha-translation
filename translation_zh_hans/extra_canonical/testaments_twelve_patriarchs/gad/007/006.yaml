base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/006.yaml
  text: For the poor man, if being free from envy in all things he is pleasing to the Lord, this one is richer than all, because he does not have the distraction of vain people.
translation:
  language: zh_hans
  text: 因为，穷人若凡事慷慨无吝[a]，蒙主喜悦，他就比所有人都富足，因为他没有虚妄之人的烦扰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慷慨无吝”所译的希腊词也可带有“不嫉妒”的意思，并可引申为“丰足、丰富”。
    reason: 保留ἄφθονος在“不吝惜／无嫉妒”与“丰足”之间的词义范围，而正文采用在此语境中较直接的伦理义。
lexical_decisions:
- source_word: πένης
  choice: 穷人
  rationale: 直译为经济贫困的人，符合本句与“富足”的鲜明对照。
- source_word: ἄφθονος
  choice: 不嫉妒
  rationale: 该词可表达“没有嫉妒、不吝惜”，也可指“丰足、丰富”；在“穷人”的语境中，“不嫉妒”形成有意义的伦理张力，同时用脚注保留其他可能。
- source_word: Κυρίῳ εὐαρεστῇ
  choice: 蒙主喜悦
  rationale: 自然表达“讨主喜悦、为主所悦纳”，保留“主”这一称谓。
- source_word: ὑπὲρ πάντας πλουτεῖ
  choice: 比所有人都富足
  rationale: 体现比较意义；以“富足”与前文“穷人”构成反讽性的对照。
- source_word: περισπασμὸν
  choice: 牵累
  rationale: 该词指使人分心的烦扰、挂虑或纠缠；“牵累”兼顾内在分心与外在负担。
- source_word: ματαίων ἀνθρώπων
  choice: 虚妄之人
  rationale: ματαῖος含空虚、徒然、无益之意；“虚妄之人”保留其道德与存在层面的评价。
theological_decisions:
- issue: 贫穷与真正富足的关系
  choice: 保留“穷人”却“比所有人都富足”的张力
  alternative: 将“富足”解释为明确的“属灵富足”
  rationale: 原文没有加上“属灵”这一限定，因此不把潜在含义明说为特定神学范畴。
- issue: ἄφθονος的伦理或物质含义
  choice: 正文采用“不嫉妒”，脚注注明“慷慨无吝”或“丰足”的可能
  alternative: 正文译作“凡事丰足”
  rationale: 原文形容一个穷人，采用伦理义更为连贯，但该词确有多义性，不应静默排除另一理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式尽量贴近希腊文的因果与条件结构，同时避免生硬直译；“牵累”比“分心”更能涵盖περισπασμός所含的烦扰和纠缠。
