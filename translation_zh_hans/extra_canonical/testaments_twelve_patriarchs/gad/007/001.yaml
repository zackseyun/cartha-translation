source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VII. Ἐὰν *δὲ εἰς¹ ὑπὲρ ὑμᾶς εὐοδοῦται μὴ λυπεῖσθε², ἀλλ᾿³ εὔχεσθε ὑπὲρ αὐτοῦ⁴ ἵνα τελειωθῇ⁵. *οὕτως γὰρ ἐστιν ὑμῖν συμφέρον⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/001.yaml
  text: But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be made complete. For in this way it is to your advantage.
translation:
  language: zh_hans
  text: 但若有人比你们更亨通，不要忧愁，反要为他祈求，使他得以成全。因为这样对你们有益。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐοδοῦται
  choice: 更亨通
  rationale: 该动词表示进展顺利、成功或兴盛；结合比较性的“ὑπὲρ ὑμᾶς”，译作“比你们更亨通”，自然表达此人境遇或事业胜过听众，而不把范围限制为财富。
- source_word: μὴ λυπεῖσθε
  choice: 不要忧愁
  rationale: 保留 λυπέομαι 的悲伤、难过之意；上下文可能涉及因他人更亨通而不快，但原文没有明说“嫉妒”，故不作强化。
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: 要为他祈求
  rationale: 准确表达为某人祷告；以“反要”呈现 ἀλλά 所引出的鲜明转折。
- source_word: τελειωθῇ
  choice: 得以完全
  rationale: 保留“达到完全、成熟或完成”的宽广语义以及被动形式，不擅自限定为道德完善、属灵成熟或某项事业完成。
- source_word: συμφέρον
  choice: 有益
  rationale: 简洁表达对听众有利、带来益处的意思。
theological_decisions:
- issue: τελειωθῇ 所指的“完全”性质
  choice: 使他得以完全
  alternative: 使他成熟；使他所做的得以完成
  rationale: 原文没有说明是人格、属灵生命还是事业达到完成，因此采用较宽泛的表达，保存其神学与语义张力。
- issue: 为比自己更亨通者祈求的益处归属
  choice: 因为这样对你们有益
  alternative: 因为他的完全对你们有益
  rationale: οὕτως 可概括前述整种回应方式，原文未明确只把益处系于对方的完全，故不缩窄指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亨通”兼具顺利与兴盛之义，适合古代智慧劝诫语境；全句保留原文由禁止忧愁转向代祷、再说明其益处的结构。
