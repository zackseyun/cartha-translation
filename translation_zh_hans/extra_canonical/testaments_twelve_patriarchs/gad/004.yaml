  text: Therefore guard yourselves[a], my children, from hatred, because it works lawlessness even against the Lord himself. For it does not want to hear the words of his commandments concerning love of one's neighbor, and it sins against God. For if a brother falls, it is eager at once to report it to everyone, and it hastens that he may be judged and punished and die. And if it is some servant, it brings accusations against him before his master, and in every distress it rejoices over him, if perhaps he may be put to death. For hatred works together with envy also against those who prosper; hearing of their success and seeing it, it is always weakened. Just as love would even make the dead alive and would call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned only a little to live. For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love,
    through longsuffering[c][b], works together with the law of God for the salvation of men.
translation:
  language: zh_hans
  text: '**迦得遗训 4**


    1 所以，我的孩子们，你们要防备仇恨，因为仇恨甚至连主自己也冒犯，行不法之事。2 它不肯听主那关于爱邻舍的诫命之言，并且得罪上帝。3 弟兄若跌倒，仇恨便急于立刻把这事告诉众人，还竭力要使他受审、受罚，以至于死。4 那人若是奴仆，仇恨便到他主人面前控告他[a]；他每逢患难，仇恨都幸灾乐祸，巴不得他被处死。5 仇恨与嫉妒一同作工，也敌对那些境况顺利的人；听见或看见别人的顺利，它就总是衰弱不振。6 爱怎样甚至愿意叫死人活过来，把被判死刑的人召回来，仇恨也照样想要杀死活人，连只犯了一点罪的人[b]也不容他活着。7 因为仇恨之灵借着心志怯懦[c]，在一切事上与撒但一同作工，导致人的死亡；爱之灵却借着恒久忍耐，与上帝的律法一同作工，使人得救。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到他主人面前控告他”也可译作“向主人告发他”或“在主人面前诬告他”；原文在此带有敌意地向权威揭发某人的意味。
    reason: lexical_alternative
  - marker: b
    text: “只犯了一点罪的人”也可译作“在一件小事上犯罪的人”。
    reason: lexical_alternative
  - marker: c
    text: “心志怯懦”所译的希腊词也可表示“意志消沉”“胆怯”或“心志软弱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μῖσος
  choice: 仇恨
  rationale: 保留抽象名词及其人格化作用，使它在全段中显为一种主动运作的邪恶力量，而不只是短暂情绪。
- source_word: ἀνομίαν ποιεῖ
  choice: 行不法之事
  rationale: 既保留 ποιεῖ 的行动性，也以现代汉语清楚表达 ἀνομία 的违法、悖逆含义。
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: 主……的诫命之言
  rationale: 没有把 λόγων 与 ἐντολῶν 合并为单一概念，保留原文对“听”诫命之言的强调。
- source_word: ἀγάπης τοῦ πλησίον
  choice: 爱邻舍
  rationale: 采用现代中文圣经语域中自然且广为人知的伦理表达，不额外限定邻舍身份。
- source_word: ἀναγγεῖλαι τοῖς πᾶσιν
  choice: 把这事告诉众人
  rationale: 自然表达公开揭露弟兄跌倒之事，同时保留 πᾶσιν 的范围。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 兼顾受主人管辖的身份和庄重中文语体，比单用“仆人”更能显出原文的社会从属关系。
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: 到他主人面前控告他
  rationale: 上下文指向带敌意的告发及惩罚；译文表达司法性的敌对行动，同时以脚注保留动词短语的解释空间。
- source_word: ἐπιχαίρει αὐτῷ
  choice: 幸灾乐祸
  rationale: 准确传达因他人受苦而欢喜的负面伦理色彩，比直译“为他欢喜”清楚。
- source_word: ἀσθενεῖ
  choice: 衰弱不振
  rationale: 保留“变弱、病弱”的形象，不将其完全解释成嫉妒者单纯的心理难受。
- source_word: μακροθυμία
  choice: 恒久忍耐
  rationale: 表达长久承受、迟缓发怒的含义，并与前文仇恨之灵形成鲜明对照。
theological_decisions:
- issue: 仇恨与爱的拟人化及其“灵”的维度
  choice: 全段把仇恨和爱译为主动行事的力量，末节明确译作“仇恨之灵”和“爱之灵”。
  alternative: 将前文全部处理为普通人的心理倾向，弱化其人格化与属灵维度。
  rationale: 原文先以抽象名词作主动主语，随后明确使用 πνεῦμα；保留这一推进可呈现文本本身的道德—属灵张力，而不将其系统化。
- issue: 爱使死人复活的语言
  choice: 保留“叫死人活过来”和“把被判死刑的人召回来”的强烈意象。
  alternative: 意译为“爱愿意帮助所有人”或明确断定此处指末日复活。
  rationale: 原文使用 ζωοποιῆσαι 和 ἀνακαλέσασθαι 的鲜明语言；直保意象既不削弱修辞，也不替文本裁定是伦理夸张还是更具体的复活暗示。
- issue: 与上帝的律法“同工”
  choice: 直译为“与上帝的律法同工”。
  alternative: 改译为“遵行上帝的律法”或“协助上帝”。
  rationale: 原文以 συνεργεῖ 构成仇恨与撒但、爱与上帝律法的平行关系；保留不寻常搭配能避免消解其神学修辞。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文；以“仇恨便……”维持原文连续的拟人化，同时避免过度古雅。称谓用“主”“上帝”“撒但”，“弟兄”“邻舍”“奴仆”保留经文语域。
