  - severity: low
    issue: 5节“他们凡事进展顺利”
    rationale: ἐν προκοπῇ指顺利、进展或兴盛；“凡事”无原文根据。改为“听见或看见别人的顺利”可保留抽象、概括的表达。
  - severity: medium
    issue: 7节“借着心胸狭小”
    rationale: ὀλιγοψυχία主要指胆怯、怯懦、意志消沉或心志软弱，并非通常意义的狭隘或心胸不宽。宜改为“心志怯懦”，并在脚注保留语义范围。
  - severity: low
    issue: 脚注a的“把他交到主人那里”
    rationale: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ在此语境最稳妥是敌意告发、控告或挑拨；“交到”可能误导为拘押式移交，宜删除。
