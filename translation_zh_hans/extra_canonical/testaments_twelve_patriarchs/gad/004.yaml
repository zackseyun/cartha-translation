  source_fidelity: 译文总体准确保留了“仇恨”与“爱”的拟人化、仇恨与嫉妒的协作、以及末节两种“灵”的对照。惟2节“听从”将ἀκούειν（听）加强为服从；5节“他们凡事进展顺利”增添了“凡事”，且使原文所指的“顺利/进展”略显窄化；7节“心胸狭小”不够准确对应ὀλιγοψυχία的怯懦、胆怯或意志消沉之义。
