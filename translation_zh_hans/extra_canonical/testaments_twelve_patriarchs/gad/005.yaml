  text: '1[a]. Hatred, then, is evil, because it keeps company with falsehood continually, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.


    2. Therefore I say these things to you from experience, my children, so that you may drive out the devilish hatred and cling to the love of God. 3. Righteousness casts out hatred, and humility removes jealousy[b]. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul. 4. He does not speak against a holy man, because the fear of God dwells in him. 5. For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.


    6. These things I learned at last after I repented concerning Joseph. 7. For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the purpose toward salvation. 8. And he did not learn this from men, but through repentance he knows how to receive those who turn back.


    9. For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed. 10. For by the very things through which a man transgresses, through those he is punished. 11. Since, then, my liver lay pitilessly set against Joseph, I too, suffering in my liver[c], was judged pitilessly for ten years.'
translation:
  language: zh_hans
  text: '1. 所以，仇恨是邪恶的，因为它不断与虚假为伍，出言攻击真理；它把小事说成大事，把光说成黑暗，把甘甜说成苦涩。它教人诬蔑，激起愤怒，挑起争战，又使人的心充满狂妄、各种贪欲、种种恶事和魔鬼的毒液。


    2. 因此，我的孩子们，我凭亲身经历把这些事告诉你们，好让你们除掉属魔鬼的仇恨，紧紧持守上帝的爱。3. 正义驱除仇恨，谦卑消除嫉妒[a]。正直而谦卑的人以行不义为耻，不是因为别人定他的罪，而是因为他自己的心责备他，因为主察看他的灵魂。4. 他不诋毁虔诚人，因为敬畏上帝的心住在他里面。5. 他惟恐得罪主，所以根本不愿伤害任何人，连在念头里也不愿。


    6. 我为约瑟的事悔改以后，最终才明白这些道理。7. 因为合乎上帝心意的真正悔改，[除去无知，也][b]驱散黑暗，使眼睛明亮，使灵魂有知识，并引导人的意念走向救恩。8. 他不是从人那里学会这事；而是知道怎样借着悔改接纳那些回转的人。[c]


    9. 上帝曾使我患上肝病；若不是我父亲的祷告帮助了我，我的灵几乎就离开我了。10. 人用什么犯罪，也必借着什么受惩罚。11. 我的肝脏既曾冷酷无情地敌对约瑟，我也就在肝脏上受苦，冷酷无情地受审判达十个时期[d]；这就是我敌对约瑟的那段时间。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”也可译作“妒忌”或“争竞之心”；希腊词可涵盖敌意性的嫉妒和竞争。
    reason: lexical_alternative
  - marker: b
    text: “除去无知，也”在希腊文本中的可靠性存疑，因此保留在方括号内。
    reason: textual_variant
  - marker: c
    text: 本句希腊文没有明说“他”是谁。按上下文可理解为上帝；也有人可能把主语与“悔改”或悔改的人联系起来。
    reason: grammatical_ambiguity
  - marker: d
    text: 原文直译为“十个时期”，没有注明是年、月或其他时段；因此正文保留这一不确定性。
    reason: temporal_ambiguity
lexical_decisions:
- source_word: μῖσος
  choice: 仇恨
  rationale: 保留抽象名词形式，并与本章将仇恨人格化的修辞一致。
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: 不断与虚假为伍
  rationale: 既表达持续性，也保留仇恨与虚假结伴的鲜明人格化意象。
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: 把小事说成大事
  rationale: 用自然现代汉语保留原文小与大的修辞对照；语境表明这是歪曲和夸大。
- source_word: τὸ φῶς σκότος παρέχει
  choice: 把光说成黑暗
  rationale: 保留光与黑暗的道德颠倒，同时与下句“把甘甜说成苦涩”形成整齐排比。
- source_word: συκοφαντίαν
  choice: 诬蔑
  rationale: 简洁表达恶意毁谤或诬告的伦理含义。
- source_word: ὕβριν
  choice: 狂妄
  rationale: 在现代汉语中自然表达越界、傲慢而带侵害性的态度。
- source_word: πλεονεξίαν
  choice: 贪欲
  rationale: 涵盖贪婪占有和不知满足的含义，且适合德行劝诫语境。
- source_word: ἰοῦ διαβολικοῦ
  choice: 魔鬼的毒液
  rationale: 保留原文毒素或毒液的强烈意象，并不把“魔鬼的”弱化成一般的“邪恶”。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 此处与仇恨并列，指敌意性的嫉妒或争竞；脚注保留“妒忌、争竞之心”的语义范围。
- source_word: διαβούλιον
  choice: 意念
  rationale: 该词可指筹划、意向或内在决断；“意念”在此兼顾可读性和语义宽度。
- source_word: χρόνους δέκα
  choice: 十个时期
  rationale: 原文只说“十个时期/时段”，没有明言年或月；正文不擅自确定单位，并以脚注说明。
theological_decisions:
- issue: 第6—8节 μετανοέω／μετάνοια 的译法
  choice: 统一采用“悔改”
  alternative: 第6节译作“改变了对约瑟的看法”，第7—8节译作“悔改”
  rationale: 第6节虽具体涉及对约瑟态度的转变，但上下文立刻将之发展为面向上帝、黑暗与救恩的宗教伦理概念；“悔改”既保留具体罪责，也维持段落衔接。
- issue: 第7节括号内短语的文本状态
  choice: 译出“除去无知，也”，并置于方括号中
  alternative: 删去该短语，或不加括号地纳入正文
  rationale: 所给希腊文本以方括号标示该短语存在文本疑问；译文照录而不掩盖不确定性。
- issue: 第8节隐含主语
  choice: 正文保留“他”，脚注说明可理解为上帝
  alternative: 直接补明“上帝”，或把主语理解为“悔改”或悔改者
  rationale: 希腊文没有在本句明确重述主语。保留代词可避免把解释直接写进正文，同时脚注给出上下文中较连贯的理解。
- issue: 第10节犯罪与惩罚的对应关系
  choice: “人用什么犯罪，也必借着什么受惩罚”
  alternative: 弱化为“人因自己的过犯受罚”
  rationale: 原文强调犯罪所借的器官或途径与受罚方式相对应；第11节以肝脏为例，故保留这一神学与叙事张力。
- issue: 第11节 χρόνους δέκα 的时间单位
  choice: “十个时期”
  alternative: “十年”或“十个月”
  rationale: 希腊文明确有数词“十”，却只用泛指时期的 χρόνους，没有“年”或“月”；按原始语言证据保留单位不明的状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。第1节保留人格化和排比，第3—5节使用简洁的伦理劝诫语气，第9—11节保留“肝脏”在犯罪与惩罚之间的刻意对应。对第7节文本异文、第8节主语及第11节时间单位均不作无提示的教义或历史性定断。
