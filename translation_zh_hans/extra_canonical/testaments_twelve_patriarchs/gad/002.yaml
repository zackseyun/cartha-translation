base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002.yaml
  text: '1 Therefore I confess my sin[a], children: many times I wanted to kill him, because I hated him from my soul. 2 And because of the dreams I added hatred toward him, and I wanted to wipe him out from the land of the living, as a calf licks up the green growth of the field. 3 But Judah sold him secretly to the Ishmaelites. 4 Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    3 Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers. 4 And so, through greed, we were fully set on his murder. 5 But the God of my fathers rescued him from my hands[d][c][b], so that I might not commit a lawless deed in Israel.'
translation:
  language: zh_hans
  text: '1 所以，孩子们，我承认自己的罪[a]：我曾多次想杀死他，因为我从心底恨他。2 又因那些梦，我对他的仇恨越发加深，想把他从活人之地除灭[b]，如同牛犊舔尽田野的青草。3 可是，犹大暗中把他卖给了以实玛利人[c]。4 我们祖先的神就这样把他从我们手中救了出来，免得我们在以色列中犯下重大的不法之事。


    3 所以，我和西缅把他以三十枚金币卖给了以实玛利人[d]；我们藏起十枚，只给弟兄们看二十枚。4 就这样，因着贪欲，我们决意杀死他。5 但我祖先的神把他从我手中救了出来，免得我在以色列中犯下不法之事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章保存了约瑟被卖事件不止一种文本形态。这里把两种形态都译出，不把它们合并成单一叙述。
    reason: textual_variant
  - marker: b
    text: “除灭”所译的希腊动词本义是“舔尽”，也可理解为“吞灭”。下文牛犊舔尽青草的比喻保留了这个具体形象。
    reason: lexical_alternative
  - marker: c
    text: 有些文本见证说犹大暗中把约瑟卖了；另一种文本形态则说：“所以，我和西缅把他卖给了以实玛利人。”
    reason: textual_variant
  - marker: d
    text: “三十枚金币”依照此处希腊文本；藏起十枚、只给弟兄们看二十枚的句子也属于这一文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: Ὁμολογῶ ... τὴν ἁμαρτίαν μου
  choice: 我承认自己的罪
  rationale: “承认”自然表达公开认罪的语气；“罪”保留ἁμαρτία的宗教和道德分量。
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  choice: 我从心底恨他
  rationale: 以现代汉语自然表达“从灵魂深处”的强烈程度，同时不把它弱化为一般的不喜欢。
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: 我对他的仇恨越发加深
  rationale: 传达仇恨被进一步增添的动态，比逐字译为“加上仇恨”更符合现代汉语。
- source_word: ἐκλεῖξαι ... ἐκ γῆς ζώντων
  choice: 把他从活人之地除灭
  rationale: ἐκλεῖξαι本义形成“舔尽”的形象，但在此指彻底除掉；正文用“除灭”表达语境义，随后保留牛犊舔尽青草的明喻。
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: 田野的青草
  rationale: 简明自然地表达田野中青绿的植物，不增加原文未明确限定的细节。
- source_word: κρυφῆ πράσας
  choice: 暗中把他卖给了
  rationale: 既保留交易行为，也清楚表达其隐秘性质。
- source_word: ἐρρύσατο
  choice: 救了出来
  rationale: 强调从眼前杀害危险中实际搭救出来，而非仅作抽象的属灵拯救。
- source_word: ἀνομίαν μεγάλην / ἀνόμημα
  choice: 大恶 / 恶事
  rationale: 在自然中文中保留严重的道德—律法含义，并反映前者有“重大”修饰、后者没有。
- source_word: τῇ πλεονεξίᾳ ἐπληροφορήθημεν τῆς ἀναιρέσεως αὐτοῦ
  choice: 因着贪欲，我们决意杀死他
  rationale: 将πλεονεξία译为“贪欲”，并以“决意”表达已经完全定意实施杀害。
theological_decisions:
- issue: 本章保存两种约瑟被卖事件的文本形态：一处说犹大暗中卖了他，另一处说迦得与西缅卖了他；搭救的叙述也分别使用复数和单数。
  choice: 依所给希腊文本并列翻译两种形态，保留重复的节号和叙述张力。
  alternative: 把两种叙述合并成一段顺畅故事，或只选其中一种文本形态。
  rationale: 原始证据明确保存平行异文；不应借翻译暗中协调、删去或裁定其历史关系。
- issue: ἐκλεῖξαι与牛犊舔食田野青绿植物的异常意象
  choice: 正文译出语境义“除灭”，并在随后的明喻中保留“舔尽”的具体画面。
  alternative: 前后都逐字译作“舔尽”，或完全改写为不带舔食意象的“消灭”。
  rationale: 这样既使现代读者明白杀害意图，又不丢失希腊原文借牛犊舔食所形成的文学形象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从活人之地”“我们祖先的神”等表达保留经文语域，但避免文言化。两段平行材料和重复节号照原始文本证据呈现，不作隐性调和。
