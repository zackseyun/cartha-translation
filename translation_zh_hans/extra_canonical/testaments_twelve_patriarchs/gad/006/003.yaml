base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/003.yaml
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents, forgive him.
translation:
  language: zh_hans
  text: 你们要从心里彼此相爱。若有人得罪你，要对他说和平的话，心里不可存诡诈；若他悔改并认罪，就饶恕他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“要以和平的态度对他说话，除去仇恨的毒，心里不可存诡诈；若他认罪并悔改，就饶恕他。”
    reason: β、A、S¹与正文所据的α文本有两项重要差异：作“以和平的态度对他说话”，并加入“除去仇恨的毒”；又将“悔改、认罪”的次序改为“认罪、悔改”。
lexical_decisions:
- source_word: ἀπὸ καρδίας
  choice: 从心里
  rationale: 直译其内在、真诚的意味，同时符合现代汉语表达。
- source_word: ἁμαρτήσει εἰς σέ
  choice: 得罪你
  rationale: 在针对他人的过犯这一语境中，“得罪你”比字面“向你犯罪”更自然准确。
- source_word: εἰπὲ αὐτῷ εἰρήνην
  choice: 要对他说和平的话
  rationale: 保留“说”与“和平”的字面意象，不把意义过度限定为问安、和解或安慰。
- source_word: δόλον
  choice: 诡诈
  rationale: 表达内心蓄意的欺瞒或恶意，保持庄重而清楚的语体。
- source_word: ὁμολογήσῃ / μετανοήσῃ
  choice: 认罪悔改
  rationale: ὁμολογέω在此指承认过错，μετανοέω指悔改；合译简洁，并保留两个相连而不同的行动。
- source_word: ἄφες αὐτῷ
  choice: 饶恕他
  rationale: 准确表达免除他人过犯的含义，也是现代宗教与一般伦理语境中自然的说法。
theological_decisions:
- issue: 认罪与悔改的关系及次序
  choice: 认罪悔改
  alternative: 悔改并认罪
  rationale: 正文采用β、A、S¹所呈现的“认罪而悔改”次序；脚注注明α文本的相反次序，不据此建立额外的神学先后关系。
- issue: “说和平”是否解释为正式和解
  choice: 对他说和平的话
  alternative: 与他和好
  rationale: 希腊文保留“说”与“和平”的措辞，并未明确等同于完成和解，因此不把经文的要求扩展为特定程序。
translation_notes:
  register: 采用现代、庄重、易懂的普通话；句式保持劝诫语气。“和平的话”略带源文色彩，以保存原文未完全限定的表达。
