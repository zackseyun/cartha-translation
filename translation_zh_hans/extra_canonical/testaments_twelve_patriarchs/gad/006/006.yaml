source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/006.yaml
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
translation:
  language: zh_hans
  text: 但他若否认，又在受责备时感到羞愧，你就安静，不要责备他；因为否认的人会为得罪你而悔改，也会因惧怕[a]而求和。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惧怕”在所据希腊文版本中置于方括号内，表明这几个字的文本存疑；若不计入，则可译为“他也求和”。
    reason: 向读者标明原文编辑符号所反映的文本不确定性，避免把存疑词语当作毫无疑问的正文。
lexical_decisions:
- source_word: αἰδεσθῇ
  choice: 感到羞愧
  rationale: 表达因受责备而生的羞耻感，符合此处中间语态的语境。
- source_word: ἡσύχασον
  choice: 你就静默吧
  rationale: 保留命令语气及停止言说、安静下来的含义，不增添“继续”等原文没有的体貌。
- source_word: ἐλέγξῃς
  choice: 责备
  rationale: 在当面指出过错的语境中自然准确，也与前面的“受责备”形成词义呼应。
- source_word: μετανοεῖ
  choice: 悔改
  rationale: 既可表示对过错后悔，也带有转变心意的意味；此处不弱化为单纯“遗憾”。
- source_word: πλημμελῆσαι εἰς σέ
  choice: 得罪了你
  rationale: 自然表达对某人犯错或犯罪；不把该词过度限定为现代法律意义的“犯罪”。
- source_word: εἰρηνεύει
  choice: 寻求和睦
  rationale: 表达进入或维持和平关系的行动，比生硬的“实行和平”更符合现代汉语。
theological_decisions:
- issue: 否认与悔改之间看似矛盾的关系
  choice: 按原文保留“那否认的人……悔改”
  alternative: 解释为他虽口头否认，内心其实已经悔改
  rationale: 原文没有明确区分口头与内心；译文不替作者消解这一伦理和心理张力。
- issue: 英语咨询文本中的“免得再次伤害你”
  choice: 不纳入正文
  alternative: 译作“免得他再次得罪你”
  rationale: 所给希腊文没有对应词句；翻译以原文证据为先，不依据英语层补入内容。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“你就静默吧”保留原文简短命令的力度；分号呈现原文从指令转向理由说明的结构。
