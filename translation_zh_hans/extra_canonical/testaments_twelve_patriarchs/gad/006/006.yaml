  to: 但他若否认，又在受责备时感到羞愧，你就安静，不要责备他；因为否认的人会为得罪你而悔改，也会因惧怕[a]而求和。
  rationale: 修订仅作措辞层面的源文对齐：以“安静”简洁表达ἡσύχασον；删去原文未明说的“正”“自己”；以“因惧怕而求和”更直接对应[φοβηθεὶς] εἰρηνεύει。保留“否认的人……悔改”的张力，且不加入英语审校文本中无希腊文依据的“免得再次得罪你”。
