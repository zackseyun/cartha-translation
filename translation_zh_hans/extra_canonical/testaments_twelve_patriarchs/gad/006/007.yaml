source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἐὰν δέ *ἔστω ἀναιδὴς⁵³ καὶ ἐνίσταται⁵⁴ τῇ κακίᾳ, *καὶ οὕτως⁵⁵ ἄφες αὐτῷ ἀπὸ καρδίας, καὶ δὸς⁵⁶ τῷ Θεῷ τὴν ἐκδίκησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/007.yaml
  text: But even if he is shameless and persists in evil, even so forgive him from the heart, and give vengeance to God.
translation:
  language: zh_hans
  text: 但即使他厚颜无耻，执意行恶，你仍要从心里饶恕他，把报应交给上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδής
  choice: 厚颜无耻
  rationale: 表达不知羞耻、肆无忌惮之意，符合此处对作恶者态度的描述。
- source_word: ἐνίσταται τῇ κακίᾳ
  choice: 执意行恶
  rationale: ἐνίσταται 表示坚持、抗拒而不退让；与 τῇ κακίᾳ 连用，译为“执意行恶”比静态的“处于邪恶中”更自然，也保留持续不改之意。
- source_word: ἄφες αὐτῷ ἀπὸ καρδίας
  choice: 从心里饶恕他
  rationale: 直承“从心里”与“饶恕”，既忠实于原文，也符合现代汉语宗教伦理语境。
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  choice: 把报应交给上帝
  rationale: 保留 δὸς“交给”的动作性；ἐκδίκησις 在此指对恶行施行公正报偿，译作“报应”较“复仇”更避免暗示上帝出于私怨。
theological_decisions:
- issue: 人是否自行报复，及上帝所施行之 ἐκδίκησις 的性质
  choice: 把报应交给上帝
  alternative: 把复仇交给上帝／任凭上帝伸冤
  rationale: “报应”保留审判与惩治的张力，同时不把经文改写成解释性的“伸冤”；“交给”则忠实呈现 δὸς。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“但即使……仍……”自然呈现让步结构；全句保留原文命令语气及宽恕与神圣报应之间的张力。
