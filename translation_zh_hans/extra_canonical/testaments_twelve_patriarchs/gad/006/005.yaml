revisions:
- from: 不要让外人在争吵中听见你的秘密，免得他因此恨你，与你为敌，并得罪你，犯下大罪；因为他从你那里受了毒，往往会暗害你，或使你陷入祸患。
  to: 不要让外人在争吵中听见你的秘密，免得他恨你，成为你的仇敌，并对你犯下大罪；因为他从你那里得了毒，往往会暗中杀害你，或使你陷在祸患中。
  rationale: 修订仅处理可安全确定的词义与汉语表达：将 δολοφωνεῖ 的谋杀义明确为“暗中杀害”，将 μεγάλην ἁμαρτίαν ἐργάσηται [ἐν σοί] 译为“对你犯下大罪”，并使“得毒”的比喻在中文中自然可读。保留“毒”的歧义，不将之释为怨恨、恶言或秘密本身；也不对带方括号的“对你”作超出文本的断定。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:20:04Z'
review_pass:
  verdict: revise
  source_fidelity: 修订前总体准确，但“暗害你”未明确表达 δολοφωνεῖ 所含的杀害义；“得罪你，犯下大罪”将一个谓语性表达拆成略显重复的两个动作。修订以“暗中杀害你”明确其谋杀／暗杀的力度，并以“对你犯下大罪”简洁保留 ἐν σοί（在所据文本中带方括号）的指向性，同时不把其神学或法理含义过度限定。
  naturalness: 修订后的句子保持现代汉语的庄重劝诫语体。“从你那里得了毒”比“从你那里受了毒”更符合汉语搭配，同时保留原文未解释的“毒”之比喻。
  terminology: “外人”“争吵”“秘密”“与您为敌／成为你的仇敌”“毒”均恰当。采用“成为你的仇敌”更清晰对应 ἐχθράνῃ σε 的结果性。“使你陷在祸患中”谨慎表达 περιεργάζεται σε ἐν κακοῖς 所指的以恶事缠害、牵连或陷害，不强行确定具体手段。
  issues:
  - severity: medium
    issue: “暗害你”没有明确杀害义。
    rationale: δολοφωνεῖ 是“以诡诈／暗中杀害、谋杀”，不只是广义地加害；应在中文中明示“杀害”。
  - severity: low
    issue: “得罪你，犯下大罪”略显重复，且将原文的一个“犯／作出大罪”表达拆开。
    rationale: μεγάλην ἁμαρτίαν ἐργάσηται [ἐν σοί] 可自然译为“对你犯下大罪”；这也保留带方括号的 ἐν σοί 所表示的、但文本上不完全确定的针对性。
  - severity: low
    issue: “从你那里受了毒”搭配稍生硬。
    rationale: λαβὼν ἀπό σου τὸν ἰόν直指从对方得到“毒”；“从你那里得了毒”更自然，且不解释该比喻。
  revised_text: 不要让外人在争吵中听见你的秘密，免得他恨你，成为你的仇敌，并对你犯下大罪；因为他从你那里得了毒，往往会暗中杀害你，或使你陷在祸患中。
