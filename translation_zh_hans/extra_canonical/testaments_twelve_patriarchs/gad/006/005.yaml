base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/005.yaml
  text: Do not let another hear your secret in a quarrel, lest, having come to hate you, he become your enemy and commit a great sin against you; for many times he either murders you by treachery or entangles you in evils, having received the poison from you.
translation:
  language: zh_hans
  text: 不要让外人在争吵中听见你的秘密，免得他恨你，成为你的仇敌，并对你犯下大罪；因为他从你那里得了毒，往往会暗中杀害你，或使你陷在祸患中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλότριος
  choice: 外人
  rationale: 指关系之外或不相干的人；“外人”比笼统的“别人”更能保留其疏离意味。
- source_word: ἐν μάχῃ
  choice: 在争吵中
  rationale: 此处语境是因冲突而泄露秘密，不必译成武装“战斗”；“争吵”符合现代汉语表达。
- source_word: τὸ μυστήριόν σου
  choice: 你的秘密
  rationale: μυστήριον在这里指个人隐秘之事，而非专门的宗教“奥秘”。
- source_word: ἐχθράνῃ σε
  choice: 与你为敌
  rationale: 保留使对方成为仇敌、敌对自己的含义，并与前面的“恨你”区分。
- source_word: μεγάλην ἁμαρτίαν ἐργάσηται ἐν σοί
  choice: 得罪你，犯下大罪
  rationale: 兼顾“犯大罪”和ἐν σοί所指向的“针对你/得罪你”，避免只译为一般性的犯罪。
- source_word: δολοφωνεῖ σε
  choice: 暗害你
  rationale: 该词含诡诈、阴险地杀害之意；“暗害”保留险恶手段，也容纳实际杀害的语义力度。
- source_word: περιεργάζεται σε ἐν κακοῖς
  choice: 使你陷入祸患
  rationale: 表达以恶事纠缠、围困或牵连对方的结果，现代汉语自然。
- source_word: λαβὼν ἀπό σου τὸν ἰόν
  choice: 他从你那里受了毒
  rationale: 保留“毒”这一比喻及毒素源自泄密者本人的因果张力，不将其解释性改写为“恶意”。
theological_decisions:
- issue: “大罪”是针对人还是泛指在神面前犯罪
  choice: 译作“得罪你，犯下大罪”
  alternative: “对你犯下大罪”
  rationale: ἐν σοί文本上带方括号且表达可有歧义；现译既呈现针对受害者的方向，也不排除其作为道德或宗教意义上的罪。
- issue: “毒”的比喻所指
  choice: 保留“毒”，不明说是怨恨、秘密或恶言
  alternative: 解释为“从你那里受到怨毒”
  rationale: 原文刻意采用比喻，可能指争吵时泄露的秘密所激起的仇恨，也可能兼有恶言如毒的意味；不宜替原文消除张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“免得……并……”保持劝诫文体的连贯因果；后半句调整为汉语自然语序，将分词短语“从你那里受了毒”提前，以明确对方作恶的诱因来自说话者在争吵中泄露秘密。
