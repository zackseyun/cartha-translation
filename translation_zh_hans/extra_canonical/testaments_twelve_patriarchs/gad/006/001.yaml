base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/001.yaml
  text: 'And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and in thought of soul.'
translation:
  language: zh_hans
  text: 现在，我的孩子们，我劝你们：每个人都要爱自己的邻人，并要从你们心中除去仇恨。你们要在行为、言语和心灵的意念上彼此相爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραινῶ
  choice: 我劝你们
  rationale: 表达劝勉、规劝之意，符合父亲向孩子们郑重嘱咐的语境，同时避免译得过于强硬。
- source_word: τὸν πλησίον αὑτοῦ
  choice: 自己的邻人
  rationale: 保留原文单数分配式结构，即“每个人”都爱“自己的邻人”；“邻人”也比单指居住相邻者的“邻居”范围更广。
- source_word: ἐξάρατε τὸ μῖσος
  choice: 除去仇恨
  rationale: ἐξάρατε含移走、清除之意；“除去”自然而庄重，并保留命令语气。
- source_word: ἐν ἔργῳ καὶ λόγῳ
  choice: 在行为、言语……上
  rationale: 分别呈现ἔργον与λόγος所指的实际行动和言语表达。
- source_word: διανοίᾳ ψυχῆς
  choice: 心灵的意念
  rationale: 较贴近“灵魂/心灵的思想、意念”这一结构，不将其过度解释为“动机”“诚意”或“意向”。
theological_decisions:
- issue: 爱的内在层面如何表达
  choice: 心灵的意念
  alternative: 内心的意向；全心全意
  rationale: 原文διανοίᾳ ψυχῆς在措辞上较为凝缩，可能强调心灵中的思想或意念。译文保留这种张力，不把它限定为动机，也不扩展为“全心全意”。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“我的孩子们”保留亲切的父辈口吻；两个命令句清楚呈现原文从爱邻人、除仇恨到彼此相爱的递进。
