base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/004.yaml
  text: But if he denies it, do not contend with him, lest, when he swears, you sin doubly.
translation:
  language: zh_hans
  text: 但如果他否认，就不要与他争辩，免得他起誓时，你就犯下双重的罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “双重”也可理解为“在两方面”。原文没有说明这两重罪具体指什么。
    reason: 说明δισσῶς的语义范围，并保留原文对两重罪具体所指的含混。
lexical_decisions:
- source_word: ἀρνεῖται
  choice: 否认
  rationale: 原文未明说否认的宾语，译文同样不补出“这事”或“罪行”，保留上下文所含的省略。
- source_word: φιλονείκει
  choice: 争辩
  rationale: 该词在此指执意争执、争论；“争辩”自然清楚，又不额外加入肢体冲突之意。
- source_word: ὁμόσαντος
  choice: 起誓
  rationale: 准确表达ὄμνυμι的宣誓含义，不擅自补出誓言的内容或真假。
- source_word: δισσῶς ἁμαρτάνεις
  choice: 犯下双重的罪
  rationale: 保留δισσῶς所表达的加倍或两方面犯罪之意，不代替原文解释这两重罪分别是什么。
theological_decisions:
- issue: “双重的罪”的具体所指
  choice: 正文保留概括表达，不解释两重罪的具体构成
  alternative: 将其解释为诬告之罪与促使对方作伪誓之罪
  rationale: 希腊文本没有明说两重罪各是什么；直接展开会把一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“但如果……就不要……免得……”对应原句的劝诫结构；“一旦”使属格独立结构在汉语中衔接自然，但不增添确定的因果解释。
