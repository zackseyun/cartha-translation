base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/002.yaml
  text: For I myself, in my father’s presence, spoke peaceably to Joseph; but when I had gone out from him, the spirit of hatred darkened my mind and disturbed my thoughts to kill him.
translation:
  language: zh_hans
  text: 因为我在父亲面前对约瑟说的是和睦的话；但我一离开他，仇恨之灵就使我的心智昏暗，搅乱我的心思，使我想杀害他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πρόσωπον τοῦ πατρὸς μου
  choice: 在父亲面前
  rationale: 按希腊语惯用表达自然翻译，保留当着父亲之面的场景。
- source_word: εἰρηνικὰ ἐλάλουν
  choice: 说的是和睦的话
  rationale: εἰρηνικά 为中性复数，作副词性宾语，指和平、友善的话语；此译既贴近形式，也符合现代汉语。
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: 仇恨之灵
  rationale: 保留 πνεῦμα 的“灵”及属格结构，不将其弱化为单纯的情绪或心态。
- source_word: ἐσκότιζέ μου τὸν νοῦν
  choice: 使我的心智昏暗
  rationale: νοῦς 指心智、思想能力；“心智”比单用“心”更准确，并保留“使之昏暗”的意象。
- source_word: ἐτάρασσέ μου τὸν λογισμόν
  choice: 搅乱我的思念
  rationale: λογισμός 可指思量、念头或思想；“思念”在此按“心中所思”理解，配合“搅乱”呈现持续作用。
- source_word: πρὸς τὸ ἀνελεῖν αὐτόν
  choice: 要杀死他
  rationale: 直接表达该结构所指向的杀害目的或趋向，不扩写为明确的主观愿望。
theological_decisions:
- issue: “仇恨之灵”是外在灵体还是人格化的内在倾向
  choice: 保留“仇恨之灵”
  alternative: 仇恨的心态／仇恨之气
  rationale: 原文使用 πνεῦμα，可能具有灵性实体或人格化力量的含义；译文不替读者消解这一张力。
- issue: 杀害约瑟是目的、结果还是内心冲动
  choice: 译作“要杀死他”
  alternative: 以致我想要杀死他
  rationale: πρὸς τό 加不定式表达趋向或目的；避免加入原文没有明说的“想要”，同时让汉语句意完整。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“因为”承接上文的 γάρ；“我一离开他”自然呈现分词 ἐξερχόμενος 的时间关系。未增设脚注，因为本节没有必须借脚注保存的文本异读或无法在正文容纳的歧义。
