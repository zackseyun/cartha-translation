review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确涵盖希腊文本第8章1—5节，且没有沿用英文审计文本中不属本章的大段内容。但第4节的ἐξάρας τοὺς πόδας意为“抬起／举起双脚”，不能译为“收起双脚”；第5节μετὰ τῶν πατέρων应明确为“与列祖同葬”，而非“在列祖中间”。第1节的两个与格关系确有句法困难，正文可更贴近地保留“为你们……为以色列”的并列关系。
  naturalness: 行文庄重流畅。将第3节的“听从你们的父亲”调整为更自然的“听从父亲的话”，并将第4节改作“抬起双脚，就安然去世了”，既保留叙事性的死亡委婉语，也避免“收起双脚”的不确切表达。
  terminology: “尊敬”“救恩”“背离”“列祖”“希伯仑”均恰当。“苦害”可保留，以反映κακώσει所含的苦难／加害语义张力。第2节单数“他”的指向不明，保留脚注是审慎做法。
  issues:
  - severity: medium
    issue: 第4节“收起双脚”未准确反映ἐξάρας τοὺς πόδας。
    rationale: ἐξάρας是“举起、抬起”，不是“收起”。此处虽可与临终叙事的姿势相连，译文仍应保留“抬起”的动作。
  - severity: medium
    issue: 第5节“安放在他列祖中间”弱化了μετὰ的同葬关系。
    rationale: μετὰ τῶν πατέρων αὐτοῦ直指“与他的列祖一起”；“与列祖同葬”较准确，也符合汉语葬葬叙事。
  - severity: low
    issue: 第3节“把我葬在我列祖附近”可更直接体现ἐγγὺς τῶν πατέρων μου。
    rationale: “葬在我列祖旁边”保留“靠近”而非同葬的空间关系，表达更简洁自然。
