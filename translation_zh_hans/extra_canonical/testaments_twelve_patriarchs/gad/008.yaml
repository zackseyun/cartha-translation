  rationale: 修订仅处理可安全确定的希腊文语义：将“收起双脚”改为“抬起双脚”，将第5节改为明确的“与列祖同葬”，并微调第1、3节以兼顾原文句法与现代汉语。第1节不将犹大和利未所关联的救恩预先限定为任何特定的后期神学解释；第2节代词歧义继续以脚注保留。
