lexical_decisions:
- source_word: παραινῶ
  choice: 劝勉
  rationale: 保留临终训诫的郑重语气，比“建议”更有劝戒力量，同时是现代汉语中自然的宗教伦理用语。
- source_word: τὸν πλησίον
  choice: 邻舍
  rationale: 这是伦理训诫中的固定概念，指与自己有关联的他人；“邻舍”既准确又能保持经文语体。
- source_word: ἐξάρατε τὸ μῖσος
  choice: 除去仇恨
  rationale: 表达主动、彻底清除内心仇恨的命令语气，且避免过于生硬的“拔除”。
- source_word: διανοίᾳ ψυχῆς
  choice: 心灵的意念
  rationale: 保留ψυχή与διάνοια所构成的内在层次，不将其简化为泛泛的“真诚”。
- source_word: εἰρηνικὰ ἐλάλουν
  choice: 说和睦的话
  rationale: 既可表达言语内容和平，也与后文内心仇恨形成鲜明张力。
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: 仇恨之灵
  rationale: 保留希腊文对仇恨的灵性化、人格化表达，不把它弱化为单纯情绪。
- source_word: νοῦν / λογισμόν
  choice: 心思／念头
  rationale: 分别呈现受蒙蔽的心智与受扰乱的思虑，避免两个近义词被译成同一个词。
- source_word: εἰπὲ αὐτῷ εἰρήνην / ἐν εἰρήνῃ
  choice: 用和睦的态度对他说话
  rationale: 自然传达带有闪语色彩的“说和平”表达，同时保留和平处理冲突的伦理要求。
- source_word: δόλον
  choice: 诡诈
  rationale: 指内心隐藏的欺骗和恶意；“诡诈”简洁而符合庄重经文语体。
- source_word: μετανοήσας
  choice: 回心转意
  rationale: 在承认人际过错的语境中，表达思想与态度的转变，不额外限定为制度化的宗教悔改。
- source_word: δολοφωνεῖ
  choice: 暗中谋害
  rationale: 保留以诡诈方式实施致命伤害的含义；“谋害”不强行断定行动是否已经造成死亡。
- source_word: τὸν ἰόν
  choice: 仇恨的毒
  rationale: 保留“毒”的隐喻，并借上下文明确它所指的是传播、沾染的仇恨。
- source_word: τὴν ἐκδίκησιν
  choice: 报应
  rationale: 涵盖追究和惩罚恶行的意义，适合“交给上帝”的判断语境，同时避免鼓励私人报复。
theological_decisions:
- issue: μετανοήσας在人际伦理语境中的译法
  choice: 回心转意
  alternative: 悔改
  rationale: 此处紧接“承认过错”，重点是犯错者改变心意和态度；“回心转意”既保留道德分量，也不把上下文未明说的宗教含义强加进去。
- issue: “仇恨之灵”的本体性质
  choice: 直译为“仇恨之灵”
  alternative: 仇恨的情绪
  rationale: 原文可能具有灵性实体或人格化道德力量的意味；直译保留这种张力，不替读者判定它仅是心理状态。
- issue: 末句对报复与上帝审判的关系
  choice: 把报应交给上帝
  alternative: 让上帝为你伸冤
  rationale: 原文强调放弃私人报复并将ἐκδίκησις交托上帝；“报应”保留惩治含义，不把它单方面解释为替受害者伸冤。
- issue: 第4节“双重的罪”的主语与逻辑
  choice: 保留“你犯下双重的罪”
  alternative: 他因起假誓而罪上加罪
  rationale: 现有希腊文本以第二人称“你犯罪”，其具体逻辑并不完全清楚；译文不擅自改换主语或解释双重罪的构成。
translation_notes:
  register: 采用现代标准普通话的庄重劝诫体，句式清楚，适合普通读者朗读。保留“邻舍”“仇恨之灵”“报应”等具有经文色彩但仍易懂的词。第3、5、6节的文本疑难以脚注说明，正文采用可读而不过度释义的表达；没有把“仇恨之灵”纯粹心理化，也没有替第4节的“双重的罪”补出原文未明确的解释。
