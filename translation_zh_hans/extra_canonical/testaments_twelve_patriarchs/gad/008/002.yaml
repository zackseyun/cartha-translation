base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/002.yaml
  text: For I have known that your children will turn away from him, and in every wickedness and affliction and corruption they will be away from the Lord.
translation:
  language: zh_hans
  text: 2 因为我知道，你们的儿女必离弃他[a]，将处在各样的邪恶、苦难和败坏之中，远离主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”的所指在本节希腊文中没有明说，须由上文判断。
    reason: 保留代词的真实指代不明确性，避免无依据地明确为“主”。
lexical_decisions:
- source_word: ἔγνων
  choice: 我知道
  rationale: 该不定过去时在此表达先知式的认识；现代汉语用“知道”自然且不额外限定得知的时间或方式。
- source_word: τὰ τέκνα ὑμῶν
  choice: 你们的子孙
  rationale: τέκνα 字面为“儿女/孩子”，在族长对后代的预言语境中指后裔；“子孙”比“孩子”更准确自然。
- source_word: ἀποστήσονται
  choice: 必离弃
  rationale: 该动词表示背离、离开；“离弃”保留主动背叛关系对象的意味。
- source_word: πονηρίᾳ
  choice: 邪恶
  rationale: 保留道德层面的恶，不弱化为一般的坏事。
- source_word: κακώσει
  choice: 苦害
  rationale: κάκωσις 可指苦待、伤害或受苦；“苦害”保留施害与苦难之间的语义张力。
- source_word: διαφθορᾷ
  choice: 败坏
  rationale: 涵盖腐化、毁坏的意义，并符合此处道德语境。
- source_word: ἔσονται ἀπὸ Κυρίου
  choice: 远离主
  rationale: 贴近希腊文“他们将会在主以外/离开主”的异常而强烈表达，避免擅自改写为“被主弃绝”。
theological_decisions:
- issue: ἀπ᾽ αὐτοῦ 中“他”的所指
  choice: 保留“他”并加注说明其所指须由上下文判断
  alternative: 直接译作“主”
  rationale: 本节希腊文本使用代词而非明确重述“主”；直改为“主”会消除原文形式上存在的指代空间。
- issue: 远离主是主动背离还是受审判隔绝
  choice: 译作中性的“远离主”
  alternative: “被主弃绝”或“离弃主”
  rationale: ἔσονται ἀπὸ Κυρίου 字面结构未明确标示施事或因果；中性表达保留神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“陷在……中”使希腊文较生硬的与格串联在汉语中自然可读，同时保留“邪恶、苦害、败坏”三项并列；末句独立为“远离主”，不替原文裁定这是主动背离还是受审判的结果。
