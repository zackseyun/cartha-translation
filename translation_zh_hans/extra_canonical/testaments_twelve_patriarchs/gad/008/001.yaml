  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/001.yaml
  text: Speak these things, you also, to your children, so that they may honor Judah and Levi; for from them the Lord will raise up for you salvation for Israel.
translation:
  language: zh_hans
  text: 你们也要把这些话告诉你们的儿女，使他们尊敬犹大和利未，因为主必从他们中间，为你们、为以色列兴起救恩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε
  choice: 告诉
  rationale: 该词意为“说、讲述”；这里以“把这些话告诉”自然表达向儿女传述训言的语境。
- source_word: τιμήσωσιν
  choice: 尊敬
  rationale: 保留“尊重、给予尊荣”的基本含义，不扩大为“服从”或宗教性的“敬拜”。
- source_word: ἀνατελεῖ
  choice: 兴起
  rationale: 原词可指“升起、萌发、使出现”；“兴起救恩”既保留其形象，也符合庄重的救赎语境。
- source_word: σωτηρίαν
  choice: 救恩
  rationale: 此处是抽象名词“拯救、救恩”，不把它具体化为原文未明说的“救主”。
- source_word: ἐξ αὐτῶν
  choice: 从他们中间
  rationale: “他们”同时回指犹大和利未，保留救恩从二者而出的复数表达。
theological_decisions:
- issue: “救恩”与犹大、利未的关系
  choice: 保留“主必从他们中间……兴起救恩”
  alternative: 解释为从犹大兴起君王、从利未兴起祭司
  rationale: 原文只把犹大和利未共同列为救恩所出的来源，并未在本节明确分配王权或祭司职分，因此不加入后来的神学展开。
- issue: ὑμῖν与τῷ Ἰσραήλ两个与格的关系
  choice: 译作“为你们，就是为以色列”
  alternative: “为你们兴起以色列的救恩”或仅译“为以色列兴起救恩”
  rationale: 把“以色列”理解为对“你们”的同位说明，可同时保留两个与格，并避免把“以色列”误解成“救恩”的所有格修饰语。
translation_notes:
  register: 采用现代、庄重而易懂的训诫体。“你们也要”保留καὶ ὑμεῖς的强调；句序尽量贴近希腊文，同时用“就是为以色列”使双重与格在中文中清楚自然。
