review_pass:
  verdict: revise
  source_fidelity: 译文准确表达了五年后的时间、送往希伯仑及与其父祖安葬的事件。不过，“运到”在现代汉语中常用于货物运输，虽可指遗体，仍不如“带到”贴合ἀνήγαγον的叙事性“带上去／带去”。
  naturalness: “安葬在他列祖身旁”基本通顺，但“列祖身旁”易令人联想到逐一可见的身体位置；中文葬葬叙事中“安葬在他列祖那里”更自然，也能表达μετὰ τῶν πατέρων αὐτοῦ的归入祖先安葬处之意，而不擅自规定墓穴安排。
  terminology: “希伯仑”是通行地名译法。“列祖”可保留经文语体；将地点关系表为“在他列祖那里”较符合现代汉语和本句安葬语境。
  issues:
  - severity: low
    issue: “运到”略显物流语体。
    rationale: ἀνήγαγον的核心是带领、带去（并含“上去”之方向），在此用“带到”更自然；无需在中文中机械保留“上去”。
  - severity: low
    issue: “列祖身旁”对墓葬空间关系过于具象。
    rationale: μετά可表示与父祖同葬、归入父祖所在之处；“在他列祖那里”保留这一概括关系，避免暗示特定的相邻安放方式。
