  text: And after five years they brought him up to Hebron, and laid him with his fathers.
translation:
  language: zh_hans
  text: 五年后，他们把他带到希伯仑，安葬在他列祖那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνήγαγον
  choice: 运到
  rationale: 该动词意为“带上去、运上去”；这里所指对象处于安葬语境中，用“运到”自然地表达将遗体送往希伯仑，同时避免中文“带上希伯仑”的生硬。
- source_word: ἔθηκαν
  choice: 安葬
  rationale: 字面为“放置”，但“放在列祖身旁”在此明确涉及埋葬；译作“安葬”符合现代汉语，也保留庄重语体。
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: 在他列祖身旁
  rationale: “列祖”保留经文式亲族与安葬意象，“身旁”对应μετά所表达的同在、相伴位置关系，而不额外断定同穴或合葬。
theological_decisions:
- issue: “与列祖同在”的表达是否应解释为死后归宿
  choice: 按安葬场景译为“安葬在他列祖身旁”
  alternative: “归到他列祖那里”
  rationale: 上下文陈述将他运往希伯仑并放置，首先是遗体安葬叙事；避免把短语扩展为特定的死后状态教义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“五年后”简洁对应时间状语；“列祖”保留古代家族墓葬语境所需的经文色彩。所给资料虽标有校勘注号17、18，但未提供注释内容，因此不臆造脚注。
