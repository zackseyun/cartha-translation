lexical_decisions:
- source_word: ἡσυχάσας ὀλίγον
  choice: 安静地歇了一会儿
  rationale: 分词表示短暂静息后再开口；这样既保留“安静”的语义，也符合现代汉语叙事习惯。
- source_word: ὑπακούσατε
  choice: 要听从……的话
  rationale: 准确表达命令式“听从、顺从”，并使中文宾语关系自然。
- source_word: τῶν πατέρων μου
  choice: 我列祖
  rationale: 此处复数指先祖；“列祖”庄重简洁，也避免误解为多个生父。
theological_decisions:
- issue: “你们父亲”所指是否应明确为说话者本人
  choice: 保留为“你们父亲”
  alternative: 译作“我的话”
  rationale: 原文明确使用“你们的父亲”，保留亲属称谓及临终训示的语气，不将其意译消解。
