  text: And drawing up his feet, he fell asleep in peace.
translation:
  language: zh_hans
  text: 他抬起双脚，就在平安中睡去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “睡去了”原文直译为“睡了”；此处是对死亡的委婉表达。“在平安中”也可译为“安然地”。
    reason: 说明原文“睡了”的死亡委婉语，并交代“在平安中”的表达，避免将其理解为普通睡眠。
lexical_decisions:
- source_word: ἐξάρας τοὺς πόδας αὐτοῦ
  choice: 他收起双脚
  rationale: ἐξάρας本义为“抬起、提起”，此处与临终姿态相连；“收起双脚”既自然，也保留原文所描写的动作，不擅自补入“床上”等原文未明说的细节。
- source_word: ἐκοιμήθη ἐν εἰρήνῃ
  choice: 安然长眠了
  rationale: ἐκοιμήθη字面为“睡了”，在此是死亡的委婉说法；ἐν εἰρήνῃ为“在平安中”。“安然长眠”在现代汉语中自然庄重，同时保留睡眠意象与平安离世的含义。
theological_decisions:
- issue: ἐκοιμήθη是否直译为睡眠，或明确译为死亡
  choice: 用“长眠”保留死亡委婉语
  alternative: 译作“安然去世了”或“在平安中睡了”
  rationale: 上下文显然描述死亡，但原文有意使用“睡去”的意象。译为“长眠”既不模糊事件性质，也不抹去原文表达方式。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“收起双脚”呈现临终动作；“安然长眠”符合遗言叙事的肃穆语体，并保留希腊文的委婉表达。
