  text: '[β, Α, S¹] 5. Καὶ ὁ Θεὸς τῶν πατέρων μου²⁰ ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου, ἵνα μὴ²¹ ποιήσω ἀνόμημα²² ἐν Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/005.yaml
  text: But the God of my fathers rescued him from my hands, so that I might not commit a lawless deed in Israel.
translation:
  language: zh_hans
  text: 但我祖先的上帝把他从我手中救了出来，使我不至于在以色列中做出不法之事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: 我祖先的上帝
  rationale: 自然表达复数 πατέρων 所指的历代祖先，同时保留立约历史语感。
- source_word: ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου
  choice: 把他从我手中救了出来
  rationale: 保留“救出、解救”的动作及“从我手中”这一带有控制或伤害意味的来源短语。
- source_word: ἵνα μὴ ποιήσω
  choice: 使我不至于……做出
  rationale: 表达否定目的或结果色彩，不强行消解 ἵνα 在此处可能兼具的目的与结果意味。
- source_word: ἀνόμημα
  choice: 不法之事
  rationale: 对应违反律法的行为；比“罪”更具体地保留词根中的律法含义，又不额外限定行为性质。
- source_word: ἐν Ἰσραήλ
  choice: 在以色列中
  rationale: 保留原文可指以色列群体或其境内的简洁表达，不擅自具体化。
theological_decisions:
- issue: 上帝介入与人的责任之间的关系
  choice: 使我不至于在以色列中做出不法之事
  alternative: 免得我在以色列中做出不法之事
  rationale: “使我不至于”清楚呈现上帝的拯救行动阻止说话者犯罪，同时仍保留行为本会由说话者实施的人类责任；不延伸为关于自由意志或预定的教义判断。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“我祖先的上帝”比“我列祖的上帝”更贴近日常现代汉语；“不法之事”保留古代宗教—法律语境，又不显得过分文言。
