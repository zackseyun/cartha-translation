  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/002.yaml
  text: And because of the dreams I added hatred toward him, and I wanted to lick him up from the land of the living, as a calf licks up the green growth of the field.
translation:
  language: zh_hans
  text: 又因那些梦，我对他更加怀恨；我想把他从活人之地舔食净尽，正如牛犊舔食田野的青草。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: 我对他越发怀恨
  rationale: 保留“增添仇恨”的递增含义，同时用自然的现代汉语表达。
- source_word: ἐκλεῖξαι
  choice: 舔尽
  rationale: 保留原文强烈而具体的“舔食殆尽”意象，并与下文牛犊的比喻呼应。
- source_word: ἐκ γῆς ζώντων
  choice: 从活人之地
  rationale: 采用庄重且贴近原文的表达，不将其解释性改写为单纯的“杀死”。
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: 田野的青草
  rationale: χλωρά在此指青绿的植物；结合田野与牛犊的语境译作“青草”最自然。
theological_decisions:
- issue: “从活人之地舔尽”的含义
  choice: 保留原文隐喻
  alternative: 把他从世上除掉／杀死他
  rationale: 原文以“舔尽”表达彻底消灭的愿望，且随即以牛犊舔青草作解释；直保意象可避免消解其文学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留原文略显骇人的舔食隐喻及其平行结构。
