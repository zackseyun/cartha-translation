id: T12P.GAD.2.4
reference: Testament of Gad 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 5. Οὕτως¹⁴ ὁ Θεὸς τῶν πατέρων ἡμῶν ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν ἡμῶν, ἵνα μὴ ποιήσωμεν ἐν τῷ Ἰσραὴλ ἀνομίαν μεγάλην. [β, Α, S¹] 4. Καὶ οὕτως τῇ πλεονεξίᾳ ἐπληροφορήθημεν¹⁹ τῆς ἀναιρέσεως αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/004.yaml
  text: 'Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    And so, through greed, we were fully persuaded of his murder.'
translation:
  language: zh_hans
  text: '这样，我们祖先的上帝把他从我们手中救了出来，免得我们在以色列中犯下严重的不法之事。[a]


    就这样，我们因贪欲而完全认定要杀死他。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此句见于α文本；该文本将其编为第5节。
    reason: 交代原始证据中的文本传统及节号差异。
  - marker: b
    text: 此句见于β文本及A、S¹抄本；这些见证将其编为第4节。
    reason: 说明此句的抄本支持，并让读者了解两句来自不同文本见证与编号。
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων ἡμῶν
  choice: 我们祖先的上帝
  rationale: 准确保留属格关系及以色列传统中的称谓，同时使用现代汉语自然表达。
- source_word: ἐρρύσατο
  choice: 救了出来
  rationale: 表达从现实危险和他人掌控中施行解救的含义，并与“从我们手中”自然衔接。
- source_word: ἀνομίαν μεγάλην
  choice: 严重的不法之事
  rationale: 保留ἀνομία的“不法、违背律法”语义，不将其泛化为普通的“恶事”或直接改写成特定罪名。
- source_word: πλεονεξίᾳ
  choice: 因贪欲
  rationale: 将与格理解为原因或推动因素；“贪欲”既涵盖贪婪，也保留过度欲求的较宽语义。
- source_word: ἐπληροφορήθημεν
  choice: 完全认定
  rationale: 体现“充分确信、完全被说服”的强度；用现代汉语表达其达到坚定判断的状态。
- source_word: τῆς ἀναιρέσεως αὐτοῦ
  choice: 要杀死他
  rationale: ἀναίρεσις在此指夺去性命；鉴于所述杀害尚未完成，采用目的性表达，避免误示他已经被谋杀。
theological_decisions:
- issue: “以色列”所指的歧义
  choice: 在以色列中
  alternative: 在以色列家中／对以色列犯下
  rationale: 原文ἐν τῷ Ἰσραήλ可指群体、家族或以色列范围；直译保留这种开放性，不擅自限定。
- issue: 上帝的介入与人的责任
  choice: 并列保留“上帝救出”与“免得我们犯下”
  alternative: 解释为上帝取消了他们的罪责或强制改变其意志
  rationale: 原文同时陈述神的拯救行动和人的潜在罪行；译文不额外解决二者之间的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“严重的不法之事”保持律法语感；“完全认定要杀死他”避免生硬照搬英语，同时保留希腊文确信程度及杀人意图。分段依照所给校勘材料呈现两种文本见证。
