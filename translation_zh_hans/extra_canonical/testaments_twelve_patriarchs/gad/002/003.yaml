  text: '[α-text] 3. Καὶ κρυφῆ πράσας αὐτὸν Ἰούδας τοῖς Ἰσμαιλίταις. [β, Α, S¹] 3. Διὸ¹⁵ ἐγὼ καὶ Συμεὼν¹⁶ πεπράκαμεν αὐτὸν τοῖς Ἰσμαηλίταις [*τριάκοντα χρυσίων¹⁷, καὶ τὰ δέκα ἀποκρύψαντες τὰ εἴκοσι ἐδείξαμεν τοῖς ἀδελφοῖς ἡμῶν¹⁸].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/003.yaml
  text: 'But Judah sold him secretly to the Ishmaelites.


    Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers.'
translation:
  language: zh_hans
  text: 3 因此，我和西缅以三十枚金币的价钱，把他卖给了以实玛利人；我们把其中十枚藏起来，只向弟兄们展示二十枚。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一文本传统作：“犹大暗中把他卖给了以实玛利人。”
    reason: α 文本将出卖者记为犹大，不含正文所述“我和西缅”及钱款分配的内容。
  - marker: b
    text: 从“以三十枚金币”至“展示二十枚”的一段，在所据希腊文本中置于方括号内，并以星号标示为存疑。
    reason: 保留来源对这整段文字传本地位不确定的标记。
lexical_decisions:
- source_word: πεπράκαμεν
  choice: 把他卖给了
  rationale: 按动词 πιπράσκω 的通常意义直译，清楚表达约瑟被出卖。
- source_word: Ἰσμαηλίταις
  choice: 以实玛利人
  rationale: 采用现代中文圣经语境中通行的族名译法。
- source_word: τριάκοντα χρυσίων
  choice: 三十枚金币
  rationale: χρυσίων 指金制货币或金钱；“枚金币”既保留计数形式，也避免误添原文未说明的具体币种。
- source_word: ἀποκρύψαντες
  choice: 藏起
  rationale: 保留其有意隐瞒钱财的动作含义。
- source_word: ἐδείξαμεν
  choice: 拿给……看
  rationale: 比生硬的“显示”更符合现代汉语，同时准确传达只让弟兄们看到二十枚的意思。
theological_decisions:
- issue: 不同希腊文本对出卖约瑟者的记载不同
  choice: 正文采用 β、A、S¹ 所见的“我和西缅”，并以脚注保留 α 文本的“犹大”读法
  alternative: 以 α 文本“犹大暗中把他卖给了以实玛利人”为正文
  rationale: 现有来源明确并列两个文本传统；正文不能把两种互不相同的叙述误接成连续发生的两件事，因此选一读法入正文，并完整注明另一读法，以保留文本张力。
- issue: 三十枚金币及分藏钱款一语的文本状态
  choice: 收入正文并加文本脚注
  alternative: 从正文删去，仅在脚注列出
  rationale: 所给希腊文本以方括号和星号标示该段，显示其传本地位有疑问；收入正文可与主要咨询层保持连续，同时脚注明示不确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因此”对应 Διό，并维持本节与上文的因果衔接；句式简洁，适合普通读者。没有把 α、β 两种读法拼接为同一段连续叙事。
