source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: II. Ὁμολογῶ τοίνυν¹ τὴν ἁμαρτίαν μου, τέκνα², ὅτι πλειστάκις ἤθελον³ ἀνελεῖν αὐτόν, *ἐπειδὴ ἐμίσουν αὐτὸν ἐκ ψυχῆς⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/001.yaml
  text: Therefore I confess my sin, children, that many times I wanted to kill him, because I hated him from my soul.
translation:
  language: zh_hans
  text: 所以，孩子们，我承认我的罪：我曾多次想杀死他，因为我从心底恨他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: 我承认
  rationale: 直接表达公开承认、坦白之意，符合此处认罪语境。
- source_word: τέκνα
  choice: 孩子们
  rationale: 保留父亲对众子的直接称呼，现代汉语自然且庄重。
- source_word: πλειστάκις ἤθελον
  choice: 曾多次想
  rationale: πλειστάκις 表示屡次，未必需强化为“无数次”；ἤθελον 表达过去反复出现的意愿。
- source_word: ἀνελεῖν
  choice: 杀死
  rationale: 此处指夺去性命；“杀死”准确自然，不淡化其严重性。
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  choice: 我从心底恨他
  rationale: 以自然汉语保留“出自内心/灵魂深处”的强烈、彻底憎恨之意。
theological_decisions:
- issue: ὅτι 所引内容与标点的关系
  choice: 以冒号引出所承认之罪的具体内容
  alternative: 译作“我承认我的罪，就是我曾多次……”
  rationale: ὅτι 在此引出承认的内容。汉语用冒号比机械加入“即/就是”更自然，同时没有改变句法关系或罪的具体内容。
- issue: ἐκ ψυχῆς 的表达
  choice: 从心底
  alternative: 从灵魂里／全心全意地
  rationale: “从心底”保留内在深处的语义和憎恨强度，同时避免将 ψυχή 在此处术语化，从而导入并非文本重点的灵魂论解释。
translation_notes:
  register: 采用现代标准普通话，语气庄重但易懂；保持第一人称认罪的直接性与“想杀死他”的道德张力，不加解释性缓和。
