  text: 1[a]. But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be brought to completion. For in this way it is to your advantage. 2. And if he is exalted still more[b], do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who gives good and profitable things to all people. 3. Examine the judgments of the Lord, and your purpose will be illumined and be at rest. 4. But if someone grows rich through evil, like Esau my father's brother, do not be jealous; rather, wait for the appointed limit of the Lord. 5. For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment. 6. For the poor man, if being free from envy in all things he is pleasing to the Lord, is richer than all, because he does not have the distraction of vain people. 7. Therefore cast out hatred from your souls[d][c], and love one another in deed and in word and in the
    disposition of your soul.
translation:
  language: zh_hans
  text: '《迦得遗训》第7章


    1 若有人比你们更顺遂，不要忧愁，反要为他祷告，使他得以完全[a]；因为这样对你们有益。2 即使他的地位越发升高，也不要嫉妒他；要记住，凡有血肉的都必死。你们却要向主献上赞歌，因为他把美好而有益的事赐给所有人。3 要察究主的判断，你心中的谋虑就会明朗而安定[b]。4 如果有人靠恶事致富，像我父亲的兄弟以扫那样，你们不要眼红，只要等候主所定的界限[c]。5 因为他若在灾祸中夺去这些财物[e]，或赦免悔改的人；不悔改的人就被保留到永远的刑罚[d]。6 穷人若在一切事上不嫉妒，并蒙主喜悦，他就比所有人都富足，因为他没有虚妄之人的纷扰[f]。7 所以，要从你们的心灵中除掉仇恨，以正直的心彼此相爱。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得以完全”也可译作“得以成全”或“达到圆满”。
    reason: lexical_alternative
  - marker: b
    text: 本句希腊文本身较为疑难；“明朗”所据的词也可按字面理解为“受到照耀”。
    reason: textual_variant
  - marker: c
    text: “主所定的界限”也可能指“主所定的时刻”或“主的定命”。
    reason: lexical_alternative
  - marker: d
    text: “永远的”所译的希腊词也可表达“长久的”或“历世的”。
    reason: alternative_reading
  - marker: e
    text: 原文“这些”未明说所指；按上下文很可能指那人所得的财富。“在灾祸中”也可理解为“藉着灾祸”或“在恶事中”。
    reason: textual_variant
  - marker: f
    text: “虚妄之人的纷扰”也可理解为“世人虚妄事务所带来的分心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδοῦται
  choice: 更顺遂
  rationale: 此处指人在处境或事业上进展良好，并非字面的旅途顺利；“顺遂”自然地保留了与他人比较时可能引发忧愁或嫉妒的语境。
- source_word: τελειωθῇ
  choice: 得以完全
  rationale: 保留“达到完整、成熟或圆满结局”的宽广含义，不把它缩减为继续发达，也不引入后期特定的“完全论”术语。
- source_word: ὕμνους προσφέρετε
  choice: 献上赞歌
  rationale: 既表达颂赞，也保留 προσφέρετε 所带的敬拜与献呈色彩。
- source_word: κρίματα Κυρίου
  choice: 主的判断
  rationale: 可指主的裁决、审判或治理决定；“判断”保留其司法意味，同时避免限定为成文律例。
- source_word: διαβούλιόν
  choice: 心中的谋虑
  rationale: 该词指内在的思量、打算或决意；加入“心中的”使现代汉语读者清楚其内在性质。
- source_word: ὅρον Κυρίου
  choice: 主所定的界限
  rationale: ὅρος 可指界限、定限，也可能暗含所定的时刻；正文保留“界限”，不将歧义单一化为时间或命令。
- source_word: αἰωνίαν κόλασιν
  choice: 永远的刑罚
  rationale: 在警戒语境中，这是最直接自然的译法；同时以脚注保留 αἰώνιος 可能被理解为“长久、历世”的词义讨论空间。
- source_word: ἄφθονος
  choice: 不嫉妒别人
  rationale: 在本章反复劝戒嫉妒的主题下，应取“没有嫉妒”之义，而非一般性的慷慨。
- source_word: ἐν εὐθύτητι καρδίας
  choice: 以正直的心
  rationale: 自然表达“在内心正直中”的方式或状态，并保留全章从内在态度谈伦理行为的重点。
theological_decisions:
- issue: 为顺遂之人祷告时 τελειωθῇ 的含义
  choice: 译作“使他得以完全”
  alternative: 使他完全兴盛；使他被成全
  rationale: 原词不仅可能指外在成功的完成，也可指人成熟或事情达到圆满；正文保留这种开放性，不赋予特定教义体系中的技术含义。
- issue: 恶人致富时应等候的 ὅρον Κυρίου
  choice: 译作“主所定的界限”
  alternative: 主所定的时刻；主的定命
  rationale: 上下文要求人在不义的兴盛面前忍耐。原词同时容许边界、限度或所定时刻等意味，故不在正文中将其窄化。
- issue: αἰωνίαν κόλασιν 的时长
  choice: 正文译作“永远的刑罚”
  alternative: 长久的刑罚；历世的刑罚
  rationale: 正文采用该警告语境中最直接的理解，但脚注说明形容词的另一种可能表达，以保留真实的词义张力。
- issue: 第5节赦免与刑罚的句法关系
  choice: 按悔改者蒙赦免、不悔改者被留待刑罚来表达
  alternative: 把省略的施事者明确译为主，或将“被夺去”理解为主主动除去财物
  rationale: 希腊文此处句法压缩且传本文字不稳。正文呈现清楚可辨的对照，却不擅自补入原文未明说的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“顺遂、察究、谋虑、纷扰”等词保持遗训体的严肃感，但避免过度古雅。称谓“我父亲的兄弟以扫”依原文保留亲属关系的明说；第7节严格依所给希腊文收束为“以正直的心彼此相爱”，不采用英语咨询层中超出本段希腊文的扩展结语。
