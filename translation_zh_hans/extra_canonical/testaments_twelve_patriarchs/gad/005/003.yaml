  text: 3. Ἡ²⁵ δικαιοσύνη²⁶ ἐκβάλλει τὸ μῖσος²⁷, ἡ ταπείνωσις ἀναιρεῖ *τὸ ζῆλος²⁸. ὁ γὰρ δίκαιος καὶ ταπεινῶς αἰδεῖται ποιῆσαι ἄδικον²⁹, ⸀οὐχ ὑπ᾽ ἄλλου³⁰ καταγινωσκόμενος³¹ ἀλλ᾽³² ὑπὸ τῆς ἰδίας καρδίας³³, ὅτι Κύριος ἐπισκοπεῖ³⁴ *τὴν ψυχὴν³⁵ αὐτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/003.yaml
  text: Righteousness casts out hatred, and humility removes jealousy. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul.
translation:
  language: zh_hans
  text: 义驱除仇恨，谦卑消除嫉妒。因为义人谦卑，耻于行不义；他并非因别人谴责他，而是因自己的心谴责他，因为主察看他的灵魂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: 正义
  rationale: 此处是与仇恨相对、能驱除仇恨的德性，译作“正义”自然且保留抽象名词形式。
- source_word: ταπείνωσις
  choice: 谦卑
  rationale: 表示自我降卑、谦逊的品格；“谦卑”符合现代中文宗教与一般伦理语境。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: ζῆλος 可指热忱、妒忌或争竞；本句列举应被消除的负面情感，故取“嫉妒”。
- source_word: αἰδεῖται
  choice: 以……为耻
  rationale: 表达因羞耻感或敬畏而不愿行某事；此译保留其内在道德羞耻感。
- source_word: καταγινωσκόμενος
  choice: 定他的罪／责备他
  rationale: 该词可表示谴责、判定有罪；因施事者分别为别人和自己的心，中文依语境用“定罪”与“责备”表达同一谴责观念。
- source_word: ἐπισκοπεῖ
  choice: 察看
  rationale: 可指鉴察、看顾或监督；“察看”保留主持续关注并审视其灵魂的语义张力。
- source_word: ψυχή
  choice: 灵魂
  rationale: 在此指人的内在生命或灵魂；“灵魂”与文本的伦理—宗教语境相称。
theological_decisions:
- issue: 主“察看”灵魂的含义
  choice: 察看
  alternative: 看顾／鉴察
  rationale: 原词 ἐπισκοπεῖ 兼有照看与监督审察的可能；正文用较中性的“察看”，不把经文限定为安慰性的看顾或审判性的鉴察。
- issue: 内心谴责与外在定罪的关系
  choice: 别人定他的罪／自己的心责备他
  alternative: 被别人谴责／被自己的心谴责
  rationale: 保留行为约束来自内心而非他人裁断的对比，同时以自然中文区分外在定罪和内在良知责备，未将其扩展为特定的救恩论命题。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。句式保留原文两组德性与恶念的平行关系，并将较生硬的“义人且谦卑地羞于……”处理为“义人谦卑自守，以行不义为耻”，以兼顾准确与可读性。
