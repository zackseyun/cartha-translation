    issue: “正义”较可能偏离 δικαιοσύνη 在本句中的德性含义。
    rationale: 此处与仇恨相对的是人的“义／公义”品格，而非主要指社会公平或抽象的正义原则；“义”更贴合原文及英语审校文本的 righteousness。
  - severity: low
    issue: “谦卑自守”添加了“自守”的明确内容。
    rationale: ταπεινῶς 表达谦卑的方式或品格；原文没有直接说“自守”。删去可提高对应性。
  - severity: low
    issue: 两处 καταγινωσκόμενος 的中文表达不完全平行。
    rationale: 原文以同一“被谴责”观念对比他人与自己的心。统一为“谴责”更能保留其修辞对照。
  revised_text: 义驱除仇恨，谦卑消除嫉妒。因为义人谦卑，耻于行不义；他并非因别人谴责他，而是因自己的心谴责他，因为主察看他的灵魂。
