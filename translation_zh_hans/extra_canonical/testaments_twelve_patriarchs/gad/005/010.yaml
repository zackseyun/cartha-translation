  text: 10. Δι’ ὧν γὰρ δ⁶³ ἄνθρωπος παρανομεῖ, δι’ ἐκείνων⁶⁴ κολάζεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/010.yaml
  text: For by the very things through which a man transgresses, through those he is punished.
translation:
  language: zh_hans
  text: 因为人借着什么违犯律法，也必借着那些事物受惩罚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομεῖ
  choice: 违法
  rationale: 保留该动词“违犯律法、行不法之事”的法律与道德色彩；现代汉语简明自然。
- source_word: κολάζεται
  choice: 受惩罚
  rationale: 准确表达被动语态和惩治之意，不擅自指明施罚者。
- source_word: δι’ ὧν … δι’ ἐκείνων
  choice: 用什么事物……借着那些事物
  rationale: 保留原文前后对应的介词结构，表达犯罪所凭借的事物也成为受罚的媒介。
theological_decisions:
- issue: 惩罚的施行者
  choice: 不明说施罚者
  alternative: 被上帝惩罚
  rationale: 原文仅用被动式 κολάζεται，没有明确指出上帝或其他施罚者，故保留其含蓄与开放性。
- issue: 介词结构所表达的关系
  choice: 译为犯罪与受罚所借助的同一事物
  alternative: 译为“人犯什么罪，就因什么罪受罚”
  rationale: 原文重复关系代词，较直接地指向“借以犯罪的事物”；不把它简化为罪行与刑罚之间的一般报应原则。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；以“因为……也……”再现原句的因果论断，并保留两组介词短语的对应关系。
