  text: 6. Ταῦτα *ἐγὼ ἔσχατον⁴⁷ ἔγνων μετὰ τὸ μετανοῆσαί⁴⁸ με περὶ⁴⁹ Ἰωσήφ⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/006.yaml
  text: These things I learned at last after I repented concerning Joseph.
translation:
  language: zh_hans
  text: 这些事，是我在为约瑟的事悔改以后才终于明白的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 保留指向上文内容的复数指示表达。
- source_word: ἔσχατον
  choice: 才终于
  rationale: 此处作副词，表示“最后、终于”；与“才”结合，自然体现领悟发生得较晚。
- source_word: ἔγνων
  choice: 明白
  rationale: γινώσκω 的不定过去时在此指经过经历而认识、领悟；“明白”比单纯“知道”更符合语境。
- source_word: μετὰ τὸ μετανοῆσαί με
  choice: 在……悔改以后
  rationale: 准确表达带冠词不定式结构所表示的时间先后，并保留 μετανοέω 在道德语境中的“悔改”含义。
- source_word: περὶ Ἰωσήφ
  choice: 为约瑟的事
  rationale: περί 加属格可表示“关于、涉及”；中文用“为约瑟的事悔改”自然表达他针对自己如何对待约瑟而悔改，同时不补入原文未明说的具体行为。
theological_decisions:
- issue: μετανοέω 的道德与宗教分量
  choice: 悔改
  alternative: 改变想法／回心转意
  rationale: 上下文涉及对约瑟之事的过错与转变，“悔改”能保留其道德分量；同时不额外规定具体的悔改仪式或宗派教义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句中以“才终于”传达较晚才获得认识的语气，并保留原文“为约瑟的事”所具有的概括性。
