  text: V. ⸀Κακὸν οὖν¹ ἐστι² τὸ μῖσος³, ὅτι *ἐνδελεχεῖ συνεχῶς³ *τῷ ψεύδει, λαλῶν⁴ κατὰ τῆς⁵ ἀληθείας, καὶ τὰ μικρὰ μεγάλα ποιεῖ⁶, τὸ *φῶς σκότος⁷ παρέχει⁸, καὶ⁹ τὸ γλυκὺ πικρὸν λέγει¹⁰, ⸀καὶ⸀ συκοφαντίαν¹¹ ἐκδιδάσκει *καὶ ὀργὴν¹² ⸀ἐκταράσσει⸀¹³ καὶ πόλεμον ⸀διεγείρει⸀¹⁴, καὶ ὕβριν¹⁵ καὶ πᾶσαν πλεονεξίαν, κακῶν¹⁶ καὶ¹⁷ ἰοῦ διαβολικοῦ τὴν καρδίαν ἐκπληροῖ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/001.yaml
  text: Hatred, then, is evil, because it continually associates with falsehood, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.
translation:
  language: zh_hans
  text: 所以，仇恨是邪恶的，因为它不断与虚假为伍，出言反对真理；它把小事放大，将光显作黑暗，把甘甜说成苦涩。它教人诽谤，激起愤怒，挑起争战，又使人心充满狂妄、种种贪欲、各种恶事和魔鬼的毒液。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μῖσος
  choice: 仇恨
  rationale: 直接表达带有敌意的恨，符合本段将其人格化并列举其恶果的语境。
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: 不断与虚假为伍
  rationale: 兼顾持续性副词与间接宾语结构，表达仇恨长期依附、结伴于虚假的意思，同时保持自然汉语。
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: 把小事放大
  rationale: 保留“使小的成为大的”这一夸大之意，并采用现代汉语常用表达。
- source_word: τὸ φῶς σκότος παρέχει
  choice: 把光当作黑暗
  rationale: 保留光与黑暗的强烈对照，不额外解释其象征意义。
- source_word: συκοφαντίαν ἐκδιδάσκει
  choice: 教人诽谤
  rationale: συκοφαντία表示诽谤或恶意诬告；此处用“诽谤”涵盖面较广，也符合后续行为列表。
- source_word: πόλεμον διεγείρει
  choice: 挑起争战
  rationale: 体现διεγείρει“唤起、煽动”的主动意义；“争战”既可指具体战争，也保留较广的冲突含义。
- source_word: ὕβριν
  choice: 狂妄
  rationale: 表达傲慢、自大并带有凌辱越界意味；在此恶行列表中“狂妄”自然而庄重。
- source_word: πᾶσαν πλεονεξίαν
  choice: 种种贪欲
  rationale: πλεονεξία可指贪婪、贪得无厌；复数化表达“πᾶσαν”的全面性，而不限定为钱财之贪。
- source_word: ἰοῦ διαβολικοῦ
  choice: 魔鬼的毒液
  rationale: 保留ἰός的具体毒性意象和διαβολικός与魔鬼相关的含义，不弱化为一般的“恶毒”。
theological_decisions:
- issue: διαβολικοῦ是关系性还是性质性修饰
  choice: 魔鬼的毒液
  alternative: 魔鬼般的毒液
  rationale: 希腊语形容词既可表示“属于魔鬼的”，也可表示“魔鬼般的”。正文采用较直接的关系性表达，但不进一步断言具体的鬼魔作用机制。
- issue: 将仇恨人格化的语法效果
  choice: 全段持续以“它”为主语
  alternative: 改写为“怀恨的人”实施各项行为
  rationale: 原文以“仇恨”为主语，描绘其与虚假结伴、教唆并激发恶行；保留人格化可避免把原文含义缩限为对某类人的描述。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。句式保留原文层层推进的修辞结构，并以分号和句号划分长串并列成分，增强朗读清晰度。未添加原文没有的教派性解释。
