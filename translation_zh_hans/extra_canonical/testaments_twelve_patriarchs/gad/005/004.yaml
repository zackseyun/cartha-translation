  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/004.yaml
  text: He does not speak against a holy man, because the fear of God dwells in him.
translation:
  language: zh_hans
  text: 他不毁谤敬虔的男子，因为对上帝的敬畏住在他里面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλεῖ
  choice: 毁谤
  rationale: 该动词指在背后说人坏话、出言诋毁；“毁谤”简洁地保留其负面的言语行为含义。
- source_word: ἀνδρὸς ὁσίου
  choice: 虔敬的人
  rationale: ὅσιος侧重对上帝虔敬、合乎圣洁；译为“虔敬的人”自然，也避免把ἀνήρ不必要地限定为成年男性。
- source_word: ὁ φόβος τοῦ Θεοῦ
  choice: 对上帝的敬畏
  rationale: 保留属格结构所表达的敬畏对象，并以现代汉语清楚呈现。
- source_word: οἰκεῖ ἐν αὐτῷ
  choice: 住在他里面
  rationale: 直译居住意象，保留敬畏在此人里面持续内住的表达。
theological_decisions:
- issue: 末尾代词αὐτῷ的指向
  choice: 译作“他”，保留与希腊文相同的代词表达
  alternative: 明确译作“毁谤者里面”或“虔敬的人里面”
  rationale: 单独看本句，αὐτῷ在语法上可能引发指代疑问；不根据解释传统擅自消除这种含混。按句意较自然地可理解为前述行为主体，但正文不予增补说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“毁谤”比“说……坏话”更凝练，适合智慧劝诫体；整体保持原句因果结构和内住意象。
