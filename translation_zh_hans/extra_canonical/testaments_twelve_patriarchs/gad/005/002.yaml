base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/002.yaml
  text: Therefore I say these things to you from experience, my children, so that you may drive out devilish hatred and cling to the love of God.
translation:
  language: zh_hans
  text: 所以，我的孩子们，我凭亲身经历把这些事告诉你们，好叫你们除掉那属魔鬼的仇恨，紧紧依附于上帝的爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πείρας
  choice: 凭亲身经历
  rationale: 表达“从经验中、由亲历所得”的意思；“亲身”使现代汉语自然清楚。
- source_word: ἐξώσητε
  choice: 除掉
  rationale: 原词含“赶出、逐出”之意；此处以仇恨为宾语，“除掉”既保留主动排斥的力度，又符合汉语表达。
- source_word: τὸ μῖσος τὸ διαβολικόν
  choice: 那属魔鬼的仇恨
  rationale: 保留定冠词所指的特定仇恨及形容词 διαβολικόν 与魔鬼的关联，不弱化为泛泛的“恶毒”。
- source_word: κολληθῆτε
  choice: 紧紧依附
  rationale: 该词本义为“粘连、紧密结合”，引申为坚定依附；加入“紧紧”体现其强度。
- source_word: τῇ ἀγάπῃ τοῦ Θεοῦ
  choice: 上帝的爱
  rationale: 属格在形式上可指上帝所施的爱，也可指人对上帝的爱；正文采用不作限定的汉语属格结构，以保留原文歧义。
theological_decisions:
- issue: “上帝的爱”（ἀγάπη τοῦ Θεοῦ）的属格关系
  choice: 保留为“上帝的爱”
  alternative: “上帝对人的爱”或“对上帝的爱”
  rationale: 希腊语属格本身未明确限定主格属格或宾格属格，译文不替原文消除这种神学张力。
- issue: διαβολικόν 的指涉
  choice: 译作“属魔鬼的”
  alternative: “魔鬼般的”或“恶毒的”
  rationale: 直陈其与 διάβολος（魔鬼）的词源及语义联系，同时不进一步断言仇恨的具体来源或作用方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的孩子们”保留遗训体的亲切称呼；“为要使”体现目的从句，整体维持劝诫语气。
