  to: 所以，我的孩子们，我凭亲身经历把这些事告诉你们，好叫你们除掉那属魔鬼的仇恨，紧紧依附于上帝的爱。
  rationale: 仅作两项低风险语言修订：“好叫”更自然地对应目的从句ὅπως，“依附于”补足现代汉语搭配。其余措辞保留，以维持原文的语义力度、遗训体语气，以及“上帝的爱”的属格歧义。
