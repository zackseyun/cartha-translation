id: T12P.GAD.5.9
reference: Testament of Gad 5:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 9. Ἐπήγαγε γάρ⁴¹ μοι ὁ Θεὸς νόσον ἥπατος, καὶ εἰ μὴ⁵⁷ *αἱ εὐχαὶ⁵⁸ τοῦ πατρός μου⁵⁹ *ἐβοήθησάν μοι⁶⁰, ὀλίγου δεῖν⁶¹ *ἐξέλειπε τὸ πνεῦμα μου⁶².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/009.yaml
  text: For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed.
translation:
  language: zh_hans
  text: 因为上帝使我患上肝病；若不是我父亲的祷告帮助了我，我的气息几乎就断了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπήγαγε ... μοι ὁ Θεὸς
  choice: 上帝使我患上
  rationale: 保留上帝作为动作主体及临到个人身上的使役含义，同时用现代汉语自然表达疾病的发生。
- source_word: νόσον ἥπατος
  choice: 肝病
  rationale: 直译为肝脏的疾病；“肝病”简明、准确且符合现代普通话。
- source_word: αἱ εὐχαὶ τοῦ πατρός μου
  choice: 我父亲的祷告
  rationale: εὐχαί在此指向上帝所作的祈祷；保留复数的集合意义，不必机械译成“祷告们”。
- source_word: ἐβοήθησάν μοι
  choice: 帮助了我
  rationale: 忠实保留祷告作为语法主语的表述，不额外解释帮助如何发生。
- source_word: ὀλίγου δεῖν ἐξέλειπε τὸ πνεῦμα μου
  choice: 我的气息几乎就断了
  rationale: ὀλίγου δεῖν表示“几乎”；ἐξέλειπε表示衰竭、消逝。πνεῦμα在濒死语境中可指生命气息，译作“气息”比抽象的“灵”更符合自然汉语，同时不否认其可能带有灵魂含义。
theological_decisions:
- issue: 上帝与疾病的关系
  choice: 上帝使我患上肝病
  alternative: 上帝容许肝病临到我
  rationale: 原文以ὁ Θεός为ἐπήγαγε的主语，直接表达上帝使疾病临到；译作“容许”会加入原文未明说的神学缓和。
- issue: 父亲祷告的功效
  choice: 我父亲的祷告帮助了我
  alternative: 上帝因我父亲的祷告而帮助我
  rationale: 原文明确以“祷告”为帮助的语法主语；不补出作用机制，以保留原文的表达及神学张力。
- issue: πνεῦμα的所指
  choice: 气息
  alternative: 灵／生命
  rationale: 上下文描写疾病导致濒死，“气息断了”在汉语中自然表达生命将尽；但原词也可指灵，因此不扩写为纯生理概念。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“若不是……几乎就……”清楚再现反事实条件；以分号连接病因陈述与濒死结果。
