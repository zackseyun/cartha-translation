  - severity: medium
    issue: 脚注未说明句末动词的译法及不确定性
    rationale: ἐπείχον τῷ Ἰωσήφ在此语境指持续向约瑟施压／相逼；应在脚注中说明该译法，以免将其误读为单纯的内心敌意。
