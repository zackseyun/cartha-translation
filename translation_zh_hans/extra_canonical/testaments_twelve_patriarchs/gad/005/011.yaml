revisions:
- from: 所以，我既曾狠心敌视约瑟，也因肝脏受苦，遭受了十年无情的审判。[a]
  to: 因此，我对约瑟心怀无情的敌意；我也因肝脏受苦，受了十年无情的审判。在那段时间里，我一直逼迫约瑟。[a]
  rationale: 补译原文句末的时间从句，并以现代汉语自然表达前一处“肝脏”的情感性用法。保留两次“无情”的对应、肝脏受苦、被动的“受审”、十年的期间，以及原文未指明的审判者和逼迫方式。
