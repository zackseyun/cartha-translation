source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 11. Ἐπεὶ Γοὖν⌉ ἔκειτο⁶⁵ τὰ ἥπατα μου ἀνιλεως⁶⁶ κατὰ τοῦ Ἰωσήφ, *τῷ ἥπατι⁶⁷ πάσχων⁶⁸ ἀνιλεως ἐκρινόμην ἐπὶ *χρόνους δέκα⁶⁹, καθ’ *ὃν χρόνον⁷⁰ ἐπείχον⁷¹ τῷ Ἰωσήφ⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/011.yaml
  text: Since, then, my liver was pitilessly set against Joseph, I too, suffering in my liver, was judged pitilessly for ten years.
translation:
  language: zh_hans
  text: 因此，我对约瑟心怀无情的敌意；我也因肝脏受苦，受了十年无情的审判。在那段时间里，我一直逼迫约瑟。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文前后两次提到“肝脏”：前一处按希腊语习惯指内在的情感或敌意，后一处指受苦的身体部位，形成报应式呼应。句末“我一直逼迫约瑟”所译动词表示持续向约瑟施压；原文没有说明具体方式。
    reason: 说明“肝脏”的重复修辞及句末持续性动词的译法，同时不添加原文未说明的逼迫手段。
lexical_decisions:
- source_word: τὰ ἥπατα μου / τῷ ἥπατι
  choice: 我……狠心 / 肝脏
  rationale: 原文以“肝脏”作为敌意所在，也作为受苦的身体部位，形成对应。中文若两处都直译“肝脏”会使前半句极不自然，因此前处按情感意义译为“狠心”，后处保留“肝脏”，并以脚注说明原文的修辞呼应。
- source_word: ἀνιλεως
  choice: 狠心 / 无情地
  rationale: 该词在本句重复出现，意为“不怜悯、无怜悯地”。分别按中文搭配译为“狠心”和“无情”，保留行为与报应之间的对应。
- source_word: ἐκρινόμην
  choice: 遭受了……审判
  rationale: 保留被动式及审判、惩治的语义，不擅自明确审判者。
- source_word: ἐπὶ χρόνους δέκα
  choice: 十年
  rationale: χρόνους本身泛指时期，但根据所据校勘文本及英语审校层译作“十年”；避免旧稿误作“十个月”。
theological_decisions:
- issue: 审判的施行者
  choice: 使用无主被动“遭受了……审判”
  alternative: “上帝无情地审判了我”
  rationale: 希腊文为被动式，没有明说施行者；不把可能暗含的神圣被动直接解释为“上帝”。
- issue: 报应对应关系
  choice: 以“既曾……也……”呈现敌视约瑟与自身受苦受审之间的对应
  alternative: 将疾病只写成自然后果
  rationale: 原句强调相应的惩罚，但没有交代具体因果机制，因此保留张力而不加解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“狠心敌视”传达内在敌意，“遭受……审判”保留原文被动和神学上的未决性。脚注标记已在正文出现。
