source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἡ γὰρ κατὰ Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/007.yaml
  text: For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the mind toward salvation.
translation:
  language: zh_hans
  text: 因为合乎上帝的真悔改除去无知[a]，驱散黑暗，照亮眼睛，赐给心灵知识，并引导心思走向救恩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本见证没有“除去无知”这几个字。
    reason: 原文校勘本将ἀναιρεῖ τὴν ἄγνοιαν καί置于方括号内，需向读者呈现该短语的文本不确定性；标记应锚定在受影响的短语之后。
lexical_decisions:
- source_word: ἡ κατὰ Θεὸν ἀληθὴς μετάνοια
  choice: 合乎上帝的真悔改
  rationale: κατὰ Θεόν表示以神为准则、与神心意相符；“合乎上帝”既贴近原文，又比“照着上帝”更符合现代汉语。μετάνοια译作“悔改”，保留其思想与生命转向的宗教伦理含义。
- source_word: φυγαδεύει τὸ σκότος
  choice: 驱散黑暗
  rationale: φυγαδεύει本指使之逃离、赶走；“驱散”自然地保留其主动排除黑暗的形象。
- source_word: φωτίζει τοὺς ὀφθαλμούς
  choice: 使眼睛明亮
  rationale: 保留“眼睛”这一具体意象，同时以现代汉语表达使人获得属灵辨识的含义，不额外解释其隐喻。
- source_word: γνῶσιν παρέχει τῇ ψυχῇ
  choice: 赐知识给心灵
  rationale: γνῶσις直译为“知识”，ψυχή在此指人的内在生命，译作“心灵”较“灵魂”自然，也不缩减为纯粹理智。
- source_word: ὁδηγεῖ τὸ διαβούλιον πρὸς σωτηρίαν
  choice: 引导心思走向救恩
  rationale: διαβούλιον可指思虑、谋划或内在意念；“心思”保留其认知和意志层面，并避免译成过于目的化的“意图”。πρὸς σωτηρίαν保留方向性，译作“走向救恩”。
theological_decisions:
- issue: κατὰ Θεόν所表达的悔改与上帝之间的关系
  choice: 合乎上帝的真悔改
  alternative: 向着上帝的真悔改／从上帝而来的真悔改
  rationale: 原文主要表达按上帝的标准或心意而有的悔改，并未明确说明其来源或方向，因此避免译成“从上帝而来”或“向着上帝”，以免消除语义张力。
- issue: 方括号内ἀναιρεῖ τὴν ἄγνοιαν καί的文本状态
  choice: 正文译出并加脚注标记
  alternative: 从正文删除
  rationale: 所给校勘文本以方括号标示该短语，表明其文本见证存在疑问。正文保留其内容，同时用脚注公开说明，不把校勘不确定性静默处理。
- issue: σωτηρία的含义
  choice: 救恩
  alternative: 得救／拯救
  rationale: “救恩”保留名词形式及其宗教含义，但不进一步规定其末世、伦理或现世层面。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。并列动词保持原文逐层推进的节奏；避免古奥表达，也不添加原文未明说的教派性解释。
