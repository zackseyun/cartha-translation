  text: 8. *Καὶ οὐκ ἔμαθεν ἀπὸ ἀνθρώπων τοῦτο ἀλλ᾽ οἶδε διὰ μετανοίας τοὺς ἐπιστρέφοντας δέχεσθαι⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/008.yaml
  text: And he did not learn this from men, but through repentance he knows how to receive those who turn back.
translation:
  language: zh_hans
  text: 8 他不是从人那里学到这一点的；但他借着悔改，知道怎样接纳那些回转的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着悔改”也可理解为与“回转的人”相连，译作：“但他知道接纳那些借着悔改回转的人。”
    reason: 希腊文 διὰ μετανοίας 的句法归属略有歧义。正文按其与 οἶδε（“知道”）及后面不定式结构的自然联系翻译，同时保留另一种可能。
lexical_decisions:
- source_word: οὐκ ἔμαθεν ἀπὸ ἀνθρώπων
  choice: 不是从人那里学到
  rationale: 贴近希腊文的否定陈述，并保留“从人而来”的来源含义。
- source_word: διὰ μετανοίας
  choice: 借着悔改
  rationale: 表达 διά 加属格所表示的途径或方式；其位置更自然地与“回转的人”相连。
- source_word: τοὺς ἐπιστρέφοντας
  choice: 那些……回转的人
  rationale: ἐπιστρέφω 表示转回、归回；“回转”在现代中文中既清楚又保留其属灵含义。
- source_word: δέχεσθαι
  choice: 接纳
  rationale: 表达欢迎、接受之意，比单纯“接受”更能传达对回转者的接纳。
theological_decisions:
- issue: διὰ μετανοίας 的修饰关系
  choice: 理解为修饰“回转的人”：那些借着悔改回转的人
  alternative: 理解为修饰“知道接纳”：他借着悔改知道怎样接纳
  rationale: 希腊文语序将 διὰ μετανοίας 紧接在 τοὺς ἐπιστρέφοντας 之前，语义上也更自然地描述人借着悔改而回转；但原句在句法上存在一定歧义，因此加注说明另一种理解。
- issue: οἶδε 的表达
  choice: 他知道接纳
  alternative: 他知道怎样接纳
  rationale: 不额外加入方式性成分，尽量保留希腊文 οἶδε……δέχεσθαι 的简洁结构与轻微张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“这一点”承接上下文，不擅自补明具体所指；保留原文第三人称“他”，不在本节内补作神名。
