source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. Φοβούμενος γὰρ⁴¹ μὴ προσκρούσαι⁴² Κυρίῳ⁴³, οὐ θέλει τὸ καθόλου⁴⁴ οὐδὲ⁴⁵ ἕως ἐννοίας⁴⁶ ἀδικῆσαι ἄνθρωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/005.yaml
  text: For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.
translation:
  language: zh_hans
  text: 因为他惟恐得罪主，所以绝不愿亏待任何人，甚至连在心里也不愿这样做。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβούμενος
  choice: 惟恐
  rationale: 表达因敬畏而担心某事发生的语气，并自然引出否定行为。
- source_word: προσκρούσαι Κυρίῳ
  choice: 得罪主
  rationale: 此处指冒犯、触犯主；“得罪主”是现代汉语中自然且保留宗教语义的表达。
- source_word: τὸ καθόλου οὐδὲ ἕως ἐννοίας
  choice: 绝不……连想都不这样想
  rationale: 保留双重加强语势：完全不愿如此，甚至思想层面也不如此。
- source_word: ἀδικῆσαι ἄνθρωπον
  choice: 亏待别人
  rationale: ἀδικέω 可指行不义、伤害或亏负；此处用“亏待”涵盖对人不公和加害之意，ἄνθρωπον 泛指他人。
theological_decisions:
- issue: 惧怕与敬畏的关系
  choice: 惟恐得罪主
  alternative: 因为敬畏主，怕冒犯他
  rationale: 原文直接说“害怕免得冒犯主”，不额外把 φόβος 明确定义为特定神学意义的“敬畏”，同时以“惟恐”呈现其行为动机。
- issue: 思想层面的不义
  choice: 连想都不这样想
  alternative: 甚至在意念中也不愿亏待人
  rationale: 原文 ἕως ἐννοίας 强调不义连意念层面都不达到；译文保留这一强烈要求，而不扩展为对无意念头的系统教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以绝不愿……连想都……”清楚再现原文递进强调，适合普通读者朗读和理解。
