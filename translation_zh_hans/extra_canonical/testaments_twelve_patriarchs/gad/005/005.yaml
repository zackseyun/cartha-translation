  source_fidelity: 译文准确传达了因害怕冒犯主而不愿对人行不义的主旨，也保留了“甚至在思想层面”的递进。惟“连想都不这样想”在汉语中指代不够明确，且未充分显出“不愿”的辖域延及意念层面。
  naturalness: “亏待别人，连想都不这样想”略显口语化和重复；将意念层面的否定明确为“连在心里也不愿这样做”，更自然、庄重，也更易于朗读理解。
  terminology: “主”对应Κυρίῳ恰当；“惟恐得罪主”自然地表达φοβούμενος μὴ προσκρούσαι。“亏待”可表达ἀδικῆσαι的对人不公，但“任何人”比“别人”更清楚地反映ἄνθρωπον的泛指。
