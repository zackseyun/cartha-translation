  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003.yaml
  text: '1[a]. And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, my children, by the spirit of hatred, because it is evil in all the deeds of men. 2. For whatever the one who hates may do, it is abominable. If someone does the law of the Lord[b], the hater does not praise him. If someone fears the Lord and desires what is righteous, the hater does not love him. 3. He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.'
translation:
  language: zh_hans
  text: 1[a] 现在，你们要听一句真理之言，为要行公义，遵守至高者的一切律法。我的孩子们，不要被仇恨之灵引入歧途，因为它在人的一切行为中都是邪恶的。2 怀恨的人无论做什么，都是可憎的。若有人遵行主的律法，怀恨的人不称赞他；若有人敬畏主，愿行正义，怀恨的人也不爱他。3 他责难真理，嫉妒亨通的人[b]，乐于接受毁谤，喜爱骄傲；因为仇恨使他的心灵盲目；我看约瑟的时候也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“现在，你们要听真实的话。”希腊语开头既可理解为不定的“一句真理之言”，也可理解为较确定的劝勉用语。
    reason: lexical_alternative
  - marker: b
    text: “亨通的人”也可译作“成功的人”，或可能译作“行事正直的人”；但紧接着“嫉妒”的语境较支持成功、顺遂之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: 一句真理之言
  rationale: 保留庄重的遗训开场语，同时不把无冠词结构过度限定为某一特定的“真理之道”；脚注说明另一种自然理解。
- source_word: τοῦ ποιεῖν δικαιοσύνην
  choice: 为要行公义
  rationale: 以目的表达保留不定式的劝勉力量；“行公义”自然、凝练，也保留伦理与宗教语域。
- source_word: πάντα νόμον ὑψίστου
  choice: 遵守至高者的一切律法
  rationale: “至高者”保留神圣称号；“一切律法”传达 πάντα 的总体或分配意味，且“遵守”符合汉语中对律法的惯常搭配。
- source_word: πλανᾶσθε
  choice: 被……引入歧途
  rationale: 体现中间或被动语态色彩，并明确仇恨之灵是误导人的力量。
- source_word: πνεύματι τοῦ μίσους
  choice: 仇恨之灵
  rationale: 保留原文对仇恨这一道德力量的拟人化或准人格化表达，不把它强定为邪灵，也不弱化为单纯心态。
- source_word: βδελυκτόν
  choice: 可憎的
  rationale: 传达强烈的道德和宗教厌恶感，同时符合现代庄重汉语。
- source_word: φοβεῖται Κύριον
  choice: 敬畏主
  rationale: 采用清楚而庄重的圣经惯用语，兼具畏惧和尊崇含义。
- source_word: θέλει τὸ δίκαιον
  choice: 愿行正义
  rationale: 自然表达对正当之事的意愿，并与前文“行公义”形成词根和伦理语义上的呼应。
- source_word: ψέγει
  choice: 责难
  rationale: 保留对真理加以非难、指责的强烈语气。
- source_word: τῷ κατορθοῦντι
  choice: 亨通的人
  rationale: 在“嫉妒”的语境中，理解为取得成功或进展顺利的人最为顺畅；以脚注保留“成功”或“行事正直”的可能。
- source_word: καταλαλιὰν ἀσπάζεται
  choice: 乐于接受毁谤
  rationale: 传达 ἀσπάζεται 所含的欢迎、欣然接纳意味，同时避免将比喻直译得生硬。
- source_word: ἐκτυφλοῖ τὴν ψυχὴν
  choice: 蒙蔽了他的心灵
  rationale: “蒙蔽”自然表现使人失去道德辨识的比喻；“心灵”可涵盖 ψυχή 在此处的内在人格意义。
theological_decisions:
- issue: 仇恨是否被描述为人格化的属灵力量
  choice: 正文译作“仇恨之灵”
  alternative: “一种仇恨的灵”或“仇恨的意念”
  rationale: 原文允许将其视为人格化或准人格化的道德力量。“仇恨之灵”既保留属灵与心理层面的张力，也不武断地将其解释为特定邪灵。
- issue: νόμος 在本段中的范围
  choice: 译作“律法”，不具体限定为某一组诫命
  alternative: “命令”或特指摩西律法
  rationale: 原文只说“至高者的一切律法”和“主的律法”；保留较宽泛的“律法”，避免加入原文未明确给出的盟约或宗派限定。
translation_notes:
  register: 采用现代标准书面汉语，保持遗训劝诫的庄重感，同时避免古奥措辞。以“我的孩子们”“至高者”“敬畏主”等保留经文语体；重复“怀恨的人”和末句“仇恨也蒙蔽了我的心灵”，以消除汉语代词歧义并清楚呈现迦得以自己看待约瑟的经历作见证。
