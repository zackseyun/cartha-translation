  - severity: low
    issue: “照着他的吩咐做了”没有明示“他吩咐他们的一切”。
    rationale: 现译可理解为完全遵行，但补出“他们的一切”可更完整对应ὅσα ἐνετείλατο αὐτοῖς，且中文仍自然。
  revised_text: 他的儿子们照着他吩咐他们的一切去做，把他带到希伯仑，与他的祖先葬在一起。
