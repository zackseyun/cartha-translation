  text: And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: zh_hans
  text: 他的儿子们照着他吩咐他们的一切去做，把他带到希伯仑，与他的祖先葬在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν ... ὅσα ἐνετείλατο αὐτοῖς
  choice: 照着他的吩咐做了
  rationale: 自然表达“做了他所吩咐他们的一切”，保留完全遵行吩咐的含义，同时避免中文冗长。
- source_word: ἀπήγαγον αὐτὸν
  choice: 把他送到
  rationale: 原词表示带走、运送；上下文涉及安葬，中文用“送到”自然且不额外断定具体运输方式。
- source_word: ἐν Χεβρὼν
  choice: 到希伯仑
  rationale: 希腊文介词ἐν在此与运动动词连用，按语境表达目的地。
- source_word: ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  choice: 葬在他列祖那里
  rationale: 保留古代亲族墓葬语境；“列祖”庄重简洁，且不将“与祖先同葬”过度具体化为同一墓穴。
theological_decisions:
- issue: “与他的祖先一起”所指的安葬关系
  choice: 葬在他列祖那里
  alternative: 与他的祖先葬在一起
  rationale: 所选译法保留亲族墓地或祖先安息之处的语义空间，不武断判定为同一墓穴，也不引入额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“列祖”略具经文色彩，但在此亲族安葬语境中简洁准确。
