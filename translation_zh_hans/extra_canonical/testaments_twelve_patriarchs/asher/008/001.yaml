  text: And after saying these things to them, he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep.
translation:
  language: zh_hans
  text: 他对他们说完这些话后，吩咐说：“要把我葬在希伯仑。”他就死了，安睡而逝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安睡而逝”：原文直译近似“睡了美好的一觉”。底本在“睡眠”一词旁置†，表示此处有文本疑难标记。
    reason: 保留原文死亡后的睡眠意象，并如实提示底本的†标记，而不对其具体校勘含义作超过现有资料的断言。
lexical_decisions:
- source_word: ἐνετείλατο λέγων
  choice: 就吩咐道
  rationale: 以自然的现代汉语表达希腊语“吩咐、说”的引语结构，保留命令语气而避免生硬重复。
- source_word: Θάψατέ με
  choice: 要把我葬在
  rationale: 准确传达复数第二人称命令式；汉语不强行标出复数，但上下文中的“他们”已表明受命者不止一人。
- source_word: Χεβρών
  choice: 希伯仑
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
- source_word: ἀπέθανεν
  choice: 他死了
  rationale: 直陈死亡事实，不以“睡了”取代，以保留原文随后睡眠意象与死亡陈述并置的结构。
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: 进入了安然的长眠
  rationale: 保留“睡眠”这一死亡意象；将字面的“睡了一个美好的睡眠”转化为自然、庄重的现代汉语。“安然”体现 καλῷ 在此语境中的正面意味，但不额外界定其神学含义。
theological_decisions:
- issue: 死亡与睡眠意象的关系
  choice: 同时保留“他死了”和“进入了安然的长眠”
  alternative: 仅译作“他安然去世了”
  rationale: 原文明确使用 ἀπέθανεν 陈述死亡，又以 κοιμηθείς/ὕπνῳ 描写睡眠；合并为单一委婉语会消除原有的修辞张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。引语中的“要把我葬在”保留临终命令的郑重感；末句既明确死亡，又保留睡眠隐喻。
