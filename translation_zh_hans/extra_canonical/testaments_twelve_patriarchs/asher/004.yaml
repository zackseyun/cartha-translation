  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004.yaml
  text: '1 For good men[a], being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God. 2 And many, in doing away with the wicked, perform two works, one good and one evil; yet the whole is good, because he has uprooted and destroyed the evil. 3 There is one who hates the merciful man and the unjust man, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what only seems good together with what is truly good[b]. 4 Another does not wish to see good days with the wasteful, lest he defile his body and pollute his soul. Even though this is double-faced, yet it is wholly good. 5 For such men are like gazelles and deer: in the bearing of wild animals they seem to be unclean, but in every respect they are clean, because they walk in zeal for the Lord, keeping away from those things which God also hates and forbids through the commandments[d][c], thus holding back
    evil from good.'
translation:
  language: zh_hans
  text: 1 因为良善的人表里如一[a]；即使口是心非的人认为他们犯了罪，他们在上帝面前仍是义人。2 许多人除掉恶人时，做了善恶两件事；但整体是善的，因为他把恶连根拔除，消灭了。3 有人既恨那怜悯人却行不义的人，也恨那禁食却犯奸淫的人；这也显得有双重面貌，但整个行为是善的，因为他效法主，不把看似的善与真正的善等同看待[b]。4 另有人不愿与放荡的人共享好日子，免得玷辱身体、污秽灵魂。这虽显得有双重面貌，却全然是善的。5 这样的人好像羚羊和鹿：它们因野兽的习性，看似不洁，实际上却完全洁净[c]。同样，这些人热心为主而行，远避上帝所恨恶、又借诫命禁止的事，使恶与善隔绝[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “表里如一”直译为“只有一张面孔”；下文“有双重面貌”也可译作“两面派”或“口是心非”。
    reason: lexical_alternative
  - marker: b
    text: 本句希腊文本有疑难；核心对比是“看似的善”与“真正的善”。也可理解为：“不把看似的善同真正的善一并接纳。”
    reason: textual_and_alternative_reading
  - marker: c
    text: 动物的比喻着眼于外观与实质的反差：它们显得具有野兽的样态，却仍被视为洁净。
    reason: cultural_note
  - marker: d
    text: 末句希腊文十分紧缩，也可译作“使恶远离善”或“阻止恶侵入善”。
    reason: alternative_reading
lexical_decisions:
- source_word: μονοπρόσωποι
  choice: 表里如一
  rationale: 原意是“单一面孔”，与“有双重面貌”构成贯穿本章的对照；中文若直译为“单面”不自然，因此用“表里如一”表达真诚一致，同时以脚注保留原比喻。
- source_word: διπρόσωποι / διπρόσωπον
  choice: 口是心非／有双重面貌
  rationale: 指人时用自然的“口是心非”，描述行为表象时用“显得有双重面貌”，以免误解为行为本身必然虚伪，同时保留本章的“面孔”意象。
- source_word: ἀναιροῦντες
  choice: 除掉
  rationale: 该词可指杀死、除去或消灭；“除掉”保留其强度和语义范围，不武断限定为处死。
- source_word: τὸ δὲ ὅλον καλόν
  choice: 但整体是善的
  rationale: 保留反复出现的总体道德判断，不把经文的张力化解为对手段的详细伦理辩护。
- source_word: ἐλεήμονα καὶ ἄδικον / μοιχὸν καὶ νηστεύοντα
  choice: 怜悯人却行不义的人／禁食却犯奸淫的人
  rationale: 把并列形容词理解为同一人身上相反的特征，符合本章讨论表面善与真实善的语境；希腊文结构仍有一定压缩性。
- source_word: μὴ προσδοκώμενος τὸ δοκοῦν καλὸν μετὰ τοῦ ἀληθινοῦ καλοῦ
  choice: 不把看似的善与真正的善等同看待
  rationale: 底本文字有讹误标记，直译不稳；此译保留“表面的善／真正的善”这一明确对比，并避免把不确定的动词过度具体化。
- source_word: ἀσώτων
  choice: 放荡的人
  rationale: 该词主要指生活失序、挥霍无度或道德放纵者；“放荡”在现代中文中能较完整表达其道德含义。
- source_word: αἰσχράνει ... μολυνεῖ
  choice: 玷辱……污秽
  rationale: 用两个不同动词保存身体与灵魂的平行结构，也分别反映羞辱和污染的语义。
- source_word: δορκάσι καὶ ἐλάφοις
  choice: 羚羊和鹿
  rationale: 自然保留两类动物的对举。
- source_word: ἐν ἤθει ἀγρίων
  choice: 因野兽的习性
  rationale: ἦθος可指习性、举止或外在样态；此处强调它们给人的外在观感。
- source_word: ἐν ζήλῳ Κυρίου
  choice: 热心为主而行
  rationale: 理解为人对主的热忱，而非“主自己的忌邪”；此译在中文中自然且不扩大语义。
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: 使恶与善隔绝
  rationale: 末句希腊文紧缩，基本意象是把恶挡在善之外；“隔绝”保留关系上的含混，不断定具体施事方式。
theological_decisions:
- issue: 看似兼有善恶的行为应如何评价
  choice: 忠实呈现作者的论证：某些行为从外表看有双重面貌，但因其整体目标是除恶，仍被判断为善。
  alternative: 把本段理解为无条件认可任何以善为目的的恶劣手段，或反过来把一切“双重面貌”都判为虚伪。
  rationale: “但整体是善的”反复出现，显示作者区分外观上的复杂性与内心的两面性；译文保留这一伦理张力，不替作者建立普遍规则。
- issue: Κύριον的所指
  choice: 主
  alternative: 上帝／耶和华
  rationale: 希腊文使用Κύριον；“主”忠实保留称号，也不在这部犹太遗训中引入未经文本明示的基督论限定。
- issue: 第三节中两组相反德行的句法关系
  choice: 理解为恨恶那些善恶行为并存的人，即“怜悯却不义”和“禁食却奸淫”的人。
  alternative: 理解为分别恨四类人：怜悯人的、不义的、奸淫的和禁食的。
  rationale: 希腊文的冠词结构及全章主题较支持成对描述同一个人；但句法简略，脚注之外不进一步教义化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。核心“面孔”隐喻在自然中文与形式对应之间作适度调节：人物的内在一致译为“表里如一”，外观复杂则译为“有双重面貌”。第三节和末句因希腊文本压缩或疑难，以正文给出最合语境的译法，并用脚注保存真实的不确定性。
