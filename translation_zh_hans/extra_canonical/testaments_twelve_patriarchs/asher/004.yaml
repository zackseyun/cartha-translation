review_pass:
  verdict: revise
  source_fidelity: 第1、2、4、5节基本忠实地传达了希腊文的论旨与反复出现的“整体是善的”判断。第3节的希腊文（且底本标有疑难）句法高度压缩；草稿将两组并列形容词确定译为“怜悯却不义”“禁食却犯奸淫”的同一类人，超过了文本所能安全支持的程度。宜保留并列对象的歧义，并在脚注说明。第5节应明确比喻所指的是“这样的人”具有近似野兽的外在举止，而非动物本身因其习性显得不洁。
  naturalness: 整体语言庄重、通顺，适合现代标准汉语。“有双重面貌”稍显生硬，但能保留本章持续的面孔隐喻；统一为“显得有两副面孔”较自然，也避免“口是心非”在作者认为其整体为善的段落中造成过强的虚伪含义。
  terminology: “上帝”“义人”“主”“诫命”“污秽”等用语恰当。“放荡的人”能表达ἀσώτων的生活失序与道德放纵，不限于金钱挥霍。保留“除掉”以避免将ἀναιροῦντες不必要地限定为杀害。
  issues:
  - severity: high
    issue: 第3节将并列对象合并为“怜悯却行不义的人”及“禁食却犯奸淫的人”。
    rationale: 希腊文的καί连接可指四项并列，也可能构成两组特征；现有合并译法消除了真实的句法歧义。由于随后的疑难短语也无法决定此处，应在正文采用并列表达，并以脚注保留另一种理解。
  - severity: medium
    issue: 第5节“它们因野兽的习性，看似不洁”使比喻中的动物成为陈述主体。
    rationale: Ὁι γὰρ τοιοῦτοι（“这样的人”）是段落主体；ἐν ἤθει ἀγρίων应说明这些人的举止使其看似不洁。译文应使比喻与道德评语的指向清楚。
  - severity: low
    issue: 第4节“共享好日子”略弱化“看见／经历好日子”的原文表达。
    rationale: “不愿同放荡的人一同享受好日子”既自然，又更贴近ἰδεῖν ἡμέρας ἀγαθὰς。
  revised_text: 1 因为良善的人表里如一[a]；即使两面的人认为他们犯了罪，他们在上帝面前仍是义人。2 许多人除掉恶人时，做了两件事：一件善事，一件恶事；但整体仍是善的，因为他把恶连根拔除并消灭了。3 有人恨恶怜悯人的和不义的人，也恨恶犯奸淫的和禁食的人；这也显得有两副面孔，但整个行为是善的，因为他效法主，不把看似的善同真正的善一并接纳[b]。4 另有人不愿同放荡的人一同享受好日子，免得玷辱身体、污秽灵魂。这虽显得有两副面孔，却全然是善的。5 因为这样的人好像羚羊和鹿：他们有如野兽般的举止，看似不洁，但从整体来看却是洁净的[c]；因为他们怀着对主的热心而行，远离上帝所恨恶、又借诫命禁止的事，使恶远离善[d]。
  revised_footnotes:
  - marker: a
    text: “表里如一”直译为“只有一张面孔”；本章反复与“有两副面孔”形成对照。后者也可译为“两面”或“有双重面貌”。
    reason: lexical_alternative
  - marker: b
    text: 本句希腊文本有疑难。“怜悯人的、不义的、犯奸淫的、禁食的”也可能被理解为两组描述同一人的特征。末句直译不稳；其核心对比是“看似的善”与“真正的善”，也可译为“不期待那看似的善与真正的善并在一起”。
    reason: textual_and_alternative_reading
  - marker: c
    text: 动物的比喻着眼于外在样态与实际洁净的反差：这些人举止有如野兽，因而看似不洁，实则洁净。
    reason: cultural_note
  - marker: d
    text: 末句希腊文十分紧缩，也可译作“使恶与善隔绝”或“阻止恶侵入善”。
    reason: alternative_reading
  revision_rationale: 修订主要处理第3节未决的句法歧义，避免把两组并列词语定为“善恶特征并存”的解释性译文。第5节恢复“这样的人”而非动物本身为“看似不洁／实则洁净”的主体。其余调整使中文更自然，同时保留原文在道德判断上的张力及疑难处的不确定性。
