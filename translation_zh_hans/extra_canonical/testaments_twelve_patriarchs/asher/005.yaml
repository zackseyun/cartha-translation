  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005.yaml
  text: '1[a]. See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in wealth, greed; in merriment, drunkenness; in laughter, grief[b]; in marriage, debauchery. 2. Death follows life, dishonor glory, night day, darkness light; but all things are under the day: righteous things under life, and unrighteous things under death. Therefore eternal life also awaits death. 3. And one cannot say that truth is falsehood, nor that what is righteous is unrighteous, because all truth is under the light, just as all things are under God. 4. Therefore I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought out the commandments of the Most High[c], walking according to all my strength.'
translation:
  language: zh_hans
  text: 1. 孩子们，你们要看清：万事之中都有两个方面，彼此相对，一个隐藏在另一个之下。在受造界中有贪婪[a]，在欢愉中有醉酒，在欢笑中有悲哀，在婚姻中有放荡。2. 死亡接续生命，羞辱接续荣耀，黑夜接续白昼，黑暗接续光明。然而，一切都在白昼之下；正义之事在生命之下，不义之事在死亡之下[b]。因此，永生也在等候死亡[c]。3. 人不能把真理说成虚假，也不能把正义说成不义，因为一切真理都在光明之下，正如一切都在上帝之下。4. 这一切，我都在自己的一生中检验过；我没有偏离主的真理，并且寻求至高者的诫命，尽我一切力量而行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给希腊文本作κτίσει，通常意为“受造界”或“受造之物”。这里与“贪婪”搭配较为突兀；英文咨询译文作“财富”，可能反映不同的文本判断或语境理解。
    reason: textual_variant
  - marker: b
    text: 本章反复使用“在……之下”：在白昼之下、在生命之下、在死亡之下、在光明之下、在上帝之下。这可能表示归属、领域或权势；译文保留原有说法，不限定为其中一种。
    reason: cultural_note
  - marker: c
    text: “永生也在等候死亡”在文字和观念上都较难理解。希腊语最自然地以“永生”为主语、“死亡”为宾语，因此正文保留这一悖论式说法。
    reason: textual_variant
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: 你们要看清
  rationale: 保留复数命令语气和劝诫力度；比单纯“看”更符合父亲向儿女揭示道德现实的语境。
- source_word: δύο ... ἓν κατέναντι τοῦ ἑνός
  choice: 都有两个方面，彼此相对
  rationale: 表达原文“二者—一个与另一个相对”的结构，同时避免生硬的“有两个东西”。“方面”不把二者实体化，仍保留原文概括性。
- source_word: κέκρυπται
  choice: 隐藏在另一个之下
  rationale: 保留完成时被动所表达的隐蔽状态，也维持本章随后反复出现的“在……之下”意象。
- source_word: κτίσει
  choice: 受造界
  rationale: 按所给希腊文本 κτίσις 的通常意义译作受造界，不直接跟随英文咨询层的“财富”；由于该处语义突兀，以脚注说明。
- source_word: εὐφροσύνη
  choice: 欢宴
  rationale: 该词可指欢喜、欢乐；与“醉酒”并列时，“欢宴”自然呈现庆乐场景，同时不把欢乐本身等同于醉酒。
- source_word: πένθος
  choice: 悲哀
  rationale: 保留与“欢笑”的内在反差；比“哀悼”更宽泛，不限定为礼仪性的举哀。
- source_word: ἀσωτία
  choice: 放荡
  rationale: 表达失控、挥霍而不检点的生活；在婚姻语境中可涵盖淫逸，却不把词义过窄地限定为某一种性行为。
- source_word: διαδέχεται
  choice: 接续
  rationale: 准确表达一个事物继另一个而来，并维持四组对句的节奏。
- source_word: ὑπό
  choice: 在……之下
  rationale: 统一保留反复出现的空间性措辞，不预先解释为“归属”“权势”或“阵营”。
- source_word: ἐδοκίμασα
  choice: 检验过
  rationale: 反映 δοκιμάζω 的考察、验证之意，而非仅指被动经历。
- source_word: ἐξεζήτησα
  choice: 寻求
  rationale: 表达认真追求、查求诫命的意思；中文由“竭尽全力”补足其强度。
- source_word: κατὰ πᾶσαν ἰσχύν μου πορευόμενος
  choice: 竭尽全力……并照着遵行
  rationale: πορεύομαι 在道德语境中涉及行事为人；此译使中文自然，并表明寻求诫命落实于生活行动。
theological_decisions:
- issue: διὸ καὶ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει 的主宾关系
  choice: 因此，永生也在等候死亡
  alternative: 因此，死亡也在等候永生；或：死亡之后有永生
  rationale: 按希腊语形态，ἡ αἰώνιος ζωή 为主格，τὸν θάνατον 为宾格。译文保留这句在概念上的反常与张力，不改写成较易理解的末世论结论。
- issue: 连续 ὑπό 短语的性质
  choice: 一律保留“在……之下”
  alternative: 译作“属于”“受……支配”或“站在……一边”
  rationale: 原文刻意串联白昼、生命、死亡、光明和上帝；直译其共同介词可保留道德领域、归属和权柄等多重可能。
- issue: “真理—虚假”与“正义—不义”的陈述方式
  choice: 人不能把真理说成虚假，也不能把正义说成不义
  alternative: 真理不可能是虚假，正义也不可能是不义
  rationale: 保留 οὐκ ἔστιν εἰπεῖν 中“说、称”的成分，使本体判断和人的言说行为之间的张力不被消除。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。对句尽量简洁整齐；“上帝”“主”“至高者”分别对应 Θεός、Κύριος、ὕψιστος。译文以所给希腊文本为首要依据，并在 κτίσει 与英文咨询层出现差异处明确加注。
