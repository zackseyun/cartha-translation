  text: V. Ὁρᾶτε¹, τέκνα², πῶς δύο³ εἰσὶν ⌜ἐν πᾶσιν⌝, ἓν⁴ κατέναντι τοῦ ἑνός, *καὶ ἓν ὑπὸ τοῦ ἑνὸς⁵ κέκρυπται· ⌜ἐν τῇ κτίσει ἡ πλεονεξία, ἐν τῇ εὐφροσύνῃ ἡ μέθη, ἐν τῷ γέλωτι τὸ πένθος, ἐν τῷ γάμῳ ἡ ἀσωτία⌝⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/001.yaml
  text: 'See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in creation, greed; in merriment, drunkenness; in laughter, grief; in marriage, debauchery.'
translation:
  language: zh_hans
  text: 孩子们，你们看：万事之中都有两者；一者与另一者相对，一者隐藏在另一者之下。创造[a]中有贪婪，欢乐中有醉酒，笑声中有悲哀，婚姻中有放荡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “创造”所译的希腊词也可指受造之物或受造界；这里与“贪婪”的搭配在原文中较为突兀。
    reason: 提示原词语义范围并保留传本文字的困难，避免读者误以为译文已确定其唯一所指。
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: 你们要看
  rationale: 保留命令语气，并以自然的现代汉语引出随后的教诲。
- source_word: ἐν πᾶσιν
  choice: 万事中
  rationale: 贴近“在一切之中”，又比逐字译法更符合汉语表达。
- source_word: δύο
  choice: 两者
  rationale: 原文只说“两个／两者”，未明确称为“两面”或“两种力量”，因此不补入解释性名词。
- source_word: κατέναντι
  choice: 与……相对
  rationale: 表达彼此对立、相向而立的关系，不额外说明其道德性质。
- source_word: ὑπὸ ... κέκρυπται
  choice: 隐藏在……之下
  rationale: 保留原文的空间隐喻及其含混性，不改译为较具解释性的“掩藏在背后”。
- source_word: κτίσει
  choice: 创造
  rationale: 按现有希腊文本的通常词义直译；此处与“贪婪”的搭配突兀，故用脚注提示其语义范围而不在正文中擅自修正。
- source_word: εὐφροσύνῃ
  choice: 欢乐
  rationale: 涵盖喜乐、欢庆之意，并与其后“醉酒”形成原文中的对应。
- source_word: πένθος
  choice: 悲哀
  rationale: 既可表达哀伤，也能与“笑声”构成鲜明对照。
- source_word: ἀσωτία
  choice: 放荡
  rationale: 传达无节制、荒淫或挥霍式生活的广义含义；在婚姻语境中不将其收窄为某一种具体性罪行。
theological_decisions:
- issue: “两者”的本体或道德性质
  choice: 保留为未具体界定的“两者”
  alternative: 译作“两面”“两种倾向”或“善恶两种力量”
  rationale: 本节原文本身没有给二者作本体论命名；避免将上下文可能涉及的道德二分预先系统化。
- issue: “创造中有贪婪”这一反常搭配
  choice: 保留传本文字所形成的张力
  alternative: 依据可能的近形词或语境改作“获取财富中有贪婪”
  rationale: 所提供的希腊来源明确作 κτίσει；没有充分校勘证据时，不以顺畅为由改写正文。
- issue: 婚姻与放荡的关系
  choice: 按并列结构译出，不补明因果或评价
  alternative: 译成“婚姻背后隐藏着淫乱”或“婚姻会导致放荡”
  rationale: 原文只作简短并列，因果、必然性及具体所指均未明说。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。重复“一者……另一者”以保存希腊文的对称结构；后半节维持简洁的四组并列，不擅自补入“导致”“背后”等解释性连接语。
