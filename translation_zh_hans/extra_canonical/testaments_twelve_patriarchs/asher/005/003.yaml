source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Καὶ οὐκ¹⁵ ἔστιν εἰπεῖν τὴν ἀλήθειαν ψεῦδος, οὐδὲ *τὸ δίκαιον ἄδικον¹⁶, ὅτι πᾶσα ἀλήθεια ὑπὸ *τοῦ φωτός¹⁷ ἐστιν, ⌜καθὼς τὰ πάντα¹⁸ ὑπὸ *τοῦ Θεοῦ¹⁹⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/003.yaml
  text: And one cannot call truth falsehood, nor what is righteous unrighteous, because all truth is under the light, just as all things are under God.
translation:
  language: zh_hans
  text: 人不能把真理说成虚假，也不能把正义说成不义，因为一切真理都在光之下，正如万有都在上帝之下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπεῖν
  choice: 说成
  rationale: 在此并非单指“说话”，而是指把某事称作或断定为另一性质；“把……说成……”自然地保留这种认定含义。
- source_word: τὴν ἀλήθειαν ψεῦδος
  choice: 把真理说成虚假
  rationale: 保留“真理”与“虚假”的直接对照；“虚假”在现代汉语中比“谎言”更适合表示与真理相反的性质。
- source_word: τὸ δίκαιον ἄδικον
  choice: 把正义说成不义
  rationale: 以“正义／不义”再现原文形容词名词化后的道德对举，不额外限定为人、行为或事物。
- source_word: ὑπὸ τοῦ φωτός
  choice: 在光之下
  rationale: 直译空间性隐喻，并保留其可能表示处于光的权能、鉴察或范围之下的开放含义。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 简洁表达“一切事物／所有存在”，与后面的“上帝之下”相称，语体庄重而通顺。
- source_word: τοῦ Θεοῦ
  choice: 上帝
  rationale: 采用现代标准汉语中常见且庄重的 Θεός 对应词，不引入额外宗派解释。
theological_decisions:
- issue: “在光之下”的神学含义
  choice: 保留“在光之下”
  alternative: 属于光／受光照耀
  rationale: ὑπό 加属格可表达处于某种权能或范围之下；原文的“光”具有潜在神学象征，但没有明说光就是上帝或某一特定主体，因此不予释义化。
- issue: “正如万有都在上帝之下”与前句的类比关系
  choice: 按原文保留平行结构
  alternative: 因为光和万有都属于上帝
  rationale: 原文以 καθὼς 引出类比，没有明确把“光”与“上帝”等同，也没有说“真理属于上帝”；保留类比可避免消解原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保持原文两组道德对举及“光之下／上帝之下”的平行关系，不添加解释性词语。
