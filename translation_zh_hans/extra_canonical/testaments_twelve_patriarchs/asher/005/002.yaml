review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了διαδέχεται的“继起／接替”关系、ὑπό的“在……之下”意象，以及末句以“永恒的生命”为主语、“死亡”为宾语的反常表达。惟τὰ δίκαια、τὰ ἄδικα为中性复数实词化形容词；“义的／不义的”虽试图保留含混，在现代汉语中却不能自然充当名词性成分，且所指不清。
  naturalness: “义的在生命之下，不义的在死亡之下”不符合自然、庄重的现代书面汉语。改作“正义的事物……不义的事物……”既通顺，也与中性复数及前文“万物”相协调。其余平行句式和末句的张力均可保留。
  terminology: “死亡、生命、荣耀、耻辱、白昼、黑夜、光明、黑暗、永恒的生命”用语准确且适合本段格言式、庄重的文体。“正义的事物／不义的事物”避免将原文限定为“义人／不义的人”。
