revisions:
- from: 死亡接续生命，耻辱接续荣耀，黑夜接续白昼，黑暗接续光明。但万物都在白昼之下：义的在生命之下，不义的在死亡之下。因此，永恒的生命也等待着死亡。
  to: 死亡接续生命，耻辱接续荣耀，黑夜接续白昼，黑暗接续光明。但万物都在白昼之下：正义的事物在生命之下，不义的事物在死亡之下。因此，永恒的生命也等待着死亡。
  rationale: 仅将不自然的“义的／不义的”改为“正义的事物／不义的事物”。此改动反映τὰ δίκαια与τὰ ἄδικα的中性复数形式，并保留其并非明确限定为人的含混性；未改变其余结构、象征关系或末句的主客关系。
