source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Τὴν⁷ ζωὴν ὁ θάνατος διαδέχεται, τὴν δόξαν ἡ ἀτιμία, τὴν ἡμέραν ἡ νύξ⁸, τὸ φῶς τὸ σκότος· τὰ δὲ πάντα⁹ ὑπὸ ἡμέραν εἰσίν¹⁰, ὑπὸ ζωὴν¹¹ τὰ δίκαια, ⌜ὑπὸ θανάτου τὰ ἄδικα⌝¹². διὸ καὶ¹³ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/002.yaml
  text: 'Death follows life, dishonor follows glory, night follows day, darkness follows light. But all things are under day: the righteous under life, and the unrighteous under death. Therefore eternal life also awaits death.'
translation:
  language: zh_hans
  text: 死亡接续生命，耻辱接续荣耀，黑夜接续白昼，黑暗接续光明。但万物都在白昼之下：正义的事物在生命之下，不义的事物在死亡之下。因此，永恒的生命也等待着死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαδέχεται
  choice: 接续
  rationale: 表达一事随后取代或承接另一事，既保留四组平行结构，也不额外解释为单纯的时间先后。
- source_word: τὰ δίκαια
  choice: 义的
  rationale: 希腊文为中性复数实词化形容词，可指正义之事或属义者；译作“义的”保留其范围上的含混。
- source_word: τὰ ἄδικα
  choice: 不义的
  rationale: 与“义的”形成对称，并保留可指不义之事或不义者的原文含混。
- source_word: ἀναμένει
  choice: 等待着
  rationale: 直译其“等候、等待”之意，不将末句神学张力解释成“胜过”或“继死亡而来”。
- source_word: αἰώνιος ζωή
  choice: 永恒的生命
  rationale: 自然而庄重地对应原文，且不预先限定其具体末世论含义。
theological_decisions:
- issue: “永恒的生命等待死亡”的主客关系
  choice: 因此，永恒的生命也等待着死亡
  alternative: 因此，死亡之后也有永生／因此，永生最终胜过死亡
  rationale: 原文明确以“永恒的生命”为主语、“死亡”为宾语；保留这一反常而富张力的表达，不以解释性译法消解。
- issue: τὰ δίκαια与τὰ ἄδικα的所指
  choice: 义的／不义的
  alternative: 义人／不义的人；义事／不义之事
  rationale: 中性复数形式本身容许较宽泛的理解，故不强制限定为人或行为。
- issue: “在白昼之下”的象征意义
  choice: 在白昼之下
  alternative: 归于白昼／受白昼支配
  rationale: 保留ὑπό的空间或权属隐喻及原文象征结构，不擅自确定其神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。四个分句保持整齐的平行节奏；后半节重复“在……之下”，以显出希腊文结构，并保留“白昼—生命—死亡”的象征张力。
