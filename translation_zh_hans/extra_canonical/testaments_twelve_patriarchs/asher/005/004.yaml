  text: Ταῦτα οὖν²⁰ πάντα ⌜ἐγὼ⌝²¹ ἐδοκίμασα ἐν τῇ ζωῇ μου, καὶ οὐκ ἐπλανήθην ἀπὸ τῆς ἀληθείας Κυρίου, καὶ²² τὰς ἐντολὰς τοῦ ὑψίστου²³ ἐξεζήτησα²⁴ κατὰ πᾶσαν ἰσχύν μου πορευόμενος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/004.yaml
  text: So then I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought the commandments of the Most High with all my strength as I walked.
translation:
  language: zh_hans
  text: 所以，这一切我都在自己的一生中检验过；我没有偏离主的真理，并且我在行事为人时，竭尽全力寻求至高者的诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοκίμασα
  choice: 检验过
  rationale: 表达亲身考察、验证之意，比单纯“尝试”更符合此处回顾一生经验的语境。
- source_word: ἐπλανήθην ἀπὸ
  choice: 偏离
  rationale: 自然传达从某条正路或真理上迷失、走开的含义。
- source_word: ἐξεζήτησα
  choice: 寻求
  rationale: 保留主动而殷切地追求、探求至高者诫命的意味。
- source_word: τοῦ ὑψίστου
  choice: 至高者
  rationale: 这是对上帝的尊称，直译且符合现代中文宗教语体。
- source_word: κατὰ πᾶσαν ἰσχύν μου
  choice: 尽我一切的力量
  rationale: 保留“按照我全部力量”的强度，现代中文自然可懂。
- source_word: πορευόμενος
  choice: 行事
  rationale: 分词本义为行走、前行；在一生遵行的伦理语境中译作“行事”，既保留生活实践意味，也避免生硬的字面表达。
theological_decisions:
- issue: “主的真理”与“至高者的诫命”的关系
  choice: 保留两个并列分句，不将二者合并或解释为同一概念
  alternative: 译成因果或转折关系，如“因此遵守”或“却寻求”
  rationale: 希腊文以καί连接，文本本身只作并列陈述，不宜加入因果、转折或体系化解释。
- issue: 末尾分词πορευόμενος的修饰关系
  choice: 译为“尽我一切的力量行事，寻求……”，让“尽力”与生活行事相连，同时保持寻求诫命为主要动作
  alternative: “我行走时尽全力寻求……”或“我竭力遵行……”
  rationale: 原文词序允许一定张力；此译保留πορευόμενος的独立意义，又不把“寻求”强化成原文未明说的“遵守”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”承接上文；以分号划分回顾经验与两项自述。避免古奥的“诫命而行”等表达，也不增添宗派性解释。
