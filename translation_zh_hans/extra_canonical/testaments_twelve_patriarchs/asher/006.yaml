review_pass:
  verdict: revise
  source_fidelity: 第1—5节整体贴近希腊文，且正确限于所提供的第1—6节，未从英文咨询层补入较长续文。第6节却将现存希腊文的语法关系倒置：γνωρίζει 与 εἰσφέρει 的隐含主语承接前文的“灵魂”，而阳性宾语 αὐτόν 指“平安的天使”；故现存文本表面所说的是灵魂把天使带入永生。即使此意在语境中显得突兀，也不应在正文无标示地改作天使引领灵魂。第4节的“他们”也宜明确指“这些结局”，避免误指人。
  naturalness: 原译庄重、清楚，适合现代标准汉语。“把恶当作善来关注”稍显搭配不自然，改为“把恶看作善”。“在主的一切诫命中持守它”可调整为“在遵行主一切诫命时持守这善”，使“它”的所指和中文句法更清晰。
  terminology: “两面人”“私欲”“平安的天使”“永生”等用语适切。Βελίαρ 建议采用较通行的中文宗教文献音译“彼列”，而不作解释性替换。第1节保留“单一面孔／两面”的对照，以脚注说明即可。
  issues:
  - severity: high
    issue: 第6节将领入永生的施事者改为平安的天使。
    rationale: 现存希腊文中，ἥσυχος、γνωρίζει、εἰσφέρει 的隐含主语承接“灵魂”；τὸν ἄγγελον 为“认出”的宾语，αὐτόν（阳性单数）亦自然回指该天使。正文改写为天使领灵魂，虽较合上下文预期，却超出所给文本。
  - severity: medium
    issue: 第4节“他们的结局也为……所知”可能使“他们”误指人。
    rationale: 最自然的承接对象是中性复数 τὰ τέλη（这些结局）；应直接说“这些结局也为……所知”。
  - severity: low
    issue: 第3节“把恶当作善来关注”不够自然。
    rationale: προσέχετε 可译“留意、看待”；在此否定性伦理对比中，“不要把恶看作善”更自然、简洁。
  revised_text: '**《亚设遗训》第6章**


    1 所以，我的孩子们，你们也要谨慎；要以专一之心遵从真理，谨守主的诫命。[a] 2 因为两面人要受双重惩罚：他们不但作恶，还赞同作恶的人，仿效迷惑之灵，并与人类为敌。


    3 所以，我的孩子们，你们要遵守主的律法；不要把恶看作善，却要注目于真正的善，并在遵行主一切诫命时持守这善，行在其中，安息于其中。4 因为人的结局显明他们的义；这些结局也为主的天使和彼列的天使所知。[b]


    5 邪恶的灵魂离去时，就受那邪灵折磨；它在私欲和恶行中所服侍的，也正是这邪灵。6 但灵魂若在喜乐中安宁，就认得平安的天使，并把他带入永生。[c]'
  revised_footnotes:
  - marker: a
    text: “以专一之心”所译的希腊词，字面意思近于“以一副面孔”；它与下一节的“两面人”形成对照。
    reason: 保留原文的“面孔”比喻，同时采用自然的现代汉语。
  - marker: b
    text: 原文直译近于：“人的结局显明他们的义，并为主的天使和彼列的天使所知。”
    reason: 说明“这些结局”为使中文指代明确而补出；两个属格均修饰“天使”。
  - marker: c
    text: 现存希腊文按语法表面上以“灵魂”为“认得”和“带入”的主语，并以阳性代词“他”指平安的天使；因此正文保留“灵魂把天使带入永生”这一较为突兀的表达。若按上下文理解为天使引领灵魂，则属于对文本困难的解释，未写入正文。
    reason: 第6节的主语及代词关系在语境中造成困难；须如实保留现存文本的语法，并公开说明可能的解释性读法。
  revision_rationale: 修订集中于恢复第6节现存希腊文的主语—宾语关系，不以较顺畅的神学或语境性理解覆盖文本。其余修改澄清第4节指代、改善第3节自然度，并统一专名为“彼列”。
