review_pass:
  verdict: revise
  source_fidelity: 第1节将“随从真理”和“谨守主的诫命”的句法关系调换，尚可理解但未紧贴原文。第4节原文的主语是“人的结局”，而草稿改作“他们的结局也为……所知”，虽为中文清楚而补出，却重复并轻微改变焦点。第6节草稿采用“平安的天使领灵魂进入永生”的协调性改写；然而所给希腊文本表面句法的主语仍是灵魂，阳性宾语“他”则指天使。既然文本困难须保留，正文不应无声地择定一种协调读法。
  naturalness: 草稿整体庄重自然。“不要把恶当作善来关注”略显生硬，改为“不要把恶看作善”。第1节以“专一的心”表达单一面孔的隐喻，并在脚注说明，较合现代汉语。第6节的直译虽刻意保留原文突兀处，但通过脚注可使读者理解其缘由。
  terminology: “主”“律法”“诫命”“彼利亚”“私欲”“平安的天使”“永生”均可保留。“两面人”恰当对应διπρόσωποι；“专一的心”与其形成语义对照，但脚注应交代原文的“面孔”意象。
  issues:
  - severity: medium
    issue: 第1节的句法关系未贴合希腊文。
    rationale: 原文为“留意主的诫命”，以“单一面孔”随从真理；草稿作“表里如一地遵从真理，谨守主的诫命”，虽意思接近，修饰关系不够明确。
  - severity: medium
    issue: 第4节将“结局”改作代词所指并重复补出。
    rationale: καὶ γνωρίζονται的自然主语仍是τὰ τέλη（结局）；应直译为“人的结局……也为主的天使和彼利亚的天使所知”，不必改成“他们的结局”。
  - severity: high
    issue: 第6节正文未保留现存希腊文的主语／指代困难。
    rationale: 现存文本中γνωρίζει与εἰσφέρει的承接主语均可读为ψυχή（灵魂），而αὐτόν是阳性宾语，最自然指“平安的天使”。将其改译为天使领灵魂进入永生是合理的协调解释，却超出文本表面语法；应以直译正文及脚注保留困难。
  - severity: low
    issue: 第3节“把恶当作善来关注”不够自然。
    rationale: προσέχετε…ὡς καλῷ意为将恶视作／当作善而留意；“不要把恶看作善”更简洁自然。
  revised_text: '**《亚设遗训》第6章**


    1 所以，我的孩子们，你们也要留心：要以专一的心随从真理，遵守主的诫命。[a] 2 因为两面人要受双重惩罚；他们既作恶，也赞同作恶的人，仿效迷惑的诸灵，并与人对抗。


    3 所以，我的孩子们，你们要遵守主的律法；不要把恶看作善，却要注目于真正的善，并在主的一切诫命中持守它，行在其中，安息于其中。4 因为人的结局显明他们的义，也为主的天使和彼利亚的天使所知。[b]


    5 因为邪恶的灵魂离去时，要受那邪灵折磨；它曾在私欲和恶行中服侍这邪灵。6 但灵魂若在喜乐中安宁，就认得平安的天使，并把他带入永生。[c]'
  revised_footnotes:
  - marker: a
    text: “以专一的心”所译的希腊词字面近于“以一副面孔”；它与下一节的“两面人”相对，指不分裂、不虚伪地随从真理。
    reason: 保留原文“面孔”意象及其与第2节的对照，同时采用自然现代汉语。
  - marker: b
    text: 原文直译为：“人的结局显明他们的义，也为主的天使和彼利亚的天使所知。”这里“主的天使和彼利亚的天使”是两个并列的属格修饰语。
    reason: 说明第4节的主语仍为“结局”，并避免将彼利亚误读为与主并列的知晓者。
  - marker: c
    text: 现存希腊文在本句有主语和指代困难：按表面语法，“灵魂”既“认得”平安的天使，也“把他”带入永生；其中“他”为阳性，最自然指天使。上下文也可能意在说平安的天使引领灵魂进入永生，但该协调读法并非现存文字的直接表达。
    reason: 忠实保留原文真实的语法困难及可能的上下文解释，不在正文中无声采用其中一项。
  revision_rationale: 修订以所给希腊文第1—6节为准，不采纳英文审计文本中超出该希腊证据的续文。第1、3、4节恢复或澄清原文的句法焦点；第6节改为保留现存文本表面语法的译法，并以脚注说明上下文协调读法，避免把有争议的文本困难定为单一解释。
