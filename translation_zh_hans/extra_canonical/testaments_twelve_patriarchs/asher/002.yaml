  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002.yaml
  text: '1 There is, then, a soul that in its words turns away the good for the sake of evil, and leads the outcome of the matter into wickedness.


    2 There is a man who does not pity his own servants; and though this is double-faced, the whole of it is evil.


    3 And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man''s account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.


    4 Even if they are in love, they are in wickedness when they hide evil under a good name; but the end of the deed comes to evil.


    5 Another steals, acts unjustly, plunders, is greedy, and yet shows mercy to the poor. This too is double-faced, but the whole of it is evil.


    6 The one who defrauds his neighbor provokes God, swears falsely by the Most High, and has no regard for the Lord, the giver of the law, yet gives rest to the poor.


    7 He stains the soul and makes the body bright; he kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.


    8 Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the force of his wealth he drags many down, and out of his excessive wickedness performs the commandments. This is double-faced, but the whole of it is evil.


    9 Such people are like hares, because they are half clean, but in truth they are unclean.


    10 For God also, in the tablets of the commandments, has declared it so.'
translation:
  language: zh_hans
  text: '1 所以，有一种人[a]，口头上为恶而背离善，并使事情的结局落入邪恶。


    2 有人不怜悯自己的仆役；这虽然是两面的，但整体却是恶的。


    3 也有人爱一个作恶的人，因为他自己也选择为那人死在恶中；由此可以清楚看出，他是两面的，但整件事却是恶行。


    4 即便出于爱，以美名掩盖恶的人仍在邪恶之中；这行为的结局终归于恶。[b]


    5 另有人偷窃、行不义、抢夺、贪占，却又怜悯穷人。这也是两面的，但整体却是恶的。


    6 欺诈邻舍的人惹动上帝，指着至高者起假誓，又怜悯穷人；他漠视并触怒那位颁布律法的主，却使贫寒人得安歇。[c]


    7 他玷污灵魂，却使身体光鲜；杀害许多人，却怜悯少数人。这也是两面的，但整体却是恶的。


    8 另有人通奸、淫乱，却又禁食某些食物；他一面禁食，一面作恶，凭财富的权势拖垮许多人，又出于极度的邪恶去遵行诫命。这是两面的，但整体却是恶的。


    9 这样的人就像野兔[d]，因为他们只有一半洁净，其实却是不洁净的。


    10 因为上帝在诫命的石版上也曾这样说过。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一种人”原文直译为“一个灵魂”。
    reason: 保留 ψυχή 的字面表达，同时使正文符合现代汉语习惯。
  - marker: b
    text: 本节希腊文本有讹误，句法和具体所指不十分确定；也可理解为：“爱若以善的名义掩盖恶，也是在邪恶之中。”
    reason: 原文被校勘者标为疑难段落，应公开其文本与解释的不确定性。
  - marker: c
    text: 本节原文在“怜悯穷人”等短语的排列上较为突兀，可能是借重复对照来描写同一个人的两面行为。
    reason: 说明希腊文结构不整齐，避免让顺畅的中文掩盖源文本困难。
  - marker: d
    text: “野兔”原文直译为“毛脚的”。这里以野兔为“半洁净”的比喻，关联传统洁净条例中对这类动物的分类。
    reason: 解释词义及“只有一半洁净”这一比喻所依据的文化背景，避免将古代分类表述为现代动物学判断。
lexical_decisions:
- source_word: ψυχὴ
  choice: 一种人
  rationale: 此处字面为“灵魂”，但作为行为主体自然指“人”；中文以“一种人”表达希腊文的类型描述，并以脚注保留字面信息。
- source_word: διπρόσωπον
  choice: 两面的
  rationale: 保留“有两张脸／两面”的形象，表达善恶并存的表象，而不直接解释为“虚伪”。
- source_word: πλεονεκτέω / πλεονεκτῶν
  choice: 贪占／欺诈
  rationale: 该词可指贪婪地占便宜或欺诈；第5节列举恶行时译“贪占”，第6节以邻舍为受词时译“欺诈邻舍”。
- source_word: ἀθετεῖ
  choice: 漠视
  rationale: 本义涵盖弃绝、废弃、不顾；在此与“触怒”并列，译“漠视”既自然又避免过度强化为正式否认。
- source_word: δασύποδες
  choice: 野兔
  rationale: 字面有“毛脚的”之意，在相关洁净条例传统中指野兔；正文采用所指动物，脚注提示原文形象。
- source_word: λαμπρύνει
  choice: 使……光鲜
  rationale: 与“玷污灵魂”形成鲜明对照，既可包含装饰身体，也保留使之显得亮丽的意象。
theological_decisions:
- issue: 善行与恶行混合时对整体行为的判断
  choice: 反复保留“整体却是恶的”
  alternative: 译成“善行不能抵消恶行”
  rationale: 原文以“整体”作判断而未提出抽象的功过抵消理论，故不作教义化扩展。
- issue: 第8节恶人“遵行诫命”的张力
  choice: 保留“出于极度的邪恶去遵行诫命”
  alternative: 解释为“表面上遵行诫命”
  rationale: 希腊文本身形成尖锐且可能有讽刺意味的张力；不擅自加入“表面上”，以免消解原文歧义。
- issue: 第10节与洁净条例的关系
  choice: 译作“上帝在诫命的石版上也曾这样说过”
  alternative: 明确说“摩西律法如此规定野兔不洁净”
  rationale: 原文只笼统提到诫命的石版；虽然与洁净条例传统存在张力，译文不替作者修正或调和。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体；重复保留“这是两面的，但整体却是恶的”这一章的修辞骨架。对第3、4、6节的疑难希腊文尽量直译其逻辑关系，并以脚注标明真正的文本不确定性，不用后世宗派术语加以调和。
