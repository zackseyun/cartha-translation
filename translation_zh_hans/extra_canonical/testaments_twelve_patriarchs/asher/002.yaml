    ἐστι, *τὸ δὲ ὅλον πονηρόν ἐστιν⁴⁷. 8. Ἄλλος⁴⁸ μοιχεύει *καὶ πορνεύει⁴⁹ καὶ ἀπέχεται ἐδεσμάτων⁵⁰. καὶ⁵¹ νηστεύων κακοποιεῖ, καὶ τῇ³⁵ δυναστείᾳ *τοῦ πλούτου⁵² πολλοὺς κατασύρει⁵³, καὶ ἐκ⁵⁴ τῆς ὑπερόγκου⁵⁵ κακίας ποιεῖ⁵⁶ ⌈τὰς⌉⁵⁷ ἐντολάς⁵⁸. τοῦτο διπρόσωπόν ἐστιν⁵⁹, *τὸ δὲ ὅλον⁶⁰ κακόν ἐστιν. 9. Οἱ τοιοῦτοί εἰσι⁶¹ δασύποδες, ὅτι⁶² ἐξ ἡμισείας εἰσὶ καθαροί, τὸ δ᾽ ἀληθὲς⁶³ ἀκάθαρτοί εἰσι. 10. *Καὶ γὰρ⁶⁴ ὁ Θεὸς ἐν ταῖς πλαξὶ⁶⁵ τῶν ἐντολῶν⁶⁶ οὕτως εἶπεν.
