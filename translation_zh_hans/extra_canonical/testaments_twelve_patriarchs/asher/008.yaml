base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008.yaml
  text: And after saying these things to them[a], he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep. And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: zh_hans
  text: '8:1 亚设对他们说完这些话，就吩咐他们说：“要把我葬在希伯仑。”他就死了，在美好的睡眠中睡去了[a]。


    8:2 他的儿子们照着他的吩咐去做，将他送往希伯仑，和他的列祖葬在一起。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他死了，在美好的睡眠中睡去了”，把明确的死亡陈述与传统的睡眠意象结合在一起。
    reason: 说明原文刻意并置死亡陈述和睡眠措辞，避免读者误以为译文只是普通的现代习语。
lexical_decisions:
- source_word: ἐνετείλατο
  choice: 吩咐
  rationale: 此动词表示带有权威的嘱命；“吩咐”既符合临终遗命的语境，又能在现代汉语中自然地用于引出直接命令。
- source_word: Θάψατέ
  choice: 要把我葬在
  rationale: 保留原文祈使语气，表达直接而庄重，不以“安葬”之类词语额外增添委婉色彩。
- source_word: Χεβρών
  choice: 希伯仑
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: ἀπέθανεν
  choice: 他死了
  rationale: 直译明确的死亡陈述，不让随后出现的睡眠意象取代其本义。
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: 睡了美好的一觉
  rationale: 保留原文“睡眠／睡去”的重复意象及其修饰语“美好”，避免解释性地简化为“安详地去世”。
- source_word: ἀπήγαγον
  choice: 运到
  rationale: 语境所指是将遗体送往另一地点；“运到”在中文中简洁清楚，也不擅自说明具体运输方式。
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: 和他的列祖葬在一起
  rationale: 保留传统亲属与埋葬用语“列祖”，并按中文习惯明确表达共同安葬的关系。
theological_decisions:
- issue: 以睡眠意象描述死亡
  choice: 同时保留“他死了”和“睡了美好的一觉”
  alternative: 合并译为“他安详地去世了”，或只译为“他睡去了”
  rationale: 希腊文并列明确的死亡陈述与传统的睡眠意象；两者都保留，可维持原文的文学张力，不把它归并成单一的现代委婉语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“吩咐”“列祖”保留遗训和族长安葬叙事的语体色彩；“睡了美好的一觉”略带原文式的重复，以保存希腊文独特意象。主文中的[a]紧接其所解释的死亡与睡眠短语。
