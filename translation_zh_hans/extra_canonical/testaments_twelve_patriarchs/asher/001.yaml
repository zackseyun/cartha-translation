  - marker: b
    text: “愿意好好行走”所据的希腊文本有传抄疑难；也可按伦理比喻理解为“愿意行走正道”。
    reason: textual_uncertainty
  - marker: c
    text: 本句开头的希腊文本有传抄疑难，直译近于“若意念偏向邪恶”。后文的代词和分词在语法性别及主语上也不完全一致；译文以“人”承接，避免断定这些行为直接以“意念”为主体。
    reason: textual_uncertainty
lexical_decisions:
- source_word: ὑγιαίνων
  choice: 身体健康
  rationale: 保留分词所表达的伴随情形，说明亚设说话时身体仍然健全。
- source_word: εὐθές
  choice: 正直
  rationale: 在伦理劝诫中自然表达在上帝面前端正、合宜之意。
- source_word: διαβούλια / διαβούλιον
  choice: 意念
  rationale: 此词指内在的谋虑和道德取向；“意念”既能涵盖思量，也不把它缩减为外在计划。
- source_word: τρόπους
  choice: 行事方式
  rationale: 与已经译作“道路”的 ὁδοί 区分，同时保留原文成组列举的修辞。
- source_word: τέλεα
  choice: 结局
  rationale: 表达一条伦理道路最终达到的结果或终点。
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: 彼此对立
  rationale: 自然地传达成对事物相对而立的结构，不额外引申为形而上的绝对二元论。
- source_word: στέρνοις
  choice: 胸中
  rationale: 保留原文以胸膛指内在人格与思虑所在的具体意象，比直接改译“心中”更贴近希腊文。
- source_word: πορευθῆναι
  choice: 行走
  rationale: 保留原文以行路比喻伦理生活的表达。
- source_word: ἐν δικαιοσύνῃ
  choice: 凭公义
  rationale: 以自然汉语表达行为是在公义的规范和领域中进行。
- source_word: μετανοεῖ
  choice: 悔改
  rationale: 上下文明确涉及犯罪后的立即转回，“悔改”准确传达其伦理与宗教含义。
- source_word: Βελίαρ
  choice: 贝利亚尔
  rationale: 按希腊文本的专名形式音译，保留其作为辖制人的邪恶权势之人格化表达。
theological_decisions:
- issue: 两条道路及两种意念的二元对照
  choice: 直译为人类伦理生活中彼此对立的善恶道路和内在意念
  alternative: 解释为两个永恒且势均力敌的宇宙本原，或弱化成一般性的好坏选择
  rationale: 原文反复强调“两种”及其对立，却没有在本段建立完整的形而上二元论；译文保留强烈张力而不越过文本。
- issue: 贝利亚尔的性质
  choice: 作为专名和人格化的邪恶辖制者处理
  alternative: 意译为“邪恶”或采用其他传统名称“彼列”
  rationale: 希腊文 Βελίαρ 在句中是实施辖制的主体，音译最能保留本见证的形式和人格化语气。
- issue: 犯罪、悔改与拔除罪的关系
  choice: 按原文顺序保留：行义者仍可能犯罪，却会立即悔改并抵制罪
  alternative: 将其改写为义人不会犯罪，或解释为悔改自动保证无罪状态
  rationale: 原文同时肯定正道、公义行为、犯罪的可能以及立即悔改，应保留这种伦理张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“两条道路”“胸中”“意念的宝藏”等原文意象；对第8—9节不稳定的主语转换作最低限度的汉语顺句处理，不加入英文咨询层第10—12节，因为所提供的希腊原文止于第9节。
