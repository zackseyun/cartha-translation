  language: zh_hans
  text: '亚设的遗训


    雅各与悉帕所生的第十子亚设的遗训。


    1 这是亚设对儿子们所说的遗训抄本[a]：他在一百二十五岁时说了这些话。


    2 当时他身体健康，对他们说：“亚设的儿女啊，要听你们父亲的话；在上帝面前一切正直的事，我都要指示你们。


    3 上帝赐给世人两条道路、两种意念、两类行为、两种行事方式和两种结局。


    4 因此，万事都有相对的两面，彼此对立。


    5 因为道路有两条：一条是善，一条是恶；我们胸中也有两种意念，辨别它们。


    6 所以，心灵若愿意好好行走[b]，就会凭公义做一切事；即使犯了罪，也会立刻悔改。


    7 因为心灵思想正直的事，抛弃邪恶，就立刻推翻恶，连根拔除罪。


    8 但心里的意念若偏向邪恶[c]，所做的一切便都在邪恶之中；人便排斥善，依附恶，受贝利亚尔辖制。即使做了善事，也会把它变成恶事。


    9 因为每当人开始行善，那行为的结局就把他推向恶；这是因为他意念的宝库充满了恶灵。”'
  philosophy: optimal-equivalence
