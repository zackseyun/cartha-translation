  text: II. *Ἔστιν οὖν¹ ἡ² ψυχὴ *ἐν λόγοις †ἀφιστῶσα³ τὸ καλὸν ὑπὲρ *τοῦ κακοῦ⁴, καὶ *τὸ τέλος⁵ *τοῦ πράγματος⁶ εἰς κακίαν †ἄγων⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/001.yaml
  text: There is, then, a soul that in words turns away from the good for the sake of evil, and leads the outcome of the matter into wickedness.
translation:
  language: zh_hans
  text: 所以，有一种心灵在言语上为了恶而背离善，并把事情的结局引向邪恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本末句“引向”的分词为阳性形式，与前面阴性的“心灵”在语法上不一致；此处按上下文理解为仍由“心灵”作主语。
    reason: 原版本身以†标示该词有文本疑难；脚注保存这一真实的不确定性。
lexical_decisions:
- source_word: ψυχή
  choice: 心灵
  rationale: 保留该词所指人的内在生命与道德主体之意；“灵魂”在现代汉语中较易让人联想到脱离身体的实体，而此处重点在作出道德取向的内在人格。
- source_word: ἐν λόγοις
  choice: 在言语上
  rationale: 直译其方式或领域含义，不扩展为“用言语欺骗”等原文未明说的意思。
- source_word: ἀφιστῶσα τὸ καλόν
  choice: 背离善
  rationale: ἀφίστημι在此表达离开、背弃；将τὸ καλόν名词化译为“善”，简洁保留其道德含义。
- source_word: ὑπὲρ τοῦ κακοῦ
  choice: 为着恶
  rationale: 保留ὑπέρ所表达的目的或偏向关系，同时避免把它过度解释成明确的利益交换。
- source_word: τὸ τέλος τοῦ πράγματος
  choice: 事情的结局
  rationale: τέλος在此指事情最终达到的结果；“结局”比“终止”更符合语境。
- source_word: κακία
  choice: 邪恶
  rationale: 表达道德败坏或恶的状态，并与前文名词化的“恶”形成自然呼应。
theological_decisions:
- issue: ψυχή所指的主体
  choice: 译作“心灵”，保留其作为道德行动主体的表达
  alternative: 译作“灵魂”或意译为“人”
  rationale: 原文直接以ψυχή为主语；不将其消解为笼统的“人”，也不借“灵魂”引入较强的身心二分联想。
- issue: 末句分词的主语关系
  choice: 按语义将“引向邪恶”继续理解为同一心灵的行为
  alternative: 因ἄγων的阳性形式而另立一个未明说的阳性主语
  rationale: 上下文只有ψυχή这一明确主体，且并列结构自然要求两个分词共享主语；但希腊文本存在性数不一致，故以脚注说明而不武断修正文句。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“有一种心灵”略带格言式表达，以保留原文的存在句结构；全句不补入欺骗、伪善等原文未明确陈述的动机。
