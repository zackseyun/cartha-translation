revisions:
- from: 那欺占邻舍的人[a]，惹上帝发怒，指着至高者起假誓，却又怜悯穷人。他轻弃并激怒颁布律法的主，却又使贫寒人得安歇。
  to: 那欺占邻舍的人[a]，激怒上帝，指着至高者起假誓，怜悯穷人；他弃绝并激怒那颁布律法的主，又使贫寒人得安歇。
  rationale: 修订以并列语气对应原文的 καί，避免将道德上的张力解释为明确让步关系；同时润色“激怒”“弃绝”，使其更贴合希腊动词且更自然。脚注仍保留并更准确地说明“邻舍”后的异常复数词，不对其归属作武断复原。
