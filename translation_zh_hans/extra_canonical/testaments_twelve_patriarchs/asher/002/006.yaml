base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/006.yaml
  text: The one who defrauds his neighbor provokes God, swears falsely by the Most High, sets aside and provokes the Lord, the giver of the law, and gives rest to the poor.
translation:
  language: zh_hans
  text: 那欺占邻舍的人[a]，激怒上帝，指着至高者起假誓，怜悯穷人；他弃绝并激怒那颁布律法的主，又使贫寒人得安歇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在“邻舍”之后另有一个语法上难以归属的复数词“穷人”；同一句后面则清楚地说此人“怜悯穷人”。本译文将正文按可确定的句法译出。
    reason: 底本此处存在明显的句法或传抄困难；脚注说明问题，避免把不确定的词强行纳入正文或无声删去。
lexical_decisions:
- source_word: πλεονεκτῶν
  choice: 欺占
  rationale: 该词指贪图利益而占人便宜、侵夺或欺诈；“欺占”兼顾不诚实与侵占之意，也适合“邻舍”这一宾语。
- source_word: παροργίζει / παροξύνει
  choice: 惹……发怒 / 激怒
  rationale: 两个动词都表达触怒，但分别译作“惹……发怒”和“激怒”，既保留重复加强的效果，也避免中文机械重复。
- source_word: ἐπιορκεῖ
  choice: 起假誓
  rationale: 指作伪誓或违背誓言；结合与格“至高者”，译为“指着至高者起假誓”自然且明确。
- source_word: ἀθετεῖ
  choice: 轻弃
  rationale: 该词可指拒绝、废弃、漠视；“轻弃”保留主动排拒和不尊重的意味，不将其弱化为仅仅“没有 regard”。
- source_word: ἐντολέα τοῦ νόμου
  choice: 颁布律法的
  rationale: ἐντολεύς指发令者、制定或颁布命令者；此处修饰“主”，译为“颁布律法的主”简洁自然。
- source_word: ἀναπαύει
  choice: 使……得安歇
  rationale: 保留使役含义，可指让人休息、得舒缓或安慰；不把语义限定为物质救济。
- source_word: πτωχόν / πένητα
  choice: 穷人 / 贫寒人
  rationale: 原文用两个近义词：前者着重贫穷，后者常指生活拮据、靠劳作维生者；中文略作区分以反映词汇变化。
theological_decisions:
- issue: 同一人一面冒犯上帝和主，一面帮助穷人所形成的道德张力
  choice: 用“却又”明确保留并列行为之间的反差
  alternative: 按照英语咨询文本省略“怜悯穷人”，或把善行解释为虚伪行为
  rationale: 希腊正文明确有“怜悯穷人”和“使贫寒人得安歇”；本节似在描写善恶并存的行为，不应省略，也不应擅自判定其动机。
- issue: “上帝”“至高者”“主”的指称关系
  choice: 依原文分别保留三个称谓
  alternative: 统一译成同一个称谓，或解释为不同对象
  rationale: 原文分别使用 Θεός、ὕψιστος、Κύριος；译文保留其修辞层次，而不额外界定彼此关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邻舍”“至高者”“律法”保留犹太宗教文献的语域；用“却又”呈现本章所强调的行为反差。脚注标记已在正文出现。
