  naturalness: “惹上帝发怒”可以理解，但“激怒上帝”更自然、凝练。“轻弃”虽可通，却不如“弃绝”准确自然地表达 ἀθετεῖ 的主动拒斥。
  terminology: “至高者”“颁布律法的主”“穷人／贫寒人”均恰当。“指着至高者起假誓”准确反映 ἐπιορκεῖ 的誓言语境。
