base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/009.yaml
  text: Such people are like hares, because they are half clean, but in truth they are unclean.
translation:
  language: zh_hans
  text: 这样的人就像野兔，因为他们只是在一半的意义上洁净；但其实是不洁净的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δασύποδες
  choice: 野兔
  rationale: 该词字面指“毛足的动物”，在此依照古代洁净条例的语境指野兔；译为“野兔”比直译“毛足兽”更自然明确。
- source_word: ἐξ ἡμισείας
  choice: 有一半
  rationale: 保留原文“从一半、半数意义上”的比喻表达，与下文真正不洁净形成张力。
- source_word: τὸ δ᾽ ἀληθὲς
  choice: 但实际上
  rationale: 自然表达“但就真实情形而言”，突出表面上的部分洁净与真实判定之间的对照。
- source_word: ἀκάθαρτοι
  choice: 不洁净
  rationale: 沿用礼仪洁净语境中的标准用语，不将其弱化为一般性的“不干净”。
theological_decisions:
- issue: “一半洁净”与“不洁净”的张力
  choice: 保留“有一半是洁净的，但实际上却是不洁净的”
  alternative: 译作“看似洁净，实则不洁净”
  rationale: 原文明确使用ἐξ ἡμισείας（从一半、半洁净），不应将其概括成单纯的表象与实质之别；保留这一说法也维持其与野兔之洁净分类背景的联系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“洁净／不洁净”保留宗教与礼仪语义；句式紧凑，忠实呈现原文的比喻和转折。
