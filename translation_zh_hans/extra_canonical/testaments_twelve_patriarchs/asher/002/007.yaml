  text: ⌈Τὴν⁴³ ψυχὴν σπιλοῖ, καὶ⌉ τὸ σῶμα λαμπρύνει⁴⁴, πολλοὺς ἀναιρεῖ καὶ ὀλίγους ἐλεεῖ, καὶ τοῦτο⁴⁵ διπρόσωπόν⁴⁶ ἐστι, *τὸ δὲ ὅλον πονηρόν ἐστιν⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/007.yaml
  text: It stains the soul and makes the body bright; it kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.
translation:
  language: zh_hans
  text: 它玷污灵魂，却使身体光鲜；它杀害许多人，只怜悯少数人。这也是两面的；但它整体上是邪恶的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπιλοῖ
  choice: 玷污
  rationale: 准确表达使灵魂沾染污点、受到道德污染的含义，并保留与下句“光鲜”的反差。
- source_word: λαμπρύνει
  choice: 使……光鲜
  rationale: 原词可指使之明亮或显得光彩；这里与“玷污灵魂”对举，译为“使身体光鲜”既自然，也不把含义过度限定为健康或荣耀。
- source_word: ἀναιρεῖ
  choice: 杀害
  rationale: 在“许多人”作宾语的语境中取其杀死、除灭义；“杀害”清楚而有力度。
- source_word: ἐλεεῖ
  choice: 怜悯
  rationale: 直接保留原词的施怜悯之义，也呈现与“杀害”之间尖锐的伦理反差。
- source_word: διπρόσωπόν
  choice: 两面性的
  rationale: 字面意象为“双面孔的”，语境中指表现相反、具有两面；此译保留判断而避免添加“虚伪”等原文未明说的动机。
- source_word: τὸ ὅλον πονηρόν
  choice: 整体都是邪恶的
  rationale: 保留“就整体而言”的总括判断，并用“邪恶”表达 πονηρόν 的道德贬义。
theological_decisions:
- issue: 中性指代 τοῦτο 所指对象
  choice: 译作“这／它”，不人格化
  alternative: 译作“他”
  rationale: 希腊文 τοῦτο 为中性，所指是上下文谈论的事物或行为；避免把它擅自解释为某个人格主体。
- issue: 前后反差是否应予调和
  choice: 保留“玷污灵魂，却使身体光鲜”的张力
  alternative: 将“使身体光鲜”解释性改译为带来肉体享受或表面益处
  rationale: 原文直接并置灵魂受污与身体变亮，不应加入特定神学或伦理解释来消解这种反差。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“却”“只”凸显希腊文各分句间的反差；不增加原文没有的具体所指或教派性解释。
