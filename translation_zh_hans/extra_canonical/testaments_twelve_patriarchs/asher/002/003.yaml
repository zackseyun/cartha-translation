  text: Ἔστιν ἄνθρωπος ἀγαπῶν πονηρευόμενον †ὃ ἐστι πονηρία†¹³, ὅτι καὶ ἀποθανεῖν αἱρεῖται ἐν κακῷ· καὶ περὶ τούτου φανερόν ἐστι †τὸ ὅλον†¹⁴ διπρόσωπόν ἐστι τὸ δὲ πᾶν κακὴ πρᾶξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/003.yaml
  text: And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man's account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.
translation:
  language: zh_hans
  text: 有一个人喜爱作恶的人——这就是恶[a]——因为他也选择在恶中死去。论到这事，显然整件事[b]具有两面性；但这一切都是恶行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这就是恶”所据希腊文疑有讹误，原文直译近于“这就是恶”。
    reason: 底本以校勘符号标示ὃ ἐστι πονηρία为可疑文字，正文需提示文本不确定性。
  - marker: b
    text: “整件事”所据希腊文疑有讹误；也可理解为“整体”。
    reason: 底本以校勘符号标示τὸ ὅλον为可疑文字，且该短语与后文“这一切”的关系不完全清楚。
lexical_decisions:
- source_word: ἀγαπῶν πονηρευόμενον
  choice: 喜爱作恶的人
  rationale: 按分词结构直译为喜爱一个正在行恶的人；不增添希腊文中没有明说的“为那人的缘故”。
- source_word: ἀποθανεῖν αἱρεῖται ἐν κακῷ
  choice: 选择死在恶中
  rationale: 保留“选择”和“在恶中”的鲜明表达，不将其解释性改写为某种具体死因。
- source_word: διπρόσωπον
  choice: 是两面的
  rationale: 原词可指有两副面孔、两面性或虚伪；此处采用较宽的“两面的”，以保留语义张力。
- source_word: κακὴ πρᾶξις
  choice: 恶行
  rationale: 简洁表达邪恶的行为或实践，符合现代汉语经传体语域。
theological_decisions:
- issue: 喜爱作恶者与选择死在恶中的主语及因果关系
  choice: 依照现存希腊文，让“他”自然回指前述“有一种人”，不补入“为那人的缘故”
  alternative: 像英语咨询文本一样译成“因为那人的缘故，他自己也选择死在恶中”
  rationale: 希腊文有因果连词ὅτι，却没有明确表示“为那人的缘故”的介词短语；故不把这一解释写入正文。
- issue: διπρόσωπον的道德含义
  choice: 译为“是两面的”
  alternative: 译为“是两面派的”或“是虚伪的”
  rationale: 原文可能指双重面貌，也可能暗含虚伪；采用不完全定性的译法，避免过早消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留原句的判断式推进和“两面／全然是恶行”之间的张力；对两处底本文字疑难均以脚注说明，不在正文中擅自重构。
