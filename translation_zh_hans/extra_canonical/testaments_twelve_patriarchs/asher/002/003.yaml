  to: 有一个人喜爱作恶的人——这就是恶[a]——因为他也选择在恶中死去。论到这事，显然整件事[b]具有两面性；但这一切都是恶行。
  rationale: 修订仅改善现代汉语表达，并使正文对两处存疑希腊文保持更贴近的措辞。保留“因为他也”的因果关系，却不添加原文没有明说的“为那人的缘故”；“具有两面性”保留διπρόσωπον可能含有的双重、两副面貌或虚伪意味，而不作教义性或解释性定论。
