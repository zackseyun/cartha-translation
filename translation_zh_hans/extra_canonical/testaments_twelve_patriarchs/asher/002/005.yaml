base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/005.yaml
  text: Another steals, acts unjustly, plunders, is greedy, and shows mercy to the poor. This too is double-faced, but the whole of it is evil.
translation:
  language: zh_hans
  text: 另一个人偷窃，行不义，抢夺，贪得无厌，又怜悯穷人；这也是双面的，但整体却是邪恶的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλος
  choice: 另一个人
  rationale: 承接上下文列举另一类人；补出“人”符合现代汉语表达。
- source_word: κλέπτει
  choice: 偷窃
  rationale: 直接表达秘密窃取他人财物。
- source_word: ἀδικεῖ
  choice: 行不义
  rationale: 保留该词宽泛的道德含义，不缩窄为某一种具体侵害。
- source_word: ἁρπάζει
  choice: 抢夺
  rationale: 体现强取、掠夺之意，并与“偷窃”有所区别。
- source_word: πλεονεκτεῖ
  choice: 贪得无厌
  rationale: 在此罪行清单中表达贪求更多、占人便宜的行为倾向。
- source_word: ἐλεεῖ πτωχούς
  choice: 怜悯穷人
  rationale: 准确传达向穷人施怜悯；不额外限定为施舍。
- source_word: διπρόσωπον
  choice: 双面的
  rationale: 保留原文“双面”的形象，指同一行为组合呈现相反的道德面貌。
- source_word: τὸ δὲ ὅλον πονηρόν ἐστιν
  choice: 但整体却是邪恶的
  rationale: 将判断落在此人的整套行为或其整体表现上，并保留转折和明确的负面评价。
theological_decisions:
- issue: 怜悯穷人的善行与整体邪恶之间的张力
  choice: 不把怜悯穷人译成虚伪行为，也不否认其表面善性；保留“整体却是邪恶的”的最终判断
  alternative: 译成“假意怜悯穷人”或“因此善恶参半”
  rationale: 原文称其为“双面的”，继而判断整体为邪恶，但没有明说怜悯是假装的，也没有把整体评为善恶相抵。
- issue: 并列连接词 καί 的语气
  choice: 译作“又”
  alternative: 译作“却”或“然而”
  rationale: 原文仅用并列连词，未明确加入让步或逆转语气；“又”保持并列，同时汉语读者仍能从内容本身感到张力。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。罪行以节奏清楚的并列短语呈现；保留“双面的”这一原文意象，不用较强且可能过度解释的“两面派”。
