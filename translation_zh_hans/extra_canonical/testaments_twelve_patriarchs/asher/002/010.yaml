lexical_decisions:
- source_word: Καὶ γὰρ
  choice: 因为……也
  rationale: γάρ承接上文给出理由，καί在此表示“也”；中文按自然语序分置。
- source_word: ὁ Θεὸς
  choice: 上帝
  rationale: 采用现代汉语中庄重而通行的神称。
- source_word: ἐν ταῖς πλαξὶ τῶν ἐντολῶν
  choice: 在诫命的石版上
  rationale: πλαξί指书写诫命的版；结合相关传统语境译为“石版”，比仅译“版”更清楚。属格“τῶν ἐντολῶν”直译为“诫命的”。
- source_word: οὕτως εἶπεν
  choice: 这样说过
  rationale: 保留“如此说”的指回作用；过去时以“说过”自然表达。
theological_decisions:
- issue: “诫命的石版”与特定经典文本的关系
  choice: 不补出“摩西”“十诫”或“经上”等信息
  alternative: 译作“上帝在十诫的石版上也这样宣告过”
  rationale: 希腊文本只说“诫命的版”，补充具体人物或数量会缩窄原文范围。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；保留本句承接上文的因果关系和“也”的递进意味。
