  text: Ἄλλος⁴⁸ μοιχεύει *καὶ πορνεύει⁴⁹ καὶ ἀπέχεται ἐδεσμάτων⁵⁰. καὶ⁵¹ νηστεύων κακοποιεῖ, καὶ τῇ³⁵ δυναστείᾳ *τοῦ πλούτου⁵² πολλοὺς κατασύρει⁵³, καὶ ἐκ⁵⁴ τῆς ὑπερόγκου⁵⁵ κακίας ποιεῖ⁵⁶ ⌈τὰς⌉⁵⁷ ἐντολάς⁵⁸. τοῦτο διπρόσωπόν ἐστιν⁵⁹, *τὸ δὲ ὅλον⁶⁰ κακόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/008.yaml
  text: Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the power of wealth he drags many down, and out of excessive wickedness keeps the commandments. This is double-faced, but it is altogether evil.
translation:
  language: zh_hans
  text: 另一个人通奸、行淫，也禁戒食物；他在禁食时作恶，凭财富的权势把许多人拖下去，又出于极度的邪恶而遵行诫命。这是两面的；但整体是恶的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεύει
  choice: 通奸
  rationale: 明确表达违反婚姻忠诚的性行为，与后面的泛称 πορνεύει 区分。
- source_word: πορνεύει
  choice: 行淫
  rationale: 保留其较广泛的性不道德含义，并采用庄重、易懂的经文用语。
- source_word: ἀπέχεται ἐδεσμάτων
  choice: 禁戒食物
  rationale: 直译其克制、不吃某些食物之意，不擅自限定具体食物或禁戒原因。
- source_word: νηστεύων
  choice: 禁食
  rationale: 与一般的食物禁戒有所区分，表达宗教性或刻意的禁食行为。
- source_word: τῇ δυναστείᾳ τοῦ πλούτου
  choice: 凭财富的权势
  rationale: 体现财富所带来的支配力量，而不强行添加原文未明说的所有格“他的”。
- source_word: κατασύρει
  choice: 拖垮
  rationale: 保留“向下拖、使人败落”的强烈动态意象，语义比单纯“拉下去”更自然。
- source_word: ἐκ τῆς ὑπερόγκου κακίας
  choice: 出于极度的邪恶
  rationale: 保留行为动机或来源这一反常表述，不替作者消解其道德张力。
- source_word: ποιεῖ τὰς ἐντολάς
  choice: 遵行诫命
  rationale: 这是“实行诫命”的自然汉语表达，同时保留恶人竟遵行诫命的悖论。
- source_word: διπρόσωπόν
  choice: 两面性
  rationale: 表达其一面行善、一面作恶的双重面貌；避免现代口语“两面派”过强的人身标签。
- source_word: τὸ δὲ ὅλον κακόν ἐστιν
  choice: 但从整体来看仍是恶的
  rationale: 将 τὸ ὅλον 理解为对整体现象的判断；“仍”自然呈现尽管有守诫命行为，整体结论不变。
theological_decisions:
- issue: 恶人“出于邪恶而遵行诫命”的悖论
  choice: 按原文保留这一表述
  alternative: 解释为他仅仅表面守诫命，或为了邪恶目的守诫命
  rationale: 原文没有明说是假装，也没有具体说明目的；翻译不应替文本消除其刻意的道德张力。
- issue: “整体是恶的”的指涉
  choice: 译为“从整体来看仍是恶的”
  alternative: 译为“这一切全都是恶的”
  rationale: 原文可指此人的整个双面行为或其整体品格；现译保留较宽泛的整体判断，避免断言每一项行为本身都同等邪恶。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“一面……一面……”突出本节的伦理对照；不添加原文未明说的禁食对象、财富归属或守诫命动机。
