  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/004.yaml
  text: Even if they are in love, they are in wickedness, hiding evil under a good name; but the end of the deed comes to evil.
translation:
  language: zh_hans
  text: 即使他们有爱，用美名掩盖恶的人仍在邪恶之中[a]；但这行为的结局归于恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的希腊文本和句法有疑难，也可理解为：“即使是爱，用美名掩盖恶，也是在邪恶之中。”
    reason: 原版以校勘符号标示整段疑难；ἀγάπη οὖσα与后面的阳性分词ὁ συγκρύπτων在语法上不一致，故保留不将主语或句法关系完全确定化的另一种理解。
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: 采用该词通常且直接的含义；与后文“邪恶”形成原文刻意保留的伦理张力。
- source_word: ὁ συγκρύπτων τὸ κακόν
  choice: 掩盖恶……的人
  rationale: 以名词化结构表达希腊语带冠词的现在分词，保留持续或特征性行为的意味。
- source_word: ὑπὲρ τὸ ὄνομα τὸ καλόν
  choice: 给它冠以美名
  rationale: 按上下文表达以良善名目遮掩恶事之意，比机械译作“在好名字之上”更符合现代汉语，同时不额外限定具体动机。
- source_word: τὸ τέλος τῆς πράξεως ἔρχεται εἰς κακόν
  choice: 这行为的结局终归于恶
  rationale: 保留“结局”与“恶”的重复对照，并用“归于”自然表达ἔρχεται εἰς所指向的结果。
theological_decisions:
- issue: 爱与邪恶并置所产生的张力
  choice: 即使所怀的是爱……仍是在邪恶之中
  alternative: 即使他们彼此相爱，他们也是邪恶的
  rationale: 希腊文本此处句法不稳且版本以校勘符号标示疑难；译文不把“爱”限定为人际恋爱，也不把行为者本体直接等同于邪恶，而保留善意不能使掩恶成为善的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所怀的是爱”“仍是在邪恶之中”“终归于恶”保留原文的伦理格言语气；脚注说明文本疑难，不在正文中武断消除歧义。
