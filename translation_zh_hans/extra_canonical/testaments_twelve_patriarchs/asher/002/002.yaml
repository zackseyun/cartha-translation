base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/002.yaml
  text: There is a man who does not pity his servants; and though this is double-faced, the whole of it is evil.
translation:
  language: zh_hans
  text: 有人不怜悯服侍他的人；然而这虽有两面，整体却是恶的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔστιν ἄνθρωπος ὃς
  choice: 有一种人
  rationale: 自然表达希腊语所引出的一类人及其行为，不把单数误解为某个已知个体。
- source_word: οὐκ οἰκτείρει
  choice: 不怜悯
  rationale: 保留 οἰκτείρω 所含的同情、怜恤之义，语气庄重而易懂。
- source_word: λειτουργοὺς αὐτοῦ
  choice: 他的仆役
  rationale: λειτουργούς 在此指为他服役的人；“仆役”既保留服事意味，也不额外强化 αὐτοῦ 为“自己的”。
- source_word: διπρόσωπον
  choice: 双面的
  rationale: 尽量保留原文“双面／两副面孔”的形象及其可能的伦理含义，不径直解释为“虚伪”或“善恶兼有”。
- source_word: τὸ ὅλον πονηρόν
  choice: 全然是恶
  rationale: 表达整体判断，即这件事从总体上属于恶；避免译成较弱的“有害”或“坏”。
theological_decisions:
- issue: διπρόσωπον 与整体为恶之间的张力
  choice: 保留“这虽是双面的，却全然是恶”的表述
  alternative: 虽然看似有善有恶，但总体是恶的
  rationale: 原文没有明说两面分别是善与恶；直译其形象可保存真实的语义张力，避免加入解释。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“有一种人”适合格言式列举；“仆役”比“奴仆”更少引入身份制度上的额外限定。
