  text: Do not be like Sodom, which did not recognize the angels of the Lord, and perished forever.
translation:
  language: zh_hans
  text: 不要像所多玛；它没有认出主的天使，并且永远灭亡了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνεσθε ὡς Σόδομα
  choice: 不要像所多玛
  rationale: γίνεσθε 在否定命令中表示“不要成为／不要表现得像”；汉语以“不要像”自然、准确地传达劝诫。
- source_word: ἠγνόησε
  choice: 不认得
  rationale: 该词可表示“不认识、不理会、未识别”。这里与“天使”连用，“不认得”保留所多玛未识别来客身份的语境，同时不额外断定其主观动机。
- source_word: τοὺς ἀγγέλους Κυρίου
  choice: 主的天使
  rationale: 按现有希腊文本直译属格关系；“天使”在现代汉语宗教文体中清楚而庄重。
- source_word: ἀπώλετο ἕως αἰῶνος
  choice: 永远灭亡了
  rationale: ἀπώλετο 指毁灭、灭亡；ἕως αἰῶνος 表持续至永远。此译保留其强烈且终局性的表达。
theological_decisions:
- issue: 所多玛“不认得”天使的含义
  choice: 采用“不认得”，不扩展为“不接待”或“不尊重”
  alternative: 不理会／不承认／没有认出
  rationale: ἠγνόησε 本身具有一定语义幅度；“不认得”最贴近直接认知意义，也避免把创世记叙事中的具体罪责解释预先写入正文。
- issue: ἕως αἰῶνος 的时限
  choice: 译作“永远”
  alternative: 直到永世／永远地
  rationale: 该短语惯常表达永久持续；“永远灭亡了”在现代汉语中自然，并保留原文终局性的神学张力。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。分号保留劝诫与例证之间的紧密关系；正文无须脚注标记。
