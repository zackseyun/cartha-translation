source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ οἶδα⁵ ὅτι ἁμαρτήσετε⁶ καὶ παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν, ⌜καὶ¹⁸ ἡ γῆ ὑμῶν⁹ ἐρημωθήσεται¹⁰, καὶ τὰ ἅγια ὑμῶν καταφθαρήσονται¹¹, καὶ ὑμεῖς¹² διασκορπισθήσεσθε¹³ εἰς τὰς τέσσαρας¹⁴ γωνίας *τῆς γῆς¹⁵, καὶ ἔσεσθε *εἰς διασπορὰν¹⁶ ἐξουδενωμένοι ὡς¹⁷ ὕδωρ¹⁸ ἄχρηστον¹⁹.⌝'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/002.yaml
  text: For I know that you will sin and be handed over into the hands of your enemies, and your land will be made desolate, and your holy things destroyed, and you will be scattered to the four corners of the earth, and you will be in the dispersion, despised like useless water.
translation:
  language: zh_hans
  text: 因为我知道，你们必会犯罪，必被交在仇敌手中；你们的土地必荒凉，你们的圣物[a]必被毁坏；你们必分散到大地的四角，沦为流散之民，受人藐视，如同无用的水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“圣所”或“神圣之物”。
    reason: 希腊文τὰ ἅγια的具体指向有歧义，需向读者保留。
lexical_decisions:
- source_word: παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν
  choice: 被交在仇敌手中
  rationale: 保留希腊文“交在……手中”的受事结构及审判意味，同时符合现代汉语的经文语体。
- source_word: ἡ γῆ ὑμῶν ἐρημωθήσεται
  choice: 你们的土地必荒凉
  rationale: 此处γῆ指他们所属的疆土；“荒凉”准确表达ἐρημόω所指的荒废、无人景象。
- source_word: τὰ ἅγια ὑμῶν
  choice: 你们的圣物
  rationale: 采用不限定具体所指的译法，保留中性复数τὰ ἅγια可能涵盖圣物、圣所或一切神圣之物的空间。
- source_word: εἰς τὰς τέσσαρας γωνίας τῆς γῆς
  choice: 到大地的四角
  rationale: 保留原文“四角”的具体意象，而不改写为较抽象的“四方”。
- source_word: εἰς διασπορὰν
  choice: 在流散之地
  rationale: 表达进入离散境况并身处流散群体之中的含义；与前面的“分散”形成有意的词义呼应。
- source_word: ἐξουδενωμένοι ὡς ὕδωρ ἄχρηστον
  choice: 受人藐视，如同无用的水
  rationale: ἐξουδενωμένοι为被轻看、视为无价值；直译水的比喻，不擅自补充其具体文化背景。
theological_decisions:
- issue: “圣物”具体指圣殿、圣所还是神圣之物
  choice: 正文译作“圣物”并加注可能译法
  alternative: 你们的圣所
  rationale: 希腊文τὰ ἅγια为中性复数，语境不足以唯一判定所指；正文不把这种含混限定为某一建筑或制度。
- issue: 预言中将来时的确定语气
  choice: 以“必”表达
  alternative: 将会
  rationale: 原文连续使用将来时陈述即将发生的犯罪、交付、荒凉、毁坏和分散；“必”体现其预告的确定性，但不额外解释预定论问题。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以分号划分灾祸层次。保留“交在……手中”“大地的四角”等源文意象；避免古奥词汇，也不借注释消解原文对圣物或圣所的含混。
