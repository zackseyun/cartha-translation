  source_fidelity: 原文只以ἐπισυνάξει（“他必召聚”）的第三人称单数动词隐含主语，并未出现“主”。正文补作“主”虽与英文审校轨迹一致，却超出了本句希腊文明确表达。另，两个διά短语均宜保留为“藉着”，不宜将前者确定译成表原因的“因”。修订以“他”保留主语的原有含蓄，并保留“在信心中”的修饰空间。
  naturalness: “但他必藉着自己的怜悯，并藉着亚伯拉罕、以撒和雅各，在信心中召聚你们”是庄重、通顺的现代书面汉语；“召聚”准确表达该动词的聚集／招聚语气。
