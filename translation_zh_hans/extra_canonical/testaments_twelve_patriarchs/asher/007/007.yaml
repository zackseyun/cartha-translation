  to: 但他[a]必藉着自己的怜悯，并藉着亚伯拉罕、以撒和雅各，在信心中召聚你们。[b]
  rationale: 修订以原文为首要依据：将“主”改为“他”，将“因”改为与后文平行的“藉着”，并删去原文没有的“成就这事”。语序调整为使两个“藉着”短语并列，同时以“在信心中”保留ἐν πίστει的领域性表达。
