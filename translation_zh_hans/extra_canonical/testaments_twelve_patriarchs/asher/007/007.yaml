  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/007.yaml
  text: But the Lord will gather you in faith through his compassion, and through Abraham and Isaac and Jacob.
translation:
  language: zh_hans
  text: 但他[a]必藉着自己的怜悯，并藉着亚伯拉罕、以撒和雅各，在信心中召聚你们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以动词的第三人称单数形式隐含主语，未明说其身份。
    reason: 避免将本句未明说的主语具体化为“主”。
  - marker: b
    text: “藉着亚伯拉罕、以撒和雅各”未说明这种中介关系的具体方式；“在信心中”也可理解为召聚所处的信仰领域。
    reason: 保留两个介词短语的语义开放性，不加入先祖之约、代求或其他具体解释。
lexical_decisions:
- source_word: ἐπισυνάξει
  choice: 使……聚集起来
  rationale: 保留该动词“召聚、聚集”的使动意味，并以“必”表达希腊语将来时。
- source_word: ἐν πίστει
  choice: 凭着信心
  rationale: 希腊语介词短语可表示聚集所处的信仰领域或所凭借的信心；“凭着信心”在现代汉语中自然，同时不过度限定其具体所指。
- source_word: διὰ τῆς εὐσπλαγχνίας αὐτοῦ
  choice: 因他的怜悯
  rationale: εὐσπλαγχνία指深切的慈悲、怜悯；此处διά加属格可表达凭借或缘由，译为“因”较自然。
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: 借着亚伯拉罕、以撒和雅各
  rationale: 保留διά所表达的中介关系，不进一步解释三位先祖如何参与这次聚集。
theological_decisions:
- issue: ἐπισυνάξει的隐含主语
  choice: 正文译作“主”，并加注说明原文仅有隐含的第三人称主语
  alternative: 直译为“他必”
  rationale: 希腊语动词本身未明说主语，但上下文及受审校的英文咨询层均将其理解为“主”；正文明确所指有助于独立阅读，脚注则保留原文形式上的含蓄。
- issue: “借着亚伯拉罕、以撒和雅各”的确切神学机制
  choice: 保留中介性措辞，不作阐释
  alternative: 解释为因先祖之约、先祖的代求或先祖的后裔
  rationale: 原文只使用διά，没有说明具体机制；译文不应替原文消除这一神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“使你们……聚集起来”保持原文召聚的力度；后半句补入“成就这事”，仅为避免连续两个介词短语在汉语中产生修饰关系不清，不增加具体神学内容。
