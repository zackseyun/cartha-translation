base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/004.yaml
  text: Therefore, my children, you also tell these things to your children, so that they may not disobey him.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们也要把这些事告诉你们的孩子，免得他们不顺从他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: 孩子们／孩子
  rationale: 既保留亲子称谓，也自然涵盖儿女；两次出现分别按汉语句法译为“孩子们”和“孩子”。
- source_word: καὶ ὑμεῖς
  choice: 你们也要
  rationale: 保留καί与显式代词ὑμεῖς所表达的附加和强调意味，即“你们也同样要这样做”。
- source_word: ταῦτα
  choice: 这些事
  rationale: 指向上文所述内容，用现代汉语“这些事”准确而自然。
- source_word: μὴ ἀπειθήσωσιν
  choice: 免得他们不顺从
  rationale: 以目的或防范结果从句“免得”表达μή加虚拟式；“不顺从”保留ἀπειθέω兼有不听从、悖逆的语义。
- source_word: αὐτῷ
  choice: 他
  rationale: 原文仅用阳性单数代词，本节没有明说所指对象；译文保留代词，不擅自补成“上帝”或其他明确称谓。
theological_decisions:
- issue: αὐτῷ所指对象
  choice: 保留为“他”
  alternative: 按上下文解释为“上帝”并明译
  rationale: 希腊文本在本句中只写“他”，明确化会消除原文存在的指代张力；因此保持其歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“所以”承接上文推论；“我的孩子们”保留临终训诲式的亲切称呼。句式尽量贴近希腊文逻辑，同时避免生硬直译。
