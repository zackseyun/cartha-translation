source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἕως οὗ²⁰ ὁ ὕψιστος ἐπισκέψηται τὴν γῆν, καὶ αὐτὸς ἐλθὼν ⌜ὡς ἄνθρωπος²¹ μετὰ ἀνθρώπων *ἐσθίων καὶ πίνων²²⌝ καὶ²³ συντρίβων²⁴ τὴν κάραν²⁵ τοῦ δράκοντος *ἐπὶ τοῦ²⁶ ὕδατος, *οὗτος σώσει²⁷ τὸν Ἰσραὴλ καὶ πάντα τὰ ἔθνη [θεὸς²⁸ εἰς ἄνδρα ὑποκρινόμενος²⁹].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/003.yaml
  text: Until the Most High visits the earth, himself coming as a man, eating and drinking with men, and crushing the head of the dragon upon the water; this one will save Israel and all the nations [God appearing as a man].
translation:
  language: zh_hans
  text: 直到至高者眷顾大地，亲自以人的样式来到[a]，与人一同吃喝，并在水上击碎龙的头；这一位必拯救以色列和万国——[上帝扮作一个人]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以人的样式来到”原文直译可作“如同人来到”或“作为人来到”。
    reason: 保留ὡς ἄνθρωπος的比较性、身份呈现与实际成为人之间的语义张力，不在正文中将其确定化。
  - marker: b
    text: 方括号内的话在文本传承中的地位不确定；“扮作”也可译作“假扮”或“呈现为”。
    reason: 说明源版方括号，并交代ὑποκρινόμενος可含扮演、假托或呈现某种身份的语义范围。
lexical_decisions:
- source_word: ἐπισκέψηται
  choice: 眷顾
  rationale: 既保留“临到、察看”的行动意味，也传达带着救助目的的探访；比单纯“访问”更符合此处庄重语境。
- source_word: ὡς ἄνθρωπος
  choice: 成为人
  rationale: 直译可作“如同人”，但上下文说他与人一同吃喝；正文采用自然中文“成为人”，并以脚注保留希腊语措辞本身的比较性与歧义。
- source_word: μετὰ ἀνθρώπων ἐσθίων καὶ πίνων
  choice: 与人一同吃喝
  rationale: 简洁、自然地再现分词结构及共同生活的含义。
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  choice: 击碎龙的头
  rationale: συντρίβω力度强，意为打碎、粉碎；“击碎”兼顾准确与现代汉语可读性。
- source_word: ἐπὶ τοῦ ὕδατος
  choice: 在水上
  rationale: ἐπί加属格在此可表示位于水面上或水域之上；“在水上”保留空间关系，不进一步解释具体场景。
- source_word: οὗτος
  choice: 这一位
  rationale: 保留指示代词的强调作用，并使用适合指称救主的庄重表达。
- source_word: ὑποκρινόμενος
  choice: 装扮成
  rationale: 该词可指扮演、假扮或呈现某种身份；“装扮成”比“显现为”更贴近其表演性，同时避免在正文中以过强的“伪装”措辞消解神学张力。
theological_decisions:
- issue: 至高者与随后救赎者的身份关系
  choice: 以“亲自来临”承接“至高者”，并保留“这一位”的指示强调
  alternative: 将后半句改成独立主语“他”或明确称为“弥赛亚”
  rationale: 希腊文 αὐτός 与 οὗτος 指向紧密，但没有使用“弥赛亚”这一称号；译文不额外引入身份标签。
- issue: ὡς ἄνθρωπος 与 ὑποκρινόμενος 所造成的道成肉身／外观张力
  choice: 正文译“成为人”，括号材料译“上帝装扮成人”，并分别用脚注说明
  alternative: 统一译为“显现为人”，或统一译为“假扮成人”
  rationale: 文本内部措辞本就存在张力，且方括号段落可能属于文本变体或增补；不应把两者强行协调成单一教义表述。
- issue: 方括号短语的文本地位
  choice: 保留方括号并加脚注
  alternative: 无括号纳入正文或删去
  rationale: 源文本将 θεὸς εἰς ἄνδρα ὑποκρινόμενος 置于方括号，译文应显明其不确定或次级文本地位。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式尽量保留希腊文从“直到”引出的长句推进，同时以分号划分来临行动与拯救结果。避免使用特定宗派术语，并用脚注呈现原文真实歧义及方括号材料的文本问题。
