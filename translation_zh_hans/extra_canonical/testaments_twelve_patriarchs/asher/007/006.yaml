source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ διὰ τοῦτο³⁹ διασκορπισθήσεσθε⁴⁰ ὡς Γὰδ καὶ⁴¹ Δάν, οἱ ἀδελφοί μου⁴², *καὶ ἀγνοήσετε χώρας αὐτῶν⁴³ καὶ φυλὴν καὶ γλῶσσαν⁴⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/006.yaml
  text: And because of this you will be scattered, like Gad and Dan, my brothers, and you will not know their land, tribe, and language.
translation:
  language: zh_hans
  text: 因此，你们必像我的兄弟迦得和但一样被分散，并且将不知道他们的土地、支派和语言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 自然表达因果关系，保留“因为这事”的指向性而不补明所指。
- source_word: διασκορπισθήσεσθε
  choice: 必……被分散
  rationale: 保留将来时和被动语态；“分散”符合族群离散的语境。
- source_word: ἀγνοήσετε
  choice: 将不再知道
  rationale: 表达对相关土地、支派和语言失去认识；“不再”使汉语语义自然，但不具体解释其成因。
- source_word: χώρας
  choice: 土地
  rationale: 保留该词可指地域、地方或国土的宽泛含义。
- source_word: φυλὴν
  choice: 支派
  rationale: 在以色列诸子及其后裔的语境中，“支派”比一般的“部族”更准确。
- source_word: γλῶσσαν
  choice: 语言
  rationale: 采用现代汉语中清楚且庄重的对应词。
theological_decisions:
- issue: “他们”所指对象
  choice: 译作“他们的”，不在正文中明确解释
  alternative: 将其明确译为“迦得和但的”或“那些地方之人的”
  rationale: 希腊文属格复数 αὐτῶν 的先行对象存在一定歧义，应保留原文张力，不作教义性或历史性补足。
- issue: 分散的性质
  choice: 仅译为“被分散”
  alternative: 译为“被掳分散”或“遭神驱散”
  rationale: 原文未明说掳掠者或行动主体，不应补入未表达的神学因果。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“我的兄弟”置于迦得和但之前，以符合汉语自然语序，并保留其同位说明作用。未添加原文没有的历史背景或神学解释。
