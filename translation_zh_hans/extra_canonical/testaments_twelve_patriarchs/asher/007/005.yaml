revisions:
- from: 因为我知道，你们必悖逆不从，必行事不敬虔；你们不留心上帝的律法，反被人的诫命以邪恶败坏。
  to: 因为我知道：你们既悖逆，必仍悖逆；既行不敬虔的事，必仍行不敬虔的事；不留心上帝的律法，反倒留心人的诫命，因邪恶而被败坏。
  rationale: 修订保留两组同根结构的强调和预告语气，同时以现代汉语可理解的“既……必仍……”表达。末句恢复原文的句法对照：不留心上帝的律法，反而留心人的诫命；“因邪恶而被败坏”对应κακίᾳ διαφθειρόμενοι。此译法不额外断言人的诫命本身就是邪恶，也不将邪恶人格化。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:19:19Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以两个同根分词—将来动词结构作加强式预告；草稿用“必”大体传达了确定性，但删去了两组重复所带出的持续/强化效果。末句中“人的诫命”在句法上与前面的“留心”相对照，而κακίᾳ（邪恶）修饰“被败坏”；草稿将“人的诫命”处理为直接施事，关系不够准确。
  naturalness: 草稿整体庄重通顺，但“反被人的诫命以邪恶败坏”语序和施受关系均较拗口，现代汉语中不易明确理解。
  terminology: “上帝的律法”“人的诫命”“不敬虔”均适合本段庄重宗教语体。将ἀπειθέω译为“悖逆不从”可以，但在加强式结构中以重复的“悖逆”更贴近原文。
  issues:
  - severity: medium
    issue: 末句将“人的诫命”误作“败坏”的直接施事，且“以邪恶败坏”关系不清。
    rationale: ἐντολαῖς ἀνθρώπων与τῷ νόμῳ θεοῦ平行，承接μὴ προσέχοντες所表达的“留心”；κακίᾳ则与διαφθειρόμενοι相连。译文应保留“留心人的诫命”与“被邪恶败坏”两层关系，不把人所出的诫命断言为败坏的直接施事。
  - severity: low
