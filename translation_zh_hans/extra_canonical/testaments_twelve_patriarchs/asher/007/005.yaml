base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/005.yaml
  text: For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men.
translation:
  language: zh_hans
  text: 因为我知道：你们既悖逆，必仍悖逆；既行不敬虔的事，必仍行不敬虔的事；不留心上帝的律法，反倒留心人的诫命，因邪恶而被败坏。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντες ἀπειθήσετε
  choice: 必悖逆不从
  rationale: 同根分词与限定动词构成加强式表达；汉语不机械重复，而以“必”保留其强调和确定语气。“悖逆不从”兼顾不信从与不服从的语义。
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: 必行事不敬虔
  rationale: 同根重复强调持续并确实发生的不敬虔行为；译文以“必行事不敬虔”自然传达。
- source_word: μὴ προσέχοντες
  choice: 不留心
  rationale: 表达不专注、不理会，较“不注意”更符合庄重劝诫语体。
- source_word: τῷ νόμῳ θεοῦ
  choice: 上帝的律法
  rationale: νόμος在此指上帝所赐的规范与律法，保留其宗教和伦理分量。
- source_word: ἐντολαῖς ἀνθρώπων
  choice: 人的诫命
  rationale: 直译其与“上帝的律法”形成的对照；“人的”指源于人，并不预先限定具体群体。
- source_word: κακίᾳ διαφθειρόμενοι
  choice: 以邪恶败坏
  rationale: 保留κακίᾳ可能表达手段或作用方式的语法关系，并呈现διαφθείρω的败坏、腐化含义。
theological_decisions:
- issue: “人的诫命”“邪恶”与“败坏”之间的关系
  choice: 反被人的诫命以邪恶败坏
  alternative: 反因人的诫命而被邪恶败坏／反被邪恶借着人的诫命败坏
  rationale: 希腊语的格位与词序容许不同的修饰关系。正文尽量贴近“诫命—邪恶—败坏”的连续结构，不把邪恶明确人格化，也不额外断定所有人的命令本身都等同于邪恶。
- issue: 同根重复的预言性强调
  choice: 两处均用“必”表达确定性，不逐字重复动词
  alternative: 你们悖逆着必将悖逆，行不敬虔之事必将不敬虔
  rationale: 逐字复制同根结构在现代汉语中生硬；以“必”保存强烈预告语气，同时避免把经文扩展为有关宿命或自由意志的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“上帝的律法”与“人的诫命”的鲜明对照；避免照搬英语咨询文本中冗拗的同根重复，也不消解末句在工具格和修饰关系上的真实张力。
