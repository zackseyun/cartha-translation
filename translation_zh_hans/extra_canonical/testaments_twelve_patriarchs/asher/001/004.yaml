  text: Therefore all things are twofold, one over against the other.
translation:
  language: zh_hans
  text: 因此，万事都是成双的，彼此相对。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 表达由上文推出结论的因果衔接。
- source_word: πάντα
  choice: 万事
  rationale: 自然而庄重地涵盖“所有事物”。
- source_word: δύο εἰσίν
  choice: 都是成双的
  rationale: 保留原文直译为“是两个”的二元配对含义，同时使现代汉语通顺；不将其过度解释为性质上的“双重”。
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: 彼此相对
  rationale: 表达每一方与另一方相对、相向或对立的关系，符合语境及英语审校层的理解。
theological_decisions:
- issue: “两个”所表示的关系
  choice: 译作“成双……彼此相对”
  alternative: “都有两面，互相对立”
  rationale: 原文强调两者相对，但未明确说同一事物具有抽象的“两面”；所选译法保留其格言式概括和一定歧义。
translation_notes:
  register: 采用简洁、格言式的现代标准汉语。“万事”较“所有东西”更庄重，又不显古奥。最新修订所列“抬起双脚、安然睡去”与本条提供的希腊原文不符，因此未采用。
