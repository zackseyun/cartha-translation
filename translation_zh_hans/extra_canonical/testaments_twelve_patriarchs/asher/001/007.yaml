source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Δίκαια *γὰρ λογιζομένη³¹ καὶ ἀπορρίπτουσα³² τὴν πονηρίαν ἀνατρέπει εὐθὺς τὸ κακόν³³, καὶ³⁴ ἐκριζοῖ³⁵ τὴν ἁμαρτίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/007.yaml
  text: For by considering what is righteous and casting away wickedness, it at once overturns evil and uproots sin.
translation:
  language: zh_hans
  text: 因为它思量正义之事，摒弃邪恶，便立刻推翻恶，根除罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαια
  choice: 正义之事
  rationale: 中性复数在此作名词性用法，指合乎正义的事；这样既贴近希腊文，也比抽象的“正义”更自然。
- source_word: λογιζομένη
  choice: 思量
  rationale: 该分词表示思考、衡量或考虑；“思量”保留审慎考虑的意味，并与句中的阴性单数主语“它”一致。
- source_word: ἀπορρίπτουσα
  choice: 摒弃
  rationale: 表达主动抛开、拒绝之意，语体庄重而自然。
- source_word: τὴν πονηρίαν
  choice: 邪恶
  rationale: 指恶劣、邪恶的性质或行为；译作“邪恶”保留其抽象性。
- source_word: ἀνατρέπει
  choice: 推翻
  rationale: 保留原词使之倾覆、推倒的强烈意象。
- source_word: ἐκριζοῖ
  choice: 根除
  rationale: 准确呈现“连根拔起”的比喻含义，同时符合现代汉语表达。
- source_word: τὴν ἁμαρτίαν
  choice: 罪
  rationale: 直接对应宗教伦理语境中的“罪”，不额外限定其性质。
theological_decisions:
- issue: 阴性分词所承接的主语
  choice: 用“它”承接上文所指的主体，不在本节补明
  alternative: 补译为“善的倾向”或其他具体主体
  rationale: 本节希腊文本身未明说主语，只以阴性单数分词和动词承接上下文；为避免把解释写入正文，保留代词指称及其上下文依赖性。
- issue: “恶”与“罪”的关系
  choice: 分别译为“恶”和“罪”
  alternative: 将两者合并或互释
  rationale: 原文分别使用 κακόν 与 ἁμαρτίαν，并以两个不同动作描述，译文保留这种区分及并列张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。句式尽量保留原文的因果关系、两个伴随动作以及“立刻推翻／根除”的平行结构；不补入原文未明示的主语身份。
