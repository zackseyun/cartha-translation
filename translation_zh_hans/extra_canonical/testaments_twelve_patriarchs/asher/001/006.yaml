base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/006.yaml
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents.
translation:
  language: zh_hans
  text: 所以，心灵若想行得好[a]，就会以公义行一切事；即使犯了罪，也会立刻悔改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行得好”所据的希腊文措辞在传本中可能有文本疑难；这里按现存正文译出，也可理解为“走美善的道路”。
    reason: 原文编辑者以疑难符号标示καλῶς πορευθῆναι，宜向读者说明其文本不确定性，同时不在正文中擅自修订。
lexical_decisions:
- source_word: ἡ ψυχὴ
  choice: 心灵
  rationale: 既保留“ψυχή”作为人的内在生命与意志主体的含义，也比单用“灵魂”更符合现代汉语在此伦理语境中的表达。
- source_word: θέλει
  choice: 愿
  rationale: 直接表达意愿，不强化为更深层或更强烈的“渴望”。
- source_word: καλῶς πορευθῆναι
  choice: 行得好
  rationale: “πορεύεσθαι”可指行走，也可喻指生活行止；“行得好”保留其行为与人生道路的意象，同时避免擅自具体化为“走正路”。
- source_word: πάσας τὰς πράξεις αὐτῆς ποιεῖ
  choice: 做一切事
  rationale: 以自然现代汉语表达“实行其一切行动”，不采用生硬的“做它所有的行为”。
- source_word: ἐν δικαιοσύνῃ
  choice: 按正义
  rationale: 表达在正义的准则或范围内行事；“正义”在现代普通读者中清楚，也不额外引入特定宗派术语。
- source_word: κἂν ἁμάρτῃ
  choice: 即使犯了罪
  rationale: 保留让步条件及罪的伦理、宗教分量；过去时助词“了”使汉语条件句自然，但不限定具体时间。
- source_word: εὐθὺς μετανοεῖ
  choice: 也会立刻悔改
  rationale: 准确传达“立即”与心意、行为转变的“悔改”，并与前句的一般性陈述衔接。
theological_decisions:
- issue: 行义、犯罪与悔改之间的张力
  choice: 保留“即使犯了罪，也会立刻悔改”
  alternative: 改写为“因此绝不犯罪”或把悔改解释为获得赦免的条件
  rationale: 原文同时肯定按正义行事的倾向与仍可能犯罪的现实，并只明说随即悔改；译文不消除这种张力，也不添加救恩论推论。
- issue: “心灵”是否被人格化为独立实体
  choice: 照原文以“心灵”为意愿和行动的语法主体
  alternative: 解释性改写为“一个人若愿意”
  rationale: 保留原文的伦理—人论表达方式，不预先判定“ψυχή”的具体本体论含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以”承接上文推论；全句保持格言式伦理教导的简洁节奏。正文中的[a]与脚注对应。
