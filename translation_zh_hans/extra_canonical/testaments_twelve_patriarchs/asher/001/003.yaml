source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Δύο ὁδοὺς *ἔδωκεν ὁ Θεὸς τοῖς υἱοῖς τῶν ἀνθρώπων¹⁴, καὶ δύο διαβούλια, ⌜καὶ δύο πράξεις, *καὶ δύο τρόπους¹⁵⌝, *καὶ ⌜δύο⌝ τέλεα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/003.yaml
  text: God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two ends.
translation:
  language: zh_hans
  text: 神赐给世人两条道路、两种意念、两类行为、两种行事方式和两种结局。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: 世人
  rationale: 这是表示人类的闪语式希腊表达；译作“世人”比逐字的“人的众子”更符合现代汉语，同时保留其普遍范围。
- source_word: ὁδοὺς
  choice: 道路
  rationale: 保留“道路”这一伦理生活方向的常见隐喻，也与后续成对项目相呼应。
- source_word: διαβούλια
  choice: 意念
  rationale: 该词可指谋划、盘算或内在意向；“意念”在此既自然，又不过度限定为正式的“计划”或最终的“目的”。
- source_word: πράξεις
  choice: 行为
  rationale: 直接表达已经付诸实行的行动，与前面的内在意念形成对照。
- source_word: τρόπους
  choice: 行事方式
  rationale: τρόπος 可指方式、样态或品性；在这组伦理对照中，“行事方式”自然且保留其较宽泛的意义。
- source_word: τέλεα
  choice: 结局
  rationale: τέλος 的复数形式可指终点、结果或结局；“结局”适合两条伦理道路最终归宿的语境，同时不把它解释成主观目的。
theological_decisions:
- issue: “两种”结构是否指明善恶
  choice: 保留原文仅列出成对类别的表达，不在本节补入“善与恶”
  alternative: 明确译为善恶两条道路、两类意念等
  rationale: 本句本身只说“两个/两种”，其善恶性质应由上下文说明；补入善恶会提前消解原文的展开方式。
- issue: “结局”是结果还是目的
  choice: 采用侧重最终归宿的“结局”
  alternative: 译作“目的”或“终点”
  rationale: τέλεα 存在语义张力；本句的道路伦理框架较支持最终结果，但译文不进一步说明具体审判或救恩内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文五项并列及反复出现的“两”这一修辞骨架；用“两条、两种、两类”等符合汉语搭配的量词，避免生硬逐字翻译。所附 latest_revisions 的改文与本次希腊原文内容不符，因此未采纳。
