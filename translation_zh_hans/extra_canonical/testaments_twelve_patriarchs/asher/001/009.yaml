  text: '*Ὅτε γὰρ⁵¹ ἄρξεται⁵² *τὸ ἀγαθὸν ποιεῖν⁵³, τὸ τέλος τῆς πράξεως *εἰς πονηρὸν αὐτῷ ἐλαύνει⁵⁴. ἐπειδὴ ὁ⁵⁵ θησαυρὸς⁵⁶ τοῦ διαβουλίου⁵⁷ πονηροῦ⁵⁸ πνεύματος πεπλήρωται⁵⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/009.yaml
  text: For whenever it begins to do good, the end of the action drives him into evil, because the treasure of its purpose is filled with an evil spirit.
translation:
  language: zh_hans
  text: 因为每当他开始行善时，这行为的结局就把他推向恶；因为邪恶谋划的宝库充满了邪灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἀγαθὸν ποιεῖν
  choice: 行善
  rationale: 按现有希腊文本直译为“做善事”，不采纳修订记录中缺乏该文本支持的“行恶抵挡善”。
- source_word: τὸ τέλος τῆς πράξεως
  choice: 这行为的结局
  rationale: 保留“行为”与其最终结果之间的对照，符合原文结构。
- source_word: εἰς πονηρὸν αὐτῷ ἐλαύνει
  choice: 却把他推向恶
  rationale: ἐλαύνει含驱赶、推进之意；“推向恶”自然表达其趋向，同时保留αὐτῷ所指的阳性受事者。
- source_word: ὁ θησαυρὸς τοῦ διαβουλίου
  choice: 意念的宝库
  rationale: θησαυρός为“宝库、积存之处”；διαβούλιον在此可指谋划、心计或意念，选“意念”以保留较宽泛的内在筹谋含义。
- source_word: πονηροῦ πνεύματος
  choice: 邪灵
  rationale: 该属格最自然地与“充满”连用，表示宝库被邪恶的灵充满；“邪灵”是现代汉语中简洁而清楚的表达。
theological_decisions:
- issue: 行善的开端与趋恶的结局之间的张力
  choice: 保留“开始行善……结局却把他推向恶”的悖论式表述
  alternative: 改为“开始行恶抵挡善”
  rationale: 现有希腊文明确写τὸ ἀγαθὸν ποιεῖν（行善）；应保存原文的伦理张力，不以解释性改写消除它。
- issue: 代词所指不完全一致
  choice: 分别译作“它”和“他”
  alternative: 统一译为“他”或“这意念”
  rationale: 原文先用中性主语形式，后有αὐτῷ阳性代词；上下文未提供足够信息消除这一转换，因此译文保留其模糊性。
- issue: πονηροῦ πνεύματος的理解
  choice: 译为“邪灵”
  alternative: 译为“邪恶的心态”或“恶的精神”
  rationale: πνεῦμα可以具有多义性，但“充满了邪灵”最直接反映语法与古代宗教伦理语境，不进一步界定其本体性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“却”用于显明行善开端与趋恶结局的强烈反差；不根据英文修订记录改动希腊文本的基本语义。
