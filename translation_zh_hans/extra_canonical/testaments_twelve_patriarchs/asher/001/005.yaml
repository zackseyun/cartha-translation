source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὁδοὶ *⌜γὰρ⌝ εἰσὶ²⁰ δύο, καλοῦ καὶ κακοῦ· ἐν οἷς²¹ εἰσι τὰ δύο²² διαβούλια ἐν στέρνοις²³ ἡμῶν²⁴ *διακρίνοντα αὐτά²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/005.yaml
  text: For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.
translation:
  language: zh_hans
  text: 因为有两条路：善的路和恶的路；在其中有我们心中的两种意念，把这两条路区分开来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ
  choice: 路
  rationale: 保留原文“道路”的伦理隐喻；“路”在现代汉语中自然、清楚，也与后文善恶两种方向相称。
- source_word: καλοῦ καὶ κακοῦ
  choice: 一条是善路，一条是恶路
  rationale: 希腊文直译为“善与恶的”，中文补出两条路各自的性质，使对应关系明确而不增加解释。
- source_word: διαβούλια
  choice: 意念
  rationale: 该词可指谋划、意向或内在考量；“意念”既适合“在胸中”的语境，也避免过度限定为正式计划或固定本性。
- source_word: ἐν στέρνοις ἡμῶν
  choice: 我们心中
  rationale: 字面为“在我们的胸中”；现代汉语以“心中”自然表达内在思想与意向，同时保留其内在性。
- source_word: διακρίνοντα
  choice: 辨别开来
  rationale: 保留“区分、辨别”的主动含义，不把它解释成审判、选择或定罪。
theological_decisions:
- issue: “两种意念”与“两条路”的关系
  choice: 保留两种意念在两条路的范围内并承担辨别作用的表述
  alternative: 译成“心中的两种倾向分别引向这两条路”
  rationale: 原文没有明确说意念“引向”道路；采用较贴近句法的表达，以免引入关于人性或自由意志的额外体系。
- issue: 分词 διακρίνοντα 的主语与宾语
  choice: 以“两种意念”为主语，以“两条路”为宾语
  alternative: 理解为两种意念彼此有别，或由人来分辨它们
  rationale: 中性复数分词与“两个意念”在语法上呼应，而 αὐτά 最自然地回指前述两条道路；译文据此表达，同时不进一步说明辨别机制。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。保留善恶“两条路”的形象，并以“心中”自然传达古希腊语“胸中”的内在思想语境。句式尽量贴近原文，同时避免生硬的“善与恶之道路”结构。
