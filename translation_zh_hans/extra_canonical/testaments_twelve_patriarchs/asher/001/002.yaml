base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/002.yaml
  text: While still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything that is upright before God.”
translation:
  language: zh_hans
  text: 他身体还健康时，对他们说：“亚设的孩子们，要听你们父亲的话；凡在上帝面前正直的事，我都要指示你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: 身体还健康时
  rationale: 分词表示说话时仍处于健康状态；补出“身体”可使现代汉语自然清楚，又不增加原文没有的病情细节。
- source_word: Ἀκούσατε
  choice: 要听……的话
  rationale: 保留命令语气；汉语以“听某人的话”自然表达听从、留意其教导。
- source_word: τέκνα Ἀσήρ
  choice: 亚设的孩子们
  rationale: 按呼格理解为对亚设的众子孙说话，同时保留“孩子们”的亲切称呼。
- source_word: πᾶν τὸ εὐθὲς
  choice: 凡……正直的事
  rationale: εὐθύς在此为道德意义上的正直、端正；“凡……的事”自然传达带冠词的整体性表达。
- source_word: ἐνώπιον τοῦ Θεοῦ
  choice: 在上帝面前
  rationale: 直译并保留行为接受上帝察验与评判的语义。
- source_word: ὑποδείξω
  choice: 指示
  rationale: 表达展示、说明和教导之意，适合父亲临终训诲的庄重语域。
theological_decisions:
- issue: “正直”的判断关系
  choice: 在上帝面前正直
  alternative: 上帝眼中正确
  rationale: 采用较贴近ἐνώπιον τοῦ Θεοῦ的表达，不把“在……面前”所含的临在、察验与评判意味缩减为单纯主观观点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与训诲语体。“要听你们父亲的话”比逐词式“听你们的父亲”更符合现代汉语，同时保留原文命令力度。
