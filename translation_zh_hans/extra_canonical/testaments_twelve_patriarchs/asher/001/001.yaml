lexical_decisions:
- source_word: Διαθήκη
  choice: 遗训
  rationale: 此处指族长临终前向后代所作的训诫与嘱咐；“遗训”比“约”或“遗嘱”更符合本书体裁及现代汉语表达。
- source_word: Ἀσὴρ / Ἀσήρ
  choice: 亚设
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: Ζέλφας
  choice: 悉帕
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: Ἀντίγραφον
