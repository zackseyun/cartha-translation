base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/008.yaml
  text: But if the intent inclines to evil, all its actions are in wickedness, driving away the good and clinging to the evil, and ruled by Beliar; and even if it does something good, it turns it into evil.
translation:
  language: zh_hans
  text: 但人的意念若偏向邪恶，他一切所做的都在邪恶中：弃绝善，依附恶，并受彼列辖制；即使他做了善事，也会把它变成恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ διαβούλιον
  choice: 人的意念
  rationale: 指内在的谋算、意向或打算；译作“意念”自然且保留其道德取向。补出“人的”以明确希腊文阴性代词在汉语中的所指，避免误解为上一分句中的“邪恶”。
- source_word: κλίνῃ
  choice: 偏向
  rationale: 保留“倾斜、趋向”的比喻，同时符合现代汉语表达。
- source_word: πᾶσα πρᾶξις αὐτῆς
  choice: 他所做的一切
  rationale: 按意义表达意念所产生的全部行为；比直译“一切行动”更自然。
- source_word: ἀπωθουμένη τὸ ἀγαθόν
  choice: 排斥善
  rationale: ἀπωθέομαι含推开、拒斥之意；“排斥”简洁地保留主动拒绝善的力度。
- source_word: προσκολλώμενος τὸ κακόν
  choice: 依附恶
  rationale: προσκολλάω表示紧贴、依附；“依附”保留持续亲近并结合于恶的含义。
- source_word: κυριευθεὶς ὑπὸ τοῦ Βελίαρ
  choice: 受彼列辖制
  rationale: κυριεύω表示作主、支配；“辖制”体现被统治的被动关系。“彼列”采用中文宗教文献中通行的专名音译。
- source_word: μεταστρέφει
  choice: 把它变成
  rationale: 该动词可指转变、扭转；这里的宾语回指所做的善事，译文据语境明示为“把它变成恶事”。
theological_decisions:
- issue: 善行被转为恶的主体与含义
  choice: 保留“也会把它变成恶事”
  alternative: 即使行善，也是在恶中行／也会将善曲解为恶
  rationale: 希腊文主语承接前文的意念或受恶支配之人，μεταστρέφει表达转变结果。译文不进一步解释这是动机污染、行为后果还是道德评价，以保留原文的张力。
- issue: 彼列的身份
  choice: 仅作专名“彼列”
  alternative: 魔鬼彼列／邪灵彼列
  rationale: 原文只用专名Βελίαρ，未附身份说明；不在正文中加入额外的恶魔学解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留原文由条件句推进至一连串恶的表现、最后以让步句收束的结构；适度补出汉语所需的主语，但不消解底本文法上的指代张力。
