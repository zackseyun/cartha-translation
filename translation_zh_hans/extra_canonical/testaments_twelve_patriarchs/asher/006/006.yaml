  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/006.yaml
  text: But if it is at rest in joy, it recognizes the angel of peace, and he brings it into eternal life.
translation:
  language: zh_hans
  text: 但它若在喜乐中安静，就认出和平的天使，并把他带入永恒的生命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本在此可能有讹误。按其字面语法，是前文所指的“它”把“和平的天使”带入永恒的生命；也可依上下文理解为“和平的天使把它带入永恒的生命”。
    reason: 原文的代词性别和句法指向与较顺畅的上下文理解存在冲突，需要向读者公开文本不确定性。
lexical_decisions:
- source_word: ἥσυχος
  choice: 安静
  rationale: 表达安定、静息的状态，既贴近原词，也与ἐν χαρᾷ“在喜乐中”自然搭配。
- source_word: ἐν χαρᾷ
  choice: 在喜乐中
  rationale: 保留介词结构及其状态性含义，不弱化为单纯的“欢喜地”。
- source_word: γνωρίζει
  choice: 认出
  rationale: 在以“和平的天使”为宾语的语境中，“认出”比泛泛的“知道”更自然，同时保留识别、认识之意。
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: 和平的天使
  rationale: 按属格结构直译，保留其宗教意象，不擅自解释为抽象的和平使者。
- source_word: ζωὴ αἰώνιος
  choice: 永恒的生命
  rationale: 对应原文固定表达，采用现代、庄重且易懂的措辞。
theological_decisions:
- issue: εἰσφέρει αὐτὸν的主宾关系
  choice: 并把他带入永恒的生命
  alternative: 和平的天使把它带入永恒的生命
  rationale: 按现存希腊文的句法，前一分句未明说的主语延续到εἰσφέρει，而阳性宾格αὐτόν最自然地回指阳性的“天使”。尽管这一读法在上下文中显得反常，仍优先保留原文的真实张力，并用脚注说明常见的语境性理解。
translation_notes:
  register: 采用现代标准普通话，保持庄重而清楚。“它”承接上下文所说的魂或内在倾向，但本节没有明说，故不直接补成“灵魂”；“他”用于天使。
