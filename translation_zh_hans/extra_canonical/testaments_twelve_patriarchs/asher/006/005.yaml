base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/005.yaml
  text: For when a wicked soul departs, it is tormented by the evil spirit, which also enslaved it in lusts and wicked deeds.
translation:
  language: zh_hans
  text: 因为，邪恶的灵魂离去时，就受那邪灵的折磨；它也曾在私欲和恶行中作那邪灵的奴仆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρὰ ἡ ψυχὴ
  choice: 邪恶的灵魂
  rationale: 保留形容词对“灵魂”的直接道德定性，符合上下文的善恶对照。
- source_word: ἀπέρχεται
  choice: 离去
  rationale: 原文只说“离去”，未明说离开身体、世界或今生，因此保留其含蓄性。
- source_word: βασανίζεται
  choice: 受……的折磨
  rationale: 准确表达被动语态及受苦、受刑罚的含义。
- source_word: τοῦ πονηροῦ πνεύματος
  choice: 那邪灵
  rationale: 以自然的现代汉语表达定冠词和“邪恶之灵”的意思。
- source_word: ὃ καὶ ἐδούλευεν
  choice: 它也曾……作那邪灵的奴仆
  rationale: ἐδούλευεν是主动语态，表示“作奴仆、服事”，并非“奴役了它”；关系代词ὃ指向“邪灵”并作动词的宾语，省略的主语承接“灵魂”。这一译法保留奴役/隶属意味，同时符合希腊语句法。
- source_word: ἐν ἐπιθυμίαις καὶ ἔργοις πονηροῖς
  choice: 在私欲和恶行中
  rationale: “私欲”表达ἐπιθυμίαις在此处的负面欲望含义，“恶行”自然对应ἔργοις πονηροῖς。
theological_decisions:
- issue: 灵魂与邪灵之间的施事关系
  choice: 灵魂曾作邪灵的奴仆，后来受邪灵折磨
  alternative: 邪灵曾在私欲和恶行中奴役灵魂
  rationale: 现存希腊文ἐδούλευεν是“作奴仆/服事”的主动形式；若译成“奴役了它”，需有使役意义的动词，原文并无此形式。译文因此遵从原文语法，不依照英语修订稿对关系的改写。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“离去”保留原文对死亡状态的委婉与未明说之处；“作……的奴仆”既便于普通读者理解，也呈现ἐδούλευεν的隶属意味。
