source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτι οἱ διπρόσωποι δισσῶς †κολάζονται⁵, ⌜Ὅτι καὶ πράσσουσι τὸ κακόν, καὶ συνευδοκοῦσι τοῖς πράσσουσιν⁶, *μιμούμενοι τὰ πνεύματα τῆς πλάνης καὶ κατὰ τῶν ἀνθρώπων συναγωνιζόμενοι⁷.⌝
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/002.yaml
  text: For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against men.
translation:
  language: zh_hans
  text: 因为表里不一的人要受双重惩罚：他们不但作恶，还赞同作恶的人，仿效迷惑人的诸灵，与人争战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διπρόσωποι
  choice: 表里不一的人
  rationale: 字面为“有两副面孔的人”，语境指怀有双重立场、言行不一者；译为“表里不一”自然且保留道德含义。
- source_word: δισσῶς κολάζονται
  choice: 要受双重惩罚
  rationale: 对应副词“以双重方式”和被动动词“受惩罚”，保留原文与“表里不一/双面”之间的修辞呼应。
- source_word: συνευδοκοῦσι
  choice: 赞同
  rationale: 该词表示赞许、认可或乐见某行为；“赞同”准确表达对作恶者行为的认同。
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: 迷惑人的诸灵
  rationale: πλάνη可指迷误、欺骗或迷惑；采用带宾语功能的自然汉语表达，同时保留属灵存在的复数。
- source_word: συναγωνιζόμενοι
  choice: 争战
  rationale: 此处表示共同参与对抗或争斗；结合κατὰ τῶν ἀνθρώπων，译作“与人争战”简洁而有力度。
theological_decisions:
- issue: “迷惑/谬误的灵”是人格化属灵存在还是抽象势力
  choice: 译作“迷惑人的诸灵”
  alternative: “谬误之灵”或“迷惑的邪灵”
  rationale: 原文使用复数πνεύματα，较自然地指多个灵体；不添加“邪”字，以免加入原文未明说的定性，同时让上下文呈现其敌对性质。
- issue: συναγωνιζόμενοι是否含“与诸灵一同”争战之意
  choice: 仅明译“与人争战”
  alternative: “与那些灵一同对抗人”
  rationale: συν-可能表达共同参与，但原句没有单独明示同伴；避免把隐含关系过度具体化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“不但……还……”清楚呈现καὶ…καὶ的并列递进关系；保留“作恶—赞同作恶者—仿效诸灵—与人争战”的论证次序。
