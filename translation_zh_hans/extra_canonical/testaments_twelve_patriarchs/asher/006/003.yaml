  text: ⌈Ὑμεῖς οὖν, τέκνα μου⁷ᵃ, τὸν νόμον Κυρίου⁹ φυλάξατε· καὶ¹⁰ μὴ προσέχετε *τῷ κακῷ ὡς καλῷ¹¹, ἀλλὰ κατὰ¹² τὸ ὄντως⁹ καλὸν¹³ ἀποβλέπετε, καὶ διατηρεῖτε αὐτὸ ἐν πάσαις ταῖς¹⁴ ἐντολαῖς Κυρίου, εἰς αὐτὸ¹⁵ ἀναστρεφόμενοι, καὶ ἐν αὐτῷ καταπαύοντες¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/003.yaml
  text: You therefore, my children, keep the law of the Lord, and do not look upon evil as good; but look instead to what is truly good, and keep it in all the commandments of the Lord, turning toward it and resting in it.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要遵守主的律法；不要把恶看作善，却要注目于那真正的善，并在主的一切诫命中持守它，转向它，安息于其中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: 遵守
  rationale: 既表达谨慎守护，也符合现代汉语中“遵守律法”的自然搭配。
- source_word: μὴ προσέχετε τῷ κακῷ ὡς καλῷ
  choice: 不要把恶看作善
  rationale: 保留“将恶当作善来看待”的对照，简洁传达 προσέχετε 在此处的注意、看待之意。
- source_word: τὸ ὄντως καλὸν ἀποβλέπετε
  choice: 注目于那真正的善
  rationale: ἀποβλέπετε 含定睛、专注之意；“注目于”比泛泛的“看”更能呈现其方向性。
- source_word: διατηρεῖτε αὐτό
  choice: 持守它
  rationale: διατηρέω 强调持续保存、谨守；“持守”兼具延续性和伦理语境中的庄重感。
- source_word: εἰς αὐτὸ ἀναστρεφόμενοι
  choice: 转向它
  rationale: 该表达在句中具有方向性；译作“转向它”保留原文措辞可能包含的行为或生命取向，而不把它限定为某一特定解释。
- source_word: ἐν αὐτῷ καταπαύοντες
  choice: 安息于其中
  rationale: καταπαύω 表示停止、歇息或安息；此译保留原文的宗教和伦理意蕴。
theological_decisions:
- issue: αὐτό／αὐτῷ 的指代对象
  choice: 以“它／其中”延续指向“那真正的善”
  alternative: 明确解释为“主的律法”或“主”
  rationale: 从语法上看，中性代词最自然地回指中性的 τὸ ὄντως καλόν（那真正的善）；不将其神学化地改指“主”。
- issue: ἀναστρεφόμενοι 的含义
  choice: 译为“转向它”
  alternative: 译为“行在其中”或“以此为生活准则”
  rationale: 该词可涉及行为、生活方式，也可能在此受 εἰς 支配而突出方向；“转向”保留这种张力，避免过早确定为单纯的行为规范。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文的劝诫推进：遵守律法—拒绝混淆善恶—注目真善—在诫命中持守—转向并安息。
