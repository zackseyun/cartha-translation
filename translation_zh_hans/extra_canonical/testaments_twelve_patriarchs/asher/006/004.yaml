base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/004.yaml
  text: For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and to Beliar.
translation:
  language: zh_hans
  text: 因为人的结局显明他们的义；他们也被主的天使和彼列的天使所认识。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ τέλη τῶν ἀνθρώπων
  choice: 人的结局
  rationale: τὰ τέλη 指人最终的结局或收场；译作“结局”既自然，也保留末后结果显露品格的含义。
- source_word: δεικνύουσι τὴν δικαιοσύνην αὐτῶν
  choice: 显明他们是否为义
  rationale: 直译为“显明他们的义”；在现代汉语中补出“是否”可表达结局对其义之真伪的验证，同时不预断所有人都有义。
- source_word: γνωρίζονται
  choice: 被……所认识
  rationale: 保留希腊文被动语态及“为……所知/识别”的基本意义，不改写为主动的“天使知道他们”。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用现代中文宗教文献中对 Beliar/Belial 的常见音译；此处按属格结构理解为彼列所属的天使。
theological_decisions:
- issue: τοῖς ἀγγέλοις Κυρίου, καὶ τοῦ Βελίαρ 的并列范围
  choice: 主的天使和彼列的天使
  alternative: 主的天使和彼列
  rationale: τοῦ Βελίαρ 与 Κυρίου 同为属格，最自然地共同修饰 τοῖς ἀγγέλοις，即“主的天使与彼列的天使”。英语审校层采用“to Beliar”，但希腊语句法更支持省略重复名词“天使”的并列属格解释。以脚注交代另一种理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“是否为义”避免生硬的“显明他们的义”，同时保留结局检验、揭示其公义状况的张力。
