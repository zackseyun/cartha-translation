review_pass:
  verdict: revise
  source_fidelity: 草稿将“主的诫命”作为“遵行”的宾语，并把τῇ ἀληθείᾳ（与ἀκολουθοῦντες搭配的与格）处理为独立的“持守真理”。但原文较自然的句法是：Προσέχετε接“主的诫命”（留意／谨守），而μονοπροσώπως ἀκολουθοῦντες τῇ ἀληθείᾳ意为“专一地遵从／跟随真理”。修订保留这两个相连但有区别的劝诫，也保留“你们也”。
  naturalness: “谨守主的诫命，专一地遵从真理”是现代汉语中庄重、清晰且自然的训诲语体。“专一地”表达μονοπροσώπως的单一、坚定取向，不把它过度心理化为特定神学概念。
  terminology: “主”“诫命”“真理”均为稳妥、通行的宗教文本用语；“遵从真理”对应ἀκολουθεῖν加与格，较“持守真理”更贴近原文的动词及句法关系。
  issues:
  - severity: medium
    issue: τῇ ἀληθείᾳ的句法关系被改作独立的“持守真理”。
    rationale: ἀκολουθέω通常支配与格；此处τῇ ἀληθείᾳ最直接地是“跟随／遵从”的对象。将其另立为“持守”虽可通顺，却改变了原文的动词关系。
  - severity: medium
    issue: “遵行主的诫命”将ἀκολουθοῦντες接到“诫命”上。
    rationale: 原文“主的诫命”为τὰς ἐντολὰς的宾格，适合作Προσέχετε的对象；“真理”为与格，适合作ἀκολουθοῦντες的补足语。应在中文中反映这一结构。
  revised_text: 所以，我的孩子们，你们也要谨守主的诫命，专一地遵从真理。
