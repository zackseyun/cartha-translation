  text: Therefore take heed, you also, my children, following the commandments of the Lord with singleness of purpose, in truth.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们也要谨守主的诫命，专一地遵从真理。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: 要谨慎
  rationale: 该词在此是劝诫语气，含“留意、警醒、谨慎行事”之意；译为“要谨慎”自然且保留其警戒力度。
- source_word: τὰς ἐντολὰς Κυρίου
  choice: 主的诫命
  rationale: 直接对应“主的命令／诫命”，采用现代中文宗教文献中清楚而庄重的常用表达。
- source_word: μονοπροσώπως
  choice: 专一地
  rationale: 此副词强调方向或意向单一、不三心二意；“专一地”简洁自然，也不额外限定为某种宗派性的内在状态。
- source_word: ἀκολουθοῦντες
  choice: 遵行
  rationale: 字面有“跟随”之意，但其宾语为“诫命”时，现代汉语以“遵行诫命”更自然，并准确表达按诫命而行。
- source_word: τῇ ἀληθείᾳ
  choice: 持守真理
  rationale: 原文短语与前面的分词结构关系略显紧凑，可理解为“在真理中／按真理”；正文用“持守真理”传达忠于真理的行为取向，同时保持句子可读性。
theological_decisions:
- issue: τῇ ἀληθείᾳ 与 ἀκολουθοῦντες 的句法关系
  choice: 将其表达为并列的行为要求“持守真理”
  alternative: “在真理中专一地遵行主的诫命”或“专一地跟随真理”
  rationale: 希腊文可容许“真理”作为遵循的领域或对象，英语审校层也保留了“in truth”的张力。中文若机械译作“在真理中”较生硬，因此采用“持守真理”，不把它解释成单纯的“真诚地”，以免消解“真理”的实体性含义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“所以”承接上文；“我的孩子们”保留亲切的训诲称呼；整体避免古奥措辞及宗派化术语。
