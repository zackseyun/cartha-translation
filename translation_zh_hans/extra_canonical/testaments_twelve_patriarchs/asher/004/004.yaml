base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/004.yaml
  text: Another does not wish to see good days with the wasteful, lest he disgrace the body and defile the soul. Even though this is double-faced, yet it is wholly good.
translation:
  language: zh_hans
  text: 另一个人不愿与放荡的人一同享受好日子，免得使身体蒙羞、玷污灵魂。即便这有两面性，却完全是好的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: 享受好日子
  rationale: 此处字面为“看见好日子”，是经历、享有美好生活的惯用表达；译为“享受好日子”更符合现代汉语。
- source_word: ἀσώτων
  choice: 放荡的人
  rationale: ἄσωτος 可指生活放纵、挥霍无度的人；上下文涉及身体与灵魂所受的败坏，“放荡”较能涵盖其道德意味，同时不把含义限于浪费钱财。
- source_word: αἰσχράνει
  choice: 羞辱
  rationale: 该词与“使之可耻、蒙羞”有关，区别于后面的“玷污”，故保留两个动词的语义差异。
- source_word: μολυνεῖ
  choice: 玷污
  rationale: 准确表达污染、使不洁的含义，并保持其作用对象为“灵魂”。
- source_word: διπρόσωπον
  choice: 双面的
  rationale: 直译为“双面”或“两副面孔”；本段把行为评为兼具两面，保留这一较为突兀且可能有专门含义的说法，不擅自解释成“虚伪”。
- source_word: ὅλον δὲ καλόν
  choice: 却完全是好的
  rationale: 保留 ὅλον 的整体性强调以及 δέ 的转折关系。
theological_decisions:
- issue: “双面的”与“完全是好的”之间的张力
  choice: 保留两者并置，不将“双面的”改释为负面的“虚伪”
  alternative: 译作“虽然这看似两面讨好，却仍全然良善”或直接解释其两面所指
  rationale: 希腊文本本身在 διπρόσωπον 与 ὅλον…καλόν 之间形成张力；译文应保留该张力，避免代替作者解决其含义。
- issue: 身体与灵魂是否带有人称领属
  choice: 译作“身体、灵魂”，不补“自己的”
  alternative: 译作“自己的身体和灵魂”
  rationale: 原文使用定冠词而无明确领属代词；中文在语境中已可自然理解其所指，故不额外限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法尽量贴近希腊文的两句结构，并以“羞辱／玷污”区分原文两个动词。未设脚注，因此正文无脚注标记。
