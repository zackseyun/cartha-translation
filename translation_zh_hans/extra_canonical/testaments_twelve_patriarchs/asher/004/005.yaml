source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Οἱ γὰρ τοιοῦτοι³⁴ δορκάσι³⁵ καὶ ἐλάφοις³⁶ *εἰσὶν ὅμοιοι³⁷, ὅτι ἐν ἤθει ἀγρίων³⁸ δοκοῦσιν ἀκάθαρτοι εἶναι, *τὸ δὲ πᾶν³⁹ καθαροί εἰσιν³⁹, ὅτι ἐν ζήλῳ Κυρίου⁴⁰ ⌈πορεύονται⌉, ἀπεχόμενοι *ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει⁴¹, *ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ⁴².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/005.yaml
  text: 'For such men are like gazelles and deer: though in the manner of wild animals they seem to be unclean, yet in every way they are clean, because they walk in zeal for the Lord, abstaining from what God also hates and forbids through the commandments, keeping evil away from good.'
translation:
  language: zh_hans
  text: 因为这样的人好像羚羊和鹿：照野兽的习性来说，他们似乎是不洁净的；但在各方面都是洁净的，因为他们为主热心而行，远避上帝也借着诫命所憎恶并禁止的事，使恶远离善。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάσι καὶ ἐλάφοις
  choice: 羚羊和鹿
  rationale: 分别以现代汉语常用动物名称表达，保留原文并列的比喻。
- source_word: ἐν ἤθει ἀγρίων
  choice: 按野兽的习性看来
  rationale: ἦθος在此指习性或行为方式；补入“看来”使其自然连接δοκοῦσιν，同时避免误解为外貌。
- source_word: τὸ δὲ πᾶν
  choice: 但总体而言
  rationale: 此短语字面意义有一定含混，可指整体上或完全；译文保留整体判断，不强化为毫无例外的“各方面”。
- source_word: ἐν ζήλῳ Κυρίου
  choice: 怀着对主的热忱
  rationale: ζῆλος可表示热忱、热心；属格Κυρίου可能有主观或客观关系，此处按语境译为对主的热忱，但不加入宗派性解释。
- source_word: ἀπεχόμενοι
  choice: 远避
  rationale: 表达主动克制、避开之义，符合现代中文宗教伦理语境。
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: 使恶与善隔绝
  rationale: 保留ἀπείργω所表达的阻隔、隔离关系，也保留“恶”与“善”的张力；不擅自解释为抑制善中的恶。
theological_decisions:
- issue: “洁净”与野兽习性的对照
  choice: 保留礼仪与道德双重联想，不解释“不洁净”的具体性质
  alternative: 明确解释为礼仪上的不洁净或道德上的污秽
  rationale: 原文以动物比喻并使用ἀκάθαρτοι/καθαροί，可能同时唤起礼仪分类和伦理评价，故不应单方面限定。
- issue: ἐν ζήλῳ Κυρίου的属格关系
  choice: 译作“对主的热忱”
  alternative: 译作“主所赐的热忱”或“主的忌邪”
  rationale: 上下文描述人的行事与禁戒，客观属格较顺畅；但不延伸为特定恩典论或神属性教义。
- issue: 末句善恶关系
  choice: 译作“使恶与善隔绝”
  alternative: “阻止恶侵入善”或“使善脱离恶”
  rationale: 希腊文直接表达把恶从善那里隔开；采用关系中性的表述，避免补出原文没有明说的方向和机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“主”“上帝”“诫命”“洁净”等经教文献中的通行词汇；通过分号和“但”清楚呈现原文的表象与实质对照。
