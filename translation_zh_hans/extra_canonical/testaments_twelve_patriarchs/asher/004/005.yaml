revisions:
- from: 因为这样的人好像羚羊和鹿：按野兽的习性看来，他们似乎是不洁净的；但总体而言，他们是洁净的，因为他们怀着对主的热忱而行，远避上帝所憎恶、并借着诫命禁止的事，使恶与善隔绝。
  to: 因为这样的人好像羚羊和鹿：照野兽的习性来说，他们似乎是不洁净的；但在各方面都是洁净的，因为他们为主热心而行，远避上帝也借着诫命所憎恶并禁止的事，使恶远离善。
  rationale: 修订“总体而言”为“在各方面”，以保留原文的全面性；修订末句为“使恶远离善”，以呈现原文中阻止恶靠近善的方向。其余措辞仅作轻微顺序调整，使现代书面汉语更顺畅。
