  text: And many, in doing away with the wicked, do two things, good and evil; yet the whole is good, because he has uprooted and destroyed the evil.
translation:
  language: zh_hans
  text: 许多人除掉恶人时，做两件事：善事和恶事；但整体而言是善的，因为他已将恶连根拔起并毁灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιροῦντες τοὺς πονηρούς
  choice: 除掉恶人
  rationale: ἀναιρέω 在此表示除去、消灭；保留原文以“恶人”为直接对象的表述，不弱化为仅仅制止恶行。
- source_word: δύο ποιοῦσιν ἔργα καλοῦ τε καὶ κακοῦ
  choice: 做了善恶两方面的事
  rationale: 自然呈现“两个/两类作为”兼具善与恶的张力，同时避免生硬的“做两个工作”。
- source_word: τὸ δὲ ὅλον καλόν
  choice: 但整体而言是善的
  rationale: ὅλον 指整体结果或整件事；“整体而言”既通顺，也不把判断限定为动机或手段。
- source_word: ἐκριζώσας ἀπώλεσεν
  choice: 连根拔除，消灭了
  rationale: 分别体现 ἐκριζόω 的“连根拔起”和 ἀπόλλυμι 的“毁灭、除灭”，保留原文递进而近义并列的力度。
theological_decisions:
- issue: 以恶的层面作为手段而整体被称为善
  choice: 保留“善恶两方面”与“整体而言是善的”之间的伦理张力
  alternative: 解释为表面似恶而其实全善，或明确断言手段之恶因结果而合理
  rationale: 原文直接并列善与恶，却又评定整体为善；译文不替作者消解这一张力，也不额外建立目的论伦理原则。
- issue: 末句分词的主语由复数转为单数
  choice: 译作“因为他……”
  alternative: 按意义顺译为“因为他们……”或改成无主句“因为恶已被连根拔除”
  rationale: 希腊文由 πολλοί/ποιοῦσιν 的复数转为 ἐκριζώσας 的阳性单数。采用单数以保存现存文本的语法突变及其潜在个体化表达，与咨询层一致。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“除掉”保留行动的严厉含义；“整体而言”使论证关系清楚，但不扩写作者未明说的伦理解释。原文校勘符号所示异文未提供具体读法，因此正文不设置无法说明内容的脚注。
