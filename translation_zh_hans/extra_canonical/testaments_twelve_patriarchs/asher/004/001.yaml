base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/001.yaml
  text: For good men, being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God.
translation:
  language: zh_hans
  text: 善人心口如一，即使那些心口不一的人认为他们在犯罪，他们在上帝面前仍是义人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοὶ ἄνθρωποι
  choice: 善人
  rationale: 简洁对应“善良的人”，符合本句格言式语气。
- source_word: μονοπρόσωποι
  choice: 心口如一
  rationale: 原义为“单一面孔的”，与下文“有两副面孔的”形成伦理对照；用现代汉语表达真诚一致、不虚伪的含义。
- source_word: διπροσώπων
  choice: 心口不一的人
  rationale: 原义为“双面的人”，指虚伪、言行或内外不一者；与“心口如一”保持对称。
- source_word: ἁμαρτάνειν
  choice: 在犯罪
  rationale: 保留明确的罪责性用语，不弱化为一般的“做错事”。
- source_word: δίκαιοί εἰσι παρὰ τῷ Θεῷ
  choice: 在上帝面前仍是义人
  rationale: “在上帝面前”自然传达 παρὰ τῷ Θεῷ 的评价视角；“义人”保留 δικαίοι 的神学和司法色彩。“仍”显明让步关系，但不增加新的教义判断。
theological_decisions:
- issue: 人的负面判断与上帝的判断之间的张力
  choice: 保留“认为他们在犯罪”与“在上帝面前仍是义人”的直接对照
  alternative: 解释为善人的行为只是被误解，并明确断言他们并未犯罪
  rationale: 原文只说他们被双面者认为在犯罪，继而称他们在上帝面前为义；不进一步解释具体行为或义的根据，以保留原有张力。
translation_notes:
  register: 采用现代、庄重而通俗的格言式表达。“心口如一／心口不一”比直译“单面／双面”更自然，同时保存原文的鲜明对照。
