  text: '*Ἔστι τις μισῶν¹³ τὸν ἐλεήμονα καὶ ἄδικον¹⁴, ⌜καὶ⌝¹⁵ τὸν μοιχὸν καὶ¹⁶ νηστεύοντα¹⁷, *καὶ αὐτό ἐστι διπρόσωπον¹⁸, ἀλλὰ ⌈τὸ πᾶν⌉ ἔργον ἀγαθόν¹⁹, ὅτι μιμεῖται²⁰ Κύριον, μὴ²¹ †προσδοκώμενος²² τὸ δοκοῦν καλὸν †μετὰ²³ *τοῦ ἀληθινοῦ²⁴ καλοῦ²⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/003.yaml
  text: There is one who hates the merciful and the unjust, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what seems good along with what is truly good.
translation:
  language: zh_hans
  text: 有人恨恶有怜悯心的人和不义之人，也恨恶行奸淫的人和禁食的人。这种做法也是两面三刀的；但这整个行为是好的，因为他效法主，并不把那看似为善的事与真正的善一同期待。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的希腊文本在“期待”（προσδοκώμενος）和“与”（μετά）等处有传抄及句法疑难。按现存文字，直译为“不把那看似为善的事与真正的善一同期待”；其确切含义不能确定。
    reason: 底本以剑号标出相关词语为文本困难。注释说明问题所在，并保留现存读法所能支持的最低限度译法，避免把含义解释为“把貌似的善当作真实的善”等更确定的主张。
lexical_decisions:
- source_word: ἐλεήμονα
  choice: 怜悯人的
  rationale: 保留形容词名词化的指人用法，表达有怜悯、施怜悯的人，不缩窄为单一的施舍行为。
- source_word: διπρόσωπον
  choice: 两面性
  rationale: 直译其“两张脸”的比喻含义，同时以现代汉语自然表达此处对同一人兼恨善恶两类对象的评述。
- source_word: τὸ πᾶν ἔργον
  choice: 整个行为
  rationale: 保留原文对整体行动的判断；不擅自解释为人的全部生活或动机。
- source_word: μιμεῖται Κύριον
  choice: 效法主
  rationale: “效法”准确传达 μιμεῖται；Κύριον 保持原文无冠词而在语境中作为称号的“主”。
- source_word: τὸ δοκοῦν καλὸν
  choice: 那看似好的
  rationale: δοκοῦν 表示呈现为、被认为是；译文保留表象与真实之间的对照。
- source_word: τοῦ ἀληθινοῦ καλοῦ
  choice: 真正的善
  rationale: 以“善”表达名词化的 καλόν，并与前面的“看似好的”形成原文所具有的张力。
theological_decisions:
- issue: “效法主”如何使这一整体行为被称为善
  choice: 不补充主恨恶恶人或区别善恶等解释
  alternative: 译成“因为他像主一样恨恶恶事”
  rationale: 原文只说“因为他效法主”，其逻辑关系较为突兀；译文保留这一神学张力，不加入原文没有明说的对象或方式。
- issue: 末句中表面之善与真实之善的关系
  choice: 译为“不期待那看似好的与真正的善相伴”并加文本说明
  alternative: 解释为“不把貌似的善当作真正的善”或“不接受真假善混在一起”
  rationale: 现存希腊文语法和措辞均有疑难，不能稳妥支持更明确的教义性或伦理性释义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“既……也……”显明原文并列的四类对象；保留“两面性”“整个行为是好的”等略显反常的表述，以免消解文本本身的伦理张力。
