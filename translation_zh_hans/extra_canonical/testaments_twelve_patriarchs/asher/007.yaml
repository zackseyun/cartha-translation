lexical_decisions:
- source_word: ἠγνόησε
  choice: 不认识
  rationale: 既可指“不知道”，也可指“未认出、未承认”。“不认识”保留这种语义空间，并与后文“不再知道”形成呼应。
- source_word: ἀπώλετο ἕως αἰῶνος
  choice: 永远灭亡了
  rationale: 保留 εἰς/ἕως αἰῶνος 所表达的永久性判断，同时采用自然凝练的现代汉语。
- source_word: τὰ ἅγια
  choice: 圣所
  rationale: 中性复数可指“圣物”或“圣地、圣所”。在土地荒废的审判语境中，“圣所”较自然，但不把它具体限定为某一座建筑。
- source_word: εἰς διασπορὰν
  choice: 在流散之地
  rationale: διασπορά 可指分散的状态，也可指散居处境；此译法承接前面的“分散”，避免汉语机械重复。
- source_word: ὁ ὕψιστος ἐπισκέψηται
  choice: 至高者眷顾
  rationale: ἐπισκέπτομαι 在此不仅是“探访”，也含介入、施行拯救之意；“眷顾”保留经文体庄重感，又不预先细化介入方式。
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  choice: 击碎巨龙的头
  rationale: συντρίβω 表示打碎、击溃；δράκων 明确是“巨龙”，不弱化为“蛇”。“击碎……的头”保留强烈的胜利意象。
- source_word: ὑποκρινόμενος
  choice: 显作
  rationale: 该词可指扮演、假扮或呈现某种角色。直译“假扮”会过强引入欺骗意味；“显作”较简洁地保留外显为人的表层意思，而不将其规范化为后期教义术语。
- source_word: ἀπειθήσωσιν / ἀπειθήσετε
  choice: 不顺从／悖逆
  rationale: 该词兼有不听从和违抗之意。第4节按劝诫语境译为“不顺从”，第5节以“悖逆”传达反复、加重的先知性指责。
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: 一再行不敬虔的事
  rationale: 希腊语以同源分词和动词强化动作。汉语用“一再”再现强调，避免生硬重复“行不敬虔而不敬虔”。
- source_word: νόμῳ θεοῦ
  choice: 上帝的律法
  rationale: 在犹太遗训语境中，“律法”准确保留其宗教和盟约含义；不泛化为普通“教导”。
- source_word: κακίᾳ διαφθειρόμενοι
  choice: 被邪恶腐蚀
  rationale: 保留道德败坏的被动过程；“邪恶”比“恶意”范围更广，符合上下文。
- source_word: ἀγνοήσετε
  choice: 不再知道
  rationale: 直译“不知道”，并以“不再”自然表达流散导致与土地、支派、语言疏离的语境，不把含义扩写为身份完全丧失。
- source_word: ἐν πίστει
  choice: 在信心中
  rationale: πίστις 可指信心、信实或忠信。“在信心中”保留介词结构及神学开放性，并以脚注提示另一可能。
- source_word: ἐπισυνάξει
  choice: 重新聚集
  rationale: 该动词有聚拢、召集之意；“重新”在汉语中自然承接先前的分散，传达复兴图景。
theological_decisions:
- issue: θεὸς εἰς ἄνδρα ὑποκρινόμενος 的文本地位与含义
  choice: 正文以方括号译作“[上帝显作人]”，并附文本说明
  alternative: 删去疑似增补；或译作“上帝扮作人／假扮成人”
  rationale: 所据希腊文本本身将该语置于方括号内，表明文本存疑。保留并加方括号，既不掩盖见证文本，也不把它无标记地纳入正文；“显作”避免额外断定欺骗意味。
- issue: 第3节拯救者的指代
  choice: 保留为“他”
  alternative: 明确译成“至高者”“上帝”或“救主”
  rationale: 希腊语 οὗτος 只说“这位／他”，上下文虽与“至高者”相连，但正文不另加称号，以免超出原文明确程度。
- issue: ὡς ἄνθρωπος μετὰ ἀνθρώπων ἐσθίων καὶ πίνων 的表达
  choice: “他亲自来到，成为人，与人一同吃喝”
  alternative: “像人一样来到，在人中吃喝”
  rationale: ὡς 可表达“作为／如同”，本句本身具有神学张力。“成为人”在现代汉语中较顺畅，但不进一步采用“道成肉身”等后期术语；后面的存疑短语仍以方括号保留。
- issue: 第7节聚集者的身份
  choice: 译作“他必……重新聚集”，不照英语咨询层补出“主”
  alternative: “主必重新聚集你们”
  rationale: 希腊原文只有隐含的第三人称主语，没有 κύριος。依原文优先原则，不补入明确神名。
- issue: ἐν πίστει 的神学范围
  choice: “在信心中”并注出“在忠信中”
  alternative: “凭信心”或“在忠信中”
  rationale: 介词 ἐν 与 πίστις 的含义都容许多种理解。正文避免定死为得救手段或单纯人的德行，脚注保留另一合理读法。
- issue: 分散与聚集的盟约主题
  choice: 正文保持审判—复兴的叙事顺序，脚注说明其经文背景
  alternative: 在正文中扩写为“盟约的审判与复兴”
  rationale: 主题确实存在，但原文未使用“盟约”一词，因此只在脚注指出呼应，不把解释加入正文。
translation_notes:
  register: 采用现代标准普通话与简体中文，整体庄重但避免古奥。保留遗训体中的父辈劝诫口吻，以及预言段落的反复和力度。神名统一译为“上帝”；κύριος 出现处译“主”，无 κύριος 处不从英语咨询文本补入。“所多玛、迦得、但、亚伯拉罕、以撒、雅各”等沿用现代中文圣经传统中通行的专名。
