  - severity: medium
    issue: 第5节误连“因人的诫命而被邪恶腐蚀”。
    rationale: ἀλλ᾽ ἐντολαῖς ἀνθρώπων与“上帝的律法”构成对比；κακίᾳ διαφθειρόμενοι表达因邪恶而败坏。中文须避免将“人的诫命”译成腐蚀的语法原因。
  - severity: low
    issue: 第7节“重新聚集”增添原文未明言的时间副词。
    rationale: ἐπισυνάξει意为“聚集、召聚”；虽在流散—复兴语境中可推知恢复，正文仍宜不增译。
  - severity: low
    issue: “上帝显作人”略显生硬且非现代标准汉语常用表达。
    rationale: 可用“上帝以人的样式出现”使语句自然，同时以方括号及脚注说明其存疑文本地位和ὑποκρινόμενος的复杂语义。
