    rationale: διπρόσωποι 的字面意象是“双面／两张脸”，但本段语境指在善恶之间分裂、两边摇摆的人；“心怀二意的人”较自然，脚注可保存字面意象。
  - severity: low
    issue: “与他们同类之人”不够自然，代词所指也可稍作明确。
    rationale: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις 指“与他们相似的人”，其中“他们”回指前述双面者。
  - severity: low
    issue: 彼列脚注的“邪恶势力之首”略带超出本句所需的界定。
    rationale: 原文仅使用 Βελίαρ 这一专名；以“与邪恶相关的专名”说明即可，避免对其身份作过度定论。
