  naturalness: “两面的人”虽可理解，但现代汉语中略不自然，且“与他们同类之人”搭配生硬。改为“心怀二意的人”及“与他们相似的人”更符合现代标准汉语，同时脚注保留原文“两张脸”的意象。
  terminology: 保留“主上帝”“彼列”“不属于上帝”“作……的奴仆”等译法。将彼列脚注改为较审慎的说明，不将这一专名不必要地界定为单一、确定的邪恶首领身份。
  issues:
  - severity: low
