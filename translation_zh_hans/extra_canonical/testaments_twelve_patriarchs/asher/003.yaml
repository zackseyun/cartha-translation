  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003.yaml
  text: But you, my children, do not become double-faced like them, with both goodness and wickedness; rather cling to goodness alone, because the Lord God rests in it, and people long for it. But flee wickedness, destroying its scheme by your good deeds; for the double-faced are not of God, but serve their own desires, so that they may please Beliar.
translation:
  language: zh_hans
  text: '第三章


    1 孩子们，你们却不要像他们那样，成为兼有善与恶、心怀二意的人[a]；要单单紧紧依附于善，因为主上帝安歇在善中，人们也渴慕善。2 你们要逃避恶，借着你们的善行除掉恶的计谋；因为心怀二意的人不属于上帝，反倒服事自己的私欲，为要讨彼列[b]和与他们相似之人的喜悦。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心怀二意的人”对应原文“有两张脸的人”，指在善与恶之间分裂、两边摇摆的人。
    reason: 保留原文的双面意象，并说明其在本段中的道德语境，避免现代读者仅理解为口是心非。
  - marker: b
    text: “彼列”是古代犹太文献中与邪恶相关的一个专名。
    reason: 解释较少见的专名，同时不把它直接替换或等同于其他名称。
lexical_decisions:
- source_word: διπρόσωποι
  choice: 两面的人
  rationale: 直译为“有两张脸的人”，在本段指同时趋向善恶、表里或立场不一的人。“两面的人”保留面孔意象，也符合现代汉语表达。
- source_word: κολλήθητε
  choice: 紧紧持守
  rationale: 原词有黏附、紧贴之意；“紧紧持守”自然表达持续依附于善，同时保留命令的力度。
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: 安歇在善中
  rationale: 保留原文中上帝“安歇于”善的具象说法，不改释为较抽象的“喜爱”或“悦纳”。
- source_word: τὸ διαβούλιον
  choice: 恶的计谋
  rationale: 该词表示谋划、盘算或计策；依上下文，所有格意义指向“恶”，译为“恶的计谋”清楚而不弱化其人格化色彩。
- source_word: ἀναιροῦντες
  choice: 破除
  rationale: 原词在此有除掉、废除之意；“破除”与“计谋”搭配自然，并体现善行使恶计失效。
- source_word: δουλεύουσιν
  choice: 作……的奴仆
  rationale: 保留“受奴役、服事”的强烈含义，比单译“顺从”更贴近原文。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用汉语宗教文献中常见的音译，并以脚注简要说明其所指。
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: 与他们同类之人
  rationale: 此短语见于希腊文，虽英语咨询层省略，仍按原文译出；“他们”自然回指前述两面的人。
theological_decisions:
- issue: “主上帝安歇在善中”的神学性拟人表达
  choice: 保留“安歇在善中”
  alternative: 译为“主上帝喜爱善”或“主上帝悦纳善”
  rationale: 原文明确使用“安歇”而非一般的喜爱或悦纳；保留该表达可避免以解释取代文本，并维持其神学张力。
- issue: “不属于上帝”的归属判断
  choice: 不属于上帝
  alternative: 不是上帝所造的或不是属神的人
  rationale: τοῦ Θεοῦ 表达归属关系；译文不进一步界定其指创造、盟约身份还是道德归属，以保留原文的开放性。
- issue: 彼列的身份
  choice: 正文保留专名“彼列”，脚注仅作宽泛说明
  alternative: 直接译为“魔鬼”或“撒但”
  rationale: 原文使用专名 Βελίαρ；不把它无提示地等同于另一专名，可避免过度解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“孩子们”保留父亲临终训诲的亲近语气；命令句使用“不要”“只要”“要”，清晰有力。正文按原文译出英语咨询层遗漏的“和与他们同类之人”。
