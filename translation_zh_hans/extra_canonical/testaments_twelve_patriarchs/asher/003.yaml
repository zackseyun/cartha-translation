revisions:
- from: '第三章


    1 孩子们，你们却不要像他们那样，既行善又作恶，成为两面的人[a]；你们只要紧紧持守善，因为主上帝安歇在善中，众人也渴慕善。2 你们要逃避恶，以自己的善行破除恶的计谋；因为两面的人不属于上帝，反倒作自己欲望的奴仆，为要讨彼列[b]和与他们同类之人的喜悦。'
  to: '第三章


    1 孩子们，你们却不要像他们那样，成为兼有善与恶、心怀二意的人[a]；要单单紧紧依附于善，因为主上帝安歇在善中，人们也渴慕善。2 你们要逃避恶，借着你们的善行除掉恶的计谋；因为心怀二意的人不属于上帝，反倒服事自己的私欲，为要讨彼列[b]和与他们相似之人的喜悦。'
  rationale: 修订仅为提高现代汉语的自然度并更贴近原文句法：“兼有善与恶”对应 ἀγαθότητος καὶ κακίας，“单单紧紧依附于”保留 μόνῃ 与 κολλήθητε 的排他性和紧贴感；结尾明确译出希腊文本中的“和与他们相似的人”。未改变原文的神学归属判断或彼列这一专名。
