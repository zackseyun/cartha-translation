source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Τὴν ⌜δὲ⌝ κακίαν ἀποδράσατε¹⁰, ἀναιροῦντες *τὸ διαβούλιον¹¹ ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι, ὅτι οἱ διπρόσωποι *οὐκ εἰσὶ τοῦ Θεοῦ¹², ἀλλὰ ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν, ἵνα τῷ Βελίαρ ἀρέσωσιν, καὶ τοῖς ὁμοίοις¹³ αὐτῶν ἀνθρώποις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/002.yaml
  text: But flee wickedness, destroying its plan by your good deeds; for the double-faced are not of God, but are enslaved to their own desires, so that they may please Beliar[b].
translation:
  language: zh_hans
  text: 但你们要逃避邪恶，以自己的善行破除邪恶的图谋；因为表里不一的人不属上帝，反而受自己的欲望奴役，为要讨贝利亚尔[a]和与他们相似之人的欢心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贝利亚尔”是这个名字的希腊语形式；此名也常译作“彼列”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κακίαν
  choice: 邪恶
  rationale: 此处指应当逃避的恶，译作“邪恶”既涵盖恶行，也保留其较宽泛的道德含义。
- source_word: ἀποδράσατε
  choice: 逃避
  rationale: 该动词带有逃离、躲开的力度；“逃避”自然传达主动远离邪恶的命令。
- source_word: τὸ διαβούλιον
  choice: 邪恶的图谋
  rationale: 名词指谋划、计谋；结合上文，以“邪恶的”明确其所指，但不把计谋具体化。
- source_word: ἀναιροῦντες
  choice: 破除
  rationale: 该词可指除去、消灭；“破除”与“图谋”搭配自然，并保留使其失效的含义。
- source_word: διπρόσωποι
  choice: 两面的人
  rationale: 按字面保留“双面”的人格隐喻，同时避免现代政治色彩较重的“两面派”。
- source_word: ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν
  choice: 受自己的欲望奴役
  rationale: δουλεύω表达作奴仆、受奴役，而非一般性的“服从”；“欲望”保留ἐπιθυμία在此处的宽泛贬义。
- source_word: Βελίαρ
  choice: 贝利亚尔
  rationale: 依希腊语形式音译，并以脚注说明其与通常译作“彼列”的名称之间的关系。
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: 与他们相似之人
  rationale: 原文明确包含这一并列对象，故予以保留；代词所指不在译文中擅自限定。
theological_decisions:
- issue: οὐκ εἰσὶ τοῦ Θεοῦ所表达的归属关系
  choice: 不属上帝
  alternative: 不是出于上帝
  rationale: 属格结构可涉及归属或来源；“不属上帝”最直接，也保留身份与归属层面的张力。
- issue: 欲望与奴役的关系
  choice: 受自己的欲望奴役
  alternative: 服侍自己的欲望
  rationale: 采用较强的奴役措辞以反映δουλεύουσιν，但不进一步解释这种奴役的神学机制。
- issue: ἵνα从句的功能
  choice: 为要讨……欢心
  alternative: 以致讨……欢心
  rationale: ἵνα通常表达目的；译作“为要”保留行为取向，不将其弱化为单纯结果。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“但你们要”承接原文转折并明确复数受众；保留“两面”的原文意象和末尾“与他们相似之人”这一英文咨询层遗漏的成分。
