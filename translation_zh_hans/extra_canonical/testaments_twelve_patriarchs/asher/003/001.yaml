  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/001.yaml
  text: But you, my children, do not become double-faced[a] like them, in goodness and wickedness, but cling to goodness alone, because the Lord God rests in it, and people long for it.
translation:
  language: zh_hans
  text: 但你们，我的孩子们，不要像他们那样成为善恶两面的[a]人；要紧紧持守良善，因为主上帝安歇在良善之中，人也渴慕良善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“有两副面孔的人”。希腊语描绘的是在良善与邪恶之间分裂的道德人格，不只是待人虚伪。
    reason: lexical_alternative
lexical_decisions:
- source_word: διπρόσωποι
  choice: 双面人
  rationale: 直译其“双面”的形象，并由上下文“善恶两面”说明这是道德人格的分裂，不只指待人虚伪。
- source_word: κολλήθητε
  choice: 持守
  rationale: 表达紧紧依附、不离弃之意；现代中文自然庄重，也保留命令语气。
- source_word: ἀναπαύεται ἐν
  choice: 安歇在……之中
  rationale: 保留原文“安歇”及介词结构的形象，不改写为较强的神学解释。
- source_word: ποθοῦσιν
  choice: 渴慕
  rationale: 体现强烈的向往与追求，比一般的“喜欢”更符合原词力度。
theological_decisions:
- issue: 上帝“安歇在良善之中”的含义
  choice: 按原文保留“主上帝安歇在良善之中”
  alternative: 主上帝喜悦良善
  rationale: “喜悦”虽较易懂，却会解释性地消除ἀναπαύεται的安歇意象；正文保留原有神学张力。
- issue: 末尾两个阴性代词αὐτῇ／αὐτήν的所指
  choice: 两处均明说“良善”
  alternative: 使用“其中／它”
  rationale: 语法上都回指阴性名词ἀγαθότητι（良善）；中文重复名词可避免代词指向含混，同时不增加原文没有的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“但你们，我的孩子们”保留原文转折与直接呼告；“做善恶两面的双面人”尽量保留希腊语的双面意象及其道德对照。
