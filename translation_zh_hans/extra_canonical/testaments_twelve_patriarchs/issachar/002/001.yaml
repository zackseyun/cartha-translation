  text: II. Τότε Γοὖν¹ ὤφθη τῷ² Ἰακώβ³ Γἄγγελος Κυρίου καὶ εἶπε λέγων⁴, *ὅτι τέκνα τέξει Ῥαχήλ⁵, *ἐπειδὴ κατέπτυσεν⁶ συνουσίαν⁷ ἀνδρὸς καὶ ἐξελέξατο τὴν⁸ ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/001.yaml
  text: Then an angel of the Lord appeared to Jacob, saying, “Rachel will bear children, because she despised intercourse with a husband and chose self-control.”
translation:
  language: zh_hans
  text: 那时，有一位主的天使向雅各显现，对他说：“拉结将生儿女，因为她鄙弃与丈夫同房，选择了自制。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  choice: 主的一位天使
  rationale: 保留不定指的“一位”，并自然表达属格“主的”；不将其特定化为“主的使者”。
- source_word: τέκνα τέξει
  choice: 必生儿女
  rationale: τέκνα为不定数目的复数“孩子/儿女”，原文没有可靠的数词，因此不译作“两个孩子”。“必”体现将来时。
- source_word: κατέπτυσεν
  choice: 轻看
  rationale: 该动词本义可指“唾弃、鄙弃”；此处译作“轻看”既保留负面评价，又避免现代汉语中“唾弃”可能产生的过强或字面化效果。
- source_word: συνουσίαν ἀνδρός
  choice: 与丈夫同房
  rationale: 在此婚姻语境中，συνουσία指性交或夫妻结合；“与丈夫同房”自然、庄重，并保留ἀνδρός可能指“丈夫”的意义。
- source_word: ἐγκράτειαν
  choice: 节制
  rationale: 该词表示自制、克制，尤其与前述性关系相对；“节制”保留其伦理意味，不额外解释为禁欲誓愿。
theological_decisions:
- issue: 拉结生育与其选择节制之间的因果关系
  choice: 以“因为”直接保留原文的因果陈述
  alternative: 弱化为“鉴于”或解释为对某一行为的奖赏
  rationale: ἐπειδή明确引出原因；译文不替文本化解其叙事或神学张力，也不增添奖赏机制。
- issue: ἄγγελος Κυρίου是否应特定化
  choice: 译为“主的一位天使”
  alternative: “主的使者”或将其理解为神自己的显现
  rationale: 希腊文没有定冠词，文本本身不要求把这位天使等同于特定神圣位格。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“那时……显现，说”贴近希腊句法但符合现代汉语；“同房”比直译“交合”更自然，也避免口语粗俗。
