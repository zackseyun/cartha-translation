revisions:
- from: 如果我母亲利亚没有拿那两个果子换取同房，她本来还会生八个儿子；因此，她生了六个，拉结生了那两个——因为主借着曼德拉草眷顾了她。
  to: 如果我母亲利亚没有拿那两个果子换取同房，她本会生八个儿子；因此，她生了六个，拉结生了那两个儿子——因为主在曼德拉草的事上眷顾了她。
  rationale: 删去“还”以消除“额外八个”的歧义；将末句改为“在曼德拉草的事上”，保留希腊语ἐν的开放关系；补出“儿子”以使汉语指称自然明确。其余措辞保留原稿的简洁与叙事语体。
