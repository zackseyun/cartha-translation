  text: And had Leah my mother not given over the two fruits in exchange for intercourse, she would have been about to bear eight sons; for this reason she bore six, and Rachel bore the two — because in the mandrakes the Lord visited her.
translation:
  language: zh_hans
  text: 如果我母亲利亚没有拿那两个果子换取同房，她本会生八个儿子；因此，她生了六个，拉结生了那两个儿子——因为主在曼德拉草的事上眷顾了她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ συνουσίας ἀπέδοτο
  choice: 拿……换取同房
  rationale: 保留交换关系，并以现代汉语自然表达夫妻同寝的含义；不额外指定主动同房者。
- source_word: τὰ δύο μῆλα
  choice: 那两个果子
  rationale: 直译为“两个果子”，避免擅自把它与后文曼德拉草完全等同；“那”承接叙事中已知的果子。
- source_word: ἔμελλε τεκεῖν
  choice: 本来还会生
  rationale: 表达反事实条件下预期会发生的生育，同时保留校勘文本中“还”的语意。
- source_word: μανδραγόροις
  choice: 曼德拉草
  rationale: 采用该植物名称的通行现代音意译，保留古代叙事中的具体植物指称。
- source_word: ἐπεσκέψατο
  choice: 眷顾
  rationale: 在生育语境中既表达神主动临到并施恩，也不把动作窄化为单纯“使怀孕”。
theological_decisions:
- issue: 主与曼德拉草之间的关系
  choice: 主借着曼德拉草眷顾了她
  alternative: 主在曼德拉草的事上眷顾了她／主因曼德拉草眷顾了她
  rationale: 希腊语ἐν τοῖς μανδραγόροις可表示媒介、处境或关联；正文采用自然但不过度强调植物自身效力的“借着”，仍保留主是行动主体。
- issue: “她”所指为何人
  choice: 保留代词“她”，按近邻理解指拉结
  alternative: 明说“拉结”
  rationale: 原文使用代词，语法与上下文自然指向拉结；保留原文形式，不作不必要的显化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“同房”清楚但不粗俗；分号和破折号保留原句的因果推进及末尾解释。
