  text: '1[a]. See then, as you see: I am one hundred and twenty-six years old, and I am not conscious of committing any sin unto death. 2. Except for my wife, I have not known another woman. I did not commit sexual immorality with wandering eyes. 3. I did not drink wine for deception[b], and I did not desire anything of my neighbor. 4. No deceit came to be in my heart, and no lie went up through my lips. 5. I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth. 6. I loved the Lord with all my strength, and likewise I loved every person with all my heart, more than my children. 7. You also, my children, do these things, and every spirit of Beliar will flee from you, and no deed of wicked people will rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who walks with people in simplicity of heart. 8. And after saying these things he commanded his sons to carry him up
    to Hebron and bury him there with his fathers in the cave. 9. And stretching out his feet, he fell asleep in a good old age, sound in every limb and strong[d][c], and slept the eternal sleep.'
translation:
  language: zh_hans
  text: '《以萨迦遗训》第7章


    1 所以，看哪，正如你们所见，我如今一百二十六岁；我不觉察自己犯过任何导致死亡的罪。[a]


    2 除了我的妻子，我未曾与别的女人有过性关系。我也未曾因眼目游移而行淫乱。


    3 我没有为迷惑而饮酒，[b]也没有贪图邻舍任何可欲之物。


    4 诡诈从未进入我的心，谎言也从未从我的嘴唇发出。


    5 每逢有人受苦，我都与他一同叹息；我也把自己的饼分给穷人。我一生行事敬虔，持守真实。[c]


    6 我全心爱主，也全心爱每一个人，胜过爱自己的儿女。


    7 我的孩子们，你们也要这样行。这样，贝利亚尔[d]的一切邪灵都必逃离你们，恶人的任何作为都不能辖制你们；你们还要制伏一切野兽，因为天地的神与你们同在。他以纯一的心与人同行。[e]


    8 说完这些话，他吩咐儿子们把他带到希伯仑，葬在那里，与他的祖先同葬。


    9 随后，他伸直双脚，在美好的晚年安睡，进入永恒的睡眠。[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译为：“我不知道自己里面有任何导致死亡的罪。”这里的“知道”带有自我省察、自觉的意味。
    reason: lexical_alternative
  - marker: b
    text: “为迷惑而饮酒”也可理解为“饮酒以致受迷惑”或“饮酒使人误入歧途”；原文没有明确说明迷惑的具体对象或后果。
    reason: lexical_alternative
  - marker: c
    text: “真实”也可译作“真理”或“忠实”；原词的含义不限于事实上的正确。
    reason: lexical_alternative
  - marker: d
    text: “贝利亚尔”依照这里的希腊语形式音译；有些传统将这个名字写作“彼列”。
    reason: alternative_reading
  - marker: e
    text: “以纯一的心与人同行”中的“纯一”也可理解为描述与神同行之人的状态，即“与心地纯一的人同行”。希腊文明确以“天地的神”为“同行”的主体。
    reason: alternative_reading
  - marker: f
    text: 本译文依据所给希腊正文。有些文本形态把结语写成“他在美好的晚年去世”，另有扩展说他四肢健全、身体强壮。
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων ἐν ἐμοὶ ἁμαρτίαν εἰς θάνατον
  choice: 我不觉察自己犯过任何导致死亡的罪
  rationale: ἔγνων在这里带有自我省察的意味；“不觉察自己犯过”保留见证式陈述，又不把经文强化为绝对无罪。“导致死亡”直译εἰς θάνατον，避免引入后世固定的教义术语。
- source_word: Πλὴν τῆς συμβίου μου οὐκ ἔγνων ἄλλην
  choice: 除了我的妻子，我未曾与别的女人有过关系
  rationale: γινώσκω在此为委婉的性关系用语；现代汉语若直译“认识”容易误解，故译明其语境含义。
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: 因眼目游移
  rationale: 该短语可表达眼目浮动、游移或欲念驱使的观看；“眼目游移”既自然，也保留原文形象。
- source_word: οἶνον εἰς ἀποπλάνησιν
  choice: 喝酒使自己迷乱
  rationale: ἀποπλάνησις有被引离正道、迷惑或迷乱之意；此译在饮酒语境中通顺，同时以脚注保留“受迷惑／误入歧途”的可能范围。
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: 邻舍任何可欲之物
  rationale: ἐπιθύμημα可指所欲求、可贪恋之物；译文保留与“贪图”相应的诫命式措辞，而不局限为某一类财物。
- source_word: συνεστέναξα
  choice: 与他一同叹息
  rationale: 复合动词强调共同呻吟、共同承受痛苦，比一般的“同情”更具体。
- source_word: Εὐσέβειαν ἐποίησα
  choice: 行事敬虔
  rationale: 避免生硬直译“实行敬虔”，以现代庄重汉语表达持续的虔敬生活。
- source_word: Ἀλήθειαν ἐφύλαξα
  choice: 持守真实
  rationale: ἀλήθεια既可偏向真理，也可指真实、忠实；“持守真实”保留较宽语义，并以脚注说明。
- source_word: Βελίαρ
  choice: 贝利亚尔
  rationale: 按本段希腊形式音译，而不直接规范化为较常见的“彼列”。
- source_word: ὕπνον αἰώνιον
  choice: 永恒的睡眠
  rationale: 保留原文以睡眠比喻死亡的表达，不改写为直接的“去世”。
theological_decisions:
- issue: 以萨迦对自身罪的陈述强度
  choice: 译为“不觉察自己犯过任何导致死亡的罪”
  alternative: “我不知道自己里面有导致死亡的罪”或“我没有犯过致死的罪”
  rationale: 原文兼有自我认知和“导致死亡”这一限定；所选译法避免将其扩展成绝对无罪宣称，也不削弱其道德见证。
- issue: 第6节“全心”所修饰的对象
  choice: “我全心爱主和每一个人”
  alternative: “我爱主，也全心爱每一个人”
  rationale: 希腊语把“主”和“每一个人”并列为爱的对象，而“全心”位于并列结构之后；译文让它自然地涵盖两者，但不增添原文未见的“尽力”。
- issue: 第7节“在心地纯一中”与谁相关
  choice: 保留较开放的表达“他在心地纯一中与人同行”
  alternative: “他与心地纯一的人同行”或“他以纯一的心与人同行”
  rationale: 希腊语分词明确以神为同行者，但“心地纯一”可以理解为同行的方式，也可能描述与神同行之人的状态；正文不强行判定，脚注列出可能理解。
- issue: 结尾死亡叙述的文本形态
  choice: 依据所给希腊正文译作“在美好的晚年安睡，进入永恒的睡眠”
  alternative: 加入“肢体健全、强壮”等扩展，或仅作“在美好的晚年去世”
  rationale: 所给底本文字没有肢体健全、强壮的扩展；将异文放入脚注，不混入正文。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。正文保留遗训体的第一人称见证和对儿女的劝诫。“主”“天地的神”“敬虔”等沿用普通读者熟悉的宗教语汇；对性关系、贪欲和死亡的表达清楚但不粗俗。第8—9节严格依据所给希腊正文，没有纳入英文咨询层中的“洞穴”及“肢体健全、强壮”等扩展。
