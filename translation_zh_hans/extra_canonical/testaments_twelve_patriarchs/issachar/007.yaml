  - severity: medium
    issue: 第6节的“全心”与比较语范围稍显含混。
    rationale: ἐξ ὅλης τῆς καρδίας μου与“爱主和每一个人”的并列对象相关，ὑπὲρ τὰ τέκνα μου则表达这种爱超过对儿女的爱。重组句子可更清楚地保留这一结构。
  - severity: low
    issue: 第7节“离开你们逃走”重复，“他在心地纯一中与人同行”略显不自然。
    rationale: φεύξεται ἀφ᾽ ὑμῶν只需译为“逃离你们”。分词συμπορευόμενον明确以“天地的神”为同行者；“以纯一的心与人同行”是自然的正文表达，脚注保留“纯一”究竟修饰何者的可能性。
