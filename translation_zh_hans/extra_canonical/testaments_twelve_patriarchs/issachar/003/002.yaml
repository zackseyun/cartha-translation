  text: And my father blessed me, seeing that I walked in simplicity before him.
translation:
  language: zh_hans
  text: 我父亲见我在他面前以纯一的心行事，就祝福我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ηὐλόγει
  choice: 祝福
  rationale: 采用未完成时所表达的叙事性动作；汉语不强行标出持续或反复，以免添加原文未明确限定的时体信息。
- source_word: ἐν ἁπλότητι
  choice: 以纯一的心
  rationale: ἁπλότης在此指内心单纯、诚实、不怀二心；“纯一的心”既保留伦理含义，也避免把它弱化为天真或头脑简单。
- source_word: πορεύομαι
  choice: 行事
  rationale: 该动词字面为“行走”，在伦理语境中指生活与行为方式；译作“行事”较符合现代汉语。
- source_word: ἔμπροσθεν αὐτοῦ
  choice: 在他面前
  rationale: 保留空间隐喻及关系性意味，不将其解释性改写为“在他看来”或“对他”。
theological_decisions:
- issue: ἁπλότης的伦理含义
  choice: 纯一的心
  alternative: 单纯／正直
  rationale: 原词可涵盖单纯、真诚与不怀二心；译文保留这种语义张力，不把它限定为某一特定德性或宗派概念。
- issue: βλέπων所引原因或伴随情形
  choice: 见我……就祝福我
  alternative: 我父亲祝福我，因为他看见……
  rationale: 分词可表达伴随观察并隐含原因；“见……就……”自然呈现两者关系，同时避免将逻辑关系规定得过强。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句法依据所给希腊文本，将“ἐν ἁπλότητι πορεύομαι ἔμπροσθεν αὐτοῦ”视为一个完整分句；不采纳修订记录中基于“ἐν ... ἥμην”的拆句，因为该词组并未出现在本次提供的希腊原文中。
