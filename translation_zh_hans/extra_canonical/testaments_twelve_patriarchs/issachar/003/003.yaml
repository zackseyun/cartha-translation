base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/003.yaml
  text: And I am not meddlesome in my actions, nor envious and malicious toward my neighbor.
translation:
  language: zh_hans
  text: 我做事不多管闲事，也不嫉妒邻舍，不对邻舍怀有恶意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίεργος ἐν ταῖς πράξεσίν μου
  choice: 我做事不多管闲事
  rationale: περίεργος 指越界干预、好管闲事；以自然现代汉语表达，同时保留“在我的行为中”的范围。
- source_word: φθονερός
  choice: 嫉妒
  rationale: 准确表达因他人所有或所得而生的嫉妒之意。
- source_word: βάσκανος
  choice: 怀恶意
  rationale: 该词可指恶毒、妒害或以恶眼相看；此处与 φθονερός 并列，译作“怀恶意”可避免与“嫉妒”重复，又不引入特定民俗解释。
- source_word: τῷ πλησίον μου
  choice: 对邻舍
  rationale: 保留 πλησίον 的伦理关系用语；“邻舍”在庄重而通俗的经教文体中清楚自然。
theological_decisions:
- issue: φθονερός 与 βάσκανος 的并列关系
  choice: 分别译为“不嫉妒，不怀恶意”
  alternative: 合并译为“不怀嫉妒和恶意”
  rationale: 原文用两个并列形容词，分别翻译可保留其三项品格陈述：不多管闲事、不嫉妒、不怀恶意，而不把后两项压缩成一个概念。
translation_notes:
  register: 采用现代、简洁而庄重的第一人称陈述。按所给希腊文本的现在时 εἰμί 译为“我……不……”，不改作过去时。
