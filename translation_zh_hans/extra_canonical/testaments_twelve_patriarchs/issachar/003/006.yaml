  rationale: 将“常常”改为“总是”，以完整反映πάντοτε；将“一切头生的”微调为“凡头生的”，改善现代汉语表达而保留原文的类别歧义。保留“献给我父亲”，不把省略的第二个动词解释成分配祭物或馈赠。
