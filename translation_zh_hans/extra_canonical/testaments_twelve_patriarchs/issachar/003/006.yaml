  text: And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father.
translation:
  language: zh_hans
  text: 我父亲总是因我的纯朴而欢喜；因为凡头生的，我都通过祭司献给主，然后也献给我父亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: 常常
  rationale: 在此表达持续、惯常的喜悦；现代汉语中“常常”自然，也避免把上下文未必要求的绝对频率说得过强。
- source_word: ἁπλότητί
  choice: 纯朴
  rationale: 保留“单纯、诚实、不复杂”的正面含义，且符合父亲因此欢喜的语境。
- source_word: πᾶν πρῶτον γέννημα
  choice: 一切头生的
  rationale: 采用祭献语境中通行而庄重的表达，并保留原文未明确限定人或牲畜的概括性。
- source_word: διὰ τοῦ ἱερέως
  choice: 经由祭司
  rationale: 忠实表达 διά 加属格所表示的中介关系，不把祭司误写为祭物的接受者。
- source_word: προσέφερον
  choice: 献给
  rationale: 符合祭献语境；同一动词支配“主”和“我父亲”，中文保留这一平行结构。
theological_decisions:
- issue: “献给我父亲”与祭献给主之间的关系
  choice: 然后也献给我父亲
  alternative: 然后也给我父亲一份
  rationale: 原文省略了第二个 προσέφερον，但语法上承接同一动词；译文保留其张力，不擅自解释为分配祭物或另送礼物。
- issue: 头生之物经祭司献上的礼仪表述
  choice: 经由祭司献给主
  alternative: 由祭司献给主
  rationale: “经由”更清楚保留行动主体是说话者、祭司充当中介这一语法关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句法尽量贴近希腊文的因果与先后结构，同时避免生硬直译；不添加原文没有的礼仪解释。
