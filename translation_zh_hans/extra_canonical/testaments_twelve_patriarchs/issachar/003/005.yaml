  text: At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman's pleasure; rather, because of my toil, sleep came over me.
translation:
  language: zh_hans
  text: 三十五岁时，我为自己娶了妻，因为劳作消耗了我的精力；我没有想到女人的欢愉，反而因劳苦，睡意压过了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβον ἐμαυτῷ γυναῖκα
  choice: 我为自己娶了妻
  rationale: 按闪语背景下希腊语“为自己取一个女人”的惯用含义自然译为娶妻，同时保留ἐμαυτῷ所表达的“为自己”。
- source_word: ὁ κάματος κατήσθιε τὴν ἰσχύν μου
  choice: 劳作耗尽了我的精力
  rationale: κατεσθίω字面为“吞吃”，此处喻指持续消耗；“耗尽”符合现代汉语，又保留强烈程度。
- source_word: ἡδονὴν γυναικός
  choice: 女人的欢愉
  rationale: 该短语可指女人所带来的欢愉，也可能涉及与女人有关的性欢愉；采用较贴近原文且不过度解释的表达，保留其含混性。
- source_word: διὰ τοῦ κόπου ὁ ὕπνος μοι περιεγένετο
  choice: 反倒因劳苦而沉沉入睡
  rationale: περιεγένετο在此表示睡意占了上风或临到说话者；译作“沉沉入睡”以自然汉语呈现劳累导致睡眠压倒其他欲念的语境。
theological_decisions:
- issue: 禁欲色彩与婚姻观
  choice: 不把“不想着女人的欢愉”解释为对婚姻或性本身的否定
  alternative: 译成“我不贪恋女色”或“我没有肉欲”
  rationale: 原文只是陈述说话者未以这种欢愉为念，并将原因关联于劳苦和睡眠；加入道德贬义会强化原文没有明说的禁欲教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“反倒”清楚呈现ἀλλά的转折；不保留原文版本校勘用的上标数字，因为它们并非经文脚注内容。
