review_pass:
  verdict: revise
  source_fidelity: 原文先说劳作持续消耗说话者的力量，继而说他没有想到“女人的欢愉”，最后以ἀλλά转折：由于辛劳，睡眠（或睡意）胜过／压倒了他。草稿总体把握准确，但“沉沉入睡”把“睡眠胜过我”的主语与压倒意味弱化为单纯的入睡状态。
  naturalness: 草稿整体自然、庄重。“我并不想着”略带口语习惯；“我没有想到”在此更贴近ἐνενόουν，也更适合叙述体。“睡意压过了我”既自然，又保留原文睡眠占上风的形象。
  terminology: “为自己娶了妻”准确表达ἔλαβον ἐμαυτῷ γυναῖκα；“女人的欢愉”保留属格可能所指的含混性，不应擅自译成“肉欲”或“贪恋女色”。“劳作／劳苦”可分别对应κάματος／κόπος。
  issues:
