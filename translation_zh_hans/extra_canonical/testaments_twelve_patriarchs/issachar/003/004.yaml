  text: 我从未说过任何人的坏话，也从未批评过任何人的生活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάλησά
  choice: 说……的坏话
  rationale: καταλαλέω表示在背后或以贬损方式议论、毁谤；此处采用自然且不过度限定为法律意义“诽谤”的表达。
- source_word: ἔψεξα
  choice: 指责
  rationale: ψέγω意为责难、非议或批评；“指责”保留其负面评断的力度。
- source_word: βίον ἀνθρώπου
  choice: 谁的生活
  rationale: βίος可指人的生活、生活方式或人生；原文未进一步限定，译文用“生活”保留其宽泛性，并以“谁”自然表达ἀνθρώπου的泛指意义。
