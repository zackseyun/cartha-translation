  - severity: low
    issue: “增至万倍”略有数量关系歧义
    rationale: ἐμυριοπλασίασε表达使之成为十万倍／万倍的倍增；“增为万倍”更直接，避免被理解为仅增加“万倍数量”。
  - severity: low
