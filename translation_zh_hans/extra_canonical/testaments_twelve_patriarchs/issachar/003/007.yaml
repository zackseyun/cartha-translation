source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. Καὶ ὁ⁴⁵ Κύριος ἐμυριοπλασίασε⁴⁶ τὰ ἀγαθὰ ⌜ἐν ταῖς χερσί⁴⁷ μου· ᾔδει δὲ καὶ Ἰακὼβ *ὁ πατήρ μου⁴⁸, ὅτι ὁ Θεὸς συνεργεῖ⁴⁸ τῇ ἁπλότητί μου⌝. *Πάντα γὰρ πένησι καὶ θλιβομένοις⁴⁹ παρεῖχον *ἐκ τῶν ἀγαθῶν τῆς γῆς⁵⁰ ἐν ἁπλότητι καρδίας μου⁵¹˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/007.yaml
  text: And the Lord multiplied the good things ten thousandfold in my hands; and Jacob my father also knew that God was working together with my simplicity. For I provided to all the poor and afflicted from the good things of the earth, in the simplicity of my heart.
translation:
  language: zh_hans
  text: 主使我手中的好东西增为万倍；我父亲雅各也知道，上帝与我的纯朴一同作工。因为我以纯朴的心，把土地所出的好出产供给所有贫穷和受苦的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμυριοπλασίασε
  choice: 增至万倍
  rationale: 保留动词所含的巨大倍增意象；较“增加许多”更贴近词形，也比生硬的“万倍化”自然。
- source_word: τὰ ἀγαθὰ
  choice: 美物
  rationale: 此处结合后文“地里的美物”，指土地所出的各样好东西或出产；“美物”保留其宽泛性。
- source_word: συνεργεῖ
  choice: 同工
  rationale: 直接表达“一同作工、协力”的含义，并保留上帝与人的纯朴之间略显张力的原文措辞。
- source_word: ἁπλότης / ἁπλότης καρδίας
  choice: 纯朴／纯朴的心
  rationale: 涵盖单纯、真诚、不诡诈之义，不把词义收窄为某一种道德解释。
- source_word: πένησι καὶ θλιβομένοις
  choice: 贫穷和受苦的人
  rationale: 分别呈现经济困乏与遭受患难的两类描述。
- source_word: ἐκ τῶν ἀγαθῶν τῆς γῆς
  choice: 把地里的美物
  rationale: 自然表达“从土地的美物中拿出”的来源关系，并与παρεῖχον构成流畅汉语。
theological_decisions:
- issue: 上帝与人的纯朴“同工”
  choice: 保留“上帝与我的纯朴同工”
  alternative: 上帝因我的纯朴而帮助我
  rationale: 希腊文συνεργεῖ与与格τῇ ἁπλότητί μου直译具有“与……同工／协力”的可能；不擅自改写成明确的因果或奖赏关系。
- issue: Κύριος与Θεός的称谓区分
  choice: 分别译为“主”与“上帝”
  alternative: 两者均译为“上帝”
  rationale: 保留原文在同一节中使用的不同称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。译文以现存希腊文本为准；未采纳最新英文修订中“每次果实收成”及“父亲使美物加倍”等内容，因为所给希腊文并无这些分句，反而明确写作雅各知道上帝与说话者的纯朴同工。
