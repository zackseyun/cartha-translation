  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/001.yaml
  text: When therefore I grew up, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers, and I brought in fruits from the fields in their season.
translation:
  language: zh_hans
  text: 因此，孩子们，我长大后，就以正直的心行事，成为为父亲和兄弟们务农的人，并在适当的时节从田里带回收成。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: 长大以后
  rationale: 此处指人成长成熟；用现代汉语“长大”自然表达，而不额外限定为身体或心智成熟。
- source_word: ἐπορεύθην ἐν εὐθύτητι καρδίας
  choice: 存着正直的心行事
  rationale: 保留“心的正直”这一内在品格与外在生活方式的联系；“行事”自然对应希腊语的行走隐喻。
- source_word: γεωργός
  choice: 耕种
  rationale: 在“成为……的农夫”与后文田间收成的语境中，用动词表达其务农劳作，更符合现代汉语习惯。
- source_word: τῷ πατρί μου καὶ τοῖς ἀδελφοῖς μου
  choice: 替父亲和兄弟们
  rationale: 与格表示其劳作所服务或惠及的对象；“替”简洁自然，不把关系强化为雇佣。
- source_word: ἔφερον καρπούς
  choice: 收取出产
  rationale: καρπούς 在农田语境中泛指收成或出产，不局限于树上果实；ἔφερον 含带回、收进之意。
- source_word: κατὰ καιρὸν αὐτῶν
  choice: 按时
  rationale: 表达各样田产依其适当季节收取；中文无需机械保留复数代词。
theological_decisions:
- issue: “正直的心”与行为的关系
  choice: 存着正直的心行事
  alternative: 以纯朴的心生活
  rationale: εὐθύτης 首先是正直、端正；译文保留伦理意义，同时不将其解释成特定神学意义上的“纯一”或“单纯”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留父亲对孩子们训诲的称呼，并将希腊语较生硬的农业表述调整为现代读者易懂的句式。
