base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/005.yaml
  text: These were fragrant fruits, which grow in the land of Haran below a watercourse.
translation:
  language: zh_hans
  text: 这些果子[a]气味芬芳，生长在哈兰地一条水道的下方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “果子”：原文用词也可特指“苹果”。
    reason: 提示μῆλα的词义范围，避免正文把植物种类定得过窄。
lexical_decisions:
- source_word: μῆλα
  choice: 果子
  rationale: μῆλον可指苹果，也可较宽泛地指果实；本段语境所指植物并非普通苹果，因此正文采用不加限定的“果子”，保留原词的指称弹性。
- source_word: εὔοσμα
  choice: 气味芬芳
  rationale: 准确表达“有香气、芳香的”，并采用自然庄重的现代汉语。
- source_word: ἐν τῇ γῇ Χαράν
  choice: 在哈兰地
  rationale: 按地名结构直译，清楚自然。
- source_word: ὑποκάτω φάραγγος ὑδάτων
  choice: 一条水道的下方
  rationale: ὑποκάτω明确表示“在……下方”；φάραγξ ὑδάτων字面带有水流经过的沟谷意象，“水道”在中文中简洁表达有水流的天然通道，同时避免误定其具体地貌。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“气味芬芳”比“芳香的果子”略为舒展，也避免连续修饰造成生硬；保留“下方”的空间关系，不擅自改释为“下游”或“沟中”。
