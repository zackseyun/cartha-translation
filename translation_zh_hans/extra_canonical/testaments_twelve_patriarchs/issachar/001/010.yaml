base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/010.yaml
  text: And Rachel said, “Do not boast, nor glorify yourself, for he was joined to me before you, and because of me he served our father fourteen years.”
translation:
  language: zh_hans
  text: 拉结说：“不要夸口，也不要荣耀自己，因为他先与我订婚；因我的缘故，他服侍我们的父亲十四年。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καυχῶ
  choice: 夸口
  rationale: 对应自夸、 boast 的常见含义，并保持责备语气。
- source_word: δόξαζε σεαυτήν
  choice: 荣耀自己
  rationale: 较直接地保留原文“使自己得荣耀”的表达，避免缩减为与前项完全同义的“自夸”。
- source_word: ἡρμόσατο
  choice: 订了婚
  rationale: 该动词在婚姻语境中可指许配、缔结婚约；这里译为“订了婚”比泛泛的“结合”更自然，也保留婚约含义。
- source_word: δι᾽ ἐμὲ
  choice: 为了我
  rationale: 表达雅各服侍十四年的缘由或目的，符合上下文。
- source_word: ἐδούλευσε
  choice: 服侍
  rationale: 保留为他人劳作、服役的含义，也与传统叙事措辞协调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；两个并列禁令均予保留，并以分号清楚呈现婚约先后与十四年服侍之间的关系。
