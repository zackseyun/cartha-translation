base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/015.yaml
  text: And Jacob knew Leah, and she conceived and bore me; and because of this — the wages — I was called Issachar.
translation:
  language: zh_hans
  text: 雅各与利亚同房，她就怀孕，生了我；因此，因这“报酬”，我被称为以萨迦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以萨迦”这一名字在这里与“报酬”相联系；参创世记30:16—18。
    reason: 原文以μισθός（报酬）说明命名缘由；脚注帮助现代读者看出正文中的文字关联，而不在正文中强行给出有争议的词源分析。
lexical_decisions:
- source_word: ἔγνω
  choice: 与……同房
  rationale: 希腊语直译为“认识”，在此承接创世记叙事，是指夫妻发生性关系的委婉说法；译出实际含义更符合现代汉语，同时保持庄重。
- source_word: συλλαβοῦσα ἔτεκεν ἐμέ
  choice: 她就怀孕，生了我
  rationale: 准确保留两个连续动作以及第一人称“我”。
- source_word: τὸν μισθὸν
  choice: “报酬”
  rationale: μισθός意为工资、酬劳或报酬；此处与“以萨迦”的得名相联，并呼应创世记30:18，故采用自然且涵盖面较广的“报酬”。
- source_word: ἐκλήθην Ἰσαχάρ
  choice: 我便得名以萨迦
  rationale: 被动式ἐκλήθην表达“被称为／得名”；“得名”自然体现命名缘由。
theological_decisions:
- issue: “雅各认识利亚”的性关系委婉语
  choice: 正文译为“雅各与利亚同房”
  alternative: “雅各认识利亚”
  rationale: 现代汉语中的“认识”不会自然传达原文语境中的夫妻结合，直译容易造成误解；“同房”忠实表达原文含义而不增添解释。
- issue: διὰ τούτου与τὸν μισθὸν的关系
  choice: 译为“因为这事关乎‘报酬’”
  alternative: “因为这报酬”或“因此，我被称为报酬——以萨迦”
  rationale: 希腊文表达较为压缩，英文审校层也以破折号突出“报酬”。此译保留“这事”与“报酬”之间的关联，却不把以萨迦的名字直接等同于普通名词“报酬”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“同房”清楚而含蓄；以引号标出“报酬”，提示命名叙事中的关键词。保留原文由受孕、生育到命名的叙事顺序。
