lexical_decisions:
- source_word: Ἔκλαιε
  choice: 哭了起来
  rationale: 未完成时描写当时持续发生的哭泣；汉语用“哭了起来”自然引入这一场景。
- source_word: ἐπὶ τῇ φωνῇ αὐτοῦ
  choice: 听见他的哭声
  rationale: 该介词短语表示利亚因听见他的声音而出来；在哭泣语境中译作“哭声”比泛称“声音”更自然。
- source_word: ἐξῆλθεν
  choice: 走了出来
  rationale: 保留“从里面出来”的空间动作，同时符合现代汉语叙事习惯。
- source_word: Λεία ἡ μήτηρ μου
  choice: 我母亲利亚
  rationale: 保留叙述者与利亚的亲属关系，并按自然汉语语序表达同位关系。
