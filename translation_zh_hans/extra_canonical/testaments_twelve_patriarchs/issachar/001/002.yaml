  text: I was born as the fifth son to Jacob, as the wages for the mandrakes.
translation:
  language: zh_hans
  text: 我是雅各的第五个儿子；我出生，是作为风茄的酬价。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参《创世记》30:14–18：利亚以流便所得的风茄换取与雅各同寝的机会，后来生了以萨迦。
    reason: 原文高度浓缩地援引风茄事件；脚注提供理解“酬价”所需的叙事背景，而不把解释增写进正文。
lexical_decisions:
- source_word: Ἐγὼ ἐτέχθην
  choice: 我是……出生的
  rationale: 以自然的现代汉语表达第一人称被动出生陈述，同时保留原文对“我”的强调。
- source_word: πέμπτος υἱὸς τῷ Ἰακώβ
  choice: 雅各的第五个儿子
  rationale: 按希腊文与《创世记》叙事中的亲子关系理解与格 τῷ Ἰακώβ；汉语用领属结构最自然。
- source_word: ἐν μισθῷ
  choice: 作为……的报酬
  rationale: 保留 μισθός 的交易、酬价意象，不弱化为笼统的“因为”。
- source_word: τῶν μανδραγόρων
  choice: 风茄
  rationale: μανδραγόρα指 mandrake；“风茄”是现代中文圣经语境中可辨识的植物名称。
theological_decisions:
- issue: “风茄的报酬”与出生之间的因果或叙事关系
  choice: 是作为风茄的报酬而出生的
  alternative: 因风茄的酬价而出生
  rationale: 原文 ἐν μισθῷ 可表达报酬或代价关系；译文保留这一略显浓缩的叙事说法，不进一步解释为神的奖赏或单纯的生理因果。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“风茄的报酬”刻意保留原文的交易意象及其神学张力；脚注说明背景。未采纳 latest_revisions 中与本节希腊文完全无关的改文。
