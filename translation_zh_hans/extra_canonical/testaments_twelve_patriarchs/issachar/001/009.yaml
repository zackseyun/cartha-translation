- source_word: ἐμός ἐστιν ὁ Ἰακώβ
  choice: 雅各是我的
  rationale: 保留原文带有归属与争执意味的直述，不弱化为“雅各属于我”以外的解释性表达。
- source_word: γυνὴ νεότητος αὐτοῦ
  choice: 他年轻时所娶的妻子
  rationale: γυνή在此指妻子；属格短语νεότητος αὐτοῦ表示与雅各青年时期相关的婚姻关系。加入“所娶”使现代汉语自然，同时未增添妻子次序等原文未明说的信息。
- source_word: ὅτι
  choice: 因为
  rationale: 明确保留原文的因果关系，符合本句辩论式语境。
