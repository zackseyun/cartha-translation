revisions:
- from: 以萨迦言语的抄本。他召来自己的儿子们，对他们说：“孩子们，要听你们父亲以萨迦的话；要侧耳听这位蒙主所爱之人的言语。”
  to: 以萨迦话语的抄本。他召来自己的儿子们，对他们说：“孩子们，要听从你们的父亲以萨迦；要侧耳听蒙主所爱之人的话。”
  rationale: 修订将首个命令恢复为以“你们的父亲以萨迦”为对象的直接呼告，不预先添加“话”；第二个命令则对应原文明确的“话语”。同时删去无对应的“这位”，并微调标题搭配。未增添该“蒙主所爱之人”的身份或任何神学解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:20:04Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体对应希腊文的标题、召集儿子、两项听取命令及“蒙主所爱”称谓。但“要听你们父亲以萨迦的话”将 ἀκούσατε 的直接对象明确改作“话”，而原文此处直接提到“以萨迦，你们的父亲”；第二个命令才明确以“话语”为对象。应保留这一句法与修辞上的区分。
  naturalness: “以萨迦言语的抄本”略显生硬，“以萨迦话语的抄本”更合现代汉语标题表达。“这位蒙主所爱之人”加入了原文没有的指示语“这位”；删去后既自然，也更好保留原文名词化分词的含蓄指称。
  terminology: “以萨迦”“主”“蒙主所爱之人”“抄本”均可接受。“听从你们的父亲以萨迦”在汉语中自然表达对人的 ἀκούσατε，且不把“话”提前补入原文。
  issues:
  - severity: medium
    issue: 首个“听”的对象被改为“父亲以萨迦的话”。
    rationale: 希腊文 ἀκούσατε 后接的是“孩子们，以萨迦、你们的父亲”，而 ῥήματα（话语）是随后 ἐνωτίσασθε 的对象。译文应避免将两个平行命令的对象合并。
  - severity: low
    issue: “这位”是额外的指示性成分。
    rationale: ἠγαπημένου ὑπὸ Κυρίου 为名词化被动分词，没有对应“这位”的指示词；中文可译作“蒙主所爱之人的话”。
  - severity: low
    issue: 标题中“言语的抄本”搭配不够自然。
    rationale: 改为“话语的抄本”能保留 λόγων 的宽泛意义，同时使现代汉语更顺畅。
  revised_text: 以萨迦话语的抄本。他召来自己的儿子们，对他们说：“孩子们，要听从你们的父亲以萨迦；要侧耳听蒙主所爱之人的话。”
