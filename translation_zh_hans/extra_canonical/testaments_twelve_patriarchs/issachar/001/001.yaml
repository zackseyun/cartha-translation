  text: A copy of the words of Issachar. For he called his sons and said to them, "Listen, children, to Issachar your father; give ear to the words of one beloved by the Lord.
translation:
  language: zh_hans
  text: 以萨迦话语的抄本。他召来自己的儿子们，对他们说：“孩子们，要听从你们的父亲以萨迦；要侧耳听蒙主所爱之人的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 指抄录而成的文本或副本；在标题式短语中译作“抄本”简洁且贴近原义。
- source_word: λόγων
  choice: 言语
  rationale: 保留 λόγος 在此处指所说之话、训言的宽泛含义，并与后文 ῥήματα 呼应。
- source_word: Καλέσας
  choice: 召来
  rationale: 分词在叙事中表示先行动作，即以萨迦把儿子们叫到跟前。
- source_word: ἀκούσατε
  choice: 要听
  rationale: 准确表达复数命令语气，现代汉语自然明白。
- source_word: τέκνα
  choice: 孩子们
  rationale: 作为父亲直接称呼众子，“孩子们”比生硬的“诸子”更符合现代标准普通话，同时保持庄重。
- source_word: ἐνωτίσασθε
  choice: 要侧耳听
  rationale: 保留与前一动词并列的加强性劝告，体现认真留心听取之意。
- source_word: ἠγαπημένου ὑπὸ Κυρίου
  choice: 蒙主所爱之人
  rationale: 保留被动结构和施事者“主”，不额外说明被爱者为何人或这种爱具有何种神学性质。
theological_decisions:
- issue: “蒙主所爱之人”的指称
  choice: 保留第三人称描述，不在正文中明确补成“我”或“你们的父亲”
  alternative: 译为“我这蒙主所爱之人的言语”
  rationale: 希腊文仅有名词化的被动分词 ἠγαπημένου，没有明示第一人称；上下文自然指向以萨迦，但不宜把隐含信息写成明说。
- issue: Κυρίου 的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 原文无冠词且使用通称 Κύριος；“主”既忠实又不引入原文未明确指定的神名形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与训诫语体。标题短语保持简练；引语用“要听……要侧耳听……”呈现希腊文的平行命令。按原文将“你们父亲以萨迦”自然展开为“你们父亲以萨迦的话”，避免中文误读为“以萨迦的父亲”。
