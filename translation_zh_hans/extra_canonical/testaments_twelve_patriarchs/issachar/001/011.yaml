source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 11. *Καὶ εἰ μὴ ὁ δόλος ἐπλήθυνεν ἐπὶ τῆς γῆς καὶ ἡ πονηρία τῶν ἀνθρώπων ἐχώρησεν, οὐκ ἂν εἶ σὺ ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ⁵³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/011.yaml
  text: And had guile not multiplied upon the earth and the wickedness of men advanced, you would not be looking on the face of Jacob.
translation:
  language: zh_hans
  text: 若不是诡诈在地上增多，人的邪恶蔓延开来，你就不会看见雅各的面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόλος
  choice: 诡诈
  rationale: 既保留欺骗、奸诈的道德含义，也符合本句庄重的劝诫语体。
- source_word: ἐπλήθυνεν
  choice: 增多
  rationale: 直接表达数量或程度上的增加，对应原文的动词意义。
- source_word: ἡ πονηρία τῶν ἀνθρώπων
  choice: 人的邪恶
  rationale: 保留属格结构的概括性，不把“人”限缩为某一群体，也不额外解释邪恶的具体形式。
- source_word: ἐχώρησεν
  choice: 蔓延开来
  rationale: 在此与邪恶搭配，表达其推进、扩展之意，比机械译作“前进”更符合现代汉语。
- source_word: ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ
  choice: 看见雅各的面
  rationale: 保留原文“看见……的面”的具体表达，而不简化为仅仅“见到雅各”；同时以自然汉语呈现。
theological_decisions:
- issue: 反事实条件句中诡诈、邪恶与见雅各之面的因果张力
  choice: 按原文保留：“若不是……你就不会……”
  alternative: 改写为“正因为世上诡诈和邪恶增多，你才能见到雅各”
  rationale: 原文以反事实条件句表达，逻辑上带有刻意的道德张力；直陈式改写虽更易懂，却会削弱其修辞形式并加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“雅各的面”这一带有古代语感的原文意象，但其余措辞避免文言化。
