  text: But still, in exchange for the mandrakes I hire out to you one night with Jacob.
translation:
  language: zh_hans
  text: “不过，我还是用曼德拉草作交换，把一夜与雅各同寝的机会租给你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “租给你”直译原文；这里指以曼德拉草为交换条件，让出与雅各同寝一夜的机会。
    reason: 原文刻意采用交易、出租用语；脚注帮助现代读者理解交易对象，同时保留叙事中不寻常的措辞。
lexical_decisions:
- source_word: Ἀλλ᾽ οὖν
  choice: 不过，我还是
  rationale: 保留转折与随后的让步、承接语气；比单纯译作“但是”更能体现组合词的语用力量。
- source_word: ἀντὶ τῶν μανδραγόρων
  choice: 用曼德拉草作交换
  rationale: ἀντί在此表示交换代价；“曼德拉草”是μανδραγόρα的常见现代音意译，且不擅自确定其药用或象征意义。
- source_word: ἐκμισθῶ σοι
  choice: 租给你
  rationale: 保留ἐκμισθόω明确的出租、让渡用语及原文带有交易意味的表达，不弱化为一般的“让给”。
- source_word: μίαν νύκτα τῷ Ἰακώβ
  choice: 与雅各同宿的一夜
  rationale: 按语境自然表达这一夜涉及与雅各同宿；同时避免把“租”的对象误解为雅各本人。
