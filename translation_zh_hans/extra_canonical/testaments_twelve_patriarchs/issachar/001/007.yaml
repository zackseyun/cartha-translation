base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/007.yaml
  text: So there were two fruits. And Leah said to Rachel, “Let it be enough for you that you have taken my husband; will you also take these from me?”
translation:
  language: zh_hans
  text: 于是，有两个果子。利亚对拉结说：“你夺走了我的丈夫，也该知足了；难道连这些也要从我这里拿走吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μῆλα
  choice: 果子
  rationale: μῆλα 可指苹果，也可泛指果实；本句自身没有充分依据限定为“苹果”，因此采用较宽泛的“果子”，保留原文词义空间。
- source_word: Ἱκανούσθω σοι
  choice: 也该知足了
  rationale: 该形式是第三人称命令式，表达“让这对你算够了／你该满足了”，并非单纯的直陈或必然的反问；此译法在现代汉语中自然地保留了劝止兼责备的语气。
- source_word: ἔλαβες τὸν ἄνδρα μου
  choice: 你夺走了我的丈夫
  rationale: ἔλαβες 本义为“拿走、取得”；结合利亚责备拉结的语境，用“夺走”传达其指控意味，同时不额外解释事件性质。
- source_word: μὴ καὶ ταῦτα λήψῃ ἀπ᾿ ἐμοῦ
  choice: 难道连这两个也要从我这里拿走吗
  rationale: μή 引导预期否定回答的疑问；καὶ ταῦτα 表示“连这些也”，而“这两个”承接前句两个果子，使中文指代清楚。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将利亚前一句译为带命令意味的责备“也该知足了”，避免改成纯粹反问；后一句保留原文的反问语气。
