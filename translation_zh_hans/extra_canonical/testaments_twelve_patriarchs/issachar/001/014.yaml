  text: 拉结又接着说：“我要取一个风茄；作为这一颗的交换，我要把他租给你一夜。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μανδραγόρων
  choice: 风茄
  rationale: 指古代近东所称的 mandrake；采用较为通行且简洁的中文植物名。
- source_word: ἐκμισθώσω σοι
  choice: 我把他租给你
  rationale: 保留原文直译所呈现的交易措辞，也保留动词主语是拉结、对象是男性的表达。
- source_word: ἐν τῇ νυκτί
  choice: 过这一夜
  rationale: 按语境自然表达‘在夜间／当夜’，不额外明说原文未明示的性行为。
