  text: 6. Εἶπε δὲ Ῥαχήλ· οὐ δώσω *σοι ταῦτα²⁸, *ἀλλ᾽ ἵνα σχῶ ταῦτα²⁹ ἀντὶ τέκνων· *παρεῖδε γάρ με ὁ Κύριος, καὶ τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/006.yaml
  text: And Rachel said, "I will not give these to you, but I will keep them in exchange for children; for the Lord has overlooked me, and I have borne no children to Jacob."
translation:
  language: zh_hans
  text: 拉结说：“我不把这些给你；我要留下这些，作为孩子的替代，因为主忽略了我，我没有为雅各生过孩子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: 这些
  rationale: 两次均保留近指代词，忠实反映希腊文重复，并维持其所指事物须由上下文确定的特点。
- source_word: ἀντὶ τέκνων
  choice: 拿来代替孩子
  rationale: ἀντί在此自然表达“代替、作为……的替代”；不擅自改写成目的性的“为了得到孩子”。
- source_word: παρεῖδε
  choice: 忽略了
  rationale: παροράω通常有“忽视、越过不顾”之意；结合拉结未生育的申诉语境，“忽略了”比“看顾了”更符合因果关系。
- source_word: τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ
  choice: 我也没有给雅各生过孩子
  rationale: 以现代汉语自然表达与格τῷ Ἰακώβ及完成性陈述，同时不增加原文没有的时间限定。
theological_decisions:
- issue: 主对拉结不育的作为如何表述
  choice: 主忽略了我
  alternative: 主看顾了我
  rationale: 本句将主的行为作为拉结没有生育的解释；“看顾”会与后半句形成未经原文标明的反转或张力，而παρεῖδε在此可直接理解为“忽略、越过不顾”。译文保留这是拉结本人申诉性判断的叙事框架。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“这些”的重复和“代替孩子”的强烈措辞，不用解释性增译消除原文的语义张力。
