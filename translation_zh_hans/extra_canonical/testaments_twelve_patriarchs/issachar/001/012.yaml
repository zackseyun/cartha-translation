base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/012.yaml
  text: But Laban deceived me with guile, and removed me that night, and did not allow Jacob to see me; for if I had been there, this would not have happened to him.
translation:
  language: zh_hans
  text: 但拉班诡诈地欺骗了我，在那一夜把我带离，不让雅各见到我；因为我若在那里，这事就不会发生在他身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ⌜δόλῳ⌝
  choice: 诡诈地
  rationale: δόλος指欺诈、诡计；用副词表达希腊语介词短语的方式含义，既自然又保留其负面色彩。
- source_word: ἠπάτησέ με
  choice: 欺骗了我
  rationale: 直接对应“欺骗、蒙骗”，并保留第一人称受事。
- source_word: μετέστησέ με
  choice: 把我调开
  rationale: μεθίστημι在此表示使人离开原处；“调开”保留拉班主动安排叙述者离场的含义，又不擅自补出具体地点。
- source_word: οὐκ εἴασε τῷ Ἰακὼβ ἰδεῖν με
  choice: 不让雅各见到我
  rationale: 按不定式结构自然译出“没有准许雅各看见我”。
- source_word: τοῦτο αὐτῷ οὐκ ἐγένετο
  choice: 这事就不会临到他
  rationale: 保留τοῦτο所指事件未明的含混性；“临到他”体现αὐτῷ及ἐγένετο的受事意味，不把事件具体化。
theological_decisions:
- issue: 反事实条件句所指事件不明确
  choice: 这事就不会临到他
  alternative: 这事就不会发生在他身上／他就不会遭遇这事
  rationale: 原文τοῦτο没有明确说明具体事件，译文不根据上下文替作者补明，以保留叙事张力与指代含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“诡诈地欺骗”略有语义叠加，但忠实保留原文ἐν δόλῳ与ἠπάτησεν并置的强调。
