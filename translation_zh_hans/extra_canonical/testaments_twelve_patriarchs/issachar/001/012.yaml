  text: 12. ⁵⁴Λαβὰν δὲ⁵⁴ ⁵⁵ἐν ⌜δόλῳ⌝⁵⁵ ⁵⁶ἠπάτησέ⁵⁶ με *⁵⁷καὶ μετέστησέ με τὴν νύκτα ἐκείνην⁷, καὶ⁵⁸ οὐκ εἴασε *Γτῷ Ἰακὼβ ἰδεῖν με, ἐπεί⁷, ἐὰν ἤμην ἐκεῖ⁵⁹, *τοῦτο αὐτῷ οὐκ ἐγένετο⁶⁰.
