  naturalness: 原句整体自然。“拉结迎面遇见他”虽可理解，但“迎上前去见他”更符合现代汉语，也较好表达προσαπαντήσασα所含主动迎见的语气。
  terminology: “流便”“拉结”是现代中文圣经语境中更通行、辨识度更高的译名，宜取代“吕便”。“曼德拉草”可用；脚注恰当地说明该词可指植物或其果实，且未把该歧义强加进正文。
