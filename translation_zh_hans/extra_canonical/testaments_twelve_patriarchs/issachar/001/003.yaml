  text: For Reuben my brother brought mandrakes from the field, and Rachel met him and took them from him.
translation:
  language: zh_hans
  text: 3 因为我哥哥流便从田里带来了曼德拉草[a]，拉结迎上前去见他，就拿走了那些草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “曼德拉草”是一种有芳香果实的植物，古代人常把它与生育能力联系起来；这里也可理解为这种草的果实。
    reason: 解释现代读者可能不熟悉的植物，并保留μανδραγόρους可指植物或果实的语义幅度。
lexical_decisions:
- source_word: Ῥουβὶμ … ὁ ἀδελφός μου
  choice: 我哥哥吕便
  rationale: ἀδελφός本身可泛指兄弟；结合叙事中吕便年长于以萨迦的关系，现代汉语用“哥哥”自然明确，同时保留“我的”这一亲属关系。
- source_word: ἤνεγκεν
  choice: 带回了
  rationale: 表示携带、带来；在“从田里”的语境中，“带回了”比生硬的“拿来了”更符合现代汉语叙事。
- source_word: μανδραγόρους
  choice: 曼德拉草
  rationale: 采用该植物的现代常用名称；希腊词可指这种植物或其果实，因此正文不擅自限定为“果实”。
- source_word: προσαπαντήσασα
  choice: 迎面遇见
  rationale: 保留该复合动词所表达的迎上、相遇之意，且符合自然汉语。
- source_word: ἔλαβεν αὐτούς
  choice: 把那些草拿走了
  rationale: 直译其宾语“它们”；不把英文咨询层中的“from him”写入正文，因为现存希腊文本没有对应的明说成分。
theological_decisions: []
