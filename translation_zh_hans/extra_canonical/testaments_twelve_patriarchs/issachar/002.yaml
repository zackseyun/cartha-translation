    issue: 正文采用了方括号内、文本归属不确定的“再”。
    rationale: 原文的[ἔτι]显示该词并非稳固正文。译作“再生八个儿子”不仅把不确定读法实化，也会使“因此，她只生了六个”的八与六之对比变得不清楚。应以“本会生八个儿子”为正文，并在脚注记录“再／还”的不确定加词。
