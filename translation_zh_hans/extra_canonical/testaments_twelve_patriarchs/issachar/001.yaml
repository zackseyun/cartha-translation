revisions:
- from: '《雅各和利亚第五子以萨迦的遗训》


    1. 以下是以萨迦话语的抄本。他召来自己的众子，对他们说：“你们这些父亲以萨迦的儿女，要听；要侧耳倾听这位蒙主所爱之人的话。


    2. 我生为雅各的第五个儿子，是用曼德拉草换来的酬劳。


    3. 我哥哥吕便从田里带回曼德拉草；拉结迎上他，把草果拿走了。


    4. 吕便哭起来；我母亲利亚听见他的哭声，就出来了。


    5. 这些草果气味芬芳，生长在哈兰地一条水沟的下方。[a]


    6. 拉结说：‘我不给你这些；我要留下它们，代替儿女。因为主忽略了我，我没有给雅各生儿女。’


    7. 那草果共有两个。利亚对拉结说：‘你夺了我的丈夫，还不够吗？连这些也要从我这里拿走吗？’


    8. 拉结对她说：‘那么，今夜就让雅各与你同寝，作为交换你儿子曼德拉草的代价。’


    9. 利亚对她说：‘雅各是我的，因为我是他年轻时所娶的妻子。’


    10. 拉结说：‘不要夸口，也不要自抬身价，因为他在你以前就与我订了婚；他还为了我服侍我们的父亲十四年。


    11. 若不是诡诈在地上增多，人的邪恶蔓延，你就不会见到雅各的面。


    12. 拉班却用诡计欺骗了我，那一夜把我调了包，不让雅各看见我；因为我若在那里，这事就不会临到他。


    13. 不过，我还是用曼德拉草作交换，把与雅各共度的一夜租给你。’


    14. 拉结又接着说：‘我要取一个曼德拉草果；为这一个草果，我就把今夜租给你。’[b]


    15. 那一夜，雅各与利亚同房；利亚怀了孕，生下我。因为这项酬劳，我就取名叫以萨迦。[c]”'
