  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005.yaml
  text: '1 Therefore[a], my children, keep the law of God, and acquire simplicity, and walk in innocence, not meddling in the deeds of your neighbor. 2 But love the Lord and your neighbor; show mercy to the poor and the weak. 3 Set your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving. 4 For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now[b]. 5 For no other portion has been given to you except the richness of the earth in the toils of its fruits. 6 For my father Jacob also blessed me with blessings of the earth and of firstfruits of produce. 7 And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord gave them their inheritance: to Levi, the priesthood; and to Judah, the kingdom. 8 Therefore obey them, and walk in the simplicity of your father[c]. [But to Gad it was given to destroy the marauding raids coming upon Israel.]'
translation:
  language: zh_hans
  text: 1 所以，我的孩子们，要遵守上帝的律法，培养纯朴的品格，以无恶之心行事，不要对邻舍所做的事多管闲事。2 要爱主，也要爱邻舍；要怜悯贫穷和软弱的人。3 要弯下腰来耕作，在各样耕作中劳作，怀着感恩向主献上礼物。4 因为主必在地里出产的初熟果实中赐福给你们，正如他从亚伯直到如今赐福给所有圣洁的人一样[a]。5 因为除了土地的肥美，就是劳苦所得的果实以外，并没有别的份赐给你们[b]。6 我的父亲雅各也曾以土地和初熟果实的福赐福给我。7 利未和犹大在雅各众子中蒙主赐荣耀。主又把他们各自的产业赐给他们：把祭司职分赐给利未，把王权赐给犹大。8 所以，你们要听从他们，并按你们父亲的纯朴而行。[至于迦得，他所得的使命是消灭那些来袭击以色列的劫掠队。][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从亚伯直到如今所有圣洁的人”，可能是指从亚伯开始、其敬拜蒙悦纳的那一系列人；这里仍照希腊文“圣洁的人”翻译。
    reason: cross_reference
  - marker: b
    text: “土地的肥美，就是劳苦所得的果实”较贴近原文浓缩的农业表达；也可直译为“土地的肥美，在果实的劳苦中”。
    reason: lexical_alternative
  - marker: c
    text: 关于迦得的末句在这里与上下文衔接突兀，可能是后加的旁注或位置错乱的一行；因其见于所据希腊文本，仍以方括号译出。
    reason: textual_variant
lexical_decisions:
- source_word: νόμον Θεοῦ
  choice: 上帝的律法
  rationale: 保留属格结构和郑重的遗训语气。
- source_word: ἁπλότητα
  choice: 纯一
  rationale: 本词指不分心、不诡诈而质朴专一的品格；“纯一”既保留主题用语，也避免将其弱化为性格上的“简单”。
- source_word: ἀκακίᾳ
  choice: 无恶之心
  rationale: 表达没有恶意、无害无诈的伦理含义，并与“纯一”相配。
- source_word: μὴ περιαργαζόμενοι τοῦ πλησίον τὰς πράξεις
  choice: 不要干预邻舍的行为
  rationale: 体现对别人所作之事多管闲事、横加介入的含义，同时保持具体的“行为”一词。
- source_word: ἐλεήσατε
  choice: 怜悯
  rationale: 保留命令式的主动伦理要求及其宗教语域。
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν εἰς τὸ γεωργεῖν
  choice: 要躬身耕作
  rationale: 自然地保留以背投入农耕劳作的身体意象。
- source_word: δῶρα μετ᾽ εὐχαριστείας Κυρίῳ προσφέροντες
  choice: 怀着感恩向主献上礼物
  rationale: 兼顾 δῶρα 的“礼物”本义、献呈行为和感恩色彩，不预先限定为某一种祭物。
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: 献上地里出产的初熟果实时
  rationale: 明确保留初熟果实的农耕和敬拜意象；按上下文将介词短语自然表达为献呈初熟果实的场景。
- source_word: τῆς πιότητος τῆς γῆς ἐν πόνοις καρπῶν
  choice: 在劳苦中所得的土地肥美出产
  rationale: 保留“土地的肥美”和劳苦得果实两层意象，同时使艰涩希腊语在中文中可理解。
- source_word: ἁγίους
  choice: 圣洁的人
  rationale: 忠实保留“圣洁”而不改译为“义人”，也避免“圣徒”可能带来的后期教会身份含义。
- source_word: ἐκληροδότησεν αὐτούς
  choice: 把产业赐给他们
  rationale: 保留继承产业的语义，并由后文祭司职分与王权具体说明其内容。
- source_word: τὰ ἐπερχόμενα πειρατήρια
  choice: 来袭击……的劫掠队
  rationale: 按陆上侵袭语境表达武装劫掠者，避免现代“海盗”所带来的海上限定。
theological_decisions:
- issue: 第8节括号内迦得句的文本地位
  choice: 按希腊见证译出，以方括号标示，并加文本注
  alternative: 删去此句，或不加标示地视为上下文原有部分
  rationale: 该句在劝从利未和犹大的语境中突兀，可能是后加旁注或错置文字；但既见于所据希腊文本，故不静默删去。
- issue: “从亚伯直到如今所有圣洁的人”的所指
  choice: 按 ἁγίους 直译为“所有圣洁的人”
  alternative: 解释性译作“所有义人”或“所有蒙悦纳的敬拜者”
  rationale: 原词不是“义人”的直接用词；译文保留其范围和身份上的一定含混，不把可能的敬拜传统解释写进正文。
- issue: 初熟果实与赐福的关系
  choice: 译为“你们献上……时，主必赐福”
  alternative: “主必在初熟果实中赐福给你们”或“主必借着初熟果实赐福”
  rationale: ἐν 的确切关系略有弹性；结合前节献礼语境采用时间/场景表达，但不将其扩展为特定的功德或圣礼机制。
- issue: 利未与犹大的权柄
  choice: 译出“要听从他们”，不进一步限定其制度范围
  alternative: 解释为永久服从某种后期祭司或王室制度
  rationale: 保留遗训正文对祭司职分与王权的并列安排，不导入后期宗派性的权柄理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。劝诫句使用“要”，农业语汇保持具体；对 ἁπλότης 统一采用“纯一”，以呈现本书所强调的质朴、专一和无诡诈。正文脚注标记依实际所注内容重新排列，且全部在正文出现。
