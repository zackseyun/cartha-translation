  text: For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now.
translation:
  language: zh_hans
  text: 因为在地上出产果实的初熟部分，主必赐福给你们，正如他赐福给从亚伯直到如今所有的圣者一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: 在地里出产的初熟果实上
  rationale: 保留介词ἐν与“初熟果实”的献纳语境，同时用现代汉语清楚表达καρπῶν τῆς γῆς。
- source_word: εὐλογήσει ὑμᾶς Κύριος
  choice: 主必赐福给你们
  rationale: 按希腊语将来时译出应许语气，并保留“主”为主语。
- source_word: τοὺς ἁγίους
  choice: 圣者
  rationale: 直译该名词化形容词，不增补“人”“先祖”等原文未明说的身份限定。
- source_word: ἀπὸ Ἀβὲλ ἕως τοῦ νῦν
  choice: 从亚伯直到如今
  rationale: 保留原文的时间范围与起点。
theological_decisions:
- issue: “所有的圣者”所指群体
  choice: 所有的圣者
  alternative: 所有圣洁的人／所有圣徒
  rationale: 原文仅用τοὺς ἁγίους，范围和身份未进一步界定；译文不将其限定为某一特定宗教群体。
- issue: 初熟果实与赐福的关系
  choice: 在……初熟果实上，主必赐福给你们
  alternative: 主必借着……初熟果实赐福给你们
  rationale: 保留ἐν可能表达领域、场合或关联的含混性，避免明确断定为工具关系。
translation_notes:
