  source_fidelity: 译文准确保留了ὅτι的因果连接、将来时εὐλογήσει、“主”为施事者、第二人称复数“你们”，以及“从亚伯直到如今”的时间范围。惟“在……初熟果实上”在汉语中容易被理解为赐福临到果实本身，未能自然承载ἐν在此处所保留的关联／领域意义。
  naturalness: 原句后半自然庄重；但“在地里出产的初熟果实上，主必赐福给你们”搭配生硬，且“地里出产”与“果实”略有语义重复。改为“在地上出产果实的初熟部分，主必赐福给你们”较贴近原句结构，也避免把介词关系擅自定为因果或工具。
  terminology: “主”“初熟部分”“亚伯”“圣者”均可接受。“圣者”恰当地保留τοὺς ἁγίους的名词化及其未明定的群体范围，未引入特定教派用语。
