base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/002.yaml
  text: But love the Lord and your neighbor. Show mercy to the poor and the weak.
translation:
  language: zh_hans
  text: 但你们要爱主，也要爱邻舍。要怜悯贫穷和软弱的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: 要爱
  rationale: 第二人称复数不定过去时命令式，在劝诫语境中自然表达为“你们要爱”；其宾语同时包括主和邻舍。
- source_word: τὸν πλησίον
  choice: 邻舍
  rationale: 保留圣经伦理语境中 πλησίον 的常用译法，指与人相近、应当以爱相待的人。
- source_word: πένητα
  choice: 贫穷的人
  rationale: πένης 通常指生活困窘、资源不足的人；译为“贫穷的人”清楚自然，又不把含义限缩为完全赤贫。
- source_word: ἀσθενῆ
  choice: 软弱的人
  rationale: ἀσθενής 可指身体虚弱、患病或广义上的弱者；“软弱的人”保留其语义宽度，避免擅自限定为病人。
- source_word: ἐλεήσατε
  choice: 要怜悯
  rationale: 命令式表示积极施予怜悯；“怜悯”既保留情感层面，也可涵盖实际扶助。
theological_decisions:
- issue: 爱主与爱邻舍的并列关系
  choice: “爱主，也要爱邻舍”
  alternative: “爱主和邻舍”
  rationale: 希腊文以 καί 并列两个宾语；加入“也要”使现代汉语更自然，同时不改变二者并列受命的关系。
- issue: ἀσθενής 的具体所指
  choice: 保留为“软弱的人”
  alternative: “病弱的人”或“弱者”
  rationale: 原文未明确仅指疾病、身体状况或社会地位，因此采用较宽泛的译法，以保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。依照希腊文本的句子分界译为两句；第二人称复数以“你们”明确表达。
