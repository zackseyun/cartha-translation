  text: 5. Οὐ γὰρ δέδοται ὑμῖν²⁴ ἄλλη μερὶς Γ*εἰ μὴ²⁵ *τῆς πιότητος²⁶ τῆς γῆς *ἐν πόνοις καρπῶν²⁷¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/005.yaml
  text: For no other portion has been given to you except the richness of the earth by the labor of fruits.
translation:
  language: zh_hans
  text: 因为除了土地的丰饶，连同结出果实的辛劳[a]，没有别的份赐给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“土地的丰饶，在果实的劳苦中”。末句的关系十分压缩：“结出果实的辛劳”也可理解为借着劳苦而有的果实，或与土地丰饶相连的耕作劳苦。
    reason: 说明ἐν πόνοις καρπῶν与“土地的丰饶”之间的句法和语义关系不完全明确，避免正文把它限定为“靠劳作所得的出产”。
lexical_decisions:
- source_word: ἄλλη μερίς
  choice: 别的份
  rationale: μερίς指分得之物、份额或产业；译作“份”既贴近原文，也不把含义限死为土地产业。
- source_word: τῆς πιότητος τῆς γῆς
  choice: 土地丰饶出产
  rationale: πιότης本指肥美、丰饶；结合γῆ与后面的καρπῶν，中文用“土地丰饶出产”表达土地肥沃所带来的产物，同时避免生硬的“土地的肥美”。
- source_word: ἐν πόνοις καρπῶν
  choice: 靠辛勤劳作所得的……出产
  rationale: πόνοις表示劳苦、辛劳；καρπῶν表示果实或出产。原文关系高度压缩，译文将其自然地理解为经辛劳获得土地出产，但以脚注保留语法上的含混。
- source_word: δέδοται ὑμῖν
  choice: 赐给你们
  rationale: 保留完成时的给予观念；“赐给”符合遗训体裁的庄重语域，但不明说施予者。
theological_decisions:
- issue: 赐予者是否明确为上帝
  choice: 不补出主语，只译“赐给你们”
  alternative: “上帝赐给你们”
  rationale: 希腊文使用无明确施事者的被动式；虽然可理解为神圣被动，正文不应把未明说的施予者显化。
- issue: “份”是否专指承受的土地产业
  choice: 保留较宽泛的“份”
  alternative: “产业”
  rationale: μερίς可指份额、所得或产业；此处与土地有关，但原文仍有一定语义余地。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“辛勤劳作”“丰饶出产”适合族长遗训的劝诫语气；句式保持简洁，不照搬希腊文的生硬属格结构。
