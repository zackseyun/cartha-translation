base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/003.yaml
  text: Bend your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving.
translation:
  language: zh_hans
  text: 你们要弯下腰来耕种，在各样农事上劳作，怀着感恩向主献上礼物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν
  choice: 你们要弯下腰来
  rationale: 此短语直指把背俯下投入耕作；译为“弯下腰来”既保留身体动作，也自然表达辛勤劳动。
- source_word: εἰς τὸ γεωργεῖν
  choice: 耕种
  rationale: γεωργεῖν 指从事农耕；“耕种”简明、现代，并与下文农事相呼应。
- source_word: ἐργάζεσθε ἐν ἔργοις καθ᾽ ἑκάστην γεωργίαν
  choice: 在各样农事上劳作
  rationale: 希腊文强调各类耕作事务中的劳动；如此翻译避免生硬重复“作工/工作”，同时保留范围广泛之意。
- source_word: δῶρα
  choice: 礼物
  rationale: 保留原词“赠礼、礼物”的宽泛含义，不擅自限定为祭物、供物或农产品。
- source_word: μετ᾽ εὐχαριστείας Κυρίῳ προσφέροντες
  choice: 怀着感恩向主献上
  rationale: μετ᾽ εὐχαριστείας 表示伴随感恩的态度；προσφέρειν 在向主呈献的语境中译作“献上”庄重而自然。
theological_decisions:
- issue: 所献礼物的性质
  choice: 译作“礼物”，不具体说明其为祭物或收成
  alternative: 供物／祭物／初熟果实
  rationale: 原文 δῶρα 本身未限定礼物类别；保留其开放性可避免加入原文没有明说的礼仪或农业细节。
- issue: “主”的指称
  choice: 保留“主”
  alternative: 上主／耶和华／神
  rationale: 原文仅用 Κυρίῳ，没有进一步明确专名；“主”忠实保留称谓及其语境中的神学含义。
translation_notes:
  register: 采用现代、庄重且口语可懂的劝诫体。“弯下腰来”具体有力；“各样农事”准确而不古奥。全句保持命令与伴随行动的结构，不额外解释礼物的类别。
