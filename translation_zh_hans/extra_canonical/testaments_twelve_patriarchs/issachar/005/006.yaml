  text: For my father Jacob also blessed me with blessings of the earth and firstfruits of fruits.
translation:
  language: zh_hans
  text: 因为我父亲雅各也以大地的福分和初熟果实的福分祝福我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογίαις
  choice: 用……的福
  rationale: 保留“福/赐福”的词根呼应，同时用现代汉语自然表达其方式或内容。
- source_word: τῆς γῆς
  choice: 大地的
  rationale: γῆς在此指土地、大地所出的丰饶；译作“大地”既贴近原文，也适合祝福语境。
- source_word: ἀπαρχῶν καρπῶν
  choice: 果实中初熟之物的福
  rationale: ἀπαρχαί指首先收取、初熟而献出的部分；καρπῶν直译为“果实”。此译保留两词的关系，并避免把它限定为某一种宗教礼制用语。
theological_decisions:
- issue: “大地的福”与“果实中初熟之物”在句法上的关系
  choice: 将二者都理解为父亲赐福的内容，并补出第二个“的福”以使中文清楚
  alternative: 译作“用大地和果实中初熟之物的福赐福给我”
  rationale: 希腊文第二项没有重复εὐλογίαις，形式上可视为共用该词。中文补出“的福”只为明确并列关系，不改变其神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“福—赐福”的修辞呼应，不使用古奥或宗派化术语。
