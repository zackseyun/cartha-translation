  text: 8. *Καὶ ὑμεῖς Γοὖν¹ αὐτοῖς ὑπακούετε⁴⁴ καὶ⁴⁵ τῇ ἁπλότητι⁴⁶ τοῦ πατρὸς ὑμῶν περιπατεῖτε⁴⁷· [*τῷ δὲ⁴⁸ Γὰδ ἐδόθη ἀπολέσαι τὰ *ἐπερχόμενα πειρατήρια⁴⁹ τῷ Ἰσραήλ].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/008.yaml
  text: Therefore obey them, and walk in the simplicity of your father. [But to Gad it was given to destroy the marauding bands coming upon Israel.]
translation:
  language: zh_hans
  text: 所以，你们也要顺从他们，并按着你们父亲的纯朴而生活。[a]但迦得蒙赐去消灭那些来袭以色列的劫掠队伍。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯朴”也可译作“单纯”或“诚实无伪”。
    reason: 提示 ἁπλότης 的语义范围，保留其真诚、专一与不诡诈等可能内涵。
  - marker: b
    text: 本句在所据版本中以方括号标出，文本归属可能存在疑问。
    reason: 原始资料将整句置于方括号内，出版译文应如实提示其文本状态。
lexical_decisions:
- source_word: ὑπακούετε
  choice: 顺从
  rationale: 既保留“听从、服从”的基本含义，又符合父亲向子孙劝诫的语境。
- source_word: ἁπλότητι
  choice: 纯朴
  rationale: 该词可指单纯、诚实、不怀二心；“纯朴”保留其伦理意味，也避免把含义收窄为天真。
- source_word: περιπατεῖτε
  choice: 为人
  rationale: 此处是闪语式伦理隐喻，意为按某种方式生活行事；译作“为人”在现代汉语中自然庄重。
- source_word: ἐδόθη
  choice: 蒙赐能力
  rationale: 原文直译为“被赐予”；根据后接不定式补出“能力”，使汉语完整，同时保留赐予者未明说的被动表达。
- source_word: πειρατήρια
  choice: 劫掠队伍
  rationale: 指从事侵袭、掳掠的成群武装人员；比“劫掠行动”更贴近名词所指的队伍。
- source_word: ἐπερχόμενα
  choice: 前来侵袭
  rationale: 表达这些队伍正向以色列逼近、攻击，而不把它仅处理为空间上的“来到”。
theological_decisions:
- issue: “赐予”的施予者是否明确为上帝
  choice: 保留无主被动“蒙赐”
  alternative: 译为“上帝赐给迦得能力”
  rationale: 希腊文没有明说施予者；虽可理解为神圣被动，正文不应补明以免消除原文的含蓄。
- issue: τῇ ἁπλότητι 的伦理内涵
  choice: 译作“纯朴”
  alternative: “单纯”或“诚实无伪”
  rationale: “纯朴”兼容专一、真诚和不诡诈等含义，不把该词固定为单一教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“照着……纯朴为人”保留“行走”这一伦理隐喻的功能而避免生硬直译；后句维持原文施予者未明的张力。
