revisions:
- from: 所以，你们也要顺从他们，并照着你们父亲的纯朴为人。[a]但迦得蒙赐能力，消灭那些前来侵袭以色列的劫掠队伍。[b]
  to: 所以，你们也要顺从他们，并按着你们父亲的纯朴而生活。[a]但迦得蒙赐去消灭那些来袭以色列的劫掠队伍。[b]
  rationale: 修订首句的搭配，使其更自然并更贴近 περιπατεῖτε 的伦理生活含义；删除“能力”，避免在 ἐδόθη ἀπολέσαι 中补入原文未明说的赐予内容。保留方括号及其脚注，以呈现所据希腊文本对末句的疑问状态。
