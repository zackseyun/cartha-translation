review_pass:
  verdict: revise
  source_fidelity: 首句的“他们”对应 αὐτοῖς，保留了原文所指但不擅自界定。ἁπλότης 译为“纯朴”基本可行；不过“照着你们父亲的纯朴为人”虽能理解，未充分呈现与格所表达的“在／按……而行”的生活方式。括号内 ἐδόθη 后接不定式，意为“迦得被赐予去毁灭……”，草稿补出“能力”并不必要，且把原文所给之事改写为能力。ἐπερχόμενα 是“来袭、临到”的队伍，译作“前来侵袭”可接受。
  naturalness: “照着你们父亲的纯朴为人”略显搭配生硬。改为“按着你们父亲的纯朴而生活”更自然，也更贴近 περιπατεῖτε 的伦理性“行走／生活”。“迦得蒙赐能力，消灭……”在汉语虽通顺，但“蒙赐去消灭……”更直接对应原句的被动加不定式结构。
  terminology: 保留“顺从”“纯朴”“迦得”“以色列”。“劫掠队伍”准确反映 πειρατήρια 所指的掠夺性武装团伙；无需把施予者明确为上帝。
  issues:
  - severity: medium
    issue: “蒙赐能力”补入原文未出现的“能力”。
    rationale: ἐδόθη ἀπολέσαι 的句法是“被赐予去毁灭”，原文没有“能力”这一宾语。补入后虽不必然改变大意，却使赐予的内容从使命／权限转成能力。
  - severity: low
    issue: “照着你们父亲的纯朴为人”表达略不自然，且对“在父亲的纯朴中行走”的生活方式语义呈现不足。
    rationale: περιπατεῖτε 在此为伦理生活的隐喻；“按着……而生活”既现代自然，又保留持续实践的含义。
