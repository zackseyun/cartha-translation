base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/001.yaml
  text: Therefore, my children, keep the law of God, and acquire simplicity, and walk in innocence, not concerning yourselves with the deeds of your neighbor.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要遵守上帝的律法，培养单纯的心，以无邪之心行事，不要过问邻舍所做的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: 遵守
  rationale: 此处指谨守并实行上帝的律法；“遵守”符合现代汉语宗教文本的自然表达。
- source_word: τὴν ἁπλότητα κτήσασθε
  choice: 持守纯一
  rationale: ἁπλότης可表示单纯、真诚、专一而无二心；“纯一”保留其道德上的完整与不诡诈之意，“持守”自然传达主动获得并保有这种品格。
- source_word: ἐν ἀκακίᾳ πορεύεσθε
  choice: 以无邪之心行事
  rationale: ἀκακία指无恶意、无害或清白；πορεύεσθε在伦理劝诫中表示生活行事。此译法兼顾自然汉语与品格含义。
- source_word: μὴ περιαργαζόμενοι
  choice: 不要过问
  rationale: 该词表达越出本分地介入、探究或多管别人的事；“过问”较凝练，并避免仅译成一般的忙碌。
- source_word: τοῦ πλησίον τὰς πράξεις
  choice: 邻舍所做的事
  rationale: πλησίον为“邻舍、身边的人”，πράξεις为行为或所做之事；该译法直接且自然。
theological_decisions:
- issue: νόμον Θεοῦ所指范围
  choice: 上帝的律法
  alternative: 上帝的法则
  rationale: 原文未限定为某一具体法典，也未解释其范围，因此采用传统而宽泛的“上帝的律法”，不额外作神学限定。
- issue: ἁπλότης的伦理内涵
  choice: 纯一
  alternative: 单纯／真诚
  rationale: “纯一”保留不分裂、无二心和不诡诈的张力；单译“单纯”可能被理解为幼稚，单译“真诚”则会缩窄词义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“我的孩子们”保留父辈训诫的亲密称呼；三个命令以并列节奏呈现。无脚注。
