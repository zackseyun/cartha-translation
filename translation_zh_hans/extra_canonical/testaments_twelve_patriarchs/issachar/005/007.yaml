  text: 7. Καὶ ὁ³⁵ Λευί³⁶ καὶ ὁ³⁷ Ἰούδας ἐδοξάσθησαν³⁸ παρὰ Κυρίου καὶ³⁹ ἐν υἱοῖς Ἰακώβ. Καὶ ὁ⁴⁰ Κύριος *ἐκληροδότησεν αὐτούς⁴¹¹, καὶ τῷ μὲν Λευὶ⁴² ἔδωκε *τὴν ἱερατείαν⁴³, τῷ δὲ Ἰούδᾳ⁴³ τὴν βασιλείαν.
