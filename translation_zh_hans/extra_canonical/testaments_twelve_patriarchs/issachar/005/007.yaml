base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/007.yaml
  text: 'And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord allotted to them their inheritance: to Levi, the priesthood; and to Judah, the kingdom.'
translation:
  language: zh_hans
  text: 利未和犹大在雅各众子中蒙主尊荣。主把产业分给他们：把祭司职分赐给利未，把王权赐给犹大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: 蒙主尊荣
  rationale: 保留被动语态及主为施事者的含义；“蒙……尊荣”自然庄重，也避免将其弱化为单纯受到称赞。
- source_word: ἐν υἱοῖς Ἰακώβ
  choice: 在雅各众子中
  rationale: 按希腊文保留群体范围，表达利未和犹大在雅各众子之中受到尊荣。
- source_word: ἐκληροδότησεν αὐτούς
  choice: 把产业分给他们
  rationale: 结合上下文中分别赐予祭司职分和王权的内容，将动词译为分配产业，既体现继承产业的语义，也符合现代汉语。
- source_word: τὴν ἱερατείαν
  choice: 祭司职分
  rationale: 表达制度性、持续性的祭司职务，比仅译“祭司”更准确。
- source_word: τὴν βασιλείαν
  choice: 王权
  rationale: 此处与祭司职分并列，重点是赐给犹大的统治权柄；“王权”较“王国”更贴合语境，同时不额外限定具体政体。
theological_decisions:
- issue: 利未与犹大所得之产业的性质
  choice: 将祭司职分和王权表述为主分给他们的产业
  alternative: 译作“主使他们承受产业”或“主赐他们为产业”
  rationale: 希腊文动词带有授予产业或使承受产业的含义，而后文明确列出利未所得的祭司职分和犹大所得的王权；本译法保持这种对应关系，不引入特定宗派的继承观。
translation_notes:
  register: 采用现代、庄重而清楚的叙述体。“蒙主尊荣”保留经文语感；后句以对称结构呈现利未与犹大分别所得的职分和权柄。
