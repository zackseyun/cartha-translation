review_pass:
  verdict: revise
  source_fidelity: 首两分句基本准确，并保留了ζηλοῖ与βάσκανος所表达的由一般嫉妒到恶意嫉妒的递进。末句的“纷乱”较偏向笼统的心理混乱，未充分呈现περισπασμός的“分心、牵扰”之义；“因贪婪而”虽可成立，却比原文两个ἐν短语更强地明确为因果关系。
  naturalness: 整体庄重通顺。将末句改为“心思中也没有贪婪所致的分心”，既符合现代汉语，也更贴近原文的名词性、并列否定句式。
  terminology: “嫉妒”“恶毒的嫉妒”“心灵”“心思”均恰当，并适度区分ψυχή与νοῦς。“分心”比“纷乱”更对应περισπασμός；“贪婪”准确对应ἀπληστεία。
  issues:
