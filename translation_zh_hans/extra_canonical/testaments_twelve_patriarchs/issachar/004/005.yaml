base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/005.yaml
  text: He does not envy in deliberations, nor does malicious envy consume his soul, nor is there distraction in greed in his mind.
translation:
  language: zh_hans
  text: 他在商议中不嫉妒，恶毒的嫉妒也不耗损他的心灵；他的心思中也没有贪婪所致的分心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλοῖ
  choice: 嫉妒
  rationale: 这里与后文的 βάσκανος 同属嫉妒语义场；译作“嫉妒”自然，并保留原文对内在恶念的否定。
- source_word: ἐν διαβουλίοις
  choice: 在商议时
  rationale: διαβούλια 可指商议、谋划或思量；“在商议时”保留其活动或情境含义，不擅自限定为“他的谋划”。
- source_word: βάσκανος
  choice: 恶毒的嫉妒
  rationale: 该词含恶意、妒害色彩；这样翻译既与前句的“嫉妒”呼应，也表达其更强的负面意味。
- source_word: ἐκτήκει
  choice: 耗损
  rationale: 原词指使消瘦、消耗殆尽；“耗损”可自然表达持续侵蚀心灵之意。
- source_word: ψυχὴν
  choice: 心灵
  rationale: ψυχή 在此指人的内在生命或自我；“心灵”比“灵魂”更符合这句伦理劝诫的现代汉语语境，同时不排除其较深含义。
- source_word: περισπασμὸς
  choice: 纷乱
  rationale: 该词有分心、牵扯、烦扰之意；“纷乱”适合与“心思”搭配，并保留内在注意力受扰的含义。
- source_word: ἀπληστείᾳ
  choice: 贪婪
  rationale: 准确表达不知足、贪得无厌的欲望。
- source_word: ἐν νοΐ
  choice: 他的心思
  rationale: νοῦς 指心智、思想或心思；译为“心思”自然清楚，并承接全句对内在状态的描述。
theological_decisions:
- issue: ψυχή 与 νοῦς 的区分
  choice: 分别译为“心灵”和“心思”
  alternative: 分别译为“灵魂”和“理性”
  rationale: 原文使用两个不同词，译文应保持区别；但上下文属于伦理描写，不必导入严格的灵魂—理性二分体系。
- issue: 末句介词结构的关系
  choice: 理解为心思因贪婪而陷入纷乱
  alternative: 直译为“在他的心思中，没有处于贪婪中的分心”
  rationale: 希腊语介词短语关系略显紧缩；所选表达符合自然汉语，又不把“纷乱”具体解释成某种神学或心理学状态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留三重否定陈述的并列推进，并将末句调整为自然汉语因果结构，避免生硬照搬希腊语介词排列。原文中的方括号和校勘符号属于版本证据，不作为正文脚注处理。
