    rationale: περισπασμός主要指分心、牵扯或烦扰，并非泛指心思混乱；译作“分心”可保留其注意力受牵扰的核心意义。
  - severity: low
    issue: 末句“因贪婪而”将介词结构明确处理为因果。
    rationale: 原文为紧缩的“在贪婪中／在心思中”结构。用“贪婪所致的”仍是自然的汉语整理，但较能保留其名词性修饰关系及与英文审计文本的对应。
