  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/006.yaml
  text: But he walks in simplicity of soul; he sees all things with uprightness of heart, not accepting evil eyes from the world’s error, so that he may not see the commandments of the Lord as distorted.
translation:
  language: zh_hans
  text: 但他以纯一的心灵行事，以正直的内心看待一切；不接受出于世上迷误的邪恶眼光，免得把主的诫命看作是歪曲的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητι ψυχῆς
  choice: 以纯一的心灵
  rationale: ἁπλότης在此表示单纯、纯一而不诡诈；“纯一”既保留伦理意味，也比“简单”更自然庄重。
- source_word: ἐν εὐθύτητι καρδίας
  choice: 以正直的内心
  rationale: εὐθύτης指正直、端正；καρδία在此是人的内在判断与意向，译作“内心”符合现代汉语。
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηρούς
  choice: 不……接受邪恶的眼光
  rationale: 尽量保留原文“接受邪恶的眼睛/眼光”这一不寻常意象；译作“眼光”使汉语可懂，同时不将其具体解释为嫉妒、偏见等单一含义。
- source_word: ἀπὸ τῆς πλάνης τοῦ κόσμου
  choice: 因世上的迷误
  rationale: ἀπό在此可表达来源或诱因；“因……而”自然呈现邪恶眼光源自世上迷误的关系。πλάνη译作“迷误”，兼含错误与使人偏离之意。
- source_word: ἵνα μὴ ἴδῃ διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου
  choice: 免得把主的诫命看成扭曲的
  rationale: 保留“看见/看成”与“扭曲”之间的张力，表明扭曲可能在观看者的认知中发生，而不直接断言诫命本身被改变。
theological_decisions:
- issue: “主的诫命”是否客观上被扭曲
  choice: 把主的诫命看成扭曲的
  alternative: 看见主的诫命被歪曲
  rationale: 原文ἴδῃ与作宾语补语的διεστραμμένας可容许“视为扭曲”的理解；上下文强调邪恶眼光影响观看，因此不把句子明确解释为外界篡改诫命。
- issue: “邪恶的眼光”的具体伦理含义
  choice: 保留宽泛意象
  alternative: 译成“嫉妒的眼光”或“偏邪的看法”
  rationale: ὀφθαλμοὺς πονηρούς在此含义并未被进一步限定，故不引入特定传统解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；保留原文关于“心灵—内心—眼光—看见”的意象链条。分号呈现两个并列的正面陈述，后接否定分词与目的从句。
