    issue: “不因世上的迷误而接受邪恶的眼光”对ἀπὸ τῆς πλάνης τοῦ κόσμου的句法关系不够明确。
    rationale: 原文自然读法是“不接受出于世上迷误的邪恶眼光”，而非“因为世上迷误所以不接受”。改为“出于……”可保留来源关系，且不额外界定“邪恶眼光”的具体性质。
  - severity: low
