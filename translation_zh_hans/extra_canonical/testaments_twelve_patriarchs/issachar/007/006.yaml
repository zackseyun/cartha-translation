  text: I loved the Lord and every person with all my heart, more than my children.
translation:
  language: zh_hans
  text: 我全心爱主，也爱每一个人，胜过爱自己的儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν Κύριον
  choice: 主
  rationale: 以“主”对应带定冠词的 Κύριον，保留其宗教称谓的庄重与简洁。
- source_word: πάντα ἄνθρωπον
  choice: 每一个人
  rationale: 逐体现单数分配意义，比泛称“所有人”更贴近原文，同时符合现代汉语。
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: 全心
  rationale: 自然表达“从我的整个心”，传达毫无保留、由衷的爱。
- source_word: ὑπὲρ τὰ τέκνα μου
  choice: 胜过爱自己的儿女
  rationale: ὑπέρ 加宾格表示比较上的“超过”；补出第二个“爱”使汉语比较关系清楚，“自己的”明确 τέκνα μου 的所属。
theological_decisions:
- issue: 爱主、爱众人与爱儿女之间的比较
  choice: 保留“胜过爱自己的儿女”的直接比较
  alternative: 将其弱化为“甚至超过对儿女的爱”或解释为优先次序
  rationale: 原文明确使用 ὑπέρ 表示超过；不将这种具有张力的陈述改写成较弱或带解释性的伦理排序。
translation_notes:
  register: 采用现代、庄重而口语自然的叙述。以“全心”避免生硬直译“从我的整个心”；语序略作调整，使“也爱每一个人”与比较短语衔接清楚。
