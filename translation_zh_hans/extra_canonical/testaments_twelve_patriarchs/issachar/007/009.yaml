  text: And stretching out his feet, he fell asleep in a good old age the eternal sleep.
translation:
  language: zh_hans
  text: 他伸开双脚，在安享高寿时睡去，进入永恒的长眠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: 伸开双脚
  rationale: 直接表达分词结构及身体动作；“脚”在现代汉语中自然，也不额外推断这是临终礼仪姿势。
- source_word: ἐκοιμήθη
  choice: 睡去
  rationale: 保留原文以睡眠委婉指死亡的表达，并与后面的“长眠”形成自然呼应。
- source_word: ἐν γήρει καλῷ
  choice: 在安享高寿时
  rationale: γήρας指老年，καλός在此表示美好、圆满；“安享高寿”符合现代汉语习惯，又不增添原文没有的健康细节。
- source_word: ὕπνον αἰώνιον
  choice: 永恒的长眠
  rationale: 保留“睡眠”的意象及αἰώνιος的永久意味；“长眠”是现代汉语中庄重而清楚的死亡委婉语。
theological_decisions:
- issue: “永恒的睡眠”是否意味着否定复活
  choice: 按死亡意象译为“永恒的长眠”，不作教义解释
  alternative: 译作“永远沉睡”，或直接译作“死去”
  rationale: 原句以睡眠比喻死亡；译文保留其张力，不据此断定作者对复活或死后状态的完整立场。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。原文无脚注内容可供转录，且校勘标号³⁷仅附着于代词，没有提供异文说明，因此正文不设脚注。英语修订记录中出现的“全身健全、强壮”等内容不见于所给希腊文本，未予纳入。
