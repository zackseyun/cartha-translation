  naturalness: “在美好的晚年离世”可理解，但“高寿”更准确、庄重地表达γήρει καλῷ。“沉睡在永恒的长眠中”语义重复且搭配生硬；“进入永恒的长眠”在现代汉语中自然，并维持死亡的睡眠隐喻。
  terminology: 无需导入任何特定教义解释。“永恒的长眠”保留αἰώνιον的字面力度；不将其释作复活、灵魂状态或彻底消灭。将“身体强壮”调整为“仍很强健”，更贴近ἰσχύων作为与死亡同时的状态。
