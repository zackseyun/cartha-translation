  text: And he stretched out his feet and died in a good old age, having every limb sound, and being strong he slept the eternal sleep.
translation:
  language: zh_hans
  text: 他伸开双脚，在高寿中去世；他全身各肢体都健全，仍很强健，进入了永恒的长眠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέτεινε τοὺς πόδας αὐτοῦ
  choice: 伸开双脚
  rationale: 直译这一临终动作，不按未经明说的丧葬习俗加以解释。
- source_word: ἀπέθανε ἐν γήρει καλῷ
  choice: 在美好的晚年离世
  rationale: 保留 καλῷ 对其高寿晚年的正面评价；“离世”在庄重语体中自然表达死亡。
- source_word: πᾶν μέλος ἔχων ὑγιές
  choice: 四肢健全
  rationale: μέλος 在此泛指身体肢体；汉语“四肢健全”自然传达全身各肢体完好的意思。
- source_word: ἰσχύων
  choice: 身体强壮
  rationale: 将分词所表达的临终时仍有体力明确而自然地译出。
- source_word: ὕπνωσεν ὕπνον αἰώνιον
  choice: 沉睡在永恒的长眠中
  rationale: 保留原文“睡—眠”的修辞呼应以及死亡隐喻，不将其神学含义进一步解释为复活或无意识状态。
theological_decisions:
- issue: “永恒的长眠”是否断言死亡状态永久不变
  choice: 保留原文死亡隐喻“沉睡在永恒的长眠中”
  alternative: 意译为“安然去世”或解释为“睡了，等候复活”
  rationale: αἰώνιον 直接修饰 ὕπνον。译文保留其张力，不消解“永恒”的字面力度，也不导入原文未明说的复活解释。
translation_notes:
  register: 采用庄重而现代的叙事语体。分号呈现死亡陈述与其临终身体状况之间的结构关系；末句保留原文略带诗性的死亡委婉语。未采用最新修订记录中的句子，因为那些内容与所给希腊文本不相符。
