  to: 我的孩子们，你们也要行这些事；这样，彼列的一切邪灵都会从你们那里逃走，恶人的一切作为都不能辖制你们。你们还要制伏一切野兽，有天地之神与你们同在；他与心地纯一的人同行〔a〕。
