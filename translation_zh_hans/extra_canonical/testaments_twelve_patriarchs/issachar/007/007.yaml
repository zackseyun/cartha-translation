  text: 7. *Ταῦτα καὶ ὑμεῖς, τέκνα μου, ποιεῖτε²², καὶ²³ πᾶν πνεῦμα τοῦ Βελίαρ φεύξεται ἀφ᾽ ὑμῶν καὶ πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν²⁴ καὶ¹¹ πᾶν ἄγριον θηρίον²⁵ καταδουλώσετε²⁶ ἔχοντες μεθ᾽ ὑμῶν²⁷ τὸν θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς²⁸ *συμπορευόμενον τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας²⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/007.yaml
  text: You also, my children, do these things, and every spirit of Beliar will flee from you, and every deed of wicked people will not rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who goes with people in simplicity of heart.
translation:
  language: zh_hans
  text: 我的孩子们，你们也要行这些事；这样，彼列的一切邪灵都会从你们那里逃走，恶人的一切作为都不能辖制你们。你们还要制伏一切野兽，有天地之神与你们同在；他与心地纯一的人同行〔a〕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν πνεῦμα τοῦ Βελίαρ
  choice: 彼列的一切邪灵
  rationale: 保留专名“彼列”，并以“邪灵”自然表达归属于彼列的灵；“一切”对应 πᾶν。
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων
  choice: 恶人的一切作为
  rationale: πρᾶξις 指行为或作为；采用“一切作为”保留 πᾶσα 的整体性。
- source_word: κυριεύσει ὑμῶν
  choice: 辖制你们
  rationale: κυριεύω 表示作主、掌权；“辖制”兼顾权势语义与现代中文的庄重表达。
- source_word: καταδουλώσετε
  choice: 制伏
  rationale: 该词有使之臣服、奴役之意；用于野兽时，“制伏”自然且保留强烈的支配意味。
- source_word: συμπορευόμενον
  choice: 同行
  rationale: 该分词表示一同前行；“同行”比泛化的“同去”更凝练，并与同行者的关系相符。
- source_word: ἐν ἁπλότητι καρδίας
  choice: 心地纯一
  rationale: ἁπλότης 可指单纯、真诚、专一；“心地纯一”保留其道德和内在取向，同时不把含义缩窄为天真。
theological_decisions:
- issue: “天地之神”与谁同行
  choice: 他与心地纯一的人同行
  alternative: 他在心地纯一中与人同行
  rationale: 希腊语 τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας 可理解为修饰“人”，也可理解为同行的方式。正文采用更自然且与英语审校层一致的前者，同时以脚注保存语法歧义。
- issue: 神同在与制伏野兽之间的关系
  choice: 以“因为”表达伴随情状所含的根据
  alternative: 你们有天地之神与你们同在
  rationale: ἔχοντες 是伴随情状分词，可表达“有……同在”这一状态，也隐含制伏的根据；“因为”使中文关系清楚，但不增加独立教义主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法适度拆分，以避免长串并列造成生硬；保留“彼列”这一传统专名及原文中“一切……不能”的全面表述。
