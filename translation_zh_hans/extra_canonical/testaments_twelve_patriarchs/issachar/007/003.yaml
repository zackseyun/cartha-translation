  text: 3. Οἶνον⁶ εἰς ἀποπλάνησιν οὐκ ἔπιον· ⌈πᾶν ἐπιθύμημα τοῦ πλησίου οὐκ ἐπεθύμησα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/003.yaml
  text: I did not drink wine for deception, and I did not desire anything that belonged to my neighbor.
translation:
  language: zh_hans
  text: 我没有喝酒，以致迷失正道[a]；我没有贪恋属于邻舍的任何东西。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以致迷失正道”也可理解为“为要使人迷失正道”或“喝酒以致受迷惑”；原文没有明说迷误的受事，且该短语可表示目的或结果。
    reason: 保留 εἰς ἀποπλάνησιν 的目的／结果及受事歧义。
  - marker: b
    text: 直译可作“邻舍的一切欲求之物”；“邻舍的”也可能理解为“邻舍所想要的”。
    reason: 说明 πᾶν ἐπιθύμημα τοῦ πλησίου 中名词及属格关系的歧义，同时正文采用与英语审校轨迹一致的自然表达。
lexical_decisions:
- source_word: εἰς ἀποπλάνησιν
  choice: 为使人迷乱
  rationale: εἰς 可表示目的或结果，ἀποπλάνησις 指使人偏离、受迷惑或陷入迷乱；正文采用自然且保留道德意味的表达，并以脚注说明另一种理解。
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: 邻舍的一切可贪之物
  rationale: ἐπιθύμημα 可指所欲求、所贪恋之物，τοῦ πλησίου 可理解为与邻舍有关或属于邻舍；此译法呼应“不贪恋邻舍之物”的伦理语境，又不把具体物品补入原文。
- source_word: οὐκ ἐπεθύμησα
  choice: 我都没有贪恋
  rationale: ἐπιθυμέω 在涉及邻舍之物的禁欲和伦理语境中用“贪恋”比泛泛的“想要”更准确，也与前面的“可贪之物”形成原文式词根呼应。
theological_decisions:
- issue: “邻舍的一切可贪之物”所指的范围
  choice: 正文保留为与邻舍相关的欲求对象，不列举财物或关系
  alternative: 邻舍所想要的一切；属于邻舍的任何东西
  rationale: 希腊语属格结构存在一定歧义；英文咨询层采用“属于邻舍的任何东西”，但原文也可能按字面理解为“邻舍所欲求的”。正文不作过度限定，脚注呈现两种可能。
- issue: 饮酒与“迷乱”的关系
  choice: 按目的理解为“为使人迷乱而喝酒”
  alternative: 喝酒以致自己迷乱；喝使人迷乱的酒
  rationale: εἰς ἀποπλάνησιν 可表达目的或结果，且未明说被迷惑者是谁。正文采用较贴近英语审校层的目的表达，脚注保留其他语法可能。
translation_notes:
  register: 采用庄重而通俗的现代汉语；以分号对应原文两个并列否定句。“邻舍”“贪恋”保留古代伦理训诫的语感，同时仍为现代读者易懂。
