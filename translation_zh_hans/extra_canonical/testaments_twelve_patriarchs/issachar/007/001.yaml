  text: VII. *Ἰδοὺ οὖν ὡς ὁρᾶτε, ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω¹, καὶ οὐκ *ἔγνων †ἐν ἐμοὶ ἁμαρτίαν Γεἰς θάνατον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/001.yaml
  text: 'See then, as you see: I am one hundred and twenty-six years old, and I have not known any sin in me leading to death.'
translation:
  language: zh_hans
  text: 看哪，因此，正如你们所见，我已经一百二十六岁了；我不曾知道自己里面有任何导致死亡的罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “导致死亡”也可译作“至于死”；原文没有说明这里是指肉身死亡、永远的死亡，还是某一类特定的罪。
    reason: 保存εἰς θάνατον在方向、结果及神学所指上的真实歧义。
lexical_decisions:
- source_word: Ἰδοὺ οὖν
  choice: 看哪
  rationale: ἰδού是引人注意的提示语；οὖν在此承接上文。汉语以“看哪”自然传达提示和承接语气，无须生硬译出“所以”。
- source_word: ὡς ὁρᾶτε
  choice: 你们也都看见了
  rationale: 保留ὁρᾶτε第二人称复数及“看见”的基本义；“也都”使ὡς所表达的听众亲见、可证实之意在现代汉语中更清楚。
- source_word: ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω
  choice: 我如今一百二十六岁
  rationale: ὑπάρχω在年龄表述中是“现为、已有”之意；译为自然的现代汉语年龄表达，并以“如今”体现当前状态。
- source_word: οὐκ ἔγνων
  choice: 我不曾知道
  rationale: 直接保留γινώσκω的认知义和不定过去时的回顾语气，不改写为“没有犯过”，以免把认识自己里面有罪与实施犯罪完全等同。
- source_word: ἐν ἐμοὶ ἁμαρτίαν
  choice: 自己里面有任何……的罪
  rationale: 保留ἐν ἐμοί“在我里面”的内在定位；否定句中用“任何”符合现代汉语习惯。
- source_word: εἰς θάνατον
  choice: 导致死亡
  rationale: εἰς可表达趋向或结果；此译保留罪与死亡之间的导向关系，不擅自限定为肉身死亡、永死或某一固定教义类别。
theological_decisions:
- issue: “罪至于死”的性质
  choice: 导致死亡的罪
  alternative: 该死的罪；至于死的罪；必死的罪
  rationale: 原文仅以εἰς θάνατον说明罪指向死亡，并未明言死亡的种类或罪的教义分类；采用关系性表达以保存神学张力。
- issue: 说话者是否宣称绝对无罪
  choice: 保留“自己里面有任何导致死亡的罪”的范围限定
  alternative: 我从未犯过罪
  rationale: 否定所指是带有εἰς θάνατον限定的ἁμαρτία，而非对一切罪作毫无限定的否认；译文不可扩大原文主张。
translation_notes:
  register: 采用现代、庄重而易懂的叙事口吻。“看哪”保留古代遗训的郑重提示语；其余句式尽量自然，避免文言化。“我不曾知道自己里面有……”有意贴近希腊文认知表达，而不将其释义为单纯的行为宣称。
