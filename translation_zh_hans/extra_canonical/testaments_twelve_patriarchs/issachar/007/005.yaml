id: T12P.ISS.7.5
reference: Testament of Issachar 7:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. ⌈Παντὶ ἀνθρώπῳ ὀδυνομένῳ συνεστέναξα καὶ πτωχῷ μετέδωκα ἄρτον¹² μου⁷. Εὐσέβειαν ἐποίησα¹⁴ ἐν πάσαις ταῖς¹⁵ ἡμέραις μου, *᾿Αλήθειαν ἐφύλαξα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/005.yaml
  text: I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth.
translation:
  language: zh_hans
  text: 我与每一个受苦的人一同叹息，也把我的饼分给穷人。我一生行虔敬的事，持守真理。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀδυνομένῳ συνεστέναξα
  choice: 与……受苦的人一同叹息
  rationale: 保留 συνεστέναξα 的“一同叹息”及 ὀδυνομένῳ 的受苦、痛楚含义，表达同受苦者共情，而不扩写为实际承担其苦难。
- source_word: πτωχῷ μετέδωκα ἄρτον μου
  choice: 把我的饼分给穷人
  rationale: μεταδίδωμι 表示把自己所有的分给别人；“我的饼”保留原文具体意象，较“食物”更贴近希腊文。
- source_word: Εὐσέβειαν ἐποίησα
  choice: 行虔敬的事
  rationale: 直译为“实行虔敬”在中文中略显生硬；此译保留 εὐσέβεια 的敬虔含义及 ποιέω 的实践性。
- source_word: ἐν πάσαις ταῖς ἡμέραις μου
  choice: 我一生
  rationale: 这是现代汉语对“在我所有的日子里”的自然表达，范围仍指其全部人生时日。
- source_word: Ἀλήθειαν ἐφύλαξα
  choice: 持守真理
  rationale: φυλάσσω 有守护、遵守、持守之意；ἀλήθεια 可指真理或诚实，正文采用凝练且保留宗教伦理张力的“真理”。
theological_decisions:
- issue: εὐσέβεια 的宗教伦理范围
  choice: 虔敬
  alternative: 敬虔／虔诚
  rationale: “虔敬”兼具对上帝的敬畏与相应生活实践，不把该词缩减为内在虔诚感受，也不引入特定宗派术语。
- issue: ἀλήθεια 指客观真理还是诚实行事
  choice: 真理
  alternative: 诚实／真实
  rationale: 原词本身可涵盖真理、真实与诚实。正文依其无冠词的抽象用法保留较宽的“真理”，不擅自限定为仅仅诚实行事。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。前两分句保留原文的平行结构；后半将字面“在我所有的日子里”自然化为“我一生”。无脚注，因此正文不设脚注标记。
