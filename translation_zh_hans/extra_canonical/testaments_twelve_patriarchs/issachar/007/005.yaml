  source_fidelity: 译文准确对应希腊文。"与每一个受苦的人一同叹息"恰当表达 Παντὶ ἀνθρώπῳ ὀδυνομένῳ συνεστέναξα；"把我的饼分给穷人"保留 ἄρτον μου 的具体意象和分享之义；"我一生"自然涵盖 ἐν πάσαις ταῖς ἡμέραις μου；"持守真理"可保留 Ἀλήθειαν ἐφύλαξα 中真理、真实及诚实的开放语义。
