  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/002.yaml
  text: Except for my wife, I have not known another. I did not commit sexual immorality with wandering eyes.
translation:
  language: zh_hans
  text: 除了我的妻子，我从未亲近过别的女人。我也没有带着游移的眼目行淫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν τῆς συμβίου μου
  choice: 除了我的妻子
  rationale: σύμβιος字面指共同生活的伴侣；在此婚姻语境中自然译为“妻子”。
- source_word: οὐκ ἔγνων ἄλλην
  choice: 我没有亲近过别人
  rationale: γινώσκω在此是“发生性关系”的委婉说法；译作“亲近过”保留委婉语气。ἄλλην仅为阴性“另一个”，不明说“女人”，故译“别人”而不增补。
- source_word: οὐκ ἐπόρνευσα
  choice: 我也没有……淫乱
  rationale: πορνεύω指犯淫乱或性方面的不道德行为；“淫乱”简洁、庄重，并符合本句自述品行的语境。
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: 因眼目游移而
  rationale: μετεωρισμός可表达飘忽、游移；与“眼目”连用，指放任目光四处追逐。译文保留目光与淫乱之间略有张力的关系，不把它具体化为某一种行为。
theological_decisions:
- issue: “认识”是否应按字面译出
  choice: 采用“亲近过”这一性关系委婉语
  alternative: “认识过”或直译为“与……发生过性关系”
  rationale: 汉语“认识过别人”通常只表示相识，会误导；直白展开又会削弱原文的委婉表达。“亲近过”兼顾可懂性与含蓄。
- issue: 眼目游移与淫乱的逻辑关系
  choice: 译为“因眼目游移而淫乱”
  alternative: “带着游移的眼目犯淫乱”或“以眼目犯淫乱”
  rationale: 介词ἐν的关系可有方式、处境或伴随等含义。此处用“因……而”给出自然汉语，同时不将其解释成特定的“意念淫乱”教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“亲近过”保留性关系委婉语；“眼目游移”延续原文形象，避免解释性过度翻译。
