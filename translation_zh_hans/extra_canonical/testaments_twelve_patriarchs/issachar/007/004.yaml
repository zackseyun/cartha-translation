  text: No deceit came to be in my heart, and no lie went up through my lips.
translation:
  language: zh_hans
  text: 诡诈没有在我心里生出，谎言也没有从我嘴唇中出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δόλος
  choice: 诡诈
  rationale: 表示欺骗、奸诈或蓄意误导；“诡诈”既贴近原义，也与后句的“谎言”有所区分。
- source_word: οὐκ ἐγένετο ἐν τῇ καρδίᾳ μου
  choice: 从未在我心里产生
  rationale: 保留 ἐγένετο“发生、产生”的动态意味，并以“心里”自然表达内在思想和意图。
- source_word: ψεῦδος
  choice: 谎言
  rationale: 直接表达虚假言语，与前半句内心的诡诈形成对应。
- source_word: οὐκ ἀνῆλθε διὰ τῶν χειλέων μου
  choice: 从未由我嘴唇说出
  rationale: 原文直译近于“没有经过我的嘴唇上来”；中文用“由我嘴唇说出”传达言语出口之意，同时保留“嘴唇”这一具体意象。
