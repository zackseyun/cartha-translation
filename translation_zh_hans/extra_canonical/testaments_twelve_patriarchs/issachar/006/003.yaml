source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. Καὶ ὑμεῖς οὖν εἴπατε ταῦτα¹⁵ τοῖς τέκνοις ὑμῶν, ὅπως, ἐὰν ἁμάρτωσι¹⁶, τάχιον¹⁷ ἐπιστρέψωσι¹⁸ πρὸς τὸν¹⁹ Κύριον,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/003.yaml
  text: Therefore you also tell these things to your children, so that, if they sin, they may turn back more quickly to the Lord[c],
translation:
  language: zh_hans
  text: 所以，你们也要把这些事告诉自己的儿女，好让他们若犯了罪，便能更快回转归向主[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “回转归向主”既包含悔改转向的意思，也包含关系得以恢复的意味。
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: 所以，你们也
  rationale: 保留推论性的οὖν和强调听者也应如此行的καὶ ὑμεῖς，以自然汉语表达。
- source_word: εἴπατε ταῦτα τοῖς τέκνοις ὑμῶν
  choice: 要把这些事告诉自己的儿女
  rationale: 准确传达命令语气、指示代词及所属关系；“儿女”兼顾τέκνα的集合性含义。
- source_word: ἐὰν ἁμάρτωσι
  choice: 若犯了罪
  rationale: 保留条件句的可能性，不把它改写为必然发生的行为。
- source_word: τάχιον
  choice: 更快
  rationale: 保留比较级含义，不擅自补出比较对象。
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: 回转归向主
  rationale: ἐπιστρέφω配合πρός既有转回、悔改的动态，也明确指向主；“回转归向”在现代汉语中兼顾两层意思。
theological_decisions:
- issue: ἐπιστρέφω πρὸς τὸν Κύριον的悔改与恢复关系
  choice: 回转归向主
  alternative: 回到主那里
  rationale: 采用不局限于空间返回的措辞，保留离罪转向主的悔改意味，同时不把恢复关系的含义排除在外。
- issue: 犯罪后的回应是否被表述为必然
  choice: 若犯了罪，便能更快回转
  alternative: 他们犯罪时，就会更快回转
  rationale: 原文ἐάν加虚拟语气表达条件或可能性；译文不将犯罪或回转改写成确定事件。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“自己的儿女”避免“你们的孩子”可能产生的口语松散感；“回转归向主”保留经文语域，但不过度古雅。
