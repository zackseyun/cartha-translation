  text: And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will servant for their enemies.
translation:
  language: zh_hans
  text: 他们将离弃农耕，转而追随自己的邪恶图谋；他们将被分散在列国中，给自己的仇敌作奴仆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες τὸ γεωργεῖν
  choice: 离弃耕作
  rationale: 保留分词所表达的先行或伴随动作，并以自然、庄重的现代汉语表达停止从事农耕。
- source_word: ἐξακολουθήσουσι
  choice: 转而追随
  rationale: “追随”体现该动词跟从、依从之义；“转而”衔接离弃耕作后的行动变化。
- source_word: τοῖς πονηροῖς διαβουλίοις αὐτῶν
  choice: 自己的邪恶图谋
  rationale: διαβούλιον在此指谋划、计谋；“图谋”兼顾其蓄意策划及负面语境，αὐτῶν译为“自己的”。
- source_word: διασπαρήσονται ἐν τοῖς ἔθνεσιν
  choice: 必分散在列国之中
  rationale: 用被动式“分散”对应希腊语将来被动；“列国”是ἔθνη在古代宗教文献语境中的自然译法。
- source_word: δουλεύσουσιν τοῖς ἐχθροῖς αὐτῶν
  choice: 给仇敌作奴仆
  rationale: δουλεύω具有作奴隶、受奴役而服事之义；“作奴仆”比单纯“服事”更充分保留其受辖制色彩，同时符合自然汉语。
theological_decisions:
- issue: δουλεύσουσιν所表示的服役程度
  choice: 给仇敌作奴仆
  alternative: 服事他们的仇敌
  rationale: 原词明确源于“奴仆”语义域，宜保留被奴役和受制于人的力度，而不弱化为一般服务。
- issue: 行为与受罚结果之间的关系
  choice: 以并列分句呈现，不添加明确因果连接词
  alternative: 所以他们必分散在列国之中
  rationale: 希腊文以καί连接各项，没有明说逻辑因果；译文不替原文消解其可能存在的因果或时序张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“列国”“仇敌”“奴仆”保留古代遗训文本的语体色彩，但避免生僻或宗派化措辞。原文无需脚注，正文中亦不设置脚注标记。
