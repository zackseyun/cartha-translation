  text: VI. *Γινώσκετε οὖν¹, τέκνα² μου, ὅτι ἐν ἐσχάτοις καιροῖς καταλείψουσιν³ οἱ υἱοὶ ὑμῶν τὴν ἁπλότητα Γκαὶ κολληθήσονται τῇ ἀπληστίᾳ˥, Γκαὶ⁷ ἀφέντες⁴ Γτὴν ἀκακίαν⁵ προσπελάσουσι⁶ τῇ πανουργίᾳ⁷, *καὶ καταλιμπάνοντες⁸ τὰς ἐντολὰς Κυρίου *κολληθήσονται τῷ Βελίαρ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/001.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b].
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要知道：在末后的时期，你们的儿子们必离弃纯朴，依附贪婪；离开无邪[a]，亲近诡诈；又离弃主的诫命，依附彼列[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无邪”也可译作“没有诡诈”；原词（ἀκακία）侧重没有恶意或欺诈，并不只是行为上无可指责。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本此处作“贝利亚尔”（Βελίαρ）；这个名字也常译作“彼列”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκετε οὖν
  choice: 所以……你们要知道
  rationale: 保留推论连接词οὖν以及命令语气，同时采用自然的现代汉语次序。
- source_word: οἱ υἱοὶ ὑμῶν
  choice: 你们的子孙
  rationale: 此处预言后世，υἱοί直译“儿子们”可能误限于直接下一代；“子孙”自然表达后代之意。
- source_word: ἁπλότητα
  choice: 纯朴
  rationale: 保留该词单纯、真诚、不复杂的正面含义，且与后文“诡诈”形成对照。
- source_word: κολληθήσονται τῇ ἀπληστίᾳ
  choice: 贪恋不知足
  rationale: ἀπληστία指贪得无厌或贪婪；以“贪恋不知足”体现其欲求无度。κολλάω的依附意味在汉语中通过“贪恋”自然呈现。
- source_word: ἀκακίαν
  choice: 无邪
  rationale: ἀκακία可指无恶意、无害或不诡诈；“无邪”既简洁，又与πανουργία的诡诈形成鲜明对照。
- source_word: προσπελάσουσι τῇ πανουργίᾳ
  choice: 趋向诡诈
  rationale: προσπελάζω表示走近、接近；πανουργία在此为负面的狡猾、诡诈。
- source_word: κολληθήσονται τῷ Βελίαρ
  choice: 依附彼列
  rationale: 保留κολλάω强烈的黏附、归附含义；Βελίαρ采用现代中文读者较熟悉的圣经传统译名“彼列”，并以脚注说明原文形式。
theological_decisions:
- issue: “末后的时期”的范围
  choice: 在末后的时期
  alternative: 在末世
  rationale: 直译ἐν ἐσχάτοις καιροῖς，不擅自限定为某一套末世论框架。
- issue: Βελίαρ的身份与名称形式
  choice: 彼列
  alternative: 贝利亚尔／比利亚
  rationale: 正文采用中文圣经传统中较易识别的名称，但不额外解释其身份，以免超出本节原文；脚注保留希腊文本名称形式的信息。
- issue: “依附”所表达的关系
  choice: 依附彼列
  alternative: 归属于彼列
  rationale: “依附”贴近κολλάω，不将关系强化为原文未明说的所有权或敬拜关系。
translation_notes:
  register: 采用现代、庄重而清晰的书面汉语。以三个并列分句重现原文递进结构，并让“纯朴／无邪”与“贪得无厌／诡诈”形成道德对照。所有脚注标记均已置于正文相应位置。
