  text: because he is merciful and will deliver them, to turn them back to their land[d].
translation:
  language: zh_hans
  text: 因为他满有怜悯，必拯救他们，使他们回到自己的土地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可理解为：“并使他们重归自己的土地。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεήμων
  choice: 满有怜悯
  rationale: 表达其形容上帝具有怜悯的性质，语言自然庄重。
- source_word: ἐξελεῖται
  choice: 必拯救
  rationale: 中间语态未来时表示他将施行解救；“拯救”保留救拔含义，又不额外限定获救所脱离的具体处境。
- source_word: τοῦ ἐπιστρέψαι
  choice: 使……回到
  rationale: 属格不定式可表达结果或目的；结合地点短语，译作“使……回到”符合汉语表达，同时以脚注保留另一种句法理解。
- source_word: εἰς τὴν γῆν αὐτῶν
  choice: 自己的土地
  rationale: 准确对应“他们的土地”，并保留归返故土的含义，不擅自具体化为某一命名地域。
theological_decisions:
- issue: 拯救与归返之间的句法关系
  choice: 将末句理解为拯救所带来的目的或结果：“使他们回到自己的土地”
  alternative: “必拯救他们，并使他们重归自己的土地”
  rationale: τοῦ加不定式与前句的确切关系存在一定弹性；正文采用自然且紧密的使动表达，脚注保留并列式理解，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“满有怜悯”保持宗教文献语体，但不过度古雅；正文中的[a]与脚注对应。
