  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003.yaml
  text: 'For if Leah my mother had not given up marital union in exchange for the two apples[a], she would still have been destined to bear eight sons. Therefore she bore six, and Rachel bore the two, because through the mandrakes the Lord visited her. For he saw that Leah desired to be with Jacob for the sake of children, and not for the sake of pleasure. For on the next day also she again gave Jacob over. Therefore through the mandrakes the Lord listened to Rachel. For although she longed for these, she did not eat them, but dedicated them in the house of the Lord, after bringing them to the priest.


    When therefore I grew to manhood, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers. And my father blessed me, seeing that I walked before him in simplicity. And I was not meddlesome in my actions, nor envious and malicious toward my neighbor. I never slandered anyone, nor did I criticize a man''s way of life. At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman''s pleasure; rather, because of my toil, sleep came over me. And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father. And the Lord multiplied my good things ten thousandfold[d][c][b], and my father likewise increased the good things for me twofold.'
translation:
  language: zh_hans
  text: '第三章


    1 所以，我的孩子们，当我长大成人以后，就存着正直的心行事，为父亲和弟兄们耕作，按时把田里的收成带来。2 父亲看见我在他面前为人纯朴，就为我祝福。3 我做事不多管闲事，对邻舍也不嫉妒，不怀恶意。[a] 4 我从未毁谤任何人，也没有非议过别人的生活。5 我三十五岁时娶了妻子，因为劳作耗尽了我的体力；我不曾想着女人所带来的欢愉，反而因辛劳，睡意总是胜过我。6 父亲常常因我的纯朴而欢喜，因为一切初产之物[b]，我都借着祭司献给主，然后也献给父亲。7 主使我手中的美物增加万倍；我的父亲雅各也知道，上帝扶助我的纯朴。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不怀恶意”所译的希腊词也可表示“以恶眼看人”或“对人心怀吝惜、怨恨”。
    reason: lexical_alternative
  - marker: b
    text: “初产之物”可泛指最先产生的收成或所生之物，不一定只指头生的牲畜。
    reason: lexical_alternative
  - marker: c
    text: 本节按所给希腊正文翻译：雅各知道上帝扶助以萨迦的纯朴。英文审校底本在此处呈现不同结尾，称父亲也使他的美物加倍。
    reason: textual_variant
lexical_decisions:
- source_word: εὐθύτητι καρδίας
  choice: 存着正直的心
  rationale: 保留“心之正直”的内在道德取向，同时符合现代汉语表达。
- source_word: ἁπλότης / ἁπλότητι
  choice: 纯朴
  rationale: 此词是《以萨迦遗训》的主题性美德，兼有单纯、不诡诈之意；全章统一译为“纯朴”。
- source_word: περίεργος
  choice: 多管闲事
  rationale: 这里并非指一般的好奇，而是越界干预他人事务；此译自然清楚。
- source_word: φθονερὸς καὶ βάσκανος
  choice: 嫉妒，不怀恶意
  rationale: 分别表达嫉妒与带有恶眼、怨毒意味的敌意，不把两词合并成一个概念。
- source_word: κατελάλησα
  choice: 毁谤
  rationale: 该动词指在背后说人坏话或诋毁；“毁谤”保留其强烈的伦理含义。
- source_word: ἡδονὴν γυναικός
  choice: 与女人同享欢愉
  rationale: 原文结构可指女人所带来的性方面欢愉；采用庄重而不含混的表达，不扩大为对婚姻本身的否定。
- source_word: πᾶν πρῶτον γέννημα
  choice: 一切初产之物
  rationale: γέννημα 可泛指所生、所产之物，语境可能包括牲畜、农产或其他初产，不限于“头生的牲畜”。
- source_word: ἐμυριοπλασίασε
  choice: 增加了万倍
  rationale: 直接保留夸张而明确的“万倍”措辞，不弱化为笼统的“大大增多”。
- source_word: ὁ Θεὸς συνεργεῖ τῇ ἁπλότητί μου
  choice: 上帝使我的纯朴得着助益
  rationale: συνεργεῖ 与与格的关系可理解为上帝协助、成全其纯朴；译文保留这种不寻常的搭配，不擅自改成单纯的物质赐福。
theological_decisions:
- issue: 借着祭司向主献初产之物的族长时代礼仪表述
  choice: 按希腊文本直译，保留“借着祭司献给主”
  alternative: 为与《创世记》的叙事框架协调而淡化或省略祭司
  rationale: 现有希腊原文明确提到祭司；忠实翻译应保留文本本身的礼仪框架，而不暗中作历史协调。
- issue: ἁπλότης 所表达的核心美德
  choice: 统一译为“纯朴”
  alternative: 分别按语境译为“真诚”“专一”或“正直”
  rationale: 统一措辞能保留本章反复强调的主题，同时“纯朴”避免将其限定为某一宗派性的德性解释。
- issue: 第7节上帝与人的纯朴“同工/相助”的表述
  choice: 译为“上帝使我的纯朴得着助益”
  alternative: 译为“上帝因我的纯朴而帮助我”或改写为物质赐福
  rationale: 原文语法将“纯朴”置于 συνεργεῖ 的与格关系中。所选译法保留神的主动帮助，也不把因果关系说得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。保留“正直的心”“纯朴”“初产之物”等遗训文学与经文传统中的关键词；对劳作、婚姻欢愉和祭司礼仪的表达力求清楚而不粗俗。第7节严格依据用户所给希腊正文，而不以英文咨询层的不同结尾替换原文。
