  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b]. And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will serve their enemies. Therefore you also tell these things to your children, so that, if they sin, they may return more quickly to the Lord[c], because he is merciful and will deliver them, to bring them back into their land[d].
translation:
  language: zh_hans
  text: 6 1 所以，我的孩子们，你们要知道：在末后的时期，你们的儿子必离弃纯一，依附贪婪；他们丢弃纯真[a]，转向诡诈；又离弃主的诫命，依附彼列亚[b]。2 他们不再耕种，反倒追随自己的邪恶图谋；他们必分散在列国中，服事自己的仇敌。3 所以，你们也要把这些事告诉你们的孩子，好让他们若犯了罪，就更快回转归向主[c]。4 因为他有怜悯，必救他们，使他们回到自己的土地[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯真”（ἀκακία）也可译作“无诡诈”或“无恶意”，重点是不存欺骗和害人之心。
    reason: lexical_alternative
  - marker: b
    text: “彼列亚”是此处希腊文名字Βελίαρ的音译；这个名字也常译作“彼列”。
    reason: lexical_alternative
  - marker: c
    text: “回转归向主”既有悔改之意，也包含与主恢复关系的意思。
    reason: cross_reference
  - marker: d
    text: 末句的紧缩结构也可理解为：“并使他们重归自己的土地。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἁπλότης
  choice: 纯一
  rationale: 本词在《以萨迦遗训》中是主题性美德，强调心志单纯、不分裂，而非幼稚或缺乏见识；“纯一”能与后文的贪婪形成道德对照。
- source_word: ἀπληστία
  choice: 贪婪
  rationale: 指贪得无厌、攫取不止的欲望；“贪婪”是现代汉语中自然且具有明确道德分量的表达。
- source_word: ἀκακία
  choice: 纯真
  rationale: 可指无恶意、无诡诈；“纯真”在正文中自然，并与“诡诈”形成鲜明对照，脚注保留“无诡诈”的具体语义。
- source_word: πανουργία
  choice: 诡诈
  rationale: 指带有不正当目的的机巧与狡猾；“诡诈”保留其负面道德色彩，并与ἀκακία相对。
- source_word: κολλάω / κολληθήσονται
  choice: 依附
  rationale: 同一动词先用于“贪婪”，后用于“彼列亚”；重复译作“依附”，保留原文关于归属与效忠转移的修辞平行。
- source_word: Βελίαρ
  choice: 彼列亚
  rationale: 按此处希腊文Βελίαρ音译，不直接规范为较熟悉的“彼列”；脚注说明异名，保持源本文本形态。
- source_word: γεωργεῖν
  choice: 耕种
  rationale: 指从事农业和耕作土地；“耕种”具体、简洁，也契合本书以萨迦朴实劳作的主题。
- source_word: πονηροῖς διαβουλίοις
  choice: 邪恶图谋
  rationale: 该短语指道德败坏的盘算或谋划；“邪恶图谋”保留主动策划恶事的意味。
- source_word: διασπαρήσονται
  choice: 必分散
  rationale: 被动将来时描述散居列国的处境；“分散”清楚保留流散和被驱散的意味。
- source_word: δουλεύσουσιν
  choice: 服事
  rationale: 动词可涵盖服役、受辖制甚至为奴；“服事自己的仇敌”贴近原文表达，同时不把语义强行限定为法定奴隶身份。
- source_word: τάχιον
  choice: 更快
  rationale: 忠实反映比较级副词的形式，表达犯罪后应迅速回转的劝勉。
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: 回转归向主
  rationale: ἐπιστρέφω兼有转回、悔改和恢复关系的含义；“回转归向主”在现代汉语中保留其道德与关系层面的双重意味。
theological_decisions:
- issue: ἐν ἐσχάτοις καιροῖς的力度
  choice: 在末后的时期
  alternative: 在后来的时期；在末世
  rationale: 该短语可泛指未来的末后日子，不必预设一套具体的末世时间表；“末后的时期”保留遗训式预言语气而不作过度界定。
- issue: τοῦ ἐπιστρέψαι αὐτοὺς εἰς τὴν γῆν αὐτῶν的句法关系
  choice: 使他们回到自己的土地
  alternative: 并使他们重归自己的土地；当他使他们回到自己的土地时
  rationale: 希腊文不定式结构紧缩，可表达目的或结果；正文以“使”连接神的拯救与归回，脚注保留并列性理解，避免消除原文歧义。
- issue: ἐπιστρέφω的悔改与归回意涵
  choice: 回转归向主
  alternative: 回到主那里
  rationale: 此处既有悔改的道德意涵，也有关系恢复的意涵；译文同时保留二者，不把它缩减为单纯空间移动。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“纯一—贪婪”“纯真—诡诈”的对应保留原文美德与恶行的鲜明对照，并重复“依附”以呈现修辞平行。章节与节号按出版体例列出；所有脚注标记均已置于正文相应位置。
