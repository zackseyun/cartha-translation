base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004.yaml
  text: He does not envy in his deliberations[a], nor does malicious envy consume his soul, nor is there distraction in greed in his mind. But he walks in simplicity of soul; he sees everything with uprightness of heart, not accepting evil eyes from the world’s error[b], so that he may not see the commandments of the Lord as distorted.
translation:
  language: zh_hans
  text: 5 他谋划时并不嫉妒；恶毒的嫉妒也不消磨他的心灵[a]；他的心思也不因贪得无厌而纷乱。6 他却以单纯的心灵行事，以正直的内心看待一切；他不接受出于世上迷误的恶眼[b]，免得他把主的诫命看成扭曲的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶毒的嫉妒也不消磨他的心灵”一句在印行的希腊文本中置于方括号内，可能是文本扩展；本译文仍按这一见证收入正文。
    reason: textual_variant
  - marker: b
    text: “恶眼”也可能令人联想到一种习语，指怀着敌意或嫉妒的眼光。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῖ ἐν διαβουλίοις
  choice: 谋划时并不嫉妒
  rationale: ζηλοῖ在此列举恶行的语境中表示嫉妒；διαβουλίοις指思量、谋划的领域。译文用时间兼情境表达，使现代汉语自然，同时保留内在筹谋之意。
- source_word: βάσκανος ἐκτήκει τὴν ψυχὴν αὐτοῦ
  choice: 恶毒的嫉妒也不消磨他的心灵
  rationale: βάσκανος带有恶意、嫉妒或恶眼色彩；ἐκτήκει表示逐渐耗损。译作“消磨”保留持续侵蚀的意味，并避免与后文“恶眼”完全重复。
- source_word: περισπασμὸς ἐν ἀπληστείᾳ ἐν νοΐ
  choice: 他的心思也不因贪得无厌而纷乱
  rationale: περισπασμός是被牵扯、分心或纷乱；ἀπληστία强调不知满足、贪求无度。“贪得无厌”比单说“贪婪”更充分呈现其不满足的词义。
- source_word: ἁπλότητι ψυχῆς
  choice: 以单纯的心灵
  rationale: 保留本书伦理语境中的“单纯”主题，不将其窄化为诚实或专一。
- source_word: εὐθύτητι καρδίας
  choice: 以正直的内心
  rationale: 表达内在道德上的正直；“内心”在现代汉语中比直译“心”更自然，同时保留καρδία的内在人格含义。
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηρούς
  choice: 不接受……恶眼
  rationale: ἐπιδέχομαι表示接纳、容受；保留“恶眼”的具体意象及其可能的嫉妒、敌意习语色彩，不径自化解为某一种解释。
- source_word: πλάνης τοῦ κόσμου
  choice: 世上迷误
  rationale: πλάνη兼有迷失、错误和欺骗的可能。“迷误”保留其认知与道德双重色彩；“世上”自然表达τοῦ κόσμου。
- source_word: ἵνα μὴ ἴδῃ διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου
  choice: 免得他把主的诫命看成扭曲的
  rationale: 句法重点是人的观看或理解受到扭曲，而非断言诫命本身扭曲。用“看成”准确表达感知层面的偏差。
theological_decisions:
- issue: 格言中省略而延续的主语
  choice: 用第三人称单数“他”描写这种人
  alternative: 译为泛指的“人”，或改作第二人称劝诫
  rationale: 希腊文采用格言式第三人称，描绘具有单纯、正直品格的人；保留“他”可维持遗训体的品格画像，不把陈述改写为直接命令。
- issue: 主的诫命是否本身被扭曲
  choice: 译为人把诫命“看成扭曲的”
  alternative: 译为“看见主那些被扭曲的诫命”
  rationale: ἴδῃ与宾语、表语性形容词的关系允许感知性理解；上下文将危险归于世上的迷误和恶眼，因此不暗示主的诫命本身有缺陷。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“心灵”“正直”“恶眼”“主的诫命”等伦理与宗教意象；以分号呈现原文并列层次。脚注次序按正文实际所注内容排列，避免英文咨询层中标记与脚注内容错置的问题。
