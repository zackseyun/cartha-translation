base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/002.yaml
  text: And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God.
translation:
  language: zh_hans
  text: 你们必成为他们所憎恶的对象，也必从上帝公义的审判领受责难和永远的羞耻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βδέλυγμα
  choice: 所憎恶的
  rationale: 表达“可憎之物、令人厌恶者”的强烈贬斥含义；结合 αὐτοῖς 译为“他们所憎恶的”，比直译“可憎之物”更符合现代汉语。
- source_word: ὄνειδος
  choice: 凌辱
  rationale: 兼顾公开受辱、遭责难与蒙羞的语义，语体庄重而自然。
- source_word: αἰσχύνην αἰώνιον
  choice: 永远的羞耻
  rationale: 保留 αἰώνιον 的持续性和审判语境中的严肃力度，不将其弱化为暂时的羞愧。
- source_word: δικαιοκρισίας
  choice: 公义的审判
  rationale: 该词兼含“公义”与“审判”两层意义，此译法准确保留其复合语义。
theological_decisions:
- issue: 凌辱和永远羞耻的来源
  choice: 从上帝公义的审判中承受
  alternative: 受上帝公义的审判，承受
  rationale: 保留希腊文 παρὰ τῆς δικαιοκρισίας τοῦ Θεοῦ 所表达的来源关系，不把“上帝的审判”改写成较强的直接施事结构。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语；保留原文第二人称复数“你们”及审判宣告的严厉语气。
