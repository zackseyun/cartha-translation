base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/004.yaml
  text: And if it were not for Abraham and Isaac and Jacob, our fathers, you would receive no mercy; not one of your seed would be left on the earth.
translation:
  language: zh_hans
  text: 若不是因亚伯拉罕、以撒和雅各——我们的先祖——你们就得不到怜悯；你们的后裔中，必没有一人能留在地上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: 因亚伯拉罕、以撒和雅各
  rationale: διά加宾格在此表示缘故或所凭借的关系；译作“因”简洁自然，并保留怜悯临到与先祖有关的含义，而不进一步界定其机制。
- source_word: τῶν πατέρων ἡμῶν
  choice: 我们的先祖
  rationale: 作为亚伯拉罕、以撒和雅各的同位说明；“先祖”比直译“父亲们”更符合现代汉语族长语境。
- source_word: ἔλεος λήψεσθε
  choice: 你们就得不到怜悯
  rationale: 在εἰ μὴ条件结构中按反事实语义表达；“得到怜悯”准确传达“领受怜悯”。
- source_word: ἐκ τοῦ σπέρματος ὑμῶν
  choice: 你们的后裔中
  rationale: σπέρμα在谱系语境中指后代；译为“后裔”自然且庄重。
- source_word: οὐ μὴ καταλειφθῇ
  choice: 必没有一人能留
  rationale: οὐ μή加强否定，故用“必没有”体现强烈断言；被动式καταλειφθῇ以汉语自然表达为“能留”。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 保留原文的一般性空间表达，不擅自具体化为某一地域。
theological_decisions:
- issue: 先祖与后代得蒙怜悯之间的关系
  choice: 译作“因亚伯拉罕、以撒和雅各……得到怜悯”
  alternative: “看在亚伯拉罕、以撒和雅各的份上”
  rationale: “因”保留原文διά所容许的缘故、关联或中介色彩，不把它明确解释为功德、代求或盟约机制。
- issue: 末句否定的力度
  choice: “必没有一人能留在地上”
  alternative: “没有一个会被留在地上”
  rationale: 以“必没有”呈现οὐ μή的强烈否定，同时避免添加关于神学意义上“余民”的专门术语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以破折号标示“我们的先祖”为同位语，并以分号衔接怜悯与存留两项结果。正文无脚注标记，因为没有设置脚注。
