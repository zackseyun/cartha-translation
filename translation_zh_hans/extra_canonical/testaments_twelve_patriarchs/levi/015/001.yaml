base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/001.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness, and you will be taken captive to all the nations.
translation:
  language: zh_hans
  text: 因此，主所要拣选的圣殿必在你们的污秽中变为荒凉；你们也必被掳到万国。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ναός
  choice: 圣殿
  rationale: 此处指主所拣选的敬拜殿宇；“圣殿”符合中文圣经语域，也区别于一般庙宇。
- source_word: ἐκλέξεται
  choice: 所要拣选的
  rationale: 保留希腊文将来时和选择之意，不把对象或历史指向具体化。
- source_word: ἔρημος ἔσται
  choice: 必……荒废
  rationale: 表达将成为荒凉、无人之地的结果；“荒废”用于圣殿自然且庄重。
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: 因你们的污秽
  rationale: ἐν 在此可表达伴随、处境或原因；正文采用自然的因果表达，但不进一步限定污秽属于礼仪、道德或其他类别。
- source_word: αἰχμάλωτοι ἔσεσθε
  choice: 必被掳
  rationale: 将希腊文“成为俘虏”的状态用自然中文被动式表达。
- source_word: εἰς πάντα τὰ ἔθνη
  choice: 到万国中
  rationale: 保留 εἰς 的去向意义，同时以“中”表达被分散安置于列国之中的自然中文含义。
theological_decisions:
- issue: “污秽”与圣殿荒废的关系
  choice: 译作“必因你们的污秽而荒废”
  alternative: “必在你们的污秽中荒废”
  rationale: 前者在现代汉语中更通顺，并反映上下文可能具有的因果关联；但不将“污秽”解释为某一特定神学类别。
- issue: 圣殿的历史身份
  choice: 不指明具体是哪一座圣殿
  alternative: 明确译成第一圣殿或第二圣殿
  rationale: 原文只说“主所要拣选的圣殿”，应保留其指称空间，不加入原文没有说明的历史认定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留预言语气，以“必”对应将来陈述。句中用分号清楚区分圣殿荒废与百姓被掳两个并列后果。
