  text: Διὰ¹ τοῦτο² *ὁ ναός³, ὃν⁴ ἐκλέξεται⁵ κύριος⁶, *ἔρημος ἔσται⁷ *ἐν τῇ ἀκαθαρσίᾳ ὑμῶν⁸, καὶ ὑμεῖς αἰχμάλωτοι ἔσεσθε εἰς πάντα τὰ ἔθνη.
