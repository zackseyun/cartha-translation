base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/004.yaml
  text: But I tell you that because of him, your holy places will be laid waste to the ground.
translation:
  language: zh_hans
  text: 但我告诉你们：因着他，你们的圣所必荒废，夷为平地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ αὐτόν
  choice: 因着他
  rationale: 保留希腊文的第三人称单数指代及因果关系，不擅自明确其所指。
- source_word: τὰ ἅγια ὑμῶν
  choice: 你们的圣所
  rationale: 此处中性复数名词可指圣物或圣地；结合其将荒废并夷至地面的语境，译作集合意义的“圣所”较自然，同时避免额外限定为某一座建筑。
- source_word: ἔρημα
  choice: 荒废
  rationale: 表达无人、荒凉、被毁弃的状态，并与后面的“夷为平地”自然衔接。
- source_word: ἕως ἐδάφους
  choice: 夷为平地
  rationale: 按上下文传达毁坏直达地面的结果；采用现代汉语中自然而庄重的表达。
theological_decisions:
- issue: “他”的身份
  choice: 保留“他”
  alternative: 根据上下文补明具体人物或对象
  rationale: 本节希腊文本仅用代词 αὐτόν；为保留原文指代关系和可能的歧义，不在译文中补释。
- issue: τὰ ἅγια 的具体范围
  choice: 译作“圣所”
  alternative: 译作“圣物”或“圣地”
  rationale: 与“荒废”“直到地面”的空间性描写最吻合，但不将其收窄为特定圣殿或宗派性概念。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“但我告诉你们”保留转折与郑重告知的语气；冒号清楚引出宣告内容。
