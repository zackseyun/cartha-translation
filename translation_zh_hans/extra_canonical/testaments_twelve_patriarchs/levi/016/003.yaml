  text: '[Καὶ ἄνδρα καινοποιοῦντα¹⁵ νόμον *ἐν δυνάμει ὑψίστου¹⁶ πλάνου¹⁷ προσαγορεύσετε, καὶ τέλος †ὁρμήσετε τοῦ ἀποκτεῖναι¹⁸ αὐτόν, οὐκ εἰδότες¹⁹ αὐτοῦ τὸ ἀνάστημα†²⁰, τὸ²¹ ἀθῷον αἷμα²² *ἐν κακίᾳ²³ ἐπὶ τῆς²⁴ κεφαλῆς²⁵ ὑμῶν ἀναδεχόμενοι²⁶.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/003.yaml
  text: '[And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his rising, taking innocent blood in wickedness upon your heads.]'
translation:
  language: zh_hans
  text: 你们会把一个靠至高者的能力更新律法[a]的人称为迷惑者；最后，你们会冲上去杀他，却不知道他的身量[b]，又怀着恶意，把无辜的血担在你们自己头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更新律法”也可译作“使律法成为新的”。本句希腊文本的词序和传本有不确定之处。
    reason: 说明καινοποιοῦντα νόμον的语义范围及该段文本状态，而不在正文中武断重构。
  - marker: b
    text: “身量”原文也可指身高、形貌或地位；这里的确切含义不明确。
    reason: 保留ἀνάστημα的真实词义歧义，避免直接解释为身份、尊荣或复活。
lexical_decisions:
- source_word: καινοποιοῦντα νόμον
  choice: 更新律法
  rationale: καινοποιέω表示“使之更新、使之成为新的”；译作“更新律法”既自然，也不预先判定是恢复、改革还是另立律法。
- source_word: ἐν δυνάμει ὑψίστου
  choice: 靠至高者的能力
  rationale: 保留“至高者”这一称号，并用“靠”自然表达ἐν在能力或凭借意义上的用法。
- source_word: πλάνου
  choice: 迷惑人的
  rationale: 在πλάνος的名词性用法中，可指骗子、诱惑者或使人误入歧途者；“迷惑人的”保留其指控意味而不过度限定为诈骗。
- source_word: ἀνάστημα
  choice: 身量
  rationale: 该词通常指身高、身量或体格，也可延伸指人的形貌或地位；直译“身量”以保留此处难解性。
- source_word: τὸ ἀθῷον αἷμα ... ἐπὶ τῆς κεφαλῆς ὑμῶν ἀναδεχόμενοι
  choice: 使无辜的血归在你们自己头上
  rationale: 采用现代汉语中可理解的责任归属表达，保留“血在头上”的司法与罪责意象。
theological_decisions:
- issue: “不知道他的身量”是否应解释为不知道其复活、身份或尊荣
  choice: 正文保留“身量”
  alternative: 译为“不知道他的身份／尊荣”或“不知道他的复起”
  rationale: ἀνάστημα在现存希腊文本中首先是身量、身高或形貌；上下文虽可能诱发基督论解释，但原词本身不足以确定该解释，故不在正文中消除歧义。
- issue: “更新律法”是否意味着废除或另立律法
  choice: 译作“更新律法”
  alternative: 译作“另立新法”或“恢复律法”
  rationale: 原文仅说使律法成为新的，未明确说明废除、取代或恢复，因此避免加入特定神学立场。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“冲上去杀他”传达ὁρμήσετε的猛烈行动感；“使无辜的血归在你们自己头上”保留古代罪责意象，同时让普通读者能够理解。
