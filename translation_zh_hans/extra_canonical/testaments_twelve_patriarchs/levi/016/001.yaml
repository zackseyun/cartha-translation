source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν *ἐγὼ ἔγνωκα¹ ὅτι ἑβδομήκοντα ἑβδομάδας² πλανηθήσεσθε³, καὶ τὴν ἱερωσύνην βεβηλώσετε⁴ καὶ *τὰ θυσιαστήρια⁵ μιανεῖτε⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/001.yaml
  text: And now I know that for seventy weeks you will go astray, and you will profane the priesthood and defile the altars.
translation:
  language: zh_hans
  text: 如今我知道：你们将在七十周[a]期间走入歧途，并亵渎祭司职分，玷污众祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “七十周”所译的希腊语按字面也可指“七十个七”的单位。本节本身没有说明这些“七”应按普通的周、年期，还是其他象征性时期来理解。
    reason: 保留ἑβδομήκοντα ἑβδομάδας作为“周”的通常词义，同时说明其“七”的单位及具体时长在本节中未获界定。
lexical_decisions:
- source_word: ἔγνωκα
  choice: 我知道
  rationale: 完成时在此表达已经获得、现今持有的认识；现代汉语用“我知道”自然传达其当前结果。
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: 七十个七期
  rationale: 保留原文以“七”为单位的时间表达及其解释空间，不直接定为“周”或“年期”。
- source_word: πλανηθήσεσθε
  choice: 你们将偏离正道
  rationale: 该动词可指迷失、受迷惑或走入歧途；“偏离正道”符合此处预言性的伦理与宗教语境，又不额外指定原因。
- source_word: ἱερωσύνην
  choice: 祭司职分
  rationale: 指祭司身份、职任或制度；“祭司职分”在本句中比抽象的“祭司体系”自然，并保留其职务性质。
- source_word: βεβηλώσετε
  choice: 亵渎
  rationale: 准确表达使神圣之物世俗化、冒犯其圣洁的含义。
- source_word: θυσιαστήρια
  choice: 众祭坛
  rationale: 原文为带冠词的复数；“众祭坛”明确保留复数。
- source_word: μιανεῖτε
  choice: 玷污
  rationale: 传达礼仪及道德上的污秽，不将含义缩窄为物理污染。
theological_decisions:
- issue: “七十个七期”的具体时间长度
  choice: 正文保留“七十个七期”，并以脚注说明
  alternative: 七十周；七十个七年期
  rationale: 希腊语按字面为“七十个七”，本节自身未明确每一“七期”的长度；不宜在正文中消除其时间单位的歧义。
- issue: πλανηθήσεσθε所表示的主动性
  choice: 译为“将偏离正道”
  alternative: 将受迷惑；将迷失
  rationale: 希腊语形式可呈现被引入歧途或陷入迷误的意味；中文采用不明说外在施动者的表达，避免替原文确定责任机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“现在我知道”紧贴原文开头；两个并列动词“亵渎、玷污”保持简洁有力。正文避免古奥的“七十个七”，改用较可理解的“七十个七期”，并以脚注保存字面形式和歧义。
