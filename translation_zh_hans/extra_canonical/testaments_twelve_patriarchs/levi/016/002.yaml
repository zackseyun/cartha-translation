  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ τὸν νόμον ἀθετήσετε⁷ καὶ λόγους προφητῶν ἐξουδενώσετε⁸ *ἐν διαστροφῇ κακῇ⁹. *διώξετε δὲ¹⁰ ἄνδρας¹¹ δικαίους, καὶ εὐσεβεῖς μισήσετε¹², ἀληθινῶν¹³ λόγους βδελύξεσθε¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/002.yaml
  text: And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.
translation:
  language: zh_hans
  text: 你们将废弃律法，在邪恶的悖谬中藐视先知的话。你们还将迫害义人，憎恨敬虔的人，并厌恶诚实人的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσετε
  choice: 废弃
  rationale: 表达拒绝、废除其效力之意；比单纯“不遵守”更贴近该动词的强烈语气。
- source_word: ἐξουδενώσετε
  choice: 藐视
  rationale: 保留“视为无足轻重、轻蔑对待”的含义，符合现代汉语经文语体。
- source_word: ἐν διαστροφῇ κακῇ
  choice: 在邪恶的悖谬中
  rationale: 较形式地保留介词结构及 διαστροφή 的扭曲、悖逆意味，不擅自限定其修饰范围。
- source_word: διώξετε
  choice: 迫害
  rationale: 在敌对义人的语境中，该词指追逼、迫害，而非中性的追赶。
- source_word: εὐσεβεῖς
  choice: 敬虔的人
  rationale: 准确传达对神虔敬、虔诚之人，采用自然且庄重的宗教汉语。
- source_word: βδελύξεσθε
  choice: 厌恶
  rationale: 传达强烈憎恶之意，同时避免“视为可憎”可能引入的礼仪性联想。
- source_word: ἀληθινῶν
  choice: 诚实人
  rationale: 该属格复数在语法上自然理解为“真实、诚实之人的”；保留其指人的可能性，并与 λόγους 构成“诚实人的话”。
theological_decisions:
- issue: νόμος 的所指与权威性质
  choice: 律法
  alternative: 法律／法则
  rationale: 上下文与“先知的话”并列，明显使用犹太经文传统中的“律法”；不进一步指定为摩西律法，以免超出原文。
- issue: ἐν διαστροφῇ κακῇ 的语义及修饰关系
  choice: 在邪恶的悖谬中
  alternative: 以邪恶的曲解／因邪恶败坏而
  rationale: 原文短语与前句相连，但具体是方式、状态还是领域略有张力；直译式表达保留这种开放性。
- issue: ἀληθινῶν 是实体化形容词还是与省略名词搭配
  choice: 诚实人的话
  alternative: 真实的话
  rationale: ἀληθινῶν 为属格复数，而 λόγους 为宾格复数，不能直接作其定语；因此理解为实体化的“真实／诚实之人”更符合现存希腊文本。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“你们将……”维持预言式未来语气；三组行为依原文次序展开。未把“邪恶的悖谬”解释性改写为某种特定教义上的背道，也未将“诚实人”限定为先知或某一群体。
