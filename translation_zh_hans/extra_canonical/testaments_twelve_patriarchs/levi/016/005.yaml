base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/005.yaml
  text: And no clean place will be for you, but you will be among the nations of the earth for a curse and for scattering, until he himself visits again and shows compassion and receives you.
translation:
  language: zh_hans
  text: 你们将没有洁净之地，反要在列国中成为咒诅，并被分散，直到他亲自再次眷顾你们，怜悯你们，接纳你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τόπος ὑμῖν καθαρὸς οὐκ ἔσται
  choice: 你们将没有洁净之地
  rationale: 贴近希腊语“不会有洁净之地给你们”的结构，同时采用自然的现代汉语表达；不增添“存留”等原文没有的含义。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在列国中
  rationale: ἔθνη在此指外邦诸国或各民族；“列国”简洁庄重，也保留其群体性含义。
- source_word: εἰς κατάραν
  choice: 成为咒诅
  rationale: εἰς表示所落入的处境或结果；“成为咒诅”保留原文简练而强烈的措辞。
- source_word: εἰς διασκορπισμόν
  choice: 被分散
  rationale: διασκορπισμός意为分散、离散；译作被动状态符合上下文所描述的遭遇，并使汉语自然。
- source_word: ἐπισκέψηται
  choice: 眷顾你们
  rationale: 该动词可指探访、察看或施恩眷顾；与后面的怜悯、接纳并列时，“眷顾”最能传达带有行动意味的关怀。
- source_word: οἰκτειρήσῃ
  choice: 怜悯你们
  rationale: 直接表达因同情而施怜悯的意义。
- source_word: προσδέξηται
  choice: 接纳你们
  rationale: 可表达欢迎、接受；“接纳”符合复归语境，同时不额外说明接纳的具体方式。
theological_decisions:
- issue: ἐπισκέψηται的行动主体与受词
  choice: 译作“他亲自再次眷顾你们”
  alternative: “他自己再次临到，并施怜悯和接纳”
  rationale: 希腊语以αὐτός强调“他自己”，而后续动词的受词在句中省略，可由语境补出“你们”。译文保留主体指代为“他”，不擅自明确为某一神学称谓。
- issue: 惩罚与复归之间的张力
  choice: 保留“直到”所连接的受罚期限与后续怜悯
  alternative: 将“直到”弱化为一般时间顺序
  rationale: ἕως表明前述处境持续到神圣眷顾、怜悯和接纳发生之时；直译可保留审判与复归并存的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“列国”“眷顾”保留经文语体，但避免生僻或过度古雅；整体按希腊语语义推进，并适度调整为自然汉语。
