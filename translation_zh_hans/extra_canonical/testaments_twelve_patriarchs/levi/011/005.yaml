base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/005.yaml
  text: And I saw in the vision that he stood in the midst of the congregation, in the heights.
translation:
  language: zh_hans
  text: 我在异象中看见：他站在高处，在全体会众中间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在高处”也可理解为“在高位者中”；希腊原文含义有歧义。
    reason: ὑψηλοῖς在形式上既可能指高处，也可能指身份崇高者；脚注保留原文的真实歧义。
lexical_decisions:
- source_word: ἐν ὁράματι
  choice: 在异象中
  rationale: 按希腊语介词短语直译，表达先见者在异象中的观看经历。
- source_word: μέσος ... πάσης τῆς συναγωγῆς
  choice: 在全体会众中间
  rationale: μέσος与属格短语相连，表示处于整个聚集群体的中央；“全体会众”自然体现πάσης及συναγωγῆς。
- source_word: ἐν ὑψηλοῖς
  choice: 在高处
  rationale: 保留复数形容词名词化所表达的高处、高境之意，也与审校后的英语咨询层一致；不擅自把它解释为某一特定天界层次。
- source_word: ἵστατο
  choice: 站
  rationale: 未完成时在此描写异象中持续呈现的站立状态，现代汉语用“站”即可自然表达。
theological_decisions:
- issue: ἐν ὑψηλοῖς所指的是地点还是高位者
  choice: 正文译作“在高处”
  alternative: “在尊贵者中”或“在至高之处”
  rationale: 该形式可容许不同理解，但本句最直接的空间性读法是“在高处”；避免以“至高”引入特定神学称谓，也不把语法上未明确的对象指定为尊贵者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；以冒号呈现异象内容，并调整短语次序，使中文自然，同时保留“高处”与“全体会众中间”两个空间成分。
