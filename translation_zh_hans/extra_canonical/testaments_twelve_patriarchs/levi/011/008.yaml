- source_word: τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει
  choice: 那是我六十四岁时
  rationale: 保留年龄纪年含义，同时使中文自然清楚。
- source_word: ἔνδοξος
  choice: 享有尊荣
  rationale: 表达在群体中有荣耀、受尊重的地位，避免译成容易暗示声名远播的“著名”。
- source_word: ἐν μέσῳ τῶν ἀδελφῶν μου
  choice: 在众弟兄中
  rationale: 贴近希腊文空间性群体表达，并保留“弟兄”所指的男性手足关系。
