  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/003.yaml
  text: And I saw concerning him that he was not in the first rank.
translation:
  language: zh_hans
  text: 我又看见有关他的事：他不在第一等次之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον
  choice: 我又看出
  rationale: 这里可指视觉所见，也可指异象中的察知；“看出”在现代汉语中自然，并保留由观察而得知的意味。加“又”承接 καί 的叙事连接作用。
- source_word: περὶ αὐτόν
  choice: 关于他
  rationale: 按希腊语介词短语直译，保留其与后面宾语从句略显复沓却真实存在的句法结构。
- source_word: οὐκ ἔστιν
  choice: 他并不在
  rationale: 按上下文以 αὐτόν 所指人物为从句主语；现在时译作“并不在”，不擅自改成过去时。
- source_word: ἐν τῇ πρώτῃ τάξει
  choice: 在第一等次中
  rationale: τάξις 可表示次序、等级、班次或队列；“等次”兼顾等级和排列含义，不把它限定为军事“队列”或宗教“品级”。
theological_decisions:
- issue: “第一等次”的具体所指
  choice: 保留为“第一等次”，不具体解释其所属体系
  alternative: 第一品级／第一班次／第一队列
  rationale: 本句自身没有说明这是祭司品级、天使阶序、职分班次还是一般等级；译文应保留这一开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“关于他……他……”的原文句法痕迹，以免抹去 περὶ αὐτόν 的表达；不添加原文没有的解释。
