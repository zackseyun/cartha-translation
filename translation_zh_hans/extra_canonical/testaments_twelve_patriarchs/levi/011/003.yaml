  naturalness: 原译“我又看出，关于他，他并不在第一等次中”因“关于他，他”重复而不够自然，“第一等次中”也宜作“第一等次之中”。修订后保持庄重、现代且通顺的表达。
  terminology: “第一等次”可对应 τάξις 的“等级、序列、班次”等开放含义；不将其解释为特定宗教阶序、军事队列或职分。
