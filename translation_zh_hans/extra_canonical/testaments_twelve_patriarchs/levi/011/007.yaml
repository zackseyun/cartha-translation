lexical_decisions:
- source_word: τρίτον υἱὸν … τὸν Μεραρεῖ
  choice: 第三个儿子米拉利
  rationale: 保留序数和人名同位关系，以自然的现代汉语表达。
- source_word: τῷ τεσσαρακοστῷ ἔτει τῆς ζωῆς μου
  choice: 我四十岁那年
  rationale: 准确表达“我生命的第四十年”，同时避免生硬直译。
- source_word: ἐδυστόκησεν
  choice: 分娩艰难
  rationale: 该动词指难产或生产困难；此译法准确、自然，又不额外断定具体并发症。
- source_word: πικριασμός
  choice: 苦楚
  rationale: 该词表示苦涩、痛苦或苦楚；结合艰难分娩的语境，“苦楚”兼顾词义与命名解释。
