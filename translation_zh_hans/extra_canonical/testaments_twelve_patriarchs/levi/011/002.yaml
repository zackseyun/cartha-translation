lexical_decisions:
- source_word: συλλαβοῦσα ἔτεκεν υἱόν
  choice: 怀孕生了一个儿子
  rationale: 直接表达希腊文“受孕并生子”的连续动作，符合现代汉语习惯。
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ
  choice: 我给他取名叫
  rationale: 以自然的现代汉语表达闪语式的“称他的名为”，并保留第一人称主体。
- source_word: Γηρσάμ
  choice: 革舜
  rationale: 该希腊拼写对应《出埃及记》中摩西之子革舜的名字，采用现代中文圣经通行译名。
- source_word: ἐν γῇ παροικίας
  choice: 寄居在异乡
  rationale: παροικία表示侨居、寄居状态；结合ἐν γῇ，以“寄居在异乡”自然传达身处非本土之地的含义。
