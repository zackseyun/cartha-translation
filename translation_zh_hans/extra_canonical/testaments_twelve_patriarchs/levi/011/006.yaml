  text: '*Διὰ τοῦτο ἐκάλεσα τὸ ὄνομα αὐτοῦ Καάθ²¹, [ὅ ἐστιν ἀρχὴ μεγαλείου καὶ συμβιβασμός]²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/006.yaml
  text: Therefore I called his name Kohath, [which is, the beginning of majesty and uniting].
translation:
  language: zh_hans
  text: 因此，我给他起名叫哥辖。[a]【意思是“尊荣的开端与联合”。】[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哥辖”音译自希腊文 Καάθ，对应希伯来圣经中的“哥辖”（Kohath）。
    reason: 说明专名的来源和通行对应形式。
  - marker: b
    text: 现存希腊文版本将这句姓名释义置于方括号内，表示其文本地位存疑或受到编辑者特别标示。
    reason: 保留源文所呈现的文本批判信息，避免把括号内文字无条件视为确定正文。
lexical_decisions:
- source_word: Καάθ
  choice: 哥辖
  rationale: 采用现代中文圣经传统中对 Kohath 的通行译名，便于辨认其人物身份。
- source_word: ἀρχὴ μεγαλείου
  choice: 尊荣的开端
  rationale: ἀρχή 表示“开端、起始”，μεγαλεῖον 的属格在这里表示“伟大、尊荣、威荣”；“尊荣”既自然庄重，又避免把含义限定为政治权势。
- source_word: συμβιβασμός
  choice: 联合
  rationale: 该词可指结合、联合，也可依语境含和解之意；此处单独出现，译作较宽泛的“联合”，保留其语义空间，不擅自增补“所有人”等原文未见的成分。
theological_decisions:
- issue: 姓名释义是否表达特定的救赎或普世和解教义
  choice: 按字面译为“尊荣的开端与联合”
  alternative: 译为“尊荣的开端与万有的和解”
  rationale: 所给希腊文本没有 πάσης（“一切的／万有的”），συμβιβασμός 本身也不足以确定为末世性的“和解”；因此不补入特定神学对象或结论。
- issue: 方括号内姓名释义的文本地位
  choice: 在正文中保留括号区隔，并加注说明
  alternative: 不加区隔地并入正文
  rationale: 源文本身把整段释义置于方括号内；译文应保留这一编辑标识所反映的文本不确定性，而不把它静默处理成无争议正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“给他起名叫”符合当代中文叙事习惯；释名部分使用引号标明所解释的含义，并以方头括号保留希腊版的编辑性括号，与脚注标记区分。
