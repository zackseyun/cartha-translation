  text: '1[a]. And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity according to all his law. 2. And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing. 3. For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes. 4[b]. Indeed, he will gain many friends more than parents, and many among men will desire to serve him and to hear the law from his mouth. 5. Therefore do righteousness, my children, upon the earth, so that you may find it in the heavens. 6. And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction. 7. Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perishes, no one can take away the wise man''s wisdom, except
    the blindness of ungodliness and the hardening of sin. 8. For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend. 9. Everyone who teaches good things and does them will share the throne of kings[c], just as Joseph my brother also did.'
translation:
  language: zh_hans
  text: '《利未遗训》第13章


    1 现在，我的孩子们，我吩咐你们：要全心敬畏主你们的上帝，按照他全部的律法，以纯一的心行事。2 你们也要教儿女识字，使他们一生都有悟性，不住地诵读上帝的律法。3 因为凡认识主律法的人，都必受尊重；无论到哪里，都不至于被当作外人。4 他甚至会得到许多朋友，朋友比父母还多[a]；世人中也有许多人愿意服侍他，听他口中所讲的律法。5 所以，我的孩子们，要在地上行义，好使你们在天上寻见所行的义[b]。6 要把善种在你们心灵里，你们必在一生中寻见善；但你们若种下恶，就必收割种种动乱和患难。7 你们要在敬畏上帝中获得智慧；因为若有被掳之事临到，城邑和土地遭毁灭，金银和一切财物都消失，也没有人能夺走智者的智慧，除非是不敬虔所造成的瞎眼和罪所造成的心硬。8 一个人若保守自己，远离这些恶行，智慧就会使他即使在敌人中也显得光辉；异乡会成为他的家乡，在仇敌中他也会被视为朋友[c]。9 凡教导善事又付诸实行的人，必与君王同坐宝座，正如我的兄弟约瑟一样。


    [a] “得到许多朋友，朋友比父母还多”原文含义不十分明确，可能是说有学识的人所得的朋友超出家庭圈子，或所得的友谊多于单凭父母地位通常能带来的关系。


    [b] 希腊文直译为“要行义……好使你们在天上寻见”，其中“寻见”的宾语没有明说；这里依上下文补作“所行的义”。


    [c] 第8节的希腊文非常凝练：智慧在敌人中“显得光辉”，人在异乡也能有“家乡”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得到许多朋友，朋友比父母还多”原文含义不十分明确，可能是说有学识的人所得的朋友超出家庭圈子，或所得的友谊多于单凭父母地位通常能带来的关系。
    reason: 保留ὑπὲρ γονεῖς这一困难比较结构的歧义，并说明正文为求汉语通顺所作的最低限度调整。
  - marker: b
    text: 希腊文直译为“要行义……好使你们在天上寻见”，其中“寻见”的宾语没有明说；这里依上下文补作“所行的义”。
    reason: 说明原文宾语省略，避免把天上的报偿具体化。
  - marker: c
    text: 第8节的希腊文非常凝练：智慧在敌人中“显得光辉”，人在异乡也能有“家乡”。
    reason: 提示原文的省略式平行结构以及译文所作的最少量句法展开。
lexical_decisions:
- source_word: ἁπλότης
  choice: 纯一的心
  rationale: 保留专一、不分心且正直坦诚行事的伦理意味，避免译成现代汉语中容易被理解为缺乏心机或见识的“单纯”。
- source_word: γράμματα
  choice: 识字
  rationale: 此处具体指字母和基础读写能力；结合下文不断诵读律法，译为“教儿女识字”最自然。
- source_word: σύνεσις
  choice: 悟性
  rationale: 兼顾理解力与道德辨识力，也符合教育和阅读律法的语境。
- source_word: ξένος
  choice: 外人
  rationale: 表达一个人在所到之处不被视作陌生人或局外人的社会归属意味。
- source_word: δουλεῦσαι
  choice: 服侍
  rationale: 动词可指为奴，但此处处于智者受尊敬、有人听其教导的语境，宜保留较宽泛的“服侍”。
- source_word: δικαιοσύνη
  choice: 行义
  rationale: 这里强调在地上实行正直公义的行为；“行义”既保留宗教伦理色彩，也适合作命令语。
- source_word: ψυχαῖς
  choice: 心灵
  rationale: 保留向人的内在生命撒种的比喻，同时比“灵魂”更符合当代汉语劝诫文体。
- source_word: ταραχή
  choice: 动乱
  rationale: 可涵盖内外的扰乱与不安，并与“患难”形成自然搭配。
- source_word: κτήσασθε
  choice: 获得
  rationale: 表达把智慧作为珍贵财富取得的命令意味，同时保持现代汉语自然。
- source_word: φόβῳ Θεοῦ
  choice: 敬畏上帝
  rationale: 保留圣经传统中兼具畏惧、尊崇和顺服的表达。
- source_word: πώρωσις
  choice: 心硬
  rationale: 准确传达道德与属灵上的麻木刚硬，也保持常见的圣经汉语用语。
- source_word: παρὰ τοῖς πολεμίοις λαμπρά
  choice: 即使在敌人中也显得光辉
  rationale: 保留原文高度压缩的表述，表达智慧在敌对环境中仍有光彩、受人看重。
- source_word: σύνθρονος
  choice: 与君王同坐宝座
  rationale: 表达“同坐王位、共享宝座”的意思，不把原文擅自解释为统治权的具体形式。
theological_decisions:
- issue: “在地上行义……在天上寻见”的报偿关系
  choice: 译作“在地上行义，好使你们在天上寻见所行的义”，并以脚注说明宾语为补出。
  alternative: “好使你们在天上寻见财宝”或“好使你们在天上被寻见”。
  rationale: εὕρητε之后没有明说宾语；上下文最自然地回指δικαιοσύνη，但不应进一步指定为“财宝”或解决其报偿机制。
- issue: 第7节“除非不敬虔所造成的瞎眼和罪所造成的心硬”的范围
  choice: 理解为外在力量不能夺走智慧，唯有人的道德属灵败坏能使其丧失。
  alternative: 把这些恶德理解为拟人化的外在势力，或把整句视作后加解释。
  rationale: 句法将“瞎眼”和“心硬”列作唯一例外；译文保留这一伦理警告，不作来源或教义上的推断。
- issue: 第9节与君王“同坐宝座”
  choice: 保留与君王共享宝座或同席王位的高举意象。
  alternative: 泛化为“受君王尊荣”或具体化为“与君王一同统治”。
  rationale: σύνθρονος本身是宝座意象；译文既不削弱为一般尊荣，也不额外规定政治或末世论含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。命令句保持遗训体的郑重语气；保留“律法、行义、敬畏、心硬、宝座”等圣经语汇，但避免过度文言化。第4、5、8节原文的压缩与歧义通过脚注说明，正文以尽量少的补足保证可读性。
