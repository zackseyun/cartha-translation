  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/001.yaml
  text: A copy of the words of Levi, which he ordained for his sons about all that they would do, and all that would happen to them[a] until the day of judgment.
translation:
  language: zh_hans
  text: 利未的话语抄本：这是他为儿子们所定下的话，关乎他们将要做的一切，以及直到审判之日将临到他们的一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们将会遭遇的一切。”希腊语的表达直译为将来会与他们“相遇”的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 指所抄录、传存的一份文本；用“抄本”比“副本”更符合古代文献标题的语境。
- source_word: λόγων
  choice: 言辞
  rationale: λόγοι 在此指利未所说并传给儿子们的话；“言辞”既保留复数集合义，又适合庄重的遗训文体。
- source_word: διέθετο
  choice: 所吩咐的
  rationale: 此处可表示安排、规定或郑重嘱咐；结合父亲向儿子留下遗训的语境，译作“吩咐”自然且不额外引入“立约”含义。
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: 论到他们将要做的一切
  rationale: 保留 πάντα ἃ 的周全范围及 ποιήσουσιν 的将来意义。
- source_word: ὅσα συναντήσει αὐτοῖς
  choice: 他们将会遭遇的一切
  rationale: συναντάω 字面有“相遇”之意，在事件作主语时表示临到、遭逢；“遭遇”保留其习语意象并符合中文表达。
- source_word: ἕως ἡμέρας κρίσεως
  choice: 直到审判之日
  rationale: 直译时间界限与 κρίσις 的司法、末世审判含义，不进一步限定其神学细节。
theological_decisions:
- issue: “审判之日”的所指
  choice: 保留为“审判之日”
  alternative: 末日审判之日
  rationale: 原文只说 ἡμέρα κρίσεως，没有明确添加“末日”；直译可保留其末世色彩而不把解释写入正文。
- issue: διέθετο 是否含立约术语色彩
  choice: 译为“所吩咐的”
  alternative: 所安排的／所立定的
  rationale: 该动词语义较宽；上下文是利未给儿子们的话，译作“吩咐”不把可能但未明确的圣约含义强加给文本。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号呈现标题式开头和后续说明之间的关系；不将其改写成现代书名格式，以保留原文“抄本”的文献题记性质。
