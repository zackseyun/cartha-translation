base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/002.yaml
  text: 'For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: zh_hans
  text: 因为他召他们到自己身边时，身体还很健康；但他得了启示，知道自己快要死了。他们聚齐以后，他对他们说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: 身体还很健康
  rationale: 该分词在此描述利未当时身体状况良好；补出“身体”使现代汉语自然，并避免把它误解为属灵或教义上的“纯正”。
- source_word: ἀπεκαλύφθη
  choice: 得了启示
  rationale: 保留被动启示事件的含义，同时用自然汉语表达；原文没有说明启示者或启示方式，因此不补出。
- source_word: μέλλει ἀποθνήσκειν
  choice: 快要死了
  rationale: 准确表达即将发生的死亡，符合临终叙事语境。
- source_word: συνήχθησαν
  choice: 聚齐
  rationale: 表达众人受召后聚集到场的动作，简洁且承接上文复数宾语。
theological_decisions:
- issue: 启示的来源与方式
  choice: 不说明是谁启示，也不说明启示方式
  alternative: 译作“上帝启示他”或“有启示临到他”
  rationale: 希腊文仅用无人称被动 ἀπεκαλύφθη；补明上帝或具体方式会超出本节明说的内容。
- issue: 健康与死亡预告之间的张力
  choice: 保留“身体还很健康”却“快要死了”的并置
  alternative: 弱化为“尚能行动”或解释其死亡原因
  rationale: 原文有意陈述健康状态与获知死期并存，不应替作者消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“还”突出他在健康之时召集众人，与随后获知将死形成自然对照；句末冒号保留其引出后续遗言的功能。
