  text: 1 And as I was going to my father[a], I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, on the right of Abim. 2 And I kept these words in my heart. 3 After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous on account of the abomination which they had committed against my sister. 4 And I killed Shechem first, and Simeon killed Emmor. 5 And after this my brothers came and struck that city with the edge of the sword. 6 And my father heard these things, and being angry he was grieved because they had accepted circumcision and died, and in his blessings he passed over us. 7 For we sinned, because we had done this contrary to his judgment, though he became weak on that day. 8 But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them. 9 And
    they pursued Abraham our father when he was a stranger, and they oppressed his flocks when they were swollen with increase, and they cruelly mistreated Eblan his home-born servant. 10 And indeed in this way they used to act toward all strangers, seizing foreign women by force and driving them away[b][c][d][e]. 11 But the wrath of God came upon them completely.
translation:
  language: zh_hans
  text: '《利未遗训》第6章


    1 我往父亲那里去的时候，发现了一面青铜盾。因此，那座山名叫“亚斯庇”（意为“盾牌”）；它靠近基巴勒，在亚比玛的右边。2 我把这些话存在心里。


    3 此后，我同父亲和吕便商议，要告诉哈抹的众子不要受割礼，因为他们在我妹妹身上做了可憎之事，我为此义愤填膺。4 我先杀了示剑，西缅杀了哈抹。5 随后，我的兄弟们来到，用刀剑击杀了那座城的人。


    6 我父亲听见这些事，便发怒忧伤，因为他们接受了割礼，也死了；他赐福时便略过了我们。[a] 7 我们确实犯了罪，因为我们违背他的判断做了这事，尽管他在那一天也软弱了。[b] 8 但我看出，这是上帝所定、要降祸于他们的判决，因为他们曾想照对待我们妹妹底拿的方式对待撒拉和利百加；主却拦阻了他们。[c] 9 亚伯拉罕——我们的先祖——寄居异乡时，他们曾追赶他；他的羊群正兴旺增多，他们却加以侵害；他们还残酷虐待他家中所生的仆人伊布兰。[d] 10 他们向来这样对待所有外来人：仗势强抢外族女子，又把她们赶走。11 然而，上帝的烈怒彻底临到他们。[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “略过了我们”也可译作“不顾我们”。意思可能是雅各宣告祝福时，没有眷顾利未和西缅。
    reason: lexical_alternative
  - marker: b
    text: 译作“软弱了”的希腊词含义困难，也可能表示“心软了”“衰弱了”或“被压倒了”。
    reason: textual_variant
  - marker: c
    text: 本节句法和文本都有困难。现存希腊文似乎是说，示剑人曾想以对待底拿的方式对待撒拉和利百加。
    reason: textual_variant
  - marker: d
    text: “伊布兰”这一名字在抄本流传中并不确定；本句清楚表达的基本意思是，亚伯拉罕家中所生的一名仆人曾遭残酷虐待。
    reason: textual_variant
  - marker: e
    text: “烈怒……彻底临到”所对应的希腊习语也可表达烈怒最终或完全地临到，即最终或完全的审判。
    reason: cross_reference
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν / Ἄσπις
  choice: 铜盾／亚斯庇（意为“盾牌”）
  rationale: ἀσπίς通常指盾牌，χαλκῆν指铜或青铜材质；音译山名并点明词义，以保留发现盾牌与山名之间的缘起关系。
- source_word: συνετήρουν ... ἐν τῇ καρδίᾳ μου
  choice: 把这些话存在心里
  rationale: 保留希腊文表示内心牢记的惯用表达，同时符合现代汉语庄重叙事语体。
- source_word: συνεβούλευσα
  choice: 同……商议
  rationale: 表达共同谋议和审慎商量，而不把它弱化为单纯告知。
- source_word: μὴ περιτμηθῆναι αὐτούς
  choice: 不要受割礼
  rationale: 自然表达中间／被动不定式所指的接受割礼之事。
- source_word: ἐζήλωσα
  choice: 义愤填膺
  rationale: 语境所指是因妹妹遭受凌辱而产生的强烈义愤，并非嫉妒。
- source_word: βδέλυγμα
  choice: 可憎之事
  rationale: 保留原词强烈的道德厌恶色彩，又避免不自然的名词堆叠。
- source_word: ἐν στόματι μαχαίρας
  choice: 用刀剑击杀
  rationale: 这是闪语背景下“以刀剑之口”的惯用语；汉语以“用刀剑击杀”自然传达其杀戮含义。
- source_word: παρεῖδεν ἡμῖν
  choice: 略过了我们
  rationale: 在祝福语境中表示雅各没有眷顾或优待利未和西缅；正文保留简练表达，脚注说明可能译法。
- source_word: παρὰ γνώμην αὐτοῦ
  choice: 违背他的判断
  rationale: γνώμη在此包含审慎判断或决定，不仅是个人意见。
- source_word: ἐμαλακίσθη
  choice: 软弱了
  rationale: 该词及文本含义困难，可能指变软、衰弱或意志受挫；采用宽泛译法并以脚注保留不确定性。
- source_word: ἀπόφασις θεοῦ εἰς κακά
  choice: 上帝所定、要降祸于他们的判决
  rationale: 同时体现ἀπόφασις的裁定色彩和εἰς κακά的不利、降祸方向。
- source_word: τὰ ποίμνια ὀγκούμενα
  choice: 羊群正因怀胎而腹部隆起
  rationale: 直译其膨大状态，并依据牲畜语境以“怀胎”传达最可能的所指，不过度扩写为繁盛。
- source_word: ἐξενηλάτουν αὐτάς
  choice: 把她们赶走
  rationale: 保留动词“驱逐、赶走”的基本意义，也保留与前句“强抢”并列所形成的文本张力。
- source_word: ἔφθασε ... εἰς τέλος
  choice: 终于临到他们
  rationale: ἔφθασε表示临到，εἰς τέλος可表达彻底或最终性；“终于”自然呈现末后的审判意味。
theological_decisions:
- issue: 示剑城之毁灭兼具人的罪与上帝判决这两重陈述
  choice: 既译出“我们确实犯了罪”，也译出这是“上帝所定、要降祸于他们的判决”
  alternative: 把屠城完全说成正当行为，或完全排除上帝审判的层面
  rationale: 第7至11节有意并置人的悖逆犯罪与上帝对长期暴行的审判；译文不替原文消解这一神学张力。
- issue: 第8节撒拉和利百加的指涉
  choice: 保留具名陈述：他们意图像对待底拿一样对待撒拉和利百加
  alternative: 因句法和传抄困难而删去两个人名，或泛化为先祖的妇女
  rationale: 现存希腊见证明确列出撒拉和利百加；正文据此翻译，并用脚注披露文本困难。
- issue: 雅各在祝福中“略过”利未和西缅
  choice: 理解为没有在祝福中眷顾或优待他们
  alternative: 理解为雅各宽恕或不追究他们
  rationale: 上下文是雅各因他们的行为发怒忧伤，故“略过”较符合不予优待的语境，但脚注保留词义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。人物名尽量沿用中文圣经中较熟悉的译名（如吕便、哈抹、示剑、底拿、撒拉、利百加），来源不确定或缺乏固定译名者采用音译。叙事中的暴力不作淡化，但避免额外渲染；对第7至10节的词义和文本困难以正文克制翻译、脚注明示异读与不确定性。
