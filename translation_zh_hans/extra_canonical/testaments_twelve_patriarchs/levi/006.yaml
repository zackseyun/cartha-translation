- from: '《利未遗训》第6章


    1 我往父亲那里去的时候，发现了一面铜盾。因此，那座山名叫“亚斯庇”（意为“盾牌”）；它靠近基巴勒，在亚比玛的右边。2 我把这些话存在心里。


