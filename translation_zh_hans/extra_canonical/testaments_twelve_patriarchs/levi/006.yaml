    6 我父亲听见这些事，便发怒忧伤，因为他们接受了割礼，却仍死去；他赐福时便略过了我们。[a] 7 我们确实犯了罪，因为我们违背他的判断做了这事，尽管他在那一天也软弱了。[b] 8 但我看出，这是上帝所定、要降祸于他们的判决，因为他们曾想照对待我们妹妹底拿的方式对待撒拉和利百加；主却拦阻了他们。[c] 9 亚伯拉罕——我们的先祖——寄居异乡时，他们曾追赶他；他的羊群正因怀胎而腹部隆起，他们却加以侵害；他们还残酷虐待他家中所生的仆人伊布兰。[d] 10 他们向来这样对待所有外来人：仗势强抢外族女子，又把她们赶走。11 然而，上帝的烈怒终于临到他们。[e]'
