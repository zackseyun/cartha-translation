  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness[a], and you will be taken captive among all the nations. And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God. And all who hate you will rejoice over your destruction. And if it were not for Abraham and Isaac and Jacob our fathers, you would receive no mercy[b][c]; not one from your seed would be left upon the earth.
translation:
  language: zh_hans
  text: '**《利未遗训》第15章**


    1 因此，主将要拣选的圣殿[a]，必在你们的污秽中荒废；你们也必被掳到万国中。2 你们必成为他们所憎恶的对象，并因上帝公义的审判[b]而遭受辱骂和永远的羞耻。3 所有恨你们的人，都必因你们的毁灭而欢喜。4 若非藉着我们的祖先亚伯拉罕、以撒和雅各，你们本得不着怜悯；你们的后裔[c]中也绝不会有一人留在地上。


    [a] 或译“圣所”。希腊语 ναός 特指神圣的殿宇；在本段语境中指主所拣选的圣殿。


    [b] “公义的审判”也可译为“公正的审判”。


    [c] 原文直译为“种子”，在这里是表示血脉传承的盟约性用语，也可译为“子孙”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣所”。希腊语 ναός 特指神圣的殿宇；在本段语境中指主所拣选的圣殿。
    reason: lexical_alternative
  - marker: b
    text: “公义的审判”也可译为“公正的审判”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“种子”，在这里是表示血脉传承的盟约性用语，也可译为“子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναός
  choice: 圣殿
  rationale: 该词特指神圣殿宇；在犹太遗训语境中自然指主所拣选的耶路撒冷圣殿。“圣殿”既准确又符合现代汉语圣经文体。
- source_word: ἐκλέξεται
  choice: 将要拣选
  rationale: 保留将来时和主主动选择敬拜之所的盟约意涵；“拣选”庄重而不晦涩。
- source_word: ἔρημος ἔσται
  choice: 必……荒废
  rationale: 表达受审判后荒凉、无人使用的状态，也保留先知性警告的力度。
- source_word: ἀκαθαρσία
  choice: 污秽
  rationale: 该词兼有礼仪与道德不洁的含义；“污秽”能保留两方面的张力。
- source_word: αἰχμάλωτοι ἔσεσθε
  choice: 必被掳
  rationale: 简洁表达成为俘虏、被迫流散的被动处境，符合流亡语境。
- source_word: βδέλυγμα
  choice: 所憎恶的对象
  rationale: 比单用“可憎之物”更自然地表达他们在列国眼中成为厌恶对象，同时保留原词的强烈贬斥。
- source_word: ὄνειδος
  choice: 辱骂
  rationale: 在“遭受”之后自然表达由他人加给的羞辱和责难。
- source_word: αἰσχύνην αἰώνιον
  choice: 永远的羞耻
  rationale: 直译其持续性与严重性，不额外限定为纯历史性或末世性刑罚。
- source_word: δικαιοκρισίας
  choice: 公义的审判
  rationale: 该复合词表示以公义为特征的审判；此译法简洁，并保留神学分量。
- source_word: ἀπωλείᾳ
  choice: 毁灭
  rationale: 在此指群体的败亡和覆灭，不擅自引申为体系化的永恒沉沦。
- source_word: ἔλεος λήψεσθε
  choice: 蒙受怜悯
  rationale: 表达怜悯是所领受的恩惠，也适合本句以先祖为缘由的条件结构。
- source_word: σπέρματος
  choice: 后裔
  rationale: 现代汉语中“后裔”比直译“种子”清楚，同时脚注保留其血脉及盟约性措辞。
- source_word: οὐ μὴ καταλειφθῇ
  choice: 绝不会有一人留在
  rationale: 用“绝不会”体现 οὐ μή 的强调否定，并以“一人”对应全然无人存留的范围。
theological_decisions:
- issue: 因先祖而蒙怜悯的条件关系
  choice: 译作“若不是因着我们的祖先……而蒙受怜悯……就绝不会有一人留在地上”
  alternative: 将先祖仅解释为忠信榜样，或弱化他们与怜悯之间的根据关系
  rationale: 希腊文直接以 διὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ 说明蒙怜悯与先祖有关。译文保留这一盟约性张力，但不进一步界定其代求或功德机制。
- issue: “永远的羞耻”的审判范围
  choice: 保留“永远的羞耻”，不作体系化扩展
  alternative: 仅解释为暂时的历史耻辱，或明确解释为末世永刑
  rationale: αἰώνιον 表明严厉而持续的羞耻，但本章没有充分界定其具体末世论范畴。
- issue: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν 的关系
  choice: 译作“在你们的污秽中荒废”
  alternative: 译作“因你们的污秽而荒废”或“在你们污秽的时候荒废”
  rationale: 原文介词 ἐν 可表达处境、时间或关联；主文采用较贴近形式的表达，以免把含义单一化为因果关系。
translation_notes:
  register: 采用现代、庄重、易懂的简体中文圣经文体。以“必”维持预言和审判宣告的力度；用“上帝”指 Θεός。第4节尽量保留希腊文条件句及先祖—怜悯—存留之间的神学张力，不以教派性术语加以解释。
