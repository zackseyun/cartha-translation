    1 主所施行、有关他们的报应来到以后，祭司职分必衰败。 2 那时，主必兴起一位新的祭司；主的一切话都要向他显明。他必在地上施行真实的审判，历时多日。 3 他的星必在天上升起，如同君王；他要发出知识之光，如白昼的太阳[a]，并在普天下被尊为大。 4 他必像太阳一样照耀大地，除去天下一切黑暗；全地必有和平。


    5 在他的日子，诸天必欢腾，大地必喜乐，云彩必欣喜；[b]在主面前、属于他荣耀的天使，也必因他欢喜。 6 诸天必敞开，圣洁必从荣耀的殿临到他，并有慈父般的声音发出，仿佛亚伯拉罕对以撒说话。 7 至高者的荣耀必在他身上被宣告；明悟和成圣之灵必停留在他身上。[c] 8 因为他必诚诚实实地把主的威荣赐给自己的众子，直到永远。他必没有继任者，世世代代，直到永远。


    9 在他担任祭司的时期，列国在地上必在知识上增长，并因主的恩典而蒙光照。[d]在他担任祭司的时期，罪恶必衰微，不法之人必停止作恶；[e] 10 他还必打开乐园的门，挪去那把威吓亚当的剑。[f] 11 他必让圣者吃生命树的果子，圣洁之灵必在他们身上。 12 彼列必被他捆绑；他必赐权柄给自己的儿女，使他们能践踏邪灵。 13 主必因自己的儿女欢喜，也必永远喜爱自己所爱的人。


