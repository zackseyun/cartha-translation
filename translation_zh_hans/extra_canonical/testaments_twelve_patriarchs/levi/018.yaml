lexical_decisions:
- source_word: ἱερωσύνη
  choice: 祭司职分
  rationale: 既可指祭司制度，也可指祭司职务；本章后文聚焦一位祭司的任职时期，“祭司职分”在现代汉语中较自然，同时保留制度与职务两层意味。
- source_word: ἱερέα καινόν
  choice: 一位新的祭司
  rationale: 保留单数人物及καινός所表达的新时代性，不在译文中把此人明确认定为某一历史或教义人物。
- source_word: κρίσιν ἀληθείας
  choice: 真实的审判
  rationale: 以自然汉语表达属格结构，同时保留审判符合真理、真实可靠的意味。
- source_word: οἰκουμένη
  choice: 普天下
  rationale: 指有人居住的世界；“普天下”庄重而通俗，不把词义扩大为抽象宇宙。
- source_word: ἀναλάμψει
  choice: 照耀
  rationale: 与上下文的星、太阳、光和黑暗意象协调，并保持简洁。
- source_word: ἁγίασμα
  choice: 圣洁
  rationale: 原词可指圣洁、成圣或圣物；此处是从荣耀之殿临到人物的神圣赋予，译作“圣洁”可避免擅自具体化。
- source_word: φωνῆς πατρικῆς
  choice: 慈父般的声音
  rationale: 表达声音所具有的父亲性质，又避免将说话者的身份在译文中直接定为“父”。
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  choice: 明悟和成圣之灵
  rationale: “明悟”表达理解、洞察；“成圣”保留ἁγιασμός的过程或状态意味。
- source_word: μεγαλωσύνη
  choice: 威荣
  rationale: 兼顾伟大、庄严和神圣尊荣，适合先知性语体。
- source_word: διαδοχή
  choice: 继任者
  rationale: 上下文强调这位祭司职分的不可替代和延续性；人物化表达在汉语中最清楚。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 保留犹太文献中以色列与众民族相对的广义，不强行采用带有后期固定神学色彩的称谓。
- source_word: φωτισθήσονται
  choice: 蒙光照
  rationale: 兼顾知识上的启明与启示性的光明，并与全章光暗意象相连。
- source_word: πνεῦμα ἁγιωσύνης
  choice: 圣洁之灵
  rationale: 保留普通属格短语，不直接规范化为后期固定的三一论专名。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 按专名音译，保留其作为邪恶势力人格化称谓的作用，不以解释性称号取代。
theological_decisions:
- issue: “新的祭司”的身份
  choice: 仅译作“一位新的祭司”，不指明为弥赛亚、基督或某位历史大祭司。
  alternative: 译作“祭司弥赛亚”或明确指向耶稣。
  rationale: 本文赋予此人物末世性和救赎性特征，但希腊文本本身没有直接给出其专名；译文应保留辨认空间。
- issue: 第5、7、9节方括号增文
  choice: 正文不纳入增文，在相应位置用脚注列出。
  alternative: 把所有增文直接并入正文。
  rationale: 底本以方括号标示这些语句的文本不确定性；脚注既保持正文连续，也公开抄本差异。
- issue: 第11节πνεῦμα ἁγιωσύνης的神学指称
  choice: 译作“圣洁之灵”，不将其固定为专名。
  alternative: 译作“圣灵”。
  rationale: 该短语可以承载强烈神学意义，但词形不是后期常见固定称号的唯一表达；保留措辞张力更符合原文优先原则。
- issue: 第6节ἁγίασμα的性质
  choice: 译作抽象的“圣洁必……临到他”。
  alternative: 译作“膏立”“圣礼”或某种具体圣物。
  rationale: 上下文表示来自天上圣殿的神圣赋予，却未明确其媒介或仪式；不应擅自教派化或具体化。
- issue: 第8、12节“他的众子／自己的儿女”的所指
  choice: 保留第三人称所属关系，不解释为肉身后裔、门徒或特定群体。
  alternative: 明确译作“他的门徒”或“上帝的儿女”。
  rationale: 代词在语篇中可能指新祭司或主，且传统解释不一；译文保留原有指代张力。
translation_notes:
  register: 采用现代标准普通话的庄重叙事与先知性语体。句式清楚、适合普通读者朗读；保留“诸天、列国、威荣、披戴公义”等具有经书色彩但仍易懂的表达。对文本讹误、增文和代词指向不作静默调和。
