  language: zh_hans
  text: '《利未遗训》第十八章


    1 主对他们所施行的报应来到以后，祭司职分必止息。2 那时，主必兴起一位新的祭司；主的一切话都要向他显明。他必在地上施行真实的审判，历时多日。3 他的星必在天上升起，如同君王，发出知识之光，如白昼的太阳[a]；他必在普天下被尊为大。4 他必像太阳一样照耀大地，除去天下一切黑暗；全地必有和平。


    5 在他的日子，诸天必欢腾，大地必喜乐，云彩必欣喜；[b]主面前荣耀的天使也必因他欢喜。6 诸天必敞开，圣洁必从荣耀的殿临到他，伴随着父亲般的声音，仿佛从亚伯拉罕到以撒那样。7 至高者的荣耀必在他身上被宣告；明悟和成圣之灵必停留在他身上。[c] 8 因为他必在真理中把主的威荣赐给自己的众子，直到永远；他将世世代代、直到永远，都没有继任者。


    9 在他担任祭司的时期，列国在地上必在知识上增多，并因主的恩典而蒙光照。[d]在他担任祭司的时期，罪恶必止息，不法之人必停止作恶；[e] 10 他还必打开乐园的门，挪去那把威吓亚当的剑。[f] 11 他必让圣者吃生命树；圣洁之灵必在他们身上。12 彼列必被他捆绑；他必赐权柄给自己的儿女，使他们能践踏邪灵。13 主必因自己的儿女欢喜，也必永远喜爱自己所爱的人。


    14 那时，亚伯拉罕、以撒和雅各必欢腾，我也必喜乐；所有圣者都必披戴公义。


    [a] “如白昼的太阳”所据希腊语在抄传中可能有讹误，字面结构不甚清楚；本译依上下文的光明意象表达。


    [b] 有些文本在这里增添：“主的知识必倾倒在地上，如同众海的水。”


    [c] 有些文本在这里增添：“在水中。”


    [d] 有些文本在这里增添：“以色列却必因无知而衰微，在悲伤中变得昏暗。”


    [e] 有些文本在这里增添：“义人却必安歇在他里面。”


    [f] 这把威吓人的剑，是指亚当被逐出伊甸园后，守卫通往生命树之道路的剑。'
