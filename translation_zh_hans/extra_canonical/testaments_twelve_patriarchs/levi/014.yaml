  terminology: 保留“主”“不敬虔”“祭司长”“世界的救主”“光体”等庄重而可理解的用语。“我们的父祖以色列”比“我们的祖先以色列”更贴近ὁ πατὴρ ἡμῶν Ἰσραήλ，同时不将其扩展为对全体民族的断言。
