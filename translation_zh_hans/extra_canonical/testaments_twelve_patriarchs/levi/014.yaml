revisions:
- from: '《利未遗训》第14章


    1 所以，我的孩子们，我已经知道：到了万世的末期，你们必会以不敬虔的行为冒犯主，心怀恶意向他下手[a]，并在万族中成为受嘲弄的对象。


    2 因为，我们的祖先以色列在祭司长们的不敬虔上是清白的；这些人将向世界的救主下手。[b]


    3 因为，太阳怎样在主面前、在大地之上是纯洁的，你们也怎样；你们是以色列的光体，居于万族之上。[c]'
  to: '《利未遗训》第14章


    1 所以，我的孩子们，我已经知道：到了万世的末期，你们必会对主行不敬虔之事，怀着恶意向他下手[a]，并在万族中成为受嘲弄的对象。


    2 因为，我们的父祖以色列没有沾染祭司长们的不敬虔；这些人将向世界的救主下手。[b]


    3 因为，太阳怎样在主面前、在大地之上是纯洁的，照样，你们这以色列的光体也纯洁，居于万族之上。[c]'
  rationale: 修订仅处理可安全确定的汉语表达和句法：第1节使“不敬虔”直接支配“对主”的行为；第2节以“没有沾染”自然表达καθαρός ἀπό；第3节补出比较结构中由原文明确省略的“纯洁”，并保留“在主面前、在大地之上”“居于万族之上”的原文张力。方括号文本均继续收入正文并以注释说明，未把“主”与“世界的救主”的关系作教义性定论。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:24:31Z'
