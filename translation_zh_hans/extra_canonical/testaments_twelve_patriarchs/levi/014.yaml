  text: 1[a]. Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands on him in wickedness, and among all the nations you will become a mockery[b]. 2. For our father Israel is pure from the ungodliness of the chief priests, who will lay their hands on the savior of the world. 3. For just as the sun is pure before the Lord upon the earth, so also...
translation:
  language: zh_hans
  text: '《利未遗训》第14章


    1 所以，我的孩子们，我已经知道：到了万世的末期，你们必会对主行不敬虔之事，怀着恶意向他下手[a]，并在万族中成为受嘲弄的对象。


    2 因为，我们的父祖以色列没有沾染祭司长们的不敬虔；这些人将向世界的救主下手。[b]


    3 因为，太阳怎样在主面前、在大地之上是纯洁的，照样，你们这以色列的光体也纯洁，居于万族之上。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向他”所对应的希腊语词组在所据文本中置于方括号内，表明其文本地位存疑；正文仍按所提供的文本译出。
    reason: textual_variant
  - marker: b
    text: “这些人将向世界的救主下手”整句在所据希腊文本中置于方括号内，可能是在传抄过程中后加的扩展；因该句见于所提供的希腊文本，正文予以翻译。
    reason: textual_variant
  - marker: c
    text: 所据版本以校勘符号标示第3节“太阳”和“在大地之上”附近的希腊措辞有文本或语义困难；译文按现存词句译出。所提供的希腊见证在本节末尾仍有“你们这以色列的光体……居于万族之上”的文字，故未按英语审校记录中错误的省略号截断。
    reason: textual_difficulty
lexical_decisions:
- source_word: ἔγνων
  choice: 我已经知道
  rationale: 以“已经”体现该动词所表达的既成认识，同时保持现代汉语自然流畅。
- source_word: ἀσεβήσετε
  choice: 必会以不敬虔的行为冒犯
  rationale: 保留动词性的恶行与其宗教伦理色彩；结合ἐπὶ Κυρίου的敌对语境译为“冒犯主”。
- source_word: χεῖρας ἐπιβάλλοντες
  choice: 向他下手
  rationale: 这是敌意行动的惯用表达；“下手”既可涵盖捉拿，也可涵盖暴力，不把具体行为限定得过窄。
- source_word: χλευασμός
  choice: 受嘲弄的对象
  rationale: 清楚表达谓语名词所指的公开羞辱，比单译“笑柄”更庄重。
- source_word: καθαρός
  choice: 清白的／纯洁的
  rationale: 第2节涉及不敬虔的责任，译“清白”符合伦理语境；第3节用于太阳的比喻，译“纯洁”保留宗教与礼仪色彩。
- source_word: ἀρχιερέων
  choice: 祭司长们
  rationale: 复数形式及第二圣殿时期用法更适合“祭司长”，避免让人误以为同时存在多位唯一在任的“大祭司”。
- source_word: σωτῆρα τοῦ κόσμου
  choice: 世界的救主
  rationale: 直译见证文本中的称号，不在正文中淡化其神学意味。
- source_word: φωστῆρες
  choice: 光体
  rationale: 保留与太阳意象的联系，并表达发光或承载光明之物；不擅自具体化为“星辰”。
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: 居于万族之上
  rationale: 体现παρά在比较语境中“超过、胜过”的含义，同时保留原句对以色列光体地位的强烈陈述。
theological_decisions:
- issue: 第1节“向他下手”中代词的指向
  choice: 保留其直接指向前述“主”的自然读法
  alternative: 笼统译成反抗主的权柄，或明确认定与第2节“世界的救主”完全同指
  rationale: 希腊文形成强烈而惊人的先知性控诉；译文不削弱其直接性，也不超出文本进一步界定身份。
- issue: 第2节关于“世界的救主”的括号内语句
  choice: 收入正文并加文本注
  alternative: 作为后期增补而删去，或仅置于脚注
  rationale: 所提供的希腊文本载有该句，虽以方括号标示文本疑问，故应如实翻译并透明说明传抄问题。
- issue: “我们的祖先以色列”与祭司长不敬虔行为的责任关系
  choice: 译为“在……的不敬虔上是清白的”
  alternative: 译成以色列本质上完全纯洁，或将“以色列”解释为全体民族
  rationale: 译文保留原文将祖先以色列与后世祭司长区分的论断，不把它扩展为关于整个民族的系统性教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万世的末期”“不敬虔”“救主”等保留遗训文学和宗教语域；对敌意行动使用“下手”，既自然又保留行为方式的开放性。第3节依据完整的希腊原文译出，不沿用英语咨询层误称文本在“你们也怎样”之后中断的说明。
