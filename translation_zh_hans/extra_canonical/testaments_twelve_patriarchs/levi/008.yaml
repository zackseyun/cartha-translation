  revised_text: '《利未遗训》第8章


    1 我们在那里住了七十天以后，我又在那里看见一个异象，和先前的一样。2 我看见七个人，身穿白衣，对我说：“起来，穿上祭司职分的礼袍，戴上公义的冠冕，佩上明悟的胸牌，穿上真理的长袍，戴上信心的额牌、头上的礼冠[a]，并穿上预言的以弗得。”3 他们各自拿着这些物件，给我穿戴上，又对我说：“从今以后，你和你所有的后裔都要成为祭司。”


    4 第一个人用圣油膏我，又给我一根杖。5 第二个人用主的净水洗我，给我吃圣饼、喝圣酒，又给我披上圣洁而荣耀的礼袍。6 第三个人给我穿上细麻衣，样式如同以弗得。7 第四个人给我束上一条腰带，如同紫色的。8 第五个人给我一根肥美橄榄树的枝子。9 第六个人把冠冕戴在我头上。10 第七个人给我戴上祭司职分的冠冕，又把香放满我的双手，使我可以在主上帝面前作祭司。


    11 他们对我说：“利未，你的后裔将分成三个职分，作为主将临之荣耀的记号。12 第一份必为大，没有别的会兴起超过它。13 第二份将在祭司职分中。14 至于第三份，他将被称为一个新名，因为必有一位王从犹大兴起，设立新的祭司职分，照着列国的样式，为着万国[b]。15 他的临到是可喜爱的，如同至高者的一位先知，出自我们祖先亚伯拉罕的后裔。16 所以，以色列中一切可喜爱的都要归给你和你的后裔；你们要吃一切悦目的食物，你的后裔也要分配主的桌席。17 他们中间将有祭司、审判官和经学家；圣物要凭他们口中的话被领受[c]。”


    18 我醒来以后，就明白这异象和第一个梦相似。


    [a] “头上的礼冠”：原文在此处可能有讹误，直译为“头的礼冠”。


    [b] “照着列国的样式，为着万国”：原文保留了“列国”和“万国”的重复，所指的“样式”并不明确。


    [c] “圣物要凭他们口中的话被领受”：本句原文可能有讹误，也可较直译为“圣物要在他们口上被领受”。'
