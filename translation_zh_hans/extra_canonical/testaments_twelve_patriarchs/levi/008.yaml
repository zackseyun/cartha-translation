  text: '1 And there again I saw a vision like the former one, after we had remained there seventy days. 2 And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the oracle of understanding, and the full-length robe of truth, and the plate of faith, and the turban of the head, and the ephod of prophecy.” 3 And each one of them was carrying these things, and they put them on me and said to me, “From now on, become a priest—you and all your seed.”


    4 And the first anointed me with holy oil and gave me a priestly staff. 5 And the second washed me with pure water of the Lord, and fed me holy bread and wine, and put around me a holy and glorious robe. 6 And the third put on me a linen garment, like an ephod. 7 And the fourth wrapped around me a girdle, like purple. 8 And the fifth gave me a branch of rich olive. 9 And the sixth placed a crown on my head. 10 And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.


    11 And they say to me, “Levi, your seed will be divided into three offices, for a sign of the glory of the Lord who is coming. 12 And the first lot will be great; none will arise greater than it. 13 And the second will be in priesthood. 14 And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, after the pattern of the nations, for all the nations. 15 And his presence is beloved, like a prophet of the Most High, from the seed of Abraham our father. 16 Therefore every desirable thing in Israel will be for you and for your seed, and your seed will eat every beautiful thing, and will apportion the table of the Lord. 17 And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”


    18 So when I awoke, I understood that this was like the first vision.'
translation:
  language: zh_hans
  text: '《利未遗训》第8章


    1 我们在那里住了七十天以后，我又在那里看见一个异象，和先前的一样。2 我看见七个人，身穿白衣，对我说：“起来，穿上祭司职分的礼袍，戴上公义的冠冕，佩上明悟的胸牌，穿上真理的长袍，戴上信心的额牌、头上的礼冠[a]，并穿上预言的以弗得。”3 他们各自拿着这些物件，给我穿戴上，又对我说：“从今以后，你和你所有的后裔都要成为祭司。”


    4 第一个人用圣油膏我，又给我一根杖。5 第二个人用主的净水洗我，给我吃圣饼、喝圣酒，又给我披上圣洁而荣耀的礼袍。6 第三个人给我穿上细麻衣，样式如同以弗得。7 第四个人给我束上一条腰带，如同紫色的。8 第五个人给我一根肥美橄榄树的枝子。9 第六个人把冠冕戴在我头上。10 第七个人给我戴上祭司职分的冠冕，又把香放满我的双手，使我可以在主上帝面前作祭司。


    11 他们对我说：“利未，你的后裔将分成三个职分，作为主将临之荣耀的记号。12 第一份必为大，没有别的会兴起超过它。13 第二份将在祭司职分中。14 至于第三份，他将被称为一个新名，因为必有一位王从犹大兴起，设立新的祭司职分，照着列国的样式，为着万国[b]。15 他的临到是可喜爱的，如同至高者的一位先知，出自我们祖先亚伯拉罕的后裔。16 所以，以色列中一切可喜爱的都要归给你和你的后裔；你们要吃一切悦目的食物，你的后裔也要分配主的桌席。17 他们中间将有祭司、审判官和经学家；圣物要凭他们口中的话被领受[c]。”


    18 我醒来以后，就明白这异象和第一个梦相似。


    [a] “头上的礼冠”：原文在此处可能有讹误，直译为“头的礼冠”。


    [b] “照着列国的样式，为着万国”：原文保留了“列国”和“万国”的重复，所指的“样式”并不明确。


    [c] “圣物要凭他们口中的话被领受”：本句原文可能有讹误，也可较直译为“圣物要在他们口上被领受”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头上的礼冠”：原文在此处可能有讹误，直译为“头的礼冠”。
    reason: 源文本以匕首号标示τῆς κεφαλῆς为疑难或讹误读法。
  - marker: b
    text: “照着列国的样式，为着万国”：原文保留了“列国”和“万国”的重复，所指的“样式”并不明确。
    reason: 避免将κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη的重复和歧义静默消除。
  - marker: c
    text: “圣物要凭他们口中的话被领受”：本句原文可能有讹误，也可较直译为“圣物要在他们口上被领受”。
    reason: ληφθήσεται所在短语被版本标作疑难，语义及搭配均不稳定。
lexical_decisions:
- source_word: λόγιον
  choice: 胸牌
  rationale: 在祭司服饰语境中指承载神谕的胸牌；比抽象的“神谕”更符合整串穿戴物件，同时保留其祭仪功能。
- source_word: ποδήρης
  choice: 长袍
  rationale: 该词指长及脚部的衣袍；“长袍”自然且准确。
- source_word: πέταλον
  choice: 额牌
  rationale: 祭司服饰语境下指戴在额前的金属牌，不泛译为“牌”。
- source_word: μίτρα
  choice: 礼冠
  rationale: 指缠裹或戴于头上的祭司冠饰；“礼冠”兼顾形态与祭仪语境。
- source_word: ἐφούδ
  choice: 以弗得
  rationale: 采用现代中文圣经读者熟悉的祭司服饰音译。
- source_word: ῥάβδος
  choice: 杖
  rationale: 希腊文只说“杖”，不加入原文没有的“祭司”限定。
- source_word: κλάδον ἐλαίας πιότητος
  choice: 一根肥美橄榄树的枝子
  rationale: 尽量保留“丰肥、油润”之意及原文略显奇特的属格结构，不简化为普通橄榄枝。
- source_word: ἀρχάς
  choice: 职分
  rationale: 此处指后裔被划分出的三种居首或掌权的类别；结合后文祭司职分，译作“职分”较通顺，但不具体化为某种制度官职。
- source_word: κλῆρος
  choice: 份
  rationale: 保留“所得之份、分组”的含义，并避免把它确定解释成阶层或抽签结果。
- source_word: παρουσία
  choice: 临到
  rationale: 表达出现、来临之意，不预先套入后期专门化的末世论术语。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 在犹太宗教语境中比现代行政意义的“书记”准确，也较“文士”易为普通读者理解。
theological_decisions:
- issue: 第14节第三份与从犹大兴起之王的关系
  choice: 保留“第三份—他—一位王”之间略显跳跃的代词与因果结构
  alternative: 明确译成第三个职分就是从犹大而来的君王或其祭司制度
  rationale: 希腊文本身语法和指代不够平顺，不应替文本确定第三份、得新名者与犹大之王完全同一。
- issue: “新的祭司职分”与列国的关系
  choice: 译为“照着列国的样式，为着万国”
  alternative: 解释为一种普世祭司制度，或改成“按万代的样式”
  rationale: 现有希腊文两次使用ἔθνη，宜保留列国/万国及其神学张力，不作教派化阐释。
- issue: 第15节人物身份
  choice: 译为“如同至高者的一位先知”
  alternative: 直接认定为某一特定弥赛亚人物或译成“就是至高者的先知”
  rationale: ὡς表达比较或身份近似，文本未明确要求等同判断。
- issue: 第17节“圣物”如何被领受
  choice: 正文作“圣物要凭他们口中的话被领受”，并注明文本疑难
  alternative: 解释为圣言、圣洁权柄或圣灵从他们口中传出
  rationale: 原文带有文本讹误标记，必须保留不确定性，不以神学解释修补句子。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话，保留遗训文学和祭司异象的仪式感。对普通读者不熟悉但有明确祭司文化所指的词（如“以弗得”）保留传统名称；对可用现代词清楚表达者（如“经学家”）避免过度古雅。对第14、15、17节的语法和神学张力不作消歧式扩写。
