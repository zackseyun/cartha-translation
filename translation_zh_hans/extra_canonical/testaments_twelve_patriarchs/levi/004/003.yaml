  text: You shall shine the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.
translation:
  language: zh_hans
  text: 你要在雅各中发出知识之光；你要如太阳，照耀以色列全体后裔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωτιεῖς
  choice: 照亮
  rationale: 该动词是未来时，可表达“使发光、照亮”。与宾语“知识之光”连用时，“照亮知识之光”既贴近希腊文结构，也保留其略显凝练的意象。
- source_word: ἐν τῷ Ἰακώβ
  choice: 在雅各中
  rationale: 保留介词短语的空间兼群体含义；“雅各”在此可指先祖雅各，也可转喻其后裔群体，不在正文中单方面消解这一含混。
- source_word: ὡς ἥλιος ἔσῃ
  choice: 你要如太阳
  rationale: 直译明喻结构，使用“如”保持庄重而自然的书面语体。
- source_word: παντὶ σπέρματι Ἰσραήλ
  choice: 以色列所有的后裔
  rationale: σπέρμα可直译“种子/种”，但在族裔语境中指后代；现代汉语以“后裔”更自然，并保留集合性。补出“普照”使与“太阳”及与格对象的关系在汉语中清楚，但不增加新的神学含义。
theological_decisions:
- issue: “雅各”与“以色列”是个人还是群体
  choice: 正文保留“雅各”和“以色列”的传统专名，并将σπέρμα译为“后裔”
  alternative: 将两者直接释义为“雅各的子民”和“以色列民族”
  rationale: 原文允许专名兼具先祖与群体的转喻色彩；不在译文中把这种张力固定为单一解释。
- issue: 太阳意象所表达的关系
  choice: 以“普照”表达对所有以色列后裔的照耀
  alternative: 译作“你对以色列所有后裔要像太阳一样”
  rationale: 原文只明确“如太阳”及其与格对象，并未说明更具体的救赎或治理功能；“普照”仅把汉语所需的意象关系明说出来。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语。分号对应两个并列的未来陈述。“在雅各中”刻意保留原文较凝练且可能具有群体转喻的表达。
