- from: 你要在雅各中照亮知识之光；你要如太阳，普照以色列所有的后裔。
  to: 你要在雅各中发出知识之光；你要如太阳，照耀以色列全体后裔。
  rationale: 修订首句以消除“照亮知识之光”的汉语语义不顺，同时保留原文的未来宣告、地点短语和光的知识意象。后句以“照耀”连接太阳与受惠对象，保留原文比喻和“全体”的范围，未加入具体神学或制度性解释。
