review_pass:
  verdict: revise
  source_fidelity: 首句的 φωτιεῖς（“将发光／照耀”）与“知识之光”相连，原译“照亮知识之光”在汉语中容易变成“使这光被照亮”，主客关系不清。改为“发出知识之光”自然地保留说话对象为发光者及“知识之光”的意象。后句保留“如太阳”以及对以色列后裔的普遍指向。
  naturalness: “发出知识之光”是现代庄重汉语中自然的搭配；“以色列全体后裔”比“以色列所有的后裔”更凝练，且准确表达 παντὶ σπέρματι 的集合性、普遍性。
  terminology: 保留“雅各”“以色列”这两个传统专名，未将其预先解释为个人或民族；“知识之光”和“后裔”均适合此处语境。
  issues:
  - severity: medium
    issue: “照亮知识之光”搭配及语义关系不自然
    rationale: “照亮”通常以原本昏暗的对象为宾语；此处“知识之光”应是由“你”发出或藉以照耀的光。原译虽试图逐词对应，却造成现代汉语的主客关系歧义。
  - severity: low
    issue: “普照”略强化了原文未明说的动作方式
    rationale: 太阳意象当然可引出照耀，但希腊文仅说“你将如太阳，向以色列全体后裔”。改为“如太阳，照耀……”仍是自然的汉语显化，并避免“普照”带来的额外修辞强化。
  revised_text: 你要在雅各中发出知识之光；你要如太阳，照耀以色列全体后裔。
