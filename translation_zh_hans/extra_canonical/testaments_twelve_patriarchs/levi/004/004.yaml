  text: Καὶ δοθήσεταί σοι εὐλογία *καὶ παντὶ τῷ σπέρματί σου³⁵ ἕως³⁶ ἐπισκέψεται³⁷ Κύριος πάντα τὰ ἔθνη³⁸ ἐν σπλάγχνοις [υἱοῦ]³⁹ αὐτοῦ *ἕως αἰῶνος⁴⁰. [Πλὴν⁴¹ οἱ υἱοί σου ἐπιβαλοῦσι χεῖρας *ἐπ᾿ αὐτὸν⁴² *τοῦ ἀνασκολοπίσαι⁴³ αὐτόν.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/004.yaml
  text: And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son[a] forever.
translation:
  language: zh_hans
  text: 必有福赐给你和你的一切后裔，直到主在他［儿子］的怜悯中眷顾万国，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογία
  choice: 福
  rationale: 在祝福语境中用“福”简洁自然，也保留所赐福分的名词性质。
- source_word: σπέρματί
  choice: 后裔
  rationale: 此处指利未的后代；“后裔”比字面的“种子”更符合现代汉语，同时保留集体含义。
- source_word: ἐπισκέψεται
  choice: 眷顾
  rationale: 该词可指临到、察看并施行关怀；“眷顾”能表达此处带慈怜意味的神圣临访。
- source_word: ἐν σπλάγχνοις
  choice: 本着……的慈怜
  rationale: 原词字面涉及内脏，惯用于深切怜悯；此译自然地表达由衷慈悲，并保留行动所依据的意味。
- source_word: ἕως αἰῶνος
  choice: 直到永远
  rationale: 保留原文第二个ἕως所形成的延续表达，不擅自消除与前一个“直到”之间的张力。
theological_decisions:
- issue: υἱοῦ（儿子）在文本上的不确定性
  choice: 正文保留“［儿子］”并加脚注
  alternative: 删去“儿子”，译作“本着他的慈怜”
  rationale: 所给希腊文本将υἱοῦ置于方括号中，显示其文本地位存疑；正文以方括号忠实呈现，不将这一基督论色彩较强的读法断定为无争议原文。
- issue: 较长读法中利未众子的行为
  choice: 不收入正文，仅在脚注说明
  alternative: 将“你的儿子们要下手捉拿他，把他钉上刑架”作为正文第二句
  rationale: 整句在所给希腊文本中带方括号，英文审校层也采用较短正文；放入脚注既保存异文证据，也避免把存疑扩展当作确定正文。
- issue: “儿子”的称谓形式
  choice: 用普通名词“儿子”，不作特殊大写处理
  alternative: 借助“圣子”等具有明确教义色彩的称谓
  rationale: 现代简体中文没有英语式大小写区别；“儿子”直接对应希腊词，避免额外导入后期神学称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必有福赐给……”保留预言语气；两个“直到”照应希腊文重复的ἕως，虽略具张力，却不擅自重构其时间关系。正文中的脚注标记[a]紧随相关短语出现。
