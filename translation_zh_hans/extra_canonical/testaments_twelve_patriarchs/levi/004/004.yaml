revisions:
- from: 必有福赐给你和你所有的后裔，直到主本着他［儿子］的慈怜[a]眷顾万国，直到永远。
  to: 必有福赐给你和你的一切后裔，直到主在他［儿子］的怜悯中眷顾万国，直到永远。
  rationale: 修订仅校正脚注中超出所供希腊文本的内容，并使正文对ἐν σπλάγχνοις的译法更直接。保留［儿子］、两个“直到”以及较短正文的文本选择，不把存疑的较长扩展收入正文。
