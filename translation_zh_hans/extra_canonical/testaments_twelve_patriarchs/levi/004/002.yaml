  text: Εἰσήκουσεν¹⁷ Γοὖν¹⁸ ὁ ὕψιστος τῆς προσευχῆς¹⁹ σου *τοῦ διελεῖν²⁰ σε ἀπὸ²¹ ἀδικίας²² καὶ γενέσθαι αὐτῷ²³ *υἱὸν καὶ θεράποντα²⁴ καὶ λειτουργὸν²⁵ τοῦ προσώπου αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/002.yaml
  text: Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister before him.
translation:
  language: zh_hans
  text: 因此，至高者垂听了你的祷告，要使你脱离不义，成为他的儿子、仆人和在他面前供职的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσήκουσεν
  choice: 垂听了
  rationale: 该动词指听取、应允祈求；“垂听”既符合祷告语境，又保持庄重自然。
- source_word: ὁ ὕψιστος
  choice: 至高者
  rationale: 保留这一神圣称号的名词形式，不扩写为带特定传统色彩的称谓。
- source_word: τοῦ διελεῖν σε ἀπὸ ἀδικίας
  choice: 要使你脱离不义
  rationale: 将带目的或结果意味的不定式结构译为“要使”，而“脱离不义”准确表达从ἀδικία中分别出来。
- source_word: υἱὸν
  choice: 儿子
  rationale: 直译亲属身份用语，保留其神学张力，不弱化为“子民”或“义子”。
- source_word: θεράποντα
  choice: 仆人
  rationale: 在此指服侍者；“仆人”与后面的礼仪职分用语形成区分。
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: 在他面前供职
  rationale: λειτουργός具有履行职务、尤其在神前服役的意味；“在他面前供职”自然表达τοῦ προσώπου αὐτοῦ，同时避免生硬译作“他面容的执事”。
theological_decisions:
- issue: “儿子、仆人、供职者”三重身份的关系
  choice: 并列保留“儿子、仆人，并在他面前供职”
  alternative: 将三者合并或解释为祭司身份
  rationale: 希腊文本并列υἱόν、θεράποντα、λειτουργόν；译文不把这些称谓归并，也不额外限定为某一制度化职分。
- issue: 不定式结构表达目的还是结果
  choice: 译为“要使……使……”
  alternative: 译为“因而使……”或“为了使……”
  rationale: 属格不定式在此可带目的或预期结果色彩；“要使”保留一定开放性，同时与“垂听祷告”衔接自然。
- issue: τοῦ προσώπου αὐτοῦ的理解
  choice: 在他面前
  alternative: 属于他临在的／侍奉他的面容
  rationale: 该短语可关联“面容”与“临在”；按上下文译作“在他面前”最自然，也保留在神前服役的空间与关系意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“垂听”“至高者”“不义”维持经文语体；末句用“在他面前供职”避免过度教派化的“执事”或过度限定的“祭司”。
