  language: zh_hans
  text: 因为那些祝福他的人必蒙祝福，那些咒诅他的人必灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογοῦντες / εὐλογημένοι
  choice: 祝福……的人 / 必蒙祝福
  rationale: 保留原文同一词根形成的对应关系，并用“蒙”自然表达被动意义。
- source_word: καταρώμενοι
  choice: 咒诅……的人
  rationale: 准确表达带有祸患祈愿意味的强烈负面言语，与“祝福”构成鲜明对照。
- source_word: ἀπολοῦνται
  choice: 必灭亡
  rationale: 表达将来时态及毁灭、丧亡的强义，不将其弱化为一般的失败或受罚。
theological_decisions:
- issue: 两处 αὐτόν 所指对象在本句内并未明示
  choice: 均译作“他”
  alternative: 根据上下文明确写出所指者的身份或名称
  rationale: 原文仅用阳性单数代词；保留代词可维护本句真实的指代含混，避免加入解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以平行句式再现希腊文中“祝福／蒙祝福”与“咒诅／灭亡”的对照。
