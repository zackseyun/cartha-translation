base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/005.yaml
  text: And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.
translation:
  language: zh_hans
  text: 因此，谋略和悟性已经赐给了你，使你能就这件事教导你的儿子们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ
  choice: 谋略
  rationale: 表达审慎思考与劝策的能力，并与“悟性”形成自然并列。
- source_word: σύνεσις
  choice: 悟性
  rationale: 对应理解、领悟的能力，符合现代汉语的庄重语体。
- source_word: τοῦ συνετίσαι
  choice: 使你能……教导
  rationale: 此处不定式表达所赐谋略和悟性的目的；“教导”自然传达使人明白、获得理解之意。
- source_word: τοὺς υἱούς σου
  choice: 你的众子
  rationale: 保留复数，并以略带经文色彩但仍易懂的“众子”表达。
- source_word: περὶ τούτου
  choice: 在这件事上
  rationale: 保留指代对象未明说的特点，不擅自补足其具体内容。
theological_decisions:
- issue: 谋略和悟性的赐予者未明确出现
  choice: 采用“已经赐给了你”的被动表达，不补出赐予者
  alternative: 译作“上帝已经赐给你”
  rationale: 希腊文本使用神圣被动但未明说施事者；保留这一含蓄表达，避免添加原文没有明言的神学信息。
- issue: περὶ τούτου的指代具有语境依赖性
  choice: 译为“在这件事上”
  alternative: 具体说明所指事项
  rationale: 本节自身没有明确交代指代内容，应保留原文的歧义与上下文依赖。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；语序略作调整，使目的关系清楚，同时保留原文的被动结构和指代含混。
