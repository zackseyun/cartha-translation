source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Νῦν οὖν γίνωσκε¹ ὅτι ποιήσει Κύριος κρίσιν ἐπὶ τοὺς υἱοὺς τῶν ἀνθρώπων. Ὅτι² πετρῶν³ σχιζομένων, καὶ τοῦ ἡλίου σβεννυμένου⁴ καὶ ὑδάτων⁵ ξηραινομένων καὶ τοῦ⁶ πυρὸς καταπτήσσοντος⁷ καὶ πάσης [τῆς]⁸ κτίσεως κλονουμένης⁹ καὶ τῶν ἀοράτων πνευμάτων¹⁰ τηκομένων¹¹ καὶ¹² τοῦ ᾅδου σκυλευομένου¹³ [ἐπὶ τῷ πάθει τοῦ ὑψίστου]¹⁴ *οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις¹⁵, διὰ τοῦτο ἐν Γτῇ¹⁶ κολάσει κριθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/001.yaml
  text: Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are split, and the sun is extinguished, and waters dry up, and fire cowers, and all creation is shaken, and the invisible spirits melt away, and Hades is plundered at the suffering of the Most High[a], disobedient men will persist in their injustices; therefore they will be judged in punishment.
translation:
  language: zh_hans
  text: 所以你现在要知道，主必审判世人。因为磐石裂开，太阳熄灭，众水干涸，火也畏缩，一切受造之物震动，看不见的灵消融，阴间在至高者受苦时被劫掠[a]，悖逆的人仍会执意行不义之事；因此，他们必在刑罚中受审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在至高者受苦时”一语在希腊文本传统中存疑，可能是后来的增补；因所提供的见证文本载有此语，故在正文中译出。
    reason: textual_variant
lexical_decisions:
- source_word: ποιήσει Κύριος κρίσιν
  choice: 主必审判
  rationale: 该短语直译为“主将施行审判”；中文用“主必审判”自然凝练，同时保留未来性和司法意涵。
- source_word: τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: 世人
  rationale: 字面为“人的众子”，在此泛指人类；译作“世人”符合现代汉语，避免被误解为仅指男性后裔。
- source_word: τοῦ πυρὸς καταπτήσσοντος
  choice: 火焰畏缩
  rationale: καταπτήσσω含因惧怕而蜷缩、退缩之意；译作“畏缩”保留对火的拟人化描写，未弱化为单纯熄灭。
- source_word: τῶν ἀοράτων πνευμάτων τηκομένων
  choice: 看不见的灵消融
  rationale: τηκόμενοι表示融化、消解；“消融”既保留意象，也适合非物质之灵的语境。
- source_word: τοῦ ᾅδου σκυλευομένου
  choice: 阴间被劫掠
  rationale: ᾅδης译作“阴间”，σκυλεύω是掠夺、夺取战利品；被动式“被劫掠”保留原文强烈意象。
- source_word: οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις
  choice: 悖逆的人仍会执意行不义之事
  rationale: ἀπειθοῦντες指不服从、悖逆者；ἐπιμένω表示持续、坚持。“仍会执意”传达即使面对宇宙性异象仍继续不义的意味。
- source_word: ἐν … κολάσει κριθήσονται
  choice: 必在刑罚中受审判
  rationale: 保留ἐν的结构及κολάσει与κριθήσονται的区别，不将其扩译为原文此处未明确表达的“更重刑罚”。
theological_decisions:
- issue: “至高者受苦”是否应保留
  choice: 正文保留，并加文本异文脚注
  alternative: 从正文删去，或置于括号中
  rationale: 该短语在所供希腊文本中以方括号标明文本不确定性。依源本文本译出，同时以脚注如实说明其传承状况，不据此消解其神学张力。
- issue: 阴间被劫掠的主体与方式
  choice: 保持被动表达，不补出行动者
  alternative: 解释为某特定人物降入阴间并攻破阴间
  rationale: 原文仅用被动分词，未明说谁劫掠阴间，也未说明具体方式；译文不导入后期教义性解释。
- issue: 末句刑罚的程度
  choice: 译作“在刑罚中受审判”
  alternative: 译作“受更重的刑罚”
  rationale: 所供正文的κολάσει没有明确的比较级；不从校勘符号或异读推入“更重”之义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。宇宙性灾变部分保留原文连续并列的节奏；“阴间”“至高者”“受造之物”等词兼顾古代宗教语境与现代可读性。
