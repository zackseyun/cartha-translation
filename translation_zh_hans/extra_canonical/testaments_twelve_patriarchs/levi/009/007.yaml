base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/007.yaml
  text: And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of freewill offerings, and of peace offerings.
translation:
  language: zh_hans
  text: 他教导我有关祭司职分、祭祀、全燔祭、初熟之物的献祭、自愿祭和平安祭[a]的律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“平安祭”的希腊词，字面可指“拯救”或“安康”。
    reason: 说明σωτηρίου的字面语义，同时保留祭祀语境中“平安祭”的自然译法。
lexical_decisions:
- source_word: νόμον ἱερωσύνης
  choice: 有关祭司职分……的律法
  rationale: νόμος为单数“律法、条例”，ἱερωσύνη指祭司的职分或制度；用“有关……的律法”使后续属格项目自然受其统摄。
- source_word: θυσιῶν
  choice: 祭牲
  rationale: 指献作祭物的牲畜或祭物；在与全燔祭等具体祭类并列时，“祭牲”比泛称“献祭”更贴近名词复数。
- source_word: ὁλοκαυτωμάτων
  choice: 全燔祭
  rationale: 指祭物完全焚烧的祭，采用准确而通行的礼仪用语。
- source_word: ἀπαρχῶν
  choice: 初熟之物
  rationale: 该词明确表示首先献上的出产或初熟之物；虽英语咨询文本将其省去，现存希腊文中有此词，因此依原文保留。
- source_word: ἑκουσίου
  choice: 自愿祭
  rationale: 字面为“自愿的”，在献祭清单中省略了所修饰的祭物名词，汉语补足为“自愿祭”。
- source_word: σωτηρίου
  choice: 平安祭
  rationale: 在祭祀语境中通常指带来安康、和好的祭，即“平安祭”；保留脚注说明其较直译含义。
theological_decisions:
- issue: ἀπαρχῶν是否应译出
  choice: 译作“初熟之物”
  alternative: 依英语咨询文本省略
  rationale: 希腊原文明确含有ἀπαρχῶν。翻译以原文证据为先，不因咨询层的删改而删除有据的项目。
- issue: σωτηρίου的祭祀含义
  choice: 译作“平安祭”
  alternative: 译作“拯救祭”或“安康祭”
  rationale: “平安祭”是中文圣经礼仪语境中自然且易懂的对应词，但以脚注保留该希腊词可表达“拯救、安康”含义的语义张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“他又教导我”承接上下文；整句保留单数“律法”对后续各项的统摄。礼仪名称尽量使用普通中文读者可辨认的传统术语，同时不依英语咨询文本删除希腊文中的ἀπαρχῶν。
