  text: Καὶ πρὸ⁴⁶ τοῦ εἰσελθεῖν σε⁴⁷ εἰς τὰ ἅγια, λούου· καὶ ἐν τῷ θύειν σε⁴⁸, νίπτου⁴⁹· καὶ ἀπαρτίζων πάλιν⁵⁰ τὴν θυσίαν, νίπτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/011.yaml
  text: And before you enter into the holy things, wash; and when you sacrifice, wash; and again, when you finish the sacrifice, wash.
translation:
  language: zh_hans
  text: 在你进入圣所之前，要沐浴；你献祭时，要洗手；献祭结束时，再洗手。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὰ ἅγια
  choice: 进入圣所
  rationale: 字面可作“进入圣物/圣事之中”，但与εἰσελθεῖν搭配时，τὰ ἅγια自然可指神圣区域，即“圣所”；此译法符合祭司礼仪语境，同时不具体限定圣所的层级。
- source_word: λούου
  choice: 沐浴
  rationale: λούω在中间语态命令式中指洗身、沐浴，与后文较局部的νίπτω形成词义区别。
- source_word: νίπτου
  choice: 洗手
  rationale: νίπτω通常指洗身体的一部分；在献祭礼仪语境中最自然指洗手。中文若仅译“洗”宾语不明，因此补出隐含宾语“手”。
- source_word: ἀπαρτίζων
  choice: 完毕后
  rationale: 该词表示完成、办完；结合τὴν θυσίαν，译为“献祭完毕后”自然地表达与分词相伴的时间关系。
- source_word: πάλιν
  choice: 还要再
  rationale: 保留“再次”的意思，并清楚表现最后一次清洗与献祭时清洗的重复关系。
theological_decisions:
- issue: τὰ ἅγια所指是圣物、圣事还是圣所
  choice: 圣所
  alternative: 圣物；神圣的事物
  rationale: 进入（εἰσελθεῖν）这一动词更支持空间意义；但原文复数中性形式本身有一定语义幅度，因此不进一步译成“至圣所”。
- issue: νίπτου是否明确指洗手
  choice: 洗手
  alternative: 洗净；洗身
  rationale: νίπτω与前句λούου有意区别，通常表示洗手脚等局部；献祭情境下“洗手”最合适，也避免把三次动作都误解为全身沐浴。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性表述；用分号保留原文三段平行命令。首处译“沐浴”，后两处译“洗手”，呈现λούω与νίπτω的词汇差异。未采纳修订记录中“在他面前”及“主的”等措辞，因为所给希腊来源正文并无ἐνώπιον或神名。
