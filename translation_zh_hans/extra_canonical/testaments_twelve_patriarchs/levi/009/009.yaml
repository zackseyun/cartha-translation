base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/009.yaml
  text: Take heed to yourself from the spirit of sexual immorality, for this is persistent and is about to defile the holy things through your offspring.
translation:
  language: zh_hans
  text: 你要谨防淫乱的灵，因为它持续不断，并将要借着你的后裔玷污圣物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”所译的希腊词也可指“种子”或“精液”；“圣物”也可理解为“神圣之物”。含“持续不断”的原文短语有文本疑难（底本以讹误标记标出）；译文按现存词形所可能表达的持续性理解。
    reason: 说明σπέρμα和τὰ ἅγια的语义范围，并准确保留含ἐνδελεχῆ短语的文本不确定性。
lexical_decisions:
- source_word: Πρόσεχε σεαυτῷ ἀπό
  choice: 你要谨防
  rationale: 以自然的现代汉语表达“留心自己、远离/防备”的警戒语气。
- source_word: τοῦ πνεύματος τῆς πορνείας
  choice: 淫乱的灵
  rationale: 保留原文“灵”的人格化或属灵含义，不将其弱化为单纯的欲望或倾向；πορνεία宽泛指性方面的不道德行为。
- source_word: ἐνδελεχῆ
  choice: 纠缠不休
  rationale: 底本此处有讹误标记，但该词可表达持续、不断；译法既呈现其持久性，也符合警戒语境。
- source_word: μέλλει μιαίνειν
  choice: 并将……玷污
  rationale: μέλλει表示即将或注定发生的趋向；“将”保留前瞻意味而不过度确定其情态。
- source_word: διὰ τοῦ σπέρματός σου
  choice: 借着你的后裔
  rationale: σπέρμα可指种子、精液或后裔；在此按后续世代的语境译为“后裔”，同时在脚注保留词义歧义。
- source_word: τὰ ἅγια
  choice: 圣物
  rationale: 中性复数可指圣物、圣事或圣所相关之物；“圣物”保持概括性，不擅自限定具体对象。
theological_decisions:
- issue: “淫乱的灵”的性质
  choice: 保留“灵”的直译
  alternative: 淫乱的欲望／淫乱的倾向
  rationale: 原文明确使用πνεῦμα；保留其措辞，避免预先裁定这是外在邪灵、人格化力量，还是内在倾向。
- issue: “后裔”与玷污圣物的关系
  choice: 译作“借着你的后裔”
  alternative: 因你的精液／在你的子孙中
  rationale: 保留διά所表达的媒介关系，并避免补入原文未明说的具体历史或祭司制度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“谨防”体现劝诫力度；“纠缠不休”比生硬的“是持续的”更符合汉语表达，同时保留持续性。脚注集中说明底本讹误及σπέρμα、τὰ ἅγια的语义范围。
