- source_word: μεθ’ ἡμέρας δύο
  choice: 两天后
  rationale: 自然表达“过了两天以后”，准确保留时间间隔。
- source_word: ἀνέβην
  choice: 上到……那里
  rationale: 保留希腊文表示上行、前往的动词色彩，同时使现代汉语通顺。
- source_word: μετὰ τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: 随同我们的父亲雅各
  rationale: 用“随同”清楚表达同行关系，也避免连续使用“和”造成歧义。
- source_word: τὸν προπάτορα ἡμῶν
  choice: 我们的祖父
  rationale: 在本句亲属关系中指以撒，即雅各的父亲、利未和犹大的祖父；采用现代汉语通常称谓。
