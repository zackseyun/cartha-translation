base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/010.yaml
  text: Therefore take for yourself a wife while you are still young, one who has no blemish or defilement, and not from the stock of foreign nations.
translation:
  language: zh_hans
  text: 所以，你要趁年轻为自己娶妻；她应当没有污点，也未受玷污，并且不出自外族诸民的族系。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λαβὲ…σεαυτῷ γυναῖκα
  choice: 为自己娶妻
  rationale: 按现代汉语婚姻语境自然表达“为自己取一个妻子”，同时保留命令语气。
- source_word: ἔτι νέος ὤν
  choice: 趁年轻
  rationale: 准确传达“仍然年轻时”的时间含义，汉语表达简洁自然。
- source_word: μὴ ἔχουσαν μῶμον
  choice: 她应当没有污点
  rationale: μῶμος可指瑕疵、可责之处；“污点”保留其可能涉及品行或名誉的宽泛含义，避免限定为身体缺陷。
- source_word: μήτε βεβηλωμένην
  choice: 也未受玷污
  rationale: βεβηλόω带有使之不洁、亵渎或玷污之意；“未受玷污”保留其宗教、道德或社会层面的语义张力。
- source_word: μήτε ἀπὸ γένους ἀλλοφύλων ἐθνῶν
  choice: 并且不是外族的后裔
  rationale: γένος表示出身、族系，ἀλλόφυλα ἔθνη指异族或外族各民；译文以自然汉语表达族属来源，不额外引入特定民族身份。
theological_decisions:
- issue: “污点”与“玷污”的性质
  choice: 不具体说明是身体、性、礼仪还是道德层面的缺陷或不洁
  alternative: 译作“没有身体缺陷，也没有礼仪上的不洁”
  rationale: 希腊文在此没有明确限定这些词的具体范畴；保留较宽的表达可避免把解释写入正文。
- issue: 外族出身的范围
  choice: 译作“外族的后裔”
  alternative: 译作“外邦人的后裔”
  rationale: “外族”更直接对应ἀλλόφυλος的族属差异，也避免“外邦人”在现代读者心中自动带入后期宗教术语色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”承接上文推论；分号划分娶妻命令与择偶条件，使句子清晰易读。
