  naturalness: 原句“正如亚伯拉罕也教导了我”虽可理解，但在现代汉语中作为比较从句略显悬置。改为“正如亚伯拉罕也曾教导我那样”更通顺庄重，同时不增加原文没有的对象。前半句保留受词省略，脚注足以说明。
