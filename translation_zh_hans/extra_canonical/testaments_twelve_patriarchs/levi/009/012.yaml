  text: From twelve trees having leaves, then offer to the Lord, as Abraham taught me.
translation:
  language: zh_hans
  text: 所以，要从十二棵有叶子的树上取来，献给主[a]，正如亚伯拉罕也曾教导我那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说从树上取什么；“献”所对应的希腊词也可直译为“带上去”或“拿上去”。
    reason: 说明原文受词省略以及动词在一般动作与礼仪性“献上”之间的语义幅度。
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 表达承接上文而得出的指示或结论，比机械译作“然后”更符合该词通常的推论意味。
- source_word: δώδεκα δένδρων ἐχόντων φύλλα
  choice: 十二棵有叶子的树
  rationale: 保留数量、树木及“有叶子”的限定；原文使用属格结构，结合省略的受词，译为“从……树上取来”以形成自然汉语。
- source_word: ἀνάγαγε τῷ Κυρίῳ
  choice: 取来，献给主
  rationale: ἀνάγαγε 基本义为“带上去、拿上去”，在献祭语境中可表示“献上”；中文以“取来，献给”兼顾动作与礼仪含义。
- source_word: ὡς κἀμὲ Ἀβραὰμ ἐδίδαξε
  choice: 正如亚伯拉罕也教导了我
  rationale: κἀμέ 是 καὶ ἐμέ 的缩合，保留“也”字，同时不额外限定亚伯拉罕还教导了谁。
theological_decisions:
- issue: “献给主”是否特指某一种祭物或礼仪
  choice: 不指明祭物种类，仅译“献给主”
  alternative: 补作“把叶子献给主”或指明某种祭物
  rationale: 希腊文本未明说所取或所献之物；避免把省略成分解释为特定祭物，从而保留原文的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“从……取来，献给主”使省略受词的希腊句法在中文中可读，同时用脚注保留其真实含混；不增添特定祭祀制度或宗派解释。
