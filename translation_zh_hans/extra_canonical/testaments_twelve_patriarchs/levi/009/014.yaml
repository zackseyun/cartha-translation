source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *παντὸς πρωτογεννήματός σου⁶⁰ καὶ οἴνου⁶¹ πρόσφερε *ἀπαρχὰς εἰς θυσίαν Κυρίῳ⁶² Γτῷ θεῷ⁶³⁾. *Καὶ πᾶσαν θυσίαν ἅλατι ἁλιεῖς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/014.yaml
  text: And of all your first produce and of wine offer firstfruits as a sacrifice to the Lord God. And every sacrifice you shall salt with salt.
translation:
  language: zh_hans
  text: 你要从你一切初产之物和酒中献上初熟之物，作为祭物献给主上帝。每一份祭物，你都要用盐调和。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用盐调和”直译可作“用盐使之带盐”，即给每一份祭物加盐。
    reason: 说明希腊语同源词组ἅλατι ἁλιεῖς的字面表达，同时不把具体操作限定为腌制或调味。
lexical_decisions:
- source_word: παντὸς πρωτογεννήματός σου
  choice: 你一切初产之物
  rationale: πρωτογέννημα在此指首先出产之物；用“初产之物”既保留其与“初熟之物”的词义联系，也不把范围擅自限定为某一种农产。
- source_word: ἀπαρχὰς
  choice: 初熟之物
  rationale: 指从收成中首先分别出来献上的部分；“初熟之物”是自然且具有祭献语境的现代中文表达。
- source_word: εἰς θυσίαν
  choice: 作为祭物
  rationale: 保留θυσία的祭献含义，并使“献上……献给”在中文中结构清楚。
- source_word: Κυρίῳ τῷ θεῷ
  choice: 主上帝
  rationale: 按来源所见的完整神圣称号直译，不因英语修订中冠词问题改变希腊语称谓。
- source_word: ἅλατι ἁλιεῖς
  choice: 用盐调和
  rationale: 该短语字面为“以盐使之带盐/加盐”；“用盐调和”保留礼仪动作，比现代烹饪色彩较强的“调味”更合适。
theological_decisions:
- issue: 盐在祭物中的功能
  choice: 用盐调和
  alternative: 用盐腌／撒盐调味
  rationale: 原文只明确要求祭物加盐，并未解释盐的盟约象征或具体操作方式，因此不在正文中加入神学解释。
- issue: “主上帝”的称谓
  choice: 主上帝
  alternative: 上帝耶和华／主神
  rationale: Κύριος ὁ θεός在此是称号；不将Κύριος回译成特定神名，也避免“主神”在现代中文中的歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你要……献上”呈现命令语气；保留“初产之物”与“初熟之物”的词义区别。正文只设置一个确有解释价值的脚注，标记已在正文出现。
