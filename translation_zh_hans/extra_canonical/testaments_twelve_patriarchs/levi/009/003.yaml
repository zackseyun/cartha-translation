  text: And when we came to Bethel, my father Jacob saw a vision about me, that I would be a priest to them.
translation:
  language: zh_hans
  text: 当我们来到伯特利时，我父亲雅各看见了一个有关我的异象：我将作他们的祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βεθήλ
  choice: 伯特利
  rationale: 采用这一传统且通行的圣经地名译法。
- source_word: εἶδεν ... ὅραμα
  choice: 看见一个……异象
  rationale: 贴近希腊文的表达，同时符合现代汉语习惯；保留异象作为所见启示的含义。
- source_word: περὶ ἐμοῦ
  choice: 关于我的
  rationale: 直接表达该介词短语，保留异象以利未为内容或对象的宽泛含义。
- source_word: ἔσομαι αὐτοῖς εἰς ἱερέα
  choice: 我将作他们的祭司
  rationale: 用自然汉语表达其身份与相对于“他们”的职分关系，避免生硬直译为“对他们成为祭司”。
theological_decisions:
- issue: ὅτι 所引内容与异象之间的关系
  choice: 以“知道”衔接异象内容
  alternative: “异象显示我将作他们的祭司”或“就是我将作他们的祭司”
  rationale: 现代汉语中，“看见一个关于我的异象，知道……”自然表达雅各从异象所得的启示；不额外断定祭司职分的制度形态。
- issue: αὐτοῖς 所指对象
  choice: 保留为“他们”
  alternative: 明确译为“众人”“家族”或“兄弟们”
  rationale: 希腊文本身未在本句内明示先行词，因此不擅自补明对象，以保留原文的指代开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“作他们的祭司”既自然，也保留原文祭司职分的关系性；未加入原文没有的宗派性解释。
