  source_fidelity: 原文命令“从一切/每一种洁净的动物和飞鸟中……献上祭物给主”基本得到保留；但“走兽”将ζῷον缩窄为陆地四足兽，原词本身泛指动物，且并列飞鸟并不必然要求这种限定。另，πρόσφερε θυσίαν含有“献上祭物”的宾语，明示可更准确反映原文。
  naturalness: 原译简明庄重，但“从……中，献祭给主”略显悬置；改为“从……中，向主献上祭物”更顺畅，也更符合现代汉语的祭祀表达。
  terminology: “洁净”“飞鸟”“主”均恰当，并保留礼仪分类及κύριος的称谓性，而不附加解释。将“走兽”改为“动物”避免无根据地限定类别。
