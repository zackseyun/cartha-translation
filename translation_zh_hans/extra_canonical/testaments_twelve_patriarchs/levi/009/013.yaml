  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/013.yaml
  text: And from every clean animal and bird offer a sacrifice to the Lord.
translation:
  language: zh_hans
  text: 要从一切洁净的动物和飞鸟中，向主献上祭物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς ζώου καθαροῦ
  choice: 各样洁净的走兽
  rationale: ζῷον可泛指动物；与后面的“飞鸟”并列时，译作“走兽”更自然，也清楚保留祭牲分类。παντός在这里表达各类或每一种，故译“各样”。
- source_word: πετεινοῦ
  choice: 飞鸟
  rationale: 该词指有翼飞禽；“飞鸟”是现代汉语中自然、庄重且符合祭祀语境的表达。
- source_word: πρόσφερε θυσίαν
  choice: 献祭
  rationale: 直译为“献上祭物”；汉语“献祭”简洁地表达实施献祭的命令，同时保留祭祀含义。
- source_word: τῷ Κυρίῳ
  choice: 给主
  rationale: 保留与格所表示的献祭对象或受献者，不额外解释其神学身份。
theological_decisions:
- issue: 洁净动物的范围
  choice: 保留“洁净”这一礼仪分类，不作说明
  alternative: 解释为摩西律法所准许献祭的动物
  rationale: 原文只使用καθαροῦ，并未明说具体律法体系；保持原有简洁与潜在的历史张力。
- issue: παντός是否要求从每一个个体献祭
  choice: 译为“各样”，理解为各类洁净走兽
  alternative: 译为“每一只洁净的走兽”
  rationale: 在献祭语境中，παντός更自然地表示类别范围；译成每一个个体会产生原文未必具有的数量要求。
translation_notes:
  register: 采用现代、简明而庄重的命令句。“要……献祭给主”适合父辈训诫语境；不添加原文没有的主语，也不补入祭物数量、方式或律法背景。
