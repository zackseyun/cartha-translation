base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/002.yaml
  text: And my grandfather blessed me because of the visions that I had seen, and he was not willing to go with us to Bethel.
translation:
  language: zh_hans
  text: 我祖父因我所见的那些异象而为我祝福；他不愿同我们一起去伯特利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πατὴρ τοῦ πατρός μου
  choice: 我祖父
  rationale: 原文直译为“我父亲的父亲”，现代汉语自然表达为“我祖父”。
- source_word: κατὰ τῶν ὁραμάτων ὧν εἶδον
  choice: 因我所见的那些异象
  rationale: κατά在此结合上下文表达祝福所依据或缘由；译作“因”符合语义和自然汉语，同时保留“异象”为复数所指。
- source_word: οὐκ ἠθέλησε
  choice: 不愿
  rationale: 准确表达意愿上的拒绝，而不是能力不足或客观上未能成行。
- source_word: Βεθήλ
  choice: 伯特利
  rationale: 采用现代中文圣经传统中通行的地名音译。
theological_decisions:
- issue: 祖父祝福与异象之间κατά所表达的关系
  choice: 因我所见的那些异象而为我祝福
  alternative: 照着我所见的那些异象为我祝福
  rationale: κατά可表示依据、关联或缘由；这里采用较自然的因由表达，但不增添异象内容或祝福性质方面的解释。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“我祖父”避免生硬照译，“同我们一起去”清楚传达同行之意；以分号连接两个紧密相关但主旨有转折的分句。
