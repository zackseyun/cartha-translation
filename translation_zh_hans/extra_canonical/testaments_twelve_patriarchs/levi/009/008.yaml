  text: 他每天都教导我，并在我身上费心，对我说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετίζων
  choice: 教导
  rationale: 该分词表示使人明白、给予训诲；此处自然译为“教导”，不加入希腊文本未明说的具体教导内容。
- source_word: ἀσχολούμενος εἰς ἐμὲ
  choice: 专心在我身上
  rationale: 保留“把时间和注意力用在我身上”的含义，同时采用自然、庄重的现代汉语表达。
- source_word: ἔλεγέ μοι
  choice: 对我说
  rationale: 忠实表达持续叙事中的言说动作，并用冒号引出下文。
theological_decisions:
- issue: 是否补入“甘心祭／自愿献祭”作为教导内容
  choice: 不补入
  alternative: 他每天都教导我有关甘心祭的事
  rationale: 现有希腊文本只说“教导我”，没有与“甘心祭”对应的宾语；补入会把文本证据之外的内容带入正文。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“每天都”体现 καθ᾽ ἑκάστην ἡμέραν；两个未完成时分词与 ἔλεγέ 的持续性由整体语境自然呈现，不机械重复“不断”。
