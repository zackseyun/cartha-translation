  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/004.yaml
  text: And rising early in the morning, he tithed everything through me to the Lord.
translation:
  language: zh_hans
  text: 他清早起来，借着我把一切的十分之一献给了主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς τῷ πρωὶ
  choice: 清早起来
  rationale: 自然表达分词与时间短语的组合，既保留“起来”，也传达“在早晨”的时间意义。
- source_word: ἀπεδεκάτωσε πάντα
  choice: 把一切的十分之一献给了
  rationale: 动词表示取出或缴纳十分之一；汉语用“把一切的十分之一献给”比生硬的“将一切什一化”更自然，并明确所献的是全部所得或所有物中的十分之一，而不是把全部都献上。
- source_word: δι’ ἐμοῦ
  choice: 借着我
  rationale: 保留介词结构可能表示由“我”作为中介或执行者的含义，不擅自具体化其方式。
- source_word: τῷ Κυρίῳ
  choice: 给了主
  rationale: 与献纳表达自然搭配，并保留“主”这一称谓。
theological_decisions:
- issue: “借着我”所表示的角色
  choice: 保留“借着我”
  alternative: 由我代为献给
  rationale: 原文只表明“我”具有中介性，未明确是代理献纳、祭司职分或其他具体角色，因此不进一步解释。
- issue: “十分之一”与“一切”的关系
  choice: 把一切的十分之一献给了主
  alternative: 把一切都作为十分之一献给了主
  rationale: ἀποδεκατόω通常指从某物中献纳十分之一；此译避免被理解为把全部财物尽数献上，同时保留πάντα所表达的全面范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；句式紧凑，忠实保留原文的时间、行动、中介与受献对象。
