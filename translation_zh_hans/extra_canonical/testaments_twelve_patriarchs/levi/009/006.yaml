  text: And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me.
translation:
  language: zh_hans
  text: 以撒不断地呼唤我，为要使我想起主的律法，正如那位天使向我所指示的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλει με συνεχῶς
  choice: 不断叫我去
  rationale: 保留“呼叫、召唤我”的动作及持续反复之意；补出趋向成分“去”，使现代汉语自然，但不另加目的地。
- source_word: τοῦ ὑπομνῆσαί με νόμον Κυρίου
  choice: 好提醒我主的律法
  rationale: 按不定式目的结构译为“好……”，并保留“提醒我”的受事关系；νόμον不加定冠词式限定，译作“主的律法”。
- source_word: καθὼς ἔδειξέ μοι ὁ ἄγγελος
  choice: 正如那位天使指示我的
  rationale: καθώς译为“正如”，ἔδειξεν译作较宽泛的“指示”，不擅自明确所指是律法内容、做法还是异象；用“那位天使”自然表达希腊文定冠词。
theological_decisions:
- issue: 天使所“指示”的内容
  choice: 以省略宾语的“正如那位天使指示我的”保留原文表达
  alternative: “正如那位天使把主的律法指示给我的那样”
  rationale: 希腊文ἔδειξέ μοι没有明说宾语；上下文可能指律法，也可能指相关教导或行动方式，因此不在译文中补定。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“不断”比“持续不断地”简洁，“叫我去”体现反复召唤；末句保留原文宾语省略所形成的轻微含混。
