  text: 1[a]. When I took a wife, I was twenty-eight years old, and her name was Melcha. 2. And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning. 3. And I saw concerning him that he was not in the first rank. 4. And Kohath was born in the thirty-fifth year of my life, and I saw in a vision, toward the sunrise, 5. that he stood in the midst of the congregation[b], in the heights. 6. Therefore I called his name Kohath, which is, beginning of majesty and assembly. 7. And a third son, Merari, was born to me in the fortieth year of my life; and because his mother bore him with difficulty, I called him Merari, which is bitterness. 8. And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: zh_hans
  text: '《利未遗训》第11章


    1 我娶妻时二十八岁；她名叫梅尔迦。2 她怀孕生了一个儿子，我给他取名叫革舜，因为我们当时寄居在异乡。3 我看见有关他的事，知道他不在第一等次之中。


    4 哥辖出生在我三十五岁那年，朝着日出之处。5 我在异象中看见：他站在全体会众当中，在高处。6 因此，我给他取名叫哥辖，意思是“尊荣的开端和联合”[a]。


    7 我四十岁那年，她又给我生了第三个儿子米拉利。因为他母亲生他时难产，我就给他取名叫米拉利，意思是“苦楚”。8 约基别出生在埃及，那年我六十四岁；因为她那时在我的众弟兄中大有尊荣[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 哥辖名字后面的解释在希腊语见证中疑难。“尊荣的开端和联合”依照现存文字直译，未尝试重构成更顺畅的说法。
    reason: textual_variant
  - marker: b
    text: 本节末句的文本和语意较不稳定。现存希腊文的“有尊荣”是阴性形式，最自然地指约基别；也有整理方式将这句话理解为利未当时在弟兄中享有尊荣。约基别在埃及、于利未六十四岁那年出生，则是本句清楚的主干。
    reason: textual_variant
lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  choice: 娶妻
  rationale: 这是表示结婚的常用希腊语表达；“娶妻”简洁自然，也保留遗训体的庄重语气。
- source_word: παροικίας
  choice: 寄居在异乡
  rationale: 该词指作为外来者暂住；译文既表达寄居身份，也使革舜的命名缘由对现代读者清楚。
- source_word: πρώτῃ τάξει
  choice: 第一等次
  rationale: τάξις可指次序、等级或班次；“第一等次”保留其身份与次序两方面的含混，不将其明确化为后来的祭司等级。
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: 朝着日出之处
  rationale: 直译为“朝向太阳升起之处”；按现存希腊语句法附属于哥辖出生的陈述，保留其空间或异象性的含混。
- source_word: ἐν ὑψηλοῖς
  choice: 在高处
  rationale: 保留复数实体化形容词所表达的崇高或高天意象，但不强行解释为特定天界。
- source_word: συναγωγῆς
  choice: 会众
  rationale: 在神圣群体语境中，“会众”自然且庄重；πάσης译作“全”，没有省略范围。
- source_word: ἀρχὴ μεγαλείου καὶ συμβιβασμός
  choice: 尊荣的开端和联合
  rationale: μεγαλεῖον在此表达伟大、威荣或尊荣；συμβιβασμός可指联结、联合。译文紧贴现存困难文本，不重构更顺畅的词源解释。
- source_word: ἐδυστόκησεν
  choice: 难产
  rationale: 该动词明确表示艰难生产；“难产”比泛泛的“生产困难”更简洁准确。
- source_word: πικριασμός
  choice: 苦楚
  rationale: 词义涉及苦涩、痛苦；结合难产语境，“苦楚”自然，同时保留命名解释的语义联系。
- source_word: ἔνδοξος
  choice: 大有尊荣
  rationale: 该词表示有荣耀、受尊重；现存希腊语为阴性形式，语法上指向约基别，因此译作“她……大有尊荣”。
theological_decisions:
- issue: 利未对革舜与哥辖的异象性评断是否明确指向后来的利未祭司等级
  choice: 仅按经文陈述革舜不在第一等次、哥辖居于会众中央高处
  alternative: 明确解释为后来哥辖支派或祭司体系中的优先地位
  rationale: 希腊文暗示相对地位，却未在本章明说具体制度；译文保留预示性质，不加入后来的祭司历史框架。
- issue: 第8节“有尊荣者”的所指
  choice: 依现存希腊文阴性形态，将ἔνδοξος理解为约基别
  alternative: 依部分整理或上下文推断理解为利未本人在弟兄中享有尊荣
  rationale: 原文语法最直接地指向阴性主语约基别，但句意和传本状态困难，因此正文按语法翻译，并以脚注交代另一种理解。
translation_notes:
  register: 采用现代标准普通话、简体中文和庄重而易懂的遗训体。人物名优先采用与中文圣经传统相协调的形式：革舜、哥辖、米拉利、约基别；Melcha因无统一通行译名，音译为“梅尔迦”。保留原文异象、次序和命名解释中的含混，不以教派性术语加以限定。
