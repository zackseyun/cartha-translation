  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/005.yaml
  text: I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt.
translation:
  language: zh_hans
  text: 我八岁时进入迦南地；十八岁时杀了示剑；十九岁时担任祭司；二十八岁时娶妻；四十八岁时进入埃及。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθον εἰς γῆν Χανάαν
  choice: 进入迦南地
  rationale: 直译其行动与地名，符合现代汉语习惯。
- source_word: ἀπέκτεινα τὸν Συχέμ
  choice: 杀了示剑
  rationale: 保留希腊文本以第一人称陈述杀死“示剑”的直接含义；不擅自将名称改释为城邑。
- source_word: ἱεράτευσα
  choice: 担任祭司
  rationale: 该动词表示履行祭司职分；“担任祭司”比“作祭司供职”更自然，同时不增添礼仪细节。
- source_word: ἔλαβον γυναῖκα
  choice: 娶妻
  rationale: 按上下文将字面“取得一个女人”译为自然汉语婚姻表达。
- source_word: εἰσῆλθον εἰς Αἴγυπτον
  choice: 进入埃及
  rationale: 保留与前文“进入迦南地”相应的结构。
theological_decisions:
- issue: 利未十九岁时“ἱεράτευσα”的职分性质
  choice: 担任祭司
  alternative: 开始履行祭司职务
  rationale: 原文仅陈述他作祭司，并未明确说明这是正式受任、首次供职或制度化祭司体系中的任命，因此采用不额外界定起始仪式与制度背景的译法。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，以分号清楚呈现年龄次序。数字依正文校订标记所支持的读法译作八、十八、十九、二十八、四十八；不将版本校勘符号带入正文。
