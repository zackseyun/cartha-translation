  text: And Gersam took a wife, and she bore to him Lomne and Semee.
translation:
  language: zh_hans
  text: 格尔散娶了妻子，并与她生了罗姆尼和塞梅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν…γυναῖκα
  choice: 娶了妻子
  rationale: 这是希腊语中表示男子娶妻的常见表达；译为现代汉语“娶了妻子”自然且准确。
- source_word: ἔτεκεν ἐξ αὐτῆς
  choice: 她给他生了
  rationale: ἔτεκεν 表示生育；结合前句中的“妻子”，以妻子为语义主语最合乎上下文。原文的 ἐξ αὐτῆς 字面为“从她”，汉语按亲子叙述习惯表达为“她给他生了”，不采用容易误解的机械直译。
- source_word: Γερσὰμ / Λομνὴ / Σεμεῆ
  choice: 格尔散／罗姆尼／塞梅
  rationale: 依现存希腊文本的姓名形式音译，不擅自改成其他传统中可能对应的人名形式。
