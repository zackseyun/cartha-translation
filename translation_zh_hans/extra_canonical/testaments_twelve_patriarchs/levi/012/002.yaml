  text: And the sons of Kohath were Amram, Issachar, Hebron, and Uzziel.
translation:
  language: zh_hans
  text: 哥辖的儿子有亚伯拉罕[a]、以萨迦[b]、希伯仑和乌薛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“亚伯拉罕”；《出埃及记》6:18等处的哥辖家谱作“暗兰”。
    reason: 提示源文本与较熟悉的平行家谱之间的真实差异，避免在正文中暗自校改。
  - marker: b
    text: 希腊文本作“以萨迦”；《出埃及记》6:18等处的哥辖家谱作“以斯哈”。
    reason: 保留并说明文本差异，防止读者误以为译名混淆。
lexical_decisions:
- source_word: Καὰθ
  choice: 哥辖
  rationale: 采用《圣经》汉语传统中对利未之子 Kohath 的通行译名。
- source_word: Ἀβραάμ
  choice: 亚伯拉罕
  rationale: 严格按所提供的希腊文本译出；该词明确是“亚伯拉罕”，不依据平行家谱擅自改作“暗兰”。
- source_word: Ἰσαχάρ
  choice: 以萨迦
  rationale: 严格按希腊文本的名字译出；不依据平行家谱擅自改作“以斯哈”。
- source_word: Χεβρών
  choice: 希伯仑
  rationale: 采用该人名在现代汉语《圣经》中的通行形式。
- source_word: Ὀζηήλ
  choice: 乌薛
  rationale: 采用 Uzziel 在现代汉语《圣经》中的通行译名，兼顾希腊音形及人物辨识。
theological_decisions:
- issue: 本节名单与《出埃及记》6:18等处哥辖家谱不一致
  choice: 正文保留希腊底本的“亚伯拉罕、以萨迦”
  alternative: 按平行家谱校改为“暗兰、以斯哈”
  rationale: 源语证据优先；所给希腊文本确实作 Ἀβραάμ、Ἰσαχάρ。译文不应无文本依据地消除家谱差异，脚注则提示读者相关传统。
- issue: 修订记录声称原文末有“他死了”
  choice: 不增译该句
  alternative: 在正文末添加“他死了”
  rationale: 用户提供的希腊文本中没有 ἀπέθνησκεν 或其他表示死亡的词，因此不能采用与当前源文本不符的增补。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语家谱句式“……的儿子有……”。所有人名使用简体中文通行形式；对源文本中异常但明确的两个名字不作静默订正。
