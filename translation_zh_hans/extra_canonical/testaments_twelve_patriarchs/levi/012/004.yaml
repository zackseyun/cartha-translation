lexical_decisions:
- source_word: ἐνενηκοστῷ τετάρτῳ μου ἔτει
  choice: 我九十四岁那年
  rationale: 准确表达“我生命中的第九十四年”，并采用现代汉语自然的年龄表述。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 依所给希腊文本音译为通行中文名“亚伯拉罕”，不按可能的叙事或谱系预期擅自改作其他人名。
- source_word: Ἰωχαβὲδ
  choice: 约基别
  rationale: 采用该圣经人名的现代中文通行译名。
- source_word: ἔλαβεν … ἑαυτῷ εἰς γυναῖκα
  choice: 娶了……为妻
  rationale: 以自然、庄重的现代汉语表达希腊语“为自己取作妻子”。
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: 在同一天
  rationale: 忠实传达两人出生于同一日；无需机械译出“一日之内”。
theological_decisions:
- issue: “亚伯拉罕”与上下文或谱系可能存在的张力
