base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004.yaml
  text: '1. Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are being split, and the sun is being extinguished, and waters are drying up, and fire is cowering, and all creation is being shaken, and the invisible spirits are melting away, and Hades is being plundered at the suffering of the Most High, men will persist in disobedience and remain in their injustices. Therefore they will be judged with a greater punishment.


    2. Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister of his presence.


    3. You shall shine forth the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.


    4. And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son forever.


    5. And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.


    6. For those who bless him will be blessed, and those who curse him will perish.'
translation:
  language: zh_hans
  text: '《利未遗训》第4章


    1 所以，你现在要知道，主必审判世人。当磐石裂开，太阳熄灭，众水干涸，火焰畏缩，一切受造之物震动，看不见的诸灵消融，阴间在至高者受难时遭到劫掠[a]之际，人仍会悖逆不从，继续行种种不义。因此，他们必受更重的刑罚。


    2 因此，至高者已经垂听你的祷告，要使你脱离不义，作他的儿子、仆从和在他面前供职的人。


    3 你必使知识之光在雅各中照耀；你也必如太阳，照耀以色列所有的后裔。


    4 福分必赐给你和你所有的后裔，直到主在他儿子[b]的深切怜悯中眷顾万国，直到永远。不过，你的子孙必下手害他，把他钉在木架上。[c]


    5 正因如此，谋略和悟性已经赐给你，使你的儿子明白这事。


    6 因为，祝福他的必蒙祝福；咒诅他的必灭亡。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在至高者受难时”在校勘文本中置于方括号，表明这几个词的原始性存在疑问。
    reason: 提示重要文本变异，并避免读者误以为所有见证都同样支持该短语。
  - marker: b
    text: “儿子”在校勘文本中置于方括号。若不采用该词，本句可译为：“直到主在他的深切怜悯中眷顾万国，直到永远。”
    reason: 保留υἱοῦ有无所造成的语义差异。
  - marker: c
    text: 从“不过”到本句末尾，校勘文本整体置于方括号，可能是后来的增补。“钉在木架上”所译的希腊词也可指钉上木桩、悬挂或钉十字架。
    reason: 同时交代整句的文本不确定性和处刑术语的语义范围。
  - marker: d
    text: 本节两处“他”在希腊文中的指代并不完全明确，可能承接前文的主、他的儿子，或前述被下手所害的那一位。
    reason: 保存原文代词的真实歧义，不以教义判断强定先行词。
lexical_decisions:
- source_word: τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: 世人
  rationale: 直译为“人的众子”在现代汉语中生硬；此处泛指人类，以“世人”自然传达其范围。
- source_word: τοῦ πυρὸς καταπτήσσοντος
  choice: 火焰退缩
  rationale: καταπτήσσω有因惊惧而畏缩、蜷伏之意；“退缩”保留拟人化意象，又比“畏缩”用于火更自然。
- source_word: τοῦ ᾅδου σκυλευομένου
  choice: 阴间……遭到劫掠
  rationale: ᾅδης指亡者之境，σκυλεύω表示掠夺、夺取战利品；译文保留被动和劫掠意象。
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: 侍立在他面前的事奉者
  rationale: λειτουργός在此为履行神圣职事者；加入“侍立”自然表达τοῦ προσώπου αὐτοῦ所含的在其面前供职之意。
- source_word: ἐν σπλάγχνοις [υἱοῦ] αὐτοῦ
  choice: 以他儿子的怜悯
  rationale: σπλάγχνα字面为内脏，惯用于深切怜悯；按所给校勘正文保留“儿子”，但以脚注说明文本问题及代词关系。
- source_word: ἀνασκολοπίσαι
  choice: 钉在木架上
  rationale: 该词可指钉上木桩、悬挂或施以十字架刑；此译避免过早把具体刑具限定为传统十字形，同时保留处刑含义。
- source_word: περὶ τούτου
  choice: 这事
  rationale: 保持指代概括，不擅自把它缩限为前句中的某一单独事件。
theological_decisions:
- issue: “至高者受难”是否应作教义性解释
  choice: 直译为“至高者受难时”，不解释受难者与神性之间的关系
  alternative: 改译为“至高者之子受难时”或把短语删去
  rationale: 现有希腊语为ἐπὶ τῷ πάθει τοῦ ὑψίστου，虽被校勘括号标示，语法上确为“至高者的受难”；应保留其张力，不以特定基督论替文本解难。
- issue: 第4节“儿子”的校勘身份
  choice: 正文保留“他儿子”，并加文本脚注
  alternative: 按不含υἱοῦ的读法译作“以他的怜悯”
  rationale: 所给校勘文本将υἱοῦ置于方括号，表示真实性存疑；正文依编辑文本呈现，同时让读者知道较短读法。
- issue: 第4节关于子孙下手处死“他”的句子
  choice: 收入正文并标明文本问题
  alternative: 按英语咨询稿完全省略
  rationale: 该句出现在所给希腊语校勘文本中，虽整体置于方括号而可能是后加；源文本优先，故不无声删除。
- issue: 第6节αὐτόν的指代
  choice: 译作“他”，保留指代开放性
  alternative: 明确译成“那位儿子”“主”或“利未”
  rationale: 希腊文代词的先行词在现存段落中并不完全明确；明确化会导入解释。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。句法尽量清楚，但保留启示文学的宇宙性意象及原文的神学张力；“世人”“事奉者”等用语兼顾普通读者的可懂度与宗教语境。所有校勘上显著的方括号内容均通过脚注公开说明。
