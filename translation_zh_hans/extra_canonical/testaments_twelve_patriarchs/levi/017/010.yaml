  text: '*Καὶ ἐν τῇ πέμπτῃ⁴⁷ ἑβδομάδι⁴⁸ ἐπιστρέψουσιν εἰς γῆν ἐρημώσεως αὐτῶν, καὶ⁴⁹ ἀνακαινοποιήσουσιν οἶκον κυρίου⁵⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/010.yaml
  text: And in the fifth week they will return to the land of their desolation, and they will renew the house of the Lord.
translation:
  language: zh_hans
  text: 在第五个七期，他们必回到他们那片荒废的土地，并重新修建主的殿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέμπτῃ ἑβδομάδι
  choice: 第五个七期
  rationale: ἑβδομάς字面指由七构成的时段；上下文可能是象征性的时期。译作“七期”既保留其数值结构，也避免擅自确定为普通的一周或七年。
- source_word: γῆν ἐρημώσεως αὐτῶν
  choice: 他们荒废之地
  rationale: 保留属格结构所包含的张力：既可指他们那片遭荒废的土地，也可能涉及与他们相关的荒凉状态；中文采用简洁而略带开放性的表达。
- source_word: ἐπιστρέψουσιν
  choice: 将回到
  rationale: 此处与地点短语连用，主要表示返回，故不译为带有明确宗教含义的“悔改”或“归向”。
- source_word: ἀνακαινοποιήσουσιν
  choice: 重建
  rationale: 该复合动词意为使之更新、重新建造；用于建筑物时，“重建”最自然，并传达恢复更新之意。
- source_word: οἶκον κυρίου
  choice: 主的殿
  rationale: οἶκος字面为“房屋、家”，在此语境中指敬拜场所；“主的殿”是现代中文中清楚而庄重的表达。
theological_decisions:
- issue: “主的殿”所指的性质
  choice: 不明确指称某一特定历史阶段或神学实体
  alternative: 明确译作“耶和华的圣殿”或将其解释为某种属灵群体
  rationale: 希腊文仅作οἶκον κυρίου，未明说神名，也没有在本句中提供寓意化解释，因此保留其历史与神学开放性。
- issue: “第五个七期”的时间单位
  choice: 保留为未具体界定的“七期”
  alternative: 译作“第五周”或“第五个七年”
  rationale: ἑβδομάς可表示一周，也可表示由七构成的时期；本句本身不足以确定其具体长度，不宜消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“荒废之地”保留原文的凝练感；“重建主的殿”则符合自然中文宗教史叙述。
