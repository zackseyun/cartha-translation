  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/005.yaml
  text: And the fourth will be in pains, because lawlessness will increase upon him to abundance, and all Israel will hate each one his neighbor.
translation:
  language: zh_hans
  text: 第四位将处于痛苦之中，因为不义将在他身上加增到极多；全以色列人都将各自憎恨自己的邻人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: 第四个时期
  rationale: 原文以阳性序数词作名词，承接上下文所列的祭司时期；补出“时期”可使现代汉语语意完整，同时不把它误解为某个具体人物。
- source_word: ἐν ὀδύναις
  choice: 充满痛苦
  rationale: ὀδύνη可指痛苦、苦楚；此处复数并与ἐν连用，译作“充满痛苦”自然地保留其强烈和持续意味。
- source_word: ἡ ἀδικία
  choice: 不法之事
  rationale: ἀδικία涵盖不义、邪恶及违法乱纪；“不法之事”贴合此处社会与道德秩序败坏的语境，又避免缩窄为单纯法律罪行。
- source_word: ἐπ’ αὐτῷ
  choice: 在其中
  rationale: 代词可回指“第四个时期”；译作“在其中”保留空间化表达，并避免将时期人格化为承受不法的个人。
- source_word: εἰς πλῆθος
  choice: 大大增多
  rationale: 字面为“达到众多/大量”；以现代汉语表达其数量增长至甚多的结果。
- source_word: ἕκαστος τὸν πλησίον αὐτοῦ
  choice: 人人都将恨自己的邻人
  rationale: 保留“各人—自己的邻人”的逐一对应关系；“邻人”较“邻居”范围更广，可包括身边的同胞与他人。
theological_decisions:
- issue: ἀδικία的道德与法律含义
  choice: 不法之事
  alternative: 不义
  rationale: 两者均有根据；此处选择“不法之事”以呈现对秩序和正义的背离，但不将其限定为违反成文法。
- issue: ὁ τέταρτος的省略所指
  choice: 第四个时期
  alternative: 第四个
  rationale: 上下文涉及依次排列的祭司时期；正文补出“时期”有助于读者理解，但不进一步界定其历史身份。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“第四个时期”补足希腊语名词化序数词的上下文所指；分号呈现因果说明之后转入全体以色列彼此仇恨的并列结果。
