lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: 七十个七
  rationale: 原文直译为“七十个七”，其中第二个ἑβδομάδων可表示以七为一组的周期；如此译法保留其可能指“七十个七期”的含义，避免直接解释成“七十周”或“七十个星期”。
- source_word: ἱερωσύνης
  choice: 祭司职分
  rationale: 该词指祭司的身份、职任或祭司制度；本句是在引出后续关于祭司职分的论述，“祭司职分”自然且不将含义限缩为个别祭司。
- source_word: ἀκούσατε
  choice: 要听
  rationale: 保留希腊文命令语气，同时以现代汉语自然表达。
theological_decisions:
- issue: “七十个七”的时间单位是否应明确为周、年周或其他周期
  choice: 保留为“七十个七”
  alternative: 七十周
  rationale: 原文本身只说“七十个七”，未明示每个单位的长度；保留形式可避免把某一种历法或预言解释写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“既然……现在也要……”传达ὅτι与καί所形成的承接关系；不添加原文没有的解释性称谓或神学限定。
