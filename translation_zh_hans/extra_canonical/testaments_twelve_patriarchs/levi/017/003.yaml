base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/003.yaml
  text: In the second jubilee, the anointed one will be seized in mourning for a beloved one, and his priesthood will be honored, and he will be glorified by all.
translation:
  language: zh_hans
  text: 在第二个禧年，受膏者将在为所爱之人哀悼之时被擒获[a]；他的祭司职分必得尊荣，他必蒙众人荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被擒获”所译的希腊词也可指“被抓住”。在生育语境中，该词的被动形式还可指“被怀胎”或“被孕育”。本句的传抄和句法较为艰涩；若取后一义，可形成“在所爱之人的哀恸中被孕育”等不同理解。
    reason: 保留 συλληφθήσεται 的重要词义歧义，同时正文避免把“抓住”限定为正式逮捕。
lexical_decisions:
- source_word: δευτέρῳ ἰωβηλαίῳ
  choice: 第二个禧年
  rationale: 按原文保留时期名称和序数，不把“禧年”解释为普通周年。
- source_word: ὁ χριόμενος
  choice: 受膏者
  rationale: 用自然、庄重的名词表达“那位被膏立的人”，同时避免额外加入特定身份或宗派性称谓。
- source_word: συλληφθήσεται
  choice: 将……被捕
  rationale: 该词在此为将来被动式，通常表示被抓住、逮捕；此译法符合现有校订所依据的语境，但以脚注保留其潜在词义歧义。
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: 在为所爱之人哀悼时
  rationale: πένθος 表示哀恸、服丧；ἀγαπητοῦ 的属格可自然理解为哀悼的对象。中文以“所爱之人”保留其身份未明。
- source_word: ἡ ἱερωσύνη αὐτοῦ τιμία
  choice: 他的祭司职分必受尊崇
  rationale: ἱερωσύνη 指祭司身份或职分；τιμία 表示贵重、尊贵或受尊敬。译文兼顾职分与荣誉含义。
- source_word: παρὰ πάντων δοξασθήσεται
  choice: 他也必被众人尊崇
  rationale: 保留被动语态和“众人”的范围；δοξάζω 在此指给予荣耀、尊崇。
theological_decisions:
- issue: “受膏者”的身份
  choice: 不明确指认，只译作“受膏者”
  alternative: 译作“弥赛亚”或明确指向某一特定人物
  rationale: 原文仅用 χριόμενος，虽具受膏和可能的弥赛亚意涵，却没有在本句中明确完成身份指认。
- issue: “所爱之人”与受膏者的关系
  choice: 保留未说明的关系
  alternative: 解释为受膏者自己所爱的人、上帝所爱的人或受膏者本身
  rationale: ἀγαπητοῦ 只有阳性/中性单数属格形式，句法和所指均有一定含混，正文不宜补足原文没有交代的关系。
- issue: 两处尊崇的对象
  choice: 前者为祭司职分，后者为受膏者本人
  alternative: 将两者都理解为祭司职分或都理解为受膏者
  rationale: 第一分句明确以“他的祭司职分”为主语；后一分句的阳性单数“他”自然回指受膏者。
translation_notes:
  register: 采用现代标准书面汉语，语气庄重而易懂。“禧年”“受膏者”“祭司职分”保留古代宗教语境所需术语；以分号理清两个并列预言句。
