  to: 在第二个禧年，受膏者将在为所爱之人哀悼之时被擒获[a]；他的祭司职分必得尊荣，他必蒙众人荣耀。
  rationale: 修订以“被擒获”忠实保留 συλληφθήσεται 的非特定抓取义，并保留脚注所需的生育义替代解释。后半节将 τιμία 译为“得尊荣”、将 δοξασθήσεται 译为“蒙众人荣耀”，从而反映原文对祭司职分与受膏者本人的不同陈述，且不增加身份或事件解释。
