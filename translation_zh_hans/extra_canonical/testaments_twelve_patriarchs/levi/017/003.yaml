  terminology: “禧年”“受膏者”“祭司职分”均可保留。“被擒获”比“被捕”更准确覆盖 συλλαμβάνω 的基本被动义；“荣耀”适合 δοξάζω，且避免与前面的 τιμία 重复译作“尊崇”。
