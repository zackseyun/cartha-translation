  text: The fifth will be taken in darkness.
translation:
  language: zh_hans
  text: 第五位将在黑暗中被带走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: 第五位
  rationale: 保留希腊文的序数称谓；“位”适合指代上下文中的人物，同时比单说“第五个”更庄重自然。
- source_word: ἐν σκότει
  choice: 在黑暗中
  rationale: 直译介词短语，保留其可能表示环境、处境或象征状态的歧义，不擅自解释。
- source_word: παραληφθήσεται
  choice: 将被带走
  rationale: 保留将来时与被动语态；该词可指被接走、带去或带走，此处采用中性表达，不补出施事者或目的地。
theological_decisions:
- issue: “黑暗”的性质
  choice: 不明说是字面黑暗还是属灵、道德意义上的黑暗
  alternative: 译作“在幽暗的处境中”或“陷于属灵黑暗时”
  rationale: 原文仅用ἐν σκότει，含义简约且可能具有象征性，应保留其张力。
- issue: 被动动词的施事者与动作性质
  choice: 译为“被带走”，不注明由谁带走或是否含有接纳、拘捕、死亡等意义
  alternative: “被接去”或“被掳去”
  rationale: 原文没有明示施事者；较具体的译法会过早限定解释。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，句式贴近原文，并保留原文的被动结构和语义含混性。
