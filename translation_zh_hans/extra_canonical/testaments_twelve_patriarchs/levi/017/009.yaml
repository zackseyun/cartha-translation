base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/009.yaml
  text: Therefore they will be in captivity and in plunder, and their land and their possessions will be destroyed.
translation:
  language: zh_hans
  text: 因此，他们必被掳，也必遭劫掠；他们的土地和财产都必被毁灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αἰχμαλωσίᾳ
  choice: 被掳
  rationale: 该短语表示处于被俘、被掳的境况；译作“被掳”自然简洁，也符合本句预言性的语气。
- source_word: ἐν προνομῇ
  choice: 遭劫掠
  rationale: προνομή指掠夺、劫掠；与前项平行译为“遭劫掠”，表达他们成为掠夺对象。
- source_word: ἡ γῆ αὐτῶν
  choice: 他们的土地
  rationale: γῆ在这里指他们所属的土地或地域；直译可保留原文范围上的宽泛性。
- source_word: ἡ ὕπαρξις
  choice: 财产
  rationale: ὕπαρξις在此语境中指所有物、产业或财物；“财产”是现代汉语中自然且涵盖面适当的对应词。
- source_word: ἀφανισθήσεται
  choice: 必被毁灭
  rationale: 该动词表示消灭、使不复存在；被动将来时在预言语境中译作“必被毁灭”，保留确定性和被动意义。
