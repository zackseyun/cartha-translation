source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἐν δὲ τῷ ἑβδόμῳ²⁷ ἔσται μιασμός⁴¹, ὃν οὐ δύναμαι⁴² εἰπεῖν ἐνώπιον⁴³ ἀνθρώπων· ὅτι αὐτοὶ γνώσονται οἱ ποιοῦντες αὐτά.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/008.yaml
  text: But in the seventh there will be defilement, which I cannot speak of before men, because those who do these things will know them.
translation:
  language: zh_hans
  text: 但在第七个时期，将有污秽之事；这事我不能在人面前说，因为做这些事的人自己会知道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδόμῳ
  choice: 第七个时期
  rationale: 原文仅作“第七个”，所指承接上下文中的阶段或时期；补出“时期”使现代汉语自然，同时不把它具体限定为某种职分或世代。
- source_word: μιασμός
  choice: 污秽之事
  rationale: 该词可指玷污、污秽或亵渎性的污染；译作“污秽之事”既保留道德与礼仪层面的张力，也与下文复数“这些事”衔接。
- source_word: ἐνώπιον ἀνθρώπων
  choice: 在人面前
  rationale: 贴近原文表达，并保留公开向人陈说的含义。
- source_word: αὐτοὶ γνώσονται
  choice: 自己会知道
  rationale: 用“自己”体现强调代词 αὐτοί；将来时译为“会知道”，不擅自解释为已经知晓或亲身领会。
theological_decisions:
- issue: “污秽”属于礼仪、道德还是亵渎层面
  choice: 保留宽泛的“污秽之事”
  alternative: “亵渎之事”或“玷污”
  rationale: μιασμός 本身容许多层含义；上下文所述行为未在本节明说，不宜把它收窄为单一神学类别。
- issue: “第七个”的具体所指
  choice: 以“时期”作最低限度的语境补足
  alternative: “第七位祭司”或仅作“第七个”
  rationale: 本节依赖前文的阶段序列；译作“时期”可读性较好，又避免导入比本节明示内容更具体的解释。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。句式基本保留希腊文的转折、陈述、关系说明与原因结构；以分号避免中文长句生硬。
