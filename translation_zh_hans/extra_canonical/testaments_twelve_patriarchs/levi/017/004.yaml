  text: But the third priest will be taken away with grief.
translation:
  language: zh_hans
  text: 但第三位祭司将在忧愁中被带走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ τρίτος ἱερεὺς
  choice: 但第三位祭司
  rationale: δὲ 在此承接前文并形成转折，译作“但”；τρίτος 与 ἱερεύς 分别直译为“第三位”和“祭司”。
- source_word: λύπῃ
  choice: 因忧愁
  rationale: λύπη 可指忧愁、悲痛；与被动动词连用时，格的关系略有含混。译作“因忧愁”自然地表达原因或伴随处境，同时不具体断定是谁的忧愁。
- source_word: παραληφθήσεται
  choice: 将被带走
  rationale: 这是 παραλαμβάνω 的将来时被动形式，核心意义为“被带走、被接去”。保留被动语态，不进一步解释其是否指死亡、罢免或其他结局。
theological_decisions:
- issue: “被带走”是否明确指死亡
  choice: 保留“被带走”的含蓄表达
  alternative: 将死于忧愁／将在悲痛中去世
  rationale: 原文 παραληφθήσεται 本身没有明确说“死”，上下文即使可能暗示某种终局，也不宜在本节中把含义收窄。
- issue: λύπῃ 的语义关系
  choice: 译作“因忧愁”
  alternative: 在忧愁中／带着忧愁
  rationale: 希腊语与格可表达原因、方式或伴随状态；“因忧愁”较符合此处简短预言句的自然汉语，同时脚注保留其他可能。
translation_notes:
  register: 采用简洁、庄重的现代书面汉语；保持原句的预言语气、被动结构及结局上的含蓄性。
