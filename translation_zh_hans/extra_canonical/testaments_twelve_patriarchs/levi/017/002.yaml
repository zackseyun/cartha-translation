revisions:
- from: 因为每一个禧年都将有祭司职分。在第一个禧年，那首先受膏担任祭司的人将成为伟大的人；他要像对父亲一样对上帝说话，他的祭司职分也必与主一同充盈。[在他喜乐的日子里，他必为拯救世界而兴起。][a]
  to: 因为每一个禧年都将有祭司职分。并且在第一个禧年，那首先受膏担任祭司的人将是伟大的；他要向上帝说话，如同向父亲说话；他的祭司职分也必在与主同在中得以充盈。[在他喜乐的日子里，他必为拯救世界而兴起。][a]
  rationale: 修订使中文更自然，并避免把μέγας具体化为“伟大的人”。对πλήρης μετὰ κυρίου采用“在与主同在中得以充盈”，力求保留其与主相关且“充盈”的核心意思，而不将不寻常的希腊表达定向解释为“被主充满”或“完全”。方括号及脚注均予保留，并收窄脚注为源版可确证的说明。
