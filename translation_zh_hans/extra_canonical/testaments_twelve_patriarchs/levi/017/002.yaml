  text: Καθ’ ἕκαστον γὰρ ἰωβηλαῖον⁶ ἔσται ἱερωσύνη⁷. Καὶ⁸ ἐν τῷ⁹ πρώτῳ ἰωβηλαίῳ ὁ *χριόμενος πρῶτος¹⁰ εἰς ἱερωσύνην *ἔσται μέγας¹¹, καὶ λαλήσει¹² Θεῷ ὡς πατρί· καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ¹³ κυρίου· [καὶ ἐν ἡμέραις¹⁴ χαρᾶς αὐτοῦ¹⁵ *ἐπὶ σωτηρίᾳ¹⁶ κόσμου *αὐτὸς ἀναστήσεται]¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/002.yaml
  text: For in each jubilee there will be a priesthood. And in the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be full with the Lord. [And in the days of his joy, he will arise for the salvation of the world.]
translation:
  language: zh_hans
  text: 因为每一个禧年都将有祭司职分。并且在第一个禧年，那首先受膏担任祭司的人将是伟大的；他要向上帝说话，如同向父亲说话；他的祭司职分也必在与主同在中得以充盈。[在他喜乐的日子里，他必为拯救世界而兴起。][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号表示本版对这整句的文本地位存疑。
    reason: 源文本以方括号标示整句；脚注说明这一文本批判标记，而不删除或解释该句。
lexical_decisions:
- source_word: ἰωβηλαῖον / ἰωβηλαίῳ
  choice: 禧年
  rationale: 这是犹太传统中固定的年代单位；采用现代中文圣经及相关文献通行的译名。
- source_word: ἱερωσύνη
  choice: 祭司职分
  rationale: 原词指祭司的身份、职任或制度，而非单指一位“祭司”；“祭司职分”可保留这种范围。
- source_word: ὁ χριόμενος πρῶτος εἰς ἱερωσύνην
  choice: 那首先受膏担任祭司的人
  rationale: 保留“首先”、受膏及进入祭司职任三项语义，同时使中文自然。
- source_word: μέγας
  choice: 成为伟大的人
  rationale: 原文仅说“伟大”，未具体限定为大祭司、权势或声望，因此不作窄化。
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: 他要像对父亲一样对上帝说话
  rationale: 直陈其与上帝说话如同对父亲，保留关系亲近而不增添“称呼”或“祷告”等原文未明说的含义。
- source_word: ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ κυρίου
  choice: 他的祭司职分也必与主一同充盈
  rationale: μετὰ κυρίου结构不寻常；“与主一同充盈”保留“充盈”和“与主同在/同有”的关系，避免擅自改成“被主充满”或“在主里面完全”。
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: 为拯救世界
  rationale: ἐπί加与格可表达目的或所关涉之事；此处译为目的关系最合语境，同时保留κόσμος的广义“世界”。
- source_word: αὐτὸς ἀναστήσεται
  choice: 他必……兴起
  rationale: ἀνίστημι在此可指兴起，也可能带有复起意味；用“兴起”保留开放性，不明确译成“复活”。
theological_decisions:
- issue: “与主一同充盈”的关系应如何理解
  choice: 保留“他的祭司职分必与主一同充盈”这一不寻常表达
  alternative: 他的祭司职分必被主充满／他的祭司职分在主里面必得完全
  rationale: 希腊文πλήρης μετὰ κυρίου本身语义和句法不够寻常；不应借译文确定究竟是主作为充满者、同在者，还是祭司职分在主里达到完满。
- issue: ἀναστήσεται是否明确指复活
  choice: 兴起
  alternative: 复活／站起来
  rationale: 该动词可用于起身、兴起或从死里复起；当前上下文不足以排除其他含义，故不把弥赛亚或复活解释直接写入正文。
- issue: κόσμος的救恩范围
  choice: 拯救世界
  alternative: 拯救世人／拯救受造界
  rationale: 保留κόσμος本身的范围，不预先限定为全人类或整个受造秩序。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“禧年”“受膏”“祭司职分”等沿用相关宗教历史文献中的通行术语；句式尽量贴近希腊文的递进结构，同时避免生硬直译。方括号保留源版对可疑文本的标示，并以脚注说明。
