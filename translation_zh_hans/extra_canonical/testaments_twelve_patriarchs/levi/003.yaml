  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is dark for this reason: because it sees all the unrighteous deeds of men. And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and
    dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.'
translation:
  language: zh_hans
  text: '《利未遗训》第3章


    1 所以，你要听我讲那指给你看的诸天。最低的一层之所以在你看来阴沉，是因为它看见人类一切不义的行为。2 其中有火、雪和冰晶，为审判之日、在上帝公义的审判中预备着；其中还有降灾的众灵，要向人类施行报应。3 在第二层，有各军营的众大能者；他们受命在审判之日，向迷惑之灵和彼列亚尔[b]施行报应。在他们之上的是众圣者。4 在最高的居所里，伟大的荣耀高居一切圣洁之上。5 在与他们相邻的一层[d]，有众天使长；他们事奉主，并为义人一切出于无知的过犯向主行赎罪礼[a]，6 把馨香之气献给主，作为理性而无血的祭[c]。7 在下面一层，有众天使把答复带给侍立在主面前的天使。8 在与他们相邻的一层[d]，有众宝座和掌权者；在那里，颂歌不断献给上帝。


    9 所以，每当主垂顾我们，我们全都战兢；天、地和深渊也在他威严的面前震动。10 然而，世人对这些事毫无知觉，仍旧犯罪，惹动至高者的怒气。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行赎罪礼”所译的希腊动词也可译作“求息怒”或“行挽回之礼”；这里的上下文带有明显的祭仪色彩。
    reason: lexical_alternative
  - marker: b
    text: “彼列亚尔”依希腊文Βελίαρ音译；在其他传统中，这名字常作“彼列”。
    reason: proper_name_variant
  - marker: c
    text: “理性而无血的祭”也可理解为“属灵而无血的祭”。希腊词λογικός既可与理性相关，也可在宗教语境中作较具解释性的“属灵”理解。
    reason: lexical_alternative
  - marker: d
    text: 第5、8节有关天层位置的希腊文本指代不明，抄本传承也有困难；“相邻的一层”保留其大意，不确定指定为上一层或下一层。
    reason: textual_ambiguity
lexical_decisions:
- source_word: στυγνός
  choice: 阴沉
  rationale: 该词可指阴郁、可怖或令人厌恶；此处描述最低一层天的观感。“阴沉”自然地传达其幽暗肃杀的氛围，又不把它明确解释为情绪上的憎恶。
- source_word: ἀδικίας
  choice: 不义的行为
  rationale: 既保留宗教伦理上的“不义”，也表明复数所指的是具体恶行。
- source_word: κρύσταλλον
  choice: 冰晶
  rationale: κρύσταλλος在古代语境中可指冰或水晶；与“火、雪”并列时，“冰晶”兼顾实体意象与词义范围。
- source_word: πνεύματα τῶν ἐπαγωγῶν
  choice: 降灾的众灵
  rationale: ἐπαγωγή在此启示文学语境中指带来的灾祸、惩罚或侵袭；译为“降灾”保留执行灾罚的意象，不将其泛化为抽象的“刑罚”。
- source_word: ἐκδίκησις
  choice: 报应
  rationale: 兼具追讨、惩治和伸张正义的法庭色彩；比“报仇”较少私人复仇意味，也不削弱原文强度。
- source_word: δυνάμεις τῶν παρεμβολῶν
  choice: 各军营的众大能者
  rationale: δυνάμεις可指天上的“大能者”或军力，παρεμβολαί可指军营、军阵；译文保留天军组织的启示文学图景。
- source_word: Μεγάλη Δόξα
  choice: 伟大的荣耀
  rationale: 按原文保留敬称式的神圣临在称谓，不直接改写为“上帝”，从而保存其含蓄和庄严。
- source_word: ἐξιλασκόμενοι
  choice: 献上赎罪
  rationale: 该词具有祭仪性的赎罪、平息之义；结合下文“献上”“祭”，采用明确的祭祀措辞，同时在脚注说明另一种表达。
- source_word: ἀγνοίαι
  choice: 出于无知的过犯
  rationale: 字面为无知、不了解；在祭仪语境中可指因无知而犯的错，译文保留行为的非故意性质而不淡化其为过犯。
- source_word: λογικὴν
  choice: 理性
  rationale: 按λογικός的直接词义翻译；该词也可引申为属灵，故在脚注保留解释空间。
- source_word: ἄγγελοι τοῦ προσώπου κυρίου
  choice: 侍立在主面前的天使
  rationale: “主面前的天使”是闪语式称谓；加“侍立”使现代汉语自然，并表达其亲近神圣临在的身份。
- source_word: ἀναισθητοῦντες
  choice: 毫无知觉
  rationale: 表达对宇宙震动和神圣威严麻木、不能感知，避免将其仅收窄为智力上的“不理解”。
theological_decisions:
- issue: 天使长为义人的无知之过行祭仪性行动
  choice: 译为“为义人一切出于无知的过犯向主献上赎罪”
  alternative: 译为“向主求息怒”或将其弱化为一般性的代求
  rationale: ἐξιλάσκομαι与紧接的馨香、献祭措辞构成明确的祭仪图景。译文不把这一天上礼仪化约为普通祷告，也不进一步建构原文未说明的赎罪机制。
- issue: “伟大的荣耀”的身份
  choice: 保留为“伟大的荣耀”
  alternative: 直接译作“上帝”或“威荣的上帝”
  rationale: 原文使用敬称性的迂回称谓。保留该称谓可以呈现神圣临在的启示文学语体，并避免替作者消除其表达上的含蓄。
- issue: 邪恶势力名称Βελίαρ
  choice: 音译为“彼列亚尔”
  alternative: 采用较熟悉的“彼列”
  rationale: 原文希腊语明确反映Beliar这一形式；音译保存文本见证，不与其他传统中的Belial形式强行协调。
- issue: 诸天层级的次序
  choice: 在文本不稳处译作“与他们相邻的一层”
  alternative: 确定译作“上一层”或“下一层”
  rationale: 第5、8节的μετ᾿ αὐτῶν文本及指代不清，且现存层级描述难以构成无争议的连续次序；译文保存空间关系，却不替残损文本重建确定宇宙结构。
- issue: 第9节主垂顾时的宇宙震动
  choice: 依所给希腊文本译为主垂顾、众者战兢，天、地、深渊震动
  alternative: 采用英文咨询层中的扩展读法，如“借着他的圣洁等级”及“大地从根基震动”
  rationale: 所给希腊正文没有这些扩展语句。翻译以现有原文证据为先，不把其他见证或重构悄然并入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留启示文学中的多层天界、天军、祭仪和宇宙震动意象。称谓使用“上帝”“主”“至高者”，不以特定宗派术语重释。分节依原文十节排列；对明显不稳的空间指代用脚注交代，不将英文咨询层中的扩展内容并入正文。
