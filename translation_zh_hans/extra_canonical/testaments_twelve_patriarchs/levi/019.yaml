base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019.yaml
  text: '1[a]. And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar[b].

    2. And his sons answered him, saying, “Before the Lord we will walk, and according to his law.”

    3. And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him[c], “Witnesses.”'
translation:
  language: zh_hans
  text: '1 现在，我的孩子们，你们已经听见这一切了。你们要为自己作出选择：或是光明，或是黑暗；或是主的律法，或是彼列[a]的作为。


    2 他的儿子们回答他说：“我们必行在主面前，遵照他的律法。”[b]


    3 他们的父亲对他们说：“主作见证，他的天使们作见证，你们作见证，我也作见证，见证你们口中所说的话。”他的儿子们对他说：“我们作见证。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”在这里对应希腊文Βελίαρ，通常转写为Beliar；此名称在别处也常作Belial（中文常译“彼列”）。
    reason: alternative_reading
  - marker: b
    text: “行在主面前”是圣经式说法，指人在上帝面前生活，并以顺服向他负责。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: 你们要为自己作出选择
  rationale: 中间语态命令式带有反身意味；这样既保留“为自己选择”的责任感，也符合现代汉语表达。
- source_word: ἢ τὸ φῶς ἢ τὸ σκότος
  choice: 或是光明，或是黑暗
  rationale: 直接保留原文鲜明的伦理象征对比，不改写为抽象的“善恶”。
- source_word: νόμον κυρίου
  choice: 主的律法
  rationale: “律法”保留 νόμος 的宗教与盟约语域，“主”对应 κύριος。
- source_word: τὰ ἔργα τοῦ Βελίαρ
  choice: 彼列的作为
  rationale: “作为”自然涵盖行为和所作之事；Βελίαρ 按专名音译，并以脚注说明其希腊形式。
- source_word: Ἐνώπιον κυρίου πορευσόμεθα
  choice: 我们必行在主面前
  rationale: 保留“在主面前行走”这一圣经式惯用语，同时用“行在”形成自然、庄重的中文。
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: 遵照他的律法
  rationale: 准确表达 κατὰ 加宾格所表示的规范和准则，比逐字式“按照”更顺畅。
- source_word: Μάρτυς / μάρτυρες
  choice: 见证
  rationale: 全节一致使用“见证”，保留誓约场景的法律性和庄严感；末句补出“我们是”以符合中文语法。
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: 要为你们口中所说的话作证
  rationale: 保留“你们口中”这一具体表达，又清楚呈现 περὶ 与“见证”之间的关系，避免生硬的“关于你们口中的话”。
theological_decisions:
- issue: “光明/黑暗”与“主的律法/彼列的作为”的伦理二元对照
  choice: 直接保留两组平行的选择
  alternative: 释义为“善与恶”或“正义与邪恶”
  rationale: 原文以具体意象和归属关系构成尖锐对照；直译能保留其遗训体和启示文学色彩，不将其神学张力简化。
- issue: Βελίαρ 的译名
  choice: 彼列
  alternative: 彼列亚；比利亚；解释为“恶者”
  rationale: 原文是专名 Βελίαρ，不宜解释性改写；采用现代中文读者较易识别的传统音译“彼列”，脚注注明此处希腊文形式常转写为 Beliar，并与 Belial 有关。
- issue: 末句 Μάρτυρες 的主语和功能
  choice: 译作“我们是见证”
  alternative: “作见证”；“见证人”
  rationale: 希腊文仅有复数名词/述语“见证”，承接父亲所列的见证者。中文补出省略的主语与系词，但不进一步解释为宣誓公式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留遗训中的直接称呼、平行对偶和见证用语；不把“光明/黑暗”释义化，也不把彼列的身份作超出原文的教义说明。所有脚注标记均置于相关正文处。
