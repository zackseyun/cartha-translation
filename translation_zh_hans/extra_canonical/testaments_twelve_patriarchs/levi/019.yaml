    issue: 第3节将“我也是见证，关于你们口中所说的话”译为“我也是见证，要为你们口中所说的话作证”。
    rationale: 原文以现在时“是”列举见证者，περὶ短语修饰“见证”的所涉内容；“要……作证”改变为目的性／未来性表述。
  - severity: low
    issue: 第3节末句译为“我们是见证”。
    rationale: 原文只有复数“见证者”，在上下文中可作简短回应；“我们作见证”在中文中更自然地保留其宣告性质，且不额外确立系词关系。
  - severity: low
    issue: 脚注a对Belial的中文说明不够准确清晰。
    rationale: 应明确Βελίαρ通常转写为Beliar，而Belial是别处常见的名称形式；中文“彼列”是通行译名。
