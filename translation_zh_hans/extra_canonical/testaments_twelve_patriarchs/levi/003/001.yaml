  naturalness: 原句庄重清楚。“那么”比句首“所以”更自然地承接 οὖν 的话语推进，且不把连接词限定为严格因果。“那指给你看的诸天之事”虽稍具书面色彩，但符合本段启示性叙述的语域，也保留被动表达。
  terminology: “诸天”恰当保留 οὐρανῶν 的复数宇宙观；“不义”对应 ἀδικίας，未作教义化扩展。“最低的一层”在中文中清晰表达被省略的“天”，不需要增添专名。
