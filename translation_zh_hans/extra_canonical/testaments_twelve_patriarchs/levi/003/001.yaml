base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/001.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is gloomy for this reason: because it sees all the injustices of people.'
translation:
  language: zh_hans
  text: 那么，你要听那指给你看的诸天之事：最低的一层之所以阴郁，是因为它看见人类一切的不义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουσον οὖν
  choice: 所以，你要听
  rationale: 保留命令语气及承接上文的推论连接；现代汉语用“所以”自然表达 οὖν。
- source_word: περὶ τῶν δειχθέντων σοι οὐρανῶν
  choice: 那指给你看的诸天之事
  rationale: δειχθέντων 为被动分词，保留“指给你看”；οὐρανῶν 是复数，译作“诸天”，并以“之事”自然承接 περὶ。
- source_word: ὁ κατώτερος
  choice: 最低的一层
  rationale: 该词在诸天的上下文中指最下面的天；补出“一层”使省略的中心词在汉语中清楚，同时不另加专名。
- source_word: στυγνός
  choice: 阴沉
  rationale: 此词可表示阴郁、森冷或可憎；“阴沉”既保留其沉暗气氛，又避免仅译为物理意义的“黑暗”。
- source_word: πάσας τὰς ἀδικίας τῶν ἀνθρώπων
  choice: 人间一切的不义
  rationale: ἀδικίας 为复数，概括人的各种不义；“人间”自然表达 τῶν ἀνθρώπων 的所属范围，并避免性别限定。
theological_decisions:
- issue: 最低一层天“看见”人类不义的拟人化表达
  choice: 保留“它看见”
  alternative: 解释为“不义都发生在它眼前”或“它见证”
  rationale: 原文直接使用 ὁρᾷ，不将其本体论或宇宙观含义解释化，以保留文本自身的拟人化和张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留“诸天”这一复数宇宙观用语。未设置脚注，因为正文无需借异文或补充说明才能准确传达现存希腊文。
