    text: 或译：“为义人因无知所犯的一切罪向主作挽回。”这里的希腊语动词在祭仪语境中可指赎罪，也可指挽回或使息怒。
    reason: lexical_alternative
  - marker: b
    text: “贝利亚尔”依照希腊语名称的形式音译；在其他传统中，这个名字常译作“彼列”。
    reason: lexical_alternative
  - marker: c
    text: “合乎理性、无血的供物”也可理解为“理性的、无血的供物”；若作解释性翻译，则可译为“属灵的、无血的供物”。
    reason: lexical_alternative
  revision_rationale: 修正“预备”的用途关系、报应对象及不自然的审判表述；删去“众军的队伍”的重复；将“伟大的荣耀”保持为原文式神圣称号。对“圣洁的等级”保留英文审校轨迹所见的困难和层级意象，不作教义化解释。脚注锚点a、b、c均保留并置于相应术语之后。
