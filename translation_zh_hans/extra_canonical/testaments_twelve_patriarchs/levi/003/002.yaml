base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/002.yaml
  text: And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are
    shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.
translation:
  language: zh_hans
  text: '其中有火、雪和冰，为上帝所定的日子预备，作为上帝对世人的公义审判。其中有一切为报应不法之人而设的惩罚之灵。在这层天之上是圣所，其中有军队的众军，奉派在审判之日向欺骗和贝利亚尔的灵施行报应。在他们之上是众圣者。在最高处，大荣耀居住，远超一切圣洁。


    在紧邻其下的那层天，有天使长侍奉；他们为义人因无知所犯的一切罪向主作挽回，向主献上馨香之气，就是合乎理性、无血的供物[c]。在这层天之下，有把答复带给侍立在主面前之天使的众天使；再下一层天则有宝座和权势，其中不断有赞歌献给上帝。


    因此，当主藉着他圣洁的等级垂顾我们时，诸天就震动；大地也从根基上摇撼，战栗着震动，直达深处。然而世人不明白这些事，便走入歧途，惹他发怒。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “合乎理性、无血的供物”也可理解为“理性的、无血的供物”；若作解释性翻译，则可译为“属灵的、无血的供物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ χιόνα καὶ κρύσταλλον
  choice: 火、雪和冰
  rationale: 按希腊语逐项保留三个名词；κρύσταλλος在此宇宙论和审判语境中指凝结的冰，而非现代意义的水晶制品。
- source_word: Beliar
  choice: 贝利亚尔
  rationale: 采用贴近希腊文本形式的音译，不直接改成其他传统常见的“彼列”，并以脚注说明。
- source_word: propitiation / cultic atonement terminology
  choice: 向主赎罪
  rationale: 用现代读者可理解的祭仪表达，同时不把动作限定为主观祈求或某一特定赎罪理论。
- source_word: reasonable and bloodless offering
  choice: 合乎理性、无血的供物
  rationale: 保留“理性/合理”与“无血”两个语义成分，不在正文中解释性地改译为“属灵”。
- source_word: the Great Glory
  choice: 伟大的荣耀者
  rationale: 将其作为对上帝的称号处理，同时保留原有“荣耀”意象，避免直接用另一个神名称谓取代。
- source_word: thrones and dominions
  choice: 宝座和权势
  rationale: 保留天上存在或等级称谓的传统抽象形式，不擅自具体化为政治机构。
theological_decisions:
- issue: 天使为义人的无知之罪所作的祭仪行动
  choice: 译为“为……向主赎罪”
  alternative: “为……求主息怒”或“向主行挽回”
  rationale: 保留祭仪性的赎罪含义，又不明确断言其机制；脚注呈现可接受的另一译法。
- issue: “合乎理性”的供物是否解释为属灵供物
  choice: 正文保留“合乎理性”
  alternative: “属灵的、无血的供物”
  rationale: 原表达具有真实歧义；正文采取较形式对应的译法，避免预先化解其思想与祭仪张力。
- issue: 贝利亚尔名称的传统同一性
  choice: 按Beliar形式音译为“贝利亚尔”
  alternative: 采用其他传统中的“彼列”
  rationale: 尊重本段希腊形式，不借名称统一来暗示超出文本的身份论结论。
- issue: 圣洁的层级与主的垂顾
  choice: 译为“从他圣洁的阶层垂顾我们”
  alternative: “借着他圣洁的程度看顾我们”
  rationale: 保留宇宙层级语境及原表达的困难，不将“degree/rank”顺滑地省略。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话书面语。保留多层天界、天使等级和祭仪用语的陌生感，但通过自然句法避免生硬直译。所提供的希腊语引文在“预备”处截断，因此开头直接依据可见希腊语措辞，其余内容参照经审核的英文咨询层表达，并对其中重要歧义设置脚注。
