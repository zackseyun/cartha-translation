review_pass:
  verdict: revise
  source_fidelity: 开头可见希腊文的“火、雪和冰”译得准确，但“预备在……日子”未准确表达εἰς所指的“为……日子预备”。其余内容中，惩罚之灵、欺骗和贝利亚尔之灵，以及“大荣耀”的关系有轻微偏移或表达不完整，需校正以贴合英文审校底本所保留的宇宙论与审判图景。
  naturalness: 整体庄重通顺；但“伟大的荣耀者”把抽象称号人物化，“向欺骗之灵和贝利亚尔施行报应”缺少与贝利亚尔并列的“灵”，且“预备在……日子”不合现代汉语搭配。修订后保持现代书面语和原文的层级感。
  terminology: 保留“贝利亚尔”“天使长”“宝座和权势”“无血的供物”等术语。“大荣耀”不加“者”，以免无根据地将该称号改作施事者名称。赎罪语句改为“为……向主作挽回”，并以脚注保留“赎罪”的祭仪性替代译法。
  issues:
  - severity: medium
    issue: “预备在上帝所定的日子”
    rationale: 可见希腊语εἰς表目的或归向；英文审校本亦为“prepared for the day”。应译为“为上帝所定的日子预备”。
  - severity: medium
    issue: “向欺骗之灵和贝利亚尔施行报应”
    rationale: 英文审校本为“the spirits of deceit and of Beliar”。现译将贝利亚尔与“欺骗之灵”错置为并列受事，未表达两者均受“灵”限定。
  - severity: medium
    issue: “伟大的荣耀者”
    rationale: 英文“大荣耀”是称号性表达；加“者”无依据地使其成为“荣耀者”这一施事性人物称谓。
  - severity: low
    issue: 惩罚之灵的限定关系
    rationale: “施行各种惩罚的灵，要向不法之人报应”弱化了“一切为报应不法之人而有的惩罚之灵”的整体限定关系。
  - severity: low
    issue: “为义人……向主赎罪”
    rationale: 汉语中“向主赎罪”容易理解为义人向主认罪，或使天使成为赎罪主体而关系不明。改用“为……向主作挽回”，并在脚注说明“赎罪”的可译性，可较清楚地保留原有祭仪歧义。
  revised_text: '其中有火、雪和冰，为上帝所定的日子预备，作为上帝对世人的公义审判。其中有一切为报应不法之人而设的惩罚之灵。在这层天之上是圣所，其中有军队的众军，奉派在审判之日向欺骗和贝利亚尔的灵施行报应。在他们之上是众圣者。在最高处，大荣耀居住，远超一切圣洁。


    在紧邻其下的那层天，有天使长侍奉；他们为义人因无知所犯的一切罪向主作挽回，向主献上馨香之气，就是合乎理性、无血的供物[c]。在这层天之下，有把答复带给侍立在主面前之天使的众天使；再下一层天则有宝座和权势，其中不断有赞歌献给上帝。


    因此，当主藉着他圣洁的等级垂顾我们时，诸天就震动；大地也从根基上摇撼，战栗着震动，直达深处。然而世人不明白这些事，便走入歧途，惹他发怒。'
  revised_footnotes:
  - marker: a
    text: 或译：“为义人因无知所犯的一切罪赎罪。”这里的希腊语动词用于祭仪语境时，可表达赎罪或挽回、使息怒。
    reason: lexical_alternative
  - marker: b
    text: “贝利亚尔”依照希腊语名称的形式音译；在其他传统中，这个名字常译作“彼列”。
    reason: lexical_alternative
  - marker: c
    text: “合乎理性、无血的供物”也可理解为“理性的、无血的供物”；若作解释性翻译，则可译为“属灵的、无血的供物”。
    reason: lexical_alternative
  revision_rationale: 修订“为……日子预备”以对应可见希腊文εἰς，并依英文审校底本恢复惩罚之灵、欺骗和贝利亚尔之灵的限定关系。将“大荣耀”保留为称号性表达，不擅自人物化。调整祭仪句法以避免中文歧义，同时在脚注中保存“赎罪／挽回”的可选译法。其余多层天界、天使职分和“圣洁的等级”的困难表达均予保留，不作教义性协调。
