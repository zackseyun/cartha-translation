  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/004.yaml
  text: And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers.
translation:
  language: zh_hans
  text: 在那时，我毁灭了哈抹的众子，正如列祖的书板上所记的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσα
  choice: 灭了
  rationale: 该动词在此语境中表示彻底除灭、消灭；用“灭了”既保留完成性的力度，也符合现代汉语叙事表达。
- source_word: τῷ καιρῷ ἐκείνῳ
  choice: 就在那时
  rationale: 准确表达所指的特定时刻，并以“就”自然承接上下文。
- source_word: τοὺς υἱοὺς Ἐμμώρ
  choice: 哈抹的众子
  rationale: υἱούς为复数，直译为“众子”；Ἐμμώρ采用现代中文圣经中常见的人名形式“哈抹”。
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: 列祖的版册上
  rationale: πλαξί指供书写的板、版；“版册”保留其物质载体意象，又比单说“板上”更自然。τῶν πατέρων译作“列祖的”，不添加原文没有的“天上”。
theological_decisions:
- issue: “列祖的版册”是否指天上的版册
  choice: 不添加“天上的”
  alternative: 列祖的天上版册
  rationale: 希腊文本只有πλαξὶ τῶν πατέρων，未出现“天上”一词；保留该短语本身可能具有的文献或启示传统含义，不予明确化。
- issue: “哈抹的众子”是亲生儿子还是族人
  choice: 保留“众子”
  alternative: 哈抹的族人
  rationale: υἱούς字面为“儿子们”，语境上也可能涵盖后裔或族属；直译可保留这种范围上的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“版册”略带古雅色彩，以呼应古代书写载体，同时避免误增“天上”等解释性内容。
