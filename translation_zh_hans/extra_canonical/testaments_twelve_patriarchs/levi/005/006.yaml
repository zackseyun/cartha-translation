  text: Καὶ εἶπεν³⁸· Ἐγώ εἰμι ὁ ἄγγελος ὁ *παραιτούμενος τὸ γένος³⁹ Ἰσραήλ, τοῦ μὴ πατάξαι⁴⁰ αὐτούς⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/006.yaml
  text: And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down.”
translation:
  language: zh_hans
  text: 他就说：“我就是那位为以色列族求情的天使，使他们不致被击杀。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραιτούμενος
  choice: 求情
  rationale: 该分词在此表示代为恳求、劝阻惩罚；“为……求情”自然表达天使为以色列恳求免受击杀之意，同时不额外引入特定神学术语。
- source_word: τὸ γένος Ἰσραήλ
  choice: 以色列族
  rationale: γένος可指族类、民族或后裔；“以色列族”既保留群体血缘含义，也符合现代中文表达。
- source_word: τοῦ μὴ πατάξαι αὐτούς
  choice: 使他们不致被击杀
  rationale: τοῦ加不定式在此表达目的或结果；πατάσσω意为击打、击杀。采用被动式以保留原文未明说施事者的特点。
theological_decisions:
- issue: 天使所作之事的性质
  choice: 为……求情
  alternative: 为……代求
  rationale: 原文可表达恳求或劝阻；“求情”保留其为以色列请求免罚的意义，又避免把它固定为后世较专门的“代求”教义术语。
- issue: τοῦ μὴ πατάξαι所表达的逻辑关系
  choice: 使他们不致被击杀
  alternative: 免得他们被击杀
  rationale: 希腊文可理解为目的或预期结果；正文采用自然的“使……不致”，但不明确指定击杀者，也不把含义扩展为“彻底消灭”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我就是那位……”传达带定冠词的身份陈述；全句紧凑，适合叙事语境。原文没有“彻底”或“所有邪灵攻击它”等内容，因此未据修订记录中较长的旧英文句式增译。
