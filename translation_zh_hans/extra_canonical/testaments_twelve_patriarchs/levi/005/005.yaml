  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/005.yaml
  text: And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in the day of affliction.”
translation:
  language: zh_hans
  text: 我对他说：“主啊，我求你，把你的名教给我，好让我在患难之日呼求你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέομαί σου
  choice: 我求你
  rationale: 准确表达恳求语气，同时符合现代汉语自然表达。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留直接称呼与敬称语气。
- source_word: δίδαξόν με τὸ ὄνομά σου
  choice: 将你的名指教我
  rationale: 保留“教导我你的名”的源语结构和“名”的宗教意涵；“指教”使中文庄重而自然。
- source_word: ἐπικαλέσομαί σε
  choice: 呼求你
  rationale: ἐπικαλέομαι在此指向人在困境中向对方求告；“呼求”比单纯“呼唤”更贴合语境。
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: 在患难之日
  rationale: 贴近希腊文单数表达，避免擅自将其解释为泛指或特定末世事件。
theological_decisions:
- issue: “你的名”是否改释为身份、权柄或神圣名号
  choice: 保留“你的名”
  alternative: 将你的身份／圣名告诉我
  rationale: 原文只说“名”，直接保留可维持其可能包含身份、权柄和可供呼求之名的多重意涵。
- issue: “患难之日”是否特指某一末世性灾难
  choice: 不作特指化处理
  alternative: 在那末后的患难之日
  rationale: 原文没有足够信息明确限定为末世事件，应保留语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文；句式略带经文韵味，但避免生硬仿古。
