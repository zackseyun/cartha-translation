base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/002.yaml
  text: And he said to me, “Levi, to you I have given the blessings of the priesthood until I come and dwell in the midst of Israel.”
translation:
  language: zh_hans
  text: 他对我说：“利未，我已把祭司职分的福分赐给你，直到我来住在以色列中间。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: 祭司职分的福分
  rationale: 保留复数表达所指的整体、多重福分，同时将ἱερατεία自然译为“祭司职分”，避免误解为祭司群体。
- source_word: ἕως ἐλθὼν κατοικήσω
  choice: 直到我来住
  rationale: 直译其时间界限和第一人称动作，不擅自解释“来”的身份、时间或方式。
- source_word: ἐν μέσῳ τοῦ Ἰσραήλ
  choice: 在以色列中间
  rationale: 保留“在……中间”的空间及群体含义，并维持“以色列”可能指民族或共同体的开放性。
theological_decisions:
- issue: “直到”是否暗示祭司职分的福分在说话者来临后终止
  choice: 保留“直到”
  alternative: 译为“直至……为止”并明确终止含义，或弱化为“等到”
  rationale: 希腊文ἕως本身建立时间界限，但其后状态是否终止未被明说；译文不替原文消除这一神学张力。
- issue: 第一人称“我”的身份
  choice: 仅译作“我”，不加身份说明
  alternative: 在正文中解释为上帝、天使或弥赛亚
  rationale: 本节本身没有明示说话者身份，不应在正文中导入解释性认定。
translation_notes:
  register: 采用现代、庄重而通顺的普通话；语序略作汉语化处理，同时保留原文的赐予、祭司职分、时间界限及住在以色列中间等核心意象。
