base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/003.yaml
  text: Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Execute vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”
translation:
  language: zh_hans
  text: 那时，天使带我下到地上，给了我一件兵器和一把剑，对我说：“你要在示剑为你妹妹底拿报仇；我也必与你同在，因为是主差遣我来的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπλον
  choice: 兵器
  rationale: 该词泛指武器或作战用具；译作“兵器”既保留其宽泛含义，也避免无充分依据地具体化为“盾牌”。
- source_word: ῥομφαίαν
  choice: 剑
  rationale: 指大型刀剑类武器；现代汉语正文用“剑”自然清楚，并与前面的泛称“兵器”形成区别。
- source_word: Ποίησον ἐκδίκησιν
  choice: 你要……报仇
  rationale: 直译为“施行报复”；在此家族受辱与示剑事件的语境中，“为……报仇”最自然，也保留命令语气。
- source_word: Συχὲμ
  choice: 示剑
  rationale: 采用该地名在中文圣经传统中的通行译名；此处按地点理解，即在示剑施行报复。
- source_word: Δείνας
  choice: 底拿
  rationale: 采用该人名在中文圣经传统中的通行译名。
- source_word: ἀπέστειλέν με
  choice: 差遣我来的
  rationale: 表达主差遣天使这一已发生行动；句末加“来的”符合现代汉语引述中的自然表达。
theological_decisions:
- issue: 天使参与复仇行动的表述
  choice: 直接保留天使所传达的命令及“我也必与你同在”
  alternative: 弱化为许可、预告或仅提供帮助
  rationale: 希腊文本明确使用命令式，并明确应许同在；译文不对其中的伦理和神学张力作解释性缓和。
- issue: 主差遣天使与命令之间的关系
  choice: 译为“因为是主差遣我来的”
  alternative: 明确增译为“主差我来命令你报仇”
  rationale: 原文只明确说主差遣了天使，并未明说差遣的唯一目的；不在译文中补足因果内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那时”承接异象叙事；“带到地上”准确表达从上方下降至地面的动作。“一件兵器和一把剑”保留原文两个并列宾语，不将ὅπλον擅自具体化。
