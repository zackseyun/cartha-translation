  text: And in this, the angel opened to me the gates of heaven, and I saw the Holy Most High seated on a throne.
translation:
  language: zh_hans
  text: 在这当中，天使向我打开了天上的诸门；我看见神圣的至高者坐在宝座上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 就在这时
  rationale: 该短语可指“在此事中”或“在这时候”；结合叙事语境，以自然的时间性表达呈现，同时不添加原文未明说的事件内容。
- source_word: ὁ ἄγγελος
  choice: 天使
  rationale: 按其通常宗教语义直译，并保留定冠词所指的特定天使这一语境功能。
- source_word: τὰς πύλας τοῦ οὐρανοῦ
  choice: 天门
  rationale: 以现代汉语中自然而庄重的表达传达“天的诸门”；“门”在汉语中无需强行标示复数。
- source_word: τὸν ἅγιον ὕψιστον
  choice: 至圣的至高者
  rationale: 保留两个称号的叠加关系：ἅγιον作实质化形容词“至圣者/圣者”，ὕψιστον为“至高者”；译作“至圣的至高者”既符合汉语，也不把二者拆成两个对象。
- source_word: ἐπὶ θρόνου καθήμενον
  choice: 坐在宝座上
  rationale: 直接传达分词结构及位置关系，采用现代汉语常用语序。
theological_decisions:
- issue: “至圣”与“至高者”的句法及所指
  choice: 译为同一位对象：“至圣的至高者”
  alternative: “那圣者、至高者”或“圣洁的至高者”
  rationale: 希腊文两个单数宾格形容词共同指向同一对象；所选译法保留称号的庄严感及修饰关系，不额外判定其具体神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“就在这时”使开篇衔接自然；“天门”“宝座”“至高者”保留异象文学的宗教语域。原文校勘符号提示若干词存在文本问题，但现有资料未提供可供说明的异读，因此不增设脚注。
