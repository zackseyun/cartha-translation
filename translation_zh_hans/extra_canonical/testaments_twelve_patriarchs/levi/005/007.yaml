lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 简洁表达“这些事以后”，符合现代汉语叙事习惯。
- source_word: ἔξυπνος γενόμενος
  choice: 我醒来
  rationale: 该分词结构表示从睡眠或异象状态中醒来；译为“我醒来”自然准确。
- source_word: εὐλόγησα
  choice: 称颂
  rationale: 在以神为宾语时表示赞美、颂赞；“称颂”兼具庄重感和可读性。
- source_word: τὸν ὕψιστον
  choice: 至高者
  rationale: 保留希腊文对神的尊称及其名词化表达，不额外补入“神”。
theological_decisions:
- issue: τὸν ὕψιστον是否明确补译为“至高的神”
  choice: 至高者
  alternative: 至高的神
  rationale: 原文使用带冠词的形容词名词化形式，并未出现“神”一词；“至高者”既自然，也避免过度明说。
