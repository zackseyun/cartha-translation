base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/009.yaml
  text: And they pursued Abraham our father while he was a stranger, and they oppressed his flocks while they were increasing, and they cruelly mistreated Eblan, his home-born servant.
translation:
  language: zh_hans
  text: 他们追赶我们的祖先亚伯拉罕，那时他还是寄居者；又欺压他日益增多的羊群，并残酷地虐待他家中出生的仆人埃布兰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίωξαν
  choice: 追赶
  rationale: 保留该动词追逐、驱赶的敌对意味；不泛化为较弱的“迫害”或“刁难”。
- source_word: ξένον ὄντα
  choice: 那时他还是寄居者
  rationale: ξένος 在此指身处异乡、没有本地身份的人；“寄居者”符合古代语境，又保持现代可懂度。
- source_word: κατεπόνησαν
  choice: 欺压
  rationale: 表达使之受苦、苛待的强烈含义；宾语虽是羊群，中文仍可自然理解为对牲畜及其主人的压迫性侵害。
- source_word: τὰ ποίμνια ὀγκούμενα ὄντα
  choice: 日益增多的羊群
  rationale: ὀγκόω 字面涉及膨大、增长；依语境译作羊群数量增多，避免生硬的“膨胀”。
- source_word: οἰκογενῆ
  choice: 家中出生的仆人
  rationale: 准确表达生于主人家中的家仆身份，不简化为一般“家仆”。
- source_word: σφόδρα ἠκίσαντο
  choice: 残酷地虐待
  rationale: σφόδρα 加强 ἀικίζομαι 所表达的凌辱、酷待，译文保留其强度。
- source_word: Ἐβλαὴν
  choice: 以卜兰
  rationale: 按希腊文专名音译；不擅自等同于其他经文人物名。
