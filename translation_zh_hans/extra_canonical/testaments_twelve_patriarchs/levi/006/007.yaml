  naturalness: 修订后的“我们做这事，违背了他的意愿”是自然、现代而庄重的汉语。以冒号连接前句的犯罪陈述和理由，避免连续使用两个生硬的“因为”，同时保留原文的解释关系。
  terminology: “犯了罪”恰当保留ἡμάρτομεν的伦理／宗教语义；“意愿”适合γνώμη在此处的“心意、意愿”；“变得软弱”保留ἐμαλακίσθη的宽泛状态变化，未作教义性或心理、生理上的限定。
