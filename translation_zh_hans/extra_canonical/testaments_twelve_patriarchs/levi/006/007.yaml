base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/007.yaml
  text: For we sinned, because we had done this contrary to his will, although he became weak on that day.
translation:
  language: zh_hans
  text: 因为我们犯了罪：这是因为我们做这事，违背了他的意愿，尽管他在那一天变得软弱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διότι
  choice: 因为
  rationale: 引出对前文的因由说明；现代汉语用“因为”自然清楚。
- source_word: ἡμάρτομεν
  choice: 我们犯了罪
  rationale: 直接保留宗教伦理语义，不弱化为一般性的“犯错”。
- source_word: ἐπειδὴ
  choice: （通过分句关系表达）
  rationale: 这里进一步说明犯罪之处；汉语不重复使用两个“因为”，以免生硬。
- source_word: παρὰ γνώμην αὐτοῦ
  choice: 违背了他的意愿
  rationale: γνώμη 在此指当事人的心意或意愿；“意愿”比“判断”更符合该语境，同时不补明代词所指。
- source_word: τοῦτο πεποιήκαμεν
  choice: 做这事
  rationale: 保留指向上下文的 τοῦτο，并以过去完成之意自然融入汉语叙述。
- source_word: καίγε
  choice: 尽管
  rationale: 按让步关系理解，保留后句与前述行为之间的张力。
- source_word: ἐμαλακίσθη
  choice: 变得软弱
  rationale: 保留被动/状态变化及其较宽泛含义，不擅自具体化为身体虚弱、胆怯或心软。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 在那一天
  rationale: 直译时间短语，保持叙事指向。
theological_decisions:
- issue: “他的”所指对象
  choice: 保留“他的”，不在正文中补明身份
  alternative: 根据上下文直接写出具体人物或上帝
  rationale: 本节希腊文本仅用代词 αὐτοῦ；补明所指会消除原文在独立经节中的指代开放性。
- issue: καίγε 与 ἐμαλακίσθη 的关系
  choice: 译作“尽管他……变得软弱”
  alternative: 译作“而且他……变得软弱”
  rationale: 英语审校层与语境取让步义；正文保留这种道德张力，但不进一步解释软弱的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。句式紧凑，避免重复连接词；保留“犯了罪”的神学力度，也保留“他的”与“软弱”的原文含混性。
