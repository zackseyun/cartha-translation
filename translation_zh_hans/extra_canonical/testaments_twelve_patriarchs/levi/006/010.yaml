  source_fidelity: 译文准确对应希腊文的惯常过去动作（ἐποίουν）和强调语气（Καίγε）；“所有外乡人”对应πᾶσι τοῖς ξένοις，“外乡女子”恰当保留τὰς ξένας的阴性及外来者含义，未添加“他们的女子”一类原文没有的所属关系。“强行掳走”充分表达ἐν δυναστείᾳ ἁρπάζοντες的强力夺取，“把她们驱逐出去”对应ἐξενηλάτουν αὐτάς。
  naturalness: 句法清楚自然，冒号后以两个并列动作说明其对待外来者的方式；“一向这样”自然传达未完成时的反复/持续意味。虽然“掳走”后又“驱逐出去”的事件次序在叙事上显得严酷而突兀，但这正是原文并列动词所呈现的内容，不宜为顺畅而改写。
