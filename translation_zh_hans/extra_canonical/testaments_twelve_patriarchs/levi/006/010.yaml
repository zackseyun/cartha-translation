source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καίγε οὕτως⁵⁵ ἐποίουν *πᾶσι τοῖς ξένοις⁵⁶, *ἐν δυναστείᾳ ἁρπάζοντες⁵⁷ *τὰς ξένας⁵⁸ καὶ †ἐξενηλάτουν⁵⁹ αὐτάς⁶⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/010.yaml
  text: And indeed in this way they used to act toward all strangers, seizing the foreign women by force and driving them away.
translation:
  language: zh_hans
  text: 他们确实一向这样对待所有外乡人：强行掳走外乡女子，并把她们驱逐出去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε οὕτως
  choice: 确实……这样
  rationale: Καίγε 带有强调、确认语气；与 οὕτως 合译为自然的现代汉语，同时保留“正是如此”的意味。
- source_word: ἐποίουν
  choice: 一向……对待
  rationale: 未完成时表示过去持续或反复发生的行为；结合与格宾语，译作“一向这样对待”。
- source_word: πᾶσι τοῖς ξένοις
  choice: 所有外乡人
  rationale: ξένοις 可指陌生人、外来者或外乡人；此处与后文阴性 ξένας 呼应，“外乡人”既自然又保留群体身份含义。
- source_word: ἐν δυναστείᾳ ἁρπάζοντες
  choice: 强行掳走
  rationale: ἐν δυναστείᾳ 表示凭强力或暴力，ἁρπάζοντες 表示攫取、抢夺；“强行掳走”准确体现暴力夺人的动作。
- source_word: τὰς ξένας
  choice: 外乡女子
  rationale: 阴性复数形容词名词化，指女性外来者；不译为“他们的女人”，以免加入原文没有的所属关系。
- source_word: ἐξενηλάτουν αὐτάς
  choice: 把她们驱逐出去
  rationale: 该动词表示驱逐、赶出；代词明确回指外乡女子。
