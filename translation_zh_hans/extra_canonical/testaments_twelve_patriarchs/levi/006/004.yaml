  text: 我先杀了示剑，西缅杀了哈抹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῖλον
  choice: 杀了
  rationale: 该动词在此表示杀死、除掉；结合袭杀示剑城相关人物的叙事语境，译作“杀了”直接而自然。
- source_word: τὸν Συχὲμ
  choice: 示剑
  rationale: 此处带阳性宾格冠词，指名叫示剑的人，而不是示剑城。采用通行中文圣经人名。
- source_word: ἐν πρώτοις
  choice: 率先
  rationale: 保留“在最先者之中／首先”的时间或次序意义；现代汉语用“率先”简洁自然，也不把原文过度限定为绝对的“第一个”。
- source_word: Συμεὼν
  choice: 西缅
  rationale: 采用通行中文圣经人名。
- source_word: τὸν Ἐμμώρ
  choice: 哈抹
  rationale: 对应《创世记》中示剑的父亲 Hamor；采用现代中文圣经常用译名“哈抹”。
