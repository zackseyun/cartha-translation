lexical_decisions:
- source_word: Ἔφθασε
  choice: 临到
  rationale: 该动词在此表示到达、降临于某人；“临到”既贴近原文，又符合庄重而自然的现代汉语表达。
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: 上帝的愤怒
  rationale: 直译该属格结构，保留愤怒属于并发自上帝的明确含义。
- source_word: εἰς τέλος
  choice: 彻底
  rationale: 此短语在语境中强调达到终局或完全程度；“彻底”自然地表达完全实现的结果，同时不额外指定具体惩罚形式。
theological_decisions:
- issue: εἰς τέλος所表达的是程度还是终局
  choice: 译作“彻底”，突出上帝愤怒完全临到
  alternative: 译作“直到尽头”或“最终”
  rationale: 原短语可带有“到底、完全、最终”的张力；本译文依句法和语境采用程度义，但不增添毁灭、永刑等原文未明说的神学结论。
translation_notes:
  register: 采用简洁、庄重、易懂的现代标准汉语。“但”承接前文转折；句式尽量保持希腊文的紧凑力度。
