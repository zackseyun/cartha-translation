  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/005.yaml
  text: And after this my brothers came and struck that city with the edge of the sword.
translation:
  language: zh_hans
  text: 此后，我的兄弟们来到，用刀剑的锋刃攻打了那座城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“以刀剑之口攻打了那座城。”这里“刀剑之口”是指刀剑的锋刃；“那”一词在现存希腊文本中存疑。
    reason: 保留“城”作为原文受事对象，说明“刀剑之口”的惯用语含义，并标明校勘符号所示“那”字的不确定性。
lexical_decisions:
- source_word: ἐλθόντες
  choice: 来到
  rationale: 保留分词所表达的先行动作，现代汉语中简洁自然。
- source_word: ἐπάταξαν
  choice: 击杀
  rationale: 在战争语境中表示猛烈打击并杀戮，比单纯的“攻击”更贴合后接的刀剑惯用语。
- source_word: τὴν πόλιν ⌈ἐκείνην⌉
  choice: 那座城的人
  rationale: 希腊文直译为“那座城”，但以刀剑击杀的实际对象是城中居民；正文采用自然汉语表达，并以脚注保留原文形式及“那”字的文本不确定性。
- source_word: ἐν στόματι μαχαίρας
  choice: 用刀剑
  rationale: 这是闪语式表达，字面为“以刀剑之口”，指用刀剑杀戮；译成现代汉语“用刀剑”既清楚又保留工具意义。
