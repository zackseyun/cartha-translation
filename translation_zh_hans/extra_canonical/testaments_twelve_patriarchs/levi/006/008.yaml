  source_fidelity: “我看出”将 εἶδον（我看见）弱化为推断；“主却”给原文的简单连接词 καὶ 加入了未明说的转折。其余对行为内容的含蓄处理、对意图未遂的表达，以及对“灾祸”方向的理解均可保留。
