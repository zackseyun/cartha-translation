  terminology: “上帝”“主”“撒拉”“利百加”“底拿”符合现代中文圣经文献常用译名。“降祸的判决”可保留，以传达 ἀπόφασις θεοῦ εἰς κακά 的严峻、未具体说明对象的措辞。
  issues:
