    rationale: εἶδον 的基本意义是“我看见”，并非仅指根据情势得出的判断；改为“我看见”更忠实，也不损害中文自然度。
  - severity: low
    issue: “却”额外强化转折
    rationale: 原文在“他们本想……”与“主拦阻了他们”之间使用 καὶ（和／并且），没有明示对比连词。中文可让语义本身体现未遂，而不增加“却”。
