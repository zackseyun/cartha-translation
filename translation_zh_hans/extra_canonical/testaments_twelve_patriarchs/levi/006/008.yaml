source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἀλλ᾿ ἐγὼ εἶδον ὅτι ἀπόφασις θεοῦ ἦν εἰς κακὰ³⁸ διότι ἤθελον ἐποίησεν *καὶ τὴν Σαρρὰ³⁹ ⌈καὶ τὴν Ῥεβέκκα⌉⁴⁰ ποιῆσαι ⌈ὃν τρόπον ἐποίησαν *τὴν Δείναν⁴¹ *τὴν ἀδελφὴν ἡμῶν⁴²⌉, καὶ ὁ⁴³ Κύριος ἐκώλυσεν αὐτούς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/008.yaml
  text: But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them.
translation:
  language: zh_hans
  text: 但我看见，这是上帝降祸的判决，因为他们本想对撒拉和利百加[a]下手，像对我们的妹妹底拿所做的那样；主拦阻了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和利百加”及其后与此相关的措辞，在所据希腊文版本中置于方括号内，表示文本存疑。
    reason: 方括号从“和利百加”开始并延及后文；脚注说明版本的编辑性不确定，同时保留正文所采用的读法。
lexical_decisions:
- source_word: ἀπόφασις θεοῦ
  choice: 上帝……的判决
  rationale: ἀπόφασις 表示已经作出的裁定或判决；译作“判决”比“旨意”更贴近司法语义。
- source_word: εἰς κακά
  choice: 降祸
  rationale: 直译为“指向灾祸／恶事”。在此与上帝的判决连用，表达判决带来灾祸；不在正文中补出希腊文未明说的“临到他们”。
- source_word: ἤθελον
  choice: 本想
  rationale: 表示意愿或企图；“本想”自然地传达未能实行的意图。
- source_word: ποιῆσαι … ὃν τρόπον ἐποίησαν
  choice: 对……下手，像对……所做的那样
  rationale: 原文重复使用 ποιέω（做）；汉语如此表达较自然，同时保留行为内容并未明说的含蓄。
- source_word: ἐκώλυσεν
  choice: 拦阻
  rationale: 准确表达阻止某人实施其企图。
theological_decisions:
- issue: 上帝的判决与“灾祸／恶”之间的关系
  choice: 这是上帝降祸的判决
  alternative: 这是上帝针对他们罪恶所作的判决
  rationale: 原文 εἰς κακά 可指向灾祸或恶事，并未明确说“针对他们的罪恶”。正文保留严峻张力，避免把“恶”解释性地改成他们的道德罪行。
- issue: 判决对象是否明确为“他们”
  choice: 不补出“针对他们”
  alternative: 这是上帝降祸给他们的判决
  rationale: 希腊文此处没有与“他们”对应的明确宾语；上下文虽可推知，仍不宜在正文中将其明说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妹妹”对应 ἀδελφή，在兄长们的共同叙述中比“姐妹”更自然；“下手”保留原文未具体说明行为性质的含蓄。
