source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Μετὰ δὲ τοῦτο συνεβούλευσα⁵ *τῷ πατρί μου καὶ⁶ τῷ⁷ Ῥουβὴμ⁸ ἵνα εἴπῃ⁹ *τοῖς υἱοῖς¹⁰ Ἐμμώρ¹¹ τοῦ¹² μὴ¹³ *περιτμηθῆναι αὐτούς¹⁴, ὅτι¹⁵ ἐζήλωσα *διὰ τὸ βδέλυγμα¹⁶, *ὃ ἐποίησαν¹⁷ *ἐπὶ τῇ ἀδελφῇ μου¹⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/003.yaml
  text: After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous because of the abomination which they had committed against my sister.
translation:
  language: zh_hans
  text: 这事以后，我同父亲和吕便商议，要他告诉哈抹的众子不要受割礼，因为我因他们在我妹妹身上所行的可憎之事而愤慨。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要他告诉”原文用单数动词；“他”可能指父亲，也可能指吕便，具体所指不明确。
    reason: 保存 ἵνα εἴπῃ 在两个并列商议对象之后出现时的指代歧义。
lexical_decisions:
- source_word: συνεβούλευσα
  choice: 同……商议
  rationale: 表达共同商议、筹议之意，符合与格并列对象所构成的语境。
- source_word: τοῖς υἱοῖς Ἐμμώρ
  choice: 哈抹的众子
  rationale: 直译该属格结构；“众子”可按古代叙事习惯兼指其子孙或族人，不在正文中擅自收窄。
- source_word: περιτμηθῆναι
  choice: 受割礼
  rationale: 准确表达被动不定式，且是现代中文圣经语体中的通行说法。
- source_word: ἐζήλωσα
  choice: 义愤填膺
  rationale: ζῆλος 在此因可憎行为而起，含激烈愤慨或热忱；结合上下文译为强烈而带道德判断的愤慨，较“嫉妒”贴切。
- source_word: βδέλυγμα
  choice: 可憎之事
  rationale: 保留该词对行为的强烈道德厌恶，同时避免把它限定为礼仪意义的“污秽”。
- source_word: ἐπὶ τῇ ἀδελφῇ μου
  choice: 在我妹妹身上
  rationale: 贴近介词结构，并自然表达针对她、加在她身上的侵害。
theological_decisions:
- issue: ἐζήλωσα 的道德与情感色彩
  choice: 译作“义愤填膺”
  alternative: “我大发热心”或“我嫉恨”
  rationale: 本句把这种情绪直接归因于针对妹妹的“可憎之事”，语境主要表现道德愤慨；译文不将其提升为特定神学意义上的宗教热心。
- issue: ἵνα εἴπῃ 的单数主语所指
  choice: 正文保留“要他告诉”
  alternative: 改为复数“要他们告诉”或明确为“要父亲告诉”
  rationale: 希腊文动词为第三人称单数，但在前置的“父亲和吕便”之后，具体所指并不完全明朗；故保留代词并以脚注提示歧义，不擅自指定人物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这事以后”延续古代文献的衔接方式；“受割礼”“可憎之事”保持传统宗教文本的清晰度。“义愤填膺”自然传达强烈道德愤慨。
