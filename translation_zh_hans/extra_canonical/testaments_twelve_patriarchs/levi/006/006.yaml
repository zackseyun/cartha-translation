  text: And my father heard these things, and being angry, he was grieved because they had accepted circumcision and died, and in his blessings he passed over us.
translation:
  language: zh_hans
  text: 我父亲听见这些事，便发怒，又很悲伤，因为他们接受了割礼，并且死了；他在祝福时把我们略过了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把我们略过了”：希腊文本此处有疑难；也可理解为“忽略了我们”或“没有理会我们”。
    reason: 标明此处文本和语义的不确定性，并列出主要可行理解；不把父亲的行为具体化为撤销祝福、咒诅或完全排除。
lexical_decisions:
- source_word: ὀργισθεὶς ἐλυπήθη
  choice: 便发怒，又很悲伤
  rationale: 保留两个相连但有区别的情绪：愤怒与悲伤；用现代汉语自然表达分词与主要动词的关系。
- source_word: κατεδέξαντο τὴν περιτομήν
  choice: 接受了割礼
  rationale: 直译其主动接受割礼之意，不额外解释其动机或背景。
- source_word: παρεῖδεν ἡμῖν
  choice: 越过了我们
  rationale: 底本文字受损，动词可指忽略、不顾或略过；正文采用与语境和英语审校层一致、且保留一定开放性的表达。
theological_decisions:
- issue: 接受割礼与死亡之间的关系
  choice: 因为他们接受了割礼，却死了
  alternative: 因为他们接受了割礼并且死了
  rationale: 希腊文以 καὶ 并列，但语境含有令人悲伤的反差；“却”使现代汉语通顺，同时不将割礼明确说成死亡原因。
- issue: 父亲在祝福中对“我们”的处置
  choice: 越过了我们
  alternative: 忽略了我们／没有理会我们
  rationale: 不把难解且疑有讹误的 παρεῖδεν 具体化为撤销祝福、咒诅或完全排除，以免消解文本张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“便……又……”理顺叙事节奏；分号区分父亲的情绪及其在祝福中的后续行为。
