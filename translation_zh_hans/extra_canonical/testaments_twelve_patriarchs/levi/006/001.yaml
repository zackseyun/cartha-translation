  text: And as I was going to my father, I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, to the right of Abim.
translation:
  language: zh_hans
  text: 我往父亲那里去的时候，发现了一面青铜盾牌；因此，那座山名叫“阿斯庇斯”[a]。这山靠近迦巴勒，在亚比玛的右边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿斯庇斯”音译自希腊文，意思是“盾牌”。
    reason: 保留山名与前文“青铜盾牌”之间的词语关联。
  - marker: b
    text: “在亚比玛的右边”也可理解为“在亚比玛右侧”；原文没有说明判断左右所依据的朝向。
    reason: 保留方位表达的真实歧义，避免擅自转换为东、西、南、北。
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  choice: 一面铜盾
  rationale: ἀσπίς指盾牌，χαλκοῦς/χαλκῆν指铜或青铜制成；现代汉语用“铜盾”简洁自然，并保留与山名的词源关联。
- source_word: Ἄσπις
  choice: 阿斯庇斯
  rationale: 此处是山名，同时与普通名词ἀσπίς“盾牌”形成命名双关；正文音译地名，脚注说明含义。
- source_word: Γεβάλ
  choice: 迦巴勒
  rationale: 按希腊文地名音译，并采用庄重、易辨识的汉语形式。
- source_word: ἐκ δεξιῶν Ἀβιμά
  choice: 在亚比玛的右边
  rationale: 依原文直译其相对方位；“右边”究竟以何种朝向为基准并不明确，因此不改写为更具体的方位。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“我往父亲那里去的时候”自然表达未完成的行进背景；分为两句，以免汉语长句拖沓。所有地名均作音译，并用脚注呈现必要的词源和方位信息。
