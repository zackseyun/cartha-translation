source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διδάξατε δὲ καὶ ὑμεῖς⁷ τὰ τέκνα ὑμῶν γράμματα⁸ ἵνα ἔχωσι⁹ σύνεσιν ἐν *πάσῃ τῇ ζωῇ αὐτῶν¹⁰, ἀναγινώσκοντες¹¹ ἀδιαλείπτως¹² τὸν νόμον τοῦ Θεοῦ¹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/002.yaml
  text: And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing.
translation:
  language: zh_hans
  text: 你们也要教自己的儿女识字，使他们一生都有悟性，不住地诵读上帝的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράμματα
  choice: 识字
  rationale: 此处指学习文字、具备读写和阅读能力；译作“识字”比直译“字母”更符合现代汉语语境，也与下文诵读律法相连。
- source_word: σύνεσιν
  choice: 悟性
  rationale: 保留理解力、明辨力的含义，语体庄重且不把所指缩窄为单纯知识。
- source_word: ἐν πάσῃ τῇ ζωῇ αὐτῶν
  choice: 一生
  rationale: 自然表达“在他们全部人生中”，保留贯穿终生之意。
- source_word: ἀναγινώσκοντες
  choice: 诵读
  rationale: 可涵盖出声朗读及持续研读；比单用“读”更符合宗教律法文本的语境。
- source_word: ἀδιαλείπτως
  choice: 不住地
  rationale: 表达持续不断，保留原文的强度和庄重语感。
- source_word: τὸν νόμον τοῦ Θεοῦ
  choice: 上帝的律法
  rationale: 直接对应希腊文所有格结构，不额外限定为某一具体法典或教派解释。
theological_decisions:
- issue: “悟性”的范围及其与诵读律法的关系
  choice: 保留目的从句与分词之间较宽松的关系，不明确断言悟性只由诵读律法产生
  alternative: 译为“使他们藉着不住诵读上帝的律法而一生明理”
  rationale: 希腊文分词 ἀναγινώσκοντες 可说明伴随的持续实践，但其具体逻辑关系有一定弹性；不宜在译文中强行解释为唯一的手段或因果机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你们也要”保留 δὲ καὶ ὑμεῖς 的承接与强调；句式简洁，适合经训体裁。
