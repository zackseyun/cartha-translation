source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ⸀Ἐὰν γάρ τις φυλάξῃ αὐτὸν ἐκ τῶν πονηρῶν τούτων ἔργων⸀⁵¹ τότε⁵² γενήσεται⁵³ αὐτῷ σοφία⁵⁴ καὶ *παρὰ τοῖς πολεμίοις λαμπρὰ⁵⁵ καὶ ἐπὶ⁵⁶ γῆς ἀλλοτρίας⁵⁷ πατρίς, καὶ ἐν μέσῳ⁵⁸ ἐχθρῶν εὑρηθήσεται⁵⁹ φίλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/008.yaml
  text: For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend.
translation:
  language: zh_hans
  text: 因为，人若保守自己远离这些恶行，那么，智慧必在仇敌中为他显得光彩，并在异乡成为他的故乡；他也必在敌人中间被认作朋友。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃ αὐτὸν ἐκ
  choice: 保守自己远离
  rationale: 保留“看守、护卫自己使之不沾染”的反身意味，同时符合现代汉语表达。
- source_word: πονηρῶν τούτων ἔργων
  choice: 这些恶行
  rationale: 直接对应指示语、形容词和“行为”一词，简洁自然。
- source_word: σοφία
  choice: 智慧
  rationale: 采用该词通常且明确的对应词，不将其人格化程度作超出原文的解释。
- source_word: παρὰ τοῖς πολεμίοις λαμπρά
  choice: 即使在仇敌中也显得光彩
  rationale: λαμπρά在句中与“智慧”相关，但也表达智慧使当事人在敌对者中显明卓越；汉语用“显得光彩”保留这一语义张力，避免僵硬的“智慧成为光辉”。
- source_word: ἐπὶ γῆς ἀλλοτρίας πατρίς
  choice: 异乡必成为他的故乡
  rationale: 保留“ чуж чуж之地—故乡”的鲜明反差，并补出汉语所需的所属关系。
- source_word: εὑρηθήσεται φίλος
  choice: 必被视为朋友
  rationale: 希腊语被动式字面为“将被发现是朋友”；此处译作“被视为”较自然，同时保留他人在敌人中认定其为朋友的含义。
theological_decisions:
- issue: “智慧”与后续三个表语结构的句法关系
  choice: 译为智慧使人光彩，而异乡成为故乡、敌人视他为朋友
  alternative: 把“光彩、故乡、朋友”全部直接作为“智慧”的表语
  rationale: 原文后半句是高度凝练的并列结构，句法略有张力；译文保留智慧带来这些结果的整体关联，同时避免把“智慧是故乡、是朋友”处理成不自然且可能过度人格化的汉语。
- issue: 格言中的应许力度
  choice: 使用“必”表达将来陈述
  alternative: 使用“会”表达一般结果
  rationale: γενήσεται与εὑρηθήσεται均为将来时；“必”较好传达格言式确信，但不额外引入救恩论条件。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文三个递进场景：仇敌中、异乡、敌人中间；“仇敌/敌人”略作词汇变化，以免汉语重复过重，同时反映πολέμιοι与ἐχθροί的近义差别。
