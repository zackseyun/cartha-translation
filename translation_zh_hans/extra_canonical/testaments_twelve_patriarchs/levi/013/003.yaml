base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/003.yaml
  text: For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes.
translation:
  language: zh_hans
  text: 因为凡认识主的律法的人，必受尊重；无论到哪里，都不会被视为外人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώσεται
  choice: 认识
  rationale: 采用“认识”保留将来时语境中的‘得以认识、熟悉’之意，也避免把它缩窄为单纯学习或知识掌握。
- source_word: νόμον Κυρίου
  choice: 主律法
  rationale: νόμος 在此指主所赐的律法或教导；译作“主律法”简洁庄重，并保持其宗教语境。
- source_word: τιμηθήσεται
  choice: 必受尊重
  rationale: 被动将来时表示将受到尊敬或尊荣；“受尊重”符合现代汉语，同时不额外指定施动者。
- source_word: ξένος
  choice: 被当作外人
  rationale: ξένος 可指陌生人、异乡人或外来者；结合去往各处的语境，“被当作外人”自然表达其社会身份含义。
- source_word: ὅπου ὑπάγει
  choice: 无论他到哪里
  rationale: 按惯用汉语表达地点泛指，保留‘往哪里去’的开放性。
theological_decisions:
- issue: 认识主律法与受尊重之间的关系
  choice: 保留原文因果陈述，不说明尊重来自谁或以何种方式实现
  alternative: 解释为必受上帝尊荣，或必受众人敬重
  rationale: 希腊文本只使用无施动者的被动式 τιμηθήσεται；明确施动者会超出原文。
- issue: “不会是外人”的含义
  choice: 译为社会关系层面的“不会被当作外人”
  alternative: 译为法律身份上的“不会成为侨民”或灵性意义上的“不与上帝疏离”
  rationale: ξένος 本身具有多义性，语境不足以支持特定法律或神学解释；当前译法保留广义而自然。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为”承接本节原文的因果连词；分号呈现两个并列的将来结果。未为校勘编号¹⁴—¹⁸设置脚注，因为所给材料未提供对应异文内容。
