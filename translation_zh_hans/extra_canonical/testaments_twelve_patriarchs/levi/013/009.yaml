  text: Everyone who teaches good things and does them will be enthroned with kings, just as Joseph my brother also was.
translation:
  language: zh_hans
  text: 凡教导美善之事并亲自实行的人，必与君王同坐宝座，正如我的兄弟约瑟也曾与君王同坐宝座。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὃς ἂν
  choice: 凡……的人
  rationale: 以自然的现代汉语表达泛指关系结构，保留“每一个符合此条件者”的含义。
- source_word: διδάσκει καλὰ
  choice: 教导美善之事
  rationale: καλά 可泛指美好、良善之事；“美善之事”既保留其宽广语义，又符合庄重文体。
- source_word: καὶ πράττει
  choice: 并付诸实行
  rationale: 宾语承接前面的 καλά，意为不仅教导这些事，也亲自践行；此译法使汉语关系清楚。
- source_word: σύνθρονος ἔσται βασιλέων
  choice: 必与君王同坐宝座
  rationale: σύνθρονος 表示同享宝座或共同在位；此译保留宝座意象，同时避免将其过度解释为正式加冕。
- source_word: ὥσπερ καὶ Ἰωσὴφ ὁ ἀδελφός μου
  choice: 正如我的兄弟约瑟一样
  rationale: 自然表达比较关系；句末“一样”承接前述谓语，符合希腊文省略重复谓语的结构。
theological_decisions:
- issue: 与君王“同坐宝座”的性质
  choice: 保留共同坐宝座的形象性表述
  alternative: 必与君王一同掌权／必被立为与君王同等的人
  rationale: 原文 σύνθρονος 具有共享宝座、同列尊位的意味，但未明确界定政治权力或身份完全相等，因此不作进一步神学或制度化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；通过“教导……并付诸实行”呈现言教与身行的对应，以“同坐宝座”保留原文核心意象及其适度开放性。
