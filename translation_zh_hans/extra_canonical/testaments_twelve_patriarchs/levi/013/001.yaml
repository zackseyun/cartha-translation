base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/001.yaml
  text: 'And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity in accordance with all his law.'
translation:
  language: zh_hans
  text: 现在，我的孩子们，我吩咐你们：要全心敬畏主——你们的上帝；并要以纯一的心，遵照他全部的律法行事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβεῖσθε
  choice: 敬畏
  rationale: 既保留对上帝的畏惧，也包含尊崇与敬重，符合宗教语境中的常见现代汉语表达。
- source_word: ἐξ ὅλης τῆς καρδίας ὑμῶν
  choice: 全心
  rationale: 自然简洁地表达“从你们全部的心”，指完整、专一的内在投入。
- source_word: πορεύεσθε
  choice: 行事
  rationale: 此处是伦理性的生活方式，不单指身体行走；译为“行事”更符合现代汉语。
- source_word: ἐν ἁπλότητι
  choice: 以纯一的心
  rationale: ἁπλότης可指单纯、真诚、专一；“纯一的心”保留其内在品格与不二之意，避免被误解为头脑简单。
- source_word: κατὰ πάντα τὸν νόμον αὐτοῦ
  choice: 在一切事上遵照他的律法
  rationale: 表达按其全部律法规范生活的含义；“在一切事上”也自然呈现πάντα可能修饰遵行范围的语感。
theological_decisions:
- issue: “敬畏”是否弱化为单纯尊敬
  choice: 保留“敬畏”
  alternative: 尊敬
  rationale: φοβέομαι在对上帝的语境中兼有畏惧与尊崇；“敬畏”较完整，不宜消解其中的张力。
- issue: πάντα与“律法”的关系
  choice: 译作“在一切事上遵照他的律法”
  alternative: 遵照他的全部律法
  rationale: 希腊文κατὰ πάντα τὸν νόμον可产生“一切事上按律法”与“按全部律法”的轻微结构张力；正文选择较自然且涵盖全面顺服的表达，不另作教义化限定。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“我的孩子们”“主你们的上帝”“律法”等措辞保留遗训体和宗教语域；句法经过汉语化处理，但仍维持原文命令句的力度。
