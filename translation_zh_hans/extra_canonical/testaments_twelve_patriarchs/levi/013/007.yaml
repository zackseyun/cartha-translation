  to: 你们要以敬畏上帝的心获得智慧，因为如果被掳发生，城邑和地区被毁灭，金银和一切财产都消逝，没有人能夺去智者的智慧；唯有不敬虔的盲目和罪的心硬能夺去它。[a]
