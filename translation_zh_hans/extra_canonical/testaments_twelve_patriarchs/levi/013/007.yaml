  text: Σοφίαν κτήσασθε³⁵ *ἐν φόβῳ³⁶ Θεοῦ³⁷, ὅτι³⁸ ἐὰν *γένηται αἰχμαλωσία, καὶ ὀλοθρευθῶσι πόλεις καὶ χῶραι³⁹ *καὶ χρυσὸς καὶ ἄργυρος καὶ πᾶσα⁴⁰ κτῆσις⁴¹ ἀπολεῖται⁴², *τοῦ σοφοῦ τὴν σοφίαν⁴³ †οὐδεὶς⁴⁴ δύναται⁴⁵ ἀφελέσθαι⁴⁶ εἰ μὴ τύφλωσις⁴⁷ ἀσεβείας⁴⁸ καὶ πώρωσις⁴⁹ ἁμαρτίας⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/007.yaml
  text: Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perish, no one can take away the wise man's wisdom, except the blindness of ungodliness and the hardening of sin.
translation:
  language: zh_hans
  text: 你们要以敬畏上帝的心获得智慧，因为如果被掳发生，城邑和地区被毁灭，金银和一切财产都消逝，没有人能夺去智者的智慧；唯有不敬虔的盲目和罪的心硬能夺去它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不敬虔的盲目”和“罪的心硬”也可理解为“不敬虔所造成的盲目”和“罪所造成的心硬”；希腊文属格的关系可表示来源、性质或关联。
    reason: 保留τύφλωσις ἀσεβείας及πώρωσις ἁμαρτίας中属格结构的语义歧义。
lexical_decisions:
- source_word: Σοφίαν κτήσασθε
  choice: 获得智慧
  rationale: κτάομαι在此是主动获取、拥有之意；“获得智慧”既保留命令语气，也符合现代汉语。
- source_word: ἐν φόβῳ Θεοῦ
  choice: 在敬畏上帝中
  rationale: 保留介词ἐν的表达及“敬畏上帝”这一伦理和宗教语境，不将其弱化为一般性的尊重。
- source_word: αἰχμαλωσία
  choice: 被掳之事
  rationale: 该词可指被俘、囚禁或集体被掳；上下文涉及城邑田地毁灭，故采用具有群体灾难色彩的“被掳”。
- source_word: πόλεις καὶ χῶραι
  choice: 城邑和田地
  rationale: πόλεις指城市或城邑；χῶραι可指地区、乡野或土地。此处与财产毁灭并列，以“田地”自然呈现其可遭战乱破坏的土地含义。
- source_word: πᾶσα κτῆσις
  choice: 一切财产
  rationale: κτῆσις在此指所拥有之物，与金银并列，译作“财产”准确自然。
- source_word: τύφλωσις ἀσεβείας
  choice: 不敬虔所造成的盲目
  rationale: 属格关系可能表示来源、性质或关联；正文用“所造成的”呈现最顺畅的因果理解，同时以脚注保留歧义。
- source_word: πώρωσις ἁμαρτίας
  choice: 罪所造成的心硬
  rationale: πώρωσις本指硬化、麻木，伦理语境中“心硬”自然清楚；属格的具体关系仍有歧义，脚注予以说明。
theological_decisions:
- issue: 智慧能否被夺去的例外条件
  choice: 保留“除非”结构，使不敬虔的盲目与罪的心硬成为唯一例外
  alternative: 译成“惟有不敬虔的盲目和罪的心硬能夺去它”
  rationale: 原文εἰ μή直接表达例外，但“夺去”的施事关系在抽象名词下略有张力；保留原句结构可避免把修辞性陈述过度系统化。
- issue: ἀσεβείας与ἁμαρτίας两个属格的关系
  choice: 正文按因果关系表达，并在脚注说明也可作性质或关联关系理解
  alternative: “不敬虔的盲目和罪的心硬”
  rationale: 原文属格本身未明确限定为原因、来源或性质，应保存其真实歧义，不据特定神学框架强行定解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“你们要”明确复数命令；以“即使……也……”顺应汉语条件句习惯，同时保留灾难不能夺走智慧这一论旨。唯一脚注标记[a]已置于正文对应句末。
