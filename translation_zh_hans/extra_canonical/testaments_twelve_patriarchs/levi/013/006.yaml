  source_fidelity: 译文总体保留了复数命令、条件句及“播种—收割”的比喻结构，也没有擅自把结果归因于神或限定为来世。不过，“一生中”将 ζωή较宽的“生命／生活”收窄为人生年限；“找到它们”在汉语中指代和搭配略显生硬。
  naturalness: “把美善的事撒在你们的心灵里”可理解，但“在……里播下”更合乎汉语中播种隐喻的常用搭配。“在你们的生命中发现这些美善的事”较清楚自然。
  terminology: “心灵”可恰当地表达此处ψυχαῖς所指的内在生命；“美善的事”与“邪恶的事”保留ἀγαθὰ／πονηρά的中性复数概括性。“一切纷扰和苦难”比“各样的纷乱和苦难”更贴近πᾶσαν的总括语气，并保持ταραχή与θλῖψις的区分。
