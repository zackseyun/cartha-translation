base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/006.yaml
  text: And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction.
translation:
  language: zh_hans
  text: 要在你们的心灵里播下美善的事，你们就会在自己的生命中发现这些美善的事。可是，你们若播下邪恶的事，就会收割一切纷扰和苦难。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρατε / σπείρητε
  choice: 撒在／撒下
  rationale: 保留原文贯穿全句的播种隐喻，并以自然的现代汉语表达。
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: 你们的心灵里
  rationale: ψυχή在此指人的内在生命；“心灵”比单用“灵魂”更符合现代汉语劝诫语境，同时不把含义缩限为情感或思想。
- source_word: ἀγαθὰ
  choice: 美善的事
  rationale: 兼顾道德上的善与具有益处、价值的事物，保留中性复数的概括性。
- source_word: ἐν τῇ ζωῇ ὑμῶν
  choice: 在一生中
  rationale: ζωή可指生命或生活；此处译为“一生中”既自然，也保留在人生历程中获得所播之善的含义。
- source_word: πονηρὰ
  choice: 邪恶的事
  rationale: 与ἀγαθὰ形成明确的道德对照，并保留中性复数所指的行为或事物。
- source_word: πᾶσαν ταραχὴν καὶ θλίψιν
  choice: 各样的纷乱和苦难
  rationale: πᾶσαν在并列名词前有总括意味；ταραχή译作“纷乱”，θλῖψις译作“苦难”，保留外在扰乱与受压困苦的区分。
- source_word: θερίσετε
  choice: 收割
  rationale: 与“撒下”对应，维持播种—收割的比喻链条。
theological_decisions:
- issue: 播种与收获之间关系的性质
  choice: 直译为将来陈述“就会……／会……”
  alternative: 解释为神的报应或必然的因果法则
  rationale: 原文陈述行为及其结果，却未明说结果由谁施行，也未界定其机制；译文不额外加入神学解释。
- issue: “在你们的生命中”所指范围
  choice: 译作“在一生中”
  alternative: 译作“在永生中”或“在来世中”
  rationale: 原文ζωή本身未明确限定为今生、来世或永生，因此不引入末世论限定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留原文命令、条件句以及“播种—收割”的平行意象。
