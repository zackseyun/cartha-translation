translation:
  language: zh_hans
  text: 所以，我的孩子们，要在地上行公义，好叫你们在天上得着它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得着它”：原文为“找到／得着”，宾语未明说，最自然是指前面的“公义”。原文此词前有校勘符号（†），表示该处文本或读法存在疑问。
    reason: 保留†所提示的文本不确定性，同时按现存希腊文主动语态译出，不将未经文本支持的被动义置于正文。
lexical_decisions:
- source_word: Ποιήσατε δικαιοσύνην
  choice: 行公义
  rationale: 直译为“实行公义”，但“行公义”在现代汉语中自然、庄重，也保留了以行动实践正义的含义。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留亲切的劝诫语气；复数“孩子们”对应希腊语复数。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 准确表达与“在天上”相对的空间范围，同时符合自然汉语。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 在天上
  rationale: 希腊语使用复数“诸天”，但现代汉语通常以“天上”自然表达；不额外引入宇宙层级观念。
theological_decisions:
- issue: εὕρητε的语态及句义
  choice: 被寻见
  alternative: 找到（它）
  rationale: 现有文本以主动形式表达，但校勘符号表明读法存疑；结合句法和语境，可按具有不及物或被动含义的表达理解为“被寻见”。不过“找到（它）”也是可能的解释，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“所以”承接上文；“行公义”简洁有力。正文不替读者消解原文在“被寻见”与“找到它”之间的文本和句法张力。
