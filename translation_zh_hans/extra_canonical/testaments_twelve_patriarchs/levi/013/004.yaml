source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται¹⁹ καὶ ἐπιθυμήσουσι πολλοὶ τῶν ἀνθρώπων δουλεῦσαι αὐτῷ²⁰ καὶ ἀκοῦσαι νόμου²¹ ἐκ τοῦ²² στόματος αὐτοῦ²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/004.yaml
  text: Indeed, he will gain many friends beyond his parents, and many among men will desire to serve him and to hear the law from his mouth.
translation:
  language: zh_hans
  text: 的确，他得到的朋友会比父母还多[a]；人中也会有许多人渴望服侍他，并从他口中听律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比父母还多”直译希腊语“超过父母”。此处可指他得到的朋友在数目上多于父母；也可能指这些朋友在关系上的分量超过父母，或指在父母以外另有许多朋友。原文未明确限定比较的范围。
    reason: 保留ὑπὲρ γονεῖς在比较维度及是否带有“在……之外”意味上的歧义，同时使正文符合现代汉语表达。
lexical_decisions:
- source_word: Καίγε
  choice: 并且
  rationale: 承接上文并带轻微强调；中文以“并且”自然表达，避免过度强化为“的确”。
- source_word: πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται
  choice: 他所得的许多朋友将胜过父母
  rationale: 保留ὑπέρ在比较结构中的张力；原文可理解为朋友在数量或关系上“超过父母”，故不擅自补入“他的”或明确比较维度。
- source_word: ἐπιθυμήσουσι
  choice: 渴望
  rationale: 传达强烈愿望，而非一般性的“想要”。
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: 人中也必有许多人
  rationale: 自然表达部分属格，即人类群体中的许多人。
- source_word: δουλεῦσαι αὐτῷ
  choice: 服侍他
  rationale: δουλεύω可指作仆役或效力；“服侍”保留其从属与服务意味。
- source_word: ἀκοῦσαι νόμου ἐκ τοῦ στόματος αὐτοῦ
  choice: 听他口中所出的律法
  rationale: 按希腊语意象直译“从他口中听律法”，以自然中文表达其亲自宣讲、教导律法之意；νόμου无冠词，但此处中文用“律法”即可，不强加不定或特指区别。
theological_decisions:
- issue: “律法”是否特指摩西律法或泛指教训
  choice: 保留为“律法”
  alternative: 教导／法则
  rationale: νόμος在犹太宗教语境中通常具有“律法”含义，但本句未进一步限定；不改译成较宽泛的“教导”，也不增补“摩西”。
- issue: 朋友与父母的比较关系
  choice: 正文保留“胜过父母”，并以脚注说明歧义
  alternative: 除了父母以外，他还会得到许多朋友
  rationale: ὑπὲρ γονεῖς最直接呈现比较关系；改成“除父母以外”会消除原文可能存在的数量或重视程度上的比较。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所得的许多朋友”比“获得许多朋友”略显典雅，并能与后文的预言体相称；“听他口中所出的律法”保留原文的口传意象。
