  to: 的确，他得到的朋友会比父母还多[a]；人中也会有许多人渴望服侍他，并从他口中听律法。
  rationale: 修订以“得到的朋友会比父母还多”取代不自然的“朋友将胜过父母”，在正文中呈现最直接、可读的数量比较；脚注明确保留原希腊语可能涉及关系分量或“在父母以外”的解释。另以“的确”体现Καίγε的强调，并将“从他口中听律法”调整为更贴近原文且自然的汉语。
