source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐγὼ¹ οὖν, τέκνα μου², ἔγνων³ ὅτι ἐπὶ τὰ τέλη τῶν αἰώνων ἀσεβήσετε⁴ *ἐπὶ Κυρίου, χεῖρας ἐπιβάλλοντες⁵ ἐν⁶ κακίᾳ [ἐπ᾿ αὐτὸν]⁷ καὶ ἐν⁸ πᾶσι τοῖς ἔθνεσιν γενήσεσθε⁹ χλευασμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/001.yaml
  text: Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands in wickedness [upon him], and among all the nations you will become a mockery.
translation:
  language: zh_hans
  text: 所以，我的孩子们，我知道：到了万世的末期，你们必会不敬地对待主，以恶意向他下手[a]；你们也必会成为万国的笑柄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向他”在希腊文本中存疑；有的文本不含这两个词。
    reason: 原文以方括号标出ἐπ᾿ αὐτόν，需向读者说明其文本不确定性。
lexical_decisions:
- source_word: ἔγνων
  choice: 我已经知道
  rationale: 该词为 γινώσκω 的第二不定过去时，可表达“得知、认识到”；结合预告语境，译作“已经知道”自然呈现既已获知而现今知晓的意味。
- source_word: ἐπὶ τὰ τέλη τῶν αἰώνων
  choice: 到了万世的末期
  rationale: 保留 τέλη 和 αἰώνων 的末世性与复数视野，同时避免生硬的“诸世代的诸末端”。
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  choice: 你们会对主行不敬虔的事
  rationale: ἀσεβέω 指不敬虔、亵慢地行事；介词短语表明行为针对主。此译法不把含义缩窄为单一的“犯罪”或“亵渎”。
- source_word: χεῖρας ἐπιβάλλοντες
  choice: 向他下手
  rationale: 该惯用表达字面为“把手加在……身上”，语境中含敌意攻击或加害之意；“下手”既自然，也保留具体行为未完全说明的空间。
- source_word: χλευασμός
  choice: 笑柄
  rationale: 该名词指嘲弄、讥笑，作表语时译为“沦为笑柄”符合现代汉语，也保持其成为众人嘲弄对象的含义。
theological_decisions:
- issue: 不敬虔行为的对象及其与“向他下手”的关系
  choice: 明确译出“对主……向他下手”，但用脚注标示“向他”的文本疑问
  alternative: 译作“你们会在主面前行不敬虔的事，心怀恶意下手”
  rationale: 现有希腊文本把行为指向 κύριος，而括号中的 ἐπ᾿ αὐτόν 明示下手的对象是“他”；为避免借翻译预先断定具体历史或基督论指涉，正文只保留代词，不作身份扩释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我的孩子们”保留父辈训诫口吻；“万世的末期”“万国”维持启示性语境，“心怀恶意向他下手”“沦为笑柄”则避免不自然的逐词硬译。
