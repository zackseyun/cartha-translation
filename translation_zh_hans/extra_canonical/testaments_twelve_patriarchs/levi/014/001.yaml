  naturalness: 建议使用“我知道”“你们必会不敬地对待主”“成为万国的笑柄”。这些表述保持庄重、现代的汉语，同时避免“行不敬虔的事”的名词化赘余及“沦为”额外强化的衰败意味。
  terminology: “主”对应Κυρίου，“万国”对应πᾶσι τοῖς ἔθνεσιν，“笑柄”对应χλευασμός，均合适。保留“向他”的脚注，以反映方括号所示ἐπ᾿ αὐτόν的文本不确定性；正文不据此作任何身份或历史事件的扩释。
