  to: 所以，我的孩子们，我知道：到了万世的末期，你们必会不敬地对待主，以恶意向他下手[a]；你们也必会成为万国的笑柄。
  rationale: 修订仅改善汉语自然度并更准确保留ἐν κακίᾳ的修饰范围：以“我知道”表达既已获知的确信，以“以恶意”避免将邪恶行动限定为内在心理状态，并以“成为万国的笑柄”贴近源文表语。文本存疑的“向他”及其脚注完整保留。
