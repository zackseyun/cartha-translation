  text: For just as the sun is pure before the Lord upon the earth, so also you are, the lights of Israel, beyond all the nations.
translation:
  language: zh_hans
  text: 因为正如太阳在主面前、在地上是纯净的，[a]你们也是如此；你们这以色列的明灯，胜过万国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希腊文本在“太阳”及“在地上”处带有校勘疑难标记；“在主面前、在地上”与“是纯净的”的具体句法关系不能完全确定。
    reason: 保留原文的文本疑难和介词短语关系，避免补入原文未明说的“照耀”动作。
lexical_decisions:
- source_word: ὁ ἥλιος
  choice: 太阳
  rationale: 按通常词义直译，保留原文以太阳作比喻的意象。
- source_word: καθαρὸς
  choice: 纯净无瑕
  rationale: καθαρός表示洁净、纯洁；此处兼具光明与礼仪性的意味，用双词表达其语义幅度。
- source_word: οἱ φωστῆρες τοῦ Ἰσραήλ
  choice: 以色列的明灯
  rationale: φωστῆρες指发光体或光源；用于人时译作“明灯”自然而庄重，同时保留其象征性。
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: 超越万国
  rationale: παρά加宾格在比较语境中表示超过、胜过；如此译出以色列之明灯与列国之间的比较。
theological_decisions:
- issue: 太阳“在主面前”与“在地上”的句法关系
  choice: 在主面前照耀大地，纯净无瑕
  alternative: 太阳在主面前、在地上是纯净的
  rationale: 传本文本在“太阳”和“照耀/临到大地”附近有校勘疑难。正文采用通顺且符合太阳意象的理解，但以脚注保留更贴近现存词序的可能读法。
- issue: 对万国的比较是否表示本质优越
  choice: 超越万国
  alternative: 在万国之上
  rationale: 保留原文明确的比较张力，不进一步解释为民族本质、政治地位或救恩身份上的优越。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“照耀大地”使汉语比喻自然流畅；脚注则保留希腊文本可能的较直译读法。
