lexical_decisions:
- source_word: φυλάξατε
  choice: 谨守
  rationale: 在遗训劝诫的语境中，“谨守”兼具看守与遵行命令之意，也符合庄重而自然的现代汉语表达。
- source_word: ἐντέλλομαι
  choice: 我所吩咐
  rationale: 保留利未作为父祖发出遗命的权威语气，同时比“命令”更自然地用于对子孙的训诫。
- source_word: ἀθῷός εἰμι
  choice: 我是无辜的
  rationale: 准确表达说话者不为后代将来的罪行负责。
- source_word: ἀσεβείας
  choice: 不敬虔
  rationale: 保留该词针对上帝的宗教性与盟约性含义，而不泛化为一般恶行。
- source_word: παραβάσεως
  choice: 悖逆之罪
  rationale: 表达越过既定诫命界限的行为；加入“之罪”使与前项并列的汉语更清楚。
- source_word: συντελείᾳ τῶν αἰώνων
  choice: 万世终结之时
  rationale: 保留复数“诸世代/万世”及启示文学的终末语气，避免套用过度熟化的术语。
- source_word: σωτῆρα
  choice: 救主
  rationale: 直接保留该称号的分量。
- source_word: χριστόν
  choice: 弥赛亚
  rationale: 此处用作受膏者称号，译为“弥赛亚”可保留其犹太语境。
- source_word: πλανῶντες τὸν Ἰσραήλ
  choice: 使以色列误入歧途
  rationale: 自然表达其使动含义，并保留针对整个以色列群体的效果。
- source_word: ἐπεγείροντες
  choice: 激起
  rationale: 保留行为导致或招致后续灾祸的使动意味，同时不把因果关系解释得过死。
- source_word: κακὰ μεγάλα
  choice: 大灾祸
  rationale: 在审判语境中，κακά 指临到人的祸患；“大灾祸”比字面的“大恶事”更符合汉语，同时保留严重性。
- source_word: ἀνομήσετε
  choice: 行不法之事
  rationale: 以动词性表达保留持续实行悖法行为的主动意味。
- source_word: καταπέτασμα
  choice: 幔子
  rationale: 指圣殿内部的悬挂帘幕；“幔子”庄重且为普通读者可理解。
- source_word: εἰς ὄνειδος καὶ εἰς κατάραν
  choice: 受辱，成为咒诅
  rationale: 分别保留羞辱与咒诅两个平行概念，并使中文句式顺畅。
- source_word: οἶκος
  choice: 殿
  rationale: 虽然基本义为“房屋”，但主所拣选且称为耶路撒冷的语境明显指向神圣居所；“殿”在中文中更凝练自然。
- source_word: περιέχει ἡ βίβλος
  choice: 书中所记载的
  rationale: περιέχει 在引书公式中表示文献所包含、记载的内容，译作“所记载的”符合现代汉语引证习惯。
theological_decisions:
- issue: 第2节“世界的救主弥赛亚”是否属于原始文本
  choice: 按所给希腊见证收入正文，但置于方括号内
  alternative: 将其视为后期基督教增补而删去，或不加标示地收入正文
  rationale: 所给底本确有此语，但其传承史与措辞使其常被视为次生增补。方括号既忠实呈现见证，又不掩盖文本疑问。
- issue: 第2节“从主而来的大灾祸临到他”中代词的指向
  choice: 保留单数“他”，并用脚注说明所指不明
  alternative: 明确解释为以色列、弥赛亚，或改成“临到你们”
  rationale: 希腊文 ἐπ᾿ αὐτόν 的先行词与句法关系存在困难；直接指定对象会消除原文真实的含混。
- issue: 第3节圣殿幔子裂开之意象
  choice: 直译为审判与羞耻暴露的预言意象
  alternative: 在正文中明确解释为福音书受难叙事的预示，或仅视为祭司羞耻的象征
  rationale: 原文把幔子裂开与不再遮掩其丑行相连，但未明说后来的正典事件，因此不在译文中强加特定互文解释。
- issue: 第5节引用义人以诺的书
  choice: 如实译出，并以文化脚注说明第二圣殿时期的文献背景
  alternative: 把该书暗示为后世正典的一部分，或因其非后世正典而淡化引用
  rationale: 译文应忠实保留作者所引用的权威传统，不以后来的正典界限改写其历史语境。
translation_notes:
  register: 采用现代标准书面普通话，语气庄重而不古奥。劝诫、预言和审判用语保持力度；对疑似增补、代词指向和圣殿意象不作教派化消解。正文用“孩子们”体现亲属遗训语境，用“看哪”保留 ἰδού 的宣告色彩。
