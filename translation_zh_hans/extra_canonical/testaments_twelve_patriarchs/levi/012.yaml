  text: 1. And Gersam took a wife, and by her he fathered Lomne and Semee. 2. And the sons of Kaath were Ambram, Isachar, Chebron, and Ozeel. 3. And the sons of Merari were Mooli and Mouses. 4. And in the sixty-fourth year of my life, Ambram took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day. 5. I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt. 6. And behold, my children, you are the third generation. 7. Joseph died in the one hundred eighteenth year of my life.
translation:
  language: zh_hans
  text: '《利未遗训》第十二章


    1 革珥撒姆娶了妻，由她得了洛姆内和塞梅。2 卡阿特的儿子是阿布拉姆、伊萨哈尔、赫布龙和奥泽埃尔。[a] 3 梅拉雷的儿子是莫奥利和摩西斯。[b] 4 我九十四岁那年，阿布拉姆娶了我女儿约哈贝德为妻，[c] 因为他和我女儿是在同一天出生的。5 我八岁时进入迦南地，十八岁时杀了示剑，十九岁时担任祭司，[d] 二十八岁时娶妻，四十（又八）岁时进入埃及。[e] 6 看哪，我的孩子们，你们是第三代。7 约瑟在我一百一十八岁那年去世。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节各人名依所传希腊语形式音译，因此与较熟悉的圣经家谱译名有所不同。
    reason: textual_variant
  - marker: b
    text: 本节所列名字可能对应圣经家谱中的米拉利支系，但译文保留希腊文本传下来的名称形式。希腊文本将本节整句置于方括号内，显示其文本状态存在不确定性。
    reason: textual_variant
  - marker: c
    text: 原文明确说“我女儿约哈贝德”，这与较熟悉的圣经家谱传统形成张力；译文按现有希腊文本直译。
    reason: alternative_reading
  - marker: d
    text: “担任祭司”所译的希腊语动词，指履行祭司职分。
    reason: lexical_alternative
  - marker: e
    text: 希腊文本作“四十（又八）岁”，其中“又八”置于编辑圆括号内。译文保留这一文本标记；若计入“又八”，年龄就是四十八岁。
    reason: textual_variant
lexical_decisions:
- source_word: ἔλαβεν ... γυναῖκα / εἰς γυναῖκα
  choice: 娶了妻／娶……为妻
  rationale: 这是表示婚姻的常见希腊语表达；中文采用自然、庄重的对应说法。
- source_word: ἔτεκεν ... ἐξ αὐτῆς
  choice: 由她生了
  rationale: 原文以革珥撒姆为语法主语，却使用通常表示生育的动词，并加上“由她”；此译法保留这种不寻常的表达，不擅自改成较明确的“她为他生了”或“他生了”。
- source_word: υἱοί
  choice: 儿子
  rationale: 家谱语境中指男性后裔，直译为“儿子”最为准确。
- source_word: θυγατέρα μου
  choice: 我女儿
  rationale: 原文明确使用直接的亲属称谓，不将其宽泛解释为“女性后裔”。
- source_word: ἐν μιᾷ ἡμέρᾳ ἐγεννήθησαν
  choice: 在同一天出生
  rationale: 自然表达二人出生日期相同，避免误解为生产过程持续一天。
- source_word: ἱεράτευσα
  choice: 担任祭司
  rationale: 该动词表示履行祭司职分；“担任祭司”兼顾动作含义与现代中文的自然表达。
- source_word: ἰδού
  choice: 看哪
  rationale: 保留遗训体裁中庄重的唤起注意语气。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: τέκνα比“儿子们”范围更广，故不作过度限定。
- source_word: τρίτη γενεά
  choice: 第三代
  rationale: 直接表达听众相对于说话者的世代位置。
theological_decisions:
- issue: 家谱人名与常见圣经译名不一致
  choice: 按所传希腊语形式音译，如革珥撒姆、卡阿特、阿布拉姆、莫奥利、摩西斯
  alternative: 统一改成较熟悉的革顺、哥辖、暗兰、抹利、母示等名称
  rationale: 本段所依据的希腊文本有其特定人名形式；保留这些形式可避免无声地与其他家谱传统协调。
- issue: “我女儿约哈贝德”与较熟悉的家谱传统之间存在张力
  choice: 直译为“我女儿约哈贝德”
  alternative: 改作“我的后裔约哈贝德”或据其他传统校改
  rationale: θυγατέρα μου明确意为“我女儿”；译文保留原文的家谱张力，而不在正文中替作者解决。
- issue: 利未年龄的年代陈述
  choice: 第4节译作九十四岁；第5节将进入埃及的年龄呈现为“四十——又八——岁”
  alternative: 依英语咨询文本把第4节改作六十四岁，并直接把第5节定为四十八岁
  rationale: 现给希腊文本第4节明确为ἐνενηκοστῷ τετάρτῳ（第九十四）；第5节的“又八”带有编辑括号，译文分别服从希腊文本并显明其文本状态。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，保留遗训式叙述和家谱语气。人名以希腊见证的形式为先，不按常见圣经家谱静默统一。第4节依希腊原文译为“九十四岁”，不沿用英语咨询层的“六十四岁”；第5节则在正文和脚注中保留“四十（又八）”的文本不确定性。
