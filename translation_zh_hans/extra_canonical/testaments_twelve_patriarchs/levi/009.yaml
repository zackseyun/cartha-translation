  text: 'And after two days[a], I and Judah went up with our father Jacob to Isaac our grandfather. And the father of my father blessed me according to the visions that I had seen, and he was not willing to go with us to Bethel.


    And when we came to Bethel, my father Jacob saw a vision concerning me, that I would be a priest for them. And rising early in the morning, he gave a tenth of everything through me to the Lord.


    And so we came to Hebron to remain there. And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me. And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of firstfruits, of freewill offerings, and of peace offerings. And every day he kept instructing me in freewill offerings, and giving his attention to me he said:


    “Take heed to yourself from the spirit of sexual immorality[b], for this persists and is about to defile the holy things through your offspring. Therefore take for yourself a wife while you are still young, one having no blemish and not defiled, and not from the stock of foreign nations.


    And before you enter into the holy things, wash; and when you sacrifice in the presence of the Lord, wash your hands. And when you complete the sacrifice again, wash.


    And from twelve trees having leaves offer to the Lord, as Abraham taught me. And from every clean animal and bird offer a sacrifice to the Lord. And from all your first produce and wine offer firstfruits as a sacrifice to the Lord God[c][d]. And season every sacrifice with salt.”'
translation:
  language: zh_hans
  text: '利未遗训 9


    过了两天，我和犹大随父亲雅各上去见我们的祖父以撒。我父亲的父亲照着我所见的异象为我祝福，却不愿与我们一同往伯特利去。


    我们到了伯特利以后，我父亲雅各看见有关我的异象：我将作他们的祭司。他清早起来，借着我把一切的十分之一献给主。


    随后，我们来到希伯仑，住在那里。以撒常常叫我到他那里，向我重申主的律法，正如天使指示我的。他教导我有关祭司职分、祭物、全燔祭、初熟之物、自愿祭和平安祭[c]的律法。他天天教导我，专心栽培我，对我说：


    “你要谨慎，远离淫乱的灵；这灵纠缠不休[a]，将要借着你的后裔玷污圣物。所以，你还年轻时就要为自己娶妻；她应当没有瑕疵，未受玷污，也不可出自外族各民。


    “你进入圣所之前，要沐浴；献祭时，要洗手；献完祭后，还要再洗手[b]。


    “你要从十二棵长着叶子的树上取来，献给主[d]，正如亚伯拉罕教导我的。各样洁净的牲畜和飞鸟，你都要取来献祭给主。从你一切头生的和酒中，要把初熟之物献作祭给主上帝。每一份祭物都要用盐调和。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这灵纠缠不休”所据的希腊文有文本疑难；大意似乎是说淫乱的灵持续存在或不断纠缠。
    reason: textual_variant
  - marker: b
    text: 原文后两次只说“洗”，没有明说洗身体的哪一部分；在献祭礼仪的语境中，很可能指洗手。
    reason: cultural_note
  - marker: c
    text: “平安祭”也可较宽泛地理解为与福祉或拯救有关的祭。
    reason: lexical_alternative
  - marker: d
    text: “从十二棵长着叶子的树上取来，献给主”这项指示含义不明；现存希腊文没有明说所取何物，译文保留这种省略，没有进一步推定具体供物或仪式。
    reason: textual_obscurity
lexical_decisions:
- source_word: ἀπεδεκάτωσε πάντα δι’ ἐμοῦ τῷ Κυρίῳ
  choice: 借着我把一切的十分之一献给主
  rationale: 明确表达十一奉献的动作，同时保留“借着我”这一不寻常但重要的中介表达。
- source_word: ἱερέα
  choice: 祭司
  rationale: 这是现代汉语中准确而通行的职分名称，符合本章祭司礼仪语境。
- source_word: νόμον ἱερωσύνης
  choice: 有关祭司职分……的律法
  rationale: 既保留“律法”与“祭司职分”的关系，又使后续祭物清单在汉语中衔接自然。
- source_word: ὁλοκαυτωμάτων
  choice: 全燔祭
  rationale: 保留祭物全部焚烧的词义，较单称“燔祭”更充分。
- source_word: ἀπαρχῶν
  choice: 初熟之物
  rationale: 表达首先收成并分别献上的部分，采用普通读者可理解的礼仪用语。
- source_word: ἑκουσίου
  choice: 自愿祭
  rationale: 保留献祭出于自愿的含义，同时维持祭祀术语的简洁。
- source_word: σωτηρίου
  choice: 平安祭
  rationale: 在献祭清单中最可能是技术性祭类名称；其较宽的福祉、拯救含义在脚注中保留。
- source_word: πνεύματος τῆς πορνείας
  choice: 淫乱的灵
  rationale: 保留“灵”的人格化或属灵维度，并以庄重、清楚的现代词语表达 πορνεία。
- source_word: μιαίνειν τὰ ἅγια
  choice: 玷污圣物
  rationale: 保留礼仪性污秽以及复数“神圣之物”的具体指向，不将其泛化为一般道德败坏。
- source_word: μὴ ἔχουσαν μῶμον μήτε βεβηλωμένην
  choice: 没有瑕疵，未受玷污
  rationale: 保留祭司洁净语汇在婚姻资格上的呼应，不把“瑕疵”解释成特定身体缺陷。
- source_word: λούου … νίπτου
  choice: 沐浴……洗手
  rationale: 用不同汉语动词体现希腊文两个洗涤动词的差别；后两处按献祭礼仪语境理解为洗手，并加脚注说明。
- source_word: ἅλατι ἁλιεῖς
  choice: 用盐调和
  rationale: 自然表达给祭物加盐、以盐调制的命令，同时保持礼仪语体。
theological_decisions:
- issue: 淫乱警告与祭司后裔的关系
  choice: 保留“借着你的后裔玷污圣物”的明确关联
  alternative: 将其泛化为淫乱会造成一般性的道德污秽
  rationale: 原文直接连接“你的后裔”和“圣物”，体现世袭祭司群体所面对的礼仪与道德危险，不宜弱化。
- issue: σωτηρίου 的祭类含义
  choice: 平安祭
  alternative: 福祉祭；拯救祭
  rationale: 上下文是一系列技术性祭物名称，“平安祭”最易辨认；但其语义范围可能涉及福祉或拯救，故在脚注中说明。
- issue: τὰ ἅγια 在不同语境中的表达
  choice: 9:9译“圣物”，9:11按进入的语境译“圣所”
  alternative: 两处都机械统一为“圣物”或“神圣之物”
  rationale: 希腊语形式相同但语境功能不同；“进入圣所”在汉语中自然且符合礼仪动作，而警告所指仍可能是各样神圣事物，故译“圣物”。
- issue: 婚配对象的范围
  choice: 只说不可出自外族各民
  alternative: 补入“要从我的家族中娶妻”
  rationale: 现有希腊文本没有“从我的家族中”这一成分，不应从传统或推论补入。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。叙事段落保持遗训体的简洁，直接引语采用长辈训诫的郑重语气。祭祀术语尽量稳定，同时避免以某一宗派的后设神学解释覆盖原文的礼仪性与歧义。
