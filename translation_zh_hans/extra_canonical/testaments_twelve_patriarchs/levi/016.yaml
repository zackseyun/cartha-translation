  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016.yaml
  text: 'And now I know that for seventy weeks you will go astray[a], and you will profane the priesthood and defile the altars. And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.


    And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his stature, taking innocent blood upon your heads in wickedness.


    But I tell you that because of him your holy places will be laid waste to the ground. And no clean place will remain for you, but you will be among the nations of the earth for a curse and for scattering[b][a][a], until he himself visits again and shows compassion and receives you.'
translation:
  language: zh_hans
  text: '16 现在，我知道你们必在七十个七日之久偏离正道，并且亵渎祭司职分，玷污祭坛。2 你们必废弃律法，在邪恶的悖谬中藐视众先知的话。你们必迫害义人，憎恨敬虔的人，厌恶诚实之人的话。


    3 〔[a]你们必把一个靠至高者的能力更新律法的人称为迷惑人的；最后，你们会冲上去杀他，却不知道他的身量[b]，在恶意中把无辜者的血债归到自己头上。〕


    4 但我告诉你们：因他的缘故，你们的圣所必荒废，夷为平地。5 你们将没有洁净之地，反要在列国中成为受咒诅、被驱散的人，直到他亲自再次眷顾，施怜悯并接纳你们。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第3节的希腊文本艰涩，并显出文字讹乱或后期增补的迹象。本译文按所提供的文本见证收入正文，但其中若干措辞并不确定。
    reason: textual_variant
  - marker: b
    text: “身量”是ἀνάστημα的字面译法；在这里也可能指他的真实价值、身份或尊荣。
    reason: lexical_alternative
  - marker: c
    text: “他亲自再次眷顾”的主语可能是上帝，也可能是前面所说的那个人；希腊文没有明确限定。
    reason: alternative_reading
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: 七十个七日之久
  rationale: 保留ἑβδομάς的基本时间含义和启示文学式的周期表达，不擅自解释为年数。
- source_word: πλανηθήσεσθε
  choice: 偏离正道
  rationale: 兼顾道德上的走迷与被引入歧途的被动形式，同时符合现代汉语表达。
- source_word: ἱερωσύνην βεβηλώσετε
  choice: 亵渎祭司职分
  rationale: 保留祭祀语境和对神圣职分的侵犯，不将其缩窄为仅指某些祭司。
- source_word: τὰ θυσιαστήρια μιανεῖτε
  choice: 玷污祭坛
  rationale: 准确传达礼仪性污秽；复数在汉语类指表达中自然用“祭坛”。
- source_word: τὸν νόμον ἀθετήσετε
  choice: 废弃律法
  rationale: 表达拒绝、废置的力度，又避免引入后世有关律法失效的技术性神学含义。
- source_word: ἐν διαστροφῇ κακῇ
  choice: 心怀邪恶悖谬
  rationale: 保留邪恶和扭曲两层语义，使其自然地修饰藐视先知话语的行为。
- source_word: ἀληθινῶν λόγους βδελύξεσθε
  choice: 厌恶诚实之人的话
  rationale: 希腊文结构紧缩；此译保留ἀληθινῶν可能指诚实之人的理解，不径直改成抽象的“真理”。
- source_word: ἄνδρα καινοποιοῦντα νόμον
  choice: 一个……更新律法的人
  rationale: 贴近“使之成为新的”这一动词意义，避免以“改革家”等现代政治或宗派术语定性。
- source_word: ἐν δυνάμει ὑψίστου
  choice: 靠至高者的能力
  rationale: 明确自然地表达工具或凭借含义，并保留“至高者”这一神圣称号。
- source_word: τὸ ἀνάστημα
  choice: 他的身量
  rationale: 正文保留字面而含混的表达，脚注说明可指真实价值或尊荣。
- source_word: ἐπισκέψηται
  choice: 眷顾
  rationale: 在此语境兼有探访和施行关怀之意；“眷顾”符合庄重经文语体。
- source_word: προσδέξηται
  choice: 接纳
  rationale: 直接表达欢迎、接受之意，不额外补入和好或救赎等解释。
theological_decisions:
- issue: 第3节关于更新律法之人及其被杀的段落在所供希腊文本中有方括号，且文字疑有讹乱或后期扩充。
  choice: 将整段收入正文，按现有见证直译，并以脚注说明文本问题。
  alternative: 将该段视为次生材料而删去，或明确译成弥赛亚预言。
  rationale: 所给希腊见证确实包含此段；收入正文可忠实呈现来源，脚注则避免掩盖其文本不稳定性，也不以特定基督论解释预先定性。
- issue: 末句αὐτός“他亲自”的所指。
  choice: 正文仅译“他亲自”，不明定先行词。
  alternative: 明确译为“上帝亲自”，或明确指第3节所说的那个人。
  rationale: 希腊文语法没有强制限定所指；保留代词可维持原文的神学张力，脚注列出主要可能。
- issue: “无辜之人的血归到自己头上”的责任表述。
  choice: 保留血归到头上的古代责任意象。
  alternative: 意译为“承担杀害无辜者的罪责”。
  rationale: 直保留原文意象更能传达集体责任和罪责，同时不进一步界定其救赎论或群体历史含义。
