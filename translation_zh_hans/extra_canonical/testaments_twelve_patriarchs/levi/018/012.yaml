source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ὁ Βελίαρ δεθήσεται ὑπ᾿ αὐτοῦ, καὶ δώσει ἐξουσίαν τοῖς τέκνοις αὐτοῦ⁶⁹ πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/012.yaml
  text: And Beliar will be bound by him, and he will give authority to his children to trample on the evil spirits.
translation:
  language: zh_hans
  text: 彼列将被他捆绑；他也会赐给自己的儿女[a]权柄，使他们践踏那些邪灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据希腊文版本在“自己的儿女”之后有脚注标记69，但所提供的原文资料未包含该脚注的内容。
    reason: 如实保留所给底本中的编辑标记，同时不臆造缺失的校勘信息。
lexical_decisions:
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用该专名在中文圣经传统中通行的译法，保留其作为邪恶势力之名的性质。
- source_word: δεθήσεται
  choice: 将被……捆绑
  rationale: 准确表达将来时被动语态，不弱化受制伏的意象。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 此处指获授的支配或行动权力；“权柄”既符合宗教语境，也为现代读者所能理解。
- source_word: τοῖς τέκνοις αὐτοῦ
  choice: 自己的儿女
  rationale: 保留“他的儿女”这一亲属意象；用“自己的”自然指回本分句主语“他”，但不进一步判定其身份。
- source_word: πατεῖν ἐπὶ
  choice: 践踏
  rationale: 保留原文踩踏、制伏的强烈形象。
- source_word: τὰ πονηρὰ πνεύματα
  choice: 那些邪灵
  rationale: 以“邪灵”自然表达邪恶的灵体，并用“那些”体现希腊文定冠词所指向的特定群体。
theological_decisions:
- issue: 两处 αὐτοῦ 所指人物的身份
  choice: 均以“他／自己的”表达，不点明身份
  alternative: 将其明确译为“祭司”“弥赛亚”或其他特定人物
  rationale: 本节希腊文本仅使用代词，其所指须由上下文判断；译文保留这种指代关系，避免把解释写入正文。
- issue: “儿女”的含义
  choice: 保留亲属性称谓“儿女”
  alternative: 解释性译为“子民”“门徒”或“追随者”
  rationale: τέκνα 本义为儿女，原文可能含属灵或群体意义，但本节并未明说，因此不在翻译中消解其张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“彼列将被他捆绑”保留被动结构和代词的含混性；分号清楚呈现两个并列的将来事件。
