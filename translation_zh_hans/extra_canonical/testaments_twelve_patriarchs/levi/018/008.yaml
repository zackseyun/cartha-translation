source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Αὐτὸς γὰρ⁴⁵ δώσει τὴν μεγαλωσύνην⁴⁶ κυρίου⁴⁷ τοῖς υἱοῖς αὐτοῦ⁴⁸ ἐν ἀληθείᾳ εἰς τὸν αἰῶνα, καὶ οὐκ ἔσται διαδοχὴ⁴⁹ αὐτοῦ⁵⁰ εἰς γενεὰς *καὶ γενεὰς⁵¹ ἕως τοῦ αἰῶνος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/008.yaml
  text: For he will give the majesty of the Lord to his sons in truth forever, and there will be no succession to him for generations and generations, until eternity.
translation:
  language: zh_hans
  text: 因为他必确实将主的威荣赐给他的儿子们，直到永远；并且在世世代代、直到永世，他都不会有继任[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “继任”也可译作“接续”或“传承”。希腊语διαδοχή为名词；原文未说明所指为何种职分或地位。
    reason: 保留διαδοχή的名词性及其所指未明的范围，避免正文将其具体化为某人“接替”他。
lexical_decisions:
- source_word: μεγαλωσύνην κυρίου
  choice: 主的威荣
  rationale: μεγαλωσύνη表示崇高、威严与荣耀；“威荣”既保留其庄严语感，也自然表达属主的尊荣。
- source_word: ἐν ἀληθείᾳ
  choice: 真实地
  rationale: 保留“在真实中／确实”的语义范围；作状语可自然修饰“赐给”，不把它收窄为单纯的诚信品格。
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: 他的众子
  rationale: 忠实保留复数υἱοῖς及所属关系αὐτοῦ，不擅自解释为后裔、门徒或特定群体。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 以现代中文惯用表达传达持续至永远的时间意义。
- source_word: διαδοχὴ αὐτοῦ
  choice: 有人……接替他
  rationale: διαδοχή可指接续、继承或继任；中文采用动词结构较自然，并表达此人不会被后来者取代。
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: 世世代代
  rationale: 自然对应“世代又世代”，保留跨越连续多代的强调。
- source_word: ἕως τοῦ αἰῶνος
  choice: 直至永恒
  rationale: 较形式化地保留ἕως“直到”以及与前一句εἰς τὸν αἰῶνα略有区别的表达，避免简单重复“直到永远”。
theological_decisions:
- issue: “他”及“他的众子”的身份
  choice: 保留代词，不在正文中指明具体身份
  alternative: 按上下文明确写为祭司、弥赛亚或其后裔
  rationale: 本节希腊文本仅使用代词；为避免把某一解释直接写入译文，保留原文的指称方式。
- issue: διαδοχὴ αὐτοῦ所表达的永恒性
  choice: 译为不会有人接替他
  alternative: 译为“他的传承不会延续”或“他的继任不会存在”
  rationale: 上下文的否定最自然地表示他不被继任者取代；同时不增添“职分”“王位”或“祭司位”等原文未明说的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“威荣”“直至永恒”维持经文的崇高语体；句法尽量自然，同时保留原文两处永恒时间表达的细微差别。
