  text: Καὶ εὐφρανθήσεται κύριος ἐπὶ τοῖς τέκνοις αὐτοῦ⁷⁰, καὶ εὐδοκήσει⁷¹ ἐπὶ *τοῖς ἀγαπητοῖς⁷² αὐτοῦ *ἕως αἰῶνος⁷³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/013.yaml
  text: And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever.
translation:
  language: zh_hans
  text: 主必因他的儿女欢喜，也必永远以他所爱的人为喜悦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφρανθήσεται
  choice: 欢喜
  rationale: 表达因某人而喜乐，贴合其将来时及 ἐπί 所引出的缘由。
- source_word: τέκνοις
  choice: 儿女
  rationale: 兼顾性别，现代汉语自然地表达属主之子女。
- source_word: εὐδοκήσει
  choice: 喜爱
  rationale: 此处表示以某人为喜悦、乐意接纳；译作“喜爱”可与后面的“所爱的人”自然衔接，同时保留与前句“欢喜”的区别。
- source_word: ἀγαπητοῖς
  choice: 所爱的人
  rationale: 该形容词名词化，指蒙爱者；不限定其身份或群体。
- source_word: ἕως αἰῶνος
  choice: 永远
  rationale: 简洁传达持续到永世的时间含义。
theological_decisions:
- issue: “他的儿女”与“他所爱的人”是否指同一群体
  choice: 保留两个并列称谓，不加解释
  alternative: 将后者明确译为同一群体，如“这些蒙爱的儿女”
  rationale: 原文并列 τέκνοις αὐτοῦ 与 τοῖς ἀγαπητοῖς αὐτοῦ，可能同指一群人，也可能侧重不同；译文不主动消除这种张力。
- issue: εὐδοκέω 的神学语气
  choice: 译为“喜爱”
  alternative: 译为“悦纳”或“以……为喜悦”
  rationale: “悦纳”容易附加较强的祭祀或救恩论色彩；“喜爱”更直接，也符合此处对蒙爱者的情感性表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“因……而欢喜”清楚呈现 ἐπί 的关系；不添加原文没有的身份说明或教义解释。
