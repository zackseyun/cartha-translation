source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *δόξα ὑψίστου ἐπ’ αὐτὸν ῥηθήσεται⁴², καὶ πνεῦμα συνέσεως καὶ ἁγιασμοῦ⁴³ καταπαύσει *ἐπ’ αὐτόν⁴⁴ [ἐν τῷ ὕδατι].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/007.yaml
  text: And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him [in the water].
translation:
  language: zh_hans
  text: 至高者的荣耀必在他身上被宣告；悟性和圣化的灵必停驻在他身上[a]，〔在水中〕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “停驻”也可译作“安歇”或“停留”。
    reason: 说明καταπαύσει在此处的语义范围。
  - marker: b
    text: “在水中”在希腊文本中以方括号标出，表明其文本归属存疑。
    reason: 向读者交代原始版本所标示的文本不确定性。
lexical_decisions:
- source_word: δόξα ὑψίστου
  choice: 至高者的荣耀
  rationale: 直译属格结构，并保留“至高者”作为对上帝的尊称。
- source_word: ῥηθήσεται ἐπ’ αὐτὸν
  choice: 必被宣告在他身上
  rationale: 保留被动语态及ἐπί所表达的临到、指向关系；“宣告”比单纯“说”更符合庄重语境，同时不擅自明确宣告者。
- source_word: πνεῦμα συνέσεως
  choice: 悟性的灵
  rationale: σύνεσις指理解、领悟与洞察能力；“悟性”简洁自然，也保留其与“灵”的属格关系。
- source_word: ἁγιασμοῦ
  choice: 圣化
  rationale: 该词可指成圣、圣洁或分别为圣的过程；“圣化”保留过程性，不直接改写为状态性的“圣洁”。
- source_word: καταπαύσει ἐπ’ αὐτόν
  choice: 必停驻在他身上
  rationale: καταπαύω在此表达安歇、停留；“停驻”既保留持续临在之意，也避免译成使役意义。
theological_decisions:
- issue: 荣耀“被说在他身上”的含义
  choice: 译作“被宣告在他身上”
  alternative: “临到他身上”或“人必述说他有至高者的荣耀”
  rationale: 希腊文明确使用ῥηθήσεται的被动形式，而非单纯表示荣耀临到；因此保留言说/宣告含义及施事者未明的张力。
- issue: πνεῦμα是否特指圣灵
  choice: 译作“悟性和圣化的灵”
  alternative: “赐人悟性和圣洁的圣灵”
  rationale: 原文没有明确冠词或“圣”作为πνεῦμα的直接修饰语；不应把它直接定名为“圣灵”，也不把属格关系解释成明确的施予功能。
- issue: ἐν τῷ ὕδατι的文本地位
  choice: 正文保留并用方括号标示
  alternative: 无括号纳入正文或完全省略
  rationale: 来源文本本身以方括号标出该短语，显示其文本存疑；译文应保持这一不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以分号呈现两个并列的未来陈述。保留被动表达、两次“在他身上”的重复以及存疑短语的方括号，不以解释性措辞消除原文的歧义。
