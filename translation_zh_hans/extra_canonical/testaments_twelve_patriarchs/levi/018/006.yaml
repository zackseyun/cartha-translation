base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/006.yaml
  text: The heavens will be opened, and from the temple of glory holiness will come upon him with a fatherly voice, as from Abraham to Isaac.
translation:
  language: zh_hans
  text: 诸天将要敞开；圣洁将从荣耀的殿中临到他身上，伴随着父亲般的声音，如同从亚伯拉罕向以撒所发的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὐρανοὶ
  choice: 诸天
  rationale: 保留希腊文复数形式，同时采用庄重而易懂的现代汉语表达。
- source_word: ἀνοιγήσονται
  choice: 将要敞开
  rationale: 准确表达将来时被动态，并保持天象展开的形象。
- source_word: ἐκ τοῦ ναοῦ τῆς δόξης
  choice: 从荣耀的殿中
  rationale: 依照原文属格结构直译，不擅自把“荣耀”解释为殿的拥有者或特定神学称谓。
- source_word: ἁγίασμα
  choice: 圣洁
  rationale: 此中性名词可指圣洁、圣物或使人成圣之物；上下文将其描写为临到某人，译作“圣洁”较自然，也保留抽象含义，避免过度解释为一个明确的成圣过程。
- source_word: φωνῆς πατρικῆς
  choice: 父亲般的声音
  rationale: πατρικός表示父亲的、父亲般的；此译保留性质描述，不直接增补“上帝”的身份判定。
- source_word: ὡς ἀπὸ Ἀβραὰμ πρὸς Ἰσαάκ
  choice: 如同从亚伯拉罕向以撒所发的声音
  rationale: 补出汉语所需的“所发的声音”，清楚呈现声音由亚伯拉罕向以撒发出，同时保留ὡς的类比性质。
theological_decisions:
- issue: “父亲般的声音”的身份
  choice: 不明确指认为上帝之声，而保留“父亲般”的描述
  alternative: 译作“天父的声音”
  rationale: 原文只有φωνῆς πατρικῆς，没有明确出现“上帝”或“天父”；增补身份会消除原文的开放性。
- issue: ἁγίασμα是“圣洁”还是“成圣”
  choice: 圣洁
  alternative: 成圣／使人成圣的能力
  rationale: 原文名词本身容许一定语义幅度；“圣洁”既符合句法，也避免把它限定为过程或能力。
- issue: 亚伯拉罕与以撒的类比关系
  choice: 将其理解为对“父亲般的声音”的类比，但不说明具体对应哪段事件
  alternative: 明确解释为亚伯拉罕祝福、呼唤或献以撒时的声音
  rationale: 原文没有说明所指事件，故不应补入具体叙事解释。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“诸天”保留原文复数和古代宗教文本的语感；后半句通过补出“所发的声音”避免汉语歧义，但不增添原文未明说的神学身份或事件背景。
