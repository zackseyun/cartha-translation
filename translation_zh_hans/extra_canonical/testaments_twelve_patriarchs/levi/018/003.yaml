source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνατελεῖ¹³ ἄστρον αὐτοῦ¹⁴ ἐν οὐρανῷ ὡς βασιλέως¹⁵ φωτίζων¹⁶ φῶς γνώσεως †ἐν ἡλίῳ ἡμέρα†¹⁷, καὶ μεγαλυνθήσεται ἐν τῇ οἰκουμένῃ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/003.yaml
  text: And his star will rise in heaven like a king, giving the light of knowledge like the sun by day, and he will be magnified in the inhabited world.
translation:
  language: zh_hans
  text: 他的星必在天上升起，如君王一般，像白昼的太阳一样发出知识之光[a]；他必在普天下受尊崇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像白昼的太阳一样”所在的希腊文有讹误，原句字面近似“在太阳中，白昼”；本译文依上下文理解为星发出知识之光，如白昼的太阳一般。
    reason: 底本以 † 标明 ἐν ἡλίῳ ἡμέρα 文本损坏；译文须提示其不确定性，避免把修复性理解当作毫无疑问的原文。
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: 升起
  rationale: 用于星辰出现或升起，自然传达将来时态，也保留其显现意象。
- source_word: ἄστρον αὐτοῦ
  choice: 他的星
  rationale: 按希腊文保留所有格关系及星的象征性，不进一步解释其所指。
- source_word: ὡς βασιλέως
  choice: 如同君王
  rationale: 原文属格结构不寻常，但基本比较意明确；译文保留‘星’与‘君王’之间可能略显突兀的比拟，不擅自改作‘君王之星’。
- source_word: φῶς γνώσεως
  choice: 知识之光
  rationale: 兼顾原文名词结构和现代汉语的庄重表达。
- source_word: ἐν τῇ οἰκουμένῃ
  choice: 在普天下
  rationale: οἰκουμένη 指有人居住的世界；‘普天下’在中文中自然且符合宏阔语境。
- source_word: μεγαλυνθήσεται
  choice: 受尊崇
  rationale: 被动式可表示被尊为大、受颂扬；‘受尊崇’比直译‘被尊为大’更自然，同时不明确施事者。
theological_decisions:
- issue: ‘他的星’与所指人物的关系
  choice: 保留‘他的星’，不说明星是否等同、象征或宣告该人物
  alternative: 译作‘属于他的那颗星’或将星直接解释为弥赛亚象征
  rationale: 原文只给出所有格，未明说象征关系；应保留神学和意象上的开放性。
- issue: μεγαλυνθήσεται 的含义
  choice: 译为‘受尊崇’
  alternative: ‘被高举’或‘声名远扬’
  rationale: ‘受尊崇’保留被动与尊荣含义，不额外加入升天式的‘高举’概念，也不缩减为纯粹名声。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号区分星发光与人物受尊崇两个并列预言。保留‘他的星’‘知识之光’等核心意象，并以脚注公开底本文本讹误及译法依据。
