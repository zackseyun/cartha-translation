  text: And after their vengeance has come from the Lord, the priesthood will fail.
translation:
  language: zh_hans
  text: 他们的报应从主那里临到之后[a]，祭司职分将消失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的报应”也可指对他们的惩罚、他们所遭受的报复，或为他们施行的伸冤；原文未明确属格所指的方向。
    reason: 保留ἐκδίκησιν αὐτῶν的语义范围及αὐτῶν与“报应／伸冤”之间关系的歧义。
lexical_decisions:
- source_word: ἐκδίκησιν αὐτῶν
  choice: 给他们的报应
  rationale: ἐκδίκησις可指报应、惩罚，也可指伸冤；属格αὐτῶν本身没有明确说明行动是针对他们还是为他们而行。正文采用较中性的“给他们的报应”，并以脚注保留另一种可能。
- source_word: παρὰ κυρίου
  choice: 主所赐
  rationale: παρά加属格表示来源，即这报应来自主；“主所赐”在中文中自然表达其来源，同时不增添具体施行方式。
- source_word: ἐκλείψει
  choice: 将止息
  rationale: 该动词表示衰竭、消失或终止；这里以“止息”表达祭司职分不再持续，而不额外断定是暂时衰败还是永久废除。
- source_word: ἡ ἱερωσύνη
  choice: 祭司职分
  rationale: ἱερωσύνη指祭司身份、职任或祭司体系；“祭司职分”准确且适合庄重的现代汉语。
theological_decisions:
- issue: “他们的报应”是惩罚他们，还是为他们伸冤
  choice: 正文用“给他们的报应”，不明确限定方向
  alternative: “主惩罚他们之后”或“主为他们伸冤之后”
  rationale: 希腊语ἐκδίκησιν αὐτῶν存在语义和属格关系上的张力；不应在正文中无依据地排除其中一种理解。
- issue: 祭司职分的终止程度
  choice: “将止息”
  alternative: “将衰微”或“将彻底废除”
  rationale: ἐκλείψει可涵盖衰竭直至消失，原文没有明确说明持续时间或神学制度上的最终状态，故避免过度界定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“临到之后……将止息”保持原句的时间推进关系；避免使用宗派化术语，也不把原文含混之处强行解释为某一种末世论或祭司制度观点。
