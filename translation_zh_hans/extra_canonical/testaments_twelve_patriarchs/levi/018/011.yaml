source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δώσει τοῖς ἁγίοις φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, καὶ *πνεῦμα ἁγιωσύνης ἔσται⁶⁷ ἐπ᾿ αὐτοῖς⁶⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/011.yaml
  text: And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them.
translation:
  language: zh_hans
  text: 他要把生命树上的果子赐给众圣者吃，圣洁之灵也必临在他们身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς ἁγίοις
  choice: 众圣者
  rationale: 保留名词化复数所指的群体身份；“圣者”较“圣徒”少一些后世宗派色彩，“众”自然表达复数。
- source_word: φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: 吃生命树上的果子
  rationale: 希腊文直译为“从生命树吃”；现代汉语需补出语义隐含的“果子”，以免被理解为吃树木本身。
- source_word: πνεῦμα ἁγιωσύνης
  choice: 圣洁之灵
  rationale: 按属格结构译出“圣洁”，不直接规范化为专名“圣灵”，从而保留原文措辞及其可能的语义张力。
- source_word: ἔσται ἐπ᾿ αὐτοῖς
  choice: 必临在他们身上
  rationale: “临在……身上”自然传达ἐπί加宾格在此表示覆临、停驻的意象，也保留将来时。
theological_decisions:
- issue: πνεῦμα ἁγιωσύνης是否应译作专名“圣灵”
  choice: 圣洁之灵
  alternative: 圣灵
  rationale: 原文使用“圣洁之灵”的属格表达，而非更常见的直接形容词形式；不将其自动等同并规范化为后来的专名，以保存文本本身的开放性。
- issue: 生命树所赐食物的表达
  choice: 生命树上的果子
  alternative: 从生命树上吃
  rationale: 补出“果子”是汉语中的语义明示，不意在增加特定圣礼或末世论解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他”沿用本节上下文中的单数施事者；句子保持两个并列的未来行动。原文校勘符号⁶⁷、⁶⁸未附异文内容，故不设置无法说明的脚注。
