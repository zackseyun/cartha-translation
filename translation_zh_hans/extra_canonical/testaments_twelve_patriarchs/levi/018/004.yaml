base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/004.yaml
  text: He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth.
translation:
  language: zh_hans
  text: 他要如太阳一般照耀大地，除去普天之下的一切黑暗；全地必有和平。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: 照耀
  rationale: 该动词意为发光、照耀；结合“如太阳一般”的明喻，译为“照耀”自然且准确。
- source_word: ὡς ὁ ἥλιος
  choice: 如太阳一般
  rationale: 保留原文明确的明喻关系，并采用现代汉语庄重而易懂的表达。
- source_word: ἐν τῇ γῇ
  choice: 大地
  rationale: 介词短语在此说明光辉所临到的范围；“照耀大地”比机械地译作“在地上照耀”更符合汉语习惯。
- source_word: ἐξαρεῖ
  choice: 除去
  rationale: 表达移除、清除之意，不额外限定黑暗是物质、道德或属灵意义，以保留原文张力。
- source_word: ἐκ τῆς ὑπ᾽ οὐρανὸν
  choice: 普天之下
  rationale: 对应“从天以下”，以惯用汉语表达其普遍范围，同时不改变原义。
- source_word: εἰρήνη
  choice: 和平
  rationale: 该词可指和平、安宁；此处涉及全地的普遍状态，“和平”最直接，也保留广泛含义。
theological_decisions:
- issue: “黑暗”的含义
  choice: 保留为“一切黑暗”
  alternative: 解释为罪恶、无知或邪恶势力
  rationale: 原文未明确界定所指，不应在正文中将其限定为某一种神学解释。
- issue: 主语“他”的身份
  choice: 仅译作“他”
  alternative: 在译文中补明为祭司、弥赛亚或君王
  rationale: 本节希腊文只使用指示代词承接上文；为避免把上下文解释直接写入正文，保留代词。
- issue: 末句的时态与语气
  choice: 全地必有和平
  alternative: 全地将有和平／全地就有和平
  rationale: 希腊文使用将来时；“必有”兼顾将来指向与宣告语气，但不额外说明实现方式。
translation_notes:
  register: 采用现代、庄重、简洁的标准普通话。句式保留原文由三个并列未来事件组成的推进结构；以分号连接结果性末句，使朗读清楚自然。
