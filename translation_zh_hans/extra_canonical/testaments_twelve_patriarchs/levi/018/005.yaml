source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οἱ οὐρανοὶ ἀγαλλιάσονται²⁴ ἐν ταῖς ἡμέραις αὐτοῦ²⁵, καὶ ἡ γῆ χαρήσεται²⁶, καὶ αἱ²⁷ †νεφέλαι²⁸ εὐφρανθήσονται²⁹. [καὶ ἡ γνῶσις κυρίου³⁰ ἐκχυθήσεται³¹ ἐπὶ τῆς γῆς ὡς³² ὕδωρ θαλασσῶν³³] *καὶ οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου εὐφρανθήσονται ἐν αὐτῷ³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/005.yaml
  text: The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; [and the knowledge of the Lord will be poured out upon the earth like the water of the seas;] and the angels of the glory of the Lord's presence will be glad in him.
translation:
  language: zh_hans
  text: 在他的日子里，诸天必欢腾，大地必喜乐，云彩也必欢欣[a]；[对主的认识必如海水一般倾注在地上；][b]主临在的荣耀天使们也必在他里面欢喜。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “云彩”依现存希腊文本；校勘本以匕首号标出这个词，表示文本可能有讹误。
    reason: 让读者看见源文本对νεφέλαι的校勘疑问，而不在正文中猜测原词。
  - marker: b
    text: “对主的认识……地上”在所据希腊校勘本中置于方括号内，表示这段文字的原始性存在疑问。
    reason: 保留原始资料明确显示的文本层次与不确定性。
  - marker: c
    text: 校勘本以星号标示本句；由于所给资料未附完整异文说明，正文保留本句，同时注明其文本状态受到特别标记。
    reason: 如实反映源文本中的校勘符号，不凭不足的资料断定其具体异文性质。
lexical_decisions:
- source_word: ἀγαλλιάσονται / χαρήσεται / εὐφρανθήσονται
  choice: 欢腾／喜乐／欢欣（欢喜）
  rationale: 用相近而不完全相同的现代汉语词语，再现原文数个喜乐动词的变化，同时保持诗体的平行结构。
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: 在他的日子
  rationale: 保留原文指向某位男性人物的表达，不把“他的日子”解释性改写为“他掌权的时候”等更具体含义。
- source_word: νεφέλαι
  choice: 云彩
  rationale: 这是现存希腊文本的直接词义；因校勘本以匕首号标示此处可能讹误，另以脚注说明。
- source_word: ἡ γνῶσις κυρίου
  choice: 主的知识
  rationale: 既可指关于主的认识，也可保留“属于主的知识”这一属格张力；不擅自限定为其中一种。
- source_word: ἐκχυθήσεται
  choice: 倾注
  rationale: 保留“被倒出、浇灌”的强烈意象，并与知识遍满大地的图景自然衔接。
- source_word: ὡς ὕδωρ θαλασσῶν
  choice: 如海水一般
  rationale: 贴近原文复数“众海之水”的集合性意象，同时采用自然的现代汉语表达。
- source_word: οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου
  choice: 主临在之荣耀的众天使
  rationale: πρόσωπον直译为“面”，在此也可表达主的面前或临在；译作“临在”使汉语可读，同时保留“荣耀”与“主的临在”之间的属格关系，不增添天使职分。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留介词短语可能表示联合、范围或因由的含混性，不直接改译为“因他”或“以他为乐”。
theological_decisions:
- issue: “主的知识”的主客体属格
  choice: 主的知识
  alternative: 对主的认识
  rationale: 原文属格可容纳不止一种理解，正文不把它单一化为人对主的认识。
- issue: 天使“在他里面”欢喜的关系
  choice: 在他里面欢喜
  alternative: 因他欢喜
  rationale: 较形式化地保留ἐν αὐτῷ，避免预先裁定这是原因、对象还是联合关系。
- issue: “主的面”所表达的神学意象
  choice: 主临在
  alternative: 主的面容／主面前
  rationale: “临在”能传达圣经语境中“主的面”所表示的亲临，又不把它解释成具象身体描写。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语，以“诸天—大地—云彩”的平行句式保留颂歌色彩。对有校勘符号的词句不暗中修补；方括号内容收入正文并以脚注交代。用“在他里面”保留原文神学张力，整体避免宗派化阐释。
