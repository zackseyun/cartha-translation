base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/002.yaml
  text: Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute true judgment upon the earth for many days.
translation:
  language: zh_hans
  text: 那时，主必兴起一位新的祭司；主的一切话都必向他显明。他必在地上施行真实的审判，多日如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερεῖ
  choice: 兴起
  rationale: 在主设立并使某人承担使命的语境中，“兴起”既保留原文的主动意味，也符合现代中文宗教文体。
- source_word: ἱερέα καινόν
  choice: 一位新的祭司
  rationale: 直译名词与形容词，不将“新的”解释为继任、更新或末世性的特定教义概念。
- source_word: ἀποκαλυφθήσονται
  choice: 都必向他显明
  rationale: 保留被动语态所表达的领受启示之意，同时用自然中文呈现。
- source_word: κρίσιν ἀληθείας
  choice: 真实的审判
  rationale: 属格结构可表达审判以真实为性质或准则；译作“真实的审判”既自然，也不额外限定为司法裁决、公义治理或某一神学术语。
- source_word: ἐν πλήθει ἡμερῶν
  choice: 历时多日
  rationale: 表达行动持续许多日子的时间范围，较“在许多日子中”更符合现代汉语。
theological_decisions:
- issue: “新祭司”的身份
  choice: 保留为“一位新的祭司”
  alternative: 明确译作弥赛亚、大祭司或某一历史人物
  rationale: 本句本身没有明说其具体身份，故不以译文替文本作身份判定。
- issue: κρίσιν ἀληθείας 的含义
  choice: 译为“真实的审判”
  alternative: “公义的审判”或“按真理施行审判”
  rationale: “公义”可能把ἀλήθεια的“真实／真理”含义收窄；“按真理”则明确了原文属格关系中未完全限定的方式含义。译文保留其语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必”对应预言性的将来语气；分为两句以避免欧化长句。“秉公”用于自然承接“施行审判”，但核心短语仍明确译出为“真实的审判”。
