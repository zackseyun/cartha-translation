source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Τοτὲ ἀγαλλιάσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ, κἀγὼ χαρήσομαι⁷⁴, καὶ πάντες οἱ ἅγιοι ἐνδύσονται⁷⁵ δικαιοσύνην⁷⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/014.yaml
  text: Then Abraham and Isaac and Jacob will exult, and I will rejoice, and all the holy ones will put on righteousness.
translation:
  language: zh_hans
  text: 那时，亚伯拉罕、以撒和雅各必欢欣，我也必喜乐；所有圣者都必披上公义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 自然表达时间推进，并保留原文的末世性时序语气。
- source_word: ἀγαλλιάσεται
  choice: 必欢欣
  rationale: 表达强烈、昂扬的喜悦，并与后面的 χαρήσομαι 在措辞上有所区分。
- source_word: χαρήσομαι
  choice: 必喜乐
  rationale: 贴近“欢喜、喜乐”的基本含义，同时保持庄重语体。
- source_word: οἱ ἅγιοι
  choice: 圣者
  rationale: 保留 substantival adjective 的群体指称，不额外限定为某一类天上或地上的存在。
- source_word: ἐνδύσονται δικαιοσύνην
  choice: 必披上公义
  rationale: 保留原文“穿上”的衣饰隐喻；“公义”兼顾道德正直与神学语境中的义。
theological_decisions:
- issue: “所有圣者”的身份
  choice: 不具体界定，译作“所有圣者”
  alternative: 众圣徒／所有圣洁的人
  rationale: 原文 πάντες οἱ ἅγιοι 本身未明确说明是人、天使，还是更广义的圣者群体；译文保留这一开放性。
- issue: “披上公义”的含义
  choice: 保留衣饰隐喻
  alternative: 成为公义／得着公义
  rationale: 直译可保存原文的形象及其可能包含的身份、品格和蒙赋予状态等多重意涵，避免替文本作神学定论。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“欢欣”与“喜乐”对应两个相近但不同的希腊动词；分号使两组喜乐陈述与末句的群体性图景层次清晰。
