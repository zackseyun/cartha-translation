reference: Testament of Levi 18:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐπὶ *τῆς ἱερωσύνης⁵² αὐτοῦ⁵³ *τὰ ἔθνη⁵⁴ πληθυνθήσονται⁵⁵ ἐν γνώσει ἐπὶ τῆς γῆς, καὶ φωτισθήσονται διὰ χάριτος κυρίου. [ὁ δὲ Ἰσραὴλ ἐλαττωθήσεται ἐν ἀγνωσίᾳ καὶ σκοτισθήσεται ἐν πένθει]⁵⁶. ἐπὶ τῆς ἱερωσύνης αὐτοῦ ἐκλείψει⁵⁷ ἡ⁵⁸ ἁμαρτία καὶ οἱ ἄνομοι *καταπαύσουσιν εἰς κακά⁵⁹, [οἱ δὲ δίκαιοι καταπαύσουσιν ἐν αὐτῷ]⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/009.yaml
  text: And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. [But Israel will be diminished in ignorance and darkened in mourning.] During his priesthood sin will cease, and the lawless will cease from evil; [and the righteous will rest in him].
translation:
  language: zh_hans
  text: 在他的祭司职任期间，在地上，列国必在知识上增多[a]，并要因主的恩典而蒙光照。〔但以色列必在无知中衰微，在哀恸中陷入黑暗。〕[b] 在他的祭司职任期间，罪必止息，不法之人也必停止作恶；〔义人却必在他里面得安息。〕[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“列国必在知识（或认识）中增多”。“知识／认识”的对象没有明说。
    reason: 保留γνώσει未指明对象的语义开放性，并说明译法。
  - marker: b
    text: “但以色列必在无知中衰微，在哀恸中陷入黑暗”在所据版本中置于方括号内，表明这句话的文本归属存疑。
    reason: 传达底本的文本批判标记。
  - marker: c
    text: “义人却必在他里面得安息”在所据版本中置于方括号内，表明这句话的文本归属存疑。“他”原文所指未进一步说明。
    reason: 传达文本不确定性，并保留代词指向的开放性。
lexical_decisions:
- source_word: ἐπὶ τῆς ἱερωσύνης αὐτοῦ
  choice: 在他担任祭司期间
  rationale: ἐπί加属格在此表示一段任职时期；这样表达既保留“他的祭司职分”之意，也比直译“在他的祭司职分之上”自然。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 此词可指“各国”或“外族人”；“列国”保留其群体与民族层面的含义，也避免过早限定为特定神学术语。
- source_word: πληθυνθήσονται ἐν γνώσει
  choice: 对上帝的认识必日益增长
  rationale: 字面结构是“在知识中增多”；按语境理解为列国在认识上增长。补出“上帝”使汉语所指清楚，但以脚注说明原文仅作“认识/知识”。
- source_word: φωτισθήσονται
  choice: 蒙光照
  rationale: 保留被动语态和宗教性光明意象，不将其具体化为某种单一的启示或救恩理论。
- source_word: ἐκλείψει ἡ ἁμαρτία
  choice: 罪必止息
  rationale: ἐκλείπω可指消失、止息或衰竭；“止息”在此自然，并与后文“停止作恶”形成呼应。
- source_word: οἱ ἄνομοι καταπαύσουσιν εἰς κακά
  choice: 不法之人也必停止作恶
  rationale: 原文介词结构不寻常，但基本意思是恶人不再趋向或从事恶事；采用自然汉语，同时不扩展为他们本身被消灭。
- source_word: καταπαύσουσιν ἐν αὐτῷ
  choice: 必在他里面得安息
  rationale: 保留ἐν αὐτῷ的“在他里面”和καταπαύω的安息含义，不把“他”解释为主、祭司或弥赛亚中的某一特定身份。
theological_decisions:
- issue: “认识”的对象
  choice: 正文译作“对上帝的认识”，并用脚注交代原文字面
  alternative: “在知识上增多”或“在认识上增长”
  rationale: 上下文中的“主的恩典”使神学性认识很可能是所指；但原文没有明说对象，因此以脚注保留形式上的含混。
- issue: “在他里面”的指代
  choice: 保留代词“他”，不作身份解释
  alternative: 译成“在这位祭司里面”或“在主里面”
  rationale: 希腊文只给出阳性单数代词，近距离可回指该祭司，但不宜在正文中排除更广的神学指向。
- issue: 方括号段落的文本地位
  choice: 以中文方头括号保留，并分别加文本脚注
  alternative: 无标记纳入正文或删除
  rationale: 来源版本将两段置于方括号，表示其文本见证或原始性存疑；译文应让读者看见这一不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“担任祭司期间”避免生硬的名词堆叠；“列国、蒙光照、止息、得安息”保留经文语体及原文意象。正文中的〔〕对应底本方括号，所有脚注标记均已置于正文。
