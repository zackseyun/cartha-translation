  to: 在他的祭司职任期间，在地上，列国必在知识上增多[a]，并要因主的恩典而蒙光照。〔但以色列必在无知中衰微，在哀恸中陷入黑暗。〕[b] 在他的祭司职任期间，罪必止息，不法之人也必停止作恶；〔义人却必在他里面得安息。〕[c]
