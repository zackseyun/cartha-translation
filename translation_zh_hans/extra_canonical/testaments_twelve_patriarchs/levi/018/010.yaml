  text: Καίγε⁶¹ αὐτὸς⁶² ἀνοίξει τὰς θύρας⁶³ τοῦ παραδείσου, *καὶ ἀποστήσει⁶⁴ τὴν ἀπειλοῦσαν ῥομφαίαν⁶⁵ κατὰ τοῦ⁶⁶ Ἀδάμ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/010.yaml
  text: And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam.
translation:
  language: zh_hans
  text: 他确实会打开乐园的门，并移开那把威吓亚当的利剑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: 也
  rationale: Καίγε兼有连接和强调作用；中文以“也”承接上下文，避免生硬地译成“而且确实”。
- source_word: τὰς θύρας τοῦ παραδείσου
  choice: 乐园的门
  rationale: θύρας为复数，但现代汉语“门”本身不必标明单复数；“乐园”准确保留παράδεισος在此处的伊甸园意象。
- source_word: ἀποστήσει
  choice: 移开
  rationale: 该动词表示使某物离开或撤去；“移开”自然地表达将剑从原有位置挪走。
- source_word: τὴν ἀπειλοῦσαν ῥομφαίαν
  choice: 那把威吓……的利剑
  rationale: 保留分词ἀπειλοῦσαν的主动威胁意味；ῥομφαία指大型刀剑，译作“利剑”符合庄重叙事语体。
- source_word: κατὰ τοῦ Ἀδάμ
  choice: 威吓亚当
  rationale: κατά加属格在此表示针对、敌对的方向，与ἀπειλοῦσαν合译为“威吓亚当”，避免不自然的“针对亚当的威吓之剑”。
theological_decisions:
- issue: 利剑与亚当的关系
  choice: 那把威吓亚当的利剑
  alternative: 那把指向亚当的利剑
  rationale: 原文ἀπειλοῦσαν明确含“威吓、威胁”之意，而κατὰ τοῦ Ἀδάμ表明对象是亚当；译文不进一步断定此剑的身份或具体功能。
translation_notes:
  register: 采用自然、庄重的现代标准汉语；句式简洁，并保留原文关于乐园、亚当和利剑的意象及其神学张力。
