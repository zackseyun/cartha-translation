lexical_decisions:
- source_word: ἐπέπεσέν με ὕπνος
  choice: 我沉沉睡去
  rationale: 原文直译为“睡眠临到/落在我身上”；采用自然的现代汉语表达，同时保留睡眠突然临到的意味。
- source_word: ἐθεασάμην
  choice: 看见
  rationale: 表示亲眼观看、看见；此处叙述异象经历，“看见”简洁自然，且不额外明定异象的性质。
- source_word: ὄρος ὑψηλόν
  choice: 一座高山
  rationale: 准确对应不定的一座高耸之山，符合现代汉语量词习惯。
- source_word: ἤμην ἐν αὐτῷ
  choice: 我就在山上
  rationale: ἐν αὐτῷ字面可指“在其中/在其上”；用于山时汉语自然表达为“在山上”，并以“就”传达叙述中所见位置的直接性。
