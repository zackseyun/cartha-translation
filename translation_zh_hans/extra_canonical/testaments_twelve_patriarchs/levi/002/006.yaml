  text: Καὶ ἰδοὺ ἀνεῴχθησαν³³ οἱ οὐρανοί*, καὶ ἄγγελος Κυρίου³⁴ εἶπε *πρός με³⁵· *Λευί, ⌈Λευί⌉³⁶, εἴσελθε.
