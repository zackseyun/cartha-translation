base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/006.yaml
  text: And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi, enter.”
translation:
  language: zh_hans
  text: 看哪，诸天开了，一位主的天使对我说：“利未，利未，进去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意、标示异象突现的语气，同时采用庄重而易懂的传统表达。
- source_word: οἱ οὐρανοί
  choice: 诸天
  rationale: 希腊文为复数，译作“诸天”以保留原文数的形式及其宇宙层次感。
- source_word: ἄγγελος Κυρίου
  choice: 主的一位天使
  rationale: 原文无定冠词；用“一位”自然表达非特指语感，又不把它误解为“主的使者”这一可能带特定身份暗示的固定称谓。
- source_word: εἴσελθε
  choice: 进来
  rationale: 这是进入的单数命令式；在诸天开启并向说话者发出召唤的场景中，“进来”比单纯“进入”更自然。
theological_decisions:
- issue: “诸天”单复数及其异象含义
  choice: 保留复数“诸天”
  alternative: 译作单数“天”或“天空”
  rationale: 原文明确使用复数；不将其简化为可见天空，也不进一步解释诸天的层数或结构。
- issue: ἄγγελος Κυρίου的身份
  choice: 译作“主的一位天使”
  alternative: “主的使者”或“主的天使”
  rationale: 保持其为属主的天使这一直接意义，不把该天使与主本人等同，也不引入特定神学身份。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事体。“看哪”保留异象文体；重复呼名“利未，利未”严格照原文呈现。
