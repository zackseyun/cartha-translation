base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/002.yaml
  text: And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor.
translation:
  language: zh_hans
  text: 那时我还年轻，约二十岁；那时我和西缅一起向哈抹报复，为我们的姊妹底拿雪恨。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεώτερος
  choice: 还年轻
  rationale: 表达比较年轻或尚属年轻的状态，符合现代汉语自然用法；原文并未明确与谁比较。
- source_word: ὡς ἐτῶν εἴκοσι
  choice: 约二十岁
  rationale: ὡς 在年龄表述中表示约数。
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: 报复……雪恨
  rationale: 该短语直指实施报复；结合后接的受益或缘由成分，用“向……报复，为……雪恨”清楚保留其行动及动机。
- source_word: μετὰ Συμεὼν
  choice: 和西缅一起
  rationale: μετά 加属格表示陪同、共同参与。
- source_word: τῆς ἀδελφῆς ἡμῶν Δείνας
  choice: 为我们的妹妹底拿
  rationale: 该属格与“报复”构成缘由或关涉关系；“妹妹”符合叙事中的亲属关系，也比笼统的“姊妹”更自然。
- source_word: ἀπὸ Ἐμμώρ
  choice: 向哈抹
  rationale: ἀπό 在报复语境中标明报复所针对或取偿的对象；译作“向……报复”符合现代汉语。
theological_decisions:
- issue: 对报复行为的道德评价
  choice: 按叙述者原话陈述为“报复……雪恨”
  alternative: 改写为“伸张正义”或加入谴责性措辞
  rationale: 原文只陈述行动，没有在本节明确判定其正当或邪恶，因此不额外美化或谴责。
- issue: 底拿与哈抹之间关系的句法含义
  choice: 理解为因底拿之事而以哈抹为报复对象
  alternative: 将ἀπό解释为底拿被哈抹夺走或释放
  rationale: ἐκδίκησις 与 ἀπό 的搭配及上下文支持报复对象的理解，但不增补原文未明说的事件细节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用分号整理较长的并列结构，使年龄背景与随后行动层次清晰；人名采用常见中文圣经译名“西缅、底拿、哈抹”。
