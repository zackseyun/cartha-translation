source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὡς δὲ ἐποίμαινον¹⁸ ἐν Ἀβελμαούλ¹⁹, πνεῦμα συνέσεως Κυρίου ἦλθεν ἐπʼ ἐμέ²⁰, καὶ *ἐθεώρουν πάντας ἀνθρώπους²¹ *ἀφανίσαντας τὴν ὁδὸν αὐτῶν²², καὶ *ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία καὶ ἐπὶ πύργους ἡ ἀδικία ἐκάθητο²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/003.yaml
  text: And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers.
translation:
  language: zh_hans
  text: 我在亚伯玛乌放牧的时候，有从主而来的悟性之灵临到我；我看见所有人都毁坏了自己的道路，罪恶正被建造在一面城墙上，不义坐在众塔之上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινον
  choice: 放牧
  rationale: 准确表达牧放牲畜的动作，也符合利未叙事的生活场景。
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: 从主而来的悟性之灵
  rationale: 将 Κυρίου 理解为来源关系，与英语审校层一致；“悟性”保留 σύνεσις 所指的理解、洞察能力。
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: 毁坏自己的道路
  rationale: ἀφανίζω 在此有毁灭、败坏之义；采用“毁坏”以保留其较强力度，同时不把比喻性的“道路”解释为“生活方式”。
- source_word: ἐπὶ τείχους
  choice: 在城墙上
  rationale: τεῖχος 通常指城墙；保留异象中具体而不寻常的空间意象。
- source_word: ἐπὶ πύργους
  choice: 在众塔之上
  rationale: πύργους 为复数；“众塔”自然地体现复数，并保留异象意象。
theological_decisions:
- issue: πνεῦμα 是否应明确为圣灵
  choice: 悟性之灵
  alternative: 赐悟性的圣灵
  rationale: 原文只说 πνεῦμα συνέσεως，未明确使用“圣”字；不加入超出文本的位格化或教义性限定。
- issue: 罪恶与不义的拟人化意象
  choice: 罪恶在城墙上不断建造，不义坐在众塔之上
  alternative: 人在城墙上筑起罪恶，不义占据了高塔
  rationale: 保留原文被动结构和拟人化张力，不补出施事者，也不将异象改写成解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“不断建造”传达未完成过去时 οἰκοδομεῖτο 的持续过程；“坐”直译 ἐκάθητο，保留异象的突兀感。专名 Ἀβελμαούλ 音译为“亚伯玛乌”。
