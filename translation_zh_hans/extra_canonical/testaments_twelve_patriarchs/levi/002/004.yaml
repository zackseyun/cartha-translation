  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/004.yaml
  text: And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved.
translation:
  language: zh_hans
  text: 我为人类悲伤，就向主祷告，求他使我得救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤμην λυπούμενος
  choice: 我……悲伤
  rationale: 以持续性状态表达迂回未完成时，中文无需机械译出“正在”。
- source_word: ὑπὲρ γένους τῶν υἱῶν τῶν ἀνθρώπων
  choice: 为人类
  rationale: 此处意为因世人的族类而忧伤；“人类”自然传达 γένος 与闪语式“人的众子”的整体含义，同时保留介词 ὑπέρ 所含的关切意味。
- source_word: ηὐξάμην τῷ Κυρίῳ
  choice: 向主祷告
  rationale: 准确表达祷告的对象，并采用现代汉语庄重而自然的说法。
- source_word: ὅπως σωθῶ
  choice: 求他使我得救
  rationale: 保留 σωθῶ 的被动语态及目的/祈求含义，不预先限定所求拯救的具体性质。
theological_decisions:
- issue: “得救”的所指
  choice: 保留宽泛的“得救”
  alternative: 译为“脱离危险”或“蒙拯救”
  rationale: 上下文片段未明确说明是身体脱险、末世救恩或其他拯救，因此不将其具体化。
- issue: 祷告与得救主体之间的关系
  choice: 译作“求他使我得救”
  alternative: 译作“使我可以得救”
  rationale: 中文补出“他”以清楚承接“主”，但不增添得救条件或机制。
translation_notes:
  register: 采用现代、简洁、庄重的叙事语体。“为人类悲伤”比“为人的众子的族类忧伤”更符合现代普通读者的表达习惯，同时不添加宗派性解释。
