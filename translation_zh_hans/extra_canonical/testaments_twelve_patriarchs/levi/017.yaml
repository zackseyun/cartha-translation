  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017.yaml
  text: 'And since you have heard about the seventy weeks[1], hear also about the priesthood. For in each jubilee there will be a priesthood. In the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be complete with the Lord. [And in the days of his joy he will arise for the salvation of the world.]


    In the second jubilee, the one anointed will be conceived in the sorrow of a beloved one, and his priesthood will be honored, and he will be glorified by all.


    But the third priest will be taken in grief. And the fourth will be in pains, because unrighteousness will increase upon him in abundance, and all Israel will hate, each one, his neighbor. The fifth will be taken in darkness. Likewise also the sixth and the seventh.


    But in the seventh there will be a defilement which I cannot speak of before men, for those who do these things will know them. Therefore they will be in captivity and in plundering, and their land and their possessions will be destroyed.


    And in the fifth week they will return to the land of their desolation[4][3][2], and they will renew the house of the Lord.'
translation:
  language: zh_hans
  text: '17 既然你们已经听过关于“七十个七”的事[a]，现在也要听关于祭司职分的事。2 因为每逢一个禧年时期，都会有祭司职分。在第一个禧年时期，那首先受膏承接祭司职分的人将是伟大的；他要对上帝说话，如同对父亲说话；他的祭司职分在主那里将是完备的。[在他喜乐的日子，他要兴起，使世界得救。][b]


    3 在第二个禧年时期，那受膏者将在一位蒙爱者的哀痛中被孕育[c]；他的祭司职分将受尊崇，他也将受到众人的颂扬。


    4 第三位祭司将在忧伤中被带走[d]。5 第四位将处在痛苦中，因为不义要在他身上大大增加；以色列全体将人人憎恨自己的邻舍。6 第五位将在黑暗中被带走。7 第六位和第七位也同样如此。


    8 但在第七个禧年时期，将有一种污秽[e]，我无法在人前说出来，因为行这些事的人自己会知道。9 因此，他们将被掳、遭抢掠；他们的土地和财物都将被毁灭。


    10 到第五个“七”的时期[f]，他们将回到自己荒凉的土地，并重修主的殿[g]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “七十个七”呼应《但以理书》中的启示文学计时方式；本段假定听众先前已听过相关讲解。传统上也常译作“七十个七年时期”或“七十周”。
    reason: cross_reference
  - marker: b
    text: “在他喜乐的日子，他要兴起，使世界得救”这句话在此处所据的文本见证中地位不确定，可能是后来的扩充，因此保留在方括号内。
    reason: textual_variant
  - marker: c
    text: “被孕育”所译的希腊词也可表示“被抓住”或“被接纳”；这里的确切意思不确定。“一位蒙爱者的哀痛”也没有明确指出哀痛者是谁。
    reason: lexical_alternative
  - marker: d
    text: “被带走”也可能有“被接去”或“被某种处境笼罩”的意味；译文保留原句的含混。
    reason: lexical_alternative
  - marker: e
    text: 这里的“污秽”既可能指礼仪上的玷污，也可能指道德上的败坏；在论祭司职分腐化的语境中，两层含义可能兼有。
    reason: lexical_alternative
  - marker: f
    text: 本节从“禧年时期”转用“七”的单位（直译“第五个七”或“第五周”）。这一单位是否应理解为七年时期，以及它与前文禧年如何对应，原文没有说明。
    reason: chronological_ambiguity
  - marker: g
    text: “重修主的殿”也可译作“更新主的殿”，可能指灾毁之后修复或重建圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: 七十个七
  rationale: 保留启示文学计时表达中“七”的单位性，也避免中文“七十周”被自然理解为现代的七日周；脚注说明其但以理式背景。
- source_word: ἱερωσύνη
  choice: 祭司职分
  rationale: 本章所指既可涉及祭司职位，也可涉及相应制度或任期；“祭司职分”在中文中自然且不把含义缩窄为某一具体人物。
- source_word: ἰωβηλαῖον
  choice: 禧年时期
  rationale: 直译历法术语，同时加“时期”以使连续的预言性分期在现代中文中清楚。
- source_word: χριόμενος
  choice: 受膏者／受膏承接祭司职分的人
  rationale: 按上下文呈现祭司就职受膏的意义，不额外引入专门的弥赛亚称号；首次出现时展开表达，后文用“受膏者”。
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: 他要对上帝说话，如同对父亲说话
  rationale: 保留原文醒目的父子类比，不将其淡化为泛泛的亲密关系。
- source_word: πλήρης μετὰ κυρίου
  choice: 在主面前将是完备的
  rationale: 希腊语结构简略且不寻常；译文保留祭司职分与主相关的完满含义，但不强行解释为某种特定教义状态。
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: 使世界得救
  rationale: 自然呈现目的或结果关系；整句因文本存疑而置于方括号内。
- source_word: συλληφθήσεται
  choice: 将被孕育
  rationale: 该动词也可能表示“被抓住／被接纳”；此处在祭司次序和“哀痛”语境中，受孕或孕育义较为可行，但以脚注保留歧义。
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: 在一位蒙爱者的哀痛中
  rationale: 保留属格关系的含混，不指定究竟是谁哀痛、为何哀痛。
- source_word: παραληφθήσεται
  choice: 将被带走
  rationale: 采取克制的直译，保留可能指被取去、被接走或被某种处境笼罩的歧义。
- source_word: μιασμός
  choice: 污秽
  rationale: 该词在祭司语境中兼有礼仪玷污和道德败坏的意味；用宽泛的“污秽”并在脚注提示双重可能。
- source_word: ἀνακαινοποιήσουσιν οἶκον κυρίου
  choice: 重新修建主的殿
  rationale: ἀνακαινοποιέω 有更新、重建之意；“主的殿”在此语境自然指圣殿，但不细定工程性质。
theological_decisions:
- issue: 第2节方括号内救赎世界之句的文本地位
  choice: 保留在正文中并使用方括号，另加文本脚注
  alternative: 作为后期增补删去，或不加标记地纳入正文
  rationale: 所给希腊见证已用方括号标示此句存疑。译文既不静默删除，也不掩盖其可能为后加文字的性质。
- issue: 禧年、七年时期与祭司次序的历史所指
  choice: 按原文作为预言性分期直译，不指认具体历史人物
  alternative: 将各位祭司对应到已知的大祭司，或将其全部解释为纯象征时代
  rationale: 原文本身仅提供按禧年和“七”划分的祭司次序；具体历史对应不应被写入译文。
- issue: πλήρης μετὰ κυρίου 的关系含义
  choice: 译为“在主面前将是完备的”
  alternative: “充满主”“与主一同完全”“由主成全”
  rationale: 原短语语义压缩；所选译法表达与主相关的完备性，却不确定其是内在充满、同在关系还是神主动成全。
- issue: 第二位受膏者的 συλληφθήσεται
  choice: 正文采用“被孕育”，脚注列明其他可能
  alternative: “被抓住”“被接纳”
  rationale: 受孕义适合人物次序和诞生背景，但希腊动词本身多义，故不把选择伪装成毫无疑问。
- issue: 第8节“污秽”的性质
  choice: 使用兼容礼仪与道德含义的概括词
  alternative: 明确译为“亵渎圣物”或“道德败坏”
  rationale: 祭司职分的上下文容许两者，原文没有要求译者排除其中一个层面。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留章节节号、预言性将来时和原文的重复结构。为避免“周”被误解为现代七日周，ἑβδομάς 按语境译作“七”或“七年时期”；ἰωβηλαῖον 译为“禧年时期”。神名用“上帝”，κύριος 用“主”。对文本不确定处使用方括号，并以脚注公开说明；不嵌入特定历史人物或宗派解释。
