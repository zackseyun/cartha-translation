  - severity: medium
    issue: 第2节“都有一种祭司职分”
    rationale: ἔσται ἱερωσύνη意为“将有祭司职分／祭司职位”，并无“一种、某类”的限定；“一种”会误示职分类型。
  - severity: medium
    issue: 第8节“第七个时期”未标示禧年
    rationale: ἐν τῷ ἑβδόμῳ承接前文按禧年排列的序列；译作泛称“时期”削弱了原文的结构。
  - severity: medium
    issue: 第10节“第五个七年时期”
    rationale: ἑβδομάς在此可译“七”或“周”，原文未在该词本身明确规定为“七年”；译为“七年时期”属于不必要的具体化。
  - severity: low
    issue: “将成为尊大”及“重新修建”措辞生硬
    rationale: 前者宜作“将是伟大的”，后者宜作“重修”，以符合现代庄重汉语，且不改变意思。
