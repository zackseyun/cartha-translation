- from: 因为从今天起，那座名叫示剑的城，必称为无知之人的城；我们嘲弄他们，就像人嘲弄愚人一样。
  to: 因为从今日起，那座名叫示剑的城必成为无知之人的城；因为正如有人会嘲弄愚人一样，我们也曾这样嘲弄他们。
