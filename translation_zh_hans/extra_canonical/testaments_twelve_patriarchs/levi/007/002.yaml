  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/002.yaml
  text: For from this day the city called Sychem shall be a city of senseless people. For just as someone mocks a fool, so we mocked them,
translation:
  language: zh_hans
  text: 因为从今日起，那座名叫示剑的城必成为无知之人的城；因为正如有人会嘲弄愚人一样，我们也曾这样嘲弄他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Σύκημα λεγομένη πόλις
  choice: 那座名叫示剑的城
  rationale: 按专名通常所指译作“示剑”，并自然表达希腊语“被称为示剑的城”。
- source_word: πόλις ἀσυνέτων
  choice: 无知之人的城
  rationale: ἀσύνετος侧重缺乏理解、辨识或明智，并不只是智力低下；“无知之人”比“愚人”更能保留它与下文μωρόν的用词区别。
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: 嘲弄／嘲弄
  rationale: 以同一汉语词复现原文同一动词的将来时和过去时形式，保留前后呼应。
- source_word: μωρόν
  choice: 愚人
  rationale: μωρός可指愚笨、愚昧的人；此处作为受嘲弄者，译为“愚人”简洁自然。
theological_decisions:
- issue: “示剑”与“无知之人的城”之间的关系
  choice: 译为“必称为无知之人的城”
  alternative: “必成为无知之人的城”
  rationale: 希腊文在“城”与“无知之人”之间省略系词，可理解为身份或称谓；上下文含命名意味，而原文措辞也可能容许状态含义。正文采用较贴近英语审校层和语境的“称为”，不扩展为额外的神学判断。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留因果开头“因为”以及比拟结构；将希腊语较生硬的语序调整为自然汉语，同时维持“无知之人”与“愚人”的词义区分。
