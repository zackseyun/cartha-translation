review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿准确保留了示剑、ἀσύνετος与μωρός的词义区别，以及χλευάζω的前后呼应；但将χλευάσει（将来时）译成无时态标记的“人嘲弄”，未体现原文与“我们嘲弄了他们”（过去时）的时态对照。另，“必称为无知之人的城”容易把“称为”附着到城的未来身份上；原文的λεγομένη已修饰“示剑”，随后ἔσται表达该城将成为“无知者的城”。
  naturalness: 修订后采用“从今日起”“必成为”“正如……一样，我们也曾这样……”的现代书面语，庄重、通顺，并保留原文略带宣告与追述性质的表达。
  terminology: “示剑”适当。“无知之人”可对应ἀσυνέτων，并与下文“愚人”（μωρόν）区分；“嘲弄”适当对应χλευάζω。
  issues:
  - severity: medium
    issue: χλευάσει的将来时未明确表达。
    rationale: 原文以χλευάσει（“将会/会嘲弄”）与ἐχλευάσαμεν（“我们曾嘲弄”）形成时态对照。草稿的“人嘲弄”可理解为泛指现在时，弱化了这一对照。
  - severity: low
    issue: “必称为无知之人的城”可能混淆两个不同的命名/判断结构。
    rationale: λεγομένη明确为“名叫示剑”，而ἔσται表示该城将“成为”无知者的城。译为“必成为”能更直接反映原文，且不排除其所含的贬抑性称谓意味。
  revised_text: 因为从今日起，那座名叫示剑的城必成为无知之人的城；因为正如有人会嘲弄愚人一样，我们也曾这样嘲弄他们。
