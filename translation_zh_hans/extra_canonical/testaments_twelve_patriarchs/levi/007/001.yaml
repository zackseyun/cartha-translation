  text: And I said to my father Jacob, “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you.”
translation:
  language: zh_hans
  text: 我对我父亲雅各说：“主必在你身上[a]使迦南人归于无有，并把他们的土地赐给你和你之后的后裔。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你身上”原文也可译作“就你而言”或“借着你”。
    reason: 希腊语ἐν σοὶ可表达范围、关联或凭借；正文保留较少限定的关联表达。
lexical_decisions:
- source_word: ἐξουδενώσει
  choice: 使……归于无有
  rationale: 保留该动词“使之成为无物、彻底贬抑或除灭”的强烈语气，同时避免擅自限定具体施行方式。
- source_word: σπέρματί
  choice: 后裔
  rationale: 此处是集合意义的“种、子孙”，现代汉语以“后裔”最自然准确。
- source_word: γῆν
  choice: 土地
  rationale: 在迦南人所属地域的语境中译为“土地”，既自然，也保留领土含义。
theological_decisions:
- issue: ἐν σοὶ 所表达的关系
  choice: 因着你[a]
  alternative: 在你里面；藉着你
  rationale: 介词短语可能表示关联、范围或凭借；正文采用较自然且仍较宽泛的“因着你”，并以脚注保留其他可能，避免把神应许实现的方式解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留直接引语及应许的强烈语气。“归于无有”略具经文风格，但普通读者仍可理解，并较好对应原文措辞。
