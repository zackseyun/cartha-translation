  text: 因为他们确实在以色列中做了愚妄的事，玷污了我的姐妹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίγε
  choice: 确实
  rationale: 表达加强语气，贴近“的确、诚然”，又不额外引入转折关系。
- source_word: ἀφροσύνην ἔπραξαν
  choice: 做了愚妄的事
  rationale: 保留“行事”与“愚妄”的语义组合，同时采用自然的现代汉语表达。
- source_word: ἐν Ἰσραήλ
  choice: 在以色列中
  rationale: 保留原文的群体或共同体范围意味，不擅自改成单纯的地理表述。
- source_word: μιάναντες
  choice: 玷污了
  rationale: 对应使之污秽、受辱的含义；以逗号连接，保留分词与前句之间可能兼具说明、方式或原因的关系。
- source_word: τὴν ἀδελφήν μου
  choice: 我的姐妹
  rationale: ἀδελφή只表明女性手足，不注明长幼；“姐妹”避免擅自译为“姐姐”或“妹妹”。
theological_decisions:
- issue: 分词μιάναντες与主句的逻辑关系
  choice: 用逗号并列为“做了愚妄的事，玷污了……”
  alternative: 译作“因玷污了……”或“借着玷污……”
  rationale: 原文分词可说明伴随情形、方式或原因；不添加明确连接词，以保留其语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“在以色列中”略带经文语体，用来保留原文所指向的共同体范围；全句不补出原文未明说的因果关系或姐姐、妹妹之别。
