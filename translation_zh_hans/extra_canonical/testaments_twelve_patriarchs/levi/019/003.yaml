base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/003.yaml
  text: And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him, “We are witnesses.”
translation:
  language: zh_hans
  text: 他们的父亲对他们说：“主是见证人，他的众天使也是见证人；你们是见证人，我也是见证人，为你们口中所说的话作证。”他的儿子们对他说：“我们是见证人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς / μάρτυρες
  choice: 见证人
  rationale: 保留司法或立约语境中的“证人、见证者”含义；结尾省略主语的“Μάρτυρες”按汉语自然表达补为“我们是见证人”。
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: 为你们口中所说的话作证
  rationale: λόγος τοῦ στόματος是闪语化表达，直指他们亲口说出的话；译文既保留“口中”意象，也明确περί在此与作见证的关系。
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: 他的众天使
  rationale: 复数冠词短语指属于主的天使群体；“众天使”自然体现复数。
theological_decisions:
- issue: 主、天使、儿子们与父亲均被列为见证人
  choice: 逐项保留“是见证人”的重复结构
  alternative: 合并为“主、他的天使、你们和我都是见证人”
  rationale: 原文反复使用μάρτυς/μάρτυρες，形成庄严的见证宣告；不宜为求简洁而削弱其修辞和立约色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文重复造成的仪式性语气，同时在末句补出汉语所需的主语“我们”。
