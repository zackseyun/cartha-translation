  text: And his sons answered him, saying, “Before the Lord we will walk according to his law.”
translation:
  language: zh_hans
  text: 他的儿子们回答他说：“我们必在主面前，照着他的律法而行。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐνώπιον κυρίου
  choice: 在主面前
  rationale: 保留原文表示生活与行事都处于主鉴察之下的空间性表达。
- source_word: πορευσόμεθα
  choice: 我们必……行事
  rationale: 此处动词按伦理生活的引申义理解；“行事”比字面的“行走”更符合现代汉语，同时保留行为方式的含义。
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: 遵从他的律法
  rationale: κατά在此表示以律法为准则；译作“遵从”自然表达按律法而行之意。
theological_decisions:
- issue: ⌜καὶ⌝的文本不确定性
  choice: 正文不另译“并且”
  alternative: “并且遵从他的律法”
  rationale: 该连词在版本中以特殊括号标示文本不确定；无论是否保留，都不改变两个短语共同修饰πορευσόμεθα的基本意义。省去连词能形成自然汉语，且未消除实质神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引语保留承诺语气；“律法”与犹太宗教伦理语境相称。
