  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/001.yaml
  text: And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar.
translation:
  language: zh_hans
  text: 现在，我的孩子们，你们已经听见这一切了。你们要为自己选择：是光明还是黑暗，是主的律法还是彼列的作为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留亲切的父辈 خطاب；现代汉语自然且庄重。
- source_word: πάντα ἠκούσατε
  choice: 你们已经听见这一切了
  rationale: πάντα 在语境中指前述全部教导，译作“这一切”比孤立的“万事”自然。
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: 你们要为自己选择
  rationale: 保留中间语态所强调的自主选择及命令语气。
- source_word: τὸ φῶς / τὸ σκότος
  choice: 光明 / 黑暗
  rationale: 保持原文鲜明的道德与属灵对举，不作解释性扩写。
- source_word: νόμον κυρίου
  choice: 主的律法
  rationale: νόμος 在此适合传统而清楚的“律法”，κυρίου 保持为“主”。
- source_word: τὰ ἔργα τοῦ Βελίαρ
  choice: 彼列的作为
  rationale: ἔργα 译作“作为”可涵盖行为及其表现；Βελίαρ 按专名音译为“彼列”，避免将其解释性译成“邪恶”。
theological_decisions:
- issue: 两组“或……或……”之间的关系
  choice: 以标点呈现两个彼此对应的选择：“是光明还是黑暗，是主的律法还是彼列的作为”
  alternative: 将四项理解为单一四选一列表
  rationale: 原文重复 ἢ 形成两组鲜明对偶；译文保持其修辞结构，同时不额外断言两组各项完全等同。
- issue: Βελίαρ 的身份
  choice: 保留专名“彼列”
  alternative: 译为“恶者”或“邪恶”
  rationale: 原文使用专名；音译可避免提前解决其人格化程度或身份的神学问题。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；保留劝诫语气和原文平行对偶，不增添原文没有的解释。
