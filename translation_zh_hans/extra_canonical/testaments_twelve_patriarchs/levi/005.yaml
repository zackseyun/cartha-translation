  text: 'And in this[a], the angel opened to me the gates of heaven, and I saw the holy Most High seated on a throne.


    2 And he said to me, “Levi, to you I have given the blessings of the priesthood until, having come, I dwell in the midst of Israel.”


    3 Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Carry out vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”


    4 And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers[b].


    5 And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in a day of affliction.”


    6 And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down utterly; for every evil spirit attacks it.”


    7 And after this, when I awoke, I blessed the Most High.'
translation:
  language: zh_hans
  text: '5 在这异象中[a]，天使为我打开了天门，我看见圣洁的至高者坐在宝座上。


    2 他对我说：“利未，我已将祭司职分的福分赐给你，直到我来，住在以色列中间。”


    3 随后，天使带我下到地上，给我一件兵器和一把长剑，对我说：“你要在示剑为你的妹妹底拿施行报复；我必与你同在，因为主差遣了我。”


    4 那时，我灭了哈抹的众子，正如祖先的石版上所记载的[b]。


    5 我对他说：“主啊，我求你将你的名告诉我，好让我在患难之日呼求你。”


    6 他说：“我就是那位为以色列族求情的天使，免得他们受击打[c]。”


    7 此后，我醒了，就称颂至高者。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在这之中”，所指不明确；这里按上下文理解为这场异象。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“祖先的石版上”。在启示文学语境中，这可能指天上的版册，但原文没有明确使用“天上的”一词。
    reason: lexical_alternative
  - marker: c
    text: 本节希腊文的措辞和传本情况都较困难。“求情”也可作其他理解；有些文本传统还扩展了避免以色列被彻底击杀以及邪灵攻击以色列等内容，但这些话不在此处采用的希腊正文中。原文没有明说施行击打者，因此正文以“受击打”保留这一含混。
    reason: textual_variant
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 在这异象中
  rationale: 希腊文直译为“在这之中”，但所指不明；结合上下文以“这异象”补明自然语境，同时以脚注保留原文的不确定性。
- source_word: ἅγιον ὕψιστον
  choice: 圣洁的至高者
  rationale: 同时保留ἅγιον的圣洁属性与ὕψιστον作为尊称的崇高意味，不将二者合并成另一固定神名。
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: 祭司职分的福分
  rationale: 明确保留属格关系，表示与祭司职分相关的福分，而非单指祭司所宣告的祝福。
- source_word: ἕως ἐλθὼν κατοικήσω ἐν μέσῳ τοῦ Ἰσραήλ
  choice: 直到我来，住在以色列中间
  rationale: 保留第一人称及时间结构；中文用两个连续动词自然表达“来而居住”。
- source_word: ὅπλον καὶ ῥομφαίαν
  choice: 一件兵器和一把长剑
  rationale: ὅπλον在此可泛指兵器或军械，不武断限定为盾牌；ῥομφαία译作“长剑”，与前者区分。
- source_word: Ποίησον ἐκδίκησιν
  choice: 施行报复
  rationale: 保留命令语气及ἐκδίκησις的报复、惩治意味，不弱化为泛泛的“伸张正义”。
- source_word: συνετέλεσα
  choice: 灭了
  rationale: 在针对哈抹众子的暴力语境中，表示使其彻底终结；“灭了”简洁保留结果性。
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: 祖先的版册上
  rationale: 原文只有“祖先的版/版册”，未明说“天上的”；正文不加入该限定，并在脚注交代启示文学语境中的可能理解。
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: 在患难之日
  rationale: 保留单数日子的庄重惯用表达及θλίψεως的困厄意味。
- source_word: ὁ ἄγγελος ὁ παραιτούμενος τὸ γένος Ἰσραήλ
  choice: 那位为以色列族求情的天使
  rationale: παραιτούμενος在此结构中语义艰难；结合后接避免击打的目的句，译为保护性的代求最合语境，但不扩写原文未载的内容。
- source_word: τοῦ μὴ πατάξαι αὐτούς
  choice: 使他不击打他们
  rationale: 按现存所给希腊正文翻译，不加入“彻底”或恶灵攻击等扩展读法；不定式中击打者的主语未明，中文保留“他”的指称张力。
- source_word: ἔξυπνος γενόμενος
  choice: 我醒了
  rationale: 以现代汉语自然表达异象之后恢复清醒的分词结构。
theological_decisions:
- issue: 第2节第一人称“我来，住在以色列中间”的说话者
  choice: 保留直接引语中的第一人称，不在正文判定是宝座上的至高者还是代神发言的天使。
  alternative: 明确改写为至高者亲自说话，或说明天使奉神名说话。
  rationale: 叙事先提到至高者，随后只说“他对我说”，代词所指存在张力；补明任何一方都会消除原文的真实含混。
- issue: 第4节“祖先的版册”的性质
  choice: 正文不加入“天上的”，脚注说明其在启示文学语境中可能指天上预存的版册。
  alternative: 直接译为“祖先的天上版册”。
  rationale: “天上的”符合某种语境理解，却不见于所给希腊正文，因此不应无标记地写入正文。
- issue: 第6节天使的角色及目的句
  choice: 将其理解为替以色列求情的保护性天使，但严格保留所给正文较短的目的句。
  alternative: 译作拒绝、回避以色列的天使；或采扩展文本，加入“不被彻底击杀”及恶灵攻击以色列的说明。
  rationale: παραιτούμενος本身多义且文本困难；后面的“使他不击打他们”支持求情理解，但所给正文没有扩展句，因此不将异文写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。叙事以短句推进，神圣称谓保持肃穆；暴力与代求等神学张力不作缓和。人名地名采用常见圣经汉译：利未、示剑、底拿、哈抹。
