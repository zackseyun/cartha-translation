base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/001.yaml
  text: And now, children, keep what I command you, since I have declared to you all that I heard from my fathers.
translation:
  language: zh_hans
  text: 如今，孩子们，你们要遵守我所吩咐你们的一切，因为我已把从我父辈那里听到的一切都告诉你们了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τανῦν
  choice: 现在
  rationale: 表示由前文转入当下的劝诫；现代汉语用“现在”自然简洁。
- source_word: φυλάξατε
  choice: 要遵守
  rationale: 在命令语境中指谨守并实行所吩咐的事，“遵守”兼顾准确与通顺。
- source_word: ὅσα ἐγὼ ἐντέλλομαι ὑμῖν
  choice: 我所吩咐的一切
  rationale: 保留关系结构及“全部”的范围，并以“吩咐”体现长辈对子孙的郑重训令。
- source_word: τέκνα
  choice: 孩子们
  rationale: 直接称呼后辈，现代标准普通话中“孩子们”亲切而庄重。
- source_word: παρὰ τῶν πατέρων μου
  choice: 从先祖那里
  rationale: 此处复数πατέρων可指父辈或祖先；结合传承语境译为“先祖”，避免误解为多个生父。
- source_word: ἀνήγγειλα ὑμῖν
  choice: 都已经告诉你们了
  rationale: 表达将所听见的内容传告给听众；“已经……了”自然呈现过去完成的陈述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体；保留原文两处“所……的一切”的范围对应，同时通过汉语语序避免生硬重复。
