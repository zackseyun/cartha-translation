source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ΓΚαὶ ἰδοὺ⁴⁾ ἀθῷός εἰμι⁵ τῆς⁶ ἀσεβείας⁷ ὑμῶν⁸ *καὶ παραβάσεως⁹ ἣν ποιήσετε ἐπὶ *τῇ συντελείᾳ¹⁰ *τῶν αἰώνων¹¹ [εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν]¹² *πλανῶντες τὸν Ἰσραήλ¹³, καὶ ἐπεγείροντες¹⁴ *ἐπ᾿ αὐτὸν¹⁵ κακὰ μεγάλα¹⁶ *παρὰ Κυρίου¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/002.yaml
  text: And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils against him from the Lord.
translation:
  language: zh_hans
  text: 看哪，我对你们的不敬虔和过犯不负罪责。你们将在万世的终局犯下这过犯[，攻击世界的救主弥赛亚]，使以色列走迷，并挑起从主而来的大灾祸来攻击他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθῷός εἰμι
  choice: 我是无罪的
  rationale: 保留司法与道德层面的“无罪、无辜”含义；结合属格结构译作“在……上是无罪的”，自然表达说话者不承担其罪责。
- source_word: ἀσεβείας
  choice: 不敬虔
  rationale: 指向对上帝缺乏敬畏的恶，而不只是一般性的邪恶；采用现代基督教汉语中清楚且庄重的对应词。
- source_word: παραβάσεως
  choice: 过犯
  rationale: 保留“越过界限、违犯”的含义，也与后面的阴性单数关系代词ἣν相呼应。
- source_word: ἐπὶ τῇ συντελείᾳ τῶν αἰώνων
  choice: 在万世终结之时
  rationale: συντέλεια表示终局或完成，αἰῶνες为复数；“万世终结”兼顾末世意味和复数形式，不把它简化为单一“时代末了”。
- source_word: σωτῆρα τοῦ κόσμου χριστόν
  choice: 世界的救主弥赛亚
  rationale: χριστός在此作为称号；译为“弥赛亚”可传达“受膏者”的身份，并与普通读者熟悉的称谓相符。
- source_word: πλανῶντες τὸν Ἰσραήλ
  choice: 使以色列走迷
  rationale: πλανάω表示引入迷途；此译保留主动误导的意义，又比“欺骗”更贴近道路隐喻。
- source_word: ἐπεγείροντες
  choice: 煽起
  rationale: 表达唤起、挑起并使之针对某人的动作，与后接“攻击他”自然衔接。
- source_word: κακὰ μεγάλα
  choice: 大灾祸
  rationale: κακά可指恶事、祸患或灾难；在“从主而来”的结构中，“灾祸”较自然，同时不预断其具体形式。
- source_word: παρὰ Κυρίου
  choice: 从主而来的
  rationale: παρά加属格通常表达来源；按希腊词序将其与“大灾祸”相连，保留这些灾祸来自主这一较尖锐的神学表述。
theological_decisions:
- issue: 说话者与后代罪责的关系
  choice: “我在你们的不敬虔和过犯上是无罪的”
  alternative: “我与你们的不敬虔和过犯无关”
  rationale: 采用更贴近ἀθῷος的“无罪”，既表明不承担罪责，也不额外断言完全没有任何关系。
- issue: 方括号内基督论短语的文本地位
  choice: 正文保留方括号，并译作“攻击世界的救主弥赛亚”
  alternative: 无方括号地纳入正文，或从正文删除
  rationale: 来源文本已用方括号标示该短语，可能反映其文本地位存疑；译文保留内容与标示，不擅自裁定原始性。
- issue: “从主而来”与“攻击他”的关系
  choice: “煽起从主而来的大灾祸攻击他”
  alternative: “在主面前煽起大灾祸攻击他”或“煽动主降下大灾祸攻击他”
  rationale: 按παρά加属格的通常来源义及希腊语序，将“大灾祸”理解为“从主而来”，同时不将主明确改写为受煽动的行动者，也不消解灾祸针对弥赛亚所形成的神学张力。
- issue: 关系代词ἣν的单数所指
  choice: 另起一句说“犯下这过犯”
  alternative: 笼统译作“犯下这些事”并同时统摄“不敬虔和过犯”
  rationale: ἣν为阴性单数，最直接回指同为阴性单数的παράβασις“过犯”；明确单数关系比英语咨询层的复合回指更贴近希腊文。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“看哪”保留启示性叙述语气；以短句拆开复杂希腊长句，避免关系从句堆叠。保留“无罪”“不敬虔”“过犯”“弥赛亚”等具有经文语域但普通读者仍能理解的词。方括号依照来源文本原样保留，并用脚注解释。
