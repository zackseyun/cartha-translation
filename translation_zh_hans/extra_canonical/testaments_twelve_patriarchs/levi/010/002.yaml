revisions:
- from: 看哪，我在你们的不敬虔和过犯上是无罪的。你们将在万世终结之时，[a]犯下这过犯，[攻击世界的救主弥赛亚]，[b]使以色列走迷，又煽起从主而来的大灾祸攻击他。[c]
  to: 看哪，我对你们的不敬虔和过犯不负罪责。你们将在万世的终局犯下这过犯[，攻击世界的救主弥赛亚]，使以色列走迷，并挑起从主而来的大灾祸来攻击他。
  rationale: 修订使方括号内存疑短语在汉语中紧接“过犯”，更清楚地保留其所指向的对象；同时调整两处不自然的表达。改动不裁定方括号短语的原始性，也不消解“从主而来的大灾祸攻击他”所含的语义张力。建议排版时分别将脚注标记[a]置于“终局”后、[b]置于右方括号后、[c]置于句末。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:23:34Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿基本准确地保留了关系代词单数回指“过犯”、方括号内短语的存疑地位，以及“从主而来”的来源义。但中文将“攻击世界的救主弥赛亚”置于“犯下这过犯”之后、以独立逗号短语呈现，使其与“过犯”的关联不够清楚；末尾“煽起……大灾祸攻击他”的搭配也不够自然。
  naturalness: “在……上是无罪的”和“煽起从主而来的大灾祸攻击他”都带有明显欧化痕迹。改为“对……不负罪责”及“挑起……大灾祸来攻击他”，在保持庄重经文语体的同时更符合现代标准汉语。
  terminology: “不敬虔”“过犯”“弥赛亚”“以色列”“主”均恰当。“万世的终局”比“万世终结”更自然，仍保留συντέλεια与复数αἰώνων的终末性表达。
  issues:
  - severity: medium
    issue: 方括号短语在句中的句法归属不够清楚。
    rationale: 希腊文存疑短语紧随“你们将要犯下的过犯”之后，并由εἰς引出其所针对者。译文应将方括号短语紧贴“过犯”，使读者看出这是该过犯所指向的对象，而非游离的插入语。
  - severity: medium
    issue: “煽起从主而来的大灾祸攻击他”汉语搭配生硬。
    rationale: ἐπεγείροντες可译“挑起、激起”；κακὰ μεγάλα与παρὰ Κυρίου宜保留为“从主而来的大灾祸”。加入“来”可明确这些灾祸针对“他”，且不改变原文存在的句法与神学张力。
  - severity: low
    issue: “在……上是无罪的”不够自然。
    rationale: ἀθῷος加属格表达不负相关罪责；“对……不负罪责”较符合现代汉语，且不扩大为毫无关系。
  revised_text: 看哪，我对你们的不敬虔和过犯不负罪责。你们将在万世的终局犯下这过犯[，攻击世界的救主弥赛亚]，使以色列走迷，并挑起从主而来的大灾祸来攻击他。
  revised_footnotes:
  - marker: a
    text: “万世的终局”直译为“众世代的终局”，指历史达到其终点或完成之时。
    reason: 说明复数αἰώνων及συντέλεια的终末性表达，避免读者误解为某一普通时代的结束。
  - marker: b
    text: “攻击世界的救主弥赛亚”在所据希腊文本中置于方括号内，表示这几个词的文本地位存疑。
    reason: 保留来源文本的方括号信息及其文本批判上的不确定性。
  - marker: c
    text: 希腊文可较生硬地直译为：“并挑起从主而来的大灾祸攻击他。”其中“从主而来”按通常用法表示这些灾祸的来源；其与“攻击他”的具体句法关联仍有张力。
    reason: 显明παρὰ Κυρίου的来源义及其在句末所造成的句法张力，不以顺畅译文消除原文可能令人意外的表述。
  revision_rationale: 修订使方括号内存疑短语在汉语中紧接“过犯”，更清楚地保留其所指向的对象；同时调整两处不自然的表达。改动不裁定方括号短语的原始性，也不消解“从主而来的大灾祸攻击他”所含的语义张力。建议排版时分别将脚注标记[a]置于“终局”后、[b]置于右方括号后、[c]置于句末。
