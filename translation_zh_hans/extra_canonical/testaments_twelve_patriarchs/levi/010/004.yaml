base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/004.yaml
  text: And you will be scattered as captives among the nations, and there you will be for a reproach and a curse.
translation:
  language: zh_hans
  text: 你们必被分散，成为列国中的俘虏；在那里，你们必成为羞辱和咒诅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασπαρήσεσθε
  choice: 必被分散
  rationale: 保留将来被动语态及四散之意，中文表达自然且庄重。
- source_word: αἰχμάλωτοι
  choice: 成为……俘虏
  rationale: 将表语性的复数形容词/名词译为结果状态，明确他们被分散时具有俘虏身份。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 列国中
  rationale: ἔθνη在此指诸外邦或各国；“列国”既贴近原文，也符合经文体裁。
- source_word: ὄνειδος
  choice: 羞辱
  rationale: 表达受人辱骂、被视为耻辱对象的含义，同时保留名词结构。
- source_word: κατάραν
  choice: 咒诅
  rationale: 保留原词“咒诅”的强烈含义，不弱化为一般厌弃或灾祸。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 明确对应前述“列国中”的处境，并保留原文的地点副词。
theological_decisions:
- issue: “成为咒诅”的语义张力
  choice: 直译为“成为……咒诅”
  alternative: 译为“成为被咒诅的人”或“成为人咒骂的话柄”
  rationale: 原文εἰς κατάραν可表示成为咒诅、咒语或被咒诅的对象；直译保留这种真实歧义，不把它限定为神施加的咒诅或人的咒骂。
- issue: 被动语态的施事者
  choice: 保留“必被分散”，不补出施事者
  alternative: 补译为“上帝必使你们分散”
  rationale: 希腊文使用被动语态而未明说施事者；不擅自指定为上帝，以免额外作出神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“列国”“咒诅”保留经文语域；分号呈现两个并列而递进的审判结果。
