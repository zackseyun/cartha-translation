source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνομήσετε¹⁸ *ἐν τῷ¹⁹ Ἰσραήλ²⁰, ὥστε μὴ βαστάζειν²¹ τὴν²² Ἱερουσαλήμ²³ ἀπὸ προσώπου τῆς²⁴ πονηρίας ὑμῶν, ἀλλὰ σχισθήσεται²⁵ τὸ καταπέτασμα²⁶ τοῦ ναοῦ, ὥστε μὴ καλύψαι²⁷ τὴν²⁸ ἀσχημοσύνην ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/003.yaml
  text: And you will act lawlessly in Israel, so that Jerusalem will not be able to bear your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame.
translation:
  language: zh_hans
  text: 你们必在以色列中行不法之事，以致耶路撒冷承受不住你们的邪恶；但圣殿的幔子必被撕裂，不再遮掩你们的羞耻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομήσετε
  choice: 行不法之事
  rationale: 保留动词所表达的违背律法、无法无天之意，也符合现代汉语表达。
- source_word: βαστάζειν
  choice: 承受不住
  rationale: βαστάζειν在此指承担、忍受；与否定词连用，译为“承受不住”，既贴近原文，也自然明确。
- source_word: πονηρίας
  choice: 邪恶
  rationale: 保留该词宽泛的道德恶义，不缩窄为某一种罪行。
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: 圣殿的幔子
  rationale: καταπέτασμα指殿内悬挂的帘幕；“幔子”是中文宗教文本中自然且易懂的对应词。
- source_word: σχισθήσεται
  choice: 必被撕裂
  rationale: 准确保留将来时与被动语态，不额外指明施事者。
- source_word: ἀσχημοσύνην
  choice: 羞耻
  rationale: 此词可指不体面、可耻或羞处；此处译为抽象的“羞耻”，不擅自具体化其所指。
theological_decisions:
- issue: 圣殿幔子被撕裂的施事者与含义
  choice: 采用无施事者的被动表达“必被撕裂”
  alternative: 译为“上帝必撕裂圣殿的幔子”或明确联系某一事件
  rationale: 原文只使用被动语态，没有点明施事者，也未在本节明说其象征所指，因此保留原有开放性。
- issue: 耶路撒冷不能承受邪恶的拟人表达
  choice: 保留“耶路撒冷承受不住你们的邪恶”
  alternative: 解释为“耶路撒冷将因你们的邪恶而毁灭”
  rationale: 原文以耶路撒冷为主语并使用βαστάζειν；直保留这种拟人和因果张力，避免加入“毁灭”等未明说的结果。
- issue: 幔子与羞耻之间的目的/结果关系
  choice: 译作“不再遮掩你们的羞耻”
  alternative: 译作“以致不能遮掩你们的羞耻”
  rationale: ὥστε μὴ καλύψαι可表达结果或目的；结合幔子被撕裂后的实际结果，正文采用自然的结果式表达，但不进一步解释神学象征。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“行不法之事”保留律法语义；“承受不住”使耶路撒冷的拟人表达自然；全句避免古奥虚词及超出原文的神学阐释。
