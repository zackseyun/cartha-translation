  text: For the house that the Lord will choose shall be called Jerusalem, as the book of Enoch the righteous contains.
translation:
  language: zh_hans
  text: 因为主将要拣选的房屋必称为耶路撒冷，正如义人以诺的书所记载的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶκος
  choice: 殿
  rationale: 本句语境涉及主所拣选并称为耶路撒冷的宗教居所；译作“殿”比泛称“家”或“房屋”更自然，也符合圣殿语境。
- source_word: ἐκλέξεται
  choice: 所要拣选的
  rationale: 保留希腊语将来时和拣选之意。
- source_word: Ἱερουσαλήμ κληθήσεται
  choice: 必称为耶路撒冷
  rationale: 保留被动结构及将来语气，不额外解释“称为”所指的身份或地点关系。
- source_word: περιέχει
  choice: 记载
  rationale: 此处表示书卷载有相关内容；现代汉语用“记载”自然清楚。
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: 义人以诺
  rationale: 将属格称号自然译为汉语同位修饰语，同时保留“义人”这一评价。
theological_decisions:
- issue: “殿”与“耶路撒冷”的关系
  choice: 按原文直译为“殿必称为耶路撒冷”
  alternative: 解释为“主所拣选的殿所在之处必称为耶路撒冷”
  rationale: 原文直接以οἶκος为κληθήσεται的主语；为保留其不寻常表达和可能的神学张力，不补入“所在之处”。
- issue: 修订记录所称“并成为咒诅”
  choice: 不纳入正文
  alternative: 在句末加入“并成为咒诅”
  rationale: 用户所给希腊语正文止于“义人以诺的书中所记载的”，并不含καὶ εἰς κατάραν；翻译以提供的原文证据为准，不采用与该原文不一致的修订说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“因为”承接γάρ；“正如……所记载的”保持书面经文语体，同时避免生硬仿译。
