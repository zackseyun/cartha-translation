  text: 第六位把冠冕戴在我头上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἕκτος
  choice: 第六位
  rationale: 希腊文以带冠词的序数词名词化，指前文所述诸位中的第六位；译为“第六位”自然且不擅自补明其身份。
- source_word: στέφανον
  choice: 冠冕
  rationale: 指戴在头上的冠冠或荣誉性冠冕；“冠冕”兼顾庄重语体与其象征意味。
- source_word: περιέθηκεν
  choice: 戴在
  rationale: 该动词表示将某物环置于某处；与冠冕和头搭配时，现代汉语用“把……戴在……上”最自然。
- source_word: μοι … τῇ κεφαλῇ
  choice: 我头上
  rationale: μοι为与格，结合“头”可自然表达为不可让渡领属“我头上”，无须生硬重复为“给我、在头上”。
