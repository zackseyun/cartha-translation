  text: And the fourth wrapped around me a belt, like purple.
translation:
  language: zh_hans
  text: 第四位给我束上一条腰带，宛如紫色[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译为“与紫色相似”；这里的“紫色”也可能指紫色染料或紫色织物。
    reason: 说明πορφύρα的词义范围，并保留原文比拟对象未完全说清的含混性。
lexical_decisions:
- source_word: τέταρτος
  choice: 第四位
  rationale: 原文以序数词名词化，指第四位人物；译作“第四位”既简洁，又不擅自补明其身份。
- source_word: ζώνην
  choice: 腰带
  rationale: 指束在腰间的带子；“腰带”符合现代汉语，也保留具体物件的含义。
- source_word: μοι περιέβαλεν
  choice: 给我束上
  rationale: περιβάλλω在此表示把腰带围在说话者身上；“束上”比机械直译“围绕”更符合汉语中腰带的搭配。
- source_word: ὁμοίαν πορφύρας
  choice: 宛如紫色
  rationale: 保留原文简略而略显含混的比拟，不强行判定πορφύρα具体指颜色、染料还是紫色织物。
