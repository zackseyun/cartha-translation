source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐξ αὐτῶν⁹⁴ ἔσονται ἱερεῖς⁹⁵ καὶ⁹⁶ κριταὶ καὶ⁹⁶ γραμματεῖς· καὶ⁹⁷ ἐπὶ στόματος αὐτῶν †ληφθήσεται⁹⁸ τὸ ἅγιον⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/017.yaml
  text: And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”
translation:
  language: zh_hans
  text: 从他们中间将有祭司、审判官和经学家；圣物也必凭他们口中所言被领受。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被领受”所据的希腊词在现存文本中被编者标为疑难；本译文按现有读法译出。“圣物”原文直译为“那圣的”，具体所指不明。
    reason: 原文以 † 标示 ληφθήσεται 存在文本疑难，而 τὸ ἅγιον 又具有真实的指称歧义，均需向读者透明说明。
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: 从他们中间
  rationale: 表达群体内部产生这些职分的含义，符合希腊语 ἐκ 的来源或范围用法。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: 采用该宗教职分在现代汉语中的通行译法。
- source_word: κριταὶ
  choice: 审判官
  rationale: 保留司法职分含义；较单译“审判者”更自然，也不限定为现代法官制度。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 在犹太宗教语境中指精通、抄录并讲解经文与律法的人；“经学家”比仅表书写工作的“书记”更准确。
- source_word: ἐπὶ στόματος αὐτῶν
  choice: 凭他们口中所言
  rationale: 保留“口”的意象，同时用“所言”使现代汉语自然，并传达以他们的宣告或教导为媒介的意思。
- source_word: τὸ ἅγιον
  choice: 圣物
  rationale: 原文是中性单数名词化形容词，所指并未明说；译作“圣物”保留这种含混，不擅自解释为圣言、律法或圣者。
theological_decisions:
- issue: τὸ ἅγιον 的所指
  choice: 圣物
  alternative: 圣言／圣洁之事／圣者
  rationale: 希腊语仅称“那圣的〔事物〕”，上下文本句本身不足以确定具体所指；因此不将其教义化或人格化。
- issue: ληφθήσεται 的语义与文本状态
  choice: 必……被领受
  alternative: 必被取来／必被接受／必被领会
  rationale: 保留现存读法的被动结构及“接受、领受”的基本语义，同时以脚注说明该词在版本中被标为疑难，避免制造虚假的确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式尽量对应原文并列结构；以分号分隔职分名单与后半句。保留“口”的源语意象，但补出“所言”以避免汉语生硬。
