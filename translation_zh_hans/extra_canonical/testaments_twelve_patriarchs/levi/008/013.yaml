lexical_decisions:
- source_word: ὁ δεύτερος
  choice: 第二位
  rationale: 以“位”指称前文所涉及的人，既保留序次含义，也比单说“第二个”更庄重自然。
- source_word: ἔσται
  choice: 将……在
  rationale: 保留将来时；与介词短语合译为“将在……中”。
- source_word: ἐν ἱερωσύνῃ
  choice: 在祭司职分中
  rationale: ἱερωσύνη表示祭司身份、职任或祭司制度；“祭司职分”能自然表达其职任含义，而“中”保留ἐν的结构，不额外断定是任职、归属还是活动领域。
theological_decisions:
- issue: ἱερωσύνη所指是祭司职任还是祭司群体
  choice: 祭司职分
  alternative: 祭司群体；祭司职位
  rationale: 原文抽象名词较自然地指祭司身份或职任。“祭司职分”不把它具体化为某个职位，也不强行解释为一个群体。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，基本对应原文语序，并保留“在……中”所具有的轻微语义开放性。
