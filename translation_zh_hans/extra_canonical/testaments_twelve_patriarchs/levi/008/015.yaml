  text: And his appearance is beloved, like a prophet of the Most High, from the seed of Abraham our father.
translation:
  language: zh_hans
  text: 他的显现令人喜爱；他如同一位至高者的先知，出于我们祖先亚伯拉罕的血脉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσία
  choice: 显现
  rationale: 此处指人物的出现或临到；译作“显现”既符合上下文，也避免现代汉语中“在场”过于抽象。
- source_word: ἀγαπητή
  choice: 蒙爱的
  rationale: 保留被爱、受喜爱的含义，并不擅自补出施爱者。
- source_word: ὡς προφήτης ὑψίστου
  choice: 如同至高者的先知
  rationale: 保留ὡς的比较语气，不将其强化为直接身份断言。
- source_word: ἐκ σπέρματος Ἀβραὰμ
  choice: 出自……亚伯拉罕的后裔
  rationale: σπέρμα在谱系语境中指后裔或血脉；现代汉语用“后裔”自然清楚。
- source_word: τοῦ πατρὸς ἡμῶν
  choice: 我们祖先
  rationale: “祖先”在汉语谱系语境中比字面“父亲”更自然，并准确表达亚伯拉罕作为共同先祖的身份。
theological_decisions:
- issue: ὡς所表达的是比较还是身份认定
  choice: 译作“如同”，保留比较语气
  alternative: 译作“作为至高者的先知”
  rationale: 原文使用ὡς，可能带比较或角色描述色彩；不宜无依据地消除其张力。
- issue: ἀγαπητή是否补明蒙谁所爱
  choice: 不补明施爱者
  alternative: 译作“蒙上帝所爱”
  rationale: 原文只说“蒙爱的／可爱的”，未明说施爱主体，故保持含义开放。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。用分号理顺原句较紧凑的述谓与比较结构，同时不增添原文未明说的神学信息。
