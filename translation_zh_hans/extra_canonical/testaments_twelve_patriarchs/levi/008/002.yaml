base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/002.yaml
  text: And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the breastpiece of understanding, and the full-length robe of truth, and the plate of faith, and the turban for the head, and the ephod of prophecy.”
translation:
  language: zh_hans
  text: 我看见七个身穿白衣的人对我说：“起来，穿上祭司职分的礼袍、正义的冠冕、悟性的胸牌、真理的长袍、信心的额牌、头上的头巾，以及预言的以弗得。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσθῆτι λευκῇ
  choice: 身穿白衣
  rationale: 自然表达其身着白色衣服的形象，不额外限定衣料或样式。
- source_word: στολὴν τῆς ἱερατείας
  choice: 祭司职分的礼袍
  rationale: στολή指庄重礼服，ἱερατεία指祭司职分；译文兼顾服饰意象与职分含义。
- source_word: στέφανον τῆς δικαιοσύνης
  choice: 正义的冠冕
  rationale: 保留属格结构及象征性，不将δικαιοσύνη窄化为个人品德或法庭称义。
- source_word: λόγιον τῆς συνέσεως
  choice: 悟性的胸牌
  rationale: λόγιον在祭司服饰语境中指胸牌；σύνεσις指领悟、明辨的能力，译作“悟性”简洁且保留抽象意涵。
- source_word: ποδήρη τῆς ἀληθείας
  choice: 真理的长袍
  rationale: ποδήρης意为垂至脚部的衣袍；“长袍”符合现代汉语且避免生硬直译。
- source_word: πέταλον τῆς πίστεως
  choice: 信心的额牌
  rationale: πέταλον在祭司服饰中指佩于额前的金属牌；“额牌”明确其物件和位置。
- source_word: μίτραν τῆς κεφαλῆς
  choice: 头上的礼冠
  rationale: μίτρα是包头式祭司头饰；“礼冠”比现代日常语中的“头巾”更符合礼仪语境，同时将可疑属格自然表达为位置。
- source_word: ἐφοὺδ τῆς προφητείας
  choice: 预言的以弗得
  rationale: ἐφούδ为希伯来祭司服饰借词，采用中文圣经传统音译“以弗得”；保留“预言”的象征性属格。
theological_decisions:
- issue: 七件祭司服饰与抽象德性的关系
  choice: 逐项保留“X的Y”结构
  alternative: 将其解释为分别象征正义、悟性、真理、信心和预言的服饰
  rationale: 原文以属格并列，既可表达属性、象征或关联；直保结构可避免替作者确定单一神学关系。
- issue: δικαιοσύνη的语义
  choice: 正义
  alternative: 公义／称义
  rationale: 此处是象征性服饰清单，原文未明确限定为道德、司法或救恩论意义；“正义”保留较宽语域。
- issue: πίστις的语义
  choice: 信心
  alternative: 信实／忠诚
  rationale: πίστις本身可涵盖信靠与忠信；此处与额牌相连而无进一步限定，正文采用通行的“信心”，不引入特定教义解释。
- issue: προφητεία的语义
  choice: 预言
  alternative: 说预言的恩赐／先知职分
  rationale: 原文仅用抽象名词，不明确指能力、活动还是职分，因此不作扩展。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；并列七件服饰时保持仪式性节奏。祭司专名“以弗得”沿用通行译法，其余词语尽量使用普通读者可理解的现代用语。
