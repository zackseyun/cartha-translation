  language: zh_hans
  text: 我们在那里度过七十天以后，我又在那里看见了一个异象，和先前的一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅραμα
  choice: 异象
  rationale: 指在启示性经历中所见的景象；“异象”既符合本段语境，也保留了原词的宗教意味。
- source_word: ποιῆσαι…ἡμέρας ἑβδομήκοντα
  choice: 度过七十天
  rationale: 这是表达一段时间经过的习惯说法；译为“度过七十天”比逐字译作“做七十天”自然，并准确传达原意。
- source_word: ὡς τὸ πρότερον
  choice: 和先前的一样
  rationale: 保留比较关系，不额外断定这里所指异象在每个细节上都完全相同。
