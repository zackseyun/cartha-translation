  text: And the third put on me a linen garment, like an ephod.
translation:
  language: zh_hans
  text: 第三位给我穿上一件细麻衣，样式像以弗得。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυσσίνην
  choice: 细麻衣
  rationale: 此处形容词名词化，指细麻制成的衣服；译作“细麻衣”自然、准确。
- source_word: μοι περιέθηκεν
  choice: 给我穿上
  rationale: περιτίθημι表示把衣物加在某人身上；结合间接受词μοι，现代汉语以“给我穿上”最自然。
- source_word: ὁμοίαν ἐφούδ
  choice: 样式像以弗得
  rationale: ὁμοίαν与阴性“细麻衣”呼应，表示相似；ἐφούδ是希腊文对希伯来祭司服饰名称的音译，保留传统名称“以弗得”。
theological_decisions:
- issue: 细麻衣与以弗得的关系
  choice: 译为“样式像以弗得”，仅表达相似性
  alternative: 译为“就是以弗得”或“作为以弗得”
  rationale: 原文使用ὁμοίαν（像、相似），没有把这件衣服直接等同于以弗得；应保留两者之间的区别。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留“以弗得”这一已通行的圣经服饰名称，不另加解释性内容。
