  text: And the first anointed me with holy oil and gave me a priestly staff.
translation:
  language: zh_hans
  text: 第一位用圣油膏我，又赐给我一根杖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本依上下文译作“祭司杖”；希腊文直译仅为“杖”。
    reason: 说明原文与英文咨询层之间的差异，同时不在正文中消除语义余地。
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: 第一位
  rationale: 保留原文以序次指称人物的表达；上下文若已交代人物身份，此处无需补明。
- source_word: ἤλειψέ με ἐλαίῳ ἁγίῳ
  choice: 用圣油膏我
  rationale: “膏”准确传达以油涂抹并具有礼仪分别意义的动作，也符合现代中文经文语体。
- source_word: ῥάβδον
  choice: 一根杖
  rationale: 希腊文仅指杖，并未明说“祭司的”；不采纳英文咨询层所补的 priestly，以免把语境推断写入正文。
theological_decisions:
- issue: ῥάβδον 是否应译作“祭司杖”
  choice: 正文译“一根杖”
  alternative: “一根祭司杖”
  rationale: 原文没有修饰语“祭司的”。虽然上下文可能赋予祭司职分的象征意义，正文仍保留词面宽度，并以脚注说明英文咨询层的理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第一位”照应一组依次行动的人物；“圣油”与“膏我”保留礼仪色彩。
