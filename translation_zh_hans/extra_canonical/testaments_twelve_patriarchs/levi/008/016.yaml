  text: '*Πᾶν οὖν ἐπιθυμητὸν⁸⁶ ἐν Ἰσραὴλ⁸⁷ σοὶ⁸⁸ ἔσται καὶ τῷ σπέρματί σου⁸⁹, καὶ ἔδεσθε⁹⁰ πᾶν ὡραῖον ἐν⁹¹ ὁράσει, καὶ τὴν τράπεζαν Κυρίου διανεμεῖται⁹² τὸ σπέρμα σου⁹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/016.yaml
  text: Therefore every desirable thing in Israel will be for you and for your seed, and you will eat every beautiful thing for the eye, and your seed will apportion the table of the Lord.
translation:
  language: zh_hans
  text: 所以，凡以色列中可羡慕的，都必归你和你的后裔；你们必吃一切悦目的；你的后裔必分配主的桌子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμητόν
  choice: 可喜爱的
  rationale: 表达“令人向往、值得渴望”的含义，同时保留原文较宽泛的指涉。
- source_word: σπέρμα
  choice: 后裔
  rationale: 此处指利未的子孙群体；现代汉语用“后裔”比直译“种子”自然，也保留集体意义。
- source_word: πᾶν ὡραῖον ἐν ὁράσει
  choice: 一切看起来美好的
  rationale: 按所给希腊文本的 ἐν ὁράσει（在观感或外观上）翻译，不采用修订记录中提到、但本版原文并未出现的 ἐν δράσει。
- source_word: τὴν τράπεζαν Κυρίου διανεμεῖται
  choice: 分配主的筵席
  rationale: διανέμω 表示分发、分配；τράπεζα 在此可指摆设食物的席面或筵席，译法保留其祭司职分语境及原文意象。
theological_decisions:
- issue: “主的筵席”的具体所指
  choice: 保留“主的筵席”这一意象，不解释为某一种特定祭物或礼仪职务
  alternative: 译作“分配献给主的祭物”或“料理主的祭坛”
  rationale: 原文 τράπεζα 本义为桌子、席面，语境可能涉及祭司对圣物的管理，但未明确限定为祭坛或某类祭物，因此不在正文中收窄其含义。
- issue: 第二个动词的主语
  choice: 译为“你们必吃”
  alternative: 依上下文意译为“你的后裔必吃”
  rationale: 所给希腊文本 ἔδεσθε 是第二人称复数，故正文保留复数“你们”；虽然前句直接提到“你和你的后裔”，此形式仍不宜被无声改成单数集体主语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以”承接上文；“归你和你的后裔”简洁表达所有或享有关系；整体尽量保留希腊文的并列结构与末世性应许语气。
