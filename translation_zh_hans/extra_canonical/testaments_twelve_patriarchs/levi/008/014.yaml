source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ὁ δὲ⁷⁵ τρίτος *ἐπικληθήσεται αὐτῷ ὄνομα καινόν⁷⁶, ὅτι βασιλεὺς †ἐκ τοῦ†⁷⁷ Ἰούδα ἀναστήσεται καὶ ποιήσει *ἱερατείαν νέαν, κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη⁷⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/014.yaml
  text: And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, according to the pattern of the nations, for all the nations.
translation:
  language: zh_hans
  text: 第三位将被冠以一个新名，因为有一位王将从犹大[a]兴起，并设立新的祭司职分，照着列国的模式，为万国而设。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从”所对应的希腊词组在本节所据底本中标为存疑。
    reason: 底本以匕首号标记ἐκ τοῦ，需向读者说明其文本不确定性，而不擅自删除正文读法。
lexical_decisions:
- source_word: ἐπικληθήσεται αὐτῷ ὄνομα καινόν
  choice: 将被冠以一个新名
  rationale: 保留被动语态和“新名”的意象，同时比逐字译作“一个新名将被称给他”更符合现代汉语。
- source_word: βασιλεὺς … Ἰούδα ἀναστήσεται
  choice: 有一位王将从犹大兴起
  rationale: “兴起”直接对应ἀναστήσεται，也保留其可能兼有出现、被兴起之意。
- source_word: ποιήσει ἱερατείαν νέαν
  choice: 设立新的祭司职分
  rationale: ἱερατεία指祭司职任或祭司制度；此处用“祭司职分”避免误解为单个祭司，也不预先限定其具体制度形态。
- source_word: κατὰ τὸν τύπον τῶν ἐθνῶν
  choice: 照着列国的模式
  rationale: 直译κατά与τύπος，保留原文颇为突兀、可能存在解释张力的表达，不擅自改成“给列国作榜样”。
- source_word: εἰς πάντα τὰ ἔθνη
  choice: 为万国而设
  rationale: 将εἰς表达为目的或指向关系；“万国”简洁庄重，指所有民族。
theological_decisions:
- issue: “列国的模式”与“为万国”之间的关系
  choice: 照着列国的模式，为万国而设
  alternative: 作为万国的典范，临到万国
  rationale: 希腊文明确为κατὰ τὸν τύπον τῶν ἐθνῶν，最直接的句法是“照着列国的模式”；即使其神学含义不寻常，也不以较顺畅的解释性译法取代原文。
- issue: 新的ἱερατεία的性质
  choice: 新的祭司职分
  alternative: 新的祭司制度／新的祭司体系
  rationale: “祭司职分”较能涵盖职任与制度两种可能，不把经文限定为某一特定教会制度或宗派教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“第三位”“新名”“兴起”“万国”保留经文式语感；对原文不寻常的“照着列国的模式”不作神学性润饰。
