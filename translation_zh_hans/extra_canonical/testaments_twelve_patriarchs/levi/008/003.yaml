base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/003.yaml
  text: And each one of them was carrying something, and they placed it on me and said to me, “From now on, become a priest—you and all your seed.”
translation:
  language: zh_hans
  text: 他们每个人都拿着一样东西，把它放在我身上，对我说：“从今以后，你和你所有的后裔要成为祭司。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάζοντες
  choice: 拿着
  rationale: 表达携带、持有之意；原文未明说所拿的宾语，因此按逐人分配的语境补作“一样东西”，避免误指为前文特定的若干物件。
- source_word: ἐπέθηκαν μοι
  choice: 把它放在我身上
  rationale: 保留“放置于我”的动作及授职场景，语气庄重而自然；“它”承接为每人所拿之物。
- source_word: γενοῦ εἰς ἱερέα
  choice: 你要作祭司
  rationale: 该结构表示进入或承担祭司身份；用现代汉语自然表达命令语气，并保留“从今以后”的时间起点。
- source_word: πᾶν τὸ σπέρμα σου
  choice: 你所有的后裔
  rationale: σπέρμα在此指家系后代；“后裔”比直译“种子”更符合现代汉语，同时保留整体性。
theological_decisions:
- issue: 祭司身份是否只授予利未本人
  choice: “你和你所有的后裔都要如此”明确涵盖利未及其全部后裔
  alternative: 可直译为“你和你所有的后裔”，不补“都要如此”
  rationale: 原文以并列成分“你和你所有的后裔”延续“作祭司”的命令；补出“都要如此”只是使汉语谓语关系清楚，并未缩小或扩大神学范围。
- issue: 各人所携之物的具体所指
  choice: 保持不确定，仅译“一样东西”
  alternative: 译作“这些东西”或根据上下文指明具体礼仪物件
  rationale: 希腊文本在βαστάζοντες之后没有明示宾语，不宜据解释传统擅自具体化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作祭司”保留经文语体；破折号呈现原文对“你和你所有的后裔”的强调。原文分词在数的一致关系上不规则，译文按语义理解为他们每个人各自拿着某物。
