review_pass:
  verdict: revise
  source_fidelity: “后裔”准确传达τὸ σπέρμα σου在此处的后代、族裔含义。“三个支系”虽可通，却较具体地暗示宗族谱系的支派；ἀρχάς与διαιρεθήσεται仅明确说分成三部分，宜用更中性的“三部分”。原文ἐπερχομένου在性、数、格上直接修饰Κυρίου，明确是“将要来临的主”，不宜将其压缩为可能歧义且不够自然的“主将临”。
  naturalness: 原译整体庄重流畅，但“主将临之荣耀”是较生硬的文言式属格串联。改为“将要来临的主的荣耀”在现代标准汉语中清楚、自然，仍保有庄重语体。
  terminology: “主”对应Κυρίου，保持原文称谓而不加入特定教义性身份。“标记”对应σημεῖον恰当。“后裔”适合σπέρμα。以“部分”对应原文未具体界定的三项，避免把它定为职分、等级或固定支派。
  issues:
  - severity: medium
    issue: “主将临之荣耀”对ἐπερχομένου的句法关系表达不清。
    rationale: ἐπερχομένου为阳性属格分词，直接与Κυρίου一致，意思是“将要来临的主”，而非“将要临到的荣耀”；现有压缩表达在汉语中会产生修饰范围模糊。
  - severity: low
    issue: “三个支系”略微收窄ἀρχάς的含义。
    rationale: 原文和英文审校层保留为“three divisions”，未界定为宗族支系。用“三部分”更好地保留其开放性。
  revised_text: 他们对我说：“利未，你的后裔将分为三个部分，作为将要来临的主的荣耀的标记。”
