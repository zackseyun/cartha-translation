base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/011.yaml
  text: And they say to me, “Levi, your seed will be divided into three divisions, as a sign of the glory of the Lord who is coming.”
translation:
  language: zh_hans
  text: 他们对我说：“利未，你的后裔将分为三个部分，作为将要来临的主的荣耀的标记。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσι
  choice: 他们对我说
  rationale: 希腊文为历史现在时；汉语叙事中用“说”自然简洁，不额外强调时态。
- source_word: τὸ σπέρμα σου
  choice: 你的后裔
  rationale: σπέρμα字面为“种子”，此处指利未的子孙后代，译作“后裔”符合现代庄重汉语。
- source_word: εἰς τρεῖς ἀρχὰς διαιρεθήσεται
  choice: 将分为三个支系
  rationale: διαιρεθήσεται表示“将被划分”，ἀρχάς在此语境所指并不完全确定；“支系”保留群体分支之意，又避免擅自落实为“职分”或“官职”。
- source_word: εἰς σημεῖον
  choice: 作为……的标记
  rationale: εἰς在此表示结果或作用；“作为……的标记”符合汉语表达，并贴近原文。
- source_word: δόξης Κυρίου ἐπερχομένου
  choice: 主将临之荣耀
  rationale: 属格结构在语法上可能修饰“主”或表达即将来到的荣耀；此译采用“将临”修饰“主”，与来源标点及英语审校层一致，同时以凝练结构保留庄重感。
theological_decisions:
- issue: ἐπερχομένου的修饰对象
  choice: 理解为“将临的主”，译作“主将临之荣耀”
  alternative: “即将来临的主的荣耀”或“主那将要临到的荣耀”
  rationale: ἐπερχομένου与Κυρίου同为阳性属格，语法上最直接地修饰“主”；但整个属格短语仍有一定表达张力，故不用更具解释性的弥赛亚称谓。
- issue: ἀρχάς是否指三种宗教职分
  choice: 译作“三个支系”
  alternative: “三个职分”或“三个等级”
  rationale: 原文本身没有明确列出职分，译为“职分”会加入制度性解释；“支系”较中性地呈现后裔被分为三部分。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保持预言性与直接引语的简洁，不增补原文未明说的身份或教义解释。
