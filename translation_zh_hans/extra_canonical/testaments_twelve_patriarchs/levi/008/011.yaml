  rationale: 调整“三个支系”为“三个部分”，以保留ἀρχάς所指未定的概括性；将末语改为“将要来临的主的荣耀”，明确呈现ἐπερχομένου修饰Κυρίου的希腊文语法关系，并改善现代汉语的清晰度和自然度。
