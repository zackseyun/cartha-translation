base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/005.yaml
  text: And the second washed me with the Lord's pure water, and fed me holy bread and wine, and put around me a holy and glorious robe.
translation:
  language: zh_hans
  text: 第二位用主的洁净之水洗了我，又给我吃圣洁的饼、喝圣洁的酒，并给我披上圣洁而荣耀的袍服。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: 第二位
  rationale: 保留原文按次序指称人物的表达；上下文未在本节重述其身份，因此不擅自补明。
- source_word: ὕδατι κυρίου καθαρῷ
  choice: 主的洁净之水
  rationale: 将属格 κυρίου 自然理解为归属或来源，同时保留 καθαρῷ 对“水”的修饰。
- source_word: ἐψώμισέν με ἄρτον καὶ οἶνον ἅγιον
  choice: 给我吃圣洁的饼、喝圣洁的酒
  rationale: ἐψώμισεν 表示喂食或供给食物；汉语按饼与酒的通常搭配分别用“吃、喝”。ἅγιον 在现有文本中可关联饼和酒，译文以重复形容词清楚表达二者皆为圣洁。
- source_word: περιέθηκε μοι στολὴν
  choice: 给我披上……袍服
  rationale: περιτίθημι 在此指把衣袍披在某人身上；“披上”比直译“围在我身上”更符合现代汉语。
- source_word: ἁγίαν καὶ ἔνδοξον
  choice: 圣洁而荣耀的
  rationale: 分别对应“圣洁”与“荣耀/荣美”，保留并列修饰及庄重语体。
theological_decisions:
- issue: “饼和酒”是否采用圣餐术语
  choice: 按普通词义译作“圣洁的饼、圣洁的酒”
  alternative: 译作带有明确礼仪色彩的“圣饼和圣酒”
  rationale: 原文虽有宗教礼仪意象，但本节未明确指定后世某一圣礼体系；采用较直接措辞，避免导入特定宗派解释。
- issue: κυρίου 所表达的关系
  choice: 译作“主的洁净之水”
  alternative: “从主而来的洁净之水”或“属于主的洁净之水”
  rationale: 希腊语属格可容纳归属或来源等关系；简洁的“主的”保留这种开放性，不强行限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原文仪式性意象，不添加解释性称谓或宗派术语。
