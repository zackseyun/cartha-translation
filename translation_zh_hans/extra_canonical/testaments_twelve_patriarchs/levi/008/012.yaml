  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/012.yaml
  text: And the first lot will be great, and no other will arise above it.
translation:
  language: zh_hans
  text: 第一签将为大；不会有别的签兴起在它之上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρῶτος κλῆρος
  choice: 第一签
  rationale: κλῆρος在这里指拈阄所得的签或份；结合上下文的序列，以“第一签”简洁保留其抽签意象，不提前解释其所代表的职分。
- source_word: μέγας
  choice: 大的
  rationale: 按其基本义直译为“大的”，保留原文可能兼含重要、尊大的开放性。
- source_word: οὐ γενήσεται ἕτερος
  choice: 再没有别的签会兴起
  rationale: 补出汉语所需的中心语“签”；以“兴起”表达γενήσεται在此处“出现、兴起”的动态语感，并明确保留ἕτερος“别的”。
- source_word: ὑπὲρ αὐτόν
  choice: 超过它
  rationale: 表达“在它之上”的比较含义，同时避免生硬的空间性直译。
theological_decisions:
- issue: κλῆρος所指的具体身份或职分
  choice: 保留为“签”
  alternative: 译作“位分”或直接说明其代表的祭司职分
  rationale: 本句本身未明说该签具体代表什么；保留抽签用语可避免将上下文解释直接写入正文。
- issue: μέγας与ὑπὲρ所表达的优越性
  choice: 分别译为“大的”和“超过它”
  alternative: 译为“最尊大”或“比它更伟大”
  rationale: 原文先陈述第一签为“大”，再说没有别的在其上；不把二者合并为最高级，以保留原句结构和张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“签”的古代抽签意象，并用“兴起，超过它”呈现原文后半句的动态比较结构。
