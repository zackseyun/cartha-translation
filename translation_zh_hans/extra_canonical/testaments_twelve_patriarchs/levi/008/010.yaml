base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/010.yaml
  text: And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.
translation:
  language: zh_hans
  text: 第七位把祭司职分的冠冕戴在我头上，又使我双手盛满香，好叫我向主上帝履行祭司职务。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάδημα ἱερατείας
  choice: 祭司职分的冠冕
  rationale: διάδημα指冠冕或王冠；属格ἱερατείας表明它象征祭司职分。译文保留具体意象及职分含义。
- source_word: ἐπλήρωσε τὰς χεῖράς μου θυμιάματος
  choice: 使我的双手盛满香
  rationale: 按希腊文直译其礼仪性动作，避免将可能具有授职意味的表达仅释作抽象的“委任”。
- source_word: ἱερατεύειν
  choice: 作祭司
  rationale: 该动词意为履行祭司职务；用“作祭司”自然清楚，并保留职分意义。
- source_word: Κυρίῳ, τῷ θεῷ
  choice: 在主上帝面前
  rationale: 与ἱερατεύειν连用时，间接受格表示事奉的对象；“在……面前”也延续英文审校层所呈现的礼仪场景。称号合译为“主上帝”。
theological_decisions:
- issue: “盛满双手”是否应解释为祭司授职
  choice: 保留“使我的双手盛满香”的具体措辞
  alternative: 译为“授予我祭司职分”或“使我承接圣职”
  rationale: 原文明确提到香，既呈现礼仪动作，也可能暗含授职背景；直译可保留这种张力，不以解释取代文本。
- issue: Κυρίῳ, τῷ θεῷ的句法关系
  choice: 译作“在主上帝面前作祭司”
  alternative: 译作“作主上帝的祭司”或“事奉主上帝”
  rationale: 原文可自然理解为向主上帝履行祭司职务；现译保留祭司在神面前供职的空间与礼仪色彩，同时不引入额外宗派含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“第七位”承接上下文中人物次序；“冠冕”“香”“作祭司”保留原文礼仪意象。无脚注标记，因为本节不需另设文本或译法说明。
