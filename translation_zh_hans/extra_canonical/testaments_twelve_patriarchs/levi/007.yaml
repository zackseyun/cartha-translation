  text: And I said to my father Jacob[a], “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you. For from this day the city called Sychem shall be a city of fools. For just as one mocks a fool, so we mocked them, because they indeed committed folly in Israel by defiling my sister. Then, after taking her up[b], we came to Bethel.”
translation:
  language: zh_hans
  text: '第七章


    我对父亲雅各说：“在你身上，主必使迦南人归于无有，并把他们的土地赐给你和你之后的后裔。从今日起，那座名叫示剑[a]的城必成为愚昧人的城；因为人怎样嘲弄愚昧人，我们也照样嘲弄了他们。他们玷污了我的妹妹，实在是在以色列中做了愚妄的事。随后，我们把她带走后，来到伯特利。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示剑”按本希腊文本的名称形式也可音译为“叙肯”；这里采用中文读者较熟悉的地名译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουδενώσει
  choice: 使……归于无有
  rationale: 该动词可表示使之变得微不足道、彻底贬抑或化为无有；此处涉及迦南人的败落，译文保留其强烈而不具体化为某一种军事行动。
- source_word: σπέρματί
  choice: 后裔
  rationale: 原义为“种子”，在族长应许语境中指后代。现代汉语用“后裔”既自然庄重，也保留土地赐予雅各后代的应许意味。
- source_word: ἀσυνέτων
  choice: 愚昧人的
  rationale: 与“城”构成“愚昧人的城”，并与下文的“愚昧人”和“愚妄”形成有意的词义呼应。
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: 嘲弄／嘲弄了
  rationale: 以同一个汉语动词保留希腊文比较句中的词汇复现和讥讽语气。
- source_word: ἀφροσύνην
  choice: 愚妄的事
  rationale: 表达具有道德意味的愚蠢行为，也呼应“愚昧人的城”，不额外加入原文未明说的法律或性行为术语。
- source_word: μιάναντες
  choice: 玷污了
  rationale: 该词兼有道德和礼仪上的污秽意味；“玷污”保留这种宗教伦理色彩，同时避免比原文更明确地界定行为。
- source_word: Ἀπάραντες
  choice: 带上她
  rationale: 依本版校定及上下文，将分词理解为带底拿离开后前往伯特利；因词形和句法仍有歧义，脚注列出“离开那里”的可能译法。
- source_word: Σύκημα
  choice: 示剑
  rationale: 采用现代中文圣经传统中广为人知的地名形式；脚注说明希腊文所用名称形式。
- source_word: Βεθήλ
  choice: 伯特利
  rationale: 采用现代中文读者熟悉的标准圣经地名译法。
theological_decisions:
- issue: 利未对雅各所说的土地与后裔应许
  choice: 明确保留主赐土地给雅各及其后裔的应许结构
  alternative: 将其泛化为对雅各一族得胜的预言
  rationale: 希腊文明确包含主、赐地、雅各及其后裔等要素；译文不削弱这种族长应许的神学质地，也不引入后来的教义解释。
- issue: 示剑人行为的道德与宗教定性
  choice: 译为“玷污了我的妹妹”及“在以色列中做了愚妄的事”
  alternative: 译为更社会性的“羞辱”，或直接增译为明确的性暴力术语
  rationale: “玷污”和“愚妄”忠实呈现原文的道德—宗教判断，同时不把上下文含义扩写成希腊文本身未明说的具体措辞。
- issue: “主必借着你使迦南人归于无有”中雅各的角色
  choice: 保留“借着你”
  alternative: 译作“在你里面”或弱化为“为你”
  rationale: ἐν σοί 可有“在你里面”或“借着你”的幅度；结合对雅各及其后裔的讲话，“借着你”较自然，但仍不把实现方式限定为雅各本人亲自行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“归于无有”“后裔”“愚妄”“玷污”等词保留族长应许和道德评判的经文语域；人名、族名和地名采用现代中文圣经中通行的形式。
