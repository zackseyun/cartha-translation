review_pass:
  verdict: revise
  source_fidelity: 首句ἐν σοί直译为“在你里面／在你身上”，草稿的“借着你”虽可作解释，却较明确地限定为工具性关系；宜改为“在你身上”，保留原文幅度。第二节中“名叫示剑的城”是λεγομένη所修饰的对象，而“愚昧人的城”是其将成为的性质；草稿“必称为”会使后者也像名称，宜改为“必成为”。其余内容忠实保留了迦南人受挫、土地与后裔、嘲弄的词汇呼应，以及“玷污／愚妄”的道德—礼仪语域。
  naturalness: 修订后“在你身上，主必使……”和“那座名叫示剑的城必成为……”在现代庄重汉语中自然清晰。“把她带走后”比“带上她”更明确体现动作后的离去，同时仍以脚注保留分词指涉及句法的不确定性。
  terminology: “主”“迦南人”“后裔”“示剑”“伯特利”均合乎通行中文圣经语境；“愚昧人的城／愚昧人／愚妄的事”保留原文的修辞关联。“玷污”恰当传达μιάναντες的道德和礼仪污染含义，而不越过原文具体化行为。
  issues:
  - severity: medium
    issue: “主必借着你”将ἐν σοί限定为工具性。
    rationale: 原文介词短语可表“在你里面／在你身上”，英语审计文本也保留“In you”。译为“在你身上”更贴近且不预断实现方式。
  - severity: medium
    issue: “必称为‘愚昧人的城’”混淆名称与谓语性质。
    rationale: “名叫示剑”对应λεγομένη；πόλις ἀσυνέτων意为“愚昧人的城”。应译作“必成为愚昧人的城”。
  - severity: low
    issue: “带上她”略显口语且未充分表达ἀπάραντες的离去动作。
    rationale: 在采纳英语审计文本所依据的“带走底拿”理解时，“把她带走后”更自然；脚注须继续说明此处文本与句法有歧义。
