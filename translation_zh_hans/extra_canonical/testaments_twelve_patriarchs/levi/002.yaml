  text: 1[a]. I, Levi, was born in Haran, and I came with my father to Shechem. 2. And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor. 3[b]. And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers. 4. And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved. 5. Then sleep fell upon me, and I saw a high mountain, and I was on it. 6. And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi[c], enter.”
translation:
  language: zh_hans
  text: '《利未遗训》第二章


    1 我利未生在哈兰，后来随父亲来到示剑。2 那时我还年轻，约二十岁；我便和西缅一起，为我们的妹妹底拿向哈抹施行报复。3 我在亚伯玛乌放牧时，从主而来的明辨之灵临到我。我看见所有人都在毁坏自己的道路[a]；罪恶正被建造在墙上，不义坐在高塔之上。4 我为世人之族类[b]忧伤，便向主祷告，求他拯救我。5 随后，沉睡临到我；我看见一座高山，我就在那山上。6 看哪，诸天开了[c]，主的一位天使对我说：“利未，利未，进来。”


    [a] “毁坏自己的道路”直译原文的形象，指人毁坏、败坏自己的生活道路或行为。


    [b] “世人之族类”保留了原文“人的众子之族类”这一庄重的闪语式表达，泛指全人类。


    [c] “诸天开了”是启示异象中常见的表达；类似说法也见于圣经及其他犹太异象文献。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁坏自己的道路”直译原文的形象，指人毁坏、败坏自己的生活道路或行为。
    reason: 说明“道路”的道德行为隐喻，并保留ἀφανίζω的强烈词义。
  - marker: b
    text: “世人之族类”保留了原文“人的众子之族类”这一庄重的闪语式表达，泛指全人类。
    reason: 解释原文带闪语色彩的人类统称。
  - marker: c
    text: “诸天开了”是启示异象中常见的表达；类似说法也见于圣经及其他犹太异象文献。
    reason: 说明启示文学惯用语及其文献背景。
lexical_decisions:
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: 施行报复
  rationale: 保留利未参与报复性暴力的主动、强烈语气，同时采用现代汉语中自然而庄重的表达。
- source_word: νεώτερος
  choice: 还年轻
  rationale: 结合“约二十岁”的自述背景，表达相对年轻的状态，比直译为“较年轻”更自然。
- source_word: πνεῦμα συνέσεως
  choice: 悟性之灵
  rationale: 保留原文不带冠词的开放性，表达从主而来的领悟与辨识能力，不擅自明确等同于作为专名的圣灵。
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: 毁坏自己的道路
  rationale: 紧贴动词“毁坏、消灭”的力度，也保留“道路”作为生活方式和行为的圣经式隐喻。
- source_word: ἁμαρτία ... οἰκοδομεῖτο
  choice: 罪恶正在墙上被建造起来
  rationale: 保留原文的被动、持续状态和建筑意象，不将其解释性改写为一般的“罪恶增多”。
- source_word: ἀδικία ἐκάθητο
  choice: 不义坐在高塔之上
  rationale: 保留“不义”被人格化并安坐高处的鲜明图像。
- source_word: γένος τῶν υἱῶν τῶν ἀνθρώπων
  choice: 世人这一族类
  rationale: 以可懂的现代汉语传达全人类，同时借“族类”保留原文庄重而带闪语色彩的表达。
- source_word: ὅπως σωθῶ
  choice: 求他拯救我
  rationale: “拯救”兼容脱离危险与神学上的救恩含义，不把语义收窄为单纯的身体保全。
- source_word: ἐπέπεσέ με ὕπνος
  choice: 沉睡临到我
  rationale: 保留睡眠作为临到主体之事的生动异象叙事用语，而不弱化为普通的“我睡着了”。
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: 诸天开了
  rationale: 保留希腊文复数“诸天”及启示文学的庄严语感。
theological_decisions:
- issue: πνεῦμα συνέσεως的性质
  choice: 译作“从主而来的悟性之灵”，不明确将其作为圣灵的专名
  alternative: “悟性之圣灵”或“那悟性之灵”
  rationale: 原文并未使用足以要求后期教义性专名解读的形式；译文保留神圣来源，也保留其所指的开放性。
- issue: σωθῶ在祷告中的含义
  choice: 拯救我
  alternative: 解救我；保全我
  rationale: 上下文既涉及人类道德败坏，也涉及利未个人求救；“拯救”能够保留现实解救与神学救恩之间的语义张力。
- issue: ἄγγελος Κυρίου的表达
  choice: 主的一位天使
  alternative: 主的使者
  rationale: 异象语境支持“天使”，而“一位”自然反映希腊文未带冠词的表达，不将其处理成必须具有专名性质的“主的使者”。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。叙事句式保持简洁，异象段落保留“沉睡临到”“诸天开了”等较高语体；对建筑与人格化意象尽量直译，不以解释性措辞消解原文的陌生感。
