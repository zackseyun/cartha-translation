  source_fidelity: 整体忠实呈现了希腊文本的叙事、异象意象与神学开放性；人名、地名及“诸天”“主的一位天使”等亦无实质偏离。第2节的报复性行动没有被淡化。第3节“罪恶正在墙上被建造起来”虽基本对应原文被动建筑隐喻，但中文搭配略显生硬，可在不解释意象的前提下调整。
  naturalness: 译文总体庄重清楚，但“世人这一族类”在现代汉语中不够自然；“悟性之灵”及“正在墙上被建造起来”也略有翻译腔。作有限措辞修订可提高可读性，同时保留原文的陌生而庄严的图像。
  terminology: “施行报复”“不义”“拯救”“诸天”均恰当。“明辨之灵”比“悟性之灵”更合现代汉语，也不将πνεῦμα συνέσεως教义化为“圣灵”。“世人之族类”保留原文庄重、带闪语色彩的重复性称谓，较“世人这一族类”顺畅。
