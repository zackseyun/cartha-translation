  - severity: low
    issue: “悟性之灵”不够符合当代庄重汉语惯用搭配。
    rationale: “明辨之灵”可表达σύνεσις的理解、辨识能力，且仍保留非专名、非教义化的“灵”。
  - severity: low
    issue: “罪恶正在墙上被建造起来”语序略拗口。
    rationale: 改为“罪恶正被建造在墙上”更符合汉语语序，同时完整保留原文被动、进行性及建筑意象。
