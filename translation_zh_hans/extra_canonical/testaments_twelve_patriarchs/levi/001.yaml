base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001.yaml
  text: 'A copy of the words of Levi, which he ordained for his sons concerning all that they would do, and what would happen to them[a] until the day of judgment.


    For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: zh_hans
  text: '雅各与利亚的第三个儿子利未的遗训


    1 以下是利未话语的抄本，记载他为众子所作的嘱咐，论到他们将要做的一切，以及直到审判之日将要临到他们的一切[a]。


    2 他召众子到自己跟前时，身体还很健康；但他得了启示，知道自己将要死去。他们聚集以后，他就对他们说：'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将要发生在他们身上的一切。”希腊语的惯用表达直译为将要“遇见”他们的事。
    reason: 说明 συναντήσει αὐτοῖς 的字面意象及自然汉语替代译法。
lexical_decisions:
- source_word: Διαθήκη
  choice: 遗训
  rationale: 在族长临终文献的标题中，此词指临终所作的嘱托或遗言；“遗训”既保留文体性质，也比现代法律意义上的“遗嘱”更贴合下文的教导与预言。
- source_word: Ἀντίγραφον λόγων
  choice: 言辞的抄本
  rationale: Ἀντίγραφον 表示抄本或副本，λόγων 泛指所说的话；此译保留文本自称为书面传本的意味。
- source_word: διέθετο
  choice: 嘱咐
  rationale: 该动词在遗训语境中可指安排、规定或作出临终嘱托；“嘱咐”在现代汉语中自然庄重，又不把含义限定为法律处分。
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: 论到他们将要做的一切
  rationale: 贴近原文的前瞻结构，既可涵盖教导，也可涵盖预告。
- source_word: συναντήσει αὐτοῖς
  choice: 将要临到他们的一切
  rationale: 保留希腊语“与他们相遇”的惯用意象，同时用自然汉语表达未来遭逢之事。
- source_word: ἕως ἡμέρας κρίσεως
  choice: 直到审判之日
  rationale: 保留正式的末世性时间表达，不进一步界定审判的性质或对象。
- source_word: Ὑγιαίνων
  choice: 身体还很健康
  rationale: 凸显利未召集众子时并非已经显出病危之状；“还”使叙事转折在汉语中更清楚。
- source_word: ἀπεκαλύφθη
  choice: 得了启示
  rationale: 保留被动式所暗示的超越性启示来源，但不擅自说明启示者是谁。
- source_word: μέλλει ἀποθνήσκειν
  choice: 将要死去
  rationale: 直接表达即将死亡之意，语气庄重而自然。
- source_word: συνήχθησαν
  choice: 聚集
  rationale: 简洁呈现众子回应召唤、来到一处的动作，不强行判定其被动或中间语态色彩。
theological_decisions:
- issue: ἕως ἡμέρας κρίσεως 的末世性表达
  choice: 直到审判之日
  alternative: 直到审判日
  rationale: “审判之日”保留原文属格结构的庄重语气及其开放的末世含义，不引入后期教义体系中的额外细节。
- issue: ἀπεκαλύφθη 的启示来源
  choice: 他得了启示
  alternative: 有启示告诉他
  rationale: 原文没有明说启示者；所选译法保留启示的神圣色彩，同时避免擅自补出“上帝”或其他主体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。标题译作“遗训”以体现文类；正文保留章内节号。句式避免过度古雅，也不把原文未明说的启示来源和审判细节具体化。
