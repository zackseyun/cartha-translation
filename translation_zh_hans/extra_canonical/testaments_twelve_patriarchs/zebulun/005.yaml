  terminology: “主”“诫命”“怜悯”“慈悲”“邻舍”“奴隶”等术语适切。“贴身长衣”可保留，且脚注恰当地说明χιτών的替代译法。“没有理性的动物”准确反映ἀλόγοις ζώοις。
