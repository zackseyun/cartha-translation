  text: 'And they said to Jacob[a], “Recognize, then, whether this is your son’s tunic.” And they did so. For they stripped Joseph of the tunic when they were selling him, and clothed him in a servant’s garment. And Simeon took the tunic and did not want to give it. For he wanted to cut him down with the sword, being angry because he had not killed him. But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.” And so he gave it to them.


    And now, my children, I command you to guard your neighbor and to have compassion toward all, not only among people, but also toward unreasoning animals. For because of these things the Lord blessed me, and when all my brothers were sick, I passed through without illness. For the Lord knows each person’s purpose. Have mercy, therefore, in your hearts[b], because whatever a person does to his neighbor, so the Lord also will do with him. For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their hearts; but my sons were kept free from sickness, as you know.


    And when I was in the land of Canaan, by the seashore, I used to catch fish[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].'
translation:
  language: zh_hans
  text: '他们把那件衣服拿给雅各，说：“你认一认，这是不是你儿子的贴身长衣[a]。”他们就这样做了。原来，他们卖约瑟时，脱下了他的贴身长衣，给他换上奴隶的衣服。西缅拿了那件贴身长衣，不肯交出来，因为他想用刀砍死约瑟；他因没能杀掉约瑟而恼怒。于是我们全都起来对他说：“你若不交出那件贴身长衣，我们就告诉父亲，说以色列中这件恶事是你一人做的。”这样，他才把衣服交给他们。他们便照但所说的做了。


    5 现在，我的孩子们，我嘱咐你们：要谨守主的诫命，怜悯邻舍，并且要怜悯一切；这不只限于人，也包括没有理性的动物。主正因这些事赐福给我：我的兄弟们全都患病时，我却安然度过，没有染病，因为主知道每个人的心意。你们心里[b]要有怜悯，因为人怎样待自己的邻舍，主也必怎样待他。我兄弟们的儿子因约瑟的事患病，甚至死亡，因为他们心里没有怜悯；我的儿子却一直蒙保守，没有染病，正如你们所知道的。


    我在迦南地时，常到海边捕捉猎物[c]，带给我父亲雅各。许多人在海中窒息时，我却始终安然无恙[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贴身长衣”译自希腊语 χιτών，指贴身穿的基本衣服，也可译作“长衣”或“袍子”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语原文直译为“在你们的内脏中有怜悯”。古人以“内脏”指深切情感所在，中文按其含义译作“心里”。
    reason: cultural_note
  - marker: c
    text: 希腊语直译为“捕捉猎物”。上下文提到海边和海，因此可能是指捕鱼或捕捉海产；这里保留原文较宽泛的说法。
    reason: lexical_alternative
  - marker: d
    text: 现有引文到此为止；这句话之后的内容似乎仍有下文。
    reason: textual_variant
lexical_decisions:
- source_word: χιτών
  choice: 贴身长衣
  rationale: χίτων指贴身穿着的基本衣服；“贴身长衣”比泛称“衣服”更具体，也比音译式术语更便于现代读者理解。
- source_word: ἱμάτιον δουλικόν
  choice: 奴隶的衣服
  rationale: δουλικός明确表示属于奴隶身份；保留强制隶属地位，不弱化为一般“仆人”。
- source_word: κατακόψαι
  choice: 砍死
  rationale: 该动词配合“刀”表达强烈暴力；“砍死”自然地保留致命意图，但不额外断定肢解。
- source_word: φυλάσσειν τὰς ἐντολὰς Κυρίου
  choice: 谨守主的诫命
  rationale: 依照所提供的希腊语正文，φυλάσσειν的宾语是“主的诫命”，不可按英文咨询层误作“守护邻舍”。
- source_word: εὐσπλαγχνίαν
  choice: 慈悲
  rationale: 表达发自内心的怜悯和柔情，并与邻近的ἔλεος“怜悯”有所区分。
- source_word: ἀλόγοις ζώοις
  choice: 没有理性的动物
  rationale: 保留原文在人与非理性生物之间的明示对照，不笼统省略为“动物”。
- source_word: προαίρεσιν
  choice: 心意
  rationale: 此词可指有意识的选择、意向或道德倾向；“心意”自然且保留一定语义宽度。
- source_word: ἔλεος ἐν σπλάγχνοις
  choice: 心里有怜悯
  rationale: σπλάγχνα字面指内脏，惯用来表示深层情感；正文采用现代汉语惯用表达，并以脚注保存形象。
- source_word: ἐθήρευον θήραν
  choice: 捕捉猎物
  rationale: 保留“猎取猎物”的宽泛原义；海边语境可能指捕鱼，但正文不把推断写死。
- source_word: ἀβλαβὴς διέμενον
  choice: 始终安然无恙
  rationale: 表达持续未受伤害的状态，并与周围人的海中危险形成对照。
theological_decisions:
- issue: 西布伦遗训5:3中的对等报应原则
  choice: 人怎样待自己的邻舍，主也必怎样待他
  alternative: 主也必照样报应他
  rationale: 原文陈述鲜明的对等原则；正文保留其张力，但不以“报应”额外限定其施行方式。
- issue: 怜悯的伦理范围包括动物
  choice: 不但待人如此，也要这样对待没有理性的动物
  alternative: 甚至也要怜悯牲畜
  rationale: 原文明示慈悲超越人类范围；译文完整保留这一不寻常的伦理扩展。
- issue: 侄辈患病死亡“因约瑟”
  choice: 因约瑟的事
  alternative: 因为他们怎样对待约瑟
  rationale: διὰ Ἰωσήφ本身简略，可能指与约瑟有关的罪行或其后果；“因约瑟的事”保留因果关系及原文含混，不补入过多解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。叙事段避免古奥文言，劝诫段保持遗训体的郑重语气。以希腊语正文为首要依据，纠正英文咨询层漏译“主的诫命”的问题；对“因约瑟”和“捕捉猎物”等处保留原文的含混或宽泛语义，并用脚注说明必要背景。
