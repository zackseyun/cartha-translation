  source_fidelity: 译文总体忠实于希腊文，并正确保留了英文审校轨迹中遗漏的“谨守主的诫命”（φυλάσσειν τὰς ἐντολὰς Κυρίου）。叙事中西缅的杀意、但的提议、对等的主施行原则，以及“因约瑟”（διὰ Ἰωσήφ）的简略含义均得到恰当处理。将ἐθήρευον θήραν译为“捕捉猎物”也比直接断定为捕鱼更忠实。需修改的主要一点是“众生”：这不是ἀλόγοις ζώοις或πάντας的中性现代汉语对应语，带有不必要的佛教语域和较宽的宗教性联想。
