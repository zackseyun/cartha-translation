source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἐπιστρέψει *πάντα τὰ⁶⁰ ἔθνη εἰς παραζήλωσιν αὐτοῦ⁶¹, καὶ ὄψεσθε *θεὸν ἐν σχήματι ἀνθρώπου⁶² *ὃν ἂν ἐκλέξηται Κύριος Ἱερουσαλὴμ ὄνομα αὐτῷ⁶³.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/003.yaml
  text: And he will turn all the nations to his jealousy, and you will see God in human form, whom the Lord will choose for him—Jerusalem is his name.
translation:
  language: zh_hans
  text: 他必使万国转向他的嫉妒[a]；你们必看见上帝以人的形态显现，就是主将为他拣选的那一位[b]——他的名字是耶路撒冷[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“转向他的嫉妒”。“嫉妒”所译希腊词也可指妒羡，或被激发而有热忱；“他的”在原文中的具体关系不明。
    reason: 保留 παραζήλωσις 的词义范围及 αὐτοῦ 的不明属格关系，不将其确定为“对他”的嫉妒。
  - marker: b
    text: “为他”所指不明；原文的表达也含有“主将拣选”的未定或将来意味。
    reason: 保留 αὐτῷ 的指向歧义，以及 ὃν ἂν ἐκλέξηται 的句法语气。
  - marker: c
    text: 原文直译为“耶路撒冷是他的名字”。这句话的所指和含义并不明确。
    reason: 标明异常的名字陈述，避免把不确定文本改写为地点表达。
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: 使……转而
  rationale: 保留使役意味，并自然表达方向或态度的转变。
- source_word: πάντα τὰ ἔθνη
  choice: 万国
  rationale: 简洁、庄重，指所有外邦民族或列国。
- source_word: εἰς παραζήλωσιν αὐτοῦ
  choice: 对他心生嫉妒
  rationale: παραζήλωσις 可表示嫉妒、妒羡或受激发而热切追求；此处依属格 αὐτοῦ 直译为对他的嫉妒，同时以脚注保留语义幅度。
- source_word: θεὸν ἐν σχήματι ἀνθρώπου
  choice: 上帝以人的形态显现
  rationale: ἐν σχήματι 表示外在形态或样式；补出“显现”使汉语通顺，但不把它解释为特定的道成肉身教义。
- source_word: ὃν ἂν ἐκλέξηται Κύριος
  choice: 就是主……所拣选的那一位
  rationale: 以关系从句承接“上帝以人的形态显现”，保留原文关系代词所指可能产生的张力。
- source_word: Ἱερουσαλὴμ ὄνομα αὐτῷ
  choice: 他的名字是耶路撒冷
  rationale: 按照现存扩展文本的字面句法翻译，不擅自改作地点状语。
theological_decisions:
- issue: “上帝以人的形态”是否应明确解释为道成肉身
  choice: 仅译作“上帝以人的形态显现”
  alternative: “成为人／道成肉身”
  rationale: 原文只说 ἐν σχήματι ἀνθρώπου，并未明确使用“成为”或“肉身”等术语；应保留其形态语言和神学张力。
- issue: “主为他所拣选”中代词的指向
  choice: 保留“为他”并用脚注说明句法含混
  alternative: 删去“为他”，或明确解释为“主所拣选的人”
  rationale: 扩展文本含 αὐτῷ，其所指不够明确；不宜静默消除。
- issue: “耶路撒冷”究竟是谁的名字
  choice: 直译为“他的名字是耶路撒冷”
  alternative: 解释为“在耶路撒冷”或“耶路撒冷要称他的名”
  rationale: 现存希腊语顺序支持名字陈述，但表达异常，故保留并注释，而不作教义化协调。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“万国”“主”“拣选”保留经书语体；以分号和破折号呈现原句层次。原始材料注明本句属于 bdg-text expansion，译文按所给扩展文本翻译，并通过脚注保留关键歧义。
