  text: But you, fear the Lord our God with all your strength all the days of your life.
translation:
  language: zh_hans
  text: 但你们要尽你们一切的力量，终生敬畏主——我们的上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 校勘本以方括号标示从“我们的上帝”至句末的较长读法为存疑；较短读法为：“但你们要敬畏主。”
    reason: 源文本将该较长短语置于方括号内。脚注说明其文本不确定性，同时保留正文所采用的长读法。
lexical_decisions:
- source_word: φοβεῖσθε
  choice: 敬畏
  rationale: 此处指对上帝怀有敬重、畏惧并顺服的态度；“敬畏”既保留希腊词的畏惧意味，也符合现代中文宗教语境。
- source_word: ἐν πάσῃ ἰσχύι ὑμῶν
  choice: 尽你们一切的力量
  rationale: 较直接地表达全力而为，保留 πάσῃ 的整体性及 ἰσχύι 的力量含义。
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς ὑμῶν
  choice: 终生
  rationale: 以自然简洁的现代中文表达“你们一生所有的日子”，不改变持续一生的时间范围。
theological_decisions:
- issue: “主”与“我们的上帝”的关系
  choice: 主我们的上帝
  alternative: 主，就是我们的上帝
  rationale: 原文并列短语可自然理解为同位关系，但不宜借“就是”把句法关系解释得过强；直译式并列保留其表达张力。
- issue: 方括号内文字的文本状态
  choice: 正文保留，并加注说明
  alternative: 仅译“但你们要敬畏主”
  rationale: 英译审校层采用完整长读法，但希腊校勘文本用方括号标示从“我们的上帝”至句末的文字具有文本疑问，因此正文纳入而不掩盖异文情况。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“但你们要”承接劝诫语气；将时间短语译为“终生”，避免生硬的“你们生命的一切日子”。脚注标记已在正文中对应出现。
