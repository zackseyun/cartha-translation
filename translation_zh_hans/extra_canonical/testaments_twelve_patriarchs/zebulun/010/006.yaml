source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ἀναστήσομαι γὰρ⁴ πάλιν *ἐν μέσῳ⁵ ὑμῶν, ⌈ὡς ἡγούμενος *ἐν μέσῳ⁶ υἱῶν δικαιοσύνης⌉, καὶ⁷ εὐφρανθήσομαι⁸ *ἐν μέσῳ⁹ τῆς φυλῆς μου, *οἵτινες φυλάξουσιν¹⁰ νόμον Κυρίου [καὶ ἐντολὰς¹¹ Ζαβουλὼν πατρὸς αὐτῶν].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/006.yaml
  text: For I will rise again in your midst, as a leader in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, those who keep the law of the Lord and the commandments of Zebulun their father.
translation:
  language: zh_hans
  text: 因为我必再起来，在你们中间，在公义之子中作领袖；我必在我支派中欢喜，就是在那些遵守主的律法和他们父亲西布伦的诫命之人中间欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和他们父亲西布伦的诫命”在所据希腊文版本中置于方括号内，表明这几个字的文本可靠性存疑。
    reason: 忠实呈现原始版本的校勘标记，避免把有争议的末尾短语当作毫无疑问的原文。
lexical_decisions:
- source_word: Ἀναστήσομαι
  choice: 我必再起来
  rationale: 保留“起来、复起”的基本语义，并与πάλιν“再”结合；不擅自限定为一般起身或末日复活。
- source_word: ἐν μέσῳ ὑμῶν
  choice: 来到你们中间
  rationale: 以自然现代汉语表达“在你们中间”；补入“来到”使“再起来”与位置短语衔接顺畅，但不增加实质含义。
- source_word: ἡγούμενος
  choice: 作领袖
  rationale: 该词指带领者、首领；“领袖”清楚而不额外赋予官职或宗教头衔。
- source_word: υἱῶν δικαιοσύνης
  choice: 义人之子
  rationale: 按原文保留闪语式属格表达及其可能的群体称谓意味，不简化为“义人”。
- source_word: εὐφρανθήσομαι
  choice: 我必……欢喜
  rationale: 表达喜乐、欢欣；“欢喜”庄重自然，也保留将来语气。
- source_word: φυλάξουσιν
  choice: 遵守
  rationale: 在律法和诫命语境中，φυλάσσω意为谨守、遵行；“遵守”是现代汉语最直接的对应。
- source_word: νόμον Κυρίου
  choice: 主的律法
  rationale: Κύριος译为“主”，νόμος译为“律法”，保留宗教法律语域。
- source_word: ἐντολὰς Ζαβουλὼν πατρὸς αὐτῶν
  choice: 他们父亲西布伦的诫命
  rationale: 依现存括号内希腊文直译，保留“父亲”及西布伦作为发令者的关系。
theological_decisions:
- issue: Ἀναστήσομαι πάλιν是否明确译作“复活”
  choice: 再起来
  alternative: 复活
  rationale: 原词可在相关语境中指复活，但单句本身仍可作较宽泛的“再起来”；采用较中性的译法，以保存文本的末世性可能而不将其完全坐实。
- issue: “义人之子”的身份范围
  choice: 保留“义人之子”这一称谓
  alternative: 义人／行义的人
  rationale: 原文υἱῶν δικαιοσύνης具有闪语式表达的张力，可能指属于公义的一群人；不在正文中将其解释性改写。
- issue: 末尾关于西布伦诫命的短语之文本地位
  choice: 收入正文并加脚注说明
  alternative: 仅保留“遵守主的律法”
  rationale: 所给希腊文本载有该短语，但以方括号标示，说明其文本地位存疑；正文予以保留，同时公开反映校勘不确定性。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。重复“中间”以呼应原文三次ἐν μέσῳ的修辞结构；末句略作汉语语序调整，以清楚表明“那些人”就是西布伦在其支派中欢喜相交的对象。
