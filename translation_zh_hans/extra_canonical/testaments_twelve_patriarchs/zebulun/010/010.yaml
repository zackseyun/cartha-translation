source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ ταῦτα εἰπὼν ἐκοιμήθη [†ὕπνῳ²⁴ καλῷ], καὶ ἔθηκαν αὐτὸν *οἱ υἱοὶ αὐτοῦ²⁵ *εἰς θήκην ξυλίνην²⁶. 7. Ὕστερον δὲ *ἀναγαγόντες ἔθαψαν αὐτὸν ἐν Χεβρών²⁷ μετὰ τῶν πατέρων αὐτοῦ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/010.yaml
  text: And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.
translation:
  language: zh_hans
  text: 他说完这些话，就长眠了；他的儿子们把他安放在木棺里。后来，他们把他抬上去，葬在希伯仑，和他的祖先葬在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη [†ὕπνῳ καλῷ]
  choice: 安然长眠了
  rationale: ἐκοιμήθη字面为“睡去”，在死亡叙事中是委婉语；异文ὕπνῳ καλῷ若保留则有“安然/美好地长眠”之意。译文以自然的中文死亡委婉语表达，并不过度直说“死了”。
- source_word: θήκην ξυλίνην
  choice: 木棺
  rationale: θήκη在此指盛放遗体的棺椁，ξυλίνη为“木制的”；“木棺”准确且简洁。
- source_word: ἀναγαγόντες
  choice: 把他运上去
  rationale: 保留ἀνά所含“向上带去”的方向意义，可能涉及从埃及前往希伯仑的地理上行；不笼统处理为“运走”。
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: 与他的祖先同葬
  rationale: πατέρες在墓葬语境中指先祖；“祖先”比直译“父亲们”自然，“同葬”明确表达共同安葬的语境。
theological_decisions:
- issue: ἐκοιμήθη的死亡委婉表达
  choice: 长眠了
  alternative: 死了
  rationale: 保留原文以“睡眠”指死亡的修辞，不将其扩展为关于死后状态的教义陈述。
- issue: ὕπνῳ καλῷ的文本不确定性
  choice: 以“安然”在正文中有限体现
  alternative: 省略该异文，仅译“长眠了”
  rationale: 校勘括号和剑号显示文本存在疑问；“安然”可自然承接该读法，但不赋予额外神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“安放”适合遗体入棺语境；后句以“他们”承接“他的儿子们”。经文编号所给10:10与所引希腊文本内部编号6—7不一致，但本稿按所提供的希腊原文完整翻译。
