  text: 4. *Ἐγὼ δὲ νῦν¹⁵ εἰς τὴν ἀνάπαυσίν μου¹⁶ ἀποτρέχω¹⁷, *ὡς καὶ¹⁸ οἱ πατέρες μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/008.yaml
  text: But as for me, now I hasten to my rest, as also my fathers did.
translation:
  language: zh_hans
  text: 至于我，我如今正赶往我的安息之所，正如我的先祖一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάπαυσίν
  choice: 安息之所
  rationale: 既保留“安息”的死亡委婉意味，也以“之所”表达带定冠词和物主代词的“我的安息/安息之处”，中文自然庄重。
- source_word: ἀποτρέχω
  choice: 赶往
  rationale: 该动词含迅速离去、奔赴之意；“赶往”比单纯“去”更能保留动作的急切感，同时不显得突兀。
- source_word: οἱ πατέρες μου
  choice: 我的先祖
  rationale: 在死亡归宿的语境中指已经离世的祖辈；“先祖”比直译“父亲们”更符合现代汉语。
theological_decisions:
- issue: “安息”是否明确解释为死亡或死后归宿
  choice: 保留“安息之所”的委婉表达
  alternative: 坟墓／死亡／死后的安息
  rationale: 原文以ἀνάπαυσις含蓄表达死亡及归于祖先，不应将其具体化为坟墓，也不额外界定死后状态。
- issue: 与先祖的比较是否补出谓语“所行的”或“曾经那样”
  choice: 译为“正如我的先祖一样”
  alternative: 正如我的先祖也曾赶往那里
  rationale: 原文比较结构省略重复谓语；中文保留简练表达，不添加原文未明说的地点指代。
translation_notes:
  register: 采用现代、庄重而易懂的临终遗言语体；“至于我”承接希腊文强调性的主语结构，“如今”突出当前时刻。
