base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/007.yaml
  text: But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations.
translation:
  language: zh_hans
  text: 但主必使永恒的火临到不敬虔的人，并要毁灭他们，直到世世代代。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: 准确表达对上帝缺乏敬畏、悖逆上帝的含义，同时保持庄重而易懂。
- source_word: ἐπάξει
  choice: 必使……临到
  rationale: 保留动词“带来、使临到”的使动意味，并以“必”体现希腊语将来时。
- source_word: πῦρ αἰώνιον
  choice: 永火
  rationale: 简洁保留“永恒之火”的末世审判意象；“永火”符合中文宗教文体且普通读者能够理解。
- source_word: ἀπολεῖ
  choice: 要毁灭
  rationale: 传达该词在审判语境中的强烈含义，不弱化为一般的惩罚或损害。
- source_word: ἕως γενεὰς γενεῶν
  choice: 直到世世代代
  rationale: 贴近原文重复结构及其时间延续意味，不擅自将其解释成更明确的哲学性“永远”。
theological_decisions:
- issue: “永火”与“直到世世代代”之间的时间表达
  choice: 分别直译为“永火”和“直到世世代代”
  alternative: 统一解释为“永远毁灭他们”
  rationale: 原文并用 αἰώνιον 和 ἕως γενεὰς γενεῶν，二者措辞不同；译文保留这种张力，不把审判的性质与持续期限强行归并。
- issue: 毁灭的施事者
  choice: 以“主”作为两个并列动词共同的主语
  alternative: 第二分句仅译作“他们必被毁灭”
  rationale: 希腊语第二个动词为主动语态第三人称单数，最自然地承接“主”为主语。
translation_notes:
  register: 采用现代、庄重、清楚的书面普通话；句式保留原文两个并列审判行动，避免添加原文没有的教派性解释。
