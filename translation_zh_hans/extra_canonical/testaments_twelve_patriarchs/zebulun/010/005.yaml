  text: X. Καὶ νῦν τέκνα μου, μὴ λυπεῖσθε *ὅτι ἀποθνῄσκω¹, μηδὲ συμπέσητε² ὅτι ἀπολήγω³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/005.yaml
  text: And now, my children, do not be grieved that I am dying, nor fall down that I am coming to my end.
translation:
  language: zh_hans
  text: 现在，我的孩子们，不要因我快要死去而悲伤，也不要因我将走到尽头而倒下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲属称呼，符合临终训诫的庄重语境，也自然适用于现代汉语。
- source_word: μὴ λυπεῖσθε
  choice: 不要……悲伤
  rationale: 保留禁止悲痛的基本语义；“悲伤”比“忧愁”更贴合面对死亡的情境。
- source_word: ἀποθνῄσκω
  choice: 我将死
  rationale: 希腊语为现在时，但语境指正在临近的死亡；汉语用“将死”自然表达迫近而尚未完成之事。
- source_word: μηδὲ συμπέσητε
  choice: 也不要……倒下
  rationale: 保留 συμπίπτω 的具体动作意象，不擅自解释为精神崩溃、绝望或昏厥。
- source_word: ἀπολήγω
  choice: 我走到生命的尽头
  rationale: 表达“终止、走到终点”的含义；补出“生命”使现代汉语清楚，同时与前句“将死”形成语义递进。
theological_decisions:
- issue: “倒下”是身体动作还是比喻性的崩溃
  choice: 保留“倒下”的开放表达
  alternative: 不要崩溃／不要绝望
  rationale: 原文可保留身体与情绪层面的张力；不将其限定为某一种心理或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的临终劝诫语体。两分句保持平行结构；不添加原文没有的复活、安慰或来世解释。
