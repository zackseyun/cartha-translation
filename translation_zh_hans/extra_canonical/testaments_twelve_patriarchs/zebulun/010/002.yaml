revisions:
- from: 医治和怜悯必在他的翅膀之中。他必亲自把世人的一切被掳者从彼列手中救赎出来；一切迷惑人的灵都必被践踏。[a]
  to: 他的翅膀之中有医治和怜悯。他必亲自把世人所受的一切掳掠从彼列手中救赎出来；一切迷惑人的灵都必被践踏。[a]
  rationale: 修订仅调整 αἰχμαλωσίαν 的处理和首句语序。新正文不将原文未定的抽象／集合性名词预先限定为“被掳者”，并以脚注完整呈现可行理解；未添加施事者、人物身份或教义性说明。
