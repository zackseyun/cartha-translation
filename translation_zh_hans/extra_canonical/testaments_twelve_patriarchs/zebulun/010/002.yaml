source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἴασις *καὶ εὐσπλαγχνία⁵⁷ ἐν⁵⁸ ταῖς πτέρυξιν αὐτοῦ. Αὐτὸς λυτρώσεται πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων ἐκ τοῦ Βελίαρ καὶ πᾶν πνεῦμα πλάνης πατηθήσεται⁵⁹.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/002.yaml
  text: And healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deception will be trampled down.
translation:
  language: zh_hans
  text: 他的翅膀之中有医治和怜悯。他必亲自把世人所受的一切掳掠从彼列手中救赎出来；一切迷惑人的灵都必被践踏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人所受的一切掳掠”原文也可理解为“世人的一切被掳状态”；该名词亦可能带集合性，指“世人的一切被掳者”。
    reason: 说明 αἰχμαλωσίαν 可指抽象的被掳／囚禁状态，亦可作集合性名词，避免正文消除其语义歧义。
lexical_decisions:
- source_word: ἴασις
  choice: 医治
  rationale: 既可指医治的行动，也可指医治、康复本身；“医治”简洁保留其宽泛含义。
- source_word: εὐσπλαγχνία
  choice: 怜悯
  rationale: 表示发自内心的慈悲与同情；“怜悯”符合庄重的宗教语体。
- source_word: ἐν ταῖς πτέρυξιν αὐτοῦ
  choice: 在他的翅膀之中
  rationale: 保留原文的翼下庇护和医治意象，不将隐喻解释性改写。
- source_word: λυτρώσεται
  choice: 救赎出来
  rationale: 该词含付代价释放、解救之意；“救赎出来”兼顾神学语感和从权势下获释的语境。
- source_word: πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων
  choice: 世人的一切被掳者
  rationale: αἰχμαλωσίαν 字面可指“被掳/囚禁”或集合性的“俘虏”；依其作为 λυτρώσεται 的宾语并结合“从彼列”获释的语境，译作被掳的人较自然，同时以脚注保留歧义。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 按专名音译，保留古代犹太文献中敌对邪恶权势的称谓，不擅自等同于其他称号。
- source_word: πνεῦμα πλάνης
  choice: 迷惑人的灵
  rationale: πλάνη 可表示迷误、欺骗或使人偏离；此译自然呈现其致人迷失的作用，同时不把“灵”抽象化。
- source_word: πατηθήσεται
  choice: 必被践踏
  rationale: 保留原文强烈的被动语态和击败、制服的意象。
theological_decisions:
- issue: “他”的身份
  choice: 保留代词“他”而不加身份说明
  alternative: 明确译为某一弥赛亚或神圣人物
  rationale: 本节本身只用 αὐτοῦ／Αὐτός，明确身份需依赖更广语境；正文不作超出原文的教义性补足。
- issue: 救赎的范围
  choice: 译为“世人的一切被掳者”
  alternative: 译为“全人类”或“世人的一切被掳状态”
  rationale: 保留 πᾶσαν 的全面性以及“世人”的普遍表达，但不据此断定关于所有个体最终结局的系统神学命题。
- issue: 被践踏的施事者
  choice: 保留被动式“都必被践踏”
  alternative: 补出“他必践踏”或“神必践踏”
  rationale: 希腊文没有明示施事者；保留神学被动或未明施事者的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“翅膀之中”“救赎”“践踏”保留原文的诗性和宗教意象；句式不过度古雅。
