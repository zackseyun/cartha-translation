  source_fidelity: 正文将 πᾶσαν αἰχμαλωσίαν 译作“世人的一切被掳者”，虽以脚注提示歧义，但把单数抽象名词优先实化为人，较英语审校轨迹及希腊文通常用法更窄。改译以“掳掠”保留其可指被掳状态、掳掠事件或集合性被掳情形的弹性，并在脚注说明另一种集合性理解。其余内容忠实保留：ἴασις、εὐσπλαγχνία、未明示身份的代词、从彼列而得释放，以及被动式的践踏。
  naturalness: “他的翅膀之中有医治和怜悯”比“医治和怜悯必在他的翅膀之中”更符合现代汉语语序，同时不解释该意象。“世人所受的一切掳掠”亦比“世人的一切被掳者”更顺畅。
  terminology: 保留“医治”“怜悯”“救赎”“彼列”“迷惑人的灵”“践踏”等庄重而可理解的用语。Βελίαρ 音译为“彼列”，不擅自将其替换或等同为其他邪恶称谓。
