base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/004.yaml
  text: And again, in the craftiness of your works you will provoke him, and you will be cast away from him until the time of completion.
translation:
  language: zh_hans
  text: 你们又要在你们行为的诡诈中激起他的怒气，并且要被弃绝，远离他，直到终局之时。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ πανουργίᾳ τῶν ἔργων ὑμῶν
  choice: 在自己行为的诡诈中
  rationale: 保留介词ἐν所表达的处境或范围，不改译为单纯的手段；πανουργία在此含负面的狡诈、诡诈之意，ἔργα译作“行为”比生硬的“工作”更符合现代汉语伦理语境。
- source_word: παροργίσετε
  choice: 惹怒
  rationale: 该动词指激起愤怒；“惹怒他”自然简洁，并保留受词代词。
- source_word: ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ
  choice: 被他弃绝
  rationale: 以被动式保留ἀπορριφήσεσθε的受弃含义；ἀπ᾽ αὐτοῦ可表示与他分离，也可隐含他为施事者，汉语“被他弃绝”自然呈现这一关系。
- source_word: ἕως καιροῦ συντελείας
  choice: 直到终局的时候
  rationale: καιρός为特定的时刻或时期，συντέλεια指完成、终结或终局；“终局的时候”保留末后完成之意而不擅自具体化。
theological_decisions:
- issue: “他”的身份
  choice: 保留代词“他”
  alternative: 明确译为“上帝”
  rationale: 本句希腊文仅用αὐτόν与αὐτοῦ，身份依赖上下文；不在本节中补入专名，以免消除原文的指代方式。
- issue: 弃绝持续到何时
  choice: “直到终局的时候”
  alternative: “直到完成之期”或“直到末日”
  rationale: 原文措辞允许“完成之期”或末世性的“终局”理解；正文采用自然而仍较宽泛的表达，不直接限定为某一具体末世事件。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们还要……也必……”体现καὶ πάλιν及两个将来时之间的推进；避免文言化和宗派性术语。
