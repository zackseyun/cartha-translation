  rationale: 修订保留原句的将来语气、介词ἐν所表示的处境、代词指代及“终局”的开放性；同时将“被弃绝”与“远离他”并列，以自然汉语表达被动动词及ἀπ᾽ αὐτοῦ所表示的隔绝，避免把后者单向解释为施事关系。
