review_pass:
  verdict: revise
  source_fidelity: 原文的ἐν τῇ πανουργίᾳ τῶν ἔργων ὑμῶν可译为“在你们行为的诡诈中”，译文对此基本忠实。παροργίσετε明确含有“激起怒气”之意，“惹怒”虽可接受，但“激起他的怒气”更贴近动词力度。主要问题在ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ：被动动词表示“被弃绝/被抛弃”，而ἀπ᾽ αὐτοῦ明确标示“离开他、与他隔绝”；原译“被他弃绝”将该短语主要处理为施事，弱化了原文的分离关系。
  naturalness: “在自己行为的诡诈中”庄重且可懂；改为“在你们行为的诡诈中”可更直接对应第二人称复数。“被弃绝，远离他”在现代汉语中自然，也保留被动与离开他的双重含义。
  terminology: “终局之时”适切表达καιροῦ συντελείας，不把“完成/终结”限定为特定宗派末世术语。保留“他”的代词指代，不擅自补入神名。
  issues:
  - severity: medium
    issue: “被他弃绝”未充分表达ἀπ᾽ αὐτοῦ的分离意义。
    rationale: ἀπ᾽ αὐτοῦ字面为“离开他/从他那里”；虽然上下文或可推知他是弃绝者，正文不应以施事解释取代原文明确的空间或关系分离。
  - severity: low
    issue: “惹怒”略弱于παροργίζω的“激起怒气”。
    rationale: 改作“激起他的怒气”更清楚呈现原动词的使役性和愤怒语义。
  revised_text: 你们又要在你们行为的诡诈中激起他的怒气，并且要被弃绝，远离他，直到终局之时。
