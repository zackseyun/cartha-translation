  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/001.yaml
  text: And you will return to your land, and you will see him in Jerusalem because of his holy name.
translation:
  language: zh_hans
  text: 你们必归回自己的土地，并且会在耶路撒冷见到他，因为他的圣名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψετε
  choice: 必归回
  rationale: 此处为将来时，语境表达预告；“归回”自然传达返回故土之意。
- source_word: εἰς τὴν γῆν ὑμῶν
  choice: 自己的土地
  rationale: 保留“你们的土地”的归属含义，同时符合现代汉语表达。
- source_word: ὄψεσθε αὐτὸν
  choice: 会……见到他
  rationale: 按希腊文直译宾语代词，不擅自明确“他”的身份。
- source_word: διὰ τὸ ὄνομα αὐτοῦ τὸ ἅγιον
  choice: 因为他的圣名
  rationale: διά加宾格通常表原因；保留“圣名”这一简洁而庄重的宗教表达。
theological_decisions:
- issue: “他”的身份
  choice: 保留代词“他”
  alternative: 明确为某一弥赛亚或神圣人物
  rationale: 本节希腊文仅用αὐτόν，单凭此句不足以进一步指明身份。
- issue: διὰ所表达的关系
  choice: 译为原因“因为”
  alternative: 译为媒介“借着”或目的“为了”
  rationale: διά后接宾格τὸ ὄνομα，最自然地表示原因，与英文审校层也一致。
translation_notes:
  register: 采用现代、庄重而易懂的叙事预告语体；不增加原文未明说的主语身份或神学解释。
