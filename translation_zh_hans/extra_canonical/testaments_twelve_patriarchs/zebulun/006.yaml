  text: First[a], then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it. And I fastened a piece of wood behind it[b], and
translation:
  language: zh_hans
  text: 6 我首先造了一条能在海上航行的船，因为主在这方面赐给我悟性和智慧[a]。我在它后面放置了一块木料，并且……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“智慧”也可以包含造船所需的实际才干，并不只是抽象意义上的智慧。
    reason: lexical_alternative
  - marker: b
    text: 现有的希腊文段落残缺，原文在“我在它后面放置了一块木料，并且”之后中断。
    reason: textual_variant
lexical_decisions:
- source_word: σκάφος
  choice: 船
  rationale: 泛指水上航行的船只；“船”自然简明，也不擅自限定其大小或具体类型。
- source_word: ἐπιπλέειν
  choice: 使它能在海上航行
  rationale: 该词本义可指浮行于水面；结合造船语境，译作“使它能在海上航行”既表达实际用途，也不限定具体推进方式。
- source_word: σύνεσιν
  choice: 悟性
  rationale: 与“智慧”并列，表达理解和领悟的能力，同时保持庄重而不显技术化。
- source_word: σοφίαν
  choice: 智慧
  rationale: 保留该词较广的含义和神学色彩；在造船语境中也可涵盖实际技艺。
- source_word: ἐν αὐτῷ
  choice: 为此
  rationale: 希腊文直译近于“在其中”；中文用“为此”自然地回指造船、航行这件事，同时避免添加更具体的解释。
- source_word: καθῆκα
  choice: 安上
  rationale: 基本含义是放置、装设；在造船语境中，“安上”能表达将木料置于船后的动作，又不过度断定具体固定方法。
- source_word: ξύλον
  choice: 一块木料
  rationale: 原词可泛指木头或木制构件；残文不足以判定具体船具，因此采用不作过度说明的译法。
- source_word: Κύριος
  choice: 主
  rationale: 此处明确指神，依中文圣经传统译作“主”。
theological_decisions:
- issue: 造船能力的神圣来源
  choice: 明确说主赐下“悟性和智慧”，并让“智慧”保有广义内涵。
  alternative: 将 σοφίαν 窄化为造船所需的“技艺”或“技能”。
  rationale: σύνεσις 与 σοφία 并列，语境虽涉及实际建造能力，却不宜消除“智慧”一词更广的神学意味。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“使它能在海上航行”避免把 ἐπιπλέειν 过度限定为扬帆行驶；末尾用省略号直观呈现残文中断，并以脚注说明文本状况。
