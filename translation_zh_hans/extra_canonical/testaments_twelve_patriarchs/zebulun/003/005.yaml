  text: For I had no share in his price, my children.
translation:
  language: zh_hans
  text: 因为卖他所得的钱，我并没有分得一份，孩子们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίμημα
  choice: 卖他所得的钱
  rationale: 该词在此指为他付出的价款，即出卖他所得的钱；这样译比生硬的“他的价钱”更符合现代汉语，同时保留交易价款之意。
- source_word: ἐκοινώνησα
  choice: 分得一份
  rationale: κοινωνέω在此表示参与、分享所得；“分得一份”自然表达说话者没有参与分取价款。
- source_word: τέκνα μου
  choice: 孩子们
  rationale: 保留父亲对众子的直接称呼，语气自然且庄重。
