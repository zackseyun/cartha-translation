  text: And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits, which our fathers dug and found no water.”
translation:
  language: zh_hans
  text: 这时，吕便站起来说：“来吧，我的弟兄们，我们不要杀他，而要把他扔进这些由我们祖先挖掘、却没有找到水的干井中的一个。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ μεταξὺ
  choice: 这时
  rationale: 自然表达事件进行期间的时间转换；“与此同时”略显书面且可能过度强调同步。
- source_word: ἀναστὰς
  choice: 站起来
  rationale: 保留分词的具体动作及其与随后发言的衔接。
- source_word: Δεῦτε ἀδελφοί μου
  choice: 来吧，我的弟兄们
  rationale: “来吧”传达劝促语气，“我的弟兄们”保留亲属称呼及直接呼语。
- source_word: ξηρῶν λάκκων
  choice: 干井
  rationale: 上下文说明这些是祖先为取水所挖却无水的坑穴；“干井”在现代汉语中自然，并保留无水之意。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的祖先
  rationale: 此处指先辈而非各人的父亲，译作“祖先”较合语境。
- source_word: οὐχ εὗρον ὕδωρ
  choice: 却没有找到水
  rationale: 贴近希腊文“没有找到水”，不改写为静态的“里面没有水”。
