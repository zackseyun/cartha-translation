  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/001.yaml
  text: And when Joseph saw me weeping with him, and the brothers coming on to kill him, he took refuge behind me, begging me for help on his behalf.
translation:
  language: zh_hans
  text: 约瑟看见我正同他哭泣，又看见众兄弟逼近，要杀他，就逃到我身后，恳求我帮助他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνκλαίοντά μοι αὐτῷ
  choice: 我和他一同哭泣
  rationale: συνκλαίω 表示“与……一同哭泣”；依句法和语境，直译为自然的现代汉语，并保留西布伦与约瑟同哭的情景。
- source_word: τοὺς ἀδελφοὺς ἐπερχομένους ἀνελεῖν αὐτόν
  choice: 众兄弟上前要杀他
  rationale: ἐπέρχομαι 在此指逼近、上前；ἀναιρέω 在这一语境中明确指杀死。
- source_word: κατέφυγον ὄπισθέν μου
  choice: 就躲到我身后
  rationale: καταφεύγω 表示逃往某处寻求庇护；结合“在我身后”，译作“躲到我身后”最符合汉语叙事习惯。
- source_word: δεόμενος τῆς πρὸς αὐτὸν βοηθείας
  choice: 恳求我帮助他
  rationale: 该短语意为恳求给予针对他的援助；汉语中以“恳求我帮助他”简洁清楚地表达约瑟为自己求助。
