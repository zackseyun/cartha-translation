  verdict: revise
  source_fidelity: 'The draft correctly identifies Joseph as the one who sees, takes refuge behind Zebulun, and asks for help. Its rendering of the brothers'' intent to kill Joseph is faithful. A slight revision better conveys ἐπερχομένους as their approaching/closing in and makes the participial relation of συνκλαίοντά μοι αὐτῷ unambiguous: Zebulun is weeping together with Joseph.'
  naturalness: The draft is generally idiomatic, but “我和他一同哭泣” can momentarily be read as a coordinated statement rather than as what Joseph saw Zebulun doing. “我正同他哭泣” is clearer. “逃到我身后” retains the movement and protective force of κατέφυγον more fully than “躲到我身后.”
  terminology: Names and the restrained narrative register are appropriate. No specialized theological terminology occurs. “众兄弟” is suitable for τοὺς ἀδελφούς in this context.
  issues:
  - severity: low
    issue: The wording “我和他一同哭泣” is syntactically less explicit about Zebulun as the person Joseph sees weeping with him.
    rationale: The Greek participle is accusative masculine singular and refers to “me” (Zebulun), with Joseph as the person alongside whom he is weeping. Adding “正同他” makes this relationship clear in Mandarin.
  - severity: low
    issue: “上前” somewhat understates the hostile approach expressed by ἐπερχομένους.
    rationale: “逼近” naturally conveys the brothers' coming upon Joseph while preserving the text's stated purpose, “要杀他.”
