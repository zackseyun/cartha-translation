revisions:
- from: 因此，摩西律法书上记着：“那不愿为自己兄弟立后的人，要脱下他的鞋，并向他脸上吐唾沫。”
  to: 因此，摩西律法书上记着：“凡不愿为他兄弟立后的人，他的鞋要被脱下，并且有人要向他脸上吐唾沫。”
  rationale: 修订仅澄清后半句的语法关系：该男子的鞋是被脱下的，吐唾沫者也保持为未特指的施行者。这样既符合希腊文的未明指施事，也与英文审校轨迹一致；其余关键术语和法规式语体均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:23:57Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了摩西律法书的书面引述、为兄弟延续后代的义务，以及脱鞋、吐唾沫的羞辱性后果。不过，“那……的人，要脱下他的鞋，并向他脸上吐唾沫”在汉语句法上会把脱鞋和吐唾沫都理解为该男子自己施行，改变了希腊文及英文审校轨迹中未明说施行者、而该男子承受这些行为的结构。
  naturalness: “摩西律法书上记着”和“立后”庄重自然，适合经文语体。“为自己兄弟”中的“自己”不必要，且不如“为他兄弟”直接。改用被动式和不定施事表达后，法规性语气更清楚。
  terminology: 保留“摩西律法书”“立后”“鞋”“脸上吐唾沫”。“立后”在此可恰当地表达ἀναστῆσαι σπέρμα；不把原文未明说的亡兄身份写入正文。
  issues:
