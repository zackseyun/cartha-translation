base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/007.yaml
  text: 'Therefore it is written in the book of the law of Moses: “The one who does not want to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”'
translation:
  language: zh_hans
  text: 因此，摩西律法书上记着：“凡不愿为他兄弟立后的人，他的鞋要被脱下，并且有人要向他脸上吐唾沫。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γραφῇ νόμου Μωσέως
  choice: 摩西律法书上
  rationale: γραφή在此指成文的律法文本；译作“律法书”自然且符合所引经文的书面语境。
- source_word: ἀναστῆσαι σπέρμα
  choice: 立后
  rationale: 字面为“兴起后裔”，在兄弟婚制度语境中指为亡兄延续后代；“为自己兄弟立后”以现代汉语简洁传达这一含义。
- source_word: ὑπολύεσθαι τὸ ὑπόδημα αὐτοῦ
  choice: 要脱下他的鞋
  rationale: 保留希腊文被动结构的规范性语气；“鞋”比“鞋履”更符合现代通用汉语。
- source_word: ἐμπτύεσθαι εἰς τὸ πρόσωπον
  choice: 向他脸上吐唾沫
  rationale: 准确呈现向其面部吐唾沫的公开羞辱动作，同时保持庄重、清楚。
theological_decisions:
- issue: “立后”所指的亲属义务
  choice: 不在正文中明确限定为亡兄
  alternative: 译为“为死去的兄弟生育后代”
  rationale: 希腊文本这里只说“为他的兄弟”，其具体制度背景可由摩西律法的引文识别；正文不补入原文未明说的“死去的”，以免消除文本的省略。
- issue: 执行脱鞋与吐唾沫者的身份
  choice: 采用无主语规范表达
  alternative: 补作“人要脱下他的鞋，向他脸上吐唾沫”或“妇人要……”
  rationale: 希腊文使用被动不定式，没有明说施行者；中文以“要脱下……并向……”保留这种未指明施行者的表达。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“立后”是当代汉语仍可理解的制度性表达；引文保持法规式语气，不额外补充施行者或亡兄身份。
