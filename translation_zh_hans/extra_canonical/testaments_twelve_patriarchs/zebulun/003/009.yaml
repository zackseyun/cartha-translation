source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ *γὰρ ἐλθόντες ἐν Αἰγύπτῳ³³ ὑπελύθησαν³⁴ *ὑπὸ τῶν παίδων³⁵ Ἰωσὴφ ἔξωθεν³⁶ τοῦ πυλῶνος, καὶ οὕτως³⁷ προσεκύνησαν³⁸ *τῷ Ἰωσὴφ³⁹ κατὰ τὸν τύπον βασιλέως⁴⁰ Φαραώ⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/009.yaml
  text: For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner before King Pharaoh.
translation:
  language: zh_hans
  text: 因为他们来到埃及后，约瑟的侍从在大门外替他们脱了鞋履；于是，他们便按在法老王面前所用的礼仪，向约瑟下拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按在法老王面前所用的礼仪”：原文直译近于“按法老王的样式（或礼制）”。该简略表达所指的具体关系未明，可能是指朝见法老王时所行的礼仪，或与法老王有关的宫廷规制。
    reason: 说明 κατὰ τὸν τύπον βασιλέως Φαραώ 的压缩表达，并保留其礼仪样式与宫廷规制之间的含混性。
lexical_decisions:
- source_word: ὑπελύθησαν
  choice: 替他们脱了鞋
  rationale: 该动词在此为被动形式，结合施事者“约瑟的侍从”，表达侍从为他们除去鞋履；译作“替他们脱了鞋”符合现代汉语习惯。
- source_word: παίδων
  choice: 侍从
  rationale: παῖς 可指孩子、仆人或侍从；本处描述约瑟身边执行礼仪事务的人，译作“侍从”最贴合语境。
- source_word: πυλῶνος
  choice: 大门
  rationale: 该词可指门楼、门廊或大门区域；“大门外”自然清楚，并保留 ἔξωθεν 所表达的空间位置。
- source_word: προσεκύνησαν
  choice: 下拜
  rationale: 该词表示俯伏、跪拜或致敬；“下拜”既传达身体动作，也不额外断定其为敬拜神明。
- source_word: κατὰ τὸν τύπον
  choice: 按照……的礼仪
  rationale: τύπος 在这里指既定样式、规制或礼仪形式；“按照……的礼仪”比机械直译“按照样式”更符合宫廷场景。
theological_decisions:
- issue: 向约瑟下拜的性质
  choice: 译为“下拜”
  alternative: 敬拜
  rationale: 上下文是宫廷礼仪及向统治者致敬，不足以断定为宗教意义上的敬拜；“下拜”保留动作及尊崇含义而不作神学强化。
- issue: κατὰ τὸν τύπον βασιλέως Φαραώ 的关系
  choice: “按照对待法老王的礼仪”
  alternative: “如同在法老王面前一样”
  rationale: 希腊语表达简略，可理解为依照与法老王相关的礼仪模式；正文采用自然汉语表达，脚注说明原文的简略与歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“侍从”“下拜”“礼仪”适合宫廷叙事，又避免文言化和宗派性解释。
