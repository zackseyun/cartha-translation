  text: And the brothers of Joseph were not willing to preserve the life of their brother, and the Lord took from them the sandal that they wore against Joseph their brother.
translation:
  language: zh_hans
  text: 约瑟的兄弟们不肯保全他们兄弟的性命，主就把他们穿着、用来敌对他们兄弟约瑟的那只鞋从他们身上脱下了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从他们身上脱下……鞋”及“用来敌对……的鞋”依现存希腊文本直译；原句措辞和句法不寻常，鞋的具体含义并不明确。
    reason: 提示读者原文存在文本与语义上的困难，避免把晦涩意象误认为明确的固定象征。
lexical_decisions:
- source_word: οὐκ ἠθέλησαν ζωὴν ἀδελφοῦ αὐτῶν
  choice: 不肯保全自己兄弟的性命
  rationale: 原文在“生命”前后的句法可能有讹误；结合语境和英译审校层，将其自然表达为不愿保全兄弟的性命，同时不增添“杀害”等原文未明说的内容。
- source_word: ὁ Κύριος ὑπέλυσεν αὐτοὺς τὸ ὑπόδημα
  choice: 主便从他们那里取走了……鞋
  rationale: ὑπέλυσεν 与宾语结构不寻常，但基本意象是主解除或取下他们的鞋；“取走”既通顺，也避免把动作解释得过细。
- source_word: ὃ ἐφόρεσαν κατὰ Ἰωσὴφ
  choice: 他们为敌对……约瑟而穿的
  rationale: κατά 在此表示针对、敌对；保留“穿鞋敌对约瑟”这一突兀而可能具有象征性的原文意象，不将其改写成具体行为。
theological_decisions:
- issue: 主取走鞋这一行为的性质
  choice: 直译为主取走他们所穿的鞋
  alternative: 解释为神施行报应或剥夺权柄
  rationale: 原文没有明说鞋所象征的意义；译文保留神的行动及其神学张力，不引入特定象征解释。
translation_notes:
  register: 采用庄重而现代的叙事语体。“不肯保全……性命”自然清楚；后半句刻意保留原文关于鞋的陌生意象，并以脚注说明其不确定性。
