  text: 8. Διὰ γὰρ τοῦτο ἐκώλυσε ὁ⁴⁴ Κύριος *τοῦ μὴ ἀναβλῦσαι ὕδωρ⁴⁵ ἐν αὐτοῖς ἵνα *γένηται περιποίησις τῷ⁴⁶ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/003.yaml
  text: For this reason the Lord prevented water from springing up in them, so that provision might be made for Joseph, his brother.
translation:
  language: zh_hans
  text: 正因如此，主不让水从那些坑里涌出，好为约瑟预备所需。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ γὰρ τοῦτο
  choice: 正因如此
  rationale: 既表达因果承接，也保留 γὰρ 的解释语气，符合现代汉语叙述习惯。
- source_word: ἐκώλυσε
  choice: 不让
  rationale: 准确传达“阻止、禁止发生”，比生硬的“阻止水涌出”更自然。
- source_word: ἀναβλῦσαι ὕδωρ ἐν αὐτοῖς
  choice: 水从那些坑里涌出
  rationale: ἀναβλύω 表示水涌出；αὐτοῖς 按上下文指前述的坑，以“那些坑”明确中文所需的指代。
- source_word: γένηται περιποίησις τῷ Ἰωσήφ
  choice: 使约瑟得以保全
  rationale: περιποίησις 在此表示保存、保全；结合坑中没有水的叙事因果，译为“得以保全”比泛指物资供应的“得到供给”更符合语境，同时不扩写原文没有的“他的兄弟”。
theological_decisions:
- issue: 主的行动与约瑟获救之间的目的关系
  choice: 好使约瑟得以保全
  alternative: 以致约瑟得以保全
  rationale: ἵνα 通常表达目的或预期结果；采用“好使”保留原文明确的目的色彩，不弱化主主动干预的表述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那些坑”承接上下文所指，避免含混的“其中”；不采纳英文咨询层增添的“他的兄弟”，因为所给希腊文本中没有对应词语。
