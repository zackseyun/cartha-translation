  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/010.yaml
  text: And not only did they bow down to him, but they also immediately fell before him and spat, and they were put to shame by the Egyptians.
translation:
  language: zh_hans
  text: 他们不但向他下拜，而且立刻俯伏在他面前时，还被人吐唾沫；他们也受到埃及人的羞辱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκύνησαν
  choice: 向他下拜
  rationale: 表达俯身敬礼、臣服之意；此处语境不必限定为宗教敬拜。
- source_word: ἐνεπτύσθησαν
  choice: 向他吐唾沫
  rationale: 按此处经校订的主动意义理解为“他们吐唾沫”，并以“向他”自然表达动作对象，避免误译为“他们被吐唾沫”。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确传达动作随即发生。
- source_word: πεσόντες ἔμπροσθεν αὐτοῦ
  choice: 俯伏在他面前
  rationale: 保留分词所描写的伴随姿态，并采用自然、庄重的现代汉语。
- source_word: ἠσχύνθησαν παρὰ τῶν Αἰγυπτίων
  choice: 在埃及人面前蒙了羞
  rationale: παρά加属格在此句的关系略有张力；译作“在……面前”既符合羞辱场景，也避免无根据地明确为埃及人主动使他们受辱。
