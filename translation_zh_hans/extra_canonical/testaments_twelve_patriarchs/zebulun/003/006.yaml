source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. *Ἀλλὰ Συμεὼν² καὶ *ὁ Δὰν καὶ ὁ Γὰδ καὶ τὰ τέκνα αὐτῶν³, καὶ⁴ λαβόντες *τὴν τιμὴν αὐτοῦ⁵ ἐπρίαντο⁶ ὑποδήματα ἑαυτοῖς⁷ *καὶ ταῖς γυναιξὶν αὐτῶν⁸ Γκαὶ τοῖς τέκνοις αὐτῶν˥⁹, εἰπόντες· 3. *Οὐ φαγόμεθα αὐτήν¹⁰, ὅτι τιμὴ ἐστιν *αἵματος τοῦ ἀδελφοῦ ἡμῶν¹¹, ἀλλὰ καταπατήσει¹² καταπατήσωμεν¹³ αὐτήν, ἀνθ' ὧν εἶπεν βασιλεῦσαι¹⁴ ἐφ' ἡμᾶς¹⁵, καὶ ἴδωμεν¹⁶ τί ἐστι¹⁷ *τὰ ἐνύπνια¹⁸ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/006.yaml
  text: saying, “We will not eat it, because it is the price of our brother’s blood; rather, let us trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”
translation:
  language: zh_hans
  text: 说：“我们不吃这钱，因为这是我们兄弟的血价；倒不如把它踩在脚下，因为他说要作王统治我们；我们且看看他的那些梦究竟是什么。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ φαγόμεθα αὐτήν
  choice: 我们不吃这钱
  rationale: αὐτήν 回指前文阴性名词 τιμή，语境中指卖约瑟所得的价款；中文若直译为“吃它”容易误解为吃某件实物，因此以“吃这钱”表达“不以这笔钱购买食物享用”的含义，同时保留原文的吃用意象。
- source_word: τιμὴ ... αἵματος τοῦ ἀδελφοῦ ἡμῶν
  choice: 我们兄弟的血价
  rationale: τιμή 在此指价款；“血价”自然、凝练地保留了这笔钱因出卖兄弟而来的道德意味。
- source_word: καταπατήσωμεν αὐτήν
  choice: 把它踩在脚下
  rationale: 不定过去时虚拟式为劝勉用法，译作“不如……”，而非陈述将来必然发生之事；代词仍指那笔价款。
- source_word: βασιλεῦσαι ἐφ' ἡμᾶς
  choice: 要作王统治我们
  rationale: 同时表达 βασιλεύω 的“作王”和 ἐπί 加宾格所体现的辖制对象，避免仅译“统治”而淡化王权意象。
- source_word: τί ἐστι τὰ ἐνύπνια αὐτοῦ
  choice: 他的那些梦究竟是什么
  rationale: 保留原文略带讥讽和挑战意味的疑问表达；“那些梦”反映复数 τὰ ἐνύπνια。
theological_decisions:
- issue: “血价”的伦理及神学色彩
  choice: 保留“血价”这一直接表达
  alternative: 译作“出卖我们兄弟所得的钱”
  rationale: 原文明确并置“价款”与“血”，本身带有罪责意识；直译不额外引入赎罪、献祭等后来的神学解释。
- issue: 约瑟将要作王的说法
  choice: 译为“他说过要作王统治我们”
  alternative: 译为“他说自己会统治我们”
  rationale: 保留 βασιλεῦσαι 的王权用语，同时将此陈述归于约瑟之口，不把梦的神圣来源或实现方式预先解释出来。
translation_notes:
  register: 采用现代、庄重而易懂的叙事口吻。“不如……”“倒要看看”传达兄弟们带有轻蔑和挑战意味的商议语气。经文片段承接上一节，故以“说”起首。
