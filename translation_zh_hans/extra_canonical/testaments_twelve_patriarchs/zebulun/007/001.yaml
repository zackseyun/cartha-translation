- source_word: ὀθόνην
  choice: 一块布
  rationale: 此词指布、布片或床单一类织物；上下文有限，采用不把用途具体化的“一块布”。
- source_word: ἐξέτεινα
  choice: 铺展
  rationale: 表达“伸开、展开”的动作，并与布搭配得自然。
- source_word: ἐν ἑτέρῳ ξύλῳ ὀρθῷ
  choice: 在另一根竖直的木杆上
  rationale: ἕτερος为“另一”，ξύλον可指木材、木头或木制构件，ὀρθός意为直立；结合承托布的动作译作“竖直的木杆”，同时不进一步限定其结构。
- source_word: ἐν μέσῳ
  choice: 在中间
  rationale: 保留原文简略的空间表述，不擅自补明是在何物中间。
