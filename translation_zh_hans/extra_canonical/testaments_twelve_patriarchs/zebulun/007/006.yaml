  text: 5. Διὰ τοῦτο καὶ ὁ Κύριος *πολλοὺς ἰχθύας ἐνέπλησέ με²⁵ ἐν τῇ ἄγρᾳ τῶν ἰχθύων²⁶. Ὁ γὰρ μεταδιδοὺς τῷ πλησίον²⁷, λαμβάνει πολλαπλασίονα²⁸ παρὰ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/006.yaml
  text: For this reason the Lord also filled me with many fish in the catch of fish. For the one who shares with his neighbor receives many times more from the Lord.
translation:
  language: zh_hans
  text: 因此，主也使我在捕鱼时满载许多鱼。[a]因为，凡与邻舍分享的人，都会从主那里得到多倍的回报。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“主也在捕鱼的收获中，使我充满许多鱼”；这里译作“使我在捕鱼时满载许多鱼”，以符合汉语表达。
    reason: 希腊语“使我充满许多鱼”结构较不寻常，脚注交代其字面形式及正文的语境化处理。
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 准确表达由前文原因引出的结果，符合现代汉语叙述习惯。
- source_word: ἐνέπλησέ με
  choice: 使我……满载
  rationale: 原文直译为“使我充满”，但宾语是“许多鱼”；用捕鱼语境中的“满载”既保留丰足之意，也避免生硬表达。
- source_word: ἐν τῇ ἄγρᾳ τῶν ἰχθύων
  choice: 在捕鱼时
  rationale: ἄγρα 指捕捉、猎获或捕获所得，并非专指“渔网”；译作“捕鱼时”自然且不加入原文没有的器具。
- source_word: ὁ μεταδιδοὺς τῷ πλησίον
  choice: 凡与邻舍分享的人
  rationale: μεταδίδωμι 表示分给、分享；πλησίον 保留为具有伦理意味的“邻舍”。
- source_word: λαμβάνει πολλαπλασίονα
  choice: 都会……得到多倍的回报
  rationale: 原文以中性复数形容词作名词，所得到的具体事物未明说；“多倍的回报”传达倍增所得，同时不限定其种类。
theological_decisions:
- issue: 分享与从主所得之间的关系
  choice: 按原文保留一般性因果格言：“凡与邻舍分享的人，都会从主那里得到多倍的回报。”
  alternative: 弱化为“可能蒙主赐下更多”或限定为属灵赏赐
  rationale: 原文使用陈述语气，直接宣告分享者从主领受多倍；不应自行削弱，也不应把未说明的回报限定为物质或属灵性质。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“满载”贴合捕鱼丰收的场景；“邻舍”保留古代伦理教导的语感，但仍为普通读者所理解。
