  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/005.yaml
  text: If anyone was a foreigner, or sick, or aged, after boiling the fish and preparing them well, I would offer them to each according to need, suffering with them and feeling their pain.
translation:
  language: zh_hans
  text: 若有外乡人，或患病的，或年老的，我就把鱼煮好，按各人的需要妥善预备，供给众人，与他们一同忧伤，一同受苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξένος
  choice: 外乡人
  rationale: 此处指身处异地、缺少本地亲友扶助的人；“外乡人”比现代政治意义较强的“外国人”更贴合语境，同时保留陌生外来者之意。
- source_word: ἐψήσας τοὺς ἰχθύας
  choice: 把鱼煮熟
  rationale: ἐψήσας在此据版本校注和上下文指以煮制方式烹调；译为“煮熟”自然且明确。
- source_word: ποιήσας αὐτὰ ἀγαθῶς κατὰ τὴν ἑκάστου χρείαν
  choice: 按各人的需要料理妥当
  rationale: 保留“妥善准备”和“依各人需要”两层意思，并使修饰关系在中文中清楚自然。
- source_word: προσέφερον πᾶσι
  choice: 送给他们
  rationale: προσέφερον结合后面的阳性单数分词应理解为第一人称单数“我送上”；πᾶσι指前述各类有需要的人，中文以“他们”避免生硬。
- source_word: συναλγῶν καὶ συμπάσχων
  choice: 与他们一同忧伤，一同受苦
  rationale: 分别体现两个带有“共同”前缀的分词，既表达同情，也保留参与他人痛苦的强烈措辞。
theological_decisions:
- issue: 施助者与受助者的关系
  choice: 保留“与他们一同忧伤，一同受苦”的参与性表达
  alternative: 译作“同情他们，体恤他们的痛苦”
  rationale: 原文两个复合动词都强调“共同经历”，不宜弱化为仅有内在怜悯或旁观式同情。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。以“若有人……我就……”呈现希腊文条件结构；根据单数分词确定主语为第一人称“我”，不沿用可能误判为第三人称复数的修订稿。
