  text: And I was walking along the shore, fishing for fish for my father's house until we came to Egypt.
translation:
  language: zh_hans
  text: 我沿着海岸行走，捕捞鱼以供我父亲家中食用，直到我们来到埃及。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπορευόμενος τοὺς αἰγιαλούς
  choice: 沿着海岸行走
  rationale: 分词表示持续行进；复数 αἰγιαλούς 泛指所经过的海岸地带，汉语用单数集合表达更自然。
- source_word: ἁλιεύων ἰχθύας
  choice: 捕鱼
  rationale: 希腊文直译为“捕捞鱼”，现代汉语以“捕鱼”简洁、准确地表达同一动作。
- source_word: τῷ οἴκῳ τοῦ πατρός μου
  choice: 为父亲家
  rationale: 保留与格的受益含义；οἶκος 在此更可能指父亲的家户，而不只是房屋。
- source_word: ἕως ὅτου ἤλθομεν εἰς Αἴγυπτον
  choice: 直到我们来到埃及
  rationale: 准确保留时间界限以及动词由第一人称单数语境转为第一人称复数的变化。
