  text: And from my catch, showing compassion, I shared with every stranger.
translation:
  language: zh_hans
  text: 我出于怜悯，把自己捕获的分给每一个外乡人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῆς θήρας μου
  choice: 把我捕获的
  rationale: θήρα在此指打猎或捕捞所得；译作“我捕获的”保留猎获物类别未明的概括性，并与μετεδίδουν自然衔接。
- source_word: παντὶ ἀνθρώπῳ ξένῳ
  choice: 每一个外乡人
  rationale: 逐项体现παντί、ἀνθρώπῳ和ξένῳ；“外乡人”在现代汉语中自然，也保留对非本地陌生人的宽泛所指。
- source_word: σπλαγχνιζόμενος
  choice: 怜悯
  rationale: 表达由衷的同情与怜恤；在汉语中改用并列谓语，避免生硬的分词结构。
- source_word: μετεδίδουν
  choice: 分给他们
  rationale: 该未完成时动词表示把自己所有的分给别人，并可含持续或惯常行为；上下文中的复数代词由“每一个外乡人”自然补出。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。调整希腊语分词和成分次序，使主干清楚；不限定猎获物究竟来自狩猎还是捕捞，也不为怜悯行为加入原文没有的神学解释。
