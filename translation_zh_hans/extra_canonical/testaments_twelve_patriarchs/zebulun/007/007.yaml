  text: For five years, then, I fished, sharing with everyone I had seen, and providing for all my father’s house.
translation:
  language: zh_hans
  text: 于是，我捕鱼五年，把所得分给我见过的每一个人，并供给我父亲全家所需。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίευσα
  choice: 我打了……鱼
  rationale: 以现代汉语自然表达捕鱼这一持续从事的活动，并保留简单过去时的叙述作用。
- source_word: μεταδιδούς
  choice: 把所得分给
  rationale: 该词意为分享、分给；结合捕鱼语境，补出隐含的分享对象“所得”，使中文清楚自然，但不限定为鱼或钱。
- source_word: παντὶ ἀνθρώπῳ ὃν ἑωράκειν
  choice: 我所见到的每一个人
  rationale: 贴近现存希腊文本的字面结构，保留其范围宽泛而略显异常的表述。
- source_word: ἐξαρκῶν
  choice: 供应……所需
  rationale: 表达使其够用、充分供给之义，符合家庭供养语境。
- source_word: παντὶ τῷ οἴκῳ τοῦ πατρός μου
  choice: 我父亲全家
  rationale: οἶκος在此指父亲的整个家室或家族共同体；译作“全家”简洁且符合现代汉语。
theological_decisions: []
