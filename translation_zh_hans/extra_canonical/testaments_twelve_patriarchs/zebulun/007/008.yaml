source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. *Καὶ τὸ μὲν ἥμισυ³² *ἐν τῷ χειμῶνι³³ ἐτοιμαίμην μετὰ τῶν ἀδελφῶν μου. 8. Εἰ δὲ μὴ ἔχετε δοῦναι τῷ χρήζοντι, συμπάσχετε αὐτῷ⁷ ἐν σπλάγχνοις ἐλέους. 9. Οἶδα⁸ ὅτι ἡ χείρ μου *οὐχ εὗρε⁹ ἐπιδοῦναι¹⁰ τῷ χρήζοντι, καὶ ἐπὶ¹¹ ἑπτὰ σταδίους συμπορευόμενος αὐτῷ ἔκλαιον· καὶ τὰ σπλάγχνα μου *ἐστρέφετο ἐπʼ αὐτῷ¹² εἰς συμπάθειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/008.yaml
  text: Half of it I would set aside in winter with my brothers. But if you do not have anything to give to the one in need, suffer with him in inward parts of mercy. I know that my own hand did not find anything to give to the one in need, and walking together with him for seven stadia I would weep; and my inward parts turned toward him in sympathy.
translation:
  language: zh_hans
  text: 你们若没有什么可以给有需要的人，就要以怜悯的心肠与他一同受苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δὲ μὴ ἔχετε δοῦναι
  choice: 你们若没有什么可以给
  rationale: 按希腊文条件句直译其核心意思；主语为复数“你们”，并保留“没有可给之物”的语义。
- source_word: τῷ χρήζοντι
  choice: 有需要的人
  rationale: χρήζω表示缺乏、需要；此处不把对象限缩为特定类别的“穷人”。
- source_word: συμπάσχετε αὐτῷ
  choice: 与他一同受苦
  rationale: 保留συμπάσχω中“共同承受痛苦”的强烈含义，而不弱化为一般的同情。
- source_word: ἐν σπλάγχνοις ἐλέους
  choice: 以怜悯的心肠
  rationale: σπλάγχνα在古代惯指深层情感所在；“心肠”在现代汉语中自然且仍保留其身体性意象，ἐλέους译为“怜悯”。
theological_decisions:
- issue: 怜悯是否仅指内在情感
  choice: 以“怜悯的心肠与他一同受苦”表达内在怜悯及共同承受
  alternative: 从心里同情他
  rationale: 原文把συμπάσχετε与σπλάγχνοις ἐλέους并置，语气强于单纯感到同情；译文不把它改写为施舍义务，也不削弱共同受苦的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“心肠”保存原文的内脏意象而不显生硬；“与他一同受苦”刻意保留原文力度。
