base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/004.yaml
  text: Therefore do not be divided into two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members.
translation:
  language: zh_hans
  text: 所以，不要分裂成两个头；因为主所造的一切都只有一个头，却有两个肩膀、两只手、两只脚，以及其他所有肢体。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: 分裂成两个头
  rationale: 保留原文以身体为喻的表达及其劝诫语气；“分裂成”既传达 χωρισθῆτε 的分开、分裂之意，也不把 ἐν 的具体关系过度解释为“受两个首领统辖”。
- source_word: πᾶν ὃ ἐποίησεν ὁ Κύριος
  choice: 主所造的一切
  rationale: 简洁自然地对应原文，保留“主”作为创造者以及 πᾶν 的概括范围。
- source_word: κεφαλὴν μίαν κέκτηται
  choice: 都只有一个头
  rationale: κέκτηται 表示具有、拥有；“只有”自然突出“一”与后文“两”的对照。
- source_word: τὰ λοιπὰ μέλη ἅπαντα
  choice: 其他所有肢体
  rationale: μέλη 在身体语境中译为“肢体”，既准确又保留可能延伸出的群体隐喻。
theological_decisions:
- issue: “两个头”的隐喻所指
  choice: 保留为“分裂成两个头”
  alternative: 译作“分属两个首领”或“受两个头统辖”
  rationale: 原文没有明确说明“头”是领袖、思想、意志还是群体派别，因此不在正文中消解这一有意保留的隐喻张力。
- issue: 受造物身体结构陈述的范围
  choice: 按原文概括性措辞译为“主所造的一切”
  alternative: 限定为“主所造的每一个人”或“每一个身体”
  rationale: 虽然后文显然采用身体结构作比喻，原文 πᾶν 仍是宽泛表达；译文不擅自缩窄其语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号连接禁令与理由，并用“却有”凸显一个头与成双肢体之间的修辞对照。
