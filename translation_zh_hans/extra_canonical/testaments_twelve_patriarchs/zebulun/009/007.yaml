  text: 7. Καὶ μετὰ ταῦτα μνησθέντες Κύριον †ἐπιστρέψετε³³ καὶ ἐλεήσει³⁴ ὑμᾶς, ὅτι ἐλεήμων ἐστὶ καὶ εὔσπλαγχνος, *καὶ οὐ λογίζεται³⁵ κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων διότι σάρξ εἰσιν καὶ πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/007.yaml
  text: And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go astray in their evil deeds.
translation:
  language: zh_hans
  text: 这些事以后，你们想起主，就会回转；他必怜悯你们，因为他满有怜悯和慈悲，不把恶归算给世人，因为他们是血肉之躯，在自己的恶行中走迷。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给希腊正文在“就会回转”及“不把恶归算给世人，因为他们是血肉之躯，在自己的恶行中走迷”这一后半句的相关位置带有校勘符号；所提供材料未列出异读，故本译依所给正文。
    reason: 剑号、星号及校勘编号表明这些位置在底本中受校勘关注，但没有异读资料可供翻译或评估；脚注仅提示此一限制，不臆拟异文。
lexical_decisions:
- source_word: μνησθέντες Κύριον
  choice: 想起主
  rationale: 保留分词的时间含义，表达“当你们想起主时”，并采用简洁自然的现代汉语。
- source_word: ἐπιστρέψετε
  choice: 就会回转
  rationale: ἐπιστρέφω可指返回、转回；“回转”既保留方向性，也不把经文过度限定为某一套悔改术语。
- source_word: ἐλεήσει
  choice: 必怜悯
  rationale: 准确表达将来时以及ἐλεέω所含的施怜悯之意。
- source_word: ἐλεήμων καὶ εὔσπλαγχνος
  choice: 满有怜悯和慈悲
  rationale: 以自然庄重的汉语分别传达怜悯与深切慈悲；“满有”用于通顺表达性质陈述。
- source_word: οὐ λογίζεται κακίαν
  choice: 不把恶算在……身上
  rationale: 保留λογίζομαι“计算、归算”的意象，也保留“恶”可指恶事或罪恶的宽度。
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: 世人
  rationale: 该表达字面为“人的众子”，在此泛指人类；译作“世人”符合现代汉语，又不引入性别排除。
- source_word: σάρξ εἰσιν
  choice: 他们是血肉之躯
  rationale: 保留σάρξ的受造、软弱和有限意味，不将其直接解释为特定神学意义上的“罪性”。
- source_word: πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν
  choice: 在自己的恶行中走迷了
  rationale: 保留πλανάομαι的迷失、走偏意象，以及ἐν与“恶行”之间略显开放的关系。
theological_decisions:
- issue: 上帝“不把恶算在世人身上”的范围与含义
  choice: 按原文直译为“不把恶算在世人身上”
  alternative: 解释为“不因世人的恶行定他们的罪”或“永不追究人的罪恶”
  rationale: 原句把此陈述与人的血肉软弱及迷失相连，但未明确界定其时间、条件或最终审判含义；译文不扩大为普遍免罪论，也不削弱其强烈的怜悯表述。
- issue: “回转”的性质
  choice: 保留“回转”
  alternative: 译作“悔改归向主”
  rationale: 原文只有ἐπιστρέψετε，没有明说回转的对象；上下文虽暗示归向主，仍不在正文中补足，以保存原有省略。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回转”“算在……身上”“血肉之躯”等措辞保留原文的宗教与修辞色彩，同时避免古奥句式；分号划分回转、蒙怜悯及理由，使长句层次清楚。
