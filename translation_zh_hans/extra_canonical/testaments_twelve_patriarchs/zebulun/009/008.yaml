  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/008.yaml
  text: And after these things the Lord himself will rise for you, the light of righteousness.
translation:
  language: zh_hans
  text: 此后，主必亲自为你们升起，作公义之光。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 简洁表达“这些事以后”，符合现代汉语经文体。
- source_word: ἀνατελεῖ
  choice: 升起
  rationale: 保留原词可指日光、星辰升起的意象，并与后面的“光”自然呼应；不具体化为“显现”或“兴起”。
- source_word: ὑμῖν
  choice: 为你们
  rationale: 表达与格所指的受益或关联关系；底本以括号标示该词存在文本疑问，但现有信息不足以在正文中删除。
- source_word: αὐτὸς ὁ Κύριος
  choice: 主必亲自
  rationale: 以“亲自”传达强调性的 αὐτός，同时保持“主”为核心主语。
- source_word: φῶς δικαιοσύνης
  choice: 公义之光
  rationale: 保留属格结构的简洁性及其可能包含的性质、来源或表征关系，不将其收窄为“带来公义的光”。
theological_decisions:
- issue: “公义之光”与“主”的句法关系
  choice: 译为“成为公义之光”
  alternative: “主——公义之光——必亲自为你们升起”
  rationale: 希腊文中该短语可作同位语或表述主升起时作为光的身份；“成为”使中文句子自然，但不把它解释为本体发生变化，而是表明其显现角色。
- issue: ἀνατελεῖ 的弥赛亚性含义
  choice: 保留“升起”的意象
  alternative: 译为“兴起”或“显现”
  rationale: 不预先认定特定弥赛亚称号或教派解释，同时保留光明意象及潜在经文互文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“此后”简明，“必亲自为你们升起”保留预言语气与原文强调；全句避免古奥措辞，也不额外加入特定神学身份说明。
