  text: 你们也一样：如果你们分裂了，就会是这样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς
  choice: 你们也一样
  rationale: Καί在此承接前文并将同一情形应用于听众；译为“也一样”比生硬的“并且你们也”更符合现代汉语。
- source_word: ἐὰν διαιρεθῆτε
  choice: 如果彼此分裂
  rationale: 保留ἐάν所表达的条件；被动式διαιρεθῆτε表示群体被分开、陷入分裂，结合复数主语译作“彼此分裂”自然且不额外指定分裂原因。
- source_word: ἔσεσθε οὕτως
  choice: 就会成为这样
  rationale: ἔσεσθε是εἰμί的将来时，表示将来的状态；“成为这样”在汉语中自然表达进入前文所述状态，同时“这样”保留οὕτως对前文的指代。
