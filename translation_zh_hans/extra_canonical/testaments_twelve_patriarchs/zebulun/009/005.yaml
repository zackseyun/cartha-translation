  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/005.yaml
  text: For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow after two kingdoms, and you will commit every abomination.
translation:
  language: zh_hans
  text: 因为我从我祖先的文献中得知，你们将在以色列中分裂，追随两个王国，并做一切可憎之事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γραφῇ τῶν πατέρων μου
  choice: 从我祖先的典籍中
  rationale: γραϕή 在此指祖先传下的书面记载；译作“典籍”既保留书面文献之意，也符合庄重的遗训语体。
- source_word: Διαιρεθήσεσθε ἐν Ἰσραήλ
  choice: 你们将在以色列中分裂
  rationale: 保留被动式和“在以色列中”的范围表达，不擅自具体化分裂的方式或对象。
- source_word: ἐξακολουθήσετε
  choice: 追随
  rationale: 该动词表示跟从、随从；与“两个王国”搭配时，“追随”自然且保留其效忠或依附的可能含义。
- source_word: πᾶν βδέλυγμα ποιήσετε
  choice: 行各样可憎之事
  rationale: βδέλυγμα 指令人厌恶、可憎之物或行为；汉语圣经式庄重表达“行……之事”自然，而“各样”比机械的“每一件”更符合集合性语境。
theological_decisions:
- issue: “两个王国”的历史指向
  choice: 保留“两个王国”，不加解释
  alternative: 明确译为以色列国和犹大国
  rationale: 原文只说 δύο βασιλείαις，并未在本句点明具体名称；直译可保存文本自身的预言性与历史解释空间。
- issue: βδέλυγμα 的宗教含义范围
  choice: 译为“可憎之事”
  alternative: 译为“偶像崇拜”或“污秽之事”
  rationale: 原词可能涵盖宗教、道德及礼仪层面的可憎行为，限定为某一种罪会缩窄原文范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“典籍”体现祖先书面传统；全句保持预言性遗训的凝练语气，并避免加入原文未明说的历史或宗派解释。
