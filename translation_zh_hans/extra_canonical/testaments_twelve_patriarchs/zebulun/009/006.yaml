  text: And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses.
translation:
  language: zh_hans
  text: 你们的仇敌必把你们掳去；你们必在列国中遭受苦难，经历许多软弱和患难。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωτεύσουσιν
  choice: 必掳走
  rationale: 表达被敌人俘掳、带走的含义，符合现代汉语习惯。
- source_word: κακωθήσεσθε
  choice: 必……遭受苦难
  rationale: 该被动动词泛指受苦、受虐待或遭祸害；译文保留其宽泛含义。
- source_word: ἐν ἔθνεσιν
  choice: 在列国中
  rationale: 保留复数 ἔθνεσιν 所指的众多外邦国家或民族，不限定为某一地域。
- source_word: ἀσθενείαις
  choice: 软弱
  rationale: 原词可指软弱、衰弱或疾病；采用较宽泛的“软弱”，不把语义收窄为疾病。
- source_word: θλίψεσιν
  choice: 患难
  rationale: 传达压迫、困苦与灾难的综合含义，且符合庄重的经文语体。
