base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/002.yaml
  text: But if they are divided into many parts, the earth destroys them, and they become easy to despise.
translation:
  language: zh_hans
  text: 但如果它们被分成许多部分，大地就使它们消失，它们也就变得容易被轻视。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πολλὰ διαιρεθῶσιν
  choice: 被分成许多部分
  rationale: 保留原文被动语态及“分成许多”的宽泛含义，不将其具体化为“许多支流”。
- source_word: ἡ γῆ
  choice: 大地
  rationale: 对应 γῆ；在此比“土地”更自然，也保留其作为吞没或消解诸部分之场域的表达。
- source_word: ἀφανίζει
  choice: 使……消失
  rationale: 该动词可表示使之不见、消灭或除去；“使……消失”贴近基本语义，同时避免过度强化为彻底毁灭。
- source_word: εὐκαταφρόνητα
  choice: 容易被轻视
  rationale: 直接表达该形容词“易受藐视、易被看不起”的含义，并保持原文结果性的语气。
