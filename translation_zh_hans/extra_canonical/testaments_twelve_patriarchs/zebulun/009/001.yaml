  text: Therefore pay attention to the waters, and understand that when they flow together to the same place, they carry down stones, wood, earth, and various other things.
translation:
  language: zh_hans
  text: 所以，你们要留意众水；要知道，当它们汇流到一处时，就会把石头、木头、泥土和其他各种东西一并冲走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: 要留意
  rationale: 表达持续观察、注意之意；比“当心”更符合此处以水流为例进行劝诫的语境。
- source_word: τὰ ὕδατα
  choice: 众水
  rationale: 保留希腊文复数，同时使用自然且略带庄重感的汉语表达。
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: 汇流到一处
  rationale: 按水流语境表达趋向同一地点、汇合而流的意思，同时保留“到一处”的空间指向。
- source_word: κατασύρουσιν
  choice: 一并冲走
  rationale: 体现水流将重物和杂物向下或沿途拖带而去的强烈动态；“冲走”较自然，“一并”呼应所列各物。
- source_word: λίθους, ξύλα, γῆν
  choice: 石头、木头、泥土
  rationale: 分别直译所列物质；γῆν 在水流裹挟的语境中译作“泥土”比泛指“地”自然。
- source_word: καὶ ἕτερά τινα
  choice: 和其他各种东西
  rationale: 保留“不特定的另一些事物”之意，以现代汉语自然表达。
