    7 原来，西缅、但和迦得来到约瑟跟前，要杀他。约瑟流着泪对他们说：


    8 “我的兄弟们，可怜我吧！请体恤我们父亲雅各的肺腑之情[d]。不要伸手流无辜人的血，因为我并没有得罪你们。


    9 即使我犯了罪，我的兄弟们，也可以责罚管教我；但为了你们父亲雅各的缘故，不要伸手杀害你们的兄弟。”


