  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002.yaml
  text: '1 Sons of Zebulun[a], pay attention to the words of your father.

    2 I, Zebulun, became a good gift to my parents; for when I was born, my father prospered greatly, and the sheep and the cattle also, when with the variegated rods he had his share.

    3 And I do not know that I sinned in my days, except in intention.

    4 I do not remember that I committed lawlessness, except for the ignorance that I showed concerning Joseph, in that I gave my brothers my word not to tell my father what had happened.

    5 But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.

    6 Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin[b].

    7 For Simeon and Dan and Gad came against Joseph to kill him, and he said to them with tears,

    8 “Have mercy on me, my brothers; pity the inward compassion of Jacob our father. Do not lay your hands on me to shed innocent blood, for I have not sinned against you.

    9 But even if I have sinned, discipline me with correction, my brothers; yet do not bring your hand to the murder of your brother, for the sake of Jacob your father.”

    10 And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.

    11 And I wept together with Joseph, and my heart thundered, and the joints of my body trembled[c][d], and I had no strength.'
translation:
  language: zh_hans
  text: '《西布伦遗训》第2章


    1 西布伦的众子啊，要留心听你们父亲的话。


    2 我西布伦成了父母所得的一份美好礼物；因为我出生时，我父亲大大兴旺，羊群和牛群也增多了；那时，他借着斑驳的枝条[a]得了自己的一份。


    3 我不知道自己一生中犯过什么罪，除了心中的意念[b]以外。


    4 我不记得自己做过不法之事，只有在约瑟的事上所行的无知之举：我向兄弟们作了保证，不把所发生的事告诉父亲。


    5 但我因约瑟的缘故，暗中哭了许多天。我惧怕我的兄弟们，因为他们一致约定，无论谁泄露这个秘密，都要把他处死。


    6 然而，他们想杀约瑟的时候，我流着泪恳求他们不要犯这罪。


    7 原来，西缅、但和迦得来到约瑟跟前，要杀他。约瑟流着泪对他们说：


    8 “我的兄弟们，可怜我吧！请体恤我们父亲雅各的肺腑之情[d]。不要伸手流无辜人的血，因为我并没有得罪你们。


    9 即使我犯了罪，我的兄弟们，也可以责罚管教我；但为了你们父亲雅各的缘故，不要伸手杀害你们的兄弟。”


    10 他悲痛地说这些话时，我再也忍受不了他的哀号，便哭了起来；我的肝仿佛倾倒出来[c]，腹中的一切都衰弱无力。


    11 我与约瑟一同哭泣；我的心轰鸣，浑身关节颤抖，再也站立不住。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“斑驳的枝条”呼应《创世记》30章中雅各繁育羊群的记载。
    reason: cross_reference
  - marker: b
    text: 原文译作“除了心中的意念以外”的短语较为艰涩，也可能指内在思想，而不是已经做出的行为。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“我的肝倾倒出来”；这是古代用身体器官形容极度哀痛的强烈说法。
    reason: cultural_note
  - marker: d
    text: 原文直译为“体恤我们父亲雅各的内脏”。古人常用身体内部的器官表达深切的怜悯、亲情或内心情感；这里是求他们顾及父亲的深切感受。
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ῥήμασιν
  choice: 要留心听……的话
  rationale: 兼顾命令语气和现代汉语的自然表达，既传达专注，也保留遗训开篇的郑重口吻。
- source_word: δόσις ἀγαθή
  choice: 一份美好礼物
  rationale: 保留具体的“礼物”意象，不把西布伦对自己出生的描述抽象化为“福分”。
- source_word: ηὐξήνθη
  choice: 大大兴旺
  rationale: 上下文涉及雅各及其牲畜的增多，“兴旺”能自然涵盖家业增长；羊群、牛群则明确译为“增多”。
- source_word: ποικίλαις ῥάβδοις
  choice: 斑驳的枝条
  rationale: 保留《创世记》育种叙事中的实物和斑驳外观；“枝条”比“杖”更符合该场景。
- source_word: παρεκτὸς ἐννοίας
  choice: 除了心中的意念以外
  rationale: 原文短语艰涩，可能指内在意念而非外在行为；此译保留其含混与道德张力。
- source_word: παρανομίαν
  choice: 不法之事
  rationale: 保留该词的道德—律法色彩，不弱化为一般性的“错事”。
- source_word: ἄγνοιαν
  choice: 无知之举
  rationale: 保留西布伦将自己在约瑟事件中的过失描述为“无知”的自我判断，同时使中文句法通顺。
- source_word: ἐβεβαίωσα
  choice: 作了保证
  rationale: 表达他坚定参与保密约定，而不只是口头赞同。
- source_word: μυστήριον
  choice: 秘密
  rationale: 此处指被隐瞒的约瑟事件，并非后世神学术语意义上的“奥秘”。
- source_word: ἀναιρεθῆναι
  choice: 处死
  rationale: 清楚传达泄密者将被杀的约定，符合上下文的严肃语气。
- source_word: σπλάγχνα
  choice: 肺腑
  rationale: 以现代读者可理解而仍带身体意象的词，呈现古代以内脏表达深切情感的说法。
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: 我的肝仿佛倾倒出来
  rationale: 保留强烈而陌生的身体化哀痛意象；加入“仿佛”使其在中文中明确为形象表达，而不改写成抽象情绪。
- source_word: ἐβόμβει ἡ καρδία μου
  choice: 我的心轰鸣
  rationale: 保留原文听觉和身体震动的强烈效果，不淡化为“心里难过”。
theological_decisions:
- issue: 西布伦宣称自己未犯罪，却承认约瑟事件中的过失
  choice: 直译其张力：先说除心中意念外不知道自己犯过罪，随后承认在约瑟之事上的“无知之举”。
  alternative: 将两句顺译为“除约瑟一事外，我一生无罪”，或省略艰涩的“意念”短语。
  rationale: 希腊文本呈现复杂甚至不完全协调的自我评断；译文不替作者消除这种伦理与神学张力。
- issue: 怜悯与悲痛的身体化语言
  choice: 保留“肺腑”“肝仿佛倾倒出来”“腹中的一切”等身体词语。
  alternative: 统一改写为“体恤父亲的深情”“我悲痛欲绝”等抽象情绪表达。
  rationale: 原文以身体器官承载怜悯和哀痛；保留这些意象能呈现文本自身的古代情感语言，同时以脚注帮助现代读者。
- issue: 约瑟是否“无辜”与他随后假设自己可能有罪
  choice: 保留“无辜人的血”及“即使我犯了罪”并列。
  alternative: 把后一句处理成对前句的撤回，或将“无辜”弱化为仅指不当受刑。
  rationale: 约瑟的申辩兼有无罪宣告和退一步的请求；译文不强行把两者系统化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。遗训开篇保持郑重劝诫语气；叙事与引语清楚分段。对现代汉语较陌生但承载原文修辞的身体意象予以保留，并用脚注解释。人名依中文圣经常见译法处理；不加入宗派性术语或额外教义解释。
