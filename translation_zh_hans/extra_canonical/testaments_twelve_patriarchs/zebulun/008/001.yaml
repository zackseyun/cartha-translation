  text: VIII. Καὶ ὑμεῖς οὖν, τέκνα μου, ἔχετε εὐσπλαγχνίαν *κατὰ παντὸς ἀνθρώπου¹ ἐν ἐλέει, ἵνα καὶ ὁ Κύριος *εἰς ὑμᾶς σπλαγχνισθεὶς² ἐλεήσῃ ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/001.yaml
  text: And so, my children, have compassion toward every person in mercy, so that the Lord also, having compassion on you, may show you mercy.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要以怜悯之心体恤每一个人，好使主也体恤你们，怜悯你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνίαν
  choice: 同情
  rationale: 表达发自内心的怜恤与关怀，并与后文同根动词“同情”形成呼应。
- source_word: κατὰ παντὸς ἀνθρώπου
  choice: 每一个人
  rationale: 忠实保留范围无例外的“所有人／每一个人”；“对每一个人”自然融入“同情”的宾语结构。
- source_word: ἐν ἐλέει
  choice: 以怜悯的心
  rationale: 保留“在怜悯中”的方式或态度含义，同时采用自然的现代汉语表达。
- source_word: σπλαγχνισθεὶς
  choice: 同情
  rationale: 与εὐσπλαγχνίαν保持词义呼应；希腊语分词在此表达主施怜悯时的慈悲心肠，不必机械译成完成时。
- source_word: ἐλεήσῃ
  choice: 怜悯
  rationale: 直接表达施予慈悲、恩待之意，并保留与ἐν ἐλέει的词汇关联。
theological_decisions:
- issue: 人的怜悯与主的怜悯之间的关系
  choice: 译作“好使”，保留目的或结果导向的句法关系
  alternative: 译作“因为主会”或明确解释为功德交换
  rationale: ἵνα引出目的／结果从句；原文形成伦理劝勉与神的怜悯之间的张力，但没有进一步界定其因果或功德性质，因此不作教义化解释。
- issue: σπλαγχνισθεὶς的时体
  choice: 译为“也同情你们”
  alternative: 译为“已经同情了你们”
  rationale: 不定过去时分词可概括主的怜悯行动，与主句“怜悯你们”关系紧密；汉语不强加先时或完成体，以免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“我的孩子们”保留亲切的家训口吻；“以怜悯的心同情”兼顾ἐν ἐλέει的结构与自然汉语。原文星号及上标数字属于版本校勘标识，当前材料未提供对应异文内容，故不转作经文脚注。
