base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/005.yaml
  text: Paying attention to him, you also, my children, love one another, and let each one not reckon evil against his brother.
translation:
  language: zh_hans
  text: 我的孩子们，你们也要留意他；要彼此相爱，谁也不要对自己的弟兄心怀恶意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχοντες
  choice: 留心效法
  rationale: 该分词本义为“留意、专注于”；在此承接所指人物的榜样，译作“留心效法”使中文自然，并保留以他为关注对象的含义。
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: 彼此相爱
  rationale: 准确传达相互之爱的命令，也是现代汉语中自然、庄重的表达。
- source_word: μὴ λογίζεσθε … κακίαν
  choice: 不要……心怀恶意
  rationale: λογίζομαι 可指盘算、计较或存念；与 κακίαν 连用时，“心怀恶意”自然表达内心针对弟兄的恶念，同时不具体限定为报复或记账式计较。
- source_word: ἀδελφὸν αὐτοῦ
  choice: 自己的弟兄
  rationale: 保留亲属称谓及反身所属关系，不将其泛化为“别人”。
theological_decisions:
- issue: “他”所指对象及 προσέχοντες 的语义力度
  choice: 留心效法他
  alternative: 留意他／专注于他
  rationale: 原文代词的具体指向依赖上文，本节不补明身份；“效法”表达关注榜样的语境功能，但仍保留“他”，避免擅自确定所指。
- issue: λογίζεσθε κακίαν 的具体含义
  choice: 心怀恶意
  alternative: 图谋恶事／计较过错／以恶相待
  rationale: 原文可涉及思想、盘算或认定恶事；采用较宽泛的“心怀恶意”，避免将其过度限定为某一种行为或伦理情境。
translation_notes:
  register: 采用现代、清楚而庄重的劝诫语体。“我的孩子们”保留父辈训诫式称呼；分为两句以符合现代汉语节奏。
