base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/006.yaml
  text: For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.
translation:
  language: zh_hans
  text: 因为这会使合一分裂，使一切亲族离散，扰乱心灵，损毁人的面容。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρίζει ἑνότητα
  choice: 破坏合一
  rationale: 直译为“使合一分离”在汉语中生硬；“破坏合一”自然地表达使原有团结合一破裂的意思。
- source_word: πᾶσαν συγγένειαν διασκορπίζει
  choice: 离散一切亲情
  rationale: συγγένεια指亲属关系或亲族情谊；“亲情”兼顾关系层面与本句劝诫语境，διασκορπίζει译为“离散”以保留拆散、驱散之意。
- source_word: τὴν ψυχὴν ταράσσει
  choice: 扰乱心灵
  rationale: ψυχή在此指人的内在生命或心灵；“扰乱心灵”保留原文的心理与属灵张力，不缩减为单纯情绪。
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: 使人面容失色
  rationale: ἀφανίζει字面有使消失、毁坏或损伤之意；与“面容”搭配时，“使人面容失色”是自然汉语，也保留造成外在容貌受损的效果。
