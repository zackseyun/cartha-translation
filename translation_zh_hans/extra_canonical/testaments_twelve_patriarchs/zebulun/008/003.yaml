base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/003.yaml
  text: For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.
translation:
  language: zh_hans
  text: 因为人对自己的邻舍有多少怜悯，主对他也有多少怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνίζεται
  choice: 怜悯
  rationale: 该动词表示由衷的怜悯与同情；“怜悯”简洁、庄重，并能在前后两个分句中保留原文的对应关系。
- source_word: ὁ Κύριος
  choice: 主
  rationale: 按犹太宗教语境及原文定冠词用法译为“主”，不进一步指明所指，以保留原文表达。
- source_word: ὁ πλησίον αὐτοῦ
  choice: 自己的邻舍
  rationale: “邻舍”准确传达 πλησίον 的关系性含义；“自己的”对应 αὐτοῦ，使所指清楚而不扩大为泛指的所有人。
- source_word: ὅσον … τοσοῦτον
  choice: 怎样……也照样……
  rationale: 这一汉语关联结构自然地表达原文程度相称的关系，同时避免生硬直译为“多少……多少”。
theological_decisions:
- issue: 人的怜悯与主的怜悯之间的关系
  choice: 保留为相称关系：“怎样……也照样……”
  alternative: 译成明确的因果或功德回报：“因为人怜悯邻舍，所以主就怜悯他”
  rationale: 原文 ὅσον…τοσοῦτον 强调对应的程度，并未明确说明功德、条件或严格的因果机制，因此不作额外神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。两个分句重复“怜悯”，以保存希腊原文的词汇呼应；句式简洁，适合经文体裁。
