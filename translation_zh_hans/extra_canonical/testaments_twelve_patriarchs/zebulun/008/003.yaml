  text: 3. Ὅσον γὰρ⁸ ἄνθρωπος σπλαγχνίζεται εἰς *τὸν πλησίον αὐτοῦ⁹, τοσοῦτον *καὶ ὁ⁴ Κύριος εἰς αὐτόν.
