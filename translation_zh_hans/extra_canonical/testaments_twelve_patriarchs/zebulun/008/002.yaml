  text: 2. Ὅτι καίγε³ ἐπʼ ἐσχάτων τῶν⁴ ἡμερῶν ὁ Θεὸς ἀποστελεῖ⁵ *τὰ σπλάγχνα⁶ αὐτοῦ ἐπὶ τῆς⁷ γῆς, καὶ ὅπου εὕρῃ σπλάγχνα ἐλέους, ἐν αὐτῷ κατοικεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/002.yaml
  text: For indeed in the last days God will send his compassion upon the earth, and wherever he finds compassion of mercy, there he dwells.
translation:
  language: zh_hans
  text: 因为在末后的日子，上帝必将他的怜悯遣到地上；他无论在哪里发现有怜悯之心的人，就住在那人里面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ σπλάγχνα αὐτοῦ
  choice: 他的怜悯
  rationale: σπλάγχνα字面指“内脏”，在此按希腊语情感用法表示发自内心的怜悯；译作“怜悯”自然且保留核心意义。
- source_word: ἀποστελεῖ
  choice: 必将……赐予
  rationale: 原义为“将差遣、发送”。与抽象名词“怜悯”搭配时，“赐予”符合现代汉语表达，同时保留来自上帝的主动施予。
- source_word: σπλάγχνα ἐλέους
  choice: 怜悯的心
  rationale: 该短语强化内在慈悲之意；译作“怜悯的心”既反映σπλάγχνα的内心意象，也避免生硬重复“怜悯之怜悯”。
- source_word: ἐν αὐτῷ κατοικεῖ
  choice: 就住在哪里
  rationale: αὐτῷ在语法上可指具有怜悯之心的人；为顺应前面的地点式ὅπου并保持原文表达张力，采用自然的汉语地点回指。
theological_decisions:
- issue: 上帝居住之处与人的怜悯之间的关系
  choice: 他在哪里发现人有怜悯的心，就住在哪里
  alternative: 他在谁身上发现怜悯的心，就住在谁里面
  rationale: 原文由ὅπου（哪里）转到ἐν αὐτῷ（在他/它里面），兼有地点与人格化指向。正文保留地点式表达，不进一步界定为神秘内住或特定教义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“末后的日子”为宗教文献中通行且易懂的末世表达；全句尽量保留原文的因果语气、将来时态和“怜悯—居住”的意象。
