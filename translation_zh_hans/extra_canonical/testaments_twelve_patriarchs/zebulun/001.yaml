  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001.yaml
  text: '1 A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.


    2 And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.


    3 I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.


    4 I do not know that I sinned in my days, except in thought.


    5 I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.


    6 But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.


    7 Yet when they wanted to kill him, with tears I begged them not to commit this sin.'
translation:
  language: zh_hans
  text: '《雅各和利亚第六子西布伦的遗训》[a]


    1 以下是西布伦临终前留给众子的言辞抄本。那时是他一生的第一百一十四年，也就是约瑟死后两年。[b]


    2 他对他们说：“西布伦的儿子们，要听我说，留心你们父亲的话。


    3 “我西布伦成了父母的一件美好礼物；因为我出生时，我父亲的财富大大增加，羊群和牛群也增多了；他借着有斑点的枝条取得了自己的产业。


    4 “我不知道自己一生犯过什么罪，除了思想上的罪。


    5 我也不记得自己做过什么不法的事，只有在约瑟的事上因无知而犯的错：我同兄弟们约定，不把所发生的事告诉父亲。


    6 但我因约瑟暗中哭了许多天；我惧怕我的兄弟们，因为他们一致议定，谁泄露秘密，谁就必须被处死。


    7 然而，他们想要杀约瑟的时候，我流着泪恳求他们不要犯这罪。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在标题中的族长姓名上存在差异；但本章正文清楚表明说话者是西布伦。
    reason: textual_variant
  - marker: b
    text: 标题所记的确切年龄在抄传过程中有不同读法；这里依照本译所据的希腊文本译为“一百一十四年”。
    reason: textual_variant
lexical_decisions:
- source_word: Διαθήκη
  choice: 遗训
  rationale: 在族长临终训言这一文学语境中，“遗训”比法律意义较强的“遗嘱”更准确，也保留庄重的遗言体裁色彩。
- source_word: Ἀντίγραφον λόγων
  choice: 言辞抄本
  rationale: 分别保留“抄本、摹本”与“言辞”的具体含义，不将其泛化为“记载”。
- source_word: διέθετο
  choice: 嘱咐
  rationale: 此处指西布伦临终向众子作出郑重训示；“嘱咐”自然且不把动词限定为财产处分。
- source_word: Ἀκούσατέ μου
  choice: 要听我说
  rationale: 保留命令语气，并符合现代汉语父亲向众子训话的自然表达。
- source_word: ἀγαθὸν δόμα
  choice: 一份美好礼物
  rationale: 保留“礼物”的具体比喻及其与西布伦出生的关联，不释义成抽象的“福分”。
- source_word: ἁμαρτία διανοίας
  choice: 思想上的罪
  rationale: 明确保留罪的内在、思想层面，不进一步解释为动机或意图。
- source_word: ἀγνοία
  choice: 因无知而犯的错
  rationale: 表达行为并非明知故犯，同时避免“无意之过”可能带来的完全偶然含义。
theological_decisions:
- issue: 西布伦自称一生无罪与随后承认过错之间的张力
  choice: 保留“我不知道……除了”及“我也不记得……只有”的自述形式
  alternative: 将其弱化为一般性的道德自省，或解释为绝对无罪
  rationale: 文本本身既作高度清白的自我陈述，又承认思想和约瑟事件中的过错；译文不替作者消解这一张力。
- issue: 约瑟事件中过错的性质
  choice: 译为“因无知而犯的错”，并具体说明他承诺隐瞒事实
  alternative: 将其定性为蓄意共谋，或完全免除其责任
  rationale: 这一表述同时保留无知或非故意的限定及隐瞒行为所带来的实际责任，不作教派性道德裁断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。标题保持古代遗训文学的正式感，正文则使用清晰的口语化训诫句式。第3—7节的措辞依照经审校的英文咨询层处理；用户所附希腊文引文实际止于第2节开头，因此这些节的具体希腊词形无法在本次材料内逐项复核。
