  text: VI. Πρῶτος ⌈οὖν⌉¹ ἐγὼ ἐποίησα σκάφος² ἐπιπλέειν³ ἐν τῇ⁴ θαλάσσῃ, ὅτι Κύριος ἔδωκέ μοι ⌈*σύνεσιν καὶ σοφίαν⁵⌉ ἐν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006/001.yaml
  text: First, then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it.
translation:
  language: zh_hans
  text: 所以，我率先造了一条能在海上航行的船，因为主在这事上赐给我理解力和智慧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτος
  choice: 率先
  rationale: 这里是主语阳性单数形式，较自然地表示“我是第一个这样做的人／我率先”，而不只是叙事顺序上的“首先”。
- source_word: σκάφος
  choice: 一条船
  rationale: 指可在海上航行的船只；现代汉语用量词“条”自然简明，不额外限定船型。
- source_word: ἐπιπλέειν
  choice: 让它在海上航行
  rationale: 保留使船漂浮、航行于海上的意思，并与ἐποίησα构成自然的汉语表达。
- source_word: σύνεσιν καὶ σοφίαν
  choice: 悟性和智慧
  rationale: 分别表达理解、领悟的能力与实践性的智慧，保留两个并列概念。
- source_word: ἐν αὐτῷ
  choice: 这方面
  rationale: 中性代词所指可能是造船或航海这件事；译作“这方面”既自然，也不把指向限定得过死。
theological_decisions:
- issue: 造船能力与主所赐恩赋之间的关系
  choice: 因为主赐给我这方面的悟性和智慧
  alternative: 因为主在这事上赐给我聪明和智慧
  rationale: 明确保留原文的因果关系，将人的技术成就归因于主所赐的能力，同时不扩展为特定的恩赐论。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“所以”承接上文的οὖν；“率先”准确体现Πρῶτος对说话者的修饰。
