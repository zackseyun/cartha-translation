  text: 我把一块木头放在其后[a]，并且……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其后”：原文可译作“在他身后”或“在它后面”，本残句不足以确定代词所指。“放”所译的动词基本意为“放下、降下”。
    reason: 保留αὐτοῦ的指代歧义，并说明καθῆκα未被具体化为“固定”等动作。
lexical_decisions:
- source_word: καθῆκα
  choice: 固定
  rationale: 结合木料安置在某物后方的语境，译为“固定”比机械直译为“放下”更自然，也与审校后的英译一致。
- source_word: ξύλον
  choice: 一块木头
  rationale: ξύλον泛指木头或木料；此处不擅自具体化为舵、桨等器具。
- source_word: ὄπισθεν αὐτοῦ
  choice: 在其后
  rationale: ὄπισθεν表示“在……后面”，αὐτοῦ可依先行词理解为“他”或“它”；“其后”保留原文的指代弹性。
theological_decisions:
- issue: αὐτοῦ的指代
  choice: 用“其”保留指代的不确定性
  alternative: 译作“在他身后”或“在它后面”
  rationale: 本节残句本身不足以确定先行词所指，且该处不涉及需要补足的神学判断，因此不应强行消除原文歧义。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。原文以καί结尾，是未完句，因此用“并且……”保留残缺状态；脚注标记已置于相关短语之后。
