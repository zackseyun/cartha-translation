base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/012.yaml
  text: But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.”
translation:
  language: zh_hans
  text: 但我们都站起来对他说：“你若不交出那件长衣，我们就告诉父亲，说在以色列中做出这件恶事的，只有你一人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάντες
  choice: 站起来
  rationale: 保留分词的具体动作及众人起身施压的场景。
- source_word: τὸν χιτῶνα
  choice: 那件长衣
  rationale: χιτών指贴身穿的长衣；结合上下文使用指示词“那件”，既自然又保留特定所指。
- source_word: τὸ πονηρὸν τοῦτο
  choice: 这件恶事
  rationale: 直译其道德评价，不弱化为一般性的“坏事”。
- source_word: ἐν Ἰσραήλ
  choice: 在以色列中
  rationale: 保留以色列作为群体共同体的表达及其可能含有的盟约语感，不擅自改释为地理或家族称谓。
theological_decisions:
- issue: “以色列”所指可能是共同体、家族或具有地理色彩的称呼
  choice: 在以色列中
  alternative: 在以色列家中／在以色列地
  rationale: 原文仅作ἐν Ἰσραήλ，保持其简洁与语义张力，不将所指范围具体化。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“交出”比单纯“给”更符合众人逼迫对方拿出衣服的语境；语序强调“只有你一人”，对应原文σὺ μόνος。
