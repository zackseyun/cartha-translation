  text: And so he gave it to them. And they did as Dan had said.
translation:
  language: zh_hans
  text: 他就这样把他交给了他们。他们照但所说的做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκεν αὐτὸν αὐτοῖς
  choice: 他把他交给了他们
  rationale: αὐτόν是阳性单数，按上下文指人，译作“他”而非“它”；δίδωμι在把人置于他人控制之下的语境中自然译为“交给”。完成时在此表达已经实施的行动，汉语用“了”体现。
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: 照……所说的做了
  rationale: 贴合“按着所说的行”的结构，同时符合现代汉语表达。
- source_word: ὁ Δάν
  choice: 但
  rationale: 采用该族长姓名在中文圣经传统中的通行译名。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原文连续两句的叙事节奏；首句两个“他”虽略有重复，却忠实呈现主语与阳性宾语的区别，并避免擅自补出宾语姓名。
