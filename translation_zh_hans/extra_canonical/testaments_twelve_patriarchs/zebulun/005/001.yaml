base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/001.yaml
  text: And they said to Jacob, “Recognize, then, whether this is your son’s tunic[a].” And they did so.
translation:
  language: zh_hans
  text: 他们对雅各说：“你认一认，这是不是你儿子的长衣[a]？”他们就这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长衣”所译的希腊语χιτών，也可译作“里衣”或“袍子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίγνωθι
  choice: 请认一认
  rationale: 此处是命令式，要求雅各辨认衣物；“认一认”自然地保留了辨认、确认之意。
- source_word: χιτών
  choice: 里衣
  rationale: χιτών通常指贴身穿的长衫或内层衣服；“里衣”比泛称“衣服”更具体，也适合古代服饰语境。
- source_word: ὁ χιτὼν τοῦ υἱοῦ σου ἐστίν
  choice: 这是你儿子的里衣吗
  rationale: 原文形式上可直译为“是你儿子的里衣吗”；汉语以“这是……吗”表达更自然，同时保留疑问。
- source_word: καὶ ἐποίησαν οὕτως
  choice: 他们就这样做了
  rationale: 按原文保留概括性的回指，不擅自补明具体行动。
