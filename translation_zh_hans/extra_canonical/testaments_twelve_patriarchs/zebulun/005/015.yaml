  text: 2. Διὰ γὰρ ταῦτα εὐλόγησέ με ὁ¹¹ Κύριος, *καὶ πάντων¹² τῶν ἀδελφῶν μου ἀσθενούντων ἐγὼ ἄνοσος παρῆλθον¹³. οἶδε¹⁴ γὰρ¹⁵ Κύριος ἑκάστου τὴν προαίρεσιν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/015.yaml
  text: For because of these things the Lord blessed me, and when all my brothers were ill, I passed through unharmed. For the Lord knows each person’s intention.
translation:
  language: zh_hans
  text: 正因这些事，主赐福给我；我所有的兄弟都患病时，我却安然无恙地度过了。因为主知道每个人的意向。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενούντων
  choice: 患病
  rationale: 表示身体软弱或生病；此处与ἄνοσος形成对照，译为“患病”自然明确。
- source_word: ἄνοσος παρῆλθον
  choice: 安然无恙地度过了
  rationale: ἄνοσος直指未染疾病，παρῆλθον可表达经过或度过这一时期；合译既保留语义，也符合现代汉语表达。
- source_word: προαίρεσιν
  choice: 意向
  rationale: 该词可指有意识的选择、倾向或意图；“意向”保留其内在取向与自主选择的含义，不将其窄化为具体计划。
theological_decisions:
- issue: 主的赐福与人的意向之间的关系
  choice: 依原文并列陈述“主赐福”与“主知道每个人的意向”
  alternative: 把末句解释为主因人的善良动机而赐福
  rationale: 原文并未明确说明因果机制；译文保留这一神学张力，不补入奖赏行为动机的解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“正因这些事”承接上文；“我却”凸显众兄弟患病与说话者无病之间的对比。
