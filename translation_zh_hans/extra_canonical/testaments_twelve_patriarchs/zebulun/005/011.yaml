  text: And Simeon took the tunic and did not want to give it up. For he wanted to cut him down with the sword, being angry because he had not killed him.
translation:
  language: zh_hans
  text: 西缅拿了那件长衣，不肯交出来；因为他想用剑把约瑟砍死。他因自己没有杀死约瑟而恼怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: 长衣
  rationale: 指贴身穿着的衣服；在本叙事语境中用“长衣”自然清楚，也与约瑟的衣服相呼应。
- source_word: οὐκ ἤθελε δοῦναι αὐτόν
  choice: 不肯交出来
  rationale: 直译为“不愿把它给出”；“交出来”准确表达拒绝交出手中衣物，而非泛泛地不给。
- source_word: τῇ ῥομφαίᾳ
  choice: 用刀
  rationale: ῥομφαία可指大型刀剑；中文“刀”既符合古代杀戮场景，也避免武器类别过度具体化。
- source_word: κατακόψαι αὐτόν
  choice: 把约瑟砍死
  rationale: κατακόπτω表示砍倒、砍杀；“砍死”保留其暴力强度。代词按上下文明确为约瑟，以免连续代词造成中文歧义。
- source_word: ὀργιζόμενος
  choice: 恼怒
  rationale: 表达持续的愤怒状态，语体庄重自然。
- source_word: ἀνεῖλεν αὐτόν
  choice: 杀死约瑟
  rationale: ἀναιρέω在此为杀死；补明约瑟作为宾语，使现代中文清晰。
theological_decisions:
- issue: 西缅恼怒的原因
  choice: 他因自己没有杀死约瑟而恼怒
  alternative: 他因约瑟没有被杀死而恼怒
  rationale: 希腊语οὐκ ἀνεῖλεν αὐτόν的主语自然承接西缅，意为他本人没有杀死约瑟；保留这一明确的行为归属，不改写为泛指约瑟未死。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。将两个αὐτόν按语境分别落实为“那件长衣”和“约瑟”，避免中文代词指向不明；分号保留后句对前句动机的解释关系。
