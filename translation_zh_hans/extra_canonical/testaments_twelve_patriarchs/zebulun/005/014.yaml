  text: V. Καὶ νῦν¹, τέκνα μου, παραγγέλλω² ὑμῖν *τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου³, καὶ ποιεῖν⁴ ἔλεος ⌜πρὸς⌝⁵ τὸν⁶ πλησίον⁷, καὶ εὐσπλαγχνίαν *ἔχειν πρὸς πάντας⁸ οὐ μόνον *ἐν ἀνθρώποις⁹, ἀλλὰ *καὶ ἐν ἀλόγοις ζώοις¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/014.yaml
  text: And now, my children, I command you to keep the commandments of the Lord, and to show mercy to your neighbor, and to have compassion toward all, not only toward people but also toward unreasoning animals.
translation:
  language: zh_hans
  text: 如今，我的孩子们，我吩咐你们：要遵守主的诫命，向邻舍施怜悯；对一切都要怀有怜悯之心，不只是对人，也包括对没有理性的动物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάσσειν τὰς ἐντολὰς Κυρίου
  choice: 遵守主的诫命
  rationale: φυλάσσειν 在诫命语境中指谨守、遵行；现代汉语以“遵守”表达最自然准确。
- source_word: ποιεῖν ἔλεος πρὸς τὸν πλησίον
  choice: 怜悯邻舍
  rationale: ποιεῖν ἔλεος 表示施行怜悯；πλησίον 是关系意义上的“邻舍”，不局限于住处相邻的人。
- source_word: εὐσπλαγχνίαν ἔχειν πρὸς πάντας
  choice: 以慈悲待一切众生
  rationale: εὐσπλαγχνία 指发自内心的怜悯；下文明确涵盖人和动物，因此用“一切众生”自然承接其范围，但不赋予额外宗教术语含义。
- source_word: ἀλόγοις ζώοις
  choice: 没有理性的动物
  rationale: ἀλόγοις 在此与人相对，指不具人类理性或言说能力；直译为“没有理性的动物”可保留原文分类方式，避免贬义较强的“禽兽”。
theological_decisions:
- issue: 怜悯与慈悲的对象范围
  choice: 将 πάντας 理解为随后由“人”和“动物”共同说明的一切有生命者
  alternative: 将 πάντας 仅译为“所有人”，再把动物视为附加对象
  rationale: οὐ μόνον……ἀλλὰ καί……的结构明确把人和无理性动物并列纳入怜悯范围，译文应保留这一张力和广度。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“如今”承接遗训语境；冒号清楚引出三项嘱咐。避免照搬英语修订记录中误将 τὰς ἐντολὰς Κυρίου 与 πλησίον 混合的句法，按希腊文分别译出“遵守主的诫命”和“怜悯邻舍”。
