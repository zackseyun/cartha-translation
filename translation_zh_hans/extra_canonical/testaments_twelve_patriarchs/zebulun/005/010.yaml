  verdict: revise
  source_fidelity: 原文以“他们”为主语，述及他们卖约瑟时剥去他的χιτών，并给他穿上“奴隶的”衣服。草稿的事件次序和因果关系基本准确，但“奴仆的衣服”弱化了δουλικόν所指的奴隶身份。
  naturalness: 草稿整体通顺；“剥去了他的长衣”比“脱去了他的那件长衣”更明确地表达是他们从约瑟身上剥去衣服，而非约瑟自行脱衣。
  terminology: “长衣”可对应χιτών，且在本段叙事中自然。“奴隶的衣服”应保留δουλικόν的社会身份含义，不宜改弱为“奴仆的衣服”。
  issues:
