  text: For they stripped Joseph of the tunic when they sold him, and clothed him in a servant’s garment.
translation:
  language: zh_hans
  text: 因为他们卖约瑟时，剥去了他的长衣，并给他穿上奴隶的衣服。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: 长衣
  rationale: 指贴身穿的长袍式衣服；结合约瑟叙事，用“长衣”既自然，也能与创世记中约瑟的特殊衣袍形成呼应。
- source_word: πιπράσκειν
  choice: 卖
  rationale: 不定式带定冠词并由ἐν引导，表达卖约瑟之时；译为“卖……的时候”符合现代汉语。
- source_word: ἱμάτιον δουλικόν
  choice: 奴仆的衣服
  rationale: δουλικόν表示属于奴隶或奴仆身份的；“奴仆的衣服”保留身份贬降的含义，且比“仆人的衣服”更贴近原词力度。
