    issue: “奴仆的衣服”未充分表达δουλικόν。
    rationale: δουλικόν是“奴隶的、属于奴隶身份的”；“奴仆”在现代汉语中可泛指仆役，身份强度较弱。译为“奴隶的衣服”更贴合原文，也与英文审校轨迹的“slave’s garment”一致。
