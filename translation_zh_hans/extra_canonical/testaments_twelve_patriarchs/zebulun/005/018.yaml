lexical_decisions:
- source_word: εἰς τὴν παραλίαν
  choice: 到海边
  rationale: εἰς带有趋向意味；译为“到海边”比静态的“在海边”更贴近希腊文，同时符合现代汉语表达。
- source_word: ἐθήρευον θήραν
  choice: 捕捉猎物
  rationale: 原文是同源词结构，直译近似“猎取猎物”。“捕捉猎物”保留其宽泛含义，不因海边语境擅自限定为捕鱼。
- source_word: ἀγχομένων
  choice: 窒息
  rationale: 该词可指被勒住、噎住或窒息；在海中这一语境下，“窒息”保留原文措辞，没有直接改译为“溺水”。
- source_word: ἀβλαβὴς διέμενον
  choice: 一直安然无恙
  rationale: διέμενον表示持续处于某状态；“一直安然无恙”兼顾持续义和ἀβλαβής的“未受伤害”。
