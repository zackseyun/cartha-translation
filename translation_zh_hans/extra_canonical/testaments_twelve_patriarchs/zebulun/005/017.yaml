- from: 因为我兄弟们的儿子患病，甚至因约瑟的事而死，因为他们心里没有怜悯；但我的儿子一直没有患病，正如你们所知道的。
  to: 因为我兄弟们的儿子因约瑟而患病并死亡，因为他们没有从内心施行怜悯；但我的儿子得以保全，没有患病，正如你们所知道的。
  rationale: 修订删去原文未明示的递进“甚至”，以“患病并死亡”对应两个未完成时的并列叙述；以“因约瑟”保持 διά Ἰωσήφ 的简略因果关系，不增补具体机制；以“从内心施行怜悯”兼顾 σπλάγχνα 的内在情感含义和“行怜悯”的动词性；以“得以保全，没有患病”反映被动式，同时不指定隐含的行动者。
