  text: 4. *Καὶ γὰρ²⁵ υἱοὶ²⁶ τῶν ἀδελφῶν μου ἠσθένουν καὶ²⁷ ἀπέθνησκον διὰ Ἰωσήφ²⁸, ⌈ὅτι οὐκ ἐποίησαν ἔλεος *ἐν σπλάγχνοις αὐτῶν²⁹⌉. οἱ δὲ *ἐμοὶ υἱοὶ³⁰ ἄνοσοι διεφυλάχθησαν³¹ καθὼς³² οἴδατε³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/017.yaml
  text: For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their inward parts; but my sons were kept free from sickness, as you know.
translation:
  language: zh_hans
  text: 因为我兄弟们的儿子因约瑟而患病并死亡，因为他们没有从内心施行怜悯；但我的儿子得以保全，没有患病，正如你们所知道的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠσθένουν καὶ ἀπέθνησκον
  choice: 患病，甚至……而死
  rationale: 两个未完成时描写持续或反复发生的患病与死亡；“甚至”自然呈现递进关系，同时不把时态过度具体化。
- source_word: διὰ Ἰωσήφ
  choice: 因约瑟的事
  rationale: διά加宾格表达原因。直译“因为约瑟”在中文中可能误解为约瑟主动致害；加“的事”保留原因关联而不擅自断定具体机制。
- source_word: οὐκ ἐποίησαν ἔλεος
  choice: 没有怜悯
  rationale: 这是闪语色彩浓厚的“行怜悯”表达；现代中文用“没有怜悯”自然清楚，并保留其道德含义。
- source_word: ἐν σπλάγχνοις αὐτῶν
  choice: 心里
  rationale: σπλάγχνα字面指内脏，在此喻指内在情感、慈悲所在；译作“心里”符合现代汉语习惯，又表达怜悯并非出自他们内心。
- source_word: ἄνοσοι διεφυλάχθησαν
  choice: 一直没有患病
  rationale: ἄνοσος意为无病，διαφυλάσσω表示保守、保存；被动形式在此可自然表达为持续蒙保全而未患病。“一直”体现动词所呈现的持续保全。
- source_word: καθὼς οἴδατε
  choice: 正如你们所知道的
  rationale: 保留对听众共同知识的直接诉诸，语体庄重而清楚。
theological_decisions:
- issue: 兄弟们的儿子患病死亡与约瑟事件之间的因果关系
  choice: 译作“因约瑟的事”，保留原文所陈述的因果关联
  alternative: “因为他们对约瑟所做的事”或“因他们亏待约瑟”
  rationale: 上下文可能把疾病死亡视为对不怜悯约瑟的报应，但本句διὰ Ἰωσήφ本身简略。译文不补入“报应”“惩罚”或明确的施害行为，以免消除原文的含混与神学张力。
- issue: 怜悯的内在性
  choice: “心里没有怜悯”
  alternative: “没有从肺腑施怜悯”或“在内脏中没有行怜悯”
  rationale: 原文以σπλάγχνα指内在情感所在。中文“心里”传达同一隐喻功能；不把它扩展为某种特定的人性论或灵魂论。
- issue: 西布伦之子免于疾病的行动主体
  choice: 采用“我的儿子一直没有患病”，不明说是谁保守他们
  alternative: “我的儿子却蒙保守，没有患病”
  rationale: 希腊文使用被动式，可能暗含神为行动者，但未明确说出。中文直接描述结果，可避免擅自补明主体，同时保留与前句的对比。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“患病，甚至……而死”呈现过程和递进；“心里”是σπλάγχνα在情感语境中的自然对等表达。全句保留原文的因果链条，却不额外解释为明确的神罚机制。
