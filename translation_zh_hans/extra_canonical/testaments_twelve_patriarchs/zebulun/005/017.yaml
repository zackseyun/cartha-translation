  naturalness: 原译整体自然庄重。修订后的“得以保全，没有患病”在现代汉语中通顺，并较明确保留被动式所表达的保全结果，而不擅自指明保全者。
  terminology: 将 ἐν σπλάγχνοις αὐτῶν 译为“从内心”是现代汉语中对内在怜悯的自然表达；“施行怜悯”保留 ἐποίησαν ἔλεος 的行动性。保留“因约瑟”，不补充为惩罚或具体事件。
