  text: 3. *Ἔχετε οὖν¹⁷ ἔλεος ἐν¹⁸ σπλάγχνοις ὑμῶν¹⁹, ὅτι *εἴ τι ἂν²⁰ ποιήσῃ²¹ τῷ πλησίον αὐτοῦ, *οὕτω Κύριος²² ποιήσει²³ *μετʼ αὐτοῦ²⁴.
