base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/016.yaml
  text: Have mercy, therefore, in your hearts[b], because whatever anyone does to his neighbor, so the Lord will do to him.
translation:
  language: zh_hans
  text: 所以，你们内心要有怜悯[a]，因为无论一个人怎样对待邻舍，主也必照样对待他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内心”所译的希腊语字面指“内脏”；古人常把内脏看作怜悯等深切情感的所在。
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεος
  choice: 怜悯
  rationale: 直接表达仁慈、同情并施恩的含义，也与本句伦理劝勉的语气相称。
- source_word: ἐν σπλάγχνοις ὑμῶν
  choice: 你们内心
  rationale: σπλάγχνα字面指内脏，在希腊语习用法中指感情与怜悯的深处；译作“内心”自然清楚，并以脚注保留其身体隐喻。
- source_word: τῷ πλησίον αὐτοῦ
  choice: 邻舍
  rationale: “邻舍”保留经文伦理语汇，所指不限于住在附近的人，也可泛指与之相处的人。
- source_word: οὕτω ... μετʼ αὐτοῦ
  choice: 也必照样对待他
  rationale: 保留行为与回应之间“照样”的对应；μετά加属格在此表示与某人交往、处置的关系，汉语以“对待”自然表达。
theological_decisions:
- issue: 人的行为与主的回应之间的对应关系
  choice: 主也必照样对待他
  alternative: 主也会按同样的方式待他
  rationale: 不把句子额外解释为严格报应、审判机制或得救条件，只保留原文直接而郑重的伦理—神学对应。
- issue: εἴ τι ἂν ποιήσῃ的泛指范围
  choice: 无论一个人怎样对待邻舍
  alternative: 一个人若对邻舍做了什么
  rationale: ἂν配合虚拟式表达开放、不限定的情况；“无论……怎样”在现代汉语中较自然，同时不限定行为是善是恶。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“所以”承接上文；“要有怜悯”保留命令语气；“必”体现将来时所带的郑重断言。脚注标记已置于正文相应位置。
