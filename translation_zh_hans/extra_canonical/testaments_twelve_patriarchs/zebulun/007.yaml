    reason: 文化与度量说明
lexical_decisions:
- source_word: ὀθόνη
  choice: 帆
  rationale: 在张挂于直立木柱并用于沿海航行的语境中，指船帆，而非一般布匹。
- source_word: σπλαγχνίζομαι / σπλάγχνα ἐλέους
  choice: 怜悯／怜悯之心
  rationale: 保留本段反复强调的由内心而发、落实于行动的同情与慈悲，同时避免照译古代身体隐喻而显得生硬。
- source_word: μεταδίδωμι
  choice: 分给／把自己的所有分给
  rationale: 该词强调把自己所得的一份分享给别人；依宾语是否明说，在中文中作自然补足。
- source_word: πλησίον
  choice: 邻舍
  rationale: 保留其伦理劝诫色彩，所指是身边需要关怀的人，而不只限于住所相邻者。
- source_word: συναλγέω / συμπάσχω
  choice: 一同忧伤／一同受苦
  rationale: 保留两个相近动词的并列及共同承受他人痛苦的力度，不合并成笼统的“同情”。
- source_word: στάδιον
  choice: 斯塔狄昂
  rationale: 保留古代长度单位，并以脚注提供约值，避免正文出现貌似过度精确的现代换算。
- source_word: ἐστρέφετο ... εἰς συμπάθειαν
  choice: 转为同情
  rationale: 保留“转向、转变”的动态表达，同时用自然中文呈现内心被触动的含义。
theological_decisions:
- issue: 主对分享者的多倍回报
  choice: 直译为“必从主那里得到多倍的回报”
  alternative: 弱化为“会蒙福”或解释为必然的物质财富应许
  rationale: 原文明确表达由主而来的多倍领受，但没有限定回报的形式；译文既保留其神学上的互惠关系，也不擅自规定为物质报偿。
- issue: 怜悯表现为与受苦者共同承担
  choice: 分别保留“一同忧伤、一同受苦、与他一同哭泣”
  alternative: 统称为“帮助”或“同情”
  rationale: 原文不只要求施舍，也强调即使无物可给，仍要进入他人的痛苦；不可将这种伦理张力简化为物质援助。
- issue: 所供希腊文与英文咨询层的范围不一致
  choice: 仅翻译实际提供的希腊文，不以英文咨询层补写希腊文中未见的段落
  alternative: 按英文文本补成二十五节
  rationale: 原文证据优先；英文层可供审校，但不能取代或扩写当前所提供的希腊文见证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。捕鱼、航行和救济贫弱的叙述保持朴实直接；同情与怜悯相关词汇尽量稳定复现。第7节不擅自补出缺失的对象，以脚注保留原文的不完整性。方括号段落在正文中正常排印，并用脚注透明说明其文本状态。
