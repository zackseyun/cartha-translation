review_pass:
  verdict: revise
  source_fidelity: 第1节基本准确，但“怜悯……以慈悲待人”将同一词族拆开而略显重复。第2节“赐到地上”弱化了ἀποστελεῖ（差遣/发出）的动作；“就住在哪里”也没有清楚承载ἐν αὐτῷ“住在他里面”的人格指向。第3节原文以ὅσον…τοσοῦτον表达程度对应，宜明确译出。第5节“存心恶待”偏向实行恶行，原文主要是对弟兄存念、计算恶意。第6节“面容失色”弱于ἀφανίζει所表达的毁损、损害容貌。
  naturalness: 原译整体庄重通顺。修订后以“有怜悯之心的人”“住在那人里面”等表达使指代更清晰；“存恶意”“毁损容貌”在劝诫体中自然且更贴近原文。
  terminology: 保留“主”“上帝”“邻舍”“合一”等通行而庄重的表达。“怜悯”统一对应σπλάγχνα词族；第2节以“怜悯之心”体现其内在慈心的意象，不将其擅自解释为特定人物。
  issues:
  - severity: medium
    issue: 第2节对“差遣”及“住在他里面”的表达不足
    rationale: ἀποστελεῖ意为“差遣/发出”，ἐν αὐτῷ的先行对象是有怜悯的人；原译的地点式“住在哪里”使人格对象不够明确。
  - severity: medium
    issue: 第3节未明确表达程度上的对应
    rationale: ὅσον…τοσοῦτον是“多少……也多少……”的对照，不只是一般的“怎样……照样……”。
  - severity: medium
    issue: 第5节将“存念恶意”偏移为“恶待”的行动
    rationale: μὴ λογίζεσθε κακίαν要求不可向弟兄计算或存留恶意，未必直接指实施恶待。
  - severity: low
    issue: 第6节“面容失色”力度偏弱
    rationale: ἀφανίζει含使毁损、使失去形貌的意思；“毁损容貌”更贴近且不作具体医学化解释。
