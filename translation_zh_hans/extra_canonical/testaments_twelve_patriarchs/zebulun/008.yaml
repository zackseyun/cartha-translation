base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008.yaml
  text: 'And so, my children, have compassion toward every person with mercy, so that the Lord also, having had compassion on you, may show you mercy. For indeed in the last days God will send his compassion upon the earth, and wherever he finds merciful compassion, there he dwells. For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.


    And when we went down into Egypt, Joseph did not hold a grudge against us. Giving heed to him, then, you also, my children, love one another, and let each one not reckon evil against his brother. For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.'
translation:
  language: zh_hans
  text: '8 所以，我的孩子们，你们要以慈悲怜悯每一个人，好让主也怜悯你们，向你们施怜悯。2 因为在末后的日子，上帝必将他的怜悯差遣到地上；无论在哪里发现有怜悯之心的人，他就住在那人里面。3 人怜悯自己的邻舍有多少，主也怜悯他有多少。


    4 我们下到埃及的时候，约瑟并没有对我们怀恨。5 我的孩子们，你们也要留意他，彼此相爱；谁也不要向自己的弟兄存恶意。6 因为这会破坏合一，使一切亲属关系离散，扰乱心灵，也毁损容貌。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνίαν / σπλαγχνισθεὶς / σπλάγχνα / σπλαγχνίζεται
  choice: 怜悯；慈悲怜悯的心
  rationale: 这一词族本指内里的柔情、怜恤。按各处句法分别译作自然的现代汉语，同时在第2节保留“内在怜悯”以及上帝在有此怜悯者那里居住的意象。
- source_word: κατὰ παντὸς ἀνθρώπου
  choice: 每一个人
  rationale: 表达对象范围的普遍性，不限于本族或弟兄。
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν
  choice: 到了末后的日子
  rationale: 保留其末世性时间表达，不进一步界定所指事件。
- source_word: τὸν πλησίον αὐτοῦ
  choice: 邻舍
  rationale: “邻舍”是清楚而庄重的通行宗教用语，也保留关系性的含义。
- source_word: οὐκ ἐμνησικάκησεν ἡμῖν
  choice: 并没有对我们怀恨
  rationale: 准确表达“不记恨、不怀怨”的意义；此处重点是约瑟没有因旧恶而怨恨众兄弟。
- source_word: προσέχοντες ... εἰς ὃν
  choice: 以他为榜样
  rationale: 直译为“留意他/注目于他”；在劝勉语境中是要受众效法约瑟，译文显明语用而未添加新内容。
- source_word: μὴ λογίζεσθε ... κακίαν
  choice: 不要存心恶待
  rationale: λογίζομαι 可指盘算、计较或存念，κακία 指恶意或恶事；译法保留内心筹算恶意并可能付诸行动的含义。
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: 使人的面容失色
  rationale: ἀφανίζω 可指毁坏、损伤或使不显；“面容失色”自然表达恶意对外貌神态造成的败坏，不武断译成身体毁容。
theological_decisions:
- issue: 第2节“上帝把他的怜悯赐到地上”是否指特定弥赛亚人物
  choice: 保留抽象而具人格化色彩的“他的怜悯”
  alternative: 译作“那位彰显他怜悯者”或直接指称弥赛亚
  rationale: 希腊文 τὰ σπλάγχνα αὐτοῦ 字面是“他的怜悯/慈心”，本身没有明确的人物称号；不应替文本消除其可能的象征性或末世性张力。
- issue: 上帝照人怜悯邻舍的程度怜悯人
  choice: 保留“怎样……也照样……”的对应关系
  alternative: 弱化为一般性的“怜悯人的必蒙怜悯”
  rationale: 原文 ὅσον…τοσοῦτον 明示程度上的对应；译文不将其系统化为功德论，也不弱化原有张力。
- issue: “住在哪里”的主体和居住对象
  choice: 译作“他在哪里发现……就住在哪里”
  alternative: 明确译为“住在那个人里面”
  rationale: 前句以地点关系表达，后句 ἐν αὐτῷ 可指“在他里面”或“在那里”；中文保留一定空间与人格指涉的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留章内节号。核心词族以“怜悯/慈悲”贯穿，但避免生硬重复。无脚注，因此正文不设脚注标记。
