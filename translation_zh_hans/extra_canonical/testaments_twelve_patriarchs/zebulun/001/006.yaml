  text: But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.
translation:
  language: zh_hans
  text: 但我因约瑟暗自哭泣了许多天，因为我惧怕我的兄弟们；他们都已约定，谁泄露这个秘密，谁就要被处死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wept in secret
  choice: 暗自哭泣
  rationale: 简洁自然地表达私下哀哭、不让兄弟们知晓的意思。
- source_word: because of Joseph
  choice: 因约瑟
  rationale: 保留原因关系的简洁性，不额外判定是为他的遭遇、失踪还是被认为死亡而哭。
- source_word: disclosed the secret
  choice: 泄露这个秘密
  rationale: “泄露”符合共同隐瞒之事被公开的语境；“这个”指向有关约瑟的既有秘密。
- source_word: should be put to death
  choice: 就要被处死
  rationale: 准确表达约定中的死刑后果，同时保留被动含义，不擅自说明执行者或方式。
theological_decisions:
- issue: 约瑟引发哀哭的具体缘由
  choice: 保留“因约瑟”的概括说法
  alternative: 译作“为约瑟的遭遇”或“以为约瑟死了而哭”
