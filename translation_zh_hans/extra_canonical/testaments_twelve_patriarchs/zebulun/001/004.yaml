  text: I do not know that I sinned in my days, except in thought.
translation:
  language: zh_hans
  text: 我不知道自己一生中犯过什么罪，除了在意念上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文是章首片段，尚未与本节逐节对齐；“在意念上”依据经审核的英文咨询文本译出，仍有待对应希腊文核校。
    reason: 明确标示本节缺少直接对齐的原文证据，避免把咨询层误当作已核实的希腊文本。
lexical_decisions:
- source_word: in thought（所给材料未附本节对应的希腊文）
  choice: 在意念上
  rationale: 保留“思想、心念层面”的含义，同时不擅自补明究竟是犯罪的念头、意图，还是内心已犯的罪。
- source_word: in my days（所给材料未附本节对应的希腊文）
  choice: 一生中
  rationale: 现代汉语中自然地表达“在我度过的日子里”，符合临终回顾一生的语境。
- source_word: I do not know that I sinned（所给材料未附本节对应的希腊文）
  choice: 我不知道自己……犯过什么罪
  rationale: 保留说话者对自身所知的限定，不强化为绝对无罪的断言。
theological_decisions:
- issue: 说话者是否宣称自己完全无罪
  choice: 以“我不知道”保留认知限定
  alternative: “我一生从未犯罪”
  rationale: 后者会把有限的自我认知改写成绝对断言，并削弱“除了在意念上”所形成的张力。
- issue: “在意念上”是否等同于已经实施的行为
  choice: 不补明行为是否付诸实行
  alternative: “除了想过犯罪的事”或“除了心里犯过罪”
  rationale: 两种替代表达分别偏向尚未实行的念头或已经构成的内在罪；现有证据不足以排除其中任何一面。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“犯过什么罪”使句子顺畅；末尾“除了在意念上”刻意保留原句的省略和神学张力。
