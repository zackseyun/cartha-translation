    reason: 明确标示本节缺少直接对齐的原文证据，避免把咨询层误当作已核实的希腊文本。
  revision_rationale: 将“犯过什么罪”改为“曾犯过罪”，消除“罪的类别不明”这一非原文性的歧义；将例外句明确为“只有在意念上犯过”，使其在汉语中有完整而自然的谓语，同时仍不界定“意念上”的具体神学或心理含义。保留原有核校说明脚注。
