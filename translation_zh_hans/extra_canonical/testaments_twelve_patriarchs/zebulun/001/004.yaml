  naturalness: “我不知道自己一生中曾犯过罪，除了在意念上。”在现代标准汉语中自然、庄重。句末保留原文式省略，且“在意念上”可涵盖内心思想层面的犯罪，不擅自具体化为犯罪意图或已构成的内在罪。
  terminology: “罪”对应 sin；“一生中”自然传达 in my days；“在意念上”保留 thought 的概括性。避免“心里犯过罪”或“想过犯罪的事”，以免分别强化为既成内在罪或单纯意图。
