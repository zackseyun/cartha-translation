base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/005.yaml
  text: I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.
translation:
  language: zh_hans
  text: 我不记得自己犯过什么不法之事，只有一件，就是在约瑟的事上无意中犯下的过错：我曾向兄弟们保证，不把所发生的事告诉父亲。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存所提供的希腊文为章首片段，尚未与本节逐句对齐；本节据经审核的英文参照层译出，因此“保证”等措辞仍待对应希腊文校核。
    reason: 公开说明本节缺少可直接核对的逐节原文证据，避免造成已完成希腊文逐词校勘的印象。
lexical_decisions:
- source_word: lawlessness（本节希腊文未对齐）
  choice: 不法之事
  rationale: 保留“违背法则”的含义，又不把它限定为现代法律意义上的犯罪。
- source_word: unwitting wrong（本节希腊文未对齐）
  choice: 无意中犯下的过错
  rationale: 同时表达行为确有不当和并非出于蓄意，避免把责任完全消除。
- source_word: pledge（本节希腊文未对齐）
  choice: 保证
  rationale: 自然表达对兄弟们所作的承诺；现有证据不足以断定这是正式誓言，故不译作“起誓”。
- source_word: what had happened（本节希腊文未对齐）
  choice: 所发生的事
  rationale: 保留原表述的概括性，不擅自补明约瑟被卖或其他具体情节。
theological_decisions:
- issue: 说话者对自身罪责的陈述
  choice: 保留“不记得……只有一件”的自我陈述
  alternative: 译成绝对断言“我从未犯过……”
  rationale: “不记得”比绝对无罪的宣称更审慎，也保留人物自我回顾所带来的张力。
- issue: 无意之过是否仍构成责任
  choice: 译作“无意中犯下的过错”
  alternative: 译作“无心之失”或淡化为“疏忽”
  rationale: 既保留非蓄意性质，也明确承认这仍是过错，不替文本化解道德责任问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“不法之事”“无意中犯下的过错”保留道德分量；句末用冒号清楚交代这项过错的具体内容。
