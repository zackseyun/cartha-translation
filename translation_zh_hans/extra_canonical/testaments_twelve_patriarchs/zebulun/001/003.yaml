base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/003.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.
translation:
  language: zh_hans
  text: 我西布伦，成了给父母的一份美好礼物；因为我出生的时候，我父亲大大富足起来，他的羊群和牛群也同样增多；他借着有斑点的枝条，得到了自己的一份[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有斑点的枝条”和“自己的一份”暗指雅各借着处理过的枝条牧养羊群，并从拉班的牲畜中取得自己那一份的故事（参创世记30:25—43）。
    reason: 说明本句所指的《创世记》叙事背景；“处理过的枝条”不把正文“有斑点”的措辞过度等同于该故事中枝条的具体处理方式。
lexical_decisions:
- source_word: good gift（本节希腊文尚未逐节对齐）
  choice: 一份美好礼物
  rationale: 忠实保留英语审校层中的“good gift”意象，同时使用自然、庄重的现代汉语；不把“礼物”进一步解释为福气或报偿。
- source_word: parents（本节希腊文尚未逐节对齐）
  choice: 父母
  rationale: 保留复数所指，不擅自缩小为父亲或母亲一方。
- source_word: increased very greatly（本节希腊文尚未逐节对齐）
  choice: 产业大大增加
  rationale: 结合下文羊群、牛群的增长，将含义自然表达为家产增多，又避免把增长只限于牲畜。
- source_word: flocks and herds（本节希腊文尚未逐节对齐）
  choice: 羊群和牛群
  rationale: 采用普通读者容易理解、且符合创世记叙事背景的具体表达。
- source_word: speckled rods（本节希腊文尚未逐节对齐）
  choice: 有斑点的枝条
  rationale: 保留与雅各牧养牲畜故事相关的可见物象；“枝条”比现代意义的“杆”更符合树枝语境。
- source_word: his portion（本节希腊文尚未逐节对齐）
  choice: 自己应得的份
  rationale: “份”保留原有分配、所得之意；加“应得的”使汉语关系清楚，但不具体断定其法律或神学性质。
theological_decisions:
- issue: 西布伦的出生与雅各产业增长之间的关系
  choice: 按叙述次序保留两者的关联，不明说西布伦是增长的直接原因
  alternative: 译为“因我的出生使父亲大大富足”
  rationale: 原有表达可同时带有时间关联和因果意味；译文避免把这种张力过度确定为直接因果。
- issue: “美好礼物”的赐予者
  choice: 不补出上帝为明确赐予者
  alternative: “上帝赐给我父母的美好礼物”
  rationale: 英语审校层没有明说赐予者，而所附希腊文又未对齐到本节；因此不加入原文证据未明确支持的神学主语。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。由于所提供的希腊文片段只覆盖题名及本章开头，尚未与1:3逐节对齐，本稿以英语POB审校层所保存的本节内容为依据，并对无法由现有希腊文直接核验的措辞保持克制。
