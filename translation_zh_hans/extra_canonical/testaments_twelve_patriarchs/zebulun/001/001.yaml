translation:
  language: zh_hans
  text: '西布伦遗言 1:1


    这是西布伦临终前嘱咐儿子们的话的抄本。他去世时一百一十四岁；那时约瑟已经去世两年了。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: 言语抄本
  rationale: Ἀντίγραφον 指抄录、誊写而成的文本；“言语抄本”既保留文献标题式表达，也适合现代汉语。
- source_word: διέθετο
  choice: 嘱咐
  rationale: 此处表示西布伦临终向众子作出郑重交代；“嘱咐”自然传达遗训语境，同时不额外引入“立约”或“立遗嘱”等较强解释。
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: 临死前
  rationale: 直译为“在他死以前”；结合遗言体裁译作“临死前”，简洁且准确。
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: 当时他一百一十四岁
  rationale: 希腊文按第一百、第四和第十年组合表达其一生的第一百一十四年；现代汉语用年龄表达更自然。
- source_word: μετὰ οὖν δύο ἔτη τοῦ θανάτου Ἰωσήφ
  choice: 约瑟去世已有两年
  rationale: 准确表达约瑟死后两年的时间关系，并避免生硬的逐词翻译。
theological_decisions:
- issue: διέθετο 是否译为“立约”或“作遗嘱”
  choice: 嘱咐
  alternative: 立遗嘱／立约
  rationale: 该动词与本书“遗言”体裁有关，但本句直接宾语结构侧重他向儿子们所作的郑重交代。“嘱咐”保留语义空间，不把法律性或盟约性含义强加给文本。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。标题“西布伦遗言”据希腊文卷首题名补出，用于辨识作品；正文保持文献序言的简洁语气。未采纳修订记录中改为“但”的内容，因为所提供希腊文明确为 Ζαβουλών（西布伦），年龄也明确指向一百一十四岁。
