base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010.yaml
  text: 'And you will return to your land, and you will see him in Jerusalem because of his holy name; and healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deceit will be trampled down. And he will turn all the nations to zeal for him, and you will see God in the form of a man, whom the Lord will choose—Jerusalem is his name.


    9. And again, by the craftiness of your deeds you will provoke him to anger, and you will be cast away from him until the time of completion.


    10. And now, my children, do not be grieved because I am dying, nor fall down in sorrow because I am coming to my end. For I will rise again in your midst, as a ruler in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, all who keep the law of the Lord. But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations. But as for me, I now hasten to my rest, as also my fathers did. But you, fear the Lord all the days of your life with all your strength.


    And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.'
translation:
  language: zh_hans
  text: '你们必归回自己的土地，并且因他的圣名，在耶路撒冷看见他；医治和怜悯必在他的翅膀之下。他必亲自救赎世人，使他们脱离彼列的一切掳掠；一切迷惑人的灵都必被践踏。他也必使万国转而为他发热心；你们将看见上帝以人的形态显现，就是主所拣选的那一位——耶路撒冷是他的名。[a]


    9 你们又会因自己行为中的诡诈惹他发怒，并被他弃绝，直到终结之时。


    10 我的孩子们，现在不要因我要死去而忧伤，也不要因我将走到生命的尽头而悲伤倒下。2 因为我必再次起来，站在你们中间，在义人的子孙中作领袖；我也必在自己支派的人中欢喜，就是那些遵守主律法的人。3 至于不敬虔的人，主必使永火临到他们，并将他们毁灭，直到世世代代。4 如今我要赶快到我安息之处去，正如我的祖先一样。5 你们却要一生一世尽心尽力敬畏主。


    6 他说完这些话，就睡了。他的儿子们把他放进木棺。7 后来，他们把他运上去，葬在希伯仑，与他的祖先葬在一起。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “就是主所拣选的那一位——耶路撒冷是他的名”原文句法异常，指代也不明确；也可能有其他断句或译法。
    reason: 如实标示传本文本和句法上的真实困难，避免读者误以为此处只有一种确定解释。
lexical_decisions:
- source_word: Βελίαρ
  choice: 彼列
  rationale: 保留专名形式，符合犹太次经语境；上下文将其呈现为奴役人的邪恶权势，不擅自解释为“魔鬼”或“撒但”
- source_word: πνεῦμα πλάνης
  choice: 迷惑人的灵
  rationale: πλάνη兼有迷误、欺骗之意；译法保持“灵”的实体性表达，也自然传达其使人偏离的作用
- source_word: ἐν σχήματι ἀνθρώπου
  choice: 以人的形态显现
  rationale: σχῆμα指外在形态或样式；避免直接改写为后期教义术语，同时保留文本强烈的神显张力
- source_word: πανουργίᾳ
  choice: 诡诈
  rationale: 表达狡猾、奸诈的负面伦理含义，与“行为”搭配自然
- source_word: συμπέσητε
  choice: 悲痛倒下
  rationale: 保留动词“倒下”的具体意象，并依据语境点明悲痛，避免仅抽象译作“绝望”
- source_word: ἡγούμενος
  choice: 领袖
  rationale: 可指带领者或统治者；“领袖”较中性，既保留领导身份，也不强化为特定政治王权
- source_word: πῦρ αἰώνιον
  choice: 永火
  rationale: 简洁对应原文“永恒的火”，保留审判意象而不扩展其性质
- source_word: ἀνάπαυσιν
  choice: 安息之处
  rationale: 此处是死亡委婉语；保留“安息”意象，并以“之处”配合εἰς的方向性
- source_word: ἐκοιμήθη
  choice: 安然长眠了
  rationale: 保留“睡去”作为死亡委婉语；“安然”也呼应异文中的“美好的睡眠”，但不将异文另立为正文
theological_decisions:
- issue: “看见上帝以人的形态”与“主所拣选者”的关系
  choice: 保留“上帝以人的形态显现，就是主所拣选的那一位”这一紧张表达
  alternative: 解释为“看见主所拣选、代表上帝的人”或明确译成某种道成肉身公式
  rationale: 希腊文语法和传本表述本身突兀，既有神以人形显现，也有主拣选对象的措辞；不以特定教义体系消解张力
- issue: “耶路撒冷是他的名”的指代和句法
  choice: 正文直译，并附注说明文本困难
  alternative: 改为“主将为他选择耶路撒冷作为名号”或“耶路撒冷将以他的名命名”
  rationale: 现存希腊文次序和句法不稳定，直接定解会掩盖真实歧义
- issue: “我必再次起来”的含义
  choice: 保留第一人称复起语言
  alternative: 解释为仅在后代记忆中重现，或明确表述为末日身体复活
  rationale: ἀναστήσομαι可表达复起或复活；上下文有终末色彩，但未详述机制，不宜替文本作教义界定
- issue: 对不敬虔者的永火与毁灭
  choice: 译作“永火临到他们，并将他们毁灭，直到世世代代”
  alternative: 将“毁灭”解释为永恒有意识受刑，或解释为彻底消灭
  rationale: 原文并置永火、毁灭和世代延续语，不应由译文裁定相关末世论争议
- issue: 括号内较长扩展段的处理
  choice: 纳入正文
  alternative: 删除为次级增补
  rationale: 用户提供的审定英文层将这些bdg-text扩展收入正文；译文保留其内容，同时以脚注提示最困难的句读，而不擅自重构版本
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。正文按本章节号分段；不为开头承接前章的材料补造节号。神名按项目常用现代形式译为“上帝”“主”。保留“翅膀”“被践踏”“长眠”等原文意象，同时避免生硬逐词对应。
