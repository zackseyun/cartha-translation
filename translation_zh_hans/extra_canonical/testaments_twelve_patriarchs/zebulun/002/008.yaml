review_pass:
  verdict: revise
  source_fidelity: 首句和禁止流无辜之血的意思基本准确。但“看在……骨肉亲情上”把σπλάγχνα（深切怜悯、慈心）改写为共同血缘关系，并把原文以“雅各的慈心”为宾语的命令转成“看在……上”的凭借语，解释性过强。末句所给希腊文本在“καὶ πεσὼν εἰς ὑμᾶς”处有明显句法/传本困难；英语审校轨迹只译出清楚的“我没有得罪你们”。
  naturalness: 原译整体庄重通顺。“可怜我吧”可用，但“怜悯我吧”与后文的祈求及宗教文学语体更一致。“不要向我下手，流无辜之血”既自然，也较完整保留原文的手与流血意象。
  terminology: 将σπλάγχνα译为“慈心”保留其怜悯、恻隐的情感核心，不将其特化为“骨肉亲情”。“无辜之血”是自然且贴近原文的固定表达。
  issues:
  - severity: medium
    issue: “骨肉亲情”过度解释σπλάγχνα。
    rationale: σπλάγχνα在此指雅各的深切怜悯/慈心；虽然雅各是共同父亲，但该词本身并不指血缘或亲属关系。
  - severity: low
    issue: “不要下手害我”弱化了“手”和“流无辜之血”的并列意象。
    rationale: 补出“我”在语境中可接受，但改为“不要向我下手，流无辜之血”更贴近原文结构。
  - severity: medium
    issue: 末句后的希腊语附加语存在传本或句法困难。
    rationale: 所给文本的καὶ πεσὼν εἰς ὑμᾶς（直译约为“并且跌入/落到你们之中”）不能与前句顺畅构成句法。正文依英语审校轨迹译出无争议部分，并以脚注保留该问题。
  revised_text: “我的弟兄们，怜悯我吧！也请顾念我们父亲雅各的慈心。不要向我下手，流无辜之血，因为我没有得罪你们〔1〕。”
  revised_footnotes:
  - marker: '1'
    text: 所给希腊文本在“我没有得罪你们”之后还带有“καὶ πεσὼν εἰς ὑμᾶς”（字面约为“并且跌入/落到你们之中”）的读法；该附加语在现有句法中难以解释。正文依清楚的主句翻译，未据此作推测性扩充。
    reason: 保留源文末尾的传本/句法歧义，避免将不确定读法擅自解释为具体事件。
  revision_rationale: 修订将第二个请求恢复为对“我们父亲雅各的慈心”的顾念，避免“骨肉亲情”造成的语义转移；同时恢复“手”与“无辜之血”的意象。由于源文末尾附加语不稳定且英语审校轨迹未纳入，使用锚定脚注说明，而不以臆测改变正文含义。
