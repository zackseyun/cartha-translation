base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/008.yaml
  text: “Have mercy on me, my brothers; have compassion, by the compassion of Jacob our father. Do not bring your hands upon me to shed innocent blood, for I have not sinned against you.”
translation:
  language: zh_hans
  text: “我的弟兄们，怜悯我吧！看在我们父亲雅各的怜悯之情上，也怜悯我吧！不要向我下手，流无辜之血，因为我并没有得罪你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεήσατέ με
  choice: 可怜我吧
  rationale: 保留祈求怜悯的直接语气，并采用现代汉语中自然而庄重的表达。
- source_word: οἰκτειρήσατε
  choice: 怜悯我吧
  rationale: 译出第二个怜悯类命令词，与前句形成恳求式复沓。原文未明说宾语，汉语补出“我”以使句意自然。
- source_word: σπλάγχνα Ἰακὼβ τοῦ πατρὸς ἡμῶν
  choice: 看在我们父亲雅各的骨肉亲情上
  rationale: σπλάγχνα字面指内脏，转喻深切怜爱；在此又与共同父亲雅各相连。“骨肉亲情”兼顾亲族关系与发自肺腑的恻隐之情，避免生硬直译。
- source_word: Μὴ ἐπαγάγετε τὰς χεῖρας ὑμῶν
  choice: 不要下手害我
  rationale: 希腊语为“不要把你们的手加上”，语境指施加暴力；“下手害我”是自然汉语，并保留对兄弟行凶的含义。
- source_word: ἐκχέαι αἷμα ἀθῷον
  choice: 流无辜人的血
  rationale: 保留“流无辜之血”的圣经式意象，同时用“无辜人的血”明确自然汉语关系。
- source_word: οὐχ ἥμαρτον … εἰς ὑμᾶς
  choice: 我并没有得罪你们
  rationale: ἁμαρτάνω εἰς某人表示对某人犯罪或得罪某人；此处采用通顺而不弱化道德含义的译法。
theological_decisions:
- issue: σπλάγχνα的情感与亲族双重意涵
  choice: 译作“骨肉亲情”
  alternative: “我们父亲雅各的慈爱”或“凭我们父亲雅各的怜悯”
  rationale: “骨肉亲情”既关联雅各作为共同父亲，也传达σπλάγχνα所表达的深切恻隐；不把该短语解释成特定神学概念。
- issue: αἷμα ἀθῷον所指对象
  choice: 译作“无辜人的血”
  alternative: “我的无辜之血”
  rationale: 原文仅说“无辜的血”，未明说“我的”；正文保留这一形式上的开放性，虽由上下文显然指说话者。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语体。用两个“吧”表现连续恳求；“看在……上”自然承接共同父亲雅各所唤起的亲情；避免把σπλάγχνα机械译为“内脏”或过度抽象化。
