review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了恳求、援引雅各，以及不可杀害无辜者的内容。但“骨肉亲情”将σπλάγχνα具体化为共同血缘关系，且弱化了该词所指雅各的深切怜悯／慈心；宜改为明确的“怜悯之情”或“慈心”。“不要下手害我，流无辜人的血”虽合语境，但改为“不要向我下手，流无辜之血”可更清楚保留原文“手”与不定式“流血”的结构。
  naturalness: 原文汉语庄重流畅，连续的祈求语气自然。修订后保留现代汉语的自然性，同时避免“骨肉亲情”所带来的额外解释。
  terminology: “雅各”“怜悯”“无辜之血”“得罪你们”均适切。“怜悯之情”比“骨肉亲情”更贴近σπλάγχνα在此作为深切怜悯／慈心的用法，也不把它定性为单纯亲族伦理。
  issues:
  - severity: medium
    issue: “骨肉亲情”对σπλάγχνα的解释过强。
    rationale: σπλάγχνα本义为内在器官，惯用转义为深切怜悯、慈心。它虽与“我们父亲雅各”相连，却不等同于“骨肉亲情”；后者额外强调说话者与听者之间的血缘纽带，未能直接表达雅各的怜悯。
  - severity: low
    issue: “下手害我，流无辜人的血”的句法联系可更贴近原文。
    rationale: 原文是禁止“把手加在……身上”，其目的／结果为“流无辜之血”。“不要向我下手，流无辜之血”保留暴力行为及“无辜之血”的圣经式表达，同时不需将“无辜”明确限定为“人的”。
  revised_text: “我的弟兄们，怜悯我吧！看在我们父亲雅各的怜悯之情上，也怜悯我吧！不要向我下手，流无辜之血，因为我并没有得罪你们。”
  revised_footnotes: []
  revision_rationale: 将“骨肉亲情”改为“雅各的怜悯之情”，以反映σπλάγχνα的核心情感义，并以“看在……上”自然表达该短语在呼吁中的依据性作用。微调后半句，以较紧密对应“手”与“流无辜之血”的原文意象和句法关系；其余内容维持原译的意义与庄重语体。
