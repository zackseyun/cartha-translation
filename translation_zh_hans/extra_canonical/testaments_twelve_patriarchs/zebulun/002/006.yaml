  text: 7. *Πλὴν ὅτε⁴⁶ ἐβούλοντο ἀνελεῖν αὐτόν⁴⁷, *ἐγὼ μετὰ δακρύων προσεκάλουν αὐτοὺς⁴⁸ μὴ ποιῆσαι τὴν ἁμαρτίαν⁴⁹ ταύτην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/006.yaml
  text: Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin.
translation:
  language: zh_hans
  text: 然而，他们想要杀他的时候，我流着泪恳求他们不要犯下这罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πλὴν
  choice: 然而
  rationale: 在此表达转折，承接上下文，同时突出西布伦与众兄弟意图之间的对照。
- source_word: ἀνελεῖν
  choice: 杀
  rationale: 该不定式在此语境中明确指夺去约瑟的性命；“杀”自然、准确。
- source_word: μετὰ δακρύων
  choice: 流着泪
  rationale: 比直译“带着眼泪”更符合现代汉语，又保留其恳求时悲痛流泪的情态。
- source_word: προσεκάλουν
  choice: 恳求
  rationale: 结合否定命令的补语，此处表示带着迫切情感劝求对方停止行动；“恳求”贴合语境。
- source_word: μὴ ποιῆσαι τὴν ἁμαρτίαν ταύτην
  choice: 不要犯下这罪
  rationale: 汉语通常说“犯罪”或“犯下这罪”；该译法保留指示语“这”和行为的严重性。
theological_decisions:
- issue: 将谋杀称为“这罪”
  choice: 保留“这罪”
  alternative: 译作“这种罪恶”或具体化为“杀人的罪”
  rationale: 原文仅以指示短语指称该罪，没有进一步解释；保留简洁措辞，避免添加原文未明说的神学或伦理阐释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。语序依照汉语习惯调整，但完整保留转折、谋杀意图、含泪恳求及对该行为的罪性判断。
