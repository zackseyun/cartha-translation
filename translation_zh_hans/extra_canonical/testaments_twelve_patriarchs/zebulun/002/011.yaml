base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/011.yaml
  text: And I wept together with Joseph, and my heart thundered, and the joints of my body trembled, and I had no strength.
translation:
  language: zh_hans
  text: 我与约瑟一同哭泣；我的心怦怦作响，全身的关节都在颤抖，我无法站立。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔκλαιον δὲ σὺν τῷ Ἰωσήφ
  choice: 我与约瑟一同哭泣
  rationale: 保留未完成时所呈现的持续动作，并自然表达 σύν 所指的一同哭泣。
- source_word: ἐβόμβει ἡ καρδία μου
  choice: 我的心怦怦作响
  rationale: ἐβόμβει 表示轰鸣、嗡响；用于心时，译为“怦怦作响”既保留强烈的听觉意象，也符合现代汉语表达。
- source_word: οἱ ἁρμοὶ τοῦ σώματός μου
  choice: 全身的关节
  rationale: 直译为“我身体的关节”；“全身的关节”在中文中更自然，且不扩展原意。
- source_word: ἔτρεμον
  choice: 都在颤抖
  rationale: 体现未完成时的持续颤抖，并以“都”照应复数主语“关节”。
- source_word: οὐκ ἠδυνάμην στῆναι
  choice: 我无法站立
  rationale: 按字面表达“不能站住/站立”，不采纳英语咨询层较宽泛的“没有力气”，从而保留动作的具体性。
