  text: 3. Ἐγὼ¹⁶ Ζαβουλὼν δόσις ἀγαθὴ¹⁷ γέγονα¹⁸ τοῖς γονεῦσί μου· ἐν γὰρ τῷ τεχθῆναι¹⁹ με, ηὐξήνθη²⁰ ὁ πατήρ μου²¹ σφόδρα καὶ τὰ πρόβατα²² καὶ τὰ βουκόλια, ὅτε²³ *ἐν ταῖς ποικίλαις ῥάβδοις²⁴ εἶχον²⁵ τὸν κλῆρον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/002.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased greatly, and so did the sheep and the cattle, when he had his portion among the variegated rods.
translation:
  language: zh_hans
  text: 我西布伦成了父母的美好恩赐；因为我出生时，我父亲大为兴旺，羊群和牛群也都增多了；那时他在斑驳的枝条中有自己的一份额。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόσις ἀγαθή
  choice: 一份美好恩赐
  rationale: δόσις指所赐之物或礼物；译作“恩赐”自然而庄重，并保留“美好”的修饰。
- source_word: ηὐξήνθη
  choice: 大大增多
  rationale: 保留“增长、增多”的基本义，不笼统改译为“兴旺”；结合后文牲畜，表达其产业增加。
- source_word: τὰ πρόβατα καὶ τὰ βουκόλια
  choice: 羊群和牛群
  rationale: 两个中性复数在语境中指成群的羊与牛，以“羊群和牛群”符合现代汉语。
- source_word: τὸν κλῆρον
  choice: 自己的份
  rationale: κλῆρος可指抽签所得的份、分配所得；此处译作“自己的份”，避免过度限定为土地或产业。
- source_word: ἐν ταῖς ποικίλαις ῥάβδοις
  choice: 在斑驳的枝条中
  rationale: 按字面保留介词结构及ποικίλαις“斑驳、多色”和ῥάβδοις“枝条/杖”的意象，也维持原句关系上的含混。
theological_decisions:
- issue: 西布伦出生与雅各产业增加之间的因果或时间关系
  choice: 译作“因为我出生时”
  alternative: “我出生以后”或“由于我的出生”
  rationale: 原文ἐν γὰρ τῷ τεχθῆναί με明确给出时间框架，γάρ承接解释，但不宜把出生本身强化为直接致富的原因。
- issue: “斑驳的枝条”与“得份”的确切关系
  choice: 直译为“那时他在斑驳的枝条中得了自己的份”
  alternative: 解释为“他借着斑驳的枝条得了自己的份”
  rationale: ἐν的工具、处境或关联含义并不完全确定；保留较形式对应的表达，避免把创世记传统中的因果机制直接写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体；保留原文重复的“增多”，以呈现父亲与牲畜之间的并列关系。无脚注。
