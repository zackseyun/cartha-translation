base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/009.yaml
  text: But even if I have sinned, discipline me with discipline, my brothers; but do not raise your hand in the murder of your brother, for the sake of Jacob your father.”
translation:
  language: zh_hans
  text: “即使我犯了罪，弟兄们，尽管管教我吧；但看在你们父亲雅各的分上，不要动手杀害你们的弟兄。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παιδείᾳ παιδεύσατέ με
  choice: 也该管教我
  rationale: 原文以同源名词和动词加强语气，直译成“以管教管教我”不合现代汉语习惯；“管教我”自然地保留纠正、惩戒和教导的语义。
- source_word: τὴν χεῖρα ὑμῶν μὴ ἐνέγκατε
  choice: 不要动手
  rationale: 这是现代汉语表达施行暴力的自然说法，保留了原文“手”的意象，又避免生硬的“不要举起你们的手”。
- source_word: ἐν φόνῳ ἀδελφοῦ ὑμῶν
  choice: 杀害你们的弟兄
  rationale: φόνος在此指致死性的杀害；与“动手”连用，清楚传达不可参与杀弟兄之事。
- source_word: διὰ Ἰακὼβ τὸν πατέρα ὑμῶν
  choice: 看在你们父亲雅各的分上
  rationale: διὰ加宾格在此表达缘故或顾念；该译法符合自然汉语，也保留因父亲雅各而克制的含义。
theological_decisions:
- issue: 说话者是否承认自己确实犯罪
  choice: 即使我犯了罪
  alternative: 虽然我犯了罪
  rationale: εἰ δὲ καί保留条件与让步色彩，并不明确断定罪行已经成立，因此采用“即使”，不将其改成明确认罪。
- issue: 管教与杀害之间的对比
  choice: 可以管教，但不可杀害
  alternative: 完全不得处罚
  rationale: 原文明示允许παιδεία意义上的纠正或惩戒，却禁止以暴力杀害弟兄；译文保留这一伦理张力，不把二者混同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对白。“我的弟兄们”保留直接呼语；句序稍作汉语化，将“看在你们父亲雅各的分上”前置于禁令，使逻辑关系清楚。末尾引号依所给段落为引语收束。
