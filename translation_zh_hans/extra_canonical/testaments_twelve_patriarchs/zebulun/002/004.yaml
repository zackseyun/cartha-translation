base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/004.yaml
  text: I do not remember that I committed lawlessness, except for the ignorance that I committed concerning Joseph, in that I assured my brothers not to tell my father what had happened.
translation:
  language: zh_hans
  text: 我不记得自己犯过什么不法的事，除了在约瑟的事上因无知所犯的那件事以外；我曾与兄弟们约定，不把所发生的事告诉父亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομίαν
  choice: 不法的事
  rationale: 保留“违背律法、越轨”的含义，同时采用现代汉语中自然且庄重的表达。
- source_word: τὴν ἄγνοιαν ἣν ἐποίησα
  choice: 因无知而犯的那一件
  rationale: ἄγνοια 可指无知、蒙昧或不明事理；与 ἐποίησα 搭配时，汉语不宜直译为“做了无知”，故译作“因无知而犯”，既保留行为责任，也避免将其明确解释为无意之罪。
- source_word: ἐπὶ τοῦ Ἰωσήφ
  choice: 在约瑟的事上
  rationale: 自然呈现该介词结构所表示的关联范围，不额外判定具体行为性质。
- source_word: ἐβεβαίωσα
  choice: 保证
  rationale: 该词含确认、使确定、郑重保证之意；此处译为“保证”符合与兄弟们共同守口的语境。
- source_word: τὸ γενόμενον
  choice: 所发生的事
  rationale: 按中性分词结构直译其概括性，不补入出售约瑟等上下文细节。
theological_decisions:
- issue: 说话者是否宣称自己完全无罪
  choice: 保留“我不记得……只有……”的记忆性、自我陈述语气
  alternative: 译成“我从未犯过……除了一件”
  rationale: οὐ μνήσκομαι 是“不记得”，并非绝对断言“从未”；如此可保留文本在自我评价与客观无罪之间的张力。
- issue: ἄγνοια 是否应明确译作“无意之罪”
  choice: 译为“因无知而犯”
  alternative: 译为“无意犯下的罪”或“过失”
  rationale: 原词强调无知或不明事理，但未必排除责任；不将其神学化为特定类别的“无意之罪”。
- issue: 保证的对象与内容
  choice: “向兄弟们保证，不把……告诉父亲”
  alternative: “使兄弟们保证不告诉父亲”
  rationale: 希腊语 τοῖς ἀδελφοῖς μου 与不定式的关系略显压缩；依现有文本和语境，采用说话者向兄弟们作出保证的理解，同时不扩写为起誓或强迫。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“不法的事”保留法律与道德越轨色彩；冒号清楚呈现后半句对前述唯一例外的说明。
