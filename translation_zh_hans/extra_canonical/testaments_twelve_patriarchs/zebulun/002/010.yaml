  text: And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.
translation:
  language: zh_hans
  text: 他悲痛地说这些话时，我受不了他的哀号，便哭了起来；我的肝倾泻而出，我里面一切脏腑的精力都衰弱了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γὀδυρόμενος˥
  choice: 悲痛地
  rationale: 分词表示说话时哀恸、悲伤的状态；译作状语符合现代汉语表达。
- source_word: οἰμωγῶν
  choice: 哀号
  rationale: 保留该词所指带哭喊声的强烈悲恸，而不弱化为普通的“哭泣”。
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: 我的肝仿佛倾泻而出
  rationale: 基本保留古代以肝脏表达强烈内在情感的身体意象；加入“仿佛”使汉语读者明确其比喻性质，避免误读为实际器官破裂。
- source_word: πᾶσα ἡ ὑπόστασις τῶν σπλάγχνων μου
  choice: 五脏六腑也都
  rationale: σπλάγχνα指内脏并可承载内在情感意涵；“五脏六腑”是自然且有尊严的现代汉语对应。ὑπόστασις在此指内脏的整体实质，结合πᾶσα以“都”体现整体性。
- source_word: ἐχαυνοῦτο
  choice: 瘫软了
  rationale: 表达松弛、失去力量或衰弱之意，并与身体内部因悲痛而崩解的意象相配。
