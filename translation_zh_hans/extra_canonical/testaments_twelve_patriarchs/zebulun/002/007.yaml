  text: II. Ἦλθον¹ γὰρ ὁ² Συμεὼν Γκαὶ ὁ Δὰν˥ καὶ ὁ² Γὰδ ἐπὶ τὸν Ἰωσὴφ τοῦ ἀνελεῖν αὐτόν, καὶ ἔλεγεν αὐτοῖς μετὰ δακρύων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/007.yaml
  text: For Simeon and Dan and Gad came against Joseph to kill him, and he spoke to them with tears.
translation:
  language: zh_hans
  text: 因为西缅、但和迦得前来对付约瑟，要杀死他；他[a]便含泪对他们说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词为单数，但没有明说主语；这里的“他”最自然地指约瑟。
    reason: 保留并说明原文在主语指称上的形式性含混。
lexical_decisions:
- source_word: ἐπὶ τὸν Ἰωσήφ
  choice: 前来对付约瑟
  rationale: ἐπί加宾格在此表达敌对行动；“对付”自然传达针对约瑟而来的敌意，又不超出原文。
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: 要杀死他
  rationale: 不定式结构表示目的；ἀναιρέω在此意为杀死。
- source_word: μετὰ δακρύων
  choice: 含泪
  rationale: 自然、简洁地表达“带着眼泪／流着泪”的情态。
- source_word: ἔλεγεν
  choice: 对他们说
  rationale: 该未完成过去时描写当时的言说；汉语语境中“说”比机械呈现持续体更自然。
theological_decisions:
- issue: ἔλεγεν的隐含主语
  choice: 正文保留代词“他”，脚注说明其最自然的指向
  alternative: 直接译作“约瑟便含泪对他们说”
  rationale: 希腊文动词为第三人称单数，但没有明说主语；最自然的理解是约瑟。保留代词可避免把解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“含泪”避免生硬直译“带着眼泪”；分号清楚呈现行动者由众兄弟转到单数人物的变化。
