  text: But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be killed.
translation:
  language: zh_hans
  text: 但我因约瑟的缘故，暗中哭了许多天。我惧怕我的兄弟们，因为他们已经一致约定：谁泄露这个秘密，谁就要被杀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν κρυφῇ
  choice: 暗中
  rationale: 自然准确地表达隐秘、不让人知晓地哭泣。
- source_word: διὰ τὸν Ἰωσήφ
  choice: 因约瑟的缘故
  rationale: 保留介词短语对哭泣缘由的概括，未擅自具体化为对约瑟遭遇的哀伤。
- source_word: συνέθεντο πάντες
  choice: 已经一致约定
  rationale: 表达众兄弟共同达成约定；“一致”体现 πάντες 所强调的全体参与。
- source_word: ἐξείπῃ τὸ μυστήριον
  choice: 泄露这个秘密
  rationale: “泄露秘密”符合现代汉语习惯，也准确传达将隐情说出的含义。
- source_word: ἀναιρεθῆναι
  choice: 被杀
  rationale: 直接保留被动式及杀死之意，不弱化为较委婉的“被处死”。
