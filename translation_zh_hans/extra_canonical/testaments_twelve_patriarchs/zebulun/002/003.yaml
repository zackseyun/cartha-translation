  text: And I did not know that I had sinned in my days, except in intention.
translation:
  language: zh_hans
  text: 我不知道自己一生中曾犯过罪，除了在意念上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除了在意念上”也可理解为“除了一项出于某种意图的过失”。希腊文短语简略，且其文本形式有校勘上的不确定性。
    reason: παρεκτὸς ἐννοίας的语义和句法关系未完全确定；脚注保留“意念上的罪”以外的可能理解，并提示文本校勘问题。
lexical_decisions:
- source_word: Οὐκ ἔγνων
  choice: 并不知道
  rationale: 保留不定过去时在回顾叙事中的过去含义；汉语由“一生中”和“犯过”自然体现时态，无须生硬标出过去完成。
- source_word: ἐν ταῖς ἡμέραις μου
  choice: 我一生中
  rationale: 字面为“在我的日子里”，此处自然指说话者一生所经历的日子，译为“我一生中”简洁庄重。
- source_word: ἥμαρτον
  choice: 自己犯过罪
  rationale: ἁμαρτάνω在此取宗教伦理意义“犯罪”；“犯过”配合回顾语境。
- source_word: παρεκτὸς ἐννοίας
  choice: 除了在意念上
  rationale: παρεκτός表示“除……以外”；ἐννοία可指意念、心思或意图。译作“在意念上”保留其范围，不将其收窄为蓄意或恶念。
theological_decisions:
- issue: 说话者是否宣称除思想层面外从未犯罪
  choice: 按表层句法译为“除了在意念上，并不知道自己犯过罪”
  alternative: “除了一次出于某种意图的行为外，我不知道自己犯过罪”
  rationale: 希腊语παρεκτὸς ἐννοίας简略且文本有校勘标记；通常可理解为犯罪仅发生在意念层面。正文保留这一神学张力，不补入“行为上从未”等解释。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“我一生中”避免照搬“在我的日子里”；“意念”保持经伦理语境所需的凝练感。正文脚注标记与脚注一致。
