    issue: “而是守在坑旁”
    rationale: δέ主要是连接并列的相关行动，并不必然表示“没有吃饭”与“守在坑旁”之间的排他替代；“守在坑旁”也比προσέχων τῷ λάκκῳ（留意、看顾那坑）更具体地增添了位置与看守含义。
  - severity: low
    issue: “突然冲过去”
    rationale: 可表达突发行动，但ἀποπηδήσαντες的核心意象是跃起、猛然扑动；改为“猛然扑上去”较贴切，同时仍保留未然的担忧。
