base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/002.yaml
  text: But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Dan and Gad might leap up and kill him.
translation:
  language: zh_hans
  text: 但我怜悯约瑟，没有吃饭；我一直留意着那坑，因为犹大害怕西缅、但和迦得会猛然扑上去杀死他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνιζόμενος
  choice: 怜悯
  rationale: 表达发自内心的深切同情，符合该分词在本句中的情感力度，同时保持现代汉语自然。
- source_word: οὐκ ἔφαγον
  choice: 没有吃饭
  rationale: 直译为“没有吃”；结合叙事语境，用“没有吃饭”更符合现代汉语习惯，且不额外指定所吃之物。
- source_word: προσέχων δὲ τῷ λάκκῳ
  choice: 而是守在坑旁
  rationale: προσέχω 与与格 τῷ λάκκῳ 表示持续留意、看守坑中情形；译为“守在坑旁”简洁自然，也与前面的“没有吃饭”形成对照。
- source_word: ἀποπηδήσαντες
  choice: 突然冲过去
  rationale: 该词字面涉及跃起或跳出，语境中指几人突然而猛烈地采取行动；“突然冲过去”比机械的“跳起来”更清楚地传达其意图，同时不增添行动结果。
- source_word: ἀνέλωσιν
  choice: 杀死
  rationale: 在此处明确表示除掉、杀害约瑟；“杀死”准确直接。
theological_decisions:
- issue: 犹大的担忧与西缅、但、迦得的行动是否已经发生
  choice: 译作“担心……会突然冲过去杀死他”
  alternative: “唯恐……跳起来把他杀了”
  rationale: μήπως 加虚拟语气表达担心某事可能发生，并非断言三人已经付诸行动；译文保留这种未然性。
- issue: 叙述者不吃饭与守坑之间的逻辑关系
  choice: 用“而是”呈现行为上的对照
  alternative: 按连接词逐项译为“没有吃，并留意着坑”
  rationale: 希腊文 δέ 在此衔接两个相关行为；根据上下文，现代汉语用“而是”能自然表达他因怜悯约瑟而不参与吃饭、转而守候，但不把此关系提升为额外的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依常见圣经译名处理：“约瑟、犹大、西缅、但、迦得”。本节无须脚注；译文保留原文中因怜悯而禁食、守坑，以及犹大对潜在杀害行为的担忧。
