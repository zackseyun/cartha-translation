  source_fidelity: 译文准确传达了吕便回来后得知约瑟在他不在场时已被卖、随即撕衣哀哭并发出反问的叙事顺序。将第三人称被卖者明确为“约瑟”符合上下文，且避免汉语代词歧义。惟“里衣”容易使现代读者理解为内衣；χιτών指当时所穿的衣袍／短袍，不宜在此作过度具体的现代服饰限定。
