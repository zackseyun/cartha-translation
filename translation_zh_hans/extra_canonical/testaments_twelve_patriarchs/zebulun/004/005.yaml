base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/005.yaml
  text: When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?”
translation:
  language: zh_hans
  text: 吕便回来，听说约瑟在自己不在时已经被卖了，就撕裂自己的衣袍，哀哭着说：“我怎能去见我父亲雅各的面呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθη
  choice: 约瑟已经被卖了
  rationale: 希腊文动词是第三人称单数“被卖”；汉语若只说“他”容易误指吕便，因此按上下文明确为约瑟。
- source_word: ἀπόντος αὐτοῦ
  choice: 自己不在时
  rationale: 属格绝对结构表示吕便当时不在场；用“自己”清楚回指句首的吕便。
- source_word: περιεσχίσατο τὸν χιτῶνα αὐτοῦ
  choice: 撕裂自己的里衣
  rationale: χίτων通常指贴身穿的衣服或内袍；译作“里衣”比笼统的“衣服”更贴近词义，同时保留哀恸中撕衣的动作。
- source_word: θρηνῶν
  choice: 哀哭着
  rationale: 该分词表达悲痛哀号，不只是安静地悲伤；“哀哭”自然且符合场景。
- source_word: Πῶς ὄψωμαι τὸ πρόσωπον
  choice: 我怎能去见……的面呢
  rationale: 直译为“我将如何看见……的面”；此处是因羞愧和惧怕而不知如何面对父亲，中文用“怎能去见……的面”既自然又保留反问语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。为消除汉语代词歧义，补明被卖的是约瑟；其余结构尽量贴近希腊文。未使用脚注。
