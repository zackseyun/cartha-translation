lexical_decisions:
- source_word: Μὴ κλαῖε
  choice: 不要哭
  rationale: 直接表达禁止继续哭泣，符合现代汉语自然用法。
- source_word: μηδὲ λυποῦ
  choice: 也不要难过
  rationale: λυπέομαι在此指忧伤、苦恼；“难过”自然通俗，并与“哭”形成由外在表现到内在感受的并列。
- source_word: εὕρομεν
  choice: 我们已经想好
  rationale: 字面为“我们找到了”；与后接间接疑问“该说什么”连用时，汉语用“想好”更自然，也保留他们已找到应对说辞的完成意味。
- source_word: τί εἴπωμεν
  choice: 该……说什么
  rationale: 保留间接疑问及商议色彩；虚拟式在此自然表达将要或应当说的话。
- source_word: τῷ πατρὶ ἡμῶν
  choice: 对父亲
  rationale: 语境中“我们”已明确，说“父亲”比“我们的父亲”更符合自然汉语，所指不变。
