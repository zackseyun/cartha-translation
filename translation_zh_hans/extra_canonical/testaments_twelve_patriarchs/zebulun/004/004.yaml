  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/004.yaml
  text: He spent three days and three nights in the pit, and so he was sold while fasting.
translation:
  language: zh_hans
  text: '[a]他在坑里待了三天三夜；就这样，他在没有吃东西的情况下被卖了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些希腊文本没有本节。
    reason: 原始资料指出α文本省略本节，而β文本收录；此重要文本差异应向读者说明。
lexical_decisions:
- source_word: ἐποίησε ... τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: 待了三天三夜
  rationale: 这里的 ποιέω 与时间长度连用，表示“度过、待了”；现代汉语用“待了”自然明白。
- source_word: ἐν τῷ λάκκῳ
  choice: 在坑里
  rationale: λάκκος 指坑穴；本语境中约瑟被投入坑内，译作“坑”准确而简洁。
- source_word: καὶ οὕτως ἐπράθη
  choice: 就这样被卖了
  rationale: 保留 οὕτως 的承接意味和 ἐπράθη 的被动语态，不额外说明买卖者。
- source_word: ἄσιτος
  choice: 挨着饿
  rationale: 该词表示没有进食、处于饥饿状态；“挨着饿”既自然，也保留其与被卖事件相伴的状态含义。
