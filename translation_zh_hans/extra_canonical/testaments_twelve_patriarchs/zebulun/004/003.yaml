  text: 3. Ὁρῶντές με δὲ μὴ⁸ ἐσθίοντα ἔθετό με⁹ τηρεῖν αὐτὸν ἕως οὗ ἀπεδόθη *τοῖς Ἰσμαηλίταις¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/003.yaml
  text: And when they saw that I also was not eating, they set me to guard him until he was sold.
translation:
  language: zh_hans
  text: 他们见我没有吃东西，就派我看守他，直到他被卖给以实玛利人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本见证没有“给以实玛利人”。
    reason: 原文中τοῖς Ἰσμαηλίταις带有文本校勘标记，应向读者交代这一异文。
lexical_decisions:
- source_word: Ὁρῶντές με δὲ μὴ ἐσθίοντα
  choice: 他们见我没有吃
  rationale: 按希腊文直译其核心意思；δὲ在此为叙事衔接，不必机械译出。底本中的μὴ后有校勘注号，并非“也”的明文依据。
- source_word: ἔθετό με τηρεῖν αὐτόν
  choice: 就派我看守他
  rationale: ἔθετο加不定式表示指派或安排某人做事；τηρεῖν在此语境中是看守、监管。
- source_word: ἕως οὗ ἀπεδόθη
  choice: 直到他被卖
  rationale: 保留不定过去时被动态及其时间界限；ἀποδίδωμι在买卖语境中可指交付、卖出。
- source_word: τοῖς Ἰσμαηλίταις
  choice: 给以实玛利人
  rationale: 译出希腊文明确保留的间接受词，指出出售对象；英文咨询层省略了这一成分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“派我看守他”比生硬的“设立我看守他”更符合现代汉语，同时忠实表达希腊文句法。
