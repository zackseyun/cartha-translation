  source_fidelity: 译文总体忠实于希腊文：准确表达吕便忧伤、当天不吃饼（即不进食），以及但上前对他说话。惟末句“于是，但走近他”因人名“但”与转折连词同形，且标点造成句法停顿不自然，容易误读。
  naturalness: “吕便很忧伤，那一天没有吃饭”自然清楚。“于是，但走近他，对他说”在现代汉语中因“于是，但”连用和“他”指代较弱而显得别扭；明确受话对象可消除歧义。
  terminology: “吕便”“但”遵循草稿所采用的通行圣经人名形式；“忧伤”“走近”恰当。“没有吃饭”可自然表达此处“不吃饼／不进食”的意义，无须将“饼”机械直译。
