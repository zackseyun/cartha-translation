  text: 8. *Ἤκουσαν γὰρ ὅσα ἐνεδείξαντο αὐτῷ κακά⁵⁰. IV. Μετὰ δὲ τὸ †πραθῆναι¹ αὐτὸν ἐκάθησαν οἱ ἀδελφοί μου² ἐσθίειν καὶ πίνειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/001.yaml
  text: For they had heard how much evil had been done against him. And after he had been thrown into the pit, my brothers sat down to eat and drink.
translation:
  language: zh_hans
  text: 他被卖以后[a]，我的兄弟们就坐下来吃喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“被卖”，但此处有文本疑问；英语《人民开放圣经》审校层据上下文译作“被扔进坑里”。
    reason: 说明希腊底本与英语咨询层之间的实质差异，并保留底本文本所标示的不确定性。
lexical_decisions:
- source_word: πραθῆναι
  choice: 被卖
  rationale: 现有希腊文本的通常含义是“被卖”；虽然英语审校层采用“被扔进坑里”，翻译仍以所列希腊原文为首要依据。
- source_word: ἐκάθησαν … ἐσθίειν καὶ πίνειν
  choice: 就坐下来吃喝
  rationale: 自然表达坐下并开始吃喝的动作，也保留原文叙事的简洁和冷峻感。
- source_word: οἱ ἀδελφοί μου
  choice: 我的兄弟们
  rationale: 保留第一人称叙述及亲属称谓，不在正文中补出原文未明说的人名。
theological_decisions:
- issue: “被卖”与“被扔进坑里”的文本差异
  choice: 正文采用“被卖”
  alternative: “被扔进坑里”
  rationale: 所给希腊文本明确写作 πραθῆναι（“被卖”），但该词带有文本存疑符号，且英语咨询层采用与《创世记》叙事次序相符的“被扔进坑里”。因此正文依希腊文本，脚注保留另一种理解，不以叙事协调取代原文证据。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“他”不擅自改为“约瑟”，以保留原文代词。所给材料开头“因为他们听说了别人对他所行的种种恶事”属于上一节（3:8）的末句，因此未收入4:1正文。
