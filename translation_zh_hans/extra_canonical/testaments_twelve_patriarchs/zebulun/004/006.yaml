source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ λαβὼν τὸ ἀργύριον κατέδραμεν ὀπίσω τοῖς ἐμπόροις· μὴ εὑρὼν δὲ αὐτοὺς ὑπέστρεψεν ὀδυρόμενος²⁵. καταλιπόντες²⁶ δὲ οἱ ἔμποροι τὴν πλατεῖαν ὁδὸν διόδευσαν²⁷ διὰ *Τρωγλοδιτῶν ἐν συντόμῳ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/006.yaml
  text: And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes.
translation:
  language: zh_hans
  text: 他拿了银子，便跑去追赶那些商人；可是没有找到他们，就伤心地回来了。原来商人离开了大路，取捷径穿过特罗格洛底人的地区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “特罗格洛底人”是古代族名，原词也有“穴居人”的含义。
    reason: 保留族名的历史指称，同时帮助普通读者理解其词源含义，避免正文把专名直接解释化。
lexical_decisions:
- source_word: τὸ ἀργύριον
  choice: 银子
  rationale: 此处指交易所得的银，译作“银子”既准确，也符合叙事语境。
- source_word: κατέδραμεν ὀπίσω τοῖς ἐμπόροις
  choice: 跑去追赶那些商人
  rationale: 按分词和后续单数动词所表明的单数主语理解；“追赶”自然表达在商人之后奔跑的意思。
- source_word: ὑπέστρεψεν ὀδυρόμενος
  choice: 就伤心地回来了
  rationale: 保留希腊文本中英语咨询层遗漏的“回来”和“悲痛”两层含义。
- source_word: τὴν πλατεῖαν ὁδὸν
  choice: 大路
  rationale: 指宽阔的主要道路；现代汉语用“大路”简洁自然。
- source_word: διὰ Τρωγλοδιτῶν ἐν συντόμῳ
  choice: 取捷径穿过特罗格洛底人的地区
  rationale: 将ἐν συντόμῳ理解为走较短路线；Τρωγλοδῖται作为族名音译，并补出汉语所需的“地区”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。依原文恢复英语咨询层未表达的“伤心地回来”，并以“原来”清楚连接商人改道与未能追上的因果关系。
