review_pass:
  verdict: revise
  source_fidelity: 第1—3、5—7节总体忠实地传达了希腊文的水流比喻、分裂的警告、被掳与归回，以及怜悯的理由。第8节保留了“升起／破晓”与“公义之光”的意象，未作宗派化界定。第4节“不要分裂成两个头”却容易理解为人自身长出或变成两个头，未准确表达ἐν δυσὶ κεφαλαῖς所指的“在两个首领／头领之下”而造成的分裂，宜修正。
  naturalness: 译文整体庄重、清楚，适合现代标准汉语公开诵读。“冲带而下”“不把恶记在世人账上”等表达可接受。第4节改为“不要隶属两个首领而分裂”后，政治—身体的双重比喻更清楚，且与后文一个头、两个肩膀等身体意象衔接自然。
  terminology: “主”“以色列”“列国”“掳去”“回转”“公义之光”等术语处理一致。“祖先的文献”谨慎对应γραφῇ τῶν πατέρων μου，未将其过度定为正典。“可憎之事”适切对应βδέλυγμα。脚注保留两处第7节异读及第8节词义替代，锚点位置正确。
  issues:
