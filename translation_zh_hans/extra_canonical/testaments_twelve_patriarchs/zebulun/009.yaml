  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009.yaml
  text: 1 Therefore pay attention to the waters[a], and understand that when they move to one place, they carry down stones, wood, earth, and various other things. 2 But if they are divided into many streams, the ground swallows them up, and they become easy to despise. 3 So also you, if you are divided, will become like this. 4 Therefore do not be split under two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members. 5 For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow two kingdoms, and you will do every abomination. 6 And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses. 7 And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go
    astray in their evil deeds. 8 And after these things the Lord himself will rise for you[c][b], the light of righteousness.
translation:
  language: zh_hans
  text: '**西布伦遗训 9**


    1 所以，你们要留心水流；要知道，水流向同一处时，会把石头、木头、泥土和其他各种东西冲带而下。2 但水若分成许多支流，土地就会将它们吞没，它们也就容易被轻视。3 同样，你们若分裂，也会落到这种地步。4 所以，不要隶属两个首领而分裂；因为主所造的一切都有一个头，却有两个肩膀、两只手、两只脚，以及其余所有肢体。5 我从祖先的文献中得知：你们必在以色列中分裂，追随两个王国，并行各样可憎之事。6 你们的仇敌必把你们掳去；你们在列国中必受苦，经历种种软弱和患难。7 此后，你们想起主的时候，就必回转[a]；他必怜悯你们，因为他有怜悯、有慈悲，不把恶记在世人账上，因为他们是血肉之躯，会在自己的恶行中迷失[b]。8 此后，主自己必为你们升起[c]，他就是公义之光。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“你们必想起主并悔改，他也必使你们回转。”
    reason: textual_variant
  - marker: b
    text: 有些抄本扩展此处的原因说明，作：“因为他们是血肉之躯，迷惑人的灵使他们在一切行为上迷失。”
    reason: textual_variant
  - marker: c
    text: 或译“必为你们发出光来”或“必为你们显现如晨光”；原文描绘主如光升起、照临的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἐπὶ τὰ ὕδατα
  choice: 留心水流
  rationale: 以自然的现代汉语表达直接劝诫，并保留观察流动之水的比喻。
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: 流向同一处
  rationale: 忠实表达水朝同一处移动，不额外把经文限定为不同水流彼此汇合。
- source_word: κατασύρουσιν
  choice: 冲带而下
  rationale: 兼顾水流裹带物体和向下冲行的动态。
- source_word: ἀφανίζει
  choice: 吞没
  rationale: 在此具体语境中指分散的水被土地吸收而消失；“吞没”保留原文鲜明意象。
- source_word: εὐκαταφρόνητα
  choice: 容易被轻视
  rationale: 保留“可轻视、可忽略”的评价意味，而不只解释为水势微弱。
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: 分裂成两个头
  rationale: 保留“头”的身体—政治双重比喻，并用“分裂”区别于一般的分开。
- source_word: γραφῇ τῶν πατέρων μου
  choice: 祖先的文献
  rationale: 既保留祖传书面权威，又不预先断定其正典性质。
- source_word: βδέλυγμα
  choice: 可憎之事
  rationale: 表达强烈的道德与宗教厌恶，同时符合现代汉语圣经体裁。
- source_word: οὐ λογίζεται κακίαν
  choice: 不把恶记在世人账上
  rationale: 保留“计算、归记”的隐喻，以通顺汉语表达不追记罪恶之意。
- source_word: ἀνατελεῖ
  choice: 升起
  rationale: 保留既可指兴起、又可唤起光明破晓意象的语义张力，不在正文中限定为单一解释。
- source_word: φῶς δικαιοσύνης
  choice: 公义之光
  rationale: 保留原文作为主之同位描述的浓缩神学意象，不将其直接限定为某种后来的称号。
theological_decisions:
- issue: 第7节记念、回转与蒙怜悯的次序
  choice: “你们想起主的时候，就必回转；他必怜悯你们”
  alternative: “你们必想起主并悔改，他也必使你们回转”
  rationale: 正文依所给底本文本，异读则涉及人的悔改与上帝使人归回之间的表达差别，故在脚注保留而不加调和。
- issue: 第7节人迷失的原因
  choice: “因为他们是血肉之躯，会在自己的恶行中迷失”
  alternative: “因为他们是血肉之躯，迷惑人的灵使他们在一切行为上迷失”
  rationale: 正文采用较简短读法，并以脚注记录将迷失归于“迷惑人的灵”的扩展读法，避免无依据地强化某种灵界解释。
- issue: 第8节“公义之光”的身份与意象
  choice: 将“公义之光”保留为对主自己的同位描述
  alternative: 将其明确解释为弥赛亚称号，或仅解释为民族复兴的普通比喻
  rationale: 原文将主自己与升起的公义之光并置，但未进一步界定其系统神学含义，因此保留其开放而浓厚的救赎意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。整体句式适合公开诵读；保留“头”“血肉之躯”“公义之光”等核心意象，并避免以宗派术语消解原文在回转、怜悯及光之显现上的神学张力。脚注标记均置于对应正文之后。
