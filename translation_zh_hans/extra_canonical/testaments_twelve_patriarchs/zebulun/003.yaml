lexical_decisions:
- source_word: λάκκων / ξηρῶν
  choice: 干坑
  rationale: 这些坑由祖先挖掘，却没有水；“干坑”既保留宽泛的坑穴意象，也不把它过度限定为蓄水池或井。
- source_word: ἐκώλυσε ... ἀναβλῦσαι ὕδωρ
  choice: 阻止水从这些坑里涌出
  rationale: 保留主作为行动主体，也传达ἀναβλύω所描绘的水向外涌出的动态。
- source_word: περιποίησις
  choice: 保全
  rationale: 上下文所指是约瑟在干坑中蒙保守；“保全”简洁自然，同时保持神意护理的语气。
- source_word: τιμή
  choice: 价银
  rationale: 此处特指卖约瑟所得的款项；“价银”符合古代交易语境，并与下文“血价”形成呼应。
- source_word: ὑποδήματα
  choice: 鞋
  rationale: “鞋”是现代汉语最自然的上位称谓，也能贯穿购买、脱鞋及律法羞辱意象；原词也可译作“鞋履”或“凉鞋”。
- source_word: καταπατήσωμεν
  choice: 把它践踏在脚下
  rationale: 保留动词强烈而轻蔑的动作色彩，并使钱与所买之鞋之间的修辞联系清楚可见。
- source_word: ἀναστῆσαι σπέρμα
  choice: 为兄弟立后
  rationale: 这是兄终弟及婚律的固定观念；“立后”比逐字的“兴起种子”更符合现代汉语，同时准确表达为亡兄延续后裔。
- source_word: ζωὴν ἀδελφοῦ αὐτῶν
  choice: 使他们兄弟的生命得以兴起
  rationale: 希腊文本身异乎寻常，似乎有意把“兴起后裔”的律法语言改用于约瑟的性命。正文保留这种张力，并以脚注说明。
- source_word: ὑπέλυσεν
  choice: 脱去
  rationale: 继续前节脱鞋受辱的意象，避免把象征对应关系泛化为一般惩罚。
- source_word: παῖδες
  choice: 侍从
  rationale: 在约瑟于埃及的权贵场景中，该词表示服侍者；“侍从”自然且不武断判定其法律身份。
- source_word: κατὰ τὸν τύπον βασιλέως Φαραώ
  choice: 像向法老王行礼那样
  rationale: 传达他们以君王礼仪向约瑟俯伏的意思，同时不增添希腊文未明说的对象。
theological_decisions:
- issue: 干坑的护理性解释
  choice: 明确译为主阻止水涌出，为要保全约瑟
  alternative: 把坑的干涸仅理解为叙述者事后的道德化解释，或淡化为非人格化的命运安排
  rationale: 希腊文明说主是行动主体，并以目的从句说明约瑟得以保全；译文不削弱这一神学陈述。
- issue: 兄终弟及婚律与约瑟事件的道德类比
  choice: 保留“使兄弟的生命得以兴起”这一不规则表达，并用脚注解释
  alternative: 把该句统一改成“为兄弟立后”，或泛译成“他们不顾兄弟的性命”
  rationale: 作者刻意把申命记中的立后、脱鞋和吐唾沫意象应用于约瑟的兄弟。原文在“后裔”与“生命”之间形成的张力不应被无声消除。
- issue: 第10节吐唾沫的叙事性质
  choice: 正文按希腊文直接陈述他们被吐唾沫
  alternative: 将其仅处理为象征性比喻或删除为非历史性修辞
  rationale: 希腊文使用直接的叙事动词；脚注可提示象征性理解的可能，但正文不替读者裁定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。叙事部分力求流畅，律法引文略带经文语体。对于第1节的句法困难及第8节刻意不规则的神学类比，不以顺译掩盖原文歧义；通过正文的克制表达和脚注保留张力。
