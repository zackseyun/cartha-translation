  source_fidelity: 第1节在保留原文句法困难方面基本谨慎，但“恳求有人帮助他”补入了原文未明说的“有人”。第6节把“我们不吃它”具体化为“不可用这钱买食物”，超出了希腊文的修辞性说法。第8节“使……生命得以兴起”虽试图保留异常措辞，却不合汉语；可改为“使……生命得以延续”，并由脚注保留其与“立后”用语的张力。第10节的παρὰ τῶν Αἰγυπτίων宜明确为受埃及人羞辱。其余内容忠实反映干坑、价银、脱鞋及吐唾沫的叙述。
  naturalness: 整体庄重流畅，名称和律法语体恰当。第8节“生命得以兴起”在现代汉语中生硬且意义不明；第10节“一倒在他面前”不够自然。修订后使表达更自然，同时不消除原文的修辞异常。
  terminology: “西布伦、约瑟、吕便、西缅、但、迦得、以实玛利人”均可接受；“干坑”“价银”“立后”“侍从”选择适切。“鞋”可保留，且与脱鞋羞辱的母题一致。
  issues:
  - severity: medium
    issue: 第6节将“我们不吃它”译作“我们不可用这钱买食物”。
    rationale: 原文οὐ φαγόμεθα αὐτήν的宾语仍是价银，属于刻意突兀的修辞。译文加入“买食物”虽可推知，却将原文未说出的行动写实化。宜译为“不吃这钱所买的食物”，既保持“吃”的意象，也使汉语可理解。
  - severity: medium
    issue: 第8节“使他们兄弟的生命得以兴起”不自然。
    rationale: ζωὴν与ἀναστῆσαι的搭配确实异常，不能直接规范成“立后”；但“生命得以延续”在汉语中较自然，并仍保留生命延续与上一节立后公式之间的不寻常呼应。脚注应说明直译及其修辞性质。
  - severity: low
    issue: 第1节“恳求有人帮助他”加入不定施事。
    rationale: δεόμενος τῆς πρὸς αὐτὸν βοηθείας仅表示为他恳求帮助，并未指明向谁或由谁帮助。改为“为他祈求帮助”较贴近原文，同时以脚注说明句法和指代困难。
  - severity: low
    issue: 第10节“并在埃及人面前蒙羞”弱化施事关系。
    rationale: παρὰ τῶν Αἰγυπτίων自然表示他们受埃及人羞辱；改为“受埃及人羞辱”更直接。
  revised_text: '《西布伦遗训》第3章


    1. 我看见约瑟正同我一起哭泣，又看见兄弟们上前要杀他；我便退到后面，为他祈求帮助。[a]


    2. 就在这时，吕便站起来说：“来吧，我的兄弟们！我们不要杀他，只把他扔进这些干坑中的一个；这些坑是我们祖先挖的，却没有找到水。”


    3. 原来，主阻止水从这些坑里涌出，为要保全约瑟。


    4. 他们就这样做了，直到把他卖给以实玛利人。


    5. 我的孩子们，至于卖他的价银，我没有分取。不过，西缅、但、迦得和他们的儿子拿了卖他的价银，为自己、妻子和儿女买了鞋，


    6. 说：“我们不吃这钱所买的食物，因为这是我们兄弟的血价；我们倒要把它践踏在脚下，因为他说过要统治我们。这样，我们就来看看他的梦会怎么样！”


    7. 所以，摩西律法的经文中写着：“那不愿为兄弟立后的人，要被脱去鞋，并被人朝脸上吐唾沫。”[b]


    8. 约瑟的兄弟们不愿使他们兄弟的生命得以延续[c]，主便脱去了他们穿着用来敌对他们兄弟约瑟的鞋。


    9. 因为他们来到埃及时，约瑟的侍从在大门外脱去了他们的鞋；随后，他们便像向法老王行礼那样，俯伏在约瑟面前。


    10. 他们不但俯伏在他面前，而且一俯伏在他面前，立刻就被人吐唾沫[d]，并受埃及人羞辱。


    脚注：


    [a] 本节希腊文句法艰涩，直译近于“我看见约瑟与我一同哭泣……便退到我后面，祈求对他的帮助”。“退到后面”的主语及其方向在现存措辞中并不十分清楚；正文仅作最低限度的通顺处理。


    [b] 参申命记25:5–10。不肯履行为兄弟立后之责任的人，要以脱鞋和吐唾沫的方式公开受辱。


    [c] 希腊文措辞异乎寻常，直译近于“为他们兄弟兴起生命”。作者似乎把上一节兄终弟及婚律中“为兄弟立后”的用语转用于道德类比，并非严格引用律法。


    [d] 有人可能把这里的吐唾沫理解为对律法引文的象征性延伸，而不一定视为严格的历史细节；不过，希腊文叙述直接说他们被吐了唾沫。'
