  revision_rationale: 修订不改变段落的神学和叙事主张：主为保全约瑟而使坑中无水；兄弟因出卖约瑟而与申命记的脱鞋、吐唾沫羞辱相类比。修订主要撤除第6节未明说的细节，改善第8和第10节的现代汉语，并使第1节不额外指定帮助者。第1节和第8节仍以脚注明示原文的困难与不规则性。
