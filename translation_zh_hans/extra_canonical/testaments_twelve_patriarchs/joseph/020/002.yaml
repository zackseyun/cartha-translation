  to: 你们要把我的骸骨随你们一同带上去；因为当我的骸骨在那里被带上去时，主必在光明中与你们同在，而彼列必在黑暗中与埃及人同在。
  rationale: 修订仅补足“被带上去”的原文动作方向，并微调首句搭配；保留“那里”及光明、黑暗的未解释性表达。
