review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了命令、条件句以及“主／彼列”“光明／黑暗”“你们／埃及人”的对照。可是“我的骸骨被带到那里时”把ἀναγομένων（被带上去、被带起）弱化成了单纯的“被带到”，未充分反映ἀνά的“向上／带上去”意义。
  naturalness: 整体庄重自然。“把我的骸骨随你们一同带上去”比“把我的骸骨和你们一同带上去”更符合现代汉语中物件随人同行的表达。
  terminology: “骸骨”“主”“彼列”“光明”“黑暗”均恰当；“彼列”保留专名及原文的角色开放性，不宜改作“魔鬼”等解释性称呼。
  issues:
  - severity: medium
    issue: “被带到那里时”未译出ἀναγομένων的“带上去”动作方向。
    rationale: 原文使用ἀνάγω的被动属格绝对结构，英语审校轨迹也作“are taken up there”。应保留“在那里被带上去”，而不只说“带到那里”。
  - severity: low
    issue: 首句“把我的骸骨和你们一同带上去”略有搭配生硬。
    rationale: “随你们一同带上去”更自然，并仍对应μεθ᾽ ὑμῶν。
