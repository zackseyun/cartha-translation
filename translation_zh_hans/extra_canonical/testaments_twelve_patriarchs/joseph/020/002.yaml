base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/002.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: zh_hans
  text: 你们要把我的骸骨随你们一同带上去；因为当我的骸骨在那里被带上去时，主必在光明中与你们同在，而彼列必在黑暗中与埃及人同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: 和你们一同带上去
  rationale: 该词结合“共同/随同”与“带上去”的意思；此处指以色列人离开埃及时把约瑟的骸骨一并带走。
- source_word: τὰ ὀστᾶ μου
  choice: 我的骸骨
  rationale: “骸骨”比直译“骨头”更符合遗骨语境，也保持庄重。
- source_word: ἐν φωτί
  choice: 在光明中
  rationale: 保留希腊文的空间性表达及其象征意味，不将其解释性改写为“赐下光明”或“光照”。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 按专名音译处理，保留本段将其人格化并与“主”对置的表达。
- source_word: ἐν σκότει
  choice: 在黑暗中
  rationale: 与“在光明中”形成原文明确的平行对照，不进一步限定黑暗是属灵、道德或处境意义。
theological_decisions:
- issue: “主在光明中”与“彼列在黑暗中”的性质
  choice: 保留“在光明中/在黑暗中”的原始对举
  alternative: 解释为主光照以色列人、彼列使埃及人陷入属灵黑暗
  rationale: 原文具有象征性和神学张力，却未明说光明与黑暗的具体作用；译文不应替作者消解其多义性。
- issue: 彼列的身份
  choice: 作为专名“彼列”呈现
  alternative: 译作“邪恶者”或“恶魔”
  rationale: Βελίαρ在此带定冠词且与主形成角色对照，但直接意译会过早确定其身份和称谓。
- issue: “我的骸骨被带到那里时”的指向
  choice: 保留“那里”
  alternative: 明确译为“迦南地”或“应许之地”
  rationale: 希腊文本仅用ἐκεῖ（那里）；虽然上下文可能使所指清楚，本节本身没有明说地点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式尽量保留原文因果关系以及“主—彼列、光明—黑暗、你们—埃及人”的平行对照。
