  text: Καὶ²⁶ *ταῦτα εἰπὼν²⁷ ἐκτείνας²⁸ τοὺς πόδας αὐτοῦ²⁹ *ἐκοιμήθη ὕπνῳ καλῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/009.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: zh_hans
  text: 他说完这些话，伸直双脚，便安然长眠了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: 他说完这些话
  rationale: 将希腊语过去分词结构自然转换为现代汉语的先行时间动作，同时保留“这些话”的指代。
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: 伸直双脚
  rationale: ἐκτείνω 表示伸展、伸直；汉语无须直译物主代词 αὐτοῦ，语义仍然明确。
- source_word: ἐκοιμήθη
  choice: 长眠了
  rationale: 该词字面为“睡去”，在此叙事语境中委婉指死亡；“长眠”既保留睡眠意象，也自然传达临终含义。
- source_word: ὕπνῳ καλῷ
  choice: 安然
  rationale: καλός 可指美好、良善；与“睡眠”搭配时译作“安然”更符合现代汉语习惯，并保留平静、美好的意味，不采用原文没有的“永恒”。
theological_decisions:
- issue: “睡去”是否明说为死亡或永恒之眠
  choice: 用“安然长眠”保留死亡的委婉表达
  alternative: 译作“安然睡去”或“进入永恒的长眠”
  rationale: 上下文显然是临终场景，但希腊文没有“永恒”一词；因此既不把隐喻完全淡化为普通睡眠，也不增添关于永恒状态的明确表述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“便”承接连续动作，使临终叙述简洁平稳；全句不添加原文未明说的神学解释。
