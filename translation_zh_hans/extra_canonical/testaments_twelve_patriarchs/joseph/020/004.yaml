  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/004.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good sleep.
translation:
  language: zh_hans
  text: 他说完这些话，就伸直双脚，在美好的睡眠中长眠了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: 伸直双脚
  rationale: 准确表达临终时将双脚伸展开来的动作；现代汉语用“伸直双脚”比逐字译作“伸出他的脚”更自然。
- source_word: ἐκοιμήθη
  choice: 长眠了
  rationale: 原词字面义为“睡去”，在此叙事语境中委婉指死亡。“长眠”既保留睡眠意象，也自然传达死亡含义。
- source_word: ὕπνῳ καλῷ
  choice: 安然
  rationale: 字面为“以美好／安好的睡眠”。“安然长眠”在汉语中自然表达一种平安、美好的长眠，同时避免误译为“享高寿”。
theological_decisions:
- issue: 睡眠语言是否应直接译明为死亡
  choice: 用“长眠了”保留死亡委婉语及睡眠意象
  alternative: 译作“死了”或“睡了美好的一觉”
  rationale: ἐκοιμήθη ὕπνῳ καλῷ明确采用睡眠意象描述死亡。直译为普通睡眠会造成误解，直接译作“死了”又会抹去原文修辞；“安然长眠了”兼顾两者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他说完这些话”简洁对应分词结构；“安然长眠”符合中文临终叙事习惯，并忠实保留希腊文的美好睡眠意象。
