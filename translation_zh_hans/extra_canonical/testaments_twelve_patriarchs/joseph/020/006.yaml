  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/006.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: zh_hans
  text: 说完这些话，他伸直双脚，便在美好的睡眠中睡去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: 他伸直双脚
  rationale: 忠实表达伸展、伸直双脚的临终动作；现代汉语自然简洁。
- source_word: ἐκοιμήθη
  choice: 睡去了
  rationale: 保留希腊文“入睡”的委婉表达及其死亡语境，不直接改译为“死了”。
- source_word: ὕπνῳ καλῷ
  choice: 在安美的睡眠中
  rationale: καλός可指美好、安好；“安美”既保留“美好”的正面意味，也符合平静离世的语境，而不把隐喻完全解释为“安息”。
theological_decisions:
- issue: “睡去”是否明确译作死亡
  choice: 保留“睡去了”的委婉隐喻
  alternative: 死了／安息了
  rationale: 原文采用睡眠意象；明确译为“死了”会消除修辞，“安息了”则可能引入较固定的宗教措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原文重复的睡眠意象，并以“安美”传达 καλῷ 的积极、平静色彩。
