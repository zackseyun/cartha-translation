lexical_decisions:
- source_word: ἐπένθησεν ... πένθος μέγα
  choice: 大大哀悼
  rationale: 希腊文以同源动词和名词构成强调表达，直译为“哀悼了极大的哀悼”不合现代汉语习惯；“大大哀悼”自然地保留了其强调力度。
- source_word: πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος
  choice: 全以色列和全埃及
  rationale: 保留两个 πᾶς 的整体性与原句的平行结构；此处名称以群体或全国居民为转喻，现代汉语可以自然理解。
- source_word: αὐτόν
  choice: 他
  rationale: 按原文保留阳性第三人称代词，不在本节中补入姓名，以免加入源文未明说的信息。
