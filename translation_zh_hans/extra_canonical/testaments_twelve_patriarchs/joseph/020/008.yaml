base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/008.yaml
  text: And in the exodus of the sons of Israel from Egypt they gathered up the bones of Joseph, and buried him in Hebron with his fathers; and the years of his life were one hundred and ten years.
translation:
  language: zh_hans
  text: 以色列子孙出埃及时，他们收集了约瑟的骸骨，把他安葬在希伯仑，与他的祖先一同葬在那里。约瑟一生的年数是一百一十年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἐξόδῳ
  choice: 出埃及时
  rationale: 按语境表达以色列人离开埃及这一事件；用“出埃及”既自然，也保留原文“出去、离境”的含义。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: 以色列众子
  rationale: 较直接地保留“众子”的家族性称谓，而不简化为“以色列人”。
- source_word: συνήγαγον τὰ ὀστᾶ
  choice: 收殓了……的骸骨
  rationale: 原义为“收集、聚拢骨骸”；“收殓”符合迁取遗骨并安葬的语境，且语言庄重自然。
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: 与他的祖先同葬
  rationale: πατέρες在此指先祖；译作“祖先”避免现代汉语中“父亲们”的误解，“同葬”明确与安葬动词的关系。
- source_word: τὰ ἔτη τῆς ζωῆς αὐτοῦ
  choice: 约瑟一生的年日
  rationale: 保留原文关于寿命年数的表达，同时补出姓名以避免中文代词指向含混。
theological_decisions:
- issue: 安葬地点与正典《约书亚记》24:32所述示剑不同
  choice: 依所给希腊文本译为“希伯仑”
  alternative: 按正典平行传统改为“示剑”
  rationale: 翻译应忠实呈现本见证文本的独特读法，不以其他传统静默校正。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。将原文一个长复句分为两句，以符合现代汉语节奏；不增添原文没有的解释。
