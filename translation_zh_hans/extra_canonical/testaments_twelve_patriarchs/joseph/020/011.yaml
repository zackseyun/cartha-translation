revisions:
- from: 因为他的国将是永远的国，绝不会消逝；我的国在你们中间却将走到终点，如同果园里的守望棚，夏季一过便消失无踪。
  to: 因为他的国将是永恒的国度，必不消逝；但我在你们中间的国度将要完结，如同果园的看守棚，夏天过后就消失了。
  rationale: 修订保留原文的代词指向、βασιλεία的重复和两种国度的鲜明对照；以“永恒的国度／将要完结”较清楚地表达αἰώνιος与ἐπιτελεῖται，并将临时果园看守棚的意象译得更自然。原文校勘编号没有提供异文内容，因此不增设推测性脚注。
