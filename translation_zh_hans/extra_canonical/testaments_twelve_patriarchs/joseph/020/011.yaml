source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/011.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman’s hut in an orchard, which vanishes after the summer.
translation:
  language: zh_hans
  text: 因为他的国将是永恒的国度，必不消逝；但我在你们中间的国度将要完结，如同果园的看守棚，夏天过后就消失了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: 国
  rationale: 在此指王权及其统治领域；现代汉语圣经语体中用“国”既自然，也保留上下两句的对应。
- source_word: αἰώνιος
  choice: 永远的
  rationale: 表达持续不止、恒久长存的意义，并与后文“绝不会消逝”相呼应。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 希腊语可表示“在你们里面”或“在你们中间”；此处谈约瑟在其后裔中的国，采用较合语境且不把意义内在化的“在你们中间”。
- source_word: ἐπιτελεῖται
  choice: 将走到终点
  rationale: 该动词可指完成、终结；紧接着以夏后消失的守望棚作比，语境侧重统治的终结，译文保留“达到终点”的动态。
- source_word: ὀπωροφυλάκιον
  choice: 果园里的守望棚
  rationale: 指果园中供看守者使用的临时棚屋；此译具体、易懂，并保留其临时性意象。
- source_word: μετὰ τὸ θέρος
  choice: 夏季一过
  rationale: θέρος可指夏季，也可关联收获时节；这里按季节结束后临时棚被撤去的图景表达。
- source_word: ἐξαφανίζεται
  choice: 消失无踪
  rationale: 准确体现“消失、归于无有”的强烈语气，并与前句“不消逝”形成鲜明对比。
theological_decisions:
- issue: “他的国”所指对象
  choice: 保留代词“他的”，不在正文中补明身份
  alternative: 按上下文直接译为某一特定人物或弥赛亚的国
  rationale: 本节本身只有代词；补出身份会消除原文依赖上下文的指称关系，并可能引入解释性判断。
- issue: 两个“国”的对照
  choice: 两处均译作“国”，保留永恒之国与约瑟之国的张力
  alternative: 将前者译作“王权”、后者译作“统治”或“王朝”
  rationale: 原文有意重复同一名词形成对照；统一译法最能显出一个永不消逝、一个终将消失的反差。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“走到终点”比生硬的“被完成”更符合此处终结语境；“守望棚”保留古代果园临时看守设施的具体意象。原文所附校勘编号未提供对应异文内容，因此不据此虚构脚注。
