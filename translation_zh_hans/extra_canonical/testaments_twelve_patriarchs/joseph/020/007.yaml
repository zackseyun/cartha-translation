- source_word: πᾶς Ἰσραήλ
  choice: 以色列全家
  rationale: 这里的“以色列”指以色列全体民众；译作“全家”符合现代汉语表达，也保留群体含义。
- source_word: πᾶσα Αἴγυπτος
  choice: 埃及全地
  rationale: 以地名代指全体埃及人；“埃及全地”自然地传达范围周遍的意思。
- source_word: ἐπένθησεν … πένθος μέγα
  choice: 大大哀悼
  rationale: 希腊文以同源动词和名词加强语气。汉语用“大大哀悼”简洁再现这种强调，避免生硬的“哀悼了大哀悼”。
