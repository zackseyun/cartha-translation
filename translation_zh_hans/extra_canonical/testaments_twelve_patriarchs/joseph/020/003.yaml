  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/003.yaml
  text: And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.
translation:
  language: zh_hans
  text: 你们要把你们的母亲亚西纳带到〔赛马场旁〕[a]，把她安葬在我母亲拉结附近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赛马场旁”在希腊文校勘本中置于方括号内，表明这几个词的文本归属存疑。
    reason: 原文版本以方括号标示παρὰ τὸν Ἱππόδρομον；译文以六角括号及脚注反映其文本不确定性。
lexical_decisions:
- source_word: ἀγάγετε
  choice: 带到
  rationale: 保留第二人称复数命令语气，指示约瑟的众子将亚西纳带往安葬地点；中文结合“你们要”表达命令。
- source_word: παρὰ τὸν Ἱππόδρομον
  choice: 赛马场旁
  rationale: παρά加宾格在此表示趋向某处近旁；Ἱππόδρομος指赛马或战车竞赛场地，译作“赛马场”简明自然。
- source_word: πλησίον Ῥαχιὴλ
  choice: 拉结附近
  rationale: πλησίον表达空间上的靠近，但未明确是否同墓，故不译成“与拉结合葬”，以保留原文范围。
- source_word: θάψατε αὐτήν
  choice: 安葬
  rationale: θάπτω意为埋葬死者；中文“安葬”庄重自然，宾语亚西纳可由上下文明确，无须重复。
theological_decisions:
- issue: 亚西纳与拉结的安葬关系
  choice: 译为“安葬在我母亲拉结附近”
  alternative: 译为“与我母亲拉结合葬”
  rationale: 原文仅说πλησίον（附近、近旁），没有明确表示合葬；采用较少推断的表达，保留空间关系的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你们要”自然呈现复数命令；用“母亲亚西纳”和“我母亲拉结”保留亲属称谓的对照。方括号内容用中文六角括号标示，并配脚注说明校勘上的不确定性。
