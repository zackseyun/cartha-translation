  text: '*᾿Ασυνὲθ δὲ¹⁹ τὴν μητέρα ὑμῶν ἀγάγετε²⁰ [παρὰ τὸν Ἱππόδρομον]²¹ καὶ πλησίον Ῥαχιὴλ τῆς μητέρος μου *θάψατε αὐτήν²².'
