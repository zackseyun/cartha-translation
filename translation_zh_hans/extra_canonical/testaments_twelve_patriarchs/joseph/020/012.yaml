source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/012.yaml
  text: For his kingdom will be an everlasting kingdom that will not pass away. But my kingdom among you is brought to completion, like a watchman’s hut in an orchard, which disappears after the summer.”
translation:
  language: zh_hans
  text: 因为他的国必是永远的国，永不消逝；而我的国在你们中间正走向终结，如同果园里的守望棚[a]，夏天过后就消失了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “果园里的守望棚”：看守果园者所用的简易棚屋。此处希腊文本在该词之后有一处残缺或讹误；本译文只按可确定的比喻意象翻译。
    reason: 解释古代生活背景，并披露源文本在该词后存在传抄问题，避免臆补缺文或断言棚屋消失的具体方式。
lexical_decisions:
- source_word: βασιλεία
  choice: 国
  rationale: 此处既可指王权，也可指其统治领域；上下文将两个“国”作对比，译作“国”最自然，并保留这种语义幅度。
- source_word: αἰώνιος
  choice: 永远的
  rationale: 与随后“永不消逝”相呼应，准确表达持续无尽的意思。
- source_word: οὐ παρελεύσεται
  choice: 永不消逝
  rationale: 表达该国不会过去、终止；“消逝”也与后半句的 ἐξαφανίζεται 形成清楚对照。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 保留介词短语可能表示群体内部或众人当中的含义，不收窄为“在你们心里”。
- source_word: ἐπιτελεῖται
  choice: 已走到尽头
  rationale: 在永恒之国与短暂无存之国的对比中，此被动形式指达到终点、告终；采用自然汉语表达，同时不把它正面化为“成全”。
- source_word: ὀπωροφυλάκιον
  choice: 果园里的守望棚
  rationale: 该词指看守果园或庄稼时临时搭建的棚屋；此译法既传达用途，也保留其短暂性的比喻。
- source_word: ἐξαφανίζεται
  choice: 消失了
  rationale: 直陈守望棚在季节过去后不复存在，与前文永不消逝形成词义对照。
theological_decisions:
- issue: “他的国”与“我的国”的身份及关系
  choice: 按原文保留两个不同的所有格，不解释“他”具体指谁，也不把两个国合并。
  alternative: 将“他的国”明确解释为弥赛亚或上帝的国，或将“我的国”解释为约瑟支派的统治。
  rationale: 本句自身没有明说两者身份；保留人称对比可维护原文的神学张力，避免引入特定解释传统。
- issue: ἐπιτελεῖται 的终末含义
  choice: 译为“已走到尽头”。
  alternative: 译为“得以成全”或“将告终”。
  rationale: 果园守望棚随后消失的比喻明显强调终止；希腊语为现在时，故不擅自改成纯将来时。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号凸显永恒之国与短暂之国的强烈对比；保留原文现在时的结果感，译作“已走到尽头”。脚注标记已在正文中对应出现。
