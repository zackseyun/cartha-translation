  rationale: 修订仅调整后半句的时态与体貌：“正走向终结”对应现在时被动ἐπιτελεῖται，同时由季节性守望棚的比喻自然体现其终结性，避免原译“已走到尽头”的完成化加强。脚注删去无须由原文断定的“拆除或废弃”。
