base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/005.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: zh_hans
  text: 你们要带着我的骸骨上去；因为当我的骸骨在那里被带上去时，主必在光明中与你们同在，而彼列必在黑暗中与埃及人同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: 和你们一同带上去
  rationale: 该词结合“共同”与“带上去”的意义；此处以“和你们一同”自然表达同行关系，同时保留向上迁移的方向。
- source_word: τὰ ὀστᾶ μου
  choice: 我的骸骨
  rationale: “骸骨”比“骨头”更符合遗体迁葬的庄重语境，也准确对应复数“骨骸”。
- source_word: ἐν φωτί
  choice: 在光明中
  rationale: 保留原文的象征性空间表达，不将“光明”解释性改写为恩惠、拯救或引导。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用该专名常见的中文音译，不把它意译或等同改写为“撒但”，以保留文本自身的称谓。
- source_word: ἐν σκότει
  choice: 在黑暗中
  rationale: 与“在光明中”形成原文鲜明的平行对照，并保留其可能兼具处境与神学象征的含义。
theological_decisions:
- issue: 主在光明中同在与彼列在黑暗中同在的平行关系
  choice: 按原文保留两句平行结构：“主必在光明中与你们同在，而彼列必在黑暗中与埃及人同在”
  alternative: 将后半句解释为彼列使埃及人陷入黑暗，或将“黑暗”明确解释为审判
  rationale: 希腊文仅陈述两种“同在”及光明与黑暗的对照，没有明说因果关系或具体解释；译文不应消解其神学张力。
- issue: 将骸骨带“到那里”的指向
  choice: 保留“那里”
  alternative: 明确译为迦南、应许之地或希伯仑
  rationale: ἐκεῖ本身只是“那里”；本节所给原文并未明示具体地点，因此不从上下文传统补入地名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；句式尽量贴近希腊文的因果与对照结构。“必”表达语境中的将来陈述，不额外强化为命令或神谕公式。
