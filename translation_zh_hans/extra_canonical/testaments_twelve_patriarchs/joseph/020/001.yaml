  text: Οἶδα ⌜γὰρ⌉¹ ὅτι μετὰ *τὴν τελευτήν μου² οἱ Αἰγύπτιοι θλίψουσιν³ ὑμᾶς⁴, ἀλλ᾽ ὁ Θεὸς⁵ ποιήσει τὴν ἐκδίκησιν ὑμῶν⁶ καὶ ἐπάξει⁷ ὑμᾶς εἰς *τὰς ἐπαγγελίας⁸ τῶν πατέρων ὑμῶν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/001.yaml
  text: For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.
translation:
  language: zh_hans
  text: 因为我知道，我死后，埃及人必压迫你们；但上帝必为你们伸冤，并带领你们进入给你们祖先的诸般应许。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“进入……诸般应许”；“应许”为复数，且未明说“应许之地”。“给你们祖先的”也可译作“你们祖先的”。
    reason: 说明原文略显不寻常的“进入应许”表达、复数形式，以及属格关系的可保留歧义。
lexical_decisions:
- source_word: θλίψουσιν
  choice: 压迫
  rationale: 该动词表示使人受苦、遭患难或受压制；在埃及人对以色列后裔的语境中，“压迫”自然且准确。
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: 为你们伸冤
  rationale: 直译近于“施行你们的报应/申冤”。现代汉语“为你们伸冤”既保留上帝主持公义、惩治压迫者的含义，也避免误解为上帝帮助他们进行私人报复。
- source_word: ἐπάξει
  choice: 带领……进入
  rationale: ἐπάγω在此表示带到、领入；不添加原文没有的“带回”。
- source_word: τὰς ἐπαγγελίας
  choice: 所得的应许
  rationale: 保留复数“应许”。由于汉语不能自然地说“进入应许”，补出“所得的”以表达进入祖先所领受之应许的实现范围，同时不把复数具体化为“应许之地”。
- source_word: τῶν πατέρων ὑμῶν
  choice: 你们祖先
  rationale: πατέρες在此指族长和先祖；“祖先”比字面的“父亲们”更符合现代汉语语境。
theological_decisions:
- issue: ἐκδίκησις所表达的是申冤、公义惩治还是私人复仇
  choice: 为你们伸冤
  alternative: 替你们报仇／施行对你们的报应
  rationale: 属格ὑμῶν可理解为以他们为受益者的申冤或对仇敌的惩治。“伸冤”保留司法与公义色彩，不导向私人复仇。
- issue: “进入应许”的隐喻是否应明确为进入应许之地
  choice: 保留“应许”的复数，并以“祖先所得的应许”维持原文表达
  alternative: 带领你们进入应许之地
  rationale: 原文是复数ἐπαγγελίας，并未出现“土地”；不宜把可能涵盖多项族长应许的表达缩限为单一地理对象。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“必”体现预告语气；分号呈现“埃及人压迫”与“上帝伸冤、带领”的强烈转折。未加入原文没有的“回”。
