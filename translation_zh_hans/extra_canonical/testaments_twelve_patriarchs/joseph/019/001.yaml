  text: '*Καίγε καὶ²² ὡραιότητα ἔδωκέ²³ μοι ὑπὲρ ὡραίους Ἰσραήλ, ⌜καὶ⌉ ἐφύλαξέ²⁴ με ⌜ἕως γήρους²⁵ ἐν δυνάμει καὶ⌉ ἐν κάλλει· *Καὶ γὰρ ὅμοιος ἤμην²⁶ ἐν πᾶσι τῷ²⁷ Ἰακώβ. Ἀκούσατε δέ¹, τέκνα μου, καὶ *περὶ ὧν †οἶδα ἐνυπνίων².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/001.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things. Now listen, my children, also concerning the dreams that I know about.
translation:
  language: zh_hans
  text: 他确实还赐给我俊美，胜过以色列中俊美的人；又保守我直到年老，仍有力量，仍然俊美。因为我在一切事上都像雅各。我的孩子们，现在也听我说说我所知道的那些梦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε καὶ
  choice: 确实
  rationale: 表达递进兼强调语气，避免生硬重复“并且”。
- source_word: ὡραιότητα / ὡραίους
  choice: 俊美／俊美的人
  rationale: 同词根在上下文中均指外貌美好；保留其词汇呼应。
- source_word: ὑπὲρ
  choice: 胜过
  rationale: 准确表达比较意义。
- source_word: ἐφύλαξέ με
  choice: 保守我
  rationale: 兼顾神施行护佑的语义和庄重叙事语体。
- source_word: ἕως γήρους
  choice: 直到年老
  rationale: 自然表达持续至老年的时间范围。
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: 仍有力量，仍然俊美
  rationale: 将希腊文状态短语自然转为现代汉语，同时保留两个并列方面。
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  choice: 我在一切事上都像雅各
  rationale: 贴近原文宽泛表述，不擅自限定相似之处。
- source_word: περὶ ὧν οἶδα ἐνυπνίων
  choice: 讲讲我所知道的那些梦
  rationale: 保留复数“梦”及“我所知道”的异常但可理解表达，不改译成“我所看见的梦”。
theological_decisions:
- issue: 赐予和保守的主语
  choice: 使用“他”而不补明身份
  alternative: 译作“上帝”或“主”
  rationale: 本节希腊文仅以动词第三人称单数隐含主语；不在本节中擅自明确其所指。
- issue: “在一切事上都像雅各”的范围
  choice: 保留宽泛陈述
  alternative: 限定为外貌、力量或品格相似
  rationale: 原文没有限定相似范围，应保留其概括性和潜在张力。
- issue: οἶδα 与“梦”的关系
  choice: 译为“我所知道的那些梦”
  alternative: “我所做的／看见的那些梦”
  rationale: 尽管表达不同寻常，现有文本读作“知道”；不以更常见的梦境措辞取代有文本依据的读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我的孩子们”保留父亲临终训诫的亲切与郑重；用分句处理较长希腊句，使朗读自然。
