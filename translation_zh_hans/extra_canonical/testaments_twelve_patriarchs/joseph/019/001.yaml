  to: 他确实还赐给我俊美，胜过以色列中俊美的人；又保守我直到年老，仍有力量，仍然俊美。因为我在一切事上都像雅各。我的孩子们，现在也听我说说我所知道的那些梦。
  rationale: 修订仅补足首句递进连词，并使比较表达更贴合原文而不额外强化范围；其余内容维持原译对隐含主语、宽泛的“在一切事上”、以及末句异常但有文本依据的“知道那些梦”的忠实处理。无原文脚注锚点需在译文中呈现。
