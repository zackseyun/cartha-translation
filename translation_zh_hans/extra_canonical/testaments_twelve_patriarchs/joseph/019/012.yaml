revisions:
- from: 因为他的国将是永远的国，永不消逝。至于我的国，在你们中间将走到终点，如同收获季节过后看守果园的棚子，渐渐消失。
  to: 因为他的国将是永远的国，永不消逝。至于我的国，在你们中间得以完成，如同果园守望人的棚屋，在夏季过后消失。
  rationale: 修订恢复ἐπιτελεῖται的“得以完成”义，不把其与棚屋消失的比喻预先解释为单纯“告终”；将θέρος直译为“夏季”，并删除原文未明示的“渐渐”。“果园守望人的棚屋”对应ὀπωροφυλάκιον，表达供果园看守者使用的临时棚屋，而不添加身份或神学解释。
