  source_fidelity: 原译将ἐπιτελεῖται译为“将走到终点”，过度确定为终止，且弱化了该词主要的“完成／成就、被完成”语义。紧随其后的棚屋消失意象可以造成终局的联想，但不应取代动词本身。另，原文此处为现在时形式，中文宜避免无根据地强化为“将……走到终点”。“收获季节”虽可由θέρος在特定语境下引申，但其基本义为“夏季”，采用“夏季过后”更贴近原文，也保留原有季节性。
  naturalness: “如同收获季节过后看守果园的棚子”修饰关系略显拥挤。改为“如同果园守望人的棚屋，在夏季过后消失”较自然，同时保留古代农业意象。
  terminology: “国”可保留，既不预设为单指领土，也不把βασιλεία狭化为纯粹王权。代词“他的／我的”不作身份补足。
