source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/012.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman's hut after the summer, vanishing away.
translation:
  language: zh_hans
  text: 因为他的国将是永远的国，永不消逝。至于我的国，在你们中间得以完成，如同果园守望人的棚屋，在夏季过后消失。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: 国
  rationale: 既可表达王权，也可表达统治领域；本句将两个国并列对照，译作“国”自然且保留其语义张力。
- source_word: αἰώνιος
  choice: 永远的
  rationale: 直接表达持续无尽之意，并与后面的“永不消逝”自然呼应。
- source_word: οὐ παρελεύσεται
  choice: 永不消逝
  rationale: παρέρχομαι在此指过去、消失或终止；“永不消逝”符合国度长存的语境。
- source_word: ἐπιτελεῖται
  choice: 将走到终点
  rationale: 该词可指完成、成就，也可在此对比语境中指达到终局；此译保留“完成”与“终结”之间的张力，避免单纯译作“被成全”而削弱后文消失的意象。
- source_word: ὀπωροφυλάκιον
  choice: 看守果园的棚子
  rationale: 指果园或收获地中供看守者使用的临时棚屋；采用说明性译法，使现代读者能够理解。
- source_word: μετὰ τὸ θέρος
  choice: 收获季节过后
  rationale: θέρος可指夏季，也可指收割时节；与临时看守果园的棚子相连时，“收获季节”更清楚地呈现意象，同时承认其季节含义。
- source_word: ἐξαφανίζεται
  choice: 渐渐消失
  rationale: 表达从视野中消失、归于无有；加“渐渐”使中文意象自然，但不改变其最终消失之义。
theological_decisions:
- issue: “他的国”与“我的国”的身份和关系
  choice: 保留原文代词，不补明所指
  alternative: 将“他的”解释为弥赛亚或上帝，并把“我的国”明确为约瑟支派的统治
  rationale: 本节自身没有明说两个代词所指；直接补入身份会消除文本原有的指涉空间并引入解释。
- issue: ἐπιτελεῖται所表达的是成全还是终结
  choice: 译为“将走到终点”
  alternative: 译为“将被成全”或“将告终”
  rationale: 该词本身含完成、达到终局之意，而紧接着的临时棚子消失之喻强调终止；“走到终点”兼顾二者，不把神学含义单向固定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。两句维持原文鲜明对照：“他的国”永存，“我的国”则达到终局并消失。将果园看守棚的文化意象适度明示，但不添加原文未有的身份解释。
