  text: And the angels and men and all the earth rejoiced over him.
translation:
  language: zh_hans
  text: 天使、世人和全地都因他而欢喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχαιρον
  choice: 欢喜
  rationale: 准确表达未完成时所描写的欢欣状态；中文不必另行标示其持续体貌。
- source_word: ἐπ᾽ αὐτῷ
  choice: 因他
  rationale: ἐπί加与格在此表示欢喜所缘于或所围绕的对象；“因他”自然简洁，同时不过度限定为某一种具体原因。
- source_word: οἱ ἄγγελοι καὶ οἱ ἄνθρωποι
  choice: 天使、世人
  rationale: 分别对应“天使”和“人类”；“世人”在现代汉语中能自然表达集合意义的人类。
- source_word: πᾶσα ἡ γῆ
  choice: 全地
  rationale: 保留原文宇宙性、整体性的拟人表达，不将 γῆ 擅自缩小为居民或扩释为全世界的人。
theological_decisions:
- issue: “全地”是否应解释为地上的居民
  choice: 保留“全地”的字面拟人表达
  alternative: 全地的人／全世界的人
  rationale: 原文明确写 πᾶσα ἡ γῆ，与天使和世人并列；保留这一措辞可维持其诗性及宇宙性的神学张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；并列结构清楚，保留原文的宏大赞颂语气。
