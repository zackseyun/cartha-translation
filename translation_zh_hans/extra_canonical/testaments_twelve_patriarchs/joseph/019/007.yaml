  text: And I saw a calf that encircled them twelve times, and it became wholly a help to the bulls.
translation:
  language: zh_hans
  text: 我看见一头牛犊，它环绕它们十二次，并且完全成为众公牛的帮助。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文版本在“完全”一词后标有问号，表示此处文本或读法不确定。
    reason: 原文校勘文本在ὁλοκλήρως之后标注问号；脚注保留该版本所提示的文本不确定性。
lexical_decisions:
- source_word: μόσχον
  choice: 一头牛犊
  rationale: 对应年轻的牛，保留异象中的动物形象，不把它具体化为未经原文明确说明的性别或象征身份。
- source_word: δωδεκάκις περιέβαλλε
  choice: 绕着它们十二圈
  rationale: 自然表达反复环绕十二次的动作；“十二圈”在现代汉语中比“环绕十二次”更流畅，同时不改变次数。
- source_word: τοῖς βουσὶ
  choice: 众公牛
  rationale: 延续本段异象中牛犊与成年牛的对照；βοῦς本身可泛指牛或公牛，此处依上下文采用“公牛”，但不进一步解释其象征所指。
- source_word: εἰς βοήθειαν
  choice: 成了……的助力
  rationale: 保留“成为帮助/助力”的结果性结构，也较符合现代汉语的庄重叙述语体。
theological_decisions:
- issue: 牛犊与众公牛的象征意义
  choice: 仅译出异象画面，不在正文中指认其象征对象
  alternative: 按某种解释传统将牛犊或公牛直接释为特定人物、支派或救主形象
  rationale: 本句原文本身没有明说象征对象；直接指认会消除原有的开放性，并引入解释传统。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我又看见”衔接异象叙述；用分号区分所见动作与其结果。保留“完全”及其校勘疑问，不擅自删去或改释。
