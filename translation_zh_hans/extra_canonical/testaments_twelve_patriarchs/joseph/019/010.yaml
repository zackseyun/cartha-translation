  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/010.yaml
  text: But these things will happen in their time, in the last days.
translation:
  language: zh_hans
  text: 但这些事将在末后的日子，按其时候发生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα δὲ
  choice: 但这些事
  rationale: Ταῦτα指前文所述之事；δέ在此承接并带轻微转折，译作“但”自然且符合语境。
- source_word: γενήσεται
  choice: 将……发生
  rationale: 该词为γίνομαι的将来时中间形式，在此表达将来发生之事，不含“必须”的情态。
- source_word: ἐν καιρῷ αὐτῶν
  choice: 按其时候
  rationale: καιρός指适宜、指定或相应的时机；αὐτῶν保留“这些事各有其时候”的指向，不将其过度具体化。
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: 在末后的日子
  rationale: 直译末世性时间短语，同时避免加入特定宗派对“末日”的解释。
theological_decisions:
- issue: “末后的日子”的末世含义
  choice: 保留原文时间表达“在末后的日子”
  alternative: 在末日／在末世
  rationale: 原文为复数“日子”，宜保留其措辞和开放性，不把它限定为单一末日或某套末世时间表。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“按其时候”比“在它们的时候”自然，并保留原文所表达的相应时机。
