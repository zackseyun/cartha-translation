revisions:
- from: 我又看见，那三只鹿变成了三只羊羔；它们向主呼求，主就领它们出来，到了一个草木繁茂、水源充足的地方，又领它们出黑暗，入光明。
  to: 我又看见，那三只鹿变成了三只羊羔；它们向主呼求，主就把它们带到一个草木繁茂、水源充足的地方，又把它们从黑暗带入光明。
  rationale: 仅调整两个带领动作的汉语句法和方向表达，使其更准确对应“带出/带到……之地”及“从黑暗到光明”，不改变异象意象、神学开放性或叙事语气。原始材料所示的校勘标号未附异文内容，故不设置脚注。
