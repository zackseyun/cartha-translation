source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἑώρων ὅτι τρεῖς¹⁴ ἔλαφοι τρεῖς ἀμνοὶ ἐγίνοντο καὶ ἐβόησαν πρὸς Κύριον καὶ ἐξήγαγε αὐτοὺς Κύριος¹⁵ εἰς τόπον εὐθαλῆ καὶ ἔνυδρον, καὶ ἤγαγε¹⁶ αὐτοὺς ἐκ σκότους εἰς φῶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/003.yaml
  text: And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord brought them out to a flourishing and well-watered place, and brought them from darkness into light.
translation:
  language: zh_hans
  text: 我又看见，那三只鹿变成了三只羊羔；它们向主呼求，主就把它们带到一个草木繁茂、水源充足的地方，又把它们从黑暗带入光明。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: 鹿
  rationale: 该词泛指鹿；中文用“鹿”自然准确，不额外限定品种。
- source_word: ἀμνοὶ
  choice: 羊羔
  rationale: 准确表达幼羊，并保留原文异象中从鹿变为羊羔的意象。
- source_word: ἐβόησαν πρὸς Κύριον
  choice: 向主呼求
  rationale: βοάω 在此表示大声求告；“呼求”兼顾动作强度和宗教语境。
- source_word: ἐξήγαγε
  choice: 领……出来
  rationale: 保留 ἐξάγω 所含的“带领出来”方向性，也符合现代汉语表达。
- source_word: εὐθαλῆ καὶ ἔνυδρον
  choice: 草木繁茂、水源充足
  rationale: εὐθαλής 指繁盛茂盛，ἔνυδρος 指有水或水源丰足；如此翻译清楚呈现地点的丰饶景象。
- source_word: ἐκ σκότους εἰς φῶς
  choice: 出黑暗，入光明
  rationale: 保持原文由“从”到“进入”的对称方向，并采用凝练庄重的现代中文。
theological_decisions:
- issue: 异象中的鹿和羊羔是否应作解释性翻译
  choice: 保留动物意象，不在正文解释其象征对象
  alternative: 把动物直接译为其所象征的人群或群体
  rationale: 原文本身只叙述异象，未在本句明说象征意义；直保意象可避免引入特定释经立场。
- issue: “黑暗”与“光明”是否应明确为属灵状态
  choice: 保留“黑暗”和“光明”的开放性隐喻
  alternative: 译作“属灵的黑暗”和“救恩的光明”
  rationale: 原文既可呈现异象中的空间转移，也可承载神学象征；不增补限定语可保存这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我又看见”承接异象叙述；分号区分所见变化与随后发生的呼求、拯救。原文抄本校勘标号不作为读者脚注移入正文，因为所给材料未提供相应异文内容。
