source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὑμεῖς οὖν, τέκνα μου, φυλάξατε τὰς ἐντολὰς Κυρίου, καὶ τιμᾶτε³⁸ τὸν *Λευὶ καὶ τὸν Ἰούδαν³⁹. ὅτι *ἐκ τοῦ σπέρματος⁴⁰ αὐτῶν ἀνατελεῖ ὑμῖν⁴¹ [ὁ ἀμνὸς τοῦ Θεοῦ, ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου]⁴², σώζων [πάντα τὰ ἔθνη καὶ]⁴⁸ τὸν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/011.yaml
  text: Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you [the lamb of God, who takes away the sin of the world,] saving [all the nations and] Israel.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要谨守主的诫命，并尊敬利未和犹大；因为必有一位从他们的后裔中为你们兴起，[那位上帝的羔羊，除去世人的罪][a]，拯救[万国和][b]以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位上帝的羔羊，除去世人的罪”在部分文本见证中缺失，因此以方括号标出。
    reason: 对应原始资料中以方括号标出的首处文本变异。
  - marker: b
    text: “万国和”在部分文本见证中缺失，因此以方括号标出。
    reason: 对应原始资料中以方括号标出的第二处文本变异。
lexical_decisions:
- source_word: φυλάξατε
  choice: 谨守
  rationale: 表达持续留意并遵行诫命之意，符合现代中文经文语体。
- source_word: τιμᾶτε
  choice: 尊重
  rationale: 保留“给予尊荣、看重”的基本意义，而不扩展为敬拜或绝对顺服。
- source_word: σπέρματος
  choice: 后裔
  rationale: 此处指由利未和犹大而出的世系或子孙；“后裔”比字面的“种子”自然。
- source_word: ἀνατελεῖ
  choice: 兴起
  rationale: 该动词可描写升起、萌发或出现；“兴起”保留其形象性，并适合人物的出现。
- source_word: ἀμνὸς τοῦ Θεοῦ
  choice: 上帝的羔羊
  rationale: 直译这一称号，保留其祭牲意象及与约翰传统的互文联系。
- source_word: αἴρων
  choice: 除去
  rationale: 可表示拿起、承担或除去；在此固定表达中译为“除去”，但不在正文中进一步限定其机制。
- source_word: σώζων
  choice: 拯救
  rationale: 保留分词与前述人物的关联，表达他所施行的拯救。
- source_word: τὰ ἔθνη
  choice: 万族
  rationale: 既可指列国，也可指外邦人；“万族”保持群体广度，避免过早限定为政治国家或宗教身份。
theological_decisions:
- issue: “他们的后裔”与单数救主形象之间的关系
  choice: 译作“从他们的后裔中，必有一位……兴起”
  alternative: “从他们的后裔中，要为你们升起上帝的羔羊”
  rationale: 希腊文以利未和犹大二者的复数“他们”指明来源，又以单数“羔羊”和“拯救”分词描写一位人物；中文补出“一位”以使句法自然，但不解释双重世系如何落实。
- issue: 方括号所示文本层次
  choice: 正文保留方括号，并以脚注说明文本见证差异
  alternative: 无标记地纳入正文或直接删除
  rationale: 这些词句在版本传统中具有文本批判上的不确定性，必须显明而不可静默定夺。
- issue: “除去世人的罪”的救赎含义
  choice: 按原文译出，不解释为承担、赦免或消灭中的某一特定理论
  alternative: 译作“担当世人的罪”
  rationale: αἴρων 本身可承载不同语义侧重；保持原句张力，避免导入特定赎罪论。
- issue: 拯救对象的范围
  choice: 译作“[万族和]以色列”
  alternative: “[所有外邦人和]以色列”
  rationale: τὰ ἔθνη 可理解为列国、万民或外邦人；“万族”保留广度，而方括号呈现该短语的见证不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的孩子们”保留遗训体的亲密称呼；“谨守主的诫命”“从……后裔中兴起”保持经文语感而不过度古雅。方括号直接保留文本不确定性，脚注集中说明。
