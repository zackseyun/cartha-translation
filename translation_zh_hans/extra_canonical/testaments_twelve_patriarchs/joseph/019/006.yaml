  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/006.yaml
  text: And from the fourth bull its horns went up as far as heaven and became like a wall of the flocks, and in the midst of the two horns another horn sprouted.
translation:
  language: zh_hans
  text: 第四头公牛的角升到天上，变得如同羊群的墙；在两只角中间，萌生出另一只角。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ τετάρτου βοὸς
  choice: 第四头公牛
  rationale: 按属格结构表达来源，同时用“头”作现代汉语中大型牲畜的自然量词。
- source_word: ἀνέβησαν τὰ κέρατα μέχρι τοῦ οὐρανοῦ
  choice: 角直升到天上
  rationale: 保留复数动词所指的双角及其向上延伸至天的异象画面；汉语名词无需显式标复数。
- source_word: ὡς τεῖχος τῶν ποιμνῶν
  choice: 成了羊群的墙
  rationale: 贴近属格原文，不擅自明确为“保护羊群的墙”，从而保留其关系上的含混。
- source_word: ἐν μέσῳ τῶν δύο κεράτων
  choice: 在两角中间
  rationale: 准确传达“在两个角的中央”，采用简洁自然的现代汉语。
- source_word: ἐξεβλάστησε
  choice: 萌生出
  rationale: 保留原词带有植物发芽、生长的形象，也适合描述异象中角的出现。
- source_word: ἄλλο κέρας
  choice: 另一只角
  rationale: “另一”体现相对于原有两角新增一角；“只”符合现代汉语对角的常用量词搭配。
theological_decisions:
- issue: “羊群的墙”所表达的功能
  choice: 羊群的墙
  alternative: 保护羊群的墙／羊群周围的墙
  rationale: 原文仅为τεῖχος τῶν ποιμνῶν，没有明说保护功能或空间位置，因此不在正文中补足解释。
- issue: 新增之角的象征身份
  choice: 保持异象意象，不作身份解释
  alternative: 在译文中指明其代表的人物或权势
  rationale: 本节原文只叙述角的萌生，未直接解释象征对象；译文不应导入特定神学认定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式紧凑，保留“公牛、角、天、墙、羊群、萌生”等异象核心意象，并避免用解释性措辞消除原文的象征张力。
