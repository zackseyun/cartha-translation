source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ εἶδον²⁶ *ὅτι [ἐκ τοῦ Ἰούδα ἐγεννήθη] †παρθένος, [ἔχουσα στολὴν βυσσίνην, καὶ ἐξ αὐτῆς] ἐγεννήθη ἀμνὸς [ἄμωμος]²⁷ *καὶ ἦν²⁸ ἐξ ἀριστερῶν αὐτοῦ ὡς λέων· καὶ πάντα τὰ θηρία ὥρμων³⁰ *κατ᾽ αὐτοῦ³¹ καὶ ἐνίκησεν αὐτὰ ὁ ἀμνός, καὶ ἀπώλεσεν *αὐτὰ εἰς καταπάτημα³².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/008.yaml
  text: And I saw that [from Judah was born] a virgin, [wearing a robe of fine linen, and from her] a [blameless] lamb was born; and on his left there was, as it were, a lion; and all the beasts were rushing against him, and the lamb overcame them and destroyed them for trampling.
translation:
  language: zh_hans
  text: 我看见，[有一位童女从犹大而生]，[她身穿细麻衣；又有]一只[无瑕疵的]羔羊[从她而生]。在羔羊的左边，仿佛有一头狮子；所有野兽都向他猛冲过来，羔羊胜过它们，并消灭它们，使它们成为践踏之物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节方括号内的词句在希腊文本传承中存疑；“向他”所指的对象未能完全确定。末句直译近于“消灭它们，使之成为践踏之物”。
    reason: 说明方括号的校勘性质，并保留αὐτοῦ的指涉含混及εἰς καταπάτημα未指明践踏者的结果性语义。
lexical_decisions:
- source_word: παρθένος
  choice: 童女
  rationale: 既保留“未婚年轻女子／处女”的语义范围，又采用庄重而易懂的宗教文献用语，避免在正文中过度阐明其生理含义。
- source_word: στολὴν βυσσίνην
  choice: 细麻衣
  rationale: βύσσινος指优质细麻织物；“细麻衣”自然、简洁，也保留服饰的尊贵色彩。
- source_word: ἀμνός
  choice: 羔羊
  rationale: 准确对应幼羊，并保留该意象可能具有的象征意味，不在译文中加以神学解释。
- source_word: ὥρμων κατ᾽ αὐτοῦ
  choice: 都向羔羊猛冲过来
  rationale: ὁρμάω表达猛烈冲击；代词所指按最近且合乎叙事的阳性单数“羔羊”处理。
- source_word: εἰς καταπάτημα
  choice: 使它们遭人践踏
  rationale: 保留“成为践踏之物／落到被践踏的地步”的结果含义，不改译为羔羊亲自把它们踏在脚下。
theological_decisions:
- issue: 童女、羔羊和狮子的象征身份
  choice: 只翻译意象，不点明任何具体人物或弥赛亚解释
  alternative: 在正文中把这些意象明确解释为某些救赎历史人物
  rationale: 原文在本节中保持异象式表达；译文不应导入特定传统的身份认定。
- issue: 狮子与羔羊的关系
  choice: 译作“在羔羊的左边，仿佛有一头狮子”
  alternative: 译作“羔羊左边的部分仿佛狮子”或把狮子视为冲出的主体
  rationale: 原文仅说“在他的左边……如狮子”，存在句法和意象上的含混；此译法保留狮子作为另一个显现形象，同时不让它承接随后属于“所有野兽”的冲击动作。
- issue: 方括号内材料的文本地位
  choice: 完整保留并以方括号标示
  alternative: 无标记地纳入正文或直接删去
  rationale: 所据版本将这些词句标为文本传承上存疑或补入的材料；公开标示可避免把不确定读法伪装成无争议正文。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“猛冲过来”传达异象场面的力度；“遭人践踏”保持末句结果性表达。正文保留原版本的方括号，以显明文本不确定性。
