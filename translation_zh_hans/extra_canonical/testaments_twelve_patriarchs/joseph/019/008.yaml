  to: 我看见，[有一位童女从犹大而生]，[她身穿细麻衣；又有]一只[无瑕疵的]羔羊[从她而生]。在羔羊的左边，仿佛有一头狮子；所有野兽都向他猛冲过来，羔羊胜过它们，并消灭它们，使它们成为践踏之物。[a]
