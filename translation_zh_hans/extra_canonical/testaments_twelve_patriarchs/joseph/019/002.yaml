base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/002.yaml
  text: Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also.
translation:
  language: zh_hans
  text: 十二只鹿在一处吃草；九只分散到全地，三只也同样分散了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: 鹿
  rationale: 对应原文的鹿科动物泛称；上下文没有充分依据限定为公鹿或母鹿。
- source_word: ἐνέμοντο
  choice: 吃草
  rationale: 该中间语态动词在此表示动物觅食、吃草；译法自然且符合场景。
- source_word: ἐν τόπῳ
  choice: 在一处
  rationale: 保留原文地点表达的非特指性，不增添“同一个”等原文未明说的强调。
- source_word: διεσπάρησαν
  choice: 分散
  rationale: 传达被散布、散居各处之意，同时不强行补出施事者。
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: 到全地
  rationale: 既保留范围广及方向性，也不把 γῆν 过度具体化为某一国家或土地。
- source_word: ὁμοίως δὲ καὶ οἱ τρεῖς
  choice: 三只也同样分散了
  rationale: 中文补出由前句承接的谓语“分散了”，清楚表达省略结构而不增加新信息。
