  - severity: low
    issue: “繁衍增多”对ηὐξάνοντο略作了具体化。
    rationale: ηὐξάνοντο可指增长、增多；在此异象语境中，“逐渐增多”较不限定增长方式，并保留未完成体所示的持续发展。
