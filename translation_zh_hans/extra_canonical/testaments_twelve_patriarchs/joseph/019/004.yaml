  rationale: 修订只补足“变得像”的动态比拟，并以较宽泛的“逐渐增多”对应持续性的增长；其余动物形象、数字、复数“羊群”及象征含混均予保留。原文版面所示的¹⁷属于所引希腊文版本的校勘标记，但题供材料未提供其注释内容，故不臆造中文脚注或锚点。
