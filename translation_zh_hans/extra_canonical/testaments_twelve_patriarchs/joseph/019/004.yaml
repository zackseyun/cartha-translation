  text: Καὶ ἐκεῖ ἐβόησαν πρὸς Κύριον μέχρι οὐ συνήχθησαν *πρὸς αὐτοὺς¹⁷ οἱ ἐννέα ἔλαφοι καὶ ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα, καὶ μετ’ ὀλίγον χρόνον ηὐξάνοντο καὶ ἐγίνοντο ποίμνια πολλά.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/004.yaml
  text: And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks.
translation:
  language: zh_hans
  text: 他们在那里向主呼求，直到那九只鹿聚集到他们那里；他们自己也变得像十二只羊一样。过了不久，他们逐渐增多，成了许多羊群。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησαν πρὸς Κύριον
  choice: 向主呼求
  rationale: 既保留向主大声求告的宗教语义，也符合现代汉语经文体表达。
- source_word: οἱ ἐννέα ἔλαφοι
  choice: 那九只鹿
  rationale: 直译动物意象，不将异象中的鹿解释为具体人物或支派。
- source_word: ὡς δώδεκα πρόβατα
  choice: 如同十二只羊
  rationale: 保留ὡς的比拟含义以及“十二”的象征张力，不擅自解释。
- source_word: ηὐξάνοντο
  choice: 繁衍增多
  rationale: 该词在羊群语境中表示数量增长；此译法自然呈现其扩增之意。
- source_word: ποίμνια πολλά
  choice: 许多羊群
  rationale: 保留复数ποίμνια，避免弱化为单一的“大群羊”。
theological_decisions:
- issue: 异象中鹿、羊及十二这一数字的所指
  choice: 保留原有动物形象和数字，不作身份释义
  alternative: 将其明确解释为以色列各支派或某些人物
  rationale: 本节自身只陈述异象，明确所指会消除原文保留的象征性与解释空间。
- issue: 十二只羊的形成方式
  choice: 译作“他们就如同十二只羊”
  alternative: 译作“他们变成了十二只羊”
  rationale: 原文有ὡς，宜保留“如同”的比拟色彩；同时ἐγίνοντο仍表达状态转变。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留异象叙事的简洁节奏与象征含混，不添加宗派性解释。
