base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/005.yaml
  text: And after these things I saw, and behold, twelve bulls suckling one heifer, and it made a sea of milk, and the twelve flocks and innumerable flocks drank from it.
translation:
  language: zh_hans
  text: 这些事以后，我看见：看哪，十二头公牛正在吮吸一头小母牛的奶；使奶成了一片海。十二群羊和数不清的羊群都从其中喝奶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώδεκα βόες
  choice: 十二头公牛
  rationale: βόες 本可泛指牛，但此处与阴性的 δάμαλιν 对举，译作“公牛”可自然呈现性别对比。
- source_word: θηλάζοντες
  choice: 正在吃……的奶
  rationale: 表达从母兽乳房吸食乳汁；现代汉语中“吃奶”比生硬的“吮吸”更自然，也保留其主动分词的持续意味。
- source_word: μίαν δάμαλιν
  choice: 一头小母牛
  rationale: δάμαλις 指年轻母牛；“小母牛”简明保留年龄与性别信息。
- source_word: γάλακτος θάλασσαν
  choice: 一片奶海
  rationale: 直译其异象性比喻，同时用量词“片”使现代汉语流畅。
- source_word: αἱ δώδεκα ποίμναι καὶ ἀνηρίθμητα ποίμνια
  choice: 十二群羊和数不清的羊群
  rationale: ποίμνη/ποίμνιον 可泛指畜群，但通常指羊群；上下文没有指定其他牲畜，采用常用义，同时保留两组群体的对照。
theological_decisions:
- issue: 造成“奶海”的主语
  choice: 译作“它形成了一片奶海”，保留中性代词式的含混
  alternative: 译作“她流出奶来，形成一片奶海”或“从她的奶形成一片海”
  rationale: 现存希腊文本在此有残缺和异文迹象，且 ἐποίει 的主语不够明确；不宜擅自确定是小母牛主动流奶，故按审校层所反映的非人称/使成表达保留模糊性。
- issue: 异象意象的解释
  choice: 不在正文中把公牛、母牛或羊群解释为特定人物或群体
  alternative: 根据后续传统直接加入象征身份
  rationale: 本节只叙述异象，正文应保存意象及其张力，不导入宗派性或私人解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这些事以后，我又看见：看哪”保留异象叙事的递进和提示语；后半句避免过度补足残缺希腊文所未明确说明的来源关系。
