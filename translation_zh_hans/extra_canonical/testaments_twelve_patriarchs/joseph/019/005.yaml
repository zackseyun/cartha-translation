- from: 这些事以后，我又看见：看哪，十二头公牛正在吃一头小母牛的奶；它形成了一片奶海。十二群羊和数不清的羊群都从其中喝奶。
  to: 这些事以后，我看见：看哪，十二头公牛正在吮吸一头小母牛的奶；使奶成了一片海。十二群羊和数不清的羊群都从其中喝奶。
  rationale: 删除无对应的“又”；将“正在吃……的奶”调整为“正在吮吸……的奶”，以更贴近 θηλάζοντες。将残缺且主语不明的使成短语译为“使奶成了一片海”，不指定是小母牛、乳汁或其他意象成分造成奶海，同时避免汉语代词的误指。
