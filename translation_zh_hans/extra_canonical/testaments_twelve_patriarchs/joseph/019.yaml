  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019.yaml
  text: 'And he gave me beauty beyond the handsome men of Israel[a], and preserved me until old age in strength and in beauty; for I was like Jacob in all things.


    Now listen, my children, also concerning the dream that I saw.


    2. Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also. So hear the dream that I saw. 3. And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord led them out into a flourishing and well-watered place, and brought them from darkness into light. 4. And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks. 5. And after these things I saw, and behold, twelve bulls suckling one heifer, and from her there came a sea of milk, and the twelve flocks and innumerable flocks drank from it. 6. And from the fourth bull the horns went up as far as heaven and became like a wall for the flocks, and between the two horns another horn sprang up. 7. And I saw a calf that encircled them twelve times, and it became for the bulls wholly a help.


    8. And I saw that a virgin was born, and from her was born a lamb, and on his left there rushed forth something like a lion; and all the beasts rushed against him, but the lamb overcame them and destroyed them and trampled them down. 9. And the angels and men and all the earth rejoiced over him. 10. And these things will happen in their season in the last days.


    11. Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you the salvation of Israel. 12. For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will come to an end, like a watchman''s hut after the summer[d][c][b], vanishing away.'
translation:
  language: zh_hans
  text: '他又赐给我俊美，使我胜过以色列中俊美的人；又保守我直到年老，仍有力量，仍然俊美；因为我在一切事上都像雅各。


    19 我的孩子们，现在也要听我所见的梦。


    2 十二只鹿在一处吃草，其中九只分散到全地，另外三只也是如此。3 我看见那三只鹿变成了三只羊羔；它们向主呼求，主便领它们到一处草木繁茂、水源充足的地方，带它们出黑暗、入光明。4 它们在那里向主呼求，直到那九只鹿聚集到它们那里；它们就成了十二只绵羊。过了不久，它们繁衍增多，成了许多羊群。


    5 此后我又观看，看哪，有十二头公牛在吮吸一头母牛的奶；从她那里涌出一片奶海，十二群羊和无数羊群都从中饮用。6 第四头公牛的角高达天空，成了羊群的围墙；在两角之间又长出一只角来。7 我又看见一头牛犊绕着它们十二圈，完全成了众公牛的帮助。


    8 我又看见一个童女出生[a]，她生下一只羊羔[b]；在他的左边有如同狮子的一物[c]。所有野兽都冲向他，羊羔却胜过它们，将它们消灭，践踏在脚下。9 众天使、世人和全地都因他欢喜。10 这些事将在它们的时期发生，也就是在末后的日子。


    11 所以，我的孩子们，你们要遵守主的诫命，尊重利未和犹大；因为必有以色列的拯救从他们的后裔中为你们兴起。12 他的国必是永远的国，绝不消逝；但我的国在你们中间必走到尽头，就像夏天过去后田间看守人的棚子，渐渐消失[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些希腊文本更明确地作“从犹大生出一个童女”；另一个文本形式则作“我看见两角之间有一个童女”。
    reason: textual_variant
  - marker: b
    text: 有些文本在“羊羔”前加上“无瑕疵的”；另有一种较晚色彩明显的读法加入类似“上帝的羔羊，除去世人罪孽的”这句话。
    reason: textual_variant
  - marker: c
    text: “在他的左边有如同狮子的一物”这句话的文本和句法都很难确定；另一个见证对场景的表述不同，但同样描写野兽敌对并攻击羊羔。
    reason: alternative_reading
  - marker: d
    text: “夏天过去后田间看守人的棚子”是夏季在田间或果园临时搭建的守望棚；季节过去后，棚子便被弃置，逐渐荒废消失。
    reason: cultural_note
lexical_decisions:
- source_word: ὡραιότητα
  choice: 俊美
  rationale: 指外貌之美；“俊美”自然适用于约瑟，并与后文“仍然俊美”呼应。
- source_word: ἐφύλαξέ
  choice: 保守
  rationale: 表达上帝持续护佑约瑟直到年老，兼具保护与保存之意。
- source_word: ἐνυπνίων
  choice: 梦
  rationale: 此处引出象征性的梦境；“梦”简明自然，不额外限定其性质。
- source_word: ἔλαφοι
  choice: 鹿
  rationale: 保留鹿科动物的宽泛称呼，不无根据地限定为雄鹿。
- source_word: ἀμνοί / ἀμνός
  choice: 羊羔
  rationale: 保留从鹿转为幼羊的牧养及可能的献祭意象。
- source_word: τόπον εὐθαλῆ καὶ ἔνυδρον
  choice: 一处草木繁茂、水源充足的地方
  rationale: 分别呈现εὐθαλής的繁茂和ἔνυδρος的多水，中文清楚自然。
- source_word: ἐκ σκότους εἰς φῶς
  choice: 出黑暗、入光明
  rationale: 忠实保留原文简洁鲜明的拯救意象。
- source_word: πρόβατα / ποίμνια
  choice: 绵羊 / 羊群
  rationale: 保持个体羊与群体羊群的区别，呈现梦中由十二只到许多群的推进。
- source_word: βόες
  choice: 公牛
  rationale: 上下文提到角，并与母牛相对；“公牛”比泛称“牛”更清晰。
- source_word: θηλάζοντες
  choice: 吮吸……的奶
  rationale: 直接表达这些公牛从母牛吃奶的异常梦象。
- source_word: δάμαλιν
  choice: 母牛
  rationale: δάμαλις可指小母牛；现代中文正文用“母牛”较自然，也足以维持性别对照。
- source_word: ὀπωροφυλάκιον
  choice: 夏收之后田间看守人的棚子
  rationale: 保留田间临时守望棚的意象，并以“夏收之后”表达收成过后荒弃消失的语境。
theological_decisions:
- issue: 第8、11节具有明显基督教措辞的扩展异文
  choice: 正文采用较短、较不明确的读法，保留童女、羊羔和从利未与犹大后裔兴起拯救的象征。
  alternative: “从犹大生出一个童女……她生下无瑕疵的羊羔”；以及“上帝的羔羊，除去世人罪孽的”。
  rationale: 所给希腊文本以方括号标出这些扩展，见证间差异显著。正文不把较晚、较明确的基督论措辞默认为原文，而在脚注交代。
- issue: 利未与犹大所出的拯救者及其永恒国度的身份
  choice: 译作“以色列的拯救”和“他的国”，不进一步指明身份。
  alternative: 明确译成某位弥赛亚人物，或解释为祭司职分与王权共同带来的群体性拯救。
  rationale: 原文既以单数“他的国”指向一位统治者，又在关键称号处存在文本差异；译文保留这种先知性张力。
- issue: 第10节αὐτῶν所指
  choice: 译为“它们的时期”，并以“就是末后的日子”保留原句结构。
  alternative: 解释为“这些事命定的时期”或“他们的时代”。
  rationale: 代词所指并不完全明确，不在正文中强行消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。动物和牧养意象尽量直译，同时避免古奥词语。章节首句承接第18章第4节；正文标出第19章及其节号。所有脚注标记均置于相关正文之后。
