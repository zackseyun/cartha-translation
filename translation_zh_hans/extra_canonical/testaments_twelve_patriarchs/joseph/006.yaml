  text: 1 And after this she sent me food mixed with sorcery[a]. 2 But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me, together with the dish, a sword; and I understood that it was a scheme to lead me astray. 3 So after he had gone out, I ate neither that food nor any of her other foods, but wept without tasting them. 4 Then after one day she came to me, and when she recognized the food, she said to me, “Why is it that you did not eat the food?” 5 And I said to her, “Because you filled it with deadly sorcery. And how did you say, ‘I do not draw near to idols, but to the Lord alone’? 6 Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and for this reason I kept it as evidence against you, to expose you, in hope that perhaps, when you saw it[b][a], you might repent.”
translation:
  language: zh_hans
  text: '《约瑟遗训》第6章


    1 此后，她送给我食物，是掺有巫术的。2 那个送食物来的宦官来到时，我抬头，看见一个令人畏惧的人，把盘子和一把刀一同递给我；我便明白，这是要使我迷失的诡术[a]。3 他出去以后，我哭了，没有尝那食物，也没有尝她的其他食物。4 过了一天，她来到我这里，认出那食物，就对我说：“你为什么没有吃这食物？”


    5 我对她说：“因为你把致死的巫术掺在其中。你怎么说：‘我不亲近偶像，只亲近主’呢？6 所以你现在要知道，我父亲的上帝借着他的天使，把你的邪恶揭示给了我；我因此保留了这食物，为要指证你，希望你看见以后，或许会悔改。”


    7 “你还要知道，不敬虔之人的邪恶不能胜过那些持守贞洁、敬奉上帝的人。看哪，我从这食物中取来，当着你的面吃。”[c]说了这话，我又说：“我列祖的上帝和亚伯拉罕的天使必与我同在。”于是我吃了。8 她看见这事，就俯伏在我脚前哭泣；我扶她起来，劝诫她。9 她便同意不再做这种不敬虔的事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诡术”也可译作“诡计”或“魔法机关”。这里的希腊词可指刻意设计的手段，也可带有施行魔法的意味。持刀之人的身份，原文没有说明；他可能是异象中的人物、象征性的警示，或与所施巫术有关。
    reason: 保留περιέργεια的词义幅度，并避免擅自确定φοβερὸν ἄνδρα的身份。
  - marker: c
    text: 本句的希腊文本十分简略，直译近于“看哪，从其中取来，在你面前吃着”。译文补出“我从这食物中取来”，使动作关系在汉语中完整，但没有改变约瑟当面食用这食物的意思。
    reason: 说明第7节省略式句法中的必要补足。
lexical_decisions:
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: 掺了巫术之物的
  rationale: πεφυρμένον表示混入、搀和；γοητεία指巫术或魔法操作。译文既保留食物被掺入某物的具体意象，也不把它仅仅解释为普通药物。
- source_word: φοβερὸν ἄνδρα
  choice: 一个令人畏惧的人
  rationale: φοβερός可指可怕、令人敬畏；上下文带有危险警示，但并未说明此人的身份，因此采用不作身份判断的表达。
- source_word: τρύβλιον
  choice: 盘子
  rationale: 指盛放食物的器皿；“盘子”符合现代汉语叙事，也不对器皿形状作过多限定。
- source_word: μάχαιρα
  choice: 刀
  rationale: μάχαιρα可指刀、匕首或短剑。它与盛食物的盘子一同递来，译作“刀”保留词义范围，避免无根据地特定为长剑。
- source_word: περιέργεια
  choice: 邪术
  rationale: 该词可表示多事的活动、诡计或魔法操作；此处紧接掺入食物的γοητεία，并以诱使约瑟迷失为目的，故译为“邪术”，脚注保留“诡计”等可能。
- source_word: εἰς ἀποπλάνησίν μου
  choice: 要诱使我迷失正道
  rationale: ἀποπλάνησις表示引离、迷惑；此处兼有道德与宗教层面的误导，译文不将其窄化为性诱惑。
- source_word: γοητείας θανάτου
  choice: 致命的巫术
  rationale: θανάτου可表达性质或结果；“致命的”自然传达可能导致死亡的巫术，同时避免生硬直译“死亡的巫术”。
- source_word: ἐν σωφροσύνῃ θεοσεβούντων
  choice: 持守贞洁、敬奉上帝的人
  rationale: σωφροσύνη在本遗训的试探语境中突出节制与性方面的贞洁；“持守贞洁”较好体现此处伦理重点，θεοσεβούντων则明确译为“敬奉上帝”。
- source_word: ὁ ἄγγελος Ἀβραάμ
  choice: 亚伯拉罕的天使
  rationale: 依照现存希腊文的简洁属格直译，不擅自改成“向亚伯拉罕显现的天使”或“守护亚伯拉罕的天使”。
- source_word: συνεθέτό μου
  choice: 答应我
  rationale: συντίθεμαι在此搭配不定式，表示同意或作出约定；“答应我”符合现代汉语叙事。
theological_decisions:
- issue: 持刀的“令人畏惧的人”的身份
  choice: 保留为未具名、未定性的所见人物
  alternative: 明确译为天使、邪灵，或纯粹象征性的异象
  rationale: 希腊文只说约瑟看见一个令人畏惧的人，并未认定其身份；译文保留异象、象征或超自然警示等可能。
- issue: περιέργεια与巫术之间的关系
  choice: 正文译作“邪术”，脚注说明也可理解为诡计或魔法机关
  alternative: 仅译作“诡计”
  rationale: 前后文反复使用γοητεία，支持魔法语境；但περιέργεια本身语义较宽，故不应完全排除计谋义。
- issue: “我列祖的上帝和亚伯拉罕的天使”中的并列关系
  choice: 按希腊文保留“和”所形成的并列措辞
  alternative: 把天使解释为上帝的显现、亚伯拉罕的守护天使，或改写为从属关系
  rationale: 原文的神学关系并未展开；翻译不替文本解决上帝与“亚伯拉罕的天使”之间的具体关系。
- issue: μετανοήσεις的伦理含义
  choice: 悔改
  alternative: 改变心意、回心转意
  rationale: 上下文针对具体的恶行和不敬虔行为，“悔改”能准确表达从罪行中转回的要求。
- issue: σωφροσύνη在本章中的含义
  choice: 持守贞洁
  alternative: 自制、端正、节制
  rationale: 本遗训围绕约瑟抵挡妇人的诱惑展开，贞洁是主要语境；同时正文的“持守”保留持续自制的意味。
translation_notes:
  register: 采用现代标准普通话的庄重叙事体。对话保持直接有力，但避免文言化；“主”“上帝”“悔改”“不敬虔”等宗教词汇沿用现代汉语读者熟悉的表达。第7节原文句法突兀，正文以最少补词使其可读，并用脚注公开文本困难。
