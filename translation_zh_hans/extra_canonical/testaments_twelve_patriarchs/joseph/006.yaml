revisions:
- from: '《约瑟遗训》第6章


    1 此后，她派人给我送来掺了巫术之物的食物。2 送食物的宦官来到时，我抬头一看，只见一个令人畏惧的人把盘子递给我，同时还递来一把刀；我便明白，这是要诱使我迷失正道的邪术[a]。3 那宦官出去以后，我哭了；那食物和她送来的其他食物，我一样也没有尝。4 过了一天，她来到我这里，看见那食物还在，就对我说：“你为什么没有吃这食物？”


    5 我对她说：“因为你在里面放满了致命的巫术。你怎么还说：‘我不亲近偶像，只亲近主’呢？6 现在你要知道，我父亲的上帝借着他的天使，把你的恶行揭示给了我。因此，我把这食物留了下来，作为指证你的证据[b]，希望你看见以后，或许会悔改。”


    7 “你还要明白：不敬虔之人的恶行，绝不能胜过那些持守贞洁、敬奉上帝的人。看哪，我要从这食物中取一些，当着你的面吃。”[c]说完这话，我又说道：“我列祖的上帝和亚伯拉罕的天使必与我同在。”于是我吃了。8 她看见这事，就俯伏在我脚前哭泣。我扶她起来，劝诫了她。9 她便答应我，不再做这种不敬虔的事。'
