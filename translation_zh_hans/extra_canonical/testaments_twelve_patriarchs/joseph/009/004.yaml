  source_fidelity: 译文总体忠实呈现了让步（“虽有病”）、反复发生（“多少次”）、向下而来、非正常时刻、听见祷告的声音，以及约瑟领会其叹息并保持沉默。惟“下来找我”将πρός με所表达的“到我这里/向我而来”具体化为“找我”，略增原文未明说的目的性。
