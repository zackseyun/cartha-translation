  terminology: “祷告”“叹息”“默不作声”均适合文体和语义。στεναγμούς以“叹息”比“呻吟”更稳妥：该词可指叹息、呻吟，且病情不足以决定其为身体呻吟；译为“叹息”保留叙事含蓄。
