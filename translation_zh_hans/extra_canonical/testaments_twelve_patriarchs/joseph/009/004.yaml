  text: Ποσάκις²² καίπερ ἀσθενοῦσα κατῄει ⌜πρός με⌝ ἐν ἀωρίᾳ²³, καὶ ἤκουσε²⁴ τῆς φωνῆς μου προσευχομένου²⁵, *καὶ ἐγὼ συνίων²⁶ *τοὺς στεναγμούς²⁷ ἐσιώπων²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/004.yaml
  text: How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.
translation:
  language: zh_hans
  text: 她虽有病，却多少次在不合时宜的时候下来到我这里，听见我祷告的声音；我明白她的叹息，便默不作声。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποσάκις
  choice: 多少次
  rationale: 保留感叹性的反复意味，比单纯的“常常”更贴近原文语气。
- source_word: καίπερ ἀσθενοῦσα
  choice: 虽有病
  rationale: 自然表达让步分词结构，同时不增加病情程度。
- source_word: κατῄει πρὸς με
  choice: 下来找我
  rationale: κατῄει有“下来”之义；πρός με表示朝向说话者，译作“找我”符合现代汉语语境。
- source_word: ἐν ἀωρίᾳ
  choice: 在不合时宜的时辰
  rationale: 保留ἀωρία所含“不适当、非正常时刻”的含义，不擅自具体化为夜间或深夜。
- source_word: τῆς φωνῆς μου προσευχομένου
  choice: 我祷告的声音
  rationale: 以自然汉语呈现属格结构，明确声音是在祷告时发出的。
- source_word: συνίων τοὺς στεναγμούς
  choice: 明白她的呻吟
  rationale: συνίων指理解、领会；στεναγμούς可指叹息或呻吟，结合其患病及上下文行为，采用“呻吟”，但不进一步解释其动机。
- source_word: ἐσιώπων
  choice: 默不作声
  rationale: 准确表达持续或当时保持沉默的行为。
theological_decisions:
- issue: 约瑟对女子“呻吟”的理解内容
  choice: 仅译为“明白她的呻吟”，不说明他理解了何种意图
  alternative: “明白她叹息中的意思”或明确说他知道她的欲望
  rationale: 原文只说约瑟领会其στεναγμοί，并未明说其具体内容；保留叙事中的含蓄和张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式尽量贴近希腊文的递进结构，同时避免生硬直译。“不合时宜的时辰”有意保留原文时间表述的模糊性。
