base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/003.yaml
  text: But if one lives in self-control and also desires glory, and the Most High knows that it is beneficial, he grants these things also to him, as also to me.
translation:
  language: zh_hans
  text: 但若有人过着节制的生活，也渴望荣耀，而至高者知道这对他有益，就也把这些赐给他，正如赐给我一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: 节制
  rationale: 指自我约束、贞洁而审慎的生活品格；“节制”简洁自然，并与本书语境相合。
- source_word: διάγων
  choice: 持守
  rationale: 表达持续以某种方式生活，而非一次性的行为；与“节制”搭配较符合现代汉语。
- source_word: θέλει
  choice: 渴望
  rationale: 保留“想要、愿求”的主动含义，避免按较早英文修订误解为“合宜”。
- source_word: δόξαν
  choice: 荣耀
  rationale: 直译其荣誉、尊荣之义，同时保留宗教文本中的庄重语域。
- source_word: συμφέρει
  choice: 有益
  rationale: 准确表达“有利、有好处”，不缩窄为“合宜”。
- source_word: παρέχει
  choice: 赐给
  rationale: 在至高者为主语时，“赐给”自然体现给予，但不额外规定具体赐予方式。
- source_word: ταῦτα
  choice: 这些
  rationale: 保留希腊文中性复数形式，不改写成单数“这”。
theological_decisions:
- issue: 荣耀与神赐予之间的条件关系
  choice: 保留“渴望荣耀”以及至高者判断其是否有益这两个要素
  alternative: 将经文理解为至高者知道荣耀对他是合宜的
  rationale: 现有希腊文本把 θέλει 与 δόξαν相连，随后以 συμφέρει 表示至高者知道其是否有益；译文不把人的愿望与神的判断合并。
- issue: ταῦτα所指范围
  choice: 译作复数“这些”，保留指代开放性
  alternative: 明确译作“荣耀”或单数“这”
  rationale: 原文使用复数指示代词，可能概括前述福分；不应在正文中擅自限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“持守节制”兼顾持续生活状态与伦理含义；句法尽量贴近希腊文的条件句和并列层次，同时保持中文流畅。
