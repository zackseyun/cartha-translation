  - severity: low
    issue: “就也会把这些赐给他”中的“会”易带出将来意味
    rationale: παρέχει为现在时，用于此类条件陈述可表达惯常、概括性的赐予；中文以“就也把这些赐给他”即可自然表达，避免不必要的时态强化。
