  rationale: 仅作轻微的汉语表达调整：以“过着节制的生活”准确、自然地对应ἐν σωφροσύνῃ διάγων，并删除“会”以免无依据地突出将来意义。其余关键语义、复数指代及条件关系均维持不变。
