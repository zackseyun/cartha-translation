base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/005.yaml
  text: For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned to deceive me. But the Lord guarded me from her schemes.
translation:
  language: zh_hans
  text: 因为我在她家里的时候，她总是露出双臂和小腿，好叫我扑向她。她十分美丽，又特意打扮，要诱骗我。但主保护我，使我免受她的种种图谋。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγύμνου
  choice: 总是露出
  rationale: 未完成时表示反复或持续的动作；此处不是全身赤裸，而是显露后述的双臂和小腿。
- source_word: τοὺς βραχίονας αὐτῆς καὶ τὰς κνήμας
  choice: 双臂和小腿
  rationale: βραχίων在此指手臂，κνήμη通常指膝下的胫部或小腿；采用自然且具体的现代汉语。
- source_word: συμπέσω εἰς αὐτήν
  choice: 扑到她身上
  rationale: 保留动词“落下、扑倒”与介词短语的身体性意象，同时在汉语中自然表达其引诱发生性关系的意图，不将含义过度明说。
- source_word: ὡραία πάνυ
  choice: 十分美貌
  rationale: 准确传达强烈程度与外貌之美，语体庄重自然。
- source_word: μάλιστα κοσμουμένη
  choice: 又特意打扮
  rationale: κοσμέω指装饰、打扮；μάλιστα在此突出刻意或格外打扮，译文结合目的短语自然表达。
- source_word: πρὸς ἀπάτην μου
  choice: 要诱骗我
  rationale: 目的性短语直译为“为要欺骗我”；“诱骗”贴合本段情色引诱语境，又不添加原文未明说的行为结果。
- source_word: ἐγχειρημάτων
  choice: 种种图谋
  rationale: 可指企图、着手实施的计谋；“图谋”兼顾其蓄意性和复数含义。
- source_word: ἐφύλαξέ με ἀπό
  choice: 保护我，使我免受
  rationale: 清楚表达主的保守以及使约瑟脱离这些企图的结果。
theological_decisions:
- issue: 主的保守与约瑟抗拒诱惑之间的关系
  choice: 按原文明确归功于主的保护
  alternative: 弱化为约瑟凭自身意志避开诱惑
  rationale: 本句主语明确为“主”，动词ἐφύλαξεν直接陈述神的保护；译文不额外解释神的保守如何与人的责任配合。
- issue: “扑到她身上”的性含义
  choice: 保留身体性而含蓄的表达
  alternative: 明确译为“与她同寝”或弱化为“顺从她”
  rationale: 原文措辞具有明显身体指向，却没有直接使用“同寝”等术语；保留这种张力最忠实。
translation_notes:
  register: 采用现代标准普通话、简体中文。整体语气清楚庄重，叙事自然；用“总是”体现希腊语未完成时的反复性，用“但”呈现末句与前述诱惑之间的转折。
