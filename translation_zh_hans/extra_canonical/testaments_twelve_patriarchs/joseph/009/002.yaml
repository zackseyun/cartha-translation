  text: '*Πολλάκις δὲ¹ ἔπεμψε πρός με λέγουσα². Εὐδόκησον³ ⸀πληρῶσαι τὴν ἐπιθυμίαν⸀ μου, καὶ λύω⁴ σε ἐκ⁵ τῶν δεσμῶν, ⸀καὶ ἀπαλλάξω σε ἐκ⁶ τοῦ σκότους⸀. *Ἐγὼ δὲ οὐδὲ⁷ ἕως⁸ ἐννοίας⁹ ἐξέκλινα¹⁰ πρὸς αὐτήν· *ὁ γὰρ θεὸς ἀγαπᾷ¹¹ μᾶλλον τὸν¹² ἐν¹³ λάκκῳ σκότους †πιστὸν¹⁴ ἐν σωφροσύνῃ¹⁵, ἢ τὸν ἐν ταμείοις †βασιλέα¹⁶ τρυφῶντα μετ’ ἀκολασίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/002.yaml
  text: Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.” But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.
translation:
  language: zh_hans
  text: 她多次差人来对我说：“答应满足我的欲望吧，我就解开你的锁链，使你脱离黑暗。”但我连在意念上也没有偏向她；因为上帝更爱那在黑暗的坑中、在自制上忠信的人，胜过那在内室[a]中作王[b]、奢华享乐而放纵无度的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内室”所译的希腊词也可指“密室”或“储藏室”。
    reason: ταμεῖον的语义范围较宽；本句与黑暗的坑形成空间对照。
  - marker: b
    text: “作王”依据现存希腊文本；“王”一词在此处的读法以校勘符号标为疑难，文本并不完全确定。
    reason: 保留βασιλέα的现存读法，同时向读者说明其文本不稳，不擅自确定其含义或改写为某一特定解释。
lexical_decisions:
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: 答应满足我的欲望吧
  rationale: εὐδοκέω在此表示同意、情愿；ἐπιθυμία结合诱惑语境译为“欲望”，自然且不弱化性方面的含义。
- source_word: λύω σε ἐκ τῶν δεσμῶν
  choice: 解开你的锁链
  rationale: 保留λύω与δεσμοί的具体意象，并符合约瑟受囚的叙事背景。
- source_word: ἀπαλλάξω σε ἐκ τοῦ σκότους
  choice: 救你脱离黑暗
  rationale: ἀπαλλάσσω表示使脱离、释放；“黑暗”保留原文监禁环境及可能的象征意味。
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα πρὸς αὐτήν
  choice: 我连心思也没有转向她
  rationale: 较为贴近“甚至没有在意念层面偏向她”的表达，同时保持现代汉语流畅。
- source_word: πιστὸν ἐν σωφροσύνῃ
  choice: 忠贞自守的人
  rationale: πιστός可指忠信、忠贞；σωφροσύνη在此着重节制和性方面的贞洁，合译为“忠贞自守”以涵盖两者。
- source_word: ἐν ταμείοις βασιλέα
  choice: 在内室中如君王般
  rationale: ταμεῖον可指内室、密室或储藏室；此处与坑中黑暗形成环境反差。“如君王般”反映可能略显不稳的βασιλέα读法，同时避免硬译成身份断言。
- source_word: τρυφῶντα μετ’ ἀκολασίας
  choice: 奢华享乐、放纵无度的人
  rationale: τρυφάω指奢华安逸地生活；ἀκολασία指缺乏约束、放荡，译文保留享乐与道德失控的并列张力。
theological_decisions:
- issue: 上帝的爱是否表达功德式奖赏
  choice: 更蒙上帝喜爱
  alternative: 上帝更爱
  rationale: 保留ἀγαπᾷ μᾶλλον的比较结构，但不扩展为关于称义、功德或救恩次序的教义判断。
- issue: πιστός与σωφροσύνη的关系
  choice: 忠贞自守
  alternative: 在节制上忠信
  rationale: 原文可理解为人在自守中忠信，也可强调其贞洁忠贞；合并表达，不将其限定为某一宗派性的德目体系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“派人来”补出ἔπεμψε在语境中隐含的使者，使汉语表达完整；整体保留坑、黑暗、锁链与奢华内室之间的鲜明对照。脚注标记均置于正文末句相关位置。
