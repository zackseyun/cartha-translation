  to: 我被锁链捆着的时候，那埃及妇人被忧愁压倒。她来了，便侧耳听我怎样感谢主，在黑暗之屋中唱诗；我欢喜，以欢快的声音荣耀我的上帝，因为我借着一个托词得以摆脱那埃及妇人。[a]
  rationale: 修订末句，使“欢喜”与“以欢快的声音荣耀我的上帝”的关系在汉语中清楚自然；将“由头”改为“托词”，以提升书面语体并更贴近πρόφασις的常见语义。其余译法保留原文的修辞意象与未明示的语义。
