source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/001.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: zh_hans
  text: 我被锁链捆着的时候，那埃及妇人被忧愁压倒。她来了，便侧耳听我怎样感谢主，在黑暗之屋中唱诗；我欢喜，以欢快的声音荣耀我的上帝，因为我借着一个托词得以摆脱那埃及妇人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着一个托词”也可译作“借着一个借口”或“借着一个表面理由”。原文未明确这托词具体为何；它可能指那妇人的诬告反而成了约瑟脱离她的契机。
    reason: 说明διὰ προφάσεως可指托词、借口或表面理由，并避免将其具体所指确定为某一事件。
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: 被锁链捆着
  rationale: 既保留“锁链、捆绑”的具体意象，也符合现代汉语叙事表达。
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: 被忧愁压倒
  rationale: συνείχετο 表示被某种力量紧紧控制或困住；译文自然呈现强烈悲痛，而不机械直译为“被忧愁合拢”。
- source_word: ἐπηκροᾶτό μου
  choice: 侧耳听我
  rationale: 该词有认真倾听、听取之意；“侧耳听”保留她特意前来聆听的语感，又不强行判定为偷听。
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: 在黑暗之屋中
  rationale: 形式上保留“屋”与“黑暗”的意象，而不直接解释为监牢，使原文的修辞保持可见。
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: 以欢快的声音
  rationale: ἱλαρός 在此指愉快、欣然；“欢快”与随后的喜乐相呼应。
- source_word: διὰ προφάσεως
  choice: 借着一个由头
  rationale: πρόφασις 可指借口、托词、表面理由或契机；“由头”保留其略带负面且语义未完全确定的张力。
- source_word: ἀπηλλάγην
  choice: 摆脱了
  rationale: 表达从某人或某种纠缠中获释、脱离，符合这里约瑟脱离妇人侵扰的语境。
theological_decisions:
- issue: “主”与“我的上帝”的称谓关系
  choice: 分别译为“主”和“我的上帝”
  alternative: 统一译作“上帝”
  rationale: 原文分别使用 Κυρίῳ 与 τὸν Θεόν μου，保留称谓变化，不把二者之间的关系作额外神学解释。
- issue: 约瑟获救的方式 διὰ προφάσεως
  choice: 译作“借着一个由头”并加注说明
  alternative: “借着一个借口”或“借着这项指控”
  rationale: 原文没有明确说明该“由头”究竟是妇人的诬告、入狱的事由，还是摆脱她的契机；正文避免把含义锁定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体；保留“黑暗之屋”的原文意象和“由头”的含混性。句法适度拆分，以免照搬希腊语长句而显得生硬。
