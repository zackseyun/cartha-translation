    issue: “好话”范围过窄
    rationale: ἀγαθόν τι为中性不定表达，指“某件好事/某种美善之事”较稳妥，未必专指所说的“话”。既然动词为“听见”，中文可译“听见什么好事”，保留其宽泛性。
  - severity: medium
    issue: “以迎合自己的邪欲”增添意向和所属
    rationale: πρὸς τὴν πονηρὰν ἐπιθυμίαν表明领会的趋向或用途；“迎合”含有较强的刻意讨好意味，“自己的”也非原文所明说。改为“用来满足邪恶的欲望”较贴近其功能性趋向。
  - severity: low
    issue: “欲望的情欲”及相关句式不够自然
    rationale: “欲望的激情”较能表达πάθος与ἐπιθυμία的组合；“按那种激情来理解”自然呈现ἐκλαμβάνει εἰς的按某取向领会之意。
