source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐὰν γάρ τις *ὑποπέσῃ πάθει⁵⁰ ἐπιθυμίας⁵¹ καὶ *δουλωθῇ αὐτῷ⁵² ὡς κἀκείνη, κἂν ἀγαθόν⁵³ τι ἀκούσῃ⁵⁴ εἰς *ἐκεῖνο τὸ⁵⁵ πάθος⁵⁶ *ἐκλαμβάνει αὐτὸ⁵⁷ πρὸς *τὴν πονηρὰν ἐπιθυμίαν⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/008.yaml
  text: For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he takes it in relation to that passion, toward his evil desire.
translation:
  language: zh_hans
  text: 因为，人若陷入欲望的激情，受它奴役，像那女人一样，即使听见什么好事，也会按那种激情来理解它，用来满足邪恶的欲望。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας
  choice: 屈服于欲望的情欲
  rationale: ὑποπίπτω表示落入某种势力之下或屈服；πάθος与ἐπιθυμία连用，指由欲望驱动并支配人的情欲，保留原文两个相关概念。
- source_word: δουλωθῇ αὐτῷ
  choice: 受它奴役
  rationale: 保留δουλόω强烈的奴役意象，并以“它”回指前面的情欲。
- source_word: ὡς κἀκείνη
  choice: 像那女人一样
  rationale: 阴性指示代词ἐκείνη指上下文中的女子；译出性别可避免现代汉语代词指向不明。
- source_word: ἀγαθόν τι ἀκούσῃ
  choice: 听见什么好话
  rationale: ἀγαθόν τι在此可指某种善意或正当的话；“好话”自然简洁，同时不把范围限定为道德教训。
- source_word: εἰς ἐκεῖνο τὸ πάθος ἐκλαμβάνει αὐτό
  choice: 把它往那情欲上理解
  rationale: ἐκλαμβάνει在语境中是按某种取向领会、解释；保留话语被情欲扭曲理解的含义。
- source_word: πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: 以迎合自己的邪欲
  rationale: πρός可表达趋向或目的；“迎合”自然呈现其解释朝邪恶欲望发展的结果，“自己的”依上下文补明所属。
theological_decisions:
- issue: 欲望、情欲与邪欲之间的关系
  choice: 分别译作“欲望的情欲”和“邪欲”
  alternative: 统一译作“欲望”或“邪情私欲”
  rationale: 原文πάθος ἐπιθυμίας与πονηρὰ ἐπιθυμία措辞不同；分别处理可保留从受欲望支配的情欲到邪恶欲求的语义张力，且不引入特定教派术语。
- issue: 好话如何被接受
  choice: 译为“往那情欲上理解，以迎合……”
  alternative: 译为“把它套用在那情欲上，朝向……”
  rationale: 原文可能兼有解释、领会和挪用之意；正文采用自然汉语表达其核心，同时避免断言该话本身带有恶意。
translation_notes:
  register: 采用现代、庄重而通顺的叙述语体；保留“奴役”的强烈比喻，并用“那女人”承接上下文人物。原文无须设置文本异读或解释性脚注。
