revisions:
- from: 因为，人若屈服于欲望的情欲，受它奴役，像那女人一样，那么，即使听见什么好话，也会把它往那情欲上理解，以迎合自己的邪欲。
  to: 因为，人若陷入欲望的激情，受它奴役，像那女人一样，即使听见什么好事，也会按那种激情来理解它，用来满足邪恶的欲望。
  rationale: 修订仅处理原文语义范围和现代汉语表达：将“好话”扩为“什么好事”，避免将ἀγαθόν τι限于言语；以“按那种激情来理解它”表达受欲望支配的领会方式；以“用来满足邪恶的欲望”表达πρός的趋向/用途，删去原文未明说的“自己的”及过强的“迎合”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:20:43Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体保留了落入欲望之激情、受其奴役，并将所听见的善事按该激情加以领会的主线。惟“好话”将中性不定词ἀγαθόν τι限缩为言语；“以迎合自己的邪欲”把πρός所表的趋向/用途强化为有意“迎合”，并无根据地补出“自己的”。
  naturalness: “欲望的情欲”在现代汉语中语义重复且不够自然；“把它往那情欲上理解”亦较生硬。改用“欲望的激情”和“按那种激情来理解”，可兼顾原文层次与现代汉语表达。
  terminology: 保留“奴役”的强烈意象。“欲望的激情”（πάθος ἐπιθυμίας）与“邪恶的欲望”（πονηρὰ ἐπιθυμία）分别处理，避免混同两处不同措辞，也不加入特定教派术语。
  issues:
