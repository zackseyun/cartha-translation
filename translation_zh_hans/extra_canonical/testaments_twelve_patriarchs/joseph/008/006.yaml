  text: '*Καὶ λέγει³⁷ πρὸς με· *Ἰδοὺ οὖν³⁸ ἀγαπᾷς με· *τοῦτό μοι ἀρκεῖτω· μόνον ἀντιποιῆσαι³⁹ *τῆς ζωῆς μου⁴⁰ ⌜καὶ *τῶν τέκνων⁴¹ μου, *καὶ ἔχω⁴² προσδοκίαν ἀπολαῦσαι⁴³ ⌜καὶ⁴⁴ τῆς ἐπιθυμίας μου.'
