  naturalness: 原译整体通顺，但“我和我孩子们的性命”在现代汉语中略显生硬，也把“我的生命”与“我的孩子”不必要地并列为同一“性命”对象。改作“我本人和我的孩子”自然，并在语义上表达对她及孩子的照料。
  terminology: “看哪”可保留经文体，但“你看”在现代标准汉语中更自然，仍传达ἰδού的提醒语气。“也能如愿以偿”略带结果性强化；“也得到我所渴望的”更贴近ἀπολαῦσαι…τῆς ἐπιθυμίας μου，且不预断愿望的道德性质。
