  rationale: 修订以所给希腊文及本段叙事上下文为准，将无根据的男性说话者改为女性；同时以“照料我本人和我的孩子”传达ἀντιποιῆσαι的顾念、照料含义，而不擅自限定为保全性命。末句改为“得到我所渴望的”，保留καί的“也”及ἐπιθυμία的中性语义。无原有脚注锚点或新增脚注需要处理。
