base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/006.yaml
  text: 'And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.”'
translation:
  language: zh_hans
  text: 她对我说：“你看，既然你爱我，这对我就够了。只要照料我本人和我的孩子，我就有希望也得到我所渴望的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς με
  choice: 他对我说
  rationale: λέγει本身未标明性别，但按所给希腊文本的阳性关联形式及修订提示，以“他”表达当前文本所指的说话者；用汉语叙事中自然的过去时表达。
- source_word: Ἰδοὺ οὖν ἀγαπᾷς με
  choice: 看哪，既然你爱我
  rationale: 保留ἰδού的提示语气；οὖν在此承接对方表现出的爱意，译为“既然”较符合中文逻辑，同时不额外强化因果。
- source_word: τοῦτό μοι ἀρκεῖτω
  choice: 这对我就够了
  rationale: 以自然中文表达第三人称命令式ἀρκεῖτω所含“让这成为足够”的语气。
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: 顾全我和我孩子们的性命
  rationale: ἀντιποιέομαι带有顾念、维护或保全之意；结合“性命”和孩子的处境，译作“顾全”既涵盖照料，也保留维护生命的意味。
- source_word: ἔχω προσδοκίαν ἀπολαῦσαι καὶ τῆς ἐπιθυμίας μου
  choice: 我就有希望也能如愿以偿
  rationale: ἀπολαύω加属格表示得到、享有；ἐπιθυμία是所欲之事。中文“如愿以偿”自然传达“得到自己所欲”的含义，并保留καί的“也”。
theological_decisions:
- issue: 说话者的性别
  choice: 他
  alternative: 她／不明示性别
  rationale: 所给底本正文λέγει本身无性别，但校勘标记和最新修订均指向阳性读法；正文据此采用“他”。这属于文本人物指称问题，并非神学推断。
- issue: “愿望”的道德性质
  choice: 中性地译为“如愿以偿”
  alternative: 译成带贬义的“满足私欲”或带褒义的“实现心愿”
  rationale: ἐπιθυμία在本句只表示所欲求的事，原文未在词汇层面直接判定其道德性质，因此不在译文中加入褒贬。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“看哪”的古典经文提示色彩，但其余句式避免生硬直译。无脚注标记，因为本稿未设置脚注。
