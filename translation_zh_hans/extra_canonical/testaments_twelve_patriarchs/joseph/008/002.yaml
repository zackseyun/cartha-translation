lexical_decisions:
- source_word: Τέλος
  choice: 最后
  rationale: 表示这一连串行为发展到最终阶段，现代汉语中自然简洁。
- source_word: βίᾳ / μετὰ βίας
  choice: 用强力 / 硬
  rationale: 保留原文两次强调强迫和暴力的表达，同时避免中文机械重复。
- source_word: ἐπελαμβάνετό μου τῶν ἱματίων
  choice: 抓住我的衣服
  rationale: 准确呈现她强行抓扯约瑟衣物的动作。
- source_word: ἐφελκομένη με
  choice: 把我拉去
  rationale: 体现持续用力拖拉、牵引的动作及明确宾语。
- source_word: εἰς συνουσίαν
  choice: 去与她交合
  rationale: συνουσία在此明确指性交；“交合”庄重、直接，又符合古代宗教文本语域。
theological_decisions:
- issue: 强迫行为的主动者与受动者
  choice: 明确由“她”抓住并强拉“我”
  alternative: 使用省略主语或较含混的被动表达
  rationale: 希腊文阴性分词ἐφελκομένη及上下文明确表明女子是施动者，约瑟是受动者；译文不应弱化这一点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“硬把”自然传达强制意味；“交合”准确且不粗俗。
