  text: Ὡς ⌜οὖν⌉¹⁴ εἶδον¹⁵ ὅτι μαινομένη¹⁶ κρατεῖ μου τὸν χιτῶνα, καταλείψας αὐτὸν [καὶ ἐκτιναξάμενος] ἔφυγον γυμνός¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/003.yaml
  text: Therefore, when I saw that she, in her frenzy, was seizing my tunic, leaving it [and shaking it off], I fled naked.
translation:
  language: zh_hans
  text: 因此，我一看见她在狂乱中正抓住我的长衣，就留下那件长衣[并把它甩脱][a]，赤身逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “并把它甩脱”在所据希腊文本中置于方括号内，表示其文本地位不确定。
    reason: 保留并说明原文编校所标示的不确定性，同时使正文与英文POB审校文本一致。
lexical_decisions:
- source_word: μαινομένη
  choice: 发狂地
  rationale: 表达其失去理智、狂乱的状态，同时避免额外引入动机判断。
- source_word: κρατεῖ
  choice: 抓住
  rationale: 对应持续控制、揪住衣物的动作；现代汉语自然明确。
- source_word: χιτῶνα
  choice: 内衣
  rationale: χιτών指贴身穿的长衣；译作“内衣”较能说明赤身逃走的语境，但不是现代意义上的贴身小衣。
- source_word: καταλείψας αὐτὸν
  choice: 把衣服留下
  rationale: 保留分词所表达的先行动作，并明确代词所指为衣服。
- source_word: γυμνός
  choice: 赤身
  rationale: 忠实保留可指裸体或衣着不全的词义张力，不擅自弱化为仅“衣衫不整”。
theological_decisions: []
