id: T12P.JOS.8.1
reference: Testament of Joseph 8:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Λέγω οὖν¹, τέκνα μου², ὅτι ὥρα *ἦν ὡσεὶ³ ἕκτη ὅτε³ ἐξῆλθεν ἀπ᾽ ἐμοῦ⁴. *Καὶ κλίνας γόνυ⁵ πρὸς Κύριον ὅλην τὴν ἡμέραν καὶ ὅλην τὴν νύκτα⁶, πρὸς⁷ ὄρθρον ἀνέστην, δακρύων⁸ καὶ αἰτῶν⁹ λύτρωσιν *ἐξ αὐτῆς¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/001.yaml
  text: So I say to you, my children, that it was about the sixth hour when she left me. And after bending my knee to the Lord all day and all night, toward dawn I rose, weeping and asking for deliverance from her.
translation:
  language: zh_hans
  text: 所以，孩子们，我告诉你们：大约在第六个时辰，她离开了我。我向主屈膝，整整一天一夜；临近黎明，我站起身来，流着泪，祈求主救我脱离她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥρα ἦν ὡσεὶ ἕκτη
  choice: 大约在第六个时辰
  rationale: 保留古代按日间时辰计时的表达及其约略语气，不擅自换算成现代钟点。
- source_word: κλίνας γόνυ πρὸς Κύριον
  choice: 我向主屈膝
  rationale: 自然呈现向主跪下祷告的动作，同时保留原文简洁的身体意象。
- source_word: πρὸς ὄρθρον
  choice: 临近黎明
  rationale: 表达时间朝向黎明、将近破晓，而不将其过度确定为黎明之后。
- source_word: αἰτῶν λύτρωσιν ἐξ αὐτῆς
  choice: 祈求主救我脱离她
  rationale: λύτρωσις在此指获救、摆脱其纠缠；中文补出受祈求者“主”，使语意自然清楚，但不增加新的施救内容。
theological_decisions:
- issue: 祈求的对象及解救的施行者
  choice: 祈求主救我脱离她
  alternative: 祈求脱离她
  rationale: 希腊文前句已明确约瑟向主屈膝，后面的祈求延续这一祷告情境；中文补出“主”可避免误读，同时未引入宗派性解释。
- issue: 屈膝持续时间与起身的关系
  choice: 我向主屈膝，整整一天一夜；临近黎明，我站起身来
  alternative: 向主屈膝之后，过了一整天一整夜，临近黎明我站起来
  rationale: 分词结构可自然理解为持续屈膝祈祷直到临近黎明；译文保留这种连续关系，避免把“一天一夜”误作屈膝之后另行流逝的时间。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“第六个时辰”保留古代叙事色彩；整体句式清晰自然，不用过度古雅的词语。
