    issue: “看我怎样感谢主”
    rationale: ἐπηκροᾶτό μου πῶς...的意思是她听约瑟如何感谢、歌唱和喜乐；“看”无原文依据，且与后文声音、歌唱的听觉场景不协调。
  - severity: medium
    issue: “侧耳偷听”
    rationale: ἐπακροάομαι可表示倾听、留心听，英文审计文本作“listen in on”，但希腊文本本身未明确说她秘密偷听；“偷听”增添了隐蔽性。
  - severity: low
    issue: “以欢快的声音喜乐”
    rationale: 该表达在中文中略显重复和生硬；可将ἔχαιρον与ἐν ἱλαρᾷ φωνῇ自然整合为“欢喜地用愉悦的声音颂扬”。
  revised_text: 我被锁链捆绑的时候，那埃及女人被愁苦所困。她来时，听我如何感谢主，如何在黑暗之屋歌唱赞美诗，又如何欢喜地用愉悦的声音颂扬我的上帝；因为我借着一个借口摆脱了那埃及女人。[a]
