source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/005.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: zh_hans
  text: 我被锁链捆绑的时候，那埃及女人被愁苦所困。她来时，听我如何感谢主，如何在黑暗之屋歌唱赞美诗，又如何欢喜地用愉悦的声音颂扬我的上帝；因为我借着一个借口摆脱了那埃及女人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着一个借口”也可译作“借着一个托词”或“借着一个表面的理由”。原文没有说明这借口或理由具体是什么。
    reason: 说明διὰ προφάσεως可指借口、托词或表面理由，并保留其所指事件及作用方式的含混性。
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: 被锁链捆绑
  rationale: 既保留 δεσμοί 的锁链意象，也用自然汉语表达身陷囚禁的状态。
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: 被愁苦攫住了
  rationale: συνέχω 在此表示被强烈情绪控制、压迫；“攫住”比生硬的“聚拢”更符合现代汉语，同时保留其强制意味。
- source_word: ἐπηκροᾶτό μου
  choice: 侧耳偷听
  rationale: 该词在语境中指从旁倾听、暗中听取，译文传达她前来窥听约瑟的举动。
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: 在黑暗之屋
  rationale: 尽量保留原文形象及其可能兼指监牢与幽暗处境的意味，不直接释作“牢房”。
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: 以欢快的声音
  rationale: ἱλαρός 表示喜悦、欣然；“欢快”自然呈现约瑟在困境中赞美的语气。
- source_word: διὰ προφάσεως
  choice: 借着一个由头
  rationale: πρόφασις 可指借口、托词、表面理由或契机；“由头”保留其略带负面且不完全确定的语义。
- source_word: ἀπηλλάγην
  choice: 摆脱了
  rationale: 准确表达脱离、获释于某人之意，与后接属格“那埃及女人”自然衔接。
theological_decisions:
- issue: 约瑟获救与女人诬告之间的张力
  choice: 因为我借着一个由头摆脱了那埃及女人
  alternative: 因为我借着她的诬告得以脱离那埃及女人
  rationale: 原文只说 διὰ προφάσεως，没有明确指明是诬告，也没有明确说明由谁安排；译文不把这一事件进一步解释为特定的神意机制。
- issue: “黑暗之屋”的所指
  choice: 保留“黑暗之屋”的意象
  alternative: 译为“牢房”或“地牢”
  rationale: 原文表达具有象征与实指并存的可能，保留原有张力，避免缩窄为单一地点。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句法适度拆分，以免希腊文长句在中文中显得拖沓；同时保留“黑暗之屋”“锁链”等鲜明意象，以及困境中喜乐赞美所形成的反差。
