revisions:
- from: 我被锁链捆绑的时候，那埃及女人被愁苦攫住了。她来侧耳偷听，看我怎样感谢主，在黑暗之屋歌唱赞美诗，又怎样以欢快的声音喜乐，荣耀我的上帝，因为我借着一个由头摆脱了那埃及女人。[a]
  to: 我被锁链捆绑的时候，那埃及女人被愁苦所困。她来时，听我如何感谢主，如何在黑暗之屋歌唱赞美诗，又如何欢喜地用愉悦的声音颂扬我的上帝；因为我借着一个借口摆脱了那埃及女人。[a]
  rationale: 修正听觉动词的误译，并除去“偷听”所附加的隐蔽意味。其余调整使中文更自然，同时保留原文的重复“如何”、黑暗之屋的形象、以喜乐声音颂扬神的语气，以及πρόφασις未获明确界定的含混性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:20:58Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现了受缚、埃及妇人因愁苦受压、约瑟在“黑暗之屋”中感谢并歌颂神，以及藉πρόφασις脱离她的内容。不过，ἐπηκροᾶτό μου的宾语是约瑟的说话/歌唱行为，译作“看我怎样”不合原文的听觉语境；“侧耳偷听”也将原文未明示的秘密窥听意味说得过强。
  naturalness: 原文整体通顺，庄重程度合宜。“被愁苦攫住”可理解，但略显用力；“被愁苦所困”更自然。“以欢快的声音喜乐”语义重复，改为“欢喜地……颂扬”更符合现代汉语，同时保留分词δοξάζων与“喜乐声音”的关系。
  terminology: “主”“我的上帝”“赞美诗”均可。“黑暗之屋”适宜保留其意象。“借着一个由头”虽能保存含混性，但“由头”偏口语；“借着一个借口”更贴近πρόφασις的常用义，脚注说明其亦可能指托词或表面理由，避免落实具体事件。
  issues:
