  text: But she did not know that I spoke thus because of my Lord, and not because of her.
translation:
  language: zh_hans
  text: 但她不知道，我这样说是因为我的主，而不是因为她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔγνω
  choice: 她不知道
  rationale: 直译希腊语的否定过去时表达，现代汉语自然清楚。
- source_word: διὰ τὸν Κύριόν μου
  choice: 因为我的主
  rationale: διά加宾格在此表示原因；保留“我的主”，不擅自明确其所指，以保存原文可能具有的指称与神学张力。
- source_word: εἶπον οὕτως
  choice: 我这样说
  rationale: 按原文语序与语义自然转达，指向上文所说的话。
- source_word: οὐχὶ δι᾽ αὐτήν
  choice: 而不是因为她
  rationale: 保留原文原因结构及强调性的对比否定。
theological_decisions:
- issue: “我的主”的指称
  choice: 保留“我的主”
  alternative: 译为“主”或明确为“上帝”
  rationale: 原文有物主代词 μου，且本句本身没有明说所指；不应在译文中替作者消除这种含义空间。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留原句“因为……而不是因为……”的鲜明对比。
