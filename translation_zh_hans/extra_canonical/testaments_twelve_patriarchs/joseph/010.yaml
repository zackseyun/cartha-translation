  - severity: medium
    issue: 第3节“至高者住在哪里”造成汉语指代不连贯。
    rationale: 原文ὅπου δὲ κατοικεῖ ὁ ὕψιστος与后文ἐπ᾽ αὐτόν指向受神居住的人；汉语宜明说“至高者住在谁里面”，避免把人遭遇的患难接到一个单纯地点上。
  - severity: low
    issue: 第1节“你们要看”略强化为命令。
    rationale: Ὁρᾶτε在这里主要是“看哪／你们看”的提醒性用语；删去“要”更贴近原句语气。
  - severity: low
    issue: 第6节“没有因恶事而骄傲”表达略不自然。
    rationale: 对难句οὐκ ἐπήρθην ἐν κακῷ，译作“没有在恶事上自高”较紧贴介词结构，也较适合劝诫文体。
