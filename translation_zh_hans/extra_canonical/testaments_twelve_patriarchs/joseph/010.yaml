review_pass:
  verdict: revise
  source_fidelity: 第3节原译将“至高者住在哪里”与后文“他里面”的指代并置，汉语逻辑不够连贯；应明确为至高者住在某人里面。第6节“没有因恶事而骄傲”对ἐν κακῷ的表达稍显生硬，译为“没有在恶事上自高”更贴近原文且自然。原文末尾为“伟大而正直的人”，草稿正文对此处理正确，应保留，不随英文审计轨迹中“mighty”的不一致而改动。第4节希腊文确有困难，正文采取最低限度的“显露出来”解释，并以脚注保留另一种字面可能，做法可接受。
  naturalness: 整体庄重、现代且流畅。将第1节“你们要看”简化为“你们看”，更符合ὁρᾶτε在此处引起注意的语气。第3节改为“至高者住在谁里面”，消除地点与人物指代的跳跃。
  terminology: “坚忍”“禁食祷告”“自制”“纯洁”“至高者”“奴役”“诬告”等术语一致且符合语境。“住在……里面”恰当保留κατοικέω的居住意象，不附加特定教义解释。“敬畏上帝”较“对上帝的敬畏”简洁自然，含义不变。
