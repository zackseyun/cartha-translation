base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010.yaml
  text: '1[a]. See, then, my children, how much endurance accomplishes, and prayer with fasting.


    2. So you also, if you pursue self-control and purity with endurance, and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.


    3[b]. And where the Most High dwells, even if envy should befall someone, or slavery, or slander, the Lord dwelling in him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.


    4. For every person, whether in deed or in word or in thought, comes together.


    5. My brothers knew how my father loved me, yet I was not exalted in my mind; but though I was a child, I had the fear of God in my heart, for I knew that all things will surely pass away.


    6. And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent, when I was being sold, so as not to tell the Ishmaelites that I was a son of Jacob[c], a great and mighty man.'
translation:
  language: zh_hans
  text: '《约瑟遗训》第10章


    1 所以，我的孩子们，你们看，坚忍和禁食祷告能成就多大的事。


    2 同样，你们若怀着谦卑的心，以坚忍和禁食祷告追求自制与纯洁，主就必住在你们里面，因为他喜爱自制。


    3 至高者住在谁里面，即使那人遭到嫉妒、奴役或诬告[a]，主因他的自制住在他里面，就不但救他脱离种种祸患，还要高举他，使他得荣耀，就像待我一样。


    4 因为每个人，无论在行为、言语还是思想上，都会显露出来[b]。


    5 我的兄弟们知道父亲多么爱我，我心里却没有因此自高。我虽然年幼，心里已有敬畏上帝的心，因为我知道一切都会过去。


    6 我没有在恶事上自高，反倒尊重我的兄弟们。由于怕他们，我被卖时一直保持沉默，没有告诉以实玛利人，我是那位伟大而正直的人雅各的儿子[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诬告”也可译作“诽谤”；希腊词可指恶意或捏造的指控，与约瑟在埃及的经历相符。
    reason: lexical_alternative
  - marker: b
    text: 本句希腊文本艰涩，抄本传承也不稳定。这里可能是说，一个人在行为、言语和思想各方面都会显明出来；若更贴近现存动词，也可能理解为“聚集在一起”。
    reason: textual_variant
  - marker: c
    text: 这一分句在部分文本见证中有差异；基本意思是，约瑟被卖时没有透露自己的家族身份。现存引文称雅各为“伟大而正直的人”。
    reason: textual_variant
lexical_decisions:
- source_word: ὑπομονή
  choice: 坚忍
  rationale: 此处指人在考验中持守不移；“坚忍”既表达持续忍耐，也保留伦理劝诫的力度。
- source_word: προσευχή μετὰ νηστείας
  choice: 禁食祷告
  rationale: μετά表示伴随关系；现代汉语以“禁食祷告”自然表达伴随禁食的祷告。
- source_word: σωφροσύνη
  choice: 自制
  rationale: 该词在本书语境中涉及性方面的节制，但含义不限于贞洁；“自制”保留其较广的道德范围，并由相邻的“纯洁”凸显性伦理层面。
- source_word: ἁγνεία
  choice: 纯洁
  rationale: 既可涵盖道德纯洁，也能在约瑟受试探的背景中传达贞洁含义，而不把词义过度缩窄。
- source_word: ταπείνωσις καρδίας
  choice: 谦卑的心
  rationale: 自然传达内在谦卑，同时保留原文“心”的伦理焦点。
- source_word: κατοικέω
  choice: 住在……里面
  rationale: 忠实保留神住在人里面的强烈空间性表达，不将其弱化为仅仅赐福或眷顾。
- source_word: ὁ ὕψιστος
  choice: 至高者
  rationale: 这是犹太宗教文献中常见的神圣称号，庄重而自然。
- source_word: φθόνος
  choice: 嫉妒
  rationale: 与约瑟因兄弟嫉妒而受害的叙事背景吻合。
- source_word: δουλεία
  choice: 奴役
  rationale: 约瑟所经历的是实际被卖为奴的处境；“奴役”不淡化其受制状态。
- source_word: συκοφαντία
  choice: 诬告
  rationale: 该词可指诽谤或恶意虚假指控；约瑟在埃及的经历更直接对应“诬告”。
- source_word: ῥύεται
  choice: 救……脱离
  rationale: 准确表达从危难或祸患中施行拯救，且符合现代庄重汉语。
- source_word: ὑψοῖ καὶ δοξάζει
  choice: 高举……使……得荣耀
  rationale: 保留两个并列动词及其修辞递进，不将二者合并为单一的“尊荣”。
- source_word: φόβος τοῦ θεοῦ
  choice: 对上帝的敬畏
  rationale: “敬畏”能表达宗教性的敬惧与尊崇，避免仅译为一般害怕。
- source_word: δίκαιος
  choice: 正直
  rationale: 原文称雅各为“伟大而正直”；“正直”贴近该词在人物品格描述中的意义。
theological_decisions:
- issue: 犹太遗训文本中的神圣内住语言
  choice: 直译为主或至高者“住在”自制之人里面
  alternative: 理解为神仅仅眷顾、同在或赐福
  rationale: κατοικέω及其介词结构明确使用居住语言。译文保留这一神学张力，不以后期教义体系加以限定，也不将它弱化为抽象恩宠。
- issue: σωφροσύνη的道德范围
  choice: 译作“自制”
  alternative: 译作“贞洁”或“节制”
  rationale: 约瑟的处境使性方面的克制十分突出，但该希腊词也包含更广泛的理性自持和道德克制；与“纯洁”并列可同时保留广度和具体语境。
- issue: 第3节拯救与高举的关系
  choice: 保留“因他的自制”与主的内住、拯救和高举之间的原文联系
  alternative: 改写为无条件的普遍救恩陈述
  rationale: 本段是伦理劝诫，原文明确将自制与神的内住及搭救相连；译文不扩展为系统性的救恩条件，也不删去原有因果张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。劝诫句保持父亲对子女讲话的语气；神圣称号及敬虔用语略具经文风格，但避免古奥表达。第4节因希腊文损坏而采用可读的最低限度解释，并在脚注保留不确定性。
