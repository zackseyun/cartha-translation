  text: Ἐπράθην *εἰς δουλείαν¹⁹, *Καὶ ὁ πάντων δεσπότης²⁰ ἠλευθέρωσέν με· Εἰς αἰχμαλωσίαν ἐλήφθην²¹, Καὶ ἡ κραταιὰ αὐτοῦ χεὶρ ἐβοήθησέ μοι· Ἐν λιμῷ συνεσχέθην, Καὶ αὐτὸς ὁ Κύριος διέθρεψέ με²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/005.yaml
  text: I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was confined by famine, and the Lord himself nourished me.
translation:
  language: zh_hans
  text: 我被卖作奴隶，万有的主宰释放了我；我被掳去，他大能的手帮助了我；我被饥荒所困，主亲自养活了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθην εἰς δουλείαν
  choice: 我被卖为奴
  rationale: 直接保留“被卖”及进入奴役状态的含义，中文简洁自然。
- source_word: ὁ πάντων δεσπότης
  choice: 万有的主宰
  rationale: πάντων指“一切、万有”，δεσπότης强调拥有权柄的主人或主宰；此译法保留其庄严和普世权柄色彩。
- source_word: ἠλευθέρωσέν με
  choice: 释放了我
  rationale: 准确表达从奴役中使人得自由，与前句形成鲜明对应。
- source_word: Εἰς αἰχμαλωσίαν ἐλήφθην
  choice: 我被掳去
  rationale: 以现代中文自然表达被俘、被带入囚禁状态的被动意义。
- source_word: ἡ κραταιὰ αὐτοῦ χείρ
  choice: 他大能的手
  rationale: 保留“手”的身体意象，并以“大能”表达κραταιά的强有力。
- source_word: Ἐν λιμῷ συνεσχέθην
  choice: 我受饥荒困迫
  rationale: συνεσχέθην含被拘束、压制或困住之意；“受……困迫”既保留这一力度，也避免将原文具体化为实际囚禁。
- source_word: αὐτὸς ὁ Κύριος διέθρεψέ με
  choice: 主亲自供养了我
  rationale: “亲自”体现αὐτός的强调；“供养”表达持续供应食物、养活的含义。
theological_decisions:
- issue: δεσπότης与Κύριος在同一节中的称谓差异
  choice: 分别译作“主宰”和“主”
  alternative: 两者都译作“主”
  rationale: 原文有意使用不同希腊称谓；分别翻译可保留措辞变化，同时不引入额外神学区分。
- issue: αὐτός的强调作用
  choice: 译作“主亲自”
  alternative: 仅译作“主”
  rationale: 明示原文对施行供养者本身的强调，并保持“主”是行动主体。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。三个分句保持平行结构，以分号呈现苦难与神施救之间反复出现的对照；用“却”自然标示转折，但不增添原文没有的因果解释。
