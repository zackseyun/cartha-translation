  text: Διαθήκη Ἰωσὴφ τοῦ ἑνδεκάτου υἱοῦ Ἰακὼβ καὶ Ῥαχήλ¹. Ἀντίγραφον διαθήκης Ἰωσήφ². Ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν³, καλέσας⁴ τοὺς υἱοὺς αὐτοῦ καὶ τοὺς ἀδελφοὺς αὐτοῦ⁷ εἶπεν αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/001.yaml
  text: 'The testament of Joseph, the eleventh son of Jacob and Rachel. A copy of the testament of Joseph. When he was about to die, he called his sons and his brothers and said to them:'
translation:
  language: zh_hans
  text: 雅各和拉结的第十一个儿子约瑟的遗训。约瑟遗训的抄本。他将要去世时，召来自己的儿子们和弟兄们，对他们说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: 遗训
  rationale: 此处指临终前留给后人的训言；“遗训”比“遗嘱”更能体现下文劝诫性言辞，同时保留作品标题的庄重感。
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 直译为抄写所得的副本，符合文本开头的传本说明。
- source_word: ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν
  choice: 他将要去世时
  rationale: 自然表达临近死亡之际；“去世”庄重而易懂。
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: 弟兄们
  rationale: ἀδελφοί在此为男性手足；“弟兄”保持古代家族叙事的庄重语域，且不将其泛化为其他亲属。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 直接对应希腊语间接宾语结构，并以冒号引出后文。
theological_decisions:
- issue: διαθήκη在作品标题中的含义
  choice: 遗训
  alternative: 遗嘱／约
  rationale: 这里不是法律财产处分，也并非明确指神人之约，而是族长临终言辞；采用“遗训”避免引入法律或圣约层面的额外含义。
- issue: “雅各和拉结的第十一个儿子”的潜在歧义
  choice: 按希腊语原有并列结构直译
  alternative: 雅各的第十一个儿子、拉结的儿子
  rationale: 原文将Ἰακὼβ καὶ Ῥαχήλ共同置于属格结构中。虽按族谱约瑟并非拉结的第十一个儿子，译文不擅自改写或消解原文标题的表述张力。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。保留标题与传本说明的重复，不因中文修辞而删并；“召来”体现先召集、后发言的动作次序。
