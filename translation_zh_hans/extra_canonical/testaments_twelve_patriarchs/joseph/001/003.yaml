base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/003.yaml
  text: In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.
translation:
  language: zh_hans
  text: 我一生中见过嫉妒和死亡，却没有被迷惑，反而仍留在主的真理中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: 嫉妒
  rationale: 直接表达因他人所得而生的妒恨，符合本句伦理语境。
- source_word: θάνατον
  choice: 死亡
  rationale: 保留原文的直接说法及其可能具有的实际或拟人化意味，不擅自解释。
- source_word: οὐκ ἐπλανήθην
  choice: 没有迷失
  rationale: πλανάω可指迷路、受迷惑或偏离正道；“迷失”自然简洁，并保留一定语义空间。
- source_word: ἔμενα
  choice: 持守
  rationale: 原义为停留、保持；在“真理中”的搭配下，“持守”比字面的“停留”更符合现代汉语，同时体现持续坚定。
- source_word: ἐν τῇ ἀληθείᾳ Κυρίου
  choice: 在主的真理中
  rationale: 保留介词结构和属格关系，不将其收窄为“对主忠诚”或其他解释。
theological_decisions:
- issue: “主的真理”所指为何
  choice: 保留“主的真理”这一开放表达
  alternative: 译作“对主忠诚”或“主的信实”
  rationale: ἀλήθεια可涉及真理、真实或信实；此处不宜替原文消除其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“却……反而……”清楚呈现οὐκ…ἀλλʼ的转折；不为抄本校勘符号另设注释，因为所给正文在关键语义上清楚。
