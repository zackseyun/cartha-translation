base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/006.yaml
  text: I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]
translation:
  language: zh_hans
  text: 我孤身一人，神安慰了我；我软弱时，主眷顾了我；我身陷牢狱，救主施恩于我；[我被锁链捆绑，他就释放了我。][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句在所据希腊文本中置于方括号内，表明其文本归属存疑；该版本还在“救主”一词前标有匕首号（†），表示该词有校勘疑义。
    reason: 准确保存底本以方括号和匕首号标出的文本批判信息与不确定性。
lexical_decisions:
- source_word: Μόνος
  choice: 孤身一人
  rationale: 既准确表达独自、无人相伴的处境，也比直译“单独”更符合现代汉语叙事语感。
- source_word: παρεκάλεσέ
  choice: 安慰
  rationale: 在受孤立的语境中，παρακαλέω侧重扶助和慰藉；“安慰”自然且与上下文相称。
- source_word: Ἐν ἀσθενείᾳ
  choice: 我软弱的时候
  rationale: ἀσθένεια可指软弱、衰弱或疾病；译作“软弱”保留较宽泛的含义，不限定为患病。
- source_word: ἐπεσκέψατό
  choice: 眷顾
  rationale: ἐπισκέπτομαι不只是到访，也常含关怀、照料之意；“眷顾”兼顾神主动临到与关怀。
- source_word: ἐχαρίτωσέ
  choice: 施恩于
  rationale: χαριτόω在此表达给予恩惠或优待；“施恩于”保留其恩惠意味及庄重语体。
- source_word: ἔλυσέ
  choice: 释放
  rationale: λύω字面为解开，在锁链语境中意为解除捆绑、使人自由；“释放”在中文中简洁自然。
theological_decisions:
- issue: “神”“主”“救主”的称谓是否合并
  choice: 分别保留“神”“主”“救主”
  alternative: 统一译成同一神圣称谓
  rationale: 原文依次使用ὁ Θεός、ὁ Κύριος、ὁ σωτήρ；保留变化，避免抹平文本的修辞与可能的神学张力。
- issue: 方括号内末句的文本地位
  choice: 保留方括号并加脚注说明
  alternative: 将末句无标记地纳入正文，或直接删除
  rationale: 来源文本以方括号标示该句，表明其文本地位存疑；译文应如实呈现而不替读者裁决。
- issue: σωτήρ前的校勘疑问标记
  choice: 正文译作“救主”，脚注提示原文校勘存疑
  alternative: 因疑读而改译或省略
  rationale: 现有希腊文本仍给出σωτήρ，故据此翻译；同时以脚注保存版本所显示的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；三个平行分句保留原文反复结构，并用分号呈现节奏。
