base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/004.yaml
  text: My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers preserved me. They lowered me into a pit, and the Most High brought me up.
translation:
  language: zh_hans
  text: 我的兄弟们恨我，主却爱我；他们想要杀我，我列祖的上帝却保守了我；他们把我缒下坑里，至高者却把我带上来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμίσησάν με
  choice: 恨我
  rationale: 直接对应“憎恨我”，在现代汉语中自然有力。
- source_word: ἠγάπησέ με
  choice: 爱我
  rationale: 忠实表达与“恨我”相对的爱，保留原文鲜明对照。
- source_word: ἠθελόν με ἀνελεῖν
  choice: 想要杀我
  rationale: ἀνελεῖν在此指除掉、杀死；“想要杀我”准确而自然。
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: 我列祖的上帝
  rationale: 保留族长传统和盟约语境；“列祖”比笼统的“祖先”更庄重。
- source_word: ἐφύλαξέν με
  choice: 保守了我
  rationale: 表达看守、护卫并使其存留之意，既贴近原词，也保持宗教叙事的庄重语体。
- source_word: Εἰς λάκκον με ἐχάλασάν
  choice: 他们把我缒下坑里
  rationale: χαλάω表示使下降、放下；“缒下”保留动作方式，不泛化为单纯“扔进”。
- source_word: ὁ ὕψιστος
  choice: 至高者
  rationale: 采用汉语宗教文献中清楚而庄重的称号，准确对应这一神圣称谓。
- source_word: ἀνήγαγέν με
  choice: 把我拉上来
  rationale: 与前面的“缒下”形成方向鲜明的对应，并自然表达从坑中带上来的动作。
theological_decisions:
- issue: “主”“我列祖的上帝”“至高者”之间的关系
  choice: 保留三个不同称谓，不作解释性统一
  alternative: 全部译作“上帝”或增补说明三者同指一位神
  rationale: 原文刻意交替使用Κύριος、Θεὸς τῶν πατέρων μου和ὕψιστος；译文保留这种修辞与神学张力，不额外阐释。
- issue: 神的护佑行动ἐφύλαξέν με
  choice: 译为“保守了我”
  alternative: 译为“使我安然无恙”或“救了我”
  rationale: “保守”没有把动作窄化为一次性的营救，也不超出原文明确表达的护卫、保存含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。三个分句以分号连接，并以“却”突出人意与神意的反差。无脚注，因此正文不设脚注标记。
