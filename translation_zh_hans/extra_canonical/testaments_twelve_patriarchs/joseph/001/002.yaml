revisions:
- from: 我的弟兄和儿女们，请听我这蒙以色列疼爱的约瑟说；要侧耳听我口中的话。
  to: 我的弟兄和儿女们，请听以色列所爱的约瑟说话；要侧耳听我口中的话。
  rationale: 修订仅将“疼爱”改为语义范围更中性的“所爱”，并调整首个呼吁的汉语句法。保留“以色列”的原文称谓及其未明说的指涉，也不采用英语审计文本在后半句补出的“我的儿女／你们的父亲”。原始材料所示上标未附相应脚注内容，故不虚构脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:20:20Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了两组呼吁、约瑟受以色列所爱的关系，以及“我口中的话”。不过“疼爱”比ἠγαπημένου（“所爱／蒙爱”）更具体地限定为亲长对晚辈的疼宠；原文仅陈述“被爱”。
  naturalness: “请听我这蒙以色列疼爱的约瑟说”可以理解，但“我这……约瑟”与“说”的组合稍显拗口。改为“请听以色列所爱的约瑟说话”更符合现代庄重普通话，并保留原文由第三人称自称转入第一人称的话语修辞。
  terminology: “弟兄”“儿女们”“以色列”“侧耳听”“我口中的话”均适合庄重的现代汉语经文语体。“所爱的”比“疼爱的”更中性，且不预先界定“以色列”是父亲名号还是其他联想层面。
  issues:
  - severity: low
    issue: “疼爱”对爱的性质作了较具体的情感限定。
    rationale: ἠγαπημένου的基本义是“被爱、所爱的”，未明示“疼宠”这一亲长式情感色彩。
  - severity: low
    issue: “请听我这……约瑟说”句法略显不顺。
    rationale: 原文以“约瑟”自称，随后转为“我”；汉语可保留此修辞转换，但宜以更自然的“听……约瑟说话”表达。
  revised_text: 我的弟兄和儿女们，请听以色列所爱的约瑟说话；要侧耳听我口中的话。
  revised_footnotes: []
