  text: '*Ἀδελφοί μου καὶ τέκνα μου⁵, Ἀκούσατε Ἰωσὴφ⁶ τοῦ ἠγαπημένου ὑπὸ⁷ Ἰσραήλ⁸, Ἐνωτίσασθε *ῥήματα τοῦ στόματός μου.⁹'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/002.yaml
  text: My brothers and children, listen to Joseph, the beloved of Israel. Pay attention, my children, to your father.
translation:
  language: zh_hans
  text: 我的弟兄和儿女们，请听以色列所爱的约瑟说话；要侧耳听我口中的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφοί μου καὶ τέκνα μου
  choice: 我的弟兄和儿女们
  rationale: 保留两个并列称呼及两处所属关系；“弟兄”庄重自然，也符合古代家族语境。
- source_word: Ἀκούσατε
  choice: 请听……说
  rationale: 将命令式译成现代汉语自然的劝告表达，同时保留郑重呼吁的语气。
- source_word: τοῦ ἠγαπημένου ὑπὸ Ἰσραήλ
  choice: 这蒙以色列疼爱的
  rationale: 忠实呈现被动关系，即约瑟为以色列所爱；“疼爱”适合父亲对子女的情感语境。
- source_word: Ἐνωτίσασθε
  choice: 要侧耳听
  rationale: 保留原词“用耳细听、留心听”的形象和加强语气。
- source_word: ῥήματα τοῦ στόματός μου
  choice: 我口中的话
  rationale: 保存原文的身体意象和复数话语概念，表达简洁而庄重。
theological_decisions:
- issue: “以色列”所指
  choice: 保留“以色列”
  alternative: 明确译作“父亲以色列”或“雅各”
  rationale: 原文只写Ἰσραήλ，可能既是人物名又带有民族联想；不在正文中补明，以保留原文措辞及其潜在张力。
- issue: 后半句的受话对象
  choice: 译作“要侧耳听我口中的话”
  alternative: 按英语咨询文本译成“我的儿女，要留心听你们父亲的话”
  rationale: 希腊文后半句没有再次出现“我的儿女”或“你们的父亲”，因此不采用英语层中扩展性的改写。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的普通话。句式尽量贴近希腊文的两重呼吁结构，同时用“请听我……说”避免汉语中直接说“听约瑟”可能产生的生硬感。
