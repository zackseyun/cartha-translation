  text: Amid slanders he also spoke in my defense. By the bitter words of dreams he rescued me. A servant, he exalted me.
translation:
  language: zh_hans
  text: 受人诽谤时，他也为我申辩；借着梦中苦涩的话语，他救了我。我身为奴仆，他使我升高。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαβολαῖς
  choice: 诽谤
  rationale: 指诬蔑、毁谤之言；译作“诽谤”既贴近原义，也符合现代汉语表达。
- source_word: συνηγόρησέ μοι
  choice: 为我申辩
  rationale: 该动词具有替某人辩护、声援之意；“为我申辩”自然传达其法庭式辩护色彩。
- source_word: λόγοις ἐνυπνίων πικροῖς
  choice: 梦中苦涩的话
  rationale: 保留λόγοις的“话/言语”以及πικροῖς的“苦涩”意象；ἐνυπνίων理解为梦境中的言语，但不进一步判定这些梦由谁所作或向谁而发。
- source_word: ἐρρύσατό με
  choice: 救了我
  rationale: ῥύομαι表示搭救、解救；此处用简洁自然的“救了我”。
- source_word: Δοῦλος
  choice: 身为奴仆
  rationale: δοῦλος在此明确表示奴隶身份；“奴仆”保留受役使的身份含义，同时符合庄重叙事语体。
- source_word: ὕψωσέ με
  choice: 使我升高
  rationale: ὑψόω可指使人升高、提升其地位；“使我升高”保留原文意象，不具体化为某一职位或荣誉。
theological_decisions:
- issue: 连续分句中未明说的主语
  choice: 统一译为“他”
  alternative: 补明为“上帝”或其他特定主体
  rationale: 希腊文动词主语仅由第三人称单数形式体现，本节没有明说身份；沿用“他”可保留上下文所承载的指代，不额外作神学判定。
- issue: ἐν λόγοις的工具或处境含义
  choice: 译为“借着”
  alternative: 译为“在……中”
  rationale: 介词ἐν可表达处境或手段；上下文的拯救关系容许工具性理解，但原句略显凝缩，因此不扩写其具体机制。
- issue: 末句Δοῦλος与动词的句法关系
  choice: 译为“我身为奴仆，他却使我升高”
  alternative: 译为“一个奴仆，他使我升高”或“我作奴仆时，他使我升高”
  rationale: Δοῦλος为省略系词的表语性成分，最自然地指约瑟当时的身份；加入“却”呈现卑微身份与升高之间的鲜明张力，而不添加具体历史解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。三句均保留原文简短、排比式的见证语气；末句用“奴仆”而非泛化为“仆人”，以保留δοῦλος所指的非自由身份。
