  text: Then the trader said to them, “Free me from the judgment of Potiphar.”
translation:
  language: zh_hans
  text: 于是，那商人对他们说：“请释放我，使我免受波提乏的审判。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μετάβολος
  choice: 那商人
  rationale: 此处名词按上下文指从事转卖或交易的人；译作“商人”自然清楚，也与英语审校层一致。
- source_word: Λύσατέ με
  choice: 请救我脱离
  rationale: λύω在此表示使人摆脱某种司法处境；“救我脱离”比直译“解开我”更符合现代汉语，同时保留求援语气。
- source_word: τῆς κρίσεως
  choice: 审判
  rationale: κρίσις可指审判、裁断或判决；原文没有进一步限定，故采用涵盖面较广的“审判”。
- source_word: Πεντεφρί
  choice: 波提乏
  rationale: 采用该人物在现代中文圣经传统中通行的姓名形式。
theological_decisions:
- issue: “审判”所指是审理过程还是判决结果
  choice: 保留为“审判”
  alternative: 判决／定罪
  rationale: 希腊语κρίσις本身可涵盖审理与裁断；不根据上下文擅自收窄，以保留原文歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“于是”承接叙事，用“请”体现命令式在求援语境中的恳求功能。
