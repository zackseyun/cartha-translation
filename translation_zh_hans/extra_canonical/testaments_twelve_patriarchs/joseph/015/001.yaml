  text: '*Ἤθελε γὰρ ὁρᾶν με²⁴ ἐν πόθῳ ⌈ἁμαρτίας⌉²⁵. *ἐγὼ δὲ²⁶ ἠγνόουν ἐν²⁷ πᾶσι τούτοις²⁸. *Εἶπε δὲ πρὸς αὐτήν²⁹· Οὐκ ἐστὶ *τοῦτο τοῖς³⁰ Αἰγυπτίοις πρὸ ἀποδείξεως ἀφαιρεῖσθαι τὰ ἀλλότρια. Ταῦτα ⌜οὖν⌉³¹ εἶπε *περὶ τοῦ μεταβόλου³². *Ὁ δὲ παῖς³³ *ὀφείλει ἐγκατάκλειστος εἶναι³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/001.yaml
  text: For she wanted to see me in sinful desire, but I was unaware of all these things. And he said to her, “This is not the custom among the Egyptians, to take what belongs to others before proof is given.” So he said this concerning the merchant. But the boy ought to be kept confined.
translation:
  language: zh_hans
  text: 因为她怀着罪恶的欲望想见我，我却对这一切毫不知情。他对她说：“埃及人没有这样的规矩：在证据提出之前，就拿走别人的财物。”他这样说，是指那商人而言。不过，这少年应当被关起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “商人”所对应的希腊词含义不甚确定，也可理解为“转卖者”或从事交易的人。
    reason: 提示 μεταβόλου 的词义及具体所指不够明确，但不误称该词在所给底本中有文本传承问题。
lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: 带着罪恶的欲望
  rationale: 保留“欲望”与“罪”的修饰关系，同时用现代汉语自然表达其不正当意图，不擅自限定为某一种具体行为。
- source_word: ἠγνόουν
  choice: 毫不知情
  rationale: 表达约瑟对上述谋划并不知晓；较“无知”更符合现代叙事语境。
- source_word: πρὸ ἀποδείξεως
  choice: 在证据提出之前
  rationale: ἀπόδειξις 可指证明、证据或证实过程；正文采用自然且保留司法意味的表达。
- source_word: τὰ ἀλλότρια
  choice: 别人的财物
  rationale: 中性复数，指属于他人的东西；结合“拿走”译作“财物”较自然。
- source_word: περὶ τοῦ μεταβόλου
  choice: 针对那商人
  rationale: μετάβολος 在此语境中较可能指商人或转卖者；采用英语审校层的语境判断，同时以脚注提示词义不确定性。
- source_word: ὁ παῖς
  choice: 这少年
  rationale: παῖς 可指孩子、少年或仆人；此处指约瑟，用“少年”符合叙事情境且避免误添奴仆身份。
- source_word: ἐγκατάκλειστος εἶναι
  choice: 被关起来
  rationale: 准确表达处于拘禁、禁闭状态，语言自然简洁。
theological_decisions:
- issue: 罪恶欲望的具体性质
  choice: 保留为“罪恶的欲望”
  alternative: 译作“淫欲”或“犯罪的欲望”
  rationale: 原文未在本句明确限定欲望的具体类别；保留较宽泛措辞，以维持原文的张力。
- issue: 说话者身份
  choice: 译作“那人对她说”
  alternative: 按某些上下文理解译作“我对她说”
  rationale: 所给希腊文本明确为第三人称 Εἶπε 与 αὐτήν，因此正文遵从现存文本，不受早期英译修订中的第一人称影响。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留原文第三人称说话者及末句突转为拘禁少年的张力；不为上下文顺畅而擅自改成人称或补充逻辑连接。
