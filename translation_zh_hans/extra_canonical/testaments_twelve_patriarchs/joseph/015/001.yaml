  to: 因为她怀着罪恶的欲望想见我，我却对这一切毫不知情。他对她说：“埃及人没有这样的规矩：在证据提出之前，就拿走别人的财物。”他这样说，是指那商人而言。不过，这少年应当被关起来。[a]
