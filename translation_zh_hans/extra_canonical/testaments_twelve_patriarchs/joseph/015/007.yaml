  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/007.yaml
  text: And they came near and asked me, saying, “Say that you were bought by us with silver, and he will release us.”
translation:
  language: zh_hans
  text: 他们便走近，求我说：“你要说，你是我们用银子买来的，这样他就会释放我们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: 走近
  rationale: 准确表达主动趋近说话者的动作，符合现代汉语叙事习惯。
- source_word: ᾔτουν με
  choice: 求我
  rationale: 保留未完成过去时所呈现的恳求语气；汉语不强行标示持续体。
- source_word: ἐν ἀργυρίῳ ἠγοράσθης
  choice: 用银子买来的
  rationale: 以自然汉语保留工具性表达和被动含义；“银子”在此指作为交易媒介的白银。
- source_word: ἀπολῦσαι ἡμᾶς ἔχει
  choice: 就会释放我们
  rationale: 将ἔχει加不定式理解为预期或将来的行动，并以“就会”自然表达前句陈述所带来的结果。
