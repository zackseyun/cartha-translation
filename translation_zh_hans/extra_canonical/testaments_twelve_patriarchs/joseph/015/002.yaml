base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/002.yaml
  text: “Why did you say that you were a servant? For behold, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”
translation:
  language: zh_hans
  text: “你为什么说自己是奴仆呢？看哪，我们已经得知，你是迦南地一位大人物的儿子；你父亲至今仍在为你哀恸，披麻蒙灰。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον
  choice: 奴仆
  rationale: 准确表达受支配、服役的身份，同时比单用“仆人”更能保留原词所含的奴属意味。
- source_word: ἀνδρὸς μεγάλου
  choice: 一位大人物
  rationale: 保留“重要、显贵之人”的宽泛含义，不擅自限定为富豪、官长或族长。
- source_word: πενθεῖ
  choice: 哀恸
  rationale: 表达因以为亲人已死或失去亲人而持续悲痛的语义，语体庄重而自然。
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: 身披麻衣，坐在灰中
  rationale: 以现代汉语清楚呈现古代举哀姿态；“坐在”是该固定意象在汉语中的自然表达，并未改变其哀悼含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留ἰδοὺ的强调和揭示语气；句法略作汉语化处理，但保留父亲仍在持续哀悼的时间意味。
