  text: Then, indeed, they decided to sell me, so that I might not be found in their hands.
translation:
  language: zh_hans
  text: 于是，他们就决定把我卖掉，免得人发现我在他们手中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε οὖν
  choice: 于是……就
  rationale: Τότε 表示时间推进，οὖν 表示承接或推论；合译为“于是……就”，符合现代汉语叙事习惯，也保留原文的承接意味。
- source_word: ἐβουλεύσαντο
  choice: 决定
  rationale: 该词在此指经过商议后作出决定；“决定”比单纯“商议”更准确地表达不定过去时所述的既成行动。
- source_word: πωλῆσαί με
  choice: 把我卖掉
  rationale: 直接表达出售说话者这一动作；“卖掉”在现代汉语中自然，并带出将其从手中转出的结果。
- source_word: ἵνα μὴ εὑρεθῶ ἐν ταῖς χερσὶν αὐτῶν
  choice: 免得我被发现还在他们手中
  rationale: 保留被动式“被发现”和“在他们手中”的原文意象；补入“还”使目的关系在汉语中清楚，即避免后来查明他们仍控制着约瑟。
