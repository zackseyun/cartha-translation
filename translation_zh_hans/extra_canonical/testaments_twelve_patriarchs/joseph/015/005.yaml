  to: 因为他们惧怕我父亲，唯恐他来到他们中间，为那场危难复仇；因为他们听说，他在上帝和人面前都为大。
  rationale: 本次仅作措辞和现代汉语可读性的有限调整。“来到他们中间”保留ἐν αὐτοῖς；“为那场危难复仇”仍对应ἐκδίκησιν κινδύνου，未补出原文没有明确的报复对象；“在上帝和人面前都为大”贴近παρὰ Θεῷ καὶ ἀνθρώποις与μέγας，并保留其概括性。
