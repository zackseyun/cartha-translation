  - severity: low
    issue: “为那场危险施行报复”搭配生硬
    rationale: “危险”本身通常不是“施行报复”的自然对象或缘由。改作“为那场危难复仇”可保留原文未明言受报复者的含混性，同时更符合汉语习惯。
