  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/005.yaml
  text: For they feared my father, lest he come among them and take vengeance for the danger; for they had heard that he was great before God and men.
translation:
  language: zh_hans
  text: 因为他们惧怕我父亲，唯恐他来到他们中间，为那场危难复仇；因为他们听说，他在上帝和人面前都为大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτοῖς
  choice: 来到他们中间
  rationale: 保留介词短语“在他们中间”的空间含义，不将其简化为仅仅“来”。
- source_word: ἐκδίκησιν κινδύνου
  choice: 为那场危险施行报复
  rationale: 按属格结构直译其较为生硬且可能含混的关系，避免擅自改成“向他们报仇”；“那场危险”指上下文已知的危难。
- source_word: μέγας
  choice: 尊大
  rationale: 表达此人在上帝和人面前地位崇高、受人敬重，而非单指体格或能力“强大”。
- source_word: παρὰ Θεῷ καὶ ἀνθρώποις
  choice: 在上帝和众人面前
  rationale: 贴近希腊语表达，保留其同时涉及神与人的评价或地位这一含义。
theological_decisions:
- issue: 雅各“在上帝和众人面前都为大”的性质
  choice: 译为“在上帝和众人面前都尊大”
  alternative: “在上帝和人中都大有声望”
  rationale: 不限定这是神所赐的权柄、道德评价或社会声望，保留原文概括性的表述。
- issue: 报复的对象或缘由
  choice: 保留“为那场危险施行报复”
  alternative: “向他们报仇”
  rationale: 原文为ἐκδίκησιν κινδύνου，明确出现“危险”的属格；不依据情境擅自将报复对象确定为“他们”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“唯恐……；原来……”自然呈现原文的双重原因说明，并保留“为那场危险施行报复”这一原文略显异常的搭配。
