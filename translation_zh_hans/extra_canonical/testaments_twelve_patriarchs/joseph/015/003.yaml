base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/003.yaml
  text: When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a servant.”
translation:
  language: zh_hans
  text: 我听见这些事，肝肠寸断，心也融化了；我非常想流泪，却克制住自己，免得使我的兄弟们蒙羞。我对他们说：“我不知道；我是奴仆。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: 五内俱裂
  rationale: σπλάγχνα指内脏，并可表达深切情感；διελύθη表示崩解、破碎。译文保留身体意象，同时以现代读者能理解的庄重表达传达极度悲痛。
- source_word: ἡ καρδία μου ἐτάκη
  choice: 心也消融
  rationale: ἐτάκη意为融化、消损；直译式表达保留原文与前一身体意象并列的强烈修辞。
- source_word: ἤθελον δακρῦσαι πάνυ
  choice: 极想痛哭
  rationale: πάνυ加强意愿程度；δακρῦσαι本义为流泪，语境中用“痛哭”自然表达强烈悲情。
- source_word: ἐπέσχον ἐμαυτόν
  choice: 我强忍住自己
  rationale: 表示克制、抑制自己；加入“强”体现前文强烈的哭泣冲动，而不增添新的行为内容。
- source_word: αἰσχύνω τοὺς ἀδελφούς μου
  choice: 使我的兄弟们蒙羞
  rationale: αἰσχύνω可指使人羞愧或蒙羞；此处保留其对象和可能涉及公开难堪的含义，不具体化原因。
- source_word: δοῦλός εἰμι
  choice: 我是个奴仆
  rationale: δοῦλος在此指身份上的奴隶或奴仆；“奴仆”兼顾古代身份语境与中文叙事的庄重自然。
