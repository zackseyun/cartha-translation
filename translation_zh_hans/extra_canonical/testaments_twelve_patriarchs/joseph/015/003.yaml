  rationale: 修订仅改善现代汉语的自然度和意象衔接。“肝肠寸断”对应原文对内在脏腑遭受毁坏的强烈哀痛描写；“心也融化了”直接保留ἐτάκη的融化意象。“流泪”较“痛哭”更精确对应δακρῦσαι，避免把流泪明确强化为放声哭泣。原文所示的校勘符号及编号未提供可译的具体异文或可核实的注释内容，因此不增设脚注。
