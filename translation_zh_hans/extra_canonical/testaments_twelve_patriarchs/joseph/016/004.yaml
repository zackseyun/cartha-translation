  text: Then she sent another eunuch, saying, “Even if they ask two minas, pay them. Do not spare the gold. Only buy the boy and bring him to me.”
translation:
  language: zh_hans
  text: 于是，她派了另一个太监，说：“即使他们索要两弥那，也给他们。不要吝惜金子；只管把那孩子买下来，带到我这里来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχον ἕτερον
  choice: 又一个太监
  rationale: ἕτερον 表示另一个；εὐνοῦχος 在此按通常宫廷职分译为“太监”，自然且符合时代语境。
- source_word: δύο μνᾶς
  choice: 两弥那
  rationale: 保留古代重量兼货币单位 μνᾶ，音译为“弥那”，不擅自折算成现代币值。
- source_word: παρέχετε
  choice: 付给他们
  rationale: 结合 ζητοῦσι“他们要价”的语境，表达按对方所要数额付款；希腊文动词为复数命令式。
- source_word: χρυσίου
  choice: 金子
  rationale: χρυσίον 指黄金或金币；上下文强调购买时不要惜费，译作普通读者易懂的“金子”。
- source_word: τὸν παῖδα
  choice: 那少年
  rationale: παῖς 可指孩子、少年或仆人；此处指约瑟这一年轻男性，译“少年”既保留年龄意味，也避免误释为奴仆身份。
