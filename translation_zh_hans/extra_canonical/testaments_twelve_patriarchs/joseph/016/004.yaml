  naturalness: 修订后命令语气和引语衔接更符合现代标准汉语；“把他带到我这里来”自然表达πρός με，同时不改变叙事的简洁、庄重语体。
  terminology: “太监”在此可对应宫廷语境中的εὐνοῦχος；“弥那”适宜保留为古代货币单位。“金子”可表达χρυσίου，且不强加其究竟为金属还是金币的解释。
