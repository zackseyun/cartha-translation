  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/006.yaml
  text: But I, knowing this, kept silent, so that the eunuch might not be put to shame.
translation:
  language: zh_hans
  text: 但我知道这事，却保持沉默，免得那太监蒙羞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: 知道这事
  rationale: 该词是 οἶδα 的完成时主动分词，表示已知情；补出“这事”使现代汉语自然，并承接上下文。
- source_word: ἐσιώπησα
  choice: 保持沉默
  rationale: 准确表达主动不作声、没有揭露此事的含义。
- source_word: αἰσχυνθῇ
  choice: 蒙羞
  rationale: 保留被动语态以及“受到羞辱、感到羞耻”的语义空间，不额外限定羞耻来自公开揭露还是内心感受。
- source_word: ὁ εὐνοῦχος
  choice: 那太监
  rationale: εὐνοῦχος通常指被阉割并任职宫廷的男子；定冠词结合语境指前文已知的特定人物，故译“那太监”。
