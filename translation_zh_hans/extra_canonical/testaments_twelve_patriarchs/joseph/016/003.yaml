  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/003.yaml
  text: But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.
translation:
  language: zh_hans
  text: 可是，那位阉人不愿买下我，试探了他们一番后便离开了，并向自己的女主人报告说，他们给这少年要价很高。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: 太监
  rationale: 该词通常指宫廷中的阉官；“太监”在现代汉语中自然明确，并与人物的家内职务背景相符。
- source_word: πειράσας αὐτούς
  choice: 试探了他们一番
  rationale: 保留πειράζω在此处“试探、摸清意向”的含义，不具体化为讨价还价，以免超出原文。
- source_word: δεσποίνῃ
  choice: 女主人
  rationale: 指拥有权柄的女性主人；译作“女主人”既准确，也避免擅自补入其身份或头衔。
- source_word: πολλὴν τιμὴν αἰτοῦσιν
  choice: 索要很高的价钱
  rationale: τιμή在买卖语境中指价格；“索要很高的价钱”自然传达对方开价甚高。
- source_word: τοῦ παιδός
  choice: 这少年
  rationale: παῖς可指孩子、少年或仆役；此处所指是约瑟本人，按买卖场景译作“这少年”，同时不强化其奴仆身份。
