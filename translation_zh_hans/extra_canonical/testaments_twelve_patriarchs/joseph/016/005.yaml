  text: So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”
translation:
  language: zh_hans
  text: 于是，那太监来付给他们八十枚金币，把我带走了；但他却对那埃及妇人说：“我付了一百枚。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: 太监
  rationale: 该词通常指被阉割、在宫廷或权贵家中任职的男子；“太监”是现代汉语中最直接自然的对应词。
- source_word: ὀγδοήκοντα χρυσοῦς
  choice: 八十枚金币
  rationale: χρυσοῦς在此为名词用法，指金币；添加量词“枚”符合现代汉语表达。
- source_word: ἀνελάβετό με
  choice: 把我带走了
  rationale: 在买卖交易的语境中表示接收并带走约瑟；避免将动作过度具体化为“买下”。
- source_word: Αἰγυπτίᾳ
  choice: 埃及妇人
  rationale: 阴性名词表示一名埃及女子；结合上下文，用“埃及妇人”既明确性别，又不额外断定其身份。
- source_word: δέδωκα ἑκατόν
  choice: 我付了一百枚
  rationale: 完成时强调款项已经付出；中文用“付了”自然表达。宾语“金币”可由前句承接，补出量词“枚”以使数字表达完整。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留原文中实际支付八十枚、却声称支付一百枚的鲜明对比，不解释其动机。以分号呈现两个相对照的分句，并用“却”自然传达δέ的转折。
