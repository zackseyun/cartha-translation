  text: But Memphis said to her husband, “Buy the young man, for I hear,” she says, “that they are selling him.”
translation:
  language: zh_hans
  text: 孟斐斯却对她丈夫¹说：“买下那个年轻人²吧；我听说，”她说³，“他们在卖他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφὶς
  choice: 孟斐斯
  rationale: 按希腊文音译人名，并保留其女性身份。
- source_word: Ἀγόρασον
  choice: 把……买下来吧
  rationale: 准确表达第二人称单数命令语气；加“下来”符合现代汉语交易语境。
- source_word: τὸν νεανίαν
  choice: 这个年轻人
  rationale: νεανίας指年轻男子；定冠词在当前指称语境中自然译为“这个”。
- source_word: ἀκούω
  choice: 我听说
  rationale: 在后接ὅτι内容从句时，译为“听说”比字面“听见”自然。
- source_word: φησίν
  choice: 她说
  rationale: 保留原文插入式叙述语，虽有重复感，却忠实反映现存希腊文本。
- source_word: πωλοῦσιν αὐτόν
  choice: 他们要卖他
  rationale: πωλοῦσιν为现在时，表示正在进行或即将发生的出售；汉语用“要卖”自然传达当前出售意图，αὐτόν译作“他”避免不必要重复。
