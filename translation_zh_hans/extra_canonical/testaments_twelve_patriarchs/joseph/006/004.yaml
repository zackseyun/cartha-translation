  text: Then after one day she came to me, and when she noticed the food, she said to me, “Why is it that you did not eat the food?”
translation:
  language: zh_hans
  text: 一天以后，她来到我这里，注意到那食物，就对我说：“你为什么没有吃这食物？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ μίαν ἡμέραν
  choice: 一天以后
  rationale: 自然表达时间间隔；δέ在此主要承接叙事，无须机械译出。
- source_word: ἐλθοῦσα πρός με
  choice: 她来到我这里
  rationale: 贴合希腊文的方向表达，同时符合现代汉语叙事习惯。
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  choice: 看见那食物还在那里
  rationale: ἐπιγινώσκω在此语境表示注意到、察觉到；结合随后询问为何没吃，补出“还在那里”所蕴含的情境信息，避免生硬译作“认出食物”。
- source_word: Τί τοῦτο ὅτι οὐκ ἔφαγες τοῦ βρώματος
  choice: 你为什么没有吃这食物？
  rationale: 按现代汉语自然问法传达原因追问；希腊文属格τοῦ βρώματος在ἐσθίω后可表示所吃之物，不必译成“吃一些”。
