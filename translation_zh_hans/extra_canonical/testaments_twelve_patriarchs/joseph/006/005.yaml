  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/005.yaml
  text: And I said to her, “You have filled it with the sorcery of death. And how could you say, ‘I do not draw near to idols, but to the Lord alone’?”
translation:
  language: zh_hans
  text: 我对她说：“你使它充满了死亡的邪术。你怎能说：‘我不亲近偶像，只亲近主’呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλήρωσας αὐτὸ
  choice: 你在其中充满了
  rationale: 保留第二人称动作及中性代词所指对象，但因本节缺少明确先行词，以“其中”自然表达而不擅自补明。
- source_word: γοητείας θανάτου
  choice: 致死的邪术
  rationale: γοητεία指巫术、邪术；θανάτου可表达与死亡相关或带来死亡，译作“致死的”符合语境，同时保持短语力度。
- source_word: πῶς εἶπας
  choice: 你怎么还能说
  rationale: 这里不是单纯询问说话方式，而是质疑其言行矛盾；“怎么还能说”自然传达责问语气。
- source_word: προσεγγίζω
  choice: 亲近
  rationale: 基本义是靠近、接近；在宗教对象语境中，“亲近”既自然，也不额外限定为敬拜或献祭。
- source_word: τοῖς εἰδώλοις
  choice: 偶像
  rationale: 采用现代汉语中清楚而传统的对应词。
- source_word: τῷ Κυρίῳ μόνῳ
  choice: 只亲近主
  rationale: μόνῳ强调排他性，译作“只”；Κύριος在宗教语境中译作“主”。
theological_decisions:
- issue: “亲近偶像/主”的宗教含义
  choice: 保留“亲近”
  alternative: 敬拜／事奉
  rationale: 原文προσεγγίζω本身是“靠近、亲近”，可能含宗教归附之意，却没有明确使用“敬拜”或“事奉”；不将潜在含义窄化。
- issue: “死亡”的修饰关系
  choice: 致死的邪术
  alternative: 死亡的邪术
  rationale: 希腊语属格θανάτου存在一定语义张力；正文采用较自然且符合威胁语境的结果性表达，但不引入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留直接责问的力度，并避免补出“其中”所指的具体对象，以尊重本节原文中的指代含混。
