  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/006.yaml
  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
translation:
  language: zh_hans
  text: “所以，现在你要知道：我父亲的上帝借着他的天使，把你的恶行揭示给了我。我把它保存下来，作指证你的凭据[a]，盼望你看见它后或许会悔改。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上下文中约瑟所保存的某物；希腊文在此只用代词。译作“指证你的凭据”对应“为你的ἔλεγχος”，该词可指用以揭露、证实过失或使人知罪的事物。
    reason: 说明代词的所指须由上下文补足，并保留ἔλεγχος在揭露、指证与使人知罪之间的语义张力，而不将其限定为正式司法定罪。
lexical_decisions:
- source_word: γνῶθι
  choice: 你要知道
  rationale: 保留第二人称单数命令语气；结合下文阴性分词可知受话者为女性，但现代汉语无需标示语法性别。
- source_word: ὁ Θεὸς τοῦ πατρός μου
  choice: 我父亲的上帝
  rationale: 按希腊语属格结构直译，保留族长传统中的关系性称谓。
- source_word: δι’ ἀγγέλου αὐτοῦ
  choice: 借着他的天使
  rationale: διά加属格表示媒介；“天使”自然传达ἄγγελος在此处的超自然使者含义。
- source_word: τὴν κακίαν σου
  choice: 你的恶行
  rationale: κακία可指邪恶、恶意或恶行；此处涉及已经显露的加害行为，译作“恶行”自然，同时不将其过度限定为单纯内心动机。
- source_word: ἀπεκάλυψέ μοι
  choice: 把……揭示给了我
  rationale: 体现ἀποκαλύπτω“揭开、显明”的意思，并保留间接受词“给我”。
- source_word: ἐφύλαξα αὐτό
  choice: 把它留了下来
  rationale: φυλάσσω在语境中指保存、留存；αὐτό指代前文语境中的物件，但本句自身没有重述其名称，因此正文保留代词。
- source_word: εἰς ἔλεγχόν σου
  choice: 作为指证你的证据
  rationale: ἔλεγχος可表示揭露、责备、定罪或证明。此处所保存之物用于使对方面对其行为，译文兼顾证据性和指证功能。
- source_word: εἴπως ἄρα
  choice: 盼望……或许
  rationale: 保留原文带有期待而又不确定的语气，不把悔改说成必然结果。
- source_word: ἰδοῦσα μετανοήσεις
  choice: 你看见后……会悔改
  rationale: ἰδοῦσα为阴性单数分词，与女性受话者一致；μετανοέω译作“悔改”，保留道德与意向转变的力度。
theological_decisions:
- issue: 上帝如何使约瑟知道对方的恶行
  choice: 借着他的天使……揭示给了我
  alternative: 他的天使警告了我／上帝亲自让我知道
  rationale: 原文明确同时陈述上帝是启示者、天使是媒介；译文不削弱其中任何一方，也不进一步界定启示的具体方式。
- issue: 保留证物的目的与悔改的关系
  choice: 作为指证你的证据，盼望你……或许会悔改
  alternative: 为了定你的罪／为了迫使你悔改
  rationale: ἔλεγχος含揭露与指证意味，而εἴπως ἄρα保留不确定的盼望；译文避免把目的单纯化为惩罚，也不把悔改写成受强制或必然发生。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“所以，现在你要知道”保留论述推进和命令语气；后半句用“指证你的证据”表达司法性与道德揭露意味，同时以脚注说明原文的代词与词义空间。
