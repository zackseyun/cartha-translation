  text: And after this she sent me food mixed with sorcery.
translation:
  language: zh_hans
  text: 此后，她给我送来掺有巫术的食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: 送来
  rationale: 此处是历史叙事中的现在时，用自然的汉语过去叙事表达；结合间接受词 μοι，译为“给我送来”。
- source_word: βρῶμα
  choice: 食物
  rationale: 采用宽泛而自然的对应词，不把原文限定为某一种食品。
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: 掺了巫术的
  rationale: πεφυρμένον 表示“混合、掺入”，ἐν γοητείᾳ 指借助或带有巫术；这一译法保留原文所说食物与巫术相混的异常性质，而不擅自具体化为毒药或符咒。
theological_decisions:
- issue: 巫术与食物相混的具体方式
  choice: 保持笼统，译作“掺了巫术的食物”
  alternative: “施过巫术的食物”或“掺有巫药的食物”
  rationale: 原文没有说明是仪式性的施法，还是加入某种用于巫术的物质；因此不作进一步解释，以保留语义张力。
translation_notes:
  register: 采用简洁、庄重而通顺的现代汉语。“又”体现叙事推进，并自然传达 μετὰ τοῦτο 后续发生的另一行动。
