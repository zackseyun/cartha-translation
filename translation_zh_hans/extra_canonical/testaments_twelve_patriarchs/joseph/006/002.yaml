    issue: “面目可怖的人”过度限定φοβερὸν ἄνδρα。
    rationale: φοβερός表达可怕、令人畏惧，并不特指面容；“一个可怕的人”更贴近原文的开放性。
  - severity: medium
    issue: “偏离正道”补出了原文没有明说的“正道”。
    rationale: ἀποπλάνησις意为使人迷失、引入歧途；不必指定所偏离的规范或对象。
  - severity: low
