  text: '*Ὡς δὲ⁴ ἦλθεν ὁ⁵ εὐνοῦχος ὁ κομίζων αὐτό⁶, *ἀνέβλεψα καὶ⁷ εἶδον *φοβερὸν ἄνδρα⁸ ἐπιδιδόντα μοι *μετὰ τοῦ τρυβλίου⁹ μάχαιραν· καὶ συνῆκα ὅτι¹⁰ *περιέργεια ἐστὶν εἰς ἀποπλάνησίν μου¹¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/002.yaml
  text: But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me a sword with the dish; and I understood that it was a scheme to lead me astray.
translation:
  language: zh_hans
  text: 但拿着那盘食物的太监来到时，我抬眼一看，只见一个可怕的人连同那盘子一起递给我一把刀；我便明白，这是要把我引入歧途的诡计。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: 太监
  rationale: 此处指宫廷中的阉人；“太监”是现代汉语中自然、易懂的对应词。
- source_word: τρυβλίον
  choice: 盘子
  rationale: 该词指盛放食物的盘、碟；结合κομίζων αὐτό所指的食物，译作“盘子”简洁自然。
- source_word: μάχαιρα
  choice: 刀
  rationale: 原词可指刀、短剑；此处没有足够语境确定具体兵器，采用较宽泛的“刀”以保留词义范围。
- source_word: περιέργεια
  choice: 诡计
  rationale: 该词在此语境中不是一般的“好管闲事”，而是指暗中施行的伎俩或阴谋；“诡计”符合诱惑约瑟的情境。
- source_word: ἀποπλάνησις
  choice: 诱使我偏离正道
  rationale: 保留“使人离开、迷失”的使动含义，同时以自然汉语表达其道德层面的诱惑，未具体限定为某一种罪。
theological_decisions:
- issue: ἀποπλάνησις所指偏离的对象未明说
  choice: 偏离正道
  alternative: 使我迷失／把我引入歧途
  rationale: 原文只表达被诱离或被引入迷途，并未明确补出神、律法或贞洁等对象；“偏离正道”保持道德含义而不增添宗派性解释。
- issue: “面目可怖的人”是现实人物还是异象中的象征
  choice: 按叙述直译为“一个面目可怖的人”
  alternative: 一个可怕的灵／恶魔
  rationale: 原文仅作φοβερὸν ἄνδρα，没有明确称其为灵体或恶魔，因此不作神学身份判定。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。“随着盘子递给我一把刀”保留μετὰ τοῦ τρυβλίου所表达的伴随关系，也避免把刀解释为藏在盘中。
