  source_fidelity: “面目可怖”将φοβερὸν ἄνδρα较具体地限为外貌；原文只说“可怕／令人畏惧的人”。此外，“偏离正道”虽可表达引入歧途的含义，但补入了原文未明说的“正道”。修订保留其诱骗、使人迷失的使动意义。
  naturalness: 原译整体通顺，但“随着盘子递给我一把刀”略显生硬，且“随着”容易使伴随关系的施事不够明确。改为“连同那盘子一起递给我一把刀”，较自然地保留μετὰ τοῦ τρυβλίου的伴随关系，而不断言刀藏在盘中。
  terminology: “太监”“盘子”“刀”“诡计”均可接受。为避免对ἀποπλάνησις作额外道德对象的补足，采用“把我引入歧途”。
  issues:
