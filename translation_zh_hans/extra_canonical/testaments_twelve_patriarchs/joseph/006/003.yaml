  source_fidelity: 草稿保留了“他出去以后”、那一样食物与她其他食物的对照，也以脚注提示两个带校勘标记的短语。不过，原文的主要动作是“我哭泣”，而“没有尝”以分词说明未曾品尝；草稿改为先后两次“没有吃”，使“吃”成为主要断言，并略偏离γεύομαι（尝、品尝）的表述。
  naturalness: “只是哭泣”在现代汉语中容易被理解为“除了哭什么也不做”，语义强于原文的并列叙述；“一口也没有尝”自然，但与前面两次“没有吃”重复。改为“我哭泣，没有尝……”更简洁，并更贴合原句结构。
  terminology: “那一样食物／她的其他任何食物”保留单数的ἐκείνου与复数“其他食物”的对照。此处没有需要特别处理的神学术语或专名。
