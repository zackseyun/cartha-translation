  text: And after he had gone out, I ate neither that food nor any of her other foods, but wept, not having tasted them.
translation:
  language: zh_hans
  text: 他出去以后，我哭泣，没有尝那一样食物，也没有尝她的其他任何食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些希腊文抄本在“他出去以后”和“哭泣”的措辞上存在异文，但句子的基本意思不变。
    reason: 源文本的校勘符号标示ἐξελθόντος αὐτοῦ和ἔκλαιον存在文本异读；正文采用所给校勘文本，脚注提示读者存在抄本差异而不臆造未提供的具体读法。
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: 他出去以后
  rationale: 以自然的现代汉语表达属格绝对结构所标明的先行动作，同时保留代词所指的男性人物。
- source_word: ἐκείνου
  choice: 那一样食物
  rationale: 保留希腊文单数指示代词与后面的复数“其他食物”之间的对照；按语境补出“食物”。
- source_word: ἄλλου τῶν ἐδεσμάτων αὐτῆς
  choice: 她其他的食物
  rationale: 自然表达“属于她／由她提供的其他食物”，不额外断定食物的具体来源或制作方式。
- source_word: ἔκλαιον
  choice: 只是哭泣
  rationale: 未完成过去时描写持续的哭泣；“只是”使其与没有进食形成自然对照，但不增加新的事件。
- source_word: μὴ γευσάμενος
  choice: 一口也没有尝
  rationale: 将否定的分词结构译成通顺汉语，明确强调完全没有品尝，与前面的未吃相呼应。
