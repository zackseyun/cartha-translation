base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020.yaml
  text: '1[[to the Hippodrome]]. For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.


    2. But you shall carry up my bones with you[3a], for when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.


    3. And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.


    3a. But another reading says: “And bring up Zelpha your mother, and place her near Bilhah [by the Hippodrome], close to Rachel.”


    12. For my kingdom among you will be brought to completion like a watchman’s hut in an orchard[12b][12], which does not appear after the summer.”'
translation:
  language: zh_hans
  text: '《约瑟遗训》第20章


    1 我知道，我死后，埃及人必压迫你们；但上帝必为你们施行报应，并领你们进入你们列祖所蒙的应许。


    2 然而，你们要把我的骸骨一同带上去；因为我的骸骨被带到那里时，主必在光明中与你们同在，彼列[a]却必在黑暗中与埃及人同在。


    3 你们也要把你们的母亲亚西纳带到〔赛马场旁〕[b]，将她葬在我母亲拉结附近。[c]


    4 说完这些话，他伸直双脚，安然长眠了。


    5 以色列全体和全埃及都为他大大哀悼。


    6 以色列子孙出埃及时，收集了约瑟的骸骨，将他葬在希伯仑，与他的列祖同葬。他一生的年日是一百一十岁。[d]


    12[e] 因为他的国必是永远的国，永不消逝；我的国却在你们中间逐渐完结，如同果园里守望人的棚屋[f]，夏季过后就消失了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”音译自希腊文 Βελίαρ，是本文中人格化的邪恶者；这里不将其直接改译为“撒但”。
    reason: lexical_clarity
  - marker: b
    text: “赛马场旁”在所给希腊见证中以括号标出，文本归属不确定。
    reason: textual_variant
  - marker: c
    text: 另有见证作：“你们要把你们的母亲悉帕带上去，把她安置在辟拉附近〔赛马场旁〕，靠近拉结。”
    reason: alternative_reading
  - marker: d
    text: 第6节在所给希腊文本中以特殊括号标出，显示其在该见证中的文本归属或传承地位不确定。
    reason: textual_variant
  - marker: e
    text: 所给来源在第6节之后附有一段与前章第12节相呼应的文字；这里依审校层标作第12节。编号的跳跃反映来源文本可能经过压缩、摘录或重排。
    reason: textual_variant
  - marker: f
    text: 这是收获季节供守望者暂住的简陋棚屋，季节过去便会被弃置；这一意象与《以赛亚书》1:8相近。
    reason: cross_reference
lexical_decisions:
- source_word: τελευτή
  choice: 死
  rationale: 遗训语境明确指约瑟死亡；“死”直接、庄重，不将其弱化为一般的“离去”或“终结”。
- source_word: θλίψουσιν
  choice: 必压迫
  rationale: 表达埃及人持续施加的苦待，符合出埃及背景，也保留动词的强度。
- source_word: ἐκδίκησιν
  choice: 施行报应
  rationale: 该词可指报复、伸冤或惩治；“施行报应”保留上帝主动反转压迫、为受害者伸冤的力度，而不局限于私人复仇。
- source_word: ἐπάξει
  choice: 领……进入
  rationale: 原文表达带领进入，并未明说“返回”；此译法避免擅加回归之意。
- source_word: ἐπαγγελίας
  choice: 所蒙的应许
  rationale: 保留复数应许的盟约意味，同时使“进入应许”这一希腊语表达在现代汉语中较自然。
- source_word: συνανοίσετε
  choice: 一同带上去
  rationale: 保留与以色列人同行以及从埃及上行的方向感，不简化成一般的“带走”。
- source_word: ἐν φωτί / ἐν σκότει
  choice: 在光明中 / 在黑暗中
  rationale: 维持原文严格对称的光暗意象及其末世性、道德性张力。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 按希腊文 Βελίαρ 音译为传统汉语较熟悉的“彼列”，不在正文中解释成“撒但”或抽象的“邪恶”。
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: 安然长眠了
  rationale: 原文直译为“睡了美好的睡眠”，是委婉述死；“安然长眠”自然保留安息意象。
- source_word: ὀπωροφυλάκιον
  choice: 果园里守望人的棚屋
  rationale: 指果园或收获地中守望者使用的临时棚舍；具体译出其用途，以保存季节过后消失的比喻。
- source_word: ἐπιτελεῖται
  choice: 将走到尽头
  rationale: 此处与前句永不消逝的国形成对比，意为约瑟的国完成其历程、归于终结；“走到尽头”保留完成与终止的双重色彩。
theological_decisions:
- issue: 上帝的 ἐκδίκησις
  choice: 上帝主动为受压迫者施行报应
  alternative: 仅译为上帝眷顾、主持抽象公义，或淡化为拯救
  rationale: 希腊名词具有报应和伸冤的力度；正文保留这一神学张力，同时用“报应”避免将其缩窄为人的私仇。
- issue: 彼列与光暗对照
  choice: 保留人格化的“彼列”，以及主在光中、彼列在黑暗中的平行结构
  alternative: 将彼列解释为“邪恶”，或直接同一化为“撒但”
  rationale: 原文使用人格化专名并刻意构成光暗对照；不应在正文中消解或教派化解释这一意象。
- issue: “他的国”与“我的国”的对照
  choice: 照译第三人称“他的国”和第一人称“我的国”，不为“他”指定身份
  alternative: 在正文中把“他”明确解释为上帝、弥赛亚或某位特定人物
  rationale: 所给文本片段缺少足以确定指代的直接上下文；保留代词才能保存原文的真实歧义及永恒国度与约瑟有限国度之间的张力。
- issue: 亚西纳安葬指示的文本不稳定
  choice: 正文采用所给希腊文的亚西纳—拉结读法，异读置于脚注
  alternative: 采用悉帕—辟拉异读，或把两种读法揉合
  rationale: 主希腊文本明确载亚西纳和拉结；脚注公开另一见证，不静默协调冲突。
- issue: 第6节的文本地位
  choice: 纳入正文并标注其见证状态
  alternative: 因可能属于后加的结语而删除
  rationale: 句子出现在所给希腊来源中，虽以特殊括号标示；翻译应保留，并通过脚注透明呈现其文本不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。叙事句保持简洁；预言与国度对照保留较强的平行结构。正文完整翻译所给希腊来源中第1—6节及末尾附接的第12节回声，不以英文咨询层的删节取代希腊文本；凡文本不稳、异读和编号断裂，均以脚注明示。
