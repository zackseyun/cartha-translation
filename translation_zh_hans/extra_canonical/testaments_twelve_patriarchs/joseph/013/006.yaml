  text: And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”
translation:
  language: zh_hans
  text: 他把我和那人分开后，问我：“你是奴隶，还是自由人？”我回答：“奴隶。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαχωρίσας με ἀπ᾿ αὐτοῦ
  choice: 把我和那人分开后
  rationale: 保留分词的先行动作及ἀπό所表达的分离关系；用“那人”自然指代前文中的男性对象。
- source_word: Δοῦλος
  choice: 奴仆
  rationale: 在与ἐλεύθερος（自由人）对举的身份语境中，指非自由身份；“奴仆”既准确又适合庄重叙事。
- source_word: ἐλεύθερος
  choice: 自由人
  rationale: 明确表达与奴仆相对的法律或社会身份，避免仅译“自由”所可能造成的抽象理解。
- source_word: λέγει μοι / εἶπον
  choice: 问我 / 我回答
  rationale: 直译均为“对我说/我说”，但上下文是问答；按现代汉语自然表达显明语用功能，不增加原文信息。
