  text: But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked and beaten.
translation:
  language: zh_hans
  text: 他对我说：“你确实在撒谎。”随即，他下令把我也脱光衣服后殴打。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὄντως
  choice: 确实
  rationale: 准确表达“真正地、确实”的强调语气，同时保持自然的现代汉语。
- source_word: ψεύδῃ
  choice: 在撒谎
  rationale: 此处为直接指控，译为“在撒谎”比静态的“是说谎的”更符合汉语口语和叙事语境。
- source_word: εὐθὺς
  choice: 随即
  rationale: 体现动作紧接发生，语体简洁而庄重。
- source_word: ἐκέλευσε
  choice: 下令
  rationale: 保留命令者所具有的权势以及使役含义。
- source_word: κἀμέ
  choice: 把我也
  rationale: κἀμέ即καὶ ἐμέ，明确保留“也”的附加意味。
- source_word: γυμνὸν τύπτεσθαι
  choice: 剥光了毒打
  rationale: 保留赤裸受打的双重羞辱与暴力；“毒打”自然传达反复或严厉击打，不弱化原文。
