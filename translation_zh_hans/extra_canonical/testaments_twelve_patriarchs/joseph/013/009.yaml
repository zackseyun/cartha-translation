review_pass:
  verdict: revise
  source_fidelity: “确实在撒谎”“随即”“下令”“也”均准确对应ὄντως、ψεύδῃ、εὐθύς、κἀμέ。末句的“毒打”则加入了原文τύπτεσθαι本身未明示的严厉程度；原文只说命令将“我也”在赤裸状态下受殴打。
  naturalness: 原译整体通顺，但“把我也剥光了毒打”略显口语化且容易把“剥光”和“毒打”合并为一个加强性的处置。改为“脱光衣服后殴打”更清楚地表达使役结构和赤裸受打的情形。
  terminology: 无需处理专门神学术语。保留“下令”以传达ἐκέλευσε的权威性使役语气。
  issues:
