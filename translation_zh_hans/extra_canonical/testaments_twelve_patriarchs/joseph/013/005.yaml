  text: And when I was brought in, I bowed down to Pentephris, for he was third in rank among Pharaoh’s rulers.
translation:
  language: zh_hans
  text: 我被带进去后，就向潘特弗里斯下拜，因为他在法老的官长中位居第三。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσαχθείς
  choice: 被带进去后
  rationale: 保留不定过去时被动分词的被动含义，并用自然的现代汉语表达先后关系。
- source_word: προσεκύνησα
  choice: 下拜
  rationale: 该词表示俯身或伏地下拜；此处对象是官员，译作“下拜”既体现敬礼动作，也不引入敬拜神明的含义。
- source_word: Πεντεφρῇ
  choice: 潘特弗里斯
  rationale: 按希腊文专名转写，并参考英语审校层所保留的 Pentephris 形式，不把它直接等同并替换为其他传统人名。
- source_word: τρίτος … ἐν ἀξιώματι
  choice: 位居第三
  rationale: 表达其官阶或地位为第三，符合上下文中的行政等级含义。
- source_word: παρὰ τῶν Φαραὼ ἀρχόντων
  choice: 在法老的官长中
  rationale: 结合句法与英语审校层，表达他在法老所属官员群体中的相对位次；避免生硬照译介词结构。
