  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/002.yaml
  text: But the broker fell at his feet and begged, saying, “I beg you, lord, I do not know what you are saying.”
translation:
  language: zh_hans
  text: 那中间人却伏倒在他脚前，恳求说：“求求你，大人，我不知道你说的是什么。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: 中间人
  rationale: 此词可指居间交涉或撮合交易的人；“中间人”在现代汉语中自然，也避免把角色过度限定为特定商业职业。
- source_word: πεσὼν εἰς τοὺς πόδας αὐτοῦ
  choice: 俯伏在他脚前
  rationale: 保留“落到/伏在某人脚前”的姿态含义；“俯伏”比字面的“倒在”更符合此处恳求的场景。
- source_word: ἐδέετο
  choice: 恳求
  rationale: 表达持续或强烈请求的语气，并与随后直接引语中的 Δέομαί σου 相区分。
- source_word: κύριε
  choice: 大人
  rationale: 这里是对人的尊称，不必译成带有明确神学意味的“主”；“大人”保留尊敬和上下身份差异。
- source_word: οὐκ οἶδα ὃ λέγεις
  choice: 我不知道你说的是什么
  rationale: 自然传达希腊语“我不知道你所说的（事）”，保留其可能表示不明白或否认知情的语用张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“求求你”传达 Δέομαί σου 的直接哀求语气；全句不增补希腊文未明说的“向他”等宾语。
