  text: But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”
translation:
  language: zh_hans
  text: 他却说：“你怎么成了他们的奴仆？”我说：“他们从迦南地把我买来了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: 奴仆
  rationale: 准确表达受人所有、服役的身份，同时保持叙事语言庄重自然；较“仆人”更能体现被买卖的处境。
- source_word: ἐκ γῆς Χαναὰν
  choice: 从迦南地
  rationale: 保留希腊文介词短语的来源含义，并采用现代中文圣经语体中自然的地名表达。
- source_word: ἐπριάσαντό με
  choice: 把我买来了
  rationale: 明确表达他们购买约瑟这一动作；加入趋向补语“来”使中文自然，也与“从迦南地”相配。
