revisions:
- from: 潘特弗里斯听信了她的话，便吩咐那名中间商前来，对他说：“我听说你从迦南地偷来人口[a]，转卖为奴仆，这是怎么回事？”
  to: 潘特弗里斯听信了她的话，就吩咐那名中间商前来，对他说：“我听说你从迦南地偷走了人[a]，又把他们转卖作奴仆；这是怎么回事？”
  rationale: 本次修订仅改善现代汉语的准确性与自然度：以“偷走了人”取代易产生统计学含义的“偷来人口”，并以“把他们转卖作奴仆”使控告对象和转卖结果更清晰。人名、经纪角色、迦南地及转卖含义均予保留。
