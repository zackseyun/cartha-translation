  source_fidelity: 译文准确传达了 Πεντεφρὶς 听信妻子的话、命令中间商前来，以及对其从迦南地盗取并转卖人的控告。惟“偷来人口”在现代汉语中易被理解为与人口统计有关，且不如原文“偷走人”直接。
  naturalness: 整体叙事自然庄重；将“偷来人口”改为“偷走了人”可消除搭配上的生硬和歧义。“把他们转卖作奴仆”也比“转卖为奴仆”更符合现代汉语对人的处置表达。
  terminology: “潘特弗里斯”忠实保留该书希腊文本的人名形式；“中间商”可对应 μετάβολον。“人”在正文中恰当表达 ψυχὰς 的此处用法，脚注保留其“灵魂”的字面信息。“奴仆”可涵盖 παῖδας 在此人口买卖语境中的奴役/服役含义，未不当地限定性别或年龄。
