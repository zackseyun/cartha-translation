    rationale: 现代汉语“人口”通常指一个地区的人口数或人口总体；原文 ψυχὰς 在此是“人”的用法。改作“偷走了人”更清楚地表达 κλέπτεις，且避免现代行政或统计语义。
  - severity: low
    issue: “转卖为奴仆”略显生硬
    rationale: 以“把他们转卖作奴仆”明确转卖的对象并使结果补语更自然，同时保留 μεταπωλεῖς 与 παῖδας 的含义。
