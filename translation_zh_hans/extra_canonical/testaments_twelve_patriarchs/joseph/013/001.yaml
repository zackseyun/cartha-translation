  text: But Pentephris, persuaded by her words, ordered the broker to come, and said to him, “What is this that I hear concerning you, that you steal souls from the land of Canaan and sell them as servants?”
translation:
  language: zh_hans
  text: 潘特弗里斯听信了她的话，就吩咐那名中间商前来，对他说：“我听说你从迦南地偷走了人[a]，又把他们转卖作奴仆；这是怎么回事？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”原文直译为“灵魂”，这里指人。
    reason: 保留 ψυχὰς 的字面信息，同时避免正文使用“偷灵魂”或“人口”而造成不合语境的理解。
lexical_decisions:
- source_word: Πεντεφρὶς
  choice: 潘特弗里斯
  rationale: 按希腊文人名音译，避免直接改用正典叙事中较熟悉的“波提乏”，从而保留本书文本的人名形式。
- source_word: μετάβολον
  choice: 中间商
  rationale: 此词在语境中指参与转手买卖的人；“中间商”比单纯的“商人”更能体现其居间转卖的角色。
- source_word: ψυχὰς
  choice: 人口
  rationale: ψυχή 字面为“灵魂、生命”，但复数在此指人；“人口”既自然，又适合“从某地偷来”的人口贩运语境。
- source_word: μεταπωλεῖς
  choice: 转卖
  rationale: 该动词含再次出售、转手出售之意；译作“转卖”保留其前缀所表达的交易链条。
- source_word: παῖδας
  choice: 奴仆
  rationale: παῖς 可指孩子、仆人或奴仆；此处与人口买卖相连，故采用“奴仆”，同时不额外强化为现代制度术语。
- source_word: ἐκέλευσεν ἐλθεῖν
  choice: 吩咐……前来
  rationale: 贴近不定式“来”的主动表达，不改写成“命人把他带来”。
