  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/004.yaml
  text: But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”
translation:
  language: zh_hans
  text: 可是，他不相信那人，反而下令让他赤身受打。他仍坚持这样说，彭提弗里斯便说：“那么，把这个年轻人带来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐπίστευσεν αὐτῷ
  choice: 不相信那人
  rationale: 保留间接宾语所指对象，同时用现代汉语自然表达“不信他所说的话”。
- source_word: γυμνὸν τύπτεσθαι
  choice: 把他脱光了鞭打
  rationale: γυμνόν表明受刑时赤身，τύπτεσθαι泛指受击打；结合惩罚语境译作“鞭打”，清楚而自然。
- source_word: Ἐπιμένοντος δὲ αὐτοῦ τούτοις τοῖς λόγοις
  choice: 他仍坚持这样说
  rationale: 属格独立结构表示其持续坚持先前的说法；避免生硬直译为“坚持这些话”。
- source_word: ὁ Πεντεφρής
  choice: 波提乏
  rationale: 该希腊名称对应约瑟叙事中的波提乏，采用现代中文圣经读者熟悉的通行译名。
- source_word: Ἐναχθήτω
  choice: 带上来
  rationale: 被动命令式意为“让他被带来”，中文用使役式命令表达更自然。
- source_word: ὁ νεανίσκος
  choice: 这个年轻人
  rationale: 既传达青年男子之意，也以“这个”体现希腊定冠词在当前语境中的特指性。
