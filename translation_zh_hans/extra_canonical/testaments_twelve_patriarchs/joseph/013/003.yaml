base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/003.yaml
  text: And Pentephris said to him, “From where, then, is this Hebrew boy?” And he said, “The Ishmaelites entrusted him to me until they return.”
translation:
  language: zh_hans
  text: 波提乏对他说：“那么，这个希伯来少年是从哪里来的？”他回答：“以实玛利人把他托付给我，等他们回来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρής
  choice: 波提乏
  rationale: 采用现代中文读者熟悉的圣经人名译法；此处希腊文为该名字的变体。
- source_word: παῖς
  choice: 少年
  rationale: 该词可指男孩、少年或仆役；本句着眼于约瑟的身份与来历，译作“少年”可保留年龄意味，并避免无文本依据地限定为“奴隶”。
- source_word: Ἑβραῖος
  choice: 希伯来
  rationale: 按族群称谓直译，并与中文圣经传统用语一致。
- source_word: παρέθεντό μοι
  choice: 把他托付给我
  rationale: 准确表达将某人交由照管或保管之意，也保留说话者将自己描述为受托人的语气。
- source_word: ἕως ὅτου ἐπιστρέψωσιν
  choice: 等他们回来
  rationale: 以自然现代汉语表达“直到他们返回”，不额外说明返回的地点或目的。
