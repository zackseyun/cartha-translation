  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008.yaml
  text: '6[a]. And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.” 7. But she did not know that I spoke thus because of my Lord, and not because of her. 8. For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he interprets it in terms of that passion, toward his evil desire[b].


    1. So I say, my children, that it was about the sixth hour when she left me. And bending my knee to the Lord all that day and all that night, toward dawn I rose, weeping and asking for deliverance from her. 2. At last, with evil intent, she seized my garments by force, dragging me violently toward intercourse. 3. Therefore, when I saw that in her frenzy she had hold of my tunic, I left it behind and fled naked. 4. But she, taking hold of it, slandered me; and when her husband came, he cast me into prison in his house, and on the next day, after scourging me, he sent me into Pharaoh’s dungeon. 5. And while I was in chains[c], the Egyptian woman was constrained by grief.'
translation:
  language: zh_hans
  text: '**七**


    **6** 她对我说：“看吧，这么说你是爱我的。这样我就满足了；只要你顾念我和我孩子们的性命，我便有希望如愿以偿。” **7** 她却不知道，我这样说是为了我的主[a]，并不是为了她。 **8** 因为，人若陷入欲望的激情，被它奴役，像她一样，那么即使听见什么好话，也会按那种激情去理解，把所听见的话引向自己的邪欲。


    **八**


    **1** 所以，孩子们，我告诉你们：她离开我的时候，约在第六时[b]。我向主屈膝，整日整夜；临近黎明，我起身，流着泪祈求脱离她。 **2** 最后，她强行抓住我的衣服，硬把我拉去，要与我交合[c]。 **3** 我见她发狂，紧抓着我的内袍，就把内袍留下，[并挣脱开，][d]赤身逃走。 **4** 她却拿着那件内袍诬告我。她丈夫回来后，把我关进他家里的牢房；第二天，他鞭打了我，又把我送进法老的监牢。 **5** 我被锁链捆着的时候，那埃及妇人忧愁难耐。她前来侧耳听我怎样在黑暗之家[e]感谢主、颂赞主；又听我怎样以欢快的声音欢喜，荣耀我的上帝，因为我竟借着这件事摆脱了那埃及妇人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的主”在语法上也可指“我的主人”，即那妇人的丈夫；但下文约瑟向“主”祷告并感谢主，使这里更自然地指上帝。
    reason: 保留κύριος所指的真实歧义，并说明上下文依据。
  - marker: b
    text: 即约在正午。
    reason: 解释古代从日出计时的“第六时”。
  - marker: c
    text: 希腊语明确指发生性关系。
    reason: 说明συνουσία在此并非一般的相处或同住。
  - marker: d
    text: “并挣脱开”见于部分文本，且在所据希腊文本中以方括号标出；若省略，句意则为“就把内袍留下，赤身逃走”。
    reason: 保留所据版本标明的文本不确定性，且不为补文添加原文未明示的动作对象。
  - marker: e
    text: 指监牢。
    reason: 解释“黑暗之家”这一诗性表达。
lexical_decisions:
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: 顾念我和我孩子们的性命
  rationale: ἀντιποιέομαι在此表示把某事当作自己的关切或责任；“顾念”自然表达妇人的操纵性恳求，又不把语义过度具体化。
- source_word: προσδοκίαν ἀπολαῦσαι καὶ τῆς ἐπιθυμίας μου
  choice: 有希望如愿以偿
  rationale: ἀπολαύω可指获得或享有；结合她的欲念，“如愿以偿”在中文中清楚而克制。
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας καὶ δουλωθῇ αὐτῷ
  choice: 陷入欲望的激情，被它奴役
  rationale: 保留ὑποπίπτω的落入、受制意象，也直陈δουλόω所表达的奴役力量。
- source_word: ἐκλαμβάνει αὐτὸ πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: 按照那激情来理解，把它引向自己的邪欲
  rationale: ἐκλαμβάνω在此关乎理解、解释；译文保留欲望扭曲听者认知，使好话被导向邪欲的意思。
- source_word: κλίνας γόνυ
  choice: 向主屈膝
  rationale: 既保留原文身体动作，又符合庄重的祷告语域。
- source_word: λύτρωσιν ἐξ αὐτῆς
  choice: 脱离她
  rationale: 此处λύτρωσις是实际的解救，并非特指赎罪；“脱离”简洁自然。
- source_word: μετὰ βίας ἐφελκομένη με εἰς συνουσίαν
  choice: 硬把我拉去，要与我交合
  rationale: συνουσία在语境中明确指性交；译文直白但不粗俗，同时保留暴力强迫。
- source_word: μαινομένη
  choice: 发狂
  rationale: 表达欲望驱使下的狂乱状态，力度与原文相称。
- source_word: χιτών
  choice: 内袍
  rationale: χιτών通常指贴身穿的衣袍；“内袍”比泛称“衣服”更精确，也能解释约瑟为何赤身逃走。
- source_word: ἐσυκοφάντησέ με
  choice: 诬告我
  rationale: 该动词在此不只是口头毁谤，更包含恶意虚假控告；“诬告”贴合叙事情境。
- source_word: οἴκῳ τοῦ σκότους
  choice: 黑暗之家
  rationale: 保留原文带诗意的监牢称谓，并以脚注说明其所指。
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: 竟借着这件事摆脱了
  rationale: πρόφασις可指由头、缘由或所发生的情由；“这件事”保留表达的概括性，避免误译为约瑟编造“借口”。
theological_decisions:
- issue: 七章7节“我的主”（τοῦ Κυρίου μου）的所指
  choice: 正文译作“我的主”，脚注说明上下文较自然地指上帝
  alternative: 指约瑟在地上的主人，即妇人的丈夫
  rationale: κύριος本身容许两种所指；随后约瑟向主祷告、感谢主，支持上帝这一理解，但正文不通过增译“上帝”消除原有歧义。
- issue: 欲望对理解力的奴役
  choice: 译出人会按照激情理解好话，并将其导向邪欲
  alternative: 仅描述埃及妇人一次性的误会
  rationale: 原文从“像她一样”的具体例子转为一般性格言，既指当下事件，也教导欲望能扭曲人的理解。
- issue: 约瑟在监牢中的喜乐
  choice: 保留他在受苦中感谢、颂赞并荣耀上帝的张力
  alternative: 把喜乐解释为监禁本身是善事
  rationale: 原文的喜乐源于他借此摆脱妇人的纠缠，并非否认鞭打和囚禁的痛苦。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“屈膝”“邪欲”“荣耀”等具有经训色彩但仍通行的词语；性交场景表达明确而克制。章节从七章6—8节续接至八章1—5节，并完整翻译希腊原文中英语咨询层未收录的八章5节后半。
