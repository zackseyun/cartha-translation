review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了欲望的奴役、约瑟的祷告与逃离、诬告和监禁的叙事。第八章5节原文在英语审校文本截断之后仍已译出，值得保留。但“来到监牢外”无希腊文依据；“我才起身”增添了原文没有的时间限制；末句“以欢快的声音喜乐”不合现代汉语，且宜更清楚反映“欢喜……荣耀上帝”的分词结构。
  naturalness: 整体语体庄重、现代，适合经训叙事。“以欢快的声音喜乐”搭配生硬；“她来到监牢外”既属无据增译，也使叙事画面不必要地具体化。其余如“顾念”“屈膝”“诬告”“内袍”均自然得体。
  terminology: “主”保留κύριος的歧义，脚注谨慎说明上下文，处理妥当。“交合”准确而克制；“内袍”对应χιτών；“诬告”充分表达συκοφαντέω的恶意虚假指控。“黑暗之家”可保留其形象性，并注为监牢。
  issues:
  - severity: medium
    issue: 第八章5节将ἐλθοῦσα译为“她来到监牢外”。
    rationale: ἐλθοῦσα仅表示“她来了/前来”，原文没有“监牢外”的地点限定。应删去“外”，以免无据补足情节。
  - severity: low
    issue: 第八章1节“我才起身”中的“才”。
    rationale: ἀνέστην意为“我起来了”；πρὸς ὄρθρον标示“到黎明时/临近黎明”。“才”带出延迟或终于发生的含义，原文未明说。
  - severity: medium
    issue: 第八章5节“又听见我以欢快的声音喜乐，荣耀我的上帝”表达不自然。
    rationale: ἔχαιρον ἐν ἱλαρᾷ φωνῇ δοξάζων应译出约瑟“欢喜……荣耀上帝”的连贯动作；“以声音喜乐”不合汉语习惯。
  - severity: low
    issue: 第八章3节方括号内“挣脱了她”将补文的动作对象具体化。
    rationale: '[καὶ ἐκτιναξάμενος]未明示“她”为宾语。可译作“并挣脱开”，并在脚注说明这是方括号中的不确定补文。'
