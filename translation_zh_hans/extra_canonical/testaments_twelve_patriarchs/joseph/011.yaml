base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011.yaml
  text: 'And so[a], my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.


    And when I was coming with the Ishmaelites, they kept asking me, saying[b], “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.'
translation:
  language: zh_hans
  text: '1 所以，我的孩子们，你们所做的一切事，都要把对上帝的敬畏摆在眼前，也要尊重你们的弟兄；因为凡遵行主的律法的人，都必蒙他所爱。


    2 我同以实玛利人前来时，他们不断地问我[a]：“你是奴隶吗？”我说：“我是家中的奴隶[b]。”这是为了不使我的弟兄蒙羞。


    3 他们中为首的对我说：“你不是奴隶，因为从你的相貌也看得出来。”我却对他们说：“我是你们的奴隶[c]。”


    4 我们到了埃及后，他们便为我争执，看谁卖掉我能得到金子。


    5 于是众人决定，先把我留在埃及，交给他们的贸易代理人，等他们带着货物回来。


    6 主使我在那代理人眼前蒙恩，他便把自己的家托付给我。


    7 上帝借着我的手赐福给他，使他在金银和事业[d]上都增多了。


    8 我同他在一起三个月。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不断地问”所译的希腊语动词采用未完成时态，可表示持续或反复地询问。
    reason: 说明未完成时态所传达的反复意味。
  - marker: b
    text: “家中的奴隶”所对应的希腊语是 ἐξ οἴκου，也可能特指家内奴隶或家生奴隶。
    reason: 保留短语在奴隶身份类别上的词义不确定性。
  - marker: c
    text: “你们的”所对应的希腊语 αὐτῶν 在所给底本中置于括号内，表示其是否属于原文仍有文本上的不确定性。若不纳入此词，约瑟只是说“我是奴隶”。
    reason: 说明底本文本括号所标示的异文或存疑成分。
  - marker: d
    text: “事业”所对应的希腊语词也可译作“工作”或“产业”；而且该词组在所给底本中置于括号内，表示其在抄本传统中的可靠性较低。
    reason: 说明括号标示的文本疑问及 ἔργον 的语义范围。
lexical_decisions:
- source_word: φόβον
  choice: 敬畏
  rationale: “对上帝的敬畏”在现代汉语中既保留 φόβος 的畏惧分量，也能表达其伦理与虔敬含义，避免仅译“尊敬”而弱化原文。
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: 摆在眼前
  rationale: 保留希腊语具体而鲜明的视觉意象，同时符合现代汉语劝诫语体。
- source_word: τιμᾶτε
  choice: 尊重
  rationale: 准确传达命令式的伦理要求；在弟兄关系中比“尊荣”自然，比“看重”明确。
- source_word: ποιῶν νόμον Κυρίου
  choice: 遵行主律法
  rationale: ποιέω 直译为“行”，汉语固定表达“遵行律法”既自然，又保留实践律法的含义。
- source_word: ἀγαπηθήσεται ὑπʼ αὐτοῦ
  choice: 必蒙他所爱
  rationale: 保留将来被动语态和上帝亲自施爱的含义；“他”按最近的“主”理解。
- source_word: ἐπηρώτων
  choice: 不断问
  rationale: 未完成时态表示持续或反复动作，“不断问”自然呈现这一语气。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 本段涉及约瑟被贩卖和归属身份，所有权与受奴役状态突出，故不用较含混的“仆人”。
- source_word: ἐξ οἴκου
  choice: 家中的奴隶
  rationale: 保留“出于/属于家中”的表达范围，不武断限定为“家生奴隶”；以脚注说明可能含义。
- source_word: ὁ μείζων αὐτῶν
  choice: 他们中为首的
  rationale: μείζων 可指较年长者或地位较高者；正文采用符合场景的“为首的”，但不具体加入官职。
- source_word: τὸν μετάβολον τῆς ἐμπορίας αὐτῶν
  choice: 他们的贸易代理人
  rationale: 该人显然替商队处理或周转贸易事务；“贸易代理人”比生硬的“贸易兑换商”更适合上下文，同时承认词义较罕见。
- source_word: καὶ ἔργῳ
  choice: 和产业
  rationale: ἔργον 可指工作、事业或成果；此处与金银增多并列，译作“产业”最合叙事语境，但以脚注保留文本和语义不确定性。
theological_decisions:
- issue: “敬畏上帝”的含义
  choice: 保留“敬畏”，不改写为单纯的“尊敬”或“崇敬”
  alternative: 惧怕上帝；尊崇上帝
  rationale: 原文 φόβος 同时含畏惧、虔敬和伦理警醒；传统而现代可懂的“敬畏”能保留这种张力。
- issue: “凡遵行主律法的人，都必蒙他所爱”所表达的因果张力
  choice: 按原文保留律法实践与蒙主所爱之间的直接陈述
  alternative: 解释为“因为蒙爱，所以遵行”；或弱化为“为他所喜悦”
  rationale: 原文以 γάρ 和将来被动式直接连接两者；翻译不应自行加入特定恩典—行为体系来消解张力。
- issue: 约瑟自称奴隶以免弟兄蒙羞
  choice: 直译为约瑟不愿使自己的弟兄蒙羞
  alternative: 解释为避免使父家蒙羞；避免自己受辱
  rationale: 原文直接宾语是“我的弟兄”，叙事重点是约瑟不揭露弟兄对他的所作所为；正文不额外阐释其动机。
- issue: “他”的指代
  choice: 理解为“主”，即上帝
  alternative: 无明确指代的泛称
  rationale: ὑπʼ αὐτοῦ 的自然先行词是 Κυρίου；汉语保留代词而不重复补入“上帝”，维持原文形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留 testament 式父对子女的劝诫语气，并以清楚的叙事句式呈现第2—8节。神名按项目常用法译作“上帝”，“主”保留 Κυρίου/Κύριος 的称谓区别。正文完整翻译所给希腊语第1—8节，而不受仅涵盖前两节的英语咨询层限制。
