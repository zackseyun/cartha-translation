  text: 1[a]. And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust[b], because you punish as a wrongdoer a free man who has been kidnapped.” 2. But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come. 3. And the woman kept saying to her husband[c],
translation:
  language: zh_hans
  text: '**《约瑟遗训》第14章**


    **1** 孟斐斯从窗洞[a]看见我正挨打——她的家就在附近——便派人去对他说：“你的判决不公，因为这个自由人是被人掳走的[b]，你却把他当作作恶的人惩罚。”


    **2** 我虽挨打，仍不改变自己的供词，于是他下令把我看守起来，直到这少年的主人们来到。


    **3** 那妇人不断对丈夫说：“你为什么把这个被掳而又出身高贵的少年锁在镣铐中？本该让他自由自在，并让人服侍他才是。”


    **4** 原来她怀着犯罪的欲望，想要见我；这一切我却毫不知情。


    **5** 她丈夫对她说：“埃及人没有这样的规矩：在证据确立以前，就夺取别人的财物。”


    **6** 关于那个商贩[c]，他就是这样说的；至于这少年，理当继续拘禁。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“格窗”。这里的希腊词可指窗户的开口，不一定是现代意义上装有玻璃的窗。
    reason: cultural_note
  - marker: b
    text: 直译是“被偷走的自由人”，指一个自由人遭非法掳掠，并被当作奴隶或罪犯处置。
    reason: lexical_alternative
  - marker: c
    text: “商贩”所对应的希腊词在此含义不确定，也可能指“反复无常的人”或“改变立场的人”；本译法按上下文中人口买卖和财物归属的语境处理。
    reason: textual_variant
lexical_decisions:
- source_word: Μεμφίς
  choice: 孟斐斯
  rationale: 按专名音译；在本段叙事中指那妇人的名字，不译作埃及城市“孟菲斯”。
- source_word: θυρίδων
  choice: 窗洞
  rationale: 指可供观看的窗户开口，未必是现代装有玻璃的窗；正文采用自然且具古代建筑色彩的“窗洞”。
- source_word: κλαπέντα ἐλεύθερον
  choice: 这个自由人是被人掳走的
  rationale: 保留ἐλεύθερον的法律身份含义，同时以“被人掳走”自然表达一个人遭非法窃取、贩卖的处境。
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: 仍不改变自己的供词
  rationale: λόγος在审讯语境中指约瑟所作的陈述或供词；“供词”凸显司法场景，但不判断其有罪。
- source_word: οἱ κύριοι τοῦ παιδός
  choice: 这少年的主人们
  rationale: κύριοι在奴役和所有权语境中表示掌有权柄或所有权的人；保留“主人”，使自由人被当作奴隶的张力清楚可见。
- source_word: αἰχμάλωτον καὶ εὐγενῆ παῖδα
  choice: 这个被掳而又出身高贵的少年
  rationale: αἰχμάλωτος表示被俘或被掳者，εὐγενής表示出身高贵；译文保留两者看似矛盾的身份并置。
- source_word: ἄνετον εἶναι καὶ ὑπηρετεῖσθαι
  choice: 让他自由自在，并让人服侍他
  rationale: ἄνετος在此与“镣铐”相对，含松绑、不受拘束之意；被动态ὑπηρετεῖσθαι意为受人服侍。
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: 怀着犯罪的欲望
  rationale: 直译保留“欲望”与“罪”的明确关联，不替原文进一步界定具体行为。
- source_word: πρὸ ἀποδείξεως ἀφαιρεῖσθαι τὰ ἀλλότρια
  choice: 在证据确立以前，就夺取别人的财物
  rationale: ἀπόδειξις指证明或证据，τὰ ἀλλότρια指属于别人的东西；译文维持其法律和财产权语气。
- source_word: μεταβόλου
  choice: 商贩
  rationale: 该词在此语境和文本形态上不够确定；“商贩”最能衔接约瑟被买卖及前句财物归属的讨论，脚注保留其他可能。
- source_word: ἐγκατάκλειστος
  choice: 继续拘禁
  rationale: 表示被关在里面、不得外出；“继续”从当前受押状态与ὀφείλει的持续处置自然得出。
theological_decisions:
- issue: 约瑟自由身份与被奴役处境之间的张力
  choice: 分别译作“自由人”和“主人们”
  alternative: 将ἐλεύθερον泛化为“无辜的人”，或将κύριοι弱化为“管他的人”
  rationale: 原文的伦理力度来自自由人被掳走、买卖并受所谓主人支配的冲突；保留社会法律术语，不替叙事消解这种张力。
- issue: 妇人的欲望所指
  choice: 译为“怀着犯罪的欲望”
  alternative: 明确译作“怀着淫欲”或“想引诱我犯罪”
  rationale: 上下文可能带有性意味，但本节原文只明确说“罪的欲望”；正文不加入超出本句措辞的具体解释。
- issue: 埃及规矩与财产权主张
  choice: 按丈夫的法律性答复直译，不为其立场背书
  alternative: 解释为埃及法律认可奴隶所有权
  rationale: 本段呈现人物的辩解和制度语言，并不要求译者认同其道德判断；译文保留叙事中的法律与伦理冲突。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。法律场景使用“判决、供词、证据、拘禁”等常用词；涉及古代奴役制度时保留“自由人、主人”等身份词，不以现代委婉语淡化。第3—6节按所给希腊文本完整翻译，不沿用英文咨询层把第3节误作残句的处理。
