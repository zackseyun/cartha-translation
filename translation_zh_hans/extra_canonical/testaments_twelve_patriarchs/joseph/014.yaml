review_pass:
  verdict: revise
  source_fidelity: 第1—5节总体忠实地传达了希腊文本的叙事、法律性措辞和自由身份／被拘禁处境。第6节将μεταβόλου译为“商贩”缺乏可靠依据，并把未确定词义过度具体化；在本段语境中较适宜谨慎译作与控诉证据有关的“衣物”，同时以脚注说明词义与文本传承的不确定性。
  naturalness: 译文整体庄重、现代且通顺。将“供词”调整为“陈述”，避免汉语中“供词”可能暗示认罪；将“镣铐”调整为“锁链”，避免δεσμοῖς被误限为特定刑具。
  terminology: “自由人”“主人们”妥善保留原文的社会—法律身份张力；“判决”“证据”“拘禁”符合语境。第6节应避免以“商贩”解释词义不明的μεταβόλου。
  issues:
  - severity: high
    issue: 第6节将μεταβόλου译为“商贩”。
    rationale: 该词并无足够语文学依据可确定为“商贩”。按本段紧邻的控告、财物和拘禁语境，它通常被理解为衣物／换穿衣物一类事物；至少不应在正文中作无根据的具体化。
  - severity: medium
    issue: 第2节“供词”可能在现代汉语中带有认罪供述的含义。
    rationale: τὸν λόγον μου在此更中性地指约瑟在审问中的说法或陈述；“陈述”既保留法律场景，也不预断其性质。
  - severity: low
    issue: 第3节“镣铐”比δεσμοῖς更具体。
    rationale: δεσμοί泛指捆绑物、锁链或拘束；“锁链”较为稳妥。
  revised_text: '**《约瑟遗训》第14章**


    **1** 孟斐斯从窗洞[a]看见我正挨打——她家就在附近——便派人去见他，说：“你的判决不公；你把一个被掳走的自由人[b]当作作恶的人惩罚。”


    **2** 我虽正挨打，仍没有改变自己的陈述；于是他下令把我看守起来，直到这少年的主人们来到。


    **3** 那妇人不断对她丈夫说：“你为什么把这个被掳而又出身高贵的少年拘在锁链中？他本该被释放，并受人服侍才是。”


    **4** 原来她因罪恶的欲望想要见我；这一切我却毫不知情。


