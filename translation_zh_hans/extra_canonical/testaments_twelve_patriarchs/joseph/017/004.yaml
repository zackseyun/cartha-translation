  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/004.yaml
  text: And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them.
translation:
  language: zh_hans
  text: 我的兄弟们来到埃及时，他们自己知道，我把银钱退还给了他们，没有责备他们，并且安慰了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψα τὸ ἀργύριον
  choice: 我把银钱退还
  rationale: 直译为“我归还了银钱”；“银钱”既保留ἀργύριον的字面意象，又能自然表示钱款。
- source_word: οὐκ ὠνείδισα
  choice: 没有责备
  rationale: ὀνειδίζω在此指斥责、辱骂或以过错羞辱；“责备”在现代汉语中自然且不过度强化。
- source_word: παρεκάλεσα
  choice: 安慰
  rationale: παρακαλέω语义范围包括劝勉、鼓励、安慰；在兄弟重逢且约瑟不追究旧怨的语境中，“安慰”较自然，同时不加入原文没有的具体言语内容。
