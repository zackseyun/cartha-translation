- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲属称谓和所属关系，同时保持父亲训诫子女的庄重语气。
- source_word: πόσα ὑπέμεινα
  choice: 我忍受了多少
  rationale: πόσα表示所忍受之事的程度或分量；ὑπέμεινα强调在苦难中坚持承受。
- source_word: ἵνα μὴ αἰσχύνω
  choice: 为的是不使……蒙羞
  rationale: 保留ἵνα所表达的目的，以及αἰσχύνω使他人受羞辱、蒙羞的使役含义。
- source_word: τοὺς ἀδελφούς μου
  choice: 我的兄弟们
  rationale: 按上下文指约瑟的众兄弟；采用自然且不额外限定身份的复数表达。
