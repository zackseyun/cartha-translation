  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/002.yaml
  text: You also, therefore, love one another, and with patience conceal one another’s shortcomings.
translation:
  language: zh_hans
  text: 所以，你们也要彼此相爱，并要以恒久的忍耐遮掩彼此的过失。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 保留承接上文并引出劝勉的推论关系。
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: 要彼此相爱
  rationale: 以自然、庄重的现代汉语表达持续性的相互之爱。
- source_word: ἐν μακροθυμίᾳ
  choice: 恒久忍耐
  rationale: μακροθυμία不只是短暂的耐心，也含长期宽容、克制之意；此译法保留其持续性。
- source_word: συγκρύπτετε
  choice: 遮掩
  rationale: 直译其共同掩盖、不张扬之意，并保留原文可能涉及宽容对方缺点而非公开揭露的张力。
- source_word: τὰ ἐλαττώματα
  choice: 过失
  rationale: 可指欠缺、弱点或过错；“过失”在本句伦理语境中自然，同时不过度强化为严重罪行。
theological_decisions:
- issue: “遮掩彼此的过失”是否意味着纵容罪恶
  choice: 按原文保留“遮掩”的直接意象
  alternative: 包容彼此的缺点
  rationale: 原文使用συγκρύπτετε，明确带有隐藏、遮掩的意味。译文不自行解释为纵容，也不将其弱化成一般性的包容，以保存原句的伦理张力。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。“恒久忍耐”比单用“耐心”更能体现μακροθυμία的持续宽容；句式尽量贴近希腊文劝勉结构。
