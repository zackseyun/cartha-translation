base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/003.yaml
  text: For God delights in the harmony of brothers and in the good intention of the heart; these are well-pleasing for good.
translation:
  language: zh_hans
  text: 因为上帝喜爱弟兄之间的和睦，也喜爱良善之心的意愿；这些都欣然趋向良善。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些都欣然趋向良善”：原文作复数主动形式“（它们）乐意／赞同”，但其主语如何承接前面的两个抽象名词，以及“趋向良善”的确切关系，都不甚明确。也可理解为“这些都以良善为乐”。有些译法则按上下文意译为“这些都蒙喜悦”。
    reason: εὐδοκοῦσιν 为复数主动形式，与前文单数抽象名词的句法衔接困难；脚注说明这一困难及主要理解方向，避免正文把不确定的主动形式直接定为被动。
lexical_decisions:
- source_word: τέρπεται
  choice: 喜爱
  rationale: 表达因某事而欢喜、以某事为乐的含义；“喜爱”在现代汉语中自然庄重，并适合此处以上帝为主语的语境。
- source_word: ὁμονοίᾳ ἀδελφῶν
  choice: 弟兄和睦
  rationale: ὁμόνοια 指同心、和谐一致；采用“和睦”既简洁自然，也保留群体关系层面的含义。
- source_word: προαιρέσει καρδίας ἀγαθῆς
  choice: 人心良善的意愿
  rationale: προαίρεσις 可指有意识的选择、志向或意愿；“意愿”不把它过度限定为一次决定。“人心”补出汉语中自然的所属关系，而不改变原意。
- source_word: εἰς ἀγαθόν
  choice: 为着良善
  rationale: 保留 εἰς 所表达的趋向或目的意味，同时避免武断确定其与前述哪一成分相连。
theological_decisions:
- issue: 末句 εὐδοκοῦσιν εἰς ἀγαθόν 的主语和语态关系不明
  choice: 这些都为着良善而蒙喜悦
  alternative: 这些都以良善为乐／这些都蒙喜悦，导向良善
  rationale: 抄本所见复数主动形式与上下文搭配生硬，英文审校层也采用较为含混的“these are well-pleasing for good”。正文以自然汉语近似传达“这些事蒙喜悦”的意思，并用脚注明示原文困难，不将其悄然解释成确定的神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄和睦”保留古代伦理训诫的凝练语气；末句因希腊文本身不稳，以正文加脚注处理，避免过度顺译或删略。
