base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/008.yaml
  text: And I did not exalt myself among them in arrogance because of my worldly glory, but I was among them as one of the least.
translation:
  language: zh_hans
  text: 我没有因自己在世上的荣耀而在他们中间傲慢自高；相反，我在他们中间如同最卑微的人之一。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕψωσα ἐμαυτόν
  choice: 自高
  rationale: 直译为“高抬自己”，这里指抬高自己的身份或地位；“自高”简洁、自然，并保留主动抬举自己的含义。
- source_word: ἐν ἀλαζονείᾳ
  choice: 骄傲
  rationale: ἀλαζονεία含自夸、傲慢之意；此处作为自高的方式或心态，译作“骄傲”符合现代汉语。
- source_word: κοσμικήν μου δόξαν
  choice: 自己在世上的荣耀
  rationale: κοσμικός在此指属于现世、世俗层面的地位与荣显；“在世上的荣耀”既保留原义，也避免将其过度解释为道德上邪恶的“世俗”。
- source_word: ὡς εἷς τῶν ἐλαχίστων
  choice: 像最微小的人之一
  rationale: 保留“如同……之一”的比较结构及ἐλάχιστος的最低微、最不重要之意，不将其具体化为仆人或臣属。
theological_decisions:
- issue: “世上的荣耀”的价值判断
  choice: 采用中性的“在世上的荣耀”
  alternative: “世俗的荣耀”
  rationale: 原文κοσμικήν可指现世层面的荣耀，未必在此直接断定其为罪恶；中性译法保留经文对谦卑与地位之间的张力。
- issue: “最微小的人之一”的身份
  choice: 不明确其社会角色
  alternative: “最卑微的仆人之一”
  rationale: 原文没有“仆人”一词；不补入特定身份，以免增加原文未明说的社会或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“反而”清楚表达ἀλλά的转折；分号呈现“没有……反而……”的对照。
