base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/006.yaml
  text: And I did not allow them to be distressed even in the smallest matter; indeed, everything that was in my hand I gave to them.
translation:
  language: zh_hans
  text: 我没有让他们哪怕因一件小事而受苦；而且，凡在我手中的，我都给了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀφῆκα αὐτοὺς θλιβῆναι
  choice: 我没有让他们……受苦
  rationale: ἀφίημι加不定式在此表示“容许、任凭”，θλίβω的被动式表示遭受压迫、困苦；译为“让他们受苦”自然且保留原意。
- source_word: ἕως μικροῦ πράγματος
  choice: 因哪怕一件小事
  rationale: 原短语形式较不寻常，语境表达程度下限，即连微小的事情也不让他们为难；“哪怕一件小事”保留强调，又符合现代汉语。
- source_word: καίγε
  choice: 并且
  rationale: 该强调兼递进粒子在这里承接前句并加强陈述，不宜译成转折性的“反而”。
- source_word: πᾶν ὃ ἦν ἐν τῇ χειρί μου
  choice: 凡在我手中的
  rationale: 保留“在手中”的具体隐喻及其可能涵盖的财物、资源或权柄，不将含义窄化。
- source_word: αὐτοῖς δέδωκα
  choice: 我都给了他们
  rationale: δέδωκα为完成时，突出已经给予而形成的结果；汉语以“都给了”自然传达完整给予。
theological_decisions: []
