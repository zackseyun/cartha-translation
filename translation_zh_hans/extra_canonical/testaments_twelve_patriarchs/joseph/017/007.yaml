base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/007.yaml
  text: And their sons were my sons, and my sons were as servants to them, and their souls were my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose.
translation:
  language: zh_hans
  text: 他们的儿子就是我的儿子，我的儿子如同他们的奴仆；他们的性命就是我的性命，他们所受的一切痛苦就是我的痛苦，他们的一切软弱就是我的病弱，他们的谋划就是我的谋划。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχή
  choice: 性命
  rationale: 此处强调约瑟与他们休戚与共的生命认同；“性命”既保留 ψυχή 的生命义，也比现代汉语中的“灵魂”更自然，且不额外引入灵魂本体论。
- source_word: δοῦλοι
  choice: 仆人
  rationale: 保留服事和从属的含义；在这一家庭关系语境中，“仆人”自然庄重，也避免“奴隶”在现代汉语中可能造成的过强制度联想。
- source_word: ἄλγημα
  choice: 痛苦
  rationale: 涵盖身体疼痛及更广泛的苦楚，符合“凡他们所受的”这一概括表达。
- source_word: μαλακία
  choice: 软弱
  rationale: 直译其虚弱、衰弱之义，并与后面的 ἀσθένεια“疾病”保持原文两个近义词之间的区别。
- source_word: ἀσθένεια
  choice: 疾病
  rationale: 在本句与 μαλακία 对举，译为“疾病”可表达病弱状态，并保留原文由“软弱”转向“疾病”的措辞变化。
- source_word: βουλή
  choice: 心意
  rationale: 该词可指谋划、意向或决意；“心意”在此能自然表达共同的意愿，同时不把语义过度限定为正式计划或计谋。
theological_decisions:
- issue: ψυχή 的单数形式与复数所属者之间的关系
  choice: 译作“他们的性命就是我的性命”
  alternative: 译作“他们的灵魂就是我的灵魂”或“他们的性命都如同我的性命”
  rationale: 原文 ψυχή 为单数，形成强烈的共同生命表达。译文保留单数式对应和认同张力，不按英语修订层擅自改成明确的复数“灵魂”，也不加入“如同”来削弱原句。
- issue: 省略系词的名词句所表达的时间
  choice: 使用现代汉语无时态标记的“就是”
  alternative: 译作“曾是”
  rationale: 希腊文各分句省略系词，本身未明示时态；汉语“就是”既自然，又避免仅依据叙事上下文强行补入过去时。
translation_notes:
  register: 采用现代、庄重而易懂的排比句式，保留原文连续的认同结构。用分号划分生命认同与苦乐、心意相通两组内容，避免长句失去节奏。
