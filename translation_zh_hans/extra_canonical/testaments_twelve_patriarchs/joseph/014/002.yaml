  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/002.yaml
  text: But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come.
translation:
  language: zh_hans
  text: 但由于我即使在挨打时也没有改变自己的说法，他便下令把我看守起来，等那孩子的主人们来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: 没有改变自己的供词
  rationale: 这里的 λόγος 指约瑟先前所作的陈述；结合受审、挨打和看押的语境，“供词”比泛泛的“话”更自然，也没有补入原文所无的真假判断。
- source_word: τυπτόμενος
  choice: 即使挨打
  rationale: 保留现在分词所表达的受击过程及让步意味，符合现代汉语表达。
- source_word: φυλαχθῆναί με
  choice: 把我看押起来
  rationale: 被动不定式表示受拘禁、监管；“看押”准确体现司法性羁押语境。
- source_word: οἱ κύριοι τοῦ παιδός
  choice: 那孩子的主人们
  rationale: κύριοι 为复数，按原文保留“主人们”；παῖς 在此译作“孩子”，不擅自改释为“仆人”。
