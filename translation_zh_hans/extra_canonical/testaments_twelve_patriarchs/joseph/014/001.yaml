  text: Ἡ δὲ Μεμφὶς¹ ἑώρα² διὰ *τῶν θυρίδων³ ⌜*τυπτόμενόν με⁴, *πλησίον γὰρ ἦν ὁ οἶκος αὐτῆς⁵, καὶ *ἀπέστειλε πρὸς αὐτόν⁶, λέγουσα⁷· *Ἄδικος⁸ ἡ κρίσις σου⁹, ὅτι τὸν *κλαπέντα ⌜ἐλεύθερον⌉ *τιμωρεῖς, ὡς ἀδικήσαντα¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/001.yaml
  text: And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust, because you punish as a wrongdoer a free man who has been kidnapped.”
translation:
  language: zh_hans
  text: 孟斐斯透过窗户看见我正挨打——她的房子就在附近——就派人传话给他，说：“你的判决不公，因为你把一个被绑架的自由人当作作恶的人惩罚。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφὶς
  choice: 孟斐斯
  rationale: 按希腊文音译人名，并与英语咨询层的 Memphis 对应。
- source_word: διὰ τῶν θυρίδων
  choice: 从窗户
  rationale: 自然表达她透过窗户观看的视角；复数在汉语中无需机械标明。
- source_word: τυπτόμενόν με
  choice: 我正挨打
  rationale: 保留现在分词的进行状态和被动意义，语言简明自然。
- source_word: ἀπέστειλε πρὸς αὐτόν
  choice: 派人去见他
  rationale: ἀπέστειλε 在此语境表示差人传话；补出汉语隐含的受差遣者，但不增添其身份。
- source_word: Ἄδικος ἡ κρίσις σου
  choice: 你的判决不公
  rationale: 准确传达 κρίσις 在司法语境中的裁断以及 ἄδικος 的不公正含义。
- source_word: τὸν κλαπέντα ἐλεύθερον
  choice: 一个被掳走的自由人
  rationale: κλαπέντα 字面有被偷走、被劫走之意；用于人时“被掳走”比“被偷”自然，同时保留其受害者身份。
- source_word: τιμωρεῖς, ὡς ἀδικήσαντα
  choice: 当作作恶的人惩罚
  rationale: 保留 ὡς 所表达的归类或认定，不把 ἀδικέω 过度限定为某一具体罪名。
theological_decisions:
- issue: 被掳自由人的法律与道德身份
  choice: 保留“自由人”与“当作作恶的人”的对照
  alternative: 将其解释为无罪者或奴隶
  rationale: 原文强调其自由身份以及遭错误定罪的张力，并未使用“无罪”或“奴隶”等词，不作超出文本的神学或法律推断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“竟”体现控诉语气，但不改变命题内容；破折号保留原句插入说明的结构。
