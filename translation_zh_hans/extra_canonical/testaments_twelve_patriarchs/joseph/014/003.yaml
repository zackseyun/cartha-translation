  text: And the woman kept saying to her husband, “Why do you keep this captive and noble boy in chains, when he ought rather to be set free and waited upon?”
translation:
  language: zh_hans
  text: 那女人不断对她丈夫说：“你为什么还把这个被掳来的、出身高贵的少年拘禁在锁链中？他本应得到释放，并受人服侍。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγε
  choice: 不断……说
  rationale: 未完成时在此适合表达反复或持续劝说，而不只是一次发言。
- source_word: αἰχμάλωτον
  choice: 被掳来的
  rationale: 保留其作为俘虏、被掳之人的含义，并以自然汉语修饰“少年”。
- source_word: εὐγενῆ παῖδα
  choice: 高贵少年
  rationale: εὐγενής可指高贵出身或高尚身份；“高贵”保留这种语义空间，παῖς按语境译为“少年”。
- source_word: ἐν δεσμοῖς
  choice: 锁在镣铐中
  rationale: 表达受捆绑、囚禁的具体状态，符合现代汉语习惯。
- source_word: ἄνετον εἶναι
  choice: 释放他
  rationale: ἄνετος在此与“镣铐”相对，意为脱离束缚、获得自由。
- source_word: ὑπηρετεῖσθαι
  choice: 让人服侍他
  rationale: 保留被动式含义，即少年应当受到他人服侍。
