base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/005.yaml
  text: Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking, or I will throw myself down a cliff, if you do not lie with me.”
translation:
  language: zh_hans
  text: 于是，她一找到机会，就趁她丈夫还在外面时冲到我面前，对我说：“我快要窒息了；不然，若你不与我同寝，我就从悬崖上跳下去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐκαιρίαν λαβοῦσα
  choice: 一找到机会
  rationale: 自然表达“获得合适时机”，保留她伺机行动的含义。
- source_word: εἰσεπήδησε πρός με
  choice: 冲到我这里
  rationale: 体现动词突然闯入、扑向说话者的急切动作，同时避免过度具体化空间场景。
- source_word: ἔτι ἔξω ὄντος τοῦ ἀνδρὸς αὐτῆς
  choice: 趁她丈夫还在外面时
  rationale: 准确保留丈夫当时仍在外面的时间背景，并以现代汉语顺畅连接动作。
- source_word: Ἄγχομαι
  choice: 我快要窒息了
  rationale: 保留“被勒住、喘不过气、窒息”的直观意义；原文也可能表示极度痛苦，但不将其解释性弱化。
- source_word: εἰς κρημνὸν ῥίπτω ἐμαυτήν
  choice: 我就从悬崖上跳下去
  rationale: 按汉语习惯表达把自己投入峭壁深处的自杀威胁。
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: 与我同寝
  rationale: 直接而庄重地表达发生性关系，符合古代叙事语域，也不采用含混的现代委婉语。
theological_decisions:
- issue: 女子所说“窒息”的性质
  choice: 按字面译作“快要窒息”
  alternative: 译作“痛苦得受不了”或“我要死了”
  rationale: 原词可涉及勒住、窒息，也可引申为极度痛苦；正文保留具体而强烈的原始意象，不替读者判定其为身体症状、情欲痛苦或修辞性威胁。
- issue: 条件句所指的行为
  choice: 译作“与我同寝”
  alternative: 译作“与我发生关系”
  rationale: 原文明确指向性结合；“同寝”忠实、自然且庄重，不引入额外的道德或法律术语。
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语。引语保留女子急迫而带威胁性的语气；分号使“窒息”与“跳崖”两项威胁之间的关系保持一定开放性，不强行判定前者是即时状态还是另一种后果。
