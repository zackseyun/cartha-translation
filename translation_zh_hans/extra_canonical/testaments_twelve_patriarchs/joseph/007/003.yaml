  text: '*ἡ δὲ⁶⁴ συνεθέτό μου⁶⁵ τοῦ⁶⁶ *μηκέτι ποιῆσαι⁶⁷ τὴν ἀσέβειαν ταύτην⁶⁸. **Ἔτι δὲ¹ ἡ καρδία αὐτῆς *ἔκειτο εἰς τὸ κακὸν καὶ περιεβλέπετο ποίῳ τρόπῳ με παγιδεύσῃ· στενάζουσα δὲ †συντόμως συνεπίπτε μὴ ἀσθενοῦσα².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/003.yaml
  text: And she agreed with me no longer to commit this impiety. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would suddenly collapse, though she was not actually sick.
translation:
  language: zh_hans
  text: 她答应我，不再做这种不敬虔的事。然而，她的心仍倾向邪恶，不断寻找办法，怎样设圈套陷害我；她一面呻吟，一面忽然倒下，其实并不虚弱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεθέτό μου
  choice: 答应我
  rationale: 表示她与约瑟达成约定；现代汉语用“答应我”自然且不额外强化为正式盟约。
- source_word: ἀσέβειαν
  choice: 不敬虔的事
  rationale: 保留该词对神不敬、悖逆的宗教伦理色彩，而不笼统弱化为“坏事”。
- source_word: ἔκειτο εἰς τὸ κακόν
  choice: 仍倾向邪恶
  rationale: 表达其内心朝向并执意于恶，同时避免把比喻机械译作“躺在恶上”。
- source_word: περιεβλέπετο
  choice: 不住地察看
  rationale: 传达持续四下观察、寻觅机会的未完成时意味。
- source_word: παγιδεύσῃ
  choice: 设圈套陷害
  rationale: 保留“使落入陷阱”的意象及敌意目的。
- source_word: συντόμως συνεπίπτε
  choice: 忽然倒下
  rationale: 依上下文将有文本疑难的副词理解为突然而迅速地倒下，符合其佯装病弱的行为。
- source_word: μὴ ἀσθενοῦσα
  choice: 其实并不虚弱
  rationale: ἀσθενέω可指软弱或患病；选择较贴近词面且保留范围较宽的“虚弱”，由语境暗示她在装病。
theological_decisions:
- issue: ἀσέβεια的宗教伦理力度
  choice: 不敬虔的事
  alternative: 恶行／罪恶
  rationale: 原词不只是一般道德错误，也含对神不敬的意味；译文保留这一张力而不指定某一具体罪名。
- issue: 对女子倒下行为真实性的表述
  choice: 其实并不虚弱
  alternative: 其实并没有生病／她并非因虚弱而倒下
  rationale: 不把原文明确改写成诊断性的“没有生病”，也不添加原文未明说的因果关系；“其实”自然呈现分词所构成的反差。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不住地察看”呈现持续谋划，“设圈套陷害”保留捕捉意象；末句不明说“装病”，以免超出希腊文。
