  text: Ἵνα τί, ⌜ἄθλια⌉²², τάρασσον²³ καὶ θορυβῇ²⁴ ἐν ἁμαρτίαις τυφλώττουσα²⁵; μνήσθητι²⁶ ὅτι ἐὰν ἀνέλῃς σεαυτήν²⁷, *ἡ Ἀστηθώ²⁸, ἡ παλλακὴ²⁹ τοῦ ἀνδρός σου, ἡ³⁰ ἀντίζηλός³¹ σου³² κονδυλίσει³³ *τὰ τέκνα σου³⁴, καὶ³⁵ ἀπολέσεις³⁶ τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς.
