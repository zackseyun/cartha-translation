base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/007.yaml
  text: “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband’s concubine, your rival, will beat your children and wipe out your memory from the earth.”
translation:
  language: zh_hans
  text: “你这可怜的女人，为什么心烦意乱，在罪中蒙蔽自己呢？你要记住：如果你自尽，阿斯托——你丈夫的妾、你的情敌——会殴打你的孩子；你也将使自己在世上的记念消失。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄθλια
  choice: 可怜的女人
  rationale: 保留直接称呼及贬悯语气，同时采用自然的现代汉语表达。
- source_word: τάρασσον καὶ θορυβῇ
  choice: 心烦意乱
  rationale: 两个近义动词共同描写内心受扰、陷入纷乱；用汉语四字表达传达叠加强调，避免生硬重复。
- source_word: ἐν ἁμαρτίαις τυφλώττουσα
  choice: 在罪中蒙蔽自己
  rationale: 中间语态分词含使自己盲目之意；保留“罪中”的范围表达和自我蒙蔽的责任意味。
- source_word: ἀνέλῃς σεαυτήν
  choice: 自尽
  rationale: 直指杀死自己，以庄重简洁的现代汉语表达。
- source_word: παλλακὴ
  choice: 妾
  rationale: 指丈夫婚姻之外、地位次于妻子的女性伴侣；“妾”简明且符合古代家庭语境。
- source_word: ἀντίζηλός
  choice: 情敌
  rationale: 在共享同一男子的语境中指争宠的女性对手；“情敌”比泛称“对手”更准确自然。
- source_word: κονδυλίσει
  choice: 殴打
  rationale: 该词指用拳头或粗暴方式击打；“殴打”保留实际暴力含义，不弱化为一般欺负。
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς
  choice: 使你的名从地上消失
  rationale: μνημόσυνον在此是死后留存于世的记念或名声；汉语以“你的名”自然表达其纪念性含义。
theological_decisions:
- issue: “在罪中蒙蔽自己”所表达的能动性
  choice: 保留自我蒙蔽的表述
  alternative: 因罪而眼瞎
  rationale: 希腊文τυφλώττουσα与反身语境支持主体使自己盲目的意味；不改写为单纯被动结果，以免削弱伦理张力。
- issue: “使你的名从地上消失”的施事关系
  choice: 将其作为阿斯托行为的延续结果
  alternative: 你将使自己的记念从地上消失
  rationale: 句法中的ἀπολέσεις是第二人称单数，严格说主语仍是受劝告的女子，即“你将失去自己的记念”；但在汉语中可理解为她自尽所导致、并经由情敌虐待其子女而发生的结果。为避免错误地把动词直接归给阿斯托，正文采用结果式“使你的名……消失”，保留因果链但存在施事压缩。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。人名按希腊文Ἀστηθώ音译为“阿斯托”。句式保留责问、警告与家庭竞争所形成的强烈语气。
