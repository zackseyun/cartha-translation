review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了责问、罪中自我蒙蔽、自尽的警告，以及妾室作为竞争者会殴打孩子的威胁。惟末句希腊文ἀπολέσεις为第二人称单数主动式，主语仍是被劝告的女子：她若自尽，便将毁掉／失去自己在地上的记念。现译“就会殴打……，使你的名……”在汉语句法上把“使……消失”的施事者归为阿斯托，偏离原文人称与句法关系。
  naturalness: “心烦意乱”“自尽”“殴打”均自然且符合庄重语体。“你的情敌阿斯托”虽可理解，但原文先点出人名，再以“你丈夫的妾、你的情敌”作同位说明；调整语序后更清楚。末句用“在世上的记念”比“名从地上消失”更贴近μνημόσυνον的含义。
  terminology: “妾”可恰当表达παλλακή的古代家庭地位；“情敌”准确表达ἀντίζηλος。“阿斯托”可保留为Ἀστηθώ的既定音译。“记念”宜保留，以免把μνημόσυνον过窄地限为名声或名字。
