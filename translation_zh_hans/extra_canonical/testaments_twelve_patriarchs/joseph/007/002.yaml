  text: But when she saw this, she fell on her face at my feet, weeping; and I raised her up and admonished her.
translation:
  language: zh_hans
  text: 但她看见这事，就俯伏在我脚前哭泣；我扶她起来，劝诫她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτῆς εἰς τοὺς πόδας μου
  choice: 俯伏在我脚前
  rationale: 按希腊文意象表达她面伏于约瑟脚前的动作；中文用“俯伏”比逐字译为“脸伏下”更自然庄重。
- source_word: κλαίουσα
  choice: 哭泣
  rationale: 保留分词所表达的伴随状态，简洁自然。
- source_word: ἀναστήσας αὐτήν
  choice: 扶她起来
  rationale: ἀνίστημι在此为使役意义，即让她起身；结合她正俯伏在脚前的场景，“扶她起来”符合现代汉语，但不额外暗示强制动作。
- source_word: ἐνουθέτησα
  choice: 劝诫她
  rationale: νουθετέω兼有劝导、告诫之意；“劝诫”保留其规劝与纠正的语气。
