source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἵνα δὲ⁴⁵ μάθῃς⁴⁶, ὅτι⁴⁷ τῶν⁴⁸ ἐν σωφροσύνῃ θεοσεβούντων⁴⁹ οὐ κατισχύσει⁵⁰ κακία⁵¹ *τῶν ἀσεβούντων⁵². ⌈Ἰδοὺ⌉⁵³ λαβὼν⁵⁴ *ἐξ αὐτοῦ ἐνώπιόν σου ἐσθίων. Καὶ τοῦτο εἰπὼν εἶπον οὕτως⁵⁵. Ὁ Θεὸς τῶν πατέρων μου καὶ ὁ ἄγγελος Ἀβραὰμ⁵⁶ *ἔσται μετ᾽ ἐμοῦ⁵⁷. ⌈Ἔφαγον⌉⁵⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/001.yaml
  text: 'So that you may learn that the wickedness of the ungodly will not prevail over those who fear God with self-control, look: taking some of it in your presence, I will eat. And after saying this, I said thus, “The God of my fathers and the angel of Abraham will be with me.” And I ate.'
translation:
  language: zh_hans
  text: “为要让你明白，不敬虔者的恶不能胜过那些在节制中敬畏上帝的人。看哪，我拿了其中的一些，正在你面前吃。”说了这话后，我这样说：“我列祖的上帝和亚伯拉罕的天使必与我同在。”我就吃了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: 节制
  rationale: 此词可指自制、贞洁或端正审慎；本段语境涉及抵挡诱惑，但原文并未只限定为性方面的贞洁，因此采用范围较广且自然的“节制”。
- source_word: θεοσεβούντων
  choice: 敬畏上帝的人
  rationale: 保留该分词所表达的敬神、虔敬之意，并以现代汉语常用的圣经语汇表达。
- source_word: κακία
  choice: 恶意
  rationale: 此处指不敬虔者加害、诱惑人的邪恶企图；“恶意”较“邪恶”更能自然地与“胜过”搭配，同时不排除其道德恶的含义。
- source_word: οὐ κατισχύσει
  choice: 绝不能胜过
  rationale: κατισχύω 表示占上风、压倒或制胜；以“不能胜过”保留对抗意味，并用“绝”体现否定的强调。
- source_word: ὁ ἄγγελος Ἀβραὰμ
  choice: 亚伯拉罕的天使
  rationale: 依原文保留属格关系，不擅自解释为“守护亚伯拉罕的天使”或“亚伯拉罕所敬奉的天使”。
theological_decisions:
- issue: “上帝”和“亚伯拉罕的天使”之间的关系
  choice: 按原文并列译作“我列祖的上帝和亚伯拉罕的天使”
  alternative: 将天使解释为上帝的显现，或译作“亚伯拉罕的守护天使”
  rationale: 原文以 καί 并列二者，却未说明天使的身份或二者关系；直译能保留其神学张力与真实歧义。
- issue: 敬虔与节制的关系
  choice: 译作“以节制敬畏上帝”
  alternative: 译作“在贞洁中敬奉上帝”
  rationale: 原文 ἐν σωφροσύνῃ 修饰敬神行为，但 σωφροσύνη 的范围比“贞洁”更广；采用“节制”避免把语义过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留 Ἰδού 的提示和强调作用。“我要……吃”根据残缺或不顺畅的希腊语分词结构及上下文，以自然汉语表达其当场宣告的动作；末句“于是我吃了”则保留原文独立的完成动作。
