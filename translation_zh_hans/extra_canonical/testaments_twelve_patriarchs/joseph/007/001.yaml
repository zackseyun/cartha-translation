revisions:
- from: “为要让你明白，不敬虔之人的恶意绝不能胜过那些以节制敬畏上帝的人，看哪，我要从其中拿一点，当着你的面吃。”说了这话，我又这样说道：“我列祖的上帝和亚伯拉罕的天使必与我同在。”于是我吃了。
  to: “为要让你明白，不敬虔者的恶不能胜过那些在节制中敬畏上帝的人。看哪，我拿了其中的一些，正在你面前吃。”说了这话后，我这样说：“我列祖的上帝和亚伯拉罕的天使必与我同在。”我就吃了。
  rationale: 修订按希腊文本优先：以“拿了……正在……吃”对应 λαβών…ἐσθίων，保留原文所呈现的进行动作，而不把它解释成未来的宣告；末句独立的 ἔφαγον 仍译为完成的“我就吃了”。同时删除无根据的“绝”并将 κακία 译为语义较宽的“恶”。“亚伯拉罕的天使”维持属格歧义，不作神学解释。
