base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/004.yaml
  text: And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he healed her with words.
translation:
  language: zh_hans
  text: 她丈夫看见她，就问她：“你的脸色怎么了？”她对他说：“我正承受心中的痛苦；我心灵的叹息紧紧困住我。”于是，他用言语治好了她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί συνέπεσε τὸ πρόσωπόν σου;
  choice: 你的脸色怎么了？
  rationale: 希腊语字面近于“你的脸发生了什么”，语境指面容显出异样；现代汉语以“脸色怎么了”自然传达其意。
- source_word: πόνον καρδίας ἐγὼ ἀλγῶ
  choice: 我心中痛苦，疼痛不已
  rationale: 保留 πόνον（痛苦、疼痛）与 ἀλγῶ（我疼痛）的叠加强调，同时避免生硬直译。
- source_word: οἱ τοῦ πνεύματος στεναγμοὶ
  choice: 我灵里的叹息
  rationale: πνεῦμα 可指人的灵或内在生命；译作“灵”以保留原文表达及其可能的属灵含义，不窄化为单纯“内心”。
- source_word: συνέχουσί με
  choice: 紧紧困住我
  rationale: συνέχω 有压迫、控制、紧紧抓住之意；此译保留受叹息辖制、无法摆脱的力度。
- source_word: ἐθεράπευσεν αὐτὴν ἐν λόγοις
  choice: 他用言语治好了她
  rationale: 按不定过去时直陈语气直接译为“治好了”，不加入原文没有的“试图”；ἐν λόγοις 译作“用言语”。
theological_decisions:
- issue: “灵里的叹息”中 πνεῦμα 的所指
  choice: 保留“灵”
  alternative: 译为“内心”或“心灵”
  rationale: 原文并未明确限定为情绪或圣灵；“我灵里的叹息”既符合人物自述，也保留语义张力。
- issue: 丈夫言语所产生的效果
  choice: 译为“治好了她”
  alternative: 译为“安慰她”或“试着医治她”
  rationale: ἐθεράπευσεν 是明确的完成性陈述；不应弱化为尝试，也不应仅按语境改写成“安慰”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话口吻清楚易懂；叙述末句保持原文较强的“医治”措辞，不作心理化释义。
