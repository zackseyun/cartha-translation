  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/006.yaml
  text: But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,
translation:
  language: zh_hans
  text: 但我看出，是彼列的灵在搅扰她，就向主祷告，对她说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: 看出
  rationale: 表示约瑟领会、察觉到事情背后的原因；“看出”在现代汉语中自然，也保留认知判断的意味。
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: 彼列的灵
  rationale: 按原文直译，保留第二圣殿时期文献中的专名“彼列”及其属灵含义，不将其直接解释为“邪灵”或“魔鬼”。
- source_word: ἐνοχλεῖ αὐτήν
  choice: 在搅扰她
  rationale: ἐνοχλέω可指烦扰、侵扰；“搅扰”既体现持续作用，也不额外断定附身等更强含义。
- source_word: προσευξάμενος τῷ Κυρίῳ
  choice: 就向主祷告
  rationale: 准确表达向主祈祷，并以“就”自然连接希腊语分词所表示的先行动作。
- source_word: εἶπον πρὸς αὐτήν
  choice: 对她说
  rationale: 采用现代标准汉语中最自然的引语引入方式。
theological_decisions:
- issue: “彼列的灵”究竟指独立邪灵、彼列本人，还是受彼列支配的力量
  choice: 保留“彼列的灵”
  alternative: 译作“彼列所差的邪灵”或“彼列的邪恶势力”
  rationale: 原文没有进一步界定其本体或作用方式，故保留其神学与语义上的开放性。
- issue: ἐνοχλεῖ是否意味着附身
  choice: 译作“搅扰”
  alternative: 译作“附在她身上”
  rationale: 原词仅明确表达烦扰或侵扰，不足以断言附身。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“但我看出，是……”突出原文所领会到的原因；句末用冒号，因为本节引出随后约瑟所说的话。
