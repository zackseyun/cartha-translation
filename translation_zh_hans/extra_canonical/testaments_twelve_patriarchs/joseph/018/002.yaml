  to: 如果有人想要加害你们，你们却要以善行回应，并为他祷告；主必救你们脱离一切恶。
  rationale: 修订保留原有的现代庄重语体和伦理对照，同时以“并”忠实呈现两个相连的劝勉，不把后句应许解释成明示的条件结果；并以“一切恶”保留原文 κακοῦ 的语义宽度。
  reviewer_model: gpt-5.6-terra
