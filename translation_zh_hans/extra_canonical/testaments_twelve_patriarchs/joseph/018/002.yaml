    issue: “这样”强化了原文未明说的因果／条件关系。
    rationale: 原文在祷告劝勉后以 καί 接续“你们将由主得救”；可存在语境关联，但不宜在译文中明确编码为“这样做便导致”的关系。
  - severity: low
    issue: “一切邪恶”略窄且在现代汉语中偏抽象。
    rationale: ἀπὸ παντὸς κακοῦ 可泛指各种恶、恶事或祸患；“一切恶”保留其范围与歧义。
  revised_text: 如果有人想要加害你们，你们却要以善行回应，并为他祷告；主必救你们脱离一切恶。
