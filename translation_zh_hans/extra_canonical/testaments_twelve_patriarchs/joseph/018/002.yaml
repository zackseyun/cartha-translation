source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ *ἐάν τις θέλει⁷ κακοποιῆσαι ὑμᾶς, ὑμεῖς τῇ ἀγαθοεργείᾳ⁸ εὔχεσθε ὑπὲρ αὐτοῦ, καὶ ἀπὸ παντὸς κακοῦ λυτρωθήσεσθε ὑπὸ⁹ Κυρίου¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/002.yaml
  text: And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.
translation:
  language: zh_hans
  text: 如果有人想要加害你们，你们却要以善行回应，并为他祷告；主必救你们脱离一切恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοποιῆσαι
  choice: 加害
  rationale: 在此处表示对人行恶、伤害人；译作“加害”自然简洁，并保留敌意行为的含义。
- source_word: τῇ ἀγαθοεργείᾳ
  choice: 以善行回应
  rationale: 原词指行善；结合前面的加害行为，译为“以善行回应”清楚表达以善报恶的对照，同时不把后面的祷告并入其语法范围。
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: 为他祷告
  rationale: 直接传达为欲加害者祈求的意思，符合现代汉语表达。
- source_word: ἀπὸ παντὸς κακοῦ
  choice: 脱离一切邪恶
  rationale: κακόν 可指恶事、灾祸或邪恶；“一切邪恶”保留其较宽泛且略有歧义的范围。
- source_word: λυτρωθήσεσθε ὑπὸ Κυρίου
  choice: 主必救你们
  rationale: 被动式加施事者“主”在汉语中自然转为主动句；“救……脱离”准确表达解救、释放之意。
theological_decisions:
- issue: 行善、祷告与蒙拯救之间的关系
  choice: 以“这样”连接劝勉与应许，不进一步界定因果机制
  alternative: 明确译成“因为你们这样做，主就必……”
  rationale: 原文以 καί 顺接，并未细说这是功德因果、条件，还是随后的应许；译文保留这种神学张力。
- issue: “一切恶”的所指
  choice: 译作“一切邪恶”
  alternative: 译作“一切灾祸”或“一切恶者”
  rationale: 原文 παντὸς κακοῦ 为中性形式，既可涉及恶本身，也可涉及恶事或祸患；不把它限定为人格化的“恶者”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“你们却要”凸显面对加害时反向行善的伦理对照；整体保持简洁的劝诫与应许语气。
