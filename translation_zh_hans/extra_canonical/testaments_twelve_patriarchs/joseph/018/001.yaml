base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/001.yaml
  text: If, then, you also walk in the commandments of the Lord, God will exalt you with good things forever.
translation:
  language: zh_hans
  text: 所以，你们若也遵行主的诫命，神必以美福高举你们，直到永远。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以美福”也可译作“在美善中”或“在福乐中”；希腊文介词短语在此可表达处境、伴随或凭借。
    reason: 说明 ἐν ἀγαθοῖς 的语法和语义具有真实歧义，避免正文将其过度限定。
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: 遵行……诫命
  rationale: 字面为“行在……诫命中”；现代汉语以“遵行诫命”自然表达持续按诫命生活的含义。
- source_word: ὑψώσει
  choice: 高举
  rationale: 保留“使升高、抬举”的核心意象，同时在现代中文宗教语境中自然表达神使人得尊荣的意思。
- source_word: ἐν ἀγαθοῖς
  choice: 以各样美福
  rationale: 介词短语可指在美善或福分之中，也可带有凭借、伴随之意；“以各样美福”既合乎中文表达，也不把其含义限缩为物质财富。
- source_word: εἰς αἰῶνας
  choice: 直到永远
  rationale: 准确表达持续至永世的时间含义，并符合现代庄重中文的惯用表达。
theological_decisions:
- issue: 遵行诫命与神高举之间的条件关系
  choice: 保留“若……必……”的条件句式
  alternative: 将其弱化为一般性的劝勉或因果倾向
  rationale: 原文 ἐὰν 与将来时 ὑψώσει 构成明确条件结构；译文不额外说明其救恩论性质，以免引入原文未明说的教义判断。
- issue: “美福”的性质
  choice: 采用不限定类别的“各样美福”
  alternative: 译为“财富”“属灵福分”或“善行”
  rationale: ἀγαθοῖς 的范围较宽，原文没有明确限定为物质、属灵或伦理层面的善，因此保留开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“所以”承接上文推论；“你们若也”保留原文“你们也”的强调；全句保持劝诫文学的凝练语气。
