base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/004.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things.
translation:
  language: zh_hans
  text: 他确实赐给我比以色列俊美之人更出众的美貌；他保守我直到老年，仍有力量和美貌；因为我在一切方面都像雅各。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα
  choice: 俊美
  rationale: 在此指人的美貌；“俊美”自然、庄重，也适合男性约瑟。
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: 胜过以色列中俊美的人
  rationale: 保留比较意义，并将“以色列”自然理解为以色列群体中的人，不额外限定身份。
- source_word: ἐφύλαξέ με
  choice: 他保守我
  rationale: 既表达保存、护佑之意，也符合宗教叙事语体。
- source_word: ἕως γήρους
  choice: 直到年老
  rationale: 直译时间界限，现代汉语自然。
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: 仍有力量，仍然俊美
  rationale: 将希腊语两个介词短语转换为自然汉语状态表达，同时保留二者并列。
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  choice: 我在一切方面都像雅各
  rationale: 忠实保留范围广泛的“在一切方面”，不擅自解释具体所指。
theological_decisions:
- issue: 赐予与保守的主语
  choice: 沿用上文语境，以“他”表达希腊文隐含主语
  alternative: 明确译作“上帝”
  rationale: 本节希腊文仅以动词形式隐含主语；不在缺少本节明示名词时增补神名，以免过度解释。
- issue: “在一切方面都像雅各”的范围
  choice: 保留宽泛表述
  alternative: 限定为外貌、力量或品格方面像雅各
  rationale: 原文没有限定相似之处，应保留其真实的开放性与可能张力。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。以“俊美”对应约瑟的外貌，避免较古雅的“美貌超乎以色列诸俊秀者”；末句保持原文概括性，不作教义化扩展。
