source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἰδοὺ¹⁰ ⌜γὰρ⌉¹¹ ὁρᾶτε ὅτι ⌜διὰ τὴν *ταπείνωσιν καὶ τὴν μακροθυμίαν μου¹²⌉ θυγατέρα *ἱερέως ἡλιουπόλεως¹³ ἔλαβον ἐμαυτῷ¹⁴ εἰς γυναῖκα¹⁵, καὶ ἑκατὸν τάλαντα *χρυσίου δέδονταί μοι¹⁶ *σὺν αὐτῇ¹⁷, *καὶ ὁ¹⁸ Κύριός μου¹⁹ αὐτοὺς²⁰ κατεδούλωσεν²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/003.yaml
  text: For see, you know that through my humility and my long-suffering I took for myself as wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.
translation:
  language: zh_hans
  text: 你们看哪：正是因着自己的谦卑和长久忍耐，我娶了希利奥波利斯祭司的女儿为妻；有一百他连得金子随她给了我，我的主使他们屈服，受我辖制。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”所指不明确；希腊文用阳性复数代词，可能泛指前文相关的人，也可能源于文本传抄或省略，无法确定。
    reason: 原文αὐτούς没有明确且语法一致的先行词；“金子”（χρυσίου）为中性，不宜不加说明地把该代词确定解释为金子。
lexical_decisions:
- source_word: Ἰδοὺ γὰρ
  choice: 看哪
  rationale: ἰδού是引人注意的提示语；γάρ在此承接上文，若直译“因为”会使现代汉语突兀，故由语篇衔接隐含表达。
- source_word: ταπείνωσιν
  choice: 谦卑
  rationale: 保留该词所指的自我降卑、卑微姿态，不将其收窄为单纯的外在困苦。
- source_word: μακροθυμίαν
  choice: 恒久忍耐
  rationale: 兼顾长期承受与不轻易发怒的含义，比单用“忍耐”更能体现持续性。
- source_word: ἱερέως ἡλιουπόλεως
  choice: 希利奥波利斯祭司
  rationale: 按希腊文直译其身份与地点，不擅自判定具体宗教职衔。
- source_word: ἔλαβον ἐμαυτῷ εἰς γυναῖκα
  choice: 娶了……为妻
  rationale: 用自然汉语表达婚娶关系；“娶”已包含“为自己取得为妻”的反身意味，无须生硬重复“为自己”。
- source_word: ἑκατὸν τάλαντα χρυσίου
  choice: 一百他连得金子
  rationale: τάλαντον是古代重量及货币单位，采用音译以免错误换算为现代单位。
- source_word: κατεδούλωσεν
  choice: 使他们服在我手下
  rationale: 表达使之臣服、受支配的强义，同时避免将此处直接写成现代制度意义上的“奴役”。
theological_decisions:
- issue: “我的主”（ὁ Κύριός μου）的指称
  choice: 我的主
  alternative: 主／我的主人
  rationale: 保留原文既可作神圣称谓、也可能依语境指地上主人的张力，不在正文中擅自消解。
- issue: 末句代词αὐτούς的所指
  choice: 他们，并加注说明歧义
  alternative: 那些人／它们（金子）
  rationale: 阳性复数αὐτούς并无清楚的显式先行词；译成“他们”最贴近语法形式，同时通过脚注保留所指不明的问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留古代劝诫话语的提示力度；全句适度分节，以避免希腊语长句在中文中显得拖沓。脚注标记已在正文中出现。
