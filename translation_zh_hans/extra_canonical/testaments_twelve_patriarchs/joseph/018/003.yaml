revisions:
- from: 看哪，你们知道，我因谦卑和恒久忍耐，娶了希利奥波利斯祭司的女儿为妻；随她还给了我一百他连得金子，我的主又使他们服在我手下。[a]
  to: 你们看哪：正是因着自己的谦卑和长久忍耐，我娶了希利奥波利斯祭司的女儿为妻；有一百他连得金子随她给了我，我的主使他们屈服，受我辖制。[a]
  rationale: 修订以“正是因着”在自然汉语中表达γάρ与διὰ的论证和因由关系；以“随她给了我”准确译出σὺν αὐτῇ，去除“归还”的误读；并以“屈服，受我辖制”保留κατεδούλωσεν较强的使役支配义。脚注维持并准确说明αὐτούς的文本／指称歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:21:11Z'
