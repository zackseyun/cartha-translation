base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009.yaml
  text: '1[a]. But when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and with a cheerful voice, rejoicing, I glorified my God because by a pretext I had been delivered from the Egyptian woman. Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.”


    2[b]. But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.


    3. But if one lives in self-control, and the Most High knows that glory also is fitting for him, he grants that too to him, as also to me.


    4. How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.


    5. For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned for my deception[c]. But the Lord guarded me from her schemes.'
translation:
  language: zh_hans
  text: '1[a] 我被锁链捆着时，那埃及妇人因愁苦而不支。她来到那里，便常在一旁听我怎样感谢主，怎样在黑暗之家歌唱；我又欢喜地用愉悦的声音荣耀我的上帝，因为我借着一个由头，得以摆脱那个埃及妇人。她多次派人来对我说：“只要你肯满足我的欲望，我就解开你的锁链，使你脱离黑暗。”


    2[b] 但我连心思也没有偏向她；因为上帝更爱那在黑暗深坑中忠贞自守的人，胜过那在内室中如君王一般、与放荡为伴而奢华享乐的人。


    3 但若有人在自守中度日，至高者又知道尊荣也与他相宜，就也会把尊荣赐给他，正如赐给我一样。


    4 她虽然病了，却不知有多少次在不合时宜的时刻下来找我，听见我祷告的声音；我明白她的呻吟，就默不作声。


    5 我在她家里的时候，她常露出双臂和小腿，要使我投向她。她本来就十分美丽，还特意妆饰自己来诱骗我[c]。但主保护我，使我免受她种种图谋的侵害。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黑暗之家”很可能指约瑟被囚禁的地方；希腊文保留“黑暗”的意象，并未直接称之为监狱。
    reason: cultural_note
  - marker: b
    text: 这里的希腊文传承和句法较难确定，字面大致是把“在黑暗深坑中忠贞自守的人”与“在内室中如君王一般、与放荡为伴而奢华享乐的人”作比较。
    reason: textual_variant
  - marker: c
    text: 这里译作“小腿”的词，特指膝盖以下的腿部或胫部。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηκροᾶτό
  choice: 在一旁听
  rationale: 保留动词所含的侧耳、暗中留听意味，并以“常”体现未完成时的反复性，避免过度明确为恶意“偷听”。
- source_word: ἐν οἴκῳ τοῦ σκότους / ἐκ τοῦ σκότους
  choice: 在黑暗之家／脱离黑暗
  rationale: 原文没有直接使用“监狱”，而保留“家”与“黑暗”的意象；脚注说明其所指很可能是囚禁之处。
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: 用愉悦的声音
  rationale: ἱλαρός 表示欢悦、欣然；此译与囚禁处境形成鲜明反差，同时保持现代汉语的庄重自然。
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: 借着一个由头，得以摆脱
  rationale: πρόφασις 可指借口、托词或表面理由；“由头”保留其含混性，不擅自判定具体所指。
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: 只要你肯满足我的欲望
  rationale: εὐδόκησον 表示甘愿、同意；“肯”自然传达诱劝中的同意要求，ἐπιθυμία 在此处明确具有情欲语境。
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα
  choice: 连心思也没有偏向她
  rationale: 强调约瑟不只在行动上拒绝，内心也未转向她；“偏向”对应 ἐκκλίνω 的转离、倾斜意象。
- source_word: σωφροσύνη / ἐν σωφροσύνῃ
  choice: 自守
  rationale: 该德性涵盖节制、清醒和贞洁；在本段性诱惑语境中，“自守”既自然又保留比单纯“守贞”更宽的意义。
- source_word: ἐν λάκκῳ σκότους
  choice: 在黑暗深坑中
  rationale: λάκκος 本义为坑；保留具体意象，而不直接改写为“地牢”。
- source_word: ἐν ταμείοις βασιλέα τρυφῶντα μετ’ ἀκολασίας
  choice: 在内室中如君王一般、放纵无度地享乐的人
  rationale: 此处希腊文传承和句法困难。“内室”保留 ταμεῖον 的房室含义，“如君王一般”保留 βασιλέα，同时以“放纵无度”表达 ἀκολασία 的失控与淫逸色彩。
- source_word: συμφέρει
  choice: 有益
  rationale: 该词通常表示有利、有益；不将它缩窄为仅仅“相称”，保留至高者按真正益处赐予尊荣的表述。
- source_word: ἐν ἀωρίᾳ
  choice: 在不合时宜的时刻
  rationale: 保留时间不当、非正常时刻的意味，不武断限定为深夜。
- source_word: τοὺς στεναγμούς
  choice: 呻吟
  rationale: στεναγμός 可指叹息、呻吟或因痛苦与欲望发出的声响；“呻吟”保留比“叹息”更重的语义及其在上下文中的暧昧。
- source_word: τὰς κνήμας
  choice: 小腿
  rationale: κνήμη 特指膝下的小腿或胫部，比泛称“腿”更准确。
- source_word: ἵνα συμπέσω εἰς αὐτήν
  choice: 要使我投入她的怀抱
  rationale: 原句字面近于“使我倒向／落入她”；汉语采用自然且不失身体与性诱惑意味的表达，不将其弱化为一般的附和。
- source_word: πρὸς ἀπάτην μου
  choice: 来诱骗我
  rationale: ἀπάτη 指欺骗、诱惑；结合刻意妆饰的语境，“诱骗”兼顾两层含义。
theological_decisions:
- issue: 约瑟得救与持守中的神圣作为
  choice: 明确保留“上帝更爱”以及“主保护我”
  alternative: 将重点改写为约瑟单凭个人意志自制
  rationale: 原文明言上帝的爱与主的保护；约瑟的自守和神的作为并置，不应削弱其中任何一方。
- issue: σωφροσύνη 在诱惑语境中的范围
  choice: 译作“自守”
  alternative: 守贞；节制；自制
  rationale: 此处直接涉及性方面的忠贞，但该希腊德性词的范围更广。“自守”让性纯洁由上下文显明，同时不排除心智清醒与整体节制。
- issue: 至高者赐予尊荣的条件性
  choice: 保留“若……又知道……有益，就……”的条件结构
  alternative: 表述为自守者必然获得今世尊荣
  rationale: 原文并未承诺所有自守者都必得尊荣，而是将赐予与至高者对其益处的判断相连，须保留这一神学张力。
- issue: “上帝更爱”的比较说法
  choice: 按原文保留比较级“更爱……胜过……”
  alternative: 平化为“上帝喜爱自守的人，不喜爱放纵的人”
  rationale: 原文使用 μᾶλλον 构成尖锐比较；不宜将其改写成较易调和但不同的绝对对立。
translation_notes:
  register: 采用现代标准普通话，语气庄重而清楚。保留“黑暗之家”“黑暗深坑”等原文意象，也保留第2节困难读法的生硬张力；对性诱惑直陈而不粗俗。“上帝”用于 θεός，“主”用于 κύριος，“至高者”用于 ὁ ὕψιστος。
