review_pass:
  verdict: revise
  source_fidelity: 第1节草稿承接英语审校稿，却遗漏了现存希腊文在本章开头保留的前接句：“我在锁链中时，那埃及妇人因愁苦而不支”。这不是可安全省略的背景，而是本段叙述和她随后前来听约瑟祷告的直接铺垫，宜补入。第5节“投入她的怀抱”添加了原文没有的“怀抱”意象；希腊文的“落入/投向她”措辞刻意含蓄而具性诱惑语境，应避免具体化。第3节的συμφέρει在此以“相宜/合宜”较贴近原文和英语审校轨迹，不能改成带明显功利色彩的“有益”。
  naturalness: 整体中文庄重流畅。“在一旁听”“黑暗之家”“黑暗深坑”“自守”都自然且能保留原文修辞。补足第1节后，调整为“她来到那里，便常在一旁听……”可清晰表达分词与未完成时。第5节改为“要使我投向她”既不粗俗，也避免“怀抱”的增译。
  terminology: “上帝”（θεός）、“主”（κύριος）、“至高者”（ὁ ὕψιστος）区分妥当；σωφροσύνη统一译为“自守”可接受。第2节保留困难的“内室中如君王一般”并以脚注说明，不应据此强行确定句法。
  issues:
  - severity: high
    issue: 第1节遗漏希腊文开头的监禁与埃及妇人因愁苦而不支的叙述。
    rationale: 原文在“她来”以前明确有“我在锁链中时，那埃及妇人被愁苦压住；她来到……”；英语审校稿也遗漏此处，但不能优先于原语文本。
  - severity: medium
    issue: 第3节将συμφέρει译为“有益”。
    rationale: 此处是至高者知道“尊荣也相宜/合宜”才赐下的条件；“有益”改变为主要关乎实际益处，较偏离该语境。
  - severity: medium
    issue: 第5节“投入她的怀抱”增添“怀抱”意象。
    rationale: εἰς αὐτήν仅说“投向/落入她”，在诱惑语境中含蓄表达；“怀抱”是译文新增的具体身体意象。
