  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003.yaml
  text: '1[a]. In a short time she would withdraw, to test the purpose of my soul. In ten temptations she proved me approved, and in them all I was patient; for patience is a great remedy.


    2. How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments[b], she called me back, and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”


    3. But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.


    4. And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; for those who fast for God''s sake receive grace of face.


    5. And if my master was away, I drank no wine; and every third day I would take my food, and I would give it to the poor and the sick.


    6. And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.


    7. And because she had no male child[d][c], she pretended'
translation:
  language: zh_hans
  text: '《约瑟遗训》第3章


    1. 我在十次试炼中被证明是经得起考验的；在这一切事上，我都恒久忍耐。因为恒久忍耐是一剂良药，坚忍带来许多益处。


    2. 那埃及妇人多少次以死亡威胁我！多少次把我交出去受刑，后来又叫我回去[a]！我不肯与她同寝，她就对我说：“只要你把自己交给我，你就能管辖我和我家中的所有人，作我们的主人。”


    3. 但我牢记父亲的话，便走进内室，流着泪向主祷告。


    4. 那七年间，我一直禁食；可在那埃及人[b]看来，我却像是生活优裕的人，因为为上帝禁食的人，容貌便会增添光彩。


    5. 每当我的主人外出，我就不喝酒；每到第三天[c]，我便取自己的食物，把它给穷人和病人。


    6. 我清早起来到主面前，为那埃及妇人孟斐斯[d]哭泣，因为她不断地百般纠缠我；她甚至在夜里也会进到我这里，借口说是来探望我。


    7. 她因为没有儿子，就佯装……'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在这里又有“并威胁我”一句。
    reason: textual_variant
  - marker: b
    text: 希腊文直译为“那埃及人”，是阳性单数，可能特指约瑟的埃及主人；简短措辞本身没有进一步说明。
    reason: alternative_reading
  - marker: c
    text: 这个词也可能理解为“隔三天”或“经过三天才吃”。
    reason: lexical_alternative
  - marker: d
    text: 这个希腊文本在这里称那埃及妇人为“孟斐斯”（Memphis）。
    reason: cultural_note
lexical_decisions:
- source_word: δόκιμον ἀπέδειξέ με
  choice: 他显明我是经得起考验的
  rationale: 保留“经受试验而获认可”的含义；希腊文主语承接上文而此处未明说，译文以“他”保留指代，不直接补明为上帝。
- source_word: μακροθυμία / ἐμακροθύμησα
  choice: 恒久忍耐 / 我都恒久忍耐
  rationale: 表达在持续挑衅与诱惑之下克制并忍受的德行，同时保持现代汉语的自然庄重。
- source_word: ὑπομονή
  choice: 坚忍
  rationale: 与μακροθυμία略作区分，突出在考验中坚持到底；避免把原文两个相关但不完全相同的词合并。
- source_word: φάρμακον
  choice: 良药
  rationale: 保留原文医药比喻，汉语简洁自然。
- source_word: συνελθεῖν αὐτῇ
  choice: 与她同寝
  rationale: 原语是性关系的委婉表达；“同寝”既清楚又符合庄重叙事语体。
- source_word: κυριεύσεις
  choice: 管辖
  rationale: 传达对妇人及其全家的权柄与支配，不引入此处并无必要的神学性“主权”用语。
- source_word: ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: 把自己交给我
  rationale: 保留“交出自己、屈从于我”的性意味及操控性语气，而不作露骨扩写。
- source_word: ταμεῖον
  choice: 内室
  rationale: 此处是退入私密空间祷告；“内室”自然且保持庄重。
- source_word: ἐν τρυφῇ διάγων
  choice: 生活优裕
  rationale: 表达外表看来安逸丰足，与实际禁食形成反差。
- source_word: τοῦ προσώπου τὴν χάριν
  choice: 面容会得到光彩
  rationale: 保留χάρις在此处落实于外貌、面容悦人的具体意象，同时避免生硬的“脸之恩典”。
- source_word: τριημερίζων
  choice: 每到第三天
  rationale: 在禁食语境中表达三日周期；具体是每第三日还是相隔三日仍有词义空间，另加脚注说明。
- source_word: λόγῳ ἐπισκέψεως
  choice: 借口说是来探望我
  rationale: 准确表达以探视为托词进入约瑟房间。
- source_word: προσεποιεῖτο
  choice: 佯装……
  rationale: 现存引文在动词后中断，保留不完整状态，不补写她佯装的具体内容。
theological_decisions:
- issue: 祷告语境中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 约瑟向其祷告，所指为上帝；“主”符合该语境，同时与第5节属世的主人用不同措辞区分。
- issue: 禁食者获得τοῦ προσώπου τὴν χάριν
  choice: 为上帝禁食的人，面容会得到光彩
  alternative: 为上帝禁食的人，会蒙赐悦人的容貌
  rationale: 保留文本把敬虔禁食与外在面容联系起来的神学陈述，不将其解释成单纯健康效果，也不扩写为特定教义。
- issue: 缺省主语ἀπέδειξέ με的所指
  choice: 以“他”保留承接关系
  alternative: 明确译为“上帝显明”
  rationale: 本段所给希腊文没有明写主语；虽然语境很可能指上帝，正文不应无提示地消除指代上的依赖与含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。叙事句式简洁，妇人的引诱保持委婉但不含糊。第7节按所给希腊文的残缺状态以省略号收束，不采用后世或英语旧稿中的补充内容。第1节纳入所给希腊文中“坚忍带来许多益处”一句，未沿用咨询层的遗漏。
