id: T12P.JOS.2.2
reference: Testament of Joseph 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἠγωνισάμην πρὸς γυναῖκα ἀναιδῆ ἐπείγουσάν² με παρανομεῖν μετʼ αὐτῆς, ἀλλʼ ὁ Θεὸς *τοῦ πατρός μου³ ἐρρύσατό⁴ με ἐκ⁵ φλογὸς καιομένης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/002.yaml
  text: And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame.
translation:
  language: zh_hans
  text: 我与一个无耻的女人抗争；她一再逼迫我与她一同犯法，但我父亲的上帝把我从燃烧的火焰中救了出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγωνισάμην
  choice: 抗争
  rationale: 表达持续而激烈的抵抗，既保留争战意味，也符合现代汉语语感。
- source_word: γυναῖκα ἀναιδῆ
  choice: 一个无耻的女人
  rationale: ἀναιδής指不知羞耻、厚颜无耻；直译能保留叙述者明确的道德评价。
- source_word: ἐπείγουσάν με
  choice: 她一再逼迫我
  rationale: ἐπείγω在此表示催逼、强力施压；结合语境用“一再”体现持续纠缠。
- source_word: παρανομεῖν μετʼ αὐτῆς
  choice: 与她一同犯法
  rationale: παρανομέω意为违背法律或越轨行事；不具体化为某种性行为，以保留原文相对含蓄的表达。
- source_word: ἐρρύσατό με
  choice: 把我……救了出来
  rationale: ῥύομαι强调从危险中搭救、解救；“救了出来”自然呈现脱离险境的动作。
- source_word: ἐκ φλογὸς καιομένης
  choice: 从燃烧的火焰中
  rationale: 保留原文火焰意象及其可能兼具的字面与比喻张力，不擅自解释为情欲或刑罚。
theological_decisions:
- issue: τοῦ πατρός μου的归属称谓
  choice: 我父亲的上帝
  alternative: 我祖先的上帝
  rationale: πατήρ为单数并带“我的”，最直接是“我父亲”；不将其扩展为复数祖先，以免超出原文。
- issue: 燃烧的火焰是实指还是比喻
  choice: 保留为“燃烧的火焰”
  alternative: 解释为情欲之火或犯罪的危险
  rationale: 原文没有明说该意象的具体所指；直保其张力，避免替读者作神学或心理解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“与她一同犯法”保留原文的含蓄和法律—道德色彩；分号用于清楚呈现女人施压与约瑟抗争之间的关系。
