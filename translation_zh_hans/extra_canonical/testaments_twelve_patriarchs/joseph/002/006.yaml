  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/006.yaml
  text: But in all these things he takes the lead, and in various ways he encourages. For a short time he withdraws, in order to test the inner intent of the soul.
translation:
  language: zh_hans
  text: 但在这一切事上，他带头，并以各种方式鼓励。他暂时离开，为要试验灵魂所怀的意图。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προΐσταται
  choice: 带头
  rationale: 该动词可表示站在前面、领导或率先而行；结合此处行动语境，译作“带头”自然，并保留其主动引领之意。
- source_word: παρακαλεῖ
  choice: 鼓励人
  rationale: παρακαλέω语义范围包括劝勉、鼓励、安慰和恳求；此处依上下文采用较宽泛自然的“鼓励”，宾语“人”作为汉语表达所需的泛指补足。
- source_word: ἐν βραχεῖ
  choice: 暂时
  rationale: 表达时间短暂，译作“暂时”符合现代汉语习惯。
- source_word: ἀφίσταται
  choice: 退去
  rationale: 保留离开、撤开一段距离的动态含义，不强化为永久离弃。
- source_word: τῆς ψυχῆς τὸ διαβούλιον
  choice: 灵魂内在的意向
  rationale: διαβούλιον指筹谋、意图或内在盘算；“内在的意向”既传达内心深处的取向，也不过度限定为已经作出的决定。ψυχή依原文译为“灵魂”。
theological_decisions:
- issue: 主语“他”的身份
  choice: 保留“他”，不在正文中指明身份
  alternative: 按上下文解释为某一特定人物或属灵存在
  rationale: 本节希腊文仅以动词第三人称单数隐含主语；在缺少本段更广上下文时，直接补明身份会消除原文在本节中的指代开放性。
- issue: 试验的对象
  choice: 译为“灵魂内在的意向”
  alternative: 译为“灵魂的决定”或“人的内心”
  rationale: 原文所试验的是διαβούλιον，即灵魂中的意图或盘算，而非笼统的整个人心；所选译法保留这种细微区别。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式尽量贴近希腊文两句结构，同时以“暂时”和“为要”自然表达时间与目的关系；不添加宗派性解释。
