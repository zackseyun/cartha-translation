  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/001.yaml
  text: And this man, the captain of Pharaoh's guard, entrusted his house to me.
translation:
  language: zh_hans
  text: 这人——法老的侍卫长[a]——把他的家交托给我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法老的侍卫长”在希腊文本传承中有异文；有些文本不含这一称谓。
    reason: 原文校勘标记显示此称谓短语存在文本差异；脚注保留该证据，而正文采用包含该短语的文本。
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: 护卫长
  rationale: 该词字面可指宫廷中主管屠宰或膳食的官长，但在约瑟叙事及其《创世记》背景中是法老官员的职衔；译作“护卫长”既符合叙事身份，也比直译“御厨长”自然准确。
- source_word: ἐπίστευσέ μοι
  choice: 交托给我
  rationale: 动词表示因信任而把某事物托付给人；“交托给我”保留了信任与委托的含义。
- source_word: τὸν οἶκον αὐτοῦ
  choice: 他的家
  rationale: οἶκος既可指房屋，也可涵盖家室与家务产业；译作“家”保留这一语义宽度，避免擅自缩窄为“家产”或“家务”。
theological_decisions: []
