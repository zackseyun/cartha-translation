source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ ὡς ἄνθρωπος ἐπαισχύνεται ὁ Θεός, Οὔτε¹⁶ ὡς υἱὸς ἀνθρώπου δειλιᾷ, Οὔτε¹⁷ ὡς γηγενὴς [ἀσθενεῖ ἢ]¹⁸ πτοεῖται¹⁹,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/005.yaml
  text: For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, [does he become weak or] is he terrified.
translation:
  language: zh_hans
  text: 因为上帝不像人那样感到羞愧，也不像人的儿子那样胆怯，也不像生于大地的人那样[软弱或]惊恐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαισχύνεται
  choice: 感到羞愧
  rationale: 保留该动词“羞愧、以为耻”的基本意义，并以现代汉语自然表达。
- source_word: υἱὸς ἀνθρώπου
  choice: 人子
  rationale: 直译希腊语表达，保留其与“人”及“土生的人”并列的修辞结构，不在译文中额外赋予称号意义。
- source_word: δειλιᾷ
  choice: 胆怯
  rationale: 表达因惧怕而畏缩的状态，并与后面的“惊恐”有所区别。
- source_word: γηγενὴς
  choice: 土生的人
  rationale: 依词源呈现“由土地而生”的意思，保留原文关于尘世受造者的形象，避免仅泛化为“凡人”。
- source_word: ἀσθενεῖ
  choice: 软弱
  rationale: 对应“变得软弱、无力”；原文校勘上置于方括号内，译文亦保留方括号。
- source_word: πτοεῖται
  choice: 惊恐
  rationale: 体现受到惊吓、陷入恐惧的较强语气，并与δειλιᾷ的“胆怯”区分。
theological_decisions:
- issue: “人子”是否作为特定弥赛亚称号处理
  choice: 保留为“人子”，但不增添专名化标记或解释
  alternative: 译作“世人”或“人的儿子”
  rationale: 本句处于“人—人子—土生的人”的平行比较中；直译既保留潜在互文，也不武断判定其专门神学含义。
- issue: 上帝“感到羞愧”的拟人性陈述
  choice: 按否定比较句直接翻译
  alternative: 释义为“上帝绝不失信”或“上帝无须羞愧”
  rationale: 原文明确使用ἐπαισχύνεται；不以神学推论替换其措辞，从而保留原句的修辞张力。
- issue: 校勘存疑短语[ἀσθενεῖ ἢ]
  choice: 在正文中保留为[软弱或]
  alternative: 无括号译入正文，或完全省略
  rationale: 源文本以方括号标示该短语，且英文审校层也要求体现；译文应如实保留文本不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。维持三重“也不像……那样”的平行结构，并保留校勘方括号；本节无需脚注标记。
