- from: 因为上帝不像人那样感到羞愧，也不像人子那样胆怯，也不像土生的人那样[软弱或]惊恐。
  to: 因为上帝不像人那样感到羞愧，也不像人的儿子那样胆怯，也不像生于大地的人那样[软弱或]惊恐。
  rationale: 修订仅处理“人子”可能造成的专名化误读，并改善 γηγενής 的现代汉语表达；三重平行、否定比较、动词强度差别及校勘方括号均予保留。
