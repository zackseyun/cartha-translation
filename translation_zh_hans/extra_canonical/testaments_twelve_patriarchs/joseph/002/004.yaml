base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/004.yaml
  text: For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress.
translation:
  language: zh_hans
  text: 因为主不撇弃敬畏他的人，无论他们身处黑暗、锁链、患难，还是困境之中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文后半句没有重复“不撇弃”这一动词，直译可作：“不在黑暗中，或锁链中，或患难中，或困境中。”这些介词短语承接前句，表示即使敬畏主的人身处这些境况，主也不撇弃他们。
    reason: 说明原文省略重复动词的结构，并准确交代该结构与前句的承接关系。
lexical_decisions:
- source_word: ἐγκαταλείπει
  choice: 撇弃
  rationale: 表达在困苦中弃置不顾之意，同时保留原文现在时所陈述的一般真理。
- source_word: τοὺς φοβουμένους αὐτόν
  choice: 敬畏他的人
  rationale: “敬畏”既包含敬重，也保留面对上主的畏惧感，是此类宗教语境中自然且准确的表达。
- source_word: σκότει
  choice: 黑暗
  rationale: 保留原文可指实际幽暗处境、也可有象征意味的开放性。
- source_word: δεσμοῖς
  choice: 锁链
  rationale: 在约瑟受囚的语境中自然具体，也能代表被捆绑、监禁的状态。
- source_word: θλίψεσιν
  choice: 患难
  rationale: 体现受压迫、遭苦难的含义，符合庄重而通俗的中文经文语体。
- source_word: ἀνάγκαις
  choice: 困境
  rationale: 涵盖逼迫、窘迫和不得已的艰难处境，并与“患难”保持适当区分。
theological_decisions:
- issue: “不撇弃”与敬畏者仍经历苦难之间的张力
  choice: 译为“无论他们身处……之中”，表明主在这些处境中仍不撇弃他们
  alternative: 将后半句理解为主使他们不落入黑暗、锁链、患难或困境
  rationale: 希腊文省略了后半句的动词，语法关系存在一定开放性；上下文列举受苦处境，更自然地指即使身在其中也不被主撇弃，而非保证免遭这些经历。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“因为”承接上文论述；为使省略动词的希腊语列举在中文中通顺，补出“无论他们身处……之中”，同时以脚注保留原文结构的歧义。
