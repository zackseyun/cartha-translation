  text: Ἐφυλακίσθην⁶, ἐτύφθην⁷, ⸢ἐξεμυκτηρίσθην⸣⁸, καὶ ἔδωκέ με⁹ ὁ¹⁰ Κύριος¹¹ εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/003.yaml
  text: I was imprisoned, I was beaten, I was mocked, and the Lord gave me compassion in the sight of the jailer.
translation:
  language: zh_hans
  text: 我曾被囚禁，被殴打，被嘲弄；而且主使我在狱卒面前蒙怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐφυλακίσθην
  choice: 我曾被囚禁
  rationale: 用被动表达保留不定过去时被动语态的受事重点；“囚禁”自然且符合监牢语境。
- source_word: ἐτύφθην
  choice: 被殴打
  rationale: 准确表达 τύπτω 被动式所指的击打或殴打，语体庄重自然。
- source_word: ἐξεμυκτηρίσθην
  choice: 被嘲弄
  rationale: 该词表示遭到讥嘲、嗤笑；“嘲弄”既保留羞辱意味，也适合现代汉语。
- source_word: εἰς οἰκτιρμοὺς
  choice: 蒙受怜悯
  rationale: οἰκτιρμοί 核心义为怜悯、同情；结合 ἔδωκέ με 的使役性结构，以“使我……蒙受怜悯”表达结果，而不弱化为一般性的“恩待”。
- source_word: ἐνώπιον τοῦ δεσμοφύλακος
  choice: 在狱卒面前
  rationale: 直译介词结构，并以“狱卒”准确表达 δεσμοφύλαξ，即看守囚犯的人。
theological_decisions:
- issue: 主的作为与狱卒的怜悯之间的关系
  choice: 主使我在狱卒面前蒙受怜悯
  alternative: 主使狱卒怜悯我
  rationale: 原文以“我”为 ἔδωκεν 的宾语，并保留“在狱卒面前”的结构；所选译法不把原文进一步明确为主直接改变狱卒的内心，因而保留其表达张力。
- issue: καί 的篇章关系
  choice: 译作“但”
  alternative: 译作“并且”
  rationale: καί 通常为并列连词，但此处前三项受苦与随后主所赐的怜悯构成明显转折；汉语用“但”能自然呈现语义关系而不改变事件内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。前三个被动短语保持整齐的排比；分号划分受苦与主所赐怜悯两个层次。无脚注标记。
