  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007.yaml
  text: '7. So that you may learn that the wickedness of the ungodly will not prevail over those who fear God in self-control, look: taking some of it before him, I ate it in your presence. And after saying this, I tasted it and said, “The God of my fathers and the angel of Abraham will be with me.” And I ate.


    8. But when she saw this, she fell on her face at my feet, weeping; and raising her up, I admonished her.


    9. And she agreed with me not to commit this impiety any longer. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would collapse suddenly, though she was not sick.


    10. And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he tried to heal her with words.


    11. Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking; or I will throw myself down a cliff, if you do not join yourself with me.”


    12. But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,


    13. “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband''s concubine, your rival, will beat your children and wipe out your memory from the earth.”'
translation:
  language: zh_hans
  text: '7 为要让你明白，不敬神之人的恶行不能胜过那些在节制中敬畏神的人，你看，我从那食物中取了一些，当着你的面吃了。我说完这些话，就说：“我祖先的上帝和亚伯拉罕的天使必与我同在。”我就吃了。


    8 她看见这事，就俯伏在我脚前哭泣；我扶她起来，劝诫她。


    9 她便答应我，不再做这种不敬神的事。然而，她的心仍趋向邪恶，不住地察看怎样才能诱我落入圈套。她还唉声叹气，常常突然倒下，其实并没有生病。


    10 她丈夫看见她，就问她：“你的脸怎么了？”她对他说：“我因心中痛苦而疼痛，灵里的叹息紧紧压迫着我。”她丈夫便用言语安慰她。


    11 后来，她寻得机会，趁丈夫还在外面，猛然闯到我这里，对我说：“我快窒息了！如果你不与我结合，我就从悬崖上跳下去。”


    12 我看出是彼列[a]的灵在搅扰她，就向主祷告，然后对她说：


    13 “可怜的女人，你为什么如此不安、烦乱，在罪中自我蒙蔽呢？要记住：如果你杀死自己，你丈夫的妾、你的情敌阿斯忒托，就会殴打你的孩子，使你的名从地上消失。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”是犹太文献中对邪恶势力或其首领的称呼；此处希腊文为Βελίαρ（Beliar）。
    reason: 帮助现代读者识别较陌生的专名，同时不在正文中作过度解释。
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: 节制
  rationale: 此词可涵盖自制、贞洁和明智克己；本段虽处于性试探语境，仍保留其较宽的伦理含义。
- source_word: θεοσεβούντων
  choice: 敬畏神的人
  rationale: 自然表达敬奉、敬畏上帝之意，并与后文“不敬神”形成对应。
- source_word: κατισχύσει
  choice: 不能胜过
  rationale: 保留“占上风、制胜”的强度，而非仅译作“不能伤害”。
- source_word: ἐνουθέτησα
  choice: 劝诫她
  rationale: 兼具劝导与警戒之意，符合约瑟随后规劝她的语境。
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: 与我结合
  rationale: 原词在此委婉指性结合；译文保留委婉性，不额外露骨化。
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: 彼列的灵
  rationale: 按专名音译，并保留属格结构，不把它释义化为一般的“邪灵”。
- source_word: ἐν λόγοις
  choice: 用言语宽慰她
  rationale: θεραπεύω本义可为医治、照料；此处方式明确是言语，结合语境译为口头宽慰。
- source_word: κονδυλίσει
  choice: 殴打
  rationale: 该动词指以拳头或关节击打；“殴打”准确且自然。
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς
  choice: 使你的名从地上消失
  rationale: μνημόσυνον指留存的纪念或名声；汉语以“名从地上消失”自然传达后世记念被断绝。
theological_decisions:
- issue: “亚伯拉罕的天使”的身份
  choice: 直译为“亚伯拉罕的天使”
  alternative: 解释为“守护亚伯拉罕的天使”或特定神圣位格
  rationale: 希腊文只给出属格关系，身份与功能并未说明，译文不作教义性判定。
- issue: 彼列之灵与女子责任的关系
  choice: 既保留“彼列的灵在搅扰她”，也保留她自己的心趋向邪恶和犯罪责任
  alternative: 把行为完全归因于邪灵，或删除灵界因素
  rationale: 原文同时呈现外在属灵搅扰与当事人的意志和罪责，应保存这种张力。
- issue: “灵里的叹息”中πνεῦμα的含义
  choice: 译为“灵里的叹息”
  alternative: 译为“气息的呻吟”或“圣灵的叹息”
  rationale: 此处可指人的内在之灵或精神状态；不应大写或解释成圣灵。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。依用户所给连续编号译为7—13节；原希腊版在第9节中段进入第七章，其后原章内编号为1—5。正文尽量保存希腊文的重复、委婉语和属灵—伦理张力；仅在汉语不自然之处适度显化主语与逻辑关系。
