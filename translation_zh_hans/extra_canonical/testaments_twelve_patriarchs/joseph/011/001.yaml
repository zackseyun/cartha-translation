source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὑμεῖς οὖν¹, *τέκνα μου², ⌜ἔχετε ἐν πάσῃ³ πράξει ὑμῶν *πρὸ ὀφθαλμῶν ὑμῶν⁴ *τὸν τοῦ θεοῦ φόβον⁵, καὶ⁷ τιμᾶτε⁶ τοὺς ἀδελφοὺς ὑμῶν· πᾶς γὰρ ὁ⁷ ποιῶν⁸ νόμον Κυρίου ἀγαπηθήσεται ὑπʼ⁹ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/001.yaml
  text: And so, my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.
translation:
  language: zh_hans
  text: 所以，我的孩子们，在你们一切行事上，都要把对上帝的敬畏摆在眼前，并且尊敬你们的弟兄；因为凡遵行主的律法的人，必为他所爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留父亲临终训诫子女的亲密称呼，符合现代汉语自然表达。
- source_word: ἐν πάσῃ πράξει ὑμῶν
  choice: 在一切所行的事上
  rationale: 兼顾 πράξει 的“行为、行事”含义与中文流畅度，表达每项行动的全面范围。
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: 摆在眼前
  rationale: 保留希腊文具体的视觉隐喻，而不抽象化为“牢记”。
- source_word: τὸν τοῦ θεοῦ φόβον
  choice: 对上帝的敬畏
  rationale: φόβος 在此指向对上帝既畏惧又尊崇的宗教态度；“敬畏”保留其张力。
- source_word: τιμᾶτε
  choice: 尊敬
  rationale: 准确表达持续给予尊重和荣誉的命令。
- source_word: τοὺς ἀδελφοὺς ὑμῶν
  choice: 你们的弟兄
  rationale: 保留ἀδελφούς的亲属或群体成员含义，不擅自限定为亲生兄弟或泛化为所有人。
- source_word: ποιῶν νόμον Κυρίου
  choice: 遵行主律法
  rationale: ποιέω 与 νόμος 连用表示实行、遵行律法；采用自然且庄重的汉语宗教表达。
- source_word: ἀγαπηθήσεται ὑπʼ αὐτοῦ
  choice: 必蒙他所爱
  rationale: 保留将来被动语态及施事者“他”，不额外解释所指。
theological_decisions:
- issue: “敬畏上帝”中 φόβος 的语义
  choice: 对上帝的敬畏
  alternative: 惧怕上帝
  rationale: “敬畏”既不消除恐惧维度，也避免把经文缩减为单纯惊恐，较完整地承载宗教语境中的尊崇与畏惧。
- issue: “凡遵行主律法的人必蒙他所爱”可能涉及行为与神之爱的关系
  choice: 按原文直译其条件式陈述，不加解释
  alternative: 改写为“凡因爱主而遵行律法的人”或加入恩典方面的限定
  rationale: 原文明确连接遵行主律法与被他所爱；译文保留这一神学张力，不导入后来的教派性协调。
- issue: 末尾 αὐτοῦ 的指代
  choice: 他
  alternative: 主或上帝
  rationale: 希腊文使用代词，其先行对象可由语境理解；保留代词可避免译者过度明确化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“摆在眼前”保留原文意象；“弟兄”“主律法”“蒙他所爱”维持遗训文学的肃穆语体，同时避免生僻古奥。
