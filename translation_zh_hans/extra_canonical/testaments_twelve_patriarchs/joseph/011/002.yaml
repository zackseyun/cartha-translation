  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/002.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: zh_hans
  text: 当我和以实玛利人同行时，他们一再问我说：“你是奴仆吗？”我回答说：“我是家中的奴仆。”免得使我的兄弟们蒙羞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος ... μετὰ τῶν Ἰσμαϊλιτῶν
  choice: 我和以实玛利人一同前行时
  rationale: 分词 Ἐρχόμενος 在此表示伴随情境；用“一同前行”自然表达与以实玛利人同行，且不额外指定目的地。
- source_word: ἐπηρώτων
  choice: 一再问
  rationale: 未完成时态表示持续或反复询问，译为“一再问”保留这一语气。
- source_word: Δοῦλος
  choice: 奴仆
  rationale: δοῦλος 指处于奴役身份的人；“奴仆”比单纯“仆人”更能保留身份性质，同时适合庄重叙事。
- source_word: δοῦλος ... ἐξ οἴκου
  choice: 家中所生的奴仆
  rationale: ἐξ οἴκου 直指“出自家中/家里”，语境中最可能指家生奴仆；如此也与约瑟为遮掩兄弟卖他的事实相吻合。
- source_word: αἰσχύνω
  choice: 使……蒙羞
  rationale: 保留使役含义及羞耻、失面子的语义，不将其窄化为“揭发”或“控告”。
theological_decisions:
- issue: 约瑟所作身份陈述的性质
  choice: 按原文直译其自称为“家中所生的奴仆”，不评断其言语的伦理性质
  alternative: 解释为一般的“家仆”，或明说这是为兄弟圆谎
  rationale: 经文只说明他的目的在于不使兄弟蒙羞，并未在本节直接作道德评判；译文不应替文本消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“奴仆”保留古代身份制度的含义；引语分明，并以“一再问”呈现希腊语未完成时的反复性。
