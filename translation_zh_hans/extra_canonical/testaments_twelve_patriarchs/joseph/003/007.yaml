  text: 她又因为没有男孩子，便假装……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本在“假装”之后中断，未说明她假装什么。
    reason: 向读者说明句子不完整源于底本文本残缺，而非汉语误漏。
lexical_decisions:
- source_word: τέκνον ἄρρεν
  choice: 男孩子
  rationale: 直译为“男性孩子”；现代汉语中“男孩子”自然清楚，也避免把原文具体化为“儿子”。
- source_word: προσεποιεῖτο
  choice: 假装
  rationale: 该未完成时动词表示装作、佯作；译为“假装”贴近词义。由于现存希腊文本在此中断，不补出她假装的具体内容。
- source_word: Καὶ ὅτι
  choice: 又因为
  rationale: 保留与上文的连接和原因关系；“又因为”符合现代汉语叙事表达。
theological_decisions:
- issue: 残缺从句是否补足
  choice: 不补足，以省略号标明现存文本中断
  alternative: 依据上下文补译“要我像儿子一样待她”等内容
  rationale: 希腊文只到“她便假装”，宾语或补语未保存；补足会把推测写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以省略号保留原文残缺状态，并用脚注说明；不依据英文旧译的补文扩写。
