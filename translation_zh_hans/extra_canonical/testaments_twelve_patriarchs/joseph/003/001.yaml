  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/001.yaml
  text: In ten temptations he proved me approved, and in them all I was patient; for patience is a great remedy, and endurance gives many good things.
translation:
  language: zh_hans
  text: 她十次试探我，却显明我经得起考验；在这一切事上，我都始终忍耐。因为忍耐是良药，坚忍能带来许多益处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πειρασμοῖς
  choice: 试探
  rationale: 该词在本段语境中指带有诱惑性质的考验；译作“试探”既保留道德压力，也不排除考验之意。
- source_word: δόκιμον ἀπέδειξέ με
  choice: 考验我，显明我是经得起考验的
  rationale: δόκιμος表示经检验而获认可；用“显明”表达ἀπέδειξεν的证明、展示意味，避免生硬的“证明我为合格”。
- source_word: ἐμακροθύμησα / ἡ μακροθυμία
  choice: 恒久忍耐
  rationale: 前后采用一致措辞，表达在挑衅或苦难中长久克制、忍受的含义。
- source_word: φάρμακον
  choice: 良药
  rationale: 保留原文的医治性隐喻；μέγα在此表达卓越功效，译为“极好的”较自然。
- source_word: ἡ ὑπομονή
  choice: 坚忍
  rationale: 与μακροθυμία有所区分，侧重在困境下坚持承受、不退缩。
- source_word: πολλὰ ἀγαθὰ δίδωσιν
  choice: 能带来许多益处
  rationale: 自然表达“给予许多好处”，同时保留其概括性，不具体化原文未说明的善果。
theological_decisions:
- issue: 试探者的身份
  choice: 保留阳性代词“他”
  alternative: 按叙事中的女性施诱者译为“她”
  rationale: 所给希腊文本主句动词未明示主语，但英语审校层采用“he”，可能将施行考验归于上帝；为避免擅自改写该理解，正文保留“他”，同时不增添“上帝”等原文未出现的称谓。
- issue: 人在试炼中获认可的含义
  choice: “显明我是经得起考验的”
  alternative: “证明我是蒙悦纳的”
  rationale: 保留δόκιμος的受验合格含义，不将其直接扩展为救恩、称义或神学上的蒙悦纳。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。通过“恒久忍耐”与“坚忍”区分μακροθυμία和ὑπομονή，并保留“良药”的原文比喻。
