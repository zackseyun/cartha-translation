base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/005.yaml
  text: And if my master was away, I drank no wine; and for three days I would take my food and give it to the poor and the sick.
translation:
  language: zh_hans
  text: 每当我主人出门在外时，我就不喝酒；三天期间，我取自己的食物，分给穷人和病人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεδήμει
  choice: 出门在外
  rationale: 表示离开本地、外出的状态；这样译成现代汉语自然，也不额外限定行程性质。
- source_word: ὁ κύριός μου
  choice: 我主人
  rationale: 在约瑟的仆役处境中指其主人；保留从属关系，不译作带神学意味的“我的主”。
- source_word: τριημερίζων
  choice: 连续三天
  rationale: 该分词表示持续或实行三日；译文保留时长，但不将具体禁食方式解释得超出原文。
- source_word: ἐλάμβανον μου τὴν τροφήν
  choice: 只取自己的食物
  rationale: 直译核心为“取我的食物”；“只”承接连续三天克制饮食并转赠食物的语境，同时“自己的”对应 μου。
- source_word: πένησιν
  choice: 穷人
  rationale: 指贫困、缺乏生活资源的人，现代汉语表达清楚自然。
- source_word: ἀσθενοῦσιν
  choice: 病人
  rationale: 在与穷人并列且接受食物的语境中，采用“病人”；原词也可泛指软弱者。
theological_decisions:
- issue: “主人”是否应作神圣称谓
  choice: 我主人
  alternative: 我的主
  rationale: 上下文和所有格结构更符合人间主仆关系；避免无根据地赋予神学称谓。
- issue: 三日行为的具体性质
  choice: 连续三天只取自己的食物，把它分给他人
  alternative: 禁食三天／每三天领取一次食物
  rationale: τριημερίζων 的具体操作略有含混；正文表达持续三日和转赠食物，不明确加入“禁食”或领取频率等原文未明说的细节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号对应原句两项克己行为；保留条件句和习惯性动作的语气。
