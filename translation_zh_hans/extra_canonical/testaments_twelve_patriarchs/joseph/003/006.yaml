base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/006.yaml
  text: And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.
translation:
  language: zh_hans
  text: 我常常清早起来，来到主面前，为那埃及女子孟菲斯哭泣，因为她不断地使我十分困扰；甚至在夜里，她也会借口探望来到我这里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὤρθριζον
  choice: 常常清早起来
  rationale: 未完成时表达反复或持续的行动；“清早起来”自然传达该动词早起之义。
- source_word: πρὸς Κύριον
  choice: 向主祷告
  rationale: 字面为“向着主”；在早起、哭泣的敬虔语境中隐含祷告行动，补出“祷告”使现代汉语完整而不改变指向。
- source_word: ἔκλαιον περὶ
  choice: 为……哭泣
  rationale: 保留哭泣及其所关涉对象；不将其限定为代求、哀悼或因受苦而哭，以保存原文张力。
- source_word: Μεμφίας τῆς Αἰγυπτίας
  choice: 那个埃及女人孟斐娅
  rationale: 将 Μεμφίας 按女性专名音译，并保留其埃及人身份；定冠词以“那个”自然体现。
- source_word: σφόδρα ἀδιαλείπτως ἠνόχλει μοι
  choice: 不断地百般搅扰我
  rationale: “不断地”对应 ἀδιαλείπτως；“百般搅扰”以自然汉语承载 σφόδρα 的强度和 ἐνοχλέω 的纠缠、烦扰含义。
- source_word: λόγῳ ἐπισκέψεως
  choice: 借口探望
  rationale: λόγῳ 在此表示以探望为说辞或名目；“借口”准确传达表面理由，并符合上下文中的侵扰性质。
theological_decisions:
- issue: “向主”是否需要明确为祷告
  choice: 译作“向主祷告”
  alternative: “清早起来到主面前”或“清早起来向着主”
  rationale: 原文虽省略明确的“祷告”动词，但“向主”与“哭泣”共同构成祈求语境；补出“祷告”可避免汉语残缺，同时未加入宗派性解释。
- issue: 约瑟为何为该女子哭泣
  choice: 保持“为……哭泣”的开放表达
  alternative: “因她而哭泣”或“为她代求哭泣”
  rationale: περὶ 可指关乎、为了或因着；原文没有明确说明哭泣是出于怜悯、代求还是受搅扰，因此不予定解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“常常”“也会”体现希腊语未完成时的反复性；分号保留后半句对持续搅扰的进一步说明。
