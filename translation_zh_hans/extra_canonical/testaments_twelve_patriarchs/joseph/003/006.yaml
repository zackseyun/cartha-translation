    rationale: πρὸς Κύριον 可带有祈求含义，但译作“来到主面前”较能保留原文简省表达及其开放性。
  - severity: medium
    issue: “百般”增加了原文未表达的多种手段之意。
    rationale: σφόδρα表示程度强烈，ἀδιαλείπτως表示不间断；应译出强度与持续，而不推定烦扰方式多样。
  - severity: low
    issue: 专名“孟斐娅”与英语审计文本 Memphis 的对应不够稳定。
    rationale: 采用“孟菲斯”可与 Memphis 对应，并符合该专名常见中文音译；“埃及女子”保留原文身份说明。
