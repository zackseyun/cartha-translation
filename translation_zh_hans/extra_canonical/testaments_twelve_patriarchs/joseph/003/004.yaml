  text: Καὶ ἐνήστευον ἐν τοῖς ἑπτὰ ἔτεσιν²¹ ἐκείνοις, καὶ ἐφαινόμην *τῷ Αἰγυπτίῳ²² ὡς ἐν τρυφῇ διάγων· ὅτι²³ οἱ νηστεύοντες *διὰ τὸν θεὸν²⁴ τοῦ προσώπου τὴν χάριν²⁵ λαμβάνουσιν²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/004.yaml
  text: And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; because those who fast for God receive favor in their appearance.
translation:
  language: zh_hans
  text: 在那七年间，我禁食；可在那个埃及人看来，我却像是过着优裕的生活，因为那些为上帝而禁食的人，会得到容貌上的恩泽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “容貌上的恩泽”直译近于“领受脸上的恩泽”，也可理解为容貌显得悦人、气色良好。原文的χάρις既可指恩惠，也可指令人悦目的特质。
    reason: 原文τοῦ προσώπου τὴν χάριν语义凝缩；脚注保留其与外在容貌及恩惠、悦人特质相关的表达张力。
lexical_decisions:
- source_word: ἐνήστευον
  choice: 我一直禁食
  rationale: 未完成时表示在所述七年期间持续或反复进行的行动。
- source_word: ἐν τοῖς ἑπτὰ ἔτεσιν ἐκείνοις
  choice: 在那七年间
  rationale: 自然表达时间范围，同时保留原文的指示意味。
- source_word: τῷ Αἰγυπτίῳ
  choice: 那个埃及人
  rationale: 保留定冠词所指的特定人物，不凭上下文补出姓名或身份。
- source_word: ὡς ἐν τρυφῇ διάγων
  choice: 像是过着优裕的生活
  rationale: τρυφή可指奢华、享乐或优裕舒适的生活；此处与禁食形成反差，译作“优裕”较自然，又不过度强化为放纵。
- source_word: διὰ τὸν θεόν
  choice: 为上帝而
  rationale: 保留因上帝而行、以上帝为目的或缘故的基本含义，不进一步解释动机。
- source_word: τοῦ προσώπου τὴν χάριν λαμβάνουσιν
  choice: 容貌会蒙受恩泽
  rationale: 尽量保留“脸面/容貌”与“恩惠、悦人之处”的搭配，表达外貌呈现出蒙恩、悦人的状态，而不将χάρις仅扁平化为美貌。
theological_decisions:
- issue: 禁食与上帝赐恩之间的关系
  choice: 保留“因为……会蒙受恩泽”的直接因果陈述
  alternative: 弱化为“似乎更有精神”或将其解释为一般健康效果
  rationale: 原文明确以ὅτι引出理由，并以διὰ τὸν θεόν和χάρις赋予宗教意义；译文不应把它自然主义化，也不应扩展成普遍的功德教义。
- issue: διὰ τὸν θεόν的目的或缘故含义
  choice: 为上帝而禁食
  alternative: 为了获得上帝的恩宠而禁食
  rationale: 原文没有明说禁食是为了换取恩宠；保留较宽的目的、缘故含义，避免加入功利性动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可……却……”呈现禁食与看似生活优裕之间的反差；避免古奥的“面有恩色”，也避免口语化的“看起来吃得很好”。
