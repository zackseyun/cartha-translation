  text: Ποσάκις ἡ Αἰγυπτία¹ ἠπείλησέ² μοι³ θάνατον; ποσάκις⁴ τιμωρίαις⁵ ⸀με⸀⁶ παραδοῦσα⁷ ἀνεκαλέσατο⁸ [καὶ ἠπείλησέ μοι⁹] *καὶ μὴ θέλοντός μου¹⁰ συνελθεῖν αὐτῇ ἔλεγέ¹¹ μοι· Κυριεύσεις¹² *κἀμοὶ καὶ πάντων τῶν ἐν τῷ οἴκῳ μου¹³, *ἐὰν ἐπιδῷς ἑαυτὸν¹⁴ εἰς ἐμέ, καὶ ἔσῃ ὡς δεσπότης ἡμῶν¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/002.yaml
  text: How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments, she called me back, and threatened me; and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”
translation:
  language: zh_hans
  text: 那埃及妇人多少次以死威胁我！多少次把我交去受刑后，又召回我，又威胁我[a]！我不肯与她同寝时，她对我说：“只要你把自己交给我，你就必掌管我和我家里所有的人，作我们的主人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “又威胁我”一语在部分希腊文本中缺失。
    reason: 原文以方括号标出 καὶ ἠπείλησέ μοι，属于需要向读者披露的文本异文。
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: 那埃及女人
  rationale: 保留原文以族属指称该女子的表达，并用“女人”呈现阴性名词的自然汉语含义。
- source_word: τιμωρίαις με παραδοῦσα
  choice: 把我交出去受刑
  rationale: τιμωρίαις 可指惩罚或刑罚；上下文涉及死亡威胁，故译“受刑”，同时保留“交出去”的被交付意味。
- source_word: ἀνεκαλέσατο
  choice: 又把我召回来
  rationale: 表达先交付受刑、随后召回的动作转折。
- source_word: συνελθεῖν αὐτῇ
  choice: 与她同寝
  rationale: 该短语字面可指“与她一同来往/结合”，此处显然带性意味；“同寝”自然、庄重且不粗俗。
- source_word: ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: 把自己交给我
  rationale: 贴近“将自己给向我”的结构，保留委身于她的性与权力双重意味。
- source_word: Κυριεύσεις
  choice: 掌管
  rationale: 准确表达取得权柄、统辖之意，并与后文“主人”相呼应。
- source_word: δεσπότης
  choice: 主人
  rationale: 此处指家中的主宰或家主；“主人”是现代汉语中自然且符合语境的对应。
theological_decisions:
- issue: 拒绝与埃及女人“同来”的具体含义
  choice: 译作“与她同寝”
  alternative: “与她结合”或“与她同在”
  rationale: 叙事语境明确涉及性诱惑；译文予以明示，但不扩展为婚姻、奸淫等原文未直接使用的神学或法律术语。
- issue: 括号内异文 καὶ ἠπείλησέ μοι 的处理
  choice: 在正文保留“威胁我”，并加脚注说明异文
  alternative: 从正文省略
  rationale: 所给校勘文本以方括号标示该短语，说明其文本见证不稳；正文依咨询层及所列文本保留，同时透明标注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“多少次……多少次……”保留原文反复诘问的强烈语气；引语简洁有力。正文中的脚注标记与脚注相对应。
