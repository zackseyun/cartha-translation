  text: Ἐγὼ δὲ¹⁶ ἐμνημόνευον¹⁷ *λόγους πατρός μου¹⁸, καὶ εἰσερχόμενος εἰς τὸ ταμεῖον *⸀κλαίων⸀ προσηυχόμην¹⁹ Κυρίῳ²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/003.yaml
  text: But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.
translation:
  language: zh_hans
  text: 但我想起父亲的话，就走进内室，流着泪向主祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνημόνευον
  choice: 想起
  rationale: 在此语境中表示把父亲的话记在心上、回想起来；“想起”自然简洁，又不额外强化为持续默想。
- source_word: λόγους πατρός μου
  choice: 父亲的话
  rationale: 忠实保留 λόγους 的复数集合意义，并以现代汉语自然表达亲属关系。
- source_word: ταμεῖον
  choice: 内室
  rationale: 指屋内较隐蔽、私密的房间；“内室”兼顾古代空间含义和祷告场景，不具体限定为卧室或储藏室。
- source_word: κλαίων
  choice: 流着泪
  rationale: 表达伴随进入与祷告的哭泣状态，较“哭着”更符合庄重叙事语体。
- source_word: προσηυχόμην Κυρίῳ
  choice: 向主祷告
  rationale: 保留祷告的对象与方向，符合现代标准汉语的自然搭配。
theological_decisions:
- issue: Κυρίῳ 是否加定冠或明确神名
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文仅作 Κυρίῳ；译为“主”最直接，也避免在缺乏更明确文本依据时把所指具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；用“就”顺畅连接回想、进入内室和祷告的连续动作，不添加原文没有的解释。
