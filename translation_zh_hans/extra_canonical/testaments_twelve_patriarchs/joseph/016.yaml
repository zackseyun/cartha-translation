  text: 'But Memphis said to her husband[a], “I hear that they are selling the young man.”


    2 So she immediately sent a eunuch to the Ishmaelites, asking that I be sold to her.

    3 But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.

    4 Then she sent another eunuch, saying, “Even if they ask two minas, pay it. Do not spare the gold. Only buy the boy and bring him to me.”

    5 So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”

    6 But I, knowing it, kept silent[b][c], so that'
translation:
  language: zh_hans
  text: '**《约瑟遗训》第16章**


    1 孟斐斯[a]对丈夫说：“把那个年轻人买下来；我听说他们正在卖他。”


    2 她立刻派一个太监到以实玛利人那里，要求他们把我卖给她。


    3 那太监不愿买我，探过他们的口风后便离开了。他回报女主人说，他们为这孩子索要很高的价钱。


    4 她又派了另一个太监，说：“即使他们索要两弥那[b]，也付给他们。不要吝惜金子；只管把这孩子买下来，带到我这里。”


    5 于是，那太监前去，给了他们八十金[c]，便把我带走；他却对那埃及妇人说：“我付了一百金。”


    6 我虽然知道这事，却默不作声，免得那太监蒙羞。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孟斐斯”在这里是妇人的名字，不是指同名的埃及城市。
    reason: 消除专名可能造成的地名误解，同时保留希腊文音译。
  - marker: b
    text: “弥那”是古代的重量和货币单位；原文保留这一特定名称，无法精确换算为现代金额。
    reason: 说明古代货币文化背景，避免不可靠的现代换算。
  - marker: c
    text: 希腊文直称“八十金”，随后称“一百金”，没有注明具体币种，因此译文也采用概括说法。
    reason: 保留原文在币制名称上的不确定性，避免误译成特定金币。
lexical_decisions:
- source_word: Μεμφὶς
  choice: 孟斐斯
  rationale: 按人名音译；本段语法把它作为该妇人的名字，而不是埃及城市名。
- source_word: νεανίαν / παιδός / παῖδα
  choice: 年轻人／孩子
  rationale: 随希腊文在各节中的词语变化分别译出：νεανίας指年轻男子，παῖς在买卖语境中仍可称年轻人为“孩子”。
- source_word: εὐνοῦχος
  choice: 太监
  rationale: 保留该词通常所指的阉人身份，不笼统弱化为“官员”或“仆役”。
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: 要求他们把我卖给她
  rationale: 以自然汉语表达安排交易、将约瑟卖给她的商业含义。
- source_word: πειράσας αὐτούς
  choice: 探过他们的口风
  rationale: 这里指试探卖方的条件或态度，并非道德意义上的诱惑；此译法避免“试探”在宗教语境中的歧义。
- source_word: δεσποίνῃ
  choice: 女主人
  rationale: 体现家内权威及差遣关系，又符合现代汉语叙事表达。
- source_word: πολλὴν τιμὴν
  choice: 很高的价钱
  rationale: τιμή在买卖语境中指价格，此处作商业意义的惯用翻译。
- source_word: μνᾶς
  choice: 弥那
  rationale: 保留古代重量和货币单位，不换算成可能造成虚假精确感的现代金额。
- source_word: μὴ φείσασθε χρυσίου
  choice: 不要吝惜金子
  rationale: 保留否定命令的力度和具体的金子意象；汉语不标单复数，避免强行处理希腊文复数命令式与单一受命者之间的张力。
- source_word: χρυσοῦς
  choice: 金
  rationale: 原文实为“八十个金的”，没有明确指出币种；用“八十金”保留计数和货币意义，避免擅自指定为某种金币。
- source_word: ἀνελάβετό με
  choice: 把我带走
  rationale: 在奴隶买卖的上下文中，既表达成交后的接收，也自然承接后续行动。
- source_word: ἐσιώπησα
  choice: 默不作声
  rationale: 表达约瑟明知内情却有意保持沉默的行动。
- source_word: ἵνα μὴ αἰσχυνθῇ ὁ εὐνοῦχος
  choice: 免得那太监蒙羞
  rationale: 完整译出所给希腊文的目的从句；αἰσχύνω在此为被动意义，指遭到羞辱或难堪。
theological_decisions:
- issue: 约瑟被交易的身份用语
  choice: 直接保留买、卖、价钱及带走等奴隶交易语言
  alternative: 淡化为雇用、服侍或进入家中
  rationale: 希腊文明白使用商业买卖措辞。直译这种身份现实，不以较温和的家内服务语言掩盖文本张力。
- issue: 约瑟对太监虚报价格的反应
  choice: 译明约瑟知情而沉默，目的是不让太监蒙羞
  alternative: 把沉默解释为赞同、宽恕或协助欺骗
  rationale: 原文只陈述知情、沉默及避免其蒙羞的目的，没有明说约瑟对该行为的道德判断，因此不补入神学或伦理解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。交易过程用直接清楚的动词呈现，不淡化约瑟被买卖的处境；对古代币制采用音译或概括表达，并以脚注说明。第6节按所给希腊文完整收束，不沿用英语咨询层中意外截断的句子。
