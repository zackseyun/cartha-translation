  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/001.yaml
  text: And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as a husband.”
translation:
  language: zh_hans
  text: 又有一次，她对我说：“如果你不肯通奸，我就用毒药杀死我丈夫，娶你为夫。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  choice: 通奸
  rationale: 该不定式指与有配偶者发生不正当性关系；“通奸”准确、简洁，并保留原文的道德与法律意味。
- source_word: ἀνελῶ
  choice: 杀死
  rationale: 直译其主动、明确的杀害意图，不弱化为“除掉”。
- source_word: φαρμάκῳ
  choice: 用毒药
  rationale: 工具与格在此表示以毒药为手段；结合杀害语境，译作“用毒药”自然明确。
- source_word: λήψομαί σε εἰς ἄνδρα
  choice: 娶你作丈夫
  rationale: 保留“把你取作丈夫”的婚配含义，同时不擅自加入原文没有的“我的”；汉语中由“娶你”已自然体现说话者要与对方结为夫妻。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又有一次”自然涵盖 καὶ πάλιν ἐν ἑτέρῳ χρόνῳ 的重复与另一次时机；直接引语保留威胁的强烈语气。
