lexical_decisions:
- source_word: Φοβηθεῖσα
  choice: 她害怕了
  rationale: 准确表达不定过去时被动形态在此所具有的状态或起始含义，现代汉语自然。
- source_word: ἠξίου με
  choice: 便求我
  rationale: ἠξίου 在此表示恳求、请求；“求我”保留其迫切语气，同时简洁自然。
- source_word: ἐξαγγελῶ
  choice: 说出去
  rationale: 该词含宣告、泄露或报告之意；在此语境中指把她的意图告诉别人，“说出去”最符合现代汉语叙事表达。
- source_word: ἐπίνοιαν ταύτην
  choice: 这个意图
  rationale: ἐπίνοια 可指想法、意图或谋划。原文未必明确带有贬义，因此不用较强的“阴谋”，以保留语义余地。
