  text: And she went away, enticing me with gifts and every kind of pleasure.
translation:
  language: zh_hans
  text: 她便离开了，一面用礼物和各样享乐来引诱我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: 离开了
  rationale: 按其常见叙事义译出退去、离开的动作，行文自然简洁。
- source_word: ἐπιθάλπουσά με
  choice: 一面……来引诱我
  rationale: 该分词在此描述她离开时仍以利诱手段笼络约瑟；结合礼物与享乐的语境，用“引诱”保留其诱惑意味，同时“一面”体现与主句动作伴随。
- source_word: δώροις
  choice: 礼物
  rationale: 直接对应赠礼之物，符合现代汉语。
- source_word: ἀπολαύσεσι πάσαις
  choice: 各样享乐
  rationale: 保留 πάσαις 的周全范围及 ἀπολαύσεσι 所指的愉悦、享受，不擅自限定为某一种 pleasure。
