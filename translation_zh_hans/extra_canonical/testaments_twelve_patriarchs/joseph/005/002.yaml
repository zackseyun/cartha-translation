base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/002.yaml
  text: 'So when I heard this, I tore my garments and said to her, “Woman, have reverence for God, and do not do this evil deed, lest you be destroyed. For know this also: I will tell everyone of this scheme of yours.”'
translation:
  language: zh_hans
  text: 所以，我一听见这话，就撕裂衣服，对她说：“妇人，要敬畏上帝，不可做这件恶事，免得你被除灭。你也要知道，我必把你的这个图谋告诉众人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξα τὰ ἱμάτιά μου
  choice: 我就撕裂衣服
  rationale: 保留古代表示震惊、悲痛或强烈抗拒的身体动作；中文圣经语体中“撕裂衣服”自然且准确，“我的”可由主语和语境明确。
- source_word: αἰδέσθητι τὸν Θεόν
  choice: 要敬畏上帝
  rationale: αἰδέομαι在此指因对上帝的敬重、畏惧而有所顾忌；“敬畏”兼顾尊崇与道德约束，比单纯“害怕”或“羞愧”更贴合语境。
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: 这件恶事
  rationale: πρᾶξις是行为、事情，πονηράν明确评价其邪恶；原文没有“违法”一词，因此不增译“违法的”。
- source_word: ἐξολοθρευθῇς
  choice: 你被除灭
  rationale: 该被动形式表达彻底毁灭或剪除；“被除灭”保留强烈程度及被动语态，也符合庄重叙事语域。
- source_word: ἐξαγγελῶ πᾶσιν
  choice: 我必……告诉众人
  rationale: ἐξαγγέλλω意为宣告、传报；此处是威慑性的公开揭露，“告诉众人”清楚自然，并保留πᾶσιν的普遍范围。
- source_word: τὴν ἐπίνοιάν σου ταύτην
  choice: 你的这个图谋
  rationale: ἐπίνοια可指心中筹划、计谋；“图谋”表达其尚在筹划而且带有恶意，同时明确呈现σου和ταύτην。
theological_decisions:
- issue: αἰδέσθητι τὸν Θεόν所表达的对上帝态度
  choice: 要敬畏上帝
  alternative: 要在上帝面前感到羞耻
  rationale: 该动词可涉及羞耻、尊敬或畏惧。宾语直接为“上帝”，且命令旨在制止恶行，译作“敬畏上帝”最自然；但不把它扩展为任何特定的系统神学含义。
- issue: 毁灭警告的施事者
  choice: 免得你被除灭
  alternative: 免得上帝除灭你
  rationale: 原文使用神学被动，没有明说施事者。保留被动可维持其开放性，避免擅自补出“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“撕裂衣服”“敬畏上帝”“除灭”等具有经卷语感但仍为普通读者熟悉的表达；不添加原文没有的“违法”等限定。
