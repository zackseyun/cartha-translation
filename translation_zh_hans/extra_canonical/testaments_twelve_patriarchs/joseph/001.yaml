  terminology: “主”“上帝”“至高者”“万有的主宰”“救主”等称谓均能对应原文的称谓变化；“遗训”“保全”“眷顾”“施恩”“申辩”等选择适切。“救主”应保持为称号而不作特定教义身份的解释。
