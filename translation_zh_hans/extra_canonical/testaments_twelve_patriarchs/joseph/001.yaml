base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001.yaml
  text: '3. In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.

    4. My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers kept me safe. They lowered me into a pit, and the Most High brought me up.

    5. I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was gripped by famine, and the Lord himself nourished me.

    6. I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]

    7. Amid slanders he spoke in my defense. In the bitter talk of dreams he rescued me.'
translation:
  language: zh_hans
  text: '《雅各与拉结所生的第十一个儿子约瑟的遗训》


    1. 约瑟遗训抄本。约瑟将要离世时，召来他的儿子们和弟兄们，对他们说：


    2. “我的弟兄和儿女们，请听以色列所爱的约瑟说话，侧耳听我口中的言语。


    3. 我一生经历了嫉妒与死亡，却没有迷失，反而持守在主的真理中。


    4. 我的弟兄们恨我，主却爱我；他们想要杀我，我列祖的上帝却保全了我。他们把我放进坑里，至高者却把我拉上来。


    5. 我被卖为奴，万有的主宰却释放了我；我被掳去，他大能的手却帮助了我；我被饥荒困住，主亲自养活了我。


    6. 我孤身一人，上帝却安慰我；我软弱时，主眷顾我；我在监牢里，救主却施恩给我。[a]


    7. 我遭受诬告，他便为我申辩；在关于梦的苦涩言语中，他救了我。我本是奴仆，他却高举了我。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本在此另有一句：“我在锁链中，他便解开了我。”
    reason: 该句在底本中以方括号标出，文本归属存疑；移入脚注可保留证据而不把它无条件纳入正文。
lexical_decisions:
- source_word: ἐν τῇ ἀληθείᾳ Κυρίου
  choice: 持守在主的真理中
  rationale: 保留“主的真理”这一属格结构，并以“持守”自然表达ἔμενα的持续、坚定含义。
- source_word: ἐφύλαξέν με
  choice: 保全了我
  rationale: 既表达保护免遭杀害，也避免加入原文没有明说的方式。
- source_word: ὁ πάντων δεσπότης
  choice: 万有的主宰
  rationale: 保留δεσπότης的统治与权柄色彩，并与一般的“主”有所区别。
- source_word: ἐν λιμῷ συνεσχέθην
  choice: 我被饥荒困住
  rationale: συνέχω可表示受压迫、拘束或困住；此译保留其强烈被动感，不把它弱化为单纯“饥饿”。
- source_word: ἐπεσκέψατό με
  choice: 眷顾我
  rationale: ἐπισκέπτομαι在此指带着关怀临到、照看；“眷顾”庄重而自然。
- source_word: ἐχαρίτωσέ με
  choice: 施恩给我
  rationale: 表达动词所含的赐恩、厚待之意，不具体化为未经原文说明的释放行动。
- source_word: ἐν διαβολαῖς καὶ συνηγόρησέ μοι
  choice: 我遭受诬告，他便为我申辩
  rationale: διαβολαί指诽谤或控告，συνηγορέω具有为某人辩护的司法色彩。
- source_word: ἐν λόγοις ἐνυπνίων πικροῖς
  choice: 在梦境苦涩的言语中
  rationale: 原文句法和意象不够明确；此译保留“言语—梦—苦涩”三项关系，而不擅自判定是梦的讲述、解释还是梦中之言。
- source_word: Δοῦλος καὶ ὕψωσέ με
  choice: 我本是奴仆，他却高举了我
  rationale: 补足汉语所需的系词与主语，同时保留从奴仆身份到被高举的对比。
theological_decisions:
- issue: “救主”（σωτήρ）是否专指某一后期基督论称号
  choice: 按文本直译为“救主”
  alternative: 译为“拯救者”或直接以“上帝”代称
  rationale: σωτήρ本身就是“救主/拯救者”；保留称号，但不在正文中把它进一步认定为某一特定位格。
- issue: “主的真理”中属格的含义
  choice: 保留“主的真理”
  alternative: 解释为“对主忠诚”或“主所启示的真道”
  rationale: 原文可涉及属于主、源自主或关于主的真理；直译可保存这种神学张力。
- issue: 段落中的不同神称
  choice: 分别保留“主”“我列祖的上帝”“至高者”“万有的主宰”“救主”
  alternative: 统一译为“上帝”
  rationale: 这些称谓的变化是原文修辞和神学表达的一部分，不宜抹平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留第1—2节，因为所给希腊原文包含标题、临终场景和劝听语；主要平行句使用“却”体现逆转结构。神名按原文分别处理，不作宗派化统一。
