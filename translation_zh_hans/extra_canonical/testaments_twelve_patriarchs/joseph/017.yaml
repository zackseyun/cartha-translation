base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017.yaml
  text: 1[a]. See then, my children, how much I endured so that I might not put my brothers to shame. 2. You also, therefore, love one another, and with patience conceal one another’s shortcomings. 3. For God delights in the harmony of brothers and in the purpose of a good heart that intends what is good. 4[b]. And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them. 5. And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure. 6. And I did not allow them to be distressed even in the smallest matter; rather, everything that was in my hand I gave to them. 7. And their sons were my sons, and my sons were as servants to them, and their soul was my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose. 8. And I did not exalt myself among them in arrogance because of my worldly glory[c],
    but I was among them as one of the least.
translation:
  language: zh_hans
  text: '**《约瑟遗训》第17章**


    1 所以，我的孩子们，你们要看，我忍受了多少，为的是不使我的弟兄们蒙羞。 2 你们也要彼此相爱，以忍耐遮掩彼此的过失[a]。 3 因为，神喜悦弟兄和睦，也喜悦善心所定的向善心志[b]。 4 我的弟兄们来到埃及时，他们自己知道，我把银钱退还给了他们；我没有责备他们，反而劝慰他们。 5 我父亲雅各死后，我越发爱他们；凡他们所要的，我都格外丰厚地满足他们。 6 我不容他们因哪怕最小的事受苦；我手里所有的一切，实在都给了他们。 7 他们的儿子就是我的儿子，我的儿子则如同他们的奴隶[c]；他们的生命就是我的生命，他们每一分痛苦都是我的痛苦，他们一切的软弱都是我的软弱，他们的心愿就是我的心愿。 8 我没有因为自己在世上的荣耀而在他们中间骄傲自高；相反，我在他们中间如同最微小的一个。


    [a] 或译“包容彼此的过失”。希腊语动词有共同遮盖之意；这里强调以忍耐相待，不苛刻地揭露弟兄的过失，并非否认过失本身。


    [b] 本节后半句在现存希腊文本中语法艰涩，抄本文字可能不稳定。这里按其显然的伦理含义译出：神喜悦弟兄和睦，也喜悦内心定意向善。


    [c] “奴隶”译自希腊语 *douloi*。这里措辞很强，表明约瑟谦卑自处，甚至让自己的儿子服在弟兄们之下。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“包容彼此的过失”。希腊语动词有共同遮盖之意；这里强调以忍耐相待，不苛刻地揭露弟兄的过失，并非否认过失本身。
    reason: lexical_alternative
  - marker: b
    text: 本节后半句在现存希腊文本中语法艰涩，抄本文字可能不稳定。这里按其显然的伦理含义译出：神喜悦弟兄和睦，也喜悦内心定意向善。
    reason: textual_variant
  - marker: c
    text: “奴隶”译自希腊语 *douloi*。这里措辞很强，表明约瑟谦卑自处，甚至让自己的儿子服在弟兄们之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχύνω
  choice: 使……蒙羞
  rationale: 保留使人受羞辱、丢脸的关系性含义，符合约瑟不揭露弟兄之恶的语境。
- source_word: μακροθυμίᾳ
  choice: 以恒久的忍耐
  rationale: 此词强调面对他人过失时长久克制、宽容忍耐；加“恒久”体现词义强度。
- source_word: συγκρύπτετε
  choice: 遮掩
  rationale: 该复合动词含彼此遮盖、不加暴露之意；“遮掩”保留原文形象，同时由脚注说明这并非否认过失。
- source_word: ἐλαττώματα
  choice: 过失
  rationale: 在伦理劝勉中指人的缺失或过错；“过失”自然庄重，又不显得过分严厉或医学化。
- source_word: ὁμονοίᾳ ἀδελφῶν
  choice: 弟兄和睦
  rationale: ὁμονοία 指同心一致、和谐相处；“弟兄和睦”保留家庭关系与伦理重点。
- source_word: προαιρέσει καρδίας ἀγαθῆς
  choice: 善心立意
  rationale: προαίρεσις 强调有意识的选择、意愿或定意；此译保留内在道德取向，且不把艰涩句式过度具体化。
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  choice: 向善
  rationale: 传世文字语法不稳，但整体指向对善的倾向或喜悦；简译为“向善”保留伦理方向而不武断重构原文。
- source_word: ὠνείδισα
  choice: 责备
  rationale: 此处指以话语责难、羞辱弟兄；“责备”适合现代汉语，也与前文“不使……蒙羞”相呼应。
- source_word: παρεκάλεσα
  choice: 劝慰
  rationale: 该词可指劝勉、鼓励或安慰；在兄弟和解的场景中，“劝慰”兼有安抚与鼓励之意。
- source_word: ὑπερεκπερισσοῦ
  choice: 格外丰丰富富地
  rationale: 原词为强烈的叠加强调，表示远超通常程度；此译以自然汉语叠词表达异常丰厚的慷慨。
- source_word: θλιβῆναι
  choice: 受苦
  rationale: 该被动式可指受压、困苦或烦扰；“受苦”涵盖约瑟不让弟兄遭遇任何困顿的广义语境。
- source_word: ἕως μικροῦ πράγματος
  choice: 因哪怕最小的事
  rationale: 以自然汉语表达原短语“直到小事”的全面性，即连最细微的事情也不让他们受困。
- source_word: δοῦλοι
  choice: 奴仆
  rationale: 原词表示受支配、服役的身份。正文用庄重而可读的“奴仆”，脚注注明也可直译“奴隶”，并保留其强烈的从属意味。
- source_word: ψυχή
  choice: 性命
  rationale: 在“他们的……就是我的……”的认同表达中，“性命”比抽象的“灵魂”更自然，也可涵盖人的生命与整全自我。
- source_word: κοσμικήν μου δόξαν
  choice: 自己在世上的荣耀
  rationale: κοσμικός 在此指世间地位与荣华；此译避免现代“世界性”的歧义，并保留与谦卑相对的荣耀。
theological_decisions:
- issue: 劝人“遮掩”弟兄的过失
  choice: 译为“以恒久的忍耐遮掩彼此的过失”
  alternative: “包容彼此的过失”或“隐藏彼此的缺点”
  rationale: 原文教导的是出于忍耐，不苛刻揭露弟兄的过失。正文保留“遮掩”的形象，脚注明确这不是否认罪错，以免引入纵容恶行的理解。
- issue: 第3节善心意愿的艰涩文本
  choice: 译为“神喜悦弟兄和睦，也喜悦善心立意向善”
  alternative: “神喜悦弟兄同心，也喜悦善心所作的选择，因它以善为乐”
  rationale: 希腊语见证在此语法艰涩，数与句法未能顺畅对应。译文保留“神喜悦”“善心”“意愿”和“向善”等可辨认要素，不武断补出确定主语或重构。
- issue: 第7节 δοῦλοι 的身份强度
  choice: 正文用“奴仆”，脚注说明也可译“奴隶”
  alternative: 直接译“奴隶”或弱化为“仆人”
  rationale: 该词有真实的从属和服役意味，不能弱化为普通帮佣；“奴仆”在中文遗训体裁中庄重可读，脚注则保留原词的强度。
- issue: 第7节 ψυχή 的理解
  choice: 译为“性命”
  alternative: “灵魂”或“心”
  rationale: 这里是一连串同苦同心的修辞认同，并非在界定灵魂论。“性命”保留生命整体的意味，不导入后来的二分式人论。
translation_notes:
  register: 采用现代标准普通话的庄重遗训体，句式清楚而保留原文排比。称呼用“我的孩子们”，亲属用“弟兄”，神名用“神”。第7节尽量保存连续的“就是我的”结构，以呈现约瑟与弟兄认同、同苦和谦卑自处的修辞力度。脚注标记均置于所解释的正文词句之后，并纠正咨询层中标记位置与注释内容不相符的问题。
