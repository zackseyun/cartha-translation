base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002.yaml
  text: And this man[a], Pharaoh’s chief cook, entrusted his house to me. And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame. I was imprisoned, I was beaten, I was mocked; and the Lord gave me compassion in the sight of the jailer. For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress[b]. For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, does he become weak or terrified. But in all these things he takes the lead[c], and in various ways he gives comfort.
translation:
  language: zh_hans
  text: '第二章


    1 法老的御厨总管[a]把他的家交托给我。2 我与一个无耻的女人抗争；她一再逼我与她一同违法，但我父亲的上帝把我从燃烧的火焰中救了出来[b]。3 我被囚禁，被殴打，被嘲弄；主使我在狱卒面前蒙受怜悯。4 因为主不撇弃敬畏他的人，无论他们身处黑暗、锁链、患难或困境之中。5 上帝不像人那样感到羞愧，也不像世人之子那样胆怯，更不像出于尘土的人那样软弱或惊慌。6 然而，在这一切境遇中，他都居前引领，并以各种方式安慰人。他只是短暂离开，为要试验人的心志。7 他在十次试炼中显明我是经得起考验的；在这一切试炼中，我都恒久忍耐。因为忍耐是一剂良药，坚忍带来许多益处。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “御厨总管”所译的希腊词也可能是宫廷官衔，不一定只指管理膳食的人；有人结合约瑟在埃及的叙事，理解为“侍卫长”等官职。
    reason: lexical_alternative
  - marker: b
    text: “燃烧的火焰”在这里很可能比喻性诱惑所带来的吞噬性危险；希腊文没有进一步解释这一意象。
    reason: metaphorical_ambiguity
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: 御厨总管
  rationale: 该复合词字面与烹饪、厨务有关；“御厨总管”既保留宫廷职分和主管身份，也不按《创世记》的平行叙事擅自改成军事官衔。
- source_word: ἠγωνισάμην
  choice: 抗争
  rationale: 表达积极而持续的道德争战，既有力度，又不把场景过度军事化。
- source_word: γυναῖκα ἀναιδῆ
  choice: 一个无耻的女人
  rationale: ἀναιδής指缺乏羞耻和节制；此译保留叙述者明确的道德评价。
- source_word: ἐπείγουσάν με παρανομεῖν μετʼ αὐτῆς
  choice: 她一再逼我与她一同违法
  rationale: 现在分词体现持续施压；παρανομεῖν本义为违法、越轨，不将其窄化为某一具体罪名。
- source_word: ἐρρύσατό με ἐκ φλογὸς καιομένης
  choice: 把我从燃烧的火焰中救了出来
  rationale: 保留原文鲜明而未明说所指的火焰意象，不直接释为情欲。
- source_word: ἔδωκέ με εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος
  choice: 使我在狱卒面前蒙受怜悯
  rationale: 用自然汉语表达原文“使我进入怜悯”的结果性习语，同时保留οἰκτιρμοί的怜悯语义，而非仅译作一般性的恩宠。
- source_word: τοὺς φοβουμένους αὐτόν
  choice: 敬畏他的人
  rationale: “敬畏”兼顾畏惧、尊崇及宗教伦理内涵，是现代汉语中自然且有尊严的对应语。
- source_word: προΐσταται
  choice: 在前面扶持
  rationale: 该动词可含站在前面、带领、照管或支持等相关意义；此译尽量兼顾引领与护佑，不将语义单一化。
- source_word: Ἐν βραχεῖ ἀφίσταται
  choice: 只短暂离开
  rationale: 直接保留神短时退离的张力，不将其弱化为似乎离开或隐藏。
- source_word: δοκιμάσαι τῆς ψυχῆς τὸ διαβούλιον
  choice: 试验人的心志
  rationale: διαβούλιον指内在的谋虑、决意或意向；“心志”在此概括灵魂内部受检验的意向和定志。
- source_word: δόκιμον ἀπέδειξέ με
  choice: 显明我是经得起考验的
  rationale: δόκιμος表示经过检验而获认可；此译保留试验与验证之间的词义关联。
- source_word: μακροθυμία / ὑπομονή
  choice: 恒忍 / 坚忍
  rationale: 分别呈现长期忍受、克制不躁与在压力下坚持承受的相近而有别的含义，避免把两个希腊词完全合并。
- source_word: μέγα φάρμακον
  choice: 大有功效的良药
  rationale: 保留“药”的比喻，并以“大有功效”自然传达μέγα在此处强调的重要和强大效用。
theological_decisions:
- issue: “我父亲的上帝”的单复数
  choice: 保留单数“我父亲”
  alternative: 我祖先的上帝／我列祖的上帝
  rationale: 希腊文τοῦ πατρός μου为单数，在约瑟的自述中自然指向他的父亲雅各；不按熟悉的圣经套语改为复数。
- issue: “燃烧的火焰”所指
  choice: 保留未经解释的火焰比喻
  alternative: 情欲之火／淫欲的烈焰
  rationale: 上下文暗示性诱惑的危险，但原文只给出火焰意象；正文不把暗示扩写成明确解释。
- issue: 主在患难中的行动（προΐσταται）
  choice: 译作“在前面扶持”
  alternative: 带领／站在身旁／治理／居高看顾
  rationale: 原动词兼有居前、领导、照管和支持的可能；所选表达保留领导与眷顾的张力，脚注提示其他理解。
- issue: 上帝“短暂离开”以试验人
  choice: 按原文直译为“只短暂离开”
  alternative: 暂时隐藏他的同在／似乎离开
  rationale: 不以系统神学解释消解原文关于神退离与试验的张力，也不增添“似乎”。
- issue: “十次试炼”的陈述
  choice: 保留确数“十次”
  alternative: 许多次试炼
  rationale: 原文明确使用δέκα；即使上下文没有逐项列举，也不将确数泛化。
translation_notes:
  register: 采用现代标准普通话的庄重叙事体，保留见证式第一人称和格言式结尾。句法适度顺应现代汉语，但不消除“火焰”“短暂离开”“十次试炼”等原文意象或神学张力。将近义的μακροθυμία与ὑπομονή分别译为“恒忍”和“坚忍”，使普通读者可读，同时维持词义区别。所有脚注标记均已置于正文相应位置。
