  source_fidelity: 译文保留了宾格短语“所有人”作为受事，并以“它”承接原文未明示而须由上下文补足的主语；“行为、言语、心思”准确对应ἔργῳ、λόγῳ、διανοίᾳ。对συνέρχεται的处理没有假装其字面“会合”在此处无争议，而以脚注说明传本及句法困难，符合保留不确定性的原则。
  naturalness: “因为它临到所有人，或在行为上，或在言语上，或在心思中”是可理解、庄重且平行的现代汉语。虽然“它”必须依赖上文，正与原文的篇章依赖相符；脚注足以避免脱离上下文阅读时的误解。
  terminology: “行为／言语／心思”的三项搭配自然，且避免将διανοίᾳ过度解释为“想象”或“意图”。“临到”在中文中适合表达一个未具名的事临及人的句法关系。
