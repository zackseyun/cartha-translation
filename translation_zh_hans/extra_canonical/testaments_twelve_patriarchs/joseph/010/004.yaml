  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/004.yaml
  text: For it comes upon all people either in deed or in word or in mind.
translation:
  language: zh_hans
  text: 因为它临到所有人，或在行为上，或在言语上，或在心思中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临到”所对应的希腊词在传本中语义较难确定；本句的主语承接上文，原文在此没有明说。
    reason: 提示文本与句法上的真实不确定性，并说明中文代词“它”的来源。
lexical_decisions:
- source_word: Πάντας … ἀνθρώπους
  choice: 所有人
  rationale: 保留宾格所表示的受作用对象，并自然表达全称范围。
- source_word: ἐν ἔργῳ
  choice: 在行为上
  rationale: ἔργον在此与“言语、心思”并列，指实际行为。
- source_word: ἐν λόγῳ
  choice: 在言语上
  rationale: λόγος在此并列结构中最自然地指所说的话。
- source_word: ἐν διανοίᾳ
  choice: 在心思中
  rationale: διανοία可指思想、意念或心智；“心思”既自然，也不额外加入“想象”等原文未明示的含义。
- source_word: συνέρχεται
  choice: 临到
  rationale: 该词形与上下文传抄情况存在困难；按此句所隐含的主语及经校订的语义关系，译为某事“临到”所有人，避免误把“所有人”当作主语。
theological_decisions:
- issue: 隐含主语的指代
  choice: 以“它”保留隐含主语
  alternative: 明确补出前文所指之事物的名称
  rationale: 本节片段本身没有明说主语；使用“它”承接上文，可保留原文的篇章依赖，避免擅自作神学判定。
- issue: 行为、言语、心思三者之间的关系
  choice: 保留“或……或……或……”的并列结构
  alternative: 译成“无论在行为、言语还是思想上”
  rationale: 原文以ἢ反复列举可能的领域；直保并列能呈现其分项强调，而不把关系过度概括。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在行为上／在言语上／在心思中”保持原文三项平行，同时避免生硬的逐词对应。
