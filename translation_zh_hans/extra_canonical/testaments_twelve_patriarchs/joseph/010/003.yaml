source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅπου δὲ κατοικεῖ ὁ ὕψιστος¹⁰, κἂν *φθόνος τις περιπέσῃ, κἂν δουλία, κἂν συκοφαντία¹¹, *ὁ Κύριος κατοικῶν ἐπ᾽ αὐτὸν¹² διὰ τὴν σωφροσύνην οὐ μόνον⁷ ἐκ τῶν κακῶν ῥύεται¹³ αὐτόν¹⁴, ⸀ἀλλὰ καὶ ὑψοῖ¹⁵ καὶ δοξάζει αὐτὸν ὡς κἀμέ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/003.yaml
  text: But where the Most High dwells, even if envy should fall upon someone, or slavery, or slander, the Lord who dwells with him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.
translation:
  language: zh_hans
  text: 但凡至高者所居住之处，即使有人遭人嫉妒，或沦为奴隶，或受人诬陷，那因他的节制而临在他身上的主[a]，不但救他脱离各种祸患，还高举他，使他得荣耀，正如他待我一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临在他身上”直译可作“住在他身上”。希腊文 κατοικῶν ἐπ᾽ αὐτόν 的搭配不寻常；也可理解为“与他同住”或“在他之上居住／覆庇他”。“因他的节制”在句法上紧邻“临在”，但也可能兼及随后主所施行的拯救与高举。
    reason: 保留 ἐπί 加宾格所形成的非寻常空间意象，以及 διὰ τὴν σωφροσύνην 的可能修饰范围，而不将其解释固定为单一神学关系。
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: 至高者
  rationale: 保留这一对上帝的称号，并符合现代汉语宗教文体的通行表达。
- source_word: φθόνος
  choice: 遭人嫉妒
  rationale: 原文把“嫉妒”描写为临到某人的患难；汉语补出“遭人”，表明是别人的嫉妒，而非当事人心生嫉妒。
- source_word: δουλία
  choice: 沦为奴仆
  rationale: 表达奴役或奴隶身份临到人的处境，也与约瑟的叙事背景相合；不将其弱化为一般性的服役。
- source_word: συκοφαντία
  choice: 受到诬告
  rationale: 该词在此指恶意诬陷或虚假控告；“诬告”简洁地保留其司法及名誉层面的含义。
- source_word: σωφροσύνη
  choice: 节制
  rationale: 此词可涵盖自制、贞洁和审慎；本节与约瑟抗拒诱惑的语境相关，但采用较宽的“节制”，避免将词义只限定为性方面的贞洁。
- source_word: ὑψοῖ καὶ δοξάζει
  choice: 将他高举，使他得荣耀
  rationale: 分别保留“高举”与“荣耀”两个动作，同时使现代汉语表达自然。
theological_decisions:
- issue: κατοικῶν ἐπ᾽ αὐτόν 所表达的主与人的关系
  choice: 住在他身上
  alternative: 与他同住／住在他里面
  rationale: ἐπί加宾格直译倾向“在他身上”或“临到他”；不把它静默改写成较熟悉的“住在里面”或“与他同住”，以保留原文不寻常的空间意象，并用脚注提示可行理解。
- issue: διὰ τὴν σωφροσύνην 的因果关系
  choice: 主因他的节制而施行拯救、高举与荣耀
  alternative: 主因节制而住在他身上
  rationale: 希腊语语序容许短语与“居住”紧密相连，也可修饰后续整组行动。正文按句意将其置于主句行动之前，从而保留一定修饰范围，不将神同在与人的德行之间的关系进一步教义化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“沦为奴仆”贴合约瑟经历，“节制”保留 σωφροσύνη 的宽广伦理含义。句式维持原文从患难到拯救、高举和荣耀的递进结构。
