revisions:
- from: 但在至高者居住之处，即使有人遭人嫉妒，沦为奴仆，或受到诬告，住在他身上的主[a]也因他的节制，不但救他脱离种种祸患，还将他高举，使他得荣耀，正如待我一样。
  to: 但凡至高者所居住之处，即使有人遭人嫉妒，或沦为奴隶，或受人诬陷，那因他的节制而临在他身上的主[a]，不但救他脱离各种祸患，还高举他，使他得荣耀，正如他待我一样。
  rationale: 修订使中文更符合现代标准汉语，并更准确呈现奴役、诬陷及不寻常的“居住于其上”结构。脚注保留原文的句法与语义歧义；正文不对主临在与人的节制之间的关系作超出文本的教义化界定。
