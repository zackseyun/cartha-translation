  - severity: medium
    issue: “住在他身上”在现代汉语中不自然，原脚注“住到他身上”也未准确反映 κατοικῶν 的现在分词意义。
    rationale: κατοικῶν ἐπ᾽ αὐτόν 的搭配确属不寻常，应保留其可能的“在其上／临在其身”的意象，但须用较自然的正文和准确脚注表达。
