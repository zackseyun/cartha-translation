  text: Ὁρᾶτε οὖν, τέκνα μου, πόσα κατεργάζεται¹ ἡ² ὑπομονὴ καὶ ἡ³ προσευχὴ μετὰ νηστείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/001.yaml
  text: See, then, my children, how much endurance and prayer with fasting accomplish.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要看，忍耐和禁食祷告能成就多大的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: 你们要看
  rationale: 保留复数命令语气；在劝诫语境中自然表达“注意看、由此看出”。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲切的父辈称呼，并明确复数。
- source_word: πόσα κατεργάζεται
  choice: 能成就多大的事
  rationale: πόσα在此表示成果之大；κατεργάζεται强调产生、成就实际效果。希腊语动词为单数，但两个带冠词的并列概念共同构成所强调的途径，汉语无需标示数的一致。
- source_word: ἡ ὑπομονὴ
  choice: 忍耐
  rationale: 表达在患难中坚忍持守，而不是仅仅被动等待。
- source_word: ἡ προσευχὴ μετὰ νηστείας
  choice: 禁食祷告
  rationale: 自然简洁地表达“伴随禁食的祷告”，使禁食修饰祷告而不被误读为第三个并列主语。
theological_decisions:
- issue: 忍耐与禁食祷告的句法关系
  choice: 将“忍耐”和“禁食祷告”作为并列主语
  alternative: 把“祷告与禁食”视为忍耐所伴随的方式
  rationale: 重复冠词ἡ支持ὑπομονή与προσευχή并列，而μετὰ νηστείας直接限定祷告；这样也保留经文对两者共同功效的强调。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“所以”承接上文推论；语序兼顾希腊原文结构与自然汉语。
