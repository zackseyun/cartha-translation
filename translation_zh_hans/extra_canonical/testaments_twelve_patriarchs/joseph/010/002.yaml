revisions:
- from: 同样，你们若怀着忍耐和谦卑的心，借着祷告和禁食，竭力追求节制与纯洁，主就必住在你们里面，因为他喜爱节制。
  to: 同样，你们若以忍耐，并祷告和禁食，存着谦卑的心，竭力追求节制和纯洁，主就必住在你们里面，因为他喜爱节制。
  rationale: 作小幅语序和连接方式调整，使“忍耐、祷告与禁食、内心谦卑”均作为追求节制与纯洁时的连续伴随情状呈现，避免将“借着祷告和禁食”的工具性理解定得过强。保留“竭力追求”“节制”“纯洁”及“住在你们里面”，以维持原文力度、术语区分及 ἐν ὑμῖν 的开放性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:20:53Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的条件结构为：追求“节制和纯洁”，其方式／伴随情状依次是“以忍耐和祷告，并带着禁食，在心的谦卑中”。草稿将“祷告和禁食”明确处理为“借着”的手段，并把“谦卑的心”前置；虽不致严重改变意义，但较原文的并列修饰关系多作了一层解释。
  naturalness: 草稿整体庄重通顺；但“怀着忍耐和谦卑的心，借着祷告和禁食”使“忍耐”与“谦卑的心”被不对称地合并，且“借着”容易使祷告和禁食成为唯一的工具性手段。按原文顺序作轻微调整会更清晰自然。
  terminology: “节制”对应 σωφροσύνη、“纯洁”对应 ἁγνεία，均恰当并保留二词区别。“主就必住在你们里面”忠实呈现 κατοικήσει ἐν ὑμῖν；“里面”保留原文可兼具个人内在与群体维度的开放性。
  issues:
  - severity: low
    issue: 介词短语的关系被稍微具体化
    rationale: 原文将 ἐν ὑπομονῇ、καὶ προσευχῇ μετὰ νηστείας、ἐν ταπεινώσει καρδίας连续附于“追求”；草稿的“借着祷告和禁食”把其中一项明确规定为手段，而其余两项规定为内在态度。改为并列的“以……，并……，存着……”可更少解释原文。
  - severity: low
    issue: “谦卑的心”与“忍耐”并列不够对称
    rationale: “怀着忍耐和谦卑的心”在汉语中可理解，但“忍耐”和“谦卑的心”语法层级不同。将其改为“以忍耐，并祷告和禁食，存着谦卑的心”更清楚。
  revised_text: 同样，你们若以忍耐，并祷告和禁食，存着谦卑的心，竭力追求节制和纯洁，主就必住在你们里面，因为他喜爱节制。
