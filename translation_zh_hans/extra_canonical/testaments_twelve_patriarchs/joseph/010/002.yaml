source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὕτως καὶ ὑμεῖς⁴, ⌜ἐὰν τὴν σωφροσύνην καὶ τὴν ἁγνείαν μεταδιώκητε⁵ ἐν ὑπομονῇ καὶ *προσευχῇ μετὰ νηστείας ἐν ταπεινώσει⁶ καρδίας, ὁ⁷ Κύριος κατοικήσει⁸ ἐν ὑμῖν, ὅτι ἀγαπᾷ⁹ τὴν σωφροσύνην.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/002.yaml
  text: So you also, if you pursue self-control and purity with endurance and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.
translation:
  language: zh_hans
  text: 同样，你们若以忍耐，并祷告和禁食，存着谦卑的心，竭力追求节制和纯洁，主就必住在你们里面，因为他喜爱节制。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: 节制
  rationale: 该词在此指克制欲望、持守端正的品格；译作“节制”既与上下文中的性伦理有关，又不把含义局限为单一层面的贞洁。
- source_word: ἁγνείαν
  choice: 纯洁
  rationale: 该词表示道德上、尤其性方面的纯净；“纯洁”与“节制”并列自然，也保留较宽的语义范围。
- source_word: μεταδιώκητε
  choice: 竭力追求
  rationale: 动词带有积极而持续追求的力度，“竭力追求”比单纯“追求”更能体现其强调意味。
- source_word: ἐν ὑπομονῇ
  choice: 怀着忍耐
  rationale: 表达追求这些品格时所持守的坚忍态度，符合现代汉语习惯。
- source_word: προσευχῇ μετὰ νηστείας
  choice: 借着祷告和禁食
  rationale: 清楚呈现祷告与禁食作为操练和追求的途径，同时保留二者的紧密联系。
- source_word: ἐν ταπεινώσει καρδίας
  choice: 怀着……谦卑的心
  rationale: 自然表达“内心谦卑”的状态，并与“忍耐”共同修饰整个追求过程。
- source_word: κατοικήσει ἐν ὑμῖν
  choice: 就必住在你们里面
  rationale: κατοικήσει为将来时；“住在你们里面”贴近ἐν ὑμῖν，并保留其可指群体中每个人内在居住的表达。
theological_decisions:
- issue: “主住在你们里面”与“主住在你们中间”的可能理解
  choice: 主就必住在你们里面
  alternative: 主就必住在你们中间
  rationale: ἐν ὑμῖν本身可随语境产生内在或群体性的理解；直译为“在你们里面”更贴近介词结构，也不排除复数“你们”所含的群体维度。
- issue: σωφροσύνη的伦理范围
  choice: 节制
  alternative: 贞洁
  rationale: 本段虽明显涉及性方面的纯洁，但σωφροσύνη的含义比“贞洁”更宽；且它与ἁγνεία“纯洁”并列，译为“节制”可避免两个词语义重叠并保留原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。调整希腊语介词短语的排列，把“忍耐”和“谦卑的心”作为追求时的态度，把“祷告和禁食”作为实践途径，以避免汉语句子生硬，同时未改变各成分的实质关系。
