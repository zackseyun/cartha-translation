base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/006.yaml
  text: And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent when I was being sold, not telling the Ishmaelites that I was a son of Jacob, a great and righteous man.
translation:
  language: zh_hans
  text: 我并没有在恶事上自高[a]；相反，我尊重我的兄弟们。因为惧怕他们[b]，我被卖时一直沉默，没有告诉以实玛利人，我是那位伟大而公义的人雅各的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在恶事上自高”：希腊文本此处有校勘疑难，也可理解为“没有因恶而高傲”。
    reason: 原文以校勘符号标示该短语不稳，且ἐν κακῷ的具体关系不明确。
  - marker: b
    text: “惧怕他们”：希腊语也可能理解为“因为他们的恐惧”或“因为顾忌他们”。
    reason: 属格αὐτῶν既可能是恐惧的对象，也可能是恐惧的主体，需保留原文歧义。
lexical_decisions:
- source_word: οὐκ ἐπήρθην ἐν κακῷ
  choice: 我并没有在恶事上自高
  rationale: ἐπαίρω在此表示“抬高自己、自高”；保留ἐν κακῷ较不寻常的表达，不擅自具体化为某一种恶行。原文此处有校勘疑难，故加注说明。
- source_word: ἐτίμουν τοὺς ἀδελφούς μου
  choice: 我尊重我的兄弟们
  rationale: τιμάω基本义为“尊重、尊敬”；此处强调约瑟对兄弟们的态度，用“尊重”自然且不过度强化。
- source_word: διὰ τὸν φόβον αὐτῶν
  choice: 因为惧怕他们
  rationale: 属格αὐτῶν可能表示恐惧所指向的对象，也可能表示他们自身的恐惧；正文采用语境中较顺畅的“惧怕他们”，同时用脚注保留歧义。
- source_word: πιπρασκόμενος
  choice: 我被卖时
  rationale: 现在分词为被动，表示约瑟正处于被出售的过程中；以时间从句自然表达。
- source_word: ἐσιώπουν … ἐσιώπουν εἰπεῖν
  choice: 一直沉默，没有告诉
  rationale: 希腊文本重复“沉默”，句法生硬；译文传达持续不作声以及没有说出身份两层意思，避免在中文中机械重复。
- source_word: Ἰσμαϊλίταις
  choice: 以实玛利人
  rationale: 采用现代中文圣经传统中通行的人名族称。
- source_word: ἀνδρὸς μεγάλου καὶ δικαίου
  choice: 那位伟大而公义的人
  rationale: μέγας译为“伟大”，δίκαιος译为“公义”，不误作“有能力”或“强大”。“那位”帮助中文清楚显示此短语修饰雅各。
theological_decisions:
- issue: 约瑟沉默的动机
  choice: 因为惧怕他们
  alternative: 因为顾忌他们／因为他们的恐惧
  rationale: 原文διὰ τὸν φόβον αὐτῶν在语法上存在指向歧义。正文依据叙事情境采用“惧怕他们”，但不将其解释为敬畏、体谅或某种特定德行。
- issue: 雅各被称为δίκαιος
  choice: 公义
  alternative: 正直／义人
  rationale: “公义”保留该词在犹太—基督教伦理与神学语境中的分量；原文是形容词，与“伟大”并列，不改写成名词性的“义人”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号和短句理清原文较曲折且重复的句法，同时保留“在恶事上自高”和“惧怕他们”等关键张力；人物与族名使用简体中文圣经传统通行译法。
