base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/005.yaml
  text: My brothers knew how my father loved me, yet I was not exalted in my mind; though I was a child, I had the fear of God in my heart, for I knew that surely all things will pass away.
translation:
  language: zh_hans
  text: 我的兄弟们都知道父亲怎样爱我；我却没有心高气傲。虽然当时年幼，我心里仍敬畏上帝，因为我知道一切都会过去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσιν
  choice: 都知道
  rationale: 采用现在时“知道”，紧贴现存希腊文本；“都”自然体现复数主语的整体性，但不额外强化语义。
- source_word: πῶς ἠγάπησέ με
  choice: 怎样爱我
  rationale: 保留πῶς的表达方式，并以自然汉语传达父亲对约瑟的爱。
- source_word: οὐχὶ ὑψούμην ἐν τῇ διανοίᾳ μου
  choice: 我却没有因此心高气傲
  rationale: ὑψόω在此为内心自高；“心高气傲”比直译“在心思中被高举”更符合现代汉语。“因此”点明父亲偏爱与不自高之间的语义关联。
- source_word: καίπερ νήπιος ὑπάρχων
  choice: 虽然当时年幼
  rationale: καίπερ明确表达让步；νήπιος在此按年龄语境译为“年幼”，避免过度限定为婴孩。
- source_word: τὸν φόβον τοῦ θεοῦ
  choice: 敬畏上帝
  rationale: 该固定宗教表达兼有畏惧与尊崇之意，译作“敬畏上帝”准确且自然。
- source_word: πάντα παρελεύσεται
  choice: 一切都会过去
  rationale: 保留πάντα的宽泛所指，不擅自限定为荣华、恩宠或今世事物；παρέρχομαι译为“过去”。
theological_decisions:
- issue: “敬畏上帝”的含义
  choice: 保留“敬畏”
  alternative: 惧怕上帝
  rationale: φόβος可含惧怕，但在虔敬语境中也含尊崇与顺服；“敬畏”能保留这种张力，且不将其缩减为单纯恐惧。
- issue: “一切”所指范围
  choice: 保持宽泛
  alternative: 译作“世上的一切”或“这一切荣耀”
  rationale: 原文πάντα没有明示范围，故不以神学解释替代文本的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句间用分号和句号呈现原文的对照与因果关系；不添加脚注，因为本节无需借脚注处理关键异文或不可避免的歧义。
