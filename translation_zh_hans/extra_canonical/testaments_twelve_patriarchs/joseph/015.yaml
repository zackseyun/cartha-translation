  text: '4. For she wanted to see me in the desire of sin, but I was ignorant in all these things.


    5. And I said to her, “This is not the custom among the Egyptians, to take what belongs to another before proof is given.”


    6. So I said this concerning the exchange. But the boy ought to be kept shut up.


    1. And after twenty-four days the Ishmaelites came, for they had heard that Jacob my father was mourning greatly for me. And when they came they said to me,


    2. “Why did you say that you were a servant? For look, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”


    3. When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a servant.”


    4. Then they took counsel to sell me, so that I might not be found in their hands.


    5. For they feared my father, lest he come against them and execute dangerous vengeance on them; for they had heard that he was great before God and men.


    6. Then the trader said to them, “Release me from the judgment of Potiphar.”


    7. So they came near and asked me, saying, “Say that you were bought by us for silver, and he will release us.”'
translation:
  language: zh_hans
  text: '十四章（续）


    4 她想带着犯罪的欲望看我[a]，而我对这一切毫不知情。


    5 我对她说：“埃及人没有这样的规矩：事情还没有查明，就夺取别人的财物。”


    6 这话是就那商贩而言的[b]；至于那少年，理当关押起来。


    十五章


    1 过了二十四天，以实玛利人来了。他们听说我父亲雅各因我悲痛不已。他们来到我这里，对我说：


    2 “你为什么说自己是奴仆？看哪，我们已经得知，你是迦南地一位大人物的儿子；你父亲至今还为你悲痛，披麻蒙灰。”


    3 我听见这些话，五脏如同撕裂，心也熔化了，很想放声痛哭；但我克制住自己，免得使我的兄弟们蒙羞。我对他们说：“我不知道；我是奴仆。”


    4 于是他们商议要把我卖掉，免得我被发现在他们手中。


    5 因为他们惧怕我父亲，恐怕他来攻击他们，施行可怕的报复[c]；他们听说，他在上帝和世人面前都大有尊荣。


    6 于是那商贩对他们说：“请使我脱离波提乏的审判。”


    7 他们便上前求我说：“你要说，你是我们用银子买来的，这样他就会释放我们[d]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犯罪的欲望”也可理解为“对罪的欲望”；原文措辞简略，具体所指由上下文显明。
    reason: 保留 πόθῳ ἁμαρτίας 的属格歧义，并提示其未明说具体行为。
  - marker: b
    text: 本句与前句的衔接在传本和上下文中不够明确；希腊文可直译为“这样，他说了有关那商贩的话”，下句则转述对少年的处置。
    reason: 说明十四章6节的代词及其与“商贩”的关系不明，避免在正文中指定说话者。
  - marker: c
    text: “可怕的报复”原文措辞异常，也可译作“带来危险的报复”或“因这场危害而报复”。
    reason: ἐκδίκησιν κινδύνου 的属格关系罕见，需保留语义不确定性。
  - marker: d
    text: “他”指波提乏；末句也可译作“他就必须释放我们”。
    reason: ἔχει 加不定式可表达将要或有义务做某事，原文在预期与义务之间略有张力。
lexical_decisions:
- source_word: πόθῳ ἁμαρτίας
  choice: 带着犯罪的欲望
  rationale: 保留属格结构及其道德张力，不擅自具体化为某一种性行为；同时用现代汉语清楚表达其欲望指向罪。
- source_word: ἀφαιρεῖσθαι τὰ ἀλλότρια
  choice: 夺取别人的财物
  rationale: ἀλλότρια 字面为“属于别人的东西”；结合埃及习俗和查验语境，译作“别人的财物”，但不进一步限定具体物件。
- source_word: μετάβολος
  choice: 商贩
  rationale: 此词在本段指参与转卖约瑟的交易者；“商贩”自然且保持其交易角色，不与以实玛利人完全等同。
- source_word: παῖς
  choice: 少年
  rationale: 此处指约瑟，可有“孩子、少年、仆役”等义；语境重在被拘禁的年轻人，故译“少年”，避免过早把身份判定为奴仆。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 保留 δοῦλος 的受辖制身份含义；“奴仆”庄重且适合古代语境。
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: 五脏如同撕裂
  rationale: 保留古代以内脏表达深切情感的强烈身体意象，同时以“如同”使现代汉语自然。
- source_word: μέγας παρὰ Θεῷ καὶ ἀνθρώποις
  choice: 在上帝和世人面前都大有尊荣
  rationale: μέγας 此处表示身份、声望或分量重大；译为“大有尊荣”比字面的“伟大”更符合汉语叙事语境。
- source_word: κρίσεως τοῦ Πεντεφρί
  choice: 波提乏的审判
  rationale: 保留 κρίσις 的司法性与原文关系的简洁表达，不擅自改成定罪、刑罚或控告。
- source_word: ἐν ἀργυρίῳ ἠγοράσθης
  choice: 用银子买来的
  rationale: ἀργύριον 在此是交易所用的银钱；“用银子”保留古代交易意象。
theological_decisions:
- issue: 约瑟是否明知妇人的罪恶意图
  choice: 译为“我对这一切毫不知情”
  alternative: “我在这一切事上都是清白的”
  rationale: ἠγνόουν 通常表示“不知道、未察觉”；采取认识层面的译法，保留叙述张力，不把它改写成明确的道德自证。
- issue: 约瑟隐瞒身份与保护兄弟之间的张力
  choice: 直译其克制哭泣、避免兄弟蒙羞，并继续自称奴仆
  alternative: 解释为约瑟主动饶恕或说谎
  rationale: 原文只陈述其动机与言语，未明确作伦理或神学评价，因此不替文本裁断。
- issue: 雅各“在上帝和世人面前为大”
  choice: 译为“在上帝和世人面前都大有尊荣”
  alternative: “蒙上帝和世人喜悦”
  rationale: 原文是 μέγας 而非“蒙喜悦”；保留其地位与声望含义，不引入额外的蒙恩公式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“看哪”“披麻蒙灰”“五脏如同撕裂”等具有古代文献色彩且普通读者可理解的表达；对代词、司法措辞和异常属格不作教派化或过度解释。为避免章界混淆，将所给十四章续文与十五章分别标明。
