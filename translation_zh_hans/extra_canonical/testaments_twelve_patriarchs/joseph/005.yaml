  source_fidelity: 译文准确传达希腊文的主要语义：妻子以毒杀丈夫相威胁并要求约瑟与她通奸；约瑟撕裂衣服、警告她不可行恶并会将其谋划告知众人；她因害怕而恳求隐瞒，随后以礼物和各种享乐继续试图拉拢他。第2节的“在上帝面前知耻”恰当地保留了αἰδέσθητι τὸν Θεόν所含的因顾念上帝而羞愧、收敛之意，未将其简单等同于通常的“敬畏”。“免得你灭亡”也未擅自指定毁灭的施行者。
