base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005.yaml
  text: 'And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as my husband.”


    2 So when I heard this, I tore my garments and said to her, “Woman, be ashamed before God, and do not do this lawless and evil deed, lest you be destroyed. For know this also: I will report your scheme to everyone.”


    3 Then she, being afraid, begged me not to report this scheme.


    4 And she went away, trying to win me over with gifts and every kind of pleasure.'
translation:
  language: zh_hans
  text: '5 另有一次，她又对我说：“你若不肯犯奸淫，我就用毒药杀死我的丈夫，让你作我的丈夫。”


    2 我听见这话，就撕裂衣服，对她说：“妇人，你当在上帝面前知耻，不可做这件恶事，免得你灭亡。你也要知道，我必把你的这个阴谋告诉众人。”


    3 她害怕了，就求我不要把这个阴谋说出去。


    4 她便退去，却仍想用礼物和各种享乐来笼络我。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  choice: 犯奸淫
  rationale: 直接表达婚姻之外的性关系，保留原文的伦理含义，且符合现代汉语圣经语体。
- source_word: ἀνελῶ τὸν ἄνδρα μου φαρμάκῳ
  choice: 用毒药杀死我的丈夫
  rationale: φαρμάκῳ在此表示毒药或下毒的手段；译文清楚保留谋杀方式。
- source_word: αἰδέσθητι τὸν Θεόν
  choice: 你当在上帝面前知耻
  rationale: αἰδέομαι兼有羞耻、敬重和顾忌之意；此处是针对恶谋的斥责，译为“在上帝面前知耻”比单纯“敬畏上帝”更贴近语境，同时保留以上帝为道德见证者的含义。
- source_word: πρᾶξιν ταύτην τὴν πονηράν
  choice: 这件恶事
  rationale: 希腊文明确说“这件邪恶的行为”，未另有表示“不法”的词，因此不增译“违法”。
- source_word: ἐπίνοια
  choice: 阴谋
  rationale: 此处指预谋毒杀丈夫并占有约瑟的计划，“阴谋”准确体现其恶意和谋划性质。
- source_word: ἀνεχώρησεν
  choice: 退去
  rationale: 该词表示离开、退开或撤退；“退去”既自然，也保留她受挫后离开的意味。
- source_word: ἐπιθάλπουσά με δώροις καὶ ἀπολαύσεσι πάσαις
  choice: 却仍想用礼物和各种享乐来笼络我
  rationale: ἐπιθάλπω在这里有以柔和手段讨好、诱引之意；“笼络”能自然表达她继续以利益和享乐争取约瑟。
theological_decisions:
- issue: αἰδέσθητι τὸν Θεόν所表达的对上帝的态度
  choice: 在上帝面前知耻
  alternative: 敬畏上帝
  rationale: 原词在本句侧重因顾念上帝而感到羞耻、收手，并非采用通常表示宗教敬畏的φοβέομαι；所选译法避免把两者无差别地处理，同时不削弱上帝作为审判与道德见证者的地位。
- issue: 犯罪后果ἐξολοθρευθῇς的性质
  choice: 免得你灭亡
  alternative: 免得你被消灭
  rationale: 被动形式可指遭毁灭，但原文没有明说施行毁灭者；“灭亡”保留神学上的被动和后果的严重性，不擅自补明执行者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“妇人”保留直接而严肃的称呼；叙事句式简洁。第4节用“却仍想”呈现她虽退去却继续笼络约瑟的张力。无必要脚注。
