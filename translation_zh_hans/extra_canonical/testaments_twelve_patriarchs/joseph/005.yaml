  terminology: “上帝”“犯奸淫”“恶事”“阴谋”“灭亡”等术语前后一致，并与希腊文本及英文审计稿相符。“妇人”在此保留原文直接、严肃的称呼，语域合宜。无需脚注；文本中也没有未处理的脚注锚点。
