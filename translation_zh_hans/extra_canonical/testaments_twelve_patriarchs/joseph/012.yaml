  text: '3[a]. And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant. 4. And when we had come into Egypt, they disputed concerning me, as to who would deceive the merchant and receive money for me. 5. So it seemed good to all of them to leave me in Egypt with the merchant of their trade until they should return bringing merchandise[b]. 6. But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me. 7. And God blessed him in my hands, and increased him on my account in gold and silver and work. 8. And I was with him three months.


    1. Now at that time the wife of Pentephri came down to Memphis with great display, because she had heard about me from her eunuchs. 2. And she said to her husband, “The merchant has grown rich by the hands of a certain young Hebrew; and they say that he was stolen away by theft from the land of Canaan. 3. Now therefore execute judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you[c], because grace from heaven is upon him.”'
translation:
  language: zh_hans
  text: '十一（续）


    3 那些人中为首的对我说：“你不是奴隶，因为你的相貌也显明了这一点。”但我仍明明告诉他们，我是他们的奴隶。4 我们到了埃及以后，他们为我的事争执，议论谁可以把我交出去，换取金子。[a] 5 于是众人决定，把我留在埃及，留在与他们贸易往来的商人那里，等他们带着货物回来。6 但主使我在那商人眼前蒙恩，商人便把自己的家交托给我管理。7 上帝借着我的手赐福给他，使他的金银和产业都增多了。[b] 8 我同他住了三个月。


    十二


    1 那时，彭特弗里的妻子乘车来到孟斐斯，大摆排场；她已从自己的宦官那里听说了我的事。[c] 2 她对丈夫说：“那商人靠一个希伯来青年之手发了财；又有人说，这青年是被人从迦南地偷走的。3 现在，你要审理他的事，把那青年带进我们家里来。希伯来人的上帝必赐福给你，因为有从天上来的恩宠临到他。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊文本句法粗糙，可能经历了讹误或叙事压缩。“谁可以把我交出去，换取金子”也可能与约瑟被出售的过程有关，但具体所指并不完全清楚。
    reason: textual_variant
  - marker: b
    text: “产业”所译的希腊词也可理解为“工作”“出产”或“经营成果”；现存文本在这里较难确定。
    reason: lexical_alternative
  - marker: c
    text: “彭特弗里”是希腊文姓名形式，在《创世记》相关传统中常与波提乏及其家族叙事联系起来。本节“乘车”所据的希腊词在本版中以†标为疑难。
    reason: cross_reference
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隶
  rationale: 上下文涉及约瑟被出售并受人占有的身份；“奴隶”比“仆人”更准确地保留其受奴役的社会处境。
- source_word: ἡ ὄψις σου δηλοῖ
  choice: 你的相貌也显明了这一点
  rationale: ὄψις指外貌、容貌，δηλόω指使某事显明；译文保留对方从约瑟外在气质作出判断的意思。
- source_word: προδοὺς χρυσίον λάβῃ με
  choice: 把我交出去，换取金子
  rationale: προδίδωμι可指交出或出卖；希腊文句法粗糙，译文保留交易含义，却不擅自补入原句未明说的受事者“商人”。
- source_word: μετάβολος
  choice: 商人
  rationale: 在叙事中指经营货物交易、并暂时接收约瑟的人；“商人”自然且符合语境。
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: 把自己的家交托给我管理
  rationale: 该表达指把全家的事务委托约瑟照管；补出“管理”可在现代汉语中清楚表达委任含义。
- source_word: ἐν χειρί μου
  choice: 借着我的手
  rationale: 保留圣经式的施行媒介意象，同时比直译“在我手中”更清楚地表达上帝借约瑟使商人蒙福。
- source_word: ἔργῳ
  choice: 产业
  rationale: 此词在抄本文本中含义不稳，可能指工作、出产或经营成果；正文以“产业”概括其经济意义，并在脚注说明其他可能。
- source_word: μετὰ δόξης πολλῆς
  choice: 大摆排场
  rationale: 此处δόξα指外在的显赫、华贵，而非神学意义上的“荣耀”；该译法自然传达公开而隆重的气派。
- source_word: εὐνοῦχοι
  choice: 宦官
  rationale: 保留希腊词的字面宫廷身份；虽然也可能泛指内廷官员，但文本未要求淡化其具体含义。
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: 审理他的事
  rationale: κρίσις带有司法判断或调查之意；这样翻译既保留正式处理的语气，也符合现代汉语。
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: 有从天上来的恩宠临到他
  rationale: χάρις在此指来自上天的眷顾；“临到他”保留恩宠指向并落在约瑟身上的意象。
theological_decisions:
- issue: 第11章6—7节相邻处κύριος与θεός的称谓差异
  choice: 分别译作“主”和“上帝”
  alternative: 两处统一译作“上帝”或“主上帝”
  rationale: 希腊文本有意或至少实际使用了不同称谓；保留差异，避免未经依据的协调。
- issue: 第12章3节“希伯来人的上帝必赐福给你”
  choice: 保留说话者对未来赐福的明确断言
  alternative: 弱化为“或许会赐福给你”
  rationale: εὐλογῆσαί σε ἔχει表达预期或将要发生的赐福，原文没有不确定语气。
- issue: 约瑟所得的“天上恩宠”
  choice: 译作“有从天上来的恩宠临到他”
  alternative: 解释为特定的救恩、圣灵恩赐或盟约地位
  rationale: 文本只陈述来自天上的眷顾；不把一般性的神圣恩宠扩展为后来的教义范畴。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“主／上帝”“奴隶”“宦官”等源文区别与社会用语，不按《创世记》平行叙事改写姓名或补足情节。第11章4节和第12章1节的文本疑难以正文可读、脚注明示不确定性的方式处理。
