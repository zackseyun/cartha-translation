base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/003.yaml
  text: So then, many times, as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.
translation:
  language: zh_hans
  text: 所以，她常常把我视为圣洁的人，用言语奉承我；又带着诡诈，在她丈夫面前用言语称赞我的自制，意图在私下使我失足。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἁγίῳ ἀνδρί
  choice: 把我当作圣洁的人
  rationale: 保留ὡς所表达的看待或对待方式，并以自然汉语呈现其间接宾语结构。
- source_word: ἐκολάκευέ με
  choice: 奉承我
  rationale: 准确表达带有操纵意图的谄媚，而非普通称赞。
- source_word: σωφροσύνην
  choice: 自制
  rationale: 在此诱惑情境中主要指克制情欲、持守端正；“自制”既清楚又不过度缩窄为单一性伦理术语。
- source_word: κατὰ μόνας
  choice: 单独相处时
  rationale: 依上下文表达趁无人同在、两人独处之时，不额外指定地点。
- source_word: ὑποσκελίσαι
  choice: 使我失足
  rationale: 保留原词“绊倒”的形象及其使人陷入道德过犯的语境含义。
theological_decisions:
- issue: σωφροσύνη是否专指贞洁
  choice: 译作“自制”
  alternative: 贞洁
  rationale: 原词语义范围包括自制、节制及性方面的纯洁；本节虽处于性诱惑语境，却不必在正文中将其范围完全收窄。
- issue: ὑποσκελίσαι的道德含义是否明说
  choice: 保留“使我失足”的比喻
  alternative: 诱使我犯罪
  rationale: 原文采用绊倒或使跌倒的形象；直陈“犯罪”会解释得更明确，却消除原有修辞与一定程度的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以两个并列分句保留原文行动递进：公开奉承和称赞，目的是在私下使约瑟失足。
