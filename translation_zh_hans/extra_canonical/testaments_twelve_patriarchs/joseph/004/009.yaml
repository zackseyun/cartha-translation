- source_word: πληρῶσαι
  choice: 满足
  rationale: 与“欲望”搭配时，汉语用“满足”比直译“使……充满”更自然，并准确表达使欲求得到实现。
- source_word: τὴν ἐπιθυμίαν αὐτῆς
  choice: 自己的欲望
  rationale: 保留ἐπιθυμία较宽的“欲望”含义，不擅自限定为特定行为；反身表达清楚指向主语。
