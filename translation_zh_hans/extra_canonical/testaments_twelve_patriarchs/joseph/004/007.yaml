  text: And she says to me, “If you want me to leave the idols, my kinsman, I will persuade my husband to withdraw from the idols, and we will walk before your Lord.”
translation:
  language: zh_hans
  text: 她对我说：“我的亲人啊，你若愿意我离弃偶像，我也会劝服我的丈夫远离偶像；我们也将在你主面前行走。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψω τὰ εἴδωλα
  choice: 离弃偶像
  rationale: καταλείπω在此指舍弃、放弃；“离弃”既贴近原意，也符合庄重的现代汉语表达。
- source_word: συγγενοῦς μου
  choice: 我的亲族啊
  rationale: 按现有希腊文本将其理解为呼语，保留亲属关系的宽泛含义，不具体化为某一种亲属。
- source_word: πείθω τὸν ἄνδρα μου
  choice: 劝我的丈夫
  rationale: πείθω在此表示说服、劝服；中文用“劝”自然简洁，宾语“我的丈夫”明确保留。
- source_word: ἀποστῆναι ἀπὸ τῶν εἰδώλων
  choice: 远离偶像
  rationale: ἀφίστημι加ἀπό表达离开、脱离；译为“远离”与前面的“离弃”形成自然但不失对应的表达。
- source_word: πορευσόμεθα ἐνώπιον Κυρίου σου
  choice: 我们就必行在你主面前
  rationale: πορεύομαι可指行走或行事生活；“行在……面前”保留其圣经式伦理意味，同时不增添原文没有的“律法”。
theological_decisions:
- issue: “行在你主面前”是否应扩展为“遵行你主的律法”
  choice: 不作扩展，译作“行在你主面前”
  alternative: “在你主面前行走，遵行你主的律法”
  rationale: 所给希腊文本仅有πορευσόμεθα ἐνώπιον Κυρίου σου，没有“律法”一语；不依据较长异文或旧修订擅自补入。
- issue: “你的主”是否改为“你的神”
  choice: 你主
  alternative: 你的神
  rationale: Κύριος直接对应“主”；保留说话者从约瑟信仰立场称其为“你的主”的措辞及距离感。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留现在时“她对我说”所体现的生动叙述；末句用“行在……面前”传达原文可能兼具实际行走与生活行事的含义。
