review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实呈现条件句、两项离弃偶像的行动以及“在你主面前行走”的结语，也未将较长异文中的“律法”补入正文。惟 συγγενοῦς μου 为单数呼语，现译“我的亲族啊”易被理解为整个宗族，宜改为单数且自然的“我的亲人啊”。此外，καὶ πορευσόμεθα 是并列的将来行动，不宜以“就必”强化为结果或必然性。
  naturalness: “我的亲族啊”在现代汉语中不自然，且“亲族”通常是集合名词。“我的亲人啊”既可作呼语，也保留不具体说明亲属类别的原文宽泛性。“我们也将在你主面前行走”较顺畅，并保留庄重叙事语体。
  terminology: “偶像”“离弃”“劝服”“主”均合宜。“你主”保留 Κυρίου σου 所表达的说话者与约瑟所信之主之间的指称距离；不应改写为“你的神”，也不应添加“律法”。
  issues:
  - severity: medium
    issue: “我的亲族啊”将单数 συγγενής 译成通常指一群人的集合名词。
    rationale: 原文 συγγενοῦς 为单数，且在此按文本作呼语；“我的亲人啊”更自然地保留单数、关系宽泛及呼语功能。
  - severity: low
    issue: “我们就必行在……”把并列连词 καί 和简单将来时处理得过强的结果性与必然性。
    rationale: 上下文可有顺承，但原文直接说“并且我们将行走”；用“我们也将”更贴近句法，不额外强化逻辑关系。
