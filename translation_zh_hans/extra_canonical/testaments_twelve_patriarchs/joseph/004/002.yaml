  text: Καὶ ἔλεγον *πρὸς αὐτὴν⁶¹ ῥήματα ὑψίστου, εἰ ἄρα ἐπιστρέψει⁶² ἀπὸ τῆς ἐπιθυμίας⁶³ τῆς πονηρᾶς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/002.yaml
  text: And I would speak to her words of the Most High, whether perhaps she might turn back from the evil desire.
translation:
  language: zh_hans
  text: 我[a]常对她讲至高者的话，或许她会回头离开那邪恶的欲望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我”所对应的希腊语动词形式也可理解为“他们”。
    reason: 保留ἔλεγον既可作第一人称单数、也可作第三人称复数的形态歧义。
lexical_decisions:
- source_word: ἔλεγον
  choice: 常……讲
  rationale: 未完成时表示过去持续或反复进行的言说；结合本书约瑟第一人称叙事，正文采用“我常……讲”，同时以脚注保留该希腊形式也可解析为第三人称复数的歧义。
- source_word: ῥήματα ὑψίστου
  choice: 至高者的话
  rationale: 直接保留属格关系及“至高者”这一尊称，不将其扩展为特定形式的教训或经文。
- source_word: εἰ ἄρα
  choice: 或许
  rationale: 表达带有试探性和不确定性的期待；避免生硬的“是否或许”，也不添加原文没有明说的目的语气。
- source_word: ἐπιστρέψει ἀπὸ
  choice: 会回头离开
  rationale: 兼顾ἐπιστρέφω的“回转、回头”意象和ἀπό所表示的离开对象。
- source_word: τῆς ἐπιθυμίας τῆς πονηρᾶς
  choice: 那邪恶的欲望
  rationale: “欲望”对应ἐπιθυμία，“邪恶的”保留原文明确的道德评价；定指“那”自然对应希腊语冠词。
theological_decisions:
- issue: ἔλεγον的主语
  choice: 正文采用“我”，脚注说明也可译作“他们”
  alternative: 他们常对她讲
  rationale: ἔλεγον在形态上既可能是第一人称单数，也可能是第三人称复数。约瑟遗训的第一人称叙事及本节语境支持“我”，但词形本身的真实歧义不应被隐去。
- issue: 女子回转的确定程度
  choice: “或许她会”
  alternative: “使她回转”或“她必会回转”
  rationale: εἰ ἄρα保留不确定和试探性的语气，不能把结果写成确定事实或明确目的。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“常……讲”自然呈现未完成时的反复性；“回头离开”既保留回转意象，也符合现代汉语表达。
