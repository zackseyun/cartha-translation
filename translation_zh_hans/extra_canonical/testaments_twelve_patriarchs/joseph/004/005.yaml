  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/005.yaml
  text: In all these things I, lying on the ground, kept begging God that he would rescue me from her deceit.
translation:
  language: zh_hans
  text: 在这一切事中，我躺在地上，不住地祈求上帝救我脱离她的诡计。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαμοκοιτῶν
  choice: 伏卧在地
  rationale: 该词指贴地躺卧或睡在地上；这里用“伏卧在地”保留祈求场景中的身体姿态，同时避免生硬直译。
- source_word: ἐδεόμην
  choice: 不住地祈求
  rationale: 未完成时表达持续或反复进行的恳求，以“不住地”体现其延续性。
- source_word: ῥύσεταί με
  choice: 救我脱离
  rationale: ῥύομαι表示从危险或困境中搭救、解救；“救我脱离”自然传达其搭救含义。
- source_word: τῆς δολιότητος αὐτῆς
  choice: 她的诡计
  rationale: δολιότης可指诡诈、欺骗或奸计；结合人物主动诱骗约瑟的语境，“诡计”比抽象的“诡诈”更自然，但不额外说明具体手段。
theological_decisions:
- issue: 祈求对象及拯救主体
  choice: 明确译作“祈求上帝救我”
  alternative: “向上帝祈求，好叫他救我”
  rationale: 希腊文明确以τοῦ Θεοῦ为祈求对象，并以第三人称动词表达上帝施行搭救；合并句式符合现代汉语，也未改变神学关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“伏卧在地”保留原文少见而具体的姿态；“不住地”传达未完成时的持续性。未添加原文没有的动机、情绪或结果。
