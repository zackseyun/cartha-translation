base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/006.yaml
  text: Since she accomplished nothing in this, she again began to come to me with words of instruction, wanting to learn the word of God.
translation:
  language: zh_hans
  text: 她既然在这事上毫无所成，就又开始带着求教的话来找我，想要学习上帝的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲν ἴσχυσεν ἐν τούτῳ
  choice: 在这事上毫无所成
  rationale: 保留“在此事上没有取得任何成效”的意思；“毫无所成”简洁庄重，也不额外添加“这一招”等解释性措辞。
- source_word: λόγῳ κατηχήσεως
  choice: 带着求教的话
  rationale: κατήχησις指教导、训诲；结合后面的“学习”，此处译为“求教”符合语境，同时保留λόγος所表达的言语方式。
- source_word: ἤρχετο πρὸς με
  choice: 开始……来找我
  rationale: 体现ἤρχετο的开始或持续前来之意，并用现代汉语自然表达趋向。
- source_word: μαθεῖν λόγον Θεοῦ
  choice: 学习上帝的话
  rationale: 直接对应“学习/领受神的话语”，不把λόγος具体化为某一教义体系。
theological_decisions:
- issue: λόγον Θεοῦ的译法
  choice: 上帝的话
  alternative: 神的话
  rationale: 两者在现代汉语基督教语境中均通行；采用“上帝的话”清楚自然，并与所给英文审校层一致，不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文中她先前未能得逞、继而以求教言语前来的关系，但不明说她是假意求教，以免超出本句原文。
