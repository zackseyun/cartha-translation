  text: Ὡς δὲ οὐδὲν ἴσχυσεν²³ *ἐν τούτῳ²⁴, πάλιν ἔτι²⁵ λόγῳ κατηχήσεως ἤρχετο²⁶ πρὸς με τοῦ²⁷ μαθεῖν²⁸ λόγον Θεοῦ²⁹.
