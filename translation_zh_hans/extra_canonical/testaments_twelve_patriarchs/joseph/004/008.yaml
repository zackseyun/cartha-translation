base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/008.yaml
  text: But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”
translation:
  language: zh_hans
  text: 但我对她说：“主不愿敬畏他的人处在污秽中，也不喜悦通奸的人；他所喜悦的，是那些以清洁的心和无玷污的口唇亲近他的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς σεβομένους αὐτόν
  choice: 敬畏他的人
  rationale: σεβομένους表示对上主怀有敬重与虔敬；“敬畏”符合中文宗教语境，也能自然表达这种虔诚态度。
- source_word: ἐν ἀκαθαρσίᾳ
  choice: 陷于污秽
  rationale: 保留ἀκαθαρσία在本段伦理和性行为语境中的“不洁、污秽”含义，又不把范围过度限定为某一种行为。
- source_word: τοῖς μοιχεύουσιν
  choice: 通奸的人
  rationale: μοιχεύω具体指通奸；采用明确的现代汉语对应词，不弱化为泛指的淫乱。
- source_word: εὐδοκεῖ
  choice: 喜悦
  rationale: 表达上主认可、悦纳之意；结合后面的ἀλλά，在补足的平行结构中译作“所喜悦的”。
- source_word: ἐν καθαρᾷ καρδίᾳ
  choice: 怀着清洁的心
  rationale: 保留καρδία作为内在思想、意愿与品格中心的隐喻，同时使用自然庄重的中文。
- source_word: στόμασιν ἀμίαντοις
  choice: 以无玷污的嘴唇
  rationale: 原文以“口”表达言语器官，ἀμίαντος强调未受沾染；译作“嘴唇”更符合中文经文风格，并保留与“心”相对的身体意象。
- source_word: προσερχομένοις αὐτῷ
  choice: 亲近他的人
  rationale: προσέρχομαι可表示来到、接近，也常带敬拜或朝见上主的意味；“亲近他”保留这种关系性和宗教性。
theological_decisions:
- issue: 主所“不愿”的对象与状态之间的句法关系
  choice: 主不愿敬畏他的人陷于污秽
  alternative: 主不要那些在污秽中的敬畏者
  rationale: θέλει加宾格对象并接ἐν ἀκαθαρσίᾳ，最自然理解为主不愿敬畏他的人处于污秽中；此译法保留人的身份与其不洁状态之间的张力。
- issue: 末句εὐδοκεῖ的省略补足
  choice: 他所喜悦的，是那些……亲近他的人
  alternative: 而是那些……亲近他的人
  rationale: ἀλλά引出与“不喜悦通奸的人”相对的对象，动词εὐδοκεῖ在希腊文中可承前省略；中文补出“所喜悦的”以使对照清楚，但不增添新的神学内容。
- issue: “清洁的心”和“无玷污的嘴唇”的关系
  choice: 并列保留内在与言语层面的双重描述
  alternative: 概括为“身心清洁”
  rationale: 原文刻意并列καρδία与στόματα，不宜概括而丢失“嘴唇”所指向的言语纯洁意象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“主、敬畏、清洁、玷污、亲近”等经文语汇；句式稍作调整，以清楚呈现οὔτε…ἀλλά的对照。
