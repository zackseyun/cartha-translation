  text: '*᾿Εδόξαζε ⌜γάρ⌝¹¹ με ὡς σώφρονα *φανερῶς, καὶ ἐν κρυφῇ¹² ἔλεγέ μοι· Μὴ φοβηθῇς τὸν ἄνδρα μου· καὶ γὰρ πέπεισται¹⁴ περὶ τῆς σωφροσύνης σου¹⁵· ὅτι κἂν *τις αὐτῷ εἴπῃ¹⁶ περὶ ἡμῶν, *οὐ πιστεύσει¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/004.yaml
  text: For she openly extolled me as self-controlled, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded about your purity, and even if someone should tell him about us, he will not believe it.”
translation:
  language: zh_hans
  text: 因为她当众称赞我为人节制自守，私下却对我说：“不要怕我丈夫；他深信你是贞洁的，就算有人把我们的事告诉他，他也不会相信。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρονα / σωφροσύνης
  choice: 节制自守 / 贞洁
  rationale: 该词群既可指广义的克制、端正，也在本段性诱惑的语境中特指贞洁。前处用“节制自守”保留公开赞誉的较宽含义，后处用“贞洁”自然表达丈夫对约瑟品行的信任。
- source_word: φανερῶς / ἐν κρυφῇ
  choice: 当众 / 私下
  rationale: 简洁呈现公开与隐秘之间的鲜明对比。
- source_word: πέπεισται
  choice: 深信
  rationale: 完成时表达已经形成并持续存在的确信；“深信”比单纯“相信”更能体现这一语气。
- source_word: περὶ ἡμῶν
  choice: 我们的事
  rationale: 希腊文故意含混，只说“关于我们”；“我们的事”在现代汉语中自然，也不把所指过度明确为已发生的奸情。
- source_word: κἂν τις αὐτῷ εἴπῃ
  choice: 就算有人……告诉他
  rationale: 体现让步兼假设语气，符合自然现代汉语。
theological_decisions:
- issue: σωφροσύνη在本节中的伦理范围
  choice: 按两处语境分别译作“节制自守”和“贞洁”
  alternative: 两处统一译作“贞洁”或“自制”
  rationale: 词义涵盖自制、端正和贞洁；差异化翻译既保留词群的伦理宽度，也显出本段有关性忠贞的具体语境，不引入宗派性解释。
- issue: περὶ ἡμῶν所暗示的关系
  choice: 保留为“我们的事”
  alternative: 译作“我们的关系”或“我和你有私情”
  rationale: 原文没有明说关系性质或事情已经发生，因此不应替文本消除其策略性的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事口吻。以“当众……私下却……”凸显妇人言行的反差；引语自然流畅，同时保留“我们的事”的原文含混。
