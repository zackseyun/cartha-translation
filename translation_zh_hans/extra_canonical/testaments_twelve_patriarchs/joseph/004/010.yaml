  text: And I added fasting and prayer, so that the Lord might rescue me from her.
translation:
  language: zh_hans
  text: 我又加上禁食和祷告，好让主救我脱离她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσετιθέμην
  choice: 又加上
  rationale: 该未完成时中间语态在此表示约瑟在原有应对之外继续增添禁食和祷告；“又加上”自然保留累加之意。
- source_word: νηστείαν καὶ προσευχήν
  choice: 禁食和祷告
  rationale: 直接对应两个并列的宗教实践，措辞简明庄重。
- source_word: ῥύσεταί με
  choice: 救我脱离
  rationale: ῥύομαι表示从危险或权势中解救；“救我脱离”既保留营救意味，也能自然连接ἀπ᾽ αὐτῆς。
- source_word: ἀπ᾽ αὐτῆς
  choice: 脱离她
  rationale: 阴性代词明确回指上下文中的女子；不扩写她所代表的诱惑或威胁，以免消解原文的简洁与含混。
theological_decisions:
- issue: 禁食祷告与神施救之间的关系
  choice: 译作“好让主救我”，表达目的或期望
  alternative: “使主必救我”或“以此换取主的拯救”
  rationale: ὅπως加将来直陈式在此表达目的或所盼望的结果，并不说明禁食祷告能迫使神施救，因此避免引入功德交换的含义。
translation_notes:
  register: 采用现代标准普通话，语句简洁、庄重且易懂；保留第一人称叙事和原文直接称“她”的表达。
