  source_fidelity: “看透了”带有明确识破、洞悉的加强意味；ἔγνων在此更稳妥地译为“知道了/认识到”。其余主要表达准确反映了原文的强烈悲伤、她离开后恢复清醒，以及因她的δόλος与πλάνη而哀伤的叙述。
  naturalness: 原译整体自然、庄重。“她出去后”与“回过神来”均符合现代汉语叙事习惯。将末句改为“知道了”后，语气更平实，也更贴近原文。
  terminology: “诡计”恰当对应δόλος。“迷惑”可保留πλάνη所含的欺惑、错谬或迷妄的语义空间，不宜在译文中武断限定为“妄想”或“错误”。
