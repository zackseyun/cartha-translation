base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/001.yaml
  text: And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I knew her deceit and her delusion.
translation:
  language: zh_hans
  text: 我明白过来以后，就悲痛欲绝。她出去后，我才回过神来；我为她哀伤了许多天，因为我知道了她的诡计和迷惑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: 明白过来
  rationale: 表达领会、察觉之意，并与下文“看透”有所区分。
- source_word: ἐλυπήθην ἕως θανάτου
  choice: 悲痛欲绝
  rationale: 自然而庄重地传达“悲伤直到死”的强烈程度，不把它硬解为实际濒死。
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: 回过神来
  rationale: 符合现代汉语习惯，传达“回到自己、恢复清醒”的惯用含义。
- source_word: ἐπένθησα περὶ αὐτῆς
  choice: 为她哀伤
  rationale: 保留哀悼般的深切悲伤，也保留περὶ αὐτῆς指向“她”的语义。
- source_word: ἔγνων
  choice: 看透了
  rationale: 在此语境中表示对其诡计与迷惑有了确切认识；“看透”自然呈现识破之意。
- source_word: δόλον
  choice: 诡计
  rationale: 准确传达蓄意欺骗、设谋的含义。
- source_word: πλάνην
  choice: 迷惑
  rationale: 保留可指欺惑或错谬的语义张力，避免过度限定为单纯的自我妄想。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；以“悲痛欲绝”和“回过神来”自然表达希腊语惯用结构，同时保留约瑟既识破她、又为她哀伤的张力。
