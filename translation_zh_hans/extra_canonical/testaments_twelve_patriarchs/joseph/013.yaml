    rationale: τύπτω泛指打、击打，希腊文没有说明使用鞭子。应避免补入未明示的刑具。
  - severity: medium
    issue: 第1、3、6—8节“奴仆”
    rationale: 第6节δοῦλος与ἐλεύθερος明确相对，意为奴隶与自由人；本段人口买卖语境也支持以“奴隶”表达非自由身份，而非可能泛指佣仆的“奴仆”。
