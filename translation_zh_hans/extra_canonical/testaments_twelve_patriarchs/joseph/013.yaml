  text: '1. But Pentephris, persuaded by her words, ordered the broker to be brought, and said to him, “What is this that I hear concerning you—that you steal souls from the land of Canaan and sell them again as servants?”


    2. But the broker fell at his feet and begged him, saying, “I beg you, lord, I do not know what you are saying.”


    3. And Pentephris fell upon him and said to him, “From where, then, is this Hebrew servant before me?” And he said, “The Ishmaelites entrusted him to me until they return.”


    4. But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”


    5. And when I was brought in, I bowed down to Pentephris, for he was, he said, third in rank among Pharaoh’s rulers.


    6. And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”


    7. And he said, “Whose?” And I said, “The Ishmaelites’.”


    8. But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”


    9. But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked...'
translation:
  language: zh_hans
  text: '**《约瑟遗训》第十三章**


    1 波提弗里斯听信了她的话，就吩咐人把那人贩子带来[a]，对他说：“我听说你从迦南地拐走人口[b]，再把他们转卖为奴隶，这是怎么回事？”


    2 那人贩子俯伏在他脚前，哀求说：“大人，求求你！我不知道你说的是什么。”


    3 波提弗里斯对他说：“那么，这个希伯来奴隶是从哪里来的？”他回答：“是以实玛利人把他托付给我的，等他们回来。”


    4 波提弗里斯不信他，反而吩咐人脱光他的衣服，打他。那人仍坚持这些说法，波提弗里斯便说：“那么，把那年轻人带来。”


    5 我被带进去后，就向波提弗里斯下拜，因为他在法老的官员中位居第三。


    6 他把我和那人分开，问我：“你是奴隶，还是自由人？”我回答：“是奴隶。”


    7 他又问：“是谁的奴隶？”我回答：“以实玛利人的。”


    8 他问：“你怎么成了他们的奴隶？”我回答：“他们从迦南地买了我。”


    9 他对我说：“你实在是在撒谎。”随即吩咐人也脱光我的衣服，打我。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此处的动词读法带有文本疑难；按上下文，意思是波提弗里斯吩咐人把人贩子带来见他。
    reason: 说明ἐλθεῖν附近的校勘不确定性，同时不使正文生硬。
  - marker: b
    text: 原文直译为“偷取生命（或灵魂）”；在这里是指拐走人口。
    reason: 保留ψυχάς的字面形象及其在本语境中的实际所指，避免误解为抽象灵魂。
lexical_decisions:
- source_word: Πεντεφρὶς / Πεντεφρής
  choice: 波提弗里斯
  rationale: 按希腊文姓名音译，同时采用较易为现代汉语读者辨认的形式；不直接改作《创世记》常见译名“波提乏”，以免抹去本篇希腊文本的姓名形式。
- source_word: μετάβολος
  choice: 人贩子
  rationale: 此处人物从事转卖人口，且下文被指控从迦南偷人；“人贩子”比泛泛的“掮客”更准确自然。
- source_word: κλέπτεις ψυχὰς
  choice: 偷人
  rationale: ψυχαί在此指活人、人口，并非抽象的“灵魂”；“偷人”保留原文强烈的拐掠含义。
- source_word: εἰς παῖδας μεταπωλεῖς
  choice: 再把他们卖作奴仆
  rationale: μεταπωλεῖς含“转卖、再卖”之意；παῖδες在此社会语境中指受奴役者。采用“奴仆”既表达非自由身份，也避免把所有出现都机械处理成现代制度术语。
- source_word: παῖς ὁ Ἑβραῖος
  choice: 这个希伯来奴仆
  rationale: παῖς可指孩子、仆人或奴仆；上下文正在查问约瑟的奴隶身份，因此正文取“奴仆”，而后文νεανίσκος另译“年轻人”。
- source_word: γυμνὸν τύπτεσθαι
  choice: 剥去衣服，鞭打
  rationale: 直译为“赤身受打”；汉语用“剥去衣服，鞭打”清楚呈现羞辱与刑罚。τύπτω本身泛指击打，语境中的刑罚性使“鞭打”自然，但不增添具体刑具。
- source_word: τρίτος ἦν ἐν ἀξιώματι
  choice: 位居第三
  rationale: 简洁表达其权位等级为第三，不采纳英语咨询层中无希腊文依据的“he said”。
- source_word: ἐπριάσαντό με
  choice: 他们从迦南地买了我
  rationale: 保持ἐπριάσαντο“买下”的直接意义，不将约瑟实际被兄弟卖出的背景补入回答。
theological_decisions:
- issue: ψυχή在人口买卖语境中的含义
  choice: 译为“人”
  alternative: 译为“灵魂”或“性命”
  rationale: 此处宾语是被从迦南掳走并转卖为奴仆的人；译作“灵魂”会在汉语中产生原文没有的灵魂论含义。
- issue: παῖς的身份用语
  choice: 依语境译为“奴仆”
  alternative: 译为“仆人”“孩子”或一律译为“奴隶”
  rationale: 保留该词兼具从属身份与年轻男性称谓的语义张力，同时让审问自由或受奴役身份的情境清楚可懂。
- issue: 约瑟关于自己身份的回答
  choice: 照录“他们从迦南地买了我”
  alternative: 解释为约瑟隐瞒兄弟出卖他的事实
  rationale: 文本只陈述其回答，不评判其道德性质；译文不替叙事者作神学或伦理裁断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。对话保持审讯场景的简洁力度；“大人”表现κύριε在世俗上下级语境中的敬称，不译成宗教性的“主”。正文按现存希腊文完整译出第9节末的“鞭打我”，不沿用英语咨询层无根据的省略号。
