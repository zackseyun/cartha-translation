  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/011.yaml
  text: Now therefore render judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you, because grace from heaven is upon him.
translation:
  language: zh_hans
  text: 现在，就他的事作出判决，把这个年轻人带到我们家里来；希伯来人的上帝必赐福给你，因为从天上来的恩惠临到他身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποίησον ... κρίσιν
  choice: 审理
  rationale: 表达作出司法判断之意，在现代汉语中自然且庄重，并避免把 κρίσις 误解为执行刑罚。
- source_word: μετ᾿ αὐτοῦ
  choice: 他的事
  rationale: 结合 κρίσιν 理解为关于他的案件或事情，符合此处关系用法，同时不预断审判结果。
- source_word: ἀφελοῦ τὸν νεανίαν εἰς τὸν οἶκον ἡμῶν
  choice: 把这个年轻人带到我们家里来
  rationale: 按语境将 ἀφαιρέω 表达为把人带走并带入家中；“年轻人”对应 νεανίαν。
- source_word: εὐλογῆσαί σε ἔχει
  choice: 必赐福给你
  rationale: 该迂回结构表达将来或确定将发生之事；“必”保留其强度，汉语也较自然。
- source_word: χάρις
  choice: 恩惠
  rationale: 保留“恩宠、眷顾”的宽泛含义，不将其限定为某一后期神学术语。
- source_word: πρὸς αὐτόν
  choice: 临到他身上
  rationale: 自然表达天上恩惠与他同在或向着他的意思。
theological_decisions:
- issue: “希伯来人的上帝”的称谓
  choice: 希伯来人的上帝
  alternative: 希伯来人的神
  rationale: 直译 ὁ Θεὸς τῶν Ἑβραίων，并采用现代汉语中庄重、通行的“上帝”，不添加宗派性解释。
- issue: χάρις 的神学含义
  choice: 恩惠
  alternative: 恩典
  rationale: “恩惠”较能保留此处可指来自天上的眷顾、恩宠这一开放语义，避免无依据地将其收窄为系统神学意义上的“恩典”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以两个句子呈现劝告及其理由，保留原文因果关系；不增补人物身份、审判结果或恩惠的具体性质。
