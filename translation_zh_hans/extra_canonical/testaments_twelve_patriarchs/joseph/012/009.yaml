source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Κατ᾽ ἐκεῖνον δὲ¹ τὸν καιρὸν κατῆει² Μεμφίς³ †ἐν λαμπήνῃ†⁴ *ἡ γυνὴ⁵ τοῦ Πεντεφρὶ⁶ ⌜μετὰ δόξης πολλῆς, ὅτι ἤκουσε περὶ ἐμοῦ παρὰ τῶν εὐνούχων αὐτῆς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/009.yaml
  text: At that time the wife of Pentephri came down to Memphis in a litter, with great splendor, because she had heard about me from her eunuchs.
translation:
  language: zh_hans
  text: 那时，彭特弗里的妻子乘坐车舆[a]，以极大的排场下到孟斐斯，因为她从她的太监那里听说了我的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “车舆”：此处希腊文本以疑难符号标出，现有读法可指一种有篷或装饰华美的载人车舆；具体车型不能确定。
    reason: 对应正文“车舆”，提示 ἐν λαμπήνῃ 在底本中的文本疑难，同时避免将其不确定地限定为人抬轿子。
lexical_decisions:
- source_word: κατῆει
  choice: 下到
  rationale: 保留动词所表达的下行方向，同时使汉语句子自然。
- source_word: Μεμφίς
  choice: 孟斐斯
  rationale: 采用这一古埃及城市 Memphis 的通行中文译名。
- source_word: ἐν λαμπήνῃ
  choice: 乘着轿子
  rationale: λαμπήνη 指有篷或装饰华美的载人车舆；结合此处贵妇出行的语境，译为“轿子”便于现代读者理解，同时以脚注说明原文读法存疑。
- source_word: ἡ γυνὴ τοῦ Πεντεφρὶ
  choice: 彭特弗里的妻子
  rationale: 按现存希腊文音译专名 Πεντεφρί，不直接同化为其他传统名称。
- source_word: μετὰ δόξης πολλῆς
  choice: 带着极大的排场
  rationale: 此处 δόξα 表示出行时显赫、华贵的声势，而非神学语境中的“荣耀”；“排场”准确而自然。
- source_word: παρὰ τῶν εὐνούχων αὐτῆς
  choice: 从自己的太监那里
  rationale: 保留信息来源以及 αὐτῆς 所指的归属关系；εὐνοῦχοι 直译为“太监”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“下到”保留原文的空间方向；“带着极大的排场”表达贵妇出行的显赫声势，避免把 δόξα 神学化。
