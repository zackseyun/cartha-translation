  text: But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me.
translation:
  language: zh_hans
  text: 但主使我在那商人眼前蒙恩，他便把自己的家交托给我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν ἐν ὀφθαλμοῖς
  choice: 在……眼前蒙恩
  rationale: 保留希腊文带有闪语色彩的固定表达，同时在现代汉语中仍清楚、庄重。
- source_word: τοῦ μεταβόλου
  choice: 那商人
  rationale: 按上下文指先前所述的商人；加“那”自然承接特指冠词。
- source_word: ἐπίστευσέ μοι
  choice: 交托给我
  rationale: 表达因信任而托付管理的含义，并与宾语“自己的家”自然搭配。
- source_word: τὸν οἶκον αὐτοῦ
  choice: 自己的家
  rationale: οἶκος可指住宅、家业或全家事务；此处保留“家”的概括性，不将范围缩窄为“家业”或“家务”。
theological_decisions:
- issue: 恩惠的来源与商人的行动之间的关系
  choice: “主使我……蒙恩，他便……”
  alternative: “主赐我恩惠……并把……”
  rationale: 明确恩宠源自主，同时保留后一句以商人为主语的自然因果承接，不把商人的托付直接说成主的动作。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；“在……眼前蒙恩”略具经文语体，以贴合原文表达。
