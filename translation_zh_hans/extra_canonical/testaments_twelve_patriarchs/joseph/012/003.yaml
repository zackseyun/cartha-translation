- from: 他们中为首的对我说：“你不是奴仆，你的相貌也表明了这一点。”但我告诉他们，我确实是他们的奴仆。
  to: 他们中领头的对我说：“你不是奴隶，因为连你的相貌也显明了这一点。”但我告诉他们，我是他们的奴隶。
  rationale: 修订按所给希腊文本保留“他们的”所属关系，明确δοῦλος的身份含义，并以“连……也”表达καὶ的加强语气。删除“确实”，避免把原文未明示的强调加在约瑟身份陈述的真实性上。无需脚注。
  reviewer_model: gpt-5.6-terra
