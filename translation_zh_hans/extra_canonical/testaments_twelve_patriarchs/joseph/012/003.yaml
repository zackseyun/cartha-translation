  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/003.yaml
  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: zh_hans
  text: 他们中领头的对我说：“你不是奴隶，因为连你的相貌也显明了这一点。”但我告诉他们，我是他们的奴隶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: 他们中为首的
  rationale: 按语境指这一群人中地位最高或领头的人；这样译比字面的“较大的”自然，同时不过度限定具体职衔。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 保留受支配、非自由身份的含义；“奴仆”庄重且适合古代语境，也比单译“仆人”更充分体现 δοῦλος 的力度。
- source_word: ἡ ὄψις σου
  choice: 你的相貌
  rationale: ὄψις 在此指外表、容貌；“相貌”自然地表达对方从约瑟外在形象作出的判断。
- source_word: δηλοῖ
  choice: 表明了这一点
  rationale: 传达“使之明显、显示”的意思，并让中文引语完整自然。
- source_word: ὑπάρχω
  choice: 是
  rationale: 此处表示实际身份或处境，现代汉语用“是”最自然；其强调意味由“确实”体现。
theological_decisions:
- issue: 约瑟所称奴仆关系的对象
  choice: 他们的奴仆
  alternative: 奴仆
  rationale: 采用正文所见 αὐτῶν（以编辑符号标示的文本），保留明确的所属关系；这也与所给英译一致。
- issue: 后半句强调的表达
  choice: 我确实是他们的奴仆
  alternative: 我明白地告诉他们，我是他们的奴仆
  rationale: 希腊文本的变体标记涉及 λέγω/δηλοῖ 等措辞，语义重点可能落在说话方式或陈述真实性上。正文用“确实”自然传达强调，但不扩展成额外的神学主张。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。直接引语简洁自然；“奴仆”保留古代非自由身份的社会语义。由于本节无需脚注，正文未设置脚注标记。
