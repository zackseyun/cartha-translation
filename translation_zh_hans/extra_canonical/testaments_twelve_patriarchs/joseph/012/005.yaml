base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/005.yaml
  text: So it seemed good to all of them for me to remain in Egypt with the merchant of their trade until they should return bringing merchandise.
translation:
  language: zh_hans
  text: 于是，他们都认为，最好让我留在埃及，和替他们经商的商人一起，直到他们带着货物回来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξεν
  choice: 认为……最好
  rationale: 表达非人称结构“众人觉得这样合宜”，既保留共同决定的意味，又符合现代汉语习惯。
- source_word: τοῦ εἶναι με εἰς Αἴγυπτον
  choice: 让我留在埃及
  rationale: εἶναι 在此依上下文指继续身在埃及；译为“留在”比静态的“在”更清楚，也不额外加入主动遗弃之意。
- source_word: τὸν μετάβολον τῆς ἐμπορίας αὐτῶν
  choice: 替他们经商的商人
  rationale: μετάβολος 指商人或贩运者，属格短语说明此人与他们的贸易关系；此译避免生硬的“他们贸易的商人”。
- source_word: φέροντες ἐμπορίαν
  choice: 带着货物回来
  rationale: ἐμπορία 在此可指用于贸易的商品；结合分词 φέροντες，译作“带着货物”自然准确。
