base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/001.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: zh_hans
  text: 我和以实玛利人同行时，他们不断问我：“你是奴隶吗？”我回答说：“我是家里的奴隶。”免得使我的兄弟们蒙羞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος ... μετὰ τῶν Ἰσμαϊλιτῶν
  choice: 我跟着以实玛利人前行时
  rationale: 按上下文表达约瑟与以实玛利人同行而来；“跟着……前行”自然呈现其受他们带领的处境，同时不额外断定具体目的地。
- source_word: ἐπηρώτων
  choice: 一再问
  rationale: 未完成时态表示持续或反复发生的询问。
- source_word: Δοῦλος / δοῦλος
  choice: 奴隶
  rationale: δοῦλος在此涉及人的从属身份，译作“奴隶”比“仆人”更准确，也与约瑟被卖的叙事背景相符。
- source_word: δοῦλός εἰμι ἐξ οἴκου
  choice: 我是家生的奴隶
  rationale: ἐξ οἴκου字面为“出自家中/家里的”，在奴隶身份语境中可自然理解为家中出生或家属的奴隶；“家生的奴隶”简洁保留这一身份说明。
- source_word: ἵνα μὴ αἰσχύνω
  choice: 免得使……蒙羞
  rationale: 保留ἵνα所引目的，并以现代汉语自然表达使役含义。
theological_decisions:
- issue: 约瑟对自身身份的陈述是否构成明确的谎言
  choice: 按原文直译其自称为“家生的奴隶”，不加道德评断
  alternative: 解释为“家里的仆人”或补充说明其有意隐瞒
  rationale: 原文仅交代他这样回答是为免使兄弟蒙羞，并未在本节明说该陈述的道德性质；译文应保留这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一再问”传达希腊语未完成时态；引语与目的句分开，使叙事关系清晰。
