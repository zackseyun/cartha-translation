  source_fidelity: 译文整体准确传达了反复询问、奴隶身份和避免使兄弟蒙羞的目的。不过“跟着以实玛利人前行”比μετὰ（与……一起）更强地暗示约瑟跟随、受其带领；“家生的”则将ἐξ οἴκου具体化为出生于主人家中，原文更稳妥地只是说“家里的／属于家中的”。
  naturalness: 原译流畅、庄重。将目的分句直接接在回答之后，会使汉语句法关系更紧密清楚。
