  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: zh_hans
  text: 他们的首领对我说：“你不是奴仆，因为你的外表也说明了这一点。”但我对他们说，我是他们的奴仆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: 他们中为首的
  rationale: 字面为“他们中较大的／最大的”，在此指群体中的首领；译作“为首的”自然且不额外规定具体职位。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 保留受人支配、非自由身份的含义；比单纯“仆人”更贴近希腊词的社会身份色彩。
- source_word: ἡ ὄψις σου
  choice: 你的相貌
  rationale: ὄψις在此指外表、容貌；“相貌”符合对方从约瑟外观判断其身份的语境。
- source_word: δηλοῖ
  choice: 显明了
  rationale: 表达“使之清楚、表明”的意思，并保留原句直接判断的力度。
- source_word: ὑπάρχω
  choice: 是
  rationale: 此处与δοῦλος构成身份陈述，现代汉语用“是”最自然；“确实”承接原文ὅτι及版本中可能带强调意味的表达。
theological_decisions:
- issue: 约瑟关于奴仆身份的陈述是否带有特别强调
  choice: 我确实是他们的奴仆
  alternative: 我是他们的奴仆
  rationale: 希腊校勘文本在叙述动词及连词处有异文迹象，英语审校层译作“told them plainly”；正文以“确实”传达明确坚持，但不扩展为神学性自我贬抑。
- issue: “他们的”所指对象
  choice: 保留为“他们的奴仆”
  alternative: 译作“我主人的奴仆”或明确具体归属
  rationale: 原文αὐτῶν保留代词指向，语境中的先行对象可能需要上下文判定；不擅自消除其指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。引语简洁直接；“奴仆”统一呈现δοῦλος的身份含义。原文校勘符号显示若干异文，但所给资料未附异文具体读法，因此不设置无法准确说明的脚注。
