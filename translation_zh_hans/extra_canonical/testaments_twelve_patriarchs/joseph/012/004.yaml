base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/004.yaml
  text: And when we had come into Egypt, they disputed concerning me, as to who, after betraying me, would receive the gold.
translation:
  language: zh_hans
  text: 我们到了埃及以后，他们就为我的事争论：究竟谁出卖了我，谁就可以得到那笔金子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμάχοντο
  choice: 争论
  rationale: 该词在此表示激烈争执；“争论”自然清楚，也不夸大为肢体冲突。
- source_word: περὶ ἐμοῦ
  choice: 为我的事
  rationale: 表达他们围绕约瑟及其处置而争执，比生硬的“关于我”更符合现代汉语。
- source_word: προδοὺς
  choice: 出卖了
  rationale: 该分词本义涉及背叛、交出；在买卖约瑟的语境中，“出卖”兼有背叛与交易的意味。
- source_word: χρυσίον
  choice: 金子
  rationale: 明确保留原文所说的黄金，而不泛化为“钱”或“银子”。
- source_word: τίς ... λάβῃ
  choice: 究竟谁……谁就可以得到
  rationale: 以自然汉语呈现间接疑问，同时保留争执焦点是谁有权取得金子。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文对黄金归属的争执；不加入原文未提及的商人。希腊语结构对“谁出卖”与“谁得金子”的主语关系略显压缩，正文按最自然的同一主语理解呈现。
