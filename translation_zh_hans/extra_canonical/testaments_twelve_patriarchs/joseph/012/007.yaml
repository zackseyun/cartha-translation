  text: Καὶ εὐλόγησεν αὐτὸν *ὁ Θεὸς³² ἐν³³ χειρί μου, καὶ ἐπλήθυνεν *αὐτὸν ἐν χρυσίῳ καὶ ἀργυρίῳ³⁴ ⌜καὶ ἔργῳ³⁵⌝.
