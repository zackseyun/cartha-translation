  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/007.yaml
  text: And God blessed him in my hand, and increased him on my account in gold and silver and goods.
translation:
  language: zh_hans
  text: 上帝借我的手赐福给他，又使他在金、银和产业上增多了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”译自希腊词ἔργῳ，可指工作、事业、成果或经营所得；此处与金、银并列，故译作“产业”。本版希腊文将该词置于括号中，表示它的文本地位不完全确定。
    reason: 保留ἔργῳ在财富语境中的宽泛含义，并明确交代原文括号所显示的文本不确定性。
lexical_decisions:
- source_word: ἐν χειρί μου
  choice: 借我的手
  rationale: 保留单数“手”，并以自然汉语表达上帝通过约瑟的经手或管理赐福于那人。
- source_word: ἐπλήθυνεν αὐτόν
  choice: 使他的……都增多了
  rationale: 希腊语直译为“使他增多”，但其后列举金银等财物；汉语改以所属财产为增多的对象，语义更清楚自然。
- source_word: ἐν χρυσίῳ καὶ ἀργυρίῳ
  choice: 金银
  rationale: 简洁保留两种贵金属所代表的财富。
- source_word: ἔργῳ
  choice: 产业
  rationale: 该词本义可指工作、行为、成果或事业；在金银增长的财产语境中，“产业”能表达经营所得及财物，又不局限为单纯的“工作”。
theological_decisions:
- issue: 赐福的施行者与媒介
  choice: “上帝借我的手赐福给他”
  alternative: “上帝在我手中赐福给他”
  rationale: 明确上帝是赐福者，约瑟是施行赐福的媒介，同时避免不自然的汉语直译。
- issue: ἐν χειρί μου 与后句因果关系的区分
  choice: 前句译“借我的手”，后句译“因我的缘故”
  alternative: 两处都译作“借着我”
  rationale: 原文分别使用 ἐν χειρί μου 和可能表原因或关联的表达；译文保留“经手”与“因缘”之间的细微差别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“借我的手”符合当代汉语，也保留原文单数“手”的意象；“产业”与金银的物质财富语境协调。
