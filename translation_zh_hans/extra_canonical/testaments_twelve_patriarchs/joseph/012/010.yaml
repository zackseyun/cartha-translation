  text: And she said to her husband, “The merchant has grown rich through the hands of a certain young Hebrew; and they say that he also was stolen by theft from the land of Canaan.”
translation:
  language: zh_hans
  text: 她对丈夫说：“那商人借着一个希伯来青年的手发了财；又有人说，那青年也是从迦南地被人偷走的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: 商人
  rationale: 该词在此语境中指从事转卖、交易的人；译作“商人”符合上下文，也自然易懂。
- source_word: ἐπλούτησεν ... ἐν χερσίν
  choice: 靠着……的手发了财
  rationale: 保留希腊文“在/借……手中”的身体意象，同时用现代汉语“靠着……的手”表达因其经手或劳作而致富。
- source_word: τινος νέου Ἑβραίου
  choice: 一个希伯来青年
  rationale: τινος表示不特指的“某一个”，汉语用“一个”即可自然传达；νέου译为“青年”。
- source_word: λέγουσι
  choice: 有人说
  rationale: 希腊文为不定主语复数“他们说”；现代汉语以“有人说”自然表达传闻来源不明。
- source_word: καὶ ... κλοπῇ ἔκλεψαν αὐτόν
  choice: 那青年也是……被人偷走的
  rationale: καὶ译作“也”；κλοπῇ与ἔκλεψαν构成同根强调，汉语若硬译成“以偷窃偷走”极不自然，因此以明确的“被人偷走”传达行为及被动含义。
- source_word: ἐκ γῆς Χαναάν
  choice: 从迦南地
  rationale: 按通常地名表达直译，保留起点关系。
theological_decisions: []
