review_pass:
  verdict: revise
  source_fidelity: 第15节准确呈现了以性关系交换离弃偶像之承诺的条件结构，并保留“你主”的第二人称所有格；第13节按所给希腊正文译为“神”也是恰当的。不过，第11节“如同对圣洁之人”不宜改写成“把我当作圣洁的人”，应保留其奉承性的比较表达。第14节的“用求教的话”及“声称”略偏离“以教导/教训的话来到我这里，为要学习神的话”的表层说法。
  naturalness: 整体庄重、清楚，适合现代标准普通话。将第11节调整为“仿佛我是圣洁之人一般”，第14节调整为“借着求教的话来找我”，可同时提升忠实度与汉语自然性。第16节以“敬畏/敬奉”代替“敬拜”，较贴合σεβομένους的宽泛敬虔含义。
  terminology: “至高者”“主”“神”“自制”“诡计”“迷妄”等术语大体一致。第12节的σωφροσύνη在此处可译“贞洁自持”；所给希腊正文未含“床”的限定，不应加入。第16节“污秽”“通奸”“清洁的心”“无玷污的嘴唇”保留了伦理与礼仪性的对照。
  issues:
  - severity: medium
    issue: 第11节将“ὡς ἁγίῳ ἀνδρί”译为“把我当作圣洁的人”。
    rationale: 该短语修饰她奉承约瑟的方式，较自然且更贴近原文的是“仿佛我是圣洁之人一般（用话）奉承我”；“把我当作”稍微把比较性的阿谀转成了她对约瑟身份的认定。
  - severity: medium
    issue: 第14节“用求教的话来找我，声称想要学习”不够贴合λόγῳ κατηχήσεως及其不定式结构。
    rationale: 原文说她又开始以教导/教训的话来到约瑟这里，为要学习神的话。此处可自然译为“借着求教的话来找我，想学习神的话”；“声称”是叙述者可合理推知的评价，却不是原文明确说出的语义。
  - severity: low
    issue: 第16节“敬拜他的人”将σεβομένους收窄。
    rationale: σεβομένους指敬畏、敬奉或虔敬地事奉神者，不专指礼拜行为；“敬畏他的人”在本句更宽泛而合适。
