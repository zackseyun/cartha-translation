  text: '9[a]. And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I recognized her deceit and her delusion.

    10. And I spoke to her words of the Most High, to see whether perhaps she might turn back from her evil desire.

    11. So then, many times[b], as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.

    12. For she openly extolled me as chaste with respect to the bed, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded concerning your purity, and even if someone should tell him about us, he will not believe it.”

    13. In all these things I, lying low on the ground, kept begging the God of my fathers that he would rescue me from her deceit.

    14. Since she accomplished nothing in this way, again she began to come to me with words of instruction, wanting to learn the word of God.

    15. And she says to me, “If you want me to leave behind the idols, I will persuade my husband to withdraw from them, and we will go before your Lord, walking in the law of your Lord.”

    16. But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”

    17. But she kept contending, wanting to fulfill her desire.

    18. And I added fasting and prayer[d][c], so that the Lord might rescue me from her.'
translation:
  language: zh_hans
  text: '9. 我明白她的用意后，便悲痛欲绝。她出去以后，我才回过神来[a]；我因她哀伤了许多天，因为我看清了她的诡计和迷妄。


    10. 我又把至高者的话告诉她，看她或许会回转，离开那邪恶的欲望。


    11. 她常常用话奉承我，仿佛我是圣洁之人一般；又心怀诡诈，在她丈夫面前称赞我的自制，想趁我们独处时使我跌倒。


    12. 她在人前称赞我是贞洁自持的人，暗地里却对我说：“不要怕我丈夫；他深信你是贞洁的。即使有人把我们的事告诉他，他也不会相信。”


    13. 在这一切事上，我伏身于地[b]，不断祈求神救我脱离她的诡计。


    14. 她见这样也不能得逞，就又开始借着求教的话来找我，想学习神的话。


    15. 她对我说：“如果你愿意与我同寝，我就离弃偶像；我也会劝我丈夫远离偶像，我们便一同行在你主面前。”[c]


    16. 我却对她说：“主不愿敬畏他的人陷在污秽中，也不喜悦通奸的人；他所喜悦的，是怀着清洁的心、以无玷污的嘴唇亲近他的人。”[d]


    17. 她却仍与我争辩，一心想满足自己的欲望。


    18. 于是我更加禁食祷告，求主救我脱离她。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回过神来”直译为“回到自己”，也可理解为“恢复清醒”。
    reason: lexical_alternative
  - marker: b
    text: 此处希腊词较罕见，指贴近地面躺卧或俯伏的姿势；确切姿态不能完全确定。
    reason: lexical_alternative
  - marker: c
    text: 所据希腊正文作“我们便行在你主面前”。有些传本传统可能在此有较长的扩展语句，但本译文不将未见于所给正文的内容纳入正文。
    reason: textual_variant
  - marker: d
    text: 本节末“而是……亲近他的人”在所据版本中以编辑符号标示，显示其文本传承可能存在差异；本译文按所给希腊正文译出。
    reason: textual_variant
lexical_decisions:
- source_word: ἐλυπήθην ἕως θανάτου
  choice: 悲痛欲绝
  rationale: 保留“直到死”的强烈程度，同时使用现代汉语中庄重而自然的成语表达。
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: 回过神来
  rationale: 准确传达希腊语“回到自己、恢复清醒”的习语意义，不将其具体化为悔改或身体康复。
- source_word: δόλος / πλάνη
  choice: 诡计 / 迷妄
  rationale: 分别保留蓄意欺骗与受欲望支配而偏离正道这两层不同的道德含义。
- source_word: ῥήματα ὑψίστου
  choice: 至高者的话
  rationale: 按属格的自然理解，指来自或属于至高者的话，而非仅仅谈论至高者的话。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 上下文已清楚表明其性意味和邪恶性质；采用较宽的对应词，避免把原词的语义范围收窄为单一术语。
- source_word: σωφροσύνη / σώφρονα
  choice: 自制 / 贞洁自持
  rationale: 前者保留德性词的广度，后者结合具体语境自然呈现性方面的节制；不从咨询译文引入本段所列希腊正文没有的“床”意象。
- source_word: ὑποσκελίσαι
  choice: 使我跌倒
  rationale: 保留原词使人绊倒、倾覆的比喻，也符合道德试探的语境。
- source_word: χαμοκοιτῶν
  choice: 伏身于地
  rationale: 这个罕见词表示贴近地面的卑微姿势；译文呈现身体动作，但不武断限定为俯卧或面朝下。
- source_word: λόγῳ κατηχήσεως
  choice: 用求教的话
  rationale: 传达接受教导、学习的表面意图，避免使用带后世教会制度色彩的“慕道教理”等术语。
- source_word: συγγενοῦς μοι
  choice: 与我同寝
  rationale: 此处动词在上下文中是直接的性邀约；“同寝”既清楚又符合庄重叙事语体。
- source_word: πορευσόμεθα ἐνώπιον Κυρίου σου
  choice: 我们便一同行在你主面前
  rationale: 保留“行走”及第二人称所有格“你的主”，不将其同化为较常见的宗教表达。
- source_word: προσετιθέμην νηστείαν καὶ προσευχήν
  choice: 更加禁食祷告
  rationale: 自然表达约瑟在原有抵抗上进一步加上禁食和祷告，且不误解为只把禁食加在祷告之上。
theological_decisions:
- issue: 第13节祈求对象的称谓
  choice: 神
  alternative: 我列祖的神
  rationale: 用户提供的希腊正文明确为 τοῦ Θεοῦ，没有“我列祖的”一语；遵从原文证据，不按咨询层的推测性扩充进入正文。
- issue: 第15节 Κυρίου σου 的人称
  choice: 你主
  alternative: 主；你的神
  rationale: 希腊语保留第二人称所有格，反映说话者与约瑟信仰之间的距离；译文保留这一张力。
- issue: 第15节偶像崇拜与性条件的关系
  choice: 直译为以同寝换取离弃偶像
  alternative: 弱化为“顺从我”或解释为真诚归信
  rationale: 原文有意展示她以宗教承诺操纵约瑟；译文不美化其动机，也不把承诺视为已经发生的归信。
- issue: 第16节神所喜悦者的句法
  choice: 他所喜悦的是……亲近他的人
  alternative: 仅译为神不喜悦通奸者
  rationale: 保留原文否定与肯定的对照：不仅拒绝污秽和通奸，也肯定以清洁的心和无玷污的嘴唇亲近神的人。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体，句式清楚，适合普通读者朗读。神学与伦理术语避免宗派化；“至高者”“主”“神”分别依原文称谓保留。连续节号9—18沿用所提供的出版单元编号，虽然希腊来源标明9—10承接第三章、其后内容属于第四章。
