base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018.yaml
  text: '1. If, then, you also walk in the commandments of the Lord, God will exalt you in good things forever.

    2. And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.

    3. For see, you yourselves know that through my humility and my long-suffering I took as my wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.

    4. Even so'
translation:
  language: zh_hans
  text: '《约瑟遗训》第18章


    1 所以，你们若也遵行主的诫命，上帝就必永远在各样美善中高举你们。[a]


    2 若有人想加害你们，你们却要以善行待他，并为他祷告；这样，主就必救你们脱离一切恶事。


    3 你们看：因着我的谦卑和忍耐，我娶了希利奥波利斯祭司的女儿为妻；随她一同赐给我的，还有一百他连得金子。[b]我的主又使他们受我辖制。[c]


    4 他还赐我俊美，胜过以色列中俊美的人；又保守我直到年老，仍有力量，仍然俊美。因为我在各方面都像雅各。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在各样美善中”也可理解为“在各样美好的事上”或“在福乐中”；原文没有限定所指的是物质、地位还是属灵福分。
    reason: 说明ἐν ἀγαθοῖς的语义开放性。
  - marker: b
    text: “他连得”是古代的重量或货币单位；具体重量因时代和地区而异。
    reason: 帮助现代读者理解古代计量单位，同时避免不可靠的现代金额换算。
  - marker: c
    text: “他们”所指不很明确。希腊文使用阳性复数代词，可能指前文相关的人，却不能直接与“女儿”或“金子”的语法性数完全对应。
    reason: 保留原文代词指向的真实歧义，不擅自指定对象。
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: 遵行……诫命
  rationale: 字面为“行在诫命中”；现代汉语以“遵行诫命”自然表达持续按诫命生活的含义。
- source_word: ἐν ἀγαθοῖς
  choice: 在美善之中
  rationale: 保留介词结构及复数形容词名词化的宽泛意义，不将其限定为物质财富、福分或善行。
- source_word: τῇ ἀγαθοεργείᾳ
  choice: 以善行待他
  rationale: 表达“借着行善”的工具或方式含义，并在汉语中清楚呈现以善回应加害者。
- source_word: μακροθυμία
  choice: 忍耐
  rationale: 此处指长期承受而不报复；“忍耐”比“恒忍”更符合现代普通读者的表达习惯。
- source_word: τάλαντα χρυσίου
  choice: 他连得金子
  rationale: 保留古代重量或货币单位“他连得”，不以未经文本规定的现代金额换算代替。
- source_word: κατεδούλωσεν
  choice: 使……服在我权下
  rationale: 原词有使人受奴役、使之臣服之意；此译保留强烈的支配含义，同时适合上下文。
- source_word: ὡραιότητα / κάλλει
  choice: 俊美／俊美
  rationale: 两词均涉及外貌之美；按约瑟为男性的语境用“俊美”，避免带入额外的道德含义。
theological_decisions:
- issue: 谦卑、忍耐与约瑟所得尊荣之间的因果关系
  choice: 译作“因着我的谦卑和忍耐”
  alternative: 弱化为“在我谦卑和忍耐的时候”
  rationale: διά加宾格明确表达原因；译文保留原文的因果陈述，不另行解释其功德论或恩典论含义。
- issue: 第1节上帝使人升高的领域或方式
  choice: “使你们永远在美善之中升高”
  alternative: “永远以福分高举你们”
  rationale: 原文ἐν ἀγαθοῖς含义宽泛；选择不把“美善”具体化为财富、地位或属灵福分。
- issue: 神称谓的区分
  choice: θεός译“上帝”，Κύριος译“主”，Κύριός μου译“我的主”
  alternative: 一律译为“上帝”或将Κύριος专名化
  rationale: 保留原文称谓变化，不在缺乏依据时把“主”解释为特定专名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与劝诫语体。人名、地名和古代单位使用常见音译；句式适度拆分以符合现代汉语阅读习惯。第4节按现存希腊文完整翻译，不沿用所给英文咨询层在“Even so”处的截断。
