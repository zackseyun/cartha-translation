base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007.yaml
  text: '1[a]. I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”


    2. Then my father said to me[b], “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”


    3. And weeping he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, the one who fathered you.”


    4. So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold[c], yet I was afraid of my brothers.'
translation:
  language: zh_hans
  text: '1. 我把这两个梦告诉了父亲。他对我说：“这些事必在各自所定的时候[a]应验，那时以色列已经忍受了许多苦难。”


    2. 随后，我父亲对我说：“我相信上帝：约瑟还活着；因为我总是看见，主把他算在我们中间[b]。”


    3. 他流着泪说：“哀哉，我的孩子约瑟！你还活着，我却见不到你；你也见不到生你的雅各。”


    4. 他这番话也使我落泪。我五内如焚[c]，想告诉他约瑟已经被卖了，却又害怕我的兄弟们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所定的时候”也可译作“各自的时节”。希腊文 καιροί 可指合宜或指定的时机。
    reason: lexical_alternative
  - marker: b
    text: “把他算在我们中间”也可译作“把他列在我们当中”或“认为他与我们同在”。
    reason: lexical_alternative
  - marker: c
    text: “五内如焚”对应希腊文“内脏中燃烧”的强烈身体性表达，形容内心极其煎熬、迫切。
    reason: cultural_note
lexical_decisions:
- source_word: ἐνύπνια
  choice: 梦
  rationale: 采用该词在此处最普通的含义；上下文没有要求译作较为庄严的“异象”或“梦中异象”。
- source_word: δεῖ ... πληρωθῆναι
  choice: 必……应验
  rationale: “必”保留 δεῖ 所表达的必然性，“应验”保留 πληρωθῆναι 的成全、实现色彩，符合梦兆和遗训文学的语境。
- source_word: καιροὺς
  choice: 所定的时候
  rationale: καιρός 不只是一般的时间，也可指合宜或指定的时机；“所定的时候”自然地保留这一层含义，而不明确指定是谁所定。
- source_word: ὑπομείναντος
  choice: 已经忍受
  rationale: 保留忍耐承受艰难的核心语义，不增添原文没有明说的方式或结果。
- source_word: πιστεύω τῷ θεῷ
  choice: 我相信上帝
  rationale: 与格结构着重相信、信赖上帝，而非仅仅陈述上帝存在；后接“约瑟还活着”，保留希腊文略显紧缩的表达。
- source_word: ἀριθμεῖ
  choice: 算在……中间
  rationale: 保留“数算、列入”的比喻，也保留约瑟被视为仍与家人同在这一表述中的含混性。
- source_word: Οἴμοι
  choice: 哀哉
  rationale: 保留哀叹语气和遗训文学的庄重感，同时仍为现代读者所能理解。
- source_word: γεννήσαντά
  choice: 生你的
  rationale: 直接保留“使你出生、生育你”的父系表达，避免将其仅释为一般亲属称谓。
- source_word: ἐκαιόμην τοῖς σπλάγχνοις
  choice: 我五内如焚
  rationale: 以自然而庄重的汉语成语传达“内脏中燃烧”的强烈身体性意象，没有把它弱化为一般的难过或焦急。
- source_word: πέπραται
  choice: 已经被卖了
  rationale: 完成时被动形式表明出售已经发生且结果持续；上下文明确主语是约瑟。
theological_decisions:
- issue: 雅各话语中的预定性与应验
  choice: 这些事必在各自所定的时候应验
  alternative: 这些事必在各自的时节发生
  rationale: 译文同时保留必然性、应验语言和 καιρός 的合宜时机含义，但不进一步说明这些时候如何被设定，以免将经文系统化。
- issue: 主将约瑟“算在我们中间”的含义
  choice: 主把他算在我们中间
  alternative: 主把他列在我们当中；主认为他仍与我们同在
  rationale: 直译保留数算的隐喻，也不武断判定这句话是在描述异象、家族归属，还是约瑟仍在世的确据。
- issue: “以色列”所指的范围
  choice: 以色列
  alternative: 以色列人；雅各
  rationale: 原文使用 Ἰσραήλ，既可能使人想到雅各本人，也可能指其后裔群体；译作专名“以色列”保留这一张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“哀哉”保留哀歌式语气；“五内如焚”以通行汉语成语再现希腊文的内脏意象。句法总体自然化，但在“我相信上帝：约瑟还活着”和“算在我们中间”等处保留原文的紧缩与含混。所有脚注标记均置于相关正文表达之后。
