  text: VII. Ταῦτα¹ τὰ δύο ἐνύπνια εἶπον² τῷ πατρί μου³ καὶ⁴ εἶπέ μοι· Δεῖ *ταῦτα πληρωθῆναι⁵ κατὰ *τοὺς καιροὺς⁶ αὐτῶν, *πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος⁷. 2. Τότε⁸ λέγει μοι ὁ πατήρ μου· Πιστεύω⁹ *τῷ θεῷ¹⁰ ὅτι ζῇ¹¹ Ἰωσήφ¹²· ὁρῶ γὰρ ⌜πάντοτε⌝¹³ ὅτι Κύριος ἀριθμεῖ¹⁴ αὐτὸν μεθʼ ἡμῶν. 3. Καὶ κλαίων ἔλεγε¹⁵· *Οἴμοι, τέκνον μου Ἰωσήφ, ζῇς¹⁶, καὶ *οὐ βλέπω σε¹⁷, *καὶ σὺ οὐχ¹⁸ ὁρᾷς Ἰακὼβ τὸν γεννήσαντά σε. 4. *Ἐποίησε οὖν καὶ ἐμὲ δακρῦσαι¹⁹ ἐν²⁰ τοῖς λόγοις τούτοις²¹. *Ἐγὼ δὲ²² *ἐκαιόμην τοῖς σπλάγχνοις²³ μου²⁴ ἀναγγεῖλαι²⁵ ὅτι πέπραται²⁶ ⌜Ἰωσήφ⌝²⁷· *ἀλλʼ ἐφοβούμην²⁸ τοὺς ἀδελφούς μου²⁹.
