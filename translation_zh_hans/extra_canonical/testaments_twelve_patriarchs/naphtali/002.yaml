- from: '《拿弗他利遗训》第2章


    1. 我脚步轻快，如同母鹿；父亲雅各便派我去传递各样消息，并且给我祝福，说我像母鹿一样。[a]


    2. 陶匠知道器皿能容纳多少，就按其容量取来泥土；照样，主按着灵的形态造身体，又按着身体的能力把灵安置其中。


    3. 二者之间丝毫不差，连一根头发的三分之一也不差；因为一切受造之物，都是按重量、尺度和准则造成的。


    4. 陶匠知道每件器皿有何用途、能胜任多少；照样，主也知道身体能在善中维持多久，又会在什么时候进入恶中。


    5. 没有任何受造之物，也没有任何意念，是主不知道的；因为他照着自己的形象创造了每一个人。


    6. 一个人的能力怎样，他的言语也怎样——或在主的律法中，或在彼列的律法中。[d]


    7. 光与黑暗之间、视觉与听觉之间怎样有所分别，人与人之间、女人与女人之间也照样有所分别；但不能说，在这些面貌中，一个就比另一个低劣。[b]


    8. 因为上帝按秩序把万物造得美好：他把五种感官安置在头上，把颈项接在头上，又加上头发，使人美观而有荣耀；他使心用来领悟，腹部用来排泄，胃用来研磨，气管用来维持健康，肝用来发怒，胆用来感受苦涩，脾用来欢笑，肾用来谋算，腰肌用来发力，肋侧用来睡卧，腰用来强健，其余各部分也是如此。[c]


    9. 所以，我的孩子们，你们一切的行为也都要在敬畏上帝中井然有序，趋向良善；不可心存轻蔑，行事混乱，也不可不合时宜。


    10. 你若对眼睛说：“听吧！”它做不到；照样，你们身处黑暗，也不能行光明的事。'
  to: '《拿弗他利遗训》第2章


    1. 我脚步轻快，如同母鹿；父亲雅各派我去传递各样消息，并给我祝福，说我像母鹿一样。[a]


    2. 陶匠知道器皿能容纳多少，就按其容量取来泥土；照样，主按着灵的形态造身体，又按着身体的能力把灵安置其中。


    3. 其中毫无缺欠，连一根头发的三分之一也不差；因为一切受造之物都是按重量、尺度和准则造成的。


    4. 陶匠知道每件器皿有何用途、能胜任多少；照样，主也知道身体能在善中维持多久，又会在什么时候进入恶中。


    5. 没有任何受造之物，也没有任何意念，是主不知道的；因为他照着自己的形象创造了人。


