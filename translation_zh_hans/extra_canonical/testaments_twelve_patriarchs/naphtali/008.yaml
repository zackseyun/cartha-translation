  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008.yaml
  text: '1[a]. And behold, my children, I have shown you the times, that all these things will happen in Israel.

    2. And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.

    3. Through his scepter God will appear on the earth, dwelling among men[b], to save the race of Israel, and he will gather the righteous from among the nations.

    4. Therefore, if you also do what is good, men and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.

    5. As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.

    6. But the one who does not do what is good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.

    7. For the commandments of the law are twofold, and they are fulfilled with skill.

    8. For there is a time for a man''s coming together with a woman, and a time for restraint for his prayer.

    9. And both are from God, and if they do not take place in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.

    10. Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter[d][c], so that the Lord may love you.'
translation:
  language: zh_hans
  text: '《拿弗他利遗训》第8章


    1. 看哪，我的孩子们，我已经把末后的时期指示给你们；这一切事都必发生在以色列中。


    2. 所以，你们也要吩咐自己的儿女，使他们与利未和犹大联合。因为救恩必借着犹大为以色列兴起，雅各也必在他里面蒙福。[a]


    3. 上帝必借着他的权杖显现在地上，住在人中间，[b]为要拯救以色列的族类；他也必从列国中聚集义人。


    4. 所以，你们若也行善，世人和天使就必祝福你们；上帝必因你们在列国中得荣耀，魔鬼必逃离你们，野兽必惧怕你们，主必爱你们，天使也必扶助你们。


    5. 正如人若把孩子养育得好，就会对这个孩子留有美好的回忆；同样，善行在上帝面前也有美好的记念。


    6. 但不行善的人，天使和世人都必咒诅他；上帝必因他在列国中受羞辱，魔鬼必把他据为己有，当作自己的器皿；一切野兽都必辖制他，主也必憎恶他。


    7. 因为律法的诫命有两面，必须有智慧地加以遵行。


    8. 与女人同房有其时候，[c]为祷告而节制也有其时候。[d]


    9. 这两者都出于上帝；若不按各自应有的次序进行，就会使人犯极重的罪。其余的诫命也是如此。


    10. 所以，我的孩子们，你们要在上帝里面有智慧，也要明辨事理，看清他诫命的次序和每一件事的定规，好让主爱你们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着犹大”和“借着他的权杖”带有王权与救恩意象，可以作弥赛亚式理解；译文没有把希腊文本限定为更狭窄的教义解释。
    reason: cross_reference
  - marker: b
    text: 有些文本见证在第3节“上帝必显现在地上，住在人中间”一语附近有增文或异文。正文依所提供希腊见证的较长读法；“住在人中间”也可按字面理解为“住在人里面”。
    reason: textual_variant
  - marker: c
    text: “与女人同房”是对希腊文所指男女结合的端庄表达。
    reason: cultural_note
  - marker: d
    text: “节制”也可译作“禁欲”；这里指为了祷告，在适当的时候克制性行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: καιροὺς ἐσχάτους
  choice: 末后的时期
  rationale: 保留 καιρός 所指具有意义或指定的时期，并直译 ἐσχάτους 的末世性，不将其弱化为一般时间。
- source_word: ἑνοῦνται
  choice: 与……联合
  rationale: 表达与利未和犹大结为一体、保持团结的劝诫，同时不额外界定这种联合的制度形式。
- source_word: σωτηρία
  choice: 救恩
  rationale: 保留该词的神学分量，也容纳拯救、解救的较广含义。
- source_word: σκήπτρου
  choice: 权杖
  rationale: 保留具体的王权和王朝意象，不抽象化为“统治”。
- source_word: ὀφθήσεται
  choice: 显现
  rationale: 体现可被看见、显明的启示意味，同时不加入希腊文本没有明说的后期教义术语。
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: 住在人中间
  rationale: 按上下文自然表达上帝临在人类中间；同时以脚注说明也可从字面理解为“住在人里面”。
- source_word: ἐπισυνάξει
  choice: 聚集
  rationale: 直接表达把列国中的义人召集到一起。
- source_word: τὸ καλόν
  choice: 行善
  rationale: 在劝诫语境中自然表达“实行美善之事”，并保持其道德行动含义。
- source_word: ἀνθέξονται ὑμῶν
  choice: 扶助你们
  rationale: ἀντέχομαι 可指扶持、支持或紧紧依附；“扶助”适合本节保护性的平行结构。
- source_word: μετὰ τέχνης
  choice: 有智慧地
  rationale: 此处表示遵行诫命需要技巧、明辨和合宜运用；“有智慧地”比机械的“凭技术”更符合现代汉语语境。
- source_word: συνουσίας γυναικός
  choice: 与女人同房
  rationale: 准确而端庄地表达与女人发生性结合。
- source_word: ἐγκρατείας
  choice: 节制
  rationale: 保留自我克制之义；在本句中指为了祷告于适当时候禁欲。
- source_word: θεσμοὺς παντὸς πράγματος
  choice: 每一件事的定规
  rationale: 保留 θεσμός 的规制、定例含义以及属格结构，不把它仅限于仪式法规。
theological_decisions:
- issue: 第2—3节以犹大和权杖为中心的王权与救恩语言
  choice: 直接译出救恩借犹大兴起、上帝借他的权杖显现在地上的表述
  alternative: 仅按政治王朝盼望解释，或因可能的后期扩展而弱化经文
  rationale: 现有希腊见证明确包含强烈的王权和救恩意象。译文保留其可作弥赛亚式理解的张力，却不在正文中强行限定为某一种教义解释。
- issue: 第3节 κατοικῶν ἐν ἀνθρώποις 的文本与语义
  choice: 正文译作“住在人中间”，并注明文本见证和语义上的复杂性
  alternative: 译作“住在人里面”，或因疑为扩展而删去
  rationale: 在本句中，“在人中间居住”是自然读法；但该短语存在文本复杂性，且介词短语可有不同理解，因此以脚注保持透明。
- issue: 第7—9节婚姻结合、节制与祷告的伦理教导
  choice: 具体译出同房有其时候，为祷告而节制也有其时候
  alternative: 概括为一般性的适度原则，或限定为希腊文没有明说的礼仪洁净制度
  rationale: 希腊文用具体例子说明两种行为都需依照上帝所定的秩序；译文保留具体性而不加以系统化。
- issue: 第6节“主必憎恶他”的强烈措辞
  choice: 照译为“主也必憎恶他”
  alternative: 缓和为“主必不喜悦他”
  rationale: μισήσει 的措辞强烈；为保留原文的伦理警告和神学张力，不在翻译中擅自弱化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“救恩、权杖、显现、义人、诫命”等具有文本和神学分量的词语；对性结合使用端庄而清楚的“同房”。长句按现代汉语节奏分号处理，但不消除原文的平行结构、强烈伦理对比或神学张力。
