  text: '1. So then, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls. For if, in purity of heart, you keep silence, you will understand how to hold fast the will of God and to cast away the will of Beliar.


    2. The sun and the moon and the stars do not alter their appointed order; so you also must not alter the law of God through the disorder of your deeds.


    3. The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.


    4. But you, my children, must not be so. Rather, know in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.


    5. In the same way also the Watchers changed the order of their nature, and the Lord cursed them at the time of the flood; because of them he made the earth desolate and without fruit.'
translation:
  language: zh_hans
  text: '1 所以，不要因贪婪而急于败坏自己的行为，也不要用空洞的话欺骗自己的灵魂。你们若存清洁的心并保持静默，就会明白怎样持守上帝的旨意，摒弃彼列的意愿。


    2 太阳、月亮和众星都不扰乱各自的秩序[a]；同样，你们也不可因自己行为上的混乱而改变上帝的律法。


    3 列国迷失了方向，离弃了主，改变了自己的秩序；他们听从木头、石头和迷惑人的灵。


    4 但你们不可这样，我的孩子们！你们要从穹苍、地上、海中以及一切受造之物中，认识那位创造万有的主，免得你们变得像所多玛一样；所多玛改变了自身本性的秩序。


    5 同样，那些守望者也改变了自身本性的秩序。主在洪水时期咒诅了他们；因为他们，主使大地荒无人烟[b]，不能结果。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不扰乱”所据希腊词在现存文本中直译为“遮蔽”，与上下文较难协调；这里按本节反复出现的“改变秩序”这一对照关系译出。
    reason: 原文以 † 标示 καλύψουσι 为疑难读法；主文需可理解，同时必须向读者公开文本上的不确定性。
  - marker: b
    text: 本句末尾的希腊文本和句法不稳定；“荒无人烟”所对应的词在所据版本中以方括号标出。全句也可理解为“大地不再适于居住，并且不能结果”。
    reason: 保留版本对 ἀοίκητον 的编辑性标示以及末句结构的真实不确定性，避免把重建后的意义呈现为毫无疑问。
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: 贪婪
  rationale: 保留该词贪得无厌、图谋多取的核心意义，并使其与败坏行为的结果自然衔接。
- source_word: λόγοις κενοῖς
  choice: 空洞的话
  rationale: 直译其“空、无实质”的含义，不额外限定为谎言或虚假教训。
- source_word: καθαρότητι καρδίας
  choice: 清洁的心
  rationale: 采用自然而庄重的汉语，保留古代宗教语境中内在纯洁的意象。
- source_word: κρατεῖν
  choice: 持守
  rationale: 表达牢牢把握、坚持遵行的意味，不把它弱化为仅仅知道。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用现代中文圣经读者较熟悉的名称，同时保留其作为与上帝旨意相对立者的专名性质。
- source_word: τάξιν
  choice: 秩序
  rationale: 全章重复使用同一译词，以呈现天体、列国、所多玛和守望者之间有意构成的主题联系。
- source_word: στερεώματι
  choice: 穹苍
  rationale: 保留古代宇宙观用语及其庄重色彩，不以现代科学术语替代。
- source_word: Ἐγρήγοροι
  choice: 守望者
  rationale: 这是相关犹太启示文学传统中对该类天上存在的通行称呼；不泛化为普通的天使。
- source_word: πνεύμασι πλάνης
  choice: 迷惑人的灵
  rationale: 兼顾“迷误/欺骗”的属格表达，使汉语明确而不强行判定其究竟是性质属格还是来源属格。
theological_decisions:
- issue: 静默与明白上帝旨意之间的语法关系
  choice: 译作条件关系：“若……就……”
  alternative: 译作方式或原因关系：“借着保持静默……”
  rationale: 希腊语分词 σιωπῶντες 可承载情境、方式或条件色彩；此处依上下文采用自然的条件表达，但不把静默描述为自动获得启示的固定机制。
- issue: “彼列的意愿”的主体性
  choice: 保留“彼列”这一专名及其与上帝旨意的直接对照
  alternative: 意译为“邪恶的意愿”或“魔鬼的旨意”
  rationale: 原文明确使用 Βελίαρ；保留专名可避免把本段的古代思想背景替换成后来的体系化称谓。
- issue: 所多玛改变“本性的秩序”
  choice: 按原文保留概括而有张力的说法
  alternative: 明确解释为某一种具体罪行或性伦理判断
  rationale: 本节没有具体说明所指行为；译文不导入宗派性或解释者私见。
- issue: 守望者的身份
  choice: 使用文学传统称号“守望者”
  alternative: 直接译作“堕落天使”
  rationale: 原文只给出 Ἐγρήγοροι 这一称号；“堕落天使”虽可能反映传统理解，却增加了本句未明说的神学判断。
- issue: 洪水与大地荒芜之间的施事者
  choice: 补明“主使大地……”
  alternative: 保持残缺句式，或以守望者为施事者
  rationale: 希腊语末句传本/句法不稳，但 τάξας 最自然地承接“主”为施事者；补明主语能形成可读汉语，同时脚注提示文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙诫体。以“我的孩子们”保留父辈遗训的亲切语气；“穹苍”“彼列”“守望者”保留作品的古代宗教文学背景。全章统一译出“秩序”，突出原文贯穿各节的修辞链条；对疑难读法不在正文中制造生硬句子，而以脚注公开说明。
