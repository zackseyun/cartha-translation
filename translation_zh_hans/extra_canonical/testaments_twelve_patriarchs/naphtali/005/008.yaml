  text: 8. Καὶ εἶδον *ὅτι ἤμην παρεκεῖ⁴¹, καὶ ἰδοὺ γραφὴ *ἁγία ὤφθη ἡμῖν⁴², λέγουσα⁴³· Ἀσσύριοι⁴⁴, Μῆδοι⁴⁵, Πέρσαι⁴⁶, Χαλδαῖοι⁴⁷, Σύροι⁴⁸, κληρονομήσουσιν αἰχμαλωσίαν⁴⁹ τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/008.yaml
  text: And I saw that I was there, and behold, a holy writing appeared to us, saying, “Assyrians, Medes, Persians, Chaldeans, Syrians shall inherit in captivity the twelve sceptres of Israel.”
translation:
  language: zh_hans
  text: 我看见自己在那里。看哪，有一份圣书向我们显现，上面说：“亚述人、米底人、波斯人、迦勒底人和叙利亚人，必在被掳之中承受以色列的十二根权杖。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希腊文的结构较为生硬：‘被掳’和‘以色列的十二根权杖’都与‘承受’相连。可按正文理解为‘在被掳之中承受’，也可能指这些列国将取得以色列被掳的命运及其十二根权杖。‘十二根权杖’可能象征以色列十二支派或其权柄。
    reason: 说明原文中‘承受’、‘被掳’和‘十二根权杖’的真实句法与意义歧义，避免将权杖意象或列国所得的对象作单一解释。
lexical_decisions:
- source_word: παρεκεῖ
  choice: 也在那里
  rationale: 依上下文和英译所反映的读法，表达说话者看见自己身处该处；“也”自然传达该词可能含有的伴随意味，不过原词形或文本本身较为罕见。
- source_word: γραφὴ ἁγία
  choice: 一卷圣书
  rationale: 保留“神圣的书写／文书”之意，并以现代汉语中适合可显现、可发言之书面启示的表达呈现，不具体认定为某部正典。
- source_word: ὤφθη ἡμῖν
  choice: 向我们显现
  rationale: 忠实表达被动形式“被我们看见／向我们显现”，并保留异象语境。
- source_word: κληρονομήσουσιν
  choice: 承受
  rationale: 保留“继承、取得为业”的核心语义及其反常张力，不弱化为普通的“占领”。
- source_word: τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ
  choice: 以色列的十二根权杖
  rationale: 直译权杖意象，不在正文中直接释作十二支派，以免消除原文的象征表达。
theological_decisions:
- issue: “十二根权杖”与以色列十二支派的关系
  choice: 正文保留“十二根权杖”
  alternative: 译作“以色列十二支派”
  rationale: 原文明确使用“权杖”，可能象征十二支派或其统治权；直译可保存象征与解释空间。
- issue: 列国“承受”以色列权杖的含义
  choice: 保留“承受”及“在被掳之中”的紧张表述
  alternative: 解释性译为“掳走并占有以色列十二支派”
  rationale: 希腊文双宾语式结构语义生硬，可能涉及列国取得被掳的以色列，也可能强调以色列权柄落入列国手中；正文不替原文作单一裁决。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留异象叙事的提示语气；列国名称使用现代中文圣经及历史书写中通行的译名。正文保持原文简短、预言性的节奏，并以脚注处理难解句法。
