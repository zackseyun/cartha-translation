base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/003.yaml
  text: And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.
translation:
  language: zh_hans
  text: 我们大家一同奔跑；利未抓住了太阳，犹大抢先抓住了月亮；他们二人也和日月一同被举了起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδράμομεν πάντες ὁμοῦ
  choice: 我们便一同奔跑
  rationale: 保留第一人称复数及“众人一起”的意思；“奔跑”自然传达不定过去时所叙述的动作。
- source_word: ἐκράτησε τὸν ἥλιον
  choice: 抓住了太阳
  rationale: ἐκράτησε在此指实际抓住、掌握；“抓住”符合异象叙事的具体意象。
- source_word: φθάσας
  choice: 抢先
  rationale: 该分词在此表达先于他人到达并采取行动；“抢先”简洁保留其相对先行之意，而不额外指定到达何处。
- source_word: ἔπιασε τὴν σελήνην
  choice: 抓住了月亮
  rationale: ἔπιασε指抓取、握住；与利未抓住太阳的平行动作采用同样自然的中文表达。
- source_word: ὑψώθησαν ἀμφότεροι σὺν αὐτοῖς
  choice: 他们二人也随日月一同升了起来
  rationale: ὑψώθησαν为被动形式，可表示被举起或升起；“升了起来”在异象语境中自然，同时保留施动者未明的特点。αὐτοῖς按最近的太阳和月亮理解，并在中文中明说“日月”以避免代词指向含混。
theological_decisions:
- issue: ὑψώθησαν的被动含义及施动者
  choice: 升了起来
  alternative: 被举了起来
  rationale: 原文未说明是谁使他们升高。“升了起来”保留事件本身而不补入神、人或其他施动者，也适合异象中的上升画面。
- issue: σὺν αὐτοῖς中代词的指向
  choice: 随日月一同
  alternative: 和它们一同
  rationale: 语法上最自然地回指太阳与月亮。中文若直译为“它们”会显得突兀，明说“日月”不改变所指，也不引入额外神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体；保留异象中人物抓住天体并随之上升的超现实画面，不作寓意化解释。
