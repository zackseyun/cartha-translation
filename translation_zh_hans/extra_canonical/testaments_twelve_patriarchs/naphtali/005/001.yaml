base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/001.yaml
  text: And being brought low, you will turn back and acknowledge the Lord your God, and he will bring you back into your land according to his great mercy. 4 And it shall come to pass, when they go out into the land of their fathers, again they will forget the Lord and act impiously. 5 And the Lord will scatter them upon the face of all the earth, until the compassion of the Lord shall come, a man working righteousness and showing mercy to all who are far off and to those who are near.
translation:
  language: zh_hans
  text: 3 你们受屈辱之后，必回转，认识主你们的上帝；他必照着自己丰盛的怜悯，使你们回到你们的土地。4 当他们进入祖先的土地时，必再次忘记主，行不敬虔的事。5 主必把他们分散到全地，直到主的怜悯来到[a]：一位施行公义、向一切远方的人和近处的人施怜悯的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的怜悯”直译可作“主的心肠”。原文随后并置“一个人”；中性名词短语与阳性“人”的组合不寻常，句法本身保留了两者之间的张力。
    reason: 说明σπλάγχνον的具体隐喻，以及其与随后阳性ἄνθρωπος的异常并置；不将该结构解释为特定人物或教义称号。
lexical_decisions:
- source_word: σμικρυνθέντες
  choice: 受了卑微之后
  rationale: 该分词字面有“被变小、遭贬抑”之意；此译保留被动受辱、降卑的含义，又符合现代汉语表达。
- source_word: ἐπιστρέψετε / ἐπιστρέψει
  choice: 回转 / 使……回到
  rationale: 同一词根在上下文中先指人转回归向上帝，后指上帝使他们返回土地；按各自宾语自然区分译法。
- source_word: ἐπιγνώσεσθε
  choice: 认识
  rationale: 表示确认、充分认识；“认识主你们的上帝”保留其关系性和认信意味，不额外加上“承认”等解释。
- source_word: ἀσεβήσουσιν
  choice: 行不敬虔的事
  rationale: 表达对上帝缺乏敬畏并付诸行为，避免缩窄成某一种具体罪行。
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: 到全地
  rationale: 这是“遍及全地表面”的惯用表达；简洁译法在现代汉语中更自然，同时保留普遍散布之意。
- source_word: τὸ σπλάγχνον Κυρίου
  choice: 主的怜悯
  rationale: σπλάγχνον本指内脏、心肠，引申为深切怜悯；正文采用语境中的情感义，脚注保留其形象及可能译法。
- source_word: ποιῶν δικαιοσύνην καὶ ποιῶν ἔλεος
  choice: 施行公义、向……施怜悯
  rationale: 保留两个重复的ποιῶν所强调的实际行动，并以自然汉语分别搭配“公义”和“怜悯”。
- source_word: τοὺς μακρὰν καὶ τοὺς ἐγγύς
  choice: 远近之人
  rationale: 保留“远方的人与近处的人”的对举和广泛范围，不擅自将其界定为特定族群。
theological_decisions:
- issue: “主的怜悯”与随后“一个人”的关系
  choice: 用破折号保留二者紧密并置，让“一个人”解释或具体呈现“主的怜悯”
  alternative: 译作“直到那位出于主怜悯的人来到”或“直到主怜悯的心来到”
  rationale: 希腊文先以中性短语τὸ σπλάγχνον Κυρίου作主语，随后并置阳性ἄνθρωπος；语法和意象具有张力。正文不把它明确系统化为某种特定基督论称号，也不割裂二者。
- issue: “远处”和“近处”的对象
  choice: 保留为泛指的一切远近之人
  alternative: 明确解释为外族人与以色列人
  rationale: 原文没有直接标明族群身份；不把可能的经文回声转化为排他性的解释。
- issue: 人称从“你们”转为“他们”
  choice: 按希腊文保留人称变化
  alternative: 为行文统一而全译为“你们”
  rationale: 第3节使用第二人称复数，第4至5节使用第三人称复数；保留这种转变忠于文本的叙述视角。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留预言性语气、人称转换以及“主的怜悯——一个人”的神学张力；不依据后世宗派传统替文本明确身份。
