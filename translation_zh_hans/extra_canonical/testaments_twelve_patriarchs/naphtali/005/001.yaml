  to: 3 你们受屈辱之后，必回转，认识主你们的上帝；他必照着自己丰盛的怜悯，使你们回到你们的土地。4 当他们进入祖先的土地时，必再次忘记主，行不敬虔的事。5 主必把他们分散到全地，直到主的怜悯来到[a]：一位施行公义、向一切远方的人和近处的人施怜悯的人。
