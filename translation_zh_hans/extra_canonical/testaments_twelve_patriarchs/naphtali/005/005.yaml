lexical_decisions:
- source_word: προσδραμόντες
  choice: 跑上前去
  rationale: 该分词表示朝目标跑近；译文保留迅速趋前的动作感，并与主要动词自然衔接。
- source_word: οἱ δύο
  choice: 两人
  rationale: 直译为“两人”，后面的“利未和犹大”作为同位语明确其身份。
- source_word: ἐκράτησαν
  choice: 抓住了
  rationale: κρατέω在此表示抓住、控制住；“抓住了”直接自然，不额外强化为捆绑或长期拘禁。
- source_word: αὐτούς
  choice: 他们
  rationale: 保留原文阳性复数代词的指代形式，不在本节中擅自补明对象。
