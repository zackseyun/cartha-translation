  text: But Joseph came and seized him, and went up with him to the height.
translation:
  language: zh_hans
  text: 约瑟来了，抓住了他，并同他一起上到高处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθών
  choice: 赶来
  rationale: 该分词字面为“来到”；结合随即抓住对方的动作，译作“赶来”使现代汉语叙述更自然，但不增添新的情节。
- source_word: κατέλαβεν
  choice: 抓住
  rationale: 该词在此表示追上并控制住某人；“抓住”既保留动作力度，也比“捉拿”更少带司法色彩。
- source_word: συνανῆλθεν αὐτῷ
  choice: 和他一同登上
  rationale: 保留 σύν- 的共同动作及 ἀνα- 的向上运动，并以自然汉语表达与格 αὐτῷ 的伴随关系。
- source_word: εἰς τὸ ὕψος
  choice: 高处
  rationale: ὕψος 可指高度或高处；上下文未在本节明确具体地点，因此采用不作过度限定的“高处”并保留方向性。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“却”承接 δέ 的转折或推进作用；两个男性代词均依照 αὐτόν、αὐτῷ 译为“他”，不擅自确定其具体所指。
