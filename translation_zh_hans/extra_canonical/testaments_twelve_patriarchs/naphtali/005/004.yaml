base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/004.yaml
  text: And while Levi was like the sun, behold, a certain young man gives him twelve palm branches; and Judah became bright like the moon, and beneath their feet were twelve rays.
translation:
  language: zh_hans
  text: 当利未如同太阳时，看哪，有一个年轻人递给他十二根棕榈枝；犹大变得明亮，如同月亮；在他们脚下有十二道光芒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντος τοῦ Λευὶ ὡς ὁ ἥλιος
  choice: 利未如太阳一般的时候
  rationale: 保留属格独立结构的时间背景及明喻，采用自然的现代汉语表达。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留异象叙述中引人注意的提示语及庄重语体。
- source_word: νέος τις
  choice: 有一个年轻人
  rationale: τις 表示身份未明确的某人；不额外推断其身份。
- source_word: ἐπιδίδωσιν
  choice: 递给
  rationale: 以汉语叙事中自然的动词表达交付动作；希腊文现在时具有生动叙事效果。
- source_word: βαΐα φοινίκων δώδεκα
  choice: 十二根棕榈枝
  rationale: βαΐα 指棕榈树枝叶；量词“根”符合枝条的现代汉语用法。
- source_word: ἐγένετο λαμπρὸς
  choice: 变得明亮
  rationale: 体现 ἐγένετο 的状态转变，而非仅作静态描述。
- source_word: ὑπὸ τοὺς πόδας αὐτῶν
  choice: 他们脚下
  rationale: 保留复数代词所指向的利未和犹大，不将其改为单数或另作解释。
- source_word: δώδεκα ἀκτῖνες
  choice: 十二道光芒
  rationale: ἀκτῖνες 可指光线或光芒；“道光芒”在异象语境中自然，并保留意象。
theological_decisions:
- issue: 年轻人的身份
  choice: 译作“一个年轻人”，不注明身份
  alternative: 将其解释为天使或弥赛亚人物
  rationale: 原文仅有 νέος τις，身份未明；译文不作神学性补足。
- issue: 十二道光芒与十二根棕榈枝的象征意义
  choice: 只呈现异象图景，不解释象征
  alternative: 明确解释为十二支派或其他群体
  rationale: 本节本身没有明说象征所指，应保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言；保留“看哪”的异象文体色彩。分号呈现三个连续而彼此关联的异象画面，并未用脚注，因为本节没有必须在正文中标示的重大文本或译义歧义。
