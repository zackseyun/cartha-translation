- from: 利未如太阳一般的时候，看哪，有一个年轻人递给他十二根棕榈枝；犹大变得明亮，如同月亮；他们脚下有十二道光芒。
  to: 当利未如同太阳时，看哪，有一个年轻人递给他十二根棕榈枝；犹大变得明亮，如同月亮；在他们脚下有十二道光芒。
  rationale: 修订仅改善现代汉语的时间结构和空间关系表达，不改变原文的意象、人物指称、叙事开放性或神学含义。希腊文ἐπιδίδωσιν的生动现在时在汉语中不宜机械标示；“递给”在此异象叙述中可自然承载该动作。
