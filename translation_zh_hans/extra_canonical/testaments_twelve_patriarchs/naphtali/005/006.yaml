  text: And behold, a bull was on the earth, having two great horns and the wings of an eagle on its back; and though we wanted to seize it, we were not able.
translation:
  language: zh_hans
  text: 看哪，地上有一头公牛，长着两只大角，背上有一双鹰的翅膀；我们想要捉住它，却不能够。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留异象叙述中引人注意的提示语，并采用庄重而易懂的现代汉语表达。
- source_word: ταῦρος
  choice: 公牛
  rationale: 准确表达成年雄牛，而非泛指“牛”。
- source_word: δύο κέρατα μεγάλα
  choice: 两只大角
  rationale: 保留数目与形容词，语序符合自然汉语。
- source_word: πτέρυγας ἀετοῦ
  choice: 一双鹰的翅膀
  rationale: 属格自然理解为鹰所具有的翅膀；“一双”与复数 πτέρυγας 对应，使汉语表达流畅，但不增加翅膀种类之外的解释。
- source_word: πιάσαι
  choice: 捉住
  rationale: 表达抓取并控制该动物的动作，比“抓”更完整自然。
- source_word: οὐκ ἠδυνήθημεν
  choice: 却不能够
  rationale: 保留未能做到之意及与前句意愿之间的转折。
