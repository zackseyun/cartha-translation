  text: V. For in the fortieth year of my life, I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still. 2 And behold, Isaac, the father of my father, said to us, “Run up, and let each of you seize according to his strength; and the one who takes hold shall have the sun and the moon.”
translation:
  language: zh_hans
  text: 五 因为在我生命的第四十年，我在耶路撒冷以东的橄榄山上看见一个异象：太阳和月亮都停住了。2 看哪，我祖父以撒对我们说：“你们跑上前去，各人要按自己的力量去抓取；谁抓住了，太阳和月亮就必归谁。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ τεσσαρακοστῷ ἔτει τῆς ζωῆς μου
  choice: 在我一生的第四十年
  rationale: 直译其时间表达，同时采用自然的现代汉语措辞。
- source_word: ὄραμα
  choice: 异象
  rationale: 在宗教及启示性叙事中，“异象”准确传达所见超常景象，不等同于普通梦境。
- source_word: ἕστηκαν
  choice: 都停住了
  rationale: 表达太阳和月亮处于静止状态；“都”自然对应复数主语，但不额外解释其象征意义。
- source_word: Προσδραμόντες
  choice: 跑上前去
  rationale: 保留 προσ- 所含的趋近意味，比单说“跑”更具体自然。
- source_word: κρατήσατε ἕκαστος κατὰ δύναμιν
  choice: 各人要量力抓住
  rationale: 不补出希腊文未明说的宾语；“量力”简洁表达“按照各自的力量”。
- source_word: τοῦ πιάσαντος
  choice: 谁抓住了
  rationale: 保留未明说宾语的结构和开放性，不擅自补为“抓住它们”。
- source_word: ἔσται ὁ ἥλιος καὶ ἡ σελήνη
  choice: 太阳和月亮就必归谁
  rationale: 希腊文直陈太阳和月亮将属于抓住者；汉语用“归谁”自然表达归属关系。
theological_decisions:
- issue: 抓取动作的宾语是否明确指太阳和月亮
  choice: 不补出宾语
  alternative: 译作“抓住它们”
  rationale: 原文 κρατήσατε 与 τοῦ πιάσαντος 均无明示宾语；虽可由上下文推知，但应保留原文的省略和轻微歧义。
- issue: 异象中太阳和月亮归属的性质
  choice: 仅译作“归谁”
  alternative: 解释为获得统治权、荣耀或天体本身
  rationale: 原文没有阐明象征含义，译文不作神学性扩展。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“我祖父以撒”自然传达“我父亲的父亲”，避免汉语中生硬重复；保留“看哪”以呈现 ἰδού 的突显和异象叙事色彩。未设置脚注，因此正文无脚注标记。
