source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: IX. *Καὶ πολλὰ¹ τοιαῦτα ἐντειλάμενος² αὐτοῖς παρεκάλεσεν ἵνα μετακομίσωσι³ τὰ ὀστᾶ αὐτοῦ⁴ *ἐν Χεβρών, καὶ θάψωσι αὐτὸν⁵ μετὰ τῶν πατέρων αὐτοῦ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/001.yaml
  text: And after instructing them in many such things, he urged them to carry his bones to Hebron and bury him with his fathers.
translation:
  language: zh_hans
  text: 这样吩咐了他们许多事之后，他劝他们把他的骸骨运到希伯仑，与他的祖先葬在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ τοιαῦτα
  choice: 许多事
  rationale: 结合“这样……以后”表达“许多诸如此类的事”，避免中文累赘，同时保留对前述同类嘱咐的概括。
- source_word: ἐντειλάμενος
  choice: 嘱咐了
  rationale: 准确表达郑重吩咐、交代之意，且符合临终训诫的语境。
- source_word: παρεκάλεσεν
  choice: 劝
  rationale: 保留该词在此处“恳请、劝告”的语气，不强化为命令。
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: 把他的骸骨运到
  rationale: “骸骨”自然对应遗骨语境；“运到”体现 μετακομίζω 的迁移、运送含义。
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: 在他列祖那里
  rationale: 保留古代家族安葬语境中的“列祖”表达，也不擅自具体化为同一墓穴。
theological_decisions:
- issue: “与他列祖一同”所指的安葬关系
  choice: 葬在他列祖那里
  alternative: 和他的祖先葬在一起
  rationale: “那里”自然传达与列祖同处安葬的意思，同时保留原文对具体墓葬安排的含蓄性；“列祖”也较符合经传体裁。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列祖”略带经传色彩，但在此安葬语境中清楚自然。原文无须另加脚注。
