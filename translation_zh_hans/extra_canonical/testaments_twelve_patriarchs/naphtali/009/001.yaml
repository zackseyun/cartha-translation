  rationale: 修订仅调整中文语序和合葬关系的表达：保留“许多这样的事”、郑重嘱咐、劝请、将骸骨运往希伯仑，以及与祖先共同安葬的全部信息；未添加原文没有的墓地细节或宗派性解释。
