    issue: “这样嘱咐了他们许多事”表述不够自然，且“许多这样的话/事”的修饰关系不清晰。
    rationale: πολλὰ τοιαῦτα ἐντειλάμενος αὐτοῖς 是“这样吩咐他们许多事之后”。调整语序可清楚保留“许多诸如此类的嘱咐”。
  - severity: medium
    issue: “葬在他列祖那里”弱化了“与他的祖先一同”的关系。
    rationale: μετὰ τῶν πατέρων αὐτοῦ 表示与其祖先共同安葬，而不只是葬在祖先所在之地。
