- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: 怀着喜乐的心
  rationale: 自然表达内在欣悦的状态；ψυχή在此指人的内在生命或心境，译作“心”比生硬的“灵魂”更符合现代汉语语境。
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: 蒙上脸
  rationale: 保留原文遮盖自己面部这一动作，不额外推断所用物品或仪式意义。
- source_word: ἀπέθανε
  choice: 死了
  rationale: 直接对应原文，行文庄重而清楚。
