  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/003.yaml
  text: And weeping, he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, who fathered you.”
translation:
  language: zh_hans
  text: 他哭着说：“哀哉，我的孩子约瑟！你活着，我却看不见你；你也看不见你的生父雅各。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίων
  choice: 一边哭
  rationale: 以自然的现代汉语表达伴随主句动作持续发生的现在分词，同时保留哭泣与说话同步的情景。
- source_word: Οἴμοι
  choice: 哀哉
  rationale: 保留感叹词所表达的悲痛与哀叹；用庄重而仍易懂的汉语措辞。
- source_word: τέκνον μου
  choice: 我的孩子
  rationale: τέκνον 是亲属称谓，重在亲爱关系；“我的孩子”比限定性别的称呼更贴近原词。
- source_word: ζῇς
  choice: 你还活着
  rationale: 直陈“你活着”的事实；“还”符合此处得知约瑟仍然在世的汉语语境，并未增添结果性含义。
- source_word: βλέπω / ὁρᾷς
  choice: 看不见 / 看不见
  rationale: 原文虽使用两个不同的视觉动词，但在本句中均指彼此不能相见；统一译法能自然保留平行结构，不强加细微差别。
- source_word: τὸν γεννήσαντά σε
  choice: 生你的
  rationale: γεννάω 在此明确指雅各使约瑟出生、为其生父；“生你的雅各”简洁保留关系分词结构，避免额外解释。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。“哀哉”略带古雅色彩，用以承载 Οἴμοι 的强烈悲叹；其余句法保持自然简洁，并保留原文两个否定分句的对称与情感张力。
