  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/001.yaml
  text: I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”
translation:
  language: zh_hans
  text: 我把这两个梦告诉了父亲，他对我说：“这些事必按各自的时机应验；在此以前，以色列要忍受许多苦难。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνύπνια
  choice: 梦
  rationale: 指睡梦中所见；现代汉语用“梦”自然明确。
- source_word: Δεῖ
  choice: 必
  rationale: 保留原文所表达的必然性。
- source_word: πληρωθῆναι
  choice: 应验
  rationale: 在梦境预示之事的语境中，“应验”比一般的“完成”更贴切。
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  choice: 按各自的时机
  rationale: κατά 表示依照，复数 καιρούς 配合 αὐτῶν，指这些事各自相应的时机；不额外加入“指定”或“预定”的施事者。
- source_word: πολλὰ … ὑπομείναντος
  choice: 以色列要忍受许多苦难
  rationale: ὑπομένω 表示忍受、承受；中性复数 πολλά 在此概括许多艰难遭遇，译作“许多苦难”符合汉语表达。
theological_decisions:
- issue: 事件应验与以色列受苦的时间关系
  choice: 译为“在此以前，以色列要忍受许多苦难”
  alternative: “以色列忍受许多苦难之后”
  rationale: 属格绝对结构 πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος 可表达先于主要动作完成的情形。正文采用自然的前置时间关系，同时不进一步界定这些苦难或应验的神学性质。
- issue: καιροί 是否含神所预定之意
  choice: “时机”
  alternative: “指定的时期”或“预定的日期”
  rationale: 原文没有明示指定者；用“时机”保留其适当、相应时间的含义，避免加入原文未明说的预定论色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“父亲”承接亲属关系；引语语序略作汉语化处理。无脚注。
