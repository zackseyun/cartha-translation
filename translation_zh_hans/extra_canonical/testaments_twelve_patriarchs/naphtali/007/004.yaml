  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/004.yaml
  text: So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold, yet I was afraid of my brothers.
translation:
  language: zh_hans
  text: 于是，他也用这些话使我落泪。但我心中焦灼，急欲告诉他约瑟已经被卖了，却又害怕我的兄弟们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς λόγοις τούτοις
  choice: 这些话
  rationale: 此处表示使人落泪的缘由或媒介；译作“这些话”自然简洁，并保留与上文话语的衔接。
- source_word: ἐκαιόμην τοῖς σπλάγχνοις μου
  choice: 我心里焦灼
  rationale: 原文直译为“我的内脏中燃烧”，是表达内心强烈煎熬与迫切冲动的习语；“心里焦灼”保留燃烧般的情感强度，同时符合现代汉语。
- source_word: ἀναγγεῖλαι
  choice: 想告诉他
  rationale: 不定式承接内心的迫切冲动，意为告知或报告；“告诉他”在语境中自然，宾语“他”指前文人物。
- source_word: πέπραται
  choice: 已经被卖了
  rationale: 完成时被动态强调出售已发生且结果仍然成立；“已经被卖了”准确体现这一点。
- source_word: τοὺς ἀδελφούς μου
  choice: 我的兄弟们
  rationale: 按字面保留亲属关系和复数，不额外限定为哥哥或弟弟。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接上文；用“落泪”而非较口语的“哭了”。后半句保留拿弗他利想揭露真相、却因惧怕兄弟而没有说出的张力，不补入动机或道德评判。
