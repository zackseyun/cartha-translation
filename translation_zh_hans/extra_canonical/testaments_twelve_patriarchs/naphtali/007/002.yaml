  text: Then my father said to me, “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”
translation:
  language: zh_hans
  text: 那时，我父亲对我说：“我相信上帝：约瑟还活着；因为我一直看见主把他算在我们当中。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιστεύω τῷ θεῷ
  choice: 我相信上帝
  rationale: 保留希腊语‘相信/信靠上帝’的直接表达，不增添原文没有的‘所说的话’等宾语。
- source_word: ζῇ Ἰωσήφ
  choice: 约瑟还活着
  rationale: ζῇ 是现在时，中文以‘还活着’自然表达约瑟仍然存活。
- source_word: ὁρῶ γὰρ πάντοτε
  choice: 因为我总是看见
  rationale: 按正文所保留的 πάντοτε 译出‘总是’，并保留视觉动词 ὁρῶ 的‘看见’，不改释为梦见或领悟。
- source_word: Κύριος ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: 主把他算作与我们同在的人
  rationale: ἀριθμεῖ 本义为计算、数列；此处表达将约瑟列入他们之中。译文保留‘算作’的意象，同时使现代汉语通顺。
theological_decisions:
- issue: 雅各所说‘看见’的性质
  choice: 保留为‘看见’
  alternative: 译作‘在异象中看见’或‘察觉’
  rationale: 原文没有明说异象、梦境或内在领悟，因此不替文本判定经验的性质。
- issue: ‘主把他算作与我们同在’的含义
  choice: 保留‘算作与我们同在的人’
  alternative: 意译为‘主认为他仍是我们中的一员’
  rationale: 原句可能既含列数之意，也含约瑟虽不在场却被视为仍与家人同在的张力；译文不将其收窄为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留引语的简洁和原文‘相信—看见—算作’之间的逻辑关系。
