base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/005.yaml
  text: In the same way also the Watchers changed the order of their nature, whom the Lord cursed at the time of the flood, because of whom he made the earth uninhabited and fruitless.
translation:
  language: zh_hans
  text: 同样，守望者也改变了他们本性的秩序；主在洪水时期咒诅了他们，并因他们使大地变得无人居住、不能结果实。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使大地变得无人居住、不能结果实”：此处希腊文本的句法和文本形态不稳定，可能有讹损或异文；也可理解为“使大地荒无人烟、不结果实”。
    reason: ἀπὸ κατοικησίας καὶ ἄκαρπον τάξας τὴν γῆν [ἀοίκητον] 的读法和句法关系存在困难，脚注应保留这种不确定性。
lexical_decisions:
- source_word: οἱ Ἐγρήγοροι
  choice: 那些守望者
  rationale: 采用第二圣殿时期文献中该类超自然存在的通行称谓；保留定冠意义，不泛化为普通的“警醒者”。
- source_word: ἐνήλλαξαν τάξιν φύσεως αὐτῶν
  choice: 改变了自身本性的秩序
  rationale: 较直接保留“秩序”和“本性”的概念及原文的神学张力，不具体解释他们如何改变。
- source_word: κατηράσατο
  choice: 咒诅了
  rationale: 准确表达强烈的审判用语，而非弱化为“责罚”。
- source_word: ἐπὶ τοῦ κατακλυσμοῦ
  choice: 在洪水的时候
  rationale: 自然表达其时间意义，同时保留与洪水事件的明确关联。
- source_word: ἀπὸ κατοικησίας καὶ ἄκαρπον
  choice: 无人居住、不结果实
  rationale: 依据语境表达土地失去居住与生产能力的双重状态；相关希腊文本存在困难，故附注说明。
theological_decisions:
- issue: 守望者改变“本性秩序”的具体含义
  choice: 保留抽象表述，不解释为与人类女子结合或其他具体行为
  alternative: 将其释译为“越过本性的界限”或明确说明其行为
  rationale: 本节只说他们改变自身本性的秩序；明确化会把其他传统或上下文解释直接写进正文。
- issue: 主咒诅守望者与大地荒芜之间的句法关系
  choice: 译为两个连续谓语，并明确二者均以守望者为关系对象和原因
  alternative: 严格复制连续关系从句：“主在洪水时所咒诅的；因他们……”
  rationale: 汉语若机械保留希腊关系结构会生硬；当前译法保持了 οὓς 与 δι’ οὓς 的指向而更自然。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“守望者”作为专称保留古代文献语境；整体尽量贴近希腊句法关系，但避免不自然的关系从句堆叠。
