source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Ἔθνη πλανηθέντα *καὶ ἀφέντα Κύριον²⁰ ἠλλοίωσαν²¹ τὴν²² τάξιν αὐτῶν, καὶ *ὑπήκουσαν ξύλοις καὶ λίθοις²³, πνεύμασι²⁴ πλάνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/003.yaml
  text: The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.
translation:
  language: zh_hans
  text: 列国受了迷惑，离弃了主，改变了自己的秩序，并听从木头和石头以及迷惑人的灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔθνη
  choice: 列国
  rationale: 指外邦各民族或诸国；“列国”简洁庄重，也符合本句群体性的语境。
- source_word: πλανηθέντα
  choice: 误入歧途
  rationale: 保留被引入错误、偏离正道的意味，较“迷路”更适合宗教与伦理语境。
- source_word: ἀφέντα
  choice: 离弃了
  rationale: 表达主动撇下、背弃主的含义。
- source_word: ἠλλοίωσαν τὴν τάξιν αὐτῶν
  choice: 改变了自身的秩序
  rationale: τάξις可指秩序、安排或本位；直译为“秩序”以保留原文含义范围，不具体化为道德、受造或社会秩序。
- source_word: ὑπήκουσαν
  choice: 听从
  rationale: 原义为听命、顺从；“听从”自然地表达向偶像及迷惑之灵屈从。
- source_word: ξύλοις καὶ λίθοις
  choice: 木头和石头
  rationale: 保留具体材料名称及其对偶结构，暗指由木石制成的偶像而不在正文中增补解释。
- source_word: πνεύμασι πλάνης
  choice: 迷惑人的灵
  rationale: 属格结构可理解为带来迷误或属于迷误的灵；此译自然，同时保留其欺骗、诱人偏离的功能。
theological_decisions:
- issue: “木头和石头”是否明译为“偶像”
  choice: 保留“木头和石头”
  alternative: 木石偶像
  rationale: 原文使用具体材料而非εἴδωλα；保留其讽刺性的物质意象，避免把解释直接写入正文。
- issue: τάξις所指为何
  choice: 自身的秩序
  alternative: 自己的本位／受造的秩序
  rationale: 原文没有明确限定是受造本位、生活规范还是社会秩序，因此保持真实歧义。
- issue: πνεύμασι πλάνης的性质
  choice: 迷惑人的灵
  alternative: 谬误之灵／邪灵
  rationale: 原文明确涉及使人迷误的灵，却未直接使用“邪恶”一词；不额外强化其分类。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句中重复“听从”，对应木石与迷惑之灵两个并列对象，使逻辑清楚，并保留原文递进感。
