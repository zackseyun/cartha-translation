  text: 4. Ὑμεῖς δὲ *μὴ οὕτως²⁵, τέκνα μου, γινώσκοντες²⁶ ἐν τῷ²⁷ στερεώματι, ἐν γῇ καὶ²⁸ ἐν²⁹ θαλάττῃ, καὶ²⁸ ἐν³⁰ πᾶσι τοῖς δημιουργήμασι *Κύριον τὸν³¹ ποιήσαντα πάντα³², ἵνα μὴ γένησθε³³ ὡς Σόδομα, ἥτις³⁴ ἐνήλλαξε³⁵ τάξιν φύσεως αὐτῆς³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/004.yaml
  text: But you, my children, must not be so, knowing in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.
translation:
  language: zh_hans
  text: 但你们，我的孩子，既在穹苍、地上、海中和一切受造之物中认识那创造万物的主，就不可这样，免得变得像所多玛一样；所多玛改变了其本性的秩序。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερέωμα
  choice: 穹苍
  rationale: 保留该词在犹太—希腊宇宙观中的空间意象，也与“地上、海中”并列自然。
- source_word: δημιούργημα
  choice: 受造之物
  rationale: 表达被创造之物，避免较生硬的“制作物”，并保留其与创造主的关系。
- source_word: τάξιν φύσεως αὐτῆς
  choice: 自身本性的秩序
  rationale: 贴近原文所有格结构，不把所指进一步解释为特定行为，从而保留原文的概括性与张力。
theological_decisions:
- issue: 分词 γινώσκοντες 与主句的关系
  choice: 译作“你们既……认识了……，就不要……”，将其理解为伴随并带有理由色彩的分词结构
  alternative: 译作命令“你们要从……认识……”
  rationale: 原文 γινώσκοντες 是分词而非命令式；此译法既维持句法从属关系，也使现代汉语通顺，且不加入英文修订前曾有的“反要”之类转折命令。
- issue: “所多玛改变自身本性的秩序”的具体含义
  choice: 按原文概括表达，不具体化
  alternative: 明确解释为改变性关系、创造秩序或自然法则
  rationale: 原文本节没有明确限定其所指；具体化会引入解释传统并消除文本本身的歧义。
translation_notes:
  register: 采用庄重而自然的现代书面普通话。“但你们，我的孩子”保留直接呼语；用分号梳理希腊文较长的句子。未添加原文没有的劝勉连接词，也未设置脚注标记。
