revisions:
- from: 但你们，我的孩子，不可这样；你们既从穹苍、地上、海中以及一切受造之物，认识了那创造万物的主，就不要变得像所多玛一样；它改变了自身本性的秩序。
  to: 但你们，我的孩子，既在穹苍、地上、海中和一切受造之物中认识那创造万物的主，就不可这样，免得变得像所多玛一样；所多玛改变了其本性的秩序。
  rationale: 调整语序，使“既……就……”在现代汉语中自然承载γινώσκοντες与主句的从属关系，同时避免把分词译成独立命令或完成动作。将“从”改为“在……中”，对应原文各处ἐν；末句保留原文未说明的“本性的秩序”这一概括表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:22:45Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了否定劝诫、对创造主的认识、避免成为所多玛以及“改变其本性的秩序”等要素，也没有把末句具体化为某一解释传统。但“从穹苍、地上、海中以及一切受造之物，认识”未能清楚表达原文连续的ἐν（“在……中”）范围；“认识了”则将现在分词γινώσκοντες不必要地完成化。
  naturalness: 原句后半段“它改变了自身本性的秩序”虽可理解，但以“所多玛”直接作主语并用“其”回指更自然庄重。“在……中认识”也比“从……认识”更符合原文句法并避免“从地上、海中认识”的搭配生硬。
  terminology: “穹苍”“受造之物”“主”“所多玛”均可取。“本性的秩序”准确保留τάξιν φύσεως αὐτῆς的概括性，避免了教派化或具体化诠释。
  issues:
  - severity: medium
    issue: 地点/范围介词的表达不够贴近原文
    rationale: 原文在“穹苍、地、海、所有受造物”前反复使用ἐν，表达在这些领域或受造物之中认识主。译作“从……认识”改变了这一关系，且中文搭配不够顺畅。
  - severity: low
    issue: “认识了”将现在分词完成化
    rationale: γινώσκοντες为现在主动分词，宜不加入“了”所造成的完成性；以“既在……认识”可保留其从属、伴随并带理由色彩的功能。
  - severity: low
    issue: “它”回指所多玛略显口语且指代稍弱
    rationale: 在庄重书面语中，直接说“所多玛改变了其本性的秩序”更清楚自然。
  revised_text: 但你们，我的孩子，既在穹苍、地上、海中和一切受造之物中认识那创造万物的主，就不可这样，免得变得像所多玛一样；所多玛改变了其本性的秩序。
  revised_footnotes: []
  revision_rationale: 调整语序，使“既……就……”在现代汉语中自然承载γινώσκοντες与主句的从属关系，同时避免把分词译成独立命令或完成动作。将“从”改为“在……中”，对应原文各处ἐν；末句保留原文未说明的“本性的秩序”这一概括表达。
