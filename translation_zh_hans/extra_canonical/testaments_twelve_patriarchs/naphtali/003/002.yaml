review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了本句以天体秩序比拟人类行为的结构，也保留了两处动词的平行。不过，希腊文本的前一动词为带匕首号的καλύψουσι（字面“遮盖”），在此语境中显然有文本困难；现行“改变”符合英语审校轨迹所采用的理解，但应以脚注说明，避免把有争议的复原当作无疑的原文。ἐν ἀταξίᾳ较稳妥地译为“在……混乱中”，比“因……而”更贴近介词短语，且不额外限定因果关系。
  naturalness: “太阳、月亮和众星”“同样，你们也不要”庄重自然。将“因自己行为的混乱而”调整为“在自己行为的混乱中”，中文仍通顺，并更好地保留原文的开放关系。
  terminology: “秩序／混乱”恰当地再现τάξις／ἀταξία的对照；“上帝的律法”准确、庄重且不附加教派性解释。“众星”可保留，适合本段语体。
  issues:
  - severity: medium
    issue: 希腊文前半句的动词有文本困难，未在译文或脚注中标示。
    rationale: Charles版将καλύψουσι标以匕首号（†），其通常义“遮盖”与“秩序”搭配不顺。译作“改变”虽与英语审校文本及下句平行相符，但属于对困难文本的理解，宜以脚注透明说明。
  - severity: low
    issue: “因自己行为的混乱而”将ἐν ἀταξίᾳ明确化为因果。
    rationale: ἐν的基本意义为“在……中”；上下文可含方式、处境或结果等关系。改为“在……混乱中”能保留这种未明定的关系。
  revised_text: 太阳、月亮和众星都不改变各自的秩序；同样，你们也不要在自己行为的混乱中改变上帝的律法。¹
  revised_footnotes:
  - marker: '1'
    text: “不改变”：现存希腊文本此处作“遮盖”（καλύψουσι），且编辑者标示该词有文本困难。这里依上下文及与下句“改变”的平行，采用“不改变”的理解。
    reason: 标明原文的文本不确定性，同时说明译文所依的上下文理解，不将争议性复原视为确定读法。
  revision_rationale: 修订仅作两项必要调整：以“在……混乱中”保留ἐν的关系开放性，并新增脚注交代带匕首号的困难希腊读法。其余措辞保留原译的自然度、秩序／混乱的词汇对照，以及原文两处“改变”的平行。
