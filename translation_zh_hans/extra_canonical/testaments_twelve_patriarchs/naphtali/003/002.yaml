revisions:
- from: 太阳、月亮和众星都不改变各自的秩序；同样，你们也不要因自己行为的混乱而改变上帝的律法。
  to: 太阳、月亮和众星都不改变各自的秩序；同样，你们也不要在自己行为的混乱中改变上帝的律法。¹
  rationale: 修订仅作两项必要调整：以“在……混乱中”保留ἐν的关系开放性，并新增脚注交代带匕首号的困难希腊读法。其余措辞保留原译的自然度、秩序／混乱的词汇对照，以及原文两处“改变”的平行。
