base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/002.yaml
  text: The sun and the moon and the stars do not alter their order; so you also must not alter the law of God through the disorder of your deeds.
translation:
  language: zh_hans
  text: 太阳、月亮和众星都不改变各自的秩序；同样，你们也不要在自己行为的混乱中改变上帝的律法。¹
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάξιν
  choice: 各自的秩序
  rationale: 表达受造天体各守其序的含义，同时不增添原文没有明说的“所定”或“指定”。
- source_word: ἀλλοιώσητε
  choice: 改变
  rationale: 对应“使之变异、改变”，保留原文在天体秩序与上帝律法之间的平行表达。
- source_word: ἀταξίᾳ
  choice: 混乱
  rationale: 与τάξιν“秩序”形成清楚的词义对照，并自然描述行为失序。
- source_word: πράξεων
  choice: 行为
  rationale: 在本句伦理语境中准确而自然，涵盖人的所作所为。
- source_word: νόμον Θεοῦ
  choice: 上帝的律法
  rationale: 直译属格结构，采用现代汉语中庄重且易懂的宗教用语。
theological_decisions:
- issue: 人是否能够“改变”上帝的律法
  choice: 保留“改变上帝的律法”的原文措辞
  alternative: 偏离或违背上帝的律法
  rationale: 原文使用ἀλλοιόω，并与前句天体不改变秩序构成平行；不将潜在的神学张力解释性地改写为“违背”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“同样”承接类比；“因自己行为的混乱”保持原文介词结构及秩序/混乱的对照。
