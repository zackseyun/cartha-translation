    rationale: 原文是“在／出于贪婪中热衷于败坏”的劝诫；改为“不要出于贪婪，急于败坏”可保留动机与急切性，并更符合现代汉语。
  - severity: medium
    issue: 说明分句的汉语句法不顺
    rationale: “以清洁的心静默，就会明白要……”缺少自然的衔接，且“明白要持守”不如“明白怎样持守”准确表达συνήσετε后接不定式的意义。
  - severity: low
    issue: 彼列脚注的背景说明过于笼统
    rationale: “对邪恶者的称呼”未清楚说明其为专名／称谓，也容易将文本中的彼列直接等同于泛指的“邪恶者”。
