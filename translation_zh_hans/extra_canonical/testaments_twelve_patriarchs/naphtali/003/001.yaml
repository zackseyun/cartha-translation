  to: 所以，不要出于贪婪，急于败坏你们的行为；也不要用空洞的话蒙骗自己的心灵。因为以清洁的心保持静默，你们就会明白怎样持守上帝的旨意，并摒弃彼列[a]的意愿。
  rationale: 修订使首项劝诫的动机关系和汉语搭配更清楚，理顺“静默—明白—持守／摒弃”的句法，并将彼列脚注改为更准确、非教派化的说明。原文的劝诫语气、两个不定式所表达的行动，以及上帝与彼列之旨意的对照均获保留。
