source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: III. Μὴ οὖν σπουδάζετε¹ *ἐν πλεονεξίᾳ² *διαφθεῖραι τὰς πράξεις ὑμῶν³, ἢ ἐν *λόγοις κενοῖς ἀπατᾶν⁴ τὰς ψυχὰς ὑμῶν, ὅτι⁵ σιωπῶντες⁶ ἐν *καθαρότητι καρδίας⁷ συνήσετε⁸ τὸ θέλημα τοῦ Θεοῦ⁹ κρατεῖν¹⁰, καὶ ἀπορρίπτειν τὸ θέλημα τοῦ Βελίαρ¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/001.yaml
  text: Therefore, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls, because by keeping silent in purity of heart you will understand to hold fast the will of God and to cast away the will of Beliar.
translation:
  language: zh_hans
  text: 所以，不要出于贪婪，急于败坏你们的行为；也不要用空洞的话蒙骗自己的心灵。因为以清洁的心保持静默，你们就会明白怎样持守上帝的旨意，并摒弃彼列[a]的意愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”（希腊文：Βελίαρ，Beliar）是犹太教及相关早期文献中指称邪恶势力或恶者的名称。
    reason: 保留原文专名，并为不熟悉该名称的现代读者提供必要而不过度诠释的背景。
lexical_decisions:
- source_word: σπουδάζετε
  choice: 急于
  rationale: 表达“热切、急切去做”的语气，同时在现代汉语中自然地承接后面的负面行为。
- source_word: ἐν πλεονεξίᾳ
  choice: 因贪婪
  rationale: πλεονεξία指贪得无厌、贪婪；介词结构在此可自然理解为行为的动因。
- source_word: διαφθεῖραι τὰς πράξεις ὑμῶν
  choice: 败坏你们的行为
  rationale: 保留διαφθείρω“败坏、毁坏”的强烈含义及πράξεις“行为、作为”的范围。
- source_word: λόγοις κενοῖς
  choice: 空洞的话
  rationale: κενοῖς直指空虚、无实质内容，译为“空洞”既贴近原文又符合现代汉语。
- source_word: σιωπῶντες ἐν καθαρότητι καρδίας
  choice: 以清洁的心静默
  rationale: 按方式性分词结构翻译，不增添原文没有的条件词“若”；“清洁的心”保留圣经传统语感。
- source_word: κρατεῖν
  choice: 持守
  rationale: 表达牢牢把持、坚持不放的含义，适合与“上帝的旨意”搭配。
- source_word: ἀπορρίπτειν
  choice: 摒弃
  rationale: 准确表达抛开、拒绝之意，并与“持守”构成鲜明对照。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 保留专名形式，不在正文中直接将其解释为撒但或邪恶，以免消除文本自身的表达方式。
theological_decisions:
- issue: “上帝的旨意”与“彼列的意愿”的对照
  choice: 两处均保留θέλημα所表达的“旨意／意愿”概念
  alternative: 将后者释译为“邪恶的诱惑”
  rationale: 原文以两个θέλημα形成直接对照；保留这一结构可呈现其神学张力，而不将彼列的意愿预先解释为某一具体活动。
- issue: σιωπῶντες的逻辑关系
  choice: 译作方式或伴随状态：“以清洁的心静默”
  alternative: 译作条件句：“你们若……静默”
  rationale: 希腊文使用分词而非明确条件结构；中文不增添“若”，以保存其可作方式、伴随状态或因由理解的开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；句式保留原文“不要……也不要……；因为……”的劝诫与说明结构。用“灵魂”“旨意”“持守”等普通读者可理解且具有经文语体色彩的词语，避免古奥化和宗派化表达。
