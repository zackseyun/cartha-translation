base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/004.yaml
  text: And while blessing and glorifying the Lord, he grew strong and said, “After yesterday’s meal, my flesh died.”
translation:
  language: zh_hans
  text: 他荣耀主时，便强健起来，说：“昨天那顿饭后，我的肉身死了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: 荣耀
  rationale: 按现存希腊正文直译为“荣耀、颂扬”；英语咨询文本中的“blessing and”在所给希腊文中没有对应成分，故不增译。
- source_word: ἐκραταιώθη
  choice: 强健起来
  rationale: 该被动形式表示变得强壮或得着力量；用“强健起来”既自然，又保留状态变化。
- source_word: δεῖπνον
  choice: 晚饭
  rationale: δεῖπνον通常指正餐，常为晚间的一餐；此处译作“晚饭”比“筵席”更准确，也符合“昨天”这一日常叙述。
- source_word: ἡ σάρξ μου
  choice: 我的肉身
  rationale: σάρξ可指肉体、身体或“肉身”；保留“肉身”可呈现原文措辞及其可能的神学张力，不改写成单纯的“身体”。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 该动词明确意为“死”，不增添“衰败”或“失效”等原文没有的意义。
theological_decisions:
- issue: “我的肉身死了”的含义
  choice: 保留原文直陈“我的肉身就死了”
  alternative: 意译为“我的身体衰弱得像死了一样”或“我的肉体欲望死了”
  rationale: 上下文可能使这句话具有身体或象征层面的含义，但本节本身并未消除歧义；译文不替作者作神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他荣耀主的时候”顺应汉语表达；引语保持原文略显突兀的力度。所给希腊正文只有“荣耀主”，因此未沿用英语咨询层新增的“祝福”。
