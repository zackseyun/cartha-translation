  text: 'Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father.'
translation:
  language: zh_hans
  text: 于是他开始说：“听吧，我的孩子们，拿弗他利的子孙；要听你们父亲的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο δὲ λέγειν
  choice: 于是，他开口说
  rationale: 保留开始发言的叙事推进；“开口说”比直译“开始说”更符合现代汉语叙事表达。
- source_word: Ἀκούσατε
  choice: 请听
  rationale: 原文为复数命令式；用“请听”既传达劝告与命令语气，也适合父亲临终训诲的庄重语境。重复两次，以保留原文修辞。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: τέκνα 是对子女的亲切称呼，译为现代、自然的“孩子们”。
- source_word: υἱοὶ Νεφθαλείμ
  choice: 拿弗他利的众子
  rationale: 保留族祖对子孙后代的称谓方式；“众子”兼具家族与群体含义。
- source_word: λόγους πατρὸς ὑμῶν
  choice: 你们父亲的话
  rationale: 按原文所有格结构直译，清楚保留说话者以父亲身份训诲众子的语气。
