source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Ὅθεν καὶ ὅμοιός μου⁴⁶ ἦν Γκατὰ πάντα¹⁴⁷ Ἰωσὴφ⁴⁸ κατὰ τὰς †εὐλογίας⁴⁹ Ῥαχιήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/008.yaml
  text: Therefore Joseph also was like me in every way, according to the prayers of Rachel.
translation:
  language: zh_hans
  text: 因此，照着拉结的祈求，约瑟也在各方面都和我相像。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处底本文字作“祝福”，但有异文作“祈求”；正文采用异文。
    reason: 原文中 εὐλογίας 带校勘疑号，而审校资料指出异文 εὐχάς；两种读法都应向读者交代，以保存真实的文本不确定性。
lexical_decisions:
- source_word: Ὅθεν
  choice: 因此
  rationale: 表达由上文所得的推论，简洁保留其因果承接作用。
- source_word: ὅμοιός μου
  choice: 和我相像
  rationale: 自然、直接地表达与说话者相似，不额外限定相似的具体性质。
- source_word: κατὰ πάντα
  choice: 在各方面都
  rationale: 保留原文范围广泛的表达，同时符合现代汉语习惯。
- source_word: κατὰ τὰς †εὐλογίας / variant εὐχάς
  choice: 照着……的祈求
  rationale: 底本此处带有文本疑义；依据校勘所反映的异文 εὐχάς，并与英语审校层一致，正文采用“祈求”，同时以脚注保留“祝福”的读法。
- source_word: Ῥαχιήλ
  choice: 拉结
  rationale: 采用现代中文圣经语境中通行的人名译法。
theological_decisions:
- issue: 拉结与约瑟相像之关系的表述
  choice: 照着拉结的祈求
  alternative: 照着拉结的祝福
  rationale: 不把该短语扩展为特定的神学因果机制；正文采用有校勘依据且语义较自然的“祈求”，脚注明确保存底本文字所见的另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在各方面都和我相像”保留原文的概括性；句首“因此”承接上下文。
