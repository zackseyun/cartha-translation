  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/002.yaml
  text: When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them.
translation:
  language: zh_hans
  text: 他的儿子们在七月初一聚齐后，他便为他们设宴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνελθόντων
  choice: 聚齐后
  rationale: 以时间从属结构表达属格独立结构，既保留“聚集”的动作，也使现代汉语自然流畅。
- source_word: ἐν τῷ ἑβδόμῳ μηνί, μιᾷ τοῦ μηνός
  choice: 在七月初一
  rationale: 原文意为“在第七个月、月中的第一日”；“七月初一”是简洁自然的现代汉语日期表达。
- source_word: ἐποίησε δεῖπνον
  choice: 设宴
  rationale: 此处指为众人预备宴席；“设宴”比直译“做晚餐”更符合上下文和庄重叙事语体。
- source_word: αὐτοῖς
  choice: 为他们
  rationale: 保留与格所表达的受益对象。
