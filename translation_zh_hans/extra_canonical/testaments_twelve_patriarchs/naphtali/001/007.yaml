base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/007.yaml
  text: For Rachel loved me greatly, because I was born upon her knees; and while I was still tender she kept kissing me, saying, ‘May I be given from my own womb a brother like you.’
translation:
  language: zh_hans
  text: 拉结非常爱我，因为我是在她膝上出生的。我还幼小的时候，她常常亲吻我，说：“愿我从自己腹中得一个像你一样的弟兄。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῶν γονάτων αὐτῆς
  choice: 在她膝上
  rationale: 保留原文与创世记30:3相关的生育、归属表达，不将其解释性改写为现代生产姿势。
- source_word: ἁπαλὸν ὄντα
  choice: 还幼小
  rationale: ἁπαλός本义为柔嫩、幼嫩；此处自然指年幼，译为“幼小”既通顺又不过度增添“孩子”等原文没有的名词。
- source_word: με κατεφίλει
  choice: 她常常亲吻我
  rationale: καταφιλέω可表示深情地或反复地亲吻；未完成时进一步呈现持续、反复的动作，因此用“常常亲吻”。
- source_word: Δοίη μοι
  choice: 愿我也能……得
  rationale: 保留希腊语愿望式的祈愿语气；“也”按语境表达拉结盼望自己同样生子的愿望。
- source_word: ἀδελφόν σου … κατά σε
  choice: 一个像你的兄弟
  rationale: ἀδελφόν σου直指“你的兄弟”，κατά σε表示“像你、照你的样子”；中文合并语序以求自然，并保留亲属关系。
theological_decisions:
- issue: “在她膝上出生”的含义
  choice: 直译为“在她膝上出生”
  alternative: 解释为“归在她名下出生”或“由她代为承受生育”
  rationale: 该说法可能涉及古代代理生育及认领习俗，但正文保留其形象和经文互文，不替读者消解其文化含义。
- issue: 祈愿对象是否明确为上帝
  choice: 保留无明示施予者的祈愿句
  alternative: 译为“愿上帝使我……”
  rationale: 原文使用无主语的愿望式，虽可理解为向上帝祈求，却没有明说，故不在正文补入“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“腹中”保留古代生育表达；引语自然流畅。所给希腊文本在“出生”后直接接καὶ ἔτι，并无“拉结生了我”的独立分句，因此未采纳修订记录中该增补。
