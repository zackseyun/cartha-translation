base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/001.yaml
  text: A copy of the testament of Naphtali, the eighth son of Jacob, which he ordained at the time of his departure, in the hundred and thirtieth year of his life.
translation:
  language: zh_hans
  text: 雅各和辟拉所生的第八个儿子拿弗他利的遗训。第一章　这是拿弗他利遗训的抄本，是他在离世之际，于一百三十岁那年所立的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη / διαθήκης
  choice: 遗训
  rationale: 在族长临终告诫的文学语境中，既表达临终训示，也避免现代法律用语“遗嘱”可能造成的范围收窄。
- source_word: ἀντίγραφον
  choice: 抄本
  rationale: 直接表达现存文本是所述遗训的副本或誊本。
- source_word: διέθετο
  choice: 所立的
  rationale: 该词与διαθήκη同源，在此指正式作出或设立遗训；“立”在现代汉语中自然、庄重，并保留正式意味。
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: 在离世之际
  rationale: 字面为“在他出去的时候”，在临终遗训语境中委婉指死亡；“离世”保留委婉而不误解为普通出行。
- source_word: ἐν ἔτει ἑκατοστῷ καὶ τριακοστῷ τῆς ζωῆς αὐτοῦ
  choice: 于一百三十岁那年
  rationale: 以自然现代汉语表达“在他生命的第一百三十年”，意义不变。
- source_word: Βάλλας
  choice: 辟拉
  rationale: 采用现代简体中文圣经中较常见的人名形式。
theological_decisions: []
