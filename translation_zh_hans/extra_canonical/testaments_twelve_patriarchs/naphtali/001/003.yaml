lexical_decisions:
- source_word: τὸ πρωί
  choice: 到了早晨
  rationale: 自然表达时间推进，同时准确保留“早晨”的含义。
- source_word: μετὰ τὸ ἐξυπνισθῆναι αὐτόν
  choice: 他醒来后
  rationale: 按希腊文不定式结构表达先后关系；代词所指在本节中保留为“他”。
- source_word: Ἀποθνήσκω
  choice: 我要死了
  rationale: 希腊文现在时在语境中表示死亡迫近；此译法符合现代汉语，也不额外限定死因或准确时刻。
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: 他们不相信他
  rationale: 忠实保留πιστεύω加与格所表达的“不相信某人所说的话”。
