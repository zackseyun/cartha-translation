base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/006.yaml
  text: I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me on Rachel’s knees, and for this reason she called my name Naphtali.
translation:
  language: zh_hans
  text: 我是辟拉所生的，因为拉结用了计谋，把辟拉代替自己给了雅各；辟拉就怀孕，在拉结膝上生下了我。因此，她给我起名叫拿弗他利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγεννήθην ἀπὸ Βάλλας
  choice: 我是辟拉所生的
  rationale: 按希腊文被动表达其母系出身；“所生的”自然而庄重。
- source_word: ἐν πανουργίᾳ ἐποίησε
  choice: 用了计谋
  rationale: πανουργία 在此表示机巧、谋略，也可能带负面意味；“用了计谋”保留这种张力，不进一步断定为欺骗或邪恶。
- source_word: ἀντʼ αὐτῆς
  choice: 代替自己
  rationale: 准确表达辟拉被交给雅各，取代拉结自身的位置。
- source_word: ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ
  choice: 在拉结膝上
  rationale: 保留古代代理生育或收纳孩子的具象习语，不将其解释性改写。
- source_word: ἐκάλεσε τὸ ὄνομά μου Νεφθαλείμ
  choice: 她给我起名叫拿弗他利
  rationale: 采用现代汉语常用命名表达，并沿用圣经人名的通行译法。
theological_decisions:
- issue: 拉结行为的道德评价
  choice: 用了计谋
  alternative: 行了诡诈／聪明地行事
  rationale: 希腊词可带机敏或狡黠色彩；正文不把其道德性质说得比原文更确定。
- issue: “在拉结膝上生”的含义
  choice: 保留字面意象
  alternative: 为拉结生下我／由拉结收为己子
  rationale: 原文只陈述在其膝上生产，不明确解释法律、收养或代理生育层面的具体意义。
- issue: 末句“她”的指代
  choice: 保留“她”
  alternative: 明确写作“拉结”
  rationale: 希腊文动词主语未明说，近文可能指拉结；用代词既符合上下文，也避免添加原文没有再次明示的姓名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；分号保留因果叙事的连续性。人名采用简体中文圣经通行译名：辟拉、拉结、雅各、拿弗他利。
