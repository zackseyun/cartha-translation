base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009.yaml
  text: 'And after commanding them many such things[[Here begins ...]], he urged them to carry his bones to Hebron and bury him with his fathers.


    2. And after eating and drinking with gladness of soul, he covered his face and died.


    3. And his sons did in every respect all that Naphtali their father had commanded them.


    [Here begins the Testament of Gad, the ninth son of Jacob and Zilpah.]'
translation:
  language: zh_hans
  text: '**拿弗他利遗训 9**


    1 在吩咐他们许多这样的事之后，他恳切嘱咐他们将他的骸骨迁葬到希伯仑，与他的列祖同葬。


    2 他怀着喜乐的心吃喝之后，遮住自己的脸，就死了。


    3 他的儿子们凡事都照他们的父亲拿弗他利所吩咐的去做。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 英语审校记录称，希腊见证在此后接有下一部作品的篇首语：“以下开始雅各和悉帕第九个儿子迦得的遗训。”然而，本任务所提供的希腊原文摘录止于本节，未显示这句话。因此，本译文不将其列为《拿弗他利遗训》的正文。
    reason: 所给希腊原文摘录与英语审校轨迹对篇首副文本的报告不完全一致；以脚注保留这一资料差异，避免将未能从所给希腊字符串核对的文字并入正文。
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: 吩咐
  rationale: 此词表示具有约束力的嘱令；“吩咐”既贴近临终遗命的语境，又比“命令”更符合父亲向儿子交代后事的自然汉语表达。
- source_word: παρεκάλεσεν
  choice: 恳切嘱咐
  rationale: 该动词在此带有郑重劝请、敦促之意；“恳切嘱咐”保留临终请求的迫切与亲情色彩。
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: 把他的骸骨迁到
  rationale: μετακομίζω指从一处迁往另一处，ὀστᾶ明确指骨头；“迁到……骸骨”保留具体的迁葬习俗，不泛化为“遗体”。
- source_word: ἐν Χεβρών
  choice: 到希伯仑
  rationale: 介词ἐν字面常为“在”，但受表示迁移的动词支配时，此处按目的地理解最为自然。
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: 与他的列祖葬在一起
  rationale: “列祖”保留宗族和先祖的庄重语域；补出“葬在一起”使汉语关系清楚，同时不改变原意。
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: 心里欢喜地
  rationale: 原短语直指内在生命的喜乐状态；此译自然清楚，并保留安详离世的氛围。
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: 蒙上自己的脸
  rationale: 按原文具体动作直译；“蒙上”比“遮住”更符合用布覆面的语境，同时不额外解释其礼俗含义。
- source_word: κατὰ πάντα
  choice: 凡事都
  rationale: 表达全面、无遗漏地遵行，符合现代汉语习惯。
- source_word: ὅσα ἐνετείλατο αὐτοῖς
  choice: 照……所吩咐的去做
  rationale: 传达儿子们执行父亲全部遗命的意思，并保持语句流畅。
theological_decisions:
- issue: 是否把下一篇《迦得遗训》的篇首语收入正文
  choice: 不作为本章正文刊出，并以脚注交代资料层之间的差异
  alternative: 在第3节后以方括号刊出“以下开始雅各和悉帕第九个儿子迦得的遗训”
  rationale: 本任务所提供的希腊原文止于拿弗他利9:3，并未实际列出该篇首语；虽然英语审校层称其见于希腊见证，但在当前可核验的原文字符串中缺失。为坚持原文证据优先，不将无法从所给希腊文直接核对的文字并入正文，同时以脚注透明说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“骸骨”“列祖”等与族长安葬传统相称的具体用语；叙事句式简洁，避免加入死亡礼俗或神学意义方面的解释。
