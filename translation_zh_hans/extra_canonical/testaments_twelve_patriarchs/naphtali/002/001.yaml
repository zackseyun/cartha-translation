  text: My mother Bilhah was the daughter of Rotheus, the brother of Deborah, the nurse of Rebecca; she was born on the same day as Rachel. 10 And Rotheus was of the lineage of Abraham, a Chaldean, God-fearing, freeborn and noble. 11 And having been taken captive, he was bought by Laban; and Laban gave him his maidservant Eunan as a wife, and she bore a daughter, and he called her name Zelpha, after the name of the city in which he had been taken captive. 12 And after this she bore Bilhah, saying, ‘My daughter is one who renews.’ II. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he indeed blessed me as a deer.
translation:
  language: zh_hans
  text: 2:1 我脚步轻快，如同鹿；我父亲雅各派我传递各种消息，还把我比作鹿来祝福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹿”所译的希腊词也可特指“母鹿”。“传递各种消息”也可理解为“办理各样差事”或“承担各种使命”。末句直译为“他祝福我如同鹿一样”，其具体所指未明。
    reason: 保留ἔλαφος可能的性别义、ἀγγελία在“消息”与“受托事务”之间的语义空间，并说明ὡσεὶ ἔλαφον的比拟表达未具体说明祝福的内容。
lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν
  choice: 脚步轻快
  rationale: κοῦφος在此结合“脚”表示轻捷、敏捷；译为“脚步轻快”自然且不夸大为单纯速度。
- source_word: ἔλαφος
  choice: 母鹿
  rationale: 该希腊词通常泛指鹿，也可按此处传统意象理解为母鹿；采用“母鹿”与拿弗他利受祝福的鹿之意象相合，同时用脚注保留词义范围。
- source_word: ἔταξέ με
  choice: 派我
  rationale: 表示指定、安排某人承担任务；在“传信/差事”的语境中译作“派我”最自然。
- source_word: εἰς πᾶσαν ἀγγελίαν
  choice: 办理各样差事
  rationale: ἀγγελία可指消息、传信或受托任务；此处表示被派遣执行各种传信差事，中文以“办理各样差事”兼顾范围与流畅度。
- source_word: καίγε ὡσεὶ ἔλαφόν με ηὐλόγησεν
  choice: 并且确实照母鹿的形象为我祝福
  rationale: καίγε带强调意味；ὡσεὶ ἔλαφον修饰祝福的方式或比拟内容。译文保留“如鹿蒙祝福”这一略显含蓄的表达，不擅自补出具体祝词。
theological_decisions:
- issue: 雅各祝福与鹿之比拟的具体含义
  choice: 保留“照母鹿的形象为我祝福”的比拟表达
  alternative: 译为“祝福我，使我像母鹿一样敏捷”
  rationale: 原文没有明说祝福使他说话优美、行动敏捷或获得其他特质；不把比拟具体化，可保留文本的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“脚步轻快”呈现口语可懂性，“确实”传达原文强调语气；不引入超出希腊文本的神学解释。
