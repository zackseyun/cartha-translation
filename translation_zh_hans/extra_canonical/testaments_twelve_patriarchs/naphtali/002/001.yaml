  - severity: medium
    issue: “照母鹿的形象为我祝福”对末句的中文表达生硬，并将比拟关系处理为“形象”。
    rationale: ὡσεὶ表示“如同、好像”的比拟；“把我比作鹿来祝福”较准确地保留其开放性，而不补入祝福的具体内容。
  - severity: low
