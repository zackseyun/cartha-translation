  text: 9. Οὕτως⁷⁶ ⌜οὖν⌝ *ἔστωσαν, τέκνα μου, πάντα τὰ ἔργα ὑμῶν ἐν τάξει εἰς ἀγαθόν⁷⁷ ἐν φόβῳ Θεοῦ, καὶ μηδὲν ἄτακτον ποιήσητε⁷⁸ ἐν καταφρονήσει, μηδὲ⁷⁹ ἔξω⁸⁰ *καιροῦ αὐτοῦ⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/009.yaml
  text: So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们所做的一切都要在敬畏上帝中井然有序，趋向良善；不要因轻蔑而做任何混乱失序的事，也不要不合时宜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τάξει
  choice: 井然有序
  rationale: 保留“按秩序、合乎次序”的核心意义，同时使用自然的现代汉语表达。
- source_word: εἰς ἀγαθόν
  choice: 趋向良善
  rationale: 保留介词短语所表达的目标或结果方向，不将其弱化为单纯的方式状语。
- source_word: ἐν φόβῳ Θεοῦ
  choice: 在敬畏上帝中
  rationale: 直译其领域或处境含义，并采用庄重而通行的宗教用语。
- source_word: ἄτακτον
  choice: 混乱失序的事
  rationale: 对应与“井然有序”相反的状态，兼顾“无秩序、不守规矩”的语义。
- source_word: ἐν καταφρονήσει
  choice: 因轻蔑而
  rationale: 将该短语理解为行为的心态或动因；“轻蔑”保留其蔑视、轻看的力度。
- source_word: ἔξω καιροῦ αὐτοῦ
  choice: 不合时宜
  rationale: 自然表达“在其适当时机之外”；上下文中的所属对象在汉语里可隐含，不必生硬译作“在它的时间之外”。
theological_decisions:
- issue: φόβος Θεοῦ 的性质
  choice: 敬畏上帝
  alternative: 惧怕上帝
  rationale: “敬畏”能涵盖对上帝的畏惧与尊崇，且不额外限定为单纯恐惧。
- issue: ἐν καταφρονήσει 所指向的蔑视对象
  choice: 不补出具体对象
  alternative: 因轻蔑上帝而
  rationale: 希腊文本没有明说受轻蔑的对象；不补足可保存原文的开放性。
- issue: αὐτοῦ 的指代
  choice: 以“不合时宜”概括处理
  alternative: 在它自己的适当时间之外
  rationale: 希腊语代词所指可能与所做之事相关；汉语概括表达既保存“适时”的要求，也避免武断固定其语法指代。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“所以，我的孩子们”保留承接关系与父辈训诲口吻；分号呈现两层并列劝勉。
