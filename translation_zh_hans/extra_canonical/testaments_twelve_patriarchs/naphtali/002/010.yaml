source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. *Ὅτι ἐὰν εἴπῃς τῷ ὀφθαλμῷ, Ἄκουε, οὐ δυνήσεται⁸²· οὕτως οὐδὲ *ἐν σκότει⁸³ *ὄντες δύνασθε ποιεῖν⁸⁴ ἔργα⁸⁵ φωτός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/010.yaml
  text: For if you say to the eye, “Hear,” it cannot; so neither, being in darkness, can you do the works of light.
translation:
  language: zh_hans
  text: 因为，即使你对眼睛说：“听吧！”它也做不到；同样，你们身在黑暗中，也不能做光明的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμῷ
  choice: 眼睛
  rationale: 按其普通身体器官义直译，并与“听”形成刻意的感官错置。
- source_word: Ἄκουε
  choice: 听吧
  rationale: 保留现在时命令语气；“吧”使现代汉语表达自然，又不削弱命令意味。
- source_word: οὐ δυνήσεται
  choice: 它办不到
  rationale: 表达能力上的不可能，而非意愿上的拒绝。
- source_word: ἐν σκότει ὄντες
  choice: 身在黑暗中
  rationale: 自然地保留处境性表达，不擅自把“黑暗”限定为道德、属灵或物理意义。
- source_word: ποιεῖν ἔργα φωτός
  choice: 行光明的事
  rationale: “行……的事”既传达ποιεῖν与ἔργα，也保持庄重、易懂；“光明”保留原文意象。
theological_decisions:
- issue: “黑暗”与“光明”的性质
  choice: 保留为未加解释的对照意象
  alternative: 明确译为“罪恶中”与“善行”
  rationale: 原文使用σκότος与φῶς的隐喻，却未在本句中明确限定其伦理或属灵内涵，因此不在译文中替作者释义。
- issue: “光明的事”的表达
  choice: 行光明的事
  alternative: 做光明的工作／行光明的行为
  rationale: 所选译法保留ἔργα的宽泛意义，不把它缩窄为职业性的“工作”或纯伦理性的“行为”。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“眼睛—听”的不协调按原文保留；分号呈现类比关系，“同样”对应οὕτως οὐδὲ。无须添加脚注。
