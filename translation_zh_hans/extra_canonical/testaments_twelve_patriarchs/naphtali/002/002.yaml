source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καθὼς⁹ γὰρ *οἶδεν ὁ κεραμεὺς¹⁰ τὸ σκεῦος πόσον χωρεῖ, καὶ πρὸς αὐτὸ¹¹ φέρει τὸν¹² πηλόν, οὕτω¹³ καὶ ὁ Κύριος πρὸς ὁμοίωσιν τοῦ πνεύματος¹⁴ ποιεῖ¹⁵ τὸ σῶμα, καὶ πρὸς τὴν δύναμιν τοῦ σώματος¹⁶ *τὸ πνεῦμα ἐπιτίθησιν¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/002.yaml
  text: For just as the potter knows how much the vessel can hold, and according to that brings the clay for it, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body's capacity places the spirit in it.
translation:
  language: zh_hans
  text: 因为正如陶匠知道器皿能容纳多少，便按着它所能容纳的分量备泥；同样，主也照着灵的样式造身体，又照着身体的承受能力，把灵安置在其中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεραμεύς
  choice: 陶匠
  rationale: 准确表达制作陶器的工匠，符合现代汉语常用而庄重的表达。
- source_word: σκεῦος
  choice: 器皿
  rationale: 保留该词作为容器的宽泛含义，也与陶匠和容量的语境自然衔接。
- source_word: πόσον χωρεῖ
  choice: 能容纳多少
  rationale: 直译其容量意义，不把它具体化为体积、重量或用途。
- source_word: πρὸς αὐτὸ φέρει τὸν πηλόν
  choice: 照着这个分量取泥来做它
  rationale: 表达陶匠按器皿容量备取泥土的意思；“来做它”明确αὐτό所指的器皿，同时不引入额外的作品概念。
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: 照着灵的样式
  rationale: 保留ὁμοίωσις的“样式、相似形态”意义及原文中身体与灵关系的张力，不改释为单纯的大小或性质。
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος
  choice: 照着身体的承受能力
  rationale: δύναμις本可指能力、力量；结合器皿容量的比喻，译作“承受能力”较自然，但仍保留能力范畴。
- source_word: τὸ πνεῦμα ἐπιτίθησιν
  choice: 把灵安置其中
  rationale: ἐπιτίθημι在此表示放置、赋置；“安置”庄重自然，“其中”依上下文指身体。
theological_decisions:
- issue: πνεῦμα所指
  choice: 译作“灵”，不加“人的”或“神的”限定
  alternative: 人的灵／神所赐的灵
  rationale: 原文仅用定冠词加πνεῦμα，具体所指可由上下文理解；不补充限定，以免消除原有歧义。
- issue: 身体与灵形成次序及对应关系
  choice: 保留“照着灵的样式造身体”与“照着身体的承受能力安置灵”的双向表述
  alternative: 解释为主先按灵的性质塑造身体，再按身体容量赐予灵
  rationale: 原文呈现带有张力的对应关系，并未系统说明时间次序或机制，因此不作教义化展开。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“因为……；同样……”呈现原文因果与类比结构；避免古奥词和宗派性术语。
