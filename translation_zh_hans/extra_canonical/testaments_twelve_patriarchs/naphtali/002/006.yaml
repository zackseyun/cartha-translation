  text: 6. *Ὡς γὰρ ἡ ἰσχὺς αὐτοῦ, οὕτως⁴⁸ καὶ ὁ λόγος αὐτοῦ⁵⁰, ἢ ἐν νόμῳ Κυρίου, ἢ ἐν νόμῳ⁵¹ τοῦ⁵² Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/006.yaml
  text: As a person's strength is, so also is his word, whether in the law of the Lord or in the works of Beliar.
translation:
  language: zh_hans
  text: 因为人的力量如何，他的话语也如何；无论是在主的律法中，还是在彼列的律法中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一底本或读法将末句作“还是在彼列的作为中”。本译文依所给希腊正文，该正文在此重复“律法”一词。
    reason: 所给希腊正文的末句为ἐν νόμῳ τοῦ Βελίαρ，而英文审校轨迹反映的另一读法/底本为“彼列的作为”。脚注提示这一差异，正文则忠实按指定源文翻译。
lexical_decisions:
- source_word: ἰσχὺς
  choice: 力量
  rationale: 保留原词表示能力、强力的基本含义，并与后句“话语”形成原文的对应关系。
- source_word: λόγος
  choice: 话语
  rationale: 按所给希腊文本直译为“话语”，不采用旧修订中的“行为”。
- source_word: νόμῳ Κυρίου
  choice: 主的律法中
  rationale: 保留 νόμος 的“律法”含义及介词结构。
- source_word: νόμῳ τοῦ Βελίαρ
  choice: 彼列的律法中
  rationale: 所给希腊正文明确重复 νόμῳ，因此优先依据原文译作“律法”，而不随英文审校层改作“作为”。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用此犹太文献中该专名的常见汉语音译，避免将其解释性改译为“魔鬼”或“邪恶者”。
theological_decisions:
- issue: “主的律法”与“彼列的律法”的平行关系
  choice: 保留两者均为“律法”
  alternative: 将后者译作“彼列的作为”
  rationale: 当前提供的希腊正文为 ἐν νόμῳ……ἐν νόμῳ，具有刻意的平行结构；英文修订理由所称 ἔργοις 与所给原文不一致，不能据此覆盖原文证据。
- issue: 力量与话语之间关系的性质
  choice: 保留简洁类比，不补明善恶或真实性等解释
  alternative: 解释为“人的话语反映其力量/品格”
  rationale: 原句只陈述对应关系，含义具有一定开放性，不宜加入原文未明说的神学或伦理解释。
translation_notes:
  register: 采用现代、庄重且易懂的表达。“因为……怎样……也怎样”保留原句格言式结构；“无论是……还是……”自然呈现两个领域的并列。
