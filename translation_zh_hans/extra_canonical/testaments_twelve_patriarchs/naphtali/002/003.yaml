base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/003.yaml
  text: And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.
translation:
  language: zh_hans
  text: 其中毫无欠缺，甚至连一根头发的三分之一也不差；因为一切受造之物都是照着衡量、尺度和准则而成的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνλεῖπον
  choice: 欠缺
  rationale: 表达数量或完整性上毫无短少，贴合上下文的精确计量意象。
- source_word: ἐκ τοῦ ἑνὸς τρίτου τριχός
  choice: 不差一根头发的三分之一
  rationale: 保留希腊文极小量度的具体夸张表达，不将其泛化为“丝毫”。
- source_word: σταθμῷ
  choice: 重量
  rationale: 在与“尺度、准则”并列的计量语境中，译作“重量”自然明确。
- source_word: μέτρῳ
  choice: 尺度
  rationale: 既保留度量含义，也适合与“重量”和“准则”并列。
- source_word: κανόνι
  choice: 准则
  rationale: 保留作为规范、标准的含义，避免仅译成具体器具“尺”。
- source_word: πᾶσα κτίσις
  choice: 一切受造之物
  rationale: κτίσις可指创造或受造界；此处与ἐγένετο搭配，理解为每一受造之物更顺畅，也保留神学语域。
- source_word: ἐγένετο
  choice: 造成的
  rationale: 表达进入存在、被造而成之意；结合κτίσις采用自然的中文被动结构。
theological_decisions:
- issue: πᾶσα κτίσις是指“整个创造”还是“一切受造之物”
  choice: 一切受造之物
  alternative: 整个受造界
  rationale: 希腊文形式允许集合性或个体总称理解；“一切受造之物”较贴近πᾶσα的全称意味，且不额外界定宇宙论范围。
- issue: 是否明确创造者为上帝
  choice: 不补出主语
  alternative: 上帝创造万物时，都按重量、尺度和准则
  rationale: 原文使用ἐγένετο而未明说施事者；译文保留这种语法含蓄，不增添原文未明示的信息。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一根头发的三分之一”刻意保留原文具体而奇特的微量比喻；后半句用“重量、尺度和准则”的三项并列，呈现原文节奏。原文校勘符号与脚注编号未提供对应异文内容，因此不转入正文。
