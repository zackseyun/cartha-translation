base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/005.yaml
  text: For there is no creation and no thought that the Lord does not know; for he created all things, and he created man in his own image.
translation:
  language: zh_hans
  text: 因为，没有任何受造之物，也没有任何意念是主所不知道的；万物都是他创造的，他又照着自己的形象造了人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句现存希腊文本的语法有讹乱；这里依上下文理解为：主创造了万物，并照着自己的形象造了人。
    reason: 底本后半句“πάντα γὰρ ὁ ἄνθρωπον ἔκτισεν……”在格、冠词和句法上不规则；正文需作最小限度的整理，同时向读者说明文本状况。
lexical_decisions:
- source_word: πλάσμα
  choice: 受造之物
  rationale: 该词指被塑造、被造之物；此处与主的创造相联系，译为“受造之物”既贴近词义，也比抽象的“创造”更符合可数对象的语境。
- source_word: πᾶσα ἔννοια
  choice: 任何意念
  rationale: ἔννοια可指思想、意念或心中的筹划；“任何意念”保留其范围，不将其窄化为“目的”。
- source_word: ἔγνω
  choice: 知道
  rationale: 采用γινώσκω的常用认知义；否定结构自然译为“主所不知道的”。
- source_word: πάντα
  choice: 万物
  rationale: 按中性复数的通常用法译作“万物”，与前半句的“受造之物”相应。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 保留原文单数类称，不扩写为“每一个人”，也不采用带明显性别限定的“男人”。
- source_word: κατʼ εἰκόνα ἑαυτοῦ
  choice: 照着自己的形象
  rationale: 直接保留“形象”这一神学用语，并使反身代词自然回指创造者。
theological_decisions:
- issue: 主对受造界与意念的知识
  choice: “没有任何受造之物，也没有任何意念是主所不知道的”
  alternative: “主无不知晓他所造之物的每一目的”
  rationale: 原文并列πλάσμα与πᾶσα ἔννοια，更自然地表达两个范围，不宜把二者合并为“受造物的目的”，以免缩窄主所知道的对象。
- issue: 人按创造者的形象受造
  choice: “他又照着自己的形象造了人”
  alternative: “他照着自己的形象造了每一个人”
  rationale: 原文为单数ἄνθρωπον，宜作类称“人”；不从语法形式进一步推导个体化的神学表述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万物都是他创造的”明确表达原文所指的创造者，再以“他又”衔接造人句；正文不复制底本的语法讹乱，而用脚注公开说明。
