id: T12P.NAP.2.7
reference: Testament of Naphtali 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ ὡς⁵³ κεχώρισται ἀνάμεσον *τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους⁵⁴ *δράσεώς τε καὶ ἀκοῆς⁵⁵, οὕτως⁵⁶ κεχώρισται ἀνάμεσον ἀνδρὸς καὶ *ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ⁵⁷ γυναικός⁵⁸, καὶ οὐκ ἔστιν εἰπεῖν ὅτι †*ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν †⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/007.yaml
  text: And just as there is a division between light and darkness, and between sight and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in appearance one is inferior to another.
translation:
  language: zh_hans
  text: 正如光与暗彼此有别，视觉与听觉彼此有别，男人与男人之间、女人与女人之间也同样有分别；不能说在容貌上，这一个就不如另一个。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希腊文本和句法不甚确定；也可能理解为“不能说在人的面貌中，一个比另一个差”。
    reason: 底本以校勘符号标示末句有疑难，且ἐν τῷ ἑνὶ τοῖς προσώποις的搭配异常；脚注让读者看见真实的文本不确定性，而不在正文中强行消除。
lexical_decisions:
- source_word: κεχώρισται
  choice: 彼此有别／有分别
  rationale: 该完成时被动形式表达已经区分、彼此分开的状态；中文用“有别／有分别”既自然，也保留原文反复强调差异的语气。
- source_word: δράσεώς τε καὶ ἀκοῆς
  choice: 视觉与听觉
  rationale: ἀκοή是“听觉”；δρᾶσις在此与之并列，宜理解为视觉或观看能力。译作两种感官名词，比“看与听”更贴合原文形式。
- source_word: ἀνδρὸς καὶ ἀνδρός / γυναικὸς καὶ γυναικός
  choice: 男人与男人之间／女人与女人之间
  rationale: 保留原文按性别所作的个体间比较，不泛化为所有人，也不额外解释差别的性质。
- source_word: προσώποις
  choice: 容貌上
  rationale: πρόσωπον可指脸、容貌或人；本句语境是在比较个体，译作“容貌”可通顺承接“不如”，但原句文本和句法均不稳定，故附注说明。
- source_word: ἡττόμενον
  choice: 不如
  rationale: 该词表示较弱、较差或居于劣势；“不如”保留比较含义，同时避免擅自限定为美丑、尊卑或道德优劣。
theological_decisions:
- issue: 末句是否断言所有人在各方面完全相同
  choice: 仅译为不能凭容貌断言一人不如另一人
  alternative: 不能说一个人在所有方面都与另一个人相同
  rationale: “在所有方面”和“相同”在现存希腊文中没有明确对应词；按可辨认的ἐν…προσώποις与ἡττόμενον，较稳妥地保留“容貌／面貌”和“较差”的比较，同时不把经文扩展为全面同一的主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此有别／有分别”保持原文排比；末句用“这一个就不如另一个”呈现比较关系，不引入美貌、价值、地位或本质平等等原文未明说的观念。
