source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Καὶ καθὼς²⁵ οἶδεν²⁶ ὁ κεραμεὺς ἑνὸς ἑκάστου τὴν χρῆσιν †ὡς²⁷ ἱκανή²⁸, οὕτω²⁹ καὶ ὁ Κύριος οἶδε τὸ σῶμα, ἕως τίνος διαρκέσει ἐν *τῷ ἀγαθῷ³⁰, καὶ πότε ἔρχεται³¹ *ἐν κακῷ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/004.yaml
  text: And just as the potter knows the use of each one, as it is fit, so also the Lord knows the body, how long it will endure in good, and when it comes into evil.
translation:
  language: zh_hans
  text: 正如陶匠知道每一件器物[a]适合何种用途，主也同样知道身体在善中会持续多久，以及何时进入恶中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“每一个”；此处按陶匠的语境补出“器物”。
    reason: 说明为使汉语表达完整而补出的隐含名词，并保留原文未明说名词的形式信息。
lexical_decisions:
- source_word: ὁ κεραμεὺς
  choice: 陶匠
  rationale: 直接对应希腊文，保留制陶者与受造器物的比喻。
- source_word: ἑνὸς ἑκάστου
  choice: 每一件器物
  rationale: 原文直译为“每一个”，但在陶匠的语境中所指自然是各件器物；正文补出“器物”以使现代汉语清楚流畅，并以脚注说明原文省略名词。
- source_word: τὴν χρῆσιν
  choice: 适合什么用途
  rationale: χρῆσις 指用途、功用；结合后面的 ἱκανή，以自然汉语表达器物与用途的适配。
- source_word: τὸ σῶμα
  choice: 人的身体
  rationale: 原文为“身体”；汉语补出“人的”以明确语境所指，不改变其意义。
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: 能在善中持守多久
  rationale: 保留“在善中”的抽象道德表达；διαρκέω 表示持续、坚持，译作“持守”兼顾持续性与伦理语境。
- source_word: ἔρχεται ἐν κακῷ
  choice: 落入恶中
  rationale: 原文形式上是“来到/进入恶中”；“落入”符合现代汉语习惯，同时保留由善转入恶的意味。
theological_decisions:
- issue: 主对身体在善恶中的历程之认识
  choice: 译作“主也同样知道人的身体：它能在善中持守多久，又会在何时落入恶中”
  alternative: 可译为“主也知道身体将在善中持续到何时，以及何时进入恶中”
  rationale: 不把“知道”扩展解释为预定，也不把“身体”改释为灵魂、人格或人性；保留原文关于主之知识与人身道德历程之间的张力。
- issue: ἀγαθόν 与 κακόν 的语义
  choice: 译作“善”与“恶”
  alternative: 可按处境译作“良好状态”与“败坏状态”
  rationale: 原文可带道德或状态色彩；采用宽泛的“善/恶”以保存其歧义，避免擅自限定为身体健康、道德行为或最终命运。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在善中持守”“落入恶中”保留原文抽象、伦理性的措辞；用冒号呈现后半句对“主知道人的身体”的具体说明。
