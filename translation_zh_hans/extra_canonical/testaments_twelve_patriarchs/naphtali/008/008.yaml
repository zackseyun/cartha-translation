  text: 8. Καιρὸς γὰρ συνουσίας⁵¹ γυναικός⁵², καὶ καιρὸς ἐγκρατείας⁵³ εἰς προσευχὴν αὐτοῦ⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/008.yaml
  text: For there is a time for a man to come together with a woman, and a time for self-control for his prayer.
translation:
  language: zh_hans
  text: 因为，与女人交合有时候；为自己的祷告而自制，也有时候。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνουσίας γυναικός
  choice: 与妻子同房
  rationale: συνουσία 在此指男女之间的性结合；“同房”在现代中文中自然、庄重且明确。γυνή 可指“女人”或“妻子”，这里在合宜性伦理语境中译作“妻子”，避免中文里“与女人同房”可能产生的泛指或婚外含义。
- source_word: ἐγκρατείας
  choice: 节制
  rationale: 该词表示自制、克制；此处与同房相对，并以祷告为目的，译作“节制”既保留一般的自我约束含义，也不把原文过度具体化为固定期限的禁欲。
- source_word: εἰς προσευχὴν αὐτοῦ
  choice: 为祷告而
  rationale: εἰς 在这里表达目的。“为祷告而”准确传达节制的目的；αὐτοῦ 的单数属格在中文中不必生硬译出“他的”，上下文主语已隐含其中。
- source_word: καιρὸς ... καὶ καιρὸς
  choice: 有其时候……也有其时候
  rationale: 保留原文平衡、对称的时序表达，同时符合现代汉语习惯。
theological_decisions:
- issue: 节制是否应明确限定为禁欲或停止夫妻同房
  choice: 保留较宽的“节制”，由与“同房”的对照显出具体语境
  alternative: “禁欲”或“停止同房”
  rationale: ἐγκράτεια 本身是较广义的自制；虽然上下文很可能特指性生活方面的克制，直接译作“禁欲”会把含义收窄并强化原文未明说的程度。
- issue: γυναικός 应译为“女人”还是“妻子”
  choice: 妻子
  alternative: 女人
  rationale: 原词形式上允许两义，但本句谈论合宜时间中的性结合；现代中文译作“妻子”更自然，也避免无意暗示一般性的男女关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保持原文两项对称：“同房有其时候”与“为祷告而节制也有其时候”。不添加原文没有的教派性规定或禁欲期限。
