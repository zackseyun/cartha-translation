source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. Τὸν δὲ μὴ *ποιοῦντα τὸ³⁸ καλόν, καταράσονται αὐτὸν³⁹ καὶ⁴⁰ *οἱ ἄγγελοι καὶ οἱ ἄνθρωποι⁴¹, *καὶ ὁ Θεὸς ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ⁴², *καὶ ὁ⁴³ διάβολος οἰκειοῦται *αὐτὸν ὡς ἴδιον σκεῦος⁴⁴, καὶ πᾶν θηρίον κατακυριεύσει αὐτῷ⁴⁵, καὶ⁴⁶ ὁ Κύριος μισήσει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/006.yaml
  text: But the one who does not do good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.
translation:
  language: zh_hans
  text: 但不行善的人，天使和世人都要咒诅他；上帝也要因他而在列国中蒙羞；魔鬼把他据为己有，视为自己的器皿；百兽都要辖制他；主也要恨他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ποιοῦντα τὸ καλόν
  choice: 不行善的人
  rationale: 简洁自然地表达“不做善事/不实行善”的含义，并贴近希腊文措辞。
- source_word: καταράσονται
  choice: 要咒诅
  rationale: 保留将来时态和强烈的诅咒含义。
- source_word: ἀδοξήσει
  choice: 蒙羞
  rationale: 该词在此与“得荣耀”相反；译为“蒙羞”能自然表达上帝的名誉因这人而在列国中受损。
- source_word: οἰκειοῦται
  choice: 把他据为己有
  rationale: 表达魔鬼将此人认作并占为自己所有；用进行性较弱的汉语陈述保留希腊文现在时的概括意义。
- source_word: ἴδιον σκεῦος
  choice: 自己的器皿
  rationale: 保留“器皿”这一具体隐喻，不将其解释性改写为“工具”。
- source_word: πᾶν θηρίον
  choice: 百兽
  rationale: 以自然凝练的汉语表达“每一种野兽/一切野兽”，不额外限定具体物种。
- source_word: κατακυριεύσει
  choice: 要辖制
  rationale: 保留强力支配、制服的语义，同时符合庄重的经文语体。
- source_word: μισήσει
  choice: 要恨
  rationale: 直接保留原文强烈的“恨”字，不弱化为“不喜悦”或“弃绝”。
theological_decisions:
- issue: 上帝因恶人而在列国中“ἀδοξήσει”
  choice: 上帝也要因他而在列国中蒙羞
  alternative: 上帝也要因他而在列国中失去荣耀
  rationale: “蒙羞”在现代汉语中更自然，并保持原文中上帝的荣耀因人的行为受到损害这一张力；不进一步解释为列国亵渎上帝。
- issue: 主对不行善者的态度
  choice: 主也要恨他
  alternative: 主也要厌恶他
  rationale: 原文 μισήσει 明确而强烈，故不作神学性缓和。
- issue: 魔鬼与恶人的所属关系
  choice: 魔鬼要把他据为己有，当作自己的器皿
  alternative: 魔鬼把他认作自己的工具
  rationale: 既呈现 οἰκειοῦται 的据有关系，也保留 σκεῦος 的器皿隐喻，不把所属关系解释成附身或终极归属。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。各分句以分号连接，保存原文层层递进的审判陈述；“器皿”“辖制”“咒诅”等词兼顾源文意象与经文语体。
