  naturalness: 整体庄重、自然，分号串联也清楚。“视为自己的器皿”比“当作自己的器皿”稍更顺畅，并能表达 ὡς 的“作为／视作”关系。
  terminology: “咒诅”“蒙羞”“魔鬼”“器皿”“辖制”“主”均与原文及中文经文语体相称。“百兽”可表达 πᾶν θηρίον 的集体性用法，保留不改。
