  text: For the commandments of the law are twofold, and they are fulfilled with skill.
translation:
  language: zh_hans
  text: 因为律法的诫命是双重的，且须以技巧来遵行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以技巧”也可译为“娴熟地”或“按技艺”。
    reason: 提示μετὰ τέχνης所含技巧、技艺和熟练方法的语义范围；正文不将其限定为“智慧”。
lexical_decisions:
- source_word: διπλαῖ
  choice: 双重的
  rationale: 直译其“双重、成双”的含义，同时保留原文未具体说明是哪两个层面的含混性。
- source_word: μετὰ τέχνης
  choice: 以智慧
  rationale: τέχνη在此指有技巧、有见识地行事；译作“以智慧”比生硬的“以技巧”更符合现代汉语中履行诫命的语境。
- source_word: πληροῦνται
  choice: 要……成全
  rationale: 保留“使之达到完全、充分实行”的语义；汉语用主动式泛指人应当如此履行，表达自然。
theological_decisions:
- issue: “律法的诫命是双重的”的具体所指
  choice: 保留“双重的”，不加解释
  alternative: 解释为爱神与爱人，或言语与行为等两个方面
  rationale: 本句本身没有界定这双重性；直接补明会把特定解释写入正文。
- issue: πληροῦνται的语气
  choice: 译为规范性的“要……成全”
  alternative: 陈述性的“得以成全”
  rationale: 上下文为训诫性话语，中文用“要”能自然传达应当履行之意，但不限定具体履行方式。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“双重的”刻意保留原文的概括性；“成全”呼应律法语境中充分实行、达到圆满之意。
