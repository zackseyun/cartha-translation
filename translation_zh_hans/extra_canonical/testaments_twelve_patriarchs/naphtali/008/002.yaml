  naturalness: 修订后语序更符合现代庄重书面语；“在他里面”虽略带字面感，但保留ἐν αὐτῷ及其未明说的指代，不应擅自改为“在犹大里面”。
  terminology: 保留“利未”“犹大”“以色列”“雅各”和“救恩”。“联合”比“同心合一”更贴近原文，不额外加入“同心”的解释性意味。
  issues:
