revisions:
- from: 所以，你们也要嘱咐自己的儿女，与利未和犹大同心合一。因为救恩必借着犹大[a]为以色列兴起，雅各也必在他里面[b]蒙福。
  to: 所以，你们也要吩咐你们的儿女，要与利未和犹大联合。因为以色列的救恩必借着犹大[a]兴起，雅各也必在他里面[b]蒙福。
  rationale: 修订明确了命令的内容和“为以色列”的关系，避免对“联合”作不必要强化；同时保留救恩经由犹大而来以及“在他里面”的原文表达，不将其解释为特定后世教义。两处校勘存疑仍以脚注标示。
