source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ὑμεῖς Γοὖν⁵, ἐντείλασθε τοῖς τέκνοις ὑμῶν⁶ ἵνα ἑνοῦνται τῷ Λευὶ καὶ τῷ⁷ Ἰούδα. Διὰ γὰρ †τοῦ Ἰούδα†⁸ ἀνατελεῖ⁹ ἡ¹⁰ σωτηρία¹¹ τῷ Ἰσραὴλ¹², καὶ ἐν †αὐτῷ¹³ εὐλογηθήσεται¹⁴ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/002.yaml
  text: And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.
translation:
  language: zh_hans
  text: 所以，你们也要吩咐你们的儿女，要与利未和犹大联合。因为以色列的救恩必借着犹大[a]兴起，雅各也必在他里面[b]蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大”在所据希腊文本中被编者标为文本存疑；这里按该文本所载读法翻译。
    reason: 原文校勘符号将τοῦ Ἰούδα置于剑号之间，表明这处措辞的文本可靠性存在疑问。
  - marker: b
    text: “他”最自然地承接前文的“犹大”，但所据希腊文本也将这一代词标为存疑。
    reason: 既交代代词可能的先行词，也保留校勘本对αὐτῷ的不确定标记。
lexical_decisions:
- source_word: ἐντείλασθε
  choice: 嘱咐
  rationale: 表达郑重吩咐后代之意，同时符合父亲临终训诫的语境。
- source_word: ἑνοῦνται
  choice: 同心合一
  rationale: 保留“联合、成为一体”的核心含义；较单用“联合”更自然地表达群体间的团结。
- source_word: ἀνατελεῖ
  choice: 兴起
  rationale: 原词本义可指日光或植物“升起、萌发”，在此用于救恩的出现；“兴起”既自然，也保留其形象性。
- source_word: σωτηρία
  choice: 救恩
  rationale: 在犹太宗教语境中指上帝所施行的拯救；“救恩”简洁且能承载其神学分量。
- source_word: εὐλογηθήσεται
  choice: 蒙福
  rationale: 准确表达被动式“将被赐福”，并符合现代中文宗教叙事的庄重语体。
theological_decisions:
- issue: 救恩与犹大的关系
  choice: “救恩必借着犹大……兴起”
  alternative: “救恩必从犹大兴起”
  rationale: 采用“借着”贴近 διά 加属格所表达的媒介关系，不进一步断定救恩仅指某位具体人物或某种后世教义。
- issue: ἐν αὐτῷ中代词的所指
  choice: 正文保留“在他里面”，并以脚注说明可能指犹大
  alternative: 直接译为“在犹大里面”
  rationale: 希腊文使用阳性代词而未重述名词；保留代词可避免消除原文的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同心合一”呈现族群联合的劝诫语气；全句保留预言式将来表达，并通过脚注如实呈现希腊校勘本的两处文本疑问。
