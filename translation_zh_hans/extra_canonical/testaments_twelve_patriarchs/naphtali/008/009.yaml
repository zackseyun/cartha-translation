source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Καὶ *αἱ δύο τοῦ Θεοῦ εἰσι⁵⁵, καὶ εἰ μὴ ἐγένοντο⁵⁶ ἐν τῇ⁵⁷ τάξει αὐτῶν ἁμαρτίαν *μεγίστην παρεῖχον τοῖς ἀνθρώποις· τὸ αὐτὸ⁵⁸ καὶ *ἐπὶ τῶν λοιπῶν ἐντολῶν⁵⁹ ἐστι⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/009.yaml
  text: And both are from God, and if they do not occur in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.
translation:
  language: zh_hans
  text: 二者都出于神；若不按各自应有的次序发生，就会使人犯下极大的罪。其余的诫命也是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο
  choice: 二者
  rationale: 保留原文对上文两项事物的回指，不在本节中擅自补明所指。
- source_word: τοῦ Θεοῦ εἰσι
  choice: 都出于神
  rationale: 自然表达归源于神的含义，同时不额外界定其神学性质。
- source_word: ἐν τῇ τάξει αὐτῶν
  choice: 按各自应有的次序
  rationale: 既表达 τάξις 的秩序、次序之义，也体现 αὐτῶν 所指二者各有其适当位置。
- source_word: ἁμαρτίαν μεγίστην παρεῖχον τοῖς ἀνθρώποις
  choice: 就会使人犯下极大的罪
  rationale: 按现代汉语习惯表达其致使人陷入重大罪恶的结果；保留“罪”的道德与神学分量。
- source_word: τῶν λοιπῶν ἐντολῶν
  choice: 其余的诫命
  rationale: “诫命”准确对应 ἐντολαί，并与经训语境相称。
theological_decisions:
- issue: “二者都出于神”与失序所导致之罪之间的张力
  choice: 直接并列保留：二者出于神，但次序不当会使人犯罪
  alternative: 将“出于神”解释为“都是神所许可的”或将罪限定为某一种具体罪
  rationale: 原文没有化解这一张力，也没有说明“出于神”的具体方式或罪的类别，因此译文不作教义性补充。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“二者”保留跨节回指；分号呈现原文两项判断之间紧密而带转折意味的关系。
