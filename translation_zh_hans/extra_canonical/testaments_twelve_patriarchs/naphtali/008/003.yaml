base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/003.yaml
  text: Through his scepter God will appear on the earth, dwelling among men, to save the people of Israel, and he will gather the righteous from among the nations.
translation:
  language: zh_hans
  text: 借着他的权杖，上帝要显现在地上，住在人中间[a]，为要拯救以色列一族，并从列国中招聚义人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住在人中间”在所据希腊文本中以方括号标出，表示这几个字的文本归属存在疑问。
    reason: 如实反映所给校勘本对κατοικῶν ἐν ἀνθρώποις的方括号标记，不把有疑问的文字无提示地并入正文。
lexical_decisions:
- source_word: Διὰ τοῦ σκήπτρου αὐτοῦ
  choice: 借着他的权杖
  rationale: διά加属格表示媒介；σκῆπτρον是象征王权的“权杖”。保留“他的”而不擅自补明所指。
- source_word: ὀφθήσεται
  choice: 要显现
  rationale: 该被动形式在此自然表达“出现、被看见”；“显现”既贴近原文，也保留其庄重语气。
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: 住在人中间
  rationale: κατοικέω表示居住；ἄνθρωποι泛指人类，不限于男性，因此译作“人”。
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: 以色列一族
  rationale: γένος可指族类、后裔或民族共同体；“一族”比现代汉语中的“种族”自然，也比单译“人民”更能保留血缘与群体含义。
- source_word: ἐπισυνάξει
  choice: 招聚
  rationale: 表示从分散之处聚集起来；“招聚”简洁、庄重，并保留主动召集的意味。
- source_word: δικαίους ἐκ τῶν ἐθνῶν
  choice: 从列国中招聚义人
  rationale: ἐκ表示“从……中”；ἔθνη可指各国或外邦人，译作“列国”可保留两者之间的语义空间。
theological_decisions:
- issue: “他的权杖”中代词的所指
  choice: 保留“他的”，不在本节中补明身份
  alternative: 译成“上帝的权杖”或指定为某位弥赛亚人物的权杖
  rationale: 本节希腊文本只用αὐτοῦ，所指依赖上文；直接指定会消除原文保留的指代关系。
- issue: 上帝显现并住在人中间的性质
  choice: 按原文陈述“显现在地上，住在人中间”
  alternative: 明确解释为道成肉身、神显或其他特定教义事件
  rationale: 原文陈述上帝的临在，却没有在本句中界定其方式；译文不额外作教义化解释。
- issue: “列国中的义人”的身份
  choice: 译为“从列国中……义人”
  alternative: 明确译为“外邦信徒”或限定为某一盟约群体
  rationale: 原文δικαίους ἐκ τῶν ἐθνῶν本身没有进一步界定义人的身份或称义方式，应保留其张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上帝”用于Θεός；“权杖、显现、列国、义人”保留古代宗教文本的语域，但句法按现代汉语自然组织。
