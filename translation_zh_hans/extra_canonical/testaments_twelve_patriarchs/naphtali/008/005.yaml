  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/005.yaml
  text: As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.
translation:
  language: zh_hans
  text: 一个人若把孩子养育得好，就会有美好的记念；同样，善行在上帝那里也有美好的记念。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκθρέψῃ καλῶς
  choice: 养育得好
  rationale: 既保留“抚养、培育”的具体含义，也采用现代汉语自然表达。
- source_word: μνείαν ἔχει καλήν
  choice: 留下美好的念想
  rationale: 此处句法和所指略有含混；译文表达养育孩子所产生的美好记忆或念想，不强行限定是谁记念谁。
- source_word: ἐπὶ τοῦ καλοῦ ἔργου
  choice: 善行
  rationale: 简洁传达“美好的行为、善事”，符合上下文的伦理语义。
- source_word: μνήμη παρὰ Θεοῦ ἀγαθή
  choice: 在上帝面前……留下美好的记念
  rationale: παρά与属格可表达在上帝那里、上帝面前；此译保留善行蒙上帝记念的含义，同时避免过度解释为特定奖赏。
theological_decisions:
- issue: 善行与上帝记念之间的关系
  choice: 表述为善行在上帝面前留下美好的记念
  alternative: 上帝必因善行赐下奖赏
  rationale: 原文只说“记念”，并未明言功德、称义或奖赏，因此不引入额外的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“念想”与“记念”形成适度区分：前半句保留人际记忆的自然感，后半句则体现宗教语境中的上帝记念。
