base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/004.yaml
  text: Therefore, if you also do what is good, people and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.
translation:
  language: zh_hans
  text: 所以，你们若也行善，世人和天使就会祝福你们；上帝会借着你们在列国中得荣耀；魔鬼会从你们那里逃走，野兽会惧怕你们，主会爱你们，天使也会扶持你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使也会扶持你们”在所据希腊版本中置于方括号内，表明这句话的文本传承存在疑问。
    reason: 提示原版本明确标示的文本不确定性。
lexical_decisions:
- source_word: ἐργάσησθε τὸ καλόν
  choice: 行善
  rationale: 直译为“做美善之事”；“行善”在现代汉语中简洁自然，并保留实际践行善事的含义。
- source_word: οἱ ἄνθρωποι
  choice: 世人
  rationale: 泛指人类或众人，并非专指男性；“世人”与后面的“天使”形成自然对应。
- source_word: εὐλογήσουσιν
  choice: 祝福
  rationale: 保留该动词“祝福、为……祝福”的基本意义，不弱化为单纯“称赞”。
- source_word: ἐν τοῖς ἔθνεσιν διʼ ὑμῶν
  choice: 因你们而在列国中
  rationale: 保留“在列国中”的范围以及“借着／因着你们”的媒介或缘由含义；中文语序调整以求清晰。
- source_word: τὰ θηρία
  choice: 野兽
  rationale: 准确表达非驯养的兽类，语体庄重自然。
- source_word: ἀνθέξονται ὑμῶν
  choice: 扶持你们
  rationale: 该结构可表示紧紧依附、支持或帮助；“扶持”适合天使施助的语境，同时避免过度具体化为身体动作。
theological_decisions:
- issue: 上帝得荣耀与人的善行之间的关系
  choice: 上帝会因你们而在列国中得荣耀
  alternative: 上帝会借着你们在列国中得荣耀
  rationale: 希腊语 διά加属格可以表达媒介或缘由。“因你们而”保留两者之间的张力，不把经文限定为某一种精细的因果或工具关系。
- issue: 末句的文本可靠性
  choice: 正文保留末句并加注
  alternative: 从正文删除末句
  rationale: 所给希腊文本将该句置于方括号中，显示其文本传承存在疑问；保留并脚注既忠于所给版本，也不掩盖不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号划分连续的应许，使长句层次清楚；保留“列国、魔鬼、天使、主”等原文神学词汇，不作宗派化解释。
