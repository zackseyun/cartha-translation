  text: And behold, my children, I have shown you the times, that all will happen in Israel.
translation:
  language: zh_hans
  text: 看哪，我的孩子们，我已经向你们指明了末后的时期[a]：万事都将发生在以色列中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “末后的时期”之后的连接词（ὅτι，常可译为“即／因为”）在所据希腊底本中带有校勘标记；它与后句的确切句法关系因此不能完全确定。
    reason: 校勘标记位于 ὅτι 处。脚注仅保留底本明确显示的文本／句法不确定性，不对未提供的异文作具体断言。
lexical_decisions:
- source_word: ἰδού
  choice: 看哪
  rationale: 保留提示听者注意的庄重语气，也符合遗训体裁。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 自然表达亲属称谓及复数呼语，不额外限定性别。
- source_word: ὑπέδειξα ὑμῖν
  choice: 我已经向你们指明了
  rationale: ὑποδείκνυμι 在此指展示、指示；“指明”兼顾明确性和现代汉语表达。
- source_word: καιροὺς ἐσχάτους
  choice: 末后的时期
  rationale: 按现存希腊文本译出 ἐσχάτους；καιροί 指具有特定意义的时期，故不用单纯的“时间”。
- source_word: πάντα γενήσεται
  choice: 这一切都要发生
  rationale: πάντα 作概括性中性复数；汉语补出指示成分使表达自然，但不具体增添事件内容。
- source_word: ἐν Ἰσραήλ
  choice: 在以色列中
  rationale: 保留 ἐν 的范围含义及“以色列”可能指民族或共同体的开放性，不擅自改成地理性的“以色列地”。
theological_decisions:
- issue: “以色列”的所指
  choice: 保留“在以色列中”
  alternative: 在以色列地／在以色列人中
  rationale: 原文 Ἰσραήλ 本身未明确限定为土地、民族或共同体；译文保留这一语义张力。
- issue: “末后的”是否属于可靠正文
  choice: 正文译出并加注文本疑问
  alternative: 正文省略“末后的”
  rationale: 所给希腊文本明确载有 ἐσχάτους，但校勘符号显示相关短语存在文本疑问；译出可忠实反映底本，脚注则避免掩盖不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的遗训式口吻。“看哪”保留古代劝诫文本的提示语气；句法适度汉语化，同时不消解“以色列”的指涉歧义。
