source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. Γίνεσθε οὖν *σοφοὶ ἐν θεῷ, τέκνα μου⁶¹, καὶ φρόνιμοι, ἰδόντες⁶² τάξιν ἐντολῶν⁶³ αὐτοῦ⁶⁴ καὶ θεσμοὺς παντὸς πράγματος⁶⁵, ὅπως *ἀγαπήσει ὑμᾶς ὁ Κύριος⁶⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/010.yaml
  text: Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter, so that the Lord may love you.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要在上帝里面成为有智慧的，也要明达，认识他诫命的次序和每件事的定规，好让主爱你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφοὶ ἐν θεῷ
  choice: 在上帝里面有智慧
  rationale: 保留介词短语“ἐν θεῷ”的关系性表达，不将其简化为一般的“属灵智慧”或“敬畏上帝”，从而避免加入原文没有明说的解释。
- source_word: φρόνιμοι
  choice: 明达
  rationale: 表达审慎、明辨和实际判断力，并与前面的“有智慧”形成自然而不重复的并列。
- source_word: ἰδόντες
  choice: 明白
  rationale: 该分词字面有“看见”之意，此处语境指察知、领会；译为“明白”较符合现代汉语，同时保留认知含义。
- source_word: τάξιν ἐντολῶν αὐτοῦ
  choice: 他诫命的次序
  rationale: 直译 τάξις 的秩序、次序之义，不擅自解释为诫命的等级、体系或遵行方式。
- source_word: θεσμοὺς παντὸς πράγματος
  choice: 每件事的定规
  rationale: 保留属格结构所具有的简练与一定含混性；“定规”可表达既定规范、法则或安排，而不将其收窄为法律条文。
- source_word: ὅπως ἀγαπήσει ὑμᾶς ὁ Κύριος
  choice: 好让主爱你们
  rationale: 保留目的或结果色彩及将来时指向，不把其中可能引起的神学张力改写成较弱的“喜悦你们”。
theological_decisions:
- issue: “在上帝里面有智慧”的含义
  choice: 保留“在上帝里面”
  alternative: 从上帝得智慧／有属神的智慧
  rationale: 原文 ἐν θεῷ 可以表达领域、关系或根基；直保留可避免在这些理解中作排他选择。
- issue: 顺服与主之爱的关系
  choice: 译作“好让主爱你们”
  alternative: 好让主喜爱你们／使你们蒙主眷爱
  rationale: ἀγαπάω 通常为“爱”，而 ὅπως 在此引出目的或预期结果。译文保留原句表面的条件性张力，不用系统神学预先化解。
- issue: “每件事的定规”所指范围
  choice: 维持宽泛表达
  alternative: 各样事务的条例／万事的法则
  rationale: παντὸς πράγματος 本身范围宽泛，可能指各种事情或每一事项；不限定为宗教礼仪、自然秩序或社会法规。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的孩子们”保留父辈训诲语气；“明达”“定规”略具经训文体色彩，但仍属现代读者可理解的表达。全文不需脚注标记。
