  text: 2. Καὶ ἐπάξει Κύριος ὑμῖν αἰχμαλωσίαν, καὶ δουλεύσετε ⌈ἐκεῖ⌉¹³ *τοῖς ἐχθροῖς¹⁴ ὑμῶν, καὶ πάσῃ κακώσει¹⁵ καὶ θλίψει †συναναστραφήσεσθε¹⁶, ἕως ἀναλώσει¹⁷ Κύριος πάντας ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/002.yaml
  text: And the Lord will bring captivity upon you, and there you will serve your enemies, and you will be afflicted with every kind of evil and tribulation, until the Lord has consumed you all.
translation:
  language: zh_hans
  text: 主必使你们被掳；你们将在那里作仇敌的奴仆，并遭受各种困苦和患难，直到主将你们全都灭尽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάξει ... αἰχμαλωσίαν
  choice: 使你们被掳
  rationale: 直译为“使被掳临到你们”不够自然；此译保留主使被掳之事临到他们的主动意义。
- source_word: δουλεύσετε
  choice: 服事
  rationale: 兼顾为奴役使、受支配的含义；结合“仇敌”，语境自然显出被迫服役。
- source_word: πάσῃ κακώσει καὶ θλίψει
  choice: 种种苦难和患难
  rationale: κακώσις 指受苦、虐待或困苦，θλῖψις 指压迫、患难；分别译出，避免合并。
- source_word: συναναστραφήσεσθε
  choice: 在……中度日
  rationale: 该词此处文本有疑，但基本含义涉及共同生活、周旋或处身其中；“在……中度日”符合句法和苦境语境，也不把它强化成单纯的“受折磨”。
- source_word: ἀναλώσει
  choice: 灭尽
  rationale: 表达耗尽、毁灭、消灭之意，并保留原句严厉的审判语气。
theological_decisions:
- issue: 主在被掳与最终灭尽中的施动者角色
  choice: 保留“主必使……被掳”及“主将……灭尽”
  alternative: 弱化为“你们将被掳”或“你们将灭亡”
  rationale: 希腊文两处均明确以主为施动者，不应淡化其中的神学张力。
- issue: πάντας ὑμᾶς 的范围
  choice: 你们全都
  alternative: 你们中许多人／彻底耗尽你们
  rationale: πάντας 明示全体范围；按原文保留，不以解释性方式缓和。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“度日”使有文本疑难的 συναναστραφήσεσθε 在汉语中自然成立，同时避免超出原文断定具体受苦方式。
