source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: IV. Ταῦτα¹ λέγω ὑμῖν², τέκνα μου, ὅτι ἔγνων³ ἐν τῇ⁴ γραφῇ⁵ Ἐνώχ, ὅτι καίγε⁶ ὑμεῖς ἀποστήσεσθε ἀπὸ Κυρίου⁷, πορευόμενοι κατὰ πᾶσαν ἀνομίαν⁸ ἐθνῶν⁹, καὶ ποιήσετε¹⁰ πᾶσαν πονηρίαν¹¹ Σοδόμων¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/001.yaml
  text: These things I say to you, my children, because I have learned in the writing of Enoch that you too will depart from the Lord, walking in all the lawlessness of the nations and doing all the wickedness of Sodom.
translation:
  language: zh_hans
  text: 这些事我告诉你们，我的孩子们，因为我从以诺的书中得知，你们也将背离主，随从列国种种不法之事，并做出所多玛一切的恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ γραφῇ Ἐνώχ
  choice: 从以诺的书中
  rationale: 按现代汉语自然表达传达“在以诺的文献/书卷中得知”；“书”保留 γραφή 在此指书面记载的意义，不把它特定化为正典“经书”。
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: 将背离主
  rationale: ἀφίστημι 加 ἀπό 表示离开、背弃；“背离”既传达关系与信仰上的离弃，也不额外加入“必然”等强化语气。
- source_word: πορευόμενοι κατὰ πᾶσαν ἀνομίαν ἐθνῶν
  choice: 随从列国种种不法之事
  rationale: πορεύομαι κατά 在此表示按某种行为方式而行；“随从”自然呈现这种效法。πᾶσαν ἀνομίαν 用“种种不法之事”表达其总体范围，ἐθνῶν 译作中性的“列国”。
- source_word: ποιήσετε πᾶσαν πονηρίαν Σοδόμων
  choice: 并行所多玛一切的恶
  rationale: 保留 ποιέω 的行动含义及 πᾶσαν 的全称力度；“所多玛”采用通行中文专名形式。
theological_decisions:
- issue: “以诺的书”之文献身份
  choice: 以诺的书
  alternative: 以诺书／以诺的经书
  rationale: 原文仅说 γραφή Ἐνώχ，未明确书名或正典地位；采用普通名词表达，以免引入超出文本的判定。
- issue: ἀποστήσεσθε 的预告力度
  choice: 你们也将背离主
  alternative: 你们也必背离主
  rationale: 将来时表达预告，但原文没有独立的强调词；不添加“必”，以保留原有语气。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“我的孩子们”保留父辈训诫语境；整体句法贴近希腊文逻辑，同时避免生硬直译。
