- from: 这些事我告诉你们，我的孩子们，因为我从以诺的书中得知，你们也将背离主，随从列国种种不法之事，并行所多玛一切的恶。
  to: 这些事我告诉你们，我的孩子们，因为我从以诺的书中得知，你们也将背离主，随从列国种种不法之事，并做出所多玛一切的恶事。
  rationale: 仅将末尾的生硬搭配改为现代汉语更自然的‘做出……恶事’，同时保留ποιέω的行动含义、πᾶσαν的总体范围及Σοδόμων的所属关系；其余译文无需改动。
  reviewer_model: gpt-5.6-terra
