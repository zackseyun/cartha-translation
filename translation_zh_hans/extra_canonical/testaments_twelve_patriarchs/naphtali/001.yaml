  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001.yaml
  text: 'A copy of the testament of Naphtali, the eighth son of Jacob, which he set in order at the time of his departure, in the hundred and thirtieth year of his life.


    2 When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them. 3 And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him. 4 And while blessing and glorifying the Lord, he grew strong and said, “After the feast yesterday, my flesh failed and died.”


    5 Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father. 6 I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me upon Rachel’s knees, and for this reason she called my name Naphtali. 7 For Rachel loved me greatly, because I was born upon her knees; and when I was still a tender child she kissed me, saying, ‘May I be given a brother from my own womb, like you.’ 8 Therefore Joseph also was like me in every way, according to the prayers of Rachel.”'
translation:
  language: zh_hans
  text: '《拿弗他利遗训》


    雅各与辟拉所生的第八个儿子拿弗他利的遗训。


    1 这是拿弗他利遗训的抄本，是他在即将离世[a]时所立的；那年他一百三十岁。


    2 七月初一，他的众子聚集在一起，他便为他们设宴。3 到了早晨，他醒来后对他们说：“我要死了。”他们却不相信他。4 他颂赞主，就刚强起来，说：“昨天宴席过后，我的肉身已经死了[b]。”


    5 随后他开始说：“我的孩子们，拿弗他利的众子啊，要听！要听你们父亲的话。6 我是辟拉所生的。拉结用了计策，把辟拉代替自己给了雅各；辟拉就怀孕，在拉结膝上生下了我。因此，拉结给我取名叫拿弗他利。7 拉结非常爱我，因为我是在她膝上出生的。我还幼小柔弱的时候，她常亲吻我，说：‘愿我也从自己腹中得一个像你一样的弟弟。’8 因此，照着拉结的祝福[c]，约瑟也在各方面都像我。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离世”直译为“出去”或“离开”，在这里是死亡的委婉说法。
    reason: 说明原文委婉语，以免读者误解为旅行。
  - marker: b
    text: 原文直译为“我的肉身死了”；这句话与拿弗他利随后继续说话形成明显张力。
    reason: 保留并提示原文有意或传本所呈现的困难表达，不擅自改顺。
  - marker: c
    text: 希腊文本此处作“祝福”，但原文标示该读法存疑；也有译法按语境理解为“祷告”。
    reason: 交代底本文本疑难及英语咨询层所采用的另一理解。
lexical_decisions:
- source_word: διαθήκη
  choice: 遗训
  rationale: 在此指临终所立、留给后代的训言；“遗训”比法律色彩较强的“遗嘱”更符合本书体裁。
- source_word: ἔξοδος
  choice: 离世
  rationale: 字面为“出去、离开”，此处委婉指死亡；中文以“离世”保留委婉语气。
- source_word: δεῖπνον
  choice: 宴席／设宴
  rationale: 语境是父亲召集众子共同用餐，“设宴”自然地表达较正式的聚餐。
- source_word: ἐκραταιώθη
  choice: 刚强起来
  rationale: 保留被动或状态变化的意味，不额外解释为身体康复或获得超自然能力。
- source_word: ἡ σάρξ μου
  choice: 我的肉身
  rationale: 直译“我的肉体”，用“肉身”既自然又保留身体与说话主体之间耐人寻味的区分。
- source_word: ἐν πανουργίᾳ ἐποίησε
  choice: 用了计策
  rationale: 表达拉结采取谋略或机巧行事；不把词义强化为明确的邪恶欺骗。
- source_word: ἐπὶ τῶν γονάτων
  choice: 在……膝上
  rationale: 保留古代收纳或承认孩子的叙事表达，不以解释性措辞取代原文意象。
- source_word: εὐλογίας
  choice: 祝福
  rationale: 现存所给希腊文本读作“祝福”；虽语境不易，仍不依英语咨询层改作“祷告”。
theological_decisions:
- issue: 拿弗他利在仍能说话时声称“我的肉身已经死了”
  choice: 保留“我的肉身已经死了”的突兀表述
  alternative: 译作“我的肉身衰残而死”或“我的身体已经不行了”
  rationale: 希腊文只有ἀπέθανεν（死了），没有“衰残、失效”的对应词。保留原文中身体死亡与继续讲话之间的张力，不替作者消解。
- issue: 拉结愿望中的施予者
  choice: “愿我也……得……”
  alternative: “愿上帝使我……”
  rationale: 希腊文动词表达愿望，却没有明说施予者；不把隐含主语明确限定为上帝。
- issue: 约瑟像拿弗他利与拉结“祝福”的关系
  choice: 照着拉结的祝福
  alternative: 按照拉结的祷告
  rationale: 所给希腊正文是εὐλογίας“祝福”，即使表达关系含混，也不按后期解释改为“祷告”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。人名沿用简体中文圣经中常见形式。叙述避免文言化堆叠，同时在“遗训”“离世”“肉身”等关键词上保留古代临终训诫文体的肃穆感。
