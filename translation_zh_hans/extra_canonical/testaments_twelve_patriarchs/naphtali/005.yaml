  text: '1[a]. For in the fortieth year of my life I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still.


    2. And behold, Isaac, the father of my father, said to us, “Run up and let each of you seize them according to his strength; and the one who takes hold of them, his shall be the sun and the moon.”


    3. And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.


    4. And while Levi was like the sun, behold, a certain young man was giving him twelve palm branches[b]; and Judah became bright like the moon, and beneath their feet were twelve rays.


    5. And the two, Levi and Judah, ran up and held them fast.


    6. And behold, there was a bull on the earth, having two great horns and eagle’s wings on its back; and though we wanted to seize it, we were not able.


    7. But Joseph came and took hold of it, and went up with it to the height.


    8. And I saw that I was there, and behold, a holy writing appeared to us, saying: “Assyrians, Medes, Persians,”'
translation:
  language: zh_hans
  text: '**拿弗他利遗训 5**


    **1** 我四十岁那年，在耶路撒冷东边的橄榄山上看见一个异象：太阳和月亮停住不动。


    **2** 看哪，我父亲的父亲以撒对我们说：“你们跑上前去，各人按自己的力量抓住它们；谁抓住了，太阳和月亮就归谁。”


    **3** 我们便一同跑去。利未抓住了太阳，犹大抢先赶到，抓住了月亮；二人也随着它们一同升高。


    **4** 当利未如同太阳时，看哪，有一个年轻人正递给他十二根棕榈枝；犹大也变得明亮，如同月亮一般。他们脚下有十二道光芒。


    **5** 〔利未和犹大二人跑上前去，牢牢抓住了它们。〕[a]


    **6** 看哪，地上有一头公牛，长着两只大角，背上有鹰的翅膀。我们想要抓住它，却不能。


    **7** 约瑟却来到，抓住了它，同它一起升到高处。


    **8** 我看见自己在那里。看哪，有一篇神圣的文字向我们显现，上面说：“亚述人、米底人、波斯人、迦勒底人、叙利亚人，将承受以色列的十二根权杖的被掳。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节在所据传世希腊文本中置于方括号内。它的句法生硬，并且似乎重复第3节利未和犹大抓住日月的情景；可能是承接性的重述，也可能是后加的句子。
    reason: textual_variant
  - marker: b
    text: 希腊文直译十分生硬，字面可近似为：“亚述人、米底人、波斯人、迦勒底人、叙利亚人，将承受以色列十二根权杖的被掳。”动词“承受”与“被掳”和“十二根权杖”的关系在现存文本中不清楚；“十二根权杖”可能象征以色列十二支派。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὄραμα
  choice: 异象
  rationale: 在启示性、异象文学语境中，“异象”比一般的“景象”更准确，也符合现代中文宗教文献的庄重语体。
- source_word: ἕστηκαν
  choice: 停住不动
  rationale: 希腊语完成时强调太阳和月亮处于固定、静止的状态；译文保留这一状态意义。
- source_word: Προσδραμόντες
  choice: 跑上前去
  rationale: 保留动作的急切和向前趋近之意，同时符合自然的现代汉语。
- source_word: κρατήσατε
  choice: 抓住
  rationale: 表达有力地握住或控制住；既保留竞逐感，又避免“夺取”可能带来的额外敌对意味。
- source_word: κατὰ δύναμιν
  choice: 各人按自己的力量
  rationale: 保留分配性表达，突出每个人依自身能力行动。
- source_word: φθάσας
  choice: 抢先赶到
  rationale: 该词在这里表示犹大先于别人到达并抓住月亮；“抢先赶到”自然传达先后关系和竞逐场景。
- source_word: ὑψώθησαν
  choice: 升高
  rationale: 首先保留异象中的空间运动，不把它直接神学化为“被高举”或“得尊荣”。
- source_word: βαΐα φοινίκων
  choice: 棕树枝
  rationale: 这是具体、清楚的植物意象；不预先赋予礼仪或得胜象征。
- source_word: ἀκτῖνες
  choice: 光芒
  rationale: 适合日月意象；“十二道光芒”在现代汉语中比“十二条射线”自然。
- source_word: κατέλαβεν
  choice: 抓住了
  rationale: 表示约瑟成功掌握公牛；“抓住”贴合动作，又不强化为暴力性的“擒获”。
- source_word: γραφὴ ἁγία
  choice: 一篇神圣的文字
  rationale: 原文是不定的异象性表述；不译作“圣经”，以免引入固定正典概念。
- source_word: σκῆπτρα
  choice: 权杖
  rationale: 保留原文的具体象征词，不直接释义为“支派”；其所指可能与以色列十二支派有关，但正文不替作者解释。
theological_decisions:
- issue: 利未与犹大的象征地位
  choice: 照译太阳、月亮、棕树枝和光芒等意象，不在正文解释其神学含义。
  alternative: 将利未解释为祭司权柄、犹大解释为王权，或直接作弥赛亚式解释。
  rationale: 本段只呈现异象，没有在此明确解释象征；直译可保留文本的开放性和张力。
- issue: γραφὴ ἁγία的性质
  choice: 译为“一篇神圣的文字”。
  alternative: 译为“圣经”或“一卷圣书”。
  rationale: 希腊文没有明确指向后来形成的固定正典；采用较宽泛的表达可避免时代错置。
- issue: 十二根权杖的象征
  choice: 保留“以色列的十二根权杖”。
  alternative: 直接译成“以色列十二支派”。
  rationale: 权杖很可能象征十二支派，但原文使用的是象征性名词；保留意象比直接解码更忠实。
- issue: 第8节被掳与承受产业的关系
  choice: 译为“将使……被掳，归他们所有”。
  alternative: 直译为“将承受被掳之事和以色列的十二根权杖”。
  rationale: 原句格关系和措辞不顺，但整体清楚指向列国取得被掳的以色列十二权杖；译文使中文可读，同时用脚注交代原文的生硬与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。叙事中保留“看哪”等异象文学的提示语，但避免过度古雅。正文依据所提供的完整希腊文本译至第8节末，包括英语咨询层未译出的“迦勒底人、叙利亚人”及其后的预言内容。所有象征均尽量按原貌呈现，不在正文中作宗派性解释。
