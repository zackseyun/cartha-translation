  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/009.yaml
  text: And when the winter ceased, the ship came to the land, as it were in peace.
translation:
  language: zh_hans
  text: 冬天止息以后，船到了陆地，仿佛是在平安中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμών
  choice: 冬天
  rationale: 按该词的基本义直译为“冬天”，与上下文中的季节终止相符；不擅自具体化为“风暴”。
- source_word: ἐπαύσατο
  choice: 过去
  rationale: 自然表达冬季结束，同时保留“止息、终止”的意思。
- source_word: ἔφθασε
  choice: 到了
  rationale: 在船只与陆地的语境中自然传达“来到、抵达”，不过度强化过程或结果。
- source_word: ἐπὶ τῆς γῆς
  choice: 陆地
  rationale: 与船只形成清楚对照；“陆地”比笼统的“地上”更符合现代汉语航行语境。
- source_word: ὥσπερ ἐν εἰρήνῃ
  choice: 仿佛安然无事
  rationale: 保留ὥσπερ的比较或表象语气，并以自然汉语表达ἐν εἰρήνῃ在此处“处于平安之中”的状态。
theological_decisions:
- issue: ἐν εἰρήνῃ是否指正式和约、属灵平安，或仅指平安状态
  choice: 译作“安然无事”，不赋予专门神学含义
  alternative: 仿佛处于和平之中／仿佛平安无事
  rationale: 上下文描述船抵达陆地，原文没有足够依据将εἰρήνη限定为政治和平或属灵平安；采用普通状态义，同时以“仿佛”保留语义张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。句式紧贴希腊文的时间从句与主句结构；不使用脚注，因为本节没有必须向普通读者另行说明的文本或译法问题。
