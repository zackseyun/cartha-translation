  text: And behold, our father came, and we all rejoiced together with one accord.
translation:
  language: zh_hans
  text: 看哪，我们的父亲来了，我们众人便同心欢喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: 看哪
  rationale: 保留原文用于引人注意、推进叙事的提示语，同时采用庄重而易懂的现代汉语表达。
- source_word: ὁ πατὴρ ἡμῶν
  choice: 我们的父亲
  rationale: 直接对应原文，未擅自补明父亲的身份或姓名。
- source_word: πάντες
  choice: 众人
  rationale: 与“我们”结合为“我们众人”，明确表达全体都参与。
- source_word: ὁμοθυμαδόν
  choice: 同心
  rationale: 表达众人心意一致；与动词连用比生硬的“同心合意地”更自然。
- source_word: ἠγαλλιασάμεθα
  choice: 欢喜
  rationale: 传达强烈喜悦；以“便”自然衔接父亲到来与众人欢喜的叙事关系，但不额外强化为严格因果。
