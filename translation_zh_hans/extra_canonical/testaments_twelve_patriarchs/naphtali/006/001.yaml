base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/001.yaml
  text: And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him.
translation:
  language: zh_hans
  text: 六　又过了七天，我看见我父亲雅各站在阿姆尼亚海[a]边，我们也和他在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿姆尼亚”的具体所指不能确定；这里按希腊文音译，不猜定其地理位置。
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ πάλιν
  choice: 又
  rationale: 自然表达叙事中的再次发生；“又过了七天”也保留了与前文事件相隔七日的语意。
- source_word: μετὰ ἡμέρας ἑπτὰ
  choice: 过了七天
  rationale: 按现代汉语习惯表达七日之后，准确而简洁。
- source_word: ἴστατο
  choice: 站在
  rationale: 保留未完成时所描写的持续姿态，不额外推断动作过程。
- source_word: ἐν τῇ θαλάσσῃ Ἀμνείας
  choice: 在阿姆尼亚海边
  rationale: 介词ἐν与“海”连用在此按场景理解为临海而立；译作“海边”避免产生站在海水中的误解，同时保留地名。
- source_word: σὺν αὐτῷ
  choice: 和他在一起
  rationale: 自然传达同行、同处的含义，不增加更具体的空间关系。
