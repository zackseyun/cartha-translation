  text: But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together.
translation:
  language: zh_hans
  text: 约瑟却乘一艘小船离去；我们则分在九块木板上；利未和犹大在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ ἀκατίῳ
  choice: 乘一只小船
  rationale: ἀκάτιον指小船、艇；ἐπί与行动动词连用在此表达乘船而行。
- source_word: ἐπορεύθη
  choice: 离去
  rationale: 表示前往或离开；结合梦境中众人分散的语境，译作“离去”自然，同时不增添目的地。
- source_word: διεχωρίσθημεν
  choice: 我们则分散
  rationale: 该被动形式表示被分开、彼此离散；“分散”保留众人与约瑟及彼此分离的含义。
- source_word: ἐπὶ σανίδων ἐννέα
  choice: 在九块木板上
  rationale: σανίς指木板或船板；直译保留原文奇特而具体的梦象。
- source_word: ἐπὶ τὸ αὐτό
  choice: 在一起
  rationale: 固定表达，意为同处一处或聚在一起。
