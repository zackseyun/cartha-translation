lexical_decisions:
- source_word: χειμὼν σφοδρός
  choice: 一场猛烈的风暴
  rationale: χειμών在此处结合航海场景指恶劣天气或风暴，而非单指冬季；“猛烈”对应σφοδρός。
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: 强劲的旋风
  rationale: λαῖλαψ表示猛烈的暴风或旋风；译文保留风势突然、强烈的意象，同时避免生硬直译为“风的大旋风”。
- source_word: ἀφίσταται
  choice: 离开了
  rationale: 该动词表示离开、退开或与人分离；“离开了我们”自然表达动作，又不额外断定其原因。
- source_word: τοὺς αὐχένας
  choice: 舵柄
  rationale: 该词通常意为“颈项”，但本段明显采用航海场景，可能指形似颈项的舵柄；正文采用合乎语境的译法，并以脚注保留原文疑难。
