revisions:
- from: 我们在海上遭到风暴，被推着漂流；船灌满了水，在狂风巨浪中四面受撞，甚至连船身也开始碎裂。
  to: 我们在海上受风暴颠簸，被推着漂流；船里灌满了水，在狂风巨浪中不断遭受冲击，以至于几乎要碎裂。
  rationale: 修订仅调整汉语搭配，并将末句改为“几乎要碎裂”，以避免将原文的危急结果过度落实为已经发生的船体碎裂。其余意象、时态过程感和庄重叙事语体均予保留。
