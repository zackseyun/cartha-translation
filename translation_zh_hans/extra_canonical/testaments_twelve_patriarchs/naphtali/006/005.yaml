  text: And we, being storm-tossed on the sea, were being driven over the waters, and the ship was filled and battered in the storms, so that it was in danger of breaking apart.
translation:
  language: zh_hans
  text: 我们在海上受风暴颠簸，被推着漂流；船里灌满了水，在狂风巨浪中不断遭受冲击，以至于几乎要碎裂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμαζόμενοι
  choice: 遭到风暴
  rationale: 该分词表示遭受暴风侵袭；译文保留被动处境，并以现代汉语自然表达。
- source_word: ἐπὶ τὸ πέλαγος
  choice: 在海上
  rationale: πέλαγος指开阔海面；结合受风暴驱动的语境，译作“在海上”简洁自然，不额外限定航行方向。
- source_word: ἐφερόμεθα
  choice: 被推着漂流
  rationale: 未完成时被动形式表示持续被外力带动；“被推着漂流”兼顾被动性和过程性。
- source_word: ἐπληρώθη τὸ πλοῖον ὑδάτων
  choice: 船灌满了水
  rationale: 直译为“船被水充满”；汉语以“灌满了水”准确呈现船舱进水的情景。
- source_word: ἐν τρικυμίαις
  choice: 在狂风巨浪中
  rationale: τρικυμία指猛烈风浪或海上风暴；该译法符合汉语海难叙述，又不将其弱化为普通波浪。
- source_word: περιρησσόμενον
  choice: 四面受撞
  rationale: 该分词描写船在风浪中遭到周围猛烈冲击；“四面受撞”保留其被动和环绕性的意象。
- source_word: ὥστε καὶ συντρίβεσθαι αὐτό
  choice: 甚至连船身也开始碎裂
  rationale: ὥστε引出实际或正在发展的结果，καί有递进强调作用；“开始碎裂”体现现在时不定式的过程感，避免仅译成尚未发生的危险。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。以分号连接人物遭遇与船只受损两层画面；不添加原文没有的神学解释，也不把船体碎裂弱化为单纯“有危险”。
