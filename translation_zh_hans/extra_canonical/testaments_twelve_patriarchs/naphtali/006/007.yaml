  text: And we were scattered, all of us, to the ends of the earth[c].
translation:
  language: zh_hans
  text: 我们所有人都被分散到大地的尽头[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “到大地的尽头”很可能具有象征离散的意味，不过本文将此事呈现为拿弗他利梦境的一部分。
    reason: cross_reference
lexical_decisions:
- source_word: διεσπάρημεν
  choice: 被分散
  rationale: 保留希腊语不定过去时被动语态，表达众人遭到分散，而不擅自补出施动者。
- source_word: πάντες
  choice: 所有人
  rationale: 与第一人称复数“我们”结合为“我们所有人”，自然传达全体无一例外之意。
- source_word: εἰς τὰ πέρατα τῆς γῆς
  choice: 到大地的尽头
  rationale: 贴近原文空间意象，并保留其既可描写梦中景象、又可能象征广泛离散的张力。
theological_decisions:
- issue: “到大地的尽头”是否应明译为象征性的离散
  choice: 正文保留原有地理意象，不直接释为象征
  alternative: 译作“分散到世界各地”
  rationale: 原文在拿弗他利的梦境叙述中使用具体空间表达；直译既不排除字面图景，也不抹去其象征离散的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大地的尽头”保留原文的形象性；句序调整为自然汉语，同时保留被动表达。
