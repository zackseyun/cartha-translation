  text: But Levi, clothed in sackcloth, prayed to the Lord.
translation:
  language: zh_hans
  text: 但利未身披麻布，向主祈求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβαλλόμενος σάκκον
  choice: 身披麻布
  rationale: 保留分词结构所表达的伴随状态；“麻布”准确传达哀恸、谦卑或悔罪时所穿的粗布，同时不额外限定其动机。
- source_word: ἐδέετο
  choice: 祈求
  rationale: 该词表示恳切祷告或请求；“祈求”既自然，又比泛称“祷告”更能体现原文的恳求意味。
- source_word: τοῦ Κυρίου
  choice: 向主
  rationale: 动词所支配的属格在此指祈求的对象；汉语用“向主”自然清楚，并保留“主”这一称谓。
theological_decisions:
- issue: 利未披麻布的具体意义
  choice: 不明说其为悔罪、哀悼或禁食
  alternative: 译作“披麻悔罪”或“穿着丧服”
  rationale: 原文只陈述披着麻布，没有明确说明原因；正文保留这一开放性，避免加入超出文本的神学或礼仪解释。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“但”承接上下文中的转折；“身披麻布”比“穿着麻衣”更贴近原文的披覆动作，也适合叙事文体。
