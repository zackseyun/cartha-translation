base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/002.yaml
  text: 'And behold, a ship was coming, sailing beside us, with sailors and pilots. And on the ship was written this: “Jacob’s ship.”'
translation:
  language: zh_hans
  text: 看哪，有一艘船正驶来，航行着，却没有水手和舵手。船上写着：“雅各的船。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: 看哪
  rationale: 保留异象叙述中引人注意的语气，同时采用庄重而易懂的现代汉语。
- source_word: ἤρχετο ἁρμενίζον
  choice: 有一艘船正驶来；船在航行
  rationale: 以“正驶来”体现未完成时的进行意味，并明确保留分词所表达的航行状态。
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: 没有水手，也没有舵手
  rationale: ἐκτός接属格在此表示缺少、没有；κυβερνήτης指掌舵或驾驶船只的人，译作“舵手”。原文没有“在我们旁边”或“有水手”的措辞。
- source_word: ἐπεγέγραπτο δὲ τῷ πλοίῳ
  choice: 船上写着
  rationale: 自然表达完成时被动态所描述的铭文状态，不生硬直译语法形式。
- source_word: πλοῖον Ἰακώβ
  choice: 雅各之船
  rationale: 保留简短的属格铭文结构，不擅自补入冠词或将所属关系具体化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重、清楚的叙事语体。“看哪”保留启示性场景的强调；“却没有水手，也没有舵手”忠实呈现所给希腊文本，并避免沿用英语咨询层中与原文相反的“with sailors and pilots”及原文未见的“beside us”。
