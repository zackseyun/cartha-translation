  source_fidelity: 草稿正确按所给希腊文本将ἐκτὸς ναυτῶν καὶ κυβερνητῶν译为“没有水手，也没有舵手”，并未跟随英语审校记录中与该文本相反的“with sailors and pilots”。“正驶来”可表达ἤρχετο的未完成体；“航行着”保留ἁρμενίζον的分词信息。铭文“雅各的船”忠实对应πλοῖον Ἰακώβ。
