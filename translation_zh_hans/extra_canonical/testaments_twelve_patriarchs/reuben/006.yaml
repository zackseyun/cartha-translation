  text: '1. Guard yourselves, therefore, from sexual immorality, and be keeping your mind pure. Guard also your senses from every woman. 2. And command the women likewise not to associate closely with men, so that they too may keep their minds pure. 3. For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a ruinous disgrace of Beliar and an everlasting reproach. 4. For sexual immorality has within itself neither understanding nor reverence for God, and every jealousy dwells in its desire. 5. Therefore I say to you: you will be jealous of the sons of Levi, and you will seek to exalt yourselves above them, but you will not prevail because of this. 6. For God will execute their vengeance, but you will die an evil death. 7. For to Levi God gave the priesthood, and to Judah with him the kingdom. 8. And do not be lifted up against these two, from whom the Lord will bring to completion what is to be spoken. 9. I adjure you
    by the God of heaven, that each of you practice truth toward his neighbor and that each have love toward his brother. 10. And draw near to Levi in humility of heart, so that you may receive a blessing from his mouth. 11. For he will bless Israel and Judah, because in him the Lord chose to reign before all the people. 12. And bow down to his seed, because for your sake it will die in visible and invisible wars, and among you there will be an everlasting king.'
translation:
  language: zh_hans
  text: '《流便遗训》第6章


    1 所以，你们要谨防淫乱，常保心思纯洁；也要谨守你们的感官，防备一切女子。2 也要吩咐女子，不可与男子过分亲近，好让她们也常保心思纯洁。3 因为频繁相会，即使没有做出那不敬虔的事，对她们仍是一种无法医治的疾病；对我们则是彼列[b]所带来的、使人灭亡的羞耻，也是永远的耻辱。4 淫乱本身既无明智，也无对上帝的敬畏；各种嫉妒都存在于它的欲望中。


    5 因此我告诉你们：你们必嫉妒利未的子孙，想要高抬自己，超过他们；但你们必因此不能得逞。6 因为上帝必为他们施行报应，你们却必遭恶死。7 上帝把祭司职分赐给利未，也把王权赐给犹大。8 不可在这二者面前自高；主将借着他们成就那要宣告的事。[a]


    9 我指着天上的上帝郑重嘱咐你们：各人都要以真实待邻舍[c]，也要以爱心待弟兄。10 你们要存谦卑的心亲近利未，好从他口中领受祝福。11 因为他必为以色列和犹大祝福；主拣选了他，要在全体百姓面前作王。12 你们也要向他的后裔俯伏致敬[d]，因为这后裔必为你们在有形和无形的争战中死去；在你们中间，必有一位永远的王。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第7—8节在现存希腊文本中残损难解。本译文依据较可能的意思：利未领受祭司职分，犹大领受王权，并警告人不可敌对这两个谱系。
    reason: textual_variant
  - marker: b
    text: 希腊文作 Beliar，是这个名字的一种形式；中文圣经通常译作“彼列”。
    reason: lexical_alternative
  - marker: c
    text: 直译“向邻舍行真实”，是指以诚实和信实待人，不只是说真话。
    reason: lexical_alternative
  - marker: d
    text: “向他的后裔俯伏致敬”可以指向某一后裔或后裔谱系表示尊崇与效忠，不一定是把对方当作神来敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξατε
  choice: 谨防／约束
  rationale: 命令语气强调警醒与自我守护；按宾语分别用“谨防淫乱”和“约束感官”，使现代汉语自然，同时保留劝诫力度。
- source_word: πορνεία
  choice: 淫乱
  rationale: 涵盖不正当性行为，不把含义限缩为某一种具体情形；也符合本章伦理劝诫的庄重语体。
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: 常保心思纯洁
  rationale: 既表达持续保持纯洁，也把 διάνοια 的内在思想层面自然传达出来。
- source_word: αἰσθήσεις
  choice: 感官
  rationale: 保留身体感知作为欲望入口的意味；“感官”比“知觉”更通俗准确。
- source_word: συνδιάζειν
  choice: 过分亲近
  rationale: 上下文所警戒的是容易滋生诱惑的亲密交往，而非已经发生性行为；此译避免过度解释。
- source_word: συνεχεῖς συντυχίαι
  choice: 频繁相会
  rationale: 突出反复接触的累积危险，且比直译“持续的遭遇”更符合现代汉语。
- source_word: ἀσέβημα
  choice: 不敬虔的事
  rationale: 保留行为对上帝不敬的道德宗教色彩，而不只译作一般“过错”。
- source_word: νόσος ἀνίατος
  choice: 无法医治的疾病
  rationale: 直接保留道德败坏如疾病的鲜明比喻。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用现代中文读者较熟悉的圣经人名形式，同时以脚注说明希腊文形式 Beliar。
- source_word: σύνεσιν
  choice: 明智
  rationale: 表达实践性的理解力与判断力，并与“对上帝的敬畏”自然并列。
- source_word: εὐσέβειαν
  choice: 对上帝的敬畏
  rationale: 明确该词面向上帝的宗教含义，同时避免带入特定宗派术语。
- source_word: ζῆλος / ζηλώσετε
  choice: 嫉妒
  rationale: 此处描述对利未子孙的负面竞争，不是可嘉许的热心，因此译作“嫉妒”。
- source_word: ποιεῖν ἀλήθειαν
  choice: 以真实待
  rationale: 把“行真实”这一惯用表达自然译为以诚实、信实对待他人，不限于说真话。
- source_word: προσκυνήσατε
  choice: 俯伏致敬
  rationale: 表达伏地表示尊崇或效忠，不自动赋予只可向神献上的敬拜含义。
- source_word: τὸ σπέρμα
  choice: 后裔
  rationale: 既可指后代谱系，也可指其中一位代表性后裔；中文保留其单数集合名词的歧义。
theological_decisions:
- issue: 第7—8节残损希腊文本的重构
  choice: 译为利未领受祭司职分、犹大领受王权，并警告不可敌对这二者。
  alternative: 保留为句法断裂的残篇，或只笼统预告未来掌权者而不明说祭司职分与王权。
  rationale: 现存引文在此明显残损，但可辨认的“利未”“犹大”及后文尊重利未与其后裔的劝告，支持传统所保存的双重授职大意。正文简洁呈现可能原意，并以脚注公开文本困难。
- issue: 第11节“在他里面作王”的指代
  choice: 保留“主拣选在他里面……作王”的结构。
  alternative: 明确解释为主借利未作王，或把“他”改指某位未来君王。
  rationale: 上下文并列利未和犹大，指代及传统层次存在张力；不在译文中强行归入单一谱系或教义解释。
- issue: 第12节后裔、死亡与永远之王的关系
  choice: 译作“这后裔必……死去；在你们中间，必有一位永远的王”，不明确断定两者是否同一位。
  alternative: 明确把后裔解释为利未祭司谱系，或明确认定为犹大支派的弥赛亚。
  rationale: 原文同时使用集合性的“后裔”、单数动词和“永远的王”，但未清楚解决谱系与身份关系；译文保留这种末世与王权期待的真实歧义。
- issue: 第12节 προσκυνήσατε 的敬拜含义
  choice: 译为“俯伏致敬”。
  alternative: 译为“敬拜”。
  rationale: 该动词可指向人或统治者行俯伏礼，并不必然指神圣敬拜；此处对象为“后裔”，故采用不预断其神性身份的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。伦理劝诫保持直接有力，但避免古奥文言和现代口语化俚语。对性别相关句子忠实保留古代文本的说话视角，同时用“过分亲近”等措辞避免把一般男女交往本身绝对化。神学与谱系指代有歧义之处不作宗派化消解；文本残损处明确加注。
