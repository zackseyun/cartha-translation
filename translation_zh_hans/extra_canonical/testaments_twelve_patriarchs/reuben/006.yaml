- from: '《吕便遗训》第6章


    1 所以，你们要谨防淫乱，常保心思纯洁；也要约束自己的感官，不因任何女子而放纵。2 也要吩咐女子，不可与男子过分亲近，好让她们也常保心思纯洁。3 因为频繁相会，即使没有做出那不敬虔的事，对她们仍是一种无法医治的疾病；对我们则是来自彼列[b]、使人灭亡的羞耻，也是永远的耻辱。4 淫乱本身既无明智，也无对上帝的敬畏；各种嫉妒都藏在它的欲望之中。


    5 因此我告诉你们：你们必嫉妒利未的子孙，想要高抬自己，超过他们；但你们必因此不能得逞。6 因为上帝必为他们施行报应，你们却必死于恶惨的结局。7 上帝把祭司职分赐给利未，也把王权一同赐给犹大。8 所以，不可自高，敌对这二者；主将从他们成就那要宣告的事。[a]


    9 我指着天上的上帝郑重嘱咐你们：各人都要以真实待邻舍[c]，也要以爱心待弟兄。10 你们要存谦卑的心亲近利未，好从他口中领受祝福。11 因为他必为以色列和犹大祝福；主拣选在他里面，在全体百姓面前作王。12 你们也要向他的后裔俯伏致敬[d]，因为这后裔必为你们在看得见和看不见的争战中死去；在你们中间，必有一位永远的王。'
