base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/006.yaml
  text: For in this way they also enticed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were transforming themselves into the form of men and appearing to them while their husbands were with them.
translation:
  language: zh_hans
  text: 她们就是这样引诱了洪水以前的守望者[a]；因为守望者不断注视她们，也对她们生出了欲念，并在心里构想了那行为。因为他们变作男子的形貌，在她们与丈夫同在时向她们显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守望者”是古代犹太文献中对一类超自然存在的称呼；本节没有进一步说明其身份。
    reason: 普通读者可能把该词理解为一般看守人员，需要交代其文学语境，同时避免直接等同于某一特定天使类别。
lexical_decisions:
- source_word: ἔθελξαν
  choice: 引诱
  rationale: 该词可指施魅惑或诱引；上下文强调由观看而生欲念，译作“引诱”既自然，也不额外断定使用了法术。
- source_word: Ἐγρηγόρους
  choice: 守望者
  rationale: 这是犹太启示文学中对超自然存在的传统称谓；采用直译并以脚注说明。
- source_word: ἐπιθυμίᾳ
  choice: 欲念
  rationale: 在本段性诱惑的语境中指欲望，译为“欲念”保留其负面伦理色彩。
- source_word: συνέλαβον τῇ διανοίᾳ τὴν πρᾶξιν
  choice: 在心里构想了那行为
  rationale: 保留“在心智中形成/设想行为”的表达，不将尚有含混的“行为”具体化为犯罪或性交。
- source_word: μετεσχηματίζοντο εἰς ἄνδρα
  choice: 变成男人的形态
  rationale: 原文单数ἄνδρα用于类别意义；“男人的形态”表达外形转变，而不武断说明本体变化。
- source_word: συνουσίᾳ
  choice: 交合
  rationale: 结合“丈夫”及本段语境，此处指性交；“交合”准确、庄重且易懂。
- source_word: συνεφαίνοντο αὐταῖς
  choice: 也向守望者显现
  rationale: 传本在代词及句法上有困难；依段落逻辑和英文本审校层，表达这些女人在与丈夫交合时向守望者显现。
theological_decisions:
- issue: “守望者”的身份
  choice: 保留专名式称谓“守望者”
  alternative: 解释为“天使”或“堕落天使”
  rationale: 原文只使用Ἐγρηγόροι，并未在本节明确界定其身份；不把后来的神学分类写入正文。
- issue: 变形与显现的性质
  choice: 按原文描述为“变成男人的形态”并“显现”
  alternative: 解释为幻象、梦境、附身或实际肉身变化
  rationale: 原文没有说明其机制，应保留超自然叙述本身的开放性。
- issue: 末句代词所指
  choice: 按上下文将变形者理解为女人，将显现对象理解为守望者
  alternative: 依部分表面句法或异文作其他代词对应
  rationale: 原始材料含明显异文和代词困难；此处理解最符合前句“她们引诱守望者”以及整段叙事推进，但不进一步补足原文未明说的机制。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。保留原文重复推进的因果结构，但拆分长句以提高可读性；对有文本困难的末句作最低限度的语义澄清，不将“那行为”过度具体化。
