revisions:
- from: 她们就是这样引诱了洪水以前的守望者[a]；因为守望者不断注视她们，也对她们生出了欲念，并在心里构想了那行为。她们变成男人的形态，在与丈夫交合时，也向守望者显现。
  to: 她们就是这样引诱了洪水以前的守望者[a]；因为守望者不断注视她们，也对她们生出了欲念，并在心里构想了那行为。因为他们变作男子的形貌，在她们与丈夫同在时向她们显现。
  rationale: 修订末句以恢复原文及英文审校文本所呈现的叙事关系：守望者因不断观看女子而生欲念、谋划行为，继而变作男子的形貌，向那些女子显现。“同在”保留συνουσία在此可能具有的“相伴、同处”含义，不把有歧义的表达具体化为性交。
