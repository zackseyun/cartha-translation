    rationale: 草稿称“她们变成男人的形态……向守望者显现”，但该句承接前文的守望者作为主语：守望者变作男子的形貌，并向女子显现。英文审校文本也明确采用这一方向。
  - severity: medium
    issue: 将τῇ συνουσίᾳ τῶν ἀνδρῶν αὐτῶν译为“在与丈夫交合时”。
    rationale: 此处可指与丈夫在一起/同处；在这一句法和审校文本中，不宜无必要地具体化为性交。应保留较宽的“与丈夫同在时”。
  - severity: low
    issue: “也”在“也对她们生出了欲念”中弱化了κἀκεῖνοι的对应关系。
    rationale: 可保留，但以“他们也”明确再次指向守望者，更清楚地呈现原文的重复主语。
