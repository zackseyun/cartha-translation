  naturalness: “在她们与丈夫同在时向她们显现”准确表达时间/伴随情境，现代汉语自然庄重。“男子的形貌”比“男人的形态”更贴近变形/外观的叙述。
  terminology: “守望者”“欲念”“构想那行为”均可保留。“同在”避免将 συνουσία过度限定为“交合”，也与英文审校轨迹的“while their husbands were with them”一致。
