source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Λοιπὸν φεύγετε ἄνθρω- τέκνα μου τὴν πορνείαν⁴², *καὶ προστάσσετε⁴³ ταῖς γυναιξὶν που βιά- ὑμῶν⁴⁴ καὶ ταῖς θυγατράσιν Γὑμῶν˥⁴⁵, ἵνα μὴ κοσμῶσι⁴⁶ σασθαι. τὰς⁴⁷ κεφαλὰς αὐτῶν⁴⁸ καὶ τὰς ὄψεις⁴⁹ *πρὸς ἀπάτην διανοίας⁵⁰, ὅτι πᾶσα γυνὴ⁵¹ δολιευομένη ἐν τούτοις εἰς κόλασιν⁵² αἰώνιον⁵³ τετήρηται⁵⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/005.yaml
  text: Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and faces for the deception of the mind; for every woman who deceives by these things is reserved for eternal punishment.
translation:
  language: zh_hans
  text: 所以，我的孩子们，要逃避淫乱；也要吩咐你们的妻子和女儿，不可为迷惑心思而装饰自己的头部和面容；因为凡借着这些装饰行欺骗的女人，都被留待永远的刑罚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείαν
  choice: 淫乱
  rationale: 该词泛指不合正当规范的性行为；“淫乱”既保留其道德分量，也比仅指某一种行为的译法更宽泛。
- source_word: κοσμῶσι
  choice: 装饰
  rationale: 基本义为装点、修饰；与“头发和容貌”搭配时，“装饰”忠实保留原文措辞及其批判语气。
- source_word: τὰς κεφαλὰς ... καὶ τὰς ὄψεις
  choice: 自己的头发和容貌
  rationale: κεφαλάς直译为“头”，但在装饰语境中自然指头部或发饰；译作“头发”符合现代汉语。ὄψεις指脸面、外观，译作“容貌”。
- source_word: πρὸς ἀπάτην διανοίας
  choice: 以迷惑心思
  rationale: 保留目的结构；διανοίας所指是谁的心思并未明说，因此不擅自补为“男人的心”或其他特定对象。
- source_word: δολιευομένη ἐν τούτοις
  choice: 借这些事施行欺骗
  rationale: 将分词的持续性欺骗行为直接表达出来；“这些事”回指前述装饰，不把其含义扩大为一般性的诡诈。
- source_word: εἰς κόλασιν αἰώνιον τετήρηται
  choice: 被留待永远的刑罚
  rationale: τετήρηται是完成时被动态，表达已经处于被保留、等候某结局的状态；“留待”保留刑罚尚待施行的语感。
theological_decisions:
- issue: “永远的刑罚”的性质与持续时间
  choice: 按字面译为“永远的刑罚”
  alternative: 永恒的惩治／来世的刑罚
  rationale: αἰώνιον直接修饰κόλασιν；译文保留原文的强烈末世审判措辞，不进一步界定刑罚的方式或哲学性质。
- issue: 受刑对象的表述
  choice: 保留原文“凡……的女人”的普遍命题形式
  alternative: 弱化为泛指任何行骗的人
  rationale: 原文明确使用πᾶσα γυνή，虽其论述带有鲜明的古代性别语境，译者不应改写或消除这一特征。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我的孩子们”保留父辈遗训的称呼；分号呈现劝诫、命令与理由之间的层次。未补入原文没有明说的受迷惑者身份，也未用现代解释缓和原文对女性装饰及刑罚的严厉判断。
