  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/003.yaml
  text: For an angel of God also told me and taught me concerning them that women are overcome by the spirit of sexual immorality more than men, and in their hearts they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive.
translation:
  language: zh_hans
  text: 因为上帝的一位天使也曾把有关她们的事告诉我，并教导我说：女人比男人更容易被淫乱之灵制伏；她们心里图谋对付男人，借着妆饰迷惑他们的心思，又借着眼神播下毒素，先是如此，随后以行动把他们俘获。¹
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡττῶνται
  choice: 更容易被……制伏
  rationale: 保留被动语态及比较意味；用“更容易”自然表达与男人相比的程度差异。
- source_word: τῷ πνεύματι τῆς πορνείας
  choice: 被淫乱之灵
  rationale: 按原文保留人格化或属灵力量的表达，不将其弱化为单纯的欲望或倾向。
- source_word: ἐν καρδίᾳ μηχανῶνται κατὰ τῶν ἀνθρώπων
  choice: 她们心里设计谋害男人
  rationale: μηχανῶνται含策划、设谋之意，κατά表示敌对指向；“谋害”在此表示图谋加害，不限定为杀害。
- source_word: διὰ τῆς κοσμήσεως
  choice: 借着妆饰
  rationale: κόσμησις指装扮、装饰；“妆饰”兼顾衣饰与修饰外表，语体庄重。
- source_word: πλανῶσι … τὰς διανοίας
  choice: 迷惑他们的心思
  rationale: πλανάω表示使偏离、迷惑，διάνοια指思想或心思；宾语代词按抄本所示理解为男人的心思。
- source_word: διὰ τοῦ βλέμματος τὸν ἰὸν ἐνσπείρουσι
  choice: 用眼神播下毒素
  rationale: 保留“播种毒素”的强烈隐喻；βλέμμα译为具有传情或影响作用的“眼神”。
- source_word: πρῶτον … τότε τῷ ἔργῳ αἰχμαλωτίζουσιν
  choice: 先在心思上，随后以行动把他们俘获
  rationale: 原文传抄在“先……”处略显不整齐；依据上下文及英译审校层保留思想—行动的递进，同时以自然汉语呈现。
theological_decisions:
- issue: “淫乱之灵”应理解为灵体还是倾向
  choice: 保留“淫乱之灵”
  alternative: 译作“淫乱的欲望／倾向”
  rationale: 原文明确使用πνεῦμα；直译可保存其可能指属灵力量、支配性倾向或人格化恶习的歧义，避免预先作神学裁断。
- issue: 本节关于女人与男人的概括
  choice: 照原文保留比较性陈述
  alternative: 改写为仅针对特定女人或淡化性别比较
  rationale: 原文确有γυναῖκες与ἄνδρα的比较；译文不替作者修正其论断，也不将其扩展为译者自身的普遍教义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留遗训文学的告诫语气；不额外添加道德评注。原文“先……”附近可能存在文本或句法困难，本稿依上下文译为“先在心思上，随后以行动”，但正文不设脚注，以免在缺少明确异文资料时制造过度说明。
