revisions:
- from: 因为上帝的一位天使也曾把有关她们的事告诉我，并教导我说：女人比男人更容易被淫乱之灵制伏；她们心里设计谋害男人，借着妆饰迷惑他们的心思，又用眼神播下毒素，先在心思上，随后以行动把他们俘获。
  to: 因为上帝的一位天使也曾把有关她们的事告诉我，并教导我说：女人比男人更容易被淫乱之灵制伏；她们心里图谋对付男人，借着妆饰迷惑他们的心思，又借着眼神播下毒素，先是如此，随后以行动把他们俘获。¹
  rationale: 将“谋害”改为较宽泛的“图谋对付”，避免把敌对图谋限定为杀害。末句改为不补足原文未明示的“心思”，同时保留先后与“以行动”的对照，并加脚注呈现英语审校文本所反映的一种合理解释。其余措辞维持原稿的现代庄重语体及原文较尖锐的修辞。
