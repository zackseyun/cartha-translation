    reason: 说明所给希腊文本末句的句法／文本困难，并避免将“在心思上”作为无标注的确定正文。
  revision_rationale: 将“谋害”改为较宽泛的“图谋对付”，避免把敌对图谋限定为杀害。末句改为不补足原文未明示的“心思”，同时保留先后与“以行动”的对照，并加脚注呈现英语审校文本所反映的一种合理解释。其余措辞维持原稿的现代庄重语体及原文较尖锐的修辞。
