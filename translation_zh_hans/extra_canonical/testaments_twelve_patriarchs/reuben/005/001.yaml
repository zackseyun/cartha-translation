base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/001.yaml
  text: For women are evil, my children; and because they have no authority or power over the man, they scheme by their appearance how they may draw him to themselves.
translation:
  language: zh_hans
  text: 女人是邪恶的，我的孩子们；因为她们对男人没有权柄或能力，便借着外表施展诡计，设法把他吸引到自己身边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πονηραὶ
  choice: 邪恶的
  rationale: 直接保留原文强烈的道德判断，不弱化为“坏”或“有缺点”。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 自然表达直接称呼，并保留亲属语气。
- source_word: ἐξουσίαν ἢ δύναμιν
  choice: 权柄或能力
  rationale: 分别体现ἐξουσία的权柄、支配权含义与δύναμις的实际能力含义，保留二者并列。
- source_word: ἐπὶ τὸν ἄνδρα
  choice: 辖制男人
  rationale: ἐπί在此与“权柄或能力”相连，表示对男人施加支配；定冠词可作类指，现代汉语自然译为“男人”。
- source_word: δολιεύονται
  choice: 施展诡计
  rationale: 体现动词的欺骗、谋算意味，比中性的“设法”更符合原文。
- source_word: ἐν σχήμασιν
  choice: 用外貌
  rationale: σχήματα在此语境指外在形态、仪态或装扮；“外貌”简洁自然，同时避免擅自限定为服饰。
- source_word: πρὸς ἑαυτὰς ἐπισπάσωνται
  choice: 把他吸引到自己身边
  rationale: 保留朝向自身拉拢、吸引的动态意象，不额外明确其目的。
theological_decisions:
- issue: 经文对女人的概括性负面判断
  choice: 直译为“女人是邪恶的”
  alternative: 女人会作恶／女人心术不正
  rationale: 原文使用明确的表语形容词并以复数类指女人；翻译不应因现代敏感性而削弱或改写这部古代作品的陈述。
- issue: “男人”所指范围
  choice: 译作类指的“男人”
  alternative: 那个男人／一个男人
  rationale: 希腊语有定冠词，但上下文陈述一般性的性别关系；汉语用不带量词的“男人”可自然保留类指，而不误导为某个特定人物。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文尖锐且令人不适的性别判断，不加认同性解释，也不以委婉语消解。句法适度调整为汉语顺序，使因果与手段关系明晰。
