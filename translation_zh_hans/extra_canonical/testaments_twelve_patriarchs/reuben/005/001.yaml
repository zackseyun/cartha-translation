revisions:
- from: 因为女人是邪恶的，我的孩子们；她们既没有辖制男人的权柄或能力，就用外貌施展诡计，好把他吸引到自己身边。
  to: 女人是邪恶的，我的孩子们；因为她们对男人没有权柄或能力，便借着外表施展诡计，设法把他吸引到自己身边。
  rationale: 修订仅处理“辖制”造成的语义强化及因果连接的汉语表达，保留原文的类指“女人／男人”、尖锐道德判断、权柄与能力的并列、外表作为手段，以及吸引男人归向自身的目的。
