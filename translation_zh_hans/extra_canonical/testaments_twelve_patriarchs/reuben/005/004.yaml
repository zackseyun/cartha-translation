  text: For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him.
translation:
  language: zh_hans
  text: 因为女人不能当面强迫男人，却会以娼妓般的姿态对他施展诡计。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以娼妓般的姿态”也可译作“以淫荡的举止”；本句是本书劝诫语境中的概括性说法。
    reason: 说明σχῆμα与πορνικός可指外在姿态、举止或作派，并提示该泛称属于作品的劝诫性修辞，避免把它误读为译者补充的普遍性判断。
lexical_decisions:
- source_word: εἰς πρόσωπον
  choice: 当面
  rationale: 此短语直指“面对面、公开地”，译作“当面”自然简洁，并保留与后文隐蔽施计的对比。
- source_word: ἐν σχήματι πορνικοῖς
  choice: 用淫荡的姿态
  rationale: σχῆμα可指姿态、举止或外在表现；πορνικός带有淫乱、娼妓式的意味。此处采用自然中文表达，不把女性直接定性为娼妓。
- source_word: πανουργεύεται
  choice: 设法诱骗
  rationale: 该动词表示狡猾行事、施计；结合句中针对男人的性诱惑语境，“设法诱骗”传达其手段与目的，同时避免过度具体化。
- source_word: βιάσαι
  choice: 强迫
  rationale: 保留动词“以强力迫使”的基本含义，不弱化为一般的说服或引诱。
theological_decisions:
- issue: 本句对女性行为的概括范围
  choice: 按原文保留泛称“女人”
  alternative: 译为“一个女人”或“这样的女人”以限制范围
  rationale: 希腊文γυνή无冠词，但在格言式语境中可作类称。正文不擅自缩小范围；脚注提示其属于作品中人物劝诫的概括性陈述，避免将其无条件提升为普遍教义。
- issue: 诱惑手段的性质
  choice: 译作“淫荡的姿态”
  alternative: “娼妓的作派”
  rationale: 原文描述行为方式，不必断言行为者具有娼妓身份；所选译法保留道德张力而不过度定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“当面……却……”清楚呈现希腊文的对照结构；“设法诱骗”比生硬的“狡猾地对付他”更符合本句性诱惑语境。原始文本中可见校勘符号与版本异文痕迹，但所给资料不足以完整重建异文，故不在正文中臆测补足。
