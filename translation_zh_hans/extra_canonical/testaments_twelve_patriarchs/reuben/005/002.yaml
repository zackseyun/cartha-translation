  text: And the one whom they are not able to enchant by appearance, him they overcome through deceit.
translation:
  language: zh_hans
  text: 她们若不能凭外貌迷惑某人，就用欺骗手段胜过他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχήματος
  choice: 外貌
  rationale: 这里指可见的形貌、仪态或外在吸引力；译作“外貌”自然简明，也与上下文中借姿色诱惑人的意思相符。
- source_word: οὐκ ἰσχύουσιν
  choice: 无法
  rationale: 表达“不具备能力、不能做到”，比直译为“不够强”更符合现代汉语。
- source_word: καταγοητεῦσασθαι
  choice: 迷惑
  rationale: 原词可指施魅惑、蛊惑；“迷惑”保留以外貌使人着迷并受其影响的意味，同时避免无根据地限定为字面巫术。
- source_word: ἀπάτης
  choice: 诡计
  rationale: 原词表示欺骗、诡诈；“诡计”在“用……”结构中自然，并突出所采用的欺骗手段。
- source_word: καταγωνίζονται
  choice: 制伏
  rationale: 原词有战胜、压倒之意；“制伏”保留支配并胜过对方的力度，比泛化为“对付”更准确。
theological_decisions:
- issue: 复数主语的性别呈现
  choice: 她们
  alternative: 他们
  rationale: 希腊语动词本身不标明性别，但本章近处语境的施动者是女性；现代汉语用“她们”可自然承接该语境，并非加入额外神学判断。
- issue: “迷惑”是否理解为实际巫术
  choice: 保留可涵盖魅惑与蛊惑的“迷惑”
  alternative: 施法迷住
  rationale: καταγοητεύω具有魅惑色彩，但本句明确说借“外貌”；不宜将其收窄成实际施行法术。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原句“无法用外貌……就用诡计……”的手段对照，并用“制伏”体现末尾动词的强度。
