source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Κἀκεῖναι γὰρ⁷⁰ ἐπιθυμοῦσαι * τῇ διανοίᾳ τῆς φαντασίας⁷¹ αὐτῶν ἔτεκον⁷² γίγαντας. Ἐφαίνοντο γὰρ αὐταῖς⁷³ * οἱ Ἐγρήγοροι⁷⁴ * ἕως εἰ θέλετε τοῦ οὐρανοῦ φθάνοντες⁷⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/007.yaml
  text: And those women also, desiring in their minds their appearance, gave birth to giants. For the Watchers appeared to them as reaching to heaven.
translation:
  language: zh_hans
  text: 那些女人也心中贪慕他们的形貌，便生下了巨人。因为那些守望者向她们显现，仿佛高耸直达天上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仿佛高耸直达天上”直译可作“显现为伸达天上”；原文在此含有相当于“若你愿意这样说”的插入语，表示修辞性的限定。
    reason: 说明末句不寻常的希腊语插入语及其表象性，同时避免将守望者的高度表述为不受限定的事实断言。
lexical_decisions:
- source_word: ἐπιθυμοῦσαι
  choice: 贪恋
  rationale: 表达强烈欲望，并承接本章有关情欲的语境；比中性的“渴望”更贴近此处的负面意味。
- source_word: τῇ διανοίᾳ
  choice: 在意念中
  rationale: 保留欲望发生于思想、心念层面的含义，同时采用现代汉语中自然且庄重的说法。
- source_word: τῆς φαντασίας αὐτῶν
  choice: 他们的形貌
  rationale: φαντασία在这里指呈现于心目中的外观或形象；“形貌”既可指所见外表，也不把含义限定为纯粹幻想。αὐτῶν直译为“他们的”，不在正文中擅自补定其所指。
- source_word: ἔτεκον γίγαντας
  choice: 生下了巨人
  rationale: 直接保留生育动作及γίγαντας的传统称谓。
- source_word: οἱ Ἐγρήγοροι
  choice: 那些守望者
  rationale: 采用犹太启示文学中对该群体的通行称呼，并用“那些”承接特指冠词。
- source_word: Ἐφαίνοντο
  choice: 向她们显现时
  rationale: 该动词可表示“显现”或“看起来”；此译保留守望者向女人呈现形象的叙事动作。
- source_word: ἕως εἰ θέλετε τοῦ οὐρανοῦ φθάνοντες
  choice: 可以说高达天际
  rationale: “可以说”体现εἰ θέλετε的插入语气，“高达天际”自然传达其形象仿佛延伸至天上的意思。
theological_decisions:
- issue: “他们的形貌”所指
  choice: 正文保留代词“他们”，脚注提示可能指守望者
  alternative: 直接译作“守望者的形貌”
  rationale: 希腊文在首次明说“守望者”之前使用αὐτῶν；虽然后文强烈暗示其所指，正文仍不应完全消除原句的前指关系和轻微含混。
- issue: 巨人的出生与女人心中欲望之间的关系
  choice: 依照原句并列叙述，不补充受孕机制
  alternative: 解释为因幻想而受孕，或明确说与守望者结合后生育
  rationale: 原文只说女人在意念中贪恋其形貌，继而生下巨人；不宜加入文本未明说的生理或超自然机制。
- issue: 守望者“高达天际”的性质
  choice: 译为显现时“可以说高达天际”
  alternative: 断言守望者实际具有直达天上的身高
  rationale: Ἐφαίνοντο及εἰ θέλετε带有观感和修辞限定，宜保留其现象性，不将其转化为严格的形体陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“意念中”“形貌”“天际”略带文学色彩，适合古代宗教文本，但避免过度古雅。正文保留原文代词关系与末句修辞限定；脚注标记已在正文中对应出现。
