revisions:
- from: 那些女人也在意念中贪恋他们的形貌，便生下了巨人。因为那些守望者向她们显现时，可以说高达天际。[a]
  to: 那些女人也心中贪慕他们的形貌，便生下了巨人。因为那些守望者向她们显现，仿佛高耸直达天上。[a]
  rationale: 修订首句的汉语搭配，并将末句恢复为守望者显现时“仿佛”伸达天上的视觉／修辞表述。仍保留“他们”未在前句明指的语篇关系，不补充守望者与女人结合或受孕的机制。
