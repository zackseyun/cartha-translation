base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/007.yaml
  text: The sixth is the spirit of taste, by which eating of foods and drinks comes to be, and strength is built up in it, because in foods is the basis of strength.
translation:
  language: zh_hans
  text: 第六是味觉之灵，借着它，人得以吃喝；力量也在其中建立起来，因为食物是力量的根基。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα γεύσεως
  choice: 味觉之灵
  rationale: 直译属格结构，保留本段以“灵”描述人的感官能力的表达方式。
- source_word: μεθ’ ἧς γίνεται βρῶσις βρωμάτων τε καὶ πομάτων
  choice: 借着它，人得以吃喝
  rationale: μετά加属格在此表凭借；将希腊文较迂回的“食物和饮料的进食”化为自然汉语，同时不增添原文以外的具体动作。
- source_word: ἰσχὺς ἐν αὐτῷ κτίζεται
  choice: 力量也由此建立起来
  rationale: κτίζεται保留“建立、形成”的意象；ἐν αὐτῷ的指代存在一定张力，译作“由此”避免在中文中武断限定为味觉、进食或食物。
- source_word: ὑπόστασις τῆς ἰσχύος
  choice: 力量的根基
  rationale: ὑπόστασις在此指支撑或基础，而非后期神学术语意义上的“位格”或形而上学的“实体”。
theological_decisions:
- issue: πνεῦμα在感官列表中的含义
  choice: 译作“灵”
  alternative: 译作“能力”或“功能”
  rationale: 原文反复使用πνεῦμα；保留“灵”可维持文本自身的人论表达，不将其预先解释为纯生理功能。
- issue: ἐν αὐτῷ的所指
  choice: 用“由此”保留一定开放性
  alternative: 明确译为“在味觉中”“借着吃喝”或“在食物中”
  rationale: 阳性/中性代词与附近名词的对应并不完全明朗，且传本文字可能反映较生硬的表达；不宜在译文中强行消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“吃喝”比“食用食物和饮料”更自然；分号呈现因果说明前的停顿。未设置脚注，因此正文无脚注标记。
