source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Διὰ τοῦτο *ἔσχατόν ἐστι τῆς κτίσεως³¹ καὶ πρῶτον τῆς νεότητος, ὅτι *ἀγνοίας πεπλήρωται³², καὶ αὕτη τὸν νεώτερον³³ ὁδηγεῖ ὥσπερ³⁴ τυφλὸν ἐπὶ βόθρον καὶ ὡς κτῆνος ἐπὶ κρημνόν³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/009.yaml
  text: Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the younger man like a blind man into a pit and like an animal over a cliff.
translation:
  language: zh_hans
  text: 所以，这灵在受造之物中居末，在年轻人中却居首，因为它充满无知；它引领较年轻的人，如同领着盲人走进坑中，又如同赶着牲畜走向悬崖。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατόν ἐστι τῆς κτίσεως
  choice: 在受造的次序中居末
  rationale: 保留“受造/创造”与“末后”的关系，同时用“次序中”使汉语自然；不把 κτίσις 过度解释为某一具体创造阶段。
- source_word: πρῶτον τῆς νεότητος
  choice: 在青春时期却居首
  rationale: νεότης 指青春、年轻时期；“居首”与前句“居末”形成原文的鲜明对照。
- source_word: ἀγνοίας πεπλήρωται
  choice: 充满无知
  rationale: 直译其完成时被动结构所表达的状态，不弱化为单纯的经验不足。
- source_word: τὸν νεώτερον
  choice: 较年轻的人
  rationale: 保留比较级 νεώτερον 的含义，避免仅译作泛指的“年轻人”；原文未明确限定性别，故采用“人”。
- source_word: ἐπὶ βόθρον
  choice: 走向坑穴
  rationale: βόθρος 可指坑、深坑；“坑穴”保持具体意象而不过度指定其用途。
- source_word: ὡς κτῆνος ἐπὶ κρημνόν
  choice: 如同赶着牲畜走向悬崖
  rationale: κτῆνος 是牲畜或畜类，κρημνός 是陡崖、悬崖；补出“赶着”以自然呈现共同谓语“引领”在第二个比喻中的作用。
theological_decisions:
- issue: 句首所指对象是否明确为“这灵”
  choice: 这灵
  alternative: 省略主语，译作“所以，它……”
  rationale: 本节希腊文本以中性形容词 ἔσχατον 承接上下文所论之“灵”；英语审校层也明确补出 this spirit。译为“这灵”可维持篇章指代而不增添其性质或身份。
- issue: “受造的次序中居末”是否指时间上最后被创造
  choice: 保留关系性表述，不明确断定为时间顺序
  alternative: 最后被造
  rationale: τῆς κτίσεως 的属格关系可以自然理解为在创造中的末位，但原句未展开其精确含义；避免把潜在的次序、地位或阶段关系单一化为时间断言。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。通过“居末／居首”保留原文对偶；“如同……又如同……”保留两个并列比喻。无脚注标记，因为本节无需以脚注处理文本歧义。
