lexical_decisions:
- source_word: Ἑπτὰ οὖν πνεύματα
  choice: 所以，有七个灵
  rationale: 保留数目、“灵”及οὖν的承接作用，以自然现代汉语表达。
- source_word: ἐδόθη κατὰ τοῦ ἀνθρώπου
  choice: 被赐下，与人作对
  rationale: ἐδόθη用被动式“被赐下”；κατά加属格在此带敌对意味，译作“与人作对”，不进一步说明赐予者。
- source_word: αἱ κεφαλαὶ
  choice: 源头
  rationale: 字面为“头”，在此可指首要根源或支配性的开端；正文用自然的“源头”，脚注保留字面结构及可能范围。
- source_word: τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: 年轻时所行之事
  rationale: ἔργων为行为、所做之事；νεωτερισμός在此与年轻阶段及其倾向相关。译文不直接加入“罪”，以免超出原文。
theological_decisions:
- issue: 七个灵与人的关系
  choice: 与人作对
  alternative: 针对人／加在人身上
  rationale: κατὰ τοῦ ἀνθρώπου最自然地表达敌对关系；仍保留被动“被赐下”所造成的张力，不解释赐予者及目的。
- issue: “年轻时所行之事”是否明确为罪
  choice: 不在正文增添“罪”
  alternative: 年轻时所犯之罪
  rationale: 原文仅说“行为／事”，虽上下文可能具有负面含义，翻译不应把隐含判断直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被赐下，与人作对”保留希腊文被动结构和敌对意味；“年轻时所行之事”避免生硬的“年轻之作为”，也不擅自补入“罪”。
