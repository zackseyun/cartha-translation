  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/001.yaml
  text: And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance.
translation:
  language: zh_hans
  text: 现在，我的孩子们，你们要听我讲我在悔改中看见的、关于那七个迷惑之灵[a]的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“错误之灵”或“迷妄之灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: 请听我讲
  rationale: 该表达直译为“听我”，在现代汉语中以“听我讲”自然传达听取说话者陈述之意；加入“请”符合父亲对子女郑重劝告的语气。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留亲属称谓和复数，语言自然庄重。
- source_word: ἃ εἶδον περὶ
  choice: 我所看见的、有关……的事
  rationale: 保留关系代词所指内容及 περὶ 的“有关、关于”含义，不把异象内容与七灵完全等同。
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: 那七个……之灵
  rationale: 保留明确数目与 πνεῦμα 的属灵实体含义；“那”使汉语指称自然。
- source_word: τῆς πλάνης
  choice: 迷惑
  rationale: πλάνη 可指错误、迷误、欺骗或迷惑；“迷惑”既可表示使人误入歧途，也保留其性质上的含混。
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: 我悔改时
  rationale: 将介词结构自然处理为时间背景，同时不排除“在悔改过程中”的含义。
theological_decisions:
- issue: “七个灵”与“迷惑”的关系
  choice: 七个迷惑之灵
  alternative: 七个错误之灵／七个迷妄之灵
  rationale: 采用属格性质表达，不进一步界定这些灵是人格化实体、内在倾向还是修辞形象。
- issue: ἐν τῇ μετανοίᾳ μου 的范围
  choice: 我悔改时所看见的
  alternative: 我在悔改中所看见的
  rationale: 按最自然的现代汉语表达其时间或处境意义，同时避免把“悔改”解释为特定礼仪或教义过程。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“现在，我的孩子们”保留临终训诲式称呼；句序经过轻度调整，以避免希腊语结构在中文中显得生硬。
