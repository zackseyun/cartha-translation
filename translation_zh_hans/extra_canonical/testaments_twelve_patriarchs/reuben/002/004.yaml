source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πρῶτον πνεῦμα ζωῆς, μεθ’ ἧς ἡ σύστασις¹⁶ κτίζεται. Δεύτερον πνεῦμα ὁράσεως, μεθ’ ἧς γίνεται ἐπιθυμία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/004.yaml
  text: The first is the spirit of life, with which the constitution is formed. The second is the spirit of sight, with which desire arises.
translation:
  language: zh_hans
  text: 第一种是生命之灵，人的构成与它一同被创造。第二种是视觉之灵，欲望与它一同产生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα ζωῆς
  choice: 生命之灵
  rationale: 直译这一短语，并保留本段将人的官能称为“灵”的表达方式。
- source_word: σύστασις
  choice: 人的构造
  rationale: 此词可指构成、组织或结构；结合上下文，指人的整体构成。补出“人的”使现代汉语指向清楚，但不进一步限定为身体或性情。
- source_word: πνεῦμα ὁράσεως
  choice: 视觉之灵
  rationale: ὅρασις在此指观看、视觉官能；“视觉”比“眼目”更贴近抽象名词，同时保留“之灵”的平行结构。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 此词可表示欲求、渴望或情欲；采用中性的“欲望”，不预先判定其道德性质。
- source_word: γίνεται
  choice: 产生
  rationale: 表达欲望随视觉而出现、形成，符合此处γίνομαι的语义，同时保持简洁自然。
theological_decisions:
- issue: “灵”是人格化实体还是人的官能
  choice: 保留“生命之灵”“视觉之灵”
  alternative: 译作“生命的能力”“视觉的官能”
  rationale: 原文重复使用πνεῦμα；直保“灵”可维持古代人论的表述及其可能的实体性或功能性歧义，不以现代心理学术语消解。
- issue: 欲望的道德性质
  choice: 译为中性的“欲望”
  alternative: 译为带负面意味的“贪欲”或“情欲”
  rationale: 本句本身只说明ἐπιθυμία的产生，未明确作道德判断，因此不额外赋予罪恶含义。
- issue: 介词μετά与关系代词的关联含义
  choice: 译作“由它”
  alternative: 译作“与它一同”
  rationale: 这里既可强调伴随，也可表达相关媒介；按汉语自然表达采用“由它”，但不扩写为严格的机械因果。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。两句保持平行结构；“人的构造”用于避免“构成形成”之类的重复，也不把σύστασις过度具体化为身体。
