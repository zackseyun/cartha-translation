  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/005.yaml
  text: The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are given for the drawing in of air and breath[c].
translation:
  language: zh_hans
  text: 第三是听觉之灵，借此而有教导。第四是嗅觉之灵；借此，滋味被赋予，为要吸入空气和气息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这里把嗅觉、滋味以及吸入空气和气息连在一起，措辞较难理解，可能是高度压缩的表达，也可能反映文本传承不稳定。
    reason: textual_variant
lexical_decisions:
- source_word: πνεῦμα ἀκοῆς
  choice: 听觉之灵
  rationale: 保留πνεῦμα的“灵”及属格所表达的感官类别，与上下文列举诸灵的形式一致。
- source_word: μεθ’ ἧς γίνεται διδασκαλία
  choice: 教导借此而成
  rationale: μετά加关系代词在此表达媒介；采用“而成”保留γίνεται较宽泛的“形成、发生”意义，不缩窄为单纯听见教训。
- source_word: πνεῦμα ὀσφρήσεως
  choice: 嗅觉之灵
  rationale: 直接对应ὀσφρήσεως，并与“听觉之灵”保持平行。
- source_word: γεύσεις δεδομέναι
  choice: 滋味……被赋予
  rationale: γεύσεις可指味觉感受或滋味；“滋味”保留其具体而略显异常的表述，“被赋予”贴近完成被动分词δεδομέναι。
- source_word: εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: 为要吸入空气和气息
  rationale: ὁλκή表示牵引、吸入；采用自然汉语“吸入”，同时分别保留ἀήρ与ἀναπνοή。
theological_decisions:
- issue: πνεῦμα在感官列表中的含义
  choice: 译作“灵”
  alternative: 译作“机能”或“能力”
  rationale: 原文明确使用πνεῦμα，且作品语境将诸感官称为“灵”；不以现代生理术语消解其古代人论表达。
- issue: 嗅觉、滋味与呼吸之间难解的关系
  choice: 按现存希腊文保留三者关系，并加注说明
  alternative: 改写为嗅觉或味觉通过吸气运作
  rationale: 原文可能经过压缩或文本传承不稳，无法稳妥确定其逻辑关系；不在正文中擅自补足。
