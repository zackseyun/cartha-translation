  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/008.yaml
  text: The seventh is the spirit of procreation and union, through which sins come together through love of pleasure.
translation:
  language: zh_hans
  text: 第七种灵是生育与交合之灵；罪借着贪爱享乐，随它一同汇聚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随它一同汇聚”：希腊文可直译为“罪借着贪爱享乐，与它一同聚集”。“随它”指前述“生育与交合之灵”；此处表达伴随关系，并未将这灵明确说成罪的唯一成因。
    reason: 说明 μεθ’ ἧς 与 συνέρχονται 的伴随和聚集含义，并避免把原文未明说的单向因果关系强加进正文。
lexical_decisions:
- source_word: σπορᾶς
  choice: 生育
  rationale: 该词本义涉及播种、繁衍或生殖；此处与 συνουσίας 并列，用“生育”自然表达其生殖含义，同时避免过度具体化。
- source_word: συνουσίας
  choice: 交合
  rationale: συνουσία 可指交往、结合，也可在本语境中指男女结合或性交；“交合”既保留“结合”的基本意象，也符合生育与享乐的上下文。
- source_word: μεθ’ ἧς συνέρχονται
  choice: 与它相伴而来
  rationale: μετά 加属格表示“与……一同”，而 συνέρχομαι 有“聚到一起、相会”之意；此译保留罪与该灵相随、汇聚而来的关系，不硬译为因果。
- source_word: φιληδονίας
  choice: 贪爱享乐
  rationale: φιληδονία 指对快乐或享乐的爱好；“贪爱享乐”传达其负面伦理色彩，又不限定为某一种具体快感。
theological_decisions:
- issue: “罪”与第七种灵之间的关系
  choice: 译为“罪……与它相伴而来”
  alternative: “罪借着它聚集起来”或“罪由它而来”
  rationale: 希腊文 μεθ’ ἧς 更直接表达伴随关系，而非明确的工具或因果关系；因此不将该灵说成罪的唯一原因。
- issue: φιληδονία 的范围
  choice: 保留为广义的“贪爱享乐”
  alternative: “情欲”或“贪恋肉欲”
  rationale: 原词本身可泛指爱好快乐；虽有性行为语境，却不足以将词义完全收窄为性欲。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“交合”比“性交”稍具经典文献语感，又比单用“结合”更准确地呼应生育语境；句中分号使第七种灵的名称与其后果清楚分开。
