  text: And seven other spirits were given to him at creation, so that every work of man might be in them.
translation:
  language: zh_hans
  text: 在创造之时，另有七个灵被赐给他，使人的一切作为都在它们之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερα ἑπτὰ πνεύματα
  choice: 另有七个灵
  rationale: 保留ἕτερα所表达的“另外、其他”之意，并以“灵”对应πνεύματα。
- source_word: ἐδόθη αὐτῷ
  choice: 被赐给他
  rationale: 保留希腊文被动语态以及未明说施予者的表达；αὐτῷ按上下文译为“他”。
- source_word: ἐπὶ τῆς κτίσεως
  choice: 在受造之时
  rationale: 将κτίσις理解为受造或创造这一事件，同时避免擅自明确究竟指他的受造还是整体创造。
- source_word: πᾶν ἔργον ἀνθρώπου
  choice: 人的一切行为
  rationale: ἔργον在此指人的作为或活动；“行为”比直译“工作”更符合现代汉语语境。
- source_word: ἐν αὐτοῖς
  choice: 在它们之中
  rationale: 保留介词短语的空间隐喻及其指向七个灵的复数关系，不将其解释性改写为“借着它们”。
theological_decisions:
- issue: 七个灵与人的行为之间的关系
  choice: 使人的一切行为都在它们之中
  alternative: 使人借着它们行一切事
  rationale: 原文ἐν αὐτοῖς具有一定含混性；正文保留“在……之中”的表述，不把它明确解释为工具、能力或行为类别。
- issue: κτίσις的所指范围
  choice: 在受造之时
  alternative: 在创造之时
  rationale: 原文可涉及创造事件，也可能特别关联“他”的受造；“受造之时”贴近英语审校层的理解，但仍不补出主语或更具体对象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句法尽量贴近希腊文逻辑，同时避免生硬直译；保留“灵”“在它们之中”等关键表达的神学张力与歧义。
