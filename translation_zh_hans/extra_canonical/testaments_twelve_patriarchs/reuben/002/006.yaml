  text: The fifth is the spirit of speech, by which knowledge comes to be.
translation:
  language: zh_hans
  text: 第五是言语之灵，知识借此产生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέμπτον πνεῦμα
  choice: 第五是……之灵
  rationale: 按上下文保留序数次序；希腊文省略系词，汉语补出“是”，使表达自然。
- source_word: λαλιᾶς
  choice: 言语
  rationale: 指说话、言谈的能力或活动；“言语”既简明又符合庄重的现代汉语语体。
- source_word: μεθ’ ἧς
  choice: 借此
  rationale: 介词 μετά 在这里表达伴随或凭借关系；译作“借此”能自然呈现言语与知识形成之间的关联，又不过度界定其机制。
- source_word: γίνεται γνῶσις
  choice: 知识……产生
  rationale: γίνεται 表示形成、产生或得以出现；“产生”保留动态含义，未弱化为静态的“有知识”。
theological_decisions:
- issue: “言语之灵”中 πνεῦμα 的性质
  choice: 保留“灵”
  alternative: 译作“能力”或“官能”
  rationale: 原文明确使用 πνεῦμα；保留“灵”可维持本段的思想框架，不预先将其解释为单纯的心理能力，也不把它特定化为圣灵。
- issue: 言语与知识的关系
  choice: 译作“知识借此产生”
  alternative: 译作“人借此获得知识”
  rationale: 原文以“知识”为主语，并未明说获得知识的人；现译保留这种概括性及可能的哲学含义。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。句式贴近希腊原文，同时补出汉语所需的系词；不添加原文未明说的主体或神学限定。
