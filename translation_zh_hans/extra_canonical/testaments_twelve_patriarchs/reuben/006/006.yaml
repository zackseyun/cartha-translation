  text: For God will execute vengeance on them, but you will die an evil death.
translation:
  language: zh_hans
  text: 因为上帝必向他们施行报应，而你们必不得好死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: 必向他们施行报应
  rationale: 按经校订后可理解的希腊文句法，将 αὐτῶν 视为承受报应的对象；“施行报应”既保留司法性意味，也符合现代汉语表达。
- source_word: ἀποθανεῖτε θανάτῳ πονηρῷ
  choice: 必不得好死
  rationale: 这是现代汉语中自然有力的表达，对应“死于恶劣/悲惨的死亡”；既传达结局的凶恶悲惨，也避免生硬重复“死一种恶死”。
theological_decisions:
- issue: 报应的施行者与对象
  choice: 上帝向他们施行报应
  alternative: 上帝施行他们的报应
  rationale: 选择与上下文及审订后的英文咨询层一致的对象性理解，但不扩写报应的具体性质。
- issue: πονηρός 修饰“死亡”的含义
  choice: 不得好死
  alternative: 死于邪恶的死亡／悲惨地死去
  rationale: 原词可含邪恶、凶险、悲惨等色彩；正文采用涵盖性较强且自然的汉语说法，不把它限定为纯道德判断或纯痛苦程度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“因为……而……”保留原文 γάρ 与 δέ 的因果和转折关系；两个“必”体现将来陈述的确定语气。
