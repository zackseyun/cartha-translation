base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/009.yaml
  text: I adjure you by the God of heaven, that each of you do truth toward his neighbor and that each have love toward his brother.
translation:
  language: zh_hans
  text: 我凭着天上的上帝郑重嘱咐你们：各人要以诚实待自己的邻舍，并且各人要爱自己的弟兄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρκῶ ὑμᾶς τὸν Θεὸν τοῦ οὐρανοῦ
  choice: 我指着天上的上帝嘱咐你们
  rationale: ὁρκῶ表示以誓言郑重要求或嘱咐；“指着……嘱咐”既保留以神为凭的庄重语气，也符合现代汉语表达。
- source_word: ποιεῖν ἀλήθειαν
  choice: 以诚实待
  rationale: 字面为“行真实／实行真理”；在“对邻舍”的人际语境中，译作“以诚实待”自然表达忠实、正直地行事，同时避免生硬的“做真实”。
- source_word: πλησίον
  choice: 邻舍
  rationale: 保留犹太—基督教伦理语境中指身边之人的传统而清楚的称谓，不仅限于住处相邻者。
- source_word: ἀγάπην ἔχειν
  choice: 爱
  rationale: 希腊文直译为“有爱”；现代汉语用动词“爱”更自然，并准确传达持续持有爱心的要求。
- source_word: ἀδελφόν
  choice: 弟兄
  rationale: 保留原文的亲属／共同体用语及其阳性单数形式，不擅自扩展或限定其所指。
theological_decisions:
- issue: “行真实”是指诚实行事还是实行真理
  choice: 以诚实待
  alternative: 行真实／践行真理
  rationale: ποιεῖν ἀλήθειαν具有语义张力；结合πρὸς τὸν πλησίον的人际指向，中文以“诚实待人”最为自然，但不把它解释成特定教义概念。
- issue: 以神起誓式嘱咐的表达
  choice: 指着天上的上帝嘱咐
  alternative: 奉天上上帝的名命令／我以天上的上帝为证劝你们
  rationale: 原文强调郑重起誓般的要求，却没有“奉……的名”措辞；所选译法既保留庄严性，也避免增添原文没有的权柄公式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“各人……各人也……”保留原文两次ἕκαστος的逐人强调；句式略作汉语化处理，使两个并列伦理要求清楚流畅。
