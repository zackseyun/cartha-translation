  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/001.yaml
  text: Guard yourselves, therefore, from sexual immorality, and keep your mind pure. Guard also your senses from every woman.
translation:
  language: zh_hans
  text: 所以，你们要防备淫乱，保持心思纯洁；也要守护你们的感官，使其远离任何女人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “任何女人”：希腊文作 πάσης γυναικῶν，字面近似“每一／所有女人”，但 πάσης（单数）与 γυναικῶν（复数）的搭配不规则，可能反映抄传或文本问题。译文保留其概括性措辞，未把“诱惑”补入正文。
    reason: 交代原文数配异常及“每一”与“所有”之间的不确定性，同时避免用上下文推断替代原文所说的对象。
lexical_decisions:
- source_word: Φυλάξατε
  choice: 要防备／要防守
  rationale: 该词为命令语气，含警醒看守、防范之意；依宾语不同分别译为自然的“防备”和“防守”。
- source_word: πορνείας
  choice: 淫乱
  rationale: 指不正当的性行为；“淫乱”简洁、庄重，并保留其道德含义。
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: 心思要保持纯洁
  rationale: 分词结构表达持续处于纯洁状态；“心思”对应 διάνοια，涵盖思想和内在意念。
- source_word: τὰς αἰσθήσεις ὑμῶν
  choice: 自己的感官
  rationale: αἰσθήσεις 指感觉、感官或感知能力；译作“感官”避免缩窄为单一的视觉。
- source_word: ἀπὸ πάσης γυναικῶν
  choice: 不受任何女人的诱惑
  rationale: 现存希腊文本的搭配在语法上不完整或异常；依上下文表达防守感官、远离由女人而来的性诱惑，同时以脚注标明原文形式。
theological_decisions:
- issue: 对女性的普遍表述及其道德指向
  choice: 不受任何女人的诱惑
  alternative: 远离所有女人／防备所有女人
  rationale: 上下文所警戒的是淫乱和感官受引诱，并非断言所有女性本身都邪恶；所选译法保留劝戒力度，同时避免把女性整体说成应受防备的对象。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体。“所以”承接上文；两个“要”呈现命令力度。末句作适度显化，并用脚注保存原文歧义。
