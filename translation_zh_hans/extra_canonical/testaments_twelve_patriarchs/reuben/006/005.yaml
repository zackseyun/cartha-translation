base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/005.yaml
  text: 'Therefore I say to you: you will envy the sons of Levi and seek to be exalted above them, but because of this you will not prevail.'
translation:
  language: zh_hans
  text: 所以我告诉你们：你们会嫉妒利未的子孙，想要被高举到他们之上；但正因如此，你们必不能得逞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλώσετε
  choice: 会嫉妒
  rationale: 此处指因利未子孙的地位而产生嫉妒，现代汉语“嫉妒”自然且准确。
- source_word: τοὺς υἱοὺς τοῦ Λευὶ
  choice: 利未的子孙
  rationale: 闪语式“某人的儿子们”在族属语境中指后裔或族人；译为“子孙”比直译“儿子们”更符合现代汉语。
- source_word: ζητήσετε ὑψωθῆναι ὑπὲρ αὐτούς
  choice: 想要被高举到他们之上
  rationale: 保留ὑψωθῆναι的被动形式及ὑπὲρ αὐτούς的比较含义，不擅自改成主动的“抬高自己”。
- source_word: οὐ ἰσχύσετε
  choice: 必不能得逞
  rationale: ἰσχύω在此表示有能力实现企图或占上风；“不能得逞”贴合上下文，并避免生硬的“不能有力量”。
theological_decisions:
- issue: 被高举的施事者未明
  choice: 保留“被高举”的被动表达
  alternative: “抬高自己”或“高过他们”
  rationale: 希腊文没有说明由谁高举，保留被动可避免加入关于权威、上帝或自我提升的解释。
- issue: 失败与嫉妒行为之间的因果关系
  choice: “但正因如此，你们必不能得逞”
  alternative: “但你们不能因此得逞”
  rationale: 依照διὰ τοῦτο的位置保留强调性的因果关系，同时不进一步界定“如此”仅指嫉妒还是连同谋求高位的整个行为。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留原文的预告/断言语气和被动结构。经文无脚注，因此正文不设脚注标记。
