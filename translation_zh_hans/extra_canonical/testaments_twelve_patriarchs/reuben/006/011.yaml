base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/011.yaml
  text: For he will bless Israel and Judah, because in him the Lord chose to reign before all the people.
translation:
  language: zh_hans
  text: 因为他必赐福给以色列和犹大；因为主拣选要在他里面、在全体百姓面前作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογήσει
  choice: 要赐福给
  rationale: 保留将来时语义，并以现代汉语中自然、庄重的表达传达“祝福”。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 按原文保留介词短语及其可能的代表性、联合性或工具性含义，不擅自改译为“借着他”或“在他身上”。
- source_word: ἐξελέξατο
  choice: 已拣选
  rationale: 以完成性表达对应希腊语不定过去时，并保留经文语体中的“拣选”。
- source_word: βασιλεύειν
  choice: 作王
  rationale: 自然表达不定式“为王、掌权”，同时保留主语与施事关系在句法上的张力。
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: 在全体百姓面前
  rationale: 贴近原文空间—公开性表达，避免增添“统治”等原文未明说的宾语关系。
theological_decisions:
- issue: “在他里面”所指及其与“作王”的关系
  choice: 保留“主已拣选在他里面……作王”的原文结构
  alternative: 主已拣选借着他在全体百姓面前掌权
  rationale: ἐν αὐτῷ 可有多种理解；直译能保存其真实歧义，不把该人物预先界定为单纯的代理者。
- issue: “作王”的逻辑主语
  choice: 依希腊语表层句法，以“主”为“拣选”和“作王”的主语
  alternative: 主拣选了他，使他在全体百姓面前作王
  rationale: 后者需要补出“使他”，并改变不定式的主语关系；原文更直接地说主选择作王，但表述本身具有神学张力，应予保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“全体百姓”对应单数集合名词 τοῦ λαοῦ；分号呈现前后因果解释关系，同时避免中文长句含混。
