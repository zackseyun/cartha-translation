source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/012.yaml
  text: And bow down to his offspring, because for your sake it will die in visible and invisible wars, and among you there will be an eternal king.
translation:
  language: zh_hans
  text: 你们要向他的后裔下拜，因为他要为你们的缘故，在可见和不可见的争战中死去；在你们中间将有一位永远的王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκυνήσατε
  choice: 下拜
  rationale: 该词表示俯伏、敬拜或表示臣服；“下拜”既保留身体动作及尊崇意味，又不预先限定其神学对象。
- source_word: τὸ σπέρμα αὐτοῦ
  choice: 他的后裔
  rationale: σπέρμα可指种子，也可集合性或个体性地指后代；“后裔”在现代汉语中自然，并保留数目上的潜在含混。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们的缘故
  rationale: 忠实表达代替、为了或因着某人的宽泛关系，不额外断定具体的赎罪机制。
- source_word: ἐν πολέμοις ὁρατοῖς καὶ ἀοράτοις
  choice: 在看得见和看不见的争战中
  rationale: “争战”比“战争”更能自然涵盖可见与不可见两个领域，同时保留复数所表达的多重冲突。
- source_word: βασιλεὺς αἰώνιος
  choice: 永远的王
  rationale: 直接而自然地传达王权持续无尽的含义，符合庄重的现代汉语表达。
theological_decisions:
- issue: σπέρμα的单复数与所指
  choice: 用“后裔”，并在后续代词中按希腊文中性单数语法以“他”呈现可能的个体指向
  alternative: “后代……他们”或“子孙……他”
  rationale: σπέρμα本身可以是集合名词，但ἀποθανεῖται为第三人称单数；译文不把其明确限定为纯集合群体，也不增添具体身份。
- issue: προσκυνέω是否明确表示宗教敬拜
  choice: 译为“下拜”
  alternative: “敬拜”或“俯伏在……面前”
  rationale: 原词可指敬拜，也可指向王者或尊长俯伏致敬；“下拜”保留这一神学张力。
- issue: 死亡主体与永恒君王是否同一
  choice: 两句均以“他”衔接，但不加入“就是”或身份解释
  alternative: 明确译成“这位后裔……并要成为永远的王”
  rationale: 希腊文后半句只说“将有一位永远的王”，句法并未明说该王与前述后裔完全同一；译文保持连贯，同时避免添加同一性断言。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“下拜”“后裔”“争战”“永远的王”兼顾原文形式与普通读者的可理解性；不加入原文未明示的弥赛亚身份或赎罪解释。
