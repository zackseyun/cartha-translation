base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/004.yaml
  text: For sexual immorality has within itself neither understanding nor godliness, and every jealousy dwells in its desire.
translation:
  language: zh_hans
  text: 因为淫乱本身既无悟性，也无敬虔；一切嫉妒[a]都住在它的欲望里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”所译的希腊词也可指热忱、争竞或忌恨；此处依上下文取负面含义。
    reason: 保留ζῆλος的真实词义范围，并说明正文选择的语境依据。
lexical_decisions:
- source_word: πορνεία
  choice: 淫乱
  rationale: 指不合正道的性行为；“淫乱”在现代汉语中简洁、庄重，也保留原词的伦理含义。
- source_word: σύνεσιν
  choice: 明智
  rationale: 原词可指理解、洞察或辨识力；此处“明智”自然地表达淫乱缺乏正确判断的意思。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 直接表达对神的虔敬及由此而有的敬虔品格，不扩写为单一层面的“敬畏神”。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 此处处于负面的欲望语境，“嫉妒”最符合上下文；同时以脚注保留该词也可表示争竞性热忱的语义范围。
- source_word: κατοικεῖ
  choice: 居于
  rationale: 保留原文“居住”的拟人化意象，同时比生硬的“居住在”更符合中文书面表达。
- source_word: ἐπιθυμίᾳ αὐτῆς
  choice: 它的欲望之中
  rationale: 保留属格关系及原文略显浓缩的表达，不擅自判定是淫乱自身的欲念，还是人对淫乱的欲求。
theological_decisions:
- issue: εὐσέβεια所指的敬虔内涵
  choice: 敬虔
  alternative: 对神的敬畏
  rationale: “敬虔”既可涵盖对神的虔敬，也可包含相应的生活品格，较完整地保留原词范围，避免把含义缩窄为敬畏。
- issue: ζῆλος的正负面语义
  choice: 正文译为“嫉妒”，脚注保留“争竞的热忱”这一可能
  alternative: 热心／争竞
  rationale: 句中淫乱与欲望构成明显负面语境，因此正文采用“嫉妒”；但原词本身语义较宽，不应完全抹去其歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“既无……也无……”对应原文并列结构；分号保留两分句之间紧密而有张力的关系。“居于……之中”刻意保留原文的居住隐喻及其浓缩表达。
