id: T12P.REU.6.3
reference: Testament of Reuben 6:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Αἱ γὰρ συνεχεῖς συντυχίαι¹⁵, κἂν μὴ πραχθῇ¹⁶ τὸ ἀσέβημα, ὅμως αὐταῖς¹⁷ μὲν ἐστι νόσος ἀνίατος¹⁸, ἡμῖν¹⁹ δὲ * εἰς ὄλεθρον ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/003.yaml
  text: For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a destructive disgrace of Beliar and an everlasting reproach.
translation:
  language: zh_hans
  text: 因为，接连不断的相遇，即使没有做出那不敬虔的事，对她们来说仍是无可医治的疾病；对我们来说，却是彼列[a]的、导致灭亡的耻辱，也是永远的羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 彼列：希腊文音译名，犹太古代文献中常用来指邪恶势力或其首领。
    reason: 现代普通读者未必熟悉该名称；脚注提供最低限度的辨识信息，而不引入特定宗派解释。
lexical_decisions:
- source_word: συνεχεῖς συντυχίαι
  choice: 接连不断的相遇
  rationale: συνεχεῖς 表示持续、接连不断，συντυχίαι 指相遇或接触；此译法保留原文较宽泛的措辞，不擅自具体化为幽会或性行为。
- source_word: τὸ ἀσέβημα
  choice: 那不敬虔的事
  rationale: ἀσέβημα 是不敬虔、邪恶的行为；加“那”承接上下文所指，却不把行为性质缩窄为某一种具体罪行。
- source_word: νόσος ἀνίατος
  choice: 无可医治的疾病
  rationale: 直译其疾病隐喻，并准确表达 ἀνίατος 的不可治愈之意。
- source_word: εἰς ὄλεθρον
  choice: 使人走向灭亡
  rationale: 保留 εἰς 所表达的趋向或结果，以及 ὄλεθρος 的毁灭、灭亡含义；比单纯的“毁灭性的”更清楚地呈现原文结构。
- source_word: ὄνειδος αἰώνιον
  choice: 永远的羞辱
  rationale: ὄνειδος 可指耻辱、羞耻或责难；“永远的羞辱”自然庄重，并保留 αἰώνιον 的持续性。
theological_decisions:
- issue: Βελίαρ 与“耻辱／灭亡”的句法关系
  choice: 属于彼列、使人走向灭亡的耻辱
  alternative: 彼列所带来的毁灭性耻辱
  rationale: Βελίαρ 为不变格名称，原句关系略显压缩。“属于彼列”尽量贴近英语审校层所取的属格关系，“使人走向灭亡”则单独呈现 εἰς ὄλεθρον，避免把彼列明确解释成主动施事者。
- issue: αὐταῖς 与 ἡμῖν 的所指
  choice: 她们／我们
  alternative: 她们／我们这些男人
  rationale: 原文明确使用阴性复数 αὐταῖς，却只以第一人称复数 ἡμῖν 指说话者一方；译文保留这种不对称，不额外补出“男人”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“接连不断的相遇”保留原文含蓄和范围，不按上下文推断改写成更具体的男女私会；分号清楚呈现“对她们／对我们”的平行对照。
