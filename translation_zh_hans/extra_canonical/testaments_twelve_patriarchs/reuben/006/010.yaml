  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/010.yaml
  text: And draw near to Levi in humility of your heart, so that you may receive a blessing from his mouth.
translation:
  language: zh_hans
  text: 你们要怀着谦卑的心亲近利未，以便从他口中领受祝福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσατε
  choice: 亲近
  rationale: 准确表达主动靠近、接近某人的命令语气；在此人际和宗教语境中，“亲近”比单纯“走近”更自然。
- source_word: ἐν ταπεινώσει καρδίας ὑμῶν
  choice: 存谦卑的心
  rationale: 保留“谦卑”与“你们的心”两项含义，同时采用现代汉语自然的方式表达内在态度。
- source_word: δέξησθε εὐλογίαν
  choice: 领受祝福
  rationale: “领受”体现δέχομαι所含的接受之意，也符合庄重而通俗的经文语体。
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: 从他口中
  rationale: 保留希腊文具体的“从他的口”意象，不改释为较抽象的“由他”。
theological_decisions:
- issue: 祝福与利未之口的关系
  choice: 从他口中领受祝福
  alternative: 领受他的祝福
  rationale: 原文只说祝福“从他口中”而来，未明确将利未定为祝福的最终源头；直译可保存这一潜在区分。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“你们”明确反映复数受众；以“好”表达ἵνα的目的或结果关系。原文中的“你们的心”为单数集合表达，译作“存谦卑的心”在汉语中自然且不损失其内在态度之义。
