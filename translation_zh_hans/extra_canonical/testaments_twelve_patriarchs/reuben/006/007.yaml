  text: For to Levi God gave the priesthood, and to Judah with him the kingdom.
translation:
  language: zh_hans
  text: 因为上帝把祭司职分赐给了利未，又把王权赐给了与他同在的犹大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现提供的希腊文残缺且明显讹乱，本句主要依据经审校的英文咨询文本译出；“与他同在”的确切关系在现存材料中不能进一步确定。
    reason: 向读者说明原文证据受损，并保留关系短语的真实不确定性。
lexical_decisions:
- source_word: Λευ[ί]（据残存文本及校勘层重建）
  choice: 利未
  rationale: 采用该人名在现代中文圣经传统中的通行译法。
- source_word: priesthood（希腊文据当前所给材料无法完整辨认）
  choice: 祭司职分
  rationale: 依照经审校的英文咨询层表达职分本身，而非泛指祭司群体。
- source_word: kingdom（希腊文据当前所给材料无法完整辨认）
  choice: 王权
  rationale: 此处与“祭司职分”并列，重点更可能是受赐的统治权柄，而不是疆域意义上的“王国”。
- source_word: with him
  choice: 与他同在的
  rationale: 保留英文咨询层所反映的关系表达，不擅自解释为共同执政、从属关系或单纯并列。
theological_decisions:
- issue: 利未与犹大所得权柄的关系
  choice: 分别表述为祭司职分与王权，并保留“与他同在”
  alternative: 译成利未和犹大共同拥有祭司权与王权
  rationale: 避免把两种职分合并，也不额外建立二者之间的等级或共同执政关系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“祭司职分”与“王权”形成清楚对举；因希腊文材料残损，以脚注明确文本依据的限制。
