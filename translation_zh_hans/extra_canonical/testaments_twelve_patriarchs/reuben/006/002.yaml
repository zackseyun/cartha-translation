  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/002.yaml
  text: And command those women likewise not to associate with men, so that they too may be pure in mind.
translation:
  language: zh_hans
  text: 也要吩咐那些女子不要与男子交往，使她们的心思也得以纯洁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκείνας
  choice: 也要……那些女子
  rationale: κἀκεῖνας由καί与ἐκείνας构成，兼顾“也”和远指代词“那些”；其阴性复数宾格所指由语境补足为女子。
- source_word: ἐντέλλεσθε
  choice: 吩咐
  rationale: 保留该动词命令、嘱咐的语气；中文以“要吩咐”自然表达希腊文现在时命令式。
- source_word: μὴ συνδιάζειν τοῖς ἀνδράσιν
  choice: 不可与男子交往
  rationale: συνδιάζειν表示与人相伴、交往；原文并未明说交往的亲密程度，因此不增添“亲密”等限定。
- source_word: καθαρεύωσι τῇ διανοίᾳ
  choice: 心思也保持纯洁
  rationale: καθαρεύωσι表达处于或保持纯洁的状态，τῇ διανοίᾳ限定在思想、心智层面；“心思”比单说“心”更准确地对应διάνοια。
theological_decisions:
- issue: 纯洁所涉及的范围
  choice: 心思……保持纯洁
  alternative: 内心纯洁／思想纯洁
  rationale: 原文以τῇ διανοίᾳ明确指向心智和思想领域，不将其扩展为笼统的道德或礼仪洁净，也不额外赋予宗派性含义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“不可与男子交往”保留原文较宽泛的表述，不擅自解释为完全隔绝、亲密来往或性关系。
