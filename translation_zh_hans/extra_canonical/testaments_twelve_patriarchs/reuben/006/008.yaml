  text: until the completion of the times [of the high priest Messiah, of whom the Lord spoke].
translation:
  language: zh_hans
  text: 直到诸时期的完成[a]，[即主所说的那位受膏的大祭司的时期][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诸时期的完成”也可译作“诸时期的终结”或“诸时期圆满之时”。
    reason: τελειώσεως可指完成、达成圆满或终结；χρόνων为复数。
  - marker: b
    text: 方括号沿用所据希腊文本，表示这段话的文本地位存疑。“受膏的”也可按称号译作“弥赛亚”或“基督”，即“主所说的那位大祭司、弥赛亚（或基督）的时期”。
    reason: 说明方括号的文本批判标示，并保留χριστοῦ作为描述语或称号的歧义。
lexical_decisions:
- source_word: ἕως τελειώσεως χρόνων
  choice: 直到各时期圆满之时
  rationale: ἕως表示“直到”，τελείωσις表示完成、圆满或终结，χρόνων为复数；译文保留复数含义，并用“圆满之时”形成自然而庄重的现代汉语。
- source_word: ἀρχιερέως χριστοῦ
  choice: 大祭司弥赛亚
  rationale: ἀρχιερεύς意为“大祭司”；χριστός既可表示“受膏者”，也可作为“弥赛亚”的称号。正文采用在此末世性语境中自然的“大祭司弥赛亚”，并在脚注说明另一种可能译法。
- source_word: ὃν εἶπε Κύριος
  choice: 主所说的那位
  rationale: 关系代词ὃν指向阳性单数人物；此处将εἶπε按“说到、提及”理解，以自然汉语译为“所说的那位”，不补出原文没有明说的预言内容。
theological_decisions:
- issue: χριστοῦ是称号“弥赛亚”还是描述语“受膏的”
  choice: 正文译作“大祭司弥赛亚”
  alternative: “受膏的大祭司”
  rationale: 两种理解在希腊语上均有可能。正文选用“弥赛亚”以体现该词可能具有的专称意味，但以脚注保留描述性理解，避免把歧义静默消除。
- issue: 方括号内短语的文本地位
  choice: 在正文中保留方括号
  alternative: 不加方括号纳入正文，或完全删去
  rationale: 所给希腊文本明确以方括号标示该短语；译文照样保留，以免掩盖版本对其文本地位的保留态度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“各时期”保留原文复数，“圆满之时”避免生硬直译；方括号与脚注标记均在正文中明确呈现。
