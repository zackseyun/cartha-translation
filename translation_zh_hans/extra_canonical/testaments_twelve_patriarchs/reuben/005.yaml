  text: 1[a]. For women are evil, my children; and because they do not have authority or power over a man, they scheme by their appearance how they may draw him to themselves. 2. And the one whom they are not able to enchant by appearance, him they overcome through deceit. 3[b]. For an angel of God also told me concerning them and taught me that women are overcome by the spirit of sexual immorality more than a man, and in their heart they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive. 4. For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him. 5. Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and their faces for the deception of the mind; for every woman who uses deceit in these things is reserved for eternal punishment. 6. For in this way they also
    charmed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were changing themselves into the form of men and appearing to them while they were with their husbands. 7. And they also, desiring in their minds their appearance, gave birth to giants[d][c]. For the Watchers appeared to them as reaching up to heaven.
translation:
  language: zh_hans
  text: '《吕便遗训》第5章


    1 孩子们，女人是邪恶的；她们因为没有权柄或能力支配男人，就设法用自己的外表[a]把男人吸引到自己这里来。2 若不能用外表迷惑一个男人，她们就借着欺骗制伏他。


    3 因为上帝的一位天使也曾对我谈到她们，并教导我说：女人受淫乱之灵制伏比男人更甚；她们心里图谋对付男人，又借着装饰使他们的心思迷乱，以眼神把毒素播下；她们先在意念上，继而以行动将他们掳获。4 女人不能当面强迫男人，却会以淫荡的姿态施展诡计对付他。


    5 所以，孩子们，你们要逃避淫乱，也要吩咐你们的妻子和女儿，不可为了迷惑人的心思而装饰自己的头和脸；因为凡在这些事上施行欺骗的女人，都被留待永远的刑罚。


    6 洪水以前，她们也正是这样迷惑了那些“守望者”[b]。守望者不断注视她们，也就对她们生出欲望，并在心里构想那行为；他们变成男人的形态，在那些女人与丈夫同房时向她们显现。7 那些女人心里也渴慕他们的形象，便生下了巨人[c]。在她们看来，守望者高大得仿佛直达天空[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第1—2节译作“外表”的希腊词，也可指“外形”“样貌”或“外在呈现”。
    reason: lexical_alternative
  - marker: b
    text: “守望者”指洪水以前传统中的天上存在。后来的犹太释经传统常以此解释《创世记》6章，尤其见于《以诺一书》。
    reason: cross_reference
  - marker: c
    text: 第6—7节关于守望者产生欲望、变形显现以及巨人出生的叙述，反映了已经发展成形的洪水前释经传统。
    reason: cultural_note
  - marker: d
    text: 末句也可较直译为：“守望者向她们显现，仿佛一直伸展到天空。”这可能是形容其身量的夸张说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηραί
  choice: 邪恶
  rationale: 保留原文尖锐而概括性的道德判断，不擅自缓和为“有缺点”或限定为某一类女人。
- source_word: σχήμασιν / τοῦ σχήματος
  choice: 外表（第1—2节）；姿态（第4节）
  rationale: 该词可指外形、样貌或外在呈现；依各处搭配分别采用自然中文，同时以脚注保留其语义范围。
- source_word: δολιεύονται
  choice: 设法
  rationale: 在第1节表达持续而带欺骗性的谋划；后文“欺骗”已明确其负面性质，避免中文堆叠。
- source_word: ἐπισπάσωνται
  choice: 吸引到自己这里来
  rationale: 保留原词“拉向自己”的方向感，同时符合现代汉语表达。
- source_word: καταγοητεῦσασθαι
  choice: 迷惑
  rationale: 原词带蛊惑、迷住之意；“迷惑”既有较强诱惑色彩，又不引入原文未必明确的魔法行为。
- source_word: ἡττῶνται τῷ πνεύματι τῆς πορνείας
  choice: 被淫乱之灵制伏
  rationale: 保留被动的“胜过、制伏”以及“灵”的神学和人格化张力，不将其简化为心理冲动。
- source_word: πορνεία
  choice: 淫乱
  rationale: 在本段性伦理语境中简洁、庄重，并可同时涵盖不正当性行为这一较宽泛意义。
- source_word: ἐν καρδίᾳ μηχανῶνται
  choice: 心里图谋
  rationale: 保留“心”作为内在思量之所在，也传达 μηχανῶνται 的谋划意味，而不与第1节的欺诈动词完全等同。
- source_word: διὰ τῆς κοσμήσεως
  choice: 借着装饰
  rationale: 直接呈现原文所说的外在修饰手段，不扩大为一般性的美貌。
- source_word: διὰ τοῦ βλέμματος τὸν ἰὸν ἐνσπείρουσι
  choice: 以眼神把毒素撒进去
  rationale: 保留“眼神”“毒素”和“撒种”所构成的强烈比喻。
- source_word: Ἐγρήγοροι
  choice: 守望者
  rationale: 采用第二圣殿时期犹太传统中这一类天上存在的通行译名，并用引号与脚注帮助普通读者辨识。
- source_word: γίγαντας
  choice: 巨人
  rationale: 直接保留洪水前传统中的族类称谓，不将其解释为权贵或勇士。
theological_decisions:
- issue: 本章对女人作出的严厉概括
  choice: 按吕便劝诫话语的原貌直译，并保留其概括性
  alternative: 将所指限制为“淫乱的女人”或改写成性别中性的警告
  rationale: 希腊文本本身作出广泛而尖锐的判断；译文不应暗中修正古代作者的论述，也不应把叙述者的话直接等同于编者认同。
- issue: πνεῦμα τῆς πορνείας 的性质
  choice: 译作“淫乱之灵”
  alternative: 译作“淫欲冲动”或“不贞的倾向”
  rationale: 原文既可带人格化、属灵力量的意味，也可能表达支配人的恶性倾向；保留“灵”可让这种张力继续存在。
- issue: 守望者、巨人与洪水前传统
  choice: 在正文保留“守望者”和“巨人”
  alternative: 解释为普通男人、勇士或权势人物
  rationale: 这些称谓属于文本所采用的犹太释经传统，是本段叙事不可删减的神学与文化内容。
- issue: 守望者变形并在夫妻同房时显现的叙述
  choice: 按原文叙事保留，不解释其为实体交合或纯粹幻想
  alternative: 明确说守望者与女人交合，或明确说一切只发生在想象中
  rationale: 第6—7节同时使用变形、显现和心中形象等表达，其作用方式并不完全清楚；译文保留这种含混。
- issue: 第7节末守望者“直达天空”
  choice: 译成女人眼中的夸张身量描写
  alternative: 按字面理解为守望者实际延伸至天上
  rationale: 原句可表达视觉印象或夸张，但没有要求将其彻底非字面化，因此以“仿佛”保留修辞可能。
translation_notes:
  register: 采用现代、庄重而清楚的劝诫体。保留原文令人不适的性别概括和强烈道德措辞，不以现代立场暗中改写；同时避免古奥词语。第6—7节刻意维持代词关系和事件机制的部分含混，只在中文为可读性所必需之处明确“守望者”“那些女人”。
