- from: '《吕便遗训》第5章


    1 孩子们，女人是邪恶的；她们因为没有权柄或能力支配男人，就设法用自己的外表[a]把男人吸引到自己这里来。2 若不能用外表迷惑一个男人，她们就借着欺骗制伏他。


    3 因为上帝的一位天使也曾对我谈到她们，并教导我说：女人比男人更容易被淫乱之灵制伏；她们心里图谋对付男人，又借着装饰使他们的心思迷乱，以眼神把毒素撒进去；她们先在意念上，继而以行动将他们掳获。4 女人不能当面强迫男人，却会以淫荡的姿态施展诡计对付他。


    5 所以，孩子们，你们要逃避淫乱，也要吩咐你们的妻子和女儿，不可为了迷惑人的心思而装饰自己的头和脸；因为凡在这些事上施行欺骗的女人，都被留待永远的刑罚。


    6 洪水以前，她们也正是这样迷惑了那些“守望者”[b]。守望者不断注视她们，也就对她们生出欲望，并在心里构想那行为；他们变成男人的形态，在那些女人与丈夫同房时向她们显现。7 那些女人心里也渴慕他们显现的形象，便生下了巨人[c]。在她们看来，守望者高大得仿佛直达天空[d]。'
  to: '《吕便遗训》第5章


    1 孩子们，女人是邪恶的；她们因为没有权柄或能力支配男人，就设法用自己的外表[a]把男人吸引到自己这里来。2 若不能用外表迷惑一个男人，她们就借着欺骗制伏他。


    3 因为上帝的一位天使也曾对我谈到她们，并教导我说：女人受淫乱之灵制伏比男人更甚；她们心里图谋对付男人，又借着装饰使他们的心思迷乱，以眼神把毒素播下；她们先在意念上，继而以行动将他们掳获。4 女人不能当面强迫男人，却会以淫荡的姿态施展诡计对付他。


    5 所以，孩子们，你们要逃避淫乱，也要吩咐你们的妻子和女儿，不可为了迷惑人的心思而装饰自己的头和脸；因为凡在这些事上施行欺骗的女人，都被留待永远的刑罚。


    6 洪水以前，她们也正是这样迷惑了那些“守望者”[b]。守望者不断注视她们，也就对她们生出欲望，并在心里构想那行为；他们变成男人的形态，在那些女人与丈夫同房时向她们显现。7 那些女人心里也渴慕他们的形象，便生下了巨人[c]。在她们看来，守望者高大得仿佛直达天空[d]。'
  rationale: 只作三处安全的源语校正：第3节不把比较级增译为“更容易”，并使“播下毒素”贴近 ἐνσπείρουσι；第7节将“他们显现的形象”改为“他们的形象”，以忠实保留 φαντασία αὐτῶν 的指向及叙事含混。保留所有经文编号、脚注锚点和既有脚注内容。
