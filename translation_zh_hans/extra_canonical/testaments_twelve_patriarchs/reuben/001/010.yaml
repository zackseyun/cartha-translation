  text: 10. Καὶ⁶⁴ οἶνον καὶ σίκερα οὐκ ἔπιον, καὶ κρέας⁶⁵ οὐκ εἰσῆλθεν *ἐν τῷ στόματί⁶⁶ μου· καὶ πᾶν⁶⁷ ἄρτον ἐπι- θυμίας⁶⁸ οὐκ ἔφαγον⁶⁹ *ἀλλ᾽ ἤμην⁷⁰ πενθῶν ἐπὶ τῇ ἁμαρτίᾳ μου⁷¹, μεγάλη γὰρ ἦν, *οἷα οὐ γέγονεν ἐν Ἰσραὴλ οὕτως⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/010.yaml
  text: And I drank no wine or strong drink, and no meat entered my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great, such as had not happened in Israel.
translation:
  language: zh_hans
  text: 我不喝葡萄酒和烈酒，肉也不入口，也不吃任何可口的饼；我却因自己的罪而哀恸，因为这罪极其重大，在以色列中从未有过这样的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶνον καὶ σίκερα
  choice: 葡萄酒和烈酒
  rationale: 分别保留普通葡萄酒与其他高酒精或致醉饮料的区别；“烈酒”是现代汉语中简明自然的对应语。
- source_word: κρέας οὐκ εἰσῆλθεν ἐν τῷ στόματί μου
  choice: 肉也不入口
  rationale: 以自然且略具庄重感的汉语保留“进入我口”的具体意象。
- source_word: πᾶν ἄρτον ἐπιθυμίας
  choice: 凡可口的饼
  rationale: ἐπιθυμία在此修饰食物，指令人喜爱、想吃的饼；“可口的饼”比生硬的“欲望之饼”更符合现代汉语，同时不将其过度具体化为精美食物。
- source_word: πενθῶν
  choice: 哀恸
  rationale: 表达因罪而深切悲伤、守哀般的状态，语体庄重。
- source_word: οἷα οὐ γέγονεν ἐν Ἰσραὴλ οὕτως
  choice: 是以色列中从未发生过的
  rationale: 按上下文把关系表达落实到“这罪”，保留其在以色列中前所未有的强烈判断。
theological_decisions:
- issue: 禁食行为的性质
  choice: 直陈不饮酒、不吃肉和可口之饼，作为因罪哀恸的表现
  alternative: 将其解释为正式的宗教禁食或赎罪行为
  rationale: 原文只陈述行为与哀恸原因，并未明确规定其礼仪或赎罪性质，故不加入额外神学解释。
- issue: 罪的严重性及其独特性
  choice: “因为这罪极其重大，是以色列中从未发生过的”
  alternative: 弱化为“像这样的事在以色列未曾发生”
  rationale: 原文 μεγάλη 与 οἷα…οὕτως 共同强调该罪重大且前所未有；译文保留这一张力，同时不进一步界定其法律或教义类别。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“肉也不入口”保留原文形象；分号呈现克制饮食与因罪哀恸之间的转折。“饼”按古代语境泛指面饼类主食。
