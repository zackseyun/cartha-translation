  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/003.yaml
  text: And he said to them, “My children, behold, I am dying and going the way of my fathers.”
translation:
  language: zh_hans
  text: 他对他们说：“我的孩子们，看哪，我正在死去，并且要走我列祖所走的路。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲属称呼，并以现代汉语复数形式清楚表达受话者不止一人。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文提示听者注意的庄重语气；虽略带古雅色彩，但在经传体中文中清楚自然。
- source_word: ἀποθνήσκω
  choice: 我快要死了
  rationale: 希腊语现在时在此指临近的死亡；译作“快要死了”比机械地译为“正在死”更符合现代汉语。
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  choice: 要走我列祖所走的路
  rationale: 保留“走……的路”这一死亡委婉语，并用“列祖”表达已故先祖；补出“所走的”使现代汉语关系清晰。
theological_decisions:
- issue: “列祖之路”是否直接释为死亡或阴间
  choice: 保留道路隐喻
  alternative: 译作“要像我的列祖一样死去”
  rationale: 原文以“走我列祖的路”委婉指死亡，并未明确说明死后境况；保留隐喻可避免加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的经传体。保留“看哪”和“列祖”的传统表达，同时通过“快要”和“所走的”使句意符合现代标准汉语。
