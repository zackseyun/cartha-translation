  text: Then, seeing Judah and Gad and Asher there, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am passing away.”
translation:
  language: zh_hans
  text: 他看见犹大、迦得和亚设三位弟兄在那里，就对他们说：“扶我起来，好让我把藏在心里的事告诉我的弟兄和儿女；看哪，我现在就要离世了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: 看见
  rationale: 采用自然的现代汉语叙事表达，保留希腊语分词所表示的先行情境。
- source_word: ἀδελφοὺς αὐτοῦ
  choice: 三位弟兄
  rationale: 指犹大、迦得和亚设；“弟兄”符合家族语境，“三位”使同位关系在汉语中清楚自然。
- source_word: Ἀναστήσατέ με
  choice: 扶我起来
  rationale: 复数命令式是请在场众人帮助他起身；临终语境下，“扶我起来”比单纯“使我站起来”更自然。
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου κρυπτά
  choice: 藏在心里的事
  rationale: 保留“隐藏”与“心”的意象，同时采用现代汉语惯用结构。
- source_word: ἐκλείπω
  choice: 离世
  rationale: 该词本可表示衰竭、消逝或终止；在明确的临终场景中译作“离世”，自然传达死亡将近，同时不过度描写死亡方式。
- source_word: νῦν ἐγώ
  choice: 我现在就要
  rationale: “现在”保留时间紧迫感，“就要”以自然汉语表达正在临近的死亡。
theological_decisions:
- issue: ἐκλείπω在临终语境中的含义
  choice: 离世
  alternative: 衰竭／消逝
  rationale: 上下文表明吕便正在作临终训言，因此死亡义最合语境；但不扩展为涉及死后状态的神学表述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语保持临终训言的紧迫感；“看哪”保留原文提示语的修辞力度。无脚注标记。
