  text: A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.
translation:
  language: zh_hans
  text: 吕便在他生命的第一百二十五年、死前吩咐他儿子们的话的遗训抄本。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 直译为“副本、抄本”，符合文献标题的性质，不将其泛化为单纯的“记载”。
- source_word: διαθήκης
  choice: 遗训
  rationale: 在族长临终训诫这一文类中，既表达临终嘱托，也避免现代“遗嘱”主要涉及财产处分的狭义联想。
- source_word: Ῥουβήμ
  choice: 吕便
  rationale: 采用现代简体中文圣经中通行的人名译法。
- source_word: ἐνετείλατο
  choice: 嘱咐
  rationale: 体现带有权威性的临终吩咐，同时比“命令”更适合父亲对众子的语境。
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: 在离世之前
  rationale: 自然表达“在他死以前”；“离世”保持庄重而不改变含义。
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: 于他一生的第一百二十五年
  rationale: 贴近希腊语按生命年数计时的表达；比直接说“一百二十五岁时”更忠实于原句形式。
