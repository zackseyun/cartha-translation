base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/007.yaml
  text: And I tell you that he struck me with a severe blow on my loins for seven months; and if my father Jacob had not prayed to the Lord for me, the Lord would have destroyed me.
translation:
  language: zh_hans
  text: 我告诉你们，他重重击打我的腰部，使我受苦七个月；要不是我父亲雅各为我向主祷告，主就会除灭我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπληξέ με πληγῇ μεγάλῃ
  choice: 他重重击打我
  rationale: 保留同源词所表达的强烈击打之意，同时避免汉语中生硬的“以大击打击打我”。
- source_word: ἐπὶ τῆς λαγόνος μου
  choice: 我的腰部
  rationale: λαγών可指腰侧、胁腹或腰部；“腰部”自然易懂，并保留部位上的一定宽泛性。
- source_word: ἕως μῆνας ἑπτά
  choice: 使我受苦七个月
  rationale: 原文直译近于“直到七个月”，语境表示击打造成的痛苦持续七个月；补出“受苦”使现代汉语通顺，而不把它误解为连续击打七个月。
- source_word: ἀνελεῖν με
  choice: 除灭我
  rationale: ἀναιρέω在此表示取去性命、杀灭；“除灭”庄重且符合宗教叙事语体。
theological_decisions:
- issue: 击打者的身份
  choice: 沿用男性第三人称“他”，不在本节明说身份
  alternative: 明确译作“主重重击打我”
  rationale: 本节动词主语承接上文，但所给希腊文本本节没有明示；保留代词可避免仅凭本节补入解释。
- issue: ἤθελε Κύριος ἀνελεῖν με的情态
  choice: 主就会除灭我
  alternative: 主本想除灭我／主就愿意除灭我
  rationale: 在未实现条件句中，ἤθελε加不定式可惯用地表达本来会发生的结果；译成“就会”比“愿意”更自然，也避免不必要地强调神的意愿状态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“为我向主祷告”保持希腊语περὶ ἐμοῦ πρὸς Κύριον的关系清楚；全节不添加原文没有的称谓或神学解释。
