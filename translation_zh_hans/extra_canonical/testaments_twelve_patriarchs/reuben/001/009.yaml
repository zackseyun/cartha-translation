  text: And after this, with the resolve of my soul, I repented before the Lord for seven years.
translation:
  language: zh_hans
  text: 此后，我从心里下定决心，在主面前悔改了七年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: 此后
  rationale: 自然、简洁地表达时间上的先后关系。
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: 我从心里立定志向
  rationale: προαίρεσις 表示有意识的选择、决意或定志；ψυχή 在此强调人的内在生命。译文兼顾决心与内心层面，避免生硬直译。
- source_word: ἑπτὰ ἔτη
  choice: 七年
  rationale: 保留原文明确的持续时间。
- source_word: μετενόησα
  choice: 悔改了
  rationale: 表达 μετανοέω 所指的心意转变与悔改行动，并与持续七年的时间说明自然衔接。
- source_word: ἐνώπιον Κυρίου
  choice: 在主面前
  rationale: 贴近原文空间性隐喻，同时保留其宗教意义，即悔改是在主的鉴察与临在之中。
theological_decisions:
- issue: 悔改持续七年的表述
  choice: 在主面前悔改了七年
  alternative: 在主面前用了七年悔改
  rationale: 原文将“七年”与“悔改”直接相连，可指持续七年的悔改生活；采用较中性的表达，不额外断定其为一次行为还是长期操练。
- issue: προαίρεσις 的意志色彩
  choice: 从心里立定志向
  alternative: 凭着我灵魂的选择
  rationale: 原文强调主体有意识的决意。译文保留人的主动定志，但不引申为有关自由意志的特定教义立场。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从心里立定志向”比“以我灵魂的决意”更自然，同时保留原文内在决断的力度。
