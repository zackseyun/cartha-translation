  text: Two years after the death of Joseph his brother, when Reuben had fallen sick, his sons and the sons of his sons gathered to visit him.
translation:
  language: zh_hans
  text: 他的兄弟约瑟去世两年后，吕便病了；他的儿子和孙子聚集起来探望他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ἔτη δύο τῆς τελευτῆς Ἰωσὴφ τοῦ ἀδελφοῦ αὐτοῦ
  choice: 他弟弟约瑟去世两年后
  rationale: 按希腊语属格结构表达时间关系；“弟弟”自然传达约瑟是吕便的兄弟，结合叙事人物关系明确其年幼于吕便。
- source_word: ἀρρωστήσαντος Ῥουβήμ
  choice: 吕便病倒了
  rationale: 用自然现代汉语表达不定过去分词所指的患病事件，并保留其作为后续探望的背景。
- source_word: συνήχθησαν ἐπισκέψασθαι αὐτόν
  choice: 都聚集起来探望他
  rationale: 保留“聚集”与表目的的不定式“探望”，并以“起来”使汉语叙述流畅。
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  choice: 他的儿子和孙子
  rationale: “他”指吕便；“他儿子们的儿子们”在现代汉语中自然简化为“孙子”，不改变亲属层级。
