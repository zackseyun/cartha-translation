  text: And rising up, he kissed them and said to them, “Hear, my brothers and my sons; listen to Reuben your father in what I command you.”
translation:
  language: zh_hans
  text: 他站起身来，亲吻他们，对他们说：“我的弟兄们和儿子们，请听你们父亲吕便的话，留心我所吩咐你们的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάς
  choice: 站起身来
  rationale: 以自然的现代汉语表达起身的动作，同时保留分词与后续动作的先后关系。
- source_word: κατεφίλησεν
  choice: 亲吻
  rationale: 该动词可表示深情或反复亲吻；上下文未要求突出次数，译作“亲吻”既准确又自然。
- source_word: Ἀκούσατε
  choice: 请听……的话，听从
  rationale: 希腊语既有聆听也有听从、留意之意；结合后面的“吩咐”，用两个相连的表达传达其完整语力。
- source_word: ἀδελφοί μου καὶ υἱοί μου
  choice: 我的弟兄和儿子们
  rationale: 按原文保留两种称呼，不把其中的关系合并或解释掉。
- source_word: ἐντέλλομαι
  choice: 吩咐
  rationale: 准确传达带权威的指示或命令，且符合父亲临终训诫的庄重语境。
