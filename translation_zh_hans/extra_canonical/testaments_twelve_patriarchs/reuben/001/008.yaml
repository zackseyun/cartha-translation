  text: 8. Ἤμην γὰρ⁵⁸ ἐτῶν τριάκοντα ὅτε ἔπραξα τὸ πονηρὸν ἐνώπιον Κυρίου⁵⁹. καὶ ἐμαλακίσθην *μῆνας ἑπτὰ⁶⁰ ἕως θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/008.yaml
  text: For I was thirty years old when I did evil before the Lord, and for seven months I was weakened to the point of death.
translation:
  language: zh_hans
  text: 因为我三十岁时，在主面前行了恶；我衰弱了七个月，濒临死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπραξα τὸ πονηρόν
  choice: 行了恶
  rationale: 保留“实施恶事”的动作含义，同时用现代汉语自然表达，不把名词化的中性形容词生硬译成“那件恶事”。
- source_word: ἐνώπιον Κυρίου
  choice: 在主面前
  rationale: 贴近原文空间性表达，也保留行为处于主鉴察之下的含义。
- source_word: ἐμαλακίσθην
  choice: 我衰弱了
  rationale: 此处为身体变得虚弱、病弱之意；“衰弱”较准确且自然。
- source_word: ἕως θανάτου
  choice: 几乎死去
  rationale: 按语境表达病弱达到濒死程度；避免误译成实际死亡。
theological_decisions:
- issue: τὸ πονηρόν是否特指前文的罪行
  choice: 译作“恶”
  alternative: “那件恶事”
  rationale: 希腊语虽有冠词，但名词化形容词可泛指“恶”；此处不必在汉语中强行加入指示性，以免过度限定。
- issue: ἐνώπιον Κυρίου的含义
  choice: 保留“在主面前”
  alternative: “得罪了主”
  rationale: 原文直接描述在主面前行恶，并未使用“得罪”的动词；直译可保留其审判与鉴察意味而不替原文作解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“此后”补明两个分句间自然的时间承接，不增加实质信息；整句避免古奥措辞。
