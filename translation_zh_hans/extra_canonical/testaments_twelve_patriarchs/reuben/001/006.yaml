revisions:
- from: 看哪，今天我请天上的上帝作证，告诫你们不可行在少年人的无知和淫乱中；我自己曾陷入其中，玷污了我父亲雅各的床。
  to: 看哪，今天我请天上的上帝向你们作证：你们不可在年少时的无知和淫乱中行事；我曾沉溺于这淫乱中，玷污了我父亲雅各的床。
  rationale: 修订以冒号引出原文ὅπως μή所表达的严肃警戒内容，不将其另译为并列的“告诫”。将关系从句明确指向“淫乱”，并以“沉溺”自然表达ἐξεχύθην在此处被卷入、放纵于淫乱的语境意义；其余关键意象和措辞均予保留。
