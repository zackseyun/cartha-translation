  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/006.yaml
  text: And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was swept away and defiled the bed of my father Jacob.
translation:
  language: zh_hans
  text: 看哪，今天我请天上的上帝向你们作证：你们不可在年少时的无知和淫乱中行事；我曾沉溺于这淫乱中，玷污了我父亲雅各的床。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμαρτύρομαι ὑμῖν τὸν Θεὸν τοῦ οὐρανοῦ
  choice: 我请天上的上帝作证，告诫你们
  rationale: 保留“请上帝作证”的司法性语气，并以“告诫你们”表达中间语态动词在此处对受话者提出严肃警戒的作用；避免把 ὑμῖν 过度明确为“控告你们”。
- source_word: πορευθῆτε
  choice: 行在……中
  rationale: 保留“行走”作为生活方式的常见伦理隐喻，现代汉语读者亦可理解。
- source_word: ἀγνοίᾳ νεότητος
  choice: 少年人的无知
  rationale: 贴近属格结构，保留其可指少年时期特有的无知或因年少而有的蒙昧这一含混性。
- source_word: πορνείᾳ
  choice: 淫乱
  rationale: 采用庄重且通行的伦理用语，表达广义的性方面不道德行为。
- source_word: ἐξεχύθην
  choice: 陷入
  rationale: 该词字面涉及“倾泻、流出”，在此描述说话人沉溺或放纵于淫乱；“陷入”自然传达被卷入并沉溺其中的语境意义，不过度拘守不自然的字面表达。
- source_word: ἐμίανα κοίτην τοῦ πατρός μου Ἰακώβ
  choice: 玷污了我父亲雅各的床
  rationale: 保留“玷污”和“床”的具体意象及其道德重量，不将其解释性扩写为某一具体事件。
theological_decisions:
- issue: 上帝作证的语气指向
  choice: 作证，告诫你们
  alternative: 作证控告你们
  rationale: 希腊文可带严肃见证乃至警告色彩，但经文本句目的在劝戒后辈不要重蹈覆辙；正文不将其单向定为司法控告。
- issue: ἐξεχύθην 所表达的能动性
  choice: 曾陷入其中
  alternative: 曾在其中放纵自己／被冲昏了头
  rationale: 选择既不完全抹去个人责任，也不额外断言纯粹被动受制的表达，保留原文在倾泻、放纵与被卷入之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事劝诫语体。“看哪”保留原文提示语的郑重感；整体句式兼顾希腊文结构与自然普通话。无脚注标记。
