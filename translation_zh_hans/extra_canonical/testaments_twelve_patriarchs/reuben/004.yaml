lexical_decisions:
- source_word: προσέχετε
  choice: 留意
  rationale: 表达把注意力放在某事物上的意思，适合此处对诱惑性美貌的警戒，且比“关注”更庄重自然。
- source_word: ἐννοεῖσθε
  choice: 反复想着
  rationale: 不仅指一般思考，也含心里盘桓、专注于此的意味；此译体现内在意念上的警戒。
- source_word: ἁπλότητι καρδίας
  choice: 存纯一的心
  rationale: “纯一”兼顾单纯、专一和不分心的含义，比只译“诚实”更能保留原语的道德张力。
- source_word: φόβῳ κυρίου
  choice: 敬畏主
  rationale: 沿用清楚可辨的圣经式道德用语，不将“敬畏”弱化为一般尊敬。
- source_word: γράμμασι
  choice: 努力学习
  rationale: 字面为“文字、书写之事”，在此生活训诲中很可能指读写或学问；“学习”在现代汉语中自然，并保留一定范围。
- source_word: σύζυγον
  choice: 妻子
  rationale: 对儿子们的劝诫以婚配为背景，“妻子”比泛称“配偶”更切合语境。
- source_word: παρρησίαν
  choice: 勇气
  rationale: 原词可指坦然、放胆或自由开口；结合“正眼看父亲的脸”，译作“勇气”自然地表达因羞愧而不敢面对。
- source_word: πορνεία
  choice: 淫乱
  rationale: 这是现代中文中简明且具尊严的广义性道德用语，不把所指过度限定为某一种行为。
- source_word: βόθρος
  choice: 深坑
  rationale: 保留具体而强烈的危险隐喻；“深坑”较“沟渠”更符合此处灵魂陷落的语境。
- source_word: ᾅδην
  choice: 阴间
  rationale: 保留希腊语所指的死者境域，不径直译成带有更强终极刑罚含义的“地狱”。
- source_word: φάρμακα
  choice: 药剂
  rationale: 该词可指药物、药剂或魔法配制物；上下文提到术士，故在注释中说明其可能有“魔药”之意。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用音译以保留本书邪恶势力称名的特点，不直接等同为某一更熟悉但未必完全同义的称号。
theological_decisions:
- issue: 淫乱与偶像的关系
  choice: 使人离开上帝，亲近偶像
  alternative: 使人陷入偶像崇拜
  rationale: 原文表达的是远离上帝、靠近偶像的空间性和关系性变化，并未明确说成完整的偶像崇拜行为，因此保留其措辞张力。
- issue: ᾅδης的译法
  choice: 阴间
  alternative: 地狱；坟墓；冥府
  rationale: “阴间”较能表达第二圣殿时期文本中的死者境域，同时避免把原文预先解释为终极刑罚之地。
- issue: πρόσκομμα τῷ Βελίαρ这一难句
  choice: 成为彼列的绊脚石
  alternative: 因彼列而跌倒；在彼列面前成为冒犯
  rationale: 原句语义和关系不清。正文贴近其字面结构，并用脚注公开说明困难，避免以某种神学解释消除歧义。
- issue: 嫉妒之灵
  choice: 嫉妒之灵就离开了我
  alternative: 嫉妒的情绪消失了
  rationale: 保留文本对“灵”的人格化或灵界表达，不把它心理化；同时不进一步断定其本体性质。
- issue: 第10节末尾的救援对象
  choice: 脱离一切隐伏的邪恶和死亡
  alternative: 脱离一切邪恶、隐伏的死亡
  rationale: 希腊语词语组合紧密且可有不同切分。正文采用较通顺的并列理解，并以脚注保留另一种可能。
translation_notes:
  register: 采用现代标准普通话和简体中文，整体庄重而可朗读。劝诫语气直接，但避免古奥文言；“敬畏主”“蒙恩”“阴间”等保留可识别的圣经语域。原始希腊材料在第2—4节及第9节有明显缺损或压缩，正文依现存语义谨慎连贯，脚注公开说明；对“彼列的绊脚石”和第10节末尾不作过度释义。
