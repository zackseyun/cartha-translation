  source_fidelity: 原文“καὶ ἕως νῦν”含有“并且／而且”及“直到如今”的意思；草稿遗漏了“καὶ”。“περὶ τῆς ἁμαρτίας μου”直指“关于／为着我的罪”，不宜译为“罪责”，因为后者将罪行扩展为其法律或心理后果。τύπτει保留“击打”的强烈形象是可取的。
