  text: And even now my conscience strikes me concerning my sin.
translation:
  language: zh_hans
  text: 而且直到如今，我的良心仍为了我的罪击打我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως νῦν
  choice: 直到如今
  rationale: 保留时间延续的意味，表明良心的责打从先前一直持续到现在。
- source_word: ἡ συνείδησίς μου
  choice: 我的良心
  rationale: 直接对应原文，采用现代汉语中自然且明确的伦理用语。
- source_word: τύπτει με
  choice: 打击我
  rationale: 保留 τύπτω 的具体动作意象“击打”，不弱化为单纯的“责备”，也不强化为原文未明说的“折磨”。
- source_word: περὶ τῆς ἁμαρτίας μου
  choice: 因我的罪责
  rationale: περί 在此说明良心责打所涉及的缘由；“罪责”既指所犯的罪，也自然表达该罪带来的内在负疚，同时不额外规定具体罪行。
theological_decisions:
- issue: 良心作用的强度与性质
  choice: 仍因我的罪责打击我
  alternative: 仍为我的罪责备我／仍因我的罪折磨我
  rationale: “打击”紧贴 τύπτει 的强烈比喻，同时避免“责备”过度弱化或“折磨”过度强化其含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“直到如今……仍……”自然呈现持续状态；整体尽量保留希腊文简洁、强烈的自责语气。
