  text: Διὰ τοῦτο⁴⁵ *τέκνα μου⁴⁶, *Γλέγω ὑμῖν⁴⁷, φυλάξατε⁴⁸ Γπάντα⁴⁹ ὅσα ἐντέλλομαι⁵⁰ ὑμῖν, καὶ οὐ μὴ ἁμάρτητε⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/005.yaml
  text: Therefore, my children, I tell you, keep all that I command you, and you will certainly not sin.
translation:
  language: zh_hans
  text: 所以，我的孩子们，我告诉你们：要谨守我吩咐你们的一切，你们就绝不会犯罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 所以
  rationale: 承接上文并引出由此得出的劝诫，现代汉语中自然明晰。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留父亲对众子的直接称呼及亲切、郑重的语气。
- source_word: φυλάξατε
  choice: 要谨守
  rationale: 表达认真遵行、持守命令之意，比单用“遵守”更能体现劝诫力度。
- source_word: πάντα ὅσα ἐντέλλομαι ὑμῖν
  choice: 我吩咐你们的一切
  rationale: 贴合“凡我所吩咐你们的全部内容”，同时避免生硬重复。
- source_word: οὐ μὴ ἁμάρτητε
  choice: 你们就绝不会犯罪
  rationale: οὐ μή加虚拟语气构成强烈否定；“绝不会”保留其强调力度，“犯罪”对应ἁμαρτάνω。
theological_decisions:
- issue: 遵行命令与不犯罪之间的关系
  choice: 用“就”呈现命令与结果之间的直接关联，不另加条件或解释
  alternative: 译作“免得你们犯罪”或“使你们不至犯罪”
  rationale: 原文以καί连接命令和强烈否定陈述；直译为结果性表达，保留其鲜明主张和潜在神学张力，不将其弱化为目的或可能性。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。以冒号清楚引出吩咐；不添加原文没有的限定语。
