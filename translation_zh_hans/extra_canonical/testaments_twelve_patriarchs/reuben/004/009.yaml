source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Καὶ γὰρ⁶⁷ πολλὰ ἐποίησεν αὐτῷ ἡ Αἰγυπτία, καὶ μάγους προσεκάλεσεν⁶⁸ καὶ *φάρμακα αὐτῷ προσήνεγκε⁶⁹, ἐπειδὴ γὰρ ἐφύλαξεν ἑαυτὸν Ἰωσὴφ ἀπὸ πάσης. β, Α, S¹ κυρίου. καὶ⁷⁰ οὐκ ἐδέξατο⁷¹ τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ⁷² ἐπιθυμίαν πονηράν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/009.yaml
  text: For the Egyptian woman did many things to him, and called in magicians and brought him potions; for Joseph guarded himself from every evil desire and did not accept the counsel of his soul for wicked desire.
translation:
  language: zh_hans
  text: 因为那个埃及妇人对他用了许多手段，又召来术士，给他送上药剂；因为约瑟保守自己，远离一切邪恶的欲望，也不接受自己内心关于恶欲的谋议。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ ἐποίησεν αὐτῷ
  choice: 对他用了许多手段
  rationale: 字面为“对他做了许多事”；结合召术士、送药剂的语境，译为“用了许多手段”较自然，同时不擅自明确这些行为必然是直接伤害。
- source_word: μάγους
  choice: 术士
  rationale: 可指施行法术或秘术的人；“术士”比现代语境中的“魔术师”更符合古代背景。
- source_word: φάρμακα
  choice: 药剂
  rationale: 该词可指药物、毒药或巫术药剂；原文未明确其性质，因此采用范围较宽的“药剂”以保留歧义。
- source_word: ἐφύλαξεν ἑαυτόν
  choice: 守住自己
  rationale: 保留“看守、保护自己”的反身含义，并以现代汉语可理解的表达呈现道德上的自守。
- source_word: διαβούλιον τῆς ψυχῆς αὐτοῦ
  choice: 自己心灵的谋议
  rationale: 尽量贴近“他心灵的筹谋、建议”，保留内在欲念仿佛向人提出谋议的表达。
- source_word: ἐπιθυμίαν πονηράν
  choice: 恶欲
  rationale: 简洁表达邪恶的欲望，不把它限缩为某一特定种类的情欲。
theological_decisions:
- issue: 连接词 καὶ 在约瑟自守分句中的逻辑关系
  choice: 译为“却”
  alternative: 译为“并且”或依英语审校层译为“因为”
  rationale: 所给希腊文本在此见 καὶ，且前文有 ἐπειδὴ γὰρ 引出原因；中文用“却”可自然呈现埃及妇人的手段与约瑟自守之间的对照，但不把该处强行解释为新的因果连接。
- issue: “心灵的谋议”与“恶欲”的句法关系
  choice: 理解为拒绝内心谋议去追求恶欲
  alternative: 把“恶欲”直接作为“谋议”的同位说明，译作“心灵所谋划的恶欲”
  rationale: 希腊文结构略显生硬，可能受文本传承影响；正文保留二者的关联而不把“恶欲”完全等同于“谋议”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“术士”“药剂”“心灵的谋议”等措辞保留古代叙事色彩及源文歧义；不添加原文未明说的毒害、巫药或专指性欲等解释。
