  naturalness: 原译流畅，惟“那埃及妇人”在现代汉语中宜作“那个埃及妇人”。“自己心灵的谋议”略显生硬，改作“自己内心关于恶欲的谋议”较自然，同时仍保留原文抽象、略带拟人化的表达。
