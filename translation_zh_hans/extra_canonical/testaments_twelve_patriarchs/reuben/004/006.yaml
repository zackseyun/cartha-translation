source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Βόθρος γάρ ἐστι ψυχῆς ἡ ἁμαρτία τῆς πορνείας⁵², χωρίζουσα ἀπὸ⁵³ θεοῦ καὶ προσεγγίζουσα *τοῖς εἰδώλοις⁵⁴, ὅτι αὕτη *ἐστὶν ἡ⁵⁵ πλανῶσα τὸν νοῦν *καὶ τὴν διάνοιαν⁵⁶, καὶ κατάγει⁵⁷ νεανί- σκους εἰς ᾅδην, οὐκ ἐν καιρῷ αὐτῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/006.yaml
  text: For the sin of sexual immorality is a pit for the soul, separating it from God and drawing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.
translation:
  language: zh_hans
  text: 因为淫乱的罪是灵魂的深坑，使人远离上帝，又使人亲近偶像；因为这罪迷惑人的心思和悟性，使年轻人在尚未到他们的时候就下到阴间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἁμαρτία τῆς πορνείας
  choice: 淫乱的罪
  rationale: πορνεία泛指不合正当规范的性行为；“淫乱”在此既简洁庄重，也保留原文的道德含义。
- source_word: βόθρος ... ψυχῆς
  choice: 灵魂的深坑
  rationale: βόθρος指坑、深坑；保留原文鲜明的危险意象，不将其抽象化为“陷阱”。
- source_word: χωρίζουσα ἀπὸ θεοῦ
  choice: 使人与上帝隔绝
  rationale: 希腊文省略受影响对象，语义上承接陷入此罪的人；中文补出“人”以求自然，同时保留与上帝分离的含义。
- source_word: προσεγγίζουσα τοῖς εἰδώλοις
  choice: 把人拉近偶像
  rationale: προσεγγίζω表示使接近；“拉近”体现罪的牵引作用，并与“隔绝”形成方向上的对照。
- source_word: τὸν νοῦν καὶ τὴν διάνοιαν
  choice: 人的心思和悟性
  rationale: 两个近义词并列，分别侧重心智活动与理解、判断能力；译文保留二者，不合并处理。
- source_word: κατάγει ... εἰς ᾅδην
  choice: 使……下到阴间
  rationale: ᾅδης在此为死者所在之处；“阴间”比“地狱”更能避免加入终极刑罚的特定含义。
- source_word: οὐκ ἐν καιρῷ αὐτῶν
  choice: 未到寿终之时
  rationale: 字面为“不在他们的时候”；结合下到阴间的语境，指未到通常应死之时，即早逝。
theological_decisions:
- issue: 淫乱与偶像之间关系的表达
  choice: 又把人拉近偶像
  alternative: 又使人亲近偶像崇拜
  rationale: 原文只说“偶像”，未明说“偶像崇拜”；译文保留具体名词及其含蓄的宗教关联，不加以解释性扩展。
- issue: ᾅδης的译法
  choice: 阴间
  alternative: 地狱
  rationale: 此处强调年轻人过早进入死者之境，而非明确论述最终审判或永刑，因此采用较中性的“阴间”。
- issue: οὐκ ἐν καιρῷ αὐτῶν的解释程度
  choice: 未到寿终之时
  alternative: 不在他们的时候
  rationale: 直译在现代汉语中晦涩；依上下文明确为早死，但不进一步断定死亡方式或神学原因。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“深坑”“拉近”“下到”等原文方向性意象；在希腊文分词结构中补出“人”，避免中文误将“灵魂”机械地视为所有动作的唯一宾语。
