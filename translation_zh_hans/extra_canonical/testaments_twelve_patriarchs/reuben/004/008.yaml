    rationale: 原文在“洁净意念”和“得恩”之间仅用καί并列；即使叙事语境可让读者看出关联，也不宜将其译为明示结果或功德关系。
  - severity: low
    issue: “除净心中一切淫乱的念头”容易使“一切淫乱的”直接限定“念头”。
    rationale: 希腊文是“洁净意念，脱离一切淫乱”，应保留意念作为洁净对象、淫乱作为所去除之物的关系。
