  text: For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from all sexual immorality, and found favor before God and men.
translation:
  language: zh_hans
  text: 因为你们已经听说约瑟的事：他怎样保守自己远离那女人，洁净自己的意念，除去一切淫乱，并在上帝和人面前蒙了恩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαξεν ἑαυτὸν ἀπὸ γυναικός
  choice: 使自己远离那女人
  rationale: φυλάσσω ἑαυτόν 表达谨慎守护自己、避免陷入诱惑；结合约瑟叙事的特定背景，γυναικός 虽无冠词，汉语用“那女人”可自然指向听众已知的女子，同时不额外点明其身份。
- source_word: τὰς ἐννοίας ἐκαθάρισεν
  choice: 除净心中……的念头
  rationale: ἐννοίαι 指内在的思想、意念；“心中的念头”符合现代汉语表达，ἐκαθάρισεν 则以“除净”保留洁净意象。
- source_word: ἀπὸ πάσης πορνείας
  choice: 一切淫乱的
  rationale: πάσης 表示“一切、所有”，πορνεία 在此指性方面的不道德；“淫乱”简洁庄重，也保留其较宽泛的伦理含义。
- source_word: εὗρεν χάριν ἐνώπιον θεοῦ καὶ ἀνθρώπων
  choice: 在上帝和人面前蒙了恩
  rationale: “蒙恩”是 εὗρεν χάριν 的自然、凝练对应；“在……面前”保留 ἐνώπιον 的关系性表达。
theological_decisions:
- issue: 约瑟内在意念的洁净与所蒙恩宠之间的关系
  choice: 以“因而”表达叙事上的结果联系
  alternative: 仅用“并且”，不明确关系
  rationale: 希腊文以 καί 并列，但上下文自然呈现约瑟自守、洁净意念后蒙恩的进展。“因而”传达这一叙事联系，却不将恩解释为靠行为赚取，从而避免加入特定功德论。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“那女人”依赖约瑟故事这一共享背景；“心中一切淫乱的念头”既保留原文对内在思想的强调，也避免把 πορνεία 缩窄为某一种具体行为。
