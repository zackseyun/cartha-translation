  source_fidelity: 原文以三个由καί连接的动作叙述约瑟：保守自己远离一位女人、洁净自己的意念脱离一切πορνεία、并在上帝和人面前得恩。草稿基本传达前两项和末项，但“因而”把原文并列叙述明确改为因果关系，超出了原文。
  naturalness: 整体庄重自然。“洁净自己的意念，除去一切淫乱”比“除净心中一切淫乱的念头”更清楚地区分“意念”是被洁净的对象、淫乱是所除去的内容，也更贴近原文句法。
  terminology: “淫乱”可对应此处广义的πορνεία；“在上帝和人面前蒙恩”自然且保留εὗρεν χάριν ἐνώπιον的表达。“那女人”在约瑟故事的既有语境中可行，虽希腊文未用定冠词，但不构成不安全的增添。
  issues:
