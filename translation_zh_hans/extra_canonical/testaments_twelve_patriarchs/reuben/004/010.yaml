revisions:
- from: 因此，你们祖先的上帝救他脱离了各种隐伏的恶性死亡。[a]
  to: 因此，你们祖先的上帝救他脱离了每一种暗中潜伏的凶恶死亡。[a]
  rationale: 修订仅替换“恶性死亡”这一在现代汉语中易被医学化理解的表达，并相应澄清脚注。译文仍保留παντός的全称范围、πονηροῦ与κεκρυμμένου对θανάτου的凝缩修饰，以及原文未拆分为两个获救对象的结构。
