  text: Διὰ τοῦτο⁷³ ὁ θεὸς τῶν πατέρων ὑμῶν⁷⁴ ἐρρύσατο αὐτὸν ἀπὸ παντὸς πονηροῦ⁷⁵ κεκρυμμένου θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/010.yaml
  text: Therefore the God of your fathers delivered him from every hidden evil death.
translation:
  language: zh_hans
  text: 因此，你们祖先的上帝救他脱离了每一种暗中潜伏的凶恶死亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“每一种凶恶、隐伏的死亡”。“隐伏的”在语法上直接修饰“死亡”；整句将其作为一个死亡危险的描述，并未把“邪恶”和“死亡”列为两个彼此独立的对象。
    reason: 说明原文中多个修饰语集中修饰“死亡”的句法关系，避免正文的自然汉语表达被误解为两个对象，同时避免“恶性死亡”的医学歧义。
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 自然表达前文所述原因与本句结果之间的推论关系。
- source_word: ὁ θεὸς τῶν πατέρων ὑμῶν
  choice: 你们祖先的上帝
  rationale: 忠实保留第二人称复数和族长传统的含义；“祖先”在现代汉语中比“列祖”更易懂。
- source_word: ἐρρύσατο αὐτόν
  choice: 救他脱离了
  rationale: ῥύομαι在此表示从危险中搭救，汉语“救……脱离”准确且自然。
- source_word: ἀπὸ παντὸς πονηροῦ κεκρυμμένου θανάτου
  choice: 脱离了各种隐伏的恶性死亡
  rationale: 按现有希腊文本将κεκρυμμένου理解为修饰θανάτου，并使πονηροῦ也归入同一名词短语，不拆成“邪恶”和“死亡”两个对象；“各种”传达παντός在此类语境中的全称范围。
theological_decisions:
- issue: “你们祖先的上帝”的称谓
  choice: 保留关系性称谓，不简化为“上帝”
  alternative: 上帝
  rationale: 原文特意把上帝与听众的祖先相联系，可能承载盟约和族群记忆，不宜删减。
- issue: 末尾属格短语的句法关系
  choice: 译作一个整体：“各种隐伏的恶性死亡”
  alternative: 各种隐伏的邪恶和死亡
  rationale: κεκρυμμένου在形态上与θανάτου一致，支持其修饰“死亡”；将其拆为两个获救对象会加入原文没有的并列结构。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“隐伏”比“隐藏”更适合描述尚未显露、暗中潜在的死亡危险；正文保留原文略显凝缩的表达，脚注说明其句法歧义。
