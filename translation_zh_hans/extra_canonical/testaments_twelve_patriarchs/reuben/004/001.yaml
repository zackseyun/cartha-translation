  to: 所以，我的孩子们，不要注目女子的美貌，也不要思量她们的所作所为；却要以纯一的心行事，在敬畏主中生活，在善工、文字和你们的羊群上辛劳，直到主赐给你们一位他自己所愿意的妻子，免得你们像我一样受苦。
  rationale: 修订仅处理两处可安全校正之处：以“他自己所愿意的”避免将θέλει限定为“选定”，并以“在……上辛劳”使μοχθοῦντες覆盖善工、文字、羊群三项。“所作所为”自然对应πράξεις，末句仍不预设受苦的具体性质。原始材料未提供编号异文注的内容，故不增设无依据的脚注。
