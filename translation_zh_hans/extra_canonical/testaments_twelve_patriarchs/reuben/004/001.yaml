  text: Μὴ οὖν προσέχετε, Γτέκνα μου1, κάλλος2 γυναικῶν3, μηδὲ ἐννοεῖσθε4 τὰς πράξεις αὐτῶν· ἀλλὰ πορεύεσθε ἐν5 ἁπλότητι καρδίας, ἐν φόβῳ κυρίου6, καὶ μοχθοῦντες7 ἐν ἔργοις *καλοῖς, καὶ8 *ἐν γράμμασι, καὶ ἐν τοῖς ποιμνίοις9 ὑμῶν, ἕως οὗ10 *ὁ κύριος δώῃ ὑμῖν11 *σύζυγον, ἣν αὐτὸς θέλει12, ἵνα μὴ πάθητε13, ὡς κἀγώ14.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/001.yaml
  text: Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.
translation:
  language: zh_hans
  text: 所以，我的孩子们，不要注目女子的美貌，也不要思量她们的所作所为；却要以纯一的心行事，在敬畏主中生活，在善工、文字和你们的羊群上辛劳，直到主赐给你们一位他自己所愿意的妻子，免得你们像我一样受苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: 注目
  rationale: 表达把注意力放在某事物上的含义；与宾语“女子的美貌”搭配自然，也保留劝诫语气。
- source_word: ἐννοεῖσθε
  choice: 想着
  rationale: 原词可指心里思量、留意；译作“想着”不额外断定这是幻想、沉迷或仿效。
- source_word: πράξεις
  choice: 行为
  rationale: 概括实际行动或所作之事，语体庄重而不过度解释其道德性质。
- source_word: ἁπλότητι καρδίας
  choice: 存纯一的心
  rationale: ἁπλότης可有单纯、真诚、专一之意；“纯一”保留其心志不分、无诡诈的语义空间。
- source_word: μοχθοῦντες
  choice: 勤做／研习／料理
  rationale: 该分词表示辛勤劳作；中文按三个并列领域分别搭配动词，以自然表达持续勤劳之意。
- source_word: ἐν γράμμασι
  choice: 研习文字
  rationale: γράμματα可指文字、书写或学问；此处不把它狭义限定为某类经书或教育制度。
- source_word: ποιμνίοις
  choice: 羊群
  rationale: 该词通常指羊群或畜群；结合族长叙事的牧养背景，译作“羊群”最为直接。
- source_word: σύζυγον
  choice: 妻子
  rationale: 本义为配偶；句中以女子为对象并对男性后辈说话，译作“妻子”符合语境。
theological_decisions:
- issue: “主”的所指与大小写
  choice: 主
  alternative: 上主／耶和华
  rationale: κύριος在本句未明示专名；译作“主”既承接原文，也避免补入原文没有的神名形式。
- issue: 妻子的选择者
  choice: 主把他亲自选定的妻子赐给你们
  alternative: 主把合他心意的妻子赐给你们
  rationale: ἣν αὐτὸς θέλει直译涉及“他自己所愿意／选择的”；采用“亲自选定”保留主的主动性，不改写为仅描述妻子的品格。
- issue: 末句痛苦的性质
  choice: 像我一样受苦
  alternative: 遭受我所遭受的事／像我一样陷入情欲之苦
  rationale: πάθητε本身只说经历或受苦，未在本节明确限定具体性质；不从上下文强行补入情欲、惩罚或犯罪后果。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。保留原文从消极禁戒转向积极生活准则的结构；“善工、文字、羊群”三项并列，不以现代职业或宗派性术语改写。
