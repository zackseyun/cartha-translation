  text: For until my father's death I did not have the boldness to look my father in the face.
translation:
  language: zh_hans
  text: 因为直到父亲去世，我都不敢正眼看他的脸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄχρι τελευτῆς τοῦ πατρός μου
  choice: 直到父亲去世
  rationale: τελευτή在此指生命的终结；用“去世”符合现代汉语庄重而自然的表达。
- source_word: οὐκ εἶχον παρρησίαν
  choice: 我都不敢
  rationale: παρρησία表示坦然、勇气或无所顾忌；与后面的注视动作连用时，“不敢”自然传达因羞愧而缺乏勇气，并不额外增添原因。
- source_word: ἀτενίσαι εἰς τὸ πρόσωπον
  choice: 正眼看他的脸
  rationale: ἀτενίζω表示定睛、直视；“正眼看”既保留直视之意，也符合汉语中因羞愧而不敢面对某人的语境。
