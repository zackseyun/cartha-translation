source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ γὰρ πολλοὺς ἀπώλεσεν ἡ πορνεία· ὅτι κἂν *γέρων ᾖ τις⁵⁸, κἂν⁵⁹ εὐγενής, Γκἂν πλούσιος, κἂν πένης⁶⁰, *ὀνειδισμὸν ἑαυτῷ φέρει παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων καὶ †πρόσκομμα τῷ Βελίαρ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/007.yaml
  text: For sexual immorality has destroyed many; for whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.
translation:
  language: zh_hans
  text: 因为淫乱毁了许多人；因为一个人无论年老、出身高贵、富有还是贫穷，都会使自己在世人面前蒙受羞辱，并成为彼列的绊脚石[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”是古代犹太文献中人格化的邪恶者之名。希腊文“彼列的绊脚石”这一短语有文本和语义上的疑难；本译文按现存词句译出。
    reason: 说明专名，并提示该处原文的真实文本及语义困难，避免在正文中擅自消解其歧义。
lexical_decisions:
- source_word: πορνεία
  choice: 淫乱
  rationale: 该词指不合正当秩序的性行为；“淫乱”既保留道德含义，也符合本段庄重的劝诫语体。
- source_word: υἱοὺς τῶν ἀνθρώπων
  choice: 世人
  rationale: 字面为“人的众子”，在此泛指人类社会中的人；译作“世人”较符合现代汉语，同时保留公开蒙羞的意思。
- source_word: ὀνειδισμόν
  choice: 羞辱
  rationale: 表示责难、耻辱或受辱的处境；“蒙受羞辱”自然表达 φέρει ἑαυτῷ 所含“给自己招来”的结果。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 保留该专名在犹太文献中人格化邪恶者的用法，不以某个解释性称号取代原名。
- source_word: πρόσκομμα
  choice: 绊脚石
  rationale: 采用其常见形象义，并保留原文“对彼列而言是绊脚石”这一不寻常且可能存在文本问题的表达。
theological_decisions:
- issue: “彼列的绊脚石”这一神学和语义上不寻常的短语
  choice: 按现存希腊文译为“成为彼列的绊脚石”
  alternative: 解释性改译为“落入彼列的网罗”或“成为别人犯罪的绊脚石”
  rationale: 希腊文明确有 πρόσκoμμα 与表示对象的 τῷ Βελίαρ，但该处带有文本疑难标记。为避免凭神学推断修正文意，正文保留其张力，并以脚注提示。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“无论……还是……”重现连续的 κἂν 结构；分号保留两个 γάρ 分句间紧密的论证关系。
