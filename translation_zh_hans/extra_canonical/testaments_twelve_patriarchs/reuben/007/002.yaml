- source_word: αὐτὸν
  choice: 他
  rationale: 保留第三人称男性单数宾语，不补出原文未明说的身份。
- source_word: ἐν σορῷ
  choice: 在棺中
  rationale: σορός在此语境指盛放遗体的棺或棺椁；译作“棺中”简洁准确。
- source_word: ἕως
  choice: 直到……
  rationale: 原始材料止于表示时间界限的连接词，句意未完；用省略号明确保留残句状态，不补入后文。
