  rationale: 保留原文对前述训诫内容的概括指称。
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: 儿子们
  rationale: “他的”在此语境中可由主语与受事关系自然推出，省略后更符合现代汉语且不损失意义。
