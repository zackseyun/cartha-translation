  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/007.yaml
  text: And Reuben died[a], after commanding these things to his sons. And they placed him in a coffin until he was brought up from Egypt and buried in Hebron[b], in the cave where his fathers were.
translation:
  language: zh_hans
  text: 吕便嘱咐了他的儿子们这些事以后，就死了[a]。他们把他安放在棺木中，直到后来他被从埃及运上来，葬在希伯仑[b]他父祖所在的洞穴中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章所提供的希腊文本十分简短，并在“直到”之后中断。正文后半段关于迁葬的叙述，是依据本遗训的叙事背景作出的最小限度补足，并非译自一份完整重构的希腊文本。
    reason: textual_variant
  - marker: b
    text: 希伯仑和父祖所在的洞穴，使人联想到《创世记》所记的祖茔传统。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέθανε
  choice: 死了
  rationale: 采用普通、直接的死亡用语，不加入“睡了”等原文没有的委婉色彩。
- source_word: ἐντειλάμενος
  choice: 吩咐完……以后
  rationale: 分词表示先于死亡发生的行动；“吩咐”保留遗训语境中的郑重和权威意味。
- source_word: υἱοῖς
  choice: 儿子
  rationale: 准确保留希腊文明确的男性亲属称谓，不泛化为“儿女”或“孩子”。
- source_word: ἔθεντο
  choice: 安放
  rationale: 在入殓语境中自然庄重，同时贴近“放置”的基本含义。
- source_word: σορῷ
  choice: 棺木
  rationale: 该词指棺或殓葬容器；“棺木”清楚自然，又不过度具体化为石棺。
- source_word: ἕως
  choice: 直到
  rationale: 保留现存希腊文本在此处开启的时间关系，并避免掩盖其随后残缺的事实。
theological_decisions:
- issue: 如何处理本章希腊见证极短且在ἕως（“直到”）之后中断的问题
  choice: 直译现存的死亡与暂时入殓记载，并仅依据本遗训的叙事背景，以最小幅度补足从埃及迁葬希伯仑的句意，同时用脚注说明。
  alternative: 只译现存词句，使正文止于未完成的“直到”；或依据其他见证和版本重构更完整的结尾。
  rationale: 只保留残句会使本章正文难以使用，而无说明地全面重构则会超出所提供的希腊证据。最小补足并明确标注，兼顾原文优先、可读性与文本透明度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“吕便”为常见圣经人名译法；“安放在棺木里”“运上去”“葬在……洞中”保持殓葬叙事的清晰与克制。正文以[a]、[b]完整标出脚注位置。
