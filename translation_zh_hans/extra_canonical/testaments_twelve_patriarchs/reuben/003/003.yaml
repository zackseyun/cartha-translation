base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/003.yaml
  text: First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of greediness of the belly.
translation:
  language: zh_hans
  text: 第一，淫乱之灵存于本性和感官之中。第二，是贪图口腹之灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ τῆς πορνείας πνεῦμα
  choice: 淫乱之灵
  rationale: πορνεία泛指不正当的性行为；译作“淫乱”既简洁，又保留其道德含义。
- source_word: ἐν τῇ φύσει
  choice: 在人的本性……之中
  rationale: φύσις可指“本性、自然禀赋”；补出“人的”使现代汉语指向明确，但不进一步断定其具体人论含义。
- source_word: ταῖς αἰσθήσεσιν
  choice: 感官
  rationale: αἴσθησις在此为复数，指感知或感官能力；“感官”最自然，并与“本性”形成并列。
- source_word: ἔγκειται
  choice: 潜藏在
  rationale: 该词表示内在、置于其中；“潜藏”保留其内驻意味，同时符合中文表达。
- source_word: πνεῦμα ἀπληστείας γαστρός
  choice: 贪图口腹之灵
  rationale: ἀπληστία表示贪求、不知满足，γαστήρ在此关乎肚腹或食欲；“贪图口腹”自然表达对饮食的贪求。
theological_decisions:
- issue: “灵”（πνεῦμα）的本体性质
  choice: 保留“……之灵”的表述，不说明是独立灵体、倾向还是支配性力量
  alternative: 译作“淫乱的倾向”“贪食的欲望”
  rationale: 原文πνεῦμα具有解释空间；直译为“灵”可保留文本的拟人化及神学张力，避免替作者作本体论判断。
- issue: φύσις是否特指堕落本性
  choice: 译作“人的本性”，不加“罪性”等限定
  alternative: 译作“罪性”或“肉体本性”
  rationale: 原文只说φύσις，没有明确限定；加入“罪性”会导入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。第一句保留原文完整谓语；第二句依照原文省略谓语的列举结构，以“是”自然承接序列。
