base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/010.yaml
  text: Do not look at a woman's appearance, nor associate with a married woman, nor pry into the affairs of women.
translation:
  language: zh_hans
  text: 不要留意女人的容貌，也不要与有夫之妇交往，更不要过问女人的事务。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε ὄψει γυναικείᾳ
  choice: 注视女人的容貌
  rationale: προσέχω 在此表示把注意力投向，ὄψις 可指外貌、容貌；译为“注视……容貌”既贴近原文，也自然传达带有持续关注意味的禁令。
- source_word: συνδιάζετε
  choice: 交往
  rationale: 该词在此指与人结伴、来往；“交往”保持中性，不额外断定具体行为或关系性质。
- source_word: θηλείας ὑπάνδρου
  choice: 有夫之妇
  rationale: ὕπανδρος 字面指在丈夫之下，即已有丈夫的女子；“有夫之妇”准确、简洁，并符合庄重语体。
- source_word: περιεργάζεσθε
  choice: 探究
  rationale: 该词含多管闲事、好奇查问之意；“探究”保留窥探他人事务的语义，同时避免过度口语化。
- source_word: πρᾶξιν γυναικῶν
  choice: 女人的事务
  rationale: πρᾶξις 可指行为、活动或事务；此处语境不足以唯一确定，采用较宽泛的“事务”以保留原文范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。三个并列禁令以“不要……也不要……更不要……”连接，保持原文递进式节奏；不加入原文未明说的性行为或宗派性解释。
