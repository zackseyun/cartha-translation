base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/008.yaml
  text: And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.
translation:
  language: zh_hans
  text: 这样，每一个年轻人就毁灭了：他使自己的心智昏暗，偏离真理；不明白上帝的律法，也不听从他父辈的劝诫，正如我在年轻时所遭遇的一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本本节的传抄材料有若干异文和疑难之处，尤其涉及“自己的心智”以及句中若干插入词；正文依照可连贯理解的主句翻译。
    reason: 所给校勘文本含括号、异文编号及疑似由旁注混入正文的词语；提醒读者文字传承存在不确定性，而不在正文中武断拼合。
lexical_decisions:
- source_word: ἀπόλλυται
  choice: 走向毁灭
  rationale: 保留该动词“灭亡、毁坏”的强烈含义，同时以自然汉语表达这一败坏过程。
- source_word: πᾶς νεώτερος
  choice: 每一个年轻人
  rationale: νεώτερος在此指年少者；结合吕便回顾自己青年时期的语境，译作“年轻人”比机械的“较年轻者”自然。
- source_word: σκοτίζων τὸν νοῦν αὐτοῦ ἀπὸ τῆς ἀληθείας
  choice: 他的心智因而远离真理，变得昏暗
  rationale: 同时呈现σκοτίζων的“使昏暗”和ἀπὸ τῆς ἀληθείας所表达的与真理隔离；不把νοῦς缩窄为单纯的理性或思想。
- source_word: μὴ συνιὼν ἐν τῷ νόμῳ τοῦ θεοῦ
  choice: 不明白上帝的律法
  rationale: 以现代汉语表达“在上帝律法上没有领悟”；避免生硬直译“在律法中不明白”。
- source_word: νουθεσίας πατέρων αὐτοῦ
  choice: 父辈的劝诫
  rationale: νουθεσία兼有告诫、教导之意；“父辈”保留复数πατέρων可能指父亲或先辈的开放性。
- source_word: ἔπαθον ἐν τῷ νεωτερισμῷ μου
  choice: 我年轻时所遭遇的
  rationale: ἔπαθον含“经历、受苦”之意；此处不强行判定其受事内容，以“所遭遇的”保留概括性。
theological_decisions:
- issue: “上帝的律法”所指范围
  choice: 按原文直译为“上帝的律法”
  alternative: 具体化为摩西律法、诫命或一般道德教导
  rationale: 原文未限定其范围，不加入后来的宗派性或体系化解释。
- issue: 毁灭的性质
  choice: 译作“走向毁灭”而不具体说明
  alternative: 解释为灵性败坏、肉身死亡或末世灭亡
  rationale: ἀπόλλυται本身未在本节明确界定毁灭的层面，应保留其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心智”兼顾νοῦς的思想、理解与内在判断含义；全句用分号理清希腊分词结构与并列否定，使普通读者易于理解，同时保留原文关于真理、律法、父辈劝诫及毁灭性质的开放性。
