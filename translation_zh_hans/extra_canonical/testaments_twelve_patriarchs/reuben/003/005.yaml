  rationale: 仅作两项安全的词汇微调：“自命不凡”改为“自高自大”，以更准确自然地表达“自视甚高”；“败亡”改为“毁灭”，以较完整地涵盖ἀπώλεια。疑难文本的正文保留方式及两则脚注均维持不变。
