base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/005.yaml
  text: Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood, in destruction and jealousy, to forge words and hide words from his own family and household.
translation:
  language: zh_hans
  text: 第五种是骄傲之灵，使人自夸、自高自大。第六种是虚假之灵，在毁灭和嫉妒中[a]，使人编造话语，并向自己的亲族和家人隐瞒自己的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在毁灭和嫉妒中”：此处希腊文本有讹误或残缺的迹象，原句的确切含义及其与上下文的关系不确定；也可能理解为与毁灭、嫉妒相关的情形或作用。
    reason: 原版以剑号标示ἐν ἀπωλείᾳ καὶ ζήλῳ为疑难文本，不宜在正文中无提示地确定解释。
  - marker: b
    text: “自己的话”：此处代词的文本与所指不十分确定；有的理解可省去这个短语，只作“向自己的亲族和家人隐瞒话语”。
    reason: 原版在αὐτοῦ附近标示文本疑难；译文保留传本文字，同时说明替代读法。
lexical_decisions:
- source_word: ὑπερηφανείας
  choice: 骄傲
  rationale: 直接表达高傲、自大的含义，符合现代汉语自然用法。
- source_word: καυχᾶται
  choice: 自夸
  rationale: 保留动词的自我夸耀之意。
- source_word: μεγαλοφρονῇ
  choice: 自命不凡
  rationale: 表达自视甚高、抱持夸大自我观念的含义，比直译“思想宏大”更准确自然。
- source_word: ψεύδους
  choice: 虚假
  rationale: 涵盖谎言、虚伪之意，并与“灵”自然搭配。
- source_word: πλάττειν λόγους
  choice: 编造话语
  rationale: πλάττειν本义为塑造、捏造；在此与虚假相连，表示编造言辞，但不额外限定为诬告或欺骗。
- source_word: γένους καὶ οἰκείων
  choice: 亲族和家人
  rationale: 分别传达血缘宗族与家内亲近之人的双重范围，避免将两词合并为一个概念。
theological_decisions:
- issue: “灵”是否人格化或特指邪灵
  choice: 保留“骄傲之灵”“虚假之灵”
  alternative: 译为“骄傲的倾向”“虚假的倾向”
  rationale: 原文明确使用πνεῦμα；不擅自判定其本体性质，也不将其心理化。
- issue: ἐν ἀπωλείᾳ καὶ ζήλῳ的意义与句法
  choice: 直译为“在败亡和嫉妒中”并加注
  alternative: 解释为“导致败亡和嫉妒”或“怀着毁灭与嫉妒”
  rationale: 原文此处有校勘疑难，介词短语与上下文的准确关系不明；正文保存其张力，注释说明不确定性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“第五种……第六种……”承接上下文列举诸灵的结构；使用“使人”补足希腊语目的/结果从句在汉语中的自然主语。对两处校勘疑难均以脚注保留，不在正文中强行消解。
