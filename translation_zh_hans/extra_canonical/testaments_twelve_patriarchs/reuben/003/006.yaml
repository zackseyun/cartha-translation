source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 6. Ἔβδομον πνεῦμα *ἀδικίας, μεθ’ ἧς⁴⁰ β-g, Α, κλοπαὶ⁴¹ καὶ γρηπίσματα⁴², ἵνα ἐμπλήσει⁴³ φιληδονίαν καρδίας S ποιήσῃ. αὐτοῦ. Ἡ γὰρ ἀδικία συνεργεῖ⁴⁴ *τοῖς λοιποῖς⁴⁵ πνεύμασιν β, S¹ ὑπ- διὰ τῆς δοσοληψίας⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/006.yaml
  text: Seventh, a spirit of injustice, with thefts and acts of greed, so that it may fill the pleasures of the heart. For injustice works together with the other spirits through buying and selling.
translation:
  language: zh_hans
  text: 第七，是不义之灵；偷窃和贪夺与它相随，为要满足人心中贪图享乐的欲望。因为不义借着财物往来，与其余诸灵一同作工。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδικίας
  choice: 不义
  rationale: 保留该词兼具不公正、邪恶行为的道德含义，并与后文重复出现的名词保持一致。
- source_word: κλοπαὶ καὶ γρηπίσματα
  choice: 偷窃和贪夺
  rationale: κλοπαί直指偷窃；罕见词γρηπίσματα在此表示出于贪婪的攫取，用“贪夺”既体现贪欲，也体现夺取行为。
- source_word: φιληδονίαν καρδίας αὐτοῦ
  choice: 人心中贪图享乐的欲望
  rationale: φιληδονία是“爱好享乐、贪恋快乐”，不是复数的各种“快乐”；结合上下文，以自然汉语表达其内在欲望。
- source_word: δοσοληψίας
  choice: 财物往来
  rationale: 该词字面涉及给予和收取，可指交易或相互往来；“财物往来”比单限定为“买卖”更能保留语义范围，同时符合本节关于贪夺和不义的经济语境。
- source_word: συνεργεῖ τοῖς λοιποῖς πνεύμασιν
  choice: 与其余诸灵一同作工
  rationale: 保留“不义”与其他灵协同运作的拟人化表述，并延续段落中“诸灵”的称呼。
theological_decisions:
- issue: “不义”与“灵”的关系
  choice: 译作“不义之灵”，并在后句让“不义”作主语
  alternative: 译作“施行不义的灵”，或把后句也改成“这灵”
  rationale: 希腊文先说πνεῦμα ἀδικίας，后又以ἡ ἀδικία为主语；现译保留从“不义之灵”到“不义”本身的措辞变化，不把它系统化为特定的灵界教义。
- issue: 财物往来本身是否被定为邪恶
  choice: 按原文说不义“借着”财物往来协同作工
  alternative: 译成“不义的买卖”或“欺诈交易”
  rationale: 原文没有直接修饰交易为欺诈；译文保留媒介关系，避免添加一切交易本身皆恶的判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“贪夺”略带书面色彩，但能简洁承载罕见希腊词所含的贪婪攫取之意；“财物往来”则保留δοσοληψία可能涵盖给予、收取及交易的宽度。
