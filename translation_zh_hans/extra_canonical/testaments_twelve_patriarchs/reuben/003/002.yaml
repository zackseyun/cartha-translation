  text: With these spirits are mixed the spirits of error.
translation:
  language: zh_hans
  text: 与这些灵混杂在一起的是迷误之灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμμίγνυται
  choice: 混杂在一起
  rationale: 表达彼此掺混、结合之意，同时保留希腊文单数谓语配中性复数主语的自然语义。
- source_word: τὰ πνεύματα
  choice: 灵
  rationale: 按上下文保留重复出现的属灵实体用语，不具体化为情绪、倾向或力量。
- source_word: τῆς πλάνης
  choice: 使人迷失的
  rationale: πλάνη可指错误、迷惑或偏离；此处采用功能性表达，既涵盖欺迷，也涵盖使人走入歧途，避免只理解为抽象的认知错误。
theological_decisions:
- issue: “灵”是人格化实体还是内在倾向
  choice: 保留为“灵”
  alternative: 译作“倾向”或“力量”
  rationale: 原文重复使用πνεύματα，未明确界定其本体性质；直译为“灵”可保留文本本身的开放性。
- issue: πλάνη的含义范围
  choice: 译作“使人迷失的”
  alternative: “错误的”或“迷惑人的”
  rationale: 该属格可描述这些灵与迷误的关系，但关系类型并未完全明说；所选译法自然传达其致人偏离的作用，同时不引入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与……混杂在一起的，还有……”使句子自然，并保留原文两类“灵”彼此掺混的关系。
