revisions:
- from: 现在，我的孩子们，要爱真理，真理必守护你们。你们要听你们父亲吕便的话；我正在教导你们。
  to: 如今，我的孩子们，要爱真理，真理必守护你们。你们要听你们父亲流便的话，我正在教导你们。
  rationale: 修订仅将人名改为中文圣经通行的“流便”，将“现在”调整为较合遗训体的“如今”，并以逗号连接末句，以较忠实地反映διδάσκω ὑμᾶς与“听……话”的关联。原文末段有明显校勘痕迹，故未进一步把它扩展为定语从句或指定“话”的内容，以保留句法的不确定性。
