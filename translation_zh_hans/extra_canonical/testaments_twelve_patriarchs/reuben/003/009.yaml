base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/009.yaml
  text: And now, my children, love the truth, and it will guard you. Hear the words of Reuben, your father, as I teach you.
translation:
  language: zh_hans
  text: 如今，我的孩子们，要爱真理，真理必守护你们。你们要听你们父亲流便的话，我正在教导你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲属称谓，保留父亲对众子的劝诫语气。
- source_word: τὴν ἀλήθειαν ἀγαπᾶτε
  choice: 要爱真理
  rationale: 保留宾语“真理”及命令语气，表达自然简洁。
- source_word: φυλάξει ὑμᾶς
  choice: 必守护你们
  rationale: φυλάσσω在此指看守、保护；“守护”既贴近词义，也避免把保护的具体方式说得过满。
- source_word: Ἀκούσατε λόγους Ῥουβὴμ
  choice: 你们要听……吕便的话
  rationale: 按可辨识的希腊文句法处理为“听吕便的话”，保留λόγους的复数集合意义而用自然汉语“话”表达。
- source_word: διδάσκω ὑμᾶς
  choice: 我正在教导你们
  rationale: 保留第一人称现在时及明确宾语；“正在”体现当下施教的语境。
theological_decisions:
- issue: “真理”是否拟人化
  choice: 重复“真理”作后句主语
  alternative: 译作“它必守护你们”
  rationale: 希腊文αὕτη回指阴性名词ἀλήθεια。汉语重复名词可清楚呈现指代，但不额外断定这里是严格的人格化。
- issue: 末句的句法关系
  choice: 将“你们的父亲”作为“吕便”的同位语，将διδάσκω ὑμᾶς独立译为“我正在教导你们”
  alternative: 译作“要听你们父亲吕便教导你们的话”
  rationale: 所给文本的词序和校勘痕迹较紊乱；此处理遵循较清楚的成分关系，同时保留第一人称διδάσκω，不将其改造成分词定语。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“吕便”沿用中文圣经传统人名；命令句用“要”，应许句用“必”，保持父亲遗训的郑重语气。原文带有校勘符号和异文编号，但本节无需在正文中增设脚注。
