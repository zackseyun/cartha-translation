base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/001.yaml
  text: And besides all these, there is an eighth spirit, the spirit of sleep, with which trance and the image of death were created.
translation:
  language: zh_hans
  text: 除这一切以外，还有第八个灵，就是睡眠之灵；与它一同受造的，是本性的恍惚和死亡的形象。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “本性的恍惚”所译的希腊语可理解为“自然的恍惚”或“自然状态的离常”；其中“本性／自然”（φύσις）的具体所指并不完全确定。原文的被动单数动词后接两个并列名词，语法形式也略有不规则。
    reason: 说明ἔκστασις φύσεως的语义与属格关系仍有歧义，并交代原文单数动词与并列名词的形式张力。
lexical_decisions:
- source_word: ὄγδοον πνεῦμα τοῦ ὕπνου
  choice: 第八种灵，就是睡眠之灵
  rationale: 保留序数与属格说明关系，并用“就是”使现代汉语表达自然清楚。
- source_word: ἔκστασις φύσεως
  choice: 本性的失神状态
  rationale: ἔκστασις可指离常、失神或恍惚；φύσεως在此修饰关系并不完全明确，因此采用较贴近字面的“本性的”，不擅自解释为单纯的睡眠或灵魂离体。
- source_word: εἰκὼν τοῦ θανάτου
  choice: 死亡的形象
  rationale: 直译其比喻性表达，保留睡眠与死亡相似这一意象。
- source_word: μεθ’ οὗ ἐκτίσθη
  choice: 伴随它受造的
  rationale: μετά带属格可表“与……一同、伴随”；ἐκτίσθη为被动单数，但后接两个并列概念，文本存在语法张力，译文保留受造与伴随关系，不强行明确工具义。
theological_decisions:
- issue: “灵”（πνεῦμα）的性质
  choice: 保留为“灵”
  alternative: 译作“作用”“倾向”或“机能”
  rationale: 上下文称其为“第八种灵”，原文未明确这是人格化灵体、生理机能还是内在倾向；保留“灵”可避免提前消解其概念张力。
- issue: μεθ’ οὗ所表达的关系
  choice: 译为“伴随它”
  alternative: 译为“借着它”或“与它一同”
  rationale: 希腊语更直接支持伴随关系；“借着它”会加强工具或媒介含义，而原文未必要求如此。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“失神状态”较“出神”更少带积极宗教体验色彩；分号用于清楚呈现后半句的说明关系。
