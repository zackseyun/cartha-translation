  text: Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive.
translation:
  language: zh_hans
  text: 第三，是在肝和胆中的争斗之灵。第四，是取悦于人和巫术之灵，使人借着过度干预显得好看。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα μάχης
  choice: 争斗之灵
  rationale: μάχη指争斗、冲突或打斗；译作“争斗”既保留其广度，也符合此处列举诸灵的句式。
- source_word: ἐν τῷ ἥπατι καὶ ἐν τῇ χόλῃ
  choice: 在肝和胆中
  rationale: 依照希腊文保留古代人体与情志相关联的表达，不将其现代化解释为特定情绪。
- source_word: πνεῦμα ἀρεσκείας
  choice: 取悦于人……之灵
  rationale: ἀρέσκεια可指讨好、求取欢心；“取悦于人”自然表达其以博得他人好感为目的的意味，同时避免过度限定为炫耀。
- source_word: μαγγανείας
  choice: 行邪术
  rationale: μαγγανεία指巫术、法术或邪术；采用“行邪术”清楚呈现行为性质。
- source_word: διὰ περιεργείας
  choice: 借着过分装扮
  rationale: περιεργία本义涉及多事、过度操持或刻意讲究；在以“显得俊美”为目的的语境中，译为“过分装扮”较能传达其具体指向，但仍具一定语义不确定性。
- source_word: ὡραῖος ὀφθῇ
  choice: 显得俊美
  rationale: ὡραῖος表示美丽、俊美，ὀφθῇ为“被看见、显得”；译文保留外在观感，而不改作内在品格。
theological_decisions:
- issue: “灵”是人格化邪灵还是人的倾向
  choice: 保留“……之灵”的原文表述
  alternative: 译为“争斗的倾向”“讨好和邪术的冲动”
  rationale: πνεῦμα在本段的本体论指向可能具有张力；直译为“灵”可避免预先断定它仅是心理倾向或独立灵体。
- issue: 人体部位“肝和胆”的象征含义
  choice: 直译身体部位，不加解释
  alternative: 意译为“愤怒和苦毒之中”
  rationale: 原文明确点出ἧπαρ与χολή；意译会引入未经文本明说的古代生理—情绪解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，并保留原文枚举式结构及古代人体意象。“过分装扮”按上下文作语境化处理；全句不加入宗派性解释。
