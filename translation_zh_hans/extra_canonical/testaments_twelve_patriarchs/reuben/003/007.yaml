base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/007.yaml
  text: And over all these, the spirit of sleep is joined, which is error and the eighth of fantasy.
translation:
  language: zh_hans
  text: 在这一切之上，又加上睡眠之灵；它是迷误，也是幻想的第八者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句后半的希腊文表达不甚清楚，较直译可作“它是迷误，也是幻想的第八者”。“第八”究竟指什么，以及“迷误”与“幻想”的属格关系，均不能确定；此句也可能意指睡眠之灵与迷误和幻想有关，或在某种排列中居第八位。
    reason: πλάνης καὶ ὄγδοον φαντασίας 的句法和语义均有歧义。脚注保留这些可能性，同时不将 ὃ ἐστι 的直接系词关系改写为“属于”。
lexical_decisions:
- source_word: Ἐπὶ πᾶσι δὲ τούτοις
  choice: 除此之外
  rationale: 这里的 ἐπὶ πᾶσι… 表示在前述各项之上再加一项；译为“除此之外”符合现代汉语表达，同时保留累加关系。
- source_word: τὸ πνεῦμα τοῦ ὕπνου
  choice: 睡眠之灵
  rationale: 按属格结构直译，保留本段以“灵”分类描述各种作用的表达方式。
- source_word: συνάπτεται
  choice: 与这一切相连
  rationale: 保留该动词“连接、联合”的中被动语义，不把它具体化为原文未明说的因果关系。
- source_word: πλάνης
  choice: 属于迷误
  rationale: πλάνης 是属格；用“属于”反映其形式，也避免依据英文咨询层将它直接等同为“迷误”。
- source_word: ὄγδοον φαντασίας
  choice: 幻想中的第八者
  rationale: 尽量保留“第八”与“幻想”的属格关系及原文的异常表达，不擅自补入“灵”“种类”等解释性名词。
theological_decisions:
- issue: “睡眠之灵”与“迷误、幻想”的关系
  choice: 保留所属关系及“第八者”的含混表述
  alternative: 译作“它是迷误，也是第八种幻想”或“它是迷误与幻想的第八个灵”
  rationale: 希腊文 πλάνης καὶ ὄγδοον φαντασίας 在句法与意义上都不顺畅；直接选定某一种神学或心理分类体系会过度解释，因此正文从形式出发，另以脚注说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“睡眠之灵”保留古代文本的拟人格化分类语言；“幻想中的第八者”略显异质，是为忠实呈现希腊文自身的句法困难，而非将其悄然顺译为确定的分类。
