base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003.yaml
  text: 'And besides all these, there is an eighth spirit, the spirit of sleep, with which are created the trance of nature and the image of death.


    With these spirits are mixed the spirits of error. First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of insatiableness of the belly. Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive. Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood in destruction and jealousy, for shaping words and hiding one’s words from one’s own kin and household. Seventh, a spirit of injustice, with which come thefts and acts of greed, so that it may satisfy the pleasures of his heart. For injustice works together with the other spirits through taking and giving.


    And over all these the spirit of sleep is joined, which is the eighth spirit of error and fantasy. And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.


    And now, my children, love the truth, and it will keep you safe. Hear the words of Reuben your father, as I teach you. Do not pay attention to a woman’s appearance, nor keep company with a married woman, nor pry into the affairs of women.'
translation:
  language: zh_hans
  text: '3:1 除了这一切，还有第八种灵，就是睡眠之灵；本性的恍惚状态和死亡的形象都与它一同被造。


    3:2 迷误的诸灵混杂在这些灵中。3:3 第一是淫乱之灵，存在于本性和感官之中。第二是贪食无厌之灵。3:4 第三是争斗之灵，在肝和胆中。第四是求悦和邪术之灵，使人借着过分的好奇探究而显得美丽。3:5 第五是骄傲之灵，使人自夸、自命不凡。第六是虚假之灵，在毁灭和嫉妒中[a]编造言辞，又向自己的亲族和家人隐瞒自己的话。3:6 第七是不义之灵；偷窃和贪夺与它相伴，为要满足人心中的享乐。不义借着收受和给予，与其余诸灵一同作工。


    3:7 在这一切之上，睡眠之灵又与它们相连；它就是第八种迷误和幻象之灵。3:8 这样，凡年轻人都灭亡了：他的心智昏暗，离开真理，不明白上帝的律法，也不听父辈的劝诫，正如我在年轻时所遭遇的一样。


    3:9 如今，我的孩子们，你们要爱真理，真理必保护你们。你们要听你们父亲流便的话；我正在教导你们。3:10 不要留意女子的容貌，也不要与有夫之妇来往，更不要窥探女人的事情。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在毁灭和嫉妒中”所据的希腊文本有损坏，确切措辞及其与上下文的句法关系都不确定；也可理解为“以毁灭和嫉妒为目的”等。
    reason: 原文以校勘符号标出ἐν ἀπωλείᾳ καὶ ζήλῳ为疑难、讹损文本；正文保留其字面译法，并以脚注说明不确定性。
lexical_decisions:
- source_word: πνεῦμα
  choice: 灵
  rationale: 保留本章反复出现的拟人格力量及其属灵含义；不缩减为单纯的“倾向”或“冲动”。
- source_word: ἔκστασις φύσεως
  choice: 自然的昏沉
  rationale: 此处与睡眠及“死亡的形象”并列，指自然机能失去正常知觉的状态；“昏沉”比音译或“出神”更符合上下文，同时保留其异常状态的意味。
- source_word: τὸ τῆς πορνείας πνεῦμα
  choice: 淫乱之灵
  rationale: πορνεία泛指不合正当界限的性行为；“淫乱”简洁、庄重，也不把范围擅自限于某一种行为。
- source_word: ἀπληστείας γαστρός
  choice: 贪食无厌
  rationale: 直译为“肚腹的不知足”，在现代汉语中以“贪食无厌”自然表达食欲永不满足。
- source_word: ἀρεσκείας καὶ μαγγανείας
  choice: 取悦人和邪术
  rationale: ἀρέσκεια在此有求取悦、炫示自己的意味；μαγγανεία指法术或邪术。译文不把两者合并为单一的虚荣概念。
- source_word: περιεργείας
  choice: 多事经营
  rationale: 兼顾“过分操弄、费心经营”与“多管闲事”的语义，使其与为了显得美丽的目的相连。
- source_word: ὑπερηφανείας
  choice: 骄傲
  rationale: 采用现代汉语中清楚且具有道德分量的常用对应词。
- source_word: ἀδικίας
  choice: 不义
  rationale: 保留道德及宗教语境中的宽广含义，不窄化为法律意义的“不公”。
- source_word: δοσοληψίας
  choice: 收受和给予
  rationale: 按构词及上下文直译双向交易行为；避免擅自解释为贿赂或一般商业。
- source_word: φαντασίας
  choice: 幻象
  rationale: 表达虚幻表象或想象造成的迷惑，与πλάνη“迷误”并列。
- source_word: ὑπάνδρου
  choice: 有夫之妇
  rationale: 准确表达“在丈夫之下、已有丈夫的女子”，并保持劝诫文体的庄重。
theological_decisions:
- issue: “灵”是人格化属灵存在还是人的内在倾向
  choice: 全章统一译作“……之灵”，不进一步界定其本体性质
  alternative: 译作“欲念”“倾向”或明确称为“邪灵”
  rationale: 希腊文反复使用πνεῦμα并以混合、相连、作工等方式描述，却没有在本段明确说明其本体；保留这种张力，避免预先作教派性解释。
- issue: 真理如何“保护”听者
  choice: 保留“真理必保护你们”的人格化表达
  alternative: 解释为“持守真理会使你们免于犯罪”
  rationale: 原文以αὕτη指回“真理”并以其为φυλάξει的主语；直保原有修辞，不补入特定救恩机制。
- issue: 上帝律法与祖辈劝诫的关系
  choice: 并列翻译，不将两者等同
  alternative: 把祖辈劝诫解释为上帝律法的传递形式
  rationale: 原文分别使用“明白”和“听从”连接两个对象，译文维持其区别。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留章节号及七种迷误之灵的递进结构；身体部位、伦理劝诫和拟人格化表达均尽量贴近希腊文。对明显讹损处加脚注，不用顺畅的意译掩盖文本不确定性。
