  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002.yaml
  text: 'And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance. There were given, then, seven spirits set against man, and these are the heads of the works of youthfulness[b].


    And seven other spirits were given to him at creation, so that every work of man might be in them. The first is the spirit of life, by which a person’s constitution is formed. The second is the spirit of sight, by which desire comes to be. The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are produced for the drawing in of air and breath[c]. The fifth is the spirit of speech, by which knowledge comes to be. The sixth is the spirit of taste, by which the eating of foods and drinks comes to be, and strength is formed by it, because in foods is the basis of strength. The seventh is the spirit of procreation and intercourse, by which sins come together through the love of pleasure. Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the young man like a blind man into a pit, and like an animal over a cliff.'
translation:
  language: zh_hans
  text: '现在，我的孩子们，请听我讲：我悔改时所看见的那七个迷惑人的灵[a]。有七个灵被赐下，与人作对；它们是年轻人种种行为的源头[b]。


    另有七个灵在人受造时赐给了他，使人的一切活动都在这些灵里面。第一个是生命之灵，人的形体借着它构成。第二个是视觉之灵，欲望借着它产生。第三个是听觉之灵，教导借着它而来。第四个是嗅觉之灵，借着它产生各种滋味，用以吸入空气和呼吸[c]。第五个是言语之灵，知识借着它而来。第六个是味觉之灵，借着它，人得以吃喝；力量也由它形成，因为食物是力量的根基。第七个是生育和交合之灵，罪因贪爱享乐而借着它聚集。因此，这灵在受造的次序中居末，在青春时期却居首，因为它充满无知；它带领年轻人，如同把瞎子引进坑里，又如同把牲畜赶下悬崖。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使人陷入错误的灵”或“使人受迷惑的灵”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“年轻行为的头”，可能指年轻人所犯种种罪的主要源头或支配性开端。
    reason: lexical_alternative
  - marker: c
    text: 此处把嗅觉、各种滋味和吸入空气联系起来，希腊文含义艰涩，可能是措辞高度压缩，或文本流传不稳定所致。
    reason: textual_variant
lexical_decisions:
- source_word: πνευμάτων τῆς πλάνης
  choice: 迷惑人的灵
  rationale: πλάνη可指迷失、错误或迷惑；此处这些灵使年轻人走向罪与毁灭，译作“迷惑人的灵”既保留误导作用，也符合现代汉语。
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: 我悔改时
  rationale: 上下文是流便对自身罪行的忏悔与反省；用“悔改”保留其道德和宗教分量，“……时”则自然表达所见发生的情境。
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: 与人作对
  rationale: κατά加属格表示敌对；“与人作对”清楚表达这些灵敌对人的取向，同时保留单数泛指。
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: 年轻人种种行为的源头
  rationale: κεφαλαί字面为“头”，在此可指主要源头或支配性开端；νεωτερισμός在劝诫语境中指青春期的冲动和行为。正文采用自然表达，脚注保留原有比喻。
- source_word: ἐπὶ τῆς κτίσεως
  choice: 在人受造时
  rationale: 短语表示赐下这些灵的时间或处境；结合αὐτῷ的单数人称，明确为“在人受造时”，避免被误解为宇宙整体受造。
- source_word: σύστασις
  choice: 形体
  rationale: 此处指人的构成或身体组织；“形体”通顺且不引入现代医学意义过强的“体质”。
- source_word: ὁράσεως
  choice: 视觉
  rationale: 与听觉、嗅觉、味觉并列时，“视觉”准确而自然，不会产生启示性“异象”的联想。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 该词本身可中性也可负面；“欲望”保留广度，不预先缩窄为性欲。
- source_word: διδασκαλία
  choice: 教导
  rationale: 听觉使人领受教导；“教导”兼顾所传内容与受教过程，适合此处简洁的能力清单。
- source_word: γίνονται γεύσεις δεδομέναι εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: 产生味觉，用以吸入空气和气息
  rationale: 希腊文语义和文本均较艰涩。译文尽量保留“味觉”“吸入”“空气和气息”之间的原有关系，不擅自改写为现代生理学解释。
- source_word: λαλιᾶς
  choice: 言语
  rationale: 在人的各种能力清单中，“言语”庄重、清楚，并能涵盖说话能力。
- source_word: ὑπόστασις τῆς ἰσχύος
  choice: 力量的根基
  rationale: 在非信经性的劝诫语境中，ὑπόστασις指基础或支撑；“根基”避免误导为后世神学术语“本质/位格”。
- source_word: σπορᾶς καὶ συνουσίας
  choice: 生育和交合
  rationale: σπορά在此指生殖、生育，συνουσία指性交合；译法直接而不粗俗，适合庄重劝诫文体。
- source_word: συνέρχονται διὰ τῆς φιληδονίας ἁμαρτίαι
  choice: 罪因贪爱享乐而借着它聚集
  rationale: 保留συνέρχονται“聚集、汇合”的措辞，不将其释义化为“进入”；φιληδονία译为“贪爱享乐”，体现其负面道德色彩。
theological_decisions:
- issue: 悔改语境中的μετάνοια
  choice: 我悔改时
  alternative: 我改变心意时／在我的悔悟中
  rationale: 此段属于流便因具体罪行而作的忏悔性自述，“悔改”比纯认知性的“改变心意”更符合语境，但不额外加入宗派性的悔改理论。
- issue: 如何处理描述七个受造之灵的括号段落
  choice: 纳入正文
  alternative: 视为后加材料而移入脚注或删去
  rationale: 所给希腊文本包含此段，且其内容构成本章论述的一部分；忠实翻译现有见证，不凭推测删节。
- issue: πνεῦμα在本段中的含义
  choice: 统一译为“灵”
  alternative: 按上下文分别译为“能力”“官能”或“气息”
  rationale: 原文有意以πνεῦμα贯穿敌对之灵和受造时所得的七灵。统一译法保留这种结构与可能的神学张力，不把后七者完全自然化为生理官能。
- issue: 第七个灵与罪的关系
  choice: 罪因贪爱享乐而借着它聚集
  alternative: 这灵本身就是罪恶／罪借它进入
  rationale: 原文说罪借着φιληδονία“聚集”，并未直说生育和交合本身就是罪，也未使用“进入”；译文保持其关系上的含混与劝诫力度。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。能力清单保持平行句式；关键处保留原文“灵”的重复及难解表达，不以现代生理学或特定宗派教义加以消解。
