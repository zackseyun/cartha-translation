base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011.yaml
  text: '1 No longer shall I be called a ravening wolf because of your ravaging[a], but a worker of the Lord, distributing food to those who do what is good.

    2 And in the last times there shall arise from my seed one beloved of the Lord, hearing his voice and doing the good pleasure of his will, enlightening all the nations with new knowledge, entering upon Israel in salvation, and snatching away from them as a wolf, and giving to the gathering of the nations.

    3 Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.

    4 And in holy books he shall be recorded, both his work and his word; and he shall be God''s chosen one forever.

    5 And through him he shall pass through again as Jacob my father, saying[e][d][c][b], “He will fill up what is lacking in your tribe.”'
translation:
  language: zh_hans
  text: '《便雅悯遗训》第11章


    1 因你们的掠夺，我不再被称为贪掠的狼[a]，而是主的工人，把食物分给行善的人。


    2 到末后的时期，必有一位主所爱的人从犹大和利未的后裔中兴起。他口中成就美意，以新的知识照亮万国，成为知识之光；他带着拯救临到以色列[b]，又像狼一样从他们那里夺取，交给万国的聚会[c]。


    3 直到这个时代终结[d]，他必在万国的各聚会中，也在他们的统治者中间，如同众人口中的悦耳曲调。


    4 他必被记载在圣书中；他的作为和言语也必被记载。他必永远作上帝所拣选的人。


    5 他要借着他们来访，如同我父亲雅各，说[e]：“他必补足你支派所欠缺的。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章的希腊文本多处疑难，尤其第2节似有扩写和部分重复。译文依现存希腊文本翻译，并尽量保留其中的不明确之处。
    reason: textual_variant
  - marker: b
    text: “带着拯救临到以色列”也可理解为“以拯救介入以色列”。原文短语的语法关系不明确。
    reason: lexical_alternative
  - marker: c
    text: “万国的聚会”也可译作“万国的会众”。原文没有明说他夺取什么，又把什么交给这个聚会。
    reason: lexical_alternative
  - marker: d
    text: “这个时代终结”也可译作“这个时代的末了”或“这个时代完成之时”。
    reason: lexical_alternative
  - marker: e
    text: 末句晦涩。“借着他们来访”中的“他们”在希腊文中是复数，其所指不明；“来访”也可译作“往来”或“造访”。本句或许表达未来人物使雅各的来访或代表再次出现，但原文不足以确定。
    reason: textual_variant
lexical_decisions:
- source_word: λύκος ἅρπαξ / ἁρπαγάς
  choice: 贪掠的狼／掠夺
  rationale: 保留同根意象的呼应以及狼强行攫取的力量，同时使用现代汉语中自然、庄重的表达。
- source_word: ἐργάτης Κυρίου
  choice: 主的工人
  rationale: 具体保留“劳作之人”的含义，并与前面的掠夺者形象形成反转。
- source_word: διαδιδὼν τροφὴν τοῖς ἐργαζομένοις τὸ ἀγαθόν
  choice: 把食物分给行善的人
  rationale: 忠实表达分发食物的行动，并将“作善事”译成自然的“行善”。
- source_word: ἀγαπητὸς Κυρίου
  choice: 主所爱的人
  rationale: 保留所属关系与受爱含义，不额外赋予固定称号。
- source_word: ἐκ σπέρματος Ἰούδα καὶ Λευί
  choice: 从犹大和利未的后裔中
  rationale: 按所提供的希腊文本直译族源，不以咨询层中的“我的后裔”替代。
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: 他口中成就美意
  rationale: 原文搭配生硬且含义不明；译文尽量保留“美意”“口中”和行动关系，不擅自补入“听见声音”或“他的旨意”。
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη / φῶς γνώσεως
  choice: 以新的知识照亮万国，成为知识之光
  rationale: 保留文本中“新知识”和“知识之光”两个相近表达，避免消除可能的扩写或重复。
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: 带着拯救临到以色列
  rationale: 该短语语法和语义均困难；此译法保留临到或介入的动态及“拯救”，但不明确其确切关系。
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: 像狼一样从他们那里夺取
  rationale: 保留再次出现的狼之比喻，也像原文一样不补明被夺取的宾语。
- source_word: συναγωγῇ τῶν ἐθνῶν / συναγωγαῖς ἐθνῶν
  choice: 万国的聚会／万国的各聚会
  rationale: 表达群体聚集之意，避免直接套用后期教会术语或把它限定为犹太会堂。
- source_word: συντελείας τοῦ αἰῶνος
  choice: 这个时代终结
  rationale: 保留终末性的“完成、终结”以及 αἰών 的时代含义。
- source_word: ὡς μουσικὸν μέλος ἐν στόματι πάντων
  choice: 如同众人口中的悦耳曲调
  rationale: 自然传达音乐旋律的比喻及其广为传唱的画面。
- source_word: δι᾽ αὐτῶν φοιτήσει
  choice: 他要借着他们前来
  rationale: 依希腊文保留复数“他们”；φοιτάω 可指前往、来访或往来，此处采用较中性的“前来”。
- source_word: ἀναπληρώσει τὰ ὑστερήματα τῆς φυλῆς σου
  choice: 补足你支派所欠缺的
  rationale: 保留“补足”与“欠缺”的对应关系，不解释欠缺的具体内容。
theological_decisions:
- issue: 第2节未来人物的族源与身份
  choice: 按现存希腊文译作从犹大和利未的后裔中兴起的“主所爱的人”
  alternative: 从便雅悯的后裔中兴起；或明确称为弥赛亚
  rationale: 所给希腊文本明确出现“犹大和利未的后裔”，但整段有明显文本困难。译文呈现现存见证，不以英译咨询层替换，也不把此人物的身份教义化。
- issue: 第2节对万国及以色列的行动
  choice: 保留照亮万国、临到以色列、夺取并交给万国聚会等彼此张力较强的动作
  alternative: 将这些动作协调为单一的救赎程序，并补明被夺取和交付的对象
  rationale: 原文没有明说所夺取、所交付的对象，且句法疑难；不应借神学推断填补。
- issue: ἔθνη 的范围
  choice: 万国
  alternative: 外邦人
  rationale: “万国”保留较广的民族集合含义，避免预先固定为后期基督教的内外群体分类。
- issue: “上帝所拣选的人”的性质
  choice: 保留称号，但不进一步界定其本体或职分
  alternative: 明确译成某种专属弥赛亚头衔
  rationale: 译文应保存其崇高的末世性描写，而不导入原文未明说的教义结论。
- issue: 第5节来访者及媒介的指称
  choice: 保留“他”与复数“他们”，不明确各代词所指
  alternative: 将“他们”改作单数“他”，并解释为未来人物代表雅各再次来访
  rationale: 希腊文 δι᾽ αὐτῶν 是复数，句子本身晦涩；保留代词张力比推定其先行词更忠实。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话书面语。保留遗训文学的预言语气，并避免过度古雅。对第2、5节的残缺、重复、代词不明及省略宾语不作静默调和；“上帝”用于 Θεός，“主”用于 Κύριος。
