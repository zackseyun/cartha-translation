base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/001.yaml
  text: But you, my children, flee evil — envy and hatred of brothers — and cling to goodness and love.
translation:
  language: zh_hans
  text: 至于你们，我的孩子们，要逃避邪恶、嫉妒和恨弟兄；要紧紧依附于良善和爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδρατε
  choice: 逃避
  rationale: 该词带有迅速远离、躲开的意味；“逃避”既保留其力度，也符合现代汉语劝诫语体。
- source_word: κακίαν
  choice: 邪恶
  rationale: 概括道德上的恶，后文的“嫉妒”和“对弟兄的仇恨”可自然理解为具体说明。
- source_word: φθόνον
  choice: 嫉妒
  rationale: 准确表达因他人的好处而生的妒恨。
- source_word: μισαδελφίαν
  choice: 对弟兄的仇恨
  rationale: 保留复合词中“仇恨”与“弟兄”的双重语义，不将其泛化为一般的人际不和。
- source_word: προσκολλᾶσθε
  choice: 紧紧持守
  rationale: 原词意为依附、紧贴；此处取自然的伦理劝诫表达，同时保留持续而坚定依附的力度。
- source_word: ἀγαθότητι
  choice: 良善
  rationale: 表达善良的品格或道德性质，较“善行”更不限定为具体行为。
- source_word: ἀγάπῃ
  choice: 爱
  rationale: 采用现代汉语中宽广而庄重的对应词，不额外限定其对象或神学类别。
theological_decisions:
- issue: “邪恶”与“嫉妒、对弟兄的仇恨”的句法关系
  choice: 用“就是”将后两项呈现为对“邪恶”的具体说明
  alternative: 将三者并列为“逃避邪恶、嫉妒和对弟兄的仇恨”
  rationale: 希腊文本中宾格结构及校勘标记容许一定张力；上下文最自然地把嫉妒和恨弟兄视为邪恶的具体表现。译文明确这种说明关系，但不增加超出文本的教义解释。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体。“但你们，我的孩子们”保留转折和亲切呼语；分号呈现“逃避”与“持守”两项对照命令。
