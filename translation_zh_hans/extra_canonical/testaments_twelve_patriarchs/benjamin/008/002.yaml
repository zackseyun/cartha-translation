source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ καθαρὸς νοῦς οὐκ ἔχει μιασμὸν ἐπὶ¹⁷ κόπρου¹⁸ καὶ¹⁹ βόρβορον²⁰, Γ*ἀλλὰ μᾶλλον²¹ ἀμφότερα ψύγει²² καὶ ἀπελαύνει τὴν δυσωδίαν⁷, οὕτω καὶ ὁ καθαρὸς²³ νοῦς ἐν τοῖς μιασμοῖς²⁴ τῆς¹⁷ γῆς συνεχόμενος μᾶλλον †οἰκοδομεῖ²⁶, αὐτὸς δὲ οὐ μιαίνεται⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/002.yaml
  text: For the pure mind has no defilement from dung or filth, but rather repels both and drives away the stench; thus also the pure mind, when held among the defilements of the earth, rather †builds up†, and is itself not defiled.
translation:
  language: zh_hans
  text: 因为纯洁的心智不会因粪便和污泥而沾染；反倒使这两样冷却[a]，并驱散恶臭。同样，纯洁的心智即使被困在地上的污秽中，反倒†造就†[b]，自身却不受沾染。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直作“使这两样冷却”；这句话在此语境中的确切含义不明确。有些译法按上下文理解为“排斥这两样”。
    reason: ψύγει 的通常词义为“冷却”，但与本句语境搭配异常；保留字面译法，同时说明语义不确定及英语审计文本所采的语境性理解。
  - marker: b
    text: “造就”所据的希腊词在此处文本存疑，通常意为“建造”或“造就”；原句确切含义不明。
    reason: 底本以匕首号标示 οἰκοδομεῖ 为疑难或可能讹误的文本；不应在正文中无提示地确定其意义。
lexical_decisions:
- source_word: καθαρὸς νοῦς
  choice: 纯洁的心智
  rationale: 既保留 νοῦς 所指的心思、理智与内在取向，也避免只译作“思想”而缩窄含义；两次出现采用相同译法以维持段落呼应。
- source_word: κόπρου καὶ βόρβορον
  choice: 粪土和污泥
  rationale: 直译具体而有力度，保留原文以物质污秽比拟道德污染的形象。
- source_word: ψύγει
  choice: 使……冷却
  rationale: 按现存希腊文本的通常词义翻译，不依照英语咨询文本改作“排斥”，以免掩盖原文措辞的异常。
- source_word: ἀπελαύνει τὴν δυσωδίαν
  choice: 驱散恶臭
  rationale: 自然表达 ἀπελαύνει 的赶走、驱离之意，同时保留嗅觉意象。
- source_word: συνεχόμενος
  choice: 被困在……中
  rationale: 体现被包围、拘束或压迫的被动态势，比单纯“处于”更接近原文力度。
- source_word: μιαίνεται
  choice: 受沾染
  rationale: 与前文“沾染”相呼应，保留礼仪和道德污染两方面的开放性。
theological_decisions:
- issue: 纯洁心智置身世上污秽之中仍不受污染的含义
  choice: 按原文保留为心智在污秽环境中仍不受沾染的陈述
  alternative: 解释为特定的禁欲、礼仪洁净或无罪教义
  rationale: 本节本身没有明确规定其教义体系；不将形象限定为某一宗派或特定伦理方案。
- issue: 存疑动词 οἰκοδομεῖ 的神学指向
  choice: 暂译“造就”并加引号和脚注标明文本存疑
  alternative: 根据上下文改译为“抵抗”“洁净”或“胜过”
  rationale: 现存词形通常意为建造或造就，但上下文衔接困难；保留文本张力，不凭推测确立特定神学意义。
translation_notes:
  register: 采用现代、庄重而通俗的书面普通话。保留“粪土、污泥、恶臭、沾染”等鲜明意象；对两个关键疑难词不作顺畅化改写，而以正文直译配合脚注呈现原文歧义。
