  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/003.yaml
  text: For where there is fear of good works and light in the mind, darkness flees from it.
translation:
  language: zh_hans
  text: 因为，哪里有对善行的敬畏，心思中有光，黑暗便从其处逃走。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其”所指原文并不明确；原文可理解为“他”或“它”，并非明确的地点指代。
    reason: 说明ἀπʼ αὐτοῦ的阳性／中性单数指代歧义，并避免正文将其改释为“那里”。
lexical_decisions:
- source_word: φόβος ἀγαθῶν ἔργων
  choice: 对善行的敬畏
  rationale: φόβος可指恐惧，也可指敬畏；这里与“善行”和“光”并列，译作“敬畏”较符合正面语境，同时保留原文略显不寻常的属格关系。
- source_word: φῶς εἰς διάνοιαν
  choice: 光进入心思
  rationale: 保留εἰς所表达的趋向，不将其弱化为静态的“心思里有光”；“心思”自然传达διάνοια的思想、理解与内在意识范围。
- source_word: ἀποδιδράσκει
  choice: 逃走
  rationale: 该动词表示逃离、逃脱；“逃走”简明地保留黑暗被人格化的形象。
- source_word: ἀπʼ αὐτοῦ
  choice: 从那里
  rationale: αὐτοῦ的具体所指并不完全明确；用“那里”回指前述光与敬畏所在之处，避免武断地限定为某个人或某一抽象名词。
theological_decisions:
- issue: φόβος是否表示害怕行善，还是对善行怀有敬畏
  choice: 对善行的敬畏
  alternative: 对善行的畏惧
  rationale: 上下文把φόβος与光并列，并以黑暗逃离为结果，正面意义更强；但不扩译为“敬畏上帝”，以免加入原文没有明说的对象。
- issue: ἀπʼ αὐτοῦ的指代
  choice: 正文采用不限定具体对象的“从那里”，并以脚注说明
  alternative: 从他身上／从它那里
  rationale: 阳性或中性形式可容许不同理解，而紧邻的διάνοια为阴性，不能仅凭近接关系确定；译文保留这种指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文“哪里有……，……就……”的格言性质，并保留“光进入心思、黑暗逃走”的鲜明对照。
