  text: And if anyone betrays a righteous man, the righteous man prays; and even if for a little while he is brought low, before long he reappears far more radiant, as Joseph my brother became.
translation:
  language: zh_hans
  text: 若有人出卖义人，义人便祷告；即使他暂时被降卑，不久便以更为光彩的样子显现，正如我的兄弟约瑟后来所成为的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προδώσει
  choice: 出卖
  rationale: 表达将人交出、背叛或出卖之意；结合约瑟的经历，“出卖”最贴合语境。
- source_word: δίκαιον / ὁ δίκαιος
  choice: 义人
  rationale: 保留同一希腊词的重复，并以简洁、传统而现代读者易懂的称谓表达道德上的正直。
- source_word: ταπεινωθῇ
  choice: 受屈辱
  rationale: 此处为被动形式，指遭贬抑、被降卑；“受屈辱”既体现外在遭遇，也符合约瑟受害的语境。
- source_word: φαιδρότερος ἀναφαίνεται
  choice: 更加光彩地重新显现
  rationale: φαιδρότερος含更明亮、更光彩之意，ἀναφαίνεται含再次显现之意；译文保留比较级和“重新”这一层含义。
- source_word: οἷος γέγονεν
  choice: 正如……一样
  rationale: 希腊文直译近于“正如……所成为的那样”；中文用此结构自然地保留约瑟作为实例的比较关系。
theological_decisions:
- issue: 义人遭出卖后的祷告及复兴
  choice: 按原文并列陈述义人祷告、暂受屈辱和随后更光彩地显现
  alternative: 补明义人是在为出卖他的人祷告，或说明复兴是神直接施行的奖赏
  rationale: 原文没有明说祷告的对象或复兴的直接施行者，因此不补入特定的伦理或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留原文“义人”的重复和从受辱到重新显现的对照，不增添原文未明说的因果关系。
