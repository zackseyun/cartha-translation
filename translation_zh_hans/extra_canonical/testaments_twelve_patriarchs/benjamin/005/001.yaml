source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: V. Ἐὰν ⸀οὖν καὶ ὑμεῖς¹· ἔχετε² ἀγαθὴν³ ⸀διάνοιαν⁴, καὶ⸃ οἱ πονηροὶ ἄνθρωποι⁵ *εἰρηνεύσουσιν μεθʼ ὑμῶν⁶, καὶ οἱ ἄσωτοι αἰδεσθέντες⁷ ὑμᾶς⁸ ⸀ἐπιστρέψουσιν⁹ εἰς *τὸ ἀγαθόν¹⁰, καὶ οἱ πλεονεκτοῦντες¹¹ οὐ μόνον ἀποστήσονται *τοῦ πάθους¹² ἀλλὰ καὶ *τὰ τῆς¹³ πλεονεξίας *ἃ εἶχον¹⁴ δώσουσιν¹⁵ τοῖς θλιβομένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/001.yaml
  text: If, then, you also have a good mind, even wicked people will be at peace with you, and the profligate, being put to shame by you, will turn to what is good; and those who are greedy will not only turn away from their passion, but will also give to those in distress the things of greed that they had.
translation:
  language: zh_hans
  text: 那么，你们若也存着良善的心，即使恶人也会与你们和睦相处；放荡的人因你们而感到羞愧，就会转向善；贪婪的人不但会离弃欲念，也会把他们所拥有、与贪婪有关的财物分给困苦的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὴν διάνοιαν
  choice: 良善的心
  rationale: διάνοια可指心思、意念或心志；这里与ἀγαθή连用，译作“良善的心”自然易懂，也保留内在道德取向。
- source_word: οἱ πονηροὶ ἄνθρωποι
  choice: 恶人
  rationale: 简洁表达道德意义上的邪恶之人，符合现代汉语经文语体。
- source_word: εἰρηνεύσουσιν μεθʼ ὑμῶν
  choice: 会与你们和睦相处
  rationale: 该动词在此表示与人维持和平关系；“和睦相处”比直译“和平”更合乎汉语表达。
- source_word: οἱ ἄσωτοι
  choice: 放荡的人
  rationale: ἄσωτος可指生活放纵、挥霍无度或败坏的人；“放荡的人”保留其道德与生活方式含义，不窄化为单一罪行。
- source_word: αἰδεσθέντες ὑμᾶς
  choice: 因你们而感到羞愧
  rationale: 将ὑμᾶς理解为引发羞愧的对象或缘由；此译符合上下文中良善榜样使人知耻转变的意思，同时不把动作误解为单纯“尊敬”。
- source_word: ἐπιστρέψουσιν εἰς τὸ ἀγαθόν
  choice: 会转向善
  rationale: 保留ἐπιστρέφω的转向含义；τὸ ἀγαθόν为实体化形容词，可自然译为“善”。
- source_word: οἱ πλεονεκτοῦντες
  choice: 贪婪的人
  rationale: 该词指贪求更多、占取利益的人；“贪婪的人”涵盖其基本语义。
- source_word: ἀποστήσονται τοῦ πάθους
  choice: 会离弃自己的欲念
  rationale: ἀφίστημι表示离开、弃绝；πάθος在此是驱使贪婪行为的强烈欲望。“欲念”避免将其泛化为现代意义的“激情”。
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: 贪婪所得之物
  rationale: 原文直义近于“他们所有的、属于贪婪的那些东西”，语法表达略显压缩；结合给予困苦者的语境，译为“贪婪所得之物”，既通顺又保留这些财物与贪婪的关联。
- source_word: τοῖς θλιβομένοις
  choice: 困苦的人
  rationale: 分词指受压迫、遭患难或处于困境的人；“困苦的人”在此涵盖面适当。
theological_decisions:
- issue: 良善心志与恶人转变之间的关系
  choice: 保留原文未来时的肯定陈述：“会……”
  alternative: 弱化为可能性，如“可能会……”
  rationale: 希腊文连续使用将来时，没有明示仅为概率；译文不额外弱化，也不将其扩展为机械性的普遍因果教义。
- issue: πάθος的道德含义
  choice: 译为“欲念”
  alternative: “激情”或“恶欲”
  rationale: “激情”在现代汉语中常有中性或正面色彩；“恶欲”则加入原文未明说的定性。“欲念”能在贪婪语境中自然呈现负面意味。
- issue: 贪婪之物的来源
  choice: 译为“贪婪所得之物”
  alternative: “他们所有的贪婪之物”
  rationale: 属格τῆς πλεονεξίας的关系存在一定压缩与含混；正文采用语境最自然的所得关系，但不进一步指定偷盗、勒索等具体方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文“若……就……”的劝诫逻辑及三个并列结果；避免古奥表达，也不引入宗派性术语。
