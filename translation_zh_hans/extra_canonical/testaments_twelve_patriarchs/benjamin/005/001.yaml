revisions:
- from: 所以，你们若也存着良善的心，即使恶人也会与你们和睦相处；放荡的人因你们而感到羞愧，就会转向善；贪婪的人不但会离弃自己的欲念，也会把贪婪所得之物分给困苦的人。
  to: 那么，你们若也存着良善的心，即使恶人也会与你们和睦相处；放荡的人因你们而感到羞愧，就会转向善；贪婪的人不但会离弃欲念，也会把他们所拥有、与贪婪有关的财物分给困苦的人。
  rationale: 修订仅处理原文中“贪婪之物”的关系属格及“欲念”的未明示限定，避免把含混的表达解释为明确的非法或贪婪所得；其余措辞保持原译对希腊文语义、并列结构和现代汉语经文语体的良好把握。
