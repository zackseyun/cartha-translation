base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/004.yaml
  text: For if anyone insults a holy man, he repents; for the holy one has mercy on those who revile him and keeps silent.
translation:
  language: zh_hans
  text: 因为，如果有人侮辱敬虔的人，他就会悔改；因为那敬虔的人怜悯辱骂他的人，并保持沉默。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβρίσει
  choice: 侮辱
  rationale: 此处表示以言行凌辱、冒犯；“侮辱”准确承接后文“辱骂”，又不夸大为身体暴力。
- source_word: ἄνδρα ὅσιον / ὁ ὅσιος
  choice: 虔敬的人
  rationale: ὅσιος侧重对神忠诚、敬虔而正直；译作“虔敬的人”既保留宗教伦理色彩，也使前后称谓一致。
- source_word: μετανοεῖ
  choice: 悔改
  rationale: 该词表示心意与行为的转变，在本段伦理语境中“悔改”比单纯“改变主意”更充分。
- source_word: ἐλεεῖ
  choice: 怜悯
  rationale: 保留主动施予慈悲、宽待辱骂者的含义。
- source_word: σιωπᾷ
  choice: 默不作声
  rationale: 自然表达持续不还口、保持沉默之意，且不额外解释沉默的动机。
theological_decisions:
- issue: μετανοεῖ的主语
  choice: 以“他”指侮辱虔敬者的人
  alternative: 理解为受辱的虔敬者悔改
  rationale: 条件句中ὑβρίσει的未明说主语自然延续为μετανοεῖ的主语；后半句再明确以“虔敬的人”为主语，形成受辱者以怜悯和沉默促使冒犯者悔改的对照。
- issue: 虔敬者的沉默是否等于绝对不回应
  choice: 仅译出“默不作声”
  alternative: 解释为不报复、不申辩或始终沉默
  rationale: 原文只陈述σιωπᾷ，不宜加入特定伦理或教义层面的绝对化解释。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“若有人”保留条件句形式；两个“因为”对应原文两次γὰρ，虽略带重复，却保留论证推进和经训文体。
