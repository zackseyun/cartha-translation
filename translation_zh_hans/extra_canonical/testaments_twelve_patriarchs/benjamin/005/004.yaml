- from: 因为，若有人侮辱虔敬的人，他就会悔改；因为虔敬的人怜悯那些辱骂自己的人，并且默不作声。
  to: 因为，如果有人侮辱敬虔的人，他就会悔改；因为那敬虔的人怜悯辱骂他的人，并保持沉默。
  rationale: 仅作安全的汉语行文和指代清晰度调整。“如果”保留ἐὰν的条件性；“就会悔改”在汉语中自然呈现条件行为所引出的结果，未额外规定悔改的具体性质或原因。后句保留原文的怜悯与沉默，未把沉默扩展为不报复、绝不回应等解释。
