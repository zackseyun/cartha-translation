  text: Ἐὰν ἦτε ἀγαθοποιοῦντες καὶ *τὰ ἀκάθαρτα¹⁶ πνεύματα φεύξονται¹⁷ *ἀφʼ ὑμῶν¹⁸, καὶ¹⁹ τὰ θηρία²⁰ *φοβηθήσονται ὑμᾶς²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/002.yaml
  text: If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.
translation:
  language: zh_hans
  text: 如果你们行善，污灵就会从你们那里逃走，野兽也会惧怕你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοποιοῦντες
  choice: 行善
  rationale: 以现代汉语简洁表达持续从事善行之意，符合条件句中的行为状态。
- source_word: τὰ ἀκάθαρτα πνεύματα
  choice: 污灵
  rationale: 保留宗教语境中“灵”的实体含义，并以“污”对应 ἀκάθαρτα，避免扩展为道德或礼仪上的单一解释。
- source_word: φεύξονται ἀφʼ ὑμῶν
  choice: 会从你们那里逃走
  rationale: 直接保留“逃离你们”的方向关系和将来语气。
- source_word: τὰ θηρία
  choice: 野兽
  rationale: 准确表达非驯养、具有威胁性的兽类。
- source_word: φοβηθήσονται ὑμᾶς
  choice: 会惧怕你们
  rationale: 保留宾语“你们”以及将来时所表达的结果。
theological_decisions:
- issue: 污灵与野兽因行善者而退避的陈述性质
  choice: 按原文保留直接的条件—结果关系
  alternative: 弱化为象征意义或一般性的道德影响
  rationale: 原文明确陈述行善与污灵逃离、野兽惧怕之间的关系；译文不应替文本限定其为象征或自然因果。
- issue: καί 是否译为“甚至”
  choice: 译作普通连接词“就……也……”而不加入“甚至”
  alternative: “甚至污灵也会……”
  rationale: 希腊文本所示 καί 可作并列连接；“甚至”虽见于英文咨询层，但会增加强调色彩，原文并非必须如此理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“如果你们行善”自然承接条件句；后半句用平行结构呈现两个结果。未设置脚注，因为本节可在正文中直接、清楚地表达，且无需借注释消解原文张力。
