source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἕως¹⁹ συντελείας *τοῦ αἰῶνος²⁰ ἔσται ἐν συναγωγαῖς²¹ ἐθνῶν καὶ ἐν τοῖς ἄρχουσιν αὐτῶν, ὡς μουσικὸν μέλος ἐν στόματι πάντων²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/003.yaml
  text: Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.
translation:
  language: zh_hans
  text: 直到这时代终结，他必在列国的会众和他们的统治者当中，如同在众人嘴里的一支乐曲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως συντελείας τοῦ αἰῶνος
  choice: 直到这世代终结
  rationale: 保留时间终点与整体完成之意；“世代”可承载 αἰών 的时代性含义，而不把它直接解释为物质世界。
- source_word: συναγωγαῖς ἐθνῶν
  choice: 列国的会众中
  rationale: συναγωγή 在此泛指聚集或会众，不必限定为犹太会堂；ἔθνη 译作“列国”，保持古代民族群体的语感。
- source_word: ἐν τοῖς ἄρχουσιν αὐτῶν
  choice: 也在他们的统治者中
  rationale: ἄρχοντες 指掌权者或统治者；“他们”回指列国。
- source_word: ὡς μουσικὸν μέλος ἐν στόματι πάντων
  choice: 如同众人口中的一段乐曲
  rationale: μέλος 指曲调、乐曲或歌调；直译其口传传唱的比喻，同时保留原文未明说赞誉或讥讽的含混性。
theological_decisions:
- issue: τοῦ αἰῶνος 的末世含义
  choice: 这世代终结
  alternative: 世界的终结／时代的终结
  rationale: “这世代”较贴近 αἰών 所指的时代秩序，又避免将其明确化为宇宙毁灭；原文的末世张力仍予保留。
- issue: “他”在列国中存在的方式
  choice: 按原文译为“他必在……中”，不补充“被传扬”或“被歌颂”
  alternative: 他的名声必传遍列国
  rationale: 原句用 ἔσται 表述，并以乐曲作比，没有明说是名声、教训或人格影响，因此不作神学性补足。
translation_notes:
  register: 采用庄重而自然的现代书面汉语。句式尽量贴合希腊文的时间状语、并列地点和末尾明喻；不使用宗派性术语，也不消解“众人口中的乐曲”可能包含的多重意味。
