- from: 直到这世代终结，他必在列国的会众中，也在他们的统治者中，如同众人口中的一段乐曲。
  to: 直到这时代终结，他必在列国的会众和他们的统治者当中，如同在众人嘴里的一支乐曲。
  rationale: 修订仅处理“世代”的现代歧义和地点短语的汉语自然度；不补足“他”是被传扬、称颂或嘲讽等原文未明示的含义，并保留乐曲比喻的含混性。
