source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀναστήσεται ἐν ὑστέροις] ἀγαπητὸς Κυρίου [ἐκ σπέρματος Ἰούδα καὶ Λευί]⁶ ποιῶν εὐδοκίαν *ἐν στόματι αὐτοῦ⁷, [γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη]⁸ *φῶς γνώσεως¹⁴, ἐπεμβαίνων¹⁵ *τὸν Ἰσραὴλ¹⁶ ἐν σωτηρίᾳ, καὶ ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν¹⁷, καὶ *διδοὺς τῇ συναγωγῇ τῶν ἐθνῶν¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/002.yaml
  text: And in the last times a beloved one of the Lord shall arise [from the seed of Judah and Levi], doing good pleasure with his mouth, [enlightening all the nations with new knowledge], a light of knowledge, coming upon Israel in salvation, and snatching from them like a wolf, and giving to the assembly of the nations.
translation:
  language: zh_hans
  text: 在末后的时期，主所爱的人必兴起，[a][出自犹大和利未的后裔]；[b]他以口施行美意，[以新的知识光照万国]，[c]是知识之光；他在救恩中临到以色列，如狼一般从他们那里夺取，并赐给万国的会众。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在末后的时期”对应希腊文中一个带编辑界标的短语；现存文本的衔接并不完全平整。
    reason: 说明底本文本的编辑标记及句法状态。
  - marker: b
    text: “出自犹大和利未的后裔”在所据希腊文版本中置于方括号内，表示其文本传承或复原存在疑问。
    reason: 保留并解释来源文本的方括号。
  - marker: c
    text: “以新的知识光照万国”在所据希腊文版本中置于方括号内。
    reason: 保留并解释来源文本的方括号。
  - marker: d
    text: 原文没有说明“夺取”和“赐给”的具体对象；“他们”最自然地承接前面的“以色列”，但句意仍有含混之处。
    reason: 提示原文有意或因传本而形成的宾语省略，防止译文过度确定。
lexical_decisions:
- source_word: ἐν ὑστέροις
  choice: 在末后的时期
  rationale: 保留末世性时间表达，同时采用自然、庄重的现代汉语。
- source_word: ἀγαπητὸς Κυρίου
  choice: 主所爱的人
  rationale: 按属格关系直译，不进一步认定其具体身份。
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: 他口中成就美意
  rationale: 保留原文不寻常的“在他口中”意象；εὐδοκία可指美意、喜悦或悦纳，此处不擅自补出对象。
- source_word: φῶς γνώσεως
  choice: 作知识之光
  rationale: 保留名词性表述及其可能的同位语功能。
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: 他带着救恩临到以色列
  rationale: ἐπεμβαίνω在此结构罕见；译文表达向以色列而来的动作，并保留“在/带着救恩”的语义，避免过度解释为单纯“给以色列带来救恩”。
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: 如狼一般从他们那里夺取
  rationale: 原文未明说所夺取的宾语，中文亦不补出，以保存歧义。
- source_word: τῇ συναγωγῇ τῶν ἐθνῶν
  choice: 万国的会众
  rationale: συναγωγή在此取一般性的聚集群体之义，不使用可能预设特定宗教制度的称谓。
theological_decisions:
- issue: “主所爱的人”的身份
  choice: 不指明其为弥赛亚或其他特定人物
  alternative: 直译为“主的爱子”或明确称为弥赛亚
  rationale: ἀγαπητός本身可作“蒙爱者/所爱的人”，原句没有明说身份，宜保留开放性。
- issue: “从他们那里夺取”的对象及其与“赐给”的关系
  choice: 两处都不补明宾语
  alternative: 补作“夺取羊群/百姓，并把他们赐给万国的会众”
  rationale: 希腊文省略宾语，补出具体对象会消解原文的语法与神学张力。
- issue: “犹大和利未的后裔”及“以新的知识……”的文本地位
  choice: 正文保留方括号并加注
  alternative: 无标记纳入正文或直接删去
  rationale: 所据版本明确以方括号标示这些文字；译文应让读者看到其文本状态。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“美意”“救恩”“会众”等词保留宗教文献语域，但避免古奥句法。方括号照底本保留，脚注仅解释文本状态与真实歧义，不替读者作教派性判断。
