  text: Καὶ²⁵ δι᾽ *αὐτῶν φοιτήσει ὡς²⁶ Ἰακὼβ²⁷ ὁ πατήρ μου, λέγων· Αὐτὸς ἀναπληρώσει τὰ ὑστερήματα τῆς *φυλῆς σου²⁸].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/005.yaml
  text: And through them he will visit as Jacob my father, saying, “He will fill up what is lacking in your tribe.”
translation:
  language: zh_hans
  text: 他要借着他们来临，正如我父亲雅各所说：“他要补足你支派所欠缺的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ αὐτῶν
  choice: 借着他们
  rationale: 保留介词短语的工具或媒介意味，并按复数代词译为“他们”；其具体所指须由上文确定。
- source_word: φοιτήσει
  choice: 来临
  rationale: φοιτάω可指前来、往来或造访；此处采用自然而庄重的“来临”，不额外加入“再次”或明确的探访对象。
- source_word: ἀναπληρώσει
  choice: 补足
  rationale: 准确表达填补不足、使之完足的含义。
- source_word: τὰ ὑστερήματα
  choice: 所欠缺的
  rationale: 用名词化结构表达复数概念，既自然又保留未明确说明欠缺何物的开放性。
- source_word: φυλῆς
  choice: 支派
  rationale: 在以色列家族与支派语境中，φυλή通常指“支派”，较“族”更准确。
theological_decisions:
- issue: λέγων的主语及引语归属
  choice: 译作“正如我父亲雅各所说”，将λέγων理解为雅各说出后面的引语
  alternative: “他要借着他们来临，像我父亲雅各一样，说……”
  rationale: 希腊语分词λέγων在形式上可能与句中阳性单数主语相连，但语序也允许把雅各理解为引语的说话者；英文审校层采用后者。中文以“正如……所说”清楚呈现该理解，同时不扩展引语内容。
- issue: 两个“他”的身份
  choice: 均保留为“他”，不指明具体人物
  alternative: 按上下文补出某一弥赛亚、先祖或其他人物的称谓
  rationale: 本节本身没有明说所指，补名会消除原文的指代开放性并引入解释。
- issue: δι᾽ αὐτῶν的指代
  choice: 保留“他们”
  alternative: 根据上文将其具体化为某一群体
  rationale: 当前所给经文没有提供先行词，不宜在本节中擅自确定。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“来临”比“经过”更符合此处φοιτήσει可能表示前来或造访的语义，也避免英文旧稿中无来源的“再次”。全句保留代词和“欠缺之物”的含混性。
