source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐν βίβλοις ἁγίαις ἔσται ἀναγραφόμενος, καὶ τὸ ἔργον καὶ ὁ λόγος αὐτοῦ· καὶ ἔσται ἐκλεκτὸς Θεοῦ²³ *ἕως τοῦ²⁴ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/004.yaml
  text: And in holy books he shall be recorded, both his work and his word; and he shall be God's chosen one forever.
translation:
  language: zh_hans
  text: 他必被记载在圣书中，他的作为和他的话语也必被记载；他必永远作上帝所拣选的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν βίβλοις ἁγίαις
  choice: 在圣书中
  rationale: 保留复数βίβλοις所指的多卷圣书，并用现代汉语中自然、庄重的表达。
- source_word: ἀναγραφόμενος
  choice: 被记载
  rationale: 准确表达正式写下、载入记录之意，同时保留被动语态。
- source_word: τὸ ἔργον καὶ ὁ λόγος αὐτοῦ
  choice: 他的作为和他的话语
  rationale: ἔργον与λόγος均为单数集合性用法；“作为”与“话语”兼顾原文形式和自然中文。
- source_word: ἐκλεκτὸς Θεοῦ
  choice: 上帝所拣选的人
  rationale: 表达属格关系和ἐκλεκτός的被拣选含义，避免直接名词化造成生硬或引入额外头衔色彩。
- source_word: ἕως τοῦ αἰῶνος
  choice: 永远
  rationale: 按此固定时间表达的通常语义译出持续至永远之意。
theological_decisions:
- issue: ἐκλεκτὸς Θεοῦ是否作为专门的弥赛亚称号处理
  choice: 译为“上帝所拣选的人”
  alternative: “上帝的选民”或“上帝的选者”
  rationale: 原文可具有称号意味，但未要求在中文中固定为某一教义术语；当前译法保留其神学分量而不额外限定身份。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“他必被记载……也必被记载”略作重复，以清楚呈现原文中人物及其作为、话语都进入圣书记录的结构。
