source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: XI. Καὶ οὐκέτι κληθήσομαι λύκος ἅρπαξ διὰ τὰς ἁρπαγὰς ὑμῶν ἀλλὰ [ἐργάτης Κυρίου διαδιδὼν τροφὴν τοῖς ἐργαζομένοις τὸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/001.yaml
  text: No longer shall I be called a ravening wolf because of your acts of plunder, but [a worker of the Lord, distributing food to those who do what is good].
translation:
  language: zh_hans
  text: 我不再因你们的抢掠行为而被称为凶残的狼，而要被称为[主的工人，把食物分给行善的人]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本在“主的工人”之前有方括号起始标记，表明从这里到句末的文字可能存在文本疑问或被视为后加内容；本译文据此保留方括号。
    reason: 说明底本对后半句所作的文本批判标记。
lexical_decisions:
- source_word: λύκος ἅρπαξ
  choice: 凶残的狼
  rationale: ἅρπαξ指掠夺、攫取，可形容凶猛掠食；“凶残的狼”自然保留其掠夺性意象。
- source_word: διὰ τὰς ἁρπαγὰς ὑμῶν
  choice: 因你们的抢掠行为
  rationale: 明确表达复数名词ἁρπαγάς所指的抢夺行径，并保留第二人称复数。
- source_word: ἐργάτης Κυρίου
  choice: 主的工人
  rationale: 直译ἐργάτης，保留服事或受主差遣做工的意象，不额外限定其身份。
- source_word: διαδιδὼν τροφὴν
  choice: 把食物分给
  rationale: διαδίδωμι表示分发、分给；采用现代汉语中清楚自然的表达。
- source_word: τοῖς ἐργαζομένοις τὸ ἀγαθόν
  choice: 行善的人
  rationale: 按“实行善事的人”理解该结构；“行善的人”简洁自然，同时保留善行的含义。
theological_decisions:
- issue: 后半句的文本状态
  choice: 以方括号保留“主的工人……”整段
  alternative: 不加方括号，将其视为无文本疑问的正文
  rationale: 所给希腊版本以左方括号标示该段，英审校层亦将整段括起；译文保留这一文本批判信息，并用脚注说明。
- issue: 称谓变化的时态关系
  choice: “不再……而要被称为……”
  alternative: “不再……而是……”
  rationale: 希腊文前项为将来被动κληθήσομαι；中文补出后项承接的称谓变化，使句意完整，但不引入额外神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凶残的狼”保留传统动物意象，“抢掠行为”准确表达其原因；方括号属于底本文本标记，脚注标记[a]置于正文中。
