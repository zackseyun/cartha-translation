  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010.yaml
  text: '1[a]. Now when Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, exactly as his whole appearance was.


    2. And after saying these things he said to them, “Know then, my children, that I am dying. 3[b]. Therefore do truth, each one toward his neighbor, and keep the law of the Lord and his commandments. 4. For these things I leave you instead of every inheritance. And you also give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did. 5. For they gave all these things to us as an inheritance, saying, ‘Keep the commandments of God until the time when you will see Enoch and Seth and Abraham and Isaac and Jacob risen up at his right hand in rejoicing.’


    6. Then we also will rise, each with our scepter, and we will worship the King of the heavens. 7. [the one who appeared on earth in the form of a man in humility; and all who believe in him on the earth will rejoice with him.]


    8. And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first for their unrighteousness [because when God came to them in flesh, they did not believe him]. 9. And then he will judge all the nations [which did not believe him when he appeared on earth]. 10. And through the chosen ones from among the nations he will convict Israel, just as he convicted Esau through the Midianites, who deceived their brothers into becoming, through sexual immorality and idolatry, estranged from God, and so they became children in the portion of those who fear the Lord.


    11. You therefore, my children, if you walk in holiness in the commandments of the Lord, you will dwell again with confidence in me[d][c], and all Israel will be gathered to the Lord.'
translation:
  language: zh_hans
  text: '《便雅悯遗训》第10章


    1[a] 约瑟在埃及的时候，我渴望看见他的容貌和面容的样式。借着我父亲雅各的祷告，我在白天清醒时看见了他；他完整的容貌，正如本来的样子。


    2 他说完这些话，又对他们说：“我的孩子们，你们要知道，我快要死了。3 所以，你们各人都要以真诚待邻舍[b]，并且要遵守主的律法和他的诫命。4 因为我把这些留给你们，代替一切产业。你们也要把这些传给自己的儿女，作为永远的产业；亚伯拉罕、以撒和雅各也是这样做的。5 他们把这一切都当作产业传给我们，说：‘你们要遵守上帝的诫命，直到[主向万国显明他的救恩]的时候。


    6 “那时，你们将看见以诺、塞特、亚伯拉罕、以撒和雅各欢然复起，站在他的右边。7 那时，我们也将复起，各人带着自己的权杖[c]，敬拜诸天之王——[就是那位曾以人的形态、卑微地显现在地上的王；凡在地上信他的人，都要与他一同欢喜。][a]


    8 “所有的人都要复起：有些人得荣耀，有些人受羞辱。主必先因以色列人的不义审判他们，[因为上帝以肉身来到时，他们没有信他]。9 随后，他要审判万国，[就是那些不信那位显现在地上者的民族]。[a] 10 他要借着万国中蒙拣选的人责备以色列，正如他曾在那些欺骗其弟兄的米甸人的事上责备以扫一样。[使他们因淫乱和拜偶像而与上帝隔绝][a]；于是，他们成了敬畏主之人所得分中的儿女。


    11 “所以，我的孩子们，如果你们在圣洁中遵行主的诫命，就必再次怀着盼望与我同住[d]；全以色列也必被聚集到主那里。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章方括号内的若干语句，尤其第7—9节关于上帝以肉身显现以及人信他的表述，常被认为是后期基督徒增添的内容。所据希腊文本也以方括号标出第5、7—10节的相关片段，因此本译本保留并如实标示。
    reason: textual_variant
  - marker: b
    text: “以真诚待”直译为“行真实”或“实行真理”；原文是具体的伦理惯用语。
    reason: lexical_alternative
  - marker: c
    text: “各人带着自己的权杖”所译的希腊短语在文本和意义上都较困难，也可较直译为“各人在我们的权杖之上”；它或许暗示复起后恢复的尊荣或支派权柄。
    reason: cultural_note
  - marker: d
    text: “怀着盼望与我同住”所译的原文较直译为“在盼望中，在我里面”；这里“在我里面”也可能表达“与我同在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδέα / μόρφωσις / ὄψις
  choice: 容貌／形态／面容
  rationale: 保留原文近义词叠用所形成的视觉强调，同时避免在现代汉语中机械重复同一个词。
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: 在白天清醒时
  rationale: 突出这不是睡梦中的经历，却不擅自把它定性为某种技术意义上的异象。
- source_word: ποιήσατε ... ἀλήθειαν
  choice: 以真诚待
  rationale: 原文直译近于“行真实”；中文采用具体的伦理表达，脚注保留较直译的选择。
- source_word: νόμος ... ἐντολαί
  choice: 律法……诫命
  rationale: 采用稳定、易识别的盟约伦理用语，并保留两个希腊词的区别。
- source_word: ἀντὶ πάσης κληρονομίας
  choice: 代替一切产业
  rationale: 保留ἀντί的替代和对比意味：伦理教诲就是便雅悯所留下的真正遗产。
- source_word: κατάσχεσιν αἰώνιον
  choice: 永远的产业
  rationale: 表达代代持守、永久拥有之物，符合遗训语境。
- source_word: ἀνασταμένους ἐκ δεξιῶν αὐτοῦ
  choice: 复起，站在他的右边
  rationale: “复起”保留复活语境，“他的”不补明所指，以保存原文代词的含混。
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: 各人带着自己的权杖
  rationale: 这是文本上困难的短语；正文采用可读但不过度阐释的表达，并以脚注提示其不确定性。
- source_word: βασιλέα τῶν οὐρανῶν
  choice: 诸天之王
  rationale: 保留希腊文“诸天”的复数和启示文学的庄严语域。
- source_word: ἀτιμία
  choice: 羞辱
  rationale: 与“荣耀”形成清楚对照，适合复起与审判的上下文。
- source_word: ἐπʼ ἐλπίδι ἐν ἐμοί
  choice: 怀着笃定的盼望与我同住
  rationale: 兼顾ἐλπίς的“盼望”和语境中的安稳确信；脚注说明原文结构较为生硬且存在解释空间。
theological_decisions:
- issue: 方括号内疑为后加的基督教化材料
  choice: 在正文中翻译并保留方括号，同时用脚注说明文本问题
  alternative: 完全删去这些语句，或不加标记地视为原章固有内容
  rationale: 所给希腊见证包含这些语句，因此不应静默删除；但编辑方括号及其明确的道成肉身与信仰措辞要求透明呈现其可能的次生性质。
- issue: 第6节“他的右边”所指为何
  choice: 保留代词“他的”
  alternative: 明确译作“上帝的右边”或“主的右边”
  rationale: 希腊文没有在此重新明说先行词，补出特定身份会消除原文的含混。
- issue: 复起与审判的范围
  choice: 译为所有人的复起，并有荣耀与羞辱两种结局，审判先临到以色列而后临到万国
  alternative: 将复起纯粹解释为民族复兴，或把范围限于以色列
  rationale: ἀναστήσονται等词反复出现，并与荣耀、羞辱以及对以色列和万国的审判相连，最自然地构成末世性的普遍复起图景。
- issue: 第7节权杖意象
  choice: 译为“各人带着自己的权杖”，但不说明其确切象征
  alternative: 解释成各支派、各自的宝座或复兴后的王权
  rationale: ἐπὶ σκήπτρον ἡμῶν本身困难，解释性过强的译法会制造原文没有的确定性。
- issue: 第10节米甸人、以扫及“他们”的句法关系
  choice: 维持原文人物转换及复数代词的部分含混
  alternative: 明确指定每个“他们”是米甸人、弟兄或以色列人
  rationale: 该句希腊文本身句法和指代不稳，强行消歧会把推测写入正文。
translation_notes:
  register: 采用现代标准书面汉语，保持遗训和启示文学的庄严感，但避免古奥文言。正文按所给希腊节次重建，未沿用英文咨询层将第5—6节合并的处理；同时保留希腊见证中的方括号、代词含混和困难句法。
