  revised_text: '《便雅悯遗训》第10章


    1[a] 约瑟在埃及的时候，我渴望看见他的容貌和面容的样式。借着我父亲雅各的祷告，我在白天清醒时看见了他；他完整的容貌，正如本来的样子。


    2 他说完这些话，又对他们说：“我的孩子们，你们要知道，我快要死了。3 所以，你们各人都要以真诚待邻舍[b]，并且要遵守主的律法和他的诫命。4 因为我把这些留给你们，代替一切产业。你们也要把这些传给自己的儿女，作为永远的产业；亚伯拉罕、以撒和雅各也是这样做的。5 他们把这一切都当作产业传给我们，说：‘你们要遵守上帝的诫命，直到[主向万国显明他的救恩]的时候。


    6 “那时，你们将看见以诺、塞特、亚伯拉罕、以撒和雅各欢然复起，站在他的右边。7 那时，我们也将复起，各人带着自己的权杖[c]，敬拜诸天之王——[就是那位曾以人的形态、卑微地显现在地上的王；凡在地上信他的人，都要与他一同欢喜。][a]


    8 “所有的人都要复起：有些人得荣耀，有些人受羞辱。主必先因以色列人的不义审判他们，[因为上帝以肉身来到时，他们没有信他]。9 随后，他要审判万国，[就是那些不信那位显现在地上者的民族]。[a] 10 他要借着万国中蒙拣选的人责备以色列，正如他曾在那些欺骗其弟兄的米甸人的事上责备以扫一样。[使他们因淫乱和拜偶像而与上帝隔绝][a]；于是，他们成了敬畏主之人所得分中的儿女。


    11 “所以，我的孩子们，如果你们在圣洁中遵行主的诫命，就必再次怀着盼望与我同住[d]；全以色列也必被聚集到主那里。”'
