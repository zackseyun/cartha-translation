  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar’s deceit[a], for the angel of peace guides his soul. He does not look with passion on perishable things, nor does he gather wealth for pleasure. He does not delight in pleasure, nor grieve his neighbor; he is not filled with luxury, nor led astray by the wanderings of the eyes. For the Lord is his portion. A good purpose does not accept the glory or the dishonor that comes from men, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him and gives light to his soul, and he rejoices toward all people at all times. The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, of poverty and wealth; rather, it has one sincere and pure disposition toward all. It does not have double sight or hearing; for in everything that it does, or speaks, or sees, it knows that the Lord is looking on his soul. And it cleanses
    the mind, so as not to be condemned by men and by God. But the disposition of Beliar is twofold, and it has no singleness. Flee, therefore, evil-mindedness, my children, and love the good mind, which the law of God knows, so that you may rest in hope, because the good-minded man does not have a darkened eye. He shows mercy to all, even if they are sinners; even if they devise evil against him, by doing good he overcomes evil, being shielded by what is good. And he loves the righteous as his own soul. If anyone is glorified, he does not envy him; if anyone is enriched, he is not jealous; if anyone is valiant, he praises him; the virtuous man he commends; on the poor man he has mercy; with the weak he has compassion; to God he sings praise[d][c][b]. The one who has the grace of a good spirit he loves as his own soul.
translation:
  language: zh_hans
  text: '《便雅悯遗训》第6章


    1 善人的定意[a]不受比利亚尔那迷惑之灵[b]的掌控，因为和平的天使引导他的心灵。2 他不带着贪欲注视必朽坏的事物，也不为享乐积聚财富。3 他不以享乐为乐，不使邻舍忧伤；他不沉溺于奢华，也不因眼目的游移而受迷惑，因为主是他的分。


    4 善人的定意不接受从人而来的荣耀或羞辱，也不知任何诡诈、虚假、争斗或辱骂。因为主住在他里面，照亮他的心灵；他无论何时都为众人欢喜。5 善良的心思没有两条舌头：既祝福又咒诅，既侮辱又尊敬，既安静又扰乱，既虚伪又真实，既贫穷又富足；相反，它对众人只有一种真诚纯洁的态度。


    6 他看和听都不怀二心[c]；因为他无论做什么、说什么或看什么，都知道主鉴察他的心灵。7 他也洁净自己的心思，免得被人定罪，也同样免得被神定罪。比利亚尔的作为也同样是双重的，其中毫无单纯专一。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定意”也可译作“意向”“决意”或“谋定的心志”（διαβούλιον）。
    reason: 保留该词在筹划、意图与坚定决断之间的语义幅度。
  - marker: b
    text: “比利亚尔”依本希腊文本的名称形式音译；这个名字也常按另一传统译作“彼列”。
    reason: 说明见证文本的名称形式，避免读者误以为是不同角色。
  - marker: c
    text: 原文直译为“没有双重的看，也没有双重的听”，延续本章以“双重”与“专一”相对的意象。
    reason: 正文采用自然汉语表达，同时让读者能够查见原文的修辞形象。
lexical_decisions:
- source_word: διαβούλιον
  choice: 定意
  rationale: 指人内在而较为确定的道德意向或决断；“定意”兼顾意图与意志，不把它缩窄为外在的“劝告”。
- source_word: πλάνης πνεύματος
  choice: 迷惑之灵
  rationale: πλάνη可指迷误、欺骗或使人偏离正道；此处与比利亚尔相连，译作“迷惑”既保留误导作用，也不将其限定为单纯言语欺诈。
- source_word: Βελίαρ
  choice: 比利亚尔
  rationale: 按本希腊见证的Βελίαρ音译，不直接归一为读者可能更熟悉的“彼列”。
- source_word: ἐμπαθῶς
  choice: 带着贪欲
  rationale: 语境涉及必朽坏之物、财富和享乐，表达受欲望支配的观看；“贪欲”比单纯“热情地”更清楚，又不局限于性欲。
- source_word: τὰ φθαρτά
  choice: 必朽坏的事物
  rationale: 保留物质事物会败坏、消逝的含义，并与“主是他的分”形成对照。
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: 眼目游移
  rationale: 保留眼睛飘忽、被欲望牵引的形象，而不直接释义为某一种具体罪行。
- source_word: μερὶς
  choice: 分
  rationale: 保留经文传统中以主为自己所得之“分”的盟约性表达。
- source_word: δύο γλώσσας
  choice: 两条舌头
  rationale: 保留原文关于两面言语的具体意象，并由后续成对的反义词说明其含义。
- source_word: ὅρασιν οὔτε ἀκοὴν διπλῆν
  choice: 看和听都不怀二心
  rationale: “双重的视觉和听觉”直译在现代汉语中晦涩；此译保留双重性与内在不专一的联系，脚注注明原文意象。
- source_word: ἀπλότητα
  choice: 专一纯正
  rationale: 该词兼有单一、不掺杂、真诚之意；使用并列词语呈现其与“作为是双重的”之间的对照。
theological_decisions:
- issue: 和平天使与主的作用
  choice: 分别保留“和平的天使引导”与“主住在、照亮、鉴察”的陈述
  alternative: 将和平的天使解释为主本人，或加入特定天使论说明
  rationale: 原文既提和平的天使，也提主，却没有明说两者关系；译文不替文本解决这一神学张力。
- issue: 第7节洁净心思的主语
  choice: 译为善人“洁净自己的心思”
  alternative: 译为主洁净他的心思
  rationale: 希腊文καθαίρει的省略主语在衔接上存在一定张力；最近的持续行为主体是善人，而αὐτοῦ也自然理解为“自己的”。译文采用此句法理解，但不扩写洁净的方式。
- issue: 比利亚尔一方的描述对象
  choice: 译为“比利亚尔的作为”
  alternative: 依英语咨询层译为“比利亚尔的性情”
  rationale: 现有希腊原文明确为τὰ ἔργα（作为、行为），因此以原文为先，不采用英语层的抽象化表达。
- issue: 翻译范围
  choice: 止于用户提供的希腊原文第7节末
  alternative: 补入英语咨询层所含的后续劝勉
  rationale: 所给原文证据只到“其中毫无专一纯正”；英语层后续段落在本请求中没有相应原文，不能将其作为不透明底本擅自补译。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。以“定意—善良的心思—态度”区分διαβούλιον、διάνοια、διάθεσις等相近内在概念；保留“主是他的分”“两条舌头”等经文式意象，但在直译会明显晦涩处用脚注补足。段落按希腊原文第1—7节编排。
