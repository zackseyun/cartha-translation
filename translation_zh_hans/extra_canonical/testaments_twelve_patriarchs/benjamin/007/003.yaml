  source_fidelity: 译文保留了Διὰ τοῦτο καί的因果及附加语气、ὑπὸ τοῦ Θεοῦ所明示的施事者，以及“七”和“每一百年一次”的周期结构。原译“每到第一百年”可被理解为某一特定的第一百年，或不够明确地表达周期性分配；改为“每过一百年”更清楚对应κατὰ ἑκατοστὸν ἔτος。
  naturalness: “被上帝交给七次报应”基本可懂，但“交给”与抽象的“报应”搭配略显生硬；“交付给”较适合保留原文的被动交付意象。“降一次灾祸在他身上”的语序亦不够自然，调整为“在他身上降下一场灾祸”更符合现代汉语。
  terminology: “上帝”“主”分别对应Θεός与Κύριος，处理一致。“七次报应”保留原文复数及七个/七次报应的表达，不擅自改作“七倍”或作协调性释义。“一场灾祸”对应μίαν πληγήν，未限定为疾病或其他具体灾害。
