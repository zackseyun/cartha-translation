base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/003.yaml
  text: Because of this also, Cain was handed over by God to seven acts of vengeance. For every hundredth year the Lord brought one plague upon him.
translation:
  language: zh_hans
  text: 正因如此，该隐也被上帝交付给七次报应。因为每过一百年，主就在他身上降下一场灾祸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο καὶ
  choice: 因此……也
  rationale: 保留因果关系以及 καί 的附加语气，与上文衔接。
- source_word: ἑπτὰ ἐκδικίαις
  choice: 七次报应
  rationale: ἐκδίκησις 可指报复、惩罚或报应；此处用“报应”既体现惩治意味，又不过度限定具体形式。
- source_word: παρεδόθη ὑπὸ τοῦ Θεοῦ
  choice: 被上帝交给
  rationale: 保留被动结构及明确施事者“上帝”，不把“交付”弱化为单纯“遭受”。
- source_word: κατὰ ... ἑκατοστὸν ἔτος
  choice: 每到第一百年
  rationale: 按分配用法表达每一百年一次，避免误译成仅在一百年期间内。
- source_word: μίαν πληγὴν ἐπήγαγεν ἐπʼ αὐτόν
  choice: 就降一次灾祸在他身上
  rationale: πληγή 可指击打、灾殃或灾祸；“降……在他身上”保留 ἐπάγω 与 ἐπί 的施加方向。
theological_decisions:
- issue: 该隐所受“七次报应”与创世记传统的关系
  choice: 直译为“七次报应”
  alternative: 解释为“受七倍惩罚”或“遭七重报复”
  rationale: 希腊文为复数 ἑπτὰ ἐκδικίαις，字面指七个/七次报应；不在正文中将其协调为“七倍”，也不补入经文未明说的解释。
- issue: 惩罚的施事者
  choice: 明确译出“被上帝交给”
  alternative: 省略上帝，译作“被交给”或“遭受”
  rationale: ὑπὸ τοῦ Θεοῦ 明确指出上帝是施事者，应予保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“每到第一百年”略带书面色彩，但能较准确表达原文的周期性分配结构；全文不增添“接连”等原文没有的含义。
