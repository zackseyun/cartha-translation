base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/004.yaml
  text: For two hundred years he suffers, and in the nine-hundredth year he was made desolate; for because of Abel his brother he was judged in all evils, but Lamech in seventy times seven. Because to the end of the age, those who become like Cain in envy and hatred of brothers will be punished with similar judgment.
translation:
  language: zh_hans
  text: 他受苦二百年，到第九百年就变得荒凉；因为他的兄弟亚伯，他在各种灾祸中受审判；拉麦则七十乘七[a]。因为直到这时代的终结[b]，凡在嫉妒和恨恶弟兄的事上变得像该隐一样的人，都要受这样的审判而受罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“拉麦”之后省略了谓语；可理解为拉麦“受审判”或“受罚”七十乘七。
    reason: 说明希腊文省略的谓语，不在正文中擅自补足。
  - marker: b
    text: “直到这时代的终结”也可理解为“直到永远”。
    reason: 保留 ἕως τοῦ αἰῶνος 在时间范围上的歧义。
lexical_decisions:
- source_word: πάσχει
  choice: 受苦
  rationale: 保留现在时所表达的持续受苦，不把它窄化为某一种刑罚。
- source_word: ἐρημοῦται
  choice: 荒废了
  rationale: 该被动动词可指变得荒凉、被废弃或遭毁坏；“荒废了”保留其形象，也避免过度确定为死亡或彻底毁灭。
- source_word: ἐν πᾶσι τοῖς κακοῖς
  choice: 在各样灾祸中
  rationale: κακά 可指恶事、祸患或苦难；上下文谈审判，译作“灾祸”较自然，同时保留范围广泛的含义。
- source_word: μισαδελφίᾳ
  choice: 恨恶弟兄
  rationale: 直陈对兄弟的仇恨；“弟兄”既贴近构词，也可涵盖共同体成员。
- source_word: κολασθήσονται κρίσει
  choice: 必以同样的审判受罚
  rationale: 同时呈现 κολάζω 的惩罚含义与 κρίσις 的审判含义，并保留审判作为施罚方式或依据的关系。
theological_decisions:
- issue: 该隐受审判与亚伯之死的关系
  choice: 因为他兄弟亚伯的缘故，他在各样灾祸中受审判
  alternative: 因杀害兄弟亚伯，他被判遭受一切灾祸
  rationale: 原文只说“因亚伯的缘故”，没有在本句明说“杀害”；正文不补入虽可由传统推知、却未明确出现的动作。
- issue: 拉麦所受报应的省略结构
  choice: 拉麦则是七十个七次
  alternative: 拉麦则受罚七十个七次
  rationale: 希腊文在“拉麦”后没有明写动词；保留省略，并用脚注说明可能承接前文的受审判或受罚。
- issue: ἕως τοῦ αἰῶνος 的时间范围
  choice: 直到这世代的终结
  alternative: 直到永远
  rationale: 短语可有不同理解；结合校勘所反映的读法及上下文对历时审判的陈述，正文采用“世代的终结”，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“荒废了”保留古代审判叙述的形象性；“七十个七次”虽略显突兀，但忠实反映原文省略，并由脚注辅助理解。所有脚注标记均已置于正文相应位置。
