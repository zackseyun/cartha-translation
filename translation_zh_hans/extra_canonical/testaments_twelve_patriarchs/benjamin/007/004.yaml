  source_fidelity: 译文总体保留了该隐、拉麦及其后效法该隐者受惩罚的结构，也没有把“因亚伯的缘故”擅自扩写成杀害行为。不过，τοιαύτῃ κρίσει 是“这样的／如此的审判”，并非严格意义的“同样的审判”；“七十个七次”也未能自然、清楚地呈现 ἑβδομηκοντάκις ἑπτά 的“七十乘七”数值表达及原文省略。
  naturalness: “荒废了”用于人物在现代汉语中略显生硬，且“了”将希腊文现在时的叙述性表达过度落实为既成过去。“拉麦则是七十个七次”不合自然汉语。改为“变得荒凉”和“拉麦则七十乘七”可保留原文的突兀省略，同时更清楚自然。
  terminology: “嫉妒”“恨恶弟兄”“受审判／受罚”均适切。“直到这世代的终结”可更直接译为“直到这时代的终结”；脚注保留“直到永远”的可能。
  issues:
