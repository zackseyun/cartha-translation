  to: 他受苦二百年，到第九百年就变得荒凉；因为他的兄弟亚伯，他在各种灾祸中受审判；拉麦则七十乘七[a]。因为直到这时代的终结[b]，凡在嫉妒和恨恶弟兄的事上变得像该隐一样的人，都要受这样的审判而受罚。
