    issue: “同样的审判”将 τοιαύτῃ（这样的、如此的）过度限定为完全相同。
    rationale: 原文是指与前述相类、具有那种性质的审判，不必断言逐项相同。
  - severity: medium
    issue: “七十个七次”不自然，且数值结构不清。
    rationale: ἑβδομηκοντάκις ἑπτά 通常表达“七十乘七”；原文虽省略谓语，但数词本身应清楚呈现。
