source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VII. ΓΔιὰ τοῦτο¹, τέκνα μου, Γλέγω ὑμῖν¹¹, φεύγετε τὴν κακίαν² †Γτοῦ Βελίαρ³ ὅτι μάχαιραν³ δίδωσιν⁴ τοῖς πειθομένοις αὐτόν⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/001.yaml
  text: Therefore, my children, I tell you, flee the evil of Beliar, because he gives a sword to those who obey him.
translation:
  language: zh_hans
  text: 所以，我的孩子们，我告诉你们：要逃避彼列的邪恶，因为他给那些听从他的人一把剑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 所以
  rationale: 承接上文并引出劝诫；用现代汉语自然表达其推论关系。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留父亲向众子女训诫的亲密而庄重的称呼。
- source_word: φεύγετε
  choice: 要逃避
  rationale: 表达持续而明确的命令，语气自然有力。
- source_word: τὴν κακίαν τοῦ Βελίαρ
  choice: 彼列的邪恶
  rationale: 将 κακία 译为概括性的“邪恶”，不擅自具体化为某种罪行；Βελίαρ 按专名音译。
- source_word: μάχαιραν
  choice: 刀剑
  rationale: 该词可指短剑或刀；“刀剑”保留器物类别的宽度，并符合庄重文体。
- source_word: τοῖς πειθομένοις αὐτόν
  choice: 那些听从他的人
  rationale: πειθομένοις 在此表示顺从、听命；“听从”比单纯“相信”更贴合上下文。
theological_decisions:
- issue: “彼列的邪恶”与“彼列这恶者”之间的理解
  choice: 彼列的邪恶
  alternative: 邪恶的彼列／彼列这恶者
  rationale: 现存希腊文本的属格结构最直接修饰 κακία，故保留“彼列的邪恶”，不把抽象名词改译成对彼列本身的定性称号。
- issue: “把刀剑交给”所指的因果性质
  choice: 保留字面陈述，不解释刀剑象征何物
  alternative: 使听从他的人彼此残杀／招致毁灭
  rationale: 原文只说彼列“给”刀剑，可能涉及暴力工具、冲突或毁灭后果；译文不替正文消解这种意象张力。
translation_notes:
  register: 采用现代、清楚而庄重的训诫语体；保留“所以—我告诉你们—要逃避—因为”的论证结构。正文无脚注标记，因为本节无需以脚注处理文本异读或关键歧义。
