source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ δὲ μάχαιρα⁶ ἑπτὰ κακῶν μήτηρ ἐστί. *πρῶτον συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ⁷. †*Καὶ ἔστιν πρῶτον⁸ ὁ †φθόνος⁹, δεύτερον¹⁰ ἡ¹¹ †ἀπώλεια¹², τρίτον ἡ¹¹ θλῖψις, τέταρτον ἡ¹¹ θεηλασία¹³, πέμπτον ἡ¹¹ ἔνδεια, ἕκτον ἡ¹¹ ταραχή, ἕβδομον ἡ¹¹ ἐρήμωσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/002.yaml
  text: 'And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.'
translation:
  language: zh_hans
  text: 刀剑是七种恶事之母。人的心思先借着彼列[a]怀胎；它所生的：第一是嫉妒，第二是毁灭，第三是苦难，第四是被掳，第五是穷乏，第六是混乱，第七是荒凉。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”是古代犹太文献中对邪恶势力或邪恶者的称呼。
    reason: 帮助现代读者理解不熟悉的专名，同时不在正文中将其过度等同于某一特定神学称号。
  - marker: b
    text: 原文在引出七项恶事的连接处有传本和校勘上的疑难；“它所生的”是根据前文“母亲”“怀胎”的意象及上下文所作的最小补足。
    reason: 标示该连接表达并非无争议的逐字原文，同时保留段落的生育隐喻和可读性。
lexical_decisions:
- source_word: μάχαιρα
  choice: 刀剑
  rationale: 在此泛指用于杀伤的兵器，也以转喻表达暴力；“刀剑”既保留古代语境，又符合现代中文经文体。
- source_word: συλλαμβάνει
  choice: 孕育恶念
  rationale: 原词可指“怀孕、受孕”或“构想”；结合随后“七种恶事之母”的生育意象，以“孕育”保留隐喻，补出“恶念”使中文语义完整。
- source_word: διάνοια
  choice: 人的意念
  rationale: 可指心思、思想或理解力；此处是恶事首先形成之处，译作“人的意念”自然且不把它具体化为单一念头。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 保留专名形式，不把它直接解释为“魔鬼”或“邪恶”，以免消除原文的称谓特色与可能的语义张力。
- source_word: φθόνος
  choice: 嫉妒
  rationale: 该词通常指嫉妒、妒忌；“嫉妒”是现代中文最直接自然的对应。
- source_word: ἀπώλεια
  choice: 毁灭
  rationale: 可指毁灭、丧亡或损失；在由刀剑产生的灾祸清单中，“毁灭”涵盖面较广。
- source_word: θλῖψις
  choice: 苦难
  rationale: 可指压迫、患难、困苦；此处清单未限定施事，采用较宽泛的“苦难”。
- source_word: θεηλασία
  choice: 掳掠
  rationale: 该词文本与词义较罕见，语境指战争带来的劫掠或俘掳；“掳掠”兼顾两者，并与刀剑造成的灾祸相称。
- source_word: ἔνδεια
  choice: 穷乏
  rationale: 指缺乏、贫困或匮乏；“穷乏”保持庄重而易懂的经文语体。
- source_word: ταραχή
  choice: 动乱
  rationale: 可指骚乱、混乱或不安；在群体性灾祸清单中，“动乱”较贴切。
- source_word: ἐρήμωσις
  choice: 荒凉
  rationale: 指使之荒废、毁坏后的荒凉状态；译作“荒凉”保留结果性意象。
theological_decisions:
- issue: 彼列与人的意念在恶念形成中的关系
  choice: 人的意念首先因彼列而孕育恶念
  alternative: 彼列首先使人的心思受孕
  rationale: 原文“ἡ διάνοια διὰ τοῦ Βελίαρ”保留人的心思为语法主体，并以“因/借着彼列”表达媒介或影响；译文不进一步界定为强制、附身或完全由外在力量造成。
- issue: 七项恶事与“母亲”隐喻的关系
  choice: 其所生的
  alternative: 以下就是七种恶事
  rationale: 原文传本在连接语处有损坏或校勘不确定性；依据上下文及经审校的咨询层，保留“母亲—孕育—所生”的连贯意象，但不把该补足误作无争议的逐字原文。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。以“刀剑—母亲—孕育—所生”贯穿原段隐喻；七项灾祸使用平行、简洁的序列表达。原文在“首先……其所生的”附近有校勘符号和疑难读法，正文以最少补足恢复可理解的句法，并避免把传本不确定处处理成过度确定的教义陈述。
