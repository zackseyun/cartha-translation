base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/003.yaml
  text: And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly in the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].
translation:
  language: zh_hans
  text: 以色列众子出埃及后的第九十一年，他们和自己的弟兄在迦南的战争中暗中把他们父亲的骸骨运了上来，并把这些骸骨安葬在希伯仑他们父亲的脚旁[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “在他们父亲的脚旁”是希腊文的字面说法，可能指安葬在祖先墓穴附近，并非直接埋在父亲的脚边。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνενηκοστῷ πρώτῳ ἔτει
  choice: 第九十一年
  rationale: 按希腊语序数词直译，清楚表达纪年。
- source_word: τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου
  choice: 以色列众子出埃及后
  rationale: 保留“以色列众子”的原文表达，并以自然汉语呈现以出埃及为起点的纪年关系。
- source_word: ἀνήγαγον τὰ ὀστᾶ
  choice: 运回了……骸骨
  rationale: ἀνάγω在此表示将遗骨带上来；“运回”符合迁葬语境，而“骸骨”准确对应ὀστᾶ。
- source_word: ἐν κρυφῇ
  choice: 暗中
  rationale: 简洁保留秘密行事之意。
- source_word: ἐν τῷ πολέμῳ Χαναάν
  choice: 在迦南战争中
  rationale: 尽量贴近保存文本的措辞，不擅自把“迦南”明确处理为战争发生地或战争名称以外的解释。
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: 在……祖先的脚旁
  rationale: 保留希腊文具体而略显异常的空间表达，并用脚注说明可能所指。
theological_decisions:
- issue: πατέρων在同一句中的指称
  choice: 前一处译“父亲们”，后一处译“祖先”
  alternative: 两处均译“父亲们”或“先祖”
  rationale: 前一处指他们直接迁运遗骨的父辈，后一处更可能指希伯仑祖墓中的更早先祖；此处理使汉语指称清楚，同时不改变家族安葬的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“以色列众子”保留古代文献色彩；“暗中运回”“安葬”则使用自然的现代汉语。原文若干词句在校勘本中带有疑难标记，译文未据此另作推断。
