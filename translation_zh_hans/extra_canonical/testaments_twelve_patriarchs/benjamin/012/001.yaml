  text: And after saying these things, he stretched out his feet and fell asleep in a good [and good] sleep.
translation:
  language: zh_hans
  text: 他说完这些话，就伸展双脚，在美好的［而良好的］睡眠中睡去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: 伸直双脚
  rationale: 直译其临终时伸展双脚的动作，符合现代汉语习惯。
- source_word: ἐκοιμήθη
  choice: 睡去了
  rationale: 保留“入睡”的委婉表达及其死亡语境，不直接改译为“死了”。
- source_word: ὕπνῳ καλῷ
  choice: 在安然的睡眠中
  rationale: καλός在此修饰临终的“睡眠”；“安然”比生硬的“好的睡眠”更自然、庄重，同时不消除其正面含义。
theological_decisions:
- issue: “睡去”是否明确解释为死亡
  choice: 保留“睡去了”的委婉说法
  alternative: 死去了
  rationale: 希腊文使用ἐκοιμήθη，具有“睡去”及委婉指死亡的张力；译文不应把隐喻静默地解释掉。
- issue: 括号内异文καὶ ἀγαθῷ的处理
  choice: 正文保留为［而美好］并加注
  alternative: 省略该短语，或无括号并入正文
  rationale: 底本文本以方括号标示该词组，反映文本上的不确定性；译文据此保留而不将其视为无争议正文。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“伸直双脚”保留具体动作；“睡去了”维持临终委婉语。中文方括号呈现希腊文本的编辑性括注，脚注标记紧随其后。
