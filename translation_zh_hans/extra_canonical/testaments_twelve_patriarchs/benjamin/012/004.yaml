  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/004.yaml
  text: And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.
translation:
  language: zh_hans
  text: 他们从迦南地回来，住在埃及，直到他们离开埃及地的那一天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψαν
  choice: 回来
  rationale: 该动词表示“返回、回来”；结合叙事视角译作“回来”自然清楚，不额外指定未明说的目的地。
- source_word: ᾤκησαν
  choice: 住
  rationale: 对应“居住、定居”；此处用现代汉语常用的“住”即可表达持续居留。
- source_word: ἐξόδου
  choice: 离开
  rationale: 基本义为“出去、出离”；此处指他们从埃及地离去，译作“离开”自然，也避免把普通叙述过度术语化为“出埃及”。
theological_decisions:
- issue: ἐξόδου 是否译作带有专名意味的“出埃及”
  choice: 译作“离开埃及地”
  alternative: “出埃及”或“出离埃及地”
  rationale: 原文虽可能呼应以色列人的出埃及事件，但句法首先表达离开该地这一行动；保留普通语义，不额外强化为专名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文两个“埃及”的重复，以清楚对应“住在埃及”与“离开埃及地”；无须添加脚注。
