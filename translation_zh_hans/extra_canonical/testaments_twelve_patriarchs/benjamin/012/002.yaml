base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/002.yaml
  text: 'And his sons did as he had commanded them, and they carried his body and buried him in Hebron with his fathers.


    And when he had finished his words, he said, “I command you, my children, carry my bones up out of Egypt, and bury me in Hebron near my fathers.”

    And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.'
translation:
  language: zh_hans
  text: '他的儿子们照着他的吩咐做了：他们抬着他的遗体，把他葬在希伯仑，与他的先祖同葬。


    当他讲完自己的话后，他说：“我的孩子们，我吩咐你们：要把我的骸骨从埃及运上去，葬在希伯仑，靠近我的先祖。”


    便雅悯在安享晚年时去世，享年一百二十五岁；他们把他安放在棺中。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄραντες τὸ σῶμα αὐτοῦ
  choice: 抬走他的遗体
  rationale: ἄραντες 表示抬起、带走；结合安葬语境，译为“抬走”自然且准确。σῶμα 在此指死者遗体。
- source_word: ἀνενέγκατε τὰ ὀστᾶ μου ἐξ Αἰγύπτου
  choice: 要把我的骸骨从埃及运上去
  rationale: ἀναφέρω 含“带上去、运上去”之意，保留从埃及前往迦南地的上行表达；ὀστᾶ 直译为“骸骨”。
- source_word: ἐν γήρει καλῷ
  choice: 享尽天年而死
  rationale: 该惯用语指在圆满、福寿的高龄中去世；此译比生硬的“在美好的老年中”更符合现代汉语，同时保留善终之意。
- source_word: ἐν παραθήκῃ
  choice: 安放在棺中
  rationale: παραθήκη 字面涉及存放、寄存之物；在遗体暂置的丧葬语境中，结合古译传统与英语审校层，译作“棺中”最为通顺，但不额外说明后续正式安葬。
- source_word: μετὰ τῶν πατέρων αὐτοῦ / ἐγγὺς τῶν πατέρων μου
  choice: 与他的先祖同葬 / 靠近我的先祖
  rationale: πατέρες 在墓葬语境中指已故祖先；分别保留 μετὰ 的“与……同在”和 ἐγγύς 的“靠近”，不将二者抹平。
theological_decisions:
- issue: “先祖”与“父亲”的取舍
  choice: 先祖
  alternative: 父亲
  rationale: 复数 πατέρες 在希伯仑家族墓葬背景中涵盖列祖，不仅指生父；“先祖”避免过窄理解，也不加入宗派性解释。
- issue: 第一段安葬叙述与后文临终命令、死亡叙述之间的时序张力
  choice: 按现存希腊文本原序保留
  alternative: 重排、删除第一段，或补出不同人物以消解矛盾
  rationale: 原文表面上先叙述遗体安葬，随后又记临终吩咐和死亡，存在明显时序张力。因缺乏足够文本证据，不擅自协调或改写。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留原文三段结构与时序张力；称名采用通行圣经译名“便雅悯”“希伯仑”“埃及”。无脚注标记。
