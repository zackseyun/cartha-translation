  text: '*Καὶ γὰρ³¹ *ὁ Ἰωσὴφ ἐδεήθη τοῦ πατρὸς ἡμῶν³², ἵνα προσεύξηται *ὑπὲρ τῶν ἀδελφῶν αὐτοῦ³³· ἵνα μὴ³⁴ λογίσηται *⌈Κύριος⌉ αὐτοῖς³⁵ *ἁμαρτίαν, ὅτι ἐποίησαν πονηρὸν εἰς αὐτόν³⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/006.yaml
  text: For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him.
translation:
  language: zh_hans
  text: 因为约瑟也曾恳求我们的父亲为他的兄弟们祷告，好让主不把罪算在他们身上，因为他们曾恶待约瑟。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: 恳求
  rationale: 表达郑重、迫切的请求，符合该动词语气。
- source_word: τοῦ πατρὸς ἡμῶν
  choice: 我们的父亲
  rationale: 贴近原文，并保留说话者与约瑟同属一家的叙述视角。
- source_word: λογίσηται ... ἁμαρτίαν
  choice: 把罪算在……身上
  rationale: 保留λογίζομαι的记账、归算意象，同时符合现代汉语表达。
- source_word: ἐποίησαν πονηρὸν εἰς αὐτόν
  choice: 恶待约瑟
  rationale: 自然表达“对他行了恶事”，并明确句末代词所指，避免汉语中的指代含混。
theological_decisions:
- issue: 祷告与不归算罪之间的关系
  choice: 好让主不把罪算在他们身上
  alternative: 使主不把罪算在他们身上
  rationale: “好让”准确呈现ἵνα所引目的句，又不额外断定人的祷告必然导致神赦免。
- issue: Κύριος的译法
  choice: 主
  alternative: 上主
  rationale: 原文为Κύριος，译作“主”既直接又符合现代中文宗教文本惯例，不擅自确定其专名指向。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“曾”呼应希腊语过去时叙事；末句重复“约瑟”以消除连续多个第三人称代词在中文中的歧义。
