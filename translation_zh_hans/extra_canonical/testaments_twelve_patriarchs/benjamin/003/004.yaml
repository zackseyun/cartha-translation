  text: Πόσοι¹⁸ τῶν ἀνθρώπων *ἤθελον αὐτὸν ἀνελεῖν¹⁹, καὶ ὁ Θεὸς ἐσκέπασεν αὐτόν²⁰· ὁ γὰρ φοβούμενος τὸν Θεὸν καὶ ἀγαπῶν τὸν πλησίον²¹ ὑπὸ *τοῦ πνεύματος²² τοῦ Βελίαρ οὐ δύναται πληγῆναι, σκεπαζόμενος²³ ὑπὸ τοῦ φόβου τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/004.yaml
  text: How many men wanted to kill him, and God sheltered him; for the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God.
translation:
  language: zh_hans
  text: 有多少人想要杀他，神庇护了他；因为敬畏神、爱邻舍的人，受对神的敬畏所庇护，不能被彼列的灵击伤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: 庇护 / 有……庇护着
  rationale: 原词有遮盖、保护之意；“庇护”在现代汉语中自然庄重，并保留两处词根呼应。
- source_word: τὸν πλησίον
  choice: 邻舍
  rationale: 指身边之人、同胞或近人；“邻舍”是易懂且具有经文语体色彩的对应词，不限于毗邻住户。
- source_word: πληγῆναι
  choice: 被……击伤
  rationale: 保留动词“击打、打伤”的具体意象，不弱化为笼统的“伤害”。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 按专名音译；此名在相关犹太文献中指邪恶势力或其人格化首领，正文不额外释义。
- source_word: ὁ φόβος τοῦ Θεοῦ
  choice: 对神的敬畏
  rationale: “敬畏”兼具尊崇与畏惧，符合该短语的宗教伦理含义。
theological_decisions:
- issue: ὑπὸ τοῦ πνεύματος τοῦ Βελίαρ 与 πληγῆναι 的施事关系
  choice: 不会被彼列的灵击伤
  alternative: 不会在彼列之灵的作用下受击打
  rationale: 采用最直接的被动施事表达，同时不进一步界定“彼列的灵”是人格、灵体还是邪恶影响。
- issue: 因敬畏神而受保护与不能受击伤之间的张力
  choice: 保留绝对式“不会被……击伤”
  alternative: 不容易被……伤害
  rationale: 希腊文 οὐ δύναται 表达“不能”，不应擅自弱化；经文所指保护的范围仍保持原文张力。
- issue: καί 在前两分句间的关系
  choice: 译作“却”
  alternative: 译作“而且/并且”
  rationale: καί 本身是简单连接词，但汉语中“许多人想杀他”与“神庇护他”形成明显逆转；“却”使逻辑自然，不增添实质内容。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。句法基本保留原文因果结构，并通过“庇护”在前后两处的重复呈现原文词汇呼应；不添加解释性脚注。
