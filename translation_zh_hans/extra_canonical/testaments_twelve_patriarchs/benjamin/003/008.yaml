source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πληρωθήσεται⁴⁵ *περὶ σοῦ⁴⁶ προφητεία οὐράνιος⁴⁷ [περὶ⁴⁸ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου], ὅτι ἄμωμος ὑπὸ⁴⁹ ἀνόμων παραδοθήσεται καὶ ὁ⁵⁰ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται [ἐν αἵματι διαθήκης ἐπὶ σωτηρίᾳ ἐθνῶν καὶ τοῦ⁵¹ Ἰσραὴλ καὶ καταλύσει⁵² *Βελίαρ καὶ τοὺς ὑπηρέτας αὐτοῦ⁵³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/008.yaml
  text: “The heavenly prophecy concerning you will be fulfilled, [concerning the lamb of God and savior of the world,] for the blameless one will be handed over by lawless men, and the sinless one will die for the ungodly [in the blood of the covenant, for the salvation of the nations and of Israel, and for the destruction of Beliar and his servants].”
translation:
  language: zh_hans
  text: “关于你的属天预言必将应验[a]——［关于上帝的羔羊和世界的救主］：因为那无瑕疵者将被不法之人交付，那无罪者将为不敬虔的人死去[b]，［在盟约的血中，为使列国和以色列得救，并毁灭彼列及其仆役］。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 底本将“关于上帝的羔羊和世界的救主”置于方括号内，表示这几个词的文本归属存在疑问。
    reason: 说明底本对第一段方括号文字所标示的文本不确定性。
  - marker: b
    text: 底本将“在盟约的血中……彼列及其仆役”置于方括号内，表示这一长段文字的文本归属存在疑问。
    reason: 说明底本对第二段方括号文字所标示的文本不确定性。
lexical_decisions:
- source_word: προφητεία οὐράνιος
  choice: 天上预言
  rationale: 保留“属天、来自天上”的开放含义，不擅自明确为“由上帝赐下的预言”。
- source_word: ἀμνὸς τοῦ Θεοῦ
  choice: 上帝的羔羊
  rationale: 采用自然且能保留祭牲意象的直译。
- source_word: ἄμωμος
  choice: 无可指摘的
  rationale: 既可表达品格上无可责备，也保留该词可能具有的祭牲无瑕意涵。
- source_word: παραδοθήσεται
  choice: 将被……交出
  rationale: 保留“交付、交出”的被动意义，不额外指定是出卖、逮捕或交给谁。
- source_word: ἀναμάρτητος
  choice: 无罪的
  rationale: 直接表达没有罪，且与前句“无可指摘的”保持词义区分。
- source_word: ὑπὲρ ἀσεβῶν
  choice: 为不敬虔的人
  rationale: “为”保留ὑπέρ可能包含的代表、为了或代替等关系，不将其缩窄为单一赎罪理论。
- source_word: ἐν αἵματι διαθήκης
  choice: 在盟约之血中
  rationale: 较形式地保留介词ἐν及“盟约之血”这一浓缩表达，避免擅自改成单纯的工具关系。
- source_word: ἐπὶ σωτηρίᾳ
  choice: 为使……得救
  rationale: 在现代汉语中自然表达目的或结果，同时不细化得救的具体机制。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 按专名音译，保留其作为邪恶势力之名的文本形态，不解释性改写为“魔鬼”。
- source_word: καταλύσει
  choice: 毁灭
  rationale: 表达废除、推翻或摧毁的强烈结果；此处与彼列及其仆役搭配，以“毁灭”最自然。
theological_decisions:
- issue: “关于你的”与随后基督论式内容之间的关系
  choice: 保留“关于你的”，不解释“你”与羔羊之间的具体关系
  alternative: 改译为“在你身上将应验”或将“你”直接认定为某位弥赛亚人物
  rationale: 原文περὶ σοῦ本身是“关于你”，而上下文形成的指涉张力不宜由译文消除。
- issue: ὑπὲρ ἀσεβῶν所表达的死亡关系
  choice: 译为“为不敬虔的人死去”
  alternative: 译为“代替不敬虔的人受死”
  rationale: 原文可承载替代含义，但未在该介词短语中把替代机制说尽；“为”更能保留语义幅度。
- issue: “盟约之血”与死亡、拯救之间的语法关系
  choice: 保留“在盟约之血中”这一不完全展开的关系
  alternative: 解释为“借着他所流、用来立约的血”
  rationale: 原文措辞浓缩，译文不补出血的归属、立约动作或完整救赎机制。
- issue: 方括号内文字的文本地位
  choice: 正文保留方括号，并用脚注说明其文本不确定性
  alternative: 无标记地纳入正文或完全删除
  rationale: 底本明确以方括号标出这些语句；出版译文应让读者看见这一文本证据，而不替读者裁决。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无可指摘的／无罪的”、“不法之人／不敬虔的人”分别对应原文的平行而不相同的词语。破折号和冒号用于理清预言内容与其理由之间的层次；方括号原样保留底本所呈现的文本边界。
