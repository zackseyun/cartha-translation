  text: And thus Jacob cried out, “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, he kept kissing him for two hours, saying,
translation:
  language: zh_hans
  text: 雅各便这样喊道：“善良的孩子啊，你胜过了你父亲雅各的心肠[a]。”雅各抱住他，不断亲吻他达两个小时，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胜过了……的心肠”直译希腊文；“心肠”可指内在深处的情感或怜爱。这里也可理解为“打动了你父亲雅各的心”。
    reason: 原短语ἐνίκησας τὰ σπλάγχνα语义不寻常；脚注既保留字面意象，也向读者说明可能的情感含义。
lexical_decisions:
- source_word: οὕτως ἐβόα
  choice: 就这样喊道
  rationale: 保留οὕτως与未完成时ἐβόα所描写的承接性呼喊，同时采用自然的现代汉语表达。
- source_word: τέκνον χρηστόν
  choice: 善良的孩子
  rationale: χρηστός在此主要指品性良善；“孩子”保留τέκνον的亲昵亲子称呼。
- source_word: ἐνίκησας
  choice: 胜过了
  rationale: 按νικάω的通常意义直译为“战胜、胜过”，不随英语咨询层解释成“激起”，以保留原文略显奇特的比喻和歧义。
- source_word: τὰ σπλάγχνα
  choice: 心肠
  rationale: σπλάγχνα字面指内脏，并可转指深处的怜爱与情感；“心肠”兼顾身体意象和情感含义。
- source_word: περιλαβών
  choice: 抱住
  rationale: 准确传达环抱、拥抱之意，符合现代汉语叙事习惯。
- source_word: κατεφίλει
  choice: 不住地亲吻
  rationale: 未完成时表示持续或反复动作；“不住地”自然呈现其延续性。
- source_word: ἐπὶ δύο ὥρας
  choice: 两个小时
  rationale: 按时长理解介词短语，并自然置于汉语动词短语之后。
theological_decisions:
- issue: “ἐνίκησας τὰ σπλάγχνα”的解释
  choice: 你胜过了……的心肠
  alternative: 你激起了……内心的慈爱／你赢得了……的心
  rationale: 原文使用“胜过”而非通常表示“感动、激起”的动词。正文保留这种不寻常的拟人表达，脚注说明可能语义，不把情感对象或因果关系解释得过于确定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文保留原文的身体—情感意象及其张力；“不住地亲吻了两个小时”体现持续动作。所有脚注标记均已在正文出现。
