source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔστω ἡ διάνοια ὑμῶν *εἰς τὸ ἀγαθόν⁶, ὡς κἀμὲ οἴδατε⁷. Ὅτι⁸ ὁ ἔχων τὴν⁹ διάνοιαν ὀρθὴν¹⁰ πάντα βλέπει ὀρθῶς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/002.yaml
  text: And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly.
translation:
  language: zh_hans
  text: 你们的心思要向着良善，正如你们所知道的，我也是这样。因为心思端正的人，看一切都看得正确。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάνοια
  choice: 心思
  rationale: 既可表达人的思想取向，也适合前后两句重复使用，保留原文的关键词呼应。
- source_word: εἰς τὸ ἀγαθόν
  choice: 专注于良善
  rationale: 表达心思朝向善的持续取向；“良善”兼顾抽象的善与善好之事，避免缩窄为某一种具体善行。
- source_word: ὀρθὴν / ὀρθῶς
  choice: 端正 / 正确
  rationale: 分别按形容心思和修饰观看的汉语习惯译出，同时以相关词语保留原文“正—正”之间的呼应。
- source_word: πάντα
  choice: 一切
  rationale: 保留原文广泛而未限定的范围，不擅自解释为所有人、所有事情或特定处境。
theological_decisions:
- issue: ὡς κἀμὲ οἴδατε 中省略成分的理解
  choice: 正如你们知道我也是这样
  alternative: 正如你们知道我的心思也是如此
  rationale: 希腊文直陈“正如你们也知道我”，具体谓语由上文补足。正文用“也是这样”保留这种简洁与一定的省略感，同时在现代汉语中清楚可懂。
- issue: “心思端正”与“看得正确”的关系
  choice: 保留原文直接的因果陈述
  alternative: 解释为道德纯洁必然带来完全无误的判断
  rationale: 原文表达一般性的智慧教导，但并未展开其范围或绝对程度；译文不加入关于无误性或特殊属灵能力的教义推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们的心思要……”自然传达第三人称命令式的劝勉语气；两次使用“心思”维持篇章连贯，并以“端正／正确”尽量再现原文词根呼应。
