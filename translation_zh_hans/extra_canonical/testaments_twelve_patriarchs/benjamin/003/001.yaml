source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: III. *Νῦν οὖν, τέκνα μου, καὶ ὑμεῖς ⸀ἀγαπήσατε¹ Κύριον τὸν Θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς², καὶ³ φυλάξατε⁴ ἐντολὰς αὐτοῦ, *μιμούμενοι τὸν ἀγαθὸν καὶ ὅσιον ἄνδρα ⸀Ἰωσήφ⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/001.yaml
  text: Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph.
translation:
  language: zh_hans
  text: 所以现在，我的孩子们，你们也要爱主，就是天地的上帝，遵守他的诫命，效法那良善而圣洁的人约瑟。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留父亲对众子的亲切称呼，并符合现代汉语自然表达。
- source_word: ἀγαπήσατε
  choice: 要爱
  rationale: 准确表达不定过去时命令语气；此处重点是劝命，不必在汉语中强行体现希腊语体貌。
- source_word: Κύριον τὸν Θεὸν τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: 主，就是天地的上帝
  rationale: 将“主”与“天地的上帝”理解为同位关系，既贴近希腊语结构，也使中文指代清楚。
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: 遵守他的诫命
  rationale: “遵守”自然传达 φυλάσσω 在诫命语境中谨守、实行之义。
- source_word: μιμούμενοι
  choice: 效法
  rationale: 用伴随性的劝勉表达分词含义，中文简洁而庄重。
- source_word: τὸν ἀγαθὸν καὶ ὅσιον ἄνδρα Ἰωσήφ
  choice: 那良善而圣洁的人约瑟
  rationale: 分别保留 ἀγαθός 的“良善”和 ὅσιος 的“圣洁/虔圣”含义；“人约瑟”维持原文对其品格与人物身份的强调。
theological_decisions:
- issue: “主”与“天地的上帝”的关系
  choice: 译作同位语：“主，就是天地的上帝”
  alternative: “天地之主上帝”
  rationale: 原文 Κύριον τὸν Θεὸν 带同位结构；采用“就是”可避免中文读者误以为是两个对象，同时不增加原文没有的神学限定。
- issue: ὅσιος 对约瑟的描述
  choice: 圣洁
  alternative: 虔诚
  rationale: ὅσιος 可指虔圣、圣洁；“圣洁”保留较强的宗教伦理色彩，与“良善”并列而不将其窄化为外在敬虔。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体；保留“所以现在”的承接意味，以及“你们也”的强调。全句不添加原文以外的解释性内容。
