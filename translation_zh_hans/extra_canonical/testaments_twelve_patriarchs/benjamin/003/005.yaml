base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/005.yaml
  text: And he cannot be mastered by the plots of men or of beasts, being helped †to live from it† by the love which he has toward his neighbor.
translation:
  language: zh_hans
  text: 人或野兽的加害不能制伏他；他得到自己对邻舍之爱的帮助，†靠这爱活着†。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠这爱活着”：此处希腊文本以剑号标示为讹损或难解；直译近于“从它而活”或“靠它活着”。“它”最可能指前面的“爱”，但确切原意不能确定。
    reason: 原文以剑号标示ζῆν ἀπ᾽ αὐτῆς为讹损或难解文本；译文保留剑号并说明其可能指代，避免将推测当作确定含义。
lexical_decisions:
- source_word: ἐπιβουλῆς
  choice: 谋害
  rationale: 此词可指暗中策划的敌意、阴谋或袭击；“谋害”既保留蓄意加害之意，也能自然地与“人或野兽”连用。
- source_word: κυριευθῆναι
  choice: 被制伏
  rationale: 被动不定式表示被支配、压倒或控制；“被制伏”贴合语境中的敌对威胁。
- source_word: ἀγάπης
  choice: 爱
  rationale: 按通常含义直译，并保留这爱以“邻舍”为对象。
- source_word: πλησίον
  choice: 邻舍
  rationale: 采用庄重且为现代读者熟悉的圣经用语，指身边的他人。
- source_word: βοηθούμενος
  choice: 得到帮助
  rationale: 保留希腊文的被动分词，不擅自增补“主”为施助者；句中明确以“爱”为施助媒介或来源。
theological_decisions:
- issue: 帮助的施予者
  choice: 他因自己对邻舍的爱而得到帮助
  alternative: 主借着他对邻舍的爱帮助他
  rationale: 现存希腊文写的是ὑπὸ τῆς ἀγάπης，语法上将“爱”表为帮助的来源或施动者，并未出现“主”；故不作神学性补入。
- issue: 损坏短语ζῆν ἀπ᾽ αὐτῆς的指代
  choice: †靠这爱活着†
  alternative: †由此得以存活†
  rationale: αὐτῆς最自然地回指阴性名词ἀγάπης，但整段文字有损坏标记，句法与确切含义不稳，因此正文保留校勘符号并以脚注说明。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“人或野兽的谋害”保留原文将同一属格结构用于两者的表达；分号呈现主句与补充说明之间的关系。剑号与脚注共同标明原文损坏，避免把推测当作确定文本。
