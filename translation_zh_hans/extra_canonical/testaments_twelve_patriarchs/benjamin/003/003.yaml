source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Φοβεῖσθε¹² Κύριον καὶ ἀγαπᾶτε τὸν πλησίον¹³, καὶ ἐὰν τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως ἐκστήσωσι¹⁴ ὑμᾶς, οὐ μὴ *κατακυριεύσωσιν ὑμῶν¹⁵, *ὡς οὔτε¹⁶ Ἰωσὴφ *τὸν ἀδελφόν¹⁷ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/003.yaml
  text: Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every evil affliction, they will certainly not rule over you, just as they did not over Joseph my brother.
translation:
  language: zh_hans
  text: 你们要敬畏主，爱邻人。如果彼列的诸灵把你们逼入种种邪恶的患难[a]，它们也绝不能辖制你们，正如它们未曾辖制我兄弟约瑟一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “种种邪恶的患难”：原文结构较为凝缩，也可理解为“邪恶所造成的各种患难”。
    reason: πᾶσαν πονηρίαν θλίψεως 的属格关系不够明确；脚注保留“邪恶”与“患难”之间可能存在的不同语义关系。
lexical_decisions:
- source_word: Φοβεῖσθε
  choice: 敬畏
  rationale: 该词在宗教语境中兼有畏惧与尊崇之意；“敬畏”是现代汉语中自然且准确的对应。
- source_word: τὸν πλησίον
  choice: 邻人
  rationale: 原文为单数，指身边的人或同胞；“邻人”比仅指住处相邻者的“邻居”范围更恰当。
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: 彼列的诸灵
  rationale: 保留属格结构和复数“诸灵”，并以“彼列”音译这一邪恶势力的专名，不将其直接解释为撒但。
- source_word: ἐκστήσωσι ὑμᾶς
  choice: 把你们逼入
  rationale: 结合后接 εἰς 短语表达被强力驱入某种境况；“逼入”既自然，也保留外在邪灵施压的意味。
- source_word: οὐ μὴ κατακυριεύσωσιν ὑμῶν
  choice: 它们也绝不能辖制你们
  rationale: οὐ μή 强烈否定，译作“绝不能”；κατακυριεύω 表示居高临下地支配、辖制。
- source_word: τὸν ἀδελφόν μου
  choice: 我兄弟
  rationale: 忠实保留 ἀδελφός 的一般亲属称谓，不依据人物背景擅自具体化为“哥哥”或“兄长”。
theological_decisions:
- issue: “彼列”与邪灵的身份
  choice: 保留“彼列的诸灵”
  alternative: 译为“魔鬼的邪灵”或将彼列等同于撒但
  rationale: 原文使用专名 Βελίαρ，并未在本句明确作进一步等同；保留专名可避免输入后来的体系化解释。
- issue: 邪灵能否辖制敬畏主、爱邻人的人
  choice: 以“绝不能”保留原文强烈否定
  alternative: 弱化为“不会”或“未必能”
  rationale: οὐ μή 加虚拟式表达强调否定；译文应保留这一确定语气，同时不额外说明其机制或条件。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们要……，爱……”使并列命令自然；“即使……也……”清楚呈现让步条件。避免古奥表达，并保留原文对彼列、邪灵和辖制的术语张力。
