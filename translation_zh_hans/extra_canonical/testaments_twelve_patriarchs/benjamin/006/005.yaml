  text: Ἡ ἀγαθὴ διάνοια²⁸ οὐκ ἔχει δύο γλώσσας²⁹ εὐλογίας καὶ κατάρας³⁰, ὕβρεως καὶ ⌈τιμῆς⌉³¹, ἡσυχίας καὶ ταραχῆς, ὑποκρίσεως καὶ ἀληθείας, [πενίας καὶ πλούτου]³², ἀλλὰ *μίαν ἔχει περὶ πάντας³³ εἰλικρινῆ³⁴ καὶ³⁵ καθαρὰν ⌈διάθεσιν⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/005.yaml
  text: The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, [of poverty and wealth], but rather has one sincere and pure disposition toward all.
translation:
  language: zh_hans
  text: 善良的心思没有两条舌头：祝福与咒诅，侮辱与敬重，安静与搅扰，虚伪与真实，[贫穷与富有]；相反，它对所有人都持有一种真诚而纯洁的态度。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀγαθὴ διάνοια
  choice: 善良的心思
  rationale: διάνοια指人的思想、心志或内在思维取向；“心思”既自然，又能保留其认知与道德层面。
- source_word: δύο γλώσσας
  choice: 两条舌头
  rationale: 保留希腊文的具体隐喻，表达言语或态度上的双重性；随后以“一面……一面……”使汉语含义清楚。
- source_word: ὕβρεως
  choice: 辱骂
  rationale: 在与“尊敬”相对的言语语境中，译为“辱骂”较贴切；该词也可泛指侮辱或凌辱。
- source_word: ἡσυχίας καὶ ταραχῆς
  choice: 安静……扰乱
  rationale: 保留静谧与搅扰的对照，并使两个词在汉语句法中形成自然对应。
- source_word: εἰλικρινῆ καὶ καθαρὰν διάθεσιν
  choice: 真诚、纯洁的心
  rationale: διάθεσις在此指内在态度、意向或性情；译作“心”可与“对待所有人”自然衔接，同时由“真诚、纯洁”明确其内在品格。
- source_word: περὶ πάντας
  choice: 对待所有人
  rationale: 表达面向每个人的一贯态度，比生硬的“关于众人”更符合现代汉语。
theological_decisions:
- issue: “两条舌头”及各组对立项的关系
  choice: 保留“两条舌头”的隐喻，并用“一面……一面……”说明双重言行
  alternative: 意译为“不会说两套话”
  rationale: 原文以身体意象强调善良心思不具双重性；直译隐喻更具文本特色，而补充性的汉语结构可避免费解。
- issue: 结尾“一”的所指
  choice: 译作“同一颗……的心”
  alternative: 译作“一种……的态度”
  rationale: μίαν与前文“两条舌头”形成单一与双重的对照；“同一颗”突出其对所有人始终如一，而不把经文扩展为特定教义。
- issue: 方括号内“贫穷和富有”的文本状态
  choice: 在正文中保留方括号
  alternative: 不加括号纳入正文，或删去
  rationale: 源文本已用方括号标示该词组的文本不确定性，应在译文中如实保存，而不擅自裁定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“两条舌头”这一鲜明隐喻；用重复的“一面……一面……”呈现各组对照，使普通读者易于理解。方括号原样反映源文本的不确定性。
