  text: VI. Τὸ διαβούλιον τοῦ ἀγαθοῦ ἀνδρὸς οὐκ ἔστιν ἐν χειρὶ πλάνης¹ πνεύματος² Βελίαρ· ὁ γὰρ ἄγγελος τῆς εἰρήνης ὁδηγεῖ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/001.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar's error, for the angel of peace guides his soul.
translation:
  language: zh_hans
  text: 善人的谋划不在彼列迷误之灵[a]的手中，因为和平的天使引导他的灵魂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列迷误之灵”直译原文压缩的属格结构（πλάνης πνεύματος Βελίαρ）。也可理解为“彼列的迷误之灵”或“彼列之迷误的灵”；πλάνη 可指迷误、谬误或欺骗。
    reason: 保留 πλάνης、πνεύματος 与 Βελίαρ 之间修饰关系的歧义，避免正文作单一的使役性解释。
lexical_decisions:
- source_word: διαβούλιον
  choice: 意念
  rationale: 指内在的谋划、意向或决断；译作“意念”既自然，也不把语义过度限定为具体计划或抽象目的。
- source_word: ἀγαθοῦ ἀνδρός
  choice: 善人
  rationale: 简洁表达“良善的人”，保留其道德含义。
- source_word: οὐκ ἔστιν ἐν χειρί
  choice: 不受……掌控
  rationale: 原文直译为“不在……手中”，在此表示不处于其权势或控制之下；此译保留支配意象的实际意义。
- source_word: πλάνης πνεύματος Βελίαρ
  choice: 彼列那使人迷失的灵
  rationale: 属格链存在修饰关系上的张力；此译将 πλάνης 理解为该灵使人误入歧途的性质，同时保留“彼列”这一专名。
- source_word: ἄγγελος τῆς εἰρήνης
  choice: 和平的天使
  rationale: 形式与语义均贴近原文，不额外判定这是专名、职衔还是描述。
- source_word: ὁδηγεῖ
  choice: 引导
  rationale: 准确表达带领、指引之意，符合现代汉语宗教文体。
- source_word: ψυχὴν
  choice: 心灵
  rationale: 在此指人的内在生命或自我；“心灵”比单用“灵魂”更自然，同时不消解其宗教意味。
theological_decisions:
- issue: 彼列与“使人迷失的灵”的关系
  choice: 译为“彼列那使人迷失的灵”
  alternative: “彼列的迷误之灵”或“彼列之谬误的灵”
  rationale: 希腊文 πλάνης πνεύματος Βελίαρ 的属格关系略显压缩。正文采用自然而不过度体系化的表达，脚注提示可能的直译。
- issue: “和平的天使”的身份
  choice: 保留描述性称谓
  alternative: 将其解释为特定天使、弥赛亚或神的代理者
  rationale: 本节没有明确界定其身份，因此不导入特定神学传统的认定。
- issue: 人的意念与邪灵权势
  choice: “不受……掌控”
  alternative: “不在……手中”
  rationale: 保留原文所表达的权势关系，但不推演为绝对自由意志、预定论或附身论命题。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“意念—掌控—引导心灵”形成清楚对照；保留“彼列”和“和平的天使”等古代宗教语汇，不作教派化解释。
