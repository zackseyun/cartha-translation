  text: He does not delight in pleasure, [does not grieve his neighbor, does not fill himself with luxury, does not go astray by the wanderings of the eyes]. For the Lord is his portion.
translation:
  language: zh_hans
  text: 他不以享乐为乐，[不使邻舍忧伤，不让自己饱享奢华，也不因眼目的游移而迷失][a]。因为主是他的分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号内的话在文本传承中的见证不一致。
    reason: 说明源文本以方括号标出的文本不确定性，同时避免加入版本资料中未提供的具体手稿断言。
lexical_decisions:
- source_word: τέρπεται ἐν ἡδονῇ
  choice: 以享乐为乐
  rationale: 保留原文“以……为乐”的表达结构，并将 ἡδονή 译为现代汉语中自然且不过度贬义的“享乐”。
- source_word: λυπεῖ τὸν πλησίον
  choice: 使邻舍忧伤
  rationale: λυπέω 表示使人忧愁、难过；“邻舍”保留 πλησίον 的经文语域及伦理含义。
- source_word: ἐμπίπλαται τρυφῇ
  choice: 让自己沉溺于奢华
  rationale: ἐμπίπλαμαι 本义为使自己饱足、充满；与 τρυφή 连用时表达纵享奢华，“沉溺于”在现代汉语中自然呈现其过度满足之意。
- source_word: πλανᾶται μετεωρισμοῖς ὀφθαλμῶν
  choice: 因眼目的浮想而迷失
  rationale: πλανάω 译为“迷失”；μετεωρισμοί 可指飘忽、浮动的念头或妄想。译文保留罕见意象及其一定程度的语义含混，不具体化为某一种欲望。
- source_word: Κύριος γάρ ἐστι ἡ μερὶς αὐτοῦ
  choice: 因为主是他的分
  rationale: μέρις 直指所得之分、产业或归属；采用传统而凝练的“他的分”，保留神学意象，不擅自扩释为“产业”或“满足”。
theological_decisions:
- issue: “主是他的分”所表达的关系
  choice: 保留“分”的隐喻
  alternative: 主是他的产业／主就是他所得的一切
  rationale: 原文 μέρις 的意象可能涵盖产业、所得和归属。直译为“分”可保留这些层次，避免把因果关系解释为单纯的心理满足。
- issue: 方括号内文字的文本状态
  choice: 正文保留并加方括号，附文本说明
  alternative: 无括号纳入正文／从正文删除
  rationale: 所给希腊文本明确将这一组平行分句置于方括号中；译文照样标示，以反映文本证据的不确定性。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。平行否定分句保持紧凑；“邻舍”“眼目”“他的分”略带经文色彩，以保存原文伦理与神学意象。
