  text: Οὐκ ἔχει *ὅρασιν οὔτε ἀκοὴν³⁶ διπλῆν· *πᾶν γὰρ ὃ³⁷ ποιεῖ, Γἢ³⁸ λαλεῖ, *ἢ ὁρᾷ³⁸, οἶδεν ὅτι³⁹ Κύριος ἐπισκέπτει⁴⁰ τὴν⁴¹ ψυχὴν αὐτοῦ. Καὶ καθαίρει τὴν διάνοιαν αὐτοῦ πρὸς⁴² τὸ μὴ καταγνωσθῆναι ὑπὸ *τῶν ἀνθρώπων, ὁμοίως καὶ ὑπὸ Θεοῦ. Ὁμοίως δὲ καὶ τοῦ Βελίαρ τὰ ἔργα διπλᾶ ἐστιν, καὶ ἀπλότητα ἐν αὐτοῖς οὐκ ἔχουσιν⁴³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/006.yaml
  text: It has neither double sight nor double hearing; for in everything it does, or speaks, or sees, it knows that the Lord watches over his soul. And he cleanses his mind so as not to be condemned by men, likewise also by God. And in the same way the works of Beliar are twofold, and they have no singleness in them.
translation:
  language: zh_hans
  text: 他没有双重的视见，也没有双重的听觉；因为无论他做什么、说什么、看什么，他都知道主察看[a]他的灵魂。他洁净自己的心思，免得被人定罪，也同样免得被神定罪。彼列[b]的作为也同样是两重的，其中毫无单纯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察看”所译的希腊词也可指“探访”或“看顾”。
    reason: 保留ἐπισκέπτει在察看、临到探访与关怀性看顾之间的语义幅度。
  - marker: b
    text: “彼列”是古代犹太文献中对邪恶势力首领的称呼。
    reason: 帮助现代读者识别专名，同时避免在正文中把它替换成解释性称谓。
lexical_decisions:
- source_word: ὅρασιν οὔτε ἀκοὴν διπλῆν
  choice: 双重的眼光……双重的听觉
  rationale: 保留原文“看”与“听”的并列及“复式、双重”的意象，不把它直接解释成虚伪或三心二意。
- source_word: ἐπισκέπτει
  choice: 察验
  rationale: 此词可指探访、看顾或鉴察；本句涉及主对灵魂的审视以及随后“被定罪”的语境，“察验”最能兼顾临到察看与审察之意。
- source_word: διάνοιαν
  choice: 心思
  rationale: 指人的思想、意念或内在理解能力；“心思”在现代汉语中自然，又不将其缩窄为单纯理智。
- source_word: καταγνωσθῆναι
  choice: 被……定罪
  rationale: 保留司法性的谴责含义，并维持人和神之间的平行结构。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用中文圣经传统中对该名称的通行音译，不在正文中直接解释为撒但或邪恶，以免消除文本自身的称谓。
- source_word: διπλᾶ / ἀπλότητα
  choice: 双重的／专一
  rationale: 再现原文的对照：彼列的作为具有两重性，缺少单纯、诚一或不分裂的品质；“专一”较自然，也与前文“双重”形成清晰反差。
theological_decisions:
- issue: ἐπισκέπτει 所表达的神对灵魂的行动
  choice: 主察验他的灵魂
  alternative: 主看顾／眷顾他的灵魂
  rationale: 上下文把人的自洁与不受神定罪相连，因此审察意味较强；脚注仍说明该词也可含探访、看顾之意。
- issue: Βελίαρ 的身份
  choice: 保留专名“彼列”
  alternative: 译作“撒但”或“邪恶者”
  rationale: 原文使用专名，直接同定于某一称谓会加入解释；音译更忠实地保留古代文本的表达。
- issue: ἀπλότητα 的伦理含义
  choice: 专一
  alternative: 单纯／真诚
  rationale: 该词与“双重”直接相反，重点在不分裂、没有两面性；“专一”既保持对照，也不把含义仅限于诚实。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文以“他”承接该段所论之人，避免中文中连续使用“它”造成非人格化；以“双重”贯穿前后，并用“专一”表达ἀπλότης的不分裂、无二心含义。句式保留原文的行为三联结构和“人／神”的平行关系。
