source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Τὸ¹⁶ ἀγαθὸν διαβούλιον *οὐ δέχεται δόξης ⌈οὐκ ἀτιμίας⌉¹⁷ ἀνθρώπων, *καὶ πάντα δόλον¹⁸ ἢ¹⁹ ψεῦδος ἢ²⁰ μάχην *ἢ λοιδωρίαν²¹ *οὐκ οἶδε²². *Κύριος γὰρ²³ ἐν αὐτῷ κατοικεῖ²⁴, καὶ φωτίζει τὴν²⁵ ψυχὴν αὐτοῦ, καὶ χαίρει²⁶ πρὸς πάντας²⁷ ἐν παντὶ καιρῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/004.yaml
  text: A good purpose does not accept glory or dishonor from people, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him, and he lights up his soul, and he rejoices toward all at every time.
translation:
  language: zh_hans
  text: 良善的意念不接受人的荣耀或羞辱，也不懂任何诡诈、虚假、争斗或辱骂。因为主住在他里面，照亮他的心灵；他无论何时都以喜乐待众人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ἀγαθὸν διαβούλιον
  choice: 良善的意念
  rationale: διαβούλιον指内在的谋虑、意向或心志；译作“意念”自然凝练，也保留其道德与意志层面。
- source_word: οὐ δέχεται δόξης οὐκ ἀτιμίας ἀνθρώπων
  choice: 不接受人的荣耀或羞辱
  rationale: 依校订文本保留“荣耀／羞辱”的对举，并将属格ἀνθρώπων自然处理为其来自人的来源。
- source_word: οὐκ οἶδε
  choice: 不懂
  rationale: 保留闪语式“认识／知道”所表达的无涉、不参与之意；中文“不懂”比直译“不知道”更适合品格陈述。
- source_word: δόλον ἢ ψεῦδος ἢ μάχην ἢ λοιδωρίαν
  choice: 诡诈、虚假、争斗或辱骂
  rationale: 分别对应欺诈、谎假、冲突和言语侮辱，保持并列结构及语义区分。
- source_word: φωτίζει τὴν ψυχὴν αὐτοῦ
  choice: 照亮他的心灵
  rationale: 主动词φωτίζει直译为“照亮”；ψυχή在此指人的内在生命，译作“心灵”比“灵魂”更符合现代汉语语境。
- source_word: χαίρει πρὸς πάντας ἐν παντὶ καιρῷ
  choice: 无论何时都以喜乐待众人
  rationale: χαίρει含喜乐之义，πρὸς πάντας表达面向众人的态度；此译避免生硬的“向众人喜乐”，同时保留持续、普遍的意味。
theological_decisions:
- issue: “主住在他里面”中代词的所指
  choice: 保留“他”，指具有良善意念的人
  alternative: 译作“主住在这意念中”
  rationale: ἐν αὐτῷ在语法上可回指阳性διαβούλιον，也可能按语义转指持有此意念的人；下文“他的心灵”明显涉及人格主体，因此正文沿用人的所指，但不扩写为解释性措辞。
- issue: 照亮心灵的主语
  choice: 按连续主语译为“主……照亮他的心灵”
  alternative: 理解为良善意念照亮他的心灵
  rationale: γὰρ之后“主”是明示主语，随后两个单数动词自然延续这一主语；这种处理最符合希腊文句法，同时不添加额外教义含义。
- issue: 末句“喜乐”的主语
  choice: 理解为具有良善意念的人
  alternative: 理解为主喜悦众人
  rationale: 就紧邻句法而言也可能延续“主”为主语，但“他的心灵”之后转回所描写之人的品格，与本段伦理陈述更连贯；中文以分号弱化主语转换而不作神学发挥。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留原文的伦理并列和因果结构，不加入宗派化术语；“荣耀或羞辱”刻意保留原文张力，不改释为“不受称赞或贬损影响”。
