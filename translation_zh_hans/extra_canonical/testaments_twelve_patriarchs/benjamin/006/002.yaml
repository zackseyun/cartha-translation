  text: He does not look upon perishable things with passion, nor does he gather wealth for pleasure.
translation:
  language: zh_hans
  text: 他不以欲念注视易朽坏的事物，也不为享乐积聚财富。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾷ ἐμπαθῶς
  choice: 以贪恋之心注目于
  rationale: ὁρᾷ意为“看、注视”，ἐμπαθῶς在此表示受欲念驱使、带着强烈贪恋；译文保留视觉动作及其欲望色彩。
- source_word: τὰ φθαρτά
  choice: 会朽坏的事物
  rationale: 指会败坏、消逝之物；采用具体易懂的表达，同时保留其与不朽之物形成对照的可能性。
- source_word: συνάγει πλοῦτον
  choice: 积聚财富
  rationale: 准确传达“聚集、积攒财富”，语体庄重自然。
- source_word: εἰς φιληδονίαν
  choice: 为享乐
  rationale: εἰς表示目的，φιληδονία指对享乐的爱好或追求；简洁译作“为享乐”，不额外限定享乐的具体性质。
theological_decisions:
- issue: “会朽坏的事物”所指范围
  choice: 保留宽泛表达，不解释为特定类别的物质或财产
  alternative: 译作“世上易逝之物”或直接解释为“物质财富”
  rationale: 原文τὰ φθαρτά本身范围宽泛，可能具有伦理及末世性的张力，不宜在正文中将其窄化。
- issue: ἐμπαθῶς的伦理色彩
  choice: 译作“以贪恋之心”
  alternative: “满怀激情地”或“带着欲念”
  rationale: 上下文否定对易朽之物及享乐的追逐，故此词具有负面的欲念色彩；“贪恋”清楚自然，但不引入特定宗派术语。
translation_notes:
  register: 采用现代标准普通话和简体中文，句式凝练、庄重而易懂；两分句保持平行，并保留原文对“贪恋易朽之物”与“为享乐聚财”的双重否定。
