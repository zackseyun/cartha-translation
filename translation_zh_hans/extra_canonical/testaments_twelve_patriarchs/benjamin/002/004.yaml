  text: And thus his companions, being afraid, †kept me at ease†.
translation:
  language: zh_hans
  text: 就这样，他的同伴因害怕，†使我处于安逸之中†。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我处于安逸之中”：此处希腊文本明显有讹损，原句的语法和确切含义都不清楚；有些传本或校订据上下文作“把我卖给以实玛利人”。
    reason: 说明剑号所标文本疑难，并交代另一读法；正文不将推定校订冒充为确定原文。
lexical_decisions:
- source_word: οἱ μέτοχοι αὐτοῦ
  choice: 他的同伴
  rationale: μέτοχοι 指与他一同参与或结伴的人；译作“同伴”自然且不额外限定其身份。
- source_word: φοβηθέντες
  choice: 都害怕了
  rationale: 保留不定过去时分词所表达的先行或伴随原因，不补出希腊文未明说的恐惧对象。
- source_word: κατέσχεν
  choice: 把我拘留
  rationale: 按残存文本可能涉及 κατέχω（扣住、拘留）的意义处理，同时因原文语法和传本明显受损，以剑号标示存疑。
- source_word: ἐν ἀνέσει
  choice: 在安逸中
  rationale: ἀνάσις/ἄνεσις 通常有舒缓、安逸、宽松之义；采取较形式对应的译法，不凭上下文擅自改成“卖给以实玛利人”。
theological_decisions:
- issue: 残损读文是否按约瑟被卖的叙事背景补写
  choice: 保留现存希腊文的困难读法，并明确标为文本存疑
  alternative: 译作“把我卖给以实玛利人”
  rationale: 所给底本写作 ἐν †ἀνέσει με κατέσχεν†，与“卖给以实玛利人”并不直接对应；虽然后者可能来自较清楚的传本或叙事校订，但当前证据不足以在正文中无标记地取代所给原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留原版剑号以显示疑文，并用脚注说明传本差异；“拘留在安逸中”刻意保留原文的突兀和张力。
