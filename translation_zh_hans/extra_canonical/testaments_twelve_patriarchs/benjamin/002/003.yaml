  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/003.yaml
  text: And one of them, while he was striking me with a rod, was met by a lion, and the lion killed him.
translation:
  language: zh_hans
  text: 他们中有一个人正用杖抽打我时，一头狮子遇到了他，并把他杀死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδῳ
  choice: 用杖
  rationale: 保留工具格的意义；“杖”庄重而易懂，不擅自限定为鞭子或棍棒。
- source_word: μαστίζων
  choice: 抽打
  rationale: 表达反复击打、鞭笞式施打的动作，与“用杖”搭配自然。
- source_word: ὑπήντησεν αὐτῷ
  choice: 迎面扑向他
  rationale: ὑπαντάω本义为迎上、遇上；主语是狮子，译作“迎面扑向”符合语境，同时不改变事件关系。
- source_word: ἀνεῖλεν αὐτόν
  choice: 把他杀死了
  rationale: 准确表达ἀναιρέω在此处“杀死、除掉”的明确含义。
