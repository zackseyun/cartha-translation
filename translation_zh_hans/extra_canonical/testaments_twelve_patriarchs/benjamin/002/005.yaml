  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/005.yaml
  text: And they themselves did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.
translation:
  language: zh_hans
  text: 他们自己说这些话时并没有撒谎；因为他想向我隐瞒我们弟兄所做的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: 自己
  rationale: 保留强调代词的语气，并与复数主语“他们”相应。
- source_word: κρύπτειν ἀπʼ ἐμοῦ
  choice: 向我隐瞒
  rationale: 自然表达“使某事不让我知道”的含义，同时保留动作主体与对象。
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: 我们兄弟们所做的事
  rationale: ἔργα 在此指行为或所作之事；采用中性表达，不额外加入道德评判。
theological_decisions:
- issue: 前后分句主语不同
  choice: 前句用复数“他们”，后句用单数“他”
  alternative: 将两句都解释为约瑟作主语
  rationale: 希腊文 οὐκ ἐψεύσαντο 为第三人称复数，而 ἤθελεν 为第三人称单数；译文保留原文的主语转换及其潜在含混，不擅自统一。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“撒谎”准确传达 ἐψεύσαντο；“所做的事”避免生硬直译“行为/作为”，也不超出原文作负面定性。
