  text: And let such thoughts be in you, and let not these words come into the heart of my father.’
translation:
  language: zh_hans
  text: 愿你们里面有这样的意念，也愿这些话不要进入我父亲的心里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔννοιαι
  choice: 意念
  rationale: 指内在的想法、心思；“意念”既贴近原义，也符合庄重而自然的现代汉语。
- source_word: γένωνται ἐν ὑμῖν
  choice: 你们也要存
  rationale: 该表达直译为“愿……在你们里面产生/存在”；译作“要存”自然传达劝勉语气，并保留内在持守的含义。
- source_word: οἱ λόγοι οὗτοι
  choice: 这些话
  rationale: λόγοι 在此指所说的话，直接译为“这些话”。
- source_word: εἰς καρδίαν
  choice: 进入……的心
  rationale: 保留原文的空间性隐喻，不将其解释性改写为“使……忧伤”或“被……知道”。
theological_decisions:
- issue: “进入我父亲的心”的含义
  choice: 按原文保留“进入……的心”
  alternative: 让我的父亲听见这些话／使我的父亲把这些话放在心上
  rationale: 原文可涉及听闻、领会或挂怀，具体含义并未完全限定，因此不在正文中消除其含混性。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语言。“你们也要存这样的意念”与前文劝勉式语境相合；句末保留引语结束符号，以反映所给文本属于一段引语的结尾。
