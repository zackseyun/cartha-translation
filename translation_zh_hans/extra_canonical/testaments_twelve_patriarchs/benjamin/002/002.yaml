  text: And he said to me, “Yes, brother. And when they stripped me of my tunic they gave me to the Ishmaelites; and they gave me a loincloth, and after flogging me they told me to run.”
translation:
  language: zh_hans
  text: 他对我说：“是的，兄弟。他们脱去我的里衣后，把我交给了以实玛利人；又给我一条腰布，鞭打我之后，吩咐我跑。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: 长衣
  rationale: 指贴身穿着的衣服；“长衣”自然易懂，也能与后文仅供遮身的 περίζωμα 形成对比。
- source_word: Ἰσμαηλῖται
  choice: 以实玛利人
  rationale: 采用该族名在现代中文圣经语境中的通行音译。
- source_word: περίζωμα
  choice: 一块遮身布
  rationale: 指围在腰间、遮盖身体的布；此处用描述性译法，比可能引发现代内衣联想的“腰布”或“短裤”更清楚。
- source_word: φραγγελλώσαντες
  choice: 鞭打我之后
  rationale: 准确表达以鞭抽打的动作，并保留分词所表示的先行动作。
- source_word: τρέχειν
  choice: 跑
  rationale: 直译不定式，保留原文未说明奔跑目的或方向的简洁性。
