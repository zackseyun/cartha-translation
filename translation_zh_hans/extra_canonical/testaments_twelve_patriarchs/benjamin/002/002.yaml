review_pass:
  verdict: revise
  source_fidelity: “长衣”通常指外穿的长袍，容易把χιτών误解为长袍；该词在此更适宜译作“里衣”或“贴身衣”。“遮身布”虽大致可通，但未明确περίζωμα围在腰间的含义，译为“腰布”更贴切。其余动作次序、复数施事者和“交给以实玛利人”的关系均忠实保留。
  naturalness: 原译整体通顺。修订后用“脱去我的里衣”“给我一条腰布”“吩咐我跑”，叙事更自然、简洁，也保持庄重的现代书面语体。
  terminology: “以实玛利人”符合中文圣经语境。将χιτών译为“里衣”、περίζωμα译为“腰布”，能更准确地区分被剥去的衣物与随后给予的腰间遮蔽物。
  issues:
  - severity: medium
    issue: “长衣”对χιτών的指称不够准确。
    rationale: χιτών是贴身穿的 tunic，并不本义指“长衣”；“长衣”在中文中常联想到外袍，可能模糊甚至颠倒衣物层次。
  - severity: low
    issue: “一块遮身布”未充分表达περίζωμα的腰间用途。
    rationale: περίζωμα指围在腰间的布，即腰布；“腰布”在此既自然也较精确，不会增加原文没有的细节。
  revised_text: 他对我说：“是的，兄弟。他们脱去我的里衣后，把我交给了以实玛利人；又给我一条腰布，鞭打我之后，吩咐我跑。”
