  text: Do not tell my father what you did to me, but speak in this way, just as I explained to Benjamin.
translation:
  language: zh_hans
  text: “不要把你们对我所做的事告诉我父亲，而要照我向便雅悯说明的那样说。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ λέγετε
  choice: 不要……告诉
  rationale: 采用现代汉语中自然的禁止表达；结合间接宾语“我父亲”，译为“不要告诉”。
- source_word: ἃ ἐποιήσατέ μοι
  choice: 你们对我所做的事
  rationale: 保留关系从句的内容和复数主语所表达的共同责任。
- source_word: ἀλλʼ οὕτως λέξατε
  choice: 只要……那样说
  rationale: ἀλλά在否定命令之后表示转折替代；“只要”自然呈现“不要这样，反要那样”的关系。
- source_word: καθὼς ἐξηγησάμην τῷ Βενιαμίν
  choice: 照我向便雅悯说明的那样
  rationale: ἐξηγησάμην可指解释、说明或叙述；译作“说明”而不补出原文未明说的宾语，并保留与前文“那样说”的方式关系。
