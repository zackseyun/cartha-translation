base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/001.yaml
  text: And when I went into Egypt, my brother recognized me and said to me, “They smeared your tunic with blood,” they said. “See whether this is the tunic.”
translation:
  language: zh_hans
  text: 我来到埃及时，我的兄弟认出了我，对我说：“‘他们把你的长衣染上了血，’他们说。‘你认一认，看这是不是那件长衣。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的引语排列较突兀，直译近于：“‘他们把你的长衣染上了血，’他们说。‘认一认，这是不是那件长衣。’”后置的“他们说”使具体引语层次不完全明确。原文作“你的长衣”，并非“你儿子的长衣”。
    reason: 说明后置“他们说”所造成的引语关系歧义，并保留原文不寻常的第二人称所有格，避免按《创世记》叙事补改为“你儿子的长衣”。
lexical_decisions:
- source_word: ἐγνώρισέν
  choice: 认出了
  rationale: 表达辨认并确认来者身份的意思，贴合上下文，也符合现代汉语习惯。
- source_word: ὁ ἀδελφός μου
  choice: 我哥哥
  rationale: 原文只说“我的兄弟”，未出现约瑟之名；按叙事人物关系译作“我哥哥”，不擅自补名。
- source_word: ἔφυραν
  choice: 染上了
  rationale: 该动词在这里表示用血弄污、涂染衣服；“染上了血”自然且保留具体动作。
- source_word: χιτῶνα / χιτών
  choice: 长衣
  rationale: 指贴身或内层的衣袍；叙事语境中“长衣”比现代意义容易误解的“内衣”更合适，并在两处保持一致。
- source_word: Ἐπίγνωθι
  choice: 你认一认
  rationale: 保留命令语气及辨认、确认之意，语言自然，并与创世记相关叙事的措辞相呼应而不补入原文没有的信息。
theological_decisions:
- issue: 是否补出兄长的名字“约瑟”
  choice: 不补，只译“我哥哥”
  alternative: 译作“我哥哥约瑟”
  rationale: 希腊原文没有专名；虽可由上下文推知人物身份，正文仍应保持原文的指称范围。
- issue: 是否将“你的长衣”改成“你儿子的长衣”
  choice: 保留“你的长衣”
  alternative: 按创世记叙事或较顺的逻辑改为“你儿子的长衣”
  rationale: 现有希腊文本明确为第二人称单数所有格 σου，不能为消除叙事张力而无文本依据地改写。
- issue: 直接引语的层次
  choice: 将“他们说”处理为哥哥所引述之话的引介，并把后一句命令纳入同一引语
  alternative: 译成两个彼此断开的句子：“他们把你的长衣染上了血，”他们说。“你认一认……”
  rationale: 希腊语序较突兀，εἶπον 后置；汉语用嵌套引语既保留“他们说”的来源，也使话语关系清楚，没有补入新的说话者或内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“我来到埃及时”准确反映第一人称单数；引语采用双层引号梳理希腊语较突兀的语序。未补出“约瑟”或“你儿子的”，并以脚注交代真实的文本张力。
