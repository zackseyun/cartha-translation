  text: '*Ταῦτα γὰρ ὑμῖν ἀντὶ πάσης κληρονομίας καταλειμπάνω¹⁴. καὶ ὑμεῖς Γοὖν δότε αὐτὰ¹⁵ τοῖς τέκνοις ὑμῶν *εἰς κατάσχεσιν¹⁶ αἰώνιον· οὕτω¹⁷ Γγὰρ˥ ἐποίησεν¹⁸ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.'
