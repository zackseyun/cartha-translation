base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/004.yaml
  text: For these things I leave to you instead of every inheritance. And you, therefore, give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did.
translation:
  language: zh_hans
  text: 因为我把这些留给你们，代替一切遗产。所以，你们也要把这些交给你们的儿女，作为永远的产业；因为亚伯拉罕、以撒和雅各就是这样做的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ πάσης κληρονομίας
  choice: 代替一切遗产
  rationale: 保留ἀντί的替代含义，并以“遗产”表达κληρονομία在此处由父亲留给后代之物，符合上下文。
- source_word: καταλειμπάνω
  choice: 留给
  rationale: 体现将事物遗留、传给后人的意思，也与本节遗产语境自然衔接。
- source_word: δότε αὐτὰ
  choice: 把这些交给
  rationale: 直译δίδωμι的给予动作；“这些”回指本段所传授的教诲。
- source_word: εἰς κατάσχεσιν αἰώνιον
  choice: 作为永远的产业
  rationale: κατάσχεσις指持有之物或产业；“作为”自然表达εἰς在结果或用途上的意义，“永远的”对应αἰώνιον。
- source_word: καὶ ὑμεῖς οὖν
  choice: 所以，你们也要
  rationale: “所以”保留οὖν的推论关系，“也”体现καί，中文语序则作自然调整。
