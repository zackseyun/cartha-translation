review_pass:
  verdict: revise
  source_fidelity: 草稿基本涵盖希腊文所有主要成分，并正确保留括号段的文本存疑状态。然而，正文未实际显示源文的方括号，致使脚注b所说明的范围在版面上无从辨认；“各自执掌自己的权柄”把极不寻常的ἐπὶ σκήπτρον ἡμῶν较明确地释作“执掌权力”，超过原文可确定的程度；而χαρίσονται的语义及其与英语审校轨迹中“rejoice”的差异，宜在正文中采用较少定向的表达并在注中说明。
  naturalness: 原译庄重通顺，但“复起”在现代汉语中不如“起来”或“复活”自然；此处使用“起来”可保留ἀναστησόμεθα本身未明确限定的语义。“各人按着自己的权杖”虽保留原文困难之处，但配合脚注仍可理解。
  terminology: “诸天之王”忠实对应τῶν οὐρανῶν。“以人的形态，在卑微中显现”较完整地保留ἐν μορφῇ ἀνθρώπου ἐν ταπεινώσει，且不导入“道成肉身”等后设术语。对于χαρίσονται，不宜在无文本校勘依据时断言为另一读法；应仅陈明该词在此语境的解释困难及英语轨迹采用的不同理解。
  issues:
  - severity: medium
    issue: 方括号段未在中文正文中以方括号呈现。
    rationale: 希腊文从τὸν ἐπὶ γῆς φανέντα至句末置于方括号内；草稿虽有脚注b，却只在破折号后放置脚注标记，读者无法辨识被标示的具体文字范围。
  - severity: medium
    issue: “各自执掌自己的权柄”过度确定ἐπὶ σκήπτρον ἡμῶν的意义。
    rationale: 原文直观措辞是“在/按我们的权杖上”，且其句法和所指均困难；“执掌”及“权柄”增加了原文未明说的动作和抽象化解释。
  - severity: medium
    issue: “与他一同蒙恩”对χαρίσονται作了较具体的被动受恩解释。
    rationale: 所给形式χαρίσονται按通常词形关联χαρίζομαι，但其与σὺν αὐτῷ的组合在此处不易确定；英语审校轨迹又作“rejoice”。正文应避免把有争议的解释表述为确定含义。
  - severity: low
    issue: “复起”不是最自然的现代标准汉语表达。
    rationale: “起来”更自然，也较好保留ἀναστησόμεθα可表示起立或复起的未限定性。
  revised_text: 那时，我们也要起来，各人按着自己的权杖[a]，敬拜诸天之王——[那位在地上以人的形态、在卑微中显现的王；凡在地上信他的人，都要与他一同得恩惠[c]。][b]
  revised_footnotes:
  - marker: a
    text: “按着自己的权杖”直译原文不寻常的说法“在/按我们的权杖上”。“权杖”也可能引申为统治权、辖域或所属支派；原文确切所指难以确定。
    reason: 保留σκήπτρον的具体形象及ἐπὶ短语的句法和语义歧义，避免将其固定解释为“执掌权柄”。
  - marker: b
    text: 本方括号内从“那位”至本节末，照所据希腊文本以方括号标出，表示这段文字在文本传承中的地位存疑。
    reason: 使中文正文的括号范围与源文完全对应，并明确其文本批判性质。
  - marker: c
    text: “得恩惠”对应所给希腊文χαρίσονται，其确切语义及其与“与他一同”的关系不易确定。英语审校轨迹译作“欢喜”，反映了不同的文本或释义处理；本文不在正文中断定其一。
    reason: 如实说明该词的翻译困难和审校轨迹差异，而不无依据地断言存在特定异读。
  revision_rationale: 修订以所给希腊文本为优先：在正文中实际重现方括号所涵盖的全部范围；将“权柄/执掌”改为较贴近且保留困难的“按着自己的权杖”；以“起来”替代不够自然的“复起”；并以“得恩惠”暂译χαρίσονται，同时用脚注公开其语义和英语审校层处理之间的不确定性。未加入任何特定教派的基督论或末世论解释。
