  text: Τότε καὶ ἡμεῖς ἀναστησόμεθα³³ ἕκαστος *ἐπὶ σκήπτρον ἡμῶν³⁴ προσκυνοῦντες τὸν βασιλέα *τῶν οὐρανῶν³⁵ [τὸν ἐπὶ γῆς φανέντα³⁶ ἐν³⁷ μορφῇ ἀνθρώπου *ἐν ταπεινώσει³⁸, καὶ ὅσοι πιστεύσωσιν³⁹ αὐτῷ⁴⁰ ἐπὶ τῆς⁴¹ γῆς *χαρίσονται σὺν αὐτῷ⁴²].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/007.yaml
  text: Then we also will rise, each on our scepter, worshiping the king of the heavens, [the one who appeared on earth in the form of a man in humility; and as many as believed in him on the earth will rejoice with him].
translation:
  language: zh_hans
  text: 那时，我们也要复起，各自执掌自己的权柄[a]，敬拜诸天之王——[b]就是那位曾以人的形态、卑微地显现在地上的王；地上凡信他的人，都要与他一同蒙恩[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权柄”原文直译为“权杖”；这里也可能指统治权、辖域或各自所属的支派。
    reason: 说明ἐπὶ σκήπτρον ἡμῶν这一不寻常短语的字面形象和语义歧义。
  - marker: b
    text: 从“就是那位”到本节末，所据版本以方括号标出，表示这段文字的文本传承存疑。
    reason: 忠实反映源文本中的方括号，不把有疑问的段落当作毫无争议的正文。
  - marker: c
    text: “蒙恩”按所给希腊文χαρίσονται翻译；另有读法或释义作“欢喜”。
    reason: 交代希腊文本与英语审校层“rejoice”之间的差异，并保留不确定性。
lexical_decisions:
- source_word: ἀναστησόμεθα
  choice: 要复起
  rationale: 该词可指站起或从死里复起；这里与末世性的敬拜场景相连，译作“复起”既保留复活意味，也不作过度展开。
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: 各自执掌自己的权柄
  rationale: σκήπτρον本义为“权杖”，也可转指王权、统治权或所属支派；直译“在我们的权杖之上”在现代汉语中难以理解，因此以“执掌……权柄”传达其权力意象，并用脚注保留歧义。
- source_word: τὸν βασιλέα τῶν οὐρανῶν
  choice: 诸天之王
  rationale: 保留复数οὐρανῶν，不将其简化为单数“天”。
- source_word: ἐν μορφῇ ἀνθρώπου ἐν ταπεινώσει
  choice: 以人的形态、卑微地
  rationale: 分别保留“人的形态”和“卑微”两个要素，不将其系统化为特定教义术语。
- source_word: χαρίσονται σὺν αὐτῷ
  choice: 要与他一同蒙恩
  rationale: 所给希腊文为χαρίσονται，通常与恩惠、施恩或蒙恩有关；因此不直接沿用英语层的“欢喜”，并以脚注说明读法上的不确定性。
theological_decisions:
- issue: “以人的形态显现”是否直接译为“成为人”或“道成肉身”
  choice: 以人的形态……显现
  alternative: 成为人／道成肉身
  rationale: 紧贴φανέντα与μορφῇ ἀνθρώπου的措辞，避免加入原句没有明说的神学术语，同时保留其基督论张力。
- issue: 信者最终的经历
  choice: 与他一同蒙恩
  alternative: 与他一同欢喜
  rationale: 优先依据所给希腊文本χαρίσονται；鉴于英语校审层采用“欢喜”，用脚注公开文本或读法上的可能差异，而不在正文中悄然消解。
- issue: 方括号内文字的文本地位
  choice: 收入正文并加文本批判脚注
  alternative: 删除该段或不作说明地收入
  rationale: 原始材料明确用方括号标示该段，故既不擅自删除，也不掩盖其传承上的疑问。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“复起”“诸天之王”保留古代宗教文本的肃穆感；其余句法尽量清楚流畅。破折号用于自然引出同位说明，脚注则承载文本批判和词义歧义，避免正文过度晦涩。
