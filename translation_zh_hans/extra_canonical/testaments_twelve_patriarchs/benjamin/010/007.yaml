review_pass:
  verdict: revise
  source_fidelity: 译文大体保留了复起、敬拜“诸天之王”、以人的形态卑微显现，以及信者与他同享某种终末福分等要素。但“各自执掌自己的权柄”把ἐπὶ（“在……上／按……而定”这一不寻常关系）改成了“执掌”，并把复数属格“我们的”明确分配为“自己的”，解释性过强。方括号所标的存疑段落也没有在正文中以成对括号清楚呈现。χαρίσονται按字面并不等同于“欢喜”；在此上下文中其句法和词义均有困难，不能把英语审校层的“rejoice”当作无注释的替代。
  naturalness: 原文整体庄重通顺；但“各自执掌自己的权柄”虽自然，代价是遮蔽原文歧义。“曾以人的形态、卑微地显现在地上的王”中“王”重复且使同位结构略显拖沓。改为“那位……显现在地上者”更紧凑。
  terminology: “诸天之王”恰当保留τῶν οὐρανῶν的复数。“复起”可保留其既可指起身又带复活意涵的空间。对σκήπτρον宜保留“权杖”并在注中说明其可能关联权柄、辖域或支派，不应在正文预先确定为“权柄”。对χαρίσονται宜采用较宽泛的“领受恩惠”，并明确说明此处传本用词困难；不宜声称存在未提供证据的“另有读法”。
  issues:
  - severity: medium
    issue: ἐπὶ σκήπτρον ἡμῶν被译作“各自执掌自己的权柄”。
    rationale: 该译法将介词ἐπὶ所表达的关系改为“执掌”，又把“我们的权杖”解释成每人“自己的权柄”。原短语本身不寻常，可能涉及权杖、统治辖域或支派，正文应少作决定。
  - severity: medium
    issue: 源文方括号段未以完整的成对括号呈现。
    rationale: 草稿只在脚注锚点处写“[b]”，没有清楚标示从同位语开始至句末皆属方括号内的存疑文字。应以中文方括号【】保留源文的文本批判标记。
  - severity: medium
    issue: “蒙恩”将χαρίσονται处理为被动受恩，且脚注无根据地提及“另有读法”。
    rationale: 所给形式表面上是χαρίζομαι的将来中动形式，而非通常的“欢喜”形式；其在此句中的意思不够明确。应以较少限定的译语并说明传本读法在语境中的困难，不虚构具体异读。
  - severity: low
    issue: 同位语中重复“王”。
    rationale: 原文定冠词后的分词短语说明“诸天之王”，并未再次使用“王”；删去重复可更贴近原句并改善汉语节奏。
  revised_text: 那时，我们也必复起；各自按着我们的权杖[a]，敬拜诸天之王【那位以人的形态、在卑微中显现在地上的；地上凡信他的人，都将与他一同领受恩惠[c]】[b]。
  revised_footnotes:
  - marker: a
    text: “按着我们的权杖”直译可作“在我们的权杖上”。这一不寻常短语的确切关系不明；“权杖”也可能引申指统治权、辖域或所属支派。
    reason: 保留ἐπὶ σκήπτρον ἡμῶν的字面权杖意象及其未决歧义，不将其定为“执掌权柄”。
  - marker: b
    text: 从“那位”至本节末，所据版本以方括号标出，表示这段文字的传承地位存疑。
    reason: 以成对中文方括号在正文中对应源文的方括号，并说明其文本批判功能。
  - marker: c
    text: 所据希腊文本作χαρίσονται；这个形式通常与“施恩、恩惠”相关，但在这里的句法和语境中意思不甚明确。译作“领受恩惠”仅作审慎的上下文处理。
    reason: 如实交代该词的语义困难，不把英语审校层的“欢喜”或未经提供的异读当作确定的原文。
  revision_rationale: 修订以所给希腊文本为首要依据：保留“复起”“诸天之王”及“人的形态／卑微”的表达；将权杖短语改为较少解释性的译法；以完整方括号保留存疑段落；并将χαρίσονται的处理改为谨慎、透明而不虚构异读的表述。英语审校文本的“rejoice”与所给希腊词形之间存在张力，故不以其覆盖源文。
