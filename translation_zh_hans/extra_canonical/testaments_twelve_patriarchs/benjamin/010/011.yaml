source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⌜Ὑμεῖς οὖν, τέκνα μου⁶⁷, ἐὰν⁶⁸ πορευθῆτε⁶⁹ ἐν ἁγιασμῷ ⌜*ἐν ταῖς ἐντολαῖς⁷⁰ Κυρίου⌝, πάλιν κατοικήσετε⁷¹ ⌜ἐπʼ ἐλπίδι⌝ *ἐν ἐμοί⁷², καὶ συναχθήσεται⁷³ *πρὸς Κύριον⁷⁴ πᾶς Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/011.yaml
  text: You therefore, my children, if you walk in holiness in the commandments of the Lord, you will again dwell in hope with me, and all Israel will be gathered to the Lord.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们若在圣洁中遵行主的诫命，就必再次怀着盼望与我同住[a]；全以色列也必被聚集到主那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与我同住”直译可作“住在我里面”。
    reason: 希腊语 ἐν ἐμοί 的介词结构容许较字面的理解，而正文按人物相伴的语境译为自然汉语。
lexical_decisions:
- source_word: ἐν ἁγιασμῷ
  choice: 在圣洁中
  rationale: 保留介词结构及“分别为圣、圣洁生活”的含义，不把它弱化为单纯的道德修饰语。
- source_word: ἐν ταῖς ἐντολαῖς Κυρίου
  choice: 遵行主的诫命
  rationale: 汉语不能自然地直译为“在主的诫命中行走”；“遵行”表达闪语式“行走于诫命中”所指的生活实践，同时保留“主的诫命”。
- source_word: ἐπʼ ἐλπίδι
  choice: 怀着盼望
  rationale: 忠实表达“基于／带着盼望”的意思，避免译成较偏向主观把握的“信心十足”。
- source_word: συναχθήσεται πρὸς Κύριον
  choice: 必被聚集到主那里
  rationale: 保留被动语态及朝向主的意象，不额外指明施动者，也不将其解释性地改写为“归信主”。
theological_decisions:
- issue: “全以色列”的范围
  choice: 全以色列
  alternative: 所有以色列人
  rationale: 原文 πᾶς Ἰσραήλ 可具有整体、群体性的含义；直译能保留其范围及所指对象的张力，不预先限定为每一个个体或某一特定群体。
- issue: “与我同住”所表达的关系
  choice: 与我同住，并以脚注保留较字面的可能译法
  alternative: 住在我里面
  rationale: ἐν ἐμοί 字面为“在我里面”，但用于人物时可按语境表达相伴；正文采用自然汉语“与我同住”，脚注保留其形式上的歧义，不作神学化解释。
translation_notes:
  register: 采用庄重而现代的叙述语体。“我的孩子们”保留临终训诫中的亲属称呼；条件句和两个将来结果清楚分节。未把“全以色列”或被动的“聚集”作教派性展开。
