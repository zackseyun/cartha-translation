source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐλέγξει ἐν τοῖς ἐκλεκτοῖς *τῶν ἐθνῶν⁵⁸ τὸν Ἰσραήλ, ὥσπερ ἤλεγξεν τὸν Ἡσαῦ ἐν τοῖς Μαδιωαίοις τοῖς †ἀπατήσασιν⁵⁹ *ἀδελφοὺς αὐτῶν⁶⁰ [γενέσθαι διὰ τῆς πορνείας καὶ τῆς εἰδωλολατρείας, καὶ⁶¹ ἀπηλλοτριώθησαν Θεοῦ]⁶², γενόμενοι⁶³ οὖν⁶⁴ τέκνα ἐν μερίδι φοβουμένων⁶⁵ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/010.yaml
  text: And he will convict Israel among the chosen of the nations, just as he convicted Esau among the Midianites, who deceived their brothers [to become through fornication and idolatry, and they were alienated from God], thus becoming children in the portion of those who fear the Lord.
translation:
  language: zh_hans
  text: 他要在列国的蒙拣选者中责备以色列，正如他曾在米甸人中责备以扫一样；那些米甸人欺骗了自己的弟兄[a]，[因淫乱和偶像崇拜而成为……，并与上帝隔绝][b]，因此成了敬畏主的人所承受的份中的儿女[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欺骗”一词在希腊文本中有疑难标记；本译文按现存读法译出。
    reason: 提示此词的文本传承或校勘存在不确定性，而不臆造异文。
  - marker: b
    text: 方括号内的话在底本中也置于方括号内。“成为”在此没有明确补足语，且其主语以及“与上帝隔绝”的主语均不稳；故译文保留残缺和歧义，不补出具体人物或身份。
    reason: 保留底本对该段可靠性的提示，并避免以译文解决原文的句法破损。
  - marker: c
    text: 希腊文末句的主语及其与上文的关系不明确；也可理解为“他们因此成了……”。“所承受的份”直译性地保留“份”的意象。
    reason: 保留句法、指代与“份”之具体所指的真实歧义。
lexical_decisions:
- source_word: ἐλέγξει / ἤλεγξεν
  choice: 指证 / 曾指证
  rationale: 该动词可表示揭露、责备或判明有罪；“指证”保留其揭露并定罪的力度，同时不把语境过度限定为法庭审判。
- source_word: ἐν τοῖς ἐκλεκτοῖς τῶν ἐθνῶν
  choice: 在列国的蒙拣选者中
  rationale: 按希腊语属格结构直译，保留“列国”与“蒙拣选者”之间可能存在的范围或来源关系。
- source_word: πορνείας καὶ τῆς εἰδωλολατρείας
  choice: 淫乱和偶像崇拜
  rationale: 分别对应性方面的不道德与敬拜偶像，采用现代中文中清楚而庄重的常用表达。
- source_word: ἀπηλλοτριώθησαν Θεοῦ
  choice: 与上帝隔绝
  rationale: 表达从上帝那里被疏离、成为外人的状态；“隔绝”自然且保留关系断裂的力度。
- source_word: τέκνα ἐν μερίδι φοβουμένων Κύριον
  choice: 敬畏主之人所得份中的儿女
  rationale: 尽量保留“儿女”“份”和“敬畏主之人”三个意象，不将其具体化为某一宗派性的群体身份。
theological_decisions:
- issue: “列国的蒙拣选者”所指群体
  choice: 保持为“列国的蒙拣选者”
  alternative: 译作“从列国中蒙拣选的人”或“蒙拣选的外邦人”
  rationale: 原文属格可容许不止一种关系；正文不把它明确解释为来源属格，也不直接等同于“外邦人”。
- issue: 末尾“成了……儿女”的主语
  choice: 按希腊语表面衔接译出，但不在正文补明主语
  alternative: 明确译作“那些米甸人于是成了……”或“他们的弟兄于是成了……”
  rationale: 传世文本句法不稳，末尾分词与前文指代关系含混；不补明可避免替文本消除真实歧义。
- issue: 方括号内材料的地位
  choice: 保留方括号并标示残缺
  alternative: 将其无标记地并入正文，或完全删除
  rationale: 底本文本本身以方括号标示该段，且“成为”之后似有缺文；保留标记能诚实反映文本证据。
translation_notes:
  register: 采用现代、庄重而可读的普通话书面语。“蒙拣选者”“敬畏主”“所得份中的儿女”保留古代宗教文本的核心意象；对句法破损处不作顺滑化补写，而用方括号、省略号和脚注说明。
