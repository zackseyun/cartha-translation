  text: X. Ὅτε¹ δὲ *ἦν Ἰωσὴφ ἐν Αἰγύπτῳ², ἐπεθύμουν ἰδεῖν τὴν εἰδέαν³ αὐτοῦ Γκαὶ τὴν μόρφωσιν⁴ τῆς ὄψεως αὐτοῦ⁵. καὶ δι᾽ εὐχῶν Ἰακὼβ τοῦ πατρός μου⁶ εἶδον Γαὐτόν, ἐν ἡμέρᾳ γρηγορῶν, *καθ᾽ ὃ ἦν⁶ πᾶσα⁷ ἡ εἰδέα⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/001.yaml
  text: When Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, just as his whole appearance was.
translation:
  language: zh_hans
  text: 约瑟在埃及时，我渴望看见他的容貌和他脸面的形态。借着我父亲雅各的祷告，我在白天醒着时看见了他，所见正如他整个容貌的样子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδέαν
  choice: 容貌
  rationale: 此处指约瑟可见的外貌；译作“容貌”自然、庄重，也与后文“整个容貌”形成照应。
- source_word: μόρφωσιν τῆς ὄψεως
  choice: 面容的样子
  rationale: 保留“形态/样式”与“面容/外观”的组合，同时避免生硬的“面貌之形”。
- source_word: δι᾽ εὐχῶν
  choice: 借着……的祷告
  rationale: 忠实表达祷告作为看见约瑟的媒介或缘由，不进一步界定其作用机制。
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: 在白天清醒时
  rationale: 明确这不是睡梦中的景象，同时保留“白天”和“醒着”两个源文要素。
- source_word: καθ᾽ ὃ ἦν πᾶσα ἡ εἰδέα αὐτοῦ
  choice: 看清了他的整个容貌本来的样子
  rationale: 以自然汉语传达所见与约瑟真实完整外貌相符；“看清了”承接前面的“看见”，并避免句末结构生硬。
theological_decisions:
- issue: 雅各的祷告与异象之间的关系
  choice: 借着我父亲雅各的祷告
  alternative: 因我父亲雅各的祷告
  rationale: “借着”更贴近 διά 的媒介含义，也不把源文未明说的因果关系规定得过死。
- issue: 所见经历的性质
  choice: 在白天清醒时看见了他
  alternative: 在白天的异象中看见了他
  rationale: 源文强调白天醒着，却没有明用“异象”一词，因此不增添这一神学或经验类别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。首句不另加“如今/那时”等源文没有明确对应词的篇章标记；避免把清醒时的看见直接解释成梦、异象或肉眼相见。
