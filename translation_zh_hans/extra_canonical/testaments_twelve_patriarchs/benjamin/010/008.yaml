base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/008.yaml
  text: And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first concerning their unrighteousness, [because when God came to them in flesh, they did not believe him].
translation:
  language: zh_hans
  text: 众人都要复活：有的得荣耀，有的受羞辱；主必先审判以色列，追究他们的不义。[a]［因为上帝以肉身来到时，他们却不信他。］[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追究他们的不义”也可译作“因他们的不义而审判他们”。
    reason: 希腊语 περί 在审判语境中可表示审理所涉及的事项，也可在汉语中理解为审判的缘由。
  - marker: b
    text: 方括号内的话在所据希腊文本中以方括号标出，表明其文本归属存在疑问。
    reason: 如实反映来源文本的编辑标记，不把存疑文字无提示地当作确定正文。
lexical_decisions:
- source_word: ἀναστήσονται
  choice: 要复起
  rationale: 表达末世从死里起来的含义，同时保留原文未明说“从死人中”的简洁形式。
- source_word: δόξαν
  choice: 荣耀
  rationale: 采用常见且庄重的对应词，与末世所得的尊荣相称。
- source_word: ἀτιμίαν
  choice: 羞辱
  rationale: 与“荣耀”形成清楚对照，体现失去尊荣、蒙受耻辱之意。
- source_word: κρινεῖ
  choice: 审判
  rationale: 保留司法与末世审判语义，不弱化为一般性的评断。
- source_word: περὶ τῆς ἀδικίας αὐτῶν
  choice: 追究他们的不义
  rationale: περί 与审判动词连用表示审理其不义；“追究”使现代汉语关系清楚，又不把原因关系绝对化。
- source_word: παραγενόμενον Θεὸν ἐν σαρκί
  choice: 上帝以肉身来到时
  rationale: 忠实保留“上帝”“在肉身中/以肉身”“来到”的内容，避免加入原文没有的地点宾语。
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: 他们却不信他
  rationale: πιστεύω 加与格在此自然表达为“信他”；“却”呈现来到与不信之间的反差。
theological_decisions:
- issue: “上帝以肉身来到”所指身份
  choice: 直译为“上帝以肉身来到时”
  alternative: 解释为“上帝的儿子成为肉身来到他们中间时”
  rationale: 原文直接以 Θεόν 为 παραγενόμενον 的宾语性主语，并未明说“上帝的儿子”或“他们中间”；译文保留其强烈而可能引发张力的基督论表述。
- issue: 方括号内文字的文本地位
  choice: 在正文中保留方括号并加注
  alternative: 无括号并入正文，或删除该句
  rationale: 所给希腊文本明确将整段原因从句置于方括号内，译文不应悄然消除其文本不确定性。
- issue: “先审判以色列”的范围
  choice: 保留“先”
  alternative: 译为“首先在以色列中施行审判”
  rationale: ἐν πρώτοις 可表达首先、在首批之中；结合直接宾语 τὸν Ἰσραήλ，译作“先审判以色列”最自然，同时不进一步推断之后受审者。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“复起”比单用“起来”更明确指向复活，又避免补入原文未明说的成分；标点强化“有的……有的……”的对举。未采纳 latest_revisions 所给替换文本，因为其内容与本节所提供的希腊原文完全不符。
