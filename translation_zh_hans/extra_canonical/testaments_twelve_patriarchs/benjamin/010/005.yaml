  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/005.yaml
  text: For they gave us all these things as an inheritance, saying, ‘Keep the commandments of God until the time when [the Lord reveals his salvation to all the nations].’
translation:
  language: zh_hans
  text: 因为他们把这一切都赐给我们作为产业，并说：“你们要遵守上帝的诫命，直到[主向万民显明他的救恩]。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκαν ἡμῖν εἰς κληρονομίαν
  choice: 赐给我们作为产业
  rationale: 保留完成时所表达的既成赠予及其持续结果；“产业”自然传达 κληρονομία 的承受、继承含义。
- source_word: Φυλάξατε
  choice: 你们要遵守
  rationale: 在诫命语境中，φυλάσσω 指谨守、遵行；此处用现代汉语常见的命令表达。
- source_word: ἀποκαλύψει
  choice: 显明
  rationale: 既保留“揭示、使显露”的主动含义，也适合以“救恩”为宾语的汉语表达。
- source_word: τὸ σωτήριον αὐτοῦ
  choice: 他的救恩
  rationale: σωτήριον 在此为名词性用法，指上帝所施行或带来的拯救。
- source_word: πᾶσι τοῖς ἔθνεσι
  choice: 向万民
  rationale: ἔθνη 可指各民族或列国；“万民”在救恩普及的语境中简洁自然，并保留普世范围。
theological_decisions:
- issue: 方括号内文本的文本批判状态
  choice: 保留原文所示方括号
  alternative: 去掉方括号，将该短语直接纳入正文
  rationale: 来源文本用方括号标示“主向万民显明他的救恩”，应保留其文本状态，不将存在的传本疑问静默消除。
- issue: “他的救恩”所指
  choice: 保持代词表达，不扩展为特定基督论解释
  alternative: 译为“主自己的救恩”或明确指某位救主
  rationale: 希腊文仅有 αὐτοῦ，译文不应加入原文未明说的神学指向。
