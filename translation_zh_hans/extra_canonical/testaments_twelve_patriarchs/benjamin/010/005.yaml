  choice: 保留原文所示方括号
  alternative: 去掉方括号，将该短语直接纳入正文
  rationale: 来源文本用方括号标示“主向万民显明他的救恩”，应保留其文本状态，不将存在的传本疑问静默消除。
- issue: “他的救恩”所指
  choice: 保持代词表达，不扩展为特定基督论解释
  alternative: 译为“主自己的救恩”或明确指某位救主
  rationale: 希腊文仅有 αὐτοῦ，译文不应加入原文未明说的神学指向。
