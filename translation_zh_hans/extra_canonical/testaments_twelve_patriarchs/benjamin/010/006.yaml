review_pass:
  verdict: revise
  source_fidelity: 原文预告听者将看见以诺、塞特、亚伯拉罕、以撒和雅各；这些人物以完成分词形式被描述为已经复活／起来，并位于“他”的右边，且处于强烈喜乐中。现译基本涵盖人名、将来时、右边和喜乐，但“复起”在现代汉语中不够自然，且“在他右边复起”容易误读为在该地点执行“再起”的动作，而非复活后所处的位置。
  naturalness: “满心欢喜”自然，但全句的“在他右边复起”搭配生硬。改为并列的状态描写，更符合现代标准汉语，也更清楚呈现分词所带出的复活、位置与喜乐。
  terminology: 人名均采用通行中文圣经译名。保留“他”以维持αὐτοῦ在本句中未明说先行词的上下文依赖性；以“复活”表达末世语境中ἀνασταμένους的通常意义，不把“他”解释为神或主。
  issues:
  - severity: medium
    issue: “复起”及“在他右边复起”的表达不够自然且可能造成句法歧义。
    rationale: ἀνασταμένους在此语境下适宜译作“复活”；ἐκ δεξιῶν αὐτοῦ描述他们所在的位置。译为“复活，站在他右边”能清楚区分这两层意思，而不增加人物身份或神学解释。
