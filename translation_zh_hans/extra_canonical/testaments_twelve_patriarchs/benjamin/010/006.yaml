  text: And then you will see Enoch and Seth and Abraham and Isaac and Jacob raised up at his right hand in rejoicing.
translation:
  language: zh_hans
  text: 那时，你们将看见以诺、塞特、亚伯拉罕、以撒和雅各复活，站在他右边，欢喜快乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψεσθε
  choice: 你们将看见
  rationale: 保留第二人称复数和将来时，符合直接对听众说话的语气。
- source_word: ἀνασταμένους
  choice: 复起
  rationale: 该分词可表示起身或从死里复起；上下文涉及先祖，译作“复起”既自然地指向复活，又不额外补入原文未明说的“从死里”。
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: 在他右边
  rationale: 按希腊语方位表达直译；“他”的所指在本句中保持原有的上下文依赖性。
- source_word: ἐν ἀγαλλιάσει
  choice: 满心欢喜
  rationale: 表达强烈喜乐的状态，比生硬的“在欢腾中”更符合现代汉语，同时不增添原因。
theological_decisions:
- issue: ἀνασταμένους 是否明确译为复活
  choice: 复起
  alternative: 站起来／复活
  rationale: “复起”保留起身与复活之间的语义联系，避免将原文本句的含义收窄为普通站立，也避免用“从死里复活”作解释性扩充。
- issue: αὐτοῦ 的指称
  choice: 保留为“他”
  alternative: 明确译为“神”或“主”
  rationale: 本句自身没有明示先行词，因此不替原文消除指称上的上下文依赖。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；人名依通行圣经译名处理。源文本中的校勘符号和星号不属于正文，未纳入译文。所附 latest_revisions 内容与本节希腊文不相符，因此未据其改写。
