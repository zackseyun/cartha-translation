lexical_decisions:
- source_word: Καὶ ταῦτα εἰπὼν λέγει αὐτοῖς
  choice: 他说完这些话，又对他们说
  rationale: 以自然的现代汉语表达分词结构；λέγει采用叙事现在时的常规汉译“说”，并以“又”承接上下文。
- source_word: Γινώσκετε οὖν
  choice: 所以……你们要知道
  rationale: 保留οὖν的推论衔接，并将命令式Γινώσκετε译为自然且明确的劝告/命令表达。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留亲属称谓及复数含义，符合临终训诫的亲切语气。
- source_word: ἀποθνῄσκω
  choice: 我快要死了
  rationale: 希腊语现在时在此语境表示死亡临近；“快要死了”比孤立的“我死”更符合现代汉语，也不额外指定确切时刻。
