base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/003.yaml
  text: Therefore, each one should practice truth toward his neighbor, and keep the law of the Lord and his commandments.
translation:
  language: zh_hans
  text: 所以，你们每个人都要以诚实待邻舍，并遵守主的律法和他的诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσατε ... ἀλήθειαν
  choice: 要以诚实待
  rationale: 直译为“行真实”在现代汉语中生硬；此处是要求人在与邻舍的关系中践行真实、诚信，因此译作“以诚实待”，既自然又保留行为层面的含义。
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: 你们每个人都要……待邻舍
  rationale: ἕκαστος 强调群体中的每一个人；πλησίον 采用经文语域中清楚而庄重的“邻舍”。
- source_word: τὸν νόμον Κυρίου
  choice: 主的律法
  rationale: 保留 νόμος 的宗教及伦理含义，并维持其与后文“诫命”的区分。
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: 他的诫命
  rationale: 按原文保留复数及所有关系；“他”指前面的“主”。
- source_word: φυλάξατε
  choice: 遵守
  rationale: 在律法与诫命的语境中，“遵守”自然表达谨守、实行之意。
theological_decisions:
- issue: “律法”与“诫命”的关系
  choice: 并列保留“主的律法和他的诫命”
  alternative: 将二者合并为“主的律法诫命”
  rationale: 原文明确并列 νόμον 与 ἐντολάς；合并会削弱原有的双重表述。
- issue: “诚实/真实”的伦理范围
  choice: 译为关系性的“以诚实待邻舍”
  alternative: 译为较抽象的“向邻舍行真理”
  rationale: 原文表达的是对邻舍实行 ἀλήθεια，不宜将其专门化为教义意义上的“真理”，也不将其缩减为只说真话。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“所以”承接上文推论；用“你们每个人”显明复数命令所针对的群体，并保留逐人责任。
