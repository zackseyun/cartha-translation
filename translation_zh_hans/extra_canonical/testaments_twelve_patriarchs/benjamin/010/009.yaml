  text: And then he will judge all the nations, [as many as did not believe him when he appeared on earth].
translation:
  language: zh_hans
  text: 那时，他要审判所有的民族，[那些在他显现于世时不信他的人]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些在他显现于世时不信他的人”在所据希腊文本中置于方括号内，表示这部分文字的文本见证或原始性存疑。
    reason: 如实传达源版对该从句所标示的文本不确定性。
lexical_decisions:
- source_word: κρινεῖ
  choice: 要审判
  rationale: 保留将来时和司法性的核心含义。
- source_word: πάντα τὰ ἔθνη
  choice: 所有的民族
  rationale: ἔθνη 可指列国、万民或外邦人；此处采用较中性且贴近原文的“民族”，不预设特指外邦人。
- source_word: ἐπίστευσαν αὐτῷ
  choice: 信他
  rationale: 与希腊语所表达的对某人的相信或信靠自然对应。
- source_word: ἐπὶ τῆς γῆς φανέντι
  choice: 在他显现于世时
  rationale: φανέντι 为与 αὐτῷ 呼应的过去分词，意为“显现”；“于世”自然表达“在地上”，同时保留其公开出现的含义。
theological_decisions:
- issue: 方括号内文字的文本地位
  choice: 正文保留，并以脚注标明其文本上的括注性质
  alternative: 不加说明地并入正文，或直接删去
  rationale: 源文本以方括号标出该从句，表明其文本见证或编辑地位可能有疑问；译文不应擅自确定或删除。
- issue: 审判对象的范围
  choice: 将后半句译作对“所有的民族”的限定说明
  alternative: 把后半句处理为独立补充，或理解为所有民族无一例外都不信
  rationale: ὅσα 引出范围性说明，但原文的句法和逻辑仍略有张力；译文用“就是那些”清楚呈现最自然的关系，同时不扩展为系统性教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那时……要……”自然表达叙事中的将来事件；避免使用带有特定宗派色彩的术语。
