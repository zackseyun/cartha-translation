  text: 'The Copy of the Words of Benjamin[a], the twelfth son of Jacob, which he set in order for his sons, having lived one hundred and twenty-five years.


    And after kissing them, he said:


    Just as Isaac was born to Abraham in his old age, so I also was born to Jacob. And since Rachel my mother died while giving birth to me, I had no milk; so I was nursed by Bilhah, her maidservant. For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and after conceiving she bore me. For my father loved Rachel exceedingly, and he prayed to see two sons from her. Because of this I was called Benjamin[b], which means son of days.'
translation:
  language: zh_hans
  text: '《便雅悯遗训》


    雅各与拉结的第十二个儿子便雅悯的遗言。


    1 以下是便雅悯的话的抄本[a]，是他享年一百二十五岁、留给儿子们的嘱咐。


    2 他亲吻了他们，然后说：


    “正如以撒是在亚伯拉罕年老时出生的，我也生于雅各。3 我母亲拉结生我时去世了，我没有奶可吃；于是我由她的婢女辟拉哺乳。4 拉结生下约瑟后，十二年一直不能生育。她禁食，向主祷告；后来怀了孕，便生下我。5 因为我父亲深爱拉结，祈求能看见她生下两个儿子。6 因此，我名叫便雅悯[b]，意思是‘日子之子’。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“抄本”译自希腊语 ἀντίγραφον，指便雅悯所说之话的书面副本。
    reason: lexical_clarity
  - marker: b
    text: 本书的希腊文本把“便雅悯”解释为“日子之子”；这与通常依据该名字的希伯来语所作的“右手之子”解释不同。
    reason: cross_reference
lexical_decisions:
- source_word: ἀντίγραφον λόγων
  choice: 话的抄本
  rationale: ἀντίγραφον 指副本或抄本，λόγων 指所说的话；按希腊正文直译，同时保持中文自然。
- source_word: διέθετο
  choice: 向众子所作的安排
  rationale: 该动词在遗训语境中带有郑重安排、嘱托之意；不径直译成“立约”或“遗嘱”，以免加入过强的法律或神学含义。
- source_word: Καταφιλήσας
  choice: 亲吻了
  rationale: 复合动词含亲切、深情亲吻之意；中文以“亲吻了他们”自然表达，不刻意渲染动作次数。
- source_word: ἐν γήρει αὐτοῦ
  choice: 年老时
  rationale: 简洁传达“在他的老年”，符合现代汉语叙事习惯。
- source_word: τέθνηκε γεννῶσά με
  choice: 生我时去世了
  rationale: 分词表达拉结在生产便雅悯之际死亡；译文保留两事的时间联系。
- source_word: γάλα οὐκ ἔσχον
  choice: 我没有母乳
  rationale: 原文直为“我没有奶”；加“母”明确这里指婴儿未能从生母得到乳汁，而不改变上下文含义。
- source_word: ἐθήλασα
  choice: 乳养了我
  rationale: 原句形式可直译为“我吃她的奶”；中文主动表达更自然，并清楚交代辟拉是乳养者。
- source_word: ἐστείρευσεν
  choice: 不能生育
  rationale: 比“绝育”或带贬义的旧式措辞更自然、尊重，同时准确表达十二年间不育。
- source_word: πρὸς Κύριον
  choice: 向主
  rationale: 保留祷告的方向性，并按宗教语境将 Κύριος 译为“主”。
- source_word: μετὰ νηστείας
  choice: 禁食
  rationale: 以现代中文动词结构表达“伴随禁食”，简洁清楚。
- source_word: συλλαβοῦσα
  choice: 后来怀了孕
  rationale: 自然表达先怀孕、后生产的时间次序。
- source_word: Σφόδρα ἠγάπα
  choice: 深爱
  rationale: 凝练传达 σφόδρα 所强调的强烈程度，同时保持庄重。
- source_word: υἱὸς ἡμερῶν
  choice: 日子之子
  rationale: 严格保留希腊文本给出的字面释名，不与《创世记》中较常见的希伯来语词源解释调和。
theological_decisions:
- issue: 希腊文本对“便雅悯”之名的解释
  choice: 译作“日子之子”
  alternative: 按希伯来语传统译作“右手之子”，或解释为“晚年之子”
  rationale: 本段明说 ὅ ἐστιν υἱὸς ἡμερῶν。翻译应首先呈现现有希腊见证，并以脚注提示它与《创世记》常见解释之间的张力，而不擅自调和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。标题依希腊卷首题名处理，正文保留章内编号。避免古奥的“乳哺”“不妊”等措辞；在名字释义处保留希腊见证特有的文本张力。所有脚注标记均置于正文相应位置。
