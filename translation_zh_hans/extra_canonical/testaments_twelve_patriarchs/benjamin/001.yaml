revisions:
- from: '《便雅悯遗训》


    雅各和拉结的第十二个儿子便雅悯的遗言。


    一 以下是便雅悯的话的抄本[a]，是他活到一百二十五岁时向众子所作的安排。


    2 他亲吻了他们，然后说：


    “正如以撒是亚伯拉罕年老时所生的，我也是雅各年老时所生的。3 我母亲拉结生我时去世了，所以我没有母乳；于是，她的婢女辟拉乳养了我。4 拉结生下约瑟之后，十二年不能生育。她禁食，向主祷告；后来怀了孕，生下我。5 因为我父亲深爱拉结，祈求能看见她为他生两个儿子。6 因此，我名叫便雅悯[b]，意思是‘日子之子’。”'
  to: '《便雅悯遗训》


    雅各与拉结的第十二个儿子便雅悯的遗言。


    1 以下是便雅悯的话的抄本[a]，是他享年一百二十五岁、留给儿子们的嘱咐。


    2 他亲吻了他们，然后说：


    “正如以撒是在亚伯拉罕年老时出生的，我也生于雅各。3 我母亲拉结生我时去世了，我没有奶可吃；于是我由她的婢女辟拉哺乳。4 拉结生下约瑟后，十二年一直不能生育。她禁食，向主祷告；后来怀了孕，便生下我。5 因为我父亲深爱拉结，祈求能看见她生下两个儿子。6 因此，我名叫便雅悯[b]，意思是‘日子之子’。”'
  rationale: 修订删除了原文未加于雅各的“年老时”，并把有关乳养的两句改为现代汉语中主语清楚、搭配自然的表达。首句将“活了一百二十五年”的分词妥善处理为“享年一百二十五岁”，不再暗示这是安排发生的特定时点。脚注b亦改为准确描述希腊文本释义与通常希伯来语解释的差异。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:19:55Z'
review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿在第2节将“年老时”同时加到雅各身上，但希腊文的 ἐν γήρει αὐτοῦ 只修饰亚伯拉罕；便雅悯仅说自己生于雅各。此外，“我没有母乳”在现代汉语中容易被理解为说话者自己有无乳汁，而非婴儿无奶可吃。
  naturalness: 整体庄重通顺，但“辟拉乳养了我”搭配不够自然；改为“我由……哺乳”更符合现代书面汉语。“活到一百二十五岁时向众子所作的安排”也将分词不必要地处理为该安排发生的时间。
  terminology: 人名“便雅悯、拉结、辟拉、约瑟”和“主”均可保留。“日子之子”应忠实保留为本希腊见证的内部释义。脚注不宜说《创世记》35:18本身直接给出“右手之子”的释义；应说这是通常基于希伯来名字作出的解释。
  issues:
  - severity: high
    issue: 第2节把“年老时”加于雅各
    rationale: 原文“正如以撒在亚伯拉罕年老时出生，我也照样生于雅各”中，ἐν γήρει αὐτοῦ 位于亚伯拉罕的比较分句；后句没有“雅各年老时”。
  - severity: medium
    issue: “我没有母乳”语义主语不自然
    rationale: γάλα οὐκ ἔσχον 是便雅悯作为婴儿“没有奶可吃”，不是指他自身有无母乳。
  - severity: medium
    issue: “辟拉乳养了我”不合现代常用搭配
    rationale: 应以“我由她的婢女辟拉哺乳”或“辟拉给我喂奶”表达 ἐθήλασα，既自然又明确。
  - severity: low
    issue: 脚注b对《创世记》35:18的表述过强
    rationale: 该节叙述拉结称儿子为便俄尼、雅各改称便雅悯，并未直接在该处明说“右手之子”；宜改述为通常的希伯来语名字解释。
