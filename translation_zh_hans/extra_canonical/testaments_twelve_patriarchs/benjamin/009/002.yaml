source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πλὴν ἐν μερίδι ὑμῶν γενήσεται *ναὸς Θεοῦ¹⁴, καὶ *ἔσται ὁ ἔσχατος ἔνδοξος¹⁵ *ὑπὲρ τὸν πρῶτον¹⁶, καὶ *συναχθήσονται ἐκεῖ¹⁷ αἱ¹⁸ δώδεκα φυλαί, καὶ πάντα τὰ ἔθνη ἕως οὗ ὁ ὕψιστος ἀποστείλῃ¹⁹ τὸ σωτήριον αὐτοῦ²⁰ ἐν ἐπισκοπῇ μονογενοῦς προφήτου²¹. [3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/002.yaml
  text: Nevertheless, in your allotted portion there will be the temple of God, and the latter will be more glorious than the former; and there the twelve tribes and all the nations will be gathered, until the Most High sends his salvation in the visitation of an only-begotten prophet.
translation:
  language: zh_hans
  text: 然而，在你们所得的份地上，必有上帝的殿；后来的殿要比先前的殿更荣耀。十二支派和万国都要聚集在那里，直到至高者在一位独生先知的眷临中，差来他的救恩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “独生”也可译作“独一无二”；“眷临”也可指察看或看顾。原文没有明确说明这位先知与“眷临”之间的具体关系。
    reason: 说明μονογενής和ἐπισκοπή的词义范围，并保留属格结构的真实歧义。
lexical_decisions:
- source_word: ἐν μερίδι ὑμῶν
  choice: 在你们所得的份地上
  rationale: μερίς在此指分配所得的地域或产业；“份地”既保留分配含义，也符合支派领地的语境。
- source_word: ναὸς Θεοῦ
  choice: 上帝的殿
  rationale: ναός侧重圣殿本身；中文用“上帝的殿”自然、庄重，也不额外限定具体建筑。
- source_word: ὁ ἔσχατος … τὸν πρῶτον
  choice: 后来的殿……先前的殿
  rationale: 定冠词加形容词承接前面的“殿”；这里表达前后两者的对比，而非抽象的“末一个”和“第一个”。
- source_word: συναχθήσονται
  choice: 要聚集
  rationale: 保留被动形式所表达的汇聚含义，同时不擅自补明聚集者。
- source_word: τὸ σωτήριον αὐτοῦ
  choice: 他的救恩
  rationale: σωτήριον可指救恩、拯救或施救之物；“救恩”保留其宽广而具神学分量的含义。
- source_word: ἐν ἐπισκοπῇ
  choice: 在……眷临中
  rationale: ἐπισκοπή可表示察看、看顾或临到；“眷临”兼具临到与关顾之意，不将其缩窄为行政性的“监督”。
- source_word: μονογενοῦς προφήτου
  choice: 一位独生先知
  rationale: μονογενής可表示独生或独一无二；正文采用较贴近字面的“独生”，并以脚注保留词义范围与结构上的不确定性。
theological_decisions:
- issue: “独生先知”与“眷临”的关系
  choice: 在一位独生先知的眷临中
  alternative: 借着一位独一无二的先知来眷临
  rationale: 希腊文以ἐν ἐπισκοπῇ加属格短语表达，具体关系并未完全明说。正文保留名词结构，避免直接断定先知是眷临的施行者或媒介。
- issue: “后来的”与“先前的”所指
  choice: 明确补出“殿”
  alternative: 后者……前者
  rationale: 希腊文依靠冠词化形容词回指ναός。中文补出“殿”可消除不必要的指代含混，同时不改变原文比较关系。
- issue: 是否纳入随后标作第3节的括号文字
  choice: 不纳入本节正文
  alternative: 以方括号附录第3节开头
  rationale: 请求的经文编号为9:2，而所给希腊文已明确以“[3.”标示后续内容属于下一节；本稿按节界止于“先知”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“份地”“上帝的殿”“至高者”“眷临”等用语保留古代宗教文本的分量；句法经过适度拆分，以清楚呈现殿的前后对比，以及十二支派与万国同为“聚集”的主体。
