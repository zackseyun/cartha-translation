source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '[3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/003.yaml
  text: And he will enter into the first temple, and there the Lord will be insulted and will be lifted up on wood.[a]
translation:
  language: zh_hans
  text: '[3] 他将进入第一座圣殿；在那里，主将受凌辱，并被举在木头上。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第3—5节在抄本传承中的文本并不确定，常被视为后来的扩充；这里仍予翻译，因为所提供的希腊文本收录了这些经节。
    reason: textual_variant
lexical_decisions:
- source_word: τὸν πρῶτον ναόν
  choice: 第一座圣殿
  rationale: 保留序数“第一”及 ναός 的圣殿含义；用量词“座”使现代汉语自然，不推断具体所指。
- source_word: ὑβρισθήσεται
  choice: 将受凌辱
  rationale: 该被动动词可表示遭侮辱、虐待或凌辱；“受凌辱”既保留受辱意味，也不把范围收窄为言语上的辱骂。
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: 被举在木头上
  rationale: 直译 ξύλον 为“木头”，保留其可能指木材、木架或刑具的语义张力，不直接解释为“十字架”；“被举”对应被动语态。
theological_decisions:
- issue: “主”与被举者的主语关系
  choice: 用“主将受凌辱，并被举……”使两个被动谓语自然共用“主”这一主语
  alternative: 译作“主将受凌辱，而他将被举在木头上”
  rationale: 希腊文第二个动词未另列主语，最自然地承接 Κύριος；避免用代词造成可能另有所指的歧义。
- issue: “木头”是否明确解释为十字架
  choice: 保留“木头”
  alternative: 译作“十字架”或“木架”
  rationale: 原文 ξύλον 并未明说“十字架”；保留直译可避免把后来的基督教识别直接写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“圣殿”“主”“受凌辱”符合宗教文本语域；“木头”有意保留原文较为具体却未完全解释的措辞。
