- from: 我还要把义人以诺话语中所记的事告诉你们：你们将行所多玛那样的淫乱，并将灭亡片时。此后你们将再次复兴，但主的国不在你们中间。
  to: 我还要把义人以诺的话中所说的事告诉你们：你们将行所多玛那样的淫乱，并且将灭亡片刻。此后你们将再次得以更新，主的国却将不在你们中间。
  rationale: 修订明确原文末句的将来时，并以“得以更新”保留ἀνανεωθήσεσθε的被动和更新含义；其余调整旨在提升现代汉语自然度，不增添原文未明言的施事者、罪行细节或神学调和。
