id: T12P.BEN.9.1
reference: Testament of Benjamin 9:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: IX. Λέγω δὲ ὑμῖν καὶ πράξεις ἀπὸ λογίων Ἐνὼχ τοῦ δικαίου, *ὅτι πορνεύ(σ)ετε¹ πορνείαν Σοδόμων καὶ ἀπολε(ῖ)σθε ἕως βραχύ. Καὶ πάλιν ἀνανεωθήσεσθε καὶ ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/001.yaml
  text: And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again, and the kingdom of the Lord will not be among you.
translation:
  language: zh_hans
  text: 我还要把义人以诺的话中所说的事告诉你们：你们将行所多玛那样的淫乱，并且将灭亡片刻。此后你们将再次得以更新，主的国却将不在你们中间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράξεις ἀπὸ λογίων
  choice: 话语中所记的事
  rationale: πράξεις 在此与 ἀπὸ λογίων 相连，直译为“出自话语的事迹”略显生硬；此译保留“所述之事”的含义，并使现代汉语自然。
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: 义人以诺
  rationale: 保留属格称谓的传统而自然的汉语表达。
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: 行所多玛那样的淫乱
  rationale: 同源动词与名词构成强调；汉语不机械重复，而以“行……淫乱”表达，并保留其与所多玛相关的宽泛性，不擅自限定具体行为。
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: 灭亡片时
  rationale: 保留 ἀπόλλυμι 的强烈语义和 ἕως βραχύ 的短暂时间含义；不将其弱化为单纯受苦。
- source_word: ἀνανεωθήσεσθε
  choice: 再次复兴
  rationale: 该被动式表示重新得以更新；“复兴”在群体语境中较自然，同时保留恢复、更新之意。
- source_word: ἡ βασιλεία Κυρίου
  choice: 主的国
  rationale: 以常见而庄重的圣经汉语表达 βασιλεία，既可涵盖国度，也可涵盖统治。
theological_decisions:
- issue: “所多玛的淫乱”的具体所指
  choice: 所多玛那样的淫乱
  alternative: 所多玛的奸淫／同性性行为
  rationale: 原文只说 πορνείαν Σοδόμων，语义具有概括性；不以解释性翻译将其限定为某一种具体罪行。
- issue: ἀνανεωθήσεσθε 的被动施事者
  choice: 你们将再次复兴
  alternative: 主将使你们再次复兴
  rationale: 希腊文未明说施事者，因此保留被动含义，不补入“主”。
- issue: “主的国不在你们中间”的张力
  choice: 但主的国不在你们中间
  alternative: 主的国将不在你们中间／主的统治不属于你们
  rationale: οὐκ ἔσται 是将来式，但汉语在预言语境中用“不在”已可表达未来；保留“再次复兴”之后仍有否定判断的文本张力，不加解释调和。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“灭亡片时”略带经文体色彩，但简洁地保留了原文关于毁灭与短暂性的并置；全节不添加原文没有的因果、施事者或末世解释。
