review_pass:
  verdict: revise
  source_fidelity: 译文总体传达了以诺预言、所多玛相关的淫乱、短暂灭亡、再度更新及主的国不在其间的次序。惟原文οὐκ ἔσται为将来时，宜在汉语中明确为“将不在”；ἀνανεωθήσεσθε为被动，宜保留“得以更新”而非较具主动兴盛色彩的“复兴”。
  naturalness: “灭亡片时”略显生硬，改为“灭亡片刻”较合现代汉语，同时仍保留短暂时间与灭亡的并置。“义人以诺话语中所记的事”可简化为“义人以诺的话中所说的事”。
  terminology: “义人以诺”“主的国”“所多玛那样的淫乱”均可接受；后者不把原文宽泛的πορνείαν Σοδόμων限定为某一具体性行为。
  issues:
  - severity: medium
    issue: 未来时未明确表达
    rationale: 原文“ἡ βασιλεία Κυρίου οὐκ ἔσται”含将来式“将不会是／将不在”。在此预言性语境中，中文宜明示“将不在”，避免读作现时陈述。
  - severity: low
    issue: “再次复兴”未充分保留被动的更新语义
    rationale: ἀνανεωθήσεσθε是“将被更新／将得以更新”。“复兴”可指群体恢复，却较弱化“更新”且不显被动。
  - severity: low
    issue: 个别措辞不够自然
    rationale: “灭亡片时”不如“灭亡片刻”自然；“话语中所记的事”也可更简洁。
  revised_text: 我还要把义人以诺的话中所说的事告诉你们：你们将行所多玛那样的淫乱，并且将灭亡片刻。此后你们将再次得以更新，主的国却将不在你们中间。
