  text: Καὶ ἔσται τὸ ἅπλωμα τοῦ ναοῦ σχιζόμενον²⁴ καὶ μεταβήσεται²⁵ τὸ πνεῦμα τοῦ Θεοῦ ἐπὶ τὰ ἔθνη, ὥσπερ²⁶ πῦρ ἐκχυνόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/004.yaml
  text: And the veil of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out.
translation:
  language: zh_hans
  text: 圣殿的幔子将要裂开，神的灵将转而临到列国，如同倾泻而出的火。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅπλωμα τοῦ ναοῦ
  choice: 圣殿的幔子
  rationale: ἅπλωμα本指铺开或展开之物；在圣殿语境中指悬挂展开的幔子。译作“幔子”自然、庄重，也保留具体意象。
- source_word: σχιζόμενον
  choice: 裂开
  rationale: 分词表达将发生的撕裂或裂开；“裂开”准确而不额外说明施事者。
- source_word: μεταβήσεται
  choice: 将转向
  rationale: 该动词可表示越过、转移或转往。这里与ἐπὶ τὰ ἔθνη连用，描写神的灵转而临到列国；“转向”保留方向变化，又避免把含义限定为单纯空间移动。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 可指各国、外邦人或诸民族。译作“列国”保留其群体与民族层面的广度，不预先限定为某一神学术语。
- source_word: πῦρ ἐκχυνόμενον
  choice: 倾泻而出的火
  rationale: 保留ἐκχυνόμενον“被倾倒、倾泻”的动态形象，并以自然中文呈现火如液体般倾泻的强烈比喻。
theological_decisions:
- issue: 神的灵与列国之间的动作关系
  choice: 将转向列国
  alternative: 将越过而临到列国／将转移到列国
  rationale: μεταβήσεται具有移动、越过或转移的语义空间。“转向列国”既表达方向性变化，也不擅自断定神的灵完全离开先前对象，保留原文可能具有的神学张力。
- issue: τὰ ἔθνη的身份范围
  choice: 列国
  alternative: 外邦人／万民
  rationale: “列国”较贴近复数名词的字面范围，既可涵盖非犹太民族，也不把文本过早解释为特定群体或普世化的“万民”。
translation_notes:
  register: 采用现代、庄重且易懂的经文体。句式紧凑，保留圣殿幔子裂开、神的灵转向列国以及火被倾泻出来的连续末世性意象；正文无脚注标记。
