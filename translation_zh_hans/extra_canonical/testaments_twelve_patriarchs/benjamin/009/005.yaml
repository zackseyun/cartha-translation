base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/005.yaml
  text: And having gone up from Hades, he will pass from earth to heaven. And I knew how lowly he would be on earth, and how glorious in heaven.
translation:
  language: zh_hans
  text: 他从阴间上来后，将从地上升到天上。我得知他在地上会何等卑微，在天上会何等荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  choice: 阴间
  rationale: 指死者所在之境，采用现代中文圣经语境中自然且不过度限定其性质的译法，避免译作“地狱”而引入刑罚含义。
- source_word: ἀνελθὼν
  choice: 上来以后
  rationale: 保留不定过去主动分词所表达的先行动作，即先从阴间上来，随后从地上升到天上。
- source_word: μεταβαίνων
  choice: 升到
  rationale: 原词基本义为转往、移往；因方向是从地到天，以“升到”形成自然中文，同时保留空间移动之意。
- source_word: ἔγνων
  choice: 我也知道
  rationale: 希腊文为不定过去时，在叙事中指说话者已经得知；现代中文“知道”本身通常不标时态，结合后文“将”即可自然表达过去所得的认识。
- source_word: ταπεινὸς
  choice: 卑微
  rationale: 既可描述低下、谦卑或受降卑的状态；“卑微”在此保留其身份与处境上的低微含义，不擅自解释为主观谦逊。
- source_word: ἔνδοξος
  choice: 荣耀
  rationale: 与“卑微”形成鲜明对照，表达在天上的荣美和尊荣。
theological_decisions:
- issue: ᾅδης所指为何
  choice: 阴间
  alternative: 地狱
  rationale: 原词指死者之境，本句只陈述从其中上来，并未明确表达最终刑罚之地，因此采用较中性的“阴间”。
- issue: ταπεινός应理解为品格谦卑还是处境卑微
  choice: 卑微
  alternative: 谦卑
  rationale: 上下文将其与天上的“荣耀”对举，更可能侧重地上的低微状态；译文保留一定语义张力，不将其完全限定为品格。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；用“何等……又是何等……”再现两个οἷος结构的平行和感叹力度。未增添原文没有明确说明的主语身份或教义解释。
