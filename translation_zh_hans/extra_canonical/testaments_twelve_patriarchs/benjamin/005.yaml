  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005.yaml
  text: '1[a]. If, then, you also have a good mind, even wicked people will be at peace with you, and the lawless[b], being put to shame before you, will turn back to what is good; and those who are greedy will not only withdraw from their passion, but will also give to those in distress the things of greed that they had possessed.


    2. If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.


    3. For where there is the fear of good works and light in the mind, darkness flees away from it.


    4. For if anyone does violence to a holy man, he changes his mind; for the holy one has mercy on those who revile him and keeps silent.


    5. And if anyone betrays a righteous soul and insults a righteous soul, the righteous man prays; and even if for a little while he is brought low, before long he appears far more radiant[e][d][c], as Joseph my brother also became.'
translation:
  language: zh_hans
  text: '《便雅悯遗训》第5章


    1 所以，你们若也存良善的心志，恶人也会与你们和睦；放荡不羁的人[a]在你们面前感到羞愧，就会回转归向良善；贪婪的人不但会离弃自己的欲念，也会把那些与贪婪有关、他们原先拥有的财物[b]送给困苦的人。


    2 你们若行善，就连污灵也会逃离你们，野兽也会惧怕你们。


    3 因为哪里有对善行的敬畏[c]，有心里的光，黑暗就从那里逃走。


    4 若有人凌辱圣洁的人，他就会回心转意[d]；因为那圣洁的人怜悯辱骂他的人，默不作声。


    5 即使有人出卖义人，义人仍会祷告；他纵然暂时受屈，不久也会显得更加光辉[e]，正如我兄弟约瑟一样。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放荡不羁的人”也可译作“挥霍无度的人”或“行为不检的人”。希腊词ἄσωτοι可兼有放纵、挥霍和不受约束之意。
    reason: lexical_alternative
  - marker: b
    text: 直译为“贪婪之物”；也可能指“因贪欲而得的财物”或“以贪婪手段取得的收益”。
    reason: lexical_alternative
  - marker: c
    text: “对善行的敬畏”原文含义不易确定，也可能指“善行所产生的敬畏”或“善良生活使人产生的畏惧”。
    reason: alternative_reading
  - marker: d
    text: “回心转意”所译的希腊词μετανοεῖ也可译作“悔改”或“改变心意”。
    reason: lexical_alternative
  - marker: e
    text: 这里以约瑟为例：他虽然一时受辱，后来却被高举而显出光辉。参见《创世记》37章、39—45章。
    reason: cross_reference
lexical_decisions:
- source_word: διάνοιαν
  choice: 心志
  rationale: 此处兼具思想、意向和道德取向；“心志”比单纯的“思想”更能表达内在的伦理倾向，同时保持现代汉语的自然庄重。
- source_word: ἄσωτοι
  choice: 放荡不羁的人
  rationale: 该词可指挥霍、放纵或行为失序的人；这里与“回转归向良善”相对，译文保留其道德失范的宽泛含义。
- source_word: ἐπιστρέψουσιν εἰς τὸ ἀγαθόν
  choice: 会回转归向良善
  rationale: “回转”体现ἐπιστρέφω的返回意味，“归向良善”自然表达带冠词的伦理对象τὸ ἀγαθόν。
- source_word: πλεονεκτοῦντες
  choice: 贪婪的人
  rationale: 指受贪得无厌所支配的人；此译简明易懂，又不把含义限缩为某一种经济剥削。
- source_word: τοῦ πάθους
  choice: 自己的欲念
  rationale: πάθος在这里指推动贪婪行为的内在欲望；“欲念”比现代汉语中的“激情”更准确地传达其负面伦理色彩。
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: 自己占有的贪欲所得
  rationale: 希腊语表达压缩且略有含混；“贪欲所得”保留与πλεονεξία的直接联系，同时不绝对断言这些财物取得的具体方式。
- source_word: θλιβομένοις
  choice: 困苦的人
  rationale: 该词泛指承受压力、患难或压迫的人；“困苦的人”在中文中自然，并避免限缩为单一类型的苦难。
- source_word: ἀκάθαρτα πνεύματα
  choice: 污灵
  rationale: 简洁表达具有污秽性质的灵界存在，符合犹太—基督教希腊文语境，也便于现代读者理解。
- source_word: ὑβρίσει
  choice: 凌辱
  rationale: 该动词可涵盖傲慢的侮辱、虐待或侵害；“凌辱”比“辱骂”更有力度，又不像“施暴”那样限定为肢体暴力。
- source_word: μετανοεῖ
  choice: 回心转意
  rationale: 此处描述冒犯者因圣洁之人的反应而改变心意；“回心转意”保留认知和态度转变的重点，未直接加入更专门化的宗教术语。
- source_word: φαιδρότερος
  choice: 更加光辉
  rationale: 该比较级可指明亮、灿烂或喜乐；在约瑟先受辱后得显扬的语境中，“更加光辉”兼顾形象和蒙 vindication 的意味。
theological_decisions:
- issue: 第3节 φόβος ἀγαθῶν ἔργων 的属格关系
  choice: 对善行的敬畏
  alternative: 善行所产生的敬畏；与善行相伴的敬畏；善行使人产生的畏惧
  rationale: 原文结构生硬，既可能指对善行的敬重，也可能指善行在旁人心中引发的畏惧。正文采用较可读的表达，并以脚注保留其他可能。
- issue: 第4节 μετανοεῖ 的含义
  choice: 回心转意
  alternative: 悔改；改变心意
  rationale: 上下文强调凌辱者面对圣洁之人的怜悯与沉默而改变态度。“回心转意”保留这种转变，也不排除其道德悔悟色彩。
- issue: 第5节义人暂受屈后“更加光辉”
  choice: 保留由受屈转为光辉的陈述
  alternative: 明确译作被昭雪、得荣耀
  rationale: φαιδρότερος本身是形象性词语；不在正文中把它完全解释为司法性昭雪或神学性的荣耀，以保留约瑟事例所含的多重意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式尽量清晰流畅，同时保留第3节属格结构、第4节心意转变以及第5节“光辉”意象中的真实含混。人物伦理称谓分别译为“圣洁的人”和“义人”，避免加入宗派化解释。
