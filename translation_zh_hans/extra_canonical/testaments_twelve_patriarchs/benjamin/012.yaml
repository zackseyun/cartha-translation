  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012.yaml
  text: '1. And after saying these things, he stretched out his feet and fell asleep in a good sleep[a].

    2. And his sons did as he had commanded them, and they carried up his body and buried him in Hebron with his fathers.


    2. The number of his life was one hundred and twenty-five years[b]. And when he had finished his words, he said, “I command you, my children, carry up my bones out of Egypt, and bury me in Hebron near my fathers.”

    2. And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.

    3. And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly during the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].

    4. And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.'
translation:
  language: zh_hans
  text: '1. 说完这些话，他伸直双脚，睡了美好的一觉[a]。


    2. 他的儿子照着他的吩咐，抬着他的遗体，把他葬在希伯仑，与他的列祖同葬。


    2. 他把话说完后，就说：“我的孩子们，我吩咐你们：要把我的骸骨从埃及带上去，葬在希伯仑，靠近我的列祖。”


    2. 便雅悯活到一百二十五岁，在美好的晚年去世；他们把他安放在棺中[b]。


    3. 以色列众子离开埃及后的第九十一年，他们和他们的弟兄在迦南的战争中暗中把他们列祖的骸骨带上去，葬在希伯仑、他们列祖的脚旁[c]。


    4. 随后，他们从迦南地返回，住在埃及，直到他们离开埃及地的那一天。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些希腊文见证在“美好”之后又加“而良善”。
    reason: textual_variant
  - marker: b
    text: 本章保存了彼此重叠的结尾记载，重复叙述便雅悯的死亡、安葬，以及后来迁移列祖骸骨的事。这种重复可能反映了复杂的文本传承过程；此处仍按所存希腊文的形态译出。
    reason: textual_variant
  - marker: c
    text: “他们列祖的脚旁”直译自希腊文，可能是指安葬在祖坟附近，并不一定表示正好放在列祖遗体的脚边。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: 睡了美好的一觉
  rationale: 保留“睡眠”作为死亡婉辞，也保留原文动词与同源名词叠用的表达，不直接解释成“安然去世”。
- source_word: ἄραντες
  choice: 把……抬上去
  rationale: 表达抬起、搬运的具体动作，并与后文把骸骨“带上去”的命令形成呼应；“上去”也契合前往希伯仑的方向表达。
- source_word: ἐντέλλομαι
  choice: 我吩咐你们
  rationale: 保留父亲临终嘱命的权威语气，同时符合现代汉语庄重叙事的自然表达。
- source_word: ἀνενέγκατε
  choice: 带上去
  rationale: 既表达从埃及运送骸骨，也保留ἀνά所含的向上或上行色彩。
- source_word: ὀστᾶ
  choice: 骸骨
  rationale: 原文具体指骨头；“骸骨”在安葬语境中庄重自然，不泛化为“遗骸”。
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: 靠近我的列祖
  rationale: 保留空间上的临近关系，不擅自指定更精确的墓葬位置；“列祖”符合家族安葬语境。
- source_word: ἐν γήρει καλῷ
  choice: 在美好的晚年
  rationale: 较贴近“美好的老年”这一原文措辞，同时避免生硬直译。
- source_word: ἐν παραθήκῃ
  choice: 安放在棺中
  rationale: 该词本义涉及存放、保管；在尸身暂存并等待迁葬的语境中，“棺中”是最可能且清楚的所指。
- source_word: ἐν κρυφῇ
  choice: 暗中
  rationale: 简洁表达隐秘进行的方式，保留行动的秘密性质。
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: 列祖的脚旁
  rationale: 保留原文异常具体的身体方位意象，不将其顺化为笼统的“与列祖同葬”。
