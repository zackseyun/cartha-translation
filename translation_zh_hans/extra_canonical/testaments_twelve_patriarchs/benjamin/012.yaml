  register: 采用现代、庄重而易懂的普通话。保留“列祖、骸骨、同葬”等适合遗嘱与安葬叙事的词语；对希腊文的重复结尾、睡眠婉辞和不寻常的墓葬方位不作静默顺化。正文编号依咨询层所呈现的重叠结构保留。
