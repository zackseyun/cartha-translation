- issue: 本章保存了彼此重叠的死亡、安葬和迁骨结尾
  choice: 照所存希腊见证完整翻译，包括重复的年岁、死亡和安葬记载
  alternative: 把各段合并成一个流畅结尾，或把部分语句视为后加而删除
  rationale: 复杂的传承形态本身属于文本证据；译文不应无声地调和或删减。
- issue: 出埃及后第九十一年的年代记载
  choice: 在正文中按希腊文明确译出
  alternative: 校改数字，或用模糊说法消解年代张力
  rationale: 原文提出具体年代，即使它与叙事时序形成历史张力，也应如实保存而不作推测性修正。
