  terminology: “良善”“爱”“玷污”以及“紧紧依附”均恰当；“纯洁的心”可接受，用于νοῦς时保留其涵盖内在心思与道德取向的宽度。将κόπρος译为“粪便”能更准确维持原文污秽意象。英文POB的章节内容及其a—c注记与本次所供希腊底本不相符，不可作为本段译文或脚注的依据。
