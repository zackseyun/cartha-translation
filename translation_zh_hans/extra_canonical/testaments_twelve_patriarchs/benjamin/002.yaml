  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002.yaml
  text: '1 And when we went down into Egypt[a], Joseph my brother recognized me and said to me, “They smeared your tunic with blood and said, ‘See whether this is your son’s tunic.’”

    2 And he said to me, “Yes, brother. For when the Ishmaelites took me, one of them stripped me of my tunic and gave me a loincloth; and after flogging me, he told me to run.

    3 And while he was going away to hide my garment, a lion met him and killed him.

    4 So his companions, being afraid, sold me to others of their company.

    5 Thus Joseph did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.

    6 And he called his brothers to himself and said,

    7 ‘Do not tell my father what you did to me, but speak in this way, just as I explained it to Benjamin.

    8 And let such thoughts be in you[b][c][d], and let not the words come…’'
translation:
  language: zh_hans
  text: '《便雅悯遗训》第2章


    1 我到了埃及以后，我哥哥约瑟认出了我，对我说：“他们把血抹在你的里衣上，说：‘认一认，看这是不是他的里衣。’”[a]


    2 他又对我说：“是的，弟弟。他们剥下我的里衣，把我交给以实玛利人，又给了我一块围腰布。他们鞭打我以后，叫我跑。


    3 其中一人用棍子抽打我；一头狮子迎面遇见他，把他咬死了。[d]


    4 他的同伴因此害怕，就把我卖给了他们一伙中的另一些人。[c]


    5 他们这样说并没有撒谎；因为约瑟想向我隐瞒我们兄弟所做的事。


    6 他把兄弟们叫到身边，对他们说：


    7 ‘不要把你们对我所做的事告诉我父亲，只要照我向便雅悯讲的这样说。


    8 你们心里也要这样想，不要让这些话进入我父亲心里。’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本说得更明确：“他们把衣服送去，说：‘认一认，看这是不是你儿子的里衣。’”
    reason: textual_variant
  - marker: b
    text: 有些希腊文本在本节末尾残缺，句子没有写完；这里依照所给希腊文本保存的完整结句翻译。
    reason: textual_variant
  - marker: c
    text: 有些抄本说他们把约瑟卖给以实玛利人；另一些抄本则像正文一样，说卖给同伙中的其他商人。
    reason: textual_variant
  - marker: d
    text: 其他文本对这件事的叙述有所不同，但都保留了这样的要点：处理约瑟衣服的那个人被猛兽杀死；多数文本说那猛兽是狮子。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώρισέν με
  choice: 认出了我
  rationale: 在抵达埃及并与约瑟相见的语境中，表示约瑟辨认出便雅悯；采用自然的现代汉语，不引入原文未明说的反身意义“向我表明身份”。
- source_word: ἔφυραν
  choice: 把血抹在……上
  rationale: 该动词本义可指搅和、揉混；用于血与衣物时，语境义是涂抹、沾染。“抹”保留了动作的具体性。
- source_word: χιτών
  choice: 里衣
  rationale: χιτών指贴身或内层穿着的长衣。“里衣”比传统的“彩衣”更贴近词义，也不把《创世记》其他文本的修饰语带入此处。
- source_word: περίζωμα
  choice: 围腰布
  rationale: 指围在腰胯部的布。“围腰布”具体、易懂，也避免“腰带”可能造成的窄带联想。
- source_word: φραγγελλώσαντες
  choice: 鞭打……以后
  rationale: 明确表达身体遭受鞭打的暴力，同时保持现代汉语叙事的自然度。
- source_word: τρέχειν
  choice: 叫我跑
  rationale: 保留不定式的直接动作含义，不额外解释跑的目的或方向。
- source_word: ὑπήντησεν αὐτῷ λέων
  choice: 一头狮子迎面遇见他
  rationale: 保留希腊语简洁而生动的相遇表达；“迎面遇见”在汉语中比生硬的“遇见了他”更适合突然遭遇野兽的场景。
- source_word: ἀνεῖλεν
  choice: 把他咬死了
  rationale: 核心意义是杀死。因主语为狮子，汉语用“咬死”自然且具体，但没有扩写过程。
- source_word: μέτοχοι
  choice: 同伴
  rationale: 指该人的同行者或同伙；“同伴”既自然，也不预先限定其商业或族群身份。
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: 我们兄弟所做的事
  rationale: 既传达具体行为及其道德分量，又比直译“我们兄弟的作为”更符合现代汉语。
- source_word: ἐξηγησάμην
  choice: 向便雅悯讲的
  rationale: 这里指约瑟先前向便雅悯叙述并说明的说法；“讲的”简明自然，不把它过度限定为正式解释。
- source_word: αἱ ἔννοιαι γένωνται ἐν ὑμῖν τοιαῦται
  choice: 你们心里也要这样想
  rationale: 把较字面的“愿这样的意念在你们里面”转成庄重而清楚的现代汉语，同时保留内在意念与外在言语一致的要求。
theological_decisions:
- issue: 约瑟隐瞒众兄弟罪行的动机
  choice: 明确译出约瑟想向便雅悯隐瞒兄弟们所做的事
  alternative: 仅说约瑟复述事情，不强调隐瞒动机
  rationale: κρύπτειν ἀπ’ ἐμοῦ τὰ ἔργα明确表达“向我隐瞒他们的行为”。保留这一动机，呈现约瑟克制、不愿揭露兄弟的叙事张力，而不进一步赋予教派性解释。
- issue: 第5节复数主语与后句单数主语的张力
  choice: 译作“他们这样说并没有撒谎；因为约瑟想……”
  alternative: 将前句改为“约瑟这样说并没有撒谎”
  rationale: 现有希腊文前句为复数αὐτοί，后句则以单数主语承接约瑟。正文保留这一语法张力，并在后句点明约瑟以保证汉语可读性，不静默抹平文本的不稳定。
- issue: 第8节结尾是否残缺
  choice: 依所给修订希腊文本译出完整结句
  alternative: 依部分见证在“不要让这些话……”处保留断句
  rationale: 本次提供的希腊来源含完整的εἰς καρδίαν τοῦ πατρός μου，因此正文不应按英语咨询层删去现存词句；同时以脚注说明部分见证在此残缺。
- issue: 狮子事件与转卖对象的异文
  choice: 采用所给文本所支持的狮子杀人和转卖给同伙中其他人的叙述
  alternative: 笼统译作被野兽杀死，或译为再次卖给以实玛利人
  rationale: 正文依据所给希腊材料和较完整叙事呈现，但脚注明示其他见证，避免把不稳定细节宣称为唯一原貌。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人物直接引语保持口语清晰，但不用网络化或过度通俗的表达。对所给希腊文中的代词转换、异文和文本残缺问题不作教义化调和；正文优先依据此次提供的修订希腊文本，英语POB仅作审校参照。所有脚注标记均已在正文出现。
