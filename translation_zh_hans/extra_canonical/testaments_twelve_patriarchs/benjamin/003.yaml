  rationale: 修订第7节以准确呈现“赢得／打动父亲的慈爱”，并调整第8节，使“被交付给无律法之人”及“为不敬虔的人而死”的表述贴合希腊文而不添加具体情节。方括号段的“立约之血、列国和以色列的救恩、毁灭彼列”保留在同一受难预言中，避免改写为独立的未来救赎行动。第5节改用“人或野兽的谋害”，并在正文和脚注中维持损坏文本的谨慎性。
