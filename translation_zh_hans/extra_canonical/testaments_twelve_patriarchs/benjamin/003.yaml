- from: '**便雅悯遗训 3**


    **1** “所以，我的孩子们，你们也要爱天地的主上帝，遵守他的诫命，效法那良善圣洁的人约瑟。 **2** 你们的心思要向着善，正如你们知道我的心思也是如此。因为心思正直的人，凡事都看得正直。 **3** 你们要敬畏主，爱邻舍。即使彼列的诸灵要把你们驱入苦难中的种种恶事，它们也绝不能辖制你们，正如它们未曾辖制我的兄弟约瑟。 **4** 有多少人想要杀他，上帝却庇护了他！因为敬畏上帝、爱邻舍的人不能被彼列的灵击伤；敬畏上帝庇护着他。 **5** 人或野兽的阴谋也不能制伏他，因为他对邻舍怀有爱，便借着这爱得到帮助而存活。[a]


    **6** 约瑟还恳求我们的父亲为他的兄弟们祷告，使主不把罪归在他们身上，因为他们曾恶待约瑟。 **7** 于是雅各高声说：


    “善良的孩子啊，你使你父亲雅各的心都降服了！”


    他抱住约瑟，接连亲吻他两个小时，说：


    **8** “关于你的天上预言必将应验：[b]关于上帝的羔羊和世界的救主——无瑕疵者必被不法之徒出卖，无罪者必为不敬虔的人而死；他要以立约之血拯救列国和以色列，并消灭彼列及其仆役。”[c]'
