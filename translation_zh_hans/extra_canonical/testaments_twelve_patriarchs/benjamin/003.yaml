  text: 1[a]. Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph. 2. And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly. 3. Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every wickedness of affliction, they will certainly not rule over you, just as they did not over Joseph my brother. 4. How many men wanted to kill him, yet God sheltered him[b]. For the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God. 5. And he cannot be mastered by the plots of men or of beasts, since the Lord helps him through the love that he has toward his neighbor. 6. For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him. 7. And thus Jacob cried out,
    “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, for two hours he kept kissing him, saying, 8. “The heavenly prophecy will be fulfilled upon you.”
translation:
  language: zh_hans
  text: '**便雅悯遗训 3**


    **1** 所以，我的孩子们，你们也要爱主——天地的上帝，遵守他的诫命，效法那良善圣洁的人约瑟。 **2** 你们的心思要向着善，正如你们知道我的心思也是如此。因为心思正直的人，凡事都看得正直。 **3** 你们要敬畏主，爱邻舍；即使彼列的诸灵把你们驱入一切苦难的恶事中，它们也绝不能辖制你们，正如它们未曾辖制我的兄弟约瑟。 **4** 有多少人想要杀他，上帝却庇护了他！因为敬畏上帝、爱邻舍的人不能被彼列的灵击伤；敬畏上帝庇护着他。 **5** 他也不能被人或野兽的谋害所制伏；因着他对邻舍所怀的爱，他得到帮助，得以存活。[a]


    **6** 约瑟还恳求我们的父亲为他的兄弟们祷告，使主不把罪归在他们身上，因为他们曾恶待约瑟。 **7** 于是雅各高声说：


    “善良的孩子啊，你赢得了你父亲雅各的慈爱！”


    他抱住约瑟，接连亲吻他两个小时，说：


    **8** “那关于你的天上预言必将应验：[b]关于上帝的羔羊和世界的救主——无瑕疵者必被交付给无律法之人，无罪者必为不敬虔的人而死；以立约之血，使列国和以色列得救，并毁灭彼列及其仆役。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节“得到帮助，得以存活”所据的希腊文有讹乱，字面结构难以确定；有的重构或异文还提到野兽或“空中的灵”。译文保留可辨认的核心意思，却不补出原文没有明说的帮助者。
    reason: textual_variant
  - marker: b
    text: “关于你的”也可译作“临到你身上”；相关介词措辞在抄本中略有差异。
    reason: alternative_reading
  - marker: c
    text: 从“关于上帝的羔羊”到本节末尾的若干语句，在所据希腊校本中用方括号标出，表明其文本传承或原始性受到质疑。
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: 爱
  rationale: 保留命令语气及伦理、盟约语境中的常用含义，不扩写为较弱的“表示关爱”。
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: 遵守他的诫命
  rationale: 现代汉语中自然、庄重，并准确表达持守和实行诫命。
- source_word: μιμούμενοι
  choice: 效法
  rationale: 比机械的“模仿”更符合道德劝勉语境，同时保留以约瑟为榜样的含义。
- source_word: διάνοια
  choice: 心思
  rationale: 兼顾思想与道德取向，并在第2节的重复中保持用词一致。
- source_word: εἰς τὸ ἀγαθόν
  choice: 向着善
  rationale: 保留介词所表达的方向性，不将“善”过度具体化为某一种行为。
- source_word: ὀρθὴν ... ὀρθῶς
  choice: 正直……正直
  rationale: 有意保留原文形容词与副词的词根呼应；虽略带修辞色彩，却能呈现本节的重复。
- source_word: τὸν πλησίον
  choice: 邻舍
  rationale: 这是现代中文圣经伦理语境中通行的表达，也保留“身边之人”的开放范围。
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: 彼列的诸灵
  rationale: 按希腊文音译专名 Βελίαρ，并用“诸灵”呈现复数。
- source_word: ἐκστήσωσι
  choice: 驱入
  rationale: 表达敌对灵体施加压力、把人推向恶事的动态，同时不限定为纯心理失常。
- source_word: κατακυριεύσωσιν
  choice: 辖制
  rationale: 呈现敌对权势的统治意味；“绝不能”反映 οὐ μή 的强烈否定。
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: 庇护 / 庇护着
  rationale: 保留两处“遮盖、保护”的共同意象，并使现代中文自然。
- source_word: πληγῆναι
  choice: 被……击伤
  rationale: 既保留被动受击的动作，也允许身体或属灵伤害的语义张力。
- source_word: ἐνίκησας τὰ σπλάγχνα
  choice: 使……的心都降服了
  rationale: 保留“胜过、征服”这一强烈隐喻，同时以现代汉语可懂的“心”表达 σπλάγχνα 所指的内在深情。
- source_word: ἄμωμος / ἀναμάρτητος
  choice: 无瑕疵者 / 无罪者
  rationale: 区分原文两个相近却不同的称谓，前者保留祭牲与品格均可能具有的意味，后者明确指无罪。
- source_word: ἐν αἵματι διαθήκης
  choice: 以立约之血
  rationale: 保留“血”与“约”的神学意象，不具体指定该约的性质或时间。
theological_decisions:
- issue: 第4节中保护力量的表述
  choice: 直译为“敬畏上帝庇护着他”
  alternative: 解释为“他因自己敬畏上帝而得到上帝保护”
  rationale: 原文以“对上帝的敬畏”作为施行庇护的表述，具有拟人化和神学张力；正文不把它缩减为心理态度，也不擅自改换施事者。
- issue: 第6节约瑟的代求与罪的归算
  choice: 约瑟请父亲祷告，求主不把罪归给兄弟们
  alternative: 仅表述约瑟亲自宽恕兄弟们
  rationale: 希腊文明确采用代求及主是否归罪的语言，应如实保留，不与其他约瑟传统进行协调。
- issue: 第8节预言与约瑟的关系
  choice: 保留“关于你的预言”及随后无瑕疵者受难的内容
  alternative: 将预言直接认定为约瑟本人，或仅保留引言而删去预言内容
  rationale: περὶ σοῦ 可表示“关于你”，但后续内容与约瑟之间的预表性关系并未被原文完全解释；译文不替作者消除这种张力。
- issue: 第8节上帝羔羊段落的文本地位
  choice: 收入正文并加文本批注
  alternative: 因编辑本用方括号标示而完全删去
  rationale: 用户提供的希腊文本包含这些语句；为优先呈现原文证据，译入正文，同时明确其在所据校本中受到方括号标示，避免把其文本地位说得过于确定。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。伦理劝勉使用普通读者熟悉的“遵守诫命、效法、敬畏、邻舍”等表达；对彼列诸灵、敬畏的庇护作用及第8节预言等古代宗教意象不作现代化消解。第5节损坏文本及第8节编辑性方括号均以脚注说明，不在正文中伪装成毫无疑问的读法。
