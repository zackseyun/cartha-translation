lexical_decisions:
- source_word: Βελίαρ
  choice: 彼列
  rationale: 保留希腊见证中的专名形式，同时采用现代中文读者较易识别的传统译名，并在脚注交代其他形式。
- source_word: μάχαιρα
  choice: 刀剑
  rationale: 该词指可作武器的刀或剑；“刀剑”既自然庄重，也保留其作为暴力工具的意象。
- source_word: πειθομένοις
  choice: 听从他的人
  rationale: 分词可指受其劝服或服从他；在劝诫语境中，“听从”既包含受诱导，也表达实际顺从。
- source_word: διάνοια
  choice: 心思
  rationale: 这里指孕育恶念的内在思想官能；“心思”比单纯的“思想”更能表达伦理和内在意向。
- source_word: συλλαμβάνει
  choice: 怀胎
  rationale: 在“刀剑是母亲”的上下文中，该动词采用受孕义，保留原文连续的生育隐喻。
- source_word: φθόνος
  choice: 嫉妒
  rationale: 准确表达因他人所有而产生怨恨的恶德，也是本段该隐与恨弟兄主题的起点。
- source_word: ἀπώλεια
  choice: 毁灭
  rationale: 保留该词表示败亡和毁坏的强度，又不把它限定为后期神学术语。
- source_word: θλῖψις
  choice: 患难
  rationale: 表达压迫性的痛苦和困境，庄重而为普通中文读者熟悉。
- source_word: αἰχμαλωσία / θεηλασία
  choice: 被掳
  rationale: 第四项文本不稳定；平行见证支持“被掳”，且与随后一连串灾祸相称。脚注同时保留“劫掠”的可能。
- source_word: ἔνδεια
  choice: 匮乏
  rationale: 指缺少生活所需；“匮乏”简洁并符合灾祸清单的语体。
- source_word: ταραχή
  choice: 动乱
  rationale: 可涵盖骚乱、混乱和不安；此处与社会性灾祸并列，故译“动乱”。
- source_word: ἐρήμωσις / ἐρημοῦται
  choice: 荒凉 / 归于荒凉
  rationale: 统一保留同一词根，表达被毁弃、变为荒芜的状态。
- source_word: ἐκδικίαις
  choice: 报应
  rationale: 该词表示惩罚性的伸冤或报复；“报应”在此能简明表达因罪而来的惩罚。
- source_word: μισαδελφίᾳ
  choice: 恨弟兄之事
  rationale: 原词浓缩表达对兄弟的仇恨；展开翻译使现代读者容易理解，同时保留该隐—亚伯语境。
theological_decisions:
- issue: 彼列与人的道德责任
  choice: 译作彼列把刀剑交给“听从他的人”，并说心思借着彼列怀胎
  alternative: 译成彼列完全控制或迫使人行恶
  rationale: 原文既呈现邪恶力量的诱导，也以 πειθομένοις 表明人对这种诱导的顺从；翻译不消除二者之间的张力。
- issue: 七种恶的生育隐喻
  choice: 保留“母亲—怀胎—所生”的连续意象
  alternative: 平直改写为七种恶由刀剑引起
  rationale: 原文借生育说明恶在心思中形成并产生后果；保留隐喻可呈现其伦理心理结构，而不额外建立教义体系。
- issue: 该隐受罚的年代与《创世记》叙事之间的张力
  choice: 照译每百年一种灾祸、受苦二百年及第九百年的数字
  alternative: 依《创世记》调整年代，或省略难以协调的数字
  rationale: 见证文本明确保留这些数字；不应为追求经文协调而改写或隐去其独特传统。
- issue: 拉麦“七十个七倍”的省略句
  choice: 补足为“受七十个七倍的报应”
  alternative: 只保留残句“拉麦则在七十个七倍中”
  rationale: 希腊文承接前句而省略受审判或受报应的谓语；中文需适度补足才能通顺，但脚注指出其与该隐七重报应的对照，不把含义进一步教义化。
- issue: 末节刑罚的期限
  choice: 将 ἕως τοῦ αἰῶνος 译作“直到永远”
  alternative: 译作“直到这世代的终结”或“直到时代”
  rationale: 该短语在此警戒语境中自然指持续至永远；但不进一步说明刑罚性质，以免超出原文。
translation_notes:
  register: 采用现代标准书面汉语，保持遗训式劝诫的庄重感，同时避免古奥句法。按所给希腊文完整翻译第1—5节；未纳入英文咨询层开头那段，因为它不在本次提供的希腊原文中。对残缺或不稳定处以正文作可读选择，并用脚注保留异文和不确定性。
