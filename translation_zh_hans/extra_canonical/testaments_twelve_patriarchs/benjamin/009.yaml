base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009.yaml
  text: '1. And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again[b], and the kingdom of the Lord will not be among you. 2. Nevertheless, in your allotted portion there will be the temple of God, and the last will be more glorious than the first; and there the twelve tribes will be gathered, and all the nations, until the Most High sends his salvation in the visitation of an only-begotten prophet.


    3. And he will enter into the first temple, and there the Lord will be treated with outrage, and he will be lifted up on wood. 4. And the curtain-spread of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out. 5. And when he has gone up from Hades, he will pass from earth to heaven. And I know how lowly he will be on earth[e][d][c], and how glorious in heaven.'
translation:
  language: zh_hans
  text: '1 我还要把义人以诺话语中所说的事告诉你们：你们必犯所多玛的淫乱，必灭亡片时；此后，你们必再次更新，但主的国却不在你们中间。


    2 然而，在你们的份地中必有上帝的殿；后来的必比先前的更有荣耀。十二支派和列国都必聚集在那里，直到至高者在一位独生先知的眷临之时，差遣他的救恩[b]。


    3 他必进入第一座殿；主必在那里受凌辱，他也必被举在木头上[c]。[a]


    4 殿中铺展的幔子必被撕裂[d]；上帝的灵必转到列国那里，如同倾倒出来的火。


    5 他从阴间上来以后[e]，必从地上升到天上。我知道他在地上将是何等卑微，在天上又是何等荣耀。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第3—5节在抄本传承中的文本地位不确定，常被视为后来的扩充；因所提供的希腊文本载有这些经节，故仍译入正文。
    reason: textual_variant
  - marker: b
    text: “一位独生先知”也可译作“一位独一的先知”。“眷临”也可理解为“察看”或“眷顾”。
    reason: lexical_alternative
  - marker: c
    text: “被举在木头上”直译希腊文；“木头”在此也可能让人想到树或木制刑具，但正文不进一步限定。
    reason: lexical_alternative
  - marker: d
    text: 原文使用一个不寻常的词，字面指铺开或展开之物；这里可能指圣殿的幔子。
    reason: lexical_alternative
  - marker: e
    text: “阴间”指死者所在之境，不必然等同于最终受刑之地。
    reason: cultural_note
lexical_decisions:
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: 你们必犯所多玛的淫乱
  rationale: 用“犯……淫乱”保留同源动词与名词所构成的强调语气，并保留“所多玛”这一简洁而未加解释的典故。
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: 必灭亡片时
  rationale: 将 ἕως βραχύ 理解为持续一段短暂时间，保留审判之后尚有更新的时序；“片时”兼具庄重感与可懂度。
- source_word: ἀνανεωθήσεσθε
  choice: 必再次更新
  rationale: 保留将来被动式所表达的更新或恢复，不将其限定为某一种专门神学概念。
- source_word: ἐν μερίδι ὑμῶν
  choice: 在你们的份地中
  rationale: μερίς 在此很可能指便雅悯支派所得的土地份额；“份地”简明保留分配与产业背景。
- source_word: ὁ ἔσχατος ἔνδοξος ὑπὲρ τὸν πρῶτον
  choice: 后来的必比先前的更有荣耀
  rationale: 希腊文省略了所比较对象的名词；中文同样不擅自补定为第二座殿，以保留原文的简约与潜在歧义。
- source_word: τὸ σωτήριον αὐτοῦ
  choice: 他的救恩
  rationale: σωτήριον 可指拯救、救助或救恩；“他的救恩”保留紧凑的先知性措辞。
- source_word: ἐν ἐπισκοπῇ μονογενοῦς προφήτου
  choice: 在一位独生先知的眷临中
  rationale: “眷临”表达 ἐπισκοπή 在先知性语境中的临到、察看之意；“独生”保留 μονογενής 的强烈传统词义，同时以脚注说明“独一”这一可行译法。
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: 必被举在木头上
  rationale: 直译 ξύλον 为“木头”，不擅自具体化为十字架、树或木桩，并保留“举起”可能具有的双重意味。
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: 殿中铺展的幔子
  rationale: ἅπλωμα 本义涉及铺开、展开之物，并非通常表示圣殿幔子的标准词；译文既让中文读者明白是悬挂物，也保留其异常措辞。
- source_word: ἐκ τοῦ ᾅδου
  choice: 从阴间
  rationale: ᾅδης 指死者所在之境；“阴间”是现代中文宗教文本中较稳妥的对应词，不等同于最终刑罚之地。
theological_decisions:
- issue: 是否收入第3—5节的括号内材料
  choice: 收入正文，并以[a]说明其传本状况
  alternative: 按较短文本删去第3—5节，或将其置于正文之外
  rationale: 所提供的希腊文本包含这些经节，但用方括号标示其文本地位特殊。正文照译，脚注则明确其传本不确定性，避免无声删节或把其地位说得过于确定。
- issue: μονογενοῦς προφήτου 的译法
  choice: 一位独生先知
  alternative: 一位独一的先知
  rationale: “独生”较直接保留 μονογενής 的词汇力度及其神学张力；脚注列出“独一”这一不强调生育关系的可能译法，不在正文中消解歧义。
- issue: 第3节“主”的所指
  choice: 保留“主必在那里受凌辱”
  alternative: 改作“主的受膏者”或把“主”解释为前述先知
  rationale: 希腊文明确写 Κύριος，却未解释它与前后代词的关系；译文不以基督论或其他预设替换原词。
- issue: 第3—5节男性单数主语的所指
  choice: 统一保留“他”，不在正文点明身份
  alternative: 明确补作“那位先知”“救主”或“主”
  rationale: 希腊文的主语承接关系可引发不同理解。中文用“他”维持原文连贯，同时避免把潜在所指锁定为某一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话，保留遗训体的预告语气。用“上帝”译 Θεός、“主”译 Κύριος、“至高者”译 ὁ ὕψιστος。对“后来的／先前的”、第3—5节代词所指及“独生先知”等处不作超出希腊文的解释；异常词 ἅπλωμα 以“铺展的幔子”呈现，并用脚注交代。
