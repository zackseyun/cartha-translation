base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/001.yaml
  text: See then, my children, the end of the good man. Imitate [in goodness] because of his compassion, so that you also may wear crowns of glory.
translation:
  language: zh_hans
  text: 4 所以，我的孩子们，你们要看善人的结局。你们要[以良善][a]效法他，因着他的怜悯，好叫你们也戴上荣耀的冠冕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以良善”所对应的希腊文在底本中以方括号标出；其文本及与后面“因着他的怜悯”的句法关系都不十分确定。
    reason: 保留原始版本对该短语的括注状态，并说明其文本和句法上的不确定性，而不把“良善”限定为“善行”。
lexical_decisions:
- source_word: Ἴδετε
  choice: 你们要看
  rationale: 保留命令语气；“看”既可指观察，也可指留意、思想。
- source_word: τοῦ ἀγαθοῦ ἀνδρὸς
  choice: 善人
  rationale: 以简洁自然的现代汉语表达“良善的人”，不额外限定其身份。
- source_word: τὸ τέλος
  choice: 结局
  rationale: τέλος在此可指终局、人生终点或最终结果；“结局”保留这种语义张力，比单纯译作“结果”更贴近原文。
- source_word: μιμήσασθε
  choice: 效法他
  rationale: 希腊文动词意为模仿、效法；汉语补出由上下文可知的宾语“他”，使句子通顺。
- source_word: εὐσπλαγχνίαν
  choice: 怜悯
  rationale: 表达发自内心的慈悲与同情，语体庄重且为现代读者易懂。
- source_word: στεφάνους δόξης φορέσητε
  choice: 戴上荣耀的冠冕
  rationale: 保留冠冕意象、复数含义及“佩戴”的动作，不将其解释成特定奖赏体系。
theological_decisions:
- issue: 效法善人的根据与范围
  choice: 你们要因他的怜悯而[在善行上]效法他
  alternative: 你们要效法他的良善和怜悯
  rationale: 原文中ἐν ἀγαθῇ的形式及其与διὰ τὴν εὐσπλαγχνίαν αὐτοῦ的句法关系不够明确；正文不把“良善”与“怜悯”重构成两个并列宾语，也不将其明确归属为“他的良善”，以保留文本本身的含混。
- issue: 荣耀冠冕的性质
  choice: 荣耀的冠冕
  alternative: 荣耀作为冠冕／荣耀所赐的冠冕
  rationale: 采用直接的属格表达，不进一步判定“荣耀”是冠冕的性质、内容还是来源。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的孩子们”保留父辈劝诫的亲密语气；“善人、结局、效法、冠冕”等词兼顾自然度与古代训诫文体。方括号保留底本标示的可疑或不稳定短语。
