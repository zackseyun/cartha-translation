  text: Ὁ γὰρ¹⁰ ἀγαθὸς ⁹ἄνθρωπος⁹ οὐκ ἔχει σκοτεινὸν ὀφθαλμόν¹¹, ἐλεεῖ¹² γὰρ πάντας, κἂν *ἁμαρτωλοὶ ὦσιν¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/002.yaml
  text: For the good man does not have a dark eye, for he has mercy on all, even if they are sinners.
translation:
  language: zh_hans
  text: 因为善人没有阴暗的眼光；他怜悯所有人，即使他们是罪人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: 善人
  rationale: 简洁对应“善良的人”，符合现代汉语的庄重语体。
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: 阴暗的眼光
  rationale: 保留“黑暗／阴暗”与“眼睛／眼光”的意象，同时避免“阴暗的眼睛”在现代汉语中仅被理解为外观描写；“眼光”也能承载内在态度这一含义，但不将隐喻具体解释为嫉妒或恶意。
- source_word: ἐλεεῖ
  choice: 怜悯
  rationale: 直接表达施予慈悲、同情的行动，保留原词的伦理与宗教语感。
- source_word: πάντας
  choice: 所有人
  rationale: 明确保留原文所表达的普遍范围。
- source_word: κἂν ἁμαρτωλοὶ ὦσιν
  choice: 即使他们是罪人
  rationale: 自然表达让步关系，并忠实保留“罪人”的身份表述。
theological_decisions:
- issue: “阴暗的眼光”这一隐喻的具体所指
  choice: 保留隐喻，不解释为嫉妒、吝啬或恶意
  alternative: 译作“没有恶意”或“并不嫉妒”
  rationale: 原文只说“阴暗的眼睛／眼光”，具体伦理含义具有一定开放性；正文不应替原文消除这种张力。
- issue: 对罪人的怜悯是否附带条件
  choice: 译作“怜悯所有人，即使他们是罪人”
  alternative: 增译为“尽管他们犯罪，仍宽恕他们”
  rationale: 原文强调怜悯的普遍性，却没有明说宽恕、悔改或其他条件，因此不作神学扩展。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“因为……；……”保留原文两个 γάρ 所形成的解释推进，同时避免机械重复两个“因为”。
