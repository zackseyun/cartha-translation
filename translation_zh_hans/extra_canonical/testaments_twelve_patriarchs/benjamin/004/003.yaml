base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/003.yaml
  text: And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.
translation:
  language: zh_hans
  text: 即使他们不愿意善待他，他仍蒙上帝庇护，以行善胜过恶。他爱那些亏待他的人，如同爱自己的性命一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ βούλωνται περὶ αὐτοῦ εἰς καλά
  choice: 不愿意善待他
  rationale: 该短语直指他人对他的意愿并非趋向善；译为“不愿意善待他”符合现代汉语习惯，又保留意志层面的含义。
- source_word: τὸ ἀγαθὸν ποιῶν
  choice: 以行善
  rationale: 保留分词的方式或手段意义，说明他借着实行善事胜过恶。
- source_word: νικᾷ τὸ κακόν
  choice: 胜过恶
  rationale: νικάω 表示战胜、克服；“胜过恶”简洁且具有庄重的经训语体。
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: 因为有上帝庇护他
  rationale: σκεπόμενος 有遮蔽、保护之意；“庇护”自然传达神的保护。分词与主句的确切逻辑关系可有伴随或原因色彩，此处按语境译出原因关系。
- source_word: τοὺς ἀδικοῦντας
  choice: 那些亏待他的人
  rationale: ἀδικέω 可指行不义、伤害或亏负；“亏待他”在此自然表达对他施加不义，同时不将方式说得过于具体。
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: 如同爱自己的性命
  rationale: ψυχή 在此可指自己、生命或性命；“自己的性命”保留原文强烈的自爱与珍惜生命之比。
theological_decisions:
- issue: 上帝庇护与胜过恶之间的关系
  choice: 译作“因为有上帝庇护他”
  alternative: “同时蒙上帝庇护”或“蒙上帝庇护着”
  rationale: 希腊文现在分词 σκεπόμενος 可表达伴随状态，也可能带原因意味。正文采用通顺的原因表达，但不据此扩展为特定的恩典或功德体系。
- issue: 爱加害者的程度
  choice: “如同爱自己的性命”
  alternative: “如同爱自己”
  rationale: 保留 ψυχή 的生命意象和原文张力，不把命令弱化为一般性的善意，也不引入特定教派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“即使……仍……”清楚呈现让步关系；“行善胜过恶”“上帝庇护”“自己的性命”保留古代训诫文本的凝练力度。
