base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/005.yaml
  text: And he loves the one who has the grace of a good spirit as his own soul.
translation:
  language: zh_hans
  text: 他爱那蒙良善之灵恩惠的人，如同爱自己的性命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ἔχοντα χάριν ἀγαθοῦ πνεύματος
  choice: 那蒙良善之灵恩惠的人
  rationale: ἔχοντα χάριν直译为“拥有恩惠”，这里用“蒙……恩惠”更符合现代汉语，同时保留χάρις的恩惠含义；ἀγαθοῦ πνεύματος保留属格关系，不把“灵”擅自限定为圣灵或人的性情。
- source_word: ἀγαπᾷ
  choice: 爱
  rationale: 直接表达持续性的关爱，不添加原文没有的行为或情感限定。
- source_word: κατὰ τὴν ψυχὴν αὐτοῦ
  choice: 如同爱自己的性命
  rationale: κατά在此表达衡量或比照；ψυχή既可指“灵魂”，也可指“生命、性命”。采用自然的汉语比较结构，并保留珍爱自身生命的力度。
theological_decisions:
- issue: ἀγαθοῦ πνεύματος所指为何
  choice: 良善之灵
  alternative: 善良的心灵／圣灵
  rationale: 原文没有定冠词，也未明确指圣灵；译文不作教派性或人格化限定，保留其可指良善之灵或良善属灵品质的张力。
- issue: ψυχή的语义
  choice: 性命
  alternative: 灵魂／自己
  rationale: 在“爱……如同……”结构中，“性命”较自然地传达对自身生命的珍爱；同时避免把经文收窄为灵魂构成论。
translation_notes:
  register: 采用现代、庄重而易懂的表达。“蒙……恩惠”略带经书语体但仍属当代常用宗教汉语；句式简洁，并保留原文关于“良善之灵”的语义开放性。
