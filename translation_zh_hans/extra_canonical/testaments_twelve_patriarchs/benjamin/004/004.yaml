base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/004.yaml
  text: If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.
translation:
  language: zh_hans
  text: 若有人受人尊崇，他不嫉妒他；若有人富足，他也不妒羡他；若有人勇敢，他就称赞他；他爱自制的人，怜悯穷人，与软弱的人一同受苦，并敬畏上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζηται
  choice: 得了尊荣
  rationale: 该被动形式表示受到尊崇或获得荣耀；译作“得了尊荣”既保留被动含义，也符合现代汉语表达。
- source_word: φθονεῖ
  choice: 嫉妒
  rationale: 准确表达因他人所得的尊荣而产生妒意。
- source_word: ζηλοῖ
  choice: 眼红
  rationale: 此处语境指对他人富足心生妒羡；“眼红”自然易懂，并与前句“嫉妒”形成适度区分。
- source_word: ἀνδρεῖος
  choice: 勇敢
  rationale: 表示勇武、刚强或有胆量的人；此处以“勇敢”概括其核心意义。
- source_word: σώφρονα
  choice: 自守的人
  rationale: σώφρων可指自制、审慎、心智健全；“自守”在德性语境中较凝练，同时不将含义限缩为单一的禁欲观念。
- source_word: πένητα
  choice: 贫穷的人
  rationale: 指生活贫困、需要帮助的人；采用普通现代汉语。
- source_word: ἀσθενοῦντι
  choice: 软弱的人
  rationale: 该词可指身体患病或一般性的软弱；原文未限定是哪一种，故保留较宽泛的“软弱”。
- source_word: συμπάσχει
  choice: 一同受苦
  rationale: 直接体现“共同承受苦难”的构词和语义，不弱化为仅有同情之感。
- source_word: τὸν Θεὸν φοβεῖται
  choice: 敬畏上帝
  rationale: 准确反映φοβεῖται在宗教伦理语境中的敬畏之意，并避免先前异读所造成的“歌颂上帝”。
theological_decisions:
- issue: φοβεῖται所表达的对上帝的态度
  choice: 敬畏上帝
  alternative: 惧怕上帝／歌颂上帝
  rationale: 现有希腊文本明确作φοβεῖται，即“惧怕、敬畏”；在敬虔语境中“敬畏”最贴切。“歌颂”属于不同异文，不能据此取代底本文本。
- issue: ἀσθενοῦντι的软弱性质
  choice: 软弱的人
  alternative: 患病的人
  rationale: 希腊词可涵盖患病、无力和软弱，且本句没有进一步限定；采用宽义译法以保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。各分句保留原文平行结构；末尾以“并且”自然收束德行清单。“眼红”略具口语色彩，但在现代书面语中通行，并可清楚表达对富足者的妒羡。
