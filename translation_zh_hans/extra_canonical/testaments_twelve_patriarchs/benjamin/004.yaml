base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004.yaml
  text: '1[a]. See then, my children, the outcome of the good man. Imitate the good, because of his compassion, so that you also may wear crowns of glory.


    2. For the good man does not have a darkened eye, for he shows mercy to all, even if they are sinners.


    3[b]. And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.


    4. If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.


    5. He defends the one who has the fear of the Lord; he helps the one who loves God; by admonishing, he turns back the one who rejects the Most High; and he loves, as his own soul[c], the one who has the grace of a good spirit.'
translation:
  language: zh_hans
  text: '**便雅悯遗训 第4章**


    1.[a] 所以，我的孩子们，你们要看善人的结局；因着他的怜悯，要效法良善，好叫你们也戴上荣耀的冠冕。


    2. 善人没有昏暗的眼目[b]，因为他怜悯所有人，即使他们是罪人。


    3. 即使别人对他不怀好意，他仍以行善胜过恶，并且蒙上帝庇护。他爱那些亏负他的人，如同爱自己的性命。


    4. 若有人得了尊荣，他不嫉妒；若有人富足，他不眼红；若有人勇敢，他就称赞；他喜爱有节制的人，怜悯穷人，与软弱的人一同受苦，并且敬畏上帝。


    5. 他爱那有良善之灵所赐恩惠的人，如同爱自己的性命。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本在本节之前另有关于“上帝的羔羊”以及无辜者为不敬虔者受死的文字；这些文字的位置和归属难以确定。本译文依本章连贯的劝诫段落，从“所以，我的孩子们”开始。
    reason: textual_variant
  - marker: b
    text: “昏暗的眼目”也可理解为“恶眼”，指嫉妒、吝啬或不情愿善待别人的心态。
    reason: lexical_alternative
  - marker: c
    text: 有些见证在此采用较短的读法，另一些则扩充了德行清单。正文依本任务所给希腊文本的较短读法。
    reason: textual_variant
lexical_decisions:
- source_word: τέλος
  choice: 结局
  rationale: 既可指终局，也可指一生显出的结果；“结局”保留这种范围，并符合劝诫语境。
- source_word: μιμήσασθε
  choice: 效法
  rationale: 表达以某人的善行作为榜样而仿效，比机械的“模仿”更符合现代汉语伦理劝诫的语体。
- source_word: εὐσπλαγχνία
  choice: 怜悯
  rationale: 指发自内心的慈悲和体恤；“怜悯”也与下文反复出现的施怜悯主题相呼应。
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: 昏暗的眼目
  rationale: 保留希腊文的眼目意象，不在正文中直接限定为嫉妒、吝啬或恶意。
- source_word: ἐλεεῖ
  choice: 怜悯
  rationale: 简洁表达主动以慈悲待人的伦理意义。
- source_word: νικᾷ τὸ κακόν
  choice: 以善行胜过恶
  rationale: 保留“胜过”的动态对比，并根据分词“行善”明确其方式。
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: 蒙上帝庇护
  rationale: 自然地传达受上帝遮蔽、保护的意象。
- source_word: ἀδικοῦντας
  choice: 那些亏负他的人
  rationale: 涵盖对他行不义、伤害他的意思，且符合现代汉语人际伦理语境。
- source_word: δοξάζηται
  choice: 得了尊荣
  rationale: 这里主要指人在社会中受到尊崇，而非专指神学意义上的“得荣耀”。
- source_word: φθονεῖ / ζηλοῖ
  choice: 嫉妒／眼红
  rationale: 用两个相近而有区别的现代汉语词，保留原文并列累积的修辞。
- source_word: σώφρων
  choice: 自制的人
  rationale: 在德行清单中主要强调节制和克己，而不只是明智。
- source_word: συμπάσχει
  choice: 一同受苦
  rationale: 保留复合动词所表达的共同承受苦难，强于一般的同情。
- source_word: χάριν ἀγαθοῦ πνεύματος
  choice: 良善之灵的恩典
  rationale: 保留属格关系及“灵”是否特指神之灵的歧义，不擅自译成带明确专名含义的“圣灵”。
theological_decisions:
- issue: 本章开头之前疑似与“上帝的羔羊”及无辜者为不敬虔者受死有关的材料
  choice: 不纳入本章正文，以脚注说明
  alternative: 把这些句子视为第4章开头或后期插入而译入正文
  rationale: 所给希腊文本从“所以，我的孩子们”开始形成连贯的伦理劝诫单元；前置材料的位置与归属不稳定，不宜无说明地并入。
- issue: “昏暗的眼目”的伦理含义
  choice: 正文保留眼目意象
  alternative: 直接译为“恶眼”“嫉妒的眼”或“吝啬的眼”
  rationale: 上下文确实暗示嫉妒、刻薄或不肯施怜悯，但希腊文本并未只限定其中一种，故以脚注提示可能含义。
- issue: 第5节长短异文
  choice: 正文依所给希腊文本采用简短读法，只译爱那具有良善之灵恩典的人
  alternative: 加入保护敬畏主者、帮助爱上帝者、劝回拒绝至高者等扩展德行清单
  rationale: 这些扩展句不见于本任务所给第5节希腊文本。依原文证据优先的原则，不从英语咨询层补入正文，并以脚注记录异文。
- issue: πνεῦμα是否特指圣灵
  choice: 译作“良善之灵”，不使用专名化的“圣灵”
  alternative: 译作“圣灵”或“良善的品格”
  rationale: 短语本身可有不同理解；保留“灵”及其非专名形式，避免过早解决神学歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。伦理劝诫保持直接有力；对“眼目”“灵”“性命”等原文意象尽量保留，同时避免生硬直译。上帝称谓统一使用“上帝”。
