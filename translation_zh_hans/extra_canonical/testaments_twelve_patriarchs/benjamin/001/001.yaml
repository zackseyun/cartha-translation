  text: The Testament of Benjamin, the twelfth son of Jacob and Rachel. The Copy of the Words of Benjamin, which he set in order for his sons, after he had lived one hundred and twenty-five years.
translation:
  language: zh_hans
  text: '雅各的第十二子、拉结之子便雅悯的遗训


    1 便雅悯留给他儿子们的话语的抄本；他活了一百二十五岁。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: 遗训
  rationale: 在本书标题中指临终留下的训言；“遗训”既保留 testament 的体裁意味，也比现代法律用语“遗嘱”更符合正文内容。
- source_word: τοῦ ιβ´ υἱοῦ Ἰακὼβ καὶ Ῥαχήλ
  choice: 雅各的第十二个儿子、拉结所生的
  rationale: 明确便雅悯是雅各的第十二子，同时避免误导读者以为他也是拉结的第十二子；“拉结所生”自然表达其母系关系。
- source_word: Ἀντίγραφον λόγων
  choice: 言辞的抄本
  rationale: 较直接地保留 ἀντίγραφον 的“副本、抄本”之意和 λόγων 的宽泛“言辞”含义，不将其窄化为某一种文体。
- source_word: διέθετο τοῖς υἱοῖς αὐτοῦ
  choice: 留给众子的遗训
  rationale: διέθετο 与标题 Διαθήκη 呼应，带有安排、立遗命的意味；译作“留给……的遗训”在中文中自然，并保留临终嘱托的语境。
- source_word: ζήσας ἔτη ἑκατὸν εἴκοσι πέντε
  choice: 活到一百二十五岁时
  rationale: 以自然中文表达希腊文过去分词所提供的时间背景，不额外断定他是在死后或已经去世之后留下这些话。
theological_decisions:
- issue: 标题中雅各、拉结与“第十二个儿子”的关系
  choice: 将“第十二个儿子”只明确关联雅各，并以“拉结所生”说明母亲
  alternative: “雅各和拉结的第十二个儿子”
  rationale: 后者容易造成拉结有十二个儿子的事实性误解；所选译法忠实呈现谱系身份，而不改变便雅悯作为雅各第十二子的传统定位。
- issue: διαθήκη／διέθετο 的体裁含义
  choice: 遗训／留给众子的遗训
  alternative: 遗嘱／为众子立下遗嘱
  rationale: 法律色彩浓厚的“遗嘱”可能使读者误以为内容主要是财产处分；“遗训”更适合这类临终教导，同时仍保留郑重托付之意。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。标题与第1节分列；正文避免古奥的“遗言录”或过度法律化的措辞，也不依据英文修订中重复标题的异常表述增添希腊文没有的重复内容。
