  to: '雅各的第十二子、拉结之子便雅悯的遗训


    1 便雅悯留给他儿子们的话语的抄本；他活了一百二十五岁。'
  rationale: 修订区分标题的体裁名称与正文对文本性质的称呼，直接呈现“抄本—话语—留给儿子们”的语法关系，并以自然、简洁的现代书面汉语表达其一百二十五岁的寿数。未增添死亡、临终时刻或法律遗嘱等原文未明说的信息。
