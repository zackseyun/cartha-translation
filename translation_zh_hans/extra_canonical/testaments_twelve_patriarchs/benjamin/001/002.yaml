  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/002.yaml
  text: 'And after kissing them, he said: “Just as Isaac was born to Abraham in his old age, so I also was born to Jacob.”'
translation:
  language: zh_hans
  text: 他吻过他们以后，说：“正如以撒是在亚伯拉罕年老时为他所生，我也同样为雅各所生。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταφιλήσας
  choice: 亲吻了
  rationale: 该词表示亲吻、深情地吻；此处用自然庄重的“亲吻了”，保留动作及其亲情色彩。
- source_word: ἐτέχθη τῷ Ἀβραὰμ
  choice: 是亚伯拉罕……所生的
  rationale: 希腊语为被动式“为亚伯拉罕而生”，汉语以“是亚伯拉罕所生的”自然表达亲子关系，并保留被动构式的重点。
- source_word: ἐν γήρει αὐτοῦ
  choice: 年老时
  rationale: 直译为“在他的老年”，指亚伯拉罕年老之际；译作“年老时”简洁自然。
- source_word: οὕτως κἀγὼ τῷ Ἰακώβ
  choice: 我也是雅各所生的
  rationale: 原文后半句省略“出生”动词，由前句补足；中文补出“所生的”，清楚呈现平行比较。
