source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ γὰρ²⁰ Ῥαχὴλ μετὰ τὸ τεκεῖν²¹ τὸν Ἰωσὴφ δώδεκα ἔτη ἐστείρευσεν· καὶ προσηύξατο *πρὸς Κύριον²² μετὰ νηστείας²³, καὶ συλλαβοῦσα τέτοκέ²⁴ με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/004.yaml
  text: For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and having conceived, she bore me.
translation:
  language: zh_hans
  text: 拉结生下约瑟以后，有十二年不能生育；她便禁食，向主祷告。后来她怀了孕，生下了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστείρευσεν
  choice: 不能生育
  rationale: 表达进入并持续不育的状态，比直译为较书面的“成为不育”更符合现代汉语。
- source_word: μετὰ νηστείας
  choice: 禁食，向主祷告
  rationale: μετά在此表示祷告伴随着禁食；采用自然汉语语序，不把禁食误连到后面的怀孕。
- source_word: συλλαβοῦσα τέτοκέ με
  choice: 后来她怀了孕，生下了我
  rationale: 保留先怀孕、后生产的分词时序；“后来”自然承接前句，不额外断言受孕发生于禁食期间。
theological_decisions:
- issue: 禁食与祷告、受孕之间的句法关系
  choice: 将“禁食”修饰“祷告”
  alternative: 理解为“她在禁食期间怀孕”
  rationale: 希腊文μετὰ νηστείας紧接προσηύξατο πρὸς Κύριον，最自然地表示她以禁食伴随向主祷告；随后的καὶ συλλαβοῦσα另起顺承动作。
- issue: 祷告与受孕之间是否明说因果
  choice: 仅按顺序叙述，不明说因果
  alternative: 译作“主便使她怀孕”或“因此她怀孕”
  rationale: 原文呈现事件次序，却未用明确的因果连接词，也未明说主直接使她受孕。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“拉结”“约瑟”沿用通行圣经人名译法；以分号和句号清楚呈现不育、禁食祷告、怀孕生产的叙事进程。
