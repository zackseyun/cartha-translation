lexical_decisions:
- source_word: Σφόδρα ... ἠγάπα
  choice: 深爱
  rationale: 以自然凝练的现代汉语表达“非常爱、极其爱”，保留强烈程度。
- source_word: ηὔχετο
  choice: 祈求
  rationale: 该词可指祷告或许愿；此处以“祈求”保留向上帝求取的语境，同时不额外说明祈求对象。
- source_word: ἰδεῖν
  choice: 能看见
  rationale: 保留原文“看见”的表达，并以“能”呈现不定式所表达的愿望内容。
- source_word: δύο υἱοὺς ... ἐξ αὐτῆς
  choice: 她为他生两个儿子
  rationale: “从她而来的两个儿子”在亲子语境中自然指她所生；补出“为他”明确父亲盼望由拉结得子，不改变原意。
