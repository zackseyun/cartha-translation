source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν γάρ²¹ τις ἐπὶ Κύριον καταφύγῃ, *ἀποτρέχει τὸ πονηρὸν πνεῦμα ἀπʼ αὐτοῦ²², καὶ γίνεται ἡ διάνοια²³ κούφη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/005.yaml
  text: For if anyone takes refuge in the Lord, the evil spirit runs away from him, and the mind becomes light.
translation:
  language: zh_hans
  text: 因为若有人投靠主，邪灵就从他那里逃走，心思也变得轻省。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ Κύριον καταφύγῃ
  choice: 投靠主
  rationale: καταφεύγω表示为求庇护而逃往、投奔；“投靠主”在现代汉语中自然表达以主为避难所的意思。
- source_word: ἀποτρέχει
  choice: 逃走
  rationale: 保留原文生动直接的动作意象，表示邪灵离开并逃离。
- source_word: τὸ πονηρὸν πνεῦμα
  choice: 邪灵
  rationale: 在此处指邪恶的灵体；“邪灵”简洁、自然，也符合上下文。
- source_word: ἡ διάνοια
  choice: 他的心思
  rationale: διάνοια可指心思、思想或理解力；依上下文译作“心思”，并补出汉语所需的所属关系。
- source_word: κούφη
  choice: 轻省
  rationale: 字面义为“轻的”，用于心思时可表达重担或压迫解除后的轻松状态；“轻省”较“轻”更符合现代汉语习惯，同时不将意义具体化为喜乐或清醒。
theological_decisions:
- issue: 邪灵离去与投靠主之间的关系
  choice: 按条件句直译为“若……就……”，保留原文明确的因果关联
  alternative: 弱化为邪灵“可能”离开，或扩展为具体的驱魔教义
  rationale: 原文用ἐάν加虚拟式，并以陈述语气描述结果；译文不削弱其断言，也不增添原文未说明的机制。
- issue: διάνοια κούφη的含义
  choice: 译为“心思也变得轻省”
  alternative: 译为“头脑变得轻浮”“心灵获得自由”或“思想变得清明”
  rationale: κούφη本义存在“轻”的语义张力，语境较可能指摆脱邪灵影响后的轻松；“轻省”保留这一核心意象，避免引入贬义或过度神学化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”承接上文论述；“投靠主”“从他身边逃走”保留原文的庇护与逃离意象。“他的”使汉语指代自然，虽希腊文仅有定冠词，所指仍由前文的“人”确定。
