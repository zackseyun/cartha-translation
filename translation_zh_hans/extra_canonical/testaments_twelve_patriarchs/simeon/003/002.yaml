id: T12P.SIM.3.2
reference: Testament of Simeon 3:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ γὰρ ὁ φθόνος κυριεύει *πάσης τῆς διανοίας τοῦ ἀνθρώπου⁶ καὶ οὐκ ἀφίησιν⁷ αὐτὸν Γοὔτε φαγεῖν, οὔτε πιεῖν, οὔτε¹ ποιῆσαί τι⁸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/002.yaml
  text: For envy masters the whole mind of a person, and does not allow him either to eat or to drink or to do anything good.
translation:
  language: zh_hans
  text: 因为嫉妒支配人的整个心思，使他既不能吃，也不能喝，也不能做任何善事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνος
  choice: 嫉妒
  rationale: 准确表达因他人的优势或所得而产生的妒忌，符合本段所论的恶念。
- source_word: κυριεύει
  choice: 支配
  rationale: 保留“作主、辖制”的强烈含义，同时符合现代汉语表达。
- source_word: πάσης τῆς διανοίας τοῦ ἀνθρώπου
  choice: 人的整个心思
  rationale: πάσης 表示整体范围；διάνοια 在此指人的思想与内在心智活动，“心思”自然且不把含义缩窄为单纯理智。
- source_word: οὐκ ἀφίησιν αὐτόν
  choice: 使他……不能
  rationale: 按语境表达“不容许他”的实际结果，汉语连贯自然，同时保持嫉妒对人的辖制。
- source_word: ποιῆσαί τι ἀγαθόν
  choice: 做任何善事
  rationale: τι 在否定结构中自然译为“任何”；ἀγαθόν 指善的事，译作“善事”简洁庄重。
theological_decisions:
- issue: 嫉妒对人心的作用强度
  choice: 支配人的整个心思
  alternative: 影响人的全部思想
  rationale: 原文 κυριεύει 表达辖制或作主，并非一般性的影响，因此采用更强的“支配”。
- issue: 吃喝行为是否带有礼仪或禁欲含义
  choice: 按字面保留“既不能吃，也不能喝”
  alternative: 解释为不能正常生活
  rationale: 原文直接列举吃、喝及行善，没有说明礼仪、禁欲或其他特殊背景，故不作神学扩展。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留原文因果开头、整体性措辞及“吃—喝—行善”的递进列举，不额外解释其心理或神学机制。
