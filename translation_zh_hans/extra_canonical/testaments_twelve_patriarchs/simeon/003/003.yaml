  text: But it always urges him to kill the one envied; and the one envied always flourishes, while the one who envies wastes away.
translation:
  language: zh_hans
  text: 但嫉妒总是怂恿人杀死自己所嫉妒的人；被嫉妒的人总是兴旺，嫉妒别人的人却日渐衰败。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποβάλλει
  choice: 怂恿
  rationale: 表达暗中唆使、驱使人采取恶行的语气，比中性的“建议”更符合上下文。
- source_word: ἀνελεῖν
  choice: 杀掉
  rationale: 在此取“杀死、除掉”的直接意义，保留原文行为的严重性。
- source_word: τὸν φθονούμενον
  choice: 他所嫉妒的人
  rationale: 将希腊语被动分词自然转为现代汉语关系结构，同时明确嫉妒者与对象的关系。
- source_word: ἀνθεῖ
  choice: 兴旺
  rationale: 原义为“开花”，在与“衰败”对举的比喻中表示蓬勃、兴盛；“兴旺”既自然又保留比喻效果。
- source_word: μαραίνεται
  choice: 日渐衰败
  rationale: 原义为“枯萎”，与ἀνθεῖ形成鲜明对照；译作“日渐衰败”传达持续走向枯萎、败落的状态。
theological_decisions:
- issue: ὑποβάλλει的隐含主语
  choice: 译为“嫉妒”，依据紧邻语境补明主语
  alternative: 保留代词“它”
  rationale: 本节承接前文所论的嫉妒；汉语若仅用“它”可能指代不明。补出“嫉妒”不改变命题内容，并使句子可独立理解。
- issue: 对比句是否表达普遍性的道德结果
  choice: 两句均保留“总是”，不将其弱化为可能性
  alternative: 译为“往往”或“常常”
  rationale: 原文两次使用πάντοτε，具有明确的全称、持续性表达；应保留其张力，不作解释性缓和。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“怂恿”体现嫉妒的主动驱使，“兴旺／衰败”保留ἀνθεῖ与μαραίνεται的对举。无脚注标记。
