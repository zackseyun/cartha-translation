  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/004.yaml
  text: For two years, then, in fear of the Lord I afflicted my soul with fasting, and I learned that the release from envy comes through fear of God.
translation:
  language: zh_hans
  text: 因此，我出于对主的敬畏，禁食使自己的心灵受苦两年，并且明白了：嫉妒得以解除，是借着敬畏上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν φόβῳ κυρίου
  choice: 在敬畏主中
  rationale: 保留介词结构及“主”的称谓，表达西缅行事所处的敬虔心态，同时避免把它弱化为单纯的害怕。
- source_word: ἐκάκωσα τὴν ψυχήν μου
  choice: 苦待自己的心灵
  rationale: 较贴近“使受苦/苦待”与“我的心灵”的原文措辞；在禁食语境中自然，也不把 ψυχήν 简化为仅指身体。
- source_word: ἐν νηστείᾳ
  choice: 以禁食
  rationale: 表达禁食是苦待心灵的方式，符合工具性语境。
- source_word: ἡ λύσις τοῦ φθόνου
  choice: 从嫉妒中得释放
  rationale: λύσις 有解除、松脱、释放之意；τοῦ φθόνου 可表示所脱离的嫉妒。此译法既通顺，也保留“嫉妒的解除”这一关系。
- source_word: διὰ φόβου θεοῦ γίνεται
  choice: 是借着敬畏上帝而来的
  rationale: διὰ 加属格表示途径或媒介；γίνεται 表示发生、成为或产生，译作“而来”可自然表达这种生成关系，而不强化为机械因果。
theological_decisions:
- issue: “敬畏”是否应译作单纯的恐惧
  choice: 敬畏
  alternative: 惧怕
  rationale: φόβος 在敬虔语境中兼具畏惧与尊崇；“敬畏”较能保留宗教伦理含义，而不把它限定为心理恐慌。
- issue: “释放”是上帝主动施行，还是一种伦理过程
  choice: 保留无明确施事者的表达“得释放……而来”
  alternative: 上帝使人摆脱嫉妒
  rationale: 希腊文没有明说施事者，只说释放借着敬畏上帝而发生；译文不补入原文未明示的神学因果主体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这样”承接 Γοῦν 的推论/叙事衔接；句末用“是……而来的”保持格言式总结。全文无需脚注。
