  text: And now, my children, hear me and guard yourselves against the spirit of deceit and envy.
translation:
  language: zh_hans
  text: 现在，我的孩子们，要听我说，也要谨防迷惑和嫉妒的灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲属称呼，保留西缅临终训诲的亲切、庄重语气。
- source_word: ἀκούσατέ μου
  choice: 要听我说
  rationale: 按现代汉语自然表达处理希腊语属格宾语，既可理解为听取话语，也带有听从劝诫的意味。
- source_word: φυλάξασθε ἀπό
  choice: 谨防
  rationale: 中间语态命令式要求听众保护自己、远离某种危险；“谨防”简洁传达警戒与自守。
- source_word: πνεύματος τῆς πλάνης
  choice: 迷惑的灵
  rationale: πλάνη可指迷误、欺骗或使人偏离正道；“迷惑”保留致人误入歧途与受骗的语义空间。
- source_word: φθόνου
  choice: 嫉妒
  rationale: 常见核心义为嫉妒、妒忌；采用现代汉语通行且庄重的“嫉妒”。
theological_decisions:
- issue: “迷惑和嫉妒的灵”中单数πνεῦμα的理解
  choice: 保留为“迷惑和嫉妒的灵”
  alternative: 意译为“迷惑与嫉妒的心态”或拆分为两种灵
  rationale: 原文以单数“灵”统摄两个属格概念，可能指一种属灵势力，也可能指支配人的倾向；直译可保留这一神学与语义张力，不预先限定其本体性质。
translation_notes:
  register: 采用现代、庄重而易懂的训诫语体。“现在”自然承接上文；两个“要”体现并列命令。“谨防”避免生硬的“保护自己远离”。
