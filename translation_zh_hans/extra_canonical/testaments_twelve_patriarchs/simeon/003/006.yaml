  text: And from then on he has compassion for the one envied, and forgives those who love him, and so he ceases from envy.
translation:
  language: zh_hans
  text: 从此，他就同情那被嫉妒的人，也宽恕那些爱他的人，于是不再嫉妒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιπὸν
  choice: 此后
  rationale: 在这里表示从这一转变开始、往后如此；译作“此后”自然简洁。
- source_word: συμπαθεῖ τῷ φθονουμένῳ
  choice: 怜悯那被嫉妒的人
  rationale: 保留分词的被动含义，即此人是嫉妒所针对的对象；“怜悯”传达 συμπαθεῖ 的同情、体恤之意。
- source_word: συγγινώσκει
  choice: 体谅
  rationale: 该词可指理解、宽宥或原谅；此处选择较宽而自然的“体谅”，避免在上下文不足时把含义限定为正式的饶恕。
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: 那些爱他的人
  rationale: 按现存希腊文本直译，保留 αὐτόν 的男性单数指代及其可能存在的指称张力。
- source_word: παύεται τοῦ φθόνου
  choice: 不再嫉妒了
  rationale: 用现代汉语自然表达“停止嫉妒”，并保留动作终止的意义。
theological_decisions:
- issue: αὐτόν（“他”）的指代对象
  choice: 保留为“那些爱他的人”，不明确补出所指
  alternative: 译为“那些爱那被嫉妒之人的人”，或按语境另行明确指代
  rationale: 希腊文仅用男性单数代词，可能回指被嫉妒者，也可能依更广上下文另有所指；正文不应擅自消除这一歧义。
- issue: συγγινώσκει 的语义强度
  choice: 译为“体谅”
  alternative: 译为“宽恕”或“原谅”
  rationale: 该词兼有理解、谅解、宽宥等范围；“体谅”较能保存语义弹性，也与嫉妒转化为同情的语境相称。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“那被嫉妒的人”略带书面色彩，但能准确保留希腊语被动分词。“也……于是……”呈现原文并列及结果关系。
