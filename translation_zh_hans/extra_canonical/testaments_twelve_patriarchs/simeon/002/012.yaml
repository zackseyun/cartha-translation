  - severity: low
    issue: “也”对καίγε的处理不够明确。
    rationale: καίγε带有“而且／的确／于是”的连接或强调作用；以“主就”更自然地连接叙述，而不强加对比含义。
  - severity: low
    issue: “击垮”在现代汉语中较易理解为心理或彻底摧毁。
    rationale: συνετρίβει保有强烈的压伤、重击意味；“重重打击”更自然，同时不具体化伤害方式。
