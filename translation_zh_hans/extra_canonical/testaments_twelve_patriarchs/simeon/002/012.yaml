  text: Καίγε συνετρίβει με *ὁ Κύριος⁷⁸ καὶ ἐκώλυσεν δράσιν⁷⁹ *ἀπʼ ἐμοῦ⁸⁰. *ὅτι ἡ χείρ μου ἡ δεξιὰ ἡμίξηρος γέγονεν ἐπὶ ἡμέρας ἑπτά⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/012.yaml
  text: And the Lord crushed me and held back action from me, for my right hand became half-withered for seven days.
translation:
  language: zh_hans
  text: 主就重重打击我，拦阻我行动；因为我的右手变得半枯萎，[a]持续了七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “半枯萎”直译为“半干枯”；也可指右手部分失去活动能力。
    reason: 说明罕见复合形容词ἡμίξηρος的字面意义及其可能所指，同时不将具体症状定死。
lexical_decisions:
- source_word: συνετρίβει
  choice: 击垮
  rationale: 保留 συντρίβω“压碎、击垮”的强烈语气；希腊文未明说具体方式，因此不增添“惩罚”等解释。
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  choice: 阻止我行动
  rationale: 按自然现代汉语表达“阻止行动从我而出”，不把所阻止的行动具体解释为暴力或攻击。
- source_word: ἡμίξηρος
  choice: 半枯萎
  rationale: 对应由“半”与“干枯”构成的希腊词，保留右手并非完全枯萎的表述。
theological_decisions:
- issue: 主的作为及其目的
  choice: 直译为主击垮并阻止叙述者行动
  alternative: 解释为主惩罚他或制止他的暴力
  rationale: 原文明确以主为施事者，却没有明说这是惩罚，也没有在本句限定所阻止行动的性质，故不替文本消解这种张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“击垮”保留原文力度，“阻止我行动”避免生硬照搬希腊语结构；时间语“有七天”修饰右手半枯萎的状态。
