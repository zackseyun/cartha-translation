  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/007.yaml
  text: And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.
translation:
  language: zh_hans
  text: 我就对他硬起心肠[a]，想要杀死他；因为迷惑之王和嫉妒之灵蒙蔽了我的心智，使我不把他看作弟兄，也不顾惜我父亲雅各。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“把我的肝脏坚定地朝向他”；古人常以肝脏表示内在的情感和意志。
    reason: 说明希腊文不寻常的身体意象，并交代正文采用中文习语“硬起心肠”的依据。
lexical_decisions:
- source_word: ἐστήριξα ἐπʼ αὐτὸν τὰ ἤπατά μου
  choice: 我就对他硬起心肠
  rationale: 原文直译近似“我把肝脏坚定地朝向他”，以“肝脏”指内在情感与意志。中文用“硬起心肠”自然传达蓄意狠下心伤害对方，同时以脚注保留身体意象。
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: 迷惑之王
  rationale: ἄρχων指掌权者或统治者，πλάνη可指迷惑、欺骗或使人偏离正道；“迷惑之王”保留其人格化与属灵权势色彩。
- source_word: τὸ πνεῦμα τοῦ ζήλου
  choice: 嫉妒之灵
  rationale: ζῆλος可指热心或嫉妒；本段讲西缅因嫉妒约瑟而生杀意，故语境明确支持“嫉妒”。
- source_word: ἐτύφλωσέ μου τὸν νοῦν
  choice: 蒙蔽了我的心智
  rationale: 保留“使心智失明”的比喻；“蒙蔽”在现代汉语中自然，“心智”对应νοῦς的思想、判断与理解能力。
- source_word: μηδὲ φείσασθαι τῷ πατρί μου Ἰακὼβ
  choice: 也不顾惜我父亲雅各
  rationale: φείδομαι可指怜惜、顾惜或避免伤害；此处表达他甚至不顾自己的行为会给父亲带来伤害，译文不额外限定伤害的具体方式。
theological_decisions:
- issue: 迷惑之王与嫉妒之灵的关系
  choice: 按原文并列呈现为“迷惑之王和嫉妒之灵”
  alternative: 将二者解释为同一属灵存在的两个称号
  rationale: 希腊文以καί连接二者，虽谓语为单数，但这可能反映概念上的紧密联系或语法上的一致方式；译文不强行判定二者是否完全同一。
- issue: 后期修订记录与所给希腊文冲突
  choice: 依所给希腊原文翻译“蒙蔽了我的心智……不顾惜我父亲雅各”
  alternative: 采用修订记录中的“是他的神……差遣天使救他”等内容
  rationale: 修订记录所提内容并不存在于本题所给希腊文本，且会删除原文实际出现的语句；因此不能据此改写本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“硬起心肠”“蒙蔽了我的心智”“不顾惜”兼顾自然度与原文力度；保留“迷惑之王”“嫉妒之灵”的人格化表达，不作超出文本的教义解释。
