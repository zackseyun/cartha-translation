source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἔγνων⁹⁴ γὰρ ὅτι πονηρὸν πρᾶγμα ἐνεθυμήθην ἐνώπιον κυρίου⁹⁵ καὶ⁹⁶ *Ἰακὼβ τοῦ πατρός μου⁹⁷ *διὰ Ἰωσὴφ⁹⁸ *τὸν ἀδελφόν μου, φθονήσας αὐτῷ⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/014.yaml
  text: For I knew that I had conceived an evil deed before the Lord and Jacob my father concerning Joseph my brother, being envious of him.
translation:
  language: zh_hans
  text: 因为我知道，我因嫉妒我兄弟约瑟，在主和我父亲雅各面前心里盘算了一件恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: 我知道
  rationale: 按不定过去时直译为已经意识到或知道；中文语境中“我知道”自然，并可由上下文体现其回顾性质。
- source_word: πονηρὸν πρᾶγμα
  choice: 一件恶事
  rationale: πρᾶγμα指事情、行为或所谋之事；“恶事”兼顾其道德性质与尚在心中谋划的语境。
- source_word: ἐνεθυμήθην
  choice: 心里盘算了
  rationale: 该词表示在心中思量、谋划；“心里盘算”既保留内在意念，也不把它误译成已经实施的行为。
- source_word: ἐνώπιον κυρίου καὶ Ἰακὼβ τοῦ πατρός μου
  choice: 在主和我父亲雅各面前
  rationale: 严格保留ἐνώπιον及καί的并列结构，不增补原文没有的“得罪”或“反对”。
- source_word: διὰ Ἰωσὴφ τὸν ἀδελφόν μου
  choice: 因……我兄弟约瑟
  rationale: διά加宾格在此表达缘由或所涉及的对象；结合后面的嫉妒分词，译作“因”较自然。
- source_word: φθονήσας αὐτῷ
  choice: 因嫉妒……约瑟
  rationale: 分词说明盘算恶事的伴随原因；中文前置为原因状语，明确αὐτῷ所指，同时避免累赘重复。
theological_decisions:
- issue: 恶事与主及雅各的关系
  choice: 保留“在主和我父亲雅各面前”的原文表达
  alternative: 译作“得罪主、违背我父亲雅各”
  rationale: 原文只有ἐνώπιον，没有明确表达“得罪”或“反对”；不应替作者消解这层关系上的含混。
- issue: 意念与行动的界限
  choice: 译为“心里盘算了一件恶事”
  alternative: 译为“做了一件恶事”
  rationale: ἐνεθυμήθην着重内心思量或谋划；译成已经施行会超出原文证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“我父亲雅各”保留古代见证文学的郑重语序；全句调整为自然汉语顺序，同时保留原文关于“在……面前”的神学张力。
