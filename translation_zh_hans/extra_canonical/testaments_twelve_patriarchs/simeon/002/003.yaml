  text: For I became very strong; I did not shrink from any deed, nor was I afraid of anything.
translation:
  language: zh_hans
  text: 因为我变得极其强壮；我面对任何行动都不退缩，也不惧怕任何事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυνατὸς
  choice: 强壮
  rationale: 在说话者自述个人能力的语境中，表达身体或行动能力上的强健；用“强壮”自然明确，同时不额外引入权势含义。
- source_word: ἐγενόμην
  choice: 变得
  rationale: 保留不定过去时所表达的状态变化，而不静态译作“我是”。
- source_word: σφόδρα
  choice: 极其
  rationale: 传达强烈程度，语体庄重而符合现代汉语。
- source_word: οὐκ ἐδειλίασα πρᾶξιν
  choice: 无论什么事，我都不退缩
  rationale: δειλιάω表示胆怯、畏缩；结合πρᾶξιν，译为面对任何行动或事情都不退缩，比直译“我不胆怯一件行为”自然。
- source_word: οὐδὲ ἐφοβήθην ἀπὸ παντὸς πράγματος
  choice: 也不惧怕任何事情
  rationale: 以自然汉语表达对任何事物或情势都不害怕；避免生硬照搬介词ἀπό。
