  text: For courage also is given by the Most High to men in soul and body.
translation:
  language: zh_hans
  text: 因为勇气也是至高者赐给人的，既在心灵上，也在身体上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνδρεία
  choice: 勇气
  rationale: 该词表示勇敢、刚毅；“勇气”简明自然，也避免将其局限为男性气概或军事英勇。
- source_word: ὑψίστου
  choice: 至高者
  rationale: 保留希腊文对上帝的尊称及其名词化表达。
- source_word: ἐν ψυχαῖς καὶ σώμασιν
  choice: 既在心灵上，也在身体上
  rationale: 体现心灵与身体两个层面，并以自然的现代汉语表达复数所具有的分配意义，不把二者误作“勇气”的直接领受者。
theological_decisions:
- issue: 勇气的来源及其在人内在与身体层面的关系
  choice: 勇气由至高者赐给人，并涉及心灵和身体两个层面
  alternative: 至高者把勇气直接赐给人的灵魂和身体
  rationale: 希腊文以“人”为间接宾语，并另用介词短语说明心灵与身体的范围；所选译法保留这一结构关系，不额外界定勇气如何分别作用于二者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留句首“因为”以承接上文论述，并用“既……也……”清楚呈现心灵与身体的并列。
