source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔγνων, τέκνα⁸², ὅτι *περὶ Ἰωσὴφ⁸³ *τοῦτό μοι συνέβη⁸⁴. καὶ⁸⁵ μετανοήσας ἔκλαυσα⁸⁶ καὶ⁸⁷ ηὐξάμην *Κυρίῳ τῷ Θεῷ⁸⁸ ἵνα⁸⁹ *ἀποκατασταθῇ ἡ χείρ μου⁹⁰ καὶ⁹¹ ἀποσχῶ⁹² ἀπὸ *παντὸς μολυσμοῦ καὶ φθόνου⁹³ Γκαὶ ἀπὸ πάσης ἀφροσύνης⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/013.yaml
  text: And I knew, my children, that this happened to me because of Joseph. And after repenting, I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.
translation:
  language: zh_hans
  text: 孩子们，我明白了：这事临到我，是因为约瑟。我悔改后，便哭泣，向主上帝祷告，求他使我的手复原，并让我远离一切污秽和嫉妒，以及一切愚昧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: 孩子们
  rationale: 保留长者对子女直接劝诫的称呼，符合现代汉语自然表达。
- source_word: περὶ Ἰωσὴφ
  choice: 因为约瑟
  rationale: περί在此结合上下文表示事情因约瑟一事而发生；译法保留原文未进一步说明具体因果关系的简略性。
- source_word: μετανοήσας
  choice: 悔改
  rationale: 此处不只是改变想法，而是因先前的恶意而懊悔并转离，故采用自然且语境准确的“悔改”。
- source_word: ἀποκατασταθῇ
  choice: 复原
  rationale: 表达手恢复到原有正常状态，简洁对应被动形式。
- source_word: ἀποσχῶ
  choice: 远离
  rationale: 表达克制自己、不再沾染这些恶行；比生硬的“戒绝”更符合现代普通读者的语言。
- source_word: μολυσμοῦ
  choice: 污秽
  rationale: 保留该词兼具道德污染意味的宽泛表达，不擅自限定为礼仪或身体污秽。
- source_word: φθόνου
  choice: 嫉妒
  rationale: 在本书约瑟事件的语境中指因他人所得之善而生的妒意。
- source_word: ἀφροσύνης
  choice: 愚昧
  rationale: 既可涵盖缺乏明智，也可指由此产生的错误行为；“愚昧”保留其道德与认知层面的张力。
theological_decisions:
- issue: 祷告中人的克制与上帝作为的关系
  choice: “也使我远离”
  alternative: “并让我戒绝”或“使我能够远离”
  rationale: 希腊文ἵνα统摄两个虚拟式动词，但第二个ἀποσχῶ为第一人称主动式。译文既承接向上帝的祈求，又不抹去说话者主动远离恶行的责任。
- issue: 因约瑟而受苦的含义
  choice: “这事临到我，是因为约瑟”
  alternative: “这事因我对约瑟所做的而临到我”
  rationale: 原文περὶ Ἰωσήφ表达简略；不补入虽符合上下文却未明说的行为，以保留原文的含蓄与因果张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句首用“我明白了”传达ἔγνων在经历后的领悟；将连续动作译为“悔改、哭泣，并……祷告”，保持叙事清晰。无脚注需要，因此正文不设脚注标记。
