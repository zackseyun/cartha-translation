base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/002.yaml
  text: I was born from Jacob, the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.
translation:
  language: zh_hans
  text: 我是雅各所生的，是我父亲的次子。我母亲利亚给我起名叫西缅，因为主听见了她的祈求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγεννήθην ἐξ Ἰακώβ
  choice: 我是雅各所生的
  rationale: 保留被动出生表达及ἐξ所表示的出自关系，同时采用自然、庄重的现代汉语。
- source_word: υἱὸς δεύτερος τῷ πατρὶ μου
  choice: 是我父亲的次子
  rationale: 将同位说明独立成句以避免汉语歧义；“次子”准确表达第二个儿子。
- source_word: ἐκάλεσέ με Συμεῶνα
  choice: 给我起名叫西缅
  rationale: 此处καλέω涉及命名；“起名叫”比单纯“称我为”更符合现代汉语。
- source_word: ἤκουσε Κύριος τῆς δεήσεως αὐτῆς
  choice: 主听见了她的祈求
  rationale: 直译属格结构所表达的垂听对象，不额外引入“应允”等源文未明说的含义。
theological_decisions:
- issue: “听见祈求”是否含有应允之意
  choice: 主听见了她的祈求
  alternative: 主垂听了她的祈求
  rationale: “垂听”可能暗示恩准或应允；译作“听见”更贴近ἤκουσε，并保留听见与应允之间的潜在张力。
translation_notes:
  register: 采用现代标准普通话简体中文，语气庄重而通俗。以句号处理希腊语中的并列结构，使亲子关系和同位说明清楚，不改变信息次序与因果关系。
