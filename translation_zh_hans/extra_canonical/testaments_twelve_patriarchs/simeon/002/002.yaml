  text: Ἐγὼ ἐγεννήθην ἐξ Ἰακὼβ *υἱὸς δεύτερος τῷ πατρὶ μου⁵, *καὶ Λία⁶ ἡ μήτηρ μου ἐκάλεσέ με⁷ Συμεώνα⁸, ὅτι⁹ ἤκουσε Κύριος τῆς δεήσεως αὐτῆς¹⁰.
