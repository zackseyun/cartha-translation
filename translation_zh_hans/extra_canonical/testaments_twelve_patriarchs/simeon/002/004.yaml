  source_fidelity: 译文按原文三个并列的身体意象分别译出 καρδία（心）、ἤπατα（肝）和 σπλάγχνα（肺腑），没有把古代身体—情感语言过度抽象化。将 σκληρά 译为“刚硬”、ἀκίνητα 译为“毫无触动”、ἀσυμπαθῆ 译为“毫无怜悯之情”，准确传达自责语境中冷硬、麻木和缺乏同情的递进。
  naturalness: “因为我的心刚硬，我的肝毫无触动，我的肺腑也毫无怜悯之情”是庄重、清楚的现代书面汉语。虽然“肝毫无触动”保留了原文较陌生的器官意象，但由脚注说明，且在此类古代文本中是合宜的保留。
  terminology: “心”“肝”“肺腑”彼此区分且符合原文；“肺腑”适当地同时承载内脏和深层情感的含义。“怜悯之情”忠实表达 ἀσυμπαθῆ 所否定的同情、共感，未添加教派性解释。脚注锚点 [a]、[b] 均对应明确，内容准确。
