source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἡ γὰρ καρδία μου ἦν σκληρά, καὶ *τὰ ἤπατά¹⁵ μου ἀκίνητα καὶ τὰ σπλάγχνα μου ἀσυμπαθῆ¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/004.yaml
  text: For my heart was hard, and my liver unmoved, and my inward parts without compassion.
translation:
  language: zh_hans
  text: 因为我的心刚硬，我的肝毫无触动[a]，我的肺腑也毫无怜悯之情[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毫无触动”直译为“不动”；这里用身体器官的静止描写情感上的麻木。
    reason: 说明译文对 ἀκίνητα 的语境化处理，同时保留其字面意象。
  - marker: b
    text: “肺腑”原指内脏，在古代语言中也可指深处的情感。
    reason: 帮助现代读者理解 σπλάγχνα 的身体义和情感义。
lexical_decisions:
- source_word: καρδία
  choice: 心
  rationale: 保留原文以身体器官表达内在意志和情感的说法；“心刚硬”在现代汉语中自然且庄重。
- source_word: τὰ ἤπατά
  choice: 肝
  rationale: 按原文保留“肝”这一具体器官意象，不笼统改写为“内心”，以呈现古代关于情感所在的身体语言。
- source_word: ἀκίνητα
  choice: 毫无触动
  rationale: 该词字面义为“不动、不受推动”；结合肝作为情感器官的语境，译作“毫无触动”既保留意象，也传达情感上的麻木。
- source_word: σπλάγχνα
  choice: 肺腑
  rationale: 该词指内脏，并可引申为深处的情感；“肺腑”既保留身体意象，又符合自然、庄重的现代汉语。
- source_word: ἀσυμπαθῆ
  choice: 毫无怜悯之情
  rationale: 表达缺乏同情、怜悯的状态；此处选择“怜悯”以贴合上下文中的道德情感，同时不额外引入教派性含义。
theological_decisions:
- issue: 身体器官意象与心理意义之间的关系
  choice: 保留“心、肝、肺腑”三个器官意象，同时用“毫无触动”“毫无怜悯之情”使其心理含义清楚
  alternative: 统一意译为“我的内心刚硬、麻木而没有同情心”
  rationale: 原文刻意并列不同身体部位来描写整个人的冷硬；保留这种张力比将其归并为抽象的“内心”更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文“心—肝—肺腑”的递进式身体意象，避免把古代情感语言完全抽象化；句式紧凑，与本节自省和认罪的语气相称。
