  text: And Reuben, hearing these things, was grieved, for he wanted to bring him safely back to his father.
translation:
  language: zh_hans
  text: 吕便听见这些事，就忧伤；因为他想把约瑟带回到他父亲那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυπήθη
  choice: 很忧伤
  rationale: 表达因所听之事而产生的悲痛，采用自然庄重的现代汉语。
- source_word: ἤθελε
  choice: 本想
  rationale: 未完成时在上下文中表示当时已有、但未实现的意愿；“本想”能自然传达这一层意思。
- source_word: αὐτόν
  choice: 约瑟
  rationale: 汉语中连续使用代词易导致所指不清，因此按上下文明确为约瑟，不增添原文没有的意义。
- source_word: ἀπαγαγεῖν πρὸς τὸν πατέρα
  choice: 带回他父亲那里
  rationale: ἀπάγω的核心意思是带走、带去；结合目的地是父亲所在之处，以“带回……那里”自然表达。原文没有明确表示“安全地”，故不加入该义。
