  text: But when I heard this, I was very angry with Judah, because he had let him go alive; and for five months I remained angry with him.
translation:
  language: zh_hans
  text: 但我听见这事，就对犹大非常生气，因为他把约瑟活着放走了；我一连五个月都对他生气。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα ἀκούσας
  choice: 听见这事
  rationale: 用自然的现代汉语表达分词结构，并保留ταῦτα所指的前文内容。
- source_word: ὠργίσθην ἐπὶ τὸν Ἰούδαν σφόδρα
  choice: 对犹大非常生气
  rationale: 准确体现ὀργίζομαι加ἐπί所表达的发怒对象，以及σφόδρα的强烈程度。
- source_word: ζῶντα αὐτὸν ἀπέλυσεν
  choice: 竟让约瑟活着离开了
  rationale: ζῶντα是宾语补语，强调他仍活着；ἀπέλυσεν在此表示放走、任其离开。依叙事语境将代词明确为“约瑟”，避免现代汉语中连续男性代词造成歧义；“竟”自然传达说话者愤怒所针对的反预期事实。
- source_word: ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ
  choice: 我一连五个月都在生他的气
  rationale: 将希腊语表示持续一段时间的结构译为自然汉语，保留愤怒延续五个月之意。
