  text: Hear, my children, Simeon your father, and I will declare to you what I have in my heart.
translation:
  language: zh_hans
  text: 我的孩子们，要听你们父亲西缅的话；我要把心里的一切都告诉你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: 要听……的话
  rationale: 该词是复数命令式；结合后面的“西缅，你们的父亲”，译成现代汉语自然的劝告语气。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留亲属称谓和复数含义，符合父亲向众子女临终训诲的庄重语境。
- source_word: ἀναγγελῶ
  choice: 我要……告诉
  rationale: 表达公开陈明、宣告之意；“告诉”在现代汉语中清楚自然，同时不额外强化为预言或启示。
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου
  choice: 心里的一切
  rationale: 保留“在我心里所有的事”这一内在思想或感受的宽泛表达，不限定为秘密、感情或教训。
