  text: But his God and the God of our fathers sent his angel and rescued him from my hands.
translation:
  language: zh_hans
  text: 但他的上帝和我们祖先的上帝，差遣了他的天使，把他从我手中救了出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεὸς αὐτοῦ καὶ ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 他的上帝，就是我们祖先的上帝
  rationale: 希腊文直译为“他的上帝和我们祖先的上帝”。此处两个带冠词的称谓指向同一位上帝；用“就是”自然表达同位关系，同时避免让现代读者误解为两位不同的神。
- source_word: ἀπέστειλε τὸν ἄγγελον αὐτοῦ
  choice: 差遣了他的天使
  rationale: 保留“差遣”所表达的授权行动，也保留“他的天使”在所指上的原文表达。
- source_word: ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου
  choice: 把他从我手中救了出来
  rationale: ἐρρύσατο表示从危险或控制下解救；“从我手中救了出来”既保留原文意象，也符合现代汉语习惯。
theological_decisions:
- issue: “他的上帝”和“我们祖先的上帝”之间的关系
  choice: 用“就是”将两种称谓理解为同指一位上帝
  alternative: 直译为“他的上帝和我们祖先的上帝”
  rationale: 上下文和单数动词所呈现的是同一行动主体。“就是”明确同位关系，但不额外引入任何宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“祖先”比“列祖”更符合普通现代读者的表达习惯；保留“上帝”“差遣”“天使”等经文语域中的常用词。
