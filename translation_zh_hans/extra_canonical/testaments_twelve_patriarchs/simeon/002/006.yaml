lexical_decisions:
- source_word: Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου
  choice: 因为我年轻的时候
  rationale: γάρ承接上文说明缘由，译作“因为”；时间短语自然处理为“我年轻的时候”。
- source_word: πολλὰ ἐζήλωσα
  choice: 非常嫉妒
  rationale: ζηλόω在此以约瑟为对象并由父亲偏爱引发，表达强烈嫉妒；πολλά作程度强化，译作“非常”。
- source_word: παρὰ πάντας
  choice: 胜过所有人
  rationale: 保留比较结构及“所有人”未明说具体范围的概括性，不擅自限定为“众兄弟”。
theological_decisions:
- issue: 父亲之爱的比较范围
  choice: 爱他胜过所有人
  alternative: 最爱他／爱他胜过我们所有人
  rationale: 原文παρὰ πάντας直译为“胜过所有人”，没有明确补出“我们”或“兄弟”；正文保留其范围上的概括与潜在歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留原文连续两个因果表达：首个“因为”连接上文，第二个“因为”说明西缅嫉妒约瑟的缘由；虽有重复，但逻辑层次清晰并贴近希腊文。
