source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ὡς γὰρ⁴⁷ ἐγὼ ἐπορεύθην⁴⁸ *ἐν Σικίμοις⁴⁹ ἐνέγκαι⁵⁰ ἄλειμμα⁵¹ τοῖς ποιμνίοις⁵² καὶ Ῥουβὶμ⁵³ εἰς⁵⁴ Δοθαείμ⁵⁵, ὅπου⁵⁶ τὰ ἐγχρῄζοντα⁵⁷ ἡμῖν⁵⁸ καὶ πᾶσα⁵⁹ ἡ ἀπόθεσις ἦν⁶⁰, Ἰούδας⁶¹ ὁ ἀδελφός μου⁶² ἐπώλησεν αὐτὸν⁶³ ἐλθὼν τοῖς Ἰσμαηλίταις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/009.yaml
  text: For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.
translation:
  language: zh_hans
  text: 因为那时我去了示剑，给羊群带膏油；吕便则去了多坍，我们所需的物资和全部储备都在那里。我兄弟犹大来到以实玛利人那里，把他卖给了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Σικίμοις
  choice: 去了示剑
  rationale: 按上下文将介词短语与表示移动的动词连用，译出目的地；“示剑”采用通行的圣经地名译法。
- source_word: ἄλειμμα
  choice: 膏油
  rationale: 该词指用于涂抹的油膏或软膏；“膏油”既保留具体物质含义，也避免擅自说明其兽医用途。
- source_word: τοῖς ποιμνίοις
  choice: 给羊群
  rationale: ποιμνίον在此指群羊；与ἄλειμμα连用时保留原文较不寻常的表达，不增补原文未说明的用途。
- source_word: τὰ ἐγχρῄζοντα ἡμῖν
  choice: 我们所需的物资
  rationale: 按实质意义译作供他们使用的必需品；“物资”符合储存在某地的语境。
- source_word: πᾶσα ἡ ἀπόθεσις
  choice: 全部储备
  rationale: ἀπόθεσις可指存放、储藏之物或储备；此处与所需物资并列，译作“储备”自然且不把它限定为仓库建筑。
- source_word: ἐλθὼν
  choice: 来到那里
  rationale: 明确保留原文关于犹大“来到”的分词信息；“那里”依上下文指多坍。
- source_word: τοῖς Ἰσμαηλίταις
  choice: 给了以实玛利人
  rationale: 采用通行族名“以实玛利人”，并与“卖”组成现代汉语自然结构。
theological_decisions:
- issue: 约瑟被卖事件中各兄弟的行动与责任
  choice: 保留原文叙述：吕便去了多坍，犹大来到那里并把约瑟卖给以实玛利人
  alternative: 依《创世记》的叙事细节补充其他兄弟、商队或吕便不在场等解释
  rationale: 本节自身的叙述与正典《创世记》的细节安排存在张力；译文不借平行记载调和，也不增添原文没有的信息。
- issue: 代词αὐτόν的指称
  choice: 译作“他”，不在正文补明姓名
  alternative: 译作“约瑟”
  rationale: 希腊文仅用阳性代词，其先行对象由上文确定；保留代词可忠实维持篇章衔接。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。以分号和句号理清希腊文长句层次，并用“则”自然表达吕便与西缅行动的对举。未添加脚注，因为本节的地点、人物和关键动作可在正文中清楚表达；同时保留“膏油”这一较特别但可理解的原文意象。
