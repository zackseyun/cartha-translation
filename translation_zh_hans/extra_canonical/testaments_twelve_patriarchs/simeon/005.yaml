base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005.yaml
  text: 'Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.


    And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will be finding favor before the Lord and men.


    Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.


    For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.


    But they will not be able to stand against Levi, because he will fight the Lord’s war and will defeat your whole host.


    And they will be few in number, being divided in Levi and in Judah, and none from among you will be for leadership, just as our father also prophesied in his blessings.'
translation:
  language: zh_hans
  text: '5 因此，约瑟身材俊美，容貌秀丽，因为他里面没有任何邪恶居住；原来，人的面容会显露心灵的扰乱。


    2 现在，我的孩子们，你们要在主面前使你们的心向善，在众人面前使你们的道路正直；这样，你们就会在主和众人面前蒙恩。


    3 所以，你们要防备淫乱，因为淫乱是诸恶之母，使人与上帝隔绝，又使人亲近彼列[a]。


    4 因为我曾在以诺的书面记载中看见：你们的儿子必在淫乱中败坏，并要用刀剑加害利未的子孙。


    5 然而，他们不能抵挡利未，因为他要为主争战，并要击败你们的全军[b]。


    6 他们人数将很少，被分散在利未支派和犹大支派之中；你们当中没有一人会居于领袖之位，正如我们的父亲在他的祝福中所预言的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”是犹太古代文献中邪恶势力或邪恶首领的名称；希腊文作 Βελίαρ，也可音译为“贝利亚尔”。
    reason: 该专名对普通中文读者不熟悉，且存在音译形式差异。
  - marker: b
    text: “全”所对应的希腊词在本校勘本中置于方括号内，表示其是否属于原文仍有不确定性。
    reason: 准确反映校勘标记所涉及的 πᾶσαν，而不把不确定性误归于“军队”。
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει, καὶ καλὸς τῇ ὄψει
  choice: 身材俊美，容貌秀丽
  rationale: 分别保留形体与外貌两个近义层面，同时采用自然、庄重的现代汉语。
- source_word: τῆς ταραχῆς τοῦ πνεύματος
  choice: 心灵的扰乱
  rationale: πνεῦμα 在此指人的内在精神或心灵状态；“扰乱”保留 ταραχή 的不安、动荡含义，不将其具体化为某一种情绪。
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: 使自己的心良善
  rationale: 紧贴使役动词 ἀγαθύνω，避免弱化为单纯“存善心”。
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: 使自己的道路正直
  rationale: 保留圣经式“道路”隐喻及 εὐθύνω 的端正含义。
- source_word: πορνεία
  choice: 淫乱
  rationale: 该词涵盖不正当性行为；“淫乱”在中文宗教与伦理语境中简洁且范围适当。
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: 在以诺的文书记载中
  rationale: 该短语字面和文本形态略显生硬；此译保留其指向以诺书面记录的意义，而不武断指定某部现存书卷。
- source_word: ἐν πορνείᾳ φθαρήσονται
  choice: 在淫乱中败坏
  rationale: 保留介词 ἐν 的语义开放性，不限定为“被淫乱败坏”或“因淫乱败坏”。
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: 为主争战
  rationale: 表达“打主的战争”这一闪语式结构的通常意义，同时避免拗口直译。
- source_word: παρεμβολὴν
  choice: 全军
  rationale: 在战争语境中指军营、阵营或军队；“全军”与动词“击败”搭配自然。
- source_word: τις εἰς ἡγεμονίαν
  choice: 没有一人会居于领袖之位
  rationale: 保留 εἰς ἡγεμονίαν 的目的或任职意味，不扩大为王权或特定政治制度。
theological_decisions:
- issue: 面容显露内在状态的断言
  choice: 人的面容会显露心灵的扰乱
  alternative: 面容显明灵里的动荡
  rationale: 不把“灵”专门解释为圣灵，也不将文本提升为绝对的相貌伦理学；按上下文译作人的内在心灵。
- issue: “使人与上帝隔绝”的主语关系
  choice: 淫乱……使人与上帝隔绝，又使人亲近彼列
  alternative: 淫乱……与上帝隔绝，并亲近彼列
  rationale: 希腊分词在语法上以“淫乱”为主语，但其实际承受者是陷入淫乱的人；补出“人”使中文清楚，同时不引入额外教义。
- issue: 利未争战的归属
  choice: 他要为主争战
  alternative: 他要争战主的战争
  rationale: κύριος 属格可表达归属或为其而战；中文采用自然表达，但不解释为主亲自作战或某种特定圣战理论。
- issue: 西缅后裔在利未和犹大中的分布
  choice: 分散在利未和犹大之中
  alternative: 在利未和犹大中被分配
  rationale: ἐπιμεριζόμενοι 可指被分配或散布；译文保留群体被分散到两支派中的基本图景，不推定具体历史应验。
- issue: 领袖预言的范围
  choice: 你们当中没有一人会居于领袖之位
  alternative: 你们中无人掌权
  rationale: 避免将 ἡγεμονία 特定化为君王、弥赛亚职分或永久政治禁令，仅表达本段对领导地位的预言。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“心、道路、蒙恩、争战”等与犹太—圣经语境相称的表达，但避免过度古雅。章节号与段落节号依所给单章文本呈现；所有脚注标记均置于正文相应位置。
