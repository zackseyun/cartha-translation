  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008.yaml
  text: 'And when Simeon had finished commanding his sons[a], he fell asleep with his fathers, being one hundred and twenty years old.


    And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly during a war of the Egyptians.


    For the Egyptians were keeping the bones of Joseph in the tombs of the kings, so as to bring him up. For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague for the Egyptians[c][b], so that even with a lamp each man would not recognize his brother.'
translation:
  language: zh_hans
  text: '8 西缅嘱咐完儿子们后，就与列祖同睡了，享年一百二十岁。


    2 他们把他安放在木棺里，为要把他的骸骨迁到希伯仑。后来，他们在埃及人的战乱期间暗中把这些骸骨运到那里。[a]


    3 原来，埃及人一直把约瑟的骸骨看守在君王的坟墓里。[b] 4 因为行法术的人曾对他们说，约瑟的骸骨一旦被带出去，全地就必有黑暗、幽暗和临到埃及人的大灾祸，[c]以致人人即使拿着灯，也认不出自己的弟兄。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在埃及人的战乱期间暗中”在希腊文中结构紧缩，也可理解为“在一场涉及埃及人的战争期间秘密地”，或“趁埃及人彼此交战时秘密地”。
    reason: alternative_reading
  - marker: b
    text: 第3节存在文本异读。有些抄本作“库房”，因而可译为：“埃及人一直把约瑟的骸骨看守在君王的库房里。”
    reason: textual_variant
  - marker: c
    text: 参看《创世记》50:25和《出埃及记》13:19，其中记载约瑟吩咐人把他的骸骨带上去，以及以色列人后来将其带走。
    reason: cross_reference
lexical_decisions:
- source_word: συνετέλεσεν ἐντελλόμενος
  choice: 嘱咐完
  rationale: 兼顾动作的完成和父亲临终训诫的权威语气；“嘱咐”比“命令”更符合现代汉语中的遗训场景。
- source_word: ἐκοιμήθη μετὰ τῶν πατέρων αὐτοῦ
  choice: 与列祖同睡了
  rationale: 保留死亡委婉语及圣经式固定表达，同时“列祖”自然传达祖先之意。
- source_word: θήκῃ ξυλίνῃ
  choice: 木棺
  rationale: 上下文明确为安放遗体或骸骨的木制容器，“木棺”简洁且符合丧葬语境。
- source_word: τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ
  choice: 为要把他的骸骨带回
  rationale: “带回”自然表达迁往祖先安葬地的方向和目的，不作超出文本的解释。
- source_word: ἐν πολέμῳ Αἰγυπτίων κρυφῇ
  choice: 趁埃及人交战时，暗中
  rationale: 保留战争背景和秘密行动两层意思；原文结构压缩，具体是埃及人与外敌交战还是埃及人彼此交战并不明确，故附注说明。
- source_word: ἐφύλαττον
  choice: 一直……看守
  rationale: 用“一直”体现未完成体所表达的持续状态，“看守”也保留其受监管、不得带走的意味。
- source_word: μνήμασι τῶν βασιλέων
  choice: 君王的坟墓里
  rationale: 按所给希腊文本的通常词义直译，同时在脚注保留“库房”的异文。
- source_word: ἐπαοιδοί
  choice: 行法术的人
  rationale: 指施行咒术或念咒者；这一译法比音译或现代幻想色彩浓厚的称呼更易懂，也不将其限定为另一类宗教职分。
- source_word: σκότος καὶ γνόφος
  choice: 黑暗、幽暗
  rationale: 保留两个近义词叠加产生的强调效果，并维持庄重节奏。
- source_word: πληγὴ μεγάλη
  choice: 大灾祸
  rationale: πληγή可指打击、灾害或灾殃；“大灾祸”保留判断语境，又不武断限定为疾病性瘟疫。
- source_word: ἐπιγινώσκειν ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: 人人……也认不出自己的弟兄
  rationale: 贴近原文个体化表达；“弟兄”保持古代亲属及同胞语感，不将范围收窄为现代汉语的亲弟弟。
theological_decisions:
- issue: 死亡套语 ἐκοιμήθη
  choice: 与列祖同睡了
  alternative: 死了；归到列祖那里
  rationale: 保留原文以睡眠委婉指死亡的文学表达，而不把该套语解释成关于死后状态的特定教义。
- issue: 约瑟骸骨被扣留与埃及灾祸之间的关系
  choice: 按术士所说的预告呈现，不评价其真实性或来源
  alternative: 将预告解释为神谕，或明确贬为迷信
  rationale: 原文只报告行法术者对埃及人的说法；译文不应增添神学认可，也不应替叙述者作否定判断。
- issue: πληγὴ μεγάλη 的灾难性质
  choice: 大灾祸
  alternative: 大瘟疫；沉重打击
  rationale: 此词义域较宽。采用不限定灾难具体类型的表达，以保留与出埃及灾祸传统的呼应及原文歧义。
- issue: 第3节文本困难
  choice: 正文采用“君王的坟墓”，并以脚注保留“君王的库房”异文
  alternative: 正文直接采用“君王的库房”
  rationale: 所给希腊正文 μνήμασι 通常指坟墓；异文会显著改变场景，应公开说明而非静默协调。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。保留“与列祖同睡”“骸骨”“弟兄”等具有经传色彩但仍易懂的表达；对压缩句法和抄本异文用脚注说明，不在正文中强行消除歧义。
