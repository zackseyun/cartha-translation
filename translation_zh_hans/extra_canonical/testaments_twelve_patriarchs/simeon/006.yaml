base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006.yaml
  text: '1 Behold, I have told you everything, so that I may be cleared from your sin. 2 But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.


    3 Then the seed of Canaan will perish, and no remnant will remain for Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed. 4 Then the land of Ham will fail, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.


    5 Then a great sign will be glorified for Israel, because the Lord God, appearing on the earth, will come and save Adam in him. 6 Then all the spirits of deceit will be given over to be trampled down, and men will rule over the evil spirits. 7 Then I also will arise in gladness, and I will bless the Most High for his wonders.'
translation:
  language: zh_hans
  text: '《西缅遗训》第6章


    1 看哪，我已经把一切都告诉你们，好使我不受你们罪的牵连。


    2 但你们若从自己里面除去嫉妒和一切刚硬的心，我的骨头就必在以色列中如玫瑰开花，我的肉身必在雅各中如百合花开放；我的香气必如黎巴嫩的香气。从我而出的圣洁之人必世世代代增多，他们的枝条必伸展到远方。


    3 那时，迦南的后裔必灭亡，亚玛力中必不留余民；所有卡帕多细亚人都必灭亡，所有赫人也必被彻底除灭。


    4 那时，含地必衰亡，所有民众都必灭亡。那时，全地必止息纷乱，普天之下必止息战争。


    5 那时，一个大兆头必在以色列中得荣耀。[a]


    6 那时，一切迷惑人的灵都必被交给人践踏，人必辖制那些邪灵。


    7 那时，我也必欢然起来，因至高者所行的奇事而称颂他。〔因为上帝取了身体，与人一同吃饭，拯救了人。〕[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所据希腊文本仅作：“那时，一个大兆头必在以色列中得荣耀。”原文中的“兆头”带有校勘疑号；其他文本传统可能有较长的读法。
    reason: 说明希腊词前的匕首号所表示的文本疑难，也解释为何未采用英文咨询层中没有希腊对应文的扩充句。
  - marker: b
    text: “因为上帝……拯救了人”在所据希腊版中置于方括号内，表明编者认为这句话的文本归属存疑。
    reason: 让读者看见该句确有希腊来源，同时保留其可能为后加文字的文本批判张力。
lexical_decisions:
- source_word: δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: 使我不受你们罪的牵连
  rationale: ἀπό与被动式δικαιόω在这里表达从他人的罪责中获澄清或免责；这样译比“因你们的罪被称义”更符合语境，同时避免加入特定教义含义。
- source_word: φθόνον
  choice: 嫉妒
  rationale: 延续本书围绕西缅嫉妒约瑟的主题，也符合该词常义。
- source_word: ἅγιοι ἐξ ἐμοῦ
  choice: 从我而出的圣洁之人
  rationale: 保留“从我而出”的血缘或群体来源意象，不擅自具体化为某一特定后裔群体。
- source_word: σπέρμα Χαναάν
  choice: 迦南的后裔
  rationale: σπέρμα在族群语境中指后裔；中文不直译为容易误解的“种子”。
- source_word: οἱ Καππαδόκαι
  choice: 卡帕多家人
  rationale: 按现存希腊文本的族名翻译，不擅自校改为别的民族。
- source_word: πνεύματα τῆς πλάνης
  choice: 迷惑人的灵
  rationale: πλάνη兼有迷误、欺骗和使人偏离之意；此译自然，并保留其主动迷惑人的意味。
- source_word: βασιλεύσουσιν τῶν πονηρῶν πνευμάτων
  choice: 辖制那些邪灵
  rationale: βασιλεύω接属格表示统治、掌权于其上；“辖制”符合中文语体。
- source_word: σῶμα λαβών
  choice: 取了身体
  rationale: 形式贴近原文，既不削弱身体性，也不额外规定道成肉身的系统神学表述。
theological_decisions:
- issue: 第1节的δικαιωθῶ是否应译作救恩论术语“称义”
  choice: 译作“不受你们罪的牵连”
  alternative: “得以从你们的罪中被称义”
  rationale: 上下文是西缅已尽告诫责任，重点在不承担听者之罪，并非明确论述因信称义。
- issue: 第2节“从我而出的圣洁之人”的身份
  choice: 保留泛指，不指认为某个宗派、民族或弥赛亚群体
  alternative: 译作“我的圣洁后裔”并加以教义性解释
  rationale: 原文只明说ἅγιοι ἐξ ἐμοῦ，具体所指存在张力，应予保留。
- issue: 第5节是否补入英文咨询文本中的显现和拯救亚当句
  choice: 不补入正文
  alternative: 加入“因为主上帝要显现在地上，并要来在他里面拯救亚当”
  rationale: 用户提供的希腊原文在第5节只有兆头得荣耀一句；缺乏对应希腊文时，不以英文层反向扩充原文。
- issue: 第7节方括号内基督论色彩浓厚的句子
  choice: 保留在正文并以方括号和脚注标示文本疑问
  alternative: 像英文咨询层一样省略
  rationale: 该句确实出现在所给希腊来源中，但编辑方括号表明其文本地位可疑；保留并标示最能兼顾源证与文本史不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。预言段落用“必”维持宣告语气；植物、香气和枝条等诗性意象尽量保留。族名采用通行或接近原音的译法，不根据后世地理或教义推测改写。
