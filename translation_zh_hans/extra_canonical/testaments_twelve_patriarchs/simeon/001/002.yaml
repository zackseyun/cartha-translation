  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/002.yaml
  text: 'And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up, kissed them[b], and said:'
translation:
  language: zh_hans
  text: 西缅患病时，他的儿子们前来探望他。他振作精神，坐起身来，亲吻他们[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “亲吻”所译的希腊语动词带有加强意味，可指一再亲吻或深情地亲吻。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρρωστοῦντος
  choice: 患病时
  rationale: 以自然的时间从句表达属格独立结构，保留西缅当时正在患病的背景。
- source_word: ἐπισκέψασθαι
  choice: 探望
  rationale: 在病中来访的语境里，“探望”准确而自然，也保留关怀之意。
- source_word: ἐνισχύσας
  choice: 振作精神
  rationale: 表达他聚集力量、勉力支撑自己的动作，不把含义局限为单纯的体力恢复。
- source_word: ἐκάθισε
  choice: 坐起身来
  rationale: 结合卧病语境，汉语用“坐起身来”比孤立的“坐下”更符合动作场景。
- source_word: κατεφίλησεν
  choice: 亲吻
  rationale: 正文采用自然简洁的“亲吻”，并由脚注说明该加强式动词可能含反复或深情亲吻之意。
