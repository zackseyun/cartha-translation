base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/001.yaml
  text: A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died.
translation:
  language: zh_hans
  text: '雅各和利亚的第二个儿子西缅的遗言


    1 西缅对自己众子所说的话的抄本[a]：这是他在去世以前、在他生命的第一百二十年、在他兄弟约瑟去世之时所说的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西缅所说之话的记录”。
    reason: Ἀντίγραφον主要可指“副本、抄本”，在此也可较宽泛地理解为书面记录。
lexical_decisions:
- source_word: Διαθήκη
  choice: 遗言
  rationale: 标题中的 διαθήκη 在本书语境中指临终嘱言；译作“遗言”自然庄重，也不额外引入制度化的“约”之含义。
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 基本义为抄写所得的副本；保留文本传抄意味，同时以脚注列出较宽泛的“记录”。
- source_word: λόγων
  choice: 言语
  rationale: 可涵盖所说的话或训言；“言语”既贴近复数形式，也符合遗言体裁。
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει τῆς ζωῆς αὐτοῦ
  choice: 在一生第一百二十年
  rationale: 按原文表达其生命年次，不擅自改写为可能暗示已满周岁的“享年一百二十岁”。
- source_word: ἐν ᾧ χρόνῳ
  choice: ……时
  rationale: 以自然汉语表达同一时间关系，不把它强化为因果或精确到同一天。
theological_decisions:
- issue: 标题中 διαθήκη 的体裁含义
  choice: 遗言
  alternative: 遗训；遗嘱
  rationale: 这里主要标示族长临终所说的话。“遗言”能保留临终训示的体裁，而“遗嘱”在现代汉语中容易被理解为法律财产文书。
- issue: 约瑟去世与西缅发言的时间关系
  choice: 他兄弟约瑟去世时
  alternative: 在他兄弟约瑟去世的那一年
  rationale: 原文只说“在……时候”，不明确限定为同日或仅同年，因此采用保持开放性的时间表述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。标题补出人物身份，依据所给希腊文标题；正文保留原文较长的时间状语结构，但按现代汉语语序调整。脚注标记已在正文中对应出现。
