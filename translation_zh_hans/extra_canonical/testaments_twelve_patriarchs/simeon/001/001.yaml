    1 西缅对自己众子所说的话的抄本[a]：这是他在去世以前、在他生命的第一百二十年、在他兄弟约瑟去世之时所说的。'
  rationale: 修订仅调整标题和正文语序，使现代标准汉语更自然、指代更清楚。保留“抄本”及其脚注替代译法；“在……之时”仍只表达宽泛的同时期关系，不暗示同日、因果或精确年份。
