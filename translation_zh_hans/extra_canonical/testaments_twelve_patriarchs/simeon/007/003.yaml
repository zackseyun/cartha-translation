base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/003.yaml
  text: Therefore I command these things to you, so that you also may command your children, that they may keep them for their generations.
translation:
  language: zh_hans
  text: 因此，我吩咐你们这些事，为要你们也吩咐自己的儿女，使他们世世代代遵守这些事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι / ἐντέλλεσθε
  choice: 吩咐
  rationale: 保留原文两次使用同一动词的呼应，也自然表达带有权威的命令或嘱咐。
- source_word: τοῖς τέκνοις ὑμῶν
  choice: 自己的儿女
  rationale: τέκνα在此指受话者的子女；“自己的”清楚传达ὑμῶν的所属关系，不加入原文没有的族群解释。
- source_word: φυλάξωσιν αὐτά
  choice: 遵守这些事
  rationale: φυλάσσω在命令语境中表示谨守、遵行；αὐτά回指前述事项，译为“这些事”较汉语中的“它们”自然。
- source_word: εἰς τὰς γενεὰς αὐτῶν
  choice: 世世代代
  rationale: 按语境表达这些吩咐延续至后代；中文惯用语简洁而自然，同时不限定具体代数。
theological_decisions:
- issue: τέκνα是否扩展为“以色列族”
  choice: 仅译为“自己的儿女”
  alternative: 自己的儿女〔以色列族〕
  rationale: 希腊文本只有“你们的儿女”，没有“以色列族”；不加入来源之外的身份解释。
- issue: εἰς τὰς γενεὰς αὐτῶν的时间范围
  choice: 世世代代
  alternative: 直到他们的各代／为他们的世代
  rationale: 原短语指向后续世代，但未明说“永远”；“世世代代”自然体现代际延续，又不额外建立永久有效的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“吩咐……吩咐”的词语复现，以呈现原文命令由父辈传给子女的结构；不设脚注，因为本节没有必须借脚注说明的文本异读或不可兼顾的歧义。
