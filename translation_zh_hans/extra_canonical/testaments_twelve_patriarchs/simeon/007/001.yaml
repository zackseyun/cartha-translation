base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/001.yaml
  text: And now, my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will rise for us.
translation:
  language: zh_hans
  text: 现在，我的孩子们，要听利未和犹大的话；不可自高于这两个支派之上，因为上帝的拯救必从他们中间为我们兴起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的”在所据希腊文校勘本中以角括号标出，表明这几个字是否属于原文的文本归属存在疑问。
    reason: 说明τοῦ Θεοῦ的编辑标记及其文本不确定性；正文仍按所提供的校勘文本译出。
lexical_decisions:
- source_word: ἐπακούσατε
  choice: 听从
  rationale: 此处不仅指听见，也含留心并顺从之意；“听从”符合对利未和犹大的劝诫语境。
- source_word: μὴ ἐπαίρεσθε ἐπὶ
  choice: 不要高抬自己，凌驾于……之上
  rationale: 保留动词“抬高”所表达的自高，以及介词结构所含高居他者之上的意味。
- source_word: γενεὰς
  choice: 支派
  rationale: 在以色列众子及其后裔的语境中，指由利未和犹大而出的群体；现代中文用“支派”最自然明确。
- source_word: ἀνατελεῖ
  choice: 兴起
  rationale: 该词可指升起、萌发或出现；“兴起”既保留其形象，也不预先限定“拯救”具体以何种方式显现。
- source_word: τὸ σωτήριον
  choice: 拯救
  rationale: 中性名词可指救恩、拯救或带来拯救者；采用“拯救”保留原文一定的开放性，避免径直人格化。
theological_decisions:
- issue: “上帝的拯救”是否明确指一位救主
  choice: 译作“上帝的拯救”
  alternative: 译作“上帝的救主”或“上帝所赐的救恩”
  rationale: τὸ σωτήριον 为中性形式，原文并未明确使用“救主”称号；直译为“拯救”可保留其可能指救恩事件、救赐或其具体体现的张力。
- issue: τοῦ Θεοῦ 的文本状态
  choice: 正文保留“上帝的”，并加脚注说明
  alternative: 正文删去该短语
  rationale: 所给校勘文本以角括号标示该短语，显示其文本传承可能存在疑问；正文依所提供的编辑文本译出，同时透明注明。
- issue: 救恩从利未和犹大两支派而出的关系
  choice: 保留复数“他们中间”，不解释各支派分别承担何种角色
  alternative: 将利未解释为祭司职分、犹大解释为君王或弥赛亚职分
  rationale: 原句只说明拯救从这两个支派而出，并未在此句划分具体角色，不宜加入宗派性或解释性内容。
translation_notes:
  register: 采用现代、庄重而清楚的劝诫语体。“我的孩子们”保留遗训体的亲密称呼；“听从”“高抬自己”“凌驾于……之上”使伦理劝告自然有力；“必从他们中间为我们兴起”保留希腊文的未来指向和升起意象。
