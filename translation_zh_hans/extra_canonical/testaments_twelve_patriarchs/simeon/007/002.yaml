base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/002.yaml
  text: For the Lord will raise up from Levi a high priest, and from Judah a king, [God and man]; he will save [all the nations and] the race of Israel.
translation:
  language: zh_hans
  text: 因为主将从利未兴起一位大祭司，从犹大兴起一位君王，[是上帝，也是人]；他将拯救[万国和]以色列族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστήσει
  choice: 兴起
  rationale: 表达主使所应许的人物出现并承担职分，符合此处使役性的未来时语义。
- source_word: ἐκ τοῦ Λευὶ / ἐκ τοῦ Ἰούδα
  choice: 从利未 / 从犹大
  rationale: 保留希腊文的来源表达；在族谱语境中自然指从相应支派而出。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 这是该宗教职分在现代汉语中的标准译名。
- source_word: βασιλέα
  choice: 君王
  rationale: 兼顾王权尊严与现代可懂度。
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: 以色列族
  rationale: γένος 可指族类、民族或后裔；“以色列族”简洁保留其群体与血缘意味。
theological_decisions:
- issue: Θεὸν καὶ ἄνθρωπον 的文本与基督论含义
  choice: '[是上帝，也是人]'
  alternative: '[上帝和人]'
  rationale: 方括号保留版本证据所显示的文本不确定性；补出系词使现代汉语通顺，但不进一步解释两种身份如何结合。
- issue: πάντα τὰ ἔθνη καὶ 的文本不确定性
  choice: '[万国和]'
  alternative: 省略该短语，仅译“以色列族”
  rationale: 依源文方括号标示其存疑状态，不把普世性对象静默并入无争议正文。
- issue: ὡς 在职分短语中的处理
  choice: 不逐字译出，译为“一位大祭司……一位君王”
  alternative: “作为大祭司……作为君王”或“如同大祭司……如同君王”
  rationale: 此处 ὡς 可标示身份或职分；直译“如同”容易误成仅仅相似。正文采用自然汉语，同时不扩展为更强的教义断言。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留源文的两处方括号，以直接呈现文本传统中的不确定内容；无脚注标记需要加入。
