  text: III. Καὶ νῦν, τέκνα¹ μου² Γἀκούσατέ μου καὶ¹³ φυλάξασθε⁴ ἀπὸ *τοῦ πνεύματος⁵ τῆς πλάνης καὶ τοῦ φθόνου. 2. Καὶ γὰρ ὁ φθόνος κυριεύει *πάσης τῆς διανοίας τοῦ ἀνθρώπου⁶ καὶ οὐκ ἀφίησιν⁷ αὐτὸν Γοὔτε φαγεῖν, οὔτε πιεῖν, οὔτε¹ ποιῆσαί τι⁸ ἀγαθόν. 3. Ἀλλὰ⁹ *πάντοτε ὑποβάλλει¹⁰ ἀνελεῖν¹¹ τὸν φθονούμενον· *καὶ ὁ μὲν φθονούμενος πάντοτε ἀνθεῖ, ὁ δὲ φθονῶν μαραίνεται¹². 4. Δύο Γοὖν¹¹³ ἔτη¹⁴ *ἐν φόβῳ κυρίου¹⁵ ἐκάκωσα *τὴν ψυχήν μου ἐν νηστείᾳ¹⁶, καὶ ἔγνων ὅτι ἡ¹⁷ λύσις τοῦ φθόνου διὰ φόβου¹⁸ θεοῦ¹⁹ γίνεται²⁰. 5. Ἐὰν γάρ²¹ τις ἐπὶ Κύριον καταφύγῃ, *ἀποτρέχει τὸ πονηρὸν πνεῦμα ἀπʼ αὐτοῦ²², καὶ γίνεται ἡ διάνοια²³ κούφη. 6. Καὶ λοιπὸν συμπαθεῖ²⁴ τῷ φθονουμένῳ²⁵, καὶ²⁶ συγγινώσκει²⁷ *τοῖς ἀγαπῶσιν²⁸ αὐτόν²⁹, καὶ οὕτως³⁰ παύεται τοῦ φθόνου.
