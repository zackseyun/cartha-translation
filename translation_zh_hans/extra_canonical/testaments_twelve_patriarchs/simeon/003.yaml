  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003.yaml
  text: And now[a], my children, hear me, and guard yourselves from the spirit of deceit and envy. For envy masters a man's whole mind, and does not allow him either to eat or to drink or to do anything good. But it is always urging him to kill the one envied; and while the one envied is always flourishing, the one who envies wastes away[b]. For two years, then, in the fear of the Lord I afflicted my soul with fasting, and I learned that release from envy comes through the fear of God. For if anyone flees for refuge to the Lord, the evil spirit runs away from him, and his mind becomes light. And from then on he has compassion on the one envied, and forgives those who love him[c], and so he ceases from envy.
translation:
  language: zh_hans
  text: 3:1 “现在，孩子们，你们要听我说，也要提防迷惑[a]和嫉妒的灵。2 嫉妒辖制人的全部心思，使人既不能吃，也不能喝，也不能做任何善事。3 它总是怂恿人杀死受嫉妒的人；受嫉妒的人不断兴旺，心怀嫉妒的人却日渐枯萎[b]。4 因此，我有两年之久怀着对主的敬畏，借着禁食苦待我的心灵；我也明白了，人借着敬畏上帝，就能从嫉妒中得到释放。5 因为，人若投奔主寻求庇护，邪灵就会从他身边逃走，他的心思也会变得轻省。6 从此，他会怜悯那受嫉妒的人，也会宽宥那些爱他的人[c]；这样，他就不再嫉妒了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迷惑”也可译作“谬误”或“欺骗”。希腊词πλάνη既可指受欺骗，也可指迷失而陷入错误。
    reason: lexical_alternative
  - marker: b
    text: 直译为“受嫉妒的……嫉妒的”。希腊文用两个相对的分词，突出受嫉妒者与嫉妒者之间的对照。
    reason: lexical_alternative
  - marker: c
    text: “爱他的人”中的“他”，既可能指先前受嫉妒的人，也可能指正在从嫉妒中得医治的人；希腊文的代词简短，所指在上下文中并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: φυλάξασθε
  choice: 要提防
  rationale: 该中间语态命令带有自我防护的意味；“要提防”在现代汉语中自然地表达警醒、防备。
- source_word: πνεῦμα τῆς πλάνης
  choice: 迷惑的灵
  rationale: πλάνη兼有受骗、迷失和陷入谬误之意；“迷惑”既可指欺骗，也可指使人偏离正道，并保留其与“灵”结合时的道德及属灵张力。
- source_word: φθόνος
  choice: 嫉妒
  rationale: 此词指因他人的好处而产生的敌意和怨恨；全章统一译作“嫉妒”。
- source_word: κυριεύει πάσης τῆς διανοίας τοῦ ἀνθρώπου
  choice: 辖制人的全部心思
  rationale: “辖制”保留κυριεύει的支配、作主意味；“全部心思”涵盖διάνοια所指的思想与意向。
- source_word: ὑποβάλλει
  choice: 怂恿
  rationale: 此处指不断从内在煽动、唆使；“怂恿”保留其引人作恶的力度。
- source_word: ἀνελεῖν
  choice: 杀死
  rationale: 该动词在此语境中的暴力意味鲜明，不以较弱的“除掉”淡化。
- source_word: ἀνθεῖ / μαραίνεται
  choice: 兴旺 / 枯萎
  rationale: 两个动词构成开花与凋萎的鲜明对照；译文以“兴旺／枯萎”兼顾比喻和可读性。
- source_word: ἐκάκωσα τὴν ψυχήν μου ἐν νηστείᾳ
  choice: 借禁食苦待自己的心灵
  rationale: 保留原文“苦待心灵”的严肃禁欲性表达，同时用“借”清楚呈现禁食是其手段。
- source_word: λύσις τοῦ φθόνου
  choice: 从嫉妒中得到释放
  rationale: λύσις有解开、释放之意；此译保留嫉妒如束缚人的力量这一意象。
- source_word: ἐπὶ Κύριον καταφύγῃ
  choice: 投奔主寻求庇护
  rationale: καταφεύγω含逃往某处避难之意；译文明确表达以主为避难所。
- source_word: γίνεται ἡ διάνοια κούφη
  choice: 心思也会变得轻省
  rationale: κούφη直指轻、不再沉重；“轻省”自然表达心思卸下重负后的状态。
- source_word: συγγινώσκει
  choice: 原谅
  rationale: 该词可指体谅、宽宥或原谅；在停止嫉妒后的关系语境中，“原谅”清楚自然，同时不改写其宾语。
theological_decisions:
- issue: Κύριος与θεός在犹太劝诫文献中的称谓
  choice: 主／上帝
  alternative: 耶和华／上帝
  rationale: 希腊文相继使用Κύριος和θεός，但此处并非直接转述含有神名的希伯来经文；分别译作“主”和“上帝”，既保持词语差异，也不擅自引入神名。
- issue: τὸ πονηρὸν πνεῦμα所表达的邪恶主体性
  choice: 那邪灵
  alternative: 一种邪灵／邪恶的冲动
  rationale: 定冠词支持特指表达，而本段将恶习描绘为具有属灵作用的力量；译作“那邪灵”保留这种张力，不把它直接化约为心理冲动。
- issue: 敬畏上帝与脱离嫉妒的关系
  choice: 借着敬畏上帝才从嫉妒中得到释放
  alternative: 因敬畏上帝而摆脱嫉妒
  rationale: 保留διὰ的途径或媒介意味，不进一步建立原文未说明的系统性因果教义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体，以“孩子们，你们要听我说”保留父辈训诲的口吻。核心恶习统一译为“嫉妒”；对“灵”“敬畏”“释放”等词不作心理化或宗派化解释。经节编号按3:1—6呈现，所有脚注标记均置于相关主文词句之后。
