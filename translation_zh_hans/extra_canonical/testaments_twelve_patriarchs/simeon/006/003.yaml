  text: Then the seed of Canaan will perish, and no remnant will remain in Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed.
translation:
  language: zh_hans
  text: 那时，迦南的后裔必灭亡；在亚玛力中必不存留余民。所有卡帕多细亚人都必灭亡，所有赫人也必被彻底除灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα Χαναάν
  choice: 迦南的后裔
  rationale: σπέρμα字面为“种子”，用于族群延续时自然指“后裔”；此译既符合上下文，也避免现代汉语中“迦南的种子”的生硬表达。
- source_word: ἐγκατάλειμμα
  choice: 余民
  rationale: 指灾灭之后留下的人；“余民”简洁、庄重，并准确传达残存群体之意。
- source_word: ἐν τῷ Ἀμαλήκ
  choice: 亚玛力中
  rationale: 保留介词ἐν的范围含义，不改译为“为亚玛力”或擅自明确为个人、地域或民族。
- source_word: οἱ Καππαδόκαι
  choice: 卡帕多家人
  rationale: 按希腊文族群称谓翻译，指卡帕多家地区或族群的人。
- source_word: οἱ Χετταῖοι
  choice: 赫人
  rationale: 采用中文圣经传统中通行且易懂的族名。
- source_word: ἐξολοθρευθήσονται
  choice: 必被彻底除灭
  rationale: 该复合动词语气强于普通的ἀπόλλυμι；用“彻底除灭”保留其加强意味和被动形式。
theological_decisions:
- issue: 毁灭宣告的确定语气
  choice: 用“必”表达各将来时动词
  alternative: 译作较弱的“将会”
  rationale: 希腊文将来时在此构成先知式宣告，语气明确；“必”能自然传达其确定性，而不额外加入神学解释。
- issue: “亚玛力”的所指
  choice: 保留专名及“中”的宽泛结构
  alternative: 明确译为“亚玛力人中”或“亚玛力地”
  rationale: 原文没有明说此处专名指族群还是地域，因此保留其真实歧义。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。以分号和句号呈现原句的并列层次；对ἀπολεῖται/ἀπολοῦνται统一译为“灭亡”，并用“彻底除灭”体现末一动词的加强语气。无脚注标记。
