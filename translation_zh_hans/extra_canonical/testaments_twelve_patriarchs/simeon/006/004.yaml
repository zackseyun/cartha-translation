base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/004.yaml
  text: Then the land of Ham will perish, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.
translation:
  language: zh_hans
  text: 那时，含的土地必消逝，各民族都必灭亡。那时，全地将止息动乱，普天之下也将止息战争。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείψει
  choice: 必衰亡
  rationale: 此词基本义为“衰竭、消逝、终止”。上下文带有毁灭和审判意味，但与下句更明确的 ἀπολεῖται 有所区别，因此译作“衰亡”，既体现结局，也保留词义差异。
- source_word: ἡ γῆ Χάμ
  choice: 含地
  rationale: 按属格关系直译为“含之地”，以现代汉语凝练表达为“含地”，指与含相关的地域。
- source_word: πᾶς ὁ λαός
  choice: 所有百姓
  rationale: λαός 单数可作集合名词，表示全体民众；译作“所有百姓”而非“各民族”，避免把原文单数过度具体化。
- source_word: καταπαύσει ... ἀπὸ ταραχῆς
  choice: 必不再动乱
  rationale: 原结构意为“停止、脱离动乱”；汉语用“不再动乱”自然表达止息之意。
- source_word: πᾶσα ἡ ὑπ᾿ οὐρανῶν
  choice: 普天之下
  rationale: 原文有省略，字面为“所有在诸天之下的”；“普天之下”保留其普遍范围，并符合庄重自然的汉语表达。
theological_decisions:
- issue: 含地与所有百姓所受结局的措辞
  choice: 分别译为“衰亡”和“灭亡”
  alternative: 两处均译为“灭亡”
  rationale: 原文分别使用 ἐκλείψει 与 ἀπολεῖται。虽都处于审判语境，仍保留两词之间的语义层次，不把二者完全同化。
- issue: 末句省略谓语的处理
  choice: 补出“也不再有战争”
  alternative: 译作“普天之下也必止息战争”
  rationale: 希腊文承接前句谓语，汉语需适度补足才能自然清楚；补译不改变原文所陈述的普遍和平。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语；保留两组平行句式和末世性宣告的节奏。
