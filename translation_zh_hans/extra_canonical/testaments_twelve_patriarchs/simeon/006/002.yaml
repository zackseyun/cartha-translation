source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν δὲ⁴ ἀφέλητε⁵ ἀφ᾽ ὑμῶν τὸν φθόνον καὶ πᾶσαν σκληροκαρδίαν⁶, Ὡς⁷ ῥόδον ἀνθήσει⁸ τὰ ὀστᾶ μου⁹ ἐν Ἰσραήλ, καὶ¹⁰ ὡς κρίνον *ἡ σάρξ μου¹⁰ ἐν Ἰακώβ, καὶ ἔσται¹¹ *ἡ ὀσμή μου ὡς¹² ὀσμὴ Λιβάνου,¹³ καὶ πληθυνθήσονται¹⁴ ἅγιοι¹⁵ *ἐξ ἐμοῦ¹⁶ *ἕως αἰῶνας¹⁷ αἰώνων¹⁷ καὶ *οἱ κλάδοι¹⁸ αὐτῶν¹⁹ εἰς μακρὰν ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/002.yaml
  text: But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.
translation:
  language: zh_hans
  text: 但你们若从自己身上除去嫉妒和一切心硬，我的骨头就必在以色列中如玫瑰般开花，我的肉身也必在雅各中如百合般开放；我的香气必如黎巴嫩的馨香。圣洁的人必从我而出，直到永永远远不断增多；他们的枝条也必伸展到远方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: 嫉妒
  rationale: 准确表达因他人所得而产生的妒忌，且与本书上下文的伦理劝诫相称。
- source_word: πᾶσαν σκληροκαρδίαν
  choice: 一切刚硬的心
  rationale: 保留“心硬”的身体隐喻和道德意味，同时用现代汉语可自然理解的表达。
- source_word: τὰ ὀστᾶ μου
  choice: 我的骨头
  rationale: 按原文直译，保留骨头开花这一鲜明而不寻常的诗性意象，不改释为“后裔”或“遗骸”。
- source_word: ῥόδον
  choice: 玫瑰
  rationale: 采用通常对应词；古代植物所指未必与现代分类完全相同，但正文无需过度限定。
- source_word: ἡ σάρξ μου
  choice: 我的肉身
  rationale: 比“我的肉”更庄重自然，并保留与“骨头”并列的身体意象。
- source_word: κρίνον
  choice: 百合
  rationale: 采用传统且易懂的植物名称，适合诗性比喻。
- source_word: ἡ ὀσμή μου
  choice: 我的香气
  rationale: 上下文以花与黎巴嫩馨香为喻，故明确译出正面的芳香含义。
- source_word: ἅγιοι
  choice: 圣洁的人
  rationale: 保留复数名词的开放含义，不擅自限定为“圣徒”、祭司或某一特定群体。
- source_word: ἕως αἰῶνας αἰώνων
  choice: 世世代代
  rationale: 以自然庄重的汉语表达持续无尽的时间观念；与后面的“不断增多”连用更顺畅。
- source_word: οἱ κλάδοι αὐτῶν
  choice: 他们的枝条
  rationale: 保留树木及后裔延展的隐喻，不直接解释为“子孙”。
- source_word: εἰς μακρὰν ἔσονται
  choice: 必伸展到远方
  rationale: 原文较简略，结合“枝条”补出汉语所需的动态谓语，同时保留空间延伸的意象。
theological_decisions:
- issue: “圣洁的人”与西缅的关系
  choice: 译作“圣洁的人必从我而出”
  alternative: “我的圣洁后裔必增多”
  rationale: 原文ἐξ ἐμοῦ只表明来源，没有明说生物学后裔；正文保留其可能指后代或更广泛群体的张力。
- issue: 应许的持续时间
  choice: 译作“世世代代不断增多”
  alternative: “直到永永远远都必增多”
  rationale: 原文是强烈的永续表达；所选译法自然且庄重，但不进一步建立关于个体永存或末世状态的教义结论。
- issue: 骨头、肉身和枝条意象的解释
  choice: 保留原有身体与植物意象
  alternative: 解释性译为“我的后裔将在以色列和雅各中兴盛”
  rationale: 原文的诗性和可能的复兴、纪念或后裔含义均不宜在翻译中被单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。句式保留原文连续的诗性排比，并以“开花、开放、馨香、枝条伸展”呈现意象链。未设置脚注，因此正文无脚注标记。
