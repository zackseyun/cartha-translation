  to: 但你们若从自己身上除去嫉妒和一切心硬，我的骨头就必在以色列中如玫瑰般开花，我的肉身也必在雅各中如百合般开放；我的香气必如黎巴嫩的馨香。圣洁的人必从我而出，直到永永远远不断增多；他们的枝条也必伸展到远方。
