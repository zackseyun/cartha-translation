revisions:
- from: 那时，一切迷惑人的灵都必被交付践踏，人也必统治邪灵。
  to: 那时，一切迷惑之灵都必被交付，遭到践踏；人也必统治邪灵。
  rationale: 修订仅处理汉语句法清晰度和属格短语的对应。用“被交付，遭到践踏”表达原文“交付归于践踏”的结果，不增添上帝、人或其他践踏者；后半句保留人对邪灵的统治。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:25:28Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以将来时被动式 δοθήσεται 和 εἰς καταπάτησιν 表达“被交付而归于践踏／遭践踏”的结局，未明说交付者或践踏者。原译的总体意思正确，也正确保留了人对邪灵的统治；但“被交付践踏”在现代汉语中句法关系不够清晰，易被读作两个并列动作。
  naturalness: “被交付践踏”不够自然。改为“被交付，遭到践踏”使被动的交付和随之而来的践踏清楚可读，同时不指定施事者。
  terminology: “迷惑人的灵”可理解，但“迷惑之灵”更贴近 τὰ πνεύματα τῆς πλάνης 的属格结构，并保留其可指“带来迷惑的灵”或“与迷惑相关的灵”的概括性。“邪灵”恰当对应 πονηρὰ πνεύματα；“统治”可接受地表达 βασιλεύσουσιν 的掌权含义。
  issues:
  - severity: medium
    issue: “被交付践踏”句法含混且不够自然。
    rationale: 汉语中“交付”通常需要明确受事或后续结构；紧接“践踏”容易使读者难以辨明是“交付给某人践踏”还是“被交付并被践踏”。原文没有明说践踏者，不宜补成“交付给人践踏”。
  - severity: low
    issue: “迷惑人的灵”较原文略多一层施事性表述。
    rationale: πνεύματα τῆς πλάνης 直陈“迷惑之灵／谬误之灵”。“迷惑之灵”既自然，也较好保留属格短语的概括性。
  revised_text: 那时，一切迷惑之灵都必被交付，遭到践踏；人也必统治邪灵。
