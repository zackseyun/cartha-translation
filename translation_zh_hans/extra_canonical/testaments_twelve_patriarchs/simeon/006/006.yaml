base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/006.yaml
  text: Then all the spirits of deceit will be given over to trampling, and men will rule over the evil spirits.
translation:
  language: zh_hans
  text: 那时，一切迷惑之灵都必被交付，遭到践踏；人也必统治邪灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 自然表达时间推进，并保留末世性语境中并未进一步限定的时间指向。
- source_word: πάντα τὰ πνεύματα τῆς πλάνης
  choice: 一切迷惑人的灵
  rationale: πλάνη可指迷惑、欺骗或谬误；译作“迷惑人的”在现代汉语中自然，也保留这些灵使人偏离正道的含义。
- source_word: δοθήσεται ... εἰς καταπάτησιν
  choice: 都必被交付践踏
  rationale: 保留被动式及“交付……践踏”的结构，贴近原文；不擅自补明交付者或践踏者。
- source_word: οἱ ἄνθρωποι
  choice: 人
  rationale: 作为集合性泛指，比“男人”或“众人”更准确自然，不额外限定性别或范围。
- source_word: βασιλεύσουσιν τῶν πονηρῶν πνευμάτων
  choice: 必统治邪灵
  rationale: βασιλεύω带有作王、掌权之意；“统治”自然传达其支配关系，而不把人明确称为王。
- source_word: πονηρῶν πνευμάτων
  choice: 邪灵
  rationale: 简洁、通行地表达“邪恶的灵”，适合宗教文献语域。
theological_decisions:
- issue: 谁交付迷惑人的灵、谁践踏它们
  choice: 不补明施事者
  alternative: 译为“上帝必把……交给人践踏”
  rationale: 希腊文使用神学被动且没有明说施事者；补入“上帝”或“人”会消除原文保留的含混。
- issue: 人对邪灵的权柄性质
  choice: 译为“统治”
  alternative: 译为“作王管辖”或“胜过”
  rationale: “统治”保留βασιλεύω的掌权含义，又避免把经文发展成更具体的王权教义；“胜过”则会削弱原词。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被交付践踏”略带书面色彩，以保留原文被动结构和εἰς καταπάτησιν的力度；全句不加入原文未明说的施事者。
