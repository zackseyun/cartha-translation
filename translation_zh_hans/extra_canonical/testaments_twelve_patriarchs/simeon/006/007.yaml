base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/007.yaml
  text: Then I also will arise in gladness, and I will bless the Most High for his wonders [because God, having taken a body and eaten with men, saved men].
translation:
  language: zh_hans
  text: 那时，我也要欢喜地起来，并要因至高者所行的奇事[a]称颂他，[因为上帝取了身体，与人一同吃饭，拯救了人类。][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奇事”也可译作“奇妙作为”。
    reason: 说明θαυμάσια兼有令人惊奇之事与奇妙作为的语义范围。
  - marker: b
    text: 本句在所据希腊文本中置于方括号内，表示其文本传承存在疑问。
    reason: 向读者说明原文编辑符号所反映的文本不确定性。
lexical_decisions:
- source_word: ἀναστησόμαι
  choice: 复起
  rationale: 保留“起来、复起”的基本语义及其可能带有复活意味的含混性，不直接释为“复活”。
- source_word: ἐν εὐφροσύνῃ
  choice: 欢喜地
  rationale: 以自然现代汉语表达“在喜乐中”，同时保留喜庆、欣悦的语气。
- source_word: εὐλογήσω
  choice: 称颂
  rationale: 在以至高者为宾语时，“称颂”比直译“祝福”更符合现代汉语宗教语境。
- source_word: τὸν ὕψιστον
  choice: 至高者
  rationale: 保留原文作为上帝称号的名词化表达。
- source_word: ἐπὶ τοῖς θαυμασίοις αὐτοῦ
  choice: 因至高者所行的奇事
  rationale: ἐπί在此自然表达称颂的缘由；补出“所行”使汉语通顺，但不添加原文之外的具体内容。
- source_word: σῶμα λαβών
  choice: 取了身体
  rationale: 贴近“取得/接受一个身体”的措辞，不进一步解释为特定教义术语。
- source_word: συνεσθίων ἀνθρώποις
  choice: 与人一同吃饭
  rationale: 准确表达共同进食，采用普通读者易懂的现代说法。
- source_word: ἔσωσεν ἀνθρώπους
  choice: 拯救了人类
  rationale: 前一个ἀνθρώποις译作“人”，此处用“人类”避免汉语重复，并传达泛指众人的意义。
theological_decisions:
- issue: ἀναστησόμαι是否明确译为末世复活
  choice: 复起
  alternative: 复活
  rationale: 原词可指起身或复起，在该语境中可能暗示复活；译文保留这种张力，不把暗示提升为明说。
- issue: 括号内关于上帝取身体的语句之文本状态
  choice: 收入正文并以方括号标示
  alternative: 不加标记收入正文，或移入脚注
  rationale: 所给希腊文本本身以方括号标示该分句，译文应保留其文本批判上的不确定性。
- issue: σῶμα λαβών的基督论解释
  choice: 上帝取了身体
  alternative: 上帝道成肉身
  rationale: 采用原文直接措辞，不以“道成肉身”等更具解释性的神学术语替代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“复起”刻意保留可能指起身或复活的歧义；方括号照应底本的文本批判标记。所有脚注标记均已置于正文。
