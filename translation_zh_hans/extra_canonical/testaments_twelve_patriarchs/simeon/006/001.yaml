  text: Behold, I have told you everything, so that I may be justified from your sin.
translation:
  language: zh_hans
  text: 看哪，我已经把一切都告诉你们，好使我能因你们的罪而洗清责任。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因你们的罪而洗清责任”直译可作“从你们的罪得以称义／被证明为义”。这里表示说话者既已告诫听者，便可免受他们犯罪的牵连或责任；原文的司法性措辞仍可有“得以称义”之意。
    reason: 说明 δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν 的不寻常搭配，并保留其司法语义与责任关系，而不把其解释限定为某一神学体系。
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留提示听者注意的庄重语气，也符合遗训体裁。
- source_word: εἴρηκα ὑμῖν πάντα
  choice: 我已经把一切都告诉你们
  rationale: 以“已经”体现完成时的既成结果；“一切”自然对应 πάντα。
- source_word: δικαιωθῶ
  choice: 被判为无罪
  rationale: 该被动虚拟式在此表示获得正当裁断或洗清罪责；“被判为无罪”比生硬的“被称义”更贴合现代汉语，同时保留司法性的被动含义。
- source_word: ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: 从你们的罪中
  rationale: 保留 ἀπό 所表达的脱离或免受牵连之意，不把“你们的罪”改释为说话者自己的罪。
theological_decisions:
- issue: δικαιωθῶ ἀπό 的具体关系
  choice: 译作“从你们的罪中被判为无罪”
  alternative: “不因你们的罪而被定罪”或“在你们的罪上被证明为义”
  rationale: 原文既可突出司法上的宣告为义，也可突出从他人罪责中得到洗清。正文保留“从……中”这一不寻常关系，并用脚注说明可能含义，避免断然解释说话者为何与听者的罪相关。
translation_notes:
  register: 采用现代、庄重而易懂的遗训语体。“看哪”保留原文郑重提示；其余句式力求自然简洁。
