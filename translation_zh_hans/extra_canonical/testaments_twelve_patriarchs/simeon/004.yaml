  text: 1[a]. Now my father kept asking about me, because he had seen me gloomy, and I told him, “My liver is swollen.” 2. For I was grieving more than all the others, because I was responsible for the sale of Joseph. 3. And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not distressed. 4. But Joseph was a good man[b], and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers. 5. Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you favor and glory and blessing upon your heads, just as you saw in Joseph. 6. All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us riches and livestock and produce. 7. And you also, my children, let each one love his brother with a good heart, and the spirit of
    envy will depart from you. 8. For this makes the soul savage, and destroys the body; it brings anger and war to one’s designs, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling. 9. For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body start up in fear, and wakes the mind in turmoil; and like an evil and venomous spirit[c][d], so he appears to people.
translation:
  language: zh_hans
  text: '《西缅遗训》第4章


    1 我的父亲常常问起我的情形，因为他见我面带愁容。我对他说：“我的肝肿了。”[a] 2 原来，我比众人都更加悲伤，因为卖掉约瑟这件事是我造成的。3 后来我们下到埃及，约瑟把我当作探子捆绑起来；那时我知道自己受苦是理所应当的，所以并不难过。


    4 但约瑟是个良善的人；神的灵在他里面，他满有怜悯和慈悲。他没有对我怀恨，反而连同我的兄弟们一同爱我们。5 所以，我的孩子们，你们要谨防一切嫉妒和妒忌[d]，存纯一的心[b]行事，好让神也把恩惠、荣耀和福分赐在你们头上，正如你们在约瑟身上所看见的。6 他一生从未因这件事责备我们，反而爱我们如同爱自己的灵魂；他尊荣我们，胜过尊荣自己的儿子，又把财物、牲畜和出产赐给我们。


    7 我的孩子们，你们也要各自以良善的心爱自己的弟兄，这样，妒忌的灵就会离开你们。8 因为妒忌使人的灵魂变得凶残，毁坏人的身体；它使人的谋算充满愤怒和争斗，激起流血之事，使心智陷入狂乱，又使灵魂动荡、身体战栗。9 即使人在睡梦中，妒忌也会使恶事的幻象浮现在他眼前，吞噬他，并用邪灵搅扰他的灵魂，使他的身体惊恐而起，使他的心智在纷乱中醒来；在人们眼中，便显得如同邪恶而有毒的灵。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的肝肿了”保留了古代以身体器官表达内在痛苦或忧伤的说法；西缅是在用身体不适解释自己愁苦的神色。
    reason: 文化说明
  - marker: b
    text: “纯一的心”也可译作“专一的心”“真诚的心”或“无诡诈的心”。
    reason: 词义替代
  - marker: c
    text: 末句既可理解为妒忌的人在人看来像邪恶而有毒的灵，也可理解为妒忌本身显得如此；原文的指向并不完全明确。
    reason: 歧义说明
  - marker: d
    text: “嫉妒和妒忌”对应两个意义相近的希腊词ζῆλος和φθόνος；在这里二者都取负面含义。
    reason: 词义说明
lexical_decisions:
- source_word: σκυθρωπός
  choice: 面带愁容
  rationale: 表达可被父亲观察到的外在忧郁神色，现代中文自然且庄重。
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: 我的肝肿了
  rationale: 保留古代以肝脏状况表达内在痛苦的具体身体惯用语，并以脚注解释。
- source_word: τῆς πράσεως Ἰωσήφ
  choice: 卖掉约瑟这件事
  rationale: πρᾶσις具体指买卖；这里保留约瑟被卖这一罪行，不泛化为“背叛”。
- source_word: δικαίως πάσχω
  choice: 自己受苦是理所应当的
  rationale: 保留δικαίως的道德与公正含义，同时符合现代汉语表达。
- source_word: ἀγαθὸς ἀνήρ
  choice: 良善的人
  rationale: 直接表达约瑟的道德品格，不额外加入贵族性或英雄性色彩。
- source_word: πνεῦμα θεοῦ ἐν αὐτῷ
  choice: 神的灵在他里面
  rationale: 紧贴希腊语的内在临在措辞；中文不借大小写预先排除“神的灵／神所赐的灵”等理解。
- source_word: ἐμνησικάκησέν
  choice: 怀恨
  rationale: 准确表达记住恶事、蓄意怨恨的惯用含义。
- source_word: ἁπλότης καρδίας
  choice: 纯一的心
  rationale: 兼顾内心不分裂、无诡诈和真诚的伦理内涵，并用脚注列出可接受的替代表达。
- source_word: ζῆλος καὶ φθόνος
  choice: 嫉妒和妒忌
  rationale: 两个近义负面词并列，保留原文刻意的重复与恶德清单结构。
- source_word: ψυχή
  choice: 灵魂
  rationale: 本章将ψυχή与身体、心智和灵并列；译作“灵魂”可保留其古代人观的概念层次。
- source_word: διάνοια / νοῦς
  choice: 心智
  rationale: 两词在此均涉及思想和意识活动；“心智”比单纯的“心”更能保留心理层面。
- source_word: ἰοβόλον
  choice: 有毒的
  rationale: 保留其带毒、施毒的形象，而不将其弱化为一般的“有害”。
theological_decisions:
- issue: 约瑟里面的πνεῦμα θεοῦ
  choice: 神的灵在他里面
  alternative: 有从神而来的灵在他里面／神所赐的灵在他里面
  rationale: 原文最自然地指向神之灵的临在或赋能，但希腊语本身没有英语大小写所造成的限定；中文直译既保留神学力度，也不人为消除语法上的空间。
- issue: ψυχή的人论含义
  choice: 灵魂
  alternative: 性命／自我
  rationale: 第8至9节明确把ψυχή同身体、心智及灵并列，因此保留“灵魂”比现代心理学式的泛译更忠实。
- issue: 第9节末句的主语
  choice: 以中文省略明确主语：“在人们眼中，他就这样显得……”
  alternative: 嫉妒显得像邪恶而有毒的灵／嫉妒的人显得像邪恶而有毒的灵
  rationale: 希腊语末句可承接嫉妒者，也可理解为嫉妒本身；正文不武断消除歧义，脚注说明两种读法。
translation_notes:
  register: 采用现代标准普通话和简体中文，语体庄重但不古奥。叙事段落力求自然清楚，劝诫及恶德清单保留遗训文学的节奏与重复。身体、灵魂、心智和灵等词有意区分，以保存原文的人论结构；对古代身体惯用语及末句真实歧义则借脚注说明。
