  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007.yaml
  text: And now[[God and man]], my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will arise for us. For the Lord will raise up from Levi as a high priest, and from Judah as a king, [God and man]; he will save [all the nations and] the race of Israel[[all the nations and]]. Therefore I command these things to you, so that you also may command your children[the race of Israel], that they may keep them throughout their generations.
translation:
  language: zh_hans
  text: '1 现在，我的孩子们，你们要听从利未和犹大；不可自高，以为高过这两个支派，因为上帝的拯救必从他们中间为我们兴起。


    2 因为主必从利未支派兴起一位大祭司，从犹大支派兴起一位君王［既是神，又是人］[a]；他必拯救［万国和］[b]以色列的族裔[c]。


    3 因此，我把这些事吩咐你们，使你们也吩咐自己的儿女，让他们世世代代遵守这些事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “既是神，又是人”在所据希腊文本中带有方括号，表明这几个字的文本地位不确定，也可能是后来的增补。这里保留并加方括号，以免无声省略。
    reason: textual_variant
  - marker: b
    text: “万国和”在所据希腊文本中带有方括号，可能是文本扩充。这里仍译出，并用方括号显示其不确定性。
    reason: textual_variant
  - marker: c
    text: “族裔”也可译作“人民”或“后裔”。希腊词γένος着重共同血缘或族属。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούσατε
  choice: 听从
  rationale: 该命令式兼有认真听取并作出响应之意；“听从”比单纯“听”更充分，同时不必将其僵化为绝对服从。
- source_word: μὴ ἐπαίρεσθε ἐπὶ
  choice: 不可在……面前自高
  rationale: 保留反身性的自我抬高及其针对两个支派的关系含义，中文自然且庄重。
- source_word: τὰς δύο γενεὰς
  choice: 这两个支派
  rationale: γενεά通常可指世代，但此处明确指利未、犹大两个以血缘为基础的以色列群体，译作“支派”最合语境。
- source_word: τὸ σωτήριον τοῦ Θεοῦ
  choice: 上帝的拯救
  rationale: 保留这一短语既可指上帝施行的救助、也可能带有具体救赎者意味的开放性，不将其限定为某一种解释。
- source_word: ἀνατελεῖ
  choice: 兴起
  rationale: 原词有升起、萌发之意；在预言语境中译作“兴起”自然，并与后文“兴起”领袖的表达形成联系。
- source_word: ἀναστήσει
  choice: 必……兴起
  rationale: 保留上帝使祭司与君王出现的先知性措辞，不提前解释为单纯任命或出生。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 这是该祭司职分在现代汉语中的标准名称。
- source_word: βασιλέα
  choice: 君王
  rationale: 准确保留王权称号；“君王”比“王”在此预言性文体中更庄重自然。
- source_word: σώσει
  choice: 必拯救
  rationale: 与前文σωτήριον的拯救主题相呼应，并保留救援与救赎两方面的可能含义。
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: 以色列的族类
  rationale: γένος着重血缘、族属或后裔群体；“族类”保留这一谱系意味，也避免现代汉语“种族”可能造成的误解。
- source_word: φυλάξωσιν
  choice: 遵守
  rationale: 在诫命语境中，该词指持守并实行所受吩咐；“遵守”是现代汉语最清楚自然的表达。
theological_decisions:
- issue: 括注短语 Θεὸν καὶ ἄνθρωπον 的文本地位与句法关系
  choice: 在正文中保留为“[a]［上帝又是人］”，并以方括号和脚注标明文本不确定性；按照现有希腊文本的位置，使其修饰从犹大兴起的君王。
  alternative: 视为后期增文而省略；或解释性译为“兼有神性和人性”。
  rationale: 所给希腊见证将该短语置于方括号中，显示其传本文本或编修层面的不确定性。直译并标示存疑，既不隐藏见证，也不把它改写成后期教义术语。
- issue: 括注短语 πάντα τὰ ἔθνη 的文本地位与范围
  choice: 在正文中保留为“[b]［万国和］”，以方括号及脚注显示其存疑。
  alternative: 作为次生扩充而省略；或将ἔθνη限定译为“外邦人”。
  rationale: “万国”保留πάντα的普遍范围，又不预先规定这里是否专指与以色列相对的外邦人；方括号如实反映来源中的文本疑问。
- issue: 祭司与君王的数目及后续代词的指向
  choice: 译为“一位大祭司”与“一位君王”，并保留单数“他必拯救”，不进一步说明两者是否最终合为一人。
  alternative: 把两种身份明确合并为同一位人物；或把“他”改写为复数“他们”。
  rationale: 希腊文本先列出两个来源与两个角色，随后使用单数οὗτος。译文保留这种张力，不以教义性解释消除其句法上的不对称。
translation_notes:
  register: 采用现代、庄重而易懂的遗训与预言文体。以“孩子们”“吩咐”“世世代代遵守”等表达维持父辈训诫的语气；对存疑词句同时使用正文方括号和字母脚注，避免读者误以为其文本地位确定。
