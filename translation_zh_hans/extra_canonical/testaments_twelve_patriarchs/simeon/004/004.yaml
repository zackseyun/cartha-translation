base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/004.yaml
  text: But Joseph was a good man, and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers.
translation:
  language: zh_hans
  text: 但约瑟是个善良的人，有上帝的灵在他里面；他为人慈悲怜悯，不记恨我，反而爱我，也爱我的弟兄们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἀνήρ
  choice: 善良的人
  rationale: 自然表达“品格良善之人”，保留原文对约瑟品格的正面评价。
- source_word: ἔχων πνεῦμα θεοῦ ἐν αὐτῷ
  choice: 有上帝的灵在他里面
  rationale: 贴近希腊文分词结构，不将其明说为后文行为的原因。
- source_word: εὔσπλαγχνος καὶ ἐλεήμων
  choice: 慈悲怜悯
  rationale: 分别传达发自内心的同情与施予怜悯，采用现代读者熟悉且庄重的措辞。
- source_word: οὐκ ἐμνησικάκησέν με
  choice: 不记恨我
  rationale: 准确传达“不怀怨、不记仇”的意思；“记恨”在现代汉语中自然简明。
- source_word: ἠγάπησέ με σὺν τοῖς ἀδελφοῖς μου
  choice: 爱我，也爱我的弟兄们
  rationale: 原结构可表示把西缅连同其弟兄们一起作为爱的对象；汉语拆开表达更自然清楚，并未改变范围。
theological_decisions:
- issue: 上帝的灵与约瑟品格行为之间的关系
  choice: 用“有上帝的灵在他里面”并列陈述
  alternative: 译作“因为上帝的灵在他里面”
  rationale: 希腊文使用分词ἔχων，虽可能带有背景或伴随意味，却没有明确标出因果关系，故不补入“因为”。
- issue: πνεῦμα θεοῦ的指称
  choice: 上帝的灵
  alternative: 上帝之灵／圣灵
  rationale: 直译原文用语，不把文本中未出现的“圣”补入，从而避免提前限定其具体神学指称。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“但……；……不……，反而……”保留原文的转折推进。“弟兄们”契合宗族叙事语境，并保持经传文体色彩。
