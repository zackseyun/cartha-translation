  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/003.yaml
  text: And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not grieved.
translation:
  language: zh_hans
  text: 我们下到埃及的时候，他把我当作探子捆绑起来；我知道自己受苦是公正的，也不感到忧伤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβημεν
  choice: 我们下到
  rationale: 保留圣经叙事中前往埃及常用的方向表达“下到”，同时符合现代汉语。
- source_word: ἔδησέ με
  choice: 他把我……捆绑起来
  rationale: 准确表达“捆绑、拘禁”的具体动作，并保留原文主语未点名的状态。
- source_word: ὡς κατάσκοπον
  choice: 当作探子
  rationale: ὡς在此表示以某种身份看待或处置；“探子”自然传达κατάσκοπος所指的侦察、窥探者。
- source_word: δικαίως πάσχω
  choice: 自己受苦是公正的
  rationale: 保留δικαίως的正当、公正含义，以及πάσχω较宽泛的“受苦”，不擅自具体化为刑罚。
- source_word: οὐκ ἐλυπούμην
  choice: 不感到忧伤
  rationale: ἐλυπούμην表达悲伤、忧愁；“不感到忧伤”贴近其情感意义，也符合自然现代汉语。
theological_decisions:
- issue: 受苦具有公正性的陈述
  choice: 我知道自己受苦是公正的
  alternative: 我知道自己是罪有应得
  rationale: 采用较贴近原文且较中性的表达，保留说话者认可所受苦难合乎公正之意，避免用“罪有应得”额外明确罪责或刑罚性质。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。分号呈现认知与情感反应之间的紧密关系；保留“他”而不根据上下文补出人物姓名，以免超出本节原文。
