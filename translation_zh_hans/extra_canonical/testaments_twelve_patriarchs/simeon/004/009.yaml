source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ὅτι καὶ⁷¹ ἐν ὕπνῳ *τις ζῆλος⁷² κακίας αὐτὸν⁷³ φαντάζουσα⁷⁴ κατεσθίει⁷⁵ καὶ⁷⁶ πνεύμασι πονηροῖς⁷⁷ διαταράσσει⁷⁸ τὴν ψυχὴν αὐτοῦ, καὶ ἐκθροεῖσθαι τὸ σῶμα ποιεῖ, καὶ ἐν ταραχῇ διυπνίζει⁷⁹ τὸν νοῦν, καὶ ὡς⁸⁰ πνεῦμα πονηρὸν *καὶ ἰοβόλον⁸¹, *οὕτως φαίνεται⁸² τοῖς ἀνθρώποις⁸³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/009.yaml
  text: For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body shudder, and wakes the mind in turmoil; and like an evil and venomous spirit, so he appears to people.
translation:
  language: zh_hans
  text: 因为，甚至在睡梦中，嫉妒使他看见邪恶的幻象，吞噬他，用邪灵搅扰他的魂，使他的身体战栗，使他的心智在惊惶中醒来；他在人们眼中，就像一个邪恶而有毒的灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 该词可指热心、妒忌或嫉妒；本段以其为吞噬并搅扰人的恶性力量，语境明确偏向“嫉妒”。
- source_word: φαντάζουσα
  choice: 向他显出……幻象
  rationale: 保留使影像显现、令人在想象中看见的含义；不把它弱化为一般的“欺骗”。
- source_word: ἐκθροεῖσθαι
  choice: 战栗
  rationale: 该词表达受惊而震动、颤栗；避免加入原文未明说的“因恐惧跳起”。
- source_word: διυπνίζει
  choice: 使……醒来
  rationale: 按其唤醒、使彻底醒转之义翻译，同时保留“在惊乱中”对醒来状态的限定。
- source_word: ἰοβόλον
  choice: 带毒的
  rationale: 原词有发出或施放毒害之意；“带毒的”在现代汉语中自然，并保留其有害、毒烈的形象。
- source_word: ψυχὴν / νοῦν
  choice: 魂 / 心智
  rationale: 分别译出两个不同的希腊词，避免将二者都译为“心”而抹平原文区分。
theological_decisions:
- issue: 邪灵是实际施扰者，还是嫉妒的比喻性表现
  choice: 按原文译作“用邪灵搅扰他的魂”，并在后半句保留“像……灵”的明喻
  alternative: 将“邪灵”解释为纯粹的心理冲动或人格化修辞
  rationale: 原文同时使用复数“邪灵”和明喻“像一个邪恶而带毒的灵”；译文不预先裁定其本体论性质，保留两者之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句法保留原文连续推进的因果与动作链条；“在人们眼中”自然表达与格短语 τοῖς ἀνθρώποις 所指的观察者视角。
