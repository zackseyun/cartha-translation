revisions:
- from: 因为即使在睡梦中，嫉妒也向他显出邪恶的幻象，吞噬他，用邪灵搅扰他的魂，使他的身体战栗，使他的心智在惊乱中醒来；他在人们眼中，就像一个邪恶而带毒的灵。
  to: 因为，甚至在睡梦中，嫉妒使他看见邪恶的幻象，吞噬他，用邪灵搅扰他的魂，使他的身体战栗，使他的心智在惊惶中醒来；他在人们眼中，就像一个邪恶而有毒的灵。
  rationale: 修订“即使”为“甚至”，以正确反映原文的加强语气；微调幻象、惊惶和毒性灵的措辞，使现代汉语更顺畅，同时保留原文的动作链、邪灵复数的工具性表达，以及末句的比较而非本体断言。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:23:47Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了嫉妒在睡梦中施加幻象、吞噬、以邪灵搅扰、使身体震动并使心智在扰乱中醒来的连续动作，也保留了末句将其比作邪恶、有毒之灵的明喻。惟“即使在睡梦中”在汉语中通常期待后接让步结果，未能恰当表达原文此处的加强语气；宜改为“甚至在睡梦中”。
  naturalness: “因为即使在睡梦中”搭配略显别扭；“惊乱”亦不如“惊惶”自然。将“向他显出邪恶的幻象”调整为“使他看见邪恶的幻象”，可更明确、自然地表达分词所述的施加幻象之意。
  terminology: “嫉妒”“邪灵”“魂”“心智”及“邪恶而有毒的灵”均能维持原文的词汇区分与庄重语体。保留“魂／心智”的区别，不将其预设为特定教义体系的技术定义。
  issues:
  - severity: medium
    issue: “即使在睡梦中”误作让步结构
    rationale: καὶ ἐν ὕπνῳ在此是“甚至在睡梦中”的加强性补充，不是“即使……也……”式让步条件；汉语“即使”也使句子缺少相应的让步后项。
  - severity: low
    issue: “惊乱”不够自然
    rationale: ταραχῇ指扰乱、惊惶的状态；“在惊惶中”更符合现代标准汉语，且不增加原文未说的具体恐惧原因。
  revised_text: 因为，甚至在睡梦中，嫉妒使他看见邪恶的幻象，吞噬他，用邪灵搅扰他的魂，使他的身体战栗，使他的心智在惊惶中醒来；他在人们眼中，就像一个邪恶而有毒的灵。
  revised_footnotes: []
