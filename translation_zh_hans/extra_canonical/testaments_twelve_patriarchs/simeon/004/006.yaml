  source_fidelity: “责备”虽可涵盖ὠνείδισεν，但“责难”更准确传达因某事加以指责、羞辱式责怪的语气。原译“使我们所得的尊荣超过他自己的儿子”基本保留比较关系，但把主动动词ἐδόξασεν转为较迂回的结果表达；改为“尊荣我们，超过自己的儿子”更贴近原文句法和语义。
