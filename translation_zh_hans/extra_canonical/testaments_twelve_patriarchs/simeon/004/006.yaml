base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/006.yaml
  text: All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us wealth and livestock and produce.
translation:
  language: zh_hans
  text: 他一生中，从未因这件事责难我们，反而爱我们，如同爱自己的性命；又尊荣我们，超过自己的儿子，并赐给我们财富、牲畜和出产。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάσας τὰς ἡμέρας
  choice: 他在世的日子
  rationale: 该短语直指“他所有的日子”；汉语用“他在世的日子”自然表达其一生之中，同时避免生硬的“所有日子”。
- source_word: ὠνείδισεν
  choice: 责备
  rationale: 表达因某事斥责、责难之意；结合 περὶ τοῦ πράγματος τούτου，译为“因这件事责备”简明自然。
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: 如同爱自己的性命
  rationale: ψυχή 在此指本人生命或性命，而非专门的灵魂概念；补出第二个“爱”符合汉语表达，也保留原句强烈的亲爱比较。
- source_word: ὑπὲρ τοὺς υἱοὺς αὐτοῦ ἐδόξασεν ἡμᾶς
  choice: 使我们所得的尊荣超过他自己的儿子
  rationale: ἐδόξασεν 可指给予尊荣；此译保留 ὑπέρ 的比较关系，并避免“荣耀我们”在现代汉语中的不自然。
- source_word: πλοῦτον
  choice: 财富
  rationale: 直接表达物质财货，语体庄重而现代。
- source_word: κτήνη
  choice: 牲畜
  rationale: 准确涵盖家养畜群。
- source_word: καρπὸν
  choice: 出产
  rationale: 在财富与牲畜的并列语境中，指土地或产业的产物；“出产”比仅译“果实”覆盖面更合适。
- source_word: ἐχαρίσατο
  choice: 赐给
  rationale: 体现慷慨给予之意，也符合叙事的庄重语体。
theological_decisions: []
