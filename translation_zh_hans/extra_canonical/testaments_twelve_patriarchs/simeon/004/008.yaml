  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ὅτι⁵⁸ ἀγριοῖ τοῦτο⁵⁹ τὴν ψυχήν⁶⁰, καὶ φθείρει *τὸ σῶμα⁶¹, *ὀργὴν καὶ πόλεμον παρέχει τῷ διαβουλίῳ⁶², καὶ εἰς⁶³ αἵματα⁶⁴ παροξύνει, καὶ εἰς ἔκστασιν ἄγει⁶⁵ *τὴν διάνοιαν⁶⁶, καὶ κλόνον⁶⁹ παρέχει τῇ ψυχῇ⁷⁰ καὶ τρόμον τῷ σώματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/008.yaml
  text: For this makes the soul savage, and destroys the body; it brings anger and war into one’s plans, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling.
translation:
  language: zh_hans
  text: 因为这会使灵魂变得凶暴，毁坏身体；它给人的谋划带来愤怒和战争，煽动人流血，使心思陷入狂乱，又使灵魂动荡、身体战栗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγριοῖ
  choice: 使……变得凶暴
  rationale: 保留动词“使之野蛮、凶猛”的使役含义；“凶暴”比“野蛮”更自然地描述灵魂受嫉妒影响后的状态。
- source_word: ψυχήν
  choice: 灵魂
  rationale: 此处与身体相对，又在后文与“心思”有别，译为“灵魂”可保存原文的人论用语和修辞对应。
- source_word: φθείρει
  choice: 毁坏
  rationale: 涵盖败坏、损害乃至毁灭的语义力度，不将其弱化为一般的“伤害”。
- source_word: τῷ διαβουλίῳ
  choice: 人的谋算
  rationale: 该词指谋议、盘算或计划；以“谋算”保留内在筹谋之意，并补出“人的”使现代汉语通顺。
- source_word: εἰς αἵματα παροξύνει
  choice: 刺激人流血
  rationale: 原文复数“血”形成惯用表达，指流血暴行；译文保留“激起、刺激”的强烈推动意味。
- source_word: εἰς ἔκστασιν ἄγει τὴν διάνοιαν
  choice: 使心思陷入狂乱
  rationale: ἔκστασις在此语境指失常、迷狂，而非宗教性的“出神”；διάνοια译作“心思”，与ψυχή区分。
- source_word: κλόνον
  choice: 动荡
  rationale: 表达扰乱、震荡或骚动，适合描述灵魂内部失去安定的状态。
- source_word: τρόμον
  choice: 战栗
  rationale: 准确传达身体因恐惧或激动而发抖，且保持庄重语体。
theological_decisions:
- issue: ψυχή与διάνοια的区分
  choice: 分别译为“灵魂”和“心思”
  alternative: 均译为“心”
  rationale: 原文刻意使用不同词汇，并将灵魂、心思和身体并列；分别翻译可保留其概念张力，而不预设一套特定的人论体系。
- issue: ἔκστασις的性质
  choice: 译为“狂乱”
  alternative: 译为“出神”
  rationale: 上下文列举凶暴、毁坏、愤怒、争斗、流血、动荡和战栗，明显是负面失常状态；“出神”容易引入正面的宗教经验含义。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话；保留原文连续使役结构和灵魂—心思—身体的层次。此节的主语“这”承接上文，未擅自补明其所指。
