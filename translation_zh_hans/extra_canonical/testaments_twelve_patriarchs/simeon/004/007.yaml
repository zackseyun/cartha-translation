  terminology: “弟兄”保留 ἀδελφός 的亲属／群体双重可读性；“善良的心”适切对应 ἐν ἀγαθῇ καρδίᾳ；“嫉妒的灵”不将 πνεῦμα 化约为情绪，术语处理恰当。无需增设脚注；原版页内的 52–57 标号并非此译文必须重建的释义脚注锚点。
  issues:
