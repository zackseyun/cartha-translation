source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὑμεῖς⁵², τέκνα μου⁵³, ἀγαπήσατε⁵⁴ ἕκαστος τὸν ἀδελφὸν⁵⁵ αὐτοῦ⁵⁶ ἐν ἀγαθῇ καρδίᾳ, καὶ *ἀποστήσεται ἀφ᾽ ὑμῶν τὸ πνεῦμα τοῦ φθόνου⁵⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/007.yaml
  text: And you also, my children, let each one love his brother with a good heart, and the spirit of envy will depart from you.
translation:
  language: zh_hans
  text: 我的孩子们，你们也要各自以善良的心爱自己的弟兄；而嫉妒的灵必离开你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留父辈劝诫的亲切称呼，也符合现代汉语的庄重表达。
- source_word: ἀγαπήσατε
  choice: 要……爱
  rationale: 译出不定过去时命令语气的劝诫力度，不强行赋予时态额外神学含义。
- source_word: ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: 各自……爱自己的弟兄
  rationale: 保留‘每个人’及关系代词的分配性；‘弟兄’既维持亲属措辞，也可自然承载群体成员之意。
- source_word: ἐν ἀγαθῇ καρδίᾳ
  choice: 以善良的心
  rationale: 直接保留‘心’的内在品格意象；‘善良’自然表达 ἀγαθός 的道德正面含义。
- source_word: τὸ πνεῦμα τοῦ φθόνου
  choice: 嫉妒的灵
  rationale: 形式上保留属格结构及 πνεῦμα 的‘灵’，不把它化约为单纯心理状态，从而保存文本可能具有的人格化或属灵含义。
- source_word: ἀποστήσεται ἀφ᾽ ὑμῶν
  choice: 就会离开你们
  rationale: 准确表达将来时及从人身边退去、离开的方向含义。
theological_decisions:
- issue: ‘嫉妒的灵’是人格化属灵存在还是人的内在倾向
  choice: 保留‘嫉妒的灵’
  alternative: ‘嫉妒之心’或‘嫉妒的情绪’
  rationale: 希腊文明确使用 πνεῦμα；直译能保留其真实歧义，避免预先裁定其本体性质。
- issue: 两个分句之间的逻辑关系
  choice: 用‘这样……就……’表达由命令所引出的结果
  alternative: 仅用‘并且’连接
  rationale: 希腊文 καί 在此连接劝诫与将来结果；汉语若单用‘并且’略显生硬，‘这样……就……’自然呈现语境中的结果关系，但不强化为机械因果或功德交换。
translation_notes:
  register: 采用现代、清楚而庄重的劝诫语体。保留‘弟兄’和‘嫉妒的灵’等源文关键意象，不作宗派化解释；句式适度汉语化，以便普通读者顺畅理解。
