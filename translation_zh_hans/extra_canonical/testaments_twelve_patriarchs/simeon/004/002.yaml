- source_word: παρὰ πάντας
  choice: 比所有人都
  rationale: 保留比较含义，指他的悲痛超过其他所有人。
- source_word: αἴτιος
  choice: 是我造成的
  rationale: 表达说话者对事件负有责任，同时避免添加原文没有明说的具体行动。
- source_word: τῆς πράσεως Ἰωσήφ
  choice: 约瑟被卖
  rationale: πρᾶσις在此指售卖；用被动式清楚表明约瑟是被卖的人。
