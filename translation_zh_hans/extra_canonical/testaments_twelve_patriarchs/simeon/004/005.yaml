base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/005.yaml
  text: Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you grace and glory and blessing upon your heads, just as you saw in Joseph.
translation:
  language: zh_hans
  text: 所以，孩子们，你们要谨防一切嫉妒和嫉恨，要以单纯的心行事，好让上帝也将恩典、荣耀和福分赐在你们头上，正如你们在约瑟身上所看见的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς ζήλου καὶ φθόνου
  choice: 一切嫉妒和眼红
  rationale: ζῆλος 与 φθόνος 在此构成近义并列，均指因他人所得而生的负面情绪；用“嫉妒和眼红”保留两个词，又符合现代汉语表达。
- source_word: ἁπλότητι καρδίας
  choice: 单纯的心
  rationale: ἁπλότης 可表达单纯、真诚、不怀二心；直译为“单纯的心”既保留其伦理含义，也不把语义限定为某一种解释。
- source_word: χάριν
  choice: 恩典
  rationale: χάρις 在上帝施予的语境中译作“恩典”，贴近原词，并与荣耀、福分的并列相称。
- source_word: ἐπὶ τὰς κεφαλὰς ὑμῶν
  choice: 赐在你们头上
  rationale: 保留原文“在头上”的祝福意象，同时以“赐在”使汉语句法自然。
- source_word: ἐν Ἰωσήφ
  choice: 在约瑟身上
  rationale: 这里指上帝的恩典、荣耀和福分显明于约瑟；“在约瑟身上”自然保留 ἐν 的表达。
theological_decisions:
- issue: ἁπλότης 的伦理内涵
  choice: 单纯
  alternative: 诚实／专一／纯正
  rationale: 原词可能兼含真诚、专一和不诡诈之意；“单纯”保留较宽的语义范围，避免将其收窄为某一特定德目。
- issue: χάρις 的译法
  choice: 恩典
  alternative: 恩惠
  rationale: “恩典”较直接对应上帝所赐的 χάρις；本句并未说明其具体性质，因此不作进一步神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的孩子们”保留遗训体的亲切称呼；“谨防……要……”呈现劝诫语气。
