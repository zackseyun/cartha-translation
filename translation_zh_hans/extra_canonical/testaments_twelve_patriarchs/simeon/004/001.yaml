base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/001.yaml
  text: My father kept asking about me, because he had seen me gloomy, and I said to him, “My liver is swollen.”
translation:
  language: zh_hans
  text: 我父亲不断询问我的情况[a]，因为他见我愁眉不展。我对他说：“我的肝脏[b]肿了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的情况”一语在希腊文本传承中的可靠性不确定。
    reason: 底本以特殊括号标示 περὶ ἐμοῦ，需向读者保留其文本不确定性。
  - marker: b
    text: 希腊文“肝”采用复数形式；这里按现代汉语称说身体器官的习惯译为单数。
    reason: 说明原文不寻常的数形式，同时避免在正文中造成误解。
lexical_decisions:
- source_word: Ἦν … ἐρωτῶν
  choice: 不断询问
  rationale: 迂回未完成时表达过去持续或反复进行的动作；“不断询问”自然传达这一体貌。
- source_word: περὶ ἐμοῦ
  choice: 我的情况
  rationale: 此处表示父亲就说话者本人及其状况发问；译作“我的情况”比生硬的“关于我”更符合现代汉语。
- source_word: σκυθρωπόν
  choice: 愁眉不展
  rationale: 该词描述面容阴沉、忧郁；此译既保留可见的神情，也符合父亲“见”他的语境。
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: 我的肝脏肿了
  rationale: 原句以身体部位表达肿胀，汉语宜用单数器官名称和状态谓语；不将其引申解释为情绪或其他疾病。
