  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/002.yaml
  text: And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly in a war of the Egyptians.
translation:
  language: zh_hans
  text: 他们把他安放在木棺里，为要把他的骸骨运到希伯仑。他们在埃及人的一场战争中，暗中把这些骸骨运了上去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在埃及人的一场战争中”也可译作“在与埃及人的战争中”或“当埃及人交战时”；原文没有说明交战的另一方，也不完全确定“埃及人”与“战争”之间的关系。
    reason: 保留ἐν πολέμῳ Αἰγυπτίων的属格关系及参战方的真实歧义。
lexical_decisions:
- source_word: θήκῃ ξυλίνῃ
  choice: 木棺
  rationale: θήκη泛指盛放之物；在安放遗体的语境中，译作“棺”最自然，ξυλίνῃ明确其为木制。
- source_word: ἀναγαγεῖν / ἀνήγαγον
  choice: 运回 / 运了回去
  rationale: 动词本义为“带上去、运上去”；从埃及前往希伯仑也带有地理上的上行意味，但现代汉语用“运回”更自然，并保留归葬故地的方向。
- source_word: τὰ ὀστᾶ αὐτοῦ / αὐτά
  choice: 他的骸骨 / 骸骨
  rationale: ὀστᾶ直指骨头；遗骸迁运语境中“骸骨”庄重自然。后句将代词所指明译为“骸骨”，避免汉语歧义。
- source_word: κρυφῇ
  choice: 暗中
  rationale: 准确表达秘密、不公开地行动。
theological_decisions:
- issue: ἐν πολέμῳ Αἰγυπτίων的结构歧义
  choice: 埃及人交战时
  alternative: 在与埃及人的战争中 / 在埃及人的一场战争中
  rationale: 属格Αἰγυπτίων可表示战争与埃及人的关联，却未明说交战另一方。“埃及人交战时”保留这种未限定性，也较符合汉语；以脚注提示原文可有其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“安放”适合遗体入棺语境；第二句加入“后来”以自然呈现叙事推进，不改变事件内容。
