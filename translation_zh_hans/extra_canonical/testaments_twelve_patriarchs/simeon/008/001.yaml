base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/001.yaml
  text: And when Simeon had finished commanding his sons, he fell asleep with his fathers, being one hundred and twenty years old.
translation:
  language: zh_hans
  text: 西缅嘱咐完他的儿子们之后，就与他的祖先一同长眠，享年一百二十岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσεν ἐντελλόμενος
  choice: 嘱咐完
  rationale: 表达“完成吩咐、训诫”的含义；结合遗训语境，用现代汉语中自然而庄重的“嘱咐完”。
- source_word: ἐκοιμήθη
  choice: 同眠了
  rationale: 保留原文以“睡眠”委婉指死亡的表达，不直接改译为“死了”。
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: 与他的祖先同眠
  rationale: πατέρων在此指先祖；“祖先”比字面的“父辈”更符合汉语丧葬语境，同时保留“与……同眠”的意象。
- source_word: ὢν ἐτῶν ἑκατὸν εἴκοσι
  choice: 享年一百二十岁
  rationale: 以自然、庄重的现代汉语交代去世年龄，语义与原文一致。
theological_decisions:
- issue: “睡了”是否应明确解释为死亡
  choice: 保留“同眠”的死亡委婉语
  alternative: 译作“去世了”或“死了”
  rationale: 原文刻意使用ἐκοιμήθη；保留睡眠意象可避免抹平其文本与神学色彩，而上下文足以表明所指为死亡。
- issue: “与他的列祖同睡”的表达方式
  choice: 译为“与他的祖先同眠了”
  alternative: 译为“归到他列祖那里”
  rationale: 后者可能引入原文未明说的“归到、被收聚”概念；本译更贴近μετὰ与ἐκοιμήθη的组合。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“嘱咐完”适合临终遗训语境；“同眠”保留原文委婉而富有经文色彩的死亡表达。正文无脚注标记，因为本节没有必须另注的文本异读或难解歧义。
