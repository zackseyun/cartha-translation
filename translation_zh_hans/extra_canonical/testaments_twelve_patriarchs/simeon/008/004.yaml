base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/004.yaml
  text: For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague on the Egyptians, so that each man would not recognize his brother, even with a lamp.
translation:
  language: zh_hans
  text: 因为术士对他们说，约瑟的骸骨被带出去的时候，遍地必有黑暗、幽暗，又有大灾殃临到埃及人，以致各人即使有灯，也认不出自己的弟兄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐπαοιδοί
  choice: 术士
  rationale: 该词指施行咒术或念咒的人；“术士”在现代汉语中自然、庄重，也不把含义过度限定为单纯的占卜者或魔术表演者。
- source_word: ἐν ἐξόδῳ τῶν ὀστῶν Ἰωσήφ
  choice: 约瑟的骸骨出境时
  rationale: ἐξόδῳ 表示出去、离境；结合约瑟骸骨被带离埃及的叙事背景，译为“出境”比泛泛的“出去”清楚，同时保留“骸骨”这一具体意象。
- source_word: ἐν πάσῃ τῇ γῇ
  choice: 遍地
  rationale: 简洁对应“全地”；原文未明确限定为哪一片土地，因此不擅自补作“埃及全地”。
- source_word: σκότος καὶ γνόφος
  choice: 黑暗、幽暗
  rationale: 保留两个近义名词的叠加强调；“幽暗”可表达 γνόφος 所带的浓暗、昏暗意味。
- source_word: πληγὴ μεγάλη τοῖς Αἰγυπτίοις
  choice: 有大灾殃临到埃及人
  rationale: πληγή 可指打击、灾祸或灾殃；此处用“灾殃”保留灾难性含义，而不武断限定为疾病意义的“瘟疫”。
- source_word: μετὰ λύχνου
  choice: 即使拿着灯
  rationale: 表达让步性语境：黑暗深重到有灯也无法辨认；“拿着灯”是自然的现代汉语表达。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自己的弟兄
  rationale: 按字面保留亲属称谓“弟兄”，而不泛化为“别人”；“自己的”自然表达 αὐτοῦ 的所属关系。
theological_decisions:
- issue: 约瑟骸骨离境与灾殃之间的关系
  choice: 采用时间表达“……时”，不明确断言骸骨离境是灾殃的原因
  alternative: 译作“因约瑟的骸骨出境”
  rationale: 希腊文 ἐν ἐξόδῳ 首先标示发生的时机；因果关系并未由语法明确表达，应保留这种开放性。
- issue: πληγή 是否特指瘟疫
  choice: 译为较宽泛的“大灾殃”
  alternative: 译为“大瘟疫”
  rationale: πληγή 的语义范围包括打击、灾难和灾害，本文没有足够依据将其收窄为传染病。
- issue: “遍地”的范围
  choice: 不补入“埃及”作为地域限定
  alternative: 译为“埃及全地”
  rationale: 原文只说 πάσῃ τῇ γῇ，而后另以“埃及人”标明受灾者；译文不应把可能的语境推断写成明示内容。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“黑暗、幽暗”保留原文近义并列的修辞力度；末句调整为自然汉语语序，同时保留“各人”“自己的弟兄”和“即使拿着灯”等全部信息。
