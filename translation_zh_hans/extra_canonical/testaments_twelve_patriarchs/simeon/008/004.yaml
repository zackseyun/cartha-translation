  naturalness: 整体庄重自然。“约瑟的骸骨被带出去的时候”比“约瑟的骸骨出境时”更合现代汉语，也更准确表达骨头作为被带离者的语义。
  terminology: “术士”可对应ἐπαοιδοί；“黑暗、幽暗”适当保留σκότος与γνόφος的并列；“大灾殃”恰当保留πληγή的宽泛“灾祸/击打”含义，未擅自限定为瘟疫。“弟兄”适合此庄重文本。
