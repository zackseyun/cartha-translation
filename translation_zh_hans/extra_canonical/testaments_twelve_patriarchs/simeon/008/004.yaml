revisions:
- from: 因为术士曾告诉他们，约瑟的骸骨出境时，遍地必有黑暗、幽暗，并有大灾殃临到埃及人，以致各人即使拿着灯，也认不出自己的弟兄。
  to: 因为术士对他们说，约瑟的骸骨被带出去的时候，遍地必有黑暗、幽暗，又有大灾殃临到埃及人，以致各人即使有灯，也认不出自己的弟兄。
  rationale: 将“曾告诉”改为“对他们说”，避免把持续性的过去叙述误作完成性单次事件；将“骸骨出境时”改为“骸骨被带出去的时候”，既贴合ἐξόδῳ的“出去”，也避免增添现代国界概念。其余措辞维持原译对原文的忠实性与现代庄重语体。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:23:59Z'
