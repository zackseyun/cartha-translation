  text: For the Egyptians were keeping Joseph’s bones in the tombs of the kings, so as to bring him up.
translation:
  language: zh_hans
  text: 因为埃及人一直将约瑟的骸骨保管在王陵中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ ὀστᾶ τοῦ Ἰωσὴφ
  choice: 约瑟的骸骨
  rationale: “ὀστᾶ”直指骨骸；“骸骨”在现代汉语中自然、庄重，也符合遗骨语境。
- source_word: ἐφύλαττον
  choice: 保存在
  rationale: 未完成时表示过去持续进行的行为；“保存”兼有保管、留存之意，不额外推断其目的。
- source_word: οἱ Αἰγύπτιοι
  choice: 埃及人
  rationale: 直接对应带定冠词的族群称谓。
- source_word: ἐν τοῖς μνήμασι τῶν βασιλέων
  choice: 在列王的陵墓中
  rationale: “μνήματα”在此为安葬君王的墓穴或陵墓；“列王”保留复数且具有庄重文体。
theological_decisions:
- issue: 英文咨询文本末尾含“so as to bring him up”，但所给希腊文本无对应成分
  choice: 不译入该目的从句
  alternative: 加上“为要把他带上去”
  rationale: 以现存原语言证据为先；不能把所给希腊句中没有的内容纳入正文。此举也避免将“带上去”的指向和含义强行确定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“因为”对应句首γὰρ，并保留本节与上文的因果衔接。
