    reason: 保留ἄλειμμα在该异常搭配中的词义不确定性。
  - marker: d
    text: “使我受挫，阻止我行动”对应的希腊语表达较为生硬，也可理解为“主压碎了我，并阻止我采取行动”。
    reason: 保留原文的受挫意象及“阻止行动”的含义，不将其擅自具体化为某一种疾病或禁令。
  - marker: e
