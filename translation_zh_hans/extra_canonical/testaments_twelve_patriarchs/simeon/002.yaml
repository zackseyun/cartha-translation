base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002.yaml
  text: '1. Hear, my children, Simeon your father, and I will declare to you what I have in my heart.

    2. I was born from Jacob as the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.

    3. For I became very strong; I did not shrink from any deed, nor was I afraid in any matter.

    4. For my heart was hard, and my liver unmoved, and my inward parts without compassion.

    5. For courage also is given by the Most High to men in soul and in body.

    6. But in the time of my youth I was very jealous of Joseph, because my father loved him above all.

    7. And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.

    8. But his God and the God of our fathers sent his angel and rescued him from my hands.

    9. For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.

    10. And when Reuben heard these things, he was grieved, for he wanted to bring him back safely to our father.

    11. But when I heard this, I was very angry with Judah, because he had let him go alive;

    12. and for five months I was sick in my liver. And the Lord struck me, and my hand was withered for seven days.

    13. And I knew, my children, that this happened to me because of Joseph. And after changing my mind I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.

    14. For I knew that I had devised an evil thing before the Lord and against Jacob my father concerning Joseph my brother, by envying him.'
translation:
  language: zh_hans
  text: '《西缅遗训》第二章


    1 孩子们，要听你们父亲西缅的话；我要把心里所存的告诉你们。


    2 我是雅各所生、归我父亲的第二个儿子。母亲利亚给我取名叫西缅，因为主听见了她的祈求。


    3 我变得非常强壮；无论要做什么，我都不退缩，遇到任何事也不惧怕。


    4 因为我的心刚硬，肝胆坚定不动，肺腑毫无怜悯[a]。


    5 因为人的勇力，无论在心灵还是身体上，也是至高者所赐的。


    6 然而，我年轻的时候非常嫉妒约瑟，因为父亲爱他胜过所有人。


    7 我一心与他为敌，甚至想要杀死他[b]；因为欺骗的首领和嫉妒之灵蒙蔽了我的心智，使我不把他当作兄弟看待，也不顾惜我父亲雅各。


    8 但约瑟的上帝，就是我们列祖的上帝，差遣他的天使，把约瑟从我手中救了出来。


    9 当时，我去了示剑，要给羊群送药膏[c]；流便去了多坍，我们所需的物品和全部存货都在那里。我兄弟犹大来到那里，把约瑟卖给了以实玛利人。


    10 流便听见这事，就很忧伤，因为他本想把约瑟带回父亲那里。


    11 我听见以后，却向犹大发烈怒，因为他让约瑟活着离开了。我一连五个月向他怀怒。


    12 主使我受挫，阻止我行动[d]；因为我的右手有七天半枯干了[e]。


    13 孩子们，我这才知道，这事临到我是因为约瑟。于是我回心转意，哭泣着向主上帝祷告，求他使我的手复原，也使我远离一切污秽、嫉妒和愚妄。


    14 因为我知道，我嫉妒我兄弟约瑟，便在主面前，并对我父亲雅各，图谋了一件恶事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肝胆”和“肺腑”对应原文的“肝”和“内脏”。古人常用这些身体部位表达意志、情感和怜悯。
    reason: 帮助现代读者理解古代身体—情感语言，同时保留原文意象。
  - marker: b
    text: 原文直译近于“我把肝对准他，为要杀死他”，意思是定意与他为敌。
    reason: 说明第7节为可理解的功能性翻译，并记录其与第4节“肝”意象的联系。
  - marker: c
    text: “药膏”也可译作“涂抹用的油膏”；原文没有说明具体用途。
    reason: 保留ἄλειμμα在该异常搭配中的词义不确定性。
  - marker: d
    text: “使我受挫，阻止我行动”对应的希腊语表达较为生硬，也可理解为“主压碎了我，并阻止我采取行动”。
    reason: 保留原文的受挫意象及“阻止行动”的含义，不将其擅自具体化为某一种疾病或禁令。
  - marker: e
    text: “半枯干”是原文的程度表达；意思可能是右手部分失去活动能力。
    reason: 避免把ἡμίξηρος过度译成完全枯干或永久残废。
lexical_decisions:
- source_word: τὰ ἤπατά μου / τὰ ἤπατα
  choice: 肝胆；一心
  rationale: ἧπαρ直指“肝”，但在古代心理语言中也是情感、意志和愤怒的所在。第4节保留身体意象并用自然汉语“肝胆”，第7节按功能译为“一心”，避免“把肝对准他”在现代汉语中不可理解。
- source_word: τὰ σπλάγχνα μου
  choice: 肺腑
  rationale: 该词本义为内脏，也常指深处的情感和怜悯；“肺腑”既保留身体意象，也符合庄重的现代汉语。
- source_word: ἀνδρεία
  choice: 勇力
  rationale: 兼含勇气、刚强和行动能力；“勇力”比单纯“勇气”更能呼应下文“心灵和身体”。
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: 欺骗的首领
  rationale: πλάνη可指迷惑、欺骗或谬误；此处保留人格化表达，不进一步认定其特定身份。
- source_word: τὸ πνεῦμα τοῦ ζήλου
  choice: 嫉妒之灵
  rationale: 上下文明确是西缅嫉妒约瑟；保留“灵”的超人性或人格化张力，不将其弱化为单纯情绪。
- source_word: ἄλειμμα
  choice: 药膏
  rationale: 通常指涂抹用的油膏；与羊群搭配时，可能是护理或医治牲畜所用，故译“药膏”，并以脚注保留不确定性。
- source_word: ἡμίξηρος
  choice: 半枯干
  rationale: 复合词字面是“半干枯”；保留程度含义，不扩大为整只手完全瘫痪。
- source_word: μετανοήσας
  choice: 回心转意
  rationale: 表达心思和方向的改变，并符合随后哭泣、祷告和弃绝恶行的语境；不额外导入后世宗派化的悔改定义。
- source_word: μολυσμός
  choice: 污秽
  rationale: 保留道德或宗教性污染的广义，不擅自限定为某一种具体罪行。
theological_decisions:
- issue: “欺骗的首领”和“嫉妒之灵”的身份
  choice: 按原文保留两个称谓，不指名为撒但、鬼魔或心理状态
  alternative: 解释性地译作“魔鬼”和“嫉妒的念头”
  rationale: 原文呈现人格化和属灵作用，却没有在本段明确界定二者身份；应保留这种神学张力。
- issue: 上帝借天使拯救约瑟
  choice: 直译为“差遣他的天使”
  alternative: 将ἄγγελος泛译为“使者”或解释为人的代理者
  rationale: 语境将此行动归给上帝，但没有说明天使如何介入；译文既保留“天使”，也不补写具体机制。
- issue: 勇力来自至高者
  choice: 保留心灵与身体两个层面
  alternative: 仅译为道德勇气来自上帝
  rationale: 原文明说“在心灵和身体上”，不应将恩赐缩减为纯粹属灵或伦理品质。
- issue: 身体患难与嫉妒约瑟的关联
  choice: 保留西缅自己的因果领悟“这事临到我是因为约瑟”
  alternative: 直接断言所有疾病都是上帝对特定罪行的惩罚
  rationale: 本段确实把击打与西缅的恶念相连，但这是特定叙事中的判断，不宜扩展为普遍疾病论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名和地名使用简体中文圣经读者较熟悉的形式。第4、7节在可读性与古代身体意象之间作区分处理；第11—12节依所给希腊正文翻译为“怀怒五个月”以及主使其不能行动，而不跟随英语咨询层将五个月改作肝病。
