  revised_text: '《西缅遗训》第二章


    1 孩子们，要听你们父亲西缅的话；我要把心里所存的告诉你们。


    2 我是雅各所生、归我父亲的第二个儿子。母亲利亚给我取名叫西缅，因为主听见了她的祈求。


    3 我变得非常强壮；无论要做什么，我都不退缩，遇到任何事也不惧怕。


    4 因为我的心刚硬，肝胆坚定不动，肺腑毫无怜悯[a]。


    5 因为人的勇力，无论在心灵还是身体上，也是至高者所赐的。


    6 然而，我年轻的时候非常嫉妒约瑟，因为父亲爱他胜过所有人。


    7 我一心与他为敌，甚至想要杀死他[b]；因为欺骗的首领和嫉妒之灵蒙蔽了我的心智，使我不把他当作兄弟看待，也不顾惜我父亲雅各。


    8 但约瑟的上帝，就是我们列祖的上帝，差遣他的天使，把约瑟从我手中救了出来。


    9 当时，我去了示剑，要给羊群送药膏[c]；流便去了多坍，我们所需的物品和全部存货都在那里。我兄弟犹大来到那里，把约瑟卖给了以实玛利人。


    10 流便听见这事，就很忧伤，因为他本想把约瑟带回父亲那里。


    11 我听见以后，却向犹大发烈怒，因为他让约瑟活着离开了。我一连五个月向他怀怒。


    12 主使我受挫，阻止我行动[d]；因为我的右手有七天半枯干了[e]。


    13 孩子们，我这才知道，这事临到我是因为约瑟。于是我回心转意，哭泣着向主上帝祷告，求他使我的手复原，也使我远离一切污秽、嫉妒和愚妄。


    14 因为我知道，我嫉妒我兄弟约瑟，便在主面前，并对我父亲雅各，图谋了一件恶事。'
