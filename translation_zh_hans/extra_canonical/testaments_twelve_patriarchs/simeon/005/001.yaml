  source_fidelity: 原译准确传达了约瑟外貌俊美、其内没有邪恶，以及面容显露内在骚动的因果论述。惟“心灵的扰乱会从脸上显露出来”将原文以“脸”为主语的表达转换为“扰乱”显露，意思大致相同，但可更直接反映τὸ πρόσωπον δηλοῖ（脸显明）。
  naturalness: “外表好看”较口语化，且与本句格言式、庄重的语域略不协调；“形貌俊美，容颜秀美”自然并保留原文两个近义而有区分的外貌描述。“心灵的骚动”也比“心灵的扰乱”更合现代汉语搭配。
  terminology: “邪恶”恰当保留πον​​ηρόν的宽泛道德含义；“心灵”适合此处人的内在状态，不引入特定神学含义。
