base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/001.yaml
  text: Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.
translation:
  language: zh_hans
  text: 因此，约瑟形貌俊美，容颜秀美，因为没有任何邪恶住在他里面；因为脸会显露出心灵的骚动。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει
  choice: 容貌俊美
  rationale: 保留“形貌俊美”的意思，同时采用自然、庄重的现代汉语表达。
- source_word: καλὸς τῇ ὄψει
  choice: 外表好看
  rationale: 与前一短语形成近义并列，并保留原文分别提到形貌与所见外观的修辞。
- source_word: ἐνοίκησεν ἐν αὐτῷ
  choice: 他里面没有……
  rationale: “住在他里面”直译生硬；此译保留内在存有之意，并符合现代汉语习惯。
- source_word: πονηρόν
  choice: 邪恶
  rationale: 概括道德上的恶，不将其缩窄为某一种罪行或恶念。
- source_word: ταραχῆς τοῦ πνεύματος
  choice: 心灵的扰乱
  rationale: ταραχή指骚动、纷乱或不安；πνεῦμα在此指人的内在心灵。采用“扰乱”以保留其含义范围和略显格言式的张力。
- source_word: τὸ πρόσωπον δηλοῖ
  choice: 会从脸上显露出来
  rationale: 原句字面为“脸显明”；转为自然汉语，同时保留面容表露内在状态的意思。
theological_decisions:
- issue: 外在容貌与内在邪恶之间的因果陈述
  choice: 按原文保留“因为他里面没有任何邪恶”
  alternative: 弱化为“仿佛因为他心里没有恶念”
  rationale: 原文明确使用因果连词ὅτι，并作绝对性陈述；不应因现代读者可能感到张力而擅自缓和。
- issue: πνεῦμα的指向
  choice: 译为“心灵”
  alternative: 译为“灵”或“精神”
  rationale: 语境讨论内在扰乱如何呈现在脸上，“心灵”在现代汉语中最自然，且不额外引入圣灵论含义。
translation_notes:
  register: 采用现代、清楚而略带格言色彩的庄重表达。保留原文“俊美／好看”的近义并列和内在状态显于面容的因果结构；无需脚注。
