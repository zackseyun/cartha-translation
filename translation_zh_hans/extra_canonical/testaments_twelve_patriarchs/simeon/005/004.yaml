source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἑώρακα γὰρ ἐγὼ²⁵ ἐν χαρακτῆρι γραφῆς²⁶ Ἐνώχ, ὅτι οἱ²⁷ υἱοὶ ὑμῶν²⁸ *ἐν πορνείᾳ²⁹ φθαρήσονται, καὶ *τοῖς υἱοῖς Λευὶ³⁰ *ἀδικήσουσιν ἐν ῥομφαίᾳ³¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/004.yaml
  text: For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.
translation:
  language: zh_hans
  text: 因为我曾在以诺的书面记载中看见：你们的子孙必在淫乱中败坏，并要用刀剑侵害利未的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: 在以诺的书面记载中
  rationale: χαρακτήρ 与 γραφή 连用，指书写下来的文字或记载；此译法自然地表达“以诺的文字记载”，同时不把它过度具体化为某一固定书名。
- source_word: οἱ υἱοὶ ὑμῶν
  choice: 你们的子孙
  rationale: 语境指听者后来的后裔；现代汉语用“子孙”比字面的“儿子们”更准确自然。
- source_word: ἐν πορνείᾳ φθαρήσονται
  choice: 必在淫乱中败坏
  rationale: 保留介词 ἐν 的处境性表达，并用“败坏”涵盖 φθείρω 所含的道德腐化与走向毁灭之意，不擅自限定为单纯因果关系。
- source_word: ἀδικήσουσιν ἐν ῥομφαίᾳ
  choice: 要用刀剑侵害
  rationale: ἀδικέω 表示行不义、亏负或伤害；“侵害”适合刀剑语境，又不强行规定具体伤害程度。ῥομφαία 译作概括性的“刀剑”。
- source_word: τοῖς υἱοῖς Λευὶ
  choice: 利未的子孙
  rationale: 此处指利未的后裔或支派成员，译为“子孙”符合现代汉语及族裔语境。
theological_decisions:
- issue: φθαρήσονται 所表达的是道德败坏还是最终毁灭
  choice: 译作“败坏”，保留道德腐化并可能走向毁灭的语义张力
  alternative: 毁灭／堕落
  rationale: 原词可涵盖腐坏、败坏及毁灭；本句与 πορνεία 连用时，“败坏”最能兼顾语境而不把含义缩窄。
- issue: “以诺的书面记载”是否特指一部定名为《以诺书》的作品
  choice: 不直接采用书名号
  alternative: 在《以诺书》中
  rationale: 希腊文是“以诺的书写／记载”而非明确书名；保持源文表述可避免作超出文本的文献身份判断。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“因为我曾……看见”保留 γάρ 的承接说明和完成时态色彩；“必……并要……”呈现预告语气。
