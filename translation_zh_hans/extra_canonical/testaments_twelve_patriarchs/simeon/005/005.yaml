base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/005.yaml
  text: But they will not be able to stand against Levi, because he will wage the Lord’s war and will defeat your whole camp.
translation:
  language: zh_hans
  text: 但他们不能抵挡利未，因为他必打主的仗，击败你们全营。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全”所对应的希腊词在本版原文中标有文本不确定性。
    reason: 原文以编辑符号⌜πᾶσαν⌝标示该词；正文保留该读法，同时提示其文本状态。
  - marker: b
    text: “营”也可译作“军营”或“军队”。
    reason: 希腊词παρεμβολή可指军营，也可借指驻扎成营的军队；“全营”保留这种语义范围。
lexical_decisions:
- source_word: ἀντιστῆναι
  choice: 抵挡
  rationale: 表达“站立抗拒、与之对抗”的意思，既自然，也保留军事语境。
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: 打主的仗
  rationale: 以现代汉语自然表达同源宾语结构“争战一场战争”，同时保留“战争属于主”的属格关系。
- source_word: νικήσει
  choice: 战胜
  rationale: 准确表达取得胜利、击败对方的含义。
- source_word: παρεμβολήν
  choice: 营垒
  rationale: 该词可指军营，也可转指驻营的军队；“营垒”保留营地意象，并符合本句军事语境。
theological_decisions:
- issue: πόλεμον Κυρίου中属格的关系
  choice: 主的仗
  alternative: 为主争战
  rationale: 原文可自然理解为“主的战争”；译作“主的仗”避免把属格明确限定为受益或代理关系，从而不额外解释利未如何代表主。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“打主的仗”比“进行主的战争”自然，也保留原文的军事意象；“营垒”与前面的“打仗、战胜”形成连贯语域。
