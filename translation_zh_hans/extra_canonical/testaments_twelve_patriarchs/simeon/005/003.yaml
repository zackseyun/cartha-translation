base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/003.yaml
  text: Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.
translation:
  language: zh_hans
  text: 所以，你们要谨防淫乱，因为淫乱是众恶之母，使人与上帝隔绝，并使人亲近彼列。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”是古代犹太文献中代表邪恶、与上帝敌对者的名称。
    reason: 现代普通读者可能不熟悉此专名；脚注提供最低限度的识别信息，而不在正文中添加原文没有的称号。
lexical_decisions:
- source_word: Φυλάξασθε
  choice: 你们要谨防
  rationale: 中间语态命令式表达主动警戒并保护自己的意思；“谨防”自然、庄重，也保留劝诫力度。
- source_word: πορνεία
  choice: 淫乱
  rationale: 该词广指不合正当伦理秩序的性行为；“淫乱”比仅指交易性行为的“卖淫”更符合此处范围，并在两次出现时保持一致。
- source_word: μήτηρ τῶν κακῶν
  choice: 众恶之母
  rationale: 保留希腊文的母亲隐喻和复数“诸恶”，用简洁自然的汉语表达其滋生多种恶事之意。
- source_word: χωρίζουσα ἀπὸ τοῦ θεοῦ
  choice: 使人与上帝隔绝
  rationale: 分词在语法上修饰“淫乱”，但未明说被隔绝者；汉语补出泛指的“人”，避免误读为淫乱本身与上帝隔绝。
- source_word: προσεγγίζουσα τῷ Βελίαρ
  choice: 使人亲近彼列
  rationale: 与前一分词构成平行结构；“亲近”贴合趋近之义，并保留专名“彼列”。
theological_decisions:
- issue: 淫乱与上帝及彼列之间关系的施事和受事
  choice: 译作淫乱“使人与上帝隔绝，并使人亲近彼列”
  alternative: 直译为“与上帝隔绝，并亲近彼列”
  rationale: 希腊文两个阴性分词的语法主语都是“淫乱”，但其作用对象省略。补出泛指“人”可在现代汉语中澄清句法，同时不限定为某一特定群体，也不添加超出原文的教义解释。
- issue: Βελίαρ的身份称谓
  choice: 音译为“彼列”而不加“魔鬼”等解释性同位语
  alternative: 译作“魔鬼彼列”或“邪恶者”
  rationale: 原文使用专名且未附称号；保留专名可避免替作者消解其人物身份与象征意义上的张力。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体。“所以”承接上文；“谨防”体现命令语气；整体保留“众恶之母”的强烈隐喻及“隔绝—亲近”的对照结构。
