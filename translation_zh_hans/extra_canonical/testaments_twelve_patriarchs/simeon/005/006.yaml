base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/006.yaml
  text: And they will be few in number, being divided among Levi and among Judah, and none from among you will be for leadership, just as our father also prophesied in the blessings.
translation:
  language: zh_hans
  text: 他们人数必很少，分散在利未和犹大中间；你们中间必没有人会成为领袖，正如我们的父亲也曾在祝福中预言过的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοστοί
  choice: 人数必很少
  rationale: 表达人数稀少之意，并使现代汉语自然清楚。
- source_word: ἐπιμεριζόμενοι
  choice: 分散在……中间
  rationale: 该分词有被分配、分散之意；结合两个支派，译为“分散在”比机械地译作“被分割”更自然，同时保留分布于其中的含义。
- source_word: εἰς ἡγεμονίαν
  choice: 作领袖
  rationale: 按其趋向或任职含义处理，表示担任领导地位；避免扩张为特定政治或宗教职衔。
- source_word: ἐν ταῖς εὐλογίαις
  choice: 在祝福的话中
  rationale: 复数“祝福”在此指父亲所宣告的祝福内容；补出“的话”符合汉语习惯，又不限定为某一卷具名文本。
theological_decisions:
- issue: “我们的父亲”所指人物
  choice: 保留“我们的父亲”
  alternative: 明确译为“我们的父亲雅各”
  rationale: 原文未具名；保留原有表达，避免在正文中补入解释。
- issue: 领导权断言的范围
  choice: 译为“你们中间必没有人作领袖”
  alternative: 译为“你们中间必无人掌权”
  rationale: 原文强调出自“你们”的人进入领导地位，但未明确权力性质；“作领袖”较能保留其宽泛含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他们”承接上下文所指群体；分号呈现人数分散与无人成为领袖之间的紧密关系。未添加原文没有的专名或宗派性解释。
