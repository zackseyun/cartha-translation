source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα μου⁹, Ἀγαθύνατε τὰς καρδίας ὑμῶν¹⁰ ἐνώπιον Κυρίου¹¹, καὶ¹² εὐθύνατε τὰς ὁδοὺς ὑμῶν ἐνώπιον τῶν¹³ ἀνθρώπων¹⁴ καὶ ἔσεσθε εὑρίσκοντες χάριν *ἐνώπιον Κυρίου καὶ ἀνθρώπων¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/002.yaml
  text: And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will find favor before the Lord and men.
translation:
  language: zh_hans
  text: 现在，我的孩子们，你们要在主面前使自己的心良善，在人面前使自己的道路正直；这样，你们必在主和人面前蒙恩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留长者对子孙或受教者的亲切称呼，也符合遗训体裁。
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: 使自己的心良善
  rationale: 较直接地呈现使动命令及“心”的伦理内涵，不将其窄化为某一种具体德行。
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: 使自己的道路正直
  rationale: 保留“道路”这一行为与生活方式的隐喻，并传达εὐθύνω的端正、使直之意。
- source_word: ἔσεσθε εὑρίσκοντες χάριν
  choice: 必……蒙恩
  rationale: 用现代汉语自然表达“将会寻得恩惠/好感”；“蒙恩”兼顾神与人的语境，且不额外限定其性质。
- source_word: ἐνώπιον Κυρίου καὶ ἀνθρώπων
  choice: 在主和人面前
  rationale: 保留原文在神与人面前的双重关系，不把“人”泛化或性别化。
theological_decisions:
- issue: χάρις在神与人面前的含义
  choice: 蒙恩
  alternative: 得着喜爱／蒙眷顾
  rationale: 原文同一个χάρις同时关联主与人；译作“蒙恩”保留统一表达和一定语义张力，不分别解释为神恩与人的赞许。
- issue: 伦理命令与结果之间的关系
  choice: 用“这样……必……”表达顺承结果
  alternative: 译成明确的功德交换或救恩条件
  rationale: 原文陈述行为与蒙恩之间的结果关系，但没有展开其神学机制，因此不增添因功称义或盟约条件等解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“使自己的心良善”“使自己的道路正直”略带经训体色彩，以保留希腊文平行结构和道路隐喻；分号呈现两个命令与结果之间的层次。
