  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009/001.yaml
  text: And the sons of Simeon wept for their father. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: zh_hans
  text: 西缅的儿子们为他们的父亲哭泣。他们在埃及，直到他们藉摩西之手离开的日子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: 哀哭
  rationale: 此处指儿子们因父亲去世而哭泣；“哀哭”自然传达丧亲语境。
- source_word: οἱ υἱοὶ Συμεών
  choice: 西缅的众子
  rationale: 忠实表达复数“儿子们”，并采用简洁、庄重的现代汉语措辞。
- source_word: ἦσαν εἰς Αἴγυπτον
  choice: 住在埃及
  rationale: 希腊文直译近于“在埃及”；汉语用“住在”表达持续身处当地，但不额外强调主动留下。
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: 直到……带领他们出去的日子
  rationale: ἐξόδου 指他们离开、出去；结合后面的“借摩西之手”，采用汉语自然的事件表达。
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: 摩西带领他们
  rationale: “在摩西手中／借摩西之手”是施行者或媒介的闪语式表达；译为“摩西带领他们”符合出埃及语境，也比生硬直译更易懂。
theological_decisions:
- issue: “ἐν χειρὶ Μωϋσῆ”中摩西的作用
  choice: 摩西带领他们出去
  alternative: 借摩西之手出去
  rationale: 正文采用自然汉语说明摩西是带领出埃及的人，不扩展为对救赎主体或神学因果的额外断言。
translation_notes:
  register: 采用现代、庄重而通俗的叙事体。“哀哭”保留丧葬语境；第二句避免机械照译“在摩西手中”，以符合现代汉语表达。
