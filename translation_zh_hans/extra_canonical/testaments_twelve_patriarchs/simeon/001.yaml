  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001.yaml
  text: 'A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died. And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up and kissed them[b], and said:'
translation:
  language: zh_hans
  text: '雅各和利亚所生的第二个儿子西缅的遗训


    一　西缅话语的抄本[a]：这些话是他在去世以前对儿子们说的，时在他一生的第一百二十年，也正是他兄弟约瑟去世的时候。


    二　西缅患病时，他的儿子们前来看望他；他鼓起力气，坐起来，亲吻他们[b]，说道：'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抄本”也可译作“记录”或“副本”。
    reason: lexical_alternative
  - marker: b
    text: 译作“亲吻”的希腊语动词带有加强意味，可能表示反复地或深情地亲吻。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 此词指书面复制件或记录；“抄本”保留遗训标题的文献性质，又不把它过度解释为逐字笔录。
- source_word: λόγων
  choice: 所说之话
  rationale: 既保留“话语”的基本含义，也在现代汉语中自然表明这是西缅向众子所作的临终陈说。
- source_word: πρὸ τοῦ ἀποθανεῖν
  choice: 在去世以前
  rationale: 直接表达希腊语不定式结构的时间关系，语气庄重而清楚。
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει τῆς ζωῆς αὐτοῦ
  choice: 那时是他一生的第一百二十年
  rationale: 保留原文正式的纪年方式，不改写成较宽泛的“一百二十岁时”。
- source_word: ἐν ᾧ χρόνῳ
  choice: 也正是……的时候
  rationale: 明确保留原文将西缅临终背景与约瑟去世相联的时间关系。
- source_word: Ἀρρωστοῦντος
  choice: 患病时
  rationale: 简明自然地表达属格独立结构所交代的背景状况。
- source_word: ἐπισκέψασθαι
  choice: 前来看望
  rationale: 符合亲属探视病人的语境，并自然传达关怀意味。
- source_word: ἐνισχύσας
  choice: 振作起精神
  rationale: 表达病中的西缅勉力恢复力量以便坐起说话；兼顾身体用力和精神振作，而不把含义限定于其中一面。
- source_word: ἐκάθισε
  choice: 坐起身来
  rationale: 病榻探视的上下文支持“坐起”这一自然汉语表达，但不增添原文没有的床榻细节。
- source_word: κατεφίλησεν
  choice: 亲吻
  rationale: 保留基本动作；该复合动词可能含反复或深情亲吻的加强意味，另以脚注说明，避免正文过度具体化。
theological_decisions:
- issue: 西缅临终陈说与约瑟去世相联系的年代说明
  choice: 按现有希腊文本，将两项时间说明都保留在叙事框架中
  alternative: 把约瑟去世的说明视为后加评注，或为求顺畅而省略、合并
  rationale: 所给希腊文本将此句作为标题和开篇叙事的一部分；译文不作未经文本证据支持的删节或调和。
- issue: “雅各和利亚的次子西缅”中亲属关系的表达
  choice: 照标题直译为“雅各和利亚的次子”
  alternative: 改写为“雅各的次子、利亚的儿子”以消除汉语可能产生的范围歧义
  rationale: 原文属格结构同时连接雅各和利亚，并称西缅为“第二个儿子”；正文保留其简洁和潜在关系范围，不擅自替原文细分。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。标题保留古代遗训文献的正式风格；正文按原文分为第一章第1—2节。使用“去世”“患病”“看望”等现代常用词，避免文言化；同时以“第一百二十年”等表达保留原文纪年语气。所有脚注标记均已置于正文相应位置。
