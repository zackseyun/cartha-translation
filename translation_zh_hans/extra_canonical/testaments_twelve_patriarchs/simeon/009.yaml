base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009.yaml
  text: And the sons of Simeon wept for their father[c][b][a]. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: zh_hans
  text: 西缅的儿子们为他们的父亲哀哭。他们在埃及，直到他们经摩西之手离开的日子[a]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开”也可译作“出埃及”。
    reason: lexical_alternative
  - marker: c
    text: 抄本接下来直接转入下一部作品的标题：“利未的遗训——雅各和利亚的第三个儿子。”该标题不属于《西缅遗训》第9章正文。
    reason: textual_variant
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: 哀哭
  rationale: κλαίω在此表示因父亲去世而哭泣、哀恸。“哀哭”既保留可感的哭泣动作，也符合遗训文学庄重的语体，却不把它限定为正式丧礼。
- source_word: υἱοὶ Συμεών
  choice: 西缅的儿子们
  rationale: υἱοί明确指“儿子们”；在族长家系语境中不宜泛化为“孩子们”。
- source_word: εἰς Αἴγυπτον
  choice: 住在埃及
  rationale: εἰς通常有“进入”之义，但与ἦσαν及延续至某时的表达连用时表示所在地和持续居留。现代汉语用“住在埃及”比直译“到埃及”自然，也不误作移动方向。
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: 直到他们离开的日子
  rationale: ἔξοδος在此可指一般的“离开、出去”，同时明显暗含以色列人出埃及的事件。正文保留普通名词意义，不把原文未明说的专名强加进去。
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: 借着摩西的手
  rationale: 保留圣经式“借着某人的手”这一施事惯用语；它表达事情经由摩西而成，并维持原文的经文语感。
theological_decisions:
- issue: 是否把ἐξόδου专名化为“出埃及”
  choice: 正文译为“离开”，脚注说明也可译为“出埃及”
  alternative: 正文译作“出埃及的日子”
  rationale: 希腊文使用普通名词，并无书名或专名标记；摩西的出现使历史所指仍然清楚。这样既不压低出埃及事件的暗示，也不把暗示提升为原文没有明示的专名。
- issue: 如何处理ἐν χειρὶ Μωϋσῆ的圣经惯用语
  choice: 保留为“借着摩西的手”
  alternative: 意译为“在摩西带领下”或“借着摩西”
  rationale: 原表达侧重经由摩西成就此事，未单独明说“领导”。保留“手”的意象更可核对，也避免添入较窄的解释；脚注补明其含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀哭”保持遗训结尾的肃穆感；第二句用“一直住在”自然呈现ἦσαν与“直到”构成的持续状态。为避免“借着摩西的手”在汉语中错误地直接修饰“日子”，加入“那是……实现的”以明确施事关系，同时保留原文惯用意象。
