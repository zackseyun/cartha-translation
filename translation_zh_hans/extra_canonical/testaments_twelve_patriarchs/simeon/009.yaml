  naturalness: “那是借着摩西的手实现的”在现代汉语中不自然，也模糊了摩西与离开行为的关系。“经摩西之手”保留汉语圣经语体，同时由脚注说明其惯用义，较为自然、庄重。
  terminology: “西缅”“儿子们”“哀哭”均适合此处的家系与遗训语境。“出埃及”作为脚注中的可选译法合宜；正文保留“离开”以不把普通名词专名化。
