revisions:
- from: 西缅的儿子们为父亲哀哭。他们一直住在埃及，直到他们离开的日子[a]，那是借着摩西的手[b]实现的。[c]
  to: 西缅的儿子们为他们的父亲哀哭。他们在埃及，直到他们经摩西之手离开的日子[a]。[c]
  rationale: 删除原文没有的“那是……实现的”，并将“经摩西之手”直接置于“离开”所指的行动中，以保留希腊文的施事惯用语及其语义范围。将“住在”改为“在”，更贴近ἦσαν的存在/所在地陈述。脚注b保留，但其锚点应附于正文的“经摩西之手”；为使所有脚注均有明确锚点，正文应写作：“他们在埃及，直到他们经摩西之手[b]离开的日子[a]。[c]”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:24:21Z'
