- from: 现在，我的孩子们，看哪，我快要死了。我实实在在地告诉你们：如果你们不谨防虚假和愤怒的灵，不爱真理和忍耐，就必灭亡。[a]
  to: 现在，我的孩子们，看哪，我正在死去；我实实在在地告诉你们：如果你们不谨防虚假和愤怒的灵，也不爱真理和忍耐，就必灭亡。[a]
  rationale: 将条件句改为“如果你们不……，也不……”，使汉语明确表达原文两个并列的正面要求：保守自己远离虚假和愤怒的灵，并爱真理和忍耐。其余措辞及脚注可保留；“正在死去”对应 ἀποθνῄσκω 的现在时，保留说话者死亡临近/正在临终的语气。
