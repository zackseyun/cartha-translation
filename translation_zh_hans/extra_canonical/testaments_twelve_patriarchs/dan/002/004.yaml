base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/004.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry.
translation:
  language: zh_hans
  text: 现在，我的孩子们，看哪，我正在死去；我实实在在地告诉你们：如果你们不谨防虚假和愤怒的灵，也不爱真理和忍耐，就必灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文材料按章保存，尚未完成逐节对齐；因此，这一希腊文句段未必与传统节号“2:4”完全对应。本译文依所提供的希腊文句段翻译。
    reason: 提醒读者原始资料存在节号对齐的不确定性，并说明本译文依据所提供的希腊文句段，而非内容不同的英文咨询文本。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文用于引起注意的郑重语气，同时符合庄重的现代汉语表达。
- source_word: φυλάξητε ἑαυτοὺς ἀπό
  choice: 谨防
  rationale: 表达“守护自己、远离”的含义，比机械译作“保守自己脱离”更自然。
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: 虚假和愤怒的灵
  rationale: 保留原文以一个“灵”统摄“虚假”和“愤怒”的句法可能性，不把“灵”弱化为单纯的性情或倾向。
- source_word: τὴν μακροθυμίαν
  choice: 忍耐
  rationale: 该词可指恒久忍耐、克制怒气；此处与“愤怒”对照，“忍耐”简洁且涵盖原义。
- source_word: ἀπολεῖσθε
  choice: 就必灭亡
  rationale: 保留将来时警告的确定力度；不擅自限定为肉身死亡、道德败坏或末世审判。
theological_decisions:
- issue: “灵”是人格化的邪灵，还是支配人的内在倾向
  choice: 保留“虚假和愤怒的灵”
  alternative: 虚假和愤怒的恶习／倾向
  rationale: πνεῦμα 本身容许不止一种理解；直译“灵”可保留文本的神学张力，避免先行裁定其本体性质。
- issue: 灭亡的具体性质
  choice: 不加限定地译作“灭亡”
  alternative: 遭毁灭／失去救恩／死亡
  rationale: 原文没有说明灭亡的层面或时间，因此不引入超出文本的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留临终劝诫的直接称呼、郑重宣告和条件式警告。“实实在在地”传达ἐν ἀληθείᾳ的强调，但不添加宗派性术语。
