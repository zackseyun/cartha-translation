review_pass:
  verdict: revise
  source_fidelity: 译文总体对应所给希腊文：保留了临终说话者、对“孩子们”的称呼、远离虚谎与愤怒之灵、爱真理与忍耐，以及灭亡的警告。惟条件句的否定辖域处理不准确：ἐὰν μὴ 后接两个以 καί 连接的虚拟式动词，意为“若不……并且……／除非……又……”，其后果涵盖未能做到任一项的情形；原译将两个动词分别否定，容易变成只有同时不防备且不爱才灭亡。
  naturalness: 原文中文庄重、通顺。“看哪”适合保留 ἰδού。改用“除非……否则……”能自然且明确地表达原文条件结构。
  terminology: “虚谎”“愤怒的灵”“真理”“忍耐”“灭亡”均可接受，并保留 πνεῦμα 的解释空间。将“防备”调整为“保守自己远离”更充分反映 φυλάξητε ἑαυτοὺς ἀπό 的自我守护及远离对象的结构。
  issues:
  - severity: medium
    issue: 条件句把“爱真理和忍耐”另加否定。
    rationale: 希腊文为 ἐὰν μὴ φυλάξητε…καὶ ἀγαπήσητε，不是“若不防备……且不爱……”。应表达“除非既保守自己远离恶，又爱真理与忍耐；否则必灭亡”，以免缩窄警告适用范围。
  revised_text: 现在，我的孩子们，看哪，我正在死去；我实在告诉你们：除非你们保守自己远离虚谎和愤怒的灵，又爱真理和忍耐，否则你们必灭亡。
