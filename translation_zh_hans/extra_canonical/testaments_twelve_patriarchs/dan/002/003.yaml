source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/003.yaml
  text: This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath.
translation:
  language: zh_hans
  text: 现在，我的孩子们，看哪，我正在死去；我实在告诉你们：除非你们保守自己远离虚谎和愤怒的灵，又爱真理和忍耐，否则你们必灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留临终训诫中亲密而庄重的称呼。
- source_word: φυλάξητε ἑαυτούς ἀπό
  choice: 防备
  rationale: 表达主动守护自己、远离某种有害势力的含义，现代汉语简洁自然。
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: 虚谎和愤怒的灵
  rationale: 按希腊语结构保留单数“灵”统摄“虚谎”和“愤怒”的可能性，不擅自拆成两个灵。
- source_word: μακροθυμίαν
  choice: 忍耐
  rationale: 此处指面对刺激时持久克制、不轻易发怒；“忍耐”通俗而庄重。
- source_word: ἀπολεῖσθε
  choice: 就必灭亡
  rationale: 保留原文强烈的毁灭性警告，不弱化为一般的失败或受害。
theological_decisions:
- issue: “虚谎和愤怒的灵”是否指人格化灵体
  choice: 保留“灵”的直译，不进一步界定
  alternative: 译作“虚谎与愤怒的心态”或明确译成某个邪灵
  rationale: 原文使用 πνεῦμα，但本句本身不足以判定是人格化灵体、支配性力量还是内在倾向；直译可保存其神学张力。
- issue: 条件句中“防备”与“爱”的逻辑关系
  choice: 译为两个并列的否定条件：“若不防备……，不爱……”
  alternative: 只让“若不”管辖“防备”，把“爱”处理为另一个独立命令
  rationale: 希腊语将两个动词置于同一条件结构中；中文补出第二个“不”，清楚表达若未同时远离恶并爱真理与忍耐，就将灭亡。
translation_notes:
  register: 采用现代、庄重而易懂的临终训诫语体。“看哪”保留 ἰδού 的郑重提示作用；“我快要死了”自然表达现在时 ἀποθνῄσκω 在临终语境中的迫近意义。译文仅依据所给希腊文可见内容，不采用与该段不相符的英文咨询层后续材料。
