base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/002.yaml
  text: 'Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing.'
translation:
  language: zh_hans
  text: 现在，我的孩子们，你们看，我快要死了；我实在告诉你们：除非你们保守自己远离虚谎与愤怒之灵，并且爱真理和忍耐，否则你们必灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留临终训诫中的亲密称呼；现代汉语自然，也符合庄重语体。
- source_word: ἰδοὺ ἐγὼ ἀποθνῄσκω
  choice: 看哪，我就要死了
  rationale: “看哪”保留提示听者注意的语气；现在时结合临终语境译作“就要死了”，比字面“我正在死”更自然。
- source_word: ἐν ἀληθείᾳ λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 表达说话者郑重确认话语真实，避免增添原文没有的誓言意味。
- source_word: φυλάξητε ἑαυτούς ἀπό
  choice: 防备
  rationale: 涵盖“守住自己、远离”的含义；在警戒有害属灵影响的语境中简洁自然。
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: 虚谎和愤怒的灵
  rationale: 保留“灵”以及两个属格成分的紧密联系，不擅自把“愤怒”完全拆成与“灵”无关的第二个对象。
- source_word: τὴν μακροθυμίαν
  choice: 恒忍
  rationale: 同时传达长久忍耐与克制怒气的意味；“恒忍”庄重简明，并与本句的“愤怒”形成恰当对照。
- source_word: ἀπολεῖσθε
  choice: 就必灭亡
  rationale: 保留将来式警告的强度及“毁灭、灭亡”的严肃含义，不弱化为一般性的受害或失败。
theological_decisions:
- issue: “灵”与“虚谎、愤怒”的句法关系
  choice: 译作“虚谎和愤怒的灵”，让“灵”统摄两个属格成分
  alternative: “虚谎的灵和愤怒”
  rationale: 希腊文只有一个“灵”，后接“虚谎”和带冠词的“愤怒”；结构允许把二者理解为与该“灵”相关的并列成分。当前译法保留这种紧密关系，同时不进一步界定“灵”是人格性存在、内在倾向还是支配力量。
- issue: 条件句中防备与爱的关系
  choice: 译作“如果……不防备……，也不爱……，就必灭亡”
  alternative: 将其中一项解释为另一项的结果或附属条件
  rationale: 原文并列“防备”与“爱”两个虚拟式动词；译文保留二者共同构成警告条件，不另行建立原文未明说的因果次序。
translation_notes:
  register: 采用现代、庄重而易懂的临终训诫语体。译文以所给希腊文为直接依据；该希腊文内容与所附英文POB段落不一致，因此未沿用英文段落，而按原文呈现本节。
