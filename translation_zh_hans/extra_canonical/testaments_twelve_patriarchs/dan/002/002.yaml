revisions:
- from: 现在，我的孩子们，看哪，我就要死了。我实在告诉你们：如果你们不防备虚谎和愤怒的灵，也不爱真理和恒忍，就必灭亡。
  to: 现在，我的孩子们，你们看，我快要死了；我实在告诉你们：除非你们保守自己远离虚谎与愤怒之灵，并且爱真理和忍耐，否则你们必灭亡。
  rationale: 修订仅澄清条件句的并列逻辑，并改善现代汉语的术语自然度；“虚谎与愤怒之灵”保留希腊文单数“灵”与两个属格之间未被进一步界定的关系。未采纳不相符的英文POB审计文本。
