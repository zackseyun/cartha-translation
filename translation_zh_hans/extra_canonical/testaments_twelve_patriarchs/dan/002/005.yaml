    rationale: 草稿作“你们若不谨防……，不喜爱真理和忍耐，就必灭亡”，将“不”直接加在“喜爱”上，意思成为不喜爱真理和忍耐才会灭亡。原文 ἐὰν μὴ φυλάξητε……καὶ ἀγαπήσητε……应译为“除非你们谨防……并且喜爱……，否则必灭亡”，即两个正面要求共同构成免于灭亡的条件。
