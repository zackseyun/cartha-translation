  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/005.yaml
  text: If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.
translation:
  language: zh_hans
  text: 如今，我的孩子们，看啊，我快要死了；我实在告诉你们：除非你们谨防虚假和愤怒的灵，并且喜爱真理和忍耐，否则你们必灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文用于引起注意的庄重语气，同时符合经文体裁。
- source_word: φυλάξητε ἑαυτούς ἀπό
  choice: 谨防
  rationale: 表达“守护自己、远离”的反身含义，并使现代汉语自然凝练。
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: 虚假和愤怒的灵
  rationale: 按原文单数“灵”及两个属格修饰语翻译，不擅自拆分为两个灵。
- source_word: μακροθυμίαν
  choice: 忍耐
  rationale: 该词可指恒忍、宽容或不轻易发怒；此处与“愤怒”相对，“忍耐”既自然又保留较宽语义。
- source_word: ἀπολεῖσθε
  choice: 就必灭亡
  rationale: 保留将来时所表达的严厉后果，不弱化为一般性的受损或失败。
theological_decisions:
- issue: 否定词 μή 对并列动词 φυλάξητε 与 ἀγαπήσητε 的作用范围
  choice: 译作“若不谨防……，不喜爱……，就必灭亡”
  alternative: 直译为“若不谨防……而又喜爱……，就必灭亡”
  rationale: 在 ἐὰν μή 引导的条件句中，否定语义自然涵盖相互配合的两个要求；按正面条件理解即“除非既谨防……又喜爱……”。此译避免造成“喜爱真理和忍耐也会导致灭亡”的误解。
- issue: “虚假和愤怒的灵”是否人格化
  choice: 保留“灵”，不进一步解释其为邪灵、倾向或心态
  alternative: 译作“虚假与愤怒的邪灵”或“虚假与愤怒的心态”
  rationale: 原文 πνεῦμα 本身留有一定解释空间；不添加“邪”或心理化措辞，以保留其神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我的孩子们”保留临终训诫的亲密称呼；“我快要死了”自然表达现在时 ἀποθνῄσκω 在当前语境中的临近死亡；整体保持警告句的简洁和力度。
