id: T12P.DAN.5.9
reference: Testament of Dan 5:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὕτως⁷⁷ ἐπιστρέψαντες⁷⁸ πρὸς Κύριον ἐλεηθήσεσθε⁷⁹ καὶ ἄξει ὑμᾶς⁸⁰ εἰς τὸ ἁγίασμα αὐτοῦ *καὶ δώσει⁸¹ ὑμῖν εἰρήνην⁸².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/009.yaml
  text: And so, having returned to the Lord, you will receive mercy, and he will bring you into his sanctuary and give you peace.
translation:
  language: zh_hans
  text: 这样，你们回转归向主之后，就必蒙怜悯；他必领你们进入他的圣所，赐给你们平安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: 这样
  rationale: 承接上文并表达“如此、这样”的结果或方式，保持原文连接语的简洁。
- source_word: ἐπιστρέψαντες πρὸς Κύριον
  choice: 回转归向主之后
  rationale: 以“回转归向”表达属灵与方向性的转回；“之后”体现先行的过去时分词关系，但不把它强化为严格的时间条件句。
- source_word: ἐλεηθήσεσθε
  choice: 必蒙怜悯
  rationale: 保留被动语态及其神学含义，不明说施怜悯者，同时中文语境自然指向主。
- source_word: ἄξει ὑμᾶς εἰς τὸ ἁγίασμα αὐτοῦ
  choice: 他必领你们进入他的圣所
  rationale: “领……进入”准确表达ἄξει与εἰς的动态方向；“圣所”对应ἁγίασμα，在此比泛称“圣地”更贴近原文。
- source_word: δώσει ὑμῖν εἰρήνην
  choice: 赐给你们平安
  rationale: “赐给”符合神向人给予的庄重语域；“平安”保留εἰρήνη可能涵盖安宁、和平与完整福祉的宽度。
theological_decisions:
- issue: 回转与蒙怜悯之间的关系
  choice: 用“回转归向主之后，就必蒙怜悯”保留分词所表达的先行关系
  alternative: “你们若回转归向主，就必蒙怜悯”
  rationale: 原文使用分词ἐπιστρέψαντες，并非明示条件句；译文避免增添“若”而将其明确条件化，同时以自然中文呈现行动与结果的次序。
- issue: 神圣被动语态
  choice: 译作“蒙怜悯”
  alternative: “主必怜悯你们”
  rationale: 保留ἐλεηθήσεσθε的被动形式及其含蓄性，不把施事者在语法上显明化。
- issue: “圣所”的所指
  choice: 保留为“他的圣所”
  alternative: 解释为圣殿、圣地或末世性的圣所
  rationale: 原文没有进一步界定，不在正文中替读者消除可能的历史或末世语境张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“回转归向”略具经文语体但仍属现代常用宗教表达；两个“必”呈现将来陈述的确定语气，后半句省去重复主语，使行文流畅。
