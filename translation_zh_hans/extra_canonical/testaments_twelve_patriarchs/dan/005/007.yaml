  text: Καὶ *οἱ ἐμοὶ υἱοὶ⁶¹ συνεγγίζοντές⁶² εἰσι τοῦ⁶³ Λευὶ καὶ συναμαρτάνοντες⁶⁴ αὐτοῖς⁶⁵ ἐν πᾶσιν. *οἱ δὲ υἱοὶ τοῦ⁶⁶ Ἰούδα ἔσονται ἐν πλεονεξίᾳ ἁρπάζοντες⁶⁷ ἀλλότρια ὡς⁶⁸ λέοντες.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/007.yaml
  text: And my sons are drawing near to Levi and sinning together with them in all things. But the sons of Judah will be in greed, snatching what belongs to others like lions.
translation:
  language: zh_hans
  text: 我的众子正在亲近利未，在一切事上与他们一同犯罪；但犹大的众子必陷于贪婪，像狮子一样抢夺别人的财物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεγγίζοντες
  choice: 正亲近
  rationale: 以进行性表达保留现在分词的时态面貌；“亲近”自然且不过度解释这种接近属于结盟、效法还是实际靠近。
- source_word: συναμαρτάνοντες αὐτοῖς
  choice: 与他们一同犯罪
  rationale: 直接呈现共同犯罪之意，并保留复数代词与利未群体之间原文略显张力的对应。
- source_word: ἐν πλεονεξίᾳ
  choice: 陷于贪婪
  rationale: 表达处在贪婪支配之下的状态；比单说“贪婪”更贴近介词结构，同时符合现代汉语。
- source_word: ἁρπάζοντες ἀλλότρια
  choice: 抢夺别人的财物
  rationale: ἀλλότρια指属于他人的东西；补出“财物”使中文清楚，但不将其限缩为某一类产业。
- source_word: ὡς λέοντες
  choice: 像狮子一样
  rationale: 保留原文直喻及复数形象，不增添“凶猛”等解释性措辞。
theological_decisions:
- issue: “我的众子”亲近利未的时间指向
  choice: 按现在分词译为“正亲近……一同犯罪”
  alternative: “将要亲近……将要一同犯罪”
  rationale: 现存希腊文使用现在分词，而后半句明确使用将来时ἔσονται；译文保留这种时态对比。
- issue: 利未及其群体是否被明确判定为全面犯罪
  choice: 保留“在一切事上与他们一同犯罪”的原文陈述
  alternative: 解释为只在若干行为上效法利未
  rationale: 原文ἐν πᾶσιν语气广泛，不宜出于神学协调而弱化；同时不补充犯罪的具体内容。
- issue: 犹大众子的πλεονεξία含义
  choice: 译作“贪婪”
  alternative: “贪财”或“强取豪夺”
  rationale: πλεονεξία范围可包括贪欲和侵占欲；“贪婪”保留较宽语义，后面的抢夺行为再具体说明其表现。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“众子”保留族长遗训文本的群体与后裔色彩；分号呈现两支后裔之间的对照。原文无须设置文本或释义脚注，故正文不加脚注标记。
