source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '[᾿Ανέγνων γὰρ⁵⁰ ἐν βίβλῳ Ἐνὼχ⁵¹ τοῦ δικαίου ⌈καὶ ἔγνων⌉¹⁵² ὅτι ὁ⁵³ ἄρχων ὑμῶν⁵⁴ ὁ Σατανᾶς ἐστιν⁵⁵ *καὶ ὅτι⁵⁶ τὰ πνεύματα τῆς πονηρίας⁵⁷ καὶ τῆς ὑπερηφανίας †ὑπακούσονται⁵⁸ *τοῦ παρεδρεύειν⁵⁹ τοῖς υἱοῖς Λευί, τοῦ ποιεῖν⁶⁰ αὐτοὺς ἐξαμαρτάνειν ἐνώπιον Κυρίου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/006.yaml
  text: For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and pride will obey in attending the sons of Levi, to make them sin before the Lord.
translation:
  language: zh_hans
  text: 因为我曾在义人以诺的书中读过，也得知你们的统治者就是撒但；邪恶和骄傲的诸灵必顺从，侍立在利未的子孙身旁，使他们在主面前犯罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必顺从，侍立在利未的子孙身旁”所对应的希腊文句法较为生硬；“顺从”的对象没有明说，也可理解为“必听命而侍立在利未子孙身旁”。
    reason: 源文本在ὑπακούσονται与τοῦ παρεδρεύειν的衔接处带有校勘标记，且顺从对象未明说；脚注保留该文本及句法上的不确定性。
lexical_decisions:
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: 义人以诺
  rationale: 属格短语自然理解为对以诺的称谓；中文采用凝练、庄重的同位表达。
- source_word: ὁ ἄρχων ὑμῶν
  choice: 你们的统治者
  rationale: ἄρχων 指掌权者或统治者；译为“统治者”既保留支配意味，也避免加入原文没有的特定头衔。
- source_word: τὰ πνεύματα τῆς πονηρίας καὶ τῆς ὑπερηφανίας
  choice: 邪恶和骄傲的诸灵
  rationale: 保留两个属格抽象名词所描述的灵界力量，并用“诸灵”体现复数。
- source_word: ὑπακούσονται
  choice: 必听命
  rationale: 直接保留该动词“服从、听从”的核心语义，不把它弱化为单纯的陪侍。
- source_word: παρεδρεύειν τοῖς υἱοῖς Λευί
  choice: 伺候利未的子孙
  rationale: παρεδρεύω 有在旁守候、侍立之意；“伺候”在此表达这些灵听命而伴随、服事他们的负面语境。
- source_word: ἐνώπιον Κυρίου
  choice: 在主面前
  rationale: 采用圣经中文中自然而庄重的对应语，保留犯罪发生于主鉴察之下的意味。
theological_decisions:
- issue: “你们的统治者”与撒但的关系
  choice: 就是撒但
  alternative: 是撒但
  rationale: 定冠词结构 ὁ ἄρχων ὑμῶν ὁ Σατανᾶς 将二者同定；“就是”清楚表达同位关系，但不扩展其统治范围。
- issue: 诸灵如何与利未子孙发生关系
  choice: 必听命，伺候利未的子孙
  alternative: 必顺从去侍立在利未子孙身旁
  rationale: 原文 ὑπακούσονται 与 τοῦ παρεδρεύειν 的句法/文本传承较为生硬；正文保留“听命”和“在旁伺候”两层意义，不明确补出它们听命于谁。
- issue: 使利未子孙犯罪的施事关系
  choice: 使他们在主面前犯罪
  alternative: 诱使他们得罪主
  rationale: ποιεῖν αὐτοὺς ἐξαμαρτάνειν 明示使役关系；“在主面前”严格保留 ἐνώπιον Κυρίου，避免改释为以主作直接宾语。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“义人以诺”“利未的子孙”“在主面前”保持经传语体；不补明诸灵究竟听命于撒但还是其他权柄，以免消解原文歧义。
