  text: Love the Lord all your life, and one another with a true heart.
translation:
  language: zh_hans
  text: 你们要一生爱主，也要以真诚的心彼此相爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: 要……爱
  rationale: 采用自然的现代汉语命令表达，保留希腊语复数祈使语气。
- source_word: τὸν Κύριον
  choice: 主
  rationale: “主”是 Κύριος 在圣经语境中的标准、庄重译法。
- source_word: ἐν πάσῃ τῇ ζωῇ ὑμῶν
  choice: 一生
  rationale: 自然简洁地表达“在你们全部生命中／一生之中”的持续范围；主语“你们”已在句首明示。
- source_word: ἀλλήλους
  choice: 彼此相爱
  rationale: 承接前面的 Ἀγαπήσατε；汉语中补出“相爱”，使并列结构清楚自然。
- source_word: ἐν ἀληθινῇ καρδίᾳ
  choice: 以真诚的心
  rationale: ἀληθινός 在此描述内心真实、不虚假的状态；“真诚”比机械的“真实”更符合现代汉语搭配。
theological_decisions:
- issue: “爱”这一命令是否同时支配“主”和“彼此”
  choice: 译为“爱主，也要……彼此相爱”
  alternative: 把后半句处理成独立而省略谓语的短语
  rationale: 希腊文中 ἀλλήλους 与 τὸν Κύριον 同受句首祈使动词支配；汉语补出谓语可清楚呈现这一句法关系，不增添教义内容。
- issue: “以真诚的心”的修饰范围
  choice: 按就近关系修饰“彼此相爱”
  alternative: 理解为同时修饰爱主与彼此相爱
  rationale: 该短语紧随 ἀλλήλους，最自然地与后一个宾语结构相连；原文仍可能容许较宽的语义关联，译文不额外扩张其明确范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一生”比“在你们全部的生命中”自然；“以真诚的心彼此相爱”保持劝诫语气和原文的简洁并列结构。
