source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὴν αἰχμαλωσίαν λήψεται⁸⁹ ἀπὸ τοῦ Βελίαρ, [τὰς ψυχὰς τῶν ἁγίων]⁹⁰, *καὶ ἐπιστρέψει⁹¹ καρδίας⁹² ἀπειθεῖς⁹³ πρὸς Κύριον. καὶ δώσει *τοῖς ἐπικαλουμένοις αὐτὸν⁹⁴ εἰρήνην αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/011.yaml
  text: And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.
translation:
  language: zh_hans
  text: 他必从彼列手中夺回被掳者——就是众圣者的灵魂[a]；他必使悖逆的心转向主，并赐给那些求告他的人永恒的平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “就是众圣者的灵魂”在本节所据希腊文本中以方括号标出，表明这几个字的文本见证存在疑问。
    reason: 原文编辑以方括号标示τὰς ψυχὰς τῶν ἁγίων，出版译文应让读者知悉这一真实的文本问题。
lexical_decisions:
- source_word: τὴν αἰχμαλωσίαν λήψεται ἀπὸ τοῦ Βελίαρ
  choice: 从彼列手中夺回被掳的
  rationale: 保留“掳掠/被掳”意象，并用“从……手中夺回”自然表达 λήψεται ἀπό 所指的解救行动。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 按专名音译，保留其作为邪恶势力之名的文本特征，不另加解释性称号。
- source_word: τὰς ψυχὰς τῶν ἁγίων
  choice: 众圣者的灵魂
  rationale: 直译 ψυχαί 与 ἅγιοι；此短语在版本证据中带括号，故以脚注说明文本状况。
- source_word: καρδίας ἀπειθεῖς
  choice: 悖逆的心
  rationale: ἀπειθής 可指不信、不顺服或悖逆；“悖逆”兼顾拒绝相信与不肯顺服的含义。
- source_word: τοῖς ἐπικαλουμένοις αὐτόν
  choice: 那些求告他的人
  rationale: “求告”准确传达 ἐπικαλέομαι 在宗教语境中呼求、祈求的含义。
- source_word: εἰρήνην αἰώνιον
  choice: 永远的平安
  rationale: 采用自然庄重的现代汉语，保留 αἰώνιος 的持续性与终极意味。
theological_decisions:
- issue: “他”在“求告他”中的指代
  choice: 保留“他”而不明确改写为“主”或前述施行者
  alternative: 译作“求告主的人”或明确为“求告他的那些人”并加解释
  rationale: 希腊文代词 αὐτόν 的语法指代在本句语境中可能引发理解张力；正文不替原文消除这种歧义。
- issue: “被掳的”与“众圣者的灵魂”的关系
  choice: 用破折号表达后者对前者的同位说明
  alternative: 译作“从彼列手中夺走掳物和众圣者的灵魂”
  rationale: 英语审校层将二者理解为同位关系；希腊文括入的短语也自然可作解释，但其文本可靠性另以脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“夺回被掳的”保留原文的俘虏意象；分号呈现两个并列的未来行动。脚注标记已在正文中出现。
