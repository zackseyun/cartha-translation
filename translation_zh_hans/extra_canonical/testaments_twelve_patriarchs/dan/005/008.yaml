  source_fidelity: “因此，你们将同他们一起被掳走；在那里，你们将承受埃及的一切灾祸”准确对应διὰ τοῦτο、σὺν αὐτοῖς、εἰς αἰχμαλωσίαν及πάσας τὰς πληγὰς Αἰγύπτου。末句的ποντηρίας（πον ηρίας）主要指邪恶、恶事或恶行，而非由外部临到人的“祸患”；原译将其后果化，弱化了原文的道德性语义。
  naturalness: “被掳走”“在那里”“承受”均为自然、庄重的现代汉语，适合此类经文。以“列国的一切恶事”直译末句，虽保留原文略显突兀的并列，也仍可通顺理解。
  terminology: “被掳”是恰当的经文历史语域用语。“埃及的一切灾祸”可保留；“列国的一切恶事”较“列国的一切祸患”更准确反映πονηρίαι，且不把它具体化为某种教义性的罪类。
