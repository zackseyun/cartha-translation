source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ⌈Καὶ⌉⁶⁹ διὰ τοῦτο ἀπαχθήσεσθε⁷⁰ [σὺν αὐτοῖς]⁷¹ *εἰς αἰχμαλωσίαν⁷², κἀκεῖ ἀπολήψεσθε⁷³ *πάσας τὰς πληγὰς Αἰγύπτου⁷⁴ καὶ πάσας τὰς⁷⁵ πονηρίας⁷⁶ τῶν ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/008.yaml
  text: Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.
translation:
  language: zh_hans
  text: 因此，你们将同他们一起被掳到被掳之地；在那里，你们将承受埃及的一切灾祸和列国的一切恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαχθήσεσθε … εἰς αἰχμαλωσίαν
  choice: 将……被掳走
  rationale: 保留被动语态及被带入俘虏境地的含义，同时用现代汉语自然表达。
- source_word: ἀπολήψεσθε
  choice: 将承受
  rationale: 此处指在被掳之地遭受相应的灾祸；“承受”既保留“领受、得到”的语义，又符合负面语境。
- source_word: πληγὰς Αἰγύπτου
  choice: 埃及的一切灾祸
  rationale: πληγή 可指击打、灾殃或灾祸；这里让人联想到埃及诸灾，但原文并未明确限定为某一组特定灾难。
- source_word: πονηρίας τῶν ἐθνῶν
  choice: 列国的一切祸患
  rationale: πονηρία 在复数中可指恶事、邪恶或由恶带来的苦难；本句与“灾祸”并列，译作“祸患”可保留其负面后果，同时不将其收窄为道德罪行。
theological_decisions:
- issue: “埃及的灾祸”是否明确指《出埃及记》的十灾
  choice: 不增译“十灾”
  alternative: 埃及的十灾
  rationale: 原文仅说“埃及的一切灾祸”，虽可能影射出埃及传统，却没有数字“十”；不宜将暗示变成明说。
- issue: “列国的πονηρίαι”应理解为道德邪恶还是所受祸患
  choice: 译为“祸患”，保留灾难语境
  alternative: 列国的一切恶行
  rationale: 与前面的“灾祸”平行，语境偏向被掳后所遭遇的苦难；但该词仍含“恶”的语义背景，因此不作更具体的解释性扩写。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被掳走”符合圣经历史语境，也较“被带入囚禁”自然；分号呈现因果后的两个阶段：被掳与在异地受祸。
