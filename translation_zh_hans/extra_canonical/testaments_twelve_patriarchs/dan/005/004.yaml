source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ οἶδα²⁷ ὅτι ἐν ταῖς²⁸ ἐσχάταις ἡμέραις ἀποστήσεσθε²⁹ τοῦ Κυρίου, καὶ προσοχθιεῖτε³⁰ τῷ³¹ Λευί, καὶ πρὸς τῷ³² Ἰουδὰ³³ παρατάξεσθε³⁴, ἀλλ᾽ οὐ δυνήσεσθε³⁵ πρὸς αὐτούς³⁶. *ἄγγελος γὰρ Κυρίου ὁδηγεῖ ἑκατέρους³⁷, ὅτι ἐν αὐτοῖς³⁸ στήσεται ὁ³⁹ Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/004.yaml
  text: I know that in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will array yourselves against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.
translation:
  language: zh_hans
  text: 我知道，到了末后的日子，你们必背离主，激怒利未，又列阵与犹大为敌；但你们胜不过他们。因为主的一位天使引导他们双方；以色列必借着他们站立得住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着他们”直译为“在他们里面”，也可理解为“在他们当中”。
    reason: 希腊语 ἐν αὐτοῖς 可表达领域、位置或凭借关系，正文不宜完全遮蔽这种歧义。
lexical_decisions:
- source_word: ἀποστήσεσθε
  choice: 背离
  rationale: 表达从主那里离弃、叛离的含义，比单纯“离开”更贴近该动词在此处的宗教与盟约语境。
- source_word: προσοχθιεῖτε τῷ Λευί
  choice: 激怒利未
  rationale: 按动词与间接受词“利未”的关系，译出招惹、使之发怒之意；也与后文公开敌对犹大形成递进。
- source_word: παρατάξεσθε
  choice: 列阵与……为敌
  rationale: 保留该动词的军事性“列队迎战”意象，同时采用自然的现代汉语表达。
- source_word: οὐ δυνήσεσθε πρὸς αὐτούς
  choice: 胜不过他们
  rationale: 在对阵语境中，该短语指无力抗衡或不能取胜；“胜不过”简洁自然。
- source_word: ὁδηγεῖ ἑκατέρους
  choice: 引导他们双方
  rationale: ἑκατέρους 指前述利未和犹大这双方；保留单数天使同时引导两者的陈述。
- source_word: στήσεται
  choice: 站立得住
  rationale: 既保留“站立”的基本意象，也表达以色列得以确立、存立的语境含义。
theological_decisions:
- issue: ἐν αὐτοῖς 所表达的关系
  choice: 借着他们
  alternative: 在他们里面
  rationale: 介词短语可指领域或凭借；上下文谈利未和犹大受天使引导，并关系到以色列得以存立，因此正文采用较自然的工具性表达，同时以脚注保留字面的另一理解。
- issue: “他们双方”的所指
  choice: 利未和犹大
  alternative: 其他群体或人物
  rationale: 最近且语法上最自然的两个先行对象是利未和犹大，不另行引入后世制度或特定教派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“末后的日子”“背离主”“列阵”“站立得住”保留经文语体和原文意象，避免过度古雅；标点呈现敌对行动与最终不能得胜之间的转折。
