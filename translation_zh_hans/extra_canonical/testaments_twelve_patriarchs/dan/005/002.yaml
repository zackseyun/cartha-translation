  text: Ἀλήθειαν φθέγγεσθε¹⁴ ἕκαστος πρὸς τὸν πλησίον αὐτοῦ καὶ οὐ μὴ ἐμπέσητε εἰς μῆνιν¹⁵ *καὶ ταραχάς¹⁶, ἀλλ᾽ ἔσεσθε¹⁷ ἐν εἰρήνῃ ἔχοντες τὸν θεὸν *τῆς εἰρήνης¹⁸ καὶ *οὐ μὴ κατισχύσει¹⁹ ὑμῶν²⁰ πόλεμος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/002.yaml
  text: Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace, and no war will prevail against you.
translation:
  language: zh_hans
  text: 你们各人要对邻舍说真话，这样就绝不会陷入愤怒和纷乱；反倒会处在平安中，有那位赐平安的上帝，争战也决不能胜过你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν φθέγγεσθε
  choice: 说真话
  rationale: 直译其命令语气，现代汉语自然明确；φθέγγεσθε 在此指开口讲说。
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: 对邻舍
  rationale: 保留 πλησίον 的伦理与经文语域，并准确表达说话的对象。
- source_word: εἰς μῆνιν καὶ ταραχάς
  choice: 陷入愤怒和纷乱
  rationale: μῆνις 指强烈愤怒，ταραχαί 为骚乱、动荡或纷争；“纷乱”保留其较宽泛的群体性含义。
- source_word: ἔσεσθε ἐν εἰρήνῃ
  choice: 必安然相处
  rationale: 不只表达内心平静，也呈现上下文中人际和平的状态。
- source_word: ἔχοντες τὸν θεὸν τῆς εἰρήνης
  choice: 因为有赐平安的上帝与你们同在
  rationale: “有……上帝”在汉语中需补足关系；译为“与你们同在”自然传达 ἔχοντες，且“赐平安的上帝”比生硬的“平安的上帝”更符合现代汉语。
- source_word: οὐ μὴ κατισχύσει ὑμῶν πόλεμος
  choice: 任何争战都不能胜过你们
  rationale: οὐ μή 强烈否定，以“都不能”体现；κατισχύω 加属格表示胜过、压倒。
theological_decisions:
- issue: “有平安的上帝”所表达的关系
  choice: 有赐平安的上帝与你们同在
  alternative: 拥有平安的上帝
  rationale: 避免把上帝表述为人可占有的对象，同时不把分词 ἔχοντες 过度解释为特定的盟约或内住教义。
- issue: 末句“争战”是外在战争还是广义冲突
  choice: 保留“争战”的宽泛说法
  alternative: 战争绝不能战胜你们
  rationale: πόλεμος 可指战争，也可在伦理劝诫中泛指敌对冲突；不应擅自限缩。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“邻舍”保留经文传统色彩；全句尽量维持希腊文由诚实言语、免于愤怒纷乱、活在和平中到不被争战胜过的逻辑推进。
