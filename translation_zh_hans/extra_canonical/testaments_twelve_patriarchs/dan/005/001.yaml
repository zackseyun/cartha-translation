base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/001.yaml
  text: Therefore, my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要谨守主的诫命，遵行他的律法；要远离愤怒，憎恨虚假，好让主住在你们里面，使彼列从你们那里逃走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε / τηρήσατε
  choice: 谨守 / 遵行
  rationale: 两个动词都表达守持、遵守；用近义而不机械重复的现代汉语，分别与“诫命”和“律法”自然搭配。
- source_word: ἀπόστητε ἀπὸ τοῦ θυμοῦ
  choice: 远离愤怒
  rationale: ἀφίστημι在此表示离开、避开；“远离”既保留主动决绝之意，也符合现代汉语表达。
- source_word: τὸ ψεῦδος
  choice: 虚假
  rationale: 该词可指谎言或虚假之事；“虚假”保留较宽泛的语义，不局限于口头说谎。
- source_word: κατοικήσει ἐν ὑμῖν
  choice: 住在你们里面
  rationale: 按ἐν ὑμῖν直译，保留复数对象与“在……里面”的内住意象。
- source_word: ὁ Βελίαρ
  choice: 彼列
  rationale: 采用这一邪恶者名称在中文宗教文献中的通行音译，不将其解释性改译为“魔鬼”或“邪恶者”。
theological_decisions:
- issue: ἵνα后两个将来时动词所表达的目的或结果
  choice: 好让主住在你们里面，使彼列从你们那里逃走
  alternative: 以致主住在你们里面，彼列也从你们那里逃走
  rationale: ἵνα在此可带目的兼结果色彩；“好让……使……”保留劝诫指向的目的意味，同时不把这句话改写成严格的因果教义命题。
- issue: ἐν ὑμῖν的范围
  choice: 在你们里面
  alternative: 在你们中间
  rationale: 介词短语两种理解皆可能；正文采取更贴近字面的“里面”，但不进一步界定为个体内住或群体内住。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“谨守主的诫命，遵行他的律法”保持平行节奏；分号呈现从正面命令转向远离恶行的结构。无脚注标记。
