source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἀναπαύσονται ἐν Ἐδὲμ ἅγιοι⁹⁵, καὶ ἐπὶ *τῆς νέας⁹⁶ Ἱερουσαλὴμ εὐφρανθήσονται δίκαιοι, *ἥτις ἐστι δόξα θεοῦ αἰώνιος⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/012.yaml
  text: And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.
translation:
  language: zh_hans
  text: 圣者必在伊甸安息，义人必为新耶路撒冷欢喜；这城就是上帝永恒的荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπαύσονται
  choice: 必……安息
  rationale: 表达将来时，并保留“歇息、得安息”的庄重语义。
- source_word: ἅγιοι
  choice: 圣者
  rationale: 指属上帝、分别为圣的人；比“圣徒”较少带入后世宗派色彩。
- source_word: ἐπὶ τῆς νέας Ἱερουσαλήμ
  choice: 因新耶路撒冷而
  rationale: ἐπί与喜乐动词连用可指喜乐所缘由或对象；此译避免误作身处城中，也比生硬的“在……之上”自然。
- source_word: ἥτις
  choice: 这城就是
  rationale: 关系代词的阴性单数呼应“耶路撒冷”；用“这城”明确中文指代，同时保留直接断言。
- source_word: δόξα θεοῦ αἰώνιος
  choice: 上帝永恒的荣耀
  rationale: 依原词序关系理解为“上帝的荣耀”，并以“永恒的”修饰“荣耀”。
theological_decisions:
- issue: 新耶路撒冷与上帝永恒荣耀的关系
  choice: 这城就是上帝永恒的荣耀
  alternative: 这城有上帝永恒的荣耀／这城彰显上帝永恒的荣耀
  rationale: 原文使用ἐστι作直接等同陈述；不将其弱化为拥有或彰显，以保留原文的神学张力。
- issue: ἐπί所表达的喜乐关系
  choice: 因新耶路撒冷而欢喜
  alternative: 在新耶路撒冷欢喜／为新耶路撒冷欢喜
  rationale: 原文不是单纯的ἐν地点结构。译作“因……而”保留新耶路撒冷作为欢喜对象或缘由的含义，同时避免断定空间位置。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两分句保持原文平行结构；末句以分号衔接，并用“这城”消除中文关系代词可能产生的指代含混。
