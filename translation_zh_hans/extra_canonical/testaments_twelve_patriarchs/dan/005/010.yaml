source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἀνατελεῖ ὑμῖν *ἐκ τῆς φυλῆς [Ἰούδα καὶ] τοῦ Λευὶ τὸ σωτήριον Κυρίου⁸³, *αὐτὸς γὰρ⁸⁴ ποιήσει πρὸς τὸν Βελίαρ πόλεμον⁸⁵, καὶ τὴν ἐκδίκησιν τοῦ νίκους δώσει τοῖς⁸⁶ †πατράσιν⁸⁷ ὑμῶν⁸⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/010.yaml
  text: And for you the salvation of the Lord will arise from the tribe of Judah and Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.
translation:
  language: zh_hans
  text: 主的救恩必为你们从犹大和利未支派中兴起[b]。他亲自要与彼列争战，并把得胜的伸冤赐给你们的列祖[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们的列祖”依现存希腊文直译；此处原文可能有讹误，确切所指不明。“得胜的伸冤”也可理解为“得胜所带来的报应”。
    reason: 提示底本文字和罕见短语的真实不确定性，避免正文凭推测改写。
  - marker: b
    text: 所据希腊文版本将“犹大和”置于方括号中，显示其文本地位不确定；并且原文以单数“支派”统摄“犹大和利未”，句法不寻常。
    reason: 交代底本的方括号及单数支派结构，不将其进一步解释为特定谱系或教义主张。
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: 兴起
  rationale: 本义可指升起、萌发；这里以“兴起”保留救恩如一位人物出现的意象，并与后文阳性代词“他”衔接。
- source_word: τὸ σωτήριον Κυρίου
  choice: 主的救恩
  rationale: 既可指主所赐的拯救，也可能指承担拯救使命者；译文保留这种含蓄，不擅自明确为某一人物称号。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 按专名音译；在本书语境中指邪恶势力或其人格化首领。
- source_word: τὴν ἐκδίκησιν τοῦ νίκους
  choice: 得胜的伸冤
  rationale: ἐκδίκησις兼有申冤、报应或惩罚之意；“伸冤”比单纯“报仇”更能保留公义裁断的意味，同时照应νῖκος“得胜”。
- source_word: πατράσιν ὑμῶν
  choice: 你们的列祖
  rationale: 直译现存希腊文；虽在语境中较难理解，仍不据推测改作“仇敌”等词。
theological_decisions:
- issue: “主的救恩”与后文“他亲自”的关系
  choice: 保留“主的救恩……他亲自”这一人格化表达
  alternative: 译成“主所立的救主”或将代词改为“这救恩”
  rationale: 希腊文先用中性名词σωτήριον，随后以强调性代词αὐτός指向行动者；直接明确为“救主”会越过原文，而改成非人格化表达又会削弱其张力。
- issue: 救恩来自犹大与利未的表述
  choice: 译作“从犹大和利未支派”
  alternative: 解释为分别来自“犹大支派和利未支派”或指两者结合的单一谱系
  rationale: 原文以单数φυλῆς统摄“犹大和利未”，结构不寻常；译文不进一步规定其谱系或弥赛亚论含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“彼列”保留古代宗教专名；正文尽量顺畅，同时借脚注交代原文疑难。
