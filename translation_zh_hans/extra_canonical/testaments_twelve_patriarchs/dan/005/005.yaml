source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ὡς ἂν ἀποστήσεσθε⁴⁰ ἀπὸ⁴¹ Κυρίου⁴², *ἐν πάσῃ κακίᾳ⁴³ *πορευόμενοι ποιήσετε τὰ βδελύγματα τῶν ἐθνῶν ἐκπορνεύοντες ἐν⁴⁴ γυναιξὶν ἀνόμων⁴⁵ καὶ ἐν πάσῃ πονηρίᾳ⁴⁶ ἐνεργούντων⁴⁷ ⌈ἐν ὑμῖν⌉¹ *τῶν πνευμάτων⁴⁸ τῆς πονηρίας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/005.yaml
  text: And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and every evil will be at work among you through the spirits of wickedness.
translation:
  language: zh_hans
  text: 每当你们背离主，行在各种邪恶中时，你们就会做列国所行可憎的事，与不守律法的女子行淫；各种邪恶也会借着邪恶之灵在你们中间作工。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与不守律法的女子行淫，并陷入各种邪恶；邪恶之灵会在你们中间作工。”希腊文末句句法不规则；“在你们中间”在本版希腊文本中以方括号标示为文本存疑。
    reason: 保留末句中“各种邪恶”、邪恶之灵及其“在你们中间”作工三者之间不完全确定的句法关系，并说明文本存疑处。
lexical_decisions:
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: 背离主
  rationale: 表达离弃、背叛之意，同时保留介词所表示的远离关系。
- source_word: ἐν πάσῃ κακίᾳ πορευόμενοι
  choice: 在各种恶事中行走
  rationale: 保留犹太—希腊伦理语境中“行走”作为生活行事方式的意象。
- source_word: τὰ βδελύγματα τῶν ἐθνῶν
  choice: 列国可憎的事
  rationale: βδελύγματα 指令人憎恶、常带宗教与道德色彩的行为；“列国”自然对应 τῶν ἐθνῶν。
- source_word: ἐκπορνεύοντες ἐν γυναιξὶν ἀνόμων
  choice: 与不守律法的女子行淫
  rationale: ἐκπορνεύοντες 表示犯淫乱；ἀνόμων 可理解为修饰“女子”，故译作“不守律法的女子”，避免将其弱化为笼统的“不法”。
- source_word: τῶν πνευμάτων τῆς πονηρίας
  choice: 邪恶的灵
  rationale: 采用自然中文表达，保留其作为属灵行动者的复数集合意义。
theological_decisions:
- issue: 末句中行动主体及句法关系
  choice: 将“邪恶的灵”理解为 ἐνεργούντων 的主体，译为“邪恶的灵也会……施行各种恶事”
  alternative: 译为“各种恶事会借着邪恶的灵在你们中间运行”
  rationale: 现存希腊文的格与分词结构较不规则，且含编者括号标示的 ἐν ὑμῖν；所选译法较直接地反映属格复数分词 ἐνεργούντων 与 τῶν πνευμάτων 的呼应，但以脚注保留另一种可行理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“背离主”“可憎的事”“行淫”等用语保留原文的宗教伦理力度；“行走”保留原文惯用隐喻。脚注标记已在正文中列出。
