  rationale: 修订末句，使“各种邪恶”仍是发生／作工的内容，并以“借着邪恶之灵”反映英文审校轨迹及希腊文不规则结构所容许的媒介关系；脚注保留将邪恶之灵理解为作工主体的可行读法。前半句仅作轻微语体调整。
