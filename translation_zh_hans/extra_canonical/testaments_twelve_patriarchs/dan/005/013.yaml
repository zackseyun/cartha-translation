base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/013.yaml
  text: And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst [dwelling among men], and the Holy One of Israel reigning over her [in humility and poverty; and the one who believes in him will reign among men in truth].
translation:
  language: zh_hans
  text: 耶路撒冷必不再遭受荒凉，以色列也不再被掳；因为主必在她中间[a]，与世人来往[b]；以色列的圣者在她之上掌权[c][d]，在谦卑和贫穷中；信靠他的人必在人间按真理作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”指耶路撒冷；原文以阴性代词称呼这座城。
    reason: 说明代词所指，同时保留原文的拟人化表达。
  - marker: b
    text: “与世人来往”一语在版本传承中带有文本不确定性；也可译作“与世人一同生活”或“与世人交往”。
    reason: 原始资料以方括号标示该短语，须保留其文本状态及συναναστρεφόμενος的语义范围。
  - marker: c
    text: 原文此处使用分词“掌权／作王”，与前面的“主必在她中间”相接；也可理解为“以色列的圣者必在她之上掌权”。
    reason: 保留希腊文分词在句法和时态表达上的开放性。
  - marker: d
    text: 从“在谦卑和贫穷中”至本句末，在版本传承中带有文本不确定性。“按真理”也可译作“真实地”。
    reason: 原始资料将这一整段置于方括号内；脚注锚点置于该段开头，以清楚标示其范围，并说明ἐν ἀληθείᾳ的合理语义范围。
lexical_decisions:
- source_word: ὑπομενεῖ
  choice: 遭受
  rationale: 此处表示耶路撒冷继续承受或经历荒凉；“遭受”符合现代汉语搭配，也保留受苦意味。
- source_word: ἐρήμωσιν
  choice: 荒凉
  rationale: 对应城市被毁、荒废的状态，不将其窄化为某一次特定历史事件。
- source_word: αἰχμαλωτισθήσεται
  choice: 被掳
  rationale: 采用圣经语境中自然且通行的表达，准确传达被俘、遭掳掠之意。
- source_word: ἐν μέσῳ αὐτῆς
  choice: 在她中间
  rationale: αὐτῆς回指耶路撒冷；用“她”保留原文对该城的拟人化指称。
- source_word: συναναστρεφόμενος
  choice: 与世人一同生活
  rationale: 该词表示与人共同来往、相处和生活；此译比单纯“居住”更完整，同时保持自然。
- source_word: βασιλεύων ἐπ᾽ αὐτῆς
  choice: 在她之上作王
  rationale: 保留βασιλεύω的君王统治意象及ἐπί所表达的治理对象；汉语以现在形式置于未来预言语境中，不额外消除原文分词结构带来的张力。
- source_word: ἐν ταπεινώσει καὶ πτωχείᾳ
  choice: 存心谦卑，生活贫寒
  rationale: 分别表达ταπείνωσις的卑微、谦卑状态与πτωχεία的贫穷，避免把两词合并为单一概念。
- source_word: ὁ πιστεύων ἐπ᾽ αὐτῷ
  choice: 信靠他的
  rationale: πιστεύω ἐπί不仅是承认某事为真，也有把信赖置于某人身上的含义；“信靠”自然体现这一点。
- source_word: ἐν ἀληθείᾳ
  choice: 按真理
  rationale: 保留“真理/真实”的开放含义，不武断限定为“诚实地”或“真正地”。
theological_decisions:
- issue: “主”与“以色列的圣者”的关系
  choice: 依原文连续称谓译出，不明说二者是同一位，也不将其拆定为两位不同主体。
  alternative: 译成“主，就是以色列的圣者”；或明确译成两个彼此有别的主体。
  rationale: 希腊文在结构上存在同位理解的可能，但并未使用明确的解释性连接词；译文应保留这种神学与句法张力。
- issue: “存心谦卑，生活贫寒”所修饰的对象
  choice: 依其位置接在“以色列的圣者……作王”之后，但不添加明确主语。
  alternative: 明确写成“以色列的圣者存心谦卑、生活贫寒”；或使其修饰后面的信徒。
  rationale: 原文位置倾向于连接前面的作王者，但文本括注和句法使其归属并非毫无疑问，因此不额外加强限定。
- issue: 信靠者“作王”的性质
  choice: 直译为“必在人间按真理作王”。
  alternative: 弱化为“必在人群中有权柄”或解释为属灵统治。
  rationale: 原文使用明确的βασιλεύσει；不应预先限定其政治、属灵或末世性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被掳”“作王”保留熟悉的圣经语域，但避免古奥句式。分号用来呈现因果句内部并列而略带松散的希腊文结构；不强行把“主”与“以色列的圣者”合并，也不把分词完全改写成无歧义的独立未来时句。
