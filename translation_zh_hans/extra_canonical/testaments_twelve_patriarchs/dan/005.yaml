revisions:
- from: '《但遗训》第5章


    1 所以，我的孩子们，你们要谨守主的诫命，遵守他的律法。要远离愤怒，憎恶虚假，好让主住在你们里面，使彼列逃离你们。


    2 每个人都要对邻舍说真话；这样，你们就绝不会陷入暴怒和纷争，反而会安然和平，因为有赐平安的上帝与你们同在；战争也绝不能胜过你们。


    3 你们要一生爱主，也要以真诚的心彼此相爱。


    4 我知道，到了末后的日子，你们会离弃主，激怒利未，又列阵攻击犹大，却不能胜过他们；因为主的一位天使引导这两支派，以色列必靠他们站立。


    5 每当你们离弃主，行在种种邪恶中，你们就会做列国可憎的事，与不法的女子行淫；邪恶的灵也会在你们中间施行各种恶事。


    6 因为我读过义人以诺的书[a]，并且得知你们的统治者是撒但；邪恶和骄傲的灵会伺候利未的子孙，使他们在主面前犯罪。


    7 我的子孙会亲近利未，在一切事上与他们一同犯罪。犹大的子孙却会因贪婪而像狮子一样抢夺别人的财物。


    8 因此，你们会和他们一同[b]被掳到异乡；在那里，你们要遭受埃及的一切灾殃，以及列国的一切祸患。


    9 此后，你们若回转归向主，就会蒙怜悯；他必领你们进入他的圣所，赐平安给你们。


    10 主的拯救必从犹大和利未支派[c]为你们兴起；因为他要亲自与彼列争战，赐给你们的先祖伸冤得胜。


    11 他要从彼列手中夺回被掳的，就是众圣者的灵魂[d]；他要使悖逆的心回转归向主，并把永远的平安赐给一切呼求他的人。


    12 众圣者必在伊甸安息，义人必因新耶路撒冷[e]而欢喜；这城就是上帝永远的荣耀。


    13 耶路撒冷不再遭受荒凉，以色列也不再被掳，因为主必在她中间，以色列的圣者必在她之上掌权。[f]


    [a] 希腊文本明确提到“义人以诺的书”，很可能指第二圣殿时期犹太人所熟悉的以诺传统。


    [b] 有些抄本没有“和他们一同”；若保留，这句话更明确地把但的子孙被掳与利未、犹大联系起来。


    [c] “犹大和”在部分文本中带有不确定性；有些抄本只提利未，但同时提到犹大和利未的读法在文本传统中有充分见证。


    [d] “就是众圣者的灵魂”在文本上并不稳定；这句话若属于原文，便说明从彼列手中获释的是受奴役的人。


    [e] “新耶路撒冷”是末世中锡安得以复兴并享有荣耀的图景，并非仅指现今的历史名城。


    [f] 有些抄本在本节另有关于主与人同住，以及他在卑微、贫穷中掌权等语句；这些话常被视为后期扩充，因此未列入正文。'
