  rationale: 修订仅处理可安全判定的语义与语体问题：第5节以“贪求……因欲念陷入怒气”更明确对应ἐπιθυμῆσαι与πάθος，同时不为“这灵”的具体性质添加解释；第7节以“彼此结合”保留συναίρονται的中性联合义；脚注d简化为必要且稳妥的名称说明。其余文本维持原译，特别保留第1节按所供希腊文译作“虚妄的”。
