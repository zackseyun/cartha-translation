  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004.yaml
  text: '1[a]. For anger is blindness. It does not allow one to see the face of any man with truth.


    2. For first it is stirred up by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it provokes him. It throws his purpose into confusion, and so it rouses his soul in great fury.


    3[b]. Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.


    4. For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.


    5. But if you fall into any loss or ruin, children, do not be distressed. For this very spirit makes one desire to be angry over what is perishing, so that he may fall into anger through affliction.


    6. And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.


    7. And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it[c][d], and Beliar rules over it.'
translation:
  language: zh_hans
  text: '《但遗训》第4章


    1. 所以，要明白怒气的力量：它是虚妄的。[a]


    2. 它起初因一句话受到激发，随后又借着行为使发怒的人越发强硬；它还借着惨痛的损失扰乱他的思量，就这样激起他心中极大的愤怒。


    3. 因此，有人说话攻击你们时，不要被激动而发怒；有人称赞你们圣洁时，也不要自高。不要因而转为欣喜，也不要转为厌恶。


    4. 因为它先使耳朵感到愉悦，继而使心思变得敏锐，去察觉那激怒人的事；[b]人一旦动怒，就以为自己发怒是理所当然的。


    5. 孩子们，如果你们遭受任何损失或毁坏，不要惊慌。因为这灵使人贪求那将要失去的东西，以致人因欲念陷入怒气。


    6. 无论你们是自愿还是非自愿地蒙受损失，都不要忧愁；因为怒气也从忧愁中生出，并有虚假相伴。[c]


    7. 怒气与虚假合在一起，是一种有两副面孔的恶；二者彼此结合，为要扰乱人的心。人的灵魂若不断受到扰乱，主就离开它，彼列便辖制它。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本作“怒气的力量……是虚妄的”。英文校订层在本节采用“怒气是盲目的”，但“盲目”不见于这里所给的希腊文本，因此正文按希腊文翻译。
    reason: textual_variant
  - marker: b
    text: 这里的希腊文有文本和语法上的困难，也可译作“去察觉那已经被激起的东西”或“去察觉那刺激”。
    reason: alternative_reading
  - marker: c
    text: “有虚假相伴”也可能表示忧愁生出怒气，而谎言又进一步助长怒气；原文没有明确说明二者的具体关系。
    reason: alternative_reading
  - marker: d
    text: “彼列”是古代犹太文献中对邪恶权势或敌对者的传统称呼；其他语言传统常见相应名称“Belial”。
    reason: cultural_note
lexical_decisions:
- source_word: ματαία
  choice: 虚妄的
  rationale: 保留现存希腊文本对怒气力量的直接判断；既可表示徒然、无益，也含不实在的意味，不改译为所给希腊文未出现的“盲目”。
- source_word: παροξύνεται
  choice: 受到激发
  rationale: 保留被动及起始意味，表达一句话使怒气开始受到刺激。
- source_word: δυναμοῖ
  choice: 使……越发强硬
  rationale: 反映“使强壮、加强”的基本意义，同时以自然汉语表达行为会强化正在发怒之人的状态。
- source_word: ζημίαις πικραῖς
  choice: 惨痛的损失
  rationale: 兼顾ζημία的损失含义和πικρός所表达的痛苦、苦涩感，不限定为物质损失。
- source_word: διαβούλιον
  choice: 思量
  rationale: 指经过考虑的谋划或判断过程；“思量”可自然表达怒气使人的审慎思考陷入混乱。
- source_word: κινεῖσθε εἰς ὀργήν
  choice: 被激动而发怒
  rationale: 保留原文由外力推动、进入怒气的动态意象。
- source_word: ἐπαίρεσθε
  choice: 自高
  rationale: 准确表达因称赞而抬高自己，语体庄重且现代读者易懂。
- source_word: τέρψιν / ἀηδίαν
  choice: 欣喜／厌恶
  rationale: 保留相反的情绪摆动，并使汉语对偶清楚自然。
- source_word: ὀξύνει τὸν νοῦν
  choice: 使心思变得敏锐
  rationale: 保留“磨锐”的隐喻，表示心智对冒犯变得格外敏感。
- source_word: ἐρεθισθέν
  choice: 那激怒人的事
  rationale: 文本语法和所指不够确定；此译保留刺激、激怒的核心含义，同时避免把它过度实体化。
- source_word: ἐκθροεῖσθε
  choice: 惊慌
  rationale: 表达受到震动而不安、慌乱的状态，不把含义限缩为单纯恐惧。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用现代中文宗教文献中常见的音译，保留其作为邪恶权势之名的性质。
theological_decisions:
- issue: “这灵”所表示的道德—属灵能动者
  choice: 保留“这灵”，不改写为纯心理性的“冲动”
  alternative: 这种冲动／这种情绪
  rationale: 原文明确使用πνεῦμα，并在结尾提到彼列的辖制，显示劝诫同时具有心理与属灵层面；保留原词可避免消解这种张力。
- issue: 灵魂受扰时主“离开”它
  choice: 直译为“主就离开它”
  alternative: 人便远离主／主的同在不再被感受到
  rationale: 希腊文以主为语法主语，明确说主离开灵魂；不以解释性措辞缓和或重新界定其神学含义。
- issue: κύριος的译法
  choice: 主
  alternative: 上主／主人
  rationale: “主”保留宗教语境中的庄重性，又不把没有明示的专名或圣名形式加入文本。
- issue: 彼列的性质
  choice: 保留专名并说其“辖制”灵魂
  alternative: 邪恶辖制它／把彼列仅视为抽象隐喻
  rationale: 原文将Βελίαρ人格化为实施辖制者；译文不预先裁定这是字面属灵存在还是象征性表达。
translation_notes:
  register: 采用现代标准普通话的庄重劝诫体。句式尽量清楚简洁，保留原文中怒气、忧愁、虚假、灵以及彼列之间既有心理性又有属灵性的张力。称呼τέκνα直译为“孩子们”，不添加“我的”。
