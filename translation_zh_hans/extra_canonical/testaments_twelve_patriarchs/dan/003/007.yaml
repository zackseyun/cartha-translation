source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὸ μὲν σῶμα *ἴδιον ποιεῖται³ τοῦ θυμουμένου⁴, *τῆς δὲ ψυχῆς⁵ κατακυριεύει, καὶ παρέχει σώματι⁶· ⌈δύναμιν⌉⁷, ἵνα ποιήσῃ⁸ πᾶσαν⁹ ἀνομίαν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/007.yaml
  text: And it makes the body of the angry man its own, and gains mastery over the soul, and gives the body strength so that it may commit every lawless deed.
translation:
  language: zh_hans
  text: 它把发怒之人的身体据为己有，又制伏他的灵魂，并赐给身体力量，使身体能行出一切不法之事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδιον ποιεῖται
  choice: 据为己有
  rationale: 保留“使之成为自己的、占为己有”的支配意味，同时符合现代汉语表达。
- source_word: τοῦ θυμουμένου
  choice: 发怒之人
  rationale: 该分词指正在动怒或受怒气驱使的人；译为“发怒之人”自然且不额外限定怒气的性质。
- source_word: κατακυριεύει
  choice: 制伏
  rationale: 表达强力掌控、辖制之意，与上下文中怒气支配人的身体和灵魂相称。
- source_word: ψυχῆς
  choice: 灵魂
  rationale: 在“身体—ψυχή”的对举中采用“灵魂”，保留古代文本的人论表达，不将其窄化为“情绪”或“心智”。
- source_word: δύναμιν
  choice: 力量
  rationale: 直接对应能力、力量；此处指使身体能够实施不法行为的力量。
- source_word: πᾶσαν ἀνομίαν
  choice: 种种不法之事
  rationale: πᾶσαν可作总体性的“一切”或遍指的“各种”；汉语以“种种”表达广泛涵盖，ἀνομία保留为“不法”，避免只译成一般性的“恶事”。
theological_decisions:
- issue: 怒气作为主语的拟人化支配
  choice: 连续使用“它”，保留怒气仿佛行动者的拟人表达
  alternative: 明确增译为“怒气”或改写成“人在怒气中”
  rationale: 本节希腊文承接上文，以省略主语描述其占据身体、制伏灵魂；保留“它”可维持篇章衔接和原文的拟人化张力，不把责任关系解释性改写。
- issue: 身体与灵魂的关系
  choice: 保留“身体—灵魂”的二项表述
  alternative: 译作“肉体—内心”
  rationale: 原文明确使用σῶμα与ψυχή；直保这一对举可避免导入特定宗派的人论体系，也不消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“据为己有—制伏—赐给力量”保留原文递进结构；不添加原文未明说的主语名称或因果解释。
