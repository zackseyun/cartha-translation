  text: III. *Καὶ γὰρ πονηρὸς ὁ θυμός¹, τέκνα μου, *ὡς καὶ αὐτὴν τὴν ψυχὴν ἐκταράσσει².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/006.yaml
  text: For anger is evil, my children, because it throws even the soul itself into turmoil.
translation:
  language: zh_hans
  text: 因为愤怒¹是邪恶的，我的孩子们；它甚至会搅乱心灵本身²。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: 愤怒
  rationale: 此处指强烈的怒气或暴怒；“愤怒”在现代汉语中自然、庄重，并与下文扰乱心灵的作用相称。
- source_word: πονηρός
  choice: 邪恶的
  rationale: 保留该词明确的道德评判，不弱化为仅仅“有害”或“不好”。
- source_word: ψυχή
  choice: 心灵
  rationale: 语境强调人的内在生命受到搅扰；“心灵”比“灵魂”更自然，同时不把该词限定为某种精细的人论术语。
- source_word: ἐκταράσσει
  choice: 搅乱
  rationale: 表达彻底扰动、使陷入混乱的含义，符合该动词加强形式的力度。
theological_decisions:
- issue: ψυχή所指范围
  choice: 译作“人的心灵”
  alternative: “灵魂本身”
  rationale: 希腊词可指生命、自己或内在之人；此处不强行确立灵魂与身体的二分。“人的”使现代汉语通顺，而“心灵”保留内在层面的开放性。
- issue: 愤怒的道德定性
  choice: “愤怒是邪恶的”
  alternative: “愤怒是有害的”
  rationale: 原文πονηρός带有鲜明的道德负面意义，应保留其张力，不将其仅解释为心理危害。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体。“我的孩子们”保留长者训诲式称呼；分号呈现原文先定性、后说明后果的结构。
