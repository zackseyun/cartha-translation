source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Καὶ ὅταν ταῦτα πάντα πράξῃ τὸ σῶμα, δικαιοῖ τὰ πραχθέντα καὶ ἡ ψυχή¹⁰, ἐπειδὴ οὐ βλέπει ὀρθῶς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/008.yaml
  text: And when the body has done all these things, the soul justifies what has been done, because it does not see rightly.
translation:
  language: zh_hans
  text: 每当身体做了这一切事，灵魂也会把所做的事认定为正当[a]，因为它看得不正确。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认定为正当”也可译作“为……辩解”或“将……合理化”。
    reason: δικαιοῖ可指把既成行为判为正当，也可在此语境中指为其辩护或合理化；脚注保留该语义幅度。
lexical_decisions:
- source_word: δικαιοῖ
  choice: 为……辩解
  rationale: 此处指灵魂把身体已经做出的恶行说成合理；译作“辩解”既保留认知与道德上的自我开脱，也避免将其误解为神学意义上的“称义”。
- source_word: τὰ πραχθέντα
  choice: 所做的事
  rationale: 对应已完成的行为，中文简洁自然，并保留原文未明说行为主体的表达。
- source_word: οὐ βλέπει ὀρθῶς
  choice: 不能正确地看待事情
  rationale: 原文直译为“不正确地看”；在语境中指判断或认识失真。补出“事情”使现代汉语自然，但不进一步限定失真的原因。
theological_decisions:
- issue: 灵魂与身体在恶行中的关系
  choice: 保留身体先行动、灵魂随后为行为辩解的次序
  alternative: 译成灵魂主动认可或使行为成为正义
  rationale: 原文描写身体完成行为后，灵魂因不能正确看待而加以合理化；不把 δικαιοῖ 处理为救恩论意义上的“称义”，也不消除身心之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“灵魂”对应 ψυχή；句式保留原文的因果关系及身体与灵魂的先后次序。
