  source_fidelity: 原文的ὅταν表示概括性的“每当／每逢”，而草稿“当……以后”较像一次性的事件，且额外强化了先后关系。δικαιοῖ在此宜以“认定为正当”直接表达将既成行为判为正当，同时可用脚注保留“辩解／合理化”的语境化译法。末句保留“看”这一原有比喻，避免将未明说的对象明确限定为“事情”。
  naturalness: 修订后使用“每当……，……也会……”呈现汉语中自然的概括性条件句；“看得不正确”虽保留原文未明说的宾语，仍可在上下文中自然理解为判断失准。
  terminology: “身体”对应σῶμα，“灵魂”对应ψυχή。“认定为正当”在此是伦理判断，不引入救恩论“称义”的专门含义；脚注说明其亦可有辩解、合理化之意。
