revisions:
- from: 当身体做完这一切事以后，灵魂也会为所做的事辩解[a]，因为它不能正确地看待事情。
  to: 每当身体做了这一切事，灵魂也会把所做的事认定为正当[a]，因为它看得不正确。
  rationale: 将一次性的“当……以后”改为“每当……”，以对应ὅταν的概括性用法；以“认定为正当”表达δικαιοῖ的判断性含义，并在脚注保留“辩解／合理化”的可能性；末句不补出原文未明言的对象，以保留其简洁和歧义。
