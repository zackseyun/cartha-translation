revisions:
- from: 但发怒的人若是软弱，愤怒的激情就会在他里面加倍滋长，因为怒气总是在不法之事上助长他。这灵总是与虚假同行，在撒但的右边行走，使他的行为都带着残酷和虚假。
  to: 但发怒的人若是软弱，怒气的冲动就在他里面加倍滋长，因为怒气总是在不法中帮助他作恶。这灵总是与虚假同行，在撒但的右边行走，以致他的行为在残酷和虚假中发生。
  rationale: 修订只处理汉语搭配及目的从句的忠实表达：以“怒气的冲动”替换不够自然的“愤怒的激情”，以“帮助他作恶”表达怒气在不法中的助力，并删除原文未有的“都”。“在撒但的右边行走”及“这灵”“他的”均予保留，以维持原文的意象和指代歧义。
