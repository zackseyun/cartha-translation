source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐὰν δὲ ἀσθενὴς ᾖ ὁ²⁴ θυμούμενος²⁵, *διπλοῦν τὸ τῆς ὀργῆς πάθος ἐν αὐτῷ ἀναφύει²⁶· βοηθεῖ *γὰρ αὐτῷ ὁ θυμὸς²⁷ πάντοτε ἐν παρανομίᾳ²⁸. 6. Τοῦτο τὸ πνεῦμα ἀεὶ μετὰ τοῦ ψεύδους *ἐκ δεξιῶν τοῦ Σατανᾶ πορεύεται, ἵνα ἐν ὠμότητι καὶ ψεύδει³⁰ γίνωνται³¹ αἱ πράξεις αὐτοῦ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/010.yaml
  text: But if the one who is angry is weak, the passion of wrath grows in him twofold, for anger always helps him in wrongdoing. This spirit always proceeds with falsehood at the right hand of Satan, so that his deeds may be done in cruelty and falsehood.
translation:
  language: zh_hans
  text: 但发怒的人若是软弱，怒气的冲动就在他里面加倍滋长，因为怒气总是在不法中帮助他作恶。这灵总是与虚假同行，在撒但的右边行走，以致他的行为在残酷和虚假中发生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενὴς
  choice: 软弱
  rationale: 保留原词可指身体、意志或道德层面软弱的宽泛含义，不擅自限定。
- source_word: διπλοῦν ... ἀναφύει
  choice: 加倍滋长
  rationale: 既表达διπλοῦν的“加倍”，也体现ἀναφύει的“生长、萌发”，避免静态地译作“有双倍愤怒”。
- source_word: τὸ τῆς ὀργῆς πάθος
  choice: 愤怒的激情
  rationale: πάθος在此指强烈且支配人的情欲或激情；此译保留其负面驱动力，同时避免加入后世技术性神学术语。
- source_word: ἐν παρανομίᾳ
  choice: 在不法之事上
  rationale: 贴近介词结构，表达怒气在违法、作恶的领域中助长发怒者；“不法”也保留παρανομία相对于律法规范的色彩。
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ πορεύεται
  choice: 在撒但的右边行走
  rationale: 保留原文具体而略显神秘的空间意象，不把“右边”解释成权力、助手或赞同等单一含义。
- source_word: ἐν ὠμότητι καὶ ψεύδει
  choice: 带着残酷和虚假
  rationale: 自然表达行为在残酷与虚假之中产生或实施，同时保留两个并列的伦理特征。
theological_decisions:
- issue: “这灵”所指为何
  choice: 保留“这灵”，不明确解释为怒气之灵、邪灵或某种人格化力量
  alternative: 译作“这怒气之灵”或“这个邪灵”
  rationale: τοῦτο τὸ πνεῦμα承接上文但具体所指仍有一定歧义；不应在正文中补入原文没有的限定。
- issue: “他的行为”中代词的先行词
  choice: 保留单数“他的”，让上下文维持可能指撒但的行为这一自然读法
  alternative: 改作“人的行为”或“发怒之人的行为”
  rationale: αἱ πράξεις αὐτοῦ的αὐτοῦ在语法上最接近“撒但”，但语境也可能关联受该灵影响之人；不以解释性增补彻底消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句法尽量贴近希腊文的因果与目的结构；对“右边行走”等有意象且含义未完全明朗的表达予以保留。
