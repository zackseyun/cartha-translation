source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐν τίνι δὲ²⁵ περιβάλλει τοὺς ὀφθαλμοὺς αὐτοῦ²⁶; *ἐν μίσει καρδίας²⁷ κατὰ τοῦ ἀδελφοῦ αὐτοῦ²⁸ *εἰς φθόνον²⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/005.yaml
  text: And with what does it cover his eyes? With hatred of heart against his brother, unto envy.
translation:
  language: zh_hans
  text: 那么，它用什么蒙住他的眼睛呢？用他心中对弟兄的仇恨，使他陷入嫉妒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβάλλει
  choice: 蒙住
  rationale: 该词本义为“围上、披上、包住”；用于眼睛时，“蒙住”既保留遮盖意象，也符合现代汉语表达。
- source_word: μίσει καρδίας
  choice: 心中……的仇恨
  rationale: 以自然汉语表达“内心的仇恨”，保留 καρδία 所指的内在思想与情感。
- source_word: ἀδελφοῦ
  choice: 弟兄
  rationale: 保留亲属或群体成员关系的宽度，不擅自限定为亲生兄弟。
- source_word: εἰς φθόνον
  choice: 使他陷入嫉妒
  rationale: εἰς 在此表示趋向或结果；此译传达“走向嫉妒”的动态，同时避免生硬直译。
theological_decisions:
- issue: 蒙眼者与被蒙眼者的指代
  choice: 依原文保留“它”与“他”的区分
  alternative: 明确补出前文所指的恶念、忿怒或某种灵
  rationale: 本节省略主语，指代须由上下文确定；不在本节擅自补入具体神学身份。
- issue: 仇恨与嫉妒之间的关系
  choice: 译作趋向或结果关系
  alternative: 译作目的关系“为要使他嫉妒”
  rationale: εἰς 可表达目的或结果；上下文在此更自然地呈现仇恨把人引向嫉妒，但不强化为有意识的目的。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。问句保留原文的修辞结构；“蒙住眼睛”维持具体意象，“陷入嫉妒”则自然表达 εἰς 所含的趋向。
