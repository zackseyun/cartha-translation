  terminology: “主的先知”“义人”“仇敌”符合经文的庄重语域和常用术语。“兄弟”准确反映 ἀδελφός 的男性单数形式；“不认识”与末句“认不出”分别对应 οὐκ οἶδεν 与 οὐ γνωρίζει，保留两者措辞上的差别。
