  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/003.yaml
  text: Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him.
translation:
  language: zh_hans
  text: 因为，即使是父亲或母亲，它也把他们当作仇敌；即使是兄弟，它也不认识他；即使是主的先知，它也不听从他；即使是义人，它也看不见他；即使是朋友，它也认不出他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς πολεμίοις προσέχει αὐτοῖς
  choice: 把他们当作仇敌
  rationale: 表达“以仇敌的身份看待或对待他们”的意思；较逐字的“像仇敌一样留意他们”在现代汉语中容易产生误解。
- source_word: παρακούει
  choice: 不听从
  rationale: 此处指拒绝听从主的先知，而不只是没有听见。
- source_word: οὐ βλέπει
  choice: 看不见
  rationale: 紧贴 βλέπει 的视觉用语，保留其可能兼具属灵或道德盲目的含义，不改释为“忽视”。
- source_word: οὐ γνωρίζει
  choice: 认不出
  rationale: 与前面的 οὐκ οἶδεν（“不认得”）略作区分，并自然表达无法辨认朋友。
theological_decisions:
- issue: 各分句中省略的主语
  choice: 用“它”承接上文所述的力量或状态
  alternative: 明确补作“愤怒”或改用“发怒的人”
  rationale: 本节希腊文依赖上文交代主语；使用“它”既使汉语句法完整，又避免在本节内擅自把主语具体解释为某一种表述。
- issue: “看不见义人”的含义
  choice: 保留“看不见”
  alternative: 译为“无视义人”或“看不出他是义人”
  rationale: 原文可具有字面与比喻双重张力，故不将其单一化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。重复“即使”以保留原文层层列举的节奏；后四项省去汉语中不必要的男性代词，避免机械重复，同时不改变所指对象。
