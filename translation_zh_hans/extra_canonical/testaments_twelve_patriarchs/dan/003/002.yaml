id: T12P.DAN.3.2
reference: Testament of Dan 3:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Τύφλωσις *γάρ ἐστιν ὁ θυμὸς καὶ οὐκ ἐᾷ ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/002.yaml
  text: For anger is blindness, and it does not allow one to see anyone’s face in truth.
translation:
  language: zh_hans
  text: 因为愤怒就是盲目，使人无法如实看见任何人的面容。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如实”原文直译可作“在真实中”，也可理解为“按真实情况”。
    reason: 保留ἐν ἀληθείᾳ在方式义与较字面表达之间的幅度，避免把它无声地限定为单一解释。
lexical_decisions:
- source_word: θυμός
  choice: 愤怒
  rationale: 此处指强烈的怒气；“愤怒”是现代汉语中自然、庄重且不过度解释的对应词。
- source_word: τύφλωσις
  choice: 盲目
  rationale: 原词意为失明、盲目；在“愤怒就是……”的判断句中，“盲目”既保留比喻，也比“失明”更符合现代汉语表达。
- source_word: πρόσωπόν τινος
  choice: 任何人的面容
  rationale: πρόσωπον直指人的脸或面容，τινος在否定结构中具有“任何人”的含义；保留“面容”这一具体意象，而不泛化为“看待别人”。
- source_word: ἐν ἀληθείᾳ
  choice: 如实
  rationale: 表达按真实情况、真实地看见之意；“如实”简洁自然，同时不把短语限定为抽象的教义性“真理”。
theological_decisions:
- issue: “ἐν ἀληθείᾳ”应理解为“真实地”还是“在真理中”
  choice: 正文译作“如实”
  alternative: “在真实中”或“在真理中”
  rationale: 语境讨论愤怒扭曲人的视线，因此方式义“如实”最自然；脚注保留较贴近形式、也可能具有更宽含义的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使人无法”自然传达οὐκ ἐᾷ（不容、不让）的结果；保留“面容”意象，不改写成较抽象的“正确看待别人”。
