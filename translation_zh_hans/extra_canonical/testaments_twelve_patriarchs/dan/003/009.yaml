source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Διὰ τοῦτο¹¹ ὁ θυμούμενος¹², *ἐὰν μὲν ᾖ¹³ *δυνατὸς ⌈τῷ σώματι⌉¹⁴, *τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται¹⁵· μίαν¹⁶ μὲν ἀπὸ¹⁷ τῆς βοηθείας *τῶν ὑπουργούντων¹⁸. *δεύτερον δὲ¹⁹ διὰ τοῦ πλούτου *πείθων καὶ νικῶν [αὐτὸν] ἀδίκως²⁰. *τρίτον τὴν²¹ φυσικὴν ἔχων *δύναμιν δι'' αὐτῆς δρᾷ²² τὸ κακόν²³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/009.yaml
  text: 'Therefore the one who is angry, if he is strong in body, has acquired threefold power in his anger: one from the help of attendants; a second through wealth, persuading and prevailing unjustly; and a third, having natural strength, by it he does evil.'
translation:
  language: zh_hans
  text: 所以，发怒的人若身体强壮，他在怒气中就有三重力量：第一重来自侍从的帮助；第二重借着财富，不义地劝服并取胜；第三重是他天生的力量，他凭这力量作恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θυμούμενος
  choice: 发怒的人
  rationale: 以自然、直接的现代汉语表达正在动怒或受怒气支配的人，不额外引入道德判断。
- source_word: δυνατὸς τῷ σώματι
  choice: 身体强壮
  rationale: 贴近希腊文“在身体方面有力量”，并符合现代汉语习惯。
- source_word: τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται
  choice: 他在怒气中就有三重力量
  rationale: 保留“怒气中”与“三重力量”的结构；不采纳修订层曾出现但本段希腊文未明示的“在心灵中”。
- source_word: τῶν ὑπουργούντων
  choice: 侍从
  rationale: 指为其效力、听其差遣的人；“侍从”简洁地保留其从属协助关系。
- source_word: διὰ τοῦ πλούτου πείθων καὶ νικῶν ἀδίκως
  choice: 来自财富，借此劝服别人，以不义取胜
  rationale: 将财富理解为施行劝服和取胜的手段；补出“别人”仅为满足汉语宾语需要，不指定具体对象。
- source_word: φυσικὴν ... δύναμιν
  choice: 本有的体力
  rationale: 结合前文“身体强壮”，将自然具有的力量表达为“本有的体力”，避免误解为抽象或超自然能力。
- source_word: δι’ αὐτῆς δρᾷ τὸ κακόν
  choice: 他凭这力量作恶
  rationale: 准确呈现以该力量为手段实施恶事。
theological_decisions:
- issue: 怒气与力量的关系
  choice: 保留“在怒气中有三重力量”的表述
  alternative: 解释为“怒气使他的力量增至三倍”
  rationale: 原文描述三重来源或形态，但未明确断言力量在数量上增至三倍，故不作强化解释。
- issue: 财富所造成的不义结果
  choice: 译作“劝服别人，以不义取胜”
  alternative: 译作“收买并压倒对方”
  rationale: πείθων 与 νικῶν 分别具有“劝服”和“取胜”的基本含义；不把财富的作用限定为贿赂，也不将胜出具体化为暴力压制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用“第一重、第二重、第三重”清楚对应三重力量，并保持原文警戒性的伦理语气。
