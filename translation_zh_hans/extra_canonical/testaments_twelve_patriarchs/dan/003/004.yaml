revisions:
- from: 因为愤怒之灵用迷惑的网缠住他，使他的眼睛失明；又借着虚假使他的心思昏暗，把自己的眼光给了他。
  to: 因为愤怒之灵用迷惑的网缠住他，使他的眼目失明；又借着虚假使他的心思昏暗，使他有了他自己的眼光。
  rationale: 修订仅处理末句的指代呈现和中文搭配：以“他自己的眼光”将“自己的”明确连于受影响者“他”，避免原译将其归于愤怒之灵；“使他有了”自然表达“给他/使他具备”。其余措辞保留，维持原文的意象、动作次序和庄重语体。
