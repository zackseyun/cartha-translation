source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Περιβάλλεται γὰρ ⌈αὐτὸν⌉⁷ τὸ πνεῦμα τοῦ θυμοῦ τὸ δίκτυον τῆς πλάνης²¹ καὶ τυφλοῖ τοὺς²² ὀφθαλμοὺς αὐτοῦ, καὶ¹ διὰ τοῦ ψεύδους σκοτοῖ²³ τὴν διάνοιαν ⌈αὐτοῦ⌉⁷²⁴, καὶ τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/004.yaml
  text: For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision.
translation:
  language: zh_hans
  text: 因为愤怒之灵用迷惑的网缠住他，使他的眼目失明；又借着虚假使他的心思昏暗，使他有了他自己的眼光。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: 愤怒之灵
  rationale: 保留属格结构及原文将愤怒人格化、灵体化的表达，不弱化为单纯的“怒气”。
- source_word: τὸ δίκτυον τῆς πλάνης
  choice: 迷惑的网
  rationale: δίκτυον直译为“网”；πλάνη兼有迷惑、欺骗与误入歧途之意，此处译作“迷惑”以保留其使人偏离正道的作用，并与后文“虚假”区分。
- source_word: τυφλοῖ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: 使他的眼睛失明
  rationale: 按原文保留具体的身体意象；“使……失明”自然表达使役含义。
- source_word: διὰ τοῦ ψεύδους
  choice: 借着虚假
  rationale: 保留διά加属格所表达的手段；ψεῦδος可指谎言或虚假，抽象名词“虚假”更贴合此处无特定谎言内容的语境。
- source_word: τὴν διάνοιαν
  choice: 心思
  rationale: 指理解、思想与辨识的内在官能；“心思”比“头脑”更庄重，也避免将其仅限于理智能力。
- source_word: τὴν ἰδίαν ὅρασιν
  choice: 自己的眼光
  rationale: 保留ἰδίαν回指“愤怒之灵”的自然语法关系；ὅρασις可指视觉或看事物的方式，译作“眼光”兼顾与前文眼睛意象的联系及认知层面的含义。
theological_decisions:
- issue: “自己的”所指对象
  choice: 按最近且处于主语位置的“愤怒之灵”理解，即愤怒之灵把它自己的眼光给人
  alternative: 理解为把那人自己的视觉还给他，或给他一种属于他自己的看法
  rationale: 原文αὐτῷ明确指受影响的人，而τὴν ἰδίαν ὅρασιν中的ἰδίαν通常回指句子主语“愤怒之灵”；保留“自己的”而不加解释性词语，也让原文可能存在的指代张力继续可见。
- issue: “愤怒之灵”的本体性质
  choice: 保留原文称谓，不明确判定为独立邪灵或拟人化力量
  alternative: 译为“怒气”或明确译作“愤怒的邪灵”
  rationale: 原文只说“愤怒之灵”，译文不应额外导入具体的灵界分类或将其完全心理化。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。用分号梳理连续并列动作，保持“缠住—使失明—使昏暗—给予眼光”的递进结构；不添加原文没有的神学解释。
