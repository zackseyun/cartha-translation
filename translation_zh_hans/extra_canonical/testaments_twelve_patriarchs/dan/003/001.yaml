  choice: 依现存片段直译为“……真理和恒久忍耐，你们就必灭亡”
  alternative: 补出“若离弃/若不持守真理和恒久忍耐”
  rationale: 所给希腊文只是句末片段，缺少支配两个宾格名词的前文；不擅自补足条件或动词，以保留文本残缺及句法开放性。
