lexical_decisions:
- source_word: ἀλήθειαν
  choice: 真理
  rationale: 保留名词的抽象及伦理含义，与原文直接对应。
- source_word: μακροθυμίαν
  choice: 恒久忍耐
  rationale: 既表达长久忍受，也保留克制、不轻易发怒的含义；比单用“忍耐”更充分。
- source_word: ἀπολεῖσθε
  choice: 你们就必灭亡
  rationale: 该动词为第二人称复数将来时中间语态，语境中表达毁灭或灭亡的结果；“必”体现将来陈述的确定性。
