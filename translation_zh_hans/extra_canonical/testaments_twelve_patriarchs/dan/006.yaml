  revised_text: '《但的遗训》第6章


    1 现在，我的孩子们，你们要敬畏主，也要提防撒但和他的诸灵。2 你们要亲近上帝，也要亲近那位为你们代求的天使；因为他是上帝与人之间的中保[b]，并且为了以色列的和平，他必在上帝的国对面站立[a]。3 因此，仇敌竭力要绊倒所有呼求主的人。4 因为他知道，以色列回转的那一天，仇敌的国就必终结。5 和平的天使必亲自坚固以色列，使以色列不至陷入诸恶的极处。


    6 然而，在以色列不法的时期，主不会离开他们，却要转往一个寻求他旨意的民族，因为没有一个天使能与他相比[c]。7 他的名必传遍以色列各处，也传到列国之中。


    8 所以，我的孩子们，你们要保守自己，远离一切恶行；要从你们中间除去愤怒和虚假，并要喜爱真理和忍耐。9 你们从父亲这里所听见的，也要传给你们的儿女，［好让列国的救主接纳你们；因为他真实而忍耐，温柔而谦卑，并借着行为教导主的律法。］[d] 10 所以，你们要远离一切不义，持守上帝的义；你们的后裔就必成为救恩，直到永远。11 你们要把我安葬在我祖先附近。


    [a] 此处希腊文本身有困难，所传文字直译近于“在上帝的国对面站立”。上下文随即谈到仇敌及其国度，因此也有人将这里理解或校订为“起来对抗仇敌的国”。正文保留所提供希腊见证的张力。


    [b] “上帝与人之间的中保”直接译自希腊文。本段同时称这位中保为“天使”，因此不进一步把他等同于后来的某一教义人物。


    [c] 这里的希腊文说，主“不会离开他们”，却又“要转往一个寻求他旨意的民族”。这两句话之间的张力保留在正文中，没有加以调和。


