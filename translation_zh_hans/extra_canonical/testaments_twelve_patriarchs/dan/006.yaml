lexical_decisions:
- source_word: φοβήθητε τὸν Κύριον
  choice: 敬畏主
  rationale: “敬畏”兼具畏惧、尊崇和顺服的劝诫意味，适合遗训体的庄重语气。
- source_word: προσέχετε ἑαυτοῖς ἀπὸ τοῦ Σατανᾶ
  choice: 提防撒但
  rationale: 自然表达反身警戒的命令语气，不弱化危险性。
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: 他的诸灵
  rationale: 紧贴所有关系，不额外规定这些灵的职能或等级。
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: 那位为你们代求的天使
  rationale: 结合随后“中保”的说明，παραιτουμένῳ在此最自然地表示替人恳求或代求。
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: 上帝与人之间的中保
  rationale: 保留μεσίτης的中介、调停含义，并维持原文的神学张力。
- source_word: κατέναντι τῆς βασιλείας τοῦ θεοῦ στήσεται
  choice: 必在上帝的国对面站立
  rationale: 所提供的希腊文本写作“上帝的国”，但上下文似乎预期“仇敌的国”；采用较为形式对应且保留歧义的表达，并以脚注说明。
- source_word: ὑποσκελίζειν
  choice: 绊倒
  rationale: 保留动词使人失足跌倒的生动比喻。
- source_word: ἐπιστρέψει Ἰσραήλ
  choice: 以色列回转
  rationale: 既可表示返回，也自然带出道德和宗教意义上的转回，而不将其技术化为特定术语。
- source_word: συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ
  choice: 仇敌的国就必终结
  rationale: 在此语境中表示仇敌统治的完结，而不是积极意义上的成全。
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: 和平的天使
  rationale: 直接保留原文称谓，不进一步界定其身份。
- source_word: εἰς τέλος κακῶν
  choice: 罪恶的极处
  rationale: 表达κακῶν达到极端或尽头的严重性；“罪恶”在此比泛称“坏事”更符合道德语境。
- source_word: κολλήθητε τῇ δικαιοσύνῃ τοῦ Θεοῦ
  choice: 持守上帝的义
  rationale: κολλάω本有紧紧依附之意；“持守”在现代中文中庄重自然，也保留持续不离的力度。
- source_word: θάψατέ με ἐγγὺς τῶν πατέρων μου
  choice: 把我安葬在我祖先附近
  rationale: 准确表达临终安葬吩咐；πατέρων在此按家族墓葬语境译作“祖先”。
theological_decisions:
- issue: 代求天使与“上帝与人之间的中保”的身份
  choice: 按本章自身措辞译为一位天使性的代求者和中保，不作进一步身份认定。
  alternative: 将其明确认定为以色列的守护天使、弥赛亚人物，或后期基督教化的基督指称。
  rationale: 希腊文明确同时使用“天使”和“中保”，译文应保存这两项陈述，而非用后来的教义体系消除其张力。
- issue: 第2节“在上帝的国对面站立”的困难文本
  choice: 正文依所提供希腊文保留“上帝的国”，用“对面”保持κατέναντι可能含有的空间性和对立性。
  alternative: 依据上下文直接改译为“起来对抗仇敌的国”。
  rationale: 传本文字与上下文存在明显张力；不应在没有完整校勘依据时静默改写，故以脚注列出语境所支持的另一理解。
- issue: 第6节主不离开以色列却转往另一民族
  choice: 两项陈述均照译，并以脚注指出张力。
  alternative: 删去否定词，译成主将离开以色列；或另设“转往”的隐含主语。
  rationale: 所给希腊见证含否定语，正文不以神学和谐化方式擅自删除或变更主语。
- issue: 第9节“列国的救主”段落的文本地位
  choice: 翻译并置于方括号内。
  alternative: 作为非原文完全删去，或不加标识地视为正文固有部分。
  rationale: 该句见于所提供的希腊见证，却已由来源以括号标示，且常被视为后期增补；方括号能同时保存见证和文本透明度。
- issue: “上帝的义”与后裔永远蒙拯救
  choice: 保持劝诫与应许之间的直接联系，不增添因果限定或系统神学解释。
  alternative: 将其解释为功德换取救恩，或插入仅属某一传统的称义框架。
  rationale: 原文只陈述远离不义、持守上帝的义以及后裔得救之间的联系，译文不应超出其措辞。
translation_notes:
  register: 采用现代标准普通话的庄重遗训体。命令句清楚有力，但避免过度古雅；使用“敬畏、代求、中保、回转、不义”等普通读者可理解且具有经文语域的词。保留“以色列”在代词上作单数整体的原文特征，但在中文中尽量减少生硬之处。第11节虽未见于英语咨询层正文，仍按所给希腊原文完整译出。
