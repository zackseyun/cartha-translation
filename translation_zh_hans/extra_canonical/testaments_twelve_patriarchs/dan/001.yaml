revisions:
- from: '《雅各和辟拉的第七子但的遗训》


    1 以下是但的话的抄本，是他在世的末后日子，就是一百二十五岁那年，对自己的众子所说的。[a]


    2 他召集自己的全家，说：“但的众子啊，要听我的话，留心你们父亲的言语。


    3 我在心里，也用自己的一生验证了：诚实并秉公行义，是美善而蒙上帝喜悦的；虚假和愤怒却是邪恶的，会教人行各样恶事。


    4 所以，我的孩子们，今天我要向你们承认：我曾在心里立意要杀死我的兄弟约瑟，那个善良而诚实的人。


    5 他被卖时，我还为此高兴，因为父亲爱他胜过爱我们。


    6 原来，嫉妒和傲慢的灵不断对我说：‘你自己不也是他的儿子吗？’


    7 彼列诸灵中的一个也在助长我心中的恶念，对我说：‘拿起剑来，用它杀死约瑟；他死后，你父亲就会爱你了。’


    8 这就是那劝诱我的愤怒之灵；它要我像豹子吞噬山羊羔一样，也把约瑟毁灭。[b]


    9 但我列祖的上帝没有让他落在我手中，免得我独自遇见他，把他杀死，使以色列的第二根权杖折断。[c]”'
