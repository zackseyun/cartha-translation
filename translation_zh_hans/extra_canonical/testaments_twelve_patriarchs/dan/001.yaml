  text: 'In the fifth year of his life[a], Dan called together his family and said:


    2. “Hear my words, sons of Dan, and pay attention to the words of your father.

    3. I have tested in my heart, and in all my life, that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.

    4. So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.

    5. And I rejoiced over his being sold, because his father loved him more than us.

    6. For the spirit of jealousy and of arrogance kept saying to me, ‘You yourself also are his son.’

    7. And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you when he is dead.’

    8. Now this was the spirit of anger persuading me, that just as a leopard devours a young goat, so I too should destroy Joseph.

    9. But the God of my fathers did not give him into my hands[b], so that I might find him alone and kill him and commit this lawless deed[c], lest two tribes be destroyed from Israel.”'
translation:
  language: zh_hans
  text: '《雅各和辟拉的第七子但的遗训》


    1 以下是但的话的抄本，是他在一百二十五岁、临终的日子对众子所说的。[a]


    2 他召集自己的全家，说：“但的众子啊，要听我的话，留心你们父亲的言语。


    3 我在心里并在一生中都体验过：诚实和行义是美善、蒙上帝喜悦的；虚假和愤怒却是邪恶的，会教人行各样恶事。


    4 所以，我的孩子们，今天我要向你们承认：我曾在心里定意要害死我的兄弟约瑟，那个良善而真实的人。


    5 他被卖时，我还为此高兴，因为父亲爱他胜过爱我们。


    6 原来，嫉妒和傲慢的灵不断对我说：‘你自己不也是父亲的儿子吗？’


    7 彼列诸灵中的一个也与我一同作工，对我说：‘拿起剑来，用它杀死约瑟；他死后，你父亲就会爱你了。’


    8 这就是那劝诱我的愤怒之灵；它劝我如豹子吞噬山羊羔那样吞灭约瑟。[b]


    9 但我列祖的上帝没有让他落在我手中，免得我独自遇见他，把他杀死，并使以色列的第二根权杖折断。[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“一百二十五岁那年”。英文咨询文本中的“五岁”与所给希腊文不符，可能源于传抄或处理时脱漏了“百二十”。
    reason: source_correction
  - marker: b
    text: 本节希腊文本有明显疑难，相关动词在部分文本形态中可形成“吸干”一类更怪异、强烈的捕食图像。正文依上下文保留豹子吞噬猎物及愤怒驱使但杀害约瑟的整体意思，未试图确定每一处损坏句法的细节。
    reason: textual_variant
  - marker: c
    text: “权杖”可象征统治权、族长权柄或支派。这里的“第二根权杖”意义不完全确定，可能与约瑟所出的两个支派有关；正文保留原文意象。另有文本形态作“我父亲雅各的上帝”，而非“我列祖的上帝”。
    reason: ambiguity_and_alternative_reading
lexical_decisions:
- source_word: ἀντίγραφον λόγων
  choice: 话的抄本
  rationale: ἀντίγραφον指书面副本或抄本；保留遗训文学开头自称为记录文本的形式。
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: 在世的末后日子
  rationale: 直译其临终语境，同时避免把它误解为普世性的“末世”。
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει
  choice: 一百二十五岁那年
  rationale: 希腊文明确为第一百二十五年；不采用英文咨询层中缺少“百二十”的“五岁”。
- source_word: προσέχετε
  choice: 留心
  rationale: 符合父亲劝诫众子的命令语气，现代、简洁而庄重。
- source_word: ἀλήθεια
  choice: 诚实
  rationale: 本段与虚假形成伦理品格上的对照；“诚实”比抽象的“真理”更贴合行为语境。
- source_word: δικαιοπραγία
  choice: 秉公行义
  rationale: 该词强调实行正义；此译保留实践意味，并符合中文伦理劝诫的庄重语体。
- source_word: ψεῦδος
  choice: 虚假
  rationale: 保留抽象恶德的性质，与“诚实”对应，不局限于一次具体谎言。
- source_word: θυμός
  choice: 愤怒
  rationale: 作为全章反复出现的核心恶德，采用稳定且自然的现代中文对应词。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 语境是但因父亲偏爱约瑟而心生怨恨，“嫉妒”准确表达这种关系性的恶念。
- source_word: ἀλαζονεία
  choice: 傲慢
  rationale: 表达自高和自负的恶德，现代读者易懂。
- source_word: πνεύματα τοῦ Βελίαρ
  choice: 彼列诸灵
  rationale: 保留Βελίαρ作为邪恶权势的专名，不将其淡化为一般心理冲动；“彼列”采用较自然的汉语音译传统。
- source_word: ἄνελε
  choice: 杀死
  rationale: 命令直接而残酷，“杀死”忠实保留力度，不使用古奥措辞。
- source_word: πάρδαλις
  choice: 豹子
  rationale: 以现代汉语常用动物名呈现鲜明的捕食意象。
- source_word: σκῆπτρον δεύτερον
  choice: 第二根权杖
  rationale: 保留原文的象征性表达及其含混性，不在正文中直接解释为“支派”。
theological_decisions:
- issue: 彼列及其诸灵是人格化的邪恶力量还是心理冲动
  choice: 保留“彼列诸灵中的一个”，并另提其助长但心中的恶念
  alternative: 译作“一个邪灵”或纯粹译为“邪恶冲动”
  rationale: 希腊文明确保留彼列之名及诸灵的框架；正文同时不抹去但本人的道德责任。
- issue: 上帝拦阻与但的罪责之间的张力
  choice: 译为上帝“没有让他落在我手中”，而但承认自己已有杀意
  alternative: 弱化为偶然没有遇见约瑟，或说上帝直接消除了但的恶念
  rationale: 原文同时陈述上帝的拦阻与但真实的杀人意图，应保留二者而不作教义化调和。
- issue: “以色列的第二根权杖”的含义
  choice: 正文保留象征说法“第二根权杖”
  alternative: 直接解释为“以色列的两个支派”或“第二个支派”
  rationale: σκῆπτρον可象征统治权、族长权柄或支派；原文表达本身不够明确，正文不宜替作者消除含混。
translation_notes:
  register: 采用现代标准普通话的庄重遗训语体，句式清楚，适合普通读者朗读。标题保留古代作品的全称；正文按希腊文恢复第1节的抄本说明、临终时点和一百二十五岁。对第8节文本损坏处采取意义对等并加注，对第9节“权杖”意象则形式保留，以免过度解释。
