  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/005.yaml
  text: And I rejoiced over his being sold, because his father loved him more than us.
translation:
  language: zh_hans
  text: 我因他被卖而欢喜，因为父亲爱他胜过爱我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχαιρον
  choice: 欢喜
  rationale: 保留未完成时所表达的当时持续或延展的情绪，同时以自然、庄重的现代汉语呈现。
- source_word: ἐπὶ τῇ πράσει αὐτοῦ
  choice: 因他被卖
  rationale: πρᾶσις 指售卖之事；结合属格代词，译为“他被卖”比名词化的“他的售卖”更符合现代汉语。
- source_word: ὑπὲρ ἡμᾶς
  choice: 胜过爱我们
  rationale: 在比较语境中表示父亲对他的爱超过对“我们”的爱；补出第二个“爱”使比较关系清楚。
- source_word: ὁ πατὴρ
  choice: 父亲
  rationale: 希腊文有定冠词，但此处可自然理解为兄弟共同的父亲；汉语无需添加“他的”，以免误导为只有约瑟的父亲。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言；保留说话者因约瑟被卖而欢喜这一尖锐的道德张力，不作缓和或解释。
