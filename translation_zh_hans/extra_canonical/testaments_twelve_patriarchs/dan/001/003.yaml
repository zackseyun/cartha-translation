base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/003.yaml
  text: I have tested in my heart and in all my life that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.
translation:
  language: zh_hans
  text: 我在心中和整个一生中验证过：真理与公义的行为相伴，是美善且蒙上帝喜悦的；虚假和愤怒是邪恶的，教人学会一切恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείρασα
  choice: 验证了
  rationale: 表达亲身经历、检验而确认之意；比单纯“尝试”更符合此处由内心和一生所得的认识。
- source_word: ἡ ἀλήθεια μετὰ δικαιοπραγίας
  choice: 真理连同公义的行为
  rationale: 保留μετά所表达的伴随关系，不将“真理”与“行义”合并成单一概念。
- source_word: καλὸν καὶ θεῷ εὐάρεστον
  choice: 美善而蒙上帝喜悦的
  rationale: 分别呈现καλόν的美善与εὐάρεστον的蒙悦纳、讨喜含义，并自然表达与格θεῷ。
- source_word: τὸ ψεῦδος
  choice: 虚假
  rationale: 可涵盖谎言、欺骗及不真实，符合抽象名词用法。
- source_word: ὁ θυμός
  choice: 愤怒
  rationale: 此处与虚假并列为邪恶并引人作恶，译作现代汉语常用的“愤怒”。
- source_word: πᾶσαν κακίαν
  choice: 各样恶事
  rationale: 自然传达“所有/各种邪恶”，并适合ἐκδιδάσκοντα所指向的行为性后果。
- source_word: ἐκδιδάσκοντα
  choice: 教人学会
  rationale: 保留其使人受到全面教导、训练的强烈语感，同时使中文通顺。
theological_decisions:
- issue: 真理、公义行为与蒙上帝喜悦的关系
  choice: 保持“真理连同公义的行为”整体被称为美善并蒙上帝喜悦
  alternative: 将公义行为解释为真理的定义或得救功德
  rationale: 希腊文只陈述二者相伴并蒙上帝喜悦，未进一步界定其救恩论关系，不宜引入宗派性解释。
- issue: 分词ἐκδιδάσκοντα的主语范围
  choice: 按复数意义理解为“虚假和愤怒”共同教人学会各样恶事
  alternative: 仅让最近的“愤怒”作分词的逻辑主语
  rationale: 分词为复数宾格形式，与两个并列的中性、阳性单数主语构成意义上的复数呼应；英语咨询层亦采用共同主语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号清楚呈现美善与邪恶两方面的对照；不添加原文没有的解释性神学术语。
