id: T12P.DAN.1.7
reference: Testament of Dan 1:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἐκ τῶν πνευμάτων⁴³ τοῦ Βελίαρ †συνήργει⁴⁴ μοι, ὅτι⁴⁵· *Λαβὲ τὸ ξίφος καὶ ⌜ἐν τούτῳ⌝⁴⁶ ἄνελε τὸν Ἰωσήφ⁴⁷, καὶ ἀγαπήσει σε ὁ πατήρ⁴⁸, ἀποθανόντος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/007.yaml
  text: And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you after he dies.’
translation:
  language: zh_hans
  text: 彼列的诸灵中，有一个与我一同作工，对我说：“拿起这把剑，用它杀死约瑟；他死后，你父亲就会爱你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他死后”：原文没有明说“他”指约瑟还是父亲；按上下文，较可能指约瑟。
    reason: 说明希腊文属格独立结构中αὐτοῦ的指代歧义，同时给出较自然的语境判断而不改写正文。
lexical_decisions:
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用现代中文圣经语境中常见的音译，保留其专名性质，不另行加入“魔王”等解释。
- source_word: ἐκ τῶν πνευμάτων τοῦ Βελίαρ
  choice: 彼列的诸灵中，有一个
  rationale: 按希腊文的部分结构表达“诸灵中的一个”，并保留“灵”这一较为中性的原词用语，不擅自增译为“邪灵”。
- source_word: συνήργει μοι
  choice: 与我一同作工
  rationale: 体现未完成时所描写的持续或进行中状态，也忠实保留“共同做工、协助”的含义。
- source_word: ἐν τούτῳ
  choice: 用它
  rationale: 明确指回前面的“剑”，以自然简洁的现代汉语表达工具含义。
- source_word: ἄνελε
  choice: 杀死
  rationale: 直接传达命令式动词在此处“除掉、杀死”的意义。
theological_decisions:
- issue: ἀποθανόντος αὐτοῦ中代词所指
  choice: 译作“他死后”，在正文中保留代词歧义
  alternative: 明确译作“约瑟死后”
  rationale: 希腊文阳性单数代词在语法上可能回指约瑟，也可能被读者联系到紧邻语境中的父亲；不在正文中替原文消除这种指代张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“与我一同作工”略带经文语体，但普通读者仍易理解；引语保持直接、紧迫的命令语气。
