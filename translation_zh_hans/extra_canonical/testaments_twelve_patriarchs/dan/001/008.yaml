revisions:
- from: 这就是那劝诱我的愤怒之灵：正如豹子吸干一只小山羊[a]，它也把吸干约瑟的念头放进我心里。
  to: 这正是那劝诱我的愤怒之灵：正如豹子吸干一只小山羊[a]，它照样把要吸干约瑟的念头放进我心里。
  rationale: 修订不改变经文的叙述责任结构或掠食意象。以“照样”明确翻出比较副词οὕτως；以“把要吸干约瑟的念头放进我心里”保留愤怒之灵将意图植入说话者内里的表达。脚注改用审慎措辞，说明底本标记而不武断界定其校勘性质。
