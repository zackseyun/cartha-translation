source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Τοῦτο δὲ ἦν τὸ πνεῦμα τοῦ θυμοῦ τὸ πεῖθόν με⁴⁹· ὥσπερ⁵⁰ πάρδαλις †ἐκμύζουσα⁵¹ ἔριφον, ἵνα οὕτως *⌜ἐμοὶ ἐνέβαλεν⌝ †ἐκμυζῆσαι⁵² τὸν Ἰωσήφ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/008.yaml
  text: This was the spirit of anger persuading me, that just as a leopard sucks out a young goat, so it put into me to suck out Joseph.
translation:
  language: zh_hans
  text: 这正是那劝诱我的愤怒之灵：正如豹子吸干一只小山羊[a]，它照样把要吸干约瑟的念头放进我心里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吸干”所据的希腊文本在这里及后半句都标为存疑；现存读法表达“吸出、吸干”，并将这个词用于约瑟。
    reason: 底本在ἐκμύζουσα和ἐκμυζῆσαι处均有存疑标记。脚注提示文本状况，同时保留当前读法在前后两处的重复意象。
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: 愤怒之灵
  rationale: 保留“灵”与“愤怒”的属格结构，不把它弱化为单纯的情绪或冲动。
- source_word: τὸ πεῖθόν με
  choice: 那劝诱我的
  rationale: πείθω在此描述愤怒之灵对说话者的内在诱导；“劝诱”既保留说服意味，也符合负面语境。
- source_word: πάρδαλις
  choice: 豹子
  rationale: 采用现代汉语中自然、明确的动物名称。
- source_word: ἔριφον
  choice: 一只小山羊
  rationale: 指幼小的山羊；“小山羊”比偏书面的“山羊羔”更自然。
- source_word: ἐκμύζουσα / ἐκμυζῆσαι
  choice: 吸干／吸干
  rationale: 保留两个同源词形成的刻意重复及其强烈、怪诞的掠食意象，不改写为“压碎”或泛化为“毁灭”。
- source_word: ἐμοὶ ἐνέβαλεν
  choice: 把……的念头放进我心里
  rationale: 以自然汉语表达“放入我里面”的内在驱使，同时避免直接改写成说话者自主决定要这样做。
theological_decisions:
- issue: “愤怒之灵”是人格化灵体还是对愤怒力量的拟人表达
  choice: 保留“愤怒之灵”
  alternative: 愤怒的冲动／怒气
  rationale: 希腊文明确使用πνεῦμα；译文不裁定其本体性质，保留原文可能具有的神学张力。
- issue: 行动意图的责任与外在诱导之间的关系
  choice: 译作“它也把……的念头放进我心里”
  alternative: 所以我也要毁灭约瑟
  rationale: 原文将诱导归于愤怒之灵，但仍以第一人称讲述其内在经验；译文不把它简化为完全自主的决定，也不据此免除说话者责任。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“劝诱”体现负面引导，“把……的念头放进我心里”使希腊语的内在投放意象在汉语中自然可读；保留前后两次“吸干”的修辞重复。
