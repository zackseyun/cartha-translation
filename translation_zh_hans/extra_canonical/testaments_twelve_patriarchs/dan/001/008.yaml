  naturalness: “把……的念头放进我心里”是自然的现代汉语，也能传达ἐμοὶ ἐνέβαλεν的内在植入意象。调整语序为“把要……的念头放进我心里”后更顺畅；“这正是”也比“这就是”更合乎回顾叙事中ἦν的语气。
  terminology: “愤怒之灵”“豹子”“小山羊”和“吸干”均可保留。“吸干”虽带有强烈而怪诞的画面，正对应底本当前读法的ἐκμύζουσα／ἐκμυζῆσαι，不宜弱化为“毁灭”或“杀害”。脚注宜仅说明版本文字标记为存疑，不擅自断定其必为“讹”。
