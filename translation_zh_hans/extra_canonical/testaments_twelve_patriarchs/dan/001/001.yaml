  source_fidelity: 译文总体准确传达标题、但的临终讲话抄本、对象、时段及一百二十五年的年龄说明。为更明确对应希腊文的属格关系，标题宜明说“所生”；正文中“生命末后的日子”不合现代汉语惯用表达，宜改为“他一生末后的日子”。
  naturalness: “在生命末后的日子”搭配生硬；“雅各和辟拉的第七个儿子”虽可理解，但“雅各和辟拉所生的”更清楚自然。其余句式庄重、简明，适合本书文体。
  terminology: “遗训”可恰当表达此处作品标题的临终训诲性质，不必译作具有契约神学含义的“约”。“辟拉”“抄本”均合适。
  issues:
