  text: Testament of Dan, the seventh son of Jacob and Bilhah. A copy of the words of Dan, which he spoke to his sons in the last days of his life, in the 125th year of his life.
translation:
  language: zh_hans
  text: '雅各和辟拉所生的第七个儿子但的遗训


    一　这是但的话的抄本，是他在一生末后的日子、在他一生的第一百二十五年对自己的众子所说的。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: 遗训
  rationale: 在本书标题语境中指先祖临终留下的训言；译作“遗训”比“约”更符合文体，也不预先赋予契约含义。
- source_word: Βάλλας
  choice: 辟拉
  rationale: 采用现代中文圣经中该人名的通行译法。
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 保留原文所表达的“副本、誊本”含义，不泛化为“记录”。
- source_word: λόγων
  choice: 话
  rationale: 在临终训言的上下文中自然通顺，同时保留其可指言辞或教导的宽度。
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: 在生命末后的日子
  rationale: 明确“他的日子”在此指人生晚期，避免误读为末世性的“末日”。
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: 他一生的第一百二十五年
  rationale: 贴近希腊文纪年表达，并以自然的现代汉语呈现。
theological_decisions:
- issue: 标题中 Διαθήκη 的含义
  choice: 遗训
  alternative: 遗嘱／约
  rationale: 此处是作品类型标题，内容为临终训诲；“遗训”既保留庄重感，也避免把它限定为法律遗嘱或神学意义上的约。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。标题独立成行；正文保留“抄本”这一文本传承用语，并依原文保留“自己的众子”及第一百二十五年的时间说明。
