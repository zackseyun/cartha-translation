source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ᾿Αλλ᾿ ὁ Θεὸς *τῶν πατέρων⁵³ μου οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου, ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ, καὶ ποιήσω⁶¹ λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/009.yaml
  text: But the God of my fathers did not allow him to fall into my hands, so that I might find him alone and kill him, and bring about the loosing of a second tribe from Israel.”
translation:
  language: zh_hans
  text: 但我祖先的上帝没有容许他落在我手中，免得我在他独自一人时找到他，把他杀死，使以色列的第二根权杖被废除。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使以色列的第二根权杖被废除”也可理解为“使以色列再失去一个支派”。原文“权杖”可能以部族的权柄代指支派；所译“被废除”的词也可指被解开、解除或瓦解。
    reason: 原句ποιήσω λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ的意象和句法罕见。脚注保留“权杖”的字面比喻，并说明其可能的支派转喻及λυθῆναι较宽的语义范围。
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: 我祖先的上帝
  rationale: 忠实表达属格关系，并以现代汉语自然措辞保留先祖信仰传承的含义。
- source_word: οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου
  choice: 没有容许他落在我手里
  rationale: 保留原文“容许”与“落入手中”的意象，而不改写为较强的“交在我手中”。
- source_word: κατὰ μόνας
  choice: 独自一人时
  rationale: 表达趁对方落单、无人相伴的处境。
- source_word: ἀνελῶ
  choice: 将他杀死
  rationale: 在此语境中明确表示杀害，而非较含混的“除掉”。
- source_word: σκῆπτρον δεύτερον
  choice: 第二根权杖
  rationale: 保留希腊文“权杖”的具体意象及“第二”的修饰关系，不在正文中直接将其释为“支派”。
- source_word: λυθῆναι
  choice: 折断
  rationale: 该动词基本义为解开、解除或瓦解；与“权杖”搭配时，“折断”以自然汉语传达其被废除、毁坏的结果，同时脚注说明字面范围。
theological_decisions:
- issue: ἵνα 位于否定的“没有容许”之后所表达的目的或避免的结果
  choice: 免得
  alternative: 以致我不能／为要不让我
  rationale: 上下文表明上帝的阻止避免了但杀死约瑟及其后果；“免得”自然表达受否定主句支配的目的，同时不额外阐释神意。
- issue: “第二根权杖”是否直接等同于以色列的一个支派
  choice: 正文保留权杖隐喻，脚注说明可能指支派
  alternative: 使以色列失去第二个支派
  rationale: σκῆπτρον 可转喻支派或部族权柄，但原文仍使用“权杖”；保留隐喻可避免把解释写死，并保存文本的含混与神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“落在我手里”“权杖折断”保留原文意象；句式经过适度调整，以“免得”清楚连接上帝的阻止与但原拟实施的杀害。
