  text: For the spirit of jealousy and arrogance kept saying to me, ‘You yourself also are his son.’
translation:
  language: zh_hans
  text: 因为嫉妒和狂傲的灵一直对我说：“你自己也是他的儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς ἀλαζονείας
  choice: 嫉妒和狂傲的灵
  rationale: ζῆλος在此语境中指嫉妒；ἀλαζονεία指自负、狂傲。保留“灵”的人格化表达，不将其弱化为单纯情绪。
- source_word: ἔλεγέ μοι
  choice: 不断对我说
  rationale: 未完成时表示持续或反复进行的言说。
- source_word: Καίγε σὺ αὐτὸς
  choice: 你自己不也……吗
  rationale: 以自然汉语反问体现καίγε与强调代词σὺ αὐτός所表达的“你本人也”的强调意味。
- source_word: υἱὸς αὐτοῦ εἶ
  choice: 是他的儿子
  rationale: 直译亲属关系与所属代词，不增补原文未明说的人名。
theological_decisions:
- issue: “嫉妒和狂傲的灵”是人格化邪灵还是内在倾向
  choice: 保留“灵”的原文措辞
  alternative: 译作“嫉妒和狂傲的念头”
  rationale: 原文明确使用πνεῦμα并让其说话；译文保留其可能的超自然或人格化含义，而不替读者消解歧义。
- issue: 末句的陈述或反问语气
  choice: 译为反问句
  alternative: “你自己也是他的儿子。”
  rationale: 希腊文形式上可作陈述，但在诱导性话语中，汉语反问更自然地传达“你不也同样有资格吗”的强调；命题内容不变。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“狂傲”比“傲慢”更能体现ἀλαζονεία所含的自夸与僭越色彩；用“不断”呈现希腊语未完成时。
