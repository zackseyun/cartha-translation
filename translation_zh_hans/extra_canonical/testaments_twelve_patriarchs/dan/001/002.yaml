  text: Hear my words, sons of Dan, and pay attention to the words of your father.
translation:
  language: zh_hans
  text: 他召集了自己的家族，说：“但的儿子们，要听我的话，留心你们父亲所说的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν πατρίαν αὐτοῦ
  choice: 自己的家族
  rationale: πατριά在此指家族、宗族群体；结合“召集”这一动作，译作“家族”自然且不把范围限定为直系儿女。
- source_word: Ἀκούσατε
  choice: 要听
  rationale: 保留复数命令语气，并采用自然的现代汉语表达。
- source_word: λόγων μου
  choice: 我的话
  rationale: 直译λόγοι，同时符合汉语中长辈训诫子孙的表达。
- source_word: προσέχετε
  choice: 留心
  rationale: 表达专注听取、认真理会之意，比单纯“听”更能体现该词的强调。
- source_word: ῥήμασι τοῦ πατρὸς ὑμῶν
  choice: 你们父亲所说的
  rationale: 避免连续出现两个生硬的“话”，同时保留ῥήματα指口头言语的意义和“你们父亲”的第三人称自称方式。
