base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/004.yaml
  text: So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.
translation:
  language: zh_hans
  text: 所以，孩子们，我今天向你们承认：我心里曾就我兄弟约瑟——那良善而真实的人——的死下定决心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: 承认
  rationale: 在此为公开坦白自己内心恶念之意；“承认”自然庄重，也符合上下文中的忏悔语气。
- source_word: ἐν καρδίᾳ μου ἐθέμην
  choice: 我心里曾打定主意
  rationale: ἐθέμην（τίθημι 的中间语态）字面为“放置、立定”，与“在心里”连用表示内心定意；译为“打定主意”符合现代汉语。
- source_word: περὶ τοῦ θανάτου Ἰωσήφ
  choice: 要置……约瑟于死地
  rationale: 原文形式上是“关于约瑟的死”，与“心里立定”结合，在本句中自然指向谋求约瑟之死；正文表达其语用含义，脚注保留原文较含蓄的句法。
- source_word: τοῦ ἀγαθοῦ ἀνδρὸς καὶ ἀληθινοῦ
  choice: 他原是个良善诚实的人
  rationale: ἀγαθός 表示良善，ἀληθινός 用于人可指真实可靠、诚实；“原是”突出约瑟的品格与但的恶念之间的反差，但不增加教派性解释。
theological_decisions:
- issue: 但对约瑟之死所负责任的强度
  choice: 译作“打定主意，要置……于死地”
  alternative: “对约瑟的死作了决定”或“心里想着约瑟的死”
  rationale: περὶ 加属格本身较含蓄，但 ἐν καρδίᾳ μου ἐθέμην 表达内心定意；正文传达蓄意谋害的自然含义，同时用脚注说明字面结构，避免把动作落实为原文未明说的具体行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事口吻。“我的孩子们”保留父辈训诫的称呼；分号使末尾对约瑟品格的同位说明清楚自然。
