  text: Because of this the enemy is eager to trip up all who call on the Lord.
translation:
  language: zh_hans
  text: 因此，那仇敌急于绊倒所有呼求主的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 准确表达因果承接，简洁自然。
- source_word: σπουδάζει
  choice: 急切地要
  rationale: 保留其热切、竭力企图做某事的语气，同时符合现代汉语表达。
- source_word: ὁ ἐχθρός
  choice: 那仇敌
  rationale: 定冠词与上下文所指的特定敌对者相符；“仇敌”也保留宗教语境中的人格化意味。
- source_word: ὑποσκελίζειν
  choice: 绊倒
  rationale: 保留原词使人失足、跌倒的形象，也可自然承载属灵或道德失败的含义。
- source_word: πάντας τοὺς ἐπικαλουμένους τὸν Κύριον
  choice: 所有呼求主的人
  rationale: 贴近原文分词结构；“呼求主”准确表达向主祈求、求告之意。
theological_decisions:
- issue: “仇敌”是否明确解释为撒但
  choice: 保留“那仇敌”
  alternative: 撒但
  rationale: 原文只说ὁ ἐχθρός，并未在本句直接命名；保留原有指称，避免加入解释。
- issue: “绊倒”的含义是否明确解释为使人犯罪或背道
  choice: 保留形象性的“绊倒”
  alternative: 诱使……犯罪
  rationale: 原词具有使人失足的比喻张力，具体后果在本句中没有被限定，不宜缩窄。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。句式紧凑，保留“仇敌”“绊倒”“呼求主”等原文的宗教与比喻色彩。
