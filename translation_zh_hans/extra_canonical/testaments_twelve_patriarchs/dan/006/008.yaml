  text: Διατηρήσατε οὖν³³ ἑαυτούς³⁵, τέκνα μου, ἀπὸ παντὸς *ἔργου πονηροῦ³⁶, καὶ ἀπορρίψατε *ἀφ᾽ ὑμῶν τὸν θυμὸν καὶ τὸ ψεῦδος³⁷, ⌜καὶ ἀγαπήσατε τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/008.yaml
  text: Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要保守自己，远离一切恶行；要从自己身上除掉怒气和虚假，并且要喜爱真理和忍耐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατηρήσατε ἑαυτούς
  choice: 保守自己
  rationale: 保留命令语气和主动警醒、自我防守的含义，同时符合庄重而自然的现代汉语。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲切的父辈称呼，不将其限定为男性后裔。
- source_word: παντὸς ἔργου πονηροῦ
  choice: 一切恶行
  rationale: 以简洁自然的汉语表达“每一种邪恶的行为”，保留行为层面的重点。
- source_word: ἀπορρίψατε ἀφ᾽ ὑμῶν
  choice: 从自己身上除掉
  rationale: 体现原文“抛离自身”的强烈动作意象，又避免生硬直译。
- source_word: θυμὸν
  choice: 怒气
  rationale: 此处与应当除掉的恶行和虚假并列，取其愤怒、暴怒之义。
- source_word: ψεῦδος
  choice: 虚假
  rationale: 比“谎言”范围稍广，可涵盖不真实和欺骗，贴合单数抽象名词。
- source_word: ἀλήθειαν
  choice: 真理
  rationale: 保留其可指真实、诚实及真理的语义张力，不狭化为单纯“说实话”。
- source_word: μακροθυμίαν
  choice: 忍耐
  rationale: 表达长久克制、耐心承受的品格；现代读者易懂，也与怒气形成对照。
theological_decisions:
- issue: ἀλήθεια 的语义范围
  choice: 真理
  alternative: 诚实／真实
  rationale: 原词既可指真理，也可指真实与诚实；正文采用传统且宽广的“真理”，不把含义仅限于道德上的诚实。
- issue: μακροθυμία 是否强调对人的宽容
  choice: 忍耐
  alternative: 宽容／恒忍
  rationale: “忍耐”保留原词长久克制怒气和耐心承受的核心，又不额外限定其对象。
translation_notes:
  register: 采用现代、庄重、易懂的劝诫语体；保留“所以”所表达的承接关系，并维持原文连续命令的节奏。
