  text: And his name will be in every place in Israel and among the nations.
translation:
  language: zh_hans
  text: 他的名必在以色列各处，也在列国中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ δὲ ὄνομα αὐτοῦ
  choice: 他的名
  rationale: 保留原文以“名”为主语的表达；δὲ在本句中主要起承接作用，汉语无需另译，以免语气生硬。
- source_word: ἐν παντὶ τόπῳ Ἰσραήλ
  choice: 在以色列各处
  rationale: 按原文直译“在以色列的每一处”，用“各处”形成自然、简洁的现代汉语。
- source_word: καὶ ἐν τοῖς ἔθνεσιν
  choice: 也在列国中
  rationale: ἔθνη在此指以色列以外的诸国或各民族；“列国”既保留经文语域，也避免限定为单一国家或单纯族群。
theological_decisions:
- issue: 原句没有明写谓语动词
  choice: 补出“必在”
  alternative: “他的名在以色列各处，也在列国中”
  rationale: 希腊文是省略系词的名词句，语境和英语审校层均按将来意义理解。汉语补“必”使预告语气自然，同时不增添“传扬”“闻名”等原文未明说的含义。
- issue: “他的名在……”所表达的具体意义
  choice: 保留“名在某处”的开放表达
  alternative: 译作“他的名必传遍……”或“他的名必闻名于……”
  rationale: 原文可能蕴含名声、承认或临在等意味，但没有明确动词；不将这种含义收窄为“传扬”或“闻名”。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。保留原文略显凝练的“名在……”结构，以维持其语义张力；不依据校勘符号臆造缺乏具体异文资料支持的脚注。
