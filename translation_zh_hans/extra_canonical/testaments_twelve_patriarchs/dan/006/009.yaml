base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/009.yaml
  text: And what you have heard from your father, pass on also to your children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord[a].
translation:
  language: zh_hans
  text: 你们从父亲那里所听见的，也要传授给你们的儿女，［好让万民的救主接纳你们；因为他真实而恒久忍耐，温柔而谦卑，并且借着行为教导主的律法。］[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 从“好让万民的救主……”至本节末的这段话，常被认为是后期的扩充或插入；这里仍予翻译，因为所据的希腊文本载有此句。
    reason: textual_variant
lexical_decisions:
- source_word: μεταδοτε
  choice: 传给
  rationale: 表达将所领受的教导转传给下一代，符合上下文，也自然简明。
- source_word: ὁ Σωτὴρ τῶν ἐθνῶν
  choice: 万民的救主
  rationale: ἐθνῶν在此泛指列国、各族之民；“万民”比“外邦人”更自然，也保留普世范围。
- source_word: ἀληθὴς
  choice: 信实
  rationale: 该词既可表示真实，也可表示可靠、忠信；用于描述救主的品格时，“信实”较符合汉语语境，同时不排除“真实”的含义。
- source_word: μακρόθυμος
  choice: 有耐心
  rationale: 保留恒久忍耐、不轻易发怒的核心意义，并采用普通读者易懂的现代措辞。
- source_word: ἐκδιδάσκων διὰ τῶν ἔργων
  choice: 以自己的行为教导
  rationale: 直接体现“借着行为施教”，避免抽象化为单纯的言语教训。
- source_word: τὸν νόμον Κυρίου
  choice: 主的律法
  rationale: 按所有格结构直译，保留“主”与“律法”的关系。
theological_decisions:
- issue: “万民的救主”所指对象的身份
  choice: 保留原文称号，不补明其身份
  alternative: 明确译作某一特定人物或神学称谓
  rationale: 原句仅使用“救主”这一称号；不加入原文未明说的身份认定，以保留文本自身的神学张力。
- issue: 括号内句子的文本地位
  choice: 译入正文并以脚注说明其常被视为后期增补
  alternative: 从正文删去或用方括号包围整句
  rationale: 所提供的希腊见证包含该句；出版正文应予翻译，同时透明说明其文本疑点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们的儿女”对应复数τέκνοις；标点使目的从句紧接“传给你们的儿女”。脚注标记置于疑似增补内容开始处，以清楚标示其范围。
