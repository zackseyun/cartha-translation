source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: VI. Καὶ νῦν *φοβήθητε τὸν Κύριον¹, τέκνα μου, καὶ προσέχετε ἑαυτοῖς² ἀπὸ τοῦ Σατανᾶ καὶ *τῶν πνευμάτων³ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/001.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits.
translation:
  language: zh_hans
  text: 现在，我的孩子们，你们要敬畏主，也要谨防撒但和他的诸灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητε
  choice: 敬畏
  rationale: 该词在以主为宾语时表达带有尊崇与顺服的畏惧；“敬畏”符合现代汉语的圣经语域，也不将其弱化为单纯尊敬。
- source_word: προσέχετε ἑαυτοῖς ἀπό
  choice: 谨防
  rationale: 此结构表示为自身留意、防备某种威胁；“谨防”自然简洁，并保留警戒意味。
- source_word: Σατανᾶ
  choice: 撒但
  rationale: 采用现代简体中文圣经语境中通行的专名音译。
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: 他的诸灵
  rationale: 保留复数“灵”及所属关系，不擅自解释为“邪灵”或“使者”；“诸灵”在庄重语体中可清楚体现复数。
theological_decisions:
- issue: “他的诸灵”的性质
  choice: 直译为“他的诸灵”
  alternative: “他的邪灵”或“他的恶灵”
  rationale: 原文只说“他的灵（复数）”，虽由上下文可推知敌对性质，却没有明说“邪恶”；译文保留原文措辞及其解释空间。
- issue: “敬畏主”中畏惧与尊崇的张力
  choice: 采用“敬畏”
  alternative: “惧怕主”或“尊敬主”
  rationale: “敬畏”同时容纳畏惧、尊崇和顺服，避免只突出恐惧或只突出尊敬。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我的孩子们”保留亲切的劝诫口吻；用“也要”衔接两个命令，使句子流畅。原文中的星号和上标数字属于版本校勘标记，未作为正文脚注处理，因为所给资料未提供相应注释内容。
