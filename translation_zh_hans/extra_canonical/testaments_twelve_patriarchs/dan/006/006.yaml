base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/006.yaml
  text: But in the time of Israel’s lawlessness, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[a].
translation:
  language: zh_hans
  text: 但在以色列不法的时候，主不会离开他们，却要转向一个寻求他旨意的民族，因为众天使中没有一个能与他相比。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一句希腊文较难理解：现有文本一面说主“不会离开他们”，一面又说他“要转向一个寻求他旨意的民族”。译文保留了这种张力，没有将它消解。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνομίας
  choice: 无法无天
  rationale: 表达不服从律法、悖逆法度的含义，并使现代普通读者易于理解。
- source_word: ἀφιστάμενος ἀπ᾽ αὐτῶν
  choice: 离开他们
  rationale: 按其分离、离去的基本意义直译，并保留否定词所形成的陈述。
- source_word: μετελεύσεται ἐπ᾽ ἔθνει
  choice: 要转向一个……民族
  rationale: 该短语含有转移、前往另一群体之意；“转向”在中文中自然，同时保留与前句之间的张力。
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: 寻求他旨意的
  rationale: “寻求”对应 ζητέω，“旨意”准确传达 θέλημα 在宗教语境中的意义。
- source_word: οὐδεὶς τῶν ἀγγέλων ἔσται ἴσος αὐτῷ
  choice: 众天使中没有一个能与他相比
  rationale: 自然表达“没有任何天使与他相等”，不额外界定代词所指。
theological_decisions:
- issue: 主既“不离开他们”，又“转向”另一民族所形成的张力
  choice: 两项陈述均予保留，不加调和
  alternative: 将前句改作“主将离开他们”，或把后句弱化为同时眷顾另一民族
  rationale: 所给希腊正文明确包含否定语 οὐκ；即使语意困难，也不应凭神学推断静默修正。
- issue: 末句 αὐτῷ 的指代
  choice: 译作“他”，保留原文代词的指代开放性
  alternative: 明确译作“主”或其他特定对象
  rationale: 上下文最自然地指向主，但原文使用代词，译文不应加入超过文本的明确化。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“无法无天”较自然地传达 ἀνομία；“民族”用于 ἔθνος，避免预先把它限定为某个特定国家或族群。脚注标记置于相关整句之后。
