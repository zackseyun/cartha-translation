  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/005.yaml
  text: For he himself, the angel of peace, will strengthen Israel so that it will not fall into uttermost evils.
translation:
  language: zh_hans
  text: 因为和平的天使自己必坚固以色列，使以色列不至陷入极重的种种祸患。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς
  choice: 他自己
  rationale: 保留强调代词的力度，突出施行坚固者正是这位天使。
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: 那位和平的天使
  rationale: 以自然庄重的现代汉语表达属格结构，不额外限定“和平”是其身份、使命还是所属领域。
- source_word: ἐνισχύσει
  choice: 必使……刚强
  rationale: 表达将来时及使人得力量、受坚固之义；比单纯“帮助”更贴近原词。
- source_word: τὸν Ἰσραὴλ
  choice: 以色列
  rationale: 保留原文集体名称；后文使用中性指代“其”，避免擅自判定为个人或国族人格化的男性。
- source_word: μὴ ἐμπεσεῖν
  choice: 使其不至陷入
  rationale: 将带否定词的不定式理解为ἐνισχύσει所表达之坚固的结果或目的，并保留目的与结果之间的轻微开放性。
- source_word: εἰς τέλος κακῶν
  choice: 陷入种种极深的祸患
  rationale: κακῶν为复数，可指诸般恶事或灾祸；结合“陷入”的搭配译作“祸患”。εἰς τέλος表达达到极点或彻底陷入的意味，译为“极深”而不武断解释为时间上的“最终”。
theological_decisions:
- issue: “和平的天使”的身份
  choice: 保留称号，不说明其具体身份
  alternative: 将其解释为某位具名天使、弥赛亚或其他神圣人物
  rationale: 本节原文本身没有进一步认定，译文不引入宗派性或解释性身份判断。
- issue: “以色列”的所指
  choice: 保留集体名称，并以“其”回指
  alternative: 明确译为“以色列人”“以色列民族”或将代词人格化为“他”
  rationale: 原文以单数形式指以色列，既可能是集体，也带有人格化色彩；中性表达能保留张力。
- issue: κακῶν的伦理与灾难含义
  choice: 译作“祸患”
  alternative: 译作“罪恶”或笼统的“恶”
  rationale: “陷入诸恶”在此可兼有恶事、苦难或灾祸之义；“祸患”较符合汉语语境，但不把它专门限定为道德罪恶。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“必使……刚强”保留经文语体和将来确定性；全句避免过度古雅，也不补入原文没有的神学解释。
