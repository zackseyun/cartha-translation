  text: Ἐγγίσατε⁴ τῷ θεῷ καὶ τῷ ἀγγέλῳ *τῷ παραιτουμένῳ ὑμᾶς⁵· ὅτι οὗτός ἐστι μεσίτης θεοῦ καὶ ἀνθρώπων καὶ⁶ ἐπὶ τῆς εἰρήνης τοῦ⁷ Ἰσραὴλ κατέναντι⁸ *τῆς βασιλείας τοῦ †θεοῦ στήσεται⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/002.yaml
  text: Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy.
translation:
  language: zh_hans
  text: 你们要亲近上帝，也要亲近那位为你们代求的天使；因为他是上帝与人之间的中保[a]。为了以色列的和平，他必与上帝的国度相对而立[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝与人之间的中保”直译自希腊文。本句仍称这位中保为“天使”，因此这里保留原文的说法，不把他直接等同于后来的某个教义人物。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本作“与上帝的国度相对而立”，但“上帝”一词在校勘本中被标为可疑。有人据语境推测原文可能是“仇敌”，从而译作“抵挡仇敌的国度”；正文保留现存读法。
    reason: textual_variant
lexical_decisions:
- source_word: Ἐγγίσατε
  choice: 你们要亲近
  rationale: 保留其主动趋近、接近之意，并以现代汉语中庄重自然的表达呈现。
- source_word: τῷ παραιτουμένῳ ὑμᾶς
  choice: 那位为你们代求的
  rationale: παραιτέομαι 在此可指恳求、求情；结合天使与中保的语境，译作“为你们代求”最为自然，但不额外认定该天使的身份。
- source_word: μεσίτης
  choice: 中保
  rationale: 准确表达居间者、调解者之义，也保留原文所带的神学张力。
- source_word: ἐπὶ τῆς εἰρήνης τοῦ Ἰσραήλ
  choice: 为了以色列的和平
  rationale: ἐπί 在此表示关乎或为了；译文采用目的、关切含义均可涵盖的自然汉语。
- source_word: κατέναντι … στήσεται
  choice: 必站在……面前
  rationale: κατέναντι 可表示“在……对面”或“在……面前”；此译法避免在残缺可疑的末句中擅自加入敌对含义。
theological_decisions:
- issue: 天使被称为上帝与人之间的中保
  choice: 直接保留“天使”与“中保”的并置，不确认其为任何后来的教义人物
  alternative: 按后来的基督论解释明确其身份
  rationale: 原文自身没有作这种身份认定；翻译应保留其真实的含混与神学张力。
- issue: 末句“上帝的国度”与“站在……面前”的关系
  choice: 按现存希腊文译为“站在上帝的国度面前”，并加注说明文本疑难
  alternative: 依推测改读为“站出来抵挡仇敌的国度”
  rationale: 所给希腊文本实际读作 τοῦ θεοῦ，且以校勘符号标为可疑；正文不应无提示地采用没有直接写在底本中的“仇敌”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“中保”虽属宗教用语，但能简洁准确地表达 μεσίτης；脚注用于保留身份与末句文本的疑难，不在正文中强行消解。
