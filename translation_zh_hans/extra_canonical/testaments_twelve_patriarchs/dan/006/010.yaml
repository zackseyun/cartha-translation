base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/010.yaml
  text: Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever. And bury me near my fathers.
translation:
  language: zh_hans
  text: 所以，你们要远离一切不义，紧紧依附于上帝的义；你们的后裔必归于救恩，直到永远。你们要把我安葬在我列祖附近。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόστητε
  choice: 远离
  rationale: 表达主动离开、弃绝之意，符合现代汉语劝诫语气。
- source_word: κολλήθητε
  choice: 紧紧持守
  rationale: 原词有紧贴、依附之意；译为“紧紧持守”自然且保留坚定依附的力度。
- source_word: τῇ δικαιοσύνῃ τοῦ Θεοῦ
  choice: 上帝的义
  rationale: 保留属格结构及“δικαιοσύνη”的神学张力，不具体限定为上帝所赐的义或上帝自身的公义。
- source_word: τὸ γένος ὑμῶν
  choice: 你们的后裔
  rationale: 在此临终训诫的家族语境中，γένος指后代或族系，“后裔”最贴切。
- source_word: εἰς σωτηρίαν ἕως τοῦ αἰῶνος
  choice: 永远蒙拯救
  rationale: 以自然汉语传达“归于拯救，直到永远”；不将σωτηρία窄化为现世解救或特定教义概念。
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: 在我列祖附近
  rationale: πατέρες在安葬语境中指先祖；“列祖”庄重而易懂，“附近”准确保留ἐγγύς。
theological_decisions:
- issue: “上帝的义”的含义
  choice: 保留“上帝的义”
  alternative: 上帝所要求的正义／上帝所赐的义
  rationale: 希腊语属格本身可有多重理解，不宜在正文中替读者判定其为源自主体、所属或赐予关系。
- issue: 后裔与拯救的关系
  choice: 你们的后裔就必永远蒙拯救
  alternative: 你们的后裔就必成为永远的拯救
  rationale: εἰς σωτηρίαν在该句中自然表示达到或进入拯救的结果；如此处理避免将后裔本身说成拯救者，同时保留应许语气。
translation_notes:
  register: 采用现代、庄重而清楚的劝诫体。“所以”承接前文；“紧紧持守”呈现κολλάω的强烈依附感；末句保持临终安葬吩咐的简洁。
