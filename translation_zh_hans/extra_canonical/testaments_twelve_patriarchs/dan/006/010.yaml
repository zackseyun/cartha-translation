  to: 所以，你们要远离一切不义，紧紧依附于上帝的义；你们的后裔必归于救恩，直到永远。你们要把我安葬在我列祖附近。
  rationale: 修订仅调整两处：以“紧紧依附于”保留κολλήθητε的依附意象；以“必归于救恩，直到永远”较贴近εἰς σωτηρίαν ἕως τοῦ αἰῶνος，并避免将原文未明说的被动施事或具体救恩机制纳入正文。其余措辞保持原稿。
