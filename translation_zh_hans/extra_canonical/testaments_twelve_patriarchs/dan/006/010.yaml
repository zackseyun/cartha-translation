  source_fidelity: “远离一切不义”和“上帝的义”准确对应ἀπόστητε ἀπὸ πάσης ἀδικίας与τῇ δικαιοσύνῃ τοῦ Θεοῦ；末句“安葬在我列祖附近”也忠实保留ἐγγὺς的“近旁”而非“与……同葬”。但“你们的后裔就必永远蒙拯救”将εἰς σωτηρίαν处理为被动“蒙拯救”，较原文“将归于／成为救恩（或得救）”更具体，并弱化了εἰς的结果、归向表达。
