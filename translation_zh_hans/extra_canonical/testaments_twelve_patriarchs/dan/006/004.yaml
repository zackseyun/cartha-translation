  text: Οἶδε γὰρ ὅτι *ἐν ᾗ ἡμέρᾳ¹³ ἐπιστρέψει¹⁴ Ἰσραήλ, συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/004.yaml
  text: For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end.
translation:
  language: zh_hans
  text: 因为他知道，以色列回转的那一天，仇敌的国度就必终结。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: 回转
  rationale: 既保留“转回、归回”的基本意象，也能自然表达以色列转离错误、重新归向神的含义；不额外明说原文未出现的对象。
- source_word: συντελεσθήσεται
  choice: 必终结
  rationale: 该被动式在此表示达到终点、告终；译作“必终结”简洁自然，并保留事情必然完成的语气。
- source_word: ἡ βασιλεία τοῦ ἐχθροῦ
  choice: 仇敌的国度
  rationale: 按原文保留单数“仇敌”及“国度”的政治—统治意象，不擅自认定仇敌的具体身份。
theological_decisions:
- issue: 以色列“回转”的对象
  choice: 不补出“归向神”
  alternative: 以色列归向神
  rationale: 上下文或可暗示归向神，但本句原文只用ἐπιστρέψει，没有明说对象；正文保留这一含蓄性。
- issue: “仇敌”的身份
  choice: 保留为“仇敌”
  alternative: 魔鬼／撒但
  rationale: 原文仅称ὁ ἐχθρός；不将其明确等同于某一属灵存在，以免消除原有的指称空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以色列回转的那一天”紧贴希腊语时间结构；“就必终结”兼顾时间关联与预言性的确定语气。
