  text: Καὶ⁴¹ ἐὰν ζημιωθῆτε ἑκουσίως *ἢ ἀκουσίως⁴² *μὴ λυπεῖσθε⁴³· ἀπὸ γὰρ λύπης⁴⁴ ἐγείρεται⁴⁵ καὶ⁴⁶ θυμός⁴⁷ ⌈μετὰ ψεύδους⁷⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/006.yaml
  text: And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.
translation:
  language: zh_hans
  text: 即使你们自愿或非自愿地遭受损失，也不要忧愁；因为愤怒也会同虚假一起从忧愁中生起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同虚假一起”在部分文本见证中缺失；这几个词也可理解为“忧愁会生出愤怒和虚假”。
    reason: 原文以特殊括号标示μετὰ ψεύδους的文本不确定性；该短语在简短句法中的具体连接范围也不能完全确定。
lexical_decisions:
- source_word: ζημιωθῆτε
  choice: 遭受损失
  rationale: 保留被动语态及宽泛含义，可指财物、权益或其他方面受损，不将语义限缩为单纯的亏钱。
- source_word: ἑκουσίως ἢ ἀκουσίως
  choice: 自愿或非自愿地
  rationale: 直接保留两种彼此相对的情形；虽然后者在汉语中略显书面，却准确对应原文。
- source_word: μὴ λυπεῖσθε
  choice: 不要忧愁
  rationale: λυπέομαι在此指因受损而悲伤、苦恼；“忧愁”自然庄重，并与后句λύπη保持词根呼应。
- source_word: ἐγείρεται
  choice: 激起
  rationale: 原义为起来、被唤起；在情绪关系中译为“激起”符合现代汉语表达。
- source_word: θυμός
  choice: 愤怒
  rationale: 在本句中表示强烈怒气；译为“愤怒”清楚且不过度解释。
- source_word: μετὰ ψεύδους
  choice: 并伴随着虚假
  rationale: 保留μετά所表达的伴随关系和ψεύδος的广义，不擅自具体化为“说谎”或“欺骗”。
theological_decisions:
- issue: “虚假”与“愤怒”的句法关系
  choice: 将μετὰ ψεύδους理解为伴随“愤怒”出现：愤怒并伴随着虚假
  alternative: 理解为忧愁同时激起愤怒和虚假，或将“带着虚假”修饰整个发生过程
  rationale: 该短语紧随θυμός，最自然地与“愤怒”相连；但希腊语表达简短，且文本标记显示该短语存在传本问题，因此用脚注保留不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“即使……也……”使条件句在中文中顺畅；重复“忧愁”以保留原文λυπεῖσθε与λύπης之间的词汇呼应。
