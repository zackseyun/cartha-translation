  naturalness: “说话攻击你们”可懂，但“出言攻击你们”在现代汉语中更自然。修订后的末句保持庄重、简洁的劝诫语体，并清楚呈现两个并列的否定项。
  terminology: “圣洁的人”适当地保留称赞内容而不将其断定为客观身份；“自高自大”准确表达因受赞扬而骄傲的警戒。无需增设脚注。
