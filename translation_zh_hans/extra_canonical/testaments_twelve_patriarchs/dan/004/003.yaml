base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/003.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.
translation:
  language: zh_hans
  text: 所以，若有人出言攻击你们，你们不要动怒；若有人称赞你们为圣洁的人，也不要自高自大；既不要变得欢喜，也不要变得厌恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλεῖ ... καθ᾽ ὑμῶν
  choice: 说话攻击你们
  rationale: κατά与属格在此表示敌对言说；译作“说话攻击”既保留“说”的动作，也自然表达“反对、毁谤”的方向，而不擅自限定为某一种言语罪。
- source_word: κινεῖσθε εἰς ὀργήν
  choice: 动怒
  rationale: 原文直译为“被激动而进入愤怒”；现代汉语“动怒”简洁自然，保留受到言语刺激而发怒的含义。
- source_word: ἐπαινέσῃ ... ὡς ἁγίους
  choice: 称赞你们为圣洁的人
  rationale: ὡς ἁγίους可表示以“圣洁者”的身份或评价来称赞；此译不判断这种称赞是否属实。
- source_word: ἐπαίρεσθε
  choice: 自高自大
  rationale: 该词在语境中指因受称赞而抬高自己、骄傲自满；“自高自大”比字面“被高举”更准确传达警戒意味。
- source_word: μεταβάλλεσθε
  choice: 改变自己
  rationale: 保留“发生转变、改变状态”的宽泛含义，不具体化为情绪波动或行为改变。
- source_word: τέρψιν ... ἀηδίαν
  choice: 欢喜或厌恶
  rationale: τέρψις指愉悦、欢喜，ἀηδία指不快、厌恶；用一正一反的情感词保留原文对举。
theological_decisions:
- issue: “圣洁的人”是客观身份还是他人的赞誉
  choice: 按他人的称赞内容表达：“称赞你们为圣洁的人”
  alternative: “称赞你们，说你们是圣洁的”
  rationale: 原文ὡς保留评价或视为某种身份的空间，不应把圣洁身份直接断定为叙述者的客观宣告。
- issue: 末句所指的变化性质
  choice: 概括译为“不要因欢喜或厌恶而改变自己”
  alternative: “无论欢喜还是厌恶，都不要改变”
  rationale: 原文没有进一步说明改变的是情绪、态度还是行为，因此保留其概括性和伦理张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。按所给校订希腊文本处理，未加入英文旧稿曾有而当前希腊正文没有的“我的孩子们”。分号呈现两个并列警戒及末句总结。
