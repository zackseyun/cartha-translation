  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/005.yaml
  text: But if you fall into any loss or destruction, children, do not be thrown into confusion. For that very spirit causes one to desire to be angry over what is perishing, so that he may fall into anger through passion.
translation:
  language: zh_hans
  text: 但孩子们，如果你们遭受任何损失或毁灭，不要惊慌失措。因为正是那灵使人想要因那正在消亡的事物而发怒，好叫他借着激情陷入愤怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζημίᾳ ἢ ἀπωλείᾳ
  choice: 损失或毁坏
  rationale: 分别保留“损害、损失”与“毁灭、丧失”的并列语义，不将两者合并为一个泛化概念。
- source_word: περιπέσητε
  choice: 遭受
  rationale: 此处指落入不利境况；汉语用“遭受”比直译“陷入”更自然，同时保留事件临到人的意味。
- source_word: μὴ ἐκθροεῖσθε
  choice: 不要惊慌失措
  rationale: 该词表达受惊扰、陷入慌乱；此译兼顾心理震动与混乱状态。
- source_word: αὐτὸ τὸ πνεῦμα
  choice: 正是那灵
  rationale: 以“正是”体现强调性的 αὐτό，并用“那灵”承接上下文所指的灵，不擅自界定其本体。
- source_word: τοῦ ἀπολλυμένου
  choice: 因正在失去的东西
  rationale: 保留现在分词所含的进行状态；中性形式可指正在灭失、丧失之物，此处按损失语境译为“正在失去的东西”。
- source_word: διὰ τοῦ πάθους
  choice: 因这种激情
  rationale: πάθος 可指强烈情感、激情或情欲；“激情”保留其较宽且带失控意味的情感语义，避免缩窄为“苦难”。
theological_decisions:
- issue: “那灵”的身份
  choice: 保留为“那灵”
  alternative: 明确译作“愤怒之灵”或“邪灵”
  rationale: 本节希腊文本只说 αὐτὸ τὸ πνεῦμα，其具体身份依赖上下文；不在正文中补入原文没有的定性。
- issue: 愤怒形成过程中的主体与因果关系
  choice: 译为“使人……好叫他……”
  alternative: 将两处隐含主体直接解释为“你们”
  rationale: 原文使用不定式及第三人称单数虚拟式，主体表达并不完全显明；采用泛指“人／他”保留这种结构与劝诫的普遍性。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“孩子们”保留呼语但不添加原文没有的“我的”。末句略显重复的“发怒／愤怒”对应 ἐπιθυμῆσαι 与 θυμῷ 的递进关系，并保留原文关于情绪受激而陷入愤怒的张力。
