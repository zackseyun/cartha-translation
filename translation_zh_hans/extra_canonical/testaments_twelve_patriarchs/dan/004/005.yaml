revisions:
- from: 但孩子们，如果你们遭受任何损失或毁坏，不要惊慌失措。因为正是那灵使人因正在失去的东西而想要发怒，好叫他因这种激情陷入愤怒。
  to: 但孩子们，如果你们遭受任何损失或毁灭，不要惊慌失措。因为正是那灵使人想要因那正在消亡的事物而发怒，好叫他借着激情陷入愤怒。
  rationale: 修订仅澄清 τοῦ ἀπολλυμένου 所指的正在消亡之事物，并删去原文未明示的“这种”。保留“正是那灵”、泛指“人／他”、以及“想要发怒”至“陷入愤怒”的递进，以对应原文结构及英文审校记录。
