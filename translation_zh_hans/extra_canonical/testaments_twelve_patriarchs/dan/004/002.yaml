reference: Testament of Dan 4:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐν γὰρ λόγῳ παροξύνεται⁵ πρῶτον εἶτα⁶ *ἐν ἔργοις⁷ †δυναμοῖ⁸ τὸν ὀργιζόμενον⁹, καὶ¹⁰ ἐν *ζημίαις πικραῖς διαταράσσει τὸ διαβούλιον αὐτοῦ¹¹, καὶ οὕτως διεγείρει ἐν θυμῷ μεγάλῳ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/002.yaml
  text: For first he is provoked by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it throws his purpose into confusion, and so it stirs up his soul in great wrath.
translation:
  language: zh_hans
  text: 因为，他先因一句话被激怒；随后，它借着行动使那正在发怒的人更有力量[a]；又借着惨痛的损失搅乱他的谋算，就这样使他的心魂在盛怒中激荡起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节连续动词的主语在原文中没有明说。译文以“它”保留这种未指明性；上下文或可帮助理解其所指。
    reason: 保留原文隐含主语的句法含混，避免将其在正文或注释中确定为某一特定力量。
lexical_decisions:
- source_word: παροξύνεται
  choice: 受到刺激
  rationale: 该动词可表示被激怒、受刺激；此处采用较宽的表达，既保留怒气逐步加剧的语境，也不把起初的反应说得过重。
- source_word: ἐν ἔργοις
  choice: 借着行动
  rationale: ἔργοις 与前面的 λόγῳ（话语）形成对照，指付诸行为或实际行动；“借着行动”简洁保留其工具性。
- source_word: δυναμοῖ
  choice: 使……气势更盛
  rationale: 原义为使强壮、使更有力量；用于正在发怒的人时，“气势更盛”比直译“使强壮”自然，同时保留怒势增强之意。
- source_word: ζημίαις πικραῖς
  choice: 惨痛的损失
  rationale: πικρός 在损失语境中表示痛苦、严酷；“惨痛”符合现代汉语搭配。
- source_word: διαβούλιον
  choice: 谋算
  rationale: 该词指谋划、意图或思虑；“谋算”保留目的与盘算两方面，而不限定为单纯的判断力。
- source_word: ψυχὴν
  choice: 心魂
  rationale: ψυχή 在此指人的内在生命与情感主体；“心魂”比单用“灵魂”更贴合怒气被激起的语境。
- source_word: θυμῷ μεγάλῳ
  choice: 盛怒
  rationale: 以自然而庄重的汉语表达强烈的愤怒，保留 μεγάλῳ 的程度。
theological_decisions:
- issue: 连续动词的隐含施事者
  choice: 以“它”保留上下文中的隐含力量，不在本节明说其身份
  alternative: 明确译为“怒气”或“愤怒之灵”
  rationale: 希腊文本在关键动词处没有明示同一个名词主语；直接补成“怒气”或“愤怒之灵”会消除原文的句法含混，并可能引入超出本节的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文由话语、行动、损失逐层推进至盛怒的结构；避免添加宗派性或人格化解释。
