revisions:
- from: 因为，人起初会因一句话受到刺激；随后，它借着行动使那正在发怒的人气势更盛[a]；又借着惨痛的损失搅乱他的谋算，就这样使他的心魂在盛怒中激荡起来。
  to: 因为，他先因一句话被激怒；随后，它借着行动使那正在发怒的人更有力量[a]；又借着惨痛的损失搅乱他的谋算，就这样使他的心魂在盛怒中激荡起来。
  rationale: 修正单数指称，并以“更有力量”直接对应δυναμοῖ，保留原文未说明力量具体如何表现的开放性。脚注改为准确描述本节的隐含主语，不额外限定其身份。
