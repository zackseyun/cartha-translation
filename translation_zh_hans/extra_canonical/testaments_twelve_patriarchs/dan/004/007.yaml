source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἔστι δὲ διπρόσωπον κακὸν ὁ θυμὸς μετὰ ψεύδους⁴⁸, καὶ συναίρονται⁴⁹ ἀλλήλοις ἵνα ταράξωσι⁵⁰ *τὴν καρδίαν⁵¹· ταρασσομένης δὲ τῆς ψυχῆς συνεχῶς, ἀφίσταται ὁ⁵² Κύριος ἀπ᾽ αὐτῆς καὶ κυριεύει αὐτῆς ὁ Βελίαρ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/007.yaml
  text: And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it, and Beliar rules over it.
translation:
  language: zh_hans
  text: 愤怒与虚假结合，是一种两面性的恶；二者彼此勾结，为要扰乱人心。心灵若不断受到搅扰，主就会离开这心灵，彼列[a]便辖制它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列”是在此类犹太文献中用作邪恶势力的专名；希腊文作“Βελίαρ”（Beliar）。
    reason: 保留原文专名，并为不熟悉该名称的现代读者提供必要而不过度解释的说明。
lexical_decisions:
- source_word: θυμὸς
  choice: 愤怒
  rationale: 此处指强烈而具有破坏性的怒气；“愤怒”自然、庄重，也符合上下文的伦理含义。
- source_word: μετὰ ψεύδους
  choice: 与虚假相伴
  rationale: 保留介词结构所表达的关联，不强行限定为“因说谎而愤怒”或“带着谎言的愤怒”。
- source_word: διπρόσωπον κακόν
  choice: 一种双面的恶
  rationale: 较直译地保留“双面”意象，指愤怒和虚假结合所呈现的双重恶性，而不改写成特定解释。
- source_word: συναίρονται ἀλλήλοις
  choice: 二者彼此勾结
  rationale: 该词在此表达共同配合、联手行动；“勾结”能自然传达二者合力作恶的语气。
- source_word: ταράξωσι τὴν καρδίαν
  choice: 扰乱人心
  rationale: καρδία在此指人的内在中心；“人心”比解剖意义的“心脏”准确自然。
- source_word: τῆς ψυχῆς
  choice: 心灵
  rationale: ψυχή在本句指人的内在生命或自我；“心灵”既与前句“人心”衔接，也避免把它过度限定为某种灵魂论概念。
- source_word: ἀφίσταται
  choice: 离开
  rationale: 直接表达主从持续受扰的心灵那里退离，不将其弱化为“远离”或解释为关系感受。
- source_word: κυριεύει
  choice: 辖制
  rationale: 准确传达取得主权、支配的含义，且符合庄重的宗教语域。
- source_word: Βελίαρ
  choice: 彼列
  rationale: 采用中文宗教文献中常见的专名音译，并以脚注说明其身份用法。
theological_decisions:
- issue: “主离开它”的神学张力
  choice: 按原文译为“主就会离开它”
  alternative: 主的同在就会远离它
  rationale: 原文使用明确的ἀφίσταται，不宜为缓和神学张力而改成仅指主观感受或同在感减弱。
- issue: καρδία与ψυχή之间的关系
  choice: 分别译为“人心”和“心灵”
  alternative: 两者都译为“心”或“灵魂”
  rationale: 保留原文用词变化，同时不把二者解释为严格区分的实体性组成部分。
- issue: 彼列的指称
  choice: 保留专名“彼列”
  alternative: 译作“魔鬼”或“邪恶者”
  rationale: 原文使用专名Βελίαρ；保留专名可避免将其身份完全等同于后来的某一特定称号。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。前半句保留“双面的恶”这一鲜明意象；后半句以“人心／心灵”呈现καρδία与ψυχή的用词差别。标点将原文长句分为两句，以提高可读性而不改变逻辑关系。
