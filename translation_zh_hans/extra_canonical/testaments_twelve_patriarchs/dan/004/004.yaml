  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/004.yaml
  text: For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.
translation:
  language: zh_hans
  text: 因为它先使人听着愉悦，继而使心思敏锐，察觉那挑衅；人一旦发怒，就以为自己生气是理所当然的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέρπει τὴν ἀκοήν
  choice: 使耳朵感到悦耳
  rationale: 保留原文“取悦听觉”的感官意象，同时符合现代汉语表达。
- source_word: ὀξύνει τὸν νοῦν
  choice: 使心思变得敏锐
  rationale: ὀξύνει有“磨利、使敏锐”之意，νοῦς在此指人的心智或思维。
- source_word: τὸ ἐρεθισθέν
  choice: 那挑动怒气的事
  rationale: 原文此处文本有疑难；ἐρεθίζω可指刺激、挑动或激怒。采用较自然的事件性表达，并按上下文指出其与怒气有关，但不具体限定刺激的内容。
- source_word: δικαίως ὀργίζεσθαι
  choice: 自己生气是理所当然的
  rationale: 表达“认为自己的愤怒有正当理由”，自然传达δικαίως的正当性含义。
theological_decisions:
- issue: 愤怒者对自身正当性的判断
  choice: 以为自己生气是理所当然的
  alternative: 认为自己是在义怒
  rationale: 原文描述当事人的自我判断，并未确认其愤怒确实正义；避免使用可能把这种判断客观化或神学化的“义怒”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“它”承接上文所谈之对象；保留从悦耳、心思敏锐、察觉刺激到自认发怒有理的递进关系。
