  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/001.yaml
  text: Therefore understand the power of anger, that it is futile.
translation:
  language: zh_hans
  text: 所以，你们要明白愤怒的力量，知道它是徒然的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκοῦν
  choice: 所以
  rationale: 承接上文并引出劝诫，现代汉语中自然明确。
- source_word: σύνετε
  choice: 你们要明白
  rationale: 保留复数命令语气；“明白”适合表达对一种力量及其性质的认识。
- source_word: τὴν δύναμιν τοῦ θυμοῦ
  choice: 愤怒的力量
  rationale: 按希腊语结构直译，保留愤怒具有支配力或作用力的表述，不将其窄化为后果。
- source_word: ὅτι ματαία ἐστίν
  choice: 知道它是徒然的
  rationale: ὅτι引出所要明白的内容；ματαία可表示徒然、虚妄或无益，此处用“徒然”保留其概括性。
theological_decisions:
- issue: ματαία对愤怒之力量的评价范围
  choice: 徒然的
  alternative: 虚妄的／无益的
  rationale: 原文只作宽泛的否定评价，未具体说明是无效果、无价值还是虚妄；“徒然”较能保留这种语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“所以”体现承接关系，“你们要明白”保留命令语气；不根据相邻段落或英文修订记录增补本节原文没有的内容。
