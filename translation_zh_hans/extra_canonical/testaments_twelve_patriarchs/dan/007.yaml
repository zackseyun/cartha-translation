  naturalness: 草稿第1节“但说完这些话”缺少主语，现代汉语不通顺；第3节“不过，但曾向他们预言”既重复转折词，又因遗漏人名而不成句。修订后使指代、句法和庄重叙事语体均清楚自然。
  terminology: “上帝”“承受为业之地”“骸骨”均适合此文本及语域。将“以色列民族”调整为“以色列的族群”，更直接对应race of Israel，同时不在古代文本中强加现代民族国家含义。
