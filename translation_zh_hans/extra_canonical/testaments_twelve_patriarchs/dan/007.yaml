  - severity: medium
    issue: 第1节缺少“说话者”的代词主语。
    rationale: “但说完这些话”在现代汉语中不通；原文分词结构所指的临终人物应以“他”明确承接。
  - severity: medium
    issue: 第3节“不过，但”重复并误用转折标记。
    rationale: Πλὴν οὖν可用单一的“不过”或“然而”表达；“但”在此应为专名“但”，不应与连词并列。
