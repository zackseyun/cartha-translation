  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007.yaml
  text: 'And when he had said these things, he kissed them affectionately and fell asleep in a good sleep.

    2 And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.

    3 Nevertheless, Dan prophesied to them that they would forget their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring.'
translation:
  language: zh_hans
  text: '7 他说完这些话后，就深情地亲吻他们，随后安然睡去。


    2 他的儿子们埋葬了他。此后，他们把他的骸骨带上去，送到亚伯拉罕、以撒和雅各所在的地方。


    3 不过，但曾向他们预言：他们将忘记他们的上帝，并与他们承受为业之地、以色列的族群和他们后裔的家族隔绝。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文摘录在本节中途残缺；本节后半依据该版本所代表的传承文本及经审校的英文参照层译出。
    reason: 向读者说明第3节在所给原文证据中的残缺状况，避免把补足的措辞误当作完整保存的希腊文。
lexical_decisions:
- source_word: καταφιλήσας
  choice: 深情地亲吻
  rationale: 该复合动词比一般的“亲吻”语气更强，可表达亲切、深情的吻别；这样也保留英语审校层所体现的加强语气。
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: 安然睡去
  rationale: 原文直译近于“睡了美好的一觉”，在埋葬语境中是死亡的委婉说法。“安然睡去”既自然庄重，又保留“睡眠”意象，不直接改译为“死了”。
- source_word: ἀπήνεγκαν
  choice: 带上去，送到
  rationale: 动词在此具有搬运、带走之意；结合祖先安葬地的方向性，保留“上去”，避免只译成无方向的“运到”。
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: 他的骸骨
  rationale: 指埋葬之后迁移的遗骨；“骸骨”比“骨头”更符合庄重的叙事语体。
- source_word: γῆ τῆς κληρονομίας（据第3节传承文本）
  choice: 承受为业之地
  rationale: 保留“产业／继承所得之地”的经文意象，不将其简化为一般的“故土”。
theological_decisions:
- issue: “睡去”是否明确解释为死亡
  choice: 保留“安然睡去”的委婉意象
  alternative: 译为“安然离世”或“死了”
  rationale: 随后的埋葬已清楚交代其死亡；保留睡眠意象更贴近希腊文，也不额外规定其神学含义。
- issue: 第3节的疏离对象之间的关系
  choice: 将土地、以色列民族及后裔家族并列，统一受“与……隔绝”支配
  alternative: 把后两项解释为前一项的同位说明，或补入因果关系
  rationale: 现有证据呈现并列结构；不应擅自补足原文没有明说的逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“深情地亲吻”“安然睡去”“骸骨”适合临终与安葬场景；“承受为业之地”保留古代宗教文本的继承意象，但句法仍按现代汉语组织。
