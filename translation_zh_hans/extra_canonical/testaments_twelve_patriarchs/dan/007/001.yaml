  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/001.yaml
  text: And having said these things, he kissed them affectionately and fell asleep a good sleep.
translation:
  language: zh_hans
  text: 他说完这些话，深情地亲吻了他们，便安然长眠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安然长眠”直译为“睡了美好的一觉”，是对死亡的委婉说法。
    reason: 说明希腊文的同源词表达及其临终语境，保留字面意象与实际含义之间的张力。
lexical_decisions:
- source_word: καταφιλήσας
  choice: 深情地亲吻了
  rationale: 该词是 καταφιλέω 的不定过去时分词，常表示热切、深情地亲吻；这样既保留动作的亲昵意味，也符合现代汉语表达。
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: 便安然长眠
  rationale: 原文以同源词构成“睡了美好的一觉”式表达；在临终叙事中，“长眠”自然传达死亡委婉语，“安然”对应 καλῷ 的正面意味，同时避免生硬直译。
theological_decisions:
- issue: “睡眠”是否明确译作死亡
  choice: 安然长眠
  alternative: 安然睡去／睡了美好的一觉
  rationale: 上下文显然是族长临终，但希腊文仍以“睡眠”委婉表达；“长眠”既让现代读者理解死亡含义，又保留原文意象，不另行加入“死了”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他说完这些话”顺畅表达前置分词；“深情地亲吻”保留加强语气；“便安然长眠”适合遗言叙事的肃穆语域。
