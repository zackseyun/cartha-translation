  text: Nevertheless Dan prophesied to them that they would forget [their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring].
translation:
  language: zh_hans
  text: 然而，丹曾向他们预言说：“此后，他们会把他的骸骨运上去，安放在近旁。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安放在近旁”见于异文；原文未说明是安放在何物近旁。
    reason: 说明句末异文，并保留σύνεγγυς所含的参照对象不明，避免加入未获文本支持的细节。
lexical_decisions:
- source_word: Πλὴν οὖν
  choice: 不过
  rationale: 表达转折兼承接的语气；现代汉语中比生硬叠译为“然而所以”自然。
- source_word: προεφήτευσεν αὐτοῖς
  choice: 对他们预言说
  rationale: 保留“预言”的明确含义以及间接宾语“对他们”。
- source_word: ἀνήνεγκαν τὰ ὀστᾶ αὐτοῦ
  choice: 他们会把他的骸骨运上去
  rationale: ἀναφέρω含有向上搬运、带上去之意；用“会”体现预言语境中的未来指向，同时保留“他的”所具有的指代关系。
- source_word: κατέθηκαν σύνεγγυς
  choice: 安放在附近
  rationale: κατατίθημι在骸骨语境中译为庄重自然的“安放”；σύνεγγυς仅表示邻近，原文未明说邻近何物，译文不予补足。
theological_decisions:
- issue: “他的骸骨”的指代
  choice: 保留为“他的骸骨”
  alternative: 明确译为“但的骸骨”
  rationale: 希腊文使用代词αὐτοῦ；虽从语境看很可能指但，但不在正文中消除原有的代词指向形式。
- issue: 预言内容的时态
  choice: 译作“会把……运上去”
  alternative: 按希腊文不定过去时直译为“把……运了上去”
  rationale: 主句“预言”使ὅτι从句具有预告后事的功能；汉语以“会”清楚传达该语用关系，而不把它误读成已经发生之事。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“他的”和“附近”的含混，不擅自补出安放地点或代词所指。
