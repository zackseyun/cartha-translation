  text: And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.
translation:
  language: zh_hans
  text: 他的儿子们把他安葬了。此后，他们把他的骸骨运到亚伯拉罕、以撒和雅各所在的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθαψαν
  choice: 安葬
  rationale: 准确表达埋葬死者之意，语体庄重自然。
- source_word: ἀπήνεγκαν
  choice: 运上去，送到
  rationale: 保留动词所含的搬运及向上方向，同时使现代汉语句意完整顺畅。
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: 他的骸骨
  rationale: “骸骨”符合迁葬语境，比逐字译作“骨头”更庄重。
- source_word: ἔνθα ἦν
  choice: 所在的地方
  rationale: 保留原文对地点的概括说法，不擅自补出具体地名或墓穴。
theological_decisions:
- issue: “亚伯拉罕、以撒和雅各所在”是否指安葬地点
  choice: 保持“所在的地方”的含蓄表达
  alternative: 译为“亚伯拉罕、以撒和雅各埋葬的地方”
  rationale: 原文只说ἔνθα ἦν，并未明言“埋葬”；因此不把语境推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留原文两句的时间推进，并避免补充原文未说明的地名。
