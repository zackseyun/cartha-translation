review_pass:
  verdict: revise
  source_fidelity: 首句“他的儿子们把他安葬了”准确对应Καὶ ἔθαψαν αὐτὸν οἱ υἱοὶ αὐτοῦ。后句的ἀπήνεγκαν（ἀποφέρω的不定过去时）基本义为“运走、带走”，现译“运上去”加入了原文此处并未明示的向上方向；应改为中性的“运到”。括号中的τὰ ὀστᾶ αὐτοῦ按该底本的复原文字译为“他的骸骨”合适。
  naturalness: “此后”及“安葬”“骸骨”均庄重自然。原文“运上去，送到”在汉语中既重复又使方向显得突兀；改为“把他的骸骨运到……所在的地方”更简洁流畅。
  terminology: 人名“亚伯拉罕、以撒和雅各”采用通行的现代中文圣经译名，正确一致。“骸骨”适合叙事及迁运遗骸的庄重语域。“所在的地方”不将ἔνθα ἦν扩充为“埋葬之地”，妥善保留原文的概括性。
  issues:
  - severity: medium
    issue: “运上去”将ἀπήνεγκαν译为带有明确向上方向的动作。
    rationale: 所给希腊文为ἀπήνεγκαν，出自ἀποφέρω，表示带走或运走；该形式本身不要求译出“上去”。英文审校轨迹中的“carried up”不应凌驾于原语文本。
  - severity: low
    issue: “运上去，送到”动词重复。
    rationale: 两者均表达运输及到达，连续使用不够凝练；删去无原文依据的方向后可自然地用一个“运到”表达。
  revised_text: 他的儿子们把他安葬了。此后，他们把他的骸骨运到亚伯拉罕、以撒和雅各所在的地方。
