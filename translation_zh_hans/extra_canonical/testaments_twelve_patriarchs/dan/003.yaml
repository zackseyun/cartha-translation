  text: 'If you lose truth and patience[a], you will perish.


    2 Anger is blindness, for it does not allow one to see anyone’s face truly. 3 Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him. 4 For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision. 5 And with what does it veil his eyes? With hatred of heart against his brother, leading to envy.


    6 For anger is evil, my children, because it throws even the soul itself into turmoil. 7 And it gives strength to the body, so that it may commit every lawless deed. 8 And when the body has done all these things, the soul justifies what has been done, because it does not see rightly. 9 Therefore the one who is angry, if he is physically strong, has his soul’s power for anger threefold: one from the help of attendants, by which he justifies the deed; a second through wealth, persuading and overpowering unjustly[b]; and a third, because he has natural strength, by it he does evil. 10 But if the one who is angry is weak, he has the passion of wrath in him twofold[d][c], for anger always helps him toward wrongdoing.'
translation:
  language: zh_hans
  text: '你们若失去真理和恒忍[a]，就必灭亡。


    2 怒气就是瞎眼，因为它不容人真实地看清任何人的面貌[b]。3 即使那人是父亲或母亲，怒气也把他们看作仇敌；若是弟兄，它就不认得他；若是主的先知，它就不听从他；若是义人，它就看不见他；若是朋友，它就不认识他。4 因为怒气之灵用迷惑的网缠住他，使他的眼睛失明；又借着谎言使他的心思昏暗，使他按自己的眼光看事物[c]。5 它用什么蒙住他的眼睛呢？就是他心里对弟兄的仇恨，使他生出嫉妒。


    3章 1 我的孩子们，怒气实在邪恶，甚至把灵魂本身搅乱。2 它把发怒之人的身体据为己有，又辖制他的灵魂，并赋予身体力量，使身体行出一切不法的事。3 身体行完这一切以后，灵魂也会说所做的事是对的，因为它不能正确地看清事物。


    4 所以，发怒的人若身体强壮，他在怒气中就有三重力量：第一重来自为他效力之人的帮助；第二重来自财富，他借此劝服人，并以不义取胜[d]；第三重是他天生的力量，他借此行恶。5 但发怒的人若软弱，愤怒的激情就会在他里面加倍滋长[e]，因为怒气总会帮助他行不法的事。6 这灵总同谎言一道，行在撒但的右边，好使他的行为都带着残酷和虚假[f]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恒忍”也可译作“长久忍耐”或“宽容”（μακροθυμία）。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在真理中看任何人的脸”，意思是按真实情况正确地看待一个人。
    reason: idiom_clarification
  - marker: c
    text: 原文直译为“给他他自己的视野”。这表示怒气使人按自己的眼光看事物，以受蒙蔽、扭曲的视角取代正确的判断。
    reason: metaphor_clarification
  - marker: d
    text: “他借此劝服人，并以不义取胜”中的宾语在希腊文中不明确；也可理解为“以财富劝服并不义地压倒对方”。
    reason: source_ambiguity
  - marker: e
    text: 本句用ὀργή（这里译作“愤怒”），而全段主要用θυμός（译作“怒气”）；译文保留了这一用词变化。
    reason: lexical_distinction
  - marker: f
    text: “他的行为”在原文中可能指撒但的行为，也可能指受怒气支配之人的行为。
    reason: pronoun_ambiguity
lexical_decisions:
- source_word: μακροθυμία
  choice: 恒忍
  rationale: 兼顾长久忍耐与克制怒气的语境，比单纯“耐心”更能传达该德性词的持续性。
- source_word: τύφλωσις
  choice: 瞎眼
  rationale: 保留原文断言式隐喻“怒气就是瞎眼”，并与后文眼睛、看见、昏暗的意象相连。
- source_word: θυμός
  choice: 怒气
  rationale: 作为全段拟人化的主导恶习，采用现代汉语自然且可反复使用的“怒气”。
- source_word: ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ
  choice: 按真相看任何人的脸
  rationale: 保留“脸”的具体意象，同时用“按真相”表达对人作正确判断的含义。
- source_word: δίκτυον τῆς πλάνης
  choice: 迷惑的网
  rationale: 保留捕捉、缠绕的网罗意象；πλάνη在此兼有迷误与欺骗作用。
- source_word: τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ
  choice: 把它自己的眼光给他
  rationale: 保留怒气以自身扭曲视角取代真实视野的拟人化表达，不把隐喻解释掉。
- source_word: ἴδιον ποιεῖται
  choice: 据为己有
  rationale: 准确表达怒气把发怒者的身体占为己有，避免像英语咨询层那样遗漏此分句。
- source_word: κατακυριεύει
  choice: 辖制
  rationale: 传达强力支配、作主的意味，并保持庄重伦理语体。
- source_word: δικαιοῖ
  choice: 说……是对的
  rationale: 在此指灵魂为已经做出的恶行辩护、判定其正当；译法通俗而不引入法庭或称义神学术语。
- source_word: ὀργή
  choice: 愤怒
  rationale: 与主要译作“怒气”的θυμός略作区别，同时不夸大二者在本段中的技术性差异。
- source_word: ὠμότης
  choice: 残酷
  rationale: 体现行为的冷酷、凶狠性质，与“虚假”并列自然。
theological_decisions:
- issue: προφήτης Κυρίου中的κύριος
  choice: 主的先知
  alternative: 上帝的先知
  rationale: 原文明确使用Κυρίου，直译“主”，不泛化为“上帝”。
- issue: 怒气之灵的位格化程度
  choice: 保留“怒气之灵”及其行动的拟人化语言
  alternative: 全部改写为纯心理作用，或明确解释为独立邪灵
  rationale: 原文既称“灵”又描述其缠绕、辖制及行在撒但右边；译文保留这种张力，不弱化为普通情绪，也不增添原文未明确陈述的 demonology。
- issue: III.6 αὐτοῦ的所指
  choice: 保留“他的行为”的代词表达
  alternative: 明确译为“撒但的行为”或“发怒之人的行为”
  rationale: 希腊文代词可能承接近处的撒但，也可能回指受怒气支配的人；中文代词保留这一真实歧义，并以脚注说明。
- issue: III.3 δικαιοῖ的神学色彩
  choice: 按伦理语境译为“说所做的事是对的”
  alternative: 译为“称所做的事为义”
  rationale: 此处讨论被怒气蒙蔽的灵魂为恶行辩护，并非展开称义教义；采用语境义可避免不必要的教义联想。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。保留“脸、瞎眼、网、昏暗、眼光”等贯穿段落的视觉意象，也保留怒气近乎位格化的表达。编号因所给希腊文从前一章末句接入，先呈现《但遗训》2章末段，再明确标出3章；未沿用英语咨询层把整段连续编号为2—10的处理。
