  text: '*Καὶ ὡς οὐκ ἠνοίγον ἡμέρας εἴκοσι, δρώντων αὐτῶν²⁹ προσάγω³⁰ κλίμακα³¹ καὶ παραβησθεὶς³² *τὴν ἀσπίδα ἐπὶ τῆς κεφαλῆς μου³³ καὶ³⁴ ἀνῆλθον³⁵, *ἀποδεχόμενος ἀπὸ τοίχου λίθους³⁶ καὶ³⁷ ἀνεῖλον³⁸ τέσσαρας πόλει αὐτῶν δυνάστας³⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/005.yaml
  text: And because they did not open to us after twenty days, while they were watching, I brought a ladder; and placing my shield over my head and receiving the stones, I went up and killed four of their mighty men.
translation:
  language: zh_hans
  text: 因为他们二十天都不肯开门，趁他们注视着，我搬来一架梯子，顶着盾牌，承受从城墙上落下的石头，爬了上去，杀死了他们城中的四名强者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἠνοίγον
  choice: 不肯开门
  rationale: 按围城语境表达城中人拒不开门；保留未明说宾语“城门”的特点，同时使现代汉语自然。
- source_word: δρώντων αὐτῶν
  choice: 趁他们注视着
  rationale: δράω在此句抄本传统中语义不寻常；依现有希腊文本及英译审校层处理为“他们看着/注视着”，不进一步解释其所指。
- source_word: προσάγω κλίμακα
  choice: 搬来一架梯子
  rationale: 表达将梯子带到近前，符合攻城行动语境。
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: 承受从城墙上落下的石头
  rationale: 保留“接下、承受”石块的具体动作，又以“落下”说明石块来自墙上，避免误解为主动收取。
- source_word: δυνάστας
  choice: 勇士
  rationale: 此处指敌方有力量或地位的重要战士；“勇士”比字面的“掌权者”更贴合战斗语境，但不扩写其具体身份。
