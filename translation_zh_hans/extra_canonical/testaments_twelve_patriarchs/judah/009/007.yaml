  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/007.yaml
  text: Then they asked us for terms of peace, and after counsel had been taken with our father, we accepted them.
translation:
  language: zh_hans
  text: 于是，他们向我们求和；我们同父亲商议之后，便接纳他们为纳贡者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρὸς εἰρήνην
  choice: 求和
  rationale: 该短语直指与和平有关的条件或安排；在此叙事语境中译作“求和”简洁自然，也保留对方主动请求和平解决的含义。
- source_word: γενομένης βουλῆς μετὰ τοῦ πατρὸς ἡμῶν
  choice: 我们同父亲商议之后
  rationale: 以时间从句自然表达属格独立结构，明确商议是与父亲共同进行的，不额外推定具体议和条款。
- source_word: ὑποδεξάμενοι αὐτοὺς ὑποφόρους
  choice: 便接纳他们为纳贡者
  rationale: ὑποφόρους 表示处于从属地位并承担贡赋的人；原文并非只说一般性的“接纳他们”，因此保留“为纳贡者”这一关键信息。
