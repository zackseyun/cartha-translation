  text: For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.
translation:
  language: zh_hans
  text: 九章一节　我父亲与他的兄弟以扫和睦相处了十八年；我们从美索不达米亚、从拉班那里来到这里以后，以扫的儿子们和我们在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέκα καὶ ὀκτὼ ἔτη
  choice: 十八年
  rationale: 按希腊文数量表达直译，并置于谓语后，使现代汉语自然顺畅。
- source_word: ἐποίησεν εἰρήνην
  choice: 和睦相处
  rationale: 字面为“缔造和平”，此处描述雅各与以扫持续十八年的和平关系；“和睦相处”既传达和平状态，也符合现代汉语习惯。
- source_word: ὁ πατήρ μου
  choice: 我父亲
  rationale: 保留叙述者犹大的第一人称亲属称谓。
- source_word: μετὰ τοῦ ἀδελφοῦ αὐτοῦ Ἡσαῦ
  choice: 与他的兄弟以扫
  rationale: 保留原文亲属关系及专名，不以“哥哥”或“弟弟”细化原文未明说的称谓。
- source_word: οἱ υἱοὶ αὐτοῦ μεθ᾽ ἡμῶν
  choice: 以扫的儿子们也和我们在一起
  rationale: 原文代词指向以扫；汉语中重述姓名可避免“他的”所指含混。“也”对应并列成分 καὶ。
- source_word: μετὰ τὸ ἐλθεῖν ἡμᾶς
  choice: 我们……回来以后
  rationale: ἐλθεῖν 本义为“来”；从叙述者当前立场看，译作“回来”更符合汉语空间视角，同时保留完成后的时间关系。
- source_word: ἀπὸ Μεσοποταμίας ἀπὸ Λαβάν
  choice: 从美索不达米亚、从拉班那里
  rationale: 保留两个 ἀπό 短语。第二个短语指从拉班所在之处或其家中离开，补出“那里”使汉语成立，但不把拉班误作地名。
