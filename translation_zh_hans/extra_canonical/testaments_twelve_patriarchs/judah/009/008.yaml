source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἦσαν διδόντες⁴⁷ ἡμῖν πυροῦ⁴⁸ κόρους⁴⁹ πεντακοσίους⁵⁰, καὶ ἐλαίου †ὕφης⁵² πεντακοσίους⁵³, καὶ⁵⁴ οἴνου *μέτρα πεντακόσια ἕως τοῦ λιμοῦ⁵⁴ ὅτε⁵⁵ κατήλθομεν⁵⁶ εἰς Αἴγυπτον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/008.yaml
  text: And they were giving us five hundred cors of wheat, and five hundred baths of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.
translation:
  language: zh_hans
  text: 他们不断给我们五百歌珥的小麦[a]、五百罢特的油[b]和五百量的酒[c]，直到饥荒来临、我们下到埃及的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “歌珥”是古代容积单位；其准确容量因时代和地区而异。
    reason: 帮助现代读者理解音译计量单位，同时避免不可靠的精确换算。
  - marker: b
    text: “罢特”是古代液体容积单位。此处希腊文本有讹损，所指单位并不完全确定。
    reason: 原文油的计量单位存在文本疑难；正文依校勘传统暂译为“罢特”，并公开说明不确定性。
  - marker: c
    text: 原文只说“五百量”，没有注明酒所用的具体计量单位。
    reason: 保留原文在酒的计量单位上的不确定性。
lexical_decisions:
- source_word: πυροῦ
  choice: 小麦
  rationale: 该词在此指小麦，与粮食计量单位“柯珥”搭配自然。
- source_word: κόρους
  choice: 柯珥
  rationale: 保留古代容积单位的专名，不以不确定的现代数值换算取代原文。
- source_word: ἐλαίου
  choice: 油
  rationale: 原文泛指油；语境未明确限定为橄榄油，故不作窄化。
- source_word: †ὕφης
  choice: 罢特
  rationale: 此处希腊文本有讹损或传抄疑难；依上下文及校勘传统，按液体容积单位“罢特”处理，并以脚注明示不确定性。
- source_word: οἴνου *μέτρα
  choice: 量器的酒
  rationale: μέτρα只表示若干“量”或“量器”，具体单位不明，因此不擅自指定单位。
- source_word: ἦσαν διδόντες
  choice: 一直给我们
  rationale: 以现代汉语表达未完成时所呈现的持续或反复给予。
- source_word: κατήλθομεν εἰς Αἴγυπτον
  choice: 我们下到埃及
  rationale: 保留圣经叙事中“下埃及”的空间表达，同时符合现代汉语。
theological_decisions:
- issue: “直到饥荒……下到埃及”与持续给予之间的时间关系
  choice: 直到饥荒发生、我们下到埃及的时候
  alternative: 直到我们因饥荒下到埃及的时候
  rationale: 原文把“饥荒”和“下埃及”并置，却未明确说饥荒是下埃及的原因；译文保留这种关系上的含混，不补入“因”。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“柯珥”和“罢特”保留古代单位名称，并用脚注解释；句末维持原文略显紧密的时间结构，以免把饥荒与下埃及之间的因果关系说得过满。
