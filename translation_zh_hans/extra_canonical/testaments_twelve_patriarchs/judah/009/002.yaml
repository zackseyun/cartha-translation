  text: And when the eighteen years were fulfilled, Esau, my father's brother, returned to us with a large and strong people.
translation:
  language: zh_hans
  text: 十八年期满后，我父亲的兄弟以扫带着一支人数众多、实力强大的队伍回到我们这里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληρωθέντων τῶν δεκαοκτὼ ἐτῶν
  choice: 十八年期满后
  rationale: 以自然简洁的现代汉语表达属格独立结构，同时保留“十八年届满”的时间含义。
- source_word: ἐπανῆλθεν ἡμῖν
  choice: 回到我们这里
  rationale: ἐπανῆλθεν 的基本意义是“回来、返回”；与 ἡμῖν 连用，在此译作“回到我们这里”，不额外加入敌对意味。
- source_word: Ἡσαῦ ὁ ἀδελφὸς τοῦ πατρός μου
  choice: 我父亲的兄弟以扫
  rationale: 依原文保留亲属关系的明说；现代汉语中“兄弟”不擅自判定其为兄或弟。
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: 带着一支人数众多、实力强大的队伍
  rationale: ἐν 在随同语境中译为“带着”；λαός 此处指集体人众，结合 βαρεῖ 的分量或规模感，译作“人数众多的队伍”；ἰσχυρῷ 译作“实力强大”，避免生硬的“沉重而强壮的人民”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“队伍”符合叙事中的集体人众语境；不把 ἐπανῆλθεν 强化为“来攻打”，从而避免引入原句未明说的敌意。
