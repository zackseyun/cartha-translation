  text: And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting around it, we besieged it.
translation:
  language: zh_hans
  text: 我们追赶以扫的子孙。他们也有一座坚固的城，我们无法攻进去；于是我们驻扎在城周围，围攻那城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδιώξαμεν
  choice: 追赶
  rationale: 表达持续追击之意，符合战争叙事语境，同时避免把动作过度具体化为已经追上。
- source_word: τοὺς υἱοὺς Ἡσαῦ
  choice: 以扫的子孙
  rationale: υἱοί 在族群叙事中可指后裔；译作“子孙”比字面的“儿子们”更符合此处群体含义。
- source_word: πόλις ὀχυρά
  choice: 一座坚固城
  rationale: 准确传达设防坚固、难以攻入的城邑；中文简洁自然。
- source_word: εἰσελθεῖν ἐν αὐτῇ
  choice: 攻进去
  rationale: 字面是“进入其中”，但上下文为军事行动；“攻进去”自然呈现因城防而无法进入的含义。
- source_word: περικαθίσαντες
  choice: 围城驻扎
  rationale: 该分词描写军队环城坐驻、扎营包围；“围城驻扎”保留动作意象并符合现代汉语军事叙事。
- source_word: ἐπολιορκοῦμεν αὐτῇ
  choice: 攻打那城
  rationale: πολιορκέω 可指围攻、围困；前文已用“围城”体现包围状态，此处译为“攻打”避免生硬重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“于是”呈现 δέ 在此处的叙事推进作用；分号连接无法入城与随后围攻的行动。
