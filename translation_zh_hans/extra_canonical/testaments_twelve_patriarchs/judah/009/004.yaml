  source_fidelity: “追赶以扫的子孙”“他们也有一座坚固城”“我们无法攻进去”均基本忠实于希腊文。末句的 περικαθίσαντες 表示在城周围坐驻／驻扎，ἐπολιορκοῦμεν 则明确是“围攻、围困”；现译“围城驻扎，攻打那城”虽保留部分意思，但“攻打”弱化了“围攻／围困”的特定军事行动。
  naturalness: 整体叙事简洁通顺。“坚固城”可理解，但“坚固的城”在现代汉语中稍更自然。将末句改为“驻扎在城周围，围攻那城”既清楚也保留原文分词与主要动词的关系。
  terminology: “以扫”及“子孙”恰当；“围攻”是 πολιορκέω 在此军事语境下比“攻打”更准确的对应。
  issues:
