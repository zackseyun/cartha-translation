  text: And Jacob struck Esau with a bow, and he fell by Jacob's bow, dead on Mount Seir.
translation:
  language: zh_hans
  text: 雅各用弓射中了以扫；以扫的尸体在西珥山上被抬了起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαισεν ἐν τόξῳ
  choice: 用弓射中了
  rationale: ἔπαισεν表示击打、击中；与“用弓”连用时，现代汉语自然表达为“用弓射中”，既交代武器，也不额外说明箭伤部位或死亡过程。
- source_word: ὁ νεκρός
  choice: 他的尸体
  rationale: 带冠词的实体化形容词可指“死者”或“尸体”。上下文所指为以扫，且与“被抬走”搭配时译作“他的尸体”最自然。
- source_word: ἤρθη
  choice: 被抬走了
  rationale: 保留不定过去时被动语态以及“抬起、带走”的基本意义，不依照英语咨询文本增添再次被弓击倒的内容。
- source_word: ἐν ὄρει Σεείρ
  choice: 在西珥山上
  rationale: ἐν表示事件发生的地点，译为“在……山上”，不将其解释为目的地。
theological_decisions:
- issue: 以扫之死与尸体被抬走之间的叙述关系
  choice: 按希腊文直译为尸体在西珥山上被抬走
  alternative: 译为“他被雅各的弓击倒，死在西珥山上”
  rationale: 希腊文本第二分句是“死者/尸体被抬起（或抬走）”，并未再次提到雅各的弓，也未明确使用“倒下”动词；因此不采纳英语咨询层的扩展表达。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“射中了”比生硬的“用弓击打”更符合汉语习惯；分号呈现两个连续而各自完整的叙事动作。
