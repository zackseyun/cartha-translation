  text: '*Καὶ οἱ ἔλαφοι⁴⁸ Ἰακὼβ⁴⁹ δραμοῦνται ἐν ἀγαλλιάσει⁴⁹, καὶ ἀετοὶ Ἰσραὴλ⁴⁹ πετασθήσονται ἐν χαρᾷ· [οἱ δὲ ἀσεβεῖς πενθήσουσι καὶ οἱ ἁμαρτωλοὶ κλαύσονται]⁵¹, καὶ πάντες οἱ λαοὶ δοξάσουσι Κύριον εἰς αἰῶνας⁵².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/005.yaml
  text: And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.
translation:
  language: zh_hans
  text: 雅各的鹿必欢腾奔跑，以色列的鹰必喜乐翱翔；不敬虔的人必哀恸，罪人必哭泣[a]；万民都必永远荣耀主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不敬虔的人必哀恸，罪人必哭泣”在所据希腊文版本中置于方括号内，表明这句话的文本传承存疑。
    reason: 让读者看见编辑本所保留的文本不确定性，而不在正文中暗自删除或无条件确定该句。
lexical_decisions:
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: 雅各的鹿
  rationale: 按所给希腊文直译；ἔλαφοι 是复数，可泛指鹿。所给英译作“约瑟的鹿”，但希腊文明确作“雅各”，故不从英译。
- source_word: δραμοῦνται ἐν ἀγαλλιάσει
  choice: 必欢腾奔跑
  rationale: 保留将来时及 ἀγαλλίασις 所表达的强烈喜乐，同时采用自然的现代汉语语序。
- source_word: ἀετοὶ Ἰσραὴλ πετασθήσονται ἐν χαρᾷ
  choice: 以色列的鹰必喜乐翱翔
  rationale: πετασθήσονται 在此表达飞翔；“翱翔”符合鹰的意象，也保留 ἐν χαρᾷ 的喜乐意味。
- source_word: οἱ ἀσεβεῖς…οἱ ἁμαρτωλοί
  choice: 不敬虔的人……罪人
  rationale: 分别保留“不敬虔”和“犯罪者”两个相关而不完全相同的称谓。
- source_word: δοξάσουσι Κύριον εἰς αἰῶνας
  choice: 都必永远荣耀主
  rationale: δοξάζω 译为“荣耀”，保留其使主得荣耀、颂扬主的含义；εἰς αἰῶνας 译为“永远”。
theological_decisions:
- issue: 哀恸与哭泣分句的文本地位
  choice: 收入正文并加注说明其文本传承存疑
  alternative: 像所给英译一样省略整句
  rationale: 所给希腊文正文实际载有该句，但以方括号标示；收入正文忠实反映现有源文，加脚注则不掩盖其不确定性。
- issue: “雅各”还是“约瑟”
  choice: 雅各
  alternative: 约瑟
  rationale: 希腊文为 Ἰακώβ；即使英译作 Joseph，也没有充分的原文依据据此改写。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“欢腾奔跑”“喜乐翱翔”保留诗性平行结构；全节以“必”体现希腊文将来时。
