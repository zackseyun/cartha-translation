base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/002.yaml
  text: And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.
translation:
  language: zh_hans
  text: 主赐福利未；临在的天使[a]赐福我；荣耀的众权能赐福西缅；天赐福吕便；地；海，约瑟——[b]众光体赐福但；福乐赐福拿弗他利；太阳赐福迦得；月亮赐福亚设。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“面前的天使”。这是一个与神圣临在有关的称号；原文没有说明其具体身份。
    reason: 说明τοῦ προσώπου的字面意象，并避免把该天使作教义性或具名身份认定。
  - marker: b
    text: 所据希腊语正文在此处显有残缺或讹乱：在“地”后没有保留相应的受福者，随后仅见“海，约瑟”，未保留可使该串列构成完整分句的词语。因此正文按现存文字标示断裂，不补足。英文咨询文本依据较完整的名单作“地赐福以萨迦；海赐福西布伦；山赐福约瑟；帐棚赐福便雅悯”的补足，但这些词句不见于本次所据希腊语正文。
    reason: 准确交代底本文字的断裂，并区分英文审计文本的补足与本次希腊底本的证据。
lexical_decisions:
- source_word: Κύριος
  choice: 主
  rationale: 采用简明庄重、符合犹太宗教语境的常用译法。
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: 侍立在他面前的天使
  rationale: 保留“面前／临在”意象，同时以自然汉语表达其侍立于神面前之义；不把它具体认定为某一位具名天使。
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: 荣耀的众权能
  rationale: 保留复数及可能指天上权能者的开放性，不擅自改译为特定等级的天使。
- source_word: αἱ φωστῆρες
  choice: 众光体
  rationale: 原词泛指发光之物或天体；“众光体”既保留复数，也不限定为星辰。
- source_word: ἡ τρυφή
  choice: 福乐
  rationale: 兼顾愉悦、丰美和享受之意，并使拟人化的祝福主体在汉语中自然可懂。
theological_decisions:
- issue: “面前的天使”所指为何
  choice: 译作“侍立在他面前的天使”，不作身份认定
  alternative: “临在的天使”或直接认定为某一特定天使
  rationale: 希腊语只给出“面前的天使”这一称号；译文保留其神圣临在的意涵和身份上的开放性。
- issue: 残缺列举是否依照英文咨询层补全
  choice: 不补入以萨迦、西布伦、山、帐棚和便雅悯
  alternative: 按英文POB补成十二支派与对应祝福者的完整名单
  rationale: 所提供的希腊语正文并不含这些词项；从原文证据优先，不能把咨询层中的重构静默写入正文。
- issue: “众权能”是否明确解释为天使群体
  choice: 保留抽象名词兼拟人主体的表达
  alternative: 译作“荣耀的天使军团”
  rationale: δυνάμεις 可指能力、权能或超自然权能者；明确译成天使军团会过度消解原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。列举句中重复“赐福”，使希腊语省略谓语的并列结构在汉语中清楚；对底本显著缺漏不作静默补全，而以脚注说明。
