  text: XXV. Καὶ¹ μετὰ ταῦτα *ἀναστήσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ εἰς ζωήν², *καὶ ἐγὼ καὶ οἱ ἀδελφοί μου ἔξαρχοι³ *ἐν Ἰσραὴλ ἐσόμεθα⁵, πρῶτος Λευί⁶, δεύτερος ἐγώ⁷, τρίτος Ἰωσήφ⁸, τέταρτος Βενιαμίν⁹, *πέμπτος Συμεών, ἕκτος Ἰσαχάρ¹⁰, καὶ¹² *πάντες καθεξῆς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/001.yaml
  text: 'And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be rulers of scepters in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and thus all the rest in order.'
translation:
  language: zh_hans
  text: 此后，亚伯拉罕、以撒和雅各必复起，得生命；我和我的兄弟们必在以色列中作首领：利未第一，我第二，约瑟第三，便雅悯第四，西缅第五，以萨迦第六，其余的也都按次序列在后面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 简洁自然地表达“这些事以后”，保留时间先后关系。
- source_word: ἀναστήσεται ... εἰς ζωήν
  choice: 必起来，进入生命
  rationale: 分别保留ἀνίστημι的“起来”和εἰς ζωήν的方向性表达，不将其简化为仅有“复活”，也不额外界定生命的性质。
- source_word: ἔξαρχοι
  choice: 作首领
  rationale: 该词指居首、领头或掌权者；“首领”符合本句人物排序的语境。当前所给希腊正文没有σκήπτρων（权杖）或φυλῶν（支派），因此不补入“权杖的统治者”或“各支派的首领”。
- source_word: πάντες καθεξῆς
  choice: 其余众人也都依次排列
  rationale: καθεξῆς表示按次序、接续而下；结合前列六人的序次，以“依次排列”清楚传达其意。
theological_decisions:
- issue: 族长“起来进入生命”的含义
  choice: 必起来，进入生命
  alternative: 必复活得生
  rationale: 原文带有复起与进入生命两层表达；正文不进一步说明复活的时间、方式或生命的神学性质，故保留原有张力。
- issue: 犹大及其兄弟在以色列中的身份
  choice: 在以色列中作首领
  alternative: 作以色列各支派的首领／作执掌权杖的统治者
  rationale: 依据指定的α栏正文ἔξαρχοι ἐν Ἰσραήλ翻译，不从英语咨询层或其他异文补入“支派”或“权杖”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“此后”“必”“首领”保持遗嘱体的郑重语气；人名采用现代中文圣经中通行的译名。
