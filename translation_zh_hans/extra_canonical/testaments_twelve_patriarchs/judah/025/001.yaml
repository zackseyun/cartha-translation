  to: 此后，亚伯拉罕、以撒和雅各必复起，得生命；我和我的兄弟们必在以色列中作首领：利未第一，我第二，约瑟第三，便雅悯第四，西缅第五，以萨迦第六，其余的也都按次序列在后面。
