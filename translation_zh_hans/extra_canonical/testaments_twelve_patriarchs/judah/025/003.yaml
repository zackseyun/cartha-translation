- from: 你们将成为主的子民，同有一种语言；那里不再有彼列迷惑人的灵，因为它将被投入，直到永远。[a]
  to: 你们将成为主的子民，有同一种语言；那里不会有彼列的迷惑之灵，因为它将被投入，直到永远。[a]
  rationale: 修订“迷惑之灵”以较准确保留πνεῦμα πλάνης的语法与语义，调整两处汉语表述以避免增添时间含义并改善自然度。末句仍按所给主文本保留目的地缺失的疑难，不补入“火中”。
