  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/003.yaml
  text: And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.
translation:
  language: zh_hans
  text: 你们将成为主的子民，有同一种语言；那里不会有彼列的迷惑之灵，因为它将被投入，直到永远。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“它将被投入，直到永远”；所据主文本没有“火中”。此处校本以星号标示文本可能有缺损或疑难。
    reason: 英文咨询文本补有“投入火中”，但该词不见于所给希腊文；脚注既忠于来源，也提示读者此句的文本疑难。
lexical_decisions:
- source_word: λαὸν Κυρίου
  choice: 主的子民
  rationale: 自然表达所属关系，并保留盟约群体意味。
- source_word: γλῶσσα μία
  choice: 同有一种语言
  rationale: 直译为“一种语言”，用“同有”使汉语衔接自然，同时不扩释为同心或同声。
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  choice: 彼列迷惑人的灵
  rationale: πλάνη可指迷惑、谬误或使人偏离；译作“迷惑人的”兼顾其作用。τοῦ Βελιάρ保留与“彼列”的属有或来源关联，不武断解释为某一特定鬼灵。
- source_word: ἐμβληθήσεται
  choice: 将被投入
  rationale: 保留被动语态；主语按最近的“灵”理解，但不补出原文未明说的执行者。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 表达持续至永远；原文此处未出现“火”，故不随英文咨询层补入。
theological_decisions:
- issue: “彼列迷惑人的灵”的性质
  choice: 不具体判定为撒但、邪灵或抽象的谬误
  alternative: 译为“彼列的邪灵”或“彼列的欺骗”
  rationale: 希腊文同时保留“灵”和“迷惑/谬误”的表述，应保存其人格化与抽象意义之间的张力。
- issue: 被投入的去处
  choice: 正文不补“火”，以脚注说明原文状况
  alternative: 依英文POB译作“被投入火中，直到永远”
  rationale: 所给主文本仅有εἰς τὸν αἰῶνα（直到永远），没有“火”对应词；星号提示此处可能存在文本问题，但不足以据此补词。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“彼列”使用传统音译；分号体现两个末世状态的并列。保留原文在“迷惑人的灵”及其被投入之处上的含混，不以英文咨询层的补释取代希腊文证据。
