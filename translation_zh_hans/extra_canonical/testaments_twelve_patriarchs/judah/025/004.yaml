    rationale: διά加宾格的语义在此有原因／缘由、也可能有“为……缘故”的幅度；“因主的缘故”是现代汉语较自然的等值表达，且不把意思收窄为“为主殉道”。
  - severity: low
    issue: “穷人必……而富足”可更自然地表达被动受益结果。
    rationale: πλουτισθήσονται为将来被动；“必得享富足”保留其将来及受益结果，并使中文搭配更自然。
