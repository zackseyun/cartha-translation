  rationale: 作两处轻微措辞修订：将重复的“因着主”改为更自然的“因主的缘故”，并将“而富足”改为“得享富足”。不改动原文未明说的内容：首分句不添加“在喜乐中”，末分句继续保留“醒来，进入生命”的意象与趋向。
