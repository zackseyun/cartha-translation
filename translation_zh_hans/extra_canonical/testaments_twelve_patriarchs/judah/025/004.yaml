base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/004.yaml
  text: And those who died in sorrow will rise in joy, and the poor because of the Lord will be made rich, and those dying because of the Lord will awake to life.
translation:
  language: zh_hans
  text: 那些在忧伤中死去的人必将复活；穷人必因主的缘故[a]得享富足；那些因主的缘故[a]而死的人必将醒来，进入生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因主的缘故”也可理解为“为了主”或“为主的缘故”；原文在本节两处使用相同短语。
    reason: 提示διὰ Κύριον的语义幅度，并说明两个平行分句为何采用相同译法；避免将其武断限定为殉道目的。
lexical_decisions:
- source_word: ἐν λύπῃ τελευτήσαντες
  choice: 在忧伤中死去的人
  rationale: 按希腊文直译其状态与动作；源文本身没有“在喜乐中”一语，因此不从英文咨询层补入。
- source_word: ἀναστήσονται
  choice: 必将复活
  rationale: 在死亡语境中自然表达“起来、复起”的复活含义，同时保留将来指向。
- source_word: οἱ πτωχοὶ … πλουτισθήσονται
  choice: 穷人……必……富足
  rationale: 保留“贫穷—富足”的鲜明对照，并以被动意义表达其将被赋予富足的结果。
- source_word: ἐξυπνισθήσονται εἰς ζωήν
  choice: 必将醒来，进入生命
  rationale: 保留原文“醒来”的意象及 εἰς 所表达的趋向，不简化为单一的“复活”。
theological_decisions:
- issue: διὰ Κύριον 在两个平行分句中的含义
  choice: 两处均译为“因着主”
  alternative: “为了主”或“为主的缘故”
  rationale: διά 加宾格在此可表达原因，也可表达“为了……的缘故”；统一译法保留原文重复和平行结构，并避免武断限定为殉道目的。
- issue: ἀναστήσονται 的补语
  choice: 不补入“在喜乐中”
  alternative: “必在喜乐中复活”
  rationale: 所给希腊文只有“在忧伤中死去”与“必将复活”，没有与“喜乐”对应的词；依原文证据不作扩充。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“复活”“富足”“醒来，进入生命”既贴近希腊文意象，也便于普通读者理解；分号呈现三个并列的末世性应许。
