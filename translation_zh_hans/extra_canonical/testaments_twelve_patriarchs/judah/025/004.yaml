review_pass:
  verdict: revise
  source_fidelity: 首分句“在忧伤中死去的人必将复活”准确对应ἐν λύπῃ τελευτήσαντες ἀναστήσονται，且没有擅自补入英文审校轨迹中的“在喜乐中”。第二分句的贫穷与富足对照也得到保留。末分句的ἐξυπνισθήσονται εἰς ζωήν译作“醒来，进入生命”基本忠实保留了醒来意象和趋向。惟“因着主”在汉语中可被理解为泛泛的神学原因，虽脚注说明其幅度，正文采用“因主的缘故”更自然，并更明确保留διά + 宾格可能的原因／缘由含义，而不将其限定为殉道目的。
  naturalness: 整体庄重通顺；但现代汉语里“因着主”略显翻译腔，且“穷人……而富足”不如“穷人……得享富足”自然。以“因主的缘故”及“得享富足”可改善行文，同时保留将来被动的受益意味。
  terminology: “主”“复活”“生命”均适当。“忧伤”适合λύπη；“复活”在死亡语境中恰当。两个平行的διὰ Κύριον应维持相同译法和同一脚注锚点。
  issues:
