  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003.yaml
  text: '1[a]. And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I dragged him down and so killed him.


    2. And the other king, Taphou, while he was sitting on his horse, I killed; and so I scattered all his people[b].


    3. And I found Achor, a giant of a man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.


    4. And after fighting with Achor for two hours, I killed him; and when I had cut his shield into two pieces, I hacked through his feet.


    5. And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.


    6. But I wrapped my garment around my arm and slung stones at them; four of them I killed[c], and the others fled.'
translation:
  language: zh_hans
  text: '1[a] 两个迦南人的王身披铠甲，带着许多随从来袭击我们的牲畜群时，我独自冲向其中一个王，把他的骨头打碎了。


    2 另一个王他弗正骑在马上，我杀了他；就这样，我驱散了他的全部人马。


    3 我遇见亚割王；他是个巨人，骑在马上向前向后射箭。我跳起来，拿起一块重六十利特拉的石头[b]，朝那匹马投去，杀了它。


    4 我同亚割交战了两个小时，杀了他；我把他的盾牌劈成两半，又砍断了他的双脚。


    5 我正要从他身上剥下他的胸甲时，看哪，他的八个同伴开始攻击我。


    6 我便把外衣缠在手臂上，用投石器向他们投石，杀了其中四人；其余的人都逃跑了。


    7 我父亲雅各杀了贝利撒；他是众王之王，是个巨人，身高有十二肘[c]。


    8 于是恐惧临到他们，他们便不再与我们交战。


    9 因此，我和兄弟们在一起时，父亲在战争中总是无所忧虑。


    10 因为他曾在异象中看见有关我的事：有一位大能的天使在一切事上与我同行，使我不致被击败[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章的希腊传本相当混乱。若干抄本中的敌手姓名不同，有科拉、拿鹤等形式；部分战斗情节也有重复或次序不同的情况。
    reason: textual_variant
  - marker: b
    text: “利特拉”是古代重量单位。这里重在突出石头异乎寻常的重量，不宜强作精确的现代换算。
    reason: cultural_note
  - marker: c
    text: “肘”是古代长度单位，通常约为从肘部到指尖的距离。这里的“十二肘”属于夸张宏伟的巨人描写。
    reason: cultural_note
  - marker: d
    text: “与我同行”所译的希腊词字面可指“与我一同飞行”。
    reason: translation_note
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: 身披铠甲
  rationale: 表达已经装备护甲的状态，既自然又保留军事叙事色彩。
- source_word: ποίμνια
  choice: 牲畜群
  rationale: 该词泛指牧养的畜群；不限定为羊群，以免超出希腊文本。
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: 把他的骨头打碎了
  rationale: 所给希腊正文明确出现“骨头”而非英译咨询层所据的“小腿”；动词在此传达猛烈撕碎或击碎之意。
- source_word: ἀνεῖλον
  choice: 杀了
  rationale: 采用清楚、现代的叙事用语，不使用过度古雅的表达。
- source_word: διεσκόρπισα
  choice: 驱散了
  rationale: 保留“使之四散”的基本意象，同时适合战斗语境。
- source_word: γίγαντα
  choice: 巨人
  rationale: 保留英雄叙事中对敌手异常体格的直接描述。
- source_word: ἀνελάμενος
  choice: 举起
  rationale: 所给正文为“拿起、举起”，并没有咨询英译所依据的“跃起”；从当前希腊文本直译。
- source_word: λίθον ἑξήκοντα λιτρῶν
  choice: 一块重六十利特拉的石头
  rationale: 保留古代重量单位并以脚注说明，不作不确定的现代换算。
- source_word: δέδωκα τῷ ἵππῳ καὶ ἀπέκτεινα αὐτόν
  choice: 击中那匹马，把它杀了
  rationale: 代词在语法上可指马；直译当前文本，不将死亡对象改作骑手。
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: 用投石器向他们投石
  rationale: 明确该动词所含的投石器动作，使现代读者易于理解。
- source_word: ἄγγελος δυνάμεως
  choice: 一位大能的天使
  rationale: 保留“大能/能力”与“天使”的组合，不将其扩展为特定天使阶级。
theological_decisions:
- issue: 第2—4节敌手姓名及战斗次序的文本混乱
  choice: 正文依所给希腊α栏，采用“他弗”和“亚割”，并保留第3、4节连续出现亚割的叙述。
  alternative: 其他见证有科拉、拿鹤等姓名形式，也有重复或重新编排骑马、投石和交战情节。
  rationale: 不擅自合并人物或重排情节，以脚注坦诚提示传本差异。
- issue: 第10节天使同行与不败之间的关系
  choice: 译为“与我同行，使我不致被击败”。
  alternative: 可较字面地译为“与我一同飞行……使我不被胜过”。
  rationale: συνέπεταί的字面意象是“一同飞翔”，但在护佑语境中“同行”较自然；目的结构保留天使相伴与犹大不败之间的文本联系，不进一步系统化其神学含义。
- issue: 第7节“众王之王”
  choice: 按句法作为贝利撒的称号译出。
  alternative: 可理解为“所有王的王”，或因传本混乱而对其修饰关系存疑。
  rationale: 当前希腊正文直接以“众王之王”说明贝利撒，不把该称号改指雅各，也不赋予后世专属的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语，保留英雄战斗场面的强烈动作感。正文优先遵循所给希腊α栏，因此在“骨头”“举起石头”“杀死马”等处不照搬英语咨询层中的不同读法。人名依希腊文音译为“他弗、亚割、贝利撒”；不以圣经正典中相似名字擅自同一化。
