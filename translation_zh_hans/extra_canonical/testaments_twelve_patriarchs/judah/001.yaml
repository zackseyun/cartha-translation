    2 于是，他们聚集起来，来到他那里。他对他们说：


    3 “我的孩子们，要听你们父亲犹大说。我是父亲雅各的第四个儿子；我母亲利亚给我起名叫犹大，说：‘我要赞美主，因为他又赐给我第四个儿子。’4 我年轻时十分敏捷，凡事都听从父亲。5 我尊敬母亲，也尊敬我母亲的姐妹[a]。6 我长大以后，父亲为我祈求，说：‘你必作王，凡事顺利[b]。’”'
