  text: 'The Testament of Judah[a], the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.


    2 So they gathered and came to him, and he said to them:


    3 “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’ 4 I was keen in my youth, and I obeyed my father in every matter. 5 And I honored my mother and my mother''s sister. 6 And when I had grown up, my father blessed me, saying, ‘You shall be a king[b], prospering in all things.’”'
translation:
  language: zh_hans
  text: '《犹大遗训》


    雅各和利亚的第四个儿子犹大。


    犹大临死前对他儿子们所说的话的抄本。


    2 于是，他们聚集起来，来到他那里；他对他们说：


    3 “我的孩子们，要听你们父亲犹大的话。我是父亲雅各的第四个儿子；我母亲利亚给我起名叫犹大，说：‘我要赞美主，因为他又赐给我第四个儿子。’4 我年轻时很机敏，凡事都听从父亲。5 我尊敬母亲，也尊敬我母亲的姐妹[a]。6 我长大以后，父亲为我祈求，说：‘你必作王，凡事顺利[b]。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我母亲的姐妹”，明确保留了这一亲属关系；汉语也可称“姨母”。
    reason: lexical_alternative
  - marker: b
    text: 译作“顺利”的词也可表示道路亨通、蒙引导而成功，或所行的路得以畅通。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαθήκη
  choice: 遗训
  rationale: 在本书的文学体裁中，指族长临终留下的训言；译作“遗训”比“约”更能避免误解为立约。
- source_word: Ἀντίγραφον λόγων
  choice: 所说之话的抄本
  rationale: 保留文本自称为话语书面副本的文献框架，同时采用自然的现代汉语表达。
- source_word: Ἀκούσατε
  choice: 要听……说
  rationale: 既保留郑重命令的语气，又使省略性较强的希腊语称呼在汉语中通顺。
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην
  choice: 我是……第四个儿子
  rationale: 按汉语表达出生次序的习惯翻译，不机械译作“成为”。
- source_word: Ἀνθομολογοῦμαι
  choice: 我要赞美
  rationale: 表达利亚因所得恩赐而向上主献上感谢和赞美的含义。
- source_word: Κυρίῳ
  choice: 主
  rationale: 此处是对以色列之上帝的神圣称号，采用简洁而庄重的常用译法。
- source_word: ὀξὺς
  choice: 敏捷
  rationale: 该词可表示迅速、锐利或精力旺盛；“敏捷”保留青年犹大行动迅速的正面形象，又不限定为智力上的聪明。
- source_word: κατὰ πάντα λόγον
  choice: 凡事都听从
  rationale: 这里的 λόγος 在服从父亲的语境中可指所说的每件事或每项吩咐；汉语用“凡事”较自然。
- source_word: ηὔξατό μοι
  choice: 为我祈求
  rationale: 依现存希腊文本按“为某人祈求”处理，不把祈求的行为直接改写为已经实现的祝福。
- source_word: κατευοδούμενος
  choice: 凡事顺利
  rationale: 该分词表示道路亨通、进展顺遂；与 ἐν πᾶσιν 合译为自然的“凡事顺利”。
theological_decisions:
- issue: 利亚称呼上帝的 κύριος
  choice: 主
  alternative: 上主
  rationale: “主”准确保留神圣称号，也符合现代简体中文宗教文本的庄重语体，不额外引入专名。
- issue: 父亲对犹大的话是祈求还是直接祝福
  choice: 父亲为我祈求
  alternative: 父亲祝福我
  rationale: 希腊文本 ηὔξατό μοι 直接呈现父亲为犹大祈求；虽然后接的话具有祝福和预言性质，正文不以功能性解释替代原文动作。
- issue: “你必作王”的性质
  choice: 保留直接的未来陈述
  alternative: 你将像王一样掌权
  rationale: 原文明确使用 βασιλεύς，不将其弱化为比喻，也不进一步规定这句话的历史或弥赛亚解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。标题用“遗训”标明临终训言体裁；叙事和直接引语保留原文层次。对语义范围较宽的 ὀξύς 与 κατευοδούμενος 不作过度限定，并用脚注说明后者的可能含义。
