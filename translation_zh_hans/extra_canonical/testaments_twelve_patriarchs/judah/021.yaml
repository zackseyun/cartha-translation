  language: zh_hans
  text: '《犹大遗训》第21章


    1 “现在，我的孩子们，我吩咐你们：要爱利未，好使你们长久存留；不要抬高自己，凌驾于他之上，免得你们被彻底毁灭。2 因为上帝把王权赐给了我，把祭司职分赐给了他，又使王权服从祭司职分。3 他把地上的事赐给了我，把天上的事赐给了他。4 因此，上帝的祭司职分高于地上的王权；除非它因罪而离弃主，受地上的王权辖制。


    5 “因为主的天使对我说：‘主拣选了他，使他居于你之上，可以亲近主，在主的席上吃饭，并把以色列子孙佳美出产中的初熟之物献给主。[a] 但你必作雅各的王。’


    6 “你在他们中间必像海一样。海中有义人，也有不义的人；有些被掳，有些发财。同样，在你当中也会有各族的人：有些身陷险境，被人掳去；[b]有些则夺取别人的财物，因而发财。7 因为那些作王的必像海怪，吞吃人如同吞吃鱼；他们必奴役自由人的儿女，抢夺房屋、田地、羊群和财物。8 他们要不义地使乌鸦吞食许多人的血肉；[c]他们在恶中、在贪婪中自高，又会在恶事和这等骄傲中越发进展，直到被高举。9 假先知必如暴风一般，并且迫害所有义人。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “佳美出产中的初熟之物”可能指以色列人从上好产物中献出的初熟供物。
    reason: cultural_note
  - marker: b
    text: 此处希腊文本用词形式异常，含义不完全确定；译文依上下文译作“身陷险境”。
    reason: textual_variant
  - marker: c
    text: 本句希腊文本句法残缺且次序混乱。译文暂按“使乌鸦吞食许多人的血肉”理解，所描绘的可能是暴政造成大量死者，尸身成为食腐鸟的食物；其后关于作恶、贪婪和自高的措辞也有不确定性。
    reason: textual_variant
lexical_decisions:
- source_word: παραγγέλλω
  choice: 我吩咐你们
  rationale: 保留临终训诫中带约束力的命令语气，同时符合现代汉语表达。
- source_word: ἀγαπᾶτε
  choice: 要爱
  rationale: 直接保留伦理命令，不弱化为“善待”或“尊重”。
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: 不要抬高自己，凌驾于他之上
  rationale: 保留原文“抬高”的垂直意象及高居利未之上的含义。
- source_word: ἐξολοθρευθῆτε
  choice: 被彻底毁灭
  rationale: 表达复合动词所含的强烈、彻底的毁灭意味。
- source_word: βασιλεία
  choice: 王权
  rationale: 本段重点是上帝赐给犹大的君王职权，而非单指疆域或国家。
- source_word: ἱερατεία / ἱερωσύνη
  choice: 祭司职分
  rationale: 既指祭司身份，也指其制度性职权；统一译法可清楚呈现与王权的对照。
- source_word: ὑπέταξε
  choice: 使……服从
  rationale: 明确保留原文所述王权从属于祭司职分的等级关系。
- source_word: τὰ ἐπὶ γῆς / τὰ ἐν οὐρανοῖς
  choice: 地上的事 / 天上的事
  rationale: 保留宽泛的领域表述和平行结构，不擅自限定为具体事务。
- source_word: ὑπερέχει
  choice: 高于
  rationale: 自然、清楚地表达祭司职分相对于地上王权的优越地位。
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: 离弃主
  rationale: 表达因罪从与主的关系中坠落、偏离的宗教伦理含义。
- source_word: κυριευθῇ
  choice: 受……辖制
  rationale: 保留祭司职分因犯罪而反受地上王权支配的逆转。
- source_word: προσεγγίζειν
  choice: 亲近
  rationale: 在祭司语境中保留接近上帝的礼仪性含义。
- source_word: κήτη
  choice: 海怪
  rationale: 比泛称“大鱼”更能体现大型可怖海中生物的形象。
- source_word: καταδουλώσουσιν
  choice: 奴役
  rationale: 准确表现强制使自由人的儿女沦为奴仆的暴行。
- source_word: καταιγίδες
  choice: 暴风
  rationale: 保留假先知来势猛烈、造成扰乱的比喻。
theological_decisions:
- issue: 犹大王权与利未祭司职分的相对地位
  choice: 上帝将王权赐给犹大，将祭司职分赐给利未，并使王权服从祭司职分。
  alternative: 将二者处理为并列、互不从属的职分。
  rationale: 原文的ὑπέταξε明确表达从属关系，不宜为了调和两种职分而削弱其力度。
- issue: 祭司职分高于王权的条件性
  choice: 以“它”指祭司职分；祭司职分若因罪离弃主，就会反受地上王权辖制。
  alternative: 把离弃主的主语理解为地上的王权，或因句法困难而不作明确翻译。
  rationale: 最近且最自然的语法主语是祭司职分。译文保留祭司地位虽高却可能因罪失落的张力。
- issue: 利未蒙拣选的礼仪性特权
  choice: “亲近主、在主的席上吃饭、献初熟之物”按祭司礼仪语境处理。
  alternative: 仅将“在主的席上吃饭”理解为一般性的属灵团契比喻。
  rationale: 整段围绕祭司职分，三个动作构成明显的圣所和献祭语境。
- issue: 海的比喻所涵盖的审判范围
  choice: 将“在你里面”理解为犹大及其王权所形成的社会政治领域，其中有人被掳，也有人靠掠夺致富。
  alternative: 只把比喻泛指列国，与犹大本身无直接关系。
  rationale: 原文ἐν σοὶ直接指向犹大，同时“各族的人”又扩大了受影响者的范围。
- issue: 君王暴政的描写
  choice: 保留君王如海怪吞人的强烈控诉，以及奴役、掠夺和迫害义人的具体行为。
  alternative: 将这些意象淡化为一般性的治理失败。
  rationale: 原文使用吞吃、奴役、抢夺等强烈动词，具有明确的道德谴责意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“王权—祭司职分”“地上—天上”等平行结构和本段的神学张力；对第6、8节受损或异常的希腊文本不作过度修补，而以脚注说明不确定性。人称代词在可能混淆处改用“主”以保持指称清楚。
