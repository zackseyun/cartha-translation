  rationale: 修订第6节的范围表达，使其符合现代汉语而仍保留对犹大及其范围的指向。修订第8节以较贴近字面且可读的方式处理破损文本，并扩充脚注以明确说明该节后半的语序和句法不确定，避免将原文争议处解释为无歧义的因果关系。其余内容无需改动。
