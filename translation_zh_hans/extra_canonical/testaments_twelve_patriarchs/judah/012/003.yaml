  text: So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment.
translation:
  language: zh_hans
  text: 3 所以，我喝酒醉了，没有认出她来；她的美貌借着她妆饰的样式迷惑了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς οἴνῳ
  choice: 喝酒醉了
  rationale: 明确保留酒是醉酒的缘由，同时采用自然的现代汉语表达。
- source_word: οὐκ ἐπέγνων αὐτήν
  choice: 没有认出她来
  rationale: ἐπιγινώσκω在此表示辨认、认出某人；“认出她来”符合汉语习惯。
- source_word: ἠπάτησέ με
  choice: 迷惑了我
  rationale: 保留“使人受骗、误入判断”的语义，又避免在缺乏更多语境时过度落实为蓄意欺诈。
- source_word: τὸ κάλλος αὐτῆς
  choice: 自己的美貌
  rationale: 保留美貌作为使说话者受迷惑的手段，并明确其属于该女子。
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: 借着妆饰的外表
  rationale: διά加属格表达中介或手段；σχῆμα指外观、样式，κόσμησις指装饰或妆饰。此译保留两层表达而不将其简化为单纯“打扮”。
