  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/007.yaml
  text: For I said, “Perhaps she acted deceitfully, having received the pledge from another.”
translation:
  language: zh_hans
  text: 12:7 因为他们说：“也许她从另一个女子那里收了那些信物[a]，行事诡诈，又拿先前的话来应对我。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信物”原文为复数，指作为保证而交付的物件；“另一个女子”反映希腊文的阴性单数形式。
    reason: 保留ἀρραβῶνας的复数及ἑτέρας的阴性信息。
  - marker: b
    text: “拿先前的话来应对我”直译为“使用最初的话对我”；这句话所指的具体内容和用意在现有语境中不明确。
    reason: 说明τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ的语义含混，避免将其定为某种特定欺骗或辩解。
lexical_decisions:
- source_word: ἐν δολιότητι ἐποίησε
  choice: 使了诡诈
  rationale: 贴近“以诡诈行事”的表达，同时采用自然、庄重的现代汉语。
- source_word: παρὰ ἑτέρας
  choice: 从另一个女子那里
  rationale: ἑτέρας为阴性单数属格；正文保留希腊文明确的阴性形式，不依照英文咨询层将其泛化为“另一个人”。
- source_word: τοὺς ἀρραβῶνας
  choice: 那些信物
  rationale: 该词为复数，指作为保证而交付的物件；“信物”符合本段叙事语境，并保留复数含义。
- source_word: τοῖς πρώτοις λόγοις
  choice: 起初的那番话
  rationale: 直译“最初的话”，以“那番话”使汉语自然，同时不擅自说明具体内容。
- source_word: ἐχρήσατο πρὸς ἐμέ
  choice: 用……来对我
  rationale: 保留χράομαι“使用、采用”及πρὸς ἐμέ“对我”的基本结构，避免解释成“欺骗我”或“应付我”。
theological_decisions:
- issue: 说话内容是事实判断还是带保留的猜测
  choice: 也许
  alternative: 恐怕
  rationale: μήποτε在此引出不确定的推测；“也许”保留说话者的疑虑，不强化为确定指控。
- issue: 第二分句与前句的关系
  choice: 按希腊文保留“又用起初的那番话来对我”
  alternative: 依英文咨询层省略该分句
  rationale: 原文明确包含καὶ τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ，故不应随英文咨询层省略；其确切所指仍保持开放。
translation_notes:
  register: 采用现代标准普通话，叙事语气庄重而易懂。“使了诡诈”略带经文体色彩，但仍属现代读者可理解的表达；后半句有意保持原文句法与语义上的含混。
