  text: After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal attire and sat in Enaim, at the city gate of the inn.
translation:
  language: zh_hans
  text: 12:1 此后，塔玛守寡已有两年；她听说我要上去剪羊毛，就穿戴新娘的装束，在以楠城里，靠近城门坐着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης
  choice: 守寡
  rationale: 准确表达处于寡居状态；与“μετὰ ἔτη δύο”结合，译成自然的汉语时间结构“守寡两年”。
- source_word: ἀνέρχομαι
  choice: 我要上去
  rationale: 保留希腊文表示上行的空间动词，不将其泛化为单纯的“去”。
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: 剪羊毛
  rationale: 按现代汉语习惯表达给羊剪毛这一活动，语义清楚自然。
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: 穿戴新娘的装束
  rationale: 既体现κοσμηθεῖσα的装扮动作，也将κόσμῳ νυμφικῷ理解为新娘所穿戴的装束，避免生硬的“以新娘装饰装饰自己”。
- source_word: ἐν Ἐνὰν
  choice: 在以楠
  rationale: 将地名音译为“以楠”，不依赖英文层所采用的Enaim形式。
- source_word: τῇ πόλει πρὸς τὴν πύλην
  choice: 以楠城门旁
  rationale: 依α栏正文直译为“在以楠这城，靠近城门”；压缩成自然汉语，同时不采纳英文层无希腊文依据的“客店”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。句法以汉语时间顺序组织，并保留第一人称“我要”，符合《犹大遗训》的叙述视角。英文咨询层末尾“of the inn”在所给希腊正文中没有对应词，故未译入。
