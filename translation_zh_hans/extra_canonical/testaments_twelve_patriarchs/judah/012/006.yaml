base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/006.yaml
  text: And when I called her, I also heard the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord.
translation:
  language: zh_hans
  text: 我叫她来后，又听见那些隐秘的话；那些话是我在醉酒中与她同寝时说的。我未能杀她，因为这是出于主的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这”原文没有明说具体所指；译文保留这种未明确界定的表述。
    reason: 保留παρὰ Κυρίου ἦν未明示主语所造成的歧义，不把所指限定为某一人物、言语或事件。
lexical_decisions:
- source_word: Καλέσας δὲ αὐτήν
  choice: 我把她叫来
  rationale: 表达分词所指的先行动作；“叫来”比生硬的“呼叫她”更符合现代汉语，也保留召她前来的含义。
- source_word: τοὺς ἐν μυστηρίῳ λόγους
  choice: 那些隐秘的话
  rationale: ἐν μυστηρίῳ在此表示私下、隐秘状态；译文不将其扩展为宗教意义上的“奥秘”。
- source_word: καθεύδων σὺν αὐτῇ
  choice: 与她同寝
  rationale: 既符合叙事情境，也保留原文“与她睡卧”的含蓄表达，不额外明说性行为。
- source_word: ἐν τῇ μέθῃ μου
  choice: 我醉酒时
  rationale: 自然传达“在我的醉态中”，不削弱醉酒状态。
- source_word: οὐκ ἠδυνήθην ἀνελεῖν αὐτήν
  choice: 我无法杀她
  rationale: ἀνελεῖν在此语境是除掉、杀死；直译为“杀她”清楚而有力度。
- source_word: παρὰ Κυρίου ἦν
  choice: 这事出于主
  rationale: 保留来源于主的表述，同时用“这事”承接希腊文中未明说且指向可能有张力的主语。
theological_decisions:
- issue: “出于主”的所指范围
  choice: 正文译作“这事出于主”，并加注说明所指未明
  alternative: “她是从主而来的”或“那些话出于主”
  rationale: 希腊文ἦν没有明示主语；不宜武断限定为女子、言语或整件事情，因此正文采用概括性表达并在脚注保留歧义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“隐秘的话”“同寝”“出于主”保留原文的含蓄与神学张力；句式适度重整，以符合普通现代汉语的阅读习惯。
