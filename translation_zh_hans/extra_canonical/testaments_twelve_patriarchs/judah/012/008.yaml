  text: But I did not approach her again for the rest of my life, because I had done this abomination in all Israel.
translation:
  language: zh_hans
  text: 但此后我再没有亲近她，直到我生命的尽头。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 英语咨询文本在此增补：“因为我在全以色列中行了这可憎之事。”所据希腊语正文无此句。
    reason: 准确说明英语咨询文本与指定希腊语正文的差异，不在未提供异文证据的情况下泛称该增文属于某些传统。
lexical_decisions:
- source_word: ἤγγισα αὐτῇ
  choice: 亲近她
  rationale: 直译为“接近她”，但在此叙事语境中可含委婉的性关系意味；“亲近她”既自然，又保留原文表达的含蓄性。
- source_word: ἔτι
  choice: 此后……再没有
  rationale: 结合否定词 οὐδέ，表达“不再”的时间延续含义。
- source_word: ἕως τῆς ζωῆς μου
  choice: 直到我生命的尽头
  rationale: 原文省略通常与 ἕως 搭配的终点名词，字面近似“直到我的一生/生命”；此译自然地表达“余生直到生命终结”，同时不加入原文没有的因果说明。
theological_decisions:
- issue: 英语咨询文本附加了因果从句“because I had done this abomination in all Israel”
  choice: 不纳入正文
  alternative: 因为我在全以色列中行了这可憎之事
  rationale: 所提供的希腊语正文在句号前结束，仅有“但我不再亲近她，直到我生命的尽头”，没有对应的因果从句。依照原文证据优先原则，不把英语层中的增文带入译文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亲近她”保留原文可能兼具一般接近与性关系委婉语的含蓄；“直到我生命的尽头”使不完整但可理解的希腊表达在汉语中自然成句。
