  text: 2 因为亚摩利人有一项规条：寡妇要在门旁坐满七天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νόμος
  choice: 规矩
  rationale: 这里指亚摩利人的社会习俗或惯例；译作“规矩”比现代法律意义较强的“法律”更自然，同时保留其规范性。
- source_word: τὴν χηρεύουσαν
  choice: 寡妇
  rationale: 指处于丧偶状态的女子；汉语用“寡妇”简洁准确。
- source_word: προκαθεσθαι
  choice: 坐
  rationale: 该不定式的核心意义是坐着或就座；其位置由后面的“门旁”说明，不额外引入卖淫等原文没有的含义。
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: 坐七天
  rationale: ἐπί加时段表示持续七天；汉语无需另加“达”即可自然表达。
- source_word: παρὰ τὴν πύλην
  choice: 在门旁
  rationale: παρά加宾格在此表达靠近门的位置；原文未明确是城门，因此不增译“城”。
