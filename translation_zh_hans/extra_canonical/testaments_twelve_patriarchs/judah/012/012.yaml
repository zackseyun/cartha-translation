lexical_decisions:
- source_word: Ἤμην … ἐτῶν τεσσαράκοντα καὶ ἕξ
  choice: 我当时四十六岁
  rationale: 按现代汉语表达年龄的自然方式翻译；“当时”交代过去时语境，并未把 δέ 生硬译成句首连接词。
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα
  choice: 度过了七十三年
  rationale: ποιέω 与表示时段的宾语连用时表达“度过一段时间”，译为“度过”准确而自然。
- source_word: εἰς Αἴγυπτον
  choice: 在埃及
  rationale: 此处 εἰς 与度过若干年连用，按语义译作停留地点“在埃及”，避免直译成不合汉语习惯的“到埃及”。
- source_word: δέ … καί
  choice: 又
  rationale: δέ 在此承接叙述，καί 连接两个陈述；合译为“又”，既保持衔接，也避免添加原文没有的强转折或时间先后断言。
