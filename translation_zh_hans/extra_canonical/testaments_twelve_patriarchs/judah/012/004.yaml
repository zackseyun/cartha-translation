    issue: “后来”弱化了ὡς的时间／条件衔接。
    rationale: 原文为“当／在……之后”我与她结合时（或结合后），她受孕；“后来”只说事情发生在稍后的某时。改为“我与她同房后”更贴合原文，也更自然。
  - severity: low
    issue: “交给她作抵押”略显省略。
    rationale: 补作“交给她，作为抵押物”可清楚说明杖和冠冕的功能，同时仍忠实表达 εἰς ἀρραβῶνα。
