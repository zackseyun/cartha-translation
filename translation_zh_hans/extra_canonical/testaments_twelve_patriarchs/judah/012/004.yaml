base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/004.yaml
  text: And turning aside to her, I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived.
translation:
  language: zh_hans
  text: 我转向她，对她说：“我要到你那里去。”她说：“你要给我什么？”我便把我的杖和冠冕交给她，作为抵押物。我与她同房后，她就怀了孕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: 转向她
  rationale: 表达转身趋向她的动作；本节希腊文本本身未明说离开道路，故不增译“转到路旁”。
- source_word: Εἰσέρχομαι πρὸς σε
  choice: 我要到你那里去
  rationale: 保留原文委婉而含蓄的说法，不在引语中直接解释为性交。
- source_word: ῥάβδον
  choice: 杖
  rationale: 直接对应手杖或权杖；此处原文没有另一个表示“戒指”的名词。
- source_word: διάδημα
  choice: 冠冕
  rationale: 指束于头上的冠带或王权冠冕；采用庄重且通行的译法，不依据英文咨询层增译“我的王国”或“戒指”。
- source_word: εἰς ἀρραβῶνα
  choice: 作抵押
  rationale: 表示作为日后兑现或取回物品的担保；现代汉语中“抵押”比“凭据”更清楚。
- source_word: συνήλθον αὐτῇ
  choice: 与她同房
  rationale: 该动词组在上下文中委婉表示发生性关系；汉语“同房”既清楚又保持庄重。
- source_word: συνελήφθη
  choice: 怀了孕
  rationale: 在性关系的语境中明确表示受孕。
theological_decisions:
- issue: 是否依照英文咨询文本加入“戒指”和“我王国的”
  choice: 不加入，只译作“我的杖和冠冕”
  alternative: “我的杖、戒指和我王国的冠冕”
  rationale: 所给希腊正文仅有 τὴν ῥάβδον μου καὶ τὸ διάδημά μου 两项，即“我的杖”和“我的冠冕”；翻译以原语言证据为先，不把英文层中缺乏本段希腊正文支持的成分导入正文。
translation_notes:
  register: 采用现代、庄重、易懂的叙事文体。人物直接引语保留原文的性行为委婉语，叙述结果则用“同房”“怀了孕”自然说明。所有物按本节所给希腊正文译为两项。
