  text: But I, not knowing what I had done, wanted to kill her. But she sent the pledges secretly and put me to shame.
translation:
  language: zh_hans
  text: 但我不知道自己做了什么，想要杀她；她却暗中把那些抵押物送来，使我蒙羞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγνοῶν
  choice: 不知道
  rationale: 表达当时并不知情的状态，现代汉语自然清楚。
- source_word: ὃ ἐποίησα
  choice: 自己所做的事
  rationale: 保留关系结构及行为所指的概括性，不擅自补明具体内容。
- source_word: ἤθελον
  choice: 竟想要
  rationale: 译出意愿，同时用“竟”自然呈现叙述中的反差与严重性。
- source_word: ἀνελεῖν
  choice: 杀
  rationale: 此处指夺去性命；采用直接、庄重且无多余解释的译法。
- source_word: τοὺς ἀρραβῶνας
  choice: 那些信物
  rationale: 指作为凭据或抵押交付的物件；“信物”在本语境中自然，并保留其证明身份与交易凭证的功能。
- source_word: κατῄσχυνέ με
  choice: 使我羞愧
  rationale: 保留使役意义，表达信物揭明事实后给叙述者带来的羞耻。
