  text: Yet those in the city said that there had been no prostitute at the gate, because she had come from another place and sat at the gate for a short time.
translation:
  language: zh_hans
  text: 9 然而，城里的人说，城门口并没有妓女；因为她是从别处来的，只在城门口坐了片刻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελεσικόμενον
  choice: 妓女
  rationale: 该词在此处按上下文指卖淫的女子；译作“妓女”符合现代标准汉语，直接而不带古旧色彩。
- source_word: ἐν τῇ πύλῃ
  choice: 在城门口
  rationale: πύλη在城市场景中指城门；“城门口”比单说“门口”更明确自然。
- source_word: πρὸς βραχύ
  choice: 片刻
  rationale: 表达停留时间很短，简洁保留原文的时间限定。
