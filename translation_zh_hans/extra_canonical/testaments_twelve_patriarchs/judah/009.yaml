  text: 'For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.


    2 And when the eighteen years were fulfilled, Esau, my father''s brother, came against us with a heavy and powerful people.


    3 And Jacob struck Esau with a bow, and he fell, slain by Jacob''s bow, dead on Mount Seir.


    4 And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting down around it, we besieged it.


    5 And because they did not open to us after twenty days, while they were watching, I brought up a ladder; and placing my shield over my head, and receiving the stones, I went up and killed four of their mighty men.


    6 And Reuben and Gad killed another six. Then they entered in succession.


    7 Then they asked from us terms of peace, and after counsel had been taken with our father, we accepted them.


    8 And they were giving us five hundred cors of wheat, and five hundred measures of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.'
translation:
  language: zh_hans
  text: '9 十八年间，我父亲与他的兄弟以扫和平相处；我们从美索不达米亚、从拉班那里回来以后，以扫的儿子也同我们在一起。


    2 十八年期满，我父亲的兄弟以扫率领一支强大而有力的队伍前来攻打我们。


    3 雅各用弓射中以扫；以扫的尸体在西珥山上被抬走。[a]


    4 我们追赶以扫的儿子。他们也有一座坚城，我们无法攻进去，便在城的四周驻扎，围困那城。


    5 他们二十天仍不开城门。当他们正在行动时，我架起梯子，把盾牌举在头顶，抵挡从城墙上来的石头，爬了上去，杀了城中四个勇士。


    6 吕便和迦得又杀了六个。


    7 于是，他们向我们求和。我们同父亲商议以后，接纳他们为进贡的属民。


    8 他们一直给我们小麦五百柯珥，[b]油五百量，[c]酒五百量，直到饥荒发生、我们下到埃及的时候。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被抬走”直译可作“被抬起”。“在西珥山上”最直接说明这动作发生的地点；尸体被抬往何处或从何处抬离，原文没有说明。
    reason: 说明 ἤρθη 的被动动作及地点短语所留下的方向不确定性，不增补死亡过程或运输目的地。
  - marker: b
    text: “柯珥”是古代容量单位；其实际容量因时代和地区而异。
    reason: 保留 κόρος 的古代单位名称，避免不可靠的现代换算。
  - marker: c
    text: “油五百量”：油的计量单位在现存希腊文本中残缺不明；“量”是概括译法。酒的单位也只笼统写作“量”。
    reason: 原文油量单位 †ὕφης 文本损坏，而酒使用一般词 μέτρα；正文不虚构具体单位。
lexical_decisions:
- source_word: ἐποίησεν εἰρήνην
  choice: 和平相处
  rationale: 既表达“缔造和平／保持和平”的含义，也符合现代汉语叙事语感；后半句省略的关系按并列结构补作“也与我们和平相处”。
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: 率领一支强悍有力的大军
  rationale: λαός 在战争语境中指随行的群体或军众；βαρύς 在此有强大、令人难以抵挡之意，不机械译作“沉重的人民”。“前来攻打”由 ἐπανῆλθεν ἡμῖν 的敌对语境体现。
- source_word: ἤρθη ὁ νεκρός
  choice: 尸体被抬到
  rationale: 保留希腊文被动式及“尸体”这一明确措辞，不采用英语咨询层所增补的“被雅各的弓杀死、倒下”等内容。
- source_word: περικαθίσαντες … ἐπολιορκοῦμεν
  choice: 在城的四周驻扎，围困那城
  rationale: 准确体现“环绕坐下／驻下”继而围城的军事行动，同时使用自然汉语。
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: 抵挡从城墙上投下来的石头
  rationale: 原短语字面为“接住／承受来自墙上的石头”；结合头顶盾牌的语境，译作“抵挡”最自然，又不额外断定具体投掷方式以外的细节。
- source_word: δυνάστας
  choice: 勇士
  rationale: 本词可指有权势者、首领或强者；战斗语境支持“勇士”，但仍承认“首领”这一可能解释。
- source_word: ὑποφόρους
  choice: 进贡的属民
  rationale: 该词明确表示承担贡赋、处于附属地位的人；不能像英语咨询层那样只译作一般性的“接纳他们”。
- source_word: κόρους
  choice: 柯珥
  rationale: 保留古代容量单位 cor 的专名形式，并以脚注说明，避免用现代单位作未经证实的精确换算。
theological_decisions:
- issue: 雅各射中以扫之后的叙述是否明确说以扫当场死亡
  choice: 按希腊文直译为“以扫的尸体被抬到西珥山上”
  alternative: “以扫被雅各的弓杀死，倒毙在西珥山上”
  rationale: 希腊文称其为“尸体”，自然蕴含其已死亡，却没有英语咨询层后半句的重复说明，也没有明确说尸体是在山上倒下还是被抬到山上；正文保留被动动作，并用脚注提示地点关系的歧义。
- issue: 求和之后以扫诸子的政治地位
  choice: 明确译出“接纳他们为进贡的属民”
  alternative: 只译“我们接纳了他们”
  rationale: ὑποφόρους 明示贡赋性从属关系；译出该信息属于文本忠实，不把它解释为任何后来的宗教或族群主张。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。人名和地名依通行圣经汉译习惯写作“以扫、雅各、西珥、吕便、迦得、美索不达米亚、拉班、埃及”。保留古代战争叙事的直接性，不淡化暴力，也不添加道德评断。第8节补出“每年”并非希腊文显式副词，而是持续未完成式“他们一直给”在纳贡语境中的自然表达；若要求最严格形式对应，也可删去“每年”。
