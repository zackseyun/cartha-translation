  source_fidelity: 草稿总体紧贴希腊文，且正确保留第3节“尸体”与被动动作、第7节的纳贡从属关系，并未跟随英语审校轨迹中第6节无希腊文依据的补充语。可是第1节将“以扫的儿子与我们在一起”增译为“也与我们和平相处”，第5节将含义不确定的 δρώντων 具体化为“趁他们注视的时候”，第8节则无依据增添“每年”；这些都应修正。
  naturalness: 原文汉语整体庄重流畅。修订后以“同我们在一起”准确而自然地表达 μεθ᾽ ἡμῶν；第3节采用“在西珥山上被抬走”，既保持汉语可读性，也不擅自判定尸体是被抬往该山还是从该山抬离。
  terminology: 人地名“以扫、雅各、西珥、吕便、迦得、美索不达米亚、拉班、埃及”均合乎通行现代圣经汉语。保留“柯珥”，并对残缺的油量单位及一般性的酒量单位加注，是稳妥做法。“进贡的属民”可传达 ὑποφόρους 的贡赋性隶属。
  issues:
  - severity: medium
    issue: 第1节把“以扫的儿子与我们在一起”译作“也与我们和平相处”。
    rationale: μεθ᾽ ἡμῶν 只说“与我们在一起／同我们一道”，并未重复 εἰρήνην 或明说和平关系。该增译改变了叙述信息。
  - severity: medium
    issue: 第5节“趁他们注视的时候”过度确定 δρώντων 的意思。
    rationale: δρώντων 的基本义是“他们行动／作为时”，此处虽有文本和语义困难，却不能直接定为“注视”。宜用“当他们正在行动时”保存原文的不确定性。
  - severity: medium
    issue: 第8节加入“每年”。
    rationale: ἦσαν διδόντες 表示过去持续性“他们一直给／不断给”，本身没有“每年”的频率副词。纳贡背景不足以将其固定为年度缴纳。
  - severity: low
    issue: 第3节脚注所列的另一种理解与正文的地点关系说明不够严谨。
    rationale: ἐν ὄρει Σεείρ 最直接修饰“被抬起／被抬走”的动作地点；不能据此断定“被抬到西珥山上”。脚注应仅说明“抬起”究竟指抬走、抬起或运走，以及具体方向未明。
