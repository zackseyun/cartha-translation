source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε² οὖν, τέκνα μου, *τὸν ὅρον τοῦ οἴνου³, *ἔστι γὰρ ἐν αὐτῷ τέσσαρα⁵ πνεύματα πονηρά⁷, ἐπιθυμίας, πυρώσεως, ἀσωτίας, αἰσχροκερδίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/001.yaml
  text: 'Guard yourselves, therefore, my children, from the boundary of wine; for in it there are four evil spirits: desire, burning passion, debauchery, and shameful gain.'
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要遵守饮酒的限度[a]；因为酒中有四种邪灵：欲望、炽烈的情欲、放荡和可耻的贪利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饮酒的限度”直译为“酒的界限”。原文表达不寻常，可能指饮酒应有的界限或限度；其具体所指并不明确。
    reason: 保留ὅρος的“界限／限度”语义范围，并说明正文的自然汉语表达未界定具体限量，也未将其释为禁酒。
lexical_decisions:
- source_word: Φυλάξασθε
  choice: 要谨防
  rationale: 该动词在此带宾语，表达警戒、防备之意；“谨防”自然地传达劝诫语气。
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: 酒的界限
  rationale: ὅρος通常指界限、边界或限度。原表达本身不寻常，因此保留其意象与歧义，不擅自释为“饮酒过量”或“完全禁酒”。
- source_word: ἐπιθυμίας
  choice: 欲望
  rationale: 保留ἐπιθυμία宽泛的欲求含义，不限定为某一种具体欲望。
- source_word: πυρώσεως
  choice: 炽烈的情欲
  rationale: πύρωσις本义涉及燃烧、灼热；结合列举恶灵的语境，以“炽烈”保留火热意象，以“情欲”表达这里的强烈激情。
- source_word: ἀσωτίας
  choice: 放荡
  rationale: 该词可指挥霍、无节制及生活放纵；“放荡”适合此处道德恶行的列举，也与酒的语境相称。
- source_word: αἰσχροκερδίας
  choice: 可耻的贪利
  rationale: 该复合词包含“可耻/卑劣”与“获利/贪利”两层意义；译文同时保留二者，而不把它具体化为某一种不义收入。
theological_decisions:
- issue: “酒的界限”究竟指适量饮酒、越界过量，还是与酒划清界限
  choice: 正文保留“酒的界限”
  alternative: 译作“饮酒过量”或“远离酒”
  rationale: 希腊文ὅρος的表达含混，原句没有明确说明应避免的是越过限度、限度本身，还是酒本身；不应以译文替作者解决这一张力。
- issue: 四种恶灵是人格化灵体还是恶性倾向
  choice: 译作“四种邪灵”
  alternative: 译作“四种邪恶倾向”
  rationale: 原文明确使用πνεύματα“灵”，故保留其人格化或属灵层面的可能性，同时不进一步界定其本体性质。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体；以“我的孩子们”保留父辈训诲的亲密称呼。列举项保持名词性和节奏一致，分号呈现因果关系。
