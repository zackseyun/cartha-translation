base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/003.yaml
  text: But if you want to live with self-control, do not touch wine at all, lest you drink and sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.
translation:
  language: zh_hans
  text: 但你们若愿意过节制的生活，就完全不要沾酒，免得你们在狂妄的言语、争斗、诽谤，以及违犯上帝的诫命中犯罪，并在你们的时日未到时灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊正文在“免得”之后直接写“你们犯罪”，没有“你们喝酒”一语；英文参考文本所加的“喝酒”反映了另一种文本读法或校订。
    reason: 用户提供的希腊正文与英文审校记录在此处不一致；正文依所给希腊文翻译，并以脚注说明差异。
lexical_decisions:
- source_word: σωφρόνως ζῆσαι
  choice: 过节制的生活
  rationale: σωφρόνως 表示以清醒、自守、节制的方式生活；结合酒的语境译为“过节制的生活”，自然且不把含义缩窄为单纯“保持清醒”。
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: 就完全不要沾酒
  rationale: ἐφάπτεσθε 字面为“触碰、沾染”；汉语“不要沾酒”既保留表达力度，也自然表示不饮酒。ὅλως 译作“完全”。
- source_word: λόγοις ὕβρεως
  choice: 说狂妄的话
  rationale: ὕβρις 在此指傲慢、放肆、侮慢；“狂妄的话”较自然地传达其言语层面的冒犯意味。
- source_word: μάχαις
  choice: 争斗
  rationale: 可指争吵或打斗；“争斗”保留范围，不限定为口角或肢体冲突。
- source_word: συκοφαντίαις
  choice: 诽谤
  rationale: 该词可涉及诬告、恶意控告或诽谤；此处用概括而通顺的“诽谤”。
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: 未到你们的时候
  rationale: 贴近希腊文“不是在属于你们的时候”，在汉语中自然表达“早逝、未到应有之时”，同时保留原文较含蓄的说法。
theological_decisions:
- issue: 饮酒与犯罪之间的句法关系
  choice: 将禁酒表述为避免随后所列罪行的劝诫
  alternative: 把经文解释为一切饮酒本身就是犯罪
  rationale: 原文命令“完全不要沾酒”，随后用目的从句说明所要避免的犯罪后果；不额外断定经文是否把任何饮酒行为本身界定为罪。
- issue: “灭亡”的含义
  choice: 保留为“灭亡”
  alternative: 具体化为“早死”或解释为永恒沉沦
  rationale: ἀπολεῖσθε 可指毁灭、丧命或灭亡；上下文的“未到你们的时候”倾向于早亡，但仍宜保留原词的力度和一定语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要沾酒”符合当代汉语习惯；罪行清单保持并列结构。“未到你们的时候就灭亡”略带书面色彩，以保存原文的含蓄与警戒语气。
