  text: '*Ἐὰν πίνητε οἶνον¹⁰ ἐν εὐφροσύνῃ¹¹, ἐστὶ αἰδούμενος μετὰ φόβου Θεοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/002.yaml
  text: If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness slips in.
translation:
  language: zh_hans
  text: 你们若在欢乐中饮酒，也要怀着对上帝的敬畏而自持。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文后半句语法不规则：前面的“你们饮酒”是复数，随后却出现单数形式，字面近于“他是自持的”。本译文依上下文按对“你们”的劝诫处理。
    reason: 说明源文本中的数不一致及译文所作的最低限度语法调整，避免掩盖原文疑难。
lexical_decisions:
- source_word: ἐν εὐφροσύνῃ
  choice: 在欢乐中
  rationale: 保留介词短语的情境意义；“欢乐”自然、庄重，也不额外加入原文没有的物主限定。
- source_word: αἰδούμενος
  choice: 自持
  rationale: 该分词可表达因羞耻感、谦逊或敬畏而有所节制；“自持”在饮酒语境中自然，并避免把它过度收窄为单纯的“害羞”或礼仪性的“端庄”。
- source_word: μετὰ φόβου Θεοῦ
  choice: 怀着对上帝的敬畏
  rationale: φόβος 在此与上帝相连，既含畏惧也含敬畏；译作“敬畏”符合宗教语境，同时保留约束行为的严肃意味。
theological_decisions:
- issue: 本句对饮酒的态度
  choice: 保留条件式表达，不把经文改写为禁酒命令
  alternative: 译成全面禁止饮酒
  rationale: 原文以“若……饮酒”设定情境，重点是饮酒时仍受对上帝的敬畏约束，并未在本句中明令禁酒。
- issue: 是否纳入英文咨询层中的后续解释句
  choice: 不纳入“因为……醉酒……无耻……”一句
  alternative: 按英文 POB 一并译入
  rationale: 用户提供的希腊文本仅支持当前这一句；英文中的后续内容不见于所给原文证据，因此不据此扩写。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“也要……而自持”使中文句法顺畅，但不增加原文所无的因果说明；“上帝”用于 Θεός。
