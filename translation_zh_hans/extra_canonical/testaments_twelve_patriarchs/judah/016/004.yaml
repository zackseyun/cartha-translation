  to: 酒也会透露上帝和人的奥秘；同样，我也曾向那迦南女子透露上帝的诫命和我父亲雅各的奥秘——这些事是上帝吩咐我不可透露的。
  rationale: 仅统一重复动词的译法，以保留原文的词汇和修辞平行，并避免后两处“泄露”所带的较强额外评价色彩。未改变“上帝和人的奥秘”的歧义，亦仍让“这些事”可统摄前述诫命与奥秘。
