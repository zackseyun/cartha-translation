base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/004.yaml
  text: Wine also reveals the mysteries of God and of men, just as I too revealed to the Canaanite woman the commandments of God and the mysteries of Jacob my father—things that God told me not to reveal.
translation:
  language: zh_hans
  text: 酒也会透露上帝和人的奥秘；同样，我也曾向那迦南女子透露上帝的诫命和我父亲雅各的奥秘——这些事是上帝吩咐我不可透露的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶνος
  choice: 酒
  rationale: 直译该普通名词，在上下文中指酒及其使人吐露隐情的作用。
- source_word: μυστήρια
  choice: 奥秘
  rationale: 保留其宗教及隐秘事务两方面的语义，不缩窄为单纯的“秘密”。
- source_word: ἀποκαλύπτει / ἀπεκάλυψα / ἀποκαλῦψαι
  choice: 揭露／泄露
  rationale: 首处说酒使隐情显露，译作“揭露”；后两处涉及把本不该说的事告诉女子，译作“泄露”，自然呈现负面语境，同时保留同一词根的揭示含义。
- source_word: τῇ Χαναναίτιδι
  choice: 向那迦南女子
  rationale: 与“泄露”直接连用，体现希腊语间接受词；“女子”不额外断定其婚姻或年龄身份。
- source_word: ἐντολὰς τοῦ Θεοῦ
  choice: 上帝的诫命
  rationale: ἐντολή通常指命令或诫命；此处采用庄重而通行的圣经用语。
- source_word: ἃ μοι εἶπεν ὁ Θεὸς μὴ ἀποκαλῦψαι
  choice: 就是上帝吩咐我不可泄露的事
  rationale: 希腊语字面为“上帝告诉我不要揭露的事”；依语境译为“吩咐”，清楚表达禁止之意，不增加禁止对象。
theological_decisions:
- issue: “上帝和人的奥秘”的所属关系
  choice: 上帝和人的奥秘
  alternative: 关于上帝和人的奥秘
  rationale: 保留两个属格的简洁形式及其潜在歧义，不擅自判定为“属于”还是“关于”。
- issue: 关系代词ἃ的先行范围
  choice: 以“就是……的事”统摄前述“诫命”和“奥秘”
  alternative: 仅指“我父亲雅各的奥秘”
  rationale: 中性复数ἃ可概括前述多个中性复数宾语；译文保留其整体回指，不人为限缩。
- issue: 上帝禁令的内容
  choice: 上帝吩咐我不可泄露这些事
  alternative: 上帝告诉我这些事，却没有吩咐我不可泄露
  rationale: μὴ ἀποκαλῦψαι依附于εἶπεν，最自然地表达上帝告诉他说不要揭露；译文不补充禁令的对象或场合。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“酒也会……”保持格言式陈述；分号连接一般原则与犹大的自述。“揭露／泄露”避免重复生硬，并显出后半句违背禁令的负面意味。无脚注，因此正文不设脚注标记。
