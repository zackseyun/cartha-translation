  terminology: “上帝”“诫命”“奥秘”“迦南女子”“雅各”均合乎现代中文圣经/古代文献的庄重书面语，并忠实保留原文的用语和歧义。“上帝和人的奥秘”不擅自判定两个属格究竟表示归属还是内容。
