  text: 1[a]. And on the next day we went to Areta, a city still mighty and strong, threatening us with death. 2. But I and Gad attacked from the east of the city, and Reuben and Levi from the west. 3. And those on the wall, thinking that we were alone[b], were drawn out toward us. 4. So my brothers secretly, from both sides of the wall, climbed it with stakes and entered the city without their knowing it. 5. And we took it by the edge of the sword, and those who had fled for refuge in the towers we burned with fire; and so we captured them all. 6. And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue. 7. And we killed them also, and burned the city[c], and everything in it.
translation:
  language: zh_hans
  text: '《犹大遗训》第5章


    1. 次日，我们前往阿雷塔；那是一座坚固的城，扬言要置我们于死地。我和迦得从城东进攻，吕便和利未则从城西进攻。


    2. 城墙上的人以为只有我们在此，就被引向我们这里。


    3. 城墙跃起了。[a]


    4. 我的兄弟们就这样暗中从城墙两侧进入城内。[b]


    5. 我们用刀剑攻取了那城；那些逃进塔楼避难的人，我们用火焚烧。这样，我们俘获了所有的人和他们的一切财物。


    6. 我们离开的时候，巴布埃人[c]夺去了我们的俘虏；我们看见了，就与他们交战。


    7. 我们把他们全都杀了，又夺回了我们的俘虏。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城墙跃起了”是现存希腊正文的直译，但这句话在上下文中很难理解，文本可能有讹误。一些其他文本见证把这里和下一句写成兄弟们借木桩或木橛攀上城墙。
    reason: textual_variant
  - marker: b
    text: 另一些文本见证更具体地说，他们借木桩或木橛攀墙，并在守军不知情时进入城内；本译文主文遵照所指定的较短希腊正文。
    reason: textual_variant
  - marker: c
    text: 希腊正文的“巴布埃”前有表示文本可疑的校勘符号。其他见证所载的地名包括“塔福埃”和“巴图埃”等形式。
    reason: textual_variant
  - marker: d
    text: “俘虏”所译的希腊词也可泛指战争中的掳获物。另有较长文本在这里叙述把俘虏交给儿子们、追击到塔福埃，并焚烧那城；这些内容不见于本译所据的希腊正文。
    reason: textual_variant
lexical_decisions:
- source_word: πόλιν κραταιάν
  choice: 一座坚固的城
  rationale: κραταιός表示强大、坚固；源文本只有一个形容词，不沿用英文咨询层中双重形容词的扩充。
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: 扬言要置我们于死地
  rationale: 保留分词结构所表达的主动威胁和强烈敌意，同时使用自然的现代汉语。
- source_word: προσέφθημεν
  choice: 抢先……进逼
  rationale: 该动词含有先到、抢先行动之意；结合从东西两面接近城池的军事语境，以“抢先……进逼”兼顾先行与进军的意味，不直接改作“攻击”。
- source_word: ἐφειλκύσθησαν πρὸς ἡμᾶς
  choice: 被引向我们这里
  rationale: 保留被动语态和πρός的趋向含义；不明确添加“诱出城外”，因为源文本只说他们被引向犹大一方。
- source_word: λάθρα
  choice: 暗中
  rationale: 简洁表达秘密、未被察觉的行动。
- source_word: ἐν στόματι μαχαίρας
  choice: 用刀剑攻取
  rationale: 这是闪族色彩浓厚的军事习语；中文不机械译作“刀口”，而以“用刀剑”保留武力攻取的含义。
- source_word: τοὺς ἐν τῷ πύργῳ καταφυγόντας
  choice: 那些逃进塔楼避难的人
  rationale: καταφεύγω含逃往某处寻求庇护之意；πύργῳ在本源文本中为单数，故译“塔楼”。
- source_word: πάντα τὰ αὐτῶν
  choice: 他们的一切财物
  rationale: 字面为“他们的一切”；上下文是攻城后的掳掠，以“财物”自然呈现所指，同时不把它与前面的人员混为一谈。
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: 我们的俘虏
  rationale: αἰχμαλωσία既可指被掳状态，也可集合性地指俘虏；此处可被夺去并重新夺回，译作“俘虏”最符合叙事，但以脚注保留“掳获物”的可能。
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: 与他们交战
  rationale: 按语境表达“接战、交战”的军事惯用意义，行文简明庄重。
theological_decisions:
- issue: 第3节难解句“ἀνεπήδησεν τὸ τεῖχος”
  choice: 直译为“城墙跃起了”，并加注说明文本疑难
  alternative: 据其他文本传统补作“借木桩攀上城墙”或将该句与下一节合并
  rationale: 所给α栏正文语法上确实说“城墙跃起”，但在叙事中意义异常，可能存在抄传讹误。依原文优先原则，不从英文咨询层补入本源正文所无的“木桩”，也不静默修正。
- issue: 第4节进入城内的具体方式
  choice: 译出“暗中从城墙两边进入城内”
  alternative: 补充“用木桩攀墙，并趁守军不知情进入”
  rationale: 指定的希腊正文仅陈述从城墙两边秘密进入，没有木桩或“守军不知”的明文；较长形式属于其他见证，应只在脚注中交代。
- issue: 第6节地名†Βαβουὲ的文本状态
  choice: 音译“巴布埃人”，以脚注标明地名可疑
  alternative: 按其他见证译作“塔福埃人”或“巴图埃人”
  rationale: 遵循指定α栏正文，不以英文咨询层的Thapphoue替换Βαβουὲ；剑号显示该词文本有疑问，因此透明标注。
- issue: 第6—7节战斗叙事的范围
  choice: 只译“与他们交战；把他们全都杀了，又夺回俘虏”
  alternative: 补入“把俘虏交给儿子们”“追至塔福埃”“焚烧城和其中一切”
  rationale: 这些细节见于英文咨询层所代表的另一文本形态，却不在指定的希腊正文中；不得用后起或旁系读法扩写主文。
translation_notes:
  register: 采用现代标准书面汉语，叙事简洁而庄重。专名按希腊形式音译；军事表达力求清楚但不扩写。主文严格以所给Charles 1908希腊α栏净文本为先，英文POB仅作咨询；凡英文层所含而指定希腊正文所无的木桩、交给儿子、追至某地及焚城等细节，均不纳入主文，只在必要处说明文本传统的差异。
