  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025.yaml
  text: '1. And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be chiefs of the tribes in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and so all the rest in order.


    2. And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.


    3. And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.


    4. And those who died in sorrow will rise in joy, and the poor for the Lord’s sake will be made rich, and those dying for the Lord’s sake will awake to life.


    5. And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.'
translation:
  language: zh_hans
  text: '1 此后，亚伯拉罕、以撒和雅各必复活得生命；我和我的弟兄们也必在以色列中作领袖：第一是利未，第二是我，第三是约瑟，第四是便雅悯，第五是西缅，第六是以萨迦，其余各人也都依次而列。


    2 主赐福给利未；上帝面前的天使赐福给我；荣耀的众权能赐福给西缅；天赐福给吕便；地——海赐福给约瑟；众光体赐福给但；福乐赐福给拿弗他利；太阳赐福给迦得；月亮赐福给亚设。[a]


    3 你们必成为主的子民，说同一种语言。在那里，彼列的迷惑之灵必不再存在，因为它必被永远抛出去。


    4 那些在忧伤中离世的人必复活；因主而贫穷的人必得富足；为主而死的人必苏醒得生命。


    5 雅各的鹿群必欢腾奔跑，以色列的群鹰必喜乐飞翔；〔恶人必悲哀，罪人必哭泣〕[b]；万民都必永远荣耀主。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据希腊文本在“地”之后没有写出与前列各项相应的受福者，随后却接“海……约瑟”，使这份赐福名单呈现断裂。其他文本见证补有以萨迦、西布伦、山岭、帐棚和便雅悯等项目；这里不据其他见证补全正文。
    reason: 准确交代指定希腊正文在“地”处的句法缺项及其后残存短语，并避免将其他见证的重构写入正文。
  - marker: b
    text: “恶人必悲哀，罪人必哭泣”在所据版本中以方括号标出，文本地位不确定。
    reason: 保留编辑者对该短句真实性或原始性的保留。
lexical_decisions:
- source_word: ἀναστήσεται / ἀναστήσονται
  choice: 复起
  rationale: 保留从死亡中起来的复活含义，同时避免把经文未明说的复活形态进一步教义化。
- source_word: ἔξαρχοι
  choice: 领袖
  rationale: 该词指居首位或带领者；原文没有“支派”一词，因此不增译为“各支派的首领”。
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: 侍立在上帝面前的天使
  rationale: 按闪语背景表达“面前/临在的天使”，用自然汉语传达其在上帝面前侍立之意；“上帝”仅为补明关系，不将此天使等同于上帝。
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: 荣耀的众权能
  rationale: 保留复数及可能指天上权能者的含混性，不擅自具体化为某一级天使。
- source_word: οἱ φωστῆρες
  choice: 众光体
  rationale: 涵盖天上的发光体，不限缩为星辰或灯。
- source_word: ἡ τρυφή
  choice: 福乐
  rationale: 兼顾愉悦、丰美和享乐之义，适合此处拟人化的赐福清单。
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  choice: 彼列那迷惑人的灵
  rationale: 表达πλάνη的迷惑、引人偏离之意，并保留该灵与彼列之间的所属关系。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 原文只有“直到永世/永远”，并未出现“火”，故不据英语咨询层增添“投入永火”。
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: 雅各的群鹿
  rationale: 严格依所给希腊文的Ἰακώβ，不采用英语咨询层的“约瑟”。
theological_decisions:
- issue: 第三节彼列之灵的最终处置
  choice: 它必被永远抛出去
  alternative: 它必被投入永火
  rationale: 希腊文ἐμβληθήσεται εἰς τὸν αἰῶνα没有“火”；不从其他传统或咨询文本补入末世刑罚的具体媒介。
- issue: 第四节复起时的状态
  choice: 在忧伤中离世的人必复起
  alternative: 在忧伤中离世的人必在喜乐中复起
  rationale: 原文有ἐν λύπῃ修饰离世，却没有“在喜乐中”；避免为了形成对偶而增补。
- issue: 第二节赐福者清单的残缺
  choice: 保留现存希腊文的不完整次序，并以脚注说明
  alternative: 从其他见证补入以萨迦、西布伦、山岭和帐棚等项目
  rationale: 指定的α栏正文在“大地”之后缺少受词，也未载英语咨询层中的若干项目；不把未见于所给正文的材料无标记地写入正篇。
- issue: 第五节括号内审判语句
  choice: 收入正文并标注文本问题
  alternative: 完全删去“恶人必悲哀，罪人必哭泣”
  rationale: 该句出现在所给希腊文中，但以方括号标示文本地位不稳；收入并加脚注可同时保存内容和不确定性。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。人名使用常见中文圣经译名。第二节刻意保留源文本清单的断裂，以脚注交代，不以英语咨询层静默补足；第三至五节同样优先遵从所给希腊正文。
