  text: 1 And I knew that the race of the Canaanites was evil[a], but the impulse of youth blinded my understanding. 2 And when I saw her pouring wine, I was deceived, and I took her, though my father had not given counsel. 3 But while I was away, she went and took for Shelah a wife from Canaan. 4 And when I learned what she had done, I cursed her in the anguish of my soul. 5 And indeed she died in her wickedness[c][b], with her children.
translation:
  language: zh_hans
  text: '《犹大遗训》第11章


    1 我明知迦南人的族类是邪恶的[a]，青春的冲动却蒙蔽了我的心智。2 我看见她斟酒，就受了迷惑；我娶了她[b]，而我父亲并未为此出主意[c]。3 我的儿子珥……[d] 4 他死去一年后，我因害怕自己将要死，醒悟过来，便领那正在长大的出来。[d] 5 但她趁我不在时，去为示拉娶了一个来自迦南的女子。我得知她所做的事，就在心灵的痛苦中咒诅她。她也果然死在自己的邪恶中，她的儿子们也与她一同死了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族类”所译的希腊词γένος可指血统、亲族或族群；这里反映的是古代对亲族出身的说法，并非现代生物种族分类。也可译作“迦南人的族系是邪恶的”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“我取了她”，措辞简短突兀；按上下文是“娶她为妻”的意思。
    reason: lexical_alternative
  - marker: c
    text: 这句话也可理解为“没有听取我父亲的意见”或“未经我父亲赞同”；希腊文只明确说父亲没有参与商议或提出意见。
    reason: alternative_reading
  - marker: d
    text: 第3—4节的现存希腊文本残缺，句法不完整，代词和“那正在长大的”所指何人均不清楚。本译文只按尚可辨认的词句试译，不据后来的流畅文本擅自补全。
    reason: textual_difficulty
lexical_decisions:
- source_word: πονηρὸν γένος τῶν Χαναναίων
  choice: 迦南人的族类是邪恶的
  rationale: γένος可指血统、族类或群体；“族类”保留古代亲族与出身的含义，避免赋予现代生物种族概念。πονηρός直译其道德判断为“邪恶”。
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: 青春的冲动
  rationale: διαβούλιον本可指谋划或考虑，但此处犹大承认年轻时的驱力压倒判断；“青春的冲动”在现代汉语中自然，也保留其自责语气。
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: 蒙蔽了我的心智
  rationale: 保留“使……失明”的比喻意义；διάνοια指理解、思想或判断能力，“心智”兼顾思想与判断。
- source_word: οἰνοχοοῦσαν
  choice: 斟酒
  rationale: 该分词指倒酒或侍酒；“斟酒”简洁具体，符合场景。
- source_word: ἠπατήθην
  choice: 受了迷惑
  rationale: 保留被动形式，既表达被引入歧途，也不替叙述者卸除责任。
- source_word: ἔλαβον αὐτήν
  choice: 我娶了她
  rationale: λαμβάνω以女子为宾语时可表示娶妻。汉语“取了她”容易产生非婚姻性的误解，故正文明确其在语境中的婚姻含义，并以脚注说明希腊文原句较为简短突兀。
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: 我父亲并未为此出主意
  rationale: 该属格独立结构表明父亲没有参与商议或提出意见；此译法不把含义收窄为正式的法律许可。
- source_word: ἀπόντος ἐμοῦ
  choice: 趁我不在时
  rationale: 自然表达“在我缺席时”，并贴合她自行采取行动的叙事语气。
- source_word: ἔλαβε τῷ Σηλὼμ γυναῖκα
  choice: 为示拉娶了一个……女子
  rationale: 此结构指为某人取得或安排妻子；现代汉语通常说“为某人娶妻”。
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: 在心灵的痛苦中
  rationale: ὀδύνη表示强烈痛苦，ψυχή在此指内在生命或心灵；译文保留庄重的忏悔语气。
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  choice: 死在自己的邪恶中
  rationale: 保留ἐν所表达的处境或状态，不擅自改成明确的因果关系“因她的恶而死”。
theological_decisions:
- issue: 对迦南人的集体道德判断
  choice: 直接译出“迦南人的族类是邪恶的”
  alternative: 迦南人中有人行恶／迦南人的风俗败坏
  rationale: 原文作整体性的族群道德判断，是该遗训修辞的一部分。译文不应将其软化为个别行为，也不应增添现代种族理论；脚注说明γένος的古代亲族含义。
- issue: ἔλαβον αὐτήν的婚姻含义
  choice: 正文译作“我娶了她”
  alternative: 我取了她／我把她带走了
  rationale: 上下文明确涉及婚姻，而现代汉语若机械保留“取”会模糊或误导。脚注保留原文措辞简短突兀这一形式特征。
- issue: 妻子之死与“邪恶”的关系
  choice: 译作“死在自己的邪恶中”
  alternative: 因自己的邪恶而死
  rationale: 希腊文使用ἐν而非明确的原因连接词；选译保留处境与因果之间可能存在的张力，不将神学因果说得比原文更确定。
- issue: 第3—4节残缺文本的处理
  choice: 在正文中尽量直译可辨认内容，并用省略号和脚注标明语法及指代不明
  alternative: 依照流畅的旁证版本整段删去／无标记地重构
  rationale: 所给希腊文本确实包含这些词句，但句法明显破损。完全删除会漏译原始证据，无标记重构则会制造并不存在的确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。对第1—2、5节使用流畅的标准普通话；对明显残损的第3—4节不强行润饰成确定叙事，以省略号和脚注公开文本状况。人物名采用常见圣经汉译“珥”“示拉”。
