  text: Καὶ πολλῶν σάρκας ἀδίκως⁵⁵ κόρακας⁵⁵ ἐπὶ κακῷ⁶⁰ τῇ πλεονεξίᾳ ὑψούμενοι· καὶ προκόψουσιν ἐπὶ κακὰ καὶ ὑπερηφανίᾳ τοιούτου ἕως ὑψοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/008.yaml
  text: And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed.
translation:
  language: zh_hans
  text: 他们会不义地用许多人的肉喂养乌鸦[a]，在贪婪中被高举；他们会在恶事和这类傲慢中越走越远，直到被高举。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文这一分句句法不完整，直列“许多人的肉”和“乌鸦”，没有保存明确的谓语；译文按食腐鸟吞食死者尸肉的意象补出“用……喂养”。本底本正文只写“乌鸦”，没有英语咨询文本中的“朱鹭”。
    reason: textual_difficulty
  - marker: b
    text: 两处“被高举”所据的希腊语形式均可按被动理解；在这里与贪婪、恶事和傲慢相连，也可能含有“自高”的意思。译文保留其语态和语义上的歧义。
    reason: semantic_ambiguity
lexical_decisions:
- source_word: πολλῶν σάρκας
  choice: 许多人的肉
  rationale: 按属格 πολλῶν 修饰 σάρκας 理解，保留多人遭杀戮、尸肉被弃的强烈意象。
- source_word: κόρακας
  choice: 乌鸦
  rationale: 原文明确使用“乌鸦”的复数宾格；本底本正文没有“朱鹭”，因此不据英语咨询层增补。
- source_word: πλεονεξίᾳ
  choice: 贪婪
  rationale: 该词可指贪欲、贪得无厌；此处与自高和作恶相连，译作普通读者易懂的“贪婪”。
- source_word: ὑψούμενοι / ὑψοῦνται
  choice: 自高／高抬自己
  rationale: 两处同源动词均表达抬高、 exaltation；语境带贬义，采用反身表达以呈现骄傲自大的含义，同时保留重复。
- source_word: προκόψουσιν
  choice: 不断加深
  rationale: 本义为前进、进展；与“恶事”和“骄傲”搭配时，译为“不断加深”较自然，并保持其持续恶化之意。
theological_decisions:
- issue: 末句 ἕως ὑψοῦνται 所指的“升高”是自我高抬还是被动升高
  choice: 直到高抬自己
  alternative: 直到他们被高举
  rationale: 上下文连续谈论贪婪和骄傲，且前文 ὑψούμενοι 具有负面语境，因此反身理解较合适；脚注同时说明希腊形式本身容许被动读法，避免抹平歧义。
- issue: 破损句法中首句缺少明确谓语
  choice: 据宾语关系补出“拿……喂饱”
  alternative: 逐词保留不完整句式
  rationale: “许多人的肉”和“乌鸦”均为宾格，现存正文句法不完整；参照可辨认的食腐鸟意象补出最低限度的动作，使中文可读，但以脚注明示补译。
translation_notes:
  register: 采用现代、庄重而直白的叙述语体。“喂饱乌鸦”保留尸肉任食腐鸟吞吃的严厉审判意象；两个分句均尽量保存原文“作恶—骄傲—自高”的递进。由于希腊正文疑有残缺或讹乱，正文以最小补译求通顺，并在脚注中公开说明。
