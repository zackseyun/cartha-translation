  rationale: 修订保留首句因文本句法残缺而作的最小补译，并维持α栏文本只有“乌鸦”的读法。将两处相关动词改为“被高举”，以反映希腊被动形式；脚注明确说明负面上下文容许反身理解，但不在正文中预断。末句改为较自然的现代汉语，同时保留在邪恶和傲慢中持续进展、恶化的含义。
