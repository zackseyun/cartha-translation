  text: Ἐμοὶ γὰρ¹⁰ ἔδωκεν¹¹ ὁ Θεὸς¹² τὴν βασιλείαν, κἀκείνῳ¹² τὴν ἱερατείαν¹³, καὶ¹⁴ ὑπέταξε¹⁴ τὴν βασιλείαν τῇ ἱερωσύνῃ¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/002.yaml
  text: For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood.
translation:
  language: zh_hans
  text: 因为上帝把王权赐给了我，把祭司职分赐给了他，又使王权服从祭司职分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλείαν
  choice: 王权
  rationale: 此处指君王的权柄或统治职分，而非具体疆域；“王权”比“王国”更切合上下文。
- source_word: ἱερατείαν / ἱερωσύνῃ
  choice: 祭司职分
  rationale: 两个近义词在本句中均指祭司的身份、职务或制度；统一译为“祭司职分”，自然且保持对应关系。
- source_word: ὑπέταξε
  choice: 使……服从
  rationale: 保留使役意义及王权从属于祭司职分的明确关系，不进一步解释这种从属的性质或范围。
theological_decisions:
- issue: 王权与祭司职分的关系
  choice: 直译为“使王权服从祭司职分”
  alternative: 使王权隶属于祭司权柄
  rationale: 原文明确表达从属关系，但未说明其制度形式或神学范围；采用较中性的“服从”，避免增添“权柄”等原文没有明说的限定。
- issue: “我”与“他”的所指
  choice: 保留代词“我”和“他”
  alternative: 补明为“犹大”和“利未”
  rationale: 本节原文本身只用代词；不在正文中补入解释，以保留篇章依赖并避免超出本句来源证据。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原文三段并列结构及神学张力，不作教派化阐释。
