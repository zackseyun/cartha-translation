base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/007.yaml
  text: For the kings will be like sea monsters, swallowing people like fish; they will make sons and daughters of free people servants, and they will seize houses, fields, flocks, and wealth.
translation:
  language: zh_hans
  text: 因为那些将要作王的人必像海中巨兽，像吞吃鱼一样吞吃人；他们必使自由的儿女沦为奴隶，并抢夺房屋、田地、羊群和财物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ βασιλεύσουσιν
  choice: 那些掌权作王的人
  rationale: 该形式按现有希腊文本可理解为“那些将要作王的人”；译作“掌权作王的人”既传达其统治者身份，也避免生硬的“将作王者”结构。
- source_word: κήτη
  choice: 海中巨兽
  rationale: κῆτος可指海中庞大而可怖的生物；“海中巨兽”保留比喻的威胁感，又不把它限定为现代动物分类中的鲸。
- source_word: καταπίνοντες ἀνθρώπους
  choice: 吞吃人
  rationale: καταπίνω意为吞下、吞噬，ἀνθρώπους泛指人；此处以“吞吃人”承接后面的鱼类比喻。
- source_word: υἱοὺς καὶ θυγατέρας ἐλευθέρους
  choice: 自由人的儿女
  rationale: 保留“儿子和女儿”的合称意义，并按短语关系理解为原属自由身份之人的子女；现代汉语用“儿女”自然简洁。
- source_word: καταδουλώσουσιν
  choice: 奴役
  rationale: 该动词表示使人成为奴隶、彻底奴役；“奴役”准确保留强制剥夺自由的力度。
- source_word: χρήματα
  choice: 财物
  rationale: 此处与房屋、田地、羊群并列，泛指钱财和产业；“财物”比单译“金钱”范围更合适。
theological_decisions:
- issue: οἱ βασιλεύσουσιν的主语身份与时态
  choice: 那些掌权作王的人必……
  alternative: 众王必……
  rationale: 希腊形式是带冠词的将来时动词，可指“那些将作王的人”，不必将其静态化为已经在位的“众王”；译文保留其预告性质。
- issue: ἐλευθέρους的修饰关系
  choice: 自由人的儿女
  alternative: 自由的儿女
  rationale: 该处文本形态存在句法张力；结合宾语结构和语义，理解为“自由人的儿女”较通顺，但不额外引入族群、阶级或神学身份。
translation_notes:
  register: 采用现代、庄重而直接的叙述语体；保留“海中巨兽—吞鱼”的强烈暴政意象，并用“奴役、抢夺”呈现原文连续的强制行为。
