  source_fidelity: “那些掌权作王的人”将带冠词的将来时形式静态化且重复表达；宜明确其预告性的“将要作王的人”。“自由人的儿女”把ἐλευθέρους解释为修饰父母，超出了该希腊语短语本身可安全确定的范围。译作“自由的儿女”较贴近其显明的自由身份语义，同时不对其有句法张力的具体修饰范围作额外推断。
  naturalness: 原译整体庄重流畅。“像吞吃鱼一样吞吃人”比“吞吃人如同吞吃鱼”更符合现代汉语的比较结构，也更清楚地呈现原文“把人当作鱼吞吃”的意象。
  terminology: “海中巨兽”“奴隶”“抢夺”“财物”均适切。将καταδουλώσουσιν译为“使……沦为奴隶”明确保留“使成为奴隶”的结果性，不弱化为一般压迫。
