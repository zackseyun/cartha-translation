reference: Testament of Judah 21:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἔσῃ³⁶ ἐν αὐτοῖς³⁷ ὡς³⁸ ἡ³⁹ θάλασσα. Καθάπερ⁴⁰ γὰρ⁴¹ ἐν αὐτῇ δίκαιοι καὶ ἄδικοι, οἱ μὲν αἰχμαλωτίζονται οἱ δὲ πλουτοῦσιν⁴⁴, οὕτως καὶ ἐν σοὶ πᾶν γένος ἀνθρώπων· οἱ μὲν †κωδυνεύσουσιν αἰχμαλωτιζόμενοι, οἱ δὲ πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/006.yaml
  text: 'And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.'
translation:
  language: zh_hans
  text: 你在他们中间必如大海。正如海中有义人，也有不义的人；有的被掳，有的富足；照样，在你里面也必有各等人：有的身陷险境，被掳而去[a]；有的则抢夺别人的财物，因而致富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身陷险境”所据的希腊词抄本有讹损，含义不能完全确定；也可能是“遭受痛苦”等相近意思。
    reason: 原文†κωδυνεύσουσιν为文本疑难词，通行理解多据推定校读为与“陷入危险”有关，需向读者标明不确定性。
lexical_decisions:
- source_word: θάλασσα
  choice: 大海
  rationale: 保留原文以海为喻的宏阔形象，也与后文“海中”自然衔接。
- source_word: ἐν αὐτοῖς / ἐν σοὶ
  choice: 在他们中间 / 在你里面
  rationale: 分别保留希腊文的群体空间表达和对“你”的容纳性隐喻，不将后者解释性改写为“在你的后裔中”。
- source_word: δίκαιοι καὶ ἄδικοι
  choice: 义人，也有不义的人
  rationale: 直接呈现原文的伦理对举；不采用英文咨询层中缺少明确希腊文对应的“被风浪颠簸”。
- source_word: πᾶν γένος ἀνθρώπων
  choice: 各等人
  rationale: γένος在此可指种类、族类；“各等人”既涵盖各种人，又避免现代“种族”一词可能造成的过度限定。
- source_word: πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια
  choice: 抢夺别人的财物，因而致富
  rationale: 明确表达两个分词之间自然的手段关系，并保留对不义致富的谴责。
theological_decisions:
- issue: 海中义人与不义之人的遭遇是否按道德类别分配
  choice: 译为“有义人，也有不义的人；有的被掳，有的富足”
  alternative: 把“被掳”仅归于义人，把“富足”仅归于不义的人
  rationale: 希腊文先列“义人和不义的人”，随后用οἱ μὲν…οἱ δὲ…形成另一组对照，但对应关系并不完全明说；译文保留这种张力，不擅自建立严格的一一对应。
- issue: “在你里面”是否明确解释为犹大的后裔或疆域
  choice: 保留“在你里面”
  alternative: 译作“在你的后裔中”或“在你的境内”
  rationale: 原文使用第二人称单数和介词ἐν，所指可具代表性或群体性；直保留其隐喻可避免引入特定历史或教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留海的比喻及原文两组对举，同时以分号划清层次；对文本讹损处不作无提示的确定化处理。
