base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/001.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves against him, lest you be utterly destroyed.'
translation:
  language: zh_hans
  text: 如今，我的孩子们，我吩咐你们：要爱利未，好使你们得以存留；不要傲慢地与他作对，免得你们被彻底除灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶτε
  choice: 要爱
  rationale: 保留命令语气，并以现代汉语中直接、自然的表达传达“爱”。
- source_word: διαμείνητε
  choice: 得以长存
  rationale: διαμένω可指持续、存留；“长存”既保留延续之意，也不额外限定是居住、政治存续还是生命存留。
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: 不要向他自高自大
  rationale: ἐπαίρομαι在此表示抬高自己、骄傲自大；ἐπ᾽ αὐτόν带有针对利未的方向性，因此译作“向他”，避免弱化为一般性的骄傲。
- source_word: ἐξολοθρευθῆτε
  choice: 被彻底除灭
  rationale: 采用被动表达，保留原文的被动语态；“彻底除灭”体现该动词强烈的毁灭、根除意味。
theological_decisions:
- issue: “得以长存”的具体所指
  choice: 保留为“得以长存”
  alternative: “得以继续存在”或“得以存活”
  rationale: 原文没有明确说明存留的是生命、家族、支派还是共同体，故不在译文中作神学性限定。
- issue: “被彻底除灭”的施事者
  choice: 使用未明示施事者的被动句
  alternative: 补译为“被上帝彻底除灭”
  rationale: 希腊文使用被动语态而未明说施事者；即使可能含有神圣被动的意味，也不应在正文中把施事者明确定为上帝。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用“我吩咐你们”体现父亲临终训诫的权威语气；分号呈现两个并列命令及其各自的目的或警告。无需脚注。
