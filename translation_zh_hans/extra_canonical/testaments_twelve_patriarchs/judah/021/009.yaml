  text: And there will be false prophets like storms[a],
translation:
  language: zh_hans
  text: 假先知将像暴风雨一样，并且会迫害所有义人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: 将……出现
  rationale: 该词字面为“将有／将是”；结合主语“假先知”，译为“将……出现”更符合现代汉语，同时保留未来指向。
- source_word: ὡς καταιγίδες
  choice: 如暴风一般
  rationale: 保留明喻结构；καταιγίδες为复数，泛指猛烈风暴，以“暴风”自然表达其突然而猛烈的意象。
- source_word: ψευδοπροφῆται
  choice: 假先知
  rationale: 这是宗教文本中通行且准确的对应语，指虚假的先知。
- source_word: πάντας τοὺς δικαίους
  choice: 所有义人
  rationale: πάντας明确表示全体；δικαίους译为“义人”，保留其道德及神学含义。
- source_word: διώξουσιν
  choice: 要迫害
  rationale: διώκω在敌对语境中指追逼、迫害；“迫害”准确表达持续敌对行动。
theological_decisions:
- issue: “义人”的身份范围
  choice: 保留概括性的“所有义人”
  alternative: 具体化为某一信仰群体
  rationale: 希腊文本未限定其群体身份，不应加入宗派性或解释性限定。
- issue: 假先知与暴风的比喻关系
  choice: 保留“如暴风一般”的开放比喻
  alternative: 解释为假先知来势凶猛、造成毁灭或数量众多
  rationale: 原文没有明说相似点，应保留比喻本身的张力，不在正文中替作者作单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并且要迫害”承接后一分句，完整翻译所提供的希腊原文；不沿用英文咨询层所称文本在前半句后中断的注释，因为当前提供的希腊来源明确包含后半句 καὶ πάντας τοὺς δικαίους διώξουσιν。
