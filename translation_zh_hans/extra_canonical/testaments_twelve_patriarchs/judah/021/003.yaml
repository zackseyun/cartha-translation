  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/003.yaml
  text: To me he gave the things on earth; to him, the things in heaven.
translation:
  language: zh_hans
  text: 他把地上的事物赐给了我，把天上的事物赐给了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐμοὶ
  choice: 给了我
  rationale: 以宾语前置所表达的对比为依据，在汉语中通过前后分句的“我／他”对举自然呈现。
- source_word: τὰ ἐπὶ γῆς
  choice: 地上的事物
  rationale: 保留中性复数冠词短语的概括性，不擅自限定为权柄、职分或具体物品。
- source_word: ἐκείνῳ
  choice: 给了他
  rationale: 译出与Ἐμοὶ形成的鲜明对应；原文省略动词，汉语补出“赐给了”以求清楚自然。
- source_word: τὰ ἐν οὐρανοῖς
  choice: 天上的事物
  rationale: 保留概括性；οὐρανοῖς虽为复数，但现代汉语通常以“天上”自然表达，不机械译作“诸天之中”。
theological_decisions:
- issue: “地上的事物／天上的事物”具体指什么
  choice: 保持概括表述，不加解释
  alternative: 译为“地上的权柄／天上的权柄”或其他特定职分
  rationale: 本句本身没有明确名词来限定这些事物的性质；保留原文的开放性可避免引入特定神学解释。
- issue: 赐予者的身份
  choice: 以“他”指称，不补明身份
  alternative: 根据上下文补为“上帝”或其他人物
  rationale: 希腊文仅由ἔδωκε的第三人称单数形式表达主语，本句未明说其身份，故不应在正文中擅自补定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。重复“赐给了”使两个分句的平行与对比清楚；不用过于古雅的“属地／属天之物”，也不把“天”复数化。
