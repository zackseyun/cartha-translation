base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/004.yaml
  text: For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.
translation:
  language: zh_hans
  text: 因为上帝的祭司职分就是这样高于地上的王权，除非它因罪而背离主，并受地上王权辖制。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: 上帝的祭司职分
  rationale: ἱερατεία在此指祭司的职分或制度；译作“祭司职分”既准确，也与后文作为单数整体的主语相称。
- source_word: ὑπερέχει
  choice: 高于
  rationale: 表达祭司职分相对于地上王权的优越地位，保留比较关系而不额外发挥。
- source_word: τῆς ἐπιγείου βασιλείας
  choice: 地上的王权
  rationale: βασιλεία在此与祭司职分对举，并在后句成为施行辖制的力量，译作“王权”比“王国”更贴合语境。
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: 背离主
  rationale: ἐκπίπτω与ἀπό连用表示从原有关系或地位中坠落、离开；“背离”自然地传达关系上的离弃，同时避免过度解释其后果。
- source_word: κυριευθῇ
  choice: 受……辖制
  rationale: 被动式表示被某权势支配；“受辖制”保留其强制性，并适合抽象主体“祭司职分”。
theological_decisions:
- issue: 祭司职分的优越性是否无条件
  choice: 以“除非”保留条件性陈述
  alternative: 将其解释为祭司职分本质上始终高于王权
  rationale: 希腊文ἐὰν μή明确引入例外条件：祭司职分若因罪背离主，便可能受地上王权辖制。译文不消解这一神学张力。
- issue: 背离主与受王权辖制的逻辑关系
  choice: 按原文并列为“并”
  alternative: 译为明确的因果关系，如“以致”或“因此”
  rationale: 原文以καί连接两个被动动词；虽然语境可能暗含结果关系，但并未明确标示，因此保留并列，避免替原文作决定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就是这样”承接Οὕτως并保留其指前文的语篇功能；句法尽量贴近希腊文，同时避免生硬的欧化表达。
