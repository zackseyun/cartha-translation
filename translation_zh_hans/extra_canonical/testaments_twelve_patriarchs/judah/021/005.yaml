  text: Ὁ γὰρ⁵ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ²⁸, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν³¹ ἐντρυφημάτων³² υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/005.yaml
  text: For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer the firstfruits of the delights of the sons of Israel[c] to him. But you shall be king of Jacob.
translation:
  language: zh_hans
  text: 因为主的天使对我说：“主拣选了他，使他居你之上，可以亲近主，在主的桌前吃饭，并把以色列子孙的佳美之物中初熟的部分献给主[a]。但你必作雅各的王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙的佳美之物中初熟的部分”可能指以色列人献上的上好出产或丰盛的初献之物。
    reason: cultural_note
lexical_decisions:
- source_word: Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος
  choice: 主拣选了他，使他居你之上
  rationale: 保留比较结构“在你之上”的含义，同时用自然汉语表达其受拣选而优先于“你”的意思。
- source_word: προσεγγίζειν αὐτῷ
  choice: 可以亲近主
  rationale: “亲近”保留宗教礼仪语境，又避免将不定式过度具体化；以“主”明示希腊语代词的所指。
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: 在主的桌前吃饭
  rationale: 希腊语字面为“吃他的桌子”，是从桌上进食的惯用表达；译为“在主的桌前吃饭”自然且保留席间亲近的意象。
- source_word: ἀπαρχὰς ... ἐντρυφημάτων υἱῶν Ἰσραήλ
  choice: 以色列众子所享美物的初熟之物
  rationale: ἀπαρχάς译为礼仪性的“初熟之物”；ἐντρυφημάτων可指令人享用、喜悦的佳美之物，译作“所享美物”并保留其具体所指的不确定性。
- source_word: Σὺ δὲ ἔσῃ βασιλεὺς Ἰακώβ
  choice: 但你必作雅各的王
  rationale: 直接保留转折、将来语气及“雅各的王”这一原文表达，不将“雅各”解释性改成“以色列”。
theological_decisions:
- issue: 被拣选者与“你”的相对地位
  choice: 使他居你之上
  alternative: 拣选他胜过你
  rationale: “居你之上”较贴近ὑπὲρ σὲ，又不额外界定这是祭司职分、身份还是尊荣上的优先。
- issue: 三个与主相关的不定式是否均属拣选目的
  choice: 译成“使他……可以亲近……吃饭……献给……”的连续结构
  alternative: 译成三个独立结果陈述
  rationale: 保留希腊文中三个并列不定式与“拣选”的句法联系。
- issue: ἐντρυφημάτων的具体祭物含义
  choice: 美物
  alternative: 珍馐美味／上好出产
  rationale: 原词语义较宽，可能涉及佳美出产或供享用的珍品；正文不把它收窄为某一类祭物，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“主的天使”“初熟之物”等保留经书与礼仪语感；代词所指处适度重复“主”，避免现代汉语中的歧义。
