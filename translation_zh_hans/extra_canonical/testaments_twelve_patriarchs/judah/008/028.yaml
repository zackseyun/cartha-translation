id: T12P.JUD.8.28
reference: Testament of Judah 8:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι ταῦτα ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν ἐκδιδάσκει, καὶ οὐκ ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/028.yaml
  text: For these things draw a person away from the law of God and blind the inclination of the soul, and teach arrogance, and do not allow one to have compassion on his neighbor.
translation:
  language: zh_hans
  text: 因为这些事使人远离上帝的律法，蒙蔽心灵的判断，教人狂傲，不容人怜悯自己的邻舍。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指代及其对上文内容的回指，不擅自具体化。
- source_word: ἀφιστᾷ
  choice: 使人远离
  rationale: 表达使某人与某事疏离、离开的使动含义；补出泛指的“人”，使现代汉语自然。
- source_word: τοῦ νόμου τοῦ θεοῦ
  choice: 上帝的律法
  rationale: 直接对应属格结构，保留宗教与伦理语境。
- source_word: τυφλοῖ
  choice: 蒙蔽
  rationale: 保留“使失明”的隐喻，同时符合汉语描述判断能力受损的惯用表达。
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: 心灵的判断
  rationale: διαβούλιον可指谋虑、判断或思量；此处选“判断”以自然表达内在辨别能力，同时不将其窄化为意志或良知。
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: 教人狂傲
  rationale: ἐκδιδάσκει表示教导、训练；“教人狂傲”保留恶习被培养的含义，并以简洁现代汉语呈现。
- source_word: οὐκ ἀφίει
  choice: 不容
  rationale: 对应“不允许”，语气凝练而庄重。
- source_word: ἐλεῆσαι
  choice: 怜悯
  rationale: 准确呈现施怜悯、动慈心的含义。
- source_word: τὸν πλησίον αὐτοῦ
  choice: 自己的邻舍
  rationale: 保留πλησίον的圣经伦理术语含义，即与自己相关的他人，并非仅指住处相邻者。
theological_decisions:
- issue: “上帝的律法”的性质与范围
  choice: 保留原文概称“上帝的律法”
  alternative: 具体解释为摩西律法或普遍道德律
  rationale: 原文没有进一步限定，不引入特定神学体系对“律法”的划分。
- issue: “心灵的判断”所指的人性机能
  choice: 采用较宽泛的“判断”
  alternative: 译作“良知”“意志”或“谋略”
  rationale: ψυχή与διαβούλιον的组合具有一定语义张力；“判断”既能传达内在思量与辨别，也避免把它固定为某一神学人论范畴。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式依照希腊文的并列推进，保留四重后果的修辞结构；不加脚注，因为正文可在不牺牲关键含义的情况下自然表达。
