revisions:
- from: 上帝的天使又指给我看：女人能掌控君王，也能辖制穷人；她们夺去君王的荣耀、男人的力量，也夺去穷人在贫困中仅有的一点依靠。[a]
  to: 上帝的天使向我显明：女人支配君王，也压制穷人；她们夺去君王的荣耀，夺去男人的力量[a]，也夺去穷人在贫困中仅有的一点支撑。
  rationale: 删除无原文依据的“又”；以更清晰的平行分句呈现三项夺取行为；脚注锚定在产生歧义的“男人的力量”处，并保留现存希腊文的句法张力。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:21:27Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实呈现了κρατοῦσιν、κατακυριεύουσιν及三项“夺去”的格言式陈述，也正确未跟随英语审校文本增添“永远”。但“又”在所给希腊文中没有对应；此外，将三项宾语并列在同一个“夺去”之后，会稍微模糊原文分别指向君王、男人和穷人的排列。
  naturalness: 原译庄重清楚。“掌控／辖制”可懂，但在此处以“支配／压制”表达对不同社会地位者的强势支配，搭配更自然；将三个分句重复为“夺去”也更利落。
  terminology: “上帝的天使”“君王”“穷人”“荣耀”“力量”均合适。ἀνδρός宜保留为“男人”，不应无根据地定为“强者”或改归君王。στήριγμα译为“支撑”能保留维生凭借的具体意味。
  issues:
  - severity: low
    issue: “又”无原文依据。
    rationale: 所给希腊文仅有“上帝的天使向我显示”，没有表示“又、再次”的副词或连词。
  - severity: low
    issue: 三项被夺去之物的对象关系可表达得更清晰。
    rationale: 原文依次提及君王的荣耀、男人的力量、穷人贫困中极少的支撑；分别重复动词可避免汉语读者将其误解为单一并列宾语。
  - severity: medium
    issue: “男人的力量”所在的希腊句法有协调上的困难。
    rationale: 应保留ἀνδρός的通常意义“男人”，同时以脚注说明其与前后“君王／穷人”排列不整齐，避免把问题武断地解释为“强者”或君王自身。
  revised_text: 上帝的天使向我显明：女人支配君王，也压制穷人；她们夺去君王的荣耀，夺去男人的力量[a]，也夺去穷人在贫困中仅有的一点支撑。
