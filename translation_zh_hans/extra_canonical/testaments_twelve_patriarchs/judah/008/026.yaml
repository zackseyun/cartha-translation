source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν βασιλέως αἴρουσιν τὴν δόξαν τοῦ ἀνδρὸς τὴν δύναμιν, *τοῦ δὲ πτωχοῦ *τὴν πτωχείας ἐλάχιστον στήριγμα.
  language: Greek
  note: Greek from Charles XV.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/026.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: zh_hans
  text: 上帝的天使向我显明：女人支配君王，也压制穷人；她们夺去君王的荣耀，夺去男人的力量[a]，也夺去穷人在贫困中仅有的一点支撑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句所据希腊文本在“男人的力量”处与前后“君王／穷人”的并列不甚整齐。ἀνδρός通常意为“男人”；也有人因上下文而理解为“强者”，或把“力量”与君王相连。正文保留现存文本的“男人”。
    reason: 说明现存希腊文的句法困难及可能理解，同时不在正文中擅自消解歧义。
lexical_decisions:
- source_word: κρατοῦσι
  choice: 掌控
  rationale: 表达支配、控制之意；不采英语咨询文本中的“永远统治”，因为希腊文本没有“永远”。
- source_word: κατακυριεύουσιν
  choice: 辖制
  rationale: 保留该词较强的压服、支配色彩，并与前面的“掌控”有所区别。
- source_word: αἴρουσιν
  choice: 夺去
  rationale: 在本句宾语为荣耀、力量和依靠的语境中，表示拿走、除去。
- source_word: δόξαν
  choice: 荣耀
  rationale: 对应常见义“荣耀、尊荣”，保持格言式语气。
- source_word: δύναμιν
  choice: 力量
  rationale: 忠实对应能力、力量之义，不将“男人”擅改为英语咨询文本的“强壮的人”。
- source_word: στήριγμα
  choice: 依靠
  rationale: 比字面的“支撑物”更符合现代汉语，同时保留维持生活之支撑的含义。
theological_decisions:
- issue: 本句对女人支配力的概括范围
  choice: 按希腊文本保留直接而概括性的陈述
  alternative: 加入“永远”或“无论……都……”等强化范围的措辞
  rationale: 原文没有表示“永远”的词；不依据英语咨询层额外扩大时间范围。
- issue: “男人的力量”与前后并列关系
  choice: 保留“男人的力量”
  alternative: 改作“强者的力量”或将其解释为君王自身的力量
  rationale: 现存希腊文本明确有 τοῦ ἀνδρός；其句法受异文或文本传承影响而略显突兀，译文不擅自消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文强烈的格言式概括，不加“永远”，并用“掌控／辖制／夺去”再现逐步加强的支配语气。
