  text: Δέδωκα γὰρ τὴν ῥάβδον μου, τουτέστι τὸ στήριγμα τῆς ἐμῆς φυλῆς, καὶ τὴν ζώνην μου, τουτέστιν τὴν δύναμιν, καὶ τὸ διάδημα, τουτέστιν τὴν δόξαν τῆς βασιλείας μου.
  language: Greek
  note: Greek from Charles XV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/024.yaml
  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: zh_hans
  text: 因为我已经给出了我的杖，也就是我支派的支柱；我的腰带，也就是我的力量；以及我的冠冕，也就是我王国的荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: 杖
  rationale: 保留原文具体意象；此处随后的解释表明它象征支派的倚靠。
- source_word: στήριγμα
  choice: 倚靠
  rationale: 表达支撑、依托之意，在现代汉语中自然，并保留其象征性。
- source_word: φυλῆς
  choice: 支派
  rationale: 在以色列宗族语境中，φυλή通常指支派。
- source_word: ζώνην
  choice: 腰带
  rationale: 直译具体物件，同时由原文同位解释“力量”揭示其象征意义。
- source_word: δύναμιν
  choice: 力量
  rationale: 对应能力、权能或实力；此处采用不作额外神学限定的常用词。
- source_word: διάδημα
  choice: 冠冕
  rationale: 指王权性质的头冠；“冠冕”兼具庄重语体与王室象征。
- source_word: δόξαν τῆς βασιλείας μου
  choice: 我王权的荣耀
  rationale: βασιλεία在此与冠冕相连，更侧重君王权位或统治权，而非疆域意义上的王国。
theological_decisions:
- issue: βασιλεία的语义取向
  choice: 王权
  alternative: 王国
  rationale: 冠冕及其荣耀的语境指向君王身份和统治权；译作“王权”可避免把重点误解为领土国家。
- issue: 三件物品与其解释之间的关系
  choice: 保留“也就是”的显式同位解释
  alternative: 改写为纯比喻句
  rationale: 原文三次使用τουτέστι，明确解释每件物品的象征所指，不宜弱化或合并。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。重复“交出了”以使三个并列动作在中文中清楚，并保留原文逐项陈列、逐项解释的修辞结构。
