source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:34 ('after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him') has no direct α-counterpart in Charles VIII-XXVI. The 'contend against Levi' / 'angel guides Levi' theme is the project's homiletic bridge between the wine-warning section and the Levi/Judah priesthood-vs-kingship discourse of Charles XXI; the α-text moves directly from Judah's Canaanite-marriage shame (XIX-XX) to the 'love Levi' command at XXI.1 without the lawlessness-prediction the project English supplies. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/034.yaml
  text: For I know that after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him and me the spirit of deceit has misled.
translation:
  language: zh_hans
  text: 因为我知道，我死后，你们必行不法之事，与利未争斗；但你们胜不过他，因为主的天使引导他，而我却被欺骗之灵引入歧途。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在查尔斯1908年版《犹大遗训》VIII—XXVI的希腊文α文本中没有直接对应内容。该希腊文本由犹大与迦南女子通婚的叙述转入“要爱利未”的劝告，并未出现这里关于后代行不法之事、与利未争斗，以及主的天使引导利未的预言。本句是本项目连接警戒饮酒段落与利未、犹大之祭司职分和王权论述的讲道性桥接语，正文依项目英文译出。
    reason: 明确披露本节缺少直接希腊文α见证，避免让读者误以为正文可由所列原文直接翻译得出。
lexical_decisions:
- source_word: act lawlessly（项目英文；现存所据希腊文无对应原词）
  choice: 行不法之事
  rationale: 保留“违背律法、行事不法”的含义，同时采用自然、庄重的现代汉语。
- source_word: contend against Levi（项目英文；现存所据希腊文无对应原词）
  choice: 与利未争斗
  rationale: “争斗”保留对抗之意，不擅自限定为言语争辩、政治竞争或武力冲突。
- source_word: guides him（项目英文；现存所据希腊文无对应原词）
  choice: 引导他
  rationale: 直译其持续带领之意，不额外解释引导的方式。
- source_word: the spirit of deceit has misled me（项目英文；现存所据希腊文无对应原词）
  choice: 我却被欺骗之灵引入歧途
  rationale: 保留“灵”的人格化或属灵含义及被误导的被动意味；“却”显明利未受引导与犹大受迷惑之间的对照。
theological_decisions:
- issue: 主的天使与欺骗之灵的对照
  choice: 按项目英文保留两者的鲜明对照，不解释其本体或作用机制
  alternative: 把“天使”解释为普通使者，或把“欺骗之灵”改写成内心的错误欲望
  rationale: 文本本身未作界定，译文不应导入特定天使论、灵界观或心理化解释。
- issue: “不能胜过利未”的范围
  choice: 译为“胜不过他”，保持范围开放
  alternative: 明确译成不能在政治、祭司职分或军事上击败利未
  rationale: 项目英文未限定争斗和失败的具体领域，应保留其神学张力与歧义。
- issue: 希腊底本缺乏本节直接对应文本
  choice: 正文据项目英文谨慎翻译，并用脚注公开说明文本见证状况
  alternative: 把本句当作有直接希腊文支持的经文无注刊出，或完全删去项目经节
  rationale: 既保存项目编排的经节，也诚实区分现存α见证与后设的讲道性桥接文字。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“行不法之事”“与利未争斗”“引入歧途”兼顾原意与自然表达。由于所给希腊文属于相关上文记录，且项目经节没有直接α文本对应，本稿没有用该段希腊文虚构逐词依据，而是明确标注正文依项目英文翻译。
