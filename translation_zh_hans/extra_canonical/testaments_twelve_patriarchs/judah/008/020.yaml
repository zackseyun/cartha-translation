  source_fidelity: 首句基本准确地呈现了Πιὼν的先后关系、娶迦南女子为妻，以及原文中对上帝诫命的轻忽。可是“便不再敬重”中的“不再”预设他此前曾敬重该诫命、如今停止敬重；希腊文οὐκ仅是否定，并无此一“停止/不再”的时间含义。末句所给希腊引文在πολλὴ后残缺；据英文审校轨迹所反映的补足语义，译为饮酒者需要谨慎是稳妥的。
