base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/020.yaml
  text: After I had drunk wine, I did not respect the commandment of God, and I took a woman of Canaan as wife. For much discretion is needed by the man who drinks wine, my children.
translation:
  language: zh_hans
  text: 我喝了酒后，就不敬畏上帝的诫命，还娶了一个迦南女子为妻。孩子们，饮酒的人实在需要格外谨慎。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: 不再敬重上帝的诫命
  rationale: ᾐσχύνθην通常与“羞耻、羞愧”有关，但此处以“诫命”为宾语，语境表达的是没有因敬畏或羞惭而尊重、遵守诫命；译作“不再敬重”既自然，也避免把含义过度缩窄为单纯的“不遵守”。
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: 娶了一个迦南女子为妻
  rationale: ἔλαβον γυναῖκα在婚姻语境中意为“娶妻”；Χαναναίαν明确指迦南女子。
- source_word: Πολλὴ γὰρ τῷ πίνοντι οἶνον
  choice: 饮酒的人实在需要格外谨慎
  rationale: 所提供的希腊文本在此为不完整短语；结合经校核的英文咨询层，以自然汉语补出其意为饮酒者需要高度谨慎。“实在”体现γὰρ在此承接上文的解释语气，“格外”传达πολλή的强调。
theological_decisions:
- issue: 饮酒与犯罪之间的关系
  choice: 保留为饮酒后轻忽诫命，并告诫饮酒者格外谨慎
  alternative: 译成饮酒本身就是违背上帝诫命
  rationale: 原文将饮酒、轻忽诫命和娶迦南女子依次叙述，却没有明确宣布一切饮酒本身都是犯罪；因此不加入原文没有表达的禁酒立场。
translation_notes:
  register: 采用庄重而通顺的现代普通话。“我喝了酒以后，便……”清楚呈现分词Πιὼν的时间关系；“孩子们”保留遗训文学中父亲劝诫后代的语气。
