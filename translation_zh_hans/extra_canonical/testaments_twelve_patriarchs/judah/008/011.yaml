source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: zh_hans
  text: 我派人去取回抵押物，他们却没有找到她。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所据希腊文本仅作：“我派人去取回抵押物，他们却没有找到她。”英文 POB 所述送山羊羔及询问当地人的内容见于《创世记》传统，却不见于此处的希腊 α 替换段。
    reason: 说明底本文本差异，避免读者误以为遗漏英文整合文本中的材料。
lexical_decisions:
- source_word: Ἔπεμψα
  choice: 我派人去
  rationale: 希腊文直译为“我差遣了”；汉语中补出隐含的受差者“人”，使句子自然，但不增添其身份。
- source_word: τοῦ λαβεῖν
  choice: 去取回
  rationale: 表示差遣的目的；结合“信物”语境，“取回”比单纯“拿”更准确自然。
- source_word: τοὺς ἀρραβῶνας
  choice: 信物
  rationale: 指作为担保交付的物件；用“信物”保留其凭据、抵押性质，又符合现代叙事语体。
- source_word: οὐχ εὗρον αὐτήν
  choice: 却没有找到她
  rationale: 忠实保留第三人称复数谓语与阴性单数宾语；“却”自然表达行动目的落空。
theological_decisions:
- issue: 是否纳入英文 POB 中送山羊羔及询问当地人的内容
  choice: 不纳入；仅翻译现存 α 替换段的希腊文本
  alternative: 依照英文 POB 或《创世记》38章补入“送山羊羔”和询问当地人的话
  rationale: 所给希腊文只说差人取回信物而未找到她；补写相关细节会把《创世记》传统导入当前希腊见证，超出原文证据。
translation_notes:
  register: 采用简洁、庄重的现代汉语叙事。“信物”承接上下文中的担保物；不依据英文整合文本扩写希腊原文没有的情节。
