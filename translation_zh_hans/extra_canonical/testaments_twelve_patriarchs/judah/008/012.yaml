  text: Καίγε οἱ ἐν τῇ πόλει ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον, ὅτι ἐξ ἄλλου χωρίου ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ πύλῃ. 10. Καὶ ἐνόμιζον, ὅτι οὐδεὶς ἔγνω ὅτι εἰσῆλθον πρὸς αὐτήν.
  language: Greek
  note: Greek from Charles XII.9-10 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/012.yaml
  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: zh_hans
  text: 城里的人也说，城门口没有人在做那种事；因为她是从别处来的，只在城门口坐了一会儿。[a] 我以为没有人知道我进去到她那里。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “做那种事”对应的希腊词 τελεσικόμενον 词义及其在句中的关系难以确定。此处也可理解为：“城里的人说，城门口没有妓女；她是从别处来的，只在城门口坐了一会儿。”
    reason: 保留 τελεσικόμενον 的文本、语义和句法不确定性，避免在正文中预设其指女性或固定职业。
  - marker: b
    text: 希腊文直译为“我以为没有人知道我进去到她那里”；这是含蓄的说法，并未明确说明所发生的事。
    reason: 说明 πρὸς αὐτήν 的委婉表达，且避免加入所给希腊文本中没有的认罪、羞愧或公开与否的内容。
lexical_decisions:
- source_word: τελεσικόμενον
  choice: 以妓女为业
  rationale: 该词形及语境有文本和释义上的困难；结合城门口女子及前文情境，译出与卖淫活动有关的意思，同时避免照搬英语咨询文本中原文没有的直接引语。
- source_word: ἐξ ἄλλου χωρίου
  choice: 从别处来的
  rationale: 自然表达其来自另一个地方，不把 χωρίον 过度限定为村庄、地区或田地。
- source_word: πρὸς βραχὺ ἐκαθέσθη
  choice: 只……坐了一会儿
  rationale: 保留停留时间短暂之意。
- source_word: ἐν τῇ πύλῃ
  choice: 在城门口
  rationale: 在城市语境中，πύλη 指城门或城门区域；“城门口”符合现代汉语。
- source_word: ἐνόμιζον
  choice: 我原以为
  rationale: 表示犹大当时的判断或设想，不增强为确定知道。
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: 我曾进去找她
  rationale: 保留“进去到她那里”的委婉表达，不把原文含蓄处直接解释为性交。
theological_decisions:
- issue: 是否加入认罪、羞愧及未公开此事
  choice: 不加入
  alternative: 采用英语 POB 的“我明白自己犯了罪……因为羞愧”
  rationale: 所给希腊文本只说城里人的陈述及叙述者以为无人知道他进去找她；认罪和羞愧内容没有出现在该段源文中。
- issue: 是否把城里人的话处理为直接引语
  choice: 采用间接引语
  alternative: 译作带引号的直接引语
  rationale: 希腊文 ἔλεγον 后接不定式结构，更自然地表达为间接陈述；不应依英语层擅自改成直接引语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以希腊源文为准，保留其委婉和不确定之处；鉴于项目章节为主题整合，未强行补入英语咨询层中源文无据的内容。
