  to: 城里的人也说，城门口没有人在做那种事；因为她是从别处来的，只在城门口坐了一会儿。[a] 我以为没有人知道我进去到她那里。[b]
  rationale: 修订以希腊源文优先：保留城中人所作陈述、女子来自别处且短暂坐在城门口，以及叙述者以为无人知道他到她那里。正文不再把语义困难的 τελεσικόμενον 定为“她以妓女为业”，并消除无先行词的“她”。英语 POB 审校文本所含、但不见于本段希腊文的认罪与羞愧内容不予补入。
