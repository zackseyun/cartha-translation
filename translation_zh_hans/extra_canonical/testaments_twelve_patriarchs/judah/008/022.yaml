source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ τὸν ὅρον, ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ καὶ νομίζειν εἶναι καλόν.
  language: Greek
  note: Greek from Charles XIV.8 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/022.yaml
  text: But if he goes beyond the limit, the spirit of deceit attacks his mind and makes the drunkard speak obscenities and transgress, and not be ashamed, but even boast in his disgrace and count it glory.
translation:
  language: zh_hans
  text: 但他若越过限度，迷惑之灵就侵入他的心思，使醉酒的人说污秽的话、行不法之事，并且不以为耻，反倒以自己的羞辱为夸耀，以为那是好事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: 越过限度
  rationale: 保留“跨越界限”的意象；结合上下文，指饮酒超过适当限度。
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: 把迷念投入他的心中
  rationale: 较直接表达“投入其心思”，同时用“迷念”说明投入内容与“迷惑之灵”相应，避免译成原文没有的“攻击”。
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: 迷惑之灵
  rationale: πλάνη可指迷误、欺骗或偏离；“迷惑”兼顾使人受骗与引人走偏的含义。
- source_word: αἰσχρορρημονεῖν
  choice: 说污秽的话
  rationale: 自然表达羞耻、猥亵或不堪入耳的言语。
- source_word: παρανομεῖν
  choice: 行不法之事
  rationale: 保留παρά与νόμος所表达的违越律法或规范之意，不擅自限定为某一种罪行。
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: 夸耀自己的羞耻
  rationale: 保留以可耻之事自夸的强烈反讽。
- source_word: νομίζειν εἶναι καλόν
  choice: 以为这是好事
  rationale: 按希腊文译为“认为是好的”，不采用英文咨询层的“算为荣耀”，以免将καλόν与前句的夸耀合并。
theological_decisions:
- issue: “迷惑之灵”的能动作用
  choice: 保留其作为行动主体，把迷念投入人的心中
  alternative: 意译为醉酒使人思想受骗或心智遭到攻击
  rationale: 原文明确以τὸ πνεῦμα τῆς πλάνης为主语；直译保留文本关于属灵力量与人的越界行为之间的张力，不裁定这种“灵”的本体性质。
- issue: 人的责任与外在诱导之间的关系
  choice: 同时保留“他越过限度”与“迷惑之灵投入迷念”
  alternative: 只强调醉酒者个人失控，或只强调邪灵控制
  rationale: 原文先陈述人的越界，继而陈述迷惑之灵的作用；译文不消解两者并存的责任张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文递进结构：越界—迷念进入—污言与违法—不知羞耻—反以羞耻自夸—颠倒善恶判断。无脚注标记，因为本节无需以脚注处理正文异文或必要歧义。
