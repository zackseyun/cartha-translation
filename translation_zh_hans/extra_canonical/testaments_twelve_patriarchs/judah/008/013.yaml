source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: zh_hans
  text: 过了些日子[a]，传来消息说：“他玛犯了淫乱，已经有了身孕。”我听见后便说：“把她带出来，让她被烧死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本希腊文本作“过了些日子”；《创世记》传统作“约过了三个月”。
    reason: 提示重要的来源差异，并说明为何正文没有采用英语咨询文本中的“三个月”。
lexical_decisions:
- source_word: μεθ’ ἡμέρας τινάς
  choice: 过了些日子
  rationale: 直译现有希腊底本的不定时间表达，不以《创世记》传统中的“三个月”替换。
- source_word: ἐκπεπόρνευκε
  choice: 行了淫乱
  rationale: 表达已经发生的非法性行为；既保留原词的严厉谴责，也避免使用现代汉语中可能过度限定为职业卖淫的说法。
- source_word: ἐν γαστρὶ ἔχει
  choice: 已经怀孕了
  rationale: 按现代汉语自然表达译出字面为“腹中有孕”的意思。
- source_word: Ἐξαγάγετε αὐτήν
  choice: 把她带出来
  rationale: 保留命令语气和公开带出的动作，不增添底本未明说的审判程序。
- source_word: καυθήτω
  choice: 让她被烧死
  rationale: 保留第三人称被动命令的处决含义，并用清楚、庄重的现代汉语表达。
theological_decisions:
- issue: 是否加入犹大对自己愤怒、骄傲或无知的反省
  choice: 不加入
  alternative: “我因愤怒中的骄傲而不明事理”
  rationale: 所给希腊文本仅说“我听见后便说”，没有这段自我评述；为避免把咨询层的扩写当作原文，正文不予采用。
- issue: 是否称他玛为“你的儿媳”
  choice: 不加入亲属称谓
  alternative: “你的儿媳他玛”
  rationale: 现有希腊句子只出现“他玛”；人物关系虽可由叙事背景得知，却不应补入本句引语。
- issue: 时间表述采用“些日子”还是“三个月”
  choice: 采用“些日子”，并以脚注说明传统差异
  alternative: “三个月以后”
  rationale: 本项目指定的希腊α替代段明确作μεθ’ ἡμέρας τινάς；“三个月”来自《创世记》传统，不能静默覆盖当前底本。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。叙述简洁直接，保留原文命令的严厉程度；不纳入英语咨询层中希腊底本没有的亲属称谓、提示词“看哪”及犹大的自我谴责。
