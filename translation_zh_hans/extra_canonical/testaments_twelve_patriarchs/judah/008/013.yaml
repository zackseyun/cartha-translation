  to: 过了些日子[a]，传来消息说：“他玛犯了淫乱，已经有了身孕。”我听见后便说：“把她带出来，让她被烧死。”
  rationale: 修订仅使非人称传闻句式及“淫乱”的汉语搭配更贴合原文和现代标准汉语；时间、人物关系、犹大自我评述及处决含义均维持草稿对指定希腊文本的处理。
