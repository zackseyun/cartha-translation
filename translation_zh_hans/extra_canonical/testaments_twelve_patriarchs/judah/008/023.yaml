  naturalness: 整体通顺、庄重。将首句调整为“在被剥夺时也不察觉”，既更贴近希腊文分词结构，也避免“被剥夺了也不察觉”略显口语且时态不够明确的问题。
  terminology: “行淫乱”“羞辱”“羞耻”“淫乱的奴仆”均合乎文本的伦理劝诫语境，且没有不当缩窄πορνεία的涵义。“王权”比“王位”更适合对应此处的βασιλεία。
