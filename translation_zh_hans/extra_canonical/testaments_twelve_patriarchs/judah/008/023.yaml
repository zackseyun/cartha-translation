  - severity: low
    issue: “王位”略微缩窄βασιλείας的含义。
    rationale: 在“即使有人是王”的语境中，βασιλεία可指王权、王者地位；“王权”较能涵盖统治权及王者身份，而不只是一张具体的职位。
