source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας, δουλεύσας τῇ πορνείᾳ ὡς κἀγὼ ἔπαθον.
  language: Greek
  note: Greek from Charles XV.1-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a servant to sexual immorality, as I myself also suffered.
translation:
  language: zh_hans
  text: 行淫乱的人在被剥夺时也不察觉，受羞辱时也不觉得羞耻。因为即使一个人是王，却行淫乱，也会被剥去王权，沦为淫乱的奴仆，正如我自己所遭遇的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας / πορνεύῃ / πορνείᾳ
  choice: 行淫乱的人／行淫乱／淫乱
  rationale: πορνεία词族泛指不合正当秩序的性行为；“淫乱”既保留其道德分量，也避免把含义无依据地缩窄为某一种具体行为。
- source_word: γυμνούμενος / γυμνοῦται
  choice: 被剥夺了／被剥去
  rationale: 字面义为“被脱去、被剥光”。首句未明说所失何物，译作“被剥夺了”保留其概括性；第二句有τῆς βασιλείας作补语，明确译为“被剥去王位”。
- source_word: ἀδοξῶν
  choice: 受羞辱
  rationale: 该词表示失去尊荣、陷于不名誉；“受羞辱”与下文“不觉得羞耻”形成源文中的语义呼应。
- source_word: βασιλείας
  choice: 王位
  rationale: 在“一个人是王”的语境中，指其王权或王者身份；“王位”自然简洁，并保留被剥夺统治身份的含义。
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: 沦为淫乱的奴仆
  rationale: 保留δουλεύω所表达的受奴役关系；“沦为”体现分词所含的结果与贬降意味。
- source_word: ὡς κἀγὼ ἔπαθον
  choice: 正如我自己所遭遇的
  rationale: πάσχω在此指亲身经历或遭受上述后果；此译不额外指定具体事件。
theological_decisions:
- issue: 淫乱与王权丧失之间的关系
  choice: 按源文直陈：行淫乱的王被剥去王位，并成为淫乱的奴仆
  alternative: 弱化为仅仅损害名誉或失去自制力
  rationale: 源文明确使用γυμνοῦται τῆς βασιλείας与δουλεύσας，兼具被剥夺王权和受罪役使的双重图像，不宜只保留其中之一。
- issue: 首句“被剥夺”的对象
  choice: 不补出具体对象
  alternative: 补译为“失去尊荣”“失去一切”或“赤身露体”
  rationale: γυμνούμενος在首句没有明示宾语；保留开放性，可使其与下一句“被剥去王位”的具体展开相呼应，而不替文本消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“行淫乱”保留古代伦理劝诫的力度；“沦为……的奴仆”传达鲜明的奴役意象。两句均贴近希腊文论证次序，并保留首句对象未明的张力。
