  text: Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον.
  language: Greek
  note: Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: zh_hans
  text: 我确实为这些事悔改了；直到年老，我都不喝酒、不吃肉，也未见任何欢乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未见任何欢乐”直译为“没有看见任何欢乐”；此处也可能指未曾经历、享受或参与欢乐，原文没有进一步限定。
    reason: 保留 εὐφροσύνην οὐκ εἶδον 的字面措辞及其所指范围的含混性。
lexical_decisions:
- source_word: Καίγε
  choice: 确实
  rationale: 强调下文陈述的真实性与力度；在现代汉语中比直译为“并且诚然”更自然。
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: 为这些事悔改了
  rationale: 保留 μετανοέω 的悔改含义及 ἐπὶ τούτοις 所指向的先前诸事。
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: 不吃肉、不喝酒
  rationale: 希腊文以 ἐσθίω 统摄酒与肉，汉语须分别搭配“喝”与“吃”；调整名词次序以形成自然表达。
- source_word: ἕως γήρους μου
  choice: 直到年老
  rationale: γήρας 指老年或年老阶段，并不必然表示“直到去世”。
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: 不享任何欢乐
  rationale: “看见欢乐”是源文习语；译为“享欢乐”传达亲历、享有之意，同时由脚注保留其字面可能性。
theological_decisions:
- issue: 禁酒食肉与悔改的关系
  choice: 按叙事保留为悔改后的长期禁戒行为
  alternative: 将其解释为普遍性的宗教戒律
  rationale: 源文只陈述说话者自己的悔改行动，没有把禁酒食肉规定为适用于所有人的律法。
- issue: “不见任何欢乐”的范围
  choice: 保留绝对而带张力的措辞
  alternative: 弱化为“不参加宴乐”或“不纵情享乐”
  rationale: πᾶσαν εὐφροσύνην οὐκ εἶδον 本身措辞宽泛，不宜无文本依据地限定为宴饮或罪恶享乐。
translation_notes:
  register: 采用现代、庄重而易懂的第一人称叙述。以分号连接悔改与随后长期禁戒；避免古奥表达，也不把个人禁戒神学化为普遍命令。
