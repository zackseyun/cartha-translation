  text: Ἐμοὶ ἔδωκε τὰ ἐπὶ γῆς, ἐκείνῳ τὰ ἐν οὐρανοῖς.
  language: Greek
  note: Greek from Charles XXI.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/037.yaml
  text: To me he gave the things on earth; to him the things in heaven.
translation:
  language: zh_hans
  text: 他把地上的事物赐给我，把天上的事物赐给他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκε
  choice: 赐给
  rationale: 表达“给予”，并保留宗教语境中的庄重感；希腊文主语隐含为“他”。
- source_word: τὰ ἐπὶ γῆς
  choice: 地上的事物
  rationale: 贴近原文的概括性名词结构，不擅自限定为权柄、产业或职责。
- source_word: τὰ ἐν οὐρανοῖς
  choice: 天上的事物
  rationale: 保留原文宽泛含义及复数“诸天”表达所涵盖的天界范围，不作神学窄化。
- source_word: ἐμοὶ … ἐκείνῳ
  choice: 给我……给他
  rationale: 清楚保留受事者之间的对照和原句的平行结构。
theological_decisions:
- issue: 所赐之物的具体性质
  choice: 译为宽泛的“事物”
  alternative: 译作“权柄”“职责”或“产业”
  rationale: 原文使用中性的冠词化结构，没有明确说明所指为何；应保留其歧义。
- issue: 天的单复数表达
  choice: 译为自然汉语“天上的”
  alternative: 直译为“诸天中的”
  rationale: 原文 οὐρανοῖς 为复数，但此处中文惯用“天上的”即可传达天界含义；直译“诸天中的事物”会显得生硬，并可能过度凸显宇宙层级。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；以两个平行分句再现原文鲜明的地上与天上、我与他的对照。
