reference: Testament of Judah 8:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: zh_hans
  text: 我知道，我的后裔必因这两样事[a]而因淫乱走向毁灭；它们甚至会使我子孙中的智者败坏[b]，又使犹大的王权衰微。这王权是主因我顺从父亲而赐给我的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这两样事”按上文语境指黄金（或财富）与女子的美貌。
    reason: 原句仅作回指；脚注为独立呈现的经节补足其所指，同时避免把解释直接写入正文。
  - marker: b
    text: “败坏”所译的希腊词也可理解为“使……改变”或“使……变质”。
    reason: 提示原词较宽的语义范围，保留它究竟指道德败坏还是更广泛改变的余地。
lexical_decisions:
- source_word: τὰ δύο ταῦτα
  choice: 这两样事
  rationale: 直译保留对上文两种祸因的回指；依本章语境，指金财与女子的美貌，不将解释直接写入正文。
- source_word: τὸ γένος μου
  choice: 我的后裔
  rationale: γένος在此指犹大的族类、后代；“后裔”比“种族”更符合现代汉语家族训诫的语境。
- source_word: εἰς ἀπώλειαν πορνείας
  choice: 陷入淫乱，以致灭亡
  rationale: 希腊语结构紧缩，兼含淫乱与毁灭的关联；译文保留二者，同时以自然汉语表达其结果关系。
- source_word: ἀλλοιώσουσι
  choice: 使……败坏
  rationale: 该词本义为使之改变、变质；在道德警告语境中译作“败坏”，但不具体增添如何败坏。
- source_word: βασιλείαν Ἰούδα
  choice: 犹大的王权
  rationale: βασιλεία可指王国、统治或王权；此处说这是主赐给犹大的，采用“王权”较能涵盖统治资格而不预设后世国家形态。
- source_word: σμικρυνθῆναι
  choice: 衰微
  rationale: 表达被削小、减弱之意；“衰微”在现代汉语中自然且庄重。
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: 因我顺从父亲
  rationale: 将名词性短语转为自然汉语，明确顺从者是说话者、对象是其父亲，同时保留赐予与顺从之间的关联。
theological_decisions:
- issue: “这两样事”所指为何
  choice: 正文保留“这两样事”，脚注说明其上文所指
  alternative: 正文直接译成“金财和女子的美貌”
  rationale: 原文使用回指语，没有在本句重列两项；保留回指更忠于篇章形式，也避免把语境解释混入正文。
- issue: 犹大所得的βασιλεία性质
  choice: 译作“王权”
  alternative: 译作“犹大国”或“犹大的王国”
  rationale: 本句可指犹大获赐的统治权及其后来延续；“王权”保留这种神学与历史上的开放性，不强行限定为已经建立的国家。
- issue: 毁灭与淫乱的逻辑关系
  choice: 译为“陷入淫乱，以致灭亡”
  alternative: 译为“遭受淫乱的毁灭”或“因淫乱而灭亡”
  rationale: εἰς ἀπώλειαν πορνείας语法紧缩且关系略有含混；所选译法传达明显关联，但避免用单一介词过度断定其精确语法关系。
translation_notes:
  register: 采用现代、庄重而清楚的训诫语体。以希腊原文为主要依据，没有沿用英文项目文本中关于“清醒自守、迦南女子、灾祸和礼物”的主题性扩写，因为这些内容不在所给希腊锚文本内。句式适度拆分，便于普通读者理解，同时保留原文关于淫乱、智慧人败坏、王权衰微及顺从父亲的神学张力。
