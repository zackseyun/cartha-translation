  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: zh_hans
  text: 我的孩子们，醉酒的人就是这样：喝醉的人谁也不敬重。看哪，酒醉也迷惑了我，以致我不以城中的众人为耻，因为我在众目睽睽之下偏向她玛，犯了大罪，又揭开了我儿子们污秽的遮盖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我儿子们污秽的遮盖”直译如此。原句含义晦涩，可能指这罪使儿子们蒙羞，或指与他们有关的不洁之事被暴露；但希腊文本本身没有明确说明。
    reason: 解释ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου这一不寻常且语义未定的表达，同时不在正文中断定其具体所指。
lexical_decisions:
- source_word: πάροινος
  choice: 醉酒的人
  rationale: 指嗜酒、因酒失态之人；用现代汉语自然表达其人格状态，不窄化为一次偶然醉酒。
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: 谁也不敬重
  rationale: αἰδέομαι兼有敬畏、顾忌和羞于冒犯之意；“不敬重”在此既自然，也与下文“不知羞耻”相呼应。
- source_word: ἐπλάνησεν
  choice: 迷惑了我
  rationale: 保留“使人迷失、误入歧途”的语义。希腊文主语承接上文酒醉状态，故明确译作“酒醉也迷惑了我”。
- source_word: μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως
  choice: 使我在全城众人面前不知羞耻
  rationale: 直陈其在城中群众面前失去羞耻之心；“全城众人”自然传达πλῆθος πόλεως。
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: 转向她玛
  rationale: ἐκκλίνω可指偏离、转向；原句没有明说性交行为，故不采用英语咨询文本较为解释性的“与她玛同房”，以保留原文含蓄度。
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: 揭开了我儿子们不洁的遮盖
  rationale: 尽量保留原文“揭开—遮盖”的刻意悖论及其晦涩关系，不把它武断解释成某一种具体羞辱。
theological_decisions:
- issue: 是否加入“违犯上帝的诫命”
  choice: 不加入
  alternative: 依英语POB译作“它也使我违犯了上帝的诫命”
  rationale: 所提供的希腊文没有对应措辞；以原语言证据为先，不把咨询层的扩充写入正文。
- issue: 是否把“转向她玛”明译为性交
  choice: 保留原文较含蓄的“转向”
  alternative: 译作“与她玛同房”或“进去亲近她玛”
  rationale: 上下文虽可能暗示性行为，但本句ἐξέκλινα πρὸς仅明说转向或偏向她；不应静默消除原文表达的含蓄性。
- issue: “我儿子们不洁的遮盖”所指为何
  choice: 正文保留原文晦涩，并以脚注说明
  alternative: 解释为“暴露了我儿子们的羞耻”或特指他玛的寡妇衣饰
  rationale: 属格结构及意象含混，现有原文不足以确定其具体指向；保留张力比采用单一解释更稳妥。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“我儿啊”保留父亲训诫子女的口吻；句式依照因果推进，避免古奥虚词。正文只翻译所给希腊文证据，不纳入英语咨询文本中无希腊文对应的扩充。
