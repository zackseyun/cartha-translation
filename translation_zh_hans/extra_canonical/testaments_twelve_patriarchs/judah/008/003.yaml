source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ οὐκ ἀφῆκεν. Ἐπονηρεύσατο γὰρ, ὅτι οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή.
  language: Greek
  note: 'Greek from Charles X.6 (α): Judah refuses to give Tamar to Shelah. Project ch.8 is a thematic consolidation; this verse re-flows narrative content from Charles ch.X.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: zh_hans
  text: 我也想把示拉给她作丈夫，但他的母亲不肯。她作了恶事，因为那女子不像她自己，不是出身于迦南女子之中的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句直译近于：“因为她不像她自己一样，不是出自迦南女子之中。”此处连续使用阴性代词并省略从句主语；前一个“她”按上下文指将与示拉婚配的女子，末尾“她自己”指示拉的母亲。
    reason: 说明希腊文代词与省略主语造成的歧义，并保留比较结构，不把英语审校文本中未见于所给希腊文的内容加入正文。
lexical_decisions:
- source_word: Ἤθελον
  choice: 我也想
  rationale: 表达未能实现的意愿；结合 καί 译出“也”，语言自然且不额外强化为正式承诺。
- source_word: τὸν Σηλὼμ δοῦναι αὐτῇ
  choice: 把示拉给她为夫
  rationale: 原文直译为“把示拉给她”；按婚配语境补出“为夫”，使现代读者清楚而不增加新的叙事情节。
- source_word: οὐκ ἀφῆκεν
  choice: 不肯
  rationale: 此处表示示拉的母亲不容许此事；“不肯”简洁自然，并保留主动阻拦的语气。
- source_word: Ἐπονηρεύσατο
  choice: 起了恶念
  rationale: 该动词可指变得邪恶、心怀恶意或行事诡诈；“起了恶念”保留道德判断，同时不把具体行为方式限定为“欺骗”或“设计”。
- source_word: ἐκ τῶν θυγατέρων τῶν Χαναναίων
  choice: 出身于迦南女子之中
  rationale: 贴近原文“属于迦南人的女子们/迦南女子之列”的血缘或族属表达，避免擅自改成较宽泛的地域称谓。
theological_decisions:
- issue: 恶意行为者与比较对象的指代
  choice: 将“她起了恶念”理解为示拉的母亲，并将“那女子”理解为前句接受婚配的女子；末尾“她自己”仍指示拉的母亲
  alternative: 把 Ἐπονηρεύσατο 的主语或后续代词理解为同一名女子，造成她因自身并非迦南人而行恶的读法
  rationale: 最近的明确主语是“他的母亲”，而 ὡς καὶ αὐτή（“正如她自己也是”）自然说明母亲本人出身于迦南女子之中。译文用“那女子”区分两个阴性指代，以免现代汉语连续使用“她”造成误读。
- issue: 与英语咨询文本的内容差异
  choice: 依据所提供的希腊文翻译母亲阻止婚配及其族属动机
  alternative: 采用英语 POB 中“恐怕他也像哥哥们一样死去”及天主审判犹大的扩展叙述
  rationale: 这些英语内容不见于本节所给希腊文。按源语证据优先原则，不将其并入正文，也不据此改写希腊叙事。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文明确必要的婚配语境和代词所指，但不引入英语咨询文本中缺乏本节希腊文支持的死亡恐惧、亭拿事件或神审判等材料。
