source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
  note: Greek from Charles XXI.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: zh_hans
  text: 因为上帝的祭司职分高于地上的王权；除非它因罪离开主，并受地上王权辖制。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: 高于
  rationale: 表达祭司职分相对于地上王权的优越地位，不额外引入原文没有明说的天地比喻。
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: 上帝的祭司职分
  rationale: ἱερατεία 指祭司职分或祭司体系；此处与王权对举，译作“祭司职分”较准确自然。
- source_word: τῆς ἐπιγείου βασιλείας
  choice: 地上的王权
  rationale: βασιλεία 在此与祭司职分作制度性对比，译作“王权”比“王国”更切合语境。
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: 背离主
  rationale: 保留“从主那里坠落、离开”的关系性含义，同时符合现代汉语表达。
- source_word: κυριευθῇ
  choice: 受……辖制
  rationale: 被动形式表示被支配或控制；“受……辖制”兼顾力度与庄重语体。
theological_decisions:
- issue: 祭司职分高于王权是否为无条件命题
  choice: 以“除非”保留条件限制
  alternative: 将其处理为祭司职分绝对且永恒地高于王权
  rationale: 原文 ἐὰν μή 明确提出例外：祭司职分若因罪背离主，便可能受地上王权辖制。译文不消解这一神学张力。
- issue: 英文咨询文本中的天地高低比喻
  choice: 不纳入正文
  alternative: 译作“天怎样高过地，祭司职分也照样……”
  rationale: 所给希腊文本没有“天高于地”的对应短语；应优先依据原语言证据，避免由咨询层增补意象。
- issue: κυριευθῇ 的施事关系
  choice: 译明为受地上王权辖制
  alternative: 笼统译作“被辖制”
  rationale: 希腊文 διὰ τοῦ τῆς ἐπιγείου βασιλείας 指明地上王权为实施辖制的一方，宜在中文中清楚呈现。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文“原则陈述—条件性例外”的结构；不增添希腊底本未见的天地类比。
