  source_fidelity: 译文准确保留了祭司职分与地上王权的比较、罪导致离开主，以及随后受地上王权支配的条件性警告。所给希腊文本并无“天高过地”的比喻，因此不应随英文审计文本增入。惟“确实”不是γὰρ所表达的重点；γὰρ在此是连接性“因为／原来”，不宜另增强调语气。
  naturalness: 整体庄重、清楚。“除非它因罪而背离主，并受地上王权辖制”结构可通；将“背离主”改为“离开主”，更贴近ἐκπέσῃ ἀπὸ Κυρίου所含“从主那里坠落／离开”的关系性方向，且更自然直接。
  terminology: “上帝的祭司职分”“地上的王权”“受……辖制”均恰当，保留制度性对比和被动受制的力度。“主”对应Κυρίου，合乎本段宗教语域。
