  text: καὶ αὕτη ἐστὶν ἡ σύνεσις τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ, πίνει.
  language: Greek
  note: Greek from Charles XIV.7b (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: zh_hans
  text: 这就是饮酒的明智分寸：只要人还存着廉耻之心，就可以喝酒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这句话十分简练，直译近于：“只要他还有廉耻，就喝。”这里的“廉耻”也可理解为羞耻感、谦抑或自我约束。
    reason: 说明原文的简洁结构及αἰδώς的语义范围，并避免把英语咨询文本中的扩展误当作希腊原文。
lexical_decisions:
- source_word: σύνεσις
  choice: 明智分寸
  rationale: 该词表示理解、明辨或审慎；在饮酒语境中译作“明智分寸”，既自然，又突出节制和判断力。
- source_word: οἰνοποσία
  choice: 饮酒
  rationale: 指喝酒、饮用葡萄酒；现代汉语用“饮酒”简洁庄重。
- source_word: ἕως ὅτε
  choice: 只要……还
  rationale: 原文表达持续的时间或限度，即在某种状态仍然存在期间；此译保留“以廉耻尚存为界限”的意味。
- source_word: αἰδῶ
  choice: 廉耻之心
  rationale: αἰδώς可指羞耻感、谦抑或对失态的顾忌；“廉耻之心”在此正面表达饮酒时仍有自制、不至放纵的状态。
- source_word: πίνει
  choice: 就可以喝酒
  rationale: 希腊文直译为“他喝”；结合前句所说的饮酒准则，汉语以许可性的“可以”表达其语用意义，但不加入原文没有明说的具体禁令。
theological_decisions:
- issue: 饮酒本身是否被禁止
  choice: 保留在仍有廉耻和自制时可以饮酒的表述
  alternative: 将本句解释为全面禁酒，或补写不得陷入无耻
  rationale: 原文并未全面禁止饮酒，而是以αἰδώς尚存作为界限；“陷入无耻”等扩展虽见于英语咨询文本，却不在所给希腊文本中，因此不写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“明智分寸”兼顾σύνεσις的判断力含义和饮酒语境中的节制意味；正文保持简洁，不照搬英语咨询层增补的条件句。
