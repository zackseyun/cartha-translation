source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος, καὶ συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ, καὶ καταδαπανᾷ τὰς σάρκας αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/029.yaml
  text: They deprive his soul of every goodness and oppress him with toils and troubles, and drive sleep away from him and devour his flesh.
translation:
  language: zh_hans
  text: 它使他的心灵失去一切良善，把他困在劳苦和艰辛中；它使睡眠离开他，并耗尽他的肉身。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: 使……失去
  rationale: 准确表达剥夺、使缺少之意；希腊语动词为单数，因此按原文译为“它”，不随英语磋商层改成复数。
- source_word: ψυχὴν
  choice: 心灵
  rationale: 此处指人的内在生命与心性；“心灵”比单纯的“灵魂”更符合现代汉语语境，同时保留其广度。
- source_word: πάσης ἀγαθότητος
  choice: 一切良善
  rationale: 保留ἀγαθότης的道德性与美善含义，不窄化为具体的好处。
- source_word: συνέχει
  choice: 使……困于
  rationale: 体现拘束、压迫于某种处境之中的含义，且中文自然。
- source_word: πόνοις καὶ μόχθοις
  choice: 劳苦和艰辛
  rationale: 以两个近义表达保留原文并列的累积力度。
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: 夺去他的睡眠
  rationale: 该短语意为使睡眠离开他；采用自然而有力的现代汉语。
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: 耗尽他的血肉
  rationale: καταδαπανάω含彻底消耗之意；“血肉”自然承载复数σάρκας所指的身体躯体，并保留强烈意象。
theological_decisions:
- issue: 句首施事者的数
  choice: 译作单数“它”
  alternative: 按英语磋商文本译作复数“它们”
  rationale: 本节所给希腊文本的谓语Στερίσκει、συνέχει、ἐκδιδάσκει、καταδαπανᾷ均为第三人称单数；应优先遵循原语言证据。至于“它”具体回指何者，由上下文决定，本节不擅自补明。
- issue: ψυχή的理解
  choice: 译作“心灵”
  alternative: 译作“灵魂”或“生命”
  rationale: 避免将该词限定为某种系统神学中的灵魂观，也不将其仅限于生物性生命，保留原文可指内在人格与生命的张力。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。四个希腊语单数谓语统一以“它”为主语，并用分号呈现后两项身体性后果的递进。未加脚注，因为正文可以直接保留原文的指代含混。
