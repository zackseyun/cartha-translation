source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: zh_hans
  text: 我已经知道，你们在末后的日子[a]将会作出多少恶事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在末后的日子”在Charles的希腊文本中置于方括号内，被标为可能是后来的基督教插入语；本译文依项目方针予以保留。
    reason: 说明重要的文本批判信息，并避免读者误以为该短语的原始性毫无争议。
lexical_decisions:
- source_word: Καὶ
  choice: 也
  rationale: 承接上文，表达补充推进；在这一独立节选中比生硬的“并且”更自然。
- source_word: ἔγνωκα
  choice: 我知道
  rationale: 完成时表示已经获知并处于知道的状态；不采用β校订本所载“我在义人以诺的书中读到”。
- source_word: ὅσα κακὰ
  choice: 怎样的恶事
  rationale: 保留ὅσα所涵盖的范围与程度感，不扩写原文没有明说的“离弃主”“各样苦害”等内容。
- source_word: ποιήσετε
  choice: 你们……将会行出
  rationale: 准确体现第二人称复数和将来时；译作“行出恶事”符合庄重而自然的现代汉语。
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: 在末后的日子
  rationale: 贴近原文的末世性时间表达，同时保留该短语在校勘本中被括注的文本状况。
theological_decisions:
- issue: 知识来源
  choice: 仅译“我也知道”
  alternative: “我在义人以诺的书中读到”
  rationale: 所指定的α文本只有Καὶ ἔγνωκα；后者属于β校订本，不应混入正文。
- issue: 恶行的具体内容
  choice: 概括为“怎样的恶事”
  alternative: 增译“你们的子孙将离弃主，在主面前行各样恶事，施加各样苦害”
  rationale: α文本未出现“子孙”“离弃主”“在主面前”或“苦害”等相应措辞，故不依据项目英文扩写。
- issue: 末世短语的文本地位
  choice: 保留在正文并加注
  alternative: 从正文删除
  rationale: 项目政策要求保留Charles以方括号标出的疑似基督教插入语，同时用脚注如实说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。严格依据所给α希腊文本翻译，不把β校订本的“以诺书”读法或英文整合文本中的扩展内容带入正文。
