  source_fidelity: 项目英文所据为《创世记》38:17传统，而非所列Charles 1908《犹大遗训》希腊语α文本；脚注应继续明确这一点。“pledge”在该叙事中指暂交、日后归还的实物信物，译作“抵押物”易引入现代借贷语境，宜改为“信物”。
  naturalness: “一只小山羊”是现代汉语中对山羊幼畜更自然、清楚的说法。“在你把它送来以前”明确“它”所指许诺的小山羊，且保留原句的期限条件。
  terminology: 将“抵押物”改为“信物”，贴合《创世记》38章中作为担保而交付的具体物件，也避免将其理解为不动产或贷款抵押。“山羊羔”改为“小山羊”，不改变物种或年龄信息。
  issues:
