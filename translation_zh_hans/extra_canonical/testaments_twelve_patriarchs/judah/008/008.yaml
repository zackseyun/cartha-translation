  note: Project verse 8:8 (the 'I will send you a kid from the flock... will you give me a pledge until you send it?' exchange) has no direct counterpart in the Charles α-text of XII.4, which collapses Tamar's question 'Τί μοι δώσεις;' directly into Judah handing over the pledges. The kid-from-the-flock question is drawn from the broader Genesis 38 tradition that informs the project English; α witnesses no Greek for this specific exchange. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/008.yaml
  text: And I said, "I will send you a kid from the flock." And she said, "Will you give me a pledge until you send it?"
translation:
  language: zh_hans
  text: 我说：“我会从羊群中送一只小山羊给你。”她说：“在你把它送来以前，你愿意给我一件信物吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在Charles 1908所刊《犹大遗训》希腊语α文本中没有直接对应文字；该文本省略了这段问答，直接叙述犹大交出信物。这里的内容见于《创世记》38:17所保存的相关传统。
    reason: 说明项目英文所采用的《创世记》传统并非现存α文本的直接译文，同时使“信物”与正文术语一致。
lexical_decisions:
- source_word: גְּדִי־עִזִּים (Genesis 38:17 tradition)
  choice: 一只山羊羔
  rationale: 准确表达作为报酬许诺送出的幼山羊；比单说“羊羔”更明确，也符合现代汉语。
- source_word: עֵרָבוֹן (Genesis 38:17 tradition)
  choice: 抵押物
  rationale: 指在所许之物送到以前暂交、以后赎回的实物担保；“抵押物”比泛化的“凭据”更贴近语境。
- source_word: עַד שָׁלְחֶךָ (Genesis 38:17 tradition)
  choice: 在你送来以前
  rationale: 保留期限含义，并以自然汉语表达“直到你送来”。
theological_decisions:
- issue: 本句在指定希腊语α文本中没有直接对应文字
  choice: 依据《创世记》38:17所保存、且项目英文采用的传统翻译正文，并加脚注说明文本状况
  alternative: 因α文本缺文而不译，或把下一句中直接交出抵押物的叙述扩写成本问答
  rationale: 这样既满足项目经节内容，又不虚称该问答见于Charles 1908的α文本，并避免由译者暗中重构希腊原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对白。“我会……给你”保留许诺语气；“你愿意……吗”自然表达对方提出的条件。
