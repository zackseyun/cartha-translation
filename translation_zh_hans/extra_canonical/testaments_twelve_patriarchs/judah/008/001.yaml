  rationale: 修订仅处理两处源文忠实度问题：按希腊文本保留“萨巴”，并删除无明示依据的“来见我们”。其余表达维持原译的现代、庄重叙事风格；“我在那里时”与英文审计轨迹一致，也较适合现存希腊开头不甚顺畅的结构。
