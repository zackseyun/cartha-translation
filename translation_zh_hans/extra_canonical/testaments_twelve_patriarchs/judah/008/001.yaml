  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/001.yaml
  text: And while I was there, Barshaba, the king of Adullam, entertained us and made a drinking feast for us; and when he urged me, he gave me his daughter, whose name was Shua, as a wife.
translation:
  language: zh_hans
  text: 我在那里时，亚杜兰的王巴沙巴来了，为我们摆设酒宴；他劝请我后，就把自己的女儿萨巴给我为妻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “萨巴”：希腊文本作Σαβά。此名可能与《创世记》38:2中常译为“书亚”的名字相对应，但本段正文按现存希腊文本音译。
    reason: 保留本段希腊文本的人名形式，同时说明与中文圣经传统中相关名字的可能对应，不将该对应作为确定的正文读法。
lexical_decisions:
- source_word: Πρὸς ὃν ἐλθὼν ἤμην
  choice: 我到了那里
  rationale: 该短语按现存文本直译较为生硬，语境上表示犹大来到并停留在该处；采用自然中文，同时不补入原文未明说的时间关系。
- source_word: Βαρσαβὰ ... βασιλεὺς Ὀδολλὰμ
  choice: 亚杜兰王巴沙巴
  rationale: 保留人名及王号的同位关系，并采用符合现代汉语习惯的次序。
- source_word: ἐποίησεν ἡμῖν πότον
  choice: 为我们摆设酒宴
  rationale: πότος在此指饮酒宴席，不只是一般饮料；明确保留ἡμῖν“为我们”。
- source_word: παρακαλέσας
  choice: 劝说我之后
  rationale: 该词可指劝请、敦促；结合婚配语境译为“劝说”，但不把其力度扩大为强迫。
- source_word: δέδωκέ μοι τὴν θυγατέρα αὐτοῦ ... εἰς γυναῖκα
  choice: 把自己的女儿嫁给我为妻
  rationale: 以自然汉语表达古代婚姻中“把女儿给某人为妻”的结构，完整保留关系与结果。
- source_word: Σαβά
  choice: 书亚
  rationale: 采用该人物在中文圣经传统中通行的名字形式；希腊抄本的人名形式可另见脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摆设酒宴”保留古代宴饮色彩；分为两句以避免希腊长句在中文中拖沓。原文παρακαλέσας可能有“劝请／敦促”之义，正文用较中性的“劝说”，不额外推定强迫或单纯邀请。
