  terminology: “亚杜兰的王巴沙巴”清楚保留人名与“亚杜兰的王”的同位关系。人名按本段希腊文本译为“萨巴”，并以脚注说明与《创世记》常见“书亚”形式的可能对应，而不将该对应当作正文确定事实。
