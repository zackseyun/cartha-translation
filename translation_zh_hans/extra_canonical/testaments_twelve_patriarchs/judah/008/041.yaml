  verdict: revise
  source_fidelity: 现存α希腊见证并无本项目8:41的直接对应句，因此不能将正文当作对所给希腊文VIII.1–3的翻译。脚注已如实说明其为依据22:2–3及24:6主题形成的项目性综合。就英文审校文本而言，原译将“kingship”处理为“君王的职分”，略偏向个人君王的职位，未充分保留“王权”这一概念；且“拣选……职分”的搭配在现代汉语中不够自然。
  naturalness: “因为他”可改为较庄重自然的“因着他”。将英文中省略的承受／担任者在汉语中显明为“拣选人承受王权／担任祭司职分”，能避免“拣选王权（或职分）”这一不合汉语逻辑的搭配，同时保留“从你们中”与“从利未中”的并列。
