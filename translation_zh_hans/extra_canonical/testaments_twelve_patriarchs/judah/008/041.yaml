revisions:
- from: 因为他，主必从你们中拣选君王的职分，从利未中拣选祭司的职分，使主成为万国和以色列族的主。[a]
  to: 因着他，主必从你们中拣选人承受王权，也从利未中拣选人担任祭司职分，使主成为万国和以色列族的主。[a]
  rationale: 修订仅改善对英文审校层中“kingship”的术语对应和汉语句法：以“王权”取代偏窄的“君王的职分”，并补足汉语所需的“人”以表达从群体中拣选承受或担任者。保留“他”的指称含混性、犹大／利未的并列、万国与以色列族的并列，以及关于无直接α对应文本的透明脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:21:57Z'
