  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:41 ('because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel') has no direct α-counterpart. The 'kingship from Judah, priesthood from Levi, Lord for all nations' theme is the project's homiletic synthesis of Charles XXII.2-3 ('ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραὴλ') and XXIV.6 ('κρῖναι καὶ σῶσαι πάντας τοὺς ἐπικαλουμένους τὸν Κύριον'), but α has no single verse that says what the project English says here. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/041.yaml
  text: For because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel.
translation:
  language: zh_hans
  text: 因着他，主必从你们中拣选人承受王权，也从利未中拣选人担任祭司职分，使主成为万国和以色列族的主。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存α希腊文本没有与本句直接对应的单一经节。本句是依据《犹大遗训》22:2–3关于“以色列的救恩”及24:6关于审判并拯救凡求告主之人的主题所作的综合表述，不应视为对某一现存希腊句子的逐字翻译。
    reason: 说明现存文本见证的实际情况，并区分主题性综合与对单一希腊原句的直接翻译。
lexical_decisions:
- source_word: the kingship（本节无直接希腊语对应文本）
  choice: 君王的职分
  rationale: 兼顾“王权”与“君王职任”两层含义，并与下文“祭司的职分”形成自然、清楚的对应。
- source_word: the priesthood（本节无直接希腊语对应文本）
  choice: 祭司的职分
  rationale: 表达祭司身份及其职任，避免仅译作抽象制度。
- source_word: πάντας τοὺς ἐπικαλουμένους τὸν Κύριον（相关主题见 XXIV.6，并非本节直接底本）
  choice: 万国和以色列族的主
  rationale: 正文依项目英文审校层保留普世与以色列并列的表达；不把相关希腊语中“凡求告主的人”误称为本节的逐字底本。
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ（相关主题见 XXII.2–3，并非本节直接底本）
  choice: 以色列族
  rationale: 保留项目英文中的以色列群体指称，但不擅自加入“救恩”，因为本节英文合成句并未明说该词。
theological_decisions:
- issue: 本节缺少 α 希腊文本的直接对应
  choice: 保留项目正文，但以脚注明确说明它是主题性综合，而非现存 α 文本的逐句翻译
  alternative: 删去本节，或将其伪装成可直接回译的希腊原文
  rationale: 既维护项目编号与正文连续性，也避免对原始见证作出虚假的文本声称。
- issue: “that the Lord may be for”所表达的关系
  choice: 译作“使主成为……的主”
  alternative: 译作“使主临到……”或“使主为了……”
  rationale: 汉语中“主为某些人”不自然；补出第二个“主”能较清楚地表达归属和主权关系，同时不把句意限定为仅仅“临到”或“帮助”。
- issue: 犹大王权与利未祭司职分的并列
  choice: 保持并列，不解释其历史实现或宗派含义
  alternative: 将其明确套用于某一王朝、教会制度或特定弥赛亚论体系
  rationale: 原项目句只作职分并列；译文不应额外导入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“君王的职分／祭司的职分”保持平行；“因为他”保留所指对象可能依赖上文的含混性。鉴于本节没有直接 α 对应文本，译文主要依据项目英文审校层，并用脚注公开其综合性质。
