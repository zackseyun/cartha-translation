  text: Ἐπιγνοὺς δὲ ἐγὼ εἶπον· Δεδικαίωται Θαμὰρ ἢ ἐγώ. Καὶ οὐ προσεθέμην ἔτι τοῦ γνῶναι αὐτήν.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/015.yaml
  text: And I recognized them and was ashamed, and I said, "Tamar is more righteous than I, because I did not give her to Shelah my son." And I did not know her again.
translation:
  language: zh_hans
  text: 我认出来后，就说：“她玛比我更有义。”此后，我没有再与她同房。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些传统在此还写有“我很羞愧”，并说明：“因为我没有把她给我儿子示拉。”所据希腊文本没有这些话。
    reason: 英文咨询层含有两项所给希腊原文未载的内容；脚注交代文本差异，同时保持正文以指定原文为准。
lexical_decisions:
- source_word: Ἐπιγνοὺς
  choice: 认出来后
  rationale: 表示辨认、认出；原文宾语未明说，因此不擅自补入“那些物件”，也不加入希腊本文没有的“羞愧”。
- source_word: Δεδικαίωται
  choice: 更有义
  rationale: 完成时被动形式在比较结构中表示“被显明为更正当／更有义”；采用自然且保留道德、司法色彩的表达。
- source_word: προσεθέμην ἔτι τοῦ γνῶναι αὐτήν
  choice: 此后，我没有再与她同房
  rationale: 闪语式表达，字面为“不再认识她”，在语境中指不再发生性关系；译为现代汉语惯用且庄重的“与她同房”。
theological_decisions:
- issue: 她玛与犹大之义的比较
  choice: 她玛比我更有义
  alternative: 她玛是正义的，而我不是
  rationale: ἢ ἐγώ自然表达比较，不宜将其绝对化为对两人终极道德地位的裁断。
- issue: 是否补入未见于所给希腊本文的原因说明
  choice: 不补“因为我没有把她给我儿子示拉”
  alternative: 按英文咨询层补入该句
  rationale: 指定希腊原文没有这项从句；依照从原始语言证据优先翻译的原则，不把平行传统或英文层的扩充写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“她玛”沿用常见中文圣经人名形式；引语简洁，保留原文的比较意味与含蓄表达。
