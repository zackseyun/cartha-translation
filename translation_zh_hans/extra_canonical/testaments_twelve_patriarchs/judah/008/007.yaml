  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/007.yaml
  text: And I turned aside to her and said, "Let me go in to you." And she said, "What will you give me, that you may come in to me?"
translation:
  language: zh_hans
  text: 我便转到一旁，走向她，说：“让我进到你那里去。”她说：“你要给我什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: 转向她
  rationale: 保留“转身趋向、转到一旁去接近”的动作含义；中文简洁自然，也不额外补入原文未明说的地点信息。
- source_word: Εἰσέρχομαι πρὸς σε
  choice: 让我到你那里去
  rationale: 该表达在本语境中含委婉的性意味；采用与原文相近的含蓄说法，既让现代读者可以理解，又不把隐含内容直白化。
- source_word: Τί μοι δώσεις
  choice: 你要给我什么
  rationale: 准确保留直接问句及交易意味；原希腊文本至此结束，不补入英语咨询层中的目的从句。
theological_decisions:
- issue: 是否明说性关系
  choice: 沿用“到你那里去”的委婉表达
  alternative: 译作“与你同房”
  rationale: 原文以趋向性表达委婉指涉性关系；直译为“同房”会消除原文的含蓄和叙事张力。
- issue: 是否补出“好让我到你那里去”
  choice: 不补出
  alternative: 你要给我什么，好让你到我这里来？
  rationale: 所给希腊原文只有“你要给我什么？”，增补目的从句虽见于英语咨询文本，却不属于此处提供的希腊文本证据。
translation_notes:
  register: 采用现代、庄重而自然的叙事汉语。“转向她”承接动作，“让我到你那里去”保留古代文本中委婉但可辨的性含义。
