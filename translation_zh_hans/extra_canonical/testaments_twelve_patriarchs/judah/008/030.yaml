  text: '*Θυσίας Θεοῦ ἐμποδίζει, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει. *Προφήτου λαλοῦντος οὐκ ἀκούει, καὶ λόγους εὐσεβείας προσοχθίζει.'
  language: Greek
  note: Greek from Charles XVIII.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: zh_hans
  text: 他阻挠向上帝献上的祭，也不记念上帝的祝福；先知说话时，他不听，并且厌恶敬虔的言语。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ ἐμποδίζει
  choice: 他阻碍献给上帝的祭
  rationale: 按现存希腊文，ἐμποδίζει是及物动词“阻碍”，Θυσίας Θεοῦ为其宾语；不同于英语咨询文本所作的被动理解“他受阻而不能献祭”。
- source_word: εὐλογίαν Θεοῦ
  choice: 上帝的赐福
  rationale: εὐλογία既可指“祝福、赐福”，也可指“称颂”。此处保留属格结构及其一定歧义，避免直接改写成“称颂上帝”。
- source_word: οὐ μνημονεύει
  choice: 不记念
  rationale: 直译“没有记起、不记念”，用现代而庄重的表达保留原文语义。
- source_word: Προφήτου λαλοῦντος οὐκ ἀκούει
  choice: 先知说话时，他不听
  rationale: 属格绝对结构译作时间从句；οὐκ ἀκούει保留为“不听”，不扩展成仅仅“听见”。
- source_word: λόγους εὐσεβείας προσοχθίζει
  choice: 厌恶敬虔的言语
  rationale: προσοχθίζω表示恼怒、厌烦或憎恶；“厌恶”自然地传达其强烈反感。λόγους εὐσεβείας直译为“敬虔的言语”。
theological_decisions:
- issue: “上帝的赐福”是上帝所赐之福，还是对上帝的称颂
  choice: 正文作“上帝的赐福”
  alternative: “对上帝的称颂”或“称颂上帝”
  rationale: 希腊语εὐλογία Θεοῦ的属格关系可有多种理解；正文采用较自然的客体表达，但不把它改写成明确的敬拜行为。
- issue: 献祭行为的主语与受阻者
  choice: 译为“他阻碍……祭”
  alternative: “他受阻，不能向上帝献祭”
  rationale: 现有希腊文本使用主动及物形式ἐμποδίζει，并以“祭”为宾语；因此优先服从原语言证据，不随英语咨询层改成被动。
translation_notes:
  register: 采用现代标准普通话，句式庄重而清楚。以分号对应原文并列结构；不增添英语咨询文本中的“听见后被冒犯并发怒”等原希腊文未明说的因果和情绪层次。
