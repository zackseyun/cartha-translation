source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου, καὶ εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν, καὶ πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται.
  language: Greek
  note: Greek from Charles XIV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: zh_hans
  text: 因为人若喝酒至醉，酒就以污秽的念头搅乱他的心思，又使他的身体因欲乐而发热，趋向淫乱；于是他犯罪，也不觉得羞耻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίῃ τις οἶνον εἰς μέθην
  choice: 人若喝酒至醉
  rationale: 直译饮酒达到醉酒的状态，保留条件句及程度含义。
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  choice: 以污秽的念头
  rationale: διαλογισμοί 指内在思念、盘算；ῥυπαρός 表示污秽、卑劣。译法自然且不缩限为单一类型的思想。
- source_word: συνταράσσει τὸν νοῦν σου
  choice: 搅乱他的心思
  rationale: συνταράσσω 有强烈扰乱之意；νοῦς 在此指思想或心智。希腊文由泛指的 τις 转为第二人称 σου，中文统一为第三人称，使条件句连贯，不改变所指。
- source_word: εἰς πορνείαν
  choice: 趋向淫乱
  rationale: πορνεία 是宽泛的性方面不贞或淫乱，不宜窄化为婚外情或某一种性行为。
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: 使他的身体因欲乐而发热
  rationale: 保留 ἐκθερμαίνει 的身体发热意象；πρὸς ἡδονήν 表明朝向或为了快感、欲乐。结合语境译作“因欲乐”而不额外补入原文没有的条件。
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: 于是他犯罪
  rationale: 原文是“实行那罪”；现代汉语用“犯罪”自然表达，同时不擅自指定罪行的具体形式。
- source_word: οὐκ αἰσχύνεται
  choice: 也不觉得羞耻
  rationale: 直接表达缺乏羞耻感，保持原文的道德评断。
theological_decisions:
- issue: 醉酒、欲念、淫乱与犯罪之间的关系
  choice: 按希腊文呈现递进链条，但不把它改写为不可避免的决定论
  alternative: 译成“若有满足欲望的机会，他就犯罪”，沿用英文咨询层加入的条件
  rationale: 现有希腊文没有与“若有机会”对应的条件从句，而是连续使用动词描述搅乱、激发、犯罪。因此不采纳英文中补出的条件，但用“又……于是……”自然呈现修辞上的因果推进。
- issue: “罪”的具体所指
  choice: 保留为概括性的“犯罪”
  alternative: 明确译为“犯淫乱的罪”
  rationale: 冠词短语 τὴν ἁμαρτίαν 可在上下文中指前述淫乱之罪，但原文本身仍以“罪”概称；保留其指涉张力，避免过度明说。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。保留“身体发热”的源文意象，并以“趋向淫乱”准确传达方向性。未跟随英文咨询文本加入希腊文无直接依据的“若有满足欲望的机会”。无脚注。
