base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/005.yaml
  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: zh_hans
  text: 她身着新娘的盛装，坐在恩安城里、城门旁边。[a] 原来，亚摩利人有一条法规：寡居的女子要在城门旁坐七天。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩安”按此处希腊文地名音译；可与《创世记》38:14、21中的“伊拿印”相比较。
    reason: 说明此处希腊文地名与《创世记》中常见译名的差异，避免读者误以为必定是不同地点。
  - marker: b
    text: “寡居的女子”依现有希腊文本；本句没有“行淫”一词。
    reason: 所给希腊文为τὴν χηρεύουσαν（“寡居的女子”），且没有英文审校文本中“行淫”的对应词，故不应将该内容补入正文。
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: 穿戴新娘的装饰
  rationale: 保留同源词带来的“装饰、打扮”意味，同时用自然现代汉语表达新娘装束。
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: 在恩安城门旁
  rationale: 将Ἐνὰν按专名音译为“恩安”，并把“城”与“门旁”的空间关系自然合并。
- source_word: Νόμος
  choice: 规矩
  rationale: 此处指亚摩利人的社会习俗或规则，并非特指成文法典；“规矩”符合语境。
- source_word: τὴν χηρεύουσαν
  choice: 守寡的女人
  rationale: 按现有希腊文本直译，保留其与咨询层中“即将结婚的女人”不同的读法，不擅自改写。
- source_word: προκαθεσθαι
  choice: 坐
  rationale: 在“城门旁”这一地点短语限定下，以简明自然的汉语表达公开坐候之意，不添加原文没有明说的目的。
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: 坐满七天
  rationale: 表达持续七天的时段，符合现代汉语习惯。
theological_decisions:
- issue: 是否按英文咨询层加入“行淫”
  choice: 不加入
  alternative: 译作“在城门旁行淫七天”
  rationale: 所提供的希腊文本没有对应“行淫”的词；翻译应以原文证据为先，不把咨询层的扩展写入正文。
- issue: 是否将守寡者解释为待嫁者
  choice: 保留“守寡的女人”
  alternative: 译作“即将结婚的女人”
  rationale: 希腊文χηρεύουσαν通常表示守寡或处于寡居状态；不以情节推断取代现有文本。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“穿戴新娘的装饰”保留原文修辞，“规矩”体现族群习俗语境。正文严格依据所给希腊文本，因此未补入该段希腊文中不存在的“得知我要上去”或“行淫”等内容。
