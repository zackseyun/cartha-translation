base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/004.yaml
  text: And after these things, while Tamar was a widow, and after two years had passed, there was reported to me that she was going up to shear sheep at Timnah. And I also went to shear my sheep.
translation:
  language: zh_hans
  text: 这些事以后，塔玛守寡。过了两年，她听说我要上去剪羊毛，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης
  choice: 守寡
  rationale: 表达塔玛处于丧偶后的寡居状态，符合该分词的基本语义。
- source_word: μετὰ ἔτη δύο
  choice: 过了两年
  rationale: 按通常时间用法译出两年之后，避免把“两年”不必要地限定为守寡状态的精确时长。
- source_word: ἀνέρχομαι
  choice: 我要上去
  rationale: 保留第一人称与“上去”的方向含义；上下文中的说话者是犹大。
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: 剪羊毛
  rationale: 按希腊语目的结构自然表达“去给羊剪毛”；现代汉语通常说“剪羊毛”。
