  text: '*Μετὰ δὲ ταῦτα *χηρευούσης τῆς Θαμὰρ *μετὰ ἔτη δύο ἀκούσασα ὅτι ἀνέρχομαι τοῦ κεῖραι τὰ πρόβατα,'
  language: Greek
