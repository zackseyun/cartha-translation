source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐμοὶ γὰρ ἔδωκεν ὁ Θεὸς τὴν βασιλείαν, κἀκείνῳ τὴν ἱερατείαν, καὶ ὑπέταξε τὴν βασιλείαν τῇ ἱερωσύνῃ.
  language: Greek
  note: Greek from Charles XXI.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: zh_hans
  text: 因为上帝把王权赐给了我，把祭司职分赐给了他，又使王权服从祭司职分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεός
  choice: 上帝
  rationale: 原文是“上帝”，并非英语咨询文本所用的“主”；直接依照希腊文翻译。
- source_word: τὴν βασιλείαν / ἡ βασιλεία
  choice: 王权
  rationale: 此处与“祭司职分”形成权柄和职分上的对照；“王权”比“王国”更贴合所赐予并被置于从属关系中的抽象意义。
- source_word: τὴν ἱερατείαν / τῇ ἱερωσύνῃ
  choice: 祭司职分
  rationale: 两个近义希腊词在本句中均指祭司的职分或权柄；统一译法可自然呈现其对应关系。
- source_word: ὑπέταξε
  choice: 使……服从……
  rationale: 保留该动词所表达的置于权下、使之从属的强度，同时使用现代汉语的自然表达。
theological_decisions:
- issue: 王权与祭司职分的关系
  choice: 使王权服从祭司职分
  alternative: 把王国置于祭司体系之下
  rationale: 原文明确表达从属关系，但不进一步说明这种关系的制度形式、范围或持续时间，因此不作教派化阐释。
- issue: 神的称谓
  choice: 上帝
  alternative: 主
  rationale: 希腊文为ὁ Θεός，故不沿用英语咨询层中缺乏此处原文依据的“主”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原句“我—他”之间未明说身份的指代，不在正文中补入解释；并以“因为……又……”维持原文作为论证理由的语气。
