id: T12P.JUD.8.32
reference: Testament of Judah 8:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τέκνα μου, ἡ φιλαργυρία πρὸς εἰδωλολατρίαν ὁδηγεῖ, ὅτι ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
  note: 'Greek from Charles XIX.1 (α): love of money leads to idolatry. The project English compresses this with a ''wine to immorality'' summary that recapitulates ch.XIV; the wine half is implicit, the φιλαργυρία/εἰδωλολατρία half is α XIX.1. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIX.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/032.yaml
  text: My children, I have shown you that wine leads to sexual immorality, and the love of money to idolatry; and these things turn the mind away from the law of God.
translation:
  language: zh_hans
  text: 我的孩子们，贪爱钱财会把人引向偶像崇拜，因为人在钱财的迷惑中，把那些并不是神的称为神；贪爱钱财也会使有这种贪念的人陷入恍惚迷乱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节依据现存希腊文本翻译。英文项目文本另概述“酒导致淫乱”以及“这些事使人心偏离上帝的律法”，但这些内容不见于本节所给希腊原文；前者来自本书其他段落的主题整合。
    reason: 说明希腊底本与英文咨询层之间的实质差异，避免把跨章概述误作本节原文。
lexical_decisions:
- source_word: Τέκνα μου
  choice: 我的孩子们
  rationale: 保留父辈临终训诫的亲切、庄重称呼。
- source_word: ἡ φιλαργυρία
  choice: 贪爱钱财
  rationale: 表达对金钱的贪恋，而不弱化为中性的“爱钱”。
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: 会把人引向偶像崇拜
  rationale: 贴近“引导、带向”的动态含义，保留因果趋向。
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: 在钱财的迷惑中
  rationale: πλάνη可指迷惑、谬误或迷失；此译保持其道德与认知双重意味。
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  choice: 把那些并不是神的称为神
  rationale: 直接保留原文对假神的否定判断与“称为”的措辞。
- source_word: τὸν ἔχοντα αὐτήν
  choice: 受它支配的人
  rationale: 字面为“拥有它的人”，但此处所拥有的是贪财之欲；汉语采用自然表达，显出反被欲望辖制的语义。
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: 陷入神志迷乱
  rationale: ἔκστασις本义涉及脱离常态、失神或迷乱；此处语境为负面后果，不采用现代宗教语境中偏正面的“出神”。
theological_decisions:
- issue: 是否纳入英文POB中的酒、淫乱及偏离上帝律法
  choice: 正文仅翻译现存希腊原文所明载的贪财、偶像崇拜和神志迷乱
  alternative: 依英文POB加入“酒导致淫乱”及“使心偏离上帝的律法”
  rationale: 所给希腊文本没有这些分句；来源说明也承认酒的部分只是依据别章作主题整合。按原语言证据优先，不把跨章概述写成该节明文。
- issue: 钱财与偶像崇拜的关系
  choice: 译为“会把人引向偶像崇拜”
  alternative: 译为“贪财就是偶像崇拜”
  rationale: 原文使用“引向”而非同一判断，故保留两者之间的趋向关系，不强化为完全等同。
- issue: “并不是神的”所指
  choice: 保留宽泛表述，不具体限定为财富、偶像或异教神祇
  alternative: 解释为“把钱财当作神”
  rationale: 原文复数表达本身具有一定开放性，直译可保存其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的训诫体。“偶像崇拜”保留宗教术语的准确性；“神志迷乱”传达负面的失常状态。句法适度拆分，以符合现代汉语阅读习惯，同时保存原文的因果链条。
