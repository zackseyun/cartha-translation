revisions:
- from: 我的孩子们，贪爱钱财会把人引向偶像崇拜，因为人在钱财的迷惑中，把那些并不是神的称为神；贪爱钱财也会使受它支配的人陷入神志迷乱。[a]
  to: 我的孩子们，贪爱钱财会把人引向偶像崇拜，因为人在钱财的迷惑中，把那些并不是神的称为神；贪爱钱财也会使有这种贪念的人陷入恍惚迷乱。[a]
  rationale: 仅作两处低风险修订：将对“拥有贪财之心者”的强化性解释收回为贴近原文的“有这种贪念的人”，并以“恍惚迷乱”表达ἐκστασις的负面失常含义。其余措辞及脚注均可保留。
