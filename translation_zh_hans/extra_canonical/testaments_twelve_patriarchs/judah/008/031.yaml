source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει, *καὶ Θεῷ ὑπακοῦσαι οὐ δύναται, ὅτι ἐτύφλωσε τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
  note: Greek from Charles XVIII.6 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/031.yaml
  text: For he is enslaved to two contrary passions and cannot obey God, because they have blinded his soul and he walks in the day as in the night.
translation:
  language: zh_hans
  text: 因为他受两种彼此对立的欲念奴役，不能顺服上帝；因为他蒙蔽了自己的心灵，在白昼行走却如同在黑夜里一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν
  choice: 欲念
  rationale: 此处指支配人的强烈内在欲望或情欲；译作“欲念”既保留道德语境，又避免现代汉语“激情”可能带来的正面含义。
- source_word: ἐναντίοις
  choice: 彼此对立的
  rationale: 准确表达两种欲念相互冲突、方向相反。
- source_word: δουλεύει
  choice: 受……奴役
  rationale: 保留希腊文“作奴仆、被辖制”的强烈比喻，不弱化为单纯“受到影响”。
- source_word: ὑπακοῦσαι
  choice: 顺服
  rationale: 表达听从并服从上帝，符合宗教语境，同时是现代读者易懂的用语。
- source_word: ψυχὴν
  choice: 心灵
  rationale: 这里指人的内在生命与辨识能力；“心灵”比单用“灵魂”更自然，也与蒙蔽及行路的比喻协调。
- source_word: πορεύεται
  choice: 行走
  rationale: 保留原文以行路描写生活状态的比喻。
theological_decisions:
- issue: 蒙蔽行为的主语
  choice: 译为“这蒙蔽了他的心灵”，让“这”回指受两种对立欲念奴役的状态
  alternative: “它们蒙蔽了他的心灵”，把两种欲念明确作为复数主语
  rationale: 希腊文ἐτύφλωσε是单数动词，而其明确主语并未明说；不依照英文咨询层改成复数，以保留原文在语法指涉上的张力。
- issue: 人在白昼却如在黑夜行走的意象
  choice: 按原文保留明暗对照
  alternative: 意译为“即使真理显明，他仍活在无知中”
  rationale: 直保留原始比喻，避免额外指定“白昼”和“黑夜”的神学象征。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“奴役”“白昼／黑夜”的鲜明比喻。分号呈现不能顺服上帝与随后原因说明之间的结构。
