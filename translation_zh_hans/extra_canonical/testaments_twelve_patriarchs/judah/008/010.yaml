  text: '*Καὶ ὡς συνήλθον αὐτῇ συνελήφθη. 5. Ἀγνοῶν δὲ ἐγὼ ὃ ἐποίησα,'
  language: Greek
  note: 'Greek from Charles XII.4c-5a (α): the union and Judah''s unawareness. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/010.yaml
  text: So I gave them to her and went in to her, and she conceived by me. And because of the wine I did not perceive what I had done; neither did I recognize her when I went away.
translation:
  language: zh_hans
  text: 我与她同房，她就怀了孕。我却不知道自己所做的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήλθον αὐτῇ
  choice: 我与她同房
  rationale: συνέρχομαι 与间接受词在此委婉指性结合；“同房”既自然庄重，又准确传达语境。
- source_word: συνελήφθη
  choice: 她就怀了孕
  rationale: 该被动形式在此表示受孕；汉语用主动式“怀了孕”最自然。
- source_word: Ἀγνοῶν
  choice: 我却不知道
  rationale: 保留“没有意识到／不知道”的核心意义，并以“却”呈现前后转折。
- source_word: ὃ ἐποίησα
  choice: 自己所做的事
  rationale: 形式上贴近原文，不擅自补入酒醉、离去或未认出她等本段希腊文本没有明说的内容。
theological_decisions:
- issue: 犹大对行为的无知程度及原因
  choice: 仅译作“我却不知道自己所做的事”
  alternative: “因为喝了酒，我没有察觉自己做了什么；离开时也没有认出她”
  rationale: 所提供的希腊原文只陈述其不知道自己所做之事，没有交代原因，也没有提到离开时未认出她；因此保留原文的简略与张力，不采用英语咨询层中的扩展内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同房”作为委婉表达，适合宗教古典叙事；整体严格依据所给希腊文本，不把英语POB中的额外信息并入正文。
