review_pass:
  verdict: revise
  source_fidelity: 本项目经文并非所列VIII章希腊文的翻译；按来源说明，它是把《犹大遗训》XXI.1的“不要自高”主题与XXI.5的“亲近”措辞合并而成，且“在二者中都完全尊崇主”无直接α文本对应。草稿脚注正确披露了这一点。正文应避免把英语“in both”擅自解释为特定制度、权柄关系或明确的人物指代。
  naturalness: “在二者身上都完全尊崇主”在现代汉语中搭配不自然，且容易被理解为在两个人“身上”施行某事。改为“在这二者之中都完全尊崇主”，保留原英文及项目释义中“二者”的未明指向，同时使句子可读。
  terminology: “利未”“主”均符合通行中文圣经用语；“高抬自己，凌驾于利未之上”“亲近利未”适切。“亲近”应保持开放，不译成“顺服”或“归附”。
  issues:
  - severity: medium
    issue: “在二者身上都完全尊崇主”不合自然汉语搭配。
    rationale: “尊崇主”不通常以“在某人身上”作范围补语；该表达也会不必要地暗示“二者”是可承受行动的人。改作“在这二者之中”可保留项目英文的歧义。
  - severity: high
    issue: 正文是项目性合并释义，并无可逐句对应的连续α文本，且其中一项劝诫没有直接α文本根据。
    rationale: 这不是可由所列VIII章希腊文或连续α段落验证的直译。必须保留明确脚注，说明XXI.1、XXI.5的合并性质、无直接α对应的增补，以及α文本后续所在位置。
  revised_text: 因此，不要高抬自己，凌驾于利未之上，也不要与我作对；反要在这二者之中都完全尊崇主，并在人群中亲近利未。[a]
  revised_footnotes:
  - marker: a
    text: 本句不是现存α文本中的一段连续经文，而是项目性释义：它综合了《犹大遗训》XXI.1“不要高抬自己”的主题和XXI.5“亲近”的措辞。“在这二者之中都完全尊崇主”没有直接的α文本对应；其中“二者”的具体所指亦未由α文本在此处界定。α文本在XXI.6接着说：“你在他们中间将如同海……”。
    reason: 说明本句没有连续的直接α底本、由不同段落合并而成，并标明无直接α对应的增补及“二者”指向未明，避免读者误以为整句可逐字见于希腊文本。
  revision_rationale: 仅作必要的汉语表达修订：以“在这二者之中”替换不自然的“在二者身上”。脚注继续并更明确地披露项目性合并、缺少直接α对应和未定指代；没有把“亲近”强化为顺服、归附或其他神学性关系。
