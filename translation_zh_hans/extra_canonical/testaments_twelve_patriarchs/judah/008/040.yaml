  note: Project verse 8:40 ('be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi') is a project paraphrase that consolidates the 'do not exalt yourselves' theme of Charles XXI.1 with the 'draw near' (προσεγγίζειν) language of XXI.5, plus an addition ('honor the Lord in both') with no direct α counterpart. The α-text proceeds at XXI.6 to 'Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα...' rather than this exhortation. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/040.yaml
  text: Therefore be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi.
translation:
  language: zh_hans
  text: 因此，不要高抬自己，凌驾于利未之上，也不要与我作对；反要在两方面都全然尊崇主，并且在人群中亲近利未。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句不是现存α文本中的一段连续经文，而是项目性释义：它综合了《犹大遗训》XXI.1“不要高抬自己”的主题和XXI.5“亲近”的措辞。“要在两方面都全然尊崇主”没有直接的α文本对应；其中“两方面”的具体所指也未由现存α文本界定。α文本在XXI.6接着说：“你在他们中间将如同海……”
    reason: 说明本句并非可由现存α见证逐字核对的连续经文，交代整合来源及无直接α对应的增补，并避免为“两方面”赋予未经文本支持的特定解释。
lexical_decisions:
- source_word: ὑψοῦσθαι（据项目说明所指《犹大遗训》XXI.1主题）
  choice: 高抬自己，凌驾于……之上
  rationale: 既表达自我 exaltation，也自然呈现相对于利未居高自傲的关系。
- source_word: προσεγγίζειν（据项目说明所指XXI.5措辞）
  choice: 亲近
  rationale: 保留“走近、接近”的基本含义，不将其具体化为服从、结盟或担任祭司职分。
- source_word: Levi
  choice: 利未
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: “在二者身上都完全尊崇主”缺乏直接的α文本对应
  choice: 保留在正文中，但加脚注说明其文本性质
  alternative: 从正文删除，只翻译可由α见证直接支持的内容
  rationale: 项目给定的英文POB包含此句，但原始资料明确指出它是无直接α对应的增补；脚注可避免把它误呈为有直接希腊文依据。
- issue: 本节是由XXI.1与XXI.5整合而成的项目性释义
  choice: 以通顺中文呈现，并明确标注不是连续的α文本经句
  alternative: 把各来源片语拆开重构，或以VIII章所附希腊文代替
  rationale: 所提供的VIII章希腊文属于相关父记录，并非本项目8:40的直接底本；诚实保留来源张力比制造逐字对应更妥当。
- issue: “亲近利未”的关系含义
  choice: 保持“亲近”的开放表达
  alternative: 译作“顺从利未”或“归附利未”
  rationale: προσεγγίζειν本身不必然规定权柄、宗派或制度关系，应保留真实歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“却要”标明劝诫的转折；“在人群中”依英文咨询层保留，但因没有可核对的连续α底本，不进一步收窄其含义。所有文本来源问题集中在脚注中交代。
