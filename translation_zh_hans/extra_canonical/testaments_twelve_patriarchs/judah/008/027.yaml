source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας, καὶ ἀκούσατε Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
  note: Greek from Charles XVIII.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/027.yaml
  text: Therefore keep yourselves, my children, from sexual immorality and from the love of money, and listen to Judah your father.
translation:
  language: zh_hans
  text: 所以，我的孩子们，你们要谨防淫乱和贪爱钱财，并要听你们父亲犹大的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: 要谨防
  rationale: 该中间语态祈使式含有自我警醒、避开的意思；“谨防”既自然，也保留劝诫的力度。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲属称呼，保留父亲临终训诫式的亲切庄重语气。
- source_word: πορνείας
  choice: 淫乱
  rationale: 此词泛指不正当的性行为；“淫乱”是简洁、庄重且范围较宽的对应词。
- source_word: φιλαργυρίας
  choice: 贪爱钱财
  rationale: 词义是对金钱的贪爱，而非钱财本身；此译明确保留其欲望层面的含义。
- source_word: ἀκούσατε
  choice: 听从
  rationale: 在父亲向儿女发出伦理训诫的语境中，不仅指听见，也含听取并遵从之意。
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: 你们的父亲犹大
  rationale: 按现代汉语自然语序表达同位关系，同时完整保留说话者的名字和父亲身份。
theological_decisions:
- issue: πορνεία的伦理范围
  choice: 译作“淫乱”
  alternative: “性方面的不道德行为”
  rationale: 原词具有概括性，未限定某一种具体行为；“淫乱”保留其广义伦理谴责，又避免在正文中加入原文没有列明的细目。
- issue: ἀκούσατε所表达的回应程度
  choice: 译作“听从”
  alternative: “听”或“听取”
  rationale: 命令语境支持顺从之意；不过不进一步译成“服从”，以免把父亲劝诫强化为更制度化的权威要求。
translation_notes:
  register: 采用现代、庄重而易懂的父辈劝诫语体。“所以”承接前文推论；两个应当避开的对象以“和”并列，保留希腊文结构。原文校勘符号所标示的καὶ未造成需要在中文正文中标注的实质歧义，因此不设脚注。
