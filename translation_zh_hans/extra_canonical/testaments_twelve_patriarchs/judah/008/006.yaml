  rationale: 修订按希腊文保留“她的美貌”作为“欺骗了我”的主语，保留“借着妆饰的样式”作为方式性短语，并删除原文未明示的“又”。“因酒醉了”较自然地表达μεθυσθεὶς…οἴνῳ的状态与原因；不增添有关责任、意图或心理状态的解释。
