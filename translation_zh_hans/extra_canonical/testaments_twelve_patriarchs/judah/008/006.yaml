  text: Μεθυσθεὶς οὖν οἴνῳ οὐκ ἐπέγνων αὐτὴν, καὶ ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως.
  language: Greek
  note: Greek from Charles XII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/006.yaml
  text: Therefore, being drunk with wine, I did not recognize her; and her beauty led my mind astray through the fashion of her adornment.
translation:
  language: zh_hans
  text: 因此，我因酒醉了，没有认出她；她的美貌借着她妆饰的样式欺骗了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς οὖν οἴνῳ
  choice: 因此，我喝酒醉了
  rationale: 保留分词的因果承接意味，并以自然的现代汉语表达因酒而醉的状态。
- source_word: οὐκ ἐπέγνων αὐτὴν
  choice: 没有认出她来
  rationale: ἐπιγινώσκω在此指辨认身份；“认出”比泛指认识的“认识”更准确。
- source_word: ἠπάτησέ με
  choice: 迷惑了我
  rationale: 该动词基本义为欺骗、诱骗；在美貌影响判断的语境中，“迷惑”既自然，也不额外加入原文没有明说的“心思”。
- source_word: τὸ κάλλος αὐτῆς
  choice: 她……的美貌
  rationale: 直接对应“她的美”，用“美貌”符合人物外观语境。
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: 借着妆饰的外表
  rationale: σχῆμα可指外形、样式或装束呈现的样子，κόσμησις指装饰、妆饰；此译保留介词结构及外观层面的含义，避免过度具体化为某种服饰款式。
theological_decisions:
- issue: 醉酒、美貌与受骗之间的责任关系
  choice: 按原文并列保留醉酒使他未能认出她，以及她的美貌借妆饰外表迷惑他的叙述
  alternative: 解释为醉酒完全免除他的责任，或解释为她单方面蓄意欺骗
  rationale: 原文陈述相关因素，却没有明确裁定道德责任的比例；译文不替文本消解这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留原文的因果承接和两个谓语分句；不添加英文咨询层中的“心思”，因为希腊文仅说“迷惑了我”。
