base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/002.yaml
  text: She bore me Er and Onan and Shelah. And the Lord killed the first two, for Er was wicked; and Onan, when he had married Tamar, spilled the seed upon the ground, according to the commandment of his mother, and he also died through wickedness.
translation:
  language: zh_hans
  text: 她给我生了珥、俄南和示拉。主杀了其中两人，因为示拉活了下来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文到此只说明主杀了三子中的两个，并以示拉存活作解释；所给英文版本另有较长叙述，提到珥的恶行以及俄南与他玛之事，这些内容不见于本处所提供的希腊文本。
    reason: 明确所给希腊底本与英文咨询层之间的重要篇幅差异，避免把后者的扩展误作本处希腊原文。
lexical_decisions:
- source_word: Αὕτη
  choice: 她
  rationale: 在上下文中指前述女子；现代汉语用“她”自然简洁，不额外补入原文未明说的身份。
- source_word: ἔτεκέν μοι
  choice: 给我生了
  rationale: 保留间接受词“给我”和生育动作，符合现代汉语叙事表达。
- source_word: ἀνεῖλεν
  choice: 除灭了
  rationale: 该动词在此表示使人死亡；“除灭”保留主施行审判的庄重语气，而不把方式具体化。
- source_word: τοὺς μὲν δύο
  choice: 其中两个
  rationale: 原文只说“三人中的两个”，并未在本句直接称为“头两个”；随后以示拉存活加以说明。
- source_word: ἔζησεν
  choice: 活了下来
  rationale: 结合另两人被除灭的对比，译为“活了下来”比孤立的“活着”更符合汉语语境。
theological_decisions:
- issue: 主使其中两人死亡的表述
  choice: 直译为“主除灭了其中两个”
  alternative: 弱化为“其中两个死了”
  rationale: 原文明确以“主”为主语，不应消除神主动施行审判所形成的神学张力。
- issue: 是否补入珥与俄南死亡的罪因和他玛事件
  choice: 正文不补入
  alternative: 依照所给英文POB加入珥作恶、俄南遗精于地及听从母命等内容
  rationale: 所提供的希腊文证据没有这些语句；应先依据原语言来源，不把咨询层中的扩展内容无标记地并入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“除灭”保留古代宗教叙事的审判色彩；句式简洁，并保留希腊文本对“两人”身份的间接说明。
