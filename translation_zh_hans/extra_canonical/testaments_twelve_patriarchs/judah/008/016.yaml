  text: Καὶ νῦν λέγω ὑμῖν, τέκνα μου, μὴ μεθύσκεσθε οἴνῳ, ὅτι ὁ οἶνος διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας καὶ ἐμβάλλει ὀργὴν ἐπιθυμίας, καὶ ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς.
  language: Greek
  note: 'Greek from Charles XIV.1 (α): the wine-warning exhortation. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/016.yaml
  text: 'And now, my children, I say to you: do not be drunk with wine. For wine turns the mind away from the truth and inspires the passion of desire, and it leads the eyes into error.'
translation:
  language: zh_hans
  text: 现在，我的孩子们，我告诉你们：不要醉酒，因为酒使人的心思偏离真理，激起欲望的冲动，并引人的眼目陷入迷误。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留亲切的父辈劝诫语气，也符合现代汉语自然表达。
- source_word: μὴ μεθύσκεσθε οἴνῳ
  choice: 不要醉酒
  rationale: 准确表达禁止因酒而醉的含义；汉语无需重复“用酒”。
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: 使人的心思偏离真理
  rationale: νοῦς在此指思想、判断与心智；“心思”通俗而不失庄重。“偏离”体现ἀπό所表示的离开。
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: 激起欲望的冲动
  rationale: 原短语字面结构不寻常，ὀργή可表强烈激动或冲动，不宜在此武断限定为“愤怒”；译文保留欲望被猛烈激发的含义。
- source_word: ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς
  choice: 使人的眼目误入迷途
  rationale: 保留“引导进入迷误”的动态意象，并以“眼目”对应ὀφθαλμούς，而不将其解释性改写为一般判断力。
theological_decisions:
- issue: 本句禁令针对饮酒本身还是醉酒
  choice: 不要醉酒
  alternative: 不要喝酒
  rationale: μεθύσκεσθε明确指醉酒；译为全面禁酒会超出原文，也可能引入宗派性立场。
- issue: ὀργὴν ἐπιθυμίας所指的情感性质
  choice: 欲望的冲动
  alternative: 欲望的愤怒／淫欲的激情
  rationale: 该属格结构具有语义张力；原文没有明确限定为性欲，也不必将ὀργή固定理解为愤怒，因此采用较宽泛且自然的表达。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。“现在，我的孩子们”保留讲话转折与父辈口吻；整体尽量贴近希腊文的因果推进和三重危害结构。
