source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὸ γὰρ πνεῦμα τῆς πορνείας τὸν οἶνον ὡς διάκονον ἔχει πρὸς τὴν ἡδονὴν τοῦ νοός. ὅτι καίγε τὰ δύο ταῦτα ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου.
  language: Greek
  note: Greek from Charles XIV.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/017.yaml
  text: For the spirit of sexual immorality has wine as a servant to give pleasure to the mind; for these two also take away a person's understanding.
translation:
  language: zh_hans
  text: 因为淫乱之灵把酒当作仆役，以使心思得到快感；这两者确实会使人失去判断力。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: 淫乱之灵
  rationale: 保留原文将诱使人陷入性不道德的力量人格化为“灵”的表达；“淫乱”简洁而庄重。
- source_word: τὸν οἶνον ὡς διάκονον ἔχει
  choice: 以酒为仆役
  rationale: 较贴切地保留“把酒当作服役者、助手”的比喻关系。
- source_word: πρὸς τὴν ἡδονὴν τοῦ νοός
  choice: 使心智贪享快感
  rationale: 表达酒被用来促成心智享乐的目的；“贪享”体现语境中的负面道德倾向，但不把具体机制说死。
- source_word: ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: 使人失去理智
  rationale: 按此处语境将“使人的理解/心思离开”自然译为理智受损或丧失，符合现代汉语表达。
- source_word: καίγε
  choice: 也确实
  rationale: 兼顾καί的承接义和γε的强调语气。
theological_decisions:
- issue: “淫乱之灵”应理解为独立灵体还是拟人化的内在倾向
  choice: 保留“淫乱之灵”
  alternative: 淫乱的欲念／淫乱的势力
  rationale: 原文使用πνεῦμα，既可能指一种灵，也可能是对支配性倾向的拟人化；直译可保留这种歧义，不预先作宗派性判断。
- issue: “这两者”的所指
  choice: 保留为“这两者”
  alternative: 明说“淫乱与醉酒”或“淫乱之灵与酒”
  rationale: 希腊文只说τὰ δύο ταῦτα，具体对应关系可由上文理解；不在译文中补足，以保留原文略带含混的指称。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“灵—酒—仆役”的人格化比喻，并用“失去理智”自然呈现结句的伦理警告。
