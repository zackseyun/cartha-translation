source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν, τέκνα μου, παραγγέλλω ὑμῖν, ἀγαπᾶτε τὸν Λευὶ, ἵνα διαμείνητε, καὶ μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν, ἵνα μὴ ἐξολοθρευθῆτε.
  language: Greek
  note: Greek from Charles XXI.1 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/035.yaml
  text: And now I command you to love Levi, that you may live, and do not exalt yourselves against him, lest you be utterly destroyed.
translation:
  language: zh_hans
  text: 现在，我的孩子们，我嘱咐你们：要爱利未，好使你们得以存留；不要向他自高，免得你们被彻底除灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: 嘱咐
  rationale: 表达郑重吩咐之意，同时符合父亲对孩子们说话的语境，比单用“命令”更自然。
- source_word: ἀγαπᾶτε
  choice: 要爱
  rationale: 直接保留持续爱护、忠于利未的劝命语气，不额外限定其具体表现。
- source_word: διαμείνητε
  choice: 长存
  rationale: 原词指继续存在、存留下去；采用“长存”保留其较宽泛的含义，避免擅自明确为肉身存活或民族延续。
- source_word: ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: 向他妄自尊大
  rationale: 保留“抬高自己、凌驾于他之上”的空间关系和骄傲含义，体现针对利未的自高。
- source_word: ἐξολοθρευθῆτε
  choice: 被彻底除灭
  rationale: 体现该动词强烈的毁灭、剪除语义及被动形式，不将审判执行者明说出来。
theological_decisions:
- issue: “长存”的所指
  choice: 保留为“长存”
  alternative: “存活”或“继续存在”
  rationale: 希腊文未明确其所指是个人生命、后裔延续还是群体存续，因此不在正文中消除这种开放性。
- issue: 除灭的执行者
  choice: 使用无施事者的被动句“被彻底除灭”
  alternative: “免得上帝彻底除灭你们”
  rationale: 原文是神学被动式但没有明说施事者；译文不补入“上帝”，以保留原文表达。
- issue: 利未是个人还是支派代表
  choice: 译作专名“利未”，代词用“他”
  alternative: 解释为“利未支派”
  rationale: 原文使用单数专名及单数代词，可能兼有祖先与群体代表意义；正文不擅自限定为支派。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留父亲临别训诫式的称呼与命令语气；句式简洁，对称呈现正面命令与反面警告。
