  source_fidelity: 译文总体忠实呈现了训诫、爱利未、存留与毁灭的条件性警告。μως，διαμείνητε 更直接是“得以继续存留／存续”，而“长存”在现代汉语中略偏固定、带永久性意味；ἐπαίρεσθε ἐπ᾽ αὐτόν 的核心是“向他自高／凌驾于他”，现译“向他妄自尊大”可懂，但搭配稍不自然。
