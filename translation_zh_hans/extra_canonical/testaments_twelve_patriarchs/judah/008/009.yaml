base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/009.yaml
  text: And I said, "What pledge shall I give you?" And she said, "Your staff, and your girdle, and the diadem of your kingdom."
translation:
  language: zh_hans
  text: 我就把我的杖和冠冕交给她，作为抵押。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: 杖
  rationale: 保留原文所指的手杖或权杖，不额外限定其用途。
- source_word: διάδημα
  choice: 冠冕
  rationale: 指象征尊位的冠饰；译作“冠冕”既自然，也保留其身份与权柄意味。
- source_word: εἰς ἀρραβῶνα
  choice: 作信物
  rationale: 此处指为履约而交付的抵押物或凭据；“作信物”符合叙事情境，又不把含义窄化为现代金融意义的“押金”。
theological_decisions:
- issue: 是否补入英语项目文本中的问答、“腰带”及“你王国的”
  choice: 不补入，仅翻译所提供希腊语句的交付内容
  alternative: 按英语项目文本译为双方问答，并加入腰带及王国冠冕
  rationale: 所提供的希腊语原文只有“我把我的杖和冠冕交给她作信物”，没有问答、腰带或“王国”修饰语。依照原文证据优先的原则，不将咨询层中的扩展内容写入本节。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语叙事体。“我便……交给她”清楚表达希腊语完成时在叙事中的既成行动；不人为扩写原文。
