revisions:
- from: 因为主的天使对我说：“主拣选了他[a]，使他居于你之上，得以亲近主，在主的席上吃饭，并把以色列众子佳肴中初熟的供物献给主。至于你，你将作雅各的王。[b]”
  to: 因为主的天使对我说：“主拣选了他[a]高过你，使他得以亲近主，在主的席上吃饭，并把以色列子民佳美之物的初熟供物献给主。至于你，你将作雅各的王。[b]”
  rationale: 修订仅调整ὑπὲρ σέ和ἀπαρχὰς ἐντρυφημάτων的汉语表达：前者更自然地表达相对优先地位，后者避免将“佳美之物”窄化为“佳肴”，并使“初熟供物”的献祭术语有恰当的修饰关系。其余内容及脚注均忠实反映指定希腊α文本，未向英语咨询文本或较广传统补入“利未”或“如狮子”。
  reviewer_model: gpt-5.6-terra
