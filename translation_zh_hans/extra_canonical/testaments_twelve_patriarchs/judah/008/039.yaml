  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: zh_hans
  text: 因为主的天使对我说：“主拣选了他[a]高过你，使他得以亲近主，在主的席上吃饭，并把以色列子民佳美之物的初熟供物献给主。至于你，你将作雅各的王。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”按上下文通常指利未；希腊文本本句只用代词，并未直呼其名。
    reason: 保留原文的指代形式，同时帮助读者辨认人物。
  - marker: b
    text: 所据希腊文本作“雅各的王”，没有“如狮子”一语；狮子意象见于本书其他相关传统。
    reason: 说明与英语咨询文本的实质差异，并避免把后来的或旁处的意象补入正文。
lexical_decisions:
- source_word: Αὐτὸν
  choice: 他
  rationale: 希腊文本使用第三人称代词，并未在本句直称利未；保留代词，同时以脚注交代其语境所指。
- source_word: ὑπὲρ σὲ
  choice: 使他居于你之上
  rationale: 表达比较和优先地位，避免像英语咨询文本的“before you”那样可能仅被理解为时间先后。
- source_word: προσεγγίζειν αὐτῷ
  choice: 得以亲近主
  rationale: “亲近”保留祭司性接近上主的意味；把代词译作“主”，使汉语指代清楚。
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: 在主的席上吃饭
  rationale: 希腊语字面为“吃他的桌席”，按现代汉语自然表达其赴席、享席之意。
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: 佳肴中初熟的供物
  rationale: ἀπαρχαί 指首先献上的一份或初熟之物；ἐντρυφήματα 指可享用的美物、佳肴。译文兼顾献祭语境与可读性。
- source_word: βασιλεὺς Ἰακώβ
  choice: 雅各的王
  rationale: 依照所给希腊 α 文本直译其简洁而略显突兀的属格结构，不擅自补入狮子意象。
theological_decisions:
- issue: 被拣选者的身份
  choice: 正文保留“他”，脚注说明按上下文通常指利未
  alternative: 正文直接译为“利未”
  rationale: 原文在本句只写 αὐτόν；保留其表层指代可避免把上下文解释无标记地写进正文。
- issue: 犹大的王权与利未的亲近上主之职
  choice: 并列保留两种角色，不解释二者高下或后续制度关系
  alternative: 把本句阐释为特定王权—祭司权教义
  rationale: 原文既说被拣选者居于犹大之上、亲近主，又说犹大将作王；译文保留这种张力。
- issue: 结尾的狮子意象
  choice: 正文不加入“如狮子”
  alternative: 依英语项目文本补译“如狮子”
  rationale: 指定的 Charles 希腊 α 文本此处仅有“你将作雅各的王”，没有 ὡς λέων；狮子意象虽见于更广传统，却不应据此添入本句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主的席”“初熟的供物”等措辞保留宗教和献祭语域；重复“主”以化解连续代词在汉语中的歧义。
