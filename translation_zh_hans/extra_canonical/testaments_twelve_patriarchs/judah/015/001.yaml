  rationale: 修订以“被剥光”直译γυμνούμενος，同时不将其可能的受辱、剥夺等引申义定为唯一含义；以“蒙受羞辱”更充分译出ἀδοξῶν。保留“行淫乱的人”对πορνεύσας的宽泛、非性别限定表达，以及原文两组分词—否定动词的平行。原文在πορνεύσας后的¹未提供相应内容，故不虚构脚注或锚点。
