base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/001.yaml
  text: The one who commits sexual immorality, while being ruined, does not perceive it; and while being dishonored, he is not ashamed.
translation:
  language: zh_hans
  text: 行淫乱的人，即使被剥光，也察觉不到；即使蒙受羞辱，也不觉羞耻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύσας
  choice: 行淫乱的人
  rationale: 以名词化表达译出不定过去主动分词，指实施淫乱行为的人；“淫乱”保留 πορνεύω 较宽泛的性不道德含义，不缩窄为某一种具体行为。
- source_word: γυμνούμενος
  choice: 在被剥得赤裸时
  rationale: 按被动分词的直接意义译为“被剥得赤裸”，保留身体裸露、遭剥夺或公开暴露之间的意象张力；不直接采用英语咨询层较解释性的“被毁掉”。
- source_word: οὐκ αἰσθάνεται
  choice: 也察觉不到
  rationale: 译出“感知、察觉”的基本义，表达当事人对自身处境毫无觉察。
- source_word: ἀδοξῶν
  choice: 在名誉受损时
  rationale: ἀδοξέω 表示失去名望、处于无荣誉或受轻蔑的状态；此处用自然汉语表达其社会性失荣含义。
- source_word: οὐκ αἰσχύνεται
  choice: 也不感到羞耻
  rationale: 准确传达“觉得羞耻、惭愧”的反身状态，并与前句“察觉不到”形成平行。
theological_decisions:
- issue: γυμνούμενος 是直指赤裸还是隐喻毁坏
  choice: 正文保留“被剥得赤裸”的具体意象
  alternative: 被毁掉；被剥夺一空
  rationale: 希腊词直接表示被脱去衣服、成为赤裸；它在语境中可能兼有受辱、暴露或遭剥夺的隐喻作用。正文不把这一多义性提前解释为单一的“毁灭”。
- issue: πορνεύσας 的指称范围
  choice: 行淫乱的人
  alternative: 犯奸淫的人；淫乱的男人
  rationale: 原文分词本身不限定为通奸，也无须在中文中增添男性限定，因此采用范围较宽且自然的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两小句保持希腊文的平行结构，并以两个“也”传达 οὐκ…καὶ…οὐκ 的递进并列语势。原始材料在 πορνεύσας 后带有注号“¹”，但未提供对应校勘说明，因此不擅自设置无法说明内容的正文脚注。
