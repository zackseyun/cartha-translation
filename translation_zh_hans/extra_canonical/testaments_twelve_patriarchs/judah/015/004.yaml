base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/004.yaml
  text: And indeed, having repented concerning these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
translation:
  language: zh_hans
  text: 我确实为这些事悔改了；直到年老，我都没有饮酒，也没有吃肉；我也没有见过任何欢乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有见过任何欢乐”直译为“没有看见任何欢乐”；也可指不享受欢乐，或不参与欢庆活动。正文保留其含混性。
    reason: εἶδον（“看见”）与εὐφροσύνη（“欢乐”）的组合可作宽泛、比喻性的表达，未明确限定为内在感受或外在庆典。
lexical_decisions:
- source_word: Καίγε
  choice: 确实
  rationale: 表示强调和承接，比转折性的“虽然”更符合原文。
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: 为这些事悔改了
  rationale: μετανοέω在此指因先前所述之事回转悔改，不仅是一般性的“改变想法”。
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: 不再沾酒吃肉
  rationale: 原文以同一个“吃”统摄酒与肉；中文用“沾酒吃肉”自然表达禁绝二者，同时保留其禁欲意味。
- source_word: ἕως γήρους μου
  choice: 直到年老
  rationale: 简洁对应“直到我的老年”，在现代汉语中更自然。
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: 不见任何欢乐
  rationale: 尽量保留“看见”与“欢乐”的原始措辞及其可能的宽泛含义，不擅自限定为宴饮、娱乐或内心感受。
theological_decisions:
- issue: 悔改后的禁绝行为是否被表述为普遍宗教规范
  choice: 仅按第一人称叙述犹大的个人行为
  alternative: 将禁酒禁肉写成普遍性的悔改要求
  rationale: 原文只陈述说话者自己的回应，并未在本句中建立适用于所有人的规范。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“沾酒吃肉”避免生硬直译成“吃酒和肉”；分号呈现悔改与随后长期禁绝、远离欢乐之间的关系。
