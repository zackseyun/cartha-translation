  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ²⁴ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν²⁹ βασιλέως αἴρουσιν³⁰ τὴν δόξαν τοῦ ἀνδρὸς⁵¹ τὴν δύναμιν, *τοῦ δὲ πτωχοῦ³⁴ *τὴν⁵² πτωχείας⁵³ ἐλάχιστον στήριγμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/005.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's support.
translation:
  language: zh_hans
  text: 上帝的天使指给我看：女人掌控君王，也辖制穷人；她们夺去君王的荣耀、男人的力量，以及穷人在贫困中仅有的一点依靠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句语法较生硬，也可较直译为“穷人的、贫困中最微小的支撑”。
    reason: 提示底本末语的结构与含义存在不顺畅之处，并保留其可能的理解空间。
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: 掌控君王
  rationale: κρατέω与属格搭配表示控制、支配；译为“掌控”既保留权势意味，也符合现代汉语。
- source_word: κατακυριεύουσιν
  choice: 辖制
  rationale: 该词表示施行主宰或压制性的统治；“辖制”比一般的“管理”更能体现原文力度。
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: 男人的力量
  rationale: ἀνήρ在此最直接指成年男子；原文并无明确形容词表示“强壮的”，故不增译为“强者”。
- source_word: πτωχείας ἐλάχιστον στήριγμα
  choice: 在贫困中仅有的一点依靠
  rationale: 原文末语法略显生硬，字面涉及“贫困”“最小的”与“支撑”；此译自然传达穷人所剩微薄依靠的意思，同时不夸大为全部或最后的依靠。
theological_decisions:
- issue: 经文对女人支配男人的概括
  choice: 保留原文笼统的“女人”
  alternative: 弱化为“有些女人”或“这些女人”
  rationale: 希腊文使用带冠词的复数“女人们”，本节未限定为部分人；为避免替作者缓和其论断，正文保留这一概括。
- issue: 是否加入“永远”
  choice: 不加入“永远”
  alternative: 依英语POB译作“永远掌控”
  rationale: 所提供的希腊文中没有对应“永远”的词语；以原文证据为先，不采用英语咨询层中的无源增补。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以分号呈现前后总述与具体列举的关系。避免照搬英语POB中原文没有的“永远”和“强壮的”等成分。
