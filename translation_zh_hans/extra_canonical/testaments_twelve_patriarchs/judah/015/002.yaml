  text: Κἂν γάρ τις *βασιλεὺς ἐστι² καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας*, δουλεύσας τῇ πορνείᾳ⁶ ὡς κἀγὼ ἔπαθον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/002.yaml
  text: For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered.
translation:
  language: zh_hans
  text: 因为即使有人身为君王，若犯淫乱，也会被褫夺王位，沦为淫乱的奴仆，正如我也曾遭受过同样的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεὺς / βασιλείας
  choice: 王 / 王位
  rationale: 前者指君王身份，后者在“被褫夺”的搭配中自然指其王权或王位；译作“王位”清楚保留身份被剥夺之意。
- source_word: πορνεύῃ / πορνείᾳ
  choice: 行淫乱 / 淫乱
  rationale: πορνεία是范围较广的性不道德用语；“淫乱”在现代中文中庄重且不把含义缩限为某一种具体行为。
- source_word: γυμνοῦται
  choice: 被褫夺
  rationale: 字面有“被剥去、被剥夺”之意；与“王位”搭配时，“褫夺”准确而凝练。
- source_word: δουλεύσας
  choice: 沦为……的奴仆
  rationale: 保留“成为奴隶、受其辖制”的强烈比喻，并以“沦为”表达其结果及贬降意味。
- source_word: ὡς κἀγὼ ἔπαθον
  choice: 我也曾遭受这样的事
  rationale: ἔπαθον强调亲身遭遇或承受；此译保留所指可能涵盖前述被剥夺、受奴役整个结果的概括性。
theological_decisions:
- issue: 淫乱与失去王权之间的关系
  choice: 按原文直陈“也会被褫夺王位”
  alternative: 弱化为“有损王者尊严”或解释为纯属灵意义
  rationale: 原文使用明确的γυμνοῦται τῆς βασιλείας，不宜擅自将其弱化或限定为隐喻；同时不补充其实现机制，以保留文本张力。
- issue: δουλεύσας所表达的辖制
  choice: 译作“沦为淫乱的奴仆”
  alternative: 译作“沉溺于淫乱”
  rationale: “沉溺”较自然，却削弱原文奴役意象；保留奴仆比喻更忠实，也不额外导入特定教义框架。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“褫夺王位”略带正式色彩，契合君王语境；分号呈现前后结果的紧密关系。原文无需要另加脚注的显著异文或不可避免的歧义，因此正文不设脚注标记。
