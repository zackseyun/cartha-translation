  rationale: 仅作措辞和句法顺畅度调整。保留原文的“即使／也”让步关系、被动的剥夺、奴役淫乱的强烈意象，以及末句对犹大亲身遭遇的概括性指涉；未补充剥夺王位的机制或将其限定为任何特定教义意义。
