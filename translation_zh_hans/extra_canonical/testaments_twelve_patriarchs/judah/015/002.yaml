  source_fidelity: 译文总体准确呈现了让步结构、失去王权及受淫乱奴役的比喻。惟“行淫乱”在现代汉语中搭配略显生硬；将其调整为“犯淫乱”可保留πορνεύῃ所指广义性不道德，且与后文名词“淫乱”对应。
  naturalness: “因为即使一个人是王”稍显逐字翻译；“即使有人身为君王”更合现代庄重书面语。“正如我也曾遭受过同样的事”能清楚表达ὡς κἀγὼ ἔπαθον，且不擅自限定所遭受的是前句的哪一项后果。
  terminology: “君王／王位”“淫乱”“奴仆”均适当。“褫夺王位”保留γυμνοῦται τῆς βασιλείας的被剥夺意象；“沦为淫乱的奴仆”保留δουλεύσας的奴役隐喻。
