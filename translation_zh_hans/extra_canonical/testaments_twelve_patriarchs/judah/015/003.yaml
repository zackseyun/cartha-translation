base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/003.yaml
  text: I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom.
translation:
  language: zh_hans
  text: 因为我已交付我的杖——也就是我支派的支撑；我的腰带——也就是我的力量；以及我的冠冕——也就是我国度的荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: 杖
  rationale: 保留原词既可指手杖、权杖，也具有支撑与权威象征意义的宽度；下文释义“支柱”使其象征意义清楚。
- source_word: στήριγμα
  choice: 支柱
  rationale: 表达支撑、依靠之意，且“我支派的支柱”在现代汉语中自然庄重。
- source_word: φυλῆς
  choice: 支派
  rationale: 犹太传统语境中指以色列的部族，译作“支派”准确且通行。
- source_word: ζώνην
  choice: 腰带
  rationale: 直译该名词，并保留古代腰带与力量、行动能力相关的象征。
- source_word: δύναμιν
  choice: 力量
  rationale: 直接呈现能力、力量之义，不额外限定为军事或政治权力。
- source_word: διάδημα
  choice: 冠冕
  rationale: 该词特指王者佩戴、象征统治身份的冠饰；“冠冕”兼具实体和王权象征。
- source_word: δόξαν τῆς βασιλείας μου
  choice: 我王权的荣耀
  rationale: βασιλεία 在此与冠冕相连，重点是君王身份与统治权；“王权”比“王国”更贴合此处象征关系，同时保留荣耀的政治—王室意味。
theological_decisions:
- issue: 三件物品及其解释是否应被理解为纯粹比喻
  choice: 保留实体名词，并以破折号引出原文自身的解释
  alternative: 直接意译为“我交出了支派的支柱、力量和王权的荣耀”
  rationale: 原文明确列出杖、腰带、冠冕，再分别用“也就是”解释；保留双层表达可维持叙事物件与象征意义之间的张力。
- issue: βασιλεία 应译为“王权”还是“王国”
  choice: 王权
  alternative: 王国
  rationale: 语境将冠冕解释为其荣耀，较自然地指君王统治身份的荣耀；但不进一步引申任何弥赛亚或宗派性含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个并列项使用分号和破折号，重现希腊文重复的“也就是”结构；“交出了”体现完成体 Δέδωκα 的既成动作，并比单纯“给了”更符合交付象征性信物的语境。
