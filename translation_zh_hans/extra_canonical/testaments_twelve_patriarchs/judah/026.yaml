  text: 'Therefore keep[a], my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness. And bury me near my fathers.


    And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.


    And if you walk in holiness according to all the commandments of the Lord, you will again dwell securely with me[b], and all Israel will be gathered to the Lord forever.'
translation:
  language: zh_hans
  text: '**《犹大遗训》第26章**


    1 所以，我的孩子们，你们要遵守主的全部律法，因为这律法是那些修直他道路之人的盼望。


    2 他对他们说：“看哪，我一百一十八岁了，今天就要死去。3 谁也不要用华贵的衣服安葬我；你们要把我带上到希伯仑，就是我祖先所在的地方。”


    4 他说完这些话，就安睡了[a]。他的儿子照他所吩咐的一切去做，把他葬在希伯仑，与他的祖先同葬。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安睡”是古代文献中表示死亡的常见委婉说法；此处保留原文意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλάξατε
  choice: 遵守
  rationale: 用于“律法”时，“遵守”自然表达持续而谨慎地持守命令，也保留祈使劝诫的力度。
- source_word: τέκνα μου
  choice: 我的孩子们
  rationale: 保留亲属称呼及遗训体的直接语气；τέκνα不限于强调男性身份，故不窄化为“儿子们”。
- source_word: πάντα τὸν νόμον Κυρίου
  choice: 主的全部律法
  rationale: πάντα修饰单数整体，强调律法的完整性；“全部律法”在现代汉语中既清楚又保留整体服从的含义。
- source_word: κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: 行正他道路
  rationale: κατευθύνω含使之正直、导向正途之意。译文保留“道路”意象及原文略显浓缩的表达，不擅自改写为泛泛的“行义”。
- source_word: ἐλπίς
  choice: 盼望
  rationale: 保留其宗教劝勉语境中的期待和信靠色彩；原句以律法为这类人的“盼望”，译文不将其弱化为“帮助”或“把握”。
- source_word: ἑκατὸν δέκα καὶ ὀκτὼ ἐτῶν
  choice: 一百一十八岁
  rationale: 按希腊文数值直译，并用现代汉语自然表达年龄。
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: 用华贵的衣服殓葬我
  rationale: πολυτελής表示昂贵、奢华；结合安葬语境，以“殓葬”清楚表达穿着华贵衣服办理葬事，而不增加原文没有的仪式细节。
- source_word: ἀναγάγετε
  choice: 把我带上
  rationale: 保留动词“带上去”的方向意味，符合前往希伯仑的传统地理表达。
- source_word: ἐκοιμήθη
  choice: 安睡了
  rationale: 保留古代常见的死亡委婉语和遗训叙事的庄重语体；“安睡”比单纯“睡了”更能让现代读者识别其死亡含义。
theological_decisions:
- issue: 律法与盼望之间的关系
  choice: 译作“这律法是那些行正他道路之人的盼望”
  alternative: 译作“那些遵行他道路的人就有盼望”
  rationale: 希腊文单数动词ἐστίν的隐含主语最自然地回指前面的“主的全部律法”，而τοῖς κατευθύνουσι为受益者。所选译法保留原文将律法称为“盼望”的紧密神学表述，不将关系改写成一般的因果承诺。
- issue: 死亡公式
  choice: 保留“安睡了”
  alternative: 直说“死了”
  rationale: 原文使用ἐκοιμήθη这一传统委婉语。保留该意象既忠于叙事措辞，也不进一步规定死后状态的教义含义。
- issue: 结尾内容的来源边界
  choice: 止于犹大在希伯仑与祖先同葬
  alternative: 加入英文咨询层中的末世性劝勉与以色列聚集语句
  rationale: 所提供的希腊文第26章止于安葬叙事，并不包含英文咨询层末段有关圣洁、安居和以色列永远归聚于主的句子。依原文证据优先原则，不把该层的额外材料并入正文。
translation_notes:
  register: 采用现代、庄重而易懂的遗训体。保留“律法”“盼望”“道路”“与祖先同葬”等经文式核心意象，但避免仿古虚词。按希腊文四节呈现；英文咨询层遗漏的年龄、华服禁令均据原文恢复，而其缺乏希腊文依据的附加结语未收入正文。
