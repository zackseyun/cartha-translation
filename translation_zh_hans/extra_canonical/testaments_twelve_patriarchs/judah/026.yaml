    4 他说完这些话，就安睡了[a]。他的儿子照他所吩咐的一切去做，把他葬在希伯仑，与他的祖先同葬。'
  rationale: 修订仅处理必要的汉语通顺性与局部源语对应：以“修直他道路”保留κατευθύνω及“道路”意象，而不将其解释性改写为“遵行他的道路”或“行义”；以“带上到”明确希伯仑为目的地；并将安葬禁令调为自然的现代汉语。其余内容维持原译对所给希腊文的忠实范围，未采纳英文审校层中无此希腊文依据的附加段落。
