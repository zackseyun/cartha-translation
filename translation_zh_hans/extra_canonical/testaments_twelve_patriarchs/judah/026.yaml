  timestamp: '2026-07-14T10:22:59Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体按所给希腊文四节恢复了英文审校层遗漏的年龄、葬礼禁令和希伯仑安葬叙事，也恰当地未纳入原文未见的末世性结语。惟第1节“行正他道路之人”在汉语中不通顺，且未清楚体现κατευθύνουσι的“使……正直／修直”之意。
  naturalness: 整体庄重自然，适合现代汉语遗训体；但“行正他道路之人”属于不自然的压缩表达。“把我带上希伯仑”也宜明确目的地为“带我上到希伯仑”。
  terminology: “主”“律法”“盼望”“安睡”“希伯仑”均合适。“祖先”能准确传达πατέρες在家族安葬语境中的祖先义。“用华贵的衣服安葬我”比“殓葬我”更符合现代自然用语。
  issues:
  - severity: medium
    issue: 第1节“行正他道路之人”不合现代汉语语法与搭配。
    rationale: κατευθύνουσι τὰς ὁδοὺς αὐτοῦ直观地含有“使／修直他的道路”的动作意象。原译既难以理解，也将动词的使动、修直意味压缩得不清楚。为保留原文略有歧义的所有格而不作神学性扩展，可译为“修直他道路的人”。
  - severity: low
    issue: 第2节“把我带上希伯仑”目的地介词不够明确。
    rationale: ἀναγάγετε με ἐν Χεβρών表示把我带上到希伯仑；补出“到”使汉语完整，且保留ἀνά的上行方向。
  - severity: low
    issue: 第3节“用华贵的衣服殓葬我”略显生硬。
    rationale: ἐν πολυτελεῖ ἐσθῆτι是安葬时不用华贵衣服的禁令；“不要用华贵的衣服安葬我”更自然，意义不变。
