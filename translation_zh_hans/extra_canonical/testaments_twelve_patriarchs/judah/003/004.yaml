  text: And after fighting with Achor for two hours, I killed him; and splitting his shield into two pieces, I chopped off his feet.
translation:
  language: zh_hans
  text: 我与亚割交战了两个小时，杀了他；又把他的盾牌劈成两半，砍下了他的双脚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολεμήσας
  choice: 交战了
  rationale: 以自然的现代汉语表达实际战斗，保留分词所交代的先行动作。
- source_word: τὸν Ἀχώρ
  choice: 亚割
  rationale: 按该希腊专名的传统汉语音译处理，不额外推定其身份。
- source_word: ἐπὶ ὥρας δύο
  choice: 两个小时
  rationale: 直接传达持续时间，符合现代汉语习惯。
- source_word: εἰς δύο μέρη ποιήσας τὴν ἀσπίδα αὐτοῦ
  choice: 把他的盾牌劈成两半
  rationale: 保留盾牌被分为两部分的结果，并用“劈”体现武力切开的语境。
- source_word: συνέκοψα τοὺς πόδας αὐτοῦ
  choice: 砍下了他的双脚
  rationale: συγκόπτω在此表示猛烈砍断；“砍下”明确表达肢体被截断，τοὺς πόδας则直译为“双脚”。
