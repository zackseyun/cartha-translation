lexical_decisions:
- source_word: ἐν δὲ τῷ ἐκδύειν με τὸν θώρακα αὐτοῦ
  choice: 正当我脱下他的胸甲时
  rationale: 保留希腊语同时性结构；ἐκδύειν在此按“脱下、剥下”处理，宾语为对方的胸甲。
- source_word: ἰδού
  choice: 看哪
  rationale: 保留叙事中突发转折和引人注意的语气，采用庄重而常见的圣经体表达。
- source_word: ἄνδρες ὀκτώ, ἑταῖροι αὐτοῦ
  choice: 他的八个同伴
  rationale: 按现代汉语自然语序合并同位结构；ἑταῖροι译为中性的“同伴”，不额外限定其关系。
- source_word: ἤρξαντο πολεμεῖν με
  choice: 开始与我交战
  rationale: 准确表达“开始”及持续战斗的动作；“交战”比“打我”更符合πολεμεῖν的战斗语义和本段语域。
