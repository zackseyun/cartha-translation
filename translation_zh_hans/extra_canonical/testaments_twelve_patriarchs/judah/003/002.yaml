  verdict: revise
  source_fidelity: “塔孚”遗漏希腊人名 Ταφούα 末尾的 -α 音；“正骑在马上时”将 καθήμενον（坐着）具体化为“骑着”，虽语境相近，却不如“坐在马背上”贴近原文。末句“众民”未明确表达 πάντα 的“全体”。
  naturalness: “至于”在此处略显话题转换，且“另一个王塔孚”缺少同位语停顿。以“至于另一位王——塔孚亚”或“另一位王塔孚亚”均自然；后者更简洁贴合叙事。
  terminology: “王”“杀了他”“四散”均适切。人名宜译作“塔孚亚”，以完整对应 Ταφούα；不应把“那匹马”译成“他的马”，因所属关系未明说。
