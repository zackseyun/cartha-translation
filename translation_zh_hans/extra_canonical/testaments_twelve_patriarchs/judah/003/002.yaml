  text: And the other king, Taphou, while he was sitting on the horse, I killed; and so I scattered all his people.
translation:
  language: zh_hans
  text: 另一位王塔孚亚正坐在马背上时，我杀了他；这样，我使他所有的民众四散。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν δὲ ἕτερον βασιλέα
  choice: 至于另一个王
  rationale: 以“至于”体现δέ所带的转接，并保留ἕτερον“另一个”的对比意味。
- source_word: τὸν Ταφούα
  choice: 塔孚
  rationale: 按希腊文人名Ταφούα作简洁音译；该形式在句中为宾格。
- source_word: καθήμενον ἐπὶ τοῦ ἵππου
  choice: 正骑在马上时
  rationale: 字面为“坐在马上”；现代汉语叙事中“骑在马上”自然表达其所处状态，同时不添加马的归属。
- source_word: ἀνεῖλον
  choice: 我杀了他
  rationale: 准确表达ἀναιρέω在此处“杀死、除掉”的明确暴力含义；补出宾语“他”以符合汉语表达。
- source_word: πάντα τὸν λαὸν αὐτοῦ διεσκόρπισα
  choice: 我使他的众民四散
  rationale: 保留πάντα的整体范围和αὐτοῦ的所属关系；“使……四散”体现及物动词διασκορπίζω。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文先提出对象、后述击杀及其结果的叙事推进；“马上”不译为“他的马上”，避免加入原文未明说的所有关系。
