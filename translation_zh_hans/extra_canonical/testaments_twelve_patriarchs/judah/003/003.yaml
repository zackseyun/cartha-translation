base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/003.yaml
  text: And I found Achor, a giant man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.
translation:
  language: zh_hans
  text: 我遇见亚割王；他是个巨人，骑在马上朝前朝后射箭。我跃起，拿起一块重六十利特拉[a]的石头，向那匹马掷去，击中了它，并杀死了它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利特拉”是古代重量单位；各地、各时期的实际重量并不完全相同。若按罗马利特拉估算，六十利特拉约合二十公斤。
    reason: 帮助现代读者理解重量，同时避免把古代单位换算得过于精确。
  - marker: b
    text: 原文末尾的“他”是阳性代词，最近可指那匹马，也可能回指亚割王；按句法顺序，指马较为自然。
    reason: 说明原文真实存在的代词指向歧义；正文按最近先行词译为马。
lexical_decisions:
- source_word: Ἀχὼρ βασιλέα
  choice: 亚割王
  rationale: 保留原文的人名与“王”这一称号；英译咨询文本漏译了“王”。
- source_word: γίγαντα
  choice: 巨人
  rationale: 直接表达身躯异常高大之人，保持原文简洁而有力的叙事语气。
- source_word: βάλλοντα τόξα
  choice: 射箭
  rationale: 该短语字面涉及投射弓箭，在语境中自然指放箭。
- source_word: ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  choice: 骑在马上向前向后射箭
  rationale: 完整保留英译咨询文本所省略的骑马以及向前、向后射箭的细节。
- source_word: λίθον ἑξήκοντα λιτρῶν
  choice: 一块重六十利特拉的石头
  rationale: 保留古代重量单位，避免在单位具体数值并不完全确定时作过度精确的现代换算。
- source_word: δέδωκα τῷ ἵππῳ
  choice: 击中那匹马
  rationale: “给到马”在此显然描述以石头打马；采用自然汉语表达动作结果。
- source_word: ἀπέκτεινα αὐτόν
  choice: 将其杀死
  rationale: 用“其”保留希腊文男性代词在指代上的一定含混，同时顺应最近先行词“马”。
theological_decisions:
- issue: 末尾代词 αὐτόν 的指代
  choice: 正文译作“将其杀死”，上下文优先指马，并以脚注说明歧义
  alternative: 明确译作“杀死了亚割王”或“杀死了那匹马”
  rationale: αὐτόν 在语法上可与阳性的“马”或亚割王相应；最近的对象是马，但不应完全抹去原文可能存在的指代张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。恢复希腊文中“王”“骑马”“向前向后”等信息，不以英译咨询文本的省略为准；古代单位采用音译并加解释。
