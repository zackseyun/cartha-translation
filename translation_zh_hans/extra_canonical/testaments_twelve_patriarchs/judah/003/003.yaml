revisions:
- from: 我遇见亚割王；他是个巨人，骑在马上向前向后射箭。我举起一块重六十利特拉[a]的石头，击中那匹马，将其杀死[b]。
  to: 我遇见亚割王；他是个巨人，骑在马上朝前朝后射箭。我跃起，拿起一块重六十利特拉[a]的石头，向那匹马掷去，击中了它，并杀死了它[b]。
  rationale: 修订仅校正两个叙事动作：将 ἀναλάμενος 译为“跃起”，并将对马施加石头的动作明确为“向那匹马掷去”。其余关键细节、古代重量单位及末尾代词的审慎脚注均予保留。
