  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/001.yaml
  text: And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I brought him down and so killed him.
translation:
  language: zh_hans
  text: 那时，迦南人的两位王身披铠甲，带着许多人来攻击我们的羊群；我独自跑向其中一位王[a]，把他的骨头撕碎了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中一位王”：此处希腊文本带有校勘疑问；也可较直译为“那一位王”。
    reason: 标示τὸν ἕνα的文本不确定性，同时保留其在上下文中最自然的含义。
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: 身披铠甲
  rationale: 准确表达身着护甲、全副武装的状态，也符合叙事的庄重语体。
- source_word: ἐπὶ τὰ ποίμνια ἡμῶν
  choice: 来攻打我们的羊群
  rationale: ἐπί在此表示敌对行动的目标；“攻打”比单纯“来到”更能传达语境中的袭击意味。
- source_word: λαὸς πολύς μετ᾽ αὐτῶν
  choice: 带着许多人
  rationale: 贴近希腊文，不把λαός过度具体化为军队或士兵。
- source_word: δραμὼν ἐπὶ τὸν βασιλέα
  choice: 冲向……王
  rationale: 兼顾δραμών的奔跑动作与ἐπί在敌对语境中的攻击方向。
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: 打碎了他的骨头
  rationale: 按所提供的希腊文本直译其猛烈毁伤骨头之意；不采用英文咨询层中原文未明说的“击打胫骨、将他打倒并杀死”。
