source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ⁴⁶ τὸν ὅρον, ἐμβάλλει⁴⁸ εἰς⁴⁹ τὸν νοῦν αὐτοῦ⁵⁰ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν⁵¹ καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι⁵³ τῇ ἀτιμίᾳ⁵⁴ καὶ νομίζειν εἶναι καλόν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/007.yaml
  text: But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and not feel shame, but rather boast in his dishonor and think it good.
translation:
  language: zh_hans
  text: 但他若越过限度，迷惑的灵就侵入他的心思，使醉酒者说下流话、行不法的事，不觉羞耻，反倒以自己的耻辱夸口，还认为这是好的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: 越过限度
  rationale: 直译“越过界限”，在现代汉语中“越过限度”自然清楚，也保留行为超过界限的含义；原文没有明确表达英文咨询层所补出的“继续下去直到”。
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: 把迷念投入他的心中
  rationale: 保留ἐμβάλλει“投入、置入”的主动意象；νοῦς兼具心思、思想与理解力之义，此处译“心中”较自然。为避免中文误读成“灵本身进入”，将隐含宾语按语境表为“迷念”。
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: 迷惑的灵
  rationale: πλάνη可指迷误、欺骗或偏离；“迷惑的灵”保留其人格化和属灵色彩，不将其具体化为某种教义体系。
- source_word: αἰσχρορρημονεῖν
  choice: 说可耻的话
  rationale: 表达粗鄙、羞耻或下流的言谈，采用普通读者易懂且庄重的措辞。
- source_word: παρανομεῖν
  choice: 行不法的事
  rationale: 保留“违背律法/法度”的核心语义，又不限定为现代刑法意义的违法。
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: 以自己的耻辱夸口
  rationale: 保留καυχᾶσθαι的“夸口、自豪”和ἀτιμία的“耻辱、不名誉”，呈现羞耻与夸耀之间的反差。
- source_word: νομίζειν εἶναι καλόν
  choice: 认为这是好的
  rationale: 保留指代对象在语法上的一定开放性；“这”可概括前述可耻失序的表现，而不擅自限定。
theological_decisions:
- issue: “迷惑的灵”如何作用于人的心思
  choice: 译为“迷惑的灵就把迷念投入他的心中”
  alternative: “迷惑的灵就进入他的心中”
  rationale: 希腊文以“迷惑的灵”为主语，动词ἐμβάλλει通常表示“投入”，而非不及物的“进入”；因此不采用英文咨询层较自由的“enters into his mind”，以免改变动作结构。
- issue: 醉酒者的责任与属灵影响之间的张力
  choice: 同时保留“迷惑的灵”的作用和醉酒者自身说话、行事、夸口、判断的动作
  alternative: 将所有行为完全归因于外在灵体，或完全心理化
  rationale: 原文同时呈现属灵诱导与人的实际行为，没有解释两者的责任关系，译文不作教义性消解。
translation_notes:
  register: 采用现代、庄重而通俗的书面普通话。句式紧凑，保留原文连续不定式构成的后果链条，并以“并且……反倒……还……”自然呈现递进与转折。
