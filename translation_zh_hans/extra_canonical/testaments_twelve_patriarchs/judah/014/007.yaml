revisions:
- from: 但他若越过限度，迷惑的灵就把迷念投入他的心中，使这醉酒的人说可耻的话、行不法的事，并且不觉羞耻，反倒以自己的耻辱夸口，还认为这是好的。
  to: 但他若越过限度，迷惑的灵就侵入他的心思，使醉酒者说下流话、行不法的事，不觉羞耻，反倒以自己的耻辱夸口，还认为这是好的。
  rationale: 修订仅处理迷惑之灵与心思之间的动作关系，删除译文自行补出的“迷念”，并作两处轻微的现代汉语措辞调整。其余连串后果、反转性的“反倒”以及“认为这是好的”的开放指向均予保留。
