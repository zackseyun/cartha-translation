  text: These two things turn a man's mind away.
translation:
  language: zh_hans
  text: 因为这两件事确实使人的心思偏离。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 保留原文的因果连接；本节显然承接上文所述内容。
- source_word: καίγε
  choice: 确实
  rationale: 表达该强调性组合所带的加强语气；中文不另译“也”，以免在缺少更广上下文时制造不自然或过度明确的递进关系。
- source_word: τὰ δύο ταῦτα
  choice: 这两样事
  rationale: 直接保留指向上文两项事物的复数表达。
- source_word: ἀφιστῶσι
  choice: 使……偏离正道
  rationale: 该动词表示使人离开、背离；补出“正道”使现代汉语自然，也传达未明说的规范性方向，但不具体限定其神学对象。
- source_word: τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: 人的心思
  rationale: διάνοια可指心智、思想或意念；“心思”在现代中文中自然，并保留其内在思考与意向层面。ἄνθρωπος泛指人，故译“人”而非特指男性。
theological_decisions:
- issue: 心思所偏离的对象未在本句明说
  choice: 译为“偏离正道”，不指定为“神”“律法”或其他对象
  alternative: 使人的心思转离；使人的心思离开神
  rationale: ἀφίστημι表达离开或背离，但本句没有明示离开什么。“正道”保留负面和规范性的语意，同时避免导入原文未明说的特定神学对象。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“确实”体现καίγε的强调；句式简洁，适合正文朗读。
