base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/002.yaml
  text: For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.
translation:
  language: zh_hans
  text: 因为若有人饮酒至醉，酒就以污秽的念头搅乱人的心智，使人的身体为享乐而发热，走向淫乱，并使人犯罪而不知羞愧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίῃ τις οἶνον εἰς μέθην
  choice: 人若喝酒直到醉酒
  rationale: 保留条件句及“达到醉酒程度”的方向性，现代汉语也自然清楚。
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  choice: 以污秽的念头
  rationale: διαλογισμοί指内心的思念、盘算；“念头”通俗自然，“污秽”保留其道德贬义。
- source_word: συνταράσσει τὸν νοῦν
  choice: 搅乱他的心智
  rationale: συνταράσσει有强烈扰乱之意；νοῦς兼指思想、理解与心智，译作“心智”避免仅限于情绪。
- source_word: εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: 使他的身体因情欲而发热，趋向淫乱
  rationale: 保留“加热身体”的形象，并以“趋向淫乱”表达εἰς πορνείαν的方向；ἡδονή在此语境中不是一般快乐，而是推动淫乱的肉体欲乐，故译“情欲”。
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: 犯下罪来
  rationale: 以现代汉语惯用表达传达“实行、做出这罪”，不额外限定罪的具体类别。
- source_word: οὐκ αἰσχύνεται
  choice: 毫不羞愧
  rationale: 准确表达否定与羞耻感的缺失；“毫不”自然强化原句直陈的效果。
theological_decisions:
- issue: 后半句动词主语的转换与歧义
  choice: 译为“他便犯下罪来”，将犯罪者理解为醉酒之人
  alternative: 可依表面近接主语译为“身体便犯罪”，或仿英文咨询层译为“它就犯罪”
  rationale: 希腊文πράσσει为单数，其语法主语可承接前文的τις（某人），也可能在修辞上近接τὸ σῶμα（身体）。但“不羞愧”通常指人，汉语若用“身体犯罪且不羞愧”会产生不必要的拟人化和指代混乱，因此恢复为“他”，同时不把该罪进一步解释为特定行为。
- issue: ἡδονή的伦理语境
  choice: 译作“情欲”
  alternative: “快感”或“享乐”
  rationale: 本句与身体发热、淫乱相连，“情欲”较能传达此处带性意味的欲乐；但未采用更具教派色彩的术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留醉酒引发思想混乱、身体欲望升温、继而犯罪且不羞愧的递进结构，并避免机械照搬英文咨询层中代词“it”造成的中文歧义。
