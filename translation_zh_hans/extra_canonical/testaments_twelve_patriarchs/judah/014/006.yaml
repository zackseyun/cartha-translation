base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/006.yaml
  text: 'For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink.'
translation:
  language: zh_hans
  text: 因为，孩子们，饮酒的人需要很强的判断力；饮酒的判断就在于：只要他仍有羞耻心，他就饮酒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他就饮酒”直译为“他饮酒”。希腊文动词为直陈式；在这句格言的语境中，也可理解为“他可以饮酒”或“就让他饮酒”，但正文保留其陈述形式。
    reason: 说明πίνει的直陈式形式，以及上下文可能带有的准则或许可性语用，不把其中一种解释强加于正文。
lexical_decisions:
- source_word: σύνεσις
  choice: 明辨力／明智之处
  rationale: 该词指理解、判断与审慎；前半句强调饮酒者所需的判断能力，后半句则指饮酒时明智的原则，依语境分别自然表达。
- source_word: αἰδώς
  choice: 羞耻心
  rationale: 保留该词所含的羞耻感、廉耻与自我约束意味；不直接译成“清醒”或“节制”，以免把原文的伦理张力解释掉。
- source_word: πίνει
  choice: 他便喝酒
  rationale: 希腊文形式通常是陈述语气“他喝”，因此正文保留陈述表达，不直接改成命令或许可语气。
theological_decisions:
- issue: 末句是在陈述饮酒行为，还是准许／劝告饮酒
  choice: 正文按希腊文陈述语气译为“他便喝酒”
  alternative: “就让他喝吧”或“他可以喝”
  rationale: πίνει通常是直陈式，而不是命令式；虽然上下文可使其带有准则或许可意味，但不在正文中替作者消除这一语法与语用上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“孩子们”保留父辈训诫的称呼；整体维持格言式语气，并避免把“羞耻心”解释性改写为某一特定的禁酒或节酒立场。
