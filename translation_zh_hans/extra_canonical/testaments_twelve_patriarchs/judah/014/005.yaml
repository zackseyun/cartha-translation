  text: Πιὼν³⁵ τὸν οἶνον³⁶ οὐκ ᾐσχύνθην³⁷ τὴν³⁸ ἐντολὴν τοῦ Θεοῦ, καὶ ἔλαβον γυναῖκα Χαναναίαν³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/005.yaml
  text: After drinking the wine, I was not ashamed of the command of God, and I took a Canaanite woman.
translation:
  language: zh_hans
  text: 喝了那酒以后，我不以神的命令为耻，并娶了一个迦南女子为妻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  choice: 喝了那酒以后
  rationale: 以时间性分词结构译出先后关系；定冠词用“那”体现，行文仍自然。
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: 我不以神的命令为耻
  rationale: 紧贴动词“感到羞耻”和宾语结构，不把原文略显反常的表达擅自解释为“不遵守”或“违背”，从而保留其歧义与张力。
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: 娶了一个迦南女子为妻
  rationale: λαμβάνω与γυνή在婚姻语境中自然译为“娶……为妻”；“一个”对应不定指，Χαναναίαν译为“迦南女子”。
theological_decisions:
- issue: “不以神的命令为耻”在上下文中的确切含义
  choice: 保留直译“不以神的命令为耻”
  alternative: 译作“不顾神的命令”或“违背了神的命令”
  rationale: 希腊文本本身采用“感到羞耻”一词，且否定式与宾语搭配形成难解张力；改译为“不顾”或“违背”会替原文作出解释，故不采用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那酒”体现原文定冠词；“娶……为妻”符合现代汉语叙事习惯。
