base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/004.yaml
  text: For behold, it also led me astray, so that I was not ashamed before the multitude of the city. For in the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.
translation:
  language: zh_hans
  text: 看哪，连我也被它引入歧途，以致我在城里的众人面前不知羞耻；因为我当着所有人的面转向她玛，犯下了大罪，又揭开了我儿子们污秽的遮盖[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我儿子们污秽的遮盖”：原文措辞晦涩，属格关系也不完全确定；可理解为“遮盖我儿子们的污秽”或“我儿子们不洁的遮盖”。这里保留原文“揭开—遮盖”的意象，不将其定解为某一种具体羞耻、性污秽或家族后果。
    reason: 说明末句希腊语属格关系及隐喻意义未定，避免正文作武断释义。
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留原文用于引起注意和加强语气的提示词，同时采用庄重而通行的现代汉语表达。
- source_word: ἐπλάνησεν
  choice: 迷惑了
  rationale: 表达使人误入歧途、受诱而偏离正道之意；主语在本节中未明说，因此保留“它”，不从上下文擅自补定。
- source_word: μὴ αἰσχυνθῆναι
  choice: 使我……不知羞耻
  rationale: 按结果或作用关系自然呈现不定式，同时保留道德羞耻层面的含义。
- source_word: ἐξέκλινα πρὸς τὴν Θαμὰρ
  choice: 偏向她玛
  rationale: “偏向”保留ἐκκλίνω偏离正路、转向某人的动态和道德意味，避免增译为原文没有明言的具体行为。
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: 揭开了我儿子们污秽的遮盖
  rationale: 尽量保留“揭开—遮盖”这一刻意而晦涩的原文意象，不把其可能涉及的羞辱、性污秽或家族后果单一化解释。
theological_decisions:
- issue: “它”所指为何
  choice: 保留未明确指代的“它”
  alternative: 按上下文明确译为某种情欲、邪灵或罪
  rationale: 本节希腊文本仅以动词第三人称单数表达施事，当前所给文本没有名词主语；为避免导入特定罪论或灵界解释，保留歧义。
- issue: 末句“我儿子们污秽的遮盖”的意义
  choice: 保留原文隐喻，并以脚注说明其晦涩
  alternative: 解释为“暴露了我儿子们的羞耻”或“玷污了我儿子们”
  rationale: 原文同时使用“揭开”和“遮盖”，且“污秽”与“我儿子们”的语法关系可产生不止一种理解；直译更能保存其神学与家族伦理张力。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语体。“城里的众人面前”自然传达城市群众的公开场合；分号保留前后因果推进。人名按常见圣经译名译作“她玛”。末句因原文本身高度凝缩而略显陌生，借脚注保留并解释其真实歧义。
