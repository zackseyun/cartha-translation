  text: Such is the wine-drinker, my children, because the drunkard respects no one.
translation:
  language: zh_hans
  text: 我的孩子们，嗜酒的人就是这样，因为醉酒的人谁也不尊重。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάροινος
  choice: 嗜酒的人
  rationale: 指惯于饮酒、沉溺于酒的人；译作“嗜酒的人”既保留其负面含义，也符合现代汉语表达。
- source_word: τέκνα μου
  choice: 我儿
  rationale: 保留父亲对子女的直接称呼；“我儿”简洁庄重，也可涵盖群体称呼。
- source_word: ὁ μεθύων
  choice: 醉酒的人
  rationale: 希腊语为实质化的现在分词，侧重处于醉酒或惯常醉酒状态的人；避免用过强的身份标签消解其语法动态性。
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: 谁也不尊重
  rationale: αἰδέομαι可含敬重、顾忌或因羞耻而有所收敛之意；此处“谁也不尊重”自然传达其人际伦理含义，同时保留“不把任何人放在眼里”的语势。
