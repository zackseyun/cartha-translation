  text: '*ἕως τῆς¹¹ παρουσίας Θεοῦ¹² τῆς δικαιοσύνης¹³, *τοῦ ἡσυχάσαι τὸν¹⁴ Ἰακὼβ¹⁵ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη¹⁴. 3. Καὶ αὐτὸς φυλάξει κράτος¹⁵ τῆς βασιλείας μου¹⁶ ἕως¹⁷ αἰῶνος¹⁸· ὅρκῳ γὰρ ὤμοσέ¹⁹ μοι Κύριος μὴ ἐξαλείψειν²⁰ τὸ βασίλειον ἐκ τοῦ σπέρματός μου ἕως αἰῶνος²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/001.yaml
  text: Until the coming of the God of righteousness, to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me by an oath not to blot out the kingdom. Much grief is mine, my children, because of the sexual immoralities and sorceries that you will do in the kingdom, following ventriloquists, omens, and deceiving demons.
translation:
  language: zh_hans
  text: 直到公义之神来临，好使雅各和万国都在平安中得享安息。他必永远保全我王国的权势；因为主曾向我起誓，必不从我的后裔中抹去这王国，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσίας
  choice: 来临
  rationale: 表达“来到、临在”的事件意义，语体庄重自然，又不额外限定具体方式。
- source_word: Θεοῦ τῆς δικαιοσύνης
  choice: 公义之神
  rationale: 保留希腊文属格结构及其可能的定性意味，不改释为较窄的“施行公义的神”。
- source_word: ἡσυχάσαι ... ἐν εἰρήνῃ
  choice: 安享太平
  rationale: 结合“安静、得安息”与“在和平中”两层含义，避免生硬重复。
- source_word: φυλάξει κράτος τῆς βασιλείας μου
  choice: 保守我王国的权柄
  rationale: φυλάσσω取“守护、保全”，κράτος取“权能、统治权”；“权柄”比单纯“力量”更贴合王国语境。
- source_word: ἐκ τοῦ σπέρματός μου
  choice: 从我的后裔中
  rationale: σπέρμα在谱系语境中指后裔；保留ἐκ所表达的王国与其后裔谱系之间的关系。
- source_word: ἕως αἰῶνος
  choice: 直到永远
  rationale: 保留原文惯用语的时间延续形式；虽与“永远”意义相近，但更贴近措辞。
theological_decisions:
- issue: αὐτός（“他”）的指代
  choice: 保留为“他”
  alternative: 明确译作“神”或“公义之神”
  rationale: 就所给片段而言，最自然的先行词是“公义之神”，但代词本身没有重复名词；保留代词可避免消除原文的指代张力。
- issue: “公义之神”的属格关系
  choice: 直译为“公义之神”
  alternative: “公义的神”或“施行公义的神”
  rationale: 原文可表达神以公义为特征，也可强调公义属于神；“公义之神”保留这种开放性。
- issue: 永续王权的范围
  choice: 译出“从我的后裔中”
  alternative: 依英语咨询层省略该短语
  rationale: 希腊文明确有ἐκ τοῦ σπέρματός μου；译出可忠实呈现应许与犹大后裔的关联，不进一步作宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万国”“权柄”“后裔”等词保留经文语体，但避免古奥表达。英语咨询层末尾关于淫乱、邪术等内容未见于本次所提供的希腊文片段，因此未纳入正文；反之，希腊文明确具有“从我的后裔中”和第二个“直到永远”，均据原文译出。
