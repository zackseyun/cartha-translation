  text: Τὰς θυγατέρας ὑμῶν μουσικὰς καὶ δημοσίας¹² ποιήσετε¹³, *καὶ ἐπιμιγήσεσθε¹⁴ ἐν βδελύγμασι ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/002.yaml
  text: You will make your daughters musicians and public women, and you will mingle with the abominations of the nations.
translation:
  language: zh_hans
  text: 你们会使自己的女儿成为乐师和妓女[a]，并与列国可憎之事混杂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妓女”所译的词字面意为“公共的、公开的〔女子〕”；这里按语境指公开供人淫乐的女子，并不特指现代意义上由官方许可的“公娼”。
    reason: 说明 δημοσίας 的字面语义和语境含义，避免引入原文未明说的现代制度性含义。
  - marker: b
    text: “与……混杂”也可理解为“在……之中混杂”或“参与”列国可憎之事。
    reason: 保留 ἐπιμιγήσεσθε ἐν βδελύγμασι ἐθνῶν 的关系和参与方式所具有的语义弹性。
lexical_decisions:
- source_word: μουσικὰς
  choice: 歌女
  rationale: 该形容词指从事音乐、歌舞的女子；结合其与“公娼”并列的贬抑语境，“歌女”比宽泛的“音乐家”更自然，也保留古代宴乐场合的可能含义。
- source_word: δημοσίας
  choice: 公娼
  rationale: 字面为“公共的女子”，在此与女性身份及道德谴责语境结合，委婉指公开供人淫乐的女子；“公娼”简洁而不把含义弱化为一般的“公众女性”。
- source_word: ποιήσετε
  choice: 使……成为
  rationale: 保留将女儿置于某种身份或处境中的使役意义。
- source_word: ἐπιμιγήσεσθε
  choice: 混在一起
  rationale: 该词有混合、交往或掺杂之意；译文保留其对象或参与方式上的一定含混，不专断限定为通婚。
- source_word: βδελύγμασι ἐθνῶν
  choice: 列国可憎之事
  rationale: βδέλυγμα表示令人憎恶、尤其在宗教与道德上可憎的事物或行为；“列国”对应ἐθνῶν，也符合庄重经文语体。
theological_decisions:
- issue: “列国可憎之事”是否特指偶像崇拜
  choice: 不将其明定为偶像崇拜
  alternative: 列国的偶像崇拜／列国可憎的礼俗
  rationale: 原文用宽泛的βδελύγμασι，可能涵盖异教礼俗、淫乱或其他可憎行为；译文保留这种神学与伦理范围上的张力。
- issue: ἐπιμιγήσεσθε是否特指与外族通婚
  choice: 译作“混在一起”
  alternative: 与列国的人通婚／掺和于列国的可憎之事
  rationale: 原文介词结构较不寻常，既可能表达与某事物混杂，也可能表达参与其中；不宜无文本根据缩窄为通婚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“歌女和公娼”保留原文并列的社会身份及强烈谴责色彩；“列国”维持犹太宗教文献的传统语域。所有脚注标记均已置于正文。
