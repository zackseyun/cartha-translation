reference: Testament of Judah 23:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἀνθ᾽ ὧν ἐπάξει²⁵ Κύριος ἐφ᾽ ὑμᾶς²⁶ λιμὸν καὶ λοιμόν¹⁹, θάνατον καὶ ῥομφαίαν, ἐκδικοῦσαν²⁰, πολιορκίαν, καὶ κύνας εἰς διασπασμόν²⁰, καὶ ἐχθρῶν ὀνειδισμοὺς²², καὶ ἀπώλειαν²² ἐχθρῶν, καὶ²⁴ σφακελισμὸν *ὀφθαλμῶν²⁴, καὶ νηπίων ἀναιρέσεις²⁵, *ὑπαρχόντων ἁρπαγὴν²⁶, ναῶν θεοῦ ἐμπρησμόν²⁹, γῆς ἐρήμωσιν²⁹, ὑμῶν δὲ αὐτῶν³⁰ δουλείαν ἐν ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/003.yaml
  text: Because of these things the Lord will bring upon you famine and pestilence, death and the avenging sword, siege, and the reproaches of enemies and friends. By foreigners my kingdom will be brought to an end.
translation:
  language: zh_hans
  text: 因这些事，主必使饥荒和瘟疫临到你们，也使死亡、施行报应的刀剑、围城之祸、犬只来撕碎你们、敌人的羞辱和毁灭[a]临到你们；他还要使你们双眼溃烂，使婴孩遭杀害，财物被抢掠，上帝的殿宇被焚烧，土地荒凉，而你们自己则在列国中为奴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敌人的……毁灭”中“敌人的”与“毁灭”的关系，原文并不完全确定；也可理解为“遭敌人毁灭”。
    reason: 希腊文ἀπώλειαν ἐχθρῶν中的属格可作主观或客观理解。上下文是一连串临到受众的灾祸，较倾向“来自敌人的毁灭”，但不能排除“敌人遭毁灭”的读法。
lexical_decisions:
- source_word: Ἀνθ᾽ ὧν
  choice: 因这些事
  rationale: 自然表达因果关系，并保留前文所述行为招致后果的含义。
- source_word: ἐπάξει ... ἐφ᾽ ὑμᾶς
  choice: 必使……临到你们
  rationale: 体现将来时和灾祸被带到受众身上的结构。
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: 施行报应的刀剑
  rationale: 保留分词“施行惩罚、报应”的主动含义，不将其弱化为普通战争。
- source_word: κύνας εἰς διασπασμόν
  choice: 把人撕碎的恶狗
  rationale: εἰς διασπασμόν表示撕裂、撕碎的结果或用途；补出泛指宾语“人”以符合现代汉语。
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: 双眼溃烂
  rationale: σφακελισμός指坏死、腐烂或类似严重病变；“溃烂”清楚而不过度医学化。
- source_word: νηπίων ἀναιρέσεις
  choice: 婴孩遭杀害
  rationale: ἀναίρεσις在此指夺去生命、杀害；用被动结构体现婴孩是受害者。
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: 财物被抢掠
  rationale: ὑπάρχοντα在此为所有物、产业；“财物”是普通读者易懂的对应表达。
- source_word: ναῶν θεοῦ ἐμπρησμόν
  choice: 上帝的殿宇被焚烧
  rationale: 保留ναῶν的复数形式，并以“殿宇”避免误读为单指一座建筑。
- source_word: δουλείαν ἐν ἔθνεσι
  choice: 在列国中为奴
  rationale: 保留奴役状态及身处外邦诸国之中的空间含义。
theological_decisions:
- issue: 灾祸的施行者与神的审判
  choice: 将主明确保留为整串灾祸的使役主体
  alternative: 淡化为灾祸自然发生或仅说主容许灾祸
  rationale: 希腊文ἐπάξει以“主”为主语，明确说主使这些灾祸临到受众；翻译不应削弱原文的神学张力。
- issue: “上帝的殿宇”复数
  choice: 按希腊文复数译为“上帝的殿宇”
  alternative: 按后期犹太传统语境单数化为“上帝的圣殿”
  rationale: 原文ναῶν为复数；即使这一表达在传统语境中显得不寻常，也不应擅自消除。
- issue: ἐχθρῶν修饰关系
  choice: 正文译作“敌人的羞辱和毁灭”，并用脚注保留第二个属格的歧义
  alternative: 直接断定为“敌人遭毁灭”或“遭敌人毁灭”
  rationale: 两个ἐχθρῶν均为属格，第二处既可理解为敌人是毁灭的对象，也可能在灾祸清单语境中表示源自敌人的毁灭；原文不足以完全消除歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。长串灾祸依照希腊文次序展开，并通过分号和重复使役结构减轻汉语句法负担。英文咨询层只保留了较短的异文式内容，且加入“朋友”和“我的国终结”等当前所给希腊正文没有的材料，因此本稿以完整希腊来源为准，未将这些内容纳入正文。
