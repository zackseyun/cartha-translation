revisions:
- from: '《犹大遗训》第15章


    1. 淫乱的人即使正被剥得一无所有，也察觉不到；即使正蒙受羞辱，也不觉得羞耻。2. 因为一个人纵然是君王，一旦淫乱，也会被剥夺王位，沦为淫乱的奴隶，正如我所遭遇的。3. 我交出了自己的杖，就是我支派的倚靠；交出了自己的腰带，就是我的力量；也交出了自己的王冠，就是我王权的荣耀。4. 我为这些事悔改以后，直到年老都不吃肉，也不喝酒，并且不享受任何欢乐。5. 上帝的天使又指示我：女人能制住君王，也能辖制穷人；她们夺去君王的荣耀、男人的力量，也夺去穷人在贫困中仅有的一点倚靠。[a]'
  to: '《犹大遗训》第15章


    1. 行淫乱的人，在被剥夺时却不自觉；在受辱时也不羞愧。2. 因为人即使是君王，若行淫乱，也会被剥夺王位，成了淫乱的奴隶，正如我所经历的。3. 我交出了我的杖，就是我支派的倚靠；交出了我的腰带，就是我的力量；也交出了我的王冠，就是我王权的荣耀。4. 我为这些事悔改以后，直到年老都不吃肉，也不喝酒，未曾享受任何欢乐。5. 上帝的天使指示我：女人对君王有掌控力，也辖制穷人；她们夺去君王的荣耀、男子的力量，也夺去穷人在贫困中仅有的一点倚靠。[a]'
  rationale: 修订只处理原文语义范围与现代汉语表达：第1节不把未限定的“被剥夺”扩展为“一无所有”；第5节分别呈现对君王的掌控与对穷人的辖制，并保留文本所列的三项损失。保留第4节“悔改”，因为其后长期禁戒使悔罪性的理解在此语境中稳妥。
