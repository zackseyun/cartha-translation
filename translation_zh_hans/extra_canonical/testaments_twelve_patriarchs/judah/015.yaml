  text: 1[a]. The man who commits sexual immorality, even while being ruined, does not perceive it; and while being dishonored, he is not ashamed. 2. For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered. 3[b]. I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom. 4. And although I repented concerning these things, I ate neither meat nor drank wine until my old age, and I saw no joy at all. 5. And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's very support.
translation:
  language: zh_hans
  text: '《犹大遗训》第15章


    1. 行淫乱的人，在被剥夺时却不自觉；在受辱时也不羞愧。2. 因为人即使是君王，若行淫乱，也会被剥夺王位，成了淫乱的奴隶，正如我所经历的。3. 我交出了我的杖，就是我支派的倚靠；交出了我的腰带，就是我的力量；也交出了我的王冠，就是我王权的荣耀。4. 我为这些事悔改以后，直到年老都不吃肉，也不喝酒，未曾享受任何欢乐。5. 上帝的天使指示我：女人对君王有掌控力，也辖制穷人；她们夺去君王的荣耀、男子的力量，也夺去穷人在贫困中仅有的一点倚靠。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半的希腊文结构十分紧缩，部分词语的衔接也不规则。这里按可辨认的三项损失译出：“君王的荣耀、男子的力量、穷人在贫困中仅有的一点倚靠。”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πορνεύσας / πορνεύῃ / πορνείᾳ
  choice: 淫乱／沦为淫乱的奴隶
  rationale: 用现代汉语中庄重而明确的道德用语表达不正当性行为；在奴役比喻中保留“奴隶”，呈现原文所强调的受辖制状态。
- source_word: γυμνούμενος
  choice: 正被剥得一无所有
  rationale: 原文是“被剥光、被剥夺”的形象，不宜依英语咨询层改作笼统的“毁掉”；此译既保留剥夺意象，也与下文被剥夺王位相呼应。
- source_word: γυμνοῦται τῆς βασιλείας
  choice: 被剥夺王位
  rationale: βασιλεία在这里指个人的王权或君王身份；“王位”比“国度”更符合上下文，同时保留被剥夺的被动意味。
- source_word: ῥάβδος / στήριγμα
  choice: 杖／倚靠
  rationale: “杖”兼具实物和支撑象征，随后以“倚靠”自然传达作者自己的解释。
- source_word: ζώνη
  choice: 腰带
  rationale: 采用普通现代用语，并让原文所附的象征解释“我的力量”保持突出。
- source_word: διάδημα
  choice: 王冠
  rationale: διάδημα特指王者佩戴的冠饰；中文“王冠”清楚自然，也保留其王权象征。
- source_word: μετανοήσας
  choice: 悔改以后
  rationale: 此处不仅涉及认知上的转变，随后的长期禁戒也使悔罪和改变生活方向的含义十分突出；“悔改”最贴合此语境。
- source_word: εὐφροσύνην οὐκ εἶδον
  choice: 不享受任何欢乐
  rationale: “看不见欢乐”在中文中容易被误解为观察不到；按希腊语习用法译为亲身不享受欢乐，同时保留绝对语气。
- source_word: κρατοῦσι / κατακυριεύουσιν
  choice: 制住／辖制
  rationale: 分别表达掌控和支配，避免把两个动词压平为同一个笼统的“统治”。
theological_decisions:
- issue: μετανοήσας在犹大自述中的含义
  choice: 悔改以后
  alternative: 改变心意以后
  rationale: 上下文是对淫乱之罪的回应，并以持续禁戒为其结果，因此悔罪性的“悔改”较单纯认知转变更准确；不过该分词本身可有改变心意的较宽泛含义。
- issue: 第5节有关女人辖制不同社会身份之人的警告
  choice: 按现存希腊语依次保留君王、男人和穷人的损失
  alternative: 概括为女人辖制君王和穷人，并夺去荣耀、力量和倚靠
  rationale: 原文语法压缩且传本痕迹复杂，但仍可辨认出“君王的荣耀”“男人的力量”和“穷人仅有的倚靠”三项；正文不将其改造成更整齐却缺乏明文支持的结构。
translation_notes:
  register: 采用现代、庄重、易懂的简体中文。保留“被剥夺—沦为奴隶—交出象征物”的连贯意象；第5节不沿用英语咨询文本中的“永远”，因为所给希腊文没有相应词语。
