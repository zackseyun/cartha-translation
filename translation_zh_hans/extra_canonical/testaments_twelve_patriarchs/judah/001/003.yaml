  text: ⌜Ἀκούσατε⁸, τέκνα μου, Ἰούδα τοῦ πατρὸς ὑμῶν· ἐγὼ τέταρτος υἱὸς ἐγενόμην⁹ τῷ πατρί μου Ἰακώβ¹⁰, καὶ Λεία¹¹ *ἡ μήτηρ μου¹² ἤμην, καὶ ἐπωνόμασέν¹³ με¹⁴ Ἰούδαν¹⁵, λέγουσα· Ἀνθομολογοῦμαι¹⁶ τῷ¹⁷ Κυρίῳ, ὅτι ἔδωκέν¹⁸ μοι¹⁹ καὶ²⁰ τέταρτον υἱόν.
