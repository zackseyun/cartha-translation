base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/003.yaml
  text: “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’
translation:
  language: zh_hans
  text: “我的孩子们，请听你们父亲犹大的话：我是父亲雅各的第四个儿子。母亲利亚给我取名叫犹大，说：‘我要称颂主，因为他又赐给我第四个儿子。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大”这一名字与“称颂、赞美”相关；利亚的话说明了取名的缘由。
    reason: 帮助现代读者看出译名本身无法直接呈现的命名文字关联。
lexical_decisions:
- source_word: Ἀκούσατε
  choice: 请听……的话
  rationale: 原文以命令式呼告子女聆听；汉语补出“话”，使“听你们父亲犹大”这一省略表达自然清楚。
- source_word: τέταρτος υἱὸς ἐγενόμην
  choice: 我是……第四个儿子
  rationale: 按汉语习惯表达出生次序，不机械译为“我成为第四个儿子”。
- source_word: ἐπωνόμασέν με Ἰούδαν
  choice: 给我取名叫犹大
  rationale: 准确表达命名动作，并采用通行人名译法。
- source_word: Ἀνθομολογοῦμαι
  choice: 我要称颂
  rationale: 该词在此表示向主献上感谢和赞美；“称颂”既庄重又保留与“犹大”命名缘由相关的赞美意味。
- source_word: Κυρίῳ
  choice: 主
  rationale: 保留希腊文的称谓，不额外指定或解释其所指。
- source_word: καὶ τέταρτον υἱόν
  choice: 又赐给我第四个儿子
  rationale: καί 在语境中有递进、增添之意，译为“又”符合利亚因再得一子而称颂的语气。
theological_decisions:
- issue: “主”的身份是否需要具体化
  choice: 保留为“主”
  alternative: 译作“上主”或直接使用神名
  rationale: 源文本仅用 Κύριος；不超出文本明确程度，避免加入特定传统的神名处理。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。开头补出“的话”以完成汉语句法；保留父亲临终训诫式的直接呼告。引语层级清楚，避免古奥措辞。
