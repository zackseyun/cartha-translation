  - severity: medium
    issue: “父亲说的每一句话”过度按字面处理κατὰ πάντα λόγον。
    rationale: 该介词短语在此表达“在每一件事上”的全面顺从，英语审计译文亦作“in every matter”；“凡事”更符合语境与原文范围。
  revised_text: 我年轻时很敏捷；凡事我都听从父亲。
