translation:
  language: zh_hans
  text: '犹大遗训：雅各和利亚的第四个儿子


    1 犹大所说的话的抄本，就是他在去世前对儿子们所说的话。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: 遗训
  rationale: 在《十二族长遗训》的文学语境中，指临终留下的训言；译作“遗训”比“约”更符合本段标题及下文内容。
- source_word: τοῦ τετάρτου υἱοῦ
  choice: 第四个儿子
  rationale: 忠实表达序数和亲属关系，同时采用自然的现代汉语措辞。
- source_word: Ἀντίγραφον
  choice: 抄本
  rationale: 基本义为抄录所得的副本或文本；“抄本”保留其文本传递意味，不扩写为“记录”。
- source_word: λόγων
  choice: 言语
  rationale: 保留“话语、言辞”的宽泛含义，并与后面的“所说的话”自然衔接。
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  choice: 临死前
  rationale: 以简洁自然的汉语表达“在他死去以前”，不增加关于死亡方式或具体时间的信息。
theological_decisions:
- issue: 标题中 Διαθήκη 的体裁含义
  choice: 遗训
  alternative: 遗嘱；约
  rationale: 本书以族长临终训言为体裁。“遗训”既体现临终背景，也避免把标题直接限定为法律遗嘱或神学意义上的盟约。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留标题与正文的区分；正文用“众子”简洁表达 τοῖς υἱοῖς αὐτοῦ，并避免补入原文没有的解释。
