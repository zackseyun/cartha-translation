  text: And when I had grown up, my father prayed for me, saying, ‘You shall be a king, prospering in all things.’
translation:
  language: zh_hans
  text: 我长大以后，父亲为我祷告，说：“你必成为君王，在凡事上亨通。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: 长大
  rationale: 该词在此表示成长、成熟；结合叙事语境，译作“长大”自然准确。
- source_word: ηὔξατό μοι
  choice: 为我祈求
  rationale: 按此处所据读法，动词表达向神祈愿、祷告，而非直接“祝福我”；与格 μοι 表示祈求所关涉或惠及的对象。
- source_word: Βασιλεὺς ἔσῃ
  choice: 你必成为君王
  rationale: 保留表语“君王”和将来时的预告语气；“成为”比单纯“是”更符合现代汉语。
- source_word: κατευοδούμενος
  choice: 顺利
  rationale: 该分词有道路通达、进展顺遂之意；在“凡事”这一范围中译为“顺利”简洁自然。
- source_word: ἐν πᾶσιν
  choice: 凡事
  rationale: 概括其开放性的全面范围，不擅自限定为事业、争战或治理。
theological_decisions:
- issue: 父亲所作之事是祷告还是祝福
  choice: 为我祈求
  alternative: 祝福我
  rationale: 优先依照希腊文本 ηὔξατό μοι 的祈愿/祷告义，避免把行动改写为父亲直接施予祝福。
- issue: 君王之语是预言、应许还是祈愿内容
  choice: 以直接引语保留“你必……”
  alternative: 愿你成为君王
  rationale: λέγων 后的 Βασιλεὺς ἔσῃ 是直陈式将来表达；译文保留其断言式语气，不额外判定其神学性质。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“君王”较“国王”更适合古代族长语境；整体保持原文简洁，不补入“神”作为祈求对象，也不解释“凡事”的具体范围。
