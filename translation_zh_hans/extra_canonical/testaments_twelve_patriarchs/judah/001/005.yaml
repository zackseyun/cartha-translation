- source_word: ἐτίμων
  choice: 尊敬
  rationale: 该动词为未完成时，语境中表示持续或惯常地给予尊荣；中文以“尊敬”自然表达，其持续意味由叙事语境承载。
- source_word: τὴν ἀδελφὴν τῆς μητρός μου
  choice: 姨母
  rationale: 希腊语直译为“我母亲的姐妹”；现代汉语亲属称谓“姨母”准确、简洁，并保留其为母系姐妹而未进一步指定长幼。
