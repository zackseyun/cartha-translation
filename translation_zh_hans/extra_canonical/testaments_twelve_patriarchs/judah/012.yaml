  text: 1[a]. After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal adornment and sat in Enaim, at the city gate of the inn. 2. For it was a law of the Amorites that a widow should sit there openly for prostitution. 3. So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment. 4[b]. And turning aside to her I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived. 5. But I, not knowing what I had done, wanted to kill her. Yet she sent the pledges secretly and put me to shame. 6. And when I called her, I heard also the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord. 7. For I said, “Perhaps she did this deceitfully,
    having received the pledge from another.” 8. But I did not approach her again for the rest of my life, because I had done this abomination in all Israel. 9. Yet those in the city said that there had been no harlot sitting at the gate, because she had come from another place and sat for a short time at the gate. 10. And I supposed that no one knew that I had gone in to her. 11. And after this we came into Egypt to Joseph because of the famine. 12. Now I was forty-six years old[d][c], and I spent seventy-three years in Egypt.
translation:
  language: zh_hans
  text: '《犹大遗训》第十二章


    1. 此后，他玛守寡两年，听说我要上去剪羊毛，便用新娘的装饰打扮自己，坐在以楠城的城门旁[a]。2. 因为亚摩利人有一条律法：守寡的妇人要在城门旁坐七天[b]。3. 那时我喝酒醉了，没有认出她；她借着装扮所显出的美貌迷惑了我。4. 我转到她那里，说：“我要到你这里来。”她说：“你要给我什么？”我就把我的杖和冠冕交给她作抵押[c]。我与她同寝，她便怀了孕。5. 我不知道自己所做的事，后来竟想杀她；她却暗中把抵押之物送回，使我羞愧。6. 我把她叫来，又听见了那些隐秘的话[d]，就是我醉酒时与她同寝所说过的话。我不能杀她，因为这事出于主[e]。7. 我当时说：“或许她用了诡计，从别人那里拿到抵押之物，又拿先前那些话来对我说。”8. 但此后直到我一生的尽头，我再没有亲近她。9. 城里的人也说，城门那里并没有人坐着从事淫业[f]，因为她是从别处来的，只在城门那里坐了一会儿。10. 我以为没有人知道我曾到她那里去。11. 此后，因为饥荒，我们来到埃及投奔约瑟。12. 那时我四十六岁；我在埃及度过了七十三年。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所据希腊文本作“在以楠城、靠近城门”，没有“客店”一词。抄本传统及其他重构文本在此有差异；本译文依所提供的希腊本文翻译。
    reason: textual_variant
  - marker: b
    text: 本节所据希腊文本明确作“坐七天”，并未出现“卖淫”一词。其他文本传统有不同读法。
    reason: textual_variant
  - marker: c
    text: 本节所据希腊文本只列“杖”和“冠冕”，没有“戒指”，也没有“我的国”一语。译文保留本见证，不按《创世记》的叙述增补或调和。
    reason: textual_variant
  - marker: d
    text: “隐秘的话”也可理解为“私下说的话”。希腊语句法略显生硬，所指是犹大醉酒时说过、后来由他玛复述的话。
    reason: lexical_alternative
  - marker: e
    text: “这事出于主”把事情归于主的作为或护理，却没有说明这是主的命令、许可、审判，还是主对事件的掌管；译文保留这种张力，并不表示主认可其中的行为。
    reason: theological_tension
  - marker: f
    text: 此处希腊词形罕见，文本也可能有传抄问题；按上下文译作“有人坐着从事淫业”，但确切含义并不完全确定。
    reason: lexical_uncertainty
lexical_decisions:
- source_word: χηρευούσης / χηρεύουσαν
  choice: 守寡／守寡的妇人
  rationale: 表达丧偶后的持续身份和社会处境；现代汉语自然，也不额外说明丈夫死亡的方式。
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: 用新娘的装饰打扮自己
  rationale: 保留原文同根词反复所强调的刻意装扮，并明确 νυμφικός 的新娘性质。
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: 坐在以楠城门旁
  rationale: 依所给希腊本文直译地点关系，不从英语咨询层引入本文没有的“客店”。
- source_word: προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην
  choice: 要在城门旁坐七天
  rationale: 所给本文含“七天”而无“卖淫”用语，因此按现存词句翻译，不以其他文本传统替换。
- source_word: οὐκ ἐπέγνων αὐτήν
  choice: 没有认出她
  rationale: 上下文指因装扮和醉酒而未能辨认身份，不是“认识”的性委婉语。
- source_word: ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: 她借着装扮所显出的美貌迷惑了我
  rationale: 兼顾美貌、装扮的外观及迷惑作用，形成自然的现代汉语。
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: 转到她那里
  rationale: 保留犹大偏离原路、转向她的动作，不过度加入道德评断。
- source_word: Εἰσέρχομαι πρὸς σε
  choice: 我要到你这里来
  rationale: 保留原文含蓄的性用语；紧接的“同寝”使现代读者能从上下文理解。
- source_word: ῥάβδον ... διάδημα
  choice: 杖和冠冕
  rationale: 严格按所给希腊本文的两件抵押物翻译；διάδημα 是象征尊荣或王权的冠带，译作“冠冕”符合庄重语体。
- source_word: ἀρραβών
  choice: 抵押／抵押之物
  rationale: 在此指为履约而交出的担保物；“抵押”比现代经济色彩较强的“保证金”更适合叙事。
- source_word: οἱ ... τελεσικόμενον
  choice: 从事淫业的人
  rationale: 该词形罕见且可能讹传；结合城门、伪装和全章情境作谨慎的语境翻译，并以脚注标明不确定性。
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα εἰς Αἴγυπτον
  choice: 我在埃及度过了七十三年
  rationale: ποιεῖν 与时间长度连用可表示度过；介词短语表明这段年日在埃及。
theological_decisions:
- issue: 第6节 παρὰ Κυρίου ἦν 的神学指向
  choice: 因为这事出于主
  alternative: 因为这是主的旨意／因为这是主所促成的
  rationale: 原文把事件与主相连，却未界定为命令、认可、许可、审判或护理。“出于主”保留因果与来源语言，同时用脚注避免把叙述误读为对行为的道德认可。
- issue: 第4节 διάδημα 的王权色彩
  choice: 保留“冠冕”
  alternative: 按《创世记》调和为“带子”或泛化为“饰物”
  rationale: 本希腊见证确有王权意味较强的 διάδημα；即使它与《创世记》不同，也不应静默调和。
- issue: 第7节犹大对他玛是否欺骗的怀疑
  choice: 保留“或许”及完整推测
  alternative: 把她的行为直接断定为欺骗
  rationale: μήποτε 表明这是犹大的猜疑，不是叙述者对他玛动机的定论。
