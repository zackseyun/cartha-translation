  register: 采用现代、庄重而易懂的叙事汉语，以第一人称保留遗训体。性行为相关表达不过分直露，也不以古奥委婉语遮蔽含义。翻译以用户提供的希腊语 α 栏本文为准；英语 POB 仅作核查层，凡其内容与本希腊本文不符之处均未直接移入正文。
