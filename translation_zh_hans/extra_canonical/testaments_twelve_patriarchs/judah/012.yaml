- from: '《犹大遗训》第十二章


    1. 此后，他玛守寡两年，听说我要上去剪羊毛，便用新娘的装饰打扮自己，坐在以楠城门旁[a]。2. 因为亚摩利人有一条规矩：守寡的妇人要在城门旁坐七天[b]。3. 那时我喝酒醉了，没有认出她；她借着装扮所显出的美貌迷惑了我。4. 我转到她那里，说：“我要到你这里来。”她说：“你要给我什么？”我就把我的杖和冠冕交给她作抵押[c]。我与她同寝，她便怀了孕。5. 我不知道自己所做的事，后来竟想杀她；她却暗中把抵押之物送来，使我羞愧。6. 我把她叫来，又听见了那些隐秘的话[d]，就是我醉酒与她同寝时说过的话。我不能杀她，因为这事出于主[e]。7. 我当时说：“或许她用了诡计，从别人那里拿到抵押之物，又拿先前那些话来对我说。”8. 但此后直到我一生的尽头，我再没有亲近她。9. 城里的人也说，城门那里并没有从事淫业的人[f]，因为她是从别处来的，只在城门那里坐了一会儿。10. 我以为没有人知道我曾到她那里去。11. 此后，因为饥荒，我们来到埃及投奔约瑟。12. 那时我四十六岁；我在埃及度过了七十三年。


    [a] 本节所据希腊文本作“以楠城门旁”，没有“客店”一词。抄本传统及其他重构文本在此有差异；本译文依所提供的希腊本文翻译。

    [b] 本节所据希腊文本明确作“坐七天”，并未出现“卖淫”一词。其他文本传统有不同读法。

    [c] 本节所据希腊文本只列“杖”和“冠冕”，没有“戒指”，也没有“我的国”一语。译文保留本见证，不按《创世记》的叙述增补或调和。

    [d] “隐秘的话”也可理解为“私下说的话”。希腊语句法略显生硬，所指是犹大醉酒时说过、后来由他玛复述的话。

    [e] “这事出于主”把事情归于主的作为或护理，却没有说明这是主的命令、许可、审判，还是主对事件的掌管；译文保留这种张力，并不表示主认可其中的行为。

    [f] 此处希腊词形罕见，文本也可能有传抄问题；按上下文译作“从事淫业的人”，但确切含义并不完全确定。'
