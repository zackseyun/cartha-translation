  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/004.yaml
  text: For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, he showed me an immense amount of gold in the name of his daughter, for he was a king.
translation:
  language: zh_hans
  text: 因为我曾对岳父说：“我要先和父亲商议，然后再娶你的女儿。”但他不肯，反而向我展示了以他女儿的名义给出的、数不胜数的黄金，因为他是王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλεύσομαι τῷ πατρί μου
  choice: 我要先和父亲商议
  rationale: 中间语态在此表达与父亲商议、征询其意见；加入“先”自然呈现随后由καὶ οὕτως表达的次序。
- source_word: λήψομαι τὴν θυγατέρα σου
  choice: 再娶你的女儿
  rationale: λαμβάνω与女子作宾语时按婚姻语境译为“娶”，而非字面的“带走”。
- source_word: εἰς δόσιν αὐτῆς
  choice: 以他女儿名义所给的
  rationale: 原短语文本及语义不够明确，可能涉及因女儿而给出的财物；采用较贴近字面的表达，不擅自判定为嫁妆、聘礼或赠礼。
- source_word: χρυσίου πλῆθος ἄπειρον
  choice: 多得无法计数的黄金
  rationale: 兼顾πλῆθος的数量众多和ἄπειρον的无边、不可胜数之意，以自然汉语表达其夸张力度。
- source_word: Βασιλεὺς γὰρ ἦν
  choice: 因为他是个王
  rationale: 保留γάρ所示的解释关系，并以“王”对应βασιλεύς。
