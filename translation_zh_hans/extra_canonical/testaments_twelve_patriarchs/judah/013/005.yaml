  text: And he adorned her with gold and pearls, and made her pour wine for us at the banquet.
translation:
  language: zh_hans
  text: 他用黄金和珍珠妆饰她，又让她在宴席上以女子的美丽[a]为我们斟酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以女子的美丽”直译希腊语ἐν κάλλει γυναικῶν，字面为“在女子的美丽中”。此处表达不甚明确，也可能指女子的美貌、仪态或华美装束。
    reason: 保留原文不寻常的表达及其词义范围，避免将其限定为单一的外貌、姿态或服饰含义。
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: 装扮
  rationale: 该词在此指用饰物妆饰、装点人；“装扮”比单纯“装饰”更符合以金饰和珍珠打扮女子的语境。
- source_word: ἐν χρυσίῳ καὶ μαργαρίταις
  choice: 用金饰和珍珠
  rationale: χρυσίον可指黄金或金制饰物；结合装扮人物的语境，译作“金饰”自然且具体。
- source_word: οἰνοχοεῖν ἡμῖν
  choice: 为我们斟酒
  rationale: οἰνοχοεῖν指倒酒、侍酒；“斟酒”是现代汉语宴席语境中准确而自然的表达。
- source_word: ἐν τῷ δείπνῳ
  choice: 在宴席上
  rationale: δεῖπνον可指晚餐或筵席；此处有侍酒情景，“宴席”更贴合上下文。
- source_word: ἐν κάλλει γυναικῶν
  choice: 以女子的美态
  rationale: 直译并保留原文不寻常而含混的表达，不擅自限定为衣着、容貌或某种特定礼仪装束。
