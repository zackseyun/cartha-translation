  text: Ἐπεὶ γὰρ καὶ ἐγώ¹⁸ ἐγκαυχησάμενος¹⁹ ὅτι ἐν πολέμοις²⁰ †ἠπάτησέ με²¹ πρόσωπον γυναικὸς εὐμόρφου²²,
