  text: Because I boasted that in wars the face of a beautiful woman had not deceived me,
translation:
  language: zh_hans
  text: 因为我也曾夸口说，在征战中，美貌女子的容颜未曾[a]迷惑我，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄传下来的希腊文本在此作“迷惑了我”，且校本以符号标明文字可能有讹误；按上下文，原句很可能原有否定词，意为“未曾迷惑我”。
    reason: 原文存在实质性的文本疑难；正文需形成可理解的句子，同时不能隐去异读及校勘判断。
lexical_decisions:
- source_word: ἐγκαυχησάμενος
  choice: 曾夸口
  rationale: 表达分词所指的先行动作及自夸语气；“也”另对应 καί。
- source_word: ἐν πολέμοις
  choice: 在征战中
  rationale: 比直译“在战争中”更自然，并保留复数 πολέμοις 所涵盖的多次战事或战场经历。
- source_word: πρόσωπον γυναικὸς εὐμόρφου
  choice: 美貌女子的容颜
  rationale: πρόσωπον 是“脸、容颜”，εὐμόρφου 表示形貌美丽；此译保留原句以容貌为迷惑主体的表达。
- source_word: ἠπάτησέ με
  choice: 未曾迷惑我
  rationale: 抄传文本表面作“迷惑了我”，但原文以匕首号标示此处有讹误；结合“夸口”的语境和句意，正文采用通常推定的否定读法，同时以脚注明确交代。
