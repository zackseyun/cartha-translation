source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, ἀκούσατε *Ἰούδα¹ τοῦ πατρὸς ὑμῶν⁷² καὶ φυλάξασθε⁹ τοὺς λόγους μου¹⁰ τοῦ ποιεῖν⁷ πάντα¹¹ τὰ δικαιώματα Κυρίου¹³ καὶ ὑπακούειν¹⁴ ἐντολαῖς⁵ Θεοῦ¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/001.yaml
  text: 'And now I command you, my children: listen to Judah, your father, and keep my words in your hearts, to do all the righteous commands of the Lord and to obey the commands of God.'
translation:
  language: zh_hans
  text: 现在，我吩咐你们，我的孩子们：要听从你们的父亲犹大，谨守我的话，遵行主的一切律例，听从上帝的诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: 吩咐
  rationale: 表达带有权威的直接嘱咐，符合父亲临终训诫的语境，又不过度强化为正式颁令。
- source_word: ἀκούσατε
  choice: 听从
  rationale: 此处不仅指听见，也包含接受并服从父亲训诫之意；现代汉语用“听从”自然贴切。
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: 谨守我的话
  rationale: 保留 φυλάσσω 所含守护、持守并遵行的意味；原文未出现“在心里”，因此不补入该成分。
- source_word: δικαιώματα
  choice: 律例
  rationale: 该词在宗教语境中常指上帝所定的规条或法度；“律例”比“公义的命令”更贴近其名词性质，也避免把词义拆解成形容词加名词。
- source_word: ὑπακούειν
  choice: 听从
  rationale: 体现顺服命令的含义，并与现代汉语搭配自然。
- source_word: ἐντολαῖς
  choice: 诫命
  rationale: 采用庄重且通行的宗教用语，准确表达带权威的命令。
theological_decisions:
- issue: δικαιώματα Κυρίου 与 ἐντολαῖς Θεοῦ 的平行表达
  choice: 分别译为“主的一切律例”和“上帝的诫命”
  alternative: 将两者统一译作“命令”
  rationale: 保留原文“主／上帝”及“律例／诫命”的词汇差异，不把平行结构过度同一化，也不据此推导额外的神学区分。
- issue: τοῦ ποιεῖν 所表达的关系
  choice: 以并列目的性动作“遵行”呈现
  alternative: 译为“为要遵行”
  rationale: 希腊文不定式说明谨守训言所指向的实践；汉语直接接“遵行”更流畅，同时保留目的和结果之间的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的训诫语体。保留犹大以第三人称自称“你们的父亲犹大”的原文表达；不沿用英文咨询文本中缺乏所给希腊文依据的“在你们心里”。
