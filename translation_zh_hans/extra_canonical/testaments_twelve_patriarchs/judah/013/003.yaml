  text: καὶ ὠνείδιζον²³ Ῥουβὶμ τὸν ἀδελφόν μου²⁴ περὶ Βάλλας γυναικὸς τοῦ πατρός μου²⁵, καὶ τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας²⁶ παρετάξατο²⁷ ἐπ᾽ ἐμέ²⁸, ἕως οὗ συνετέλεσα εἰς †τὴν Χανανανίτην³² καὶ εἰς Θαμὰρ ³³τὴν νύμφην³⁴ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/003.yaml
  text: and I reproached Reuben my brother concerning Bilhah, my father’s wife, and the spirit of jealousy and sexual immorality arrayed themselves against me, until I completed it with Anan the Canaanite woman and with Tamar my daughter-in-law.
translation:
  language: zh_hans
  text: 我曾因父亲的妻子辟拉之事责备我的兄弟流便；可是，嫉妒和淫乱的灵列阵攻击我，直到我在那迦南女子[a]和我儿媳他玛的事上走到了尽头。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那迦南女子”：此处希腊文本有疑难；现存措辞只称她为“迦南女子”，没有清楚写出姓名。
    reason: 解释底本的十字符号及英语咨询层所见专名与希腊文本之间的差异。
  - marker: b
    text: “走到了尽头”：希腊文直译近于“完成了”或“做到了底”。本句所指带有淫乱的语境，但原词没有直接写“犯罪”。
    reason: 保留 συνετέλεσα εἰς 的语义含蓄和不寻常搭配，避免无提示地作过度明确的诠释。
lexical_decisions:
- source_word: ὠνείδιζον
  choice: 我曾……责备
  rationale: 未完成时表示过去持续或反复的责备；汉语以“曾”配合语境自然表达，不把动作过度限定为一次。
- source_word: τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: 嫉妒和淫乱的灵
  rationale: 保留单数“灵”统摄两个属格名词的结构；“淫乱”准确传达 πορνεία 的性道德含义。
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: 列阵攻击我
  rationale: 保留军事性意象“列阵”，并用“攻击”自然表达 ἐπί 所指的敌对方向。
- source_word: συνετέλεσα εἰς
  choice: 在……的事上走到了尽头
  rationale: συντελέω 基本义为完成、做到底；此处与 εἰς 的搭配不寻常，译文保留含蓄和张力，不直接增译为“犯罪”或明确的性行为。
- source_word: τὴν Χανανανίτην
  choice: 那迦南女子
  rationale: 按所给希腊文本翻译为带定冠词的族属称谓，不采纳英语咨询层中原文无明确对应的专名“Anan”。
- source_word: τὴν νύμφην μου
  choice: 我儿媳
  rationale: 在她玛与犹大的亲属关系语境中，νύμφη 指儿媳；现代汉语用“儿媳”清楚自然。
theological_decisions:
- issue: “嫉妒和淫乱的灵”的主体数量
  choice: 按希腊文译作单数“灵”
  alternative: 译作复数“诸灵”或使动词采用复数主体
  rationale: 希腊文冠词、名词和动词均为单数，两个属格概念共同修饰同一个“灵”；不依据英语层的复数反身代词改动。
- issue: 是否明确说犹大“犯罪”或与两名女子发生性关系
  choice: 译为“在……的事上走到了尽头”并加注说明
  alternative: “直到我与……犯了罪”或“直到我与……行淫”
  rationale: 上下文带有明确负面和性道德色彩，但 συνετέλεσα 本身是“完成、做到底”，并未明说“犯罪”；保留原文的委婉与文本张力。
- issue: 迦南女子是否应补出姓名
  choice: 不补姓名
  alternative: 依英语 POB 译为“迦南女子亚难（Anan）”或依叙事传统补作其他姓名
  rationale: 所给希腊文只有“那迦南女子”，且该处有文本疑难标记；不从咨询层或外部传统引入专名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“辟拉、吕便、她玛”使用常见中文圣经人名形式；“列阵攻击”刻意保留原文军事隐喻。分号呈现“责备兄弟”与“自己反受攻击并走向失败”之间的反转。
