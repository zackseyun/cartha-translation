  text: '1. And after this there came to us a greater war toward the south than the one at Shechem; and when I had drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.

    2. And I went up upon the wall and killed their king.

    3. And so we set Hebron free and took all the captives.

    4. But the rest fled.

    5. Then my father Jacob killed Belisath, king of all the kings, a man giant in strength, twelve cubits high.

    6. And terror fell upon them, and they stopped making war against us.

    7. Therefore my father was without anxiety in the wars while I was with my brothers.

    8. For he saw in a vision concerning me that an angel of power went along with me in all things, so that no one might touch me.'
translation:
  language: zh_hans
  text: '《犹大遗训》第4章


    1 此后，我们在示剑以南发生了一场战争。我和弟兄们列阵迎战，追赶一千人，杀了其中二百人，又杀了四个王。


    2 我登上城墙，杀了他们的王[a]，并俘获了所有被掳者。


    3 第二天，我们前往阿雷塔；那是一座坚固的城，扬言要置我们于死地。我和迦得从城的东面发动进攻，吕便和利未则从城的西面进攻。就这样，我们解救了被掳者。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的王”：此处希腊文本带有文本存疑标记，但现存读法的意思清楚。
    reason: 底本在τὸν βασιλέα αὐτῶν前保留匕首号，表明此处存在文本问题；正文按现存读法翻译，并以脚注提示读者。
lexical_decisions:
- source_word: κατὰ νότον τοῦ ἐν Σικίμοις
  choice: 在示剑以南
  rationale: 按现存希腊文表达地理方位；不采纳英语咨询层中原文没有的比较级“更大的战争”。
- source_word: παραταξάμενοι
  choice: 列阵迎战
  rationale: 保留军事语境中的列阵、摆开阵势之意，同时使现代汉语自然。
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: 所有被掳的人
  rationale: αἰχμαλωσία可指被掳者的整体，也可涉及掳获物；结合第3节“解救”这些人的语境，此处采用集合意义的“被掳的人”。
- source_word: Ἀρετάν
  choice: 阿雷塔
  rationale: 按希腊文地名音译，不以英语咨询层中未见于本段希腊底本的“希伯仑”替换。
- source_word: προσέφθημεν
  choice: 抢先……进攻
  rationale: 该动词含先到、抢先之意；结合从东西两面攻城的上下文，以“抢先进攻”传达行动含义。
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: 解救了被掳的人
  rationale: 直译其释放、使自由的动作，并与本节的攻城结果相符。
theological_decisions:
- issue: 英语咨询层与所给希腊文范围及内容明显不一致
  choice: 仅翻译现存希腊文所载的三节，并依希腊文叙事内容措辞
  alternative: 依英语咨询层扩写为八节，并加入希伯仑、雅各、异象和天使等内容
  rationale: 原语言证据优先；英语层在第2节以后包含本段所给希腊文没有的材料，也遗漏阿雷塔之战，因此不可作为不透明底本补入。
- issue: 第1节战争的比较关系
  choice: 译作地理方位“在示剑以南”
  alternative: 译作“比示剑那场更大的战争”
  rationale: 所给希腊文没有“大于、更大”的比较词；保留可由现存句法直接支持的方位意义，避免补造比较。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；人名按常见圣经译名处理（迦得、吕便、利未），未有固定常用译名的Ἀρετά音译为“阿雷塔”。保留战事叙述的简洁力度，不美化或弱化暴力内容。
