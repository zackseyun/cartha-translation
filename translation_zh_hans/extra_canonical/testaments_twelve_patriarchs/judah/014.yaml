lexical_decisions:
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: 使人的心思偏离真理
  rationale: διαστρέφει含扭曲、转离之意；此处用“偏离”自然表达酒使心思离开真理的道德方向，同时不把它弱化为单纯认知错误。
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: 激起欲望的怒火
  rationale: 原短语凝缩且语义不寻常；保留ὀργή的强烈、炽烈意象及ἐπιθυμία的欲望含义，不擅自限定为愤怒或性欲，并以脚注标明困难。
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: 淫乱之灵
  rationale: 直译πνεῦμα并保留其位格化张力；πορνεία在本段指性方面的不道德行为，用“淫乱”符合庄重的劝诫语域。
- source_word: ἀφιστῶσι τὴν διάνοιαν
  choice: 使人的心智偏离正道
  rationale: ἀφίστημι表示使离开；διάνοια涵盖心思与道德判断力。“心智”兼顾认知和意志层面，“正道”是为中文补足偏离的隐含方向，而不改变核心意思。
- source_word: συνταράσσει τὸν νοῦν
  choice: 搅乱你的心思
  rationale: συνταράσσει语气强，表示彻底扰乱；译文也保留希腊文由泛指“人”突然转用第二人称“你的”这一不规则转换。
- source_word: πάροινος
  choice: 沉迷于酒的人
  rationale: 该词指惯常受酒支配或纵酒的人；“沉迷于酒”比单纯“饮酒者”更准确，也与后文明确的“醉酒的人”有所区别。
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: 谁也不放在眼里
  rationale: 此习语兼有不尊重他人及失去社会道德约束之意；该中文表达自然地传达这种无所顾忌。
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: 揭开了我儿子们污秽的遮盖
  rationale: 原文意象晦涩，主体所属关系也不易确定；正文尽量贴近词面，避免直接断定是家族羞耻、性暴露或其他具体所指。
- source_word: πολλὴ ... ἡ σύνεσις τῆς οἰνοποσίας
  choice: 饮酒的人需要有极大的明辨力
  rationale: 现存希腊文句法似有省略；结合紧接的“饮酒的明辨”译出隐含的“需要”，用“明辨力”突出σύνεσις的实践判断与自制意味。
- source_word: αἰδώς
  choice: 羞耻
  rationale: 本章反复以是否知耻衡量醉酒造成的道德失控；统一译为“羞耻”以保留关键词的重复。
- source_word: αἰσχρορρημονεῖν
  choice: 说可耻的话
  rationale: 该动词指说出粗鄙、羞耻或不体面的话；此译保持行为内容，不误译成仅仅“毫无羞耻地说话”。
theological_decisions:
- issue: 如何理解并表达“淫乱之灵”与“迷惑之灵”
  choice: 在正文中保留“灵”的位格化表达
  alternative: 将其非位格化为“淫乱的冲动”或“迷惑”
  rationale: 希腊文两处都明确使用πνεῦμα。译文不把它消解为心理倾向，也不进一步断定其为某一特定邪灵，从而保留文本本身的神学张力。
- issue: 犹大关于她玛和儿子们的晦涩自白
  choice: 正文采用贴近原文意象的“揭开了我儿子们污秽的遮盖”
  alternative: 明确解释为使家族的羞耻公开，或解释为性方面的暴露
  rationale: 希腊语比喻的确切所指不明。正文不替原文解决歧义，脚注仅提供可能解释。
- issue: “只要还知羞耻，就可以喝”是否构成普遍许可
  choice: 按原文保留其条件式劝诫，并用脚注说明重点在尚存的自制界限
  alternative: 改写为完全禁酒，或把它处理为对适量饮酒的无条件认可
  rationale: 原文同时有“不要喝酒致醉”和“只要还知羞耻，就可以喝”，存在真实的劝诫张力；译文不以任何宗派性的饮酒立场重写文本。
- issue: 第三节“身体便犯罪”的施事者
  choice: 保留身体作为句法上的施事者
  alternative: 改为“人便犯罪”或“他便犯罪”
  rationale: 希腊文最近的主语是τὸ σῶμα，随后用单数动词“犯罪、不羞耻”；虽拟人化略显突兀，仍应保留，而不静默改写。
translation_notes:
  register: 采用现代标准普通话和简体中文，语气庄重而可读。保留遗训体的直接称呼“孩子们”、反复出现的“羞耻”主题及原文若干刻意或传本造成的突兀处；对难解句采用正文较直译、脚注释义的方式，避免过度解释。
