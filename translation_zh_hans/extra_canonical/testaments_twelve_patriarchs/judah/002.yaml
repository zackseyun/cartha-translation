    1 主使我所做的一切都蒙恩惠[a][b]，无论在田间还是在家中。2 我知道，我曾与一只母鹿赛跑，把它捉住，做成食物给我父亲，他就吃了。3 羚羊奔跑时，我也能抓住它；凡在田野里的，我都追得上。4 我杀死狮子，从它口中夺回一只山羊羔。我抓住熊的一只脚，把它摔下悬崖，它就跌得粉碎。5 我追赶野猪，在奔跑中赶上它，把它撕碎。6 在希伯仑，有一只豹扑向那条狗；我抓住豹的尾巴，把它猛摔在岩石上，它便裂成两半。7 我遇见一头野牛[c]在那地吃草，就抓住它的双角，使劲抡着它转圈，把它弄得昏头转向[d]，再摔倒杀死。8 我还驯服过一头狮子。


    [a] 本章现存希腊文本有几处行文和句法较为粗涩，特别是在接连叙述这些搏兽事迹的段落中。译文依照现有希腊见证所表达的意思，没有用后来的扩充内容补足或理顺这段叙述。


    [b] “恩惠”也可译作“恩宠”。这里指主以善意使犹大所做的事顺利，并非说这些成就是单凭犹大自己的力量取得的。


    [c] “野牛”也可译作“野公牛”；希腊词指一种强壮而未驯服的牛科动物。


    [d] “把它弄得昏头转向”所译的希腊语原意可指“使之昏暗”，在这里大概是说犹大把野牛抡得眩晕。'
