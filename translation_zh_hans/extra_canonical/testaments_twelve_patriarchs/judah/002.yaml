  text: And the Lord gave me favor in all my works[a], in the field and in the house. I know that I ran with a hind and caught it, and I made it food for my father, and he ate. And I would seize the gazelle in its course, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and cast it down the cliff, and it was crushed. I ran down the wild boar, and I overtook it as I ran and tore it apart. I caught a wild mare and, after seizing it, subdued it. A leopard in Hebron sprang upon the dog, and I caught it by the tail and flung it against the rock, and it was split in two. I found a wild ox grazing in the land, and taking hold of its horns[c][b], I shook it round and round and struck it blind.
translation:
  language: zh_hans
  text: '《犹大遗训》第2章


    1 主在我所做的一切事上赐我恩惠[a]，在田间，也在家中。2 我知道，我曾与一只母鹿赛跑，把它捉住，做成食物给我父亲，他就吃了。3 羚羊奔跑时，我也能抓住它；凡在田野里的，我都追得上。4 我杀死狮子，从它口中夺回一只山羊羔。我抓住熊的一只脚，把它摔下悬崖，它就摔得粉碎。5 我追赶野猪，在奔跑中赶上它，把它撕碎。6 在希伯仑，有一只豹扑向那条狗；我抓住豹的尾巴，把它猛摔在岩石上，它便裂成两半。7 我遇见一头野牛[b]在那地吃草，就抓住它的双角，使劲抡着它转圈，把它弄得昏头转向[c]，又把它摔倒，杀死了它。8 我还驯服过一头狮子。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章现存希腊文本有几处行文和句法较为粗涩，特别是在接连叙述这些搏兽事迹的段落中。译文依照现有希腊见证所表达的意思，没有用后来的扩充内容补足或理顺这段叙述。
    reason: textual_variant
  - marker: b
    text: “野牛”也可译作“野公牛”；希腊词指一种强壮而未驯服的牛科动物。
    reason: lexical_alternative
  - marker: c
    text: “把它弄得昏头转向”所译的希腊语原意可指“使之昏暗”；结合前文猛烈抡转野牛的动作，这里可能是说使它眩晕。
    reason: ambiguity
lexical_decisions:
- source_word: χάριν
  choice: 恩惠
  rationale: 在叙述犹大行事顺利的语境中，指主所赐的善意与助佑。“恩惠”既保留神为来源，也避免把词义过度限定为后来的专门神学术语。
- source_word: Κύριος
  choice: 主
  rationale: 这是希腊文的神圣称号；译作“主”既准确，也不把希腊文本未明说的神名直接代入。
- source_word: ἐλάφῳ
  choice: 母鹿
  rationale: 后续代词为阴性，故用“母鹿”表达此处所指的雌鹿。
- source_word: δορκάδα
  choice: 羚羊
  rationale: δορκάς通常指羚羊或瞪羚；“羚羊”是现代汉语中清楚自然的对应词。
- source_word: ἀφειλόμην
  choice: 夺回
  rationale: 该动词表示从狮子口中强行取走山羊羔；“夺回”自然体现救出猎物的动作，但不额外说明其原先归属。
- source_word: κρημνόν
  choice: 悬崖
  rationale: 指陡峭的断崖或深坎；“悬崖”适合熊被摔下并粉碎的场景。
- source_word: ἀγρίῳ χοίρῳ
  choice: 野猪
  rationale: 直接而通行的现代汉语对应词。
- source_word: πάρδαλις
  choice: 豹
  rationale: 该词指豹类猛兽；简洁译作“豹”。
- source_word: βοῦν ἄγριον
  choice: 野牛
  rationale: 表示未驯服的强壮牛科动物；正文采用自然简洁的“野牛”，并以脚注保留“野公牛”的可能。
- source_word: κύκλῳ συσσείσας
  choice: 使劲抡着它转圈
  rationale: 保留κύκλῳ的环绕动作和复合动词所含的强烈、反复摇动意味。
- source_word: σκοτίσας
  choice: 把它弄得昏头转向
  rationale: 本义涉及变暗、昏沉；在猛烈旋转野牛的动作中，语境最可能指使其眩晕，同时以脚注保留字面的语义张力。
- source_word: ἡμέρωσα
  choice: 驯服
  rationale: 表示使野兽变得温驯；“驯服”准确保留第8节简短有力的陈述。
theological_decisions:
- issue: 犹大能力与神的施恩之间的关系
  choice: 保留开篇“主使我所做的一切都蒙恩惠”，使后续事迹处于神所赐恩惠的框架中。
  alternative: 把开篇理解为一般性的祝福套语，弱化它与后续成就的直接联系。
  rationale: 希腊文明确以主为赐下χάρις者，又以“在一切所做的事上”概括后文，因此译文既保留犹大的实际勇力，也不抹去神所赐的恩惠。
- issue: 是否采用英语咨询稿中希腊正文没有的“野马”事迹
  choice: 不纳入正文。
  alternative: 依英语咨询稿加入“我捉住一匹野马……将它制伏”。
  rationale: 所提供的主要希腊文本从野猪事迹直接进入希伯仑的豹，并无野马句。按照原文优先原则，不以咨询层的扩充替代源文本。
- issue: 是否保留结尾“我还驯服过一头狮子”
  choice: 作为第8节保留。
  alternative: 随英语咨询稿省略。
  rationale: 所提供希腊正文明确有Καὶ λέοντα ἡμέρωσα，故必须译出。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体，保留原文接连罗列壮举的简短有力风格。动物名称使用普通读者熟悉的现代词语；对文本粗涩和词义不确定之处以脚注说明，不在正文中擅自补写。正文依希腊源文本译出英语咨询稿遗漏的第8节，并排除希腊源文本中没有的野马句。
