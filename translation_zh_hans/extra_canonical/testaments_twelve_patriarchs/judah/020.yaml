  text: '1[a]. For it leads astray, because in the delusion of silver they call those who are not gods gods, and it makes the one who has it fall into frenzy. 2. Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless. 3. But the God of my fathers had mercy on me, because I did this in ignorance[b]. 4. For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast. 9. And the spirit of truth testifies against all things, and the sinner is burned up by his own heart[c], and cannot lift up his face to the judge.'
translation:
  language: zh_hans
  text: '《犹大遗训》第20章


    1 所以，我的孩子们，你们要知道，有两个灵与人相伴：真理的灵和迷误的灵。


    2 二者之间是人的良知；人若愿意倾向哪一方，就可以倾向哪一方。[a]


    3 这两个灵都可按人的行为辨认出来，因为主已把人的行为铭写在他们胸部的骨头中。[b]


    4 人的行为绝不会在任何时候逃过察验，因为主已把这些行为铭写在他们胸部的骨头中。[c]


    5 真理的灵指控一切；罪人被自己的心灼烧，无法在审判者面前抬起头来。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的希腊文传本措辞艰涩，直译近于“中间是良知，它愿意向哪里就向哪里倾斜”。这里按上下文理解为：人的良知处在两个灵之间，人可以选择倾向其中一方。
    reason: textual_variant
  - marker: b
    text: 第3—4节的希腊文保存状况不佳，句法和指代都不稳定。原文逐字含有“在他们胸部的骨头中”这一不寻常的身体铭写意象；译文保留其陌生感，不将其解释为“心里”。大意是两个灵可从人的行为辨认，而人的行为已由主铭写。
    reason: textual_variant
  - marker: c
    text: 本节希腊文逐字读来近于“没有一个时候，人的行为能抓住人”，与下句衔接困难。译文依据上下文表达其较可能的共同意义：人的行为不能逃过察验；下句则重述这些行为已由主铭写的意象。
    reason: textual_variant
lexical_decisions:
- source_word: δύο πνεύματα
  choice: 两个灵
  rationale: 保留原文明确的属灵用语，不把它们缩减为纯心理倾向，也不进一步界定为特定种类的灵界存在。
- source_word: σχολάζουσι τῷ ἀνθρώπῳ
  choice: 常在人身边
  rationale: σχολάζω 在此语境含义罕见；此译表达两个灵持续与人相关并对人发生作用，同时避免过度具体化。
- source_word: τὸ τῆς ἀληθείας / τὸ τῆς πλάνης
  choice: 真理的灵／迷误的灵
  rationale: ἀλήθεια 与 πλάνη 构成道德和属灵上的对照；“迷误”兼顾受误导、偏离正道的意味，不限于蓄意欺骗。
- source_word: συνείδησις
  choice: 良知
  rationale: 此词指人内在作道德辨识的意识；“良知”是现代汉语中自然而庄重的对应语。
- source_word: κλῖναι
  choice: 倾斜
  rationale: 保留原文向两方之一偏转的空间意象，并让人的意愿与道德取向之间的关系保持开放。
- source_word: ἐν στήθει τῶν ὀστέων
  choice: 在胸骨之中
  rationale: 原文采用具体而不寻常的身体铭刻意象；不改译为“心里”，以免抹去这一意象。
- source_word: κατηγορεῖ
  choice: 指控
  rationale: 保留法庭语义，并与本节末尾的“审判者”相呼应。
- source_word: ἐμπεπύρισται
  choice: 被……灼烧
  rationale: 保留完成时被动形式所表达的内在焚烧状态，不把它弱化为一般的懊悔。
- source_word: ἆραι πρόσωπον
  choice: 抬起头来
  rationale: 按原文惯用意象直译，表达罪人在审判者面前因受控告而无法坦然面对。
theological_decisions:
- issue: “两个灵”的性质
  choice: 按原文译作真实的道德—属灵作用者“两个灵”
  alternative: 译作两种性情、冲动或心理倾向
  rationale: 原文使用 πνεύματα，并以劝诫性的方式谈论它们；译文保留属灵实在感，但不强行判定其严格本体身份。
- issue: 人的意愿、良知与两个灵的关系
  choice: 保留良知处在二者之间、人的意愿可以倾向任一方的表述
  alternative: 把良知解释为完全自主的裁决者，或把人的倾向解释为完全受外灵决定
  rationale: 原文同时呈现属灵影响和人的意愿；译文不消解这两者之间的张力。
- issue: 行为被主铭写与末日审判的关系
  choice: 保留主铭写人的行为以及真理之灵提出指控的司法图景
  alternative: 明确解释为某种特定的审判记录 doctrine 或良心自我定罪机制
  rationale: 原文的铭刻和审判意象清楚，但其机制并未解释；译文不引入后来的体系化教义。
translation_notes:
  register: 采用现代标准普通话的庄重劝诫体。称呼用“我的孩子们”，语气亲近而郑重；司法词汇用“指控”“审判者”，身体意象用“胸骨”“灼烧”，尽量保留原文的陌生感。仅翻译所提供的希腊文第20章1—5节，不补入英语咨询层中缺少原文依据的前置段落。
