    issue: 第3—4节将“ἐν στήθει τῶν ὀστέων”译为“胸骨之中”。
    rationale: στῆθος通常指胸、胸膛，而非“胸骨”；原文的“胸部／骨头”组合本已怪异，译作“胸骨”会不必要地作出解剖学定指。
  - severity: low
    issue: 第3节“这些行为是主写在……”的施事与铭写关系可以更明确。
    rationale: παρὰ Κυρίου γέγραπται表示由主所写／在主那里已被写下；改作“主已把人的行为铭写在……”更清楚，也保留完成状态。
  - severity: low
    issue: 第1节“常在人身边”略偏空间化。
    rationale: σχολάζουσι τῷ ἀνθρώπῳ在此为难词，语境强调两个灵与人相伴并发生作用；“与人相伴”较稳妥。
