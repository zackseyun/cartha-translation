  text: And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.
translation:
  language: zh_hans
  text: 第二天，有消息传到我们这里，说迦阿斯城的王带着大批人众正向我们而来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: 第二天
  rationale: 在叙事语境中自然表达“接下来的一天”，与希腊文的时间推进相符。
- source_word: ἐρρέθη πρὸς ἡμᾶς
  choice: 有人向我们报告说
  rationale: 该被动式直译为“有话对我们说”，此处语境表示消息传来；采用汉语自然的无定主语，同时不添加报告者身份。
- source_word: Γαὰς πόλεως βασιλεὺς
  choice: 迦阿斯城的王
  rationale: 保留地名音译，并按属格关系译为该城之王。
- source_word: ἐν λαῷ πολλῷ
  choice: 率领大队人马
  rationale: 介词短语表示伴随大量民众或军众而来；战争语境下“大队人马”自然且不过度限定其正规军身份。
- source_word: ἔρχεται πρὸς ἡμᾶς
  choice: 正……前来攻打我们
  rationale: 现在时用“正……前来”体现正在逼近；πρὸς ἡμᾶς字面为“朝我们而来”，结合敌对军事叙事译出“攻打”，使隐含方向明确。
