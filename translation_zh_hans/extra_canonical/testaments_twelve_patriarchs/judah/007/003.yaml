  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/003.yaml
  text: And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering all that was theirs, we tore down their three walls.
translation:
  language: zh_hans
  text: 到了深夜，我的兄弟们来到我们这里。我们给他们打开城门，把敌方的人全都消灭了[a]，又大肆掳掠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“把他们全都消灭了”。这里的“他们”所指没有明说；按上下文应指敌方的人，而不是刚来到的兄弟们。
    reason: 保留原文代词在语法表面上的指向含混，同时避免正文被自然理解成他们杀死了自己的兄弟。
lexical_decisions:
- source_word: Νυκτὸς δὲ βαθείας
  choice: 到了深夜
  rationale: 自然传达“夜已深”的时间背景；δέ在叙事中主要起承接作用，不必机械译出。
- source_word: οἱ ἀδελφοί μου
  choice: 我的兄弟们
  rationale: 保留亲属称谓，不将其扩大解释为一般同伴或同胞。
- source_word: ἀνοίξαντες τὰς πύλας αὐτοῖς
  choice: 我们给他们打开城门
  rationale: 分词与主句共享主语“我们”；复数πύλας在此自然译作集合意义的“城门”。
- source_word: πάντας αὐτοὺς ἐξωλοθρεύσαμεν
  choice: 把敌方的人全都消灭了
  rationale: ἐξολοθρεύω表示彻底消灭；结合战斗语境以“敌方的人”呈现可能所指，同时用脚注保留希腊文代词指向未明的张力。
- source_word: ἐπρονομεύσαμεν
  choice: 又大肆掳掠
  rationale: 该动词表示劫掠、掳掠；原文未明说宾语，因此中文也不补入“他们所有的财物”等具体对象。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代汉语。严格依据所给希腊文；英文咨询文本末尾“拆毁他们的三道城墙”的内容不见于本节所给希腊文，故未纳入译文。
