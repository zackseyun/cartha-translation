review_pass:
  verdict: revise
  source_fidelity: 正文将希腊文的αὐτούς直接译为“他们”，不应在正文中补定为“敌方的人”。在所给文本的语法和叙述顺序中，“他们”最自然的先行词正是刚到的“我的兄弟们”；即使上下文可能令人怀疑文本、人物指代或传承，也不宜以解释性改写消除这一张力。ἐπρονομεύσαμεν只说“劫掠／掳掠”，未明说宾语，译文亦不补出财物或“一空”。英文审校文本所含“他们所有的”和“拆毁三道城墙”均不见于所给希腊文，不应采纳。
  naturalness: “深夜”及“我们为他们打开城门”自然、庄重，也准确表达时间属格和分词结构。“又进行掳掠”在未明示宾语时比单用“又大肆掳掠”更完整；“大肆”带有原文未明确编码的程度性修饰，予以删去。
  terminology: “兄弟们”保留ἀδελφοί的亲属称谓；“消灭”可传达ἐξωλοθρεύσαμεν的彻底毁灭语义。“城门”可作为复数πύλας的汉语集合表达。
  issues:
  - severity: high
    issue: 正文将“他们”解释为“敌方的人”。
    rationale: 希腊文没有“敌方”一词；αὐτούς在语法上最自然地承接前面的“我的兄弟们”。把其改为敌人改变了文本表层所说的对象，且脚注中“指向没有明说”的表述不够准确。
  - severity: medium
    issue: “大肆”强化了掳掠的程度。
    rationale: ἐπρονομεύσαμεν表示劫掠，但本句未另以副词明确“大肆”；宜采用不额外强化的译法。
  revised_text: 深夜，我的兄弟们来到我们这里；我们为他们打开城门，把他们全都消灭，又进行掳掠。[a]
  revised_footnotes:
  - marker: a
    text: 希腊文直译为“把他们全都消灭”。“他们”在语法上最自然地指前文来到的“我的兄弟们”。这会造成叙述上的困难；所给文本没有把他们明确称为敌人，因此正文保留这一表面指向。
    reason: 避免在正文中补入原文未说的“敌方”，同时说明代词承接所造成的叙述张力。
  revision_rationale: 修订以所给希腊文为准：保留“兄弟们”与随后代词之间的自然语法承接，不以可能的上下文重建替换原文；删去“敌方的人”和“大肆”两项解释性增补；并继续不纳入所给希腊文本没有的“所有财物”及“拆毁三道城墙”。
