lexical_decisions:
- source_word: πορευθέντες πρὸς Ἀμορραίους
  choice: 前往亚摩利人那里
  rationale: 保留分词所表达的先行动作及πρός的趋向意义；用现代汉语自然表达。
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: 假装与他们结盟
  rationale: προσποιέομαι表示假装，συμμάχους在此指盟友身份；译文明确他们假扮的是亚摩利人的盟友，而不是假扮亚摩利人。
- source_word: εἰσήλθομεν εἰς τὴν πόλιν αὐτῶν
  choice: 便进了他们的城
  rationale: 准确传达进入其城的动作；“便”自然衔接此前伪装与进入之间的叙事关系，但不额外强化因果。
