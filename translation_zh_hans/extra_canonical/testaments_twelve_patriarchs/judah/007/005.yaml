  text: Then, being insulted by them, I became angry, and I rushed against them up to the summit. And they kept pelting me with stones and shooting arrows at me.
translation:
  language: zh_hans
  text: 于是我被他们侮辱，就发怒，向他们猛冲，一直冲到山顶；他们不断用石头砸我，又向我射箭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβριζόμενος
  choice: 受了他们的侮辱
  rationale: 保留被动意义及受辱语气；在现代汉语中自然清楚。
- source_word: ὠργίσθην
  choice: 发起怒来
  rationale: 直接表达叙事中的愤怒反应，不额外解释其正当性。
- source_word: ὥρμησα ἐπ᾽ αὐτοὺς
  choice: 向他们猛冲
  rationale: ὁρμάω 表示迅猛冲击，ἐπ᾽ αὐτούς 表明行动针对他们。
- source_word: ἐπὶ τὴν κορυφήν
  choice: 一直冲到山顶
  rationale: 将方向或终点自然译出；κορυφή 在此地形语境中宜作“山顶”。
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: 不断用石头投打我
  rationale: 未完成时表示持续或反复动作；译文不强行限定为使用投石器，因为该结构可概括为以石投击。
- source_word: τοξεύοντες
  choice: 向我射箭
  rationale: 按弓箭攻击的通常意义翻译，并依上下文补出受事者“我”。
