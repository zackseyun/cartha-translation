lexical_decisions:
- source_word: ὅρος
  choice: 饮酒的界限
  rationale: ὅρος可指界限、边界或限度。正文以“谨防越过”使不寻常的希腊表达在现代汉语中可懂，同时脚注保留其直译及“分量”的可能性。
- source_word: πνεύματα πονηρά
  choice: 邪灵
  rationale: 原文明确使用“灵”的语言；译作“邪灵”既保留其属灵意味，也让随后的恶习清单呈现其道德表现，不将其简化为纯心理冲动。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 此词范围较广；“欲望”不将其限缩为性欲。
- source_word: πύρωσις
  choice: 炽热的激情
  rationale: 保留“燃烧、炽热”的意象，并表达酒所激起的强烈冲动。
- source_word: ἀσωτία
  choice: 放荡
  rationale: 表达无节制、挥霍式的生活状态；比“淫乱”更宽，也符合恶习清单的语境。
- source_word: αἰσχροκερδία
  choice: 可耻的贪利
  rationale: 兼顾复合词中“可耻”和“求利”的两个成分，避免仅译成泛泛的贪婪。
- source_word: αἰδούμενος
  choice: 知所羞耻
  rationale: 该词含羞耻感、谦抑和谨慎自持之意；此译保留它与失去羞耻之心相对的伦理色彩。
- source_word: σωφρόνως
  choice: 有节制地
  rationale: 表达清醒、审慎、自制的生活方式，而非仅指饮酒时保持清醒。
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: 一点也不要沾酒
  rationale: 保留否定词和“触碰”的强烈措辞，不弱化为只禁止过量饮酒。
- source_word: λόγοις ὕβρεως
  choice: 傲慢的话
  rationale: ὕβρις含骄横、凌辱和越界之意；此译保持其道德严重性，并符合自然汉语。
- source_word: συκοφαντίαις
  choice: 诬告
  rationale: 此词可指诽谤、虚假指控甚至借此勒索；“诬告”在争斗语境中较贴近其具体力度。
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: 未到你们的时候
  rationale: 尽量保留原文“不是在你们的时候”的表达，不替文本判定这是自然寿命、命定时间还是其他特定时机。
theological_decisions:
- issue: “邪灵”应理解为真实的属灵力量还是人格化的恶习
  choice: 正文直译为“邪灵”，并由脚注保留两种理解的可能。
  alternative: 译作“邪恶冲动”或“恶习”。
  rationale: 原文明确使用πνεύματα，不宜在翻译中先行消解其属灵含义；同时四项内容又是道德恶习，因此保留张力。
- issue: 第3节禁酒命令的力度
  choice: 译作“一点也不要沾酒”。
  alternative: 译作“不要过量饮酒”或“不要沉迷于酒”。
  rationale: μηδ᾽ ὅλως与ἐφάπτεσθε共同构成绝对而强烈的劝戒；即使具有修辞强化作用，译文也不应擅自减弱。
- issue: 第3节死亡时间的含义
  choice: 译作“未到你们的时候便灭亡”。
  alternative: 译作“早逝”或“在命定日期之前灭亡”。
  rationale: 原文没有明确说明这个“时候”是自然寿数还是上帝所定之期，因此采用较贴近原文且保持开放的表达。
- issue: 英语咨询文本中第2节后半句及第5节的取舍
  choice: 不收入正文。
  alternative: 依据英语POB加入“敬畏离去……无耻进入”以及“酒成为战争和骚乱的原因”。
  rationale: 所提供的希腊语主文本仅含第1至第4节，且没有这两段对应文字。翻译以给定原文证据为首要依据，不从咨询层补入源文本中缺失的句子。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。称谓用“我的孩子们”，神名用“上帝”。保留遗训体的劝诫语气和原文中关于邪灵、禁酒及死亡时机的张力。未收入英语咨询层中缺乏所给希腊语依据的第2节扩展句和第5节。
