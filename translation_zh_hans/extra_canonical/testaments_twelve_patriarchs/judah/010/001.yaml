  text: '*Μετὰ δὲ ταῦτα¹ Ἦρ² ὁ υἱός μου ἄγεται τὴν Θαμὰρ ἐκ Μεσοποταμίας θυγατέρα Ἀρὰμ³ †ἑαυτῷ εἰς γυναῖκα⁴.'
