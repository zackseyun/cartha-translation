  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/001.yaml
  text: After these things, Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram.
translation:
  language: zh_hans
  text: 此后，我的儿子珥娶了从美索不达米亚来的亚兰的女儿他玛为妻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: 此后
  rationale: 自然简洁地表达“这些事以后”，保留叙事承接关系。
- source_word: Ἦρ
  choice: 珥
  rationale: 采用现代中文圣经中该人名的通行译法。
- source_word: ἄγεται … ἑαυτῷ εἰς γυναῖκα
  choice: 娶了……为妻
  rationale: 该结构表示为自己迎娶女子；以现代汉语惯用婚姻表达传达其意义。希腊语现在时在此按历史叙事处理为完成事件。
- source_word: Θαμὰρ
  choice: 她玛
  rationale: 采用现代中文圣经中该人名的通行译法。
- source_word: ἐκ Μεσοποταμίας
  choice: 从美索不达米亚
  rationale: 保留来源地含义，并采用该地名的现代标准译名。
- source_word: θυγατέρα Ἀρὰμ
  choice: 亚兰的女儿
  rationale: 按希腊语属格结构直译，不把“亚兰”擅自解释为族群或地区，从而保留原文可能的指涉。
