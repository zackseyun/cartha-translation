  text: And he did not know her, by the scheming of his mother, for he did not want to have children by her.
translation:
  language: zh_hans
  text: 他没有与她同房[a]，这是由于他母亲的诡计；因为他不愿意与她有儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“认识她”，在这里是发生性关系的委婉说法。
    reason: 说明源语委婉表达，并交代正文采用“同房”的依据。
lexical_decisions:
- source_word: οὐκ ἔγνω αὐτήν
  choice: 没有与她同房
  rationale: “认识她”在此是指性关系的委婉语；译为现代汉语常用而庄重的“与她同房”，清楚传达原意，并在脚注保留其字面表达。
- source_word: κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ
  choice: 这是出于他母亲的诡计
  rationale: κατά在这里表示事情依照或由于其母的狡计而发生；“出于……的诡计”保留母亲介入的含义，又不额外断定具体实施方式。
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: 从她得儿女
  rationale: 贴近“由她而有儿女”的源语结构，同时使用自然、易懂的现代汉语。
theological_decisions:
- issue: 是否把“没有认识她”保留为字面对译
  choice: 正文译明为“没有与她同房”，脚注说明字面意思
  alternative: 他没有认识她
  rationale: 本句中的“认识”是古代常见的性关系委婉语；纯字面对译在现代汉语中容易被误解，译明可准确传意，而脚注仍让读者看见原文措辞。
- issue: 母亲的诡计与男子行为之间的关系
  choice: 译作“这是出于他母亲的诡计”
  alternative: 他照着母亲的诡计行事
  rationale: 原文说明其母的诡计与此事有关，但没有交代她如何影响他；所选译法避免补入命令、合谋等原文未明说的细节。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“同房”既为普通读者所理解，也避免粗俗；分号呈现后半句对行为动机的解释。
