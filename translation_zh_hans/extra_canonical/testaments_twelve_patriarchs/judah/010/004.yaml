base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/004.yaml
  text: During the days of the bridal chamber I gave her to Onan in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year.
translation:
  language: zh_hans
  text: 在新婚期间，我按夫兄弟婚的规矩，把她给了俄南；然而他也出于邪恶，没有与她同房，尽管他同她共度了一年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: 在新婚期间
  rationale: 字面为“在婚房的日子里”，在此指新婚阶段；采用自然现代汉语，保留其时间含义。
- source_word: ἐπεγυμβρευσα αὐτῇ τὸν Αὐνάν
  choice: 我按夫兄弟婚的规矩，把她给了俄南
  rationale: ἐπιγαμβρεύω表示履行亡兄弟续弦义务；译文明确其夫兄弟婚背景，同时依希腊语结构表达犹大促成这桩婚姻。
- source_word: οὐκ ἔγνω αὐτήν
  choice: 没有与她同房
  rationale: “认识她”在此是性关系的委婉语；现代汉语“同房”准确、庄重，也符合相关创世记叙事的语域。
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  choice: 他和她一起生活了一年
  rationale: 该短语字面近于“与她度过一年”，译为“一起生活了一年”自然表达持续共同生活的时间。
- source_word: ἐν πονηρίᾳ
  choice: 心存邪恶
  rationale: 既表达行为的邪恶性质，也保留希腊语所指的内在恶意或恶劣动机。
theological_decisions:
- issue: 俄南“没有认识她”与《创世记》38章叙事之间的张力
  choice: 按本节希腊文本译为“没有与她同房”
  alternative: 调和为“没有尽夫兄弟婚的本分”或“没有使她怀孕”
  rationale: 本译本不以《创世记》的细节改写本节明确措辞，而保留《犹大遗训》自身叙述所形成的张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。“夫兄弟婚”较“娶寡嫂制”等说法更能涵盖制度本身；“同房”保留原文委婉而明确的性含义。专名 Αὐνάν 依现代中文圣经常用形式译作“俄南”。
