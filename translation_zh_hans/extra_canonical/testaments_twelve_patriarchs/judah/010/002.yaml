  text: But Er was wicked, and an angel of the Lord killed him.
translation:
  language: zh_hans
  text: 但珥是个恶人；主的一位天使杀了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρός
  choice: 恶人
  rationale: 此处作表语，指珥品行邪恶；译为“恶人”比“邪恶的”更符合现代汉语叙事表达。
- source_word: ἄγγελος Κυρίου
  choice: 主的一位天使
  rationale: 希腊文无定冠词，可自然理解为主所差遣的一位天使；保留“主”的属格关系，不把它特定化为“主的使者”。
- source_word: ἐθανάτωσεν
  choice: 杀了
  rationale: 该动词在此为主动使役意义，即使其死亡；“杀了”直接保留原文由天使执行的致死行动。
theological_decisions:
- issue: 致死者的身份与行动主体
  choice: 主的一位天使便杀了他
  alternative: 主的使者使他死了
  rationale: 原文明确以ἄγγελος Κυρίου为主语，并用主动动词ἐθανάτωσεν；译文不淡化天使作为行动主体，也不将其解释为上帝亲自行动。
translation_notes:
  register: 采用简洁、庄重而自然的现代叙事语体。“便”承接珥的邪恶与随后受死之间的因果推进，但不额外说明审判机制。
