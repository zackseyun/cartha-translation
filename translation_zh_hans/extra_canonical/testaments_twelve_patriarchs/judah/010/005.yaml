base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/005.yaml
  text: And when I threatened him, he went in to her, but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because she was not from the daughters of Canaan, as she herself was.
translation:
  language: zh_hans
  text: 我威胁他以后，他便与她同房，却照他母亲的吩咐，把精液泄在地上。因此，他也在邪恶中死去了。我也想把示拉给她为夫，但示拉的母亲不准。她行了恶，因为他玛不像她本人那样，是迦南女子中的一员。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此句连续使用阴性代词，指代存在困难，且所据希腊文本在此处有文本问题标记。按上下文，正文将前一“她”理解为他玛，后一“她本人”理解为示拉的母亲：她因他玛不是像自己那样的迦南女子而行恶、阻拦婚配。
    reason: 如实说明希腊文代词指代和文本状态，同时说明正文为使现代汉语可理解而采用的上下文判断。
lexical_decisions:
- source_word: συνῆλθε αὐτῇ
  choice: 与她同房
  rationale: 该短语在此语境中指发生性关系；译为“同房”既自然庄重，也保留叙事的委婉程度。
- source_word: διέφθειρε δὲ τὸ σπέρμα ἐπὶ τῆν γῆν
  choice: 却把精液泄在地上
  rationale: σπέρμα 在此具体指精液，διέφθειρε 表示使之毁坏、浪费；中文以“泄在地上”准确表达行为，而不额外推断其方式。
- source_word: ἐν πονηρίᾳ
  choice: 在邪恶中
  rationale: 保留希腊文介词结构及其道德判断，不擅自具体化为某一种罪或刑罚原因。
- source_word: Ἐπονηρεύσατο
  choice: 她这样使坏
  rationale: 动词表示采取恶意、邪恶的行动；结合母亲阻拦婚配的具体行为，译为“使坏”自然易懂，同时保留负面道德评价。
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: 迦南女子
  rationale: 这是现代汉语中对“迦南人的女儿们”的自然集体表达，意义不变。
theological_decisions:
- issue: 俄南之死与其恶行之间的关系
  choice: “因此，他也在邪恶中死去了”
  alternative: “所以，他也因自己的邪恶而死”
  rationale: 原文 ἐν πονηρίᾳ 是“在邪恶中”，没有明确使用表示直接因果的介词；正文保留这种张力，不把死亡明确解释为对某一行为的直接惩罚。
- issue: 末句两个阴性代词的指代
  choice: 正文按上下文分别明确为“他玛”和“她本人（示拉的母亲）”，并加注说明
  alternative: 全译作“她”，保留表面代词形式
  rationale: 逐字保留两个“她”会令现代中文难以理解。上下文最自然的意思是：示拉的母亲因他玛不是像她自己那样的迦南女子而恶意阻拦；脚注同时交代希腊文代词形式及潜在歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同房”避免粗俗，“精液泄在地上”则在关键动作上保持准确，不以含混表达遮蔽原文。人物名称采用通行译名“示拉”“他玛”。
