  source_fidelity: 需修订。草稿完整涵盖希腊底本第1—6节，且保留了方括号段落及相应脚注。惟第2节将未限定的 πνεῦμα 译为“圣灵”，加入了原文没有的限定；应维持为“灵”，并以脚注保留其与“圣父的祝福”之间的句法歧义。第6节应使“为列国”首先连于“公义的杖”，而非直接写成该杖“为列国施行审判”。英文审校轨迹从希腊文第2节开始并重编号，未含希腊文第1节；中文应以所给希腊文本为准。
  naturalness: 整体语言庄重、现代且顺畅。将“有一颗星为你们从雅各升起”调整为“将有一颗星为你们从雅各而出，在平安中升起”，语序更自然，也较少把 ἐν εἰρήνῃ释义为结果性的“带来和平”。
  terminology: “公义的太阳”“恩典之灵”“主”“嫩芽”“泉源”“权杖”等均适切。第2节的 πνεῦμα 不宜正文预断为“圣灵”；πατρὸς ἁγίου 可按字面保留“圣父”，但不将其作为对 πνεῦμα 的固定专名性限定。
