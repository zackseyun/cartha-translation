  - severity: medium
    issue: 第1节“带来和平”将 ἐν εἰρήνῃ处理为明确的结果性动作。
    rationale: 原文直陈“在和平中”，可指星升起时所伴随的状态；译为“在平安中升起”较能保留其修饰范围与含义。
  - severity: medium
    issue: 第6节“为列国施行审判”改变了 τοῖς ἔθνεσι 的就近连接。
    rationale: 该与格紧邻“公义的杖”，较稳妥的译法是“一根为列国而立的公义之杖”；不应在中文中明确断定“列国”就是审判的对象。
  - severity: low
    issue: 英文审校轨迹与所给希腊底本的节次不完全对应。
    rationale: 英文文本由希腊文第2节起重编号，且未包括希腊文第1节；本次修订依据完整希腊文本，未以英文的省略或节次取代源文。
