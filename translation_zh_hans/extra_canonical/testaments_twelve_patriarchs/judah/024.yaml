  text: '1. He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.

    2. And you will be for him sons in truth, and you will walk in his commands, first and last.

    3. [This is the shoot of the Most High God, a spring for the life of all flesh.]

    4. Then the scepter of my kingdom will shine forth, and from your root a stem will arise.

    5. And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.'
translation:
  language: zh_hans
  text: '《犹大遗训》第24章


    1 此后，将有一颗星为你们从雅各而出，在平安中升起；也必有一人从我的后裔中兴起，如公义的太阳，在温柔和公义中与世人同行；在他里面找不到任何罪。


    2 诸天必在他上面敞开，将圣父祝福的灵倾注在他身上[a]；他自己也必将恩典之灵倾注在你们身上。


    3 你们必在真理中成为他的儿子，并遵行他最初和末后的命令[b]。


    4〔这就是至高上帝的嫩芽，也是向众人赐予生命的泉源。〕[c]


    5 那时，我国度的权杖必放出光辉；从你们的根必长出一根主干。


    6 从其中必萌生一根为列国而立的公义之杖，审判并拯救所有呼求主的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语的句法较为紧缩，直译近于“倾注圣父祝福的灵”；也可理解为“倾注圣父所赐福的灵”，或“倾注灵和圣父的祝福”。原文只说“灵”，并未明确称其为“圣灵”。
    reason: 保留 πνεῦμα εὐλογίαν πατρὸς ἁγίου 的句法与语义歧义，并避免将未限定的 πνεῦμα专名化。
  - marker: b
    text: “最初和末后的”也可能表示“从始至终”；原文更直接地与“命令”连在一起。
    reason: 说明 πρώτοις καὶ ἐσχάτοις 的修饰范围并不完全确定。
  - marker: c
    text: 这一整句在所据希腊文本中置于方括号内，表明其文本归属存疑。
    reason: 向读者透明呈现底本标示的文本不确定性。
lexical_decisions:
- source_word: ἄστρον
  choice: 一颗星
  rationale: 保留原文具体的星辰意象，并维持其与“从雅各升起”的传统表达之间的联系。
- source_word: ἐν εἰρήνῃ
  choice: 带来和平
  rationale: 希腊语字面为“在和平中”；此处用自然汉语表达其伴随状态，同时不把“和平”具体化为某种政治或教义概念。
- source_word: ἥλιος δικαιοσύνης
  choice: 公义的太阳
  rationale: 直译这一鲜明隐喻，不弱化为“公义之光”。
- source_word: συμπορευόμενος τοῖς ἀνθρώποις
  choice: 与世人同行
  rationale: 保留“共同走路、同行”的关系性意象；τοῖς ἀνθρώποις 泛指人类或世人。
- source_word: πνεῦμα χάριτος
  choice: 恩典之灵
  rationale: 保留“灵”与“恩典”的属格关系，不预先限定为“赐恩典的灵”或“蒙恩的心灵”。
- source_word: προστάγμασιν
  choice: 命令
  rationale: 该词指所吩咐、颁定之事；“命令”较“诫命”少带特定经典或宗派色彩。
- source_word: βλαστός
  choice: 嫩芽
  rationale: 保留植物萌生的弥赛亚式意象，又不直接加入身份解释。
- source_word: πηγή
  choice: 泉源
  rationale: 对应原文的水源意象，并与“赐予生命”自然衔接。
- source_word: πυθμήν
  choice: 主干
  rationale: 该词可指根底、树桩或茎干；上下文先言“根”、后言从中萌生枝杖，故用较宽泛的“主干”。
- source_word: ῥάβδος δικαιοσύνης
  choice: 公义的杖
  rationale: 保留“杖”兼有枝条与权柄象征的双重可能，不单译成“公义的统治者”。
- source_word: κρῖναι καὶ σῶσαι
  choice: 施行审判，并拯救
  rationale: 并列保留审判与拯救之间的张力，不将前者弱化为“治理”或把两者合并。
theological_decisions:
- issue: “星”“人”“公义的太阳”是否明确为某一后世人物
  choice: 保留原文的预言性称谓，不在正文中指名
  alternative: 直接译作或注释为弥赛亚、基督或某位历史人物
  rationale: 原文在本段只以星、人和公义的太阳等意象描写，译文不应越过文本明确程度。
- issue: 第2节 πνεῦμα 与“圣父的福分”的句法关系
  choice: 译为“圣灵——圣父的福分——”
  alternative: 译为“圣父赐福的灵”或“圣父的灵和福分”
  rationale: 原文缺少清晰连接成分，可将“圣父的福分”理解为对“灵”的同位说明，也可能理解为相连的独立成分；正文采用通顺且较贴近同位结构的表达，脚注保留歧义。
- issue: 成为“他的儿子”
  choice: 按原文保留“他的儿子”
  alternative: 泛化为“他的儿女”或解释为“上帝的儿子”
  rationale: 希腊文为阳性复数 υἱούς，并以 αὐτῷ 指向前述人物；译文不改换所指，也不导入后来的收养论框架。
- issue: “最初和末后的”所修饰对象
  choice: 让它修饰“命令”
  alternative: 解释为“从始至终遵行”
  rationale: 原文语序较自然地使 πρώτοις καὶ ἐσχάτοις 与“命令”配合，但意义不寻常；正文保留此张力，并在脚注说明另一种理解。
- issue: 方括号内第4节的文本地位
  choice: 保留方括号并翻译
  alternative: 无括号纳入正文或完全删除
  rationale: 所给希腊底本已将整句置于方括号，表明其文本地位有疑问；出版译文应让读者看见这一点。
- issue: “所有呼求主的人”中的“主”
  choice: 译作“主”
  alternative: 具体化为“上帝”“耶和华”或“基督”
  rationale: κύριον 本身未在此明确所指，保留“主”可避免替原文解决其神学指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。植物与王权意象尽量逐一保留，并通过“嫩芽—根—主干—杖”的词汇链呈现原文意象发展。避免古奥虚词和宗派化术语；“主”“圣灵”“恩典”等则保留其必要的宗教语域。
