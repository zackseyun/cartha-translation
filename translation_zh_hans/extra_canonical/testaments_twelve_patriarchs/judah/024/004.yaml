  terminology: 保留“权杖”作为σκῆπτρον的王权象征，不将其解释为特定人物；保留“根”及“你们”的复数。以“根株”对应πυθμήν，可保留其树木基部／根株的词义范围，避免直接译为“嫩枝”或“弥赛亚”。
