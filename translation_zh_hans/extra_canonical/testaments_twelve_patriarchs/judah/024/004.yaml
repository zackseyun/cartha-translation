  source_fidelity: 原文“σκῆπτρον βασιλείας μου”直指“我王权的权杖／我国度的权杖”，草稿基本忠实；“ἀναλάμψει”译作“发出光辉”可接受。后半句“ἀπὸ τῆς ῥίζης ὑμῶν γενήσεται πυθμήν”中，πυθμήν的基本义偏向树的基部、根株或树干，并非通常意义上从根长出的“嫩枝”。英语审校轨迹虽采用 shoot，但中文不宜以“一根嫩枝”过度落实该词义。
