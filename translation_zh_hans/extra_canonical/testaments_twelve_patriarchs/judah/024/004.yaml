  text: Then the scepter of my kingdom will shine forth, and from your root a shoot will arise.
translation:
  language: zh_hans
  text: 那时，我王权的权杖必发出光辉；从你们的根而出，必有根株生出。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: 必发出光辉
  rationale: 该动词表示发光、闪耀；“发出光辉”既保留光明意象，也符合庄重的现代汉语。
- source_word: σκῆπτρον βασιλείας μου
  choice: 我国度的权杖
  rationale: 直译其王权象征，保留“权杖”与“国度”之间略显凝练的属格关系，不改释为君王或统治。
- source_word: ῥίζης ὑμῶν
  choice: 你们的根
  rationale: 保留复数代词“你们”和原文的植物隐喻，不擅自明确其所指的家族、支派或民族。
- source_word: πυθμήν
  choice: 一根嫩枝
  rationale: πυθμήν通常可指底部、根株或树干；在“从根中……长出”的植物意象里，译作“嫩枝”较自然，并与上下文所表达的新生枝条相称，同时不扩展为特定称号。
theological_decisions:
- issue: 权杖与嫩枝是否应直接释为弥赛亚人物
  choice: 保留原文意象，不在正文中明说其身份
  alternative: 译成“君王必兴起”或直接加上“弥赛亚”
  rationale: 原句以“权杖”和植物生长的象征表达盼望；直译可保存其潜在的弥赛亚含义及诗性张力，而不把解释写入正文。
- issue: 代词人称差异：μου与ὑμῶν
  choice: 分别译为“我”和“你们”
  alternative: 为求一致而都译成“我们”或“你们”
  rationale: 原文明确区分“我国度”和“你们的根”；应保留这种人称转换，即便其指涉关系需要由语境判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；以分号呈现两个并列的未来性意象。“必”传达希腊语将来时在预言语境中的确定语气。
