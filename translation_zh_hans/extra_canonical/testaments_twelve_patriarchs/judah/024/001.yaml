source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἀνοιγήσονται ἐπ᾽ αὐτῷ¹⁰ οἱ οὐρανοὶ ἐκχέαι¹⁴ πνεῦμα¹⁵ εὐλογίαν πατρὸς ἁγίου¹⁶, καὶ αὐτὸς ἐκχέει ἐφ᾽ ὑμᾶς πνεῦμα χάριτος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/001.yaml
  text: He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.
translation:
  language: zh_hans
  text: 诸天要在他上方开启[a]，好倾注圣父的祝福之灵；他自己也要把恩典之灵倾注在你们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诸天要为他开启，倾注圣父的祝福之灵。”
    reason: ἐπ᾽ αὐτῷ可作空间性的“在他上方”，也可按语境表达“为他”或“临到他”；脚注保留这一介词短语的歧义。
lexical_decisions:
- source_word: ἀνοιγήσονται ἐπ᾽ αὐτῷ οἱ οὐρανοί
  choice: 诸天要在他上方开启
  rationale: 保留复数“诸天”以及ἐπ᾽ αὐτῷ的空间性表达，不按英语咨询文本改写成由未明示主语“倾注在他身上”。
- source_word: ἐκχέαι
  choice: 倾注
  rationale: 不定式与“诸天要开启”相连，表达开启的目的或结果；中文以紧接的“倾注”保留其句法关系。
- source_word: πνεῦμα
  choice: 灵
  rationale: πνεῦμα在此可指神所赐的灵或属灵恩赐；采用“灵”以保留原文的神学开放性。
- source_word: εὐλογίαν πατρὸς ἁγίου
  choice: 圣父赐福的灵
  rationale: 将εὐλογία理解为与πνεῦμα相关的“赐福”，并以自然中文表达属格关系；不武断限定为“圣父的祝福之灵”。
- source_word: πνεῦμα χάριτος
  choice: 恩惠的灵
  rationale: 直译属格结构，保留“灵”与“恩惠”之间可能是性质、来源或所赐恩典的多义关系。
- source_word: ἐφ᾽ ὑμᾶς
  choice: 在你们身上
  rationale: 对应介词短语的方向性和临到含义，并与“倾注”形成自然搭配。
theological_decisions:
- issue: 圣父之灵与“他自己”所倾注之灵的关系
  choice: 保留两个平行表达：“圣父赐福的灵”与“恩惠的灵”
  alternative: 将二者明确等同为同一位圣灵
  rationale: 原文以两个短语平行陈述，却没有明说其完全同一；译文不额外作教义性判定。
- issue: 谁倾注第一处的灵
  choice: 让“诸天开启”与不定式“倾注”相连，不补出具体施事者
  alternative: 按英语咨询文本补作“他要……倾注在他身上”
  rationale: 希腊文本第一分句没有相应的显式人称主语；避免引入可能混淆的两个“他”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“诸天”“倾注”“恩惠的灵”保持经文语体，但避免古奥句式。主文按希腊语句法重建，不机械沿用英语咨询层对第一分句主语的处理。
