- from: 诸天要在他上方开启[a]，倾注圣父赐福的灵；他自己也要把恩惠的灵倾注在你们身上。
  to: 诸天要在他上方开启[a]，好倾注圣父的祝福之灵；他自己也要把恩典之灵倾注在你们身上。
  rationale: 修订纠正“圣父赐福的灵”可能造成的属格误读，并以“恩典之灵”准确对应 χάριτος。第一分句仍依希腊文让“诸天开启”与不定式“倾注”相连，不依英语审计文本补入“他”作为第一处倾注的显式主语。脚注锚点继续仅标示 ἐπ᾽ αὐτῷ 的可争议含义。
