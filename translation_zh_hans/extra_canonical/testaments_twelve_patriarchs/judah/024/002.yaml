  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/002.yaml
  text: And you will be to him sons in truth, and you will walk in his commandments, the first and the last.
translation:
  language: zh_hans
  text: 你们必在真理中作他的儿子，并要遵行他最先的和最后的诫命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在真理中”也可理解为“真实地”或“真诚地”；“最先的和最后的诫命”也可能是首尾并举，指从头至尾的诫命，即全部诫命。
    reason: 保留ἐν ἀληθείᾳ的方式义与实体性含义之歧义，也保留πρώτοις καὶ ἐσχάτοις的字面首尾表达及其可能的全括用法。
lexical_decisions:
- source_word: ἔσεσθε αὐτῷ εἰς υἱούς
  choice: 成为他的儿子
  rationale: 按希腊语的关系表达直译其核心意义；中文用“成为他的儿子”比“对他成为儿子”自然，同时保留复数群体含义。
- source_word: ἐν ἀληθείᾳ
  choice: 真真实实地
  rationale: 既可表示“在真理中”，也可作方式或真实性表达。正文采用自然的方式义，脚注保留另一种可能。
- source_word: πορεύεσθε ἐν προστάγμασιν αὐτοῦ
  choice: 遵行他……的诫命
  rationale: 字面为“行在他的诫命中”；“遵行”是现代中文表达顺服诫命的自然说法，并保留其行为导向。
- source_word: πρώτοις καὶ ἐσχάτοις
  choice: 从始至终的一切
  rationale: 形容词与复数“诫命”一致，字面可为“最先的和最后的”；此处用中文的全括表达传达首尾兼顾、全部遵守之意，但以脚注说明字面形式。
theological_decisions:
- issue: “在真实中/在真理中”修饰身份还是行为
  choice: 将ἐν ἀληθείᾳ理解为修饰“成为他的儿子”，译作“真真实实地”
  alternative: “在真理中成为他的儿子”
  rationale: 该短语紧接“儿子”，更自然地与前句相连；不过“真理”这一实体性含义仍可能成立，故列入脚注。
- issue: “最先和最后”是否表示全部诫命
  choice: 正文译为“从始至终的一切诫命”
  alternative: “最先的和最后的诫命”
  rationale: 希腊语保留首尾两端的修辞，语用上很可能指全部；中文若逐字翻译略显生硬且可能被误解为只有两类诫命，因此正文传达全括意义，脚注保留字面读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“儿子”保留原文亲属身份意象；“遵行诫命”沿用普通读者熟悉的经文语体，但避免过度古雅。
