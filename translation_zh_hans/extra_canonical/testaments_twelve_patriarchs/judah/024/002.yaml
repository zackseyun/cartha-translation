  text: '*Καὶ ἔσεσθε αὐτῷ εἰς υἱοὺς¹⁷ ἐν ἀληθείᾳ¹⁸, *καὶ πορεύεσθε¹⁸ ἐν προστάγμασιν¹⁹ αὐτοῦ πρώτοις καὶ ἐσχάτοις.'
