base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/003.yaml
  text: '[This is the shoot of the Most High God, a spring providing life to all flesh.]'
translation:
  language: zh_hans
  text: '[这就是至高上帝的嫩枝，也是赐生命给众人的泉源。]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστός
  choice: 嫩枝
  rationale: 指植物新生的枝条；在此保留其比喻性和可能的弥赛亚意涵，不扩译为带有解释性的称号。
- source_word: Θεοῦ ὑψίστου
  choice: 至高上帝的
  rationale: 按希腊语属格关系自然表达，并以现代、庄重的汉语保留“至高者”这一神圣称谓。
- source_word: πηγή
  choice: 泉源
  rationale: 既表达涌流之泉，也自然承载生命来源的比喻意义。
- source_word: πᾶσι
  choice: 众人
  rationale: 现存希腊文本仅作“给所有者／众者”，没有英文咨询层所加的“肉身”一词，因此不译作“凡有血肉的”。
- source_word: παρέχουσα ζωήν
  choice: 赐生命给
  rationale: 直接表达分词“提供、给予”与宾语“生命”的关系；“赐”符合庄重语体，但不额外规定生命的性质。
theological_decisions:
- issue: “嫩枝”与“泉源”是否指同一对象
  choice: 以“这就是……也是……”表达同一指示对象的两个意象
  alternative: 译为两个彼此独立的主语或省略第二个系词
  rationale: 希腊文 οὗτος 与 αὕτη 因 βλαστός 和 πηγή 的语法性别不同而变化，最自然地仍可理解为同一对象的两个述语意象。
- issue: πᾶσι 的范围
  choice: 译为“众人”
  alternative: “万有”或“凡有血肉的”
  rationale: πᾶσι 本身未明确补出名词；上下文及英文咨询层倾向有生命者，但“肉身”缺乏现存希腊词面依据。“众人”保留普遍性而避免增添未经明说的限定。
translation_notes:
  register: 采用现代标准普通话，语句简洁庄重。保留方括号，以反映所给希腊版本中整句的括注状态；正文无需脚注标记。
