  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/005.yaml
  text: And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.
translation:
  language: zh_hans
  text: 从她将生出一根公义之杖，面向列国；它要审判并拯救所有求告主的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ αὐτῆς
  choice: 从她
  rationale: 保留希腊语阴性代词的指称形式，不在本节中擅自明确其先行词。
- source_word: βλαστήσει
  choice: 而生
  rationale: 表达植物发芽、生出的意象，同时使现代汉语句子自然。
- source_word: ῥάβδος δικαιοσύνης
  choice: 一根公义的枝条
  rationale: ῥάβδος可指杖、杆或嫩枝；结合βλαστήσει的生长意象译作“枝条”，并保留“公义”的属格表达。
- source_word: τοῖς ἔθνεσι
  choice: 为列国而来
  rationale: 以“列国”表达ἔθνη，并把与格的受益或指向关系译出；“而来”为汉语顺畅所需的补足。
- source_word: κρῖναι καὶ σῶσαι
  choice: 要审判并拯救
  rationale: 保留两个并列不定式及其目的意味，不弱化审判与拯救之间的张力。
- source_word: ἐπικαλουμένους τὸν Κύριον
  choice: 求告主名的人
  rationale: “求告主名”是现代中文宗教语境中自然且准确的表达；“名”虽未在现存希腊文本中明写，却是汉语中表达求告某位对象的习惯结构。
theological_decisions:
- issue: “公义的ῥάβδος”是枝条还是权杖
  choice: 枝条
  alternative: 公义之杖／公义的权杖
  rationale: 动词βλαστήσει（发芽、生长）强烈支持植物意象；但原词本身也可带杖或权柄意味，因此不在正文中展开为明确的王权解释。
- issue: 审判与拯救的对象范围
  choice: 所有求告主名的人
  alternative: 审判列国，并拯救所有求告主的人
  rationale: 希腊语πάντας τοὺς ἐπικαλουμένους同时自然地作两个不定式的共同宾语；译文保持这种句法关联，不把审判与拯救分配给不同对象。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“列国”“求告主名”保留经文语体，但避免古奥句法。未添加脚注，因为正文可直接承载主要词义与歧义。
