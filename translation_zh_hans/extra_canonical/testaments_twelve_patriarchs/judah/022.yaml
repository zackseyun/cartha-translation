base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022.yaml
  text: The Lord will bring divisions among them against one another[a], and there will be continual wars in Israel. And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes[c][b],
translation:
  language: zh_hans
  text: '22章


    1 主必使他们彼此分裂；这种纷争在以色列中将接连不断[a]。2 我的王国将在外族人中走到尽头[b]，直到以色列的救恩来到[c]，直到公义之神显现，使雅各和万国安享和平。3 他必保守我王国的权势，直到永远[d]；因为主曾向我起誓，必不使这王国从我的后裔中永远消失。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所传希腊文本此处措辞不完整而且重复；也可理解为“以色列中将不断有战争”。
    reason: textual_difficulty
  - marker: b
    text: 或译：“我的王国将在外族人中得以完成。”希腊语动词既可表示“完成”，也可表示“终结”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“以色列的拯救。”这句话也可能带有弥赛亚意味，但原文没有明确说“救主”。
    reason: alternative_reading
  - marker: d
    text: “他”最自然可指前文的“公义之神”，但原文只用代词，没有进一步明确其所指。
    reason: referent_ambiguity
lexical_decisions:
- source_word: Ἐπάξει ... διαιρέσεις κατ᾽ ἀλλήλων
  choice: 必使他们彼此分裂
  rationale: ἐπάξει 表明主使某事临到，διαιρέσεις 指内部的分裂，κατ᾽ ἀλλήλων 强调彼此敌对。合并译法自然地保留了神的主动作用和相互对立之意。
- source_word: συνεχεῖς ... ἐν Ἰσραήλ
  choice: 这种纷争在以色列中将接连不断
  rationale: 所给希腊文本此处句法有压缩或讹缺，形容词 συνεχεῖς 明确表达持续不断。译文以“纷争”承接前句的“分裂”，同时用脚注说明也可理解为不断的战争。
- source_word: ἀλλοφύλοις
  choice: 外族人
  rationale: 该词可特指非本族之人，某些语境也指非利士人；本段预言性的宽广语境更适合泛指外族人。
- source_word: συντελεσθήσεται ἡ βασιλεία μου
  choice: 我的王国将……走到尽头
  rationale: συντελεσθήσεται 可表示完成，也可表示终结。分裂与持续纷争的上下文较支持终结义，但脚注保留“完成”的可能。
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  choice: 以色列的救恩
  rationale: 中性名词 σωτήριον 通常指救恩或拯救，而非明确指一位“救主”；此译保留其事件性及可能具有的弥赛亚意味。
- source_word: παρουσίας Θεοῦ τῆς δικαιοσύνης
  choice: 公义之神显现
  rationale: παρουσία 可指来到、临在或显现；译作“显现”适合预言语境。Θεοῦ τῆς δικαιοσύνης 直译为“公义之神”，不把它改释为特定教义称号。
- source_word: τοῦ ἡσυχάσαι τὸν Ἰακὼβ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη
  choice: 使雅各和万国安享和平
  rationale: ἡσυχάζω 在此表示得安静、得安息；将雅各与万国同作受事者，符合宾格结构，并以现代汉语表达和平安息。
- source_word: φυλάξει κράτος τῆς βασιλείας μου
  choice: 必保守我王国的权势
  rationale: φυλάξει 表示守护、保存，κράτος 指力量、权势或统治能力。“保守……权势”兼顾原文形式与王权语境。
- source_word: ἐκ τοῦ σπέρματός μου
  choice: 从我的后裔中
  rationale: σπέρμα 在王朝应许语境中指血脉后裔，译作“后裔”比字面的“种子”自然准确。
theological_decisions:
- issue: τὸ σωτήριον τοῦ Ἰσραήλ 是否指一位救主
  choice: 以色列的救恩
  alternative: 以色列的拯救；以色列的救主
  rationale: 原文采用中性名词，最直接指救恩或拯救。译文不将潜在的弥赛亚意味排除，也不把它明确人格化。
- issue: συντελεσθήσεται 所表达的是终结还是成全
  choice: 走到尽头
  alternative: 得以完成；在外族人中达到成全
  rationale: 本段的分裂、纷争语境支持负面的终结义；但该动词确有“完成”的语义，因此在脚注中保留另一理解。
- issue: 第3节 αὐτός 的所指
  choice: 他
  alternative: 公义之神；与以色列救恩相关的那一位
  rationale: 最近的明确阳性指称是“神”，但上下文中的“救恩”与“显现”可能使读者感到所指具有张力。保留代词，不擅自增补专名或身份。
- issue: 王国永存与第2节王国终结之间的张力
  choice: 同时保留“走到尽头”与“直到永远”
  alternative: 把前者解释为王国在外族中的成全，以消除表面张力
  rationale: 原文同时陈述王国在外族人中终结及王权从后裔中不被涂抹。译文不以神学协调改写其中的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“安享和平”“走到尽头”等表达便于普通读者理解，同时保留预言与遗训体的肃穆语气。对残缺句法、词义双关和代词所指均以脚注说明，不在正文中作过度解释。
