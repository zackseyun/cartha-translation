  source_fidelity: 译文完整涵盖所给希腊文第1—3节。第1节对重复且句法不完整的“ἔσονται συνεχεῖς ἔσονται”采取审慎的语义补足，并以脚注明示文本困难及“不断有战争”的可能；未将该不稳定处武断地定为唯一读法。第2节保留“王国”在外族人中“走到尽头”与“得以完成”的词义张力，也完整译出随后原英文审计文本未列出的“公义之神的显现”及雅各、万国得享和平。第3节准确保留代词所指的未定性、王权的权势，以及主对后裔王国永不被涂抹的誓言。
