  text: Ἐν δὲ τῷ ἀπιέναι ἡμᾶς²², ἄνδρες †Βαβουὲ ἐπελάβοντο²³ τὴν αἰχμαλωσίαν ἡμῶν, καὶ ἰδόντες ἡμεῖς συνῆψαν πόλεμον μετ᾽ αὐτῶν²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/006.yaml
  text: And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue.
translation:
  language: zh_hans
  text: 我们离开时，巴布埃[a]人夺取了我们的俘虏；我们看见后，就与他们交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴布埃”原文作 Βαβουὲ，抄本所传名称可能有讹误；有译本作“塔福埃”。
    reason: 底本以 † 标示该名称存在文本疑难，且咨询层采用了不同地名形式，故保留音译并说明异文情况。
lexical_decisions:
- source_word: ἐν δὲ τῷ ἀπιέναι ἡμᾶς
  choice: 我们离开时
  rationale: 以自然的现代汉语表达希腊语的时间结构，同时保留叙事的承接关系。
- source_word: ἄνδρες Βαβουὲ
  choice: 巴布埃人
  rationale: 将疑似地名 Βαβουὲ 音译，并把 ἄνδρες 按某地居民的自然汉语表达处理；原文名称有校勘疑问，另加脚注说明。
- source_word: ἐπελάβοντο τὴν αἰχμαλωσίαν ἡμῶν
  choice: 夺取了我们的俘虏
  rationale: ἐπιλαμβάνομαι 在此表示抓住、夺取；αἰχμαλωσία 可指被掳的人或俘获之物，结合语境译作集体意义的“俘虏”。
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: 就与他们交战
  rationale: 准确传达“同他们接战”的意思，并采用简洁自然的叙事措辞。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。译文以所给希腊文本为准；英语咨询文本中“把他们交给我们的儿子们”和“直到塔福埃”等内容不见于本句所给希腊文，因此未纳入正文。
