  source_fidelity: 译文忠实呈现所给希腊文的时间从句、巴布埃人的袭夺行动，以及随后交战的叙述。英语审校文本所含“交给我们的儿子们”及“直到塔福埃”不见于此处提供的希腊底本，未据此增译，处理正确。末句希腊文人称形式本身似有不协调之处（ἡμεῖς／ἰδόντες 与 συνῆψαν），译文依显见叙事指向译为“我们……交战”，不擅自制造额外内容。
