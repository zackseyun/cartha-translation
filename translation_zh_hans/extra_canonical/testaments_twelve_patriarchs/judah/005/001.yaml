  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/001.yaml
  text: And on the next day we went to Areta, a city still mighty and strong, threatening us with death.
translation:
  language: zh_hans
  text: 第二天，我们前往阿雷塔；那是一座坚固的城，扬言要置我们于死地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: 第二天
  rationale: 此处是省略名词的时间表达，按上下文自然译作“第二天”。
- source_word: ἀπήλθομεν εἰς Ἀρετάν
  choice: 我们前往阿雷塔
  rationale: ἀπέρχομαι 与 εἰς 连用表示离开原处往目的地去；“前往”简洁自然，不必生硬译出“离去”。地名按音译处理。
- source_word: πόλιν κραταιάν
  choice: 一座坚固的城
  rationale: κραταιός 表示强有力、强固；修饰城邑时“坚固”最切合语境。原文没有“仍然”，故不随英语咨询层增译。
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: 扬言要置我们于死地
  rationale: 保留分词对该城的拟人化描述；“扬言”传达 ἀπειλέω 的威吓意味，“置我们于死地”自然表达以死亡相威胁。
