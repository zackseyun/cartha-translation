lexical_decisions:
- source_word: οἱ ἐπὶ τοῦ τείχους
  choice: 城墙上的人
  rationale: 直接表达其所在位置，符合现代汉语习惯，也保留原文未明确其身份的特点。
- source_word: ὅτι ἡμεῖς μόνοι ἐσμέν
  choice: 以为只有我们几个人
  rationale: ὅτι在此引出他们作出反应所依据的判断；「几个人」自然传达μόνοι所强调的孤立无援，而不把μόνοι误解为人数仅有一人。
- source_word: ἐφειλκύσθησαν
  choice: 被吸引
  rationale: 保留被动形式以及「被引诱/吸引而靠近」的意象，不强化为原文未明说的主动攻击。
- source_word: πρὸς ἡμᾶς
  choice: 到我们这边来
  rationale: 准确表达朝向说话者一方的移动，避免译成「攻击我们」而过度解释。
