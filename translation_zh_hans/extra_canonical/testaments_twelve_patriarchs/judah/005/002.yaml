  text: But I and Gad attacked from the east of the city, and Reuben and Levi from the west.
translation:
  language: zh_hans
  text: 但我和迦得从城东发起攻击，吕便和利未则从城西发起攻击。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέφθημεν
  choice: 发起攻击
  rationale: 该动词在此处叙述围攻中的军事行动；结合从城东、城西夹击的语境，译作“发起攻击”比直译为“先到”或“接近”更自然，也与英语审校层的理解一致。
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως
  choice: 从城东
  rationale: 简洁表达由城市东面进攻的方位关系；复数形式ἀνατολῶν在此为惯用方位表达。
- source_word: ἀπὸ δυσμῶν
  choice: 从城西
  rationale: 按上下文补出“城”，清楚呈现与“从城东”相对的进攻方向。
