  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/004.yaml
  text: But all my brothers, having driven stakes into the wall from both sides, entered the city while they were unaware.
translation:
  language: zh_hans
  text: 我的兄弟们就这样从城墙两侧暗中进入了城里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ οὕτως
  choice: 就这样
  rationale: 承接上文并表达方式或结果；现代汉语中自然，同时不把连接关系过度限定为转折或因果。
- source_word: λάθρα
  choice: 暗中
  rationale: 直接保留“不让人察觉、秘密进行”的副词意义。
- source_word: οἱ ἀδελφοί μου
  choice: 我的兄弟们
  rationale: 原文没有表示“所有”的词，因此不增译“所有”。
- source_word: ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους
  choice: 从城墙两侧
  rationale: ἑκατέρων 指两者各自，结合城墙语境自然译为“两侧”，不添加原文未见的木桩或攀爬动作。
- source_word: εἰσῆλθον εἰς τὴν πόλιν
  choice: 进入了城里
  rationale: 准确表达进入城中的动作，采用通顺的现代汉语。
theological_decisions: []
