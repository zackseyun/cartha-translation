  text: And we killed them also, and burned the city, and everything in it.
translation:
  language: zh_hans
  text: 我们杀了他们所有人[a]，又夺回了我们被掳去的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们所有人”直译为“所有人”；具体所指须由上下文确定。此处所给希腊文本后半句为“又夺回了我们被掳去的人”。英文咨询文本所说“烧了城和城里的一切”不见于这份希腊文本。
    reason: 说明πάντας未明示所指，并记录英文审校文本与所给希腊底本之间的实质差异，不将后者未载的内容纳入正文。
lexical_decisions:
- source_word: Ἀπεκτείναμεν
  choice: 我们杀了
  rationale: 直译第一人称复数不定过去时，简洁保留叙事动作。
- source_word: πάντας
  choice: 所有人
  rationale: 保留希腊文“所有人／他们全都”的概括性；其具体所指须由上下文确定。
- source_word: πάλιν
  choice: 又
  rationale: 自然表达动作的再次发生或随后恢复原状。
- source_word: ἐλάβομεν
  choice: 夺回了
  rationale: 结合宾语“我们的俘虏”，译出重新取得之意，同时不采用英文咨询文本中无希腊文依据的“烧城”。
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: 我们的俘虏
  rationale: αἰχμαλωσία可指被掳者、俘虏或掳获之物；这里以集合意义的“俘虏”表达，保留其可能指被俘人员的含义。
