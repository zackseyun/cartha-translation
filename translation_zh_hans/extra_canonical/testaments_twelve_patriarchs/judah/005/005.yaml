  text: And we took it by the edge of the sword, and those who had fled for refuge in the tower we burned with fire; and so we captured them all.
translation:
  language: zh_hans
  text: 我们用刀剑攻取了那城，将逃进塔楼避难的人用火焚烧。这样，我们擒获了所有人，也夺取了他们的一切财物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβομεν αὐτήν
  choice: 攻取了那城
  rationale: καταλαμβάνω在军事语境中表示夺取、攻占；阴性代词αὐτήν指向上下文中的城，汉语明说“那城”比直译“它”自然清楚。
- source_word: ἐν στόματι μαχαίρας
  choice: 用刀剑
  rationale: 原文直译为“在刀剑之口”，是以刀剑攻取的固定表达；译作“用刀剑”保留武力方式，同时避免现代汉语中生硬难解的“刀口”。
- source_word: τοὺς ἐν τῷ πύργῳ καταφυγόντας
  choice: 逃进塔楼避难的人
  rationale: 保留καταφεύγω所含“逃往某处寻求庇护”之意，并按单数πύργῳ译为“塔楼”。
- source_word: ἐν πυρὶ ἐνεπρήσαμεν
  choice: 用火焚烧
  rationale: 准确表达ἐμπίμπρημι的纵火焚烧含义，不额外断定原文未明确说出的死亡结果。
- source_word: πάντας ἐλάβομεν
  choice: 擒获了所有人
  rationale: λαμβάνω在此军事语境中可指抓获或取得；以“擒获”自然地区分人和随后被夺取的财物。
- source_word: πάντα τὰ αὐτῶν
  choice: 他们的一切所有
  rationale: 保留希腊原文末尾“他们所有的一切”，指其全部所有物；该成分在英文咨询文本中省略，但原文证据明确，应予翻译。
