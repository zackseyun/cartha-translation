  text: 'And now I command you[a], my children: hear Judah your father, and keep my words, with thoughts set on doing all the righteous requirements of the Lord and obeying the commands of God.


    Because I boasted that in wars the face of a beautiful woman had not deceived me, and I reproached Reuben my brother concerning Bilhah, my father’s wife, the spirit of jealousy and of sexual immorality arrayed themselves against me, until I sinned with Anan the Canaanite woman and with Tamar my daughter-in-law.


    For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, in the name of his daughter, he showed me an immeasurable abundance of gold, for he was a king. And he adorned her with gold and pearls[d][c][b], and made her pour wine for us at the banquet.'
translation:
  language: zh_hans
  text: '《犹大遗训》第13章


    1 现在，我吩咐你们，我的孩子们：要听你们父亲犹大的话[a]，谨守我的言语，实行主一切公义的律例，顺从上帝的诫命。


    2 不要随从自己的欲望，也不要心里骄傲；不要夸耀自己的作为和年轻时的力量，因为这在主面前也是恶的。


    3 我曾夸口说，在战争中，美貌女子的容颜没有迷惑我[b]；我又因父亲的妻子辟拉而责备我的兄弟流便。于是，嫉妒和淫乱之灵列阵攻击我，直到我同那迦南女子[c]犯罪，又同我的儿媳她玛犯罪。


    4 我曾对岳父说：“我要先同我父亲商议，然后才娶你的女儿。”他却不肯，反而为把女儿给我，向我展示数不尽的黄金[d]，因为他是王。


    5 他用黄金和珍珠装扮她，又使她以美丽的容貌在宴席上为我们斟酒。


    6 酒使我的眼目迷乱，享乐使我的心昏暗。


    7 我恋慕她，便与她同寝，违背了主的命令，也违背了我父亲的命令，娶她为妻。


    8 主照我心中的图谋报应了我，因为我没有从她所生的儿女得着喜乐。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的希腊文句法略显生硬；大意是孩子们应当听从身为父亲的犹大，并谨守他的话。
    reason: textual_variant
  - marker: b
    text: 所给希腊正文中，“迷惑我”前的否定词没有清楚呈现；但上下文是犹大因自信而夸口，随后却受迷惑，因此正文按此语意补出“没有”。若不补，可译为“美貌女子的容颜迷惑了我”。
    reason: textual_variant
  - marker: c
    text: 所给希腊正文只作“那迦南女子”，没有人名；有些传本或解释传统在这里出现“亚南”一名，并将此事同《创世记》38章犹大娶迦南女子的记载联系起来。
    reason: alternative_reading
  - marker: d
    text: 这里的希腊短语含义不十分明确，直译近于“为给出她而向我展示数不尽的黄金”。它可能指与婚事相关的财富展示，但原文没有明确说明黄金与交付女儿之间的具体关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: 吩咐
  rationale: 保留父亲临终训诫的权威语气，同时比“命令”更符合现代汉语中的父子语境。
- source_word: φυλάξασθε
  choice: 谨守
  rationale: 兼顾保存、留心和遵行言语的伦理含义，也是宗教训诫语境中自然庄重的表达。
- source_word: δικαιώματα
  choice: 公义的律例
  rationale: 用“律例”表达具体而有约束力的神圣规范，并以“公义的”保留词根所含的正义色彩。
- source_word: ἐπιθυμιῶν
  choice: 欲望
  rationale: 原词可泛指强烈欲求；本句不宜仅限缩为性欲，因此采用范围较宽的“欲望”。
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: 嫉妒和淫乱之灵
  rationale: 保留《十二族长遗训》中把恶欲人格化为敌对属灵力量的语言，不将其淡化为纯粹心理状态。
- source_word: παρετάξατο
  choice: 列阵攻击
  rationale: 保存原文鲜明的军事隐喻，也呼应犹大此前以战争能力自夸的语境。
- source_word: συνετέλεσα εἰς
  choice: 同……犯罪
  rationale: 该短语在此语境中委婉且文本困难；译文表达忏悔性的道德判断，但不额外细化行为。
- source_word: εἰς δόσιν αὐτῆς
  choice: 作为把女儿给我的条件
  rationale: 原短语生硬，语境涉及婚配与财富展示；此译法保持二者关联，同时用脚注说明不确定性。
- source_word: διέστρεψέν μου τοὺς ὀφθαλμούς
  choice: 使我的眼目迷乱
  rationale: 既保留感官受酒扭曲的意象，又符合自然现代汉语。
- source_word: τὸ διαβούλιον τῆς ψυχῆς μου
  choice: 我心中的图谋
  rationale: “图谋”体现经过盘算的内在意向，并保留负面的道德语气。
theological_decisions:
- issue: 恶欲之灵是否仅指内在心理倾向
  choice: 保留“嫉妒和淫乱之灵”作为主动列阵攻击犹大的力量
  alternative: 译作“嫉妒和淫乱的念头支配了我”
  rationale: 原文使用单数“灵”并搭配军事动词，具有真实的人格化张力；译文不裁定其本体性质，也不将其心理化。
- issue: συνετέλεσα 所指行为的道德表达
  choice: 译作“同……犯罪”
  alternative: 译作“同……发生关系”或“与……成就了那事”
  rationale: 上下文是悔罪劝诫，原表达又带委婉色彩；“犯罪”保留道德框架而不作超出文本的生理描写。
- issue: 主的报应与子女之乐
  choice: 直译为主照犹大心中的图谋报应他，使他不能从儿女得乐
  alternative: 解释为主使其子女夭折或邪恶
  rationale: 原文没有明说报应实现的具体方式，应保留因果关系及其未说明之处。
- issue: 神圣规范的词汇区分
  choice: 将 δικαιώματα 译为“公义的律例”，ἐντολαί 译为“诫命”
  alternative: 两者均译为“命令”
  rationale: 保留原文词汇差异，并以普通读者熟悉的庄重汉语呈现。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，并保留遗训体的父亲训诫口吻。第2—8节均依所给希腊正文翻译，没有因英文咨询层的缺文而省略。神学上保留人格化恶欲、人的责任与神的报应之间的张力；对第3、4节的文本和句法困难以脚注公开说明，不在正文中过度释义。
