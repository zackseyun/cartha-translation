    issue: 第4节把“εἰς δόσιν αὐτῆς”译为“作为把女儿给我的条件”。
    rationale: “条件”不是原文明确表达，且该短语本身困难。译文应保留其可能指交付女儿／婚事相关财富展示的模糊性，交由脚注说明。
  - severity: medium
    issue: 第6节把“ἡ ἡδονή”限缩为“情欲”。
    rationale: 该词意为欢愉、享乐、快感，虽在上下文可含性意味，却不必在此处限定为性欲；“享乐”更贴近原文的宽度。
  - severity: low
    issue: 第5节“使她显出女子的美貌”对“ἐν κάλλει γυναικῶν”处理略松，并与装饰动作绑定。
    rationale: 原文接着说她在宴席上斟酒；改作“使她以美丽的容貌……斟酒”可保留画面和句法关联。
  - severity: low
    issue: 人名“吕便”不合现代中文圣经中更通行的译名。
    rationale: “流便”是现代中文圣经语境中最常见的对应译名，宜保持名称辨识度与一致性。
