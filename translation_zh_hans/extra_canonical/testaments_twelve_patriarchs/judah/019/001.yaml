  text: My children, the love of money leads to idolatry.
translation:
  language: zh_hans
  text: 我的孩子们，贪爱钱财会把人引向偶像崇拜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  choice: 我的孩子们
  rationale: 直译亲切的称呼，并保留复数含义。
- source_word: ἡ φιλαργυρία
  choice: 贪爱钱财
  rationale: 既表达对金钱的过度贪恋，也比单用“贪财”更清楚地体现抽象名词的含义。
- source_word: πρὸς εἰδωλολατρίαν
  choice: 向偶像崇拜
  rationale: πρός在此与表示引导的动词连用，指出所趋向的目标；中文译文以“引向偶像崇拜”自然呈现。
- source_word: ὁδηγεῖ
  choice: 会把人引向
  rationale: 保留“引导、带往”的动态意象；补出泛指宾语“人”，使现代汉语表达完整自然。
theological_decisions:
- issue: 贪爱钱财与偶像崇拜的关系
  choice: 译作“会把人引向”，表达趋向或导致关系
  alternative: 译作“就是偶像崇拜”
  rationale: 原文使用ὁδηγεῖ（引导、带领），并未将两者直接等同，因此不应强化为身份判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留劝诫语气和原文的因果趋向，不添加宗派性解释。
