  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/003.yaml
  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
translation:
  language: zh_hans
  text: 第五天，玛吉人又来攻击我们。我们以强大的刀剑[a]向他们冲杀，胜过了他们；没等他们攀上那处坡道[b]，就杀了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处的προσδίδωσι是第三人称单数现在时，与上下文第一人称复数的过去时叙事在句法上不协调，可能是抄写时的压缩或讹误。译文未改动希腊文本，而按上下文所显示的进攻动作译为“向他们冲杀”。
    reason: textual_variant
  - marker: b
    text: “攀上那处坡道”所译的希腊语采用同源动词和名词，字面是“登上那上坡之路”，可指斜坡、隘道或设防的上行通道。不定式本身没有明说动作主体；译文依战斗语境理解为敌军尚未登上该处。
    reason: lexical_note
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示先前的冲突再次发生；“又”在叙事中简洁自然。
- source_word: ἀπὸ Μαχίρ
  choice: 玛吉人
  rationale: 介词短语直译为“来自玛吉的人”；正文用“玛吉人”自然表达其来源或所属群体，而不额外判定玛吉是城邑、地区还是宗族。
- source_word: ἐπῆλθον ἡμῶν
  choice: 来攻击我们
  rationale: ἐπέρχομαι在此军事语境中带敌对含义；“来攻击”既保留趋向，也明确表达进攻之意。
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: 挥着强有力的刀剑
  rationale: κραταιός意为强壮、有力；μάχαιρα指刀剑。“挥着”自然表达工具性的ἐν，并保持原文高昂的战斗语气。
- source_word: περιγινόμεθα αὐτῶν
  choice: 胜过了他们
  rationale: περιγίγνομαι接属格可指占上风、胜过；此译准确而符合庄重的军事叙事。
- source_word: ἀναβῆναι τὴν ἀνάβασιν
  choice: 登上坡道
  rationale: 原文采用同源动词与名词，字面近于“登上那上坡之路”；汉语用“登上坡道”保留向上攀登及战术地形的含义，避免生硬重复。
