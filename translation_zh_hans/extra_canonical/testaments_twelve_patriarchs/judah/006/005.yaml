  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/005.yaml
  text: And having hidden Simeon and the others[a] behind them[b], we seized the height, and utterly destroyed this city also.
translation:
  language: zh_hans
  text: 我把西缅和其余的人[a]藏在他们后方[b]，然后我们夺取了高地，也把这座城彻底毁灭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西缅和其余的人”：原文直译可作“西缅以及另一位（或其余的人）”。τε…καί 将西缅与另一人或一组人并列，但没有明说后者是谁。
    reason: lexical_note
  - marker: b
    text: “在他们后方”：原文是一个少见的副词，意为“从后面”或“在后方”，这里描写将伏兵部署在敌军后侧。
    reason: cultural_note
lexical_decisions:
- source_word: ὑποκρύψας
  choice: 藏
  rationale: 该词表示有意隐藏或隐蔽；结合军事语境，“藏”简洁自然，并能传达战术性埋伏的动作。
- source_word: τὸν τε καὶ Συμεὼν
  choice: 西缅和其余的人
  rationale: 原文 τε…καί 的结构把西缅与另一人或一组未明说的人并列。正文采用自然中文表达，脚注保留原文指称不明确之处。
- source_word: ἐξωπίσθεν
  choice: 在他们后方
  rationale: 这个少见的副词表示“从后面”或“在后方”，此处描写把伏兵安置于敌方后侧的包抄部署。
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: 我们夺取了高地
  rationale: ἐπιλαμβάνομαι 加属格有抓住、占取之意；名词化的 ὑψηλός 指高处或高地。“夺取了高地”符合军事语境。
- source_word: ἐξωλοθρεύσαμεν
  choice: 彻底毁灭
  rationale: 该强化复合动词表示完全毁灭；“彻底毁灭”保留其强化语气，也适合以城为宾语。
- source_word: καὶ ταύτην τὴν πόλιν
  choice: 也把这座城
  rationale: καί 带有追加意味，表明此城是接连遭攻取的城之一；“也”保留这种累加语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“高地”“后方”等常用军事词汇清楚呈现战术场景；不把原文对西缅同伴身份的含混作过度确定。
