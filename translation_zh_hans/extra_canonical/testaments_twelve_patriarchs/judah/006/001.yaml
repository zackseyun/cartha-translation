  text: And as I was by the waters of Chozeba, those from Jobel came against us for battle.
translation:
  language: zh_hans
  text: 我在科泽巴水边的时候，从约伯勒来的人前来攻打我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς ὕδασι Χωζηβά
  choice: 在科泽巴水边
  rationale: ἐν 配合复数“水域”可表示身处水边或水域附近；结合叙事语境译作自然的现代汉语“在……水边”，不误解为人在水中。Χωζηβά按音译作“科泽巴”。
- source_word: οἱ ἀπὸ Ἰωβὴλ
  choice: 从约伯勒来的人
  rationale: 保留 ἀπό 所表达的来源，并将地名 Ἰωβήλ 音译为“约伯勒”；该词文本有校勘疑点，正文不擅自改定为其他地名。
- source_word: ἦλθον ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: 前来攻打我们
  rationale: 直译结构为“来到我们这里，为要争战”；“前来攻打我们”以简洁自然的汉语完整表达敌对行动及战争目的。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“……的时候”自然呈现 ὡς 引出的时间从句；地名依希腊文音译。原文两个地名带有版本注记，但所给资料未提供可供读者使用的异文内容，因此不增设无实质说明的脚注。
