  text: And as we came to the city[a], their women were rolling stones down on us from the summit of the mountain on which the city stood.
translation:
  language: zh_hans
  text: 我们来到那城的时候[a]，他们的妇女正从城所在的山顶上把石头滚下来，砸向我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“τῇ τῇ πόλει”，与格冠词τῇ重复了一次，显然是抄写时的重文；译文按一个τῇ πόλει（“到那城”）理解。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκύλιον
  choice: 把……滚下来
  rationale: 未完成时表示当时正在进行或反复发生的动作；结合山顶地势，“滚下来”自然呈现持续的防御行动。
- source_word: λίθους ἐφ’ ἡμᾶς
  choice: 把石头滚下来砸我们
  rationale: λίθους意为“石头”，ἐφ’加宾格表示朝向并带有敌对意味；“砸我们”清楚传达石头滚向众人的攻击目的。
- source_word: κορυφῆς τοῦ ὄρους
  choice: 山顶
  rationale: κορυφή指最高处、顶端，ὄρος指山；现代汉语用“山顶”准确而自然。
- source_word: ἐν ᾗ ἦν ἡ πόλις
  choice: 城所在的山
  rationale: 关系从句说明那座城位于这座山上；“城所在的山”忠实保留空间关系，并避免增加原文未明说的“屹立”或“筑于”等含义。
