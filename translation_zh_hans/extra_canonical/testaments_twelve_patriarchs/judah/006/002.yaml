  text: Καὶ *συνάψαντες ἐτρέψαμεν⁴ αὐτοὺς⁵ καὶ τοὺς ἀπὸ Σιλὼμ⁶ συμμάχους αὐτῶν⁷ ἀπεκτείναμεν⁸ καὶ οὐκ ἐδώκαμεν αὐτοῖς⁹ διέξοδον¹⁰ τοῦ εἰσελθεῖν πρὸς ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/002.yaml
  text: And when we joined battle, we routed them; and we killed those from Shiloh, their allies, and gave them no way of escape.
translation:
  language: zh_hans
  text: 我们交战时，击溃了他们；又杀了那些来自示罗、作他们盟友的人；不让他们有路来到我们这里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“没有给他们通路来到（或进入）我们这里”。“通路”一词也可指“出路”，所以有些译本依战事语境译为“不给他们逃脱的路”；但原文后面明确说“来到／进入我们这里”，并未明说“逃脱”或“进攻”。
    reason: 说明διέξοδον可有“通道／出路”的范围，同时保留τοῦ εἰσελθεῖν πρὸς ἡμᾶς所明示的方向，避免将语境性解释当作正文确定含义。
lexical_decisions:
- source_word: συνάψαντες
  choice: 一交战
  rationale: 该分词在军事语境中指接战、交锋；用“一交战”自然表达它与主句动作之间的时间关系。
- source_word: ἐτρέψαμεν
  choice: 击溃了
  rationale: 此处表示使敌军转身败退；“击溃”比单纯“赶走”更符合军事语境。
- source_word: τοὺς ἀπὸ Σιλὼμ
  choice: 来自示罗……的人
  rationale: Σιλὼμ对应通常译作“示罗”的地名；保留“来自”以反映ἀπό。
- source_word: συμμάχους
  choice: 与他们结盟的人
  rationale: 明确表达其盟军身份，同时避免较生硬的名词堆叠。
- source_word: διέξοδον
  choice: 通路
  rationale: 该词可指通道、出路或可通过之路；结合后接的不定式，译作“通路”最能保留原句结构。
theological_decisions:
- issue: 末句所指方向及目的
  choice: 不给他们留下攻到我们这里的通路
  alternative: 不给他们留下逃脱的路
  rationale: 希腊文τοῦ εἰσελθεῖν πρὸς ἡμᾶς直译为“进入／来到我们这里”，并非明确说“逃脱”。军事语境容许将动作理解为进攻，但不宜无注释地改成逃跑。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一交战，就击溃”保持战事节奏；地名采用中文圣经传统常见译名“示罗”。
