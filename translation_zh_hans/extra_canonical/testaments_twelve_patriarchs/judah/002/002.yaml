  text: I know that I ran with a hind and caught it, and I made it food for my father, and he ate.
translation:
  language: zh_hans
  text: 我知道，我曾和一只母鹿一起奔跑，抓住了它；我把它做成食物给我父亲，他吃了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: 我知道
  rationale: 直译其现在时认知表达；在叙事回忆中保留说话者对往事的确知。
- source_word: συνέδραμον ἐλάφῳ
  choice: 与一只母鹿赛跑
  rationale: συντρέχω 与与格可表达“与……一同奔跑/赛跑”；结合下文追上并捕获，译作“赛跑”自然且不弱化其力量表现。ἐλάφῳ 按上下文及英语审校层译为“母鹿”。
- source_word: ἐπίασα αὐτήν
  choice: 追上了它
  rationale: πιάζω 可指抓住、捕获；此处紧接赛跑，译作“追上”保留竞速语境。猎获之意由后文做成食物明确呈现。
- source_word: ἐποίησα αὐτὴν βρῶμα
  choice: 把它做成食物
  rationale: 贴近希腊文使役结构，既可理解为宰制预备，也不增添原文未明说的烹调细节。
- source_word: τῷ πατρί μου
  choice: 给我父亲
  rationale: 与格表示受益者，采用现代汉语自然表达。
- source_word: ἔφαγεν
  choice: 他就吃了
  rationale: 保留简单过去叙述及父亲为主语的自然承接。
