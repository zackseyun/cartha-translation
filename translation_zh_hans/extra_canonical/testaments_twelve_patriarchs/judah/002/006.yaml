  text: A leopard in Hebron sprang upon the dog, and I caught it by the tail and hurled it against the rock, and it was split in two.
translation:
  language: zh_hans
  text: 在希伯仑，一只豹子扑向那条狗；我抓住豹子的尾巴，把它猛摔在岩石上，它就裂成了两半。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάρδαλις
  choice: 豹子
  rationale: 指豹类猛兽；“豹子”是现代汉语自然、明确的对应词。
- source_word: προσεπήδησεν ἐπὶ
  choice: 扑向
  rationale: 表达猛兽跃起袭向目标的动作，既保留方向性，也符合现代汉语叙事。
- source_word: πιάσας ... ἀπὸ τῆς κέρκου
  choice: 抓住豹子的尾巴
  rationale: 准确呈现从尾部将其抓住的动作；补出“豹子”可避免汉语代词指向含混。
- source_word: ἀπηκόντισα
  choice: 猛摔
  rationale: 该动词在此表示用力投掷、猛掷；结合目标为岩石，“猛摔在”比单纯“扔”更能传达力度和撞击结果。
- source_word: ἐρράγη εἰς δύο
  choice: 裂成了两半
  rationale: 保留被猛烈撞击后分裂为两部分的直陈含义，不弱化其夸张而强烈的叙事形象。
