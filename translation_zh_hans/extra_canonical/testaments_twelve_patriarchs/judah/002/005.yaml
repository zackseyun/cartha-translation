lexical_decisions:
- source_word: κατέδραμον
  choice: 追赶
  rationale: 该动词在这里表示奔跑追逐；译作“追赶”既保留动作方式，也与下文“赶上”自然衔接。
- source_word: προέλαβον
  choice: 赶上了
  rationale: 按语境表达追逐中追及猎物，不采用容易产生“预先取得”歧义的直译。
- source_word: ἐν τῷ τρέχειν με
  choice: 在奔跑中
  rationale: 保留希腊文所明确表达的同时性，并使现代汉语简洁自然。
- source_word: κατεσπάραξα
  choice: 撕碎了
  rationale: 体现该强化动词所表示的猛烈撕裂、撕成碎片之意。
