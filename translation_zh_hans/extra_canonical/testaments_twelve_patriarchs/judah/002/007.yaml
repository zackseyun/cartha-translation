  text: I found a wild ox grazing in the land, and, taking hold of its horns, I shook it all around and blinded it.
translation:
  language: zh_hans
  text: 我发现一头野牛正在那地吃草；我抓住它的角，把它四下摇晃，把它弄瞎了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βοῦν ἄγριον
  choice: 一头野牛
  rationale: 直译为“野生的牛”；“野牛”在现代汉语中自然、简洁，也保留其凶猛的形象。
- source_word: τὴν χώραν νεμόμενον
  choice: 在那地吃草
  rationale: νέμομαι在此指牲畜放牧、吃草；“在那地吃草”符合现代汉语表达。
- source_word: κρατήσας τῶν κεράτων
  choice: 抓住它的角
  rationale: κρατέω表示牢牢抓住或制住；汉语用“抓住”自然，并保留动作力度。
- source_word: κύκλῳ συσσείσας
  choice: 四下猛摇
  rationale: κύκλῳ有“环绕、向各处”之意，συσσείω表示猛烈摇动；“四下猛摇”避免误解为只绕圈旋转。
- source_word: σκοτίσας
  choice: 使它眼前发黑
  rationale: 该词本义为使之黑暗，也可在此语境中表示使其失去视觉；此译保留“变暗”与“弄瞎”之间的语义张力，不武断判定为永久致盲。
- source_word: ῥίψας
  choice: 把它摔倒
  rationale: ῥίπτω意为扔、掷；在制服野牛的语境中，“摔倒”最符合动作对象与自然汉语。
- source_word: ἀνεῖλον αὐτόν
  choice: 杀了它
  rationale: ἀναιρέω在此表示杀死、除掉；直译为“杀了它”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而有动作感的叙述语言。“四下猛摇”与“摔倒”使连续动作清晰；“使它眼前发黑”保留希腊词的形象和可能歧义。仅翻译《犹大遗训》2:7，不纳入随后标为第8节的句子。
