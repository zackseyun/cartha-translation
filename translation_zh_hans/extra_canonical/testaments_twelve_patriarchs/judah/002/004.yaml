  text: I caught a wild mare and, after seizing it, I subdued it.
translation:
  language: zh_hans
  text: 我杀死了狮子，从它口中夺出一只山羊羔。我又抓住熊的一只脚，把它摔下悬崖；它便粉身碎骨。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφειλόμην ἔριφον ἐκ τοῦ στόματος αὐτοῦ
  choice: 从它口中夺回一只山羊羔
  rationale: ἀφαιρέω在此表示从狮子口中夺取、救回；ἔριφος指小山羊。译为“夺回”自然传达从猛兽口中抢救猎物的语境。
- source_word: τὴν ἄρκον λαβὼν ἀπὸ τοῦ ποδός
  choice: 抓住熊的一只脚
  rationale: 保留分词结构的先行动作；πούς可指脚或腿，此处直译为“脚”既贴近希腊文，也符合搏斗叙述。
- source_word: ἀπέλυσα τὸν κρημνόν
  choice: 把它摔下悬崖
  rationale: 原文这一搭配不寻常，按语境理解为使熊沿悬崖坠下。中文用“摔下”表达主动放脱并使其坠落的动作，同时不增添滚落等原文未明说的细节。
- source_word: συνετρίβη
  choice: 粉身碎骨
  rationale: 该被动动词意为被撞碎、摔得粉碎；此处描述熊坠崖后的结果，“粉身碎骨”自然、凝练而有叙事力度。
