  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/001.yaml
  text: And the Lord gave me favor in all my works, in the field and in the house.
translation:
  language: zh_hans
  text: 主使我在所做的一切事上都蒙恩惠，无论在田间还是在家中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκέ μοι Κύριος χάριν
  choice: 主使我……蒙恩惠
  rationale: 以自然的现代汉语表达“主赐给我恩惠”；“蒙恩惠”既保留 χάριν 的恩惠、眷顾之意，也避免误解为单指人的好感。
- source_word: ἐν πᾶσι τοῖς ἔργοις μου
  choice: 在所做的一切事上
  rationale: 保留 ἔργοις 的广义，涵盖劳作、事务和行为，不局限为职业性的“工作”。
- source_word: ἐν τε ἀγρῷ καὶ ἐν τῷ οἴκῳ
  choice: 无论在田间还是在家中
  rationale: 清楚再现 τε…καί 的并列范围，并用现代汉语自然表达两个生活领域。
theological_decisions:
- issue: χάρις 在此处的含义
  choice: 恩惠
  alternative: 恩典；顺利
  rationale: “恩惠”较贴近本句中由主所赐的眷顾或有利处境；“恩典”容易承载较强的后期教义色彩，“顺利”则过度结果化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；不增添原文没有的解释性内容。
