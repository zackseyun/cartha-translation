  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/003.yaml
  text: And I would seize the gazelle along the road, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and threw it down the cliff, and it was crushed.
translation:
  language: zh_hans
  text: 我在途中常能捉住瞪羚[a]；凡在田野里的，我都能追上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在途中”所译的希腊语直译为“通过那δρομος”；δρόμος可指道路、行程或跑程，故也可理解为“在路上”或“在跑程中”。
    reason: 保留διὰ τοῦ δρόμου的词义范围，避免将其单一定为“奔跑时”。
lexical_decisions:
- source_word: δορκάδα
  choice: 瞪羚
  rationale: 指羚羊类的敏捷野兽；译作“瞪羚”比泛称“羚羊”更具体，也符合追猎语境。
- source_word: διὰ τοῦ δρόμου
  choice: 奔跑时
  rationale: δρόμος可指奔跑、赛程或道路；此处与抓住敏捷野兽相连，较自然地表达凭奔跑追及的意思，同时以脚注保留另一种可能。
- source_word: ἐκράτουν
  choice: 能捉住
  rationale: 未完成时在叙事中表达过去持续或反复具备的能力；“能捉住”自然体现犹大对自身勇力的回述。
- source_word: κατελάμβανον
  choice: 能追上
  rationale: 核心义为追赶并赶上、抓获；与田野中的目标相配，“追上”避免把原文未明说的对象限定为动物。
