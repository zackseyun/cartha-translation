  text: My children[b][a], the love of money leads to idolatry.
translation:
  language: zh_hans
  text: '19 我的孩子们，贪爱钱财会导向拜偶像[a]；因为人受钱财迷惑，竟把那些并不是神的称为神；贪爱钱财也会使怀有这种欲念的人陷入神志错乱。


    2 我的孩子们，我因钱财失去了自己的孩子。若不是我的悔改、我的谦卑和我父亲的祷告一同帮助了我，我本会无子而死。3 然而，我祖先的上帝怜悯了我，因为我是在无知中做了这事。4 原来，那迷惑人的统治者蒙蔽了我；我作为人，又是受罪败坏的血肉之躯，曾不明白。我认清了自己的软弱——我原以为自己不可战胜[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会导向”也可译作“会引向”。这里表达的是朝向拜偶像的结果，并未直接说“贪爱钱财就是拜偶像”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于：“我认清了自己的软弱，自以为不可战胜。”分词“自以为”的时间关系没有明说；正文按语境译作先前的自负。
    reason: ambiguity
lexical_decisions:
- source_word: Τέκνα μου
  choice: 我的孩子们
  rationale: 保留族长对后代直接而亲切的劝诫，不把所指范围缩窄为“儿子们”。
- source_word: φιλαργυρία
  choice: 贪爱钱财
  rationale: 该词直指对银钱的爱恋；“贪爱钱财”既保留词义焦点，也比泛指的“贪婪”更准确。
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: 会导向拜偶像
  rationale: 按所给希腊文本，ὁδηγεῖ明确表达“引向、带往”；“导向”保留方向性，不将两者直接等同。
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: 受钱财迷惑
  rationale: 将属格短语自然地理解为钱财所造成或关联的迷惑，同时避免过度规定其语法关系。
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: 陷入神志错乱
  rationale: 此处ἔκστασις在道德劝诫语境中表示失常、失去正常判断，并非正面的宗教狂喜。
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: 那迷惑人的统治者
  rationale: 保留ἄρχων的统治权意味及πλάνη的迷惑含义，同时不擅自以专名认定其身份。
- source_word: ὡς ἄνθρωπος καὶ ὡς σὰρξ
  choice: 我不过是人，是血肉之躯
  rationale: 用现代汉语表达双重自我限定，保留“人”与“肉体”的并列强调。
- source_word: ἀκαταμάχητος
  choice: 不可战胜
  rationale: 准确传达“不受抵挡、无法被击败”的自负判断。
theological_decisions:
- issue: 贪爱钱财与拜偶像之间的关系
  choice: 译为“会导向拜偶像”
  alternative: “就是拜偶像”或“倾向于拜偶像”
  rationale: 所给希腊文本以ὁδηγεῖ表达引导关系，而非明确的等同判断；译文保留道德因果方向，不强化为本体等同。
- issue: “迷惑人的统治者”的身份
  choice: 保留描述性称谓，不指名为撒但或魔鬼
  alternative: 直接译成“魔鬼”或“撒但”
  rationale: 原文只给出ὁ ἄρχων τῆς πλάνης这一称谓；虽可能具有邪灵指向，译文不越过文本明确程度。
- issue: 上帝怜悯与人的悔改、谦卑及代祷
  choice: 按叙事顺序并列保留各因素
  alternative: 将其中某一项解释为获得怜悯的唯一条件
  rationale: 原文同时述及人的悔改、谦卑、父亲的祷告和上帝的怜悯；不建立文本未明确说明的教义性因果层级。
- issue: 认清软弱与自以为不可战胜之间的时序
  choice: 译作“我也认清了……我原以为……”
  alternative: 译作“我认清自己的软弱，同时还以为自己不可战胜”
  rationale: 分词νομίζων与主句的时间关系可由语境决定；中文以过去判断表达较通顺，但用脚注说明原文未明确标出“原先”的时间关系。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。“我的孩子们”保留遗训语气；“神志错乱”避免把ἔκστασις误读为正面的属灵狂喜；对邪恶统治者的身份及末句分词的时间关系均保持原文可容纳的张力。
