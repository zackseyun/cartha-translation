  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017.yaml
  text: 'And now I command you, my children: do not love silver, and do not set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.


    And I know that because of these two things my seed will come to the ruin of sexual immorality. For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which the Lord gave me because of my obedience to my father Jacob.'
translation:
  language: zh_hans
  text: '**《犹大遗训》第17章**


    **1** 现在，我的孩子们，我吩咐你们：不要贪爱银钱，也不要注目女子的美貌。因为我自己也曾因黄金和美貌受了迷惑，迷恋迦南女子贝苏厄[a]。


    **2** 我知道，我的后裔必因这两样事陷入淫乱，走向灭亡[b]；这两样事甚至会使我众子中的智慧人败坏，并使犹大的王国衰微。这个王国是主因我顺从父亲而赐给我的。


    **3** 我从未违逆我的父亲雅各；凡他对我所说的，我都照着做了。


    **4** 我的先祖亚伯拉罕赐福给我，使我在以色列中作王；雅各也这样赐福给我。


    **5** 我知道，王国必从我而立[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贝苏厄”按希腊文 Βησουὲ 音译；此名的具体希伯来语形式并不确定。
    reason: 专名音译存在文本传统与对应形式的不确定性，需向读者说明。
  - marker: b
    text: 希腊文此处结构紧缩，直译近于“进入淫乱的灭亡”，也可理解为“因淫乱而灭亡”或“陷入带来灭亡的淫乱”。
    reason: 保留“灭亡”与“淫乱”之间真实的语法歧义，正文采用通顺而不过度解释的表达。
  - marker: c
    text: “而立”所译的动词也可理解为“建立”或“兴起”；本句没有明说由谁建立。
    reason: 说明动词语义范围，并避免把未明说的施事者带入正文。
lexical_decisions:
- source_word: ἀργύριον
  choice: 银钱
  rationale: 该词可指银或银钱；上下文与“黄金”并列并劝戒贪爱财富，译作“银钱”既自然又保留物质财富的含义。
- source_word: ἐπιβλέπει εἰς κάλλος γυναικῶν
  choice: 注目女子的美貌
  rationale: 保留“把目光投向”的视觉意象，同时使用自然的现代汉语。
- source_word: ἐπλανήθην εἰς Βησουὲ τὴν Χαναναίαν
  choice: 在迦南女子贝苏厄这件事上误入歧途
  rationale: 希腊文以 εἰς 表明误入歧途所指向的对象；中文如此表达可避免擅自补出“娶了”等原文未明说的动作。
- source_word: γένος μου
  choice: 我的后裔
  rationale: 此处指犹大的族类或后代；“后裔”比“种子”更符合现代汉语，却不缩窄为某一个人。
- source_word: ἀλλοιώσουσι
  choice: 使……败坏
  rationale: 原义是改变、变质；在道德警戒语境中译作“败坏”自然，也保留由原有状态发生恶化的意思。
- source_word: παρελάλησα
  choice: 违逆
  rationale: 该词在此指说话或行事与父命相悖；下句“都照着做了”表明重点在顺从，因此“违逆”比单纯“顶撞”更完整。
- source_word: βασιλεύειν ἐν Ἰσραήλ
  choice: 在以色列中作王
  rationale: 直接反映不定式“作王、掌权”，不预先限定其实现方式。
- source_word: στήσεται τὸ βασίλειον
  choice: 王国必……而立
  rationale: στήσεται 可表达建立、兴起或站立；“而立”保留其形象及王国兴起的语义。
theological_decisions:
- issue: 犹大王国衰微的因果关系
  choice: 把“这两样事”作为使智慧人败坏、使王国衰微的主语
  alternative: 把后裔或淫乱视为直接主语
  rationale: 希腊文复数动词最自然地回指前文的“这两样”，即贪爱钱财与注目美色；不另行加入神学化的因果链。
- issue: 主赐下王国与犹大顺从父亲的关系
  choice: “主因我顺从父亲而赐给我的”
  alternative: “主在我顺从父亲时赐给我的”
  rationale: ἐν ὑπακοῇ 可表示在顺从的情形中，也可带理由色彩；上下文第3节以实际顺从作解释，正文采用自然的因果表达，但不扩展为功德论。
- issue: 第5节王国的来源与建立
  choice: “王国必从我而立”
  alternative: “王权必由我的后裔建立”
  rationale: 原文只说“从我”，并未明说某一位后裔或建立者；保留概括性表述，避免预先锁定其弥赛亚或王朝解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，以父亲临终训诫的口吻贯穿全章。保留“主”“赐福”“作王”“王国”等文本自身的宗教与王权词汇，不加入特定宗派术语。分节依希腊文原始章节完整呈现第1—5节；英文咨询层仅含第1—2节，因此第3—5节直接依据所给希腊文翻译。
