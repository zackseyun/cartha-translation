  to: '《犹大遗训》第8章


    1 我有许多牲畜；我的首席牧人是亚杜兰人希兰。[a]


    2 我去见他时，亚杜兰王巴沙巴也来了。[b] 他为我们摆设酒宴；他劝我之后，就把自己的女儿莎巴给我为妻。[c]


    3 她给我生了珥、阿南和示洛姆。主杀了前两个；示洛姆却活着。[d]'
  rationale: 修订仅处理可安全确定的语言问题：以“首席牧人”替换生硬的“牧人长”，以“杀了”避免将原文直接杀死义法律化，并使儿子姓名严格对应本段希腊见证。仍保留第2节王号／人名组合的文本疑难脚注，也不从英语咨询层或《创世记》补入本底文未载的情节与死因。第3节末尾的γάρ关系在现有文本中突兀，中文以分号和“却”保留可见的对照，不擅自建立具体因果。
