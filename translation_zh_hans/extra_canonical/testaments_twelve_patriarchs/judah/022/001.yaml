source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐπάξει¹ δὲ αὐτοῖς Κύριος διαιρέσεις *κατ᾽ ἀλλήλων¹³, καὶ ἔσονται *συνεχεῖς ἔσονται³ ἐν Ἰσραήλ⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/001.yaml
  text: The Lord will bring divisions among them against one another, and continual wars will be in Israel.
translation:
  language: zh_hans
  text: 主必使他们彼此分裂；以色列中必有连绵不断的战争。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给希腊文本在这里直译为“以色列中必有不断的……”，没有明写“战争”一词；“战争”是根据语境补出的。
    reason: 说明译文为使省略结构在汉语中完整而补出的名词，避免把解释伪装成希腊文本明说的内容。
lexical_decisions:
- source_word: Ἐπάξει
  choice: 必使……发生
  rationale: 该动词意为“带来、使临到”；结合宾语“分裂”，译为“使……分裂”更符合现代汉语表达，同时保留将来语气。
- source_word: διαιρέσεις κατ᾽ ἀλλήλων
  choice: 彼此分裂
  rationale: κατ᾽ ἀλλήλων表达相互对立；“彼此分裂”简洁传达群体内部互相对抗、分化的含义。
- source_word: συνεχεῖς
  choice: 连绵不断的
  rationale: 该词表示持续、接连不断。此处采用定语形式，以自然汉语表达其持续性。
- source_word: ἐν Ἰσραήλ
  choice: 以色列中
  rationale: 保留地点范围的开放性，不擅自限定为土地、国家或民族。
theological_decisions:
- issue: 主在分裂事件中的作用
  choice: 主必使他们彼此分裂
  alternative: 主必容许他们彼此分裂
  rationale: 原文Ἐπάξει直接表达主“带来、使临到”，并非仅指容许；因此不以缓和性的神学解释取代原文措辞。
- issue: συνεχεῖς所修饰名词在所给希腊文本中未明示
  choice: 正文依上下文及古译传统补出“战争”，并加脚注说明
  alternative: 译为“以色列中必有接连不断的事”
  rationale: 单独把形容词译成“不断的事”既不自然，也无法准确呈现本句所指；英译审校层明确理解为“战争”。脚注则如实保留所给希腊文本的省略现象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主必使他们彼此分裂”保留原文直接而强烈的施事表达；分号呈现两个紧密相关的预告。
