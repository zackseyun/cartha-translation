  text: Καὶ ἐν ἀλλοφύλοις⁵ συντελεσθήσεται ἡ βασιλεία μου⁶, ἕως⁷ τοῦ ἐλθεῖν⁸ τὸ⁹ σωτήριον τοῦ¹⁰ Ἰσραήλ¹⁰,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/002.yaml
  text: And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes,
translation:
  language: zh_hans
  text: 我的王国也将在外族人中终结，直到以色列的拯救来到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοφύλοις
  choice: 外族人
  rationale: 该词指本族之外的人，常可指异邦人或外邦人；“外族人”既保留族群对比，也避免过度限定具体民族或宗教身份。
- source_word: συντελεσθήσεται
  choice: 终结
  rationale: 这是将来时被动形式，表达走到尽头、被终止；“将在……终结”保留其被动意味，同时符合现代汉语表达。
- source_word: ἡ βασιλεία μου
  choice: 我的王国
  rationale: βασιλεία在此有可被终结的政治实体含义，译作“王国”比“统治”更贴合上下文。
- source_word: τὸ σωτήριον
  choice: 拯救
  rationale: 中性名词化形式可表示救恩、拯救或带来拯救之物；“拯救”保留事件性，也不把它具体化为某位人物。
- source_word: ἕως τοῦ ἐλθεῖν
  choice: 直到……来到
  rationale: 保留原文以ἕως加不定式表达的时间界限，不进一步断定此前状态在此后如何变化。
theological_decisions:
- issue: τὸ σωτήριον τοῦ Ἰσραήλ所指为何
  choice: 以色列的拯救
  alternative: 以色列的救主／给以色列带来拯救者
  rationale: 原文使用中性τὸ σωτήριον，并未明确使用“救主”的人格称谓；因此不将其基督论式地人格化，保留“以色列的拯救”可指救恩事件、状态或施救之物的张力。
- issue: 属格τοῦ Ἰσραήλ的关系
  choice: 以色列的拯救
  alternative: 来自以色列的拯救
  rationale: 希腊语属格可能表示以色列所领受的拯救，也可能表示与以色列相关或由以色列而出的拯救。中文“以色列的拯救”保留这一属格歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，尽量贴近希腊语的并列结构和时间从句。经文简短，无需脚注；“也”对应句首Καί，并暗示与前文相连。
