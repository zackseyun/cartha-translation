  text: 1. And when I was at the waters of Chozeba[a], those from Jobel came against us for battle. 2. And joining battle, we put them to flight; and we killed those from Shilom, their allies, and gave them no way of escape. 3. But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[b], we prevailed over them and killed them before they could scale the ascent. 4. And as we came to the city, their women were rolling stones down on us from the summit of the mountain on which the city stood[c]. 5. And having hidden Simeon and the others behind them, we seized the height, and utterly destroyed this city also.
translation:
  language: zh_hans
  text: '《犹大遗训》第6章


    1 我在科泽巴水边的时候[a]，约贝尔人前来攻打我们。 2 我们与他们交战，使他们溃逃；又杀了他们的盟友示洛姆人，不给他们留下逃脱的通路。 3 到了第五天，玛基尔人又来攻击我们。我们便挥动强有力的刀剑向他们冲去[b]，胜过他们，并在他们登上坡道以前杀了他们。 4 我们来到那城时，他们的妇女从城所在的山顶上，把石头滚下来攻击我们[c]。 5 我把西缅等人隐藏在敌人后方[d]，我们便夺取高地，也把这座城彻底毁灭了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “科泽巴”“约贝尔”和“示洛姆”均按本希腊文本的名称音译；这些地点的确切位置尚不能确定。
    reason: cultural_note
  - marker: b
    text: 本节希腊文的προσδίδωσι是第三人称单数现在时，与前后第一人称复数的过去时叙事在句法上不协调，可能反映抄写讹误或文字压缩。译文依上下文表达进攻之意，但不对原文作无据改写。
    reason: textual_variant
  - marker: c
    text: 希腊文在“那城”前重复了两次定冠词（τῇ τῇ πόλει），显然是抄写时的重写；译文按一次定冠词处理。
    reason: textual_variant
  - marker: d
    text: 本句“我把西缅等人隐藏……”所对应的希腊文τὸν τε καὶ Συμεὼν似有残缺或讹误，不能确定除西缅以外具体还指谁；“等人”保留了连接结构所暗示的多人意味。
    reason: textual_variant
lexical_decisions:
- source_word: ὕδασι Χωζηβά
  choice: 科泽巴水边
  rationale: ὕδασι是复数，指与该地名相连的一处水域或水源；中文用“水边”既保留地点意味，也比生硬的“诸水”自然。Χωζηβά按希腊文音译。
- source_word: ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: 前来攻打我们
  rationale: 同时表达朝向“我们”的敌对行动和作战目的，符合现代汉语叙事习惯。
- source_word: συνάψαντες ἐτρέψαμεν
  choice: 与他们交战，使他们溃逃
  rationale: συνάπτω在军事语境中指接战，τρέπω指使敌军转身败走；“溃逃”准确而简洁。
- source_word: διέξοδον
  choice: 逃脱的通路
  rationale: 保留该词具体的“出口、通道”意象，而不只抽象译作“逃脱机会”。
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: 挥动强有力的刀剑
  rationale: κραταιᾷ强调强大有力；μαχαίρα可指刀或剑，合译“刀剑”避免过度限定具体兵器。
- source_word: τὴν ἀνάβασιν
  choice: 坡道
  rationale: 此处指通往高处或城池的上行道路；结合下一节山城地势，译作“坡道”自然且不增添城墙等原文没有的信息。
- source_word: ἐξωλοθρεύσαμεν
  choice: 彻底毁灭
  rationale: 表达该复合动词强烈的灭绝、尽毁意味，同时保持庄重直白。
theological_decisions:
- issue: 第3节 προσδίδωσι 的句法异常
  choice: 按上下文表达为“我们便……向他们冲去”
  alternative: 保留第三人称单数，直译成不连贯的“他/它向他们加给”
  rationale: 该词形在第一人称复数的过去时叙事中明显异常，可能是抄写压缩或文本损坏。译文不擅自重构具体希腊词形，只呈现上下文可辨认的战术行动，并以脚注说明。
- issue: 第5节 τὸν τε καὶ Συμεὼν 的残缺或讹误
  choice: 译作“西缅等人”，并以脚注标明不确定性
  alternative: 只译“西缅”或猜补另一位具名人物
  rationale: 现存希腊文在连接词前似乎缺少与格宾语相配的成分；“西缅等人”最低限度地反映复合结构，却不虚构缺失姓名。
- issue: 战争暴力叙事
  choice: 直接翻译“杀了”“彻底毁灭”等措辞
  alternative: 用“击败”“攻陷”等较弱措辞淡化暴力
  rationale: 原文明确使用ἀποκτείνω与ἐξολοθρεύω；忠实翻译叙事不等于对行为作神学或道德背书。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；避免文言式“击杀”“尽灭”和过度口语化表达。人名、地名按希腊文形式音译。对第3、5节的文本困难不在正文中强行修复，而用可读的最低限度译法配合脚注公开说明。
