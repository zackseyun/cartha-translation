lexical_decisions:
- source_word: Καὶ εἶπεν αὐτοῖς
  choice: 他对他们说
  rationale: 按希腊语叙事句式直译；句首 Καί 在现代汉语中无需机械译作“并且”。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留提示听者注意的郑重语气，同时符合经文体例。
- source_word: ἐγώ
  choice: 我
  rationale: 保留原文明确的第一人称主语及其强调意味。
- source_word: ἑκατὸν δέκα καὶ ὀκτὼ ἐτῶν
  choice: 今年一百一十八岁
  rationale: 原文为年龄表达，字面是“一百、十和八岁”；用自然现代汉语准确表达为“一百一十八岁”。
- source_word: ἀποθνῄσκω σήμερον
  choice: 今天就要死了
  rationale: 希腊语现在时在此表达临近、确定的死亡；“就要……了”自然传达迫近意味，不额外引入死因或神学解释。
theological_decisions:
- issue: 所给希腊文与英文咨询层内容不一致
  choice: 以所给希腊文为准，译出说话者宣告自己一百一十八岁并将于当天死亡
  alternative: 依英文 POB 译作劝勉儿女遵守主的律法
  rationale: 英文内容在所给希腊文中没有对应词句；按要求应优先依据原语言证据，不可把英文咨询层中未受希腊文支持的内容纳入正文。
- issue: 经节定位的不确定性
  choice: 不在译文中补入人物姓名、称呼或律法劝勉
  alternative: 根据《犹大遗训》上下文补足“我的孩子们”等信息
