translation:
  language: zh_hans
  text: 谁也不要用华贵的衣服安葬我；要把我带到希伯仑去，那里也有我的列祖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句直译为“那里也有我的父辈／列祖”，谓语省略；在本段安葬语境中，指他们也葬在那里。
    reason: 说明希腊文的省略结构，以及“父辈”在此按家族与墓葬语境译为“列祖”的依据，而不在正文中过度补足。
lexical_decisions:
- source_word: ἐνταφιάσει
  choice: 安葬
  rationale: 该动词在此指办理葬埋；译为“安葬”自然庄重，也符合遗命语境。
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: 用华贵的衣服
  rationale: 保留介词结构及衣着奢华之意，不扩展为原文未明说的盛大葬礼。
- source_word: ἀναγάγετε
  choice: 带上
  rationale: 该动词有“带上去”之意；希伯仑位于山地，译出方向感，同时避免生硬的“抬上去”。
- source_word: οἱ πατέρες μου
  choice: 我列祖
  rationale: 亲属安葬语境中指先祖；“列祖”兼具准确、凝练与庄重的文体色彩。
theological_decisions:
- issue: 最后地点从句的省略
  choice: 安葬在我列祖所在之处
  alternative: 那里也是我列祖所在的地方
  rationale: 希腊文末句直译为“那里也是我的列祖”，谓语有所省略。正文按墓葬语境补出“安葬”，脚注说明原文形式，避免把“列祖所在”误解为列祖仍活着居住于当地。
translation_notes:
  register: 采用现代、庄重而易懂的遗命语体。依据所给希腊文翻译；所附英文文本内容与该希腊文不相符，因此未据英文改写。
