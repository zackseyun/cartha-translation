base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/001.yaml
  text: Therefore keep, my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness.
translation:
  language: zh_hans
  text: 所以，我的孩子们，要谨守主的一切律法，因为这律法是那些使他的道路正直之人的盼望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他的道路正直”：希腊语直译为“使他的道路正直”或“引直他的道路”。原文的“他的道路”所指及这一表达的具体含义有解释上的张力；正文保留其及物结构，未改译为“在他的道路上正直行走”。
    reason: 保留 κατευθύνουσι τὰς ὁδοὺς αὐτοῦ 的语法结构和可解释空间，避免将原文直接宾语结构替换为不同的“行走”意象。
lexical_decisions:
- source_word: Φυλάξατε
  choice: 谨守
  rationale: 既表达遵行，也保留“守护、持守”的意味，符合律法语境。
- source_word: πάντα τὸν νόμον Κυρίου
  choice: 主全部的律法
  rationale: 保留 πάντα 所强调的完整范围，不弱化为泛指的“主的律法”。
- source_word: ἐλπὶς
  choice: 盼望
  rationale: 这是宗教文献中自然且庄重的对应词，保留所指既可为盼望本身、也可为盼望根据的张力。
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: 那些在他的道路上正直行走之人
  rationale: κατευθύνω 有“使正直、引向正路”的含义；此处采用自然汉语表达，同时用脚注说明希腊语较直译的形式。
theological_decisions:
- issue: 律法与“盼望”的关系
  choice: 明确以“这律法”承接前句，译作“这律法是……的盼望”
  alternative: 不补出主语，仅译“因为这是……的盼望”
  rationale: 希腊语省略主语，但最近的中心名词是“律法”；补出“这律法”使汉语清楚，同时不将“盼望”进一步解释为救恩、功德或其他教义概念。
- issue: κατευθύνουσι 所表达的正直行动
  choice: 在他的道路上正直行走
  alternative: 使他的道路正直／引导他的道路
  rationale: 字面结构存在张力，但后两种说法在现代汉语中容易被理解为人纠正或指引上主的道路；正文表达人在上主道路上的正直行走，并以脚注保留原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我的孩子们”保留临终训诲的亲切语气；“谨守”“律法”“盼望”符合经文体裁，但不过度古雅。
