  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/003.yaml
  text: And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.
translation:
  language: zh_hans
  text: 他说完这些话，就睡去了。他的儿子们凡事都照着他的吩咐去做，把他葬在希伯仑，与他的祖先同葬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: 睡去了
  rationale: 保留希腊文以“睡去”委婉表达死亡的意象，不增添原文此处没有的“寿高年迈”。
- source_word: κατὰ πάντα ὅσα ἐνετείλατο αὐτοῖς
  choice: 凡事都照着他的吩咐去做
  rationale: 自然表达“按照他所吩咐他们的一切”，并保留“凡事/一切”的完整范围。
- source_word: ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  choice: 把他……与他的祖先同葬
  rationale: “祖先”在现代汉语中比直译“列祖/父亲们”清楚，也保留归葬家族墓地的含义。
- source_word: ἐν Χεβρὼν
  choice: 在希伯仑
  rationale: 按通行现代中文地名音译；语序调整为自然汉语。
theological_decisions:
- issue: “睡去”是否明确译为“死了”
  choice: 保留“睡去了”
  alternative: 死了
  rationale: 原文使用睡眠委婉语；保留这一表达可呈现其文学及可能的神学意涵，而不替文本消除含蓄性。
- issue: 是否加入英文咨询文本中的“寿高年迈”和“把他运上去”
  choice: 不加入
  alternative: “他寿高年迈，就睡去了”；“把他运上希伯仑”
  rationale: 所给希腊文没有“寿高年迈”或“运上去”的对应成分；译文优先依据原语言证据。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“睡去了”保留经文式委婉语，但避免生硬古雅；句法简洁，适合普通现代读者。
