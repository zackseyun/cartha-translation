  text: But the God of my fathers had mercy on me, because I did this in ignorance.
translation:
  language: zh_hans
  text: 但我祖先的上帝怜悯了我，因为我是在无知中做了这事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: 我祖先的上帝
  rationale: 直译此属格结构，并以现代汉语自然表达历代先祖所敬奉的上帝。
- source_word: ἐλέησε με
  choice: 怜悯了我
  rationale: 保留动词的宗教与关系性内涵，也准确体现不定过去时所指的行动。
- source_word: ἐν ἀγνωσίᾳ
  choice: 在无知中
  rationale: 保留原文对行为发生于不知情或无知状态中的表述，不进一步解释为无意、误解或无罪。
- source_word: τοῦτο ἐποίησα
  choice: 做了这事
  rationale: 以自然汉语对应指示代词与动词，保留“这事”所指须由上下文确定的开放性。
theological_decisions:
- issue: 无知与怜悯之间的关系
  choice: 因为我是在无知中做了这事
  alternative: 因为我并不知道自己在做什么
  rationale: 采用较贴近原文的因果表达，不把“无知”扩展成关于行为人意识、动机或责任程度的具体判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我祖先的上帝”较“我列祖的上帝”更符合当代普通读者的自然表达，同时保留原文的圣经式神学意涵。
