base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/004.yaml
  text: 'For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast.'
translation:
  language: zh_hans
  text: 因为迷惑的掌权者使我失明；我作为人，作为在罪中败坏的血肉之躯，竟无知无觉。我以为自己不可战胜，却认识到自己的软弱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: 迷惑人的统治者
  rationale: ἄρχων 表示掌权者、统治者；πλάνη 可指迷惑、欺骗或谬误。译为“迷惑人的统治者”既自然，也保留其人格化及属灵意味。
- source_word: Ἐτύφλωσε
  choice: 弄瞎了我的心眼
  rationale: 动词本义为“使失明”。上下文所说是认知与道德上的蒙蔽，补出“心眼”可使现代汉语读者自然理解，同时保留失明意象。
- source_word: ἠγνόησα
  choice: 无知
  rationale: 可表示“不知道、不明白”。这里采用“无知”，与被蒙蔽的语境相合，又不额外限定无知的具体对象。
- source_word: ὡς ἄνθρωπος
  choice: 像普通人一样
  rationale: 直译为“作为人/像人一样”在中文中生硬；“像普通人一样”表达人的有限性，但不把它解释成特定教义。
- source_word: ὡς σὰρξ ἐν ἁμαρτίαις φθαρείς
  choice: 又是被罪败坏的血肉之躯
  rationale: σάρξ 保留为“血肉之躯”，φθαρείς 译作“被……败坏”。ἐν ἁμαρτίαις 可理解为“在罪中”或“被罪败坏”，正文采用后者以求通顺。
- source_word: ἐπέγνων τὴν ἐμαυτοῦ ἀσθένειαν
  choice: 认清了自己的软弱
  rationale: ἐπιγινώσκω 在此有认识、意识到之意；“认清”体现较明确的自我认识。ἀσθένεια 译为“软弱”，兼顾能力不足和脆弱性。
- source_word: νομίζων ἀκαταμάχητος εἶναι
  choice: 我虽自以为不可战胜
  rationale: νομίζων 为“以为、认为”，ἀκαταμάχητος 为“不可战胜”。分词与主句的逻辑可能带有伴随或反差；用“虽”使中文关系清楚，并反映自负与认清软弱之间的张力。
theological_decisions:
- issue: “迷惑人的统治者”的身份
  choice: 保留称号，不明确指称撒但或其他特定存在
  alternative: 译为“魔鬼”或“撒但”
  rationale: 希腊文只给出 ὁ ἄρχων τῆς πλάνης，虽然具有鲜明人格化色彩，却未在本句直接命名；不应把解释写入正文。
- issue: “血肉”与罪的关系
  choice: 译为“被罪败坏的血肉之躯”
  alternative: 译为“肉体本身就是败坏的”
  rationale: 原文表达这血肉之人处在罪所造成的败坏中，并不必然断言物质肉体本质邪恶，因此避免引入二元论。
- issue: 分词 νομίζων 与主句的关系
  choice: 以让步关系表达：“虽自以为……却……”
  alternative: 按伴随关系译为“认清自己的软弱，同时以为自己不可战胜”
  rationale: 希腊分词本身未明标逻辑连接，但语义上“自认不可战胜”与“认清软弱”形成明显张力。中文用让步结构最为自然，同时没有消除这项张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。仅翻译所给的《犹大遗训》20:4 希腊文，不把英语咨询层中随后出现的第5—8节混入本节。
