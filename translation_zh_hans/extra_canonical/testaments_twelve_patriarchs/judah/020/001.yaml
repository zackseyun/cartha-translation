  naturalness: 修订后采用“它使人迷失，因为……”以符合现代汉语的因果表达，并用“神志恍惚”表达陷入脱离正常意识的状态；这比“神志失常”较少带有现代临床诊断色彩，也不把ἔκστασις限定为正面的宗教狂喜。
  terminology: “钱财”适合此处ἀργυρίου的语境性含义；“神”保留θεούς的复数及其否定。“神志恍惚”与脚注中的“出神／失神”共同保留ἔκστασις可指恍惚、出神或脱离常态的语义范围。
