source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὁδηγεῖ³, ὅτι⁴ ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς⁵ ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα⁷ αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/001.yaml
  text: For it leads astray, because in the delusion of silver they call those who are not gods gods, and it causes the one who has it to fall into ecstasy.
translation:
  language: zh_hans
  text: 它使人迷失，因为人在钱财的迷惑中，把那些不是神的称为神；它又使拥有钱财的人陷入神志恍惚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神志恍惚”原文也可译作“失神”或“出神”，指脱离正常意识状态。
    reason: 保留ἔκστασις的词义宽度，避免将其限定为正面的“狂喜”，或赋予过强的临床病理含义。
lexical_decisions:
- source_word: ὁδηγεῖ
  choice: 使人迷失
  rationale: 此处动词按语境表达引向歧途、使人受误导；补出泛指的“人”，使中文自然。
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: 在金钱的迷惑中
  rationale: ἀργύριον在此语境指钱财；保留πλάνη所含的迷惑、欺骗意味，不缩减为单纯的贪财。
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  choice: 把那些并不是神的称为神
  rationale: 贴近希腊文的否定和命名结构，保留对假神化的直接批判。
- source_word: τὸν ἔχοντα αὐτήν
  choice: 拥有钱财的人
  rationale: 阴性代词αὐτήν最自然地回指本段所论的钱财或银钱；中文明确重复所指，避免代词含混。
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: 陷入神志失常
  rationale: ἔκστασις字面有脱离常态、失神之意；本处为负面结果，译作“神志失常”比现代汉语中常含正面宗教体验的“狂喜”更合语境，同时以脚注保留词义范围。
theological_decisions:
- issue: “称并不是神的为神”的对象
  choice: 保持泛称，不具体判定是钱财本身、偶像还是富人
  alternative: 译成“把金钱当作神”
  rationale: 原文用复数“那些并不是神的”，并未明确限定所指；直译可保留其真实含混性。
- issue: ἔκστασις的性质
  choice: 正文按负面语境译为“神志失常”
  alternative: “狂喜”或“出神”
  rationale: 原文可指离开正常意识状态，未必专指愉悦或属灵经验；正文不赋予正面神学含义，脚注说明可能译法。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“金钱”比“银子”更准确传达此处ἀργύριον的钱财义；分号呈现原因与后续结果之间的推进关系。
