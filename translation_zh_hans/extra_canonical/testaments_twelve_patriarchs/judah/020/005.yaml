  text: Καὶ²⁰ τὸ πνεῦμα τῆς ἀληθείας²¹ κατηγορεῖ²² πάντων²³ καὶ ἐμπεπύρισται ὁ ἁμαρτωλὸς²⁴ ἐκ τῆς ἰδίας καρδίας, καὶ ἆραι²⁵ πρόσωπον πρὸς τὸν κριτὴν οὐ δύναται.
