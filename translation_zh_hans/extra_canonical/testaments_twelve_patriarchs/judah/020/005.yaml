base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/005.yaml
  text: And the Spirit of truth accuses all, and the sinner is consumed from his own heart, and to lift up
translation:
  language: zh_hans
  text: 真理之灵指控所有人[a]；罪人被自己心中燃起的火焚烧，也不能抬起脸来面对审判者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所有人”也可译作“一切”。
    reason: 希腊语 πάντων 在形式上可以是阳性或中性复数属格，原文未完全消除这一歧义。
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 真理之灵
  rationale: 按属格结构直译，既自然又不预先断定这里是否特指圣灵。
- source_word: κατηγορεῖ
  choice: 指控
  rationale: 该词表示提出控告或指控，比泛化为“作证”更贴近其司法语义。
- source_word: πάντων
  choice: 所有人
  rationale: 该属格形式可指“所有人”或“一切”；本句的指控与审判语境使“所有人”较为顺畅，同时以脚注保留歧义。
- source_word: ἐμπεπύρισται
  choice: 被……火焚烧
  rationale: 保留完成时被动形式所表达的被点燃、遭焚烧状态；“火”由该动词本身的燃烧语义显明，并使中文表达自然。
- source_word: ἐκ τῆς ἰδίας καρδίας
  choice: 自己心中燃起的
  rationale: ἐκ 表示来源，说明焚烧罪人的火从其自己的心而来；避免误译成单纯外在惩罚。
- source_word: ἆραι πρόσωπον πρὸς τὸν κριτήν οὐ δύναται
  choice: 不能抬起脸来面对审判者
  rationale: 完整保留“抬起脸”“朝向审判者”以及“不能”的句法与羞愧、定罪意象。
theological_decisions:
- issue: “真理之灵”是否明确等同于圣灵
  choice: 不加“圣”字，译作“真理之灵”
  alternative: 圣灵／真理的圣灵
  rationale: 希腊文本仅有“真理之灵”，没有明确写出“圣”；译文保留其可能的神学指向而不替文本作出认定。
- issue: 罪人所受焚烧的来源
  choice: 表明火从罪人自己的心中燃起
  alternative: 罪人因自己的心而被焚烧
  rationale: 这样较清楚地传达 ἐκ 的来源含义，同时保留罪与内在定罪之间的张力，不将其解释成特定的末世刑罚体系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以分号呈现前后相连的指控、内在焚烧和面对审判者时的羞愧；保留司法语汇，但避免古奥措辞。
