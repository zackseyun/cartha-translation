  source_fidelity: 译文忠实呈现希腊文完整的三个连贯分句：真理之灵的指控、罪人从自己内心而来的焚烧，以及不能向审判者抬起脸。尤其末句与所给希腊文本“ἆραι πρόσωπον πρὸς τὸν κριτὴν οὐ δύναται”相符；英语审校记录中将末句视为残缺的说法不符合此处提供的希腊原文，中文译文正确保留了它。
