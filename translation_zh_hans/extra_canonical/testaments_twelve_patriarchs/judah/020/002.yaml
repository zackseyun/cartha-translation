  source_fidelity: “因贪财”将διὰ τὸ ἀργύριον（“因银子／钱财”）所述的缘由明确道德化为贪欲，超出了原文未明说的范围。ταπείνωσις在此可含“降卑、谦卑”或“受辱／屈辱”之义；译为“谦卑”虽可通，但较少保留其受辱或自卑的可能含义。其余因果、反事实和共同援助的关系均译出。
  naturalness: 原译整体庄重自然。“一同来帮助我”清楚表达συνεδράμον的共同援助；“早就无儿无女地死去了”也符合汉语反事实表达。修订后以“共同援助我”和“本会无儿无女而死”略贴近原文，同时仍自然。
  terminology: 将“银子”译为“钱财”可在现代汉语中自然表达ἀργύριον的此处用法，又不添加“贪财”的伦理判断。“我的降卑”保留ταπείνωσις与悔改、父亲祷告并列时的宗教性自卑／受辱语义，避免单向限定为人格美德“谦卑”。
  issues:
