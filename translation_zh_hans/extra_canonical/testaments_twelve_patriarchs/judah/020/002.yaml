  to: 我因钱财失去了儿女；若不是我的悔改、我的降卑和我父亲的祷告共同援助我，我本会无儿无女而死。
  rationale: 修订仅收回“贪财”这一原文未明说的解释，并以“降卑”保留ταπείνωσις的语义弹性；不说明失去儿女的具体方式，也不扩展悔改、降卑和祷告所涉及的神学机制。
