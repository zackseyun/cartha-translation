  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/002.yaml
  text: Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless.
translation:
  language: zh_hans
  text: 我因钱财失去了儿女；若不是我的悔改、我的降卑和我父亲的祷告共同援助我，我本会无儿无女而死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τὸ ἀργύριον
  choice: 因贪财
  rationale: ἀργύριον字面为“银子、钱财”；结合因钱财导致丧失儿女的因果语境，译为“因贪财”较自然，也表达原文对钱财的负面指向。
- source_word: ἀπώλεσα τὰ τέκνα μου
  choice: 失去了儿女
  rationale: 保留ἀπόλλυμι在此处“失去”的含义，不擅自说明儿女如何丧失。
- source_word: ἡ ταπείνωσίς μου
  choice: 我的谦卑
  rationale: ταπείνωσις可指自卑、降卑或受辱；与“悔改”和“祷告”并列时，“谦卑”能保留主动降卑的宗教伦理意味。
- source_word: συνεδράμον
  choice: 一同来帮助我
  rationale: 该动词字面有“一同奔来”之意，在此为共同施以援助；译文保留多个因素协力相助的意味。
- source_word: ἄτεκνος
  choice: 无儿无女
  rationale: 比“无子嗣”更符合现代普通读者的表达，也不把τέκνα限缩为儿子。
theological_decisions:
- issue: 悔改、谦卑与父亲祷告的作用
  choice: 按原文直译为这些因素“一同来帮助我”
  alternative: 解释为这些行为使他赚取赦免或救恩
  rationale: 原文只陈述它们共同介入，使他免于无后而死，并未阐明功德、赦免或救恩机制，因此不作宗派性扩展。
- issue: “银子”是否应解释为贪财
  choice: 译作“贪财”
  alternative: 译作“银子”或“钱财”
  rationale: 这里的διά加宾格表示导致灾祸的缘由；汉语若仅说“因为银子”略显生硬，“因贪财”自然呈现其伦理含义，但不进一步指定具体事件。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文的因果与反事实条件结构；“早就……死去了”自然表达未实现的过去结果。
