  text: '1. The Lord gave me favor because I obeyed my father. 2. Therefore I never grieved Jacob my father, for I did everything he told me. 3. And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me in the same way. 4. And I know what evils you will do in the last days.


    5. Guard yourselves, therefore, my children, from sexual immorality and from the love of money, and listen to Judah your father. 6. For these turn one away from the law of God, and blind the purpose of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor. 7. They deprive his soul of every goodness, and hold him fast in pains and labors; they drive sleep away from him, and consume his flesh. 8. They hinder the sacrifices of God, and he does not remember the blessing of God. He does not listen when a prophet speaks, and he resents words of godliness. 9. For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.'
translation:
  language: zh_hans
  text: '《犹大遗训》第18章


    1 我也知道，你们在末后的日子将会行出何等恶事。


    2 所以，我的孩子们，你们要谨防淫乱和贪爱钱财，也要听从你们父亲犹大的话。3 因为这些事使人背离上帝的律法，蒙蔽心灵的判断力，使人学会狂傲，不容人怜悯自己的邻舍。4 它们使人的心灵失去一切良善，把他困在痛苦和劳碌之中，赶走他的睡眠，耗尽他的血肉。5 它们拦阻人向上帝献祭，使人不再记念上帝的赐福；先知说话时，他不听从，反而厌烦敬虔的言语。6 因为他受两种彼此对立的情欲奴役，不能顺服上帝；因为他的心灵已经蒙蔽，他在白昼行走，如同在黑夜里。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“两种彼此对立的情欲”之后使用单数主动动词“蒙蔽了”，但没有明示主语；译文不指定蒙蔽心灵者，以保留这一句法上的不规则和歧义。
    reason: 避免将未明示的施事者解释为某一种情欲，同时保留希腊文的数与主语问题。
lexical_decisions:
- source_word: πορνεία
  choice: 淫乱
  rationale: 概括不合正道的性行为，保持源词的广泛伦理含义，不将其缩窄为某一种具体行为。
- source_word: φιλαργυρία
  choice: 贪爱钱财
  rationale: 直译其“爱钱、贪财”的构词意义，并与“淫乱”并列为两种情欲。
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: 心灵的判断力
  rationale: διαβούλιον可指谋划、思量或判断的机能；此处按语境译为心灵作伦理判断的能力，同时不将其神学化为特定的灵魂论术语。
- source_word: ἀγαθότης
  choice: 良善
  rationale: 保留道德品质与善行能力兼具的宽泛含义。
- source_word: θυσίας Θεοῦ
  choice: 向上帝献祭
  rationale: 属格在此自然理解为献给上帝的祭；用中文动宾结构清楚表达，而不误解为上帝所献的祭。
- source_word: λόγους εὐσεβείας
  choice: 敬虔的言语
  rationale: εὐσέβεια指对上帝合宜的敬畏与虔诚；“敬虔”庄重且能保留其宗教伦理色彩。
- source_word: προσοχθίζει
  choice: 厌烦
  rationale: 该词表达不悦、反感或恼怒；“厌烦”自然呈现对敬虔言语的排斥，又避免过度强化为仇恨。
- source_word: πάθεσιν
  choice: 情欲
  rationale: 此处指支配人的强烈欲念，且上下文明确指淫乱与贪财；“情欲”比中性的“情感”更符合伦理语境。
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: 在白昼行走，却如同走在黑夜里
  rationale: 保留原文光明与黑暗的鲜明比喻及“行走”的动态表达。
theological_decisions:
- issue: 两种恶习与后文单数、复数表达之间的转换
  choice: 前文用复数“它们”，末句依原文单数用“这情欲”并加注说明
  alternative: 全篇统一改成复数“这些情欲蒙蔽了他的心灵”
  rationale: 希腊文先以复数“这些事”统指淫乱和贪财，后文却出现单数动词；不宜静默消除这种语法张力。
- issue: “上帝的祭”之属格关系
  choice: 译为“向上帝献祭”
  alternative: 译为“上帝的祭物”
  rationale: 上下文讲恶习妨碍人的敬拜行为，目的属格最为自然；此译不引入特定祭祀神学体系。
- issue: 心灵被蒙蔽的结果
  choice: 完整保留“白昼如黑夜行走”的末句
  alternative: 按英语咨询层省略该句
  rationale: 该句明确存在于所给希腊文主文本中，应以原语言证据为准予以翻译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的孩子们”“邻舍”“敬虔”等保留遗训文学与宗教劝诫的语气；句式适度拆分以便朗读。章节和节号严格依据所给希腊文第XVIII章的六节，而不纳入英语咨询层中来自前章或不同分段的前三节内容。
