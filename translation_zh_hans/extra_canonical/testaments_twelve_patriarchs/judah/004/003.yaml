  text: And so we set Hebron free and took all the captives.
translation:
  language: zh_hans
  text: 第二天，我们前往阿雷塔[a]；那是一座坚固的城，扬言要置我们于死地。我和迦得从城东逼近，吕便和利未从城西逼近。我们就这样解救了被掳的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿雷塔”按希腊文地名Ἀρετά音译；英语咨询文本此处作“希伯仑”，且省略了本节其余叙事，但希腊文明确作“阿雷塔”。
    reason: 说明原语言文本与英语咨询文本在地名和叙事内容上的显著差异，并使译名依据透明。
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: 第二天
  rationale: 该短语在叙事中表示紧接着的次日；译为“第二天”自然清楚。
- source_word: Ἀρετάν
  choice: 阿雷塔
  rationale: 按希腊文地名音译，不依英语咨询文本将其改作“希伯仑”。
- source_word: πόλιν κραταιάν
  choice: 一座坚固的城
  rationale: κραταιός在此描述城池强固，译为“坚固”符合军事语境。
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: 扬言要置我们于死地
  rationale: 保留“威胁死亡”的直接敌意，同时采用现代汉语自然表达。
- source_word: προσέφθημεν
  choice: 抢先到了
  rationale: 体现动词“先到、抢先抵达”的含义，不将其泛化为普通的“前往”。
- source_word: ἀπὸ ἀνατολῶν / ἀπὸ δυσμῶν
  choice: 到了城东／到了城西
  rationale: 结合攻城部署语境，将方位短语自然表达为分别占据城市东西两面。
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: 解救了被掳的人
  rationale: “被掳”在此可作集合名词，实际指俘虏；汉语译出所指人群，避免生硬的“释放被掳”。
theological_decisions: []
