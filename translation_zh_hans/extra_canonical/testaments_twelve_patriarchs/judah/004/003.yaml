revisions:
- from: 第二天，我们前往阿雷塔[a]。那是一座坚固的城，扬言要置我们于死地。我和迦得抢先到了城东；吕便和利未则到了城西。我们就这样解救了被掳的人。
  to: 第二天，我们前往阿雷塔[a]；那是一座坚固的城，扬言要置我们于死地。我和迦得从城东逼近，吕便和利未从城西逼近。我们就这样解救了被掳的人。
  rationale: 修订仅删除“抢先”所添加的比较性含义，并以平行的“从城东／城西逼近”重现原文的两路行动。其余内容和脚注均保留原有的源文优先处理。
