source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Εἶδε⁵⁶ γὰρ⁵⁷ *ἐν ὁράματι⁵⁸ †περὶ ἐμοῦ⁵⁹ ὅτι ἄγγελος δυνάμεως⁶⁰ συνέπεταί μοι⁶¹ ἐν πᾶσι, τοῦ μὴ⁶² ἡττᾶσθαί⁶³ μοι.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/008.yaml
  text: For he saw in a vision concerning me that an angel of power accompanied me in all things, so that I might not be touched.
translation:
  language: zh_hans
  text: 因为他曾在异象中看见有关我的事：一位大能的天使在一切事上与我同行，使我不至被胜过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶδε
  choice: 他曾……看见
  rationale: 按直陈过去时译出一次既往的看见；主语承接上文。
- source_word: ἐν ὁράματι
  choice: 在异象中
  rationale: 自然且准确地表达异象性的启示场景。
- source_word: ἄγγελος δυνάμεως
  choice: 一位大能的天使
  rationale: 保留属格结构可能表达的能力属性；“大能的天使”较“能力天使”符合现代汉语。
- source_word: συνέπεταί μοι
  choice: 与我同行
  rationale: 该词有相伴、随行之意；译文保留持续陪伴的图景，而不扩充其具体方式。
- source_word: ἐν πᾶσι
  choice: 在一切事上
  rationale: 保留范围广泛而未具体限定的表达。
- source_word: τοῦ μὴ ἡττᾶσθαί μοι
  choice: 使我不至被胜过
  rationale: ἡττάομαι通常意为被击败、被胜过；中被动不定式以被动表达最贴近希腊文，避免采用英语咨询层较弱的“被触碰”。
theological_decisions:
- issue: 天使的能力与保护作用
  choice: 大能的天使……使我不至被胜过
  alternative: 有能力的天使……使我不受伤害
  rationale: 原文将天使描述为“能力/大能”的，并以ἡττᾶσθαι表达不被胜过；不把保护具体化为身体免受触碰或伤害。
- issue: 目的或结果关系
  choice: 使我不至被胜过
  alternative: 因此我没有被胜过
  rationale: τοῦ μή加不定式在此最自然地表示目的或预期结果；译作“使……不至”可保留两者间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。译文以希腊文本为首要依据；未沿用英语POB的“被触碰”，因为该义不符合ἡττάομαι的通常词义。
