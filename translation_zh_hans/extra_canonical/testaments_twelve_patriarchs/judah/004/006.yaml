- source_word: ἐπέπεσεν ἐπ᾽ αὐτοὺς τρόμος
  choice: 恐惧临到他们
  rationale: 保留希腊文“落到／临到他们”的意象，同时采用自然、庄重的现代汉语；“恐惧”准确表达 τρόμος 在此处因震骇而惧怕的含义。
- source_word: ἐπαύσαντο πολεμοῦντες ἡμᾶς
  choice: 他们便停止与我们争战
  rationale: ἐπαύσαντο 加分词表示停止正在进行的行动；“与我们争战”自然表达 πολεμεῖν 加宾格所指的敌对作战。
