  text: Therefore my father was free from चिंता in the wars while I was with my brothers.
translation:
  language: zh_hans
  text: 因此，我和弟兄们在一起时，父亲在征战中毫无忧虑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 准确表达承接上文的因果关系，符合现代汉语书面语。
- source_word: ἀμέριμνος
  choice: 毫无忧虑
  rationale: 表达“不忧虑、无牵挂”的状态；比“无忧无虑”更庄重，也避免让人误解为轻率或漫不经心。
- source_word: ἐν τοῖς πολέμοις
  choice: 在征战中
  rationale: 复数形式泛指多次战争或作战经历；“征战中”比直译“在战争中”更自然，并保留军事语境。
- source_word: ὅτε ἐγὼ σὺν τοῖς ἀδελφοῖς μου ἤμην
  choice: 我和弟兄们在一起时
  rationale: 自然呈现时间从句，并保留原文“与我的弟兄们同在”的基本含义。
