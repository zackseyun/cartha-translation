  text: And I went up upon the double wall and killed their king.
translation:
  language: zh_hans
  text: 我登上城墙，杀了他们的王；我们夺取了全部俘虏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俘虏”也可理解为泛指被掳获的人和物，即“掳获物”或“掳掠”。
    reason: αἰχμαλωσία在此可指被掳者的整体，也可较广义地指掳获或被掳的群体；正文采用在战争叙事中自然的“全部俘虏”，脚注保留语义范围。
lexical_decisions:
- source_word: ἀνῆλθον ... ἐπὶ τοῦ τείχους
  choice: 登上城墙
  rationale: 按所列希腊正文直译其动作和地点；现代汉语中简洁自然。
- source_word: ἀνεῖλον
  choice: 杀了
  rationale: 准确表达该动词在争战语境中的“杀死、除掉”，不额外强化杀戮方式。
- source_word: ἐλάβομεν
  choice: 夺取了
  rationale: 保留第一人称复数，表明犹大登城杀王后，其所属一方共同取得俘虏。
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: 所有被掳的人
  rationale: αἰχμαλωσία可指被掳者或掳获物；此处采用具体、自然的“被掳的人”，同时以脚注保留另一可能。
theological_decisions:
- issue: 是否补入英语咨询文本所称的“双重城墙”
  choice: 正文译作“城墙”
  alternative: “双重城墙”或“两道城墙”
  rationale: 用户所提供的希腊正文为τοῦ τείχους，仅明确表示“城墙”；不让英语修订说明凌驾于现有原文证据之上，但以脚注记录其反映的异文。
- issue: 是否保留末句“并夺取了所有被掳的人”
  choice: 保留
  alternative: 像英语咨询文本一样省略
  rationale: 该分句清楚见于所提供的希腊正文，不涉及教义性补足，故不可因英语层省略而删去。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留原文由单数“我”转为复数“我们”的视角变化，并补译英语咨询层遗漏的末句。
