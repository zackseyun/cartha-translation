base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/001.yaml
  text: And after this there came to us a war toward the south, greater than the one at Shechem; and having drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.
translation:
  language: zh_hans
  text: 这以后，我们在南方遭遇了一场战争，比示剑的那场更大[a]。我和弟兄们列阵迎战，追赶了一千人，杀了其中二百人，又杀了四个王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希腊文的比较表达十分简略，句法亦有难处。正文依本传本所理解的意思译为“比示剑的那场更大”；原文的简略措辞容许不同的细节分析。
    reason: 说明比较意义的译法根据，并保留原文结构的疑难与含混，不把推断表述为无争议的明文。
lexical_decisions:
- source_word: κατὰ νότον
  choice: 在南方
  rationale: 表示战争发生或来自南方这一方位；用现代汉语简洁表达，不把方位过度具体化为某一地点。
- source_word: πόλεμος
  choice: 一场战争
  rationale: 保留原文对战争事件的直接称呼。
- source_word: παραταξάμενοι
  choice: 列阵迎战
  rationale: 该词指摆开战阵、列队作战；“列阵迎战”既保留军事含义，也符合现代汉语习惯。
- source_word: ἐδιώξαμεν
  choice: 追赶
  rationale: 保留军事语境中的追击含义，同时避免添加原文未明说的战果。
- source_word: ἀπεκτείναμεν
  choice: 杀了
  rationale: 直接表达原文的致死动作，不作委婉化处理。
- source_word: βασιλεῖς
  choice: 王
  rationale: 采用这一古代叙事中通常且庄重的对应词，不擅自改为“首领”或“城主”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“我和弟兄们列阵迎战”自然呈现同伴共同作战；数字用汉字书写，与古代文献译文的整体语体协调。
