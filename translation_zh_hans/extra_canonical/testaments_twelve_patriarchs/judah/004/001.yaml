  text: And after this there came to us a war toward the south, greater than the one at Shechem; and having drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.
translation:
  language: zh_hans
  text: 这以后，我们在南方遭遇了一场战争，比在示剑的那场更大[a]。我和弟兄们列阵迎战，追赶了一千人，杀了其中二百人，又杀了四个王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本此处措辞十分简略，直译近似“在南方的一场战争，是示剑那场的……”，比较关系需要由语法补足；也有可能按不含明确比较程度的方式理解。
    reason: 原文在“示剑那场”前使用属格结构，却未明写通常表示“更大”的比较级，现译依上下文及传本传统保留比较意义，同时注明文本的含混。
lexical_decisions:
- source_word: κατὰ νότον
  choice: 在南方
  rationale: 表示战争发生或来自南方这一方位；用现代汉语简洁表达，不把方位过度具体化为某一地点。
- source_word: πόλεμος
  choice: 一场战争
  rationale: 保留原文对战争事件的直接称呼。
- source_word: παραταξάμενοι
  choice: 列阵迎战
  rationale: 该词指摆开战阵、列队作战；“列阵迎战”既保留军事含义，也符合现代汉语习惯。
- source_word: ἐδιώξαμεν
  choice: 追赶
  rationale: 保留军事语境中的追击含义，同时避免添加原文未明说的战果。
- source_word: ἀπεκτείναμεν
  choice: 杀了
  rationale: 直接表达原文的致死动作，不作委婉化处理。
- source_word: βασιλεῖς
  choice: 王
  rationale: 采用这一古代叙事中通常且庄重的对应词，不擅自改为“首领”或“城主”。
