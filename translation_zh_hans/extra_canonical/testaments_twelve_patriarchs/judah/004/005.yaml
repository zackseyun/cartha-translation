base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/005.yaml
  text: Then my father Jacob killed Belisath, king of all, father of kings, a giant man in strength, twelve cubits tall.
translation:
  language: zh_hans
  text: 我的父亲雅各杀了贝利撒——众王之王；他是个力气巨大的巨人，身高十二肘。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十二肘”约合五米多；古代“肘”的实际长度因地区和时代而异。
    reason: 帮助现代读者理解古代长度单位，同时避免给出虚假的精确换算。
lexical_decisions:
- source_word: ἀνεῖλε
  choice: 杀了
  rationale: 该动词在此表示杀死、除灭；“杀了”直接、自然，也不额外赋予战争或处决等语境。
- source_word: Βελισάθ
  choice: 贝利撒
  rationale: 按希腊文专名音译；末尾 θ 以“撒”作简明汉语转写，避免误认作已知圣经人物。
- source_word: βασιλέα πάντων τῶν βασιλέων
  choice: 众王之王
  rationale: 严格依照现存希腊文“所有君王的王”，不采纳英语修订层中原文没有的“众王之父”。
- source_word: ἄνδρα γίγαντα τῇ ἰσχύι
  choice: 他是个力气巨大的巨人
  rationale: 兼顾 ἄνδρα、γίγαντα 与表示力量的 τῇ ἰσχύι，以自然汉语表达其巨人身份和非凡力量。
- source_word: πηχῶν δώδεκα
  choice: 身高十二肘
  rationale: 属格数量结构表示身量；补出“身高”使汉语完整，同时保留古代长度单位“肘”。
theological_decisions:
- issue: 贝利撒的称号
  choice: 众王之王
  alternative: 万王之王；所有君王的王；众王之父
  rationale: 希腊文明确为 βασιλέα πάντων τῶν βασιλέων，即“所有君王的王”。“众王之父”没有希腊文依据，并可能引入原文不存在的谱系或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“众王之王”保留原文夸张而高亢的王室称号；破折号用来清楚连接人物称号与后续描述。
