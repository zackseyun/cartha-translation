  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023.yaml
  text: 'Until the coming of the God of righteousness[a], to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me with an oath not to blot out the kingdom.


    Great indeed is my grief, my children, because of the acts of sexual immorality and sorceries that you will practice in the kingdom, following ventriloquists and omens and demons of deception. You will make your daughters musicians and prostitutes, and you will mingle in the abominations of the nations. Because of these things the Lord will bring upon you famine and pestilence, death and a sword of vengeance, siege, and the insults of enemies and friends[d][c][b]. By foreigners my kingdom will be brought to its end.'
translation:
  language: zh_hans
  text: '**犹大遗训 23**


    **1** 孩子们，我因你们将在王国中所行的淫乱和巫术，深感忧愁；你们会追随招魂者[a]、征兆和迷惑人的鬼魔。 **2** 你们会使自己的女儿成为乐伎和娼妓[b]，也会与列国的可憎之事混在一起。


    **3** 因此，主必使饥荒、瘟疫、死亡、施行报应的刀剑[c]和围城临到你们；又使狗来撕裂，使你们受敌人羞辱，遭遇敌人的毁灭[d]；你们的眼睛会坏死，婴孩会被杀，财物会被抢夺，神的殿宇会被焚烧，土地会荒废，而你们自己会在列国中为奴。 **4** 他们还会阉割你们的儿子，使他们成为服侍其妇女的太监。


    **5** 直到你们的主眷顾你们。你们要全心悔改，遵行他的一切诫命；他必把你们从列国的囚禁中领出来。[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “招魂者”原文直译为“腹中说话的人”或“腹语者”，在古代通常指声称能传达亡灵或灵界声音的灵媒。
    reason: cultural_note
  - marker: b
    text: 原文直译为“有音乐技艺的女子和公共的女子”；后一个称呼很可能指娼妓，整组词可能描写女儿被迫成为供人娱乐和淫乐的女子。
    reason: lexical_alternative
  - marker: c
    text: “施行报应的”在所据希腊文本中修饰“刀剑”；这一短语及本节若干灾祸项目在抄本传统中存在差异。
    reason: textual_variant
  - marker: d
    text: “敌人的毁灭”也可能理解为“由敌人造成的毁灭”。原文属格关系含混，正文保留未完全消解的表达。
    reason: ambiguity
  - marker: e
    text: 本节希腊文句法压缩，眷顾、悔改、遵行诫命和脱离囚禁之间的语法关系并不完全清楚；译文未将其强行改写成明确的条件句。
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀσελγείας
  choice: 淫乱
  rationale: 该词指无耻放纵的淫荡行为；“淫乱”简洁、自然，并保留其明确的性伦理含义。
- source_word: γοητείας
  choice: 巫术
  rationale: 指非法的法术或邪术实践；“巫术”符合本段列举禁忌行为的语境。
- source_word: ἐγγαστρομύθους
  choice: 招魂者
  rationale: 字面义为“腹语者”，但古代宗教语境中通常指借声音传达亡灵或灵界信息的灵媒；正文采用功能对等的称呼，字面形象见脚注。
- source_word: κληδόσι
  choice: 征兆
  rationale: 可指被当作预兆的言语、声音或迹象；“征兆”保留其占卜色彩而不过度限定具体形式。
- source_word: δαίμοσιν πλάνης
  choice: 迷惑人的鬼魔
  rationale: 将属格理解为性质或作用，保留这些鬼魔造成欺骗、迷误的含义。
- source_word: μουσικὰς καὶ δημοσίας
  choice: 乐伎和娼妓
  rationale: μουσικάς指受音乐或表演训练的女子；δημοσίας字面为“公共的女人”，在此很可能指供人取乐的娼妓。“乐伎和娼妓”既反映古代社会角色，也避免生硬的直译。
- source_word: ἐπιμιγήσεσθε
  choice: 混在一起
  rationale: 保留“混合、掺杂”的意象，不把含义擅自缩窄为通婚或性结合。
- source_word: κύνας εἰς διασπασμόν
  choice: 使狗来撕裂
  rationale: 直接表达狗造成撕扯、肢解的恐怖审判景象。
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: 眼睛会坏死
  rationale: σφακελισμός指坏疽、组织坏死；采用现代读者可懂的医学性表达。
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: 财物会被抢夺
  rationale: ὑπάρχοντα在此指所有物、财产；ἁρπαγή指强行掠夺。
- source_word: ἐκτεμοῦσι ... εἰς εὐνούχους
  choice: 阉割……使……成为太监
  rationale: 明确呈现原文的身体伤害及其结果，不以委婉说法淡化。
- source_word: ἐν τελείᾳ καρδίᾳ
  choice: 全心
  rationale: τελεία在此指完整、无保留；“全心”是自然庄重的现代汉语表达。
theological_decisions:
- issue: 灾祸是泛指历史后果，还是主主动施行的审判
  choice: 保留“主必使……临到你们”的主动表达
  alternative: 因这些事，你们将遭遇……
  rationale: 原文ἐπάξει明确以“主”为主语，不能将神施行审判的表述弱化为纯粹自然后果。
- issue: δαίμοσιν πλάνης所指为何
  choice: 译为“迷惑人的鬼魔”
  alternative: “谬误之灵”或“使人迷失的邪灵”
  rationale: 保留δαίμονες的具体超自然指称，同时不引入后世系统神学中更细的灵界分类。
- issue: 第5节眷顾、悔改、遵命与归回之间的关系
  choice: 依原文次序并列表达：主眷顾；百姓全心悔改、遵命；主领其归回
  alternative: 将整句解释为“直到你们悔改以后，主才眷顾并领回你们”
  rationale: 希腊文句法压缩且衔接不规则，若明确改写成严格的条件—结果关系，会替原文消解神的眷顾与人的悔改之间保留的张力。
- issue: “神的殿宇”是单一圣殿还是多处神圣建筑
  choice: 译为“神的殿宇”
  alternative: “神的圣殿”
  rationale: 原文ναῶν为复数；中文用集合性“殿宇”保留复数可能性，不擅自归一为耶路撒冷单一圣殿。
translation_notes:
  register: 采用现代、庄重而直接的简体中文，保留遗训体的父辈劝诫和先知性审判语气。对性剥削、阉割、杀婴和掠夺等内容不作委婉淡化；对古代术语则在正文中使用普通读者可理解的功能对等词，并以脚注说明字面形式。第3节保持原文密集灾祸清单的累积节奏，第5节则以短句和分号呈现其压缩、略显不规则的句法。
