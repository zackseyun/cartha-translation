base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/003.yaml
  text: And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me likewise.
translation:
  language: zh_hans
  text: 亚伯拉罕，我的先祖，祝福我在以色列中作王；雅各也同样祝福了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρόπατός μου
  choice: 我的先祖
  rationale: πρόπατωρ 指较早世代的祖先；“先祖”自然、庄重，也符合亚伯拉罕与犹大之间的世系关系。
- source_word: εὐλόγησέ με
  choice: 祝福我
  rationale: 直接保留 εὐλογέω 的核心含义，并维持两分句的重复结构。
- source_word: βασιλεύειν ἐν Ἰσραήλ
  choice: 在以色列中作王
  rationale: 不定式表示祝福所指向的统治身份或使命；“作王”比“统治”更贴近 βασιλεύω，“在以色列中”保留 ἐν 的表达及其可能的范围意味。
- source_word: οὕτως
  choice: 同样
  rationale: 在此承接前句，表示雅各也以相应方式祝福犹大；“同样”自然且不额外限定祝福内容完全相同。
theological_decisions:
- issue: 亚伯拉罕的祝福与犹大作王之间的关系
  choice: 译为“祝福我在以色列中作王”
  alternative: “祝福我，使我在以色列中作王”
  rationale: 保留希腊文 εὐλόγησέ με βασιλεύειν 的紧凑结构，不把不定式与祝福之间的关系过度解释为明确的使役结果。
- issue: οὕτως 所指的相同性范围
  choice: 译为“也同样祝福了我”
  alternative: “也这样祝福了我”
  rationale: 原文没有重述雅各祝福的具体内容；“同样”保留其回指作用，同时避免断言两次祝福在每一细节上完全一致。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现两个并列祝福陈述，使句意清晰；不添加经文编号或原文没有的解释性称谓。
