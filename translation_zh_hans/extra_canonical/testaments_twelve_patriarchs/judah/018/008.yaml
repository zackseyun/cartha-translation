  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/008.yaml
  text: They hinder the sacrifices of God, and do not remember the blessing of God. They do not listen when a prophet speaks, and resent words of godliness.
translation:
  language: zh_hans
  text: 他们阻挠向上帝所献的祭，也不记念上帝的赐福；先知说话时，他们不听，也厌恶敬虔的话语。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ
  choice: 献给上帝的祭
  rationale: Θυσίας为复数，指祭物或献祭；此处用“祭”作集合性表达，并以“献给上帝的”自然呈现属格关系，避免将其误解为上帝亲自献上的祭。
- source_word: ἐμποδίζει
  choice: 阻挠
  rationale: 该动词意为妨碍、阻止；“阻挠”既保留主动抵制之意，也符合现代汉语表达。
- source_word: εὐλογίαν Θεοῦ
  choice: 上帝的赐福
  rationale: εὐλογία可指祝福或赐福；结合“不记念”，译作“赐福”较自然，同时保留其来自上帝的含义。
- source_word: μνημονεύει
  choice: 记念
  rationale: 表示记得、提念；“记念”兼具记在心中与郑重忆及的语气，适合宗教文本。
- source_word: Προφήτου λαλοῦντος
  choice: 先知说话时
  rationale: 属格绝对结构直译为时间状语，保持原文未限定具体先知的特点。
- source_word: λόγους εὐσεβείας
  choice: 敬虔的言语
  rationale: εὐσέβεια表示对上帝的敬畏与虔诚；“敬虔”比泛化的“宗教”更贴近原词，并不附加宗派含义。
- source_word: προσοχθίζει
  choice: 厌恶
  rationale: 该词表达不悦、恼怒或反感；“厌恶”传达对敬虔言语的强烈排斥，同时避免过度具体化为发怒。
theological_decisions:
- issue: “Θυσίας Θεοῦ”中属格的关系
  choice: 献给上帝的祭
  alternative: 上帝的祭
  rationale: 希腊语属格本身可较宽泛地理解；正文采用现代汉语中最自然且符合献祭语境的目标属格表达，但不扩展祭礼种类或神学解释。
- issue: 数的一致性
  choice: 全句采用复数主语“他们”
  alternative: 依希腊语单数动词译为“他”
  rationale: 现存希腊文本中的有限动词形式为第三人称单数，但英语审校层及上下表达将所指理解为复数群体。译文采用复数以维持本节指称连贯；此处可能反映文本传承或集合主语造成的数不一致。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号对应两组并列指控；加入“反而”自然显明“不听”与“厌恶”之间的递进对照，不增加新的神学判断。
