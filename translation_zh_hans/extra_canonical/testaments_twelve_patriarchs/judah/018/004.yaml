  text: And I know what evils you will do in the last days.
translation:
  language: zh_hans
  text: 我也知道你们在末后的日子[a]将要行的种种恶事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在末后的日子”在现存希腊文本中以方括号标示，表明其文本归属可能存在疑问。
    reason: 源文本把 ταῖς ἐσχάταις ἡμέραις 置于方括号内；正文保留该短语，同时向读者说明文本证据的不确定性。
lexical_decisions:
- source_word: ἔγνωκα
  choice: 知道
  rationale: 完成时在此表达已经获得并持有的认识；现代汉语用“知道”自然传达其现时状态。
- source_word: ὅσα κακὰ
  choice: 种种恶事
  rationale: ὅσα 表示所行恶事的范围或总括性；译作“种种”比单纯“什么恶事”更自然，并保留复数 κακά 的意味。
- source_word: ποιήσετε
  choice: 将要行
  rationale: 直陈式将来时，指听众未来所做之事；“行”与“恶事”搭配庄重而通顺。
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: 在末后的日子
  rationale: 保留犹太—基督教末世语汇的时间表达，不将其具体化为未经原文说明的时期。
theological_decisions:
- issue: “末后的日子”的范围
  choice: 保留“末后的日子”
  alternative: 末日／晚年
  rationale: 原文没有明确说明这是世界终末、某一历史末期，还是受话者生命的晚期；直译可保留其末世性与指涉上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我也知道”承接前文语气；“你们”保留复数受话者；不对“末后的日子”作教派化解释。
