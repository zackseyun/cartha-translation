  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/007.yaml
  text: It deprives his soul of every goodness, and holds him fast in pains and labors; it drives sleep away from him, and consumes his flesh.
translation:
  language: zh_hans
  text: 它使他的灵魂丧失一切良善，使他困于痛苦和劳碌之中；又驱走他的睡眠，耗尽他的血肉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος
  choice: 使他的灵魂丧失一切良善
  rationale: “στερίσκω…ἀπό”表示剥夺、使失去；保留“灵魂”和“一切良善”的广泛含义，不将其窄化为某种特定德行或福分。
- source_word: συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις
  choice: 使他困于痛苦和劳碌之中
  rationale: “συνέχει”有扣住、困住之意；“πόνοις καὶ μόχθοις”兼含痛苦与辛劳，用“痛苦和劳碌”保留两者的并列。
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: 驱走他的睡眠
  rationale: 按语境表达睡眠被赶离此人；中文用主动结构自然传达原文动作。
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: 耗尽他的血肉
  rationale: “καταδαπανάω”强调彻底消耗；复数“σάρκας”在此指人的肉身，译作“血肉”既自然又保留其强烈的身体意象。
theological_decisions:
- issue: 本节各动词的隐含主语
  choice: 统一用单数“它”
  alternative: 用复数“它们”，或重复上一节所指事物的名称
  rationale: 现存希腊文本中的动词均为第三人称单数，因此采用单数代词；不在本节擅自补明前文所指的具体对象，以保留篇章指代关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；分号保留原句前后两组伤害的节奏。“灵魂”“良善”“血肉”维持原文的精神、伦理与身体层面。
