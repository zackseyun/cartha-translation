base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/006.yaml
  text: For these turn one away from the law of God, and blind the judgment of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor.
translation:
  language: zh_hans
  text: 因为这些事使人离弃上帝的律法，蒙蔽心灵的判断，教人狂傲，不让人怜悯自己的邻人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数所指，承接上文列举的事物或行为，不擅自明确其具体内容。
- source_word: ἀφιστᾷ
  choice: 使人离弃
  rationale: 表达使人背离、远离的使役含义，并自然搭配“上帝的律法”。
- source_word: τυφλοῖ
  choice: 蒙蔽
  rationale: 保留“使失明”的比喻意义，指判断能力受到遮蔽。
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: 心灵的判断
  rationale: διαβούλιον在此指内在的思量、判断；译作“判断”比“目的”更贴合语境，同时保留属格结构。
- source_word: ὑπερηφανίαν
  choice: 狂傲
  rationale: 传达高傲、自大的负面伦理含义，措辞凝练庄重。
- source_word: ἐλεῆσαι
  choice: 怜悯
  rationale: 准确表达向他人施予怜恤、慈悲的意思。
- source_word: τὸν πλησίον αὐτοῦ
  choice: 自己的邻人
  rationale: 保留“邻人”的传统伦理用语及第三人称所属关系，不缩窄为地理上的邻居。
theological_decisions:
- issue: “上帝的律法”的表述
  choice: 上帝的律法
  alternative: 神的律法
  rationale: 两者均可；采用现代普通读者易懂且庄重的“上帝”，不引入宗派性解释。
- issue: “心灵的判断”所指
  choice: 保留为心灵内部的判断能力
  alternative: 译作“灵魂的谋略”或“心灵的目的”
  rationale: 原词可涉及思量、商议或判断；本句论述蒙蔽所造成的伦理损害，“判断”最符合搭配，但不进一步将其解释为良知或理性，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文四个并列谓语的推进关系；“这些事”的具体所指留待上下文界定。
