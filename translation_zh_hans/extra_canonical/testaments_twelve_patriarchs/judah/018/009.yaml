  rationale: 修订仅处理原文单数动词ἐτύφλωσε的施事者问题：采用与前文隐含主语一致的“他”，同时避免把希腊文未明确说明的施事者解释为复数欲念。末句保留，并以“失明”维持原文的视觉比喻及昼夜对照。未提供可供翻译的脚注内容，故不增设脚注。
