  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει³⁵, *καὶ Θεῷ ὑπακοῦσαι³⁶ οὐ δύναται³⁷, ὅτι ἐτύφλωσε³⁸ τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/009.yaml
  text: For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.
translation:
  language: zh_hans
  text: 因为他受两种彼此对立的欲念奴役，不能顺服上帝；因为他使自己的心灵失明，在白昼行走如同在黑夜里一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν
  choice: 欲念
  rationale: 此处指支配人的强烈内在冲动；“欲念”既自然易懂，也保留其负面伦理色彩。
- source_word: ἐναντίοις
  choice: 彼此对立的
  rationale: 明确表达两种欲念互相冲突，而不把冲突的具体性质解释得过窄。
- source_word: δουλεύει
  choice: 受……奴役
  rationale: 保留希腊文“作奴仆、受辖制”的强烈比喻。
- source_word: ὑπακοῦσαι
  choice: 顺服
  rationale: 表达听从并服从上帝，符合此处伦理与宗教语境。
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: 蒙蔽了他的心灵
  rationale: 保留“使瞎眼”的比喻性意义；中文以“蒙蔽心灵”表达属灵与道德认知受阻。
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: 使他在白昼行走也如同在黑夜里一样
  rationale: 恢复英文咨询层遗漏的末句，并保留白昼与黑夜的鲜明对照及“行走”的生命道路意象。
theological_decisions:
- issue: 蒙蔽心灵的主语
  choice: 这两种欲念
  alternative: 单数的某一欲念，或泛指前述受奴役的状态
  rationale: 希腊文ἐτύφλωσε为单数，但最自然的语义先行项是复数“两个彼此对立的欲念”，形成数不一致。译文采用语境上的复数所指，同时不引入外在属灵主体。
- issue: “不能顺服上帝”的能力表述
  choice: 不能顺服上帝
  alternative: 无法听从上帝
  rationale: 直译οὐ δύναται，保留受欲念奴役所造成的实际无能，不将其弱化为单纯不愿意。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留奴役、蒙蔽、昼夜行走等原文意象；分号呈现因果推进。
