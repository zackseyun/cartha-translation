base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/005.yaml
  text: Guard yourselves, therefore, my children, from sexual immorality and the love of money, and listen to Judah your father.
translation:
  language: zh_hans
  text: 5. 所以，我的孩子们，你们要提防淫乱和贪爱钱财，也要听你们父亲犹大的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: 要提防
  rationale: 该中间语态命令式表示主动警戒、自我防范；“提防”在现代汉语中自然，并保留劝诫语气。
- source_word: πορνείας
  choice: 淫乱
  rationale: 概括不正当的性行为，符合本段伦理劝诫的语域，且不把词义限缩为某一种具体行为。
- source_word: φιλαργυρίας
  choice: 贪财
  rationale: 直指对钱财的贪爱，较“爱钱”更自然地表达其负面伦理含义。
- source_word: ἀκούσατε
  choice: 听从
  rationale: 在父亲向孩子发出劝诫的语境中，不只是听见，也包含听取并遵从之意。
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: 你们的父亲犹大
  rationale: 按自然汉语调整同位结构，同时完整保留说话者的姓名和父亲身份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的父辈训诫语体。“所以”承接上文；“我的孩子们”保留亲属称呼和直接呼语。希腊文一个介词ἀπό统领“淫乱”和“贪财”，汉语用“提防……和……”自然呈现，不重复介词。
