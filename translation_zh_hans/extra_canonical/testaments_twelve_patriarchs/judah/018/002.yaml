  text: Therefore I never grieved Jacob my father, for I did everything he told me.
translation:
  language: zh_hans
  text: 我从未违逆我父亲雅各，因为凡他吩咐我的，我都照做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρελάλησα
  choice: 违逆
  rationale: 此处动词按语境指不听从、违背父亲的话；译作“违逆”既体现行为上的不服从，也比英语咨询文本的“使……忧伤”更贴近希腊词所表达的言语或行动上的抗拒。
- source_word: πάντα ὅσα μοι ἔλεγεν ἐποίουν
  choice: 凡他吩咐我的，我都照做了
  rationale: 保留“凡……都……”的全称结构，并将持续性的ἔλεγεν自然表达为父亲对他的吩咐；ἐποίουν译为“照做了”，突出遵行。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我父亲雅各”保留原文同位结构；不补出英语咨询层中的“因此”，因为所给希腊文本没有对应的连接词。
