  text: '1. And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.


    2. So Dan and I, pretending to be Amorites as though allies, entered their city.


    3. And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering everything that belonged to them, we tore down their three walls.


    4. And we drew near to Thamna, where all their baggage was.


    5. Then, being insulted by them, I became angry, and I rushed up against them to the summit. And they kept hurling stones and shooting arrows at me.


    6. And if Dan my brother had not fought alongside me,'
translation:
  language: zh_hans
  text: '7:1 第二天，有消息传到我们这里，说迦阿斯城的王正率领大队人马向我们而来。


    2 于是，我和但前往亚摩利人那里，假装是他们的盟友，进入了他们的城。


    3 到了深夜，我的弟兄们来到我们这里；我们给他们打开城门，将他们全都消灭，又加以掠夺。


    4 我们又逼近亭拿，敌方诸王的一切辎重都在那里。


    5 那时，我受了他们的侮辱，便发怒冲上山顶，攻打他们；他们用投石索向我投石，又向我射箭。


    6 要不是我的兄弟但与我并肩作战，'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λαῷ πολλῷ
  choice: 率领大队人马
  rationale: 这里的 λαός 指随王而来的大批人众，在军事叙事中自然表达为“大队人马”，但不擅自限定为正规军。
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: 假装是他们的盟友
  rationale: 按希腊文句法，假装的身份是“他们的盟友”；不采用英文咨询层中语义较含混的“假装是亚摩利人”。
- source_word: πάντας αὐτοὺς ἐξωλοθρεύσαμεν
  choice: 把城里的人全都灭了
  rationale: 保留 ἐξολοθρεύω 的彻底毁灭语气；以“城里的人”明确代词在叙事中的所指。
- source_word: ἐπρονομεύσαμεν
  choice: 洗劫了那城
  rationale: 该动词表示掠夺、抢劫；现存所给希腊正文到此为止，不加入英文层所见的额外拆墙内容。
- source_word: ἡ ἀποσκευή
  choice: 辎重
  rationale: 军事语境中指行装、装备和补给等随军物资，“辎重”简洁而准确。
- source_word: ὑβριζόμενος
  choice: 受了他们的侮辱
  rationale: 保留被羞辱或凌辱的含义，不弱化为一般挑衅。
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: 用机弦向我投石
  rationale: 明确 σφενδονίζω 所指的投石器具，避免误解为徒手扔石。
- source_word: συνεμάχησεν
  choice: 与我并肩作战
  rationale: 自然传达共同参战、援战之意，并保留未完条件句的悬接状态。
theological_decisions:
- issue: 暴力叙事的措辞
  choice: 直译为“全都灭了”及“洗劫”
  alternative: 使用“击败”“夺取”等弱化措辞
  rationale: 原文明确描述彻底毁灭和掠夺；译文如实呈现叙事，不作道德辩护，也不淡化暴力。
- issue: 第6节未完条件句
  choice: 保留逗号结尾的未完句式
  alternative: 根据后续内容或英文层补足结果从句
  rationale: 用户提供的希腊语源文在条件从句后中断，应保留文本边界和悬念，不擅自补文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名、地名使用常见圣经汉译形式“但、亚摩利人、亭拿”；较生僻地名 Γαὰς 音译为“迦阿斯”。第3节严格依据所给希腊正文，不纳入英文咨询层中没有对应源文证据的“拆毁三道城墙”。第4节的“诸王”来自明确的复数 βασιλέων。
