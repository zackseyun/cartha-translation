  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/003.yaml
  text: For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which he gave me because of my obedience to my father Jacob.
translation:
  language: zh_hans
  text: 因为他们甚至会败坏我子孙中的智慧人，也会使犹大的国度衰微；这国度是主因我顺从父亲而赐给我的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοιώσουσι
  choice: 使……变质
  rationale: 原义是“改变、使变样”；此处宾语为智慧人，语境显然带负面意味。“使……变质”既保留“改变”的意象，也自然表达道德或品格败坏。
- source_word: βασιλείαν Ἰούδα
  choice: 犹大的国度
  rationale: 直译属格结构，保留其既可指王权、也可指王国的语义范围；结合“衰微”译作“国度”较自然。
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: 会使……衰微
  rationale: 该使役结构字面为“使之变小”。用于国度时，“衰微”自然表达其规模、势力或地位被削弱，而不额外限定具体方面。
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: 因我顺从父亲
  rationale: ἐν在此可表达伴随状态或依据、缘由；译为“因”符合上下文，同时不补入希腊文本未出现的“雅各”。
theological_decisions:
- issue: 国度的赐予者是否明说为“主”
  choice: 主
  alternative: 他
  rationale: 现有希腊文本明确载有Κύριος，因此应译出“主”；不能依据英文修订层删去这一称谓。
- issue: 顺从的对象是否补明为雅各
  choice: 父亲
  alternative: 父亲雅各
  rationale: 希腊文本只有πατρός μου（我的父亲），虽可由上下文推知是雅各，但正文不宜补入专名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“众子中的智慧人”保留原文范围关系；分号清楚连接先行词“这国度”与后面的关系从句。
