revisions:
- from: 因为他们甚至会使我众子中的智慧人变质，也会使犹大的国度衰微；这国度是主因我顺从父亲而赐给我的。
  to: 因为他们甚至会败坏我子孙中的智慧人，也会使犹大的国度衰微；这国度是主因我顺从父亲而赐给我的。
  rationale: 修订仅改善对ἀλλοιώσουσι的语境对应及汉语自然度，并将“众子”改为更通顺、且适合此类族长遗训语境的“子孙”。保留“主”，因为希腊底本明确写有Κύριος；保留“父亲”的未具名形式及“衰微”的概括性，以避免超出原文。
