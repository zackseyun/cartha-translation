  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/002.yaml
  text: And I know that because of these two things my offspring will be for destruction because of sexual immorality.
translation:
  language: zh_hans
  text: 我知道，由于这两件事，我的后代会因淫乱而走向毁灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因淫乱而走向毁灭”原文直译近于“走向淫乱的毁灭”；其中属格关系也可理解为“走向淫乱所带来的毁灭”，或“陷入毁灭性的淫乱”。
    reason: 原文 ἀπώλειαν πορνείας 的属格关系具有歧义，需要保留其可能的原因性或性质性理解。
lexical_decisions:
- source_word: οἶδα
  choice: 我知道
  rationale: 用直接、自然的现代汉语表达说话者确定的认知。
- source_word: διὰ τὰ δύο ταῦτα
  choice: 由于这两件事
  rationale: 保留 διά 加宾格所表达的原因关系，并保持“这两件事”的回指。
- source_word: τὸ γένος μου
  choice: 我的后代
  rationale: γένος 在此指犹大的后裔或族系；“后代”比“种族”自然，也不额外限定为某一代人。
- source_word: εἰς ἀπώλειαν
  choice: 走向毁灭
  rationale: 表达 εἰς 所指向的结局，同时避免生硬直译为“成为归于毁灭”。
- source_word: πορνείας
  choice: 因淫乱
  rationale: πορνεία 指不正当的性行为；“淫乱”在此庄重简洁，并按语境将属格理解为导致毁灭的原因。
theological_decisions:
- issue: ἀπώλειαν πορνείας 中属格 πορνείας 的关系
  choice: 译作“因淫乱而走向毁灭”
  alternative: “走向淫乱所带来的毁灭”或“陷入毁灭性的淫乱”
  rationale: 希腊语属格可表达原因、性质或关联。正文采用最合乎上下文且与英语审校层一致的原因性理解，但以脚注保留其他可能性，避免把原文的张力完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文的因果结构，并以“走向毁灭”自然表达所趋向的结局。
