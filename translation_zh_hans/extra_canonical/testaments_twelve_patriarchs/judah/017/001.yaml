  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, μὴ ἀγαπᾶτε⁵ ἀργύριον⁶ μηδὲ ἐπιβλέπει⁷ *εἰς κάλλος⁸ γυναικῶν, ὅτι κἀγὼ διὰ χρυσίον καὶ εὐμορφίαν¹⁰ ἐπλανήθην εἰς Βησουὲ¹¹ τὴν Χαναναίαν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/001.yaml
  text: 'And now I command you, my children: do not love silver, nor set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.'
translation:
  language: zh_hans
  text: 现在，我吩咐你们，我的孩子们：不要贪爱银子，也不要注目于女子的美貌；因为我自己也因黄金和美貌而被引诱到迦南女子比苏厄那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριον
  choice: 银钱
  rationale: 该词本义为“银”，在“贪爱”的语境中也指钱财；译作“银钱”既保留物质意象，又自然表达财富之意。
- source_word: ἐπιβλέπει εἰς κάλλος γυναικῶν
  choice: 注目于女子的美貌
  rationale: 保留“把目光投向”的视觉意象，并以现代汉语自然表达持续关注或迷恋之意。
- source_word: χρυσίον
  choice: 金钱
  rationale: 原词本义为黄金，此处与前文“银钱”平行，并指财富诱惑；“金钱”兼顾字面关联和语境功能。
- source_word: εὐμορφίαν
  choice: 美貌
  rationale: 指姣好的外貌，与前文 κάλλος 呼应，统一译为“美貌”符合汉语表达。
- source_word: ἐπλανήθην εἰς Βησουὲ
  choice: 受迷惑，娶了……比苏厄
  rationale: ἐπλανήθην 表示被引入歧途；εἰς 加人名在此语境指被引向并与该女子结合。补出“娶了”使中文关系清楚，同时保留“受迷惑”的道德判断。
theological_decisions:
- issue: 财富与女性美貌在劝诫中的关系
  choice: 保留二者并列作为使犹大受迷惑的因素
  alternative: 将重点泛化为贪欲或情欲
  rationale: 原文明确并列银钱/黄金与女子的美貌，不应将其归并为单一的抽象罪性。
- issue: ἐπλανήθην 的责任与被动意味
  choice: 译为“受迷惑”
  alternative: “误入歧途”或“被引诱”
  rationale: 该被动形式容许外在诱因与本人失足之间的张力；“受迷惑”不武断指定具体的施动者。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我的孩子们”保留遗训体的亲属称呼；句式紧凑，适合公开诵读。专名 Βησουὲ 音译为“比苏厄”，族属译为“迦南女子”。
