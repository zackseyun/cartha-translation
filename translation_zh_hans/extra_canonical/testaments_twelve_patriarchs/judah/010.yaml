  text: After these things[a], Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram. But Er was wicked, and an angel of the Lord killed him. And I gave her to Onan, my second son, and behold, the Lord struck him down also. For he did not know her, through the scheming of his mother, because he did not want to have children by her. During the days of the bridal chamber I gave Onan to her in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year. And when I threatened him, he went in to her[b], but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because Tamar was not from the daughters of Canaan[d][c], as she herself was.
translation:
  language: zh_hans
  text: '**《犹大遗训》第10章**


    1 这些事以后[a]，我儿子珥从美索不达米亚娶了亚兰的女儿她玛为妻。2 珥为人邪恶，主的一位天使便杀了他。3 他自己因母亲的诡计，没有认识她[b]，因为他不愿意从她得儿女。4 在婚房的日子里，我让俄南按弟兄的本分娶她[c]；可是他也出于邪恶，没有认识她，尽管他与她一起过了一年。5 我警告他以后，他虽然与她同房，却照他母亲的吩咐，将精液毁弃在地上。因此，他也死在邪恶中[d]。6 我本想把示拉也给她，但示拉的母亲不许；她这样行恶，是因为她玛不像她自己那样，是迦南女子。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些希腊文本在事情的先后和时间细节上略有不同，包括珥是在第二天还是第三夜死亡，以及俄南是立即被交给她，还是在婚礼期间与她结合。
    reason: textual_variant
  - marker: b
    text: “认识她”是圣经中表示发生性关系的委婉说法。
    reason: lexical_alternative
  - marker: c
    text: “按弟兄的本分娶她”指死者的兄弟有责任借着寡妇为死者延续后代；参看《创世记》第38章。
    reason: cultural_note
  - marker: d
    text: 本章反复使用“邪恶／行恶”一类词语，把珥和俄南的死亡以及母亲的阻挠归入同一个道德模式。
    reason: cross_reference
lexical_decisions:
- source_word: πονηρός / ἐν πονηρίᾳ / ἐπονηρεύσατο
  choice: 邪恶／心存邪恶／行恶
  rationale: 保留贯穿本段的同一强烈道德词汇，同时按形容词、介词短语和动词的不同句法采用自然汉语表达。
- source_word: ἄγγελος Κυρίου
  choice: 主的一位天使
  rationale: 希腊文没有冠词，不必把这位天使认定为特指的“主的使者”；“一位”谨慎保留其非特指性。
- source_word: ἔγνω / οὐκ ἔγνω αὐτήν
  choice: 认识她／没有认识她
  rationale: 保留圣经式委婉语及原文措辞；借脚注说明这里指发生性关系，避免正文将含蓄表达完全摊平。
- source_word: πανουργία
  choice: 诡计
  rationale: 表达母亲蓄意谋划、操纵的含义，现代汉语清楚而不失庄重。
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: 从她生儿女
  rationale: 保留原文以女子为生育来源的谱系语意，汉语也简洁自然。
- source_word: ἐπεγυμβρευσα αὐτῇ
  choice: 让俄南按弟兄的本分娶她
  rationale: 该动词指向兄终弟及的婚姻责任；正文点明“弟兄的本分”，脚注再交代制度背景。
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: 在洞房期间
  rationale: 保留 θάλαμος 的婚房意象，同时以“期间”表达一段婚礼或新婚时日，而非机械直译为“洞房的日子”。
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  choice: 与她一起过了一年
  rationale: 贴近希腊文“同她度过一年”的宽泛表述，不额外断定二人正常同居或发生性关系。
- source_word: συνῆλθε μὲν αὐτῇ
  choice: 虽与她同房
  rationale: 以庄重而明确的汉语表达性结合，并用“虽……却……”呈现 μὲν…δέ 的转折。
- source_word: διέφθειρε τὸ σπέρμα ἐπὶ τὴν γῆν
  choice: 把精液毁在地上
  rationale: σπέρμα 在这一性行为语境中具体指精液；“毁”保留 διέφθειρε 的主动破坏意味，也不弱化原文形象。
- source_word: οὐκ ἀφῆκεν
  choice: 不许
  rationale: 准确表达母亲阻止犹大实行其意愿，简洁自然。
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: 迦南女子
  rationale: 传达族群与女性身份；相比逐字译作“迦南的女儿们”，现代汉语更自然。
theological_decisions:
- issue: 珥之死的施行者
  choice: 译为“主的一位天使便杀了他”
  alternative: 译为“主杀了他”或特指“主的使者杀了他”
  rationale: 当前希腊底本文本明确写 ἄγγελος Κυρίου，且无冠词；既不把天使的行动直接改写成主亲自行事，也不将其身份神学化为特定的“主的使者”。
- issue: 当前希腊底本与英语审校层在俄南叙事次序上的差异
  choice: 不加入“我把她给了次子俄南，主也击杀了他”等当前希腊正文没有的句子
  alternative: 依英语咨询文本补入该句，以使叙事更接近其他见证或创世记传统
  rationale: 指定的 α 栏希腊正文应居首要地位。其第3节在珥死讯之后仍以“他自己”继续叙述，存在真实的次序张力；译文不以其他见证或圣经平行叙事暗中补齐。
- issue: 兄终弟及婚姻术语
  choice: 正文译作“按弟兄的本分娶她”，并以脚注解释
  alternative: 只译“娶她”，或采用不易懂的专门术语“利未婚”
  rationale: 希腊动词包含特定亲属义务；译文明示其核心意义，又避免使用普通读者可能误解为利未支派婚姻的音译术语。
- issue: “认识她”的性含义
  choice: 正文保留委婉语，脚注解释
  alternative: 正文直接译为“与她发生性关系”
  rationale: 原文有意采用圣经传统中的委婉表达；保留它可维持文体和前后对照，同时脚注确保现代读者不会误解。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。人名和地名沿用简体中文圣经常见译名。正文以指定希腊 α 栏为准，不把英语咨询层中当前底本所无的补充句纳入正文；对由此留下的叙事张力不擅自调和。性行为相关措辞在“认识她”处保留原文委婉语，在“同房”和“精液”处则依希腊文的明确程度直译。
