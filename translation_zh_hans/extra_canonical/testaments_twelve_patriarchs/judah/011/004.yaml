- source_word: κατηρασάμην
  choice: 咒诅了
  rationale: 直译该动词“诅咒、咒诅”，不弱化为“斥责”。
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: 在心灵的痛苦中
  rationale: 贴近希腊文结构，ψυχή在此指人的内在生命或心灵；“痛苦”准确表达ὀδύνη的深切苦楚。
