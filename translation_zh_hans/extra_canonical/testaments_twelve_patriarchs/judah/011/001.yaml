  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/001.yaml
  text: And I knew that the race of the Canaanites was evil, but the impulse of youth blinded my understanding.
translation:
  language: zh_hans
  text: 我也知道，迦南人是邪恶的族类；但年轻时的冲动蒙蔽了我的心智。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀγώ
  choice: 我也
  rationale: 保留καὶ与第一人称代词结合所表达的承接或强调语气。
- source_word: πονηρὸν γένος
  choice: 邪恶的族类
  rationale: πονηρός在此指道德上的邪恶；γένος指族类、族群，用“族类”既贴近原文，也避免现代“种族”一词可能带来的生物学含义。
- source_word: τῶν Χαναναίων
  choice: 迦南人
  rationale: 采用现代中文圣经及一般读者熟悉的族名译法；属格与γένος结合，译为“迦南人是……族类”以求自然。
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: 青春的冲动
  rationale: διαβούλιον可指念头、意向或内在驱策；结合νεότης，这里译作“青春的冲动”，保留年轻时期欲念驱动的意味，同时不额外指定其具体性质。
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: 蒙蔽了我的心智
  rationale: 保留“使……失明”的隐喻；διάνοια涵盖理解力、思想与判断，译作“心智”比单纯“理解”更完整。
theological_decisions:
- issue: 对迦南人的负面陈述应理解为叙述者的判断还是普遍教义
  choice: 按第一人称叙述直译为“我也知道迦南人是邪恶的族类”
  alternative: 改写为“我以为迦南人是邪恶的族类”或加注限定
  rationale: 原文使用ᾔδειν“我知道”，不是“我以为”；译文保留文本自身的判断，不擅自将其强化为跨时代、普遍化的族群教义，也不削弱为主观猜测。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心智”准确涵盖διάνοια的思想、理解和判断层面；句式简洁，保留原文前后转折及道德张力。
