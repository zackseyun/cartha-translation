  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/002.yaml
  text: And when I saw her pouring wine, I was deceived, and I took her, my father not having taken counsel.
translation:
  language: zh_hans
  text: 我看见她斟酒，就受了迷惑；我娶了她，那时我父亲尚未商议。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰνοχοοῦσαν
  choice: 斟酒
  rationale: 该分词指倒酒、斟酒；“斟酒”简洁自然，并保留当时场景中的动作。
- source_word: ἠπατήθην
  choice: 受了迷惑
  rationale: 被动形式表达“被欺骗、受迷惑”；上下文未明确迷惑的施动者，译文不擅自补出。
- source_word: ἔλαβον αὐτήν
  choice: 我娶了她
  rationale: λαμβάνω加女性宾语在婚姻语境中可表示娶妻；译作“娶了她”比字面的“取了她”更符合现代汉语。
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: 没有征求我父亲的意见
  rationale: 属格独立结构直译近于“我父亲未曾参与商议”。结合主句婚姻决定，汉语用“没有征求我父亲的意见”自然表达父亲未被纳入商议，同时不增添“对此”等原文未明说的成分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。以分号连接受迷惑与娶妻两个紧密动作；不明确迷惑来自女子、酒或其他因素，以保留希腊文的开放性。
