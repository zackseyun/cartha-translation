lexical_decisions:
- source_word: Καίγε
  choice: 确实
  rationale: 表达加强肯定的语气；在现代汉语中比生硬的“并且诚然”更自然。
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  choice: 在自己的邪恶中
  rationale: 保留介词结构及“她自己的”归属含义，不擅自解释为具体罪行或报应方式。
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: 她的儿子们也和她一同死去
  rationale: μετά表示伴随；汉语补出承前省略的“死去”，使句意清楚，并以“儿子们”准确对应υἱῶν。
