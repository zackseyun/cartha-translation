lexical_decisions:
- source_word: Αὐτὴ δὲ
  choice: 可是，她
  rationale: 保留主语“她”和承接中带转折的语气；中文按自然语序将“她”置于时间状语之后。
- source_word: ἀπόντος ἐμοῦ
  choice: 我不在的时候
  rationale: 准确表达属格独立结构所指的伴随时间背景。
- source_word: ἐπορεύθη καὶ ἔλαβε
  choice: 去……娶了
  rationale: 将两个连续动作自然合译；在为男子安排婚姻的语境中，“娶”比直译“取”更符合现代汉语。
- source_word: τῷ Σηλὼμ
  choice: 给示拉
  rationale: 将与格理解为受益者，即她为示拉物色并娶妻；人名采用通行圣经译名“示拉”。
- source_word: γυναῖκα ἐκ τῆς Χαναάν
  choice: 一个迦南女子为妻
  rationale: γυναῖκα 在婚配语境中指妻子；ἐκ τῆς Χαναάν 表示来自迦南，译作“迦南女子”简洁自然。
