  terminology: “救主”“福音”“规条或律法”均可保留。“完满的人性”作为可能具有术语色彩的暂译可保留并注释。将“认为她配得”改为“使她配得”，以保留使成性语义；“爱她胜过我们”维持原有比较，不作关系性质的扩充。
