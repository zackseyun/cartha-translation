base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/005.yaml
  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  language: zh_hans
  text: '安得烈回应众弟兄姊妹说：“关于她所说的，你们尽可各抒己见；但我自己不相信救主说过这些话，因为这些教导听起来像是一些不同的观念。”[a]


    彼得也提出了同样的质疑。他问众人有关救主的事：“难道他曾背着我们私下同一个女人说话，而没有公开对我们说吗？难道我们现在反倒都要听她的吗？莫非他看重她胜过我们？”


    马利亚便哭了，对彼得说：“我的弟兄彼得，你在想什么？你真以为这是我自己心里编造出来的，或以为我在救主的事上撒谎吗？”


    利未回应彼得说：“彼得，你一向容易发怒。如今我看见你像那些敌对者一样同这个女人争辩。但救主若认为她配得，你又是谁，竟要弃绝她呢？救主必定十分了解她；正因如此，他爱她胜过爱我们。[b]


    “我们倒应当感到羞愧，穿上完满的人性，[c]照他吩咐我们的，使自己得着它，并且传扬福音；除了救主所说的以外，不要另立任何规条或律法。”


    当[利未说完这些话]，[d]他们便开始出去教导人、传扬福音。


    福音


    据


    马利亚'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本稿依据所提供的公共领域英语见证暂译；科普特文和希腊文原始语料的直接复核尚待进行。“不同的观念”也可能指这些教导听来陌生或有别于众人所知，但现有见证不足以进一步确定。
    reason: 披露间接翻译依据，并保留关键评语的语义不确定性。
  - marker: b
    text: “爱她胜过爱我们”保留了见证文本明确的比较说法；这里的“爱”具体指何种关系，文本本身没有说明。
    reason: 避免把争议性比较弱化或作教义化解释。
  - marker: c
    text: 英语见证将“Humanity”首字母大写，可能暗示专门概念；此处暂译“完满的人性”，不进一步解释。
    reason: 保留潜在术语性，同时说明源语言复核尚缺。
  - marker: d
    text: 方括号表示见证文本中的补足或复原文字。
    reason: 保存手稿复原信号。
lexical_decisions:
- source_word: brothers (and sisters)
  choice: 众弟兄姊妹
  rationale: 英语见证以括号表明群体可能兼含女性；中文正文自然地明说二者，同时不把它缩限为男性。
- source_word: Savior
  choice: 救主
  rationale: 采用简洁、通行且庄重的中文宗教用语。
- source_word: different ideas
  choice: 一些不同的观念
  rationale: 保留见证文本含混的批评语气，不擅自解释为异端、陌生教义或彼此矛盾的思想。
- source_word: made her worthy
  choice: 认为她配得
  rationale: 表达救主对她资格或配得地位的认可，避免增添拣选、洁净或任命等原文未明说的教义含义。
- source_word: reject her
  choice: 弃绝她
  rationale: 兼顾拒绝其人及否定其资格的语义力度。
- source_word: perfect Humanity
  choice: 完满的人性
  rationale: 保留这一抽象表达及其可能的专门含义；用脚注说明英译见证的大写形式，避免正文生硬大写。
- source_word: gospel
  choice: 福音
  rationale: 使用现代中文宗教文本中最通行的对应词。
- source_word: rule or law
  choice: 规条或律法
  rationale: 保留两个并列名词及其区别，不合并为单一概念。
- source_word: The Gospel According to Mary
  choice: 福音／据／马利亚
  rationale: 依照所供见证的分行式卷末题署呈现，不补成现代书名句式。
theological_decisions:
- issue: 彼得的问题是否断言救主绝不会私下对女性说话
  choice: 译作带反问语气的质疑：“难道他曾……吗？”
  alternative: 译作肯定断言：“他没有……。”
  rationale: 英语见证带附加问句，语气可视为期待否定回答的反问；中文保留其质疑和不确定张力。
- issue: “他爱她胜过我们”的比较含义
  choice: 直译并保留比较
  alternative: 弱化为“他格外爱她”或解释为“更器重她”
  rationale: 不把“爱”改释为职分、权威或浪漫感情，也不消除文本中具有争议性的比较。
- issue: “完满的人性”的性质
  choice: 保留抽象且可能具技术性的措辞
  alternative: 解释为“完美的人”“完全的人格”或特定灵性实体
  rationale: 来源语言复核尚待完成，现阶段不应把有歧义的观念固定为某种人论或救赎论。
- issue: 女性传述权威与群体权威的冲突
  choice: 按对话原样保留，不在译文中裁定任何一方的制度性权威
  alternative: 加入使徒职分、性别资格或教会治理方面的解释
  rationale: 文本呈现的是围绕救主言论、马利亚可信度和群体接受权的冲突；翻译不应导入宗派立场。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。人物对话保持直接和有张力；避免古奥经译腔，也避免过分口语化。鉴于科普特文／希腊文复核尚待完成，本稿明确作为暂定的最优对等译文，尤其谨慎处理“不同的观念”“配得”“完满的人性”及卷末题署。
