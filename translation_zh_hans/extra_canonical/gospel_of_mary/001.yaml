translation:
  language: zh_hans
  text: '《马利亚福音——永恒的视角》


    “那么，[物质]会被[毁灭]吗，还是不会？”[a]


    救主说：“每一种本性、每一种形态、每一个受造物，都在彼此之中、彼此相依而存在；但它们还会再次消解，归入各自的根源，因为物质的本性只会消解，归入它自身的本性。凡有耳可听的，就应当听！”


    彼得对他说：“既然你已经向我们解释了这一切，请再告诉我们一件事：世上的罪是什么？”


    救主说：“罪并不存在；但你们依照淫乱的本性行事时，正是你们造出了罪，而这就称为‘罪’。[b] 因此，善者来到你们中间，甚至进入各样本性之事物中，为要使它在自己的根源里复归。”[c]


    接着，他又说：“你们之所以患病、死亡，正是因为[你们爱那欺骗你们的。凡能]领悟的，就应当领悟！[d]


    “物质[生出]了一种没有形象的情欲，因为它出自违反自然之事。于是，整个身体中便产生了混乱。因此我曾告诉你们，要内心知足。你们若不知足，就要在自然的种种形象面前寻得知足。[e] 凡有耳可听的，就应当听！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号表示抄本残损处由编者补出的文字；本段所有方括号均同此例。
    reason: 让读者明确区分保存下来的文字与现代复原内容。
  - marker: b
    text: “罪并不存在”也可理解为罪并非一种独立存在的实体；但下文随即说，人依照“淫乱的本性”行事便造出罪。译文保留两者之间的张力。
    reason: 避免把文本独特的罪观静默改写为某一既定神学体系。
  - marker: c
    text: “甚至进入各样本性之事物中”以及末尾“它”的确切含义和所指并不明朗；也可能涉及“善者”临到各种本性的层次，使某一对象复归其根源。
    reason: 标示句法与指代歧义，避免中文译文产生原文没有的确定性。
  - marker: d
    text: “你们爱那欺骗你们的。凡能”位于残损处，是编者复原的文字。
    reason: 此复原直接影响患病与死亡的因果解释，需特别提示。
  - marker: e
    text: “在自然的种种形象面前寻得知足”语意较晦涩；也可能表达在面对自然多样的显现时保持内在安定。正文未据此释义改写。
    reason: 保存困难语句及其多义性，同时为现代读者指出一种可能的理解方向。
lexical_decisions:
- source_word: matter
  choice: 物质
  rationale: 保留本文宇宙论语境中的抽象实体含义，不改写为“肉体”或“世界”，以免预先限定解释。
- source_word: nature
  choice: 本性／自然
  rationale: 谈论某物内在性质时译作“本性”；在“违反自然”“自然的种种形象”等搭配中译作“自然”，兼顾中文习惯并保留原文概念张力。
- source_word: form
  choice: 形态
  rationale: 与后文“形象”有所区分，表达存在物的形式或样态。
- source_word: the Good
  choice: 善者
  rationale: 保留定冠词所暗示的实体化或位格化用法，同时不武断认定其特定神学身份。
- source_word: adultery
  choice: 淫乱
  rationale: 此处语义似比婚姻关系中的“奸淫”更宽，译作“淫乱”可保留道德及象征层面的开放性。
- source_word: passion
  choice: 情欲
  rationale: 表达一种受驱动的欲念或激情；不窄化为单纯性欲，但承认中文“情欲”可能带有欲望色彩。
- source_word: root(s)
  choice: 根源
  rationale: 比字面的“根”更自然，同时保留万物复归其来源的宇宙论意象。
- source_word: content at heart
  choice: 内心知足
  rationale: 自然、易懂，并保留内在安定或满足的含义。
theological_decisions:
- issue: “罪并不存在”与“你们造出了罪”之间的张力
  choice: 直译两项陈述，不加调和性解释
  alternative: 译成“罪不是独立存在的”或“本来没有罪”
  rationale: 见证文本故意并置罪的非实体性与人的行为所造成的罪；增补“独立”或“本来”会替作者解决其神学张力。
- issue: “善者”的身份
  choice: 保留为“善者”
  alternative: 明确译作“上帝”“基督”或“至善”
  rationale: 现有见证并未在本段明说其身份，不应导入宗派性或体系化认定。
- issue: 复归句中代词“it”的所指
  choice: 保留单数代词“它”
  alternative: 明确为“每一种本性”“万物”或“人”
  rationale: 英语见证中的指代不清；在直接科普特语／希腊语复核前，应保存歧义。
- issue: “淫乱的本性”是否仅指性行为
  choice: 保留原有表达，不加象征性释义
  alternative: 改写为“背离本性的行为”或解释为灵魂不忠
  rationale: 上下文可能容许伦理、宇宙论或象征性理解，译文不应排除其中任何一种。
- issue: 物质与情欲的关系
  choice: 照译为物质“生出”情欲
  alternative: 弱化为“物质引起欲望”
  rationale: 出生意象可能具有宇宙论意义，宜予保留；方括号同时表明该动词属残损处复原。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话；保留救主训言的警策节奏，并以“凡有耳可听的，就应当听”呈现重复句式。由于所供材料注明科普特语／希腊语直接复核尚未完成，本稿以公开领域英语见证为暂定依据，不宣称已完成原文校勘。
