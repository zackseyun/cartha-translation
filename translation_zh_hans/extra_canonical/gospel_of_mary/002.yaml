base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/002.yaml
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
translation:
  language: zh_hans
  text: '蒙福者[a]说完这些话，就向众人问安，说：“愿你们平安！要得着我的平安。你们要谨慎，不要让任何人迷惑你们，说：‘看，这里！’或‘看，那里！’因为人子[b]就在你们里面[c]。你们要跟随他！寻找他的人必会找到他。


    “所以，你们要去宣讲天国的福音。除了我所交给你们的，不要再制定任何规条；也不要像立法者那样设立律法，免得受它束缚。”他说完这些话，就离开了。


    可是，他们悲痛不已，放声痛哭，说：“我们怎么能到外邦人那里去，宣讲人子之国的福音呢？他们若连他也不放过，又怎么会放过我们呢？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙福者”是一个称号；也可译作“有福者”。现有底稿尚待依据科普特文和希腊文残片直接复核。
    reason: 说明称号的可译范围及当前文本基础的限制。
  - marker: b
    text: “人子”所对应的表达可按字面理解为“人类之子”或“人的儿子”；此处保留传统简洁译法。
    reason: 提示该称谓的字面语义，避免读者误以为译文已排除其他表达方式。
  - marker: c
    text: 此处依所提供英文见证译作“在你们里面”；是否也可能带有“在你们中间”的意味，仍需直接复核现存科普特文和希腊文证据。
    reason: 保留位置表达的潜在歧义，并明确校勘状态。
lexical_decisions:
- source_word: the Blessed One
  choice: 蒙福者
  rationale: 保留称号性质及“受福、蒙福”的语义，不直接改成“主”或“救主”，以免引入见证文本未明说的称谓。
- source_word: Acquire my peace
  choice: 要得着我的平安
  rationale: 保留“取得、得着”这一不同于普通祝愿语的主动意味，同时采用自然的现代汉语表达。
- source_word: Son of Humanity
  choice: 人子
  rationale: 采用现代汉语宗教文献中通行且简洁的对应语，并以脚注说明其字面语义范围。
- source_word: exists within you
  choice: 就在你们里面
  rationale: 依照所提供英文见证的空间性表述直译，不把它解释为纯粹心理状态、群体临在或制度性观念。
- source_word: Gentiles
  choice: 外邦人
  rationale: 采用现代汉语圣经语域中普遍可懂的传统对应词，指本群体以外的诸民族。
- source_word: lawgiver
  choice: 立法者
  rationale: 保留一般性称谓，不擅自认定其具体指向某一历史人物。
theological_decisions:
- issue: “人子在你们里面”的含义
  choice: 保留“在你们里面”的表述，不作阐释性改写
  alternative: 译作“在你们中间”或解释为人的内在真我
  rationale: 现有 drafting basis 仅为英文见证，且科普特文、希腊文直接复核尚待进行；不应提前消除可能涉及内在性与群体临在的张力。
- issue: “我所交给你们的”所指为何
  choice: 维持泛指，不补出“命令”“律法”或具体教训
  alternative: 译作“我给你们的规条”或“我颁布的律法”
  rationale: 避免将前后语义强行系统化，并保留原句中“所给之物”与后来规条、律法之间的张力。
- issue: “立法者”的身份
  choice: 不指名
  alternative: 明确译作“摩西”
  rationale: 所提供见证文本没有点名；直接认定会加入超出证据的神学或历史解释。
- issue: “天国”与“人子之国”的关系
  choice: 分别照原有措辞译出
  alternative: 两处统一为“神的国”或“人子的国”
  rationale: 保留段落中先称“国度”、后称“人子之国”的措辞变化，不擅自调和。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保留“平安、福音、天国、外邦人、人子”等普通读者较熟悉的宗教语汇。句式尽量口语可读而不随意；“不要再制定任何规条”“免得受它束缚”力求兼顾命令语气与自然表达。本稿为依据所提供公共领域英文见证制作的暂定译稿，科普特文与希腊文原始证据仍待直接复核。
