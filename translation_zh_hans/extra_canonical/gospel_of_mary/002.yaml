  naturalness: 译文庄重而通顺，适合现代标准汉语宗教文本。“蒙福者”“平安”“福音”“外邦人”等用语协调；引语、指代和段落组织清楚。
  terminology: “人子”作为简洁的传统对应语可保留，并由脚注交代其字面范围；“立法者”不具体化，处理妥当。“天国”应改为“国度”，以免将泛称的 kingdom 解释为“天的国”。第二处“kingdom of the Son of Humanity”相应宜作“人子的国度”，保持术语一致。
