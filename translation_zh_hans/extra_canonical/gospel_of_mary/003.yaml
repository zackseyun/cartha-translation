translation:
  language: zh_hans
  text: '随后，马利亚站起来，向众人问安。她对弟兄姊妹说：“不要哭泣忧愁，也不要心里纷乱，因为他的恩典必与你们众人同在，并要保护你们。我们倒应当颂赞他的伟大，因为他预备了我们，使我们成为人。[a]”


    马利亚说了这些话，就使他们的心转向“善”，于是他们[开始]讨论[救主]的话。[b]


    彼得对马利亚说：“姊妹，我们知道，救主爱你胜过爱其他所有妇女。请把你所记得的救主的话告诉我们，就是你知道、我们却不知道，也未曾听过的那些话。”


    马利亚回答说：“我要把向你们隐藏的事告诉你们。”于是她开始向他们讲述这些话。她说：“我在异象中看见了主，就对他说：‘主啊，我今天在异象中看见了你。’


    “他回答我说：‘你是有福的，因为你看见我时没有动摇。心智在哪里，宝藏就在哪里。’


    “我对他说：‘主啊，那么，看见异象的人，是在灵魂里看见，还是在灵里看见呢？’


    “救主回答说：‘他既不是在灵魂里看见，也不是在灵里看见；看见异象的，乃是存在于二者之间的心智，[而]它[……]’”[c]


    手抄本第11至14页缺失。'
