lexical_decisions:
- source_word: brothers (and sisters)
  choice: 弟兄姊妹
  rationale: 按群体称呼作包容性表达；既保持亲属式共同体语感，也避免现代汉语中“兄弟”可能仅指男性的歧义。
- source_word: the Good
  choice: “善”
  rationale: 保留带定冠词且可能具有概念性或位格化意味的表达；加引号提示这里不只是普通形容词。
- source_word: Humans
  choice: 人
  rationale: 避免擅自加入“真正的”“属灵的”等解释；脚注说明英文见证以大写提示该词可能承载特殊的人论意味。
- source_word: mind
  choice: 心智
  rationale: 与“灵魂”和“灵”明确区分，并保留其作为认知、感知异象之中介的独立概念地位；不用容易与“心”或“思想”混同的译法。
- source_word: soul / spirit
  choice: 灵魂／灵
  rationale: 保留原段落对两个概念的并列区分，不将二者合并，也不预先判定其具体人论关系。
- source_word: vision
  choice: 异象
  rationale: 采用现代宗教语境中清楚而庄重的常用词，既表达超常所见，也不武断判定其为梦境或肉眼所见。
- source_word: didn’t waver
  choice: 没有动摇
  rationale: 保留可指内心疑惑、惊惧或不坚定的语义宽度，不具体化为“没有怀疑”或“没有害怕”。
theological_decisions:
- issue: “使我们成为人”是否应作灵性或圆满人性的解释
  choice: 正文直译为“使我们成为人”
  alternative: 使我们成为真正的人／完美的人／属灵的人
  rationale: 现有见证只提供 Humans，且直接科普特语和希腊语复核尚待进行；不把可能的人论术语提前解释成某一宗派或学派的教义。
- issue: “善”是否位格化
  choice: 译作带引号的“善”
  alternative: 善者／上帝／美善之境
  rationale: 原见证的定冠词和大写提示概念上的突出地位，但不足以确定它专指神、某位格或一个境界。
- issue: 异象由灵魂、灵还是心智看见
  choice: 保留三者的区分以及心智“在二者之间”的表述
  alternative: 解释为心理机能、属灵知觉或灵魂的一部分
  rationale: 该段本身呈现特殊而未充分展开的人论结构，且紧接着发生缺页；译文不补足其体系或化解其张力。
- issue: “救主爱你胜过爱其他所有妇女”的性质
  choice: 保留比较性的“爱”
  alternative: 最宠爱你／最器重你／以浪漫之爱爱你
  rationale: 不把文本未说明的情感、权威或关系性质强加给句子。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“救主、恩典、异象、灵魂、灵、心智”等词保持宗教与哲学语境中的清晰区分。因提供材料明确说明直接源语复核尚待进行，本稿属于依据公共领域英文见证制作的审慎暂定稿；方括号、残句和缺页信息均予保留。
