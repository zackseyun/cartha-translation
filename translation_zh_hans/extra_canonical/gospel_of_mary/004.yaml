lexical_decisions:
- source_word: Desire
  choice: 欲望
  rationale: 保留其作为人格化权势名称和普通欲求概念的双重意味。
- source_word: soul
  choice: 灵魂
  rationale: 采用现代汉语中最直接、通行的对应词，不预先界定其具体人论含义。
- source_word: power
  choice: 权势
  rationale: 这里所指是具有位格化表现、能够盘问和阻拦灵魂的力量；“权势”比“能力”更能体现其支配意味。
- source_word: Ignorance
  choice: 无知
  rationale: 作为专名直译，同时保留认识论与属灵处境之间的张力。
- source_word: Zeal for Death
  choice: 向死的热忱
  rationale: 保留“zeal”的强烈投入意味及其与“death”的关系，不擅自改成“求死欲”等解释性表述。
- source_word: Kingdom of the Flesh
  choice: 肉体的国度
  rationale: 形式上保留属格结构，避免将“flesh”缩窄为单纯身体或特定伦理教义。
- source_word: Wrath
  choice: 震怒
  rationale: 与前文作为第七形态的“愤怒”略作区分，同时保留其作为总称或专名的庄重感。
- source_word: space
  choice: 空间
  rationale: 直译见证文本的空间性用语，不将其解释为“世界”“宇宙”或某一层天界。
- source_word: type
  choice: 形态
  rationale: 原见证的语义不够确定；“形态”可保留模型、形式或样式等可能性，避免过度具体化。
- source_word: age
  choice: 世代
  rationale: 保留其时间—时代含义，不直接神学化为“永世”或“永恒”。
- source_word: Savior
  choice: 救主
  rationale: 采用自然而庄重的传统称谓，不额外确定其身份或头衔体系。
theological_decisions:
- issue: 灵魂被称为“杀人者”
  choice: 保留对灵魂的直接称呼“杀人者”
  alternative: 解释为灵魂杀死了束缚它的权势
  rationale: 文本本身留下指控与后文“捆绑我的已经被杀”之间的张力，译文不代为调和。
- issue: “一切都必消解”所涉及的宇宙论
  choice: 按原见证保留地上与天上之物都将消解的陈述
  alternative: 改译为败坏、消亡或得更新
  rationale: 避免把“dissolve”纳入某一末世论框架，也不弱化其广泛范围。
- issue: “肉体”相关权势
  choice: 保留“肉体的国度”和“肉体愚妄的‘智慧’”
  alternative: 解释为罪性、身体欲望或世俗思想
  rationale: 不把含混的“flesh”预先等同于某一宗派的人论或罪论概念。
- issue: “上面的形态”及释放过程
  choice: 维持晦涩的层级与释放语言
  alternative: 解释为灵魂脱离属天原型、身体形态或宇宙层级
  rationale: 来源见证本身难解，且古语审校尚待完成，应保留真实歧义。
- issue: 末句的时间与安息意象
  choice: 译为“在静默中领受那世代之时节所余下的时间”
  alternative: 释义为进入永恒安息
  rationale: 不将“rest”误读为名词“安息”，也不把复杂时间表达简化成确定的永恒论断。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话书面语。权势名称以专名方式处理；引号中的“智慧”保留反讽或质疑色彩。方括号仅用于正文中的手稿补足词，并以脚注标明。由于目前仅有公共领域英文见证，且科普特文／希腊文直接审校尚待进行，本稿对晦涩句法采取审慎直译，不强行顺释。
