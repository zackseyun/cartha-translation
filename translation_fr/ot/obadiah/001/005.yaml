source:
  edition: WLC
  text: אִם גַּנָּבִ֤ים בָּאֽוּ לְ/ךָ֙ אִם שׁ֣וֹדְדֵי לַ֔יְלָה אֵ֣יךְ נִדְמֵ֔יתָה הֲ/ל֥וֹא יִגְנְב֖וּ דַּיָּ֑/ם אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ הֲ/ל֖וֹא יַשְׁאִ֥ירוּ עֹלֵלֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/005.yaml
  text: If thieves came to you[a], if robbers by night—how you have been destroyed!—would they not steal only enough for themselves? If grape gatherers came to you[b], would they not leave gleanings?
translation:
  language: fr
  text: 'Si des voleurs venaient chez toi,

    si des pillards venaient de nuit

    — comme te voilà anéanti ![a] —,

    ne voleraient-ils pas seulement ce qui leur suffirait ?[b]


    Si des vendangeurs venaient chez toi,

    ne laisseraient-ils pas des grappes après la vendange ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme te voilà retranché ! » ou « comme te voilà ruiné ! ». Le verbe hébreu peut prendre plusieurs sens proches dans ce contexte de dévastation.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne voleraient-ils pas ce qui leur suffit ? », c’est-à-dire seulement autant qu’il leur en faut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּנָּבִים
  choice: voleurs
  rationale: Équivalent français courant et direct pour ceux qui dérobent.
- source_word: שֹׁדְדֵי לַיְלָה
  choice: pillards venaient de nuit
  rationale: « Pillards » exprime le pillage violent associé à שׁדד, tandis que « de nuit » conserve l’indication temporelle. La répétition de « venaient » rend la construction hypothétique naturelle en français.
- source_word: אֵיךְ נִדְמֵיתָה
  choice: comme te voilà anéanti !
  rationale: L’exclamation rend la brusque lamentation introduite par אֵיךְ. « Anéanti » convient au contexte de dévastation tout en laissant en note les nuances lexicales proches.
- source_word: הֲלוֹא יִגְנְבוּ דַּיָּם
  choice: ne voleraient-ils pas seulement ce qui leur suffirait ?
  rationale: דַּיָּם désigne ce qui leur suffit. « Seulement » explicite le contraste implicite entre un vol limité et la dévastation totale annoncée.
- source_word: בֹּצְרִים
  choice: vendangeurs
  rationale: Terme français précis et naturel pour ceux qui récoltent les raisins.
- source_word: יַשְׁאִירוּ עֹלֵלוֹת
  choice: ne laisseraient-ils pas quelques grappes à grappiller ?
  rationale: Cette formulation conserve l’image viticole des raisins laissés après la vendange et reste immédiatement compréhensible.
- source_word: לְךָ / לָךְ
  choice: chez toi
  rationale: Avec le verbe « venir », « chez toi » est idiomatique et conserve l’idée d’une arrivée au lieu de l’interlocuteur sans ajouter explicitement « contre toi ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La disposition en lignes fait ressortir le parallélisme et l’incise de lamentation. Le conditionnel français rend l’hypothèse formulée en hébreu par « si » suivi de formes accomplies.
