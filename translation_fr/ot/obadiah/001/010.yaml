id: OBA.1.10
reference: Obadiah 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֵ/חֲמַ֛ס אָחִ֥י/ךָ יַעֲקֹ֖ב תְּכַסְּ/ךָ֣ בוּשָׁ֑ה וְ/נִכְרַ֖תָּ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/010.yaml
  text: Because of the violence done to your brother Jacob[a], shame will cover you, and you will be cut off forever.
translation:
  language: fr
  text: À cause de la violence faite à ton frère Jacob[a], la honte te couvrira, et tu seras retranché pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de la violence contre ton frère Jacob. »'
    reason: Variante de formulation reflétant plus directement la construction hébraïque, sans expliciter « faite à ».
lexical_decisions:
- source_word: מֵחֲמַס
  choice: À cause de la violence faite à
  rationale: Le nom חָמָס désigne ici la violence ou l’injustice violente, et la préposition מִן a une valeur causale. La formulation française indique naturellement que Jacob en est la victime.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le sens premier est « frère ». Cette traduction conserve la parenté entre Édom et Jacob ainsi que la gravité morale de l’accusation.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le texte hébreu emploie le nom Jacob, qui représente ici le peuple issu de lui. Le conserver maintient la formulation familiale du texte prophétique.
- source_word: תְּכַסְּךָ
  choice: te couvrira
  rationale: Le verbe כסה signifie « couvrir ». Avec « honte » pour sujet, l’expression décrit la honte qui enveloppe la personne visée.
- source_word: בּוּשָׁה
  choice: la honte
  rationale: בּוּשָׁה désigne la honte ou l’opprobre, avec une dimension morale et publique. « La honte » est direct et naturel en français.
- source_word: וְנִכְרַתָּ
  choice: et tu seras retranché
  rationale: Le niphal de כרת signifie « être retranché ». Ce choix conserve l’image hébraïque sans réduire d’emblée son sens à la seule destruction physique.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: עוֹלָם exprime ici une durée sans fin ou durable dans le contexte du jugement. « Pour toujours » est idiomatique et fidèle.
theological_decisions:
- issue: Référent de « Jacob » et portée du langage fraternel
  choice: Conserver « ton frère Jacob », Jacob représentant le peuple qui descend de lui.
  alternative: Remplacer « Jacob » par « Israël » pour expliciter immédiatement le référent national.
  rationale: L’hébreu nomme explicitement « ton frère Jacob ». Cette formulation souligne la faute d’Édom contre un peuple frère et doit être préservée sans substituer une interprétation au nom du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier correspond à l’adresse prophétique à Édom. « Retranché » conserve l’image biblique tout en restant intelligible; la note maintient l’alternative syntaxique du début du verset.
