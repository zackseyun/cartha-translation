source:
  edition: WLC
  text: כִּֽי קָר֥וֹב יוֹם יְהוָ֖ה עַל כָּל הַ/גּוֹיִ֑ם כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ יֵעָ֣שֶׂה לָּ֔/ךְ גְּמֻלְ/ךָ֖ יָשׁ֥וּב בְּ/רֹאשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/015.yaml
  text: For the day of Yahweh is near upon all the nations[a]. As you have done, it will be done to you[b]; your recompense will return on your own head.
translation:
  language: fr
  text: Car le jour de Yahweh est proche sur toutes les nations[a]. Comme tu as fait, on te fera[b] ; ta rétribution retombera sur ta tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre toutes les nations ». La préposition hébraïque peut indiquer un jugement dirigé contre elles.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il te sera fait ». Le passif hébreu ne nomme pas explicitement celui qui agit.'
    reason: translation_clarity
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’explication de l’avertissement précédent, avec une tournure française naturelle.
- source_word: קָרוֹב
  choice: est proche
  rationale: Rend directement l’adjectif prédicatif qui exprime l’imminence.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: Conserve l’expression prophétique reconnue et rend le tétragramme comme nom propre.
- source_word: עַל כָּל הַגּוֹיִם
  choice: pour toutes les nations
  rationale: « Pour » reste naturel en français tout en laissant la note signaler la valeur hostile possible de la préposition עַל.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: Ce que tu as fait
  rationale: Expression française idiomatique qui conserve le rapport de correspondance entre l’acte et sa conséquence.
- source_word: יֵעָשֶׂה לָּךְ
  choice: on te le fera
  rationale: Le pronom indéfini français rend naturellement le passif hébreu sans identifier explicitement l’agent.
- source_word: גְּמֻלְךָ
  choice: ce que tu as infligé
  rationale: Dans ce contexte de jugement, le terme désigne le traitement qui revient à son auteur; cette formulation évite le mot peu courant « rétribution » tout en conservant la relation entre conduite et retour.
- source_word: יָשׁוּב בְּרֹאשֶׁךָ
  choice: retombera sur ta tête
  rationale: Rend le mouvement de retour et conserve l’image idiomatique des conséquences revenant sur le responsable.
theological_decisions:
- issue: Portée et force du « jour de Yahweh »
  choice: Annonce prophétique d’un jugement imminent qui concerne toutes les nations, tout en s’adressant directement à Édom.
  alternative: Un jugement limité à Édom dans le contexte immédiat.
  rationale: La mention de « toutes les nations » élargit explicitement la portée, tandis que la deuxième personne du singulier maintient l’adresse à Édom.
- issue: Formule de justice rétributive
  choice: Les actes d’Édom lui seront rendus en retour dans le cadre du jour de Yahweh.
  alternative: Un simple principe impersonnel selon lequel chacun subit les conséquences de ses actes.
  rationale: Le contexte prophétique rattache ce retour au jugement divin, sans qu’il soit nécessaire d’ajouter explicitement Dieu comme agent dans la traduction.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme de la justice rétributive est maintenu, ainsi que l’image finale de ce qui retombe sur la tête du coupable.
