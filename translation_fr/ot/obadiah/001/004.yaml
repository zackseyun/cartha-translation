reference: Obadiah 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם תַּגְבִּ֣יהַּ כַּ/נֶּ֔שֶׁר וְ/אִם בֵּ֥ין כּֽוֹכָבִ֖ים שִׂ֣ים קִנֶּ֑/ךָ מִ/שָּׁ֥ם אוֹרִֽידְ/ךָ֖ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/004.yaml
  text: Though you soar high like the eagle[a], and though you set your nest among the stars, from there I will bring you down, declares Yahweh.
translation:
  language: fr
  text: Même si tu t’élèves comme l’aigle[a], et même si tu places ton nid parmi les étoiles, de là je te ferai descendre, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu t’élèves comme un aigle… et si tu places ton nid parmi les étoiles. » La particule hébraïque peut introduire une condition, mais elle a probablement ici une valeur concessive : même depuis la plus grande hauteur imaginable, Yahweh fera descendre Édom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: Même si ... et même si
  rationale: 'Dans cette parole prophétique, les deux particules conditionnelles ont vraisemblablement une valeur concessive : quelle que soit la hauteur atteinte par Édom, Yahweh le fera descendre. La note conserve néanmoins la possibilité d’une formulation strictement conditionnelle.'
- source_word: תַּגְבִּיהַּ
  choice: tu t’élèves
  rationale: Le hiphil de גבה exprime ici l’élévation. La tournure pronominale est naturelle en français et garde à la fois l’image spatiale et la nuance d’orgueil du contexte.
- source_word: כַּנֶּשֶׁר
  choice: comme l’aigle
  rationale: Le préfixe כ marque la comparaison et l’article hébreu accompagne נשר. « Comme l’aigle » rend naturellement cette image générique en français.
- source_word: בֵּין כּוֹכָבִים
  choice: parmi les étoiles
  rationale: Avec un pluriel collectif, בֵּין désigne ici une position au milieu des étoiles. « Parmi » est plus idiomatique que « entre ».
- source_word: שִׂים קִנֶּךָ
  choice: tu places ton nid
  rationale: La traduction garde le verbe courant שׂים, « placer », ainsi que la métaphore du nid, qui prolonge l’image de l’aigle et évoque une demeure réputée inaccessible.
- source_word: מִשָּׁם
  choice: de là
  rationale: La formulation brève et littérale souligne que même le refuge imaginé au plus haut des cieux n’échappe pas à l’action divine.
- source_word: אוֹרִידְךָ
  choice: je te ferai descendre
  rationale: 'Le hiphil de ירד est causatif : Yahweh fera descendre Édom. Cette formulation française conserve cette valeur sans ajouter la violence que pourrait suggérer « je te précipiterai ».'
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique solennelle est rendue dans un français actuel et direct, tandis que le nom divin est transcrit.
theological_decisions:
- issue: Valeur des particules אִם dans la menace prophétique
  choice: 'Lecture concessive : « Même si »'
  alternative: 'Lecture conditionnelle : « Si »'
  rationale: La proposition principale affirme que Dieu fera descendre Édom jusque depuis son refuge le plus élevé, ce qui donne aux conditions une force concessive. La note signale la valeur conditionnelle formelle afin de ne pas effacer l’ambiguïté de l’hébreu.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » distingue le nom divin d’un titre et suit la convention éditoriale fournie.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme hébreu est conservé par la répétition de « même si », et la métaphore spatiale reste intacte. La ponctuation privilégie une lecture fluide sans expliciter davantage l’identité du « tu », fournie par le contexte.
