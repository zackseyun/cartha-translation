  text: הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖י/ךָ בַּ/גּוֹיִ֑ם בָּז֥וּי אַתָּ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/002.yaml
  text: Look[a], I have made you small among the nations[b]; you are greatly despised.
translation:
  language: fr
  text: Voici, je t’ai rendu petit[a] parmi les nations[b] ; tu es profondément méprisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « insignifiant ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « je t’ai donné petit parmi les nations », tournure qui signifie ici « je t’ai rendu petit parmi les nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec force l’entrée dans la déclaration et attire l’attention, dans un registre français actuel et digne.
- source_word: קָטֹן
  choice: petit
  rationale: Conserve l’image directe de petitesse et de rang inférieur, sans expliciter excessivement par « insignifiant ».
- source_word: נְתַתִּיךָ
  choice: je t’ai rendu
  rationale: 'Le verbe signifie littéralement « donner », mais, suivi de l’adjectif attribut « petit », il prend ici un sens résultatif : faire devenir ou rendre petit.'
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Désigne ici les peuples ou nations en général, sans la connotation plus tardive que pourrait porter « païens ».
- source_word: בָּזוּי
  choice: méprisé
  rationale: Rend directement le participe passif exprimant le fait d’être tenu en mépris.
- source_word: מְאֹד
  choice: profondément
  rationale: Exprime naturellement en français le haut degré du mépris indiqué par l’adverbe hébreu.
theological_decisions:
- issue: Aspect de l’accompli dans une déclaration prophétique de jugement
  choice: je t’ai rendu
  alternative: je te rendrai ; je te rends
  rationale: L’accompli hébreu présente l’action divine comme établie, avec un résultat actuel. Le passé composé français préserve cette force accomplie sans transformer explicitement la déclaration en prédiction future.
translation_notes:
  register: Français international moderne, sobre et prophétique. « Voici » conserve la force rhétorique de l’ouverture ; « rendu petit » maintient l’image hébraïque tout en restant compréhensible.
