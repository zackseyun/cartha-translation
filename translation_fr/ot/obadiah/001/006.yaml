  text: אֵ֚יךְ נֶחְפְּשׂ֣וּ עֵשָׂ֔ו נִבְע֖וּ מַצְפֻּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/006.yaml
  text: How Esau has been searched out! His hidden treasures have been sought out![a][b]
translation:
  language: fr
  text: Comme Ésaü a été fouillé ! Comme ses trésors cachés ont été découverts ![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, Ésaü désigne collectivement les descendants d’Ésaü, c’est-à-dire le peuple d’Édom, ou leur territoire.
    reason: cross_reference
  - marker: b
    text: 'Autre traduction possible : « Comme Ésaü a été mis à sac ! Comme ses réserves secrètes ont été mises au jour ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comme
  rationale: Introduit ici une exclamation de stupeur plutôt qu’une question. La tournure « Comme… ! » est naturelle en français soutenu et conserve la force prophétique.
- source_word: נֶחְפְּשׂוּ
  choice: a été fouillé
  rationale: Le nifal accompli exprime une fouille approfondie subie par Ésaü. Le singulier s’accorde avec le nom collectif « Ésaü » et le passif préserve la forme hébraïque.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Le texte hébreu emploie le nom d’Ésaü, utilisé collectivement pour ses descendants ou pour Édom. Le conserver évite de remplacer la formulation source par son interprétation.
- source_word: נִבְעוּ
  choice: ont été découverts
  rationale: Dans ce contexte, le verbe évoque des biens cachés retrouvés ou mis au jour. « Découverts » distingue ce second membre de la fouille exprimée par le premier verbe tout en maintenant le parallélisme.
- source_word: מַצְפֻּנָיו
  choice: ses trésors cachés
  rationale: Le terme désigne des choses dissimulées ou mises en réserve ; dans le contexte du pillage, il s’agit vraisemblablement de biens précieux cachés.
theological_decisions:
- issue: Référent collectif d’Ésaü
  choice: Conserver « Ésaü » dans le texte et expliquer son emploi collectif en note
  alternative: Traduire directement par « Édom »
  rationale: Cette solution respecte le nom présent dans l’hébreu tout en rendant explicite pour le lecteur son référent national dans ce passage.
translation_notes:
  register: Français international moderne, digne et accessible. La double exclamation reproduit le parallélisme et la stupeur du texte hébreu ; « fouillé » reste concret sans imposer à lui seul l’idée plus interprétative de mise à sac.
