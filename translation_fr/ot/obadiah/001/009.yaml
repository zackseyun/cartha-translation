source:
  edition: WLC
  text: וְ/חַתּ֥וּ גִבּוֹרֶ֖י/ךָ תֵּימָ֑ן לְמַ֧עַן יִכָּֽרֶת אִ֛ישׁ מֵ/הַ֥ר עֵשָׂ֖ו מִ/קָּֽטֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/009.yaml
  text: And your mighty men[a], Teman, will be shattered[c][b], so that every man from the mountain of Esau may be cut off by slaughter.
translation:
  language: fr
  text: Tes guerriers, Témân[b], seront terrifiés[a], afin que tout homme soit retranché de la montagne d’Ésaü par le massacre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront consternés » ou « seront brisés ». Le verbe hébreu peut évoquer à la fois la terreur et l’effondrement.
    reason: lexical_alternative
  - marker: b
    text: Témân était une ville ou une région d’Édom ; son nom est apparenté au mot hébreu signifiant « sud ».
    reason: cultural_note
  - marker: c
    text: 'On peut aussi comprendre : « afin que tous ceux de la montagne d’Ésaü soient retranchés par le massacre ». Le rapport précis de l’expression finale avec le reste de la proposition demeure ambigu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחַתּוּ
  choice: seront terrifiés
  rationale: Le niphal de חתת exprime ici l’effroi qui abat et désorganise les combattants. « Seront terrifiés » rend naturellement la valeur passive et militaire, tout en laissant en note les nuances de consternation et d’effondrement.
- source_word: גִבּוֹרֶיךָ
  choice: tes guerriers
  rationale: Dans cet oracle contre Édom, גִּבּוֹר désigne les hommes forts en tant que combattants. « Guerriers » est précis et idiomatique en français moderne.
- source_word: תֵּימָן
  choice: Témân
  rationale: Le terme est compris comme le nom propre d’une ville ou région d’Édom, en apposition au destinataire implicite, et non comme le nom commun « sud ».
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution conserve clairement la relation de but introduite par לְמַעַן et suivie de l’imparfait.
- source_word: יִכָּרֶת
  choice: soit retranché
  rationale: Le niphal de כרת signifie « être retranché ». Le subjonctif français après « afin que » reproduit naturellement la dépendance syntaxique de la proposition de but.
- source_word: אִישׁ
  choice: tout homme
  rationale: Le singulier masculin a ici une valeur distributive. « Tout homme » préserve cette forme et convient au contexte de l’anéantissement des combattants d’Édom.
- source_word: מֵהַר עֵשָׂו
  choice: de la montagne d’Ésaü
  rationale: Cette formulation garde le nom commun singulier הַר et sa valeur territoriale, sans transformer explicitement l’expression en nom propre « mont Ésaü ».
- source_word: מִקָּטֶל
  choice: dans le carnage
  rationale: La préposition מִן peut ici exprimer la circonstance ou le cadre dans lequel survient le retranchement. « Dans le carnage » est naturel en français et évite le tour peu idiomatique « par massacre ».
theological_decisions:
- issue: Valeur de אִישׁ dans un jugement collectif
  choice: tout homme
  alternative: tous / chacun
  rationale: Le masculin singulier distributif contribue à la représentation de la disparition des hommes d’Édom, vraisemblablement dans un contexte militaire; il n’est donc pas neutralisé.
- issue: Fonction de לְמַעַן suivi de l’imparfait
  choice: afin que… soit retranché
  alternative: si bien que… sera retranché
  rationale: La construction marque d’abord le but, même si une nuance de résultat peut être ressentie dans l’oracle. Le français au subjonctif maintient cette tension sans convertir la proposition en simple prédiction indicative.
- issue: Identification de תֵּימָן
  choice: Témân
  alternative: le sud
  rationale: Dans le contexte d’Édom, Témân est le lieu personnifié auquel se rapporte « tes guerriers ». La traduction retient donc le nom propre traditionnel.
translation_notes:
  register: Français international moderne, sobre et solennel. « Témân » est conservé sans interjection vocative absente de l’hébreu. La syntaxe « afin que… soit » reproduit le lien de but tout en restant naturelle.
