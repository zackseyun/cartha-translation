    text: Ou « aucun reste ». Le mot hébreu peut désigner ce qui subsiste ou une personne qui survit.
    reason: lexical_alternative
  revision_rationale: 'La révision limite le changement à la reprise pronominale : le pluriel de « les » correspond aux suffixes pluriels hébreux et laisse entendre la maison d’Ésaü comme collectivité. « Embraser » maintient l’image du feu et rend plus naturellement en français l’action hostile exprimée par le verbe dans ce contexte.'
