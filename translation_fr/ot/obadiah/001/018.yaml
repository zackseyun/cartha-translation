id: OBA.1.18
reference: Obadiah 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּ/בֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּ/בֵ֤ית עֵשָׂו֙ לְ/קַ֔שׁ וְ/דָלְק֥וּ בָ/הֶ֖ם וַ/אֲכָל֑וּ/ם וְ/לֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְ/בֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/018.yaml
  text: The house of Jacob will be a fire[a], and the house of Joseph a flame, and the house of Esau stubble. They will burn them and consume them, and there will be no survivor for the house of Esau[b], for Yahweh has spoken.
translation:
  language: fr
  text: La maison de Jacob sera un feu, et la maison de Joseph une flamme ; la maison d’Ésaü sera du chaume. Ils les embraseront et les consumeront. Il ne restera aucun survivant de la maison d’Ésaü[a], car Yahweh a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun reste ». Le mot hébreu peut désigner ce qui subsiste ou une personne qui survit.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית יַעֲקֹב
  choice: la maison de Jacob
  rationale: Conserve l’expression prophétique et son sens collectif, familial et national, sans la réduire à un foyer domestique.
- source_word: אֵשׁ
  choice: un feu
  rationale: Préserve la métaphore prédicative de la puissance destructrice.
- source_word: בֵית יוֹסֵף
  choice: la maison de Joseph
  rationale: Maintient le parallélisme avec « la maison de Jacob » et la référence collective aux groupes israélites associés à Joseph.
- source_word: לֶהָבָה
  choice: une flamme
  rationale: Correspond naturellement à « un feu » et conserve l’intensification poétique.
- source_word: בֵית עֵשָׂו
  choice: la maison d’Ésaü
  rationale: Préserve la formule prophétique répétée et la référence collective à Édom, issu d’Ésaü.
- source_word: לְקַשׁ
  choice: du chaume
  rationale: Désigne naturellement en français les tiges sèches laissées après la moisson, facilement inflammables ; ce terme convient mieux ici que « balle ».
- source_word: וְדָלְקוּ בָהֶם
  choice: Ils y mettront le feu
  rationale: Rend idiomatiquement l’image du feu et la construction compacte avec ב, dont le référent renvoie à la maison d’Ésaü représentée comme du chaume, sans imposer le maladroit « brûleront parmi eux ».
- source_word: וַאֲכָלוּם
  choice: et la consumeront
  rationale: Dans la métaphore du feu, « consumer » rend naturellement אכל et la destruction complète ; le féminin singulier reprend collectivement « la maison d’Ésaü ».
- source_word: שָׂרִיד
  choice: survivant
  rationale: Rend directement l’absence de personne ayant échappé au jugement, tout en évitant les connotations positives que « reste » peut parfois recevoir.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: car Yahweh a parlé
  rationale: Conserve la clôture prophétique, son autorité et le nom divin sous la forme retenue par le projet.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Transcrit le nom propre divin selon la convention du projet et évite de le remplacer par un titre.
- issue: Sens de « maison de Jacob », « maison de Joseph » et « maison d’Ésaü »
  choice: Des collectivités familiales et nationales
  alternative: De simples foyers ou des entités spirituelles allégoriques
  rationale: Le parallélisme et le contexte d’Abdias indiquent des peuples désignés par leurs ancêtres ; la traduction conserve néanmoins l’idiome sans l’expliciter dans le corps du verset.
- issue: Portée de שָׂרִיד dans l’annonce du jugement
  choice: aucun survivant
  alternative: aucun reste
  rationale: Exprime la totalité du jugement annoncé sans suggérer ici un reste préservé, tout en signalant l’autre traduction lexicale possible.
- issue: Référent des pronoms dans וְדָלְקוּ בָהֶם וַאֲכָלוּם
  choice: La maison d’Ésaü, collectivement
  alternative: 'Ses membres au pluriel : « ils les embraseront et les dévoreront »'
  rationale: Le français peut prolonger avec naturel l’image du chaume en reprenant « la maison d’Ésaü » au féminin singulier, tandis que l’hébreu passe au pluriel pour ses membres ; la variante est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme parallèle est conservé, avec un point médian pour éviter une phrase excessivement longue. « Du chaume » est idiomatique dans l’image agricole et incendiaire. La formulation « Ils y mettront le feu et la consumeront » privilégie un français naturel tout en gardant l’ambiguïté collective entre la maison d’Ésaü et ses membres.
