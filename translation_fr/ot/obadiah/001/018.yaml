revisions:
- from: La maison de Jacob sera un feu, et la maison de Joseph une flamme ; la maison d’Ésaü sera du chaume. Ils y mettront le feu et la consumeront. Il ne restera aucun survivant de la maison d’Ésaü[a], car Yahweh a parlé.
  to: La maison de Jacob sera un feu, et la maison de Joseph une flamme ; la maison d’Ésaü sera du chaume. Ils les embraseront et les consumeront. Il ne restera aucun survivant de la maison d’Ésaü[a], car Yahweh a parlé.
