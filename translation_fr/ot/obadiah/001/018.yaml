review_pass:
  verdict: revise
  source_fidelity: La métaphore et les désignations collectives sont bien rendues. Toutefois, « Ils y mettront le feu et la consumeront » transforme les pronoms pluriels hébreux (« en eux / les ») en reprises locative puis féminine singulière. Cela réduit la référence collective aux membres de la maison d’Ésaü et introduit une alternance qui n’est pas dans le texte source.
  naturalness: Le français est globalement naturel et de registre prophétique accessible. « Ils les embraseront et les consumeront » est à la fois idiomatique dans la métaphore du feu et plus cohérent avec le pluriel hébreu.
  terminology: « maison », « feu », « flamme », « chaume », « survivant » et « Yahweh » conviennent. La note sur « reste » préserve utilement l’alternative de שָׂרִיד sans atténuer l’annonce de destruction.
  issues:
  - severity: medium
    issue: Les pronoms de la seconde proposition sont rendus au singulier féminin.
    rationale: וְדָלְקוּ בָהֶם וַאֲכָלוּם emploie un complément avec suffixes pluriels. La formulation actuelle (« y », puis « la ») explicite autrement le référent et ne conserve pas la reprise collective plurielle du texte hébreu.
  revised_text: La maison de Jacob sera un feu, et la maison de Joseph une flamme ; la maison d’Ésaü sera du chaume. Ils les embraseront et les consumeront. Il ne restera aucun survivant de la maison d’Ésaü[a], car Yahweh a parlé.
  revised_footnotes:
