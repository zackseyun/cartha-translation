  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/הַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְ/הָ֣יָה קֹ֑דֶשׁ וְ/יָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁי/הֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/017.yaml
  text: But on Mount Zion there will be deliverance[a], and it will be holy[c][b], and the house of Jacob will possess their possessions.
translation:
  language: fr
  text: Mais sur le mont Sion, il y aura la délivrance[a] ; il sera saint, et la maison de Jacob prendra possession de ce qui lui appartient[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il y aura des rescapés » ; le nom hébreu peut désigner soit la délivrance ou le fait d’échapper, soit les personnes qui échappent.
    reason: lexical_alternative
  - marker: b
    text: Ou « héritera de son héritage ».
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi comprendre : « la maison de Jacob dépossédera ceux qui l’avaient dépossédée », si le dernier terme est pris dans un sens agentif.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְהַר צִיּוֹן
  choice: Mais sur le mont Sion
  rationale: La conjonction peut se traduire par « et », mais le contexte marque un contraste net avec le jugement d’Édom au verset précédent. « Mais » rend naturellement ce mouvement du discours.
- source_word: תִּהְיֶה פְלֵיטָה
  choice: il y aura la délivrance
  rationale: פְלֵיטָה peut désigner la délivrance, l’évasion ou ceux qui échappent. « La délivrance » conserve ici une certaine amplitude sémantique sans réduire la promesse aux seuls survivants.
- source_word: וְהָיָה קֹדֶשׁ
  choice: il sera saint
  rationale: Le verbe masculin singulier renvoie le plus naturellement au mont Sion. L’adjectif « saint » exprime dans un français clair son caractère consacré.
- source_word: וְיָרְשׁוּ
  choice: prendra possession
  rationale: Le verbe ירשׁ peut signifier posséder, hériter ou déposséder. « Prendre possession » convient au contexte de restauration et évite d’imposer exclusivement le sens juridique d’hériter.
- source_word: בֵּית יַעֲקֹב
  choice: la maison de Jacob
  rationale: Cette formulation traditionnelle et digne conserve l’expression collective et nationale du texte prophétique.
- source_word: אֵת מוֹרָשֵׁיהֶם
  choice: de ce qui lui appartient
  rationale: מוֹרָשָׁה désigne couramment une possession ou un héritage. La tournure française évite l’expression maladroite « ses possessions » tout en rendant le suffixe pronominal et l’idée de recouvrer ses biens.
theological_decisions:
- issue: Nature de la restauration promise à Sion
  choice: Le verset annonce une délivrance réelle centrée sur le mont Sion, devenu saint, sans préciser si l’accent porte surtout sur l’acte de délivrer ou sur les rescapés.
  alternative: Comprendre principalement פְלֵיטָה comme désignant les survivants présents à Sion.
  rationale: Le substantif hébreu permet ces deux nuances liées. Le texte principal conserve la notion large de délivrance et la note signale explicitement la lecture personnelle.
- issue: Objet de la reprise de possession par la maison de Jacob
  choice: La maison de Jacob reprend possession de ce qui lui appartient.
  alternative: La maison de Jacob dépossède ceux qui l’avaient dépossédée.
  rationale: Le sens nominal de מוֹרָשָׁה, « possession » ou « héritage », est morphologiquement et contextuellement solide, mais une analyse agentive est assez significative pour être conservée en note.
translation_notes:
  register: Français international moderne, clair et digne, avec maintien du registre prophétique. La ponctuation articule les trois affirmations sans alourdir la répétition des conjonctions hébraïques. Les marqueurs de notes figurent tous dans le texte principal, placés sur les segments auxquels ils se rapportent.
