id: OBA.1.16
reference: Obadiah 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֗י כַּֽ/אֲשֶׁ֤ר שְׁתִיתֶם֙ עַל הַ֣ר קָדְשִׁ֔/י יִשְׁתּ֥וּ כָֽל הַ/גּוֹיִ֖ם תָּמִ֑יד וְ/שָׁת֣וּ וְ/לָע֔וּ וְ/הָי֖וּ כְּ/ל֥וֹא הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/016.yaml
  text: For just as you drank on my holy mountain[a], all the nations will drink continually; they will drink and swallow[b], and they will be as though they had never been.
translation:
  language: fr
  text: Car, de même que vous avez bu sur ma montagne sainte, toutes les nations boiront sans cesse ; elles boiront, avaleront[a] et seront comme si elles n’avaient jamais existé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « engloutiront ». Le sens précis du verbe hébreu est incertain ; il peut souligner le fait d’avaler entièrement.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte prophétique, boire évoque probablement le fait de subir le jugement divin.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du jugement annoncé au verset précédent et s’intègre naturellement au fil du discours.
- source_word: כַּאֲשֶׁר
  choice: de même que
  rationale: Marque clairement la correspondance entre ce qu’ont fait les destinataires et ce que subiront les nations.
- source_word: שְׁתִיתֶם
  choice: vous avez bu
  rationale: Le parfait qal à la deuxième personne du pluriel renvoie à une action accomplie ; le passé composé est naturel en français moderne.
- source_word: עַל הַר קָדְשִׁי
  choice: sur ma montagne sainte
  rationale: Conserve l’image concrète et l’ordre possessif naturel en français, sans expliciter dans le texte principal qu’il s’agit de Sion ou de Jérusalem.
- source_word: יִשְׁתּוּ כָל הַגּוֹיִם תָּמִיד
  choice: toutes les nations boiront sans cesse
  rationale: Rend la portée générale de גּוֹיִם et la continuité insistante exprimée par תָּמִיד.
- source_word: וְשָׁתוּ
  choice: elles boiront
  rationale: Préserve la répétition rhétorique du verbe hébreu.
- source_word: וְלָעוּ
  choice: avaleront
  rationale: Rend sobrement l’idée probable d’engloutir ou d’avaler complètement, tout en signalant l’incertitude lexicale en note.
- source_word: וְהָיוּ כְּלֹא הָיוּ
  choice: seront comme si elles n’avaient jamais existé
  rationale: Formulation française idiomatique qui conserve la comparaison irréelle et la force d’anéantissement de l’expression hébraïque.
theological_decisions:
- issue: Nature de l’image de la boisson
  choice: Conserver littéralement « boire » dans le texte, en indiquant en note qu’il s’agit probablement d’une image du jugement divin.
  alternative: Expliciter dans le texte « boire la coupe du jugement » ou comprendre une consommation violente plus générale.
  rationale: Le contexte prophétique favorise l’image du jugement, mais le verset ne nomme ni coupe ni colère ; la traduction préserve donc la tension métaphorique.
- issue: Référent du « vous » pluriel
  choice: Maintenir le pronom sans ajouter « Édom » dans le texte.
  alternative: Traduire explicitement « vous, Édomites » ou comprendre une adresse collective aux nations.
  rationale: Le contexte immédiat vise Édom, mais l’hébreu emploie seulement la deuxième personne du pluriel ; ne pas expliciter évite une addition interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « boiront » est volontaire, car elle reproduit l’insistance de l’hébreu. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
