source:
  edition: WLC
  text: הֲ/ל֛וֹא בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/הַאֲבַדְתִּ֤י חֲכָמִים֙ מֵֽ/אֱד֔וֹם וּ/תְבוּנָ֖ה מֵ/הַ֥ר עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/008.yaml
  text: Will I not[a], on that day, declares Yahweh, destroy the wise men from Edom, and understanding from the mountain of Esau?
translation:
  language: fr
  text: Ce jour-là, déclare Yahweh, ne ferai-je pas disparaître d’Édom les sages et de la montagne d’Ésaü[a] l’intelligence ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du mont d’Ésaü » ou « de la région montagneuse d’Ésaü ». L’hébreu dit littéralement « de la montagne d’Ésaü ».
    reason: Alternative lexicale et géographique pour l’expression מֵהַר עֵשָׂו.
lexical_decisions:
- source_word: הֲלוֹא
  choice: ne ferai-je pas
  rationale: Conserve la forme interrogative rhétorique, qui appelle une réponse affirmative, plutôt que de la transformer en simple affirmation.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Rend naturellement en français moderne l’expression temporelle hébraïque, sans perdre sa portée prophétique.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Reproduit avec solennité la formule prophétique qui identifie l’énoncé comme une parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: וְהַאֲבַדְתִּי
  choice: ferai-je disparaître
  rationale: Le hiphil exprime ici l’action par laquelle Yahweh éliminera les sages d’Édom. Cette formulation garde la valeur causative et convient au contexte de jugement.
- source_word: חֲכָמִים
  choice: les sages
  rationale: Désigne les personnes réputées pour leur sagesse. En français, « les sages » est collectif, naturel et n’exclut pas la valeur masculine du pluriel hébreu.
- source_word: מֵאֱדוֹם
  choice: d’Édom
  rationale: La préposition marque le lieu ou le groupe dont les sages seront retranchés.
- source_word: וּתְבוּנָה
  choice: l’intelligence
  rationale: Conserve le nom abstrait hébreu et son parallélisme avec « les sages » ; le mot désigne ici la faculté de comprendre et de discerner.
- source_word: מֵהַר עֵשָׂו
  choice: de la montagne d’Ésaü
  rationale: Suit de près l’expression hébraïque et préserve son image géographique ainsi que le parallèle entre Édom et Ésaü, tout en signalant en note le sens régional possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le nom propre divin. Sa transcription préserve cette donnée sans remplacer le nom par un titre.
- issue: Portée de la question introduite par הֲלוֹא
  choice: 'question rhétorique : « ne ferai-je pas »'
  alternative: 'affirmation : « assurément, je ferai disparaître »'
  rationale: La question attend bien une réponse affirmative, mais conserver sa forme maintient la force rhétorique de l’hébreu au lieu d’en expliciter silencieusement le résultat.
- issue: Référent géographique de הַר עֵשָׂו
  choice: la montagne d’Ésaü
  alternative: la région montagneuse d’Ésaü
  rationale: L’expression peut désigner soit une montagne, soit le territoire montagneux associé à Ésaü. Le texte principal conserve l’image littérale et la note rend l’ambiguïté géographique accessible.
translation_notes:
  register: Français moderne, digne et direct. L’ordre des compléments maintient le parallélisme entre « d’Édom les sages » et « de la montagne d’Ésaü l’intelligence ». Les tirets isolent la formule prophétique sans alourdir la question.
