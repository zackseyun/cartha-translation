id: OBA.1.14
reference: Obadiah 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַֽל תַּעֲמֹד֙ עַל הַ/פֶּ֔רֶק לְ/הַכְרִ֖ית אֶת פְּלִיטָ֑י/ו וְ/אַל תַּסְגֵּ֥ר שְׂרִידָ֖י/ו בְּ/י֥וֹם צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/014.yaml
  text: Do not stand at the crossroads to cut off his fugitives[c][b][a], and do not hand over his survivors in the day of distress.
translation:
  language: fr
  text: Ne te poste pas au carrefour[a] pour éliminer ses fuyards, et ne livre pas[b] ses survivants[c] au jour de la détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la bifurcation » ou « au col ». Le terme hébreu désigne ici un endroit où l’on pouvait intercepter les fuyards.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne remets pas » ou « ne livre pas aux mains de l’ennemi ». Le verbe hébreu signifie littéralement « fermer » ou « enfermer » et prend ici le sens de livrer quelqu’un au pouvoir d’un autre.
    reason: lexical_alternative
  - marker: c
    text: Ou « son reste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲמֹד
  choice: te poste
  rationale: Dans ce contexte d’interception, עמד décrit le fait de prendre position à un endroit. « Te poste » restitue naturellement cette action concrète en français.
- source_word: הַפֶּרֶק
  choice: au carrefour
  rationale: Le terme rare פֶּרֶק désigne ici vraisemblablement un endroit stratégique où les voies se séparent et où l’on peut intercepter des fuyards. « Carrefour » est clair, tout en laissant les autres possibilités en note.
- source_word: לְהַכְרִית
  choice: pour éliminer
  rationale: כרת signifie littéralement « retrancher, couper » et peut désigner l’élimination de personnes. « Éliminer » exprime ici la finalité hostile sans réduire le sens au seul fait de leur barrer le passage.
- source_word: פְּלִיטָיו
  choice: ses fugitifs
  rationale: פליט désigne quelqu’un qui s’est échappé ou qui fuit un désastre. « Fugitifs » convient au contexte de personnes poursuivies pendant leur fuite.
- source_word: תַּסְגֵּר
  choice: ne livre pas
  rationale: סגר signifie fondamentalement « fermer, enfermer », mais prend ici le sens contextuel de livrer des survivants au pouvoir de l’ennemi.
- source_word: שְׂרִידָיו
  choice: ses survivants
  rationale: שרד désigne ceux qui restent après une catastrophe. « Survivants » exprime directement le sens contextuel sans imposer au mot une valeur théologique technique.
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: Cette formulation conserve l’expression temporelle solennelle et rend la gravité de צָרָה dans un français digne et compréhensible.
theological_decisions:
- issue: Portée éventuelle de שְׂרִידָיו
  choice: ses survivants
  alternative: son reste
  rationale: « Reste » est lexicalement possible et peut avoir une résonance théologique particulière dans les écrits prophétiques. Ici, le contexte immédiat vise simplement les Judéens demeurés en vie; « survivants » évite d’introduire une nuance doctrinale non exigée, tandis que l’alternative est conservée en note.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement singulier maintient l’adresse directe à Édom. La syntaxe parallèle des deux interdictions est conservée.
