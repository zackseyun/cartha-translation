language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָל֤וּ מֽוֹשִׁעִים֙ בְּ/הַ֣ר צִיּ֔וֹן לִ/שְׁפֹּ֖ט אֶת הַ֣ר עֵשָׂ֑ו וְ/הָיְתָ֥ה לַֽ/יהוָ֖ה הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/021.yaml
  text: Deliverers will go up on Mount Zion to judge the hill country of Esau[c][b][a], and the kingdom will belong to Yahweh.
translation:
  language: fr
  text: Des libérateurs monteront sur le mont Sion pour juger la région montagneuse d’Ésaü[a][b] ; la royauté appartiendra à l’Éternel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des sauveurs ». Le terme hébreu désigne ici des agents qui apportent la délivrance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la montagne d’Ésaü » ; l’expression désigne probablement le territoire montagneux d’Édom.
    reason: lexical_alternative
  - marker: c
    text: Ou « la souveraineté appartiendra à l’Éternel » ou « le royaume appartiendra à l’Éternel ».",
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלוּ
  choice: monteront
  rationale: Le parfait qal avec waw dans cette séquence prophétique se rend naturellement par un futur. « Monteront » conserve l’image concrète de l’ascension vers Sion.
- source_word: מוֹשִׁעִים
  choice: des libérateurs
  rationale: Le participe substantivé pluriel désigne des agents qui apportent la délivrance. « Libérateurs » est naturel en français et maintient leur rôle humain sans masquer le pluriel.
- source_word: בְּהַר צִיּוֹן
  choice: sur le mont Sion
  rationale: Formulation française idiomatique qui conserve le nom propre et le sens topographique.
- source_word: לִשְׁפֹּט
  choice: pour juger
  rationale: « Juger » préserve le sens lexical premier de שׁפט, tout en laissant ouverte sa possible dimension de gouvernement.
- source_word: אֶת הַר עֵשָׂו
  choice: la région montagneuse d’Ésaü
  rationale: הַר peut désigner une région montagneuse plutôt qu’un sommet isolé. Ésaü représente ici son territoire, Édom.
- source_word: וְהָיְתָה לַיהוָה
  choice: appartiendra à l’Éternel
  rationale: La construction avec ל indiquant le possesseur s’exprime naturellement en français par « appartenir à ».
- source_word: הַמְּלוּכָה
  choice: la royauté
  rationale: Le nom désigne l’autorité ou la souveraineté royale, et non nécessairement un territoire. « Royauté » conserve mieux cette nuance, tandis que « règne » reste possible.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français conventionnel et intelligible du tétragramme dans le corps du texte.
theological_decisions:
- issue: Le rôle des agents humains pluriels מוֹשִׁעִים face à la souveraineté divine
  choice: des libérateurs
  alternative: des sauveurs
  rationale: Le terme désigne plusieurs agents de délivrance, tandis que la proposition finale attribue la royauté à YHWH. Le choix conserve cette tension sans faire de ces agents les détenteurs ultimes du salut.
- issue: La portée de הַמְּלוּכָה
  choice: la royauté appartiendra à l’Éternel
  alternative: le règne sera à l’Éternel / le royaume appartiendra à l’Éternel
  rationale: Le mot peut viser la royauté, l’exercice du pouvoir royal ou le royaume. Le texte principal privilégie l’autorité royale sans exclure les autres nuances, signalées en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le mouvement prophétique du texte hébreu. « Région montagneuse » évite de suggérer un sommet unique, et « royauté » préserve la nuance d’autorité souveraine.
