source:
  edition: WLC
  text: אַל תָּב֤וֹא בְ/שַֽׁעַר עַמִּ/י֙ בְּ/י֣וֹם אֵידָ֔/ם אַל תֵּ֧רֶא גַם אַתָּ֛ה בְּ/רָעָת֖/וֹ בְּ/י֣וֹם אֵיד֑/וֹ וְ/אַל תִּשְׁלַ֥חְנָה בְ/חֵיל֖/וֹ בְּ/י֥וֹם אֵידֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/013.yaml
  text: Do not enter the gate of my people in the day of their disaster[a]; do not look on his calamity, even you, in the day of his disaster[b]; and do not lay hands on his wealth in the day of his disaster.
translation:
  language: fr
  text: N’entre pas par la porte de mon peuple au jour de leur désastre ; ne regarde pas, toi non plus, son malheur au jour de son désastre ; ne porte pas la main sur ses richesses[a] au jour de son désastre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses forces », « son armée » ou « ses ressources » ; le terme hébreu peut désigner la puissance militaire aussi bien que les biens matériels.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא בְשַׁעַר עַמִּי
  choice: entre par la porte de mon peuple
  rationale: La tournure conserve l’image concrète de la porte, qui désigne l’entrée de la ville, sans la remplacer par une paraphrase.
- source_word: בְּיוֹם אֵידָם
  choice: au jour de leur désastre
  rationale: אֵיד désigne une calamité ou un désastre. Le pluriel du suffixe est conservé dans la première proposition.
- source_word: תֵּרֶא
  choice: contemple
  rationale: Le verbe signifie littéralement « voir/regarder ». Dans ce contexte hostile, « contempler » peut suggérer un regard prolongé et complaisant sans expliciter avec certitude l’idée de jubilation, absente du lexème lui-même.
- source_word: גַם אַתָּה
  choice: toi aussi
  rationale: Cette formulation naturelle maintient l’insistance accusatrice portée par גַם אַתָּה.
- source_word: בְרָעָתוֹ
  choice: son malheur
  rationale: רָעָה désigne ici le mal subi, non le mal moral. « Malheur » convient au contexte et permet de conserver le suffixe singulier.
- source_word: וְאַל תִּשְׁלַחְנָה
  choice: ne porte pas la main sur
  rationale: Avec la préposition ב, שׁלח exprime ici le fait d’étendre ou de porter la main sur quelque chose, vraisemblablement pour s’en emparer.
- source_word: בְחֵילוֹ
  choice: ses richesses
  rationale: חַיִל peut désigner les forces, l’armée, les ressources ou les richesses. Le contexte d’une exploitation du désastre favorise « richesses », tout en justifiant une note sur l’ambiguïté.
- source_word: בְּיוֹם אֵידוֹ
  choice: au jour de son désastre
  rationale: La répétition du refrain est conservée, ainsi que le passage du pluriel au singulier dans les suffixes hébreux.
theological_decisions:
- issue: Alternance entre suffixes pluriel et singulier
  choice: Conserver « leur désastre » dans la première proposition, puis « son malheur / son désastre » dans les suivantes
  alternative: Harmoniser tous les pronoms au pluriel ou tous au singulier
  rationale: L’hébreu passe délibérément du peuple collectif au peuple envisagé comme une entité singulière, probablement Jacob personnifié. La traduction ne gomme pas cette tension grammaticale.
- issue: Portée hostile du verbe ראה
  choice: « ne contemple pas »
  alternative: « ne te réjouis pas à la vue de » ou « ne jubile pas devant »
  rationale: Le contexte implique un regard hostile ou complaisant, mais le verbe signifie d’abord « voir/regarder ». La formulation choisie laisse cette implication au contexte plutôt que de l’inscrire explicitement dans le lexème.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les impératifs négatifs et la triple répétition de « au jour de son/leur désastre » préservent le rythme accusateur du texte. Le changement de nombre des pronoms est volontairement maintenu.
