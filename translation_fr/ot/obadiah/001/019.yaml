source:
  edition: WLC
  text: וְ/יָרְשׁ֨וּ הַ/נֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְ/הַ/שְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְ/יָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְ/אֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּ/בִנְיָמִ֖ן אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/019.yaml
  text: Those of the Negev will possess the hill country of Esau[a], and those of the Shephelah the land of the Philistines; they will also possess the territory of Ephraim and the territory of Samaria[b], and Benjamin will possess Gilead.
translation:
  language: fr
  text: Ceux du Néguev prendront possession[a] des montagnes d’Ésaü, et ceux de la Shéphéla prendront possession du pays des Philistins[b]. Ils prendront aussi possession du territoire d’Éphraïm et du territoire de Samarie, et Benjamin prendra possession de Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hériteront » ; le verbe hébreu peut évoquer aussi bien l’héritage que la prise de possession d’un territoire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les Philistins » ; la traduction explicite ici le sens territorial.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: prendront possession
  rationale: Le verbe ירשׁ peut exprimer l’entrée en possession d’un territoire, par héritage ou par conquête. « Prendre possession » convient au contexte territorial sans préciser indûment le mode d’acquisition.
- source_word: הַנֶּגֶב
  choice: ceux du Néguev
  rationale: Le nom de la région désigne ici, par métonymie, ses habitants. La formulation explicite ce sujet implicite tout en conservant le nom géographique.
- source_word: הַר עֵשָׂו
  choice: les montagnes d’Ésaü
  rationale: Dans cette expression territoriale, הַר désigne la région montagneuse d’Édom plutôt qu’un sommet isolé.
- source_word: הַשְּׁפֵלָה
  choice: ceux de la Shéphéla
  rationale: Comme « le Néguev », ce nom régional représente ses habitants. La translittération conserve la désignation géographique judéenne.
- source_word: פְּלִשְׁתִּים
  choice: le pays des Philistins
  rationale: L’hébreu emploie littéralement l’ethnonyme « les Philistins », mais l’objet de la prise de possession est leur territoire ; la traduction rend ce sens territorial explicite.
- source_word: שְׂדֵה אֶפְרַיִם
  choice: le territoire d’Éphraïm
  rationale: שָׂדֶה signifie littéralement « champ », mais peut désigner une campagne ou une région. Ici, « territoire » exprime clairement le sens géographique.
- source_word: שְׂדֵה שֹׁמְרוֹן
  choice: le territoire de Samarie
  rationale: Dans ce contexte de possession foncière, l’expression désigne la région associée à Samarie et non un champ particulier.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Le nom tribal désigne collectivement la tribu ou ses membres ; le maintien du nom seul reproduit cette métonymie de façon naturelle.
- source_word: הַגִּלְעָד
  choice: Galaad
  rationale: « Galaad » est la forme française traditionnelle et courante du nom de cette région ; l’article hébreu n’a pas besoin d’être reproduit.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure elliptique de l’hébreu est conservée dans les deux derniers membres (« et ceux de la Shéphéla… », « et Benjamin… »), tandis que les sujets humains implicites derrière les noms régionaux sont explicités. Les notes ont été rattachées aux expressions qu’elles expliquent.
