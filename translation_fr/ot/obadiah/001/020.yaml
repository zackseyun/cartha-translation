  text: וְ/גָלֻ֣ת הַֽ/חֵל הַ֠/זֶּה לִ/בְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְ/גָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/סְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/020.yaml
  text: And the exiles of this host of the sons of Israel, who are among the Canaanites as far as Zarephath, and the exiles of Jerusalem who are in Sepharad, will possess the cities of the Negev.
translation:
  language: fr
  text: Les exilés de cette troupe des fils d’Israël, qui sont parmi les Cananéens jusqu’à Sarepta, et les exilés de Jérusalem qui sont à Séfarad prendront possession des villes du Néguev.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָלֻת
  choice: les déportés
  rationale: Le nom collectif désigne ici la population emmenée en exil; «les déportés» est naturel en français et convient aux deux occurrences.
- source_word: הַחֵל הַזֶּה
  choice: cette troupe
  rationale: חֵיל peut désigner une force, une armée ou une troupe. «Troupe» conserve la dimension collective sans imposer trop fortement un sens strictement militaire.
- source_word: כְּנַעֲנִים
  choice: parmi les Cananéens
  rationale: La forme et la syntaxe sont difficiles; cette lecture, conforme à la compréhension massorétique traditionnelle et au contexte géographique, laisse entendre une résidence au milieu des Cananéens sans surinterpréter.
- source_word: יִרְשׁוּ
  choice: prendront possession de
  rationale: Le verbe ירשׁ exprime ici l’entrée en possession, probablement avec l’idée de reconquête ou d’héritage; cette formulation garde cette portée.
- source_word: הַנֶּגֶב
  choice: le Néguev
  rationale: Nom géographique établi en français pour la région méridionale de Juda.
theological_decisions:
- issue: Nature de la restauration annoncée
  choice: 'Formulation territoriale concrète: «prendront possession des villes»'
  alternative: Spiritualiser la possession ou l’identifier explicitement à un accomplissement historique ou eschatologique précis
  rationale: Le texte annonce une prise de possession géographique, mais ne précise pas ici son calendrier ni son mode d’accomplissement; la traduction ne tranche donc pas ces questions.
translation_notes:
  register: 'Français moderne, digne et direct. La longue coordination de l’hébreu est conservée tout en restant lisible. Les toponymes suivent les formes françaises usuelles: Sarepta, Séfarad et Néguev.'
