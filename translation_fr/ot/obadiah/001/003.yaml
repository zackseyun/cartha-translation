  verdict: revise
  source_fidelity: La traduction rend correctement l’accusation (« l’orgueil de ton cœur t’a trompé »), l’adresse directe à Édom, les creux rocheux, le défi intérieur et l’abaissement « jusqu’à terre ». Toutefois, « dans ta demeure élevée » transforme quelque peu מְרוֹם שִׁבְתּוֹ (« dont la demeure est en hauteur / haut perchée ») en un second complément de lieu dépendant de « habites ».
  naturalness: Le texte est globalement fluide et de registre approprié. « Anfractuosités » est exact, mais assez technique pour le français international moderne; « creux du rocher » est plus immédiat tout en gardant l’image de refuges ou d’habitations dans la roche. La relative « dont la demeure est haut perchée » restitue plus clairement et naturellement la relation syntaxique de l’hébreu.
  terminology: « Orgueil », « cœur », « trompé », « rocher » et « jusqu’à terre » sont des choix appropriés. Les notes conservent les alternatives lexicales pertinentes. Aucun enjeu théologique ne requiert d’interprétation ajoutée.
  issues:
