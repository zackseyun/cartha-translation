  text: זְד֤וֹן לִבְּ/ךָ֙ הִשִּׁיאֶ֔/ךָ שֹׁכְנִ֥י בְ/חַגְוֵי סֶּ֖לַע מְר֣וֹם שִׁבְתּ֑/וֹ אֹמֵ֣ר בְּ/לִבּ֔/וֹ מִ֥י יוֹרִדֵ֖/נִי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/003.yaml
  text: The pride of your heart has deceived you[a], you who dwell in the clefts of the rock, whose dwelling is on high, who say in your heart[c][b], “Who will bring me down to the ground?”
translation:
  language: fr
  text: 'L’orgueil[a] de ton cœur t’a trompé, toi qui habites dans les creux du rocher[b], dont la demeure est haut perchée, toi qui dis dans ton cœur : « Qui me fera descendre jusqu’à terre[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’arrogance » ou « la présomption ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les fissures du rocher ». L’expression évoque des refuges rocheux et des habitations fortifiées dans les falaises.
    reason: cultural_note
  - marker: c
    text: Ou « jusqu’au sol » ou « jusqu’à la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זְדוֹן
  choice: orgueil
  rationale: Le nom désigne ici une arrogance présomptueuse et une exaltation de soi. « Orgueil » est naturel en français et convient à l’accusation prophétique portée contre Édom.
- source_word: לִבְּךָ
  choice: ton cœur
  rationale: Le « cœur » hébreu désigne la vie intérieure, notamment la pensée et la volonté. Le maintien de cette image préserve l’accent du texte sur l’assurance intérieure d’Édom.
- source_word: הִשִּׁיאֶךָ
  choice: t’a trompé
  rationale: Le hifil de נשׁא exprime ici le fait d’égarer ou de tromper. Le passé composé rend naturellement en français l’état présent résultant de cette tromperie.
- source_word: שֹׁכְנִי
  choice: toi qui habites
  rationale: Le participe décrit l’interlocuteur dans une construction d’apposition. Cette formulation conserve la force de l’adresse directe.
- source_word: בְחַגְוֵי סֶּלַע
  choice: dans les anfractuosités du rocher
  rationale: חגוי désigne des fentes, creux ou retraites rocheuses. « Anfractuosités » rend avec précision le relief accidenté et les refuges naturels évoqués, sans réduire l’image à une seule fissure.
- source_word: מְרוֹם שִׁבְתּוֹ
  choice: dans ta demeure élevée
  rationale: L’expression décrit la hauteur réputée inaccessible du lieu habité. La formulation française s’intègre à l’adresse directe tout en gardant l’idée d’une habitation située en hauteur.
- source_word: אֹמֵר בְּלִבּוֹ
  choice: toi qui dis dans ton cœur
  rationale: Bien que l’hébreu emploie ici des formes à la troisième personne du singulier, le contexte encadre la description par une adresse directe à Édom. Le français maintient donc la deuxième personne, tout en conservant l’expression sémitique « dans ton cœur ».
- source_word: מִי יוֹרִדֵנִי
  choice: Qui me fera descendre
  rationale: Le hifil de ירד signifie « faire descendre ». Cette traduction garde le défi plein d’assurance exprimé par l’interlocuteur.
- source_word: אָרֶץ
  choice: jusqu’à terre
  rationale: Dans ce contexte, le mot contraste avec la demeure élevée et exprime l’abaissement jusqu’au sol. « Jusqu’à terre » rend clairement ce contraste vertical.
theological_decisions:
- issue: Alternance entre l’adresse à la deuxième personne et les formes à la troisième personne dans les propositions descriptives
  choice: 'Maintenir l’ensemble de la description en adresse directe : « toi qui habites… ta demeure… toi qui dis dans ton cœur »'
  alternative: 'Reproduire le changement grammatical : « celui qui habite… sa demeure… qui dit dans son cœur »'
  rationale: Le verset commence par des suffixes de deuxième personne et la parole citée concerne clairement le même interlocuteur collectif, Édom. L’unification à la deuxième personne donne un français cohérent sans modifier l’identité du destinataire, tandis que le détail grammatical est signalé dans les décisions lexicales.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier reflète l’adresse collective à Édom. « Anfractuosités » est précis mais demeure compréhensible grâce à la note proposant « fissures ». La ponctuation met en relief la vantardise finale sans l’expliquer ni en atténuer la tension.
