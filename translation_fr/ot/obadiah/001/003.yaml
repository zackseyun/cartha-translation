    rationale: Le texte hébreu décrit le destinataire comme habitant dans les creux du rocher et ayant sa demeure « en hauteur ». En français, deux compléments successifs introduits par « dans » donnent plutôt l’impression qu’il habite simultanément dans les anfractuosités et à l’intérieur d’une demeure qualifiée d’« élevée ». Une proposition relative restitue explicitement la demeure située en hauteur.
  - severity: low
    issue: « Anfractuosités » est inutilement technique
    rationale: Le mot est possible, mais « creux du rocher » est plus naturel dans un français moderne international et convient au sens de fissures, cavités ou retraites rocheuses de חַגְוֵי.
