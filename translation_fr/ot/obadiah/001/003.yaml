  to: 'L’orgueil[a] de ton cœur t’a trompé, toi qui habites dans les creux du rocher[b], dont la demeure est haut perchée, toi qui dis dans ton cœur : « Qui me fera descendre jusqu’à terre[c] ? »'
  rationale: La révision rend explicitement la structure descriptive de מְרוֹם שִׁבְתּוֹ par « dont la demeure est haut perchée », sans interprétation supplémentaire. Elle remplace aussi le terme technique « anfractuosités » par « creux », plus naturel, tout en préservant la précision possible dans la note.
