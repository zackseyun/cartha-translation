id: OBA.1.1
reference: Obadiah 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לֶ/אֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵ/אֵ֤ת יְהוָה֙ וְ/צִיר֙ בַּ/גּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְ/נָק֥וּמָה עָלֶי/הָ לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/001.yaml
  text: 'The vision of Obadiah[a]. Thus says the Lord GOD concerning Edom: We have heard a report from Yahweh, and a messenger has been sent among the nations: “Rise up[c][b], and let us rise against her for battle.”'
translation:
  language: fr
  text: 'Vision d’Abdias. Ainsi parle le Seigneur Yahweh au sujet d’Édom : « Nous avons entendu une nouvelle venant de Yahweh, et un messager[a] a été envoyé parmi les nations : “Debout ! Levons-nous[b] contre elle[c] pour lui faire la guerre !” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un émissaire » ou « un ambassadeur ».
    reason: lexical_alternative
  - marker: b
    text: L’identité de ceux qui disent « nous avons entendu » et « levons-nous » n’est pas précisée en hébreu; les deux « nous » peuvent être compris de plusieurs manières.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement « contre elle » : le pronom féminin renvoie à Édom, envisagé comme une nation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזוֹן
  choice: vision
  rationale: Le nom désigne couramment une vision ou révélation prophétique. « Vision » convient naturellement à ce titre sans préciser davantage le mode de révélation.
- source_word: עֹבַדְיָה
  choice: Abdias
  rationale: La forme française traditionnelle et courante du nom biblique est retenue.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette tournure française actuelle conserve la solennité de la formule prophétique hébraïque.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le rendu distingue le titre אֲדֹנָי, « Seigneur », du nom divin יהוה, transcrit « Yahweh ».
- source_word: לֶאֱדוֹם
  choice: au sujet d’Édom
  rationale: Ici, la préposition introduit vraisemblablement le thème de l’oracle plutôt qu’un destinataire directement interpellé.
- source_word: שְׁמוּעָה
  choice: une nouvelle
  rationale: Le terme désigne ce qui a été entendu, une nouvelle ou un rapport. « Nouvelle » est naturel en français et n’implique pas l’incertitude d’une rumeur.
- source_word: שָׁמַעְנוּ
  choice: nous avons entendu
  rationale: Le passé composé exprime un fait reçu dont les effets demeurent présents, tout en conservant l’image auditive de l’hébreu.
- source_word: מֵאֵת יְהוָה
  choice: venant de Yahweh
  rationale: La locution marque explicitement Yahweh comme source de la nouvelle.
- source_word: וְצִיר
  choice: et un messager
  rationale: « Messager » couvre le sens général du terme, qui peut aussi désigner un émissaire ou un ambassadeur.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Dans ce contexte géopolitique, « nations » rend clairement גּוֹיִם sans connotation étrangère au passage.
- source_word: שֻׁלָּח
  choice: a été envoyé
  rationale: Le passif au passé composé rend l’action accomplie de l’envoi et sa pertinence actuelle.
- source_word: קוּמוּ וְנָקוּמָה
  choice: Debout ! Levons-nous
  rationale: Cette formulation énergique conserve la répétition de la racine קום et l’enchaînement entre l’impératif pluriel et l’exhortation à la première personne du pluriel.
- source_word: עָלֶיהָ לַמִּלְחָמָה
  choice: contre elle pour lui faire la guerre
  rationale: Le féminin renvoie grammaticalement à Édom envisagé comme une nation; la formulation française exprime naturellement le mouvement hostile en vue du combat.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription « Yahweh » rend explicitement le nom divin dans ses deux occurrences. Dans אֲדֹנָי יְהוִה, « le Seigneur Yahweh » préserve aussi la distinction entre le titre et le nom.
- issue: Identité des locuteurs de « nous avons entendu » et « levons-nous »
  choice: Conserver les premières personnes du pluriel sans identifier leurs référents
  alternative: Les interpréter comme un pluriel prophétique, la parole du conseil céleste ou celle des nations
  rationale: L’hébreu ne précise pas qui est inclus dans chacun de ces pluriels, ni si leur référent est identique. La traduction conserve cette ambiguïté littéraire et théologique.
- issue: Genre du pronom renvoyant à Édom
  choice: elle
  alternative: lui ou ce pays, avec neutralisation du genre
  rationale: Le suffixe hébreu est féminin et présente Édom comme une entité nationale. Le pronom féminin français permet de conserver ce trait sans ajouter d’explication dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique reste solennelle sans archaïsme; l’appel guerrier est bref et énergique. Les guillemets emboîtés distinguent la parole prophétique de l’appel transmis parmi les nations.
