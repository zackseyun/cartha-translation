revisions:
- from: Tous ceux qui avaient fait alliance avec toi t’ont renvoyé jusqu’à la frontière[a]. Ceux qui vivaient en paix avec toi t’ont trompé et l’ont emporté sur toi. Ceux qui mangeaient ton pain ont placé un piège sous tes pas[b] — il n’y a en lui aucun discernement[c].
  to: Tous ceux qui étaient liés à toi par alliance t’ont envoyé jusqu’à la frontière[a]. Ceux qui étaient en paix avec toi t’ont trompé et l’ont emporté sur toi. Ceux qui mangent ton pain ont placé un piège sous toi[b] — il n’y a pas de discernement en lui[c].
  rationale: La révision retire l’ajout interprétatif « sous tes pas » et évite les imparfaits qui situent indûment dans le passé les partenaires, les relations de paix et les convives. Elle conserve les alternatives lexicales et l’ambiguïté délibérée de la conclusion.
