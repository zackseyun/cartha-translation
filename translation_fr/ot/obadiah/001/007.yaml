source:
  edition: WLC
  text: עַֽד הַ/גְּב֣וּל שִׁלְּח֗וּ/ךָ כֹּ֚ל אַנְשֵׁ֣י בְרִיתֶ֔/ךָ הִשִּׁיא֛וּ/ךָ יָכְל֥וּ לְ/ךָ֖ אַנְשֵׁ֣י שְׁלֹמֶ֑/ךָ לַחְמְ/ךָ֗ יָשִׂ֤ימוּ מָזוֹר֙ תַּחְתֶּ֔י/ךָ אֵ֥ין תְּבוּנָ֖ה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/007.yaml
  text: All the men of your covenant have sent you to the border[a]; the men at peace with you have deceived you and prevailed against you[c][b]. Those who eat your bread have set a trap under you—there is no understanding in him.
translation:
  language: fr
  text: Tous ceux qui étaient liés à toi par alliance t’ont envoyé jusqu’à la frontière[a]. Ceux qui étaient en paix avec toi t’ont trompé et l’ont emporté sur toi. Ceux qui mangent ton pain ont placé un piège sous toi[b] — il n’y a pas de discernement en lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’ont chassé jusqu’à la frontière » ou « t’ont accompagné jusqu’à la frontière ». Le verbe hébreu peut avoir ici une nuance neutre ou hostile.
    reason: lexical_alternative
  - marker: b
    text: Ou « ont tendu un piège sous toi ». Le mot hébreu traduit par « piège » est rare, et son sens précis est incertain.
    reason: lexical_alternative
  - marker: c
    text: Ou « il n’y a en lui aucune intelligence ». Le pronom peut désigner Édom ou celui qui est trahi; certains comprennent plutôt « il n’y a là aucun discernement », car le référent hébreu est ambigu.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד הַגְּבוּל
  choice: jusqu’à la frontière
  rationale: Rend naturellement la limite spatiale indiquée par l’hébreu, sans préciser à elle seule s’il s’agit d’une expulsion ou d’un accompagnement.
- source_word: שִׁלְּחוּךָ
  choice: t’ont renvoyé
  rationale: Le piel de שלח exprime ici l’idée de faire partir ou de renvoyer. « Renvoyé » conserve une certaine latitude entre congédiement et expulsion, tandis que le contexte suggère l’hostilité.
- source_word: אַנְשֵׁי בְרִיתֶךָ
  choice: tous ceux qui avaient fait alliance avec toi
  rationale: Préserve explicitement le vocabulaire de l’alliance ou du traité, tout en évitant le calque peu naturel « les hommes de ton alliance ».
- source_word: הִשִּׁיאוּךָ
  choice: t’ont trompé
  rationale: Exprime clairement le fait d’induire quelqu’un en erreur dans ce contexte de trahison politique.
- source_word: יָכְלוּ לְךָ
  choice: l’ont emporté sur toi
  rationale: Équivalent français idiomatique de l’expression signifiant prévaloir contre quelqu’un, sans imposer nécessairement l’image d’une domination physique.
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: ceux qui vivaient en paix avec toi
  rationale: Restitue la relation pacifique désignée littéralement par « les hommes de ta paix », sans la réduire à une simple amitié.
- source_word: לַחְמְךָ
  choice: ceux qui mangeaient ton pain
  rationale: La formulation explicite la relation de commensalité impliquée dans la proposition difficile, tout en gardant l’image concrète du pain et de la fidélité attendue entre compagnons de table.
- source_word: יָשִׂימוּ מָזוֹר תַּחְתֶּיךָ
  choice: ont placé un piège sous tes pas
  rationale: « Piège » convient au contexte de trahison, mais מָזוֹר est rare et son sens exact demeure incertain. « Sous tes pas » rend l’image en français naturel sans en supprimer la dimension spatiale.
- source_word: אֵין תְּבוּנָה בּוֹ
  choice: il n’y a en lui aucun discernement
  rationale: Conserve le pronom masculin singulier de l’hébreu et la formulation abrupte, sans identifier silencieusement son référent.
theological_decisions:
- issue: Référent de בּוֹ dans « il n’y a en lui aucun discernement »
  choice: 'Maintenir le masculin singulier indéterminé : « en lui »'
  alternative: « Tu n’as aucun discernement » ou « il n’y a là aucun discernement »
  rationale: Le suffixe hébreu est masculin singulier, mais son référent peut être Édom, le peuple interpellé ou, selon une compréhension plus libre, la situation ou le piège. La traduction ne tranche pas une ambiguïté que le texte ne résout pas explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images de l’alliance, du pain partagé et du piège, ainsi que l’ambiguïté finale. Les temps composés présentent les actes des alliés comme accomplis dans la scène prophétique.
