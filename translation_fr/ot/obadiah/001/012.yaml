    issue: La première interdiction est formulée de façon ambiguë et peu idiomatique.
    rationale: « Ne regarde pas avec satisfaction ton frère » peut suggérer une satisfaction à l’égard de ton frère, plutôt qu’une satisfaction malveillante devant son malheur. La construction « le jour du malheur de ton frère » permet de rattacher clairement l’attitude condamnée à la calamité.
  - severity: medium
    issue: « Du sort des fils de Juda » introduit un élément absent du texte source.
    rationale: Le syntagme « du sort » peut évoquer la destinée ou le lot, alors que l’hébreu interdit de se réjouir au sujet des fils de Juda au jour de leur ruine. « De la ruine des fils de Juda » est plus direct et fidèle.
