source:
  edition: WLC
  text: וְ/אַל תֵּ֤רֶא בְ/יוֹם אָחִ֨י/ךָ֙ בְּ/י֣וֹם נָכְר֔/וֹ וְ/אַל תִּשְׂמַ֥ח לִ/בְנֵֽי יְהוּדָ֖ה בְּ/י֣וֹם אָבְדָ֑/ם וְ/אַל תַּגְדֵּ֥ל פִּ֖י/ךָ בְּ/י֥וֹם צָרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/012.yaml
  text: Do not look on your brother in the day of his misfortune[a], and do not rejoice over the sons of Judah in the day of their destruction[c][b]; and do not make your mouth great in the day of distress.
translation:
  language: fr
  text: Ne regarde pas avec satisfaction le jour du malheur de ton frère[a][b] ; ne te réjouis pas de la ruine des fils de Juda au jour de leur ruine ; ne parle pas avec arrogance[c] au jour de la détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ne regarde pas ». Dans ce contexte, il s’agit de regarder avec une satisfaction malveillante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au jour de son éloignement » ou « au jour où il est devenu étranger ». Le terme hébreu peut évoquer l’étrangeté ou l’aliénation aussi bien que le malheur qui en résulte.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ne rends pas grande ta bouche », c’est-à-dire : ne parle pas avec vantardise ou arrogance.'
    reason: idiom_explanation
lexical_decisions:
- source_word: תֵּרֶא
  choice: regarde avec satisfaction
  rationale: Le verbe signifie littéralement « voir, regarder ». Dans ce contexte, son parallélisme avec l’interdiction de se réjouir et de parler avec arrogance lui donne une nuance malveillante, rendue explicitement sans employer une expression trop familière.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: La formulation littérale conserve le lien de parenté entre Édom et Juda ainsi que la force morale de la trahison fraternelle.
- source_word: נָכְרוֹ
  choice: son malheur
  rationale: Dans le contexte d’une catastrophe nationale, ce terme évoque l’adversité subie. Une note maintient toutefois la possibilité lexicale de l’éloignement ou du fait de devenir étranger.
- source_word: תִּשְׂמַח
  choice: te réjouis
  rationale: Équivalent courant et digne du verbe hébreu, adapté au registre prophétique.
- source_word: לִבְנֵי יְהוּדָה
  choice: des fils de Juda
  rationale: La désignation familiale et nationale de l’hébreu est conservée plutôt que remplacée par une expression générale comme « le peuple de Juda ».
- source_word: אָבְדָם
  choice: leur ruine
  rationale: Le terme désigne leur perte ou leur destruction ; « ruine » convient à la catastrophe nationale et s’intègre naturellement en français.
- source_word: תַּגְדֵּל פִּיךָ
  choice: parle avec arrogance
  rationale: L’expression hébraïque signifie littéralement « rendre grande ta bouche » et désigne une parole arrogante ou vantarde. Le sens idiomatique est donné dans le texte, et l’image originale est conservée en note.
- source_word: צָרָה
  choice: détresse
  rationale: Ce terme rend l’adversité profonde exprimée par צָרָה et maintient le ton solennel du passage.
theological_decisions:
- issue: Le langage fraternel appliqué à Édom et à Juda
  choice: ton frère
  alternative: ton parent
  rationale: « Frère » préserve l’allusion aux peuples issus d’Ésaü et de Jacob et renforce l’accusation portée contre Édom, sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de « au jour de » et le langage familial sont conservés. Les expressions hébraïques obscures sont rendues idiomatiquement dans le texte tout en restant visibles dans les notes.
