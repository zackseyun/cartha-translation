- from: Ne regarde pas avec satisfaction ton frère au jour de son malheur[a][b] ; ne te réjouis pas du sort des fils de Juda au jour de leur ruine ; ne parle pas avec arrogance[c] au jour de la détresse.
  to: Ne regarde pas avec satisfaction le jour du malheur de ton frère[a][b] ; ne te réjouis pas de la ruine des fils de Juda au jour de leur ruine ; ne parle pas avec arrogance[c] au jour de la détresse.
  rationale: La première clause est restructurée pour une syntaxe française claire et pour rattacher sans ambiguïté la satisfaction malveillante au malheur du frère. La deuxième supprime l’ajout interprétatif « sort » et exprime directement l’objet de la réjouissance interdite. Les notes existantes sont maintenues, car elles rendent compte des alternatives lexicales et de l’idiome hébreu.
