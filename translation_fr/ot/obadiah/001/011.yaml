  text: בְּ/יוֹם֙ עֲמָֽדְ/ךָ֣ מִ/נֶּ֔גֶד בְּ/י֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑/וֹ וְ/נָכְרִ֞ים בָּ֣אוּ שער/ו וְ/עַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּ/אַחַ֥ד מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/011.yaml
  text: On the day when you stood aloof[a], on the day strangers carried off his wealth, and foreigners entered his gates and cast lots over Jerusalem[c][b], you too were like one of them.
translation:
  language: fr
  text: Le jour où tu es resté à l’écart[a], le jour où des étrangers ont emporté ses richesses[b], où des gens venus d’ailleurs ont franchi sa porte[c] et jeté le sort sur Jérusalem, toi aussi, tu étais comme l’un d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu te tenais à distance ». L’expression hébraïque évoque littéralement le fait de se tenir en face ou à distance.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses forces » ou « son armée ». Le mot hébreu peut désigner la force militaire, la puissance ou les ressources et richesses.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « sa porte »; il s’agit probablement de celle de Jérusalem ou de Juda, envisagés comme une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָדְךָ מִנֶּגֶד
  choice: tu es resté à l’écart
  rationale: L’expression associe « se tenir » à l’idée d’être en face ou à distance. En contexte, « rester à l’écart » exprime naturellement la non-intervention coupable tout en conservant l’image de la distance.
- source_word: שְׁבוֹת
  choice: ont emporté
  rationale: Le verbe désigne normalement l’action de capturer ou d’emmener. Comme son objet est ici חֵילוֹ, « ont emporté » convient au pillage de ressources sans suggérer que l’objet est nécessairement une personne.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le terme désigne des personnes étrangères au peuple. « Étrangers » est direct et courant; la variation avec נָכְרִים est rendue par une autre expression.
- source_word: חֵילוֹ
  choice: ses richesses
  rationale: חֵיל peut désigner la force, l’armée ou les ressources et richesses. Dans cette scène d’invasion et de pillage, « richesses » est vraisemblable, mais les autres sens sont signalés en note.
- source_word: נָכְרִים
  choice: des gens venus d’ailleurs
  rationale: Cette formulation naturelle désigne des étrangers et maintient en français la variation lexicale avec זָרִים.
- source_word: בָּאוּ שַׁעֲרוֹ
  choice: ont franchi sa porte
  rationale: Le texte massorétique porte littéralement le singulier « sa porte ». « Franchir sa porte » est idiomatique en français et conserve la personnification au singulier.
- source_word: יַדּוּ גוֹרָל
  choice: tiré au sort
  rationale: « Tirer au sort » est l’équivalent français usuel de l’expression hébraïque, ici probablement à propos du partage ou de l’attribution de Jérusalem.
- source_word: גַּם אַתָּה
  choice: toi aussi
  rationale: L’expression inclut explicitement Édom dans la culpabilité des envahisseurs.
- source_word: כְּאַחַד מֵהֶם
  choice: tu étais comme l’un d’eux
  rationale: Cette formulation préserve la comparaison du texte sans transformer celle-ci en identité absolue.
theological_decisions:
- issue: Portée de la position d’Édom dans עמד מנגד
  choice: « tu es resté à l’écart », avec une portée morale suggérée par le contexte
  alternative: 'Une simple indication spatiale : « tu te tenais à distance » ou « en face »'
  rationale: La conclusion « toi aussi, tu étais comme l’un d’eux » présente cette attitude comme coupable. La traduction laisse entendre la non-intervention sans expliciter davantage que le texte.
- issue: Référent des suffixes masculins dans חֵילוֹ et שַׁעֲרוֹ
  choice: Conserver « ses » et « sa », en laissant la personnification implicite
  alternative: Expliciter « les richesses de Jérusalem » et « les portes de Jérusalem »
  rationale: Le texte hébreu emploie des suffixes masculins singuliers, tandis que Jérusalem est nommée ensuite. Les conserver respecte la forme et une certaine ambiguïté référentielle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « le jour où » et la progression accusatrice sont conservées. Le singulier « sa porte » suit le texte massorétique plutôt qu’une harmonisation au pluriel.
