id: EZR.9.12
reference: Ezra 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: fr
  text: Maintenant donc, ne donnez pas vos filles à leurs fils et ne prenez pas leurs filles pour vos fils. Ne recherchez jamais leur paix ni leur bien-être[a], afin que vous deveniez forts, que vous mangiez ce que le pays a de bon et que vous le transmettiez en héritage à vos fils pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne recherchez pas leur paix ni leur bien pour toujours ».'
    reason: La note signale la formulation temporelle et lexicale plus littérale derrière le français idiomatique « jamais » et « bien-être ».
  - marker: b
    text: 'Ou : « que vous en fassiez hériter vos fils pour toujours ».'
    reason: Le hiphil de ירש peut être rendu plus formellement par une construction causative; l’objet implicite peut se comprendre comme le pays.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: La conjonction et l’adverbe introduisent la conséquence pratique de ce qui précède. « Maintenant donc » rend naturellement cette articulation en français.
- source_word: בְּנוֹתֵיכֶם אַל תִּתְּנוּ לִבְנֵיהֶם
  choice: ne donnez pas vos filles à leurs fils
  rationale: La formulation française conserve la structure concrète de l’hébreu. Dans le parallélisme avec la proposition suivante, le contexte matrimonial est clair sans qu’il soit nécessaire d’ajouter « en mariage ».
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: ne prenez pas leurs filles pour vos fils
  rationale: נשא désigne ici le fait de prendre une femme en mariage. Cette formulation garde le parallélisme de la phrase hébraïque et rend explicitement le complément « pour vos fils ».
- source_word: תִדְרְשׁוּ
  choice: recherchez
  rationale: דרש exprime une recherche active ou le souci de procurer quelque chose. « Rechercher » en conserve la force sans préciser davantage le type d’action.
- source_word: שְׁלֹמָם
  choice: leur paix
  rationale: שָׁלוֹם peut désigner la paix, le bien-être ou la prospérité. « Paix » est l’équivalent direct et maintient la distinction avec le nom suivant.
- source_word: וְטוֹבָתָם
  choice: ni leur bien-être
  rationale: טוֹבָה désigne ici ce qui est bon ou avantageux pour eux. « Bien-être » est naturel en français et couvre le bénéfice matériel et social sans le réduire à la seule richesse.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: Dans cette interdiction, l’expression temporelle signifie littéralement « pour toujours » et donne à la défense une portée permanente. « Jamais » en rend idiomatiquement la force en français.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: afin que vous deveniez forts
  rationale: לְמַעַן introduit le but ou le résultat, tandis que חזק au qal peut exprimer le fait de devenir fort. La traduction préserve ces deux nuances.
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: que vous mangiez ce que le pays a de bon
  rationale: La traduction conserve l’image concrète du verbe « manger » et rend naturellement l’expression « le bon du pays », qui désigne ses bons produits ou ses richesses.
- source_word: וְהוֹרַשְׁתֶּם לִבְנֵיכֶם
  choice: que vous le transmettiez en héritage à vos fils
  rationale: 'Le hiphil de ירש a ici une valeur causative : faire posséder ou faire hériter. Le pronom « le » reprend naturellement « le pays », implicite comme objet de l’héritage.'
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: À la fin du verset, l’expression souligne la durée de la possession transmise aux générations suivantes. « Pour toujours » en est l’équivalent direct et naturel.
theological_decisions:
- issue: Portée de l’interdiction des mariages et de la recherche du bien des peuples environnants
  choice: Rendre directement l’interdiction dans son cadre historique et communautaire, sans en atténuer la sévérité.
  alternative: Transformer le texte en avertissement général contre les alliances spirituellement nuisibles, ou l’élargir en règle intemporelle visant toute relation avec des personnes extérieures au groupe.
  rationale: Le verset formule, dans le contexte postexilique d’Esdras, une exigence liée à la fidélité de la communauté à l’alliance. La traduction doit préserver les termes du texte sans leur ajouter une application doctrinale universelle ni les adoucir.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme des deux interdictions matrimoniales et l’image concrète de « manger » les bonnes choses du pays, tout en évitant les formulations archaïques.
