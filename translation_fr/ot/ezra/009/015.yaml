revisions:
- from: Yahweh, Dieu d’Israël, tu es juste[a], car nous subsistons comme un reste de rescapés[b], ainsi qu’on le voit aujourd’hui. Nous voici devant toi, chargés de notre culpabilité, car nul ne peut subsister devant toi à cause de cela[c].
  to: Yahweh, Dieu d’Israël, tu es juste, car nous avons été laissés, un reste de rescapés, comme on le voit aujourd’hui. Nous voici devant toi dans notre culpabilité, car nul ne peut se tenir devant toi à cause de cela[a].
  rationale: La révision rétablit la nuance passive du verbe hébreu et améliore la fluidité de l’expression désignant le reste de survivants. Elle rend עמד par « se tenir devant toi », formulation proche de l’hébreu et naturelle en français; la note explicite sa portée contextuelle sans restreindre indûment le référent de « cela ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:49:04Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « nous subsistons » atténue la nuance passive de נִשְׁאַרְנוּ (« nous avons été laissés / sommes restés »). Le reste du verset rend fidèlement l’adresse, la confession de culpabilité, la causalité des deux כִּי et l’énoncé impersonnel final.
  naturalness: Le français est globalement digne et accessible. « Un reste de rescapés » est toutefois pesant et « subsister devant toi » est moins direct que l’expression française naturelle « se tenir devant toi », qui correspond de près à l’hébreu et peut être éclairée en note.
  terminology: « Yahweh », « Dieu d’Israël », « juste » et « culpabilité » sont appropriés. La note proposant « droit » n’est pas une alternative française aussi naturelle dans cette adresse et n’est pas nécessaire.
  issues:
  - severity: medium
    issue: La voix passive de נִשְׁאַרְנוּ n’est pas conservée dans « nous subsistons ».
    rationale: Le nifal présente le peuple comme ceux qui ont été laissés après le jugement. « Nous avons été laissés » préserve cette nuance sans imposer une explication théologique.
  - severity: low
    issue: « Un reste de rescapés » est redondant en français courant.
    rationale: L’hébreu associe le fait de rester et le substantif collectif pour des survivants; une apposition permet de conserver les deux éléments avec plus de fluidité.
  - severity: low
    issue: La note a (« droit ») est une alternative peu idiomatique et superflue.
    rationale: « Tu es juste » rend adéquatement צַדִּיק dans ce contexte; la suppression de cette note allège l’appareil sans perte de sens.
