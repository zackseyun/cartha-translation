source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: fr
  text: Yahweh, Dieu d’Israël, tu es juste, car nous avons été laissés, un reste de rescapés, comme on le voit aujourd’hui. Nous voici devant toi dans notre culpabilité, car nul ne peut se tenir devant toi à cause de cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y a pas de se tenir devant toi à cause de cela » ; l’expression évoque l’impossibilité de demeurer devant Dieu sous le coup de la culpabilité confessée.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin exprimé directement dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Rend directement et naturellement la construction hébraïque.
- source_word: צַדִּיק
  choice: juste
  rationale: « Juste » exprime en français actuel la rectitude morale et judiciaire attribuée à Dieu, sans réduire ici le terme à la seule justice punitive.
- source_word: כִּי
  choice: car
  rationale: Dans ses deux occurrences, la conjonction introduit une explication ou un motif et maintient le mouvement causal de la confession.
- source_word: נִשְׁאַרְנוּ פְלֵיטָה
  choice: nous subsistons comme un reste de rescapés
  rationale: Cette formulation française naturelle conserve à la fois l’idée de ceux qui restent après le jugement et celle de personnes qui y ont échappé. Le nifal peut plus littéralement se rendre par « nous avons été laissés ».
- source_word: כְּהַיּוֹם הַזֶּה
  choice: ainsi qu’on le voit aujourd’hui
  rationale: Rend idiomatiquement la formule temporelle hébraïque, qui désigne la situation présente et observable.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: Nous voici devant toi
  rationale: Reproduit la force présentative et immédiate de הִנְנוּ dans un français naturel.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: chargés de notre culpabilité
  rationale: Exprime l’état de culpabilité dans lequel le peuple se présente devant Dieu, sans confondre cette culpabilité avec le seul sentiment subjectif de se sentir coupable.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ
  choice: car nul ne peut subsister devant toi
  rationale: La tournure existentielle impersonnelle est rendue par « nul » plutôt que par un sujet explicite « nous »; « subsister » conserve l’idée de ne pouvoir se maintenir ou supporter la présence et le jugement de Dieu.
- source_word: עַל זֹאת
  choice: à cause de cela
  rationale: Conserve la valeur causale de la préposition et le démonstratif, qui renvoie à la culpabilité confessée, sans préciser davantage que le texte.
theological_decisions:
- issue: Le sens de la justice de Dieu dans ce contexte
  choice: tu es juste
  alternative: tu es droit
  rationale: Le texte affirme la rectitude de Dieu au milieu du jugement et de la survie d’un reste, sans expliquer systématiquement le rapport entre justice et miséricorde.
- issue: La tension entre se trouver devant Dieu et ne pouvoir subsister devant lui
  choice: Nous voici devant toi… car nul ne peut subsister devant toi
  alternative: Nous voici devant toi… bien que nous ne puissions tenir devant toi
  rationale: Le choix maintient la tension du texte et la valeur explicative de כִּי, sans transformer la dernière proposition en simple concession ni éliminer l’énoncé impersonnel.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse directe à Dieu. « Reste de rescapés » garde les deux dimensions du terme hébreu, tandis que « subsister » relie naturellement la survie présente à l’impossibilité finale de se maintenir devant Dieu.
