id: EZR.9.10
reference: Ezra 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: fr
  text: Et maintenant, que pouvons-nous dire[a], notre Dieu, après cela ? Car nous avons abandonné tes commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que dirons-nous ». L’inaccompli hébreu peut aussi se traduire par cette formulation plus formelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Rend à la fois la conjonction ו et l’adverbe temporel עַתָּה, sans préciser davantage que l’hébreu le rapport logique avec ce qui précède.
- source_word: מַה נֹּאמַר
  choice: que pouvons-nous dire
  rationale: Dans cette prière de confession, l’imparfait à la première personne du pluriel a une valeur délibérative et rhétorique. Cette formulation française exprime naturellement le désarroi d’Esdras, tandis que la note conserve la traduction plus formelle.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le suffixe possessif est rendu directement. La ponctuation marque l’apostrophe sans ajouter une interjection absente de l’hébreu.
- source_word: אַחֲרֵי זֹאת
  choice: après cela
  rationale: Expression temporelle idiomatique qui renvoie à la faute et à la crise évoquées auparavant.
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’impossibilité rhétorique de répondre et conserve explicitement le lien explicatif.
- source_word: עָזַבְנוּ
  choice: nous avons abandonné
  rationale: עָזַב exprime ici le fait de délaisser les obligations de l’alliance. « Abandonné » garde la gravité morale du terme dans un français actuel.
- source_word: מִצְוֺתֶיךָ
  choice: tes commandements
  rationale: Rend le terme courant désignant les prescriptions divines et préserve son poids formel et théologique.
theological_decisions:
- issue: Le ton de la confession d’Esdras
  choice: Une confession rhétorique de culpabilité et de désarroi devant Dieu
  alternative: Une simple demande visant à savoir quoi dire ensuite
  rationale: La proposition explicative « Car nous avons abandonné tes commandements » montre qu’il ne s’agit pas d’une délibération neutre. La traduction laisse entendre le désarroi pénitentiel sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu et s’accorde avec « notre Dieu ». La formulation évite à la fois l’archaïsme et l’explicitation théologique excessive.
