  text: וּ/בְ/מִנְחַ֣ת הָ/עֶ֗רֶב קַ֚מְתִּי מִ/תַּֽעֲנִיתִ֔/י וּ/בְ/קָרְעִ֥/י בִגְדִ֖/י וּ/מְעִילִ֑/י וָֽ/אֶכְרְעָ/ה֙ עַל בִּרְכַּ֔/י וָ/אֶפְרְשָׂ֥/ה כַפַּ֖/י אֶל יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: fr
  text: Au moment de l’offrande du soir[a], je me suis relevé de mon jeûne[b], mon vêtement et mon manteau déchirés. Je suis tombé à genoux et j’ai tendu les mains vers Yahvé, mon Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément : « de l’offrande de céréales du soir ». Le terme hébreu désigne souvent une offrande de céréales, mais il peut ici évoquer plus largement le moment du sacrifice du soir.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi évoquer l’humiliation volontaire associée au jeûne.
    reason: lexical_nuance
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: À l’heure de l’offrande du soir
  rationale: מִנְחָה peut désigner un don ou, dans le culte, une offrande de céréales. Avec « du soir », l’expression renvoie ici au moment de l’offrande régulière du soir. La formulation française indique à la fois le rite et le repère temporel.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: je me suis relevé après avoir jeûné
  rationale: קום signifie se lever ou se relever. תַּעֲנִית désigne généralement le jeûne, avec une nuance d’humiliation volontaire. Cette formulation naturelle restitue l’action concrète sans supprimer la nuance signalée en note.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: les vêtements et le manteau déchirés
  rationale: La construction en ב exprime une circonstance concomitante. « Vêtements » et « manteau » maintiennent la distinction entre בֶּגֶד et מְעִיל et présentent leur état comme signe de deuil.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: Je suis tombé à genoux
  rationale: כרע exprime l’action de se courber ou de s’agenouiller. « Tomber à genoux » est idiomatique en français et convient à l’intensité de la scène.
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: j’ai tendu les mains
  rationale: פרשׂ avec כף décrit le geste de prière consistant à ouvrir et étendre les mains. « Tendre les mains » est naturel en français moderne tout en conservant l’image corporelle.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: vers Yahvé, mon Dieu
  rationale: La préposition אֶל marque ici l’orientation du geste et de la prière. « Vers » convient aux mains tendues. « Yahvé » rend explicitement le nom divin יהוה sous sa forme française usuelle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération française « Yahvé » conserve le caractère de nom propre au lieu de le remplacer par un titre.
- issue: Sens de תַּעֲנִיתִי
  choice: après avoir jeûné
  alternative: après m’être humilié
  rationale: Le nom désigne concrètement le jeûne tout en pouvant évoquer l’humiliation volontaire. Le texte principal retient la pratique la plus probable et la note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé soutient une narration naturelle. La répétition de « je » garde la succession solennelle des gestes, tandis que les notes préservent les nuances cultuelle et pénitentielle de l’hébreu.
