  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: fr
  text: 'Car nous sommes esclaves. Pourtant, dans notre esclavage, notre Dieu ne nous a pas abandonnés : il a étendu sur nous sa bonté fidèle[a] devant les rois de Perse, afin de nous redonner vie, de relever la maison de notre Dieu, d’en restaurer les ruines et de nous donner un mur[b] en Juda et à Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son amour fidèle », « sa bienveillance » ou « sa faveur ». Le mot hébreu חֶסֶד évoque une bonté loyale et durable.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner une « clôture » ou une « haie ». L’image peut évoquer plus largement la sécurité et la protection accordées en Juda et à Jérusalem, sans se limiter nécessairement à une construction littérale.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: esclaves / dans notre esclavage
  rationale: Le nom et son dérivé désignent ici la condition de sujétion du peuple sous la domination impériale. La répétition française conserve leur lien lexical et la force du constat.
- source_word: עֲזָבָנוּ
  choice: ne nous a pas abandonnés
  rationale: « Abandonner » rend naturellement le verbe עזב dans cette prière et conserve sa portée relationnelle.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: il a étendu sur nous sa bonté fidèle
  rationale: « Étendre sur » préserve l’image de נטה, tandis que « bonté fidèle » exprime à la fois la faveur bienveillante et la loyauté durable de חֶסֶד sans surdéterminer le terme.
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: devant les rois de Perse
  rationale: La formulation garde le sens relationnel ou présentiel de לִפְנֵי et demeure idiomatique en français.
- source_word: מִחְיָה
  choice: nous redonner vie
  rationale: Dans le contexte postexilique, le nom évoque à la fois la préservation et le renouveau de la vie communautaire. La tournure verbale s’intègre naturellement à la série des infinitifs.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: relever la maison de notre Dieu
  rationale: « Relever » conserve l’image de l’élévation portée par רום tout en évoquant clairement le rétablissement du temple.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: d’en restaurer les ruines
  rationale: Le causatif de עמד signifie faire tenir ou remettre debout. Avec « ruines », « restaurer » exprime en français naturel le résultat visé sans reproduire une association maladroite.
- source_word: גָדֵר
  choice: une enceinte protectrice
  rationale: Le terme peut désigner un mur, une clôture ou une haie. Ici, l’expression souligne vraisemblablement la protection accordée en Juda et à Jérusalem sans imposer l’idée d’une muraille urbaine littérale.
theological_decisions:
- issue: Portée de חֶסֶד
  choice: bonté fidèle
  alternative: amour fidèle ; bienveillance ; faveur
  rationale: Cette expression garde ensemble la grâce bienveillante et la fidélité relationnelle du terme hébreu. Une note maintient ses autres nuances possibles.
- issue: Image de גָדֵר
  choice: enceinte protectrice
  alternative: mur ; clôture ; haie
  rationale: Le contexte peut viser plus largement la sécurité procurée sous l’autorité perse, et non seulement une construction matérielle. Le choix conserve l’image d’une limite protectrice, tandis que la note signale les rendus plus concrets.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le mouvement de la prière hébraïque et sa série de buts, tout en évitant des calques peu naturels. « Maison de notre Dieu » maintient l’expression biblique transparente pour le temple.
