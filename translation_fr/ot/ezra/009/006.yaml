  text: וָ/אֹמְרָ֗/ה אֱלֹהַ/י֙ בֹּ֣שְׁתִּי וְ/נִכְלַ֔מְתִּי לְ/הָרִ֧ים אֱלֹהַ֛/י פָּנַ֖/י אֵלֶ֑י/ךָ כִּ֣י עֲוֺנֹתֵ֤י/נוּ רָבוּ֙ לְ/מַ֣עְלָ/ה רֹּ֔אשׁ וְ/אַשְׁמָתֵ֥/נוּ גָדְלָ֖ה עַ֥ד לַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: fr
  text: 'Et j’ai dit : « Mon Dieu, j’ai honte et je suis humilié de lever mon visage vers toi, mon Dieu, car nos fautes se sont multipliées au-dessus de nos têtes[a], et notre culpabilité a grandi jusqu’aux cieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au-dessus de la tête » ; l’hébreu emploie ici « tête » au singulier dans une expression collective.'
    reason: Précision sur l’idiome hébreu et sur le passage nécessaire au pluriel en français.
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Et j’ai dit
  rationale: Rend la continuation narrative marquée par le waw et la forme verbale à la première personne, sans surinterpréter la nuance de succession.
- source_word: בֹּשְׁתִּי וְנִכְלַמְתִּי
  choice: j’ai honte et je suis confus
  rationale: Les deux expressions proches sont maintenues afin de préserver l’intensification de la honte. Le présent français exprime naturellement l’état d’Esdras au moment de sa prière.
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: lever mon visage vers toi
  rationale: Conserve l’image explicite du visage et le mouvement vers Dieu, plutôt que de remplacer « visage » par « yeux ».
- source_word: עֲוֺנֹתֵינוּ
  choice: nos fautes
  rationale: « Fautes » exprime clairement les actes moralement répréhensibles en français actuel, tout en restant distinct de la culpabilité désignée ensuite par אַשְׁמָה.
- source_word: רָבוּ
  choice: se sont multipliées
  rationale: Reproduit l’idée dynamique d’un accroissement, et non celle d’une simple quantité statique.
- source_word: לְמַעְלָה רֹאשׁ
  choice: au-dessus de nos têtes
  rationale: Préserve l’image verticale de fautes qui dépassent ceux qui les ont commises, tout en employant en français le pluriel naturel avec « nos ».
- source_word: אַשְׁמָתֵנוּ
  choice: notre culpabilité
  rationale: Dans ce contexte, le terme désigne l’état de culpabilité ou la responsabilité pour la faute, non une offrande sacrificielle.
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: a grandi jusqu’aux cieux
  rationale: Conserve l’hyperbole verticale et le verbe d’accroissement du texte hébreu, ainsi que l’image traditionnelle des « cieux ».
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: La répétition de l’adresse personnelle est conservée aux deux endroits pour respecter l’insistance du texte.
theological_decisions:
- issue: Relation entre les fautes collectives et la confession personnelle d’Esdras
  choice: Conserver « nos fautes » et « notre culpabilité »
  alternative: Employer « leurs fautes » ou préciser qu’Esdras ne se compte pas parmi les coupables
  rationale: Le texte hébreu emploie explicitement la première personne du pluriel. La traduction préserve cette solidarité confessionnelle sans décider de la part personnelle d’Esdras dans les actes évoqués.
translation_notes:
  register: Français international actuel, digne et accessible. La structure répétitive de la prière et ses images verticales sont conservées. « Confus » est retenu dans son sens de profondément honteux, malgré une légère coloration soutenue, afin de distinguer les deux verbes hébreux.
