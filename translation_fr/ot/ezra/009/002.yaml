  text: כִּֽי נָשְׂא֣וּ מִ/בְּנֹֽתֵי/הֶ֗ם לָ/הֶם֙ וְ/לִ/בְנֵי/הֶ֔ם וְ/הִתְעָֽרְבוּ֙ זֶ֣רַע הַ/קֹּ֔דֶשׁ בְּ/עַמֵּ֖י הָ/אֲרָצ֑וֹת וְ/יַ֧ד הַ/שָּׂרִ֣ים וְ/הַ/סְּגָנִ֗ים הָֽיְתָ֛ה בַּ/מַּ֥עַל הַ/זֶּ֖ה רִאשׁוֹנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: fr
  text: Car ils ont pris certaines de leurs filles pour eux-mêmes et pour leurs fils[a], et la descendance sainte[b] s’est mêlée aux peuples des pays. Les chefs et les gouverneurs ont été les premiers responsables de cette infidélité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont épousé certaines de leurs filles ». Littéralement : « ont pris parmi leurs filles ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la semence sainte »; on pourrait aussi traduire : « la lignée sainte ». L’expression hébraïque désigne ici la descendance de la communauté consacrée.'
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « la main des chefs et des gouverneurs a été la première ». Cette expression peut signifier qu’ils ont été les premiers à commettre cette infidélité ou qu’ils en ont été les principaux responsables.
    reason: ambiguity
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: ont pris […] certaines de leurs filles
  rationale: « Prendre » suit de près le verbe hébreu, tandis que « certaines de » exprime naturellement la valeur partitive de מִן. Dans ce contexte, il s’agit de prendre ces femmes pour épouses.
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: pour eux-mêmes et pour leurs fils
  rationale: 'Cette formulation rend clairement les bénéficiaires indiqués par le lamed : les hommes concernés et leurs fils.'
- source_word: וְהִתְעָרְבוּ
  choice: s’est mêlée
  rationale: Le hitpael exprime ici le mélange ou l’entremêlement. L’accord au singulier respecte le sujet collectif זֶרַע.
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: la descendance sainte
  rationale: « Descendance » conserve la portée généalogique et collective de זֶרַע tout en étant plus naturel en français actuel que « semence » dans ce contexte.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: aux peuples des pays
  rationale: Avec « se mêler », la préposition « à » est idiomatique en français. Le pluriel « des pays » conserve celui de l’hébreu.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: les chefs et les gouverneurs
  rationale: Ces termes désignent deux catégories de responsables politiques ou administratifs. « Chefs » et « gouverneurs » restent dignes et compréhensibles sans imposer un cadre monarchique.
- source_word: מַעַל
  choice: infidélité
  rationale: Le terme désigne une rupture de fidélité, souvent avec une portée communautaire ou liée à l’alliance, plutôt qu’une simple faute générique.
- source_word: וְיַד … רִאשׁוֹנָה
  choice: La main […] a été la première
  rationale: Cette traduction préserve l’image hébraïque de la « main » comme expression de l’action et de la responsabilité, ainsi que l’ambiguïté de רִאשׁוֹנָה entre antériorité et rôle prépondérant.
theological_decisions:
- issue: Sens de « la descendance sainte » dans le contexte des mariages avec les peuples voisins
  choice: Conserver l’expression collective et liée à la sainteté sans l’expliciter en théorie ethnique ou raciale.
  alternative: « la lignée sainte » ou une paraphrase centrée sur la pureté ethnique
  rationale: L’hébreu emploie un langage fort de descendance et de consécration communautaire. La traduction doit le préserver sans lui ajouter des catégories raciales étrangères au texte.
- issue: Responsabilité des dirigeants
  choice: 'Préserver l’idiome : « La main des chefs et des gouverneurs a été la première ».'
  alternative: « les chefs et les gouverneurs ont été les principaux responsables »
  rationale: La formulation retenue garde la métaphore et l’éventuelle nuance chronologique de l’hébreu; la note indique le sens probable de rôle moteur ou de responsabilité majeure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu là où l’image demeure intelligible. « Descendance sainte » évite l’étrangeté de « semence sainte » dans le corps du texte, tout en conservant en note la métaphore littérale. L’idiome de la main est maintenu afin de ne pas effacer l’ambiguïté de רִאשׁוֹנָה.
