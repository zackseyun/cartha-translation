base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: fr
  text: Lorsque j’entendis cette nouvelle[a], je déchirai mon vêtement et mon manteau, je m’arrachai des cheveux et des poils de ma barbe[b], puis je m’assis, consterné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lorsque j’entendis cette affaire, je déchirai mon vêtement et mon manteau […] et je m’assis, frappé de stupeur. »'
    reason: Alternative lexicale pour « nouvelle » (דָּבָר, qui peut aussi désigner une affaire ou une chose) et « consterné » (מְשׁוֹמֵם, état de stupeur ou d'accablement).
  - marker: b
    text: Déchirer ses vêtements et s’arracher des cheveux ou des poils de la barbe étaient des gestes exprimant le deuil, l’horreur ou une profonde détresse.
    reason: Note culturelle expliquant la portée conventionnelle de ces gestes.
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: Dès que j’entendis parler de
  rationale: La construction temporelle introduit la réaction immédiate d’Esdras. « Dès que » rend cette immédiateté, tandis que « entendre parler de » est naturel en français avec « cette affaire ».
- source_word: הַדָּבָר הַזֶּה
  choice: cette affaire
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire. Ici, le terme renvoie à la situation qui vient d’être rapportée, sans se limiter au seul contenu verbal du rapport.
- source_word: קָרַעְתִּי
  choice: je déchirai
  rationale: Le verbe désigne ici l’action conventionnelle de déchirer ses vêtements sous l’effet du deuil ou de l’horreur. « Déchirer » est précis et digne.
- source_word: בִּגְדִי
  choice: mon vêtement
  rationale: בֶּגֶד est un terme général désignant un vêtement. Le singulier hébreu est conservé et distingué du manteau qui suit.
- source_word: וּמְעִילִי
  choice: mon manteau
  rationale: מְעִיל désigne couramment un vêtement de dessus. « Manteau » est clair en français moderne et maintient la distinction avec בֶּגֶד.
- source_word: וָאֶמְרְטָה
  choice: je m’arrachai
  rationale: Le verbe exprime l’action d’arracher des poils ou des cheveux. La tournure pronominale est idiomatique en français et restitue la violence du geste.
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: des cheveux et des poils de la barbe
  rationale: 'La préposition מִן a ici une valeur partitive : Esdras arrache une partie de sa chevelure et de sa barbe, non leur totalité. « Des » rend naturellement cette nuance.'
- source_word: וָאֵשְׁבָה
  choice: puis je m’assis
  rationale: Le verbe courant signifie « s’asseoir ». « Puis » exprime naturellement en français la dernière étape de la succession d’actions sans ajouter de contenu interprétatif important.
- source_word: מְשׁוֹמֵם
  choice: consterné
  rationale: Le participe décrit un état de stupeur dévastée. « Consterné » unit le choc, l’accablement et l’horreur morale mieux que le plus neutre « étonné ».
