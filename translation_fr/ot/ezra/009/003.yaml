revisions:
- from: Dès que j’entendis parler de cette affaire[a], je déchirai mon vêtement et mon manteau, je m’arrachai des cheveux et des poils de la barbe[b], puis je m’assis, consterné.
  to: Lorsque j’entendis cette nouvelle[a], je déchirai mon vêtement et mon manteau, je m’arrachai des cheveux et des poils de ma barbe[b], puis je m’assis, consterné.
  rationale: La révision supprime l'ajout interprétatif « parler de » et évite de renforcer sans nécessité la relation temporelle par « dès que ». Elle maintient le sens contextuel de l'information entendue par « cette nouvelle », la succession des actions et le registre narratif moderne soutenu. Les notes sont ajustées pour correspondre au texte révisé et à leurs ancres.
