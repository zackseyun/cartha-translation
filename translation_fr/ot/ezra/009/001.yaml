source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: fr
  text: 'Une fois tout cela terminé, les responsables sont venus me trouver et m’ont dit : « Le peuple d’Israël, les prêtres et les lévites ne se sont pas séparés des peuples des pays, se conformant à leurs pratiques abominables[a] : celles des Cananéens, des Hittites, des Perizzites, des Jébusites, des Ammonites, des Moabites, des Égyptiens et des Amorites. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon leurs abominations ». L’expression indique que le manque de séparation s’accompagne de la conformité aux pratiques abominables des peuples énumérés.'
    reason: Rend la valeur de la préposition hébraïque כ et explique le lien syntaxique avec « ne se sont pas séparés » sans créer une seconde séparation absente du texte.
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: Une fois tout cela terminé
  rationale: La conjonction, la préposition temporelle et l’infinitif construit forment une proposition temporelle. Cette formulation française exprime naturellement l’antériorité accomplie sans ajouter un marqueur comme « Or » ou « Maintenant ».
- source_word: נִגְּשׁוּ אֵלַי
  choice: sont venus me trouver
  rationale: Le niphal de נגשׁ indique un mouvement vers Esdras. Cette expression courante conserve l’idée d’approche personnelle dans un récit en français moderne.
- source_word: הַשָּׂרִים
  choice: les responsables
  rationale: שׂרים désigne ici des dirigeants ou titulaires d’une fonction. « Responsables » convient au contexte administratif sans suggérer nécessairement des princes héréditaires.
- source_word: לֹא נִבְדְּלוּ
  choice: ne se sont séparés ni… ni…
  rationale: Le niphal de בדל a ici une valeur séparative, possiblement réfléchie. La formulation conserve l’accusation selon laquelle les groupes nommés ne se sont pas tenus distincts.
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: Le peuple d’Israël, les prêtres et les lévites
  rationale: Les trois groupes coordonnés restent soumis au même verbe, sans restreindre l’accusation aux seuls laïcs.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: des peuples des pays
  rationale: Le double pluriel de l’hébreu est maintenu. « Pays » exprime ici les territoires et populations de la région sans ajouter « environnants », absent du texte.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: ni de leurs pratiques abominables[a]
  rationale: תועבות porte une forte connotation morale et cultuelle. « Pratiques abominables » est naturel en français et explicite que le terme vise des actes ou usages; la note signale que la préposition כ peut aussi exprimer la conformité plutôt qu’une simple association.
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: à savoir celles des Cananéens… et des Amorites
  rationale: Les gentilés singuliers collectifs sont rendus par des noms de peuples au pluriel, conformément à l’usage français. « Celles » rattache la liste aux pratiques tout en gardant les peuples explicitement nommés.
theological_decisions:
- issue: Force morale et cultuelle de תועבות
  choice: pratiques abominables
  alternative: pratiques détestables
  rationale: « Abominables » préserve la sévérité du terme hébreu et sa fréquente portée religieuse, tandis que « pratiques » évite que le français comprenne seulement des objets abstraits.
- issue: Relation syntaxique de כְּתוֹעֲבֹתֵיהֶם avec la séparation d’avec les peuples
  choice: ne se sont séparés ni des peuples… ni de leurs pratiques abominables
  alternative: se conforment aux pratiques abominables de ces peuples
  rationale: L’hébreu est concis et la préposition כ peut évoquer la conformité. Le texte principal conserve l’association étroite entre les peuples et leurs pratiques sans ajouter un verbe explicite comme « suivre »; la note préserve l’autre nuance possible.
- issue: Étendue de l’accusation
  choice: le peuple d’Israël, les prêtres et les lévites sont tous régis par la même négation verbale
  alternative: l’accusation viserait principalement le peuple, les prêtres et les lévites étant ajoutés secondairement
  rationale: La coordination hébraïque place les trois groupes sous la même affirmation. La traduction n’en atténue ni n’en rétrécit la portée.
translation_notes:
  register: Français international moderne, narratif et digne. « Responsables » évite l’archaïsme ou la nuance dynastique de « princes ». Les noms de peuples suivent les formes françaises bibliques usuelles. Le marqueur [a] est placé sur l’expression effectivement commentée.
