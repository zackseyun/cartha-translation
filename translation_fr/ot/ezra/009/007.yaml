  - severity: low
    issue: Portée du sujet collectif dans la phrase passive
    rationale: La formulation initiale est intelligible, mais placer « nous, nos rois et nos prêtres » avant le verbe rend sans ambiguïté leur participation commune, explicitement marquée en hébreu.
