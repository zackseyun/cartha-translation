  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: fr
  text: Depuis le temps de nos pères jusqu’à aujourd’hui, nous sommes profondément coupables. À cause de nos iniquités, nous, nos rois et nos prêtres, avons été livrés aux mains des rois des pays, à l’épée, à la captivité, au pillage et à l’humiliation publique[a], comme c’est le cas aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la honte manifeste » ou « au déshonneur » ; littéralement, « à la honte du visage ».
    reason: L’expression hébraïque concrète désigne une disgrâce visible ou publique; la note en conserve la forme littérale et signale des équivalents possibles.
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: Depuis le temps de nos pères
  rationale: La préposition מִן marque ici le point de départ temporel. Cette formulation naturelle conserve l’idée de continuité historique sans donner à « pères » un sens plus étroit que celui du texte.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: nous sommes profondément coupables
  rationale: אַשְׁמָה désigne une culpabilité réelle, et non un simple sentiment de honte. La tournure française exprime clairement cet état durable dans le cadre temporel allant des ancêtres jusqu’au présent.
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: À cause de nos iniquités
  rationale: Le ב préfixé a ici une valeur causale. « Iniquités » conserve le caractère moral grave de עָוֹן et le distingue de אַשְׁמָה, rendu par l’idée de culpabilité.
- source_word: נִתַּנּוּ ... בְּיַד
  choice: nous avons été livrés ... aux mains de
  rationale: Le nifal de נָתַן est passif. « Livrés aux mains de » rend ensemble le verbe et l’expression idiomatique בְּיַד, qui désigne la remise au pouvoir d’autrui.
- source_word: מַלְכֵי הָאֲרָצוֹת
  choice: les rois des différents pays
  rationale: Le pluriel אֲרָצוֹת renvoie aux pays ou territoires étrangers concernés, non à la terre entière. « Différents » rend explicite en français la pluralité sans modifier le référent.
- source_word: בַּחֶרֶב בַּשְּׁבִי וּבַבִּזָּה
  choice: à l’épée, à la captivité, au pillage
  rationale: 'La série nominale de jugements est conservée avec son parallélisme : mort ou dévastation guerrière, captivité et spoliation.'
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: à l’humiliation publique
  rationale: L’expression signifie littéralement « honte du visage » et évoque une disgrâce visible et publique. La formulation retenue transmet naturellement cette image en français, tandis que le sens littéral est signalé en note.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: comme c’est le cas aujourd’hui
  rationale: Cette tournure idiomatique française exprime que les effets du jugement décrits sont encore manifestes au moment de la prière.
theological_decisions:
- issue: Distinction entre אַשְׁמָה et עָוֹן dans la confession collective
  choice: Rendre אַשְׁמָה par « coupables » et עָוֹן par « iniquités »
  alternative: Employer « péché » ou « fautes » pour les deux termes
  rationale: La distinction maintient la relation entre l’état de culpabilité confessé et les actes iniques qui ont entraîné le jugement, sans ajouter de système doctrinal au texte.
- issue: Solidarité collective du peuple et de ses dirigeants
  choice: Conserver « nous, nos rois et nos prêtres »
  alternative: Reformuler en séparant le peuple de ses dirigeants
  rationale: L’hébreu associe explicitement la communauté, ses rois et ses prêtres dans la même expérience du jugement; la traduction préserve cette confession solidaire.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve le mouvement solennel de la confession ainsi que l’énumération des jugements, tout en évitant les calques peu naturels comme « dans une grande culpabilité » ou « honte du visage » dans le corps du texte.
