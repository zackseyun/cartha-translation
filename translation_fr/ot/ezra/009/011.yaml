revisions:
- from: 'que tu avais prescrits par l’intermédiaire de tes serviteurs les prophètes, en disant : « Le pays dans lequel vous entrez pour en prendre possession est un pays impur, à cause de l’impureté des peuples de ces contrées et des pratiques abominables dont ils l’ont rempli d’un bout à l’autre par leur souillure[a]. »'
  to: 'que tu avais ordonné par l’intermédiaire de tes serviteurs les prophètes, en disant : « La terre où vous entrez pour en prendre possession est une terre impure à cause de l’impureté des peuples des pays, à cause de leurs pratiques abominables, par lesquelles ils l’ont remplie d’un bout à l’autre de leur souillure[a]. »'
  rationale: 'La révision conserve le sens et le registre du projet tout en restaurant plus nettement la structure : les pratiques abominables sont le moyen associé à l’action des peuples, tandis que la terre est remplie de leur souillure. Elle emploie aussi « terre » pour rendre אֶרֶץ dans son sens territorial.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:48:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend bien la médiation prophétique, l’entrée en possession, et le réseau sémantique de l’impureté. Toutefois, la construction « des pratiques abominables dont ils l’ont rempli ... par leur souillure » brouille les rapports syntaxiques : elle fait des pratiques le contenu direct de ce dont la terre est remplie, puis rattache « par leur souillure » de façon maladroite. Le texte hébreu présente les abominations comme le moyen ou la cause par lesquels les peuples ont rempli la terre de leur impureté.'
  naturalness: Le français est globalement digne et accessible. « Terre » est plus précis que « pays » dans ce contexte foncier, et « par lesquelles ils l’ont remplie ... de leur souillure » est à la fois plus idiomatique et plus transparent syntaxiquement.
  terminology: « Impure », « impureté », « pratiques abominables » et « souillure » conservent, sans les réduire, les résonances rituelles et morales des termes hébreux. « Peuples des pays » préserve le pluriel de l’expression source sans ajouter la nuance déictique de « ces contrées ».
  issues:
  - severity: medium
    issue: Rapport entre les abominations, l’action de remplir et la souillure insuffisamment rendu
    rationale: La relative hébraïque permet de comprendre que les peuples ont rempli la terre au moyen de leurs abominations, et que ce dont elle est remplie est leur impureté. La formulation révisée explicite cette articulation sans surinterpréter la valeur des prépositions.
  - severity: low
    issue: « Pays » atténue le sens territorial de אֶרֶץ
    rationale: « Terre » convient mieux à la terre dans laquelle on entre pour en prendre possession et maintient la cohérence lexicale du verset.
