  text: אֲשֶׁ֣ר צִוִּ֗יתָ בְּ/יַ֨ד עֲבָדֶ֣י/ךָ הַ/נְּבִיאִים֮ לֵ/אמֹר֒ הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֤ם בָּאִים֙ לְ/רִשְׁתָּ֔/הּ אֶ֤רֶץ נִדָּה֙ הִ֔יא בְּ/נִדַּ֖ת עַמֵּ֣י הָ/אֲרָצ֑וֹת בְּ/תוֹעֲבֹֽתֵי/הֶ֗ם אֲשֶׁ֥ר מִלְא֛וּ/הָ מִ/פֶּ֥ה אֶל פֶּ֖ה בְּ/טֻמְאָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: fr
  text: 'que tu avais ordonné par l’intermédiaire de tes serviteurs les prophètes, en disant : « La terre où vous entrez pour en prendre possession est une terre impure à cause de l’impureté des peuples des pays, à cause de leurs pratiques abominables, par lesquelles ils l’ont remplie d’un bout à l’autre de leur souillure[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « d’un bout à l’autre » signifie littéralement « de bouche à bouche » ; elle indique ici que toute la terre était remplie.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: Rend naturellement en français l’idiome hébreu d’agentivité, littéralement « par la main de », tout en maintenant le rôle médiateur des prophètes.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: tes serviteurs les prophètes
  rationale: « Serviteurs » convient au titre honorifique des agents de Dieu; « prophètes » est l’équivalent usuel et précis de נְבִיאִים.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: Exprime clairement l’action d’acquérir et d’occuper le pays, sans réduire le verbe à la seule notion juridique d’héritage.
- source_word: אֶרֶץ נִדָּה
  choice: un pays impur
  rationale: Formulation française naturelle qui conserve le langage de souillure sans décider s’il est exclusivement rituel ou moral.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: à cause de l’impureté des peuples de ces contrées
  rationale: Interprète le beth comme causal dans le contexte; « ces contrées » restitue le pluriel sans la lourdeur de « peuples des pays ».
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: des pratiques abominables
  rationale: Rend le caractère concret et moral-religieux de תּוֹעֵבָה plus directement que le substantif français « abominations », tout en conservant sa force.
- source_word: מִפֶּה אֶל־פֶּה
  choice: d’un bout à l’autre
  rationale: Traduit le sens spatial de l’idiome, littéralement « d’une bouche à l’autre », qui indique que tout le pays est rempli.
- source_word: בְּטֻמְאָתָם
  choice: par leur souillure
  rationale: Conserve le champ lexical de l’impureté et permet une valeur instrumentale ou circonstancielle sans préciser indûment la nature rituelle ou morale de la souillure.
theological_decisions:
- issue: Nature de la souillure du pays
  choice: Employer « impur », « impureté » et « souillure » sans restreindre ces termes à une catégorie uniquement rituelle ou uniquement morale.
  alternative: Parler exclusivement d’impureté rituelle, ou remplacer tout ce vocabulaire par celui de la corruption morale.
  rationale: נִדָּה, טֻמְאָה et תּוֹעֵבָה associent ici des dimensions rituelles, morales et liées à l’alliance; la traduction préserve cette tension.
- issue: Rapport syntaxique de בְּתוֹעֲבֹתֵיהֶם
  choice: Coordonner les pratiques abominables à l’impureté comme cause de l’état du pays.
  alternative: Traduire strictement par « avec leurs abominations » comme moyen ou contenu.
  rationale: Le beth permet une nuance causale ou instrumentale; le français choisi demeure naturel tout en reliant ces pratiques à la souillure décrite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de la prière tout en évitant le calque « par la main de ». Le vocabulaire de l’impureté reste volontairement ouvert à ses résonances rituelles et morales.
