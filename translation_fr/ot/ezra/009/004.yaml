source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: fr
  text: Tous ceux qui tremblaient devant les paroles du Dieu d’Israël se réunirent auprès de moi à cause de l’infidélité de la communauté des exilés[a]. Quant à moi, je restai assis, consterné, jusqu’à l’offrande du soir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de la faute de la communauté revenue d’exil » ; le terme hébreu évoque une rupture de fidélité envers Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner particulièrement une offrande végétale ; ici, l’offrande régulière du soir sert aussi de repère temporel.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: se rassemblèrent autour de moi
  rationale: Le nifal exprime ici le rassemblement des personnes auprès d’Esdras. La tournure pronominale est naturelle en français et « autour de moi » rend clairement וְאֵלַי.
- source_word: כֹּל חָרֵד
  choice: tous ceux qui tremblaient
  rationale: L’adjectif singulier après כֹּל a une valeur collective. Cette formulation conserve l’idée de crainte profonde et révérencielle sans l’atténuer.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: devant les paroles du Dieu d’Israël
  rationale: Avec חָרֵד, בְּ introduit ce qui provoque le tremblement. « Devant » est idiomatique et garde le pluriel « paroles ».
- source_word: עַל מַעַל הַגּוֹלָה
  choice: à cause de l’infidélité de la communauté des exilés
  rationale: מַעַל désigne une rupture de fidélité envers Dieu, tandis que הַגּוֹלָה peut désigner collectivement la communauté issue de l’exil. La formulation française explicite ce sens collectif sans préciser davantage que l’hébreu.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: je restai assis, consterné
  rationale: Le participe décrit une posture qui se prolonge, et מְשׁוֹמֵם un état de stupeur accablée. « Consterné » est actuel, digne et naturel.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: jusqu’à l’offrande du soir
  rationale: מִנְחָה peut désigner particulièrement une offrande végétale, mais sert ici aussi de repère temporel lié au culte régulier. « Offrande du soir » évite de surdéterminer sa nature.
theological_decisions:
- issue: Sens de מַעַל dans le contexte d’une faute envers Dieu
  choice: infidélité
  alternative: faute sacrilège / transgression
  rationale: « Infidélité » conserve l’idée centrale de rupture de loyauté envers Dieu sans importer une catégorie doctrinale plus étroite.
- issue: Référent collectif de הַגּוֹלָה
  choice: la communauté des exilés
  alternative: les exilés / la communauté revenue d’exil
  rationale: Le nom désigne collectivement les personnes liées à l’exil. La traduction retenue garde cette dimension communautaire sans ajouter explicitement leur retour, qui n’est pas formulé dans ce syntagme.
- issue: Nature de l’offrande du soir
  choice: offrande du soir
  alternative: offrande végétale du soir
  rationale: Le terme מִנְחָה possède un sens sacrificiel précis dans certains contextes, mais fonctionne ici également comme indication de l’heure. La traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. « Tremblaient devant » conserve la force religieuse de l’hébreu ; « consterné » exprime la stupeur accablée sans archaïsme. Les deux marqueurs de note figurent dans le texte dans l’ordre de leur apparition.
