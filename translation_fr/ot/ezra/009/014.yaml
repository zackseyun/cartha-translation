source:
  edition: WLC
  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: fr
  text: Allons-nous recommencer à violer tes commandements et à nous allier par mariage aux peuples qui commettent ces abominations[a] ? Ne t’irriterais-tu pas contre nous jusqu’à nous anéantir, sans laisser ni reste ni rescapé[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « aux peuples de ces abominations ». L’expression hébraïque désigne probablement des peuples caractérisés par de telles pratiques abominables.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ni reste ni personne ayant échappé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: Allons-nous recommencer
  rationale: Le verbe שׁוב signifie littéralement « revenir », mais, devant les infinitifs qui décrivent une désobéissance renouvelée, « recommencer » exprime naturellement la reprise des fautes antérieures.
- source_word: לְהָפֵר
  choice: à violer
  rationale: Dans un contexte juridique et d’alliance, הפר signifie enfreindre ou violer. « Violer » convient naturellement aux commandements et conserve la gravité de l’acte.
- source_word: מִצְוֺתֶיךָ
  choice: tes commandements
  rationale: Le pluriel avec suffixe de deuxième personne s’adresse directement à Dieu. « Commandements » garde la tonalité biblique et juridique.
- source_word: וּלְהִתְחַתֵּן
  choice: et à nous allier par mariage
  rationale: Le hitpael de חתן désigne l’entrée dans des liens matrimoniaux entre familles ou groupes. Cette formulation exprime mieux que le seul verbe « épouser » la dimension collective et réciproque.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: aux peuples qui commettent ces abominations
  rationale: Littéralement, « aux peuples de ces abominations ». La formulation explicite la caractérisation par les pratiques condamnées sans présenter l’appartenance ethnique elle-même comme abominable; une note conserve la construction plus formelle.
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: Ne t’irriterais-tu pas contre nous
  rationale: אנף exprime une colère intense. « S’irriter contre » garde la force de la réaction divine et s’insère naturellement dans la question rhétorique.
- source_word: עַד כַּלֵּה
  choice: jusqu’à nous anéantir
  rationale: כלה évoque l’action de mener à son terme, de consumer ou de détruire entièrement. « Anéantir » rend clairement ici l’idée d’une destruction complète.
- source_word: לְאֵין שְׁאֵרִית וּפְלֵיטָה
  choice: sans laisser ni reste ni rescapé
  rationale: לְאֵין introduit l’absence totale qui résulterait du jugement. « Reste » conserve l’écho du thème biblique de ce qui subsiste, tandis que « rescapé » donne à פליטה son sens concret parallèle.
theological_decisions:
- issue: Caractérisation des peuples en rapport avec les « abominations »
  choice: Rattacher explicitement les abominations aux pratiques des peuples.
  alternative: « aux peuples de ces abominations »
  rationale: La construction hébraïque est condensée et demeure ouverte à une traduction formelle. Dans le contexte, l’interdit porte sur les pratiques religieuses et morales associées à ces peuples, non sur une prétendue infériorité ethnique. La note préserve toutefois la forme littérale.
- issue: Maintien du langage du reste
  choice: Employer « reste » dans le texte principal.
  alternative: « survivant » ou « ceux qui subsistent »
  rationale: « Reste » demeure compréhensible en français et conserve les résonances bibliques du jugement et de la préservation, sans résoudre la nuance de פליטה qui lui est coordonné.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée. « Nous allier par mariage » rend la portée collective de l’union matrimoniale; « reste » maintient une résonance biblique importante sans archaïsme excessif.
