revisions:
- from: Et après tout ce qui nous est arrivé à cause de nos mauvaises actions et de notre grande culpabilité — bien que toi, notre Dieu, tu nous aies punis moins que ne le méritaient nos fautes[a] et que tu nous aies accordé des rescapés comme ceux-ci[b] —
  to: Et après tout ce qui nous est arrivé à cause de nos mauvaises actions et de notre grande culpabilité — bien que toi, notre Dieu, tu nous aies punis moins que ne le méritaient nos fautes[a] et que tu nous aies accordé un reste comme celui-ci[b] —
  rationale: La révision limitée remplace une expression française ambiguë et peu naturelle par « un reste comme celui-ci », qui rend le singulier collectif de פְּלֵיטָה et sa portée postexilique. Les notes sont reformulées pour rendre les alternatives lexicales sans calque obscur ni formulation française maladroite. Le reste du texte est conservé.
