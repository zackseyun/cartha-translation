source:
  edition: WLC
  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: fr
  text: Et après tout ce qui nous est arrivé à cause de nos mauvaises actions et de notre grande culpabilité — bien que toi, notre Dieu, tu nous aies punis moins que ne le méritaient nos fautes[a] et que tu nous aies accordé un reste comme celui-ci[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu évoque Dieu qui a retenu ou épargné, en deçà de la mesure de nos fautes. Autre traduction possible : « tu nous as épargnés plus que ne le méritaient nos fautes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une échappée comme celle-ci », « un groupe de survivants comme celui-ci ». Le terme désigne ce qui a été préservé à travers le jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: Et après
  rationale: Conserve la conjonction hébraïque et la continuité de la prière d'Esdras.
- source_word: כָּל הַבָּא עָלֵינוּ
  choice: tout ce qui nous est arrivé
  rationale: Rend naturellement en français la totalité des malheurs survenus, sans alourdir la phrase par un calque.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים
  choice: à cause de nos mauvaises actions
  rationale: Explicite la valeur causale de la préposition ב et conserve le jugement moral du texte.
- source_word: וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: et de notre grande culpabilité
  rationale: אַשְׁמָה désigne ici la culpabilité objective, non un simple sentiment de culpabilité.
- source_word: כִּי
  choice: bien que
  rationale: Dans ce contexte, introduit la nuance concessive qui oppose la faute du peuple à la mesure de miséricorde divine.
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: tu nous aies punis moins que ne le méritaient nos fautes
  rationale: 'Exprime clairement l''idiome hébreu : Dieu n''a pas infligé toute la conséquence que les fautes auraient méritée, tout en gardant en note le sens littéral de « retenir/épargner ».'
- source_word: עָוֺן
  choice: fautes
  rationale: Le mot peut désigner la faute, la culpabilité ou ses conséquences. « Fautes » est ici naturel et évite la répétition de « culpabilité ».
- source_word: וְנָתַתָּה לָּנוּ
  choice: et que tu nous aies accordé
  rationale: « Accorder » convient au don miséricordieux d'une communauté survivante et s'intègre à la construction concessive française.
- source_word: פְּלֵיטָה כָּזֹאת
  choice: des rescapés comme ceux-ci
  rationale: פְּלֵיטָה peut désigner l'échappée ou les survivants. La formulation choisie garde le sens concret de personnes préservées sans imposer d'emblée le terme théologique « reste ».
theological_decisions:
- issue: La miséricorde divine par rapport au châtiment mérité
  choice: tu nous aies punis moins que ne le méritaient nos fautes
  alternative: tu nous aies épargnés au-delà de ce que permettaient nos fautes
  rationale: Le rendu principal communique clairement que le jugement subi était inférieur à ce que la culpabilité méritait. La note préserve l'image lexicale du fait de retenir ou d'épargner, sans résoudre excessivement l'idiome.
- issue: Sens de פְּלֵיטָה dans le contexte postexilique
  choice: des rescapés comme ceux-ci
  alternative: un reste comme celui-ci
  rationale: Le terme hébreu vise ce qui a échappé au jugement ou ceux qui y ont survécu. « Rescapés » conserve ce sens concret; la note signale « reste », qui fait ressortir la portée historico-théologique sans l'imposer dans le texte.
translation_notes:
  register: 'Français international moderne, digne et accessible. La longue phrase et le tiret final maintiennent le caractère inachevé du verset, dont la pensée se poursuit au verset 14. Le vouvoiement n''est pas employé : le tutoiement correspond à l''adresse biblique française courante à Dieu.'
