source:
  edition: WLC
  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: fr
  text: Mais maintenant, pour un bref moment, Yahweh, notre Dieu, nous a accordé la faveur de nous laisser un reste de survivants et de nous donner un pieu[a] dans son lieu saint, pour éclairer nos yeux[b] et nous donner un peu de vie au milieu de notre esclavage[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un point d’ancrage solide » ; l’hébreu conserve l’image concrète d’un objet fermement fixé.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « éclairer nos yeux » ; cette expression évoque un regain de vitalité ou d’espérance.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans notre servitude » ou « dans notre sujétion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: faveur
  rationale: Dans cette construction avec « de la part de Yahweh », le nom désigne ici une faveur accordée plutôt que l’acte de supplier. « Faveur » restitue cette bienveillance sans surcharger le terme.
- source_word: פְּלֵיטָה
  choice: un reste de rescapés
  rationale: Le terme évoque à la fois ceux qui ont échappé au désastre et la communauté préservée. Cette formulation conserve les deux aspects.
- source_word: יָתֵד
  choice: un pieu
  rationale: Le mot désigne concrètement un pieu ou une cheville et sert ici d’image pour une implantation stable. Le texte principal conserve cette image concrète.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: dans son lieu saint
  rationale: Traduction directe qui garde la portée du syntagme hébreu tout en permettant son sens lié au sanctuaire sans le préciser davantage.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: illumine nos yeux
  rationale: L’expression imagée évoque le retour de la vitalité, du courage ou de l’espérance. La formulation française conserve l’image.
- source_word: מִחְיָה
  choice: redonne un peu de vie
  rationale: Le nom peut exprimer la préservation ou le renouvellement de la vie. Dans le contexte du retour d’exil, cette formulation naturelle rend l’idée d’un regain de vie sans effacer entièrement celle de préservation.
- source_word: בְּעַבְדֻתֵנוּ
  choice: au milieu de notre esclavage
  rationale: Le terme indique une condition de sujétion. « Esclavage » en conserve la force, tandis que « au milieu de » rend naturellement en français le maintien de cette condition.
- source_word: כִּמְעַט רֶגַע
  choice: pour un bref moment
  rationale: Cette expression souligne le caractère limité et temporaire du répit accordé.
- source_word: הָיְתָה ... מֵאֵת יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, notre Dieu, nous a fait la faveur
  rationale: Cette restructuration rend naturelle en français la proposition existentielle hébraïque tout en conservant Yahweh comme source de la faveur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement restructurée pour être naturelle, tandis que les images hébraïques du pieu et des yeux éclairés sont conservées. Les marqueurs de notes sont placés sur les termes qu’ils expliquent.
