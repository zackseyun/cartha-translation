  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: fr
  text: 'Voici ce que dit Cyrus, roi de Perse : « Yahweh, le Dieu du ciel, m’a donné tous les royaumes de la terre, et il m’a chargé[a] de lui bâtir une maison[b] à Jérusalem, qui se trouve en Juda. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a confié la mission ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit du temple de Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formule restitue naturellement en français moderne la formule solennelle d’introduction d’une proclamation, sans archaïsme excessif.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: Cyrus, roi de Perse
  rationale: Le nom propre suit l’usage français courant, et l’apposition rend clairement le titre royal.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: tous les royaumes de la terre
  rationale: Le pluriel « royaumes » est conservé, tandis que « la terre » convient à la portée universelle de la rhétorique impériale.
- source_word: נָתַן לִי
  choice: m’a donné
  rationale: Le passé composé exprime un don accompli dont le résultat demeure pertinent dans la proclamation de Cyrus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: le Dieu du ciel
  rationale: Il s’agit de la formulation française idiomatique de ce titre divin fréquent dans Esdras.
- source_word: וְהוּא פָקַד עָלַי
  choice: et il m’a chargé
  rationale: Le pronom explicite est conservé, et « charger de » exprime naturellement l’idée d’une mission ou responsabilité assignée.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: de lui bâtir une maison
  rationale: « Maison » conserve le sens lexical de בַיִת, tandis que le contexte cultuel est précisé en note sans être introduit directement dans le texte.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: à Jérusalem, qui se trouve en Juda
  rationale: La proposition relative et la précision géographique de l’hébreu sont toutes deux conservées dans un français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Rendu de בַיִת dans le contexte cultuel
  choice: maison
  alternative: temple
  rationale: Le texte principal conserve le terme hébreu concret et laisse une note expliciter qu’il désigne ici le temple, sans effacer la formulation originale.
- issue: Portée de פָקַד עָלַי
  choice: m’a chargé
  alternative: m’a confié la mission
  rationale: Le verbe peut exprimer l’attribution d’une responsabilité ou d’une mission; le choix retenu reste concis sans préciser à l’excès la nature de l’ordre.
translation_notes:
  register: Français international moderne, clair et digne. La proclamation garde une certaine solennité grâce à « Voici ce que dit » et à « bâtir », tout en évitant une syntaxe archaïque. Les guillemets français délimitent les paroles du décret.
