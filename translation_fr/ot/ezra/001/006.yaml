source:
  edition: WLC
  text: וְ/כָל סְבִיבֹֽתֵי/הֶם֙ חִזְּק֣וּ בִֽ/ידֵי/הֶ֔ם בִּ/כְלֵי כֶ֧סֶף בַּ/זָּהָ֛ב בָּ/רְכ֥וּשׁ וּ/בַ/בְּהֵמָ֖ה וּ/בַ/מִּגְדָּנ֑וֹת לְ/בַ֖ד עַל כָּל הִתְנַדֵּֽב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: fr
  text: Tous ceux qui vivaient autour d’eux leur apportèrent leur soutien en leur donnant des objets en argent, de l’or, des biens, du bétail et des présents précieux, sans compter tout ce qui fut offert volontairement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans compter toute offrande volontaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: ceux qui vivaient autour d’eux
  rationale: Désigne les personnes des alentours sans préciser davantage qu’il s’agissait de voisins au sens civique.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: leur apportèrent leur soutien
  rationale: L’expression hébraïque signifie littéralement « fortifièrent leurs mains » et désigne ici une aide matérielle concrète; une traduction idiomatique est plus claire en français moderne.
- source_word: בִּכְלֵי כֶסֶף
  choice: des objets en argent
  rationale: כְּלִי est un terme large pouvant désigner des récipients, ustensiles ou objets; « objets » préserve cette portée dans une liste de dons.
- source_word: בַּזָּהָב
  choice: de l’or
  rationale: Le nom sans complément désigne naturellement le métal précieux apporté comme soutien.
- source_word: בָּרְכוּשׁ
  choice: des biens
  rationale: רְכוּשׁ désigne des possessions ou biens, notamment mobiliers; « biens » convient à cette énumération sans suggérer uniquement une propriété foncière.
- source_word: וּבַבְּהֵמָה
  choice: du bétail
  rationale: Le singulier collectif désigne ici les animaux domestiques considérés comme richesse.
- source_word: וּבַמִּגְדָּנוֹת
  choice: des présents précieux
  rationale: מִגְדָּנוֹת peut désigner des choses précieuses, des présents de choix ou parfois des mets délicats; cette formulation garde une portée assez large dans le contexte.
- source_word: לְבַד עַל כָּל הִתְנַדֵּב
  choice: sans compter tout ce qui fut offert volontairement
  rationale: La formulation rend l’idée d’un ajout aux biens déjà énumérés tout en conservant le caractère volontaire exprimé par le hitpael de נדב et l’absence de sujet explicite.
