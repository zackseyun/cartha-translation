  variant: modern international French
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: fr
  text: 'La première année du règne de Cyrus, roi de Perse, afin que s’accomplisse[a] la parole de Yahweh transmise par Jérémie[b], Yahweh éveilla l’esprit de Cyrus, roi de Perse. Celui-ci fit publier une proclamation[c] dans tout son royaume, et aussi par écrit, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « afin de mener à son terme la parole de Yahweh ». Dans ce contexte, il s’agit de la réalisation de la parole prophétique.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sortie de la bouche de Jérémie ». Cette expression hébraïque présente Jérémie comme le porte-parole humain par lequel la parole de Yahweh a été communiquée.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « fit passer une voix ». L’expression désigne la diffusion publique d’une annonce officielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: La première année
  rationale: La formule temporelle introduit directement le cadre chronologique. Le ו initial n’exige pas ici l’ajout d’un marqueur comme « Or » ou « Maintenant ».
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: de Cyrus, roi de Perse
  rationale: Cette tournure française naturelle rend fidèlement la formule de datation et le titre royal.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: afin que s’accomplisse la parole de Yahweh
  rationale: Dans ce contexte prophétique, « s’accomplir » exprime naturellement l’idée de mener la parole à son plein aboutissement, sans réduire דָּבָר à une simple promesse.
- source_word: מִפִּי יִרְמְיָה
  choice: transmise par Jérémie
  rationale: Littéralement « de la bouche de Jérémie » ; la formulation retenue exprime clairement son rôle de porte-parole tout en évitant une expression peu naturelle en français courant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּרֶשׁ
  choice: Yahweh éveilla l’esprit de Cyrus
  rationale: « Éveilla » conserve l’image verbale et l’initiative divine ; « l’esprit » préserve l’étendue sémantique de רוּחַ sans la limiter à la pensée ou à la volonté.
- source_word: וַיַּעֲבֶר קוֹל
  choice: fit diffuser une proclamation
  rationale: L’expression idiomatique désigne la circulation publique d’une annonce officielle. Cette formulation conserve la valeur causative du verbe.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: dans tout son royaume
  rationale: La formulation indique que l’annonce fut diffusée dans l’ensemble du territoire soumis à Cyrus.
- source_word: וְגַם בְּמִכְתָּב
  choice: également par écrit
  rationale: Le texte précise que la proclamation ne fut pas seulement diffusée publiquement, mais aussi communiquée sous forme écrite.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule française introduit naturellement le discours direct qui suit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » en conserve la fonction sans lui substituer un titre.
- issue: Valeur de לִכְלוֹת dans le contexte de la parole prophétique
  choice: afin que s’accomplisse
  alternative: afin que soit menée à son terme
  rationale: « S’accomplisse » rend le passage de la parole prophétique à sa réalisation historique, tout en maintenant le lien explicite entre la parole et l’événement.
- issue: Nature de l’action exercée sur רוּחַ כֹּרֶשׁ
  choice: éveilla l’esprit de Cyrus
  alternative: poussa Cyrus à agir
  rationale: 'La traduction retenue préserve la formulation anthropologique et son ambiguïté : le texte affirme l’initiative divine sans préciser le mécanisme intérieur de cette action.'
translation_notes:
  register: Français international moderne, clair et digne. La phrase a été divisée en deux pour éviter une période excessivement lourde, sans modifier les relations logiques du texte. « Proclamation » maintient le registre officiel, tandis que « en ces termes » prépare naturellement la citation du verset suivant.
