  to: 'La première année du règne de Cyrus, roi de Perse, afin que s’accomplisse[a] la parole de Yahweh transmise par Jérémie[b], Yahweh éveilla l’esprit de Cyrus, roi de Perse. Celui-ci fit publier une proclamation[c] dans tout son royaume, et aussi par écrit, en ces termes :'
