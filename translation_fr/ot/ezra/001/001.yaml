  - severity: low
    issue: Collocation peu naturelle avec « diffuser une proclamation »
    rationale: Une proclamation est normalement « publiée » ou « proclamée » ; « fit publier une proclamation » conserve le sens de diffusion officielle et la construction causative du texte source.
