  text: וַ/יּֽוֹצִיאֵ֗/ם כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס עַל יַ֖ד מִתְרְדָ֣ת הַ/גִּזְבָּ֑ר וַֽ/יִּסְפְּרֵ/ם֙ לְ/שֵׁשְׁבַּצַּ֔ר הַ/נָּשִׂ֖יא לִ/יהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: fr
  text: Cyrus, roi de Perse, les fit sortir par l’intermédiaire de Mitredath, le trésorier[a], et les dénombra à l’intention de Sheshbatsar[b], le chef de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Mitredath, le trésorier ». Cette expression hébraïque indique ici l’intermédiaire ou l’agent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le prince de Juda » ; éventuellement « le gouverneur de Juda ». Le terme hébreu désigne plus généralement un chef ou un dirigeant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: les fit sortir
  rationale: Le hifil de יצא exprime la causation. Le pronom renvoie aux objets du temple mentionnés au verset précédent; « les fit sortir » rend clairement l’action ordonnée par Cyrus sans suggérer qu’il s’agit de personnes.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Cyrus, roi de Perse
  rationale: Cette formulation française naturelle conserve le nom, le titre royal et le royaume.
- source_word: עַל יַד
  choice: par l’intermédiaire de
  rationale: L’expression hébraïque, littéralement « par la main de », marque ici l’intermédiaire ou l’agent chargé de l’opération. La traduction retenue est naturelle en français moderne.
- source_word: מִתְרְדָת
  choice: Mitredath
  rationale: Translittération française usuelle du nom propre perse.
- source_word: הַגִּזְבָּר
  choice: le trésorier
  rationale: Le terme désigne un responsable du trésor; « trésorier » est précis, concis et adapté au contexte des objets précieux.
- source_word: וַיִּסְפְּרֵם
  choice: qui les compta
  rationale: Le verbe ספר signifie ici compter ou inventorier. Le relatif français rattache naturellement l’action à Mitredath, agent le plus proche, tout en conservant la chaîne d’actions placée sous l’autorité de Cyrus.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: pour Sheshbatsar
  rationale: La préposition ל marque le destinataire ou bénéficiaire du comptage et de la remise; « pour » préserve cette relation sans ajouter explicitement un verbe de remise absent de l’hébreu.
- source_word: הַנָּשִׂיא
  choice: le chef
  rationale: נָשִׂיא désigne largement un chef ou dirigeant. « Chef » garde cette amplitude sans imposer le sens dynastique de « prince » ni le titre administratif plus précis de « gouverneur ».
- source_word: לִיהוּדָה
  choice: de Juda
  rationale: Dans cette apposition, la préposition relie Sheshbatsar à Juda; « le chef de Juda » est l’expression française la plus naturelle.
theological_decisions:
- issue: Portée du titre נָשִׂיא appliqué à Sheshbatsar
  choice: le chef de Juda
  alternative: le prince de Juda; le gouverneur de Juda
  rationale: Le mot hébreu désigne un dirigeant sans préciser ici une filiation royale ni employer nécessairement un titre administratif perse. « Chef » conserve cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite le calque « par la main de », peu naturel en français courant, tout en l’indiquant en note. « Fit sortir » préserve la valeur causative; « chef » maintient l’imprécision du titre hébreu.
