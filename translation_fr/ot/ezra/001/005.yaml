source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: fr
  text: Alors les chefs de famille de Juda et de Benjamin, les prêtres et les lévites se levèrent — tous ceux dont Dieu avait éveillé l’esprit[a] — pour monter bâtir la maison de Yahvé[b] qui est à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « dont Dieu avait mis l’esprit en mouvement » ou « que Dieu avait poussés intérieurement à agir ».'
    reason: L’expression hébraïque décrit une impulsion intérieure suscitée par Dieu, sans en préciser le mode.
  - marker: b
    text: C’est-à-dire le temple de Yahvé.
    reason: La formulation littérale « maison de Yahvé » désigne ici le temple de Jérusalem.
lexical_decisions:
- source_word: וַיָּקוּמוּ
  choice: se levèrent
  rationale: Le qal de קום marque ici le début de leur action en réponse à l’appel. « Se levèrent » conserve ce mouvement narratif sans préciser prématurément qu’ils partirent.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs de famille
  rationale: Cette expression sociale désigne les responsables des groupes familiaux ou maisons ancestrales. « Chefs de famille » est naturel en français moderne tout en gardant l’idée de direction familiale.
- source_word: לִיהוּדָה וּבִנְיָמִן
  choice: de Juda et de Benjamin
  rationale: Le préfixe ל indique ici l’appartenance. La formulation française exprime naturellement leur rattachement à ces deux tribus.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: les prêtres et les lévites
  rationale: Ce sont les désignations françaises usuelles de ces groupes cultuels et généalogiques.
- source_word: לְכֹל הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: tous ceux dont Dieu avait éveillé l’esprit
  rationale: La construction est distributive et attribue à Dieu l’impulsion intérieure à l’origine de leur réponse. Le plus-que-parfait situe cette intervention avant leur mise en action.
- source_word: רוּחַ
  choice: esprit
  rationale: Dans ce contexte, le mot désigne la disposition intérieure ou le ressort qui pousse à agir. « Esprit » préserve le terme hébreu et sa portée théologique sans le réduire au seul sentiment.
- source_word: לַעֲלוֹת
  choice: pour monter
  rationale: עלה est le verbe traditionnel du déplacement vers Jérusalem et conserve ici sa nuance géographique et religieuse.
- source_word: לִבְנוֹת
  choice: bâtir
  rationale: L’hébreu dit simplement « bâtir ». Le contexte implique une reconstruction, mais le préfixe « re- » n’est pas exprimé par ce verbe.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: La traduction conserve l’image hébraïque de la « maison » plutôt que de la remplacer directement par l’interprétation contextuelle « temple ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle représente explicitement le nom divin YHWH au lieu de le remplacer par un titre.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: qui est à Jérusalem
  rationale: La relative localise la maison. Le présent suit la forme hébraïque sans suggérer que le bâtiment ruiné serait alors intact.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. Employer « Yahvé » conserve le caractère de nom propre et évite de le remplacer silencieusement par un titre.
- issue: Nature de l’action divine dans הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: Dieu avait éveillé l’esprit
  alternative: Dieu avait poussé à agir
  rationale: L’hébreu attribue explicitement à Dieu une action sur l’esprit intérieur, sans en définir davantage le mécanisme. La formulation retenue maintient cette tension entre initiative divine et réponse humaine.
- issue: Bâtiment désigné par בֵּית יְהוָה
  choice: la maison de Yahvé
  alternative: le temple de Yahvé
  rationale: « Maison » traduit directement l’image du texte, tandis que la note précise l’identification contextuelle au temple sans l’introduire dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde l’élan narratif de l’hébreu. « Chefs de famille » évite l’expression vieillie « chefs des maisons paternelles », tandis que « monter », « bâtir » et « maison de Yahvé » préservent les images structurantes du texte source.
