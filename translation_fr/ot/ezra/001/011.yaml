  text: כָּל כֵּלִים֙ לַ/זָּהָ֣ב וְ/לַ/כֶּ֔סֶף חֲמֵ֥שֶׁת אֲלָפִ֖ים וְ/אַרְבַּ֣ע מֵא֑וֹת הַ/כֹּ֞ל הֶעֱלָ֣ה שֵׁשְׁבַּצַּ֗ר עִ֚ם הֵעָל֣וֹת הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל לִ/ירוּשָׁלִָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: fr
  text: Tous les objets d’or et d’argent étaient au nombre de cinq mille quatre cents[a]. Sheshbatsar les fit monter avec les exilés, lors de la montée de ceux-ci de Babylone à Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le total de 5 400 ne correspond pas à la somme des nombres détaillés aux versets 9 et 10, qui est de 2 499. Le texte ne précise pas la raison de cet écart.
    reason: textual_or_numerical_note
  - marker: b
    text: L’hébreu emploie deux fois la racine traduite par « monter », selon l’expression habituelle pour le déplacement vers Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: Tous les objets
  rationale: כֵּלִים désigne largement des objets, ustensiles ou récipients. Dans le contexte du trésor du temple, « objets » est naturel et suffisamment englobant.
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: d’or et d’argent
  rationale: Les prépositions classent ici les objets selon leur matériau; cette tournure est concise et idiomatique en français.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת הַכֹּל
  choice: étaient au nombre de cinq mille quatre cents
  rationale: Cette formulation exprime naturellement le total indiqué par הַכֹּל, sans reproduire lourdement « tous… en tout ».
- source_word: הֶעֱלָה
  choice: fit monter
  rationale: Le hiphil de עלה a un sens causatif, « faire monter ». La traduction conserve aussi le langage traditionnel de la montée vers Jérusalem.
- source_word: שֵׁשְׁבַּצַּר
  choice: Sheshbatsar
  rationale: Translittération française transparente du nom hébreu.
- source_word: עִם
  choice: avec
  rationale: La préposition marque simplement l’accompagnement.
- source_word: הֵעָלוֹת הַגּוֹלָה
  choice: lorsqu’on les fit monter avec les exilés
  rationale: L’infinitif construit situe l’action au moment de la montée de la communauté exilée. Le pronom « les » renvoie aux exilés et rend explicitement en français la lecture personnelle de הַגּוֹלָה.
- source_word: הַגּוֹלָה
  choice: les exilés
  rationale: Dans ce contexte, le nom collectif désigne les personnes déportées qui reviennent, plutôt que la condition abstraite d’exil.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: de Babylone à Jérusalem
  rationale: Rendu direct des lieux de départ et d’arrivée.
theological_decisions:
- issue: Langage de la montée vers Jérusalem dans עלה
  choice: Conserver « fit monter » aux deux occurrences
  alternative: « emporta » / « furent ramenés »
  rationale: L’hébreu répète la racine עלה et présente le déplacement vers Jérusalem comme une montée. Garder cette image préserve la nuance géographique et littéraire sans lui imposer une interprétation doctrinale.
- issue: Référent de הַגּוֹלָה
  choice: « les exilés », compris comme la communauté déportée
  alternative: « l’exil » / « la communauté des exilés » / « les déportés »
  rationale: Le contexte décrit le retour de personnes depuis Babylone. « Les exilés » est clair, actuel et respecte l’emploi collectif du terme.
translation_notes:
  register: Français moderne, international et digne. « Objets » évite l’étroitesse de « récipients » et le caractère parfois technique d’« ustensiles ». La répétition « fit monter » est volontaire afin de conserver celle de l’hébreu.
