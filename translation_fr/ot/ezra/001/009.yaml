lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: En voici le nombre
  rationale: 'Cette tournure française naturelle introduit l’inventaire tout en rendant le sens littéral : « et ceux-ci, leur nombre ».'
- source_word: אֲגַרְטְלֵי
  choice: bassins
  rationale: Le terme désigne des récipients employés dans le cadre du temple ; « bassins » convient clairement au contexte d’un inventaire cultuel.
- source_word: זָהָב / כֶסֶף
  choice: en or / en argent
  rationale: En français, la construction avec « en » exprime naturellement la matière dont les objets sont faits.
- source_word: מַחֲלָפִים
  choice: couteaux
  rationale: « Couteaux » est une interprétation ancienne et plausible de ce terme rare dans un inventaire d’objets du temple, mais son sens demeure incertain ; les principales autres possibilités sont donc données en note.
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1 000 / 29
  rationale: Les chiffres arabes facilitent la lecture de cet inventaire ; l’espace dans « 1 000 » suit l’usage typographique français.
