source:
  edition: WLC
  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: fr
  text: Que tous ceux qui restent[a], en tout lieu où ils résident, reçoivent l’aide des hommes de leur lieu[b], avec de l’argent, de l’or, des biens et du bétail, ainsi qu’avec une offrande volontaire pour la maison de Dieu qui est à Jérusalem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui sont restés » ou « qui ont été laissés ». L’hébreu ne précise pas la raison pour laquelle ils restent.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les hommes de son lieu » ; l’expression peut désigner plus largement les habitants du lieu ou les voisins.
    reason: lexical_alternative
  - marker: c
    text: Ou « les soutiennent ». Le verbe hébreu signifie littéralement « lever » ou « porter » et désigne ici une aide matérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: toute personne qui restera
  rationale: Le participe nifal de שׁאר désigne celui qui reste ou qui est laissé. La formulation française conserve cette idée sans préciser davantage pourquoi cette personne ne part pas.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: en quelque lieu qu’elle séjourne
  rationale: La tournure rend la portée distributive de « tous les lieux » et le sens de גוּר, qui peut exprimer un séjour ou une résidence hors du pays d’origine.
- source_word: יְנַשְּׂאֻהוּ
  choice: lui viennent en aide
  rationale: Le verbe נשׂא signifie littéralement « lever, porter », mais l’énumération des ressources indique ici une aide matérielle concrète.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: les hommes de l’endroit
  rationale: Cette traduction conserve le masculin explicite de אַנְשֵׁי, tout en signalant en note que l’expression peut désigner plus largement les habitants ou les voisins.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: avec de l’argent, de l’or
  rationale: « Argent » et « or » rendent les deux métaux précieux sans décider s’il s’agit de métal pesé ou de moyens monétaires.
- source_word: וּבִרְכוּשׁ
  choice: des biens
  rationale: רְכוּשׁ désigne des possessions, notamment des biens transportables.
- source_word: וּבִבְהֵמָה
  choice: du bétail
  rationale: בְּהֵמָה est ici un collectif désignant les animaux domestiques possédés ou employés pour le transport.
- source_word: עִם הַנְּדָבָה
  choice: ainsi qu’avec une offrande volontaire
  rationale: נְדָבָה désigne un don librement consenti. L’article hébreu n’impose pas ici l’article défini en français.
- source_word: לְבֵית הָאֱלֹהִים אֲשֶׁר בִּירוּשָׁלָם
  choice: pour la maison de Dieu qui est à Jérusalem
  rationale: La traduction garde l’expression hébraïque « maison de Dieu » et la proposition qui la situe à Jérusalem.
theological_decisions:
- issue: Portée de l’expression masculine אַנְשֵׁי מְקֹמוֹ
  choice: les hommes de l’endroit
  alternative: les habitants de l’endroit ; ses voisins
  rationale: Le texte hébreu emploie explicitement un nom masculin pluriel. Le texte principal le conserve, tandis que la note reconnaît que l’expression sociale peut avoir une portée plus large.
- issue: Valeur contextuelle de יְנַשְּׂאֻהוּ
  choice: lui viennent en aide
  alternative: le soutiennent ; le portent
  rationale: Le sens littéral « porter » risquerait d’évoquer un transport physique. Le contexte précise que l’aide consiste en argent, or, biens et bétail, ce qui justifie une formulation idiomatique sans déterminer plus précisément l’usage de ces ressources.
- issue: Nature de הַנְּדָבָה
  choice: une offrande volontaire
  alternative: le don volontaire ; l’offrande spontanée
  rationale: La formulation maintient le caractère volontaire de la contribution et sa destination cultuelle, sans lui attribuer un statut rituel plus précis que ne le fait le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure de proclamation et la répétition des moyens matériels, tout en employant l’idiome naturel « venir en aide ». « Séjourne » garde la nuance possible de résidence temporaire liée à גוּר.
