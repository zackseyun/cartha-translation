  text: מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהִ֤י אֱלֹהָי/ו֙ עִמּ֔/וֹ וְ/יַ֕עַל לִ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/יהוּדָ֑ה וְ/יִ֗בֶן אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ה֥וּא הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: fr
  text: 'Quiconque parmi vous fait partie de son peuple, que son Dieu soit avec lui, et qu’il monte à Jérusalem, qui est en Juda, et rebâtisse[a] la maison de Yahweh, le Dieu d’Israël : c’est lui, le Dieu qui est à Jérusalem[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bâtisse ». Le verbe hébreu signifie simplement « bâtir » ; « rebâtisse » explicite le contexte de restauration.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il est le Dieu qui est à Jérusalem ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Quiconque d’entre vous appartient à son peuple
  rationale: מִי a ici une valeur indéfinie dans l’appel royal. Cette formulation française restitue naturellement l’idée distributive de מִכָּל עַמּוֹ sans transformer l’énoncé en simple question ni préciser abusivement le référent du suffixe « son ».
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: que son Dieu soit avec lui !
  rationale: Le jussif יְהִי exprime un souhait ou une bénédiction. Le subjonctif français en conserve le ton solennel.
- source_word: וְיַעַל
  choice: qu’il monte
  rationale: Le verbe עלה est l’expression habituelle pour se rendre à Jérusalem. « Monter » conserve sa nuance géographique et cultuelle.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: à Jérusalem, en Juda
  rationale: Le complément « en Juda » identifie géographiquement Jérusalem avec une tournure française concise et naturelle.
- source_word: וְיִבֶן
  choice: et rebâtisse
  rationale: בנה signifie littéralement « bâtir », mais le contexte du retour d’exil implique la restauration du temple détruit. Une note conserve le sens lexical plus formel.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » préserve l’expression hébraïque, tandis que « Yahweh » rend directement le nom divin יהוה.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction génitivale, qui maintient l’identification du Dieu concerné.
- source_word: הוּא הָאֱלֹהִים
  choice: c’est lui, le Dieu
  rationale: La tournure disloquée rend l’emphase de הוּא et maintient l’article de הָאֱלֹהִים sans produire un français artificiel.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: qui est à Jérusalem
  rationale: La proposition relative est conservée avec toute sa portée locative et rattachée naturellement à « le Dieu ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Portée de la formule localisante אֲשֶׁר בִּירוּשָׁלָם
  choice: c’est lui, le Dieu qui est à Jérusalem
  alternative: c’est lui qui est Dieu à Jérusalem
  rationale: La traduction retenue maintient l’article devant « Dieu » et la localisation telle qu’elle apparaît dans la proclamation de Cyrus, sans l’atténuer ni lui imposer une harmonisation théologique ultérieure.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve le ton d’une proclamation royale tout en évitant un calque pesant. Les tirets isolent la bénédiction jussive, et les deux notes sont placées exactement sur les expressions qu’elles éclairent.
