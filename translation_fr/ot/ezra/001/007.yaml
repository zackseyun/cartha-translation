  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: fr
  text: Le roi Cyrus fit sortir les ustensiles de la maison de Yahweh[a], que Nabuchodonosor avait fait sortir de Jérusalem et déposés dans la maison de son dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « la maison de Yahweh » ; dans ce contexte, elle peut aussi se traduire par « le temple de Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: le roi Cyrus
  rationale: Cet ordre correspond à l’usage naturel du français pour un titre royal suivi d’un nom propre.
- source_word: הוֹצִיא ... הוֹצִיא
  choice: fit sortir ... avait fait sortir
  rationale: La répétition du même verbe hébreu est conservée afin de maintenir le lien entre l’action antérieure de Nabuchodonosor et celle de Cyrus.
- source_word: כְּלֵי
  choice: ustensiles
  rationale: Dans le contexte du sanctuaire, ce terme désigne naturellement les objets servant au culte sans préciser indûment leur forme.
- source_word: בֵית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction conserve l’image hébraïque de la « maison », tout en laissant « temple » comme équivalent contextuel possible.
- source_word: וַיִּתְּנֵם
  choice: et déposés
  rationale: Avec le complément de lieu, נתן exprime ici l’idée de placer ou déposer les objets. Le participe coordonné s’intègre naturellement à la proposition relative française.
- source_word: בְּבֵית אֱלֹהָיו
  choice: dans la maison de son dieu
  rationale: Le singulier et le suffixe masculin singulier sont conservés, ainsi que le parallèle lexical avec la maison de Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte le nom divin personnel. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Identité de la divinité associée à Nabuchodonosor
  choice: son dieu
  alternative: ses dieux
  rationale: L’hébreu est explicitement au singulier ; la traduction ne l’élargit donc pas au panthéon babylonien.
translation_notes:
  register: Français international actuel, sobre et digne. La formulation conserve le parallélisme entre les deux actions de « faire sortir » et entre les deux « maisons », malgré une légère lourdeur voulue par la structure de l’hébreu.
