  text: 30 gold bowls[a], 410 silver bowls of a second kind, and 1,000 other vessels.
translation:
  language: fr
  text: 30 coupes en or, 410 coupes en argent d’une seconde sorte[a], et 1 000 autres objets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « coupes en argent, en double : 410 ». Le terme hébreu traduit par « d’une seconde sorte » est incertain dans ce contexte d’inventaire; il peut désigner une seconde catégorie, des exemplaires doubles ou une forme doublée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: coupes
  rationale: Le nom désigne un type de récipient. « Coupes » est naturel en français moderne et n’en précise pas excessivement la forme.
- source_word: זָהָב
  choice: en or
  rationale: Terme usuel désignant le matériau; la tournure « coupes en or » convient naturellement à un inventaire.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: Le chiffre est employé pour la lisibilité et la cohérence d’une liste d’inventaire.
- source_word: כְּפוֹרֵי כֶסֶף
  choice: coupes en argent
  rationale: Le même nom de récipient est traduit de façon constante; « en argent » en indique le matériau.
- source_word: מִשְׁנִים
  choice: d’une seconde sorte
  rationale: Le sens du terme est incertain dans ce contexte. Cette formulation signale une seconde catégorie sans imposer le sens mathématique de « doubles ».
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: Le nombre composé est présenté en chiffres pour faciliter la lecture de l’inventaire.
- source_word: כֵּלִים
  choice: objets
  rationale: Le terme hébreu est large et peut désigner divers objets ou ustensiles. « Objets » préserve cette généralité dans le contexte de l’inventaire du temple.
- source_word: אֲחֵרִים
  choice: autres
  rationale: Traduction directe qui distingue ces objets des récipients déjà énumérés.
- source_word: אָלֶף
  choice: 1 000
  rationale: Le nombre est présenté en chiffres, avec l’espacement typographique français, par cohérence avec le reste de l’inventaire.
