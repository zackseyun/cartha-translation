id: EZR.4.5
reference: Ezra 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: fr
  text: Ils engagèrent contre eux des conseillers pour faire échouer leur projet[a], pendant tout le règne de Cyrus, roi de Perse, et jusqu’au règne de Darius, roi de Perse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur plan » ou « leur dessein ». Le mot hébreu עֵצָה peut désigner un conseil, un plan, un projet ou un dessein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: Ils engagèrent
  rationale: Le verbe שׂכר désigne ici le fait de payer des personnes pour leurs services. « Engagèrent » est naturel en français et n’introduit pas l’idée plus précise de corruption que porterait « soudoyèrent ».
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: 'Dans ce contexte d’opposition, עַל a une valeur hostile, confirmée par le but exprimé ensuite : faire échouer le projet.'
- source_word: יוֹעֲצִים
  choice: des conseillers
  rationale: Le terme issu de יעץ désigne ceux qui donnent des conseils, probablement dans un cadre politique ou administratif. « Conseillers » en conserve le sens sans précision excessive.
- source_word: לְהָפֵר
  choice: pour faire échouer
  rationale: Le verbe הפר peut signifier rompre, annuler ou mettre en échec. Avec un projet pour objet, « faire échouer » exprime clairement l’obstruction visée.
- source_word: עֲצָתָם
  choice: leur projet
  rationale: עֵצָה peut désigner un conseil, un plan ou un dessein. Dans le contexte des travaux de reconstruction, « projet » est clair et idiomatique, tandis que la note conserve l’ambiguïté lexicale.
- source_word: כָּל יְמֵי
  choice: pendant tout le règne de
  rationale: Littéralement « tous les jours de », cette expression temporelle désigne ici toute la période où Cyrus exerçait le pouvoir. La formulation française évite une lecture excessivement littérale.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Cyrus, roi de Perse
  rationale: Le nom propre est translittéré selon son usage français établi et le titre royal est traduit directement.
- source_word: וְעַד
  choice: et jusqu’au
  rationale: La conjonction et la préposition marquent la continuité de cette opposition jusqu’à la période suivante.
- source_word: מַלְכוּת
  choice: règne
  rationale: Dans cette construction temporelle, מַלְכוּת désigne la période pendant laquelle le roi gouverne, plutôt que son royaume comme territoire.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: Darius, roi de Perse
  rationale: Le nom suit sa forme française usuelle, accompagné du titre traduit conformément à l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la progression temporelle de l’hébreu tout en rendant l’expression « tous les jours de Cyrus » par une tournure française naturelle. Le marqueur [a] figure dans le texte principal.
