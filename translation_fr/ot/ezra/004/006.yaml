  text: וּ/בְ/מַלְכוּת֙ אֲחַשְׁוֵר֔וֹשׁ בִּ/תְחִלַּ֖ת מַלְכוּת֑/וֹ כָּתְב֣וּ שִׂטְנָ֔ה עַל יֹשְׁבֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: fr
  text: Sous le règne d’Assuérus, au début de son règne, ils rédigèrent une accusation[a] contre les habitants de Juda et de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une plainte » ou « une accusation hostile ». Le terme hébreu évoque une opposition formulée sous forme d’accusation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: Sous le règne de
  rationale: La préposition introduit ici un cadre temporel. « Sous le règne de » est naturel en français moderne et exprime la période où le roi gouvernait; la conjonction initiale n’a pas besoin d’être rendue mécaniquement.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuérus
  rationale: La forme française biblique traditionnelle translittère le nom hébreu sans imposer son identification historique courante avec Xerxès.
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: au début de son règne
  rationale: Cette formulation naturelle rend précisément la période initiale de son gouvernement.
- source_word: כָּתְבוּ
  choice: ils rédigèrent
  rationale: Le verbe signifie « écrire »; avec un document d’accusation, « rédigèrent » donne un français idiomatique sans préciser indûment qu’il fut envoyé. Le sujet indéfini pluriel est conservé.
- source_word: שִׂטְנָה
  choice: une accusation
  rationale: Le nom désigne ici une démarche écrite hostile, vraisemblablement formelle. « Accusation » en préserve le caractère concret sans déterminer plus précisément le genre administratif du document.
- source_word: עַל
  choice: contre
  rationale: Avec une accusation, la préposition désigne les personnes visées et se rend naturellement par « contre ».
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: les habitants de Juda et de Jérusalem
  rationale: Le participe substantivé désigne ceux qui résident dans ces lieux. « Habitants » est clair, concis et actuel.
