base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: fr
  text: J’ai donné l’ordre de faire des recherches, et l’on a trouvé que, depuis les temps anciens, cette ville se soulève contre les rois[a] et que la rébellion et la sédition y sont pratiquées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’élève contre les rois ». Le verbe araméen peut évoquer le fait de s’élever soi-même, mais, dans ce contexte, il exprime une opposition au pouvoir royal.
    reason: lexical_alternative
  - marker: b
    text: Ou « que la rébellion et l’insurrection y sont commises ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: J’ai donc donné l’ordre
  rationale: L’expression administrative araméenne signifie littéralement qu’un ordre a été établi de la part du roi. La tournure active est naturelle en français et conserve clairement l’autorité du locuteur.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: de faire des recherches. On a trouvé
  rationale: Ces verbes décrivent la consultation officielle des archives et son résultat. La formulation impersonnelle française rend naturellement le sujet indéfini du pluriel araméen.
- source_word: קִרְיְתָא דָךְ
  choice: cette ville
  rationale: Le démonstratif désigne la ville dont traite la lettre.
- source_word: מִן יוֹמָת עָלְמָא
  choice: depuis les temps anciens
  rationale: Cette expression idiomatique évoque une antiquité reculée dans un français actuel et digne.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: se soulève contre les rois
  rationale: La forme réfléchie peut exprimer le fait de s’élever ou de se dresser. Dans ce contexte politique, « se soulève contre » garde l’idée d’opposition sans la confondre avec le nom explicite « rébellion » qui suit.
- source_word: וּמְרַד וְאֶשְׁתַּדּוּר
  choice: rébellion et sédition
  rationale: Les deux termes appartiennent au champ de l’opposition politique. « Sédition » maintient une distinction avec « rébellion » tout en conservant leur recoupement sémantique.
- source_word: מִתְעֲבֶד בַּהּ
  choice: on y fomente
  rationale: La tournure impersonnelle rend le passif araméen et « fomenter » convient à des actes répétés de rébellion et de sédition, sans suggérer qu’ils surviennent simplement d’eux-mêmes.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne, avec un ton adapté à une lettre administrative royale. Le présent « se soulève » reflète l’état constaté dans les archives, tandis que la formulation impersonnelle évite d’ajouter un acteur absent du texte.
