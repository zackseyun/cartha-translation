  text: Then the people of the land kept weakening the hands of the people of Judah and frightening them from building[a][b].
translation:
  language: fr
  text: Alors, les habitants du pays décourageaient le peuple de Juda[a] et l’intimidaient pour l’empêcher de bâtir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « affaiblir les mains du peuple de Juda », expression qui signifie le décourager ou miner sa détermination.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « et l’effrayaient à propos de la construction ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors
  rationale: Le waw consécutif fait progresser le récit. « Alors » rend cet enchaînement avec naturel en français moderne.
- source_word: עַם הָאָרֶץ
  choice: les habitants du pays
  rationale: Dans ce contexte, l’expression désigne les populations locales qui s’opposent aux Judéens revenus d’exil. « Habitants du pays » est plus idiomatique que le calque « peuple du pays ».
- source_word: מְרַפִּים יְדֵי
  choice: ne cessèrent de saper le courage
  rationale: L’expression signifie littéralement « affaiblir les mains » et décrit une action continue visant à ôter force et résolution. « Saper le courage » en transmet naturellement l’image et la portée.
- source_word: עַם יְהוּדָה
  choice: les gens de Juda
  rationale: Cette formulation désigne clairement et simplement la communauté judéenne occupée à la reconstruction.
- source_word: וּמְבַלְהִים
  choice: et de les effrayer
  rationale: Le participe de בהל exprime le fait de provoquer l’effroi ou l’affolement. « Effrayer » convient au registre et au parallélisme de la phrase.
- source_word: אוֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux gens de Juda.
- source_word: לִבְנוֹת
  choice: pour les empêcher de bâtir
  rationale: Dans le contexte, l’infinitif avec ל désigne l’activité dont les adversaires cherchent à détourner les Judéens. Cette formulation française exprime clairement l’effet recherché, tandis qu’une note conserve une traduction plus proche de la construction hébraïque.
