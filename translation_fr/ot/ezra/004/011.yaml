base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: fr
  text: 'Voici la copie de la lettre qu’ils envoyèrent au roi Artaxerxès : « Tes serviteurs, les hommes d’Au-delà-du-Fleuve[a], et maintenant…[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Au-delà-du-Fleuve » est la désignation administrative perse de la région située à l’ouest de l’Euphrate, aussi appelée « Transeuphratène ».
    reason: lexical_alternative
  - marker: b
    text: L’expression araméenne est une formule épistolaire officielle. Elle peut être comprise comme « et maintenant » ; elle est aussi traditionnellement rendue par « et à telle époque » ou comprise au sens de « et ainsi de suite ». Le texte se poursuit au verset suivant.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה פַּרְשֶׁגֶן
  choice: Voici la copie
  rationale: Le démonstratif présente la citation du document, et פַּרְשֶׁגֶן désigne la copie ou transcription d’un écrit officiel. « Voici la copie » est naturel en français et conserve cette fonction introductive.
- source_word: אִגַּרְתָּא
  choice: de la lettre
  rationale: Le terme désigne ici une communication officielle écrite; « lettre » est l’équivalent français courant et précis.
- source_word: דִּי שְׁלַחוּ
  choice: qu’ils envoyèrent
  rationale: Le relatif introduit la proposition qui qualifie la lettre. Le passé simple convient au registre narratif biblique moderne et à l’action ponctuelle.
- source_word: עֲלוֹהִי עַל אַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: au roi Artaxerxès
  rationale: Dans cette formule épistolaire, les prépositions indiquent le destinataire. L’ordre « roi Artaxerxès » est idiomatique en français.
- source_word: עַבְדָיךְ
  choice: Tes serviteurs
  rationale: Cette autodésignation exprime la déférence de subordonnés envers le roi sans interpréter leur fonction précise comme celle de fonctionnaires.
- source_word: אֱנָשׁ
  choice: les hommes
  rationale: Le nom masculin singulier à valeur collective désigne les hommes qui écrivent; cette traduction conserve la forme lexicale sans l’élargir en « peuple ».
- source_word: עֲבַר נַהֲרָה
  choice: de la province d’Au-delà-du-Fleuve
  rationale: L’expression est la désignation administrative perse du territoire situé à l’ouest de l’Euphrate. L’ajout explicatif « province » rend immédiatement sa fonction sans remplacer le nom traditionnel littéral.
- source_word: וּכְעֶנֶת
  choice: Et maintenant…
  rationale: Il s’agit d’une formule épistolaire qui marque le passage à l’objet de la lettre; les points de suspension signalent que la citation se poursuit au verset suivant.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le ton administratif de la lettre, ainsi que son ouverture laissée en suspens à la fin du verset. Le tutoiement solennel (« Tes serviteurs ») reproduit l’adresse directe au souverain sans lourdeur archaïque.
