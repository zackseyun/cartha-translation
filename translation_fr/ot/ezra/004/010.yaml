  register: Français international moderne, digne et lisible. Le verset demeure un fragment syntaxique poursuivant l’adresse de la lettre commencée aux versets précédents. Les titres honorifiques gardent leur tonalité officielle, et les ambiguïtés historiques et lexicales sont signalées en notes plutôt que résolues dans le texte.
