source:
  edition: WLC
  text: וּ/שְׁאָ֣ר אֻמַּיָּ֗/א דִּ֤י הַגְלִי֙ אָסְנַפַּר֙ רַבָּ֣/א וְ/יַקִּירָ֔/א וְ/הוֹתֵ֣ב הִמּ֔וֹ בְּ/קִרְיָ֖ה דִּ֣י שָׁמְרָ֑יִן וּ/שְׁאָ֥ר עֲבַֽר נַהֲרָ֖/ה וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: fr
  text: 'ainsi que le reste des peuples que le grand et illustre Osnappar[a] a déportés et installés dans la ville de Samarie et dans le reste de l’Outre-Fleuve[b] — et maintenant[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Osnappar est souvent identifié au roi assyrien Assourbanipal, mais le texte conserve ici la forme araméenne du nom.
    reason: cross_reference
  - marker: b
    text: Littéralement « au-delà du Fleuve ». L’Outre-Fleuve était le nom administratif perse de la région située à l’ouest de l’Euphrate.
    reason: cultural_note
  - marker: c
    text: L’expression finale est une formule épistolaire araméenne. On peut aussi la comprendre comme « et ainsi de suite » ou « en ce temps-là ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: le reste des peuples
  rationale: שְׁאָר désigne ce qui reste d’un ensemble, et אֻמַּיָּא des peuples ou groupes de population. Cette formulation conserve le sens collectif et s’insère naturellement dans la suite de l’énumération.
- source_word: הַגְלִי
  choice: a déportés
  rationale: Le verbe désigne un déplacement forcé en exil. « Déporter » exprime avec concision la politique impériale de transfert de populations.
- source_word: אָסְנַפַּר
  choice: Osnappar
  rationale: La forme araméenne du nom propre est conservée dans le texte plutôt que remplacée par une identification historique supposée.
- source_word: רַבָּא וְיַקִּירָא
  choice: le grand et illustre
  rationale: Ces adjectifs sont des titres honorifiques. « Illustre » rend ici la haute considération exprimée par יַקִּירָא dans un registre de cour digne et naturel.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: et installés
  rationale: La forme causative indique qu’Osnappar a établi ces populations dans un nouveau lieu. « Installer » rend clairement cette réimplantation administrative.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: dans la ville de Samarie
  rationale: Le texte araméen porte le singulier « ville »; celui-ci est conservé sans l’harmoniser avec des formulations traditionnelles au pluriel.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: et dans le reste de l’Outre-Fleuve
  rationale: עֲבַר נַהֲרָה est compris comme la désignation administrative perse du territoire situé à l’ouest de l’Euphrate. La majuscule et l’article signalent un nom régional, tandis que « dans » explicite l’ellipse locative naturelle en français.
- source_word: וּכְעֶנֶת
  choice: 'Et maintenant :'
  rationale: 'Cette formule épistolaire araméenne introduit le corps de la lettre. « Et maintenant : » en restitue la fonction discursive tout en préservant sa forme formulaire.'
