- from: 'Mais Zorobabel, Yéchoua et les autres chefs des familles d’Israël leur répondirent : « Ce n’est pas à vous et à nous de bâtir ensemble une maison pour notre Dieu. Nous seuls la bâtirons pour Yahweh, le Dieu d’Israël, comme nous l’a ordonné Cyrus, roi de Perse. »'
  to: 'Mais Zorobabel, Yéchoua et les autres chefs de famille d’Israël leur répondirent : « Vous n’avez pas à bâtir avec nous une maison pour notre Dieu, car nous la bâtirons nous-mêmes pour Yahweh, le Dieu d’Israël, comme nous l’a ordonné Cyrus, roi de Perse. »'
