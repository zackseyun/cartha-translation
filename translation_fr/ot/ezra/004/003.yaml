  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: fr
  text: 'Mais Zorobabel, Yéchoua et les autres chefs de famille d’Israël leur répondirent : « Vous n’avez pas à bâtir avec nous une maison pour notre Dieu, car nous la bâtirons nous-mêmes pour Yahweh, le Dieu d’Israël, comme nous l’a ordonné Cyrus, roi de Perse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: leur répondirent
  rationale: Dans cet échange, אמר introduit une réponse. Le singulier grammatical précédant plusieurs sujets coordonnés se rend naturellement au pluriel en français.
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: Zorobabel, Yéchoua
  rationale: « Zorobabel » est la forme française traditionnelle et intelligible; « Yéchoua » reflète la forme hébraïque יֵשׁוּעַ et la distingue de Josué.
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: et les autres chefs des familles d’Israël
  rationale: L’expression désigne les responsables des groupes familiaux ou lignages; cette formulation conserve la structure sociale sans le calque peu naturel « chefs des pères ».
- source_word: לֹא לָכֶם וָלָנוּ לִבְנוֹת
  choice: Ce n’est pas à vous et à nous de bâtir ensemble
  rationale: La formulation reprend de près la construction hébraïque tout en explicitant en français que le refus porte sur une entreprise commune.
- source_word: בַּיִת לֵאלֹהֵינוּ
  choice: une maison pour notre Dieu
  rationale: « Maison » traduit directement בַּיִת; le contexte montre qu’il s’agit du temple, sans qu’il soit nécessaire de remplacer l’image source.
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: Nous seuls la bâtirons
  rationale: יַחַד signifie littéralement « ensemble », mais, dans le contraste, il désigne ici le groupe judéen agissant sans les partenaires proposés. « Nous seuls » restitue cette force contextuelle.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa fonction dans le texte.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: comme nous l’a ordonné
  rationale: La tournure exprime la conformité au décret royal; « ordonné » convient au contexte officiel.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: Cyrus, roi de Perse
  rationale: Cette forme française naturelle conserve le nom et le titre, sans la répétition stylistiquement lourde de « roi ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve sa valeur de nom personnel plutôt que de le remplacer par un titre.
- issue: Portée exclusive du refus
  choice: « Ce n’est pas à vous et à nous de bâtir ensemble » puis « Nous seuls »
  alternative: « Vous n’avez aucune part avec nous »
  rationale: 'Le choix conserve à la fois la forme relativement sobre de l’hébreu et sa force contextuelle: les interlocuteurs ne participeront pas à la construction. Il n’ajoute pas une affirmation théologique plus générale sur leur statut.'
translation_notes:
  register: Français international moderne, digne et accessible. Le discours reste ferme sans archaïsme. « Maison » préserve la métaphore cultuelle hébraïque, tandis que le contexte du chapitre permet de comprendre qu’il s’agit du temple.
