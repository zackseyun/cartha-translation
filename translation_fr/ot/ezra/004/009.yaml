  text: אֱדַ֜יִן רְח֣וּם בְּעֵל טְעֵ֗ם וְ/שִׁמְשַׁי֙ סָֽפְרָ֔/א וּ/שְׁאָ֖ר כְּנָוָתְ/ה֑וֹן דִּ֠ינָיֵ/א וַ/אֲפַרְסַתְכָיֵ֞/א טַרְפְּלָיֵ֣/א אֲפָֽרְסָיֵ֗/א ארכוי בָבְלָיֵ/א֙ שֽׁוּשַׁנְכָיֵ֔/א ד/הוא עֵלְמָיֵֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: fr
  text: Alors Rehoum, le commandant[a], Shimshaï, le scribe, et leurs autres collègues — les Dinaïtes[b], les Afarsatkites[c], les Tarpélites, les Perses, les gens d’Érek, les Babyloniens, les gens de Suse, c’est-à-dire les Élamites —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens exact de ce titre araméen est incertain. On pourrait aussi traduire « chef de chancellerie » ou « chargé des décrets ».
    reason: alternative_reading
  - marker: b
    text: Ou « les juges ». Le terme araméen peut être compris comme un nom de population ou comme un titre administratif.
    reason: alternative_reading
  - marker: c
    text: Nom de groupe incertain; le terme a aussi été compris comme une désignation de fonctionnaires.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe araméen marquant la progression du récit ou du document; « Alors » exprime naturellement cette succession.
- source_word: רְחוּם
  choice: Rehoum
  rationale: Nom propre translittéré selon les usages courants du français biblique.
- source_word: בְּעֵל טְעֵם
  choice: le commandant
  rationale: Titre administratif discuté, désignant une personne investie d’autorité. « Commandant » reste clair et digne, tandis qu’une note signale l’incertitude précise.
- source_word: שִׁמְשַׁי
  choice: Shimshaï
  rationale: Nom propre translittéré, avec tréma pour guider la prononciation française.
- source_word: סָפְרָא
  choice: le scribe
  rationale: Titre administratif qui peut désigner un scribe ou un secrétaire; « scribe » est direct et bien établi dans le registre biblique.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: leurs autres collègues
  rationale: Rend de façon naturelle le reste des personnes associées à Rehoum et Shimshaï dans ce cadre officiel.
- source_word: דִּינָיֵא
  choice: les Dinaïtes
  rationale: Dans une série dominée par des noms de populations, la translittération préserve l’interprétation ethnique traditionnelle sans transformer avec certitude le terme en fonction administrative.
- source_word: אֲפַרְסַתְכָיֵא
  choice: les Afarsatkites
  rationale: Terme obscur probablement ethnique; la translittération évite de lui attribuer une fonction administrative ou un rang que le texte ne précise pas sûrement.
- source_word: טַרְפְּלָיֵא
  choice: les Tarpélites
  rationale: Nom de groupe d’identification incertaine, rendu par translittération.
- source_word: אֲפָרְסָיֵא
  choice: les Perses
  rationale: Désignation ethnique claire des Perses.
- source_word: ארכוי
  choice: les gens d’Érek
  rationale: Désigne vraisemblablement les habitants d’Érek, ou Uruk; cette formulation est plus transparente en français qu’un gentilé rare.
- source_word: בָבְלָיֵא
  choice: les Babyloniens
  rationale: Gentilé clair et usuel.
- source_word: שׁוּשַׁנְכָיֵא
  choice: les gens de Suse
  rationale: Rend explicitement le gentilé formé sur Suse dans un français naturel.
- source_word: ד הוא עֵלְמָיֵא
  choice: c’est-à-dire les Élamites
  rationale: La formule identifie ou précise les gens de Suse comme Élamites; « c’est-à-dire » conserve cette fonction explicative.
