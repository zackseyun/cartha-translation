  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: fr
  text: Alors, les travaux de la maison de Dieu[a] à Jérusalem cessèrent[b] et restèrent interrompus[c] jusqu’à la deuxième année du règne de Darius, roi de Perse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du temple de Dieu ». Littéralement, « de la maison de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « furent arrêtés ». Le verbe araméen peut exprimer le fait de cesser ou d’être arrêté.
    reason: lexical_alternative
  - marker: c
    text: L’expression indique que l’interruption s’est prolongée, et ne répète pas simplement l’annonce de l’arrêt.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Adverbe narratif araméen marquant la suite des événements; « Alors » est naturel et conserve le lien temporel avec le contexte précédent.
- source_word: בְּטֵלַת עֲבִידַת
  choice: les travaux… cessèrent
  rationale: בטל exprime l’arrêt ou la cessation, et עֲבִידַת désigne ici l’activité liée à la maison de Dieu. Le pluriel français « les travaux » convient naturellement à un chantier sans ajouter explicitement l’idée de construction.
- source_word: בֵּית אֱלָהָא
  choice: la maison de Dieu
  rationale: Traduction transparente de l’expression construite; elle préserve l’image du texte source, tandis que « temple » serait une explicitation contextuelle.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: à Jérusalem
  rationale: La relative araméenne indique ici le lieu. En français, le complément directement rattaché à « maison de Dieu » est plus fluide et ne perd aucune information.
- source_word: וַהֲוָת בָּטְלָא
  choice: et restèrent interrompus
  rationale: La construction avec « être » et la forme de בטל décrit un état qui se prolonge. « Restèrent interrompus » distingue cette durée de la cessation initiale.
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: jusqu’à la deuxième année
  rationale: Rendu idiomatique de la datation araméenne par année de règne.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: du règne de Darius
  rationale: La préposition avec « règne/royauté » introduit une datation royale; cette formulation est claire et usuelle en français.
- source_word: מֶלֶךְ פָּרָס
  choice: roi de Perse
  rationale: Conserve le titre royal apposé et l’ordre sémantique du texte araméen.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Les travaux » est idiomatique pour l’activité menée sur un édifice; « maison de Dieu » maintient la formulation concrète de l’araméen. La distinction entre « cessèrent » et « restèrent interrompus » conserve le passage de l’événement initial à l’état durable.
