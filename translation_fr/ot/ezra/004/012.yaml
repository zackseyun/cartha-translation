  text: יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֣י יְהוּדָיֵ֗/א דִּ֤י סְלִ֨קוּ֙ מִן לְוָתָ֔/ךְ עֲלֶ֥י/נָא אֲת֖וֹ לִ/ירוּשְׁלֶ֑ם קִרְיְתָ֨/א מָֽרָדְתָּ֤/א ו/באישת/א בָּנַ֔יִן ו/שורי אשכללו וְ/אֻשַּׁיָּ֖/א יַחִֽיטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: fr
  text: Que le roi sache que les Juifs[a] qui sont montés de chez vous vers nous sont venus à Jérusalem. Ils rebâtissent cette ville rebelle et méchante, achèvent les murailles et réparent les fondations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Le terme araméen peut désigner les habitants de Juda ou de la Judée aussi bien que les Juifs au sens plus large.
    reason: lexical_alternative
  - marker: b
    text: Ou « posent les fondations » ou « mettent les fondations en place ». L’expression araméenne est difficile et peut désigner soit la réparation de fondations existantes, soit leur mise en place.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: Que le roi sache
  rationale: Formule épistolaire araméenne officielle; cette tournure française est naturelle, formelle et exprime clairement que l’information est portée à la connaissance du roi.
- source_word: יְהוּדָיֵא
  choice: les Juifs
  rationale: Le terme peut désigner les Juifs au sens large ou les habitants de Juda/Judée. « Les Juifs » est ici le rendu français courant, tandis que l’autre possibilité est conservée en note.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: sont montés de chez toi jusqu’à nous
  rationale: Le verbe exprime une montée et la formulation respecte le point de vue des auteurs de la lettre, qui parlent du départ d’auprès du roi et de l’arrivée dans leur région.
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: sont arrivés à Jérusalem
  rationale: Le second verbe précise la destination et reprend naturellement, en français, l’annonce de leur venue.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: cette ville rebelle et malfaisante
  rationale: Les deux adjectifs appartiennent au langage hostile des accusateurs. « Malfaisante » transmet la valeur négative forte de בִאישְׁתָּא sans transformer l’accusation en qualification juridique plus précise.
- source_word: בָּנַיִן
  choice: ils rebâtissent
  rationale: Le contexte est celui de la restauration d’une ville préexistante; « rebâtissent » rend cette situation avec concision.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: achèvent les murailles
  rationale: Le nom désigne les murs défensifs de la ville et le verbe exprime leur achèvement ou leur remise en état complète.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: réparent les fondations
  rationale: L’expression araméenne est difficile. Dans ce contexte de restauration, « réparent » fournit un sens cohérent sans masquer en note la possibilité qu’il s’agisse plutôt de poser ou mettre en place les fondations.
