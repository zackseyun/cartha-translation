  to: Que le roi sache que les Juifs[a] qui sont montés de chez vous vers nous sont venus à Jérusalem. Ils rebâtissent cette ville rebelle et méchante, achèvent les murailles et réparent les fondations[b].
  rationale: Révision limitée au registre d’adresse, à la fluidité de l’expression du mouvement, à une qualification française plus idiomatique de la ville et à la complétude grammaticale de la note. Les ambiguïtés lexicales et le caractère accusateur de la lettre sont préservés.
