    issue: Registre et nuance directionnelle dans « de chez toi jusqu’à nous »
    rationale: Le tutoiement est inadapté à une adresse officielle au roi en français moderne ; « jusqu’à nous » présente aussi « nous » comme le point d’arrivée, ce que le verbe suivant « sont arrivés à Jérusalem » rend lourd. « De chez vous vers nous » est plus naturel tout en préservant la formulation araméenne.
  - severity: low
    issue: « Malfaisante » est peu naturel dans cette collocation
    rationale: Le mot est défendable, mais « ville rebelle et méchante » exprime plus idiomatiquement l’épithète hostile בִּאישׁתָא sans ajouter de précision juridique ou doctrinale.
  - severity: low
    issue: Formulation elliptique de la note b
    rationale: « Posent » sans complément n’est pas une alternative autonome. « Posent les fondations » et « mettent les fondations en place » sont des formulations complètes et claires.
