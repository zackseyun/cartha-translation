base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: fr
  text: Au temps d’Artaxerxès, Bishlam, Mithredath, Tabeel et le reste de ses associés[a] écrivirent à Artaxerxès, roi de Perse. La lettre était écrite en caractères araméens et traduite en araméen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et le reste de leurs associés ». Le suffixe traduit par « ses » est singulier dans le texte, mais il peut renvoyer collectivement au groupe nommé.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « La lettre était écrite en araméen et interprétée (ou traduite) en araméen. » La formulation hébraïque est difficile : elle peut distinguer les caractères de la langue, ou bien l’écriture de la traduction ou de l’interprétation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: Au temps de
  rationale: Cette tournure temporelle rend naturellement l’expression hébraïque « dans les jours de », sans en faire nécessairement une formule technique de règne.
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: Artaxerxès
  rationale: Forme française usuelle du nom du roi perse.
- source_word: כָּתַב
  choice: écrivirent
  rationale: Le verbe signifie simplement « écrire ». Le pluriel est requis en français puisque plusieurs personnes constituent le sujet; aucun objet tel qu’« accusation » n’est ajouté.
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: Bichlam, Mitredath, Tabeel
  rationale: Translittération francisée et lisible des trois noms propres.
- source_word: וּשְׁאָר כנותו
  choice: et le reste de ses collègues
  rationale: שְׁאָר désigne le reste d’un groupe, tandis que le nom rare כנותו est généralement compris au sens de collègues ou associés. Le possessif singulier du texte est conservé.
- source_word: עַל
  choice: à
  rationale: Avec le verbe « écrire » dans ce contexte administratif, la préposition introduit naturellement le destinataire. Cette traduction évite d’imposer ici le sens hostile « contre ».
- source_word: מֶלֶךְ פָּרָס
  choice: roi de Perse
  rationale: Titre royal en apposition à Artaxerxès.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: Le texte de la lettre
  rationale: כְתָב renvoie à l’écrit ou au texte, et le terme rare נִּשְׁתְּוָן à un document écrit, vraisemblablement une lettre.
- source_word: כָּתוּב אֲרָמִית
  choice: était écrit en caractères araméens
  rationale: La répétition d’« araméen » dans les deux membres suggère que le premier peut viser le système d’écriture plutôt que la langue; cette lecture donne un français cohérent tout en étant signalée comme discutée.
- source_word: וּמְתֻרְגָּם אֲרָמִית
  choice: et rédigé en araméen
  rationale: Le participe peut exprimer une traduction, une interprétation ou une formulation linguistique. « Rédigé en araméen » rend ici la distinction probable entre caractères et langue sans présenter cette analyse comme certaine.
