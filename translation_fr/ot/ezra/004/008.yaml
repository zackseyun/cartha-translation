  text: רְח֣וּם בְּעֵל טְעֵ֗ם וְ/שִׁמְשַׁי֙ סָֽפְרָ֔/א כְּתַ֛בוּ אִגְּרָ֥ה חֲדָ֖ה עַל יְרוּשְׁלֶ֑ם לְ/אַרְתַּחְשַׁ֥שְׂתְּא מַלְכָּ֖/א כְּנֵֽמָא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/008.yaml
  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: fr
  text: 'Rehoum, le haut fonctionnaire[a], et Shimshaï, le secrétaire, écrivirent au roi Artaxerxès une lettre contre Jérusalem. En voici le contenu :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chancelier ». Le titre araméen בְּעֵל טְעֵם désigne une fonction officielle, mais son équivalent exact dans l’administration perse est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  choice: le haut fonctionnaire
  rationale: Il s’agit d’un titre administratif araméen dont l’équivalent exact dans l’administration perse demeure incertain. « Haut fonctionnaire » exprime l’autorité officielle sans attribuer à Rehoum une fonction moderne trop précise.
- source_word: סָפְרָא
  choice: le secrétaire
  rationale: Le terme désigne ici un agent chargé de l’écriture et de fonctions administratives. En français moderne, « secrétaire » convient mieux à ce cadre officiel que « scribe », qui pourrait évoquer principalement la copie de textes religieux.
- source_word: כְּתַבוּ
  choice: écrivirent
  rationale: Rend directement le sens du verbe araméen sans ajouter l’idée d’envoi, qui n’est pas exprimée par ce mot.
- source_word: אִגְּרָה חֲדָה
  choice: une lettre
  rationale: Dans cet araméen, חֲדָה peut servir à introduire un nom de manière indéfinie. « Une lettre » est naturel et évite d’insister indûment sur le nombre.
- source_word: עַל יְרוּשְׁלֶם
  choice: contre Jérusalem
  rationale: Le contexte hostile et accusateur favorise la valeur adversative de la préposition, plutôt que le sens neutre « au sujet de Jérusalem ».
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: adressée au roi Artaxerxès
  rationale: La tournure française explicite naturellement le destinataire tout en conservant le titre royal et le nom propre.
- source_word: כְּנֵמָא
  choice: 'En voici le contenu :'
  rationale: Cette formule introduit le texte de la lettre qui suit. La formulation française est claire et idiomatique.
- source_word: רְחוּם
  choice: Rehoum
  rationale: Translittération française usuelle du nom propre.
- source_word: שִׁמְשַׁי
  choice: Shimshaï
  rationale: Translittération adaptée aux conventions du français.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: Artaxerxès
  rationale: Forme française conventionnelle du nom royal.
