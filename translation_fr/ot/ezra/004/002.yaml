  to: 'Ils s’approchèrent alors de Zorobabel et des chefs de famille, et leur dirent : « Bâtissons avec vous, car nous recherchons votre Dieu comme vous, et nous lui offrons des sacrifices[a] depuis l’époque d’Ésar-Haddôn, roi d’Assyrie, qui nous a fait monter ici. »'
  rationale: La révision conserve le sens contextuel affirmatif de la revendication des locuteurs, tout en corrigeant la formulation de la note afin qu’elle représente exactement la difficulté textuelle. Elle rend également le causatif directionnel de « faire monter », simplifie le terme pour les responsables familiaux et emploie une formulation volitive française directe.
