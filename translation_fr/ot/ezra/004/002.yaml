base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: fr
  text: 'Ils s’approchèrent alors de Zorobabel et des chefs de famille, et leur dirent : « Bâtissons avec vous, car nous recherchons votre Dieu comme vous, et nous lui offrons des sacrifices[a] depuis l’époque d’Ésar-Haddôn, roi d’Assyrie, qui nous a fait monter ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu écrit littéralement : « et nous ne sacrifions pas ». Beaucoup comprennent toutefois לֹא, « ne… pas », comme une graphie pour לוֹ, « à lui », ou donnent à la tournure un sens affirmatif conformément au contexte.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: Ils s’approchèrent alors
  rationale: Le verbe נגשׁ exprime ici le mouvement vers Zorobabel et les responsables. « S’approchèrent » est naturel et précis; « alors » marque sobrement la progression narrative du wayyiqtol.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des familles patriarcales
  rationale: L’expression désigne les responsables des groupes familiaux issus d’un ancêtre. Cette formulation conserve la dimension généalogique sans recourir au calque peu naturel « maisons des pères ».
- source_word: נִבְנֶה עִמָּכֶם
  choice: Laissez-nous bâtir avec vous
  rationale: L’imparfait à valeur volitive exprime une proposition ou une demande. « Laissez-nous bâtir » rend cette nuance plus clairement qu’un simple futur.
- source_word: כִּי כָכֶם
  choice: car … comme vous
  rationale: La comparaison porte sur l’action de rechercher Dieu. La syntaxe française place naturellement « comme vous » après le groupe verbal.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: nous recherchons votre Dieu
  rationale: דרשׁ avec ל peut évoquer le fait de chercher, consulter ou honorer Dieu. « Recherchons » préserve cette ampleur sémantique et la coloration religieuse sans imposer « adorons ».
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: et nous lui offrons des sacrifices
  rationale: Le texte consonantique porte לֹא, « ne… pas », mais le contexte appelle généralement la lecture לוֹ, « à lui », reflétée par la tradition de lecture et de nombreuses interprétations. Le texte principal rend le sens contextuel, tandis qu’une note signale la difficulté réelle.
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: depuis l’époque d’Ésar-Haddôn
  rationale: La préposition מִן avec « jours » indique le point de départ temporel. « Depuis l’époque de » est idiomatique en français moderne.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: qui nous a fait venir ici
  rationale: Le participe causatif décrit le roi comme celui qui les a transférés sur place. En français, « fait venir ici » conserve la causation sans introduire un « monter » géographique potentiellement artificiel.
theological_decisions:
- issue: La revendication religieuse des populations installées dans le pays
  choice: 'Rapporter de manière neutre leur affirmation : « nous recherchons votre Dieu » et « nous lui offrons des sacrifices ».'
  alternative: « nous adorons votre Dieu » ou « nous consultons votre Dieu »
  rationale: Le narrateur rapporte leurs paroles sans valider ici leur sincérité ni l’orthodoxie de leur culte. Une traduction neutre préserve la tension que développe le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. « Familles patriarcales » maintient la structure ancestrale du texte sans calque rigide; « Ésar-Haddôn » suit une graphie française traditionnelle. La difficulté textuelle est explicitement conservée en note.
