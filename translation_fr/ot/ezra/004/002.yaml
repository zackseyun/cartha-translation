    issue: Le mouvement causatif de הַמַּעֲלֶה est sous-rendu.
    rationale: « Qui nous a fait venir ici » exprime la causalité, mais efface « monter ». « Qui nous a fait monter ici » conserve les deux éléments sans être artificiel en français biblique moderne.
  - severity: medium
    issue: La note textuelle attribue au texte écrit un pronom absent.
    rationale: Le ketiv וְלֹא אֲנַחְנוּ זֹבְחִים signifie littéralement « et nous ne sacrifions pas ». Le complément « lui » relève de la lecture contextuelle proposée (לוֹ), non de la forme écrite.
  - severity: low
    issue: « Familles patriarcales » est une formulation lourde et interprétative.
    rationale: L'hébreu désigne les chefs des unités familiales/maisons paternelles. « Chefs de famille » est plus naturel et ne projette pas une catégorie moderne particulière.
