source:
  edition: WLC
  text: כְּעַ֗ן יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן מִנְדָּֽה בְל֤וֹ וַ/הֲלָךְ֙ לָ֣א יִנְתְּנ֔וּן וְ/אַפְּתֹ֥ם מַלְכִ֖ים תְּהַנְזִֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: fr
  text: Maintenant, que le roi sache que, si cette ville est rebâtie et si ses murailles sont achevées, ses habitants ne paieront ni tribut, ni impôt, ni droit de passage, et cela finira par porter préjudice aux rois[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et cela finira par réduire les revenus des rois ». L’expression araméenne est concise et difficile; la nature financière du préjudice se déduit du contexte des prélèvements impayés.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Maintenant
  rationale: Adverbe de transition qui introduit ici l’avertissement, sans imposer une valeur strictement déductive.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: que le roi sache
  rationale: Équivalent français naturel et soutenu de la formule officielle araméenne signifiant littéralement « qu’il soit connu du roi ».
- source_word: דִּי הֵן
  choice: que, si
  rationale: Introduit le contenu de l’avis sous la forme d’une condition.
- source_word: קִרְיְתָא דָךְ
  choice: cette ville
  rationale: Conserve la valeur démonstrative de l’araméen et la référence à Jérusalem.
- source_word: תִּתְבְּנֵא
  choice: est rebâtie
  rationale: Dans cette proposition conditionnelle, le présent passif français exprime naturellement l’éventualité envisagée; « rebâtie » indique une reconstruction.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: et si ses murailles sont achevées
  rationale: Le verbe exprime l’achèvement des fortifications; la répétition de « si » clarifie la coordination en français.
- source_word: לָא יִנְתְּנוּן
  choice: ses habitants ne paieront
  rationale: Le verbe signifie littéralement « ils ne donneront pas », mais « payer » convient au contexte fiscal. « Ses habitants » explicite le sujet pluriel implicite sans changer le sens.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: ni tribut, ni impôt, ni droit de passage
  rationale: Ces trois termes administratifs désignent des prélèvements distincts. Cette formulation française maintient la série tout en restant intelligible.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: et cela finira par porter préjudice aux rois
  rationale: La formule est concise et lexicalement difficile. Cette traduction conserve l’idée générale d’une perte infligée aux rois sans limiter le préjudice aux seules recettes, précision qui dépend du contexte fiscal.
