  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: fr
  text: Puisque nous mangeons le sel du palais[a] et qu’il ne nous convient pas de voir le déshonneur du roi, nous avons donc envoyé et informé le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nous mangeons le sel du palais » ; expression indiquant qu’ils étaient au service du palais ou entretenus par lui.'
    reason: L’image idiomatique est conservée dans le texte, mais son sens social et politique risque de ne pas être évident pour le lecteur moderne.
lexical_decisions:
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: nous mangeons le sel du palais
  rationale: Conserve l’image araméenne exprimant la dépendance et la loyauté envers le palais, tout en employant une formulation française intelligible avec une note explicative.
- source_word: עַרְוַת מַלְכָּא
  choice: le déshonneur du roi
  rationale: Le terme désigne littéralement la nudité, mais prend ici le sens figuré de honte, d’affront ou de perte de prestige.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  choice: nous avons donc envoyé ce message pour en informer le roi
  rationale: Rend naturellement en français l’envoi de la communication et son but, le complément de « envoyé » étant implicite dans le contexte épistolaire.
