  variant: modern international French
source:
  edition: WLC
  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: fr
  text: Alors, dès que la copie de la lettre du roi Artaxerxès eut été lue devant Rehoum, Shimshaï le secrétaire et leurs collègues, ils se rendirent en toute hâte à Jérusalem, auprès des Juifs[a], et les contraignirent à cesser par la force et la puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre les Juifs » ; la préposition araméenne peut exprimer un mouvement hostile, comme le confirme l’action qui suit.
    reason: lexical_alternative
  - marker: b
    text: Ou « et les firent cesser par la force et la puissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe narratif araméen qui marque l’étape suivante du récit; « Alors » est naturel et conserve l’enchaînement.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: la copie de la lettre
  rationale: פַּרְשֶׁגֶן désigne une copie ou transcription, et נִשְׁתְּוָנָא une communication officielle écrite.
- source_word: קֱרִי קֳדָם
  choice: eut été lue devant
  rationale: Le contexte appelle une lecture passive en présence des fonctionnaires; le passé antérieur rend naturellement l’antériorité immédiate après « dès que ».
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: Rehoum, le secrétaire Shimshaï et leurs collègues
  rationale: סָפְרָא peut désigner un scribe ou un secrétaire; dans ce cadre administratif, « secrétaire » est clair et actuel. כְנָוָתְהוֹן désigne leurs associés ou collègues.
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: ils se rendirent en toute hâte
  rationale: La formulation conserve à la fois le déplacement et l’urgence exprimée par le nom abstrait.
- source_word: עַל יְהוּדָיֵא
  choice: auprès des Juifs
  rationale: עַל peut indiquer la destination ou un mouvement hostile. « Auprès des Juifs » reste naturel sans trancher explicitement, tandis que l’action coercitive qui suit manifeste l’hostilité.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: les forcèrent à interrompre les travaux
  rationale: La forme verbale exprime la causation. L’ajout explicatif « les travaux » restitue l’objet sous-entendu par le contexte immédiat.
- source_word: בְּאֶדְרָע וְחָיִל
  choice: par la contrainte et la force
  rationale: L’expression évoque une cessation imposée par une puissance coercitive; cette traduction française préserve le doublet sans littéraliser « bras ».
