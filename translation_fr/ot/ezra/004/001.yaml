  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: fr
  text: Les adversaires de Juda et de Benjamin apprirent que les fils de l’exil[a] construisaient un temple pour Yahweh, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les fils de l’exil »; c’est-à-dire la communauté de ceux qui avaient été emmenés en exil et en étaient revenus.'
    reason: L’expression hébraïque est conservée dans le texte, mais son sens collectif et historique mérite d’être explicité.
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: apprirent
  rationale: Dans ce récit au passé, le verbe indique qu’ils reçurent cette information. « Apprirent » est naturel en français et évite l’ajout de « dire », absent de l’hébreu.
- source_word: צָרֵי
  choice: les adversaires
  rationale: Le pluriel construit désigne des personnes ou des groupes hostiles. « Adversaires » conserve cette hostilité sans lui donner nécessairement un caractère militaire.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: Juda et Benjamin
  rationale: Ces noms de tribus et de territoires sont rendus selon leurs formes françaises usuelles.
- source_word: כִּי
  choice: que
  rationale: Ici, כִּי introduit le contenu de ce qu’ils apprirent, et non une proposition causale.
- source_word: בְנֵי הַגּוֹלָה
  choice: les fils de l’exil
  rationale: Cette traduction garde visible l’expression collective hébraïque, qui rattache la communauté à l’exil, sans préciser dans le texte qu’il s’agit de personnes revenues d’exil.
- source_word: בּוֹנִים
  choice: construisaient
  rationale: Le participe exprime une action en cours dans un cadre narratif passé. « Reconstruisaient » ajouterait une nuance qui n’est pas exprimée par ce verbe.
- source_word: הֵיכָל
  choice: un temple
  rationale: Bien que le mot puisse désigner un palais, la destination explicitement cultuelle impose ici le sens de « temple ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique ici le destinataire ou la destination de la construction; « pour » est idiomatique en français.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette formulation rend directement la chaîne construite hébraïque et identifie Yahweh comme le Dieu d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le traite comme le nom divin plutôt que de le remplacer par un titre; cette forme suit aussi la couche de consultation fournie.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide tout en conservant l’expression hébraïque marquante « les fils de l’exil ». Aucun marqueur initial tel que « Or » ou « Alors » n’a été ajouté, puisque le texte source ne comporte pas de mot temporel explicite correspondant.
