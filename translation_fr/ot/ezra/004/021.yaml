revisions:
- from: Maintenant, donnez l’ordre d’arrêter ces hommes, et que cette ville ne soit pas rebâtie jusqu’à ce que j’en donne l’ordre.
  to: Maintenant, émettez un décret pour que ces hommes cessent, et que cette ville ne soit pas rebâtie jusqu’à ce qu’un décret de ma part soit promulgué.
  rationale: La révision élimine l’ambiguïté majeure d’« arrêter ces hommes » tout en conservant la portée causative de l’araméen. Elle rend aussi la décision ultérieure comme un décret provenant du roi, conformément à la formulation source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:48:40Z'
review_pass:
  verdict: revise
  source_fidelity: La phrase conserve bien l’ordre immédiat, l’arrêt imposé aux « ces hommes », l’interdiction de rebâtir la ville et la limite temporelle liée à une décision venant du roi. Toutefois, « donner l’ordre d’arrêter ces hommes » se comprend normalement en français comme ordonner leur arrestation, alors que l’araméen exprime le fait de les faire cesser.
  naturalness: Le registre administratif royal est approprié. « Émettez un décret pour que ces hommes cessent » évite l’ambiguïté d’« arrêter ces hommes » et reste naturel. « Jusqu’à ce qu’un décret de ma part soit promulgué » rend explicitement l’origine royale de la future décision sans employer un calque pesant.
  terminology: « Décret » convient à טְעֵם dans ce contexte administratif. « Rebâtie » est idiomatique et fidèle au passif. La formulation révisée maintient l’indétermination de la décision future, plutôt que de la présenter simplement comme un ordre personnel déjà formulé.
  issues:
  - severity: medium
    issue: « Donner l’ordre d’arrêter ces hommes » est ambigu.
    rationale: En français moderne, « arrêter des hommes » signifie habituellement les interpeller ou les mettre en état d’arrestation. Le verbe araméen causatif demande ici de faire cesser leur action, non de les arrêter au sens policier.
  - severity: low
    issue: « Jusqu’à ce que j’en donne l’ordre » explicite activement la décision future.
    rationale: Le sens reste globalement juste, mais l’araméen parle d’un décret qui sera établi « de ma part ». Une formulation passive avec « décret » conserve plus exactement le lexique et la structure administrative.
  revised_text: Maintenant, émettez un décret pour que ces hommes cessent, et que cette ville ne soit pas rebâtie jusqu’à ce qu’un décret de ma part soit promulgué.
  revised_footnotes: []
  revision_rationale: La révision élimine l’ambiguïté majeure d’« arrêter ces hommes » tout en conservant la portée causative de l’araméen. Elle rend aussi la décision ultérieure comme un décret provenant du roi, conformément à la formulation source.
