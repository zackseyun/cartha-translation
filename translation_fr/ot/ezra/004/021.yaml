  text: כְּעַן֙ שִׂ֣ימוּ טְּעֵ֔ם לְ/בַטָּלָ֖א גֻּבְרַיָּ֣/א אִלֵּ֑ךְ וְ/קִרְיְתָ֥/א דָךְ֙ לָ֣א תִתְבְּנֵ֔א עַד מִנִּ֖/י טַעְמָ֥/א יִתְּשָֽׂם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/021.yaml
  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: fr
  text: Maintenant, émettez un décret pour que ces hommes cessent, et que cette ville ne soit pas rebâtie jusqu’à ce qu’un décret de ma part soit promulgué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: Maintenant
  rationale: Cet adverbe araméen introduit l’ordre immédiat du roi; « Maintenant » en conserve la force sans ajouter un lien logique.
- source_word: שִׂימוּ טְּעֵם
  choice: donnez l’ordre
  rationale: L’expression signifie littéralement « établir une décision/un ordre ». « Donner l’ordre » est naturel en français et convient au contexte administratif royal.
- source_word: לְבַטָּלָא
  choice: d’arrêter
  rationale: L’infinitif exprime ici le fait de faire cesser l’activité des hommes; en français, la construction « donner l’ordre d’arrêter ces hommes » rend clairement cette valeur.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: ces hommes
  rationale: Traduction directe et contextuellement appropriée de l’expression araméenne.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: et que cette ville ne soit pas rebâtie
  rationale: Le passif est conservé, ainsi que la coordination de la source. Le subjonctif français prolonge naturellement la portée de l’ordre royal.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: jusqu’à ce que j’en donne l’ordre
  rationale: La formulation araméenne est littéralement « jusqu’à ce que, de ma part, un ordre soit établi ». La tournure active française indique clairement que le nouvel ordre doit venir du roi.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible, avec un registre administratif adapté à un décret royal. La formulation évite le calque lourd « qu’un décret soit émis par moi » tout en préservant l’autorité personnelle du roi et la portée temporaire de l’interdiction.
