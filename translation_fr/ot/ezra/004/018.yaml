  text: נִשְׁתְּוָנָ֕/א דִּ֥י שְׁלַחְתּ֖וּן עֲלֶ֑י/נָא מְפָרַ֥שׁ קֱרִ֖י קָדָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/018.yaml
  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: fr
  text: Le document que vous nous avez envoyé a été lu distinctement devant moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La lettre que vous nous avez envoyée a été lue distinctement devant moi. »'
    reason: Alternative lexicale pour נִשְׁתְּוָנָא (« lettre » au lieu de « document »).
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: le document
  rationale: Terme araméen administratif désignant une communication écrite officielle. « Document » convient au contexte tout en restant assez large; « lettre » demeure possible.
- source_word: דִּי
  choice: que
  rationale: Particule relative introduisant la proposition qui précise « document »; « que » est la tournure française naturelle.
- source_word: שְׁלַחְתּוּן
  choice: vous avez envoyé
  rationale: Parfait araméen à la deuxième personne du masculin pluriel. Le passé composé convient à une réponse portant sur un envoi récemment reçu.
- source_word: עֲלֶינָא
  choice: nous
  rationale: Dans ce contexte épistolaire, la préposition indique naturellement le destinataire de l'envoi; le pronom français se construit directement avec « envoyer ».
- source_word: מְפָרַשׁ
  choice: clairement
  rationale: Le terme exprime une lecture distincte ou explicite, sans imposer l'idée plus précise d'une traduction ou d'une interprétation.
- source_word: קֱרִי
  choice: a été lu
  rationale: 'Le contexte appelle un sens passif: le document a été lu en présence du roi. Le passé composé conserve le lien avec sa réponse immédiate.'
- source_word: קָדָמָי
  choice: devant moi
  rationale: Expression de cour indiquant qu'une action a eu lieu en présence du roi; « devant moi » en garde la forme concise et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et administratif. La formulation conserve l'alternance entre « nous » (destinataire institutionnel ou royal) et « moi » (présence personnelle du roi), ainsi que l'ambiguïté de מְפָרַשׁ quant à la nature exacte de la lecture claire.
