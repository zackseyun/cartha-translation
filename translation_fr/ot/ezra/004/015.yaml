  verdict: revise
  source_fidelity: La traduction restitue avec précision la requête administrative, les archives, l’accusation portée contre la ville et l’antiquité alléguée des actes séditieux. Toutefois, le futur indicatif (« Tu trouveras », « tu apprendras ») affaiblit la dépendance à la requête introduite par « afin que », et le présent « on y fomente » introduit une nuance actuelle et habituelle qui n’est pas requise par l’araméen.
  naturalness: Le français est globalement clair et d’un registre administratif approprié. Une seule phrase syntaxiquement liée rend mieux le rapport de finalité. « La sédition y est pratiquée » est naturel, formel et évite de choisir sans nécessité entre l’idée de révolte fomentée et celle d’activité séditieuse exercée.
  terminology: « Livre des archives », « tes pères », « ville rebelle », « nuisible aux rois et aux provinces » et « temps anciens » conviennent. « Sédition » rend bien l’accusation politique et la note conserve l’ambiguïté de la collocation araméenne difficile.
  issues:
