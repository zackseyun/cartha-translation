    issue: Mode verbal et articulation de la demande
    rationale: Le texte présente la recherche et le résultat attendu comme une séquence dépendante de la pétition. Le futur indicatif après une phrase close (« Tu trouveras … tu apprendras ») le transforme en prédiction autonome. Le subjonctif après « afin que » restitue plus exactement cette relation.
  - severity: medium
    issue: Aspect de l’activité séditieuse
    rationale: « On y fomente la révolte » au présent suggère une activité en cours. La forme araméenne est difficile et peut désigner une sédition exercée ou fomentée dans la ville depuis longtemps; « la sédition y est pratiquée » préserve cette portée sans imposer l’idée d’une action présente.
