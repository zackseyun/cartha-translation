  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: fr
  text: afin qu’on fasse des recherches dans le livre des archives de tes pères[a], et que tu trouves dans le livre des archives et saches que cette ville est une ville rebelle, nuisible aux rois et aux provinces, et que la sédition y est pratiquée depuis les temps anciens[b]. C’est pour cette raison que cette ville a été détruite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes ancêtres » ou « tes prédécesseurs »; littéralement « tes pères ».
    reason: lexical_alternative
  - marker: b
    text: L’expression araméenne est difficile; elle évoque la sédition ou la révolte pratiquée ou fomentée à l’intérieur de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: que l’on fasse des recherches
  rationale: La tournure impersonnelle convient à la demande administrative introduite par דִּי et restitue le ton déférent de la lettre.
- source_word: סְפַר דָּכְרָנַיָּא
  choice: le livre des archives
  rationale: L’expression désigne un registre officiel écrit. « Livre des archives » conserve l’image concrète du document tout en restant naturel en français.
- source_word: אֲבָהָתָךְ
  choice: tes pères
  rationale: Traduction littérale qui conserve la formulation du texte; dans ce contexte, elle peut désigner les ancêtres ou les prédécesseurs royaux, précisés en note.
- source_word: וּתְהַשְׁכַּח
  choice: tu trouveras
  rationale: Le futur français exprime naturellement le résultat attendu de la recherche, sans alourdir la phrase.
- source_word: וְתִנְדַּע
  choice: tu apprendras
  rationale: Le verbe indique ici l’accès à une connaissance par consultation des archives; « apprendras » est naturel dans ce contexte.
- source_word: קִרְיְתָא דָךְ
  choice: cette ville
  rationale: Le démonstratif renvoie à Jérusalem, ville dont traite la lettre.
- source_word: קִרְיָא מָרָדָא
  choice: une ville rebelle
  rationale: Cette formulation idiomatique préserve l’accusation d’insoumission envers le pouvoir impérial.
- source_word: מְהַנְזְקַת
  choice: nuisible à
  rationale: Le participe décrit ce qui cause du tort ou des pertes; « nuisible » en garde la portée politique et économique.
- source_word: מַלְכִין וּמְדִנָן
  choice: aux rois et aux provinces
  rationale: « Provinces » désigne clairement les circonscriptions administratives de l’empire.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: on y fomente la révolte
  rationale: La collocation araméenne difficile évoque une activité séditieuse pratiquée ou suscitée dans la ville. Cette traduction française en communique le sens sans prétendre lever entièrement l’incertitude lexicale.
- source_word: בְּגַוַּהּ
  choice: y
  rationale: Le pronom adverbial renvoie naturellement à l’intérieur de la ville.
- source_word: מִן יוֹמָת עָלְמָא
  choice: depuis les temps anciens
  rationale: L’expression désigne une antiquité lointaine, non l’éternité au sens métaphysique.
- source_word: הָחָרְבַת
  choice: a été détruite
  rationale: Le passif exprime la dévastation de la ville et correspond à la forme araméenne.
