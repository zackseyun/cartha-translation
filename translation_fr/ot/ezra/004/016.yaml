source:
  edition: WLC
  text: מְהוֹדְעִ֤ין אֲנַ֨חְנָה֙ לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן לָ/קֳבֵ֣ל דְּנָ֔ה חֲלָק֙ בַּ/עֲבַ֣ר נַהֲרָ֔/א לָ֥א אִיתַ֖י לָֽ/ךְ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: fr
  text: Nous faisons savoir au roi que, si cette ville est rebâtie et si ses murailles sont achevées, alors, pour cette raison, tu n’auras aucune part[b] au-delà du Fleuve[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Au-delà du Fleuve » était le nom administratif perse du territoire situé à l’ouest de l’Euphrate.
    reason: cultural_note
  - marker: b
    text: Le mot araméen peut aussi se traduire par « portion » ou, plus précisément dans ce contexte, par « revenus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא
  choice: Nous faisons savoir au roi
  rationale: La tournure garde le registre officiel de la lettre et rend la construction araméenne avec participe verbal et complément indirect.
- source_word: דִּי הֵן
  choice: que, si
  rationale: Ces particules introduisent le contenu du rapport sous la forme d’une condition, sans ajouter la nuance emphatique possible de « voici ».
- source_word: קִרְיְתָא דָךְ תִּתְבְּנֵא
  choice: cette ville est rebâtie
  rationale: Le démonstratif est conservé, et le passif exprime naturellement en français une éventualité future dans la proposition conditionnelle.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: et ses murailles achevées
  rationale: « Murailles » convient aux fortifications urbaines, tandis que « achevées » rend l’idée d’un ouvrage mené à son terme. L’ellipse de « sont » est naturelle après « est rebâtie ».
- source_word: לָקֳבֵל דְּנָה
  choice: alors, pour cette raison
  rationale: Cette formulation maintient à la fois le lien logique avec la condition et le démonstratif explicite de l’araméen.
- source_word: חֲלָק
  choice: part
  rationale: « Part » conserve la portée large du nom araméen, qui peut désigner une part, un droit ou, dans ce contexte administratif, des revenus, sans trancher excessivement.
- source_word: בַּעֲבַר נַהֲרָא
  choice: au-delà du Fleuve
  rationale: La traduction reste proche de la forme araméenne et la majuscule à « Fleuve » signale qu’il s’agit ici de l’Euphrate et d’une désignation administrative perse.
- source_word: לָא אִיתַי לָךְ
  choice: tu n’auras aucune
  rationale: La construction existentielle avec possession est rendue idiomatiquement. Le tutoiement conserve l’adresse directe au roi exprimée par le pronom araméen de deuxième personne.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible, avec maintien du ton formel d’une lettre officielle. La formulation conserve le passage de « au roi » à l’adresse directe « tu », présent dans l’araméen, ainsi que l’ambiguïté administrative de חֲלָק.
