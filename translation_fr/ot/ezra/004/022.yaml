  yaml_path: translation/ot/ezra/004/022.yaml
  text: And be careful not to neglect doing this[b][a]. Why should the damage increase to the detriment of kings?
translation:
  language: fr
  text: Veillez à ne pas négliger d’exécuter cet ordre[a]. Pourquoi le préjudice s’accroîtrait-il au détriment des rois[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prenez garde à ne pas manquer de faire cela. »'
    reason: lexical_alternative
  - marker: b
    text: L’araméen porte le pluriel « rois », qui peut viser plus largement les intérêts de la royauté ou de la dynastie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: Veillez
  rationale: L’adjectif araméen « vigilants, prudents », associé au verbe « être », forme ici une exhortation à la vigilance. « Veillez » restitue naturellement sa force impérative en français.
- source_word: שָׁלוּ
  choice: avec négligence
  rationale: Le terme désigne la négligence ou le relâchement. Cette formulation s’intègre clairement à l’interdiction sans suggérer un simple oubli involontaire.
- source_word: לְמֶעְבַּד עַל דְּנָה
  choice: agir … dans cette affaire
  rationale: L’infinitif de « faire » et la locution démonstrative renvoient à l’exécution de la directive royale qui précède. « Dans cette affaire » explicite ce renvoi sans ajouter de contenu.
- source_word: לְמָה יִשְׂגֵּא
  choice: Pourquoi … s’accroîtrait-il
  rationale: La tournure conserve la question rhétorique et rend idiomatiquement le verbe « devenir grand, augmenter ».
- source_word: חֲבָלָא
  choice: le préjudice
  rationale: Dans ce contexte administratif, le mot désigne le dommage ou le tort qui résulterait de la désobéissance. « Préjudice » convient aussi à la construction suivante.
- source_word: לְהַנְזָקַת
  choice: au détriment de
  rationale: Le nom araméen exprime un dommage ou une perte, avec la préposition indiquant ici le désavantage ou le résultat nuisible.
- source_word: מַלְכִין
  choice: des rois
  rationale: Le pluriel explicite de l’araméen est conservé au lieu d’être harmonisé avec le roi qui parle.
