review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’autorité sur Jérusalem, l’étendue de la domination à tout l’« Au-delà du Fleuve », ainsi que la formule administrative des trois prélèvements. Toutefois, « ont régné » et « dominé » au passé composé interprètent plus fortement la forme stative « étaient / exerçaient l’autorité » et la coordination française actuelle est moins nette que le parallélisme araméen.
  naturalness: « Dominer sur tout le territoire » est lourd et « territoire » ajoute un nom absent du texte. « Au-delà du Fleuve » est une forme française plus naturelle et lisible que le composé à traits d’union. Une formulation avec deux verbes à l’imparfait rend naturellement la situation historique décrite.
  terminology: « Tribut, impôt et droit de passage » conserve bien la distinction des trois catégories de recettes sans prétendre en définir avec excès la nature exacte. « Au-delà du Fleuve » signale de façon intelligible la désignation administrative perse; la note précise sa référence à l’ouest de l’Euphrate.
