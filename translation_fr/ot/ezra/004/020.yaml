  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: fr
  text: De puissants rois régnaient sur Jérusalem et dominaient tout l’Au-delà du Fleuve[a] ; tribut, impôt et droit de passage[b] leur étaient versés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur tout l’Au-delà du Fleuve » ; cette expression est la désignation officielle du territoire impérial situé à l’ouest de l’Euphrate.
    reason: cultural_note
  - marker: b
    text: 'Les trois termes « tribut, impôt et droit de passage » désignent des catégories distinctes de revenus impériaux. Autres traductions possibles : « tribut, taxe et péage » ou « tribut, impôt et droit de douane ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: de puissants rois
  rationale: Le nom pluriel et l’adjectif araméens désignent des rois forts ou puissants ; cette formulation est naturelle et digne en français.
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: ont régné sur Jérusalem
  rationale: Littéralement « étaient sur Jérusalem » ; dans ce contexte politique, עַל exprime l’autorité. « Ont régné sur » rend clairement cette valeur sans suggérer une simple présence dans la ville.
- source_word: שַׁלִּיטִין
  choice: dominé
  rationale: Le terme exprime l’exercice de la souveraineté ou de la domination. Coordonné à « ont régné », l’infinitif passé sous-entendu donne une phrase française fluide.
- source_word: בְּכֹל עֲבַר נַהֲרָה
  choice: sur tout le territoire d’Au-delà-du-Fleuve
  rationale: « Au-delà-du-Fleuve » est la désignation administrative du territoire situé à l’ouest de l’Euphrate. L’ajout explicatif « territoire » rend la référence intelligible en français tout en conservant le nom officiel.
- source_word: מִדָּה
  choice: tribut
  rationale: Dans cette formule administrative araméenne, le terme désigne une contribution imposée par l’autorité impériale ; « tribut » en est l’équivalent traditionnel précis.
- source_word: בְלוֹ
  choice: impôt
  rationale: Le mot désigne une catégorie fiscale distincte au sein d’une série de trois prélèvements. « Impôt » est clair et suffisamment général.
- source_word: הֲלָךְ
  choice: droit de passage
  rationale: Le terme paraît désigner une taxe liée au transport, aux routes ou au transit. « Droit de passage » distingue naturellement ce prélèvement du tribut et de l’impôt.
- source_word: מִתְיְהֵב לְהוֹן
  choice: leur étaient versés
  rationale: La forme passive signifie que ces revenus leur étaient donnés ou remis. « Versés » convient particulièrement à des paiements, et le pluriel français s’accorde avec l’énumération.
