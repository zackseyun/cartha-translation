  - severity: low
    issue: Ajout de « territoire » et graphie du nom administratif
    rationale: Le substantif « territoire » n’est pas exprimé dans l’araméen. « Au-delà du Fleuve », sans traits d’union, est plus naturel en français moderne tout en pouvant être traité comme une désignation administrative par la majuscule et la note.
