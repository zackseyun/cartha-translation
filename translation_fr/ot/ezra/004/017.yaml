source:
  edition: WLC
  text: פִּתְגָמָ֞/א שְׁלַ֣ח מַלְכָּ֗/א עַל רְח֤וּם בְּעֵל טְעֵם֙ וְ/שִׁמְשַׁ֣י סָֽפְרָ֔/א וּ/שְׁאָר֙ כְּנָוָ֣תְ/ה֔וֹן דִּ֥י יָתְבִ֖ין בְּ/שָֽׁמְרָ֑יִן וּ/שְׁאָ֧ר עֲבַֽר נַהֲרָ֛/ה שְׁלָ֖ם וּ/כְעֶֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: fr
  text: 'Le roi envoya une réponse à Rehoum, le haut fonctionnaire[a], à Shimshaï, le secrétaire, ainsi qu’au reste de leurs collègues qui habitent à Samarie et au reste de ceux qui sont au-delà du Fleuve[b] : « Paix[c]. Et maintenant… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chancelier ». Le sens précis de ce titre administratif araméen est incertain.
    reason: lexical_alternative
  - marker: b
    text: L’expression « au-delà du Fleuve » désigne la région de l’Empire perse située à l’ouest de l’Euphrate.
    reason: cultural_note
  - marker: c
    text: Ou « Salutations ! »
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: une réponse
  rationale: Dans ce contexte administratif araméen, le terme désigne une communication officielle. Puisqu’elle répond à la lettre précédente, « réponse » rend clairement sa fonction sans en faire nécessairement un décret.
- source_word: שְׁלַח
  choice: envoya
  rationale: Équivalent narratif direct et naturel du verbe « envoyer ».
- source_word: מַלְכָּא
  choice: le roi
  rationale: La forme définie renvoie au roi perse déjà mentionné dans le contexte.
- source_word: עַל
  choice: à
  rationale: Après « envoya une réponse », la préposition introduit idiomatiquement les destinataires.
- source_word: בְּעֵל טְעֵם
  choice: le haut fonctionnaire
  rationale: Le titre administratif est incertain; cette formulation moderne indique une fonction élevée sans attribuer au personnage une charge institutionnelle trop précise.
- source_word: סָפְרָא
  choice: le secrétaire
  rationale: Dans cette correspondance administrative, « secrétaire » rend naturellement le rôle officiel de rédacteur ou de greffier; « scribe » reste possible.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: le reste de leurs collègues
  rationale: L’expression désigne les autres personnes associées aux deux fonctionnaires dans leur activité officielle.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: qui habitent à Samarie
  rationale: Le participe exprime la résidence; cette traduction est simple et actuelle.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: et ailleurs dans la région située au-delà du Fleuve
  rationale: Le texte dit littéralement « et le reste au-delà du Fleuve ». « Ailleurs dans la région » explicite en français le contraste avec Samarie sans ajouter le mot technique « province »; « le Fleuve » désigne ici l’Euphrate.
- source_word: שְׁלָם
  choice: Paix !
  rationale: La traduction conserve le sens lexical de la formule épistolaire araméenne, tout en la présentant comme une salutation.
- source_word: וּכְעֶת
  choice: Et maintenant…
  rationale: Cette formule introduit le corps de la réponse, qui se poursuit au verset suivant; les points de suspension signalent cette continuité.
theological_decisions: []
