revisions:
- from: Que nos chefs représentent donc toute l’assemblée. Que tous ceux qui, dans nos villes, ont pris des femmes étrangères[a] viennent à des dates fixées, accompagnés des anciens de chaque ville et de ses juges, jusqu’à ce que l’ardente colère de notre Dieu se détourne de nous dans cette affaire[b].
  to: Que nos responsables se tiennent pour toute l’assemblée. Que tous ceux qui, dans nos villes, ont épousé des femmes étrangères[a] viennent à des moments fixés, avec les anciens de chaque ville et ses juges, jusqu’à ce que l’ardente colère de notre Dieu se détourne de nous à cause de cette affaire[b].
  rationale: La révision rapproche le premier verbe de l’image hébraïque de « se tenir », rend explicitement la relation matrimoniale portée par le contexte, et rattache plus naturellement la colère divine à l’affaire visée. Les deux notes conservent leurs ancres et leurs fonctions, sans introduire d’interprétation confessionnelle.
