review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : proposition adressée aux responsables, comparution échelonnée des personnes concernées avec les autorités locales, et objectif d’écarter la colère divine. Toutefois, « représentent donc » interprète יַעַמְדוּ de manière plus institutionnelle que nécessaire et « dans cette affaire » rattache moins naturellement la dernière expression au motif de la colère.'
  naturalness: Le français est globalement clair et de registre approprié. « Se tiennent pour toute l’assemblée » est ici une manière plus proche du verbe hébreu tout en restant intelligible. « À des moments fixés » convient mieux que « à des dates fixées », car le texte vise des séances ou occasions désignées, sans exiger des dates au sens strict.
  terminology: « Responsables », « anciens », « juges », « épouses étrangères » et « ardente colère de notre Dieu » sont adaptés au contexte administratif et au registre biblique moderne. « Épouses étrangères » explicite la valeur matrimoniale de נשים dans ce contexte sans recourir à une expression française maladroite comme « prendre des femmes ».
  issues:
  - severity: medium
    issue: « représentent donc » pour יַעַמְדוּ נָא
    rationale: Le verbe signifie littéralement « se tenir / prendre position » et, dans ce cadre, suggère que les responsables se tiennent en fonction pour l’assemblée. « Représenter » est possible comme implication, mais il explicite une conception de mandat qui n’est pas directement exprimée.
  - severity: low
    issue: « dans cette affaire » à la fin de la phrase
    rationale: Le dernier syntagme hébreu indique plus naturellement que la colère est liée à cette affaire (« à cause de » / « au sujet de »), plutôt qu’un cadre dans lequel elle se détourne.
  - severity: low
    issue: « dates fixées »
    rationale: Les עִתִּים מְזֻמָּנִים sont des moments ou occasions désignés. « Moments fixés » conserve une portée suffisamment large pour des audiences planifiées.
