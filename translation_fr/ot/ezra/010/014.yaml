  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: fr
  text: Que nos responsables se tiennent pour toute l’assemblée. Que tous ceux qui, dans nos villes, ont épousé des femmes étrangères[a] viennent à des moments fixés, avec les anciens de chaque ville et ses juges, jusqu’à ce que l’ardente colère de notre Dieu se détourne de nous à cause de cette affaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont fait habiter des femmes étrangères ». Dans ce contexte, l’expression désigne le fait de les avoir prises pour épouses et introduites dans le foyer.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « jusqu’à ce que la violente colère de notre Dieu soit détournée de nous au sujet de cette affaire ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: Que ... représentent donc
  rationale: Le jussif accompagné de נָא introduit une proposition respectueuse. Dans ce contexte administratif, « représentent » exprime naturellement l’idée de se tenir pour l’ensemble de la communauté.
- source_word: שָׂרֵינוּ
  choice: nos chefs
  rationale: שָׂרִים désigne ici les responsables de la communauté. « Chefs » est actuel, clair et moins archaïque que « princes ».
- source_word: לְכָל הַקָּהָל
  choice: toute l’assemblée
  rationale: La préposition לְ indique ici que les chefs agissent pour l’ensemble de la communauté, ce que rend la construction « représenter toute l’assemblée ».
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: ont pris des femmes étrangères
  rationale: L’expression signifie littéralement faire habiter ou installer ces femmes dans le foyer et, dans ce contexte, les prendre pour épouses. La formulation retenue conserve quelque chose de l’idiome sans devenir obscure.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: à des dates fixées
  rationale: Il s’agit de moments officiellement déterminés pour l’examen des cas. « Dates fixées » est naturel en français administratif moderne.
- source_word: וְעִמָּהֶם זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: accompagnés des anciens de chaque ville et de ses juges
  rationale: עִיר וָעִיר a une valeur distributive, « chaque ville », et le suffixe de שֹׁפְטֶיהָ renvoie à cette ville. « Accompagnés » explicite sans ajout substantiel le rapport exprimé par « avec eux ».
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: l’ardente colère de notre Dieu
  rationale: L’expression hébraïque évoque une colère qui brûle. « Ardente colère » garde cette image tout en restant digne et idiomatique en français.
- source_word: עַד לְהָשִׁיב ... מִמֶּנּוּ
  choice: jusqu’à ce que ... se détourne de nous
  rationale: Le tour exprime l’éloignement de la colère divine. La forme pronominale française préserve le résultat sans préciser davantage l’agent.
- source_word: עַד לַדָּבָר הַזֶּה
  choice: dans cette affaire
  rationale: La formule finale rattache la colère et son apaisement à l’affaire traitée. Le lien syntaxique exact est inhabituel, d’où l’indication d’une autre formulation en note.
theological_decisions:
- issue: Expression de la colère divine
  choice: l’ardente colère de notre Dieu
  alternative: la violente colère de notre Dieu
  rationale: Le texte attribue explicitement à Dieu חֲרוֹן אַף en réaction à la situation. La traduction conserve cette affirmation et son intensité sans l’atténuer ni l’inscrire dans un système doctrinal ajouté.
- issue: Rapport entre la colère divine et l’affaire en cours
  choice: se détourne de nous dans cette affaire
  alternative: soit détournée de nous au sujet de cette affaire
  rationale: La fin hébraïque est condensée et quelque peu inhabituelle. Le texte principal reste naturel, tandis que la note préserve une autre manière possible de rattacher le dernier groupe prépositionnel.
translation_notes:
  register: Français international moderne, clair et digne. La proposition administrative est rendue sans archaïsmes; le vocabulaire de la colère divine demeure concret et intense. Les deux phrases françaises allègent une longue coordination hébraïque sans modifier la progression de la proposition.
