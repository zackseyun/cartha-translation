revisions:
- from: Les fils de l’exil firent donc ainsi[a]. Esdras le prêtre et des hommes, chefs des groupes familiaux selon leurs maisons ancestrales, tous nommément désignés, se mirent à part[b]. Ils siégèrent le premier jour du dixième mois pour examiner l’affaire.
  to: Les fils de l’exil firent donc ainsi[a]. Esdras le prêtre et des hommes, chefs de maisons paternelles selon leurs maisons paternelles, tous désignés par leur nom, se séparèrent[b]. Ils siégèrent le premier jour du dixième mois pour examiner l’affaire.
  rationale: La révision améliore l’idiomaticité française et resserre le lien avec le vocabulaire social hébreu. Elle maintient dans le texte la lecture grammaticalement immédiate du verbe pluriel et conserve en note la lecture contextuelle alternative selon laquelle Esdras met des hommes à part. La note culturelle ajoute l’explication nécessaire de « maisons paternelles » sans aplatir ce terme dans le texte.
