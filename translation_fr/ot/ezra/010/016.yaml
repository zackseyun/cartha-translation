base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: fr
  text: Les fils de l’exil firent donc ainsi[a]. Esdras le prêtre et des hommes, chefs de maisons paternelles selon leurs maisons paternelles, tous désignés par leur nom, se séparèrent[b]. Ils siégèrent le premier jour du dixième mois pour examiner l’affaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les exilés firent donc ainsi ». L’hébreu dit littéralement « les fils de l’exil », désignation collective de la communauté revenue d’exil.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible : « Esdras le prêtre mit à part des hommes ». Le verbe hébreu est au pluriel et peut présenter Esdras et ces hommes comme ceux qui se séparèrent du reste de l’assemblée.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: les fils de l’exil
  rationale: Cette expression conserve l’image hébraïque et sert ici de désignation collective à la communauté revenue d’exil; une note en explicite la portée.
- source_word: וַיִּבָּדְלוּ
  choice: se mirent à part
  rationale: Le niphal pluriel de בדל exprime la séparation ou la mise à part. La construction permet de comprendre Esdras et les hommes comme sujets, sans transformer silencieusement le verbe en « choisit ».
- source_word: עֶזְרָא הַכֹּהֵן
  choice: Esdras le prêtre
  rationale: Le texte porte uniquement ce titre; « scribe » n’est donc pas ajouté depuis le contexte voisin.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת לְבֵית אֲבֹתָם
  choice: des hommes, chefs des groupes familiaux selon leurs maisons ancestrales
  rationale: La formulation garde la mention explicite des hommes et rend la structure clanique patrilinéaire dans un français compréhensible, sans réduire celle-ci à la seule famille nucléaire.
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: tous nommément désignés
  rationale: Cette tournure naturelle indique que chacun était identifié individuellement par son nom.
- source_word: וַיֵּשְׁבוּ
  choice: ils siégèrent
  rationale: Dans ce cadre d’enquête officielle, ישב désigne le fait de prendre place et de tenir séance; « siégèrent » restitue cette valeur contextuelle.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: le premier jour du dixième mois
  rationale: Il s’agit de la manière française usuelle de rendre l’idiome calendaire hébreu « au jour un ».
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: pour examiner l’affaire
  rationale: דרש signifie ici rechercher avec soin ou mener une enquête; « examiner l’affaire » convient au contexte administratif et judiciaire.
theological_decisions:
- issue: Sujet et valeur de וַיִּבָּדְלוּ
  choice: Esdras et les hommes « se mirent à part »
  alternative: Esdras « choisit » ou « mit à part » des hommes
  rationale: La forme verbale hébraïque est plurielle et permet naturellement de prendre Esdras et les hommes comme sujet composé. La lecture causative où Esdras sélectionne les hommes est ancienne et contextuellement possible, mais elle résout davantage la syntaxe; elle est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. « Maisons ancestrales » et « groupes familiaux » rendent la structure sociale ancienne sans employer le calque peu naturel « maisons des pères ». « Siégèrent » marque sobrement le cadre officiel de l’enquête.
