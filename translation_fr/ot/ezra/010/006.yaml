  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: fr
  text: Alors Esdras se leva de devant la maison de Dieu, puis se rendit à la chambre de Yohanan, fils d’Élyashib[a]. Une fois là, il ne mangea pas de pain et ne but pas d’eau, car il était dans le deuil à cause de l’infidélité[b] des exilés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yehohanân, fils d’Élyashib ».'
    reason: lexical_alternative
  - marker: b
    text: « Infidélité » peut aussi se traduire par « trahison » ou « manque de fidélité ».
    reason: lexical_alternative
  - marker: c
    text: Les « exilés » désignent ici la communauté revenue d’exil.
    reason: cultural_note
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: de devant la maison de Dieu
  rationale: Cette formulation conserve l’expression spatiale hébraïque et le rendu littéral de « maison de Dieu », tout en restant intelligible en français.
- source_word: לִשְׁכַּת
  choice: la chambre
  rationale: Le terme désigne une pièce appartenant à un ensemble cultuel ou officiel ; « chambre » convient ici sans préciser davantage sa fonction.
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: Yehohanân, fils d’Élyashib
  rationale: Ces formes françaises translittèrent de près les noms hébreux tout en indiquant clairement la filiation.
- source_word: וַיֵּלֶךְ שָׁם
  choice: Il y alla
  rationale: Le rendu préserve la répétition du verbe « aller » et l’adverbe de lieu, sans interpréter le mouvement comme une entrée ou un séjour.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: sans manger de pain ni boire d’eau
  rationale: La coordination française exprime naturellement le jeûne tout en conservant les objets concrets « pain » et « eau ».
- source_word: מִתְאַבֵּל
  choice: il était dans le deuil
  rationale: Cette expression rend l’état durable de lamentation indiqué par la forme hébraïque et s’accorde avec le jeûne décrit.
- source_word: מַעַל
  choice: infidélité
  rationale: « Infidélité » exprime une rupture grave de loyauté, notamment dans le cadre de l’alliance, sans réduire le terme à une faute simplement juridique.
- source_word: הַגּוֹלָה
  choice: les exilés
  rationale: Le terme désigne collectivement la communauté issue de l’exil ; le contexte d’Esdras indique qu’il s’agit des exilés revenus au pays.
theological_decisions:
- issue: Sens de מַעַל dans le contexte d’une rupture de fidélité envers Dieu
  choice: infidélité
  alternative: trahison, faute sacrilège
  rationale: « Infidélité » maintient la portée morale et relationnelle du terme sans imposer une qualification plus étroite que l’hébreu.
- issue: Traduction de בֵּית הָאֱלֹהִים
  choice: maison de Dieu
  alternative: temple de Dieu
  rationale: Le choix conserve l’image et la formulation de l’hébreu ; le contexte permet de comprendre qu’il s’agit du temple.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression narrative et une partie de la répétition hébraïque. Les noms propres suivent une translittération proche de l’hébreu, avec des accents facilitant leur lecture en français.
