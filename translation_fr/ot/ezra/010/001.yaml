- from: Pendant qu’Esdras priait et confessait les fautes, en pleurant et en se jetant à terre devant la maison de Dieu, une très grande assemblée d’Israélites se réunit auprès de lui — hommes, femmes et enfants —, car le peuple pleurait abondamment.[a]
