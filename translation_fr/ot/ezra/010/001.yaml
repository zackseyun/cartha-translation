base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: fr
  text: Pendant qu’Esdras priait et faisait confession, pleurant et se jetant à terre devant la maison de Dieu, une très grande assemblée d’Israélites se réunit auprès de lui — hommes, femmes et enfants —, car le peuple pleurait beaucoup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « car le peuple pleurait avec beaucoup de pleurs ».'
    reason: La note signale la construction hébraïque intensive הַרְבֵּה בֶכֶה, dont le français courant rend l’effet par « pleurait beaucoup ».
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא
  choice: Pendant qu’Esdras priait
  rationale: La préposition כְּ avec l’infinitif construit marque ici une action concomitante. L’imparfait français exprime naturellement cette action d’arrière-plan.
- source_word: וּכְהִתְוַדֹּתוֹ
  choice: et confessait les fautes
  rationale: Le hitpael de ידה désigne l’acte de confesser. « Les fautes » explicite sobrement l’objet implicite sans préciser qu’il s’agissait uniquement des siennes.
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: en pleurant et en se jetant à terre
  rationale: Les participes décrivent des actions continues. « Se jetant à terre » rend la valeur réflexive et suppliante sans imposer le terme plus technique « se prosterner ».
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: devant la maison de Dieu
  rationale: Cette formulation conserve l’expression hébraïque et son registre solennel plutôt que de la remplacer par « Temple ».
- source_word: נִקְבְּצוּ אֵלָיו
  choice: se réunit auprès de lui
  rationale: Le nifal de קבץ exprime le rassemblement; « auprès de lui » rend אֵלָיו sans affirmer explicitement que la foule l’entourait.
- source_word: מִיִּשְׂרָאֵל קָהָל רַב מְאֹד
  choice: une très grande assemblée d’Israélites
  rationale: « Assemblée » correspond à קהל sans connotation ecclésiale nécessaire. « D’Israélites » exprime idiomatiquement que l’assemblée provenait de la communauté d’Israël.
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: hommes, femmes et enfants
  rationale: La liste explicite des trois groupes est intégralement conservée.
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: car le peuple pleurait abondamment
  rationale: « Car » maintient le lien explicatif. « Pleurait abondamment » restitue l’intensification הַרְבֵּה בֶכֶה sans ajouter nécessairement la nuance interprétative de l’amertume.
theological_decisions:
- issue: Objet de la confession d’Esdras
  choice: « confessait les fautes » sans les attribuer exclusivement à Esdras
  alternative: « confessait ses fautes »
  rationale: Le suffixe de וּכְהִתְוַדֹּתוֹ indique le sujet de l’action (« pendant qu’il confessait »), non l’appartenance des fautes confessées. Le contexte permet une confession solidaire; « ses fautes » résoudrait indûment cette question.
translation_notes:
  register: Français international moderne, digne et narratif. Les termes « maison de Dieu » et « assemblée » conservent les images et catégories du texte hébreu; la syntaxe demeure fluide pour une lecture publique.
