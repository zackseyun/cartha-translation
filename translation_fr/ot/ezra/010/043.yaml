  text: מִ/בְּנֵ֖י נְב֑וֹ יְעִיאֵ֤ל מַתִּתְיָה֙ זָבָ֣ד זְבִינָ֔א ידו וְ/יוֹאֵ֖ל בְּנָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: fr
  text: 'Parmi les descendants de Nebo : Yéiel, Mattitia, Zabad, Zebina, Yaddaï[a], Joël et Benaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lecture de ce nom hébreu est incertaine ; on trouve aussi les formes Iddo ou Yédo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Parmi les descendants de
  rationale: Dans cette liste, la préposition מִן introduit un sous-groupe. « Parmi les descendants de » exprime naturellement en français l’appartenance familiale ou clanique sans limiter בְּנֵי aux seuls fils directs.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Translittération usuelle du nom propre.
- source_word: יְעִיאֵל
  choice: Yéiel
  rationale: Translittération française claire du nom hébreu, avec Y initial pour י.
- source_word: מַתִּתְיָה
  choice: Mattitia
  rationale: Forme française naturelle qui reflète le nom hébreu sans lui ajouter une finale étrangère.
- source_word: זָבָד
  choice: Zabad
  rationale: Translittération directe du nom propre.
- source_word: זְבִינָא
  choice: Zebina
  rationale: Translittération française simple du nom propre.
- source_word: ידו
  choice: Yaddaï
  rationale: Le texte consonantique présente un nom dont la lecture est incertaine. « Yaddaï » suit une représentation traditionnelle plausible, tandis que d’autres lectures sont signalées en note.
- source_word: וְ/יוֹאֵל
  choice: Joël
  rationale: Forme française traditionnelle du nom, la conjonction étant rendue devant le dernier élément de l’énumération selon l’usage français.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Translittération française qui rend clairement le nom hébreu.
