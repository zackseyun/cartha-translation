  text: וּ/מִֽן הַ/לְוִיִּ֑ם יוֹזָבָ֣ד וְ/שִׁמְעִ֗י וְ/קֵֽלָיָה֙ ה֣וּא קְלִיטָ֔א פְּתַֽחְיָ֥ה יְהוּדָ֖ה וֶ/אֱלִיעֶֽזֶר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: fr
  text: 'Et parmi les lévites : Yozabad, Shimeï, Kelaya (c’est-à-dire Kelita[a]), Petahia, Juda et Éliézer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Kelaya, lui, Kelita ». Kelita paraît être un autre nom, ou une autre forme du nom, de la même personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: Parmi les lévites
  rationale: 'La préposition מִן a ici un sens partitif : les hommes nommés appartiennent au groupe des lévites. Cette formulation est naturelle en français et convient à l’introduction d’une liste.'
- source_word: יוֹזָבָד
  choice: Yozabad
  rationale: Transcription française usuelle de ce nom propre hébreu.
- source_word: וְשִׁמְעִי
  choice: Shimeï
  rationale: Forme française courante du nom, avec le tréma pour signaler que les voyelles se prononcent séparément.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: Kelaya — c’est-à-dire Kelita[a] —
  rationale: הוּא relie ici les deux formes du nom par une identification explicative. « C’est-à-dire » conserve cette relation sans préciser au-delà du texte s’il s’agit d’un autre nom ou d’une variante du même nom.
- source_word: פְּתַחְיָה
  choice: Petahia
  rationale: Transcription française claire et courante du nom propre.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle du nom ; dans ce contexte, il désigne une personne et non le territoire ou la tribu.
- source_word: וֶאֱלִיעֶזֶר
  choice: et Éliézer
  rationale: La vocalisation hébraïque correspond à Éliézer, et non à Éléazar ; la conjonction finale est rendue naturellement par « et ».
theological_decisions: []
translation_notes:
  register: Style sobre et digne adapté à une liste de noms. Les formes françaises des noms propres sont privilégiées, et la ponctuation met clairement en évidence l’identification de Kelaya à Kelita sans supprimer la légère ambiguïté de l’hébreu.
