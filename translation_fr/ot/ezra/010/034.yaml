  text: מִ/בְּנֵ֣י בָנִ֔י מַעֲדַ֥י עַמְרָ֖ם וְ/אוּאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/034.yaml
  text: 'From the sons of Bani: Maadai, Amram, and Uel.'
translation:
  language: fr
  text: 'Parmi les descendants de Bani : Maadaï, Amram et Ouel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Parmi les descendants de
  rationale: La préposition מִן jointe à בְּנֵי a ici un sens partitif et introduit certains membres de la famille de Bani. « Parmi les descendants de » est naturel en français dans cette liste et évite de suggérer qu’il s’agit nécessairement de fils directs.
- source_word: בָנִי
  choice: Bani
  rationale: Nom propre conservé sous sa forme française usuelle.
- source_word: מַעֲדַי
  choice: Maadaï
  rationale: Translittération française du nom propre, avec tréma pour signaler que les voyelles finales se prononcent séparément.
- source_word: עַמְרָם
  choice: Amram
  rationale: Forme française traditionnelle et transparente du nom propre.
- source_word: וְ/אוּאֵל
  choice: et Ouel
  rationale: La conjonction וְ est rendue par « et ». « Ouel » représente naturellement en français la vocalisation hébraïque du nom אוּאֵל.
