  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: fr
  text: 'Et parmi les fils d’Élam : Mattania, Zacharie, Yehiel, Abdi, Yerémoth et Élie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Parmi les fils de
  rationale: La construction associe la conjonction, la préposition מִן et le pluriel construit de בֵּן. Dans cette liste familiale, « parmi les fils de » rend naturellement l’appartenance au groupe tout en conservant l’expression hébraïque « fils de ».
- source_word: עֵילָם
  choice: Élam
  rationale: Nom propre désignant ici l’ancêtre ou le clan; la forme française biblique usuelle est conservée.
- source_word: מַתַּנְיָה
  choice: Mattania
  rationale: Transcription française courante du nom hébreu, avec une forme claire et reconnaissable.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: וִ/יחִיאֵל
  choice: Yehiel
  rationale: Transcription assez proche de l’hébreu יְחִיאֵל et naturelle dans une liste de noms propres en français.
- source_word: וְ/עַבְדִּי
  choice: Abdi
  rationale: Le contexte et la syntaxe de la liste indiquent un nom propre, non l’expression nominale « mon serviteur ».
- source_word: וִ/ירֵמוֹת
  choice: Yerémoth
  rationale: Transcription française qui reflète la consonne initiale hébraïque et distingue clairement ce nom propre.
- source_word: וְ/אֵלִיָּה
  choice: Élie
  rationale: Forme française biblique établie correspondant au nom hébreu אֵלִיָּה.
