  yaml_path: translation/ot/ezra/010/033.yaml
  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: fr
  text: 'Parmi les fils de Hashoum : Mattenaï, Mattatta, Zabad, Éliphéleth, Yerémaï, Manassé et Shiméï.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Parmi les descendants de
  rationale: Dans cette liste, מִן avec בְּנֵי introduit des membres appartenant à un groupe familial. « Parmi les descendants de » est naturel en français et évite de faire entendre qu’il s’agit nécessairement de fils directs.
- source_word: חָשֻׁם
  choice: Hashoum
  rationale: Translittération française usuelle du nom propre, avec « ou » pour le son /u/.
- source_word: מַתְּנַי
  choice: Mattenaï
  rationale: Translittération adaptée aux conventions françaises; le tréma indique que la finale se prononce séparément.
- source_word: מַתַּתָּה
  choice: Mattatta
  rationale: Translittération proche de la forme hébraïque, adaptée à l’orthographe française.
- source_word: זָבָד
  choice: Zabad
  rationale: Translittération directe et claire du nom propre.
- source_word: אֱלִיפֶלֶט
  choice: Éliphéleth
  rationale: Forme française traditionnelle et reconnaissable, proche de la structure consonantique hébraïque.
- source_word: יְרֵמַי
  choice: Yerémaï
  rationale: Translittération française qui distingue ce nom de Jérémie et représente la consonne initiale ainsi que la finale hébraïque.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française biblique établie.
- source_word: שִׁמְעִי
  choice: Sh iméï
  rationale: Translittération française du nom propre; la graphie « Sh » représente שׁ et le tréma marque la finale dissyllabique.
