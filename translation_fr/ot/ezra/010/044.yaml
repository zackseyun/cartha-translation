  text: All these had married foreign women, and some of them had wives by whom they had children.
translation:
  language: fr
  text: Tous ces hommes avaient épousé des femmes étrangères, et parmi eux, il y avait des femmes qui avaient eu des enfants[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et il y avait parmi eux des femmes, et ils avaient des fils ». La fin du verset est brève et difficile en hébreu; le référent exact du verbe n’est pas certain.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fils »; le mot peut aussi désigner plus largement des enfants ou une descendance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י נָשִׁים נָכְרִיּוֹת
  choice: avaient épousé des femmes étrangères
  rationale: Dans ce contexte, נשׂא avec « femmes » exprime le fait de prendre une femme pour épouse. « Épouser » rend naturellement cet idiome, tandis que « femmes étrangères » conserve la distinction ethnique et communautaire de נָכְרִיּוֹת sans employer le terme ambigu « étrangères » au sens d’inconnues.
- source_word: וְיֵשׁ מֵהֶם נָשִׁים
  choice: et certains d’entre eux avaient des femmes
  rationale: Cette formulation suit l’interprétation contextuelle de l’expression existentielle יֵשׁ מֵהֶם et donne à נָשִׁים son sens relationnel de « femmes/épouses ». Elle reste proche de la syntaxe hébraïque tout en étant compréhensible en français.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: avec qui ils avaient eu des enfants
  rationale: L’expression hébraïque, littéralement proche de « ils placèrent des fils », est elliptique et difficile. Le contexte indique vraisemblablement que certaines unions avaient produit une descendance; cette formulation française transmet ce sens sans reproduire un tour inintelligible.
- source_word: בָּנִים
  choice: enfants
  rationale: Bien que le nom signifie formellement « fils », il peut désigner plus largement la descendance selon le contexte. « Enfants » convient ici, le propos portant sur l’existence d’une descendance; le sens littéral est signalé en note.
