  naturalness: « Tous ces hommes » est naturel et explicite dans le contexte de la liste des hommes. « Parmi eux, il y avait des femmes qui avaient eu des enfants » est un français actuel et sobre; il évite le tour ambigu et quelque peu lourd « certains d’entre eux avaient des femmes avec qui... ».
  terminology: « Femmes étrangères » convient pour נשים נכריות sans importer une qualification confessionnelle. « Enfants » est acceptable comme rendu contextuel de בנים, avec « fils » signalé en note. « Épouses » n’est pas nécessaire dans la seconde proposition, où le texte hébreu emploie simplement « femmes ».
