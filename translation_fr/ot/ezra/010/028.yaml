  text: וּ/מִ/בְּנֵ֖י בֵּבָ֑י יְהוֹחָנָ֥ן חֲנַנְיָ֖ה זַבַּ֥י עַתְלָֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/028.yaml
  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: fr
  text: 'Et parmi les fils[a] de Bébaï : Yehohanân[b], Hanania, Zabbaï et Atlaï.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « fils de » peut désigner plus largement les membres ou les descendants de la lignée familiale de Bébaï.
    reason: lexical_alternative
  - marker: b
    text: Le nom Yehohanân est aussi rendu sous la forme abrégée « Yohanan ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Et parmi les fils
  rationale: La construction signifie littéralement « et d’entre les fils de ». Dans cette liste familiale, « parmi les fils de » est naturel en français tout en conservant l’expression clanique hébraïque; une note signale que sa portée peut être plus large.
- source_word: בֵּבָי
  choice: Bébaï
  rationale: Nom propre translittéré en suivant une forme française lisible et proche de l’hébreu.
- source_word: יְהוֹחָנָן
  choice: Yehohanân
  rationale: Translittération qui conserve la forme hébraïque complète et son élément théophore, plutôt que la forme abrégée courante « Yohanan ».
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Forme française usuelle et lisible du nom hébreu.
- source_word: זַבַּי
  choice: Zabbaï
  rationale: Translittération française proche de la forme hébraïque, avec le tréma indiquant que les voyelles se prononcent séparément.
- source_word: עַתְלָי
  choice: Atlaï
  rationale: Translittération française directe et lisible du nom hébreu.
theological_decisions: []
