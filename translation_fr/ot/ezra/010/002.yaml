  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: fr
  text: 'Alors Shecania, fils de Yehiel, l’un des descendants d’Élam, prit la parole et dit à Esdras : « Nous avons été infidèles à notre Dieu, et nous avons épousé des femmes étrangères issues des peuples du pays. Pourtant, maintenant, il y a de l’espoir pour Israël à ce sujet. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: prit la parole et dit
  rationale: La formule hébraïque introduit la réponse de Shecania. Cette tournure française naturelle conserve l’idée de réponse sans reproduire lourdement « répondit et dit ».
- source_word: שְׁכַנְיָה בֶן יְחִיאֵל
  choice: Shecania, fils de Yehiel
  rationale: Translittération française intelligible des noms propres et rendu direct de la filiation.
- source_word: מִבְּנֵי עוֹלָם
  choice: l’un des descendants d’Élam
  rationale: בני désigne ici le groupe familial ou clanique d’Élam; « descendants » est plus naturel que le calque « fils » dans ce contexte.
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: Nous avons été infidèles à notre Dieu
  rationale: מעל exprime une rupture de fidélité, notamment envers Dieu; ce rendu conserve sa portée relationnelle et religieuse.
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: en épousant des femmes étrangères
  rationale: Dans ce contexte, la forme verbale exprime le fait de prendre ces femmes pour épouses. Le gérondif explicite le lien entre l’acte et l’infidélité confessée.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: prises parmi les peuples du pays
  rationale: Le pluriel « peuples » est conservé; « prises parmi » rattache clairement le complément aux femmes sans faire de « pays » un pluriel non attesté dans le texte massorétique.
- source_word: וְעַתָּה יֵשׁ מִקְוֶה לְיִשְׂרָאֵל עַל זֹאת
  choice: Pourtant, même dans cette situation, il y a encore de l’espoir pour Israël
  rationale: La phrase marque un contraste après l’aveu. עַל זֹאת reste sémantiquement ouvert; le texte principal en donne un français fluide, tandis que la note conserve l’alternative plus formelle « à ce sujet ».
theological_decisions:
- issue: Portée de מעל dans la confession
  choice: « avons été infidèles à notre Dieu »
  alternative: « avons commis une infidélité envers notre Dieu »
  rationale: Le choix maintient la nuance de manquement à la fidélité due à Dieu sans réduire le terme à un générique « avons péché » ni lui imposer une formulation confessionnelle particulière.
- issue: Désignation des femmes נָשִׁים נָכְרִיּוֹת
  choice: « femmes étrangères »
  alternative: « femmes d’origine étrangère » ou « épouses étrangères »
  rationale: Le nom hébreu dit « femmes », tandis que le verbe fournit le sens matrimonial. Le rendu évite d’ajouter une évaluation absente de l’adjectif lui-même.
- issue: Ambiguïté de עַל זֹאת
  choice: « même dans cette situation » avec note
  alternative: « à ce sujet »
  rationale: La préposition peut orienter le sens vers la situation présente ou vers la question à traiter. La note préserve cette tension sans faire du verset une affirmation plus précise qu’en hébreu.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe narrative évite le calque « répondit et dit », peu naturel en français, tout en gardant la solennité du récit. Les marqueurs [a] et [b] figurent dans le texte et correspondent exactement aux notes.
