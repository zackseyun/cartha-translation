- source_word: וַנְיָה
  choice: Vania
  rationale: Nom propre masculin translittéré selon une forme française naturelle; le waw initial est rendu par « V », et la terminaison hébraïque est représentée sans ajouter le « h » propre à certaines conventions anglaises.
- source_word: מְרֵמוֹת
  choice: Merémoth
  rationale: Nom propre translittéré dans une forme française biblique reconnaissable; l’accent facilite la prononciation de la deuxième syllabe, et le taw final est représenté par « th » conformément à l’usage traditionnel.
- source_word: אֶלְיָשִׁיב
  choice: Éliashib
  rationale: Nom propre translittéré dans sa forme française conventionnelle et reconnaissable; l’accent initial guide la prononciation.
