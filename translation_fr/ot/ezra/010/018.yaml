review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : le verset identifie, parmi les familles sacerdotales concernées par des unions avec des femmes étrangères, un groupe rattaché à Yéchoua fils de Yotsadaq, puis énumère quatre hommes. Toutefois, « parmi les fils de Yéchoua, fils de Yotsadaq, et ses frères » coordonne maladroitement « ses frères » avec « les fils » et peut faire croire que les quatre noms sont à la fois des fils de Yéchoua et ses frères. Le second בְּנֵי est mieux rendu ici par « descendants », qui convient à la désignation de la lignée incluant Yéchoua et ses frères.'
  naturalness: La formulation est globalement claire et de registre approprié. La révision rend la construction généalogique naturelle en français moderne tout en évitant une lecture syntaxiquement incohérente. « On trouva » reste une bonne tournure impersonnelle pour le singulier collectif hébreu.
  terminology: « Prêtres », « femmes étrangères » et les noms translittérés sont appropriés. « Femmes étrangères » conserve le libellé du texte sans imposer dans le corps du verset une interprétation plus explicite ; la note indique légitimement l'alternative matrimoniale contextuelle. Les formes Yéchoua, Yotsadaq, Maaséya, Éliézer, Yarib et Guedalia sont cohérentes avec une translittération française proche de l'hébreu.
  issues:
  - severity: medium
    issue: Coordination ambiguë de « et ses frères » après « parmi les fils de Yéchoua ».
    rationale: Le texte hébreu rattache « ses frères » à Yéchoua dans la désignation du groupe familial. La rédaction actuelle peut grammaticalement présenter les hommes énumérés comme les fils de Yéchoua et simultanément ses frères. « Parmi les descendants de Yéchoua, fils de Yotsadaq, et de ses frères » rend plus clairement la portée généalogique collective de בְּנֵי.
  revised_text: 'Parmi les fils des prêtres qui avaient pris des femmes étrangères[a], on trouva, parmi les descendants de Yéchoua, fils de Yotsadaq, et de ses frères : Maaséya, Éliézer, Yarib et Guedalia.'
