  revision_rationale: La seule correction nécessaire clarifie la relation entre Yéchoua, ses frères et les hommes nommés. « Descendants » rend naturellement le terme généalogique hébreu dans cette construction sans prétendre que chacun des quatre hommes est un fils direct de Yéchoua.
