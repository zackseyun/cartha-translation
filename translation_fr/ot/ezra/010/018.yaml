  text: וַ/יִּמָּצֵא֙ מִ/בְּנֵ֣י הַ/כֹּהֲנִ֔ים אֲשֶׁ֥ר הֹשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת מִ/בְּנֵ֨י יֵשׁ֤וּעַ בֶּן יֽוֹצָדָק֙ וְ/אֶחָ֔י/ו מַֽעֲשֵׂיָה֙ וֶֽ/אֱלִיעֶ֔זֶר וְ/יָרִ֖יב וּ/גְדַלְיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: fr
  text: 'Parmi les fils des prêtres qui avaient pris des femmes étrangères[a], on trouva, parmi les descendants de Yéchoua, fils de Yotsadaq, et de ses frères : Maaséya, Éliézer, Yarib et Guedalia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui avaient épousé des femmes étrangères ».'
    reason: L’expression hébraïque peut être explicitée dans ce contexte comme une référence au mariage, tandis que le texte principal en conserve l’idiome plus littéral.
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: on trouva
  rationale: Le verbe hébreu est au singulier et introduit collectivement plusieurs hommes. La tournure impersonnelle française « on trouva » conserve ce singulier tout en restant naturelle.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: parmi les fils des prêtres
  rationale: « Fils » préserve l’expression généalogique hébraïque, tandis que « parmi » rend ici la valeur partitive de מִן.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: qui avaient pris des femmes étrangères
  rationale: Dans le contexte d’Esdras 10, l’expression désigne des unions avec des femmes étrangères. « Prendre des femmes » reste proche de l’idiome hébreu sans rendre explicite plus que le texte principal.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: des femmes étrangères
  rationale: Cette formulation reproduit directement le groupe nominal hébreu et laisse le contexte ainsi que la note préciser la relation conjugale.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: parmi les fils de Yéchoua, fils de Yotsadaq
  rationale: La répétition de « parmi les fils » rend la structure généalogique et partitive de l’hébreu. Les noms sont translittérés selon une forme française lisible et proche de l’hébreu.
- source_word: וְאֶחָיו
  choice: et ses frères
  rationale: Le sens direct de אָח est « frère ». Le possessif renvoie grammaticalement à Yéchoua, sans élargir le terme à « parents » ou « membres de sa famille ».
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: Maaséya, Éliézer, Yarib et Guedalia
  rationale: Les noms propres sont translittérés sous des formes adaptées à la lecture française plutôt que traduits.
