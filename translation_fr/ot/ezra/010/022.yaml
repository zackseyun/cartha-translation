  text: וּ/מִ/בְּנֵ֖י פַּשְׁח֑וּר אֶלְיוֹעֵינַ֤י מַֽעֲשֵׂיָה֙ יִשְׁמָעֵ֣אל נְתַנְאֵ֔ל יוֹזָבָ֖ד וְ/אֶלְעָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/022.yaml
  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: fr
  text: 'Et parmi les fils de Pashhour : Eljoénaï, Maaséja, Ismaël, Nethaneel, Jozabad et Elasa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Et parmi les descendants de
  rationale: Le waw maintient le lien avec la liste précédente, tandis que מִן exprime ici l’appartenance partitive. « Descendants » rend naturellement le pluriel construit de בֵּן dans une généalogie familiale.
- source_word: פַּשְׁחוּר
  choice: Pashhour
  rationale: Transcription française moderne du nom propre, qui représente le son ח par « h » et conserve une forme reconnaissable.
- source_word: אֶלְיוֹעֵינַי
  choice: Eljoénaï
  rationale: Forme française biblique reconnaissable du nom propre, avec des accents facilitant sa prononciation.
- source_word: מַעֲשֵׂיָה
  choice: Maaséja
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: נְתַנְאֵל
  choice: Nethaneel
  rationale: Forme française biblique reconnaissable, conservant la distinction de ce nom dans la liste.
- source_word: יוֹזָבָד
  choice: Jozabad
  rationale: Forme française biblique courante du nom propre.
- source_word: וְ/אֶלְעָשָׂה
  choice: et Elasa
  rationale: La conjonction préfixée est rendue explicitement par « et »; le nom est transcrit sous une forme française simple et proche de l’hébreu.
