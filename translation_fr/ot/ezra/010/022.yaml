translation_notes:
  register: Style bref et digne adapté à une liste généalogique. La tournure « Et parmi les descendants de » préserve à la fois la continuité syntaxique et le sens partitif de l’hébreu; les noms suivent des formes françaises lisibles et reconnaissables.
