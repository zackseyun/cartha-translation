source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֛י פַּחַ֥ת מוֹאָ֖ב עַדְנָ֣א וּ/כְלָ֑ל בְּנָיָ֤ה מַעֲשֵׂיָה֙ מַתַּנְיָ֣ה בְצַלְאֵ֔ל וּ/בִנּ֖וּי וּ/מְנַשֶּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: fr
  text: 'Et parmi les descendants de Pahath-Moab : Adna, Kelal, Benaya, Maaséya, Mattania, Betsalel, Binnouï et Manassé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Parmi les descendants de
  rationale: Dans cette liste, בְּנֵי désigne les membres d’une lignée ou d’un clan plutôt que nécessairement des fils immédiats. « Parmi les descendants de » rend aussi la préposition מִן avec naturel en français; la coordination initiale n’a pas besoin d’être explicitée dans ce verset fragmentaire.
- source_word: פַּחַת מוֹאָב
  choice: Pahath-Moab
  rationale: Nom propre de famille ou de clan, translittéré et relié par un trait d’union pour faire apparaître son unité.
- source_word: עַדְנָא
  choice: Adna
  rationale: Translittération française concise du nom hébreu.
- source_word: וּ/כְלָל
  choice: Kelal
  rationale: La lettre כ est rendue par k en français moderne; le préfixe וּ relie simplement ce nom aux autres éléments de la liste.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Forme française transparente qui représente le nom hébreu sans reprendre la graphie anglaise Benaiah.
- source_word: מַעֲשֵׂיָה
  choice: Maaséya
  rationale: Translittération française qui conserve les principales articulations du nom hébreu et rend lisible sa prononciation.
- source_word: מַתַּנְיָה
  choice: Mattania
  rationale: Forme française traditionnelle et naturelle, avec double t correspondant au redoublement consonantique.
- source_word: בְצַלְאֵל
  choice: Betsalel
  rationale: Translittération française usuelle du nom, où « ts » représente צ.
- source_word: וּ/בִנּוּי
  choice: Binnouï
  rationale: La graphie française rend le redoublement de la consonne et la suite vocalique finale sans adopter la forme anglaise.
- source_word: וּ/מְנַשֶּׁה
  choice: et Manassé
  rationale: Le nom est donné sous sa forme française traditionnelle; la conjonction hébraïque est exprimée devant le dernier élément de l’énumération.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La formule généalogique est rendue selon sa fonction clanique, et les noms sont adaptés aux conventions de translittération françaises plutôt que repris de l’anglais.
