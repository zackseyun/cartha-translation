  text: 'Et, parmi les fils d’Immer : Hanani et Zebadia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Parmi les descendants de
  rationale: Dans cette liste, la combinaison de la conjonction, de la préposition מִן et du construit בְּנֵי introduit les membres issus d’un groupe familial. « Parmi les descendants de » exprime naturellement en français leur appartenance à la famille d’Immer sans laisser entendre qu’ils sont nécessairement ses fils immédiats.
- source_word: אִמֵּר
  choice: Immer
  rationale: Nom propre désignant ici une famille sacerdotale; la translittération française usuelle est conservée.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Nom propre personnel, rendu selon sa forme française biblique usuelle.
- source_word: וּ/זְבַדְיָה
  choice: et Zebadia
  rationale: La conjonction préfixée relie le dernier nom de la brève énumération; « Zebadia » est une translittération française claire du nom hébreu.
theological_decisions: []
translation_notes:
  register: Formulation brève et digne, adaptée au caractère généalogique de la liste. Le français emploie naturellement « Parmi les descendants » plutôt qu’un calque « Et des fils », tandis que les noms propres restent immédiatement reconnaissables.
