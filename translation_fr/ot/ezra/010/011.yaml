source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: fr
  text: Maintenant donc, rendez grâce à Yahvé[a], le Dieu de vos pères, et faites sa volonté. Séparez-vous des peuples du pays et des femmes étrangères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « faites confession à Yahvé ». L’expression hébraïque peut désigner l’action de grâce ou la louange, mais aussi la confession dans ce contexte.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « épouses étrangères ». Le contexte général concerne des mariages, bien que l’hébreu dise ici littéralement « femmes étrangères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: rendez gloire
  rationale: L’expression hébraïque peut exprimer la louange ou l’action de grâce, mais aussi, dans certains contextes, l’aveu ou la confession. « Rendez gloire » est naturel en français biblique moderne et conserve l’idée d’un hommage rendu à Dieu sans exclure le contexte de confession.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La translittération « Yahvé » représente clairement le nom divin יהוה et correspond à la couche anglaise fournie.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: Cette formulation conserve le langage ancestral et fédératif de l’hébreu; « pères » désigne ici les ancêtres du peuple.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: et faites sa volonté
  rationale: Traduction directe et idiomatique de l’ordre d’accomplir ce que Dieu veut.
- source_word: וְהִבָּדְלוּ
  choice: Séparez-vous
  rationale: L’impératif nifal a ici une valeur réfléchie et appelle la communauté à se dissocier activement.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: des peuples du pays
  rationale: Le pluriel « peuples » respecte עַמֵּי, tandis que « du pays » préserve la formulation hébraïque sans préciser davantage son référent.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: et des femmes étrangères
  rationale: Le texte dit littéralement « les femmes étrangères »; le contexte matrimonial permet « épouses étrangères », mais ce sens plus précis est réservé à la note.
theological_decisions:
- issue: 'Sens de תְּנוּ תוֹדָה : louange/action de grâce ou confession'
  choice: rendez gloire
  alternative: confessez votre faute devant
  rationale: Le contexte porte sur la reconnaissance d’une faute suivie d’obéissance, mais l’expression hébraïque garde une portée de louange ou d’hommage. La traduction principale ne tranche pas silencieusement; la lecture confessionnelle est signalée en note.
- issue: Portée de הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: femmes étrangères
  alternative: épouses étrangères
  rationale: « Femmes » suit exactement le lexème du verset, tandis que « épouses » explicite la situation matrimoniale établie par le contexte immédiat.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe impérative et le vocabulaire ancestral sont conservés. Les ambiguïtés relatives à la confession et au statut matrimonial sont explicitées en notes plutôt que résolues dans le corps du texte.
