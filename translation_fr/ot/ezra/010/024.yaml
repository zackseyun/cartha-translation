lexical_decisions:
- source_word: וּמִן
  choice: Parmi… et parmi
  rationale: La préposition מִן introduit ici des membres issus de sous-groupes dans une liste. « Parmi » est naturel en français, tandis que « et » devant le second groupe préserve la structure additive de l’hébreu.
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le participe substantivé désigne les personnes chargées du chant, ici dans le cadre du service cultuel. « Chanteurs » est clair et précis sans ajouter une fonction instrumentale.
- source_word: אֶלְיָשִׁיב
  choice: Éliashib
  rationale: Transcription française usuelle du nom hébreu.
- source_word: הַשֹּׁעֲרִים
  choice: les gardiens des portes
  rationale: Dans le contexte du service du temple, le terme désigne ceux qui ont la garde des portes. Cette formulation française explicite naturellement leur fonction.
- source_word: שַׁלֻּם
  choice: Shalloum
  rationale: Transcription française usuelle du nom hébreu.
- source_word: טֶלֶם
  choice: Télem
  rationale: Transcription française du nom hébreu, avec accent indiquant la prononciation.
- source_word: אוּרִי
  choice: Ouri
  rationale: Transcription française usuelle du nom hébreu.
