  text: וַ/יְכַלּ֣וּ בַ/כֹּ֔ל אֲנָשִׁ֕ים הַ/הֹשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת עַ֛ד י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/017.yaml
  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: fr
  text: Ils achevèrent l’examen de tous les hommes qui avaient pris des femmes étrangères le premier jour du premier mois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’au premier jour du premier mois ». L’expression hébraïque peut indiquer soit la date à laquelle l’examen fut achevé, soit la limite jusqu’à laquelle il se poursuivit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ בַכֹּל
  choice: Ils achevèrent l’examen de tous
  rationale: Le verbe כלה exprime l’achèvement, tandis que בַכֹּל indique l’ensemble des cas concernés. L’ajout contextuel « l’examen » rend en français naturel la procédure décrite aux versets précédents sans modifier son objet.
- source_word: אֲנָשִׁים
  choice: les hommes
  rationale: Le nom est masculin pluriel et désigne ici les hommes dont les cas étaient examinés.
- source_word: הַהֹשִׁיבוּ
  choice: avaient pris
  rationale: La forme causative signifie littéralement « avaient fait habiter ». Dans ce contexte, elle évoque l’entrée de ces femmes dans leur foyer comme épouses. « Avaient pris » conserve cet idiome matrimonial sans expliciter davantage que l’hébreu.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: des femmes étrangères
  rationale: נָשִׁים peut signifier « femmes » ou « épouses » selon le contexte. « Femmes étrangères » reste proche de la formulation hébraïque, tandis que le verbe et le contexte indiquent la relation conjugale.
- source_word: עַד יוֹם אֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: le premier jour du premier mois
  rationale: עַד fixe le terme de la procédure. Avec un verbe d’achèvement, le français peut donner directement la date finale; la note conserve l’autre rendu temporel possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Achevèrent l’examen » explicite avec mesure l’objet procédural fourni par le contexte immédiat. « Femmes étrangères » évite à la fois l’archaïsme « femmes étrangères » pris au sens de femmes inconnues—le contexte clarifie l’origine étrangère—et une précision matrimoniale plus forte que la tournure hébraïque.
