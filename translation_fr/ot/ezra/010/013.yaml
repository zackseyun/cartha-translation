  text: אֲבָ֞ל הָ/עָ֥ם רָב֙ וְ/הָ/עֵ֣ת גְּשָׁמִ֔ים וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמ֣וֹד בַּ/ח֑וּץ וְ/הַ/מְּלָאכָ֗ה לֹֽא לְ/י֤וֹם אֶחָד֙ וְ/לֹ֣א לִ/שְׁנַ֔יִם כִּֽי הִרְבִּ֥ינוּ לִ/פְשֹׁ֖עַ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: fr
  text: Mais le peuple est nombreux, c’est la saison des pluies, et nous n’avons pas la force de rester dehors. Ce travail ne peut pas se faire en un jour ou deux[a], car nous avons gravement transgressé dans cette affaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce travail n’est pas pour un jour ni pour deux ».'
    reason: La formulation hébraïque elliptique indique que la tâche ne peut pas être achevée en un ou deux jours.
  - marker: b
    text: 'Ou : « nous avons beaucoup péché dans cette affaire » ou « nous nous sommes beaucoup rebellés dans cette affaire ».'
    reason: Le verbe פשׁע peut exprimer la transgression, le péché ou la rébellion.
lexical_decisions:
- source_word: אֲבָל
  choice: Mais
  rationale: Marque naturellement le contraste avec la proposition du verset précédent.
- source_word: הָעָם רָב
  choice: le peuple est nombreux
  rationale: Conserve la construction prédicative et le sens collectif de עָם dans un français naturel.
- source_word: וְהָעֵת גְּשָׁמִים
  choice: c’est la saison des pluies
  rationale: Rend idiomatiquement l’expression littérale « le temps des pluies ».
- source_word: וְאֵין כֹּחַ לַעֲמוֹד בַּחוּץ
  choice: nous n’avons pas la force de rester dehors
  rationale: Explicite le sujet collectif impliqué par le contexte; « rester » exprime ici l’idée de supporter durablement les conditions extérieures.
- source_word: וְהַמְּלָאכָה לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: Ce travail ne prendra pas seulement un jour ou deux
  rationale: Exprime clairement la durée requise par la tâche tout en restant proche de la formulation hébraïque elliptique.
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: car nous avons gravement transgressé
  rationale: Le hiphil de רבה avec l’infinitif intensifie l’ampleur de la transgression; « gravement » est naturel et préserve la force du propos.
- source_word: בַּדָּבָר הַזֶּה
  choice: dans cette affaire
  rationale: Désigne idiomatiquement la question concrète faisant l’objet de l’assemblée.
theological_decisions:
- issue: Nature de la faute exprimée par לִפְשֹׁעַ
  choice: transgressé
  alternative: péché; agi en rébellion
  rationale: « Transgressé » conserve la gravité de la violation sans imposer une catégorisation doctrinale plus précise que le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement explicitée pour la fluidité, sans atténuer la gravité de l’aveu collectif.
