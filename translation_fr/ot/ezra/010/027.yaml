  text: 'Et parmi les fils de Zattou : Élioénaï, Éliashib, Mattania, Yerémoth, Zabad et Aziza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Parmi les fils de
  rationale: Dans cette liste, la combinaison du waw, de la préposition מִן et du pluriel construit de בֵּן introduit des membres du groupe familial de Zattou. « Parmi les fils de » est naturel en français et conserve la formulation généalogique sans exclure le sens plus large de descendants.
- source_word: זַתּוּא
  choice: Zattou
  rationale: Nom propre translittéré selon une forme française biblique reconnaissable, avec « ou » pour la voyelle finale.
- source_word: אֶלְיוֹעֵנַי
  choice: Élioénaï
  rationale: Translittération française qui représente les principales composantes phonétiques du nom hébreu et marque la finale -aï.
- source_word: אֶלְיָשִׁיב
  choice: Éliashib
  rationale: Forme française usuelle et proche de l'hébreu pour ce nom propre.
- source_word: מַתַּנְיָה
  choice: Mattania
  rationale: Forme française claire du nom hébreu, conservant la consonne redoublée et la terminaison théophore sous sa forme biblique française courante.
- source_word: וִֽ/ירֵמוֹת
  choice: Yerémoth
  rationale: La graphie initiale « Y » rend directement le yod hébreu; l'accent facilite la lecture française. Le waw est intégré à la coordination naturelle de la liste.
- source_word: וְ/זָבָד
  choice: Zabad
  rationale: Translittération directe et familière en français biblique; le waw est rendu par la structure coordonnée de l'énumération.
- source_word: וַ/עֲזִיזָא
  choice: Aziza
  rationale: Translittération naturelle du nom propre; le waw préfixé est rendu par « et » devant le dernier élément.
