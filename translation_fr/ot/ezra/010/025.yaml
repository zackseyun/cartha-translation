  text: וּ/מִֽ/יִּשְׂרָאֵ֑ל מִ/בְּנֵ֣י פַרְעֹ֡שׁ רַ֠מְיָה וְ/יִזִּיָּ֤ה וּ/מַלְכִּיָּה֙ וּ/מִיָּמִ֣ן וְ/אֶלְעָזָ֔ר וּ/מַלְכִּיָּ֖ה וּ/בְנָיָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: fr
  text: 'Et parmi les Israélites, parmi les descendants de Parosh : Ramya, Yizziya, Malkiya, Miyamin, Éléazar, Malkiya[a] et Benaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu mentionne deux fois le nom Malkiya dans cette liste ; il s’agit vraisemblablement de deux hommes différents portant le même nom.
    reason: La répétition peut sembler accidentelle au lecteur, mais elle appartient au texte hébreu et doit être conservée.
lexical_decisions:
- source_word: וּמִיִּשְׂרָאֵל
  choice: Et parmi les Israélites
  rationale: La conjonction maintient le lien avec la liste précédente. Dans ce contexte, « parmi les Israélites » introduit naturellement une nouvelle catégorie de personnes, tandis que le pluriel collectif rend l’expression idiomatique en français.
- source_word: מִבְּנֵי
  choice: des fils de
  rationale: Cette formulation conserve la structure généalogique et clanique de l’hébreu. Ici, « fils de » peut désigner les descendants ou les membres de la famille de Parosh.
- source_word: פַרְעֹשׁ
  choice: Parosh
  rationale: Transcription directe du nom propre hébreu, adaptée à la lecture française.
- source_word: רַמְיָה
  choice: Ramya
  rationale: Transcription française concise du nom hébreu, où « y » rend la consonne י.
- source_word: יִזִּיָּה
  choice: Yizziya
  rationale: La transcription conserve le yod initial, la consonne redoublée et la terminaison du nom hébreu.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: La même transcription est retenue aux deux occurrences, conformément au texte hébreu, qui répète exactement ce nom.
- source_word: מִיָּמִן
  choice: Miyamin
  rationale: Transcription proche de la forme massorétique et aisément prononçable en français.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Forme française traditionnelle et bien établie de ce nom biblique.
- source_word: בְנָיָה
  choice: Benaya
  rationale: Transcription adaptée au français qui reflète les consonnes et la vocalisation du nom hébreu.
