lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Et parmi les descendants de
  rationale: La conjonction וּ est rendue par « Et », tandis que מִן a ici une valeur partitive, naturellement exprimée par « parmi ». Dans cette liste familiale, « descendants » communique mieux que « fils » le sens collectif de בְּנֵי en français actuel.
- source_word: חָרִם
  choice: Harim
  rationale: Nom propre familial, translittéré sous une forme claire et usuelle en français.
- source_word: מַעֲשֵׂיָה
  choice: Maaséya
  rationale: Translittération française moderne du nom hébreu, qui conserve sa forme sémitique sans en traduire le sens.
- source_word: וְ/אֵלִיָּה
  choice: Élie
  rationale: Forme française traditionnelle et immédiatement reconnaissable de ce nom biblique; la conjonction est intégrée à l’énumération française.
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: Shemaya
  rationale: Translittération lisible en français moderne, proche de la forme hébraïque.
- source_word: וִ/יחִיאֵל
  choice: Yehiel
  rationale: Translittération qui représente clairement la consonne initiale hébraïque et reste naturelle pour le lectorat francophone.
- source_word: וְ/עֻזִיָּה
  choice: Ouzziya
  rationale: Translittération française proche de l’hébreu; la conjonction est rendue par « et » devant le dernier élément de la liste.
