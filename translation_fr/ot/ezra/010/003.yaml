source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: fr
  text: Maintenant, concluons une alliance avec notre Dieu afin de renvoyer toutes les femmes et les enfants nés d’elles, selon le conseil de mon seigneur[a] et de ceux qui tremblent devant le commandement de notre Dieu. Que cela soit fait conformément à la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Seigneur ». L’hébreu peut être compris soit comme un titre appliqué à Dieu, soit comme un titre respectueux désignant un supérieur humain.'
    reason: Signaler l’ambiguïté réelle d’אַדֹנָי sans présenter le titre, dans ce contexte, comme une adresse directe.
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: concluons une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance », mais le français idiomatique dit « conclure une alliance ».
- source_word: לְהוֹצִיא
  choice: renvoyons
  rationale: Dans ce contexte, le verbe exprime l’éloignement ou l’expulsion des femmes concernées; « renvoyer » reste naturel sans ajouter de précision juridique absente du texte.
- source_word: כָל נָשִׁים
  choice: toutes ces femmes
  rationale: נָשִׁים peut désigner des « femmes » ou des « épouses ». Le démonstratif implicite en français renvoie aux femmes évoquées dans le contexte, tandis que « femmes » préserve la portée lexicale du terme.
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: ainsi que les enfants nés d’elles
  rationale: Littéralement « et ce qui est né d’elles ». Le contexte humain justifie « les enfants », formulation claire qui conserve le lien maternel explicite.
- source_word: הַחֲרֵדִים בְּמִצְוַת
  choice: ceux qui tremblent devant le commandement
  rationale: « Trembler devant » rend l’attitude de crainte révérencielle et de soumission associée au commandement.
- source_word: כַתּוֹרָה
  choice: conformément à la Loi
  rationale: תּוֹרָה désigne ici la Loi normative; la majuscule indique la Loi divine sans surinterpréter son contenu précis.
theological_decisions:
- issue: Identité de אֲדֹנָי dans « selon le conseil de… »
  choice: mon seigneur[a]
  alternative: le Seigneur
  rationale: La forme massorétique peut se lire comme le titre divin « le Seigneur », mais le contexte et la tradition ancienne de traduction permettent de comprendre une adresse respectueuse à un dirigeant humain, vraisemblablement Esdras. La note conserve cette ambiguïté réelle.
- issue: Nature exacte du renvoi
  choice: renvoyons toutes ces femmes ainsi que les enfants
  alternative: répudions toutes les épouses étrangères et leurs enfants
  rationale: Le verset ordonne leur éloignement, mais ne précise pas ici le mécanisme juridique et n’emploie pas dans cette proposition un adjectif signifiant « étrangères ». La traduction évite donc d’ajouter ces qualifications, tout en laissant le contexte du passage les éclairer.
translation_notes:
  register: Français moderne, clair et digne. L’impératif collectif traduit la valeur exhortative de l’hébreu. La ponctuation en deux phrases allège la longue coordination sans modifier sa progression logique.
