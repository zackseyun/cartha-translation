    rationale: Le texte hébreu porte « toutes les femmes »; le contexte permet de savoir lesquelles sont visées, mais le démonstratif français ajoute une détermination non exprimée.
  - severity: medium
    issue: Élargissement du sujet dans « Que tout soit fait »
    rationale: Le passif impersonnel singulier יֵעָשֶׂה vise l’exécution de la proposition énoncée; « que cela soit fait » conserve ce renvoi sans transformer le sens en une prescription générale.
  - severity: low
