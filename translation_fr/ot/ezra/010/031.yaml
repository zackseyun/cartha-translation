lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Parmi les fils de
  rationale: Dans le contexte de la liste d’Esdras 10, les noms désignent certains membres du groupe familial de Harim. « Parmi » rend naturellement cette valeur partitive implicite, tandis que la variante littérale est signalée en note.
- source_word: חָרִם
  choice: Harim
  rationale: Nom propre de personne et de groupe familial, translittéré sous une forme claire et courante en français.
- source_word: אֱלִיעֶזֶר
  choice: Éliézer
  rationale: Forme française usuelle du nom hébreu, avec les accents nécessaires à une lecture naturelle.
- source_word: יִשִּׁיָּה
  choice: Yishiya
  rationale: Translittération lisible qui reflète directement les consonnes et les voyelles du texte massorétique; d’autres conventions sont indiquées en note.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Translittération française transparente du nom hébreu, sans recourir à la graphie archaïsante « ch » pour כ.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Translittération française simple et proche de la forme hébraïque.
- source_word: שִׁמְעוֹן
  choice: Shiméon
  rationale: Cette forme représente le son initial שׁ; la forme française traditionnelle « Siméon » est conservée en note.
