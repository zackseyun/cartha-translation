source:
  edition: WLC
  text: וַ/יָּ֨קָם עֶזְרָ֤א הַ/כֹּהֵן֙ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַתֶּ֣ם מְעַלְתֶּ֔ם וַ/תֹּשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת לְ/הוֹסִ֖יף עַל אַשְׁמַ֥ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: fr
  text: 'Alors le prêtre Esdras se leva et leur dit : « Vous avez été infidèles : vous avez pris pour femmes des étrangères[a], ajoutant ainsi à la culpabilité d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fait habiter des femmes étrangères » ; dans ce contexte, il s’agit de femmes prises en mariage.
    reason: La note conserve le sens concret de la tournure hébraïque et son ambiguïté lexicale, tandis que le texte principal exprime naturellement sa portée matrimoniale dans ce passage.
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום décrit ici l’action publique d’Esdras qui se met debout devant l’assemblée. « Se leva » est naturel et fidèle au mouvement exprimé.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Titre apposé au nom d’Esdras, rendu directement avec l’article défini.
- source_word: מְעַלְתֶּם
  choice: vous avez été infidèles
  rationale: Le verbe מעל exprime une infidélité grave, souvent dans un cadre d’alliance. Cette formulation conserve sa portée morale et communautaire sans recourir à un vocabulaire technique.
- source_word: וַתֹּשִׁיבוּ
  choice: vous avez pris pour femmes
  rationale: Le hiphil de ישב signifie littéralement « faire habiter » ou « installer ». Avec נָשִׁים נָכְרִיּוֹת et dans le contexte du chapitre, il désigne l’introduction de ces femmes dans le foyer par le mariage. « Prendre pour femmes » reste proche de l’expression hébraïque tout en étant clair en français.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: des étrangères
  rationale: נָשִׁים peut désigner des femmes ou des épouses. La construction « prendre pour femmes des étrangères » explicite la relation matrimoniale indiquée par le contexte, tout en conservant l’idée de femmes étrangères au peuple d’Israël.
- source_word: לְהוֹסִיף
  choice: ajoutant ainsi
  rationale: L’infinitif exprime ici le résultat de l’acte précédent. « Ainsi » rend naturellement ce lien sans trancher rigidement entre but et conséquence.
- source_word: אַשְׁמַת
  choice: la culpabilité
  rationale: Dans ce contexte, אַשְׁמָה désigne la culpabilité ou la responsabilité encourue, et non une offrande de réparation. « Culpabilité » rend clairement cette notion.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne collectivement le peuple de l’alliance et doit être conservé tel quel.
theological_decisions:
- issue: Culpabilité collective du peuple de l’alliance
  choice: ajoutant ainsi à la culpabilité d’Israël
  alternative: augmentant ainsi la faute d’Israël
  rationale: Le texte présente ces mariages non comme une conduite uniquement privée, mais comme un accroissement de la culpabilité de la communauté. La formulation choisie préserve cette dimension collective sans développer davantage le propos hébreu.
- issue: Nature matrimoniale de l’acte reproché
  choice: vous avez pris pour femmes des étrangères
  alternative: vous avez fait habiter des femmes étrangères
  rationale: La forme verbale peut se rendre littéralement par « faire habiter », mais le contexte immédiat et celui du chapitre indiquent l’établissement de femmes étrangères dans les foyers en qualité d’épouses. La traduction explicite ce contexte sans introduire de motif doctrinal absent du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde le ton d’une accusation publique. « Prendre pour femmes » est légèrement soutenu mais courant dans un contexte biblique et plus proche de la formulation hébraïque que le simple verbe « épouser ».
