  text: אַ֣ךְ יוֹנָתָ֧ן בֶּן עֲשָׂהאֵ֛ל וְ/יַחְזְיָ֥ה בֶן תִּקְוָ֖ה עָמְד֣וּ עַל זֹ֑את וּ/מְשֻׁלָּ֛ם וְ/שַׁבְּתַ֥י הַ/לֵּוִ֖י עֲזָרֻֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: fr
  text: Seuls Jonathan, fils d’Asaël, et Yahzeya, fils de Tiqva[a], s’opposèrent à cette décision[c] ; Meshoullam et Shabbetai le Lévite les soutinrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahazia, fils de Tiqva ».
    reason: Variante de translittération du nom propre.
  - marker: b
    text: Ou « les aidèrent » ou « leur prêtèrent assistance ».
    reason: Le verbe hébreu désigne l’aide ou l’assistance ; « soutinrent » l’adapte au contexte d’une prise de position.
  - marker: c
    text: 'Autre compréhension possible : « furent chargés de cette affaire » ; la fin du verset signifierait alors : « Meshoullam et Shabbetai le Lévite les aidèrent ».'
    reason: L’expression hébraïque עמד על peut décrire soit une prise de position contre quelque chose dans ce contexte, soit le fait d’être préposé à une affaire. La note préserve cette ambiguïté réelle.
lexical_decisions:
- source_word: אַךְ
  choice: Seuls
  rationale: Dans ce contexte, la particule introduit une exception à l’accord général mentionné juste avant. « Seuls » exprime naturellement cette valeur restrictive.
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: Jonathan, fils d’Asaël
  rationale: Les noms sont translittérés selon un usage français lisible, et בֶּן est rendu par « fils de ».
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: Yahzeya, fils de Tiqva
  rationale: « Yahzeya » suit de près la vocalisation massorétique יַחְזְיָה. Une graphie traditionnelle différente est signalée en note.
- source_word: עָמְדוּ עַל זֹאת
  choice: s’opposèrent à cette décision
  rationale: Dans le contexte, l’expression indique probablement une prise de position contre la procédure proposée. « Cette décision » renvoie naturellement à la mesure adoptée, tout en évitant une formulation française obscure.
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: Meshoullam et Shabbetai le Lévite
  rationale: L’apposition « le Lévite » qualifie le plus naturellement Shabbetai seul dans la syntaxe hébraïque.
- source_word: עֲזָרֻם
  choice: les soutinrent
  rationale: Le verbe עזר avec le suffixe pluriel signifie « les aidèrent ». Dans ce contexte de désaccord, « les soutinrent » exprime le fait de se ranger à leurs côtés sans exclure une aide concrète.
theological_decisions:
- issue: Sens de עָמְדוּ עַל זֹאת
  choice: Opposition à la décision
  alternative: Être chargés de l’affaire / veiller à son exécution
  rationale: La construction permet plus d’une lecture. Le contexte et l’emploi de אַךְ favorisent l’idée d’une exception opposée au consensus, mais l’autre compréhension ancienne et grammaticalement possible est conservée en note.
translation_notes:
  register: Français moderne, digne et accessible. Les noms sont translittérés de manière cohérente et lisible. La phrase conserve la force restrictive de אַךְ et rend explicite le référent de « cela » par « cette décision ». L’ambiguïté syntaxique principale est préservée en note plutôt que résolue silencieusement.
