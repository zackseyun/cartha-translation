  text: ק֛וּם כִּֽי עָלֶ֥י/ךָ הַ/דָּבָ֖ר וַ/אֲנַ֣חְנוּ עִמָּ֑/ךְ חֲזַ֖ק וַ/עֲשֵֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/004.yaml
  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: fr
  text: Lève-toi[a], car cette affaire repose sur toi, et nous sommes avec toi. Sois fort et agis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cette affaire t’incombe » ou « cette responsabilité est la tienne ». L’expression hébraïque indique que la charge de régler cette affaire revient à Esdras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: Lève-toi
  rationale: L’impératif appelle Esdras à se mettre immédiatement à l’action. « Lève-toi » est direct, naturel et conserve la force exhortative de l’hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de l’ordre précédent. « Car » convient au registre concis et digne du passage.
- source_word: עָלֶיךָ הַדָּבָר
  choice: cette affaire repose sur toi
  rationale: La tournure avec עַל indique qu’une affaire ou une responsabilité incombe à quelqu’un. Cette formulation conserve l’image hébraïque tout en restant intelligible en français.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: et nous sommes avec toi
  rationale: Rend simplement l’expression de solidarité et de soutien.
- source_word: חֲזַק
  choice: Sois fort
  rationale: L’impératif de חזק exhorte à la fermeté. « Sois fort » en conserve le lien lexical avec la force sans réduire le sens au seul courage émotionnel.
- source_word: וַעֲשֵׂה
  choice: et agis
  rationale: L’impératif demande de passer concrètement à l’action. « Agis » est naturel en français et évite le pronom vague qu’exigerait « fais-le ».
