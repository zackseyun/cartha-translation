- source_word: וּ/בָנִי
  choice: Bani
  rationale: Nom propre translittéré selon sa forme française usuelle. Le וּ coordonne ce nom avec la liste précédente; en français, la coordination est rendue naturellement par « et » devant le dernier élément de la série.
- source_word: וּ/בִנּוּי
  choice: Binnouï
  rationale: Nom propre translittéré sous la forme française traditionnelle « Binnouï ». Le וּ hébreu appartient à une succession coordonnée; le français évite ici de répéter « et » devant chaque nom.
- source_word: שִׁמְעִי
  choice: Shimeï
  rationale: Nom propre translittéré sous la forme française courante « Shimeï ». Bien qu'aucune conjonction ne précède ce dernier nom en hébreu, le français place naturellement « et » devant le dernier élément d'une énumération.
