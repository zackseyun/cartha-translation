  source_fidelity: 'Le sens général est fidèlement rendu : délai de comparution, décision des responsables et des anciens, sanction portant sur les biens, puis séparation de l’assemblée des exilés. Toutefois, « verra tous ses biens voués à l’interdit » est une construction moins directe et moins naturelle que la voix passive du texte hébreu. « Dans les trois jours » peut aussi être précisé comme un délai sans surinterpréter son calcul.'
  naturalness: La formulation proposée est globalement claire et de registre approprié. « Seront frappés d’interdit » est plus idiomatique en français juridique et religieux que « verront ... voués à l’interdit », tout en conservant le caractère technique de חרם.
  terminology: « Responsables », « anciens », « assemblée des exilés » et « séparé » sont appropriés. « Frappés d’interdit » rend bien la mise sous חרם sans la réduire à une confiscation certaine ni importer la catégorie ultérieure d’« excommunication ».
