source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: fr
  text: Et quiconque ne viendra pas dans un délai de trois jours, conformément à la décision des responsables et des anciens, tous ses biens seront frappés d’interdit[a], et lui-même sera séparé de l’assemblée des exilés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confisqués » ou « voués à la destruction ». Le verbe hébreu renvoie au חֵרֶם (ḥèrem), une mise sous interdit ou une consécration irrévocable qui peut impliquer la destruction ou la confiscation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר לֹא יָבוֹא
  choice: Et quiconque ne viendra pas
  rationale: « Quiconque » restitue naturellement la portée générale et distributive de la formule; le futur convient à la prescription annoncée.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: dans les trois jours
  rationale: Cette expression française indique clairement le délai fixé sans préciser artificiellement son mode de calcul.
- source_word: כַּעֲצַת הַשָּׂרִים וְהַזְּקֵנִים
  choice: conformément à la décision des responsables et des anciens
  rationale: Dans ce contexte administratif, עֵצָה désigne une détermination faisant autorité, et שׂרים des responsables plutôt que des « princes ».
- source_word: יָחֳרַם כָּל רְכוּשׁוֹ
  choice: verra tous ses biens voués à l’interdit
  rationale: La tournure française reste lisible tout en conservant la valeur technique de חרם, qui dépasse la simple confiscation et peut impliquer une mise sous interdit en vue de la destruction.
- source_word: וְהוּא יִבָּדֵל
  choice: et sera lui-même séparé
  rationale: « Lui-même » rend le pronom explicite, tandis que « séparé » conserve le sens du nifal sans importer la notion ecclésiastique ultérieure d’excommunication.
- source_word: מִקְּהַל הַגּוֹלָה
  choice: de l’assemblée des exilés
  rationale: « Assemblée » rend קהל sans coloration ecclésiastique indue; « exilés » traduit directement הגולה dans le contexte de la communauté revenue d’exil.
theological_decisions:
- issue: Sens de la peine exprimée par חרם à propos des biens
  choice: voués à l’interdit
  alternative: confisqués; voués à la destruction
  rationale: Le terme technique חרם exprime une mise sous interdit ou une consécration irrévocable, souvent liée à la destruction. Le contexte peut impliquer concrètement une confiscation, mais le texte ne doit pas être réduit sans indication à cette seule conséquence administrative.
- issue: Nature de la séparation d’avec la communauté
  choice: séparé de l’assemblée
  alternative: exclu de la communauté; excommunié
  rationale: Le verset affirme une séparation communautaire sans définir une catégorie ecclésiastique ultérieure; la formulation retenue préserve cette réserve.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste ferme sans archaïsme; « voués à l’interdit » conserve la tension lexicale du terme hébreu, explicitée en note.
