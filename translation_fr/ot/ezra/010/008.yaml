  rationale: La révision remplace une tournure indirecte et quelque peu lourde par une voix passive française naturelle, qui reflète directement la sanction exprimée en hébreu. Elle clarifie aussi la valeur de délai. La note conserve les principales nuances possibles de חרם, sans décider au-delà de ce que le texte permet.
