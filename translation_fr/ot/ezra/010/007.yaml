  yaml_path: translation/ot/ezra/010/007.yaml
  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: fr
  text: 'On fit publier dans tout Juda et à Jérusalem une proclamation adressée à tous les fils de l’exil[a] : ils devaient se rassembler à Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à tous les exilés » ou « à tous ceux qui étaient revenus d’exil ». Littéralement : « à tous les fils de l’exil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: On fit publier … une proclamation
  rationale: L’expression formée du hiphil de עבר et de קוֹל désigne la diffusion publique d’un avis. Cette formulation française rend naturellement la valeur causative et le caractère officiel de l’annonce.
- source_word: בִּיהוּדָה וִירוּשָׁלִַם
  choice: dans tout Juda et à Jérusalem
  rationale: La préposition situe l’espace où la proclamation circule. « Dans tout Juda » exprime sa diffusion à travers le territoire, tandis que « à Jérusalem » convient naturellement pour la ville.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: à tous les fils de l’exil
  rationale: 'Cette traduction conserve l’expression hébraïque et son masculin grammatical, tout en laissant la note préciser son sens idiomatique : la communauté des exilés, notamment ceux revenus d’exil.'
- source_word: הַגּוֹלָה
  choice: l’exil
  rationale: Le nom peut désigner l’état ou l’événement de l’exil, ainsi que la communauté qui en est issue. « L’exil » préserve ici la formulation concise et l’ambivalence du texte source.
- source_word: לְהִקָּבֵץ
  choice: ils devaient se rassembler
  rationale: L’infinitif niphal avec ל exprime le contenu ou le but de la proclamation. « Devaient se rassembler » rend clairement la convocation en français moderne.
- source_word: יְרוּשָׁלִָם
  choice: à Jérusalem
  rationale: Après « se rassembler », « à Jérusalem » indique naturellement le lieu de rassemblement et peut aussi évoquer le mouvement vers la ville sans surinterpréter la syntaxe.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure impersonnelle « On fit publier » évite d’expliciter un sujet que l’hébreu laisse seulement sous la forme « ils », tandis que les deux-points introduisent naturellement le contenu de la proclamation.
