  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: fr
  text: Tous les hommes de Juda et de Benjamin se rassemblèrent à Jérusalem dans le délai de trois jours[a]. C’était le neuvième mois, le vingtième jour du mois. Tout le peuple s’assit sur la place du temple de Dieu[b], tremblant à cause de cette affaire et des pluies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au terme des trois jours ».
    reason: La construction hébraïque indique le respect du délai fixé, mais peut se rendre de plusieurs façons.
  - marker: b
    text: Ou « sur la place devant le temple de Dieu ». Le mot hébreu désigne un vaste espace ouvert, pas nécessairement une cour intérieure.
    reason: La relation spatiale de la place avec le temple n’est pas entièrement explicitée.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: se rassemblèrent
  rationale: Le niphal de קבץ exprime ici le fait de se réunir; « se rassemblèrent » est naturel et fidèle au mouvement collectif.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: tous les hommes de Juda et de Benjamin
  rationale: אַנְשֵׁי est grammaticalement masculin et signifie littéralement « hommes de »; le contexte vise vraisemblablement les hommes ou représentants convoqués.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: dans le délai de trois jours
  rationale: La formule renvoie au délai de trois jours fixé auparavant; cette tournure française exprime clairement la limite temporelle.
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: C’était le neuvième mois, le vingtième jour du mois
  rationale: Rendu direct de la datation hébraïque, dans un français actuel et digne.
- source_word: וַיֵּשְׁבוּ
  choice: s’assit
  rationale: ישׁב signifie ici s’asseoir ou rester assis; le singulier convient au collectif « tout le peuple ».
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: sur la place du temple de Dieu
  rationale: רְחוֹב désigne une vaste aire ouverte ou place, sans imposer l’idée d’une cour intérieure; dans ce contexte, « temple de Dieu » rend naturellement בֵּית הָאֱלֹהִים.
- source_word: מַרְעִידִים
  choice: tremblant
  rationale: Le participe exprime un tremblement physique pouvant provenir à la fois de l’inquiétude suscitée par l’affaire et des conditions météorologiques.
- source_word: עַל הַדָּבָר
  choice: à cause de cette affaire
  rationale: דָּבָר renvoie ici à la crise précise qui fait l’objet de l’assemblée; « cette affaire » conserve la valeur contextuelle sans l’expliciter davantage.
- source_word: וּמֵהַגְּשָׁמִים
  choice: et des pluies
  rationale: Le pluriel גְּשָׁמִים est conservé sans ajouter explicitement l’intensité « fortes », que le texte ne formule pas.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve la mention masculine explicite, la datation ancienne et le double motif du tremblement, tout en évitant d’ajouter « fortes » à « pluies ».
