lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Et parmi les fils de
  rationale: La conjonction, la préposition et le pluriel construit introduisent ici certains membres du groupe familial. « Parmi les fils de » est naturel en français tout en conservant le langage généalogique de l’hébreu.
- source_word: בָּנִי
  choice: Bani
  rationale: Nom propre translittéré.
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: Translittération française lisible du nom propre hébreu.
- source_word: מַלּוּךְ
  choice: Mallouk
  rationale: Translittération française qui rend naturellement la voyelle ou et la consonne finale du nom hébreu.
- source_word: וַ/עֲדָיָה
  choice: Adaya
  rationale: Le nom propre est translittéré; la conjonction hébraïque est intégrée à la ponctuation française de l’énumération.
- source_word: יָשׁוּב
  choice: Yashoub
  rationale: Translittération française conforme à la vocalisation massorétique.
- source_word: וּ/שְׁאָל
  choice: Shéal
  rationale: Translittération française du nom selon la vocalisation massorétique; la conjonction est rendue par la coordination finale de la liste française.
- source_word: ירמות
  choice: Ramoth
  rationale: Le texte consonantique permet plusieurs analyses. « Ramoth » suit la lecture massorétique traditionnelle largement reflétée dans les traductions, tandis que l’autre forme possible est signalée en note.
