  text: וַ/יִּתְּנ֥וּ יָדָ֖/ם לְ/הוֹצִ֣יא נְשֵׁי/הֶ֑ם וַ/אֲשֵׁמִ֥ים אֵֽיל צֹ֖אן עַל אַשְׁמָתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: fr
  text: Ils s’engagèrent[a] à renvoyer leurs femmes et, étant coupables, ils offrirent un bélier du troupeau en raison de leur faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils donnèrent leur main », expression hébraïque désignant un engagement solennel.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut expliciter le sens sacrificiel : « ils offrirent un bélier du troupeau comme sacrifice de réparation pour leur faute ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: Ils s’engagèrent
  rationale: L’expression signifie littéralement « donner sa main » et désigne ici un engagement solennel. La formulation retenue en restitue naturellement la valeur idiomatique en français moderne.
- source_word: לְהוֹצִיא
  choice: à renvoyer
  rationale: Le hiphil de יצא signifie ici faire sortir ou faire partir. Dans ce contexte matrimonial, « renvoyer » exprime la séparation demandée sans ajouter un terme juridique absent de l’hébreu.
- source_word: נְשֵׁיהֶם
  choice: leurs femmes
  rationale: Le contexte établit clairement qu’il s’agit de leurs épouses. « Leurs femmes » est une formulation française courante et digne.
- source_word: וַאֲשֵׁמִים
  choice: étant coupables
  rationale: L’adjectif décrit leur état de culpabilité. Cette traduction conserve le lien lexical avec אַשְׁמָתָם sans transformer explicitement le membre de phrase en proposition causale.
- source_word: אֵיל צֹאן
  choice: un bélier du troupeau
  rationale: La tournure désigne concrètement un bélier appartenant au petit bétail et destiné ici au sacrifice.
- source_word: עַל אַשְׁמָתָם
  choice: en raison de leur faute
  rationale: La préposition עַל indique ici le motif ou la cause de l’offrande. « En raison de leur faute » est naturel en français et évite de préciser dans le texte principal une catégorie sacrificielle qui demeure implicite.
theological_decisions:
- issue: Faut-il expliciter dans le texte principal qu’il s’agit d’un sacrifice de réparation ?
  choice: Conserver « ils offrirent un bélier du troupeau en raison de leur faute »
  alternative: « ils offrirent un bélier du troupeau comme sacrifice de réparation pour leur faute »
  rationale: L’hébreu mentionne explicitement le bélier et leur faute, mais n’emploie pas ici un nom distinct signifiant « offrande » ou « sacrifice de réparation ». Le verbe « offrirent » est suppléé pour rendre la proposition intelligible, tandis que la désignation sacrificielle plus technique est signalée en note afin de ne pas surdéterminer le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tour idiomatique hébreu est rendu par son sens dans le texte et conservé littéralement en note. La répétition entre « coupables » et « faute » reflète volontairement la parenté lexicale de l’hébreu.
