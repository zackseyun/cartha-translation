  text: וַ/יָּ֣קָם עֶזְרָ֡א וַ/יַּשְׁבַּ֣ע אֶת שָׂרֵי֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם וְ/כָל יִשְׂרָאֵ֗ל לַ/עֲשׂ֛וֹת כַּ/דָּבָ֥ר הַ/זֶּ֖ה וַ/יִּשָּׁבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: fr
  text: Alors Esdras se leva et fit jurer aux chefs des prêtres, aux lévites et à tout Israël d’agir conformément à cette parole[a]. Et ils jurèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conformément à cette affaire » ou « conformément à cette proposition ». Le mot hébreu peut désigner aussi bien une parole prononcée que l’affaire dont il est question.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום au wayyiqtol décrit le mouvement décisif d’Esdras qui se met à agir; « se leva » est naturel et conserve la progression narrative.
- source_word: וַיַּשְׁבַּע
  choice: fit jurer
  rationale: 'La forme hiphil de שׁבע est causative: Esdras amène les personnes désignées à prêter serment. « Fit jurer » rend directement cette valeur.'
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: les chefs des prêtres
  rationale: La construction désigne les dirigeants ou principaux responsables parmi les prêtres. « Chefs des prêtres » reste proche de la syntaxe hébraïque sans transformer explicitement l’expression en titre institutionnel.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation française traditionnelle et transparente du groupe lévitique.
- source_word: וְכָל יִשְׂרָאֵל
  choice: et tout Israël
  rationale: Conserve l’expression collective et son caractère communautaire plutôt que de la remplacer par « tous les Israélites ».
- source_word: לַעֲשׂוֹת
  choice: d’agir
  rationale: Dans ce contexte, עשה exprime la mise en œuvre de l’engagement proposé. « Agir » est plus naturel en français que « faire conformément à », tout en conservant l’idée d’exécution.
- source_word: כַּדָּבָר הַזֶּה
  choice: conformément à cette parole
  rationale: דָּבָר peut désigner une parole prononcée ou l’affaire dont il est question. Le texte retient « parole » pour préserver la proximité lexicale, tandis que la note maintient les autres sens possibles.
- source_word: וַיִּשָּׁבֵעוּ
  choice: Et ils jurèrent
  rationale: La forme niphal indique que les intéressés prêtèrent effectivement serment. La répétition de la racine שׁבע est conservée par la reprise de « jurer ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la répétition solennelle autour du serment et l’expression collective « tout Israël ». Le marqueur de note est placé après « cette parole », terme auquel porte l’alternative lexicale.
