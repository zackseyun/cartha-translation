source:
  edition: WLC
  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: fr
  text: 'Et voici la réponse qu’ils nous ont donnée[a] : « Nous sommes les serviteurs du Dieu du ciel et de la terre, et nous rebâtissons la maison qui avait été construite il y a bien des années[b]. Un grand roi d’Israël l’avait bâtie et achevée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et voici le message qu’ils nous ont renvoyé. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous construisons la maison ». Le participe araméen décrit une action en cours ; « rebâtissons » précise que cette maison avait été bâtie auparavant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: Voici la réponse qu’ils nous ont faite
  rationale: La formule araméenne introduit le contenu de la réponse. « Réponse » rend la fonction contextuelle de פִתְגָם, tandis que « qu’ils nous ont faite » exprime naturellement en français l’idée de rapporter une réponse.
- source_word: לְמֵמַר
  choice: ':'
  rationale: L’infinitif quotatif introduit le discours direct. En français actuel, les deux-points remplissent cette fonction plus naturellement qu’un participe tel que « disant ».
- source_word: עַבְדוֹהִי
  choice: serviteurs
  rationale: Le terme exprime ici le service et l’allégeance envers Dieu, sans mettre au premier plan la condition servile que suggérerait « esclaves ».
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: le Dieu du ciel et de la terre
  rationale: Cette formulation française naturelle conserve le titre divin et sa portée universelle.
- source_word: וּבָנַיִן
  choice: et nous rebâtissons
  rationale: Le participe marque une action en cours. « Rebâtissons » explicite, conformément au contexte immédiat, qu’il s’agit d’un édifice antérieur en cours de reconstruction; l’ambiguïté lexicale est signalée en note.
- source_word: בַּיְתָא
  choice: la maison
  rationale: La traduction littérale conserve la désignation araméenne du temple sans remplacer directement son image par « temple ».
- source_word: דִּי הֲוָא בְנֵה
  choice: qui avait été construite
  rationale: Le plus-que-parfait situe clairement cette première construction avant la reconstruction évoquée.
- source_word: מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: il y a bien des années
  rationale: Expression idiomatique qui rend « avant cela, de nombreuses années » tout en conservant l’insistance de שַׂגִּיאָן.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: Un grand roi d’Israël
  rationale: La formulation garde l’identification indirecte du roi et rend רַב par sa grandeur ou son éminence.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: l’avait bâtie et achevée
  rationale: Les deux verbes distinguent la construction de l’édifice et son achèvement; le pronom féminin reprend naturellement « maison ».
theological_decisions:
- issue: Titre divin dans la correspondance impériale
  choice: le Dieu du ciel et de la terre
  alternative: le Dieu des cieux et de la terre
  rationale: La traduction directe préserve l’affirmation de la souveraineté universelle du Dieu d’Israël sans la réduire à un titre local ou politique. Le singulier « ciel » est le tour français le plus idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours indirect introductif est allégé par les deux-points, et la citation directe est ponctuée selon l’usage français. « Maison » préserve l’image source pour le temple; « rebâtissons » assure la clarté contextuelle tout en maintenant l’alternative littérale en note.
