  text: וְ/אַ֧ף שְׁמָהָתְ/הֹ֛ם שְׁאֵ֥לְנָא לְּ/הֹ֖ם לְ/הוֹדָעוּתָ֑/ךְ דִּ֛י נִכְתֻּ֥ב שֻׁם גֻּבְרַיָּ֖/א דִּ֥י בְ/רָאשֵׁי/הֹֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/010.yaml
  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: fr
  text: Nous leur avons aussi demandé leurs noms afin de te les faire connaître et de consigner les noms des hommes qui étaient à leur tête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui étaient leurs chefs ». Littéralement : « qui étaient à leur tête ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Nous… aussi
  rationale: La tournure ajoute un nouvel élément au rapport des fonctionnaires et s’intègre naturellement au récit français.
- source_word: שְׁמָהָתְהֹם
  choice: leurs noms
  rationale: Le nom pluriel muni du suffixe de troisième personne du pluriel exprime simplement la possession.
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: leur avons demandé
  rationale: Le verbe araméen signifie « demander, interroger »; cette formulation est naturelle en français actuel.
- source_word: לְהוֹדָעוּתָךְ
  choice: afin de te les faire connaître
  rationale: L’infinitif causatif de ידע exprime le but et renvoie aux noms; le pronom « les » explicite ce lien sans ajouter d’information.
- source_word: דִּי נִכְתֻּב
  choice: pour pouvoir consigner
  rationale: La particule introduit ici le but de la demande. « Consigner » rend le sens documentaire de « écrire » dans ce rapport officiel.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: les noms des hommes
  rationale: שֻׁם, morphologiquement singulier, a ici une valeur collective, confirmée par le référent pluriel.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: qui étaient à leur tête
  rationale: Cette expression conserve la métaphore araméenne tout en étant idiomatique en français pour désigner les dirigeants du groupe.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement au singulier traduit le suffixe araméen de deuxième personne masculine singulière adressé au roi. La phrase conserve la progression du rapport officiel tout en évitant une syntaxe inutilement lourde.
