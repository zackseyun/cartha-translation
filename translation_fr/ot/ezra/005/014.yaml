source:
  edition: WLC
  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: fr
  text: De plus, les objets d’or et d’argent de la maison de Dieu, que Nabuchodonosor avait retirés du temple de Jérusalem et transportés dans le temple de Babylone, le roi Cyrus les retira du temple de Babylone et les remit à quelqu’un nommé Sheshbatsar[a], qu’il avait établi gouverneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « et les remit à Sheshbatsar — c’était son nom —, qu’il avait établi gouverneur ».'
    reason: Conserve en note la formule araméenne explicite שְׁמֵהּ (« son nom »), condensée dans le texte en « nommé » pour un français naturel.
lexical_decisions:
- source_word: וְאַף
  choice: De plus
  rationale: Rend la valeur additive du connecteur araméen dans un français naturel et soutenu.
- source_word: מָאנַיָּא
  choice: les objets
  rationale: Désigne ici les objets ou récipients employés dans le temple ; « objets » est clair et suffisamment large pour ne pas préciser indûment leur forme ou leur usage.
- source_word: בֵית אֱלָהָא
  choice: la maison de Dieu
  rationale: Conserve l’expression littérale « maison de Dieu » et la distingue de הֵיכְלָא, rendu ensuite par « temple ».
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: d’or et d’argent
  rationale: Exprime naturellement en français les matières dont les objets étaient faits.
- source_word: הַנְפֵּק
  choice: avait retirés / retira
  rationale: Le plus-que-parfait marque l’action antérieure de Nabuchodonosor ; le passé simple rend ensuite l’action principale de Cyrus, conformément à la reprise du même verbe.
- source_word: הֵיכְלָא
  choice: temple
  rationale: Dans les deux occurrences, le contexte cultuel désigne clairement un temple plutôt qu’un palais.
- source_word: וְהֵיבֵל הִמּוֹ
  choice: et transportés
  rationale: Rend le déplacement des objets jusqu’au temple de Babylone tout en maintenant leur fonction d’objet du verbe dans la proposition relative.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: le roi Cyrus
  rationale: Formulation française idiomatique correspondant au titre royal araméen.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: et les remit à un homme nommé Sheshbatsar
  rationale: Intègre naturellement la formule d’identification « son nom [était] Sheshbatsar » sans en perdre le sens ; la note conserve une forme plus proche de la syntaxe source.
- source_word: פֶחָה
  choice: gouverneur
  rationale: Équivalent courant et accessible du titre administratif perse.
- source_word: שָׂמֵהּ
  choice: avait établi
  rationale: Exprime l’installation officielle de Sheshbatsar dans sa fonction ; le plus-que-parfait situe cette nomination avant la remise des objets.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La distinction lexicale entre « maison de Dieu » et « temple » est maintenue. La longue phrase et la reprise pronominale « le roi Cyrus les retira » reflètent la structure de l’araméen sans produire un calque lourd.
