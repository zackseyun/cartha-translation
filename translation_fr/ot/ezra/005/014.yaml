    issue: « à un homme nommé Sheshbatsar » précise indûment le référent comme « homme ».
    rationale: Le texte araméen emploie la formule « à Sheshbatsar, son nom », qui identifie une personne sans employer le nom commun « homme ». Le contexte du titre de gouverneur permet de comprendre la personne, mais ne requiert pas cet ajout dans la traduction.
  - severity: low
    issue: La note pourrait reproduire plus nettement la formule d’identification araméenne.
    rationale: « Tel était son nom » est compréhensible, mais « c’était son nom » rend plus directement la brève apposition שְׁמֵהּ tout en signalant son caractère formel.
