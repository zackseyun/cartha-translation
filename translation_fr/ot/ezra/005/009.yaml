  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: fr
  text: 'Alors nous avons interrogé ces anciens et leur avons dit : « Qui vous a donné l’ordre de bâtir cette maison et d’achever cette structure ? »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « maison »; dans ce contexte, il s’agit du temple.
    reason: lexical_alternative
  - marker: b
    text: Le terme araméen traduit par « structure » peut désigner plus précisément le gros œuvre, la charpente ou l’ensemble de la construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque naturellement la progression du récit et du rapport administratif.
- source_word: שְׁאֵלְנָא לְשָׂבַיָּא אִלֵּךְ
  choice: nous avons interrogé ces anciens
  rationale: « Interroger » rend la demande officielle d’information; « ces anciens » conserve la valeur déictique de אִלֵּךְ.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: et leur avons demandé
  rationale: Introduit directement et idiomatiquement le contenu de la question; évite la lourdeur de « leur avons dit ainsi » tout en conservant l’acte de parole.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Qui vous a donné l’ordre
  rationale: טְעֵם désigne ici une décision ou prescription officielle. « L’ordre » convient au registre administratif sans préciser indûment qu’il s’agit d’un décret royal formel.
- source_word: בַּיְתָא דְנָה
  choice: cette maison
  rationale: Conserve le sens littéral de « maison »; le contexte indique qu’il s’agit du temple.
- source_word: לְמִבְנְיָה
  choice: de bâtir
  rationale: Rend le verbe simplement comme « bâtir », sans ajouter la nuance contextuelle de reconstruction.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: cette structure
  rationale: Le substantif rare peut désigner la construction, son gros œuvre ou sa charpente; « structure » préserve cette latitude.
- source_word: לְשַׁכְלָלָה
  choice: d’achever
  rationale: Exprime l’action de mener l’ouvrage à son accomplissement dans un registre digne et naturel.
