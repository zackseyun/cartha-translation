revisions:
- from: Mais l’œil de leur Dieu était posé sur les anciens des Juifs[a], et ils ne les forcèrent pas à s’arrêter jusqu’à ce qu’un rapport parvienne à Darius[b] ; ensuite, ils rapporteraient une lettre à ce sujet[c].
  to: Mais l’œil de leur Dieu était sur les anciens des Juifs[a], et ils ne les firent pas cesser jusqu’à ce qu’une décision soit portée devant Darius[b] ; ils enverraient alors une lettre en réponse à ce sujet[c].
  rationale: La révision remplace deux choix qui restreignaient ou obscurcissaient le sens administratif araméen. « Une décision soit portée devant Darius » rend le mouvement vers le roi et maintient l’ambiguïté lexicale de טַעְמָא, explicitée en note. La dernière proposition est reformulée pour exprimer idiomatiquement l’envoi en retour d’une lettre, sans préciser indûment son destinataire. Les trois appels de note sont conservés et ancrés aux unités qu’ils qualifient.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:00:17Z'
review_pass:
  verdict: revise
  source_fidelity: La métaphore singulière (« l’œil de leur Dieu »), les « anciens des Juifs », l’empêchement exprimé au causatif et la séquence procédurale sont bien reconnus. Toutefois, « rapport » ne rend pas de façon sûre טַעְמָא, qui désigne plus naturellement ici une décision, un ordre ou un décret administratif. « Rapporter une lettre » est ambigu et peu naturel en français pour יְתִיבוּן נִשְׁתְּוָנָא dans ce contexte; il s’agit de l’envoi en retour d’une communication écrite.
  naturalness: « L’œil de leur Dieu était sur » demeure une formulation biblique intelligible et conserve l’image du texte, tout en étant plus idiomatique que « était posé sur ». « Ils enverraient alors une lettre en réponse » exprime clairement et naturellement la dernière proposition sans imposer un destinataire absent du texte.
  terminology: « Anciens des Juifs » préserve le terme institutionnel. « Décision » est retenu pour טַעְמָא comme terme administratif suffisamment large; la note indique les possibilités « ordre » et « décret ». « Lettre » rend נִשְׁתְּוָנָא sans surcharger le texte principal.
  issues:
  - severity: medium
    issue: « un rapport parvienne à Darius » pour עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
    rationale: Le sens de « rapport » n’est pas l’option lexicale la mieux fondée pour טַעְמָא dans cette expression administrative. Le mot peut désigner une décision, un ordre ou un décret; une traduction française large doit conserver cette valeur sans réduire le terme à un exposé ou rapport.
  - severity: medium
    issue: « ils rapporteraient une lettre » pour יְתִיבוּן נִשְׁתְּוָנָא
    rationale: En français moderne, « rapporter une lettre » peut signifier relater une lettre ou ramener matériellement une lettre et n’exprime pas clairement la réponse écrite attendue. « Envoyer une lettre en réponse » rend mieux le retour communicationnel indiqué par le contexte tout en gardant le futur envisagé.
  - severity: low
    issue: « l’œil ... était posé sur »
    rationale: La formulation est compréhensible, mais « l’œil ... était sur » est plus direct en français biblique moderne et conserve sans ajout la métaphore araméenne.
  revised_text: Mais l’œil de leur Dieu était sur les anciens des Juifs[a], et ils ne les firent pas cesser jusqu’à ce qu’une décision soit portée devant Darius[b] ; ils enverraient alors une lettre en réponse à ce sujet[c].
