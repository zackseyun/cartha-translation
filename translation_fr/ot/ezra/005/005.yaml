base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: fr
  text: Mais l’œil de leur Dieu était sur les anciens des Juifs[a], et ils ne les firent pas cesser jusqu’à ce qu’une décision soit portée devant Darius[b] ; ils enverraient alors une lettre en réponse à ce sujet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur Dieu veillait sur les anciens des Juifs ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme araméen peut aussi désigner un ordre ou un décret officiel.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils renverraient une réponse écrite à ce sujet ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: Mais l’œil de leur Dieu était posé sur
  rationale: Conserve la métaphore concrète et le suffixe possessif explicite. « Mais » rend le contraste avec l’intervention des autorités au verset précédent, tandis que « était posé sur » reste naturel en français soutenu.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: les anciens des Juifs
  rationale: שָׂבֵי désigne les anciens, et la construction génitive est reproduite sans généraliser en « chefs ».
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: et ils ne les forcèrent pas à s’arrêter
  rationale: Le pael exprime ici le fait de provoquer l’arrêt. Cette formulation en garde la valeur causative sans ajouter explicitement « les travaux », absent du texte.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: jusqu’à ce qu’un rapport parvienne à Darius
  rationale: Dans ce contexte administratif, טַעְמָא peut désigner le rapport ou l’exposé de l’affaire soumis au roi. Le mouvement vers Darius favorise « rapport » plutôt que « décret », tout en laissant les autres valeurs possibles en note.
- source_word: וֶאֱדַיִן
  choice: ensuite
  rationale: Marque clairement l’étape suivante de la procédure.
- source_word: יְתִיבוּן נִשְׁתְּוָנָא
  choice: ils rapporteraient une lettre
  rationale: Le verbe exprime un retour ou le fait de ramener, et נִשְׁתְּוָנָא désigne une communication écrite officielle. « Rapporteraient une lettre » conserve l’image du retour sans déterminer plus précisément que le texte le sens du transport ou de la réponse.
- source_word: עַל דְּנָה
  choice: à ce sujet
  rationale: Rend naturellement le démonstratif et son rapport à l’affaire en cours.
theological_decisions:
- issue: Description anthropomorphique de la vigilance divine
  choice: Conserver « l’œil de leur Dieu était posé sur » dans le texte principal
  alternative: « leur Dieu veillait sur »
  rationale: L’araméen emploie l’image concrète de l’œil pour évoquer la surveillance protectrice de Dieu. La traduction maintient cette force littéraire sans développer une doctrine particulière de la providence.
- issue: Nature de l’intervention auprès de Darius
  choice: « un rapport parvienne à Darius »
  alternative: « une décision / un ordre parvienne à Darius »
  rationale: Le contexte décrit la transmission de l’affaire au roi, mais le nom araméen possède une gamme administrative plus large. La traduction principale suit la direction du mouvement vers Darius sans effacer l’alternative lexicale.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore sémitique de l’œil est conservée. Le conditionnel « rapporteraient » exprime l’étape attendue après la saisine de Darius. Les pronoms pluriels reprennent les autorités mentionnées dans le contexte précédent, sans les nommer de nouveau.
