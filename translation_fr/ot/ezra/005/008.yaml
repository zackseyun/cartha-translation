base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: fr
  text: Que le roi sache que nous sommes allés dans la province de Juda, à la maison du grand Dieu. Elle est en cours de construction avec de grandes pierres[a], et du bois est mis en place dans les murs. Ce travail est exécuté avec diligence[b] et réussit grâce à eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec de très grandes pierres ». L’expression araméenne peut désigner de grosses pierres de construction; son sens précis est discuté.
    reason: lexical_alternative
  - marker: b
    text: Ou « soigneusement », ou peut-être « rapidement ». La nuance exacte de l’adverbe araméen est discutée, mais il indique que le travail avance efficacement.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: Que le roi sache
  rationale: Formule administrative araméenne introduisant un rapport officiel; cette tournure conserve la solennité tout en étant naturelle en français actuel.
- source_word: לִיהוּד מְדִינְתָּא
  choice: dans la province de Juda
  rationale: מְדִינְתָּא désigne une province de l’Empire; «Juda» est la forme française usuelle de Yehoud.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: à la maison du grand Dieu
  rationale: Rend littéralement «maison du grand Dieu» sans remplacer explicitement l’image par «temple».
- source_word: אֶבֶן גְּלָל
  choice: avec d’énormes pierres
  rationale: L’expression désigne vraisemblablement des pierres de construction massives; «d’énormes pierres» en transmet clairement la taille sans retenir le littéralisme trompeur «pierres roulées».
- source_word: וְאָע מִתְּשָׂם בְּכֻתְלַיָּא
  choice: et des pièces de bois sont posées dans les murs
  rationale: Le bois est destiné à la construction et le passif décrit son insertion dans la structure des murs; «pièces de bois» reste général sans imposer «poutres».
- source_word: אָסְפַּרְנָא
  choice: avec diligence
  rationale: L’adverbe, dont la nuance exacte est discutée, indique ici que les travaux sont menés de manière énergique et efficace.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: et progresse bien entre leurs mains
  rationale: Préserve l’image idiomatique des «mains» et rend le succès continu du travail sans préciser davantage sa cause.
