  naturalness: « Elle se construit » et « des pièces de bois sont posées » sont compréhensibles, mais moins naturels dans ce contexte de rapport administratif. « Est en cours de construction » et « du bois est mis en place » sont plus fluides sans perdre la valeur passive. « Réussit grâce à eux » rend naturellement l’expression finale.
  terminology: « Province de Juda » et « maison du grand Dieu » sont appropriés et conservent le registre officiel ainsi que la formulation cultuelle du texte. « Grandes pierres » est plus sobre et plus proche du sens probable que « énormes pierres ».
