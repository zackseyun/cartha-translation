  terminology: Les formes « Aggée », « Zacharie », « Iddo », « Juda » et « Dieu d’Israël » sont les usages bibliques français courants. « Juifs » est un choix recevable, et la note « Judéens » conserve correctement l’alternative géographique/ethnique. La note sur « sous l’autorité » rend adéquatement la nuance de בְּשֻׁם.
