id: EZR.5.1
reference: Ezra 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: fr
  text: Aggée le prophète et Zacharie, fils d’Iddo, tous deux prophètes, prophétisèrent aux Juifs[a] qui se trouvaient en Juda et à Jérusalem, au nom du Dieu d’Israël[b], qui était au-dessus d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Judéens ». Le terme araméen peut désigner le peuple juif ou, dans un sens plus géographique, les habitants de Juda.
    reason: lexical_alternative
  - marker: b
    text: Ou « sous l’autorité du Dieu d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: prophétisèrent
  rationale: Le parfait peal araméen introduit l’action accomplie dans le récit. Le sujet composé appelle le pluriel en français. Le waw initial n’exige pas ici l’ajout d’un marqueur temporel comme « alors ».
- source_word: חַגַּי נביאה
  choice: Aggée le prophète
  rationale: « Aggée » est la forme française usuelle du nom; la forme déterminée de « prophète » est conservée dans l’apposition.
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: et Zacharie, fils d’Iddo
  rationale: Les noms suivent l’usage biblique français courant; בַר exprime la filiation.
- source_word: נביאיא
  choice: tous deux prophètes
  rationale: Cette formulation naturelle conserve l’apposition plurielle qui récapitule la fonction d’Aggée et de Zacharie sans produire une répétition française maladroite.
- source_word: עַל יְהוּדָיֵא
  choice: aux Juifs
  rationale: Avec « prophétiser », עַל désigne ici les destinataires. יְהוּדָיֵא peut désigner les Juifs ou, avec une nuance géographique, les Judéens; cette dernière possibilité est signalée en note.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: qui se trouvaient en Juda et à Jérusalem
  rationale: דִּי introduit la relative. « Juda » convient au territoire postexilique, tandis que les prépositions françaises idiomatiques distinguent le territoire de la ville.
- source_word: בְּשֻׁם אֱלָהּ יִשְׂרָאֵל
  choice: au nom du Dieu d’Israël
  rationale: L’expression signifie qu’ils parlent en représentation de Dieu et sous son autorité. « Au nom de » conserve l’idiome tout en restant transparent.
- source_word: עֲלֵיהוֹן
  choice: qui était au-dessus d’eux
  rationale: La proposition relative rattache le syntagme au Dieu d’Israël et conserve au plus près l’image de sa position ou de son autorité « sur » eux, sans la réduire uniquement à la protection.
theological_decisions:
- issue: Référent et portée de עֲלֵיהוֹן
  choice: Le syntagme est rattaché au « Dieu d’Israël » et rendu « qui était au-dessus d’eux ».
  alternative: 'On peut comprendre plus librement « qui veillait sur eux », ou rattacher l’expression à la prophétie: « au nom du Dieu d’Israël, à leur intention ».'
  rationale: Le rattachement à « Dieu d’Israël » est syntaxiquement le plus probable. « Au-dessus d’eux » préserve la tension entre présence, souveraineté et autorité sans choisir exclusivement l’une de ces nuances.
translation_notes:
  register: Français international moderne, clair et digne. « Tous deux prophètes » restitue l’apposition récapitulative de l’araméen de manière naturelle. Les noms propres suivent les formes bibliques françaises usuelles. Les marqueurs de note sont placés après les expressions auxquelles leurs variantes se rapportent.
