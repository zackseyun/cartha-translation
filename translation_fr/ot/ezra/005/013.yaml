base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/013.yaml
  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: fr
  text: Cependant, la première année de Cyrus, roi de Babylone, le roi Cyrus ordonna de reconstruire[a] cette maison de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « construire cette maison de Dieu ». Le verbe araméen signifie proprement « construire » ; « reconstruire » tient compte du contexte de restauration.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Cependant
  rationale: L’adversatif araméen marque un contraste avec ce qui précède; « Cependant » rend naturellement cette transition en français moderne.
- source_word: בִּשְׁנַת חֲדָה
  choice: la première année
  rationale: Il s’agit d’une formule de datation selon l’année de règne; « la première année » est l’équivalent français idiomatique.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: de Cyrus, roi de Babylone
  rationale: Le lamed associé au nom royal indique ici l’année de règne; la formulation française conserve le titre donné par le texte.
- source_word: שָׂם טְעֵם
  choice: ordonna
  rationale: Littéralement « fixa/établit un ordre »; dans ce contexte administratif royal, le syntagme signifie promulguer une décision officielle. « Ordonna » est clair et naturel.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: cette maison de Dieu
  rationale: La traduction conserve l’expression littérale et l’image biblique de la « maison de Dieu », bien que le référent soit le temple.
- source_word: לִבְנֵא
  choice: de reconstruire
  rationale: Le verbe araméen signifie proprement « construire »; « reconstruire » exprime le contexte de restauration du temple détruit, tandis que la note préserve le sens lexical strict.
