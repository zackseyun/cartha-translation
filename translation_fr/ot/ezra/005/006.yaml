base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: fr
  text: Voici la copie de la lettre que Tattenaï, gouverneur de la Transeuphratène, Shethar-Boznaï et ses collègues, les fonctionnaires[a] de la Transeuphratène, envoyèrent au roi Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Afarsakites », si le terme désigne un peuple ou un groupe administratif plutôt qu’une fonction.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: copie
  rationale: Le nom désigne la copie ou la transcription d’un document. « Copie » est précis, naturel et adapté à ce contexte administratif.
- source_word: אִגַּרְתָּא
  choice: lettre
  rationale: Le terme désigne ici une communication officielle écrite ; « lettre » est l’équivalent français courant.
- source_word: שְׁלַח
  choice: envoyèrent
  rationale: Le verbe exprime simplement l’envoi de la lettre. Le pluriel français correspond aux plusieurs expéditeurs énumérés.
- source_word: תַּתְּנַי
  choice: Tattenaï
  rationale: Le nom propre est translittéré selon un usage français clair.
- source_word: פַּחַת
  choice: gouverneur
  rationale: Dans l’administration achéménide, le terme désigne un gouverneur provincial ; ce rendu est à la fois exact et accessible.
- source_word: עֲבַר נַהֲרָה
  choice: Transeuphratène
  rationale: Il s’agit de la désignation administrative perse du territoire situé à l’ouest de l’Euphrate. « Transeuphratène » rend ce nom régional de manière concise en français.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Shetar-Boznaï
  rationale: Le nom propre est translittéré sous une forme lisible en français.
- source_word: כְנָוָתֵהּ
  choice: ses collègues
  rationale: Le nom désigne les personnes associées à Tattenaï dans ce cadre officiel. Le possessif singulier du texte araméen est conservé par « ses ».
- source_word: אֲפַרְסְכָיֵא
  choice: les fonctionnaires
  rationale: Le terme difficile peut désigner une catégorie d’agents administratifs ou le nom d’un groupe. Le rendu fonctionnel convient au contexte, tandis que l’autre possibilité est conservée en note.
- source_word: עַל
  choice: au
  rationale: Avec le verbe « envoyer » et le destinataire royal, la préposition se rend naturellement par « à », contracté ici en « au ».
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: roi Darius
  rationale: Cette formulation française naturelle conserve explicitement le titre royal.
