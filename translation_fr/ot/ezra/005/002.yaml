  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: fr
  text: Alors Zorobabel, fils de Shéaltiel, et Josué[b], fils de Yotsadak, se levèrent et commencèrent à bâtir la maison de Dieu qui est à Jérusalem[a]. Les prophètes de Dieu étaient avec eux et les soutenaient[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temple de Dieu ». L’araméen dit littéralement « la maison de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Le nom araméen employé ici est Yeshoua, une forme du nom rendu en français par « Josué ».
    reason: lexical_alternative
  - marker: c
    text: Ou « leur venaient en aide » ou « les assistaient ». Le participe exprime un soutien actif.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression du récit de façon naturelle en français moderne.
- source_word: קָמוּ וְשָׁרִיו לְמִבְנֵא
  choice: se levèrent et commencèrent à bâtir
  rationale: Reproduit les deux verbes araméens et leur enchaînement, tout en restant idiomatique en français.
- source_word: זְרֻבָּבֶל בַּר שְׁאַלְתִּיאֵל
  choice: Zorobabel, fils de Shéaltiel
  rationale: Emploie les formes françaises usuelles des noms et rend directement le patronyme araméen.
- source_word: יֵשׁוּעַ בַּר יוֹצָדָק
  choice: Josué, fils de Yotsadak
  rationale: « Josué » est la forme française biblique courante correspondant au nom יֵשׁוּעַ; « Yotsadak » représente la forme du nom attestée ici sans lui substituer sa forme longue.
- source_word: בֵּית אֱלָהָא
  choice: la maison de Dieu
  rationale: Conserve l’expression araméenne littérale et son image biblique; « le temple de Dieu » demeure une explicitation contextuelle possible.
- source_word: דִּי בִירוּשְׁלֶם
  choice: qui est à Jérusalem
  rationale: Rend la proposition relative locative sans ajouter de précision absente du texte.
- source_word: נביאיא דִי אֱלָהָא מְסָעֲדִין לְהוֹן
  choice: Les prophètes de Dieu étaient avec eux et les soutenaient
  rationale: Exprime clairement l’accompagnement et l’appui actif véhiculés par le participe araméen.
theological_decisions:
- issue: Désignation de l’édifice consacré à Dieu
  choice: la maison de Dieu
  alternative: le temple de Dieu
  rationale: Le texte dit littéralement « maison de Dieu ». Garder cette expression dans le corps du verset préserve l’image biblique sans imposer l’explicitation contextuelle « temple ».
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la progression narrative et le parallélisme des actions sans lourdeur; les noms propres suivent des formes françaises bibliques courantes ou une translittération lisible.
