  text: בֵּ/הּ זִמְנָ/א֩ אֲתָ֨א עֲלֵי/ה֜וֹן תַּ֠תְּנַי פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה וּ/שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן וְ/כֵן֙ אָמְרִ֣ין לְ/הֹ֔ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לִ/בְּנֵ֔א וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: fr
  text: 'À cette époque, Tattenaï, gouverneur de la Transeuphratène[a], Shetar-Boznaï et leurs collègues vinrent auprès d’eux et leur dirent : « Qui vous a donné l’ordre de bâtir ce temple[b] et d’achever cet ouvrage[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Transeuphratène » était le nom administratif perse de la région située à l’ouest de l’Euphrate.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « cette maison ». Dans ce contexte, il s’agit du temple.'
    reason: lexical_alternative
  - marker: c
    text: Le mot araméen traduit par « ouvrage » est de sens incertain. Il peut désigner plus précisément les travaux du temple ; certains le comprennent comme « mur » ou « structure ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: À cette époque
  rationale: Expression temporelle araméenne idiomatique, rendue naturellement tout en maintenant le cadre narratif.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: vinrent trouver les bâtisseurs
  rationale: Le verbe accompagné de la préposition exprime une venue auprès de personnes. L’explicitation « les bâtisseurs » identifie sans ambiguïté les destinataires dans le contexte immédiat.
- source_word: תַּתְּנַי
  choice: Tattenaï
  rationale: Translittération française usuelle du nom propre.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gouverneur de la Transeuphratène
  rationale: פַּחַת désigne un gouverneur provincial et עֲבַר נַהֲרָה le territoire administratif perse situé à l’ouest de l’Euphrate. « Transeuphratène » est l’appellation française historique concise.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Shetar-Boznaï
  rationale: Translittération française claire du nom propre composé.
- source_word: וּכְנָוָתְהוֹן
  choice: et leurs collègues
  rationale: Le terme désigne les personnes associées aux deux responsables; « collègues » convient au contexte administratif sans préciser indûment leur fonction.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: et leur demandèrent
  rationale: La formule introduit ici une question directe. Cette formulation française est naturelle et reproduit la fonction du discours.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Qui vous a donné l’autorisation
  rationale: טְעֵם peut désigner une décision, un ordre ou un décret officiel. Dans cette question portant sur la compétence légale des bâtisseurs, « autorisation » restitue naturellement la portée administrative tout en signalant en note les autres nuances possibles.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: de bâtir ce temple
  rationale: בַּיְתָא signifie littéralement « maison », mais désigne clairement ici le temple. Le rendre explicitement évite une ambiguïté artificielle en français sans ajouter l’idée de reconstruction.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: cet ouvrage
  rationale: Le sens précis du nom est incertain; « ouvrage » conserve une référence large au travail de construction sans imposer « mur » ou « charpente ».
- source_word: לְשַׁכְלָלָה
  choice: d’achever
  rationale: Le verbe exprime l’action de mener l’ouvrage à son terme.
