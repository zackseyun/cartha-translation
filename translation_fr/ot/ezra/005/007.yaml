  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: fr
  text: 'Ils lui envoyèrent un rapport[a], et voici ce qui y était écrit : « Au roi Darius : paix parfaite[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un message », « un document » ou « une lettre ». Le mot araméen peut désigner diverses formes de communication officielle.
    reason: lexical_alternative
  - marker: b
    text: « Paix parfaite » est une formule de salutation épistolaire exprimant une paix et un bien-être complets.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: rapport
  rationale: Le terme araméen désigne ici une communication officielle écrite adressée au roi. « Rapport » convient au cadre administratif, tout en laissant en note les autres possibilités lexicales.
- source_word: שְׁלַחוּ
  choice: ils envoyèrent
  rationale: Rend directement le parfait peal à la troisième personne du pluriel dans un récit au passé.
- source_word: עֲלוֹהִי
  choice: lui
  rationale: Avec le verbe « envoyer », la préposition munie du suffixe indique ici le destinataire; le roi Darius est ensuite explicitement nommé.
- source_word: וְכִדְנָה כְּתִיב בְּגַוֵּהּ
  choice: dans lequel il était écrit
  rationale: Formulation française naturelle qui conserve l'idée du contenu écrit à l'intérieur du document, sans alourdir la phrase par une répétition démonstrative.
- source_word: לְדָרְיָוֶשׁ מַלְכָּא
  choice: Au roi Darius
  rationale: Rend naturellement en français la formule d'adresse, avec le titre placé avant le nom selon l'usage courant.
- source_word: שְׁלָמָא כֹלָּא
  choice: paix entière
  rationale: Conserve le lexème « paix » et la valeur intensive de « toute/entière », plutôt que de réduire la formule à un simple « salut ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. La formule inhabituelle « paix entière » est maintenue pour préserver la couleur de la salutation araméenne et expliquée en note.
