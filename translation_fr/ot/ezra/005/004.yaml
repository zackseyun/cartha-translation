  text: 'Then we told them this: “What are the names of the men who are building this building?”[a]'
translation:
  language: fr
  text: 'Alors nous leur avons dit ceci : « Quels sont les noms des hommes qui construisent ce bâtiment ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Alors nous leur avons dit ainsi : “Quels sont les noms des hommes qui construisent cette construction ?” »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe temporel qui marque la suite du récit ; « Alors » est naturel en français moderne.
- source_word: כְּנֵמָא
  choice: omis explicitement devant la citation
  rationale: Littéralement « ainsi ». En français, les deux-points introduisant la citation en expriment naturellement la fonction, sans ajouter un « ceci » maladroit.
- source_word: אֲמַרְנָא לְּהֹם
  choice: nous leur avons dit
  rationale: Rend directement le verbe araméen « dire » et son complément, tout en restant idiomatique.
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: Quels sont les noms
  rationale: Formulation française naturelle d’une question portant sur les noms, sans reproduire littéralement la tournure araméenne.
- source_word: גֻּבְרַיָּא
  choice: des hommes
  rationale: Le terme araméen est masculin et désigne ici des hommes ; la traduction conserve cette précision.
- source_word: דִּי
  choice: qui
  rationale: Pronom relatif naturel en français pour relier « les hommes » à l’action qu’ils accomplissent.
- source_word: דְנָה בִנְיָנָא
  choice: ce bâtiment
  rationale: Le démonstratif et le nom désignent la construction visible ou concernée ; « bâtiment » évite la répétition moins élégante « construction/construisent ».
- source_word: בָּנַיִן
  choice: construisent
  rationale: Le participe exprime une action en cours. Le présent français après « qui » la rend naturellement, sans importer l’idée plus interprétative de reconstruction.
