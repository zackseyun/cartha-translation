  text: וַ/אֲמַר לֵ֓/הּ אלה מָֽאנַיָּ֔/א שֵׂ֚א אֵֽזֶל אֲחֵ֣ת הִמּ֔וֹ בְּ/הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/בֵ֥ית אֱלָהָ֖/א יִתְבְּנֵ֥א עַל אַתְרֵֽ/הּ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: fr
  text: 'Il lui dit : « Prends ces objets, va les déposer dans le temple qui est à Jérusalem, et que la maison de Dieu soit rebâtie[a] à son emplacement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « soit bâtie »; le contexte est celui de sa reconstruction à son emplacement antérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: Il lui dit
  rationale: Rend directement la formule narrative araméenne et le pronom masculin singulier, dans un français naturel.
- source_word: אֵלֶּה מָאנַיָּא
  choice: ces objets
  rationale: Le terme désigne ici les objets du temple emportés de Jérusalem. « Objets » est clair et suffisamment large, sans suggérer uniquement des récipients.
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: Prends ces objets, va les déposer
  rationale: Préserve la succession des impératifs. « Déposer » exprime plus précisément que « mettre » l’action de placer les objets dans le temple.
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: dans le temple qui est à Jérusalem
  rationale: Dans ce contexte, הֵיכְלָא désigne sans ambiguïté le temple; la proposition relative introduite par דִּי est conservée.
- source_word: וּבֵית אֱלָהָא
  choice: et que la maison de Dieu
  rationale: Conserve l’expression littérale et courante « maison de Dieu », sujet du verbe passif qui suit.
- source_word: יִתְבְּנֵא
  choice: soit rebâtie
  rationale: La forme signifie littéralement « soit bâtie »; le contexte historique de restauration après la destruction justifie « rebâtie », tout en signalant la formulation littérale en note.
- source_word: עַל אַתְרֵהּ
  choice: à son emplacement
  rationale: אַתְרָא signifie « lieu, emplacement ». Cette traduction indique que la maison doit être reconstruite sur le site qui était le sien.
