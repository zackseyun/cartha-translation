revisions:
- from: Maintenant donc, si le roi le juge bon, que l’on fasse des recherches dans le dépôt des trésors royaux, là-bas à Babylone, pour vérifier si le roi Cyrus a bien promulgué un décret ordonnant de rebâtir cette maison de Dieu à Jérusalem[a]. Puis, que le roi nous fasse connaître sa décision à ce sujet[b].
  to: Et maintenant, si le roi le juge bon, que l’on fasse des recherches dans le dépôt du trésor royal qui se trouve à Babylone, afin de vérifier s’il existe un décret que le roi Cyrus a promulgué pour rebâtir cette maison de Dieu à Jérusalem[a] ; et que le roi nous fasse connaître sa décision à ce sujet[b].
  rationale: La révision rend explicitement la recherche portant sur l’existence du décret, conserve l’objet du décret sous une forme française directe (« pour rebâtir ») et remplace la transition temporelle ajoutée par une simple coordination. Les notes restent correctement ancrées et signalent les principales alternatives lexicales.
