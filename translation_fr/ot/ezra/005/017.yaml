source:
  edition: WLC
  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: fr
  text: Et maintenant, si le roi le juge bon, que l’on fasse des recherches dans le dépôt du trésor royal qui se trouve à Babylone, afin de vérifier s’il existe un décret que le roi Cyrus a promulgué pour rebâtir cette maison de Dieu à Jérusalem[a] ; et que le roi nous fasse connaître sa décision à ce sujet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de bâtir cette maison de Dieu à Jérusalem ». Le verbe araméen signifie simplement « bâtir » ; « rebâtir » explicite le contexte de restauration.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sa volonté » ou « son bon plaisir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: Maintenant donc
  rationale: Marque araméenne de transition qui introduit la demande concluant la lettre; cette formulation conserve à la fois le lien logique et le mouvement du discours.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: si le roi le juge bon
  rationale: Formule déférente de cour, rendue dans un français actuel et digne sans archaïsme.
- source_word: יִתְבַּקַּר
  choice: que l’on fasse des recherches
  rationale: La forme passive à valeur jussive demande une recherche officielle; le pluriel idiomatique français convient à une consultation d’archives.
- source_word: בְּבֵית גִּנְזַיָּא
  choice: dans le dépôt des trésors royaux
  rationale: Littéralement « maison des trésors »; cette traduction conserve la fonction de trésor-dépôt sans réduire avec certitude le lieu à de simples archives.
- source_word: הֵן אִיתַי דִּי
  choice: pour vérifier si … a bien
  rationale: Exprime naturellement en français la recherche visant à confirmer l’existence et l’authenticité du décret.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: le roi Cyrus a bien promulgué un décret ordonnant
  rationale: טְעֵם désigne ici une décision officielle; la construction avec שִׂים indique qu’elle a été établie ou promulguée.
- source_word: לְמִבְנֵא
  choice: de rebâtir
  rationale: Le verbe signifie formellement « bâtir », mais le contexte historique de restauration justifie « rebâtir »; l’alternative littérale est signalée en note.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: cette maison de Dieu
  rationale: Conserve le démonstratif et l’expression source « maison de Dieu », sans la remplacer par l’interprétation contextuelle « temple ».
- source_word: וּרְעוּת מַלְכָּא
  choice: la décision du roi
  rationale: Dans cette formule administrative, רְעוּת peut désigner la volonté, le bon plaisir ou la décision royale; « décision » est naturel et précis dans le contexte de la réponse attendue.
- source_word: יִשְׁלַח עֲלֵינָא
  choice: que le roi nous fasse connaître
  rationale: Rend idiomatiquement l’idée d’envoyer aux correspondants la volonté ou décision royale, objet déjà exprimé dans la phrase.
theological_decisions: []
translation_notes:
