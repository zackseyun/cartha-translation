id: EZR.5.16
reference: Ezra 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱדַ֨יִן֙ שֵׁשְׁבַּצַּ֣ר דֵּ֔ךְ אֲתָ֗א יְהַ֧ב אֻשַּׁיָּ֛/א דִּי בֵ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/מִן אֱדַ֧יִן וְ/עַד כְּעַ֛ן מִתְבְּנֵ֖א וְ/לָ֥א שְׁלִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: fr
  text: Alors, ce Sheshbatsar est venu et a posé les fondations[a] de la maison de Dieu qui est à Jérusalem. Depuis lors et jusqu’à maintenant, elle est en construction[b], mais elle n’est pas achevée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plus littéralement, « a donné les fondations »; il s’agit d’une tournure araméenne signifiant qu’il les a posées.
    reason: lexical_alternative
  - marker: b
    text: Ou « elle se construit encore ». Le verbe araméen décrit ici un processus passif qui se poursuit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Cet adverbe araméen marque la succession narrative; « Alors » est naturel en français et conserve la progression temporelle.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: ce Sheshbatsar
  rationale: Le nom propre est translittéré, et le démonstratif est conservé afin de renvoyer explicitement au personnage qui vient d’être mentionné.
- source_word: אֲתָא
  choice: est venu
  rationale: Rend directement le verbe narratif araméen sans ajouter l’idée plus précise d’une arrivée à destination.
- source_word: יְהַב אֻשַּׁיָּא
  choice: a posé les fondations
  rationale: L’expression signifie littéralement « a donné les fondations »; « poser les fondations » est l’équivalent idiomatique français dans le contexte d’une construction.
- source_word: בֵית אֱלָהָא
  choice: la maison de Dieu
  rationale: Conserve l’expression concrète de l’araméen; « temple de Dieu » serait juste en contexte, mais plus interprétatif.
- source_word: דִּי בִירוּשְׁלֶם
  choice: qui est à Jérusalem
  rationale: Rend simplement la proposition relative locative sans introduire un temps passé absent de l’expression araméenne.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: Depuis lors et jusqu’à maintenant
  rationale: Exprime toute la durée comprise entre la pose des fondations et le moment où parlent les auteurs de la lettre.
- source_word: מִתְבְּנֵא
  choice: elle est en construction
  rationale: Cette formulation française naturelle conserve le caractère passif et duratif du verbe dans ce contexte temporel.
- source_word: וְלָא שְׁלִם
  choice: mais elle n’est pas achevée
  rationale: Le contraste indique que le bâtiment demeure incomplet au moment présent; « achevée » convient au registre d’un chantier.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve « maison de Dieu » plutôt que de l’expliciter par « temple », et rend le processus de construction de façon naturelle sans effacer sa durée.
