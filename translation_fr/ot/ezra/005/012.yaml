id: EZR.5.12
reference: Ezra 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: fr
  text: C’est pourquoi, parce que nos ancêtres avaient provoqué la colère du Dieu du ciel, il les livra au pouvoir de Nabuchodonosor, roi de Babylone, le Chaldéen. Celui-ci détruisit cette maison[a] et déporta le peuple à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire le temple.
    reason: cultural_note
lexical_decisions:
- source_word: לָהֵן
  choice: Mais
  rationale: Dans ce contexte, le marqueur araméen introduit le contraste avec l’existence antérieure du temple évoquée au verset précédent. « Mais » rend naturellement cette transition.
- source_word: מִן דִּי
  choice: parce que
  rationale: Cette locution araméenne exprime clairement la cause.
- source_word: הַרְגִּזוּ
  choice: avaient provoqué la colère
  rationale: La forme causative indique que les ancêtres ont suscité la colère de Dieu. Le plus-que-parfait situe naturellement cette faute avant le jugement qui suit.
- source_word: אֲבָהֳתַנָא
  choice: nos ancêtres
  rationale: « Ancêtres » transmet le sens collectif de « nos pères » dans un français moderne et international, sans suggérer uniquement les pères immédiats.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: du Dieu du ciel
  rationale: Cette formulation conserve le titre divin postexilique et sa détermination.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: il les livra au pouvoir de
  rationale: Cette expression française restitue l’idiome sémitique « donner dans la main de » en rendant explicite l’idée de domination, sans atténuer l’action directe de Dieu.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל כסדיא
  choice: Nabuchodonosor, roi de Babylone, le Chaldéen
  rationale: « Nabuchodonosor » est la forme française traditionnelle et courante du nom. Le gentilé singulier est conservé comme apposition.
- source_word: וּבַיְתָה דְנָה
  choice: cette maison
  rationale: Le texte dit littéralement « maison »; le contexte désigne le temple. Le choix conserve l’expression source, avec une note explicative.
- source_word: סַתְרֵהּ
  choice: détruisit
  rationale: Le verbe désigne la démolition ou la destruction d’un bâtiment. « Détruisit » convient au contexte et au registre.
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: déporta le peuple à Babylone
  rationale: La forme causative de גלה signifie emmener en exil. « Déporta » exprime précisément cette action en français courant.
theological_decisions:
- issue: Causalité du jugement divin
  choice: il les livra au pouvoir de Nabuchodonosor
  alternative: il permit qu’ils tombent au pouvoir de Nabuchodonosor
  rationale: Le texte attribue directement à Dieu la remise des ancêtres au pouvoir du roi babylonien. La traduction ne réduit donc pas cette action à une simple permission.
- issue: Désignation du temple
  choice: cette maison
  alternative: ce temple
  rationale: Bien que le référent soit le temple, l’araméen emploie « maison ». Maintenir ce terme préserve la formulation et sa portée théologique sans expliciter l’interprétation dans le corps du texte.
- issue: Sujet de la destruction et de la déportation
  choice: Celui-ci détruisit cette maison et déporta le peuple
  alternative: il détruisit cette maison et déporta le peuple
  rationale: Après la mention de Nabuchodonosor, les suffixes verbaux renvoient naturellement à ce roi comme agent historique. « Celui-ci » évite en français de faire croire que le sujet demeure Dieu, tout en maintenant que Dieu l’avait livré entre ses mains.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible, tandis que « le Dieu du ciel » et « cette maison » conservent les formulations caractéristiques du texte araméen.
