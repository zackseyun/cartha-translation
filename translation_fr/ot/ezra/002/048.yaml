lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן forme ici la formule répétée d’une liste généalogique. « Les fils de » en préserve la forme hébraïque, tout en pouvant désigner plus largement les descendants ou les membres d’un groupe familial.
- source_word: רְצִין
  choice: Retsîn
  rationale: Nom propre translittéré selon une forme française qui représente le tsadé par « ts » et signale la voyelle longue finale.
- source_word: נְקוֹדָא
  choice: Neqoda
  rationale: Nom propre translittéré ; « q » distingue le qof hébreu et la finale en -a reflète la vocalisation massorétique.
- source_word: גַזָּם
  choice: Gazzam
  rationale: Nom propre translittéré ; le double « z » rend le redoublement consonantique indiqué par le daguesh.
