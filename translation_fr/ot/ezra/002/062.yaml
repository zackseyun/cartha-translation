id: EZR.2.62
reference: Ezra 2:62
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑אוּ וַֽ/יְגֹאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: fr
  text: Ceux-ci cherchèrent leur inscription dans le registre généalogique, mais on ne les y trouva pas, et ils furent exclus du sacerdoce[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils furent considérés comme souillés et écartés du sacerdoce » ou « ils furent déclarés inaptes au sacerdoce ». Le verbe hébreu indique qu’ils furent traités comme impropres au statut sacerdotal, puisque leur généalogie n’avait pas pu être vérifiée.
    reason: 'Variante lexicale : le verbe hébreu associe l’idée de souillure ou d’inaptitude à la disqualification sacerdotale.'
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ceux-ci
  rationale: Le démonstratif pluriel renvoie aux hommes qui revendiquaient une ascendance sacerdotale dans le contexte précédent. « Ceux-ci » conserve cette référence sans ajouter un nom absent de l’hébreu.
- source_word: בִּקְשׁוּ
  choice: recherchèrent
  rationale: Le verbe exprime ici une démarche de recherche dans des documents officiels. « Recherchèrent » convient au contexte administratif et reste naturel en français.
- source_word: כְתָבָם
  choice: leur document
  rationale: כְּתָב désigne un écrit ou document. « Leur document » rend directement le terme sans préciser indûment la nature exacte de la pièce recherchée.
- source_word: הַמִּתְיַחְשִׂים
  choice: dans le registre généalogique
  rationale: Le participe renvoie à l’inscription ou au classement selon la filiation. Cette formulation française restitue naturellement le cadre documentaire de la recherche, même si elle transforme la construction participiale hébraïque en expression nominale.
- source_word: וְלֹא נִמְצָאוּ
  choice: mais on ne les y trouva pas
  rationale: Le verbe hébreu est au pluriel et renvoie le plus naturellement aux personnes. Le pronom « y » explicite sobrement que leurs noms ou leur inscription ne furent pas retrouvés dans le registre, sans remplacer le sujet pluriel par le document singulier.
- source_word: וַיְגֹאֲלוּ
  choice: et ils furent exclus
  rationale: Dans ce contexte, le verbe indique qu’ils furent traités comme impropres ou disqualifiés pour le statut sacerdotal. « Exclus » exprime clairement la conséquence administrative, tandis que la note conserve la nuance de souillure ou d’inaptitude portée par le terme hébreu.
- source_word: מִן הַכְּהֻנָּה
  choice: du sacerdoce
  rationale: כְּהֻנָּה désigne le sacerdoce ou la fonction sacerdotale. « Du sacerdoce » est direct, idiomatique et conforme au registre du passage.
theological_decisions:
- issue: Portée de וַיְגֹאֲלוּ sur le statut sacerdotal
  choice: ils furent exclus du sacerdoce
  alternative: ils furent considérés comme souillés et écartés du sacerdoce ; ils furent déclarés inaptes au sacerdoce
  rationale: Le verbe peut évoquer le fait d’être tenu pour souillé ou impropre, tandis que le contexte met en avant la perte concrète du droit d’exercer le sacerdoce faute de preuve généalogique. Le texte principal exprime ce résultat sans transformer la décision administrative en affirmation théologique plus précise que l’hébreu ; la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’enchaînement hébreu, tout en employant « on ne les y trouva pas » pour rendre clairement le pluriel et l’ellipse du texte source. Le marqueur de note est placé après la proposition qu’il explique.
