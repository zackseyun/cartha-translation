source:
  edition: WLC
  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: fr
  text: 'Ils donnèrent, selon leurs moyens, au trésor destiné aux travaux : 61 000 dariques d’or[a], 5 000 mines d’argent[b] et 100 tuniques de prêtres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pièces d’or » ; le terme hébreu désigne plus précisément des dariques perses.
    reason: lexical_alternative
  - marker: b
    text: La mine était une ancienne unité de poids et de valeur monétaire.
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: selon leurs moyens
  rationale: La préposition כְּ avec כֹּחַ exprime ici une proportion correspondant aux ressources ou à la capacité de chacun. « Selon leurs moyens » est naturel en français et conserve ce sens.
- source_word: נָתְנוּ
  choice: ils donnèrent
  rationale: נָתַן est le verbe courant pour « donner ». Le passé simple convient au registre narratif biblique français sans ajouter la nuance plus spécifique de « contribuer ».
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: au trésor destiné aux travaux
  rationale: אוֹצָר désigne un trésor ou un dépôt, et מְלָאכָה les travaux entrepris. Cette formulation rend clairement la destination des dons tout en évitant le calque obscur « trésor des travaux ».
- source_word: דַּרְכְּמוֹנִים
  choice: dariques
  rationale: Le terme emprunté désigne vraisemblablement des dariques perses. Le terme historique précis est conservé, avec une note explicative.
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: 61 000
  rationale: L’expression hébraïque signifie littéralement « six dizaines de milliers et un millier ». Les chiffres offrent une lecture claire dans cette liste.
- source_word: מָנִים
  choice: mines
  rationale: מָנֶה est une ancienne unité de poids et de valeur. « Mine » est son équivalent historique usuel en français et évite une conversion moderne incertaine.
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: 5 000
  rationale: Rendu numérique exact et cohérent avec les autres quantités du verset.
- source_word: כָתְנֹת כֹּהֲנִים
  choice: tuniques de prêtres
  rationale: כֻּתֹּנֶת désigne une tunique ou un vêtement long. « Tuniques de prêtres » préserve la relation génitive, qui peut indiquer des tuniques appartenant aux prêtres ou destinées à eux, sans élargir le sens à l’ensemble des vêtements sacerdotaux.
- source_word: מֵאָה
  choice: '100'
  rationale: Rendu numérique exact, selon le style adopté pour l’énumération.
