base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/065.yaml
  text: besides their male and female servants[a], these were 7,337; and they had 200 male and female singers.
translation:
  language: fr
  text: sans compter leurs serviteurs et leurs servantes[a], qui étaient au nombre de 7 337. Ils avaient aussi 200 chanteurs et chanteuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves et femmes esclaves ». Les termes hébreux peuvent désigner des serviteurs domestiques, mais aussi des personnes en situation d’esclavage.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: sans compter
  rationale: Introduit un groupe ajouté au total précédent; cette formulation est naturelle dans un relevé numérique.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: leurs serviteurs et leurs servantes
  rationale: Les deux termes désignent respectivement des dépendants masculins et féminins et peuvent, selon le contexte, évoquer des esclaves. Le choix principal préserve leur distinction de sexe sans trancher excessivement leur statut juridique.
- source_word: אֵלֶּה שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: qui étaient au nombre de 7 337
  rationale: Rend clairement le renvoi du démonstratif aux serviteurs et servantes et présente le chiffre de manière lisible dans un recensement.
- source_word: וְלָהֶם
  choice: Ils avaient aussi
  rationale: Expression française idiomatique de la construction possessive hébraïque; «aussi» explicite ici la coordination additive.
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: chanteurs et chanteuses
  rationale: Conserve la distinction explicite entre les formes masculine et féminine de l’hébreu.
- source_word: מָאתָיִם
  choice: '200'
  rationale: Les chiffres facilitent la lecture d’une liste de recensement tout en conservant exactement le nombre du texte source.
