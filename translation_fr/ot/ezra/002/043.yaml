  text: הַ/נְּתִינִ֑ים בְּנֵי צִיחָ֥א בְנֵי חֲשׂוּפָ֖א בְּנֵ֥י טַבָּעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/043.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: fr
  text: 'Les serviteurs du Temple[a] : les fils de Tsiha[b], les fils de Hasupha, les fils de Tabbaoth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « les Netinim » ; ce terme, souvent translittéré, désigne une catégorie de serviteurs affectés au service du sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « les descendants de », ici et pour chaque répétition de « les fils de » ; la formule hébraïque peut désigner une lignée familiale, et non seulement des fils immédiats.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: Le terme désigne une catégorie reconnue de personnes affectées au service du sanctuaire. La traduction fonctionnelle est claire en français moderne, tandis que la majuscule à « Temple » indique ici le sanctuaire de Jérusalem.
- source_word: בְּנֵי
  choice: les fils de
  rationale: La formule hébraïque est conservée dans sa répétition et sa forme généalogique. Dans ce type de liste, elle peut aussi désigner les descendants ou les membres d’une lignée, ambiguïté signalée en note.
- source_word: צִיחָא
  choice: Tsiha
  rationale: Translittération française du nom propre, avec « Ts » pour צ et « h » pour ח.
- source_word: חֲשׂוּפָא
  choice: Hassoufa
  rationale: 'Translittération adaptée aux conventions et à la prononciation françaises : « ou » rend la voyelle /u/ et « ss » maintient le son /s/ entre voyelles.'
- source_word: טַבָּעוֹת
  choice: Tabbaoth
  rationale: Le terme fonctionne ici comme un nom propre ou un nom de clan et est donc translittéré plutôt que traduit.
