  text: בְּנֵ֣י הַ/שֹּֽׁעֲרִ֗ים בְּנֵי שַׁלּ֤וּם בְּנֵֽי אָטֵר֙ בְּנֵי טַלְמ֣וֹן בְּנֵי עַקּ֔וּב בְּנֵ֥י חֲטִיטָ֖א בְּנֵ֣י שֹׁבָ֑י הַ/כֹּ֕ל מֵאָ֖ה שְׁלֹשִׁ֥ים וְ/תִשְׁעָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: fr
  text: 'Fils des gardiens des portes : les fils de Shalloum, les fils d’Ater, les fils de Talmôn, les fils d’Aqqoub, les fils de Hatita et les fils de Shobaï, en tout cent trente-neuf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: fils de / les fils de
  rationale: Dans cette liste de recensement, le terme désigne des groupes rattachés à un ancêtre ou à un chef de famille. « Fils de » conserve la structure répétitive et la possible nuance généalogique de l’hébreu sans la réduire explicitement à « descendants » ou « membres ».
- source_word: הַשֹּׁעֲרִים
  choice: les gardiens des portes
  rationale: Le terme désigne ceux qui surveillent ou desservent les portes, ici dans le cadre du service du temple. Cette formulation est claire en français moderne et plus précise que « portiers », qui peut évoquer un emploi contemporain différent.
- source_word: שַׁלּוּם
  choice: Shalloum
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: אָטֵר
  choice: Ater
  rationale: Translittération simple du nom propre hébreu.
- source_word: טַלְמוֹן
  choice: Talmôn
  rationale: Translittération adaptée aux conventions françaises, avec accent circonflexe indiquant la voyelle longue sans prétendre reproduire tous les détails phonétiques.
- source_word: עַקּוּב
  choice: Aqqoub
  rationale: Translittération française qui rend la consonne redoublée et la voyelle hébraïque de façon lisible.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Translittération directe et lisible du nom propre selon la vocalisation massorétique.
- source_word: שֹׁבָי
  choice: Shobaï
  rationale: Translittération française reflétant la vocalisation massorétique et distinguant les deux voyelles finales.
- source_word: הַכֹּל
  choice: en tout
  rationale: Dans un relevé numérique, cette expression introduit naturellement en français le total de tous les groupes précédents.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: cent trente-neuf
  rationale: Rendu cardinal standard et naturel en français moderne.
