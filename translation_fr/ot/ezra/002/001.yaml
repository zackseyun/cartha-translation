revisions:
- from: Voici les gens de la province qui revinrent de la captivité, ceux qui avaient été déportés[a] à Babylone par Nabuchodonosor, roi de Babylone. Ils retournèrent à Jérusalem et en Juda, chacun dans sa ville.
  to: Voici les membres de la province qui étaient remontés de la captivité de l’exil[a], ceux que Nabuchodonosor, roi de Babylone, avait déportés à Babylone. Ils revinrent à Jérusalem et en Juda, chacun dans sa ville.
  rationale: La révision rend distinctement le participe « étaient remontés » et le verbe narratif « revinrent », rétablit l’apposition relative aux exilés déportés, et conserve l’expression hébraïque dense par une formulation française intelligible accompagnée d’une note.
