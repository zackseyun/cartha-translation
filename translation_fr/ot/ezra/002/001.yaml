base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: fr
  text: Voici les membres de la province qui étaient remontés de la captivité de l’exil[a], ceux que Nabuchodonosor, roi de Babylone, avait déportés à Babylone. Ils revinrent à Jérusalem et en Juda, chacun dans sa ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « la captivité de l’exil » et associe ainsi l’état de captivité à la communauté exilée. On peut aussi traduire : « la captivité des exilés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: les gens de la province
  rationale: Littéralement « les fils de la province ». En hébreu, « fils de » désigne ici les membres ou habitants d’un groupe territorial. « Les gens de la province » restitue naturellement cet idiome en français moderne, tandis que « province » conserve la portée administrative du terme dans le contexte perse.
- source_word: הָעֹלִים
  choice: qui revinrent
  rationale: Le participe signifie littéralement « qui montaient ». Dans ce contexte, la montée est celle du retour vers Juda. Le français « revinrent » communique clairement le mouvement contextuel, tandis que le second verbe שׁוב est distingué par « retournèrent ».
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: de la captivité, ceux qui avaient été déportés
  rationale: La formulation déploie les deux éléments hébreux, שְׁבִי (« captivité ») et גּוֹלָה (« déportation », ou collectivement « déportés »), sans réduire entièrement l’expression redoublée à la seule notion d’exil.
- source_word: הֶגְלָה
  choice: avaient été déportés … par
  rationale: Le hiphil de גלה exprime une déportation forcée. La tournure passive française permet à « ceux qui avaient été déportés » de reprendre directement les personnes concernées et identifie Nabuchodonosor comme agent.
- source_word: נבוכדנצור
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du roi babylonien.
- source_word: וַיָּשׁוּבוּ
  choice: Ils retournèrent
  rationale: שׁוב marque explicitement le retour. Une nouvelle phrase rend lisible la longue structure hébraïque sans modifier la relation logique.
- source_word: לִירוּשָׁלַם וִיהוּדָה
  choice: à Jérusalem et en Juda
  rationale: 'Les prépositions françaises naturelles diffèrent selon la ville et le territoire : « à Jérusalem », « en Juda ».'
- source_word: אִישׁ לְעִירוֹ
  choice: chacun dans sa ville
  rationale: אִישׁ a ici une valeur distributive. « Chacun » la rend avec naturel; « sa ville » conserve le singulier individualisant sans ajouter artificiellement « propre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’idiome littéral « fils de la province » est explicité pour être immédiatement compréhensible. La longue phrase source est divisée en deux phrases françaises. Le texte conserve la distinction entre le retour initial évoqué par « revinrent » et l’énoncé explicite « retournèrent ».
