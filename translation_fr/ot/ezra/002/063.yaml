base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: fr
  text: Le gouverneur[a] leur dit qu’ils ne devaient pas manger des parts très saintes des offrandes[b], jusqu’à ce qu’un prêtre se présente, muni de l’Ourim et du Toummim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Tirshatha », titre administratif d’origine perse.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des parts sacerdotales des offrandes considérées comme particulièrement saintes, et non du lieu très saint, appelé aussi « Saint des saints ».
    reason: cultural_note
  - marker: c
    text: L’Ourim et le Toummim étaient des moyens sacrés de consultation sacerdotale ; leur forme exacte et la manière de les employer restent incertaines.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: le gouverneur
  rationale: Ce titre administratif d’origine perse est rendu par sa fonction afin d’être immédiatement compréhensible en français moderne; la translittération traditionnelle « Tirshatha » est signalée en note.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: qu’ils ne devaient pas manger
  rationale: Cette formulation française naturelle exprime le contenu prescriptif des paroles rapportées sans renforcer indûment l’interdiction.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: des offrandes très saintes
  rationale: Dans ce contexte de statut sacerdotal et de consommation, l’expression désigne les parts comestibles des offrandes tenues pour très saintes, et non le lieu appelé « lieu très saint ».
- source_word: עַד עֲמֹד כֹּהֵן
  choice: jusqu’à ce qu’un prêtre se présente
  rationale: La tournure marque le terme futur de l’interdiction. « Se présente » rend naturellement l’idée qu’un prêtre qualifié apparaisse ou entre en fonction, sans imposer la nuance physique de « se lever ».
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: avec l’ourim et le toummim
  rationale: Les termes cultuels sont translittérés plutôt que traduits de manière conjecturale. « Avec » rend sobrement la préposition et laisse la note préciser leur fonction sans prétendre connaître leur forme exacte.
theological_decisions:
- issue: Sens de קֹדֶשׁ הַקֳּדָשִׁים dans ce contexte
  choice: Les parts comestibles d’offrandes tenues pour très saintes
  alternative: Le lieu très saint, ou « Saint des saints »
  rationale: Le contexte porte sur l’admissibilité de personnes au sacerdoce et sur ce qu’elles peuvent manger. Le référent est donc cultuel et alimentaire, non spatial.
- issue: Nature de l’ourim et du toummim
  choice: Conserver les appellations techniques translittérées
  alternative: Traduire étymologiquement, par exemple « lumières et perfections »
  rationale: Leur forme précise et leur mode d’emploi demeurent incertains. La translittération préserve cette incertitude et évite une interprétation théologique non établie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe administrative du propos est conservée sans raideur; les termes cultuels opaques sont expliqués en notes plutôt que développés dans le texte.
