lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Pluriel construit de בֵּן dans une liste généalogique. « Les fils de » conserve la formule hébraïque, tout en laissant la note préciser qu’elle peut désigner plus largement les descendants ou les membres d’un clan.
- source_word: בַקְבּוּק
  choice: Bakbouk
  rationale: Nom propre translittéré selon des conventions naturelles en français moderne, avec « ou » pour le son /u/.
- source_word: חֲקוּפָא
  choice: Hakoufa
  rationale: Nom propre translittéré en français; « h » représente la consonne initiale et « ou » la voyelle /u/.
- source_word: חַרְחוּר
  choice: Harhour
  rationale: Nom propre translittéré en français; la graphie conserve les deux consonnes gutturales sans imposer une prononciation savante.
