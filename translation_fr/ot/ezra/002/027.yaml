  rationale: Le pluriel construit de אִישׁ désigne ici, dans une liste de recensement, les hommes ou représentants de foyers rattachés au lieu nommé; « les hommes de » conserve cette précision et convient au genre.
- source_word: מִכְמָס
  choice: Mikmas
  rationale: Nom de lieu translittéré au plus près de la forme hébraïque. La variante traditionnelle française « Mikmas » est retenue dans le texte, avec « Micmas » signalé en note.
- source_word: מֵאָה עֶשְׂרִים וּשְׁנָיִם
  choice: cent vingt-deux
  rationale: La suite cardinale hébraïque est additive (100 + 20 + 2); cette formulation est naturelle en français moderne.
