lexical_decisions:
- source_word: בְּנֵי
  choice: Les gens de
  rationale: Dans cette liste de personnes revenues d’exil, בְּנֵי introduit ici un groupe rattaché aux trois localités nommées, plutôt que des fils au sens strict. « Les gens de » rend naturellement cette valeur collective en français.
