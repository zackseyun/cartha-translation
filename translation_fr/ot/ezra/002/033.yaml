  choice: Lod
  rationale: Nom de lieu translittéré d’après la forme hébraïque; la forme « Lydda » est plus tardive.
- source_word: חָדִיד
  choice: Hadid
  rationale: Nom de lieu translittéré directement de l’hébreu.
- source_word: וְאוֹנוֹ
  choice: et d’Ono
  rationale: La conjonction וְ est rendue par « et »; la préposition « de » est répétée en français pour montrer clairement que les personnes recensées sont rattachées à Ono comme aux deux localités précédentes.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: sept cent vingt-cinq
  rationale: Rend exactement le total de 725 selon l’usage numérique standard du français moderne.
