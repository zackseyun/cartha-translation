- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique, le pluriel construit de בֵּן désigne les membres d’une lignée ou d’un groupe familial. « Les fils de » conserve la forme hébraïque et reste naturel en français.
- source_word: יַעְלָה
  choice: Yaala
  rationale: Nom propre translittéré selon une forme française qui reflète les consonnes et la vocalisation de l’hébreu.
- source_word: דַרְקוֹן
  choice: Darkôn
  rationale: Nom propre translittéré plutôt que traduit ; l’accent circonflexe signale la voyelle longue de la dernière syllabe sans alourdir la lecture.
- source_word: גִדֵּל
  choice: Guiddel
  rationale: Nom propre translittéré ; « Gui- » rend ici le g dur devant i, et le double d reflète la consonne renforcée de l’hébreu.
