lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste de recensement, le pluriel construit désigne les membres ou descendants d’une lignée. « Les fils de » conserve la forme généalogique concise de l’hébreu, tout en restant intelligible en français.
- source_word: אָטֵר
  choice: Ater
  rationale: Nom propre de personne ou de famille, transcrit sous la forme française usuelle.
- source_word: לִיחִזְקִיָּה
  choice: de la branche d’Ézéchias
  rationale: Le préfixe ל marque ici vraisemblablement l’appartenance ou une subdivision de la famille d’Ater. L’ajout explicatif « la branche » rend naturellement cette relation en français et évite de faire d’Ézéchias le père direct d’Ater.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: quatre-vingt-dix-huit
  rationale: Rendu idiomatique du nombre cardinal hébreu en français international.
