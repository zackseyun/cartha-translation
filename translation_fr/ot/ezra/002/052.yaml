lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste de personnes revenues d’exil, בְּנֵי est une formule généalogique désignant les membres d’une lignée ou d’un groupe familial. « Les fils de » conserve la structure répétitive de l’hébreu, tandis que la note précise sa portée collective possible.
- source_word: בַצְלוּת
  choice: Batslouth
  rationale: 'Nom propre translittéré sous une forme adaptée aux conventions de lecture françaises : צ est rendu par « ts » et la consonne finale ת par « th », selon une graphie biblique française reconnaissable.'
- source_word: מְחִידָא
  choice: Mehida
  rationale: Nom propre translittéré sans en proposer une signification incertaine. « Mehida » est une forme simple et lisible en français.
- source_word: חַרְשָׁא
  choice: Harsha
  rationale: Nom propre translittéré ; l’aleph final, non consonantique dans la prononciation, n’est pas représenté. La graphie conserve le son « sh » du nom hébreu tout en restant accessible.
