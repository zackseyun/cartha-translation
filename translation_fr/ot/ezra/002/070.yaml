source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: fr
  text: Les prêtres, les Lévites, une partie du peuple, les chanteurs, les gardiens des portes et les serviteurs du Temple[a] s’établirent donc dans leurs villes. Tout Israël s’établit dans ses villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les Netinim », terme technique désignant une catégorie de personnes affectées au service du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: s’établirent
  rationale: Dans ce contexte de retour et de réinstallation, ישׁב exprime le fait de prendre résidence. « S’établirent » rend naturellement cette nuance, tandis que « habitèrent » resterait également possible.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français usuel de כהנים dans le contexte cultuel de l’époque postexilique.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation traditionnelle et claire du groupe lévitique, distingué ici des prêtres.
- source_word: וּמִן הָעָם
  choice: une partie du peuple
  rationale: 'La préposition מן a ici une valeur partitive : le texte mentionne certains membres du peuple parmi les groupes qui se réinstallèrent.'
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le terme désigne les personnes chargées du chant, notamment dans le service du Temple.
- source_word: הַשּׁוֹעֲרִים
  choice: les gardiens des portes
  rationale: Cette formulation explicite leur fonction de surveillance et de service aux portes, en particulier celles du Temple.
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: נתינים est le nom technique d’un groupe affecté au service du sanctuaire. La traduction fonctionnelle est immédiatement compréhensible en français; la translittération traditionnelle est conservée en note.
- source_word: בְּעָרֵיהֶם
  choice: dans leurs villes / dans ses villes
  rationale: עיר peut désigner une ville ou une localité. « Villes » conserve l’expression biblique courante. Avec le collectif singulier « tout Israël », le français demande naturellement « ses villes ».
- source_word: וְכָל יִשְׂרָאֵל
  choice: Tout Israël
  rationale: Cette expression collective désigne ici la communauté d’Israël. La tournure française conserve la formulation concise de l’hébreu.
theological_decisions:
- issue: Traduction du terme technique הַנְּתִינִים
  choice: les serviteurs du Temple
  alternative: les Netinim
  rationale: Le choix principal communique la fonction de ce groupe sans imposer au lecteur un terme technique obscur. La note préserve toutefois son appellation hébraïque traditionnelle et signale qu’il s’agit d’une catégorie précise.
translation_notes:
  register: Français international moderne, sobre et digne. « Temple » porte une majuscule lorsqu’il désigne le sanctuaire de Jérusalem. Le marqueur de note est placé après « serviteurs du Temple », expression qui traduit effectivement הַנְּתִינִים. La reprise du verbe dans la seconde phrase explicite l’ellipse hébraïque sans en modifier le sens.
