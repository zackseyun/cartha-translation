  text: the sons of Pahath-moab, of the sons of Jeshua and Joab, 2,812.
translation:
  language: fr
  text: 'les descendants de Pahath-Moab, des descendants de Yéchoua et de Joab[a] : 2 812.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu juxtapose « Yéchoua » et « Joab » sans conjonction. « Et » explicite la relation généralement comprise ; dans le passage parallèle de Néhémie 7.11, cette conjonction est présente.
    reason: Signaler que la coordination est implicite dans le texte hébreu d’Esdras tout en conservant une formulation française intelligible.
lexical_decisions:
- source_word: בְּנֵי
  choice: les descendants de
  rationale: Dans cette liste de rapatriés, בְּנֵי désigne les membres d’une lignée ou d’un clan. « Les descendants de » rend ce sens collectif plus naturellement en français moderne que le calque « les fils de ».
- source_word: פַחַת מוֹאָב
  choice: Pahath-Moab
  rationale: Nom propre composé, translittéré selon une forme française reconnaissable et relié par un trait d’union.
- source_word: לִבְנֵי
  choice: issus des familles de
  rationale: Le ל préfixé rattache le groupe de Pahath-Moab aux lignées nommées ensuite. Cette formulation exprime clairement l’appartenance généalogique ou clanique sans transformer le lien en filiation immédiate.
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Translittération française de la forme postexilique יֵשׁוּעַ, distincte dans ce contexte de la forme conventionnelle « Josué ».
- source_word: יוֹאָב
  choice: Joab
  rationale: Forme française conventionnelle de ce nom propre.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: 2 812
  rationale: Le nombre hébreu est sans ambiguïté. Les chiffres conviennent au caractère administratif de la liste, avec l’espace comme séparateur des milliers en français.
theological_decisions: []
