  variant: modern international French
source:
  edition: WLC
  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: fr
  text: Quelques-uns des chefs de clans[a], lorsqu’ils arrivèrent à la maison de Yahweh qui est à Jérusalem, firent des dons volontaires[b] pour la maison de Dieu, afin de l’établir à son emplacement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des chefs des pères ». Cette expression désigne les responsables de groupes de parenté ou de clans d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « offrirent de leur plein gré ». Le verbe souligne le caractère volontaire de leur contribution.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « sur ses fondations ». Le mot hébreu peut désigner le lieu fixe du temple, son site ou sa base.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Quelques-uns des chefs de famille
  rationale: 'La préposition מִן a ici une valeur partitive : il s’agit de certains chefs, non de tous. « Chefs de famille » exprime naturellement en français moderne la fonction des responsables des unités de parenté israélites.'
- source_word: בְּבוֹאָם
  choice: lorsqu’ils arrivèrent
  rationale: La préposition בְּ suivie de l’infinitif construit et du suffixe a une valeur temporelle. Le passé simple convient au registre narratif français.
- source_word: לְבֵית יְהוָה
  choice: à la maison de Yahweh
  rationale: « Maison » conserve le terme concret בַּיִת et son écho dans « maison de Dieu », sans remplacer implicitement le mot par « temple ».
- source_word: הִתְנַדְּבוּ
  choice: firent volontairement des dons
  rationale: Le hitpael de נדב souligne le caractère libre et volontaire de la contribution; dans ce contexte, il s’agit de dons destinés à la reconstruction.
- source_word: לְבֵית הָאֱלֹהִים
  choice: pour la maison de Dieu
  rationale: La préposition לְ indique le bénéficiaire ou la destination des dons. La formulation maintient le parallélisme lexical avec « maison de Yahweh ».
- source_word: לְהַעֲמִידוֹ
  choice: afin de la rétablir
  rationale: Le hiphil de עמד signifie faire tenir debout, établir ou remettre en place. « Rétablir » convient au contexte de reconstruction tout en restant moins étroit que « rebâtir ».
- source_word: עַל מְכוֹנוֹ
  choice: sur son emplacement
  rationale: מָכוֹן peut désigner un lieu fixé, un site ou une base. « Sur son emplacement » conserve d’abord la valeur locative sans exclure l’idée des fondations.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin sans le remplacer par un titre.
- issue: Nature de la « maison » à Jérusalem
  choice: maison de Yahweh / maison de Dieu
  alternative: temple de Yahweh / temple de Dieu
  rationale: Le contexte désigne bien le temple, mais garder « maison » respecte la répétition de בַּיִת et évite d’effacer l’image théologique portée par le texte.
- issue: Sens de עַל מְכוֹנוֹ
  choice: sur son emplacement
  alternative: sur ses fondations
  rationale: Le terme peut viser le site assigné ou la base matérielle. Le texte principal retient le sens locatif large et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et narratif. « Chefs de famille » privilégie l’intelligibilité tout en expliquant la structure sociale hébraïque en note. La répétition « maison de Yahweh / maison de Dieu » est volontairement conservée.
