revisions:
- from: Quelques-uns des chefs de famille[a], lorsqu’ils arrivèrent à la maison de Yahweh qui est à Jérusalem, firent volontairement des dons[b] pour la maison de Dieu, afin de la rétablir sur son emplacement[c].
  to: Quelques-uns des chefs de clans[a], lorsqu’ils arrivèrent à la maison de Yahweh qui est à Jérusalem, firent des dons volontaires[b] pour la maison de Dieu, afin de l’établir à son emplacement[c].
  rationale: La révision évite de faire dire au verbe « rétablir » ce que le texte ne précise pas, améliore la formulation française de la localisation et rend plus nettement la dimension clanique de l’expression hébraïque. Les possibilités sémantiques de מָכוֹן demeurent explicitement signalées en note.
