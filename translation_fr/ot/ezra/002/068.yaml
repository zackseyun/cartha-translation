    issue: « afin de la rétablir » surinterprète לְהַעֲמִידוֹ.
    rationale: Le verbe signifie faire tenir debout, établir ou mettre en place. Le contexte est celui d’une reconstruction, mais le verbe ne demande pas à lui seul le sens spécifique de « rétablir ».
  - severity: low
    issue: « sur son emplacement » est maladroit et limite le sens de מָכוֹן.
    rationale: En français, on établit un édifice « à son emplacement » ; le terme hébreu peut aussi renvoyer à une base ou à des fondations, possibilité à préserver en note.
  - severity: low
    issue: « chefs de famille » atténue la portée clanique de רָאשֵׁי הָאָבוֹת.
    rationale: Le syntagme désigne des responsables de groupes de parenté. « Chefs de clans » est plus immédiatement intelligible tout en étant mieux cadré par une note.
