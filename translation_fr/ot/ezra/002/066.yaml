lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: Ils avaient … chevaux
  rationale: סוּס signifie « cheval » et le suffixe pronominal de troisième personne du masculin pluriel indique la possession. En français courant, « Ils avaient » exprime naturellement cette relation dans un inventaire.
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: '736'
  rationale: La suite de nombres hébraïque donne sans ambiguïté le total de 736. Les chiffres facilitent la lecture de cette liste.
- source_word: פִּרְדֵיהֶם
  choice: mulets
  rationale: פֶּרֶד désigne précisément un « mulet » ; une expression plus générale comme « bêtes de somme » serait moins exacte.
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: La suite de nombres hébraïque donne le total de 245. Les chiffres conviennent au caractère administratif de l’énumération.
