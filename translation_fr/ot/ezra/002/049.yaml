lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן est rendu de manière concise et répétitive, conformément à la structure hébraïque de cette liste. Ici, « fils » peut désigner plus largement les membres d’une lignée ou les descendants d’un ancêtre.
- source_word: עֻזָּא
  choice: Ouzza
  rationale: Translittération française usuelle du nom propre hébreu, avec « Ou- » pour le son initial /u/.
- source_word: פָסֵחַ
  choice: Paséah
  rationale: Translittération adaptée au français moderne; elle conserve les principales consonnes du nom hébreu sans chercher à en traduire le sens.
- source_word: בֵסָי
  choice: Bésaï
  rationale: Translittération française du nom propre; le tréma indique que les deux voyelles finales se prononcent séparément.
