  text: les fils d’Ouzza[a], les fils de Paséah, les fils de Bésaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « fils de » peut désigner une lignée familiale ou des descendants, et pas seulement des fils directs.
