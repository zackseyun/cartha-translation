  text: 'Les chanteurs : les fils d’Asaph, cent vingt-huit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: les chanteurs
  rationale: Le participe substantivé dérivé de שׁיר désigne ceux qui chantent. « Les chanteurs » est direct, naturel et n’ajoute pas la précision contextuelle « du Temple », absente du verset.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique et corporative, בְּנֵי présente une lignée ou un groupe rattaché à Asaph. « Les fils de » conserve la forme de l’hébreu et laisse ouverte la question de savoir s’il s’agit de descendants directs ou des membres d’une lignée organisée.
- source_word: אָסָף
  choice: Asaph
  rationale: Cette forme française traditionnelle et bien établie transcrit le nom propre hébreu.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: cent vingt-huit
  rationale: La suite cardinale hébraïque correspond sans ambiguïté à 100 + 20 + 8 ; la formulation française moderne est concise et naturelle.
