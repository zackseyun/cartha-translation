source:
  edition: WLC
  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: fr
  text: 'qui vinrent avec Zorobabel : Yéchoua, Néhémie, Seraya, Réélaya[a], Mardochée, Bilshân, Mispar[b], Bigvaï, Rehoum[c] et Baana. Nombre des hommes du peuple d’Israël[d] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la liste parallèle de Néhémie 7.7, « Réélaya » apparaît sous la forme « Raamaya ».
    reason: alternative_reading
  - marker: b
    text: Dans la liste parallèle de Néhémie 7.7, « Mispar » apparaît sous la forme « Mispéreth ».
    reason: alternative_reading
  - marker: c
    text: Dans la liste parallèle de Néhémie 7.7, « Rehoum » apparaît sous la forme « Nehoum ».
    reason: alternative_reading
  - marker: d
    text: Cette formule introduit le dénombrement qui commence au verset suivant.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif poursuit naturellement en français la phrase commencée au verset précédent, sans ajouter un démonstratif absent de l’hébreu.
- source_word: בָּאוּ
  choice: vinrent
  rationale: Le qal accompli de בוא exprime simplement le fait de venir. « Revinrent » expliciterait le contexte du retour d’exil sans que cette nuance soit portée par le verbe lui-même.
- source_word: עִם
  choice: avec
  rationale: La préposition marque directement l’accompagnement.
- source_word: זְרֻבָּבֶל
  choice: Zorobabel
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre.
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Translittération française claire de la forme postexilique יֵשׁוּעַ, qui évite de la confondre artificiellement avec la forme hébraïque plus longue habituellement rendue par « Josué ».
- source_word: נְחֶמְיָה
  choice: Néhémie
  rationale: Forme française usuelle du nom.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Le texte massorétique porte ce nom; la forme choisie le translittère naturellement en français.
- source_word: רְעֵלָיָה
  choice: Réélaya
  rationale: Translittération française de la forme du texte massorétique; la variante de la liste parallèle est signalée en note.
- source_word: מָרְדֳּכַי
  choice: Mardochée
  rationale: Forme française traditionnelle et immédiatement reconnaissable.
- source_word: בִּלְשָׁן
  choice: Bilshân
  rationale: Translittération française du nom propre, avec « sh » pour rendre שׁ sans le confondre avec un son simple « s ».
- source_word: מִסְפָּר
  choice: Mispar
  rationale: Dans cette série, le terme fonctionne comme un nom propre et non comme le nom commun « nombre »; la forme différente de Néhémie 7.7 est donnée en note.
- source_word: בִּגְוַי
  choice: Bigvaï
  rationale: Translittération française lisible du nom propre.
- source_word: רְחוּם
  choice: Rehoum
  rationale: Translittération française de la forme du texte massorétique; la liste parallèle présente une autre forme, conservée en note.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Translittération française simple du nom propre.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Voici le nombre des hommes du peuple d’Israël
  rationale: « Voici » rend naturellement en français la fonction de titre ou d’introduction de cette proposition nominale, tandis que « nombre », « hommes » et « peuple d’Israël » restent proches de la formulation hébraïque.
