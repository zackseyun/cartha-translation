  text: כָּ֨ל הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה שְׁלֹ֥שׁ מֵא֖וֹת תִּשְׁעִ֥ים וּ/שְׁנָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/058.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: fr
  text: Le total des serviteurs du Temple[a] et des fils des serviteurs de Salomon était de trois cent quatre-vingt-douze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu netinim, terme technique désignant une catégorie de personnes affectées au service du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Tous
  rationale: Le quantificateur porte sur les deux groupes réunis; « Tous » en donne une traduction directe et naturelle.
- source_word: הַנְּתִינִים
  choice: les serviteurs du Temple
  rationale: נְתִינִים est un terme technique postexilique désignant une catégorie de personnes affectées au service du Temple. Cette traduction fonctionnelle est claire en français moderne, tandis qu’une translittération serait obscure.
- source_word: וּבְנֵי
  choice: et les descendants des
  rationale: Dans la désignation d’un groupe héréditaire, בְּנֵי (« fils de ») peut naturellement désigner les descendants; ce choix évite de suggérer qu’il s’agit uniquement des fils immédiats.
- source_word: עַבְדֵי
  choice: serviteurs de
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans cette liste administrative, l’expression sert de nom traditionnel au groupe, sans mettre explicitement l’accent sur le statut servile.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: « Salomon » est la forme française traditionnelle et courante du nom.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: trois cent quatre-vingt-douze
  rationale: Rendu cardinal standard en français; « cent » et « vingt » restent invariables puisqu’ils sont suivis d’un autre nombre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Temple » prend ici une majuscule puisqu’il désigne le sanctuaire de Jérusalem. La tournure « étaient au nombre de » restitue naturellement le total administratif exprimé par l’hébreu.
