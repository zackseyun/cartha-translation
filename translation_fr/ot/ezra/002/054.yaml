lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste de rapatriés, le terme introduit des groupes familiaux. « Les fils de » conserve la structure répétitive de l’hébreu et demeure naturel dans le registre généalogique biblique, sans préciser indûment s’il s’agit de fils directs ou de descendants plus éloignés.
- source_word: נְצִיחַ
  choice: Netsiah
  rationale: Nom propre transcrit d’après sa forme hébraïque. « Netsiah » rend notamment la consonne צ par « ts » et distingue ainsi la transcription française de la convention anglaise « Neziah ».
- source_word: חֲטִיפָא
  choice: Hatifa
  rationale: Nom propre transcrit plutôt que traduit. « Hatifa » constitue une forme lisible en français et rend la consonne פ non redoublée comme « f » ; l’aleph final n’appelle pas ici de consonne supplémentaire en français.
