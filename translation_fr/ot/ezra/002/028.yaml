  text: 'Les hommes de Béthel et d’Aï : deux cent vingt-trois.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: Les hommes de
  rationale: Le pluriel construit de אִישׁ introduit ici une entrée de recensement masculine liée à des localités. « Les hommes de » rend explicitement la forme hébraïque tout en restant naturel dans cette liste.
- source_word: בֵית אֵל
  choice: Béthel
  rationale: Nom de lieu rendu selon sa forme française traditionnelle, avec les accents usuels.
- source_word: וְהָעָי
  choice: et d’Aï
  rationale: Le nom propre עַי porte l’article en hébreu, mais celui-ci n’est pas repris devant la forme française établie « Aï ». La préposition « de », régie par « les hommes de », est élidée devant la voyelle.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: deux cent vingt-trois
  rationale: Rendu direct du nombre cardinal. « Cent » reste invariable puisqu’il est suivi d’un autre nombre, et « vingt » ne prend pas de s.
