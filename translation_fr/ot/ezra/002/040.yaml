lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Les Lévites
  rationale: L’article défini et le nom de groupe introduisent une nouvelle catégorie du recensement ; cette formulation conserve clairement la fonction d’intitulé.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique, le terme désigne les membres d’une famille ou d’un clan. « Les fils de » reste formellement proche de l’hébreu sans exclure des descendants plus éloignés.
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Translittération française courante du nom postexilique, distincte de la forme traditionnelle « Josué ».
- source_word: וְקַדְמִיאֵל
  choice: et de Qadmiel
  rationale: Le nom propre est translittéré ; la répétition de « de » rend naturelle et non ambiguë la coordination en français.
- source_word: לִבְנֵי
  choice: parmi les fils de
  rationale: Le lamed établit ici vraisemblablement l’appartenance généalogique ou classificatoire. « Parmi » exprime ce rattachement en français naturel tout en laissant « fils » traduire בְּנֵי.
- source_word: הוֹדַוְיָה
  choice: Hodavia
  rationale: Le texte massorétique d’Esdras porte cette forme du nom ; la forme différente du passage parallèle est signalée en note.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: '74'
  rationale: La notation chiffrée est claire et naturelle dans une liste de recensement, et correspond exactement à « soixante-quatorze ».
