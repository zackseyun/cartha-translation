  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: fr
  text: 'Les Lévites : les fils de Yéchoua et de Qadmiel, des fils de Hodavia[a] : soixante-quatorze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Hodavia » ; le passage parallèle de Néhémie 7.43 porte « Hodeva ».
