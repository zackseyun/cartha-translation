- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste de personnes revenues d’exil, בְּנֵי désigne un groupe familial ou clanique rattaché à un ancêtre masculin. « les fils de » conserve la forme généalogique du texte tout en restant naturelle en français.
- source_word: חָשֻׁם
  choice: Hashoum
  rationale: Le nom propre hébreu est transcrit selon une forme française claire, avec « ou » pour le son /u/.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: deux cent vingt-trois
  rationale: La suite numérique hébraïque signifie littéralement « deux cents, vingt et trois ». La formulation française standard « deux cent vingt-trois » en communique exactement le total.
