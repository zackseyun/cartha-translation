  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], 973.'
translation:
  language: fr
  text: 'Les prêtres : les fils de Yedaïa[a], de la maison de Yéchoua[b], 973.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les descendants de Yedaïa ». L’hébreu dit littéralement « les fils de Yedaïa », expression généalogique courante.
    reason: lexical_alternative
  - marker: b
    text: Yéchoua est un nom personnel employé après l’exil; il est apparenté au nom Josué.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Les prêtres
  rationale: Le nom défini pluriel désigne directement les prêtres et introduit ici le groupe sacerdotal recensé.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Cette traduction conserve l’expression généalogique hébraïque, qui peut aussi désigner plus largement les descendants ou les membres d’une lignée.
- source_word: יְדַעְיָה
  choice: Yedaïa
  rationale: Transcription française du nom propre hébreu, avec une graphie qui en reflète la prononciation plus clairement que les formes héritées par l’intermédiaire d’autres langues.
- source_word: לְבֵית
  choice: de la maison de
  rationale: Dans ce registre généalogique, la préposition marque l’appartenance à une maison ou à une lignée familiale.
- source_word: יֵשׁוּעַ
  choice: Yéchoua
  rationale: Transcription française du nom postexilique hébreu, distincte dans sa forme de la graphie française traditionnelle « Josué », bien que les deux noms soient apparentés.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: '973'
  rationale: La suite de nombres hébraïques donne un total de 973; les chiffres facilitent la lecture de cette liste de recensement sans modifier le sens.
