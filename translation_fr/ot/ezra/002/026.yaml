    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste de recensement, l’expression hébraïque peut désigner les membres d’un groupe familial ou d’une communauté, et non uniquement des fils au sens immédiat. « Les fils de » conserve la forme de l’hébreu, tandis que la note signale l’acception plus large possible.
- source_word: הָרָמָה
  choice: Rama
  rationale: Nom de lieu rendu selon sa forme française biblique usuelle.
- source_word: וָגָבַע
  choice: et de Guéba
  rationale: Nom de lieu précédé de la conjonction. « Guéba » distingue en français la localité de Guibéa tout en représentant le nom hébreu גֶּבַע.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: six cent vingt et un
  rationale: Nombre cardinal du recensement, exprimé conformément à l’usage naturel du français moderne.
