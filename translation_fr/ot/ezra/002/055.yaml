  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סֹטַ֥י בְּנֵי הַ/סֹּפֶ֖רֶת בְּנֵ֥י פְרוּדָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/055.yaml
  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: fr
  text: 'les descendants des serviteurs de Salomon : les descendants de Sotaï, les descendants de Hassoféreth et les descendants de Perouda[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu d’Esdras porte « Perouda » ; la liste parallèle de Néhémie 7.57 porte « Perida ».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: les descendants de
  rationale: Dans cette liste généalogique et administrative, le terme désigne des lignées ou des groupes familiaux, et non nécessairement des fils immédiats. « Les descendants de » restitue clairement cette portée collective en français moderne.
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Le mot peut aussi désigner des esclaves, mais l’expression constitue ici le nom établi d’une catégorie de personnes rattachées à Salomon. « Serviteurs » préserve cette désignation sans préciser plus que le contexte le statut juridique.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française conventionnelle du nom propre biblique.
- source_word: סֹטַי
  choice: Sotaï
  rationale: Transcription française du nom hébreu, avec un tréma pour marquer la prononciation séparée des voyelles finales.
- source_word: הַסֹּפֶרֶת
  choice: Hassoféreth
  rationale: Transcription du nom tel qu’il apparaît dans le texte hébreu, y compris l’article préfixé assimilé; il est traité comme un nom de lignée plutôt que traduit comme un nom commun.
- source_word: פְרוּדָא
  choice: Perouda
  rationale: Le texte massorétique d’Esdras porte cette forme. La graphie française « ou » rend la voyelle /u/; la variante de la liste parallèle est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et adapté au rythme d’une liste généalogique. La répétition de « les descendants de » conserve la structure du texte hébreu tout en évitant que « fils de » soit compris comme désignant uniquement des enfants directs. Le marqueur de note est placé après « Perouda », puisque la variante concerne ce nom.
