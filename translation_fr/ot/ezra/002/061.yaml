  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: fr
  text: 'Parmi les descendants des prêtres : les descendants de Hobaya, les descendants d’Hakkots et les descendants de Barzillaï, qui avait épousé l’une des filles de Barzillaï le Galaadite et fut appelé d’après leur nom.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et fut appelé d’après leur nom ».'
    reason: La note signale la formulation littérale de l’hébreu et maintient l’ambiguïté quant à la manière précise dont il porta ce nom.
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: Parmi les descendants des prêtres
  rationale: Le מִן a une valeur partitive. « Descendants » exprime naturellement la filiation dans une liste généalogique française, sans suggérer qu’il s’agit uniquement de fils immédiats.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: les descendants de Hobaya ... les descendants d’Hakkots ... les descendants de Barzillaï
  rationale: La répétition de בְּנֵי est conservée pour reproduire la structure de la liste, tandis que « descendants » est plus exact et naturel que « fils » pour des groupes familiaux.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: qui avait épousé l’une des filles de
  rationale: L’expression לקח ... אשה désigne le fait de prendre une femme pour épouse. Le plus-que-parfait marque naturellement l’antériorité du mariage par rapport au changement de nom.
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: Barzillaï le Galaadite
  rationale: « Le Galaadite » rend directement l’adjectif gentilé et correspond à l’usage biblique français courant.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: et avait pris leur nom
  rationale: Cette formulation idiomatique française exprime le fait qu’il en vint à porter le nom de cette famille. Le passif littéral et l’ambiguïté de la tournure hébraïque sont signalés en note.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure répétitive de la liste généalogique est préservée, avec « descendants » plutôt que le calque « fils ». Les noms propres suivent des formes françaises bibliques usuelles.
