  text: the sons of Giddel[a], the sons of Gahar, the sons of Reaiah.
translation:
  language: fr
  text: Les descendants de Giddel, les descendants de Gahar, les descendants de Reaja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: les descendants de
  rationale: Dans cette liste de groupes revenus d’exil, le pluriel construit de בֵּן désigne naturellement les membres d’une lignée ou d’un clan, et non nécessairement les fils immédiats.
- source_word: גִדֵּל
  choice: Guiddel
  rationale: Nom propre translittéré en français; « Gu » indique que le g initial reste dur devant i, et la consonne redoublée reflète le dagesh.
- source_word: גַחַר
  choice: Gahar
  rationale: Nom propre translittéré selon une forme lisible en français, en conservant les consonnes et les voyelles essentielles de l’hébreu.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Nom propre translittéré directement depuis l’hébreu רְאָיָה, sous une forme naturelle et transparente pour le lecteur francophone.
