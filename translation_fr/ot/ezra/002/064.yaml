lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: L’assemblée tout entière
  rationale: כָּל avec le nom défini exprime la totalité. Cette formulation est naturelle en français moderne et désigne clairement l’ensemble des personnes réunies, sans connotation ecclésiale particulière.
- source_word: כְּאֶחָד
  choice: au total
  rationale: L’expression signifie littéralement « comme un seul » et présente ici l’effectif collectif de toute l’assemblée. « Au total » restitue naturellement sa fonction dans ce relevé numérique; le sens littéral est conservé en note.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  choice: quarante-deux mille trois cent soixante
  rationale: La suite numérique hébraïque correspond exactement à 42 360. En français, « cent » reste invariable puisqu’il est suivi de « soixante ».
- source_word: '[copule nominale implicite]'
  choice: comptait … personnes
  rationale: L’hébreu juxtapose l’assemblée et son nombre. Le verbe « comptait » et le nom « personnes » explicitent sobrement le rapport numérique nécessaire à une phrase française naturelle.
