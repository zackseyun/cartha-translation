review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement le cadre généalogique et l’incertitude sur l’origine israélite. Toutefois, « ni dire s’ils étaient d’Israël » ajoute une seconde action distincte là où l’hébreu exprime l’incapacité à faire connaître les éléments généalogiques permettant d’établir s’ils étaient d’Israël. La graphie « Tel-Harcha » ne reflète pas bien le š de חַרְשָׁא ; « Tel-Harsha » est préférable.
  naturalness: La formulation révisée demeure sobre et naturelle en français moderne. « Maison paternelle » est un peu technique, mais une note en explique précisément la valeur administrative et généalogique.
  terminology: « Maison paternelle » rend le terme technique בֵּית־אָבוֹת ; « descendance » rend זֶרַע sans réduire indûment le terme à une simple « lignée ». « D’Israël » conserve l’ambiguïté source entre ascendance et appartenance.
  issues:
  - severity: medium
    issue: La coordination « ni dire s’ils étaient d’Israël » sépare artificiellement la dernière proposition de l’acte de déclaration généalogique.
    rationale: L’hébreu relie « leur maison paternelle et leur descendance » à la question de savoir s’ils étaient d’Israël. « Pour établir » exprime ce lien sans prétendre lever l’ambiguïté.
  - severity: low
    issue: « Tel-Harcha » est une translittération imprécise de Tel-harsha.
    rationale: Le mot hébreu comporte שׁ (š), non un son rendu naturellement par « ch » en français.
