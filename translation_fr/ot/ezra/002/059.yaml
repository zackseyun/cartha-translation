    reason: lexical_alternative
  revision_rationale: La révision resserre la syntaxe afin de refléter que la déclaration de la maison paternelle et de la descendance était ce qui devait permettre d’établir leur lien avec Israël. Elle corrige aussi la translittération de Tel-Harsha et remplace « maison ancestrale », plus vague, par le terme généalogique plus exact « maison paternelle », expliqué en note.
