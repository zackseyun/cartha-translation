source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדָּ֖ן אִמֵּ֑ר וְ/לֹ֣א יָֽכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: fr
  text: Voici ceux qui revinrent de Tel-Mélah, Tel-Harsha, Keroub, Addân et Immer ; ils ne purent indiquer leur maison paternelle[a] ni leur descendance, pour établir s’ils étaient d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de leurs pères ». Cette expression désigne leur groupe familial selon la lignée paternelle ; avec « leur descendance », elle concerne les preuves de leur filiation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלִים
  choice: ceux qui revinrent
  rationale: Dans le contexte du recensement postexilique, le participe désigne ceux qui montèrent vers le pays en y revenant. « Revinrent » exprime naturellement ce mouvement en français sans employer le terme plus interprétatif « rapatriés ».
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: de Tel-Mélah, Tel-Harcha, Keroub, Addân et Immer
  rationale: Les noms de lieux ou de groupes sont translittérés selon des formes lisibles en français moderne. Les traits d’union signalent les noms composés commençant par Tel.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: ils ne purent indiquer
  rationale: Dans ce cadre administratif et généalogique, נגד signifie faire connaître ou fournir une indication. « Ne purent indiquer » garde l’idée d’une incapacité à présenter les renseignements requis.
- source_word: בֵּית אֲבוֹתָם
  choice: leur maison ancestrale
  rationale: L’expression désigne le groupe familial défini par la lignée paternelle. « Maison ancestrale » conserve l’image sociale de la maison tout en étant plus intelligible aujourd’hui que « maison de leurs pères ».
- source_word: וְזַרְעָם
  choice: ni leur lignée
  rationale: זרע renvoie ici à la filiation ou à la descendance généalogique. « Lignée » convient au contexte et évite le littéralisme opaque de « semence ».
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: ni dire s’ils étaient d’Israël
  rationale: La formulation maintient l’incertitude portant sur leur origine israélite sans préciser au-delà du texte s’il s’agit seulement d’ascendance documentée ou plus largement d’appartenance au peuple.
theological_decisions:
- issue: Nature de l’expression « être d’Israël »
  choice: s’ils étaient d’Israël
  alternative: s’ils appartenaient au peuple d’Israël
  rationale: La formulation retenue préserve la concision et l’ambiguïté du texte hébreu entre origine généalogique et appartenance collective, sans imposer une définition théologique ou juridique.
translation_notes:
  register: Français moderne, sobre et digne, adapté au style d’une liste administrative. Les tours archaïques inutiles sont évités, tandis que l’expression « d’Israël » conserve la tension et la portée du texte source.
