revisions:
- from: Voici ceux qui revinrent de Tel-Mélah, Tel-Harcha, Keroub, Addân et Immer, mais ils ne purent indiquer leur maison ancestrale ni leur lignée[a], ni dire s’ils étaient d’Israël.
  to: Voici ceux qui revinrent de Tel-Mélah, Tel-Harsha, Keroub, Addân et Immer ; ils ne purent indiquer leur maison paternelle[a] ni leur descendance, pour établir s’ils étaient d’Israël.
  rationale: La révision resserre la syntaxe afin de refléter que la déclaration de la maison paternelle et de la descendance était ce qui devait permettre d’établir leur lien avec Israël. Elle corrige aussi la translittération de Tel-Harsha et remplace « maison ancestrale », plus vague, par le terme généalogique plus exact « maison paternelle », expliqué en note.
