revisions:
- from: Après cela, ils offrirent l’holocauste régulier[a], ainsi que les offrandes pour les nouvelles lunes[b], pour toutes les fêtes fixées[c] de Yahweh qui étaient consacrées, et pour tous ceux qui présentaient de plein gré une offrande volontaire à Yahweh.
  to: Après cela, ils offrirent l’holocauste régulier[a], les offrandes des nouvelles lunes[b] et de toutes les fêtes que Yahweh avait fixées comme sacrées[c], ainsi que toute offrande volontaire que quiconque présentait de plein gré à Yahweh.
  rationale: La révision explicite l’ellipse sacrificielle par « les offrandes », comme le permet le contexte, tout en évitant que « pour tous ceux » paraisse être un autre destinataire des offrandes. « Quiconque » reflète le singulier distributif de l’hébreu. La relative « que Yahweh avait fixées comme sacrées » rend de façon idiomatique les fêtes/temps fixés de Yahweh et leur caractère consacré.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:48:38Z'
