  naturalness: La phrase proposée est compréhensible, mais l’enchaînement « les offrandes pour ... et pour tous ceux » est syntaxiquement ambigu en français. Une formulation explicite et parallèle est plus naturelle.
  terminology: « Holocauste », « nouvelles lunes », « Yahweh » et « offrande volontaire » conviennent. « Fêtes fixées de Yahweh » est peu idiomatique ; « fêtes que Yahweh avait fixées comme sacrées » rend clairement le génitif et le participe passif sans imposer une interprétation doctrinale.
