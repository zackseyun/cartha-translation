language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: fr
  text: Après cela, ils offrirent l’holocauste régulier[a], les offrandes des nouvelles lunes[b] et de toutes les fêtes que Yahweh avait fixées comme sacrées[c], ainsi que toute offrande volontaire que quiconque présentait de plein gré à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’holocauste continuel » ou « l’holocauste quotidien ».
    reason: lexical_alternative
  - marker: b
    text: Les « nouvelles lunes » étaient les célébrations sacrées mensuelles observées au début de chaque mois.
    reason: cultural_note
  - marker: c
    text: Ou « tous les temps fixés » ou « toutes les fêtes » de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Marque naturellement en français la succession temporelle et conserve le lien avec les sacrifices mentionnés auparavant.
- source_word: עֹלַת תָּמִיד
  choice: l’holocauste régulier
  rationale: עֹלָה désigne l’offrande entièrement consumée, et תָּמִיד sa présentation constante ou régulière; « régulier » évite de préciser « quotidien » au-delà de la forme hébraïque.
- source_word: וְלֶחֳדָשִׁים
  choice: les offrandes pour les nouvelles lunes
  rationale: חֹדֶשׁ désigne ici les célébrations sacrées qui marquaient le début de chaque mois. « Offrandes » est explicité d’après le contexte sacrificiel et la construction parallèle.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה
  choice: pour toutes les fêtes fixées de Yahweh
  rationale: מוֹעֵד désigne des temps déterminés du calendrier cultuel et, dans ce contexte, les fêtes qui y correspondent.
- source_word: הַמְקֻדָּשִׁים
  choice: qui étaient consacrées
  rationale: Le participe passif indique que ces fêtes étaient mises à part comme sacrées, sans effacer la valeur verbale de la forme.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: et pour tous ceux qui présentaient de plein gré une offrande volontaire
  rationale: La formulation conserve à la fois l’acte libre exprimé par le participe et le terme cultuel נְדָבָה, tout en restant idiomatique en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La transcription « Yahweh » représente directement le nom divin יהוה et le distingue d’un titre tel que « le Seigneur ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Rapport de הַמְקֻדָּשִׁים avec מוֹעֲדֵי
  choice: les fêtes fixées… qui étaient consacrées
  alternative: les fêtes saintes fixées
  rationale: Le rendu retenu conserve la valeur passive du participe (« rendues ou déclarées sacrées ») au lieu de la réduire à un simple adjectif de qualité.
translation_notes:
  register: Français international moderne, digne et accessible. Le verbe « ils offrirent » est restitué à partir du contexte immédiat, puisque l’hébreu poursuit une construction elliptique. Les répétitions de « pour » maintiennent les relations syntaxiques du texte tout en clarifiant que les offrandes sont sous-entendues dans les éléments parallèles.
