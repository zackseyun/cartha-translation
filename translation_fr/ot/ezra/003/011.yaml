source:
  edition: WLC
  text: וַֽ֠/יַּעֲנוּ בְּ/הַלֵּ֨ל וּ/בְ/הוֹדֹ֤ת לַֽ/יהוָה֙ כִּ֣י ט֔וֹב כִּֽי לְ/עוֹלָ֥ם חַסְדּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/כָל הָ/עָ֡ם הֵרִיעוּ֩ תְרוּעָ֨ה גְדוֹלָ֤ה בְ/הַלֵּל֙ לַֽ/יהוָ֔ה עַ֖ל הוּסַ֥ד בֵּית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: fr
  text: 'Ils répondirent[a] par des louanges et des actions de grâce à Yahweh : « Car il est bon, car son amour fidèle envers Israël dure pour toujours[b]. » Et tout le peuple poussa un grand cri en louant Yahweh, parce que la maison de Yahweh avait été fondée[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils chantaient en se répondant ». Le verbe hébreu signifie « répondre » et peut ici désigner une louange chantée en alternance.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire plus littéralement : « car son amour fidèle envers Israël est pour toujours ».'
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, cette expression désigne la pose des fondations du temple.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Ils se répondaient
  rationale: Le verbe ענה signifie fondamentalement « répondre » et, dans ce cadre liturgique, évoque vraisemblablement une louange alternée. Cette formulation conserve cette nuance sans ajouter explicitement le verbe « chanter », absent de l’hébreu.
- source_word: בְּהַלֵּל וּבְהוֹדֹת לַיהוָה
  choice: en louant Yahweh et en lui rendant grâce
  rationale: La tournure verbale est naturelle en français et distingue les deux actions cultuelles exprimées par l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu.
- source_word: כִּי טוֹב
  choice: Car il est bon
  rationale: Cette formulation restitue simplement la confession liturgique hébraïque, dont la copule est sous-entendue.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חסד associe bienveillance, loyauté et constance relationnelle. « Amour fidèle » en exprime la portée sans imposer un sens technique plus étroit.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ עַל יִשְׂרָאֵל
  choice: car son amour fidèle envers Israël dure pour toujours
  rationale: « Dure pour toujours » donne en français naturel la valeur temporelle de לְעוֹלָם, tandis que « envers Israël » conserve la relation exprimée par עַל.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: poussa un grand cri
  rationale: Le singulier collectif s’accorde avec « tout le peuple » et maintient autant que possible l’intensité du complément de même racine en hébreu.
- source_word: בְּהַלֵּל לַיהוָה
  choice: en louant Yahweh
  rationale: 'Cette expression indique la nature du grand cri : il constitue une louange adressée à Yahweh.'
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: parce que la maison de Yahweh avait été fondée
  rationale: Cette traduction suit le hophal de יסד et conserve la formulation de l’hébreu; le contexte précise qu’il s’agit de la pose des fondations du temple.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de חַסְדּוֹ dans la formule de louange
  choice: son amour fidèle
  alternative: sa bonté / sa fidélité / son amour d’alliance
  rationale: « Amour fidèle » garde ensemble l’affection bienveillante et la loyauté durable du terme, sans réduire celui-ci à une seule dimension ni ajouter explicitement « alliance ».
- issue: Caractère responsorial de וַיַּעֲנוּ
  choice: Ils se répondaient
  alternative: Ils chantaient en se répondant
  rationale: Le contexte rend probable une louange antiphonée, mais le texte ne nomme pas explicitement le chant. Le choix principal préserve cette retenue et la note signale la nuance liturgique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure hébraïque tout en évitant les tours artificiels; elle conserve le parallélisme liturgique, la répétition de « car » et l’ambiguïté mesurée du verbe « répondre ».
