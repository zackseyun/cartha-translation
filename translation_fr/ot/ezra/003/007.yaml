source:
  edition: WLC
  text: וַ/יִּ֨תְּנוּ כֶ֔סֶף לַ/חֹצְבִ֖ים וְ/לֶ/חָרָשִׁ֑ים וּ/מַאֲכָ֨ל וּ/מִשְׁתֶּ֜ה וָ/שֶׁ֗מֶן לַ/צִּֽדֹנִים֙ וְ/לַ/צֹּרִ֔ים לְ/הָבִיא֩ עֲצֵ֨י אֲרָזִ֤ים מִן הַ/לְּבָנוֹן֙ אֶל יָ֣ם יָפ֔וֹא כְּ/רִשְׁי֛וֹן כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרַ֖ס עֲלֵי/הֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: fr
  text: Ils donnèrent de l’argent[a] aux tailleurs de pierre et aux artisans, ainsi que des vivres, de la boisson et de l’huile aux Sidoniens et aux Tyriens, afin qu’ils acheminent du bois de cèdre depuis le Liban jusqu’à la mer de Jaffa[b], conformément à l’autorisation que Cyrus, roi de Perse, leur avait accordée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’argent-métal ». Le terme hébreu peut désigner le métal lui-même ou la monnaie employée pour un paiement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jusqu’à la mer de Jaffa » ; on peut aussi comprendre « jusqu’au port de Jaffa ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « conformément à la permission que Cyrus, roi de Perse, leur avait donnée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils donnèrent donc
  rationale: Le wayyiqtol fait progresser le récit; « donc » marque naturellement la suite logique en français sans alourdir la narration.
- source_word: כֶסֶף
  choice: de l’argent
  rationale: Le mot désigne littéralement l’argent-métal, mais prend couramment le sens de monnaie dans un contexte de paiement.
- source_word: לַחֹצְבִים
  choice: aux tailleurs de pierre
  rationale: Le participe désigne ceux qui extraient ou taillent la pierre; cette expression française est claire dans le contexte de construction.
- source_word: וְלֶחָרָשִׁים
  choice: et aux artisans
  rationale: חָרָשׁ désigne un ouvrier qualifié sans préciser nécessairement son matériau; « artisans » conserve cette généralité.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: et des vivres, de la boisson et de l’huile
  rationale: Ces noms forment une liste de fournitures. « Vivres » convient au contexte d’approvisionnement, tandis que « boisson » et « huile » restent non spécifiés comme dans l’hébreu.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: aux Sidoniens et aux Tyriens
  rationale: Les gentilés français usuels rendent directement les habitants de Sidon et de Tyr.
- source_word: לְהָבִיא
  choice: afin qu’ils acheminent
  rationale: L’infinitif exprime le but. « Acheminer » convient au transport du bois depuis le Liban jusqu’au littoral de Jaffa.
- source_word: עֲצֵי אֲרָזִים
  choice: du bois de cèdre
  rationale: Dans ce contexte de construction, l’expression désigne du matériau de construction en cèdre sans imposer la forme précise de rondins ou de planches.
- source_word: אֶל יָם יָפוֹא
  choice: jusqu’à la mer, à Jaffa
  rationale: Cette formulation reste proche du littéral « vers la mer de Jaffa » tout en étant intelligible en français moderne; elle évite d’ajouter explicitement « port ».
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ פָּרַס עֲלֵיהֶם
  choice: conformément à l’autorisation que Cyrus, roi de Perse, leur avait accordée
  rationale: רִשְׁיוֹן exprime ici une permission ou autorisation royale. La relative rend naturellement l’idiome avec עֲלֵיהֶם sans reproduire artificiellement « sur eux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la narration historique écrite. « Jaffa » est la forme française moderne du toponyme biblique traditionnellement appelé Joppé. Les notes conservent les ambiguïtés lexicales réelles sans surcharger le corps du verset.
