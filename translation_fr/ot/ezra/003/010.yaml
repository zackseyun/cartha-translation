reference: Ezra 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: fr
  text: Lorsque les bâtisseurs posèrent les fondations du temple de Yahweh, ils placèrent les prêtres, vêtus et munis de trompettes, ainsi que les lévites, les fils d’Asaph, munis de cymbales, pour louer Yahweh conformément aux directives de David, roi d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de David, roi d’Israël » ; l’expression peut désigner l’intermédiaire de David ou des dispositions qui lui sont attribuées.'
    reason: La traduction « conformément aux directives » explicite l’idiome hébreu, tandis que la note conserve ses nuances possibles d’intermédiaire et d’autorité.
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: Lorsque les bâtisseurs posèrent les fondations
  rationale: Le verbe יסד désigne ici la pose des fondations d’un édifice. Cette formulation rend naturellement en français la proposition temporelle liée à la suite du verset.
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahweh
  rationale: הֵיכָל désigne ici le sanctuaire en construction; « temple » est précis et courant. Le nom divin est translittéré « Yahweh ».
- source_word: וַיַּעֲמִידוּ
  choice: ils mirent en place
  rationale: Le hiphil de עמד indique que les participants furent placés à leurs postes pour le service liturgique. « Mirent en place » est naturel sans suggérer une nomination officielle.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים בַּחֲצֹצְרוֹת
  choice: les prêtres, revêtus de leurs habits sacerdotaux et munis de trompettes
  rationale: מְלֻבָּשִׁים signifie « vêtus » sans nommer explicitement le vêtement; le contexte sacerdotal justifie « habits sacerdotaux ». La préposition introduisant les trompettes exprime ici l’équipement rituel.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף בַּמְצִלְתַּיִם
  choice: ainsi que les lévites, fils d’Asaph, munis de cymbales
  rationale: « Fils d’Asaph » conserve la désignation généalogique ou corporative de l’hébreu. Les cymbales sont les instruments liturgiques indiqués par מְצִלְתַּיִם.
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: afin de louer Yahweh
  rationale: L’infinitif avec לְ exprime le but de cette disposition liturgique.
- source_word: עַל יְדֵי דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: conformément aux directives de David, roi d’Israël
  rationale: L’expression idiomatique עַל יְדֵי, littéralement « par la main de », peut indiquer l’intermédiaire ou l’autorité. Dans ce cadre cultuel, elle renvoie vraisemblablement aux dispositions établies par David.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: La translittération conserve le nom personnel présent deux fois dans le texte hébreu, sans le remplacer par un titre.
- issue: Portée de עַל יְדֵי דָּוִיד
  choice: conformément aux directives de David
  alternative: par l’intermédiaire de David / par la main de David
  rationale: Le contexte de l’organisation du culte favorise l’idée d’une prescription davidique, mais la note conserve l’image et la possibilité d’agence présentes dans l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité liturgique sans archaïsmes; « munis de » clarifie le rapport des prêtres et des lévites à leurs instruments.
