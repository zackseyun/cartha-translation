  text: וְ/אֵ֣ין הָ/עָ֗ם מַכִּירִים֙ ק֚וֹל תְּרוּעַ֣ת הַ/שִּׂמְחָ֔ה לְ/ק֖וֹל בְּכִ֣י הָ/עָ֑ם כִּ֣י הָ/עָ֗ם מְרִיעִים֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וְ/הַ/קּ֥וֹל נִשְׁמַ֖ע עַד לְ/מֵ/רָחֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: fr
  text: Le peuple ne pouvait pas distinguer le son des cris de joie du son des pleurs du peuple[a], car le peuple poussait de grands cris[b], et le son se faisait entendre au loin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « reconnaître le son des cris de joie et celui des pleurs du peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils poussaient une grande clameur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: on ne pouvait pas distinguer
  rationale: Le hiphil de נכר exprime ici la capacité de différencier deux sons; cette tournure française rend clairement le contraste.
- source_word: קוֹל
  choice: cris / bruit
  rationale: קוֹל désigne un phénomène audible. « Cris » convient aux manifestations humaines de joie, tandis que « bruit » reprend naturellement l’ensemble sonore à la fin du verset.
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: les cris de joie
  rationale: Cette expression conserve l’idée d’une clameur collective et jubilante dans un français naturel.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: des pleurs du peuple
  rationale: La préposition marque la mise en contraste des deux manifestations sonores; « pleurs » restitue la force émotionnelle de בְּכִי.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit l’explication de l’impossibilité de distinguer les sons.
- source_word: מְרִיעִים תְּרוּעָה גְדוֹלָה
  choice: poussait de grands cris
  rationale: Cette formulation idiomatique rend la construction apparentée du verbe et du nom ainsi que l’intensité de גְדוֹלָה, sans lourdeur en français.
- source_word: נִשְׁמַע
  choice: s’entendait
  rationale: Le pronominal passif français restitue naturellement le niphal de שׁמע et l’aspect descriptif du contexte.
- source_word: עַד לְמֵרָחוֹק
  choice: au loin
  rationale: Cette locution concise indique que le bruit portait jusqu’à une grande distance.
