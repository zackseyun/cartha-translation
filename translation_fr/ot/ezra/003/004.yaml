base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: fr
  text: Ils célébrèrent la fête des Cabanes, comme il est écrit, et offrirent les holocaustes quotidiens selon le nombre requis, conformément à la prescription pour chaque jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: la fête des Cabanes
  rationale: « Cabanes » est le nom courant et intelligible de cette fête en français biblique moderne; il rend סֻכּוֹת sans imposer le terme plus technique « Tabernacles ».
- source_word: וַיַּעֲשׂוּ
  choice: Ils célébrèrent
  rationale: Avec une fête comme complément, עשה signifie ici observer ou célébrer; cette formulation est naturelle en français.
- source_word: וְעֹלַת יוֹם בְּיוֹם
  choice: et offrirent chaque jour … d’holocaustes
  rationale: La tournure distributive יוֹם בְּיוֹם indique une offrande faite jour après jour; « holocaustes » traduit le terme cultuel עֹלָה.
- source_word: בְּמִסְפָּר
  choice: le nombre prescrit
  rationale: Le contexte de prescriptions cultuelles montre qu’il s’agit du nombre fixé pour les offrandes, et non simplement d’un comptage.
- source_word: כְּמִשְׁפַּט דְּבַר יוֹם בְּיוֹמוֹ
  choice: conformément à la règle établie pour chaque jour
  rationale: Cette formulation rend à la fois la norme prescrite (מִשְׁפָּט) et la part propre à chaque journée (דְּבַר יוֹם בְּיוֹמוֹ).
theological_decisions:
- issue: Nature normative des sacrifices quotidiens
  choice: « le nombre prescrit … conformément à la règle établie pour chaque jour »
  alternative: « selon leur nombre, suivant l’ordonnance, chaque chose au jour fixé »
  rationale: Le texte affirme l’observance d’un calendrier sacrificiel écrit sans identifier davantage le passage légal ni ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La phrase conserve l’insistance du texte hébreu sur la conformité à l’écrit et sur les prescriptions propres à chaque jour, tout en évitant une répétition maladroite de « jour ».
