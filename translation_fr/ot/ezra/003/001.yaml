  text: וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בֶּ/עָרִ֑ים וַ/יֵּאָסְפ֥וּ הָ/עָ֛ם כְּ/אִ֥ישׁ אֶחָ֖ד אֶל יְרוּשָׁלִָֽםס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: fr
  text: Lorsque le septième mois arriva, alors que les fils d’Israël[a] étaient dans les villes, le peuple se rassembla à Jérusalem comme un seul homme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ».
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque indiquant une action accomplie dans l’unité, d’un commun accord.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: arriva
  rationale: Avec une indication temporelle comme sujet, נגע signifie idiomatiquement que le mois est arrivé; « arriva » reste naturel et proche de l’image hébraïque.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: le septième mois
  rationale: Traduction directe qui conserve la manière hébraïque de désigner le mois sans lui substituer un nom calendaire ultérieur.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation reproduit le masculin collectif explicite de l’hébreu; une note indique l’équivalent courant « les Israélites ».
- source_word: בֶּעָרִים
  choice: étaient dans les villes
  rationale: L’hébreu est elliptique; le verbe « étaient » explicite en français la valeur prédicative du complément de lieu sans ajouter « leurs », absent du texte.
- source_word: וַיֵּאָסְפוּ
  choice: se rassembla
  rationale: Le niphal de אסף exprime ici le rassemblement de la communauté. Le singulier français s’accorde naturellement avec « le peuple ».
- source_word: הָעָם
  choice: le peuple
  rationale: Équivalent collectif courant de העם dans ce contexte.
- source_word: כְּאִישׁ אֶחָד
  choice: comme un seul homme
  rationale: La traduction conserve l’image masculine singulière et l’idée d’une action parfaitement unie; la note en éclaire la valeur idiomatique.
- source_word: אֶל יְרוּשָׁלִָם
  choice: à Jérusalem
  rationale: Avec « se rassembler », « à Jérusalem » exprime naturellement en français le lieu qui constitue aussi la destination du mouvement marqué par אֶל.
theological_decisions:
- issue: Langage collectif masculin dans בְּנֵי יִשְׂרָאֵל et כְּאִישׁ אֶחָד
  choice: Conserver « les fils d’Israël » et « comme un seul homme » dans le texte principal.
  alternative: Employer « les Israélites » et « comme un seul être » ou « d’un commun accord ».
  rationale: Les expressions masculines appartiennent à la forme même du texte hébreu et ont ici une portée collective. Les conserver maintient la transparence envers la source sans introduire une interprétation confessionnelle; les notes rendent leur sens idiomatique accessible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression temporelle et narrative de l’hébreu, tout en explicitant la copule sous-entendue devant « dans les villes ».
