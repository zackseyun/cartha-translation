id: EZR.3.2
reference: Ezra 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: fr
  text: Alors Josué, fils de Yotsadaq, se leva avec ses frères, les prêtres[a], ainsi que Zorobabel, fils de Shealtiel, avec ses frères. Ils bâtirent l’autel du Dieu d’Israël afin d’y offrir des holocaustes, conformément à ce qui est écrit dans la Loi de Moïse[b], l’homme de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses proches » ou « ses compagnons ». L’hébreu dit littéralement « ses frères »; l’expression qui suit identifie le groupe de Josué comme étant celui des prêtres.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « Loi » peut aussi signifier « instruction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום ouvre ici une action résolue. « Se leva » conserve le mouvement narratif sans préciser indûment qu’il se serait seulement mis debout ou qu’il aurait simplement commencé.
- source_word: יֵשׁוּעַ
  choice: Josué
  rationale: « Josué » est la forme française traditionnelle et immédiatement reconnaissable du nom hébreu יֵשׁוּעַ dans ce contexte vétérotestamentaire.
- source_word: וְאֶחָיו
  choice: ses frères
  rationale: אָח désigne d’abord un frère, mais peut s’étendre aux proches ou aux compagnons. Le texte précise que le groupe de Josué est celui des prêtres; la traduction littérale préserve néanmoins l’ambiguïté lexicale.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Ce groupe nominal en apposition identifie les « frères » de Josué comme prêtres.
- source_word: זְרֻבָּבֶל
  choice: Zorobabel
  rationale: Forme française biblique usuelle de ce nom propre.
- source_word: שְׁאַלְתִּיאֵל
  choice: Shealtiel
  rationale: Translittération française courante du nom hébreu.
- source_word: וַיִּבְנוּ
  choice: ils bâtirent
  rationale: בנה signifie « bâtir ». Le contexte peut évoquer une restauration, mais le verbe n’exprime pas explicitement l’idée de rebâtir.
- source_word: מִזְבַּח
  choice: l’autel
  rationale: Équivalent français précis et usuel pour l’autel sacrificiel.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: du Dieu d’Israël
  rationale: Rend directement et naturellement la construction hébraïque.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: afin d’y offrir des holocaustes
  rationale: Le hiphil de עלה avec עֹלוֹת est une expression sacrificielle. « Offrir des holocaustes » en restitue le sens, tandis que « y » maintient la référence à l’autel.
- source_word: עֹלוֹת
  choice: holocaustes
  rationale: Terme cultuel français consacré pour les sacrifices entièrement consumés par le feu.
- source_word: כַּכָּתוּב
  choice: conformément à ce qui est écrit
  rationale: Cette formule exprime ici que l’action suit une prescription écrite; la formulation française rend clairement cette conformité.
- source_word: תּוֹרַת מֹשֶׁה
  choice: la Loi de Moïse
  rationale: Dans ce contexte de prescriptions sacrificielles écrites, « Loi » exprime naturellement la force de תּוֹרָה, sans épuiser son champ sémantique plus large.
theological_decisions:
- issue: Sens du terme de parenté אחים pour les membres d’un groupe
  choice: ses frères
  alternative: ses proches / ses compagnons
  rationale: Le sens premier est « frères », mais le mot peut désigner des proches ou des associés. La traduction garde le terme concret du texte et signale son extension possible en note.
- issue: Traduction de תּוֹרָה dans une référence cultuelle et juridique
  choice: la Loi de Moïse
  alternative: l’instruction de Moïse / la Torah de Moïse
  rationale: Le contexte souligne la conformité à une prescription sacrificielle écrite. « Loi » est ici clair et idiomatique, tandis qu’une note conserve le sens possible d’« instruction ».
- issue: Apposition אִישׁ הָאֱלֹהִים
  choice: Moïse, l’homme de Dieu
  alternative: Moïse, homme de Dieu
  rationale: L’apposition qualifie Moïse. L’article défini français reflète celui de l’hébreu sans transformer ce titre en affirmation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique écrit; « holocaustes » conserve la terminologie cultuelle précise. La syntaxe a été divisée en deux phrases pour éviter une coordination lourde tout en maintenant les deux groupes comme sujets de la construction de l’autel.
