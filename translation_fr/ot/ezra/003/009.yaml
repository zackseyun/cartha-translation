  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: fr
  text: Alors Yéchoua, ses fils et ses frères, Kadmiel et ses fils, les descendants de Juda[a], ainsi que les descendants de Hénadad, leurs fils et leurs frères, les Lévites, se tinrent tous ensemble pour superviser ceux qui effectuaient les travaux dans la maison de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les fils de Juda ». Certaines versions anciennes et traductions modernes ont : « les descendants de Hodavia ».'
    reason: Variante textuelle
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se tinrent
  rationale: Le verbe עמד signifie concrètement « se tenir » ou « prendre position ». Le pluriel français s’accorde naturellement avec l’ensemble des groupes coordonnés et exprime leur prise de fonction commune.
- source_word: יֵשׁוּעַ
  choice: Josué
  rationale: « Josué » est la forme française traditionnelle et immédiatement reconnaissable du nom hébreu יֵשׁוּעַ dans ce contexte biblique.
- source_word: בָּנָיו וְאֶחָיו
  choice: ses fils et ses frères
  rationale: Cette formulation conserve les termes masculins de parenté explicitement employés dans l’hébreu.
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: Kadmiel et ses fils
  rationale: La coordination simple respecte l’ordre et le parallélisme des groupes familiaux dans le texte source.
- source_word: בְּנֵי יְהוּדָה
  choice: les descendants de Juda
  rationale: Littéralement « les fils de Juda ». Dans une liste de groupes familiaux, « descendants » transmet plus naturellement en français la valeur collective de בְּנֵי sans suggérer nécessairement des fils directs.
- source_word: כְּאֶחָד
  choice: tous ensemble
  rationale: L’expression rend l’action concertée et l’unité du groupe sans employer une tournure française artificielle.
- source_word: לְנַצֵּחַ
  choice: pour superviser
  rationale: Dans ce contexte de travaux, le piel de נצח désigne la direction ou la surveillance des ouvriers, et non une fonction musicale.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: ceux qui effectuaient les travaux
  rationale: Le participe hébreu au singulier a un sens collectif. La formulation française conserve sa nuance verbale tout en rendant clairement le groupe de travailleurs.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: dans la maison de Dieu
  rationale: Cette traduction garde l’expression cultuelle biblique « maison de Dieu » dans une formulation française claire et digne.
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: ainsi que les descendants de Hénadad, leurs fils et leurs frères, les Lévites
  rationale: « Ainsi que » explicite avec sobriété l’inclusion de ce dernier groupe dans l’action commune. « Les Lévites » demeure l’identification appositive finale du texte hébreu.
theological_decisions:
- issue: Incertitude textuelle concernant בְּנֵי יְהוּדָה
  choice: Traduire directement le texte massorétique par « les descendants de Juda »
  alternative: « les descendants de Hodavia »
  rationale: La source fournie porte clairement « Juda ». L’autre lecture, attestée par certaines versions anciennes et retenue dans diverses traductions modernes, est signalée en note plutôt qu’introduite dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La longue coordination du verset hébreu est maintenue, mais organisée par la ponctuation et par « ainsi que ». « Descendants » est préféré à « fils » dans les désignations collectives de lignées, tandis que « fils » est conservé pour les relations familiales directes.
