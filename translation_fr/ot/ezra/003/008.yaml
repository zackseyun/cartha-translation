  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: fr
  text: Au deuxième mois de la deuxième année après leur arrivée à la maison de Dieu, à Jérusalem, Zorobabel, fils de Shaltiel, Josué, fils de Yotsadak, le reste de leurs frères, les prêtres et les lévites, ainsi que tous ceux qui étaient venus de la captivité[a] à Jérusalem, se mirent à commencer et chargèrent les lévites âgés de vingt ans ou plus de superviser les travaux de la maison de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’exil ».'
    reason: Alternative lexicale pour מֵהַשְּׁבִי, qui peut évoquer la captivité ou l’exil.
lexical_decisions:
- source_word: לְבוֹאָם
  choice: après leur arrivée
  rationale: L’infinitif construit avec לְ et le suffixe de troisième personne du pluriel a ici une valeur temporelle. Cette formulation est naturelle en français et conserve le rapport chronologique.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Rendu formel qui préserve l’expression cultuelle de l’hébreu sans expliciter par « temple » ce que le texte désigne comme la maison de Dieu.
- source_word: הֵחֵלּוּ
  choice: se mirent à l’œuvre
  rationale: En hébreu, « commencèrent » reste sans complément exprimé. Le français exige ici une formulation plus idiomatique ; « se mirent à l’œuvre » restitue le commencement de l’activité sans en préciser davantage la nature.
- source_word: וַיַּעֲמִידוּ
  choice: chargèrent
  rationale: Le hiphil de עמד signifie ici placer quelqu’un dans une fonction. « Chargèrent » exprime clairement l’attribution de la responsabilité qui suit.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: âgés de vingt ans ou plus
  rationale: Formulation française actuelle et précise de ce seuil d’âge.
- source_word: לְנַצֵּחַ
  choice: superviser
  rationale: Dans ce contexte de travaux, le verbe désigne une fonction de direction ou de surveillance, et non une fonction musicale.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: les travaux de la maison de Yahvé
  rationale: « Travaux » convient au contexte de reconstruction, tandis que « de la maison » conserve la relation génitive de l’hébreu sans la réduire explicitement à « sur la maison ».
- source_word: מֵהַשְּׁבִי
  choice: de la captivité
  rationale: Le substantif peut désigner l’état ou la communauté de captivité. Le rendu principal reste proche de la forme hébraïque ; « de l’exil » figure en note comme équivalent naturel.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le masculin pluriel explicite de l’hébreu est conservé, les prêtres et les lévites étant présentés en apposition.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle rend le nom divin personnel exprimé directement par le tétragramme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. « Yahvé » le représente directement dans une forme connue des lecteurs francophones, plutôt que de le remplacer par un titre.
- issue: Portée de בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  alternative: le temple de Dieu
  rationale: « Maison de Dieu » respecte la formulation théologique du texte et n’explicite pas davantage le référent cultuel.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent des formes françaises bibliques courantes. La longue période hébraïque est divisée en deux phrases pour assurer la lisibilité, tout en maintenant l’ordre des participants, le seuil d’âge et leur fonction de supervision.
