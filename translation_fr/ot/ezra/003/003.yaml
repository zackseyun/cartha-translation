  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: fr
  text: Ils installèrent l’autel sur ses fondations[a], car ils étaient dans la crainte à cause des peuples des pays. Ils y offrirent[b] à Yahvé des holocaustes, ceux du matin et du soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ses bases » ou « à son emplacement établi ».
    reason: lexical_alternative
  - marker: b
    text: 'Le texte hébreu porte ici un verbe au singulier : « il y offrit » ; le contexte immédiat présente toutefois plusieurs responsables agissant ensemble.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: Ils installèrent
  rationale: Le hiphil de כון exprime ici la mise en place de l’autel afin qu’il soit prêt à servir. « Installèrent » est concret et naturel en français.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français courant de מִזְבֵּחַ dans un contexte sacrificiel.
- source_word: עַל מְכֹנוֹתָיו
  choice: sur ses fondations
  rationale: מְכוֹנוֹתָיו peut désigner ses bases, ses assises ou son emplacement établi. « Sur ses fondations » conserve l’image concrète et suggère la remise en place de l’autel.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת
  choice: car la crainte des peuples des pays environnants pesait sur eux
  rationale: La tournure rend l’expression nominale « une crainte était sur eux » tout en indiquant que les peuples en sont la source. « Environnants » explicite le sens contextuel de הָאֲרָצוֹת sans réduire le pluriel des populations régionales.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: Ils y offrirent des holocaustes
  rationale: Le hiphil de עלה avec עֹלוֹת est l’expression habituelle pour offrir des sacrifices entièrement consumés. « Holocaustes » est le terme biblique français établi; le sujet pluriel suit le groupe déjà actif dans le contexte, malgré la forme verbale singulière du texte massorétique, signalée en note.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La forme française traditionnelle « Yahvé » représente directement le nom divin יהוה plutôt que de le remplacer par un titre.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: des holocaustes, ceux du matin et du soir
  rationale: Cette formulation garde la répétition de עֹלוֹת sous une forme française fluide et précise les deux temps réguliers de l’offrande.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » en donne la forme française usuelle et préserve sa fonction de nom propre.
- issue: Nombre du sujet de וַיַּעַל
  choice: Ils y offrirent
  alternative: Il y offrit
  rationale: La forme massorétique est au singulier, mais le sujet collectif pluriel du contexte immédiat favorise en français la poursuite avec « ils ». La discordance textuelle est conservée dans une note plutôt que passée sous silence.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase hébraïque sur la peur est légèrement réorganisée pour être idiomatique sans supprimer l’image d’un poids qui repose sur eux. « Holocaustes » est retenu dans son sens sacrificiel biblique, malgré les autres associations possibles du mot en français contemporain.
