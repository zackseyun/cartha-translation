source:
  edition: WLC
  text: וְ/רַבִּ֡ים מֵ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֩ וְ/רָאשֵׁ֨י הָ/אָב֜וֹת הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר רָא֜וּ אֶת הַ/בַּ֤יִת הָֽ/רִאשׁוֹן֙ בְּ/יָסְד֔/וֹ זֶ֤ה הַ/בַּ֨יִת֙ בְּ/עֵ֣ינֵי/הֶ֔ם בֹּכִ֖ים בְּ/ק֣וֹל גָּד֑וֹל וְ/רַבִּ֛ים בִּ/תְרוּעָ֥ה בְ/שִׂמְחָ֖ה לְ/הָרִ֥ים קֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: fr
  text: Mais beaucoup de prêtres, de lévites et de chefs de familles ancestrales[a] — les hommes âgés qui avaient vu la première maison[b] — pleuraient à grands cris au moment où l’on posait sous leurs yeux les fondations de cette maison[c], tandis que beaucoup élevaient la voix en poussant des cris de joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne les responsables de groupes familiaux ancestraux ou de clans.
    reason: cultural_note
  - marker: b
    text: Ou « la maison précédente ». L’hébreu dit littéralement « la première maison » et désigne le temple antérieur.
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction : « lorsque cette maison fut fondée sous leurs yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים
  choice: Mais beaucoup
  rationale: La conjonction peut signifier « et », mais « mais » fait ressortir le contraste avec les cris de joie du verset précédent.
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: de prêtres, de lévites et de chefs de familles ancestrales
  rationale: La préposition מִן est partitive après « beaucoup ». « Familles ancestrales » exprime naturellement les groupes familiaux ou claniques désignés par l’hébreu.
- source_word: הַזְּקֵנִים
  choice: les hommes âgés
  rationale: Dans ce contexte, le mot souligne leur âge, puisqu’ils avaient vu le premier temple, plutôt qu’une fonction officielle d’anciens.
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: qui avaient vu la première maison
  rationale: « Maison » conserve le terme hébreu et son lien lexical avec la nouvelle construction, tout en laissant une note préciser qu’il s’agit du temple.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת בְּעֵינֵיהֶם
  choice: au moment où l’on posait sous leurs yeux les fondations de cette maison
  rationale: Cette formulation française rend explicitement la pose des fondations indiquée par יסד et conserve l’image vive de témoins oculaires.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: pleuraient à grands cris
  rationale: L’imparfait rend l’action continue du participe, et l’expression idiomatique française conserve la force de « d’une voix forte ».
- source_word: וְרַבִּים בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: tandis que beaucoup élevaient la voix en poussant des cris de joie
  rationale: « Tandis que » exprime le contraste simultané sans ajouter « d’autres », absent de l’hébreu. La formulation garde à la fois l’élévation de la voix, les acclamations et la joie.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les tirets isolent l’apposition explicative sans transformer « hommes âgés » en titre institutionnel. « Maison » reste en minuscule afin de ne pas introduire une distinction typographique absente de l’hébreu.
