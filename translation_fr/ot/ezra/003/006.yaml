  text: מִ/יּ֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י הֵחֵ֕לּוּ לְ/הַעֲל֥וֹת עֹל֖וֹת לַ/יהוָ֑ה וְ/הֵיכַ֥ל יְהוָ֖ה לֹ֥א יֻסָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: fr
  text: Dès le premier jour du septième mois, ils commencèrent à offrir des holocaustes à Yahweh, et les fondations du temple de Yahweh n’avaient pas encore été posées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais les fondations du temple de Yahweh n’avaient pas encore été posées ». La conjonction hébraïque peut aussi se traduire simplement par « et »; les sacrifices commencèrent avant la pose des fondations du temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Dès le premier jour du septième mois
  rationale: מִן marque ici le point de départ temporel. « Dès » exprime naturellement en français que les offrandes commencèrent à cette date.
- source_word: הֵחֵלּוּ
  choice: ils commencèrent
  rationale: Le hifil exprime le commencement; cette formulation est claire, digne et courante.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: à offrir des holocaustes
  rationale: Dans le contexte sacrificiel, l’expression désigne l’offrande de sacrifices entièrement consumés; « holocaustes » est le terme français biblique précis et encore intelligible.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa fonction dans le texte hébreu.
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahweh
  rationale: הֵיכָל désigne ici le sanctuaire de Jérusalem; « temple » est l’équivalent contextuel naturel.
- source_word: לֹא יֻסָּד
  choice: les fondations ... n’aient pas encore été posées
  rationale: Le passif de יסד renvoie à la pose des fondations. Le pluriel « fondations » est idiomatique en français et explicite le sujet sous-entendu par la tournure hébraïque.
- source_word: וְ
  choice: bien que
  rationale: La conjonction peut être simplement coordinative ou prendre en contexte une valeur adversative ou concessive. « Bien que » fait ressortir que les sacrifices commencèrent avant la pose des fondations, sans modifier la chronologie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve ici le caractère de nom propre de l’alliance sans le remplacer par un titre.
- issue: Rapport logique introduit par וְ
  choice: bien que
  alternative: et; mais
  rationale: 'La relation concessive convient au contexte: le culte sacrificiel débute alors que les fondations ne sont pas encore posées. La note préserve cependant l’ambiguïté réelle de la conjonction hébraïque.'
translation_notes:
  register: Français international moderne, clair et digne. « Dès » restitue le point de départ temporel; « holocaustes » conserve la précision cultuelle. La syntaxe reste naturelle tout en signalant en note l’ambiguïté de la conjonction.
