  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: fr
  text: Alors Tattenaï, gouverneur de la région située au-delà du Fleuve[a], Shethar-Boznaï et leurs collaborateurs agirent exactement ainsi[b], conformément à ce que le roi Darius avait envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Au-delà du Fleuve » était le nom administratif perse de la région située à l’ouest de l’Euphrate.
    reason: cultural_note
  - marker: b
    text: 'Autres traductions possibles : « agirent avec soin » ou « exécutèrent tout avec la plus grande exactitude ». L’expression araméenne souligne leur respect précis de la directive royale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque la succession des événements dans le récit de façon naturelle en français moderne.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gouverneur de la région située au-delà du Fleuve
  rationale: פַּחַת désigne un gouverneur provincial, tandis que עֲבַר נַהֲרָה est une désignation administrative perse. La formulation conserve la perspective impériale sans employer un terme technique français peu transparent.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Shetar-Boznaï
  rationale: Translittération française claire du nom propre araméen, avec tréma pour guider la prononciation de la finale.
- source_word: וּכְנָוָתְהוֹן
  choice: et leurs collaborateurs
  rationale: Le mot désigne les personnes associées à ces responsables dans l’exercice de leur mission officielle; « collaborateurs » convient au cadre administratif.
- source_word: לָקֳבֵל דִּי
  choice: conformément à ce que
  rationale: Rend l’idée de conformité à une directive tout en conservant le caractère non explicité de l’objet envoyé.
- source_word: שְׁלַח
  choice: avait envoyé
  rationale: Le verbe signifie littéralement « envoyer ». Le plus-que-parfait marque naturellement l’antériorité de l’envoi royal par rapport à son exécution.
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: exactement ainsi
  rationale: L’expression adverbiale souligne l’exactitude et le soin avec lesquels l’ordre royal fut respecté; cette traduction s’accorde naturellement avec le verbe général « agir ».
- source_word: עֲבַדוּ
  choice: agirent
  rationale: Le verbe araméen a le sens large de « faire » ou « agir ». Ici, « agirent » évite d’ajouter un complément absent tout en exprimant la mise en œuvre de la directive.
