  text: כִּ֣י הִֽטַּהֲר֞וּ הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם כְּ/אֶחָ֖ד כֻּלָּ֣/ם טְהוֹרִ֑ים וַ/יִּשְׁחֲט֤וּ הַ/פֶּ֨סַח֙ לְ/כָל בְּנֵ֣י הַ/גּוֹלָ֔ה וְ/לַ/אֲחֵי/הֶ֥ם הַ/כֹּהֲנִ֖ים וְ/לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: fr
  text: Car les prêtres et les lévites s’étaient tous purifiés ensemble ; ils étaient tous purs. Ils immolèrent la Pâque[a] pour tous les exilés, pour leurs frères les prêtres et pour eux-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « la Pâque » désigne l’animal offert pour le repas pascal.
    reason: Le nom hébreu peut désigner la fête, le sacrifice ou la victime ; le verbe « immoler » indique ici la victime pascale.
lexical_decisions:
- source_word: כְאֶחָד
  choice: tous… ensemble
  rationale: L’expression signifie littéralement « comme un seul » et souligne ici l’action commune et unanime des prêtres et des lévites ; cette formulation est naturelle en français tout en conservant l’idée d’unité.
- source_word: בְנֵי הַגּוֹלָה
  choice: les exilés
  rationale: Littéralement « les fils de l’exil » ; dans ce contexte, l’expression désigne les membres de la communauté revenue d’exil. « Les exilés » restitue naturellement ce sens collectif sans suggérer qu’ils se trouvent encore nécessairement en exil.
- source_word: הַפֶּסַח
  choice: la Pâque
  rationale: Le terme peut désigner la fête ou l’animal pascal. Avec le verbe « immoler », il s’agit ici de la victime pascale, sens que la note explicite sans alourdir le texte.
- source_word: וַיִּשְׁחֲטוּ
  choice: Ils immolèrent
  rationale: Le verbe désigne l’abattage rituel de l’animal ; « immoler » convient au contexte sacrificiel et au registre biblique moderne.
- source_word: טְהוֹרִים
  choice: purs
  rationale: Le mot exprime ici la pureté rituelle requise pour la célébration, rendue par le terme biblique français courant « purs ».
theological_decisions:
- issue: Sujet de l’immolation de la Pâque
  choice: Conserver les prêtres et les lévites comme sujet grammatical collectif de « immolèrent ».
  alternative: Faire des seuls lévites le sujet implicite, conformément à certaines lectures contextuelles.
  rationale: Le texte massorétique présente explicitement « les prêtres et les lévites » au pluriel, puis enchaîne avec un verbe pluriel sans changement de sujet marqué. La traduction conserve cette structure sans harmonisation.
- issue: Portée de כְאֶחָד
  choice: Rendre l’unité de leur purification par « tous… ensemble ».
  alternative: « comme un seul homme » ou « d’un commun accord ».
  rationale: La formulation choisie préserve l’idée d’unité sans introduire une image genrée absente de l’expression ni transformer l’unité rituelle en accord d’opinion.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’enchaînement causal du verset et le vocabulaire rituel, tout en évitant le calque peu naturel « fils de l’exil ».
