  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
translation:
  language: fr
  text: avec trois assises de pierres de taille[a] et une assise de bois neuf. Que la dépense soit couverte par la maison du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens exact de l’expression araméenne est incertain. On peut aussi comprendre « grosses pierres » ou, plus littéralement, « pierres roulées ».
    reason: lexical_alternative
  - marker: b
    text: La « maison du roi » désigne probablement ici le trésor royal ou les fonds royaux.
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: assises / assise
  rationale: Dans le contexte de la construction, le terme désigne des rangées horizontales de matériaux. « Assise » est le terme architectural français précis et permet de conserver l’opposition entre les trois assises de pierre et l’unique assise de bois.
- source_word: אֶבֶן גְּלָל
  choice: pierres de taille
  rationale: Dans ce contexte architectural, l’expression désigne vraisemblablement des pierres préparées pour la maçonnerie. Son sens exact demeure toutefois discuté; cette incertitude est signalée en note.
- source_word: תְּלָתָא
  choice: trois
  rationale: Le cardinal araméen qualifie le nombre d’assises de pierre.
- source_word: אָע חֲדַת
  choice: bois neuf
  rationale: « Bois » convient naturellement à un matériau de construction, tandis que « neuf » rend explicitement חֲדַת.
- source_word: נִפְקְתָא
  choice: la dépense
  rationale: Le nom désigne le coût ou les frais engagés. « La dépense » conserve le singulier collectif du texte et le registre administratif.
- source_word: מִן בֵּית מַלְכָּא
  choice: par la maison du roi
  rationale: La traduction garde l’expression littérale araméenne, qui désigne probablement ici l’administration financière ou le trésor royal; cette portée contextuelle est expliquée en note.
- source_word: תִּתְיְהִב
  choice: soit couverte
  rationale: La tournure exprime une directive administrative concernant la prise en charge de la dépense. « Que… soit couverte » est idiomatique en français tout en préservant la force prescriptive du passif araméen.
