  text: וּ/מָ֣ה חַשְׁחָ֡ן וּ/בְנֵ֣י תוֹרִ֣ין וְ/דִכְרִ֣ין וְ/אִמְּרִ֣ין לַ/עֲלָוָ֣ן לֶ/אֱלָ֪הּ שְׁמַיָּ֟/א חִנְטִ֞ין מְלַ֣ח חֲמַ֣ר וּ/מְשַׁ֗ח כְּ/מֵאמַ֨ר כָּהֲנַיָּ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לֶהֱוֵ֨א מִתְיְהֵ֥ב לְ/הֹ֛ם י֥וֹם בְּ/י֖וֹם דִּי לָ֥א שָׁלֽוּ׀׀׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: fr
  text: Et tout ce qui est nécessaire — jeunes taureaux, béliers et agneaux pour les holocaustes offerts au Dieu du ciel, blé, sel, vin et huile — devra leur être fourni chaque jour, selon les instructions[a] des prêtres qui sont à Jérusalem, sans qu’il y ait de manque[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la parole des prêtres »; on peut aussi traduire : « selon la demande des prêtres ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sans faute ». La clause souligne que l’approvisionnement quotidien ne doit connaître aucun manque ni aucune omission.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: tout ce qui sera nécessaire
  rationale: L’expression araméenne introduit l’ensemble ouvert des fournitures requises. Cette formulation française rend naturellement le sens administratif de « tout ce qui est nécessaire ».
- source_word: בְנֵי תוֹרִין
  choice: jeunes taureaux
  rationale: Littéralement « fils de bovins », expression désignant de jeunes taureaux destinés ici aux sacrifices.
- source_word: דִכְרִין וְאִמְּרִין
  choice: béliers et agneaux
  rationale: Ces équivalents précis et courants conviennent à l’inventaire sacrificiel.
- source_word: לַעֲלָוָן
  choice: pour les holocaustes offerts
  rationale: Le terme désigne des sacrifices entièrement consumés. L’ajout de « offerts » clarifie en français le rapport avec « au Dieu du ciel » sans modifier le contenu.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: au Dieu du ciel
  rationale: Rend directement le titre divin araméen récurrent dans Esdras.
- source_word: חִנְטִין מְלַח חֲמַר וּמְשַׁח
  choice: blé, sel, vin et huile
  rationale: La liste est rendue terme pour terme; חִנְטִין désigne spécifiquement le blé.
- source_word: כְּמֵאמַר
  choice: selon les instructions
  rationale: Littéralement « selon la parole ». Dans ce contexte administratif, « instructions » exprime naturellement la parole autorisée des prêtres, tout en signalant le littéral en note.
- source_word: יֹום בְּיֹום
  choice: chaque jour
  rationale: Équivalent idiomatique de l’expression distributive « jour après jour ».
- source_word: דִי לָא שָׁלוּ
  choice: sans interruption
  rationale: La clause finale exige que l’approvisionnement ne cesse pas. « Sans interruption » restitue clairement cette continuité en français moderne.
theological_decisions: []
