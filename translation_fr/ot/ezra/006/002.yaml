  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: fr
  text: 'On trouva, à Ecbatane[a], dans la citadelle située dans la province de Médie, un rouleau dans lequel était écrit ce qui suit : Mémorandum[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Achmétha », translittération plus proche du nom araméen d’Ecbatane.
    reason: lexical_alternative
  - marker: b
    text: Ou « document d’archives ». Le terme araméen désigne un écrit officiel servant de rappel ou de pièce d’archives.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: On trouva
  rationale: Le passif araméen exprime la découverte dans les archives. La tournure française avec « on » est naturelle et conserve l'agent indéfini.
- source_word: אַחְמְתָא
  choice: Ecbatane
  rationale: Forme française historique usuelle du nom de la capitale mède; elle est plus reconnaissable qu'une translittération directe de l'araméen.
- source_word: בִּירְתָא
  choice: la citadelle
  rationale: Le terme désigne ici un complexe royal ou administratif fortifié. « Citadelle » convient naturellement à ce lieu sans réduire le sens à un simple palais.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: située dans la province de Médie
  rationale: Cette formulation restitue explicitement la proposition relative et le statut administratif du territoire.
- source_word: מְגִלָּה חֲדָה
  choice: un rouleau
  rationale: Dans ce contexte, חֲדָה sert naturellement d'indéfini; « un rouleau » évite d'accentuer inutilement le nombre.
- source_word: וְכֵן כְּתִיב בְּגַוַּהּ
  choice: sur lequel était écrit
  rationale: La formulation française unit naturellement la localisation de l'inscription sur le rouleau à l'introduction du document, tout en gardant le sens du texte araméen.
- source_word: דִּכְרוֹנָה
  choice: ce mémorandum
  rationale: Dans un contexte administratif et archivistique, le nom désigne une note officielle conservée comme rappel ou pièce d'archives; « mémorandum » rend cette fonction avec précision.
