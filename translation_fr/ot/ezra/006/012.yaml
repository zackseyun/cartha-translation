  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: fr
  text: 'Que le Dieu qui y a fait demeurer son nom renverse tout roi ou tout peuple qui étendrait la main pour changer cela[a] et pour détruire cette maison de Dieu qui est à Jérusalem. Moi, Darius, j’ai donné cet ordre : qu’il soit exécuté avec diligence[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour modifier cette disposition ». Le texte ne précise pas explicitement ce qui serait changé.
    reason: ambiguity
  - marker: b
    text: Ou « sans délai ». Le terme peut souligner la promptitude de l’exécution, ainsi que son caractère diligent.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: a fait demeurer là son nom
  rationale: Préserve le causatif et l’expression biblique du nom divin associé au temple, sans laisser entendre que Dieu y serait spatialement limité.
- source_word: יְמַגַּר
  choice: renverse
  rationale: Rend l’idée d’abattre ou de faire tomber sous le jugement, adaptée à la formule de malédiction royale.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: tout roi ou tout peuple
  rationale: Exprime naturellement en français la portée générale et distributive de la menace.
- source_word: יִשְׁלַח יְדֵהּ
  choice: étendrait la main
  rationale: Conserve la métaphore sémitique d’une intervention hostile tout en restant intelligible en français.
- source_word: לְהַשְׁנָיָה
  choice: pour changer cela
  rationale: Le pronom renvoie de façon quelque peu ouverte à la disposition ou au décret; « cela » conserve cette ambiguïté au lieu de préciser abusivement l’objet.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא
  choice: pour détruire cette maison de Dieu
  rationale: Rend la gravité du verbe dans le contexte d’une attaque contre le temple.
- source_word: שָׂמֶת טְעֵם
  choice: j’ai donné cet ordre
  rationale: Formulation française actuelle et officielle pour l’expression administrative araméenne.
- source_word: אָסְפַּרְנָא
  choice: sans délai
  rationale: Met en relief la promptitude exigée par l’adverbe, tout en laissant en note l’autre nuance possible de diligence.
- source_word: יִתְעֲבִד
  choice: qu’il soit exécuté
  rationale: Le passif à valeur jussive clôt le décret par un ordre autoritaire; « exécuté » convient au référent administratif.
theological_decisions:
- issue: Théologie du nom divin associé au temple
  choice: Conserver l’expression « a fait demeurer là son nom »
  alternative: « a établi là son nom » ou « qui demeure là »
  rationale: La formulation maintient l’expression biblique de l’identification particulière de Dieu avec le temple sans la réduire à une simple propriété ni affirmer que Dieu y serait enfermé.
- issue: Référent de « changer cela »
  choice: Conserver le démonstratif indéterminé « cela »
  alternative: Expliciter « ce décret » ou « cette disposition »
  rationale: Le texte araméen ne nomme pas expressément le référent à cet endroit; la traduction préserve donc son ouverture.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve le ton solennel de la malédiction et de la conclusion impériale, tandis que « maison de Dieu » maintient le vocabulaire concret du texte araméen.
