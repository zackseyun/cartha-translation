  variant: modern international French
source:
  edition: WLC
  text: וְ/הַקְרִ֗בוּ לַ/חֲנֻכַּת֮ בֵּית אֱלָהָ֣/א דְנָה֒ תּוֹרִ֣ין מְאָ֔ה דִּכְרִ֣ין מָאתַ֔יִן אִמְּרִ֖ין אַרְבַּ֣ע מְאָ֑ה וּ/צְפִירֵ֨י עִזִּ֜ין ל/חטיא עַל כָּל יִשְׂרָאֵל֙ תְּרֵֽי עֲשַׂ֔ר לְ/מִנְיָ֖ן שִׁבְטֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: fr
  text: Ils offrirent, pour la dédicace de cette maison de Dieu, cent taureaux, deux cents béliers, quatre cents agneaux et douze boucs en sacrifice pour le péché en faveur de tout Israël[a], selon le nombre des tribus d’Israël.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au nom de tout Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Les douze boucs correspondent aux douze tribus d’Israël et expriment ainsi la portée représentative de ce sacrifice.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: Ils offrirent
  rationale: La forme causative de קרב désigne ici la présentation d’animaux en sacrifice. « Offrirent » est naturel et précis dans ce contexte cultuel.
- source_word: לַחֲנֻכַּת
  choice: pour la dédicace
  rationale: חנכה désigne la dédicace ou l’inauguration d’un édifice; la préposition marque ici la finalité cérémonielle.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: de cette maison de Dieu
  rationale: Cette formulation conserve l’image littérale de la « maison de Dieu » sans la remplacer par « temple ».
- source_word: תּוֹרִין
  choice: taureaux
  rationale: Dans cette liste sacrificielle, le terme désigne des bovins mâles offerts en sacrifice.
- source_word: דִּכְרִין
  choice: béliers
  rationale: Le mot araméen désigne des moutons mâles; « béliers » est le terme français usuel.
- source_word: אִמְּרִין
  choice: agneaux
  rationale: Le terme désigne des agneaux ou de jeunes moutons; « agneaux » convient naturellement à l’inventaire sacrificiel.
- source_word: וּצְפִירֵי עִזִּין
  choice: boucs
  rationale: La locution désigne explicitement des caprins mâles; « boucs » est précis et idiomatique en français.
- source_word: לחטיא
  choice: en sacrifice pour le péché
  rationale: Le terme appartient au vocabulaire sacrificiel du péché ou de la purification. Cette traduction reste intelligible tout en préservant la référence au péché.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: en faveur de tout Israël
  rationale: La préposition exprime ici le bénéfice ou la portée représentative du sacrifice; cette formulation explicite naturellement ce rapport sans réduire l’étendue de « tout Israël ».
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: selon le nombre des tribus d’Israël
  rationale: La phrase relie le nombre de douze boucs à celui des tribus, tout en conservant la structure explicative du texte.
theological_decisions:
- issue: Portée collective de « tout Israël » dans le contexte postexilique
  choice: Conserver « tout Israël » sans le limiter aux seuls exilés revenus.
  alternative: « tous les exilés revenus » ou une explicitation comme « l’ensemble du peuple de l’alliance représenté symboliquement »
  rationale: Le texte dit expressément « tout Israël » et relie les douze boucs aux tribus d’Israël. La traduction maintient cette portée nationale et théologique sans imposer une interprétation historique plus étroite.
- issue: Nature du sacrifice désigné par לחטיא
  choice: « sacrifice pour le péché »
  alternative: « sacrifice de purification »
  rationale: Le terme peut être décrit selon sa relation au péché ou selon sa fonction purificatrice. Le texte principal retient la désignation française traditionnelle et transparente, sans exclure la nuance de purification.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. L’ordre des éléments suit la liste araméenne tout en restant fluide en français.
