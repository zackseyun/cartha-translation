id: EZR.6.11
reference: Ezra 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: fr
  text: 'Et voici le décret que je promulgue : si quelqu’un modifie cet édit, qu’on arrache une poutre[b] de sa maison et qu’il y soit empalé[a] ; puis que sa maison soit transformée en tas d’immondices[c] à cause de cela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il y soit pendu ».'
    reason: alternative_reading
  - marker: b
    text: Le terme peut désigner une poutre, une pièce de bois ou un poteau.
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement : « tas de fumier ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: voici le décret que je promulgue
  rationale: Cette formulation française naturelle conserve l’idée de l’établissement officiel d’un décret par le roi et rend explicitement la provenance exprimée par « de moi ».
- source_word: כָל אֱנָשׁ דִּי
  choice: si quelqu’un
  rationale: L’expression araméenne est générique. « Si quelqu’un » restitue naturellement en français la portée indéfinie de la formule juridique sans limiter son application au sexe masculin.
- source_word: יְהַשְׁנֵא
  choice: modifie
  rationale: Dans ce contexte administratif, le verbe désigne l’action de changer ou d’altérer le texte officiel, plutôt qu’une simple désobéissance.
- source_word: פִּתְגָמָא דְנָה
  choice: cet édit
  rationale: Le nom araméen désigne ici une parole officielle ayant force de décision. « Édit » convient au contexte impérial.
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: qu’on arrache une poutre de sa maison
  rationale: La tournure conserve l’image concrète d’une pièce de bois retirée de la maison du coupable afin de servir à son supplice.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: qu’il y soit empalé
  rationale: La formule décrit un supplice sur la pièce de bois arrachée. « Empalé » correspond bien au contexte pénal ancien, tandis que « pendu » pourrait évoquer à tort une pendaison moderne à la corde.
- source_word: נְוָלוּ
  choice: tas d’immondices
  rationale: Le terme évoque un lieu rendu impur, déshonorant ou couvert de déchets. Cette expression moderne préserve la force infamante de la peine.
- source_word: יִתְעֲבֵד
  choice: soit transformée en
  rationale: Le passif convient à la formule juridique de sanction et indique le sort imposé à la maison.
theological_decisions:
- issue: Nature du supplice dans la formule pénale impériale
  choice: qu’il y soit empalé
  alternative: qu’il y soit pendu
  rationale: L’araméen évoque l’élévation ou la fixation du condamné sur une pièce de bois. Le texte ne permet pas de reconstruire avec certitude tous les détails du supplice ; « empalé » rend le mieux le cadre ancien, tandis que l’autre compréhension est conservée en note.
translation_notes:
  register: Français international moderne, solennel et juridique sans archaïsmes. Les impératifs à la troisième personne (« qu’on arrache », « qu’il soit ») rendent la force exécutoire du décret. La brutalité et le caractère infamant de la sanction sont conservés sans explication doctrinale.
