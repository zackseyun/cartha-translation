source:
  edition: WLC
  text: בֵּ/אדַ֛יִן דָּרְיָ֥וֶשׁ מַלְכָּ֖/א שָׂ֣ם טְעֵ֑ם וּ/בַקַּ֣רוּ בְּ/בֵ֣ית סִפְרַיָּ֗/א דִּ֧י גִנְזַיָּ֛/א מְהַחֲתִ֥ין תַּמָּ֖ה בְּ/בָבֶֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: fr
  text: Alors, le roi Darius promulgua un décret[a], et l’on fit des recherches dans le bâtiment des archives[b], où les trésors[c] étaient entreposés, là, à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « donna un ordre ». L’araméen dit littéralement « établit un décret ou un ordre ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « la maison des livres ou des documents », c’est-à-dire un dépôt officiel d’archives.'
    reason: lexical_alternative
  - marker: c
    text: Le terme peut désigner plus largement des biens précieux ou des objets de valeur conservés en dépôt dans ce bâtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression du récit de façon naturelle en français moderne.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: le roi Darius
  rationale: Suit l’ordre idiomatique français du titre et du nom.
- source_word: שָׂם טְעֵם
  choice: promulgua un décret
  rationale: Rend idiomatiquement l’expression littérale « établir un décret ou un ordre » dans ce contexte royal et administratif.
- source_word: וּבַקַּרוּ
  choice: et l’on fit des recherches
  rationale: Le verbe araméen est à la troisième personne du pluriel sans sujet exprimé; le pronom indéfini « on » en conserve naturellement la valeur impersonnelle.
- source_word: בְּבֵית סִפְרַיָּא
  choice: dans le bâtiment des archives
  rationale: Littéralement « dans la maison des livres ou documents »; l’expression désigne ici le bâtiment où étaient conservés les documents officiels.
- source_word: דִּי
  choice: où
  rationale: Rend la valeur locative du relatif reliant le bâtiment à ce qui y était entreposé.
- source_word: גִנְזַיָּא
  choice: les trésors
  rationale: Conserve le sens premier de biens précieux mis en dépôt sans réduire le terme aux seuls documents.
- source_word: מְהַחֲתִין
  choice: étaient entreposés
  rationale: 'Exprime l’état résultant du participe passif: ces biens avaient été déposés et étaient gardés sur place.'
- source_word: תַּמָּה
  choice: là
  rationale: Conserve l’adverbe locatif explicite de l’araméen, malgré sa légère redondance.
- source_word: בְּבָבֶל
  choice: à Babylone
  rationale: Préposition française normale devant un nom de ville.
