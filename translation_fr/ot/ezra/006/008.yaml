    issue: Ambiguïté possible de « ces anciens juifs ».
    rationale: En français contemporain, la juxtaposition peut être lue comme « anciens [= ex-] juifs ». La construction « anciens des Juifs » désigne sans ambiguïté les chefs de la communauté visés par שָׂבֵי יְהוּדָיֵא.
