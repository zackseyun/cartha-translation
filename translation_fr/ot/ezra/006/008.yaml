source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: fr
  text: 'En outre, je décrète ce que vous devez faire pour ces anciens des Juifs tandis qu’ils reconstruisent cette maison de Dieu : leurs dépenses seront payées sans délai sur les revenus royaux — le tribut perçu en Transeuphratène[a] — afin que les travaux ne soient pas interrompus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Transeuphratène » était la désignation administrative perse des territoires situés à l’ouest de l’Euphrate.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: En outre, je décrète
  rationale: L’expression araméenne désigne l’établissement d’une décision officielle. La tournure active conserve clairement le roi comme locuteur et rend naturellement la force administrative de l’énoncé.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: ces anciens juifs
  rationale: Le syntagme désigne les responsables de la communauté juive. « Anciens » conserve leur fonction communautaire, et « ces » rend le démonstratif.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: tandis qu’ils reconstruisent cette maison de Dieu
  rationale: דֵךְ signifie « cette », et non « votre ». Le contexte porte sur la reprise de la construction ; « reconstruisent » l’exprime clairement sans remplacer « maison de Dieu » par le terme interprétatif « temple ».
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: sur les revenus royaux — le tribut perçu en Transeuphratène
  rationale: נִכְסֵי מַלְכָּא renvoie ici aux ressources du roi, tandis que מִדַּת désigne un tribut ou impôt. La formulation identifie donc le tribut régional comme source des fonds royaux, sans faire à tort de מִדַּת une « province ».
- source_word: אָסְפַּרְנָא
  choice: sans délai
  rationale: Dans ce contexte administratif de versement, le terme exprime une exécution diligente et prompte. « Sans délai » est idiomatique et garde l’accent sur la rapidité requise.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: leurs dépenses seront payées
  rationale: La construction passive exige que les frais du chantier soient fournis à ces hommes. Le possessif évite une répétition lourde tout en maintenant le référent.
- source_word: דִּי לָא לְבַטָּלָא
  choice: afin que les travaux ne soient pas interrompus
  rationale: La proposition finale vise à empêcher tout arrêt. « Les travaux » explicite sobrement l’objet implicite indiqué par le contexte.
