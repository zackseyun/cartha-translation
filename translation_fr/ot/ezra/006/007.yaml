source:
  edition: WLC
  text: שְׁבֻ֕קוּ לַ/עֲבִידַ֖ת בֵּית אֱלָהָ֣/א דֵ֑ךְ פַּחַ֤ת יְהוּדָיֵ/א֙ וּ/לְ/שָׂבֵ֣י יְהוּדָיֵ֔/א בֵּית אֱלָהָ֥/א דֵ֖ךְ יִבְנ֥וֹן עַל אַתְרֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: fr
  text: Laissez se poursuivre les travaux de cette maison de Dieu[a]. Que le gouverneur des Judéens et les anciens des Judéens rebâtissent cette maison de Dieu sur son emplacement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Juifs » au lieu de « des Judéens ». Le terme araméen peut désigner le peuple de Juda selon une dimension ethnique ou régionale.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: Laissez se poursuivre les travaux
  rationale: L’impératif araméen ordonne de ne pas entraver l’activité. Cette formulation française exprime naturellement l’ordre de laisser les travaux continuer, sans suggérer qu’il faudrait les abandonner.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: cette maison de Dieu
  rationale: Le démonstratif désigne le temple précis dont traite le décret; « cette » en conserve la proximité référentielle.
- source_word: פַּחַת
  choice: le gouverneur
  rationale: Le terme désigne un responsable provincial; « gouverneur » est précis sans imposer le titre plus spécifique de satrape.
- source_word: יְהוּדָיֵא
  choice: des Judéens
  rationale: Dans ce contexte administratif perse, le terme peut désigner les habitants ou ressortissants de Juda. « Judéens » garde cette dimension ethnogéographique; la variante traditionnelle est signalée en note.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: et les anciens des Judéens
  rationale: Le mot désigne ici les responsables reconnus de la communauté; « anciens » est le terme français usuel.
- source_word: יִבְנוֹן
  choice: Que … rebâtissent
  rationale: L’imparfait araméen a ici une valeur jussive dans le décret. « Rebâtissent » rend explicitement le contexte de restauration du temple.
- source_word: עַל אַתְרֵהּ
  choice: sur son emplacement
  rationale: Le syntagme indique le lieu propre du temple; « sur son emplacement » convient naturellement à la reconstruction d’un bâtiment.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Laissez se poursuivre les travaux » évite l’ambiguïté de « laissez les travaux », qui pourrait en français signifier les abandonner, tout en conservant la force de l’ordre de non-ingérence.
