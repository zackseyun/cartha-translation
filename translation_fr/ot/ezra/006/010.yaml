  source_fidelity: La relation finale (« afin que »), les deux actions coordonnées, le titre « Dieu du ciel », ainsi que « pour la vie du roi et de ses fils » rendent fidèlement l’araméen. Pour נִיחוֹחִין, le texte évoque directement des odeurs ou senteurs agréables liées au culte; « sacrifices d’une odeur agréable » est une explicitation contextuellement défendable, mais la formulation révisée rend plus clairement le rapport entre les sacrifices et leur odeur sans présenter l’odeur comme une catégorie de sacrifice distincte.
  naturalness: « Afin qu’ils offrent au Dieu du ciel des sacrifices dont l’odeur est agréable » est idiomatique en français international moderne et conserve une syntaxe de but fluide. « Parfum apaisant » est moins juste en français dans ce contexte, car il peut suggérer l’effet du parfum sur les personnes plutôt que la notion cultuelle d’une odeur agréable.
  terminology: « Dieu du ciel », « roi » et « ses fils » sont exacts et cohérents avec le registre d’Esdras. Le maintien de « vie » préserve volontairement l’ambiguïté du terme araméen, dont le sens peut inclure la préservation ou le bien-être.
