language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: fr
  text: afin qu’ils offrent au Dieu du ciel des sacrifices dont l’odeur est agréable[a] et qu’ils prient pour la vie du roi et de ses fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des odeurs agréables ». Le terme araméen évoque l’odeur agréable d’offrandes sacrificielles acceptables.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « pour le bien-être du roi et de ses fils ». Littéralement : « pour la vie du roi et de ses fils ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי
  choice: afin que
  rationale: La particule araméenne introduit ici le but des fournitures royales; « afin que » exprime clairement cette relation.
- source_word: לֶהֱוֺן מְהַקְרְבִין
  choice: qu’ils offrent
  rationale: La forme de « être » suivie du participe prend ici une valeur modale et finale; le verbe קרב désigne, dans ce contexte cultuel, la présentation d’offrandes.
- source_word: נִיחוֹחִין
  choice: des sacrifices d’une odeur agréable
  rationale: Le terme désigne les odeurs agréables associées aux sacrifices acceptables. Cette formulation conserve l’image olfactive tout en rendant explicite en français ce qui produit ces odeurs.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: au Dieu du ciel
  rationale: La préposition ל marque ici le destinataire des offrandes, et « Dieu du ciel » conserve le titre employé dans Esdras.
- source_word: וּמְצַלַּיִן
  choice: et qu’ils prient
  rationale: Le participe coordonné poursuit l’expression du but; « prier » rend directement le sens sans introduire l’idée plus précise d’intercession.
- source_word: לְחַיֵּי
  choice: pour la vie de
  rationale: 'La traduction garde le sens littéral de חַיִּין tout en laissant ouverte sa portée contextuelle possible: conservation de la vie ou bien-être.'
- source_word: מַלְכָּא
  choice: du roi
  rationale: « Roi » correspond au terme araméen ordinaire et respecte la désignation du souverain perse dans le passage.
- source_word: וּבְנוֹהִי
  choice: et de ses fils
  rationale: Le nom araméen désigne spécifiquement les fils; cette précision est conservée plutôt que généralisée en « enfants ».
theological_decisions:
- issue: Expression cultuelle נִיחוֹחִין dans le décret perse
  choice: « des sacrifices d’une odeur agréable »
  alternative: « des odeurs agréables » ou « des sacrifices agréables »
  rationale: La traduction préserve l’image de l’odeur liée aux sacrifices sans la réduire à une notion abstraite d’acceptabilité ni importer une terminologie théologique ultérieure.
- issue: Portée de לְחַיֵּי dans la prière pour le roi
  choice: « pour la vie du roi »
  alternative: « pour le bien-être du roi »
  rationale: Le rendu littéral conserve l’ambiguïté entre la vie, sa préservation et, par extension contextuelle, le bien-être du souverain.
- issue: Désignation de la descendance royale
  choice: « ses fils »
  alternative: « ses enfants »
  rationale: Le texte source emploie un masculin pluriel spécifique; la traduction ne neutralise pas cette donnée.
translation_notes:
  register: Français international moderne, clair et digne. La structure finale « afin que… et que… » rend la relation de but. « Sacrifices d’une odeur agréable » évite l’étrangeté de faire offrir directement des odeurs tout en conservant l’imagerie cultuelle du texte araméen.
