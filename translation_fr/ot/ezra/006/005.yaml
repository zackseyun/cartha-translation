base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: fr
  text: De plus, les objets d’or et d’argent de la maison de Dieu, que Nabuchodonosor a retirés du temple de Jérusalem et emportés à Babylone, devront être rendus et rapportés[a] au temple de Jérusalem, chacun à sa place. Tu les déposeras dans la maison de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils soient rendus, puis qu’ils aillent au temple de Jérusalem, chacun à sa place ». La formulation araméenne correspondant à « et rapportés » est difficile, mais elle ordonne clairement le rétablissement des objets du temple à leur place à Jérusalem.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: De plus
  rationale: Introduit naturellement en français un élément supplémentaire du décret tout en conservant la valeur additive.
- source_word: מָאנֵי
  choice: objets
  rationale: Terme large et courant qui désigne les pièces du mobilier ou les ustensiles consacrés, sans en préciser indûment la fonction.
- source_word: בֵית אֱלָהָא
  choice: la maison de Dieu
  rationale: Conserve l’expression littérale et la distingue de הֵיכְלָא, rendu par « temple ».
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: d’or et d’argent
  rationale: Exprime idiomatiquement en français la matière dont sont faits les objets.
- source_word: הַנְפֵּק
  choice: a retirés
  rationale: Rend le causatif indiquant que Nabuchodonosor les a fait sortir du temple.
- source_word: הֵיכְלָא
  choice: temple
  rationale: Désigne clairement ici le sanctuaire de Jérusalem et maintient la distinction lexicale avec « maison de Dieu ».
- source_word: וְהֵיבֵל
  choice: emportés
  rationale: Exprime naturellement le transport des objets depuis Jérusalem jusqu’à Babylone.
- source_word: יַהֲתִיבוּן
  choice: devront être rendus
  rationale: Restitue la force directive du décret et l’idée de remettre les objets à leur destination antérieure.
- source_word: וִיהָךְ
  choice: et rapportés
  rationale: Dans cette formulation araméenne difficile, ce choix exprime le mouvement vers le temple sans masquer l’incertitude, signalée en note.
- source_word: לְאַתְרֵהּ
  choice: chacun à sa place
  rationale: 'Le singulier suffixé favorise une compréhension distributive : chaque objet retrouve l’emplacement qui lui revient.'
- source_word: וְתַחֵת
  choice: Tu les déposeras
  rationale: Conserve le passage à la deuxième personne masculine singulière et le ton direct du décret.
