  text: וַ/עֲבַ֣דוּ בְנֵֽי יִ֠שְׂרָאֵל כָּהֲנַיָּ֨/א וְ/לֵוָיֵ֜/א וּ/שְׁאָ֣ר בְּנֵי גָלוּתָ֗/א חֲנֻכַּ֛ת בֵּית אֱלָהָ֥/א דְנָ֖ה בְּ/חֶדְוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: fr
  text: Les Israélites, les prêtres, les lévites et le reste des exilés célébrèrent avec joie la dédicace de cette maison de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: célébrèrent
  rationale: Dans ce contexte cérémoniel, le verbe signifie accomplir ou observer la dédicace. « Célébrèrent » exprime naturellement en français l’action associée à cette cérémonie.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation moderne et naturelle rend l’expression littérale « les fils d’Israël » sans suggérer que seuls les hommes sont concernés.
- source_word: כָּהֲנַיָּא
  choice: les prêtres
  rationale: Équivalent français courant du terme désignant la classe sacerdotale.
- source_word: וְלֵוָיֵא
  choice: les lévites
  rationale: Désignation française habituelle des membres du groupe lévitique attaché au service du temple.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: et tous les autres exilés
  rationale: Littéralement « et le reste des fils de l’exil ». La formulation retenue indique clairement les autres membres de la communauté exilée, au-delà des prêtres et des lévites, sans alourdir la phrase.
- source_word: חֲנֻכַּת
  choice: la dédicace
  rationale: Le nom désigne ici l’acte cérémoniel par lequel la maison de Dieu est inaugurée et consacrée à son usage.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: cette maison de Dieu
  rationale: Rend directement l’expression araméenne et conserve l’appellation biblique « maison de Dieu » plutôt que de l’expliciter par « temple ».
- source_word: בְחֶדְוָה
  choice: avec joie
  rationale: Traduction directe, claire et idiomatique de la préposition suivie du nom « joie ».
