  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: fr
  text: Les fils d’Israël[a] revenus de l’exil mangèrent, ainsi que tous ceux qui s’étaient séparés de l’impureté[b] des peuples du pays pour se joindre à eux[c] et chercher Yahvé, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « de la souillure des peuples du pays ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « vers eux » ou « à eux » ; c’est-à-dire qu’ils se sont rattachés à la communauté revenue d’exil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: mangèrent
  rationale: Le verbe signifie simplement « manger ». L’objet, le repas pascal, ressort du verset précédent et n’a pas besoin d’être ajouté.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque tout en désignant collectivement le peuple d’Israël, sans limiter les participants aux hommes.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: revenus de l’exil
  rationale: Le participe désigne ceux qui étaient rentrés d’exil ; « exil » est naturel et précis dans ce contexte.
- source_word: וְכֹל הַנִּבְדָּל
  choice: ainsi que tous ceux qui s’étaient séparés
  rationale: Le participe nifal décrit un groupe supplémentaire qui s’était mis à part. « Ainsi que » indique naturellement sa participation au repas.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: de l’impureté des peuples du pays
  rationale: « Impureté » garde les résonances rituelles et morales de טֻמְאָה ; le pluriel « peuples » respecte גּוֹיֵי.
- source_word: אֲלֵהֶם
  choice: pour se joindre à eux
  rationale: Littéralement « vers eux » ou « à eux » ; dans la phrase, l’expression indique le rattachement aux Israélites revenus d’exil.
- source_word: לִדְרֹשׁ
  choice: rechercher
  rationale: Le verbe exprime ici le fait de se tourner avec ferveur vers Dieu. « Rechercher » préserve ce sens large sans le réduire au seul culte ou à la consultation.
- source_word: לַיהוָה
  choice: Yahvé
  rationale: La forme française « Yahvé » représente directement le nom divin יהוה et convient à une traduction source-grounded.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction hébraïque, qui conserve l’identification covenantale.
theological_decisions:
- issue: Identité des participants supplémentaires à la Pâque
  choice: 'La description reste générale : ce sont tous ceux qui se sont séparés de l’impureté des peuples du pays et se sont joints aux Israélites revenus d’exil.'
  alternative: Les identifier expressément soit comme des prosélytes issus des peuples environnants, soit comme des Israélites restés dans le pays.
  rationale: L’hébreu ne précise pas leur origine ethnique et ne les appelle pas explicitement des convertis. La traduction évite donc de trancher entre ces possibilités.
- issue: Portée de אֲלֵהֶם
  choice: pour se joindre à eux
  alternative: à eux / vers eux
  rationale: La formulation explicite la relation indiquée par le complément hébreu tout en signalant en note sa forme littérale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure proche de l’hébreu tout en restant fluide ; les notes conservent les principales alternatives lexicales et l’ambiguïté sur l’identité du second groupe.
