  text: וַ/הֲקִ֨ימוּ כָהֲנַיָּ֜/א בִּ/פְלֻגָּתְ/ה֗וֹן וְ/לֵוָיֵ/א֙ בְּ/מַחְלְקָ֣תְ/ה֔וֹן עַל עֲבִידַ֥ת אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם כִּ/כְתָ֖ב סְפַ֥ר מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: fr
  text: Ils établirent les prêtres selon leurs divisions et les lévites selon leurs groupes[a], pour le service de Dieu à Jérusalem, conformément à ce qui est écrit dans le livre de Moïse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les deux noms araméens désignent des unités d’organisation très proches ; on pourrait aussi traduire dans les deux cas par « divisions ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « selon l’écrit du livre de Moïse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: Ils établirent
  rationale: Le causatif de קום signifie faire tenir debout, mettre en place ou établir. « Établirent » exprime ici naturellement l’affectation ordonnée du personnel cultuel.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: selon leurs divisions
  rationale: Le nom désigne des unités organisées ou des sections de service. « Divisions » conserve cette idée sans recourir au terme traditionnel mais moins transparent de « classes ».
- source_word: בְּמַחְלְקָתְהוֹן
  choice: selon leurs groupes
  rationale: Ce terme désigne lui aussi des groupements organisés. « Groupes » rend la proximité sémantique avec le terme précédent tout en préservant la variation lexicale de l’araméen.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: pour le service de Dieu
  rationale: La préposition עַל peut marquer ici l’affectation à une responsabilité. « Pour le service de Dieu » est idiomatique et maintient le cadre cultuel sans explicitation excessive.
- source_word: דִּי בִירוּשְׁלֶם
  choice: à Jérusalem
  rationale: La relative araméenne rattache le service de Dieu à Jérusalem. En français, la formulation condensée est plus naturelle et ne change pas le référent.
- source_word: כִּכְתָב סְפַר מֹשֶׁה
  choice: conformément à ce qui est écrit dans le livre de Moïse
  rationale: La tournure exprime la conformité à une autorité écrite. Cette traduction française explicite sobrement ce rapport normatif tout en conservant l’appellation « livre de Moïse ».
theological_decisions:
- issue: Rapport entre l’organisation cultuelle et l’autorité mosaïque écrite
  choice: L’organisation des prêtres et des lévites est présentée comme conforme à ce qui est écrit dans le livre de Moïse.
  alternative: Comprendre la phrase comme une simple description d’un usage traditionnel, sans portée normative explicite.
  rationale: La proposition finale rattache expressément l’organisation au document mosaïque. La traduction conserve ce lien sans tirer de conclusions supplémentaires sur le canon ou la composition du livre.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La variation « divisions / groupes » reproduit la variation lexicale de l’araméen, tandis que la note signale leur proximité sémantique.
