  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: fr
  text: Cette maison fut achevée au plus tard le troisième jour du mois d’Adar[a], dans la sixième année du règne du roi Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le troisième jour du mois d’Adar ». La tournure araméenne peut indiquer le terme auquel les travaux furent achevés.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: fut achevée
  rationale: Le verbe araméen exprime ici l’achèvement de l’édifice. Le passif maintient l’accent sur la maison plutôt que sur les bâtisseurs.
- source_word: בַּיְתָה דְנָה
  choice: cette maison
  rationale: Traduction littérale de l’araméen. Dans le contexte d’Esdras, « maison » désigne clairement le temple tout en préservant le vocabulaire source.
- source_word: עַד יוֹם תְּלָתָה
  choice: le troisième jour
  rationale: Dans cette formule chronologique, עַד peut désigner le terme auquel l’achèvement est atteint. Le français date naturellement l’événement « le troisième jour »; la nuance possible « au plus tard le troisième jour » est signalée en note.
- source_word: לִירַח אֲדָר
  choice: du mois d’Adar
  rationale: Rendu direct et idiomatique de la désignation araméenne du mois.
- source_word: דִּי הִיא שְׁנַת שֵׁת
  choice: dans la sixième année
  rationale: La proposition relative araméenne relie la date à l’année de règne. En français, « dans la sixième année » donne une formule chronologique naturelle sans surtraduire le pronom féminin.
- source_word: לְמַלְכוּת
  choice: du règne de
  rationale: Dans cette formule de datation, le nom désigne l’exercice du pouvoir royal et donc l’année de règne.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: du roi Darius
  rationale: Ordre naturel en français, avec maintien explicite du titre royal présent dans l’araméen.
