  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: fr
  text: Ils célébrèrent avec joie la fête des Pains sans levain pendant sept jours, car Yahweh les avait réjouis et avait tourné vers eux le cœur du roi d’Assyrie[a], pour fortifier leurs mains dans l’œuvre de la maison de Dieu, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu dit « roi d’Assyrie ». Bien que le souverain de cette époque soit perse, cette ancienne désignation impériale peut ici évoquer son autorité sur les territoires autrefois assyriens.
    reason: Note historique préservant la désignation inhabituelle du texte source.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ חַג מַצּוֹת
  choice: Ils célébrèrent … la fête des Pains sans levain
  rationale: Avec une fête pour complément, עשה signifie idiomatiquement célébrer ou observer. « Célébrèrent » est naturel en français et le nom traditionnel de la fête reste reconnaissable.
- source_word: שִׁבְעַת יָמִים בְּשִׂמְחָה
  choice: avec joie … pendant sept jours
  rationale: La formulation française place naturellement « avec joie » près du verbe et exprime explicitement la durée par « pendant ».
- source_word: כִּי שִׂמְּחָם
  choice: car Yahweh les avait réjouis
  rationale: Le piel de שׂמח avec suffixe objet exprime que Yahweh leur a fait éprouver de la joie. « Les avait réjouis » conserve cette valeur causative ainsi que l’écho lexical avec « joie ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וְהֵסֵב לֵב … עֲלֵיהֶם
  choice: et avait tourné vers eux le cœur…
  rationale: Cette traduction conserve l’image hébraïque d’un cœur dont Dieu réoriente les dispositions, sans expliciter davantage la nature de cette faveur.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Le texte hébreu porte explicitement ce titre; il ne convient pas de le remplacer par « roi de Perse » pour harmoniser le passage avec son contexte historique.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: afin de les soutenir
  rationale: Littéralement, l’expression signifie « fortifier leurs mains ». « Les soutenir » restitue en français courant l’idée d’apporter force, appui et moyens d’agir.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: dans les travaux de la maison de Dieu
  rationale: « Travaux » convient au contexte de la reconstruction et « maison de Dieu » préserve la désignation concrète du sanctuaire.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin; sa translittération préserve cette distinction sans le remplacer par un titre.
- issue: Désignation historique « roi d’Assyrie » à l’époque perse
  choice: Conserver « le roi d’Assyrie » dans le texte
  alternative: le roi de Perse
  rationale: La formulation explicite du texte source est maintenue. L’écart apparent avec le cadre perse est signalé en note plutôt que résolu dans la traduction.
- issue: Agent implicite de לְחַזֵּק יְדֵיהֶם
  choice: afin de les soutenir
  alternative: afin qu’il fortifie leurs mains
  rationale: L’infinitif hébreu exprime le résultat ou le but de l’action divine sans devoir préciser en français si le soutien est envisagé directement comme l’œuvre de Dieu ou comme l’effet de la disposition favorable du roi. La formulation retenue évite de surdéterminer cet agent.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste proche du mouvement causal de l’hébreu, tandis que l’idiome « fortifier leurs mains » est rendu par le naturel « les soutenir ». Le marqueur [a] figure immédiatement après l’expression qu’il explique.
