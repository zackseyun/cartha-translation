  text: בִּ/שְׁנַ֨ת חֲדָ֜ה לְ/כ֣וֹרֶשׁ מַלְכָּ֗/א כּ֣וֹרֶשׁ מַלְכָּ/א֮ שָׂ֣ם טְעֵם֒ בֵּית אֱלָהָ֤/א בִֽ/ירוּשְׁלֶם֙ בַּיְתָ֣/א יִתְבְּנֵ֔א אֲתַר֙ דִּֽי דָבְחִ֣ין דִּבְחִ֔ין וְ/אֻשּׁ֖וֹ/הִי מְסֽוֹבְלִ֑ין רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֥ין שִׁתִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: fr
  text: 'La première année du règne du roi Cyrus, Cyrus le roi promulgua ce décret : « Quant à la maison de Dieu à Jérusalem, que cette maison soit reconstruite comme lieu où l’on offre des sacrifices, et que ses fondations soient posées[a]. Elle aura soixante coudées de haut et soixante coudées de large. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que ses fondations soient maintenues » ou « élevées ». L’expression araméenne est difficile, et son interprétation varie.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: promulgua ce décret
  rationale: L’expression administrative araméenne signifie littéralement « établir un décret ». « Promulguer un décret » restitue naturellement le caractère officiel de la décision royale.
- source_word: בֵּית אֱלָהָא
  choice: la maison de Dieu
  rationale: Cette traduction conserve l’image littérale de la « maison », reprise immédiatement dans le texte, tout en désignant clairement le temple dans ce contexte.
- source_word: יִתְבְּנֵא
  choice: que cette maison soit reconstruite
  rationale: La forme verbale passive prend ici une valeur injonctive dans le décret. Le verbe signifie simplement « être construit », mais « reconstruite » explicite à juste titre la restauration de l’édifice détruit.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: le lieu où l’on offre des sacrifices
  rationale: L’araméen emploie une tournure avec verbe et nom de même racine, littéralement proche de « où l’on sacrifie des sacrifices ». La formulation française évite cette lourdeur sans perdre le sens cultuel.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: et que ses fondations soient posées
  rationale: La construction araméenne est difficile et son interprétation incertaine. Dans ces prescriptions architecturales, « soient posées » donne un sens cohérent, tandis qu’une note conserve les principales autres possibilités.
- source_word: רוּמֵהּ
  choice: soixante coudées de haut
  rationale: Le nom désigne la hauteur. Cette formulation est plus naturelle en français architectural que « sa hauteur sera de ».
- source_word: אַמִּין שִׁתִּין
  choice: soixante coudées
  rationale: La coudée est l’unité ancienne du texte. La conserver évite une conversion moderne nécessairement approximative.
- source_word: פְּתָיֵהּ
  choice: soixante coudées de large
  rationale: Le terme désigne la largeur. La tournure coordonnée avec « de haut » est claire et idiomatique en français moderne.
