  text: וַ/יַּעֲשׂ֥וּ בְנֵי הַ/גּוֹלָ֖ה אֶת הַ/פָּ֑סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/019.yaml
  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: fr
  text: Les exilés[a] célébrèrent la Pâque le quatorzième jour du premier mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’exil » ; l’expression peut aussi se rendre par « les membres de la communauté des exilés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: célébrèrent
  rationale: Avec « la Pâque » pour complément, le verbe « faire » désigne idiomatiquement l’accomplissement de cette célébration rituelle. « Célébrèrent » est naturel en français et conserve ce sens sans réduire la Pâque au seul sacrifice.
- source_word: בְנֵי הַגּוֹלָה
  choice: les exilés
  rationale: L’expression signifie littéralement « les fils de l’exil », mais fonctionne comme une désignation collective de la communauté issue de l’exil. « Les exilés » rend ce sens en français courant sans laisser entendre qu’il s’agit uniquement d’hommes.
- source_word: הַפָּסַח
  choice: la Pâque
  rationale: « La Pâque » est la désignation française habituelle de cette observance et laisse ouverte sa portée rituelle globale, sans préciser indûment le sacrifice ou le repas.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: le quatorzième jour
  rationale: Dans cette formule de datation, le français explicite naturellement « jour », sous-entendu dans l’hébreu.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: du premier mois
  rationale: Cette formulation complète naturellement la date et suit de près la construction hébraïque.
