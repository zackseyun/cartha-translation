revisions:
- from: Les anciens des Juifs poursuivaient la construction, et leurs travaux avançaient[a] grâce aux prophéties du prophète Aggée et de Zacharie, fils d’Iddo. Ils bâtirent et achevèrent l’ouvrage sur l’ordre[b] du Dieu d’Israël et sur l’ordre de Cyrus, de Darius et d’Artaxerxès, roi de Perse.[c]
  to: Les anciens des Juifs bâtissaient et prospéraient[a] grâce à la prophétie d’Aggée, le prophète, et de Zacharie, fils d’Iddo. Ils bâtirent et achevèrent l’ouvrage sur l’ordre[b] du Dieu d’Israël et sur l’ordre de Cyrus, de Darius et d’Artaxerxès, roi de Perse.[c]
  rationale: La révision rétablit le singulier collectif de « prophétie », rend plus directement les participes araméens par « bâtissaient et prospéraient », et affine la note lexicale sur « ordre ». Elle conserve les deux verbes finaux, ainsi que la double attribution à l’ordre du Dieu d’Israël et aux ordres des souverains perses, sans résoudre leur rapport théologique.
