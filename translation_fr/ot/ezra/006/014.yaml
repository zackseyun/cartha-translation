  terminology: « Les anciens des Juifs », « le Dieu d’Israël », « Aggée », « Zacharie », « Iddo » et « Artaxerxès » sont appropriés. « Ordre » est un rendu recevable de טְעֵם dans ce contexte; la note propose correctement « décret » comme variante.
