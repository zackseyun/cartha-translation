  - severity: low
    issue: « poursuivaient la construction » ajoute l’idée de continuation.
    rationale: Le participe בָּנַיִן signifie directement « bâtissaient / étaient en train de bâtir ». « Bâtissaient » est plus proche et tout aussi idiomatique.
  - severity: low
