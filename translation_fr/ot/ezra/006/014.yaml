  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: fr
  text: Les anciens des Juifs bâtissaient et prospéraient[a] grâce à la prophétie d’Aggée, le prophète, et de Zacharie, fils d’Iddo. Ils bâtirent et achevèrent l’ouvrage sur l’ordre[b] du Dieu d’Israël et sur l’ordre de Cyrus, de Darius et d’Artaxerxès, roi de Perse.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réussissaient » ou « avançaient ».
    reason: lexical_alternative
  - marker: b
    text: Ou « conformément au décret de ».
    reason: lexical_alternative
  - marker: c
    text: Le texte attribue l’achèvement à la fois à l’ordre de Dieu et aux ordres des souverains perses, en nommant d’abord celui de Dieu.
    reason: theological_tension
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: les anciens des Juifs
  rationale: Rend distinctement la fonction communautaire des anciens et la désignation ethnique, sans la réduire au seul territoire de Juda.
- source_word: בָּנַיִן וּמַצְלְחִין
  choice: poursuivaient la construction, et leurs travaux avançaient
  rationale: Les participes expriment une action en cours. Cette formulation française naturelle conserve à la fois l’activité de bâtir et l’idée de réussite ou de progrès.
- source_word: בִּנְבוּאַת
  choice: grâce aux prophéties
  rationale: La préposition marque ici le moyen; « grâce à » exprime naturellement le rôle moteur du ministère prophétique. Le pluriel français convient aux interventions prophétiques des deux hommes sans modifier le sens collectif du singulier araméen.
- source_word: חַגַּי נביאה וּזְכַרְיָה בַּר עִדּוֹא
  choice: du prophète Aggée et de Zacharie, fils d’Iddo
  rationale: Conserve le titre explicitement attaché à Aggée et rend normalement le marqueur filial araméen בַּר.
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: Ils bâtirent et achevèrent l’ouvrage
  rationale: Conserve les deux verbes coordonnés du texte araméen plutôt que de les fondre en un seul, tout en explicitant sobrement l’objet déjà évident dans le contexte.
- source_word: מִן טַעַם
  choice: sur l’ordre de
  rationale: טְעֵם désigne ici un ordre, commandement ou décret autorisant les travaux. « Sur l’ordre de » fonctionne naturellement pour Dieu comme pour les rois et préserve la répétition structurelle.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct du titre génitival.
- source_word: כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: Cyrus, de Darius et d’Artaxerxès
  rationale: Emploie les formes françaises usuelles des noms des souverains perses et maintient la coordination du texte.
- source_word: מֶלֶךְ פָּרָס
  choice: roi de Perse
  rationale: Le singulier appose grammaticalement ce titre au dernier nom, Artaxerxès; la traduction ne l’étend donc pas explicitement aux trois souverains.
theological_decisions:
- issue: Rapport entre l’autorité divine et l’autorité impériale
  choice: Attribuer l’achèvement à l’ordre du Dieu d’Israël puis à celui des rois perses, en maintenant les deux niveaux d’autorisation.
  alternative: Présenter les ordres royaux comme de simples expressions subordonnées de la volonté divine.
  rationale: Le verset nomme d’abord l’ordre de Dieu, puis les décisions impériales, sans expliquer leur articulation théologique. La traduction conserve cette tension.
- issue: Portée du titre singulier « roi de Perse »
  choice: Rattacher formellement le titre à Artaxerxès, conformément à la syntaxe immédiate.
  alternative: Employer le pluriel « rois de Perse » pour qualifier Cyrus, Darius et Artaxerxès ensemble.
  rationale: Le texte araméen porte un singulier après le dernier nom. Même si les trois hommes sont historiquement des rois perses, il convient de préserver la forme du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Poursuivaient la construction » évite une tournure progressive calquée sur l’anglais; « leurs travaux avançaient » rend idiomatiquement la réussite du chantier. Les deux verbes araméens de construction et d’achèvement sont conservés.
