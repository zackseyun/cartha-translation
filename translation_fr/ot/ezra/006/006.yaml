  text: כְּעַ֡ן תַּ֠תְּנַי פַּחַ֨ת עֲבַֽר נַהֲרָ֜/ה שְׁתַ֤ר בּוֹזְנַי֙ וּ/כְנָוָ֣תְ/ה֔וֹן אֲפַרְסְכָיֵ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה רַחִיקִ֥ין הֲו֖וֹ מִן תַּמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: fr
  text: Maintenant, Tattenaï, gouverneur de la Transeuphratène, Shetar-Boznaï et leurs associés, les Apharsakites qui se trouvent en Transeuphratène, restez loin de là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: Maintenant
  rationale: Marqueur discursif araméen qui introduit ici la directive royale. « Maintenant » conserve la transition sans lui donner une valeur causale plus précise que ne l’exige le texte.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gouverneur de la Transeuphratène
  rationale: פַּחַת désigne un gouverneur provincial, et עֲבַר נַהֲרָה est l’appellation administrative perse du territoire situé à l’ouest de l’Euphrate. « Transeuphratène » rend ce nom administratif de façon concise en français.
- source_word: וּכְנָוָתְהוֹן
  choice: et leurs collègues
  rationale: 'Le nom désigne des compagnons ou collègues, et le suffixe araméen הוֹן est à la troisième personne du pluriel : « leurs », en référence aux deux responsables nommés.'
- source_word: אֲפַרְסְכָיֵא
  choice: les Afarsakites
  rationale: Le sens exact de ce terme administratif ou gentilé est incertain. La translittération préserve cette incertitude plutôt que d’introduire directement « fonctionnaires perses », interprétation possible mais non assurée.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: restez loin de là
  rationale: La tournure araméenne, littéralement « soyez éloignés de là », fonctionne comme un ordre. « Restez loin de là » en restitue naturellement la force en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres sont translittérés selon des formes lisibles en français. Le terme administratif incertain אֲפַרְסְכָיֵא est conservé sous forme de gentilé et expliqué en note, afin de ne pas transformer une interprétation probable en certitude.
