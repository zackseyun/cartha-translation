  rationale: Révision limitée à une translittération plus établie du terme administratif incertain et à un équivalent français plus large pour « associés ». Le texte conserve la troisième personne (« leurs associés »), conformément à l’araméen, sans suivre sur ce point l’audit anglais, dont l’analyse du suffixe est erronée.
