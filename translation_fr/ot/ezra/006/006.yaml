    rationale: « Apharsakites » est la forme française savante plus reconnaissable et plus proche de la translittération traditionnelle du terme araméen incertain.
  - severity: low
    issue: « collègues » pour וּכְנָוָתְהוֹן
    rationale: Le terme désigne plus largement des associés ou compagnons. « Associés » préserve cette portée sans supposer une relation professionnelle précise.
