review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle à l’araméen : directive royale adressée à Tattenaï, Shetar-Boznaï et à leurs associés, avec l’ordre de se tenir éloignés. Le suffixe de וּכְנָוָתְהוֹן est bien de troisième personne plurielle (« leurs »), contrairement à la décision de l’audit anglais qui propose « your associates ». « Transeuphratène » rend adéquatement la désignation administrative d’au-delà du Fleuve. La translittération « Afarsakites » devrait toutefois être harmonisée avec la forme savante usuelle « Apharsakites », qui reflète mieux l’appellation traditionnelle tout en laissant le terme non interprété.'
  naturalness: La phrase est claire et d’un registre approprié. « Restez loin de là » transmet naturellement l’impératif araméen. « Associés » est plus neutre et plus proche de « compagnons/associés » que « collègues », lequel risque de restreindre indûment la relation à des collègues de bureau.
  terminology: « Tattenaï », « Shetar-Boznaï » et « Transeuphratène » conviennent au français moderne dans un cadre biblique et historique. « Apharsakites » est préférable à « Afarsakites » pour ce gentilé ou titre administratif incertain. La note doit conserver l’incertitude sans identifier catégoriquement le groupe à des fonctionnaires perses.
