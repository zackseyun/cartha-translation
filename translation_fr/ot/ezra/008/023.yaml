base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/023.yaml
  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: fr
  text: Nous avons donc jeûné et adressé à notre Dieu une demande à ce sujet, et il nous a exaucés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il s’est laissé supplier par nous » ; autre traduction possible : « il a répondu favorablement à notre prière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: nous avons jeûné
  rationale: Le verbe צום décrit directement l’action collective de jeûner; rien n’impose ici l’idée plus précise de proclamer un jeûne.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: adressé à notre Dieu une demande
  rationale: Dans cette construction avec מִן et dans un contexte de prière, בקשׁ exprime une requête faite à Dieu. Cette formulation française rend naturellement la relation indiquée par la préposition sans donner à entendre qu’ils cherchaient Dieu lui-même.
- source_word: עַל זֹאת
  choice: à ce sujet
  rationale: L’expression renvoie à l’affaire mentionnée dans le contexte; « à ce sujet » conserve ce lien de manière claire et idiomatique.
- source_word: וַיֵּעָתֵר לָנוּ
  choice: il nous a exaucés
  rationale: Le niphal de עתר exprime ici une réponse favorable à une supplication. « Exaucer » est naturel en français biblique moderne et conserve cette nuance favorable, tandis que לָנוּ est rendu par « nous ».
theological_decisions:
- issue: Portée de la réponse divine exprimée par וַיֵּעָתֵר
  choice: il nous a exaucés
  alternative: il s’est laissé fléchir par nos supplications / il a répondu à notre prière
  rationale: Le verbe indique que Dieu accueille favorablement la requête, sans préciser davantage la forme de son intervention. « Exaucés » garde ce sens sans ajouter de résultat absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase explicite l’objet implicite de בקשׁ par « une demande » afin d’éviter l’ambiguïté peu naturelle de « chercher auprès de notre Dieu », tout en préservant la référence de עַל זֹאת.
