source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה אֲלֵ/הֶ֗ם אַתֶּ֥ם קֹ֨דֶשׁ֙ לַ/יהוָ֔ה וְ/הַ/כֵּלִ֖ים קֹ֑דֶשׁ וְ/הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ נְדָבָ֔ה לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: fr
  text: 'Je leur dis : « Vous êtes consacrés à Yahweh[a], et les objets sont consacrés ; l’argent et l’or sont une offrande volontaire à Yahweh, le Dieu de vos pères. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh représente le nom divin écrit יהוה (YHWH) en hébreu.
    reason: Informer le lecteur que « Yahweh » traduit le nom propre de Dieu plutôt qu’un titre.
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Je leur dis
  rationale: Le wayyiqtol de אמר poursuit le récit et introduit les paroles directes d’Esdras. Le passé simple convient au registre narratif français.
- source_word: קֹדֶשׁ לַיהוָה
  choice: consacrés à Yahweh
  rationale: קֹדֶשׁ exprime ici un état de sainteté cultuelle, c’est-à-dire la mise à part et l’appartenance à Yahweh. « Consacrés à » rend ce sens plus naturellement que « saints pour » en français moderne.
- source_word: הַכֵּלִים
  choice: les objets
  rationale: Dans ce contexte, כֵּלִים désigne les objets sacrés destinés au service du temple. « Objets » reste clair sans limiter indûment le terme à des récipients ou à des ustensiles particuliers.
- source_word: קֹדֶשׁ
  choice: consacrés
  rationale: La répétition de « consacrés » maintient le parallélisme hébreu entre les personnes et les objets et souligne leur statut commun de choses mises à part.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: l’argent et l’or
  rationale: Cette formulation reproduit les deux substantifs définis tout en étant idiomatique en français.
- source_word: נְדָבָה
  choice: une offrande volontaire
  rationale: נְדָבָה désigne un don offert librement. « Offrande volontaire » exprime à la fois son caractère cultuel et l’absence de contrainte.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: La formule conserve le masculin pluriel du texte et son écho à la relation ancestrale d’Israël avec son Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin, et non un simple titre. « Yahweh » le représente directement en français et distingue ce nom du titre אֲדֹנָי.
- issue: Sens cultuel de קֹדֶשׁ appliqué aux personnes et aux objets
  choice: consacrés
  alternative: saints ; sacrés
  rationale: Ici, la sainteté comporte l’idée d’être mis à part pour Yahweh. « Consacrés » rend clairement cette relation sans suggérer une qualité morale intrinsèque et conserve le parallélisme entre les personnes et les objets.
- issue: Formule ancestrale אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  alternative: le Dieu de vos ancêtres
  rationale: « Pères » reflète la forme masculine du texte et conserve la formule biblique de l’alliance, sans exclure que les ancêtres au sens plus large appartiennent à l’arrière-plan historique.
translation_notes:
  register: 'Français moderne, digne et accessible. Le passé simple soutient le récit écrit. La répétition de « consacrés » est volontaire : elle préserve le parallélisme emphatique de l’hébreu. « Objets » est préféré à « vases », trop restrictif en français contemporain.'
