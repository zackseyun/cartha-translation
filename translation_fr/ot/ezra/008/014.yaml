  yaml_path: translation/ot/ezra/008/014.yaml
  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: fr
  text: 'Et parmi les fils de Bigvaï : Outaï et Zabboud[b] ; avec lui[a], soixante-dix hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « avec lui », au singulier, bien que deux noms viennent d’être mentionnés. Certaines traductions emploient « avec eux ».
    reason: lexical_alternative
  - marker: b
    text: Certaines traditions textuelles et versions anciennes donnent ici un autre nom ; le texte massorétique porte « Zabboud ».
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בִגְוַי
  choice: Parmi les fils de Bigvaï
  rationale: La tournure introduit un nouveau groupe familial dans la liste. « Fils de » conserve la structure généalogique de l’hébreu, tout en pouvant désigner plus largement des descendants.
- source_word: עוּתַי
  choice: Outaï
  rationale: Transcription française naturelle du nom propre hébreu.
- source_word: ו/זבוד
  choice: et Zabboud
  rationale: Le texte massorétique porte זבוד ; la conjonction préfixée est rendue par « et ». Une variante textuelle est signalée en note.
- source_word: וְ/עִמּ/וֹ
  choice: avec lui
  rationale: Le suffixe hébreu est à la troisième personne du masculin singulier. La traduction conserve ce singulier malgré la présence de deux noms.
- source_word: שִׁבְעִים הַ/זְּכָרִים
  choice: soixante-dix hommes
  rationale: Dans cette liste de voyageurs, « hommes » rend naturellement le pluriel masculin זְכָרִים en français moderne, sans perdre l’indication de sexe portée par l’hébreu.
