source:
  edition: WLC
  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: fr
  text: 'Ceux qui étaient revenus de captivité, les exilés[a], offrirent des holocaustes au Dieu d’Israël : douze taureaux pour tout Israël[b], quatre-vingt-seize béliers, soixante-dix-sept agneaux et douze boucs en sacrifice pour le péché. Le tout fut offert en holocauste à Yahweh[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’exil », expression qui désigne les exilés revenus au pays.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « au nom de tout Israël ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit : « Le tout fut offert en holocauste à Yahweh », bien que la phrase précédente mentionne aussi des boucs offerts en sacrifice pour le péché.'
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: Ceux qui étaient revenus de captivité
  rationale: Le participe substantivé désigne le groupe arrivé depuis la captivité. « Étaient revenus » convient au contexte narratif du retour sans effacer le sens concret de שְׁבִי.
- source_word: בְנֵי הַגּוֹלָה
  choice: les exilés
  rationale: L’expression idiomatique signifie littéralement « les fils de l’exil ». « Les exilés » transmet naturellement en français moderne l’identité collective des rapatriés; la forme hébraïque est signalée en note.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: offrirent des holocaustes
  rationale: Dans le vocabulaire sacrificiel, הקריב signifie « offrir », tandis que עֹלָה désigne l’holocauste, sacrifice entièrement brûlé.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: au Dieu d’Israël
  rationale: Le ל marque ici le destinataire de l’offrande; cette formulation est naturelle et fidèle.
- source_word: פָּרִים שְׁנֵים עָשָׂר עַל כָּל יִשְׂרָאֵל
  choice: douze taureaux pour tout Israël
  rationale: « Pour » conserve avec concision la valeur représentative possible de עַל; la nuance « au nom de » est donnée en note.
- source_word: אֵילִים תִּשְׁעִים וְשִׁשָּׁה
  choice: quatre-vingt-seize béliers
  rationale: Traduction directe de l’espèce animale et du nombre.
- source_word: כְּבָשִׂים שִׁבְעִים וְשִׁבְעָה
  choice: soixante-dix-sept agneaux
  rationale: כְּבָשִׂים désigne couramment des agneaux dans les listes sacrificielles.
- source_word: צְפִירֵי חַטָּאת שְׁנֵים עָשָׂר
  choice: douze boucs en sacrifice pour le péché
  rationale: צְפִירֵי désigne des boucs et חַטָּאת la catégorie du sacrifice pour le péché.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: Le tout fut offert en holocauste à Yahweh
  rationale: La traduction garde la déclaration récapitulative du texte hébreu, même si elle suit immédiatement la mention d’un sacrifice pour le péché.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
- issue: Tension entre les boucs offerts pour le péché et la conclusion qualifiant le tout d’holocauste
  choice: Conserver sans l’atténuer la formulation récapitulative de l’hébreu
  alternative: Limiter explicitement « le tout » aux seuls animaux destinés aux holocaustes
  rationale: Le texte source juxtapose les deux affirmations. La traduction ne tranche pas silencieusement la portée de הַכֹּל et préserve cette tension textuelle.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel traditionnel (« holocauste », « sacrifice pour le péché ») est conservé pour sa précision, tandis que l’idiome hébraïque « fils de l’exil » est rendu naturellement dans le texte et expliqué en note.
