  text: מִ/בְּנֵ֣י שְׁכַנְיָ֔ה מִ/בְּנֵ֥י פַרְעֹ֖שׁ זְכַרְיָ֑ה וְ/עִמּ֛/וֹ הִתְיַחֵ֥שׂ לִ/זְכָרִ֖ים מֵאָ֥ה וַ/חֲמִשִּֽׁיםס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: fr
  text: 'De la descendance de Shekania ; de la descendance de Parosh : Zacharie, et avec lui 150 personnes masculines, inscrites selon leur généalogie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « enregistrées dans le registre généalogique ». Le verbe hébreu désigne une inscription ou un dénombrement officiel fondé sur la généalogie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Parmi les descendants de
  rationale: Dans cette liste, la formule introduit un membre ou un groupe issu d’une famille. « Parmi les descendants de » rend naturellement la valeur partitive de מִן et le sens généalogique de בְּנֵי.
- source_word: שְׁכַנְיָה
  choice: Chekania
  rationale: Transcription française usuelle du nom hébreu, adaptée à la prononciation et aux conventions bibliques françaises.
- source_word: פַרְעֹשׁ
  choice: Parosh
  rationale: Transcription claire du nom de famille hébreu, sans lui attribuer un sens absent du contexte.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: וְעִמּוֹ
  choice: et avec lui
  rationale: Cette formulation conserve la coordination brève de l’hébreu et indique que les personnes recensées accompagnaient Zacharie.
- source_word: הִתְיַחֵשׂ
  choice: furent inscrites selon leur généalogie
  rationale: Le hitpael de יחס désigne ici l’inscription ou le recensement officiel sur une base généalogique, et non simplement le fait d’être descendants de quelqu’un.
- source_word: לִזְכָרִים
  choice: personnes de sexe masculin
  rationale: L’hébreu précise le sexe sans indiquer nécessairement qu’il s’agit uniquement d’adultes. Cette expression est plus exacte que « hommes », malgré son caractère légèrement administratif.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: '150'
  rationale: Le chiffre est conservé exactement et présenté sous forme numérique, adaptée à une liste de recensement.
theological_decisions:
- issue: Rapport syntaxique entre Chekania et Parosh
  choice: Conserver deux rubriques successives séparées par un point-virgule
  alternative: Comprendre Zacharie comme descendant de Chekania dans la lignée de Parosh
  rationale: Le texte massorétique et ses accents présentent « parmi les descendants de Chekania » puis « parmi les descendants de Parosh ». Comme la première rubrique paraît incomplète, plusieurs reconstructions sont possibles ; la traduction évite de résoudre silencieusement cette difficulté textuelle.
translation_notes:
  register: Français moderne, digne et lisible, avec une syntaxe de liste conservant la structure abrupte de l’hébreu. « Personnes de sexe masculin » privilégie la précision du recensement sur la brièveté de « hommes ».
