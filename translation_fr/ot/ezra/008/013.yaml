  text: וּ/מִ/בְּנֵ֣י אֲדֹנִיקָם֮ אַחֲרֹנִים֒ וְ/אֵ֣לֶּה שְׁמוֹתָ֔/ם אֱלִיפֶ֖לֶט יְעִיאֵ֣ל וּֽ/שְׁמַעְיָ֑ה וְ/עִמָּ/הֶ֖ם שִׁשִּׁ֥ים הַ/זְּכָרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: fr
  text: 'Et parmi les fils d’Adonikam, les derniers[a], et voici leurs noms : Éliphéleth, Yeïel et Shemaya, avec eux, soixante hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les suivants » ou « les derniers arrivés ». L’hébreu peut désigner le dernier groupe de la lignée d’Adonikam, peut-être par opposition à un groupe mentionné auparavant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Parmi les fils de
  rationale: Dans cette liste généalogique, בְּנֵי peut désigner les fils, les descendants ou les membres d’une lignée. « Fils de » conserve la forme hébraïque tout en restant claire en français.
- source_word: אֲדֹנִיקָם
  choice: Adonikam
  rationale: Nom propre translittéré.
- source_word: אַחֲרֹנִים
  choice: les derniers[a]
  rationale: Le terme peut signifier « derniers », « ceux qui viennent après » ou « plus tardifs ». « Les derniers » conserve l’idée probable d’un dernier groupe issu de la lignée d’Adonikam sans effacer l’ambiguïté, signalée en note.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: dont voici les noms
  rationale: Cette tournure française naturelle rend la formule hébraïque d’introduction d’une liste, littéralement « et ceux-ci, leurs noms », sans ajouter d’information.
- source_word: אֱלִיפֶלֶט
  choice: Éliphéleth
  rationale: Nom propre translittéré sous une forme française reconnaissable.
- source_word: יְעִיאֵל
  choice: Yeïel
  rationale: Nom propre translittéré de manière à représenter la forme hébraïque en français.
- source_word: וּשְׁמַעְיָה
  choice: et Shemaya
  rationale: Nom propre translittéré; la conjonction hébraïque est conservée dans l’énumération.
- source_word: וְעִמָּהֶם
  choice: avec eux
  rationale: Rend directement l’idée d’accompagnement exprimée par עִם avec suffixe pronominal.
- source_word: שִׁשִּׁים
  choice: soixante
  rationale: Rendu direct du nombre cardinal.
- source_word: הַזְּכָרִים
  choice: hommes
  rationale: Le mot hébreu désigne explicitement des personnes de sexe masculin. Dans une liste de personnes, « hommes » est le rendu français le plus naturel et digne; « mâles » serait exact au sens biologique mais peu idiomatique pour des personnes.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne, adapté au style d’une liste généalogique. La formulation reste proche de la structure hébraïque tout en évitant une coordination maladroite en français; le point-virgule clarifie le passage des chefs nommés au groupe qui les accompagne.
