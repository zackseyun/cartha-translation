lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Parmi les fils de
  rationale: Cette formule introduit un nouveau groupe familial dans la liste. « Fils de » conserve la structure généalogique de l’hébreu, tout en désignant ici les membres ou descendants de cette lignée. La coordination initiale est rendue par le rythme continu de l’énumération française.
- source_word: עֵילָם
  choice: Élam
  rationale: Forme française usuelle de ce nom propre biblique.
- source_word: יְשַׁעְיָה
  choice: Ésaïe
  rationale: Forme française biblique usuelle du nom hébreu Yeshayah.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette construction patronymique immédiate, « fils de » est naturel et précis.
- source_word: עֲתַלְיָה
  choice: Atalie
  rationale: Forme française traditionnelle et intelligible de ce nom propre.
- source_word: וְ/עִמּוֹ
  choice: et avec lui
  rationale: Rend à la fois la coordination et l’accompagnement, en conservant la cadence administrative de la liste.
- source_word: שִׁבְעִים
  choice: soixante-dix
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: הַזְּכָרִים
  choice: hommes[a]
  rationale: « Hommes » est plus naturel en français courant dans une liste de personnes, tandis que la note conserve la précision lexicale du terme hébreu, qui signifie littéralement « les mâles ».
