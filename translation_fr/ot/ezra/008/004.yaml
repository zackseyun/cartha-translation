  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: fr
  text: 'Des fils de Pahath-Moab : Éliehoénaï, fils de Zerahia, et avec lui deux cents hommes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mâles ». Le terme hébreu précise le sexe des personnes comptées.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Des fils de
  rationale: La tournure conserve la désignation clanique hébraïque « fils de » ainsi que la valeur de la préposition מִן, tout en convenant au style elliptique d’une liste.
- source_word: פַּחַת מוֹאָב
  choice: Pahath-Moab
  rationale: Nom propre de famille ou de clan, translittéré plutôt que traduit ; le trait d’union permet de le lire comme une seule désignation.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Éliehoénaï
  rationale: Translittération française naturelle du nom hébreu, avec accents facilitant une prononciation fidèle.
- source_word: בֶּן זְרַחְיָה
  choice: fils de Zerahia
  rationale: Rend directement la relation filiale explicite dans le texte hébreu.
- source_word: וְעִמּוֹ
  choice: et avec lui
  rationale: Conserve la coordination hébraïque et indique que le nombre désigne ceux qui accompagnaient Éliehoénaï.
- source_word: מָאתַיִם
  choice: deux cents
  rationale: Rendu direct du nombre cardinal.
- source_word: הַזְּכָרִים
  choice: hommes
  rationale: « Hommes » est naturel en français pour désigner les personnes masculines recensées ; une note conserve la précision lexicale du terme hébreu, qui signifie proprement « mâles ».
