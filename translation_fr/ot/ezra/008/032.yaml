  yaml_path: translation/ot/ezra/008/032.yaml
  text: So we came to Jerusalem and stayed there three days.
translation:
  language: fr
  text: Nous sommes arrivés à Jérusalem et nous y sommes restés trois jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּבוֹא
  choice: Nous sommes donc arrivés
  rationale: Le wayyiqtol de בוא fait progresser le récit. Dans le contexte d’un voyage qui atteint son terme, « sommes arrivés » rend naturellement le mouvement vers la destination; « donc » marque sobrement l’enchaînement narratif.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: וַנֵּשֶׁב
  choice: et nous y sommes restés
  rationale: ישב peut signifier s’asseoir, habiter ou rester. Ici, après l’arrivée d’un groupe en voyage, « rester » exprime clairement un séjour temporaire.
- source_word: שָׁם
  choice: y
  rationale: L’adverbe renvoie à Jérusalem; le pronom adverbial « y » évite une répétition et constitue l’expression française la plus naturelle.
- source_word: יָמִים שְׁלֹשָׁה
  choice: trois jours
  rationale: Le groupe nominal exprime une durée. En français, « rester trois jours » est idiomatique et ne nécessite pas de préposition.
