source:
  edition: WLC
  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: fr
  text: Là, près du fleuve Ahava, je proclamai un jeûne afin que nous nous humiliions devant notre Dieu et que nous lui demandions un chemin droit pour nous, pour nos petits enfants et pour tous nos biens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « un chemin droit » peut aussi signifier ici « le bon chemin » ou « un voyage sûr ».
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: je proclamai
  rationale: Dans ce contexte, קרא désigne l’annonce publique d’un jeûne. Le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: צוֹם
  choice: un jeûne
  rationale: Le nom désigne l’observance elle-même; « un jeûne » est l’équivalent français naturel.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: près du fleuve Ahava
  rationale: עַל peut indiquer un emplacement au bord d’un cours d’eau. Cette formulation naturelle conserve Ahava comme nom géographique sans trancher si ce nom désigne strictement le fleuve ou le lieu associé.
- source_word: לְהִתְעַנּוֹת
  choice: afin que nous nous humiliions
  rationale: Dans le contexte du jeûne, le hitpael de ענה exprime le fait de s’abaisser, de se priver ou de s’humilier devant Dieu. « Nous nous humiliions » communique clairement cette posture sans suggérer qu’ils se faisaient du mal.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: devant notre Dieu
  rationale: Cette expression relationnelle et cultuelle est rendue directement dans un français naturel et digne.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: que nous lui demandions
  rationale: בקש suivi de מן exprime ici une requête adressée à Dieu. « Demander à Dieu » est plus idiomatique en français que « chercher de lui ».
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: un chemin droit
  rationale: La traduction conserve l’image hébraïque d’un chemin droit, qui peut évoquer à la fois la bonne direction et un voyage favorable, sans la réduire à la seule sécurité.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: pour nous, pour nos petits enfants et pour tous nos biens
  rationale: טף désigne les jeunes enfants ou, plus largement, les petits dépendants du groupe; « petits enfants » garde cette nuance. רְכוּשׁ désigne les biens matériels transportés.
theological_decisions:
- issue: Sens de לְהִתְעַנּוֹת dans le contexte du jeûne
  choice: afin que nous nous humiliions devant notre Dieu
  alternative: afin que nous nous affligions devant notre Dieu
  rationale: Le rendu choisi exprime la privation volontaire et l’abaissement liés au jeûne, tout en évitant que « s’affliger » soit compris comme une souffrance physique infligée à soi-même.
- issue: Portée de דֶּרֶךְ יְשָׁרָה
  choice: un chemin droit
  alternative: un bon chemin; un voyage sûr
  rationale: L’hébreu peut viser une route favorable et sûre dans le contexte du voyage, mais son image demeure plus large. Le texte principal préserve cette tension et la note explicite les possibilités contextuelles.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient une tonalité narrative biblique sans archaïsmes lexicaux. La phrase suit le mouvement du texte hébreu tout en employant une syntaxe française naturelle.
