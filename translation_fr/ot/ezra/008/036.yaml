  text: וַֽ/יִּתְּנ֣וּ אֶת דָּתֵ֣י הַ/מֶּ֗לֶךְ לַ/אֲחַשְׁדַּרְפְּנֵי֙ הַ/מֶּ֔לֶךְ וּ/פַחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר וְ/נִשְּׂא֥וּ אֶת הָ/עָ֖ם וְ/אֶת בֵּֽית הָ/אֱלֹהִֽים׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: fr
  text: Ils remirent les décrets du roi aux satrapes du roi et aux gouverneurs de la Transeuphratène[a]. Ceux-ci apportèrent leur soutien au peuple et à la maison de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Transeuphratène » était le nom administratif perse de la région située à l’ouest de l’Euphrate.
    reason: cultural_note
  - marker: b
    text: C’est-à-dire le temple de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ils remirent
  rationale: Le verbe נתן signifie fondamentalement « donner » ; avec des documents officiels comme objet, « remettre » exprime naturellement leur transmission formelle.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: les décrets du roi
  rationale: Dans le contexte administratif perse, דָּת désigne des directives officielles plutôt qu’un code juridique complet.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: les satrapes du roi
  rationale: « Satrapes » est le terme historique précis pour ces hauts responsables provinciaux de l’Empire perse ; le complément « du roi » est conservé.
- source_word: וּפַחֲווֹת
  choice: et aux gouverneurs
  rationale: פֶּחָה désigne des gouverneurs ou administrateurs régionaux ; « gouverneurs » est précis et courant.
- source_word: עֵבֶר הַנָּהָר
  choice: de la Transeuphratène
  rationale: L’expression est ici une désignation administrative perse de la région située à l’ouest de l’Euphrate. « Transeuphratène » en fournit l’équivalent historique français concis.
- source_word: וְנִשְּׂאוּ
  choice: Ceux-ci apportèrent leur soutien
  rationale: נשא signifie littéralement « soulever, porter » et prend ici le sens idiomatique de soutenir. Le pronom démonstratif explicite en français le changement de sujet impliqué par le contexte, à savoir les responsables impériaux.
- source_word: אֶת הָעָם
  choice: au peuple
  rationale: L’hébreu dit simplement « le peuple » ; aucune identification plus étroite n’est ajoutée.
- source_word: וְאֶת בֵּית הָאֱלֹהִים
  choice: et à la maison de Dieu
  rationale: La traduction conserve l’expression hébraïque littérale, qui désigne le temple sans effacer son image propre.
theological_decisions: []
