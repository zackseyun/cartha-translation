base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/011.yaml
  text: 'And from the sons of Bebai: Zechariah son of Bebai[a], and with him twenty-eight males.'
translation:
  language: fr
  text: 'Et parmi les fils de Bébaï[a] : Zacharie, fils de Bébaï, et avec lui vingt-huit hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, l’expression « fils de Bébaï » peut désigner plus largement les descendants de Bébaï ou les membres de sa lignée familiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Parmi les fils de
  rationale: La formulation conserve l’expression hébraïque « fils de », qui peut désigner ici les descendants ou les membres d’une lignée familiale. Dans cette liste, « parmi » rend naturellement la préposition מִן.
- source_word: בֵבַי
  choice: Bébaï
  rationale: Nom propre translittéré sous une forme française claire, avec tréma pour signaler que les deux voyelles se prononcent séparément.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française traditionnelle et couramment reconnue du nom hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette construction patronymique immédiate, « fils de » est la traduction la plus directe et naturelle.
- source_word: וְעִמּוֹ
  choice: et avec lui
  rationale: Cette formulation conserve la conjonction et indique les personnes qui accompagnaient Zacharie.
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: vingt-huit
  rationale: Traduction française directe du nombre cardinal.
- source_word: הַזְּכָרִים
  choice: hommes
  rationale: Le mot hébreu désigne explicitement des personnes de sexe masculin. Dans une liste de voyageurs, « hommes » est plus naturel en français moderne que « mâles », sans imposer ici une précision d’âge absente du terme.
