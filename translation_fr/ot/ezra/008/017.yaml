revisions:
- from: Je les envoyai auprès d’Iddo, le chef de la localité de Kasiphia. Je leur indiquai ce qu’ils devaient dire à Iddo et à ses frères[c], les serviteurs du Temple[a] établis à Kasiphia, afin qu’ils nous amènent des personnes pour assurer le service[b] de la maison de notre Dieu.
  to: Je les envoyai auprès d’Iddo, le chef de la localité de Kasiphia. Je leur indiquai ce qu’ils devaient dire à Iddo et à son frère[c], les serviteurs du Temple[a] à Kasiphia, afin qu’ils nous amènent des personnes chargées du service[b] de la maison de notre Dieu.
  rationale: La révision suit la vocalisation de la source pour « son frère » tout en préservant explicitement en note la lecture plurielle possible. Elle corrige ainsi une inférence grammaticale non concluante sans imposer une solution interprétative. Le reste du rendu est conservé, avec une légère amélioration de la formulation de מְשָׁרְתִים.
