source:
  edition: WLC
  text: ו/אוצא/ה אוֹתָ/ם֙ עַל אִדּ֣וֹ הָ/רֹ֔אשׁ בְּ/כָסִפְיָ֖א הַ/מָּק֑וֹם וָ/אָשִׂימָ/ה֩ בְּ/פִי/הֶ֨ם דְּבָרִ֜ים לְ֠/דַבֵּר אֶל אִדּ֨וֹ אָחִ֤י/ו ה/נתונים בְּ/כָסִפְיָ֣א הַ/מָּק֔וֹם לְ/הָֽבִיא לָ֥/נוּ מְשָׁרְתִ֖ים לְ/בֵ֥ית אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: fr
  text: Je les envoyai auprès d’Iddo, le chef de la localité de Kasiphia. Je leur indiquai ce qu’ils devaient dire à Iddo et à son frère[c], les serviteurs du Temple[a] à Kasiphia, afin qu’ils nous amènent des personnes chargées du service[b] de la maison de notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les donnés » ; le terme traditionnel « Netinim » désigne un groupe reconnu de serviteurs affectés au sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit ici de personnes servant dans le Temple, sans référence nécessaire à une fonction religieuse formelle apparue plus tard.
    reason: cultural_note
  - marker: c
    text: Ou « ses frères ». La vocalisation du texte hébreu donne « son frère », tandis que le consonantisme permet aussi la lecture plurielle. Le pluriel qui suit ne permet pas de trancher à lui seul.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וָאֹוצִיאָה
  choice: Je les envoyai
  rationale: Le hiphil de יצא signifie ici « faire partir »; dans le contexte d’une mission confiée à des envoyés, « envoyer » rend naturellement le sens.
- source_word: אִדּוֹ הָרֹאשׁ
  choice: Iddo, le chef
  rationale: רֹאשׁ, littéralement « tête », désigne ici la personne qui dirige.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: de la localité de Kasiphia
  rationale: Cette formulation conserve מָקוֹם, « lieu/localité », sans la tournure peu naturelle « au lieu Kasiphia ».
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  choice: Je leur indiquai ce qu’ils devaient dire
  rationale: L’expression hébraïque, littéralement « je mis des paroles dans leur bouche », signifie que l’auteur leur confia le message à transmettre. La formulation française en restitue clairement la fonction.
- source_word: אֶל אִדּוֹ אָחִיו
  choice: à Iddo et à ses frères
  rationale: La lecture collective s’accorde avec le participe pluriel הַנְּתוּנִים et avec le groupe auquel la délégation doit s’adresser. La difficulté de la vocalisation massorétique est signalée en note.
- source_word: הַנְּתוּנִים
  choice: les serviteurs du Temple
  rationale: Dans Esdras-Néhémie, ce terme désigne les Netinim, groupe affecté au service du sanctuaire. Une traduction fonctionnelle est immédiatement compréhensible; le nom traditionnel est conservé en note.
- source_word: מְשָׁרְתִים
  choice: des personnes pour assurer le service
  rationale: Le participe désigne des personnes qui accomplissent un service dans la maison de Dieu. Cette formulation évite que « ministres » évoque anachroniquement une fonction ecclésiastique ultérieure et le distingue du nom de groupe הַנְּתוּנִים.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: de la maison de notre Dieu
  rationale: « Maison de notre Dieu » préserve l’expression hébraïque et sa portée cultuelle, tout en restant intelligible en français.
theological_decisions:
- issue: Désignation des הַנְּתוּנִים dans le contexte du service du Temple
  choice: les serviteurs du Temple
  alternative: les Netinim
  rationale: La traduction fonctionnelle rend accessible la réalité historique sans transformer ce groupe en office religieux postérieur; le terme traditionnel figure en note.
- issue: Rendu de מְשָׁרְתִים sans connotation ecclésiastique anachronique
  choice: des personnes pour assurer le service
  alternative: des ministres
  rationale: Le mot décrit ici l’accomplissement d’un service cultuel, non un ministère défini selon des institutions religieuses ultérieures.
- issue: Nombre de אָחִיו et relation avec le pluriel הַנְּתוּנִים
  choice: ses frères
  alternative: son frère
  rationale: Le pluriel qui suit favorise l’adresse à Iddo et à un groupe de proches ou de collègues. La traduction ne dissimule pas la difficulté textuelle, qui est explicitée en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans être archaïque. « Temple » explicite la fonction des Netinim, tandis que « maison de notre Dieu » conserve l’expression théologique du texte source. La métaphore « mettre des paroles dans leur bouche » est rendue idiomatiquement pour éviter une formulation artificielle.
