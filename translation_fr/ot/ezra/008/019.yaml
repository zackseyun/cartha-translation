  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: fr
  text: 'ainsi que Hashabia et, avec lui, Jeshaïa, d’entre les descendants de Merari[a] : ses frères et leurs fils, au nombre de vingt[b] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’entre les fils de Merari » ; on peut aussi traduire : « d’entre les Merarites ».'
    reason: lexical_alternative
  - marker: b
    text: « Ses frères » peut désigner des hommes du même clan ou de proches parents masculins appartenant à la lignée de Merari, et pas nécessairement seulement des frères biologiques.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת
  choice: ainsi que
  rationale: La conjonction suivie du marqueur d’objet direct poursuit la liste commencée au verset précédent. « Ainsi que » exprime naturellement cet ajout en français.
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Le nom propre est translittéré sous une forme claire et adaptée à l’usage français.
- source_word: וְאִתּוֹ
  choice: et, avec lui
  rationale: Cette formulation conserve à la fois la coordination hébraïque et l’idée d’accompagnement.
- source_word: יְשַׁעְיָה
  choice: Yeshaya
  rationale: Le nom est translittéré de manière à le distinguer clairement du prophète habituellement appelé Ésaïe en français.
- source_word: מִבְּנֵי מְרָרִי
  choice: parmi les descendants de Merari
  rationale: Littéralement « parmi les fils de Merari ». Dans ce contexte généalogique, « descendants » communique plus naturellement en français la portée collective de l’expression.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le terme hébreu ordinaire pour « frères », muni du suffixe masculin singulier, est conservé sans préciser indûment la nature exacte de la parenté.
- source_word: וּבְנֵיהֶם
  choice: et leurs fils
  rationale: La formulation traduit directement le masculin pluriel et convient au contexte d’une liste généalogique.
- source_word: עֶשְׂרִים
  choice: soit vingt hommes
  rationale: Le nombre désigne naturellement l’effectif total du groupe qui vient d’être mentionné. « Hommes » est explicité en français pour rendre la phrase complète et naturelle.
