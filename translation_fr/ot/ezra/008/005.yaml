lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Parmi les fils de
  rationale: La préposition מִן introduit un groupe issu d’une famille dans cette liste. « Parmi » rend naturellement cette valeur partitive, tandis que « fils de » conserve la formule généalogique.
- source_word: שְׁכַנְיָה
  choice: Shekania
  rationale: Translittération française moderne du nom hébreu, avec conservation de l’élément final -ya.
- source_word: בֶּן יַחֲזִיאֵל
  choice: le fils de Yahaziel
  rationale: Le texte hébreu place « fils de Yahaziel » après « les fils de Shekania » sans donner clairement un autre nom personnel. La traduction conserve cette construction abrupte au lieu d’identifier silencieusement Shekania comme fils de Yahaziel.
- source_word: וְ/עִמּוֹ
  choice: et avec lui
  rationale: Rend directement la coordination hébraïque et indique que le groupe recensé accompagne le responsable qui vient d’être mentionné.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: trois cents
  rationale: Expression cardinale directe.
- source_word: הַזְּכָרִים
  choice: hommes
  rationale: « Hommes » est naturel et digne en français dans une liste de voyageurs; une note précise que le terme hébreu désigne explicitement des personnes de sexe masculin.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et adapté au style d’une liste généalogique. Le deux-points permet de conserver la construction elliptique de l’hébreu sans la rendre artificiellement fluide; « hommes » évite l’emploi peu naturel de « mâles » pour des personnes, avec précision en note.
