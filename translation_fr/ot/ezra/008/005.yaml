  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: fr
  text: 'D’entre les fils de Shekania : fils de Yahaziel, et avec lui trois cents hommes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: L’hébreu emploie ici un mot qui signifie précisément « personnes de sexe masculin », sans préciser leur âge ni leur statut social.
