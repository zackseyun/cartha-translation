  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: fr
  text: 'Et parmi les fils[a] de Shephatia : Zebadia, fils de Micaël, et avec lui quatre-vingts hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « fils » peut désigner plus largement les descendants ou les membres d’un clan, et non seulement les fils directs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Parmi les fils de
  rationale: La préposition מִן introduit ici un groupe au sein de la liste. « Parmi les fils de » conserve l’expression généalogique hébraïque tout en étant idiomatique en français; dans ce contexte, « fils » peut désigner plus largement les descendants ou le clan.
- source_word: שְׁפַטְיָה
  choice: Shephatia
  rationale: Nom propre translittéré sous une forme française claire et proche de l’hébreu.
- source_word: זְבַדְיָה
  choice: Zebadia
  rationale: Nom propre translittéré sous une forme française claire et proche de l’hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Devant le nom de Mikaël, le sens généalogique ordinaire et immédiat est le plus naturel.
- source_word: מִיכָאֵל
  choice: Mikaël
  rationale: Cette graphie française rend distinctement les éléments du nom hébreu et évite de l’assimiler inutilement à la forme française moderne « Michel ».
- source_word: וְ/עִמּוֹ
  choice: et avec lui
  rationale: La conjonction et la locution sont conservées afin de respecter la structure cumulative de la liste.
- source_word: שְׁמֹנִים
  choice: '80'
  rationale: Le nombre cardinal est rendu directement; les chiffres facilitent la lecture d’une liste de recensement.
- source_word: הַזְּכָרִים
  choice: hommes
  rationale: Le terme hébreu désigne explicitement des personnes de sexe masculin. Dans cette liste, « hommes » est la formulation française naturelle; « mâles » serait plus littéral, mais sonnerait déshumanisant ou zoologique dans le français courant.
