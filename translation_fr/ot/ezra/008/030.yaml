base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: fr
  text: Les prêtres et les lévites reçurent le poids d’argent[a], d’or et d’objets, afin de les apporter à Jérusalem, à la maison de notre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la quantité pesée d’argent, d’or et d’objets ». Le terme hébreu peut désigner soit le poids mesuré lui-même, soit la quantité déterminée par pesée.
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple de notre Dieu ». Littéralement, « la maison de notre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: reçurent donc
  rationale: Le qal accompli exprime la réception et la prise en charge des biens confiés; « reçurent » est naturel, tandis que « donc » rend l’enchaînement narratif de וְ.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: les prêtres et les lévites
  rationale: Traduction directe des deux groupes définis, avec la coordination conservée.
- source_word: מִשְׁקַל
  choice: le poids
  rationale: Le nom désigne le poids mesuré ou, par métonymie, la quantité pesée. « Le poids » conserve la formulation administrative et l’ambiguïté de l’hébreu; une note explicite l’autre compréhension.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: d’argent, d’or et d’objets
  rationale: « Argent » et « or » rendent littéralement les métaux précieux. כֵּלִים est un terme général pour des objets, récipients ou ustensiles; « objets » évite de préciser indûment leur forme ou leur usage.
- source_word: לְהָבִיא
  choice: afin de les apporter
  rationale: L’infinitif avec לְ marque ici le but. Le pronom « les » reprend naturellement les biens mentionnés.
- source_word: לִירוּשָׁלַם
  choice: à Jérusalem
  rationale: Rendu usuel du nom de lieu avec la préposition directionnelle.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: dans la maison de notre Dieu
  rationale: La destination finale se situe à l’intérieur de Jérusalem; « dans » est idiomatique en français. « Maison de notre Dieu » conserve l’expression hébraïque sans la remplacer silencieusement par « temple ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans archaïsme lexical. La formulation conserve la précision comptable du texte et l’expression concrète « maison de notre Dieu ».
