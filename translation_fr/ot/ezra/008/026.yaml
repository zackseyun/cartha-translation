  text: וָ/אֶשְׁקֲלָ֨/ה עַל יָדָ֜/ם כֶּ֗סֶף כִּכָּרִים֙ שֵֽׁשׁ מֵא֣וֹת וַ/חֲמִשִּׁ֔ים וּ/כְלֵי כֶ֥סֶף מֵאָ֖ה לְ/כִכָּרִ֑ים זָהָ֖ב מֵאָ֥ה כִכָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: fr
  text: Je pesai et leur remis six cent cinquante talents d’argent, des objets en argent d’une valeur de cent talents[a] et cent talents d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique. Il peut aussi se comprendre : « cent objets en argent, d’une valeur totale de cent talents ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה עַל יָדָם
  choice: Je pesai et leur remis
  rationale: Le verbe désigne la pesée des biens, tandis que l’expression « sur/dans leur main » indique leur remise à la garde des destinataires. Cette formulation française exprime naturellement les deux aspects sans conserver un calque maladroit.
- source_word: כֶּסֶף כִּכָּרִים שֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: six cent cinquante talents d’argent
  rationale: כֶּסֶף désigne ici le métal précieux pesé, et כִּכָּר une grande unité de poids traditionnellement appelée « talent ».
- source_word: וּכְלֵי כֶסֶף
  choice: des objets en argent
  rationale: כְּלִי est un terme large pouvant désigner des récipients, ustensiles ou autres objets. « Objets » évite de préciser indûment leur forme dans cet inventaire.
- source_word: מֵאָה לְכִכָּרִים
  choice: d’une valeur de cent talents
  rationale: La construction hébraïque est elliptique. Dans ce contexte de pesée, elle indique vraisemblablement que l’ensemble des objets en argent correspondait à cent talents, sans nécessairement affirmer qu’il y avait cent objets.
- source_word: זָהָב מֵאָה כִכָּר
  choice: cent talents d’or
  rationale: Il s’agit directement d’une quantité d’or exprimée au moyen de la même unité de poids.
