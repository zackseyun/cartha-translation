  text: וַ/יָּבִ֨יאּוּ לָ֜/נוּ כְּ/יַד אֱלֹהֵ֨י/נוּ הַ/טּוֹבָ֤ה עָלֵ֨י/נוּ֙ אִ֣ישׁ שֶׂ֔כֶל מִ/בְּנֵ֣י מַחְלִ֔י בֶּן לֵוִ֖י בֶּן יִשְׂרָאֵ֑ל וְ/שֵׁרֵֽבְיָ֛ה וּ/בָנָ֥י/ו וְ/אֶחָ֖י/ו שְׁמֹנָ֥ה עָשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: fr
  text: 'Et, grâce à la main bienveillante de notre Dieu sur nous[a], ils nous amenèrent un homme avisé parmi les descendants de Mahli, fils de Lévi, fils d’Israël : Shérébia, ses fils et ses frères, dix-huit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à la main bienveillante de notre Dieu sur nous ». Cette expression hébraïque évoque l’action favorable de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: ils nous amenèrent
  rationale: Le hiphil de בוא signifie ici « faire venir, amener ». Avec une personne comme complément, « amenèrent » est naturel en français narratif.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: parce que la main bienveillante de notre Dieu était sur nous
  rationale: La formulation conserve l’image biblique de la main de Dieu tout en exprimant naturellement le rapport circonstanciel indiqué par כְּ.
- source_word: אִישׁ שֶׂכֶל
  choice: un homme avisé
  rationale: שֶׂכֶל évoque l’intelligence pratique, le discernement et la prudence. « Avisé » rend ce sens sans réduire l’expression à un savoir technique.
- source_word: מִבְּנֵי מַחְלִי
  choice: parmi les descendants de Mahli
  rationale: Dans cette notice généalogique, בְּנֵי désigne les membres de la lignée de Mahli plutôt que nécessairement ses fils immédiats.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: fils de Lévi, fils d’Israël
  rationale: La traduction littérale préserve la structure généalogique répétée de l’hébreu.
- source_word: וְשֵׁרֵבְיָה
  choice: Shérébia
  rationale: Le nom précise en apposition l’identité de « l’homme avisé ». Les deux-points rendent cette relation clairement sans traduire mécaniquement le waw.
- source_word: וּבָנָיו וְאֶחָיו
  choice: avec ses fils et ses frères
  rationale: « Avec » exprime naturellement que les fils et les frères de Shérébia font partie du groupe amené.
- source_word: שְׁמֹנָה עָשָׂר
  choice: dix-huit en tout
  rationale: Le nombre porte vraisemblablement sur l’ensemble nommé. « En tout » explicite seulement la fonction totalisante du nombre, sans ajouter « hommes » absent de l’hébreu.
theological_decisions:
- issue: Expression de l’action providentielle de Dieu par l’image de sa main
  choice: parce que la main bienveillante de notre Dieu était sur nous
  alternative: selon la bonne main de notre Dieu sur nous
  rationale: Le choix maintient la métaphore de la main divine et l’idée de faveur active, tout en donnant à כְּ une valeur circonstancielle idiomatique. Il n’explicite pas davantage la manière dont cette providence agit.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au récit historique écrit. « Shérébia » suit une translittération française usuelle; « Israël » et « Lévi » portent les accents conventionnels.
