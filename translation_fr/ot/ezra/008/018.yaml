review_pass:
  verdict: revise
  source_fidelity: La formulation « parce que » interprète trop précisément la préposition כְ, qui exprime ici plus sobrement la conformité ou le concours de la main favorable de Dieu. Le reste rend fidèlement l’homme qualifié, son ascendance et le groupe de dix-huit personnes.
  naturalness: Le français est globalement naturel et de registre approprié. « Grâce à la main bienveillante de notre Dieu sur nous » est idiomatique tout en conservant l’image de la main divine; la ponctuation peut présenter plus directement Shérébia et les siens comme le groupe compté.
  terminology: « Main bienveillante », « homme avisé », « descendants », « Lévi », « Israël » et « Shérébia » conviennent au français biblique moderne. La note conserve l’alternative plus littérale sans imposer une explication doctrinale.
  issues:
  - severity: medium
    issue: « parce que » pour כְיַד
    rationale: « Parce que » impose une relation causale explicite. Dans cette formule d’Esdras-Néhémie, כְ peut se rendre plus prudemment par « grâce à », « selon » ou « conformément à », tout en maintenant l’image de la main favorable de Dieu.
  - severity: low
    issue: « dix-huit en tout »
    rationale: « En tout » est une explicitation légère du nombre final. Le français peut conserver plus exactement la concision du texte en disant simplement « dix-huit ».
  revised_text: 'Et, grâce à la main bienveillante de notre Dieu sur nous[a], ils nous amenèrent un homme avisé parmi les descendants de Mahli, fils de Lévi, fils d’Israël : Shérébia, ses fils et ses frères, dix-huit.'
  revised_footnotes:
  - marker: a
    text: 'Ou : « conformément à la main bienveillante de notre Dieu sur nous ». Cette expression hébraïque évoque l’action favorable de Dieu.'
    reason: lexical_alternative
  revision_rationale: La révision remplace la conjonction causale par « grâce à », qui rend naturellement la tournure circonstancielle tout en préservant la métaphore de la main divine. Elle retire aussi « en tout », ajout non nécessaire au nombre final. Aucun changement de sens n’est apporté aux liens généalogiques ni au décompte.
