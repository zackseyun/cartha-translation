  to: 'Et, grâce à la main bienveillante de notre Dieu sur nous[a], ils nous amenèrent un homme avisé parmi les descendants de Mahli, fils de Lévi, fils d’Israël : Shérébia, ses fils et ses frères, dix-huit.'
