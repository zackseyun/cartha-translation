base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: fr
  text: 'Je leur pesai l’argent, l’or et les objets : la contribution[a] destinée à la maison de notre Dieu, qu’avaient offerte le roi, ses conseillers, ses hauts fonctionnaires et tout Israël qui étaient présents.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’offrande ». Le terme hébreu peut désigner une contribution mise à part pour un usage sacré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה
  choice: Je pesai pour eux
  rationale: Le verbe שׁקל désigne l’action de peser. Avec לָהֶם, la formulation indique que les biens sont pesés en vue de leur être confiés, sans ajouter explicitement une idée de répartition absente du verbe.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: Dans cette liste avec l’or et les objets du temple, le terme désigne le métal précieux plutôt que la monnaie; en français, « argent » exprime naturellement les deux selon le contexte.
- source_word: הַזָּהָב
  choice: l’or
  rationale: Traduction directe du nom du métal précieux.
- source_word: הַכֵּלִים
  choice: les objets
  rationale: כֵּלִים est un terme large désignant des objets, récipients ou ustensiles. « Objets » reste naturel et évite de préciser leur forme ou leur fonction au-delà du texte.
- source_word: תְּרוּמַת
  choice: la contribution
  rationale: Le terme désigne ici des biens mis à part et donnés pour un usage sacré. « Contribution » souligne le caractère de don sans imposer un rite sacrificiel particulier.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: la maison de notre Dieu
  rationale: Cette traduction conserve l’image hébraïque de la « maison » tout en restant claire dans le contexte du temple.
- source_word: הֵרִימוּ
  choice: avaient offerte
  rationale: Le hiphil de רום peut littéralement évoquer le fait d’élever, mais il désigne idiomatiquement la présentation d’une contribution sacrée. Le plus-que-parfait marque l’antériorité du don par rapport à la pesée.
- source_word: יֹעֲצָיו
  choice: ses conseillers
  rationale: Le nom désigne ceux qui donnent conseil au roi.
- source_word: שָׂרָיו
  choice: ses hauts fonctionnaires
  rationale: Dans le cadre administratif perse, שָׂרִים désigne vraisemblablement des dignitaires ou responsables officiels; « hauts fonctionnaires » exprime leur rang sans suggérer nécessairement une ascendance royale.
- source_word: וְכָל יִשְׂרָאֵל הַנִּמְצָאִים
  choice: et tout Israël qui se trouvait là
  rationale: La formulation conserve le collectif « tout Israël » et rend הַנִּמְצָאִים selon son sens contextuel de personnes présentes ou disponibles sur place.
theological_decisions:
- issue: Sens cultuel de תְּרוּמָה
  choice: la contribution
  alternative: l’offrande
  rationale: « Contribution » rend l’idée de biens donnés et mis à part pour la maison de Dieu, sans transformer le terme en désignation d’un sacrifice précis. La note conserve l’alternative cultuelle naturelle « offrande ».
- issue: Image de בֵּית אֱלֹהֵינוּ
  choice: la maison de notre Dieu
  alternative: le temple de notre Dieu
  rationale: Le référent est bien le temple, mais « maison » préserve l’image explicite de l’hébreu et sa portée théologique sans explicitation inutile.
- issue: Portée collective de כָּל יִשְׂרָאֵל
  choice: tout Israël
  alternative: tous les Israélites
  rationale: Le collectif hébreu est maintenu, sans prétendre que chaque membre du peuple sans exception était physiquement présent; la relative précise le groupe concerné.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique. La ponctuation explicite que l’argent, l’or et les objets constituent la contribution, tandis que la relative conserve l’antériorité des dons.
