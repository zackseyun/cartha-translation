source:
  edition: WLC
  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: fr
  text: Nous partîmes de la rivière Ahava le douzième jour du premier mois pour aller à Jérusalem. La main de notre Dieu était sur nous, et il nous délivra de la main de l’ennemi et de celui qui nous guettait[a] sur le chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une embuscade sur le chemin ». Le participe hébreu peut désigner soit la personne postée à l’affût, soit, par extension, le danger de l’embuscade.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: Nous partîmes
  rationale: Dans ce contexte de voyage, נסע désigne la levée du camp et le départ. « Partîmes » exprime naturellement le mouvement narratif en français.
- source_word: מִנְּהַר אֲהֲוָא
  choice: de la rivière Ahava
  rationale: נָהָר signifie ici « rivière » ou « fleuve ». Le nom propre Ahava est translittéré, sans imposer une identification géographique incertaine.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: le douzième jour du premier mois
  rationale: Le mot « jour », sous-entendu dans l’expression hébraïque, est explicité conformément à l’usage français.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: pour aller à Jérusalem
  rationale: L’infinitif exprime le but du départ. « Pour aller » rend clairement cette valeur sans alourdir la phrase.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: La main de notre Dieu fut sur nous
  rationale: La métaphore hébraïque de la main divine est conservée, car elle constitue un motif important d’Esdras et reste intelligible en français.
- source_word: וַיַּצִּילֵנוּ
  choice: il nous délivra
  rationale: נצל exprime le fait d’arracher ou de soustraire à un danger. « Délivra » convient au registre narratif et à la construction qui suit.
- source_word: מִכַּף אוֹיֵב
  choice: de la main de l’ennemi
  rationale: כַּף désigne littéralement la paume ou la main et, par extension, l’emprise. Le maintien de « main » préserve le contraste littéraire avec la main protectrice de Dieu.
- source_word: וְאוֹרֵב
  choice: et de celui qui nous guettait
  rationale: Le participe singulier de ארב désigne d’abord une personne postée à l’affût. Cette traduction conserve la valeur personnelle du participe, tout en signalant en note la formulation abstraite possible.
- source_word: עַל הַדָּרֶךְ
  choice: sur le chemin
  rationale: La locution rend directement le lieu où se trouvait la menace pendant le voyage.
theological_decisions:
- issue: Métaphore anthropomorphique de la protection divine
  choice: Conserver « La main de notre Dieu fut sur nous »
  alternative: « Notre Dieu nous protégea »
  rationale: Le texte hébreu emploie expressément l’image de la main de Dieu, motif récurrent d’Esdras-Néhémie qui évoque sa faveur et son action protectrice. La conserver respecte la forme et la portée théologique du texte sans les réduire à une explication.
- issue: Nature de la seconde menace
  choice: 'Traduire le participe par une personne : « celui qui nous guettait »'
  alternative: « l’embuscade »
  rationale: Le participe hébreu singulier peut désigner l’homme à l’affût, tandis qu’une traduction abstraite par « embuscade » exprime naturellement le danger en français. Le texte principal retient le sens personnel sans exclure l’autre compréhension, donnée en note.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient le registre historique sans archaïsmes lexicaux. La répétition de « main » est volontaire afin de préserver le contraste entre la protection de Dieu et l’emprise de l’ennemi.
