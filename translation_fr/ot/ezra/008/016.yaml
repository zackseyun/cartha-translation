base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: fr
  text: J’envoyai alors chercher Éliézer, Ariel, Shemaeya, Elnathan, Yarib, Elnathan, Nathan, Zacharie et Meshoullam, qui étaient des chefs[a], ainsi que Yoyarib et Elnathan, des hommes de discernement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « têtes »; c’est-à-dire des dirigeants.'
    reason: lexical_alternative
  - marker: b
    text: Ou « des hommes avisés » ou « des hommes instruits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: J’envoyai alors chercher
  rationale: Le wayyiqtol fait progresser le récit. Dans ce contexte, שׁלח suivi des personnes introduites par ל exprime l’envoi d’une convocation; « envoyer chercher » est l’expression française naturelle.
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: Éliézer ... ainsi que ... Elnathan
  rationale: Les ל répétés introduisent les personnes auxquelles s’adresse la démarche d’Esdras. Avec « envoyer chercher », le français n’a pas besoin de répéter une préposition devant chaque nom.
- source_word: רָאשִׁים
  choice: chefs
  rationale: Le nom signifie littéralement « têtes » et désigne ici des hommes exerçant une fonction dirigeante. « Chefs » conserve cette valeur concrète et statutaire sans préciser indûment leur charge.
- source_word: מְבִינִים
  choice: hommes avisés
  rationale: Le participe de בין évoque la compréhension, le discernement ou l’instruction. « Hommes avisés » garde cette amplitude sans en faire nécessairement des enseignants officiels.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: ainsi que Yoyarib et Elnathan, des hommes avisés
  rationale: L’apposition finale qualifie le plus naturellement Yoyarib et Elnathan. La tournure française conserve cette structure sans la transformer en fonction officielle.
- source_word: אֶלְנָתָן
  choice: Elnathan
  rationale: Le nom apparaît trois fois dans le texte source; chaque occurrence est maintenue, puisqu’il s’agit vraisemblablement de personnes distinctes portant le même nom.
- source_word: יוֹיָרִיב
  choice: Yoyarib
  rationale: Cette translittération rend directement la forme hébraïque יוֹיָרִיב en français moderne, sans lui substituer la forme développée Yehoyarib.
theological_decisions: []
