id: EZR.8.29
reference: Ezra 8:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: fr
  text: Soyez vigilants et gardez-les[a] jusqu’à ce que vous les pesiez en présence des chefs des prêtres, des lévites et des chefs des maisons ancestrales d’Israël[b], à Jérusalem, dans les salles de la maison de Yahvé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Soyez attentifs et veillez sur eux. » Les deux impératifs hébreux soulignent la vigilance avec laquelle les biens confiés devaient être conservés.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les chefs des maisons des pères d’Israël »; il s’agit des responsables des clans ou des lignées ancestrales.'
    reason: cultural_note
  - marker: c
    text: La « maison de Yahvé » désigne ici le temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁקְדוּ וְשִׁמְרוּ
  choice: Soyez vigilants et gardez-les
  rationale: Les deux impératifs appellent à une surveillance attentive et à la protection des biens confiés. Le pronom « les », implicite en hébreu, reprend naturellement les objets précieux mentionnés au verset précédent.
- source_word: עַד תִּשְׁקְלוּ
  choice: jusqu’à ce que vous les pesiez
  rationale: שׁקל désigne ici la pesée officielle des biens à des fins de contrôle. Le pronom objet est explicité en français d’après le contexte.
- source_word: לִפְנֵי
  choice: en présence de
  rationale: Cette formulation rend le cadre officiel et public de la pesée, sans réduire le sens à une simple position spatiale.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: les chefs des prêtres
  rationale: Cette traduction conserve le sens ordinaire de שׂרים, « chefs » ou « responsables », sans introduire le possible sens technique plus tardif de « grands prêtres ».
- source_word: וְהַלְוִיִּם
  choice: des lévites
  rationale: Désignation religieuse et tribale conventionnelle en français.
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: des chefs des maisons ancestrales d’Israël
  rationale: L’expression désigne les responsables des groupes familiaux issus d’un ancêtre commun. « Maisons ancestrales » garde la dimension sociale de l’idiome hébreu tout en restant intelligible.
- source_word: הַלִּשְׁכוֹת
  choice: les salles
  rationale: Le terme désigne des pièces du complexe du temple. « Salles » est naturel et ne précise pas indûment qu’il s’agissait exclusivement de réserves.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: La traduction conserve l’image hébraïque de la « maison » et rend le nom divin comme un nom propre; dans ce contexte, l’expression désigne le temple.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » est la forme française traditionnelle du nom propre et évite de le remplacer par un titre.
- issue: Identification de בֵּית יְהוָה
  choice: la maison de Yahvé
  alternative: le temple de Yahvé
  rationale: Le texte principal préserve la métaphore cultuelle de l’hébreu; une note indique clairement qu’il s’agit ici du temple.
translation_notes:
  register: Français international moderne, digne et direct. Le pluriel s’adresse aux prêtres et aux lévites chargés des biens. La formulation conserve la succession des autorités et l’image de la maison divine, tout en évitant les archaïsmes et un vocabulaire ecclésiastique potentiellement anachronique.
