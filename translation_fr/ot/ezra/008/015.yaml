source:
  edition: WLC
  text: וָֽ/אֶקְבְּצֵ֗/ם אֶל הַ/נָּהָר֙ הַ/בָּ֣א אֶֽל אַהֲוָ֔א וַ/נַּחֲנֶ֥ה שָׁ֖ם יָמִ֣ים שְׁלֹשָׁ֑ה וָ/אָבִ֤ינָ/ה בָ/עָם֙ וּ/בַ/כֹּ֣הֲנִ֔ים וּ/מִ/בְּנֵ֥י לֵוִ֖י לֹא מָצָ֥אתִי שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: fr
  text: Je les rassemblai au bord du fleuve qui va vers Ahava[a], et nous campâmes là pendant trois jours. J’examinai alors le peuple et les prêtres, mais je ne trouvai là aucun des descendants de Lévi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le canal qui va vers Ahava ». Dans ce contexte, le mot hébreu peut désigner un fleuve ou un cours d’eau aménagé.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des fils de Lévi », c’est-à-dire des Lévites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: Je les rassemblai
  rationale: Le verbe קבץ signifie rassembler ou réunir. « Je les rassemblai » restitue clairement l’action d’Esdras dans un récit au passé.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: la rivière qui va vers Ahava
  rationale: נָהָר désigne normalement une rivière, mais peut aussi désigner un canal dans le contexte mésopotamien. Le participe בָּא exprime ici le mouvement ou la direction vers Ahava; « qui va vers » préserve cette formulation sans préciser indûment la nature du cours d’eau.
- source_word: וַנַּחֲנֶה שָׁם יָמִים שְׁלֹשָׁה
  choice: nous campâmes là pendant trois jours
  rationale: חנה signifie camper. L’ajout naturel de « pendant » exprime clairement la durée indiquée par l’hébreu.
- source_word: וָאָבִינָה
  choice: J’examinai alors
  rationale: Dans ce contexte, בין exprime une observation attentive visant à discerner la composition du groupe. « J’examinai » rend mieux l’acte concret qu’un simple « je compris ».
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: le peuple et les prêtres
  rationale: Traduction directe des deux groupes examinés, sans transformer עָם en catégorie technique telle que « laïcs ».
- source_word: וּמִבְּנֵי לֵוִי
  choice: aucun des descendants de Lévi
  rationale: Littéralement « parmi les fils de Lévi ». « Descendants de Lévi » conserve la portée généalogique tout en évitant que « fils » soit compris comme désignant seulement les enfants immédiats.
- source_word: לֹא מָצָאתִי שָׁם
  choice: je ne trouvai là aucun
  rationale: Cette formulation française rend naturellement la négation et l’absence totale constatée par Esdras.
theological_decisions:
- issue: Désignation des membres de la tribu de Lévi
  choice: descendants de Lévi
  alternative: Lévites
  rationale: Le texte hébreu emploie l’expression généalogique « fils de Lévi ». La traduction principale en conserve la nuance, tandis que la note donne le terme usuel.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique soutenu sans archaïsmes lexicaux. Les deux marqueurs de note figurent dans le texte principal.
