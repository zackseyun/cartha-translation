  yaml_path: translation/ot/ezra/008/034.yaml
  text: Everything was counted by number and by weight, and the total weight was recorded at that time.
translation:
  language: fr
  text: Tout fut compté et pesé[a], et le poids total fut consigné à ce moment-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en nombre, en poids, pour le tout ».'
    reason: La note conserve la structure nominale concise de l’hébreu, tandis que le texte principal emploie les verbes français naturels « compté et pesé ».
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: compté
  rationale: מִסְפָּר désigne le nombre ou le dénombrement. Dans ce contexte d’inventaire, « compté » exprime naturellement la vérification par nombre.
- source_word: בְּמִשְׁקָל
  choice: pesé
  rationale: מִשְׁקָל signifie « poids ». Coordonné à « compté », le verbe « pesé » rend clairement et idiomatiquement la vérification selon le poids.
- source_word: לַכֹּל
  choice: Tout
  rationale: La formule indique que l’opération portait sur l’ensemble des biens remis. La mise en tête de « Tout » restitue cette portée globale en français naturel.
- source_word: וַיִּכָּתֵב
  choice: fut consigné
  rationale: Le niphal de כתב signifie littéralement « fut écrit ». Dans un contexte administratif, « fut consigné » exprime avec précision l’inscription officielle dans un relevé.
- source_word: כָּל הַמִּשְׁקָל
  choice: le poids total
  rationale: Littéralement « tout le poids » ; « le poids total » est l’expression française idiomatique pour la somme pondérale enregistrée.
- source_word: בָּעֵת הַהִיא
  choice: à ce moment-là
  rationale: Cette formulation conserve la valeur temporelle et démonstrative de l’hébreu.
