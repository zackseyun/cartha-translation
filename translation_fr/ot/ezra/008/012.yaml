  text: וּ/מִ/בְּנֵ֣י עַזְגָּ֔ד יוֹחָנָ֖ן בֶּן הַ/קָּטָ֑ן וְ/עִמּ֕/וֹ מֵאָ֥ה וַ/עֲשָׂרָ֖ה הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/012.yaml
  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: fr
  text: 'Parmi les descendants d’Azgad : Yohanân, fils de Haqqatan[a], et avec lui 110 hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils du plus jeune », si הַקָּטָן est compris comme une désignation descriptive plutôt que comme le nom propre Haqqatan.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי עַזְגָּד
  choice: Parmi les descendants d’Azgad
  rationale: Dans cette liste, מִן + בְּנֵי introduit un groupe familial. « Descendants » exprime naturellement en français la portée collective possible de בְּנֵי, sans suggérer qu’il s’agit uniquement de fils immédiats. La conjonction initiale est rendue implicitement par la continuité de la liste.
- source_word: יוֹחָנָן
  choice: Yohanân
  rationale: Translittération française reconnaissable du nom hébreu, avec l’accent circonflexe indiquant la voyelle longue finale selon un usage biblique français courant.
- source_word: בֶּן הַ/קָּטָן
  choice: fils de Haqqatan
  rationale: Dans cette liste de chefs de famille, הַקָּטָן est vraisemblablement employé comme nom propre patronymique. La translittération conserve toutefois la possibilité signalée en note d’une lecture descriptive.
- source_word: וְ/עִמּוֹ
  choice: et avec lui
  rationale: Cette formule introduit le nombre des personnes accompagnant le chef nommé et reproduit simplement la coordination hébraïque.
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: '110'
  rationale: Les chiffres offrent une présentation claire et moderne du nombre « cent dix » dans une liste.
- source_word: הַ/זְּכָרִים
  choice: hommes
  rationale: Le contexte est celui d’un recensement des membres masculins accompagnant chaque chef. « Hommes » est plus naturel et digne en français courant que « mâles », tout en exprimant ici la référence masculine du terme hébreu.
theological_decisions: []
translation_notes:
  register: Style concis de registre généalogique, en français moderne et soutenu sans archaïsme. « Descendants » rend explicitement la valeur familiale large de « fils de » dans ce contexte. Le marqueur [a] est placé immédiatement après le nom concerné.
