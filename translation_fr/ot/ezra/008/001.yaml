base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: fr
  text: 'Voici les chefs de famille et le registre généalogique[a] de ceux qui montèrent avec moi de Babylone sous le règne du roi Artaxerxès :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur généalogie » ou « ceux qui furent enregistrés selon leur généalogie ». Le terme hébreu désigne un recensement ou un registre généalogique, et non seulement l’ascendance au sens abstrait.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne la liste qui suit, tout en rendant la fonction présentative de la formule hébraïque.
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: les chefs de leurs familles ancestrales
  rationale: Dans ce contexte administratif et généalogique, « pères » désigne les unités familiales ou maisons ancestrales; « chefs » conserve l’idée des représentants principaux.
- source_word: וְהִתְיַחְשָׂם
  choice: avec leur inscription généalogique
  rationale: Le terme évoque l’établissement ou l’enregistrement d’une filiation, et non seulement l’ascendance prise abstraitement. « Avec » explicite sobrement le lien syntaxique avec les chefs recensés.
- source_word: הָעֹלִים
  choice: ceux qui montèrent
  rationale: Conserve l’expression traditionnelle de la montée depuis l’exil vers Juda et Jérusalem; le passé simple convient au registre narratif et soutenu.
- source_word: עִמִּי
  choice: avec moi
  rationale: Reproduit directement la première personne employée par Ezra.
- source_word: בְּמַלְכוּת
  choice: sous le règne de
  rationale: Équivalent idiomatique français indiquant la période du pouvoir royal.
- source_word: אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: du roi Artaxerxès
  rationale: Suit l’ordre naturel du titre et du nom en français, avec la forme française usuelle du nom propre.
- source_word: מִבָּבֶל
  choice: de Babylone
  rationale: Rend directement le point de départ du déplacement.
