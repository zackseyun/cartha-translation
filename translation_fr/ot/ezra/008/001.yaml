  source_fidelity: 'Le sens général est bien rendu, y compris le déplacement « de Babylone », la première personne d’Esdras et le cadre du règne d’Artaxerxès. Toutefois, « parmi ceux qui » transforme la relation syntaxique : le texte introduit les chefs de famille et leur relevé généalogique, puis précise qu’il s’agit de ceux qui montèrent avec Esdras, plutôt que de dire que les chefs se trouvent « parmi » eux. « Avec leur inscription généalogique » ajoute aussi une relation instrumentale ou d’accompagnement que l’hébreu n’exprime pas explicitement.'
