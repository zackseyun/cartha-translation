  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: fr
  text: et vingt coupes d’or, d’une valeur de mille dariques[a], ainsi que deux récipients de bronze fin et brillant[b], aussi précieux que l’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vingt coupes d’or pour mille dariques ». L’hébreu peut se comprendre comme donnant la valeur totale des coupes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « deux récipients de bronze finement poli ». L’expression hébraïque, rare, désigne probablement un bronze de qualité supérieure à l’aspect brillant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי
  choice: coupes
  rationale: Le nom désigne des récipients en forme de coupe ou de bol. « Coupes » convient naturellement à cet inventaire d’objets précieux.
- source_word: זָהָב
  choice: or
  rationale: Terme courant désignant le métal précieux.
- source_word: עֶשְׂרִים
  choice: vingt
  rationale: Traduction directe du nombre cardinal.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: d’une valeur de mille dariques
  rationale: Le préfixe ל indique probablement ici une estimation de valeur. La darique est conservée comme unité monétaire historique, et le contexte suggère que les mille dariques représentent la valeur totale des vingt coupes.
- source_word: וּכְלֵי
  choice: ainsi que deux récipients
  rationale: כְּלִי est un terme général pour un objet ou un récipient. « Récipients » convient au contexte d’un inventaire du trésor du temple.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme peut désigner le cuivre ou le bronze. Pour des récipients ouvragés de l’Antiquité, « bronze » est ici le choix le plus probable et le plus naturel.
- source_word: מֻצְהָב טוֹבָה
  choice: fin et brillant
  rationale: L’expression rare semble décrire un bronze de qualité supérieure à l’aspect éclatant. Cette traduction préserve cette idée sans affirmer que les objets étaient plaqués d’or.
- source_word: שְׁנַיִם
  choice: deux
  rationale: Traduction directe du nombre cardinal.
- source_word: חֲמוּדֹת
  choice: précieux
  rationale: Le mot exprime ce qui est désirable et de grande valeur; « précieux » convient à la comparaison avec l’or.
- source_word: כַּזָּהָב
  choice: aussi précieux que l’or
  rationale: La préposition marque une comparaison explicite avec l’or; la formulation française intègre naturellement l’adjectif précédent.
