source:
  edition: WLC
  text: וּ/מִן הַ/נְּתִינִ֗ים שֶׁ/נָּתַ֨ן דָּוִ֤יד וְ/הַ/שָּׂרִים֙ לַ/עֲבֹדַ֣ת הַ/לְוִיִּ֔ם נְתִינִ֖ים מָאתַ֣יִם וְ/עֶשְׂרִ֑ים כֻּלָּ֖/ם נִקְּב֥וּ בְ/שֵׁמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: fr
  text: Et parmi les serviteurs du Temple que David et les chefs avaient affectés au service des Lévites, il y avait 220 serviteurs du Temple[a] ; tous furent désignés nommément[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Nethinim, terme technique désignant une catégorie de serviteurs du Temple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous furent inscrits nommément ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: serviteurs du Temple
  rationale: Ce terme technique désigne une catégorie reconnue de personnes attachées au service du sanctuaire. « Serviteurs du Temple » en exprime clairement la fonction sans conserver un emprunt hébreu opaque.
- source_word: שֶׁנָּתַן
  choice: avait affectés
  rationale: Le verbe signifie littéralement « avait donnés », mais, dans ce contexte administratif, il exprime l'affectation de personnes à une tâche déterminée.
- source_word: וְהַשָּׂרִים
  choice: les chefs
  rationale: Le terme désigne ici des dirigeants ou hauts responsables. « Chefs » reste naturel et suffisamment large sans suggérer nécessairement des princes de sang royal.
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: au service des Lévites
  rationale: Cette formulation conserve le rapport explicite entre leur affectation et le service des Lévites, sans préciser au-delà de l'hébreu s'ils travaillaient sous leurs ordres ou à leurs côtés.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: Les chiffres rendent le nombre exact immédiatement lisible en français moderne.
- source_word: כֻּלָּם
  choice: tous
  rationale: Le masculin pluriel reprend naturellement l'ensemble des serviteurs mentionnés.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: avaient été désignés par leur nom
  rationale: Le passif exprime une identification nominative explicite. « Désignés par leur nom » garde la nuance formelle tout en laissant ouverte la possibilité d'une inscription sur une liste.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « serviteurs du Temple » reflète celle du terme hébreu, tandis que le plus-que-parfait situe naturellement ces affectations avant le rassemblement raconté dans le contexte.
