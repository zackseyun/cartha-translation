source:
  edition: WLC
  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: fr
  text: 'Car j’avais honte de demander au roi des troupes et des cavaliers pour nous aider contre l’ennemi pendant le voyage[a], puisque nous avions dit au roi : « La main de notre Dieu est favorable à tous ceux qui le cherchent[b], mais sa force et sa colère sont contre tous ceux qui l’abandonnent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « pour nous aider à nous protéger de l’ennemi pendant le voyage » ou « pour nous aider à échapper à l’ennemi pendant le voyage ». La préposition hébraïque peut exprimer la protection contre un ennemi.'
    reason: lexical_alternative
  - marker: b
    text: Dans la Bible hébraïque, « la main de Dieu » est une image qui évoque son action, sa puissance ou sa faveur.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: j’avais honte
  rationale: Le verbe exprime la honte plutôt qu’un simple embarras. L’imparfait s’insère naturellement dans le récit et rend l’état qui empêchait Esdras de faire cette demande.
- source_word: חַיִל וּפָרָשִׁים
  choice: des troupes et des cavaliers
  rationale: חַיִל désigne ici une force armée, sans nécessairement évoquer toute une armée, tandis que פָרָשִׁים désigne concrètement des hommes montés.
- source_word: לְעָזְרֵנוּ מֵאוֹיֵב בַּדָּרֶךְ
  choice: pour nous protéger de l’ennemi en chemin
  rationale: Le sens littéral est « pour nous aider [loin/de] l’ennemi sur le chemin ». Dans le contexte d’une escorte militaire, « protéger de » exprime naturellement l’aide défensive recherchée, tandis que « en chemin » conserve le cadre du voyage.
- source_word: יַד אֱלֹהֵינוּ
  choice: La main de notre Dieu
  rationale: La métaphore hébraïque de la main désigne l’action, la puissance ou la faveur divine. La conserver maintient l’image concrète et sa richesse sémantique.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: agit pour le bien de tous ceux qui le cherchent
  rationale: Le complément לְטוֹבָה indique une action bénéfique. L’ajout verbal « agit », implicite dans l’image de la main, donne une phrase française naturelle sans réduire la métaphore à la seule faveur.
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: mais sa force et sa colère
  rationale: Les deux substantifs coordonnés sont rendus séparément afin de préserver la distinction entre la puissance active de Dieu et sa colère.
- source_word: עַל כָּל עֹזְבָיו
  choice: sont contre tous ceux qui l’abandonnent
  rationale: עזב signifie quitter ou abandonner. « Abandonner » conserve ici la portée relationnelle forte sans recourir au terme plus archaïque « délaisser ».
theological_decisions:
- issue: Métaphore anthropomorphique de la main divine
  choice: Conserver « La main de notre Dieu », avec le verbe « agit »
  alternative: « La puissance de notre Dieu » ou « la faveur de notre Dieu »
  rationale: Le texte hébreu présente une image corporelle intentionnelle qui peut englober puissance, action et faveur. La traduire par une seule notion abstraite en réduirait la portée.
- issue: Rapport entre la recherche de Dieu et son action bénéfique
  choice: « agit pour le bien de tous ceux qui le cherchent »
  alternative: « repose favorablement sur tous ceux qui le cherchent »
  rationale: La formulation préserve l’affirmation du texte sans préciser davantage la nature de ce bien ni transformer la phrase en principe doctrinal plus systématique.
- issue: Opposition divine envers ceux qui abandonnent Dieu
  choice: Maintenir distinctes « sa force et sa colère »
  alternative: Fusionner en « sa puissante colère »
  rationale: L’hébreu coordonne deux réalités. Les garder distinctes conserve la tension entre la capacité d’agir de Dieu et sa colère, sans les assimiler.
translation_notes:
  register: Français international moderne, clair et digne. « Cavaliers » et « troupes » gardent la précision historique sans technicité excessive. « En chemin » est plus idiomatique que « sur le chemin » dans ce contexte. La métaphore biblique de la main est conservée et brièvement éclairée en note.
