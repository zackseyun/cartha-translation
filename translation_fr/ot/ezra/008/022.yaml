revisions:
- from: 'Car j’avais honte de demander au roi des troupes et des cavaliers pour nous protéger de l’ennemi en chemin[a]. En effet, nous avions dit au roi : « La main de notre Dieu agit pour le bien de tous ceux qui le cherchent[b], mais sa force et sa colère sont contre tous ceux qui l’abandonnent. »'
  to: 'Car j’avais honte de demander au roi des troupes et des cavaliers pour nous aider contre l’ennemi pendant le voyage[a], puisque nous avions dit au roi : « La main de notre Dieu est favorable à tous ceux qui le cherchent[b], mais sa force et sa colère sont contre tous ceux qui l’abandonnent. »'
  rationale: La révision conserve les termes militaires et les deux aspects de l’action divine, tout en évitant de réduire « aider » à la seule notion de protection. Elle corrige également la note lexicale afin de refléter l’ambiguïté légitime de la préposition hébraïque. « Est favorable à » exprime naturellement en français l’orientation bénéfique de la main divine, sans ajouter un verbe d’action absent du texte.
  reviewer_model: gpt-5.6-terra
