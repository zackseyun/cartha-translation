  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: fr
  text: 'Parmi les descendants de Joab : Obadia, fils de Yehiel, et, avec lui, 218 hommes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי יוֹאָב
  choice: Parmi les descendants de Joab
  rationale: Dans cette liste, מִן introduit un groupe issu de la famille de Joab. « Parmi les descendants de » exprime naturellement cette appartenance généalogique sans imposer l’idée de fils immédiats.
- source_word: עֹבַדְיָה
  choice: Obadia
  rationale: Translittération française claire du nom hébreu, qui conserve sa forme propre sans passer par une forme anglaise.
- source_word: בֶּן יְחִיאֵל
  choice: fils de Yehiel
  rationale: בֶּן est le terme filial habituel. « Yehiel » représente directement le nom hébreu dans une graphie accessible en français moderne.
- source_word: וְעִמּוֹ
  choice: et avec lui
  rationale: Cette formulation conserve la coordination hébraïque et indique que le nombre donné correspond aux personnes accompagnant le chef nommé.
- source_word: מָאתַיִם וּשְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: Le nombre hébreu signifie exactement « deux cent dix-huit ». Les chiffres conviennent au caractère recensitaire de la liste et en facilitent la lecture.
- source_word: הַזְּכָרִים
  choice: personnes de sexe masculin
  rationale: Le substantif désigne spécifiquement les membres masculins du groupe, sans indiquer explicitement qu’ils sont tous adultes. Cette formulation est plus exacte que « hommes » et plus naturelle pour des personnes que le substantif isolé « mâles ».
