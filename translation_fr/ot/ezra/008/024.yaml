base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: fr
  text: 'Puis, je mis à part douze des chefs des prêtres : Shérébia, Hashabia[a] et, avec eux, dix de leurs frères.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La syntaxe hébraïque est inhabituelle. On peut aussi comprendre Shérébia, Hashabia et les dix frères comme un groupe ajouté aux douze chefs des prêtres. Le mot rendu par « frères » peut désigner plus largement des proches parents ou des membres du même groupe.
    reason: textual_syntax_and_lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: Puis je mis à part
  rationale: Le hifil de בדל exprime l’action de séparer ou de mettre à part. « Mis à part » convient à la désignation de personnes chargées d’une mission particulière, tandis que « Puis » marque la progression du récit.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: des chefs des prêtres
  rationale: שָׂרֵי désigne ici des chefs ou responsables. Le français « des chefs des prêtres » rend à la fois le sens partitif de מִן et la fonction dirigeante, sans employer le titre plus spécialisé de « grands prêtres ».
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Rendu direct du nombre cardinal.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: ainsi que Shérébia et Hashabia
  rationale: Les noms propres sont translittérés. Le לְ devant Shérébia rend la relation syntaxique difficile; dans le contexte, Shérébia et Hashabia paraissent s’ajouter aux douze chefs des prêtres, et « ainsi que » exprime cette lecture sans alourdir la phrase.
- source_word: וְעִמָּהֶם
  choice: et avec eux
  rationale: La conjonction et la locution prépositionnelle sont conservées afin de respecter la structure additive de l’hébreu.
- source_word: מֵאֲחֵיהֶם
  choice: de leurs frères
  rationale: אָח désigne littéralement un frère, mais peut aussi s’étendre à des parents ou à des membres du même groupe. « Frères » conserve le terme familial masculin du texte source.
- source_word: עֲשָׂרָה
  choice: dix
  rationale: Rendu direct du nombre cardinal.
theological_decisions:
- issue: Relation de Shérébia, Hashabia et des dix hommes avec les douze chefs des prêtres
  choice: Ils sont présentés comme un groupe ajouté aux douze chefs des prêtres.
  alternative: Shérébia, Hashabia et leurs dix frères pourraient constituer ensemble les douze hommes déjà mentionnés.
  rationale: La préposition לְ devant Shérébia et le contexte proche, où Shérébia et Hashabia sont associés aux Lévites, favorisent une addition au groupe des douze prêtres. Comme la syntaxe hébraïque reste difficile et a donné lieu à l’autre analyse, celle-ci est signalée en note plutôt que supprimée.
translation_notes:
  register: Français moderne, sobre et digne. « Chefs des prêtres » évite de confondre ces responsables avec le grand prêtre. La formulation principale reste fluide tout en maintenant en note l’ambiguïté réelle de la syntaxe et la portée possible de « frères ».
