  text: 'And from the sons of Adin: Ebed son of Jonathan[a], and with him fifty males.'
translation:
  language: fr
  text: 'Et des fils d’Adîn : Ébed, fils de Jonathan, et avec lui cinquante hommes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mâles ». Le terme hébreu désigne expressément des personnes de sexe masculin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Des fils de
  rationale: Dans cette liste généalogique, בְּנֵי désigne les membres du clan ou les descendants d’un ancêtre. « Des fils de » conserve la forme traditionnelle et concise du texte hébreu. La conjonction initiale est naturellement absorbée par l’enchaînement de la liste en français.
- source_word: עָדִין
  choice: Adîn
  rationale: Nom propre translittéré ; l’accent circonflexe aide à représenter la voyelle longue du nom hébreu tout en suivant un usage français attesté.
- source_word: עֶבֶד
  choice: Ébed
  rationale: Il s’agit ici d’un nom propre, et non du nom commun signifiant « serviteur » ou « esclave ». La forme « Ébed » reflète directement l’hébreu et convient à la phonologie française.
- source_word: בֶּן
  choice: fils de
  rationale: Formule généalogique standard, exacte et naturelle en français.
- source_word: יוֹנָתָן
  choice: Jonathan
  rationale: Forme française courante du nom propre hébreu.
- source_word: וְ/עִמּוֹ
  choice: et avec lui
  rationale: Cette formulation conserve la conjonction et indique que le nombre donné correspond au groupe accompagnant Ébed.
- source_word: חֲמִשִּׁים
  choice: cinquante
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: הַזְּכָרִים
  choice: hommes
  rationale: Dans ce relevé de personnes, « hommes » est le terme français naturel pour désigner des êtres humains de sexe masculin. La précision lexicale du mot hébreu, qui signifie littéralement « mâles », est conservée en note.
