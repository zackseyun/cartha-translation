  text: וּ/מִ/בְּנֵ֥י שְׁלוֹמִ֖ית בֶּן יוֹסִפְיָ֑ה וְ/עִמּ֕/וֹ מֵאָ֥ה וְ/שִׁשִּׁ֖ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/010.yaml
  text: And from the sons of Shelomith[a], the son of Josiphiah, and with him 160 males.
translation:
  language: fr
  text: 'Et parmi les fils de Shelomith[a], fils de Yosiphia : avec lui, 160 hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants de Shelomith » ; l’hébreu dit littéralement « fils de Shelomith ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Parmi les fils de
  rationale: La préposition מִן a ici une valeur partitive dans la liste, rendue naturellement par « parmi ». « Fils de » conserve la désignation généalogique ou clanique de l’hébreu.
- source_word: שְׁלוֹמִית
  choice: Shelomith
  rationale: Le nom propre est translittéré sous une forme proche de l’hébreu et courante dans les traductions françaises.
- source_word: בֶּן יוֹסִפְיָה
  choice: le fils de Yosiphia
  rationale: Cette apposition identifie Shelomith par son père. L’article défini rend la construction naturelle en français sans ajouter d’information.
- source_word: וְעִמּוֹ
  choice: accompagné de
  rationale: Dans cette liste, l’expression indique le groupe qui accompagne le chef nommé. Cette formulation évite la lourdeur de « et avec lui » tout en conservant le rapport syntaxique.
- source_word: מֵאָה וְשִׁשִּׁים
  choice: '160'
  rationale: Les chiffres offrent une présentation claire et moderne des effectifs d’une liste.
- source_word: הַזְּכָרִים
  choice: personnes de sexe masculin
  rationale: Le terme hébreu désigne spécifiquement les mâles, sans imposer qu’ils soient tous adultes. Cette formulation est plus exacte que « hommes », malgré son caractère légèrement administratif.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et adapté à une liste généalogique. La ponctuation met en relief l’entrée de liste, tandis que « personnes de sexe masculin » préserve la précision du terme hébreu.
