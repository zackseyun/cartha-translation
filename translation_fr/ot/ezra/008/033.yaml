base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: fr
  text: Le quatrième jour, l’argent, l’or et les objets[a] furent pesés dans la maison de notre Dieu, sous la responsabilité[b] de Merémoth, fils d’Urie, le prêtre. Éléazar, fils de Phinéas, était avec lui; avec eux se trouvaient Jozabad, fils de Josué, et Noâdia, fils de Binnouï, les lévites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les objets ou ustensiles du temple.
    reason: cultural_note
  - marker: b
    text: Ou « sous la garde de ». Littéralement, « sous la main de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: Le quatrième jour
  rationale: Cette formulation naturelle marque la suite chronologique du récit sans ajouter « après cela », absent de l’hébreu.
- source_word: נִשְׁקַל
  choice: furent pesés
  rationale: Le nifal exprime ici une opération passive et officielle. Malgré la forme verbale hébraïque au singulier, le français demande le pluriel avec les trois éléments coordonnés.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: l’argent, l’or et les objets
  rationale: Dans ce contexte d’inventaire du temple, כֵּלִים désigne divers objets ou ustensiles. « Objets » reste naturel et suffisamment large, tandis qu’une note précise leur caractère cultuel.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: dans la maison de notre Dieu
  rationale: La traduction conserve l’expression hébraïque et sa tonalité communautaire plutôt que de l’expliciter directement par « temple ».
- source_word: עַל יַד
  choice: remis entre les mains de
  rationale: L’expression idiomatique évoque une remise sous la garde ou la responsabilité de quelqu’un. La formulation française garde l’image de la main tout en rendant clairement la fonction administrative.
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: Merémoth, fils d’Urie, le prêtre
  rationale: Les formes françaises traditionnelles et intelligibles des noms sont retenues. La construction appositive suit de près l’hébreu sans développer davantage l’identification du prêtre.
- source_word: וְעִמּוֹ ... וְעִמָּהֶם
  choice: était avec lui, ainsi que
  rationale: Cette restructuration légère évite une coordination lourde en français tout en conservant les deux groupes d’accompagnateurs.
- source_word: יוֹזָבָד בֶּן יֵשׁוּעַ וְנֽוֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: les lévites Yozabad, fils de Josué, et Noadia, fils de Binnouï
  rationale: Le déplacement de « les lévites » avant les deux noms indique clairement que le terme hébreu pluriel qualifie ces deux hommes, tout en produisant une phrase française fluide.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe est légèrement réorganisée pour éviter les enchaînements pesants, tout en conservant la maison de Dieu, l’image des mains et l’identification des responsables.
