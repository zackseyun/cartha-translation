    text: C’est-à-dire les objets ou ustensiles du temple.
    reason: cultural_note
  - marker: b
    text: Ou « sous la garde de ». Littéralement, « sous la main de ».
    reason: lexical_alternative
  revision_rationale: La révision supprime l’ajout d’un second acte de remise tout en exprimant naturellement la fonction de garde portée par l’idiome hébreu. Elle conserve aussi explicitement les deux niveaux d’accompagnement indiqués dans le texte source. Les ancres de notes demeurent attachées aux termes qu’elles éclairent.
