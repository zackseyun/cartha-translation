revisions:
- from: Le quatrième jour, l’argent, l’or et les objets[a] furent pesés dans la maison de notre Dieu et remis entre les mains[b] de Merémoth, fils d’Urie, le prêtre. Éléazar, fils de Phinéas, était avec lui, ainsi que les lévites Yozabad, fils de Josué, et Noadia, fils de Binnouï.
  to: Le quatrième jour, l’argent, l’or et les objets[a] furent pesés dans la maison de notre Dieu, sous la responsabilité[b] de Merémoth, fils d’Urie, le prêtre. Éléazar, fils de Phinéas, était avec lui; avec eux se trouvaient Jozabad, fils de Josué, et Noâdia, fils de Binnouï, les lévites.
  rationale: La révision supprime l’ajout d’un second acte de remise tout en exprimant naturellement la fonction de garde portée par l’idiome hébreu. Elle conserve aussi explicitement les deux niveaux d’accompagnement indiqués dans le texte source. Les ancres de notes demeurent attachées aux termes qu’elles éclairent.
