  text: כִּ֤י עֶזְרָא֙ הֵכִ֣ין לְבָב֔/וֹ לִ/דְר֛וֹשׁ אֶת תּוֹרַ֥ת יְהוָ֖ה וְ/לַ/עֲשֹׂ֑ת וּ/לְ/לַמֵּ֥ד בְּ/יִשְׂרָאֵ֖ל חֹ֥ק וּ/מִשְׁפָּֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: fr
  text: Car Esdras avait résolu dans son cœur[a] d’étudier[b] la loi[c] de Yahweh[d], de la mettre en pratique et d’enseigner en Israël les prescriptions et les règles de droit[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avait préparé (ou disposé) son cœur »; l’expression hébraïque marque une résolution intérieure délibérée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de rechercher » ou « d’examiner »; le verbe peut associer recherche attentive et engagement envers la loi.'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu Torah peut aussi se traduire par « instruction ».
    reason: lexical_alternative
  - marker: d
    text: Le texte hébreu porte le nom divin YHWH, rendu ici par « Yahweh ».
    reason: alternative_reading
  - marker: e
    text: 'Littéralement : « prescription et jugement »; les deux noms singuliers peuvent avoir ici un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de la faveur accordée à Esdras dans le contexte précédent.
- source_word: הֵכִין לְבָבוֹ
  choice: avait résolu dans son cœur
  rationale: Cette formulation française naturelle conserve l’idée hébraïque d’une disposition intérieure ferme et délibérée.
- source_word: לִדְרוֹשׁ
  choice: d’étudier
  rationale: Dans le contexte de l’activité sacerdotale et scribale d’Esdras, le verbe désigne l’examen attentif de la loi, tout en pouvant aussi évoquer le fait de la rechercher.
- source_word: תּוֹרַת
  choice: la loi
  rationale: Dans ce contexte postexilique, תּוֹרָה renvoie à la loi de l’alliance; « loi » est clair et reconnaissable en français, sans exclure le sens fondamental d’instruction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: וְלַעֲשֹׂת
  choice: de la mettre en pratique
  rationale: Le complément sous-entendu est la loi; cette expression rend naturellement l’idée de l’accomplir concrètement, sans réduire le verbe à une simple activité abstraite.
- source_word: וּלְלַמֵּד
  choice: et d’enseigner
  rationale: Le piel de למד signifie directement « enseigner » ou « instruire ».
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition indique ici le cadre communautaire dans lequel Esdras devait enseigner.
- source_word: חֹק וּמִשְׁפָּט
  choice: les prescriptions et les règles de droit
  rationale: Les singuliers hébreux ont une valeur collective. Cette formulation conserve les deux catégories juridiques tout en restant naturelle en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le rend explicitement plutôt que de lui substituer un titre.
- issue: Portée de תּוֹרָה
  choice: la loi
  alternative: l’instruction ou la Torah
  rationale: Le contexte sacerdotal et scribal vise la loi de l’alliance, mais une note préserve la portée pédagogique plus large du terme.
- issue: Rapport entre étude et obéissance
  choice: de la mettre en pratique
  alternative: de l’accomplir
  rationale: 'L’objet implicite du verbe est la loi. Le rendu maintient la séquence du texte: étudier, pratiquer, puis enseigner.'
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression ternaire du texte hébreu — étudier, pratiquer, enseigner — ainsi que son vocabulaire juridique, tout en explicitant seulement le complément implicite de « mettre en pratique ».
