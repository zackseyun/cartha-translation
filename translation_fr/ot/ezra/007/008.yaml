  text: וַ/יָּבֹ֥א יְרוּשָׁלִַ֖ם בַּ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֑י הִ֛יא שְׁנַ֥ת הַ/שְּׁבִיעִ֖ית לַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/008.yaml
  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: fr
  text: Il arriva à Jérusalem au cinquième mois[a] de la septième année du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il arriva à Jérusalem au cinquième mois. C’était la septième année du roi. »'
    reason: Alternative syntaxique reflétant la possibilité de comprendre הִיא comme ouvrant une proposition distincte plutôt que comme reliant directement les deux indications chronologiques.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Il arriva
  rationale: Le verbe בוא précédé du waw consécutif fait avancer le récit. « Il arriva » exprime naturellement en français l’aboutissement du déplacement vers Jérusalem.
- source_word: יְרוּשָׁלִַם
  choice: à Jérusalem
  rationale: Nom propre rendu selon l’usage français courant; la préposition « à » convient au verbe de mouvement.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: au cinquième mois
  rationale: La préposition ב a ici une valeur temporelle. « Au cinquième mois » conserve directement la désignation calendaire hébraïque.
- source_word: הִיא
  choice: de
  rationale: Le pronom féminin relie la date du mois à l’indication de l’année de règne. En français, cette relation s’exprime naturellement par « au cinquième mois de la septième année », sans pronom explicite.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: la septième année
  rationale: La construction nominale indique l’année de règne; l’ordinal français en donne le sens avec clarté.
- source_word: לַמֶּלֶךְ
  choice: du roi
  rationale: Le ל marque ici la relation servant à dater l’événement selon le règne du roi. Le nom du roi, connu par le contexte, n’est pas ajouté au texte du verset.
