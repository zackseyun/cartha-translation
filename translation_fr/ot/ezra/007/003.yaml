  choice: fils de
  rationale: Dans cette liste généalogique, « fils de » est la formulation française la plus naturelle et la plus transparente. Selon l’usage biblique, le terme peut aussi désigner un descendant plus éloigné.
- source_word: אֲמַרְיָה
  choice: Amaria
  rationale: Nom propre translittéré selon une forme française claire et usuelle, sans conserver le h final non prononcé des conventions anglaises.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Nom propre rendu selon la forme française biblique courante.
- source_word: מְרָיוֹת
  choice: Merayoth
  rationale: Translittération française qui rend distinctement les consonnes et la semi-voyelle du nom hébreu.
