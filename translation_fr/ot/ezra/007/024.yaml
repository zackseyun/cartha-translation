  to: Nous vous faisons savoir qu’il n’est pas permis de lever tribut, impôt ou péage[a] sur aucun des prêtres, des lévites, des chanteurs, des gardiens des portes, des serviteurs du Temple[b] ou des serviteurs de cette maison de Dieu.
  rationale: La révision retire l’ajout interprétatif « aussi » et adopte une formulation juridique française plus idiomatique, sans modifier le sens ni effacer la distinction entre les Nethinim et les autres serviteurs de la maison de Dieu. Les ancres et le contenu des notes restent appropriés.
