source:
  edition: WLC
  text: וּ/לְ/כֹ֣ם מְהוֹדְעִ֗ין דִּ֣י כָל כָּהֲנַיָּ֣/א וְ֠/לֵוָיֵ/א זַמָּ֨רַיָּ֤/א תָרָֽעַיָּ/א֙ נְתִ֣ינַיָּ֔/א וּ/פָ֣לְחֵ֔י בֵּ֖ית אֱלָהָ֣/א דְנָ֑ה מִנְדָּ֤ה בְלוֹ֙ וַ/הֲלָ֔ךְ לָ֥א שַׁלִּ֖יט לְ/מִרְמֵ֥א עֲלֵי/הֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: fr
  text: Nous vous faisons savoir qu’il n’est pas permis de lever tribut, impôt ou péage[a] sur aucun des prêtres, des lévites, des chanteurs, des gardiens des portes, des serviteurs du Temple[b] ou des serviteurs de cette maison de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les trois termes fiscaux distinguent probablement plusieurs sortes de prélèvements impériaux ; on pourrait aussi traduire : « tribut, droit de douane ou droit de transit ».'
    reason: lexical_alternative
  - marker: b
    text: 'Araméen : Nethinim, nom traditionnel de ce groupe de serviteurs du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: nous vous faisons savoir
  rationale: Le participe araméen de ידע appartient ici à une formule officielle de notification. Cette tournure conserve le ton administratif tout en restant naturelle en français.
- source_word: כָל
  choice: aucun des
  rationale: Dans une interdiction portant sur les catégories énumérées, « aucun des » exprime naturellement en français que nul membre de ces groupes ne peut être soumis aux prélèvements.
- source_word: כָּהֲנַיָּא
  choice: prêtres
  rationale: Désignation française courante de la classe sacerdotale.
- source_word: לֵוָיֵא
  choice: lévites
  rationale: Désignation traditionnelle et claire des membres de la tribu de Lévi affectés au service cultuel.
- source_word: זַמָּרַיָּא
  choice: chanteurs
  rationale: Le terme désigne les personnes chargées du chant cultuel; « chanteurs » est direct, actuel et compréhensible.
- source_word: תָרָעַיָּא
  choice: gardiens des portes
  rationale: Le mot désigne ceux qui surveillent ou desservent les portes; cette expression rend leur fonction sans archaïsme.
- source_word: נְתִינַיָּא
  choice: serviteurs du Temple
  rationale: Plutôt qu’une translittération opaque, cette traduction communique la fonction de ce groupe affecté au service du sanctuaire; une note conserve le nom traditionnel.
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: serviteurs de cette maison de Dieu
  rationale: La formulation garde la catégorie générale de ceux qui servent dans la maison de Dieu, sans ajouter « autres », absent du texte source.
- source_word: מִנְדָּה
  choice: tribut
  rationale: Ce terme administratif désigne une contribution imposée ou un tribut et doit rester distinct des deux prélèvements suivants.
- source_word: בְלוֹ
  choice: impôt
  rationale: « Impôt » fournit un terme fiscal général tout en maintenant la triple formule administrative.
- source_word: וַהֲלָךְ
  choice: péage
  rationale: Le terme est souvent compris comme un droit de passage, de transit ou de douane; « péage » le distingue clairement des autres prélèvements.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: il n’est permis d’imposer … à aucun
  rationale: Cette formulation française rend l’absence d’autorisation légale exprimée par l’araméen et conserve la portée juridique de l’interdiction.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne, avec maintien du ton juridique et administratif du décret. La répétition de « serviteurs » est conservée parce que l’araméen distingue les Nethinim du groupe plus général des serviteurs de la maison de Dieu.
