reference: Ezra 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/מַלְכ֖וּת אַרְתַּחְשַׁ֣סְתְּא מֶֽלֶךְ פָּרָ֑ס עֶזְרָא֙ בֶּן שְׂרָיָ֔ה בֶּן עֲזַרְיָ֖ה בֶּן חִלְקִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: fr
  text: Après ces événements, sous le règne d’Artaxerxès, roi de Perse, Esdras, fils de Seraya[a], fils d’Azaria, fils de Hilqiya —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans une généalogie, l’expression hébraïque traduite par « fils de » peut aussi désigner un descendant plus éloigné, et pas seulement un fils immédiat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Après
  rationale: Le waw relie cette nouvelle section à ce qui précède, mais le français narratif exprime naturellement cette transition par « Après » sans ajouter un lourd « Et » initial.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces événements
  rationale: Dans ce contexte narratif, דְּבָרִים désigne les faits précédemment rapportés. « Ces événements » est plus naturel et précis en français actuel que le calque « ces choses ».
- source_word: בְּ/מַלְכוּת
  choice: sous le règne de
  rationale: Le terme désigne ici la période pendant laquelle le roi exerce le pouvoir, non le territoire de son royaume.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: Artaxerxès
  rationale: Forme française traditionnelle et reconnue du nom royal perse.
- source_word: מֶלֶךְ פָּרָס
  choice: roi de Perse
  rationale: Cette apposition identifie le souverain de manière concise et idiomatique en français.
- source_word: עֶזְרָא
  choice: Esdras
  rationale: Forme française biblique établie du nom.
- source_word: בֶּן
  choice: fils de
  rationale: Cette formule conserve la forme généalogique hébraïque. Comme בֶּן peut aussi signaler une descendance plus éloignée, cette portée est précisée en note plutôt que neutralisée dans le texte.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Translittération française claire du nom hébreu.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Forme française biblique usuelle du nom.
- source_word: חִלְקִיָּה
  choice: Hilqiya
  rationale: Translittération qui représente distinctement les consonnes du nom hébreu tout en restant lisible en français.
