base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: fr
  text: Quant au reste de l’argent et de l’or, toi et tes frères, vous en ferez ce qui vous paraîtra bon[a], conformément à la volonté de votre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui semblera bon à toi et à tes frères ». L’expression araméenne peut se rendre de manière plus formelle par « ce qui sera bon pour toi et tes frères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au désir de votre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: ce qui
  rationale: Cette tournure rend naturellement en français la proposition relative indéfinie introduite par l’araméen, dans la construction « vous en ferez ce qui… ».
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: toi et tes frères, … ce qui vous paraîtra bon
  rationale: La formulation française exprime l’idée de ce qui paraît bon ou judicieux aux personnes concernées, tout en conservant le terme de parenté « frères ». Le détachement « toi et tes frères » rend aussi perceptible le passage du destinataire singulier au groupe.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: Quant au reste de l’argent et de l’or
  rationale: « Le reste » désigne clairement les fonds qui demeurent après l’usage mentionné auparavant. « Quant à » permet une phrase française fluide sans préciser davantage l’emploi de ces fonds.
- source_word: לְמֶעְבַּד
  choice: vous en ferez
  rationale: Le verbe araméen est général. Le pronom « en » rattache naturellement l’action au reste de l’argent et de l’or, sans remplacer le verbe général par un terme plus interprétatif comme « utiliserez ».
- source_word: כִּרְעוּת
  choice: conformément à la volonté
  rationale: Le nom peut désigner la volonté, le désir ou le bon plaisir. « Volonté » convient au registre officiel du décret tout en conservant le rapport à l’intention divine.
- source_word: אֱלָהֲכֹם
  choice: votre Dieu
  rationale: Le possessif est pluriel dans le texte et renvoie précisément au Dieu d’Esdras et de ses compagnons. La majuscule signale ce référent défini.
- source_word: תַּעַבְדוּן
  choice: vous en ferez
  rationale: La forme plurielle porte ici la valeur d’une autorisation ayant force de directive. Le futur français s’accorde au ton du décret et évite de trancher excessivement entre ordre et permission.
theological_decisions:
- issue: Sens de כִּרְעוּת appliqué à Dieu
  choice: la volonté de votre Dieu
  alternative: le désir de votre Dieu
  rationale: « Volonté » est naturel dans ce décret et ne réduit pas le terme à une préférence subjective; une note conserve toutefois l’autre nuance lexicale possible.
- issue: Identification de אֱלָהֲכֹם
  choice: votre Dieu
  alternative: votre dieu
  rationale: Le contexte identifie le Dieu adoré par Esdras et ses compagnons; la majuscule marque cette référence précise sans ajouter de qualification doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase met en tête les fonds restants, puis détache « toi et tes frères » afin de rendre naturellement le destinataire singulier associé à son groupe, avant le verbe pluriel du texte araméen. Les notes préservent les nuances de l’idiome « être/paraître bon » et du nom signifiant « volonté » ou « désir ».
