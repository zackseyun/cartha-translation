source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: fr
  text: Béni soit Yahweh, le Dieu de nos pères, qui a mis cela dans le cœur du roi afin d’embellir[a] la maison de Yahweh qui est à Jérusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’orner » ou « de glorifier ».
    reason: Le verbe hébreu peut exprimer l’embellissement concret, l’ornement ou la mise en gloire et en honneur.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif employé dans cette formule de louange se rend naturellement en français par « Béni soit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: le Dieu de nos pères
  rationale: Cette formulation conserve l’expression hébraïque traditionnelle et son caractère d’évocation de l’histoire d’Israël.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: qui a mis cela dans le cœur du roi
  rationale: « Mettre dans le cœur » restitue naturellement l’idée d’une intention suscitée intérieurement; « cela » reprend sobrement le démonstratif כָּזֹאת.
- source_word: לְפָאֵר
  choice: afin d’embellir
  rationale: Dans ce contexte, le piel de פאר évoque le fait de rendre la maison splendide. « Embellir » garde ce sens concret sans exclure les nuances d’ornement et de mise en honneur.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image et l’expression hébraïques, tout en désignant clairement le temple dans le contexte.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: qui est à Jérusalem
  rationale: Cette relative localise simplement et naturellement la maison de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin; sa translittération préserve sa valeur de nom personnel sans le remplacer par un titre.
- issue: Portée de לְפָאֵר appliqué au temple
  choice: afin d’embellir
  alternative: afin de glorifier
  rationale: Le contexte permet une dimension honorifique, mais le verbe vise ici concrètement la splendeur de la maison. Le choix principal conserve ce sens sans imposer une lecture théologique plus abstraite.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la formule de bénédiction et l’image hébraïque du cœur sans lourdeur inutile. La virgule finale respecte le fait que la phrase se poursuit au verset suivant.
