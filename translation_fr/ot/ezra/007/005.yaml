id: EZR.7.5
reference: Ezra 7:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֶּן אֲבִישׁ֗וּעַ בֶּן פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן הָ/רֹֽאשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/005.yaml
  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: fr
  text: fils d’Abishoua[a], fils de Phinéas, fils d’Éléazar, fils d’Aaron, le prêtre en chef[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans une généalogie, « fils de » peut aussi avoir le sens plus large de « descendant de ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le prêtre, le chef ». Traduction traditionnelle : « le grand prêtre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: fils de
  rationale: La formule généalogique répétée désigne directement la filiation. « Fils de » conserve la forme hébraïque, tout en laissant la note préciser que les généalogies peuvent omettre des générations.
- source_word: אֲבִישׁוּעַ
  choice: Abishoua
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: פִּינְחָס
  choice: Phinéas
  rationale: Forme française biblique bien établie et immédiatement reconnaissable.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Forme française biblique usuelle du nom propre.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: le prêtre en chef
  rationale: Cette formulation française naturelle exprime la primauté indiquée par רֹאשׁ, littéralement « tête » ou « chef », sans substituer au texte l’expression hébraïque plus habituelle pour « grand prêtre ».
theological_decisions:
- issue: Titre sacerdotal d’Aaron
  choice: le prêtre en chef
  alternative: le grand prêtre
  rationale: L’hébreu dit littéralement « le prêtre, le chef » et n’emploie pas ici le titre plus habituel הַכֹּהֵן הַגָּדוֹל. « Prêtre en chef » préserve cette différence lexicale sans nier la primauté sacerdotale d’Aaron.
- issue: Portée généalogique de בֶּן
  choice: fils de
  alternative: descendant de
  rationale: La traduction principale garde la répétition formelle de l’hébreu. Une note signale que, dans une généalogie, « fils » peut aussi marquer une descendance plus éloignée.
translation_notes:
  register: Français moderne, sobre et digne. La répétition généalogique de « fils de » est maintenue, tandis que « prêtre en chef » rend naturellement la construction hébraïque inhabituelle.
