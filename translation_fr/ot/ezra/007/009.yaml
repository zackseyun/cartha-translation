    issue: La conjonction « car » et le verbe « reposait » interprètent la formule כְּיָד אֱלֹהָיו הַטּוֹבָה עָלָיו.
    rationale: Le texte rattache l’arrivée à « la bonne main de son Dieu sur lui » par כְּ, que l’anglais POB rend « according to ». Une formulation française avec « selon » préserve mieux cette relation sans convertir la formule en explication causale complète.
