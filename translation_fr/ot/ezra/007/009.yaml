  text: כִּ֗י בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן ה֣וּא יְסֻ֔ד הַֽ/מַּעֲלָ֖ה מִ/בָּבֶ֑ל וּ/בְ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֗י בָּ֚א אֶל יְר֣וּשָׁלִַ֔ם כְּ/יַד אֱלֹהָ֖י/ו הַ/טּוֹבָ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: fr
  text: En effet, le premier jour du premier mois, il commença la montée depuis Babylone, et le premier jour du cinquième mois, il arriva à Jérusalem, selon la bonne main de son Dieu sur lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: il entreprit de monter
  rationale: L’expression emploie littéralement un verbe lié au fait de fonder ou d’établir, avec « la montée ». Dans ce contexte de voyage de Babylone à Jérusalem, elle désigne le commencement effectif de la montée; « entreprit de monter » reste naturel tout en conservant l’image biblique de la montée vers Jérusalem.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: car la bonne main de son Dieu reposait sur lui
  rationale: La « main » est conservée comme métaphore concrète de la faveur et de l’action protectrice de Dieu. La préposition כְּ est comprise ici dans sa valeur circonstancielle ou causale, conformément au contexte.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: Idiome hébreu indiquant le premier jour d’un mois; la formulation française explicite naturellement « jour ».
theological_decisions:
- issue: Rapport entre l’arrivée d’Esdras et la main de Dieu
  choice: car la bonne main de son Dieu reposait sur lui
  alternative: selon que la bonne main de son Dieu était sur lui
  rationale: Le texte attribue le succès du voyage à la faveur active de Dieu. « Car » exprime clairement ce rapport sans préciser davantage le mode de l’intervention divine.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore de la « bonne main » est maintenue, de même que la montée depuis Babylone vers Jérusalem.
