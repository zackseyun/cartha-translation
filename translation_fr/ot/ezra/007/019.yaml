source:
  edition: WLC
  text: וּ/מָֽאנַיָּ/א֙ דִּֽי מִתְיַהֲבִ֣ין לָ֔/ךְ לְ/פָלְחָ֖ן בֵּ֣ית אֱלָהָ֑/ךְ הַשְׁלֵ֕ם קֳדָ֖ם אֱלָ֥הּ יְרוּשְׁלֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: fr
  text: Quant aux ustensiles qui te sont remis pour le service de la maison de ton Dieu[a], remets-les dans leur intégralité[b] devant le Dieu de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le culte de la maison de ton Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « remets-les tous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: Quant aux ustensiles
  rationale: Le terme araméen désigne des objets ou récipients employés dans le temple. « Ustensiles » est naturel en français biblique moderne et convient à des objets destinés au service cultuel. La tournure « Quant aux » marque clairement la reprise de ces objets comme thème de l’ordre.
- source_word: דִּי
  choice: qui
  rationale: Le pronom relatif introduit la proposition décrivant les ustensiles ; « qui » est la forme française naturelle ici.
- source_word: מִתְיַהֲבִין לָךְ
  choice: te sont remis
  rationale: Le participe passif exprime des objets donnés ou confiés à Esdras. « Te sont remis » conserve le passif et convient au contexte administratif du décret.
- source_word: לְפָלְחָן
  choice: pour le service
  rationale: Le nom peut désigner le service, notamment cultuel. « Service » garde cette amplitude sans réduire nécessairement le sens au seul acte d’adoration.
- source_word: בֵּית אֱלָהָךְ
  choice: de la maison de ton Dieu
  rationale: Cette formulation rend directement la chaîne construite araméenne et désigne le temple comme la maison appartenant au Dieu d’Esdras.
- source_word: הַשְׁלֵם
  choice: remets-les tous
  rationale: L’impératif porte l’idée de livrer ou rendre intégralement les objets. « Remets-les tous » exprime idiomatiquement en français que l’ensemble des ustensiles doit être présenté sans manque.
- source_word: קֳדָם
  choice: devant
  rationale: « Devant » rend avec concision le sens spatial ou cérémoniel de « en présence de ».
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: le Dieu de Jérusalem
  rationale: La formule relie Dieu à Jérusalem dans le style administratif perse. La traduction directe ne précise pas davantage la nature exacte de cette relation.
theological_decisions:
- issue: Terminologie liée au temple
  choice: pour le service de la maison de ton Dieu
  alternative: pour le culte dans la maison de ton Dieu
  rationale: Le contexte est cultuel, mais le terme araméen reste plus large que le seul « culte ». « Service » préserve cette amplitude sans introduire une terminologie ecclésiastique ultérieure.
- issue: Portée de l’ordre הַשְׁלֵם
  choice: remets-les tous
  alternative: présente-les au complet
  rationale: L’ordre exige que les ustensiles soient intégralement livrés ou présentés devant Dieu. La formulation retenue reste concrète sans trancher inutilement entre remise administrative et présentation cérémonielle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton direct d’un décret officiel tout en évitant les archaïsmes. Les deux notes signalent les principales nuances lexicales du service cultuel et de la remise intégrale.
