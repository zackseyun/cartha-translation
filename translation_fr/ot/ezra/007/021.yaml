source:
  edition: WLC
  text: וּ֠/מִנִּ/י אֲנָ֞ה אַרְתַּחְשַׁ֤סְתְּא מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/כֹל֙ גִּזַּֽבְרַיָּ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה דִּ֣י כָל דִּ֣י יִ֠שְׁאֲלֶנְ/כוֹן עֶזְרָ֨א כָהֲנָ֜/ה סָפַ֤ר דָּתָ/א֙ דִּֽי אֱלָ֣הּ שְׁמַיָּ֔/א אָסְפַּ֖רְנָא יִתְעֲבִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: fr
  text: 'De ma part, moi, le roi Artaxerxès, je donne cet ordre à tous les trésoriers de la Transeuphratène[b] : tout ce qu’Esdras, le prêtre et scribe de la loi du Dieu du ciel, vous demandera devra être exécuté avec exactitude[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec soin » ou « sans délai » ; l’adverbe araméen souligne l’exécution rigoureuse et entière de l’ordre.
    reason: lexical_alternative
  - marker: b
    text: La « Transeuphratène » est le nom administratif perse de la région située à l’ouest de l’Euphrate.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: Et moi
  rationale: Rend de manière naturelle l’autorisation personnelle et l’insistance du double tour araméen « de ma part, moi », sans conserver une lourdeur artificielle en français.
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: le roi Artaxerxès
  rationale: Forme française courante du nom et ordre naturel du titre royal.
- source_word: שִׂים טְעֵם
  choice: je donne cet ordre
  rationale: L’expression araméenne désigne la promulgation d’un ordre officiel; cette formulation conserve le registre administratif tout en restant idiomatique.
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: à tous les trésoriers
  rationale: Désigne les responsables du trésor; « trésoriers » est précis, concis et adapté au contexte administratif.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: de la Transeuphratène
  rationale: Nom français de la circonscription perse située à l’ouest de l’Euphrate; l’article marque ici une région administrative.
- source_word: כָל דִּי יִשְׁאֲלֶנְכוֹן
  choice: tout ce qu’… vous demandera
  rationale: Reproduit l’ampleur de la relative indéfinie sans donner au verbe « demander » une force coercitive qu’il ne porte pas en lui-même.
- source_word: עֶזְרָא כָהֲנָה סָפַר דָּתָא
  choice: Esdras, le prêtre et scribe de la loi
  rationale: Conserve les deux qualifications d’Esdras ainsi que le titre traditionnel « scribe », qui réunit ici compétence savante et fonction officielle.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: du Dieu du ciel
  rationale: Rend directement le titre divin courant à l’époque perse, dans une formulation française consacrée et naturelle.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: devra être exécuté avec exactitude
  rationale: La tournure passive maintient le style du décret, tandis que « avec exactitude » exprime l’exécution soigneuse et complète indiquée par l’adverbe araméen.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et administratif. La formulation conserve l’insistance royale, les titres d’Esdras et la voix passive du décret, tout en évitant un calque lourd de l’araméen.
