id: EZR.7.12
reference: Ezra 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֨רְתַּחְשַׁ֔סְתְּא מֶ֖לֶךְ מַלְכַיָּ֑/א לְ/עֶזְרָ֣א כָ֠הֲנָ/א סָפַ֨ר דָּתָ֜/א דִּֽי אֱלָ֧הּ שְׁמַיָּ֛/א גְּמִ֖יר וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: fr
  text: 'Artaxerxès, roi des rois, à Esdras, le prêtre et scribe de la loi[a] du Dieu du ciel : paix parfaite[b]. Et maintenant —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « scribe du décret du Dieu du ciel », si דָּתָא est pris au sens administratif plus large de « décret » plutôt qu’au sens de « loi ».
    reason: lexical_alternative
  - marker: b
    text: La salutation araméenne est une formule épistolaire. « Paix parfaite » peut aussi se rendre par « paix complète » ou, de façon plus idiomatique, par « salutations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: Artaxerxès
  rationale: Nom royal propre, transcrit selon sa forme française établie.
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: roi des rois
  rationale: Rend directement le titre royal superlatif araméen dans une formulation française consacrée et naturelle.
- source_word: לְעֶזְרָ֣א
  choice: à Esdras
  rationale: La préposition introduit le destinataire de la lettre; « Esdras » est la forme française établie du nom.
- source_word: כָהֲנָא
  choice: le prêtre
  rationale: La forme déterminée araméenne est rendue par l’article défini; le titre est en apposition à Esdras.
- source_word: סָפַר דָּתָא
  choice: scribe de la loi
  rationale: סָפַר désigne un scribe; dans la description d’Esdras au service du Dieu du ciel, דָּתָא désigne vraisemblablement la loi divine, tout en gardant ailleurs le sens possible de « décret ».
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: du Dieu du ciel
  rationale: Reproduit sobrement la relation génitivale et le titre biblique établi.
- source_word: גְּמִיר
  choice: paix parfaite
  rationale: L’adjectif signifie « complet, parfait » et appartient ici à une formule épistolaire condensée; « paix parfaite » en conserve l’image sans la remplacer silencieusement par une simple salutation.
- source_word: וּכְעֶנֶת
  choice: Et maintenant —
  rationale: Formule de transition des lettres officielles vers leur contenu; le tiret signale que la suite vient au verset suivant.
theological_decisions:
- issue: Sens de דָּתָא dans la désignation de la fonction d’Esdras
  choice: la loi
  alternative: le décret
  rationale: Le mot peut désigner une loi, une règle ou un décret. Ici, son rattachement au « Dieu du ciel » et la fonction religieuse d’Esdras favorisent « loi », sans exclure l’autre valeur lexicale, indiquée en note.
- issue: Interprétation de la formule épistolaire גְּמִיר וּכְעֶנֶת
  choice: paix parfaite. Et maintenant —
  alternative: salutations. Et maintenant —
  rationale: La formulation retenue préserve le caractère condensé et quelque peu inhabituel de l’araméen, ainsi que la transition vers le corps de la lettre, au lieu de tout lisser en français idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la forme officielle de l’en-tête royal. Le tiret final marque explicitement que la transition se poursuit au verset suivant.
