source:
  edition: WLC
  text: וַ/יַּֽעֲל֣וּ מִ/בְּנֵֽי יִ֠שְׂרָאֵל וּ/מִן הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֜ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שֹּׁעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים אֶל יְרוּשָׁלִָ֑ם בִּ/שְׁנַת שֶׁ֖בַע לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: fr
  text: Des fils d’Israël[a], ainsi que des prêtres, des lévites, des chanteurs, des gardiens des portes et des serviteurs du Temple[b], montèrent à Jérusalem la septième année du règne du roi Artaxerxès.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites ». L’hébreu dit littéralement « des fils d’Israël » et indique qu’une partie d’entre eux monta à Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le terme technique « Netinim », qui désigne une catégorie de serviteurs attachés au Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה exprime la montée vers Jérusalem et conserve ici sa nuance géographique et cultuelle.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: Des fils d’Israël
  rationale: « Des » rend le sens partitif de מִן, tandis que « fils d’Israël » conserve l’expression hébraïque sans exclure son sens collectif.
- source_word: הַכֹּהֲנִים
  choice: prêtres
  rationale: Équivalent français courant du terme désignant les prêtres dans le service cultuel.
- source_word: הַלְוִיִּם
  choice: lévites
  rationale: Désignation française traditionnelle et précise de ce groupe tribal et cultuel.
- source_word: הַמְשֹׁרְרִים
  choice: chanteurs
  rationale: Le terme désigne spécifiquement ceux qui chantent dans le service du Temple; « chanteurs » est plus précis que « musiciens ».
- source_word: הַשֹּׁעֲרִים
  choice: gardiens des portes
  rationale: Cette expression claire rend la fonction des responsables des portes du Temple.
- source_word: הַנְּתִינִים
  choice: serviteurs du Temple
  rationale: Une traduction fonctionnelle rend compréhensible le rôle de ce groupe spécialisé, plutôt que de conserver une translittération opaque.
- source_word: בִּשְׁנַת שֶׁבַע לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: la septième année du règne du roi Artaxerxès
  rationale: La mention explicite du règne rend naturellement en français la datation par l’année du souverain, implicite dans la construction hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la montée vers Jérusalem, le caractère partitif de la liste et les catégories de personnel du Temple, tout en évitant une translittération obscure dans le texte principal.
