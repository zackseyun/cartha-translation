  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: fr
  text: Et toi, Esdras, conformément à la sagesse de ton Dieu qui est entre tes mains[a], nomme des magistrats et des juges pour juger tout le peuple qui se trouve au-delà du Fleuve — tous ceux qui connaissent les lois de ton Dieu. Quant à ceux qui ne les connaissent pas, vous les enseignerez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans ta main » ; cette expression peut désigner ce qu’Esdras possède ou l’autorité qui lui est confiée.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: conformément à la sagesse de ton Dieu
  rationale: La préposition כְּ exprime ici la conformité. « Conformément à » restitue clairement cette relation dans un français administratif naturel.
- source_word: דִּי בִידָךְ
  choice: qui est entre tes mains
  rationale: L’expression araméenne signifie littéralement « dans ta main » et peut évoquer ce qu’Esdras possède ou l’autorité qui lui est confiée. « Entre tes mains » conserve l’image tout en étant idiomatique en français.
- source_word: מֶנִּי
  choice: établis
  rationale: Dans ce contexte administratif, le verbe ordonne à Esdras de désigner officiellement des responsables. « Établis » convient au registre et n’exagère pas la technicité du geste.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: des magistrats et des juges
  rationale: Les deux termes semblent désigner deux catégories de responsables judiciaires. Une traduction distincte préserve le doublet administratif.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: pour juger
  rationale: La proposition relative indique la fonction ou la finalité des responsables établis. L’infinitif de but est naturel en français.
- source_word: לְכָל עַמָּה
  choice: tout le peuple
  rationale: Le singulier collectif araméen avec כּל est bien rendu par « tout le peuple ».
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: de la province située au-delà du Fleuve
  rationale: « Au-delà du Fleuve » est la désignation administrative perse du territoire à l’ouest de l’Euphrate. L’ajout explicatif « de la province située » rend la fonction géographique de la formule immédiatement intelligible.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: tous ceux qui connaissent les lois de ton Dieu
  rationale: דָּתֵי est pluriel et désigne ici les lois ou prescriptions divines. « Lois » conserve ce pluriel et convient au cadre juridico-religieux.
- source_word: וְדִי לָא יָדַע
  choice: Quant à ceux qui ne les connaissent pas
  rationale: La construction oppose ce groupe à ceux qui connaissent les lois. Le pronom « les » explicite en français l’objet sous-entendu, à savoir les lois.
- source_word: תְּהוֹדְעוּן
  choice: vous les enseignerez
  rationale: La forme causative signifie « faire connaître ». Dans le contexte des lois, « enseigner » en exprime naturellement le sens. Le pluriel du verbe est conservé par « vous », malgré l’adresse initiale au singulier, afin de préserver la variation grammaticale du texte araméen.
theological_decisions:
- issue: Variation entre l’adresse singulière à Esdras et le verbe final au pluriel
  choice: Conserver le singulier au début (« toi », « ton », « établis ») et le pluriel à la fin (« vous les enseignerez »).
  alternative: 'Harmoniser tout le verset au singulier : « tu les enseigneras ».'
  rationale: Le texte araméen passe effectivement du singulier au pluriel avec תְּהוֹדְעוּן. Le maintien de cette tension évite de corriger silencieusement le texte et peut laisser entendre qu’Esdras enseignera avec les responsables établis.
translation_notes:
  register: Français moderne, international et digne, avec un ton administratif adapté au décret royal. L’expression traditionnelle « au-delà du Fleuve » est conservée et expliquée. La variation source entre le singulier et le pluriel est volontairement maintenue.
