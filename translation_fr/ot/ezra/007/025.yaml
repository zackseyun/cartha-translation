  to: Et toi, Esdras, conformément à la sagesse de ton Dieu qui est entre tes mains[a], nomme des magistrats et des juges pour juger tout le peuple qui se trouve au-delà du Fleuve — tous ceux qui connaissent les lois de ton Dieu. Quant à ceux qui ne les connaissent pas, vous les enseignerez.
  rationale: La révision supprime l’ajout « province située », qui explicite au-delà de ce que dit la formule araméenne, tout en conservant son explication historique en note. « Nomme » reflète précisément l’instruction d’investir des responsables. Le pluriel final « vous les enseignerez » est maintenu, car תְּהוֹדְעוּן est au pluriel malgré l’adresse initiale à Esdras au singulier. Les deux appels de note restent correctement ancrés.
