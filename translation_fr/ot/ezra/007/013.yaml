  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: fr
  text: 'Je promulgue le décret suivant : quiconque, dans mon royaume, parmi le peuple d’Israël, ses prêtres[b] et les lévites, se porte volontaire[a] pour aller à Jérusalem avec toi est autorisé à y aller.


    [a] L’araméen souligne que cette démarche est librement consentie.


    [b] Le pronom renvoie probablement au peuple d’Israël ; il pourrait aussi renvoyer à un autre référent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’araméen souligne que cette démarche est librement consentie.
    reason: lexical_nuance
  - marker: b
    text: Le pronom renvoie probablement au peuple d’Israël ; il pourrait aussi renvoyer à un autre référent.
    reason: alternative_reading
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: Je promulgue le décret suivant
  rationale: La formule administrative araméenne signifie littéralement qu’un décret est établi de la part du roi. Cette formulation française exprime clairement à la fois l’origine royale et l’acte officiel de promulgation.
- source_word: כָל מִתְנַדַּב
  choice: quiconque … se porte volontaire
  rationale: Le participe à valeur réfléchie exprime une décision volontaire. « Se porte volontaire » rend naturellement cette nuance sans transformer la permission en ordre.
- source_word: בְּמַלְכוּתִי
  choice: dans mon royaume
  rationale: Le terme désigne le domaine soumis à l’autorité du roi ; « royaume » est transparent et convient au registre royal.
- source_word: מִן עַמָּה יִשְׂרָאֵל וְכָהֲנוֹהִי וְלֵוָיֵא
  choice: parmi le peuple d’Israël, ses prêtres et les lévites
  rationale: La préposition indique les groupes dont peuvent provenir les volontaires. La tournure avec « parmi » évite une formulation française lourde tout en conservant l’énumération araméenne.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: pour aller avec toi à Jérusalem
  rationale: La formulation rend simplement le déplacement vers Jérusalem et l’accompagnement d’Esdras.
- source_word: יְהָךְ
  choice: peut y aller
  rationale: Dans le contexte du décret, la forme verbale accorde une permission. « Peut y aller » préserve cette valeur plutôt que d’en faire une prédiction ou une obligation.
theological_decisions:
- issue: Référent du suffixe dans וְכָהֲנוֹהִי
  choice: ses prêtres, avec le peuple d’Israël comme référent probable
  alternative: ses prêtres à lui, avec un autre référent implicite ou contextuel
  rationale: Le suffixe masculin singulier se rattache naturellement à « peuple » en araméen, mais sa forme seule ne supprime pas toute possibilité d’un autre référent. Le texte principal suit la lecture contextuellement la plus probable et la note conserve l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le ton officiel d’un décret royal, tout en évitant le calque araméen « placer un décret ». L’énumération des groupes et la valeur permissive du dernier verbe sont maintenues.
