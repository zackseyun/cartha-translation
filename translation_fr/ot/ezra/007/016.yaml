id: EZR.7.16
reference: Ezra 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: fr
  text: ainsi que tout l’argent et l’or que tu trouveras dans toute la province de Babylone, avec l’offrande volontaire[a] du peuple et des prêtres, qu’ils donnent de leur plein gré pour la maison de leur Dieu[b] située à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le don volontaire ». Le terme araméen désigne ce qui est donné librement, en particulier dans un contexte lié au culte.
    reason: lexical_alternative
  - marker: b
    text: La « maison de leur Dieu » désigne le temple de Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל
  choice: ainsi que tout
  rationale: La conjonction rattache cet élément à l’instruction précédente, tandis que « tout » conserve la portée globale de כֹל.
- source_word: כְּסַף וּדְהַב
  choice: l’argent et l’or
  rationale: Rendu français courant de cette paire de métaux précieux; les articles conviennent aux biens que l’on doit recueillir.
- source_word: דִּי תְהַשְׁכַּח
  choice: que tu trouveras
  rationale: Le relatif suivi du verbe s’adresse directement à Esdras. Le futur est naturel en français dans cette instruction portant sur sa mission à venir.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: dans toute la province de Babylone
  rationale: מְדִינָה désigne ici une circonscription administrative de l’Empire perse.
- source_word: עִם
  choice: avec
  rationale: Ce terme ajoute les dons volontaires à l’argent et à l’or recueillis.
- source_word: הִתְנַדָּבוּת
  choice: l’offrande volontaire
  rationale: Le nom désigne un don consenti librement, avec ici une destination cultuelle. Le singulier collectif de l’araméen est conservé.
- source_word: עַמָּא וְכָהֲנַיָּא
  choice: du peuple et des prêtres
  rationale: Les deux groupes sont présentés comme les auteurs de l’offrande destinée au sanctuaire.
- source_word: מִתְנַדְּבִין
  choice: qu’ils donnent de leur plein gré
  rationale: Cette formulation rend le participe de la même racine que « offrande volontaire », tout en évitant en français une répétition lourde de « volontaire ».
- source_word: לְבֵית אֱלָהֲהֹם
  choice: pour la maison de leur Dieu
  rationale: Le sens littéral « maison » est conservé, ainsi que le possessif pluriel du texte; la préposition indique la destination du don.
- source_word: דִּי בִירוּשְׁלֶם
  choice: située à Jérusalem
  rationale: Cette tournure française naturelle conserve l’indication relative de lieu appliquée à la maison de Dieu.
theological_decisions:
- issue: Sens de « la maison de leur Dieu »
  choice: Conserver l’expression « maison de leur Dieu » dans le texte et expliquer qu’elle désigne le temple.
  alternative: Traduire directement par « le temple de leur Dieu ».
  rationale: Le rendu retenu préserve l’image et la formulation araméennes sans rendre le référent obscur grâce à la note.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste liée au contexte précédent par « ainsi que ». La répétition étymologique de la racine araméenne du don volontaire est perceptible dans le sens, mais assouplie pour produire un français naturel.
