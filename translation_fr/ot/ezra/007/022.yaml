lexical_decisions:
- source_word: עַד
  choice: jusqu’à
  rationale: Dans cette liste administrative, le terme indique la quantité maximale pouvant être fournie.
- source_word: כְּסַף
  choice: argent
  rationale: Le nom désigne ici le métal pesé en talents, plutôt que la monnaie de façon générale.
- source_word: כַּכְּרִין
  choice: talents
  rationale: Le terme araméen désigne une ancienne unité de poids; la conserver évite une conversion moderne incertaine.
- source_word: חִנְטִין
  choice: blé
  rationale: Le mot désigne précisément le blé, et non les céréales en général.
- source_word: כֹּרִין
  choice: kors
  rationale: Cette ancienne mesure de capacité pour les matières sèches est conservée par translittération.
- source_word: חֲמַר
  choice: vin
  rationale: Sens direct du terme dans cette liste de provisions.
- source_word: בַּתִּין
  choice: baths
  rationale: Le bath est une ancienne mesure de capacité pour les liquides; le nom de l’unité est conservé.
- source_word: מְשַׁח
  choice: huile
  rationale: Le texte dit simplement « huile »; préciser « huile d’olive » irait au-delà de sa formulation.
- source_word: מְלַח
  choice: sel
  rationale: Traduction directe du produit mentionné en dernier.
- source_word: דִּי לָא כְתָב
  choice: sans quantité fixée
  rationale: Littéralement, « qui n’est pas écrit »; dans ce décret administratif, l’expression signifie qu’aucune quantité déterminée n’est prescrite.
