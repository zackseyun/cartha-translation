  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: fr
  text: jusqu’à cent talents d’argent, jusqu’à cent kors de blé, jusqu’à cent baths de vin, jusqu’à cent baths d’huile, et du sel sans quantité fixée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui n’est pas écrit », c’est-à-dire sans quantité précisée.'
