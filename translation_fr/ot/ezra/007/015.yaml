  text: וּ/לְ/הֵיבָלָ֖ה כְּסַ֣ף וּ/דְהַ֑ב דִּֽי מַלְכָּ֣/א וְ/יָעֲט֗וֹ/הִי הִתְנַדַּ֨בוּ֙ לֶ/אֱלָ֣הּ יִשְׂרָאֵ֔ל דִּ֥י בִֽ/ירוּשְׁלֶ֖ם מִשְׁכְּנֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: fr
  text: et d’apporter l’argent et l’or que le roi et ses conseillers ont offerts de leur plein gré au Dieu d’Israël[a], dont la demeure est à Jérusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui demeure à Jérusalem ». L’araméen dit plus littéralement : « dont la demeure est à Jérusalem ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: et d’apporter
  rationale: L’infinitif araméen, précédé de la conjonction et de la préposition, poursuit l’énoncé du mandat royal. « Apporter » exprime naturellement le transport des biens jusqu’à Jérusalem sans en préciser le moyen.
- source_word: כְּסַף וּדְהַב
  choice: l’argent et l’or
  rationale: Les deux noms désignent ici des biens déterminés par la proposition relative qui suit; les articles définis sont donc naturels en français.
- source_word: מַלְכָּא וְיָעֲטוֹהִי
  choice: le roi et ses conseillers
  rationale: « Conseillers » rend le terme désignant les membres du conseil royal et conserve le cadre officiel de la lettre.
- source_word: הִתְנַדַּבוּ
  choice: ont offerts de leur plein gré
  rationale: Cette formulation exprime à la fois l’acte accompli d’offrande et son caractère volontaire, sans introduire le terme plus technique d’« offrande volontaire ».
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: au Dieu d’Israël
  rationale: Rendu direct de la désignation divine; la préposition indique que les biens sont consacrés au Dieu d’Israël.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: dont la demeure est à Jérusalem
  rationale: Cette formulation conserve l’expression nominale de l’araméen et son accent sur le lieu de résidence cultuelle, sans la remplacer dans le texte principal par un simple verbe.
theological_decisions:
- issue: Rapport de Dieu à Jérusalem dans מִשְׁכְּנֵהּ
  choice: dont la demeure est à Jérusalem
  alternative: qui demeure à Jérusalem
  rationale: Le texte araméen parle littéralement de la « demeure » de Dieu. La traduction maintient cette affirmation liée au temple et la tension théologique du texte, sans ajouter que Dieu serait limité spatialement à Jérusalem.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant la structure de la proposition relative araméenne et le caractère volontaire du don.
