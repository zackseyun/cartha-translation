revisions:
- from: Cet Esdras monta de Babylone. C’était un scribe habile, versé dans la loi de Moïse, que Yahweh, le Dieu d’Israël, avait donnée. Le roi lui accorda tout ce qu’il demandait, selon la main de Yahweh, son Dieu, qui était sur lui[a].
  to: Esdras monta de Babylone. C’était un scribe habile dans la loi de Moïse, que Yahweh, le Dieu d’Israël, avait donnée. Le roi lui accorda tout ce qu’il avait demandé, selon que la main de Yahweh, son Dieu, était sur lui[a].
  rationale: La révision améliore la fluidité du français tout en conservant les éléments lexicaux et l’ambiguïté de l’hébreu. Elle maintient explicitement la métaphore de la main de Yahweh et la valeur relationnelle de כְּ par « selon que », sans ajouter « bonne » ni interpréter l’idiome comme la seule faveur, puissance ou providence.
