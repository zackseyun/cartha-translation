  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: fr
  text: Esdras monta de Babylone. C’était un scribe habile dans la loi de Moïse, que Yahweh, le Dieu d’Israël, avait donnée. Le roi lui accorda tout ce qu’il avait demandé, selon que la main de Yahweh, son Dieu, était sur lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la main de Yahweh, son Dieu, était sur lui » peut évoquer sa faveur, sa puissance ou son assistance providentielle.
    reason: L’idiome hébreu possède plusieurs nuances possibles ; la note les signale sans en imposer une seule dans le texte.
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: monta de Babylone
  rationale: Le verbe עלה avec מן exprime la montée depuis un lieu, ici dans la perspective du voyage vers Jérusalem. « Monta » conserve cette orientation sans aplatir l’image.
- source_word: סֹפֵר מָהִיר
  choice: scribe habile, versé
  rationale: סֹפֵר désigne ici un scribe compétent dans les textes et la loi, tandis que מָהִיר évoque l’habileté ou l’expertise. La formulation française garde le titre de « scribe » tout en rendant clairement sa compétence.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: dans la loi de Moïse
  rationale: Dans ce contexte juridique et communautaire, « loi » rend תּוֹרָה de façon claire pour le grand public, tout en maintenant le lien explicite avec Moïse.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: que Yahweh, le Dieu d’Israël, avait donnée
  rationale: La relative se rapporte à la loi. Le plus-que-parfait situe naturellement ce don avant l’époque d’Esdras, et « Yahweh » transcrit le nom divin יהוה.
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: Le roi lui accorda tout ce qu’il demandait
  rationale: « Accorder » convient idiomatiquement à une requête. « Tout ce qu’il demandait » rend naturellement en français le singulier collectif כֹּל בַּקָּשָׁתוֹ.
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: selon la main de Yahweh, son Dieu, qui était sur lui
  rationale: La traduction conserve la métaphore concrète de la main divine et le כ comparatif (« selon »), sans réduire l’expression à la seule faveur, puissance ou providence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément à la donnée hébraïque et à la convention éditoriale fournie.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le tétragramme comme nom propre. Sa transcription préserve cette distinction sans lui substituer un titre.
- issue: Interprétation de la « main » de Dieu sur Esdras
  choice: Conserver la métaphore dans le texte principal
  alternative: parce que Yahweh le favorisait / grâce à la puissance de Yahweh
  rationale: L’expression peut évoquer la faveur, la puissance ou l’assistance providentielle de Dieu. La conserver évite de trancher une nuance que l’hébreu laisse ouverte.
translation_notes:
  register: Français international actuel, digne et accessible. « Scribe » conserve la fonction historique; « versé dans » exprime une expertise intellectuelle sans vocabulaire technique. La tournure inhabituelle « selon la main » est maintenue pour préserver au plus près l’image et la relation exprimées en hébreu, avec une note explicative.
