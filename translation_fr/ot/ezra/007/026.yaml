source:
  edition: WLC
  text: וְ/כָל דִּי לָא֩ לֶהֱוֵ֨א עָבֵ֜ד דָּתָ֣/א דִֽי אֱלָהָ֗/ךְ וְ/דָתָ/א֙ דִּ֣י מַלְכָּ֔/א אָסְפַּ֕רְנָא דִּינָ֕/ה לֶהֱוֵ֥א מִתְעֲבֵ֖ד מִנֵּ֑/הּ הֵ֤ן לְ/מוֹת֙ הֵ֣ן ל/שרשו הֵן לַ/עֲנָ֥שׁ נִכְסִ֖ין וְ/לֶ/אֱסוּרִֽין־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: fr
  text: 'Quiconque n’obéira pas à la loi de ton Dieu et à la loi du roi, qu’une décision judiciaire soit promptement appliquée contre lui : soit la mort, soit le bannissement[a], soit la confiscation de ses biens, soit l’emprisonnement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’expulsion » ; plus littéralement, « le déracinement ». Le terme araméen est rare et peut désigner le bannissement d’un lieu ou d’une communauté.
    reason: Alternative lexicale due à la rareté et à l’incertitude du terme araméen.
lexical_decisions:
- source_word: וְכָל דִּי
  choice: Quiconque
  rationale: Cette tournure rend naturellement la proposition relative indéfinie et sa portée distributive dans un contexte juridique.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: n’obéira pas à
  rationale: Le sens littéral est « ne fera pas », mais, avec « loi », il s’agit de ne pas s’y conformer. « Obéir à » exprime clairement cette force juridique.
- source_word: דָּתָא
  choice: loi
  rationale: Le terme araméen peut désigner une loi, un décret ou une réglementation. « Loi » convient aux deux occurrences coordonnées et conserve leur parallélisme.
- source_word: אֱלָהָךְ
  choice: ton Dieu
  rationale: Le possessif est à la deuxième personne du singulier et s’adresse à Esdras.
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: et à la loi du roi
  rationale: La formulation maintient la coordination et le parallélisme avec « la loi de ton Dieu ».
- source_word: אָסְפַּרְנָא
  choice: promptement
  rationale: L’adverbe exprime ici la rapidité ou la diligence dans l’exécution de la décision judiciaire.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: que la sentence soit promptement exécutée contre lui
  rationale: La tournure passive décrit l’application d’une décision judiciaire à l’auteur de l’infraction. « Sentence » s’accorde naturellement avec la liste de peines qui suit.
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: soit ... soit ... soit ... soit
  rationale: Cette construction française présente clairement les différentes peines possibles.
- source_word: לְמוֹת
  choice: la mort
  rationale: Le terme désigne directement la peine de mort, sans recourir à une formulation technique plus interprétative.
- source_word: לשרשו
  choice: le bannissement
  rationale: Le mot rare semble lié à l’idée de déracinement. Dans cette liste de sanctions, « bannissement » rend probablement le mieux l’expulsion d’un lieu ou d’une communauté, tout en signalant l’incertitude en note.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: la confiscation de ses biens
  rationale: L’expression désigne une sanction portant sur les possessions. « Confiscation de ses biens » en donne un sens juridique clair sans exclure la possibilité plus générale d’une peine patrimoniale.
- source_word: וְלֶאֱסוּרִין
  choice: l’emprisonnement
  rationale: Bien que le terme puisse littéralement évoquer les liens, le contexte judiciaire indique la détention ou l’emprisonnement.
theological_decisions:
- issue: Rapport entre la loi divine et la loi royale dans le décret
  choice: Présenter sur le même plan « la loi de ton Dieu » et « la loi du roi ».
  alternative: Subordonner l’une de ces lois à l’autre, ou comprendre la loi royale comme la simple mise en œuvre de la loi divine.
  rationale: Le texte coordonne explicitement les deux autorités juridiques dans le décret perse. La traduction préserve cette tension sans introduire une hiérarchie théologique qui n’est pas exprimée ici.
translation_notes:
  register: Français international moderne, digne et accessible, avec une tonalité juridique sobre. Le futur « n’obéira pas » convient au décret, tandis que la construction « que la sentence soit… » conserve la force prescriptive et la voix passive de l’araméen.
