source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: fr
  text: 'Voici la copie du document[a] que le roi Artaxerxès donna à Esdras, le prêtre, le scribe, scribe des paroles des commandements de Yahweh et de ses prescriptions pour Israël[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le texte de la lettre » ou « la transcription du document ».
    reason: lexical_alternative
  - marker: b
    text: Ou « concernant Israël » ou « sur Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Voici
  rationale: « Voici » introduit naturellement en français la citation du document qui suit, sans ajouter une indication temporelle absente de l’hébreu.
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: la copie du document
  rationale: Le premier terme désigne une copie ou transcription, et le second un écrit officiel. « Document » reste assez large pour ne pas imposer la catégorie plus précise de lettre ou de décret.
- source_word: נָתַן
  choice: donna
  rationale: Le verbe hébreu courant signifie « donner ». Cette traduction conserve son sens simple plutôt que de préciser « remit » ou « promulgua ».
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: le roi Artaxerxès
  rationale: Le titre est traduit et le nom propre est donné sous sa forme française usuelle.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: le prêtre, le scribe
  rationale: Les deux titres en apposition sont conservés, sans réduire le rôle de סֹפֵר à celui, plus moderne et interprétatif, de spécialiste.
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה
  choice: scribe des paroles des commandements de Yahweh
  rationale: La formulation suit la structure appositionnelle et conserve la répétition de « scribe » ainsi que l’accent mis sur les paroles écrites des commandements, malgré une tournure légèrement soutenue en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par le titre « le Seigneur ».
- source_word: וְחֻקָּיו
  choice: et de ses prescriptions
  rationale: « Prescriptions » exprime ici les règles établies par Dieu dans un contexte juridique et religieux, tout en restant naturel en français contemporain.
- source_word: עַל יִשְׂרָאֵל
  choice: pour Israël
  rationale: Cette traduction exprime naturellement que les commandements et prescriptions s’appliquent à Israël, tout en signalant en note les autres valeurs possibles de la préposition.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel divin sans lui substituer un titre.
- issue: Portée de עַל יִשְׂרָאֵל
  choice: pour Israël
  alternative: concernant Israël ; sur Israël
  rationale: « Pour Israël » convient au contexte des commandements qui lui sont destinés, mais l’hébreu permet aussi une relation de sujet (« concernant ») ou, plus littéralement, d’autorité (« sur »). La note maintient cette ambiguïté.
translation_notes:
  register: 'Français international moderne, digne et lisible. La répétition « le scribe, scribe » est volontaire : elle reflète la reprise hébraïque et la précision apportée au titre d’Esdras. Les marqueurs de note sont placés après les expressions auxquelles leurs variantes se rapportent.'
