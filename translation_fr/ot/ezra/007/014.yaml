  variant: modern international French
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֗ל דִּי֩ מִן קֳדָ֨ם מַלְכָּ֜/א וְ/שִׁבְעַ֤ת יָעֲטֹ֨/הִי֙ שְׁלִ֔יחַ לְ/בַקָּרָ֥א עַל יְה֖וּד וְ/לִֽ/ירוּשְׁלֶ֑ם בְּ/דָ֥ת אֱלָהָ֖/ךְ דִּ֥י בִ/ידָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: fr
  text: puisque tu es envoyé par le roi et ses sept conseillers pour enquêter sur Juda et Jérusalem d’après la loi de ton Dieu qui est entre tes mains[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant le roi » ou « de la présence du roi ». Cette formule araméenne de cour souligne que la mission d’Esdras émane de la présence royale.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui est en ta possession » ou « qui t’est confiée ». Littéralement : « qui est dans ta main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: puisque
  rationale: Cette locution araméenne introduit le motif de la disposition royale. « Puisque » restitue naturellement sa valeur causale dans la continuité de la phrase.
- source_word: מִן קֳדָם מַלְכָּא
  choice: par le roi
  rationale: Littéralement « de devant le roi », cette formule de cour indique que la mission émane de la présence et de l’autorité royales. « Par le roi » est idiomatique en français, tandis que la tournure littérale est signalée en note.
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: et ses sept conseillers
  rationale: Le nom désigne les membres du conseil royal. « Conseillers » convient au contexte administratif et politique.
- source_word: שְׁלִיחַ
  choice: tu es envoyé
  rationale: Le participe passif décrit la mission officielle d’Esdras sans ajouter l’idée plus explicite de mandat contenue dans « chargé de mission ».
- source_word: לְבַקָּרָא
  choice: pour enquêter
  rationale: Le verbe exprime l’action d’examiner ou de rechercher avec soin. « Enquêter » rend bien sa portée dans ce cadre administratif.
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: sur Juda et Jérusalem
  rationale: Avec le verbe précédent, la préposition introduit l’objet de l’enquête. « Sur » est précis et naturel en français.
- source_word: בְּדָת אֱלָהָךְ
  choice: d’après la loi de ton Dieu
  rationale: La préposition peut présenter la loi comme norme ou référence de l’enquête. « D’après » conserve cette relation sans trancher plus précisément entre critère et objet de consultation.
- source_word: דִּי בִידָךְ
  choice: qui est entre tes mains
  rationale: Littéralement « qui est dans ta main ». L’expression française « entre tes mains » conserve l’image tout en pouvant évoquer la possession, la garde ou la responsabilité.
