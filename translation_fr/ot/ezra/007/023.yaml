  variant: modern international French
source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: fr
  text: Tout ce qui est ordonné par le Dieu du ciel doit être exécuté avec diligence pour la maison du Dieu du ciel[a], de peur que la colère ne s’abatte sur le royaume du roi et sur ses fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison du Dieu du ciel » désigne ici le temple.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « Car pourquoi y aurait-il de la colère contre le royaume du roi et ses fils ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: Tout ce qui
  rationale: 'Cette tournure rend naturellement en français la relative indéfinie à valeur totalisante : « tout ce qui ».'
- source_word: מִן טַעַם אֱלָהּ שְׁמַיָּא
  choice: est ordonné par le Dieu du ciel
  rationale: טַעַם peut désigner un ordre, un décret ou une décision. Dans ce contexte administratif, « ordonné » exprime clairement l’autorité dont émane la prescription.
- source_word: יִתְעֲבֵד
  choice: doit être exécuté
  rationale: La forme passive à valeur directive appelle ici l’accomplissement de l’ordre. « Doit être exécuté » restitue cette force de manière naturelle en français.
- source_word: אַדְרַזְדָּא
  choice: avec diligence
  rationale: Cet adverbe évoque une exécution empressée, soigneuse et exacte. « Avec diligence » convient au registre administratif et demeure intelligible.
- source_word: לְבֵית אֱלָהּ שְׁמַיָּא
  choice: pour la maison du Dieu du ciel
  rationale: Le texte dit littéralement « maison »; dans le contexte, il s’agit du temple. La formulation source est conservée dans le texte, et son référent est précisé en note.
- source_word: דִּי לְמָה
  choice: afin que… ne
  rationale: L’expression introduit littéralement une question négative (« pourquoi y aurait-il… ? »), mais fonctionne ici comme l’énoncé du risque que l’ordre vise à prévenir. La note conserve la forme plus littérale.
- source_word: לֶהֱוֵא קְצַף
  choice: la colère ne s’abatte pas
  rationale: L’expression signifie que la colère pourrait survenir ou se manifester contre le royaume. « S’abattre sur » transmet naturellement cette menace sans en préciser davantage l’origine dans le texte.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: sur le royaume du roi
  rationale: La formulation, légèrement solennelle, conserve la distinction explicite entre le royaume et le roi.
- source_word: וּבְנוֹהִי
  choice: et sur ses fils
  rationale: Le nom désigne directement les fils du roi. Une portée dynastique est possible, mais « fils » évite de remplacer le terme par une interprétation plus large comme « descendants ».
theological_decisions:
- issue: Sens de « maison du Dieu du ciel »
  choice: Conserver « maison » dans le texte et préciser qu’il s’agit du temple en note.
  alternative: Traduire directement par « temple du Dieu du ciel ».
  rationale: Cette solution préserve la métaphore du texte araméen tout en garantissant sa compréhension, sans enjeu confessionnel ajouté.
- issue: Forme de l’avertissement final
  choice: Traduire la fonction de la proposition par « afin que la colère ne s’abatte pas » et signaler la question littérale en note.
  alternative: « Car pourquoi la colère s’abattrait-elle sur le royaume du roi et sur ses fils ? »
  rationale: La traduction principale exprime clairement le but préventif dans un français naturel; la note maintient l’ambiguïté entre la formulation interrogative littérale et sa fonction d’avertissement.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire administratif (« ordonné », « exécuté », « avec diligence ») correspond au cadre du décret royal, tandis que « maison du Dieu du ciel » conserve le caractère solennel et imagé de l’araméen.
