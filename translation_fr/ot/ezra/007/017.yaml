source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָה֩ אָסְפַּ֨רְנָא תִקְנֵ֜א בְּ/כַסְפָּ֣/א דְנָ֗ה תּוֹרִ֤ין דִּכְרִין֙ אִמְּרִ֔ין וּ/מִנְחָתְ/ה֖וֹן וְ/נִסְכֵּי/ה֑וֹן וּ/תְקָרֵ֣ב הִמּ֔וֹ עַֽל מַדְבְּחָ֔/ה דִּ֛י בֵּ֥ית אֱלָהֲ/כֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: fr
  text: C’est pourquoi, achète avec le plus grand soin[a], avec cet argent[b], des taureaux, des béliers et des agneaux, ainsi que les offrandes de céréales et les libations qui les accompagnent, et offre-les sur l’autel de la maison[c] de votre Dieu, à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec exactitude » ou « avec diligence » ; l’adverbe araméen insiste sur l’exécution soigneuse de l’ordre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec cet argent » ; le mot peut désigner l’argent-métal, mais il renvoie ici aux fonds disponibles.
    reason: lexical_alternative
  - marker: c
    text: Ou « le temple de votre Dieu » ; littéralement « la maison de votre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: C’est pourquoi
  rationale: Cette locution araméenne introduit la conséquence de l’ordre précédent. « C’est pourquoi » en conserve clairement la valeur logique.
- source_word: אָסְפַּרְנָא
  choice: avec le plus grand soin
  rationale: L’adverbe souligne l’exécution diligente, soigneuse ou exacte de l’ordre. Cette formulation est naturelle en français actuel tout en gardant sa force intensive.
- source_word: תִקְנֵא
  choice: achète
  rationale: Le verbe signifie directement « acheter » ou « acquérir ». L’impératif français rend ici la force prescriptive de l’instruction royale.
- source_word: בְּכַסְפָּא דְנָה
  choice: au moyen de cet argent
  rationale: כַּסְפָּא désigne littéralement l’argent-métal, mais fonctionne dans ce contexte administratif comme une somme disponible pour les achats. Le choix français exprime naturellement cette fonction tout en signalant le sens littéral en note.
- source_word: תּוֹרִין דִּכְרִין אִמְּרִין
  choice: des taureaux, des béliers et des agneaux
  rationale: Ces équivalents usuels identifient clairement les trois catégories d’animaux destinés aux sacrifices.
- source_word: מִנְחָתְהוֹן
  choice: les offrandes de céréales qui les accompagnent
  rationale: Dans ce contexte cultuel, מִנְחָה désigne l’offrande végétale associée aux animaux sacrifiés. « Offrandes de céréales » est précis et compréhensible.
- source_word: נִסְכֵּיהוֹן
  choice: les libations qui les accompagnent
  rationale: Le terme désigne les offrandes liquides rituellement versées. « Libations » est le terme cultuel français précis; le complément rend le suffixe possessif araméen sans suggérer que les animaux possèdent littéralement ces offrandes.
- source_word: וּתְקָרֵב הִמּוֹ
  choice: puis offre-les
  rationale: Le verbe signifie faire approcher ou présenter dans un cadre sacrificiel. « Offrir » communique directement l’action rituelle, et « puis » marque naturellement la succession après l’achat.
- source_word: עַל מַדְבְּחָה
  choice: sur l’autel
  rationale: Traduction directe et idiomatique de la construction locative.
- source_word: בֵּית אֱלָהֲכֹם
  choice: la maison de votre Dieu
  rationale: La traduction conserve l’image littérale de la « maison », qui désigne ici le temple, ainsi que le possessif pluriel araméen.
theological_decisions:
- issue: Alternance entre le destinataire singulier et le possessif pluriel
  choice: « achète » au singulier, mais « votre Dieu » au pluriel
  alternative: Uniformiser en « ton Dieu »
  rationale: Le texte araméen commande l’achat à un destinataire singulier, tout en parlant ensuite de « votre Dieu » avec un suffixe pluriel, probablement inclusif de la communauté d’Esdras. Conserver cette alternance évite d’effacer une nuance réelle du texte.
- issue: Désignation du sanctuaire
  choice: « la maison de votre Dieu »
  alternative: « le temple de votre Dieu »
  rationale: « Maison » préserve l’expression concrète du texte source sans nier qu’elle désigne le temple de Jérusalem.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la formulation administrative de l’ordre royal et le vocabulaire sacrificiel, tout en évitant les tournures inutilement archaïques. L’alternance entre le singulier de l’ordre et le pluriel de « votre Dieu » est intentionnelle et reflète l’araméen.
