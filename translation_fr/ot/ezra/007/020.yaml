revisions:
- from: Et à tout autre besoin de la maison de ton Dieu qu’il te reviendra de satisfaire, tu pourvoiras à même la maison des trésors du roi[a].
  to: Et tout autre besoin de la maison de ton Dieu qu’il te reviendra de satisfaire, tu y pourvoiras depuis la maison des trésors du roi[a].
  rationale: La révision remplace la construction ambiguë et peu idiomatique « pourvoiras à même la maison » par « tu y pourvoiras depuis la maison ». Elle maintient l’idée source d’une obligation de fournir et indique sans ajout doctrinal que les provisions proviennent de la maison des trésors royaux. La note est ajustée pour correspondre exactement à la formulation révisée.
