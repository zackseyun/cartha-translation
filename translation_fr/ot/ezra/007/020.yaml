  text: וּ/שְׁאָ֗ר חַשְׁחוּת֙ בֵּ֣ית אֱלָהָ֔/ךְ דִּ֥י יִפֶּל לָ֖/ךְ לְ/מִנְתַּ֑ן תִּנְתֵּ֕ן מִן בֵּ֖ית גִּנְזֵ֥י מַלְכָּֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: fr
  text: Et tout autre besoin de la maison de ton Dieu qu’il te reviendra de satisfaire, tu y pourvoiras depuis la maison des trésors du roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus naturellement : « depuis le trésor royal ». L’araméen dit plus littéralement : « depuis la maison des trésors du roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: Et à tout autre besoin
  rationale: Le syntagme désigne tout besoin supplémentaire non précisé. Cette formulation française rend naturellement l’idée de reste ou de supplément sans réduire le sens aux seules dépenses.
- source_word: בֵּית אֱלָהָךְ
  choice: la maison de ton Dieu
  rationale: « Maison » conserve l’expression araméenne traditionnelle désignant ici le temple, sans substituer une explicitation contextuelle au terme source.
- source_word: דִּי יִפֶּל לָךְ לְמִנְתַּן
  choice: qu’il te reviendra de satisfaire
  rationale: L’expression idiomatique indique une responsabilité qui échoit à Esdras. « Satisfaire un besoin » exprime naturellement en français l’action de fournir ce qui est nécessaire.
- source_word: תִּנְתֵּן
  choice: tu pourvoiras
  rationale: Le verbe reprend avec force l’idée de donner ou de fournir. « Pourvoir à » maintient cette reprise tout en s’accordant idiomatiquement avec « besoin ».
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: à même la maison des trésors du roi
  rationale: Cette traduction conserve la structure littérale « maison des trésors du roi »; « à même » indique que les ressources doivent en être directement tirées.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et administratif. La répétition sémantique entre « satisfaire » et « pourvoir » reflète la reprise du verbe araméen sans produire une tournure trop lourde.
