  verdict: revise
  source_fidelity: 'Le sens général est fidèle au texte hébreu : la faveur divine accordée à Esdras devant la cour royale, son courage sous la main de Yahweh, et le rassemblement de chefs d’Israël sont tous conservés. « Des chefs d’Israël » rend plus directement מִיִּשְׂרָאֵל רָאשִׁים que « parmi les Israélites des chefs ».'
  naturalness: « Étendre sur moi sa bonté fidèle » calque une image hébraïque qui n’est pas idiomatique en français moderne. « M’a accordé sa bonté fidèle » est naturel tout en gardant la portée de חֶסֶד. « Puissants dignitaires » est également plus fluide que « puissants hauts fonctionnaires ».
  terminology: « Yahweh », « bonté fidèle », « conseillers », « dignitaires » et « chefs » conviennent au registre et au contexte perse. La note sur כְּיַד est reformulée pour ne pas introduire artificiellement « selon que » et pour signaler le caractère plus littéral, quoique elliptique, de la construction.
