  text: וְ/עָלַ֣/י הִטָּה חֶ֗סֶד לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/יֽוֹעֲצָ֔י/ו וּ/לְ/כָל שָׂרֵ֥י הַ/מֶּ֖לֶךְ הַ/גִּבֹּרִ֑ים וַ/אֲנִ֣י הִתְחַזַּ֗קְתִּי כְּ/יַד יְהוָ֤ה אֱלֹהַ/י֙ עָלַ֔/י וָ/אֶקְבְּצָ֧/ה מִ/יִּשְׂרָאֵ֛ל רָאשִׁ֖ים לַ/עֲל֥וֹת עִמִּֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: fr
  text: et qui m’a accordé sa bonté fidèle devant le roi, ses conseillers et tous les puissants dignitaires du roi[a]. Quant à moi, j’ai pris courage, car la main de Yahweh, mon Dieu, était sur moi[b], et j’ai rassemblé des chefs d’Israël[c] pour qu’ils montent avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui m’a accordé sa faveur devant le roi, ses conseillers et tous les puissants dignitaires du roi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « je me suis fortifié selon la main de Yahweh, mon Dieu, qui était sur moi ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « des têtes », c’est-à-dire des chefs ou des responsables d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: a étendu sur moi sa bonté fidèle
  rationale: Conserve l’image verbale d’une bonté étendue vers Ezra et rend חֶסֶד par une expression qui évoque une bonté loyale et durable, tout en restant compréhensible en français actuel.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend directement la préposition hébraïque et convient au contexte de la cour royale.
- source_word: יֹעֲצָיו
  choice: ses conseillers
  rationale: Terme naturel et précis dans le contexte de la cour perse.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: les puissants hauts fonctionnaires du roi
  rationale: « Hauts fonctionnaires » exprime le rang administratif de שָׂרִים, tandis que « puissants » conserve la force de הַגִּבֹּרִים.
- source_word: הִתְחַזַּקְתִּי
  choice: j’ai pris courage
  rationale: Rend idiomatiquement l’idée qu’Ezra a été fortifié ou enhardi, sans suggérer que cette force venait uniquement de lui-même.
- source_word: כְּיַד ... עָלַי
  choice: car la main de Yahweh, mon Dieu, était sur moi
  rationale: Préserve la métaphore de la main divine tout en exprimant naturellement la valeur explicative probable de כְּ dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וָאֶקְבְּצָה
  choice: j’ai rassemblé
  rationale: Rendu direct et naturel du verbe narratif.
- source_word: מִיִּשְׂרָאֵל רָאשִׁים
  choice: j’ai rassemblé parmi les Israélites des chefs
  rationale: Le מִן indique ici le groupe parmi lequel les hommes sont choisis; רָאשִׁים signifie littéralement « têtes » et désigne des responsables reconnus.
- source_word: לַעֲלוֹת עִמִּי
  choice: pour qu’ils montent avec moi
  rationale: Conserve l’expression biblique de la montée vers Jérusalem et rend explicite, en français naturel, que les chefs accompagnent Ezra.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Rapport entre le courage d’Ezra et la main divine
  choice: « j’ai pris courage, car la main de Yahweh… était sur moi »
  alternative: « je me suis fortifié selon que la main de Yahweh… était sur moi »
  rationale: Le rendu principal exprime le lien causal suggéré par le contexte sans supprimer la métaphore de la main divine; la note conserve la construction plus formelle et son ambiguïté.
- issue: Portée de חֶסֶד dans ce contexte
  choice: bonté fidèle
  alternative: faveur
  rationale: « Bonté fidèle » conserve la richesse relationnelle de חֶסֶד, tandis que « faveur » reste une possibilité contextuelle signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve les images hébraïques de la bonté « étendue », de la main divine et de la montée vers Jérusalem. « Hauts fonctionnaires » situe naturellement les שָׂרִים dans l’administration perse; « chefs » maintient la référence masculine plurielle de רָאשִׁים.
