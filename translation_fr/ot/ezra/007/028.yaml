    issue: Calque peu naturel de l’idiome הִטָּה חֶסֶד
    rationale: « a étendu sur moi sa bonté fidèle » est compréhensible mais ne constitue pas une tournure française naturelle. Le verbe hébreu dans cet idiome exprime l’octroi ou la manifestation de la faveur ; « m’a accordé sa bonté fidèle » le rend sans perte de sens.
  - severity: low
    issue: Formulation des hauts responsables royaux
    rationale: « les puissants hauts fonctionnaires » est lourd en français. « les puissants dignitaires du roi » rend naturellement le statut élevé de שָׂרִים et la qualification הַגִּבֹּרִים.
  - severity: low
    issue: 'Note b : « selon que » ne reflète pas exactement la construction nominale hébraïque'
    rationale: La note peut conserver l’ambiguïté formelle de כְּיַד en disant « selon la main ... qui était sur moi », sans transformer la phrase en subordonnée introduite par « selon que ».
