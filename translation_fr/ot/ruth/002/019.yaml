  source_fidelity: 'Le sens général est bien rendu : Naomi interroge Ruth sur le glanage et le travail, bénit l’homme qui lui a accordé son attention, puis Ruth identifie Booz. Toutefois, « s’est intéressé à toi » est un peu plus interprétatif et peut évoquer un intérêt personnel ou affectif absent du terme hébreu, qui désigne plus directement le fait de remarquer/reconnaître quelqu’un favorablement.'
  naturalness: Le français est fluide, moderne et d’un registre convenable. « Glané », « belle-mère » et « Booz » sont naturels. La formulation « t’a remarquée » est à la fois plus directe et plus proche de l’hébreu que « s’est intéressé à toi ».
  terminology: « Glaner » préserve utilement la précision agricole. « Booz » est la forme française biblique usuelle. « Chez qui elle avait travaillé » explicite contextuellement le travail agricole, mais la note doit indiquer avec précision que l’hébreu emploie « avec lui », sans introduire « ce travail » dans la citation littérale.
