translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste vif; « glaner » préserve le cadre agricole précis. La répétition de la question « Où… ? Où… ? » reflète l’insistance du texte hébreu. Le nom Ruth, implicite dans le pronom hébreu, est explicité pour clarifier le changement de sujet.
