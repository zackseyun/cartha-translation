base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: fr
  text: 'Sa belle-mère lui demanda : « Où as-tu glané aujourd’hui ? Où as-tu travaillé ? Béni soit celui qui t’a remarquée ! » Ruth raconta alors à sa belle-mère chez qui elle avait travaillé[a]. Elle ajouta : « L’homme chez qui j’ai travaillé aujourd’hui s’appelle Booz. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « ce qu’elle avait fait avec lui », puis « l’homme avec qui j’ai fait aujourd’hui ». Dans ce contexte de travail aux champs, « travaillé chez » rend le sens de manière idiomatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: sa belle-mère
  rationale: Équivalent français courant et naturel du terme de parenté dans ce contexte.
- source_word: לִקַּטְתְּ
  choice: as-tu glané
  rationale: Le verbe désigne précisément le ramassage des épis laissés après la moisson; « glaner » conserve cette réalité agricole et sociale.
- source_word: עָשִׂית
  choice: as-tu travaillé
  rationale: Le verbe signifie largement « faire », mais le contexte indique ici le travail accompli dans les champs.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: Béni soit celui qui s’est intéressé à toi
  rationale: מַכִּירֵךְ désigne celui qui a remarqué ou reconnu Ruth; « s’est intéressé à toi » exprime naturellement l’attention bienveillante impliquée par le contexte.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: chez qui elle avait travaillé
  rationale: L’hébreu dit plus littéralement « ce qu’elle avait fait avec lui ». Dans le contexte du travail aux champs sous l’autorité de Booz, « chez qui elle avait travaillé » est naturel en français sans suggérer qu’ils travaillaient côte à côte.
- source_word: אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: chez qui j’ai travaillé
  rationale: Rend idiomatiquement le travail effectué dans le domaine de cet homme, tout en signalant en note la formulation hébraïque plus générale.
- source_word: בֹּעַז
  choice: Booz
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom biblique בֹּעַז.
