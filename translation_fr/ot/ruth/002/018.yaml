base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: fr
  text: Elle l’emporta et entra dans la ville. Sa belle-mère vit ce qu’elle avait glané. Puis elle sortit ce qu’elle avait laissé après avoir mangé à sa faim[a] et le lui donna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de son rassasiement » ; autre traduction : « après avoir été rassasiée ».'
    reason: La construction hébraïque מִשָּׂבְעָהּ peut évoquer littéralement la satiété; dans le contexte du repas, « après avoir mangé à sa faim » en exprime naturellement le sens.
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: Elle souleva son fardeau
  rationale: Le verbe נָשָׂא signifie « soulever » ou « porter ». Le complément n’est pas exprimé en hébreu, mais le contexte immédiat désigne le grain glané que Ruth emporte; « son fardeau » rend l’action clairement sans répéter lourdement « le grain ».
- source_word: הָעִיר
  choice: la ville
  rationale: עִיר désigne couramment une ville ou une localité. « La ville » est l’équivalent direct et convient à la désignation narrative de Bethléem.
- source_word: חֲמוֹתָהּ
  choice: sa belle-mère
  rationale: Traduction française usuelle du terme de parenté, avec le suffixe possessif féminin.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: ce qu’elle avait glané
  rationale: Le verbe לקט renvoie précisément au glanage derrière les moissonneurs; « glaner » conserve ce contexte agricole et social.
- source_word: וַתּוֹצֵא
  choice: elle sortit
  rationale: La forme causative de יצא signifie ici « faire sortir » ou « sortir » quelque chose. Le français transitif « elle sortit ce que… » est naturel dans cette scène.
- source_word: וַתִּתֶּן לָהּ
  choice: elle le lui donna
  rationale: Le pronom « lui » représente la belle-mère et « le » reprend ce que Ruth avait laissé de son repas. Cette formulation rend explicitement les deux fonctions grammaticales en français.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: ce qu’elle avait laissé
  rationale: הותירה exprime ce qui a été laissé ou est resté. La formulation ne précise pas si Ruth l’avait délibérément réservé, préservant ainsi la nuance du texte.
- source_word: מִשָּׂבְעָהּ
  choice: après avoir mangé à sa faim
  rationale: L’expression désigne l’état de satiété à partir duquel quelque chose restait. « Manger à sa faim » est une expression française actuelle et naturelle qui convient au contexte du repas.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le terme « glané » conserve l’arrière-plan agricole propre au récit. Les pronoms restent centrés sur Ruth et Noémi, comme en hébreu, tandis que « son fardeau » explicite sobrement l’objet sous-entendu de וַתִּשָּׂא.
