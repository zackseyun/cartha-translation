base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: fr
  text: 'Lorsqu’elle se leva pour glaner, Booz donna cet ordre à ses jeunes hommes : « Qu’elle glane même entre les gerbes, et ne l’humiliez pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  choice: Lorsqu’elle se leva pour glaner
  rationale: La tournure temporelle relie naturellement l’action de Ruth à l’ordre de Booz, tandis que « glaner » rend précisément לקט dans le contexte de la moisson.
- source_word: וַיְצַו ... לֵאמֹר
  choice: 'donna cet ordre ... :'
  rationale: « Donner cet ordre » conserve la force directive de צוה. Les deux-points rendent naturellement en français la formule hébraïque introduisant les paroles.
- source_word: נְעָרָיו
  choice: ses jeunes hommes
  rationale: Le terme נַעַר peut désigner un jeune homme, un serviteur ou un employé. Ici, il s’agit des hommes travaillant sous l’autorité de Booz; cette traduction préserve la désignation masculine du texte.
- source_word: גַּם בֵּין הָעֳמָרִים תְּלַקֵּט
  choice: Qu’elle glane même entre les gerbes
  rationale: « Même » exprime l’extension remarquable de la permission, et « entre les gerbes » traduit directement בֵּין הָעֳמָרִים tout en restant naturel en français.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: et ne l’humiliez pas
  rationale: Le hifil de כלם exprime l’action de couvrir quelqu’un de honte ou de l’humilier. « Humilier » convient au risque de déshonneur et de mauvais traitement social dans cette scène.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la force de l’ordre de Booz sans alourdir le discours par un calque de la formule « en disant ».
