source:
  edition: WLC
  text: וְ/גַ֛ם שֹׁל תָּשֹׁ֥לּוּ לָ֖/הּ מִן הַ/צְּבָתִ֑ים וַ/עֲזַבְתֶּ֥ם וְ/לִקְּטָ֖ה וְ/לֹ֥א תִגְעֲרוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: fr
  text: Vous retirerez aussi, délibérément pour elle, quelques épis des gerbes[a], et vous les laisserez là pour qu’elle les glane[b]. Ne la réprimandez pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des javelles ». Le terme hébreu désigne des groupes de tiges rassemblées.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour qu’elle les ramasse ». Le verbe hébreu est le terme habituel pour glaner dans un champ moissonné.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: même
  rationale: Rend la valeur additive et emphatique de la locution dans la suite des consignes de Booz.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: vous retirerez exprès
  rationale: 'Le verbe redoublé par l’infinitif absolu exprime une action appuyée et intentionnelle : les ouvriers doivent extraire du grain pour Ruth, et non simplement en laisser tomber par hasard.'
- source_word: לָהּ
  choice: pour elle
  rationale: La préposition indique ici que l’action est accomplie au bénéfice de Ruth.
- source_word: מִן הַצְּבָתִים
  choice: quelques épis des gerbes
  rationale: Le nom désigne des groupes de tiges déjà rassemblées. « Gerbes » convient au contexte agricole; « quelques épis » explicite naturellement en français l’objet implicite du verbe.
- source_word: וַעֲזַבְתֶּם
  choice: vous les laisserez là
  rationale: Indique que les épis retirés doivent rester sur place afin que Ruth puisse les ramasser.
- source_word: וְלִקְּטָה
  choice: pour qu’elle les glane
  rationale: לקט est le verbe usuel du glanage dans un champ moissonné; « glaner » conserve avec précision ce sens agricole.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: Ne lui faites aucun reproche
  rationale: גער désigne une réprimande vive. Cette formulation est naturelle, ferme et digne en français moderne.
theological_decisions: []
