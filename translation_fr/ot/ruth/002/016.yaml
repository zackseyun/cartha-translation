  register: Français international moderne, clair et digne. La formulation conserve l’insistance de l’hébreu, tout en explicitant sobrement l’objet implicite du verbe. Le terme agricole « glaner » est maintenu parce qu’il demeure précis et compréhensible dans ce contexte.
