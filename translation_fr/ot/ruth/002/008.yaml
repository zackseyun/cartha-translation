  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: fr
  text: 'Alors Booz dit à Ruth : « Écoute bien, ma fille : ne va pas glaner dans un autre champ et ne t’en va pas non plus d’ici ; reste ici avec les jeunes femmes à mon service. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Écoute
  rationale: La tournure interrogative hébraïque fonctionne ici comme une invitation pressante à prêter attention; l’impératif français restitue naturellement sa force pragmatique.
- source_word: לִלְקֹט
  choice: glaner
  rationale: Terme précis pour le ramassage des épis laissés après la moisson, adapté au contexte juridique et agricole du récit.
- source_word: לֹא תַעֲבוּרִי מִזֶּה
  choice: ne t’éloigne pas d’ici
  rationale: Exprime naturellement l’idée de ne pas quitter cet endroit pour passer ailleurs.
- source_word: תִדְבָּקִין עִם נַעֲרֹתָי
  choice: Reste plutôt avec mes servantes
  rationale: דבק indique le fait de rester attachée ou proche; נַעֲרוֹת désigne ici les jeunes femmes attachées au service de Booz, d’où « servantes » dans un français courant et contextuel.
