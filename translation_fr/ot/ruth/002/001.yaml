  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: fr
  text: Noémi avait, du côté de son mari, un parent, un homme de valeur[a], du clan d’Élimélek[b] ; il s’appelait Booz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme puissant », « un homme influent » ou « un homme fortuné » ; l’expression hébraïque peut évoquer la force, la capacité, le rang social et la richesse.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la famille d’Élimélek » ; le terme hébreu peut désigner un groupe familial étendu, c’est-à-dire un clan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מידע
  choice: un parent
  rationale: Le terme désigne une personne connue ou liée au mari de Noémi. La précision « du clan d’Élimélek » favorise ici une relation de parenté, sans anticiper le rôle juridique de proche parent qui apparaîtra plus tard.
- source_word: לְאִישָׁהּ
  choice: du côté de son mari
  rationale: Cette formulation française naturelle indique que le lien de parenté passe par le mari de Noémi, plutôt que directement par elle.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: un homme important et fortuné
  rationale: Dans ce contexte non militaire, l’expression évoque surtout les ressources, la capacité et la position sociale. Ce rendu conserve plusieurs composantes de son sens sans introduire artificiellement l’idée de bravoure guerrière.
- source_word: מִמִּשְׁפַּחַת
  choice: du clan de
  rationale: Le mot hébreu peut désigner un groupe de parenté plus large que la famille immédiate; « clan » convient à la structure familiale du récit.
- source_word: וּשְׁמוֹ
  choice: Il s’appelait
  rationale: Cette tournure idiomatique introduit naturellement en français le nom d’un personnage dans un récit au passé.
- source_word: בֹּעַז
  choice: Booz
  rationale: « Booz » est la forme française traditionnelle et immédiatement reconnaissable de ce nom biblique.
- source_word: וּלְנָעֳמִי
  choice: Noémi avait
  rationale: La conjonction hébraïque marque la continuité ou la transition narrative; aucun adverbe temporel explicite tel que « maintenant » n’est nécessaire en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée en deux pour éviter une accumulation lourde. « Important et fortuné » rend la portée sociale et matérielle de גִּבּוֹר חַיִל dans ce contexte non militaire; les notes préservent les ambiguïtés lexicales pertinentes.
