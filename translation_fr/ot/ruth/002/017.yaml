  text: וַ/תְּלַקֵּ֥ט בַּ/שָּׂדֶ֖ה עַד הָ/עָ֑רֶב וַ/תַּחְבֹּט֙ אֵ֣ת אֲשֶׁר לִקֵּ֔טָה וַ/יְהִ֖י כְּ/אֵיפָ֥ה שְׂעֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: fr
  text: Elle glana donc dans le champ jusqu’au soir. Puis elle battit ce qu’elle avait glané, et elle obtint environ un épha[a] d’orge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’épha était une ancienne mesure de capacité pour les matières sèches, équivalant approximativement à 20–22 litres.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: Elle glana donc
  rationale: Le verbe לקט désigne ici le glanage des épis laissés par les moissonneurs. « Glaner » conserve ce sens agricole précis; « donc » rend avec naturel la progression narrative du waw.
- source_word: בַּשָּׂדֶה
  choice: dans le champ
  rationale: שׂדה est le terme courant pour un champ; l’article renvoie au champ où Ruth travaillait.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Cette expression indique la durée de son travail et se rend naturellement ainsi en français moderne.
- source_word: וַתַּחְבֹּט
  choice: elle battit
  rationale: חבט décrit l’action de battre les plantes récoltées afin d’en détacher le grain. « Battit » préserve l’image concrète sans suggérer nécessairement un procédé mécanisé.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: ce qu’elle avait glané
  rationale: La formulation garde le lien lexical avec לקט tout en rendant clairement l’antériorité de la récolte par rapport au battage.
- source_word: וַיְהִי
  choice: et elle obtint
  rationale: Dans ce contexte résultatif, la tournure française exprime naturellement la quantité de grain produite après le battage, sans alourdir le récit par un littéral « et ce fut ».
- source_word: כְּאֵיפָה
  choice: environ un épha
  rationale: Le préfixe כ marque l’approximation. Le nom de la mesure ancienne est conservé par translittération, avec une explication en note.
- source_word: שְׂעֹרִים
  choice: d’orge
  rationale: שׂערים désigne l’orge; le singulier collectif est la tournure française normale après une unité de mesure.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le terme agricole « glaner » et l’unité historique « épha » sont conservés pour leur précision; la mesure est expliquée en note. La note est placée après « épha », le terme qu’elle explicite.
