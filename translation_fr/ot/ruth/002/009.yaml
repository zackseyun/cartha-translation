base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: fr
  text: Garde les yeux sur le champ où elles moissonnent et suis-les. N’ai-je pas ordonné aux jeunes hommes de ne pas te toucher[a] ? Quand tu auras soif, va aux jarres et bois de ce que les jeunes hommes auront puisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le contexte : « de ne pas porter la main sur toi ». Le verbe hébreu signifie littéralement « toucher » et peut inclure ici toute forme de harcèlement ou d’agression.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ בַּשָּׂדֶה
  choice: Garde les yeux sur le champ
  rationale: L’hébreu présente littéralement « tes yeux sur le champ » avec une valeur directive implicite. Cette tournure française restitue naturellement l’attention demandée.
- source_word: אֲשֶׁר יִקְצֹרוּן
  choice: où elles moissonnent
  rationale: La relative désigne le champ où se déroule la moisson. Le féminin pluriel rend explicite le genre marqué par le suffixe féminin de la proposition suivante et renvoie aux ouvrières évoquées dans le contexte.
- source_word: וְהָלַכְתִּ אַחֲרֵיהֶן
  choice: et suis-les
  rationale: La forme verbale est comprise comme une instruction adressée à Ruth, malgré l’orthographe consonantique inhabituelle. « Suis-les » exprime avec naturel le déplacement derrière les femmes.
- source_word: הֲלוֹא צִוִּיתִי
  choice: N’ai-je pas ordonné
  rationale: La question rhétorique et l’autorité exprimée par צוה sont toutes deux conservées.
- source_word: הַנְּעָרִים
  choice: les jeunes hommes
  rationale: Le masculin pluriel désigne ici les ouvriers de Booz et maintient la distinction avec les femmes précédemment mentionnées.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: de ne pas te toucher
  rationale: « Toucher » conserve le sens lexical direct de נגע sans déterminer trop étroitement la nature du contact interdit; la portée protectrice du contexte est signalée en note.
- source_word: וְצָמִת
  choice: Quand tu auras soif
  rationale: Le parfait à valeur circonstancielle introduit une situation attendue; le futur antérieur est idiomatique en français dans cette construction.
- source_word: הַכֵּלִים
  choice: les cruches
  rationale: Le terme signifie largement « récipients », mais le contexte de l’eau à boire permet la désignation concrète et naturelle « cruches ».
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: et bois de l’eau que les jeunes hommes auront puisée
  rationale: L’objet implicite de l’action de puiser est explicité comme de l’eau pour produire un français clair; le futur antérieur marque que l’eau est puisée avant d’être bue.
theological_decisions:
- issue: Portée de l’interdiction exprimée par נגע
  choice: Conserver « ne pas te toucher » dans le texte
  alternative: « ne pas porter la main sur toi » ou « ne pas t’importuner »
  rationale: Le verbe peut désigner un simple contact ou, dans ce contexte de protection d’une femme vulnérable, un geste importun, violent ou sexuel. La traduction principale préserve cette amplitude sémantique plutôt que de choisir une seule forme d’agression.
translation_notes:
  register: Français international moderne, fluide et digne. Le féminin « elles » rend visible le référent féminin pluriel de l’hébreu; « jeunes hommes » préserve ensuite le contraste de genre. Le vouvoiement n’est pas employé, conformément au discours direct singulier familier du contexte biblique.
