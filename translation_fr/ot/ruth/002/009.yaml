    issue: Objet explicité et valeur temporelle renforcée dans la dernière proposition
    rationale: Le texte hébreu dit littéralement de boire « de ce que les jeunes hommes puiseront/puisent »; l’eau est comprise du contexte mais n’est pas exprimée. « Auront puisée » impose en outre un antécédent temporel plus net que la forme hébraïque ne l’exige.
  - severity: low
    issue: « Va vers les cruches »
    rationale: La préposition française « vers » suggère surtout une direction, tandis que l’ordre vise l’accès aux récipients. « Va aux jarres » est plus direct et naturel; « jarres » convient au contexte sans prétendre épuiser le sens large de כֵּלִים.
