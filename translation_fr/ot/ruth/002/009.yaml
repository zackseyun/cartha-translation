- from: Garde les yeux sur le champ où elles moissonnent et suis-les. N’ai-je pas ordonné aux jeunes hommes de ne pas te toucher[a] ? Quand tu auras soif, va vers les cruches et bois de l’eau que les jeunes hommes auront puisée.
  to: Garde les yeux sur le champ où elles moissonnent et suis-les. N’ai-je pas ordonné aux jeunes hommes de ne pas te toucher[a] ? Quand tu auras soif, va aux jarres et bois de ce que les jeunes hommes auront puisé.
  rationale: La révision évite d’ajouter explicitement « de l’eau », tout en gardant l’implicite immédiatement compréhensible du contexte. Elle améliore aussi la formulation du déplacement vers les récipients. Le reste du projet, y compris le féminin « elles » et la note sur « toucher », est fidèle et approprié.
