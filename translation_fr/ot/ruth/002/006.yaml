  text: וַ/יַּ֗עַן הַ/נַּ֛עַר הַ/נִּצָּ֥ב עַל הַ/קּוֹצְרִ֖ים וַ/יֹּאמַ֑ר נַעֲרָ֤ה מֽוֹאֲבִיָּה֙ הִ֔יא הַ/שָּׁ֥בָה עִֽם נָעֳמִ֖י מִ/שְּׂדֵ֥ה מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: fr
  text: 'Le jeune homme chargé de surveiller les moissonneurs lui répondit : « C’est une jeune Moabite qui est revenue avec Noémi de la campagne de Moab[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du champ de Moab » ; le singulier hébreu peut désigner collectivement les terres agricoles de Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: lui répondit
  rationale: La formule narrative hébraïque « répondit et dit » est rendue par l’expression française naturelle « répondit », sans répétition lourde. Le complément « lui » explicite naturellement l’interlocuteur immédiat, Booz.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר désigne ici un jeune homme; sa fonction est précisée séparément par le participe qui suit, sans introduire dans le nom le sens plus spécifique de « contremaître ».
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: chargé de surveiller les moissonneurs
  rationale: Dans ce contexte, נצב על indique une responsabilité établie à l’égard des moissonneurs. Cette formulation française exprime clairement la fonction de supervision tout en évitant le titre plus précis de « contremaître ».
- source_word: הַקּוֹצְרִים
  choice: les moissonneurs
  rationale: Le participe substantivé de קצר désigne ceux qui moissonnent; « moissonneurs » est direct, naturel et adapté au cadre agricole.
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: une jeune Moabite
  rationale: נַעֲרָה désigne une jeune femme et מוֹאֲבִיָּה marque son origine moabite. En français, « une jeune Moabite » est fluide et conserve ces deux éléments.
- source_word: הִיא
  choice: C’est
  rationale: Dans cette phrase d’identification, la tournure présentative « C’est » est plus idiomatique en français que « Elle est », tout en reflétant le pronom indépendant hébreu.
- source_word: הַשָּׁבָה
  choice: qui est revenue
  rationale: Le participe de שוב exprime le retour déjà accompli et établit un lien avec le motif narratif du retour de Noémi et Ruth.
- source_word: עִם נָעֳמִי
  choice: avec Noémi
  rationale: La préposition עִם indique simplement l’accompagnement; « avec Noémi » en est l’équivalent direct.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: de la campagne de Moab
  rationale: Le singulier שְׂדֵה peut désigner collectivement les terres ouvertes ou agricoles d’une région. « La campagne de Moab » restitue ce sens régional en français naturel, tandis que le sens littéral reste signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative est allégée selon l’usage français, notamment par la fusion de « répondit et dit ». Le vocabulaire agricole demeure concret, et la note conserve l’ambiguïté du singulier hébreu.
