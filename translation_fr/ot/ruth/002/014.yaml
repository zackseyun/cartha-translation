  text: וַ/יֹּאמֶר֩ לָ֨/ה בֹ֜עַז לְ/עֵ֣ת הָ/אֹ֗כֶל גֹּ֤שִֽׁי הֲלֹם֙ וְ/אָכַ֣לְתְּ מִן הַ/לֶּ֔חֶם וְ/טָבַ֥לְתְּ פִּתֵּ֖/ךְ בַּ/חֹ֑מֶץ וַ/תֵּ֨שֶׁב֙ מִ/צַּ֣ד הַ/קּֽוֹצְרִ֔ים וַ/יִּצְבָּט לָ֣/הּ קָלִ֔י וַ/תֹּ֥אכַל וַ/תִּשְׂבַּ֖ע וַ/תֹּתַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: fr
  text: 'Au moment du repas, Booz lui dit : « Approche, mange du pain et trempe ton morceau dans le vin aigre[a]. » Elle s’assit donc à côté des moissonneurs, et il lui tendit du grain rôti. Elle mangea à satiété et en eut de reste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le vinaigre ». Le mot hébreu peut désigner du vinaigre ou une boisson faite de vin devenu aigre ; dans le contexte de ce repas aux champs, il s’agit probablement de vin aigre.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: Au moment du repas
  rationale: Expression française naturelle qui conserve la valeur temporelle de l’hébreu et situe la scène au repas des ouvriers.
- source_word: גֹּשִׁי הֲלֹם
  choice: Approche
  rationale: L’impératif exprime une invitation à venir près de Booz et des moissonneurs ; « Approche » est direct, naturel et légèrement plus précis ici que « Viens ici ».
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: mange du pain
  rationale: La préposition מִן a ici une valeur partitive, rendue naturellement en français par l’article partitif « du ».
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: trempe ton morceau dans le vin aigre
  rationale: פַּת désigne un morceau, implicitement de pain dans ce contexte. חֹמֶץ peut désigner du vinaigre ou une boisson de vin acidulée ; « vin aigre » garde la proximité lexicale et convient au repas des ouvriers, tandis que l’autre possibilité est signalée en note.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: à côté des moissonneurs
  rationale: Cette formulation claire conserve la position spatiale et le cadre agricole.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: il lui tendit du grain rôti
  rationale: Le verbe rare décrit vraisemblablement le geste de présenter ou donner la nourriture ; « tendit » restitue ce geste sans le préciser excessivement. קָלִי est du grain rôti.
- source_word: וַתִּשְׂבַּע
  choice: Elle mangea à satiété
  rationale: Le verbe exprime le fait d’être rassasié ; cette tournure française naturelle préserve explicitement le contexte alimentaire.
- source_word: וַתֹּתַר
  choice: en eut de reste
  rationale: La forme féminine poursuit la chaîne narrative dont Ruth est le sujet et indique qu’il lui resta de la nourriture ; le pronom « en » reprend naturellement le grain.
