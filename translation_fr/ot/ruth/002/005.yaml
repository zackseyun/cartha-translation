  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
translation:
  language: fr
  text: 'Booz dit alors à son jeune homme, préposé aux moissonneurs : « À qui appartient cette jeune femme[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De quelle maison est cette jeune femme ? » La question hébraïque porte sur son appartenance ou son rattachement à un foyer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit. « Alors », placé naturellement après le sujet, marque la succession sans alourdir le français par une répétition de « et ».
- source_word: בֹּעַז
  choice: Booz
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: לְנַעֲרוֹ
  choice: au jeune homme
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. « Jeune homme » conserve le sens lexical sans préciser davantage son statut; sa fonction est indiquée par la proposition suivante.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: chargé de surveiller les moissonneurs
  rationale: La construction exprime une position d'autorité ou de supervision sur les moissonneurs. Cette formulation française naturelle conserve la fonction assignée au jeune homme.
- source_word: לְמִי
  choice: À qui appartient
  rationale: L'expression demande à quel foyer, maître ou groupe social la jeune femme est rattachée. La formulation française est concise, tandis qu'une note préserve l'étendue du sens social de l'hébreu.
- source_word: הַנַּעֲרָה
  choice: cette jeune femme
  rationale: נַעֲרָה désigne une jeune personne de sexe féminin. « Jeune femme » est actuel et digne, sans lui attribuer explicitement le statut de servante.
- source_word: הַזֹּאת
  choice: cette
  rationale: Le démonstratif hébreu est rendu directement par le déterminant démonstratif français.
