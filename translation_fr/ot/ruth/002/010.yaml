  text: וַ/תִּפֹּל֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תֹּ֣אמֶר אֵלָ֗י/ו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ לְ/הַכִּירֵ֔/נִי וְ/אָּנֹכִ֖י נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: fr
  text: 'Alors elle tomba face contre terre et se prosterna à terre. Elle lui dit : « Pourquoi ai-je trouvé faveur à tes yeux, pour que tu me remarques[a], alors que je suis une étrangère ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu me reconnaisses », « tu t’intéresses à moi » ou « tu me considères ».
    reason: Le verbe hébreu peut exprimer le fait de reconnaître quelqu’un, de le remarquer ou de lui accorder de la considération.
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: elle tomba face contre terre
  rationale: Cette formulation naturelle conserve l’image concrète de la chute sur le visage et exprime clairement l’humilité profonde du geste.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: et se prosterna jusqu’à terre
  rationale: Le verbe décrit une profonde inclinaison ou prosternation. Cette traduction préserve le geste physique sans lui attribuer ici le sens cultuel d’une adoration.
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et naturel en français moderne.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: ai-je trouvé faveur à tes yeux
  rationale: La traduction conserve l’image de l’expression hébraïque. « Faveur » convient au contexte relationnel sans introduire la charge théologique que pourrait prendre « grâce ».
- source_word: לְהַכִּירֵנִי
  choice: pour que tu prennes ainsi attention à moi
  rationale: Le hiphil de נכר peut signifier reconnaître, remarquer, considérer ou prêter attention. Dans le contexte, Ruth s’étonne de l’attention favorable que Booz lui accorde. La note préserve l’éventail lexical.
- source_word: וְאָנֹכִי
  choice: alors que je suis
  rationale: 'Le contexte donne à la coordination une valeur concessive : l’attention de Booz contraste avec la condition d’étrangère de Ruth.'
- source_word: נָכְרִיָּה
  choice: une étrangère
  rationale: Le nom/adjectif féminin singulier désigne explicitement une femme étrangère. « Une étrangère » est exact, idiomatique et conserve le genre grammatical du texte.
theological_decisions:
- issue: Nuance potentiellement cultuelle de וַתִּשְׁתַּחוּ
  choice: Le rendre comme un geste de profond respect devant Booz, sans parler d’adoration
  alternative: Employer « adora » ou une autre expression explicitement cultuelle
  rationale: Dans cette scène narrative, Ruth manifeste sa déférence envers Booz ; rien n’indique qu’elle lui rende un culte. « Se prosterna jusqu’à terre » décrit l’action sans importer une affirmation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au dialogue direct de l’hébreu. La formulation conserve les images hébraïques compréhensibles (« faveur à tes yeux ») tout en rendant naturellement la valeur concessive de la fin du verset.
