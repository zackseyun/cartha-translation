revisions:
- from: 'Alors elle tomba face contre terre et se prosterna jusqu’à terre. Elle lui dit : « Pourquoi ai-je trouvé faveur à tes yeux, pour que tu prennes ainsi attention à moi[a], alors que je suis une étrangère ? »'
  to: 'Alors elle tomba face contre terre et se prosterna à terre. Elle lui dit : « Pourquoi ai-je trouvé faveur à tes yeux, pour que tu me remarques[a], alors que je suis une étrangère ? »'
  rationale: La révision remplace le calque non idiomatique « prendre attention à » par « remarquer », qui rend naturellement le sens contextuel de la forme hiphil de נכר. Elle ajuste aussi « jusqu’à terre » en « à terre ». Les autres choix préservent la fidélité au texte source, y compris le geste de profond respect sans connotation cultuelle imposée et la nuance concessive finale.
