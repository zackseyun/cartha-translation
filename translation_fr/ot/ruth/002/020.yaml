base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: fr
  text: 'Noémi dit à sa belle-fille[a] : « Qu’il soit béni par Yahvé, lui qui n’a pas privé les vivants ni les morts de sa bonté. » Puis Noémi lui dit : « Cet homme est l’un de nos proches parents ; il est l’un de nos proches parents habilités à exercer le droit de rachat[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition « lui qui n’a pas privé les vivants ni les morts de sa bonté » peut aussi se rapporter à Booz : sa bonté envers les vivants et les morts serait alors celle de Booz plutôt que celle de Yahvé.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « il est l’un de nos rédempteurs ». Il s’agit d’un proche parent ayant, dans le cadre familial israélite, le droit ou la responsabilité de racheter un membre de la famille ou un bien familial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: Qu’il soit béni par Yahvé
  rationale: La formule nominale exprime ici une bénédiction prononcée sur Booz. Cette tournure est naturelle en français moderne tout en conservant la forme passive et Yahvé comme source de la bénédiction.
- source_word: חַסְדּוֹ
  choice: sa bonté
  rationale: חֶסֶד peut désigner la bonté, l’amour fidèle ou la loyauté. « Bonté » convient au contexte sans préciser abusivement si le pronom renvoie à Yahvé ou à Booz.
- source_word: לֹא עָזַב
  choice: n’a retiré
  rationale: Avec « sa bonté » et des bénéficiaires humains, « n’a retiré » rend naturellement en français l’idée de ne pas abandonner ou faire défaut, sans introduire l’idée plus précise de simplement « cesser de montrer ».
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: ni aux vivants ni aux morts
  rationale: Après la négation, la corrélation « ni… ni… » exprime idiomatiquement la totalité visée par l’hébreu.
- source_word: קָרוֹב לָנוּ
  choice: l’un de nos proches parents
  rationale: קָרוֹב désigne ici la proximité familiale et non géographique. Cette formulation est claire et idiomatique.
- source_word: מִגֹּאֲלֵנוּ
  choice: l’un de ceux qui peuvent exercer pour nous le droit de rachat
  rationale: Le participe de גאל désigne un parent investi, selon le droit familial israélite, de la faculté ou de la responsabilité de racheter des biens ou d’agir en faveur de membres de sa famille. La périphrase évite que « rédempteur » soit compris uniquement dans un sens religieux ultérieur.
theological_decisions:
- issue: 'Référent des pronoms dans la bénédiction : la bonté est-elle celle de Yahvé ou celle de Booz ?'
  choice: Dans le texte principal, « lui qui » se rattache le plus naturellement à Yahvé, de sorte que la bonté est celle de Yahvé.
  alternative: La proposition peut être comprise comme parlant de la bonté de Booz envers les vivants et les morts.
  rationale: Yahvé est l’antécédent immédiat et cette lecture s’accorde avec le thème de l’action bienveillante de Dieu par l’intermédiaire d’agents humains. Toutefois, la syntaxe hébraïque permet aussi de rapporter la bonté à Booz ; l’ambiguïté est donc signalée en note.
- issue: Portée du terme גֹּאֵל
  choice: 'Employer une formulation juridique et familiale : « ceux qui peuvent exercer pour nous le droit de rachat ».'
  alternative: « l’un de nos parents-rédempteurs » ou « l’un de nos rédempteurs ».
  rationale: Le terme appartient au cadre des obligations et droits de la parenté en Israël. La traduction retenue prévient une lecture exclusivement christologique tout en préservant la fonction juridique du proche parent.
translation_notes:
  register: Français international moderne, naturel et digne. Le nom divin est rendu par « Yahvé ». La formulation juridique concernant le גֹּאֵל reste accessible sans recourir dans le texte principal au terme spécialisé « parent-rédempteur ».
