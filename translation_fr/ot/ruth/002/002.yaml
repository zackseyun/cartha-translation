  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: fr
  text: 'Ruth la Moabite dit à Noémi : « Permets-moi, je te prie, d’aller au champ glaner parmi les épis derrière celui auprès de qui je trouverai faveur[a]. » Noémi lui répondit : « Va, ma fille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « derrière celui aux yeux de qui je trouverai faveur » ; cette expression hébraïque signifie bénéficier du regard favorable de quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: la Moabite
  rationale: Ce gentilé conserve l’accent narratif sur l’origine étrangère de Ruth, dans une formulation française brève et naturelle.
- source_word: אֵלְכָה נָּא
  choice: Permets-moi, je te prie, d’aller
  rationale: Le cohortatif accompagné de נָא exprime ici une demande volontaire et déférente adressée à Noémi.
- source_word: הַשָּׂדֶה
  choice: au champ
  rationale: Le singulier défini est conservé; en français, « aller au champ » convient naturellement au cadre agricole immédiat.
- source_word: וַאֲלַקֳטָּה בַשִּׁבֳּלִים
  choice: glaner des épis
  rationale: « Glaner » rend l’action précise de ramasser ce que la moisson a laissé, tandis que « des épis » restitue le référent concret de שִׁבֳּלִים sans suggérer des gerbes déjà liées.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: derrière celui auprès de qui je trouverai faveur
  rationale: La formulation garde le masculin singulier du suffixe, l’idée de suivre derrière quelqu’un et l’expression sociale « trouver faveur », sans identifier plus précisément cet homme comme propriétaire, surveillant ou moissonneur.
- source_word: לְכִי בִתִּי
  choice: Va, ma fille
  rationale: L’impératif simple et l’appellation affectueuse sont rendus directement et naturellement.
theological_decisions: []
