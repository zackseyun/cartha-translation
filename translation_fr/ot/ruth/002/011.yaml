base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: fr
  text: 'Booz lui répondit : « On m’a raconté en détail tout ce que tu as fait pour ta belle-mère après la mort de ton mari. Tu as quitté ton père, ta mère et ton pays natal, et tu es allée vers un peuple que tu ne connaissais pas auparavant[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que tu ne connaissais ni hier ni avant-hier » ; cette expression signifie ici « auparavant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן בֹּעַז וַיֹּאמֶר לָהּ
  choice: Booz lui répondit
  rationale: La formule hébraïque « répondit et dit » est rendue par l’expression française naturelle « répondit », sans perte de contenu narratif.
- source_word: הֻגֵּד הֻגַּד לִי
  choice: On m’a raconté en détail
  rationale: L’infinitif absolu suivi de la forme verbale passive intensifie l’idée du rapport reçu. La tournure impersonnelle française conserve le sens passif, tandis que « en détail » exprime l’intensification avec naturel.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: tout ce que tu as fait pour ta belle-mère
  rationale: « Tout ce que » restitue la totalité exprimée par כֹּל, et « pour » fait ressortir naturellement en français la valeur bénéficiaire impliquée par le contexte.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: après la mort de ton mari
  rationale: Cette formulation conserve la construction nominale et le ton sobre de l’hébreu.
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: Tu as quitté ton père, ta mère
  rationale: « Quitté » est actuel et non chargé; chaque parent est nommé séparément comme dans le texte source.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: et ton pays natal
  rationale: « Pays natal » transmet de manière idiomatique l’idée du pays de naissance ou d’origine.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: et tu es allée vers un peuple
  rationale: « Aller vers » conserve le mouvement exprimé par הלך ainsi que le point de vue de Ruth quittant son pays.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: que tu ne connaissais pas
  rationale: Le verbe ידע désigne ici l’absence de connaissance ou de familiarité personnelle avec ce peuple.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: auparavant
  rationale: L’expression idiomatique désigne le temps antérieur. « Auparavant » en donne clairement le sens en français, tandis que la formulation concrète de l’hébreu est signalée en note.
