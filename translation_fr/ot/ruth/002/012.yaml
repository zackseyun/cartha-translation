id: RUT.2.12
reference: Ruth 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: fr
  text: Que Yahweh te rende selon ce que tu as fait, et que ta récompense soit complète de la part de Yahweh, le Dieu d’Israël, sous les ailes duquel tu es venue chercher refuge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: Que … te rende
  rationale: Le piel à valeur jussive exprime ici le souhait formulé par Booz. « Que … te rende » traduit naturellement l’idée de rétribution et conserve l’écho avec שְׁלֵמָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: פָּעֳלֵךְ
  choice: selon ce que tu as fait
  rationale: Le nom désigne l’action ou l’œuvre de Ruth. Cette formulation française rend clairement l’objet de la rétribution sans suggérer un emploi salarié.
- source_word: וּתְהִי
  choice: et que … soit
  rationale: Le jussif poursuit le parallélisme du souhait exprimé dans la première proposition.
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: ta récompense
  rationale: Le terme peut désigner un salaire ou une récompense. Dans ce contexte de rétribution divine, « récompense » est le choix le plus naturel.
- source_word: שְׁלֵמָה
  choice: complète
  rationale: L’adjectif exprime la plénitude ou le caractère entier de la récompense et fait écho à la racine שׁלם du premier verbe.
- source_word: מֵעִם
  choice: de la part de
  rationale: La préposition marque la source de la récompense; « de la part de » est idiomatique dans une bénédiction française.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct et naturel de la construction hébraïque.
- source_word: לַחֲסוֹת
  choice: chercher refuge
  rationale: L’infinitif exprime le fait de se réfugier ou de chercher refuge; associé à « tu es venue », ce choix préserve la nuance de démarche volontaire.
- source_word: תַּחַת כְּנָפָיו
  choice: sous les ailes duquel
  rationale: L’image protectrice des ailes est conservée, tandis que le relatif rattache clairement la proposition au Dieu d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom divin sans le remplacer par un titre.
- issue: Nature de la rétribution divine
  choice: récompense
  alternative: salaire
  rationale: Le mot hébreu admet les deux sens, mais le contexte présente la bénédiction de Booz et la rétribution accordée par Dieu, non une rémunération contractuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la bénédiction et l’image des ailes sont conservés. Le féminin « venue » correspond à Ruth, destinataire du discours.
