base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: fr
  text: 'Alors Noémi dit à Ruth, sa belle-fille : « C’est bien, ma fille, que tu sortes avec ses jeunes femmes, afin qu’on ne t’importune pas[a] dans un autre champ. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin qu’on ne te rencontre pas dans un autre champ ». Le verbe hébreu peut désigner une simple rencontre ou une confrontation nuisible ; le souci de Noémi pour la sécurité de Ruth favorise ici le sens négatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors ... dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: כַּלָּתָהּ
  choice: sa belle-fille
  rationale: Le nom avec suffixe féminin singulier désigne explicitement le lien familial de Ruth avec Noémi.
- source_word: טוֹב
  choice: C’est bien
  rationale: Cette formulation conserve l’évaluation simple exprimée par l’adjectif hébreu sans en faire un superlatif.
- source_word: בִּתִּי
  choice: ma fille
  rationale: Terme d’affection et de relation familiale, employé ici par Noémi sans indiquer une maternité biologique.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Noémi estime bon.
- source_word: תֵצְאִי
  choice: tu sortes
  rationale: Le verbe signifie littéralement « sortir » ; la traduction n’ajoute pas l’idée de glaner, fournie seulement par le contexte.
- source_word: נַעֲרוֹתָיו
  choice: ses jeunes femmes
  rationale: Le féminin pluriel désigne les jeunes femmes rattachées à Booz, sans préciser outre mesure leur statut social.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: afin que personne ne s’en prenne à toi
  rationale: Le verbe פגע peut désigner une rencontre ou une confrontation nuisible. Le tour impersonnel français rend naturellement le sujet pluriel non identifié, tandis que « s’en prendre à » reflète la menace suggérée par le contexte.
- source_word: בְּשָׂדֶה אַחֵר
  choice: dans un autre champ
  rationale: Traduction directe et idiomatique de la proposition locative.
