base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: fr
  text: Elle resta près des jeunes femmes de Booz pour glaner[a], jusqu’à la fin de la moisson de l’orge et de la moisson du blé. Et elle habita avec sa belle-mère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle demeura étroitement attachée aux jeunes femmes de Booz ». Le verbe hébreu peut souligner un attachement étroit.
    reason: lexical_alternative
  - marker: b
    text: Ou « elle resta avec sa belle-mère ». Le verbe hébreu peut signifier « rester », « demeurer » ou « habiter », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: elle resta donc près de
  rationale: Le verbe דבק exprime un attachement étroit ou le fait de demeurer tout près. Dans ce contexte narratif, « resta près de » rend naturellement la continuité de l’association sans suggérer nécessairement un contact physique; la note conserve la force plus littérale.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: des jeunes femmes de Booz
  rationale: נַעֲרוֹת désigne ici les jeunes femmes au service de Booz. La tournure avec « près de » rend idiomatiquement la préposition ב après דבק.
- source_word: לְלַקֵּט
  choice: pour glaner
  rationale: L’infinitif avec ל exprime ici le but. « Glaner » est le terme agricole précis et usuel dans le livre de Ruth.
- source_word: עַד כְּלוֹת
  choice: jusqu’à la fin de
  rationale: La construction indique une durée allant jusqu’à l’achèvement des récoltes.
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: la moisson de l’orge et la moisson du blé
  rationale: La répétition de « moisson » reproduit le parallélisme hébreu et souligne que Ruth resta pendant les deux récoltes successives.
- source_word: וַתֵּשֶׁב
  choice: elle habitait
  rationale: ישב peut signifier s’asseoir, demeurer, rester ou habiter. Ici, avec la belle-mère de Ruth, « habitait » exprime naturellement la résidence commune tout en laissant « resta » comme possibilité contextuelle.
- source_word: אֶת חֲמוֹתָהּ
  choice: avec sa belle-mère
  rationale: Avec ישב, אֶת indique ici la personne auprès de qui Ruth demeure; le français idiomatique exige « avec ».
