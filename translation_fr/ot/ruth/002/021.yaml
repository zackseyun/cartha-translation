  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: fr
  text: 'Puis Ruth la Moabite ajouta : « Il m’a aussi dit : “Reste près de mes jeunes gens[a] jusqu’à ce qu’ils aient terminé toute ma moisson.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « jeunes gens » au masculin. Le verset 8 mentionne des jeunes femmes.
    reason: textual_clarification
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Puis … ajouta
  rationale: Le waw consécutif fait progresser le récit. Dans ce contexte, Ruth complète ce qu’elle vient de rapporter ; « ajouta » exprime naturellement cette continuité sans changer le contenu de sa parole.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: Ruth la Moabite
  rationale: Formulation française actuelle et usuelle pour le nom propre suivi du gentilé féminin.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: Il m’a même dit
  rationale: גַּם ajoute ici un élément au compte rendu de Ruth et peut porter une nuance d’insistance. « même » rend cette valeur de façon naturelle.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: avec mes jeunes gens
  rationale: עִם signifie « avec », et נְעָרִים est morphologiquement masculin pluriel. Dans le cadre de la moisson, le groupe désigne les jeunes hommes au service de Booz ; « jeunes gens » conserve le masculin tout en restant idiomatique.
- source_word: תִּדְבָּקִין
  choice: Reste avec
  rationale: דבק exprime le fait de s’attacher à quelqu’un ou de rester tout près. Ici, l’impératif français « reste avec » restitue clairement l’instruction pratique adressée à Ruth.
- source_word: עַד אִם כִּלּוּ
  choice: jusqu’à ce qu’ils aient terminé
  rationale: La locution marque le terme jusqu’auquel Ruth doit rester avec eux ; le subjonctif passé convient naturellement en français.
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: toute ma moisson
  rationale: Cette formulation concise garde à la fois l’idée de totalité et l’appartenance à Booz.
