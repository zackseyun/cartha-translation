  text: וַ֠/תֹּאמֶר אֶמְצָא חֵ֨ן בְּ/עֵינֶ֤י/ךָ אֲדֹנִ/י֙ כִּ֣י נִֽחַמְתָּ֔/נִי וְ/כִ֥י דִבַּ֖רְתָּ עַל לֵ֣ב שִׁפְחָתֶ֑/ךָ וְ/אָנֹכִי֙ לֹ֣א אֶֽהְיֶ֔ה כְּ/אַחַ֖ת שִׁפְחֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: fr
  text: 'Alors elle dit : « Puissé-je trouver grâce à tes yeux, mon seigneur, car tu m’as réconfortée et tu as parlé au cœur de ta servante[a], bien que je ne sois pas même l’une de tes servantes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tu as parlé avec bonté à ta servante » ou « tu as rassuré ta servante ». L’hébreu dit littéralement : « tu as parlé au cœur de ta servante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: Puissé-je trouver grâce
  rationale: L’imparfait à la première personne exprime ici un souhait déférent. Cette formulation conserve l’idée hébraïque de « trouver grâce » tout en restant naturelle dans ce contexte respectueux.
- source_word: בְּעֵינֶיךָ
  choice: à tes yeux
  rationale: Cette expression conserve l’image de l’idiome hébreu désignant le regard favorable ou l’approbation d’une personne.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’une adresse humaine respectueuse à Booz, et non d’un titre divin. « Mon seigneur » rend la forte déférence sociale sans imposer explicitement un rapport de propriété.
- source_word: נִחַמְתָּנִי
  choice: tu m’as réconfortée
  rationale: Le verbe exprime ici le réconfort apporté à Ruth dans sa situation de vulnérabilité. L’accord féminin rend explicite le genre de la locutrice en français.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: tu as parlé au cœur de
  rationale: La traduction préserve l’image hébraïque, qui évoque des paroles bienveillantes, consolantes ou rassurantes; ce sens idiomatique est indiqué en note.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: ta servante / tes servantes
  rationale: Le nom désigne spécifiquement une femme en position de servante ou d’esclave. « Servante » convient à l’auto-désignation déférente de Ruth et maintient le féminin sans accentuer au-delà du contexte la dimension servile.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: bien que je ne sois pas même l’une de
  rationale: « Bien que » exprime naturellement la valeur concessive du contraste. « Pas même » fait ressortir que Ruth se considère d’un rang inférieur aux servantes de Booz, sans transformer cette nuance en affirmation juridique.
