  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: fr
  text: 'Elle a dit : « Permettez-moi, je vous prie, de glaner et de ramasser parmi les gerbes, derrière les moissonneurs. » Puis elle est venue et elle est restée depuis ce matin jusqu’à maintenant ; elle ne s’est assise que peu de temps dans la maison.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens de la dernière proposition hébraïque est incertain. On peut aussi comprendre : « elle ne s’est reposée que peu de temps dans l’abri ». Le mot traduit par « maison » peut désigner ici l’abri des ouvriers.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: Permets-moi, s’il te plaît, de glaner
  rationale: Le cohortatif accompagné de נָא exprime une demande respectueuse. « Glaner » est le terme agricole précis et courant en français.
- source_word: וְאָסַפְתִּי
  choice: et de ramasser
  rationale: 'Cette formulation distingue אסף de לקט : Ruth demande non seulement de glaner, mais aussi de recueillir ce qu’elle trouve.'
- source_word: בָעֳמָרִים
  choice: parmi les gerbes
  rationale: עֳמָרִים désigne des gerbes ou javelles de céréales liées ; « parmi les gerbes » conserve l’image et la relation spatiale.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: derrière les moissonneurs
  rationale: 'Le sens spatial est ici naturel : Ruth glane en suivant les ouvriers qui moissonnent.'
- source_word: וַתָּבֹא וַתַּעֲמוֹד
  choice: Elle est donc venue et elle est restée là
  rationale: Le second verbe signifie littéralement « se tenir debout », mais, avec l’indication de durée qui suit, il décrit vraisemblablement sa présence continue. « Est restée là » rend ce sens sans suggérer qu’elle serait demeurée immobile.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: depuis le matin jusqu’à présent
  rationale: Cette expression transmet directement la durée qui va du début de la matinée au moment où le responsable parle.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: elle ne s’est assise que peu de temps dans l’abri
  rationale: La syntaxe hébraïque est difficile. Le rendu retient l’idée probable d’une courte pause assise et comprend « la maison » comme l’abri utilisé par les ouvriers dans le champ, tout en signalant l’incertitude en note.
