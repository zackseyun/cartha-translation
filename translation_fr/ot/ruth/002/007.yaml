  naturalness: Le français est généralement clair et moderne. « Permets-moi, s’il te plaît » emploie un tutoiement non motivé envers un responsable de champ ; « Permettez-moi, je vous prie » conserve la politesse sans archaïsme. « Depuis ce matin jusqu’à maintenant » est plus idiomatique que « depuis le matin jusqu’à présent » dans ce contexte.
  terminology: « Glaner », « ramasser », « gerbes » et « moissonneurs » sont appropriés. Le terme littéral « maison » doit être maintenu, avec une note indiquant qu’il peut désigner un abri des ouvriers.
