base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: fr
  text: Elle partit, se rendit dans un champ et glana derrière les moissonneurs. Par hasard[a], elle se trouva dans la parcelle du champ qui appartenait à Booz, du clan d’Élimélek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son hasard arriva ». Cette expression hébraïque présente l’événement comme fortuit du point de vue humain, tandis que l’ensemble du récit invite aussi à y discerner la providence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: Elle partit donc, se rendit
  rationale: Cette formulation conserve les deux verbes successifs du récit hébreu tout en restant naturelle en français moderne.
- source_word: וַתְּלַקֵּט
  choice: glana
  rationale: « Glaner » est le terme agricole précis pour ramasser ce qui reste après le passage des moissonneurs.
- source_word: בַּשָּׂדֶה
  choice: dans un champ
  rationale: Malgré l’article hébreu, le français introduit naturellement ici le lieu comme « un champ », puisqu’aucun champ précis n’a encore été identifié.
- source_word: אַחֲרֵי הַקֹּצְרִים
  choice: derrière les moissonneurs
  rationale: 'L’expression a ici un sens spatial : Ruth glane à la suite de ceux qui coupent les céréales.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: Il se trouva qu’elle arriva
  rationale: Cette tournure rend l’idée de circonstance apparemment fortuite sans reproduire lourdement l’expression cognate hébraïque.
- source_word: חֶלְקַת הַשָּׂדֶה לְבֹעַז
  choice: dans la parcelle qui appartenait à Booz
  rationale: « Parcelle » exprime clairement une portion délimitée du terrain, et « appartenait à » explicite la relation possessive marquée par לְ.
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: du clan d’Élimélek
  rationale: Dans ce contexte social et généalogique, מִשְׁפָּחָה désigne plus précisément un groupe de parenté étendu qu’une simple famille nucléaire.
theological_decisions:
- issue: Le hasard apparent et la providence dans le récit
  choice: 'Conserver dans le texte l’expression d’une circonstance apparemment fortuite : « Il se trouva que »'
  alternative: Expliciter une direction providentielle de Dieu, ou traduire littéralement « son hasard arriva »
  rationale: L’hébreu décrit l’événement au niveau de l’expérience humaine comme une coïncidence, tandis que l’ensemble du récit permet au lecteur d’y discerner la providence. La traduction ne tranche pas explicitement cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme marqué. « Booz » et « Élimélek » suivent les formes françaises bibliques usuelles.
