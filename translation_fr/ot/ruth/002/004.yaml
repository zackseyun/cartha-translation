  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: fr
  text: 'Et voici que Booz vint de Bethléem et dit aux moissonneurs : « Que Yahweh soit avec vous ! » Ils lui répondirent : « Que Yahweh te bénisse ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici que
  rationale: Le marqueur narratif attire l’attention sur l’arrivée de Booz et introduit la scène avec vivacité. « Or voici que » en conserve la fonction sans recourir au seul « voici », moins fluide ici.
- source_word: בֹּעַז
  choice: Booz
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: בָּא
  choice: arriva
  rationale: Dans ce contexte de déplacement depuis Bethléem vers le champ, « arriva » exprime naturellement l’entrée en scène, tout en restant fidèle au sens de בוא.
- source_word: מִבֵּית לֶחֶם
  choice: de Bethléem
  rationale: Rend directement la provenance indiquée par מִן et emploie la forme française usuelle du toponyme.
- source_word: לַקֹּצְרִים
  choice: aux moissonneurs
  rationale: Terme précis, naturel et adapté au cadre agricole de la récolte des céréales.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du tétragramme, qui préserve ici le nom divin plutôt que de le remplacer par un titre.
- source_word: עִמָּכֶם
  choice: soit avec vous
  rationale: La proposition hébraïque sans verbe, littéralement « Yahweh avec vous », fonctionne ici comme une salutation bénissante. Le subjonctif français en exprime naturellement la valeur souhaitée.
- source_word: יְבָרֶכְךָ
  choice: te bénisse
  rationale: La forme verbale exprime un souhait ou une bénédiction adressée à Booz au singulier ; « Que Yahweh te bénisse » en restitue clairement la force volitive.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel dans les deux bénédictions sans introduire un simple titre de substitution.
- issue: Valeur de יְהוָה עִמָּכֶם
  choice: Que Yahweh soit avec vous !
  alternative: Yahweh est avec vous.
  rationale: Dans cet échange de salutations, la proposition nominale a vraisemblablement une portée optative ou bénissante. Le français avec « que… soit » préserve cette force pragmatique plutôt que d’en faire une simple affirmation.
translation_notes:
  register: Français moderne, digne et oralement naturel. Le vouvoiement pluriel « vous » s’adresse au groupe des moissonneurs, tandis que « te » rend le singulier de la réponse adressée à Booz. Les exclamations signalent le caractère vivant des salutations sans amplifier leur contenu.
