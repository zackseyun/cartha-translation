  yaml_path: translation/ot/ruth/004/022.yaml
  text: And Obed fathered Jesse[a], and Jesse fathered David.
translation:
  language: fr
  text: Et Obed engendra[a] Jessé, et Jessé engendra David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut le père de » ; l’hébreu emploie ici la formule habituelle des généalogies.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: et
  rationale: La conjonction relie simplement cette dernière étape généalogique à la précédente; en français, la première occurrence peut rester implicite en début de phrase, tandis que la seconde se rend naturellement par « et ».
- source_word: עֹבֵד
  choice: Obed
  rationale: Forme traditionnelle et usuelle du nom propre en français biblique.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד signifie « engendrer, devenir le père de ». « Engendra » est concis, précis et suffisamment courant dans ce registre.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marque de l’objet direct sans équivalent lexical autonome en français; sa fonction est exprimée par la syntaxe.
- source_word: יִשַׁי / יִשָׁי
  choice: Jessé
  rationale: Forme française traditionnelle et immédiatement reconnaissable de ce nom propre.
- source_word: דָּוִד
  choice: David
  rationale: Forme française traditionnelle du nom propre דוד.
theological_decisions:
- issue: Rendu du verbe généalogique
  choice: engendra
  alternative: devint le père de
  rationale: « Engendra » conserve la force biologique et généalogique de l’hébreu sans ajouter de précision théologique étrangère au texte. La tournure « devint le père de » est possible, mais plus lourde.
translation_notes:
  register: Français moderne, sobre et digne. Le verbe « engendrer » relève naturellement du registre généalogique sans être obscur. Les noms suivent les formes françaises bibliques établies.
