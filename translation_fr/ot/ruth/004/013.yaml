  text: וַ/יִּקַּ֨ח בֹּ֤עַז אֶת רוּת֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/יָּבֹ֖א אֵלֶ֑י/הָ וַ/יִּתֵּ֨ן יְהוָ֥ה לָ֛/הּ הֵרָי֖וֹן וַ/תֵּ֥לֶד בֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: fr
  text: Boaz prit Ruth, et elle devint sa femme. Il s’unit à elle. Yahweh lui accorda de concevoir[a], et elle mit au monde un fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « Yahweh lui donna une conception »; ou « Yahweh lui permit de concevoir ».
    reason: La construction hébraïque attribue explicitement à Yahweh le don de la conception; la note indique la formulation littérale et une autre traduction idiomatique possible.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie littéralement « prendre ». Le contexte matrimonial est explicité par la proposition suivante; « prit » conserve donc la progression du récit hébreu sans remplacer le verbe par « épousa ».
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: elle devint sa femme
  rationale: Cette expression indique clairement l’établissement du lien conjugal. La formulation française reste naturelle tout en préservant la succession des propositions hébraïques.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Il s’unit à elle
  rationale: L’expression hébraïque est un euphémisme courant désignant l’union sexuelle. « S’unit à elle » en restitue le sens avec la retenue et la dignité du texte source.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle « Yahweh », plutôt que par un titre de substitution.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: Yahweh lui accorda une grossesse
  rationale: הֵרָיוֹן peut désigner la conception ou la grossesse. « Lui accorda une grossesse » exprime naturellement en français que Yahweh en est le donateur, sans ajouter d’explication théologique.
- source_word: וַתֵּלֶד בֵּן
  choice: elle mit au monde un fils
  rationale: Cette tournure française actuelle et digne rend clairement ילד avec son complément בֵּן.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom propre divin; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Action de Yahweh dans la conception de Ruth
  choice: Yahweh lui accorda une grossesse
  alternative: Yahweh lui permit de concevoir
  rationale: L’hébreu présente explicitement la conception ou grossesse comme donnée par Yahweh. Le rendu maintient cette action divine sans préciser davantage le mode de son intervention.
translation_notes:
  register: Français international moderne, sobre et narratif. « Il s’unit à elle » maintient l’euphémisme pudique de l’hébreu. La légère répétition entre « prit Ruth » et « elle devint sa femme » est conservée afin de respecter la structure du texte source.
