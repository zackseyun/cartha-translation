source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְד֣וֹת פָּ֔רֶץ פֶּ֖רֶץ הוֹלִ֥יד אֶת חֶצְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/018.yaml
  text: 'These are the generations of Perez: Perez fathered Hezron[a].'
translation:
  language: fr
  text: 'Voici la lignée de Pérets : Pérets engendra Hetsron[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Voici les descendants de Pérets » ou « Voici la généalogie de Pérets ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule introduit une nouvelle section généalogique. « Voici » rend naturellement en français moderne la valeur présentative de אֵלֶּה, tandis que le וְ marque ici la continuité du discours sans exiger un « et » explicite.
- source_word: תּוֹלְדוֹת
  choice: la lignée
  rationale: Dans ce contexte, le terme introduit une suite généalogique. « La lignée » est naturel et précis en français; « les générations » serait plus formel mais moins idiomatique, et « la généalogie » désignerait davantage le relevé que les personnes de la lignée.
- source_word: פָּרֶץ
  choice: Pérets
  rationale: Translittération française usuelle du nom hébreu, avec accent pour guider la prononciation.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le hiphil de ילד exprime ici la paternité dans une formule généalogique. « Engendra » est concis, exact et demeure compréhensible dans un registre biblique digne.
- source_word: אֶת
  choice: '[marqueur de l’objet direct, non traduit]'
  rationale: Cette particule grammaticale marque en hébreu l’objet direct défini et n’a pas d’équivalent lexical à rendre en français.
- source_word: חֶצְרוֹן
  choice: Hetsron
  rationale: Translittération française du nom hébreu חֶצְרוֹן.
