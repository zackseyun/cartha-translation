id: RUT.4.12
reference: Ruth 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: fr
  text: Que ta maison[a] soit comme la maison de Pérets, que Tamar enfanta à Juda, par la descendance[b] que Yahweh te donnera de cette jeune femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « maison » désigne la maisonnée ou la lignée familiale, et non seulement un bâtiment.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « la semence »; ce mot hébreu désigne couramment la descendance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: Que … soit
  rationale: La forme exprime ici un souhait de bénédiction. La tournure française « Que … soit » en restitue naturellement la valeur optative.
- source_word: בֵיתְךָ
  choice: ta maison
  rationale: « Maison » préserve l’image hébraïque tout en pouvant désigner la maisonnée et la lignée familiale dans ce contexte généalogique.
- source_word: כְּבֵית פֶּרֶץ
  choice: comme la maison de Pérets
  rationale: Cette formulation conserve la comparaison et l’expression généalogique « maison de ».
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: que Tamar enfanta à Juda
  rationale: Le relatif renvoie à Pérets, et « enfanta à Juda » rend avec concision le verbe de naissance et le complément hébreu לִיהוּדָה.
- source_word: מִן הַזֶּרַע
  choice: par la descendance
  rationale: זֶרַע signifie littéralement « semence » et, par extension courante, « descendance ». « Par » exprime ici le moyen ou l’origine de l’établissement de cette maison sans imposer une causalité plus forte que le texte.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: que Yahweh te donnera
  rationale: Le verbe נתן présente la descendance comme un don divin attendu dans le cadre de la bénédiction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh ».
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: de cette jeune femme
  rationale: נַעֲרָה désigne une jeune femme; « de » traduit naturellement ici l’origine maternelle de la descendance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom propre sans le remplacer par un titre.
- issue: Portée de בֵּית dans une bénédiction généalogique
  choice: maison
  alternative: famille / lignée
  rationale: « Maison » conserve l’image et la largeur de sens de l’hébreu, qui englobe ici maisonnée, famille et lignée.
- issue: Rapport exprimé par מִן הַזֶּרַע
  choice: par la descendance
  alternative: grâce à la descendance / à partir de la descendance
  rationale: La préposition מִן peut marquer l’origine ou le point de départ. « Par » garde le lien souple entre la maison promise et la descendance, sans rendre explicitement causal ce qui demeure condensé en hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de bénédiction reste solennelle sans être archaïque. Les marqueurs de notes sont placés sur les mots qu’ils expliquent.
