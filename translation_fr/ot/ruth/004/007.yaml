source:
  edition: WLC
  text: וְ/זֹאת֩ לְ/פָנִ֨ים בְּ/יִשְׂרָאֵ֜ל עַל הַ/גְּאוּלָּ֤ה וְ/עַל הַ/תְּמוּרָה֙ לְ/קַיֵּ֣ם כָּל דָּבָ֔ר שָׁלַ֥ף אִ֛ישׁ נַעֲל֖/וֹ וְ/נָתַ֣ן לְ/רֵעֵ֑/הוּ וְ/זֹ֥את הַ/תְּעוּדָ֖ה בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: fr
  text: 'Voici comment on procédait autrefois en Israël en matière de rachat et d’échange, afin de valider toute affaire : un homme retirait sa sandale et la donnait à l’autre partie[a]. Cela servait d’attestation[b] en Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à son prochain » ou « à son compagnon ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de témoignage »; le terme désigne ici la confirmation officielle de l’affaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: autrefois
  rationale: Le terme situe explicitement la pratique dans le passé. « Autrefois » est naturel, concis et ne donne pas au verset une tonalité inutilement archaïque.
- source_word: הַגְּאוּלָּה
  choice: rachat
  rationale: Dans le cadre juridique et familial de Ruth 4, le mot désigne l’action de reprendre ou d’acquérir un bien en exerçant un droit de rachat. « Rachat » exprime ce sens concret sans ajouter une interprétation doctrinale.
- source_word: הַתְּמוּרָה
  choice: échange
  rationale: Le nom désigne un échange ou une substitution. « Échange » conserve sa portée générale sans préciser indûment le mécanisme juridique.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: afin de valider toute affaire
  rationale: לְקַיֵּם exprime ici l’établissement ou la confirmation officielle, tandis que כָּל דָּבָר reste général. « Valider toute affaire » rend clairement la fonction juridique de l’acte.
- source_word: שָׁלַף ... נַעֲלוֹ
  choice: retirait sa sandale
  rationale: Le verbe signifie tirer ou enlever; avec une sandale comme complément, « retirer » est idiomatique en français moderne. L’imparfait convient à la description d’une coutume ancienne.
- source_word: לְרֵעֵהוּ
  choice: à l’autre partie
  rationale: Le mot peut désigner le prochain, le compagnon ou l’associé. Dans cette procédure bilatérale, « l’autre partie » rend le référent contextuel tout en évitant de faire croire qu’il s’agit nécessairement d’un voisin.
- source_word: הַתְּעוּדָה
  choice: attestation
  rationale: Dans ce contexte, le terme désigne ce qui confirme officiellement l’affaire. « Attestation » garde la valeur probante et juridique du geste.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Voici comment on procédait » explicite naturellement la valeur coutumière de la phrase nominale hébraïque. La structure conserve le caractère général de « toute affaire » et décrit le geste sans en surinterpréter la portée.
