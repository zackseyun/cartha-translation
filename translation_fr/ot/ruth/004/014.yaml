source:
  edition: WLC
  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: fr
  text: 'Alors les femmes dirent à Noémi : « Béni soit Yahvé, qui ne t’a pas laissée aujourd’hui sans rédempteur[a][b] ! Que son nom soit célébré en Israël[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « proche parent chargé du rachat » ou « proche parent protecteur » : le mot hébreu désigne un membre de la famille ayant la responsabilité juridique de protéger les siens, de restaurer leurs droits et d’assurer la continuité de leur lignée.'
    reason: lexical_alternative
  - marker: b
    text: Le « rédempteur » peut désigner ici plus précisément le nouveau-né, appelé à restaurer la vie de Noémi, bien que certains comprennent cette expression plus largement à la lumière du rôle de Booz comme rédempteur dans ce chapitre.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « que son nom soit appelé en Israël » ; l’expression souhaite que son nom y soit connu, proclamé ou honoré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Alors … dirent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Le nom défini au pluriel désigne simplement les femmes de la communauté présentes dans la scène.
- source_word: בָּרוּךְ יְהוָה
  choice: Béni soit Yahvé
  rationale: Cette formulation conserve la forme traditionnelle et solennelle de la bénédiction hébraïque, tout en rendant le nom divin יהוה par « Yahvé ».
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: qui ne t’a pas laissée … sans
  rationale: Le hiphil de שבת exprime ici le fait de faire cesser ou de priver. Avec גֹּאֵל, la tournure française idiomatique signifie que Noémi n’a pas été laissée sans rédempteur.
- source_word: גֹּאֵל
  choice: rédempteur
  rationale: Le terme désigne un proche parent investi d’une responsabilité familiale et juridique de restauration ou de rachat. « Rédempteur » maintient le mot-clé du livre, tandis qu’une note en précise la portée concrète.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rendu direct et naturel de l’adverbe temporel, placé de manière à porter clairement sur le fait de ne pas être laissée sans rédempteur.
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: Que son nom soit célébré
  rationale: Littéralement, le nom « sera appelé ». Dans cette bénédiction, la formule souhaite qu’il soit connu, proclamé ou honoré ; « soit célébré » en restitue le sens sans imposer une interprétation du référent.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Le syntagme indique le peuple ou le milieu au sein duquel ce nom doit être connu et honoré.
theological_decisions:
- issue: Référent de גֹּאֵל (« rédempteur »)
  choice: Le texte principal conserve « rédempteur » sans préciser s’il s’agit directement du nouveau-né ou si la formulation garde aussi en vue l’action rédemptrice de Booz.
  alternative: Comprendre exclusivement le nouveau-né, Obed, comme celui qui restaure Noémi ; ou comprendre exclusivement Booz comme le proche parent ayant exercé le droit de rachat.
  rationale: Le contexte immédiat de la naissance et la mention de « son nom » favorisent le nouveau-né comme référent proche. Cependant, le cadre juridique du chapitre maintient le rôle de Booz à l’arrière-plan. La traduction préserve cette tension du texte hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Les exclamations rendent la tonalité de bénédiction des paroles des femmes. Le nom divin est translittéré « Yahvé », et l’ambiguïté concernant le référent de « rédempteur » est maintenue.
