  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
translation:
  language: fr
  text: Puis Noémi prit l’enfant, le posa sur ses genoux et devint sa nourrice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « personne chargée de l’élever » ou « femme qui prend soin de lui ». Le terme hébreu désigne une femme qui s’occupe d’un enfant et l’élève ; il ne signifie pas nécessairement qu’elle l’allaite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: prit
  rationale: Le verbe לקח décrit ici simplement l’action de prendre l’enfant; « prit » convient au déroulement narratif.
- source_word: הַיֶּלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon; dans ce contexte de naissance et de soins, « l’enfant » est le choix le plus naturel.
- source_word: וַתְּשִׁתֵהוּ
  choice: le posa
  rationale: Le verbe signifie mettre ou placer. « Le posa » exprime naturellement le geste accompli avec un nourrisson sans ajouter d’interprétation.
- source_word: בְחֵיקָהּ
  choice: sur ses genoux
  rationale: חֵיק désigne la région du giron, du sein ou des genoux. « Sur ses genoux » restitue concrètement l’image en français moderne, sans le caractère vieilli ou potentiellement plus intime de « sur son sein ».
- source_word: וַתְּהִי לוֹ
  choice: devint sa
  rationale: La construction היה + ל indique ici l’établissement d’un rôle ou d’une relation; « devint sa » rend naturellement cette évolution.
- source_word: לְאֹמֶנֶת
  choice: nourrice
  rationale: אֹמֶנֶת désigne une femme chargée de prendre soin d’un enfant et de l’élever. « Nourrice » est concis et idiomatique, tandis que la note précise que le terme n’implique pas nécessairement l’allaitement.
