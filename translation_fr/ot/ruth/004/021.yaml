  text: וְ/שַׂלְמוֹן֙ הוֹלִ֣יד אֶת בֹּ֔עַז וּ/בֹ֖עַז הוֹלִ֥יד אֶת עוֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/021.yaml
  text: And Salmon fathered Boaz[a], and Boaz fathered Obed.
translation:
  language: fr
  text: Salmon eut pour fils Booz[a], et Booz eut pour fils Obed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « engendra ». Le verbe hébreu est un terme généalogique courant qui signifie « engendrer » ou « devenir le père de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂלְמוֹן
  choice: Salmon
  rationale: Le nom propre est rendu selon sa forme française usuelle; la conjonction initiale n’est pas exprimée, car le français n’exige pas « et » au début de ce verset pour maintenir la continuité de la généalogie.
- source_word: הוֹלִיד
  choice: eut pour fils
  rationale: Dans cette généalogie, le hiphil de ילד signifie « engendrer » ou « devenir le père de ». « Eut pour fils » est naturel en français moderne, concis et conserve explicitement la relation généalogique masculine.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Cette particule marque le complément d’objet direct défini en hébreu et n’a normalement pas d’équivalent explicite en français.
- source_word: בֹּעַז
  choice: Booz
  rationale: Forme française biblique usuelle du nom propre.
- source_word: וּ/בֹעַז
  choice: et Booz
  rationale: La conjonction coordonne explicitement le second maillon de la généalogie; elle est rendue par « et ».
- source_word: הוֹלִיד
  choice: eut pour fils
  rationale: La même expression est répétée afin de préserver le parallélisme de la formule généalogique.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Translittération française usuelle du nom propre.
