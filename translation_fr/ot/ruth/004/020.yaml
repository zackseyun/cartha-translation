lexical_decisions:
- source_word: עַמִּינָדָב
  choice: Amminadab
  rationale: Nom propre translittéré selon l’usage biblique français courant.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans une généalogie, le hiphil de ילד signifie « engendrer » ou « devenir le père de ». « Engendra » est concis, digne et conserve explicitement le lien généalogique masculin.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marque de l’objet direct sans équivalent lexical autonome en français ; sa fonction est rendue par la syntaxe.
- source_word: נַחְשׁוֹן
  choice: Nahshôn
  rationale: Translittération française du nom propre, avec l’accent circonflexe signalant la voyelle longue.
- source_word: וְ
  choice: et
  rationale: Conjonction simple reliant les deux propositions généalogiques.
- source_word: שַׂלְמָה
  choice: Salma
  rationale: Représentation directe en français de la forme hébraïque Salmah ; la consonne finale ה n’appelle pas ici un h prononcé en français.
