  text: וַ/יֹּ֧אמֶר הַ/גֹּאֵ֛ל לְ/בֹ֖עַז קְנֵה לָ֑/ךְ וַ/יִּשְׁלֹ֖ף נַעֲלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: fr
  text: 'Alors le rédempteur[a] dit à Booz : « Achète-le pour toi. » Et le rédempteur retira sa sandale[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le proche parent ayant droit de rachat ». Le terme hébreu désigne un proche parent qui avait la responsabilité juridique de racheter les biens familiaux ou de préserver la lignée.
    reason: lexical_alternative
  - marker: b
    text: Le retrait de la sandale servait de signe juridique coutumier dans cette transaction ; voir Ruth 4.7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait avancer le récit; « Alors » exprime naturellement la succession en français.
- source_word: הַגֹּאֵל
  choice: le rédempteur
  rationale: Le terme désigne ici le proche parent chargé d'exercer un droit et une responsabilité de rachat. « Rédempteur » reste concis, tandis qu'une note explicite sa portée familiale et juridique.
- source_word: לְבֹעַז
  choice: à Booz
  rationale: Rendu direct de la préposition et du nom propre selon sa forme française usuelle.
- source_word: קְנֵה
  choice: Achète
  rationale: L'impératif de קנה signifie acquérir ou acheter; « Achète » convient clairement à cette transaction.
- source_word: לָךְ
  choice: pour toi
  rationale: Cette tournure conserve la valeur du complément pronominal et indique que Booz doit réaliser l'acquisition pour son propre compte.
- source_word: וַיִּשְׁלֹף
  choice: Puis il retira
  rationale: Le verbe exprime l'action d'ôter ou de retirer; avec une sandale, « retira » est naturel et précis. « Puis » marque la progression narrative.
- source_word: נַעֲלוֹ
  choice: sa sandale
  rationale: Le nom désigne une chaussure, vraisemblablement une sandale dans ce contexte ancien; « sa » conserve le suffixe possessif.
theological_decisions:
- issue: Portée de הַגֹּאֵל
  choice: le rédempteur
  alternative: le proche parent ayant droit de rachat
  rationale: Le texte emploie un titre juridique familial chargé de sens. La traduction courte préserve ce titre, et la note évite de le réduire à une notion seulement spirituelle.
translation_notes:
  register: Français international moderne, simple et digne. La formulation suit étroitement la progression du récit hébreu, tout en explicitant en note le sens juridique et familial de גֹּאֵל. Les appels de note sont placés immédiatement après les éléments concernés.
