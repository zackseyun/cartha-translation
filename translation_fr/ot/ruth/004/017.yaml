  text: וַ/תִּקְרֶאנָה֩ ל֨/וֹ הַ/שְּׁכֵנ֥וֹת שֵׁם֙ לֵ/אמֹ֔ר יֻלַּד בֵּ֖ן לְ/נָעֳמִ֑י וַ/תִּקְרֶ֤אנָֽה שְׁמ/וֹ֙ עוֹבֵ֔ד ה֥וּא אֲבִי יִשַׁ֖י אֲבִ֥י דָוִֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: fr
  text: 'Les voisines lui donnèrent un nom en disant : « Un fils est né à Noémi[a]. » Elles l’appelèrent Obed. Il fut le père de Jessé, père de David.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « un fils est né à Noémi » évoque le rétablissement de sa lignée familiale par l’enfant de Ruth ; elle ne présente pas Noémi comme sa mère biologique.
    reason: Préserver et expliquer l’ambiguïté familiale intentionnelle de l’hébreu.
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: les voisines
  rationale: Le nom féminin pluriel désigne précisément les femmes du voisinage. « Les voisines » est naturel en français et conserve à la fois la proximité géographique et le genre.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: lui donnèrent un nom
  rationale: Cette expression signifie littéralement qu’elles appelèrent un nom pour lui. « Lui donnèrent un nom » restitue naturellement l’acte de nommer ainsi que le complément indirect לוֹ.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rendu courant de l’infinitif introduisant les paroles qui suivent.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: Un fils est né à Noémi
  rationale: Le passif accompagné de לְ présente Noémi comme bénéficiaire ou destinataire de cette naissance. La formulation française conserve délibérément la perspective des voisines et l’ambiguïté familiale du texte.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: Elles l’appelèrent Obed
  rationale: Cette formulation française naturelle rend la formule hébraïque de nomination tout en gardant le nom propre.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Le nom personnel est translittéré selon sa forme française biblique traditionnelle plutôt que traduit par son sens possible, lié au fait de servir.
- source_word: אֲבִי
  choice: père de
  rationale: Bien que le terme puisse parfois désigner un ancêtre, la généalogie immédiate soutient ici le sens direct de « père de » dans les deux occurrences.
- source_word: יִשַׁי
  choice: Jessé
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: דָוִד
  choice: David
  rationale: Forme française traditionnelle du nom propre hébreu.
theological_decisions:
- issue: Le lien de Noémi avec le nouveau-né dans l’annonce « Un fils est né à Noémi »
  choice: Conserver « à Noémi » dans le texte principal sans présenter Noémi comme la mère biologique.
  alternative: « Un petit-fils est né à Noémi » ou « Noémi a reçu un fils »
  rationale: L’hébreu fait entendre la perspective des voisines sur le rétablissement de la famille de Noémi par l’enfant de Ruth. Remplacer « fils » par « petit-fils » éliminerait la tension littéraire et familiale que le texte maintient.
translation_notes:
  register: Français international moderne, naturel et digne. Les formes traditionnelles Noémi, Obed, Jessé et David sont conservées. La répétition des deux formules de nomination reflète celle de l’hébreu sans lourdeur excessive.
