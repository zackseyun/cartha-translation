base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: fr
  text: 'Alors Booz dit aux anciens et à tout le peuple : « Vous êtes témoins aujourd’hui que j’ai acquis[a], de la main de Noémi[b], tout ce qui appartenait à Élimélek, ainsi que tout ce qui appartenait à Kilion et à Mahlon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « acheté » ; le verbe hébreu peut désigner une acquisition par achat dans le cadre d’une transaction juridique.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « de la main de Noémi » signifie ici « de la possession ou du contrôle de Noémi ».
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors Booz dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » marque naturellement la succession en français moderne.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: aux anciens et à tout le peuple
  rationale: La formulation conserve les deux groupes auxquels Booz s’adresse dans le cadre public de la transaction.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Vous êtes témoins aujourd’hui
  rationale: Cette formulation claire respecte l’accent de la déclaration hébraïque sur le statut présent des personnes réunies.
- source_word: כִּי
  choice: que
  rationale: Ici, כִּי introduit le contenu dont les auditeurs sont témoins, et non une proposition causale.
- source_word: קָנִיתִי
  choice: j’ai acquis
  rationale: Le verbe désigne ici une acquisition dans un cadre juridique. « Acquis » préserve la portée générale du terme sans imposer les modalités précises d’un achat.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: tout ce qui appartenait à Élimélek
  rationale: L’expression hébraïque de possession est rendue de manière naturelle et précise en français.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: ainsi que tout ce qui appartenait à Kilion et à Mahlon
  rationale: Le parallélisme avec les biens d’Élimélek est conservé, tandis que « ainsi que » évite une coordination française pesante.
- source_word: מִיַּד נָעֳמִי
  choice: de la main de Noémi
  rationale: La traduction conserve l’image juridique hébraïque, dont le sens de possession ou d’autorité est précisé en note.
theological_decisions:
- issue: Nature de la transaction de Booz
  choice: Employer « acquis » pour le transfert juridique des biens
  alternative: « acheté »
  rationale: Le verset porte sur ce qui appartenait à Élimélek, Kilion et Mahlon et qui passe de la main de Noémi à Booz. « Acquis » rend le transfert sans préciser au-delà du texte ses modalités ni suggérer l’achat de personnes.
translation_notes:
  register: 'Français international moderne, naturel et digne. La syntaxe garde le caractère public et juridique de la déclaration sans archaïsme. Les noms propres suivent des formes françaises courantes : Booz, Noémi, Élimélek, Kilion et Mahlon.'
