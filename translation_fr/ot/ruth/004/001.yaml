source:
  edition: WLC
  text: וּ/בֹ֨עַז עָלָ֣ה הַ/שַּׁעַר֮ וַ/יֵּ֣שֶׁב שָׁם֒ וְ/הִנֵּ֨ה הַ/גֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר בֹּ֔עַז וַ/יֹּ֛אמֶר ס֥וּרָ/ה שְׁבָ/ה פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַ/יָּ֖סַר וַ/יֵּשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: fr
  text: 'Booz monta à la porte de la ville et s’assit là[a]. Et voici que le parent chargé du rachat dont Booz avait parlé passait par là. Booz lui dit : « Détourne-toi et assieds-toi ici, Untel[b]. » Il se détourna et s’assit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La porte de la ville servait de lieu public pour les affaires juridiques et civiques.
    reason: cultural_note
  - marker: b
    text: 'Hébreu : « Peloni Almoni », expression équivalant à « Untel » et laissant volontairement le nom de l’homme sous silence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: monta à la porte de la ville
  rationale: Le verbe עָלָה exprime la montée vers la porte. L’ajout « de la ville » explicite naturellement en français ce que désigne ici la porte, sans développer encore sa fonction civique.
- source_word: וְהִנֵּה
  choice: Or voici que
  rationale: Cette tournure française attire l’attention sur l’arrivée providentielle et soudaine du personnage, tout en gardant la vivacité narrative de הִנֵּה.
- source_word: הַגֹּאֵל
  choice: le parent ayant droit de rachat
  rationale: גֹּאֵל désigne ici un membre de la parenté qui possède un droit et une responsabilité de rachat. Cette formulation rend les deux composantes sans employer le calque peu naturel « parent-rédempteur ».
- source_word: עֹבֵר
  choice: venait à passer
  rationale: Le participe présente l’action en cours au moment où Booz aperçoit l’homme. « Venait à passer » restitue cette simultanéité et le caractère opportun de son passage.
- source_word: סוּרָה שְׁבָה פֹה
  choice: Viens par ici et assieds-toi
  rationale: Dans ce contexte, סור invite l’homme à quitter son trajet pour rejoindre Booz. « Viens par ici » est naturel en français et convient à l’invitation qui suit.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: monsieur Untel
  rationale: L’expression remplace volontairement le nom de l’homme. « Monsieur Untel » fonctionne en français comme une adresse masculine anonyme, tout en gardant le caractère marqué de l’hébreu.
- source_word: וַיָּסַר וַיֵּשֵׁב
  choice: L’homme vint et s’assit
  rationale: La phrase indique qu’il répond à l’invitation de Booz. La reprise par « vint » correspond naturellement au choix « Viens par ici », tandis que « L’homme » évite une succession ambiguë de pronoms.
theological_decisions:
- issue: Portée du terme גֹּאֵל
  choice: parent ayant droit de rachat
  alternative: rédempteur / proche parent
  rationale: Le terme est à la fois familial et juridique dans le récit. La traduction retenue conserve ces dimensions sans lui imposer d’emblée une portée théologique plus large ni réduire le personnage à un simple proche parent.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit, tandis que « Or voici que » conserve la mise en relief de l’hébreu. « Monsieur Untel » est volontairement inhabituel, comme l’expression source, et sa portée est précisée en note.
