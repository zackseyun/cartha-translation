  source_fidelity: Révision nécessaire pour rendre plus directement l’impératif סוּרָה (« détourne-toi / écarte-toi de ton chemin ») et sa reprise par וַיָּסַר. « Passait par là » restitue plus nettement la valeur progressive du participe עֹבֵר que « venait à passer ».
  naturalness: Le récit demeure fluide en français international moderne. « Parent chargé du rachat » est plus idiomatique que « parent ayant droit de rachat », tout en conservant la fonction familiale et juridique du גֹּאֵל.
  terminology: « Parent chargé du rachat » évite à la fois le calque peu usuel « parent-rédempteur » et le terme trop général « rédempteur ». « Untel » rend naturellement l’anonymat volontaire de פְּלֹנִי אַלְמֹנִי; l’ajout de « monsieur » n’est pas requis par l’hébreu.
