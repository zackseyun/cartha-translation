- from: 'Booz monta à la porte de la ville et s’assit là[a]. Or voici que le parent ayant droit de rachat dont Booz avait parlé venait à passer. Booz lui dit : « Viens par ici et assieds-toi, monsieur Untel[b]. » L’homme vint et s’assit.'
  to: 'Booz monta à la porte de la ville et s’assit là[a]. Et voici que le parent chargé du rachat dont Booz avait parlé passait par là. Booz lui dit : « Détourne-toi et assieds-toi ici, Untel[b]. » Il se détourna et s’assit.'
  rationale: 'La révision conserve la séquence narrative et la mise en relief de וְהִנֵּה par « Et voici que ». Elle rend le participe עֹבֵר par « passait par là » et préserve surtout l’écho entre l’ordre de se détourner et son exécution. Les notes sont maintenues avec des ancres cohérentes : [a] après « porte de la ville » et [b] après le nom de remplacement.'
