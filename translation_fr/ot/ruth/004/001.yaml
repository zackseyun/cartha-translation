    issue: « Viens par ici » et « L’homme vint » n’expriment pas le mouvement de se détourner du chemin.
    rationale: 'סוּרָה et וַיָּסַר forment une répétition lexicale : Booz demande à l’homme de se détourner, et celui-ci se détourne. La traduction devrait conserver ce lien.'
  - severity: low
    issue: « Parent ayant droit de rachat » est pesant en français moderne.
    rationale: La formulation indique une notion juridique pertinente, mais « parent chargé du rachat » est plus naturel et demeure fidèle à la responsabilité du גֹּאֵל dans ce contexte.
