base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: fr
  text: 'Puis il dit au proche parent ayant le droit de rachat[a] : « Noémi, revenue de la campagne de Moab[b], met en vente la parcelle de terre qui appartenait à notre frère Élimélek[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne un proche parent habilité à racheter un bien familial et, selon les circonstances, à assumer certaines responsabilités familiales.
    reason: cultural_note
  - marker: b
    text: Littéralement « des champs de Moab »; cette expression désigne la campagne ou le territoire de Moab.
    reason: cultural_note
  - marker: c
    text: Ou « a vendu ». La forme hébraïque peut présenter l’action comme accomplie, mais le contexte décrit une transaction encore en discussion.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis il dit
  rationale: Le waw consécutif fait progresser le récit; « Puis » restitue naturellement cette succession.
- source_word: לַגֹּאֵל
  choice: au rédempteur familial
  rationale: גֹּאֵל désigne ici le parent investi d'un droit et d'un devoir de rachat. Cette formulation conserve la notion de rachat tout en explicitant son cadre familial.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: la parcelle de terre
  rationale: חֶלְקָה désigne une portion ou parcelle; l'expression française est naturelle et adaptée à une transaction foncière.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: qui appartenait à notre frère Élimélek
  rationale: La construction avec ל exprime ici la possession ou l'association. « Notre frère » garde le langage de parenté du texte sans imposer le sens de frère germain.
- source_word: מָכְרָה
  choice: met en vente
  rationale: Le parfait hébreu peut se lire comme « a vendu », mais la scène présente l'affaire comme une transaction à conclure. « Met en vente » rend ce sens actuel sans laisser entendre que la vente est déjà finalisée.
- source_word: נָעֳמִי
  choice: Noémi
  rationale: Forme française courante du nom propre.
- source_word: הַשָּׁבָה
  choice: revenue
  rationale: Le participe qualifie Noémi comme celle qui est revenue; le participe passé français exprime avec concision cet état résultant.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: de la campagne de Moab
  rationale: Littéralement « du champ/des champs de Moab », l'expression désigne le territoire ou la campagne de Moab. « Campagne » conserve une part de l'image concrète tout en étant idiomatique.
theological_decisions:
- issue: Portée juridique de גֹּאֵל
  choice: rédempteur familial
  alternative: proche parent; ayant droit au rachat
  rationale: Le choix préserve le motif du rachat et précise qu'il s'agit d'une fonction exercée dans le cadre familial, sans développer davantage les obligations juridiques dans le corps du verset.
- issue: Valeur temporelle de מָכְרָה
  choice: met en vente
  alternative: a vendu
  rationale: La forme verbale permet une lecture accomplie, mais le déroulement de la négociation favorise une vente proposée ou en cours. L'ambiguïté est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation suit de près la syntaxe et les notions juridiques de l'hébreu tout en évitant un calque opaque. Les trois appels de note figurent dans le texte dans l'ordre [a], [b], [c].
