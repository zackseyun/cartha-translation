review_pass:
  verdict: revise
  source_fidelity: Le sens juridique de קָנִיתִי (« j’ai acquis »), la finalité matrimoniale, la perpétuation du nom du défunt et le double cadre familial et public sont bien rendus. Toutefois, « sur son patrimoine » est moins direct que l’hébreu נַחֲלָתוֹ (« son héritage »), et « ne disparaisse » atténue la formule juridique « ne soit pas retranché/coupé » (וְלֹא יִכָּרֵת).
  naturalness: Le français est globalement clair et solennel. « Pour qu’elle devienne ma femme » est naturel, mais « comme épouse » rend plus directement la construction hébraïque tout en restant lisible dans ce contexte juridique.
  terminology: « Moabite », « femme de Mahlôn », « frères » et « porte de sa localité » sont appropriés. « Héritage » est préférable à « patrimoine » ici, car il correspond directement à la possession héréditaire visée par נחלה. « Être retranché » conserve mieux la portée juridique et sociale de כרת sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: « ne disparaisse » affaiblit la formulation de וְלֹא יִכָּרֵת.
    rationale: Le niphal de כרת exprime littéralement le fait d’être retranché ou supprimé. « Ne soit pas retranché » maintient la force de l’expression juridique et son registre.
  - severity: low
    issue: « patrimoine » est moins précis que « héritage » pour נַחֲלָתוֹ.
    rationale: Dans ce contexte de transmission foncière et familiale, « héritage » correspond plus immédiatement au terme hébreu et évite l’extension moderne possible de « patrimoine ».
