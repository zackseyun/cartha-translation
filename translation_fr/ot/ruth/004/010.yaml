- from: J’ai aussi acquis Ruth la Moabite, femme de Mahlôn, pour qu’elle devienne ma femme[a], afin de relever le nom du défunt sur son patrimoine[b], pour que le nom du défunt ne disparaisse ni du milieu de ses frères ni de la porte de sa localité[c]. Vous en êtes témoins aujourd’hui.
  to: J’ai aussi acquis Ruth la Moabite, femme de Mahlôn, comme épouse[a], afin de relever le nom du défunt sur son héritage[b], pour que le nom du défunt ne soit retranché ni du milieu de ses frères ni de la porte de sa localité[c]. Vous en êtes témoins aujourd’hui.
