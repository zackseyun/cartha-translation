source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: fr
  text: J’ai aussi acquis Ruth la Moabite, femme de Mahlôn, comme épouse[a], afin de relever le nom du défunt sur son héritage[b], pour que le nom du défunt ne soit retranché ni du milieu de ses frères ni de la porte de sa localité[c]. Vous en êtes témoins aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « j’ai acheté ». Il désigne ici une acquisition reconnue juridiquement dans le cadre du rachat familial.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de maintenir le nom, la lignée et les droits du défunt en rapport avec la propriété héritée de sa famille.
    reason: cultural_note
  - marker: c
    text: La porte de la localité était le lieu public où l’on traitait et faisait attester les affaires juridiques.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: J’ai aussi
  rationale: Rend la valeur additive de la formule tout en l’intégrant naturellement à la déclaration juridique en français.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: Ruth la Moabite
  rationale: Le gentilé féminin « Moabite » est naturel en français moderne et correspond au texte hébreu.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: femme de Mahlôn
  rationale: Conserve la formulation du texte source, qui dit « femme » et non explicitement « veuve ».
- source_word: קָנִיתִי לִי לְאִשָּׁה
  choice: j’ai acquis … pour qu’elle devienne ma femme
  rationale: « Acquis » maintient la portée transactionnelle de קנה dans ce cadre juridique, tandis que la proposition finale exprime clairement la visée matrimoniale sans réduire Ruth à un bien acheté.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: afin de relever le nom du défunt
  rationale: « Relever » préserve la métaphore de הקים et « le défunt » rend naturellement l’expression hébraïque sans ajouter « homme ».
- source_word: עַל נַחֲלָתוֹ
  choice: sur son patrimoine
  rationale: « Patrimoine » exprime ici la propriété héréditaire attachée au nom et à la continuité familiale; « sur » conserve le rapport formulé par עַל.
- source_word: וְלֹא יִכָּרֵת שֵׁם הַמֵּת
  choice: pour que le nom du défunt ne disparaisse
  rationale: En français courant, « ne disparaisse » communique clairement l’extinction sociale et familiale visée par l’expression idiomatique hébraïque « ne soit pas retranché ».
- source_word: מֵעִם אֶחָיו
  choice: du milieu de ses frères
  rationale: Conserve le terme masculin concret du texte source, dont la portée peut être clanique dans ce contexte.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: ni de la porte de sa localité
  rationale: Préserve l’image de la porte comme lieu de reconnaissance publique et juridique, ainsi que le terme relativement général מְקוֹמוֹ.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Vous en êtes témoins aujourd’hui
  rationale: Formulation française naturelle d’une déclaration officielle; « en » renvoie à l’acte qui vient d’être proclamé.
theological_decisions:
- issue: Nature de l’acte de Booz envers Ruth dans le cadre du rachat familial
  choice: « j’ai acquis … pour qu’elle devienne ma femme »
  alternative: « j’ai acheté Ruth pour en faire ma femme » ou « j’ai pris Ruth pour femme »
  rationale: Le choix conserve la force juridique et transactionnelle de קנה, sans accentuer indûment l’idée de marchandisation ni effacer la dimension de rachat liée au mariage et au patrimoine.
- issue: Sens de la perpétuation du nom du défunt
  choice: Conserver la métaphore « relever le nom » et son lien avec le patrimoine
  alternative: Paraphraser par « assurer une descendance au défunt »
  rationale: Le texte parle directement du nom et du patrimoine. La traduction ne limite donc pas cette continuité à la seule descendance biologique et préserve la tension juridique et familiale du passage.
- issue: Portée de אֶחָיו
  choice: « ses frères »
  alternative: « ses proches » ou « les membres de son clan »
  rationale: Le texte hébreu dit littéralement « ses frères ». La traduction conserve ce terme, même si le contexte permet une portée familiale ou clanique plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le caractère solennel d’une déclaration juridique publique sans reproduire les lourdeurs de l’hébreu. « Mahlôn » suit une translittération française lisible; « patrimoine » souligne l’héritage foncier et familial.
