  text: וַ/יֹּ֨אמְר֜וּ כָּל הָ/עָ֧ם אֲשֶׁר בַּ/שַּׁ֛עַר וְ/הַ/זְּקֵנִ֖ים עֵדִ֑ים יִתֵּן֩ יְהוָ֨ה אֶֽת הָ/אִשָּׁ֜ה הַ/בָּאָ֣ה אֶל בֵּיתֶ֗/ךָ כְּ/רָחֵ֤ל וּ/כְ/לֵאָה֙ אֲשֶׁ֨ר בָּנ֤וּ שְׁתֵּי/הֶם֙ אֶת בֵּ֣ית יִשְׂרָאֵ֔ל וַ/עֲשֵׂה חַ֣יִל בְּ/אֶפְרָ֔תָה וּ/קְרָא שֵׁ֖ם בְּ/בֵ֥ית לָֽחֶם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: fr
  text: 'Alors tout le peuple qui se trouvait à la porte de la ville, ainsi que les anciens, dirent : « Nous en sommes témoins. Que Yahweh rende la femme qui entre dans ta maison semblable à Rachel et à Léa, qui toutes deux ont bâti la maison d’Israël ! Montre ta valeur[a] à Éphrata et fais-toi un nom à Bethléem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prospère », « agis avec vaillance » ou « acquiers de la richesse » ; le terme hébreu peut désigner la valeur, la force, la vaillance, la richesse ou la réussite.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: Nous en sommes témoins
  rationale: Le nom hébreu signifie littéralement « témoins » avec une copule sous-entendue. La formule française explicite naturellement cette affirmation et renvoie à l’acte public qui vient d’être conclu.
- source_word: יִתֵּן יְהוָה
  choice: Que Yahweh rende
  rationale: Dans cette formule de bénédiction suivie d’un objet et d’une comparaison, נתן a le sens idiomatique de « rendre » ou « faire devenir », tandis que « que » conserve la valeur optative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: la femme qui entre dans ta maison
  rationale: Cette formulation conserve l’image concrète de l’entrée de la femme dans la maison de Booz par le mariage, tout en rendant naturellement le participe hébreu en français.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: elles deux qui ont bâti la maison d’Israël
  rationale: La métaphore de la construction est préservée et évoque l’établissement de la lignée et du peuple d’Israël. « Elles deux » rend explicitement שְׁתֵּיהֶם.
- source_word: וַעֲשֵׂה חַיִל
  choice: Montre ta valeur
  rationale: חיל peut exprimer la force, la vaillance, la valeur, la richesse ou la réussite. « Montre ta valeur » préserve mieux cette amplitude que le seul sens économique de « prospère ».
- source_word: בְּאֶפְרָתָה
  choice: à Éphrata
  rationale: Le nom de lieu est conservé; la préposition « à » est idiomatique en français pour une localité.
- source_word: וּקְרָא שֵׁם
  choice: fais-toi un nom
  rationale: Cette locution française exprime naturellement l’idée hébraïque d’acquérir un nom, c’est-à-dire une réputation ou une renommée, sans abandonner l’image du « nom ».
- source_word: בְּבֵית לָחֶם
  choice: à Bethléem
  rationale: Translittération française usuelle du nom de lieu, avec la préposition locative naturelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve sa fonction de nom personnel plutôt que de lui substituer un titre.
- issue: Portée de la bénédiction וַעֲשֵׂה חַיִל
  choice: Montre ta valeur
  alternative: Prospère / Acquiers de la richesse / Agis avec vaillance
  rationale: Le contexte peut viser à la fois la réussite, la qualité personnelle, la vigueur et l’honneur. La traduction choisie maintient cette tension au lieu de réduire la bénédiction à la prospérité matérielle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe solennelle de la bénédiction est conservée sans archaïsmes. « Porte de la ville » explicite la fonction urbaine de la porte dans ce contexte public et juridique.
