  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: fr
  text: 'Alors Booz dit[a] : « Le jour où tu acquerras le champ de la main de Noémi, tu acquerras aussi Ruth la Moabite, la femme du défunt[b], afin de perpétuer le nom du défunt sur son héritage[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte littéralement « j’ai acquis » (ou « j’acquiers ») Ruth la Moabite; beaucoup comprennent ici, d’après le contexte, « tu acquerras aussi ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « l’épouse de l’homme mort ».'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire pour maintenir la lignée du défunt ainsi que ses droits familiaux attachés à son patrimoine héréditaire.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: Le jour où tu acquerras
  rationale: Conserve l’expression temporelle et la portée juridique de l’hébreu, tout en employant une tournure française naturelle.
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: Désigne précisément la parcelle faisant l’objet du rachat dans le contexte.
- source_word: מִיַּד נָעֳמִי
  choice: de la main de Noémi
  rationale: Maintient l’image juridique hébraïque d’un transfert depuis la possession ou l’autorité de Noémi; l’expression reste intelligible en français soutenu.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה ... קניתי
  choice: tu acquerras aussi Ruth la Moabite
  rationale: La syntaxe du texte massorétique est difficile et קניתי est vocalisé à la première personne. Le contexte narratif indique toutefois que Booz expose au parent prioritaire l’obligation liée à l’acquisition du champ. La leçon massorétique littérale est signalée en note.
- source_word: אֵשֶׁת הַמֵּת
  choice: la femme du défunt
  rationale: Rend directement le rapport exprimé par l’hébreu sans substituer le terme interprétatif « veuve ».
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: afin de perpétuer le nom du défunt
  rationale: Exprime naturellement en français l’idée de maintenir la lignée, la mémoire et les droits familiaux du défunt. « Relever le nom » serait plus littéral mais moins immédiatement clair.
- source_word: עַל נַחֲלָתוֹ
  choice: sur son héritage
  rationale: Préserve le lien étroit établi par l’hébreu entre le nom du défunt et son patrimoine héréditaire.
theological_decisions:
- issue: Difficulté textuelle et syntaxique concernant Ruth et קניתי
  choice: 'Le texte principal s’adresse au parent prioritaire : « tu acquerras aussi Ruth »'
  alternative: 'Lecture littérale du texte massorétique vocalisé : « j’ai acquis » ou « j’acquiers Ruth la Moabite »'
  rationale: La logique du dialogue veut que Booz précise les conséquences du rachat pour son interlocuteur. La traduction principale rend ce sens contextuel sans dissimuler la forme massorétique, conservée en note.
- issue: Portée de l’expression « perpétuer le nom du défunt »
  choice: Conserver l’expression familiale et patrimoniale sans l’assimiler techniquement à une institution unique
  alternative: Présenter explicitement l’acte comme un mariage léviratique au sens strict
  rationale: Le passage présente une obligation apparentée au lévirat, mais ses rapports exacts avec les diverses institutions juridiques bibliques demeurent complexes. La formulation évite d’imposer une harmonisation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la tonalité juridique du passage. « Acquérir » est retenu plutôt qu’« acheter », car le contexte associe transfert patrimonial et responsabilité familiale. Les marqueurs de notes apparaissent tous dans le texte principal.
