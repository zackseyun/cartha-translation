  text: וַ/יִּקַּ֞ח עֲשָׂרָ֧ה אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י הָ/עִ֖יר וַ/יֹּ֣אמֶר שְׁבוּ פֹ֑ה וַ/יֵּשֵֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/002.yaml
  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: fr
  text: 'Puis il prit dix hommes parmi les anciens de la ville et leur dit[a] : « Asseyez-vous ici. » Et ils s’assirent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il choisit dix hommes parmi les anciens de la ville ». Le verbe hébreu peut désigner le fait de prendre quelqu’un dans un but précis; ici, il s’agit probablement de choisir des témoins pour la procédure juridique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: il prit
  rationale: Le verbe לקח signifie directement « prendre ». Dans ce contexte judiciaire, il peut aussi désigner le fait de choisir des hommes pour servir de témoins; la traduction principale conserve la formulation hébraïque et la note signale cette nuance.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: dix hommes
  rationale: L’expression désigne explicitement dix hommes adultes participant à la procédure publique.
- source_word: מִזִּקְנֵי הָעִיר
  choice: parmi les anciens de la ville
  rationale: 'La préposition מן a ici un sens partitif : les dix hommes sont pris au sein du groupe reconnu des responsables de la ville.'
- source_word: וַיֹּאמֶר
  choice: leur dit
  rationale: « Dire » rend directement le verbe narratif; le pronom « leur » explicite naturellement en français les destinataires déjà mentionnés.
- source_word: שְׁבוּ פֹה
  choice: Asseyez-vous ici
  rationale: L’impératif pluriel de ישב invite les hommes à prendre place, et פֹה signifie simplement « ici ».
- source_word: וַיֵּשֵׁבוּ
  choice: ils s’assirent
  rationale: Cette formulation reprend naturellement en français le même verbe que dans l’ordre précédent et exprime l’action accomplie.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Anciens » conserve le titre civique traditionnel; « parmi » exprime clairement la valeur partitive de la préposition hébraïque. Le connecteur final « donc » rend la succession et la réponse immédiate sans alourdir la phrase.
