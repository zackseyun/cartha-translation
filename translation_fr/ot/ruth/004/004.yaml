  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: fr
  text: 'Je me suis donc dit que je devais t’en informer[a] : « Achète-le en présence de ceux qui sont assis ici et des anciens de mon peuple. Si tu veux exercer le droit de rachat, exerce-le ; mais s’il ne veut pas l’exercer[b], dis-le-moi, afin que je le sache, car il n’y a personne d’autre que toi pour exercer ce droit, et moi, je viens après toi. » Il répondit : « J’exercerai le droit de rachat. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « découvrir ton oreille », expression qui signifie « t’informer » ou « te le faire savoir ».
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte « s’il ne rachète pas », à la troisième personne. Certains comprennent, d’après le contexte, « si tu ne rachètes pas », ce qui harmonise avec l’adresse à la deuxième personne.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: t’en informer
  rationale: L’expression signifie littéralement « découvrir ton oreille », mais constitue un idiome signifiant faire savoir ou informer. La formulation française en donne naturellement le sens.
- source_word: קְנֵה
  choice: Achète-le
  rationale: Dans cette scène juridique concernant un bien foncier, קנה désigne l’acquisition par achat. « Achète-le » est direct, naturel et cohérent avec le complément implicite fourni par le contexte.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: en présence de ceux qui sont assis ici
  rationale: נגד marque ici la présence publique de témoins, tandis que le participe היושבים est rendu explicitement sans perdre la scène à la porte de la ville.
- source_word: זִקְנֵי עַמִּי
  choice: les anciens de mon peuple
  rationale: Cette traduction conserve le sens ordinaire de עַם et le rôle reconnu des responsables communautaires, sans réduire arbitrairement le groupe au clan.
- source_word: תִּגְאַל ... גְּאָל
  choice: Si tu veux exercer le droit de rachat, exerce-le
  rationale: La répétition emphatique est conservée. En français, « exercer le droit de rachat » exprime clairement la portée familiale et juridique de גאל dans ce contexte.
- source_word: וְאִם לֹא יִגְאַל
  choice: mais s’il ne veut pas l’exercer
  rationale: Le texte massorétique porte une forme à la troisième personne du masculin singulier. Ce changement abrupt de personne est maintenu dans le texte principal plutôt que silencieusement harmonisé.
- source_word: הַגִּידָה לִּי
  choice: dis-le-moi
  rationale: L’impératif direct est rendu dans un français courant et précis ; le pronom reprend la décision concernant le rachat.
- source_word: אֵין זוּלָתְךָ לִגְאוֹל
  choice: il n’y a personne d’autre que toi pour exercer ce droit
  rationale: La formulation préserve l’exclusivité exprimée par זוּלָתְךָ et explicite naturellement en français le droit de rachat déjà nommé.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: et moi, je viens après toi
  rationale: La phrase indique l’ordre de priorité juridique. La traduction reste proche de l’image hébraïque tout en étant intelligible en français.
- source_word: אָנֹכִי אֶגְאָל
  choice: J’exercerai le droit de rachat
  rationale: La réponse accepte l’exercice du droit ou devoir familial évoqué. La formulation française maintient la cohérence terminologique.
theological_decisions:
- issue: Rendu de גאל dans un contexte familial et juridique
  choice: exercer le droit de rachat
  alternative: racheter ; agir en rédempteur familial
  rationale: « Exercer le droit de rachat » fait ressortir la procédure juridique portant sur le bien sans imposer un titre technique lourd ni réduire le verbe à un simple achat commercial.
- issue: Changement de la deuxième à la troisième personne dans וְאִם לֹא יִגְאַל
  choice: conserver « s’il ne veut pas » dans le texte principal
  alternative: harmoniser en « si tu ne veux pas »
  rationale: La forme consonantique et la vocalisation massorétique sont à la troisième personne. La conserver respecte l’ambiguïté et l’irrégularité réelles du texte ; la lecture contextuellement harmonisée est signalée en note.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le vocabulaire juridique reste compréhensible grâce à l’expression « droit de rachat ». Le texte conserve le passage abrupt de la deuxième à la troisième personne dans le texte massorétique. Remarque de mise en forme : la note [b] doit être rattachée dans le texte principal à « s’il ne veut pas l’exercer ».'
