id: RUT.4.15
reference: Ruth 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: fr
  text: Il te redonnera vie[a] et prendra soin de toi dans ta vieillesse[b], car ta belle-fille, qui t’aime, l’a mis au monde — elle qui vaut mieux pour toi que sept fils[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour ramener/restaurer la vie », ou « l’être » (hébreu néfesh).'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tes cheveux gris », expression hébraïque désignant la vieillesse.'
    reason: lexical_alternative
  - marker: c
    text: Le nombre sept évoque souvent la plénitude ou la totalité. Ruth est ainsi déclarée plus précieuse pour Noémi que la bénédiction idéale représentée par de nombreux fils.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה לָךְ
  choice: Il te…
  rationale: La tournure hébraïque signifie littéralement « il sera pour toi », mais le français naturel exprime ici directement les effets futurs annoncés au sujet de l’enfant.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: redonnera vie
  rationale: מֵשִׁיב évoque le fait de ramener ou de restaurer, et נֶפֶשׁ désigne ici la vie ou la personne, non nécessairement une « âme » immatérielle. « Redonnera vie » conserve l’image tout en restant idiomatique.
- source_word: וּלְכַלְכֵּל
  choice: et prendra soin de toi
  rationale: Le verbe כלכל exprime l’action de soutenir, nourrir ou entretenir. Dans le contexte de la vieillesse de Noémi, « prendra soin de toi » rend clairement cette idée sans la réduire au seul soutien matériel.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: dans ta vieillesse
  rationale: שֵׂיבָה désigne littéralement les cheveux gris, puis par métonymie la vieillesse. La formulation choisie transmet naturellement le sens contextuel.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison qui fonde la déclaration précédente; « car » maintient ce lien explicatif dans un registre littéraire courant.
- source_word: כַלָּתֵךְ
  choice: ta belle-fille
  rationale: C’est le terme français usuel correspondant à la relation de Ruth avec Noémi.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: qui t’aime
  rationale: Le parfait hébreu décrit ici un amour établi et démontré. Le présent français en exprime naturellement la permanence.
- source_word: יְלָדַתּוּ
  choice: l’a mis au monde
  rationale: Le suffixe masculin singulier renvoie à l’enfant. Cette expression française est actuelle et fidèle, sans ajouter un complément absent de la forme hébraïque.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: elle qui vaut mieux pour toi
  rationale: Avec le comparatif introduit par מִן, טוֹבָה exprime ici une valeur ou un bienfait supérieur. « Vaut mieux pour toi » conserve cette nuance relationnelle.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: que sept fils
  rationale: Le texte dit explicitement « fils ». Le nombre sept peut suggérer la plénitude, mais il doit rester présent dans le texte plutôt que d’être interprété à sa place.
theological_decisions:
- issue: Sens de נֶפֶשׁ
  choice: vie
  alternative: âme; être; personne
  rationale: Le contexte concerne le relèvement de Noémi et son avenir familial. « Vie » garde le sens concret du terme sans introduire une conception particulière de l’âme.
- issue: Portée de la comparaison avec sept fils
  choice: sept fils
  alternative: sept enfants
  rationale: Le masculin appartient au sens explicite du texte et reflète le contexte social ancien dans lequel les fils étaient particulièrement associés à la continuité familiale et au soutien des parents âgés. Le neutraliser effacerait un élément significatif.
- issue: Nature de la déclaration concernant l’enfant
  choice: futur affirmatif
  alternative: 'souhait : « Puisse-t-il… »'
  rationale: La forme verbale peut se situer dans le cadre des paroles de bénédiction des femmes, mais elle se lit naturellement ici comme l’annonce du rôle futur de l’enfant. Le futur conserve cette force sans transformer la phrase en simple souhait.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement restructurée pour éviter le calque « il sera pour toi un restaurateur de vie », peu naturel en français, tout en conservant le futur, le parallélisme des bienfaits et la comparaison culturellement marquée avec sept fils.
