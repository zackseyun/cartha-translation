base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: fr
  text: 'Alors celui qui avait le droit de rachat[a] dit : « Je ne peux pas exercer ce droit pour moi-même, de peur de compromettre mon propre héritage. Exerce toi-même mon droit de rachat[b], car je ne peux pas exercer ce droit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit du parent plus proche que Booz, qui avait avant lui la priorité pour racheter le bien familial. On traduit aussi traditionnellement par « proche parent ayant droit de rachat ».
    reason: cultural_note
  - marker: b
    text: Littéralement « mon rachat ». Ici, l’expression désigne le droit de rachat qui lui revenait concernant le bien familial. Dans le contexte, cette démarche est liée au maintien de la lignée du défunt.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: celui qui avait le droit de rachat
  rationale: Le participe désigne ici le proche parent habilité et tenu à racheter le bien familial. Cette formulation rend la fonction juridique en français courant sans ajouter explicitement une parenté que le mot seul ne formule pas.
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: exercer le droit de rachat / exerce / mon droit de rachat
  rationale: La répétition de la racine גאל est rendue autant que possible dans un français naturel. Dans ce contexte foncier et familial, « droit de rachat » évite que « rédemption » soit compris dans un sens exclusivement spirituel.
- source_word: לִי
  choice: pour moi-même
  rationale: Le datif exprime l'intérêt personnel du locuteur et souligne l'incidence de l'opération sur son propre patrimoine.
- source_word: פֶּן
  choice: de peur de
  rationale: Cette expression introduit naturellement en français le risque redouté, sans affirmer que le dommage est certain.
- source_word: אַשְׁחִית
  choice: compromettre
  rationale: Le hiphil de שׁחת évoque ici une atteinte grave à l'héritage ou au patrimoine, non sa destruction matérielle. « Compromettre » convient au contexte juridique et économique.
- source_word: נַחֲלָתִי
  choice: mon propre héritage
  rationale: « Héritage » conserve la notion de patrimoine familial transmis, tandis que « propre » marque le contraste avec le bien à racheter.
- source_word: לְךָ אַתָּה
  choice: toi-même
  rationale: Le pronom indépendant renforce l'adresse à Booz. « Toi-même » rend cette insistance sans lourdeur.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l'explication ou la reprise justificative de son refus.
theological_decisions:
- issue: Portée du droit de rachat
  choice: Une note signale que le contexte narratif associe le rachat du bien au maintien de la lignée familiale.
  alternative: Présenter dans le corps du verset une obligation explicite d'épouser Ruth.
  rationale: Le verset emploie le vocabulaire juridique du rachat, mais ne formule pas à lui seul tous les détails de l'obligation; ceux-ci ressortent du contexte immédiat. La traduction évite donc de les importer directement dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique est explicité sans employer le terme théologique « rédemption », potentiellement ambigu dans ce contexte foncier. La répétition finale est conservée sous une forme idiomatique.
