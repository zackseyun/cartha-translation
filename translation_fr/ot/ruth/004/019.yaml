lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: Hetsron
  rationale: Nom propre transcrit sous la forme française biblique usuelle. La conjonction initiale n’est pas rendue séparément, puisque le verset français se lit naturellement comme la suite de la généalogie.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Dans ce contexte généalogique, le hiphil de ילד signifie « engendrer, devenir père de ». « Engendra » est concis, digne et précis, sans la lourdeur de « devint le père de ».
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marque de l’objet direct sans équivalent lexical autonome en français; sa fonction est exprimée par l’ordre des mots.
- source_word: רָם
  choice: Ram
  rationale: Transcription française courante de ce nom propre hébreu.
- source_word: וְ/רָם
  choice: et Ram
  rationale: La conjonction relie explicitement les deux propositions généalogiques.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le même verbe est conservé dans la seconde proposition afin de reproduire le parallélisme et la répétition de l’hébreu.
- source_word: עַמִּינָדָב
  choice: Amminadab
  rationale: Forme française biblique courante, qui reflète aussi le redoublement consonantique de l’hébreu.
