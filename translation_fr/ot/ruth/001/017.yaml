id: RUT.1.17
reference: Ruth 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: fr
  text: Là où tu mourras, je mourrai, et c’est là que je serai enterrée. Que Yahweh me fasse ceci, et qu’il y ajoute encore[a], si autre chose que la mort me sépare de toi[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Formule hébraïque de serment par laquelle la personne appelle sur elle un châtiment divin, et même davantage, si elle manque à sa parole.
    reason: explication_idiomatique
  - marker: b
    text: 'Ou, plus près de la formulation hébraïque : « si ce n’est la mort qui me sépare de toi » ; le sens est que seule la mort pourra les séparer.'
    reason: alternative_de_traduction
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Là où
  rationale: La préposition בְּ jointe au relatif אֲשֶׁר exprime le lieu. « Là où » est naturel en français et prépare la reprise par וְשָׁם, « et là ».
- source_word: תָּמוּתִי / אָמוּת
  choice: tu mourras, je mourrai
  rationale: Les deux formes du verbe מות forment un parallélisme solennel. Le futur français rend naturellement l’engagement ferme de Ruth.
- source_word: וְשָׁם אֶקָּבֵר
  choice: et c’est là que je serai enterrée
  rationale: וְשָׁם reprend explicitement le lieu évoqué, et le nifal אֶקָּבֵר appelle une formulation passive. Le féminin correspond à Ruth, qui parle.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: Que Yahweh me fasse ceci, et qu’il y ajoute encore
  rationale: La formulation conserve la structure de l’imprécation hébraïque sans préciser le châtiment laissé implicite dans le texte source. Une note en explique la valeur idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כִּי
  choice: si
  rationale: Dans cette formule de serment, כִּי introduit la condition sous laquelle l’imprécation doit s’accomplir.
- source_word: הַמָּוֶת
  choice: la mort
  rationale: Le nom défini désigne la mort comme l’unique cause admise de séparation.
- source_word: יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: me sépare de toi
  rationale: Le hifil de פרד signifie « séparer ». Cette construction est plus idiomatique en français que le calque « sépare entre moi et toi ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » maintient ici le caractère personnel du nom divin.
- issue: Portée de la condition finale du serment
  choice: si autre chose que la mort me sépare de toi
  alternative: si ce n’est la mort qui me sépare de toi
  rationale: Dans son contexte, le serment signifie que Ruth accepte la mort seule comme cause de séparation. Le français explicite cette portée tout en signalant en note la formulation plus proche de la syntaxe hébraïque.
- issue: Formule d’auto-imprécation
  choice: Que Yahweh me fasse ceci, et qu’il y ajoute encore
  alternative: Que Yahweh me punisse avec la plus grande sévérité
  rationale: Le texte principal préserve l’indétermination solennelle du châtiment invoqué, plutôt que de remplacer l’image par une explication entièrement dynamique.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme du vœu et la formule traditionnelle du serment sont conservés. Le féminin « enterrée » identifie naturellement Ruth comme locutrice.
