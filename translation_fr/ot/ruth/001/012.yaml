source:
  edition: WLC
  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: fr
  text: 'Retournez[a], mes filles, partez, car je suis trop vieille pour avoir un mari. Même si je disais[b] : « Il y a de l’espoir pour moi », même si j’avais un mari cette nuit même et mettais aussi au monde des fils —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Revenez sur vos pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu présente une suite d’hypothèses : « Car si je disais : “J’ai de l’espoir”, même si j’avais un mari cette nuit et mettais aussi au monde des fils… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: Retournez
  rationale: Impératif féminin pluriel de שוב. Dans le contexte, Noémi demande à Ruth et Orpa de rebrousser chemin; « Retournez » conserve le mouvement de retour et le motif répété du passage.
- source_word: בְנֹתַי
  choice: mes filles
  rationale: Terme familial affectueux employé par Noémi pour ses belles-filles; la traduction littérale convient au registre digne et naturel.
- source_word: לֵכְןָ
  choice: partez
  rationale: Second impératif féminin pluriel. « Partez » exprime naturellement qu’elles doivent poursuivre leur route sans Noémi, sans répéter maladroitement « allez ».
- source_word: זָקַנְתִּי
  choice: je suis trop vieille
  rationale: 'Le parfait décrit l’état présent résultant du vieillissement. « Trop vieille » explicite la conséquence pragmatique immédiate: Noémi ne peut raisonnablement envisager un nouveau mariage.'
- source_word: מִהְיוֹת לְאִישׁ
  choice: pour avoir un mari
  rationale: Littéralement « pour être à un homme/mari ». En français actuel, « avoir un mari » rend naturellement la relation matrimoniale sans introduire l’idée artificielle d’appartenance.
- source_word: כִּי אָמַרְתִּי
  choice: Même si je me disais
  rationale: כִּי ouvre ici une chaîne hypothétique. « Même si » rend la concession, tandis que le conditionnel imparfait maintient le caractère irréel ou hautement improbable.
- source_word: יֶשׁ לִי תִקְוָה
  choice: Il y a encore de l’espoir pour moi
  rationale: La tournure existentielle יֶשׁ לִי est conservée par « il y a… pour moi »; « encore » fait ressortir l’espoir résiduel envisagé dans l’hypothèse.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: même si j’avais un mari dès cette nuit
  rationale: La formulation garde le parallélisme hypothétique et l’accent temporel de הַלַּיְלָה. « Dès cette nuit » indique l’immédiateté sans préciser indûment les modalités juridiques du mariage.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: et si je mettais au monde des fils
  rationale: ילד désigne l’enfantement, et בָנִים signifie explicitement « fils ». La formulation française est claire et maintient la chaîne conditionnelle.
theological_decisions:
- issue: Maintien du terme masculin désignant la descendance dans le contexte du mariage léviratique
  choice: fils
  alternative: enfants
  rationale: Le texte hébreu porte explicitement בָנִים, et l’argument de Noémi dépend de fils susceptibles de devenir des maris dans le scénario imaginé. Neutraliser en « enfants » affaiblirait cette précision.
- issue: Nature hypothétique de la chaîne argumentative
  choice: Même si… même si… et si…
  alternative: Car si… même si… et même…
  rationale: Cette construction française rend l’accumulation de conditions impossibles ou hautement improbables sans trancher excessivement la fonction exacte de chaque כִּי et גַּם.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset reste syntaxiquement ouvert, conformément au tiret implicite de l’argument qui se poursuit au verset suivant. Les répétitions hypothétiques préservent la tension rhétorique de l’hébreu.
