  text: וַ/תֵּצֵ֗א מִן הַ/מָּקוֹם֙ אֲשֶׁ֣ר הָיְתָה שָׁ֔מָּ/ה וּ/שְׁתֵּ֥י כַלֹּתֶ֖י/הָ עִמָּ֑/הּ וַ/תֵּלַ֣כְנָה בַ/דֶּ֔רֶךְ לָ/שׁ֖וּב אֶל אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: fr
  text: Elle quitta donc le lieu où elle se trouvait[a], avec ses deux belles-filles. Elles prirent la route pour retourner au pays de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « où elle était là ». Ou, pour le début du verset : « Elle sortit donc du lieu où elle se trouvait. »'
    reason: La note signale la formulation hébraïque plus littérale, y compris le verbe concret « sortir », tout en conservant dans le texte un français naturel.
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Elle quitta donc
  rationale: Le verbe יָצָא signifie concrètement « sortir », mais, avec un complément de lieu introduit par מִן, « quitter » est ici le tour français le plus naturel. « Donc » marque l’enchaînement narratif du waw consécutif.
- source_word: מִן הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: le lieu où elle avait vécu
  rationale: Cette formulation rend la provenance et la relative locative sans reproduire le « là » redondant en français. « Avait vécu » exprime naturellement le séjour antérieur de Noémi, sans préciser indûment sa durée.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: accompagnée de ses deux belles-filles
  rationale: כַּלָּה désigne ici une belle-fille. La tournure participiale rend idiomatiquement עִמָּהּ et maintient que les deux femmes partent avec Noémi.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: Elles prirent la route
  rationale: Expression française naturelle pour le déplacement des trois femmes; le féminin pluriel correspond au verbe hébreu et « la route » conserve le cadre concret de דֶּרֶךְ.
- source_word: לָשׁוּב
  choice: pour retourner
  rationale: « Retourner » préserve le motif important de שׁוּב dans le chapitre. L’infinitif précédé de ל exprime ici le but du trajet.
- source_word: אֶל אֶרֶץ יְהוּדָה
  choice: au pays de Juda
  rationale: « Pays de Juda » rend explicitement אֶרֶץ tout en étant plus naturel en français courant que « terre de Juda » dans ce contexte géographique.
theological_decisions: []
