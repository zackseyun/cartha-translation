  text: But they said to her[a], “No, we will return with you to your people.”
translation:
  language: fr
  text: 'Mais elles lui répondirent : « Non, nous retournerons avec toi auprès de ton peuple. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Car nous retournerons avec toi auprès de ton peuple. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Mais elles lui répondirent
  rationale: Le waw narratif fait progresser le récit, tandis que « mais » exprime naturellement le contraste avec l'exhortation précédente de Noémi. Dans ce dialogue, « répondirent » est plus idiomatique que le littéral « dirent » sans modifier le sens.
- source_word: כִּי
  choice: Non
  rationale: Dans cette réponse directe, כִּי marque vraisemblablement une contradiction insistante. « Non » restitue clairement ce refus en français naturel, tout en signalant en note la lecture connective plus littérale.
- source_word: אִתָּךְ
  choice: avec toi
  rationale: La préposition אֵת munie du suffixe féminin singulier exprime l'accompagnement de Noémi.
- source_word: נָשׁוּב
  choice: nous retournerons
  rationale: Le verbe שׁוּב signifie « revenir, retourner » et constitue un motif lexical répété dans Ruth 1. Le futur français convient à la résolution exprimée ici.
- source_word: לְעַמֵּךְ
  choice: auprès de ton peuple
  rationale: עַם désigne ici le peuple ou la communauté d'appartenance de Noémi, et non seulement sa parenté. « Auprès de » rend naturellement en français le mouvement vers ce peuple.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier féminin des formes hébraïques adressées à Noémi. La note conserve la valeur connective possible de כִּי sans alourdir le dialogue principal.
