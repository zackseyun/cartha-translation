base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: fr
  text: Les attendriez-vous jusqu’à ce qu’ils grandissent ? Pour eux, vous abstiendriez-vous de vous marier[a] ? Non, mes filles ! Mon sort est bien plus amer que le vôtre, car la main de Yahweh s’est abattue sur moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « resteriez-vous sans vous marier pour eux ? » Le verbe hébreu est rare et désigne vraisemblablement le fait de se retenir de se marier dans l’attente de futurs maris.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: les attendriez-vous
  rationale: Le verbe שׂבר exprime ici l’attente ou l’espérance. Dans le contexte des fils hypothétiques de Noémi, « attendre » rend clairement la portée concrète de la question.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: jusqu’à ce qu’ils grandissent
  rationale: Cette formulation naturelle conserve la valeur temporelle et évoque leur arrivée à l’âge de se marier sans ajouter explicitement cette précision.
- source_word: תֵּעָגֵנָה לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: renonceriez-vous à vous marier
  rationale: Le verbe rare עגן, éclairé par l’expression « ne pas être à un homme », désigne vraisemblablement le fait de rester sans mari. La formulation française restitue le sens matrimonial sans reproduire un idiome possessif peu naturel.
- source_word: אַל בְּנֹתַי
  choice: Non, mes filles !
  rationale: Dans cet échange ému, אַל marque un refus pressant plutôt qu’une simple interdiction. L’exclamation convient au ton de Noémi.
- source_word: כִּי מַר לִי מְאֹד מִכֶּם
  choice: Mon sort est bien plus amer que le vôtre
  rationale: Cette formulation rend explicitement la lecture comparative de מִכֶּם et exprime naturellement en français l’état douloureux de Noémi.
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: la main de Yahweh s’est abattue sur moi
  rationale: L’expression française conserve l’image de la main divine et son action hostile ou affligeante, tout en évitant le calque peu naturel « est sortie contre moi ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: L’attribution de l’épreuve de Noémi à l’action divine
  choice: car la main de Yahweh s’est abattue sur moi
  alternative: car la main de Yahweh s’est tournée contre moi
  rationale: Le texte attribue sans détour l’affliction de Noémi à la main de Yahweh. La traduction maintient cette tension théologique sans l’atténuer ni expliquer si l’affirmation exprime une perception subjective ou une causalité objective.
- issue: Le sens de מִכֶּם dans la plainte de Noémi
  choice: Mon sort est bien plus amer que le vôtre
  alternative: J’éprouve une grande amertume à cause de vous
  rationale: La préposition מן permet une lecture comparative, bien adaptée au contraste entre le sort de Noémi et celui de ses belles-filles. Une autre analyse comprend cependant « à cause de vous » ou « pour vous » ; cette ambiguïté réelle est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions rhétoriques sont directes, le vocabulaire matrimonial est explicite sans être technique, et l’image biblique de la « main » divine est conservée.
