  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: fr
  text: 'Mais Noémi dit : « Retournez, mes filles[a]. Pourquoi iriez-vous avec moi ? Ai-je encore des fils dans mon ventre, qui pourraient devenir vos maris ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mes filles » ; Noémi s’adresse avec affection à ses belles-filles.
    reason: 'Précision relationnelle : le sens littéral est maintenu dans le texte, tandis que la note identifie les destinataires dans le contexte.'
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Mais Noémi dit
  rationale: Le waw narratif fait progresser le récit, tandis que « Mais » rend ici le contraste entre la volonté des belles-filles de l’accompagner et la réponse de Noémi.
- source_word: שֹׁבְנָה
  choice: Retournez
  rationale: L’impératif féminin pluriel de שוב appelle les deux femmes à rebrousser chemin. « Retournez » est naturel et conserve le sens directionnel.
- source_word: בְנֹתַי
  choice: mes filles
  rationale: L’hébreu dit littéralement « mes filles ». Noémi emploie cette appellation familiale et affectueuse pour ses belles-filles.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: Pourquoi iriez-vous avec moi ?
  rationale: Le conditionnel français rend naturellement la valeur prospective et rhétorique de l’inaccompli dans cette supplication.
- source_word: הַעוֹד לִי
  choice: Ai-je encore
  rationale: 'עוד avec le pronom datif exprime ici la persistance ou la possession : Noémi demande si elle a encore des fils à offrir.'
- source_word: בָנִים
  choice: des fils
  rationale: Le terme désigne précisément des fils, élément indispensable à la logique matrimoniale de la question.
- source_word: בְּמֵעַי
  choice: dans mon ventre
  rationale: Le nom désigne les parties intérieures et, dans ce contexte de maternité, le ventre maternel. Cette formulation est concrète, naturelle et fidèle.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: qui pourraient devenir vos maris
  rationale: 'La proposition décrit le résultat hypothétique : ces fils deviendraient les maris des deux veuves. « Pourraient » préserve cette irréalité sans rendre la phrase pesante.'
theological_decisions:
- issue: Arrière-plan du mariage familial après le veuvage
  choice: Conserver simplement la logique de fils susceptibles de devenir les maris des veuves
  alternative: Expliciter dans le texte une obligation de lévirat
  rationale: Le verset évoque une attente matrimoniale familiale, mais ne formule pas ici les détails juridiques du lévirat. La traduction ne doit donc pas imposer une précision doctrinale ou légale absente du texte.
translation_notes:
  register: Français international actuel, digne et accessible. Le conditionnel dans les deux dernières propositions restitue la force rhétorique et hypothétique de la parole de Noémi. Le marqueur de note est placé après « mes filles », expression qu’il explique directement.
