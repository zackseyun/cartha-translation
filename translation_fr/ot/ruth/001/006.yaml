  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: fr
  text: Alors elle se leva avec ses belles-filles et partit des campagnes de Moab pour revenir, car elle avait appris, au pays de Moab, que Yahweh était intervenu en faveur de son peuple en leur donnant de la nourriture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du pain ». Le mot hébreu peut désigner le pain en particulier ou, plus largement, la nourriture et les vivres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Alors elle se leva
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, et « se leva » conserve le mouvement concret de קום dans un registre digne.
- source_word: וְכַלֹּתֶיהָ
  choice: avec ses belles-filles
  rationale: La coordination hébraïque exprime ici l’accompagnement ; « avec » est idiomatique en français.
- source_word: וַתָּשָׁב
  choice: entreprit de revenir
  rationale: שׁוב signifie revenir ou retourner. Le contexte immédiat montre que le voyage commence alors plutôt qu’il ne s’achève déjà ; cette formulation respecte la valeur directionnelle sans créer d’incohérence narrative.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: des campagnes de Moab
  rationale: Le pluriel de שׂדה peut désigner les champs ou, plus largement, la campagne et le territoire. « Campagnes » conserve l’image concrète tout en restant naturel.
- source_word: שָׁמְעָה
  choice: elle avait appris
  rationale: Le qatal présente l’information antérieure qui motive son départ. Le plus-que-parfait rend ce rapport temporel, et « apprendre » convient au sens de recevoir une nouvelle.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: au pays de Moab
  rationale: Au singulier, שׂדה peut désigner la contrée ou le territoire. « Au pays de Moab » évite l’impression qu’elle se trouvait dans un champ précis, tout en conservant le sens régional.
- source_word: פָּקַד
  choice: était intervenu en faveur de
  rationale: Dans ce contexte, פקד désigne l’attention bienveillante de Dieu se traduisant par une action concrète. « Intervenir en faveur de » communique cette visitation favorable sans préciser davantage son mode.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: « Peuple » rend le sens collectif et relationnel de עַם dans ce contexte.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: en lui donnant de la nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner par métonymie la nourriture ou les vivres en général. Le singulier français « lui » reprend naturellement le collectif « son peuple ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie explicitement le tétragramme. La translittération maintient le nom propre et ne le remplace pas par un titre.
- issue: Portée de פָּקַד dans l’action divine
  choice: était intervenu en faveur de son peuple
  alternative: avait visité son peuple
  rationale: Le contexte indique une attention divine favorable manifestée par le retour de la nourriture. La formulation choisie explicite cette orientation positive sans faire de « visiter » un simple déplacement ni définir plus précisément la nature de l’intervention.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, tout en conservant l’image géographique des campagnes de Moab et le nom divin Yahweh.
