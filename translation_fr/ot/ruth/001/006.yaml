revisions:
- from: Alors elle se leva avec ses belles-filles et entreprit de revenir des campagnes de Moab, car elle avait appris, au pays de Moab, que Yahweh était intervenu en faveur de son peuple en lui donnant de la nourriture[a].
  to: Alors elle se leva avec ses belles-filles et partit des campagnes de Moab pour revenir, car elle avait appris, au pays de Moab, que Yahweh était intervenu en faveur de son peuple en leur donnant de la nourriture[a].
  rationale: La révision remplace une formulation française pesante par une expression narrative plus idiomatique qui maintient le mouvement de retour implicite dans שוב et cohérent avec la suite du récit. Elle remplace aussi le pronom collectif singulier par le pluriel, conformément à להם, sans modifier le sens. La note lexicale est conservée telle quelle.
