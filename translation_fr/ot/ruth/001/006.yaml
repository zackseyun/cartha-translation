    issue: « entreprit de revenir » est une périphrase maladroite.
    rationale: Elle alourdit le français et présente le retour comme une entreprise plutôt que comme le départ en vue du retour. « Partit … pour revenir » rend plus directement la progression narrative et le contexte immédiat.
  - severity: low
    issue: Le pronom singulier « lui » ne reflète pas explicitement le pluriel לָהֶם.
    rationale: Le singulier collectif français est possible avec « son peuple », mais « leur donnant » conserve sans ambiguïté le bénéficiaire pluriel du texte hébreu.
  revised_text: Alors elle se leva avec ses belles-filles et partit des campagnes de Moab pour revenir, car elle avait appris, au pays de Moab, que Yahweh était intervenu en faveur de son peuple en leur donnant de la nourriture[a].
