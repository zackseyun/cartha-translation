  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: fr
  text: Élimélek, le mari de Noémi, mourut. Elle resta alors avec ses deux fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol fait progresser le récit. En français, la succession narrative est naturellement rendue par le passé simple, sans devoir traduire systématiquement la conjonction par « et ».
- source_word: אֱלִימֶלֶךְ
  choice: Élimélek
  rationale: Le nom propre est translittéré sous une forme française claire, proche de la prononciation hébraïque.
- source_word: אִישׁ נָעֳמִי
  choice: le mari de Noémi
  rationale: Dans cette construction, אִישׁ désigne le mari, et non simplement un homme. Cette formulation française explicite naturellement la relation conjugale.
- source_word: וַתִּשָּׁאֵר
  choice: Elle resta alors
  rationale: Le verbe שׁאר indique qu'elle demeure après la mort de son mari. « Resta » conserve ce sens sans introduire un passif artificiel; « alors » marque discrètement la conséquence et la progression du récit.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: avec ses deux fils
  rationale: L'hébreu présente explicitement Noémi et ses deux fils comme ceux qui restent. La tournure française « elle resta avec ses deux fils » restitue ce groupe de manière idiomatique, sans la répétition peu naturelle « elle, et ses deux fils ».
