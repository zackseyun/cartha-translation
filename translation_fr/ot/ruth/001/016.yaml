  text: וַ/תֹּ֤אמֶר רוּת֙ אַל תִּפְגְּעִי בִ֔/י לְ/עָזְבֵ֖/ךְ לָ/שׁ֣וּב מֵ/אַחֲרָ֑יִ/ךְ כִּ֠י אֶל אֲשֶׁ֨ר תֵּלְכִ֜י אֵלֵ֗ךְ וּ/בַ/אֲשֶׁ֤ר תָּלִ֨ינִי֙ אָלִ֔ין עַמֵּ֣/ךְ עַמִּ֔/י וֵ/אלֹהַ֖יִ/ךְ אֱלֹהָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: fr
  text: 'Mais Ruth dit : « Ne me presse pas[a] de te quitter ni de rebrousser chemin loin de toi. Car là où tu iras, j’irai, et là où tu passeras la nuit, je passerai la nuit[b]. Ton peuple sera mon peuple, et ton Dieu sera mon Dieu[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne m’insiste pas », « Ne me supplie pas » ou « Ne me demande pas avec insistance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « là où tu logeras, je logerai ». Le verbe hébreu désigne souvent le fait de passer la nuit.
    reason: lexical_alternative
  - marker: c
    text: 'En hébreu, les deux propositions sont sans verbe : littéralement, « ton peuple, mon peuple, et ton Dieu, mon Dieu ». Selon le contexte, le français peut les rendre au présent ou au futur.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: N’insiste pas auprès de moi
  rationale: Avec ב, פגע peut exprimer une demande pressante ou insistante. Cette formulation est naturelle en français et rend la supplication de Ruth sans suggérer un contact physique ni de l’hostilité.
- source_word: לְעָזְבֵךְ
  choice: pour que je te quitte
  rationale: עזב signifie couramment « quitter » ou « abandonner ». « Quitter » convient au contexte et évite de renforcer inutilement la nuance affective ou covenantale d’« abandonner ».
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: et cesse de te suivre
  rationale: L’expression signifie littéralement revenir ou se détourner « de derrière toi ». En contexte, elle désigne le fait de renoncer à suivre Naomi; la formulation française en exprime clairement le sens tout en conservant l’idée du mouvement à sa suite.
- source_word: כִּי
  choice: Car
  rationale: כִּי introduit ici la raison de la demande de Ruth. « Car » maintient le lien argumentatif dans un registre digne et courant.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: là où tu iras, j’irai
  rationale: La construction relative exprime la destination. Cette formulation idiomatique préserve le parallélisme et l’engagement exprimé par Ruth.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: là où tu passeras la nuit, je passerai la nuit
  rationale: לון désigne souvent le fait de passer la nuit ou de loger temporairement. « Passer la nuit » est précis, naturel en français moderne et conserve la répétition hébraïque.
- source_word: עַמֵּךְ עַמִּי
  choice: Ton peuple sera mon peuple
  rationale: La proposition hébraïque est sans copule et permet selon le contexte une lecture présente ou future. Le futur convient à la portée d’engagement de la déclaration de Ruth.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: et ton Dieu sera mon Dieu
  rationale: Cette seconde proposition est elle aussi sans copule. Le français exige normalement un verbe; le futur garde le parallélisme avec la proposition précédente et exprime naturellement l’engagement de Ruth envers le Dieu de Naomi.
theological_decisions:
- issue: Valeur temporelle des deux propositions nominales « ton peuple, mon peuple » et « ton Dieu, mon Dieu »
  choice: Employer le futur dans les deux propositions
  alternative: Employer le présent dans les deux propositions, ou conserver une tournure nominale elliptique
  rationale: L’hébreu n’exprime aucun temps par une copule et laisse ouverte une lecture d’identification présente ou d’engagement orienté vers l’avenir. Le futur est le plus naturel dans le contexte de la résolution de Ruth, tandis qu’une note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve le parallélisme et la répétition de l’hébreu. « N’insiste pas auprès de moi » évite l’ambiguïté moderne de « ne me presse pas », tandis que « passer la nuit » rend précisément לון sans archaïsme.
