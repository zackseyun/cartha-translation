source:
  edition: WLC
  text: וַ/תִּשֶּׂ֣נָה קוֹלָ֔/ן וַ/תִּבְכֶּ֖ינָה ע֑וֹד וַ/תִּשַּׁ֤ק עָרְפָּה֙ לַ/חֲמוֹתָ֔/הּ וְ/ר֖וּת דָּ֥בְקָה בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/014.yaml
  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: fr
  text: Alors elles élevèrent la voix et pleurèrent de nouveau. Orpa embrassa sa belle-mère, mais Ruth resta attachée à elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et Ruth resta attachée à elle ». La conjonction hébraïque peut simplement se traduire par « et », mais le contexte suggère un contraste entre le baiser d’Orpa et l’attachement persistant de Ruth.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: elles élevèrent la voix
  rationale: Cette tournure conserve l’expression idiomatique hébraïque tout en restant naturelle en français et indique une lamentation audible.
- source_word: וַתִּבְכֶּינָה עוֹד
  choice: de nouveau ... pleurèrent
  rationale: Le verbe désigne les pleurs, et עוֹד marque ici leur répétition après les pleurs déjà mentionnés au verset 9.
- source_word: וַתִּשַּׁק
  choice: embrassa
  rationale: Le verbe signifie directement « embrasser » dans ce contexte d’adieu.
- source_word: לַחֲמוֹתָהּ
  choice: sa belle-mère
  rationale: Le nom désigne précisément la belle-mère, et le suffixe féminin renvoie à Orpa.
- source_word: דָּבְקָה בָּהּ
  choice: resta attachée à elle
  rationale: דבק exprime une adhésion ferme et durable. Cette formulation française rend à la fois l’attachement relationnel et le fait que Ruth ne se sépare pas de Noémi, sans imposer ici un sens technique ou confessionnel.
- source_word: וְ
  choice: mais
  rationale: La conjonction peut simplement signifier « et », mais le récit oppose implicitement le geste d’adieu d’Orpa à l’attachement persistant de Ruth.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Translittération française usuelle du nom propre.
- source_word: רוּת
  choice: Ruth
  rationale: Forme française usuelle du nom propre.
theological_decisions:
- issue: Portée de דבק pour l’attachement de Ruth
  choice: resta attachée à elle
  alternative: s’attacha à elle / se cramponna à elle
  rationale: Le choix garde la force relationnelle et la persistance exprimées par le verbe sans transformer explicitement l’action en engagement d’alliance ni la réduire à un geste physique.
translation_notes:
  register: Français international moderne, narratif et digne. « Élevèrent la voix » préserve l’idiome hébraïque; « pleurèrent » évite la confusion possible de « crier ». La place de « de nouveau » donne une phrase naturelle tout en rendant עוֹד.
