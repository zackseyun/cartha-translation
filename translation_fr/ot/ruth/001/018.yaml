review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement le constat de Noémi et la résolution de Ruth. En revanche, « cessa d’insister auprès d’elle » interprète et restreint indûment לְדַבֵּר אֵלֶיהָ, qui signifie simplement « parler à/avec elle »; le contexte ne justifie pas de remplacer le verbe général par « insister » dans le texte principal.
  naturalness: « Quand Noémi vit que Ruth était résolue à partir avec elle » est naturel en français international moderne. « Elle cessa de lui parler » est également idiomatique, clair et conserve la sobriété narrative du texte.
  terminology: Les noms « Noémi » et « Ruth » sont correctement employés et lèvent sans lourdeur l’ambiguïté potentielle des pronoms féminins. « Résolue » rend bien le hitpael de אמץ dans ce contexte. Aucune question théologique ou terminologique particulière ne se pose.
  issues:
  - severity: medium
    issue: « elle cessa d’insister auprès d’elle » remplace « parler à elle » par une interprétation contextuelle.
    rationale: Le verbe חדל suivi de לדבר אל signifie « cesser de parler à ». L’insistance est plausible dans le contexte antérieur, mais n’est pas exprimée lexicalement dans ce verset; cette formulation réduit donc la portée du texte source.
  - severity: low
    issue: La note qualifie « elle cessa de lui parler » de formulation « plus formelle » alors qu’elle correspond directement au sens lexical de l’hébreu.
    rationale: Une note d’alternative ne doit pas présenter la traduction fidèle et non marquée comme une simple variante stylistique, surtout lorsque le texte principal adopte une interprétation plus spécifique.
  revised_text: Quand Noémi vit que Ruth était résolue à partir avec elle, elle cessa de lui parler.
  revised_footnotes: []
