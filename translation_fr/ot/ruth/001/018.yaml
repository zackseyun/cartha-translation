translation_notes:
  register: Français international moderne, naturel et digne. Les noms « Noémi » et « Ruth » remplacent les deux premiers pronoms féminins afin de lever une ambiguïté référentielle que le contexte hébreu résout clairement. La note conserve la portée littérale de la dernière proposition.
