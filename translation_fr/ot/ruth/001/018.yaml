  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: fr
  text: Quand Noémi vit que Ruth était résolue à partir avec elle, elle cessa de lui parler.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quand Noémi vit
  rationale: Le wayyiqtol fait progresser le récit, tandis que « quand » exprime naturellement le rapport temporel avec la proposition principale. Les noms explicites évitent l’ambiguïté des pronoms féminins en français.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Noémi constate.
- source_word: מִתְאַמֶּצֶת
  choice: était résolue
  rationale: Le hitpael de אמץ évoque le fait de s’affermir, donc une ferme résolution; « était résolue » est naturel et digne en français.
- source_word: לָלֶכֶת אִתָּהּ
  choice: à partir avec elle
  rationale: הלך désigne ici le déplacement projeté. « Partir avec elle » s’intègre naturellement au contexte du voyage, sans réduire le verbe à la marche à pied.
- source_word: וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ
  choice: elle cessa d’insister auprès d’elle
  rationale: Littéralement, l’expression signifie « elle cessa de lui parler ». Dans le contexte immédiat, la parole visée est l’effort de Noémi pour faire repartir Ruth; « insister auprès d’elle » rend cette valeur contextuelle tout en signalant en note la formulation plus formelle.
