id: RUT.1.21
reference: Ruth 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: fr
  text: Je suis partie comblée, mais Yahweh m’a fait revenir les mains vides. Pourquoi m’appelez-vous Noémi, alors que Yahweh a témoigné contre moi[a] et que le Tout-Puissant a fait venir le malheur sur moi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a porté témoignage contre moi ». Le verbe hébreu peut évoquer le fait de répondre ou de témoigner contre quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Ou « m’a fait du mal ». L’expression hébraïque désigne le malheur ou l’adversité que Noémi attribue à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: comblée
  rationale: L’adjectif décrit l’état antérieur de Noémi. « Comblée » est naturel en français et peut évoquer à la fois sa famille et ses biens sans préciser ce que l’hébreu laisse implicite.
- source_word: הָלַכְתִּי
  choice: je suis partie
  rationale: Rend simplement le départ exprimé par le verbe, dans un français courant et digne.
- source_word: וְרֵיקָם
  choice: les mains vides
  rationale: L’adverbe signifie « vide » ou « sans rien ». L’expression française garde le contraste avec « comblée » tout en évitant l’étrangeté de « m’a fait revenir vide ».
- source_word: הֱשִׁיבַנִי
  choice: m’a fait revenir
  rationale: Le hiphil de שוב est causatif. Cette formulation conserve explicitement l’action de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: Pourquoi m’appelez-vous Noémi
  rationale: Question rhétorique adressée aux femmes de Bethléem. Le français « vous » convient au pluriel sans devoir expliciter le genre.
- source_word: נָעֳמִי
  choice: Noémi
  rationale: Forme française courante du nom biblique; son sens, lié à l’agrément, n’est pas ajouté au corps du texte.
- source_word: עָנָה בִי
  choice: a témoigné contre moi
  rationale: 'La construction peut avoir un sens judiciaire: répondre ou porter témoignage contre quelqu’un. Ce choix la distingue de la proposition suivante concernant le malheur.'
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Traduit le titre divin par son équivalent français traditionnel et intelligible.
- source_word: הֵרַע לִי
  choice: a fait venir le malheur sur moi
  rationale: Le hiphil exprime ici une adversité causée. « Malheur » conserve la force de l’affirmation sans attribuer à Dieu un mal moral que le français « faire du mal » pourrait suggérer.
theological_decisions:
- issue: L’action de Dieu dans la souffrance de Noémi
  choice: 'Conserver l’action divine directe: Yahweh témoigne contre elle et le Tout-Puissant fait venir le malheur sur elle.'
  alternative: Atténuer en disant que Dieu a permis le malheur, ou comprendre עָנָה comme « affliger ».
  rationale: L’hébreu attribue directement à Yahweh et au Tout-Puissant le retournement douloureux vécu par Noémi. La traduction maintient cette tension théologique sans la résoudre ni l’adoucir.
translation_notes:
  register: Français international moderne, sobre et digne. « Comblée » et « les mains vides » forment un contraste naturel sans expliciter les pertes de Noémi. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
