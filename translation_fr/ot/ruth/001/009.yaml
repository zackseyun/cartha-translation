source:
  edition: WLC
  text: יִתֵּ֤ן יְהוָה֙ לָ/כֶ֔ם וּ/מְצֶ֣אןָ מְנוּחָ֔ה אִשָּׁ֖ה בֵּ֣ית אִישָׁ֑/הּ וַ/תִּשַּׁ֣ק לָ/הֶ֔ן וַ/תִּשֶּׂ֥אנָה קוֹלָ֖/ן וַ/תִּבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: fr
  text: « Que Yahweh vous accorde de trouver le repos[a], chacune dans la maison de son mari ! » Puis elle les embrassa. Elles élevèrent la voix et pleurèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la sécurité » ou « une vie stable ». Ici, le mot hébreu traduit par « repos » évoque la stabilité et la sécurité d’une vie établie dans le foyer d’un mari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: Que … accorde
  rationale: La forme exprime ici le souhait d’une bénédiction; la tournure française « Que … accorde » en restitue naturellement la valeur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel représenté par le tétragramme dans le texte hébreu.
- source_word: וּמְצֶאןָ
  choice: de trouver
  rationale: Le verbe poursuit le souhait dépendant de « accorde »; cette construction est idiomatique en français.
- source_word: מְנוּחָה
  choice: le repos
  rationale: Le nom désigne le repos ou une situation stable; « repos » conserve l’image hébraïque sans réduire son sens contextuel à la seule sécurité matérielle.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: chacune dans la maison de son mari
  rationale: La formulation rend la valeur distributive de אִשָּׁה pour les deux femmes et la perspective d’une vie conjugale établie.
- source_word: וַתִּשַּׁק לָהֶן
  choice: Puis elle les embrassa
  rationale: Rend simplement la progression narrative du wayyiqtol dans un français naturel.
- source_word: וַתִּשֶּׂאנָה קוֹלָן
  choice: Elles élevèrent la voix
  rationale: Préserve l’idiome hébreu de la lamentation audible tout en restant clair en français.
- source_word: וַתִּבְכֶּינָה
  choice: et pleurèrent
  rationale: Traduction directe du verbe, coordonnée à l’expression précédente.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Portée de מְנוּחָה dans la bénédiction
  choice: repos, avec une note explicitant la stabilité envisagée
  alternative: sécurité
  rationale: Le terme garde une image plus large que la seule sécurité. Le contexte précise que ce repos est espéré dans le foyer d’un mari; la traduction conserve donc la tension entre l’image lexicale et sa réalisation concrète.
translation_notes:
  register: Français international moderne, naturel et digne. La bénédiction est formulée avec le subjonctif optatif; l’idiome hébreu « élever la voix » est conservé, et le sens contextuel de « repos » est expliqué sans être imposé dans le corps du texte.
