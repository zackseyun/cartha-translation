  text: וַ/יָּמ֥וּתוּ גַם שְׁנֵי/הֶ֖ם מַחְל֣וֹן וְ/כִלְי֑וֹן וַ/תִּשָּׁאֵר֙ הָֽ/אִשָּׁ֔ה מִ/שְּׁנֵ֥י יְלָדֶ֖י/הָ וּ/מֵ/אִישָֽׁ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: fr
  text: Puis Mahlôn et Kilyôn moururent eux aussi, tous les deux. La femme se retrouva privée de ses deux enfants[a] et de son mari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « de ses deux fils ». Le terme hébreu signifie littéralement « enfants » et peut désigner plus généralement la descendance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: Puis … moururent
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement la succession narrative en français, et le passé simple convient au registre narratif.
- source_word: גַם שְׁנֵי/הֶם
  choice: eux aussi, tous les deux
  rationale: « Eux aussi » rattache leur mort à la perte précédente, tandis que « tous les deux » conserve l’insistance explicite de l’hébreu sur les deux fils.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Mahlôn et Kilyôn
  rationale: Les noms sont translittérés directement de l’hébreu selon une forme claire pour le lectorat francophone.
- source_word: וַתִּשָּׁאֵר
  choice: se retrouva privée
  rationale: Le verbe שׁאר, avec les compléments introduits par מִן, décrit ici la femme demeurée après la perte des siens. Cette tournure française rend naturellement à la fois la survie et le dénuement, sans suggérer qu’elle était absolument seule.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: L’hébreu emploie « la femme » plutôt que son nom ou « l’épouse » ; la traduction conserve ce choix narratif.
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: privée de ses deux enfants
  rationale: Dans cette construction, מִן marque la séparation ou la privation. יְלָדִים signifie littéralement « enfants » ou « descendants », même si le contexte identifie ici des fils adultes.
- source_word: וּמֵאִישָׁהּ
  choice: et de son mari
  rationale: Avec le suffixe possessif et dans ce contexte familial, אִישׁ désigne le mari. La préposition répétée prolonge l’idée de privation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un ton narratif biblique accessible. La formulation évite « resta seule », qui pourrait aller au-delà du texte puisque les belles-filles de Noémi sont encore présentes dans le récit.
