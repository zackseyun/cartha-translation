  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ לִ/שְׁתֵּ֣י כַלֹּתֶ֔י/הָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְ/בֵ֣ית אִמָּ֑/הּ יעשה יְהוָ֤ה עִמָּ/כֶם֙ חֶ֔סֶד כַּ/אֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם הַ/מֵּתִ֖ים וְ/עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: fr
  text: 'Noémi dit à ses deux belles-filles : « Allez, retournez chacune à la maison de sa mère. Que Yahweh use de bonté[a] envers vous, comme vous avez agi avec bonté envers les morts et envers moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu חֶסֶד peut aussi désigner l’amour fidèle, l’amour loyal ou la fidélité bienveillante.
    reason: Alternative lexicale pour חֶסֶד ; la note signale les nuances relationnelles plus riches que « bonté » sans les imposer dans le texte courant.
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: ses deux belles-filles
  rationale: Dans ce contexte, כַּלָּה désigne la femme d’un fils. « Belles-filles » est l’expression française naturelle, le contexte excluant ici le sens de filles d’un conjoint.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: Allez, retournez
  rationale: Les deux impératifs sont conservés afin de rendre l’insistance de Noémi sans les fondre en un seul ordre.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: chacune chez sa mère
  rationale: אִשָּׁה a ici une valeur distributive. « Chacune » la restitue naturellement, tandis que « chez sa mère » exprime idiomatiquement la destination littérale « vers la maison de sa mère ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin personnel est translittéré plutôt que remplacé par un titre.
- source_word: חֶסֶד
  choice: bonté
  rationale: Dans cette bénédiction, « bonté » exprime clairement la bienveillance concrète, tout en laissant une note signaler les nuances de fidélité et d’attachement durable du terme hébreu.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: comme vous en avez témoigné à ceux qui sont morts et à moi
  rationale: Le pronom « en » reprend la bonté mentionnée juste avant et rend naturellement l’expression hébraïque « faire חֶסֶד avec ». « Ceux qui sont morts » conserve le pluriel sans préciser au-delà du texte leur identité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, nom personnel du Dieu d’Israël. La translittération le conserve au lieu de lui substituer un titre.
- issue: Portée de חֶסֶד
  choice: bonté, avec les nuances signalées en note
  alternative: amour fidèle
  rationale: « Bonté » convient au geste relationnel concret évoqué ici, tandis que la note préserve la richesse sémantique du mot sans imposer dans le corps du texte une interprétation exclusivement alliance.
translation_notes:
  register: Français international moderne, naturel et digne. Le double impératif hébreu est maintenu. « Chacune chez sa mère » évite la lourdeur de « chacune vers la maison de sa mère » tout en conservant le sens précis.
