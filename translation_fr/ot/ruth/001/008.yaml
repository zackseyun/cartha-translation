- from: 'Noémi dit à ses deux belles-filles : « Allez, retournez chacune chez sa mère. Que Yahweh vous témoigne sa bonté[a], comme vous en avez témoigné à ceux qui sont morts et à moi. »'
  to: 'Noémi dit à ses deux belles-filles : « Allez, retournez chacune à la maison de sa mère. Que Yahweh use de bonté[a] envers vous, comme vous avez agi avec bonté envers les morts et envers moi. »'
  rationale: La révision remplace une construction française maladroite par une expression idiomatique qui préserve la structure comparative et la répétition de חֶסֶד. Elle rétablit également la mention explicite de la maison de la mère, présente dans l’hébreu, sans alourdir le français.
