reference: Ruth 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: fr
  text: 'Elle dit : « Regarde, ta belle-sœur est retournée vers son peuple et vers ses dieux.[a] Retourne à la suite de ta belle-sœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se comprendre : « vers son dieu »; la forme est toutefois plurielle et renvoie probablement aux divinités de Moab.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le wayyiqtol narratif de אמר introduit la parole de Noémi. Le sujet féminin est laissé implicite dans l’hébreu mais se comprend clairement dans le contexte.
- source_word: הִנֵּה
  choice: Regarde
  rationale: La particule déictique attire l’attention de Ruth sur le retour d’Orpa. « Regarde » en conserve la force dans un français actuel.
- source_word: שָׁבָה / שׁוּבִי
  choice: est retournée / Retourne
  rationale: La répétition de la même racine שוב est conservée afin de relier explicitement l’action accomplie par Orpa à l’ordre adressé à Ruth.
- source_word: יְבִמְתֵּךְ
  choice: ta belle-sœur
  rationale: Dans ce contexte de parenté par alliance, « belle-sœur » est l’équivalent français naturel et compréhensible; le même terme traduit les deux occurrences.
- source_word: אֶל עַמָּהּ
  choice: vers son peuple
  rationale: עַם désigne ici le groupe humain et communautaire auquel Orpa appartient, et non seulement sa famille proche.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: et vers ses dieux
  rationale: La forme avec suffixe est morphologiquement plurielle et, dans le cadre religieux moabite, désigne probablement les divinités de son peuple. La préposition « vers » est répétée pour refléter אֶל.
- source_word: אַחֲרֵי
  choice: à la suite de
  rationale: Cette expression conserve l’image de Ruth invitée à suivre la voie prise par sa belle-sœur, tout en restant idiomatique en français.
theological_decisions:
- issue: Sens de אֱלֹהֶיהָ à propos du culte moabite
  choice: ses dieux
  alternative: son dieu
  rationale: אֱלֹהִים peut parfois avoir un sens singulier, mais la morphologie et le contexte du retour au peuple et au culte de Moab favorisent ici le pluriel. La note maintient néanmoins l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au singulier féminin des formes hébraïques. La répétition de שוב est rendue par « est retournée / Retourne », et la répétition de יְבִמְתֵּךְ par « ta belle-sœur ».
