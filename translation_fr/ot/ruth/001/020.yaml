id: RUT.1.20
reference: Ruth 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: fr
  text: 'Mais elle leur dit : « Ne m’appelez pas Noémi ; appelez-moi Mara[a], car le Tout-Puissant m’a rendue très amère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noémi évoque ce qui est agréable, tandis que Mara signifie « amère ».
    reason: Le changement de nom repose sur un jeu de sens essentiel à la plainte de Noémi, qui ne ressort pas clairement pour la plupart des lecteurs francophones.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Mais elle leur dit
  rationale: Le waw narratif fait progresser le récit, tandis que « Mais » rend ici la réponse corrective de Noémi aux femmes de Bethléem. « Dit » reste proche du verbe hébreu sans expliciter davantage la nature de la prise de parole.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: Ne m’appelez pas Noémi
  rationale: קרא suivi d’un nom signifie ici « appeler » ou « donner le nom de ». La forme verbale s’adresse à plusieurs femmes, distinction que le français ne marque pas dans cet impératif négatif.
- source_word: נָעֳמִי
  choice: Noémi
  rationale: Le nom propre est donné sous sa forme française usuelle. Son évocation de ce qui est agréable est signalée en note plutôt qu’intégrée au texte.
- source_word: קְרֶאןָ לִי מָרָא
  choice: appelez-moi Mara
  rationale: La répétition d’« appelez » conserve le parallélisme et l’opposition rhétorique entre les deux noms. Mara est translittéré comme un nom, et son sens est indiqué en note.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Noémi pour demander ce changement de nom.
- source_word: הֵמַר ... לִי מְאֹד
  choice: m’a rendue très amère
  rationale: Le hiphil de מרר exprime ici l’action de rendre amer. Cette formulation directe préserve le lien lexical avec Mara et l’intensification portée par מְאֹד, sans atténuer l’affirmation de Noémi.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Ce titre divin est traduit par son équivalent français traditionnel, clair et largement compréhensible, plutôt que simplement translittéré.
theological_decisions:
- issue: Traduction du titre divin שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Le terme fonctionne ici comme un titre divin. Le traduire communique son sens conventionnel au lecteur francophone, tandis que « Shaddaï » préserverait davantage la forme hébraïque mais serait moins transparent.
- issue: Attribution de l’amertume au Tout-Puissant
  choice: m’a rendue très amère
  alternative: a agi envers moi avec une grande amertume
  rationale: La formulation retenue conserve l’affirmation directe et théologiquement tendue de Noémi selon laquelle le Tout-Puissant est à l’origine de son amertume. Elle évite de l’adoucir en introduisant une simple permission ou une cause indirecte absente de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation et l’impératif sont idiomatiques, tandis que la répétition « appelez » et la dureté de la déclaration finale préservent la force rhétorique de l’hébreu.
