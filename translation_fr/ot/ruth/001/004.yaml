source:
  edition: WLC
  text: וַ/יִּשְׂא֣וּ לָ/הֶ֗ם נָשִׁים֙ מֹֽאֲבִיּ֔וֹת שֵׁ֤ם הָֽ/אַחַת֙ עָרְפָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית ר֑וּת וַ/יֵּ֥שְׁבוּ שָׁ֖ם כְּ/עֶ֥שֶׂר שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: fr
  text: Ils prirent pour femmes des Moabites[a]. L’une s’appelait Orpa, et la seconde Ruth. Ils habitèrent là environ dix ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils épousèrent des femmes moabites. » L’hébreu dit littéralement : « Ils prirent pour eux des femmes moabites. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים
  choice: Ils prirent pour femmes
  rationale: L’expression hébraïque désigne le fait d’épouser des femmes. Cette formulation française conserve l’image de « prendre pour femmes » tout en exprimant clairement le mariage; le pronom לָהֶם n’a pas besoin d’être rendu séparément, puisque « prendre pour femmes » implique ici qu’ils les prennent eux-mêmes pour épouses.
- source_word: מֹאֲבִיּוֹת
  choice: des Moabites
  rationale: Le féminin pluriel substantivé désigne des femmes appartenant au peuple de Moab. Après « pour femmes », « des Moabites » est naturel, concis et précis.
- source_word: שֵׁם הָאַחַת
  choice: L’une s’appelait
  rationale: Cette tournure rend naturellement en français la formule hébraïque « le nom de l’une [était] », sans alourdir la phrase.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Transcription française traditionnelle et largement reconnue du nom hébreu.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: et la seconde
  rationale: Le texte hébreu emploie explicitement l’ordinal « la seconde ». Le conserver respecte le parallélisme et la précision de la source, même si « l’autre » serait plus idiomatique.
- source_word: רוּת
  choice: Ruth
  rationale: Transcription française traditionnelle et largement reconnue du nom hébreu.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Ils habitèrent là
  rationale: Le verbe יָשַׁב exprime ici une résidence prolongée. « Habitèrent » convient au registre narratif biblique tout en restant compréhensible en français moderne.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: environ dix ans
  rationale: Le préfixe כְּ marque ici l’approximation; « environ » la rend explicitement et naturellement.
