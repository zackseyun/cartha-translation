id: RUT.1.1
reference: Ruth 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: fr
  text: Au temps où les juges jugeaient[a], il y eut une famine dans le pays. Un homme partit de Bethléem de Juda pour séjourner[b] dans la région de Moab[c], avec sa femme et ses deux fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « au temps où les juges gouvernaient ». L’hébreu répète la même racine : littéralement, « où les juges jugeaient ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe suggère un séjour, souvent en tant qu’étranger, plutôt qu’une installation nécessairement définitive.
    reason: cultural_note
  - marker: c
    text: Littéralement, « dans les champs de Moab » ; l’expression peut désigner la campagne ou le territoire de Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: il y eut
  rationale: Dans la seconde proposition, le wayyiqtol de היה introduit naturellement la survenue de la famine. L’ouverture temporelle « Au temps où… » porte déjà l’entrée en récit, ce qui évite le tour plus lourd « Il arriva que ».
- source_word: בִּימֵי שְׁפֹט הַשֹּׁפְטִים
  choice: Au temps où les juges jugeaient
  rationale: Cette formulation conserve la répétition de la racine שׁפט et la couleur narrative de l’hébreu, tout en restant intelligible en français.
- source_word: רָעָב
  choice: famine
  rationale: Le terme désigne ici une grave pénurie alimentaire touchant le pays, et non la simple faim individuelle.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Le contexte renvoie au pays où se trouve Bethléem de Juda, sans que le verset le nomme explicitement.
- source_word: אִישׁ
  choice: un homme
  rationale: Le masculin singulier est explicite et désigne l’homme qui sera nommé au verset suivant.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Bethléem de Juda
  rationale: La désignation distingue cette Bethléem par son rattachement à Juda et suit de près la structure hébraïque.
- source_word: לָגוּר
  choice: pour séjourner
  rationale: גור évoque une résidence non permanente, souvent comme personne venue d’ailleurs. « Séjourner » maintient cette nuance sans supposer une installation définitive.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: dans la région de Moab
  rationale: Le pluriel « champs de Moab » peut désigner par métonymie le territoire ou la campagne de Moab. « Région » exprime clairement ce sens géographique, tandis qu’une note conserve l’image littérale.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: avec sa femme et ses deux fils
  rationale: Cette tournure française naturelle rend la liste des membres de sa famille qui l’accompagnent, sans modifier leur nombre ni leur relation.
