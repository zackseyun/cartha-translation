base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: fr
  text: L’homme s’appelait Élimélek, sa femme Noémi, et leurs deux fils Mahlôn et Kilyôn. C’étaient des Éphratiens de Bethléem en Juda. Ils arrivèrent dans les campagnes de Moab[a] et y restèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le territoire de Moab »; littéralement, « les champs de Moab ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « et ils furent là ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: L’homme s’appelait
  rationale: Rend naturellement en français moderne la formule hébraïque de nomination, sans en modifier le sens.
- source_word: אֱלִימֶלֶךְ
  choice: Élimélek
  rationale: Translittération française usuelle du nom propre, avec כ rendu par « k ».
- source_word: נָעֳמִי
  choice: Noémi
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Mahlôn et Kilyôn
  rationale: Translittération adaptée au français; « Kilyôn » distingue correctement l’initiale כ d’un son français « ch ».
- source_word: אֶפְרָתִים
  choice: Éphratiens
  rationale: Gentilé désignant les personnes associées à Éphrata, ici à Bethléem; il ne faut pas le confondre avec « Éphraïmites ».
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Bethléem en Juda
  rationale: Formulation française naturelle qui situe Bethléem dans le territoire de Juda.
- source_word: וַיָּבֹאוּ
  choice: Ils arrivèrent
  rationale: Dans ce récit de déplacement, « arrivèrent » exprime naturellement l’aboutissement indiqué par בוא.
- source_word: שְׂדֵי מוֹאָב
  choice: les campagnes de Moab
  rationale: Le pluriel de שָׂדֶה peut désigner les champs ou, plus largement, la campagne et le territoire rural de Moab; « campagnes » conserve l’image concrète tout en étant idiomatique.
- source_word: וַיִּהְיוּ שָׁם
  choice: et y demeurèrent
  rationale: Rend la présence continue suggérée dans le contexte, tout en signalant en note la formulation hébraïque plus littérale.
