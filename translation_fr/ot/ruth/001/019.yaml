source:
  edition: WLC
  text: וַ/תֵּלַ֣כְנָה שְׁתֵּי/הֶ֔ם עַד בֹּאָ֖/נָה בֵּ֣ית לָ֑חֶם וַ/יְהִ֗י כְּ/בֹאָ֨/נָה֙ בֵּ֣ית לֶ֔חֶם וַ/תֵּהֹ֤ם כָּל הָ/עִיר֙ עֲלֵי/הֶ֔ן וַ/תֹּאמַ֖רְנָה הֲ/זֹ֥את נָעֳמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: fr
  text: 'Elles poursuivirent toutes deux leur chemin jusqu’à Bethléem. Lorsqu’elles arrivèrent à Bethléem, toute la ville fut en émoi à cause d’elles, et les femmes dirent[a] : « Est-ce là Noémi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le verbe traduit par « dirent » est au féminin pluriel, ce qui indique que les personnes qui parlent sont des femmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: Elles poursuivirent toutes deux leur chemin
  rationale: La séquence narrative exprime la continuation du voyage, tandis que שְׁתֵּיהֶם souligne que Noémi et Ruth avancent ensemble. Cette formulation est naturelle en français et conserve ces deux éléments.
- source_word: עַד בֹּאנָה
  choice: jusqu’à
  rationale: עַד avec בוא indique le terme du trajet; en français, « jusqu’à Bethléem » exprime clairement et sans lourdeur qu’elles atteignent leur destination.
- source_word: בֵּית לָחֶם
  choice: Bethléem
  rationale: Le nom de lieu est rendu sous sa forme française traditionnelle plutôt que traduit littéralement.
- source_word: וַיְהִי כְּבֹאנָה
  choice: Lorsqu’elles arrivèrent
  rationale: La formule narrative introduit l’événement qui se produit à leur arrivée. La formulation française préserve sa valeur temporelle sans calquer lourdement « et il arriva ».
- source_word: וַתֵּהֹם
  choice: fut en émoi
  rationale: Le verbe המה évoque une vive agitation collective. « Être en émoi » rend cette réaction sans suggérer nécessairement une émeute ou un désordre violent.
- source_word: כָּל הָעִיר
  choice: toute la ville
  rationale: עִיר désigne ici la communauté urbaine de Bethléem. « Toute la ville » est idiomatique en français et peut naturellement désigner l’ensemble de ses habitants.
- source_word: עֲלֵיהֶן
  choice: à cause d’elles
  rationale: La préposition עַל indique ici que l’arrivée des deux femmes provoque l’émoi de la ville.
- source_word: וַתֹּאמַרְנָה
  choice: les femmes dirent
  rationale: La forme verbale est au féminin pluriel; rendre explicitement « les femmes » préserve cette information grammaticale que le simple pronom français « elles » laisserait moins clairement attribuée.
- source_word: הֲזֹאת נָעֳמִי
  choice: Est-ce là Noémi ?
  rationale: L’interrogatif et le démonstratif expriment une reconnaissance étonnée. « Est-ce là Noémi ? » conserve le démonstratif et reste naturel dans un registre narratif digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au récit biblique écrit sans archaïsme excessif. Le marqueur de note est placé après « dirent », l’élément grammatical qu’il explique.
