source:
  edition: WLC
  text: וַ/תָּ֣שָׁב נָעֳמִ֗י וְ/ר֨וּת הַ/מּוֹאֲבִיָּ֤ה כַלָּתָ/הּ֙ עִמָּ֔/הּ הַ/שָּׁ֖בָה מִ/שְּׂדֵ֣י מוֹאָ֑ב וְ/הֵ֗מָּה בָּ֚אוּ בֵּ֣ית לֶ֔חֶם בִּ/תְחִלַּ֖ת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: fr
  text: Ainsi, Noémi revint, accompagnée de Ruth la Moabite, sa belle-fille, qui revenait des champs de Moab[a]. Elles arrivèrent à Bethléhem au début de la moisson de l’orge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, dans un sens plus idiomatique, « du pays de Moab ». L’hébreu dit littéralement « des champs de Moab ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב exprime le retour. « Revint » est concis, naturel dans le récit et conserve le mouvement de retour vers Bethléhem.
- source_word: הַמּוֹאֲבִיָּה
  choice: la Moabite
  rationale: L’adjectif ethnique féminin est employé comme une désignation en apposition. « La Moabite » maintient l’importance narrative de l’origine de Ruth.
- source_word: כַלָּתָהּ
  choice: sa belle-fille
  rationale: Équivalent français direct et courant du terme de parenté.
- source_word: עִמָּהּ
  choice: accompagnée de
  rationale: Cette formulation française naturelle exprime que Ruth se trouvait avec Noémi, sans alourdir la phrase par une répétition de « avec elle ».
- source_word: הַשָּׁבָה
  choice: qui revenait
  rationale: Le participe féminin singulier renvoie le plus naturellement à Ruth. L’imparfait conserve sa valeur descriptive et le motif répété du retour, même si Ruth n’était pas originaire de Bethléhem.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: des champs de Moab
  rationale: La traduction garde l’image concrète du pluriel de שָׂדֶה, tout en signalant en note son emploi possible au sens plus large de région ou pays.
- source_word: וְהֵמָּה בָּאוּ
  choice: Elles arrivèrent
  rationale: Le pronom indépendant met les deux femmes en relief. « Elles arrivèrent » rend naturellement en français l’aboutissement de leur déplacement.
- source_word: בֵּית לֶחֶם
  choice: Bethléhem
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: בִּתְחִלַּת
  choice: au début de
  rationale: Rend directement et naturellement l’indication temporelle.
- source_word: קְצִיר שְׂעֹרִים
  choice: la moisson de l’orge
  rationale: Rend la chaîne construite comme une période de récolte déterminée; le singulier collectif « l’orge » est idiomatique en français.
theological_decisions:
- issue: Le sujet du participe féminin הַשָּׁבָה et le retour de Ruth
  choice: « qui revenait », rapporté à Ruth
  alternative: Rapporter le retour seulement à Noémi ou lisser par « qui l’accompagnait depuis Moab »
  rationale: L’accord féminin singulier et sa place après la mention de Ruth favorisent clairement Ruth comme antécédent. La traduction conserve ainsi la formulation notable selon laquelle Ruth « revenait », sans résoudre la tension créée par le fait qu’elle n’avait pas auparavant habité Bethléhem.
translation_notes:
  register: Français international actuel, narratif et digne. La phrase a été légèrement réorganisée pour être naturelle en français, tout en conservant l’origine moabite de Ruth, son lien familial avec Noémi, le motif du retour et l’image hébraïque des « champs de Moab ».
