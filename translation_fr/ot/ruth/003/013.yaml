  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: fr
  text: 'Passe la nuit. Demain matin, s’il veut te racheter[a], c’est bien : qu’il te rachète. Mais s’il ne désire pas te racheter, moi, je te rachèterai, aussi vrai que Yahweh est vivant. Couche-toi jusqu’au matin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « racheter » renvoie à l’action d’un proche parent qui exerce un droit de rachat dans le cadre familial.
    reason: Précise la nuance juridique et familiale de גאל dans le livre de Ruth sans définir de manière excessive les obligations liées à ce rôle.
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: Passe la nuit ici
  rationale: Le verbe לון signifie passer la nuit ou loger. Cette formulation est naturelle en français moderne; « ici » explicite sobrement le lieu indiqué par le contexte.
- source_word: וְהָיָה בַבֹּקֶר
  choice: Demain matin
  rationale: L’expression introduit ce qui se produira au matin suivant. « Demain matin » rend idiomatiquement la succession temporelle.
- source_word: יִגְאָלֵךְ / לְגָאֳלֵךְ / וּגְאַלְתִּיךְ
  choice: te racheter / je te rachèterai
  rationale: Le verbe גאל désigne ici l’intervention juridique d’un proche ayant droit de rachat. « Racheter » conserve le terme clé et sa portée thématique, tandis qu’une note précise son sens familial.
- source_word: טוֹב
  choice: très bien
  rationale: טוֹב est employé elliptiquement pour approuver cette éventualité. « Très bien » restitue naturellement cette valeur sans alourdir la phrase.
- source_word: לֹא יַחְפֹּץ
  choice: ne désire pas
  rationale: חפץ exprime le désir ou la volonté. « Ne désire pas » préserve la nuance volitive et le registre digne du passage.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: moi, je te rachèterai
  rationale: Le pronom אָנֹכִי met le sujet en relief. La dislocation « moi, je » rend cette insistance naturelle en français.
- source_word: חַי יְהוָה
  choice: aussi vrai que Yahweh est vivant
  rationale: Il s’agit d’une formule de serment. Cette tournure française en restitue clairement la force, tout en conservant le nom divin.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: Reste couchée jusqu’au matin
  rationale: Dans le contexte immédiat, Ruth est déjà couchée. « Reste couchée » rend donc l’impératif de façon plus naturelle que « Couche-toi ».
theological_decisions:
- issue: Sens juridique et familial de גאל dans Ruth
  choice: Conserver le vocabulaire « racheter » dans le texte principal
  alternative: agir en proche chargé du rachat / exercer le droit de rachat familial
  rationale: Le terme français maintient le motif biblique du rachat sans réduire le mot à une seule obligation juridique. La note signale la fonction particulière du proche parent dans ce contexte.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie le nom divin. La translittération « Yahweh » le distingue d’un titre et préserve sa fonction de nom propre.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct; la brièveté de l’hébreu est conservée sans tournures archaïques. L’ambiguïté exacte des obligations attachées au rôle de proche chargé du rachat n’est pas résolue dans le texte principal.
