  to: 'Elle resta couchée à ses pieds jusqu’au matin, puis elle se leva avant que les gens puissent se reconnaître les uns les autres[a]. Et il dit[b] : « Qu’on ne sache pas que la femme est venue à l’aire de battage. »'
