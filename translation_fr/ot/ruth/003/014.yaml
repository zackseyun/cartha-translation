base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: fr
  text: 'Elle resta couchée à ses pieds jusqu’au matin, puis elle se leva avant que les gens puissent se reconnaître les uns les autres[a]. Et il dit[b] : « Qu’on ne sache pas que la femme est venue à l’aire de battage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avant qu’un homme puisse reconnaître son semblable ». L’expression hébraïque désigne le moment où la lumière était encore trop faible pour que les gens puissent se distinguer les uns les autres.'
    reason: lexical_alternative
  - marker: b
    text: 'D’après le contexte, celui qui parle est très probablement Booz, mais le texte hébreu dit seulement : « Et il dit. »'
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתו
  choice: à ses pieds
  rationale: Le terme désigne l’endroit où se trouvent les pieds ou les jambes de Booz. « À ses pieds » est naturel en français et décrit la position sans préciser davantage ce que le texte laisse implicite.
- source_word: בטרום
  choice: avant que
  rationale: Cette tournure exprime l’antériorité et introduit naturellement en français la proposition temporelle qui suit.
- source_word: יכיר
  choice: puisse reconnaître
  rationale: Le verbe exprime ici la capacité de reconnaître ou de distinguer quelqu’un dans la faible lumière précédant l’aube.
- source_word: איש את רעהו
  choice: un homme puisse reconnaître son prochain
  rationale: Cette formulation conserve le singulier masculin et l’idée littérale de reconnaître son semblable, tout en restant compréhensible en français moderne.
- source_word: אל יוודע
  choice: Il ne faut pas qu’on sache
  rationale: Cette formulation rend l’interdiction ou le souhait énergique de non-divulgation tout en conservant l’idée que la venue ne doit pas devenir connue.
- source_word: האשה
  choice: la femme
  rationale: L’article défini hébreu désigne une femme précise dans la scène, à savoir Ruth, sans que le texte la nomme ici.
- source_word: הגרן
  choice: l’aire de battage
  rationale: Il s’agit du lieu agricole où l’on battait et vannait les céréales; c’est l’équivalent français usuel.
- source_word: ויאמר
  choice: Et il dit
  rationale: Le sujet masculin singulier reste implicite en hébreu. Le contexte indique très probablement Booz, mais la traduction n’ajoute pas son nom.
theological_decisions:
- issue: Identification du locuteur de ויאמר
  choice: « Et il dit », sans nommer Booz dans le texte principal.
  alternative: « Alors Booz dit », pour expliciter le référent probable.
  rationale: Le contexte désigne très probablement Booz, mais l’hébreu laisse le sujet implicite. La traduction préserve cette retenue du texte.
- issue: Portée morale ou sexuelle de la position de Ruth aux pieds de Booz
  choice: Décrire simplement qu’elle resta couchée « à ses pieds ».
  alternative: Employer une paraphrase suggérant des relations sexuelles, ou ajouter une précision destinée à exclure explicitement une telle implication.
  rationale: Le verset indique une position et un moment, sans affirmer ni nier explicitement un acte sexuel. La formulation retenue préserve l’ambiguïté et la tension narratives.
translation_notes:
  register: Français international moderne, sobre et digne. « Elle resta donc couchée » évite la possible ambiguïté de « elle se coucha », qui pourrait suggérer une nouvelle action plutôt que la continuation de la nuit. « Son prochain » conserve la forme masculine singulière de l’expression hébraïque; la note en explique la valeur idiomatique collective.
