base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: fr
  text: 'Alors il dit : « Présente le châle que tu portes et tiens-le ouvert. » Elle le tint donc ouvert, et il mesura six mesures d’orge[a], puis les posa sur elle. Puis il entra dans la ville[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « six orges » ; l’unité de mesure n’est pas précisée.
    reason: lexical_alternative
  - marker: b
    text: 'Certaines versions anciennes et de nombreuses traductions ont : « Puis elle entra dans la ville. » Le texte massorétique a : « Puis il entra dans la ville. »'
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: Présente
  rationale: L’impératif féminin demande à Ruth de tendre ou de présenter le vêtement à Booz. « Présente » s’accorde naturellement avec l’ordre suivant de le tenir ouvert.
- source_word: הַמִּטְפַּחַת
  choice: le châle
  rationale: Le nom désigne ici une pièce d’étoffe portée par Ruth et assez ample pour recevoir de l’orge. « Châle » est naturel en français moderne sans suggérer le voile couvrant le visage.
- source_word: וְאֶחֳזִי בָהּ
  choice: et tiens-le ouvert
  rationale: אחז signifie tenir ou saisir. Le complément « ouvert » explicite sobrement la posture nécessaire pour recevoir le grain, sans ajouter une action étrangère au contexte.
- source_word: וַיָּמָד
  choice: il mesura
  rationale: Le verbe exprime l’action de mesurer une quantité, ici dans le cadre d’un don de grain.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: six mesures d’orge
  rationale: L’hébreu dit littéralement « six orges » sans préciser l’unité. « Mesures » fournit en français le minimum nécessaire tout en maintenant l’indétermination de la quantité exacte.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: qu’il chargea sur elle
  rationale: Le verbe שׁית signifie placer ou poser. Dans la scène, Booz place sur Ruth la charge d’orge contenue dans le châle ; « chargea sur elle » rend clairement cette action physique.
- source_word: וַיָּבֹא הָעִיר
  choice: Puis il entra dans la ville
  rationale: Le texte massorétique porte un verbe masculin singulier et indique donc naturellement Booz comme sujet. La variante féminine est signalée en note.
theological_decisions:
- issue: Sujet de la dernière proposition וַיָּבֹא הָעִיר
  choice: Puis il entra dans la ville
  alternative: Puis elle entra dans la ville
  rationale: Il ne s’agit pas d’une question doctrinale, mais d’une variante textuelle et narrative notable. Le texte massorétique donné emploie le masculin ; la traduction principale le suit, tout en conservant l’autre lecture dans une note.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concrète et accessible. Les ajouts contextuels sont limités à ce qu’exige l’intelligibilité, et l’incertitude sur l’unité ainsi que la variante du sujet final sont explicitement préservées.
