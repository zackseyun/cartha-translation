base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: fr
  text: 'Alors Noémi, sa belle-mère, lui dit : « Ma fille, ne devrais-je pas chercher pour toi un lieu de repos[a], afin que tout aille bien pour toi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du repos », « la sécurité » ou « un foyer ». Dans ce contexte, Noémi cherche pour Ruth une situation stable et favorable, vraisemblablement par le mariage, mais l’hébreu dit littéralement « un lieu de repos ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement la succession narrative en français.
- source_word: נָעֳמִי
  choice: Noémi
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: חֲמוֹתָהּ
  choice: sa belle-mère
  rationale: Le nom avec suffixe féminin singulier précise la relation de Noémi avec Ruth.
- source_word: בִּתִּי
  choice: Ma fille
  rationale: Cette apostrophe affectueuse conserve à la fois la tendresse et le langage familial du texte hébreu.
- source_word: הֲלֹא
  choice: ne devrais-je pas
  rationale: Cette formulation préserve la question rhétorique qui appelle une réponse affirmative.
- source_word: אֲבַקֶּשׁ
  choice: chercher
  rationale: Le verbe בקש signifie couramment « chercher » et laisse ouverte la nature précise de la démarche de Noémi.
- source_word: מָנוֹחַ
  choice: un lieu de repos
  rationale: Le nom peut désigner le repos ou un état et lieu de stabilité. Le contexte évoque vraisemblablement l'établissement par le mariage, sans que le mot hébreu dise explicitement « mari » ou « foyer ».
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: afin que tu sois heureuse
  rationale: Cette tournure française naturelle exprime le bien-être recherché pour Ruth, tout en rendant la valeur bénéfactive de l'expression hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et la métaphore du « lieu de repos » sont conservées, tandis que la dernière proposition est rendue idiomatiquement.
