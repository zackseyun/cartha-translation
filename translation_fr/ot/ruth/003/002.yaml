  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: fr
  text: Et maintenant, Booz n’est-il pas notre parent[a], auprès des jeunes femmes duquel tu es restée[b] ? Voici, ce soir, il vanne l’orge sur l’aire de battage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre connaissance ». Le terme hébreu peut désigner une personne connue ou liée par la parenté ; le contexte favorise ici le sens de parent.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses servantes ». Le terme hébreu peut désigner les jeunes travailleuses ou servantes de Booz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien discursif marqué par וְ et la valeur temporelle de עַתָּה.
- source_word: הֲלֹא
  choice: n’est-il pas
  rationale: Rend la question rhétorique qui attend l’assentiment de Ruth.
- source_word: מֹדַעְתָּנוּ
  choice: notre parent
  rationale: Dans ce contexte, le terme désigne un homme lié à Naomi et Ruth par la parenté ou le clan, plutôt qu’une simple connaissance.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: lui auprès de qui tu as été avec ses jeunes femmes
  rationale: Préserve l’idée que Ruth s’est tenue avec les jeunes femmes rattachées à Booz, sans imposer une condition servile que le terme נַעֲרוֹת ne précise pas nécessairement.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la fonction présentative et l’appel à l’attention du marqueur hébreu dans un registre digne mais actuel.
- source_word: זֹרֶה
  choice: il vanne
  rationale: Le participe décrit l’activité prévue ou en cours ce soir-là; le présent français convient naturellement à cette annonce.
- source_word: גֹּרֶן הַשְּׂעֹרִים
  choice: l’orge sur l’aire de battage
  rationale: 'Rend le sens contextuel de la construction: Booz vanne l’orge, et cette opération se déroule sur l’aire de battage; évite de faire de l’aire elle-même l’objet matériel du vannage.'
- source_word: הַלָּיְלָה
  choice: ce soir
  rationale: Expression temporelle naturelle en français pour l’activité nocturne imminente annoncée par Naomi.
