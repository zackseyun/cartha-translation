base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: fr
  text: 'Booz mangea et but, et il fut de bonne humeur[a]. Puis il alla se coucher au bout du tas de grain. Elle vint sans bruit, découvrit ses pieds[b] et se coucha.


    [a] Littéralement, « son cœur devint bon ». Cette expression hébraïque indique qu’il était joyeux ou de bonne humeur, sans nécessairement signifier qu’il était ivre.


    [b] Littéralement, « découvrit ses pieds ». Certains comprennent qu’il s’agit simplement de ce geste concret ; d’autres y voient de possibles sous-entendus suggestifs. La formulation hébraïque reste toutefois retenue et ne décrit explicitement aucune activité sexuelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « son cœur devint bon ». Cette expression hébraïque indique qu’il était joyeux ou de bonne humeur, sans nécessairement signifier qu’il était ivre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « découvrit ses pieds ». Certains comprennent qu’il s’agit simplement de ce geste concret ; d’autres y voient de possibles sous-entendus suggestifs. La formulation hébraïque reste toutefois retenue et ne décrit explicitement aucune activité sexuelle.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל ... וַיֵּשְׁתְּ
  choice: mangea et but
  rationale: Les deux verbes narratifs sont rendus directement au passé simple, temps naturel du récit soutenu en français.
- source_word: וַיִּיטַב לִבּוֹ
  choice: il fut de bonne humeur
  rationale: Cette tournure française exprime naturellement la joie indiquée par l’idiome hébraïque, sans conclure à l’ivresse. La note conserve son image littérale.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: il alla se coucher
  rationale: Dans la perspective du narrateur, « alla » rend naturellement le mouvement exprimé par בוא. « Se coucher » décrit le fait de s’allonger sans affirmer explicitement qu’il dormait.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: au bout du tas de grain
  rationale: קצה désigne l’extrémité ou le bord, et עֲרֵמָה un tas, ici celui du grain dans le contexte de l’aire de battage.
- source_word: בַלָּט
  choice: sans bruit
  rationale: Cette expression française courante restitue la discrétion de l’approche sans lui attribuer une intention morale plus forte.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: découvrit ses pieds
  rationale: La traduction littérale préserve la formulation sobre de l’hébreu ainsi que son éventuelle ambiguïté.
- source_word: וַתִּשְׁכָּב
  choice: se coucha
  rationale: Rendu direct du verbe « se coucher, s’allonger » ; aucune activité sexuelle n’est ajoutée au texte.
theological_decisions:
- issue: La possibilité de sous-entendus sexuels dans les gestes de Ruth
  choice: Conserver dans le texte principal la description littérale et sobre des gestes.
  alternative: Employer une formulation interprétative suggérant une séduction ou un contact sexuel.
  rationale: Le verset dit que Ruth s’approche discrètement, découvre les pieds de Booz et se couche. Il ne décrit explicitement aucune activité sexuelle ; traduire littéralement préserve donc la tension et l’ambiguïté du récit.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Sans bruit » est plus idiomatique que « secrètement », tandis que « ses pieds » maintient délibérément la retenue et l’ambiguïté de l’hébreu.
