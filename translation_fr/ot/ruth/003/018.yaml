base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: fr
  text: 'Alors elle dit : « Attends, ma fille, jusqu’à ce que tu saches comment l’affaire tournera[a], car l’homme[b] ne se reposera pas avant d’avoir achevé l’affaire aujourd’hui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comment une affaire tombera » ; c’est-à-dire : « comment l’affaire tournera » ou « se terminera ».'
    reason: lexical_alternative
  - marker: b
    text: « L’homme » renvoie à Booz dans le contexte, bien que l’hébreu ne le nomme pas ici.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁבִי
  choice: Attends
  rationale: L’impératif signifie littéralement « assieds-toi » ou « reste », mais, dans ce contexte, Noémi demande à Ruth de rester dans l’attente du dénouement. « Attends » en exprime naturellement la portée pragmatique.
- source_word: בִתִּי
  choice: ma fille
  rationale: Conserve l’adresse affectueuse de Noémi et le possessif explicite de l’hébreu.
- source_word: תֵּדְעִין
  choice: tu saches
  rationale: 'Le verbe ידע désigne ici l’acquisition future d’une connaissance : Ruth saura bientôt quel sera le dénouement.'
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: quelle tournure prendra l’affaire
  rationale: Cette formulation française rend naturellement l’idée du résultat à venir. Une note conserve la métaphore hébraïque, littéralement « comment l’affaire tombera ».
- source_word: הָאִישׁ
  choice: cet homme
  rationale: L’hébreu dit « l’homme » et renvoie contextuellement à Booz sans le nommer. En français, le démonstratif identifie naturellement l’homme dont il vient d’être question tout en évitant d’ajouter son nom.
- source_word: יִשְׁקֹט
  choice: ne se reposera pas
  rationale: Le verbe évoque le fait de rester tranquille ou en repos. Ici, il souligne que l’homme poursuivra résolument ses démarches.
- source_word: כִּי אִם כִּלָּה
  choice: avant d’avoir mené … à son terme
  rationale: La construction exprime que l’homme ne se reposera qu’une fois l’affaire achevée. Cette tournure française restitue clairement la relation temporelle et exceptive.
- source_word: הַדָּבָר
  choice: l’affaire
  rationale: דבר désigne ici la question concrète du rachat et de l’union envisagée. « L’affaire » reste assez large tout en convenant à ce contexte social et juridique.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’indication temporelle et l’urgence affirmée par Noémi.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue conserve l’affection de Noémi, l’attente du dénouement et la détermination attribuée à Booz, sans expliciter davantage la question juridique et familiale sous-entendue par le contexte.
