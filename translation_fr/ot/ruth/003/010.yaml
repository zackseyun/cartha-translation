  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: fr
  text: 'Il dit : « Que Yahweh te bénisse, ma fille ! La bonté[a] dont tu fais preuve maintenant est plus grande encore que la première, puisque tu n’as pas recherché les jeunes hommes, qu’ils soient pauvres ou riches. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi évoquer la fidélité, l’amour fidèle ou la loyauté.
    reason: Alternative lexicale pour חֶסֶד, dont la portée relationnelle est plus riche que le seul mot « bonté ».
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: Que Yahweh te bénisse
  rationale: La formule prédicative a ici une valeur de bénédiction. Cette tournure restitue naturellement en français son élan optatif tout en conservant le nom divin.
- source_word: בִּתִּי
  choice: ma fille
  rationale: Cette adresse affectueuse préserve la métaphore familiale ainsi que la différence d’âge et de position sociale entre Booz et Ruth.
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: La bonté dont tu fais preuve maintenant est plus grande encore que la première
  rationale: La formulation française exprime clairement la comparaison entre l’acte présent de Ruth et sa bonté antérieure, sans préciser au-delà du texte l’objet exact de la première bonté.
- source_word: חַסְדֵּךְ
  choice: la bonté dont tu fais preuve
  rationale: חֶסֶד désigne ici une bonté généreuse marquée par la loyauté relationnelle. « Bonté » convient au récit, tandis qu’une note conserve les autres nuances possibles.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: puisque tu n’as pas recherché
  rationale: La construction infinitive explique en quoi la bonté présente est supérieure. « Rechercher » rend le mouvement vers des partenaires possibles sans expliciter abusivement un projet de mariage.
- source_word: הַבַּחוּרִים
  choice: les jeunes hommes
  rationale: Le terme désigne de jeunes hommes susceptibles de constituer des partis; la traduction reste directe et n’impose pas une comparaison explicite avec l’âge de Booz.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: qu’ils soient pauvres ou riches
  rationale: Cette formule naturelle rend le mérisme qui englobe les différentes situations économiques possibles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
theological_decisions:
- issue: Sens de חֶסֶד dans l’éloge adressé à Ruth
  choice: bonté
  alternative: fidélité, amour fidèle, loyauté
  rationale: Le contexte met en avant un acte concret de générosité loyale envers la famille de Noémi. « Bonté » demeure lisible et naturel sans effacer les nuances relationnelles, signalées en note.
- issue: Identification précise de la « première » bonté
  choice: ne pas l’expliciter
  alternative: la fidélité de Ruth envers Noémi
  rationale: Le contexte peut suggérer la fidélité antérieure de Ruth envers Noémi, mais le verset ne nomme pas directement cet acte; la traduction préserve donc cette ouverture.
- issue: Portée de l’expression « aller après les jeunes hommes »
  choice: rechercher les jeunes hommes
  alternative: chercher à épouser les jeunes hommes
  rationale: Le contexte matrimonial rend l’idée d’un parti probable, mais le texte emploie une expression plus générale. La traduction ne transforme donc pas cette implication en affirmation explicite.
- issue: Rendu de יְהוָה
  choice: Yahweh
  alternative: le Seigneur, Jéhovah
  rationale: Le texte hébreu emploie directement le nom divin; sa translittération préserve sa fonction de nom propre.
translation_notes:
  register: Français international moderne, naturel et digne. La bénédiction est formulée de manière idiomatique; la comparaison est clarifiée sans identifier explicitement la première bonté ni réduire l’expression concernant les jeunes hommes à une demande en mariage.
