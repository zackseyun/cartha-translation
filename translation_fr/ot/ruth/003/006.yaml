base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/006.yaml
  text: So she went down to the threshing floor and did according to all that her mother-in-law had commanded her[a].
translation:
  language: fr
  text: Elle descendit donc à l’aire de battage et fit tout ce que sa belle-mère lui avait ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: Elle descendit donc
  rationale: Le verbe ירד exprime un mouvement vers le bas. « Descendit » en conserve le sens directionnel, tandis que « donc » rend ici l’enchaînement narratif du waw avec les instructions précédentes.
- source_word: הַגֹּרֶן
  choice: à l’aire de battage
  rationale: גֹּרֶן désigne l’aire où l’on battait et vannait les céréales. L’article défini hébreu est rendu par « l’ ».
- source_word: וַתַּעַשׂ
  choice: et fit
  rationale: עשה est le verbe général « faire ». Dans cette construction, « fit tout ce que » est naturel en français et exprime fidèlement l’exécution des consignes.
- source_word: כְּכֹל אֲשֶׁר
  choice: tout ce que
  rationale: La construction marque une conformité complète aux instructions reçues. En français, « fit tout ce que… lui avait ordonné » communique naturellement cette totalité sans calque pesant.
- source_word: צִוַּתָּה
  choice: lui avait ordonné
  rationale: צוה signifie couramment « ordonner, commander ». Le plus-que-parfait situe l’ordre avant son exécution et le pronom « lui » explicite naturellement la relation en français.
- source_word: חֲמוֹתָהּ
  choice: sa belle-mère
  rationale: חֲמוֹת désigne précisément la belle-mère; le suffixe possessif féminin est rendu par « sa ».
