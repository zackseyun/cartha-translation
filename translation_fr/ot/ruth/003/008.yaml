  text: וַ/יְהִי֙ בַּ/חֲצִ֣י הַ/לַּ֔יְלָה וַ/יֶּחֱרַ֥ד הָ/אִ֖ישׁ וַ/יִּלָּפֵ֑ת וְ/הִנֵּ֣ה אִשָּׁ֔ה שֹׁכֶ֖בֶת מַרְגְּלֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: fr
  text: 'Il arriva qu’au milieu de la nuit, l’homme tressaillit et se retourna[a] : voici qu’une femme était couchée à ses pieds[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est rare; il peut évoquer le fait de se retourner, de se contorsionner ou de se pencher sous l’effet de la surprise.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à l’endroit de ses pieds »; l’expression hébraïque peut désigner plus largement la zone des pieds ou du bas des jambes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette tournure rend la progression narrative du wayyiqtol de היה dans un français digne et compréhensible, sans recourir à l’archaïque « il advint ».
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: au milieu de la nuit
  rationale: Le syntagme désigne littéralement le milieu de la nuit. Ce choix naturel conserve cette image temporelle sans imposer l’idée plus précise de minuit à l’horloge.
- source_word: וַיֶּחֱרַד
  choice: tressaillit
  rationale: חרד décrit une réaction corporelle soudaine pouvant relever de la peur, du choc ou du réveil brusque. « Tressaillit » préserve cette réaction sans en préciser excessivement la cause.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: איש désigne ici Booz en tant qu’homme; la traduction simple reprend la formulation du récit sans ajouter son nom.
- source_word: וַיִּלָּפֵת
  choice: se retourna
  rationale: Le verbe est rare et son mouvement exact reste incertain. « Se retourna » convient à la scène tout en laissant une note signaler les autres nuances possibles.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: הנה marque la découverte soudaine et la surprise. « Voici que » en conserve la vivacité narrative dans un registre soutenu mais actuel.
- source_word: אִשָּׁה
  choice: une femme
  rationale: אשה signifie ici « femme », et non « épouse ».
- source_word: שֹׁכֶבֶת
  choice: était couchée
  rationale: Le participe présente la femme dans la position où l’homme la découvre; l’imparfait rend naturellement cet état en cours.
- source_word: מַרְגְּלֹתָיו
  choice: à ses pieds
  rationale: Cette expression peut désigner les pieds eux-mêmes ou l’espace situé vers les pieds et le bas des jambes. « À ses pieds » est la formulation française la plus naturelle sans expliciter davantage que l’hébreu.
theological_decisions:
- issue: Risque de surinterprétation sexuelle ou euphémistique de la scène
  choice: Décrire simplement la femme couchée aux pieds de l’homme.
  alternative: Employer une expression telle que « du côté de ses pieds » ou « près du bas de ses jambes » afin de mettre en avant une possible insinuation.
  rationale: L’hébreu ne décrit explicitement aucun acte sexuel. La traduction conserve donc la tension du récit sans lui imposer un jugement moral ou une interprétation sexuelle; la note indique seulement l’étendue sémantique possible du terme de lieu.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite l’archaïsme tout en gardant la soudaineté de la scène. « Voici que » conserve la force de découverte de הנה, et les notes maintiennent les deux ambiguïtés lexicales réelles sans surcharger le verset.
