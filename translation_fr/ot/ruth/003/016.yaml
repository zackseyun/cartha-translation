base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: fr
  text: 'Quand elle arriva chez sa belle-mère[a], celle-ci lui demanda : « Qui es-tu, ma fille ? » Ruth lui raconta alors tout ce que l’homme avait fait pour elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus interprétative : « Comment cela s’est-il passé pour toi, ma fille ? » L’hébreu dit littéralement : « Qui es-tu, ma fille ? » La question peut porter sur l’issue de la rencontre de Ruth ou sur son éventuel changement de statut.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא אֶל חֲמוֹתָהּ
  choice: Quand elle arriva chez sa belle-mère
  rationale: Le wayyiqtol fait progresser le récit. « Quand » relie naturellement l’arrivée de Ruth à la question de Noémi, tandis que « chez » convient idiomatiquement à l’arrivée auprès de sa belle-mère.
- source_word: וַתֹּאמֶר
  choice: celle-ci lui demanda
  rationale: Le verbe hébreu signifie littéralement « elle dit », mais la phrase prononcée est une question. « Celle-ci » identifie clairement Noémi sans répéter son nom, absent de l’hébreu.
- source_word: מִי אַתְּ
  choice: Qui es-tu
  rationale: Cette traduction conserve le sens lexical direct et l’étrangeté significative de l’hébreu. Le contexte peut suggérer une question sur l’issue de la rencontre ou le nouveau statut de Ruth, possibilité signalée en note plutôt qu’imposée au texte.
- source_word: בִּתִּי
  choice: ma fille
  rationale: Cette expression préserve à la fois la forme littérale et la tendresse de l’adresse familiale de Noémi.
- source_word: וַתַּגֶּד לָהּ
  choice: Ruth lui raconta alors
  rationale: Le hiphil de נגד signifie annoncer, rapporter ou raconter. Le nom « Ruth » clarifie le changement de sujet naturel en français, et « alors » marque la succession narrative.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לָהּ הָאִישׁ
  choice: tout ce que l’homme avait fait pour elle
  rationale: « Tout ce que » rend l’étendue complète du rapport. Le plus-que-parfait situe les actes avant le récit qu’en fait Ruth. « Pour elle » exprime ici la valeur bénéfactive probable de לָהּ, et « l’homme » conserve la désignation hébraïque sans introduire le nom de Booz.
theological_decisions:
- issue: Portée de la question מִי אַתְּ
  choice: Conserver « Qui es-tu ? » dans le texte principal et expliquer l’implication contextuelle en note.
  alternative: Traduire directement « Comment cela s’est-il passé pour toi ? » ou « Qu’en est-il de toi maintenant ? »
  rationale: Le texte peut évoquer l’issue de la rencontre et un possible changement de statut, mais il ne l’explicite pas. La formulation littérale préserve cette ambiguïté narrative et évite de fixer une interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation maintient l’étrangeté voulue de la question hébraïque, tout en clarifiant les sujets par « celle-ci » et « Ruth » afin d’éviter une ambiguïté pronominale peu naturelle en français.
