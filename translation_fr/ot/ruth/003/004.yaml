base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: fr
  text: Quand il se couchera, repère l’endroit où il se couchera. Puis va, découvre ses pieds[a] et couche-toi[b]. Il te dira ce que tu devras faire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « découvre l’endroit à ses pieds ». Le terme hébreu peut désigner les pieds ou la zone située à leur niveau.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu écrit porte « et je me coucherai », mais la lecture traditionnelle et le contexte comprennent « et couche-toi ».
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: Quand il se couchera
  rationale: La construction introduit temporellement l’étape suivante. Le futur convient à une consigne portant sur une action à venir.
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: repère l’endroit
  rationale: ידע a ici le sens pratique d’observer et d’identifier précisément le lieu; « repère » est naturel et concis.
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: où il se couche
  rationale: La relative identifie le lieu où Booz s’étendra; le « là » hébreu serait redondant en français.
- source_word: וּבָאת
  choice: Puis va
  rationale: בוא peut se rendre par « venir » ou « aller » selon le point de vue. Dans la bouche de Noémi donnant une consigne à Ruth, « va » est idiomatique; « puis » marque la succession.
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: découvre ses pieds
  rationale: גלה signifie « découvrir ». מַרְגְּלוֹת peut viser les pieds ou la zone à leur niveau; la traduction principale retient le sens usuel et une note conserve l’extension possible.
- source_word: וְשָׁכַבְתִּי / וְשָׁכַבְתְּ
  choice: et couche-toi
  rationale: Le texte écrit porte une forme comprise comme « je me coucherai », tandis que la lecture traditionnelle et le contexte donnent la deuxième personne féminine, cohérente avec les consignes adressées à Ruth.
- source_word: וְהוּא יַגִּיד לָךְ
  choice: Lui, il te dira
  rationale: Le pronom explicite הוּא reçoit une légère mise en relief naturelle en français; נגד au hiphil signifie ici « dire, indiquer ».
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: ce que tu devras faire
  rationale: La formulation exprime l’action que Booz indiquera à Ruth. « Tu devras faire » restitue naturellement la portée directive sans préciser davantage son contenu.
theological_decisions:
- issue: Ambiguïté potentiellement sexuelle de l’ordre de découvrir les pieds de Booz et de se coucher
  choice: Conserver les gestes concrets sans les qualifier ni les expliquer dans le texte principal.
  alternative: Interpréter explicitement le geste soit comme une avance sexuelle, soit comme un simple moyen de réveiller Booz.
  rationale: L’hébreu laisse subsister une tension narrative. Une traduction ne doit imposer ni une lecture sexuelle ni une lecture entièrement innocente.
translation_notes:
  register: Français international actuel, clair et digne. Le tutoiement correspond au discours familial de Noémi à Ruth. « Couche-toi » conserve la simplicité et l’ambiguïté de l’hébreu sans ajout interprétatif.
