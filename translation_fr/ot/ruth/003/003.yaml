base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: fr
  text: Lave-toi[a], enduis-toi d’huile, mets ton manteau[b], puis descends à l’aire de battage[c]. Ne te fais pas connaître de l’homme avant qu’il ait fini de manger et de boire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Baigne-toi ». Le verbe hébreu peut désigner le fait de se laver ou de prendre un bain.
    reason: lexical_alternative
  - marker: b
    text: Ou « mets ton vêtement ». Le mot hébreu désigne généralement un vêtement, notamment un vêtement extérieur ou un manteau. Certaines traductions précisent « tes plus beaux vêtements », mais cette idée n’est pas explicite dans le texte.
    reason: lexical_alternative
  - marker: c
    text: 'La forme consonantique hébraïque est inhabituelle ici. D’après le contexte, elle est généralement comprise comme la suite des instructions de Noémi à Ruth : « descends à l’aire de battage ».'
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: Lave-toi
  rationale: Le verbe רחץ peut désigner le fait de se laver ou de se baigner. « Lave-toi » est naturel, conserve la valeur réfléchie du contexte et n’impose pas l’idée d’un bain complet.
- source_word: וָסַכְתְּ
  choice: parfume-toi d’huile
  rationale: סוך désigne l’application d’huile ou d’onguent sur le corps. Cette formulation rend l’action plus clairement que le seul verbe « oins-toi », peu usuel en français courant, sans réduire nécessairement l’huile à un parfum moderne.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: mets ton manteau
  rationale: שִׂמְלָה désigne généralement un vêtement, souvent un vêtement extérieur ou manteau. La traduction évite d’ajouter l’idée de « plus beaux vêtements », absente de l’hébreu.
- source_word: וירדתי הַגֹּרֶן
  choice: puis descends à l’aire de battage
  rationale: Malgré la forme consonantique inhabituelle, le contexte appelle une instruction à Ruth à la deuxième personne du féminin singulier. « Aire de battage » est le terme français usuel pour גֹּרֶן.
- source_word: אַל תִּוָּדְעִי
  choice: Ne te fais pas connaître
  rationale: La forme niphal de ידע a ici une valeur passive ou réfléchie. La formulation conserve l’idiome hébreu et la responsabilité de Ruth de ne pas signaler sa présence.
- source_word: לָאִישׁ
  choice: de cet homme
  rationale: Le syntagme désigne l’homme précis dont il est question, Boaz, sans le nommer. « Cet homme » est plus naturel en français que « l’homme » tout en préservant la référence explicite au personnage.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: avant qu’il ait fini de manger et de boire
  rationale: כלה suivi des infinitifs exprime l’achèvement. Avec l’interdiction française, « avant qu’il ait fini » rend naturellement la limite temporelle introduite par עַד.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs au tutoiement correspondent à l’adresse de Noémi à Ruth. « Parfume-toi d’huile » explicite une pratique ancienne sans employer le peu naturel « oins-toi ». Les notes conservent l’ambiguïté lexicale de רחץ et שִׂמְלָה ainsi que la difficulté textuelle de וירדתי.
