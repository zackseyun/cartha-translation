  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: fr
  text: Et maintenant, ma fille, n’aie pas peur. Tout ce que tu diras, je le ferai pour toi, car tous les membres de mon peuple savent que tu es une femme de valeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute la porte de mon peuple ». La porte de la ville était le lieu public où l’on se réunissait et où se traitaient les affaires juridiques et civiques. On pourrait aussi traduire « une femme remarquable », « une femme vaillante » ou « une femme de noble caractère ».'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: ma fille
  rationale: Conserve l’appellation familiale littérale, qui exprime ici la bienveillance protectrice de Booz sans impliquer nécessairement une filiation biologique.
- source_word: אַל תִּירְאִי
  choice: n’aie pas peur
  rationale: Rend naturellement en français moderne la défense accompagnée d’un encouragement.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: Tout ce que tu diras, je le ferai pour toi
  rationale: Préserve le verbe « dire » et l’ampleur de la promesse, sans le réduire explicitement à une demande.
- source_word: כָּל שַׁעַר עַמִּי
  choice: tous ceux qui se réunissent à la porte de ma ville
  rationale: Explicite avec naturel la métonymie hébraïque de la porte comme lieu public où se rassemble la communauté, tout en conservant l’image culturelle.
- source_word: אֵשֶׁת חַיִל
  choice: une femme de valeur
  rationale: 'Expression française concise qui conserve la richesse de חַיִל : valeur, force, compétence, excellence et intégrité.'
theological_decisions:
- issue: Portée de la qualification אֵשֶׁת חַיִל
  choice: une femme de valeur
  alternative: une femme remarquable ; une femme vaillante ; une femme de noble caractère
  rationale: Le choix ne réduit pas l’éloge à la seule moralité ni à une nuance guerrière. Il laisse entendre la valeur reconnue, la force de caractère, la compétence et l’intégrité de Ruth, en écho à l’emploi de la même expression en Proverbes 31.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’adresse personnelle et protectrice de Booz. La formulation garde l’image de la porte tout en rendant intelligible sa valeur métonymique.
