  naturalness: Le français est naturel, moderne et d’un registre approprié. « Tous les membres de mon peuple » rend clairement la portée collective de l’expression hébraïque sans conserver une tournure française artificielle telle que « toute la porte de mon peuple ».
  terminology: '« Femme de valeur » est un bon équivalent de אֵשֶׁת־חַיִל : il évoque dignité, capacité, force et intégrité sans réduire l’expression à une seule qualité. La note conserve utilement des options lexicales.'
