source:
  edition: WLC
  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: fr
  text: Et maintenant, il est bien vrai que je suis un parent habilité à exercer le droit de rachat[a]. Mais il y a aussi un parent plus proche que moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne un proche parent auquel incombent, dans certaines situations, des responsabilités familiales de rachat.
    reason: lexical_alternative
  - marker: b
    text: « Plus proche » désigne ici un degré de parenté plus étroit, et non une proximité physique; ce parent a donc priorité pour exercer le droit de rachat.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit naturellement le point suivant du discours de Booz; en français, « Maintenant » rend la transition sans alourdir la phrase.
- source_word: כִּי אָמְנָם כִּי אִם
  choice: il est bien vrai que
  rationale: Rend l’affirmation concessive et appuyée de l’expression hébraïque tout en restant idiomatique.
- source_word: גֹאֵל
  choice: un proche parent ayant droit de rachat
  rationale: Le terme désigne ici un membre de la parenté investi de droits et de responsabilités de rachat familial. Cette formulation explicite le cadre juridique sans lui donner un sens spirituel abstrait.
- source_word: אָנֹכִי
  choice: je suis
  rationale: Conserve l’affirmation personnelle explicite et légèrement emphatique du pronom hébreu.
- source_word: וְגַם יֵשׁ
  choice: Toutefois, il y a aussi
  rationale: Préserve à la fois l’ajout exprimé par גַם et la nuance restrictive que ce fait apporte à la déclaration précédente.
- source_word: גֹאֵל קָרוֹב מִמֶּנִּי
  choice: un parent plus proche que moi
  rationale: Conserve l’image de la proximité tout en laissant la note préciser qu’il s’agit du degré de parenté et de la priorité juridique correspondante.
theological_decisions:
- issue: Sens de גֹאֵל dans le cadre familial et juridique du récit
  choice: proche parent ayant droit de rachat
  alternative: rédempteur; parent-rédempteur; protecteur familial
  rationale: Le contexte concerne les responsabilités reconnues d’un parent envers la famille. La formulation choisie évite de réduire le terme à la rédemption spirituelle ou d’introduire un titre français artificiel, tout en conservant sa portée juridique.
- issue: Nature de la proximité du second גֹאֵל
  choice: plus proche que moi, avec précision en note
  alternative: ayant priorité sur moi
  rationale: Le texte hébreu parle littéralement de proximité. La traduction la conserve afin de ne pas remplacer l’image par son seul effet juridique; la note explique l’enjeu familial.
translation_notes:
  register: Français international moderne, clair et digne. « Droit de rachat » maintient le cadre familial et juridique ancien; les notes apportent l’explication culturelle nécessaire sans surcharger le verset.
