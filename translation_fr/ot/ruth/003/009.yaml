base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: fr
  text: 'Il dit : « Qui es-tu ? » Elle répondit : « Je suis Ruth, ta servante. Étends ton aile sur ta servante[a], car tu es un rédempteur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Étends le pan de ton vêtement sur ta servante. » Le mot hébreu peut désigner une aile ou le bord d’un vêtement; la formulation peut évoquer à la fois la protection et une demande d’engagement matrimonial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un parent-rédempteur », c’est-à-dire un proche parent ayant la responsabilité reconnue d’intervenir en faveur d’un membre de sa famille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: ta servante
  rationale: Le nom אמה désigne une servante ou esclave. « Ta servante » est naturel en français moderne, conserve l’humble manière dont Ruth se présente et permet de maintenir la répétition de l’hébreu.
- source_word: וּפָרַשְׂתָּ
  choice: Étends
  rationale: Le verbe פרשׂ exprime ici l’action d’étendre quelque chose au-dessus de quelqu’un. « Étends » convient naturellement à l’image de l’aile et reste compatible avec le sens vestimentaire possible.
- source_word: כְנָפֶךָ
  choice: ton aile
  rationale: כנף signifie « aile » et peut aussi désigner le pan ou l’extrémité d’un vêtement. Le texte principal conserve l’image littérale et sa résonance protectrice, tandis qu’une note signale le sens vestimentaire et matrimonial possible.
- source_word: עַל
  choice: sur
  rationale: « Sur » est l’équivalent français naturel dans cette image de couverture et de protection.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de la demande de Ruth. « Car » est concis, clair et digne dans ce dialogue.
- source_word: גֹאֵל
  choice: un rédempteur
  rationale: גֹאֵל désigne celui qui exerce au sein de la parenté un rôle reconnu de rachat et de restauration. « Rédempteur » conserve le terme clé et sa portée théologique; la note précise sa dimension familiale et juridique.
- source_word: אָנֹכִי רוּת
  choice: Je suis Ruth
  rationale: La proposition nominale hébraïque s’exprime naturellement en français par « Je suis Ruth ».
- source_word: מִי אָתּ
  choice: Qui es-tu ?
  rationale: Traduction directe et naturelle de la question d’identité, sans ajout interprétatif.
theological_decisions:
- issue: Portée métaphorique de « ton aile » dans la demande de Ruth
  choice: Conserver « ton aile » dans le texte principal, sans expliciter l’implication matrimoniale.
  alternative: « le pan de ton vêtement »
  rationale: L’hébreu peut faire résonner à la fois le vêtement présent dans la scène, la protection figurée par l’aile et une demande d’engagement matrimonial. Garder « aile » préserve cette richesse et cette tension sans les résoudre artificiellement.
- issue: Traduction de גֹאֵל
  choice: Employer « rédempteur » dans le texte principal et expliquer en note le rôle familial.
  alternative: « proche parent ayant droit de rachat » ou « parent-rédempteur »
  rationale: Le mot hébreu réunit des dimensions familiales, juridiques et restauratrices qu’aucune expression française brève ne restitue entièrement. « Rédempteur » maintient le terme central, tandis que la note donne le contexte social nécessaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue direct et à la morphologie hébraïque. La répétition de « ta servante » est conservée. Les images et les termes théologiquement chargés restent dans le texte principal, avec les précisions lexicales en notes.
