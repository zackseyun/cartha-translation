base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: fr
  text: 'Elle dit : « Il m’a donné ces six mesures d’orge[a], car il a dit : “Ne retourne pas les mains vides auprès de ta belle-mère.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « ces six orges ». L’unité de mesure n’est pas précisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le wayyiqtol narratif introduit les paroles de Ruth. En français, « Elle dit » est naturel sans rendre systématiquement la conjonction וַ par « Et ».
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: ces six mesures d’orge
  rationale: Le texte hébreu dit littéralement « ces six orges », sans préciser l’unité. « Mesures » est ajouté pour produire un français intelligible, tout en signalant cet ajout dans une note.
- source_word: נָתַן לִי
  choice: Il m’a donné
  rationale: Le parfait qal à la 3e personne du masculin singulier, avec suffixe objet de 1re personne, se rend naturellement ici par le passé composé.
- source_word: כִּי אָמַר
  choice: car il a dit
  rationale: כִּי introduit l’explication du don. « Car » conserve clairement ce lien causal, et le passé composé convient au discours rapporté.
- source_word: אַל תָּבוֹאִי רֵיקָם
  choice: Ne retourne pas les mains vides
  rationale: בוא exprime ici le déplacement de Ruth vers Noémi. « Retourner » explicite naturellement le contexte, tandis que « les mains vides » rend l’emploi adverbial idiomatique de רֵיקָם.
- source_word: אֶל חֲמוֹתֵךְ
  choice: auprès de ta belle-mère
  rationale: חֲמוֹת désigne la belle-mère. Avec le verbe « retourner », « auprès de » exprime naturellement la destination vers la personne.
theological_decisions: []
