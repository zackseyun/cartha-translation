  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle répondit
  rationale: Le wayyiqtol de אמר fait avancer le récit. Dans cet échange, « répondit » rend naturellement le fait que Ruth réagit aux instructions de Noémi, sans modifier le contenu de ses paroles.
- source_word: אֵלֶיהָ
  choice: lui
  rationale: La préposition אֶל avec suffixe féminin singulier indique que Ruth adresse sa réponse à Noémi. Le pronom « lui » est naturel en français moderne.
- source_word: כֹּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette expression rend la totalité introduite par une proposition relative et suit de près la structure hébraïque dans un français idiomatique.
- source_word: תֹּאמְרִי
  choice: tu me diras
  rationale: L’imparfait hébreu à la deuxième personne du féminin singulier peut ici viser les instructions que Noémi donnera. « Tu me diras » exprime naturellement cette orientation future; « me » explicite le destinataire impliqué par le contexte.
- source_word: אֶעֱשֶׂה
  choice: je ferai
  rationale: L’imparfait à la première personne exprime la résolution de Ruth. Le futur simple français rend clairement son engagement.
