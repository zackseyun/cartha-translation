source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שְׁאַל נָ֧א אֶת הַ/כֹּהֲנִ֛ים תּוֹרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/011.yaml
  text: 'Thus says Yahweh of hosts: Ask the priests for a ruling[a], saying,'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : « Demande aux prêtres une décision[a] en leur disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une instruction » ou « au sujet de la loi ». Ici, le mot hébreu torah désigne probablement une décision ou une instruction sacerdotale, et pas nécessairement la Torah en tant que livre.
    reason: alternative lexicale et précision contextuelle
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle et digne en français ; le présent convient à la formule de messager malgré l’accompli hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin, conformément à sa présence explicite dans le texte hébreu.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend le sens concret et ample de צְבָאוֹת sans préciser indûment s’il s’agit d’armées célestes ou terrestres.
- source_word: שְׁאַל נָא
  choice: Demande
  rationale: L’impératif exprime simplement l’ordre ; la nuance d’atténuation de נָא est absorbée naturellement en français.
- source_word: אֶת הַכֹּהֲנִים
  choice: aux prêtres
  rationale: Le verbe français « demander » exige ici la préposition « à » devant les personnes consultées.
- source_word: תּוֹרָה
  choice: une décision
  rationale: Dans ce contexte, le terme désigne vraisemblablement une instruction ou décision sacerdotale portant sur un cas rituel, plutôt que la Torah envisagée comme livre.
- source_word: לֵאמֹר
  choice: en leur disant
  rationale: Introduit naturellement en français le contenu de la question qui suit au verset suivant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée de תּוֹרָה
  choice: une décision sacerdotale
  alternative: la Loi / une instruction
  rationale: Les versets suivants présentent une consultation des prêtres sur un cas rituel. La traduction fonctionnelle évite d’identifier automatiquement le mot au corpus écrit tout en signalant les autres possibilités en note.
translation_notes:
  register: Français international moderne, avec une formule prophétique solennelle mais courante. Les guillemets ouvrent la parole divine qui se poursuit au verset suivant.
