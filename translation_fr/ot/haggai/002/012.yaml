source:
  edition: WLC
  text: הֵ֣ן יִשָּׂא אִ֨ישׁ בְּשַׂר קֹ֜דֶשׁ בִּ/כְנַ֣ף בִּגְד֗/וֹ וְ/נָגַ֣ע בִּ֠/כְנָפ/וֹ אֶל הַ/לֶּ֨חֶם וְ/אֶל הַ/נָּזִ֜יד וְ/אֶל הַ/יַּ֧יִן וְ/אֶל שֶׁ֛מֶן וְ/אֶל כָּל מַאֲכָ֖ל הֲ/יִקְדָּ֑שׁ וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ לֹֽא׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/012.yaml
  text: Suppose a man carries holy meat in the fold of his garment[a], and with his fold touches bread, stew, wine, oil, or any food—does it become holy? And the priests answered and said[b], “No.”
translation:
  language: fr
  text: 'Supposons qu’un homme porte de la viande consacrée[a] dans le pan de son vêtement[b] et que, avec ce pan, il touche du pain, un plat mijoté, du vin, de l’huile ou n’importe quel aliment : ces aliments deviendront-ils consacrés ? Les prêtres répondirent : « Non. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la chair sainte ».'
    reason: Signale la formulation hébraïque et préserve la possibilité de rendre קֹדֶשׁ par « sainte » plutôt que par « consacrée ».
  - marker: b
    text: 'Ou : « dans le coin de son vêtement » ou « dans le bord de son vêtement ».'
    reason: Indique l’étendue sémantique de כָּנָף, dont « pan » est ici une traduction contextuelle.
lexical_decisions:
- source_word: הֵן
  choice: Supposons que
  rationale: Introduit naturellement en français moderne le cas hypothétique soumis aux prêtres.
- source_word: יִשָּׂא אִישׁ
  choice: un homme porte
  rationale: Conserve le singulier masculin du texte hébreu et rend נשׂא par un verbe courant adapté au contexte.
- source_word: בְּשַׂר קֹדֶשׁ
  choice: de la viande consacrée
  rationale: Désigne la viande sacrificielle mise à part comme sainte. « Consacrée » exprime clairement ici le sens cultuel de קֹדֶשׁ.
- source_word: בִּכְנַף בִּגְדוֹ
  choice: dans le pan de son vêtement
  rationale: כָּנָף désigne le bord, le coin ou le pan du vêtement; « pan » évoque naturellement la partie servant à porter la viande.
- source_word: וְנָגַע בִּכְנָפוֹ
  choice: et que, avec ce pan, il touche
  rationale: Rend explicite le contact indirect effectué au moyen du pan du vêtement, sans attribuer le contact directement à la viande.
- source_word: לֶחֶם
  choice: du pain
  rationale: Équivalent français usuel.
- source_word: נָזִיד
  choice: un plat mijoté
  rationale: Le terme désigne un mets cuit ou mijoté; cette formulation est moderne et plus générale que « ragoût ».
- source_word: יַיִן
  choice: du vin
  rationale: Équivalent français usuel.
- source_word: שֶׁמֶן
  choice: de l’huile
  rationale: Conserve la généralité de l’hébreu, même s’il s’agit vraisemblablement d’huile d’olive.
- source_word: כָּל מַאֲכָל
  choice: n’importe quel aliment
  rationale: Élargit la liste à toute sorte de nourriture et convient à la portée de la question.
- source_word: הֲיִקְדָּשׁ
  choice: cet aliment deviendra-t-il consacré ?
  rationale: Le référent implicite est clarifié sans modifier le sens; « consacré » maintient le cadre rituel et la valeur résultative du passif hébreu.
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ לֹא
  choice: 'Les prêtres répondirent : « Non. »'
  rationale: Formulation française naturelle qui rend pleinement l’acte de réponse, sans reproduire le doublet verbal hébreu de manière pesante.
theological_decisions:
- issue: Transmission de la sainteté par contact dans la législation sacerdotale
  choice: La question porte sur la transmission indirecte de la consécration à un aliment touché par le vêtement qui transporte la viande consacrée; les prêtres répondent par la négative.
  alternative: Comprendre que la viande consacrée elle-même touche directement les autres aliments.
  rationale: La syntaxe mentionne explicitement le pan du vêtement comme moyen de contact. La traduction conserve le caractère rituel et juridique de la question, sans l’appliquer à la sainteté morale ou intérieure.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire « consacrée » maintient le cadre cultuel; la phrase hypothétique est formulée naturellement. Tous les marqueurs de notes figurent dans le texte.
