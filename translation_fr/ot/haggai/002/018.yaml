- from: 'Prenez donc ceci à cœur à partir d’aujourd’hui et désormais, à partir du vingt-quatrième jour du neuvième mois, à partir du jour où le temple de Yahweh a été fondé[a] : prenez-le à cœur.'
  to: Réfléchissez attentivement à ceci, à partir d’aujourd’hui et désormais, à partir du vingt-quatrième jour du neuvième mois, à partir du jour où les fondations du temple de Yahweh ont été posées[a] ; réfléchissez-y attentivement.
  rationale: La révision supprime l’inférentiel « donc », rend l’idiome hébreu par une exhortation française naturelle à l’attention réfléchie, conserve sa répétition finale ainsi que l’insistance des repères temporels, et emploie la formulation architecturale la plus claire tout en préservant l’autre lecture en note.
