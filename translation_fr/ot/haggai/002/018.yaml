source:
  edition: WLC
  text: שִׂימוּ נָ֣א לְבַבְ/כֶ֔ם מִן הַ/יּ֥וֹם הַ/זֶּ֖ה וָ/מָ֑עְלָ/ה מִ/יּוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לַ/תְּשִׁיעִ֗י לְ/מִן הַ/יּ֛וֹם אֲשֶׁר יֻסַּ֥ד הֵֽיכַל יְהוָ֖ה שִׂ֥ימוּ לְבַבְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/018.yaml
  text: Set your heart on this from this day onward[a], from the twenty-fourth day of the ninth month, from the day when the temple of Yahweh was founded; consider it.
translation:
  language: fr
  text: Réfléchissez attentivement à ceci, à partir d’aujourd’hui et désormais, à partir du vingt-quatrième jour du neuvième mois, à partir du jour où les fondations du temple de Yahweh ont été posées[a] ; réfléchissez-y attentivement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « où le temple de Yahweh a été fondé ».
    reason: Le passif de יסד peut désigner le fait de fonder le temple; la formulation principale explicite, en français, l’action de poser ses fondations.
lexical_decisions:
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: Prenez donc ceci à cœur
  rationale: L’expression hébraïque signifie littéralement « placez votre cœur » et appelle à une attention réfléchie. « Prendre à cœur » conserve l’image du cœur tout en étant idiomatique en français. « Donc » rend ici la nuance exhortative de נָא sans introduire un « maintenant » temporel absent du texte.
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: à partir d’aujourd’hui et désormais
  rationale: Cette formulation française exprime le point de départ présent et la perspective orientée vers la suite que porte וָמָעְלָה.
- source_word: מִיּוֹם עֶשְׂרִים וְאַרְבָּעָה לַתְּשִׁיעִי
  choice: à partir du vingt-quatrième jour du neuvième mois
  rationale: Le texte donne une date précise. L’ajout explicite de « jour » et de « mois » est naturel en français et ne modifie pas le sens.
- source_word: לְמִן הַיּוֹם
  choice: à partir du jour
  rationale: La répétition de « à partir de » maintient l’enchaînement temporel et l’insistance de l’hébreu.
- source_word: אֲשֶׁר יֻסַּד
  choice: où … a été fondé
  rationale: Le passif de יסד désigne l’action de fonder ou de poser des fondations. Le choix principal conserve le noyau lexical, tandis que la formulation architecturale plus explicite figure en note.
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahweh
  rationale: Dans ce contexte, הֵיכַל désigne l’édifice du temple. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: שִׂימוּ לְבַבְכֶם
  choice: prenez-le à cœur
  rationale: La reprise finale de l’expression est conservée pour rendre son effet emphatique; le pronom « le » reprend naturellement l’objet de l’exhortation.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. L’image hébraïque du cœur et sa répétition sont maintenues, tout en employant l’expression française naturelle « prendre à cœur ». La série des repères introduits par « à partir de » est conservée afin de ne pas simplifier la structure temporelle du verset.
