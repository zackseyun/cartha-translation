  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה שֵׁנִית֙ אֶל חַגַּ֔י בְּ/עֶשְׂרִ֧ים וְ/אַרְבָּעָ֛ה לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/020.yaml
  text: And the word of Yahweh came a second time to Haggai on the twenty-fourth day of the month[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé[a] parvint une deuxième fois à Aggée, le vingt-quatrième jour du mois, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte le nom divin יהוה (YHWH). « Yahweh » est une autre transcription courante ; les traductions traditionnelles le rendent souvent par « le SEIGNEUR ».
    reason: Préciser le nom divin présent dans le texte source et les principales conventions de transcription ou de traduction.
lexical_decisions:
- source_word: וַיְהִי
  choice: parvint
  rationale: Dans la formule prophétique וַיְהִי דְבַר־יְהוָה, « parvint » exprime naturellement en français la venue de la parole divine sans recourir au calque peu idiomatique « fut ».
- source_word: דְבַר יְהוָה
  choice: la parole de Yahvé
  rationale: « Parole » conserve le sens de דָּבָר et la formule prophétique traditionnelle ; « Yahvé » représente directement le nom divin יְהוָה sous une forme française courante.
- source_word: שֵׁנִית
  choice: une deuxième fois
  rationale: Cette formulation explicite fidèlement la valeur ordinale de שֵׁנִית, plutôt que le moins précis « de nouveau ».
- source_word: אֶל חַגַּי
  choice: à Aggée
  rationale: Avec une communication divine, אֶל se rend naturellement par « à » ; « Aggée » est la forme française établie du nom du prophète.
- source_word: בְּעֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ
  choice: le vingt-quatrième jour du mois
  rationale: La formulation française rend clairement la date hébraïque, dans laquelle « jour » est sous-entendu.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette tournure française introduit naturellement le discours direct annoncé par לֵאמֹר et signale que la phrase se poursuit au verset suivant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR / Yahweh
  rationale: Le texte hébreu porte le nom propre divin יְהוָה. « Yahvé » le représente directement dans une forme familière au lectorat francophone, tandis que la note signale la substitution traditionnelle par un titre et la translittération « Yahweh ».
translation_notes:
  register: Français moderne, clair et digne. La syntaxe conserve la formule prophétique et la précision chronologique, tandis que les deux-points rendent explicitement l’introduction du discours qui suit.
