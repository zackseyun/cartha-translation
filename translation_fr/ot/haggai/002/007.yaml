  text: וְ/הִרְעַשְׁתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וּ/בָ֖אוּ חֶמְדַּ֣ת כָּל הַ/גּוֹיִ֑ם וּ/מִלֵּאתִ֞י אֶת הַ/בַּ֤יִת הַ/זֶּה֙ כָּב֔וֹד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/007.yaml
  text: And I will shake all the nations[a], and the treasures of all the nations will come, and I will fill this house with glory, says Yahweh of Armies.
translation:
  language: fr
  text: Je ferai trembler toutes les nations[a] ; les trésors de toutes les nations viendront, et je remplirai de gloire cette maison, dit Yahvé, le maître des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une traduction traditionnelle : « le désir de toutes les nations viendra ». L’hébreu peut aussi signifier « les biens précieux » ou « les trésors » des nations ; le verbe au pluriel favorise un sens collectif.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְעַשְׁתִּי
  choice: Je ferai trembler
  rationale: Le hiphil de רעשׁ exprime l’action de provoquer un tremblement. Cette formulation rend clairement la causalité divine sans ajouter une intensité absente du texte.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici l’ensemble des nations, sans en faire une catégorie théologique particulière.
- source_word: וּבָאוּ
  choice: afflueront
  rationale: Le verbe pluriel indique que ce qui est désirable ou précieux vient en nombre. « Afflueront » est naturel en français pour des richesses provenant de toutes les nations, tout en conservant l’idée de mouvement vers le temple.
- source_word: חֶמְדַּת כָּל הַגּוֹיִם
  choice: les trésors de toutes les nations
  rationale: חֶמְדַּת, singulier de forme, peut avoir un sens collectif et désigner les biens précieux ou désirables. Le verbe pluriel וּבָאוּ favorise cette lecture plutôt que celle d’une personne unique.
- source_word: וּמִלֵּאתִי
  choice: je remplirai
  rationale: Le piel de מלא signifie « remplir » ; la construction avec כָּבוֹד se rend directement par « remplir de gloire ».
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: בַּיִת signifie littéralement « maison ». Le contexte identifie le temple, mais la traduction conserve l’expression du prophète.
- source_word: כָּבוֹד
  choice: gloire
  rationale: Dans le contexte du temple et de la présence divine, « gloire » préserve les notions de majesté, d’éclat et d’honneur.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le maître des armées
  rationale: « Yahvé » représente le nom divin יהוה, tandis que « le maître des armées » traduit le titre צְבָאוֹת en français moderne et compréhensible, sans l’archaïsme de « des armées » employé seul comme complément.
theological_decisions:
- issue: Sens de חֶמְדַּת כָּל הַגּוֹיִם
  choice: 'Lecture collective et matérielle : « les trésors de toutes les nations »'
  alternative: 'Lecture personnelle traditionnelle : « le désir de toutes les nations » ; autre lecture matérielle : « les biens précieux de toutes les nations »'
  rationale: Le nom peut désigner collectivement des choses précieuses, et le verbe hébreu pluriel soutient fortement un référent collectif. La traduction n’impose donc pas une identification messianique personnelle, mais la note conserve la lecture traditionnelle et l’ambiguïté historique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la progression solennelle de l’oracle. « Cette maison » maintient l’image hébraïque, tandis que le contexte permet de comprendre qu’il s’agit du temple.
