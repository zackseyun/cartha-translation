  text: אֱמָר נָ֗א אֶל זְרֻבָּבֶ֤ל בֶּן שַׁלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֣ן הַ/גָּד֑וֹל וְ/אֶל שְׁאֵרִ֥ית הָ/עָ֖ם לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/002.yaml
  text: Speak now to Zerubbabel son of Shealtiel[a], governor of Judah, and to Joshua son of Jehozadak, the high priest, and to the remnant of the people, saying[b],
translation:
  language: fr
  text: 'Parle maintenant à Zorobabel, fils de Shéaltiel, gouverneur de Juda, à Josué, fils de Yehotsadaq, le grand prêtre, et au reste du peuple[a], en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ceux qui restent du peuple ». Le terme hébreu désigne ceux qui subsistent et peut aussi évoquer le thème prophétique du « reste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Parle donc
  rationale: L’impératif appelle à transmettre le message; « donc » rend ici la particule נָא comme une marque d’insistance immédiate plutôt que comme une formule de politesse.
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: Zorobabel, fils de Shéaltiel
  rationale: Formes françaises usuelles des noms, proches du texte massorétique.
- source_word: פַּחַת יְהוּדָה
  choice: gouverneur de Juda
  rationale: « Gouverneur » désigne clairement la fonction provinciale de l’époque perse.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Josué, fils de Yehotsadaq
  rationale: « Josué » est la forme française habituelle de יְהוֹשֻׁעַ; « Yehotsadaq » reproduit directement le nom hébreu.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: Titre consacré et naturel en français pour le principal prêtre d’Israël.
- source_word: שְׁאֵרִית הָעָם
  choice: le reste du peuple
  rationale: Dans ce contexte, l’expression désigne naturellement ceux qui demeurent de la communauté, tout en pouvant évoquer le thème prophétique du « reste ».
- source_word: לֵאמֹר
  choice: 'Dis-leur :'
  rationale: L’infinitif introduit les paroles du verset suivant. La reformulation explicite le destinataire implicite et produit une transition française naturelle.
theological_decisions:
- issue: Portée prophétique possible de שְׁאֵרִית (« reste »)
  choice: le reste du peuple
  alternative: ceux qui restent du peuple
  rationale: « Le reste » conserve à la fois le sens concret de la communauté subsistante et la résonance prophétique éventuelle, sans imposer une interprétation doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe hébraïque finale est légèrement explicitée par « Dis-leur : » afin d’introduire naturellement la citation du verset suivant.'
