base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/017.yaml
  text: I struck you with blight and mildew and hail[a], all the work of your hands; yet you did not turn to me, declares Yahweh.
translation:
  language: fr
  text: Je vous ai frappés par la flétrissure, le jaunissement et la grêle, dans tout le travail de vos mains ; pourtant, vous n’êtes pas revenus à moi[a], déclare Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la phrase est elliptique : « et il n’y avait pas de vous vers moi ». Elle peut aussi se comprendre : « vous n’étiez pas tournés vers moi » ou « aucun de vous n’était tourné vers moi ». Dans ce contexte, elle exprime leur refus de revenir à Yahvé.'
    reason: La proposition hébraïque est elliptique. La note distingue la formulation littérale de ses interprétations contextuelles possibles.
lexical_decisions:
- source_word: הִכֵּיתִי אֶתְכֶם
  choice: Je vous ai frappés
  rationale: Le verbe נכה exprime directement l’action de frapper. Cette formulation conserve l’action et l’intervention divines sans les atténuer.
- source_word: בַּשִּׁדָּפוֹן
  choice: par la flétrissure
  rationale: שִׁדָּפוֹן désigne un fléau agricole qui dessèche ou flétrit les cultures. « Flétrissure » est compréhensible en français moderne et évite le terme vieilli « nielle ».
- source_word: וּבַיֵּרָקוֹן
  choice: le jaunissement
  rationale: יֵרָקוֹן évoque la pâleur ou le jaunissement maladif des végétaux. « Jaunissement » garde cette image sans identifier trop précisément une maladie particulière.
- source_word: וּבַבָּרָד
  choice: et la grêle
  rationale: בָּרָד signifie sans ambiguïté « grêle ».
- source_word: אֵת כָּל מַעֲשֵׂה יְדֵיכֶם
  choice: dans tout le travail de vos mains
  rationale: La formulation conserve l’image hébraïque du « travail des mains » tout en indiquant naturellement en français le domaine dans lequel les destinataires ont été frappés.
- source_word: וְאֵין אֶתְכֶם אֵלַי
  choice: pourtant, vous n’êtes pas revenus à moi
  rationale: La proposition hébraïque est elliptique, littéralement proche de « et vous n’étiez pas vers moi ». Dans ce contexte de châtiment, « revenus à moi » en exprime naturellement le sens probable tout en signalant l’ellipse dans une note.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: נְאֻם est une formule prophétique solennelle, et le nom personnel יהוה est rendu par « Yahvé ».
theological_decisions:
- issue: Sens de la proposition elliptique וְאֵין אֶתְכֶם אֵלַי
  choice: pourtant, vous n’êtes pas revenus à moi
  alternative: mais vous n’étiez pas tournés vers moi / aucun de vous n’était vers moi
  rationale: Le texte ne contient aucun verbe explicite signifiant « revenir ». Le contexte présente cependant les fléaux comme un appel divin resté sans réponse. La traduction exprime ce sens contextuel sans cacher, grâce à la note, la formulation plus ouverte de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Les termes agricoles choisis restent concrets sans recourir au vocabulaire ancien ou trop spécialisé. Le point-virgule marque le contraste entre le châtiment et l’absence de retour à Dieu.
