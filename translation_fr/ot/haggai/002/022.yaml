  to: Je renverserai le trône des royaumes[a] et je détruirai la puissance des royaumes des nations. Je renverserai le char et ceux qui le montent ; les chevaux et leurs cavaliers tomberont, chacun par l’épée de son frère[b].
  rationale: La révision conserve le parallélisme, les singuliers collectifs et le pluriel des occupants du char. Elle remplace une interprétation de la préposition par une traduction plus proche du texte hébreu et aligne la note littérale sur le texte traduit. « Détruirai » évite de surtraduire le verbe de jugement.
