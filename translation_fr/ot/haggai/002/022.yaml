  text: וְ/הָֽפַכְתִּי֙ כִּסֵּ֣א מַמְלָכ֔וֹת וְ/הִ֨שְׁמַדְתִּ֔י חֹ֖זֶק מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וְ/הָפַכְתִּ֤י מֶרְכָּבָה֙ וְ/רֹ֣כְבֶ֔י/הָ וְ/יָרְד֤וּ סוּסִים֙ וְ/רֹ֣כְבֵי/הֶ֔ם אִ֖ישׁ בְּ/חֶ֥רֶב אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/022.yaml
  text: I will overturn the throne of kingdoms[a], and I will destroy the strength of the kingdoms of the nations. I will overturn the chariot and its rider, and horses and their riders will go down[b], each by the sword of his brother.
translation:
  language: fr
  text: Je renverserai le trône des royaumes[a] et je détruirai la puissance des royaumes des nations. Je renverserai le char et ceux qui le montent ; les chevaux et leurs cavaliers tomberont, chacun par l’épée de son frère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je mettrai à bas le pouvoir royal des royaumes. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chacun par l’épée de son frère » ; l’expression évoque une tuerie mutuelle ou des luttes intestines parmi les assaillants.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: Je renverserai
  rationale: Dans ce contexte de jugement, הפך exprime le renversement de pouvoirs établis tout en conservant une image concrète qui convient au trône comme au char.
- source_word: כִּסֵּא מַמְלָכוֹת
  choice: le trône des royaumes
  rationale: Le singulier hébreu כִּסֵּא est conservé ; il représente vraisemblablement de manière collective ou symbolique le pouvoir royal des royaumes.
- source_word: וְהִשְׁמַדְתִּי
  choice: j’anéantirai
  rationale: Le hifil de שׁמד est un verbe de jugement très fort. « Anéantir » en restitue la vigueur dans un français naturel et solennel.
- source_word: חֹזֶק
  choice: la puissance
  rationale: חֹזֶק désigne la force ou la puissance. Ici, « puissance » convient particulièrement aux capacités politiques et militaires des royaumes.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: les royaumes des nations
  rationale: גּוֹיִם désigne ici les nations dans un cadre géopolitique ; « nations » est clair et n’ajoute aucune connotation confessionnelle.
- source_word: מֶרְכָּבָה וְרֹכְבֶיהָ
  choice: le char et ceux qui le montent
  rationale: Le nom « char » reste au singulier comme en hébreu, tandis que le suffixe de רֹכְבֶיהָ est pluriel. Cette formulation française préserve les deux nombres sans rendre la phrase artificielle.
- source_word: וְיָרְדוּ
  choice: tomberont
  rationale: ירד signifie littéralement « descendre », mais, dans ce contexte militaire, évoque la chute et la défaite. « Tomberont » rend naturellement cette valeur contextuelle.
- source_word: סוּסִים וְרֹכְבֵיהֶם
  choice: les chevaux et leurs cavaliers
  rationale: « Chevaux » traduit directement סוּסִים ; « cavaliers » rend clairement les personnes qui les montent dans ce contexte de combat.
- source_word: אִישׁ בְּחֶרֶב אָחִיו
  choice: chacun sous l’épée de son frère
  rationale: La formulation reste proche de l’expression hébraïque distributive et conserve l’image d’une mise à mort mutuelle entre combattants apparentés ou alliés.
theological_decisions:
- issue: Langage masculin dans אִישׁ ... אָחִיו
  choice: chacun sous l’épée de son frère
  alternative: chacun sous l’épée d’un autre
  rationale: L’hébreu emploie des termes masculins singuliers dans une expression distributive visant les combattants. Le maintien de « son frère » préserve l’image précise du texte et sa portée de conflit fratricide sans la neutraliser.
- issue: Singulier collectif de כִּסֵּא et מֶרְכָּבָה
  choice: conserver « le trône » et « le char » au singulier
  alternative: les trônes et les chars
  rationale: Les singuliers peuvent représenter collectivement le pouvoir royal et la force militaire, mais le texte ne les explicite pas comme pluriels. La traduction préserve donc cette tension grammaticale et symbolique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme prophétique est conservé par la répétition de « Je renverserai ». La ponctuation clarifie le passage du renversement des pouvoirs politiques à celui des forces militaires.
