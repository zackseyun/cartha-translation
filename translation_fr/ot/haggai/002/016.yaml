  text: מִֽ/הְיוֹתָ֥/ם בָּא֙ אֶל עֲרֵמַ֣ת עֶשְׂרִ֔ים וְ/הָיְתָ֖ה עֲשָׂרָ֑ה בָּ֣א אֶל הַ/יֶּ֗קֶב לַ/חְשֹׂף֙ חֲמִשִּׁ֣ים פּוּרָ֔ה וְ/הָיְתָ֖ה עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/016.yaml
  text: When one came to a heap of twenty measures[a], there were only ten; when one came to the wine vat to draw fifty measures, there were only twenty.
translation:
  language: fr
  text: Quand on arrivait devant un tas de vingt mesures, il n’y en avait que dix ; quand on arrivait à la cuve à vin pour y puiser cinquante pouras[a], il n’y en avait que vingt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu « poura » désigne probablement une mesure ou un récipient pour liquide, dont la capacité exacte est inconnue.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהְיוֹתָם בָּא
  choice: Quand on venait
  rationale: Dans ce contexte, la tournure introduit la situation qui prévalait durant la période évoquée au verset précédent. Le français exprime naturellement cette valeur temporelle sans ajouter une question absente de la syntaxe retenue ici.
- source_word: עֲרֵמַת עֶשְׂרִים
  choice: un tas dont on attendait vingt mesures
  rationale: עֲרֵמָה désigne un tas de récolte, et l’unité après « vingt » reste implicite. La formulation rend clairement le rendement attendu, mis en contraste avec les dix mesures réellement disponibles.
- source_word: וְהָיְתָה עֲשָׂרָה
  choice: il n’y en avait que dix
  rationale: Cette formulation française naturelle fait ressortir la pénurie impliquée par le contraste numérique.
- source_word: הַיֶּקֶב
  choice: la cuve à vin
  rationale: יֶקֶב désigne ici la cuve associée au pressurage et à la collecte du vin.
- source_word: לַחְשֹׂף
  choice: pour y puiser
  rationale: Le verbe décrit l’action de retirer le liquide de la cuve; « puiser » est précis et idiomatique en français.
- source_word: חֲמִשִּׁים פּוּרָה
  choice: cinquante pouras
  rationale: פּוּרָה est un terme rare désignant vraisemblablement une mesure ou un récipient pour liquide, de capacité exacte inconnue. La translittération préserve cette incertitude, explicitée en note.
- source_word: וְהָיְתָה עֶשְׂרִים
  choice: il n’y en avait que vingt
  rationale: Comme dans la première proposition, « que » communique naturellement l’écart décevant entre la quantité attendue et la quantité obtenue.
