  text: בַּ/שְּׁבִיעִ֕י בְּ/עֶשְׂרִ֥ים וְ/אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָה֙ דְּבַר יְהוָ֔ה בְּ/יַד חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/001.yaml
  text: On the twenty-first day of the seventh month[a], the word of Yahweh came by the hand of Haggai the prophet, saying,
translation:
  language: fr
  text: 'Le vingt et unième jour du septième mois, la parole de Yahweh fut adressée par l’intermédiaire du prophète Aggée[a], en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main d’Aggée » ; expression signifiant « par l’intermédiaire d’Aggée » ou « par son action ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁבִיעִי בְּעֶשְׂרִים וְאֶחָד לַחֹדֶשׁ
  choice: Le vingt et unième jour du septième mois
  rationale: La construction hébraïque forme une date. « Jour » est sous-entendu et doit être explicité en français naturel.
- source_word: הָיָה דְּבַר יְהוָה
  choice: la parole de Yahweh fut adressée
  rationale: Cette formule prophétique présente la communication d’une révélation divine. La tournure française rend naturellement l’événement sans traduire mécaniquement הָיָה par « fut » au sens statique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin exprimé par le tétragramme plutôt que de lui substituer un titre.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression signifie littéralement « par la main de » et marque ici l’agent ou le médiateur. L’équivalent choisi est clair et idiomatique en français.
- source_word: חַגַּי הַנָּבִיא
  choice: du prophète Aggée
  rationale: « Aggée » est la forme française traditionnelle et courante du nom; le titre est conservé. L’ordre français naturel place le titre avant le nom.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif introduit le discours divin qui suit; cette formule française en marque naturellement l’ouverture.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La date suit l’usage français; la formule prophétique et l’expression d’intermédiaire sont rendues de façon naturelle. Le marqueur de note est placé après « Aggée », là où se trouve l’expression commentée.
