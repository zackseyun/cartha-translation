  text: בְּ/עֶשְׂרִ֤ים וְ/אַרְבָּעָה֙ לַ/תְּשִׁיעִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָה֙ דְּבַר יְהוָ֔ה אֶל חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/010.yaml
  text: On the twenty-fourth day of the ninth month, in the second year of Darius, the word of Yahweh came to Haggai the prophet, saying,
translation:
  language: fr
  text: 'Le vingt-quatrième jour du neuvième mois, la deuxième année de Darius, la parole de Yahweh fut adressée au prophète Aggée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עֶשְׂרִים וְ/אַרְבָּעָה
  choice: Le vingt-quatrième jour
  rationale: La formule hébraïque de datation dit littéralement « au vingt et quatre ». En français naturel, on emploie l’ordinal et l’on explicite « jour ».
- source_word: לַ/תְּשִׁיעִי
  choice: du neuvième mois
  rationale: Dans cette formule de datation, l’ordinal désigne le neuvième mois. L’ajout de « mois » explicite le référent sous-entendu en hébreu.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/דָרְיָוֶשׁ
  choice: la deuxième année de Darius
  rationale: Cette formulation française courante rend fidèlement la formule hébraïque indiquant l’année de règne.
- source_word: הָיָה דְּבַר יְהוָה
  choice: la parole de Yahweh fut adressée
  rationale: Dans cette formule prophétique, היה exprime la survenue de la parole divine. « Fut adressée » est idiomatique en français et précise naturellement le rapport au destinataire introduit par אֶל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, conformément à la valeur du texte hébreu.
- source_word: אֶל חַגַּי הַ/נָּבִיא
  choice: au prophète Aggée
  rationale: אֶל marque le destinataire. « Aggée » est la forme française traditionnelle et standard du nom biblique, tandis que le titre apposé est conservé.
- source_word: לֵ/אמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif introduit le discours divin qui suit. « En ces termes » remplit naturellement cette fonction en français et les deux-points signalent que la phrase se poursuit au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le caractère personnel du nom sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la formule chronologique solennelle et ouvre explicitement sur le discours du verset suivant.
