id: HAG.2.8
reference: Haggai 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ֥/י הַ/כֶּ֖סֶף וְ/לִ֣/י הַ/זָּהָ֑ב נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/008.yaml
  text: The silver is mine[a], and the gold is mine[b], declares Yahweh of Armies.
translation:
  language: fr
  text: L’argent est à moi, et l’or est à moi, déclare Yahweh des armées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formulation traditionnelle : « le SEIGNEUR des armées » ou « l’Éternel des armées » ; l’hébreu porte le nom divin Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: est à moi
  rationale: La préposition לְ avec le suffixe de première personne exprime ici la possession. « Est à moi » rend naturellement cette affirmation en français et conserve sa forme emphatique.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף désigne l’argent, métal précieux, et peut aussi désigner la monnaie. Son parallélisme avec « l’or » privilégie ici le sens concret du métal.
- source_word: וְלִי
  choice: et … est à moi
  rationale: La répétition de la tournure possessive est maintenue afin de préserver l’insistance de l’hébreu sur l’appartenance des deux métaux à Yahweh.
- source_word: הַזָּהָב
  choice: l’or
  rationale: Le terme désigne directement le métal précieux et forme un parallélisme équilibré avec « l’argent ».
- source_word: נְאֻם
  choice: déclare
  rationale: Dans cette formule prophétique solennelle, « déclare » est une formulation française actuelle et digne qui conserve la force de l’énoncé divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de représenter directement le tétragramme du texte hébreu.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Le pluriel צְבָאוֹת évoque des armées ou des troupes. « Des armées » en transmet clairement le sens martial et souverain, contrairement à la formulation traditionnelle devenue moins transparente.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte explicitement le nom divin. Le conserver sous la forme « Yahweh » distingue ce nom personnel d’un simple titre.
- issue: Traduction du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR des armées / l’Éternel des armées / le Seigneur de l’univers
  rationale: La traduction retenue conserve le nom divin et rend directement le sens de צְבָאוֹת, sans imposer une interprétation plus précise de la nature de ces armées.
translation_notes:
  register: 'Français international moderne, sobre et solennel. La répétition « est à moi » est volontaire : elle reproduit l’insistance et le parallélisme de l’hébreu.'
