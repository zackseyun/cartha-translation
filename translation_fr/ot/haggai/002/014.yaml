  text: וַ/יַּ֨עַן חַגַּ֜י וַ/יֹּ֗אמֶר כֵּ֣ן הָֽ/עָם הַ֠/זֶּה וְ/כֵן הַ/גּ֨וֹי הַ/זֶּ֤ה לְ/פָנַ/י֙ נְאֻם יְהוָ֔ה וְ/כֵ֖ן כָּל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וַ/אֲשֶׁ֥ר יַקְרִ֛יבוּ שָׁ֖ם טָמֵ֥א הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/014.yaml
  text: Then Haggai answered and said[a], “So is this people, and so is this nation before me,” declares Yahweh, “and so is every work of their hands[b]; and what they offer there is unclean.”
translation:
  language: fr
  text: 'Alors Aggée répondit : « Tel est ce peuple, telle est cette nation devant moi, déclare Yahweh ; telle est toute l’œuvre de leurs mains, et ce qu’ils offrent là est impur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: tel est / telle est
  rationale: La répétition rend la force comparative et démonstrative de l’hébreu, qui applique au peuple l’analogie rituelle des versets précédents.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Conserve l’expression collective et la nuance de mise à distance ou de reproche portée par le démonstratif.
- source_word: הַגּוֹי הַזֶּה
  choice: cette nation
  rationale: גּוֹי désigne ici la communauté judéenne dans son identité collective, non des non-Juifs en particulier.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Expression française naturelle qui conserve l’idée de se trouver en présence de Dieu et sous son regard judiciaire.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend solennellement la formule prophétique tout en transcrivant le nom divin.
- source_word: כָּל מַעֲשֵׂה יְדֵיהֶם
  choice: toute l’œuvre de leurs mains
  rationale: Préserve l’idiome hébreu et la portée globale de כָּל dans un français digne et compréhensible.
- source_word: וַאֲשֶׁר יַקְרִיבוּ
  choice: ce qu’ils offrent
  rationale: Le hifil de קרב désigne ici la présentation d’une offrande dans un contexte cultuel.
- source_word: שָׁם
  choice: là
  rationale: Maintient la référence spatiale sans préciser un autel ou un lieu que le verset ne nomme pas.
- source_word: טָמֵא הוּא
  choice: est impur
  rationale: « Impur » appartient au vocabulaire rituel naturel en français et exprime l’état résultant établi par les versets précédents.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Référent de « cette nation »
  choice: la communauté judéenne revenue d’exil, considérée collectivement
  alternative: les nations étrangères environnantes
  rationale: Dans le contexte, Aggée applique au peuple auquel il s’adresse le raisonnement sacerdotal sur l’impureté ; la traduction « nation » évite d’introduire l’idée de non-Juifs.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La triple reprise « tel est / telle est » préserve la structure rhétorique hébraïque. L’omission de « et dit » après « répondit » évite une redondance peu naturelle en français sans perte de sens.
