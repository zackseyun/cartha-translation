source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֣וּא נְאֻם יְהוָ֣ה צְבָא֡וֹת אֶ֠קָּחֲ/ךָ זְרֻבָּבֶ֨ל בֶּן שְׁאַלְתִּיאֵ֤ל עַבְדִּ/י֙ נְאֻם יְהוָ֔ה וְ/שַׂמְתִּ֖י/ךָ כַּֽ/חוֹתָ֑ם כִּֽי בְ/ךָ֣ בָחַ֔רְתִּי נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/023.yaml
  text: On that day[a], declares Yahweh of Armies, I will take you, Zerubbabel son of Shealtiel, my servant, declares Yahweh, and I will make you like a signet ring, for I have chosen you[b], declares Yahweh of Armies.
translation:
  language: fr
  text: « En ce jour-là, déclare Yahweh des armées[a], je te prendrai, Zorobabel, fils de Shealtiel, mon serviteur, déclare Yahweh, et je te rendrai semblable à un anneau à cachet[b], car je t’ai choisi, déclare Yahweh des armées. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « le SEIGNEUR des armées »; on traduit aussi « le SEIGNEUR des puissances ».'
    reason: lexical_alternative
  - marker: b
    text: Un anneau à cachet servait à sceller et à authentifier des documents; l’image peut ainsi évoquer l’autorité, l’appartenance et l’authentification. Comparer Jérémie 22.24.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique rendue dans un français actuel et solennel, sans préciser davantage la nature de ce jour.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclare Yahweh des armées
  rationale: « Déclare » conserve la force solennelle de la formule d’oracle נְאֻם. Le nom divin est transcrit « Yahweh », et « des armées » rend de façon transparente צְבָאוֹת.
- source_word: אֶקָּחֲךָ
  choice: je te prendrai
  rationale: Traduction directe de לקח, qui évite de confondre cette action avec le choix divin explicitement exprimé plus loin.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Zorobabel, fils de Shéaltiel
  rationale: Formes françaises usuelles des noms bibliques, avec restitution simple de la filiation.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans cette adresse royale et prophétique, « serviteur » exprime naturellement la personne chargée d’une mission par Dieu, sans imposer la nuance sociale de « esclave ».
- source_word: וְשַׂמְתִּיךָ כַּחוֹתָם
  choice: et je ferai de toi un anneau à cachet
  rationale: Cette formulation française naturelle conserve l’image concrète du חוֹתָם, objet servant à marquer et authentifier. La construction prédicative rend ici la comparaison hébraïque sans ajouter explicitement une royauté ou une possession divine.
- source_word: כִּי בְךָ בָחַרְתִּי
  choice: car je t’ai choisi
  rationale: « Car » exprime la relation causale de כִּי; le passé composé rend le choix accompli dont la validité demeure.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La répétition de la formule prophétique est conservée, comme dans l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte directement le tétragramme; sa transcription préserve le nom d’alliance sans le remplacer par un titre.
- issue: Sens du titre צְבָאוֹת
  choice: des armées
  alternative: de l’univers / des puissances
  rationale: Ce choix garde l’image des forces célestes et terrestres placées sous le commandement de Yahweh, sans la diluer dans une paraphrase.
- issue: Portée royale ou messianique de l’anneau à cachet
  choice: Conserver la métaphore sans explicitation messianique dans le texte
  alternative: mon anneau royal à cachet
  rationale: Le contexte et Jérémie 22.24 donnent à l’image une forte portée dynastique, mais le verset ne comporte ni l’adjectif « royal » ni une désignation messianique explicite.
translation_notes:
  register: Français international moderne, solennel mais accessible. La triple formule « déclare Yahweh » est maintenue pour reproduire l’insistance de l’oracle. La métaphore centrale reste concrète et n’est pas développée dans le corps du texte.
