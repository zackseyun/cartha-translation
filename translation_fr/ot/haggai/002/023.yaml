  source_fidelity: 'La traduction rend fidèlement les éléments essentiels de l’hébreu : formule temporelle, nom divin, titre « des armées », prise/élection de Zorobabel, statut de serviteur et répétitions de la formule d’oracle. Toutefois, כַּחוֹתָם est explicitement comparatif (« comme un sceau / comme un anneau à cachet »). « Je ferai de toi un anneau à cachet » transforme la comparaison en identification directe.'
  naturalness: Le français est moderne, solennel et globalement naturel. « Je te rendrai semblable à un anneau à cachet » est un peu plus explicite que la formulation initiale, mais il restitue clairement et naturellement la comparaison hébraïque.
  terminology: « Yahweh », « des armées », « Zorobabel », « mon serviteur » et « anneau à cachet » conviennent. « Shealtiel » est retenu comme graphie internationale simple du nom, sans modifier son référent.
