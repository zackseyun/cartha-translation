revisions:
- from: Mais maintenant, sois fort, Zorobabel — déclaration de Yahweh. Sois fort, Josué, fils de Yehotsadaq, le grand prêtre. Soyez forts, vous tous, peuple du pays — déclaration de Yahweh —, et mettez-vous à l’œuvre, car je suis avec vous — déclaration de Yahweh des armées[a].
  to: Mais maintenant, sois fort, Zorobabel — déclaration de Yahweh — ; sois fort, Josué, fils de Yehotsadaq, le grand prêtre ; soyez forts, vous tous, gens du pays — déclaration de Yahweh —, et travaillez, car je suis avec vous — déclaration de Yahweh des armées[a].
  rationale: La révision améliore la syntaxe de l’adresse au peuple et rend ועשו de façon plus directe. Elle conserve les répétitions, les niveaux de politesse et la disposition des trois formules prophétiques du texte hébreu. La note est remplacée afin de présenter une véritable alternative traditionnelle, sans ambiguïté lexicale inutile.
