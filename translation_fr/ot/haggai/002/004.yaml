  text: וְ/עַתָּ֣ה חֲזַ֣ק זְרֻבָּבֶ֣ל נְאֻם יְהוָ֡ה וַ/חֲזַ֣ק יְהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וַ/חֲזַ֨ק כָּל עַ֥ם הָ/אָ֛רֶץ נְאֻם יְהוָ֖ה וַֽ/עֲשׂ֑וּ כִּֽי אֲנִ֣י אִתְּ/כֶ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/004.yaml
  text: But now[a], be strong, Zerubbabel, declares Yahweh, and be strong, Joshua son of Jehozadak, the high priest, and be strong, all the people of the land, declares Yahweh, and work, for I am with you, declares Yahweh of Armies.
translation:
  language: fr
  text: Mais maintenant, sois fort, Zorobabel — déclaration de Yahweh — ; sois fort, Josué, fils de Yehotsadaq, le grand prêtre ; soyez forts, vous tous, gens du pays — déclaration de Yahweh —, et travaillez, car je suis avec vous — déclaration de Yahweh des armées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « le SEIGNEUR des armées » ou « l’Éternel des armées ».'
    reason: Signale les rendus français traditionnels de Yahweh des armées sans ajouter « célestes », qui n’est pas exprimé dans le titre hébreu.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Dans le contexte, l’expression marque le passage du découragement évoqué auparavant à l’exhortation présente; « Mais maintenant » rend naturellement cette transition.
- source_word: חֲזַק / וַחֲזַק / וַחֲזַק
  choice: sois fort / sois fort / soyez forts
  rationale: La répétition de l’impératif est conservée. Le passage au pluriel dans la troisième occurrence correspond à l’adresse faite à l’ensemble du peuple.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formulation conserve le caractère solennel et distinctif de la formule prophétique, sans la réduire au simple verbe « dire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre plutôt que remplacé par un titre.
- source_word: בֶּן
  choice: fils de
  rationale: Il s’agit ici d’une identification généalogique directe.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: C’est l’appellation française courante et exacte de cette fonction cultuelle.
- source_word: כָּל עַם הָאָרֶץ
  choice: vous tous, peuple du pays
  rationale: « Pays » désigne ici le territoire et la communauté locale, non la terre entière. La tournure française rend explicite l’adresse collective tout en conservant l’expression hébraïque.
- source_word: וַעֲשׂוּ
  choice: et mettez-vous à l’œuvre
  rationale: Dans le contexte de la reconstruction du temple, l’impératif appelle concrètement à entreprendre le travail. Cette formulation est naturelle sans être relâchée.
- source_word: כִּי אֲנִי אִתְּכֶם
  choice: car je suis avec vous
  rationale: « Car » présente la présence de Dieu comme le fondement de l’appel à agir.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le titre traduit le sens concret de צְבָאוֹת et reste intelligible en français moderne; la formulation traditionnelle est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie le Tétragramme comme nom propre. Le conserver sous la forme « Yahweh » distingue le nom divin du titre Seigneur.
- issue: Rendu du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh des puissances célestes
  rationale: « Des armées » traduit directement צְבָאוֹת sans décider si, dans ce titre, les armées visées sont terrestres, célestes ou englobent l’ensemble des puissances placées sous l’autorité divine.
- issue: Portée de l’assurance « je suis avec vous »
  choice: Formulation conservée sans explicitation
  alternative: je vous soutiens / je vous aiderai
  rationale: Le texte affirme la présence de Yahweh, riche d’implications, sans préciser ici une seule modalité de cette présence; la traduction n’en réduit donc pas la portée.
translation_notes:
  register: Français international actuel, solennel mais accessible. Les trois exhortations parallèles sont maintenues et ponctuées pour faire entendre la formule prophétique répétée. « Mettez-vous à l’œuvre » exprime l’appel contextuel au travail sans tomber dans un registre familier.
