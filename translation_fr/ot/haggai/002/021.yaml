source:
  edition: WLC
  text: אֱמֹ֕ר אֶל זְרֻבָּבֶ֥ל פַּֽחַת יְהוּדָ֖ה לֵ/אמֹ֑ר אֲנִ֣י מַרְעִ֔ישׁ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/021.yaml
  text: 'Speak to Zerubbabel[a], governor of Judah, saying: I am shaking the heavens and the earth.'
translation:
  language: fr
  text: 'Dis à Zorobabel, gouverneur de Juda : « Je fais trembler les cieux et la terre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je vais faire trembler les cieux et la terre » ou « je ferai trembler les cieux et la terre ». Le participe hébreu peut exprimer une action en cours, imminente ou future.'
    reason: Alternative lexicale et aspectuo-temporelle.
lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: Dis à
  rationale: L’impératif suivi de אֶל exprime l’ordre d’adresser ces paroles à Zorobabel ; « Dis à » est direct et naturel en français.
- source_word: זְרֻבָּבֶל
  choice: Zorobabel
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: פַּחַת יְהוּדָה
  choice: gouverneur de Juda
  rationale: פֶּחָה désigne ici le gouverneur d’une province sous administration impériale ; « gouverneur » est l’équivalent moderne le plus clair.
- source_word: לֵאמֹר
  choice: ': « … »'
  rationale: L’infinitif quotatif introduit les paroles à transmettre. En français actuel, les deux-points et le discours direct rendent cette fonction plus naturellement que « en disant ».
- source_word: אֲנִי מַרְעִישׁ
  choice: Je fais trembler
  rationale: Le pronom explicite est conservé dans « Je », tandis que le participe hiphil est rendu au présent, sans exclure la valeur de futur imminent qu’il peut prendre dans ce contexte prophétique.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: les cieux et la terre
  rationale: Le couple désigne l’ensemble du cadre cosmique ; « les cieux » respecte le pluriel hébreu et le registre élevé de la déclaration.
theological_decisions:
- issue: Portée de l’ébranlement
  choice: Conserver l’image cosmique des cieux et de la terre
  alternative: Comprendre l’image comme désignant principalement les bouleversements politiques parmi les nations
  rationale: Le verset emploie explicitement le couple cosmique « les cieux et la terre ». Les versets suivants en donnent une application historique et politique, mais la traduction ne doit pas réduire d’avance la portée de l’image.
- issue: Valeur temporelle du participe מַרְעִישׁ
  choice: 'Présent : « Je fais trembler »'
  alternative: 'Futur imminent ou simple : « je vais faire trembler » ou « je ferai trembler »'
  rationale: Le participe présente l’action comme actuelle ou en voie de réalisation, mais le discours prophétique permet aussi une lecture future. Le texte principal garde la forme la plus proche de l’aspect hébreu et la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct évite le lourd « en disant ». « Faire trembler » reste concret et accessible tout en conservant l’ampleur cosmique de la formule.
