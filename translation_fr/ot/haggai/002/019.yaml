source:
  edition: WLC
  text: הַ/ע֤וֹד הַ/זֶּ֨רַע֙ בַּ/מְּגוּרָ֔ה וְ/עַד הַ/גֶּ֨פֶן וְ/הַ/תְּאֵנָ֧ה וְ/הָ/רִמּ֛וֹן וְ/עֵ֥ץ הַ/זַּ֖יִת לֹ֣א נָשָׂ֑א מִן הַ/יּ֥וֹם הַ/זֶּ֖ה אֲבָרֵֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/019.yaml
  text: Is the seed still in the storehouse? Even the vine[a], the fig tree, the pomegranate, and the olive tree have not borne fruit. From this day on I will bless you.
translation:
  language: fr
  text: La semence est-elle encore dans le grenier ? Même la vigne, le figuier, le grenadier et l’olivier n’ont rien produit. À partir d’aujourd’hui, je vous bénirai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit simplement : « je bénirai », sans complément exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעוֹד
  choice: encore
  rationale: Dans cette question, עוֹד exprime la continuité jusqu’au moment présent ; « encore » est l’équivalent français naturel.
- source_word: הַזֶּרַע
  choice: la semence
  rationale: זֶרַע désigne ici la semence destinée aux cultures. « La semence » conserve le sens agricole sans le restreindre à une céréale précise.
- source_word: בַּמְּגוּרָה
  choice: dans le grenier
  rationale: מְגוּרָה désigne un lieu où l’on entrepose les produits agricoles, en particulier le grain ; « grenier » est clair et idiomatique dans ce contexte.
- source_word: וְעַד
  choice: Même
  rationale: Ici, עַד étend l’observation aux cultures énumérées. « Même » rend naturellement cette progression en français, sans reproduire littéralement l’expression peu idiomatique « et jusqu’à ».
- source_word: הַגֶּפֶן וְהַתְּאֵנָה וְהָרִמּוֹן וְעֵץ הַזַּיִת
  choice: la vigne, le figuier, le grenadier et l’olivier
  rationale: Ces termes français usuels correspondent directement aux quatre cultures nommées et conviennent à un registre courant et digne.
- source_word: לֹא נָשָׂא
  choice: n’ont rien produit
  rationale: נָשָׂא signifie littéralement « porter » ; appliqué à ces cultures, il indique qu’elles n’ont pas donné de fruit. Le pluriel français s’accorde naturellement avec l’énumération, bien que l’hébreu emploie un singulier distributif ou collectif.
- source_word: מִן הַיּוֹם הַזֶּה
  choice: À partir d’aujourd’hui
  rationale: La formule marque un tournant commençant ce jour-là et se prolongeant ensuite. « À partir d’aujourd’hui » rend clairement cette valeur prospective.
- source_word: אֲבָרֵךְ
  choice: je vous bénirai
  rationale: Le piel inaccompli à la première personne exprime ici une promesse future. Le complément n’est pas formulé en hébreu, mais les destinataires du discours sont implicitement ceux que Dieu bénira ; « vous » est ajouté pour produire une phrase française naturelle et claire.
theological_decisions:
- issue: Complément implicite de la promesse « je bénirai »
  choice: Rendre le destinataire implicite par « je vous bénirai »
  alternative: 'Conserver l’absence de complément : « je bénirai »'
  rationale: L’hébreu ne précise pas le complément du verbe, mais le contexte du discours indique que la promesse vise les personnes auxquelles Dieu s’adresse. L’ajout de « vous » explicite ce lien sans introduire une précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La question initiale conserve sa force rhétorique ; l’énumération reste concrète et agricole. « N’ont rien produit » évite le tour plus soutenu « n’ont pas porté de fruit » tout en préservant le sens.
