  text: וַ/יֹּ֣אמֶר חַגַּ֔י אִם יִגַּ֧ע טְמֵא נֶ֛פֶשׁ בְּ/כָל אֵ֖לֶּה הֲ/יִטְמָ֑א וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/013.yaml
  text: Then Haggai said[a], “If one who is unclean by contact with a dead body touches any of these, does it become unclean?” And the priests answered and said, “It becomes unclean.”
translation:
  language: fr
  text: 'Alors Aggée dit : « Si quelqu’un devenu impur par contact avec un cadavre[a] touche l’une quelconque de ces choses, devient-elle impure ? » Les prêtres répondirent : « Elle devient impure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « impur de personne [ou d’âme] », expression désignant l’impureté contractée au contact d’un cadavre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait avancer l’échange; « Alors » exprime naturellement cette succession en français.
- source_word: חַגַּי
  choice: Aggée
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: אִם יִגַּע
  choice: Si ... touche
  rationale: Rend directement le cas conditionnel soumis aux prêtres et le contact physique exprimé par נגע.
- source_word: טְמֵא נֶפֶשׁ
  choice: quelqu’un rendu impur par le contact avec un mort
  rationale: L’expression hébraïque désigne l’impureté rituelle liée à un cadavre; cette formulation restitue son sens idiomatique sans suggérer une impureté de l’âme.
- source_word: בְּכָל אֵלֶּה
  choice: l’une de ces choses
  rationale: Dans la question conditionnelle, le français distributif renvoie clairement aux choses mentionnées au verset précédent.
- source_word: הֲיִטְמָא
  choice: devient-elle impure ?
  rationale: Exprime la transmission de l’état d’impureté à la chose touchée.
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ
  choice: Les prêtres répondirent
  rationale: Le français naturel n’a pas besoin de reproduire le doublet narratif « répondirent et dirent », dont « répondirent » porte ici tout le sens.
- source_word: יִטְמָא
  choice: Elle devient impure
  rationale: Reprend les termes de la question et conserve la forme du verdict sacerdotal, sans ajouter un « oui » absent de l’hébreu.
theological_decisions:
- issue: Nature de l’impureté évoquée
  choice: Présenter l’impureté comme l’état rituel contracté au contact d’un mort.
  alternative: Traduire littéralement « impur de personne/d’âme ».
  rationale: Dans le cadre des règles sacerdotales de pureté, טְמֵא נֶפֶשׁ est un idiome relatif à l’impureté causée par un cadavre, et non à une souillure psychologique ou morale.
translation_notes:
  register: Français international moderne, clair et digne. Le langage de pureté reste concret et rituel. Le pronom féminin « elle » reprend « l’une de ces choses ». Une note conserve la forme littérale de l’idiome hébreu.
