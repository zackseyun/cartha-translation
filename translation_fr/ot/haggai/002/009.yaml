source:
  edition: WLC
  text: גָּד֣וֹל יִֽהְיֶ֡ה כְּבוֹד֩ הַ/בַּ֨יִת הַ/זֶּ֤ה הָ/אַֽחֲרוֹן֙ מִן הָ֣/רִאשׁ֔וֹן אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וּ/בַ/מָּק֤וֹם הַ/זֶּה֙ אֶתֵּ֣ן שָׁל֔וֹם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/009.yaml
  text: The latter glory of this house will be greater than the former[a], says Yahweh of Armies; and in this place I will give peace[b], declares Yahweh of Armies.
translation:
  language: fr
  text: La gloire future de cette maison sera plus grande que la précédente, dit Yahweh des armées[a], et dans ce lieu, je donnerai la paix[b], déclare Yahweh des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh des puissances célestes »; l’expression hébraïque peut désigner les armées terrestres ou célestes.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « paix » peut aussi évoquer le bien-être, la prospérité et la plénitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל יִהְיֶה ... מִן
  choice: sera plus grande que
  rationale: La construction prédicative avec מִן exprime ici une comparaison; le comparatif français est naturel et fidèle.
- source_word: כְּבוֹד
  choice: gloire
  rationale: « Gloire » conserve la portée d’honneur et de splendeur ainsi que la résonance cultuelle du contexte du temple.
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: Le mot désigne ici le temple, mais « maison » préserve l’image hébraïque et sa portée théologique.
- source_word: הָאַחֲרוֹן ... הָרִאשׁוֹן
  choice: future ... précédente
  rationale: Les adjectifs qualifient vraisemblablement la gloire, nom féminin en hébreu comme en français. « Future » et « précédente » rendent clairement le contraste temporel sans imposer qu’il s’agisse de deux édifices distincts.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est transcrit « Yahweh », tandis que צְבָאוֹת est traduit de manière transparente par « des armées ».
- source_word: וּבַמָּקוֹם הַזֶּה
  choice: et dans ce lieu
  rationale: Traduction directe qui conserve l’insistance du démonstratif.
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: Le verbe courant נָתַן signifie « donner »; cette formulation simple convient à la promesse.
- source_word: שָׁלוֹם
  choice: paix
  rationale: « Paix » est le sens central dans ce contexte, tout en laissant une note signaler les nuances de bien-être et de plénitude.
- source_word: אָמַר / נְאֻם
  choice: dit / déclare
  rationale: La variation française distingue le verbe ordinaire « dire » de la formule solennelle de proclamation prophétique נְאֻם.
theological_decisions:
- issue: Référent de « cette maison » et nature de sa gloire future
  choice: Maintenir une promesse portant sur la gloire future de cette maison sans préciser son accomplissement historique ou eschatologique.
  alternative: Y voir explicitement une comparaison entre le second temple et celui de Salomon, entre deux états du même sanctuaire, ou un accomplissement messianique final.
  rationale: L’hébreu formule la comparaison mais ne tranche pas explicitement entre ces lectures; la traduction ne doit pas résoudre cette tension à la place du texte.
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme יְהוָה; « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de l’hébreu tout en évitant une syntaxe artificielle; elle conserve « maison » plutôt que d’expliciter « temple » et maintient l’ambiguïté du contraste temporel.
