  text: וְ/עַתָּה֙ שִֽׂימוּ נָ֣א לְבַבְ/כֶ֔ם מִן הַ/יּ֥וֹם הַ/זֶּ֖ה וָ/מָ֑עְלָ/ה מִ/טֶּ֧רֶם שֽׂוּם אֶ֛בֶן אֶל אֶ֖בֶן בְּ/הֵיכַ֥ל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/015.yaml
  text: 'And now[a], please set your heart on this from today onward: before one stone was placed upon another in the temple of Yahweh,'
translation:
  language: fr
  text: 'Et maintenant, réfléchissez donc bien à ceci[a], à partir de ce jour et pour la suite[b] : avant qu’on pose une pierre sur une autre dans le temple de Yahweh,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « placez, je vous prie, votre cœur ». Cette expression signifie : prêtez-y une attention réfléchie.'
    reason: Rend compte de l’idiome hébreu et de la nuance d’exhortation de נָא sans imposer une lecture théologique.
  - marker: b
    text: 'Littéralement : « depuis ce jour et vers le haut ». L’expression est généralement comprise : « à partir de ce jour et désormais ». Sa relation précise avec la proposition suivante, qui évoque la période avant la pose des pierres, est difficile; le texte français conserve cette juxtaposition sans la résoudre par une lecture rétrospective.'
    reason: Préserve l’ambiguïté syntaxique et temporelle de l’hébreu au lieu d’inverser la direction de וָמָעְלָה.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction de transition et l’adverbe temporel qui introduisent l’exhortation immédiate.
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: prenez donc bien à cœur
  rationale: Cette tournure française naturelle conserve l’image hébraïque du cœur comme siège de l’attention et de la réflexion. « donc » rend ici avec retenue la nuance d’exhortation portée par נָא.
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: à partir de ce jour, en remontant dans le temps
  rationale: Dans le contexte immédiat, l’orateur invite à regarder la période antérieure à la reprise de la construction. Cette formulation exprime clairement l’orientation rétrospective probable tout en signalant en note l’ambiguïté de l’expression.
- source_word: מִטֶּרֶם
  choice: avant que
  rationale: Introduit naturellement en français la période antérieure à l’action exprimée par l’infinitif hébreu.
- source_word: שׂוּם אֶבֶן אֶל אֶבֶן
  choice: qu’on pose pierre sur pierre
  rationale: Conserve l’image concrète et la formulation distributive de l’hébreu dans une expression française idiomatique liée à la construction.
- source_word: בְּהֵיכַל
  choice: dans le temple
  rationale: Dans ce contexte, הֵיכָל désigne l’édifice du temple de Jérusalem, et non un palais royal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; la transcription « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
- issue: Orientation temporelle de מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: 'lecture rétrospective : « en remontant dans le temps »'
  alternative: 'lecture prospective : « dès aujourd’hui et désormais »'
  rationale: La proposition suivante, « avant qu’on pose pierre sur pierre », et la description des conditions antérieures au verset suivant favorisent une rétrospection. La construction hébraïque demeure toutefois susceptible d’une lecture prospective, conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Prenez bien à cœur » garde l’image sémitique sans devenir artificiel; « pose pierre sur pierre » reste concret et naturel. La virgule finale est maintenue parce que la phrase se poursuit au verset suivant.
