  verdict: revise
  source_fidelity: La traduction de « en remontant dans le temps » inverse ou, à tout le moins, tranche indûment la direction explicite de וָמָעְלָה (« vers le haut, désormais, par la suite »). La relation exacte de « à partir de ce jour et au-delà » avec la proposition introduite par « avant » est syntaxiquement difficile; elle doit rester sans résolution interprétative excessive. « Prenez bien à cœur » rend bien l’idiome שִׂימוּ ... לְבַבְכֶם, et « Yahweh » rend correctement le tétragramme selon le parti éditorial.
  naturalness: « Prenez donc bien à cœur » est naturel, mais « ce qui s’est passé à partir de ce jour, en remontant dans le temps » est lourd et impose une paraphrase chronologique absente du texte. « Réfléchissez donc bien à ceci, à partir de ce jour et pour la suite » est idiomatique tout en laissant percevoir la construction temporelle hébraïque difficile. La virgule finale est justifiée, car l’énoncé se poursuit au verset suivant.
  terminology: « temple de Yahweh » est approprié pour בְּהֵיכַל יְהוָה. « Pose pierre sur pierre » est possible, mais « qu’on pose une pierre sur une autre » est plus naturel en français et représente clairement אֶבֶן אֶל־אֶבֶן. La note sur l’idiome du cœur peut être conservée avec une formulation plus exacte de נָא (« je vous prie / donc » plutôt que seulement « donc »).
