source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֥וֹד אַחַ֖ת מְעַ֣ט הִ֑יא וַ/אֲנִ֗י מַרְעִישׁ֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וְ/אֶת הַ/יָּ֖ם וְ/אֶת הֶ/חָרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/006.yaml
  text: 'For this is what Yahweh of Armies says: Yet once more[a], in a little while[b], I will shake the heavens and the earth and the sea and the dry land.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh des armées : Encore une fois, dans peu de temps[a], j’ébranlerai les cieux et la terre, la mer et la terre ferme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé : « Encore une fois — c’est peu. » Il peut aussi se comprendre : « Une fois encore, sous peu. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est transcrit « Yahweh », et צְבָאוֹת est rendu par son sens concret « armées », dans un titre naturel en français.
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que dit
  rationale: Cette formulation actuelle et digne restitue la formule prophétique et la valeur introductive de כִּי.
- source_word: עוֹד אַחַת מְעַט הִיא
  choice: Encore une fois, dans peu de temps
  rationale: Le tour hébreu est condensé. Cette traduction conserve à la fois l’idée d’une nouvelle intervention et celle d’un bref délai, sans imposer une interprétation ultérieure.
- source_word: מַרְעִישׁ
  choice: j’ébranlerai
  rationale: Le participe hiphil, renforcé par le pronom indépendant et situé dans un oracle, exprime ici une action divine imminente ou future. « Ébranler » convient à tous les domaines cosmiques énumérés.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: les cieux et la terre
  rationale: La paire cosmique traditionnelle et naturelle préserve le pluriel hébreu de « cieux ».
- source_word: הַיָּם וְאֶת הֶחָרָבָה
  choice: la mer et la terre ferme
  rationale: Dans son opposition à la mer, חָרָבָה désigne la partie sèche du monde plutôt que le désert.
theological_decisions:
- issue: Rendu du titre divin יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR de l’univers ; l’Éternel des armées
  rationale: Le texte porte explicitement le nom divin. Sa transcription préserve le nom personnel, tandis que « des armées » rend le titre sans substitution confessionnelle.
- issue: Sens temporel de עוֹד אַחַת מְעַט הִיא
  choice: Encore une fois, dans peu de temps
  alternative: Encore une fois — ce sera dans peu de temps ; Une fois encore, sous peu
  rationale: La syntaxe hébraïque est abrégée et légèrement ambiguë. Le texte principal en donne le sens probable, et la note signale sa forme plus littérale sans résoudre la tension par référence à Hébreux 12.
translation_notes:
  register: Français international moderne, clair et solennel. La cadence prophétique est conservée sans archaïsmes ; la répétition des compléments est allégée conformément à l’usage naturel du français.
