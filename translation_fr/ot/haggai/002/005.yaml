  text: אֶֽת הַ/דָּבָ֞ר אֲשֶׁר כָּרַ֤תִּי אִתְּ/כֶם֙ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרַ֔יִם וְ/רוּחִ֖/י עֹמֶ֣דֶת בְּ/תוֹכְ/כֶ֑ם אַל תִּירָֽאוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/005.yaml
  text: As for the promise that I made with you when you came out of Egypt[a], and my Spirit is standing in your midst[b]; do not fear.
translation:
  language: fr
  text: 'L’engagement que j’ai pris avec vous lorsque vous êtes sortis d’Égypte[a], et mon Esprit se tient au milieu de vous[b] : n’ayez pas peur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la parole que j’ai “coupée” avec vous » ; cette expression évoque la conclusion d’une alliance.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon Esprit demeure parmi vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַדָּבָר
  choice: Quant à l’engagement
  rationale: דָּבָר signifie littéralement « parole » ou « chose », mais prend ici une valeur d’engagement dans une construction qui évoque la conclusion d’une alliance. « Quant à » rend la tournure elliptique initiale sans la transformer en proposition pleinement explicite.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: que j’ai pris envers vous
  rationale: Le verbe כּרת, littéralement « couper », appartient souvent au langage de la conclusion d’une alliance. En français actuel, « prendre un engagement envers quelqu’un » communique naturellement cette force sans introduire dans le texte principal le nom technique « alliance », absent de l’hébreu.
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: lors de votre sortie d’Égypte
  rationale: La construction infinitive avec בְּ a une valeur temporelle. Cette formulation française est naturelle et conserve l’allusion directe à l’Exode.
- source_word: וְרוּחִי
  choice: mon Esprit
  rationale: Dans ce contexte, רוּחַ désigne la présence active de Dieu au milieu de son peuple plutôt qu’un simple vent ou souffle. La majuscule marque le référent divin sans préciser davantage sa nature.
- source_word: עֹמֶדֶת
  choice: se tient
  rationale: Le participe exprime une présence continue tout en conservant l’image verbale de « se tenir ». La note signale la traduction contextuelle plus fluide « demeure ».
- source_word: בְּתוֹכְכֶם
  choice: au milieu de vous
  rationale: Cette expression indique une présence au sein de la communauté et évite que « en vous » soit compris comme visant l’intériorité de chaque individu.
- source_word: אַל תִּירָאוּ
  choice: N’ayez pas peur
  rationale: Impératif négatif pluriel rendu dans un français moderne, direct et digne.
theological_decisions:
- issue: Sens de רוּחִי dans un contexte de présence divine
  choice: mon Esprit
  alternative: mon souffle
  rationale: Le contexte de l’alliance et de l’Exode favorise la présence agissante de Dieu. « Esprit » rend ce sens sans importer dans le verset des précisions doctrinales ultérieures.
- issue: Degré d’explicitation du langage d’alliance dans דָּבָר ... כָּרַתִּי
  choice: l’engagement que j’ai pris envers vous
  alternative: la parole que j’ai conclue avec vous / l’alliance que j’ai conclue avec vous
  rationale: « Engagement » communique la force d’une obligation solennelle, tandis que « alliance » expliciterait un nom que l’hébreu n’emploie pas ici. La formulation retenue préserve ainsi à la fois la nuance d’alliance et la distinction lexicale du texte source.
translation_notes:
  register: Français international moderne, accessible et solennel. Le pluriel « vous » s’adresse à la communauté. « Se tient » conserve l’image et la valeur durative du participe hébreu, tandis que la ponctuation répartit naturellement en français la construction elliptique de l’original.
