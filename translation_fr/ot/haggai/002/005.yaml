revisions:
- from: Quant à l’engagement que j’ai pris envers vous lors de votre sortie d’Égypte[a], mon Esprit se tient au milieu de vous[b]. N’ayez pas peur.
  to: 'L’engagement que j’ai pris avec vous lorsque vous êtes sortis d’Égypte[a], et mon Esprit se tient au milieu de vous[b] : n’ayez pas peur.'
  rationale: La révision conserve « engagement », choix prudent qui rend la portée solennelle de la formule sans imposer le nom « alliance » dans le texte principal. Elle rend explicitement אִתְּכֶם par « avec vous », améliore la lisibilité de l’ellipse hébraïque au moyen des deux-points, et corrige la note littérale sur le verbe כרת. « Se tient » préserve bien le participe duratif עֹמֶדֶת.
