  text: מִ֤י בָ/כֶם֙ הַ/נִּשְׁאָ֔ר אֲשֶׁ֤ר רָאָה֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה בִּ/כְבוֹד֖/וֹ הָ/רִאשׁ֑וֹן וּ/מָ֨ה אַתֶּ֜ם רֹאִ֤ים אֹת/וֹ֙ עַ֔תָּה הֲ/ל֥וֹא כָמֹ֛/הוּ כְּ/אַ֖יִן בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/003.yaml
  text: Who among you is left who saw this house in its former glory? And how do you see it now? Is it not as nothing in your eyes?[a][b]
translation:
  language: fr
  text: Qui parmi vous reste encore et a vu cette maison dans sa gloire d’autrefois ? Et comment la voyez-vous maintenant ? N’est-elle pas à vos yeux comme rien ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce temple ». L’hébreu dit littéralement « cette maison », expression courante pour désigner le temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans sa première gloire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם הַנִּשְׁאָר
  choice: Qui parmi vous reste encore
  rationale: La tournure désigne ceux qui subsistent de la génération antérieure. « Reste encore » est naturel en français et conserve l’idée de survivance sans préciser indûment qu’ils seraient seulement encore en vie.
- source_word: אֲשֶׁר רָאָה
  choice: et a vu
  rationale: Le verbe renvoie à l’expérience passée et accomplie d’avoir vu le premier sanctuaire. La coordination rend clairement en français que la relative qualifie ceux qui restent.
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: « Maison » traduit directement le terme hébreu et peut désigner le temple dans ce contexte. Une note signale l’équivalent contextuel « temple ».
- source_word: בִּכְבוֹדוֹ הָרִאשׁוֹן
  choice: dans sa gloire d’autrefois
  rationale: Cette formulation exprime à la fois l’éclat ou la splendeur et le contraste temporel avec l’état présent, dans un français idiomatique.
- source_word: וּמָה אַתֶּם רֹאִים אֹתוֹ עַתָּה
  choice: Et comment la voyez-vous maintenant ?
  rationale: La question sollicite une appréciation de l’état actuel de la maison. « Comment la voyez-vous » conserve le langage de la perception et sa portée évaluative.
- source_word: הֲלוֹא
  choice: Ne paraît-elle pas
  rationale: La particule introduit une question rhétorique qui attend l’assentiment. L’ajout de « paraît » forme une phrase française naturelle tout en reliant l’évaluation aux yeux des destinataires.
- source_word: כָמֹהוּ כְּאַיִן
  choice: comme rien
  rationale: Cette comparaison exprime l’insignifiance extrême du bâtiment actuel par rapport à sa gloire passée, sans transformer la comparaison en affirmation ontologique.
- source_word: בְּעֵינֵיכֶם
  choice: à vos yeux
  rationale: Cette expression française conserve l’image hébraïque et indique clairement qu’il s’agit de leur appréciation.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve « maison » dans le texte principal, maintient les questions rhétoriques et évite de résoudre au-delà de l’hébreu le rapport entre perception présente et comparaison avec l’ancienne gloire.
