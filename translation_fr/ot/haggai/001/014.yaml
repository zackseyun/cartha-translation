  text: וַ/יָּ֣עַר יְהוָ֡ה אֶת רוּחַ֩ זְרֻבָּבֶ֨ל בֶּן שַׁלְתִּיאֵ֜ל פַּחַ֣ת יְהוּדָ֗ה וְ/אֶת ר֨וּחַ֙ יְהוֹשֻׁ֤עַ בֶּן יְהוֹצָדָק֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְֽ/אֶת ר֔וּחַ כֹּ֖ל שְׁאֵרִ֣ית הָ/עָ֑ם וַ/יָּבֹ֨אוּ֙ וַ/יַּעֲשׂ֣וּ מְלָאכָ֔ה בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/014.yaml
  text: And Yahweh stirred up the spirit of Zerubbabel son of Shealtiel[a], governor of Judah, and the spirit of Joshua son of Jehozadak, the high priest, and the spirit of all the remnant of the people; and they came and did work on the house of Yahweh of Armies, their God.
translation:
  language: fr
  text: Yahweh suscita l’esprit de Zorobabel, fils de Shéaltiel, gouverneur de Juda, l’esprit de Josué, fils de Yehotsadaq, le grand prêtre, et l’esprit de tous ceux qui restaient du peuple. Ils vinrent et se mirent à travailler dans la maison de Yahweh, le Dieu des armées[a], leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation française traditionnelle : « le SEIGNEUR des armées ».'
    reason: Indique l’équivalent traditionnel du nom divin et de son titre sans remplacer la traduction principale.
lexical_decisions:
- source_word: וַיָּעַר
  choice: éveilla
  rationale: Le verbe exprime l’action de tirer quelqu’un de son inertie et de le pousser à agir. « Éveilla » reste proche de l’image hébraïque et convient à l’action de Dieu sur l’esprit des responsables et du peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: רוּחַ
  choice: esprit
  rationale: Dans ce contexte, le mot désigne la disposition intérieure qui porte à l’action. « Esprit » préserve toutefois l’expression hébraïque et sa portée théologique sans la réduire à une notion psychologique précise.
- source_word: פַּחַת יְהוּדָה
  choice: gouverneur de Juda
  rationale: « Gouverneur » est l’équivalent français actuel le plus clair de ce titre administratif de l’époque perse.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: C’est la désignation française usuelle et exacte de cette fonction.
- source_word: כֹּל שְׁאֵרִית הָעָם
  choice: tout le reste du peuple
  rationale: « Reste » rend le groupe subsistant tout en conservant la résonance biblique possible du terme, sans imposer davantage d’interprétation.
- source_word: וַיָּבֹאוּ
  choice: ils vinrent
  rationale: Cette formulation rend simplement la progression narrative du verbe hébreu.
- source_word: וַיַּעֲשׂוּ מְלָאכָה
  choice: accomplirent des travaux
  rationale: La formulation exprime concrètement qu’ils effectuèrent un travail, sans ajouter explicitement l’idée qu’ils commencèrent, absente du verbe hébreu.
- source_word: בְּבֵית
  choice: dans la maison
  rationale: La préposition בְּ situe normalement l’activité dans ou au lieu désigné. « Dans la maison » conserve cette valeur locative sans transformer explicitement l’expression en « sur la maison », même si le contexte concerne sa reconstruction.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Armées » rend de façon transparente צְבָאוֹת et conserve la force du titre divin, tandis que « armées célestes » préciserait plus que le texte.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Cette tournure française naturelle restitue le suffixe possessif et la relation exprimée dans l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel, tandis que « l’Éternel » relève d’une substitution française traditionnelle.
- issue: Portée de שְׁאֵרִית
  choice: le reste
  alternative: ceux qui restaient
  rationale: Le nom « reste » permet de conserver à la fois le sens concret des survivants ou membres restants et la résonance théologique que ce terme peut avoir dans les écrits prophétiques.
- issue: Sens du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: l’Éternel des armées
  rationale: Le choix retenu conserve à la fois le nom divin et le sens accessible de צְבָאוֹת, sans définir si les armées sont terrestres, célestes ou les deux.
translation_notes:
  register: Français international actuel, digne et lisible. La répétition de « l’esprit » est maintenue pour refléter la structure emphatique de l’hébreu. Les noms propres suivent des formes françaises reconnaissables, avec « Shaltiel » comme translittération moderne.
