    text: 'Ou, selon la formulation française traditionnelle : « le SEIGNEUR des armées ».'
    reason: Indique l’équivalent traditionnel du nom divin et de son titre sans remplacer la traduction principale.
  revision_rationale: La révision privilégie des équivalents français modernes et naturels pour la mobilisation suscitée par Yahweh et le travail accompli dans sa maison. Elle maintient la répétition de « l’esprit », la portée collective de שְׁאֵרִית, la fonction administrative de Zorobabel, le titre de grand prêtre et l’ambiguïté non spécifiée des « armées ».
