source:
  edition: WLC
  text: זְרַעְתֶּ֨ם הַרְבֵּ֜ה וְ/הָבֵ֣א מְעָ֗ט אָכ֤וֹל וְ/אֵין לְ/שָׂבְעָה֙ שָׁת֣וֹ וְ/אֵין לְ/שָׁכְרָ֔ה לָב֖וֹשׁ וְ/אֵין לְ/חֹ֣ם ל֑/וֹ וְ/הַ֨/מִּשְׂתַּכֵּ֔ר מִשְׂתַּכֵּ֖ר אֶל צְר֥וֹר נָקֽוּב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/006.yaml
  text: You have sown much[a], but brought in little. You eat, but there is not enough to be satisfied; you drink, but there is not enough to be filled; you clothe yourselves, but no one is warm[c][b]; and the one who earns wages earns them for a bag with holes.
translation:
  language: fr
  text: Vous avez beaucoup semé, mais peu récolté[a]. Vous mangez, mais sans être rassasiés ; vous buvez, mais sans être enivrés[b] ; vous vous habillez, mais personne n’a chaud[c] ; et celui qui gagne un salaire le met dans une bourse trouée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mais peu fait rentrer ». Il s’agit de la faible quantité rentrée après les semailles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sans atteindre l’ivresse ». Le terme hébreu évoque spécifiquement le fait d’être enivré, et non simplement celui d’avoir assez bu.'
    reason: lexical_clarification
  - marker: c
    text: 'Littéralement : « mais il n’y a pas de chaleur pour lui ». Le singulier a ici un sens général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרַעְתֶּם הַרְבֵּה
  choice: Vous avez beaucoup semé
  rationale: Le parfait qal à la deuxième personne du pluriel désigne une action accomplie dont les conséquences demeurent. Le passé composé est naturel en français et « beaucoup » rend la valeur adverbiale de הַרְבֵּה.
- source_word: וְהָבֵא מְעָט
  choice: mais peu récolté
  rationale: Littéralement « mais fait rentrer peu » ; dans ce contexte agricole, l’expression désigne la maigre récolte. « Peu récolté » restitue clairement l’idiome tout en gardant le contraste concis.
- source_word: אָכוֹל וְאֵין לְשָׂבְעָה
  choice: Vous mangez, mais sans être rassasiés
  rationale: La tournure brève décrit le fait de manger sans parvenir à satiété. « Être rassasiés » correspond directement à la racine שׂבע et convient au registre biblique moderne.
- source_word: שָׁתוֹ וְאֵין לְשָׁכְרָה
  choice: vous buvez, mais sans être enivrés
  rationale: La racine שׁכר renvoie spécifiquement à l’ivresse ou à l’effet enivrant, plutôt qu’au simple fait d’étancher sa soif. La traduction conserve ce sens lexical, malgré son caractère surprenant.
- source_word: לָבוֹשׁ וְאֵין לְחֹם לוֹ
  choice: vous vous habillez, mais personne n’a chaud
  rationale: Le pronom hébreu singulier a ici une portée générique. « Personne n’a chaud » exprime naturellement en français l’échec des vêtements à procurer de la chaleur.
- source_word: וְהַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר
  choice: et celui qui gagne un salaire
  rationale: Le participe et le verbe de même racine mettent l’accent sur le salarié et son gain. En français, répéter « gagne un salaire gagne » serait maladroit ; la proposition conserve le sens sans reproduire artificiellement la répétition.
- source_word: אֶל צְרוֹר נָקוּב
  choice: le met dans une bourse trouée
  rationale: צְרוֹר désigne ici une bourse ou pochette servant à garder l’argent, et נָקוּב indique qu’elle est percée. « Bourse trouée » maintient l’image concrète de revenus qui disparaissent.
theological_decisions:
- issue: Sens de שָׁכְרָה dans la série des privations
  choice: sans être enivrés
  alternative: sans boire à satiété / sans avoir assez à boire
  rationale: Même si le parallélisme pourrait inviter à généraliser l’idée d’insuffisance, la racine שׁכר désigne normalement l’ivresse. Le texte conserve donc cette formulation inhabituelle au lieu de résoudre la tension par une paraphrase.
translation_notes:
  register: Français international moderne, sobre et digne. La structure rythmée et les contrastes répétés du verset sont préservés. Les formulations restent accessibles, tandis que la note sur l’enivrement signale une difficulté lexicale réelle sans l’atténuer.
