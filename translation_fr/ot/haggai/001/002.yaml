  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הָ/עָ֤ם הַ/זֶּה֙ אָֽמְר֔וּ לֹ֥א עֶת בֹּ֛א עֶת בֵּ֥ית יְהוָ֖ה לְ/הִבָּנֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/002.yaml
  text: 'Thus says Yahweh of hosts: These people say[a], “The time has not come[b], the time for the house of Yahweh to be rebuilt.”'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh des armées : « Ce peuple[a] dit : “Le moment n’est pas venu, le moment de la reconstruction de la maison de Yahweh[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « ce peuple » peut exprimer une certaine distance ou un reproche.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la construction ». L’infinitif hébreu n’exprime pas explicitement l’idée de « re- », mais le contexte postexilique indique qu’il s’agit d’une reconstruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formule française naturelle et solennelle rend la formule prophétique d’introduction, avec un présent performatif adapté au discours transmis.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, tandis que « des armées » conserve l’étendue possible du titre sans préciser s’il s’agit d’armées célestes ou terrestres.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points remplit naturellement en français la fonction de l’infinitif hébreu qui introduit les paroles rapportées.
- source_word: הָעָם הַזֶּה
  choice: Ces gens
  rationale: Cette expression est courante en français et peut conserver la nuance de distance ou de reproche portée par le démonstratif hébreu.
- source_word: אָמְרוּ
  choice: disent
  rationale: Le présent rend l’attitude actuelle et persistante rapportée par le prophète, malgré la forme accomplie du verbe hébreu.
- source_word: לֹא עֶת בֹּא עֶת
  choice: Le moment n’est pas venu, le moment où
  rationale: La formulation conserve la répétition emphatique de עֶת tout en restant intelligible et naturelle en français.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » reproduit l’image et le terme d’alliance du texte au lieu de les remplacer par l’interprétation explicite « temple ».
- source_word: לְהִבָּנוֹת
  choice: doit être reconstruite
  rationale: La tournure passive correspond au nifal hébreu; « reconstruite » explicite le contexte postexilique, et « doit » permet une construction française naturelle après « le moment où ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie directement le tétragramme; sa translittération préserve le nom propre au lieu de lui substituer un titre.
- issue: Nuance de הָעָם הַזֶּה
  choice: Ces gens
  alternative: Ce peuple
  rationale: « Ces gens » fait entendre la distance, voire le reproche, sans imposer une rupture d’alliance que le texte n’énonce pas explicitement.
- issue: Portée historique de לְהִבָּנוֹת
  choice: être reconstruite
  alternative: être construite
  rationale: Le verbe ne comporte pas en lui-même l’idée de « re- », mais le contexte postexilique montre qu’il s’agit de rétablir la maison déjà détruite; une note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique reste solennelle; la répétition de « moment » et la voix passive sont maintenues afin de préserver l’insistance et la forme du texte hébreu.
