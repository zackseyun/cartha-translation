source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע זְרֻבָּבֶ֣ל בֶּֽן שַׁלְתִּיאֵ֡ל וִ/יהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/כֹ֣ל שְׁאֵרִ֣ית הָ/עָ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/עַל דִּבְרֵי֙ חַגַּ֣י הַ/נָּבִ֔יא כַּ/אֲשֶׁ֥ר שְׁלָח֖/וֹ יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/עָ֖ם מִ/פְּנֵ֥י יְהוָֽה׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/012.yaml
  text: Then Zerubbabel son of Shealtiel[a], and Joshua son of Jehozadak, the high priest, and all the remnant of the people, listened to the voice of Yahweh their God and to the words of Haggai the prophet, as Yahweh their God had sent him[d][c][b]; and the people feared before Yahweh.
translation:
  language: fr
  text: Alors Zorobabel, fils de Shéaltiel, Josué, fils de Yehotsadaq, le grand prêtre, et tout le reste du peuple[b] écoutèrent[a] la voix de Yahweh, leur Dieu, ainsi que les paroles du prophète Aggée, comme Yahweh, leur Dieu, l’avait envoyé[c]. Et le peuple éprouva de la crainte devant Yahweh[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entendirent » ; le verbe hébreu peut désigner une écoute qui entraîne une réponse obéissante.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous ceux qui restaient du peuple » ; le mot « reste » peut aussi évoquer la communauté survivante dont parlent les prophètes.
    reason: lexical_alternative
  - marker: c
    text: Ou « puisque Yahweh, leur Dieu, l’avait envoyé ».
    reason: alternative_reading
  - marker: d
    text: Ou « fut saisi de respect devant Yahweh » ; l’hébreu peut exprimer aussi bien la peur que la crainte révérencielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: écoutèrent
  rationale: Le verbe שׁמע peut exprimer le fait d’entendre, d’écouter attentivement ou d’obéir. « Écoutèrent » suggère une réception attentive sans expliciter prématurément l’obéissance.
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: Zorobabel, fils de Shéaltiel
  rationale: Formes françaises usuelles des noms propres, proches de l’hébreu.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Josué, fils de Yehotsadaq
  rationale: « Josué » est la forme française établie de יְהוֹשֻׁעַ ; « Yehotsadaq » rend le nom hébreu de manière transparente.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: Titre français courant et exact du prêtre principal.
- source_word: שְׁאֵרִית הָעָם
  choice: tout le reste du peuple
  rationale: « Reste » demeure naturel en français tout en conservant la résonance prophétique de la communauté survivante.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיהֶם
  choice: la voix de Yahweh, leur Dieu
  rationale: La construction avec שׁמע signifie écouter la voix de quelqu’un. Le nom divin est translittéré « Yahweh ».
- source_word: דִּבְרֵי חַגַּי הַנָּבִיא
  choice: les paroles du prophète Aggée
  rationale: « Paroles » conserve le pluriel et le parallélisme avec « la voix » ; « Aggée » est la forme française établie du nom.
- source_word: כַּאֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם
  choice: puisque Yahweh, leur Dieu, l’avait envoyé
  rationale: Dans ce contexte, la proposition indique naturellement le motif de leur accueil des paroles d’Aggée. La valeur comparative ou correspondante de כַּאֲשֶׁר reste signalée en note.
- source_word: וַיִּירְאוּ הָעָם מִפְּנֵי יְהוָה
  choice: le peuple éprouva de la crainte devant Yahweh
  rationale: Cette formulation garde ouverte la nuance entre peur, respect et crainte révérencielle, tout en rendant naturellement l’expression מִפְּנֵי.
theological_decisions:
- issue: Portée prophétique de שְׁאֵרִית
  choice: tout le reste du peuple
  alternative: tous ceux qui restaient du peuple
  rationale: Le substantif « reste » peut désigner en français la communauté survivante et préserve ainsi la portée historique et théologique possible sans l’amplifier.
- issue: Nuance de שׁמע face à la parole prophétique
  choice: écoutèrent
  alternative: obéirent
  rationale: Le contexte implique une réponse favorable, mais le verbe lui-même et ses compléments directs mettent d’abord en avant l’écoute. « Obéirent » résoudrait trop fortement cette tension.
- issue: Relation exprimée par כַּאֲשֶׁר
  choice: puisque Yahweh, leur Dieu, l’avait envoyé
  alternative: comme Yahweh, leur Dieu, l’avait envoyé
  rationale: La lecture causale donne un français clair et correspond à une valeur contextuellement possible. La note conserve la lecture plus formellement comparative.
- issue: Nature de la crainte exprimée par ירא
  choice: éprouva de la crainte devant Yahweh
  alternative: fut saisi de respect devant Yahweh
  rationale: Le choix principal ne réduit pas la crainte à la terreur ni au seul respect religieux ; il maintient les deux dimensions possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement allégée par « ainsi que » et par une nouvelle phrase avant la réaction du peuple. Les noms bibliques suivent les formes françaises établies lorsqu’elles sont courantes, tandis que le tétragramme est rendu par « Yahweh ».
