  to: Alors Zorobabel, fils de Shéaltiel, Josué, fils de Yehotsadaq, le grand prêtre, et tout le reste du peuple[b] écoutèrent[a] la voix de Yahweh, leur Dieu, ainsi que les paroles du prophète Aggée, comme Yahweh, leur Dieu, l’avait envoyé[c]. Et le peuple éprouva de la crainte devant Yahweh[d].
