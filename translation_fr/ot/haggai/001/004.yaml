  text: הַ/עֵ֤ת לָ/כֶם֙ אַתֶּ֔ם לָ/שֶׁ֖בֶת בְּ/בָתֵּי/כֶ֣ם סְפוּנִ֑ים וְ/הַ/בַּ֥יִת הַ/זֶּ֖ה חָרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/004.yaml
  text: Is it a time for you yourselves to live in your paneled houses while this house lies in ruins?[a]
translation:
  language: fr
  text: Est-ce le moment, pour vous-mêmes, d’habiter dans vos maisons lambrissées, tandis que cette maison est en ruine ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maisons revêtues de lambris » ; le terme peut désigner des maisons achevées ou revêtues, notamment de bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֵת
  choice: Est-ce le moment
  rationale: La tournure interrogative reprend la question du « moment » évoqué au verset 2 et conserve le nom עֵת dans un français naturel.
- source_word: לָכֶם אַתֶּם
  choice: pour vous, oui, pour vous-mêmes
  rationale: La reprise explicite rend l’insistance produite en hébreu par le pronom indépendant אַתֶּם après לָכֶם.
- source_word: לָשֶׁבֶת
  choice: d’habiter
  rationale: Dans ce contexte domestique, ישׁב signifie habiter ou demeurer plutôt que s’asseoir. « Habiter » est actuel et maintient le lien avec les maisons.
- source_word: בְּבָתֵּיכֶם
  choice: dans vos maisons
  rationale: « Maisons » conserve l’image concrète et le contraste lexical avec « cette Maison », qui désigne le temple.
- source_word: סְפוּנִים
  choice: lambrissées
  rationale: Le participe évoque des maisons couvertes ou revêtues, probablement de bois. « Lambrissées » exprime avec concision leur état aménagé, tout en laissant place à une autre nuance en note.
- source_word: וְהַבַּיִת הַזֶּה
  choice: alors que cette Maison
  rationale: « Alors que » rend le contraste rhétorique porté par la conjonction. La majuscule éditoriale aide à signaler que la Maison est le sanctuaire sans remplacer le terme hébreu par « temple ».
- source_word: חָרֵב
  choice: est en ruine
  rationale: Cette expression française naturelle décrit l’état de dévastation durable indiqué par l’adjectif.
theological_decisions:
- issue: Référent de « cette Maison »
  choice: le temple du SEIGNEUR, désigné par « cette Maison »
  alternative: une maison quelconque
  rationale: Le contexte immédiat, notamment Aggée 1.2, 8-9, identifie clairement cette Maison au temple. Le texte conserve néanmoins la formulation hébraïque au lieu d’expliciter « temple ».
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La reprise « pour vous, oui, pour vous-mêmes » préserve l’emphase accusatrice. « Maison » reçoit une majuscule éditoriale pour le sanctuaire, tandis que le nom commun reste au pluriel et en minuscule pour les habitations.
