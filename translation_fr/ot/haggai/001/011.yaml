  text: וָ/אֶקְרָ֨א חֹ֜רֶב עַל הָ/אָ֣רֶץ וְ/עַל הֶ/הָרִ֗ים וְ/עַל הַ/דָּגָן֙ וְ/עַל הַ/תִּיר֣וֹשׁ וְ/עַל הַ/יִּצְהָ֔ר וְ/עַ֛ל אֲשֶׁ֥ר תּוֹצִ֖יא הָ/אֲדָמָ֑ה וְ/עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַ֖ל כָּל יְגִ֥יעַ כַּפָּֽיִם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/011.yaml
  text: And I called for a drought on the land and on the mountains[a], on the grain, on the new wine, on the fresh oil, on what the ground produces, on man and on beast[b], and on all the labor of the hands.
translation:
  language: fr
  text: J’ai fait venir la sécheresse sur le pays et sur les montagnes, sur les céréales, sur le vin nouveau, sur l’huile[a], sur tout ce que produit le sol, sur les êtres humains[b] et sur le bétail, ainsi que sur le produit de tout travail manuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu désigne une huile fraîche, vraisemblablement de l’huile d’olive, considérée comme un produit agricole.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’être humain » ; le singulier hébreu a ici un sens collectif et désigne les êtres humains.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: J’ai appelé
  rationale: Le verbe קרא exprime ici l’action de convoquer ou de faire venir le jugement. « J’ai appelé » conserve directement l’image et l’initiative divine.
- source_word: חֹרֶב
  choice: la sécheresse
  rationale: Dans cette liste agricole, חֹרֶב désigne naturellement une sécheresse dévastatrice plutôt qu’une désolation générale.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le contexte vise le territoire agricole de la communauté, et non la terre entière. « Le pays » convient au sens local de אֶרֶץ.
- source_word: הֶהָרִים
  choice: les montagnes
  rationale: Rendu direct de הָרִים, qui maintient la portée géographique et le registre prophétique.
- source_word: הַדָּגָן
  choice: le blé
  rationale: דָּגָן désigne les céréales ou le grain. « Le blé » est ici une formulation agricole courante en français, employée collectivement.
- source_word: הַתִּירוֹשׁ
  choice: le vin nouveau
  rationale: תִּירוֹשׁ désigne le produit récent de la vigne, souvent le moût ou le vin nouveau. Ce choix conserve sa distinction avec le vin en général.
- source_word: הַיִּצְהָר
  choice: l’huile
  rationale: יִצְהָר désigne l’huile fraîche comme produit agricole, normalement l’huile d’olive. Le texte principal reste naturel, tandis que la précision est signalée en note.
- source_word: אֲשֶׁר תּוֹצִיא הָאֲדָמָה
  choice: tout ce que produit le sol
  rationale: Cette formulation garde la portée générale de la proposition et l’image concrète de la production du sol.
- source_word: הָאָדָם
  choice: les êtres humains
  rationale: אָדָם est ici un singulier collectif et générique opposé aux animaux. Le pluriel français exprime clairement cette valeur sans restriction de sexe.
- source_word: הַבְּהֵמָה
  choice: le bétail
  rationale: Dans ce contexte agraire, בְּהֵמָה renvoie très probablement aux animaux domestiques. « Le bétail » est précis et naturel.
- source_word: כָּל יְגִיעַ כַּפָּיִם
  choice: tout le travail de leurs mains
  rationale: Le syntagme désigne le labeur humain et ce qu’il permet d’obtenir. Cette traduction conserve l’image des mains tout en restant idiomatique.
theological_decisions:
- issue: Valeur générique de הָאָדָם
  choice: les êtres humains
  alternative: l’être humain ; l’humanité ; l’homme
  rationale: Le nom désigne ici l’ensemble des humains, en contraste avec le bétail. « Les êtres humains » rend explicitement cette portée générique, tandis que la note conserve la forme collective singulière de l’hébreu.
translation_notes:
  register: Français moderne, international et digne, avec la répétition de « sur » maintenue pour restituer l’accumulation rhétorique de l’hébreu. Les termes agricoles sont concrets et accessibles ; le parallélisme entre humains, bétail et travail manuel demeure visible.
