revisions:
- from: J’ai appelé la sécheresse sur le pays et sur les montagnes, sur le blé, sur le vin nouveau, sur l’huile[a], sur tout ce que produit le sol, sur les êtres humains[b] et sur le bétail, ainsi que sur tout le travail de leurs mains.
  to: J’ai fait venir la sécheresse sur le pays et sur les montagnes, sur les céréales, sur le vin nouveau, sur l’huile[a], sur tout ce que produit le sol, sur les êtres humains[b] et sur le bétail, ainsi que sur le produit de tout travail manuel.
  rationale: La révision élargit « blé » à « céréales », plus fidèle à la portée de דָּגָן ; elle emploie « J’ai fait venir » pour un français prophétique naturel et fidèle à l’action divine exprimée par קרא ; elle affine la note lexicale sur l’huile. La dernière expression est formulée de manière idiomatique en français tout en gardant l’idée du produit et de l’effort des mains.
