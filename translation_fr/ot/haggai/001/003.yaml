  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה בְּ/יַד חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/003.yaml
  text: Then the word of Yahweh came by the hand of Haggai the prophet[a], saying,
translation:
  language: fr
  text: 'Alors, la parole de Yahweh fut adressée par l’intermédiaire[a] du prophète Aggée, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main du prophète Aggée » ; cette expression hébraïque indique que la parole a été adressée par son intermédiaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors, … fut transmise
  rationale: La forme narrative fait progresser le récit et introduit un nouvel événement. « Alors » restitue naturellement cet enchaînement en français.
- source_word: דְּבַר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message venant de Dieu. « La parole » conserve l’expression biblique établie sans réduire le terme à une simple information.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression signifie littéralement « par la main de » et marque ici l’agent médiateur. « Par l’intermédiaire de » en exprime clairement le sens idiomatique dans un français naturel.
- source_word: חַגַּי
  choice: Aggée
  rationale: « Aggée » est la forme française traditionnelle et immédiatement reconnaissable du nom du prophète.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Le titre apposé précise la fonction d’Aggée et se rend directement ainsi en français.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit les paroles divines qui suivent. « En ces termes : » remplit naturellement cette fonction en français.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le verset emploie directement le tétragramme. La forme « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Médiation prophétique exprimée par בְּיַד
  choice: par l’intermédiaire du prophète Aggée
  alternative: par la main du prophète Aggée
  rationale: Le choix principal rend la fonction d’agent médiateur sans imposer au français un idiome hébreu peu courant; la note conserve toutefois l’image littérale.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la formule prophétique « la parole de Yahweh » tout en rendant idiomatiquement la médiation d’Aggée et l’introduction du discours à venir.
