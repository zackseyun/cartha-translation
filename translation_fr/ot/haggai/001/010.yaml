  text: עַל כֵּ֣ן עֲלֵי/כֶ֔ם כָּלְא֥וּ שָמַ֖יִם מִ/טָּ֑ל וְ/הָ/אָ֖רֶץ כָּלְאָ֥ה יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/010.yaml
  text: Therefore the heavens above you have withheld the dew[a], and the earth has withheld its produce.
translation:
  language: fr
  text: C’est pourquoi, au-dessus de vous, les cieux ont retenu la rosée, et la terre a retenu son produit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays » au lieu de « la terre » ; ou « son rendement » au lieu de « son produit ». L’hébreu אֶרֶץ peut signifier « terre » ou « pays », et יְבוּל « produit » ou « rendement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution exprime clairement la conséquence et relie le verset au reproche précédent.
- source_word: עֲלֵיכֶם
  choice: au-dessus de vous
  rationale: Avec « les cieux », la valeur spatiale de la préposition est la plus naturelle.
- source_word: כָּלְאוּ / כָּלְאָה
  choice: ont retenu / a retenu
  rationale: Le verbe כלא signifie ici empêcher ou garder en réserve. « Retenir » convient naturellement à la rosée comme aux récoltes et conserve la répétition hébraïque.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel français maintient le registre biblique et le parallélisme avec « la terre ».
- source_word: מִטָּל
  choice: la rosée
  rationale: Après כלא, la préposition מן indique ce qui est refusé; l’expression idiomatique française est « retenir la rosée ».
- source_word: וְהָאָרֶץ
  choice: et la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. Le couple « les cieux… la terre » favorise ici « la terre », sans exclure le sens agricole local.
- source_word: יְבוּלָהּ
  choice: ses récoltes
  rationale: יְבוּל désigne ce que la terre produit. « Ses récoltes » est naturel et immédiatement compréhensible, tandis que la note conserve l’alternative plus formelle « son produit ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La répétition de « retenir » reproduit le parallélisme hébreu, tandis que « les cieux » conserve la tonalité biblique sans archaïsme excessif.
