base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/001.yaml
  text: 'In the second year of King Darius[a], in the sixth month, on the first day of the month, the word of Yahweh came by the hand of Haggai the prophet to Zerubbabel son of Shealtiel, governor of Judah, and to Joshua son of Jehozadak, the high priest, saying:'
translation:
  language: fr
  text: 'La deuxième année du règne du roi Darius, le premier jour du sixième mois, la parole de Yahweh fut adressée, par l’intermédiaire du prophète Aggée[a], à Zorobabel, fils de Shéaltiel, gouverneur de Juda, et à Josué, fils de Yehotsadaq, le grand prêtre, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main du prophète Aggée ».'
    reason: L’idiome hébreu בְּיַד exprime ici l’intermédiaire ou l’agent de la transmission.
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: La deuxième année du roi Darius
  rationale: La formule de datation royale est rendue dans un français naturel, sans ajouter « du règne », absent du texte mais implicite.
- source_word: בַּחֹדֶשׁ הַשִּׁשִּׁי בְּיוֹם אֶחָד לַחֹדֶשׁ
  choice: le premier jour du sixième mois
  rationale: Le cardinal hébreu « un » a ici une valeur ordinale. L’ordre français place naturellement le jour avant le mois, sans introduire un nom de mois absent de l’hébreu.
- source_word: הָיָה דְבַר יְהוָה
  choice: la parole de Yahweh parvint
  rationale: « Parvint » exprime naturellement en français la venue de la parole prophétique tout en conservant la formule où « la parole de Yahweh » reste le sujet.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: par l’intermédiaire du prophète Aggée
  rationale: L’expression hébraïque signifie littéralement « par la main de » et marque ici l’intermédiaire humain. La formulation choisie est claire et idiomatique en français moderne.
- source_word: פַּחַת יְהוּדָה
  choice: gouverneur de Juda
  rationale: פֶּחָה désigne ici le gouverneur provincial de Juda sous l’administration perse.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: Équivalent français usuel et précis du titre sacerdotal.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule introduit naturellement en français le discours direct annoncé par le verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le caractère de nom propre sans substituer un titre.
- issue: Médiation exprimée par בְּיַד
  choice: par l’intermédiaire du prophète Aggée
  alternative: par la main du prophète Aggée
  rationale: Le choix conserve la notion d’agence prophétique sans donner à l’idiome hébreu une tournure artificielle en français. La traduction littérale est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent des formes françaises bibliques courantes. La syntaxe conserve la longue formule de datation et d’adresse du texte hébreu tout en restant lisible.
