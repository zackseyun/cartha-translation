source:
  edition: WLC
  text: פָּנֹ֤ה אֶל הַרְבֵּה֙ וְ/הִנֵּ֣ה לִ/מְעָ֔ט וַ/הֲבֵאתֶ֥ם הַ/בַּ֖יִת וְ/נָפַ֣חְתִּי ב֑/וֹ יַ֣עַן מֶ֗ה נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת יַ֗עַן בֵּיתִ/י֙ אֲשֶׁר ה֣וּא חָרֵ֔ב וְ/אַתֶּ֥ם רָצִ֖ים אִ֥ישׁ לְ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/009.yaml
  text: You looked for much[a], but behold, it was little; and when you brought it home, I blew it away. Why? declares Yahweh of Armies. Because of my house, which lies in ruins[b], while each of you runs to his own house.
translation:
  language: fr
  text: 'Vous comptiez sur une récolte abondante, mais voici : elle a été maigre. Vous l’avez rapportée chez vous, et j’ai soufflé dessus[a]. Pourquoi donc ? — déclaration de Yahvé des armées[b]. Parce que ma maison reste en ruine, alors que chacun de vous court vers sa propre maison.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je l’ai dispersée d’un souffle ». Le verbe hébreu signifie littéralement « souffler » ; dans ce contexte, le souffle de Dieu peut évoquer la disparition ou la réduction de la récolte sous son jugement.'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « l’Éternel des armées » ; on trouve aussi « le Seigneur de l’univers » ou « le Seigneur des puissances ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנֹה אֶל הַרְבֵּה
  choice: Vous comptiez sur une récolte abondante
  rationale: L’expression associe l’idée de se tourner vers quelque chose à « beaucoup ». Dans le contexte agricole, elle indique l’attente d’une récolte abondante. Le mot « récolte » explicite le référent implicite sans changer le sens.
- source_word: וְהִנֵּה לִמְעָט
  choice: 'mais voyez : elle a été maigre'
  rationale: הִנֵּה attire vivement l’attention, rendu naturellement par « voyez ». לִמְעָט indique que le résultat s’est réduit à peu ; « récolte maigre » est une formulation française courante.
- source_word: וַהֲבֵאתֶם הַבַּיִת
  choice: Vous l’avez rapportée chez vous
  rationale: Ici, הַבַּיִת désigne vraisemblablement le domicile des destinataires, par contraste avec « ma maison » plus loin. Le pronom reprend la récolte implicite.
- source_word: וְנָפַחְתִּי בוֹ
  choice: j’ai soufflé dessus
  rationale: נפח signifie littéralement « souffler ». Cette traduction conserve l’image hébraïque et laisse ouverte la portée exacte du geste divin ; une note indique l’interprétation possible « je l’ai dispersée d’un souffle ».
- source_word: יַעַן מֶה
  choice: Pourquoi donc ?
  rationale: La formule introduit une question rhétorique demandant la raison du jugement. « donc » renforce naturellement le lien avec ce qui précède.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclaration de Yahvé des armées
  rationale: נְאֻם est une formule prophétique solennelle. « Yahvé » représente le nom divin יְהוָה, et « des armées » traduit le sens martial et pluriel de צְבָאוֹת.
- source_word: יַעַן בֵּיתִי אֲשֶׁר הוּא חָרֵב
  choice: Parce que ma maison reste en ruine
  rationale: חָרֵב décrit ce qui est dévasté ou en ruine. « reste » fait ressortir l’état persistant du temple négligé sans surcharger la phrase.
- source_word: וְאַתֶּם רָצִים אִישׁ לְבֵיתוֹ
  choice: alors que chacun de vous s’empresse de s’occuper de sa propre maison
  rationale: רָצִים signifie littéralement « vous courez », mais exprime ici l’empressement et la priorité accordée aux maisons privées. La tournure distributive אִישׁ לְבֵיתוֹ est rendue par « chacun de vous… sa propre maison ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » distingue le nom personnel de Dieu d’un simple titre tout en restant immédiatement reconnaissable en français.
- issue: Rendu du titre צְבָאוֹת
  choice: des armées
  alternative: de l’univers ; des puissances ; des armées célestes
  rationale: Le mot désigne des armées ou des forces organisées. La traduction directe préserve la force martiale du titre sans préciser arbitrairement s’il s’agit ici d’armées terrestres ou célestes.
- issue: Contraste entre la maison de Dieu et les maisons privées
  choice: ma maison… sa propre maison
  alternative: mon temple… sa maison
  rationale: La répétition de בַּיִת crée un contraste rhétorique important. Conserver « maison » dans les deux membres préserve ce jeu tout en laissant le contexte identifier la première comme le temple.
translation_notes:
  register: Français international moderne, digne et accessible. « Récolte abondante » et « récolte maigre » rendent explicite le contexte agricole. La formulation conserve la question rhétorique, la formule prophétique et le contraste répété entre « ma maison » et « sa propre maison ».
