id: HAG.1.5
reference: Haggai 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֕ה כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/005.yaml
  text: 'Now therefore[a], thus says Yahweh of hosts: Set your heart on your ways.'
translation:
  language: fr
  text: 'Maintenant donc, ainsi parle Yahweh des armées : « Examinez attentivement votre conduite[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Placez votre cœur sur vos chemins. »'
    reason: La note conserve l’image concrète du texte hébreu derrière l’expression idiomatique « Examinez attentivement votre conduite ».
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Le waw joint à l’adverbe temporel marque ici une transition qui tire la conséquence du reproche précédent. « Maintenant donc » conserve à la fois la progression du discours et sa force exhortative.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Cette formule française, naturelle dans le registre prophétique, rend la formule hébraïque du messager et l’autorité actuelle de la proclamation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé dans le texte hébreu, sans lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Dans le titre divin, « des armées » conserve l’image de Yahweh souverain des puissances célestes et terrestres sans restreindre explicitement le terme à un seul domaine.
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Examinez attentivement
  rationale: Littéralement, l’expression demande de « placer son cœur » ; dans ce contexte, elle appelle à une réflexion sérieuse et volontaire. La formulation choisie communique clairement cet idiome en français moderne.
- source_word: עַל דַּרְכֵיכֶם
  choice: votre conduite
  rationale: Le pluriel « vos chemins » désigne métaphoriquement la manière de vivre. « Votre conduite » exprime naturellement ce sens en français tout en évitant l’impression de chemins matériels.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: des puissances célestes
  rationale: L’hébreu ne précise pas ici si les armées sont célestes, terrestres ou les deux. Le rendu retenu préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. « Ainsi parle » maintient le registre prophétique sans archaïsme excessif ; l’impératif pluriel s’adresse collectivement au peuple.
