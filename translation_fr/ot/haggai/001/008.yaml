source:
  edition: WLC
  text: עֲל֥וּ הָ/הָ֛ר וַ/הֲבֵאתֶ֥ם עֵ֖ץ וּ/בְנ֣וּ הַ/בָּ֑יִת וְ/אֶרְצֶה בּ֥/וֹ ו/אכבד אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/008.yaml
  text: Go up into the hills[a], bring wood, and build the house, so that I may take pleasure in it and be glorified[c][b], says Yahweh.
translation:
  language: fr
  text: Montez dans la région montagneuse[a], apportez du bois et construisez la Maison[b]. J’y prendrai plaisir et je serai glorifié[c], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la montagne », « dans les collines » ou « dans les hauteurs ». Le mot hébreu peut désigner une montagne, une colline ou une région montagneuse.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le Temple ; littéralement « la maison ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je serai honoré ». Le verbe hébreu peut exprimer le fait d’être glorifié ou honoré.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲלוּ
  choice: Montez
  rationale: L’impératif pluriel de עלה exprime simplement l’action de monter; « Montez » est direct et naturel en français.
- source_word: הָהָר
  choice: dans la région montagneuse
  rationale: הַר peut désigner une montagne, une colline ou une région de hauteurs. Le contexte de la collecte du bois favorise ici un sens régional sans exclure les autres possibilités.
- source_word: וַהֲבֵאתֶם עֵץ
  choice: rapportez du bois
  rationale: Le hiphil de בוא signifie « faire venir, apporter ». Dans la séquence « montez… puis apportez », « rapportez » est idiomatique; עֵץ est employé comme nom de matière.
- source_word: וּבְנוּ הַבַּיִת
  choice: et construisez la Maison
  rationale: בנה signifie « construire », sans imposer explicitement « reconstruire ». La majuscule à « Maison » signale naturellement en français qu’il s’agit de la demeure cultuelle de Yahweh, tout en conservant l’image hébraïque plutôt que de la remplacer dans le texte par « Temple ».
- source_word: וְאֶרְצֶה בּוֹ
  choice: J’y prendrai plaisir
  rationale: רצה peut exprimer le plaisir, l’agrément ou l’accueil favorable. Le pronom בּוֹ renvoie à la Maison et se rend naturellement par « y ».
- source_word: ואכבד
  choice: et j’y serai glorifié
  rationale: 'La tradition massorétique marginale invite à lire וְאֶכָּבֵד, niphal de כבד: « je serai glorifié/honoré ». L’ajout de « y » explicite en français le cadre que fournit la Maison sans résoudre davantage le sens.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Valeur de וְאֶרְצֶה… וְאֶכָּבֵד après les impératifs
  choice: 'Deux déclarations de la réponse divine: « J’y prendrai plaisir et j’y serai glorifié »'
  alternative: 'Une proposition de but: « afin que j’y prenne plaisir et que j’y sois glorifié »'
  rationale: Les formes verbales peuvent être comprises comme la conséquence ou le but des actions commandées. La formulation retenue suit leur valeur déclarative naturelle tout en laissant le lien logique découler du contexte.
- issue: Identification de הַבַּיִת
  choice: la Maison
  alternative: le Temple
  rationale: Dans le contexte, le référent est bien le Temple, mais l’hébreu dit littéralement « la maison ». Le maintien de cette image conserve l’idiome théologique du texte.
- issue: Sens de וְאֶכָּבֵד
  choice: je serai glorifié
  alternative: je serai honoré
  rationale: Le niphal de כבד permet les deux nuances. « Glorifié » conserve le poids cultuel et théologique du terme, tandis qu’une note préserve l’autre traduction légitime.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs sont directs. « Maison » conserve l’image hébraïque tout en indiquant par la majuscule son emploi cultuel; les notes rendent visibles les principales ambiguïtés lexicales.
