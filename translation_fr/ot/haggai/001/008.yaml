    rationale: Le suffixe בוֹ est explicitement rattaché à וְאֶרְצֶה (« je prendrai plaisir en elle »). Le verbe suivant ne porte pas de complément locatif explicite. « Je serai glorifié » préserve mieux la syntaxe et évite d’ajouter « dans la Maison ».
  - severity: low
    issue: « rapportez du bois » implique un retour
    rationale: Le verbe hébreu signifie « apporter / faire venir ». Dans ce contexte, « rapportez » est possible, mais « apportez » est plus neutre et plus directement fidèle.
