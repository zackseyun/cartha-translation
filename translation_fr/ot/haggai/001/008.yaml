  source_fidelity: 'Le sens général est fidèle : les trois impératifs, le bois, la construction de la maison et la réponse divine sont bien rendus. Toutefois, le pronom hébreu בוֹ (« en elle / à son sujet ») dépend explicitement de « je prendrai plaisir » ; il ne suit pas explicitement « je serai glorifié ». La répétition de « y » dans la seconde proposition ajoute donc une localisation que le texte hébreu ne formule pas. « Apportez » rend aussi plus directement le hiphil de בוא que « rapportez », lequel introduit l’idée d’un retour au point de départ.'
  naturalness: La formulation révisée reste naturelle, claire et digne en français international moderne. « Montez dans la région montagneuse » est défendable pour le sens collectif de הָהָר, et les impératifs coordonnés sont fluides.
  terminology: « Yahweh » rend correctement le tétragramme. « la Maison », avec majuscule et note explicative, conserve l’expression « la maison » tout en signalant son référent cultuel. « Glorifié » et l’alternative « honoré » rendent convenablement l’ambiguïté de ואכבד/וְאֶכָּבְדָה.
