  text: le vingt-quatrième jour du sixième mois, dans la deuxième année du roi Darius.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם
  choice: le … jour
  rationale: 'Dans une formule de datation, la préposition בְּ est rendue naturellement en français sans préposition devant la date : « le … jour ».'
- source_word: עֶשְׂרִים וְאַרְבָּעָה
  choice: vingt-quatrième
  rationale: Bien que l’hébreu emploie littéralement les cardinaux « vingt et quatre », le français utilise l’ordinal dans une date.
- source_word: לַחֹדֶשׁ בַּשִּׁשִּׁי
  choice: du sixième mois
  rationale: Cette formulation rend de façon idiomatique la désignation hébraïque du mois par son rang.
- source_word: בִּשְׁנַת שְׁתַּיִם
  choice: la deuxième année
  rationale: Il s’agit de la formule habituelle indiquant l’année de règne; le français emploie naturellement l’ordinal.
- source_word: לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: du roi Darius
  rationale: L’ordre « roi Darius » est naturel en français, tandis que l’article défini de l’hébreu est conservé dans la construction « du roi ».
