  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/007.yaml
  text: 'Thus says Yahweh of hosts: Consider your ways.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh des armées : « Réfléchissez bien à votre conduite.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Prenez à cœur vos chemins. »'
    reason: La note conserve l’image hébraïque du cœur et des chemins, tandis que le texte principal en donne le sens idiomatique.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend naturellement en français actuel la formule prophétique d’introduction, tout en conservant sa solennité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Préserve le sens large du titre hébreu sans préciser indûment s’il s’agit d’armées célestes ou terrestres.
- source_word: שִׂימוּ לְבַבְכֶם עַל
  choice: Réfléchissez bien à
  rationale: Exprime clairement l’idiome hébreu qui demande de diriger avec attention son cœur et sa pensée vers quelque chose.
- source_word: דַּרְכֵיכֶם
  choice: votre conduite
  rationale: Dans ce contexte, les « chemins » désignent la manière d’agir et le cours de la vie; « conduite » transmet ce sens moral en français naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » reste proche du terme hébreu et en préserve l’amplitude, sans imposer une interprétation cosmique particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Voici ce que dit » est prophétique sans archaïsme; l’impératif pluriel s’adresse collectivement aux destinataires.
