source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חַגַּ֞י מַלְאַ֧ךְ יְהוָ֛ה בְּ/מַלְאֲכ֥וּת יְהוָ֖ה לָ/עָ֣ם לֵ/אמֹ֑ר אֲנִ֥י אִתְּ/כֶ֖ם נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/013.yaml
  text: Then Haggai[a], the messenger of Yahweh, spoke to the people with Yahweh’s message, saying[b], “I am with you,” declares Yahweh.
translation:
  language: fr
  text: 'Alors Aggée, messager de Yahweh[a], parla au peuple dans sa fonction de messager de Yahweh[b] : « Je suis avec vous », déclare Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « messager » désigne Aggée comme l’envoyé de Yahweh, et non comme un être angélique.
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque peut aussi évoquer la mission confiée à Aggée ou le message de Yahweh qu’il transmet. Littéralement, elle se rapporte à sa fonction de messager de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … parla
  rationale: Le verbe signifie couramment « dire ». Avec le complément « au peuple » et la citation qui suit, « parla » donne en français une tournure naturelle tout en conservant la progression narrative.
- source_word: מַלְאַךְ יְהוָה
  choice: messager de Yahweh
  rationale: Aggée est explicitement identifié comme l’envoyé humain de Yahweh. « Messager » convient donc mieux qu’« ange », qui évoquerait à tort un être céleste distinct.
- source_word: בְּמַלְאֲכוּת יְהוָה
  choice: en vertu de la mission reçue de Yahweh
  rationale: Le nom rare מַלְאֲכוּת peut désigner la fonction de messager, la mission confiée ou, par extension, le message transmis. Cette formulation exprime clairement que le prophète parle avec l’autorité du mandat divin, tandis qu’une note conserve les autres nuances possibles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh » plutôt que par le titre traditionnel « le Seigneur ».
- source_word: לָעָם
  choice: au peuple
  rationale: Dans le contexte, il s’agit de la communauté à laquelle le prophète s’adresse ; « le peuple » est la formulation française la plus directe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit la citation. En français moderne, les deux-points remplissent naturellement cette fonction sans l’expression lourde « en disant ».
- source_word: אֲנִי אִתְּכֶם
  choice: Je suis avec vous
  rationale: Cette traduction simple et directe préserve la portée relationnelle et théologique de la formule ; « vous » exprime ici le pluriel d’après le contexte.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique affirme l’autorité divine de la parole. « Déclare Yahweh » est digne, clair et actuel.
theological_decisions:
- issue: Sens de מַלְאַךְ appliqué à Aggée
  choice: messager humain
  alternative: ange de Yahweh
  rationale: L’apposition au nom d’Aggée identifie le prophète comme l’envoyé de Yahweh, et non comme un être angélique. « Ange » introduirait ici une distinction personnelle étrangère au contexte.
- issue: Nuance de בְּמַלְאֲכוּת יְהוָה
  choice: mission reçue de Yahweh
  alternative: message de Yahweh / en qualité de messager de Yahweh
  rationale: L’expression peut viser la mission, la fonction ou le message du messager. Le texte principal retient le mandat divin, adapté à la préposition בְּ, et la note signale l’ambiguïté lexicale réelle.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Employer « Yahweh » préserve le caractère personnel du nom divin présent dans le texte hébreu, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la solennité de la déclaration divine sans archaïsme. La répétition du nom « Yahweh » reflète celle du texte hébreu.
