id: NAM.3.11
reference: Nahum 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/011.yaml
  text: You too will become drunk[a]; you will be hidden[b]. You too will seek a refuge from the enemy.
translation:
  language: fr
  text: Toi aussi, tu deviendras ivre[a] ; tu seras cachée. Toi aussi, tu chercheras un refuge contre l’ennemi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image de l’ivresse évoque probablement le fait d’être accablée et de chanceler sous le jugement, et non seulement une intoxication littérale.
    reason: cultural_note
  - marker: b
    text: Ou « une place forte pour te protéger de l’ennemi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: Toi aussi
  rationale: La formule répétée souligne que Ninive connaîtra à son tour le sort de No-Amon. Le féminin singulier est conservé, la ville étant personnifiée.
- source_word: תִּשְׁכְּרִי
  choice: tu deviendras ivre
  rationale: Le qal inaccompli de שׁכר exprime ici l’entrée dans l’état d’ivresse. Cette image concrète peut évoquer, dans le langage prophétique, l’accablement et le vacillement sous le jugement, sans que cette interprétation soit incorporée au texte principal.
- source_word: תְּהִי נַעֲלָמָה
  choice: tu seras cachée
  rationale: La traduction conserve la valeur passive et résultative de la construction, sans lui substituer l’interprétation possible « tu disparaîtras ».
- source_word: תְּבַקְשִׁי
  choice: tu chercheras
  rationale: Le piel de בקש signifie couramment chercher ou tenter d’obtenir. « Chercheras » convient au registre prophétique tout en restant naturel.
- source_word: מָעוֹז
  choice: un refuge
  rationale: מָעוֹז désigne un lieu ou un moyen de protection et de sécurité. « Refuge » rend clairement sa fonction dans ce contexte, tandis que « place forte » demeure une possibilité lexicale.
- source_word: מֵאוֹיֵב
  choice: contre l’ennemi
  rationale: La préposition מִן indique ici la protection recherchée face à la menace ennemie. En français, « un refuge contre l’ennemi » exprime naturellement cette relation.
theological_decisions:
- issue: Portée de l’image de l’ivresse
  choice: Conserver l’image concrète « tu deviendras ivre » dans le texte principal
  alternative: Expliciter « tu chancelleras sous le jugement »
  rationale: Le contexte prophétique suggère probablement une ivresse métaphorique liée au jugement, mais le verset ne nomme pas explicitement la colère divine. La traduction préserve donc l’image et signale sa portée probable en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement féminin singulier restitue l’adresse directe à Ninive personnifiée. La répétition de « Toi aussi » est maintenue pour préserver l’insistance rhétorique de l’hébreu.
