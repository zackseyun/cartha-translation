source:
  edition: WLC
  text: כּ֥וּשׁ עָצְמָ֛/ה וּ/מִצְרַ֖יִם וְ/אֵ֣ין קֵ֑צֶה פּ֣וּט וְ/לוּבִ֔ים הָי֖וּ בְּ/עֶזְרָתֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/009.yaml
  text: Cush was her strength[a], and Egypt without end[d][c][b]; Put and the Libyans were among your helpers.
translation:
  language: fr
  text: Koush était sa force[a][b], et l’Égypte aussi, sans limites. Pouth[c] et les Libyens[d] faisaient partie de tes soutiens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu change de personne au cours du verset : « sa force » est à la troisième personne du féminin singulier, tandis que « tes soutiens » est à la deuxième personne du féminin singulier. Ce changement est conservé dans la traduction.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction, par harmonisation avec la suite : « Koush était ta force ». Le suffixe du texte hébreu signifie toutefois littéralement « sa ».'
    reason: alternative_reading
  - marker: c
    text: Le nom « Pouth » est aussi transcrit « Pout » ou, traditionnellement, « Phout ».
    reason: lexical_alternative
  - marker: d
    text: L’hébreu porte « Loubim », nom qui désigne vraisemblablement des peuples libyens.
    reason: cultural_note
lexical_decisions:
- source_word: כּוּשׁ
  choice: Koush
  rationale: Le nom propre est translittéré plutôt que remplacé par « Éthiopie », équivalent géographique plus interprétatif.
- source_word: עָצְמָהּ
  choice: était sa force
  rationale: Le suffixe hébreu est à la troisième personne du féminin singulier. « Force » rend naturellement l’idée de puissance ou de ressources militaires.
- source_word: וּמִצְרַיִם וְאֵין קֵצֶה
  choice: et l’Égypte aussi, sans limites
  rationale: Cette formulation garde la construction hébraïque compacte et l’idée d’une puissance ou de ressources sans mesure, sans préciser abusivement ce qui était illimité.
- source_word: פּוּט
  choice: Pouth
  rationale: Translittération française moderne du nom propre hébreu.
- source_word: לוּבִים
  choice: les Libyens
  rationale: L’ethnonyme hébreu désigne vraisemblablement des peuples libyens; l’équivalent français est plus clair qu’une simple translittération.
- source_word: בְּעֶזְרָתֵךְ
  choice: faisaient partie de tes soutiens
  rationale: La tournure exprime que Pouth et les Libyens comptaient parmi les forces qui apportaient leur aide à la ville; elle conserve la deuxième personne du singulier.
theological_decisions:
- issue: Changement de personne grammaticale dans le verset
  choice: Conserver « sa force » puis « tes soutiens »
  alternative: Harmoniser en « ta force » puis « tes soutiens »
  rationale: Le texte massorétique passe réellement de la troisième personne féminine à la deuxième personne féminine. Conserver cette tension évite de corriger silencieusement le texte.
translation_notes:
  register: Français international actuel, clair et digne. La formulation conserve la concision de l’hébreu, le changement inattendu de personne grammaticale et l’indétermination relative de l’expression « sans limites ».
