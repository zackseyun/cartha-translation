source:
  edition: WLC
  text: ה֖וֹי עִ֣יר דָּמִ֑ים כֻּלָּ֗/הּ כַּ֤חַשׁ פֶּ֨רֶק֙ מְלֵאָ֔ה לֹ֥א יָמִ֖ישׁ טָֽרֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/001.yaml
  text: Woe to the city of bloodshed[a], all of it full of lies, full of plunder[d][c][b]; prey never departs.
translation:
  language: fr
  text: Malheur à la ville sanguinaire[a], tout entière pleine de mensonge, pleine de rapines[b] ! La proie ne s’en va jamais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ville de sangs », expression désignant une ville marquée par les meurtres et coupable de sang versé.
    reason: lexical_alternative
  - marker: b
    text: Ou « pillages » ; le mot hébreu évoque le fait de dépouiller par la violence.
    reason: lexical_alternative
  - marker: c
    text: Ou « la proie ne cesse jamais », au sens où la violence prédatrice de la ville se poursuit sans fin.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule conserve la force de lamentation et de dénonciation de l’interjection prophétique.
- source_word: עִיר דָּמִים
  choice: la ville sanguinaire
  rationale: 'Littéralement « ville de sangs » : cette expression idiomatique désigne une ville marquée par les meurtres et coupable de sang versé.'
- source_word: כֻּלָּהּ
  choice: tout entière
  rationale: L’expression renvoie à la ville dans son ensemble et en souligne la corruption généralisée.
- source_word: כַּחַשׁ
  choice: mensonge
  rationale: Le nom désigne la fausseté ou la tromperie ; « mensonge » est direct, naturel et accusateur.
- source_word: פֶּרֶק
  choice: rapines
  rationale: Le terme évoque l’action de dépouiller par la violence ainsi que ce qui est ainsi arraché ; « rapines » préserve cette nuance prédatrice.
- source_word: מְלֵאָה
  choice: pleine de
  rationale: La répétition rend la structure hébraïque et insiste sur ce dont la ville est remplie.
- source_word: לֹא יָמִישׁ
  choice: Jamais … ne lui échappe
  rationale: Le verbe exprime le fait de se retirer ou de s’éloigner ; appliqué à la proie, cette formulation naturelle suggère qu’elle reste constamment à la disposition de la ville.
- source_word: טָרֶף
  choice: la proie
  rationale: « Proie » conserve l’image animale et prédatrice qui caractérise la violence de la ville.
theological_decisions:
- issue: Portée de לֹא יָמִישׁ טָרֶף
  choice: Jamais la proie ne lui échappe
  alternative: La proie ne cesse jamais
  rationale: L’hébreu peut décrire soit la présence constante de proies, soit la continuité de l’activité prédatrice. La traduction principale conserve le sens verbal de retrait tout en laissant la violence persistante implicite ; la note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. « Ville sanguinaire » restitue avec vigueur l’accusation prophétique ; « rapines », légèrement littéraire mais encore transparent, maintient la nuance de prise violente. La répétition « pleine de » suit l’insistance de l’hébreu.
