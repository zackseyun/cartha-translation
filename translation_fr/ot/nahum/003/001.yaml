  source_fidelity: « Malheur à » restitue bien הוֹי, et « ville sanguinaire » rend naturellement l’idiome עיר דמים. La répétition « pleine de » reflète l’insistance de la construction hébraïque. En revanche, « Jamais la proie ne lui échappe » introduit l’idée explicite d’une proie qui tente d’échapper à la ville, ainsi que le complément « lui », absents du texte. Le verbe hébreu exprime plus sobrement le non-départ ou la permanence de la proie.
  naturalness: Le français est globalement fluide et d’un registre prophétique approprié. « La proie ne s’en va jamais » est plus fidèle à l’absence de complément exprimé en hébreu tout en restant idiomatique. « Rapines » est compréhensible, mais un peu livresque; il reste défendable dans ce registre et correspond à la saisie violente évoquée par פֶּרֶק.
  terminology: « Ville sanguinaire », « mensonge », « rapines » et « proie » sont des choix recevables. La note sur « ville de sangs » explique utilement l’idiome. La note finale doit décrire l’alternative sans imposer une relation d’échappement qui n’est pas formulée dans le texte source.
