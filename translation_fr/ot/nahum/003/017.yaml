  text: מִנְּזָרַ֨יִ/ךְ֙ כָּֽ/אַרְבֶּ֔ה וְ/טַפְסְרַ֖יִ/ךְ כְּ/ג֣וֹב גֹּבָ֑י הַֽ/חוֹנִ֤ים בַּ/גְּדֵרוֹת֙ בְּ/י֣וֹם קָרָ֔ה שֶׁ֤מֶשׁ זָֽרְחָה֙ וְ/נוֹדַ֔ד וְ/לֹֽא נוֹדַ֥ע מְקוֹמ֖/וֹ אַיָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/017.yaml
  text: Your guards are like locusts[a], and your scribes like swarms of locusts, settling on the walls on a cold day. The sun rises, and they fly away[d][c][b]; no one knows where they are.
translation:
  language: fr
  text: Tes dignitaires sont comme des criquets[a], et tes hauts fonctionnaires[b] comme des nuées de criquets qui se posent sur les clôtures[c] par un jour froid. Le soleil se lève, et ils s’envolent ; on ne sait où ils sont[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes hommes couronnés », « tes princes », « tes hommes consacrés » ou, selon une interprétation contextuelle, « tes gardes » ; le terme hébreu est rare et son sens est discuté.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes scribes », « tes officiers » ou « tes chefs militaires ».
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut aussi désigner des murs, des enclos ou des haies.
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement, la fin de l’hébreu dit approximativement : « son lieu n’est pas connu — où sont-ils ? » Le passage du singulier au pluriel fait partie de l’expression originale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְּזָרַיִךְ
  choice: tes gardes
  rationale: Le terme hébreu est rare et discuté. Dans cette raillerie contre Ninive, le parallélisme avec une autre catégorie de responsables et l’image des criquets favorisent la désignation de membres d’une élite chargés de la protection ou de la surveillance. La note conserve les principales autres possibilités.
- source_word: כָּאַרְבֶּה
  choice: comme des criquets
  rationale: La comparaison est collective et générique ; le pluriel français rend naturellement l’image.
- source_word: טַפְסְרַיִךְ
  choice: tes hauts fonctionnaires
  rationale: Cet emprunt rare peut désigner des dignitaires administratifs ou militaires, éventuellement des scribes de haut rang. « Hauts fonctionnaires » garde le sens large requis sans trancher entre administration et commandement militaire.
- source_word: כְּגֹב גֹבָי
  choice: comme des nuées de criquets
  rationale: La forme redoublée évoque une masse ou un essaim de criquets. « Nuées » restitue de façon concise l’effet collectif et intensif.
- source_word: הַחוֹנִים
  choice: qui se posent
  rationale: Le participe signifie normalement camper ou s’installer. Appliqué aux insectes, « se posent » est idiomatique tout en conservant l’idée d’un établissement provisoire.
- source_word: בַּגְּדֵרוֹת
  choice: sur les clôtures
  rationale: Le nom désigne des clôtures, murs, enclos ou haies. « Clôtures » préserve mieux la portée lexicale générale que « murailles », qui imposerait le cadre urbain.
- source_word: בְּיוֹם קָרָה
  choice: par un jour froid
  rationale: Rendu temporel direct et naturel en français poétique.
- source_word: שֶׁמֶשׁ זָרְחָה
  choice: Le soleil se lève
  rationale: Le présent de narration produit une scène vive et suggère la chaleur qui met les insectes en mouvement.
- source_word: וְנוֹדַד
  choice: ils s’envolent
  rationale: Le verbe signifie partir, fuir ou errer. Le pluriel suit les groupes comparés aux criquets, et « s’envolent » prolonge naturellement l’image entomologique.
- source_word: וְלֹא נוֹדַע מְקוֹמוֹ אַיָּם
  choice: on ne sait plus où ils sont
  rationale: Cette formulation française exprime clairement leur disparition. Une note conserve la structure singulière et la question finale énigmatique de l’hébreu.
