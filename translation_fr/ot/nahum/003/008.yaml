  text: הֲ/תֵֽיטְבִי֙ מִ/נֹּ֣א אָמ֔וֹן הַ/יֹּֽשְׁבָה֙ בַּ/יְאֹרִ֔ים מַ֖יִם סָבִ֣יב לָ֑/הּ אֲשֶׁר חֵ֣יל יָ֔ם מִ/יָּ֖ם חוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/008.yaml
  text: Are you better than No-amon, who sat among the Nile channels, with waters all around her, whose rampart was the sea, whose wall was from the sea?
translation:
  language: fr
  text: Vaux-tu mieux que No-Amon[a], située parmi les canaux du Nil, avec des eaux tout autour d’elle ? La mer était son rempart ; sa muraille était faite de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No-Amon est le nom hébreu de Thèbes, grande ville de Haute-Égypte.
    reason: Identifie pour le lecteur moderne le toponyme ancien conservé dans le texte.
lexical_decisions:
- source_word: הֲתֵיטְבִי
  choice: Vaux-tu mieux
  rationale: Le verbe יטב au comparatif exprime ici une supériorité de situation ou d’avantage, dans une question adressée à Ninive au féminin.
- source_word: נֹא אָמוֹן
  choice: No-Amôn
  rationale: Translittération traditionnelle du nom hébreu de la ville égyptienne appelée Thèbes; une note l’identifie sans remplacer le nom du texte source.
- source_word: הַיֹּשְׁבָה
  choice: établie
  rationale: Le participe de ישׁב peut signifier « assise », « habitant » ou « établie ». « Établie » convient naturellement à la position géographique d’une ville.
- source_word: בַּיְאֹרִים
  choice: au milieu des bras du Nil
  rationale: Le pluriel יְאֹרִים désigne ici les chenaux ou bras du Nil qui entouraient et protégeaient la ville.
- source_word: חֵיל
  choice: rempart
  rationale: Dans un contexte de fortifications, חֵיל désigne l’ouvrage défensif extérieur ou le rempart plutôt que des forces militaires.
- source_word: יָם
  choice: la mer
  rationale: Conserve l’image répétée du texte hébreu, où les vastes eaux associées au Nil sont qualifiées de « mer ».
theological_decisions:
- issue: Nature de la comparaison entre Ninive et No-Amôn
  choice: « Vaux-tu mieux » sans préciser la nature exacte de l’avantage
  alternative: « Es-tu mieux protégée »
  rationale: Le contexte porte sur la sécurité défensive, mais le verbe hébreu reste général; la traduction préserve cette latitude plutôt que d’expliciter ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, sobre et dignifié. La reprise de « la mer » reproduit le parallélisme frappant de l’hébreu, malgré son caractère légèrement inhabituel en français.
