  text: וְ/הִשְׁלַכְתִּ֥י עָלַ֛יִ/ךְ שִׁקֻּצִ֖ים וְ/נִבַּלְתִּ֑י/ךְ וְ/שַׂמְתִּ֖י/ךְ כְּ/רֹֽאִי׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/006.yaml
  text: And I will throw filth upon you[a], and treat you with contempt[b], and make you a spectacle.
translation:
  language: fr
  text: Je jetterai sur toi des immondices[a], je te déshonorerai et je ferai de toi un spectacle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des abominations » ou « des choses détestables ». Le terme hébreu désigne souvent ce qui est rituellement ou moralement répugnant ; dans ce contexte, il peut évoquer des déchets immondes jetés sur Ninive pour l’humilier publiquement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je te placerai comme objet de regard » ; ou « je t’exposerai aux regards ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: Je jetterai
  rationale: Le hiphil de שלך exprime l’action délibérée de jeter ou lancer. « Je jetterai » est naturel en français moderne et conserve la vigueur de l’image.
- source_word: עָלַיִךְ
  choice: sur toi
  rationale: La préposition על avec suffixe féminin singulier a ici un sens spatial; Ninive est personnifiée et directement interpellée.
- source_word: שִׁקֻּצִים
  choice: des choses répugnantes
  rationale: שִׁקּוּץ désigne ce qui est détestable, abominable ou répugnant, souvent sur le plan rituel ou moral. Cette formulation préserve l’étendue du terme sans imposer le sens concret plus précis d’« immondices ».
- source_word: וְנִבַּלְתִּיךְ
  choice: je te couvrirai de mépris
  rationale: Le piel de נבל évoque l’avilissement, le déshonneur ou le fait de rendre méprisable. Cette tournure française exprime clairement l’humiliation infligée, sans archaïsme.
- source_word: וְשַׂמְתִּיךְ
  choice: je ferai de toi
  rationale: שׂים signifie « placer, établir, faire de ». Devant le prédicat כְּרֹאִי, « faire de toi » est la construction française la plus naturelle.
- source_word: כְּרֹאִי
  choice: un spectacle
  rationale: L’expression présente Ninive comme une chose offerte aux regards. « Un spectacle » rend avec concision l’exposition publique et honteuse, tandis que la note conserve le sens plus littéral.
theological_decisions:
- issue: Image prophétique de l’humiliation de Ninive personnifiée au féminin
  choice: Conserver sans l’atténuer le langage de jugement et de honte publique.
  alternative: Employer une formulation plus explicite ou plus concrète, telle que « je jetterai sur toi des immondices et je t’avilirai ».
  rationale: L’hébreu décrit une humiliation sévère, mais ne requiert ni amplification sexualisée ni interprétation doctrinale. La traduction maintient la force du jugement tout en préservant l’ambiguïté lexicale de שִׁקֻּצִים.
translation_notes:
  register: Français international moderne, digne et direct. Le futur prophétique et l’adresse au féminin singulier sont conservés. « Choses répugnantes » garde la portée sémantique du terme hébreu, et les variantes plus concrètes ou cultuelles figurent en note.
