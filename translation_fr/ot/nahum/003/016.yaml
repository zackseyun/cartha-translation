  text: You multiplied your merchants more than the stars of the heavens[b][a]; the locust strips bare and flies away.
translation:
  language: fr
  text: Tu as rendu tes marchands plus nombreux que les étoiles du ciel. La sauterelle[a] ravage, puis s’envole[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jeune criquet » ou « la nymphe »; le terme hébreu désigne un type ou un stade particulier de sauterelle.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut aussi signifier « se déployer » ou « s’étendre »; dans ce contexte, il évoque probablement la sauterelle qui ravage avant de s’envoler.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּית
  choice: Tu as multiplié
  rationale: Le hifil accompli à la 2e personne du féminin singulier s’adresse à Ninive comme à une ville personnifiée; « multiplié » conserve l’idée d’accroissement.
- source_word: רֹכְלַיִךְ
  choice: tes marchands
  rationale: Le terme désigne des commerçants ou négociants; « marchands » est naturel et convient à la puissance commerciale de Ninive.
- source_word: מִכּוֹכְבֵי הַשָּׁמָיִם
  choice: ils sont plus nombreux que les étoiles du ciel
  rationale: La préposition מן exprime ici la comparaison après רבה. L’explicitation « ils sont plus nombreux » rend le rapport comparatif clair et idiomatique en français.
- source_word: יֶלֶק
  choice: le criquet
  rationale: Le mot désigne une espèce ou un stade particulier de locuste. « Criquet » restitue naturellement l’image sans imposer une identification zoologique incertaine.
- source_word: פָּשַׁט
  choice: dépouille tout
  rationale: Le verbe peut signifier se répandre, enlever ou dépouiller. Dans l’image d’une invasion de criquets suivie d’un départ soudain, « dépouille tout » exprime la dévastation sans effacer l’ambiguïté lexicale, signalée en note.
- source_word: וַיָּעֹף
  choice: puis s’envole
  rationale: 'Le verbe signifie « voler ». « Puis » rend naturellement la succession narrative: après avoir dépouillé, le criquet disparaît en s’envolant.'
