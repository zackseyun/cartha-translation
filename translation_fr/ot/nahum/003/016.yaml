    issue: La note b propose « se dépouille » comme sens alternatif de פָּשַׁט.
    rationale: Cette formulation ne correspond pas au sens pertinent du verbe dans ce contexte. L’alternative lexicale à conserver est plutôt l’idée de « se déployer » / « s’étendre », en regard du sens contextuel de dépouiller ou ravager.
  - severity: low
    issue: « dépouille tout » explicite une totalité et un objet qui ne figurent pas dans le texte hébreu.
    rationale: L’image implique certes la dévastation par les criquets, mais « tout » renforce inutilement l’énoncé. « Ravage » garde l’effet sans cette addition.
