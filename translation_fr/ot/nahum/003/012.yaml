  text: כָּ֨ל מִבְצָרַ֔יִ/ךְ תְּאֵנִ֖ים עִם בִּכּוּרִ֑ים אִם יִנּ֕וֹעוּ וְ/נָפְל֖וּ עַל פִּ֥י אוֹכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/012.yaml
  text: All your fortresses are fig trees with first-ripe figs; if they are shaken[a], they fall into the mouth of the eater.
translation:
  language: fr
  text: 'Toutes tes forteresses sont comme des figuiers aux figues précoces[a] : si on les secoue, les figues tombent dans la bouche de celui qui les mange.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut aussi désigner des « figues » plutôt que des « figuiers ». L’image peut alors évoquer des figues précoces prêtes à tomber ; le texte principal comprend les forteresses comme des arbres, ce qui correspond naturellement à l’action de les secouer.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצָרַיִךְ
  choice: tes forteresses
  rationale: Le nom désigne des places fortifiées ou des bastions. « Forteresses » est concret, naturel et conserve l’image militaire adressée à Ninive.
- source_word: תְּאֵנִים
  choice: des figuiers
  rationale: Dans la comparaison, le terme désigne naturellement les arbres portant les fruits mentionnés ensuite. L’ajout de « comme », implicite dans la métaphore hébraïque, rend la comparaison claire en français.
- source_word: עִם בִּכּוּרִים
  choice: chargés de figues précoces
  rationale: בִּכּוּרִים désigne ici les premiers fruits mûrs, en l’occurrence des figues. Cette formulation française restitue l’image agricole sans lui donner artificiellement un sens cultuel.
- source_word: אִם
  choice: si
  rationale: La particule introduit une condition. « Si » préserve cette valeur tout en convenant à l’énoncé imagé.
- source_word: יִנּוֹעוּ
  choice: on les secoue
  rationale: Le verbe נוע évoque le mouvement, le balancement ou l’ébranlement. La tournure active indéfinie est idiomatique en français et exprime l’action exercée sur les figuiers.
- source_word: וְנָפְלוּ
  choice: les figues tombent
  rationale: Le parfait consécutif à la condition exprime le résultat. La reprise explicite de « les figues » évite qu’un pronom français fasse croire que les arbres eux-mêmes tombent dans une bouche.
- source_word: עַל פִּי אוֹכֵל
  choice: dans la bouche de celui qui les mange
  rationale: Littéralement « sur la bouche de quelqu’un qui mange ». « Dans la bouche » exprime naturellement en français la facilité immédiate avec laquelle les fruits sont recueillis et consommés.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et imagé. La métaphore hébraïque est rendue par une comparaison explicite avec « comme », plus naturelle en français. Le deux-points articule l’image et son résultat, tandis que la répétition de « les figues » clarifie le référent sans modifier le sens.
