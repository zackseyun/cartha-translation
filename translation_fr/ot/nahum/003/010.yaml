review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’exil, la captivité, le sort réservé aux jeunes enfants, le tirage au sort concernant les notables et l’entravement des grands. Toutefois, « aux carrefours de toutes les rues » restreint indûment בְּרֹאשׁ כָּל־חוּצוֹת, qui évoque la tête, l’entrée ou le débouché de chaque rue, sans exiger un carrefour. « Écrasés » est également moins précis que la violence de רטש, « mis en pièces » la restitue mieux.
  naturalness: Le français est globalement sobre et lisible. « À l’entrée de chaque rue » est plus naturel et plus exact que « aux carrefours de toutes les rues ». « Ont été enchaînés » est plus idiomatique et direct que « ont été chargés de chaînes ».
  terminology: « Tout-petits », « dignitaires » et « grands » rendent adéquatement les distinctions sociales et lexicales de l’hébreu. La formulation proposée conserve ces choix sans imposer une interprétation institutionnelle ou doctrinale.
  issues:
  - severity: medium
    issue: « Aux carrefours de toutes les rues » pour בְּרֹאשׁ כָּל־חוּצוֹת
    rationale: Le texte hébreu parle de la « tête » de chaque rue, c’est-à-dire de son entrée, son débouché ou son extrémité saillante. Un carrefour est possible dans certains cas, mais n’est pas exprimé et ne doit pas devenir le seul sens du texte principal.
  - severity: low
    issue: « Ont été écrasés » pour יְרֻטָּשׁוּ
    rationale: Le verbe décrit une mise en pièces violente. « Mis en pièces » rend plus explicitement cette image sans l’atténuer.
  - severity: low
    issue: « Ont été chargés de chaînes » pour רֻתְּקוּ בַזִּקִּים
    rationale: La construction française peut évoquer le fait de porter un poids. « Ont été enchaînés » exprime nettement l’idée d’être attachés avec des entraves.
  revised_text: Elle aussi est partie en exil, elle a été emmenée en captivité. Ses tout-petits aussi ont été mis en pièces à l’entrée de chaque rue[a]. On a tiré au sort ses dignitaires, et tous ses grands ont été enchaînés.
  revised_footnotes:
