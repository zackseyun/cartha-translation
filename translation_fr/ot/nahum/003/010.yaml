  text: גַּם הִ֗יא לַ/גֹּלָה֙ הָלְכָ֣ה בַ/שֶּׁ֔בִי גַּ֧ם עֹלָלֶ֛י/הָ יְרֻטְּשׁ֖וּ בְּ/רֹ֣אשׁ כָּל חוּצ֑וֹת וְ/עַל נִכְבַּדֶּ֨י/הָ֙ יַדּ֣וּ גוֹרָ֔ל וְ/כָל גְּדוֹלֶ֖י/הָ רֻתְּק֥וּ בַ/זִּקִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/010.yaml
  text: Yet she too went into exile[a], into captivity; her children too were dashed to pieces at the head of every street. They cast lots for her honored men[d][c][b], and all her great men were bound in chains.
translation:
  language: fr
  text: Elle aussi est partie en exil, elle a été emmenée en captivité. Ses tout-petits aussi ont été mis en pièces à l’entrée de chaque rue[a]. On a tiré au sort ses dignitaires, et tous ses grands ont été enchaînés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la tête de toutes les rues », c’est-à-dire à l’entrée, au débouché ou à un angle de chaque rue.'
    reason: cultural_note
lexical_decisions:
- source_word: גַּם הִיא
  choice: Elle aussi
  rationale: Préserve l’insistance de גַּם et la référence féminine à No-Amon, tout en restant naturel en français.
- source_word: לַגֹּלָה הָלְכָה בַשֶּׁבִי
  choice: est partie en exil, elle a été emmenée en captivité
  rationale: « Est partie en exil » rend l’idiome avec הלך, tandis que la seconde proposition explicite le caractère forcé de la captivité sans effacer le parallélisme hébreu.
- source_word: עֹלָלֶיהָ
  choice: ses tout-petits
  rationale: Le terme désigne de très jeunes enfants; « tout-petits » en conserve la précision et le registre poignant.
- source_word: יְרֻטְּשׁוּ
  choice: ont été écrasés
  rationale: Rend directement la violence meurtrière de רטש dans un français actuel, sans l’atténuer.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: aux carrefours de toutes les rues
  rationale: Expression française intelligible pour les débouchés ou points saillants des rues; la traduction littérale est signalée en note.
- source_word: נִכְבַּדֶּיהָ
  choice: ses dignitaires
  rationale: Rend le statut et l’honneur social exprimés par la racine כבד, sans limiter nécessairement le groupe à la noblesse héréditaire.
- source_word: יַדּוּ גוֹרָל
  choice: On a tiré au sort
  rationale: Équivalent idiomatique français de l’action consistant à attribuer des personnes par le sort; le sujet indéfini de la forme verbale est conservé.
- source_word: גְּדוֹלֶיהָ
  choice: ses grands
  rationale: Conserve la formulation de statut social de l’hébreu et la distingue de « dignitaires » au membre précédent.
- source_word: רֻתְּקוּ בַזִּקִּים
  choice: ont été chargés de chaînes
  rationale: Exprime clairement l’entravement humiliant des personnages importants dans un registre digne et naturel.
