revisions:
- from: Elle aussi est partie en exil, elle a été emmenée en captivité. Ses tout-petits ont, eux aussi, été écrasés aux carrefours de toutes les rues[a]. On a tiré au sort ses dignitaires, et tous ses grands ont été chargés de chaînes.
  to: Elle aussi est partie en exil, elle a été emmenée en captivité. Ses tout-petits aussi ont été mis en pièces à l’entrée de chaque rue[a]. On a tiré au sort ses dignitaires, et tous ses grands ont été enchaînés.
  rationale: La révision corrige la localisation des violences afin de ne pas identifier de façon trop étroite la « tête » des rues à des carrefours, renforce la restitution de la violence du verbe hébreu et emploie une expression française plus directe pour les entraves. Elle préserve le parallélisme, la répétition emphatique d’« aussi » et les distinctions entre dignitaires et grands.
