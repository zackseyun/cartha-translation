source:
  edition: WLC
  text: מֵ/רֹב֙ זְנוּנֵ֣י זוֹנָ֔ה ט֥וֹבַת חֵ֖ן בַּעֲלַ֣ת כְּשָׁפִ֑ים הַ/מֹּכֶ֤רֶת גּוֹיִם֙ בִּ/זְנוּנֶ֔י/הָ וּ/מִשְׁפָּח֖וֹת בִּ/כְשָׁפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/004.yaml
  text: because of the many prostitutions of the prostitute[a], charming in grace, mistress of sorceries[b], who sells nations by her prostitutions and clans by her sorceries.
translation:
  language: fr
  text: à cause des nombreuses prostitutions de la prostituée, pleine de charme, maîtresse des sortilèges, qui vend les nations par ses prostitutions et les clans par ses sortilèges.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵרֹב
  choice: à cause des nombreuses
  rationale: Dans ce contexte, מִן avec רֹב exprime le motif du jugement tout en conservant l’idée d’abondance.
- source_word: זְנוּנֵי / זוֹנָה
  choice: prostitutions de la prostituée
  rationale: La répétition préserve l’intensité de la métaphore sexuelle appliquée à la puissance séductrice et corruptrice de Ninive, sans recourir à un vocabulaire archaïque.
- source_word: טוֹבַת חֵן
  choice: pleine de charme
  rationale: Cette formulation française naturelle exprime l’attrait séduisant de l’expression hébraïque sans la réduire à la seule beauté physique.
- source_word: בַּעֲלַת כְּשָׁפִים
  choice: maîtresse en sortilèges
  rationale: בַּעֲלַת caractérise la figure féminine par sa possession ou sa maîtrise des pratiques magiques; « maîtresse en » est idiomatique et conserve cette caractérisation.
- source_word: הַמֹּכֶרֶת
  choice: qui vend
  rationale: Le participe poursuit la description de la prostituée et maintient directement l’image d’une exploitation commerciale.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Dans cet oracle prophétique, le terme désigne des collectivités géopolitiques, non spécifiquement les non-Juifs.
- source_word: בִּזְנוּנֶיהָ
  choice: par ses prostitutions
  rationale: La préposition בְּ exprime ici le moyen ou l’instrument.
- source_word: וּמִשְׁפָּחוֹת
  choice: et les clans
  rationale: מִשְׁפָּחוֹת peut désigner des groupes de parenté étendus; « clans » convient au parallélisme avec « nations ».
- source_word: בִּכְשָׁפֶיהָ
  choice: par ses sortilèges
  rationale: Le choix conserve le sens instrumental de בְּ et reprend le même terme que dans la première proposition.
theological_decisions:
- issue: Portée de l’image de la prostituée
  choice: Conserver sans l’expliciter la métaphore de la prostitution et des sortilèges comme image de la puissance séductrice, corruptrice et exploiteuse de Ninive.
  alternative: Limiter l’image exclusivement à l’idolâtrie ou exclusivement à la manipulation politique et économique.
  rationale: Le texte permet plusieurs dimensions complémentaires — politique, culturelle et spirituelle — et la traduction ne doit pas trancher entre elles.
translation_notes:
  register: Français international moderne, digne et direct. La phrase demeure un fragment causal, conformément à l’hébreu et à son lien syntaxique avec le contexte précédent. La répétition « prostitutions/prostituée » et le parallélisme « nations/clans » sont volontairement conservés.
