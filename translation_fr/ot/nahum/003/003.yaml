  text: פָּרָ֣שׁ מַעֲלֶ֗ה וְ/לַ֤הַב חֶ֨רֶב֙ וּ/בְרַ֣ק חֲנִ֔ית וְ/רֹ֥ב חָלָ֖ל וְ/כֹ֣בֶד פָּ֑גֶר וְ/אֵ֥ין קֵ֨צֶה֙ לַ/גְּוִיָּ֔ה יכשלו בִּ/גְוִיָּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/003.yaml
  text: Horsemen charging[a], and the flashing sword and the gleaming spear, and a multitude of slain, and heaps of corpses[c][b]; and there is no end to the bodies— they stumble over the bodies.
translation:
  language: fr
  text: 'Des cavaliers s’élancent,

    l’épée flamboie, la lance étincelle !

    Une multitude de tués,

    une masse de cadavres !

    Les corps sont innombrables ;

    ils trébuchent sur leurs corps[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sur leurs corps » ; le référent de « leurs » n’est pas explicitement précisé dans l’hébreu et renvoie vraisemblablement aux morts de la scène.
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: פָּרָשׁ מַעֲלֶה
  choice: Des cavaliers s’élancent
  rationale: Le singulier פָּרָשׁ peut avoir une valeur collective dans cette scène de bataille. מַעֲלֶה décrit leur mouvement vers l’avant ; « s’élancent » restitue naturellement la vigueur de l’image sans préciser davantage que l’hébreu.
- source_word: לַהַב חֶרֶב
  choice: l’épée flamboie
  rationale: לַהַב évoque littéralement une flamme ou un éclat ardent. La formulation verbale française conserve cette image vive tout en restant naturelle.
- source_word: בְּרַק חֲנִית
  choice: la lance étincelle
  rationale: בְּרַק signifie « éclair » ou « éclat ». « Étincelle » rend l’éclat lumineux de la lance dans un français poétique et intelligible.
- source_word: רֹב חָלָל
  choice: une multitude de tués
  rationale: חָלָל désigne ici les personnes abattues au combat, et רֹב souligne leur très grand nombre.
- source_word: כֹבֶד פָּגֶר
  choice: une masse de cadavres
  rationale: כֹבֶד, littéralement « poids, lourdeur », exprime ici l’accumulation massive ; « une masse » conserve cette idée sans ajouter explicitement celle de tas.
- source_word: אֵין קֵצֶה לַגְּוִיָּה
  choice: Les corps sont innombrables
  rationale: Cette formulation idiomatique rend l’absence de limite exprimée par אֵין קֵצֶה, tout en conservant גְּוִיָּה par « corps ».
- source_word: יכשלו בִּגְוִיָּתָם
  choice: ils trébuchent sur leurs corps
  rationale: « Trébuchent » rend directement כשל. Le suffixe possessif de troisième personne du pluriel dans בִּגְוִיָּתָם est conservé par « leurs », malgré l’ambiguïté de son référent.
