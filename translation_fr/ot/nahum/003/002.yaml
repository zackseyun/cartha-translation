  text: The crack of the whip[a], and the rumble of the wheel[b], with galloping horse and bounding chariot!
translation:
  language: fr
  text: Claquement du fouet[a], grondement de la roue[b], cheval au galop et char bondissant !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bruit du fouet ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu enchaîne de brèves images sonores et visuelles sans verbe conjugué, ce qui accentue l’immédiateté de la scène de bataille. Ou : « bruit de la roue qui gronde ».'
    reason: cultural_note
lexical_decisions:
- source_word: קוֹל שׁוֹט
  choice: claquement du fouet
  rationale: קוֹל désigne le son ou le bruit ; avec שׁוֹט, « claquement du fouet » restitue naturellement l'image sonore en français.
- source_word: קוֹל רַעַשׁ אוֹפָן
  choice: fracas des roues
  rationale: רַעַשׁ évoque un bruit violent, un grondement ou un fracas. Le pluriel français « roues » convient naturellement à l'image collective des chars, bien que l'hébreu emploie le singulier.
- source_word: סוּס דֹּהֵר
  choice: cheval au galop
  rationale: Le participe דֹּהֵר exprime la course rapide du cheval ; « au galop » est précis, vif et idiomatique.
- source_word: מֶרְכָּבָה מְרַקֵּדָה
  choice: char bondissant
  rationale: מְרַקֵּדָה signifie littéralement « sautant » ou « dansant ». « Bondissant » rend les secousses violentes du char sans évoquer une danse festive.
