  yaml_path: translation/ot/nahum/003/015.yaml
  text: There the fire will devour you; the sword will cut you off; it will devour you like the locust[a]. Multiply yourself like the locust; multiply yourself like the swarming locust.
translation:
  language: fr
  text: Là, le feu te dévorera ; l’épée te retranchera ; elle te dévorera comme le criquet[a]. Multiplie-toi comme le criquet, multiplie-toi comme la sauterelle !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici deux termes différents pour des insectes ravageurs : יֶלֶק, dont l’identification précise, comme espèce ou stade, est incertaine, et אַרְבֶּה. Ils sont rendus par « criquet » et « sauterelle » afin de marquer cette variation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe local désigne précisément le lieu où Ninive se croit en sécurité ; « Là » en garde la brièveté et la force.
- source_word: תֹּאכְלֵךְ ... אֵשׁ
  choice: le feu te dévorera
  rationale: Le verbe אָכַל signifie littéralement « manger » et, avec le feu pour sujet, « dévorer » restitue naturellement l’image vive de la destruction.
- source_word: תַּכְרִיתֵךְ חֶרֶב
  choice: l’épée te retranchera
  rationale: Le hifil de כרת exprime ici l’action de retrancher ou de détruire. « Retranchera » conserve l’image lexicale sans réduire la formule à un terme abstrait.
- source_word: תֹּאכְלֵךְ
  choice: elle te dévorera
  rationale: La répétition du verbe est conservée. Le pronom féminin reprend naturellement « l’épée », sujet immédiatement précédent, sans expliciter davantage que l’hébreu.
- source_word: כַּיָּלֶק / כַּיֶּלֶק
  choice: comme le criquet
  rationale: יֶלֶק désigne un insecte dévorant de la famille ou d’un stade des locustes. « Criquet » rend clairement l’image en français tout en le distinguant de אַרְבֶּה ; la limite de cette distinction est signalée en note.
- source_word: הִתְכַּבֵּד / הִתְכַּבְּדִי
  choice: Multiplie-toi
  rationale: Dans cette injonction ironique, le hitpael de כבד invite la ville à devenir nombreuse, à pulluler comme les locustes. « Multiplie-toi » est naturel, concis et garde le parallélisme des deux impératifs.
- source_word: כָּאַרְבֶּה
  choice: comme la sauterelle
  rationale: אַרְבֶּה est le terme courant pour la locuste. « Sauterelle », usage traditionnel et intelligible en français biblique moderne, permet de faire entendre le changement de terme hébreu sans alourdir le verset.
