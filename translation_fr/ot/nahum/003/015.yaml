translation_notes:
  register: Français international moderne, direct et solennel. Le féminin singulier (« te », impératifs) maintient l’adresse à la ville de Ninive. La répétition de « dévorera » et de « Multiplie-toi » conserve l’insistance et l’ironie du texte hébreu.
