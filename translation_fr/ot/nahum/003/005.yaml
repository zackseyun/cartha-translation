source:
  edition: WLC
  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/גִלֵּיתִ֥י שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/הַרְאֵיתִ֤י גוֹיִם֙ מַעְרֵ֔/ךְ וּ/מַמְלָכ֖וֹת קְלוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/005.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will uncover your skirts over your face, and I will show the nations your nakedness and the kingdoms your shame.
translation:
  language: fr
  text: « Me voici contre toi, déclare Yahweh des armées. Je relèverai les pans de ta robe jusqu’à ton visage[a] ; je montrerai ta nudité aux nations et ta honte aux royaumes. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu décrit les pans du vêtement relevés jusqu’au visage, image d’une nudité exposée et d’une humiliation publique.
    reason: Explication de l’image hébraïque et de sa portée métaphorique.
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Me voici contre toi
  rationale: L’expression introduit solennellement l’intervention hostile de Dieu contre Ninive, interpellée au féminin singulier.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclare Yahweh, le maître des armées
  rationale: « Déclare » rend la formule prophétique נְאֻם ; « Yahweh » représente directement le nom divin, et « le maître des armées » exprime naturellement en français le titre צְבָאוֹת.
- source_word: וְגִלֵּיתִי שׁוּלַיִךְ עַל־פָּנָיִךְ
  choice: Je relèverai les pans de ta robe jusque sur ton visage
  rationale: Cette formulation conserve l’image concrète du vêtement relevé et de l’humiliation publique, tout en étant plus naturelle en français que « découvrir tes jupes ».
- source_word: וְהַרְאֵיתִי גוֹיִם מַעְרֵךְ
  choice: je montrerai ta nudité aux nations
  rationale: Le hiphil de ראה signifie ici « faire voir, montrer » ; מַעְרֵךְ désigne la nudité exposée dans un contexte de honte.
- source_word: וּמַמְלָכוֹת קְלוֹנֵךְ
  choice: et ta honte aux royaumes
  rationale: La construction parallèle permet de sous-entendre « je montrerai » ; « honte » rend la disgrâce publique exprimée par קָלוֹן.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de l’image d’exposition forcée
  choice: Conserver l’image comme annonce de jugement et d’humiliation publique
  alternative: Paraphraser uniquement par « je t’humilierai publiquement »
  rationale: La métaphore corporelle appartient à la force rhétorique du texte. La conserver évite d’atténuer la violence de l’oracle sans lui ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, solennel et direct. Le tutoiement féminin singulier correspond à Ninive personnifiée. La syntaxe parallèle de la seconde proposition est conservée sans répétition lourde du verbe.
