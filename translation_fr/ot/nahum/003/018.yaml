id: NAM.3.18
reference: Nahum 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נָמ֤וּ רֹעֶ֨י/ךָ֙ מֶ֣לֶךְ אַשּׁ֔וּר יִשְׁכְּנ֖וּ אַדִּירֶ֑י/ךָ נָפֹ֧שׁוּ עַמְּ/ךָ֛ עַל הֶ/הָרִ֖ים וְ/אֵ֥ין מְקַבֵּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/018.yaml
  text: Your shepherds slumber[a], O king of Assyria; your nobles lie down. Your people are scattered on the mountains[d][c][b], and there is no one to gather them.
translation:
  language: fr
  text: Tes bergers sommeillent[a], roi d’Assyrie ; tes nobles reposent[b]. Ton peuple est dispersé sur les montagnes[c], et personne ne le rassemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dorment » ; l’image hébraïque peut évoquer des dirigeants inactifs, incapables d’agir, voire morts.
    reason: lexical_alternative
  - marker: b
    text: Ou « demeurent » ou « sont couchés ». Le verbe hébreu signifie souvent « demeurer », mais il prolonge probablement ici l’image de chefs plongés dans l’inertie.
    reason: alternative_reading
  - marker: c
    text: 'Le verbe hébreu traduit par « est dispersé » est difficile. Ce sens est appuyé par la proposition suivante : « personne ne le rassemble ».'
    reason: textual_variant
lexical_decisions:
- source_word: נָמוּ
  choice: sommeillent
  rationale: Le verbe נום évoque le sommeil ou l’assoupissement. « Sommeillent » conserve l’image poétique de dirigeants inactifs ou incapables d’agir.
- source_word: רֹעֶיךָ
  choice: tes bergers
  rationale: Le sens littéral est conservé afin de maintenir la métaphore prophétique des bergers représentant les dirigeants.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: roi d’Assyrie
  rationale: Le groupe nominal fonctionne ici comme une apostrophe ; le français naturel n’exige pas l’ajout de « ô ».
- source_word: יִשְׁכְּנוּ
  choice: reposent
  rationale: שכן signifie ordinairement « demeurer », mais le parallélisme avec נָמוּ favorise ici l’idée de rester couché ou inactif. « Reposent » préserve cette nuance sans trancher explicitement entre sommeil, inertie et mort.
- source_word: אַדִּירֶיךָ
  choice: tes nobles
  rationale: Le terme peut désigner des personnages puissants, éminents ou nobles. Dans le contexte des responsables assyriens, « nobles » est précis sans imposer un sens exclusivement militaire.
- source_word: נָפֹשׁוּ
  choice: est dispersé
  rationale: La forme est difficile, mais la mention suivante de l’absence de rassembleur soutient fortement l’idée de dispersion. Le singulier collectif s’accorde naturellement avec « ton peuple ».
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: C’est le sens courant du nom ; rien n’impose de le restreindre aux troupes.
- source_word: עַל הֶהָרִים
  choice: sur les montagnes
  rationale: Traduction directe et naturelle de la préposition et du nom.
- source_word: וְאֵין מְקַבֵּץ
  choice: et personne ne le rassemble
  rationale: Le complément « le » reprend naturellement le collectif « ton peuple », explicite en français mais implicite en hébreu.
theological_decisions:
- issue: État des dirigeants assyriens
  choice: Maintenir les images de sommeil et de repos sans préciser s’il s’agit de négligence, d’impuissance ou de mort.
  alternative: Interpréter explicitement les dirigeants comme morts ou comme négligents.
  rationale: Le parallélisme suggère une inactivité extrême, mais le verset ne tranche pas à lui seul entre ces nuances.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe au roi dans un oracle de jugement. La métaphore des « bergers » et l’ambiguïté de l’inactivité des nobles sont préservées.
