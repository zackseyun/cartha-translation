  text: מֵ֤י מָצוֹר֙ שַֽׁאֲבִי לָ֔/ךְ חַזְּקִ֖י מִבְצָרָ֑יִ/ךְ בֹּ֧אִי בַ/טִּ֛יט וְ/רִמְסִ֥י בַ/חֹ֖מֶר הַחֲזִ֥יקִי מַלְבֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/014.yaml
  text: Draw water for yourself for the siege; strengthen your fortresses[a]. Go into the clay and tread the mortar; take hold of the brick mold.
translation:
  language: fr
  text: Puise de l’eau pour le siège ; renforce tes forteresses. Entre dans l’argile et piétine le mortier ; saisis le moule à briques[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le four à briques ». Le terme hébreu מַלְבֵּן est rare et peut désigner soit un moule servant à former les briques, soit un four à briques. Le contexte immédiat, qui évoque le travail de l’argile et du mortier, favorise « moule à briques ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵי מָצוֹר
  choice: de l’eau pour le siège
  rationale: Le syntagme construit signifie littéralement « eaux de siège ». Dans le contexte, il s’agit de faire des réserves d’eau en prévision du siège ; cette formulation conserve le sens militaire en français naturel.
- source_word: שַׁאֲבִי לָךְ
  choice: Puise ... pour le siège
  rationale: L’impératif féminin singulier s’adresse à la ville personnifiée. Le pronom לָךְ a ici une valeur d’intérêt, naturellement implicite en français dans l’ordre de puiser de l’eau en vue de sa propre défense.
- source_word: חַזְּקִי מִבְצָרָיִךְ
  choice: renforce tes forteresses
  rationale: Le piel de חזק exprime l’action de rendre fort, et מִבְצָרִים désigne des places fortifiées. « Renforce tes forteresses » garde l’image concrète et l’adresse au féminin singulier.
- source_word: בֹּאִי בַטִּיט
  choice: Entre dans l’argile
  rationale: טִיט peut désigner la boue ou l’argile ; le contexte de fabrication des briques favorise « argile ». « Entre » rend directement l’impératif בֹּאִי.
- source_word: וְרִמְסִי בַחֹמֶר
  choice: et piétine le mortier
  rationale: רמס signifie fouler ou piétiner. חֹמֶר peut désigner l’argile ou le mortier ; « mortier » distingue ici le matériau travaillé de l’argile déjà mentionnée, sans effacer l’imagerie artisanale.
- source_word: הַחֲזִיקִי מַלְבֵּן
  choice: saisis le moule à briques
  rationale: Dans cette construction, le hiphil de חזק signifie vraisemblablement « saisir, tenir fermement ». מַלְבֵּן est rare et incertain ; « moule à briques » convient bien à la séquence argile–mortier–fabrication, tout en signalant l’autre interprétation en note.
theological_decisions: []
