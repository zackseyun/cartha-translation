  text: אֵין כֵּהָ֣ה לְ/שִׁבְרֶ֔/ךָ נַחְלָ֖ה מַכָּתֶ֑/ךָ כֹּ֣ל שֹׁמְעֵ֣י שִׁמְעֲ/ךָ֗ תָּ֤קְעוּ כַף֙ עָלֶ֔י/ךָ כִּ֗י עַל מִ֛י לֹֽא עָבְרָ֥ה רָעָתְ/ךָ֖ תָּמִֽיד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/019.yaml
  text: There is no healing for your fracture[a]; your wound is grievous. All who hear the report about you clap their hands over you[b], for over whom has your evil not continually passed?
translation:
  language: fr
  text: Il n’y a pas de guérison pour ta fracture[a] ; ta blessure est grave. Tous ceux qui entendent parler de toi battent des mains contre toi[b]. Car qui donc n’a pas sans cesse subi le mal que tu fais ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’y a aucun soulagement à ta ruine ; ta blessure est sévère. »'
    reason: lexical_alternative
  - marker: b
    text: Ce geste exprime ici la joie devant la chute de Ninive. La question qui suit signifie que le mal qu’elle faisait avait atteint presque tout le monde.
    reason: cultural_note
lexical_decisions:
- source_word: אֵין כֵּהָה לְשִׁבְרֶךָ
  choice: Rien ne peut guérir ta fracture
  rationale: La tournure française exprime naturellement l’absence de guérison ou d’atténuation, tout en conservant l’image corporelle de la fracture et le verdict sans remède.
- source_word: נַחְלָה מַכָּתֶךָ
  choice: ta blessure est grave
  rationale: « Blessure » maintient l’image médicale de מַכָּה, tandis que « grave » rend la sévérité indiquée par נַחְלָה sans préciser explicitement « incurable ».
- source_word: כֹּל שֹׁמְעֵי שִׁמְעֲךָ
  choice: Tous ceux qui entendent parler de toi
  rationale: Formulation française idiomatique pour ceux qui apprennent la nouvelle concernant Ninive, sans ajouter expressément que cette nouvelle est celle de sa chute.
- source_word: תָּקְעוּ כַף עָלֶיךָ
  choice: battent des mains à cause de toi
  rationale: « Battre des mains » rend l’idiome hébreu et suggère la joie hostile ; « à cause de toi » conserve la souplesse de la préposition עַל.
- source_word: כִּי עַל מִי לֹא עָבְרָה רָעָתְךָ תָּמִיד
  choice: Car qui donc n’a pas subi continuellement ta méchanceté ?
  rationale: La question rhétorique est rendue en français naturel. « Subir » explicite l’effet oppressif du passage de la méchanceté, et « continuellement » préserve תָּמִיד.
theological_decisions:
- issue: Sens de רָעָתְךָ dans l’oracle de jugement contre Ninive
  choice: ta méchanceté
  alternative: ton mal ; ta cruauté ; le mal que tu faisais
  rationale: « Méchanceté » conserve l’accusation morale portée contre Ninive et se prête naturellement au verbe « subir », sans réduire le terme à la seule cruauté ni au seul dommage produit.
translation_notes:
  register: 'Français international moderne, clair et digne. Le tutoiement conserve l’adresse directe à Ninive. La formulation privilégie l’équivalence optimale : elle maintient l’image de la blessure tout en donnant à la question finale une syntaxe française naturelle.'
