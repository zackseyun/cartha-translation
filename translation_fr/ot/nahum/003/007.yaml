source:
  edition: WLC
  text: וְ/הָיָ֤ה כָל רֹאַ֨יִ/ךְ֙ יִדּ֣וֹד מִמֵּ֔/ךְ וְ/אָמַר֙ שָׁדְּדָ֣ה נִֽינְוֵ֔ה מִ֖י יָנ֣וּד לָ֑/הּ מֵ/אַ֛יִן אֲבַקֵּ֥שׁ מְנַחֲמִ֖ים לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/007.yaml
  text: And it will happen that all who see you will shrink from you and say, ‘Nineveh is devastated; who will grieve for her? Where can I seek comforters for you?’
translation:
  language: fr
  text: 'Alors, tous ceux qui te verront fuiront loin de toi et diront : « Ninive est dévastée ! Qui la plaindra ? Où te trouverai-je des consolateurs ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִדּוֹד מִמֵּךְ
  choice: s’éloigneront de toi
  rationale: Le verbe דדד exprime ici le fait de se retirer ou de fuir loin de Ninive; « s’éloigneront » conserve le mouvement de recul sans préciser excessivement sa cause.
- source_word: שָׁדְּדָה
  choice: est dévastée
  rationale: Le pual décrit Ninive comme ravagée ou détruite; « dévastée » rend naturellement cet état résultant.
- source_word: יָנוּד לָהּ
  choice: la plaindra
  rationale: נועד/נוד dans cette construction évoque un geste de compassion ou de condoléances; « plaindre » convient au contexte de la chute de la ville.
- source_word: מְנַחֲמִים
  choice: des consolateurs
  rationale: Le participe substantivé désigne ceux qui apporteraient du réconfort; le terme français maintient l’image personnelle du texte.
theological_decisions:
- issue: Question de compassion envers Ninive après son jugement
  choice: « Qui la plaindra ? »
  alternative: « Qui prendra le deuil pour elle ? »
  rationale: Le texte évoque la compassion sans imposer un rite funéraire précis; la traduction préserve le contraste entre le jugement et l’absence de sympathie.
translation_notes:
  register: Français moderne, digne et direct. Le féminin singulier est conservé dans l’adresse à Ninive, tandis que le passage de « te » à « la » reproduit le changement de personne du texte hébreu. « Où donc te chercherai-je » garde la première personne singulière, potentiellement rhétorique, sans identifier explicitement le locuteur.
