  text: הִנֵּ֨ה עַמֵּ֤/ךְ נָשִׁים֙ בְּ/קִרְבֵּ֔/ךְ לְ/אֹ֣יְבַ֔יִ/ךְ פָּת֥וֹחַ נִפְתְּח֖וּ שַׁעֲרֵ֣י אַרְצֵ֑/ךְ אָכְלָ֥ה אֵ֖שׁ בְּרִיחָֽיִ/ך׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/013.yaml
  text: Look[a], your troops are women in your midst; the gates of your land stand wide open to your enemies[c][b]; fire has consumed your bars.
translation:
  language: fr
  text: 'Regarde : tes troupes[a] sont des femmes au milieu de toi. Les portes de ton pays sont grandes ouvertes devant tes ennemis[b] ; le feu a dévoré les barres de tes portes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton peuple est composé de femmes au milieu de toi ». Le mot hébreu signifie habituellement « peuple » ; dans ce contexte militaire, il semble désigner les défenseurs de Ninive.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète la notion d’ouverture dans une tournure intensive : littéralement, « ouvertes, elles ont été ouvertes », c’est-à-dire « complètement ouvertes ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « tes verrous ». Il s’agit des dispositifs qui maintenaient les portes fermées.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Regarde
  rationale: Interjection déictique qui attire fortement l’attention. « Regarde » en restitue la vivacité dans un français moderne sans recourir à l’archaïque « voici que ».
- source_word: עַמֵּךְ
  choice: tes troupes
  rationale: Le nom désigne ordinairement le « peuple », mais, dans ce contexte d’attaque et de défense de Ninive, il vise plus précisément les forces dont elle dispose. Une note conserve le sens lexical plus général.
- source_word: נָשִׁים
  choice: des femmes
  rationale: Traduction directe du pluriel hébreu. L’image polémique de faiblesse militaire est conservée sans l’adoucir ni ajouter une comparaison absente du texte.
- source_word: בְּקִרְבֵּךְ
  choice: au milieu de toi
  rationale: Expression locative qui décrit la situation interne de la ville personnifiée.
- source_word: לְאֹיְבַיִךְ
  choice: devant tes ennemis
  rationale: Dans l’image de portes ouvertes, « devant » exprime naturellement en français leur exposition et leur accessibilité aux ennemis.
- source_word: פָּתוֹחַ נִפְתְּחוּ
  choice: sont grandes ouvertes
  rationale: L’infinitif absolu associé au verbe conjugué intensifie l’ouverture. « Grandes ouvertes » rend idiomatiquement cette emphase et l’état qui en résulte.
- source_word: שַׁעֲרֵי אַרְצֵךְ
  choice: les portes de ton pays
  rationale: Traduction directe du groupe construit, qui évoque les points d’accès fortifiés au territoire.
- source_word: אָכְלָה אֵשׁ
  choice: le feu a dévoré
  rationale: Le verbe signifie littéralement « manger » et, avec le feu pour sujet, « dévorer » conserve l’image vigoureuse ainsi que l’aspect accompli.
- source_word: בְּרִיחָיִךְ
  choice: les barres de tes portes
  rationale: Il s’agit des barres ou verrous qui sécurisent les portes. L’explicitation « de tes portes » évite l’ambiguïté du français « barres » tout en restant fidèle au contexte immédiat.
theological_decisions:
- issue: Raillerie militaire genrée en נָשִׁים
  choice: Conserver « des femmes » dans le texte principal.
  alternative: « comme des femmes » ou « faibles comme des femmes »
  rationale: L’hébreu emploie directement le nom « femmes », sans particule comparative et sans adjectif signifiant « faibles ». La formulation provocatrice du texte est donc préservée sans être neutralisée ni développée.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement féminin implicite vise Ninive personnifiée. Le rythme en deux phrases conserve la progression du constat humiliant vers l’effondrement des défenses.
