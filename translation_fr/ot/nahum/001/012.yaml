source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם שְׁלֵמִים֙ וְ/כֵ֣ן רַבִּ֔ים וְ/כֵ֥ן נָגֹ֖זּוּ וְ/עָבָ֑ר וְ/עִ֨נִּתִ֔/ךְ לֹ֥א אֲעַנֵּ֖/ךְ עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/012.yaml
  text: 'Thus says the LORD: Though they are whole, and likewise many, even so they will be cut down and pass away. Though I have afflicted you, I will afflict you no more.'
translation:
  language: fr
  text: 'Ainsi parle le SEIGNEUR : « Même s’ils sont intacts et nombreux, ils seront fauchés et disparaîtront. Je t’ai affligée, je ne t’affligerai plus. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: au complet
  rationale: Le terme évoque ici un état intact ou complet; « au complet » reste naturel en français et convient à une force ennemie nombreuse sans surinterpréter l’idée comme une perfection morale.
- source_word: נָגֹזּוּ
  choice: seront fauchés
  rationale: Le verbe rare porte l’idée d’être coupé ou tondu; « fauchés » conserve l’image de retranchement violent et s’accorde avec la disparition qui suit.
- source_word: וְעָבָר
  choice: et disparaîtront
  rationale: Littéralement « et il passera »; dans ce contexte, le singulier peut reprendre collectivement l’ennemi. Le pluriel français explicite l’accord naturel avec « ils », tandis que « disparaîtront » rend le passage hors de la scène.
- source_word: עִנִּתִךְ
  choice: je t’ai humiliée
  rationale: Le piel de ענה exprime l’affliction, l’abaissement ou l’humiliation. « Humiliée » rend l’abaissement infligé à Juda/Jérusalem; le féminin respecte le suffixe hébreu de deuxième personne féminine singulière.
- source_word: יהוה
  choice: le SEIGNEUR
  rationale: Convention française traditionnelle permettant de signaler le nom divin YHWH sans imposer une vocalisation reconstruite.
theological_decisions:
- issue: Identité et nombre du groupe ennemi
  choice: Conserver « ils » sans nommer explicitement l’Assyrie
  alternative: « les Assyriens » ou un collectif au singulier
  rationale: Le contexte permet d’identifier l’ennemi, mais le verset lui-même ne le nomme pas. La traduction préserve donc l’implicite et rend naturellement le collectif hébreu.
- issue: Temps de l’affliction de la destinataire
  choice: « Je t’ai humiliée »
  alternative: « Même si je t’ai humiliée » ou « Je t’humilierai »
  rationale: La forme verbale est un parfait, naturellement rendu comme une action accomplie. La concession « même si » n’est pas explicitement répétée dans cette proposition et ne doit pas être ajoutée sans nécessité.
- issue: Genre de la destinataire
  choice: 'féminin singulier : « humiliée »'
  alternative: masculin ou formulation neutralisant le genre
  rationale: Le suffixe hébreu est féminin singulier, vraisemblablement adressé à Juda ou Jérusalem personnifiée; le français peut préserver cette donnée.
translation_notes:
  register: Français international moderne, digne et oralement clair. La formulation conserve la solennité prophétique, l’image de la coupe et le féminin de l’adresse, tout en évitant d’identifier dans le texte ce que l’hébreu laisse implicite.
