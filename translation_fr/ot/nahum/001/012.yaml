revisions:
- from: 'Ainsi parle le SEIGNEUR : « Même s’ils sont au complet et nombreux, ils seront fauchés et disparaîtront. Je t’ai humiliée, mais je ne t’humilierai plus. »'
  to: 'Ainsi parle le SEIGNEUR : « Même s’ils sont intacts et nombreux, ils seront fauchés et disparaîtront. Je t’ai affligée, je ne t’affligerai plus. »'
  rationale: La révision remplace deux choix lexicalement trop étroits ou idiomatiquement moins précis, tout en conservant l’ennemi implicite, l’image de la coupe, la portée collective et le féminin singulier de la destinataire. La seconde phrase demeure concise et ne transforme pas sa relation logique en opposition explicite.
