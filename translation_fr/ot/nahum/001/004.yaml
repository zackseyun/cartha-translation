  text: גּוֹעֵ֤ר בַּ/יָּם֙ וַֽ/יַּבְּשֵׁ֔/הוּ וְ/כָל הַ/נְּהָר֖וֹת הֶֽחֱרִ֑יב אֻמְלַ֤ל בָּשָׁן֙ וְ/כַרְמֶ֔ל וּ/פֶ֥רַח לְבָנ֖וֹן אֻמְלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/004.yaml
  text: He rebukes the sea and dries it up; he makes all the rivers run dry[a]. Bashan and Carmel wither; even the blossom of Lebanon withers.
translation:
  language: fr
  text: Il réprimande la mer et la dessèche ; il met à sec tous les fleuves[a]. Le Bashân et le Carmel dépérissent ; la fleur du Liban dépérit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il dessèche tous les fleuves ».'
    reason: Le verbe hébreu peut se rendre plus directement par « dessécher » ; « mettre à sec » exprime ici naturellement sa valeur causative.
lexical_decisions:
- source_word: גּוֹעֵר
  choice: menace
  rationale: Le verbe גער exprime ici une parole divine autoritaire adressée à la mer. « Menace » conserve cette force et convient naturellement à la domination de Dieu sur les eaux.
- source_word: בַּיָּם וַיַּבְּשֵׁהוּ
  choice: la mer et la dessèche
  rationale: Le suffixe masculin singulier renvoie à la mer ; « dessèche » rend directement l’action de rendre sèche.
- source_word: וְכָל הַנְּהָרוֹת הֶחֱרִיב
  choice: il met à sec tous les fleuves
  rationale: Le hiphil de חרב indique que Dieu fait disparaître l’eau. « Met à sec » restitue clairement la valeur causative dans ce contexte.
- source_word: אֻמְלַל
  choice: dépérissent / dépérit
  rationale: Le verbe évoque le flétrissement et la perte de vigueur de terres réputées fertiles et de leur végétation. La répétition française préserve le parallélisme hébreu.
- source_word: בָּשָׁן וְכַרְמֶל
  choice: le Bashân et le Carmel
  rationale: Les noms géographiques sont translittérés ; l’article français est idiomatique pour ces régions ou reliefs.
- source_word: וּפֶרַח לְבָנוֹן
  choice: la fleur du Liban
  rationale: פֶרַח désigne la fleur ou la floraison. Le singulier français conserve l’image poétique collective sans ajouter une emphase absente du texte.
theological_decisions:
- issue: Sujet divin implicite
  choice: Employer « Il », en continuité avec le contexte où le sujet est le SEIGNEUR.
  alternative: Répéter explicitement « le SEIGNEUR ».
  rationale: L’hébreu ne répète pas le nom divin dans ce verset. Le pronom préserve la continuité poétique et n’ajoute rien au texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et la répétition finale sont conservés ; aucun « même » emphatique n’est ajouté devant « la fleur du Liban », car il n’est pas explicite en hébreu.
