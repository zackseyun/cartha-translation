  text: ט֣וֹב יְהוָ֔ה לְ/מָע֖וֹז בְּ/י֣וֹם צָרָ֑ה וְ/יֹדֵ֖עַ חֹ֥סֵי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/007.yaml
  text: Yahweh is good[a], a stronghold in the day of distress[c][b]; he knows those who take refuge in him.
translation:
  language: fr
  text: Yahweh est bon, une forteresse au jour de la détresse[a] ; il connaît ceux qui se réfugient en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au jour du malheur » ou « au temps de la détresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: bon
  rationale: L’adjectif qualifie de manière concise le caractère de Yahweh, dans un sens moral et bienfaisant large. « Bon » est l’équivalent français naturel et direct.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: לְמָעוֹז
  choice: une forteresse
  rationale: מָעוֹז désigne un lieu sûr et défendu. « Une forteresse » conserve l’image concrète de protection. Le לְ est compris ici dans une construction prédicative ou appositionnelle.
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: La locution est temporelle. « Détresse » exprime la force de צָרָה, tandis que « au jour de » garde la forme concise de l’hébreu sans imposer un sens eschatologique technique.
- source_word: וְיֹדֵעַ
  choice: il connaît
  rationale: ידע signifie fondamentalement « connaître » et peut ici impliquer reconnaissance et sollicitude. La traduction conserve cette portée sans la réduire à la connaissance intellectuelle ni l’expliciter excessivement.
- source_word: חֹסֵי בוֹ
  choice: ceux qui trouvent refuge en lui
  rationale: Le participe de חסה évoque la recherche d’un abri protecteur. « Trouvent refuge en lui » est idiomatique en français et maintient l’image de la forteresse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. Le conserver sous la forme « Yahweh » présente le nom personnel au lieu de lui substituer un titre.
- issue: Portée de « au jour de la détresse »
  choice: sens temporel général
  alternative: référence à un jour eschatologique déterminé
  rationale: Le verset pris isolément n’exige pas une lecture eschatologique technique. La formulation française préserve la possibilité d’un jour ou d’un temps de détresse sans préciser davantage.
- issue: Portée relationnelle de וְיֹדֵעַ
  choice: il connaît
  alternative: il prend soin de ; il reconnaît
  rationale: « Il connaît » préserve la tension du verbe hébreu, qui peut suggérer une connaissance relationnelle et bienveillante sans que cette nuance soit transformée en paraphrase doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure brève et poétique est conservée ; « forteresse » et « refuge » maintiennent le réseau d’images protectrices de l’hébreu.
