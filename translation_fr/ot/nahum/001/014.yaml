  to: 'Yahweh a donné cet ordre à ton sujet : « Plus aucune descendance ne naîtra de ton nom[a]. De la maison de tes dieux, je retrancherai l’image sculptée et l’image en métal fondu. Je préparerai ta tombe, car tu es méprisable[b]. »'
