  naturalness: Le français est globalement clair et actuel. « Plus aucune descendance ne naîtra de ton nom » est idiomatique tout en restant plus près de la formulation source. « Image sculptée » et « image en métal fondu » sont naturels dans un registre biblique moderne.
  terminology: « Yahweh » est approprié. Le pluriel « tes dieux » respecte la forme hébraïque. « Image sculptée » / « image en métal fondu » rendent mieux les termes techniques que « statues », qui peut restreindre indûment le référent. « Méprisable » est acceptable pour כִּי קַלּוֹתָ.
