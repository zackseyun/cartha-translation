source:
  edition: WLC
  text: וְ/צִוָּ֤ה עָלֶ֨י/ךָ֙ יְהוָ֔ה לֹֽא יִזָּרַ֥ע מִ/שִּׁמְ/ךָ֖ ע֑וֹד מִ/בֵּ֨ית אֱלֹהֶ֜י/ךָ אַכְרִ֨ית פֶּ֧סֶל וּ/מַסֵּכָ֛ה אָשִׂ֥ים קִבְרֶ֖/ךָ כִּ֥י קַלּֽוֹתָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/014.yaml
  text: 'Yahweh has commanded concerning you: No more will your name be sown[a]. From the house of your gods I will cut off carved image and cast image. I will make your grave[c][b], for you are contemptible.'
translation:
  language: fr
  text: 'Yahweh a donné cet ordre à ton sujet : « Plus aucune descendance ne naîtra de ton nom[a]. De la maison de tes dieux, je retrancherai l’image sculptée et l’image en métal fondu. Je préparerai ta tombe, car tu es méprisable[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il ne sera plus semé de ton nom. » Cette image annonce que sa lignée, ou sa dynastie, ne se perpétuera pas.'
    reason: La construction hébraïque conserve une métaphore de semence ; la traduction explicite son sens probable sans attribuer l’action à des descendants.
  - marker: b
    text: 'Ou : « car tu ne vaux rien » ; le terme peut aussi évoquer ce qui est insignifiant ou tenu en peu d’estime.'
    reason: Le mot hébreu associe les idées de légèreté, d’insignifiance et de mépris.
lexical_decisions:
- source_word: וְצִוָּה עָלֶיךָ יְהוָה
  choice: Yahweh a donné cet ordre à ton sujet
  rationale: Le parfait présente l’ordre divin comme prononcé et désormais en vigueur. « À ton sujet » conserve la portée large de עָלֶיךָ sans ajouter inutilement « contre toi ».
- source_word: לֹא יִזָּרַע מִשִּׁמְךָ עוֹד
  choice: Aucun descendant ne perpétuera plus ton nom[a]
  rationale: La formulation hébraïque, littéralement « il ne sera plus semé de ton nom », désigne vraisemblablement l’extinction de la lignée et du nom. Une traduction idiomatique évite en français une métaphore opaque, tandis que la note la préserve.
- source_word: מִבֵּית אֱלֹהֶיךָ
  choice: du temple de tes dieux
  rationale: « Temple » exprime ici le sens cultuel de בַּיִת. Le pluriel « tes dieux » respecte la morphologie dאֱלֹהֶיךָ et convient au contexte polythéiste assyrien.
- source_word: אַכְרִית
  choice: J’exterminerai
  rationale: Le hiphil de כרת annonce la suppression complète des objets cultuels. « Exterminer » rend avec naturel la force judiciaire du verbe dans ce contexte.
- source_word: פֶּסֶל וּמַסֵּכָה
  choice: les statues sculptées et les statues en métal fondu
  rationale: 'Ces expressions distinguent clairement les deux procédés de fabrication : taille ou sculpture pour פֶּסֶל, coulée du métal pour מַסֵּכָה.'
- source_word: אָשִׂים קִבְרֶךָ
  choice: Je préparerai ta tombe
  rationale: Cette formulation française naturelle garde la brièveté menaçante de l’hébreu et exprime que Yahweh destine l’interpellé à la mort et à l’ensevelissement.
- source_word: כִּי קַלּוֹתָ
  choice: car tu es méprisable[b]
  rationale: Le verbe issu de קלל évoque ce qui est léger, sans valeur ou tenu en mépris. « Méprisable » convient au contexte de condamnation, sans effacer les autres nuances possibles.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin personnel. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de l’image « ton nom ne sera plus semé »
  choice: Expliciter dans le texte l’extinction de la descendance et la fin de la perpétuation du nom
  alternative: 'Conserver littéralement : « Rien ne sera plus semé de ton nom »'
  rationale: En français moderne, la traduction littérale est difficilement intelligible. Le contexte vise probablement la disparition de la lignée ou dynastie, mais la note conserve l’image et signale cette portée.
- issue: Nombre dאֱלֹהֶיךָ
  choice: tes dieux
  alternative: ton dieu
  rationale: La forme est plurielle et le contexte de destruction de plusieurs représentations cultuelles favorise une référence aux divinités assyriennes, sans qu’il faille imposer un singulier.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le discours direct met nettement en relief le contenu de l’ordre divin. « Statue » est plus concret et courant qu’« image » pour des objets cultuels façonnés ; « métal fondu » précise naturellement le procédé de fabrication.
