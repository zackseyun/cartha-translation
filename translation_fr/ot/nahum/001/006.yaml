  text: לִ/פְנֵ֤י זַעְמ/וֹ֙ מִ֣י יַֽעֲמ֔וֹד וּ/מִ֥י יָק֖וּם בַּ/חֲר֣וֹן אַפּ֑/וֹ חֲמָת/וֹ֙ נִתְּכָ֣ה כָ/אֵ֔שׁ וְ/הַ/צֻּרִ֖ים נִתְּצ֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/006.yaml
  text: Who can stand before his indignation? And who can rise up in the heat of his anger? His wrath is poured out like fire[c][b][a], and the rocks are shattered by him.
translation:
  language: fr
  text: Qui peut tenir devant son indignation ? Et qui peut se dresser dans l’ardeur de sa colère[a] ? Sa fureur se déverse comme du feu, et les rochers[b] sont fracassés par lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le feu de sa colère ».
    reason: Cette formulation conserve l’image de brûlure portée par l’expression hébraïque « l’ardeur de sa colère ».
  - marker: b
    text: Ou « les falaises » ou « les escarpements ».
    reason: Le nom hébreu צוּר peut désigner diverses formations rocheuses imposantes.
  - marker: c
    text: Ou « se brisent à cause de lui » ou « de lui ». La préposition hébraïque peut exprimer l’agent, la cause ou la provenance.
    reason: La valeur exacte de מִמֶּנּוּ demeure ouverte dans ce contexte; la note préserve cette ambiguïté sans imposer une interprétation unique.
lexical_decisions:
- source_word: לִפְנֵי זַעְמוֹ
  choice: devant son indignation
  rationale: « Devant » rend naturellement l’idée de présence exprimée par לִפְנֵי, tandis qu’« indignation » conserve la dimension morale de זַעַם sans réduire le terme à une émotion incontrôlée.
- source_word: יַעֲמוֹד
  choice: peut tenir
  rationale: Dans cette question rhétorique, « peut tenir » exprime à la fois la capacité de rester debout et celle de résister au jugement divin.
- source_word: יָקוּם
  choice: peut se dresser
  rationale: Le verbe קוּם signifie se lever ou se dresser. Ce choix le distingue de עמד tout en maintenant le parallélisme poétique.
- source_word: בַּחֲרוֹן אַפּוֹ
  choice: quand sa colère s’enflamme
  rationale: Cette formulation française naturelle conserve l’image de la chaleur ou de l’embrasement de la colère. Une note donne une traduction plus formelle.
- source_word: חֲמָתוֹ
  choice: sa fureur
  rationale: « Fureur » rend l’intensité de חֵמָה et préserve la variété des trois termes hébreux relatifs à la colère dans le verset.
- source_word: נִתְּכָה כָאֵשׁ
  choice: se déverse comme le feu
  rationale: Le verbe décrit une effusion; la tournure conserve l’image saisissante de la fureur répandue comme du feu.
- source_word: הַצֻּרִים
  choice: les rochers
  rationale: צוּר peut désigner des rochers, des falaises ou des escarpements. « Rochers » reste général et convient à l’image de puissantes formations naturelles brisées.
- source_word: נִתְּצוּ
  choice: sont fracassés
  rationale: Le passif exprime la destruction violente ou la dislocation des rochers, avec la force requise par le contexte.
- source_word: מִמֶּנּוּ
  choice: par lui
  rationale: Avec le passif, la préposition מִן peut désigner l’agent. Une note préserve aussi la possibilité d’une nuance causale ou de provenance.
theological_decisions:
- issue: Diversité des termes désignant la colère divine
  choice: Employer « indignation », « colère » et « fureur ».
  alternative: Répéter « colère » ou employer partout des termes plus violents comme « rage ».
  rationale: L’hébreu accumule trois mots apparentés mais distincts. Les différencier en français préserve l’intensité et la texture poétique sans ajouter une distinction doctrinale artificielle.
- issue: Portée des questions rhétoriques
  choice: Formuler les deux questions avec « peut ».
  alternative: Traduire simplement « Qui tient… ? Qui se dresse… ? » ou expliciter par « Qui peut résister… ? ».
  rationale: Le contexte met en avant l’incapacité de quiconque à subsister devant la colère divine. « Peut » rend clairement cette portée sans transformer l’image en explication.
- issue: Relation de Dieu à la destruction des rochers
  choice: « sont fracassés par lui »
  alternative: « se brisent à cause de lui » ou « se disloquent loin de lui »
  rationale: La formulation principale retient la lecture instrumentale naturelle avec un passif, mais la note maintient l’ambiguïté de מִמֶּנּוּ entre agent, cause et provenance.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les questions restent brèves et solennelles; la diversité lexicale et les images de l’embrasement, du feu répandu et des rochers fracassés sont conservées.
