  to: Que tramez-vous contre Yahweh ? Il y mettra un terme définitif[a] ; la détresse ne surgira pas une seconde fois[b].
  rationale: La révision remplace une expression française susceptible de malentendu par une formulation naturelle qui présente Yahweh comme l’auteur d’une fin définitive. Elle maintient la concision, la force rhétorique et l’ambiguïté du dernier membre. Les deux appels de note demeurent attachés aux unités textuelles pertinentes.
