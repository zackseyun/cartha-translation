  text: מַה תְּחַשְּׁבוּ/ן֙ אֶל יְהוָ֔ה כָּלָ֖ה ה֣וּא עֹשֶׂ֑ה לֹֽא תָק֥וּם פַּעֲמַ֖יִם צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/009.yaml
  text: What are you plotting against Yahweh? He will make a complete end[b][a]; trouble will not rise up a second time.
translation:
  language: fr
  text: Que tramez-vous contre Yahweh ? Il y mettra un terme définitif[a] ; la détresse ne surgira pas une seconde fois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus près de l’hébreu : « Il accomplit une fin complète. » Le texte exprime une fin totale et décisive ; on peut aussi traduire : « Il provoquera une destruction totale. »'
    reason: La construction hébraïque כָּלָה הוּא עֹשֶׂה est concise et décrit l’accomplissement d’une fin complète, avec une nuance possible de destruction dans le contexte du jugement.
  - marker: b
    text: 'Ou : « la détresse ne se lèvera pas deux fois ». Cette phrase concise peut viser soit une nouvelle attaque de l’ennemi, soit l’absence de nécessité de répéter le jugement.'
    reason: Le référent de צָרָה (« détresse, malheur, affliction ») et le point de vue de la proposition restent implicites en hébreu.
lexical_decisions:
- source_word: מַה
  choice: Que
  rationale: Introduit directement la question rhétorique, sans transformer l’interrogatif en « pourquoi ».
- source_word: תְּחַשְּׁבוּן
  choice: projetez-vous
  rationale: Le verbe חשׁב peut signifier penser, concevoir ou tramer ; dans ce contexte hostile, « projeter » exprime l’idée de dessein sans la surinterpréter.
- source_word: אֶל
  choice: contre
  rationale: Avec un verbe désignant un dessein hostile, la préposition marque ici l’opposition à Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve son caractère de nom propre.
- source_word: כָּלָה
  choice: en finir complètement
  rationale: Rend l’idée d’achèvement total et, dans ce contexte de jugement, celle d’une fin décisive, dans un français naturel.
- source_word: הוּא עֹשֶׂה
  choice: Il va
  rationale: Le pronom suivi du participe souligne l’agent et peut exprimer une action certaine ou imminente ; le futur proche convient au discours prophétique français.
- source_word: לֹא תָקוּם
  choice: ne surgira pas
  rationale: Conserve l’image de קום, « se lever, surgir », tout en restant idiomatique.
- source_word: פַּעֲמַיִם
  choice: une seconde fois
  rationale: Expression française naturelle pour l’idée littérale de « deux fois ».
- source_word: צָרָה
  choice: la détresse
  rationale: Terme suffisamment large pour désigner affliction, calamité ou situation pénible, sans fixer l’identité de celui qui la subit.
theological_decisions:
- issue: Référent et portée de la dernière proposition
  choice: « la détresse ne surgira pas une seconde fois »
  alternative: « l’attaque ennemie ne se dressera pas une seconde fois » ou « l’affliction ne retombera pas une seconde fois sur le peuple de Dieu »
  rationale: L’hébreu est concis et ne précise pas explicitement le point de vue. La formulation retenue maintient l’ambiguïté entre la fin de l’agression ennemie et le caractère non répétitif du jugement divin.
translation_notes:
  register: Français international moderne, sobre et digne. La question conserve sa force rhétorique ; la seconde moitié reste concise et préserve l’ambiguïté du texte hébreu.
