  text: הָרִים֙ רָעֲשׁ֣וּ מִמֶּ֔/נּוּ וְ/הַ/גְּבָע֖וֹת הִתְמֹגָ֑גוּ וַ/תִּשָּׂ֤א הָ/אָ֨רֶץ֙ מִ/פָּנָ֔י/ו וְ/תֵבֵ֖ל וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/005.yaml
  text: The mountains quake before him[a], and the hills melt away; the earth rises up before his face[b], the world and all who dwell in it.
translation:
  language: fr
  text: Les montagnes tremblent devant lui, et les collines fondent ; la terre se soulève[a] devant lui[b], le monde et tous ceux qui l’habitent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « la terre est soulevée » ou « la terre se soulève violemment ». Le verbe hébreu peut évoquer ici l’élévation ou un violent bouleversement.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « devant lui » signifie littéralement « de devant sa face ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים רָעֲשׁוּ מִמֶּנּוּ
  choice: Les montagnes tremblent devant lui
  rationale: רעשׁ exprime un tremblement violent, ici dans une scène théophanique. « Devant lui » rend naturellement la réaction provoquée par sa présence, là où la préposition signifie littéralement « venant de lui » ou « à cause de lui ».
- source_word: וְהַגְּבָעוֹת הִתְמֹגָגוּ
  choice: et les collines fondent
  rationale: Le hitpael de מוג décrit les collines qui se dissolvent ou fondent. « Fondent » conserve l’image forte sans l’alourdir.
- source_word: וַתִּשָּׂא הָאָרֶץ
  choice: la terre se soulève
  rationale: La forme de נשׂא évoque ici l’élévation ou le bouleversement de la terre. « Se soulève » préserve le mouvement ascendant tout en restant idiomatique en français.
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: L’expression signifie littéralement « de devant sa face ». Le français naturel « devant lui » conserve l’idée de la présence divine; la tournure concrète de l’hébreu est signalée en note.
- source_word: וְתֵבֵל
  choice: le monde
  rationale: תבל désigne le monde habité ou ordonné. Dans ce parallélisme de portée universelle, « le monde » convient mieux que « le pays ».
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: et tous ceux qui l’habitent
  rationale: Le participe désigne l’ensemble des habitants du monde. Cette formulation est claire, actuelle et proche de la construction hébraïque.
theological_decisions:
- issue: Imagerie cosmique de la manifestation et du jugement divins
  choice: Présenter la création entière comme réagissant à la présence de Dieu, sans atténuer les images de tremblement, de fonte et de soulèvement.
  alternative: Interpréter explicitement ces images comme la seule représentation figurée de bouleversements politiques.
  rationale: Le contexte immédiat décrit une manifestation de la colère et de la majesté divines. La traduction garde la portée cosmique du texte sans imposer une explication littéraliste ou exclusivement métaphorique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme binaire et les images concrètes de l’hébreu sont conservés; « devant lui » évite une tournure française artificielle tout en maintenant le langage de la présence divine.
