  text: מַשָּׂ֖א נִֽינְוֵ֑ה סֵ֧פֶר חֲז֛וֹן נַח֖וּם הָ/אֶלְקֹשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/001.yaml
  text: An oracle concerning Nineveh[a]. The book of the vision of Nahum the Elkoshite.
translation:
  language: fr
  text: Oracle concernant Ninive[a]. Livre de la vision de Nahum, l’Elqoshite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Oracle concernant Ninive » ou « Fardeau de Ninive ».
    reason: 'Alternative lexicale : מַשָּׂא peut désigner un oracle prophétique solennel et comporte aussi la nuance littérale de « fardeau ».'
lexical_decisions:
- source_word: מַשָּׂא
  choice: proclamation
  rationale: Dans un titre prophétique, le terme désigne une déclaration solennelle et chargée de poids. « Proclamation » est naturel en français moderne et conserve cette valeur sans suggérer une charge matérielle.
- source_word: נִינְוֵה
  choice: Ninive
  rationale: Forme française conventionnelle du nom de lieu.
- source_word: סֵפֶר
  choice: livre
  rationale: Le terme peut désigner un écrit, un document ou un rouleau ; dans ce titre, « livre » est la formulation française la plus naturelle.
- source_word: חֲזוֹן
  choice: vision
  rationale: Terme prophétique courant désignant une révélation reçue sous forme de vision ou présentée comme telle ; « vision » en préserve la portée sans préciser davantage son mode.
- source_word: נַחוּם
  choice: Nahum
  rationale: Forme française conventionnelle du nom personnel.
- source_word: הָאֶלְקֹשִׁי
  choice: l’Elqoshite
  rationale: L’adjectif avec article identifie Nahum par son origine ou son lien avec Elqosh. La forme gentilique rend directement cette nuance, sans affirmer plus précisément qu’il y serait né ou qu’il y résiderait.
theological_decisions:
- issue: Rapport entre les deux groupes nominaux du titre
  choice: 'Deux énoncés brefs : « Proclamation concernant Ninive. Livre de la vision de Nahum, l’Elqoshite. »'
  alternative: 'Un seul titre continu : « Proclamation concernant Ninive, livre de la vision de Nahum, l’Elqoshite. »'
  rationale: L’hébreu juxtapose deux éléments de titre. Deux phrases nominales en conservent la structure et évitent de laisser entendre que Ninive est l’auteur ou la source de la proclamation.
- issue: Sens de מַשָּׂא dans le titre prophétique
  choice: « proclamation » dans le texte, avec les variantes « oracle » et « fardeau » en note
  alternative: « Oracle » ou, plus littéralement, « fardeau » dans le texte principal
  rationale: « Proclamation » exprime clairement une déclaration prophétique solennelle. La note maintient la métaphore traditionnelle de la charge ainsi que l’équivalent technique « oracle », sans trancher silencieusement la nuance du terme.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux phrases nominales gardent la concision d’un titre prophétique. « Elqoshite » conserve l’identification géographique sans la développer de manière spéculative.
