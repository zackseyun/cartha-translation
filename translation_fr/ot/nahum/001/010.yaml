source:
  edition: WLC
  text: כִּ֚י עַד סִירִ֣ים סְבֻכִ֔ים וּ/כְ/סָבְאָ֖/ם סְבוּאִ֑ים אֻ֨כְּל֔וּ כְּ/קַ֥שׁ יָבֵ֖שׁ מָלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/010.yaml
  text: For though they are tangled like thorns[a], and drenched with their drink[b], they will be consumed like fully dry stubble.
translation:
  language: fr
  text: Car, bien qu’ils soient enchevêtrés comme des épines[a] et gorgés de leur boisson[b], ils seront consumés comme de la paille entièrement sèche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé. On peut aussi comprendre : « tandis qu’ils sont enchevêtrés comme des épines » ou simplement : « ils sont enchevêtrés comme des épines ».'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu est difficile. On peut aussi comprendre : « comme des ivrognes, ils sont ivres de leur boisson » ou « au milieu de leur beuverie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַד
  choice: Car, bien que
  rationale: Cette expression poétique très resserrée introduit l’explication du jugement annoncé tout en donnant vraisemblablement à la première proposition une valeur concessive. Une note conserve l’autre lecture possible.
- source_word: סִירִים סְבֻכִים
  choice: enchevêtrés comme des épines
  rationale: סִירִים désigne des épines ou des broussailles épineuses, et סְבֻכִים ce qui est entrelacé ou pris dans un enchevêtrement. La formulation française garde l’image de végétaux serrés les uns contre les autres.
- source_word: וּכְסָבְאָם סְבוּאִים
  choice: et gorgés de leur boisson
  rationale: La formulation hébraïque est difficile et joue sur deux termes liés à la boisson et à l’ivresse. « Gorgés de leur boisson » restitue l’idée de saturation sans imposer une analyse grammaticale incertaine; les autres possibilités figurent en note.
- source_word: אֻכְּלוּ
  choice: ils seront consumés
  rationale: Le parfait passif peut présenter le jugement futur comme certain. « Consumés » convient à la comparaison avec une matière végétale sèche promise au feu, sans ajouter explicitement le verbe « brûler » absent de l’hébreu.
- source_word: כְּקַשׁ יָבֵשׁ מָלֵא
  choice: comme de la paille entièrement sèche
  rationale: קַשׁ désigne la paille ou le chaume sec. מָלֵא intensifie ici la sécheresse; « entièrement sèche » rend naturellement cette force en français.
theological_decisions:
- issue: Valeur temporelle du parfait prophétique אֻכְּלוּ
  choice: futur certain (« ils seront consumés »)
  alternative: accompli (« ils sont consumés »)
  rationale: Dans ce contexte d’annonce du jugement, le futur exprime clairement en français la portée prospective de l’accompli prophétique, sans diminuer sa certitude.
- issue: Rapport logique de la première proposition
  choice: lecture concessive (« bien qu’ils soient »)
  alternative: lecture temporelle (« tandis qu’ils sont ») ou simple constat
  rationale: La lecture concessive fait ressortir que ni leur cohésion ni leur état d’ivresse ne les protégeront. Comme l’expression hébraïque est comprimée et discutée, l’alternative est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, poétique et digne. « Enchevêtrés », « gorgés » et « consumés » préservent les images fortes de l’hébreu tout en restant accessibles. Les notes rendent visibles les deux principales incertitudes du verset.
