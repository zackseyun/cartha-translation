  variant: modern international French
source:
  edition: WLC
  text: אֵ֣ל קַנּ֤וֹא וְ/נֹקֵם֙ יְהוָ֔ה נֹקֵ֥ם יְהוָ֖ה וּ/בַ֣עַל חֵמָ֑ה נֹקֵ֤ם יְהוָה֙ לְ/צָרָ֔י/ו וְ/נוֹטֵ֥ר ה֖וּא לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/002.yaml
  text: Yahweh is a jealous and avenging God[a]; Yahweh is avenging and full of wrath. Yahweh takes vengeance on his adversaries[c][b], and he keeps wrath for his enemies.
translation:
  language: fr
  text: Yahweh est un Dieu jaloux[a] et vengeur ; Yahweh est vengeur et plein d’une ardente colère[b]. Yahweh se venge de ses adversaires et garde sa colère pour ses ennemis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « zélé ». Le terme hébreu exprime ici le zèle exclusif de Dieu dans le cadre de l’alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « maître » ou « possesseur d’une ardente colère ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « réserve sa colère à ses ennemis » ; autre traduction possible : « garde rancune à ses ennemis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Dieu
  rationale: Dans cette construction, אֵל désigne le Dieu d’Israël, ensuite caractérisé par les termes « jaloux » et « vengeur ». « Dieu » est la formulation française la plus naturelle sans ajouter l’idée de puissance.
- source_word: קַנּוֹא
  choice: jaloux
  rationale: Le terme exprime le zèle exclusif de Yahweh dans le cadre de l’alliance. « Jaloux » conserve cette dimension relationnelle forte ; une note précise qu’il ne s’agit pas d’une envie mesquine.
- source_word: נֹקֵם / וְנֹקֵם
  choice: vengeur / se venge
  rationale: La racine נקם apparaît trois fois. L’alternance entre l’adjectif « vengeur » et le verbe « se venge » conserve cette insistance tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וּבַעַל חֵמָה
  choice: plein d’une ardente colère
  rationale: Littéralement « maître/possesseur de colère ardente », l’expression décrit celui qui possède pleinement cette colère. La formulation retenue est naturelle en français et maintient la force du jugement divin.
- source_word: חֵמָה
  choice: ardente colère
  rationale: חֵמָה désigne ici une colère intense liée au jugement. « Ardente colère » en restitue la vigueur sans suggérer nécessairement une perte de maîtrise.
- source_word: לְצָרָיו
  choice: de ses adversaires
  rationale: Avec le verbe « se venger », la préposition française « de » introduit idiomatiquement ceux qui subissent la vengeance ; « adversaires » restitue la portée hostile de צרים.
- source_word: וְנוֹטֵר
  choice: garde sa colère
  rationale: נטר signifie garder, conserver ou maintenir. Le complément « sa colère », implicite en hébreu et fourni par le contexte immédiat, rend le sens intelligible en français tout en préservant l’idée d’une colère maintenue en réserve.
- source_word: הוּא
  choice: il
  rationale: Le pronom hébreu explicite souligne le sujet dans la dernière proposition. Le français le rend naturellement par « il ».
- source_word: לְאֹיְבָיו
  choice: pour ses ennemis
  rationale: La préposition לְ indique ici ceux auxquels la colère est réservée. « Pour ses ennemis » conserve cette nuance plutôt que de réduire la construction à une simple hostilité dirigée contre eux.
theological_decisions:
- issue: La jalousie divine
  choice: Décrire Yahweh comme « jaloux » au sens d’un attachement exclusif et d’un zèle conforme à l’alliance.
  alternative: Traduire par « zélé ».
  rationale: « Jaloux » maintient la catégorie biblique et la force relationnelle de קַנּוֹא, tandis que la note empêche de l’assimiler à une envie humaine mesquine.
- issue: La vengeance et la colère de Dieu
  choice: Conserver le vocabulaire appuyé de la vengeance et de l’ardente colère.
  alternative: Employer des termes atténués comme « punir » ou « être mécontent ».
  rationale: Le triple emploi de נקם et la présence de חֵמָה exigent de garder la vigueur du langage de jugement sans l’adoucir ni le réduire à un état psychologique.
- issue: Le sens de נטר dans la dernière proposition
  choice: Comprendre que Yahweh conserve sa colère pour ses ennemis.
  alternative: Comprendre qu’il garde rancune à ses ennemis.
  rationale: Le contexte de חֵמָה soutient l’idée d’une colère gardée en réserve. La solution alternative est lexicalement possible, mais « garder rancune » serait plus psychologisante et familière en français.
translation_notes:
  register: Français international actuel, digne et accessible. La structure en trois propositions et la répétition de l’idée de vengeance reproduisent l’insistance rhétorique de l’hébreu. Le point-virgule évite une phrase hachée tout en maintenant le parallélisme.
