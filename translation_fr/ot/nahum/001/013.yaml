id: NAM.1.13
reference: Nahum 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֶשְׁבֹּ֥ר מֹטֵ֖/הוּ מֵֽ/עָלָ֑יִ/ךְ וּ/מוֹסְרֹתַ֖יִ/ךְ אֲנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/013.yaml
  text: And now I will break his yoke from upon you[a], and I will tear off your bonds.
translation:
  language: fr
  text: Et maintenant, je briserai son joug qui pèse sur toi[a], et j’arracherai tes liens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa barre qui repose sur toi ». Le terme hébreu peut désigner un bâton, une barre ou un joug ; ici, « joug » correspond le mieux aux images conjointes de l’oppression et des liens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction et la valeur temporelle du marqueur discursif, dans un français naturel.
- source_word: אֶשְׁבֹּר
  choice: je briserai
  rationale: Rend directement le qal inaccompli de שבר et convient à l’image du joug.
- source_word: מֹטֵהוּ
  choice: son joug
  rationale: Le nom peut désigner une barre, un bâton ou un joug. Associé ici aux liens et à l’oppression, « joug » exprime le mieux la métaphore sans expliciter l’identité du possesseur.
- source_word: מֵעָלַיִךְ
  choice: qui pèse sur toi
  rationale: La tournure restitue l’image d’une charge placée au-dessus de la destinataire féminine, tout en évitant le calque peu naturel « de dessus toi ».
- source_word: וּמוֹסְרֹתַיִךְ
  choice: tes liens
  rationale: Terme suffisamment large pour évoquer des entraves concrètes ou la sujétion métaphorique, et qui s’accorde bien avec l’image du joug.
- source_word: אֲנַתֵּק
  choice: j’arracherai
  rationale: Le piel de נתק exprime l’action de détacher avec force, d’arracher ou de rompre. « Arracher » rend ici la vigueur de la délivrance.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans מֹטֵהוּ
  choice: Conserver « son joug » sans identifier explicitement le possesseur.
  alternative: « le joug de l’Assyrie »
  rationale: Le contexte renvoie vraisemblablement à la puissance oppressive, probablement l’Assyrie ou son roi, mais l’hébreu ne donne qu’un suffixe de troisième personne du masculin singulier. La traduction maintient cette réserve.
translation_notes:
  register: Français moderne, international et digne. La destinataire est au féminin singulier en hébreu, ce que conserve « toi ». « Qui pèse sur toi » rend naturellement l’image spatiale et oppressive de מֵעָלַיִךְ.
