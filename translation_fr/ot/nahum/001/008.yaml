source:
  edition: WLC
  text: וּ/בְ/שֶׁ֣טֶף עֹבֵ֔ר כָּלָ֖ה יַעֲשֶׂ֣ה מְקוֹמָ֑/הּ וְ/אֹיְבָ֖י/ו יְרַדֶּף חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/008.yaml
  text: But with an overwhelming flood he will make a complete end of its place[a], and darkness will pursue his enemies.
translation:
  language: fr
  text: Mais par un flot dévastateur, il fera entièrement disparaître son lieu[a], et les ténèbres poursuivront ses ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « son lieu », avec un suffixe féminin singulier. Il renvoie probablement à la ville jugée, personnifiée comme une femme, mais l’antécédent n’est pas exprimé.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְשֶׁטֶף עֹבֵר
  choice: Mais par un flot dévastateur
  rationale: Le וּ peut prendre ici une valeur adversative après la protection évoquée au verset 7. שֶׁטֶף désigne un flot ou torrent débordant, et עֹבֵר le présente comme traversant ou balayant tout sur son passage. « Flot dévastateur » restitue naturellement l’image et sa force sans la réduire à une simple métaphore.
- source_word: כָּלָה יַעֲשֶׂה
  choice: il anéantira entièrement
  rationale: La construction signifie littéralement qu’il « fera une fin complète ». Cette formulation verbale française exprime clairement l’achèvement total de la destruction.
- source_word: מְקוֹמָהּ
  choice: le lieu où elle se tient
  rationale: Le suffixe est féminin singulier, mais son antécédent reste implicite. Cette formulation conserve la référence féminine, probablement à la ville ou à la puissance jugée, tout en donnant à מָקוֹם son sens de lieu ou emplacement.
- source_word: וְאֹיְבָיו
  choice: et ses ennemis
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au SEIGNEUR dans le contexte. Le français « ses » laisse toutefois cette référence dépendre du contexte, comme en hébreu.
- source_word: יְרַדֶּף חֹשֶׁךְ
  choice: les ténèbres poursuivront
  rationale: Le piel de רדף signifie « poursuivre » et חֹשֶׁךְ signifie littéralement « ténèbres ». La personnification menaçante est conservée sans expliciter les connotations de jugement.
theological_decisions:
- issue: Référents différents des suffixes de « son lieu » et de « ses ennemis »
  choice: La référence féminine de מְקוֹמָהּ vise la ville ou la puissance jugée, probablement Ninive, tandis que le suffixe masculin de וְאֹיְבָיו renvoie au SEIGNEUR.
  alternative: Comprendre מְקוֹמָהּ de façon impersonnelle (« son emplacement ») ou rattacher les deux suffixes au même référent.
  rationale: L’hébreu passe explicitement d’un suffixe féminin singulier à un suffixe masculin singulier. La traduction préserve ce changement plutôt que d’uniformiser les référents.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme demeure prophétique et l’image concrète du flot et des ténèbres est préservée. La note signale l’ambiguïté réelle du suffixe féminin sans imposer Ninive dans le texte principal.
