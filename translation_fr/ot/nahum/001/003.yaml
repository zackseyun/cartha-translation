  text: יְהֹוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ ו/גדול כֹּ֔חַ וְ/נַקֵּ֖ה לֹ֣א יְנַקֶּ֑ה יְהוָ֗ה בְּ/סוּפָ֤ה וּ/בִ/שְׂעָרָה֙ דַּרְכּ֔/וֹ וְ/עָנָ֖ן אֲבַ֥ק רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/003.yaml
  text: Yahweh is slow to anger and great in power[a], and he will by no means leave the guilty unpunished. Yahweh—his way is in the whirlwind and the storm, and clouds are the dust of his feet.
translation:
  language: fr
  text: 'Yahweh est lent à la colère et grand en puissance ; il ne laisse en aucun cas le coupable impuni.[a] Yahweh : son chemin est dans le tourbillon et la tempête, et les nuages sont la poussière de ses pieds.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « il n’acquitte en aucun cas » ou « il ne tient nullement pour innocent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה / יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin exprimé directement dans le texte hébreu et préserve sa fonction de nom propre.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: Rend naturellement l’idiome hébreu qui exprime la patience et la maîtrise de la colère.
- source_word: ו/גדול כֹּחַ
  choice: et grand par sa puissance
  rationale: Reproduit l’idée de grandeur associée à la force, dans un français courant et digne.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: mais il ne laisse absolument pas le coupable impuni
  rationale: L’opposition « mais » restitue ici la tension entre patience et justice; « absolument pas » rend la négation emphatique, tandis que « le coupable » explicite l’objet sous-entendu.
- source_word: בְּסוּפָה וּבִשְׂעָרָה
  choice: dans le tourbillon et la tempête
  rationale: Conserve les deux images de phénomènes météorologiques violents.
- source_word: דַּרְכּוֹ
  choice: marche
  rationale: Transpose idiomatiquement « son chemin est dans » en une expression française dynamique sans perdre l’image du déplacement divin.
- source_word: וְעָנָן אֲבַק רַגְלָיו
  choice: et les nuages sont la poussière de ses pieds
  rationale: Rend le singulier collectif hébreu par le pluriel naturel en français et conserve intacte la métaphore.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée de וְנַקֵּה לֹא יְנַקֶּה
  choice: il ne laisse absolument pas le coupable impuni
  alternative: il ne tient absolument pas pour innocent
  rationale: Le choix principal exprime clairement la justice punitive, tout en maintenant la tension avec la patience divine; la note conserve l’alternative judiciaire plus formelle.
translation_notes:
  register: Français international moderne, accessible et digne. Le parallélisme poétique et l’imagerie de la théophanie sont préservés; la formulation évite un juridisme excessif dans le corps du texte tout en le signalant en note.
