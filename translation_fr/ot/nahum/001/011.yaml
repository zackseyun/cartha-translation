source:
  edition: WLC
  text: מִמֵּ֣/ךְ יָצָ֔א חֹשֵׁ֥ב עַל יְהוָ֖ה רָעָ֑ה יֹעֵ֖ץ בְּלִיָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/011.yaml
  text: From you has come one who plots evil against Yahweh[a], a counselor of worthlessness.
translation:
  language: fr
  text: De toi est sorti celui qui trame le mal contre Yahweh, un conseiller pervers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un conseiller de Bélial », si בְּלִיָּעַל est compris comme un terme employé à la manière d’un nom propre plutôt qu’au sens de « perversité ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֵּךְ
  choice: De toi
  rationale: La préposition מִן avec le suffixe de deuxième personne féminine singulière marque l’origine. « De toi » reste naturel en français; le féminin, qui renvoie probablement à une ville ou à une entité collective, n’a pas à être explicité ici.
- source_word: יָצָא
  choice: est sorti
  rationale: Le verbe à l’accompli présente une action réalisée et exprime ici l’émergence depuis le destinataire. « Est sorti » conserve nettement cette image.
- source_word: חֹשֵׁב
  choice: celui qui trame
  rationale: Le participe de חשׁב désigne ici quelqu’un qui conçoit un projet hostile. « Trame » rend naturellement l’idée de préméditation malveillante.
- source_word: עַל יְהוָה
  choice: contre Yahweh
  rationale: Dans ce contexte hostile, עַל a une valeur adversative plutôt que le sens neutre de « au sujet de ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans le remplacer par un titre.
- source_word: רָעָה
  choice: le mal
  rationale: Le contexte porte sur une intention malveillante dirigée contre Yahweh; le sens moral « mal » convient mieux que « malheur » ou « désastre ».
- source_word: יֹעֵץ
  choice: un conseiller
  rationale: Le participe est employé comme un nom en apposition à la personne déjà décrite. « Conseiller » en préserve la concision.
- source_word: בְּלִיָּעַל
  choice: de perversité
  rationale: Le terme qualifie ici vraisemblablement un conseil sans valeur morale, mauvais ou pervers. « De perversité » garde la construction nominale et évite d’imposer la lecture plus tardive d’un nom propre.
theological_decisions:
- issue: Interprétation de בְּלִיָּעַל
  choice: Nom commun exprimant la perversité
  alternative: Nom propre « Bélial »
  rationale: Dans l’usage de la Bible hébraïque, le mot peut désigner ce qui est vil, mauvais ou pervers sans nécessairement personnifier Bélial. La traduction principale retient ce sens qualitatif, tandis que la note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le mouvement « de toi… est sorti », le parallélisme des deux désignations de la même personne et l’ambiguïté de בְּלִיָּעַל grâce à la note.
