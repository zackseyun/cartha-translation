    rationale: « Videurs » désigne normalement des agents de sécurité chargés d’expulser des clients ; ce n’est pas une traduction recevable de בֹּקְקִים. La note doit expliquer l’image d’« emptiers » par « ravageurs/pillards » et le dépouillement complet.
  - severity: low
    issue: « Des dévastateurs les ont dévastés » est très pesant en français moderne.
    rationale: La répétition de racine hébraïque marque l’intensité, mais une traduction idiomatique peut la rendre par « des pillards les ont dépouillés », avec une note explicitant la construction intensive.
