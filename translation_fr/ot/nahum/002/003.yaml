id: NAM.2.3
reference: Nahum 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י שָׁ֤ב יְהוָה֙ אֶת גְּא֣וֹן יַעֲקֹ֔ב כִּ/גְא֖וֹן יִשְׂרָאֵ֑ל כִּ֤י בְקָקוּ/ם֙ בֹּֽקְקִ֔ים וּ/זְמֹרֵי/הֶ֖ם שִׁחֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/003.yaml
  text: For Yahweh is restoring the majesty of Jacob like the majesty of Israel[c][b][a], though destroyers have destroyed them and ruined their vine branches.
translation:
  language: fr
  text: Car Yahweh rétablit[a] la splendeur de Jacob, comme la splendeur d’Israël[b], car des pillards les ont dépouillés[c] et ont détruit leurs sarments.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a rétabli » ou « rétablira » ; le verbe hébreu peut présenter comme déjà accomplie une action prophétiquement certaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « la fierté de Jacob, comme celle d’Israël ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, l’hébreu répète la même racine : « des ravageurs les ont vidés ». Cette expression souligne qu’ils ont été entièrement dépouillés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: rétablit
  rationale: Le qatal de שׁוב peut présenter l’action comme accomplie ou comme certaine dans l’annonce prophétique. Le présent français exprime ici vivement l’intervention de Dieu sans la réduire à un simple passé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, plutôt que remplacement par un titre.
- source_word: גְּאוֹן
  choice: splendeur
  rationale: Dans cette action favorable de Yahweh envers Jacob et Israël, le sens positif de dignité ou d’éclat convient mieux que « orgueil », qui évoquerait spontanément une faute en français.
- source_word: כִ/גְאוֹן
  choice: comme la splendeur
  rationale: Le préfixe כ est compris dans son sens comparatif, conformément à la vocalisation massorétique, tout en signalant en note l’autre analyse possible.
- source_word: בְקָקוּם ... בֹּקְקִים
  choice: des dévastateurs les ont dévastés
  rationale: La répétition française reproduit la construction de même racine en hébreu et son effet d’insistance, malgré sa rudesse volontaire.
- source_word: וּ/זְמֹרֵי/הֶם
  choice: leurs sarments
  rationale: זְמֹרָה désigne des rameaux de vigne; « sarments » conserve précisément l’image viticole.
- source_word: שִׁחֵתוּ
  choice: ont détruit
  rationale: Le piel de שׁחת exprime ici le fait d’endommager gravement ou de détruire; ce choix convient aux sarments pris comme objet.
theological_decisions:
- issue: Valeur de גְּאוֹן appliqué à Jacob et Israël
  choice: la splendeur restaurée par Dieu
  alternative: l’orgueil de Jacob, comme l’orgueil d’Israël
  rationale: Le contexte décrit une action favorable de Yahweh. Le sens positif est donc retenu, sans exclure lexicalement l’autre nuance, indiquée en note.
- issue: Valeur temporelle de שָׁב
  choice: 'présent prophétique : « rétablit »'
  alternative: « a rétabli » ou « rétablira »
  rationale: La forme hébraïque permet de présenter comme accomplie une restauration annoncée avec certitude; la note conserve cette tension temporelle.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La répétition « des dévastateurs les ont dévastés » est conservée pour refléter l’intensification poétique de l’hébreu; « sarments » maintient l’image précise de la vigne.
