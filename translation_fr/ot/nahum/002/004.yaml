source:
  edition: WLC
  text: מָגֵ֨ן גִּבֹּרֵ֜י/הוּ מְאָדָּ֗ם אַנְשֵׁי חַ֨יִל֙ מְתֻלָּעִ֔ים בְּ/אֵשׁ פְּלָד֥וֹת הָ/רֶ֖כֶב בְּ/י֣וֹם הֲכִינ֑/וֹ וְ/הַ/בְּרֹשִׁ֖ים הָרְעָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/004.yaml
  text: The shield of his mighty men is red[a]; the men of valor are clothed in scarlet. The chariots flash with the fire of steel on the day of his preparation[b], and the cypress spears are brandished.
translation:
  language: fr
  text: Le bouclier de ses guerriers est rouge ; ses vaillants combattants sont vêtus d’écarlate. Les chars étincellent d’un feu d’acier[a], au jour de ses préparatifs, et les lances de cyprès sont brandies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens de l’hébreu est incertain : littéralement, « dans/avec un feu d’aciers, les chars ». L’expression peut évoquer l’éclat de garnitures ou d’armes métalliques.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les cyprès sont agités ». Le bois de cyprès désigne probablement ici, par métonymie, des hampes ou des lances.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָגֵן גִּבֹּרֵיהוּ
  choice: Le bouclier de ses guerriers
  rationale: Le singulier hébreu « bouclier » peut avoir une valeur collective, mais le français permet de conserver la forme du texte tout en rendant גִּבּוֹר par le terme martial naturel « guerriers ».
- source_word: מְאָדָּם
  choice: est rouge
  rationale: La forme décrit l’aspect rougi ou rouge du bouclier ; la tournure stative est naturelle en français sans préciser la cause de cette couleur.
- source_word: אַנְשֵׁי חַיִל
  choice: ses vaillants combattants
  rationale: L’expression désigne des hommes capables et valeureux dans un contexte militaire. Cette formulation conserve à la fois la valeur et la fonction guerrière.
- source_word: מְתֻלָּעִים
  choice: sont vêtus d’écarlate
  rationale: Le mot évoque la couleur écarlate ou cramoisie ; appliqué aux combattants, il sous-entend vraisemblablement leurs vêtements.
- source_word: בְּאֵשׁ פְּלָדוֹת הָרֶכֶב
  choice: Les chars étincellent comme un feu d’acier
  rationale: La formulation hébraïque est difficile. Elle semble décrire l’éclat ardent des pièces ou lames métalliques des chars ; « étincellent comme un feu d’acier » préserve l’image sans trop préciser leur équipement.
- source_word: בְּיוֹם הֲכִינוֹ
  choice: au jour où il se prépare
  rationale: Le suffixe masculin singulier demeure sans référent explicitement identifié. La traduction conserve cette ambiguïté ainsi que l’idée de préparation.
- source_word: וְהַבְּרֹשִׁים
  choice: les lances de cyprès
  rationale: Littéralement, le terme désigne des cyprès ou des bois apparentés. Dans cette scène militaire, il s’agit vraisemblablement par métonymie de hampes ou de lances faites de ce bois.
- source_word: הָרְעָלוּ
  choice: sont brandies
  rationale: Le verbe rare semble exprimer une agitation ou un mouvement violent. Avec les armes sous-entendues par « cyprès », « sont brandies » convient naturellement à la scène.
