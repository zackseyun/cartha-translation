id: NAM.2.10
reference: Nahum 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֹּ֥זּוּ כֶ֖סֶף בֹּ֣זּוּ זָהָ֑ב וְ/אֵ֥ין קֵ֨צֶה֙ לַ/תְּכוּנָ֔ה כָּבֹ֕ד מִ/כֹּ֖ל כְּלִ֥י חֶמְדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/010.yaml
  text: Plunder silver! Plunder gold! There is no end to the treasure[b][a], an abundance of every precious thing.
translation:
  language: fr
  text: Pillez l’argent ! Pillez l’or ! Il n’y a pas de fin aux réserves[a], une profusion de toutes sortes d’objets précieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au trésor ». Le nom hébreu est rare et peut désigner les biens accumulés ou les provisions entreposées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de tout objet précieux » ; le terme traduit par « objet » peut aussi désigner un récipient ou un ustensile.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּזּוּ
  choice: Pillez !
  rationale: Impératif pluriel de בזז, qui ordonne avec force de s’emparer des biens à la guerre. La répétition est conservée pour rendre l’urgence et l’intensité poétique.
- source_word: כֶסֶף
  choice: l’argent
  rationale: Le métal précieux convient au parallélisme avec l’or et au contexte du butin.
- source_word: זָהָב
  choice: l’or
  rationale: Traduction directe, en parallèle avec l’argent.
- source_word: וְאֵין קֵצֶה
  choice: Il n’y a pas de fin
  rationale: Formulation française naturelle qui exprime l’absence de limite et l’immensité des richesses accumulées.
- source_word: תְּכוּנָה
  choice: aux réserves
  rationale: Ce nom rare semble désigner ici ce qui a été accumulé ou entreposé. « Réserves » conserve cette nuance concrète sans réduire le sens au seul trésor.
- source_word: כָּבֹד
  choice: une profusion
  rationale: Dans ce contexte matériel, le mot évoque une masse imposante ou une abondance de richesses plutôt que l’honneur au sens abstrait.
- source_word: מִכֹּל כְּלִי חֶמְדָּה
  choice: de toutes sortes d’objets précieux
  rationale: כְּלִי peut désigner largement un objet, un article, un récipient ou un ustensile, et חֶמְדָּה ce qui est désirable ou précieux. Cette formulation rend naturellement la diversité des biens de valeur.
