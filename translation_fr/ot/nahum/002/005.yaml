base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/005.yaml
  text: In the streets the chariots race wildly[a]; they rattle through the squares. Their appearance is like torches[c][b]; like lightning they dart about.
translation:
  language: fr
  text: Dans les rues, les chars se déchaînent[a] ; ils cahotent bruyamment[b] sur les places. Leur apparence est celle de torches ; comme des éclairs, ils filent en tous sens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « foncent comme des fous » ; le verbe hébreu peut évoquer un comportement effréné ou dément.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’agitent avec fracas » ; le verbe hébreu, rare et probablement onomatopéique, souligne le bruit et les secousses du mouvement.
    reason: lexical_alternative
  - marker: c
    text: Ou « filent çà et là » ; l’hébreu souligne un déplacement rapide en tous sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּצוֹת
  choice: dans les rues
  rationale: Dans ce cadre urbain et en parallèle avec les places, חוּצוֹת désigne naturellement les rues.
- source_word: יִתְהוֹלְלוּ
  choice: foncent comme des fous
  rationale: Le verbe évoque ici un mouvement effréné ou dément ; cette tournure française rend à la fois la vitesse et la frénésie.
- source_word: הָרֶכֶב
  choice: les chars
  rationale: Le singulier hébreu a une valeur collective et désigne l’ensemble des chars.
- source_word: יִשְׁתַּקְשְׁקוּן
  choice: ils s’entrechoquent avec fracas
  rationale: Ce verbe rare, probablement expressif ou onomatopéique, suggère le bruit heurté et le mouvement cahotant des chars.
- source_word: בָּרְחֹבוֹת
  choice: sur les places
  rationale: רְחֹבוֹת désigne les larges espaces publics d’une ville ; « places » est naturel en français moderne.
- source_word: מַרְאֵיהֶן
  choice: ils ont l’apparence
  rationale: La formulation rend le sens visuel du nom tout en évitant une construction française pesante.
- source_word: כַּלַּפִּידִם
  choice: de torches
  rationale: לַפִּידִים désigne des torches ou brandons ; « torches » conserve l’image vive sans ajout explicatif.
- source_word: כַּבְּרָקִים
  choice: tels des éclairs
  rationale: Le pluriel hébreu évoque des éclairs ou des fulgurations ; la comparaison est idiomatique et conserve l’image.
- source_word: יְרוֹצֵצוּ
  choice: ils filent en tous sens
  rationale: Le verbe exprime une course rapide, probablement dans plusieurs directions ; cette formulation restitue le mouvement vif et répété.
