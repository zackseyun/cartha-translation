  rationale: La révision conserve les choix lexicaux sûrs du projet, mais rend le verbe final au passé simple afin de marquer la progression portée par le wayyiqtol hébreu. Elle explicite aussi, sans ajout interprétatif, l’objet que le contexte animalier sous-entend après « étranglait ».
