  text: אַרְיֵ֤ה טֹרֵף֙ בְּ/דֵ֣י גֹֽרוֹתָ֔י/ו וּ/מְחַנֵּ֖ק לְ/לִבְאֹתָ֑י/ו וַ/יְמַלֵּא טֶ֣רֶף חֹרָ֔י/ו וּ/מְעֹֽנֹתָ֖י/ו טְרֵפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/013.yaml
  text: The lion tore enough for his cubs and strangled prey for his lionesses[b][a]; he filled his dens with prey and his lairs with torn flesh.
translation:
  language: fr
  text: Le lion déchirait assez de proies pour ses petits et étranglait des proies pour ses lionnes[a] ; il remplit ses tanières de proies et ses repaires de chair déchiquetée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le lion déchire assez de proies pour ses petits et étrangle des proies pour ses lionnes. » Les participes hébreux peuvent aussi se rendre par un présent descriptif.'
    reason: ambiguïté_aspectuelle
  - marker: b
    text: L’expression peut aussi se traduire par « proies » ou « ce qui avait été déchiré ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: אַרְיֵה
  choice: Le lion
  rationale: Le singulier présente de manière emblématique le lion qui représente, dans le contexte, la puissance prédatrice de Ninive, sans expliciter la métaphore dans le corps du texte.
- source_word: טֹרֵף בְּדֵי
  choice: déchirait assez de proies
  rationale: טֹרֵף évoque l’action de mettre en pièces une proie, tandis que בְּדֵי exprime la suffisance. L’imparfait français rend naturellement l’activité habituelle décrite par le participe hébreu.
- source_word: גֹרוֹתָיו
  choice: ses petits
  rationale: Le terme désigne les petits du lion. « Ses petits » est naturel en français moderne et reste clair dans l’image animale.
- source_word: וּמְחַנֵּק
  choice: et en étranglait
  rationale: Le verbe signifie « étrangler » ou « étouffer ». Le pronom « en » reprend les proies, objet implicite en hébreu, sans alourdir la phrase.
- source_word: לְלִבְאֹתָיו
  choice: pour ses lionnes
  rationale: Le pluriel féminin désigne les lionnes; la traduction conserve précisément l’image zoologique.
- source_word: וַיְמַלֵּא
  choice: il remplissait
  rationale: L’imparfait poursuit en français la description habituelle de l’activité prédatrice. Une forme ponctuelle, « il remplit », demeure grammaticalement possible, mais s’intègre moins naturellement à cette scène descriptive.
- source_word: טֶרֶף
  choice: proies
  rationale: Le mot désigne ce qui est capturé ou déchiré. « Proies » maintient l’image du lion tout en laissant percevoir, dans le contexte du livre, l’idée de butin.
- source_word: חֹרָיו
  choice: ses tanières
  rationale: Le mot désigne des trous ou cavités servant d’abris aux animaux. « Tanières » convient à l’image du lion.
- source_word: וּמְעֹנֹתָיו
  choice: ses repaires
  rationale: « Repaires » conserve le parallélisme avec « tanières » tout en respectant la variation lexicale de l’hébreu.
- source_word: טְרֵפָה
  choice: chair déchiquetée
  rationale: Le nom peut désigner une proie ou ce qui a été déchiré. « Chair déchiquetée » rend l’effet concret et violent du terme tout en le distinguant de טֶרֶף.
theological_decisions:
- issue: Image du lion appliquée à l’Assyrie et à Ninive
  choice: Conserver littéralement l’image du lion sans identifier son référent politique dans le texte.
  alternative: Paraphraser en parlant directement du roi d’Assyrie ou de Ninive accumulant du butin.
  rationale: Le verset appartient à une évocation poétique et satirique. Garder la métaphore préserve la force du texte hébreu et évite d’intégrer son interprétation à la traduction.
- issue: Valeur temporelle des participes טֹרֵף et מְחַנֵּק
  choice: 'Employer l’imparfait descriptif : « déchirait… étranglait ».'
  alternative: 'Employer le présent vivant : « déchire… étrangle », ou une forme ponctuelle au passé.'
  rationale: Les participes hébreux décrivent une activité caractéristique ou continue. L’imparfait rend cette nuance dans le contexte français, tout en signalant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le rythme parallèle et le vocabulaire animalier sont conservés. « Chair déchiquetée » maintient la violence de l’image et la variation entre les deux termes hébreux apparentés.
