  text: He summons his nobles; they stumble in their march. They hurry to her wall, and the siege shelter is set up.
translation:
  language: fr
  text: Il se souvient de ses nobles[a] ; ils trébuchent dans leur marche. Ils se hâtent vers sa muraille[b], et le mantelet de siège est mis en place[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe signifie littéralement « se souvenir de » ou « se rappeler ». Dans ce contexte, on peut aussi comprendre qu’il fait appeler ou mobilise ses hommes éminents.
    reason: Conserver le sens lexical principal de יִזְכֹּר tout en signalant l’interprétation militaire contextuelle.
  - marker: b
    text: 'Littéralement : « vers sa muraille ». Le pronom féminin a un référent contextuel qui n’est pas nommé dans ce verset.'
    reason: Préserver l’ambiguïté référentielle du suffixe hébreu.
  - marker: c
    text: 'Ou : « l’abri de siège ». Le mot désigne probablement une protection couverte ou un écran protecteur employé lors d’un siège; sa forme exacte est incertaine.'
    reason: Rendre compte de l’incertitude concernant le dispositif désigné par הַסֹּכֵךְ.
lexical_decisions:
- source_word: יִזְכֹּר
  choice: convoque
  rationale: Le verbe signifie littéralement « se souvenir de » ou « penser à », mais peut ici exprimer le fait de faire appel à ses hommes et de les mobiliser dans l’urgence du combat.
- source_word: אַדִּירָיו
  choice: ses nobles
  rationale: אַדִּיר désigne une personne éminente ou puissante ; dans ce contexte militaire, « nobles » conserve à la fois le rang et l’idée de puissance.
- source_word: בַּהֲלִיכֹתָם
  choice: en chemin
  rationale: L’expression signifie littéralement « dans leur marche / leur déplacement ». « En chemin » rend naturellement l’action sans préciser à tort qu’il s’agit d’une marche ordonnée.
- source_word: הַסֹּכֵךְ
  choice: l’abri de siège
  rationale: Le terme désigne ce qui couvre ou protège. Dans l’assaut d’une muraille, il s’agit vraisemblablement d’un dispositif couvert protégeant les assaillants, sans que sa forme exacte soit certaine.
theological_decisions:
- issue: Identité du sujet masculin et référent du suffixe féminin
  choice: Maintenir « Il » sans identifier explicitement le personnage, et expliciter la muraille comme celle de la ville seulement en français courant
  alternative: Identifier le sujet comme le roi de Ninive ou comme le chef des assaillants, et traduire « sa muraille »
  rationale: Le verset hébreu ne nomme pas directement le sujet. Le contexte permet plusieurs analyses du mouvement militaire ; il ne faut donc pas imposer une identification interprétative. Le suffixe féminin de חוֹמָתָהּ renvoie naturellement à la ville personnifiée.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde le rythme rapide du texte hébreu. « Convoque » exprime la mobilisation sans alourdir la formulation ; les notes conservent les principales incertitudes lexicales et référentielles.
