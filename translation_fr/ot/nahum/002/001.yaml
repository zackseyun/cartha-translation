revisions:
- from: 'Voici, sur les montagnes, les pieds de celui qui apporte une bonne nouvelle[a], qui annonce la paix. Célèbre tes fêtes, Juda, accomplis tes vœux, car l’homme de rien[b] ne passera plus jamais chez toi : il est entièrement retranché.'
  to: 'Voici, sur les montagnes, les pieds de celui qui apporte une bonne nouvelle[a], qui annonce la paix. Célèbre tes fêtes, Juda ; accomplis tes vœux, car l’homme de rien[b] ne passera plus jamais à travers toi : il est entièrement retranché.'
  rationale: La révision corrige l’ancrage de la note b, afin qu’il porte sur בְּלִיַּעַל, et remplace « chez toi » par « à travers toi », plus fidèle au sens territorial de la préposition hébraïque. La note a est reformulée pour correspondre exactement à l’alternative qu’elle présente. Aucun changement doctrinal ni interprétation supplémentaire n’est introduit.
