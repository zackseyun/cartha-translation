source:
  edition: WLC
  text: הִנֵּ֨ה עַל הֶ/הָרִ֜ים רַגְלֵ֤י מְבַשֵּׂר֙ מַשְׁמִ֣יעַ שָׁל֔וֹם חָגִּ֧י יְהוּדָ֛ה חַגַּ֖יִ/ךְ שַׁלְּמִ֣י נְדָרָ֑יִ/ךְ כִּי֩ לֹ֨א יוֹסִ֥יף ע֛וֹד ל/עבור בָּ֥/ךְ בְּלִיַּ֖עַל כֻּלֹּ֥/ה נִכְרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/001.yaml
  text: Look[a], on the mountains are the feet of one who brings good news, who announces peace. Celebrate your festivals, Judah; fulfill your vows[b], for the worthless one will never again pass through you; he is completely cut off.
translation:
  language: fr
  text: 'Voici, sur les montagnes, les pieds de celui qui apporte une bonne nouvelle[a], qui annonce la paix. Célèbre tes fêtes, Juda ; accomplis tes vœux, car l’homme de rien[b] ne passera plus jamais à travers toi : il est entièrement retranché.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les pieds d’un messager qui apporte une bonne nouvelle ».'
    reason: Variante lexicale de formulation pour le participe מְבַשֵּׂר.
  - marker: b
    text: 'Ou : « le méchant » ; traditionnellement : « Bélial ».'
    reason: Le terme בְּלִיַּעַל peut être compris comme une désignation descriptive ou, selon la tradition, comme un nom propre.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » attire vivement l’attention sur la scène tout en gardant un registre actuel et digne.
- source_word: עַל הֶהָרִים
  choice: sur les montagnes
  rationale: Rendu locatif direct qui conserve l’image élevée du messager.
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: les pieds de celui qui apporte une bonne nouvelle
  rationale: Conserve l’image concrète des « pieds » et rend le participe masculin singulier selon son sens verbal, sans réduire la bonne nouvelle à une formule technique.
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: qui annonce la paix
  rationale: Le hiphil de שמע signifie ici « faire entendre », donc « annoncer »; la formulation garde la tonalité de proclamation.
- source_word: חָגִּי יְהוּדָה חַגַּיִךְ
  choice: Célèbre tes fêtes, Juda
  rationale: L’impératif féminin singulier s’adresse à Juda comme collectivité; « célébrer ses fêtes » exprime naturellement l’observance festive et cultuelle.
- source_word: שַׁלְּמִי נְדָרָיִךְ
  choice: accomplis tes vœux
  rationale: Rend l’expression idiomatique qui signifie s’acquitter des engagements pris par des vœux.
- source_word: בְּלִיַּעַל
  choice: l’homme de rien
  rationale: Traite le terme comme une désignation descriptive d’un être vil ou malfaisant, sans lui imposer le statut de nom propre ni une démonologie ultérieure.
- source_word: לֹא יוֹסִיף עוֹד לַעֲבוֹר בָּךְ
  choice: ne passera plus jamais chez toi
  rationale: Exprime naturellement la négation renforcée et conserve l’image du passage hostile sans expliciter davantage par « envahir ».
- source_word: כֻּלֹּה נִכְרָת
  choice: il est entièrement retranché
  rationale: Conserve l’idée d’une élimination totale ainsi que le verbe biblique de retranchement, dans un français compréhensible.
theological_decisions:
- issue: 'Statut de בְּלִיַּעַל : nom propre ou désignation descriptive'
  choice: l’homme de rien
  alternative: le méchant ; Bélial
  rationale: Dans ce contexte prophétique, le mot qualifie vraisemblablement l’ennemi comme un être vil ou malfaisant. Le rendre descriptivement évite d’importer l’identification personnelle et démonologique plus tardive; la note maintient les autres lectures reconnues.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes féminines singulières adressées à Juda comme collectivité. La ponctuation distingue la vision du messager de l’exhortation adressée à Juda.
