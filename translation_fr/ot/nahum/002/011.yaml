  text: בּוּקָ֥ה וּ/מְבוּקָ֖ה וּ/מְבֻלָּקָ֑ה וְ/לֵ֨ב נָמֵ֜ס וּ/פִ֣ק בִּרְכַּ֗יִם וְ/חַלְחָלָה֙ בְּ/כָל מָתְנַ֔יִם וּ/פְנֵ֥י כֻלָּ֖/ם קִבְּצ֥וּ פָארֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/011.yaml
  text: Devastation[a], desolation, and destruction! Hearts melt, knees give way, anguish is in every waist, and all their faces grow pale.
translation:
  language: fr
  text: Dévastation, désolation, destruction ! Le cœur fond, les genoux fléchissent, tous les reins sont saisis de tremblement, et tous les visages deviennent livides[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « tous les visages prennent une teinte sombre ». L’expression hébraïque est difficile et peut décrire un visage assombri ou vidé de ses couleurs sous l’effet de la terreur.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוּקָה וּמְבוּקָה וּמְבֻלָּקָה
  choice: Dévastation, désolation, destruction !
  rationale: Cette succession brève de trois noms proches restitue l’accumulation et la montée rhétorique de l’hébreu. Le jeu sonore original ne peut être entièrement reproduit sans forcer le sens.
- source_word: לֵב נָמֵס
  choice: Le cœur fond
  rationale: Conserve l’image hébraïque vive de la peur qui fait disparaître le courage, ainsi que le singulier collectif du texte source.
- source_word: פִק בִּרְכַּיִם
  choice: les genoux fléchissent
  rationale: Expression française naturelle décrivant la défaillance physique provoquée par la terreur.
- source_word: חַלְחָלָה בְּכָל מָתְנַיִם
  choice: tous les reins sont saisis de tremblement
  rationale: « Reins » garde la localisation corporelle de מָתְנַיִם, tandis que « saisis de tremblement » rend la détresse physique exprimée par חַלְחָלָה.
- source_word: וּפְנֵי כֻלָּם קִבְּצוּ פָארוּר
  choice: tous les visages deviennent livides
  rationale: La tournure hébraïque est obscure et décrit vraisemblablement l’altération du teint sous l’effet de la terreur. « Deviennent livides » exprime naturellement cet effet sans trancher entre pâleur et assombrissement; le rendu plus littéral est signalé en note.
