source:
  edition: WLC
  text: אַיֵּה֙ מְע֣וֹן אֲרָי֔וֹת וּ/מִרְעֶ֥ה ה֖וּא לַ/כְּפִרִ֑ים אֲשֶׁ֣ר הָלַךְ֩ אַרְיֵ֨ה לָבִ֥יא שָׁ֛ם גּ֥וּר אַרְיֵ֖ה וְ/אֵ֥ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/012.yaml
  text: Where is the lions’ den[a], the feeding place of the young lions, where the lion and lioness walked, where the lion’s cub was[b], with none to make them afraid?
translation:
  language: fr
  text: Où est le repaire des lions, le lieu où les jeunes lions se nourrissaient[a], où allaient le lion, la lionne[b] et le lionceau, sans que personne ne les effraie ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pâturage des jeunes lions ». Le mot hébreu peut désigner un pâturage ou un lieu où les animaux trouvent leur nourriture ; il est employé ici dans l’image des lions.
    reason: lexical_alternative
  - marker: b
    text: Ou « le lion puissant ». Le mot hébreu לָבִיא peut avoir plusieurs sens liés au lion ; « lionne » convient bien ici à la suite formée par le lion, la lionne et le lionceau.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Où est
  rationale: L’interrogatif de lieu ouvre une question de défi au sujet de la disparition de Ninive ; le français exige naturellement le verbe « est ».
- source_word: מְעוֹן אֲרָיוֹת
  choice: le repaire des lions
  rationale: מְעוֹן désigne une demeure ou une habitation ; dans cette métaphore animale, « repaire » restitue naturellement l’image sans ajouter l’idée plus étroite d’une caverne.
- source_word: וּמִרְעֶה הוּא לַכְּפִרִים
  choice: le lieu où se nourrissent les jeunes lions
  rationale: מִרְעֶה peut désigner un pâturage ou un lieu où l’on trouve sa nourriture. Cette formulation conserve la fonction du lieu tout en évitant de suggérer que les lions broutent.
- source_word: אֲשֶׁר הָלַךְ
  choice: où vont
  rationale: Le verbe הָלַךְ signifie fondamentalement « aller, marcher ». Le présent de tableau convient à la question rhétorique française et évite l’ajout plus marqué de « rôder ».
- source_word: אַרְיֵה
  choice: le lion
  rationale: Équivalent français courant du nom singulier, ici au sein de l’image d’un groupe de lions.
- source_word: לָבִיא
  choice: la lionne
  rationale: « Lionne » donne une séquence naturelle — lion, lionne et lionceau — mais le terme hébreu peut aussi désigner un lion puissant ; cette ambiguïté est signalée en note.
- source_word: שָׁם
  choice: où
  rationale: L’adverbe locatif est rendu par la construction relative française « où », qui absorbe naturellement le « là » résomptif de l’hébreu.
- source_word: גּוּר אַרְיֵה
  choice: le lionceau
  rationale: La chaîne construite signifie littéralement « petit de lion ». « Lionceau » en donne l’équivalent français direct et naturel.
- source_word: וְאֵין מַחֲרִיד
  choice: sans que personne les effraie
  rationale: Cette tournure exprime idiomatiquement l’absence de quiconque qui fasse trembler ou mette en fuite les lions.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la question rhétorique et la métaphore suivie des lions. « Repaire » est plus naturel que « demeure » dans ce contexte, tandis que « lieu où se nourrissent » évite l’incongruité d’un pâturage littéral pour des lions. Le présent donne à la question la vivacité d’un tableau proverbial ; il ne tranche pas à lui seul la référence temporelle à la chute annoncée de Ninive.
