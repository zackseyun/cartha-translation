  verdict: revise
  source_fidelity: La structure et les images principales sont bien rendues. Toutefois, le yiqtol/prétérit hébreu הָלַךְ dans cette question de dérision décrit plus naturellement l’ancien parcours des lions que le présent français « vont ». L’imparfait restitue ce tableau passé sans surinterpréter l’aspect verbal. La coordination des trois animaux sous un même verbe reflète la liste hébraïque après le verbe singulier collectif.
  naturalness: « Repaire », « jeunes lions », « lionne » et « lionceau » sont naturels en français international moderne. « Où allaient le lion, la lionne et le lionceau » est plus idiomatique et plus cohérent avec le contexte que « où vont ». L’ajout de « ne » dans « sans que personne ne les effraie » relève d’un registre soutenu accessible et clarifie la négation.
  terminology: Les termes animaliers sont appropriés. « Lionne » pour לָבִיא demeure une décision contextuelle légitime, à conserver avec la note qui signale l’autre compréhension lexicale possible. La note a est conservée, car « pâturage » demeure une alternative possible à la formulation fonctionnelle « lieu où les jeunes lions se nourrissaient ».
  issues:
  - severity: medium
    issue: Temps de « vont »
    rationale: Le présent de tableau est possible en français, mais le verbe hébreu à l’accompli, dans la lamentation sarcastique sur la disparition de Ninive, est mieux rendu ici par l’imparfait descriptif. Cette révision évite de présenter la scène comme actuellement en cours.
  - severity: low
    issue: Négation sans « ne »
    rationale: La tournure initiale est courante à l’oral, mais « sans que personne ne les effraie » est plus nette dans le registre soutenu-accessible retenu pour la traduction.
