  naturalness: Le français est globalement sobre et naturel. « C’est arrêté » convient au ton abrupt et conserve l’absence d’un décret explicitement attribué à une autorité. « Ses esclaves la conduisent, gémissant comme des colombes » est idiomatique dans un registre poétique; la note permet de ne pas masquer la difficulté syntaxique.
  terminology: « Mise à nu » restitue l’image d’exposition humiliante, et « emmenée » convient au déplacement subi. « Esclaves » conserve le statut exprimé par אָמָה; le contexte et la source indiquent qu’il s’agit de femmes. « Se frapper la poitrine » rend naturellement le geste de deuil tout en maintenant en note le littéral « sur leur cœur ».
