source:
  edition: WLC
  text: וְ/הֻצַּ֖ב גֻּלְּתָ֣ה הֹֽעֲלָ֑תָה וְ/אַמְהֹתֶ֗י/הָ מְנַֽהֲגוֹת֙ כְּ/ק֣וֹל יוֹנִ֔ים מְתֹפְפֹ֖ת עַל לִבְבֵ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/008.yaml
  text: 'It is fixed: she is stripped bare[a], she is carried away; and her servant girls are led off, moaning like the sound of doves[b], beating on their hearts.'
translation:
  language: fr
  text: 'C’est arrêté : elle est mise à nu[a], elle est emmenée ; ses esclaves la conduisent[b], gémissant comme des colombes et se frappant la poitrine[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle est dévoilée », voire « elle est exilée » ; l’hébreu est difficile et peut associer les images de l’humiliation et de la déportation.
    reason: alternative_reading
  - marker: b
    text: Le participe hébreu est actif, littéralement « conduisant », et son objet n’est pas exprimé ; il est généralement compris comme renvoyant à « elle ». Certaines traductions comprennent plutôt « sont conduites ».
    reason: textual_ambiguity
  - marker: c
    text: Littéralement « sur leur cœur » ; l’expression peut désigner le geste de se frapper la poitrine en signe de deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֻצַּב
  choice: C’est arrêté
  rationale: La forme est difficile. La tournure impersonnelle exprime ici qu’une chose est fixée ou décidée, sans imposer le sens plus précisément juridique de « décrété ».
- source_word: גֻּלְּתָה
  choice: elle est mise à nu
  rationale: Le passif de גלה peut évoquer le dévoilement et l’humiliation. « Mise à nu » conserve cette image sans l’identifier d’emblée à la déportation, déjà exprimée par le verbe suivant.
- source_word: הֹעֲלָתָה
  choice: elle est emmenée
  rationale: Le hophal de עלה indique ici un déplacement subi. « Emmenée » convient à la scène de captivité tout en restant proche du sens verbal.
- source_word: אַמְהֹתֶיהָ
  choice: ses esclaves
  rationale: אָמָה désigne des femmes en condition servile. L’accord féminin de « conduites » rend leur sexe explicite, tandis que « esclaves » préserve leur statut social mieux que le plus doux « servantes ».
- source_word: מְנַהֲגוֹת
  choice: sont conduites au loin
  rationale: La forme décrit vraisemblablement des captives que l’on mène. « Conduites au loin » restitue ce mouvement contraint sans préciser davantage la destination.
- source_word: כְּקוֹל יוֹנִים
  choice: gémissant comme des colombes
  rationale: La comparaison porte littéralement sur le son ou la voix des colombes. En français, « gémissant comme des colombes » rend naturellement l’image sonore de la lamentation dans ce contexte.
- source_word: מְתֹפְפֹת
  choice: se frappant
  rationale: Le participe évoque des coups répétés ou rythmiques, ici dans un geste de deuil.
- source_word: עַל לִבְבֵהֶן
  choice: la poitrine
  rationale: Littéralement « sur leur cœur ». Dans ce geste de lamentation, le français idiomatique désigne la partie du corps frappée comme la poitrine; la note conserve l’image hébraïque.
theological_decisions:
- issue: Sujet féminin non nommé dans ce verset
  choice: Conserver « elle » sans identifier davantage le personnage ou la ville
  alternative: Nommer Ninive, une reine ou une figure personnifiée
  rationale: L’hébreu emploie des formes féminines mais ne donne ici aucun nom explicite. La traduction maintient cette indétermination.
translation_notes:
  register: Français international moderne, sobre et poétique. La ponctuation conserve la progression abrupte du jugement, tandis que le vocabulaire reste accessible. Les ambiguïtés principales du texte hébreu sont maintenues dans le texte ou signalées en note.
