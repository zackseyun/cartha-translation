  text: וְ/נִינְוֵ֥ה כִ/בְרֵֽכַת מַ֖יִם מִ֣/ימֵי הִ֑יא וְ/הֵ֣מָּה נָסִ֔ים עִמְד֥וּ עֲמֹ֖דוּ וְ/אֵ֥ין מַפְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/009.yaml
  text: Nineveh has been like a pool of water from her earliest days[a], yet they are fleeing[b]. “Stop! Stop!”—but no one turns back.
translation:
  language: fr
  text: Ninive était, depuis ses origines, comme un bassin d’eau[a]. Mais les voilà qui s’enfuient ! « Arrêtez-vous ! Arrêtez-vous ! »[b] Mais personne ne se retourne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis les jours où elle était » ; l’expression évoque l’existence ancienne et durable de Ninive.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Tenez bon ! Tenez bon ! » Le verbe hébreu signifie littéralement « se tenir debout » ou « s’arrêter » ; dans cette scène de fuite, il s’agit d’un appel pressant à s’arrêter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִינְוֵה
  choice: Ninive
  rationale: Forme française usuelle du nom propre de la ville.
- source_word: כִבְרֵכַת מַיִם
  choice: comme un bassin rempli d’eau
  rationale: « Bassin » conserve l’image d’une étendue d’eau contenue sans préciser qu’il s’agit d’un réservoir construit ; « rempli » rend naturellement en français la relation entre le bassin et l’eau.
- source_word: מִימֵי הִיא
  choice: depuis qu’elle existe
  rationale: Cette formulation rend de près l’expression elliptique « depuis les jours où elle [est] » et conserve la personnification féminine de la ville, sans imposer l’interprétation plus précise « depuis ses débuts ».
- source_word: וְהֵמָּה נָסִים
  choice: Mais les voilà qui s’enfuient !
  rationale: Le pronom suivi du participe met vivement en scène les habitants ou défenseurs en pleine fuite ; « mais » fait ressortir le contraste avec l’état durable évoqué auparavant.
- source_word: עִמְדוּ עֲמֹדוּ
  choice: Arrêtez-vous ! Arrêtez-vous !
  rationale: La répétition exprime un ordre urgent adressé aux fuyards. Dans cette scène, « arrêtez-vous » communique mieux la valeur contextuelle que le rendu plus littéral « tenez-vous debout ».
- source_word: וְאֵין מַפְנֶה
  choice: Pourtant, personne ne se retourne
  rationale: Le participe de פנה décrit ici le fait de se retourner en réponse à l’appel ; la tournure personnelle est naturelle et maintient la scène de fuite.
