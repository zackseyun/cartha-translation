    issue: Ajout de « rempli » dans l’image du bassin.
    rationale: Le texte hébreu dit littéralement « comme un bassin d’eau »; il ne qualifie pas explicitement le bassin comme « rempli ». L’ajout n’est pas nécessaire en français et réduit légèrement la précision formelle.
  - severity: low
    issue: Formulation temporelle perfectible.
    rationale: « depuis qu’elle existe » est compréhensible, mais « depuis ses origines » rend plus idiomatiquement מִימֵי הִיא (« depuis les jours où elle était »), sans résoudre de façon excessive l’ellipse hébraïque.
