  text: שַׁעֲרֵ֥י הַ/נְּהָר֖וֹת נִפְתָּ֑חוּ וְ/הַֽ/הֵיכָ֖ל נָמֽוֹג׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/007.yaml
  text: The gates of the rivers are opened[b][a], and the palace melts away.
translation:
  language: fr
  text: Les portes des fleuves s’ouvrent[a], et le palais fond[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les portes des canaux s’ouvrent », si le mot désigne ici les voies d’eau aménagées de Ninive plutôt que des fleuves au sens ordinaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple fond » ; le mot hébreu peut désigner un palais ou un temple, mais le contexte favorise ici « palais ». Le verbe peut aussi évoquer le fait de se dissoudre ou de s’effondrer.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעֲרֵי
  choice: les portes de
  rationale: Le pluriel construit de שַׁעַר désigne des portes ou des accès; « les portes des fleuves » conserve l’image concise de l’hébreu.
- source_word: הַנְּהָרוֹת
  choice: des fleuves
  rationale: נָהָר désigne normalement un fleuve ou un cours d’eau important. Le pluriel peut ici évoquer les voies d’eau de Ninive, éventuellement ses canaux, possibilité conservée en note.
- source_word: נִפְתָּחוּ
  choice: s’ouvrent
  rationale: Le niphal accompli exprime l’ouverture des portes. Le présent de narration rend la vivacité prophétique du passage sans préciser indûment l’agent.
- source_word: הַהֵיכָל
  choice: le palais
  rationale: הֵיכָל peut désigner un palais ou un temple. Dans l’oracle dirigé contre Ninive, « palais » convient le mieux au contexte, tout en signalant l’autre sens possible en note.
- source_word: נָמוֹג
  choice: se disloque
  rationale: Le verbe évoque ce qui fond, se défait ou s’effondre. « Se disloque » exprime naturellement en français la désagrégation du palais tout en gardant la force de l’image.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et prophétique. Le présent de narration maintient l’immédiateté de la scène. « Se disloque » évite l’étrangeté possible de « fond » appliqué directement à un bâtiment, sans effacer l’idée de désagrégation portée par l’hébreu.
