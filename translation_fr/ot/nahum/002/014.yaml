  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/הִבְעַרְתִּ֤י בֶֽ/עָשָׁן֙ רִכְבָּ֔/הּ וּ/כְפִירַ֖יִ/ךְ תֹּ֣אכַל חָ֑רֶב וְ/הִכְרַתִּ֤י מֵ/אֶ֨רֶץ֙ טַרְפֵּ֔/ךְ וְ/לֹֽא יִשָּׁמַ֥ע ע֖וֹד ק֥וֹל מַלְאָכֵֽ/כֵה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/014.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will burn your chariots in smoke; the sword will devour your young lions. I will cut off your prey from the earth[c][b], and the voice of your messengers will no longer be heard.
translation:
  language: fr
  text: Me voici contre toi, déclare Yahweh des armées. Je réduirai tes chars en fumée[a], et l’épée dévorera tes jeunes lions[b]. Je ferai disparaître de la terre tes proies, et l’on n’entendra plus la voix de tes messagers[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je brûlerai tes chars dans la fumée ». La tournure hébraïque peut mettre l’accent soit sur le résultat — les réduire en fumée — soit sur les circonstances de leur destruction.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « jeunes lions » prolonge l’image du lion appliquée à Ninive ; elle évoque probablement ses guerriers ou ses dirigeants.
    reason: cultural_note
  - marker: c
    text: 'Ou : « émissaires ». Le mot hébreu peut désigner des représentants envoyés en mission officielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Me voici contre toi
  rationale: Cette formule conserve la solennité de l’annonce prophétique et rend clairement le sens hostile de אֵלַיִךְ, tout en restant naturelle en français.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclare Yahweh des armées
  rationale: « Déclare » rend la formule solennelle נְאֻם. Le nom divin est transcrit « Yahweh », et « des armées » conserve le titre צְבָאוֹת sans en préciser abusivement la nature.
- source_word: וְהִבְעַרְתִּי בֶעָשָׁן רִכְבָּהּ
  choice: Je réduirai tes chars en fumée
  rationale: Le singulier רִכְבָּהּ est compris collectivement comme l’ensemble des chars. « Réduire en fumée » exprime naturellement en français la destruction par le feu, tandis qu’une note signale l’autre nuance possible de la préposition בְּ.
- source_word: וּכְפִירַיִךְ תֹּאכַל חָרֶב
  choice: l’épée dévorera tes jeunes lions
  rationale: La traduction maintient la personnification de l’épée et l’image des jeunes lions, qui prolonge la métaphore léonine appliquée à Ninive.
- source_word: וְהִכְרַתִּי מֵאֶרֶץ טַרְפֵּךְ
  choice: Je ferai disparaître de la terre tes proies
  rationale: « Faire disparaître » rend ici le résultat du hiphil de כרת dans un français courant. Le pluriel français traite טַרְפֵּךְ comme un collectif et préserve l’image de la proie.
- source_word: וְלֹא יִשָּׁמַע עוֹד קוֹל מַלְאָכֵכֵה
  choice: l’on n’entendra plus la voix de tes messagers
  rationale: La tournure impersonnelle rend naturellement le passif hébreu. « Messagers » convient au contexte humain et politique, sans exclure la nuance plus officielle d’« émissaires ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin au lieu de le remplacer par un titre.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: le maître des armées
  rationale: La formulation littérale conserve l’ampleur et l’ambiguïté du titre, sans ajouter explicitement « maître » ni décider s’il s’agit surtout des armées célestes ou terrestres.
- issue: Référent des « jeunes lions »
  choice: conserver l’image
  alternative: tes guerriers
  rationale: Le contexte suggère les guerriers ou les dirigeants assyriens, mais le texte les désigne métaphoriquement comme de jeunes lions. La traduction ne résout pas cette image dans le corps du verset.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. Le rythme prophétique demeure direct et solennel. Les images de l’épée qui dévore, des jeunes lions et des proies sont conservées, tandis que les ambiguïtés lexicales importantes sont signalées en note.
