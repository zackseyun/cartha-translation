source:
  edition: WLC
  text: עָלָ֥ה מֵפִ֛יץ עַל פָּנַ֖יִ/ךְ נָצ֣וֹר מְצֻרָ֑ה צַפֵּה דֶ֨רֶךְ֙ חַזֵּ֣ק מָתְנַ֔יִם אַמֵּ֥ץ כֹּ֖חַ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/002.yaml
  text: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
translation:
  language: fr
  text: Le destructeur[a] monte contre toi[b]. Garde la forteresse[c], surveille la route, affermis tes reins, rassemble toutes tes forces !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui disperse », « celui qui fracasse » ou « celui qui met en pièces » ; le terme hébreu peut évoquer la dispersion ou la destruction par éclatement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « contre ta face », expression qui indique ici une confrontation directe.
    reason: lexical_alternative
  - marker: c
    text: Ou « la place forte » ; le mot hébreu peut aussi désigner plus largement une fortification ou des ouvrages de siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: s’avance
  rationale: Dans ce contexte militaire, le verbe décrit la progression de l’assaillant contre la ville; le présent prophétique rend l’imminence vive et naturelle en français.
- source_word: מֵפִיץ
  choice: celui qui disperse
  rationale: Le participe désigne un agent destructeur qui disperse, avec une possible nuance de fracassement conservée en note.
- source_word: עַל פָּנַיִךְ
  choice: contre toi
  rationale: L’expression signifie littéralement « sur/contre ta face », mais fonctionne ici comme un idiome de confrontation directe.
- source_word: נָצוֹר
  choice: Garde
  rationale: Impératif militaire bref appelant à défendre ou tenir la position.
- source_word: מְצֻרָה
  choice: la forteresse
  rationale: Le nom peut désigner une place fortifiée ou un dispositif lié au siège; « forteresse » convient à la série d’ordres défensifs sans effacer les autres possibilités, signalées en note.
- source_word: צַפֵּה דֶרֶךְ
  choice: surveille la route
  rationale: L’ordre demande d’observer la voie par laquelle l’ennemi approche; cette formulation est concrète et naturelle.
- source_word: חַזֵּק מָתְנַיִם
  choice: affermis tes reins
  rationale: La traduction conserve l’image corporelle hébraïque de la préparation résolue au combat tout en restant intelligible dans un registre biblique digne.
- source_word: אַמֵּץ כֹּחַ מְאֹד
  choice: rassemble toutes tes forces
  rationale: La formulation française exprime l’appel intensif à mobiliser pleinement sa puissance; « toutes » rend naturellement la force adverbiale de מְאֹד.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et solennel. La succession rapide des impératifs maintient l’urgence militaire. L’image des reins est conservée afin de préserver la vigueur concrète de l’hébreu, tandis que les ambiguïtés lexicales principales sont consignées en notes.
