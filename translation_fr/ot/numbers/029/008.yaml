source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: fr
  text: 'Vous présenterez à Yahweh un holocauste, un parfum d’agréable odeur : un taureau, un bélier et sept agneaux mâles d’un an ; ils seront sans défaut pour vous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Vous présenterez
  rationale: Le hifil de קרב, dans un contexte sacrificiel, signifie présenter ou offrir. « Présenterez » conserve l’idée cultuelle sans lourdeur technique.
- source_word: עֹלָה
  choice: un holocauste
  rationale: En français biblique, « holocauste » est le terme établi pour le sacrifice entièrement consumé sur l’autel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique ici le destinataire du sacrifice, et le nom divin יהוה est rendu par « Yahweh ».
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur lui sera agréable
  rationale: Cette expression sacrificielle fixe indique que l’offrande est agréée par Dieu. Cette formulation garde l’image olfactive tout en exprimant naturellement sa portée en français.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: un taureau du gros bétail
  rationale: La formule désigne un bovin mâle appartenant au gros bétail. Cette traduction reste proche de l’hébreu sans reproduire littéralement l’expression idiomatique « fils du gros bétail ».
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: Équivalent français courant du terme sacrificiel אַיִל.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sept agneaux mâles âgés d’un an
  rationale: כְּבָשִׂים désigne ici des agneaux mâles, et בְּנֵי שָׁנָה est l’expression idiomatique pour des animaux âgés d’un an.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Ils seront tous sans défaut
  rationale: Dans le vocabulaire sacrificiel, תְּמִימִם qualifie des animaux exempts de défaut. Le pluriel est naturellement compris comme portant sur l’ensemble des animaux énumérés; le datif לָכֶם est implicite dans l’obligation adressée aux offrants.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le caractère personnel du nom d’alliance sans le remplacer par un titre.
- issue: Portée de l’expression רֵיחַ נִיחֹחַ
  choice: dont l’odeur lui sera agréable
  alternative: comme une odeur apaisante
  rationale: La traduction conserve la métaphore sacrificielle et l’idée d’acceptation divine, sans imposer l’interprétation plus précise d’un apaisement de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la liste sacrificielle de l’hébreu tout en évitant les calques peu naturels. Le point avant la prescription finale clarifie que l’absence de défaut concerne tous les animaux énumérés.
