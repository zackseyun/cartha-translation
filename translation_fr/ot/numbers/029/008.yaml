  rationale: La révision restitue le datif explicite « pour vous », conserve les données animales et numériques du texte hébreu, et emploie pour רֵיחַ נִיחֹחַ une formule française à la fois naturelle et proche de l’image sacrificielle. La note maintient l’alternative « apaisant » sans imposer une lecture théologique particulière.
