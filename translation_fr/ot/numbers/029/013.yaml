  source_fidelity: 'Le projet rend correctement les éléments essentiels du texte hébreu : l’injonction au pluriel, l’holocauste comme offrande consumée par le feu, la formule de l’odeur agréable, le nom Yahweh, les nombres, les catégories d’animaux et l’exigence qu’ils soient sans défaut. La légère révision proposée conserve cette fidélité tout en rendant plus clairement l’enchaînement appositionnel de la formule sacrificielle.'
