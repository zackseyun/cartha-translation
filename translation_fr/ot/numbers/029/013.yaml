  to: 'Vous présenterez un holocauste, un sacrifice consumé par le feu, dont l’odeur est agréable à Yahweh[a] : treize taureaux du gros bétail, deux béliers et quatorze agneaux mâles âgés d’un an ; ils seront sans défaut.'
