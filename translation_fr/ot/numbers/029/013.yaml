  terminology: « Holocauste », « sacrifice consumé par le feu », « béliers » et « sans défaut » sont des équivalents établis et appropriés au registre biblique. « Yahweh » est maintenu conformément à la décision de traduction fournie. L’appel de note est déplacé sur l’expression qu’il documente plutôt que sur le nom divin.
