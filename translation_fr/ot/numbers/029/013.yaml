id: NUM.29.13
reference: Numbers 29:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: fr
  text: 'Vous présenterez un holocauste, un sacrifice consumé par le feu, dont l’odeur est agréable à Yahweh[a] : treize taureaux du gros bétail, deux béliers et quatorze agneaux mâles âgés d’un an ; ils seront sans défaut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une odeur apaisante ». L’expression hébraïque indique que le sacrifice est agréé par Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Vous présenterez
  rationale: Le hiphil de קרב, dans un contexte sacrificiel, signifie présenter ou offrir. « Présenterez » conserve la nuance cultuelle dans un français naturel.
- source_word: עֹלָה
  choice: un holocauste
  rationale: Terme français établi pour le sacrifice entièrement brûlé; il est plus clair ici qu’une traduction étymologique telle que « offrande d’élévation ».
- source_word: אִשֵּׁה
  choice: un sacrifice consumé par le feu
  rationale: Cette formulation exprime naturellement qu’il s’agit d’une offrande faite par le feu, sans réduire le terme à une simple « offrande de nourriture ».
- source_word: רֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  rationale: L’expression idiomatique indique que le sacrifice est agréé par Dieu. Cette traduction conserve l’image olfactive tout en restant naturelle.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: treize taureaux pris dans le gros bétail
  rationale: Cette traduction préserve la classification du bétail sans déduire du syntagme un âge précis comme le ferait « jeunes taureaux ».
- source_word: אֵילִם שְׁנָיִם
  choice: deux béliers
  rationale: Équivalent français direct et usuel du nom hébreu et du cardinal.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: quatorze agneaux mâles âgés d’un an
  rationale: « Agneaux mâles » préserve le genre lexicalement marqué, et « âgés d’un an » rend naturellement l’expression d’âge.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, le mot désigne l’absence de tare physique; « sans défaut » est clair et courant en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre et évite de le remplacer par un titre.
- issue: Portée de רֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  alternative: d’une odeur apaisante
  rationale: La traduction conserve l’image concrète sans trancher entre la nuance d’agrément et celle d’apaisement; la note signale cette amplitude sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la liste sacrificielle de l’hébreu tout en la ponctuant clairement. Le terme traditionnel « holocauste » est conservé dans son sens biblique technique.
