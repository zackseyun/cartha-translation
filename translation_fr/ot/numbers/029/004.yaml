lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: et un dixième
  rationale: Le groupe hébreu désigne une mesure d’un dixième. Comme le texte ne précise pas ici « d’épha », la traduction conserve la formulation concise et place l’explication dans une note.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: pour chaque agneau
  rationale: Littéralement « pour l’agneau, un [seul] » ; dans cette prescription, la tournure a une valeur distributive et indique la quantité requise par agneau.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: pour les sept agneaux
  rationale: La formulation désigne l’ensemble défini des sept agneaux mentionnés dans la prescription.
