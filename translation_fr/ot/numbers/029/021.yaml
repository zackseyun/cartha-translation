  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: fr
  text: ainsi que leur offrande de céréales et leurs libations pour les taureaux, les béliers et les agneaux, selon leur nombre, conformément à la règle établie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: ainsi que leur offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale accompagnant les animaux offerts. « Offrande de céréales » est clair en français moderne. La forme hébraïque est singulière avec suffixe pluriel et peut être comprise collectivement.
- source_word: וְנִסְכֵּיהֶם
  choice: et leurs offrandes de vin
  rationale: נֶסֶךְ désigne une offrande liquide versée. Dans ce cadre rituel, il s’agit de vin ; « offrandes de vin » est plus immédiatement compréhensible que « libations ».
- source_word: לַפָּרִים
  choice: pour les taureaux
  rationale: פָּרִים désigne ici les taureaux sacrificiels ; l’hébreu n’ajoute pas explicitement la précision « jeunes ».
- source_word: לָאֵילִם
  choice: les béliers
  rationale: אַיִל désigne sans ambiguïté le bélier dans les listes sacrificielles.
- source_word: וְלַכְּבָשִׂים
  choice: et les agneaux
  rationale: כֶּבֶשׂ désigne un agneau ; le genre mâle implicite dans l’usage sacrificiel n’a pas besoin d’être explicité ici.
- source_word: בְּמִסְפָּרָם
  choice: selon leur nombre
  rationale: La formule indique que les offrandes d’accompagnement correspondent au nombre prescrit d’animaux de chaque catégorie.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à la règle prescrite
  rationale: מִשְׁפָּט désigne ici la norme rituelle établie. Cette traduction restitue le caractère réglementaire sans employer le terme français plus opaque « ordonnance ».
