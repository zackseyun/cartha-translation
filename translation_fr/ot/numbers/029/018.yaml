  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: fr
  text: ainsi que leurs offrandes de céréales et leurs libations pour les taureaux, les béliers et les agneaux, selon leur nombre, conformément à la règle établie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon la manière prescrite ». L’hébreu כַּמִּשְׁפָּט désigne la règle ou la procédure établie pour ces offrandes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: leurs offrandes de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale qui accompagne les holocaustes. « Offrande de céréales » est précis et compréhensible en français moderne.
- source_word: נִסְכֵּיהֶם
  choice: leurs offrandes de boisson
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Offrande de boisson » reste accessible tout en exprimant sa fonction cultuelle; « libation » serait plus technique.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: pour les taureaux, les béliers et les agneaux
  rationale: Le préfixe ל marque ici la correspondance entre les offrandes d’accompagnement et chaque catégorie d’animaux sacrifiés.
- source_word: בְּמִסְפָּרָם
  choice: selon leur nombre
  rationale: La formule indique que les quantités d’offrandes sont déterminées en fonction du nombre des animaux.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à la règle prescrite
  rationale: מִשְׁפָּט renvoie ici à la norme ou à la procédure cultuelle établie. Cette formulation rend le sens juridique et procédural sans archaïsme.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et clair. La coordination initiale « ainsi que » conserve le lien syntaxique avec le verset précédent. Le pluriel français « offrandes de céréales » explicite naturellement les offrandes correspondant aux différents animaux, malgré le singulier collectif hébreu מִנְחָתָם.
