  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּ/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כְּ/מִשְׁפָּטָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: fr
  text: ainsi que leur offrande de céréales et leurs libations pour les taureaux, les béliers et les agneaux, selon leur nombre et conformément à leur règle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à la règle établie pour eux ».'
    reason: La formule hébraïque signifie littéralement « selon leur règle » et renvoie à la procédure cultuelle applicable aux animaux ou aux offrandes correspondantes.
lexical_decisions:
- source_word: מִנְחָתָם
  choice: leur offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale, généralement composée de farine. Le singulier collectif avec suffixe est conservé.
- source_word: נִסְכֵּיהֶם
  choice: leurs libations
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Libations » est précis, naturel dans un contexte cultuel et rend le pluriel hébreu.
- source_word: לַפָּרִים
  choice: pour les taureaux
  rationale: פָּרִים désigne ici les bovins mâles offerts en sacrifice, sans qu’il soit nécessaire d’ajouter « jeunes ».
- source_word: לָאֵילִם
  choice: les béliers
  rationale: Dans une liste sacrificielle, אַיִל désigne sans ambiguïté le bélier.
- source_word: וְלַכְּבָשִׂים
  choice: et les agneaux
  rationale: כֶּבֶשׂ désigne un agneau; le contexte sacrificiel n’exige pas de préciser son sexe dans le texte français.
- source_word: בְּמִסְפָּרָם
  choice: selon leur nombre
  rationale: La formulation conserve l’idée de correspondance entre les offrandes annexes et le nombre prescrit d’animaux.
- source_word: כְּמִשְׁפָּטָם
  choice: conformément à la règle qui leur est prescrite
  rationale: מִשְׁפָּט exprime ici la norme cultuelle établie. Cette formulation garde le suffixe pluriel tout en produisant un français clair et digne.
