  source_fidelity: La traduction rend correctement la coordination, l’offrande de céréales (מִנְחָתָם), les libations (נִסְכֵּיהֶם), les trois catégories d’animaux et la double précision finale. Toutefois, « la règle qui leur est prescrite » transforme le suffixe de כְּמִשְׁפָּטָם en destinataire de la prescription (« prescrite à eux »), nuance qui n’est pas exprimée ainsi par l’hébreu. « Leur règle » conserve plus directement le suffixe et la formulation cultuelle.
