  rationale: La seule correction nécessaire porte sur la dernière expression. « Conformément à leur règle » reproduit le suffixe pluriel hébreu sans imposer que les animaux ou les offrandes soient les destinataires d’une prescription. La note fournit une explicitation contextuelle possible sans éliminer l’ambiguïté de l’antécédent.
