  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: fr
  text: 'et leur offrande de céréales : de la farine fine mélangée à de l’huile, trois dixièmes[a] pour le taureau, deux dixièmes pour l’unique bélier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « trois dixièmes » et les « deux dixièmes » désignent des mesures traditionnellement comprises comme des dixièmes d’épha.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: et, comme offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale accompagnant les holocaustes. « Offrande de céréales » est clair en français moderne; le possessif hébreu est exprimé naturellement par la construction contextuelle.
- source_word: סֹלֶת
  choice: farine fine
  rationale: סֹלֶת désigne une farine de qualité, finement moulue, destinée notamment aux offrandes.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe passif indique que la farine est mêlée à l’huile. « Pétrie à l’huile » est une formulation sacrificielle naturelle et précise, sans suggérer qu’elle est seulement accompagnée d’huile.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: trois dixièmes
  rationale: עִשָּׂרוֹן est une mesure correspondant à un dixième, traditionnellement comprise comme un dixième d’épha. La formulation concise conserve la manière de compter du texte.
- source_word: לַפָּר
  choice: pour le taureau
  rationale: Le nom singulier défini renvoie directement au taureau mentionné dans la liste sacrificielle.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: deux dixièmes
  rationale: La même unité implicite que dans « trois dixièmes » est conservée sans explicitation dans le corps du texte.
- source_word: לָאַיִל הָאֶחָד
  choice: pour l’unique bélier
  rationale: L’article suivi de אֶחָד souligne qu’il n’y a qu’un bélier dans cette offrande. « L’unique bélier » rend cette précision avec naturel.
