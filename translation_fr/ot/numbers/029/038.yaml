  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: fr
  text: et un bouc offert en sacrifice pour le péché[a], en plus de l’holocauste régulier[b], de son offrande de céréales et de sa libation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un bouc comme sacrifice de purification ».
    reason: חַטָּאת peut être rendu traditionnellement par « sacrifice pour le péché » ou, en insistant sur sa fonction rituelle, par « sacrifice de purification ».
  - marker: b
    text: Ou « l’holocauste perpétuel ».
    reason: הַתָּמִיד peut exprimer ce qui est continuel ou régulièrement offert.
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: et un bouc en sacrifice pour le péché
  rationale: שָׂעִיר désigne ici un bouc dans le contexte sacrificiel; אֶחָד en précise le nombre. חַטָּאת désigne le sacrifice pour le péché plutôt que le péché abstrait.
- source_word: מִ/לְּ/בַד
  choice: en plus de
  rationale: Cette expression indique que le sacrifice mentionné s’ajoute à l’offrande prescrite de manière régulière.
- source_word: עֹלַת הַ/תָּמִיד
  choice: l’holocauste régulier
  rationale: עֹלָה est l’holocauste, sacrifice entièrement brûlé; הַתָּמִיד souligne son caractère établi et récurrent.
- source_word: וּ/מִנְחָתָ/הּ
  choice: avec son offrande de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne l’offrande de céréales accompagnant l’holocauste. Le suffixe féminin renvoie à עֹלָה.
- source_word: וְ/נִסְכָּ/הּ
  choice: et son offrande de vin
  rationale: נֶסֶךְ désigne une libation. « Offrande de vin » est clair et naturel dans ce contexte, tandis que le suffixe féminin renvoie encore à l’holocauste.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Bouc » rend explicitement le mâle impliqué par שָׂעִיר en contexte sacrificiel. « Holocauste » conserve le terme biblique français usuel; « régulier » évite que « perpétuel » soit compris comme ininterrompu. La coordination « avec… et… » indique naturellement que les deux offrandes accompagnent l’holocauste.
