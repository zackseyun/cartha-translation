    issue: Portée syntaxique ambiguë de « avec son offrande de céréales et son offrande de vin »
    rationale: Dans le texte hébreu, les suffixes de וּמִנְחָתָהּ et וְנִסְכָּהּ renvoient à l’holocauste régulier. Après « un bouc », la construction française avec « avec » peut plutôt les faire dépendre du bouc. Une liste introduite par « en plus de » préserve plus nettement la relation source.
  - severity: low
    issue: Formulation « un bouc en sacrifice pour le péché » un peu lourde
    rationale: « Un bouc offert en sacrifice pour le péché » est une formulation française plus fluide sans ajout de sens.
