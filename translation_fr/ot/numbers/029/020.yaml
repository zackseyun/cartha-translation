source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י פָּרִ֥ים עַשְׁתֵּי עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: fr
  text: 'Et le troisième jour : onze taureaux, deux béliers et quatorze agneaux d’un an, sans défaut[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « intacts ». Le terme hébreu désigne ici des animaux destinés au sacrifice qui ne présentent aucun défaut.
    reason: Alternative lexicale précisant le sens sacrificiel de תְּמִימִם.
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: Et le … jour
  rationale: La conjonction et la préposition introduisent la prochaine étape de la série d’offrandes. « Et le … jour » conserve l’enchaînement de l’hébreu tout en restant naturel en français.
- source_word: הַשְּׁלִישִׁי
  choice: troisième
  rationale: Adjectif ordinal qui qualifie « jour ».
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: onze taureaux
  rationale: Dans ce contexte sacrificiel, פָּרִים désigne des bovins mâles. « Taureaux » est précis et naturel, sans ajouter l’idée de jeunesse que le texte n’exprime pas explicitement.
- source_word: אֵילִם שְׁנָיִם
  choice: deux béliers
  rationale: אֵילִם est le terme courant pour des moutons mâles adultes destinés ici au sacrifice.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: quatorze agneaux d’un an
  rationale: L’expression בְּנֵי שָׁנָה, littéralement « fils d’une année », indique des animaux âgés d’un an. « Agneaux d’un an » est la formulation française usuelle et claire.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans la législation sacrificielle, תְּמִימִם qualifie des animaux exempts de défaut physique. « Sans défaut » exprime clairement cette exigence sans suggérer une perfection abstraite.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La structure nominale et énumérative de l’hébreu est conservée, avec deux-points après l’indication du jour. La conjonction « et » maintient le lien avec la série des jours précédents.
