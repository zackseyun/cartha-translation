  source_fidelity: La structure calendaire, l’assemblée sacrée et l’interdiction de travail sont bien rendues. Toutefois, « travail pénible » peut évoquer un travail physiquement ardu, alors que מְלֶאכֶת עֲבֹדָה vise le travail ordinaire/de service. « Jour de sonnerie éclatante » est interprétatif et peu idiomatique; « jour de sonnerie » rend mieux la désignation sonore sans introduire un instrument absent de l’hébreu.
  naturalness: « Le premier jour du septième mois » est plus direct et idiomatique que « Au septième mois, le premier jour du mois ». « Vous aurez une assemblée sainte » suit naturellement le registre législatif et reste proche de l’hébreu. « Jour de sonnerie » est sobre, clair et de registre approprié.
  terminology: « Assemblée sainte » est approprié pour מִקְרָא קֹדֶשׁ. « Travail ordinaire » exprime en français moderne la restriction cultuelle sans la réduire au caractère pénible du labeur. La note conserve avec justesse l’ambiguïté de תְּרוּעָה entre signal sonore, cri et acclamation.
