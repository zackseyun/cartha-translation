  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: fr
  text: Le premier jour du septième mois, vous aurez une assemblée sainte. Vous ne ferez aucun travail ordinaire. Ce sera pour vous un jour de sonnerie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un jour de cris ou d’acclamations ». Le mot hébreu teroua désigne un son puissant; selon le contexte, il peut évoquer une sonnerie, un cri ou une acclamation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּבִיעִי
  choice: Au septième mois
  rationale: Le ב préfixé a ici un sens temporel. Le français naturel n’exige pas de rendre ו par « Et » au début de cette prescription, tout en conservant son enchaînement dans le contexte.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: Expression calendaire hébraïque littéralement proche de « au un du mois », qui désigne sans ambiguïté le premier jour.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une assemblée sainte
  rationale: L’expression désigne une réunion sacrée officiellement convoquée. « Assemblée sainte » est naturel, digne et accessible en français moderne.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail pénible
  rationale: La formule interdit le travail ordinaire lié au labeur, sans nécessairement proscrire toute activité. Cette formulation préserve la nuance mieux que le simple mot « travail ».
- source_word: יוֹם תְּרוּעָה
  choice: un jour de sonnerie éclatante
  rationale: תְּרוּעָה désigne un signal sonore puissant, qui peut être une sonnerie, un cri ou une acclamation. Dans ce contexte cultuel, « sonnerie éclatante » évoque le signal festif sans nommer explicitement un instrument absent du texte hébreu.
- source_word: יִהְיֶה לָכֶם
  choice: Ce sera pour vous
  rationale: Cette tournure rend naturellement la construction hébraïque qui présente le caractère assigné de ce jour pour la communauté.
theological_decisions:
- issue: Désignation de la fête par יוֹם תְּרוּעָה
  choice: un jour de sonnerie éclatante
  alternative: un jour d’acclamation / un jour de sonnerie de trompettes
  rationale: Le texte désigne le jour par le son qui le caractérise et non par un nom traditionnel postérieur. La traduction principale garde cette désignation descriptive, tandis que la note conserve l’étendue sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, de registre digne et législatif, avec une syntaxe claire. Le vocabulaire cultuel reste accessible sans recourir à un titre festif traditionnel absent de l’hébreu.
