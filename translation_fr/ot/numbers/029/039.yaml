  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: fr
  text: Voici ce que vous offrirez à Yahweh lors de vos temps fixés, en plus de vos offrandes votives et de vos offrandes volontaires, qu’il s’agisse de vos holocaustes, de vos offrandes de céréales, de vos libations ou de vos sacrifices de paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion ». Le terme hébreu désigne une catégorie de sacrifices associée à la paix, au bien-être et au partage.
    reason: Alternative lexicale pour שְׁלָמִים, dont le champ sémantique dépasse une seule notion française.
lexical_decisions:
- source_word: אֵלֶּה תַּעֲשׂוּ
  choice: Voilà ce que vous offrirez
  rationale: Le verbe signifie littéralement « faire », mais, dans ce contexte sacrificiel, « offrir » exprime naturellement son sens. La tournure démonstrative renvoie aux prescriptions précédentes.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique le destinataire ou la consécration, et le nom divin est rendu directement par « Yahweh ».
- source_word: בְּמוֹעֲדֵיכֶם
  choice: aux temps fixés pour vous
  rationale: מוֹעֵד peut désigner un temps fixé ou une fête prescrite. Cette formulation conserve cette amplitude sans limiter le terme aux seuls jours de fête.
- source_word: לְבַד מִנִּדְרֵיכֶם וְנִדְבֹתֵיכֶם
  choice: en plus de vos offrandes promises par vœu et de vos offrandes volontaires
  rationale: לְבַד indique ici un ajout aux sacrifices prescrits. Les deux noms désignent respectivement les dons promis par vœu et les dons librement consentis.
- source_word: לְעֹלֹתֵיכֶם
  choice: vos holocaustes
  rationale: « Holocauste » est le terme français usuel pour le sacrifice entièrement consumé.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: vos offrandes de céréales
  rationale: Dans ce contexte sacerdotal, מִנְחָה désigne l’offrande végétale, principalement céréalière.
- source_word: וּלְנִסְכֵּיכֶם
  choice: vos libations
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Libation » est le terme français précis et établi.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: vos sacrifices de paix
  rationale: Cette traduction maintient le lien lexical avec la paix, le bien-être et l’intégrité, tout en conservant une catégorie sacrificielle traditionnelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel d’alliance plutôt que de le remplacer par un titre.
- issue: Traduction de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: « Sacrifices de paix » conserve le rapport du terme hébreu avec la paix, le bien-être et l’intégrité. « Sacrifices de communion » en souligne plutôt la dimension de partage; cette possibilité est signalée en note sans trancher davantage.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure récapitulative du verset tout en employant les termes sacrificiels français établis. Le marqueur de note a été placé après « sacrifices de paix », le terme auquel la note se rapporte.
