  source_fidelity: 'Le projet rend correctement les éléments essentiels : l’offrande à Yahweh, les temps fixés, l’addition des offrandes votives et volontaires, ainsi que les quatre catégories sacrificielles. Toutefois, les deux-points après « offrandes volontaires » font des termes suivants une simple apposition explicative et n’expriment pas assez clairement leur rapport avec les offrandes votives et volontaires, rapport que marque la suite des prépositions לְ dans l’hébreu.'
