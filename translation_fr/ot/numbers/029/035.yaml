  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: fr
  text: Le huitième jour, vous aurez une assemblée solennelle[a] ; vous ne ferez aucun travail ordinaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une assemblée de clôture ». Le mot hébreu peut désigner une assemblée festive qui conclut la fête.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Rend naturellement la proposition temporelle et conserve la valeur définie de l’ordinal.
- source_word: עֲצֶרֶת
  choice: une assemblée solennelle
  rationale: Le nom désigne ici une convocation sacrée liée à la conclusion de la fête. Cette formulation française établie en préserve le caractère cultuel sans préciser excessivement sa fonction.
- source_word: תִּהְיֶה לָכֶם
  choice: vous tiendrez
  rationale: Littéralement « sera pour vous ». Dans ce contexte prescriptif, « vous tiendrez » exprime naturellement en français l’obligation d’avoir ou d’observer cette assemblée.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail pénible
  rationale: La tournure désigne le travail de service ou l’activité laborieuse interdite lors d’un jour sacré, plutôt qu’absolument toute action.
- source_word: לֹא תַעֲשׂוּ
  choice: vous ne ferez
  rationale: Rend la négation accompagnée de l’imparfait hébreu employé comme prescription juridique à la deuxième personne du pluriel.
theological_decisions:
- issue: Sens rituel de עֲצֶרֶת
  choice: assemblée solennelle
  alternative: assemblée de clôture
  rationale: Le contexte du huitième jour suggère une assemblée concluant la fête, mais le nom peut mettre l’accent sur la convocation sacrée elle-même. Le texte principal conserve cette portée cultuelle sans imposer une interprétation plus précise ; la variante est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur injonctif convient au registre législatif. « Assemblée solennelle » maintient la terminologie cultuelle sans archaïsme marqué.
