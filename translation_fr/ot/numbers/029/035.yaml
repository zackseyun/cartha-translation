review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le cadre temporel, l’injonction plurielle et le sens cultuel de עֲצֶרֶת. Toutefois, « travail pénible » peut faire comprendre que seule la pénibilité physique est visée, alors que כָּל־מְלֶאכֶת עֲבֹדָה désigne le travail ordinaire/de service interdit lors de cette célébration. « Vous aurez » reflète aussi plus directement תִּהְיֶה לָכֶם que « vous tiendrez », sans suggérer expressément l’acte de convoquer l’assemblée.
  naturalness: « Le huitième jour » et « assemblée solennelle » sont naturels dans un français moderne de registre scripturaire. « Vous aurez une assemblée solennelle » est idiomatique dans une prescription rituelle. « Aucun travail ordinaire » est clair, international et évite le sens trop étroit de « pénible ».
  terminology: « Assemblée solennelle » préserve de façon appropriée la portée cultuelle de עֲצֶרֶת; la note conserve utilement « assemblée de clôture » comme possibilité contextuelle. « Travail ordinaire » rend fonctionnellement la catégorie de travail de service sans recourir à l’archaïque « travail servile » ni imposer l’idée de labeur physiquement pénible.
  issues:
