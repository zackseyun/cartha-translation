    issue: « travail pénible » restreint indûment la portée de כָּל־מְלֶאכֶת עֲבֹדָה.
    rationale: L’expression hébraïque vise la catégorie du travail habituel ou de service interdit en contexte festif, non seulement les tâches ardues. « Travail ordinaire » exprime mieux cette distinction.
  - severity: low
    issue: « vous tiendrez » est légèrement plus actif que תִּהְיֶה לָכֶם.
    rationale: Le verbe peut suggérer que les destinataires convoquent ou président l’assemblée. « Vous aurez » garde la formulation prescriptive tout en restant plus proche de « sera pour vous ».
  revised_text: Le huitième jour, vous aurez une assemblée solennelle[a] ; vous ne ferez aucun travail ordinaire.
