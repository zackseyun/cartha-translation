source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: fr
  text: 'Vous offrirez un holocauste à l’odeur agréable pour Yahweh : un jeune taureau, un bélier et sept agneaux mâles d’un an, sans défaut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: vous offrirez
  rationale: Avec עֹלָה comme complément, le verbe « faire » a ici le sens sacrificiel idiomatique de présenter ou offrir.
- source_word: עֹלָה
  choice: en holocauste
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée; la tournure « offrir en holocauste » est naturelle dans cette liste sacrificielle.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: comme un parfum agréable
  rationale: Cette formule sacrificielle exprime que l’offrande est agréée; cette traduction conserve l’image olfactive sans l’alourdir.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: un jeune taureau
  rationale: La formule désigne un bovin mâle destiné au sacrifice. « Jeune taureau » rend naturellement l’expression hébraïque sans calque maladroit.
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: אַיִל désigne sans ambiguïté un bélier dans cette liste sacrificielle.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sept agneaux mâles d’un an
  rationale: Le masculin pluriel et le contexte indiquent des agneaux mâles; בְּנֵי שָׁנָה signifie qu’ils sont âgés d’un an.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, le terme indique l’absence de tare physique; « sans défaut » est précis et courant.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre présent dans le texte hébreu est conservé, conformément à la couche anglaise révisée, sans le remplacer par un titre.
- issue: Sens de la formule רֵיחַ נִיחֹחַ
  choice: comme un parfum agréable
  alternative: comme un parfum apaisant
  rationale: La traduction conserve la métaphore sacrificielle et l’idée d’acceptation, sans préciser abusivement que le sacrifice apaise Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la liste sacrificielle de l’hébreu tout en évitant les calques; le nom divin est translittéré « Yahweh ».
