review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement les éléments essentiels : l’holocauste, l’expression sacrificielle de l’odeur agréable, Yahweh, les animaux et leur nombre, l’âge des agneaux et l’exigence d’absence de défaut. « Jeune taureau » est une restitution recevable de פַּר בֶּן־בָּקָר.'
  naturalness: 'La construction « offrir en holocauste, comme un parfum agréable » est maladroite en français moderne : elle fait de l’offrande elle-même un parfum et la virgule dissocie inutilement les compléments. « Offrir un holocauste à l’odeur agréable pour Yahweh » est plus idiomatique tout en conservant l’image du texte.'
  terminology: « Holocauste », « bélier », « agneaux mâles d’un an » et « sans défaut » sont précis dans ce contexte rituel. Le maintien de « Yahweh » suit la décision éditoriale fournie. La note doit employer « odeur » plutôt que « parfum », conformément à la formulation révisée et au sens de רֵיחַ.
  issues:
  - severity: medium
    issue: Syntaxe de la formule sacrificielle
    rationale: « comme un parfum agréable à Yahweh » est une formulation française peu naturelle et structurellement ambiguë. L’hébreu qualifie l’holocauste comme étant destiné à produire une odeur agréable pour Yahweh; « à l’odeur agréable pour Yahweh » l’exprime clairement sans interprétation doctrinale.
  revised_text: 'Vous offrirez un holocauste à l’odeur agréable pour Yahweh : un jeune taureau, un bélier et sept agneaux mâles d’un an, sans défaut.'
  revised_footnotes:
  - marker: a
