  rationale: Révision limitée de la syntaxe française de la formule רֵיחַ נִיחֹחַ afin de rendre explicitement son lien avec l’holocauste et d’éviter l’image ambiguë d’une offrande « comme un parfum ». La note conserve l’alternative lexicale et explique sobrement la valeur formulaique de l’expression.
