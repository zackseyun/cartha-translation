  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: fr
  text: un bouc en sacrifice pour le péché[a], en plus de l’holocauste régulier, de son offrande de céréales et de sa libation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: un bouc
  rationale: Le syntagme désigne un caprin mâle et אֶחָד en précise le nombre. « Un bouc » est naturel et exact en français.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans ce contexte cultuel, le terme désigne un sacrifice et non le péché abstrait. Cette formulation traditionnelle reste claire, tandis que l’alternative fonctionnelle est signalée en note.
- source_word: מִלְּבַד
  choice: en plus de
  rationale: L’expression indique que ce sacrifice s’ajoute à l’offrande prescrite régulièrement.
- source_word: עֹלַת הַתָּמִיד
  choice: l’holocauste régulier
  rationale: « Holocauste » rend l’offrande entièrement brûlée; « régulier » exprime son caractère récurrent et prescrit sans suggérer une combustion ininterrompue.
- source_word: מִנְחָתָהּ
  choice: l’offrande de céréales … qui l’accompagne
  rationale: Dans le contexte sacrificiel, מִנְחָה est l’offrande végétale jointe à l’holocauste. Le suffixe féminin renvoie à עֹלָה; la formulation française explicite naturellement ce rapport.
- source_word: וְנִסְכָּהּ
  choice: l’offrande de vin qui l’accompagne
  rationale: נֶסֶךְ désigne une offrande liquide versée. Ici, selon les prescriptions connexes du passage, il s’agit de vin; « offrande de vin » est plus accessible que « libation ». Le suffixe renvoie également à l’holocauste.
theological_decisions:
- issue: Portée cultuelle de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le premier rendu conserve la terminologie biblique française largement reconnue sans exclure la fonction purificatrice du rite, présentée en note afin de préserver la nuance lexicale.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La coordination finale est reformulée pour rendre sans ambiguïté que les deux offrandes accompagnent l’holocauste régulier.
