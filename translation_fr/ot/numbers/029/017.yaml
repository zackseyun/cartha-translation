base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: fr
  text: 'Le deuxième jour : douze taureaux du troupeau[a], deux béliers et quatorze agneaux d’un an, sans défaut,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « douze taureaux, fils du gros bétail ».'
