lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour
  rationale: Cette formulation française introduit naturellement l’étape suivante de la série. La continuité portée par וּ est suffisamment exprimée par le contexte énumératif, sans qu’un « et » initial soit nécessaire.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: taureaux pris dans le gros bétail
  rationale: פָּרִים désigne ici des taureaux offerts en sacrifice. L’expression idiomatique בְּנֵי בָקָר, littéralement « fils du gros bétail », précise leur catégorie; « pris dans le gros bétail » en conserve la valeur classificatoire en français naturel.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Nombre cardinal se rapportant aux taureaux.
- source_word: אֵילִם שְׁנָיִם
  choice: deux béliers
  rationale: אֵילִם est le terme courant pour des moutons mâles adultes dans les listes sacrificielles.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: quatorze agneaux d’un an
  rationale: כְּבָשִׂים désigne des agneaux, et בְּנֵי שָׁנָה est l’expression usuelle indiquant qu’ils ont un an.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans la législation sacrificielle, le terme qualifie des animaux exempts de tare physique; « sans défaut » est précis, clair et idiomatique.
