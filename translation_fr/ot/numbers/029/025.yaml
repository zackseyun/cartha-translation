  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: fr
  text: et un bouc en sacrifice pour le péché, en plus de l’holocauste régulier[a], de son offrande de céréales et de sa libation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’holocauste perpétuel » ou « l’holocauste continuel ».'
    reason: La valeur de תָּמִיד peut être rendue par « régulier », qui souligne la récurrence prescrite, ou par « perpétuel/continuel », qui suit plus directement l’idée de continuité.
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: et un bouc
  rationale: שְׂעִיר עִזִּים désigne, dans les prescriptions sacrificielles, un bouc. « Un bouc » est naturel en français et exprime déjà le sexe de l’animal.
- source_word: חַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans ce contexte rituel, חַטָּאת désigne l’offrande sacrificielle liée au péché, et non le péché abstrait.
- source_word: מִ/לְּ/בַד
  choice: en plus de
  rationale: L’expression indique que ce sacrifice s’ajoute à l’offrande prescrite de façon régulière.
- source_word: עֹלַת הַ/תָּמִיד
  choice: l’holocauste régulier
  rationale: עֹלָה est rendu par le terme sacrificiel établi « holocauste »; תָּמִיד souligne ici le caractère régulier et récurrent de cette offrande.
- source_word: מִנְחָתָ/הּ
  choice: l’offrande de céréales qui l’accompagne
  rationale: Dans les listes sacerdotales, מִנְחָה désigne normalement l’offrande végétale associée à l’holocauste. La relative explicite naturellement en français le rapport marqué par le suffixe.
- source_word: וְ/נִסְכָּ/הּ
  choice: et de sa libation
  rationale: נֶסֶךְ désigne une offrande liquide versée rituellement. « Libation » est un terme français précis et courant dans le vocabulaire biblique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec conservation des termes sacrificiels usuels. Le marqueur de note est placé après « l’holocauste régulier », l’expression réellement concernée par la variante lexicale.
