id: NUM.29.12
reference: Numbers 29:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: fr
  text: Le quinzième jour du septième mois, vous aurez une assemblée sainte. Vous ne ferez aucun travail ordinaire, et vous célébrerez une fête en l’honneur de Yahweh pendant sept jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Le quinzième jour
  rationale: La construction hébraïque désigne idiomatiquement le quinzième jour. En français, la coordination initiale n’est pas nécessaire hors contexte immédiat, et « jour » doit être exprimé.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: du septième mois
  rationale: Cette formulation restitue directement la relation calendaire indiquée par l’hébreu.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une assemblée sainte
  rationale: L’expression désigne un rassemblement sacré officiellement convoqué. « Assemblée sainte » est naturel, digne et plus immédiatement compréhensible que « sainte convocation ».
- source_word: יִהְיֶה לָכֶם
  choice: vous aurez
  rationale: Littéralement « sera pour vous » ; « vous aurez » rend naturellement la construction possessive en français.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail ordinaire
  rationale: L’expression vise le travail habituel ou professionnel, par contraste avec l’observance sacrée, et non toute forme d’activité sans distinction.
- source_word: וְחַגֹּתֶם חַג
  choice: vous célébrerez une fête
  rationale: La construction avec verbe et nom de même racine souligne l’observance festive. Cette tournure en conserve le sens dans un français actuel.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition marque la fête comme destinée à Yahweh ou célébrée pour lui. « En l’honneur de » explicite naturellement cette orientation en français.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: « Pendant » exprime clairement la durée de la célébration implicite dans la syntaxe hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe juridique et liturgique accessible. Le verset conserve la force prescriptive des futurs français et distingue le travail ordinaire de l’assemblée et de la fête sacrées.
