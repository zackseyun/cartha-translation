base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: fr
  text: Le dixième jour de ce septième mois, vous aurez une assemblée sacrée. Vous vous imposerez des privations[a] et vous ne ferez aucun travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vous vous humilierez» ou «vous vous mortifierez». L’hébreu dit littéralement «vous affligerez vos personnes»; dans ce contexte rituel, l’expression est associée au renoncement à soi, notamment au jeûne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: Le dixième jour de ce septième mois
  rationale: La préposition avec le nombre désigne une date du calendrier; «jour» est explicité naturellement en français. Le démonstratif «ce» rend הַזֶּה.
- source_word: מִקְרָא קֹדֶשׁ יִהְיֶה לָכֶם
  choice: vous aurez une assemblée sainte
  rationale: מִקְרָא קֹדֶשׁ désigne une assemblée sacrée officiellement convoquée. Cette formulation française rend aussi naturellement le datif לָכֶם.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Vous vous imposerez des privations
  rationale: Dans ce contexte rituel, l’expression désigne une mortification ou un renoncement de soi, notamment associé au jeûne. La formulation reste compréhensible sans réduire explicitement le commandement au seul jeûne.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: vous ne ferez aucun travail
  rationale: «Aucun travail» exprime clairement la portée totale de l’interdiction formulée avec כָּל et la négation.
theological_decisions:
- issue: Sens rituel de וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Vous vous imposerez des privations
  alternative: Vous vous humilierez; vous vous mortifierez; vous jeûnerez
  rationale: Le choix conserve l’idée d’un renoncement concret et pénitentiel tout en évitant de limiter l’expression au jeûne seul. Une note signale le sens littéral et les autres rendus possibles.
translation_notes:
  register: Français international moderne, clair et digne. «Assemblée sainte» garde la portée cultuelle de l’expression sans recourir au terme plus rare «convocation». Le futur conserve le ton prescriptif du texte légal.
