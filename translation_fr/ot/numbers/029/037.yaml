  variant: modern international French
source:
  edition: WLC
  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֗ם לַ/פָּ֨ר לָ/אַ֧יִל וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: fr
  text: ainsi que leur offrande de céréales et leurs libations pour le taureau, pour le bélier et pour les agneaux, selon leur nombre et conformément à la règle établie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conformément à la prescription ». Le terme hébreu désigne ici la règle ou prescription établie qui régit ces offrandes.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: leur offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande céréalière qui accompagne les animaux offerts. Le singulier collectif avec suffixe pluriel est conservé.
- source_word: וְנִסְכֵּיהֶם
  choice: et leurs libations
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Libations » est précis, concis et usuel dans un contexte cultuel.
- source_word: לַפָּר
  choice: pour le taureau
  rationale: פַּר désigne ici un taureau destiné au sacrifice ; le texte n’exige pas d’ajouter « jeune ».
- source_word: לָאַיִל
  choice: pour le bélier
  rationale: אַיִל signifie directement « bélier » dans cette liste sacrificielle.
- source_word: וְלַכְּבָשִׂים
  choice: et pour les agneaux
  rationale: כֶּבֶשׂ désigne un agneau, souvent mâle dans les prescriptions sacrificielles ; « agneaux » suffit naturellement ici.
- source_word: בְּמִסְפָּרָם
  choice: selon leur nombre
  rationale: La formule indique que les offrandes d’accompagnement correspondent au nombre prescrit des animaux.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à la règle établie
  rationale: מִשְׁפָּט renvoie ici à la norme cultuelle fixée qui régit ces offrandes. Cette formulation garde la valeur normative tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « pour » clarifie le lien entre les offrandes d’accompagnement et chaque catégorie d’animal ; la coordination initiale maintient le rattachement du verset à la liste précédente.
