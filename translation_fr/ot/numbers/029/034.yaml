source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: fr
  text: et un bouc en sacrifice pour le péché, en plus de l’holocauste régulier[a], avec son offrande de céréales et sa libation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « régulier » désigne une offrande présentée de façon constante et répétée; on peut aussi traduire « perpétuel » ou, dans ce contexte, « quotidien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: et un bouc
  rationale: שָׂעִיר désigne ici un bouc destiné au sacrifice; אֶחָד en précise le nombre, et la conjonction וּ poursuit l’énumération.
- source_word: חַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne le sacrifice offert pour le péché, et non le péché au sens abstrait.
- source_word: מִ/לְּ/בַד
  choice: en plus de
  rationale: Cette locution indique que le sacrifice mentionné s’ajoute à l’holocauste récurrent.
- source_word: עֹלַת הַ/תָּמִיד
  choice: l’holocauste régulier
  rationale: עֹלָה est le terme consacré pour l’holocauste; תָּמִיד souligne ici son caractère constant et récurrent, rendu naturellement par « régulier ».
- source_word: מִנְחָתָ/הּ
  choice: son offrande de céréales
  rationale: Dans les listes sacrificielles, מִנְחָה désigne l’offrande végétale, généralement composée de farine; le possessif renvoie à l’holocauste.
- source_word: וְ/נִסְכָּ/הּ
  choice: et sa libation
  rationale: נֶסֶךְ désigne la libation versée avec le sacrifice. « Libation » est précis, concis et établi en français cultuel.
theological_decisions: []
