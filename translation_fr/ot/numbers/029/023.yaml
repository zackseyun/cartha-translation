  language: fr
  text: 'Le quatrième jour : dix taureaux, deux béliers et quatorze agneaux d’un an, sans défaut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: Le quatrième jour
  rationale: La formule temporelle introduit naturellement l’étape suivante d’une liste rituelle. En français, l’enchaînement est suffisamment marqué par la structure du passage, sans qu’il soit nécessaire de rendre וּ par « et ».
- source_word: פָּרִים עֲשָׂרָה
  choice: dix taureaux
  rationale: Dans ce contexte sacrificiel, פָּרִים désigne des bovins mâles; « taureaux » est direct et courant.
- source_word: אֵילִם שְׁנָיִם
  choice: deux béliers
  rationale: אֵילִם est le terme ordinaire pour les béliers offerts en sacrifice.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: quatorze agneaux
  rationale: כְּבָשִׂים désigne ici des agneaux dans une liste d’animaux sacrificiels.
- source_word: בְּנֵי שָׁנָה
  choice: d’un an
  rationale: Cette expression idiomatique hébraïque indique l’âge des animaux; « d’un an » est naturel et précis en français.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans la législation sacrificielle, le terme indique l’absence de tare physique; « sans défaut » conserve ce sens cultuel en français moderne.
