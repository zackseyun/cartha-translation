  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: fr
  text: ainsi que leur offrande de céréales et leurs libations pour les taureaux, les béliers et les agneaux, selon leur nombre et selon la règle établie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: leur offrande de céréales
  rationale: Dans le contexte sacrificiel, מִנְחָה désigne l’offrande végétale, ici rendue par l’expression française claire « offrande de céréales ». Le singulier collectif de l’hébreu est conservé.
- source_word: נִסְכֵּיהֶם
  choice: leurs offrandes de vin
  rationale: נֶסֶךְ désigne une offrande liquide versée. Dans ce cadre rituel, il s’agit de vin ; « offrandes de vin » est plus immédiatement compréhensible que « libations ».
- source_word: לַפָּרִים
  choice: pour les taureaux
  rationale: פַּר désigne couramment un taureau dans les listes sacrificielles ; le texte ne précise pas explicitement l’âge.
- source_word: לָאֵילִם
  choice: les béliers
  rationale: אַיִל désigne sans ambiguïté le bélier dans ce contexte sacrificiel.
- source_word: וְלַכְּבָשִׂים
  choice: et les agneaux
  rationale: כֶּבֶשׂ désigne un agneau. Le français naturel n’exige pas ici de préciser qu’il est mâle.
- source_word: בְּמִסְפָּרָם
  choice: selon leur nombre
  rationale: L’expression indique que les offrandes d’accompagnement correspondent au nombre prescrit des animaux.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à la règle prescrite
  rationale: מִשְׁפָּט renvoie ici à la norme rituelle établie, c’est-à-dire à la manière réglementaire de présenter ces offrandes.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure un fragment coordonné, comme dans l’hébreu et dans la série liturgique du contexte. « Règle prescrite » exprime la valeur cultuelle et normative de מִשְׁפָּט sans employer le terme plus administratif « ordonnance ».
