lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: un dixième
  rationale: La répétition distributive signifie « un dixième pour chacun ». L’unité n’est pas explicitée dans ce verset; une note précise qu’en contexte sacrificiel il s’agit d’un dixième d’épha.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: pour chaque agneau
  rationale: Littéralement « pour l’agneau, un »; dans cette prescription, la tournure a une valeur distributive que « chaque » exprime naturellement en français.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: pour les sept agneaux
  rationale: Conserve le groupe défini du texte hébreu et rattache la quantité individuelle à l’ensemble des sept agneaux déjà mentionnés.
