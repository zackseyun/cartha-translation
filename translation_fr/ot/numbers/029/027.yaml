  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: fr
  text: avec leur offrande de céréales et leurs libations, pour les taureaux, les béliers et les agneaux, selon leur nombre et conformément à la règle prescrite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: leur offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale qui accompagne les holocaustes. « Offrande de céréales » est précis et compréhensible en français moderne.
- source_word: נִסְכֵּיהֶם
  choice: leurs offrandes de vin
  rationale: נֶסֶךְ désigne une offrande liquide versée. Dans les prescriptions correspondantes de Nombres 28–29, le liquide est du vin ; cette formulation est plus accessible que « libations ».
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: pour les taureaux, les béliers et les agneaux
  rationale: Le préfixe ל indique ici que les offrandes d’accompagnement correspondent à chacune de ces catégories d’animaux.
- source_word: בְּמִסְפָּרָם
  choice: selon leur nombre
  rationale: La quantité des offrandes d’accompagnement est proportionnée au nombre des animaux mentionnés.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à la règle prescrite
  rationale: מִשְׁפָּט renvoie ici à la règle ou procédure cultuelle établie. Cette expression conserve le caractère normatif du terme tout en restant naturelle.
- source_word: וּ
  choice: avec
  rationale: Le verset dépend syntaxiquement de la liste sacrificielle précédente ; « avec » exprime naturellement que ces offrandes accompagnent les animaux déjà mentionnés.
