  text: וּ/בַ/יּ֧וֹם הַ/שִּׁשִּׁ֛י פָּרִ֥ים שְׁמֹנָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: fr
  text: 'Le sixième jour : huit taureaux, deux béliers et quatorze agneaux mâles d’un an, sans défaut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשִּׁשִּׁי
  choice: Le sixième jour
  rationale: Cette formule introduit naturellement en français l’étape suivante de la série des offrandes quotidiennes. La conjonction hébraïque n’a pas besoin d’être rendue explicitement ici.
- source_word: פָּרִים שְׁמֹנָה
  choice: huit taureaux
  rationale: Dans ce contexte sacrificiel, פָּרִים désigne des bovins mâles; le texte ne précise pas leur âge.
- source_word: אֵילִם שְׁנָיִם
  choice: deux béliers
  rationale: אֵילִם est le terme courant pour des moutons mâles adultes destinés au sacrifice.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: quatorze agneaux mâles
  rationale: כְּבָשִׂים désigne ici des agneaux; « mâles » conserve la précision grammaticale et sacrificielle du terme hébreu.
- source_word: בְּנֵי שָׁנָה
  choice: d’un an
  rationale: Expression hébraïque idiomatique indiquant l’âge des animaux, rendue de façon naturelle en français moderne.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans la législation sacrificielle, le terme qualifie des animaux exempts de défaut physique; « sans défaut » est précis et naturel.
