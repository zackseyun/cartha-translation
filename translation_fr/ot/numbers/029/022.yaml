  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: fr
  text: et un bouc en sacrifice pour le péché, en plus de l’holocauste régulier[a], de son offrande de céréales et de sa libation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’holocauste continuel ».
    reason: lexical_alternative
  - marker: b
    text: En hébreu, les possessifs de « son offrande de céréales » et de « sa libation » renvoient à l’holocauste régulier.
    reason: referent_clarification
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: et un bouc en sacrifice pour le péché
  rationale: שָׂעִיר désigne ici un bouc, donc un animal mâle; אֶחָד en précise le nombre, rendu naturellement par « un » en français. Dans ce contexte rituel, חַטָּאת désigne le sacrifice pour le péché.
- source_word: מִ/לְּ/בַד
  choice: en plus de
  rationale: Cette locution indique que le sacrifice mentionné s’ajoute à l’ensemble des offrandes régulières.
- source_word: עֹלַת הַ/תָּמִיד
  choice: l’holocauste régulier
  rationale: עֹלָה est le terme rituel usuel pour l’holocauste. תָּמִיד souligne son caractère récurrent et prescrit; « régulier » est naturel en français moderne, tandis que « perpétuel » ou « continuel » demeure possible.
- source_word: וּ/מִנְחָתָ/הּ
  choice: de son offrande de céréales
  rationale: Dans la législation sacerdotale, מִנְחָה désigne couramment l’offrande de céréales. Le suffixe féminin renvoie à l’holocauste.
- source_word: וְ/נִסְכָּ/הּ
  choice: et de sa libation
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Libation » est précis, courant dans le vocabulaire cultuel français et concis; le suffixe renvoie à l’holocauste.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel traditionnel (« holocauste », « offrande de céréales », « libation ») est conservé parce qu’il reste précis et intelligible. La syntaxe suit étroitement l’hébreu tout en restant naturelle en français.
