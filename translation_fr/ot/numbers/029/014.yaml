  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: fr
  text: 'Leur offrande de céréales consistera en farine fine mélangée à de l’huile : trois dixièmes[a] par taureau, pour les treize taureaux, et deux dixièmes par bélier, pour les deux béliers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les expressions « trois dixièmes » et « deux dixièmes » désignent des dixièmes de mesure, traditionnellement compris comme des dixièmes d’épha.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Leur offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale faite de farine; « offrande de céréales » est clair en français moderne. Le suffixe masculin pluriel est rendu par « leur ».
- source_word: סֹלֶת
  choice: farine fine
  rationale: Terme cultuel courant pour une farine finement moulue et de qualité, destinée aux offrandes.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: pétrie avec de l’huile
  rationale: Le participe passif exprime une farine mélangée à l’huile. « Pétrie avec » est une formulation française naturelle dans les prescriptions sacrificielles.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: trois dixièmes
  rationale: עִשָּׂרוֹן désigne une mesure correspondant à un dixième, traditionnellement comprise comme un dixième d’épha. Le texte hébreu n’explicite pas ici l’épha; cette précision est donc placée en note.
- source_word: לַפָּר הָאֶחָד לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: pour chacun des treize taureaux
  rationale: Littéralement « pour le taureau unique, pour les treize taureaux »; la formulation condensée rend naturellement en français la valeur distributive sans perdre le nombre total.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: deux dixièmes
  rationale: Même mesure cultuelle que précédemment; la traduction parallèle conserve la structure numérique de l’hébreu.
- source_word: לָאַיִל הָאֶחָד לִשְׁנֵי הָאֵילִם
  choice: pour chacun des deux béliers
  rationale: Littéralement « pour le bélier unique, pour les deux béliers »; « chacun des deux » exprime clairement la distribution de la quantité par animal.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe répétitive de l’hébreu est légèrement condensée en « chacun des treize/deux » afin de rendre explicitement sa valeur distributive. Le terme technique de mesure reste dans le texte, avec une explication culturelle en note.
