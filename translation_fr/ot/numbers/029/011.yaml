  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: fr
  text: un bouc en sacrifice pour le péché[a], en plus du sacrifice pour le péché offert pour l’expiation, de l’holocauste régulier[b], de l’offrande de céréales qui l’accompagne et de leurs offrandes de vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification », ici et dans l’autre occurrence de « sacrifice pour le péché ».
    reason: lexical_alternative
  - marker: b
    text: Ou « holocauste continuel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: un bouc
  rationale: Le syntagme désigne un caprin mâle, et le numéral est naturellement rendu par l’article indéfini « un ».
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans cette liste cultuelle, le nom désigne le sacrifice offert en rapport avec le péché plutôt que le péché abstrait. Cette formulation est claire en français moderne; « sacrifice de purification » reste possible.
- source_word: מִלְּבַד
  choice: en plus de
  rationale: La préposition indique que le bouc s’ajoute aux sacrifices déjà prescrits.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: sacrifice pour le péché offert pour l’expiation
  rationale: Cette formulation conserve le lien construit entre le sacrifice et le rite d’expiation sans préciser davantage que l’hébreu.
- source_word: עֹלַת הַתָּמִיד
  choice: holocauste régulier
  rationale: תָּמִיד exprime ici la récurrence constante de l’offrande; « régulier » est naturel et n’impose pas la valeur plus précise de « quotidien ».
- source_word: מִנְחָתָהּ
  choice: l’offrande de céréales qui l’accompagne
  rationale: Dans ce contexte sacrificiel, מִנְחָה est l’offrande végétale associée à l’holocauste; la tournure explicite naturellement la référence du suffixe féminin singulier.
- source_word: נִסְכֵּיהֶם
  choice: leurs offrandes de vin
  rationale: Le pluriel du nom et celui du suffixe sont conservés. Dans ces prescriptions, les libations sont des offrandes de vin; cette expression est plus accessible que « libations ».
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le premier choix maintient la terminologie traditionnelle et le rapport lexical au péché, tandis que la note signale honnêtement la compréhension fonctionnelle possible comme rite de purification.
- issue: Valeur de תָּמִיד
  choice: régulier
  alternative: perpétuel ou continuel
  rationale: « Régulier » exprime l’offrande récurrente prescrite sans suggérer qu’elle brûlait sans interruption.
translation_notes:
  register: Français international moderne, clair et digne. La terminologie cultuelle demeure précise, avec « holocauste » comme terme biblique bien établi. Les répétitions utiles de l’hébreu sont conservées, tandis que les suffixes sont explicités avec naturel.
