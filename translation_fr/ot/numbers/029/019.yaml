  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: fr
  text: et un bouc comme sacrifice pour le péché, en plus de l’holocauste régulier[a], de son offrande de céréales et de leurs libations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’holocauste continuel ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « leurs libations » ; le pluriel renvoie probablement aux libations liées à l’ensemble des sacrifices prescrits.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: ainsi qu’un bouc
  rationale: L’expression désigne un bouc destiné au sacrifice; le singulier français rend naturellement אֶחָד dans cette liste prescrite.
- source_word: חַטָּאת
  choice: offert en sacrifice pour le péché
  rationale: Dans ce contexte cultuel, le terme désigne le sacrifice pour le péché, et non le péché au sens abstrait.
- source_word: מִלְּבַד
  choice: en plus de
  rationale: Cette tournure indique clairement que le bouc s’ajoute à l’ensemble des offrandes régulières.
- source_word: עֹלַת הַתָּמִיד
  choice: l’holocauste régulier
  rationale: תָּמִיד caractérise ici l’offrande prescrite et récurrente; « régulier » est naturel et évite de suggérer un feu offert sans interruption.
- source_word: וּמִנְחָתָהּ
  choice: de l’offrande de céréales qui l’accompagne
  rationale: Dans la législation sacrificielle, מִנְחָה désigne ici l’offrande végétale associée à l’holocauste; la reformulation explicite naturellement le suffixe féminin singulier.
- source_word: וְנִסְכֵּיהֶם
  choice: et de leurs offrandes de vin
  rationale: Le pluriel du nom et du suffixe est conservé. « Offrandes de vin » exprime en français courant les libations prescrites sans perdre leur nature cultuelle.
theological_decisions: []
