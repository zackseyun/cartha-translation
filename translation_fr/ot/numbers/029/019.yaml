  register: Français international moderne, clair et digne. La terminologie cultuelle courante (« holocauste », « sacrifice pour le péché ») est conservée, tandis que « offrandes de vin » est préféré à « libations » pour une compréhension immédiate. Les marqueurs [a] et [b] figurent dans le texte.
