  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וּ/נְסָכֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: fr
  text: ainsi qu’un bouc en sacrifice pour le péché, en plus de l’holocauste régulier[a], avec l’offrande de céréales et les offrandes de vin[b] qui l’accompagnent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’holocauste perpétuel ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les libations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר
  choice: bouc
  rationale: Dans ce contexte sacrificiel, le terme désigne un bouc; ce choix exprime naturellement en français le sexe de l’animal.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans un contexte cultuel, le nom désigne le sacrifice offert à cause du péché plutôt que le péché lui-même.
- source_word: אֶחָד
  choice: un
  rationale: Le cardinal précise qu’un seul bouc doit être offert.
- source_word: מִלְּבַד
  choice: en plus de
  rationale: L’expression indique que ce sacrifice s’ajoute à l’offrande prescrite de manière régulière.
- source_word: עֹלַת הַתָּמִיד
  choice: l’holocauste régulier
  rationale: Le syntagme désigne l’holocauste récurrent prescrit; « régulier » est clair en français actuel sans suggérer une combustion matériellement ininterrompue.
- source_word: מִנְחָתָהּ
  choice: l’offrande de céréales qui l’accompagne
  rationale: Dans les listes sacrificielles, מִנְחָה désigne l’offrande végétale associée; le suffixe féminin renvoie grammaticalement à l’holocauste.
- source_word: וּנְסָכֶיהָ
  choice: et les offrandes de vin qui l’accompagnent
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Offrandes de vin » est accessible et convient au contexte, tandis que le pluriel hébreu est conservé.
