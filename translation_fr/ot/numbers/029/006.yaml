  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: fr
  text: En plus de l’holocauste du mois[a] et de son offrande de céréales, de l’holocauste régulier et de son offrande de céréales, ainsi que de leurs libations, selon leurs prescriptions, comme un parfum agréable, une offrande par le feu[b] pour Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « l’holocauste du mois »; elle désigne vraisemblablement l’offrande de la nouvelle lune.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « offrande alimentaire »; plus traditionnellement : « offrande faite par le feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: en plus de
  rationale: Cette expression indique que les sacrifices mentionnés s’ajoutent à ceux déjà prescrits; « en plus de » est naturel et précis.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: l’holocauste du mois
  rationale: La formulation conserve le sens littéral « du mois » sans expliciter dans le texte qu’il s’agit vraisemblablement du sacrifice de la nouvelle lune.
- source_word: מִנְחָתָהּ
  choice: son offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale accompagnant l’holocauste; le possessif singulier reprend chaque holocauste.
- source_word: עֹלַת הַתָּמִיד
  choice: l’holocauste régulier
  rationale: תָּמִיד exprime ici la continuité réglée du sacrifice, sans qu’il soit nécessaire d’ajouter dans ce verset la précision « quotidien ».
- source_word: וְנִסְכֵּיהֶם
  choice: ainsi que de leurs libations
  rationale: נֶסֶךְ désigne une offrande liquide versée; « libations » est le terme français courant dans le vocabulaire sacrificiel, et le pluriel respecte le suffixe hébreu.
- source_word: כְּמִשְׁפָּטָם
  choice: conformément aux prescriptions qui les concernent
  rationale: מִשְׁפָּט désigne ici la procédure cultuelle fixée; cette formulation rend aussi explicite la portée du suffixe pluriel sans modifier le sens.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: en parfum agréable
  rationale: Cette formule sacrificielle exprime l’agrément de l’offrande devant Dieu tout en conservant l’image olfactive du texte.
- source_word: אִשֶּׁה
  choice: offrande consumée par le feu
  rationale: Le terme technique désigne une offrande présentée au moyen du feu. Cette traduction demeure proche de la forme hébraïque et reste compréhensible en français moderne.
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: La préposition marque ici la destination cultuelle de l’offrande, et le nom divin יהוה est rendu directement par « Yahvé ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; employer le nom propre préserve sa fonction de nom d’alliance plutôt que de le remplacer par un titre.
- issue: Sens du terme sacrificiel אִשֶּׁה
  choice: offrande consumée par le feu
  alternative: offrande alimentaire
  rationale: L’étymologie et l’usage cultuel du terme permettent plusieurs formulations. Le texte retient le lien manifeste avec le feu, tandis que l’autre compréhension lexicale est signalée en note sans imposer une interprétation unique.
- issue: Identification de l’holocauste « du mois »
  choice: maintien de la formulation littérale
  alternative: holocauste de la nouvelle lune
  rationale: Le contexte renvoie vraisemblablement à la nouvelle lune, mais l’hébreu dit littéralement « du mois »; cette tension est conservée dans le texte et expliquée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire cultuel établi (« holocauste », « offrande de céréales », « libations ») est conservé, avec des formulations syntaxiques accessibles. Le verset garde sa forme de complément à l’inventaire sacrificiel précédent.
