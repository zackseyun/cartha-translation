  - severity: low
    issue: « En parfum agréable » est une tournure peu naturelle.
    rationale: La formule לְרֵיחַ נִיחֹחַ peut être rendue plus idiomatiquement par « comme un parfum agréable », sans perdre l’image olfactive ni la fonction cultuelle.
