  language: fr
  text: et un dixième pour chacun des quatorze agneaux[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète « un dixième » (« un dixième, un dixième »), tournure qui indique la quantité attribuée à chaque agneau.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: un dixième
  rationale: Dans ce contexte sacrificiel, עִשָּׂרוֹן désigne une mesure correspondant à un dixième, conventionnellement un dixième d’épha de fleur de farine. La répétition hébraïque a une valeur distributive, rendue naturellement en français par « pour chacun ».
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: pour chacun des … agneaux
  rationale: Littéralement « pour l’agneau, un » ; dans cette prescription, l’expression indique la quantité attribuée individuellement à chaque animal.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: des quatorze agneaux
  rationale: La formulation rattache la mesure individuelle au groupe déterminé des quatorze agneaux déjà mentionné dans la prescription.
