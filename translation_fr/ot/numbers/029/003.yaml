source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: fr
  text: 'Et leur offrande de céréales sera de la farine fine mélangée à l’huile : trois dixièmes[a] pour le taureau, deux dixièmes pour le bélier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « trois dixièmes » et les « deux dixièmes » désignent des dixièmes d’épha, une unité de mesure pour les matières sèches employée dans le système sacrificiel d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Avec, comme offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande de céréales. La tournure avec « Avec » rattache naturellement cette prescription aux sacrifices du verset précédent sans ajouter un verbe absent de l’hébreu.
- source_word: סֹלֶת
  choice: de la farine fine
  rationale: סֹלֶת désigne une farine de qualité, finement moulue, destinée notamment aux offrandes.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe בְּלוּלָה décrit la farine préparée en étant mêlée à de l’huile. « Pétrie à l’huile » est une formulation française naturelle dans les prescriptions cultuelles.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: trois dixièmes
  rationale: עִשָּׂרוֹן est une mesure correspondant au dixième d’un épha. La formulation concise de l’hébreu est conservée, avec une note explicative.
- source_word: לַפָּר
  choice: pour le taureau
  rationale: פַּר désigne ici le taureau offert en sacrifice; le singulier défini renvoie à celui du verset précédent.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: deux dixièmes
  rationale: La quantité est exprimée comme en hébreu; l’unité implicite est explicitée dans la note.
- source_word: לָאָיִל
  choice: pour le bélier
  rationale: אַיִל désigne sans ambiguïté un bélier dans ce contexte sacrificiel.
