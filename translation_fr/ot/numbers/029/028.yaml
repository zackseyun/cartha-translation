  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: fr
  text: et un bouc en sacrifice pour le péché, en plus de l’holocauste régulier, de son offrande de céréales et de sa libation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: et un bouc
  rationale: שָׂעִיר désigne ici un bouc, c’est-à-dire un caprin mâle; le ו préfixé poursuit l’énumération sacrificielle.
- source_word: חַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne le sacrifice offert pour le péché, et non le péché abstrait.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral précise explicitement qu’un seul bouc doit être offert.
- source_word: מִ/לְּ/בַד
  choice: en plus de
  rationale: L’expression indique que ce sacrifice s’ajoute à l’ensemble sacrificiel régulier.
- source_word: עֹלַת הַ/תָּמִיד
  choice: l’holocauste régulier
  rationale: עֹלָה est le terme cultuel usuel pour l’holocauste; תָּמִיד en souligne le caractère constant et prescrit, rendu naturellement par « régulier ».
- source_word: וּ/מִנְחָתָ/הּ
  choice: de son offrande de céréales
  rationale: Dans les listes sacerdotales, מִנְחָה désigne l’offrande céréalière qui accompagne l’holocauste; le suffixe féminin renvoie à עֹלָה.
- source_word: וְ/נִסְכָּ/הּ
  choice: et de sa libation
  rationale: נֶסֶךְ désigne une offrande liquide versée; « libation » est précis, concis et courant dans le vocabulaire sacrificiel français. Le suffixe renvoie à l’holocauste.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la structure d’un inventaire cultuel tout en évitant une lourde répétition de « en plus de » devant chaque offrande associée.
