base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: fr
  text: 'Le cinquième jour[a] : neuf taureaux, deux béliers et quatorze agneaux mâles âgés d’un an, sans défaut,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Et le cinquième jour ». L’hébreu commence le verset par une conjonction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/חֲמִישִׁי
  choice: Le cinquième jour
  rationale: Cette formulation rend naturellement la valeur temporelle de l’expression hébraïque dans une liste de prescriptions. La conjonction initiale est laissée implicite dans le texte, mais signalée en note.
- source_word: פָּרִים תִּשְׁעָה
  choice: neuf taureaux
  rationale: פָּר désigne couramment un taureau dans les contextes sacrificiels; le texte ne requiert pas ici l’ajout de « jeunes ».
- source_word: אֵילִם שְׁנָיִם
  choice: deux béliers
  rationale: « Béliers » est l’équivalent français usuel de אַיִל dans les listes sacrificielles.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: quatorze agneaux mâles
  rationale: כֶּבֶשׂ désigne ici des agneaux destinés au sacrifice et comporte une spécification masculine que « agneaux mâles » rend explicitement.
- source_word: בְּנֵי שָׁנָה
  choice: âgés d’un an
  rationale: Cette expression française naturelle rend l’idiome hébreu indiquant l’âge des animaux.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans le contexte sacrificiel, תמים qualifie des animaux exempts de tare physique; « sans défaut » est clair et idiomatique.
