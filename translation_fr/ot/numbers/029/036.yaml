id: NUM.29.36
reference: Numbers 29:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: fr
  text: 'Vous présenterez un holocauste, un sacrifice consumé par le feu, d’une agréable odeur[a] pour Yahweh : un taureau, un bélier et sept agneaux d’un an, sans défaut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une odeur apaisante ». L’expression hébraïque est une formule sacrificielle consacrée qui désigne une offrande agréée par Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Vous présenterez
  rationale: Le hifil de קרב, dans un contexte sacrificiel, signifie présenter ou offrir. « Présenterez » conserve la nuance rituelle et causative dans un français naturel.
- source_word: עֹלָה
  choice: un holocauste
  rationale: Terme sacrificiel français établi pour l’offrande entièrement brûlée, correspondant à ce qui monte en fumée.
- source_word: אִשֵּׁה
  choice: un sacrifice consumé par le feu
  rationale: Cette formulation exprime clairement le mode d’offrande sans imposer l’interprétation plus spécifique d’une « offrande alimentaire ».
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable
  rationale: Rend naturellement l’expression sacrificielle figée qui indique que l’offrande est agréée par Dieu, tout en conservant l’image olfactive.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu explicitement par « Yahweh », et la préposition ל désigne le destinataire du sacrifice.
- source_word: פַּר אֶחָד
  choice: un taureau
  rationale: פַּר désigne ici un bovin mâle destiné au sacrifice ; le texte n’exige pas d’ajouter « jeune ».
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: Équivalent français direct et précis du terme sacrificiel אַיִל.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sept agneaux d’un an
  rationale: La formule signifie littéralement des agneaux « fils d’une année ». « D’un an » exprime clairement l’âge requis sans ajouter un sexe que la forme hébraïque n’impose pas explicitement ici.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, le mot qualifie des animaux exempts de tare ; « sans défaut » est clair et précis en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère personnel du nom d’alliance sans le remplacer par un titre.
- issue: Portée de רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable à Yahweh
  alternative: d’une odeur apaisante pour Yahweh
  rationale: L’expression cultuelle affirme l’acceptabilité du sacrifice. Le texte conserve cependant une image olfactive ; la traduction la maintient sans expliquer le mécanisme théologique de cette acceptation.
translation_notes:
  register: Français international moderne, digne et accessible. La terminologie cultuelle traditionnelle « holocauste » est maintenue, tandis que la syntaxe et les autres termes restent transparents pour un lectorat contemporain. Le marqueur [a] est placé après « Yahweh », à l’endroit où se termine l’expression qu’il explique.
