  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: fr
  text: et un bouc en sacrifice pour le péché, afin de faire l’expiation pour vous—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: et un bouc
  rationale: Le syntagme désigne un mâle de la chèvre, et אֶחָד en précise le nombre. « Un bouc » exprime naturellement en français à la fois l’espèce, le sexe et la quantité.
- source_word: חַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans ce contexte rituel, le terme désigne l’offrande sacrificielle liée au péché plutôt que le péché abstrait. Cette formulation est claire et actuelle.
- source_word: לְ/כַפֵּר
  choice: afin de faire l’expiation
  rationale: Dans le contexte sacerdotal, כפר exprime l’acte rituel qui traite le péché et rétablit la relation. « Faire l’expiation » conserve cette portée sans préciser un mécanisme doctrinal ultérieur.
- source_word: עֲלֵי/כֶם
  choice: pour vous
  rationale: Avec כפר, la préposition indique les personnes en faveur desquelles l’expiation est accomplie. « Pour vous » est direct et naturel.
theological_decisions:
- issue: Rendu du vocabulaire sacrificiel כפר
  choice: afin de faire l’expiation pour vous
  alternative: afin de faire le rite d’expiation pour vous / afin d’accomplir la réconciliation pour vous
  rationale: « Expiation » garde la force cultuelle du texte hébreu sans réduire le terme à une théorie particulière. « Réconciliation » mettrait davantage l’accent sur le résultat relationnel, tandis que l’hébreu désigne ici l’acte sacerdotal.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe fragmentaire de la liste sacrificielle est conservée, ainsi que le tiret final signalant la continuation de la phrase.
