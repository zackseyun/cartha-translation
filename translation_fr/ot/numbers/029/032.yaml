  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: fr
  text: 'Le septième jour : sept taureaux, deux béliers et quatorze agneaux d’un an, sans défaut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: Le septième jour
  rationale: La formule introduit l’étape suivante de la série. En français, l’absence de « et » est naturelle après une succession de prescriptions numérotées par jour, tout en conservant clairement la continuité.
- source_word: פָּרִים
  choice: taureaux
  rationale: Dans les listes sacrificielles, פַּר désigne couramment un taureau; le verset ne précise pas explicitement son âge.
- source_word: אֵילִם
  choice: béliers
  rationale: Équivalent français usuel de אַיִל dans un contexte sacrificiel.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: agneaux d’un an
  rationale: L’expression idiomatique « fils d’une année » indique des agneaux âgés d’un an; « agneaux d’un an » est concise et naturelle.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, תמים décrit des animaux entiers et exempts de tare; « sans défaut » exprime clairement cette exigence rituelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure nominale concise reproduit la forme de liste du texte hébreu. Aucune note n’est nécessaire, car « sans défaut » rend directement le sens sacrificiel de תְּמִימִם; la note anglaise semble en outre rattachée à tort à « bulls » plutôt qu’à cette expression finale.
