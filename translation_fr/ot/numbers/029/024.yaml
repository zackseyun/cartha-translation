  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: fr
  text: ainsi que leur offrande de céréales et leurs libations pour les taureaux, les béliers et les agneaux, en fonction de leur nombre, conformément à la règle établie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « selon la prescription » : le terme hébreu désigne ici la procédure établie pour ces offrandes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: leurs offrandes de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne les offrandes végétales qui accompagnent les sacrifices d’animaux. Le pluriel français rend naturellement les offrandes correspondant aux différents animaux.
- source_word: וְנִסְכֵּיהֶם
  choice: et leurs libations
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Libations » est le terme français précis et usuel dans un contexte cultuel.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: pour les taureaux, les béliers et les agneaux
  rationale: La préposition ל exprime ici le rapport entre les offrandes d’accompagnement et chaque catégorie d’animaux sacrifiés.
- source_word: בְּמִסְפָּרָם
  choice: en fonction de leur nombre
  rationale: La quantité des offrandes d’accompagnement correspond au nombre des animaux; cette formulation est naturelle et conserve le sens distributif.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à la règle établie
  rationale: Dans la législation sacrificielle, מִשְׁפָּט désigne la norme ou la procédure prescrite, plutôt qu’une simple coutume.
theological_decisions: []
