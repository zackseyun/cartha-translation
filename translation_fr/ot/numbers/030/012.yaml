revisions:
- from: Et si son mari l’entend et garde le silence envers elle, sans annuler son engagement[a], tous ses vœux resteront en vigueur, et toute obligation dont elle s’est chargée restera en vigueur.
  to: Et si son mari en entend parler, ne lui dit rien et ne s’y oppose pas[a], tous ses vœux resteront en vigueur, et toute obligation qu’elle s’est imposée restera en vigueur.
  rationale: La révision conserve la condition juridique, le silence du mari et la répétition du maintien en vigueur. Elle évite de réduire le pronom hébreu à un seul « engagement », rend plus naturellement l’absence d’opposition du mari et précise la note sans imposer une portée plus étroite que celle du contexte.
