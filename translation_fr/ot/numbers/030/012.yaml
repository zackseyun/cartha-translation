    issue: « sans annuler son engagement » singularise et restreint l’objet de l’opposition du mari.
    rationale: Le texte hébreu dit littéralement qu’il ne la contrecarre/ne s’oppose pas à elle; le contexte étend l’effet aux vœux et aux obligations. La version française ne devrait pas limiter cela à un unique engagement.
  - severity: low
    issue: La note dit « sans l’empêcher », alors que le texte traduit « sans annuler son engagement ».
    rationale: La note ne clarifie pas directement le choix de traduction et le terme « engagement » n’y est pas justifié. Une note sur la construction hébraïque et sa portée juridique est plus exacte.
  - severity: low
    issue: « dont elle s’est chargée » atténue l’idée d’une obligation qu’elle a imposée à elle-même.
    rationale: « Qu’elle s’est imposée » restitue plus précisément la construction « lier sur soi-même » tout en restant naturel.
  revised_text: Et si son mari en entend parler, ne lui dit rien et ne s’y oppose pas[a], tous ses vœux resteront en vigueur, et toute obligation qu’elle s’est imposée restera en vigueur.
