    reason: lexical_alternative
  revision_rationale: La révision conserve la condition juridique, le silence du mari et la répétition du maintien en vigueur. Elle évite de réduire le pronom hébreu à un seul « engagement », rend plus naturellement l’absence d’opposition du mari et précise la note sans imposer une portée plus étroite que celle du contexte.
