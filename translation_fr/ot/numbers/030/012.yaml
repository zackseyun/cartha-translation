  text: וְ/שָׁמַ֤ע אִישָׁ/הּ֙ וְ/הֶחֱרִ֣שׁ לָ֔/הּ לֹ֥א הֵנִ֖יא אֹתָ֑/הּ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: fr
  text: Et si son mari en entend parler, ne lui dit rien et ne s’y oppose pas[a], tous ses vœux resteront en vigueur, et toute obligation qu’elle s’est imposée restera en vigueur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement qu’il « ne l’empêche pas » ou ne la contrecarre pas. Dans ce contexte juridique, cela signifie qu’il ne s’oppose pas à ses vœux ou aux obligations qu’elle s’est imposées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Et si … l’entend
  rationale: Dans cette formulation juridique casuistique, le parfait précédé de waw poursuit la condition du contexte. Le français exprime naturellement cette valeur par « si » et le présent.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte de législation matrimoniale, אִישׁ avec le suffixe féminin désigne le mari.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: garde le silence envers elle
  rationale: L’expression indique qu’il ne réagit pas verbalement. Cette formulation reste proche de l’hébreu tout en étant claire en français.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: sans annuler son engagement
  rationale: Le verbe hiphil désigne ici l’annulation ou l’invalidation de ce qui lie la femme. Le français explicite l’objet implicite plutôt que de donner l’impression que le mari « annule » la personne elle-même.
- source_word: וְקָמוּ
  choice: resteront en vigueur
  rationale: Dans un contexte juridique, קום exprime le maintien de la validité. « Rester en vigueur » est plus immédiatement intelligible que le calque « subsisteront ».
- source_word: כָּל נְדָרֶיהָ
  choice: tous ses vœux
  rationale: « Vœu » est le terme français usuel pour נדר dans la législation biblique.
- source_word: וְכָל אִסָּר
  choice: et toute obligation
  rationale: אִסָּר désigne ici une obligation ou restriction volontairement contraignante. « Obligation » restitue clairement sa portée juridique.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: dont elle s’est chargée
  rationale: Cette expression française naturelle rend l’idée d’une obligation que la femme a fait peser sur elle-même, sans conserver artificiellement la métaphore hébraïque de lier sur sa personne.
- source_word: יָקוּם
  choice: restera en vigueur
  rationale: Le singulier s’accorde en français avec « toute obligation » et reprend le langage de validité juridique de la première proposition.
