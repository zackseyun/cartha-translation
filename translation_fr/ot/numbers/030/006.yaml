  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: fr
  text: Mais si son père s’y oppose le jour où il en est informé, aucun de ses vœux ni aucun des engagements contraignants[a] par lesquels elle s’est liée ne restera en vigueur[b]. Le SEIGNEUR lui pardonnera, puisque son père s’y est opposé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un terme apparenté au verbe « lier » et désignant des obligations que l’on s’impose à soi-même.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne subsistera pas » ou « ne tiendra pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition en contraste avec le cas précédent; « Mais si » rend naturellement cette articulation.
- source_word: הֵנִיא אָבִיהָ אֹתָהּ
  choice: son père s’y oppose
  rationale: Dans ce contexte juridique, le verbe exprime l’opposition du père qui empêche l’engagement de prendre effet. Cette formulation française est naturelle et évite de présenter le père comme interdisant simplement sa fille sans préciser l’enjeu.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: le jour où il l’apprend
  rationale: Conserve la précision temporelle du texte hébreu, déterminante pour la validité juridique de l’opposition du père.
- source_word: כָּל נְדָרֶיהָ וֶאֱסָרֶיהָ
  choice: aucun de ses vœux ni aucun de ses engagements contraignants
  rationale: La négation qui suit porte sur l’ensemble des deux catégories. « Engagements contraignants » exprime le caractère de liens volontairement assumés.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: par lesquels elle s’est liée
  rationale: Reproduit clairement l’idée réflexive d’une obligation que la femme s’est imposée à elle-même.
- source_word: לֹא יָקוּם
  choice: ne restera en vigueur
  rationale: Rend le sens juridique de « ne pas subsister/ne pas tenir » sans perdre l’idée qu’un engagement n’acquiert ou ne conserve aucune force obligatoire.
- source_word: וַיהוָה
  choice: Le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme YHWH dans une traduction biblique destinée à un large lectorat.
- source_word: יִסְלַח לָהּ
  choice: lui pardonnera
  rationale: Équivalent direct et naturel du verbe סלח avec un complément personnel.
- source_word: כִּי
  choice: puisque
  rationale: Introduit explicitement la raison donnée dans le verset, dans un français fluide.
theological_decisions:
- issue: Portée du pardon divin après l’opposition du père
  choice: Conserver l’affirmation que le SEIGNEUR lui pardonnera sans préciser davantage la nature de la faute ou de la responsabilité.
  alternative: Expliquer qu’elle est pardonnée du péché qu’aurait constitué l’inaccomplissement de son vœu.
  rationale: Le contexte immédiat traite de la force obligatoire des vœux, mais le verset ne définit pas précisément la faute pardonnée. La traduction préserve donc cette tension sans ajouter une conclusion doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère juridique du passage sans lourdeur technique; « s’y oppose » traduit l’effet contextuel du verbe tout en évitant de surinterpréter le mécanisme exact.
