id: NUM.30.2
reference: Numbers 30:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: fr
  text: 'Moïse parla alors aux chefs des tribus des fils d’Israël[a] en ces termes : « Voici ce que Yahweh a ordonné[b] : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « des Israélites ». L’hébreu dit littéralement « des fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Voici la parole que Yahweh a ordonnée », ou « Voici la chose que Yahweh a commandée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla alors
  rationale: Le waw consécutif fait progresser le récit ; « alors » en rend naturellement la valeur séquentielle en français.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: les chefs des tribus
  rationale: רָאשֵׁי désigne les chefs ou responsables, et מַטּוֹת renvoie ici aux divisions tribales d’Israël. Cette formulation est précise et naturelle.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: La formulation familiale de l’hébreu est conservée, tandis qu’une variante plus idiomatique est signalée en note.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette tournure française introduit naturellement le discours direct tout en représentant l’infinitif hébreu « disant ».
- source_word: זֶה הַדָּבָר
  choice: Voici ce que
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire. Dans cette formule d’introduction à un commandement, « Voici ce que » est naturel en français sans déterminer excessivement le sens ; la forme plus littérale est donnée en note.
- source_word: צִוָּה
  choice: a ordonné
  rationale: Le parfait présente le commandement divin comme déjà donné et maintenant transmis. Le passé composé convient au français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël ; « Yahweh » le représente sans lui substituer un titre.
- issue: Expression collective בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte hébreu emploie une expression familiale au masculin. Le texte principal la conserve, et la note fournit l’équivalent collectif courant sans effacer la forme source.
- issue: Portée de דָּבָר dans la formule divine
  choice: ce que
  alternative: la parole que
  rationale: דָּבָר garde une amplitude entre « parole », « chose » et « affaire ». La formulation choisie évite un français raide et ne tranche pas indûment, tandis que la note préserve la forme littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la structure hébraïque, mais « en ces termes » et « Voici ce que » évitent des calques peu naturels. Les marqueurs de notes [a] et [b] figurent dans le texte principal.
