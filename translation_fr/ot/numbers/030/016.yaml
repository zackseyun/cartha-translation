source:
  edition: WLC
  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: fr
  text: Mais s’il les annule bel et bien après en avoir pris connaissance[a], il portera la faute de cette femme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici une construction intensive; on pourrait aussi traduire: «les annule effectivement» ou «les révoque complètement».'
    reason: lexical_alternative
  - marker: b
    text: «Portera la faute de cette femme» peut aussi signifier qu’il en assumera la responsabilité ou qu’il subira le châtiment lié à sa faute.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: Introduit une condition en contraste avec le cas énoncé au verset précédent.
- source_word: הָפֵר יָפֵר
  choice: annule bel et bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action; cette tournure française rend l’insistance tout en convenant au contexte juridique des vœux.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom masculin pluriel renvoie aux vœux ou engagements contraignants mentionnés dans le contexte immédiat.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: après en avoir pris connaissance
  rationale: Rend l’antériorité de l’audition ou de la connaissance des engagements sans suggérer nécessairement qu’ils ont été entendus lors de leur formulation.
- source_word: וְנָשָׂא
  choice: il portera
  rationale: Conserve l’image et la valeur juridico-morale de l’expression hébraïque נשׂא עון.
- source_word: עֲוֺנָהּ
  choice: la faute de cette femme
  rationale: Le suffixe féminin singulier est explicité naturellement en français; «faute» préserve l’ambivalence entre culpabilité, responsabilité et conséquences pénales.
theological_decisions:
- issue: Sens de «porter la faute» dans ce contexte juridique
  choice: Le texte affirme que l’homme portera la faute de la femme, sans préciser davantage la nature exacte de cette charge.
  alternative: Il assumera soit la responsabilité de sa faute, soit le châtiment qui en découle.
  rationale: L’expression נשׂא עון peut viser la culpabilité, la responsabilité ou les conséquences de la faute. La traduction conserve cette tension au lieu de trancher entre ces nuances.
translation_notes:
  register: Français international moderne, clair et digne. «Annuler» maintient la précision juridique du passage; «bel et bien» exprime naturellement l’insistance hébraïque. Les deux appels de note figurent dans le texte dans l’ordre alphabétique.
