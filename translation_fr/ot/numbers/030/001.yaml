  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: fr
  text: Moïse parla aux fils d’Israël[a], conformément à tout ce que Yahweh avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux enfants d’Israël » ou « aux Israélites ». L’hébreu emploie littéralement l’expression « fils d’Israël », une désignation traditionnelle et collective du peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: parla
  rationale: Le verbe signifie formellement « dit », mais, en l’absence de citation directe et devant un résumé du contenu transmis, « parla » est plus naturel en français tout en conservant l’acte de parole.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette traduction conserve l’expression hébraïque masculine plurielle, qui sert ici de désignation traditionnelle et collective du peuple d’Israël.
- source_word: כְּכֹל אֲשֶׁר
  choice: conformément à tout ce que
  rationale: La préposition כְּ exprime la conformité. « Conformément à » rend cette nuance plus précisément qu’une simple indication de contenu.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait indique naturellement en français que l’ordre de Yahweh à Moïse précède la transmission de Moïse aux Israélites.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par le titre « le Seigneur », afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Bien que אֶת marque le complément d’objet direct en hébreu, le français construit naturellement « ordonner » avec un complément de personne introduit par « à » lorsque la chose ordonnée est exprimée par une proposition.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ou le Seigneur
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » préserve le nom divin sans lui substituer un titre.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël ou les Israélites
  rationale: Le choix principal conserve la forme masculine de l’expression hébraïque et sa valeur de désignation collective, tandis que la note signale les équivalents français courants.
translation_notes:
  register: Français moderne, clair et digne. « Parla » évite l’impression d’une citation directe; « conformément à » restitue explicitement l’idée de conformité exprimée par l’hébreu. La répétition de « Moïse » est maintenue, comme dans le texte source.
