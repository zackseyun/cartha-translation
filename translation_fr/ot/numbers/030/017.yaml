  text: אֵ֣לֶּה הַֽ/חֻקִּ֗ים אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִשְׁתּ֑/וֹ בֵּֽין אָ֣ב לְ/בִתּ֔/וֹ בִּ/נְעֻרֶ֖י/הָ בֵּ֥ית אָבִֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: fr
  text: Telles sont les prescriptions que Yahweh a données à Moïse concernant un homme et sa femme, et un père et sa fille pendant sa jeunesse, dans la maison de son père.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « entre un homme et sa femme, et entre un père et sa fille, dans sa jeunesse, dans la maison de son père ».'
    reason: La note conserve la formulation relationnelle répétée de l’hébreu et sa syntaxe condensée, sans ajouter d’objet tel que « engagements ».
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Telles sont les prescriptions
  rationale: La formule démonstrative récapitule les règles précédentes. « Prescriptions » conserve le registre juridique de חֻקִּים tout en restant naturel en français moderne.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: que Yahweh donna à Moïse
  rationale: Dans ce contexte législatif, « donna à Moïse » exprime naturellement le fait que Yahweh lui a prescrit ces règles, sans faire de Moïse celui à qui il est personnellement ordonné d’agir.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: au sujet des engagements entre un homme et sa femme
  rationale: בֵּין marque littéralement la relation « entre » les personnes. L’ajout contextuel « engagements » rattache la formule aux vœux et serments réglementés dans le chapitre, sans réduire le passage à une règle conjugale particulière.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: et entre un père et sa fille
  rationale: La construction parallèle avec בֵּין est conservée, ce qui maintient la structure relationnelle et juridique de l’hébreu.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: pendant la jeunesse de celle-ci, lorsqu’elle vit dans la maison de son père
  rationale: La traduction garde à la fois la période de jeunesse et le cadre domestique paternel. « Lorsqu’elle vit » rend clairement en français la situation décrite sans ajouter explicitement une notion d’autorité absente de la formulation.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération le distingue d’un titre et conserve sa fonction dans l’hébreu.
- issue: Portée de בֵּין dans le résumé juridique
  choice: les engagements entre un homme et sa femme, et entre un père et sa fille
  alternative: ce qui concerne un homme et sa femme, ainsi qu’un père et sa fille
  rationale: La formulation retenue préserve l’idée relationnelle de « entre » tout en précisant, d’après le contexte immédiat du chapitre, que les prescriptions concernent les engagements verbaux. Elle n’attribue pas au verset une doctrine conjugale ou paternelle plus large.
- issue: Désignation du couple
  choice: un homme et sa femme
  alternative: un mari et sa femme
  rationale: אִישׁ peut signifier « homme » ou, dans ce rapport, « mari ». « Un homme et sa femme » garde la distinction lexicale de l’hébreu et demeure idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset est rendu comme une conclusion juridique. La répétition de « entre » préserve le parallélisme hébreu; « celle-ci » évite une ambiguïté de référent en français.
