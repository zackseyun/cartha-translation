source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: fr
  text: Si une femme fait un vœu à Yahweh[a] et s’impose une obligation[b] dans la maison de son père, durant sa jeunesse,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un verbe et un nom de même racine, littéralement « voue un vœu », pour souligner l’acte formel de faire un vœu.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie également un verbe et un nom apparentés, exprimant le fait de se placer sous une obligation contraignante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: Si une femme
  rationale: Dans ce contexte juridique, la construction introduit un nouveau cas conditionnel. « Si une femme » est naturel en français et conserve la valeur casuistique de כִּי.
- source_word: תִדֹּר נֶדֶר
  choice: fait un vœu
  rationale: Le français idiomatique ne reproduit pas naturellement la construction hébraïque avec verbe et nom de même racine. « Faire un vœu » conserve clairement l’acte formel, tandis qu’une note signale l’expression hébraïque.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu directement par « Yahweh », conformément à la décision théologique fournie.
- source_word: וְאָסְרָה אִסָּר
  choice: et s’impose un engagement
  rationale: Le verbe et le nom apparentés expriment le fait de se placer soi-même sous une obligation contraignante. Cette formulation française garde le sens réfléchi et juridique sans confondre l’engagement avec le נֶדֶר précédent.
- source_word: בְּבֵית אָבִיהָ
  choice: alors qu’elle vit dans la maison de son père
  rationale: La formulation explicite naturellement en français la situation de la femme au sein de la maison paternelle, sans ajouter une conclusion juridique sur son statut.
- source_word: בִּנְעֻרֶיהָ
  choice: pendant sa jeunesse
  rationale: Cette traduction reste proche de la désignation hébraïque de la période de jeunesse et évite d’expliciter dans le texte principal un statut matrimonial seulement implicite dans le contexte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom d’alliance et suit la décision doctrinale fournie, sans le remplacer par un titre.
- issue: Portée de בִּנְעֻרֶיהָ
  choice: pendant sa jeunesse
  alternative: alors qu’elle est jeune et sous l’autorité de son père
  rationale: Le texte nomme sa jeunesse et sa présence dans la maison de son père, mais n’énonce pas ici explicitement toutes les implications juridiques ou matrimoniales. La traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique léger. La syntaxe demeure ouverte par une virgule finale, puisque le verset constitue la protase d’une disposition poursuivie au verset suivant. Les deux constructions hébraïques à racines apparentées sont rendues idiomatiquement dans le texte et signalées en notes.
