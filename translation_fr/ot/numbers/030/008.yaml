  source_fidelity: 'La condition juridique, le mari, son silence valant absence d’opposition, et le maintien des vœux et obligations sont bien rendus. Toutefois, « le jour même » est ambigu en français : il peut faire entendre le jour où le vœu a été formulé, alors que l’hébreu vise le jour où le mari en prend connaissance. « Mais » introduit en outre un contraste qui n’est pas exprimé par la simple conjonction de l’hébreu.'
  naturalness: Le français est généralement naturel et d’un registre approprié. « Le jour où il en prend connaissance » suivi de « ce jour-là » rend explicitement et naturellement le repère temporel légal. « Obligations contraignantes » maintient utilement la force de l’hébreu sans employer une formulation artificielle.
  terminology: « Vœux » convient pour נְדָרֶיהָ. Pour אֱסָרֶיהָ, « obligations contraignantes » exprime la notion de liens ou d’engagements juridiquement obligatoires et la distingue des vœux. La répétition de « demeureront valables » conserve la répétition du verbe juridique hébreu.
