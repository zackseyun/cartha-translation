  text: וְ/שָׁמַ֥ע אִישָׁ֛/הּ בְּ/י֥וֹם שָׁמְע֖/וֹ וְ/הֶחֱרִ֣ישׁ לָ֑/הּ וְ/קָ֣מוּ נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֻֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: fr
  text: Si son mari en prend connaissance et garde le silence envers elle ce jour-là[a], ses vœux demeureront valables, et les obligations contraignantes qu’elle s’est imposées[b] demeureront valables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne lui dit rien ». Dans cette expression hébraïque, le silence du mari signifie qu’il ne s’oppose pas aux engagements.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses liens, qu’elle a liés sur elle-même ». Il s’agit d’obligations contraignantes qu’elle a prises sur elle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Mais si … l’apprend
  rationale: Dans cette suite de lois casuistiques, le qatal précédé de la conjonction exprime une nouvelle condition. « Mais si » marque naturellement en français le contraste avec le cas précédent.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte matrimonial, אִישׁ avec le suffixe féminin désigne le mari.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: le jour même
  rationale: L’expression fixe le délai légal au jour où le mari apprend l’engagement. « Le jour même » restitue ce repère sans la répétition peu naturelle de « l’apprend le jour où il l’apprend ».
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: et garde le silence envers elle
  rationale: Cette formulation conserve l’image hébraïque du silence à son égard, qui signifie ici l’absence d’opposition.
- source_word: וְקָמוּ … יָקֻמוּ
  choice: resteront en vigueur … resteront en vigueur
  rationale: Dans ce cadre juridique, קום signifie que les engagements demeurent valides. La répétition française préserve l’insistance de l’hébreu.
- source_word: נְדָרֶיהָ
  choice: ses vœux
  rationale: « Vœux » est le terme français usuel pour des engagements solennels de ce type.
- source_word: וֶאֱסָרֶהָ
  choice: les engagements
  rationale: Le nom désigne des obligations contraignantes prises sur soi. « Engagements » est clair en français moderne, tandis que le caractère obligatoire ressort du verbe « s’imposer ».
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: qu’elle s’est imposés
  rationale: La tournure rend naturellement l’idée hébraïque d’obligations que la femme a liées sur elle-même, sans faire de נֶפֶשׁ une référence particulière à l’âme.
