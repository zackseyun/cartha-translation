revisions:
- from: Mais si son mari l’apprend le jour même et garde le silence envers elle[a], ses vœux resteront en vigueur, et les engagements qu’elle s’est imposés[b] resteront en vigueur.
  to: Si son mari en prend connaissance et garde le silence envers elle ce jour-là[a], ses vœux demeureront valables, et les obligations contraignantes qu’elle s’est imposées[b] demeureront valables.
  rationale: La révision remplace le repère ambigu « le jour même » par « ce jour-là », dont l’antécédent explicite est le jour où le mari prend connaissance des engagements. Elle enlève aussi le contraste ajouté par « Mais » et rend plus nettement la force obligatoire de אֱסָרֶיהָ, tout en conservant la répétition juridique du verbe final.
