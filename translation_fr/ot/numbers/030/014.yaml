  edition: WLC
  text: כָּל נֵ֛דֶר וְ/כָל שְׁבֻעַ֥ת אִסָּ֖ר לְ/עַנֹּ֣ת נָ֑פֶשׁ אִישָׁ֥/הּ יְקִימֶ֖/נּוּ וְ/אִישָׁ֥/הּ יְפֵרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: fr
  text: Tout vœu et tout serment contraignant, par lesquels elle s’impose une privation[a], son mari peut le confirmer ou l’annuler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour affliger l’être même » ou « pour s’affliger elle-même ». L’expression peut désigner le fait de s’imposer un renoncement ou de se priver; elle peut notamment se rapporter au jeûne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: vœu
  rationale: Dans ce contexte juridique et cultuel, נֵדֶר désigne un engagement solennel, généralement pris devant Dieu ; « vœu » est l’équivalent français précis et usuel.
- source_word: שְׁבֻעַת אִסָּר
  choice: serment qui impose une privation
  rationale: La tournure rend à la fois שְׁבֻעָה, « serment », et la force contraignante ou restrictive de אִסָּר, tout en s’intégrant naturellement avec l’expression suivante.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: qui impose une privation
  rationale: L’expression idiomatique évoque le fait de s’imposer une mortification ou un renoncement, souvent le jeûne. Cette formulation française reste intelligible sans réduire le sens à une seule pratique.
- source_word: נָפֶשׁ
  choice: '[compris dans] une privation'
  rationale: Dans cet idiome, נֶפֶשׁ renvoie à la personne elle-même plutôt qu’à une partie immatérielle distincte ; une traduction littérale par « âme » serait susceptible d’induire en erreur en français moderne.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Le contexte matrimonial de la législation montre que אִישׁ avec le suffixe féminin désigne ici le mari.
- source_word: יְקִימֶנּוּ
  choice: peut le confirmer
  rationale: Le hifil de קום signifie ici faire tenir l’engagement, donc le ratifier ou le maintenir en vigueur. « Confirmer » convient au registre juridique du passage.
- source_word: יְפֵרֶנּוּ
  choice: peut l’annuler
  rationale: Le hifil de פרר exprime ici l’invalidation juridique du vœu ou du serment ; « annuler » en restitue clairement la force.
- source_word: כָּל ... וְכָל
  choice: Tout ... et tout ...
  rationale: La répétition de כָּל marque l’ensemble des deux catégories et se transpose naturellement par « tout… et tout… ».
theological_decisions:
- issue: Portée de לְעַנֹּת נָפֶשׁ
  choice: Traduire par « qui impose une privation » et signaler l’idiome en note.
  alternative: « pour affliger son âme », « par lequel elle s’impose un renoncement » ou une référence explicite au jeûne.
  rationale: Le texte ne précise pas la forme de la privation. La traduction retenue préserve cette ouverture, tandis que la note donne les principaux sens possibles sans imposer une pratique particulière.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme juridique du verset. « Privation » rend l’idée de contrainte volontaire sans employer le calque potentiellement trompeur « affliger l’âme » dans le corps du texte.
