revisions:
- from: Tout vœu et tout serment qui impose une privation[a], son mari peut le confirmer ou l’annuler.
  to: Tout vœu et tout serment contraignant, par lesquels elle s’impose une privation[a], son mari peut le confirmer ou l’annuler.
  rationale: La révision conserve la portée distributive de « tout vœu et tout serment », rend explicitement la force obligatoire de אִסָּר par « contraignant » et exprime l’idiome לְעַנֹּת נָפֶשׁ comme une privation volontaire sans le limiter au jeûne. Les verbes juridiques et la référence au mari sont maintenus.
