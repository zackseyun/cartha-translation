review_pass:
  verdict: revise
  source_fidelity: La formulation française doit distinguer plus clairement le caractère contraignant de « serment » (שְׁבֻעַת אִסָּר) et l’expression לְעַנֹּת נָפֶשׁ, qui indique la privation que la femme s’impose. Le texte hébreu couvre tout vœu et tout serment de cette nature; il ne dit pas que le serment impose lui-même la privation.
  naturalness: Le texte proposé est fluide, mais « serment qui impose une privation » attache maladroitement la privation au serment et laisse incertaine sa portée par rapport à « tout vœu ». « Serment contraignant, par lequel elle s’impose une privation » est naturel et plus précis dans un registre juridique moderne.
  terminology: « Vœu », « son mari », « confirmer » et « annuler » sont appropriés. « Serment contraignant » rend mieux שְׁבֻעַת אִסָּר que la formulation actuelle, sans réduire אִסָּר à la seule privation. La note doit rendre l’idiome sans présenter le jeûne comme un sens imposé.
  issues:
  - severity: medium
    issue: Fusion de « serment contraignant » et de « s’imposer une privation »
    rationale: « Serment qui impose une privation » fait du serment l’agent de la privation et tend à faire porter לְעַנֹּת נָפֶשׁ seulement sur « serment ». En hébreu, אִסָּר exprime le caractère obligatoire/contraignant du serment, tandis que l’infinitif décrit une privation que la femme s’impose.
  - severity: low
    issue: Note trop affirmative sur « affliger la personne »
    rationale: « Personne » est possible pour נֶפֶשׁ dans cet idiome, mais « elle-même » rend plus directement la construction réflexive française et évite de faire croire qu’il s’agit d’une traduction lexicale isolée et univoque.
  revised_text: Tout vœu et tout serment contraignant, par lesquels elle s’impose une privation[a], son mari peut le confirmer ou l’annuler.
