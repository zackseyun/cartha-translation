source:
  edition: WLC
  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: fr
  text: Et si, dans la maison de son mari, elle a fait un vœu ou s’est imposé une obligation par un serment[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « a lié sur elle-même un lien par un serment » ou « s’est liée elle-même par un engagement juré ».'
    reason: La construction hébraïque emploie un verbe et un nom de même racine pour exprimer avec insistance une obligation que la femme place sur elle-même.
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: La conjonction suivie de la particule conditionnelle introduit un nouveau cas dans la suite juridique; « Et si » en conserve l’enchaînement.
- source_word: בֵּית אִישָׁהּ
  choice: dans la maison de son mari
  rationale: Cette formulation naturelle reste proche du groupe construit hébreu et préserve à la fois le cadre domestique et la situation conjugale.
- source_word: נָדָרָה
  choice: elle a fait un vœu
  rationale: Le verbe désigne l’action de faire un vœu; cette expression est claire et idiomatique en français moderne.
- source_word: אוֹ
  choice: ou
  rationale: La conjonction disjonctive relie deux actes juridiques apparentés sans les confondre.
- source_word: אָסְרָה אִסָּר
  choice: s’est imposé une obligation
  rationale: La construction associant un verbe et un nom de même racine souligne l’acte de se placer soi-même sous une contrainte; la traduction rend ce sens sans reproduire une répétition peu naturelle en français.
- source_word: עַל נַפְשָׁהּ
  choice: s’est imposé
  rationale: Dans cette expression, נֶפֶשׁ désigne la personne elle-même, non l’âme au sens étroit; le pronom réfléchi transmet donc correctement l’idée d’auto-obligation.
- source_word: בִּשְׁבֻעָה
  choice: par un serment
  rationale: La préposition indique ici le moyen par lequel l’obligation est rendue contraignante; « par un serment » en conserve le caractère formel.
