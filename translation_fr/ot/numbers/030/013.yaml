  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: fr
  text: Mais si son mari les annule bel et bien le jour où il les entend, aucune parole sortie de ses lèvres[a], qu’il s’agisse de ses vœux ou de l’engagement par lequel elle s’est liée[b], ne restera en vigueur. Son mari les a annulés, et le SEIGNEUR[c] lui pardonnera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce qui est sorti de ses lèvres » ; cette expression juridique englobe ici les engagements qu’elle a prononcés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’obligation qu’elle s’est imposée ».'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : YHWH, le nom divin traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit le cas conditionnel en contraste avec celui qui précède, tout en rendant naturellement la conjonction hébraïque.
- source_word: הָפֵר יָפֵר
  choice: annule bel et bien
  rationale: L’infinitif absolu suivi de la forme verbale conjuguée renforce l’action. « Bel et bien » restitue cette insistance dans un français naturel.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce cadre juridique et matrimonial, il s’agit du mari de la femme.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: le jour où il en entend parler
  rationale: Conserve la précision temporelle juridiquement importante tout en explicitant naturellement en français que le mari prend connaissance des engagements prononcés.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: rien de ce qui est sorti de ses lèvres
  rationale: Littéralement « tout ce qui sort de ses lèvres ». Avec la négation du verbe suivant, cette formulation française exprime clairement qu’aucun de ses engagements oraux ne demeure valide.
- source_word: לִנְדָרֶיהָ
  choice: ses vœux
  rationale: Équivalent usuel de נדר dans un contexte juridique et religieux.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: l’engagement par lequel elle s’est liée
  rationale: Rend l’idée d’une obligation que la femme s’impose à elle-même, sans réduire nécessairement l’expression à une privation ou à une pratique ascétique.
- source_word: לֹא יָקוּם
  choice: ne restera en vigueur
  rationale: Exprime clairement l’idiome juridique selon lequel une parole ou une obligation ne conserve pas sa validité.
- source_word: הֲפֵרָם
  choice: les a annulés
  rationale: Le parfait résume l’action décisive du mari et son effet juridique actuel.
- source_word: וַיהוָה
  choice: et le SEIGNEUR
  rationale: Rend le tétragramme YHWH selon la convention française qui emploie « le SEIGNEUR », avec une note signalant la forme hébraïque.
- source_word: יִסְלַח לָהּ
  choice: lui pardonnera
  rationale: Rend directement le verbe סלח sans préciser au-delà du texte la nature exacte de la faute pardonnée.
theological_decisions:
- issue: Portée du pardon divin après l’annulation des engagements
  choice: Conserver l’affirmation simple selon laquelle le SEIGNEUR pardonnera à la femme après l’annulation par son mari.
  alternative: Préciser que le pardon concerne soit le non-accomplissement du vœu, soit l’imprudence d’avoir formulé ce vœu.
  rationale: Le contexte relie l’annulation, la perte de validité des engagements et le pardon, mais le verset ne définit pas explicitement l’objet précis du pardon. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure juridique du verset, l’insistance verbale de l’hébreu et l’ambiguïté concernant l’objet précis du pardon.
