revisions:
- from: Mais si son mari les annule bel et bien le jour où il en entend parler, rien de ce qui est sorti de ses lèvres[a] — ni ses vœux ni l’engagement par lequel elle s’est liée[b] — ne restera en vigueur. Son mari les a annulés, et le SEIGNEUR[c] lui pardonnera.
  to: Mais si son mari les annule bel et bien le jour où il les entend, aucune parole sortie de ses lèvres[a], qu’il s’agisse de ses vœux ou de l’engagement par lequel elle s’est liée[b], ne restera en vigueur. Son mari les a annulés, et le SEIGNEUR[c] lui pardonnera.
  rationale: La révision remplace l’expression potentiellement indirecte « en entend parler » par « les entend », qui rend plus exactement le repère temporel du texte hébreu. Elle reformule aussi la relation entre « parole sortie de ses lèvres », « vœux » et « engagement » afin de préserver plus clairement la portée juridique de l’énoncé, sans modifier son sens ni préciser l’objet du pardon au-delà du texte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:51:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement la condition, l’insistance de l’annulation, l’invalidité juridique des paroles, l’annulation récapitulative et le pardon divin. Toutefois, « le jour où il en entend parler » affaiblit légèrement le sens direct de « le jour où il les entend » : le texte hébreu vise son audition des engagements eux-mêmes, non simplement le fait d’en recevoir des nouvelles.'
  naturalness: Le français est globalement naturel et de registre juridique clair. La coordination « rien de ce qui est sorti de ses lèvres — ni ses vœux ni… » est toutefois moins nette que « aucune parole sortie de ses lèvres, qu’il s’agisse de… ».
  terminology: « Mari », « vœux », « engagement par lequel elle s’est liée », « restera en vigueur », « le SEIGNEUR » et « pardonnera » sont appropriés. « Engagement par lequel elle s’est liée » conserve utilement la portée réflexive de l’hébreu sans imposer une interprétation ascétique.
  issues:
  - severity: low
    issue: « en entend parler »
    rationale: Cette expression peut signifier qu’il apprend l’existence des engagements de manière indirecte. Le verbe hébreu dit qu’il les entend, et le délai légal est fixé au jour de cette audition.
  - severity: low
    issue: Articulation de la catégorie juridique des paroles et de ses deux composantes
    rationale: La formulation révisée explicite que les vœux et les obligations auto-imposées sont les paroles concernées, tout en restant proche de la syntaxe et de la portée du texte source.
