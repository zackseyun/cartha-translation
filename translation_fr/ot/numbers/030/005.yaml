  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: fr
  text: Et si son père entend son vœu et l’engagement contraignant qu’elle s’est imposé, et qu’il garde le silence à son égard[a], tous ses vœux resteront en vigueur, et tout engagement contraignant qu’elle s’est imposé restera en vigueur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et son père garde le silence à son égard ». Dans ce contexte juridique, son silence signifie qu’il ne s’y oppose pas.'
    reason: clarification_du_sens_juridique
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: son vœu / ses vœux
  rationale: Dans ce contexte juridique et cultuel, נדר désigne un vœu, généralement fait à Dieu. « Vœu » est le terme français courant et précis.
- source_word: אֱסָרָהּ / אִסָּר
  choice: engagement contraignant
  rationale: אִסָּר désigne une restriction ou obligation que l’on s’impose. Cette formulation conserve sa force juridique et le distingue de « vœu ».
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: qu’elle s’est imposé
  rationale: L’expression hébraïque évoque littéralement le fait de lier quelque chose sur soi-même. Le français « s’imposer un engagement » rend naturellement cette dimension volontaire et réflexive.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: qu’il garde le silence à son égard
  rationale: Le verbe signifie « se taire, garder le silence ». Cette traduction reste proche de l’hébreu sans expliciter dans le corps du texte une objection qui n’y est pas formulée.
- source_word: וְקָמוּ ... יָקוּם
  choice: resteront / restera en vigueur
  rationale: Dans ce cadre légal, קום indique que les engagements demeurent valides. « Rester en vigueur » exprime clairement cette portée juridique en français moderne.
- source_word: כָּל
  choice: tous / tout
  rationale: « Tous » convient au pluriel « vœux », tandis que « tout » rend naturellement la valeur distributive devant le singulier « engagement ».
- source_word: וְ
  choice: Et si
  rationale: La conjonction poursuit le cas juridique conditionnel commencé au verset précédent. « Et si » en rend explicitement et naturellement la fonction discursive.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « engagement contraignant » et de « rester en vigueur » conserve la structure juridique et l’insistance de l’hébreu, tandis que « entend parler de » rend naturellement l’idée qu’il prend connaissance du vœu.
