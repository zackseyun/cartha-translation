  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: fr
  text: Mais si son mari garde résolument le silence, jour après jour, il confirme ainsi tous ses vœux ou tous les engagements qui la lient[a]. Il les a confirmés, puisqu’il a gardé le silence le jour où il en a entendu parler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous ses liens qui sont sur elle ». Il s’agit d’engagements qu’elle s’est imposés et qui ont force obligatoire pour elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: garde vraiment le silence
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’idée verbale. « vraiment » rend cette insistance sans alourdir la phrase; dans ce contexte juridique, le silence équivaut à une absence d’opposition.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte matrimonial et juridique, אִישׁ avec le suffixe féminin singulier désigne naturellement le mari.
- source_word: מִיּוֹם אֶל יוֹם
  choice: jour après jour
  rationale: Cette tournure exprime un silence qui se prolonge au fil des jours. « Jour après jour » est idiomatique en français et conserve l’idée de continuité.
- source_word: וְהֵקִים
  choice: il confirme ainsi
  rationale: 'Le hiphil de קום a ici une valeur juridique: faire tenir ou maintenir les vœux en vigueur. « ainsi » explicite sobrement le rapport entre le silence et son effet légal.'
- source_word: נְדָרֶיהָ
  choice: ses vœux
  rationale: « Vœux » est l’équivalent français usuel de נדר dans les contextes juridiques et cultuels.
- source_word: אֱסָרֶיהָ
  choice: les engagements qui la lient
  rationale: Le nom dérivé de אסר évoque ce qui lie une personne. Cette formulation rend à la fois l’engagement volontaire et sa force obligatoire.
- source_word: הֵקִים אֹתָם
  choice: Il les a confirmés
  rationale: L’accompli hébreu récapitule l’effet juridique résultant du silence; le passé composé français exprime naturellement ce résultat acquis.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction introduit la raison pour laquelle les engagements sont tenus pour confirmés.
- source_word: הֶחֱרִשׁ לָהּ
  choice: il a gardé le silence
  rationale: La répétition du motif du silence est conservée, tandis que le complément pronominal hébreu n’est pas rendu littéralement afin d’éviter une expression peu naturelle en français.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: le jour où il en a entendu parler
  rationale: La formulation conserve le repère juridique précis du jour de l’audition et explicite en français naturel que ce qu’il entend concerne les vœux ou engagements.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure juridique et la répétition du silence sont préservées, tout en évitant les calques peu naturels tels que « garder le silence envers elle ». Le point-virgule hébreu est rendu par deux phrases pour une lecture plus fluide.
