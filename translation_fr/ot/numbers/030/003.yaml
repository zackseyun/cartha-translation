  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: fr
  text: Si un homme fait un vœu à Yahweh ou prête serment en s’imposant une obligation[a], il ne manquera pas à sa parole[b] ; il accomplira tout ce qui est sorti de sa bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour lier sur lui-même une obligation contraignante ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ne profanera pas sa parole ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom masculin singulier est conservé dans cette formulation juridique, sans le neutraliser.
- source_word: יִדֹּר נֶדֶר
  choice: fait un vœu
  rationale: Le français idiomatique rend la construction hébraïque avec verbe et nom de même racine sans en reproduire la lourdeur.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération rend directement le nom divin יהוה et le distingue d’un titre.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: prête serment
  rationale: Expression française naturelle et solennelle pour la construction hébraïque apparentée « jurer un serment ».
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: en s’imposant une obligation
  rationale: Rend l’idée d’une contrainte que l’homme lie sur lui-même, tout en évitant le calque peu naturel « lier une liaison ».
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: il ne profanera pas sa parole
  rationale: Conserve le champ sémantique cultuel de חלל et la force théologique de l’image, plutôt que de la réduire silencieusement à « manquer à sa parole ».
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: il accomplira tout ce qui est sorti de sa bouche
  rationale: Préserve l’image concrète de la parole sortant de la bouche et exprime clairement l’obligation d’exécution.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Sens de יַחֵל appliqué à la parole
  choice: ne profanera pas sa parole
  alternative: ne manquera pas à sa parole
  rationale: Le rendu principal maintient la notion de profanation présente dans le verbe, tandis que la note fournit l’équivalent idiomatique juridique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste solennelle ; les images hébraïques significatives de la parole profanée et de ce qui sort de la bouche sont conservées.
