source:
  edition: WLC
  text: וְ/נֵ֥דֶר אַלְמָנָ֖ה וּ/גְרוּשָׁ֑ה כֹּ֛ל אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָק֥וּם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: fr
  text: Quant au vœu d’une veuve ou d’une femme divorcée, tout engagement par lequel elle s’est liée restera en vigueur à son égard[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aura force obligatoire pour elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: vœu
  rationale: Dans ce contexte juridique et cultuel, le terme désigne un engagement solennel, typiquement pris devant Dieu; « vœu » est l’équivalent français précis et usuel.
- source_word: אַלְמָנָה
  choice: veuve
  rationale: Équivalent direct et naturel du terme hébreu.
- source_word: גְרוּשָׁה
  choice: femme divorcée
  rationale: Le participe passif désigne une femme renvoyée par son mari, donc divorcée; cette formulation est claire et convient au registre juridique.
- source_word: כֹּל אֲשֶׁר
  choice: tout engagement par lequel
  rationale: La formule a une portée globale et introduit ce que la femme s’est imposé; « engagement » explicite naturellement cette portée sans la limiter au seul mot « vœu ».
- source_word: אָסְרָה
  choice: s’est liée
  rationale: Le verbe signifie littéralement « lier » et exprime ici une obligation volontairement assumée; le réfléchi français conserve cette image.
- source_word: עַל נַפְשָׁהּ
  choice: elle s’est liée
  rationale: Littéralement « sur elle-même / sur sa personne »; intégré au verbe pronominal, le français rend naturellement l’idée d’une obligation qu’elle s’impose.
- source_word: יָקוּם
  choice: restera en vigueur
  rationale: Dans un contexte juridique, קום indique qu’une parole ou une obligation demeure valide. Cette formulation française transmet clairement la validité continue.
- source_word: עָלֶיהָ
  choice: pour elle
  rationale: La préposition indique que l’obligation repose sur la femme et s’applique à elle; « pour elle » reste naturel, tandis que la note donne l’expression juridique plus explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le caractère juridique du verset, tout en évitant le calque peu naturel « se dressera contre elle ». Le marqueur [a] figure dans le texte principal.
