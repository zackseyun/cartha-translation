  text: וְ/אִם הָי֤וֹ תִֽהְיֶה֙ לְ/אִ֔ישׁ וּ/נְדָרֶ֖י/הָ עָלֶ֑י/הָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: fr
  text: Mais si elle se marie[a] alors que ses vœux reposent sur elle, ou qu’elle s’est engagée par une parole irréfléchie de ses lèvres[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elle est ou devient à un homme » ; l’expression hébraïque désigne ici le mariage.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une parole de ses lèvres par laquelle elle s’est engagée ». Le terme peut désigner une déclaration engageante prononcée impulsivement, distincte d’un vœu formel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit un nouveau cas conditionnel lié à la législation précédente, avec une légère nuance de contraste.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: elle se marie
  rationale: L’expression idiomatique avec היה et לְאִישׁ désigne le fait de devenir l’épouse d’un homme ou d’être mariée; cette formulation est naturelle en français sans reprendre un langage de possession.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: alors que ses vœux reposent sur elle
  rationale: Conserve l’image hébraïque d’obligations qui reposent sur la personne, sans anticiper la décision juridique exposée dans la suite.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: une parole irréfléchie de ses lèvres
  rationale: מִבְטָא désigne une parole prononcée; dans ce contexte de vœux, « irréfléchie » exprime son caractère potentiellement impulsif tout en la distinguant d’un vœu formel.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: qui la lie
  rationale: אָסַר garde la métaphore juridique de lier ou d’obliger, tandis que נֶפֶשׁ a ici une valeur réflexive et désigne la personne elle-même.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le contexte juridique d’un engagement
  choice: la
  alternative: son âme / sa vie
  rationale: Le passage parle d’une obligation que la femme s’impose, non de la constitution de l’être humain; le pronom réflexif évite d’introduire une conception doctrinale de l’âme.
- issue: Statut des vœux au moment du mariage
  choice: ses vœux reposent sur elle
  alternative: ses vœux restent obligatoires pour elle
  rationale: La traduction conserve l’image et l’indétermination de l’hébreu, sans décider avant les versets suivants si ces engagements sont juridiquement confirmés.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste ouverte sur le verset suivant, conformément à la phrase législative hébraïque. Les formulations évitent à la fois l’archaïsme et un langage moderne de possession conjugale.
