id: NUM.30.9
reference: Numbers 30:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: fr
  text: Mais si, le jour où son mari en entend parler, il s’y oppose et annule le vœu qui l’engage ainsi que la parole irréfléchie[a] qu’elle a prononcée, par laquelle elle s’est elle-même liée, Yahweh lui pardonnera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’expression de ses lèvres » ou « la parole qu’elle a prononcée ».'
    reason: 'La nuance de מִבְטָא est discutée : le mot peut désigner une expression prononcée sans impliquer nécessairement qu’elle soit irréfléchie; le contexte concerne toutefois une obligation que la femme s’est imposée.'
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition en contraste avec le cas précédent, tout en conservant la valeur conjonctive.
- source_word: בְּיוֹם שְׁמֹעַ
  choice: le jour où … en entend parler
  rationale: Rend naturellement l’expression temporelle hébraïque et l’objet implicite de l’audition.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte juridique matrimonial, אִישׁ avec le suffixe féminin désigne le mari.
- source_word: יָנִיא אֹתָהּ
  choice: il s’y oppose
  rationale: Le hiphil de נוא exprime ici l’action d’empêcher ou de désavouer l’engagement; cette formulation évite l’ambiguïté française de « il lui interdit » sans complément.
- source_word: וְהֵפֵר
  choice: il annule ainsi
  rationale: הפר désigne l’invalidation juridique du vœu; « ainsi » explicite que l’opposition produit cette annulation sans ajouter une action indépendante.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: le vœu qui l’engage
  rationale: Exprime clairement en français moderne la métaphore hébraïque d’un vœu reposant sur elle comme obligation.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: la parole irréfléchie
  rationale: מִבְטָא désigne une parole prononcée et peut comporter ici une nuance d’impulsivité; la note conserve le sens plus neutre possible.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: par laquelle elle s’est liée elle-même
  rationale: Rend l’idiome d’une obligation que la femme s’impose personnellement, en conservant l’image du lien.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin יהוה présent dans le texte hébreu.
- source_word: יִסְלַח לָהּ
  choice: lui pardonnera
  rationale: סלח signifie pardonner; le futur convient à la conséquence juridique énoncée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- issue: Nuance morale de מִבְטָא שְׂפָתֶיהָ
  choice: la parole irréfléchie
  alternative: la parole prononcée par ses lèvres
  rationale: Le contexte autorise une nuance de parole impulsive, mais celle-ci n’est pas lexicalement certaine; l’alternative plus neutre est donc signalée en note.
- issue: Relation entre l’opposition du mari et l’annulation
  choice: il s’y oppose, il annule ainsi
  alternative: il l’en empêche et annule
  rationale: La formulation choisie présente l’invalidation comme l’effet juridique de son opposition, tout en évitant de préciser davantage que ne le fait le texte la mécanique exacte des deux verbes.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire juridique reste accessible; les métaphores hébraïques sont conservées lorsqu’elles demeurent naturelles, et explicitées lorsqu’un calque serait obscur.
