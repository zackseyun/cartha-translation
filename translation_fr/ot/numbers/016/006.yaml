  text: זֹ֖את עֲשׂ֑וּ קְחוּ לָ/כֶ֣ם מַחְתּ֔וֹת קֹ֖רַח וְ/כָל עֲדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: fr
  text: 'Faites ceci : prenez des encensoirs, Coré et toute son assemblée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: Faites ceci
  rationale: Le démonstratif annonce l’instruction qui suit; cette tournure rend naturellement l’impératif pluriel en français.
- source_word: קְחוּ לָכֶם
  choice: prenez chacun
  rationale: L’impératif est pluriel et לָכֶם indique que les intéressés doivent se procurer les récipients pour leur propre usage. « Chacun » exprime ici cette portée distributive naturelle dans le contexte.
- source_word: מַחְתּוֹת
  choice: un encensoir
  rationale: Le nom désigne des récipients servant à porter des braises, notamment pour offrir de l’encens. Le singulier français après « chacun » correspond au pluriel distributif hébreu.
- source_word: קֹרַח
  choice: Coré
  rationale: Forme française traditionnelle et largement reconnue du nom propre biblique.
- source_word: וְכָל עֲדָתוֹ
  choice: et toute son assemblée
  rationale: עֵדָה désigne ici le groupe réuni autour de Coré. « Assemblée » conserve la dimension collective sans imposer une nuance ecclésiale plus tardive.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’adresse directe « Coré et toute son assemblée » est maintenue en fin de phrase, conformément à l’ordre et à la fonction vocative probables de l’hébreu.
