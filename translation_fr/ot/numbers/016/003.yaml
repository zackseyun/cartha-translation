source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: fr
  text: 'Ils se rassemblèrent contre Moïse et Aaron et leur dirent : « Vous allez trop loin ! En effet, toute la communauté — tous, sans exception — est sainte, et Yahweh est au milieu d’eux. Pourquoi donc vous élevez-vous au-dessus de l’assemblée de Yahweh ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: Ils se rassemblèrent
  rationale: Le niphal de קהל exprime ici un rassemblement collectif et délibéré. L’hostilité est portée par עַל, rendu séparément par « contre ».
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: contre Moïse et Aaron
  rationale: Dans ce contexte de confrontation, עַל marque l’opposition plutôt qu’une simple position devant eux.
- source_word: רַב לָכֶם
  choice: Vous allez trop loin !
  rationale: Cette formulation française actuelle restitue la force de l’expression idiomatique, littéralement proche de « C’en est trop pour vous » ou « Assez de vous ».
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: toute la communauté — eux tous —
  rationale: La reprise emphatique de la totalité en hébreu est conservée. « Communauté » convient à עֵדָה et reste distinct de « assemblée » pour קהל.
- source_word: קְדֹשִׁים
  choice: est sainte
  rationale: L’accord au singulier avec « communauté » est naturel en français, tandis que l’incise « eux tous » conserve l’affirmation que chacun de ses membres est concerné.
- source_word: וּבְתוֹכָם יְהוָה
  choice: et Yahweh est au milieu d’eux
  rationale: « Au milieu d’eux » exprime clairement la présence divine au sein de la communauté, et le nom divin est translittéré.
- source_word: וּמַדּוּעַ
  choice: Pourquoi donc
  rationale: « Donc » rend la valeur déductive de la question fondée sur l’affirmation précédente.
- source_word: תִּתְנַשְּׂאוּ
  choice: vous élevez-vous
  rationale: Le hitpael de נשׂא exprime l’action réflexive de s’élever soi-même; cette tournure préserve l’image hébraïque et l’accusation d’orgueil.
- source_word: עַל קְהַל יְהוָה
  choice: au-dessus de l’assemblée de Yahweh
  rationale: Avec le verbe réflexif, עַל indique ici une élévation sur les autres. « Assemblée » rend קהל et respecte la variation lexicale du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Statut de l’affirmation selon laquelle toute la communauté est sainte
  choice: Rapporter directement l’affirmation des contestataires
  alternative: Ajouter une réserve telle que « prétend être sainte »
  rationale: Le verset rapporte leur argument. La traduction n’anticipe pas le jugement du récit et préserve ainsi la tension théologique.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le passé simple convient au registre narratif biblique sans archaïsme excessif. La ponctuation met en relief l’insistance de כֻּלָּם. Aucun marqueur de note n’est requis puisque le texte ne comporte aucune note.
