  text: וַ/יֵּ֨רְד֜וּ הֵ֣ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֛ם חַיִּ֖ים שְׁאֹ֑לָ/ה וַ/תְּכַ֤ס עֲלֵי/הֶם֙ הָ/אָ֔רֶץ וַ/יֹּאבְד֖וּ מִ/תּ֥וֹךְ הַ/קָּהָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: fr
  text: Ils descendirent vivants au séjour des morts[a], eux et tout ce qui leur appartenait. La terre les recouvrit, et ils périrent du milieu de l’assemblée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au Shéol » ou « dans la tombe ». Hébreu : « Shéol ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: ils descendirent
  rationale: Le verbe ירד exprime un mouvement vers le bas. « Descendirent » est naturel en français et convient au mouvement narratif.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: eux et tout ce qui leur appartenait
  rationale: Cette formulation reste assez large pour englober les personnes, les biens et tout ce qui relevait d’eux, sans restreindre indûment le sens.
- source_word: חַיִּים
  choice: vivants
  rationale: L’adjectif souligne qu’ils descendirent alors qu’ils étaient encore en vie.
- source_word: שְׁאֹלָה
  choice: au séjour des morts
  rationale: Le suffixe directionnel indique la destination. « Séjour des morts » rend le concept hébreu de Shéol de manière compréhensible sans le réduire à une tombe individuelle ni l’assimiler à l’enfer au sens doctrinal ultérieur.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: la terre les recouvrit
  rationale: Le verbe כסה signifie « couvrir, recouvrir » et la terre en est le sujet. « Les recouvrit » restitue naturellement en français l’image exprimée avec עַל.
- source_word: וַיֹּאבְדוּ
  choice: ils disparurent
  rationale: Dans ce contexte, אבד peut exprimer la disparition ou l’anéantissement hors du groupe. « Disparurent » s’accorde avec le complément « du milieu de l’assemblée » sans préciser davantage le mode de leur mort.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: du milieu de l’assemblée
  rationale: Cette expression reproduit étroitement l’idée spatiale et communautaire de l’hébreu; « assemblée » rend קהל dans un français actuel et digne.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le Shéol; la tombe
  rationale: « Séjour des morts » préserve la portée plus large du terme hébreu sans introduire la notion plus tardive et systématisée d’enfer. La translittération « Shéol » et la lecture plus étroite « tombe » sont signalées en note afin de conserver l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase a été divisée en deux pour une lecture naturelle, tout en conservant l’enchaînement des actions. « Tout ce qui leur appartenait » maintient volontairement l’étendue référentielle de l’hébreu.
