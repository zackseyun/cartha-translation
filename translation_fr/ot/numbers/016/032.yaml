review_pass:
  verdict: revise
  source_fidelity: La version proposée restitue correctement l’image de la terre qui ouvre sa bouche et l’action d’engloutir. Toutefois, « leurs familles » réduit indûment la portée ambiguë de בָּתֵּיהֶם, qui désigne littéralement leurs maisons et peut, par extension, viser leurs maisonnées. « Maisons » dans le texte, avec une note sur « maisonnées », conserve mieux l’ambiguïté. Pour אֲשֶׁר לְקֹרַח, « qui étaient avec Coré » exprime plus naturellement en français l’association indiquée par le למד sans suggérer une relation de possession.
  naturalness: La phrase révisée demeure sobre et narrative. Les deux-points introduisent naturellement l’énumération après « les engloutit » et permettent de conserver le pronom explicite « eux » sans lourdeur. « Qui étaient avec Coré » est plus idiomatique que « qui appartenaient à Coré ».
  terminology: « Terre », « bouche », « engloutit », « maisons », « hommes », « Coré » et « biens » sont appropriés. « Maisonnées » en note est le terme précis pour l’extension collective possible de « maisons ».
  issues:
