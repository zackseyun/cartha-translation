    issue: « Leurs familles » pour בָּתֵּיהֶם
    rationale: « Familles » ne rend ni le sens littéral « maisons » ni toute l’extension possible de « maisonnées », laquelle peut comprendre davantage que les liens familiaux. Le choix réduit une ambiguïté que le texte hébreu maintient.
  - severity: low
    issue: « Qui appartenaient à Coré »
    rationale: La formulation est compréhensible, mais elle est moins naturelle en français et peut évoquer une possession personnelle. « Qui étaient avec Coré » rend sobrement l’association sans la préciser.
