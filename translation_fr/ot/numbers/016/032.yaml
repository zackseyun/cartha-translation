  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: fr
  text: 'La terre ouvrit sa bouche et les engloutit : eux, leurs maisons[a], tous les hommes qui étaient avec Coré[b], et tous leurs biens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs maisonnées ». Le mot hébreu peut désigner les bâtiments ou, par extension, les maisonnées.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous ceux qui étaient avec Coré ». L’hébreu emploie ici אָדָם (« homme, être humain ») dans une expression collective.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: La terre ouvrit sa bouche
  rationale: Rend directement le verbe פתח et conserve la personnification vive de la terre dotée d’une « bouche ».
- source_word: וַתִּבְלַע אֹתָם
  choice: et les engloutit, eux
  rationale: « Engloutir » exprime naturellement en français l’action de בלע dans ce contexte. Le pronom disjoint « eux » clarifie la coordination avec les objets qui suivent.
- source_word: בָּתֵּיהֶם
  choice: leurs familles
  rationale: Le pluriel de בַּיִת peut désigner les maisons physiques ou, par extension, les maisonnées. Ici, « familles » transmet clairement le sens humain probable, tandis que le sens littéral est conservé en note.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: tous les hommes qui appartenaient à Coré
  rationale: La formulation garde la référence humaine masculine de אָדָם tout en rendant la valeur collective de l’expression. « Appartenaient à Coré » traduit la relation marquée par לְ sans préciser davantage la nature de cette affiliation.
- source_word: כָּל־הָרֲכוּשׁ
  choice: tous leurs biens
  rationale: « Biens » est un équivalent français actuel et suffisamment large de רְכוּשׁ, qui désigne les possessions ou les biens matériels.
theological_decisions:
- issue: Valeur collective de אָדָם dans כָּל־הָאָדָם
  choice: tous les hommes qui appartenaient à Coré
  alternative: tous ceux qui appartenaient à Coré
  rationale: Le texte principal conserve la forme masculine du terme source tout en employant un pluriel collectif naturel en français. La note signale une formulation collective plus neutre sans déterminer qui était précisément inclus dans le groupe.
- issue: Portée de בָּתֵּיהֶם
  choice: leurs familles
  alternative: leurs maisons
  rationale: Dans le récit du jugement, le terme peut viser les maisonnées plutôt que les seuls bâtiments. Comme l’hébreu permet les deux lectures, l’autre sens est explicitement conservé en note.
translation_notes:
  register: Français international moderne, sobre et narratif. La métaphore biblique de la terre qui ouvre sa bouche est maintenue. La coordination est légèrement explicitée par « eux » et « ainsi que » afin d’éviter une lecture heurtée sans modifier la liste hébraïque.
