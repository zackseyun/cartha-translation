  yaml_path: translation/ot/numbers/016/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Alors Yahweh parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors ... parla
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession en français, et « parla » conserve le sens verbal de דבר dans cette formule introductive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément à sa présence explicite dans le texte hébreu, plutôt que remplacé par un titre.
- source_word: אֶל
  choice: à
  rationale: Équivalent français naturel de la préposition marquant le destinataire de la parole.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif לֵאמֹר introduit la parole directe qui suit. « En ces termes : » remplit cette fonction de manière naturelle et digne en français tout en laissant la phrase ouverte sur le verset suivant.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formule hébraïque est rendue naturellement sans effacer sa fonction narrative ni le fait qu’elle introduit la déclaration du verset suivant.
