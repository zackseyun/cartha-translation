review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : l’instruction est distributive, l’encens est placé dans le récipient, et les deux cent cinquante récipients sont présentés devant Yahweh. Toutefois, « vous apporterez aussi » transforme inutilement l’instruction finale en futur indicatif et ajoute « aussi », qui n’est pas exprimé. Une formulation impérative explicite rend mieux l’ellipse finale hébraïque.'
  naturalness: Le français est globalement clair et moderne. « Apporter devant Yahweh » est cependant moins idiomatique dans ce contexte de présentation rituelle que « présenter devant Yahweh ». La répétition de « pelle à braises » reste justifiée pour maintenir la précision référentielle.
  terminology: « Pelle à braises » est une option concrète et compréhensible pour מַחְתָּה, même si « encensoir » demeure une alternative traditionnelle valable. « Yahweh » rend correctement le tétragramme conformément au choix éditorial. « Encens » est exact pour קְטֹרֶת.
  issues:
  - severity: medium
    issue: Mode verbal de la dernière instruction
    rationale: « Toi et Aaron, vous apporterez aussi chacun la vôtre » emploie un futur indicatif, alors que le contexte est une série d’ordres. Le mot « aussi » est une addition interprétative. Une injonction explicite est plus fidèle et plus nette en français.
  - severity: low
    issue: Verbe de présentation
    rationale: Dans un cadre cultuel, « présenter devant Yahweh » rend plus naturellement וְהִקְרַבְתֶּם ... לִפְנֵי יְהוָה que « apporter devant Yahweh », tout en conservant l’idée de rapprochement et de présentation.
  revised_text: 'Que chacun prenne sa pelle à braises[a], y mette de l’encens et présente devant Yahweh sa pelle à braises : deux cent cinquante pelles à braises. Toi et Aaron, présentez chacun votre pelle à braises.'
  revised_footnotes:
