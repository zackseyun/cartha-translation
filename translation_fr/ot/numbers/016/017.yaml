base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: fr
  text: 'Que chacun prenne sa pelle à braises[a], y mette de l’encens et présente devant Yahweh sa pelle à braises : deux cent cinquante pelles à braises. Toi et Aaron, présentez chacun votre pelle à braises.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « encensoir » ; récipient dans lequel on plaçait des braises et de l’encens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ אִישׁ מַחְתָּתוֹ
  choice: Que chacun prenne sa pelle à braises
  rationale: L’impératif pluriel suivi de אִישׁ a une valeur distributive. « Que chacun prenne » est naturel en français et conserve cette portée. מַחְתָּה désigne ici le récipient destiné aux braises et à l’encens.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: y mette de l’encens
  rationale: Le pronom français « y » reprend naturellement les pelles à braises. Il rend l’idée de déposer l’encens dessus, vraisemblablement sur les braises qu’elles contiennent, sans alourdir la phrase.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: et apporte devant Yahweh
  rationale: Le hiphil de קרב exprime ici le fait d’apporter ou de présenter dans un cadre cultuel. « Apporter devant » garde l’action concrète et l’idée de présentation en présence de Dieu.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: deux cent cinquante pelles à braises
  rationale: Le nombre est écrit en toutes lettres conformément au registre littéraire. « Cent » reste invariable puisqu’il est suivi d’un autre nombre.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: Toi et Aaron, vous apporterez aussi chacun la vôtre
  rationale: L’hébreu est elliptique et distributif. Le français rétablit le verbe sous-entendu et emploie « la vôtre » pour éviter une répétition pesante tout en indiquant que chacun apporte sa propre pelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » le rend comme nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque est partiellement conservée, mais la dernière occurrence est rendue par un pronom afin d’obtenir une phrase naturelle. Le terme concret « pelle à braises » est retenu dans le texte, avec l’alternative cultuelle traditionnelle en note.
