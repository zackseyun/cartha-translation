- from: 'Que chacun prenne sa pelle à braises[a], y mette de l’encens et apporte devant Yahweh sa pelle à braises : deux cent cinquante pelles à braises. Toi et Aaron, vous apporterez aussi chacun la vôtre.'
  to: 'Que chacun prenne sa pelle à braises[a], y mette de l’encens et présente devant Yahweh sa pelle à braises : deux cent cinquante pelles à braises. Toi et Aaron, présentez chacun votre pelle à braises.'
  rationale: La révision conserve la structure distributive et le nombre du texte hébreu, tout en remplaçant le futur final par une injonction française explicite. Elle supprime l’ajout non marqué « aussi », emploie « présenter » pour l’action cultuelle, et conserve une note lexicale correctement ancrée au premier emploi du terme.
