  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: fr
  text: 'Puis Moïse dit à Coré : « Écoutez donc, fils de Lévi ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis … dit » exprime naturellement la succession en français moderne.
- source_word: אֶל־קֹרַח
  choice: à Coré
  rationale: אֶל marque ici le destinataire de la parole ; Coré est la forme française traditionnelle du nom.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel de שׁמע appelle les destinataires à prêter attention. « Écoutez » est plus naturel que « Entendez » dans cette interpellation directe.
- source_word: נָא
  choice: donc
  rationale: La particule renforce ou presse l’impératif dans ce contexte de confrontation. « donc » rend cette insistance sans introduire la politesse que pourrait suggérer « s’il vous plaît ».
- source_word: בְּנֵי לֵוִי
  choice: fils de Lévi
  rationale: La construction signifie littéralement « fils de Lévi » et désigne ici les hommes lévites directement interpellés ; la formulation conserve l’expression de parenté et le genre du texte source.
theological_decisions:
- issue: Terme de parenté masculin dans l’interpellation directe
  choice: fils de Lévi
  alternative: Lévites
  rationale: L’hébreu emploie explicitement le pluriel masculin « fils de Lévi ». Le conserver maintient l’image généalogique et le caractère masculin de l’adresse, sans neutralisation interprétative.
translation_notes:
  register: Français international moderne, digne et direct. L’exclamation restitue la force de l’interpellation, tandis que « donc » transmet l’insistance de נָא de façon idiomatique.
