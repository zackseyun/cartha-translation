  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: fr
  text: 'Tout Israël qui se trouvait autour d’eux s’enfuit en entendant leurs cris[a], car ils disaient : « De peur que la terre ne nous engloutisse ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à leur bruit ». Le mot hébreu qôl peut désigner un son, une voix ou un cri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: Tout Israël
  rationale: Cette formulation conserve le sens collectif du nom propre Israël et reste naturelle dans le registre biblique français.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: qui se trouvait autour d’eux
  rationale: La proposition désigne la partie d’Israël présente dans les environs immédiats; le singulier s’accorde avec le collectif « Israël ».
- source_word: נָסוּ
  choice: s’enfuit
  rationale: Le verbe נוס exprime une fuite urgente; le singulier français suit le sujet collectif « Tout Israël ».
- source_word: לְ/קֹלָם
  choice: en entendant leurs cris
  rationale: קוֹל peut désigner un son, une voix ou un cri. Dans ce contexte de jugement, « leurs cris » est naturel, tandis que la note préserve l’alternative plus générale « au bruit qu’ils faisaient ».
- source_word: כִּי אָמְרוּ
  choice: car ils se disaient
  rationale: כִּי introduit la raison de la fuite. Le pluriel reprend les membres du collectif, et « se disaient » rend naturellement une parole échangée ou répétée dans le groupe.
- source_word: פֶּן
  choice: Sinon
  rationale: פֶּן introduit ici une conséquence redoutée. « Sinon » exprime clairement et avec urgence cette crainte en français moderne.
- source_word: תִּבְלָעֵ/נוּ
  choice: va nous engloutir
  rationale: בלע évoque ici la terre qui avale les personnes. « Engloutir » conserve cette image vive, et le futur proche convient à une menace perçue comme imminente.
- source_word: הָ/אָרֶץ
  choice: la terre
  rationale: Le contexte immédiat décrit la terre qui s’ouvre; « la terre » maintient ce lien narratif et la personnification.
