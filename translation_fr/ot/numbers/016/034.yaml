review_pass:
  verdict: revise
  source_fidelity: 'Le rendu conserve correctement la réaction de fuite, le référent pluriel de « leurs cris », la motivation introduite par כי et l’image de la terre qui engloutit. Toutefois, « Sinon » ne rend pas avec assez de précision la valeur appréhensive de פן : il introduit normalement une alternative ou une condition implicite, alors que l’hébreu exprime directement la crainte d’une conséquence. « De peur que ... ne » préserve cette nuance sans imposer d’interprétation.'
  naturalness: Le français est fluide et de registre narratif moderne. « Tout Israël » suivi du singulier est grammaticalement recevable pour un collectif. Le remplacement de « Sinon » par « De peur que » est plus idiomatico-sémantique dans cette réplique tout en gardant son urgence.
  terminology: « Terre » et « engloutir » reflètent bien הארץ et בלע dans le contexte immédiat. « Cris » est défendable pour קוליהם; la note maintient explicitement l’éventail lexical plus large du terme hébreu.
  issues:
  - severity: medium
    issue: « Sinon » pour פן
    rationale: פן introduit une crainte (« de peur que », « afin que ne... »), non une simple conséquence alternative. « Sinon » affaiblit et restructure la relation logique du texte source.
  - severity: low
    issue: « se disaient » pour אמרו
    rationale: Le réflexif peut suggérer un monologue intérieur ou une parole qu’ils se répètent. Le verbe hébreu signifie simplement « ils dirent »; « ils disaient » le rend plus directement.
  revised_text: 'Tout Israël qui se trouvait autour d’eux s’enfuit en entendant leurs cris[a], car ils disaient : « De peur que la terre ne nous engloutisse ! »'
  revised_footnotes:
