source:
  edition: WLC
  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: fr
  text: Si ces hommes meurent comme meurent tous les humains, et si ce qui arrive à tous les humains leur arrive, alors Yahweh ne m’a pas envoyé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit simplement et naturellement la condition posée par Moïse.
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: ces hommes meurent comme tous les êtres humains
  rationale: Rend l’idée d’une mort conforme à la condition humaine ordinaire. « Ces hommes » explicite naturellement le référent masculin pluriel dans le contexte.
- source_word: כָּל הָאָדָם
  choice: toute l’humanité / tous les êtres humains
  rationale: אָדָם est ici collectif et générique, et non limité aux personnes de sexe masculin. La variation française évite une répétition lourde sans changer le sens.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: s’ils subissent le sort commun à toute l’humanité
  rationale: פְּקֻדָּה et le verbe פקד décrivent ici ce qui est assigné à quelqu’un ou lui advient. « Subir le sort commun » est idiomatique en français, tout en laissant la note signaler l’éventail lexical et la répétition hébraïque.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: Yahweh ne m’a pas envoyé
  rationale: Le passé composé exprime l’envoi antérieur de Moïse avec sa portée présente; le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; la translittération préserve le nom propre divin plutôt que de lui substituer un titre.
- issue: Sens collectif de אָדָם
  choice: êtres humains / humanité
  alternative: hommes
  rationale: Le passage évoque la condition commune à l’ensemble des humains, et non spécifiquement celle des hommes de sexe masculin.
- issue: Portée de פְּקֻדָּה dans ce contexte judiciaire
  choice: sort commun
  alternative: intervention / châtiment / destinée assignée
  rationale: Le terme peut évoquer une intervention, une assignation ou ce qui échoit à quelqu’un. « Sort commun » convient à l’opposition entre une mort ordinaire et le jugement extraordinaire annoncé, sans préciser abusivement qu’il s’agit déjà d’un châtiment.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conditionnelle reste claire; « alors » explicite naturellement le passage de la condition à la conclusion. La note préserve l’ambiguïté du couple nominal-verbal formé sur פקד.
