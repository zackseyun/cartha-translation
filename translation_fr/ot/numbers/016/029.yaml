revisions:
- from: Si ces hommes meurent comme tous les êtres humains et s’ils subissent le sort commun à toute l’humanité[a], alors Yahweh ne m’a pas envoyé.
  to: Si ces hommes meurent comme meurent tous les humains, et si ce qui arrive à tous les humains leur arrive, alors Yahweh ne m’a pas envoyé.
  rationale: La formulation révisée rend explicitement les deux membres parallèles de la condition et conserve dans le corps du texte la répétition que le texte hébreu produit avec פקד. Elle n’interprète pas d’avance la « visitation » comme un châtiment ou une destinée fixée. La note maintient une alternative plus formelle et explique la polysémie pertinente.
