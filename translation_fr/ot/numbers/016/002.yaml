  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: fr
  text: Ils se levèrent devant Moïse avec deux cent cinquante hommes parmi les fils d’Israël[a], chefs de la communauté, convoqués à l’assemblée[b] et hommes de renom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les Israélites ». L’hébreu dit littéralement « parmi les fils d’Israël », désignation collective traditionnelle du peuple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « convoqués à la réunion ». L’expression hébraïque peut désigner des hommes officiellement appelés à participer à la réunion fixée de la communauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Ils se levèrent
  rationale: Le verbe קום décrit le fait de se lever et de passer à l’action. Cette formulation reste neutre et laisse le contexte exprimer l’opposition sans l’introduire directement dans le verbe.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend directement la relation spatiale « devant, en présence de ». Une nuance de confrontation est possible dans le contexte, mais ne doit pas être imposée lexicalement.
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל חֲמִשִּׁים וּמָאתָיִם
  choice: avec deux cent cinquante hommes d’entre les fils d’Israël
  rationale: La syntaxe hébraïque est elliptique. « Avec » relie naturellement ces hommes au sujet pluriel du verbe, tandis que « d’entre » exprime leur provenance au sein d’Israël.
- source_word: נְשִׂיאֵי עֵדָה
  choice: chefs de la communauté
  rationale: נָשִׂיא désigne ici des dirigeants reconnus, et עֵדָה la communauté constituée d’Israël. « Chefs » conserve le statut officiel sans employer un vocabulaire archaïque.
- source_word: קְרִאֵי מוֹעֵד
  choice: convoqués à l’assemblée
  rationale: La formule peut désigner ceux qui sont officiellement appelés à la réunion communautaire fixée. La traduction conserve à la fois l’idée de convocation et le cadre institutionnel.
- source_word: אַנְשֵׁי שֵׁם
  choice: hommes de renom
  rationale: Expression idiomatique désignant des hommes connus, distingués ou réputés. « Hommes de renom » en conserve la force et la dignité.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La formulation conserve les désignations collectives et institutionnelles de l’hébreu, tout en évitant d’expliciter dans le verbe une rébellion que le contexte, plutôt que le lexème lui-même, fait comprendre.
