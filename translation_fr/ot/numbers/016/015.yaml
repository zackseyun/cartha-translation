revisions:
- from: 'Moïse entra dans une grande colère et dit à Yahweh : « Ne porte pas attention à leur offrande.[a] Je ne leur ai pas pris un seul âne et je n’ai fait de mal à aucun d’eux. »'
  to: 'Moïse se mit très en colère et dit à Yahweh : « N’aie pas égard à leur offrande.[a] Je ne leur ai pas pris un seul âne et je n’ai fait de mal à aucun d’eux. »'
  rationale: 'La révision améliore la précision idiomatique sans modifier le sens : elle rend plus directement l’intensité de la colère de Moïse et exprime, pour l’offrande, le refus d’un égard favorable. La note maintient la formulation littérale et les possibilités interprétatives pertinentes.'
