  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: fr
  text: 'Moïse se mit très en colère et dit à Yahweh : « N’aie pas égard à leur offrande.[a] Je ne leur ai pas pris un seul âne et je n’ai fait de mal à aucun d’eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ne te tourne pas vers leur offrande. » On peut aussi comprendre : « Ne considère pas leur offrande » ou « N’accepte pas leur offrande. »'
    reason: Préserver la métaphore hébraïque de פנה אל et l’ambiguïté entre attention favorable et acceptation.
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: Moïse entra dans une grande colère
  rationale: L’expression idiomatique avec חרה décrit une colère qui s’enflamme; cette formulation française naturelle conserve l’intensité de מְאֹד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Ne porte pas attention à leur offrande
  rationale: פנה אל signifie littéralement « se tourner vers », mais peut exprimer ici le fait d’accorder une attention favorable. La formulation retenue est naturelle tout en laissant la note préserver l’image hébraïque et la possibilité du sens « accepter ».
- source_word: מִנְחָתָם
  choice: leur offrande
  rationale: מִנְחָה peut désigner un don, un tribut ou une offrande. « Offrande » convient au contexte sans préciser indûment qu’il s’agit d’une offrande de céréales.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: Je ne leur ai pas pris un seul âne
  rationale: נשא avec ce complément exprime ici l’action de prendre ou de s’approprier quelque chose; le français conserve l’image concrète et la négation de toute exploitation.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: je n’ai fait de mal à aucun d’eux
  rationale: Le hifil de רעע signifie faire du mal ou causer un tort. Cette traduction est directe, naturelle et conserve la portée individuelle de אֶחָד.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel sans lui substituer un titre.
- issue: Portée de la demande concernant l’offrande
  choice: Ne porte pas attention à leur offrande
  alternative: N’accepte pas leur offrande
  rationale: Le verbe פנה n’énonce pas explicitement l’acceptation cultuelle, même si celle-ci peut être impliquée. Le texte principal conserve une formulation moins interprétative et la note signale les autres lectures possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste concise; « entra dans une grande colère » rend l’idiome hébraïque sans calque obscur. Le nom Yahweh est conservé.
