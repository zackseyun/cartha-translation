  source_fidelity: Le texte rend fidèlement l’impératif adressé à Moïse (« Parle »), l’assemblée (« la communauté »), la formule introductive et l’ordre de s’éloigner de la zone entourant l’habitation de Coré, Datan et Abiram. Si הֵעָלוּ signifie littéralement « montez/montez loin », dans ce contexte l’injonction est clairement de se retirer des alentours; « Éloignez-vous » communique correctement cette valeur spatiale sans introduire d’interprétation doctrinale.
  naturalness: Français moderne, clair et d’un registre approprié. « Parle à la communauté et dis » est légèrement plus explicite que la construction hébraïque, mais demeure naturel et fidèle. « Des abords de la demeure » exprime idiomatiquement la zone concernée.
  terminology: « Communauté » convient pour הָעֵדָה. Les formes françaises « Coré », « Datan » et « Abiram » sont établies. « Demeure » rend convenablement מִשְׁכָּן ici, sans la confusion qu’entraînerait « tabernacle » dans un contexte où il s’agit de la résidence des rebelles.
