  text: דַּבֵּ֥ר אֶל הָ/עֵדָ֖ה לֵ/אמֹ֑ר הֵֽעָלוּ֙ מִ/סָּבִ֔יב לְ/מִשְׁכַּן קֹ֖רַח דָּתָ֥ן וַ/אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: fr
  text: 'Parle à la communauté et dis : « Éloignez-vous des abords de la demeure de Coré, Datan et Abiram. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: la communauté
  rationale: Dans les Nombres, le terme désigne l’ensemble du peuple réuni; « communauté » est naturel en français moderne et convient mieux ici que « congrégation ».
- source_word: הֵעָלוּ
  choice: Éloignez-vous
  rationale: La forme signifie littéralement « montez », mais, avec מִסָּבִיב, elle commande ici de se retirer des alentours. Une traduction strictement spatiale par « montez » serait obscure en français.
- source_word: מִסָּבִיב לְמִשְׁכַּן
  choice: des abords de la demeure
  rationale: L’expression indique qu’il faut quitter la zone entourant l’habitation. « Demeure » conserve le sens général de מִשְׁכָּן sans suggérer ici le sanctuaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. L’ordre est formulé au pluriel et la tournure introductive hébraïque « en disant » est rendue naturellement par « et dis ».
