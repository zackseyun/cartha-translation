  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: fr
  text: Est-ce peu de chose que tu nous aies fait monter d’un pays ruisselant de lait et de miel pour nous faire mourir dans le désert[a], et que tu t’imposes encore bel et bien en maître sur nous[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les interlocuteurs décrivent ironiquement l’Égypte comme « un pays ruisselant de lait et de miel », expression employée ailleurs pour le pays promis.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « nous dominer » ou « régner en maître sur nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Est-ce peu de chose
  rationale: Cette question rhétorique idiomatique exprime l’indignation tout en restant naturelle et digne en français.
- source_word: הֶעֱלִיתָנוּ
  choice: tu nous aies fait monter
  rationale: Le factitif du verbe עלה signifie « faire monter ». Cette formulation conserve le langage du mouvement associé à la sortie d’Égypte et l’ironie de l’accusation.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: d’un pays ruisselant de lait et de miel
  rationale: La locution hébraïque évoque l’abondance. Sa conservation littérale laisse apparaître l’ironie des rebelles, qui appliquent à l’Égypte une expression normalement associée au pays promis.
- source_word: לַהֲמִיתֵנוּ
  choice: pour nous faire mourir
  rationale: L’infinitif exprime ici le but attribué à Moïse. « Faire mourir » rend directement l’accusation sans l’atténuer.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans ce contexte, « désert » est le terme français courant et traditionnel pour l’espace inhabité où Israël séjourne, sans exiger qu’il s’agisse uniquement d’une étendue de sable.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: t’imposer en maître sur nous
  rationale: Le verbe exprime l’exercice de la domination ou du pouvoir. La tournure française rend aussi l’accusation d’auto-exaltation, tandis que « en maître » porte la force produite en hébreu par l’infinitif absolu joint au verbe conjugué.
- source_word: גַּם
  choice: en plus
  rationale: 'Cette expression introduit naturellement le grief supplémentaire : à l’accusation d’avoir conduit le peuple à la mort s’ajoute celle de vouloir le dominer.'
theological_decisions:
- issue: Désignation ironique de l’Égypte comme « pays ruisselant de lait et de miel »
  choice: Conserver littéralement l’expression dans le texte principal
  alternative: 'Expliciter le sarcasme, par exemple : « ce prétendu pays ruisselant de lait et de miel »'
  rationale: L’ironie ressort du contexte hébreu lui-même. L’expliciter dans le texte ajouterait une interprétation et affaiblirait la tension voulue par les paroles des rebelles.
- issue: Nature de l’accusation portée contre l’autorité de Moïse
  choice: « t’imposer en maître sur nous »
  alternative: « nous dominer » ou « régner sur nous »
  rationale: Cette formulation préserve à la fois l’idée d’exercice du pouvoir et l’accusation selon laquelle Moïse s’attribuerait lui-même cette position, sans trancher la légitimité théologique de son autorité.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à Moïse. La première question conserve la vigueur rhétorique de l’hébreu ; la seconde phrase rend clairement le grief additionnel marqué par גַּם, sans expliciter davantage que le texte source l’ironie ni la légitimité de l’autorité contestée.
