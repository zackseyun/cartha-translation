  terminology: « Pays ruisselant de lait et de miel », « désert » et « en maître sur nous » sont appropriés. La note sur l’ironie est exacte et utile. « Encore » rend ici l’ajout marqué par גַּם, tandis que « bel et bien » restitue, sans lourdeur, l’insistance de l’infinitif absolu.
