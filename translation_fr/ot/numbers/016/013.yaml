  rationale: La révision réunit les deux volets de la plainte dans l’unique question rhétorique du texte hébreu. Elle évite la nuance intentionnelle ajoutée par « Veux-tu » et rend l’insistance de תִשְׂתָּרֵר ... הִשְׂתָּרֵר par « t’imposes encore bel et bien en maître », sans imposer de jugement sur la légitimité de l’autorité de Moïse. Les ancres et le contenu des notes sont conservés.
