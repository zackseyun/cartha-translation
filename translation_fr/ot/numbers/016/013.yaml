  source_fidelity: 'Le sens essentiel est bien rendu : l’expression ironique appliquée à l’Égypte, le but accusateur (« pour nous faire mourir ») et le grief supplémentaire relatif à l’autorité de Moïse sont conservés. Toutefois, le texte hébreu articule ces deux griefs dans une seule interrogation rhétorique. La division en deux questions, avec « Veux-tu », introduit une nuance de volonté/intention qui est moins précise que l’accusation d’exercice effectif et intensifié du pouvoir exprimée par תִשְׂתָּרֵר ... הִשְׂתָּרֵר.'
