  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: fr
  text: 'Il parla à la communauté en disant : « Éloignez-vous, je vous prie, des tentes de ces hommes mauvais. Ne touchez à rien de ce qui leur appartient, de peur d’être emportés dans tous leurs péchés[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de peur d’être détruits à cause de tous leurs péchés ». La préposition hébraïque peut exprimer plus directement la cause.'
    reason: Alternative lexicale et syntaxique pour בְּכָל חַטֹּאתָם.
lexical_decisions:
- source_word: הָעֵדָה
  choice: la communauté
  rationale: עֵדָה désigne ici l’ensemble de la communauté israélite rassemblée. « La communauté » est naturel en français moderne et conserve la dimension collective.
- source_word: סוּרוּ נָא
  choice: Éloignez-vous, je vous prie
  rationale: L’impératif de סוּר demande de quitter les abords, tandis que נָא donne à l’ordre la forme d’un appel pressant. « Je vous prie » en restitue la nuance sans l’affaiblir.
- source_word: מֵעַל אָהֳלֵי
  choice: des tentes de
  rationale: Dans ce contexte, מֵעַל exprime l’éloignement hors du voisinage des tentes. Le français concis « s’éloigner des tentes » communique naturellement ce sens.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: ces hommes mauvais
  rationale: Le démonstratif identifie des hommes précis, et רְשָׁעִים porte ici un jugement moral. « Mauvais » est clair, actuel et moins archaïsant que « méchants » dans ce registre.
- source_word: וְאַל תִּגְּעוּ
  choice: Ne touchez à rien
  rationale: נגע signifie directement « toucher » ou « entrer en contact ». La formulation française reste brève et conserve l’interdiction explicite.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: à rien de ce qui leur appartient
  rationale: Après une interdiction, cette tournure française rend naturellement la totalité de leurs biens visée par l’expression hébraïque.
- source_word: פֶּן תִּסָּפוּ
  choice: de peur d’être emportés
  rationale: Le niphal de ספה évoque le fait d’être supprimé, détruit ou emporté dans un jugement. « Être emportés » conserve la voix passive et l’image d’un sort collectif imminent.
- source_word: בְּכָל חַטֹּאתָם
  choice: avec eux dans les conséquences de tous leurs péchés
  rationale: La préposition בְּ peut lier le sort annoncé aux péchés par association ou par cause. Cette formulation française rend intelligible le danger d’être pris dans le jugement lié à leurs péchés, sans affirmer que la communauté participe elle-même à ces péchés.
theological_decisions:
- issue: Participation au jugement par proximité avec les hommes mauvais
  choice: L’avertissement ordonne de se séparer des hommes et de leurs biens afin de ne pas être emporté avec eux dans les conséquences judiciaires liées à leurs péchés.
  alternative: « de peur d’être détruits à cause de tous leurs péchés » exprimerait plus directement une relation causale.
  rationale: Le texte hébreu relie étroitement la proximité, les péchés des rebelles et le jugement à venir, sans exposer ici une théorie complète de la culpabilité collective. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. L’appel « je vous prie » garde l’urgence polie de נָא. Le marqueur [a] est placé sur la proposition finale qu’il explique.
