source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: fr
  text: Coré, fils de Yitsehar, fils de Qehath, fils de Lévi, avec Dathan et Abiram, fils d’Éliab, ainsi qu’On, fils de Péleth — descendants de Ruben —, prit des hommes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il prit ». Le complément d’objet n’est pas exprimé en hébreu ; « des hommes » est ajouté d’après le contexte du verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit des hommes
  rationale: Le verbe signifie littéralement « prit », mais son complément n’est pas exprimé. « des hommes » est explicité d’après le verset suivant afin que l’ellipse soit intelligible en français, tout en étant signalée en note.
- source_word: קֹרַח בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: Coré, fils de Yitsehar, fils de Qehath, fils de Lévi
  rationale: La chaîne généalogique et la répétition de « fils de » sont conservées. Les noms suivent des formes françaises lisibles et proches de l’hébreu.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: avec Dathan et Abiram, fils d’Éliab
  rationale: « avec » rend leur association à Coré dans l’action; le pluriel « fils » s’applique à Dathan et Abiram.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: et On, fils de Péleth
  rationale: La formulation conserve simplement le nom et la filiation.
- source_word: בְּנֵי רְאוּבֵן
  choice: tous descendants de Ruben
  rationale: Ici, « fils de Ruben » désigne l’appartenance généalogique ou tribale. « descendants » évite de faire de Dathan, Abiram et On les fils immédiats de Ruben, et « tous » rend explicite la portée plurielle sur les personnages précédents.
theological_decisions:
- issue: Ellipse syntaxique du verbe initial
  choice: Expliciter le complément sous-entendu par « des hommes », avec une note
  alternative: Conserver « prit » sans complément, ou traduire de manière plus interprétative par « se souleva » ou « s’associa »
  rationale: Le texte hébreu ne nomme pas le complément du verbe. Le contexte immédiat du verset 2 permet de comprendre qu’il s’agit d’hommes, mais cette explicitation reste une décision de traduction et doit être signalée plutôt que présentée comme formellement exprimée.
- issue: Relation des autres hommes à l’action de Coré
  choice: Employer « avec » tout en gardant le verbe au singulier
  alternative: Faire de tous les noms un sujet composé et employer « prirent »
  rationale: Cette formulation préserve le singulier hébreu וַיִּקַּח et associe néanmoins Dathan, Abiram et On à l’action, sans transformer l’ouverture en une interprétation plus précise telle que « se liguèrent ».
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation détache la longue identification généalogique sans effacer sa structure. Les formes « Yitsehar » et « Qehath » restent proches de l’hébreu tout en étant prononçables en français.
