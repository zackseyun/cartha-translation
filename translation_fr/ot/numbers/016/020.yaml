reference: Numbers 16:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le waw consécutif fait progresser le récit, et le verbe דבר désigne ici l’acte de parler. « Parla » convient à la formule narrative française et le distingue de אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. La forme « Yahweh » le rend comme un nom propre plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: La préposition אֶל marque les deux destinataires. Sa répétition en hébreu est naturellement rendue par la coordination française « à Moïse et à Aaron ».
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction au discours direct, « en ces termes » est une tournure française naturelle qui annonce les paroles qui suivent sans ajouter de contenu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le caractère personnel du nom divin, tandis que « le SEIGNEUR » lui substituerait un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « en ces termes » évite le calque peu naturel « disant » tout en conservant la fonction introductive de לֵאמֹר.
