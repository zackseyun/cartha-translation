base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: fr
  text: 'Alors ils tombèrent face contre terre et dirent : « Ô Dieu, Dieu des esprits de toute chair[a], un seul homme pécherait-il, et t’irriterais-tu contre toute la communauté[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu du souffle de toute chair », expression qui souligne que Dieu donne la vie à tout être vivant.
    reason: lexical_alternative
  - marker: b
    text: '« Un seul homme » peut avoir ici une portée représentative : la supplication demande que le péché d’un individu n’attire pas la colère sur toute la communauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: ils tombèrent face contre terre
  rationale: Rend concrètement l’expression hébraïque de prosternation, d’effroi ou d’intercession dans un français naturel.
- source_word: אֵל אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Dieu, Dieu des esprits de toute chair
  rationale: Conserve la forme de l’invocation ainsi que l’expression anthropologique large; « esprits » convient au contexte où Dieu distingue la responsabilité de chacun.
- source_word: בָּשָׂר
  choice: chair
  rationale: Préserve l’expression biblique « toute chair » sans la réduire explicitement à « tous les humains ».
- source_word: הָאִישׁ אֶחָד
  choice: un seul homme
  rationale: Respecte le masculin singulier et l’insistance du numéral אֶחָד, tout en laissant ouverte sa portée représentative.
- source_word: יֶחֱטָא
  choice: pécherait-il
  rationale: Le conditionnel interrogatif exprime naturellement en français la protestation rhétorique sans surdéterminer la valeur verbale hébraïque.
- source_word: וְעַל כָּל־הָעֵדָה תִּקְצֹף
  choice: et t’irriterais-tu contre toute la communauté
  rationale: « S’irriter contre » rend l’objet de la colère marqué par עַל; « communauté » désigne naturellement l’assemblée d’Israël.
theological_decisions:
- issue: Sens anthropologique de « Dieu des esprits de toute chair »
  choice: Titre soulignant la connaissance et l’autorité de Dieu sur la vie intérieure de chaque être humain.
  alternative: Titre soulignant Dieu comme celui qui donne le souffle et la vie à tout être vivant.
  rationale: Le contexte appuie l’appel à la capacité divine de distinguer les culpabilités, mais le texte conserve assez d’ouverture pour que le sens de souffle vital demeure possible; celui-ci est donc signalé en note.
- issue: Portée de הָאִישׁ אֶחָד
  choice: un seul homme
  alternative: une seule personne
  rationale: La formulation masculine du texte est conservée. Sa possible fonction représentative est explicitée sans être imposée dans le corps du verset.
- issue: Colère divine contre l’ensemble de la communauté
  choice: Question rhétorique laissant entendre une supplication contre une sanction collective.
  alternative: Affirmation implicite selon laquelle toute sanction collective serait nécessairement injuste.
  rationale: La traduction maintient la tension du plaidoyer adressé à Dieu et n’en tire pas une doctrine générale qui dépasserait le verset.
translation_notes:
  register: Français international moderne, digne et accessible. L’expression biblique « toute chair » est maintenue, tandis que « face contre terre » et « communauté » assurent une lecture naturelle. Les deux marqueurs de note figurent dans le texte.
