  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: fr
  text: 'Moïse dit : « À ceci vous reconnaîtrez que Yahweh m’a envoyé pour accomplir tous ces actes[a], et que je n’agis pas de ma propre initiative[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ces œuvres » ou « toutes ces actions ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pas de mon cœur » ; expression qui signifie que Moïse n’agit pas de sa propre initiative ou de sa propre autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Moïse dit
  rationale: Le passé simple convient au récit biblique français et restitue naturellement le wayyiqtol sans ajouter une nuance temporelle ou logique absente du texte.
- source_word: בְּזֹאת
  choice: À ceci
  rationale: 'Cette expression française rend la valeur instrumentale et démonstrative de la préposition בְּ : l’événement annoncé servira de preuve.'
- source_word: תֵּדְעוּן
  choice: vous reconnaîtrez
  rationale: Le futur restitue l’imparfait hébreu en contexte. « Reconnaîtrez » exprime ici une connaissance acquise à partir d’un signe probant, sans expliciter davantage le mécanisme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé sous sa forme usuelle « Yahweh », plutôt que remplacé par un titre.
- source_word: שְׁלָחַנִי
  choice: m’a envoyé
  rationale: Le passé composé est naturel en français et souligne la pertinence présente de l’envoi antérieur de Moïse.
- source_word: לַעֲשׂוֹת
  choice: pour accomplir
  rationale: « Accomplir » convient à des actes mandatés et reste dans le champ large de עשה, tout en étant plus naturel ici que la répétition « faire tous ces actes ».
- source_word: אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: tous ces actes
  rationale: מַעֲשִׂים désigne ici des actions ou réalisations. « Actes » est concret, naturel et moins vague que « choses ».
- source_word: כִּי לֹא מִלִּבִּי
  choice: car je n’ai pas agi de ma propre initiative
  rationale: Le second כִּי est compris comme causal. L’idiome littéral « pas de mon cœur » indique que Moïse n’agit ni de son propre mouvement ni de sa propre autorité ; la formulation française en communique naturellement le sens.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom propre sans le transformer en titre.
- issue: Rapport logique introduit par le second כִּי
  choice: car
  alternative: et que
  rationale: 'Le second כִּי peut être entendu comme donnant la raison qui confirme la mission divine de Moïse : ces actes ne procèdent pas de sa propre initiative. « Car » garde cette lecture naturelle, tandis que la note sur l’hébreu permet de voir la concision et l’idiome de l’original.'
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple est maintenu pour la narration, tandis que le discours direct emploie des tournures courantes. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
