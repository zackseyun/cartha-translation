  text: And as soon as he had finished speaking all these words, the ground beneath them split open.
translation:
  language: fr
  text: Dès qu’il eut fini de prononcer toutes ces paroles, le sol se fendit sous eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ
  choice: Dès qu’il eut fini
  rationale: La construction temporelle avec כְּ peut exprimer l’immédiateté de la succession; cette formulation française naturelle conserve ici le lien direct entre la fin du discours et l’événement.
- source_word: לְדַבֵּר אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: de prononcer toutes ces paroles
  rationale: « Prononcer » convient à un discours solennel et rend naturellement דִּבֵּר avec דְּבָרִים sans la lourdeur de « parler toutes ces paroles ».
- source_word: וַתִּבָּקַע הָאֲדָמָה
  choice: le sol se fendit
  rationale: הָאֲדָמָה désigne ici la terre ou le sol; « le sol » est précis dans ce contexte, et « se fendit » rend la forme passive-réfléchie de בקע.
- source_word: אֲשֶׁר תַּחְתֵּיהֶם
  choice: sous eux
  rationale: La relative hébraïque signifie littéralement « qui était sous eux »; le français l’exprime avec concision sans perte de sens.
