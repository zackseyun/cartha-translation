base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: fr
  text: Coré rassembla toute la communauté contre eux à l’entrée de la tente de la rencontre, et la gloire de Yahweh[a] apparut à toute la communauté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement traduit par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son équivalent traditionnel.
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: rassembla
  rationale: Le hiphil de קהל exprime ici l’action causative de Coré, qui réunit la communauté; « rassembla » est naturel et conserve son rôle actif.
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: Dans le contexte de la révolte visant Moïse et Aaron, עַל a une valeur adversative; « contre eux » rend cette orientation hostile sans explicitation supplémentaire.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici la communauté d’Israël considérée comme un corps; « toute » rend כָּל.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: La formulation indique le lieu vers lequel la communauté est rassemblée. « À l’entrée » est idiomatique en français, et « tente de la rencontre » rend les éléments du syntagme hébreu.
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה est l’expression habituelle d’une manifestation visible; « apparut » reste concis et ne précise pas indûment sa modalité.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: כָּבוֹד désigne dans ce contexte la manifestation perceptible de la présence divine; le nom יהוה est conservé comme nom propre.
- source_word: אֶל כָּל הָעֵדָה
  choice: à toute la communauté
  rationale: La préposition marque les destinataires ou témoins de l’apparition; cette formulation française préserve cette relation sans trancher davantage entre apparition adressée et apparition devant eux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le Tétragramme. « Yahweh » conserve le nom propre, tandis qu’une note signale la traduction traditionnelle afin de servir les lecteurs qui la connaissent.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit. « Communauté » est plus courant que « congrégation » en français général. « Alors » explicite légèrement la progression narrative portée par le second wayyiqtol sans ajouter de lien causal.
