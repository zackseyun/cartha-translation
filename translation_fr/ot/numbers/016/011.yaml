source:
  edition: WLC
  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: fr
  text: C’est pourquoi, toi et toute ta communauté, vous qui vous êtes rassemblés contre Yahweh[a] — et Aaron, qu’est-il donc, pour que vous murmuriez contre lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh transcrit le nom divin יהוה (YHWH).
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Cette expression introduit naturellement en français la conclusion que Moïse tire de son accusation précédente et conserve la valeur déductive de l’hébreu.
- source_word: עֲדָתְךָ
  choice: toute ta communauté
  rationale: Dans ce contexte, le terme désigne le groupe réuni autour de Coré. « Communauté » est courant, digne et moins institutionnel que « congrégation ».
- source_word: הַנֹּעָדִים
  choice: vous qui vous êtes rassemblés
  rationale: Le participe nifal désigne ceux qui se sont réunis d’un commun accord. Cette formulation française rattache clairement le participe à Coré et à toute sa communauté sans préciser davantage leurs motifs.
- source_word: עַל
  choice: contre
  rationale: Le contexte de révolte donne ici à la préposition une valeur adversative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה et le distingue d’un titre comme « Seigneur ».
- source_word: וְאַהֲרֹן מַה הוּא
  choice: Et Aaron, qu’est-il donc
  rationale: La question rhétorique minimise l’importance personnelle d’Aaron et souligne que la révolte vise en définitive Yahweh. « Qu’est-il » conserve plus exactement la tournure hébraïque que « qui est-il ».
- source_word: תלונו
  choice: vous murmuriez
  rationale: Le verbe לון caractérise fréquemment les murmures contestataires d’Israël au désert. « Murmurer contre » reste compréhensible en français moderne et conserve la tonalité négative du contexte.
- source_word: עָלָיו
  choice: contre lui
  rationale: La préposition indique que les murmures sont dirigés contre Aaron, et non qu’ils portent simplement sur lui.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Cible véritable de la révolte
  choice: La communauté est présentée comme rassemblée contre Yahweh, tandis qu’Aaron est ensuite relativisé par une question rhétorique.
  alternative: Présenter Yahweh et Aaron comme deux cibles placées exactement sur le même plan.
  rationale: La syntaxe hébraïque affirme d’abord le rassemblement contre Yahweh, puis détache Aaron dans la question « qu’est-il ? ». La traduction préserve cette tension sans effacer le fait que les murmures sont aussi dirigés contre Aaron.
translation_notes:
  register: Français international moderne, digne et accessible. Les points de suspension rendent la rupture rhétorique entre l’accusation visant Yahweh et la question détachée concernant Aaron. Le tutoiement singulier (« toi ») adressé à Coré est suivi du pluriel (« vous »), qui inclut Coré et toute sa communauté, conformément à la syntaxe hébraïque.
