  text: וְ/אֵ֥שׁ יָצְאָ֖ה מֵ/אֵ֣ת יְהוָ֑ה וַ/תֹּ֗אכַל אֵ֣ת הַ/חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ מַקְרִיבֵ֖י הַ/קְּטֹֽרֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: fr
  text: Alors, un feu sortit d’auprès de Yahweh et dévora les deux cent cinquante hommes qui présentaient l’encens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: Alors un feu
  rationale: אֵשׁ signifie « feu ». L’article indéfini est naturel en français; וְ marque ici la succession narrative, rendue par « Alors ».
- source_word: יָצְאָה
  choice: jaillit
  rationale: Le verbe יצא exprime une sortie. Avec le feu pour sujet, « jaillit » traduit naturellement son surgissement soudain tout en conservant l’idée de provenance.
- source_word: מֵ/אֵת יְהוָה
  choice: de devant Yahweh
  rationale: מֵאֵת peut désigner ce qui vient d’auprès ou de devant quelqu’un. « De devant Yahweh » conserve ici la formulation spatiale et cultuelle du texte hébreu sans la réduire au simple agent causal.
- source_word: וַ/תֹּאכַל
  choice: et dévora
  rationale: אכל signifie littéralement « manger »; lorsque le feu en est le sujet, « dévorer » est une expression française naturelle qui préserve la force concrète de l’image.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: les deux cent cinquante hommes
  rationale: La tournure désigne un groupe compté de 250 hommes. Selon l’usage français, « cent » reste invariable puisqu’il est suivi d’un autre nombre.
- source_word: מַקְרִיבֵי
  choice: qui présentaient
  rationale: Le participe de קרב décrit les hommes par l’action cultuelle qu’ils accomplissaient. « Présentaient » rend le sens d’apporter ou de présenter une offrande sans ajouter un complément absent.
- source_word: הַ/קְּטֹרֶת
  choice: l’encens
  rationale: קְטֹרֶת désigne l’encens cultuel précis de cet épisode; l’article défini français correspond à la référence déterminée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de מֵאֵת devant le nom divin
  choice: de devant Yahweh
  alternative: de Yahweh
  rationale: La formulation retenue préserve la nuance possible d’un feu sortant de la présence de Yahweh; la solution plus idiomatique « de Yahweh » exprimerait surtout la source ou l’agent.
translation_notes:
  register: Français international moderne, narratif et digne. « Jaillit » et « dévora » donnent à la scène sa force sans archaïsme; la tournure plus formelle « de devant Yahweh » conserve une nuance réelle de l’hébreu et est explicitée par la note.
