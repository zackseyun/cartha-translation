  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּפֹּ֖ל עַל פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: fr
  text: Quand Moïse entendit cela, il tomba face contre terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit cela
  rationale: Dans cette séquence narrative, שׁמע signifie naturellement « entendre ». Le démonstratif « cela » explicite sobrement l’objet sous-entendu, à savoir les paroles rapportées au verset précédent.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu מֹשֶׁה.
- source_word: וַיִּפֹּל
  choice: tomba
  rationale: נפל signifie littéralement « tomber ». Ce choix conserve l’action concrète sans préciser si elle exprime la prière, l’humilité, le chagrin ou l’intercession.
- source_word: עַל פָּנָיו
  choice: face contre terre
  rationale: Cette expression française naturelle rend l’image de l’idiome hébreu « sur son visage » et indique clairement une posture de prosternation sans en imposer l’interprétation.
theological_decisions:
- issue: Portée interprétative de la posture de Moïse
  choice: Décrire simplement l’action par « il tomba face contre terre ».
  alternative: « il se prosterna pour prier » ou « il tomba face contre terre, accablé »
  rationale: L’hébreu décrit la posture sans expliquer explicitement sa signification. La traduction préserve donc l’ambiguïté entre prière, humilité, détresse et intercession.
translation_notes:
  register: Français international moderne, sobre et digne. « Face contre terre » est idiomatique et immédiatement compréhensible, tout en restant proche de l’image hébraïque.
