  source_fidelity: 'Le sens principal est bien rendu : le peuple se retire de la zone entourant la demeure associée à Coré, Datan et Abiram, puis Datan et Abiram paraissent à l’entrée de leurs tentes avec leurs familles. Une légère révision rend plus explicitement la posture exprimée par נִצָּבִים (« se tinrent debout ») et corrige la formulation trop hybride de la note sur le verbe « monter ».'
  naturalness: Le français est naturel et de registre approprié. « Se tinrent debout » est un peu plus précis que « se tinrent » sans être lourd. La note existante, en revanche, n’est pas idiomatique avec « montèrent donc en s’éloignant des alentours ».
  terminology: « Demeure » convient pour מִשְׁכָּן dans ce contexte et évite de confondre ce lieu avec le tabernacle. « Fils » et « jeunes enfants » préservent utilement la distinction entre בָּנִים et טַף. Les formes françaises traditionnelles Coré, Datan et Abiram sont cohérentes.
  issues:
