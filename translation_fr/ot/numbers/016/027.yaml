    issue: La posture de Datan et Abiram est seulement implicite dans « se tinrent ».
    rationale: Le participe נִצָּבִים indique qu’ils étaient debout/placés à l’entrée. « Se tinrent debout » le rend explicitement sans ajouter une interprétation de défi.
