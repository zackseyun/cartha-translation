  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: fr
  text: Ils s’éloignèrent donc des alentours de la demeure[b] de Coré, de Datan et d’Abiram[a]. Datan et Abiram sortirent et se tinrent debout à l’entrée de leurs tentes, avec leurs femmes, leurs fils et leurs jeunes enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils montèrent de tout autour de la demeure de Coré, de Datan et d’Abiram. » Le verbe hébreu signifie littéralement « monter », mais il semble ici désigner le fait de quitter les lieux et de s’en éloigner.'
    reason: lexical_alternative
  - marker: b
    text: « Demeure » rend ici le terme hébreu mishkan, qui désigne le lieu d’habitation ou de campement associé à Coré, Datan et Abiram, et non le tabernacle du SEIGNEUR.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: Ils s’éloignèrent donc des alentours de
  rationale: Le verbe signifie littéralement « monter », mais, associé à מֵעַל et מִסָּבִיב dans ce contexte, il exprime vraisemblablement l’éloignement hors de la zone environnante. Cette formulation française rend naturellement le mouvement sans imposer une montée physique.
- source_word: מִשְׁכַּן
  choice: demeure
  rationale: Le terme désigne ici le lieu d’habitation ou de campement associé aux trois hommes, et non le sanctuaire du SEIGNEUR. « Demeure » conserve le sens concret tout en évitant la confusion avec le tabernacle.
- source_word: יָצְאוּ נִצָּבִים
  choice: sortirent et se tinrent
  rationale: La construction décrit Datan et Abiram sortant puis se tenant debout à l’entrée. « Se tinrent » préserve la posture sans ajouter explicitement une nuance de défi.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: à l’entrée de leurs tentes
  rationale: Rend directement l’ouverture des tentes et maintient le pluriel hébreu.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: avec leurs femmes, leurs fils et leurs jeunes enfants
  rationale: « Fils » maintient la distinction entre בנים et טף, ce dernier désignant les petits enfants ou jeunes personnes à charge. « Jeunes enfants » est clair et naturel en français moderne.
