    rationale: Le texte hébreu emploie littéralement « montèrent », mais la note doit présenter cette possibilité sans combiner artificiellement le mouvement vertical et l’interprétation contextuelle d’éloignement.
  - severity: low
    issue: L’absence d’une note sur « demeure » peut laisser entendre à tort qu’il s’agit du tabernacle.
    rationale: מִשְׁכָּן désigne ici la demeure ou le lieu de campement lié aux rebelles, non le sanctuaire de YHWH. Une note brève apporte cette clarification contextuelle.
