  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: fr
  text: Alors Moïse se leva et alla trouver Datan et Abiram, et les anciens d’Israël marchèrent derrière lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום au wayyiqtol introduit l’action suivante du récit. « Se leva » est naturel et conserve l’idée que Moïse se met en mouvement pour agir.
- source_word: וַיֵּלֶךְ אֶל
  choice: alla trouver
  rationale: הלך avec אֶל exprime ici un déplacement vers des personnes. « Alla trouver » est idiomatique en français et indique la destination sans préciser indûment la manière du déplacement.
- source_word: דָּתָן וַאֲבִירָם
  choice: Datan et Abiram
  rationale: Les noms propres sont transcrits selon les conventions françaises courantes.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: marchèrent derrière lui
  rationale: Cette formulation garde distincts le verbe הלך et l’expression אַחֲרָיו, tout en exprimant naturellement que les anciens avancent à la suite de Moïse.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Expression française traditionnelle et transparente pour désigner les responsables reconnus d’Israël.
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif fait progresser la séquence. « Alors » rend clairement cet enchaînement en français moderne.
