  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: fr
  text: Chacun prit son encensoir[a] ; ils y mirent du feu et y déposèrent de l’encens. Puis ils se tinrent à l’entrée de la tente de la rencontre, avec Moïse et Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pelle à braises ». Le terme hébreu désigne un récipient servant à transporter des braises et à offrir de l’encens.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: Chacun prit donc sa pelle à braises
  rationale: 'אִישׁ est distributif ici : chacun des hommes prend son propre récipient. מַחְתָּה désigne un ustensile servant à transporter des braises pour brûler l’encens. « Pelle à braises » est concret et compréhensible; « encensoir » demeure une traduction traditionnelle possible, signalée en note.'
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: Ils y mirent du feu
  rationale: עַל signifie littéralement « sur », mais avec ces récipients, le français idiomatique emploie « y mettre du feu ». Le pronom « y » reprend les pelles à braises.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: puis déposèrent de l’encens dessus
  rationale: '« Déposèrent » exprime naturellement le geste rituel, tandis que « dessus » conserve la relation spatiale de עַל : l’encens est placé sur les braises contenues dans les récipients.'
- source_word: קְטֹרֶת
  choice: encens
  rationale: Terme français courant et consacré pour la substance aromatique brûlée dans le culte.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. « Tente de la rencontre » rend אֹהֶל מוֹעֵד de façon transparente et naturelle, sans réduire מוֹעֵד à la seule idée d’assemblée.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: avec Moïse et Aaron
  rationale: Après l’indication de lieu et sans nouveau verbe, la coordination indique naturellement que Moïse et Aaron se tenaient eux aussi à cet endroit; « avec » rend clairement cet accompagnement en français.
