revisions:
- from: Chacun prit donc sa pelle à braises[a]. Ils y mirent du feu, puis déposèrent de l’encens dessus. Ils se tinrent à l’entrée de la tente de la rencontre, avec Moïse et Aaron.
  to: Chacun prit son encensoir[a] ; ils y mirent du feu et y déposèrent de l’encens. Puis ils se tinrent à l’entrée de la tente de la rencontre, avec Moïse et Aaron.
  rationale: La révision retire l’inférence ajoutée par « donc » et adopte « encensoir » comme rendu principal de l’ustensile rituel. Elle préserve la progression narrative, le caractère distributif et le rapport fonctionnel entre le récipient, le feu et l’encens, sans surinterpréter la syntaxe finale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:48:42Z'
review_pass:
  verdict: revise
  source_fidelity: La séquence des actions, la valeur distributive de « chacun », l’encens, le lieu et la présence de Moïse et d’Aaron sont bien rendus. Toutefois, « donc » introduit une inférence absente de l’hébreu. « Pelle à braises » peut désigner une pelle plate et ne rend pas aussi précisément, dans ce contexte rituel, le récipient appelé מַחְתָּה.
  naturalness: Le français est globalement clair et moderne. « Encensoir » est plus idiomatique et plus immédiatement intelligible dans le cadre cultuel que « pelle à braises ». La reprise par « y » donne une formulation fluide sans forcer la préposition hébraïque littérale « sur ».
  terminology: « Encensoir », « encens » et « tente de la rencontre » conviennent au registre biblique moderne. La note conserve l’alternative concrète « pelle à braises » et explique la fonction de l’objet.
  issues:
  - severity: medium
    issue: « donc » n’a pas d’équivalent explicite dans le texte source.
    rationale: Le waw narratif ouvre simplement la suite du récit; « donc » suggère une conséquence logique qui n’est pas exprimée.
  - severity: medium
    issue: « pelle à braises » est un choix lexical potentiellement imprécis comme terme principal.
    rationale: En français courant, une pelle évoque volontiers un outil plat; מַחְתָּה est ici le récipient rituel qui reçoit le feu et l’encens. « Encensoir » est plus précis dans ce contexte, tandis que « pelle à braises » peut être conservé en alternative.
  revised_text: Chacun prit son encensoir[a] ; ils y mirent du feu et y déposèrent de l’encens. Puis ils se tinrent à l’entrée de la tente de la rencontre, avec Moïse et Aaron.
  revised_footnotes:
  - marker: a
    text: Ou « pelle à braises ». Le terme hébreu désigne un récipient servant à transporter des braises et à offrir de l’encens.
    reason: lexical_alternative
  revision_rationale: La révision retire l’inférence ajoutée par « donc » et adopte « encensoir » comme rendu principal de l’ustensile rituel. Elle préserve la progression narrative, le caractère distributif et le rapport fonctionnel entre le récipient, le feu et l’encens, sans surinterpréter la syntaxe finale.
