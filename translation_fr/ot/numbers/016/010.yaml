  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: fr
  text: Il t’a fait approcher, toi et, avec toi, tous tes frères, les fils de Lévi ; et vous recherchez aussi la prêtrise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Il t’a fait approcher
  rationale: Le hifil de קרב exprime le fait de faire approcher ou d’accorder l’accès. Cette formulation conserve à la fois l’image spatiale et la dimension de privilège cultuel, sans ajouter un complément absent de l’hébreu.
- source_word: אֹתְךָ
  choice: toi
  rationale: Pronom objet masculin singulier, désignant Coré personnellement.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: toi et tous tes frères, les fils de Lévi
  rationale: « Tes frères » est conservé, tandis que « les fils de Lévi » rend l’apposition généalogique explicite de l’hébreu.
- source_word: אִתָּךְ
  choice: avec toi
  rationale: La formulation reprend littéralement l’idée que les autres descendants de Lévi ont été admis avec Coré, malgré la répétition rhétorique de « toi ».
- source_word: וּבִקַּשְׁתֶּם
  choice: et vous recherchez
  rationale: Le verbe est au pluriel et vise Coré avec son groupe. Le présent français exprime naturellement leur aspiration actuelle. La conjonction « et » préserve la coordination hébraïque sans imposer une valeur adversative, que le contexte rend déjà perceptible.
- source_word: גַּם
  choice: aussi
  rationale: 'Marque l’addition : ils veulent la prêtrise en plus du privilège déjà reçu.'
- source_word: כְּהֻנָּה
  choice: la prêtrise
  rationale: Désigne ici la condition ou la fonction sacerdotale distincte du service confié aux autres Lévites.
theological_decisions:
- issue: Distinction cultuelle entre les Lévites et les prêtres
  choice: la prêtrise
  alternative: la fonction sacerdotale
  rationale: « La prêtrise » maintient la distinction institutionnelle centrale du passage entre le service lévitique déjà accordé et le statut sacerdotal revendiqué, sans réduire le terme à une simple activité.
translation_notes:
  register: Français international moderne, digne et direct. La répétition « toi … avec toi » est maintenue parce qu’elle reflète l’insistance de l’hébreu. Le point d’exclamation restitue la force de la question-reproche implicite dans le contexte.
