  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : la question rhétorique, la séparation d’avec la communauté d’Israël, le rapprochement auprès de Dieu, le service du tabernacle et le service envers la communauté sont tous conservés. Une légère révision améliore la représentation de la coordination des infinitifs et du suffixe pluriel final.'
