  terminology: « communauté », « tabernacle » et « Yahweh » conviennent. « Accomplir le service » est idiomatique sans chercher à reproduire artificiellement le cognat hébreu. Le pronom final « les » rend plus explicitement le pluriel de לְשָׁרְתָם.
