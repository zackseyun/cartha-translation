  - severity: low
    issue: Pronom singulier à la fin
    rationale: « la servir » peut traiter « communauté » comme un collectif, mais le suffixe hébreu est pluriel et vise les membres de l’assemblée. « les servir » conserve cette référence sans ambiguïté notable.
