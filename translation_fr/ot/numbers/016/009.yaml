  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: fr
  text: Est-ce trop peu pour vous que le Dieu d’Israël vous ait séparés de la communauté d’Israël[a], pour vous faire approcher de lui, pour accomplir le service du tabernacle de Yahweh et pour vous tenir devant la communauté afin de les servir ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « N’est-ce pas assez pour vous que le Dieu d’Israël vous ait séparés de la communauté d’Israël… ? » L’expression hébraïque peut être rendue soit par « Est-ce trop peu… ? », soit, de manière plus dynamique, par « N’est-ce pas assez… ? ».'
    reason: Alternative idiomatique pour הַמְעַט.
lexical_decisions:
- source_word: הַמְעַט
  choice: Est-ce trop peu pour vous
  rationale: 'Cette tournure conserve la force de la question rhétorique : le privilège accordé ne doit pas être tenu pour insignifiant. La formulation française reste naturelle tout en gardant l’image quantitative de l’hébreu.'
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de la question rhétorique, plutôt qu’une proposition causale indépendante.
- source_word: הִבְדִּיל
  choice: ait séparés
  rationale: Le hiphil de בדל exprime l’action de séparer. « Séparés de » reproduit directement la relation syntaxique avec la communauté d’Israël sans ajouter explicitement une consécration cultuelle.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: la communauté d’Israël
  rationale: עֵדָה désigne ici le corps collectif d’Israël. « Communauté » est courant et inclusif en français moderne, tandis que « assemblée » pourrait suggérer plus étroitement une réunion ponctuelle.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: pour vous faire approcher de lui
  rationale: Le hiphil de קרב signifie faire venir ou approcher. Cette traduction maintient la nuance relationnelle et cultuelle sans présenter les lévites comme des offrandes.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: afin que vous accomplissiez le service du tabernacle de Yahweh
  rationale: La combinaison du verbe עבד et du nom עֲבֹדָה souligne le service assigné. En français, « accomplir le service » transmet cette idée sans la lourdeur de « servir le service ».
- source_word: מִשְׁכַּן
  choice: tabernacle
  rationale: Dans ce contexte du sanctuaire au désert, « tabernacle » est le terme français biblique établi et précis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, ce qui préserve sa fonction de nom propre dans le texte hébreu.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: et que vous vous teniez devant la communauté
  rationale: La formulation conserve l’idée concrète et officielle de se tenir devant le peuple assemblé.
- source_word: לְשָׁרְתָם
  choice: pour la servir
  rationale: שרת désigne un service d’assistance ou de ministère. « Servir » est ici clair et naturel; le pronom hébreu pluriel renvoie collectivement aux membres de la communauté, rendue en français par le singulier collectif « la ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement, tandis que « l’Éternel » substituerait un titre traditionnel.
- issue: Nature de la mise à part des lévites
  choice: vous ait séparés de la communauté d’Israël
  alternative: vous ait mis à part au sein de la communauté d’Israël
  rationale: La construction מֵעֲדַת indique littéralement une séparation d’avec la communauté. La traduction conserve cette expression forte sans nier que les lévites restent eux-mêmes Israélites.
- issue: Bénéficiaires du service lévitique
  choice: pour la servir
  alternative: pour officier pour elle
  rationale: Le suffixe de לְשָׁרְתָם renvoie explicitement aux membres de la communauté. La traduction garde ce bénéficiaire humain sans limiter le service à une fonction liturgique plus précisément définie.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la longue progression rhétorique de l’hébreu, mais emploie « accomplir le service » pour éviter une répétition artificielle. « Communauté » est maintenu pour les deux occurrences de עֵדָה, et le nom divin est rendu par « Yahweh ».
