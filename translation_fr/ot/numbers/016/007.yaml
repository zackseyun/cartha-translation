  terminology: « Yahweh » reproduit systématiquement le tétragramme conformément au dossier. « Fils de Lévi » maintient l’adresse littérale, et « Vous allez trop loin » rend avec justesse la force polémique de רַב לָכֶם. La note fournit utilement l’alternative plus proche de la formulation quantitative sans imposer une lecture doctrinale.
