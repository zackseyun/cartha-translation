  variant: modern international French
source:
  edition: WLC
  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: fr
  text: Mettez-y du feu et déposez dessus de l’encens devant Yahweh, demain. Alors, l’homme que Yahweh choisira, c’est lui qui est saint. Vous allez trop loin, fils de Lévi ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’en est trop pour vous, fils de Lévi ! »'
    reason: Alternative plus littérale pour רַב לָכֶם, dont la formulation peut exprimer soit l’excès commis, soit ce qui est “trop” pour les destinataires.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: Mettez-y du feu
  rationale: נתן avec ב et les encensoirs sous-entendus signifie naturellement mettre du feu en eux ; la tournure pronominale française reprend clairement ces récipients.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: et déposez dessus de l’encens
  rationale: שים avec עַל exprime le fait de placer l’encens sur le feu, dans les encensoirs ; « déposez dessus » conserve la relation spatiale sans lourdeur excessive.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend directement l’idiome cultuel signifiant en présence de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme, qui préserve le nom divin présent dans le texte hébreu.
- source_word: מָחָר
  choice: demain
  rationale: Équivalent temporel direct.
- source_word: וְהָיָה
  choice: Alors
  rationale: Introduit naturellement en français le résultat de l’épreuve prescrite.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Conserve le masculin singulier et la formulation représentative du texte source.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: que Yahweh choisira
  rationale: Le futur français exprime clairement l’action attendue lors de l’épreuve du lendemain.
- source_word: הוּא הַקָּדוֹשׁ
  choice: c’est lui qui est saint
  rationale: La construction emphatique rend הוּא et maintient l’idée de la personne reconnue comme sainte, tout en restant plus naturelle que « il est le saint » en français courant.
- source_word: רַב לָכֶם
  choice: Vous allez trop loin
  rationale: Rend la force contextuelle de la réprimande selon laquelle les interlocuteurs dépassent les limites, tout en signalant en note l’expression plus littérale.
- source_word: בְּנֵי לֵוִי
  choice: fils de Lévi
  rationale: Préserve l’adresse familiale littérale et la texture hébraïque plutôt que de généraliser en « Lévites ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens de רַב לָכֶם dans la réprimande de Moïse
  choice: Vous allez trop loin
  alternative: C’en est trop pour vous
  rationale: Le contexte favorise une accusation d’outrepasser ses limites, mais l’ambiguïté de la formule quantitative hébraïque est conservée dans la note.
- issue: Valeur de הוּא הַקָּדוֹשׁ
  choice: c’est lui qui est saint
  alternative: c’est lui, le saint ; il sera le consacré
  rationale: Le présent et l’accent emphatique sont conservés sans transformer explicitement la sainteté en ordination sacerdotale ni résoudre davantage la portée du substantif adjectival.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs pluriels et l’adresse « fils de Lévi » conservent la solennité du discours. La répétition de Yahweh suit le texte hébreu ; aucune précision doctrinale absente de la source n’est ajoutée.
