revisions:
- from: Bien plus, tu ne nous as pas conduits dans un pays ruisselant de lait et de miel, et tu ne nous as pas donné en héritage des champs et des vignes. Vas-tu crever les yeux de ces hommes[a] ? Nous ne monterons pas.
  to: Tu ne nous as même pas amenés dans un pays ruisselant de lait et de miel, ni ne nous as donné en héritage des champs et des vignes. Vas-tu crever les yeux de ces hommes-là[a] ? Nous ne monterons pas.
  rationale: La révision remplace « Bien plus » par l’intensif français naturel « même pas », coordonne les deux griefs avec « ni », et choisit « amenés » pour rendre plus directement הֲבִיאֹתָנוּ. Elle maintient l’image brutale du texte source et reformule la note de manière non interprétative, en préservant l’ambiguïté de l’expression.
