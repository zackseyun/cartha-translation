  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: fr
  text: Tu ne nous as même pas amenés dans un pays ruisselant de lait et de miel, ni ne nous as donné en héritage des champs et des vignes. Vas-tu crever les yeux de ces hommes-là[a] ? Nous ne monterons pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vas-tu aveugler ces hommes-là ? » L’expression hébraïque signifie littéralement « crever les yeux » ; elle peut aussi avoir une portée figurée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: Bien plus, ... ne ... pas
  rationale: אַף renforce ici le reproche tout en ajoutant un grief. « Bien plus » exprime naturellement cette progression emphatique sans transformer la proposition en question.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: dans un pays ruisselant de lait et de miel
  rationale: Cette formule hébraïque décrit l’abondance du pays promis. « Ruisselant » conserve l’image vive de זָבַת et appartient au registre biblique français courant.
- source_word: הֲבִיאֹתָנוּ
  choice: tu ne nous as pas conduits
  rationale: Dans ce reproche, la forme se comprend avec la négation précédente. « Conduits » rend idiomatiquement le fait de mener un peuple jusqu’à un pays, sans ajouter l’idée d’une entrée effectivement accomplie.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: et tu ne nous as pas donné en héritage des champs et des vignes
  rationale: נַחֲלָה désigne un bien attribué comme possession ou héritage. Les pluriels français rendent naturellement la valeur collective des singuliers hébreux « champ et vigne ».
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: Vas-tu crever les yeux de ces hommes ?
  rationale: Le piel de נקר évoque concrètement l’action de crever ou d’arracher les yeux. La traduction conserve cette image violente tout en signalant en note sa possible portée figurée.
- source_word: לֹא נַעֲלֶה
  choice: Nous ne monterons pas
  rationale: עלה signifie littéralement « monter ». La formulation garde le mouvement spatial et le refus catégorique de répondre à la convocation de Moïse.
