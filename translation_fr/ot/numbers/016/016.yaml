  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: fr
  text: 'Moïse dit à Coré : « Toi et toute ta communauté, présentez-vous[a] demain devant Yahweh — toi, eux et Aaron[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « soyez devant Yahweh », c’est-à-dire en sa présence.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu énumère expressément les parties appelées à comparaître : « toi, eux et Aaron ».'
    reason: clarification
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל־קֹרַח
  choice: Moïse dit à Coré
  rationale: Le passé simple convient au récit suivi en français et rend naturellement la forme narrative hébraïque sans ajouter de nuance temporelle particulière.
- source_word: אַתָּה וְכָל־עֲדָתְךָ
  choice: Toi et toute ta communauté
  rationale: עֵדָה désigne ici le groupe rassemblé autour de Coré. « Communauté » est actuel et garde la dimension collective sans suggérer nécessairement une assemblée cultuelle officielle.
- source_word: הֱיוּ לִפְנֵי יְהוָה
  choice: présentez-vous devant Yahweh
  rationale: Littéralement, l’hébreu demande d’« être devant » Yahweh. Dans ce contexte de comparution, « présentez-vous devant » exprime naturellement l’ordre en français tout en conservant l’idée de présence face à Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à sa forme personnelle dans le texte hébreu.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: toi, eux et Aaron
  rationale: La reprise explicite des trois parties est conservée afin de respecter l’insistance et la structure du texte hébreu.
- source_word: מָחָר
  choice: demain
  rationale: Équivalent direct et naturel de l’adverbe temporel hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme tel, sans le remplacer par un titre.
- issue: Sens de la comparution devant Yahweh
  choice: présentez-vous devant Yahweh
  alternative: soyez en présence de Yahweh
  rationale: La formulation choisie rend l’impératif intelligible sans préciser indûment la nature exacte de la comparution. La note signale la formulation plus littérale.
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif « présentez-vous » est idiomatique, tandis que le tiret met en relief la reprise emphatique des personnes convoquées.
