source:
  edition: WLC
  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: fr
  text: Mais si Yahweh crée quelque chose de nouveau[a], que la terre ouvre sa bouche et les engloutisse, eux et tout ce qui leur appartient, et qu’ils descendent vivants au Shéol[b], alors vous saurez que ces hommes ont méprisé Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « crée une chose nouvelle » ou, littéralement, « crée une création ». L’hébreu emploie un nom et un verbe de même racine pour souligner le caractère extraordinaire de l’acte de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Le Shéol est le terme hébreu désignant le séjour des morts ; selon le contexte, on peut aussi traduire par « la tombe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: crée quelque chose de nouveau
  rationale: L’expression associe un nom et un verbe de même racine, littéralement « crée une création ». La formulation retenue exprime naturellement en français l’acte créateur extraordinaire annoncé, tandis que la note conserve la tournure hébraïque emphatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: le sol ouvre sa bouche
  rationale: « Le sol » convient à la terre située sous les rebelles, et l’image personnifiée de la bouche est conservée.
- source_word: וּבָלְעָה אֹתָם וְאֶת כָּל אֲשֶׁר לָהֶם
  choice: les engloutit, eux et tout ce qui leur appartient
  rationale: « Engloutir » rend bien l’action du sol qui avale, et la formulation garde la portée globale de ce qui est à eux sans la préciser indûment.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: ils descendent vivants au Shéol
  rationale: La traduction préserve le mouvement de descente, l’accent sur le fait qu’ils sont vivants et le terme hébreu désignant le séjour des morts.
- source_word: נִאֲצוּ
  choice: ont méprisé
  rationale: Le verbe exprime un rejet empreint de dédain ou de mépris; « ont méprisé » en conserve directement la force.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ces hommes
  rationale: Le syntagme hébreu est explicitement masculin pluriel et vise ici les hommes concernés.
theological_decisions:
- issue: Sens et traduction de שְׁאוֹל
  choice: Shéol
  alternative: le séjour des morts ; la tombe
  rationale: Le terme peut désigner plus largement le domaine des morts et non seulement une tombe. Sa translittération évite de réduire sa portée et une note fournit les principaux équivalents possibles.
- issue: Nature de l’acte annoncé par בְּרִיאָה יִבְרָא
  choice: Yahweh crée quelque chose de nouveau
  alternative: Yahweh crée une création ; Yahweh produit du jamais-vu
  rationale: La traduction garde l’action créatrice attribuée à Yahweh et sa nouveauté sans définir davantage la nature du miracle avant sa description dans la suite du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La structure conditionnelle est clarifiée par la reprise de « si » et par « alors », sans modifier la logique du texte. Les images concrètes du sol qui ouvre sa bouche et de la descente vivante sont conservées.
