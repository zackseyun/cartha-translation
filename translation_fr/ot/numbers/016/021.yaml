  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: fr
  text: Séparez-vous du milieu de cette communauté[a], afin que je les anéantisse en un instant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette assemblée ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en un moment ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: Séparez-vous
  rationale: L’impératif nifal pluriel de בדל demande aux destinataires de se mettre à part du groupe. « Séparez-vous » rend directement la valeur réfléchie et le mouvement de retrait.
- source_word: מִתּוֹךְ
  choice: du milieu de
  rationale: La construction exprime une séparation à partir de l’intérieur d’un groupe. « Du milieu de » en conserve la dimension spatiale.
- source_word: הָעֵדָה הַזֹּאת
  choice: cette communauté
  rationale: עֵדָה désigne ici la collectivité rassemblée. « Communauté » est naturel en français moderne et garde le sens collectif sans connotation ecclésiale trop marquée.
- source_word: וַאֲכַלֶּה
  choice: afin que je les anéantisse
  rationale: La forme volitive à la première personne après l’impératif annonce l’intention d’en finir entièrement avec le groupe. « Anéantisse » préserve la force du jugement, tandis que « afin que » rend le lien volitif avec l’ordre précédent.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux membres de la communauté visée par le jugement.
- source_word: כְּרָגַע
  choice: en un instant
  rationale: רֶגַע désigne un laps de temps extrêmement bref. « En un instant » exprime clairement la soudaineté de l’action.
theological_decisions:
- issue: Portée de la menace divine
  choice: Rendre l’annonce comme une intention réelle d’anéantir rapidement la communauté.
  alternative: Atténuer par « intervenir contre eux » ou « les écarter ».
  rationale: כלה porte ici l’idée forte de mener à son terme la destruction. La formulation conserve la gravité et la tension théologique du texte sans l’adoucir ni l’expliquer.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la brièveté impérieuse de l’hébreu ainsi que la force non atténuée de l’annonce du jugement.
