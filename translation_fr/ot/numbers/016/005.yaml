  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: fr
  text: 'Il parla à Coré et à toute son assemblée en ces termes : « Au matin, Yahweh fera connaître qui lui appartient et qui est saint, et il le fera approcher de lui. Celui qu’il choisira, il le fera approcher de lui[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Faire approcher » appartient au vocabulaire du sanctuaire : l’expression évoque l’accès autorisé à la présence de Yahweh pour le service sacré.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Il parla
  rationale: Le verbe דבר désigne ici le fait de prendre la parole et d’adresser un discours; le passé simple convient au registre narratif biblique français sans confondre ce verbe avec לֵאמֹר.
- source_word: עֲדָתוֹ
  choice: toute son assemblée
  rationale: עֵדָה désigne le groupe réuni autour de Coré. « Assemblée » est actuel et naturel; « toute » rend explicitement כָּל.
- source_word: בֹּקֶר
  choice: Demain matin
  rationale: Dans ce discours prononcé avant l’épreuve à venir, le nom employé adverbialement vise le matin suivant. « Demain matin » exprime naturellement cette valeur contextuelle.
- source_word: וְיֹדַע יְהוָה
  choice: Yahweh fera connaître
  rationale: ידע signifie formellement « connaître », mais la construction annonce ici une manifestation publique de l’identité de l’élu. « Fera connaître » rend cette portée sans préciser indûment le moyen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: qui lui appartient
  rationale: Cette formulation française naturelle conserve le sens possessif de « celui qui est à lui ».
- source_word: הַקָּדוֹשׁ
  choice: qui est saint
  rationale: L’adjectif substantivé désigne celui qui est consacré ou mis à part pour le service sacré. « Qui est saint » préserve la formulation du texte sans développer son interprétation.
- source_word: וְהִקְרִיב אֵלָיו / יַקְרִיב אֵלָיו
  choice: il le fera approcher de lui
  rationale: Le hiphil de קרב exprime le fait d’autoriser ou de faire approcher quelqu’un, notamment dans un cadre cultuel. La répétition française reproduit l’insistance de l’hébreu.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: Celui qu’il choisira
  rationale: Cette traduction conserve le caractère personnel du choix exprimé par בחר et la progression future de l’énoncé.
theological_decisions:
- issue: Sens de וְיֹדַע appliqué à Yahweh
  choice: Yahweh fera connaître
  alternative: Yahweh connaîtra
  rationale: Le sens premier « connaîtra » demeure possible, avec une nuance de reconnaissance ou d’identification divine. Le contexte d’une épreuve publique favorise toutefois « fera connaître », qui exprime la manifestation attendue sans nier que Yahweh connaît déjà les siens.
- issue: Relation entre « qui lui appartient » et « qui est saint »
  choice: Conserver les deux expressions coordonnées sans les fusionner
  alternative: celui qui lui appartient, c’est-à-dire le saint
  rationale: La syntaxe hébraïque laisse ouverte la relation exacte entre les deux désignations. Les maintenir séparées préserve cette tension et évite d’imposer qu’elles soient strictement synonymes.
- issue: Portée cultuelle de « faire approcher »
  choice: Conserver l’expression concrète « faire approcher de lui »
  alternative: l’admettre à son service sacerdotal
  rationale: Le contexte concerne l’accès sacré et le service autorisé, mais l’hébreu ne formule pas ici explicitement « service sacerdotal ». La traduction conserve donc l’image et l’ambiguïté du texte.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. « Yahweh » le représente directement et évite de substituer un titre.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient un ton narratif soutenu mais courant dans la Bible. La répétition finale est conservée pour refléter l’insistance de l’hébreu. Le marqueur [a] est placé après « choisira » afin d’éclairer l’action qui suit sans interrompre l’expression répétée.
