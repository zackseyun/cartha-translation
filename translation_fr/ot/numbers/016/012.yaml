  text: וַ/יִּשְׁלַ֣ח מֹשֶׁ֔ה לִ/קְרֹ֛א לְ/דָתָ֥ן וְ/לַ/אֲבִירָ֖ם בְּנֵ֣י אֱלִיאָ֑ב וַ/יֹּאמְר֖וּ לֹ֥א נַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: fr
  text: 'Moïse envoya chercher Datan et Abiram, fils d’Éliab, mais ils dirent : « Nous ne monterons pas.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Nous n’irons pas là-haut. » Le verbe hébreu signifie littéralement « monter »; il peut désigner le fait de se rendre à l’endroit où se trouve Moïse ou de comparaître devant lui à sa convocation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya chercher
  rationale: Dans cette construction, שׁלח indique que Moïse fait venir les hommes par l’intermédiaire d’un envoyé. « Envoya chercher » est idiomatique en français et n’explicite pas inutilement l’identité du messager.
- source_word: לִקְרֹא
  choice: chercher
  rationale: Avec « envoya », l’expression française « envoya chercher » rend naturellement l’idée de convoquer quelqu’un, tout en conservant la concision du texte.
- source_word: דָתָן וְלַאֲבִירָם
  choice: Datan et Abiram
  rationale: Les noms propres sont transcrits selon leur forme française biblique usuelle.
- source_word: בְּנֵי אֱלִיאָב
  choice: fils d’Éliab
  rationale: Rend directement la désignation filiale qui identifie les deux hommes; l’absence d’article est naturelle en apposition française.
- source_word: וַיֹּאמְרוּ
  choice: mais ils dirent
  rationale: Le waw assure formellement la succession, mais la réponse constitue ici un refus opposé à la convocation; « mais » exprime naturellement ce contraste contextuel.
- source_word: לֹא נַעֲלֶה
  choice: Nous ne monterons pas
  rationale: « Monter » conserve le sens concret et potentiellement chargé de עלה sans décider s’il s’agit simplement de se rendre auprès de Moïse ou de comparaître devant lui. Le futur exprime ici un refus déterminé.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Envoya chercher » est plus naturel que « envoya convoquer » tout en gardant la force de la convocation dans ce contexte. La formulation « nous ne monterons pas » préserve l’ambiguïté spatiale et institutionnelle de l’hébreu.
