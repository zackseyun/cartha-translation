  yaml_path: translation/ot/numbers/033/039.yaml
  text: And Aaron was one hundred twenty-three years old when he died on Mount Hor.
translation:
  language: fr
  text: Aaron était âgé de cent vingt-trois ans lorsqu’il mourut sur le mont Hor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: Aaron
  rationale: Le waw assure ici la continuité du récit; il n’est pas nécessaire de le rendre par « et » dans cette phrase récapitulative en français. Le nom propre est donné sous sa forme française traditionnelle.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: était âgé de cent vingt-trois ans
  rationale: L’expression hébraïque « fils de… années » indique l’âge. La formulation retenue est naturelle, précise et digne en français moderne.
- source_word: בְּ/מֹת/וֹ
  choice: lorsqu’il mourut
  rationale: 'La préposition ב avec le nom verbal et le suffixe a ici une valeur temporelle: « au moment où il mourut ». Le passé simple convient au registre narratif biblique sans être archaïque.'
- source_word: בְּ/הֹר הָ/הָר
  choice: sur le mont Hor
  rationale: הֹר הָהָר désigne le lieu appelé « mont Hor ». « Sur » restitue naturellement la localisation au sommet ou sur les pentes de la montagne.
