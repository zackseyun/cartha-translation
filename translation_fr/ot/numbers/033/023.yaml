  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: fr
  text: Ils partirent de Qehélata et campèrent au mont Shafer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mont Shapher ».
    reason: Variante traditionnelle de translittération du nom hébreu שָׁפֶר.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les itinéraires, le verbe נסע désigne le départ du camp et la reprise de la marche. « Partirent » est naturel en français moderne et convient à la formule répétée de Nombres 33.
- source_word: מִקְּהֵלָתָה
  choice: de Qehélata
  rationale: Le préfixe מִן marque la provenance. Le nom de lieu est translittéré; « Qehélata » représente la prononciation massorétique sans traduire le toponyme.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans les formules d’itinéraire du désert, חנה signifie établir son camp. « Campèrent » est clair, courant et fidèle.
- source_word: בְּהַר
  choice: au mont
  rationale: הַר suivi d’un nom propre désigne ici un mont; la préposition ב est rendue idiomatiquement par « au » pour le lieu du campement.
- source_word: שָׁפֶר
  choice: Shéfer
  rationale: Le nom propre est translittéré d’après la vocalisation massorétique. La variante « Shafer » conserve une autre convention de translittération courante.
