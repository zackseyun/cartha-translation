lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, le verbe נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et conserve clairement la progression du voyage.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: de Rimmôn-Pérets
  rationale: La préposition מִן indique le point de départ. Le toponyme composé est translittéré, avec un trait d’union et des accents qui guident la prononciation française.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie établir le camp. « Campèrent » est l’équivalent moderne, clair et direct.
- source_word: בְּלִבְנָה
  choice: à Libna
  rationale: La préposition בְּ marque ici le lieu de l’étape. « À » convient naturellement devant ce nom de lieu, translittéré « Libna ».
