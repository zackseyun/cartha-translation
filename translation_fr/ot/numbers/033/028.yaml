  yaml_path: translation/ot/numbers/033/028.yaml
  text: They set out from Terah and camped at Mithkah.
translation:
  language: fr
  text: Ils partirent de Tarah et campèrent à Mitqa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et conserve la progression du voyage.
- source_word: מִתָּרַח
  choice: de Tèrah
  rationale: La préposition מִן indique ici le point de départ. תָּרַח est un nom de lieu, rendu par translittération.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie s’arrêter pour établir son camp. « Campèrent » en conserve le sens concret et convient au registre narratif.
- source_word: בְּמִתְקָה
  choice: à Mitqa
  rationale: La préposition בְּ marque ici le lieu de l’étape. Avec un nom de lieu, « à » est la tournure française naturelle; מִתְקָה est translittéré.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation concise reproduit la formule répétitive de l’itinéraire. Les noms sont translittérés directement depuis l’hébreu; « Mitqa » représente notamment la consonne ק par q.
