  text: וְ/הִתְנַחַלְתֶּם֩ אֶת הָ/אָ֨רֶץ בְּ/גוֹרָ֜ל לְ/מִשְׁפְּחֹֽתֵי/כֶ֗ם לָ/רַ֞ב תַּרְבּ֤וּ אֶת נַחֲלָת/וֹ֙ וְ/לַ/מְעַט֙ תַּמְעִ֣יט אֶת נַחֲלָת֔/וֹ אֶל֩ אֲשֶׁר יֵ֨צֵא ל֥/וֹ שָׁ֛מָּ/ה הַ/גּוֹרָ֖ל ל֣/וֹ יִהְיֶ֑ה לְ/מַטּ֥וֹת אֲבֹתֵי/כֶ֖ם תִּתְנֶחָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: fr
  text: Vous répartirez le pays par tirage au sort selon vos clans. Au groupe le plus nombreux, vous donnerez une part d’héritage plus grande, et au groupe le moins nombreux, une part d’héritage plus petite. Là où le sort tombera pour chacun, ce sera sa part.[a] Vous recevrez vos parts d’héritage selon les tribus de vos pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « À l’endroit où le sort sortira pour lui, là ce sera à lui. »'
    reason: Cette note conserve la tournure spatiale et l’idiome hébreu « le sort sortira », tandis que le texte principal emploie l’expression française naturelle « le sort tombera ».
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: Vous répartirez
  rationale: Dans ce contexte de partage territorial, le hitpael de נחל exprime la répartition du pays en parts d’héritage; « répartirez » rend naturellement cette valeur distributive.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Ici, הָאָרֶץ désigne le territoire promis à Israël; « le pays » convient mieux que « la terre » dans ce contexte géographique précis.
- source_word: בְּגוֹרָל
  choice: par tirage au sort
  rationale: גורל désigne le procédé d’attribution par le sort; cette formulation est claire et idiomatique en français moderne.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: entre vos clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision sociale de la tribu, plus large que la famille nucléaire moderne.
- source_word: לָרַב ... וְלַמְעַט
  choice: au groupe le plus nombreux ... au groupe le moins nombreux
  rationale: Dans le contexte du partage, ces expressions opposent les groupes selon leur effectif; l’explicitation évite l’ambiguïté de « au grand » et « au petit ».
- source_word: תַּרְבּוּ אֶת נַחֲלָתוֹ ... תַּמְעִיט אֶת נַחֲלָתוֹ
  choice: Vous donnerez une part d’héritage plus grande ... une part d’héritage plus petite
  rationale: La formulation conserve le vocabulaire de l’héritage tout en exprimant clairement la variation de superficie selon l’effectif.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל לֹו יִהְיֶה
  choice: Chacun recevra le territoire que le sort lui aura attribué
  rationale: Cette tournure rend idiomatiquement le résultat contraignant du tirage tout en laissant en note la structure spatiale plus formelle de l’hébreu.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: selon vos tribus ancestrales
  rationale: L’expression renvoie aux tribus déterminées par l’ascendance paternelle; « tribus ancestrales » le communique sans lourdeur.
- source_word: תִּתְנֶחָלוּ
  choice: Vous recevrez votre héritage
  rationale: Le verbe conclut l’instruction en soulignant la réception du territoire comme héritage; le singulier collectif français reste naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire juridique et territorial demeure accessible; « part d’héritage » préserve la portée biblique de נַחֲלָה sans donner à entendre un simple héritage privé.
