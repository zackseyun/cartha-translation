revisions:
- from: Vous répartirez le pays par tirage au sort entre vos clans. Vous donnerez une part d’héritage plus grande au groupe le plus nombreux, et une part d’héritage plus petite au groupe le moins nombreux. Chacun recevra le territoire que le sort lui aura attribué.[a] Vous recevrez votre héritage selon vos tribus ancestrales.
  to: Vous répartirez le pays par tirage au sort selon vos clans. Au groupe le plus nombreux, vous donnerez une part d’héritage plus grande, et au groupe le moins nombreux, une part d’héritage plus petite. Là où le sort tombera pour chacun, ce sera sa part.[a] Vous recevrez vos parts d’héritage selon les tribus de vos pères.
  rationale: 'La révision resserre l’équivalence avec l’hébreu sans modifier le sens : la répartition est organisée selon les clans, les parts sont proportionnelles à l’effectif, le sort détermine la part de chacun, et l’héritage est reçu dans le cadre des tribus paternelles. Elle préserve également en note la construction spatiale de l’original.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:52:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : partage du pays par le sort, proportionnalité des parts selon l’effectif, puis attribution déterminée par le sort. Toutefois, « entre vos clans » peut suggérer que les clans sont les parties qui répartissent, alors que לְמִשְׁפְּחֹתֵיכֶם indique plutôt la répartition selon/pour les clans. La conclusion doit aussi conserver plus explicitement le pluriel des parts reçues et la référence aux tribus des pères.'
  naturalness: Le français est globalement clair et moderne. « Selon les tribus de vos pères » est plus direct et plus précis que « vos tribus ancestrales ». La formulation révisée de la phrase sur le sort est idiomatique tout en restant proche de la construction hébraïque.
  terminology: « Pays », « tirage au sort », « clans » et « part d’héritage » conviennent au contexte. « Parts d’héritage » au dernier membre maintient le vocabulaire de נַחֲלָה et correspond au pluriel contextuel. La note doit rendre l’idiome sans la formulation française artificielle « le sort sortira ».
  issues:
  - severity: low
    issue: Nuance de la préposition devant « vos clans »
    rationale: « Entre vos clans » est compréhensible, mais « selon vos clans » reflète mieux לְמִשְׁפְּחֹתֵיכֶם dans une instruction de répartition.
  - severity: low
    issue: Conclusion au singulier collectif et expression généalogique atténuée
    rationale: « Votre héritage selon vos tribus ancestrales » lisse le pluriel contextuel et l’expression « tribus de vos pères ». « Vos parts d’héritage selon les tribus de vos pères » est plus fidèle.
  - severity: low
    issue: Note littérale imprécise et peu naturelle
    rationale: La note actuelle introduit « sera sa part », tandis que le texte dit littéralement que le lieu où le sort sortira pour lui sera à lui. Une note plus exacte rend la construction sans calque inutilement opaque.
  revised_text: Vous répartirez le pays par tirage au sort selon vos clans. Au groupe le plus nombreux, vous donnerez une part d’héritage plus grande, et au groupe le moins nombreux, une part d’héritage plus petite. Là où le sort tombera pour chacun, ce sera sa part.[a] Vous recevrez vos parts d’héritage selon les tribus de vos pères.
  revised_footnotes:
  - marker: a
    text: 'Plus formellement : « À l’endroit où le sort sortira pour lui, là ce sera à lui. »'
    reason: Cette note conserve la tournure spatiale et l’idiome hébreu « le sort sortira », tandis que le texte principal emploie l’expression française naturelle « le sort tombera ».
  revision_rationale: 'La révision resserre l’équivalence avec l’hébreu sans modifier le sens : la répartition est organisée selon les clans, les parts sont proportionnelles à l’effectif, le sort détermine la part de chacun, et l’héritage est reçu dans le cadre des tribus paternelles. Elle préserve également en note la construction spatiale de l’original.'
