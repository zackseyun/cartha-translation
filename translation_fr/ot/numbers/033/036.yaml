  text: וַ/יִּסְע֖וּ מֵ/עֶצְי֣וֹן גָּ֑בֶר וַ/יַּחֲנ֥וּ בְ/מִדְבַּר צִ֖ן הִ֥וא קָדֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/036.yaml
  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: fr
  text: Ils partirent d’Étsion-Guéber et campèrent dans le désert de Tsîn, c’est-à-dire[a] Qadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est Qadesh ». Le pronom hébreu introduit une identification du lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les itinéraires, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » rend naturellement cette formule en français moderne.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: d’Étsion-Guéber
  rationale: Le toponyme est translittéré selon une forme française usuelle, avec les consonnes et la structure du nom hébreu reconnaissables.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה signifie ici établir son camp. « Campèrent » est concret, clair et adapté au récit d’itinéraire.
- source_word: בְמִדְבַּר צִן
  choice: dans le désert de Tsîn
  rationale: מִדְבָּר désigne une région aride et peu habitée. « Désert » est naturel en français biblique moderne sans préciser excessivement la nature du terrain.
- source_word: הִוא
  choice: c’est-à-dire
  rationale: Le pronom féminin introduit ici une identification appositionnelle du lieu précédent. Cette tournure en exprime clairement la valeur explicative, tandis qu’une note conserve l’alternative plus formelle.
- source_word: קָדֵשׁ
  choice: Qadesh
  rationale: Le nom de lieu est translittéré; « Qadesh » reflète le qoph initial et correspond à un usage français reconnu.
