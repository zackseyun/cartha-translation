base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: fr
  text: Ils partirent de la mer Rouge[a] et campèrent dans le désert de Sin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la mer des Roseaux ». Le nom hébreu yam souf est traditionnellement rendu par « mer Rouge », mais son sens plus littéral est souvent compris comme « mer des Roseaux ».
    reason: lexical_alternative
  - marker: b
    text: « Sin » est le nom d’une région désertique, et non un terme moral.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire de Nombres 33, le verbe נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et convient au mouvement depuis un lieu.
- source_word: מִיַּם סוּף
  choice: de la mer Rouge
  rationale: Le nom hébreu yam souf est traditionnellement rendu par « mer Rouge » et fonctionne ici comme un nom géographique. Le sens plus littéral possible, « mer des Roseaux », est conservé en note.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה désigne ici l’installation du camp. « Campèrent » rend concrètement et naturellement la formule d’itinéraire.
- source_word: בְּמִדְבַּר סִין
  choice: dans le désert de Sîn
  rationale: מִדְבָּר désigne une région aride ou sauvage; « désert » est idiomatique dans ce contexte. סִין est un nom de lieu, translittéré « Sîn » afin de le distinguer clairement de « Sion » et de toute notion morale.
