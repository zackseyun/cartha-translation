  yaml_path: translation/ot/numbers/033/022.yaml
  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: fr
  text: Ils partirent de Rissa et campèrent à Qehélata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ d’une étape vers la suivante. « Partirent » est naturel en français moderne et restitue clairement ce mouvement.
- source_word: מֵרִסָּה
  choice: de Rissa
  rationale: Le préfixe מֵ־ signifie « de ». Le nom de lieu est translittéré sous la forme française « Rissa ».
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה désigne l’action d’établir le camp. « Campèrent » est précis, courant et concret.
- source_word: בִּקְהֵלָתָה
  choice: à Qehélata
  rationale: Le préfixe בְּ־ marque ici le lieu de l’étape. En français, « à » convient naturellement devant un nom de lieu. La translittération « Qehélata » rend le qoph initial et la forme hébraïque du toponyme.
