  text: וַ/יִּסְע֖וּ מֵ/הָרֵ֣י הָ/עֲבָרִ֑ים וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: fr
  text: Ils partirent des montagnes d’Abarim et campèrent dans les plaines[a] de Moab, au bord du Jourdain, près de Jéricho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les steppes de Moab ». Le terme hébreu peut désigner des plaines ou des terres de steppe.
    reason: lexical_alternative
  - marker: b
    text: Ou « au bord du Jourdain, en face de Jéricho ». La construction hébraïque peut désigner le Jourdain dans la région de Jéricho; « en face de Jéricho » est une interprétation géographique possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les itinéraires, נסע désigne le fait de lever le camp et de se mettre en route. « Partirent » exprime naturellement ce mouvement en français moderne.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: des montagnes d’Abarim
  rationale: הָרֵי est le pluriel construit de « montagne » ou « hauteur ». « Montagnes d’Abarim » rend directement l’expression géographique tout en conservant le nom propre.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans cette formule d’itinéraire, חנה signifie installer son camp. « Campèrent » est précis, naturel et non archaïque.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: עַרְבֹת désigne ici des étendues ouvertes et relativement arides, des plaines ou steppes. « Plaines » est le terme le plus accessible, tandis que la note conserve l’autre nuance possible.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: près du Jourdain, à la hauteur de Jéricho
  rationale: עַל situe le camp au bord ou à proximité du fleuve. La construction compacte יַרְדֵּן יְרֵחוֹ associe cette portion du Jourdain à Jéricho sans comporter de mot explicite signifiant « en face de » ; « à la hauteur de Jéricho » préserve cette relation géographique sans la préciser excessivement.
