  variant: modern international French
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אֶל אֶ֥רֶץ כְּנָֽעַן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: fr
  text: 'Parle aux Israélites[a] et dis-leur : « Lorsque vous traverserez[b] le Jourdain pour entrer dans le pays de Canaan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « puisque vous êtes sur le point de traverser ». Le participe hébreu peut présenter la traversée comme imminente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel commande directement à Moïse de prendre la parole; « Parle » conserve aussi la distinction avec le verbe suivant.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Expression française naturelle et inclusive pour désigner le peuple; le sens littéral « fils d’Israël » est signalé en note.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Rend distinctement le second verbe de parole et son complément, sans fusionner les deux formulations hébraïques.
- source_word: כִּי
  choice: Lorsque
  rationale: Dans ce discours prospectif, la conjonction introduit naturellement le moment où l’action annoncée aura lieu; une note conserve les autres nuances possibles liées au participe.
- source_word: אַתֶּם עֹבְרִים
  choice: vous traverserez
  rationale: Le pronom explicite et le participe décrivent ici une action imminente ou future. Le futur français après « lorsque » exprime clairement cette valeur prospective.
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Forme française usuelle du nom du fleuve; le contexte ne nécessite pas d’ajouter « fleuve ».
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: pour entrer dans le pays de Canaan
  rationale: Formulation idiomatique qui conserve l’idée de mouvement vers l’intérieur du territoire ainsi que le nom אֶרֶץ, « pays ».
