  text: וַ/יִּסְעוּ֙ מִ/פְּנֵ֣י הַֽ/חִירֹ֔ת וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּ/מִדְבַּ֣ר אֵתָ֔ם וַֽ/יַּחֲנ֖וּ בְּ/מָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: fr
  text: Ils partirent de devant Hahiroth[a], passèrent au milieu de la mer vers le désert, puis firent trois jours de marche[b] dans le désert d’Étam et campèrent à Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « de devant Hahiroth ». Dans l’Exode, ce lieu est plus souvent appelé « Pi-Hahiroth » ; ici, le texte ne comporte pas l’élément « Pi- », et la forme courte est donc conservée.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « parcoururent dans le désert d’Étam une distance de trois jours de marche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans un itinéraire, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » est naturel en français et convient à la succession des étapes.
- source_word: מִפְּנֵי הַחִירֹת
  choice: de devant Hahiroth
  rationale: La formulation conserve מִפְּנֵי, « de devant », ainsi que la forme courte du nom présente dans ce verset, sans l’harmoniser avec Pi-Hahiroth dans l’Exode.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: passèrent au milieu de la mer
  rationale: עבר exprime le passage, tandis que בְתוֹךְ précise qu’il s’effectue au milieu de la mer. Cette traduction préserve l’image sans ajouter de détail.
- source_word: הַמִּדְבָּרָה
  choice: en direction du désert
  rationale: Le hé directionnel indique un mouvement vers le désert. « En direction du désert » rend cette orientation sans imposer plus précisément « jusque dans le désert ».
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: firent trois jours de marche
  rationale: Cette expression française naturelle rend l’idiome hébreu, qui décrit une étape correspondant à trois jours de trajet et peut évoquer aussi bien la durée que la distance parcourue.
- source_word: בְּמִדְבַּר אֵתָם
  choice: dans le désert d’Étam
  rationale: Le groupe construit hébreu désigne le désert associé au lieu nommé Étam.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: campèrent à Mara
  rationale: חנה signifie établir son camp; « à » convient naturellement à une étape nommée.
