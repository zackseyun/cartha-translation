  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּר סִ֑ין וַֽ/יַּחֲנ֖וּ בְּ/דָפְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: fr
  text: Ils partirent du désert de Sin et campèrent à Dophqa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע évoque le fait de lever le camp et de repartir. « Partirent » est naturel en français moderne et convient à la succession des étapes.
- source_word: מִמִּדְבַּר
  choice: du désert de
  rationale: מִדְבָּר désigne une région aride ou inhabitée. « Désert » est ici la formulation française la plus naturelle pour ce nom géographique.
- source_word: סִין
  choice: Sîn
  rationale: Nom propre géographique translittéré. L’accent circonflexe aide à le distinguer visuellement du mot français « sin », qui n’est de toute façon pas un terme français courant.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה est le verbe habituel des itinéraires pour l’établissement d’un camp. « Campèrent » est clair, actuel et précis.
- source_word: בְּדָפְקָה
  choice: à Dofqa
  rationale: La préposition בְּ marque ici le lieu de l’étape. « À » est idiomatique devant un nom de lieu, et « Dofqa » rend directement les consonnes hébraïques דָפְקָה.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation conserve la structure brève de l’itinéraire hébreu. Aucune note n’est nécessaire en français, puisque la confusion signalée par la note anglaise entre le toponyme Sin et le nom commun anglais sin ne se pose pas.
