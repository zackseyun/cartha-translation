  text: וַ/יִּסְע֖וּ מִ/מַּקְהֵלֹ֑ת וַֽ/יַּחֲנ֖וּ בְּ/תָֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/026.yaml
  text: They set out from Makheloth and camped at Tahath.
translation:
  language: fr
  text: Ils partirent de Maqheloth et campèrent à Tahath.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et exprime clairement le mouvement depuis le camp précédent.
- source_word: מִמַּקְהֵלֹת
  choice: de Maqheloth
  rationale: Le préfixe מִן est rendu par « de ». Le nom de lieu est translittéré plutôt que traduit; « Maqheloth » représente le qoph par q et le khaf par kh.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie établir son camp à l’étape suivante. « Campèrent » est courant, précis et moins soutenu que « établirent leur camp ».
- source_word: בְּתָחַת
  choice: à Tahath
  rationale: Le préfixe ב est rendu idiomatiquement par « à » devant un lieu d’étape. « Tahath » est conservé comme nom propre translittéré.
