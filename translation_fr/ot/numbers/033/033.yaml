  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, le verbe נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et conserve clairement la progression du voyage.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: de Hor-Hagguidgad
  rationale: La préposition מִן indique le point de départ. Le toponyme est translittéré, avec un trait d’union pour représenter l’unité de ses éléments.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans un itinéraire, חנה signifie établir le camp. « Campèrent » est la formulation française courante et directe.
- source_word: בְּיָטְבָתָה
  choice: à Yotbata
  rationale: La préposition בְּ marque ici le lieu où l’on fait étape. « À » convient naturellement devant un nom de lieu, qui est translittéré.
