  yaml_path: translation/ot/numbers/033/042.yaml
  text: They set out from Zalmonah and camped at Punon.
translation:
  language: fr
  text: Ils partirent de Tsalmona et campèrent à Pounôn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne la levée du camp et le départ. « Partirent » est naturel en français moderne et convient à la succession des étapes.
- source_word: מִצַּלְמֹנָה
  choice: de Tsalmona
  rationale: La préposition מִן indique le point de départ (« de »). Le nom de lieu est translittéré plutôt que traduit.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie établir son camp. « Campèrent » est clair, courant et fidèle.
- source_word: בְּפוּנֹן
  choice: à Pounôn
  rationale: La préposition בְּ introduit ici le lieu où les Israélites campent; « à » est la tournure française naturelle. Le nom propre est translittéré.
