  text: וַ/יִּסְע֖וּ מֵ/אֹבֹ֑ת וַֽ/יַּחֲנ֛וּ בְּ/עִיֵּ֥י הָעֲבָרִ֖ים בִּ/גְב֥וּל מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: fr
  text: Ils partirent d’Oboth et campèrent à Iyé-Abarim[a], à la frontière de Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Iyyé-Abarim » ; le nom hébreu pourrait être lié aux mots signifiant « ruines » et « Abarim » ou « régions d’au-delà ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule des étapes au désert, נסע désigne le fait de lever le camp et de se remettre en route. « Partirent » est naturel en français moderne et convient à la séquence de l’itinéraire.
- source_word: מֵאֹבֹת
  choice: d’Oboth
  rationale: La préposition מֵ indique le point de départ, et אֹבֹת est un nom de lieu, rendu par translittération.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה est le terme habituel pour établir un camp au cours des déplacements d’Israël. « Campèrent » en conserve le sens concret dans un registre courant et digne.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: à Iyé-Abarim
  rationale: L’expression fonctionne ici comme un toponyme dans une liste d’étapes. La translittération évite de trancher excessivement son étymologie possible, liée à des « ruines » et à Abarim ou aux régions d’au-delà.
- source_word: בִּגְבוּל
  choice: à la frontière de
  rationale: גְּבוּל peut désigner une frontière, une limite ou un territoire. Dans cette notice géographique, « à la frontière de » exprime directement la localisation sans affirmer que le camp se trouvait à l’intérieur du territoire moabite.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française traditionnelle et largement reconnue du nom géographique.
theological_decisions: []
