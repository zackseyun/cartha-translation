id: NUM.33.1
reference: Numbers 33:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: fr
  text: Voici les étapes du voyage des Israélites[a], qui sortirent du pays d’Égypte, organisés en unités[b], sous la conduite de Moïse et d’Aaron[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils d’Israël ». On peut aussi traduire : « des enfants d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « selon leurs armées » ou « par divisions ». Le terme hébreu évoque des groupes organisés et peut avoir une nuance militaire.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « par la main de Moïse et d’Aaron », expression hébraïque indiquant leur action ou leur direction.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Cette tournure française introduit naturellement la liste d’itinéraires qui suit et rend la valeur présentative du démonstratif hébreu.
- source_word: מַסְעֵי
  choice: les étapes du voyage
  rationale: Le nom désigne ici les étapes successives ou points de départ de l’itinéraire d’Israël; cette formulation exprime clairement la progression sans réduire le terme aux seuls départs.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël ». En français moderne, « les Israélites » désigne naturellement l’ensemble du peuple, hommes, femmes et enfants, tandis que « fils d’Israël » pourrait être compris comme exclusivement masculin.
- source_word: אֲשֶׁר יָצְאוּ
  choice: qui sortirent
  rationale: Le passé simple convient au registre narratif digne et rend directement le mouvement exprimé par יצא.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: La traduction conserve explicitement אֶרֶץ, « pays/terre », dans une expression française naturelle.
- source_word: לְצִבְאֹתָם
  choice: organisés en unités
  rationale: צָבָא évoque des groupes ordonnés, avec une possible nuance militaire. Cette formulation conserve l’idée d’organisation sans présenter nécessairement tout le peuple comme une armée combattante.
- source_word: בְּיַד
  choice: sous la conduite de
  rationale: L’expression hébraïque « par la main de » indique ici l’intermédiaire, l’autorité ou la direction exercée par Moïse et Aaron; l’équivalent français explicite naturellement cet idiome.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises traditionnelles et courantes de ces noms propres.
theological_decisions:
- issue: Portée de בְּיַד dans le rôle de Moïse et d’Aaron
  choice: sous la conduite de
  alternative: par l’intermédiaire de / par la main de
  rationale: Le contexte permet une nuance d’agence aussi bien que de direction. « Sous la conduite de » est idiomatique et n’attribue pas à Moïse et Aaron l’origine divine de l’Exode; la note signale la forme hébraïque plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. Le verset garde la forme d’une introduction à une liste d’itinéraires. Les idiomes hébreux sont rendus naturellement dans le texte et documentés en notes; la possible nuance militaire de לְצִבְאֹתָם demeure ouverte.
