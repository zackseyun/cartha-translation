  text: וַ/יִּסְע֖וּ מִ/סֻּכֹּ֑ת וַ/יַּחֲנ֣וּ בְ/אֵתָ֔ם אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: fr
  text: Ils partirent de Soukkoth et campèrent à Etham, qui se trouve à la lisière du désert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans cet itinéraire, נסע exprime le fait de lever le camp et de repartir. « Ils partirent » est naturel en français moderne et rend clairement le mouvement, sans la lourdeur de « ils se mirent en route ».
- source_word: מִסֻּכֹּת
  choice: de Soukkoth
  rationale: Nom de lieu translittéré. « Soukkoth » représente naturellement en français la prononciation hébraïque et permet de conserver la consonne redoublée.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה signifie camper ou établir son camp. « Campèrent » est précis, courant et adapté au style d’un itinéraire.
- source_word: בְאֵתָם
  choice: à Étam
  rationale: La préposition ב avec le nom de lieu indique ici l’endroit où le peuple campe. « À Étam » est l’expression idiomatique française.
- source_word: אֲשֶׁר
  choice: qui se trouve
  rationale: Le relatif introduit une indication géographique sur Étam. « Qui se trouve » rend explicitement et naturellement la relation locative implicite en hébreu.
- source_word: בִּקְצֵה
  choice: à la lisière de
  rationale: קצה désigne l’extrémité, le bord ou la limite. Dans ce contexte géographique, « à la lisière de » évoque naturellement la zone où commence le désert sans suggérer une frontière politique précise.
- source_word: הַמִּדְבָּר
  choice: du désert
  rationale: מִדְבָּר désigne une région inculte et peu habitée, pas nécessairement une étendue de sable. En français biblique moderne, « désert » est le terme usuel et suffisamment large dans le contexte de l’Exode.
