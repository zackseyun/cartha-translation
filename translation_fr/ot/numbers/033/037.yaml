  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: fr
  text: Ils partirent de Qadesh[a] et campèrent au mont Hor[b], à l’extrémité du pays d’Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Qadesh » ; certaines traductions précisent « Qadesh-Barnéa » d’après le contexte plus large, mais le texte porte ici seulement le nom court.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement en hébreu : « à Hor, la montagne » ; cette expression est traditionnellement rendue par « au mont Hor ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule des étapes au désert, נסע désigne le départ d’un campement. « Ils partirent » est naturel en français moderne et convient à la progression de l’itinéraire.
- source_word: מִקָּדֵשׁ
  choice: de Qadesh
  rationale: L’hébreu porte simplement קָדֵשׁ. La traduction conserve donc le toponyme court sans ajouter « Barnéa », absent de ce verset.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה est le verbe habituel pour établir un camp au cours d’un déplacement. « Campèrent » rend concrètement et sobrement l’action.
- source_word: בְּהֹר הָהָר
  choice: au mont Hor
  rationale: La tournure hébraïque est littéralement « à Hor, la montagne ». « Au mont Hor » correspond à l’usage français établi pour ce toponyme.
- source_word: בִּקְצֵה
  choice: à l’extrémité de
  rationale: קצה peut désigner l’extrémité, le bord ou la limite. « À l’extrémité de » conserve le sens spatial sans imposer l’idée plus précise d’une frontière politique.
- source_word: אֶרֶץ אֱדוֹם
  choice: du pays d’Édom
  rationale: אֶרֶץ signifie ici pays, terre ou territoire. « Le pays d’Édom » est direct et idiomatique dans un récit géographique.
