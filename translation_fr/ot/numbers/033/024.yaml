  yaml_path: translation/ot/numbers/033/024.yaml
  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: fr
  text: Ils partirent du mont Shéfer et campèrent à Harada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ d’un campement vers l’étape suivante. « Partirent » est naturel en français moderne et exprime clairement ce mouvement.
- source_word: מֵהַר
  choice: du mont
  rationale: La préposition מִן avec הַר indique le point de départ. Devant un nom propre, « du mont » est la tournure française naturelle.
- source_word: שָׁפֶר
  choice: Shéfer
  rationale: Le nom de lieu est translittéré plutôt que traduit. « Shéfer » représente les consonnes et la vocalisation du texte massorétique dans une graphie adaptée au français.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ces notices d’itinéraire, חנה signifie établir son camp. « Campèrent » est clair, actuel et fidèle au contexte.
- source_word: בַּחֲרָדָה
  choice: à Harada
  rationale: Avec un lieu servant d’étape, ב est naturellement rendu par « à ». Le nom propre חֲרָדָה est translittéré « Harada ».
