  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: fr
  text: Ils partirent de Hashmona et campèrent à Moséroth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et conserve clairement la progression du voyage.
- source_word: מֵחַשְׁמֹנָה
  choice: de Hashmona
  rationale: La préposition מֵ est rendue par « de ». Le nom de lieu חַשְׁמֹנָה est translittéré sous la forme française « Hashmona ».
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie établir son camp. « Campèrent » exprime directement et naturellement l’action en français.
- source_word: בְּמֹסֵרוֹת
  choice: à Moséroth
  rationale: Pour une étape de voyage, la préposition בְּ se rend naturellement par « à ». Le nom de lieu מֹסֵרוֹת est translittéré « Moséroth ».
