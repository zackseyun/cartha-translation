  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: fr
  text: Ils partirent du désert du Sinaï et campèrent à Kibroth-Hattaava[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibroth-Hattaava signifie « tombeaux de la convoitise » ou « tombeaux du désir ardent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire de Nombres 33, נסע exprime le fait de lever le camp et de se mettre en route. « Ils partirent » est naturel en français moderne et convient au complément introduit par « du ».
- source_word: מִמִּדְבַּר סִינַי
  choice: du désert du Sinaï
  rationale: מִדְבָּר désigne ici une région désertique ou sauvage. « Désert du Sinaï » est la désignation géographique courante en français et conserve la relation entre les deux noms.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה est le verbe habituel des itinéraires pour établir le camp. « Campèrent » est précis, naturel et sans archaïsme.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: à Kibroth-Hattaava
  rationale: Le syntagme fonctionne comme un nom de lieu; il est donc translittéré dans le texte. Sa signification est donnée en note afin de préserver le jeu étiologique sans remplacer le toponyme.
