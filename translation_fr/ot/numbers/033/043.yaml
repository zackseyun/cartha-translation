  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: fr
  text: Ils partirent de Pounôn et campèrent à Oboth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le fait de lever le camp et de repartir. « Partirent » est naturel en français moderne et convient à cette brève étape narrative.
- source_word: מִפּוּנֹן
  choice: de Pounôn
  rationale: La préposition מִן marque le point de départ. Le nom de lieu est translittéré sous la forme « Pounôn », qui reflète les voyelles du texte massorétique.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans un itinéraire, חנה signifie établir son camp. « Campèrent » est précis, courant et plus naturel que « établirent leur camp » dans cette formule répétée.
- source_word: בְּאֹבֹת
  choice: à Oboth
  rationale: Avec un lieu d’étape, la préposition בְּ se rend naturellement par « à ». Le toponyme est translittéré plutôt que traduit.
