  yaml_path: translation/ot/numbers/033/041.yaml
  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: fr
  text: Ils partirent du mont Hor et campèrent à Tsalmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les listes d’étapes, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » rend naturellement cette formule en français moderne.
- source_word: מֵהֹר הָהָר
  choice: du mont Hor
  rationale: הֹר הָהָר est le nom de lieu traditionnellement rendu « mont Hor » ; cette forme est idiomatique en français et conserve l’identification du toponyme.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה signifie ici établir son camp à l’étape suivante. « Campèrent » est précis, courant et adapté au style de l’itinéraire.
- source_word: בְּצַלְמֹנָה
  choice: à Tsalmona
  rationale: La préposition בְּ a ici un sens locatif. « À » est la préposition française naturelle devant cette étape nommée ; « Tsalmona » translittère le צ initial sans confondre le nom avec un Z simple.
