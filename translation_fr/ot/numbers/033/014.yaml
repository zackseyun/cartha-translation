  text: וַ/יִּסְע֖וּ מֵ/אָל֑וּשׁ וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ם וְ/לֹא הָ֨יָה שָׁ֥ם מַ֛יִם לָ/עָ֖ם לִ/שְׁתּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: fr
  text: Ils partirent d’Aloush et campèrent à Refidim, mais il n’y avait là pas d’eau pour le peuple à boire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » est naturel en français moderne.
- source_word: מֵאָלוּשׁ
  choice: d’Aloush
  rationale: Nom de lieu translittéré selon une forme française lisible.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה est le verbe habituel pour établir un camp; « campèrent » est courant et précis.
- source_word: בִּרְפִידִם
  choice: à Refidim
  rationale: Nom de lieu translittéré; la préposition « à » convient naturellement à un lieu de campement.
- source_word: וְלֹא הָיָה שָׁם
  choice: mais il n’y avait là aucune
  rationale: Le waw introduit ici une circonstance défavorable qui contraste avec l’installation du camp. « Mais » rend clairement cette valeur contextuelle.
- source_word: מַיִם
  choice: eau
  rationale: Équivalent français direct de מַיִם; avec la négation existentielle, « aucune eau » conserve l’insistance du texte.
- source_word: לָעָם לִשְׁתּוֹת
  choice: à boire pour le peuple
  rationale: L’infinitif לִשְׁתּוֹת précise l’usage de l’eau. Cette formulation est naturelle et conserve le peuple comme bénéficiaire.
