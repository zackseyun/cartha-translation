lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et exprime clairement ce mouvement.
- source_word: מִיָּטְבָתָה
  choice: de Yotbata
  rationale: La préposition מִן indique la provenance et se rend par « de ». Le toponyme hébreu est translittéré sous la forme française « Yotbata ».
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie établir son camp. « Campèrent » est clair, actuel et fidèle.
- source_word: בְּעַבְרֹנָה
  choice: à Abrona
  rationale: La préposition בְּ a ici une valeur locative. « À » convient naturellement à un lieu d’étape, et le toponyme est translittéré « Abrona ».
