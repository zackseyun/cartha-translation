  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: fr
  text: Ils partirent de Dibon-Gad et campèrent à Almon-Diblataïm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire de Nombres 33, נסע désigne le départ d’une étape, avec l’idée de lever le camp. « Partirent » est naturel et clair en français moderne.
- source_word: מִדִּיבֹן גָּד
  choice: de Dibôn-Gad
  rationale: Le nom de lieu est translittéré et présenté comme un toponyme composé. La préposition מִן est rendue par « de ».
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה signifie ici établir son camp à l’étape suivante. « Campèrent » restitue directement la formule d’itinéraire dans un français courant et digne.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: à Almôn-Diblataïm
  rationale: Le toponyme est translittéré comme un nom composé; le préfixe בְּ est rendu par « à », qui marque naturellement le lieu de l’étape.
