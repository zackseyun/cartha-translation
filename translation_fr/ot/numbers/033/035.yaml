lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule des étapes au désert, נסע désigne le départ d’un lieu de campement. « Partirent » est naturel en français moderne et exprime clairement ce mouvement.
- source_word: מֵעַבְרֹנָה
  choice: d’Abrona
  rationale: La préposition מֵ est rendue par « de », élidée devant le nom propre. עַבְרֹנָה est translittéré comme nom de lieu, selon une forme française usuelle.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans un itinéraire, חנה signifie installer son camp. « Campèrent » est précis, courant et plus direct que « établirent leur camp ».
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: à Étsion-Guéber
  rationale: La préposition בְּ marque ici le lieu et se rend naturellement par « à ». Le toponyme composé est translittéré avec des accents facilitant la prononciation française et un trait d’union.
