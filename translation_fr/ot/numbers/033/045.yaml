  text: וַ/יִּסְע֖וּ מֵ/עִיִּ֑ים וַֽ/יַּחֲנ֖וּ בְּ/דִיבֹ֥ן גָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: fr
  text: Ils partirent d’Iyim[a] et campèrent[b] à Dibon-Gad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom de ce lieu peut aussi être translittéré « Iyyim » ou « Iim ».
    reason: lexical_alternative
  - marker: b
    text: Ou « établirent leur camp ». Le verbe hébreu désigne couramment l’installation d’un camp dans les formules d’itinéraire du désert.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les formules d’itinéraire de Nombres, נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et exprime clairement la mise en route.
- source_word: מֵעִיִּים
  choice: d’Iyim
  rationale: La préposition מֵ est rendue par « de ». Le toponyme est translittéré « Iyim », forme lisible qui reflète les consonnes hébraïques sans le traduire.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה désigne ici l’établissement du camp à l’étape suivante. « Campèrent » est courant, précis et adapté à une notice d’itinéraire.
- source_word: בְּדִיבֹן גָּד
  choice: à Dibon-Gad
  rationale: Avec un nom de lieu dans ce contexte, בְּ se rend naturellement par « à ». « Dibon-Gad » est traité comme un toponyme composé, sans transformer Gad en complément explicatif.
