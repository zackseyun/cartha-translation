source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/אֵילִ֑ם וַֽ/יַּחֲנ֖וּ עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: fr
  text: Ils partirent d’Élim et campèrent près de la mer Rouge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mer des Roseaux ». Le nom hébreu Yam Souf est traditionnellement traduit par « mer Rouge ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et maintient la progression du voyage.
- source_word: מֵאֵילִם
  choice: d’Élim
  rationale: La préposition מִן marque le point de départ, et אֵילִם est transcrit comme nom de lieu.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה est le verbe habituel pour établir un camp; « campèrent » en rend directement et naturellement le sens.
- source_word: עַל
  choice: près de
  rationale: Avec une étendue d’eau comme repère du campement, עַל indique ici la proximité ou la situation sur le bord, plutôt qu’une position littéralement « sur » la mer.
- source_word: יַם סוּף
  choice: la mer Rouge
  rationale: « Mer Rouge » est la désignation française traditionnelle et reconnue. Le sens lexical possible « mer des Roseaux » est conservé en note afin de ne pas masquer l’ambiguïté du nom hébreu.
