  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: fr
  text: Ils partirent d’Almon-Diblataïm et campèrent dans les monts d’Abarim[a], en face de Nébo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Nébo ». La préposition hébraïque indique une relation spatiale sans en préciser exactement la nuance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire de Nombres 33, נסע désigne le fait de lever le camp et de reprendre la route. « Ils partirent » est naturel et concis en français moderne.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: d’Almon-Diblataïm
  rationale: Nom de lieu translittéré; le trait d’union présente l’ensemble comme un toponyme composé.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה est le verbe habituel pour établir le camp. « Campèrent » conserve clairement cette idée dans un registre courant et digne.
- source_word: בְּהָרֵי הָעֲבָרִים
  choice: dans les monts d’Abarim
  rationale: הָרֵי est le pluriel construit de « montagne ». « Dans les monts » convient à un campement situé au sein d’un ensemble montagneux; Abarim est traité comme un nom géographique.
- source_word: לִפְנֵי
  choice: en face de
  rationale: La préposition exprime ici une relation spatiale, littéralement « devant ». « En face de » est idiomatique sans imposer une orientation géographique précise.
- source_word: נְבוֹ
  choice: Nébo
  rationale: Nom propre rendu selon sa forme française usuelle, sans préciser s’il s’agit ici de la montagne ou de la région.
