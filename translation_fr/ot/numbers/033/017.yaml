  text: וַ/יִּסְע֖וּ מִ/קִּבְרֹ֣ת הַֽתַּאֲוָ֑ה וַֽ/יַּחֲנ֖וּ בַּ/חֲצֵרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/017.yaml
  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: fr
  text: Ils partirent de Qibroth-Hattaava[a] et campèrent à Hatséroth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qibroth-Hattaava signifie « Tombes du désir » ou « Tombes de la convoitise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et exprime clairement ce mouvement.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: de Qibroth-Hattaava
  rationale: Le toponyme est translittéré plutôt que remplacé par sa signification; la préposition מִן est rendue par « de ». Le sens du nom est indiqué en note.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans un itinéraire, חנה signifie établir son camp. « Campèrent » est précis, courant et moins soutenu que « établirent leur campement ».
- source_word: בַּחֲצֵרֹת
  choice: à Hatséroth
  rationale: Le nom de lieu est translittéré, et la préposition ב est naturellement rendue par « à » lorsqu’il s’agit de camper en un lieu.
