  yaml_path: translation/ot/numbers/033/025.yaml
  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: fr
  text: Ils partirent de Harada et campèrent à Maqheloth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne la levée du camp et le départ. « Partirent » est naturel en français moderne et exprime clairement le mouvement depuis une étape.
- source_word: מֵחֲרָדָה
  choice: de Harada
  rationale: La préposition מֵ marque ici le point de départ. Le nom de lieu est translittéré selon une forme française lisible.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie établir son camp. « Campèrent » est précis, courant et adapté au registre du passage.
- source_word: בְּמַקְהֵלֹת
  choice: à Maqheloth
  rationale: Avec un nom d’étape, בְ indique le lieu où le camp est établi. « À » est la tournure française naturelle. La graphie « Maqheloth » rend le qoph par q et conserve le h indiquant la consonne hébraïque.
