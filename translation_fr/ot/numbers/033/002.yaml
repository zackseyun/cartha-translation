language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: fr
  text: Moïse consigna leurs points de départ[b] selon leurs étapes, sur l’ordre de Yahweh[a] ; et voici leurs étapes selon leurs points de départ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la bouche de Yahweh », expression qui signifie ici « sur l’ordre de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leurs départs », « leurs sorties ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le texte inverse intentionnellement les deux termes : « leurs points de départ selon leurs étapes »… « leurs étapes selon leurs points de départ ».'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: consigna
  rationale: Le verbe exprime ici la mise par écrit d’un relevé. « Consigna » est concis, naturel dans le contexte d’un itinéraire et plus précis que le simple « écrivit ».
- source_word: מוֹצָאֵיהֶם
  choice: leurs points de départ
  rationale: מוֹצָא peut désigner l’action ou le lieu de la sortie. Dans cet itinéraire, « points de départ » rend concrètement les lieux d’où les Israélites sont partis, tout en se prêtant à la reprise inversée de la fin du verset.
- source_word: לְמַסְעֵיהֶם / מַסְעֵיהֶם
  choice: selon leurs étapes / leurs étapes
  rationale: מַסָּע désigne une étape de déplacement, liée au fait de lever le camp. « Étapes » convient mieux qu’un terme général comme « voyages » à la liste d’itinéraire qui suit. « Selon » conserve la relation exprimée par לְ sans la préciser excessivement.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: L’expression signifie littéralement « sur la bouche de Yahweh », idiome qui indique qu’une action est accomplie sur son ordre. La formulation française transmet clairement ce sens sans effacer la possibilité de signaler l’image hébraïque en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par « Yahweh », conformément au choix du projet de représenter directement le tétragramme.
- source_word: וְאֵלֶּה
  choice: et voici
  rationale: « Et voici » introduit naturellement en français la liste rétrospective qui suit, sans imposer un verbe absent du texte hébreu.
- source_word: לְמוֹצָאֵיהֶם
  choice: selon leurs points de départ
  rationale: Cette formulation reprend les mêmes termes que dans le premier membre et préserve l’inversion intentionnelle entre les points de départ et les étapes.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre et n’introduit pas le titre de substitution traditionnel.
- issue: Portée de עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  alternative: selon la parole de Yahweh
  rationale: Dans ce contexte, l’expression idiomatique indique que Moïse a établi ce relevé sur l’ordre de Yahweh. La traduction ne tranche pas au-delà de cette valeur directive.
translation_notes:
  register: Français international moderne, digne et accessible. « Consigna » convient à un relevé écrit; « étapes » situe clairement le verset dans un itinéraire. Le parallélisme inversé de l’hébreu est conservé, ainsi que le nom divin « Yahweh ».
