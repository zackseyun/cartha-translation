source:
  edition: WLC
  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: fr
  text: pendant que les Égyptiens enterraient ceux que Yahweh avait frappés parmi eux — tous les premiers-nés —, Yahweh avait aussi exécuté des jugements contre leurs dieux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur leurs dieux ».'
    reason: La préposition hébraïque ב peut être rendue formellement par « sur », tandis que « contre » en exprime ici le sens idiomatique.
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: pendant que les Égyptiens enterraient
  rationale: Le nom précédé de la conjonction et le participe forment ici une proposition circonstancielle décrivant l’action en cours à l’arrière-plan.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם
  choice: ceux que Yahweh avait frappés au milieu d’eux
  rationale: Cette formulation conserve la relative hébraïque et rend נכה par « frapper », dont le contexte indique ici l’issue mortelle.
- source_word: כָּל בְּכוֹר
  choice: tous les premiers-nés
  rationale: L’apposition est maintenue après la relative, conformément à l’ordre et à la structure du texte hébreu, sans introduire un possessif absent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וּבֵאלֹהֵיהֶם
  choice: contre leurs dieux
  rationale: Avec l’expression עשה שפטים, la préposition ב marque naturellement les êtres contre lesquels les jugements sont dirigés.
- source_word: עָשָׂה יְהוָה שְׁפָטִים
  choice: Yahweh avait aussi exécuté des jugements
  rationale: « Exécuter des jugements » restitue l’expression idiomatique signifiant accomplir des actes judiciaires; « aussi » exprime naturellement la coordination en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme; la translittération préserve le nom personnel sans lui substituer un titre.
- issue: Identité des אֱלֹהֵיהֶם
  choice: leurs dieux
  alternative: leurs idoles
  rationale: La traduction garde la désignation explicite des divinités égyptiennes sans la réinterpréter ni en atténuer la portée.
- issue: Rapport des jugements aux dieux égyptiens
  choice: contre leurs dieux
  alternative: sur leurs dieux
  rationale: « Contre » exprime clairement la valeur adversative probable de ב dans cette construction, tandis que la note conserve le rendu plus formel de la préposition.
translation_notes:
  register: Français international moderne, sobre et digne. La structure appositive « ceux que… tous les premiers-nés » est volontairement conservée afin de respecter la formulation hébraïque et de ne pas introduire le possessif « leurs ».
