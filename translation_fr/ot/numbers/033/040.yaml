  text: וַ/יִּשְׁמַ֗ע הַֽ/כְּנַעֲנִי֙ מֶ֣לֶךְ עֲרָ֔ד וְ/הֽוּא יֹשֵׁ֥ב בַּ/נֶּ֖גֶב בְּ/אֶ֣רֶץ כְּנָ֑עַן בְּ/בֹ֖א בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: fr
  text: Le roi cananéen d’Arad, qui habitait dans le Néguev, au pays de Canaan, apprit que les fils d’Israël arrivaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Le qal de שׁמע signifie littéralement « entendre », mais, avec l’événement introduit par בְּבֹא, le français idiomatique « apprit que » exprime naturellement le fait qu’une nouvelle lui parvint sans ajouter de contenu précis.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: Le roi cananéen d’Arad
  rationale: Cette formulation française naturelle conserve à la fois l’identité cananéenne du personnage et son titre de roi d’Arad.
- source_word: וְהוּא יֹשֵׁב
  choice: qui habitait
  rationale: Le pronom suivi du participe fournit une information descriptive d’arrière-plan ; une proposition relative en rend clairement la fonction.
- source_word: בַּנֶּגֶב
  choice: dans le Néguev
  rationale: Néguev est ici compris comme le nom géographique de la région méridionale, plutôt que comme le simple point cardinal « sud ».
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: au pays de Canaan
  rationale: Cette traduction conserve explicitement אֶרֶץ tout en employant une tournure française naturelle.
- source_word: בְּבֹא
  choice: que … arrivaient
  rationale: La préposition ב avec l’infinitif construit de בוא marque ici la circonstance temporelle. « Arrivaient » évite de préciser une destination que l’hébreu ne nomme pas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rendu formel de l’expression hébraïque, qui garde le lien avec le nom ancestral Israël sans la remplacer par l’ethnonyme plus interprétatif « Israélites ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Néguev » suit l’usage géographique courant. La syntaxe a été légèrement réorganisée pour être naturelle en français sans résoudre davantage que le texte la nature exacte de ce que le roi apprit.
