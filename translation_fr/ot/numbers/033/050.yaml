id: NUM.33.50
reference: Numbers 33:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse dans les plaines[a] de Moab, près du Jourdain, à la hauteur de Jéricho. Il dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les steppes de Moab ».
    reason: Alternative lexicale reflétant la valeur topographique de עֲרָבוֹת.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר désigne ici l’acte de parler, tandis que la construction narrative en וַ fait avancer le récit. Le passé simple convient au registre narratif français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel יהוה au lieu de le remplacer par un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל introduit le destinataire de la parole; « Moïse » est la forme française établie du nom.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: עֲרָבוֹת désigne ici les étendues planes ou steppiques de Moab. « Plaines » est naturel en français et correspond à l’expression géographique consacrée, tandis que la variante « steppes » est signalée en note.
- source_word: עַל יַרְדֵּן
  choice: près du Jourdain
  rationale: Dans cette indication géographique, עַל situe le lieu au bord ou à proximité du Jourdain, non littéralement sur le fleuve.
- source_word: יְרֵחוֹ
  choice: à la hauteur de Jéricho
  rationale: Dans la séquence géographique, Jéricho sert de repère de l’autre côté du Jourdain. Cette formulation française exprime la localisation sans faire des plaines de Moab une partie de la ville.
- source_word: לֵאמֹר
  choice: 'Il dit :'
  rationale: L’infinitif introduit les paroles divines qui suivent. Une nouvelle proposition avec deux-points est plus naturelle en français que le calque « disant », tout en conservant sa fonction introductive.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel divin sans lui substituer un titre et correspond à une translittération moderne largement reconnue.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le passé simple maintient la solennité naturelle du récit; « Il dit : » introduit clairement le discours du verset suivant. La ponctuation rend explicite la structure sans résoudre abusivement l’indication géographique.'
