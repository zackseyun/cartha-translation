  text: וַ/יִּסְע֖וּ מִ/מֹּסֵר֑וֹת וַֽ/יַּחֲנ֖וּ בִּ/בְנֵ֥י יַעֲקָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: fr
  text: Ils partirent de Moséroth et campèrent à Bené-Yaakan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, Bené-Yaakan signifie littéralement « fils de Yaakan », mais l’expression désigne ici un lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire de Nombres 33, נסע désigne la levée du camp et le départ. « Ils partirent » est naturel en français moderne et convient à cette formule répétée.
- source_word: מִמֹּסֵרֹות
  choice: de Moséroth
  rationale: La préposition מִן est rendue par « de ». Le toponyme est translittéré, avec une graphie française qui reflète la forme hébraïque.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie établir son camp. « Campèrent » est précis, courant et conserve le parallélisme verbal.
- source_word: בִּבְנֵי יַעֲקָן
  choice: à Bené-Yaakan
  rationale: L’expression signifie littéralement « fils de Yaakan », mais elle fonctionne ici comme un nom de lieu. La préposition ב est donc rendue idiomatiquement par « à ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Les noms propres sont translittérés selon une graphie lisible en français; la formule d’itinéraire reste concise.
