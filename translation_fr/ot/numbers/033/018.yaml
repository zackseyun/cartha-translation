  yaml_path: translation/ot/numbers/033/018.yaml
  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: fr
  text: Ils partirent de Hatséroth et campèrent à Rithma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le départ du camp. « Partirent » est naturel en français moderne et exprime clairement la reprise du voyage.
- source_word: מֵחֲצֵרֹת
  choice: de Hatséroth
  rationale: Le préfixe מִן indique la provenance. Le nom de lieu est translittéré selon une forme française qui conserve notamment le tsadé par « ts ».
- source_word: וַיַּחֲנוּ
  choice: campèrent
  rationale: חנה est le verbe habituel de ces itinéraires pour l’installation d’un camp. « Campèrent » est précis, courant et moins marqué que « établirent leur camp ».
- source_word: בְּרִתְמָה
  choice: à Ritma
  rationale: Le préfixe בְּ marque ici le lieu où le camp est établi. « À » est la préposition française idiomatique devant ce nom de lieu; la translittération « Ritma » rend la consonne finale ה non prononcée sans ajouter un h graphique inutile.
