  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: fr
  text: Ils partirent de Mara et arrivèrent à Élim. À Élim, il y avait douze sources d’eau et soixante-dix palmiers, et ils campèrent là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire, נסע évoque la levée du camp et le départ. « Partirent » est naturel en français moderne et convient à la succession des étapes.
- source_word: מִמָּרָה
  choice: de Mara
  rationale: Nom de lieu translittéré selon l’usage français courant, sans traduire sa signification.
- source_word: וַיָּבֹאוּ
  choice: et arrivèrent
  rationale: בוא signifie ici venir ou parvenir à destination. « Arrivèrent » exprime naturellement l’aboutissement du déplacement en français.
- source_word: אֵילִמָה / בְאֵילִם
  choice: à Élim / À Élim
  rationale: La première forme indique la destination, tandis que la seconde situe les sources et les palmiers. La même préposition française convient naturellement aux deux emplois.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: douze
  rationale: Rendu direct du nombre cardinal.
- source_word: עֵינֹת מַיִם
  choice: sources d’eau
  rationale: עַיִן désigne ici des sources naturelles. « Sources d’eau » est précis et évite « puits », qui suggérerait des ouvrages creusés.
- source_word: וְשִׁבְעִים
  choice: et soixante-dix
  rationale: Rendu direct du nombre cardinal coordonné au nom qui suit.
- source_word: תְּמָרִים
  choice: palmiers
  rationale: Le mot désigne des palmiers, vraisemblablement des palmiers-dattiers, mais le terme général préserve le degré de précision du texte.
- source_word: וַיַּחֲנוּ שָׁם
  choice: et ils campèrent là
  rationale: חנה désigne l’établissement d’un camp à une étape. « Campèrent là » est actuel, clair et fidèle.
