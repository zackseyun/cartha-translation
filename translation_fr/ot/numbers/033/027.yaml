  yaml_path: translation/ot/numbers/033/027.yaml
  text: They set out from Tahath and camped at Terah.
translation:
  language: fr
  text: Ils partirent de Tahath et campèrent à Térah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » est naturel en français moderne et convient à la succession des étapes.
- source_word: מִתָּחַת
  choice: de Tahath
  rationale: La préposition מִן indique le point de départ et se traduit par « de ». Le nom de lieu תָּחַת est translittéré « Tahath », ce qui maintient sa distinction avec Térah.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Dans ce contexte d’itinéraire, חנה signifie établir son camp. « Campèrent » est clair, courant et moins soutenu que « établirent leur camp ».
- source_word: בְּתָרַח
  choice: à Térah
  rationale: Avec un lieu d’étape, la préposition בְּ se rend naturellement par « à ». La forme « Térah » suit l’usage français courant pour תָּרַח.
