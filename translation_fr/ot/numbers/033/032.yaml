  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: fr
  text: Ils partirent de Bené-Yaakan et campèrent à Hor-Hagguidgad[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, Bené-Yaakan est probablement un nom de lieu, bien que cette expression signifie littéralement « fils de Yaakan ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע indique le départ d’une étape. « Partirent » est naturel en français moderne et maintient la succession des déplacements.
- source_word: מִבְּנֵי יַעֲקָן
  choice: de Bené-Yaakan
  rationale: L’expression fonctionne ici comme un nom de lieu, en lien avec « Beéroth-Bené-Yaakan » en Deutéronome 10.6. La translittération préserve le toponyme, tandis qu’une note en donne le sens littéral.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה appartient à la formule habituelle des étapes et signifie établir son camp. « Campèrent » est clair, actuel et adapté au contexte.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: à Hor-Hagguidgad
  rationale: Il s’agit d’un nom de lieu, donc il est translittéré. La préposition בְ marque ici le lieu et se rend naturellement par « à ».
theological_decisions: []
