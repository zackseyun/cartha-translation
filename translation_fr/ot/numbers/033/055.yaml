  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: fr
  text: Mais si vous ne chassez pas devant vous les habitants du pays, ceux d’entre eux que vous y laisserez deviendront des pointes dans vos yeux[a] et des épines dans vos flancs[b] ; ils vous harcèleront dans le pays où vous habiterez[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu est rare et désigne quelque chose d’acéré qui pique ou transperce. Autre traduction possible : « des aiguillons dans vos yeux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « des pointes dans vos flancs » ou « des crochets dans vos flancs ». Les deux images décrivent une souffrance persistante causée par les habitants restés dans le pays.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils vous tourmenteront » ou « ils vous opprimeront ». Le verbe hébreu peut désigner diverses formes d’hostilité et d’affliction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: chassez
  rationale: Le hifil de ירשׁ exprime ici l’expulsion des habitants. « Chasser » est naturel en français moderne et garde la force de l’action sans recourir au terme plus technique « déposséder ».
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Rend directement la construction participiale et convient au contexte territorial.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: Préserve l’image spatiale de l’hébreu tout en formant avec « chasser » une tournure française intelligible.
- source_word: תּוֹתִירוּ מֵהֶם
  choice: ceux d’entre eux que vous y laisserez
  rationale: Exprime l’idée de laisser subsister une partie des habitants, sans ajouter la nuance de clémence qu’aurait « épargner ».
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: des pointes dans vos yeux
  rationale: Le nom rare שִׂכִּים désigne vraisemblablement des objets acérés ou piquants. « Pointes » maintient l’image douloureuse et la distingue des « épines » du membre parallèle.
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: des épines dans vos flancs
  rationale: « Épines » restitue l’objet piquant, tandis que « flancs » rend naturellement le pluriel anatomique צִדֵּיכֶם dans cette métaphore.
- source_word: וְצָרֲרוּ אֶתְכֶם
  choice: ils vous harcèleront
  rationale: צרר peut évoquer l’hostilité, le harcèlement ou l’oppression. « Harceler » convient à l’affliction hostile et persistante annoncée par les métaphores précédentes.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: dans le pays où vous habiterez
  rationale: Dans ce contexte, le français emploie naturellement « dans le pays ». Le futur « habiterez » s’accorde avec la situation annoncée et la portée prospective de l’avertissement.
