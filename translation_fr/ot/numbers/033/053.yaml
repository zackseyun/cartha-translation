source:
  edition: WLC
  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: fr
  text: Vous prendrez possession du pays et vous y habiterez, car je vous ai donné ce pays pour que vous en preniez possession.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour que vous en héritiez ». Le verbe hébreu peut exprimer aussi bien la prise de possession que l’entrée en héritage, notamment dans le contexte du pays promis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Vous prendrez possession de
  rationale: Le hifil de ירשׁ peut exprimer la dépossession ou la prise de possession. Comme son complément direct est ici « le pays », cette formulation française rend naturellement l’acquisition effective du territoire sans suggérer que le pays lui-même est chassé.
- source_word: הָאָרֶץ
  choice: le pays / ce pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire promis. « Pays » est naturel en français moderne et convient mieux ici que « terre », qui pourrait évoquer le sol.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: et vous y habiterez
  rationale: ישׁב désigne ici l’habitation durable. « Habiter » est actuel, digne et plus direct que « demeurer », tandis que le pronom « y » reprend naturellement le pays.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le fondement du commandement. « Car » conserve clairement sa valeur causale dans un registre biblique moderne et sobre.
- source_word: לָכֶם נָתַתִּי
  choice: je vous ai donné
  rationale: Le parfait présente le don divin comme accompli et toujours pertinent. Le passé composé français exprime naturellement cette valeur.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: pour que vous en preniez possession
  rationale: L’infinitif construit exprime le but du don. Cette tournure explicite ce rapport final et reprend le sens territorial de ירשׁ, tout en conservant en note l’autre nuance possible.
theological_decisions:
- issue: Sens de ירשׁ dans le contexte de la promesse du pays
  choice: prendre possession de
  alternative: recevoir en héritage
  rationale: Le contexte immédiat porte sur l’occupation concrète du pays donné par Dieu. La traduction principale retient donc la prise de possession, sans effacer la nuance d’héritage que le verbe peut revêtir dans le cadre de l’alliance et qui est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le futur français rend ici l’instruction solennelle sans recourir à une tournure archaïque. La répétition de « prendre possession » reflète la répétition de la racine ירשׁ dans l’hébreu.
