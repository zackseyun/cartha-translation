  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: fr
  text: Ils partirent d’Étham, revinrent vers Pi-Hahiroth[a], qui se trouve en face de Baal-Tsephon, et campèrent devant Migdol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « firent demi-tour vers Pi-Hahiroth ». Le verbe hébreu peut exprimer un retour ou un changement de direction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵתָם
  choice: Ils partirent d’Étham
  rationale: Dans les itinéraires du désert, נסע désigne couramment le fait de lever le camp et de reprendre la route. « Partirent » est naturel en français moderne et convient à la formule narrative.
- source_word: וַיָּשָׁב
  choice: revinrent
  rationale: שׁוב peut signifier revenir ou faire demi-tour. « Revinrent vers » conserve l’idée d’un mouvement en sens inverse sans affirmer qu’ils ont nécessairement regagné un lieu déjà atteint.
- source_word: עַל־פִּי הַחִירֹת
  choice: vers Pi-Hahiroth
  rationale: Avec ce toponyme, עַל introduit ici la direction ou la destination. « Vers » rend naturellement la relation géographique tout en évitant une précision excessive.
- source_word: אֲשֶׁר עַל־פְּנֵי בַּעַל צְפֹן
  choice: qui se trouve en face de Baal-Tsephon
  rationale: עַל־פְּנֵי exprime ici une position spatiale, « en face de » ou « vis-à-vis de ». Les noms propres sont translittérés.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה signifie établir son camp. « Campèrent » est direct, courant et fidèle au contexte de l’itinéraire.
- source_word: לִפְנֵי מִגְדֹּל
  choice: devant Migdol
  rationale: לִפְנֵי indique une position devant ou en face de. « Devant » préserve la formulation spatiale sans transformer Migdol, employé ici comme toponyme, en nom commun.
theological_decisions: []
