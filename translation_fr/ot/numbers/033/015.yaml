  yaml_path: translation/ot/numbers/033/015.yaml
  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: fr
  text: Ils partirent de Rephidim et campèrent dans le désert du Sinaï.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire, נסע désigne le départ d’une étape. « Partirent » est naturel en français moderne et exprime clairement le mouvement depuis le lieu précédent.
- source_word: מֵרְפִידִם
  choice: de Rephidim
  rationale: La préposition מ־ marque ici le point de départ. Rephidim est conservé comme nom de lieu translittéré.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה désigne le fait d’établir le camp. « Campèrent » est précis, courant et plus naturel que « établirent leur camp » dans cette formule concise.
- source_word: בְּמִדְבַּר סִינָי
  choice: dans le désert du Sinaï
  rationale: מִדְבָּר désigne une région sauvage et peu habitée, souvent désertique. « Désert » est l’expression française usuelle pour cette région biblique, tandis que le complément construit est rendu par « du Sinaï ».
