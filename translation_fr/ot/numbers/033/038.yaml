source:
  edition: WLC
  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: fr
  text: Le prêtre Aaron monta sur le mont Hor sur l’ordre de Yahweh[a] et y mourut. C’était la quarantième année après la sortie des Israélites du pays d’Égypte, le premier jour du cinquième mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon la parole de Yahweh » ; littéralement « sur la bouche de Yahweh ».
    reason: Conserver l’image de l’expression hébraïque et signaler une autre traduction idiomatique possible.
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime un déplacement vers le haut. « Monta » est direct, naturel et convient à l’ascension d’une montagne.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Rendu direct du titre כהן, placé en apposition à Aaron dans le texte hébreu.
- source_word: אֶל הֹר הָהָר
  choice: sur le mont Hor
  rationale: « Le mont Hor » est la forme géographique française usuelle du nom propre; avec « monter », la préposition « sur » exprime naturellement la destination en hauteur.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: L’expression signifie littéralement « sur la bouche de Yahweh », mais désigne idiomatiquement l’obéissance à sa parole ou à son ordre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du tétragramme, qui conserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: וַיָּמָת שָׁם
  choice: et y mourut
  rationale: « Y » rend avec concision l’adverbe שָׁם (« là ») tout en produisant une phrase française naturelle.
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: C’était la quarantième année après la sortie des Israélites
  rationale: Cette formulation rend clairement la date calculée à partir de l’Exode; « Israélites » désigne naturellement le peuple dans son ensemble.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Rend explicitement אֶרֶץ (« pays ») et la provenance marquée par מִן.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du cinquième mois
  rationale: Réorganise les deux éléments de la date selon l’ordre français naturel tout en conservant intégralement l’information du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre et évite de le remplacer silencieusement par un titre.
- issue: Sens de l’expression עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  alternative: selon la parole de Yahweh
  rationale: Le contexte présente l’ascension d’Aaron comme accomplie conformément à l’instruction divine. La note conserve l’image littérale et l’autre possibilité idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase a été divisée en deux pour alléger la longue formule chronologique sans modifier son lien avec la mort d’Aaron. Le passé simple convient au registre narratif biblique tout en restant immédiatement compréhensible.
