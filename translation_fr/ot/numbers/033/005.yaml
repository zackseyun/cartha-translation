  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: fr
  text: Les fils d’Israël partirent de Ramsès et campèrent à Soukkoth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partirent
  rationale: Dans cette notice d’itinéraire, נסע désigne le départ d’une étape, souvent après avoir levé le camp. « Partirent » est naturel et précis en français moderne.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduction directe de l’expression hébraïque, qui conserve sa forme traditionnelle et sa référence collective sans la réduire silencieusement à « les Israélites ».
- source_word: מֵרַעְמְסֵס
  choice: de Ramsès
  rationale: La préposition מִן indique le point de départ. « Ramsès » est la graphie française usuelle du nom de lieu.
- source_word: וַיַּחֲנוּ
  choice: campèrent
  rationale: Le verbe חנה signifie établir son camp. « Campèrent » est clair, courant et adapté à un récit d’itinéraire.
- source_word: בְּסֻכֹּת
  choice: à Soukkoth
  rationale: La préposition בְּ indique ici le lieu de l’étape. « Soukkoth » translittère le toponyme hébreu selon un usage français reconnaissable.
