  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁ֥ר דִּמִּ֛יתִי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם אֶֽעֱשֶׂ֥ה לָ/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/056.yaml
  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: fr
  text: Alors, il arrivera que ce que j’avais projeté de leur faire, je vous le ferai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Alors
  rationale: Dans cette formule, וְהָיָה introduit la conséquence future de l’avertissement précédent. « Alors » exprime naturellement ce lien sans tournure archaïque.
- source_word: כַּאֲשֶׁר
  choice: ce que
  rationale: Dans cette construction, כַּאֲשֶׁר introduit le contenu de l’action projetée. « Ce que » donne en français une phrase naturelle tout en maintenant la correspondance entre les deux actions.
- source_word: דִּמִּיתִי
  choice: j’avais projeté
  rationale: Le piel de דמה exprime ici une intention arrêtée plutôt qu’une simple pensée. Le plus-que-parfait situe naturellement ce projet avant son éventuelle exécution envers Israël.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: de leur faire
  rationale: Cette formulation conserve le sens large de עשה et rend le complément indirect introduit par ל sans préciser davantage la nature punitive de l’action.
- source_word: אֶעֱשֶׂה לָכֶם
  choice: je vous le ferai
  rationale: La reprise du verbe « faire » préserve le parallélisme incisif de l’hébreu, tandis que « le » reprend clairement l’action précédemment mentionnée.
theological_decisions:
- issue: Portée de la formule d’avertissement
  choice: 'Une menace directe de jugement réciproque : Dieu fera à Israël ce qu’il avait projeté de faire aux habitants du pays.'
  alternative: Une simple annonce de conséquence, sans insistance sur l’intention divine.
  rationale: Le verset clôt l’avertissement par une menace solennelle. La traduction maintient l’action divine explicite et la correspondance entre les deux groupes, sans ajouter la nature précise du jugement.
translation_notes:
  register: Français international moderne, sobre et solennel. La phrase resserrée restitue le parallélisme hébreu sans archaïsme. Aucun appel de note n’est nécessaire, car la traduction retenue rend directement et sans surinterprétation la construction du texte source.
