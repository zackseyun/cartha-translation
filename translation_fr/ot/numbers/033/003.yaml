  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: fr
  text: Ils partirent de Ramsès, le quinzième jour du premier mois. Le lendemain de la Pâque, les fils d’Israël[a] sortirent, la main levée[b], sous les yeux de tous les Égyptiens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « la main levée » décrit ici une sortie ouverte et hardie, à la vue de tous.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les itinéraires, נסע désigne le fait de lever le camp et de se mettre en route. « Partirent » est naturel en français et convient à la formule d’itinéraire.
- source_word: מֵרַעְמְסֵס
  choice: de Ramsès
  rationale: « Ramsès » est la forme française usuelle de ce nom de lieu.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: au premier mois
  rationale: Rendu direct de l’expression temporelle hébraïque.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: le quinzième jour du premier mois
  rationale: Formulation française naturelle et précise de la date hébraïque.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: Le lendemain de la Pâque
  rationale: מָחֳרַת indique le jour suivant, et « la Pâque » conserve la référence à la fête déterminée.
- source_word: יָצְאוּ
  choice: sortirent
  rationale: Le verbe conserve le motif concret de la sortie d’Égypte porté par יצא.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Ce rendu transparent préserve la forme masculine plurielle et l’expression collective hébraïque; une note donne l’équivalent français plus idiomatique.
- source_word: בְּיָד רָמָה
  choice: la main levée
  rationale: Le calque intelligible garde l’image concrète de l’hébreu sans imposer exclusivement les nuances de hardiesse, de triomphe ou de défi.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: sous les yeux de tous les Égyptiens
  rationale: Expression française naturelle qui conserve l’image de la visibilité publique présente dans l’hébreu.
theological_decisions:
- issue: Rendu de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte emploie une expression masculine plurielle représentative et collective. Le texte principal en préserve la forme, tandis que la note signale le sens collectif idiomatique.
- issue: Rendu de l’expression בְיָד רָמָה
  choice: la main levée
  alternative: avec assurance / hardiment / avec défi
  rationale: L’image hébraïque peut évoquer une sortie ouverte, assurée et éventuellement provocante. La conserver évite de trancher entre ces nuances possibles.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’itinéraire hébraïque, avec deux phrases pour une lecture claire. Les images « fils d’Israël », « main levée » et « sous les yeux » sont conservées sans obscurcir le sens.
