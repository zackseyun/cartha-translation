  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: fr
  text: Vous chasserez de devant vous tous les habitants du pays. Vous détruirez toutes leurs représentations figurées[a] ; vous détruirez toutes leurs statues de métal fondu[b] et vous démolirez tous leurs hauts lieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes leurs pierres sculptées ». Le mot hébreu désigne des représentations figurées ou ornées ; leur forme et leur matière exactes sont discutées.
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes leurs statues moulées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: vous chasserez
  rationale: Le hiphil de ירשׁ exprime ici l’expulsion des habitants du territoire. « Chasser » rend clairement cette action et s’accorde naturellement avec « devant vous ».
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: tous les habitants du pays
  rationale: Le participe désigne ceux qui résident dans le pays. « Habitants » est précis, courant et concis.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: Cette formulation conserve l’image de l’expression hébraïque tout en restant naturelle en français.
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: vous détruirez / vous détruirez
  rationale: Le piel de אבד commande la destruction des objets cultuels. La répétition du même verbe respecte l’insistance rhétorique de l’hébreu.
- source_word: מַשְׂכִּיֹּתָם
  choice: leurs pierres sculptées
  rationale: Le terme désigne des représentations figurées ou ornées, probablement réalisées dans la pierre, mais sa forme et sa matière exactes restent discutées. Le choix principal donne un référent concret sans dissimuler l’incertitude, signalée en note.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: leurs statues en métal fondu
  rationale: צֶלֶם désigne une représentation ou statue, tandis que מַסֵּכָה indique un objet obtenu par fonte. La formulation explicite naturellement en français la matière et le procédé.
- source_word: בָּמֹתָם
  choice: leurs hauts lieux
  rationale: « Hauts lieux » est le terme français consacré pour ces sites cultuels, sans réduire nécessairement leur sens à de simples sanctuaires situés sur des collines.
- source_word: תַּשְׁמִידוּ
  choice: vous démolirez
  rationale: Appliqué à des sites cultuels, le hiphil de שׁמד exprime leur destruction complète. « Démolir » convient concrètement aux hauts lieux et distingue ce dernier ordre des deux emplois répétés de אבד.
theological_decisions:
- issue: Ordres concernant la population cananéenne et ses lieux de culte
  choice: Traduire directement l’ordre de chasser les habitants et de détruire leurs objets et sites cultuels.
  alternative: Affaiblir le premier ordre en le limitant à une dépossession juridique, ou généraliser les termes cultuels en parlant seulement de pratiques religieuses.
  rationale: Le texte hébreu formule explicitement l’expulsion des habitants et la destruction d’objets et de sites cultuels déterminés. La traduction ne doit ni atténuer ces ordres ni leur ajouter une justification théologique absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative conserve la forme solennelle de la série d’ordres. La répétition de « vous détruirez » reproduit volontairement l’insistance de l’hébreu.
