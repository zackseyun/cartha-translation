lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule des étapes au désert, נסע désigne le départ d’un camp pour poursuivre la route. « Partirent » est naturel en français moderne et exprime clairement ce mouvement.
- source_word: מִדָּפְקָה
  choice: de Dofqa
  rationale: La préposition מִן indique le point de départ (« de »). Le nom propre דָּפְקָה est translittéré selon une forme française proche de l’hébreu.
- source_word: וַיַּחֲנוּ
  choice: campèrent
  rationale: Dans cet itinéraire, חנה signifie établir son camp. « Campèrent » est précis, courant et concis.
- source_word: בְּאָלוּשׁ
  choice: à Aloush
  rationale: La préposition בְּ marque ici le lieu de l’étape. « À » convient naturellement devant ce nom de lieu, translittéré « Aloush » en français.
