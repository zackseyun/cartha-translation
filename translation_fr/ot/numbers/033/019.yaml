  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: fr
  text: Ils partirent de Ritma et campèrent à Rimmôn-Pérets.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע désigne le fait de lever le camp et de reprendre la route. « Partirent » est naturel en français moderne et convient à la succession des étapes.
- source_word: מֵרִתְמָה
  choice: de Ritma
  rationale: La préposition מִן indique le point de départ, rendu par « de ». Le nom de lieu est transcrit selon une forme française claire et proche de l’hébreu.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: חנה est le verbe habituel des itinéraires pour l’établissement d’un camp. « Campèrent » est précis, courant et moins marqué que « établirent leur camp ».
- source_word: בְּרִמֹּן פָּרֶץ
  choice: à Rimmôn-Pérets
  rationale: La préposition בְּ indique ici le lieu de l’étape et se rend naturellement par « à ». Le toponyme composé est transcrit avec un trait d’union, tout en conservant ses deux éléments hébreux.
