lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע exprime le départ d’un campement pour poursuivre la route. « Partirent » est naturel en français moderne et convient à la concision de la liste.
- source_word: מִלִּבְנָה
  choice: de Libna
  rationale: La préposition מִן indique ici le point de départ, et לִבְנָה est conservé comme nom de lieu sous une forme française translittérée.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה désigne l’action d’établir le camp. « Campèrent » est précis, courant et fidèle à la formule d’itinéraire.
- source_word: בְּרִסָּה
  choice: à Rissa
  rationale: La préposition בְּ marque le lieu. Devant un nom d’étape, « à » est la tournure idiomatique en français; רִסָּה est translittéré « Rissa ».
