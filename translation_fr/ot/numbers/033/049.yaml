  text: וַ/יַּחֲנ֤וּ עַל הַ/יַּרְדֵּן֙ מִ/בֵּ֣ית הַיְשִׁמֹ֔ת עַ֖ד אָבֵ֣ל הַשִּׁטִּ֑ים בְּ/עַֽרְבֹ֖ת מוֹאָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: fr
  text: Ils campèrent près du Jourdain, depuis Beth-Yeshimoth jusqu’à Abel-Shittim, dans les plaines de Moab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les steppes de Moab ». Le terme hébreu désigne la région plate et steppique de Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: Ils campèrent
  rationale: Le wayyiqtol de חנה poursuit le récit des étapes d’Israël. « Campèrent » est naturel, actuel et fidèle au sens.
- source_word: עַל הַיַּרְדֵּן
  choice: près du Jourdain
  rationale: Avec un cours d’eau, עַל indique ici une position à proximité plutôt que littéralement dessus. « Près du Jourdain » convient au contexte du campement.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: depuis Beth-Yeshimoth
  rationale: Le préfixe מִן marque le point de départ de l’étendue occupée par le camp. Le toponyme hébreu est translittéré selon un usage français lisible.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: jusqu’à Abel-Shittim
  rationale: עַד marque le terme de l’étendue géographique. « Jusqu’à » exprime clairement cette limite, et le toponyme est translittéré.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: עֲרָבוֹת désigne la région plate et steppique de Moab. « Plaines » est clair et traditionnel en français, tandis que la note conserve l’autre nuance lexicale possible.
