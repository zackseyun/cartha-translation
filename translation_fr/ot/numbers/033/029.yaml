  yaml_path: translation/ot/numbers/033/029.yaml
  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: fr
  text: Ils partirent de Mitka et campèrent à Hashmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans la formule d’itinéraire du désert, נסע exprime le départ d’une étape vers une autre. « Partirent » est naturel en français moderne et conserve clairement ce mouvement.
- source_word: מִמִּתְקָה
  choice: de Mitka
  rationale: La préposition מִן indique la provenance et se rend par « de ». מִתְקָה est un nom de lieu, transcrit en français « Mitka ».
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה désigne ici l’établissement du camp à l’étape suivante. « Campèrent » est la formulation française courante et précise.
- source_word: בְּחַשְׁמֹנָה
  choice: à Hashmona
  rationale: Dans ce contexte d’itinéraire, la préposition בְּ introduit le lieu où le peuple campe et se rend naturellement par « à ». חַשְׁמֹנָה est transcrit « Hashmona ».
