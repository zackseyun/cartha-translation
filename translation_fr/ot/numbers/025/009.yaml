  text: And those who died in the plague were twenty-four thousand.
translation:
  language: fr
  text: Ceux qui moururent lors du fléau furent au nombre de vingt-quatre mille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: furent au nombre de
  rationale: Dans cette formule de dénombrement, היה introduit le total. « Furent au nombre de » est naturel en français et exprime clairement la valeur numérique de la proposition.
- source_word: הַמֵּתִים
  choice: Ceux qui moururent
  rationale: Le participe de מות désigne les personnes mortes. « Ceux qui moururent » conserve la référence personnelle et convient au récit au passé.
- source_word: בַּמַּגֵּפָה
  choice: lors du fléau
  rationale: מַגֵּפָה désigne ici une calamité mortelle, traditionnellement rendue par « fléau ». La préposition ב situe les décès dans cet événement sans trancher plus explicitement entre circonstance et cause.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: vingt-quatre mille
  rationale: Il s’agit de l’expression numérique hébraïque standard pour 24 000, rendue selon l’ordre idiomatique du français moderne.
