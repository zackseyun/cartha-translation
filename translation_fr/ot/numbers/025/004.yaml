id: NUM.25.4
reference: Numbers 25:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse[a] : « Prends tous les chefs du peuple et empale-les pour Yahweh en plein jour[b], afin que la colère ardente de Yahweh se détourne d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « Prends tous les chefs du peuple et fais-leur exécuter les coupables pour Yahweh en plein jour. » En hébreu, le pronom « les » renvoie le plus directement aux chefs, mais certains comprennent que ceux-ci doivent appliquer la peine.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « devant le soleil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: קַח
  choice: Prends
  rationale: L’impératif de לקח désigne directement l’action que Moïse doit exercer envers les chefs.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: tous les chefs du peuple
  rationale: « Chefs » restitue naturellement en français le sens métaphorique de רָאשֵׁי et évite l’ambiguïté corporelle de « têtes ».
- source_word: וְהוֹקַע אוֹתָם
  choice: et empale-les
  rationale: Le hiphil de יקע évoque ici une mise à mort ou une exposition publique violente. « Empaler » en conserve la force, tandis que le pronom renvoie le plus directement, sur le plan syntaxique, aux chefs.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל exprime ici la destination ou la consécration de l’acte à Yahweh; « pour » évite de lui donner le sens plus précis de « devant », normalement exprimé autrement.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: en plein jour
  rationale: L’expression signifie littéralement « devant le soleil » et évoque une exposition ouverte et publique à la lumière du jour.
- source_word: וְיָשֹׁב
  choice: afin que … se détourne
  rationale: 'Après l’ordre, la forme exprime le but ou le résultat attendu : que la colère s’éloigne d’Israël.'
- source_word: חֲרוֹן אַף יְהוָה
  choice: la colère ardente de Yahweh
  rationale: Cette formulation garde l’image hébraïque de la chaleur et l’intensité de la colère divine.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La préposition מן marque l’éloignement; avec « se détourner », « d’Israël » est naturel et précis.
theological_decisions:
- issue: Référent de « les » dans « empale-les »
  choice: Le pronom renvoie syntaxiquement à « tous les chefs du peuple ».
  alternative: Les chefs seraient chargés de faire exécuter les coupables plutôt que d’être eux-mêmes mis à mort.
  rationale: L’antécédent pluriel immédiat du pronom est « tous les chefs du peuple ». Toutefois, le verset suivant ordonne aux juges de tuer les hommes liés au Baal de Peor, ce qui soutient une autre compréhension. Le texte principal suit la syntaxe la plus directe et la note préserve cette réelle tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste directe face à la violence judiciaire du passage, sans l’atténuer. « En plein jour » rend idiomatiquement l’expression hébraïque, tandis que les notes conservent l’ambiguïté syntaxique et le sens littéral.
