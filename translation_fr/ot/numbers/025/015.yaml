source:
  edition: WLC
  text: וְ/שֵׁ֨ם הָֽ/אִשָּׁ֧ה הַ/מֻּכָּ֛ה הַ/מִּדְיָנִ֖ית כָּזְבִּ֣י בַת צ֑וּר רֹ֣אשׁ אֻמּ֥וֹת בֵּֽית אָ֛ב בְּ/מִדְיָ֖ן הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: fr
  text: Et la femme madianite qui avait été tuée s’appelait Kozbi, fille de Tsour. Celui-ci était chef des clans[a] d’une maison paternelle[b] en Madian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des peuples ». Le terme hébreu peut désigner des peuples ou, dans ce contexte de parenté, des groupes claniques.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « maison paternelle » désigne une famille élargie ou une maisonnée ancestrale.
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם הָאִשָּׁה
  choice: Et la femme … s’appelait
  rationale: Cette tournure française naturelle rend littéralement l’idée « et le nom de la femme était », tout en conservant par « Et » le lien narratif avec le verset précédent.
- source_word: הַמֻּכָּה
  choice: qui avait été abattue
  rationale: Le participe passif de נכה évoque une personne frappée et terrassée. « Abattue » convient au contexte de mise à mort sans effacer complètement cette image verbale.
- source_word: הַמִּדְיָנִית
  choice: madianite
  rationale: Adjectif ethnique français courant correspondant à la désignation hébraïque.
- source_word: כָּזְבִּי
  choice: Kozbi
  rationale: Translittération française transparente du nom hébreu, avec k pour כ et z pour ז.
- source_word: בַת צוּר
  choice: fille de Tsour
  rationale: Rend directement la filiation exprimée par la chaîne construite; « Tsour » suit une translittération française usuelle de צוּר.
- source_word: רֹאשׁ
  choice: chef
  rationale: Dans ce contexte social, רֹאשׁ désigne le dirigeant; « chef » transmet naturellement en français la valeur métaphorique de « tête ».
- source_word: אֻמּוֹת
  choice: clans
  rationale: Bien que le terme puisse désigner des peuples, son association avec « maison paternelle » favorise ici le sens de groupes de parenté. Une note conserve l’autre possibilité.
- source_word: בֵּית אָב
  choice: maison paternelle
  rationale: Rendu assez formel du terme hébreu de parenté désignant une famille élargie ou maisonnée ancestrale; la note en explique la portée culturelle.
- source_word: בְּמִדְיָן
  choice: en Madian
  rationale: Rendu locatif naturel de la préposition ב dans ce contexte.
- source_word: הוּא
  choice: Celui-ci était
  rationale: Le pronom masculin reprend Tsour et sert à introduire son statut. Une nouvelle phrase avec « Celui-ci » lève l’ambiguïté syntaxique sans modifier le référent grammatical.
