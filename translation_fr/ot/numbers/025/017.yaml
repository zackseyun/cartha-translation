  text: צָר֖וֹר אֶת הַ/מִּדְיָנִ֑ים וְ/הִכִּיתֶ֖ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/017.yaml
  text: Harass the Midianites and strike them down,[a]
translation:
  language: fr
  text: Montrez-vous hostiles envers les Madianites et frappez-les.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Harcelez les Madianites et frappez-les. » Le verbe hébreu צָרוֹר peut exprimer le fait de manifester de l’hostilité envers quelqu’un ou de le traiter en ennemi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: Harcelez
  rationale: L’infinitif absolu qal de צרר employé comme impératif exprime une hostilité active et persistante envers un adversaire. « Harcelez » rend cette force de façon concise, sans préciser indûment une tactique particulière.
- source_word: הַמִּדְיָנִים
  choice: les Madianites
  rationale: Forme française conventionnelle de l’ethnonyme désignant le peuple de Madian.
- source_word: וְהִכִּיתֶם
  choice: et frappez-les
  rationale: Le hifil de נכה peut signifier frapper, abattre ou vaincre. « Frappez-les » conserve ici la violence et l’ouverture sémantique du verbe sans imposer nécessairement l’idée de tuer ou seulement celle de vaincre.
- source_word: אוֹתָם
  choice: -les
  rationale: Pronom objet direct renvoyant aux Madianites, naturellement rendu en français par le pronom clitique « les ».
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur de l’objet direct défini, sans équivalent lexical autonome en français.
theological_decisions:
- issue: Rendre un ordre divin d’hostilité et de violence sans l’atténuer ni l’amplifier
  choice: Harcelez les Madianites et frappez-les
  alternative: Traitez les Madianites en ennemis et abattez-les
  rationale: Les deux injonctions directes sont conservées avec leur dureté. La formulation n’ajoute ni justification théologique absente du verset ni précision selon laquelle tous doivent nécessairement être tués.
translation_notes:
  register: Français international moderne, direct et digne. « Harcelez » suit de près la valeur impérative de צָרוֹר, tandis que la note préserve son sens relationnel plus large. La coordination brève reproduit la force des deux ordres hébreux.
