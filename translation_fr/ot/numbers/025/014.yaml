base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: fr
  text: Le nom de l’homme israélite qui fut mis à mort[a], qui fut mis à mort avec la femme madianite, était Zimri, fils de Salou, chef d’une maison paternelle[b] parmi les Siméonites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète le verbe : « qui fut mis à mort, qui fut mis à mort avec la femme madianite ». Cette répétition produit un effet d’insistance.'
    reason: lexical_alternative
  - marker: b
    text: Une « maison paternelle » était une unité familiale ou clanique constituée selon la lignée du père.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: Le nom
  rationale: Le nom introduit l’identification qui suit, tandis que la continuité narrative portée par וְ ressort du contexte sans qu’il soit nécessaire d’ajouter « maintenant ».
- source_word: אִישׁ יִשְׂרָאֵל
  choice: l’homme israélite
  rationale: Cette formulation conserve la référence explicite à un homme appartenant au peuple d’Israël.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: qui fut frappé à mort, qui fut frappé à mort
  rationale: La répétition du verbe נכה est conservée afin de rendre l’insistance délibérée de l’hébreu; « frappé à mort » exprime clairement l’issue fatale dans ce contexte.
- source_word: אֶת הַמִּדְיָנִית
  choice: avec la Madianite
  rationale: Dans cette construction passive, אֶת indique ici que l’homme fut tué en même temps que la femme madianite. Le féminin substantivé permet en français « la Madianite ».
- source_word: זִמְרִי בֶּן סָלוּא
  choice: Zimri, fils de Salou
  rationale: Les noms propres suivent leurs formes françaises usuelles, avec la filiation exprimée naturellement.
- source_word: נְשִׂיא
  choice: chef
  rationale: Le terme désigne ici le responsable d’un groupe familial; « chef » est précis et n’introduit pas la connotation royale possible de « prince ».
- source_word: בֵית אָב
  choice: maison paternelle
  rationale: Cette expression conserve le terme social hébreu désignant une unité familiale ou clanique organisée selon la lignée paternelle.
- source_word: לַשִּׁמְעֹנִי
  choice: parmi les Siméonites
  rationale: La formule indique l’appartenance de cette maison paternelle à la tribu de Siméon.
