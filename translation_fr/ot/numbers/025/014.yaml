  terminology: « Chef », « maison paternelle » et « Siméonites » conviennent. La note culturelle explique utilement le caractère patrilinéaire de la maison paternelle. La note a doit toutefois donner une citation française cohérente avec le texte révisé et éviter de présenter « frappé » comme une reproduction littérale complète de la formulation traduite.
