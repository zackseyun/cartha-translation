  to: Car ils vous sont hostiles par les manœuvres par lesquelles ils vous ont trompés dans l’affaire de Péor[a] et dans celle de Kozbi, fille d’un chef de Madian, leur sœur[b], qui fut frappée le jour du fléau à cause de l’affaire de Péor.
  rationale: La révision rétablit explicitement l’idée de tromperie portée par נִכְּלוּ, améliore la fluidité du français et replace l’ancre de la note explicative au mot qu’elle commente. « Qui fut frappée » conserve l’imagerie passive de נכה sans ajouter au texte l’expression « à mort » ; le contexte établit néanmoins que Kozbi est morte.
