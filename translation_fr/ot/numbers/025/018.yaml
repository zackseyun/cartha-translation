id: NUM.25.18
reference: Numbers 25:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: fr
  text: Car ils vous sont hostiles par les manœuvres par lesquelles ils vous ont trompés dans l’affaire de Péor[a] et dans celle de Kozbi, fille d’un chef de Madian, leur sœur[b], qui fut frappée le jour du fléau à cause de l’affaire de Péor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Péor renvoie à l’épisode de Baal-Péor raconté plus haut dans ce chapitre.
    reason: cross_reference
  - marker: b
    text: Littéralement « leur sœur » ; l’expression peut désigner une femme de leur peuple ou de leur groupe de parenté.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: se montrent hostiles
  rationale: Le participe exprime une hostilité persistante. Cette formulation prédicative est naturelle en français et n’ajoute pas une nuance militaire absente du terme.
- source_word: בְּנִכְלֵיהֶם
  choice: par leurs manœuvres
  rationale: Le nom désigne des procédés rusés et trompeurs; « manœuvres » rend clairement le moyen employé tout en conservant la nuance de calcul hostile.
- source_word: נִכְּלוּ
  choice: celles qu’ils ont employées contre vous
  rationale: La reprise de « manœuvres » fait entendre la parenté entre le nom et le verbe hébreux. « Contre vous » préserve l’orientation hostile du complément לָכֶם sans réduire l’action au seul fait de tromper.
- source_word: עַל דְּבַר פְּעוֹר
  choice: dans l’affaire de Péor / à cause de l’affaire de Péor
  rationale: L’expression idiomatique signifie « au sujet de, dans l’affaire de » et peut prendre une valeur causale. La première occurrence situe les manœuvres; la dernière indique la cause du fléau.
- source_word: כָּזְבִּי
  choice: Kozbi
  rationale: Translittération française usuelle et transparente du nom propre hébreu.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: fille d’un chef de Madian
  rationale: נשיא désigne ici un dirigeant ou chef. « Chef » est courant et évite les connotations monarchiques possibles de « prince ».
- source_word: אֲחֹתָם
  choice: leur sœur
  rationale: 'La traduction littérale conserve l’expression familiale et son ambiguïté: il peut s’agir d’une sœur au sens strict ou d’une femme appartenant à leur peuple ou groupe de parenté.'
- source_word: הַמֻּכָּה
  choice: qui fut frappée à mort
  rationale: Le participe passif de נכה évoque le fait de frapper; le contexte de 25.8 établit la mort. La formulation française conserve l’image verbale tout en étant non ambiguë.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: le jour du fléau
  rationale: Rendu temporel direct et idiomatique. « Fléau » convient à une calamité meurtrière envoyée sous forme d’épidémie ou de plaie, sans préciser davantage sa nature.
theological_decisions:
- issue: Référent de « Péor »
  choice: Conserver le nom « Péor » dans le texte et expliquer en note qu’il renvoie à l’épisode de Baal-Péor.
  alternative: Développer directement en « Baal-Péor ».
  rationale: L’hébreu porte seulement פְּעוֹר. Le développement clarifierait le référent, mais dépasserait la formulation du texte source.
- issue: Valeur des deux occurrences de עַל דְּבַר פְּעוֹר
  choice: Rendre la première par « dans l’affaire de Péor » et la seconde par « à cause de l’affaire de Péor ».
  alternative: Employer une formulation identique aux deux endroits.
  rationale: La même expression idiomatique prend ici une nuance situationnelle dans la première proposition et causale dans la dernière. La variation française respecte ces fonctions contextuelles sans modifier le référent.
- issue: Portée de « leur sœur »
  choice: Maintenir l’expression littérale dans le texte avec une note sur sa possible portée collective.
  alternative: Traduire directement « une femme de leur peuple » ou « leur parente ».
  rationale: Le texte hébreu dit littéralement « leur sœur ». Une reformulation collective lèverait une ambiguïté réelle que la traduction doit préserver.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition rhétorique de « l’affaire de Péor » ainsi que l’expression familiale « leur sœur ». « Manœuvres » évite le registre trop familier de « ruses » tout en exprimant le caractère calculé et trompeur de l’action.
