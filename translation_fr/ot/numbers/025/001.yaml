  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: fr
  text: Pendant qu’Israël séjournait à Shittim, le peuple commença à se livrer à la débauche avec les filles de Moab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « se livrer à l’immoralité sexuelle avec les femmes moabites » ; hébreu : « commencer à se prostituer avec les filles de Moab ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: séjournait
  rationale: Le verbe ישׁב peut signifier habiter, demeurer ou rester. « Séjournait » convient au campement d’Israël sans suggérer une installation définitive.
- source_word: בַּשִּׁטִּים
  choice: à Shittim
  rationale: Le nom de lieu est translittéré; la préposition « à » est la tournure française naturelle pour situer un séjour.
- source_word: וַיָּחֶל
  choice: commença
  rationale: Dans cette construction, le verbe exprime clairement le commencement de l’action.
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom désigne collectivement les Israélites et se rend naturellement par « le peuple ».
- source_word: לִזְנוֹת
  choice: à se prostituer
  rationale: Le verbe זנה évoque explicitement la prostitution ou une conduite sexuelle illicite. Cette formulation conserve la vigueur de l’image hébraïque plutôt que de la réduire à une abstraction morale.
- source_word: אֶל
  choice: avec
  rationale: Avec זנה et des personnes comme complément, אֶל indique ici les partenaires de la conduite sexuelle; « avec » exprime ce rapport idiomatiquement en français.
- source_word: בְּנוֹת מוֹאָב
  choice: les filles de Moab
  rationale: Cette traduction conserve l’expression hébraïque collective et reste claire en français; « les femmes moabites » serait une formulation plus dynamique.
theological_decisions:
- issue: Nature de la faute d’Israël
  choice: Employer explicitement le langage de la prostitution
  alternative: « se livrer à l’immoralité sexuelle avec les femmes moabites »
  rationale: Le verbe hébreu est concret et vigoureux. Le rendre par « se prostituer » préserve sa force sexuelle et son image d’infidélité sans ajouter au verset une interprétation théologique ultérieure.
translation_notes:
  register: Français moderne, courant et digne. « Pendant que » rend naturellement l’arrière-plan narratif; « séjournait » évite l’idée d’une implantation permanente. La tournure volontairement forte « se prostituer » suit l’image hébraïque, tandis que la note fournit une formulation française plus explicative.
