base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: fr
  text: Il suivit l’homme israélite jusque dans la chambre[a] et les transperça tous les deux — l’homme israélite et la femme — jusque dans le ventre de celle-ci[b]. Alors le fléau qui frappait les fils d’Israël[c] s’arrêta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pièce intérieure », « l’alcôve » ou « le pavillon ». Le terme hébreu est rare et désigne vraisemblablement un espace intérieur ou retiré.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne le ventre ou la cavité abdominale. La préposition peut se rendre par « dans » ou « jusque dans »; la trajectoire exacte du coup n’est pas entièrement précisée.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « les fils d’Israël », expression hébraïque habituelle désignant collectivement le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: la chambre
  rationale: Ce nom rare désigne vraisemblablement un espace intérieur ou retiré. « La chambre » reste naturelle et évite de préciser sans certitude qu’il s’agissait d’une tente, d’une alcôve ou d’un pavillon.
- source_word: וַיִּדְקֹר
  choice: transperça
  rationale: Le verbe exprime un coup pénétrant porté avec une arme. « Transperça » en conserve la violence et suggère que les deux personnes ont été atteintes ensemble, sans ajout descriptif.
- source_word: שְׁנֵיהֶם
  choice: tous les deux
  rationale: Cette formulation rend explicitement l’expression hébraïque et indique que l’homme et la femme ont été frappés ensemble.
- source_word: אֶל קֳבָתָהּ
  choice: atteignant celle-ci au ventre
  rationale: קֳבָה désigne le ventre ou la cavité abdominale. La formulation conserve le détail anatomique et rattache clairement le suffixe féminin à la femme, tout en évitant de donner à אֶל un sens instrumental trop précis.
- source_word: וַתֵּעָצַר
  choice: s’arrêta
  rationale: Le niphal indique que le fléau fut stoppé. En français courant, « s’arrêta » exprime naturellement ce résultat sans lourdeur passive.
- source_word: הַמַּגֵּפָה
  choice: le fléau
  rationale: Dans ce contexte de jugement collectif, « fléau » est un terme français naturel et digne; il ne précise pas indûment la nature médicale de l’événement.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: qui frappait les fils d’Israël
  rationale: Cette tournure idiomatique exprime que le fléau pesait sur le peuple puis cessa, tout en conservant l’expression traditionnelle « fils d’Israël ».
- source_word: אִישׁ יִשְׂרָאֵל
  choice: l’homme israélite
  rationale: Le rendu conserve à la fois la référence masculine explicite de אִישׁ et l’appartenance de l’homme à Israël.
theological_decisions:
- issue: Portée collective de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: L’expression hébraïque est une désignation collective consacrée du peuple. La traduction en conserve la forme genrée sans prétendre que seules les personnes de sexe masculin sont visées; la note explicite sa portée collective.
- issue: Détail anatomique de la scène de jugement
  choice: atteignant celle-ci au ventre
  alternative: à l’abdomen / à travers son ventre
  rationale: Le texte fournit un détail corporel concret qui ne doit pas être atténué. « Ventre » reste exact et courant, tandis que « abdomen » serait plus clinique et « à travers » préciserait davantage la trajectoire que ne le fait nécessairement la préposition hébraïque.
- issue: Lien entre l’acte de Pinhas et l’arrêt du fléau
  choice: conserver la succession narrative sans ajouter d’explication causale
  alternative: indiquer explicitement que son acte fit cesser le fléau
  rationale: Le récit juxtapose l’acte et l’arrêt du fléau, ce qui suggère un lien, mais le verset n’emploie pas ici de conjonction causale explicite. La traduction préserve cette tension sans commentaire doctrinal.
translation_notes:
  register: Français international moderne, narratif et digne. La violence et le détail anatomique du texte sont conservés sans dramatisation supplémentaire. Les tirets clarifient l’apposition hébraïque, et les notes signalent les principales incertitudes lexicales.
