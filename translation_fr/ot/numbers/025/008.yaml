- from: Il suivit l’homme israélite jusque dans la chambre[a] et les transperça tous les deux — l’homme israélite et la femme —, atteignant celle-ci au ventre[b]. Alors le fléau qui frappait les fils d’Israël[c] s’arrêta.
  to: Il suivit l’homme israélite jusque dans la chambre[a] et les transperça tous les deux — l’homme israélite et la femme — jusque dans le ventre de celle-ci[b]. Alors le fléau qui frappait les fils d’Israël[c] s’arrêta.
