id: NUM.25.13
reference: Numbers 25:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: fr
  text: Elle sera pour lui et pour sa descendance après lui une alliance garantissant un sacerdoce perpétuel[a], parce qu’il a été jaloux pour son Dieu[b] et a fait l’expiation pour les fils d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sacerdoce pour toujours ».
    reason: alternative_reading
  - marker: b
    text: Ou « il a été zélé pour son Dieu ». Le verbe hébreu peut exprimer la jalousie liée à l’alliance ou le zèle.
    reason: lexical_alternative
  - marker: c
    text: « Les fils d’Israël » est la désignation nationale hébraïque traditionnelle et désigne ici le peuple d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Elle sera
  rationale: Le féminin singulier renvoie naturellement à l’alliance mentionnée ensuite. Le futur exprime la promesse divine, tandis que la conjonction initiale est absorbée pour produire un français fluide.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: pour lui et pour sa descendance après lui
  rationale: « Descendance » conserve la valeur collective singulière de זֶרַע et « après lui » maintient explicitement l’idée de succession.
- source_word: בְּרִית כְּהֻנַּת עוֹלָם
  choice: une alliance garantissant un sacerdoce perpétuel
  rationale: « Alliance » est le terme consacré pour בְּרִית. La tournure « garantissant » explicite naturellement en français le rapport entre l’alliance et le sacerdoce sans en changer le contenu. « Perpétuel » rend la continuité institutionnelle de עוֹלָם sans imposer une notion philosophique abstraite d’éternité.
- source_word: תַּחַת אֲשֶׁר
  choice: parce que
  rationale: Dans ce contexte, la locution indique le motif de l’octroi de l’alliance ; « parce que » est direct et idiomatique.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: il a été jaloux pour son Dieu
  rationale: Cette formulation conserve la nuance de jalousie d’alliance et de défense de l’honneur exclusif de Dieu. Comme elle est moins courante en français que « zélé pour », cette autre possibilité est signalée en note.
- source_word: וַיְכַפֵּר
  choice: a fait l’expiation
  rationale: « Faire l’expiation » restitue le vocabulaire cultuel de כפר dans une formulation traditionnelle mais encore compréhensible.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: La traduction garde la forme masculine et la désignation nationale traditionnelle de l’hébreu ; une note précise qu’elle vise collectivement le peuple.
theological_decisions:
- issue: Sens de קנא appliqué à l’action de Pinhas
  choice: il a été jaloux pour son Dieu
  alternative: il a été zélé pour son Dieu
  rationale: L’hébreu peut exprimer à la fois la jalousie liée à l’exclusivité de l’alliance et le zèle pour l’honneur de Dieu. Le texte principal retient la correspondance lexicale la plus proche et la note préserve l’autre nuance légitime.
- issue: Portée de עוֹלָם dans la promesse sacerdotale
  choice: un sacerdoce perpétuel
  alternative: un sacerdoce pour toujours
  rationale: « Perpétuel » exprime une continuité durable et institutionnelle sans trancher au-delà de ce que le terme hébreu impose dans ce contexte.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: le peuple d’Israël
  rationale: Le texte principal reproduit la désignation nationale masculine de l’hébreu, tandis que la note clarifie sa portée collective.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en rendant explicite, par « garantissant », le lien naturel entre l’alliance et le sacerdoce. Les termes cultuels « alliance », « sacerdoce » et « expiation » sont conservés en raison de leur précision contextuelle.
