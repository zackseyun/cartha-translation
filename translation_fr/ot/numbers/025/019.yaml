  text: Après le fléau,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: il arriva ceci
  rationale: La forme narrative de היה sert ici de transition et introduit vraisemblablement la suite du récit. « Il arriva ceci » reste naturel en français moderne tout en conservant la fonction introductive de la formule hébraïque.
- source_word: אַחֲרֵי
  choice: après
  rationale: La préposition exprime directement la succession temporelle ; « après » est la formulation française la plus simple et naturelle.
- source_word: הַמַּגֵּפָה
  choice: le fléau
  rationale: Dans ce contexte de jugement entraînant de nombreux morts, מַגֵּפָה désigne un fléau meurtrier. « Le fléau » convient au registre biblique sans imposer l'idée moderne d'une maladie épidémique.
theological_decisions:
- issue: Formule narrative constituant à elle seule le verset
  choice: Présenter la proposition comme une transition ouverte sur la suite, avec deux-points.
  alternative: 'En faire une phrase autonome : « Cela se passa après le fléau. »'
  rationale: Le texte hébreu est une brève formule de transition et la division massorétique marque ici une rupture. Les deux-points rendent sa fonction introductive sans ajouter de contenu doctrinal ni déplacer la limite du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure évite l'archaïsme « il advint » ainsi que la lecture trop étroitement médicale que pourrait suggérer « épidémie ».
