lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le waw narratif fait progresser le récit; « Puis » exprime naturellement la succession, et « parla » rend דבר dans cette formule de discours.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel présent dans le texte hébreu.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne le destinataire de la parole; « Moïse » est la forme française usuelle du nom.
- source_word: לֵּאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule introduit le contenu du discours qui suit. En français actuel, « en ces termes : » conserve cette fonction plus naturellement qu’un littéral « disant ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement sans lui substituer un titre; la variante traditionnelle n’est pas nécessaire pour comprendre ce verset.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure formulaire reste perceptible, tandis que les deux-points annoncent clairement la parole rapportée au verset suivant.
