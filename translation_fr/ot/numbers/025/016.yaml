lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol introduit un nouvel événement narratif. « Parla » convient à la formule solennelle et récurrente de la parole divine.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: En français biblique courant, « l’Éternel » est une désignation traditionnelle et immédiatement reconnaissable du tétragramme, tout en évitant une vocalisation incertaine du nom.
- source_word: אֶל
  choice: à
  rationale: La préposition marque ici le destinataire de la parole ; « à » est son équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule introduit le contenu du discours. « En ces termes » rend naturellement sa fonction en français et prépare les paroles qui suivent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: l’Éternel
  alternative: Yahvé
  rationale: Le texte porte le tétragramme. « L’Éternel » suit un usage français biblique bien établi ; « Yahvé » serait une translittération possible, mais dépend d’une vocalisation reconstruite.
translation_notes:
  register: Français moderne, digne et fluide. La tournure « en ces termes » évite le calque peu naturel « disant » et conserve la fonction introductive de לֵאמֹר.
