id: NUM.25.2
reference: Numbers 25:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תִּקְרֶ֣אןָ לָ/עָ֔ם לְ/זִבְחֵ֖י אֱלֹהֵי/הֶ֑ן וַ/יֹּ֣אכַל הָ/עָ֔ם וַ/יִּֽשְׁתַּחֲוּ֖וּ לֵֽ/אלֹהֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: fr
  text: Elles invitèrent le peuple aux sacrifices offerts à leurs dieux, et le peuple mangea et se prosterna devant leurs dieux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adora leurs dieux ». Le verbe hébreu désigne littéralement le fait de s’incliner ou de se prosterner, souvent comme acte d’adoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: Elles invitèrent
  rationale: Le qal narratif à la 3e personne du féminin pluriel renvoie aux femmes moabites du verset précédent. Avec un complément introduit par לְ, « inviter » exprime naturellement l'appel à participer.
- source_word: לָעָם
  choice: le peuple
  rationale: L'hébreu emploie עָם avec l'article sans répéter « Israël » ; la formulation conserve cette sobriété.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: aux sacrifices offerts à leurs dieux
  rationale: זִבְחֵי est un pluriel construit désignant les sacrifices associés à ces divinités. « Offerts à » rend clairement et naturellement en français la destination cultuelle sans suggérer que les dieux eux-mêmes seraient sacrifiés.
- source_word: וַיֹּאכַל
  choice: mangea
  rationale: Le sujet collectif singulier הָעָם commande naturellement le singulier en français. Le verbe direct « manger » conserve la simplicité du récit.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prosterna
  rationale: Le verbe désigne concrètement le fait de s'incliner ou de se prosterner, souvent comme acte d'adoration. « Se prosterner » préserve à la fois le geste corporel et sa portée cultuelle sans remplacer le geste par une interprétation.
- source_word: לֵאלֹהֵיהֶן
  choice: devant leurs dieux
  rationale: Après השתחוה, לְ marque l'être auquel l'hommage est adressé. En français, « se prosterner devant » est plus idiomatique que « se prosterner à ».
theological_decisions:
- issue: Portée cultuelle de וַיִּשְׁתַּחֲווּ
  choice: se prosterna devant leurs dieux
  alternative: adora leurs dieux
  rationale: Le texte traduit conserve le geste concret exprimé par l'hébreu, tandis que la note signale explicitement son sens fréquent d'adoration. Cela préserve la texture narrative et l'implication idolâtre sans les confondre.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme excessif. La répétition de « leurs dieux » suit celle de l'hébreu. Le marqueur [a] est placé après la proposition concernée.
