  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: fr
  text: Israël s’attacha au Baal de Péor[a], et la colère de Yahweh s’enflamma contre Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se joignit au Baal de Péor » ou « se mit sous le joug du Baal de Péor ». On peut aussi traduire le nom par « Baal-Péor ».
    reason: Alternative lexicale et forme possible du nom divin local.
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: s’attacha
  rationale: Le nifal de צמד exprime ici le fait de se joindre ou de s’attacher étroitement à quelqu’un. « S’attacha » est naturel en français et conserve la portée relationnelle et idolâtre du verbe sans explicitation excessive.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom du peuple.
- source_word: לְבַעַל פְּעוֹר
  choice: au Baal de Péor
  rationale: « Baal » désigne ici la divinité, tandis que « de Péor » précise sa manifestation locale. L’article contracté « au » produit une formulation française naturelle et rend la relation du groupe hébreu.
- source_word: וַיִּחַר אַף
  choice: la colère … s’enflamma
  rationale: Cette expression hébraïque décrit littéralement la colère comme devenant brûlante. « S’enflamma » préserve cette métaphore dans un français actuel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que remplacé par un titre.
- source_word: בְּיִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec l’expression désignant la colère, la préposition ב marque son objet ; « contre » est la tournure française idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel et ne lui substitue pas un titre.
- issue: Nature du lien d’Israël avec le Baal de Péor
  choice: s’attacha
  alternative: se joignit ; se mit sous le joug
  rationale: Le choix conserve l’idée d’une union étroite et coupable sans préciser au-delà du texte s’il s’agit formellement d’un lien cultuel, d’une alliance ou d’une image de joug.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore de la colère qui s’enflamme est conservée, tout comme l’ambiguïté relative du verbe décrivant l’attachement d’Israël.
