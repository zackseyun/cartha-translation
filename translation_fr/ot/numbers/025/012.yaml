  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: fr
  text: 'C’est pourquoi, dis : « Voici, je lui donne mon alliance de paix. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend naturellement la relation de conséquence exprimée par l’hébreu.
- source_word: הִנְנִי
  choice: Voici, je
  rationale: Conserve la formule emphatique qui attire l’attention sur l’engagement personnel de Dieu.
- source_word: נֹתֵן לוֹ
  choice: je lui donne
  rationale: Reproduit directement le participe hébreu à valeur présente et l’image du don, sans le remplacer par « conclure avec lui ».
- source_word: בְּרִיתִי שָׁלוֹם
  choice: mon alliance de paix
  rationale: Préserve la construction concise de l’hébreu et la portée riche de שָׁלוֹם, qui évoque la paix et l’intégrité.
theological_decisions:
- issue: Nature du rapport entre l’alliance et la paix
  choice: mon alliance de paix
  alternative: mon alliance qui lui assurera la paix
  rationale: La formulation retenue maintient l’ambiguïté de la construction hébraïque, sans préciser si la paix est le contenu, l’effet ou la qualité de l’alliance.
translation_notes:
  register: Français moderne, digne et direct. « Voici » conserve la solennité de la déclaration divine, tandis que la syntaxe reste accessible.
