revisions:
- from: Phinéas, fils d’Éléazar, fils du prêtre Aaron, a détourné ma fureur des Israélites en étant animé parmi eux de la même ardeur jalouse que moi[a] ; ainsi, je n’ai pas exterminé les Israélites dans mon ardeur jalouse.
  to: Phinéas, fils d’Éléazar, fils d’Aaron, le prêtre, a détourné ma fureur des Israélites en se montrant jaloux de ma jalousie au milieu d’eux[a] ; ainsi, je n’ai pas anéanti les Israélites dans ma jalousie.
  rationale: La révision maintient le sens et le registre du projet, mais remplace une paraphrase explicative par une formulation qui reproduit plus étroitement le parallélisme lexical hébreu. Elle rend aussi plus clairement l'apposition « Aaron, le prêtre » et choisit « anéanti » pour la destruction totale évitée.
