source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: fr
  text: Phinéas, fils d’Éléazar, fils d’Aaron, le prêtre, a détourné ma fureur des Israélites en se montrant jaloux de ma jalousie au milieu d’eux[a] ; ainsi, je n’ai pas anéanti les Israélites dans ma jalousie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en faisant preuve de mon zèle au milieu d’eux… dans mon zèle ». En hébreu, le verbe décrivant l’action de Phinéas et le nom décrivant la réaction de Dieu sont formés sur la même racine, qui peut exprimer le zèle ou la jalousie.'
    reason: Préserver l’alternative lexicale « zèle » et signaler la répétition intentionnelle de la racine קנא.
lexical_decisions:
- source_word: הֵשִׁיב
  choice: a détourné
  rationale: Le hifil de שוב signifie ici faire revenir, écarter ou détourner la fureur. « A détourné » exprime naturellement en français l’action d’écarter un jugement dirigé contre Israël.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: חֵמָה désigne une colère brûlante et intense. « Fureur » conserve cette force mieux que le simple « colère ».
- source_word: מֵעַל
  choice: des Israélites
  rationale: Dans cette construction, מֵעַל marque l’éloignement d’une fureur qui pesait sur eux. Le français idiomatique « détourner ma fureur des Israélites » préserve cette image sans calque maladroit.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression hébraïque, littéralement « les fils d’Israël », fonctionne ici comme nom collectif du peuple. « Les Israélites » est actuel, précis et inclut naturellement toute la communauté visée.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: en étant animé parmi eux de la même ardeur jalouse que moi
  rationale: Le verbe et le nom appartiennent à la même racine קנא. Cette formulation naturelle rend la correspondance entre l’attitude de Phinéas et celle de Dieu, tout en conservant la nuance de jalousie liée à l’exclusivité de l’alliance.
- source_word: בְּתוֹכָם
  choice: parmi eux
  rationale: Rend clairement l’action de Phinéas au sein de la communauté.
- source_word: כִלִּיתִי
  choice: je n’ai pas exterminé
  rationale: Au piel, כלה peut désigner l’anéantissement complet. « Exterminé » communique ici la destruction totale évitée et s’accorde avec le contexte du fléau.
- source_word: בְּקִנְאָתִי
  choice: dans mon ardeur jalouse
  rationale: La reprise de « ardeur jalouse » maintient le lien lexical avec l’expression précédente et la dimension de jalousie divine, plutôt que de la réduire à un zèle générique.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le titre se rapporte le plus naturellement à Aaron. La tournure « fils du prêtre Aaron » est claire et évite de faire croire qu’Éléazar seul est ainsi qualifié.
theological_decisions:
- issue: Sens de la racine קנא appliquée à Phinéas et à Dieu
  choice: ardeur jalouse
  alternative: zèle
  rationale: La racine peut exprimer le zèle ou la jalousie. Dans ce contexte d’exclusivité envers Dieu, « ardeur jalouse » conserve les deux dimensions et la correspondance voulue entre Phinéas et Dieu, sans présenter leur jalousie comme strictement identique en nature.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Le syntagme désigne collectivement le peuple menacé par le fléau. Le rendre par « les Israélites » ne tranche aucune question théologique et communique plus directement la portée communautaire en français moderne.
- issue: Rapport syntaxique de הַכֹּהֵן
  choice: le prêtre qualifie Aaron
  alternative: le prêtre qualifie Phinéas
  rationale: L’ordre des mots favorise l’apposition traditionnelle « Aaron le prêtre ». La formulation française rattache donc explicitement le titre à Aaron.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure hébraïque, mais évite les calques peu naturels. « Ardeur jalouse » rend la tension entre zèle actif et jalousie d’alliance ; la note conserve l’autre possibilité.
