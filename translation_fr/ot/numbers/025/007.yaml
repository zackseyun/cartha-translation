source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: fr
  text: Quand Phinéas, fils d’Éléazar, fils d’Aaron, le prêtre, vit cela[a], il se leva du milieu de l’assemblée[b] et prit une lance en main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vit ». En hébreu, le complément du verbe est sous-entendu et se déduit du contexte précédent.
    reason: lexical_alternative
  - marker: b
    text: Ou « de parmi la communauté » ou « du milieu de la communauté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit cela
  rationale: Le verbe signifie simplement « voir » et son complément est implicite en hébreu. « Vit cela » est naturel en français et renvoie sans précision ajoutée à la scène du verset précédent.
- source_word: פִּינְחָס
  choice: Phinéas
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: fils d’Éléazar et petit-fils du prêtre Aaron
  rationale: Cette formulation française naturelle exprime fidèlement la chaîne généalogique. « Prêtre » qualifie Aaron, sans ajouter le titre de « grand prêtre », absent de l’hébreu.
- source_word: וַיָּקָם
  choice: il se leva
  rationale: Rend directement le mouvement de se lever et la progression narrative, sans amplifier la force du verbe.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: du milieu de l’assemblée
  rationale: « Du milieu de » correspond à תּוֹךְ, tandis qu’« assemblée » désigne naturellement ici la communauté d’Israël réunie.
- source_word: וַיִּקַּח
  choice: et prit
  rationale: Le verbe courant « prendre » suffit ; « saisir » accentuerait inutilement la violence ou la soudaineté du geste.
- source_word: רֹמַח
  choice: une lance
  rationale: Équivalent français clair et général pour cette arme d’hast.
- source_word: בְּיָדוֹ
  choice: en main
  rationale: Expression idiomatique française indiquant qu’il s’arme de la lance, tout en reflétant l’image de l’hébreu.
theological_decisions:
- issue: Rendu de הָעֵדָה
  choice: assemblée
  alternative: communauté, congrégation
  rationale: « Assemblée » conserve l’idée du peuple d’Israël réuni sans importer un sens ecclésiologique ultérieur. « Communauté » est possible, mais exprime moins directement le caractère rassemblé du groupe.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe généalogique a été légèrement explicitée par « petit-fils » pour éviter une succession ambiguë de compléments, sans modifier la relation familiale. Les marqueurs de notes ont été placés sur les expressions auxquelles leurs variantes se rapportent.
