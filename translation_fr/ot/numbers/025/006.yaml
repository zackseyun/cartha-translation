source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: fr
  text: Et voici qu’un homme parmi les fils d’Israël arriva et amena une Madianite auprès de ses frères[a], sous les yeux de Moïse et sous les yeux de toute la communauté des fils d’Israël, tandis qu’ils pleuraient à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès des membres de son peuple » ou « auprès des autres Israélites ». L’hébreu dit littéralement « auprès de ses frères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve le marqueur discursif qui attire brusquement l’attention, dans une tournure française actuelle mais digne.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: « Parmi » exprime naturellement l’appartenance au groupe indiquée par מִן, tandis que « fils d’Israël » préserve l’expression familiale hébraïque.
- source_word: וַיַּקְרֵב
  choice: amena ... auprès de
  rationale: Le hiphil de קרב signifie faire approcher ou amener près de quelqu’un. Cette formulation garde la dimension spatiale sans produire un français artificiel.
- source_word: אֶל אֶחָיו
  choice: auprès de ses frères
  rationale: Rend littéralement le terme familial « frères » et laisse ouverte sa portée contextuelle, précisée en note.
- source_word: הַמִּדְיָנִית
  choice: une Madianite
  rationale: L’adjectif féminin substantivé désigne une femme madianite. L’article hébreu est rendu par l’indéfini naturel en français lors de son introduction dans le récit.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: sous les yeux de ... et sous les yeux de
  rationale: Préserve la répétition et souligne le caractère public et provocateur de l’acte.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toute la communauté des fils d’Israël
  rationale: « Communauté » rend עֵדָה de façon claire dans ce cadre collectif, tout en conservant l’expression « fils d’Israël ».
- source_word: וְהֵמָּה בֹכִים
  choice: tandis qu’ils pleuraient
  rationale: Rend l’action durative qui forme l’arrière-plan simultané de l’arrivée de l’homme.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Rend précisément le lieu cultuel; « tente de la rencontre » communique la fonction de מוֹעֵד en français moderne.
theological_decisions:
- issue: Portée des termes familiaux בְּנֵי יִשְׂרָאֵל et אֶחָיו
  choice: Conserver « fils d’Israël » et « frères » dans le texte principal
  alternative: Israélites; compatriotes; membres de son peuple
  rationale: L’hébreu emploie un langage familial masculin. Le conserver maintient l’imagerie d’alliance et évite de résoudre silencieusement la portée de « frères »; la note fournit les équivalents contextuels possibles.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « sous les yeux » et les désignations familiales sont volontairement conservées. « Et voici que » maintient la brusque mise au premier plan de la scène sans archaïsme excessif.
