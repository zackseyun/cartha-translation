source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל שֹׁפְטֵ֖י יִשְׂרָאֵ֑ל הִרְגוּ֙ אִ֣ישׁ אֲנָשָׁ֔י/ו הַ/נִּצְמָדִ֖ים לְ/בַ֥עַל פְּעֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: fr
  text: 'Moïse dit aux juges d’Israël : « Que chacun de vous tue, parmi ses hommes, ceux qui se sont attachés au Baal de Péor[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Baal-Péor ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: juges
  rationale: Le terme désigne ici ceux qui exercent une autorité judiciaire ou dirigeante en Israël ; « juges » en est le rendu le plus direct.
- source_word: הִרְגוּ
  choice: tue
  rationale: L’impératif pluriel exprime un ordre direct. Dans la construction distributive française « Que chacun… tue », le singulier restitue naturellement la force de l’hébreu sans ajouter la nuance juridique plus précise d’« exécuter ».
- source_word: אִישׁ אֲנָשָׁיו
  choice: Que chacun de vous… ceux de ses hommes
  rationale: Cette formulation rend la construction distributive « chacun, ses hommes » et indique que chaque juge doit mettre à mort les hommes relevant de son autorité qui se sont attachés au Baal.
- source_word: הַנִּצְמָדִים
  choice: qui se sont attachés
  rationale: Le participe niphal de צמד exprime une union ou un attachement étroit ; la forme pronominale française préserve ici l’idée d’un engagement volontaire sans préciser davantage sa nature.
- source_word: לְבַעַל פְּעוֹר
  choice: au Baal de Péor
  rationale: Cette expression présente Baal comme la divinité associée à Péor et rend explicitement la relation naturelle en français. La graphie traditionnelle « Baal-Péor » reste possible.
theological_decisions:
- issue: Nature de la mise à mort ordonnée
  choice: Traduire directement l’ordre donné par Moïse aux juges de tuer les hommes coupables placés sous leur autorité.
  alternative: Employer « exécuter » pour souligner le caractère judiciaire de la peine.
  rationale: Le verset formule un ordre de mise à mort en réponse à l’apostasie, mais n’en expose pas ici la procédure juridique ou rituelle. « Tuer » préserve la dureté du commandement sans ajouter une précision absente du verbe hébreu.
- issue: Référence masculine dans אִישׁ אֲנָשָׁיו
  choice: Conserver la référence masculine avec « chacun de vous » et « ses hommes ».
  alternative: Neutraliser par « chaque personne » et « ceux qui sont sous son autorité ».
  rationale: La construction hébraïque est explicitement masculine et, dans le contexte, vise les hommes coupables ; le français doit conserver cette donnée.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Que chacun de vous tue » transmet l’impératif distributif ; « ceux de ses hommes » évite de laisser entendre que tous les hommes sous l’autorité de chaque juge doivent être tués.
