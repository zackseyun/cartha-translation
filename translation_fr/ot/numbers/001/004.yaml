  source_fidelity: Le projet rend correctement la présence de représentants, la distribution d’un homme par tribu et leur statut de responsables. Toutefois, « famille ancestrale » est peu idiomatique et atténue la notion sociofamiliale précise de בית אבתיו, qui désigne un groupe de parenté rattaché à la lignée paternelle.
  naturalness: « Un homme de chaque tribu sera avec vous » est compréhensible, mais « Avec vous, il y aura un homme pour chaque tribu » est plus naturel en français moderne et reflète mieux la construction existentielle du verbe hébreu. « Groupe familial paternel » est plus clair et plus idiomatique que « famille ancestrale ».
  terminology: « Tribu » et « chef » conviennent. « Groupe familial paternel » préserve mieux, sans calque opaque, la réalité de la « maison des pères ». La note conserve le littéral et l’explication patrilinéaire.
