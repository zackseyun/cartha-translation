  text: וְ/אִתְּ/כֶ֣ם יִהְי֔וּ אִ֥ישׁ אִ֖ישׁ לַ/מַּטֶּ֑ה אִ֛ישׁ רֹ֥אשׁ לְ/בֵית אֲבֹתָ֖י/ו הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: fr
  text: Avec vous, il y aura un homme pour chaque tribu ; chacun sera chef de son groupe familial paternel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de ses pères ». Cette expression désigne un groupe familial élargi, organisé selon la lignée paternelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתְּכֶם יִהְיוּ
  choice: sera avec vous
  rationale: La tournure exprime la présence requise de ces représentants auprès de Moïse et d’Aaron; le futur français convient au contexte directif.
- source_word: אִישׁ אִישׁ לַמַּטֶּה
  choice: un homme de chaque tribu
  rationale: 'La répétition de אִישׁ a une valeur distributive: un représentant pour chacune des tribus.'
- source_word: מַטֶּה
  choice: tribu
  rationale: Dans le contexte du recensement et de l’organisation d’Israël, le mot désigne la tribu, non un bâton au sens concret.
- source_word: אִישׁ רֹאשׁ
  choice: chacun étant chef
  rationale: Cette formulation française rend l’apposition hébraïque et maintient l’idée d’autorité portée par רֹאשׁ.
- source_word: בֵית אֲבֹתָיו
  choice: sa famille ancestrale
  rationale: L’expression désigne l’unité familiale ou clanique patrilinéaire. « Famille ancestrale » est intelligible en français moderne sans réduire le groupe au seul foyer domestique.
- source_word: הוּא
  choice: chacun étant
  rationale: Le pronom indépendant, emphatique ou récapitulatif, est rendu naturellement par la reprise distributive « chacun ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la structure distributive du verset tout en évitant le calque peu naturel « maison de ses pères » dans le corps du texte; celui-ci est signalé en note.
