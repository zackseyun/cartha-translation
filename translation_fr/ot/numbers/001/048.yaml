  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Alors Yahweh parla à Moïse[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
