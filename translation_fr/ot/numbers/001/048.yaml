lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors ... parla
  rationale: Le wayyiqtol fait progresser le récit. « Alors ... parla » exprime naturellement la succession narrative et conserve le sens précis de דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette translittération courante du tétragramme préserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit les paroles directes qui suivent. « En ces termes : » rend cette fonction idiomatiquement en français sans ajouter de contenu.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve la valeur de nom propre, tandis que la traduction traditionnelle française le remplace par un titre.
translation_notes:
  register: 'Français moderne, digne et accessible. La tournure « en ces termes : » introduit naturellement le discours direct du verset suivant et évite le calque peu idiomatique « disant ».'
