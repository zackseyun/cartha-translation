lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: les hommes recensés
  rationale: Le terme désigne ici les personnes dénombrées et inscrites lors du recensement. Le contexte immédiat (Nombres 1.20-46) précise qu’il s’agit des hommes aptes au service; « hommes recensés » est naturel en français sans renforcer inutilement la nuance militaire.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: Dans cette formule répétée du recensement, לְ avec מַטֶּה indique l’appartenance tribale. « De la tribu de » est la formulation française la plus idiomatique.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française traditionnelle et largement reconnue du nom de la tribu.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57 400
  rationale: La suite numérique hébraïque signifie exactement cinquante-sept mille quatre cents. Les chiffres et l’espace des milliers suivent l’usage typographique français moderne.
