source:
  edition: WLC
  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: fr
  text: 'Pour les fils de Gad[a], selon leurs lignées, selon leurs clans[b], selon leurs maisons paternelles, d’après le nombre des noms, à partir de vingt ans et au-delà, tous ceux qui partent pour le service militaire[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fils de Gad ». L’expression désigne ici les membres masculins de la tribu recensés.
    reason: cultural_note
  - marker: b
    text: Ou « selon leurs familles ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « tous ceux qui sortent pour l’armée »; on peut aussi comprendre « tous ceux qui partent à la guerre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: Pour les fils de Gad
  rationale: Le préfixe ל introduit ici la rubrique tribale dans la formule du recensement. « Fils de Gad » conserve l’expression hébraïque et son référent masculin dans ce recensement militaire.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs générations
  rationale: Le terme renvoie ici aux lignées ou aux groupements fondés sur la descendance. Cette formulation préserve le caractère technique et répétitif de la formule sans supposer explicitement des registres écrits.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: « Clans » désigne clairement les subdivisions de parenté au sein de la tribu et évite l’ambiguïté moderne de « familles ».
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Cette expression rend le groupement social fondé sur la maison du père tout en restant naturelle et transparente en français.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: d’après le nombre des noms
  rationale: La formule décrit un dénombrement effectué sur la base des noms individuels, sans développer davantage que l’hébreu.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Cette tournure exprime le seuil d’âge inclusif de la formule hébraïque sans reproduire littéralement l’idiome « fils de vingt ans ».
- source_word: כֹּל יֹצֵא צָבָא
  choice: tous ceux qui partaient pour le service militaire
  rationale: Le participe יֹצֵא est rendu sans ajouter explicitement l’idée de capacité ou d’aptitude. צָבָא peut désigner ici l’armée, la campagne ou le service militaire; la formulation retenue convient au contexte du recensement.
