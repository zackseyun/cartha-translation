  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: fr
  text: 'Quant aux fils de Dan, selon leurs lignées, leurs clans et leurs familles paternelles, d’après le décompte des noms, tous les hommes âgés de vingt ans et plus, aptes à partir à la guerre[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aptes au service militaire ». L’expression hébraïque parle littéralement de ceux qui « sortent » pour l’armée ou la guerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: Quant aux fils de Dan
  rationale: Le ל introduit ici la rubrique tribale. « Quant aux » rend naturellement cette fonction en français, tandis que « fils de Dan » conserve la désignation masculine et généalogique du texte.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: Dans ce recensement, le terme désigne l’organisation généalogique des membres de la tribu. « Lignées » est plus clair en français actuel que le calque « générations » et ne se confond pas avec les clans.
- source_word: לְמִשְׁפְּחֹתָם
  choice: leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision de la tribu; « clans » la distingue des familles paternelles mentionnées ensuite.
- source_word: לְבֵית אֲבֹתָם
  choice: leurs familles paternelles
  rationale: Cette expression rend la structure de parenté patrilinéaire de בית אבות dans une formulation française intelligible, sans l’aplanir en simple « familles ».
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: d’après le décompte des noms
  rationale: La formule évoque le dénombrement nominatif des personnes. « Décompte des noms » demeure proche de l’hébreu tout en étant idiomatique.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: âgés de vingt ans et plus
  rationale: Cette formulation actuelle exprime exactement le seuil d’âge du recensement sans reproduire maladroitement l’idiome hébreu « depuis un fils de vingt ans ».
- source_word: כֹּל יֹצֵא צָבָא
  choice: tous les hommes … aptes à partir à la guerre
  rationale: Dans ce contexte militaire et masculin, la formule désigne ceux qui peuvent prendre part à une campagne. Le rendu garde l’image hébraïque de la sortie à la guerre; l’équivalent fonctionnel est signalé en note.
theological_decisions:
- issue: Langage masculin du recensement militaire
  choice: tous les hommes âgés de vingt ans et plus
  alternative: toute personne âgée de vingt ans et plus
  rationale: Le contexte et les formes masculines visent les hommes recensés pour la guerre. Une formulation neutre élargirait indûment le référent.
- issue: Portée de l’aptitude militaire
  choice: aptes à partir à la guerre
  alternative: aptes au service militaire
  rationale: Le texte conserve l’idiome concret « sortir » pour l’armée ou la guerre sans préciser davantage la nature juridique ou institutionnelle du service; la note donne l’équivalent fonctionnel.
translation_notes:
  register: Français international moderne, digne et lisible. La structure nominale et les deux-points sont conservés parce que le verset forme la rubrique du total donné au verset suivant. Les termes « lignées », « clans » et « familles paternelles » maintiennent les distinctions de l’organisation généalogique.
