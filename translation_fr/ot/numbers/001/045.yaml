  text: וַ/יִּֽהְי֛וּ כָּל פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: fr
  text: Ainsi, tous les fils d’Israël recensés[a], selon leurs maisons paternelles, âgés de vingt ans et plus, tous ceux qui pouvaient partir à la guerre en Israël[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit « les fils d’Israël », expression conservée ici parce que le recensement est explicitement organisé selon des critères masculins et militaires.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « tous ceux qui étaient aptes au service militaire ». Littéralement : « tous ceux qui partent pour l’armée » ou « pour la guerre »; dans ce contexte, l’expression vise les hommes mobilisables.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Ainsi, ... furent
  rationale: Le wayyiqtol de היה poursuit et récapitule le dénombrement précédent. « Ainsi » exprime ici cette valeur conclusive, tandis que « furent » s’accorde naturellement avec « recensés ».
- source_word: כָּל פְּקוּדֵי
  choice: tous ceux qui furent recensés
  rationale: פקד désigne ici l’action de recenser ou d’enrôler. Cette formulation conserve le sens résultatif sans ajouter une qualification absente de l’hébreu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Traduction formellement proche qui garde la portée masculine pertinente dans le cadre explicite de ce recensement militaire.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: La formule décrit l’organisation patrilinéaire des groupes recensés. « Maisons paternelles » restitue cette structure sociale sans la réduire à la seule famille nucléaire.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Rend précisément la formule hébraïque indiquant le seuil d’âge, dans un français clair et digne.
- source_word: כָּל יֹצֵא צָבָא
  choice: tous ceux qui étaient aptes à partir à la guerre
  rationale: Littéralement, « tout homme sortant pour l’armée/la guerre ». Dans ce contexte, l’expression désigne l’aptitude au service militaire; la traduction conserve l’image du départ tout en explicitant sa valeur contextuelle.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Restitution directe de la préposition et du nom collectif, naturelle en français.
