revisions:
- from: Ainsi, tous ceux qui furent recensés parmi les fils d’Israël[a], selon leurs maisons paternelles, depuis l’âge de vingt ans et au-dessus, tous ceux qui étaient aptes à partir à la guerre en Israël[b],
  to: Ainsi, tous les fils d’Israël recensés[a], selon leurs maisons paternelles, âgés de vingt ans et plus, tous ceux qui pouvaient partir à la guerre en Israël[b],
  rationale: La révision supprime une nuance non exprimée par l’hébreu, emploie une formule d’âge idiomatique et maintient le caractère masculin et militaire du recensement sans alourdir le texte. La syntaxe inachevée est conservée conformément à l’enchaînement avec le verset 46.
