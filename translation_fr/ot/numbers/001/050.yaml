source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: fr
  text: Mais toi, confie aux Lévites la responsabilité de la demeure du Témoignage[a], de tout son mobilier et de tout ce qui lui appartient. Ils porteront la demeure et tout son mobilier, ils en assureront le service[b] et ils camperont autour d’elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tabernacle du Témoignage ». Le mot hébreu désigne la demeure sacrée transportable.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils la serviront » ou « ils s’en occuperont ». Le verbe désigne ici le service accompli auprès du sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction et le pronom explicite marquent ici un contraste avec les Israélites recensés dans le contexte précédent.
- source_word: הַפְקֵד ... עַל
  choice: confie aux Lévites la responsabilité de
  rationale: Le hiphil impératif de פקד avec עַל exprime l’attribution officielle d’une responsabilité; cette formulation est naturelle en français et conserve l’idée de charge.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: la demeure du Témoignage
  rationale: מִשְׁכָּן désigne littéralement une demeure et, ici, le sanctuaire transportable. « Témoignage » conserve le terme cultuel עֵדוּת sans en préciser excessivement le référent.
- source_word: כֵּלָיו
  choice: son mobilier
  rationale: Dans ce contexte cultuel, כֵּלִים englobe les objets, ustensiles et équipements du sanctuaire; « mobilier » offre un terme collectif lisible et suffisamment large.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tout ce qui lui appartient
  rationale: La formulation reproduit naturellement la relation d’appartenance exprimée par אֲשֶׁר לוֹ.
- source_word: יִשְׂאוּ
  choice: ils porteront
  rationale: נשא désigne ici le fait de porter physiquement la demeure et ses objets lors des déplacements.
- source_word: יְשָׁרְתֻהוּ
  choice: ils en assureront le service
  rationale: Le piel de שרת évoque un service exercé auprès du sanctuaire. La tournure française garde la nuance cultuelle tout en rendant naturellement le suffixe objet.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: ils camperont autour d’elle
  rationale: L’imparfait hébreu a une valeur directive dans ces instructions; le futur français convient à une prescription et le pronom évite une répétition lourde.
theological_decisions:
- issue: Désignation du sanctuaire par מִשְׁכָּן
  choice: demeure
  alternative: tabernacle
  rationale: « Demeure » rend le sens lexical et reste compréhensible, tandis que la note signale le terme cultuel traditionnel sans imposer un vocabulaire confessionnel.
- issue: Sens de הָעֵדֻת
  choice: du Témoignage
  alternative: de l’acte de l’alliance
  rationale: Le texte dit littéralement « Témoignage » et ne précise pas ici son référent; la traduction conserve cette densité théologique et cette possible ambiguïté.
- issue: Nature du service exprimé par שרת
  choice: en assureront le service
  alternative: la serviront
  rationale: La formulation indique un service lié au sanctuaire sans attribuer aux Lévites une fonction sacerdotale plus précise que celle affirmée par le verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur exprime les devoirs prescrits. Les répétitions structurantes sont en grande partie conservées, avec un pronom final pour alléger la phrase.
