lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: Pour Benjamin
  rationale: Le préfixe לְ introduit ici, dans une liste, le représentant de Benjamin. « Pour Benjamin » conserve la concision et la structure de l’hébreu sans expliciter « la tribu ».
- source_word: אֲבִידָן
  choice: Abidân
  rationale: Le nom propre est transcrit selon une forme française usuelle, avec un accent circonflexe indiquant la voyelle longue finale.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette formule nominale, בֶּן exprime directement la filiation ; « fils de » est naturel et concis en français.
- source_word: גִּדְעֹנִי
  choice: Guidéoni
  rationale: Le nom propre est transcrit dans une forme française lisible, qui rend le g dur initial et les principales voyelles de l’hébreu.
