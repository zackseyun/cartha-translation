source:
  edition: WLC
  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: fr
  text: Ce sont les hommes appelés de la communauté[a], les responsables des tribus de leurs pères, les chefs des milliers d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes convoqués de l’assemblée ». Le participe hébreu peut désigner des personnes appelées, convoquées ou désignées.
    reason: lexical_alternative
  - marker: b
    text: Les « milliers d’Israël » peuvent être des groupes comptant littéralement mille personnes ou, plus largement, des subdivisions claniques ou militaires d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ce sont
  rationale: Le démonstratif pluriel introduit et identifie les hommes désignés; le français exprime naturellement la copule avec « Ce sont ».
- source_word: קריאי הָעֵדָה
  choice: ceux qui furent appelés au sein de la communauté
  rationale: Le participe passif construit peut désigner ceux qui ont été appelés, convoqués ou désignés. Cette formulation conserve l’idée d’appel sans imposer celle d’une élection formelle; « au sein de » rend prudemment leur rapport à la communauté.
- source_word: נְשִׂיאֵי
  choice: les responsables
  rationale: Dans ce cadre tribal et administratif, נָשִׂיא désigne des dirigeants. « Responsables » est actuel, clair et évite les connotations monarchiques de « princes ».
- source_word: מַטּוֹת אֲבוֹתָם
  choice: des tribus de leurs pères
  rationale: La formulation garde explicitement la référence paternelle et ancestrale du texte hébreu tout en restant idiomatique en français.
- source_word: רָאשֵׁי
  choice: les chefs
  rationale: Le sens métaphorique de « têtes » est rendu par le titre français naturel « chefs ».
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: des milliers d’Israël
  rationale: La traduction littérale préserve l’ambiguïté de אֶלֶף, qui peut désigner mille personnes ou une subdivision clanique ou militaire.
- source_word: הֵם
  choice: Ce sont
  rationale: Le pronom indépendant final a une valeur d’identification emphatique que le français place naturellement au début dans la tournure « Ce sont ».
theological_decisions: []
