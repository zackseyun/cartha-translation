  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: fr
  text: 'Les fils de Ruben, le premier-né d’Israël, selon leurs lignées, selon leurs clans, selon leurs maisons paternelles, d’après le nombre des noms, un par un[a] : tous les hommes âgés de vingt ans ou plus, tous ceux qui partent à la guerre :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon leurs crânes » ou « selon leurs têtes » ; expression indiquant que chacun était compté individuellement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי רְאוּבֵן
  choice: Les fils de Ruben
  rationale: Le verbe introductif est absorbé dans la formule nominale du recensement, comme le permet la syntaxe de cette longue phrase qui se poursuit au verset suivant. « Fils » conserve la transparence généalogique de בְנֵי.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: premier-né d’Israël
  rationale: Apposition directe qui identifie Ruben et conserve la relation formelle de l’hébreu.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: Dans ce contexte généalogique, תּוֹלְדוֹת désigne les lignes de descendance; « lignées » est naturel en français sans supposer explicitement des registres écrits.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: « Clans » rend le niveau d’organisation tribale et le distingue des maisons paternelles mentionnées ensuite.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs familles patriarcales
  rationale: Cette formulation rend l’expression technique « maison des pères » dans un français actuel tout en conservant la structure de parenté patrilinéaire.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: d’après le nombre des noms
  rationale: Rend directement l’idée d’un dénombrement nominal sans transformer le texte en référence certaine à une liste écrite.
- source_word: לְגֻלְגְּלֹתָם
  choice: un par un[a]
  rationale: Littéralement « selon leurs crânes/têtes »; l’expression idiomatique française communique clairement que chaque individu est compté séparément, tandis que la note conserve l’image hébraïque.
- source_word: כָּל זָכָר
  choice: tous les hommes
  rationale: Dans ce contexte de recensement militaire humain, « hommes » est plus naturel que « mâles » en français et l’âge adulte est immédiatement précisé.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: âgés de vingt ans ou plus
  rationale: Formulation française moderne et exacte du seuil d’âge exprimé par l’hébreu.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tous ceux qui partaient à la guerre
  rationale: Conserve la valeur participiale de « sortir » et le sens militaire de צָבָא, sans ajouter explicitement la notion d’aptitude absente de la formulation hébraïque.
