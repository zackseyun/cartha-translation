translation_notes:
  register: Français international moderne, digne et lisible. La structure en série et les deux-points finaux sont maintenus parce que la formule de recensement trouve son achèvement numérique au verset suivant. Le participe militaire est rendu sans ajouter « aptes », afin de rester au plus près du texte source.
