source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse, dans le désert du Sinaï, dans la tente de la Rencontre[a], le premier jour du deuxième mois de la deuxième année après leur sortie du pays d’Égypte, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « tente de la rencontre » ; traditionnellement : « tabernacle ».'
    reason: Signaler la formulation hébraïque transparente de אֹהֶל מוֹעֵד et l’équivalent traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר introduit ici une parole divine dans un récit. « Parla » convient naturellement en français et permet de rendre séparément la formule finale לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: בְּמִדְבַּר סִינַי
  choice: dans le désert du Sinaï
  rationale: מִדְבָּר désigne une région sauvage ou désertique ; « désert du Sinaï » est l’expression géographique naturelle et courante en français.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Cette traduction transparente conserve les deux éléments de l’expression hébraïque et évite de la remplacer dans le texte par le terme traditionnel moins explicite « tabernacle ».
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: le premier jour du deuxième mois
  rationale: La tournure explicite clairement l’idiome calendaire hébreu en français moderne.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: de la deuxième année
  rationale: Après la date du mois, le complément avec « de » situe naturellement celle-ci à l’intérieur de la deuxième année.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: après leur sortie du pays d’Égypte
  rationale: Le nom verbal « sortie » restitue l’infinitif hébreu avec son suffixe pluriel, tandis que « pays d’Égypte » conserve explicitement אֶרֶץ.
- source_word: לֵאמֹר
  choice: 'Il dit :'
  rationale: La formule hébraïque annonce les paroles qui suivent. Une proposition autonome avec deux-points est plus naturelle en français que le calque « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre sans lui substituer un titre ni adopter la forme traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, digne et lisible. La longue indication de lieu et de date est conservée, mais la formule finale est rendue par une courte proposition suivie de deux-points afin d’introduire naturellement le discours du verset suivant.
