  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: fr
  text: Les fils d’Israël[a] agirent conformément à tout ce que Yahweh avait ordonné à Moïse ; c’est ainsi qu’ils agirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: Alternative lexicale pour la désignation collective בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... עָשׂוּ
  choice: agirent ... ils agirent
  rationale: Le verbe עשה signifie largement « faire » ou « agir ». « Agirent » convient ici à l’exécution d’un ordre et permet de conserver la reprise emphatique du même verbe en fin de verset.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression rend directement la tournure hébraïque masculine plurielle et conserve la désignation traditionnelle du peuple issu d’Israël ; une formulation collective plus courante est signalée en note.
- source_word: כְּכֹל אֲשֶׁר
  choice: conformément à tout ce que
  rationale: La formulation exprime à la fois la conformité à l’ordre reçu et son accomplissement intégral, dans un français naturel.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait marque naturellement en français que l’ordre divin précède son exécution par Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Après « ordonner », le français construit normalement la personne chargée d’exécuter l’ordre avec la préposition « à ».
- source_word: כֵּן
  choice: c’est bien ainsi
  rationale: Cette tournure reprend avec insistance la conformité exacte entre le commandement et l’action, tout en restant idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; sa transcription préserve le nom personnel au lieu de lui substituer un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le choix principal conserve la forme masculine littérale de l’hébreu, tandis que la note indique les équivalents collectifs possibles sans déterminer plus étroitement la portée du groupe.
translation_notes:
  register: Français moderne, digne et lisible. « Agirent conformément à » évite une tournure artificielle tout en conservant l’idée de stricte conformité ; la répétition finale de עשה est volontairement maintenue.
