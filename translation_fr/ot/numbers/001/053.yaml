  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: fr
  text: Mais les Lévites camperont autour de la demeure du témoignage, afin que la colère ne s’abatte pas sur la communauté des fils d’Israël. Les Lévites assureront la garde de la demeure du témoignage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Mais les Lévites
  rationale: La conjonction relie cette consigne à la disposition précédente des autres tribus tout en marquant un contraste; « Mais » restitue naturellement ce mouvement discursif.
- source_word: יַחֲנוּ סָבִיב
  choice: camperont autour de
  rationale: L’imparfait exprime ici une prescription dans l’organisation du camp; le futur français porte naturellement cette valeur directive, et « autour de » conserve le sens spatial.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: la demeure du témoignage
  rationale: « Demeure » rend le sens concret de מִשְׁכָּן comme lieu où Dieu demeure, sans recourir au terme plus ancien « tabernacle ». « Témoignage » conserve la désignation cultuelle sans la réduire explicitement aux tables ou au document de l’alliance.
- source_word: וְלֹא יִהְיֶה קֶצֶף עַל
  choice: afin que la colère ne s’abatte pas sur
  rationale: Dans ce contexte, la proposition indique le but préventif de la disposition des Lévites. « S’abatte sur » exprime idiomatiquement l’irruption judiciaire suggérée par קֶצֶף et la préposition עַל.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: la communauté des fils d’Israël
  rationale: « Communauté » rend עֵדָה en français courant et digne. « Fils d’Israël » préserve la formulation généalogique explicite de l’hébreu.
- source_word: וְשָׁמְרוּ הַלְוִיִּם אֶת מִשְׁמֶרֶת
  choice: Les Lévites assureront la garde de
  rationale: La combinaison de שׁמר et מִשְׁמֶרֶת désigne une responsabilité confiée de surveillance et de protection; « assurer la garde » restitue les deux éléments sans lourdeur.
theological_decisions:
- issue: Nature de קֶצֶף dans le contexte du sanctuaire
  choice: « la colère » désigne implicitement la colère divine susceptible de s’abattre sur Israël
  alternative: « un déchaînement de colère » ou une colère non spécifiée
  rationale: Le contexte cultuel de Nombres indique un jugement lié à la violation des limites sacrées. La traduction garde toutefois le sujet implicite, comme l’hébreu, au lieu d’ajouter « de Dieu ».
- issue: Portée de הָעֵדֻת
  choice: témoignage
  alternative: charte de l’alliance / tables du témoignage
  rationale: Le terme peut renvoyer au témoignage de l’alliance conservé dans le sanctuaire, mais le verset ne précise pas davantage; le choix préserve cette ouverture.
- issue: Valeur de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites / peuple d’Israël
  rationale: La formulation filiale et généalogique de l’hébreu est conservée sans neutralisation ni élargissement interprétatif.
translation_notes:
  register: Français international moderne, naturel et digne. « Demeure » est préféré à « tabernacle », moins courant aujourd’hui, tout en maintenant la terminologie cultuelle. La répétition de « demeure du témoignage » est conservée, ainsi que la formulation sobre qui laisse implicite l’auteur de la colère.
