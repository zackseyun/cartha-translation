  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: fr
  text: Mais les Lévites, selon la tribu de leurs pères, ne furent pas recensés parmi eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Mais les Lévites
  rationale: Dans ce contexte, וְ marque le contraste entre les Lévites et les tribus recensées précédemment. « Lévites » est la forme française usuelle du nom tribal.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: selon leur tribu ancestrale
  rationale: מַטֶּה désigne ici la tribu, et אֲבֹתָם renvoie à la lignée des pères, donc aux ancêtres. Cette formulation reste naturelle tout en conservant la dimension généalogique.
- source_word: לֹא הָתְפָּקְדוּ
  choice: ne furent pas recensés
  rationale: Le hitpael de פקד désigne, dans le contexte du recensement, l'inscription ou le dénombrement officiel. « Recensés » rend précisément cette idée.
- source_word: בְּתוֹכָם
  choice: avec eux
  rationale: L'expression signifie littéralement « parmi eux » et indique ici que les Lévites ne furent pas inclus dans le même recensement que les autres tribus. « Avec eux » exprime naturellement cette relation en français.
