  text: וְ/אֵ֨ת כָּל הָ/עֵדָ֜ה הִקְהִ֗ילוּ בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י וַ/יִּתְיַֽלְד֥וּ עַל מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/גֻלְגְּלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: fr
  text: Ils rassemblèrent toute la communauté le premier jour du deuxième mois, et tous se firent inscrire[a] selon leurs clans et leurs maisons paternelles, selon le nombre des noms, âgés de vingt ans et plus, personne par personne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déclarèrent leur ascendance » ou « s’inscrivirent selon leur généalogie ». Le verbe hébreu, rare dans cet emploi, indique un enregistrement fondé sur la filiation.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « selon leurs têtes » ou « selon leurs crânes » : chacun était compté individuellement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: rassemblèrent
  rationale: Le hiphil de קהל exprime le fait de faire venir ensemble ou de réunir. « Rassemblèrent » est naturel en français et conserve l’action de convoquer la communauté.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël. « Communauté » rend clairement cette réalité collective sans donner au terme une coloration ecclésiale anachronique.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: le premier jour du deuxième mois
  rationale: La tournure hébraïque, littéralement « au un du deuxième mois », est l’expression calendaire habituelle pour le premier jour du mois.
- source_word: וַיִּתְיַלְדוּ
  choice: se firent inscrire
  rationale: 'Cette forme rare du verbe ילד a ici un sens généalogique : les membres de la communauté sont enregistrés sur la base de leur ascendance. La formulation française convient au contexte administratif, tandis que la note conserve la nuance de filiation.'
- source_word: עַל מִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte tribal, מִשְׁפָּחָה désigne un groupe de parenté plus large que la famille immédiate ; « clans » en rend la portée sociale.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: L’expression est un terme technique de l’organisation familiale d’Israël. « Maisons paternelles » en préserve la structure et la référence à l’ascendance par le père.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: d’après le dénombrement des noms
  rationale: La formule souligne que le recensement repose sur les individus nommément comptés. « Dénombrement » correspond bien au cadre du recensement.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans
  rationale: 'Cette formule fixe un seuil inclusif : vingt ans et au-dessus. En français courant, « depuis l’âge de vingt ans » exprime clairement cette limite minimale dans la phrase.'
- source_word: לְגֻלְגְּלֹתָם
  choice: personne par personne
  rationale: Littéralement « selon leurs crânes » ou « tête par tête », l’expression signifie que chaque individu est compté séparément. Le texte principal en donne le sens idiomatique, et la note conserve l’image hébraïque.
