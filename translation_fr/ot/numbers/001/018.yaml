  terminology: « Communauté », « clans » et « maisons paternelles » rendent bien les catégories sociales du texte. « Se firent inscrire » convient au contexte de recensement, tandis que la note conserve avec justesse la nuance généalogique du verbe rare. « Personne par personne » rend l’idiome final sans littéralisme inutile.
