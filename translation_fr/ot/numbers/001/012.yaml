lexical_decisions:
- source_word: לְ/דָן
  choice: Pour Dan
  rationale: La préposition לְ introduit ici, dans la liste du recensement, le représentant associé à la tribu de Dan. « Pour Dan » conserve la concision et la structure de l’hébreu sans ajouter explicitement « la tribu de ».
- source_word: אֲחִיעֶזֶר
  choice: Ahiézer
  rationale: Le nom propre est translittéré selon l’usage biblique français courant, avec les accents nécessaires à une lecture naturelle en français.
- source_word: בֶּן
  choice: fils de
  rationale: Le nom בֶּן exprime directement la filiation dans cette formule d’identification.
- source_word: עַמִּישַׁדָּי
  choice: Ammishaddaï
  rationale: Le nom propre est translittéré plutôt que traduit; la graphie « Ammishaddaï » représente le redoublement consonantique et rend la finale hébraïque de manière usuelle en français.
