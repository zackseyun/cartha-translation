source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: fr
  text: 'Pour les fils d’Issacar, selon leurs générations, selon leurs clans et selon leurs maisons paternelles, d’après le nombre des noms, à partir de vingt ans et au-delà, tout homme apte à partir à la guerre[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout homme qui part à la guerre ». Littéralement, l’expression hébraïque évoque « tous ceux qui sortent pour l’armée » et désigne ici les hommes admissibles au service militaire.
    reason: Alternative lexicale et préservation de la formulation concrète de l’hébreu.
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: Pour les fils d’Issacar
  rationale: Le לְ introduit ici la rubrique tribale du recensement. « Fils » conserve la formulation généalogique et masculine de l’hébreu, qui désigne dans ce contexte les membres masculins de la tribu.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs générations
  rationale: Le terme renvoie aux lignées ou divisions générationnelles. Cette formulation reste proche de l’hébreu sans imposer l’idée plus précise de registres généalogiques.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans l’organisation tribale d’Israël, מִשְׁפָּחָה désigne une subdivision de parenté plus large que la famille nucléaire moderne ; « clans » l’exprime clairement.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Cette expression préserve la structure patriarcale explicite de la formule israélite tout en restant compréhensible en français moderne.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: d’après le nombre des noms
  rationale: La traduction conserve l’image du recensement de personnes nommément comptées, avec une tournure française naturelle.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Cette formule exprime un seuil inclusif à vingt ans. Elle demeure proche de la structure hébraïque tout en étant intelligible en français international.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tout homme apte à partir à la guerre
  rationale: Littéralement, l’expression évoque toute personne « sortant pour l’armée/la guerre ». Dans ce recensement de mâles âgés d’au moins vingt ans, elle désigne les hommes admissibles au service militaire ; « apte » explicite cette fonction contextuelle.
theological_decisions:
- issue: Langage masculin du recensement
  choice: tout homme apte à partir à la guerre
  alternative: quiconque part à la guerre
  rationale: La grammaire et le cadre du recensement visent les hommes en âge de combattre. La traduction conserve donc cette référence masculine plutôt que de la neutraliser.
- issue: Portée de יֹצֵא צָבָא
  choice: apte à partir à la guerre
  alternative: qui part à la guerre
  rationale: Le contexte peut indiquer l’aptitude ou l’admissibilité militaire, mais l’expression hébraïque décrit plus littéralement celui qui « sort » pour l’armée. La note préserve cette autre lecture sans effacer la valeur fonctionnelle retenue dans le texte.
translation_notes:
  register: Français moderne, digne et lisible. La répétition de « selon » maintient le rythme classificatoire de la formule de recensement. « Maisons paternelles » conserve le cadre social ancien sans le moderniser artificiellement.
