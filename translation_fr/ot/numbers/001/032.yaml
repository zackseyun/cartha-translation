source:
  edition: WLC
  text: לִ/בְנֵ֤י יוֹסֵף֙ לִ/בְנֵ֣י אֶפְרַ֔יִם תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: fr
  text: 'Pour les descendants de Joseph, pour les descendants d’Éphraïm, selon leurs lignées, selon leurs clans, selon leurs maisons paternelles, d’après le nombre des noms, tous les hommes âgés de vingt ans et plus, qui partent à la guerre[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les hommes aptes au service militaire ». L’expression hébraïque parle littéralement de ceux qui « sortent » pour la guerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Pour les descendants de Joseph
  rationale: Dans ce cadre de recensement tribal, בנים désigne les descendants rattachés à Joseph plutôt que ses seuls fils immédiats. « Descendants » rend ce sens naturellement en français moderne, tandis que לְ introduit la rubrique du groupe recensé.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: pour les descendants d’Éphraïm
  rationale: La formule précise ici la branche d’Éphraïm parmi les descendants de Joseph. « Descendants » évite de faire croire qu’il s’agit uniquement des fils directs d’Éphraïm.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: Dans cette formule de recensement, תולדות renvoie à l’ascendance et aux divisions généalogiques. « Lignées » est plus précis et plus naturel que « générations » dans ce contexte.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision sociale de la tribu, plus large que la famille nucléaire moderne ; « clans » rend cette organisation.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Cette expression technique désigne les groupes de parenté organisés d’après l’ascendance paternelle. La formulation conserve cette structure sans la moderniser abusivement.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: d’après le compte des noms
  rationale: La formule indique un dénombrement individuel par nom. « Compte des noms » reste proche de l’hébreu tout en étant intelligible.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Cette formule fixe le seuil d’âge du recensement militaire. La traduction conserve l’idée de vingt ans révolus et de tous les âges supérieurs.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tout homme qui part à la guerre
  rationale: L’expression idiomatique désigne les hommes mobilisables pour l’armée, tout en parlant littéralement de ceux qui « sortent » pour la guerre. Cette formulation préserve l’image militaire et la référence masculine du recensement.
theological_decisions:
- issue: Référence masculine dans le recensement militaire
  choice: tout homme qui part à la guerre
  alternative: toute personne apte au service militaire
  rationale: Le contexte et la formulation hébraïque concernent les hommes en âge d’être mobilisés. Une expression neutre élargirait indûment la catégorie recensée ; « tout homme » maintient la portée du texte sans ajouter de condition doctrinale.
translation_notes:
  register: Français moderne, digne et lisible. La structure énumérative et les termes administratifs du recensement sont conservés. Le deux-points final maintient le caractère suspendu du verset hébreu, dont le total numérique vient au verset suivant.
