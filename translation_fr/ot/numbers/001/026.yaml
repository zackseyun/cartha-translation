  variant: modern international French
source:
  edition: WLC
  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: fr
  text: 'Pour les fils de Juda, selon leurs lignées, selon leurs clans, selon leurs maisons paternelles, d’après le décompte des noms, à partir de vingt ans, tous les hommes qui partent à la guerre[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui partent pour l’armée ». L’expression hébraïque désigne les hommes admissibles au service militaire.
    reason: Précise l’autre traduction possible de l’idiome et son sens contextuel sans l’imposer dans le texte.
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: Pour les fils de Juda
  rationale: « Fils » conserve la forme hébraïque et convient au contexte masculin du recensement, tandis que « pour » maintient la construction de la liste commencée au verset précédent.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: Le terme désigne ici la filiation ou l’organisation généalogique. « Lignées » exprime ce sens sans supposer l’existence de registres écrits.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans l’organisation tribale, מִשְׁפָּחָה désigne un groupe plus large que la famille nucléaire et inférieur à la tribu.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Cette formulation conserve l’organisation par maisons issues des pères tout en restant compréhensible en français biblique moderne.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: d’après le décompte des noms
  rationale: La formule indique que les personnes sont dénombrées individuellement par leur nom. « Décompte » est naturel et ne transforme pas implicitement l’expression en registre écrit.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: à partir de vingt ans
  rationale: Expression française courante et précise du seuil d’âge inclusif contenu dans l’hébreu.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tous les hommes qui partent à la guerre
  rationale: Cette traduction conserve l’image verbale de ceux qui « sortent » pour la guerre sans ajouter explicitement la notion interprétative d’aptitude. Le masculin est maintenu puisque le contexte concerne les hommes recensés pour le service militaire.
theological_decisions:
- issue: Langage masculin du recensement
  choice: tous les hommes qui partent à la guerre
  alternative: tous ceux qui sont aptes au service militaire
  rationale: La grammaire et le contexte concernent les hommes en âge de servir. La traduction conserve ce caractère sexué sans ajouter dans le texte la notion d’aptitude, seulement implicite dans l’idiome militaire.
translation_notes:
  register: Français international moderne, formel et lisible. La répétition de « selon » maintient le rythme de la formule de recensement; « maisons paternelles » conserve la structure sociale ancienne sans la neutraliser.
