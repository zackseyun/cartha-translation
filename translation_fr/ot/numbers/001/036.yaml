  text: לִ/בְנֵ֣י בִנְיָמִ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: fr
  text: 'Pour les fils de Benjamin, selon leurs lignées, selon leurs clans, selon leurs maisons paternelles, d’après le compte des noms, à partir de vingt ans, tous les hommes en état de partir au combat[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « tous ceux qui sortent pour l’armée », expression désignant les hommes aptes au service militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: Pour les fils de Benjamin
  rationale: Le לְ introduit ici la rubrique tribale du recensement. « Fils de Benjamin » conserve la formulation généalogique et tribale de l’hébreu.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: Dans ce contexte de recensement, le terme désigne les lignées ou les groupes fondés sur la descendance. « Lignées » est plus naturel et plus précis en français moderne que « générations ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: « Clans » distingue ce niveau de parenté de la tribu et des maisons paternelles mentionnées ensuite.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Cette expression rend le terme institutionnel israélite tout en conservant explicitement la structure de parenté patriarcale du texte.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: d’après le compte des noms
  rationale: La formule décrit un dénombrement nominatif. Cette traduction reste proche de l’hébreu sans introduire l’idée plus précise de « un par un », qui n’est pas exprimée directement.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: La formulation conserve clairement le seuil d’âge inclusif exprimé par מִן…וָמַעְלָה.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tous les hommes aptes à partir au combat
  rationale: Dans ce recensement militaire, l’expression idiomatique vise les hommes en âge et en état de servir. « Aptes à partir au combat » communique cette fonction tout en restant proche de l’image verbale de l’hébreu.
theological_decisions: []
translation_notes:
  register: Formulation actuelle et digne, avec maintien du rythme répétitif propre au registre administratif du recensement. Le deux-points final signale que le total numérique est donné au verset suivant. Le marqueur de note est placé après l’expression militaire qu’il explique, plutôt qu’après « Benjamin ».
