translation:
  language: fr
  text: Le nombre des personnes recensées[a] de la tribu d’Issacar était de cinquante-quatre mille quatre cents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur nombre » ou « les recensés ». Le terme hébreu du recensement peut désigner les personnes enregistrées et dénombrées, ou leur total.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: le nombre des hommes recensés
  rationale: Dans cette formule de recensement, le terme dérivé de פקד avec suffixe de troisième personne du masculin pluriel désigne les personnes dénombrées ou leur total. Le contexte immédiat de Nombres 1 précise qu’il s’agit d’hommes; la formulation française naturelle exprime à la fois ce référent et le total annoncé.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: La préposition לְ avec מַטֶּה indique ici l’appartenance tribale dans la formule répétée du recensement.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: cinquante-quatre mille quatre cents
  rationale: Rend exactement la quantité hébraïque dans l’ordre naturel des nombres en français contemporain.
