  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: fr
  text: 'Pour les fils de Siméon, selon leurs lignées, selon leurs clans et selon leurs maisons paternelles, les hommes recensés parmi eux[a], d’après le nombre des noms, un par un[b] : tous les hommes âgés de vingt ans ou plus, qui pouvaient partir à la guerre[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes mobilisés parmi eux » ; dans ce contexte de recensement militaire, le terme hébreu peut évoquer aussi bien le dénombrement que la mobilisation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « selon leurs crânes », expression qui signifie que chacun était compté individuellement.
    reason: cultural_note
  - marker: c
    text: Ou « tous ceux qui étaient aptes au service militaire » ; l’hébreu dit plus littéralement « tous ceux qui sortaient pour l’armée/la guerre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: Pour les fils de Siméon
  rationale: « Fils » conserve le lien formel avec l’ancêtre éponyme tout en désignant ici les membres masculins de la tribu.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: Dans ce contexte généalogique et administratif, le terme désigne les lignes de descendance; « lignées » est plus naturel en français actuel que le calque « générations ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Le mot désigne une unité de parenté interne à la tribu, plus précisément un clan qu’une simple famille.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Cette formulation conserve la structure sociale patri-linéaire explicite du texte hébreu sans la remplacer par une catégorie moderne.
- source_word: פְּקֻדָיו
  choice: les hommes recensés parmi eux
  rationale: Le participe de פקד renvoie ici aux personnes enregistrées lors du recensement, tout en pouvant comporter une nuance de mobilisation militaire.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: d’après le nombre des noms
  rationale: La formulation garde l’idée d’un dénombrement administratif fondé sur les noms individuels.
- source_word: לְגֻלְגְּלֹתָם
  choice: un par un
  rationale: Littéralement « selon leurs crânes/têtes »; l’expression idiomatique indique que chaque individu était compté séparément.
- source_word: כָּל זָכָר
  choice: tous les hommes
  rationale: Dans ce recensement militaire limité aux personnes de vingt ans ou plus, « hommes » exprime naturellement en français la référence aux individus de sexe masculin.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: âgés de vingt ans ou plus
  rationale: Rendu français naturel et exact de la formule fixant le seuil d’âge.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tous ceux qui partaient pour la guerre
  rationale: La traduction conserve l’image verbale du départ à la guerre plutôt que de réduire d’emblée l’expression à l’aptitude au service militaire.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et lisible. La phrase conserve la structure cumulative du registre de recensement hébreu, tout en coordonnant les catégories pour éviter une lourdeur excessive.
