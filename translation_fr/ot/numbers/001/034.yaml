  to: 'Pour les fils de Manassé : selon leurs généalogies, selon leurs clans, selon leurs maisons paternelles, d’après le nombre des noms, tous les hommes de vingt ans et plus, tous ceux qui étaient mobilisables[a] :'
  rationale: La révision rétablit le caractère elliptique de la formule hébraïque, rend תּוֹלְדֹתָם par « généalogies » et emploie les termes institutionnels « maisons paternelles » et « mobilisables ». Elle maintient la référence explicite aux hommes et l’ouverture syntaxique vers le résultat du verset suivant, tout en rapprochant la note de la formulation hébraïque.
