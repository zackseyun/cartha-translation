  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: fr
  text: 'Pour les fils de Manassé : selon leurs généalogies, selon leurs clans, selon leurs maisons paternelles, d’après le nombre des noms, tous les hommes de vingt ans et plus, tous ceux qui étaient mobilisables[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui sortaient pour l’armée ». L’expression hébraïque désigne, dans cette formule de recensement, les hommes susceptibles d’être appelés au service militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: Pour les fils de Manassé
  rationale: Dans cette formule de recensement, le ל préfixé introduit la tribu concernée. « Fils de Manassé » conserve la désignation généalogique du texte.
- source_word: תּוֹלְדֹתָם
  choice: on releva leurs descendants
  rationale: Le nom תּוֹלְדוֹת désigne ici la filiation ou les lignées recensées. La formulation verbale française restitue naturellement la construction elliptique hébraïque dans son contexte.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre tribal, מִשְׁפָּחָה désigne une subdivision de parenté plus large que la famille nucléaire ; « clans » est précis et naturel.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons ancestrales
  rationale: L’expression désigne les unités de parenté rattachées à un ancêtre paternel. « Maisons ancestrales » est intelligible en français moderne sans réduire la maison au bâtiment.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: en comptant les noms
  rationale: La formule indique un dénombrement nominatif des personnes ; cette tournure conserve l’image des noms comptés tout en restant idiomatique.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: âgés de vingt ans et plus
  rationale: Cette formulation française rend clairement et naturellement le seuil d’âge exprimé par l’idiome hébraïque.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tous les hommes … aptes au service militaire
  rationale: Dans ce recensement, le participe masculin singulier collectif vise les hommes en âge de servir. « Aptes au service militaire » exprime l’éligibilité impliquée par l’expression sans obliger à comprendre qu’ils partaient alors effectivement en campagne.
theological_decisions:
- issue: Langage genré du recensement militaire
  choice: tous les hommes âgés de vingt ans et plus
  alternative: toute personne âgée de vingt ans et plus
  rationale: Le contexte et la forme masculine de l’hébreu concernent les hommes soumis au recensement militaire ; la traduction conserve cette référence plutôt que de la neutraliser.
- issue: Portée de יֹצֵא צָבָא
  choice: aptes au service militaire
  alternative: partant à la guerre
  rationale: L’expression peut évoquer littéralement le fait de sortir avec l’armée, mais, dans la formule de recensement, elle caractérise l’admissibilité au service. La note maintient l’autre formulation possible.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de la formule censitaire est conservée, mais l’ellipse nominale hébraïque est rendue par « on releva » pour produire une phrase naturelle. Le deux-points maintient le lien avec le total donné au verset suivant.
