  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: fr
  text: 'À partir de vingt ans, tous les hommes d’Israël aptes au service militaire[a] : toi et Aaron, vous les recenserez selon leurs unités[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout homme qui sort pour l’armée ». Cette expression hébraïque est un idiome militaire désignant ceux qui sont aptes au service militaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « selon leurs formations militaires » ou « selon leurs contingents ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: Depuis l’âge de vingt ans
  rationale: Cette formulation française naturelle exprime le seuil d’âge inclusif marqué par l’expression hébraïque, sans le calque pesant « vingt ans et au-dessus ».
- source_word: כָּל יֹצֵא צָבָא
  choice: tous les hommes … aptes au service militaire
  rationale: L’expression est un idiome militaire désignant les personnes susceptibles d’être mobilisées. Le masculin explicite convient ici, puisque le recensement du chapitre porte sur les hommes.
- source_word: בְּיִשְׂרָאֵל
  choice: d’Israël
  rationale: Dans cette construction française, « les hommes d’Israël » rend naturellement l’appartenance au peuple désignée par בְּיִשְׂרָאֵל.
- source_word: תִּפְקְדוּ אֹתָם
  choice: vous les recenserez
  rationale: Dans ce contexte de dénombrement en vue du service, « recenser » exprime plus précisément פקד que le simple verbe « compter ».
- source_word: לְצִבְאֹתָם
  choice: par unités
  rationale: Le pluriel צִבְאֹתָם renvoie à l’organisation des recensés en formations militaires. « Par unités » est clair, actuel et conserve ce sens collectif.
- source_word: אַתָּה וְאַהֲרֹן
  choice: toi et Aaron, vous
  rationale: La reprise par « vous » est idiomatique en français et maintient l’insistance de l’hébreu sur les deux responsables du recensement.
theological_decisions:
- issue: Langage masculin de l’admissibilité militaire
  choice: tous les hommes d’Israël aptes au service militaire
  alternative: tous ceux d’Israël qui partent à la guerre
  rationale: Le contexte immédiat précise que le recensement concerne les hommes. Le rendre explicitement ne constitue donc pas une généralisation doctrinale, mais reflète la portée référentielle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite les calques hébraïques peu naturels tout en signalant en note l’image concrète de « sortir pour l’armée ». Les deux marqueurs de note figurent dans le texte à l’endroit correspondant.
