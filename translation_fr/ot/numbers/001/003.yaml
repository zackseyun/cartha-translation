  to: 'À partir de vingt ans, tous les hommes d’Israël aptes au service militaire[a] : toi et Aaron, vous les recenserez selon leurs unités[b].'
  rationale: La révision remplace « Depuis » par une expression française de borne d’âge et explicite, par « leurs », le rapport aux formations militaires. Elle conserve le masculin contextuellement requis, la nuance d’aptitude militaire de l’idiome et les deux ancres de notes.
