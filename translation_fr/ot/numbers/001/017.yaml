  text: וַ/יִּקַּ֥ח מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן אֵ֚ת הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: fr
  text: Moïse et Aaron prirent ces hommes[a], qui avaient été désignés nommément.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui avaient été désignés par leurs noms », c’est-à-dire précisément identifiés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prirent
  rationale: Le verbe לקח signifie ici naturellement « prendre ». Le pluriel français s’impose puisque Moïse et Aaron sont tous deux sujets; dans ce contexte, ils prennent avec eux ou rassemblent les hommes déjà identifiés.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises usuelles des noms bibliques.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: ces hommes
  rationale: Le groupe nominal désigne précisément les représentants masculins énumérés auparavant. « Hommes » conserve cette précision sans expliciter leur fonction.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif « qui » reprend naturellement « ces hommes » comme sujet de la proposition relative.
- source_word: נִקְּבוּ
  choice: avaient été désignés
  rationale: Le niphal de נקב exprime ici le fait d’avoir été nommément identifié ou désigné. « Désignés » convient au contexte officiel du recensement tout en conservant l’idée d’une identification précise.
- source_word: בְּשֵׁמוֹת
  choice: par leur nom
  rationale: Cette expression indique une identification nominative. « Par leur nom » est naturel en français et conserve la formulation hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La construction reste proche de l’ordre narratif hébreu, avec « donc » pour rendre l’enchaînement du waw narratif. Le plus-que-parfait situe la désignation avant l’action de Moïse et d’Aaron.
