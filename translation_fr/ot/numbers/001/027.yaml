  text: Those counted from the tribe of Judah were seventy-four thousand six hundred[a].
translation:
  language: fr
  text: Ceux de la tribu de Juda qui furent recensés étaient au nombre de soixante-quatorze mille six cents[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enregistrés ». Le participe hébreu employé dans cette formule de recensement peut être rendu de l’une ou l’autre manière.
