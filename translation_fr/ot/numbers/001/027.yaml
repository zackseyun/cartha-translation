lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: Les hommes recensés
  rationale: Dans cette formule de recensement, le participe passif de פקד désigne ceux qui ont été recensés ou enregistrés. « Les hommes » est explicité par le contexte immédiat du recensement (Nombres 1.20-22), tandis que « recensés » convient naturellement au français moderne.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: La préposition ל avec מַטֶּה indique ici l’appartenance tribale. « De la tribu de » est la formulation française la plus naturelle dans cette liste de recensement.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: soixante-quatorze mille six cents
  rationale: Le nombre hébreu, littéralement construit comme « quatre et soixante-dix mille et six cents », est rendu selon l’usage numérique courant du français international.
