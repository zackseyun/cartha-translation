id: NUM.1.2
reference: Numbers 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: fr
  text: Faites le recensement[a] de toute la communauté des fils d’Israël[b], selon leurs clans et leurs maisons paternelles, en comptant nominativement toute personne de sexe masculin, tête par tête[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Levez la tête de »; c’est-à-dire comptez ou inscrivez en vue d’un recensement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des Israélites ». Littéralement : « des fils d’Israël ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « selon leurs crânes »; expression idiomatique signifiant que chacun doit être compté individuellement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: Faites le recensement
  rationale: L’expression signifie littéralement « levez la tête de », mais, dans ce contexte administratif, elle demande de compter et d’inscrire les membres de la communauté. « Faites le recensement » en exprime clairement le sens.
- source_word: כָּל עֲדַת
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble collectif d’Israël. « Communauté » est naturel en français moderne et conserve cette dimension corporative.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation garde l’expression généalogique masculine de l’hébreu. Une note indique l’équivalent français plus idiomatique « les Israélites ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision fondée sur la parenté au sein des tribus; « clans » est plus précis que le sens moderne courant de « familles ».
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: L’expression renvoie aux groupes de descendance structurés selon la lignée paternelle. « Maisons paternelles » en préserve la forme et le cadre social.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: en comptant nominativement
  rationale: L’hébreu évoque un dénombrement fondé sur les noms enregistrés. « En comptant nominativement » rend cette procédure administrative dans un français naturel sans la réduire à un simple total.
- source_word: כָּל זָכָר
  choice: toute personne de sexe masculin
  rationale: זָכָר précise le sexe masculin. Cette formulation reste exacte sans employer le substantif français « mâle », qui paraîtrait déshumanisant dans ce contexte.
- source_word: לְגֻלְגְּלֹתָם
  choice: tête par tête
  rationale: Littéralement « selon leurs crânes/têtes », cette expression idiomatique présente le comptage individuel. « Tête par tête » conserve l’image concrète tout en restant compréhensible.
theological_decisions: []
