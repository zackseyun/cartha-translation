  text: So all those who were counted were six hundred three thousand five hundred and fifty[a].
translation:
  language: fr
  text: Ainsi, le total de ceux qui furent recensés fut de six cent trois mille cinq cent cinquante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dénombrés » ou « ceux qui furent passés en revue ». L’hébreu désigne les personnes enregistrées lors du recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Ainsi, ... étaient au nombre de
  rationale: Le waw consécutif avec היה fait avancer le récit tout en introduisant le total récapitulatif; cette tournure exprime naturellement en français le résultat du recensement.
- source_word: כָּל
  choice: tous
  rationale: Conserve la portée exhaustive de l’hébreu dans cette déclaration récapitulative.
- source_word: הַפְּקֻדִים
  choice: ceux qui furent recensés
  rationale: Le participe passif de פקד désigne ici les personnes enregistrées lors du recensement. Cette formulation reste claire et n’ajoute pas « hommes », que le contexte établit mais que ce verset ne répète pas.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: six cent trois mille cinq cent cinquante
  rationale: Rend la valeur exacte de la construction additive hébraïque selon la formulation idiomatique des nombres en français moderne.
