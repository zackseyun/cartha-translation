lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: les hommes recensés
  rationale: Le terme désigne ici les personnes enregistrées lors du recensement. Dans le contexte de Nombres 1, il s’agit des hommes remplissant les conditions énoncées précédemment; « hommes recensés » rend naturellement le référent implicite.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: La préposition לְ avec מַטֶּה exprime ici l’appartenance tribale; cette formulation est idiomatique en français et convient à la formule répétée du chapitre.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française courante du nom personnel et tribal biblique.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: quarante-six mille cinq cents
  rationale: Le nombre est présenté dans l’ordre usuel du français moderne, tout en conservant exactement le total hébreu.
