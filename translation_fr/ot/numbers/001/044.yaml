revisions:
- from: Voici ceux qui furent recensés[a], ceux que Moïse et Aaron recensèrent. Les responsables d’Israël — douze hommes, un pour chaque maison ancestrale[b] — étaient avec eux.
  to: 'Voici ceux qui furent recensés[a] par Moïse, Aaron et les responsables d’Israël : douze hommes, chacun représentant sa maison paternelle[b].'
  rationale: La révision rétablit les trois groupes — Moïse, Aaron et les responsables d’Israël — comme agents coordonnés du recensement. Les douze hommes sont ainsi correctement compris comme ces responsables, chacun représentant sa maison paternelle. Elle ne suit pas l’ajout interprétatif anglais « were with them », qui ne correspond pas à une expression hébraïque signifiant « avec eux ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:26:09Z'
review_pass:
  verdict: revise
  source_fidelity: La structure du texte hébreu fait de Moïse, Aaron et les responsables d’Israël les sujets conjoints de l’action de recenser. Les « douze hommes » sont apposés aux responsables, et la finale indique leur représentation respective de leur maison paternelle. Elle ne dit pas qu’ils « étaient avec » Moïse et Aaron.
  naturalness: La version révisée est fluide en français international moderne, conserve un registre biblique sobre et évite une seconde phrase qui dissociait à tort les responsables de l’action du recensement.
  terminology: « Responsables d’Israël » rend naturellement נְשִׂיאֵי יִשְׂרָאֵל. « Maison paternelle » conserve l’expression sociale et patrilinéaire de לְבֵית אֲבֹתָיו; la note en explicite le sens sans l’aplatir.
  issues:
  - severity: high
    issue: « Les responsables d’Israël … étaient avec eux »
    rationale: « Avec eux » n’est pas présent dans l’hébreu. Le waw relie les responsables à Moïse et Aaron comme agents du recensement, non comme un groupe simplement présent auprès d’eux. La segmentation en deux phrases modifie donc la syntaxe et le sens du verset.
  - severity: medium
    issue: « maison ancestrale »
    rationale: Cette expression est intelligible, mais elle ne signale pas explicitement l’élément paternel de בית אבותיו. « Maison paternelle », avec une note culturelle, est à la fois plus précis et idiomatique dans ce contexte biblique.
  revised_text: 'Voici ceux qui furent recensés[a] par Moïse, Aaron et les responsables d’Israël : douze hommes, chacun représentant sa maison paternelle[b].'
