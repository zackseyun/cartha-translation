  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: fr
  text: 'Voici ceux qui furent recensés[a] par Moïse, Aaron et les responsables d’Israël : douze hommes, chacun représentant sa maison paternelle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui furent dénombrés ». L’hébreu peut mettre l’accent soit sur les personnes comptées, soit sur leur inscription au recensement.
    reason: lexical_alternative
  - marker: b
    text: La « maison paternelle » désigne l’unité familiale ou clanique fondée sur la lignée paternelle dans l’organisation tribale d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: ceux qui furent recensés
  rationale: Le participe passif désigne ici les personnes recensées. « Recensés » exprime clairement le contexte du dénombrement militaire sans réduire le terme à un total abstrait.
- source_word: פָּקַד
  choice: recensèrent
  rationale: Dans Nombres 1, le verbe désigne l’action d’effectuer le recensement. La répétition avec « recensés » reflète celle de la racine hébraïque.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: les responsables d’Israël
  rationale: Le terme désigne les dirigeants tribaux. « Responsables » est actuel et évite la connotation dynastique de « princes ».
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: douze hommes
  rationale: L’hébreu emploie explicitement אִישׁ au masculin; « hommes » en conserve la précision.
- source_word: אִישׁ אֶחָד
  choice: un pour chaque
  rationale: Cette formulation rend naturellement la valeur distributive de l’expression hébraïque dans son lien avec les maisons ancestrales.
- source_word: לְבֵית אֲבֹתָיו
  choice: pour chaque maison ancestrale
  rationale: « Maison ancestrale » désigne l’unité familiale patrilinéaire représentée par chacun des douze hommes, tout en restant intelligible en français moderne.
- source_word: הָיוּ
  choice: étaient avec eux
  rationale: Le verbe est explicitement rendu et rattache les douze responsables à Moïse et Aaron comme participants au recensement.
