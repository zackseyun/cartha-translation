  verdict: revise
  source_fidelity: La structure distributive est bien rendue, et « Les Israélites » est un équivalent naturel de בְּנֵי יִשְׂרָאֵל. Toutefois, « sous sa bannière » introduit l’image idiomatique de l’allégeance plutôt que de rendre directement le repérage/placement exprimé par עַל; « près de sa bannière » conserve mieux la relation spatiale. « Formations » reste possible, mais atténue le sens militaire et organisationnel de לְצִבְאֹתָם dans ce contexte de recensement et d’ordonnancement du camp.
  naturalness: La phrase est claire et idiomatique en français international moderne. « Chacun dans son camp, chacun près de sa bannière » est naturel tout en reproduisant la répétition distributive de l’hébreu.
  terminology: « Bannière » convient bien pour דֶּגֶל. « Corps d’armée » rend explicitement la dimension militaire de צְבָאוֹת, sans imposer l’idée d’un combat en cours; une note peut signaler « unités » comme équivalent moins technique.
  issues:
  - severity: medium
    issue: « sous sa bannière »
    rationale: Cette expression française suggère surtout l’adhésion ou le ralliement à une bannière. Le עַל hébreu, dans cette instruction de disposition du camp, est mieux rendu par une indication de proximité/position, telle que « près de sa bannière ».
  - severity: low
    issue: « selon leurs formations »
    rationale: Le terme est compréhensible, mais trop général pour צְבָאוֹת, qui désigne ici des unités organisées dans un cadre militaire. « Selon leurs corps d’armée » est plus précis et correspond à l’usage contextuel.
