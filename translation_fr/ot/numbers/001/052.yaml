  text: וְ/חָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל מַחֲנֵ֛/הוּ וְ/אִ֥ישׁ עַל דִּגְל֖/וֹ לְ/צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: fr
  text: Les Israélites[a] camperont, chacun dans son camp, chacun près de sa bannière, selon leurs corps d’armée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « selon leurs unités ». Le terme hébreu désigne des groupes organisés, souvent à caractère militaire.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְחָנוּ
  choice: camperont
  rationale: Le parfait qal précédé de la conjonction prend ici, dans un contexte d’instructions, une valeur future et prescriptive. « Camperont » reste naturel tout en conservant la formulation solennelle de l’ordre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais fonctionne comme un nom collectif désignant le peuple. « Les Israélites » est la formulation la plus naturelle en français moderne.
- source_word: אִישׁ ... וְאִישׁ
  choice: chacun ... et chacun
  rationale: La répétition distributive de אִישׁ est conservée. En français, « chacun » exprime naturellement l’affectation de chaque homme sans alourdir la phrase.
- source_word: עַל מַחֲנֵהוּ
  choice: dans son camp
  rationale: Ici, עַל marque l’emplacement ou le rattachement. « Dans son camp » rend clairement l’appartenance de chacun au camp qui lui est assigné, sans imposer une position spatiale trop précise.
- source_word: דִּגְלוֹ
  choice: sous sa bannière
  rationale: דֶּגֶל désigne l’étendard ou la bannière d’un groupe tribal. L’expression française « sous sa bannière » est naturelle et évoque à la fois le signe de ralliement et l’organisation du camp.
- source_word: לְצִבְאֹתָם
  choice: selon leurs formations
  rationale: צָבָא peut désigner une armée, un corps organisé ou une unité mobilisée. « Formations » conserve l’idée d’une organisation structurée, probablement militaire, sans suggérer nécessairement un combat en cours.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition « chacun… chacun » reproduit l’insistance distributive de l’hébreu, tandis que « sous sa bannière » restitue idiomatiquement l’organisation tribale du camp.
