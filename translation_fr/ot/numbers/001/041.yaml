lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: Les hommes recensés
  rationale: Dans le contexte explicite du recensement de Nombres 1, cette forme issue de פקד désigne les membres comptés. « Recensés » conserve le sens administratif; « hommes » est explicité naturellement en français d’après le groupe défini dans le contexte immédiat.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: La préposition ל avec מַטֶּה indique ici l’appartenance tribale. « De la tribu de » est la formulation française naturelle dans cette série de dénombrements.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 41 500
  rationale: La valeur exacte du nombre hébreu est conservée, avec la présentation numérique usuelle en français moderne.
