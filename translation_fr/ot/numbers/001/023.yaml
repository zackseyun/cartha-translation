lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: les hommes recensés
  rationale: Dans le contexte du recensement militaire de Nombres 1, le terme désigne les personnes comptées et inscrites. « Hommes » est explicité par le contexte immédiat (1.20-22), tandis que « recensés » rend naturellement l’idée de פקד.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: Dans cette formule de recensement, לְ avec מַטֶּה indique l’appartenance tribale; « de la tribu de » est idiomatique en français.
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: cinquante-neuf mille trois cents
  rationale: Rend exactement le total hébreu selon l’ordre naturel des nombres en français moderne.
