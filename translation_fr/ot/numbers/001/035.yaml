lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: Les hommes recensés
  rationale: Dans le contexte de ce recensement, la forme issue de פקד désigne les personnes comptées. « Les hommes recensés » explicite naturellement en français le référent masculin défini par le contexte immédiat.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: La préposition ל avec מַטֶּה marque ici l’appartenance tribale. « De la tribu de » est la formulation française naturelle dans cette formule de recensement.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: trente-deux mille deux cents
  rationale: Cette formulation rend exactement le nombre hébreu, 32 200, selon l’ordre naturel du français moderne.
