  text: לִ/בְנֵ֣י אָשֵׁ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: fr
  text: 'Pour les fils d’Aser, selon leurs lignées, selon leurs clans et selon leurs maisons paternelles, d’après le compte des noms, âgé de vingt ans et plus, tout homme apte à partir à la guerre[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout [homme] allant à l’armée » ; expression désignant les hommes aptes au service militaire.'
    reason: L’expression hébraïque est un idiome militaire ; la traduction principale en exprime le sens dans le contexte du recensement, tandis que la note conserve sa formulation littérale.
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: Pour les fils d’Aser
  rationale: La préposition לְ introduit ici la rubrique tribale. « Fils d’Aser » conserve le langage de filiation du texte tout en désignant les membres de la tribu.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: Dans ce recensement, le terme renvoie aux lignes de descendance. « Lignées » exprime ce sens sans supposer nécessairement l’existence de registres écrits.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une unité de parenté à l’intérieur de la tribu ; « clans » est plus précis que le terme général « familles ».
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Cette formulation conserve l’expression sociale et généalogique israélite sans la remplacer par une catégorie familiale moderne.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: d’après le compte des noms
  rationale: La formule indique que les personnes sont recensées individuellement par leur nom. « Le compte des noms » reste proche de l’hébreu tout en étant compréhensible en français.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: La traduction conserve le seuil d’âge et la portée ouverte de la formule hébraïque.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tout homme apte à partir à la guerre
  rationale: L’expression idiomatique vise les hommes admissibles au service militaire. « Apte à » rend cette portée contextuelle, tandis que la note préserve l’image littérale de la sortie pour l’armée.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure répétitive propre à la formule de recensement est conservée, avec un léger allègement par la coordination « et ». Le deux-points final maintient le lien syntaxique avec le verset suivant.
