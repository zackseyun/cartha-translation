lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: les hommes recensés
  rationale: Dans cette formule de recensement, le terme désigne les personnes dénombrées et enregistrées. Le contexte immédiat précise qu’il s’agit des hommes aptes au service; « les hommes recensés » est naturel en français sans accentuer davantage la nuance militaire.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: Avec מַטֶּה, la préposition לְ indique ici l’appartenance tribale. « De la tribu de » rend cette relation de façon idiomatique.
- source_word: אֶפְרָיִם
  choice: Éphraïm
  rationale: Forme française traditionnelle et courante de ce nom propre biblique.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: quarante mille cinq cents
  rationale: Rendu direct du nombre cardinal, écrit en toutes lettres dans la prose suivie.
