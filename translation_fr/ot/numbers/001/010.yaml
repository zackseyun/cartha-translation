  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: fr
  text: 'Pour les fils de Joseph : pour Éphraïm, Élishama, fils d’Ammihoud ; pour Manassé, Gamaliel, fils de Pedah-Tsour.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Pour les fils de Joseph
  rationale: La préposition ל introduit ici la désignation tribale dans la liste. « Fils de Joseph » conserve la forme hébraïque tout en désignant les deux branches issues de Joseph.
- source_word: לְאֶפְרַיִם
  choice: pour Éphraïm
  rationale: La répétition de ל introduit la première branche de Joseph. La formulation concise respecte la structure de la liste sans ajouter « tribu de », qui reste implicite dans le contexte.
- source_word: אֱלִישָׁמָע
  choice: Élishama
  rationale: Transcription française moderne du nom propre hébreu, en conservant sa forme traditionnelle reconnaissable.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement la relation filiale exprimée par l’état construit hébreu et convient au style d’une liste généalogique.
- source_word: עַמִּיהוּד
  choice: Ammihoud
  rationale: Transcription française du nom propre hébreu.
- source_word: לִמְנַשֶּׁה
  choice: pour Manassé
  rationale: Expression parallèle à « pour Éphraïm », qui conserve la structure de la liste sous la rubrique des fils de Joseph.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Forme française traditionnelle et reconnaissable du nom propre hébreu.
- source_word: פְּדָהצוּר
  choice: Pedah-Tsour
  rationale: Transcription qui rend distinctement les deux éléments perceptibles du nom hébreu et représente צ par « ts » selon un usage français clair.
