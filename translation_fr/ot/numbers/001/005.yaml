  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: fr
  text: 'Voici les noms des hommes qui se tiendront avec vous : pour Ruben[a], Élitsour, fils de Shedéour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de Ruben : Élitsour, fils de Shedéour ». La préposition hébraïque peut indiquer l’appartenance à la tribu ou sa représentation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: Voici les noms
  rationale: La formule présentative française « Voici les noms » rend naturellement l’hébreu et introduit la liste, sans reproduire mécaniquement la coordination initiale וְ.
- source_word: הָאֲנָשִׁים
  choice: des hommes
  rationale: Le contexte désigne des représentants masculins précis; « hommes » conserve cette donnée explicite du texte.
- source_word: אֲשֶׁר יַעַמְדוּ אִתְּכֶם
  choice: qui se tiendront avec vous
  rationale: Cette formulation conserve le sens concret de עמד, « se tenir », ainsi que l’idée de présence et de service aux côtés de Moïse et d’Aaron.
- source_word: לִרְאוּבֵן
  choice: pour Ruben
  rationale: Le לְ marque ici vraisemblablement la représentation ou l’appartenance tribale; « pour Ruben » exprime la fonction représentative tout en laissant signaler en note l’autre analyse possible.
- source_word: אֱלִיצוּר
  choice: Élitsour
  rationale: Translittération française du nom hébreu, avec des graphies permettant une prononciation proche de la forme source.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu usuel et direct de la formule généalogique hébraïque.
- source_word: שְׁדֵיאוּר
  choice: Shedéour
  rationale: Translittération française du nom propre hébreu.
