revisions:
- from: 'Pour les fils de Zabulon, selon leurs lignées, leurs clans et leurs familles paternelles, d’après le compte des noms, depuis l’âge de vingt ans et au-dessus, tout homme en mesure de partir à la guerre[a] :'
  to: 'Pour les fils de Zabulon, selon leurs lignées, leurs clans et leurs maisons paternelles, d’après le nombre des noms, à partir de vingt ans, tout homme qui peut partir à la guerre[a] :'
  rationale: La révision restitue « maisons paternelles », correspondant à la formule technique « maison des pères », et remplace une tournure d’âge peu idiomatique par une formulation française fluide. Le sens militaire, la référence explicite aux hommes et le caractère ouvert de la formule participiale sont maintenus ; la note présente l’alternative administrative sans imposer une interprétation exclusive.
