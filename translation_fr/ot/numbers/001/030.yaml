review_pass:
  verdict: revise
  source_fidelity: 'La formule de recensement est globalement bien rendue : la portée masculine et militaire de כֹּל יֹצֵא צָבָא est conservée, de même que l’enchaînement des subdivisions généalogiques. Toutefois, « familles paternelles » atténue l’expression technique לְבֵית אֲבֹתָם (« maisons de leurs pères »), et la tournure d’âge mérite une formulation française plus idiomatique.'
  naturalness: Le registre est clair et convenable. « Depuis l’âge de vingt ans et au-dessus » est toutefois lourd et peu naturel en français moderne ; « à partir de vingt ans » est plus fluide sans modifier le seuil. « Maisons paternelles » est à la fois plus fidèle et plus naturel dans le cadre administratif et généalogique biblique que « familles paternelles ».
  terminology: « Zabulon », « lignées », « clans », « nombre des noms » et « partir à la guerre » sont appropriés. « Maisons paternelles » rend mieux la terminologie de parenté que « familles paternelles ». La note doit éviter de présenter « pour l’armée » comme une littéralité univoque, puisque l’expression est un idiome militaire.
  issues:
  - severity: medium
    issue: « leurs familles paternelles » pour לְבֵית אֲבֹתָם
    rationale: L’hébreu parle littéralement de la « maison des pères », une unité de parenté ou de maisonnée. « Familles paternelles » généralise cette expression technique et perd l’image institutionnelle de la maison.
  - severity: low
    issue: « depuis l’âge de vingt ans et au-dessus »
    rationale: La formulation est maladroite en français moderne. « À partir de vingt ans » rend le seuil d’âge de façon naturelle.
  - severity: low
    issue: Explication de la littéralité dans la note
    rationale: « Qui sort pour l’armée » n’est pas la seule représentation littérale possible de יֹצֵא צָבָא. Une note qui identifie l’expression comme un idiome militaire et donne « partir à la guerre » comme littéralité proche est plus précise.
  revised_text: 'Pour les fils de Zabulon, selon leurs lignées, leurs clans et leurs maisons paternelles, d’après le nombre des noms, à partir de vingt ans, tout homme qui peut partir à la guerre[a] :'
  revised_footnotes:
