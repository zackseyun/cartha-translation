  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: fr
  text: 'Pour les fils de Zabulon, selon leurs lignées, leurs clans et leurs maisons paternelles, d’après le nombre des noms, à partir de vingt ans, tout homme qui peut partir à la guerre[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « apte au service militaire ». L’expression hébraïque est un idiome militaire, littéralement proche de « qui part à la guerre ».
    reason: Alternative lexicale et précision sur l’idiome militaire hébreu.
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: Pour les fils de Zabulon
  rationale: Le ל préfixé introduit ici la rubrique tribale du recensement. « Fils de » conserve la formulation généalogique répétitive, et « Zabulon » est la forme française traditionnelle et courante du nom.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: Dans ce contexte de recensement, le terme désigne l’ordonnancement selon la descendance; « lignées » en exprime naturellement la valeur généalogique.
- source_word: לְמִשְׁפְּחֹתָם
  choice: leurs clans
  rationale: Le mot désigne ici les subdivisions de parenté au sein de la tribu; « clans » est plus précis que le terme général « familles ».
- source_word: לְבֵית אֲבֹתָם
  choice: leurs familles paternelles
  rationale: Cette expression technique désigne les groupes familiaux structurés selon les maisons des pères. La formulation française reste intelligible sans effacer la référence paternelle.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: d’après le compte des noms
  rationale: La traduction garde l’image d’un dénombrement nominatif sans la remplacer par la paraphrase plus interprétative « décompte individuel ».
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Cette formulation rend explicitement le seuil d’âge tout en conservant la tournure ascendante de l’hébreu.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tout homme en mesure de partir à la guerre
  rationale: Dans le cadre de ce recensement militaire, כֹּל vise les hommes concernés, et l’expression participiale désigne ceux qui peuvent partir en campagne. La traduction garde l’image militaire concrète de l’hébreu.
theological_decisions:
- issue: Portée masculine du recensement militaire
  choice: tout homme en mesure de partir à la guerre
  alternative: toute personne apte au service militaire
  rationale: Le contexte et la formule hébraïque concernent les hommes soumis au recensement militaire. Une formulation neutre élargirait indûment la portée du texte.
- issue: Degré d’interprétation de יֹצֵא צָבָא
  choice: en mesure de partir à la guerre
  alternative: apte au service militaire
  rationale: La formulation retenue communique l’éligibilité militaire sans réduire l’expression à une catégorie administrative moderne; la note signale la valeur idiomatique possible.
translation_notes:
  register: Français international moderne, digne et lisible. La structure cumulative du formulaire de recensement est conservée, avec une légère coordination pour éviter une succession pesante de compléments. Le deux-points final maintient le lien syntaxique avec le verset suivant.
