  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַֽ/יִּפְקְדֵ֖/ם בְּ/מִדְבַּ֥ר סִינָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: fr
  text: Comme Yahweh l’avait ordonné à Moïse, Moïse les recensa[a] dans le désert du Sinaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dénombra » ou « les passa en revue ». Le verbe hébreu peut désigner l’enregistrement de personnes ou la réalisation d’un recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Comme
  rationale: La conjonction exprime ici la conformité de l’action de Moïse au commandement reçu; « Comme » est naturel et fidèle en français.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait indique naturellement que le commandement de Yahweh précède le recensement dans le déroulement du récit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette forme rend le nom divin personnel exprimé par le tétragramme, sans lui substituer un titre.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Avec le verbe français « ordonner », la personne qui reçoit l’ordre est introduite par « à »; la particule hébraïque אֶת n’est pas rendue séparément.
- source_word: וַיִּפְקְדֵם
  choice: il les recensa
  rationale: Dans le contexte du dénombrement d’Israël, פקד désigne l’action de recenser ou de dénombrer les personnes; « recensa » exprime clairement la dimension officielle de l’opération.
- source_word: בְּמִדְבַּר סִינָי
  choice: dans le désert du Sinaï
  rationale: « Désert du Sinaï » est l’expression géographique courante en français et rend naturellement la relation construite de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit l’ordre du texte hébreu tout en employant une syntaxe française naturelle; le pronom « il » renvoie normalement à Moïse, l’antécédent immédiat.
