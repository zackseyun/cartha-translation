  variant: modern international French
source:
  edition: WLC
  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: fr
  text: Seulement, tu ne recenseras pas la tribu de Lévi et tu ne relèveras pas leur nombre parmi les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Seulement
  rationale: La particule introduit ici une exception restrictive aux instructions de recensement précédentes. « Seulement » rend cette valeur plus précisément qu’un simple « mais ».
- source_word: מַטֵּה לֵוִי
  choice: la tribu de Lévi
  rationale: Dans ce contexte de recensement, מַטֶּה désigne une tribu, et non littéralement un bâton.
- source_word: תִפְקֹד
  choice: tu ne recenseras pas
  rationale: Dans ce cadre, פקד désigne l’action de dénombrer ou de recenser un groupe. « Recenser » est précis et naturel en français.
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: tu ne relèveras pas leur nombre
  rationale: L’expression littérale évoque le fait de « lever leur tête », mais constitue ici une tournure de recensement indiquant qu’on établit l’effectif total. « Relever leur nombre » conserve le caractère distinct de la seconde proposition sans produire un calque obscur.
- source_word: בְּתוֹךְ
  choice: parmi
  rationale: La préposition indique ici l’inclusion dans l’ensemble plus vaste soumis au recensement. « Parmi » est l’équivalent français le plus naturel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression, littéralement masculine plurielle, est une désignation traditionnelle du peuple issu d’Israël. Le rendu formel préserve cette formulation, tandis qu’une note donne les équivalents français plus génériques.
theological_decisions:
- issue: Portée de l’exclusion des Lévites
  choice: La tribu de Lévi est exclue du recensement effectué parmi les autres fils d’Israël.
  alternative: Comprendre l’ordre comme une exclusion générale de tout dénombrement des Lévites.
  rationale: Le complément « parmi les fils d’Israël » rattache l’interdiction au recensement national décrit dans le contexte. Le verset n’enseigne pas en lui-même que les Lévites ne pourront jamais faire l’objet d’un dénombrement distinct.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le texte hébreu emploie la forme masculine plurielle « fils de ». La traduction la conserve sans nier que, selon le contexte, l’expression puisse aussi servir de désignation collective du peuple.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à l’adresse divine singulière à Moïse. « Recenser » convient au cadre administratif et militaire; « relever leur nombre » rend distinctement la seconde formule hébraïque sans lourdeur excessive.
