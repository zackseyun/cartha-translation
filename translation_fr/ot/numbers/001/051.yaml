  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: fr
  text: Quand le tabernacle se mettra en route, les Lévites le démonteront ; quand il fera halte, les Lévites le dresseront. Toute personne non autorisée[a] qui s’approchera sera mise à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étranger », « la personne extérieure au service sacré ». Ici, le terme hébreu désigne quelqu’un qui n’est pas autorisé à s’approcher du sanctuaire ; il ne s’agit pas nécessairement d’un étranger au sens ethnique.
    reason: Alternative lexicale et clarification du sens cultuel de זָר.
lexical_decisions:
- source_word: וּבִנְסֹעַ הַמִּשְׁכָּן
  choice: Quand le tabernacle se mettra en route
  rationale: La préposition ב avec l’infinitif construit de נסע introduit une proposition temporelle. « Se mettre en route » exprime naturellement le départ du sanctuaire transportable tout en conservant le tabernacle comme sujet grammatical.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Terme français consacré pour le sanctuaire portatif désigné par מִשְׁכָּן dans ce contexte.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: le démonteront
  rationale: Le hiphil de ירד désigne ici l’action d’abaisser et de défaire le tabernacle avant son transport. « Démonter » rend précisément l’action concrète en français moderne.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française habituelle du groupe chargé ici du service autorisé du sanctuaire.
- source_word: וּבַחֲנֹת הַמִּשְׁכָּן
  choice: quand il fera halte
  rationale: L’infinitif de חנה signifie camper ou établir son camp. Avec le tabernacle comme sujet repris par « il », « faire halte » est naturel et maintient le parallélisme avec la mise en route sans suggérer que le tabernacle agit indépendamment du camp.
- source_word: יָקִימוּ אֹתוֹ
  choice: le dresseront
  rationale: Le hiphil de קום signifie ici ériger le tabernacle. « Dresser » est précis, naturel et adapté à une tente-sanctuaire.
- source_word: וְהַזָּר
  choice: Toute personne non autorisée
  rationale: Dans ce contexte cultuel, זָר désigne une personne extérieure au service sacré autorisé, et non nécessairement un étranger sur le plan ethnique. Cette formulation explicite le sens contextuel sans le limiter à une catégorie ethnique.
- source_word: הַקָּרֵב
  choice: qui s’approchera
  rationale: Le participe de קרב exprime le fait de s’approcher du domaine ou du service sacré interdit.
- source_word: יוּמָת
  choice: sera mise à mort
  rationale: 'Le hophal de מות a une valeur passive causative : la mort est infligée. La formulation conserve cette portée pénale sans préciser l’agent.'
theological_decisions:
- issue: Nature de la peine exprimée par יוּמָת
  choice: « sera mise à mort », peine infligée
  alternative: « mourra », simple conséquence annoncée
  rationale: La forme hophal indique normalement que la personne subit une mise à mort. La traduction préserve la gravité juridique et cultuelle de l’avertissement sans déterminer si l’exécution relève d’un agent humain ou divin.
- issue: Référent de זָר
  choice: une personne non autorisée à s’approcher du service du sanctuaire
  alternative: un étranger ethnique ou, plus restrictivement, tout non-Lévite
  rationale: Dans les textes relatifs au sanctuaire, זָר marque surtout l’absence d’autorisation cultuelle. La traduction évite donc de transformer cette restriction sacrée en distinction ethnique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre le départ et la halte est conservé, avec des verbes concrets (« démonter », « dresser »). Le futur rend naturellement la portée normative et répétée de l’instruction dans ce contexte légal.
