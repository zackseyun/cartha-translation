  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: fr
  text: 'Les fils de Nephtali, selon leurs générations, selon leurs clans et selon leurs maisons paternelles, d’après le nombre des noms, tous les hommes de vingt ans et plus aptes à partir à la guerre[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tous ceux qui partent à l’armée » ou « tous ceux qui partent à la guerre ». Dans ce contexte de recensement, l’expression hébraïque désigne les hommes aptes au service militaire.'
    reason: Signaler la formulation littérale de l’idiome militaire et l’explicitation contextuelle introduite par « aptes ».
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Les fils de Nephtali
  rationale: « Fils » conserve la dimension masculine et généalogique de בְּנֵי dans cette formule de recensement tribal.
- source_word: תּוֹלְדֹתָם
  choice: selon leurs générations
  rationale: Cette formulation garde le sens de filiation et la répétition formelle propre au recensement de Nombres 1.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte tribal, מִשְׁפָּחָה désigne un groupe de parenté plus large que la famille nucléaire moderne.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: La traduction préserve l’organisation de parenté patrilinéaire explicitement nommée par l’hébreu tout en restant intelligible.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: recensés par leur nom
  rationale: Cette tournure française naturelle exprime le dénombrement individuel impliqué par l’expression hébraïque, littéralement « selon le nombre des noms ».
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: La formule conserve clairement le seuil d’âge inclusif indiqué par l’hébreu.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tous les hommes aptes à partir à la guerre
  rationale: Le participe masculin singulier collectif est rendu au pluriel pour s’accorder naturellement avec le groupe recensé. « Aptes » explicite l’éligibilité militaire que l’idiome exprime dans ce contexte, tandis que « partir à la guerre » conserve son image martiale.
