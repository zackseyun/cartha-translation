  terminology: « Fils », « clans », « maisons paternelles » et « hommes aptes à partir à la guerre » respectent le vocabulaire et le contexte militaire sans imposer une lecture doctrinale. La note doit présenter l’explicitation d’« aptes » comme contextuelle, non comme le sens littéral du participe.
