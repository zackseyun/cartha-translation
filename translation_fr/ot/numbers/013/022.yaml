source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ בַ/נֶּגֶב֮ וַ/יָּבֹ֣א עַד חֶבְרוֹן֒ וְ/שָׁ֤ם אֲחִימַן֙ שֵׁשַׁ֣י וְ/תַלְמַ֔י יְלִידֵ֖י הָ/עֲנָ֑ק וְ/חֶבְר֗וֹן שֶׁ֤בַע שָׁנִים֙ נִבְנְתָ֔ה לִ/פְנֵ֖י צֹ֥עַן מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: fr
  text: Ils montèrent dans le Néguev, et il arriva jusqu’à Hébron. Là se trouvaient Ahimân, Shéshaï et Talmaï, descendants d’Anak. Hébron avait été bâtie sept ans avant Tsoan d’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: dans le Néguev
  rationale: Le terme désigne ici la région géographique du sud de Canaan; la translittération française courante préserve ce nom propre.
- source_word: וַיָּבֹא
  choice: et il arriva
  rationale: Le verbe est au singulier dans le texte massorétique, après le pluriel «Ils montèrent». La traduction conserve cette discordance significative au lieu de l’harmoniser.
- source_word: יְלִידֵי הָעֲנָק
  choice: descendants d’Anak
  rationale: Dans ce contexte généalogique, «descendants» exprime naturellement le rapport indiqué par יְלִידֵי sans imposer une filiation immédiate.
- source_word: נִבְנְתָה
  choice: avait été bâtie
  rationale: Le passif et l’antériorité de la fondation de Hébron par rapport à Tsoan sont rendus explicitement en français.
- source_word: צֹעַן מִצְרָיִם
  choice: Tsoan d’Égypte
  rationale: La précision géographique est conservée, et צֹעַן est translittéré selon un usage français reconnaissable.
theological_decisions:
- issue: Alternance entre le sujet pluriel et le sujet singulier
  choice: «Ils montèrent… et il arriva»
  alternative: «Ils montèrent… et arrivèrent»
  rationale: Le singulier hébreu וַיָּבֹא est textuellement attesté et peut viser Caleb ou le groupe envisagé collectivement. La traduction préserve l’ambiguïté plutôt que de corriger implicitement le texte.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes françaises usuelles; la syntaxe reste fluide tout en conservant l’alternance inhabituelle du pluriel au singulier présente dans l’hébreu.
