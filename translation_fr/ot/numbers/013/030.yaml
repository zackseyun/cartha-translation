source:
  edition: WLC
  text: וַ/יַּ֧הַס כָּלֵ֛ב אֶת הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר עָלֹ֤ה נַעֲלֶה֙ וְ/יָרַ֣שְׁנוּ אֹתָ֔/הּ כִּֽי יָכ֥וֹל נוּכַ֖ל לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: fr
  text: 'Alors Caleb fit taire le peuple devant Moïse[a] et dit : « Montons, oui, montons[b], et prenons possession de ce pays ; car nous en sommes tout à fait capables[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « ramena le peuple au calme en présence de Moïse ». Le verbe hébreu peut signifier faire taire, calmer ou imposer le silence.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une construction emphatique, littéralement : « monter, nous monterons ».'
    reason: source_form
  - marker: c
    text: 'L’hébreu emploie de nouveau une construction emphatique : Caleb affirme avec force qu’ils en ont la capacité.'
    reason: source_form
lexical_decisions:
- source_word: וַיַּהַס
  choice: fit taire
  rationale: Le verbe désigne l’action d’amener une assemblée au silence ou au calme. « Fit taire » est direct et naturel dans cette scène, sans préciser par quel moyen Caleb intervient.
- source_word: אֶת־הָעָם
  choice: le peuple
  rationale: עָם désigne ici la communauté israélite rassemblée ; « le peuple » est la formulation française habituelle et contextuellement appropriée.
- source_word: אֶל־מֹשֶׁה
  choice: devant Moïse
  rationale: Dans cette construction, אֶל situe l’intervention de Caleb par rapport à Moïse. « Devant Moïse » rend naturellement la scène tout en conservant la possibilité d’une action faite en sa présence.
- source_word: עָלֹה נַעֲלֶה
  choice: Montons, oui, montons
  rationale: L’infinitif absolu suivi de la forme verbale conjuguée renforce fortement l’exhortation. La répétition avec « oui » restitue cette insistance sans ajouter l’idée temporelle de « tout de suite », absente de l’hébreu.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: et prenons possession de ce pays
  rationale: יָרַשׁ exprime ici l’entrée en possession active du pays. Le pronom féminin renvoie au pays mentionné dans le contexte ; l’expliciter en français évite un « en » potentiellement ambigu.
- source_word: כִּי יָכוֹל נוּכַל
  choice: car nous en sommes tout à fait capables
  rationale: La seconde construction emphatique affirme avec force la capacité du peuple. « Tout à fait capables » transmet cette assurance dans un français actuel et naturel.
- source_word: לָהּ
  choice: en
  rationale: Le suffixe féminin singulier renvoie au pays et, par extension, à l’entreprise qui consiste à en prendre possession. « En être capables » est idiomatique en français et évite de préciser excessivement la nature de l’obstacle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Montons, oui, montons » conserve l’insistance de l’hébreu sans lourdeur excessive. « Ce pays » explicite le référent féminin du pronom hébreu à partir du contexte immédiat.
