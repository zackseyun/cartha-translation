- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et largement reconnue du nom de la tribu.
- source_word: יִגְאָל
  choice: Yigal
  rationale: Translittération française claire, proche de la prononciation hébraïque ; elle évite que la lettre initiale soit lue comme dans le français « g » dur ou doux.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette identification généalogique, le terme désigne naturellement le fils direct ; le contexte ne justifie pas l’élargissement à « descendant de ».
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
