source:
  edition: WLC
  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: fr
  text: Et là, nous avons vu les Nephilim[a] — les fils d’Anak, provenant des Nephilim — et, à nos propres yeux, nous étions comme des sauterelles ; et c’est ainsi que nous étions à leurs yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon la traduction traditionnelle, « géants » au lieu de « Nephilim ». Le sens exact du terme hébreu est incertain ; il est donc translittéré dans le texte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: les Nephilim
  rationale: Le terme hébreu désigne un groupe dont l’identité reste incertaine. La translittération évite d’imposer l’interprétation traditionnelle « géants » ou l’étymologie conjecturale « êtres déchus ».
- source_word: בְּנֵי עֲנָק
  choice: les fils d’Anak
  rationale: Cette formulation conserve l’expression filiale de l’hébreu, qui peut désigner les descendants ou le clan d’Anak.
- source_word: מִן הַנְּפִלִים
  choice: issus des Nephilim
  rationale: La préposition מן indique vraisemblablement ici l’origine ou l’appartenance. « Issus de » exprime cette relation en français naturel sans en préciser excessivement la nature.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: à nos propres yeux, nous étions
  rationale: L’expression idiomatique concerne la perception que les explorateurs avaient d’eux-mêmes. La construction française maintient le parallèle avec la fin du verset.
- source_word: כַּחֲגָבִים
  choice: comme des sauterelles
  rationale: חגב désigne une sauterelle ou un insecte apparenté ; dans cette comparaison, le mot évoque surtout leur petitesse.
- source_word: וְכֵן
  choice: c’est ainsi que… aussi
  rationale: Cette tournure rend le lien comparatif et consécutif avec la perception attribuée aux autres, tout en produisant une phrase française fluide.
- source_word: בְעֵינֵיהֶם
  choice: à leurs yeux
  rationale: L’idiome français correspond directement à l’expression hébraïque et préserve la symétrie rhétorique avec « à nos propres yeux ».
theological_decisions:
- issue: Sens de נְפִילִים
  choice: Nephilim
  alternative: géants ; êtres déchus
  rationale: Le référent et l’étymologie du terme sont débattus, notamment en lien avec Genèse 6.4. La translittération maintient cette incertitude au lieu de privilégier une interprétation traditionnelle ou étymologique.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Nephilim » ainsi que le parallélisme « à nos propres yeux / à leurs yeux » sont conservés. « Fils d’Anak » maintient la couleur de l’expression hébraïque, tandis que « issus des » clarifie discrètement la relation exprimée par מן sans la définir de manière dogmatique.
