- source_word: לְמַטֵּה
  choice: pour la tribu de
  rationale: Dans cette liste de représentants, מַטֶּה désigne la tribu et le préfixe לְ marque l’appartenance ou l’affectation. « Pour la tribu de » rend directement la fonction du représentant sans surinterpréter la préposition comme une provenance.
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française traditionnelle et largement reconnue du nom de la tribu et du patriarche.
- source_word: שָׁפָט
  choice: Shafath
  rationale: Translittération française du nom propre, avec « sh » pour שׁ et « th » final pour distinguer la consonne ט.
- source_word: בֶּן
  choice: fils de
  rationale: Rend naturellement en français la relation filiale exprimée par la construction hébraïque.
- source_word: חוֹרִי
  choice: Hori
  rationale: Translittération simple et usuelle du nom propre hébreu.
