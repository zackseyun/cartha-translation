  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: fr
  text: 'Ils répandirent[a] parmi les fils d’Israël un rapport défavorable sur le pays qu’ils avaient exploré[b]. Ils dirent : « Le pays que nous avons parcouru pour l’explorer est un pays qui dévore ses habitants[c], et tous les hommes que nous y avons vus étaient de très grande taille[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « firent circuler un mauvais rapport sur le pays » ; plus fortement : « calomnièrent le pays ».'
    reason: Alternative lexicale pour l’expression וַיּוֹצִיאוּ דִּבַּת.
  - marker: b
    text: Ou « reconnu » ou « exploré en éclaireurs ».
    reason: Alternative lexicale pour le verbe תור.
  - marker: c
    text: Ou « qui consume ses habitants ».
    reason: Autre manière de rendre la métaphore אֹכֶלֶת יוֹשְׁבֶיהָ.
  - marker: d
    text: Littéralement « des hommes de taille », c’est-à-dire aux dimensions physiques impressionnantes.
    reason: Clarification de l’expression hébraïque אַנְשֵׁי מִדּוֹת.
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: répandirent … un rapport défavorable
  rationale: L’expression signifie littéralement « faire sortir un mauvais rapport ». « Répandre un rapport défavorable » restitue naturellement en français l’idée de le faire circuler, sans imposer dans le texte principal l’accusation plus forte de calomnie.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce récit, « pays » désigne naturellement le territoire exploré et reste digne et courant en français moderne.
- source_word: תָּרוּ / לָתוּר
  choice: avaient exploré / pour l’explorer
  rationale: Le verbe désigne le fait de parcourir un territoire pour l’examiner. « Explorer » conserve cette portée sans réduire l’action à l’espionnage.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: « Fils d’Israël » conserve la désignation collective et conventionnelle de l’hébreu. Avec « répandirent », « parmi » exprime idiomatiquement les destinataires au sein desquels le rapport circule.
- source_word: עָבַרְנוּ בָהּ
  choice: que nous avons parcouru
  rationale: Le verbe עבר avec ב exprime ici le passage à travers le pays. « Parcouru » est concis et naturel dans le contexte d’une exploration.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: un pays qui dévore ses habitants
  rationale: « Dévore » préserve la métaphore vive et menaçante du participe אֹכֶלֶת.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: des hommes de très grande taille
  rationale: L’expression évoque des dimensions physiques impressionnantes. Cette formulation évite que « hommes de stature » soit compris comme un rang social ou moral.
theological_decisions:
- issue: Portée collective de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le texte conserve la forme masculine et généalogique de la désignation hébraïque, qui fonctionne ici comme nom collectif du peuple, sans en modifier silencieusement la forme.
- issue: Nature du rapport דִּבָּה
  choice: un rapport défavorable
  alternative: une calomnie contre le pays
  rationale: Le contexte présente un récit négatif et décourageant, mais le terme principal ne tranche pas à lui seul toutes les questions relatives à sa véracité. La traduction principale préserve cette tension; la possibilité plus forte de calomnie est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition d’« explorer » reflète celle du texte hébreu. « Pays » est privilégié à « terre » pour une lecture française naturelle, tandis que « dévore » maintient l’image frappante de l’original.
