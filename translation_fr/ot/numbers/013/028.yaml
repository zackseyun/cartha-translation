  text: אֶ֚פֶס כִּֽי עַ֣ז הָ/עָ֔ם הַ/יֹּשֵׁ֖ב בָּ/אָ֑רֶץ וְ/הֶֽ/עָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְ/גַם יְלִדֵ֥י הָֽ/עֲנָ֖ק רָאִ֥ינוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: fr
  text: Cependant, le peuple qui habite le pays est puissant, et les villes sont fortifiées et très grandes. Nous y avons aussi vu les descendants d’Anak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les enfants d’Anak ». L’expression hébraïque désigne les descendants d’Anak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: Cependant
  rationale: Cette locution introduit une forte réserve après le rapport positif du verset précédent. « Cependant » rend naturellement sa valeur adversative sans l’aplatir.
- source_word: עַז
  choice: puissant
  rationale: Le terme présente le peuple comme fort et redoutable. « Puissant » convient au collectif « peuple » sans lui attribuer explicitement une férocité que le contexte n’impose pas.
- source_word: הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: le peuple qui habite le pays
  rationale: La proposition relative restitue clairement la construction participiale et conserve le sens collectif de עַם.
- source_word: וְהֶעָרִים בְּצֻרוֹת גְּדֹלֹת מְאֹד
  choice: et les villes sont fortifiées et très grandes
  rationale: « Fortifiées » exprime la protection militaire des villes, tandis que « très grandes » conserve l’intensification de מְאֹד. La coordination française suit celle de l’hébreu.
- source_word: וְגַם
  choice: aussi
  rationale: L’adverbe marque l’ajout d’un autre élément inquiétant au rapport.
- source_word: יְלִדֵי הָעֲנָק
  choice: les descendants d’Anak
  rationale: L’expression désigne les membres de la lignée d’Anak. « Descendants » est clair et idiomatique en français moderne.
- source_word: רָאִינוּ שָׁם
  choice: Nous y avons vu
  rationale: Le passé composé convient à un témoignage oral portant sur ce que les explorateurs ont constaté, et « y » restitue naturellement l’indication de lieu.
