id: NUM.13.29
reference: Numbers 13:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: fr
  text: Amalek habite[a] dans le pays du Néguev[b] ; les Hittites, les Jébusites et les Amorites habitent dans la région montagneuse ; les Cananéens habitent près de la mer et le long du Jourdain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réside ». Le participe hébreu souligne, ici et dans la suite du verset, une habitation établie.
    reason: lexical_alternative
  - marker: b
    text: Le Néguev est la région aride du sud de Canaan ; le terme hébreu peut aussi signifier « le pays du sud ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « au côté du Jourdain », expression qui signifie « près du Jourdain » ou « le long du Jourdain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Le nom propre est translittéré plutôt que remplacé par le nom dérivé du peuple, afin de conserver la forme collective du texte hébreu.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: habite / habitent
  rationale: Le participe de ישב exprime ici une résidence établie. « Habiter » est naturel en français et conserve cette idée mieux que « se trouver ».
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: dans le pays du Néguev
  rationale: « Néguev » conserve la référence à la région méridionale précise, tandis que « pays » rend אֶרֶץ sans lourdeur excessive.
- source_word: הַחִתִּי וְהַיְבוּסִי וְהָאֱמֹרִי
  choice: les Hittites, les Jébusites et les Amorites
  rationale: Les adjectifs ethniques hébreux au singulier collectif sont rendus par des noms de peuples au pluriel, conformément à l’usage français.
- source_word: בָּהָר
  choice: dans la région montagneuse
  rationale: Dans ce contexte géographique, הַר désigne le haut pays ou la zone de montagnes plutôt qu’une montagne particulière.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le singulier collectif hébreu est naturellement rendu par le pluriel désignant le peuple.
- source_word: עַל הַיָּם
  choice: près de la mer
  rationale: Cette formulation rend la proximité exprimée par עַל sans préciser qu’il s’agit d’une côte ni identifier explicitement la mer.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: le long du Jourdain
  rationale: L’expression idiomatique signifie « au côté de » ou « à proximité de » ; « le long du Jourdain » restitue naturellement sa valeur spatiale.
theological_decisions: []
