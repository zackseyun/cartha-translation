  rationale: La préposition אֶל marque ici le destinataire de la parole ; « à Moïse » est l’équivalent français naturel.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Dans cette formule introductive, l’infinitif לֵאמֹר annonce le contenu du discours. « En ces termes : » restitue naturellement cette fonction en français moderne.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: YHWH ; le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » préserve le caractère de nom propre dans une forme courante en français, sans lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formule hébraïque d’introduction au discours est rendue idiomatiquement, avec deux-points pour annoncer la parole qui suit.
