  text: וַֽ/יַּעֲל֖וּ וַ/יָּתֻ֣רוּ אֶת הָ/אָ֑רֶץ מִ/מִּדְבַּר צִ֥ן עַד רְחֹ֖ב לְבֹ֥א חֲמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: fr
  text: Ils montèrent et explorèrent le pays, depuis le désert de Tsin jusqu’à Rehob, en direction de Lebo-Hamath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à Rehob, à l’entrée de Hamath ». L’expression hébraïque peut désigner le lieu appelé Lebo-Hamath ou être comprise comme une indication géographique descriptive.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Ils montèrent
  rationale: Le verbe עלה exprime une montée. « Montèrent » conserve cette nuance directionnelle et reste naturel dans un récit de déplacement.
- source_word: וַיָּתֻרוּ
  choice: explorer
  rationale: Dans ce contexte de reconnaissance, תור désigne l’examen du pays par les hommes envoyés. « Explorer » est naturel en français et n’impose pas la connotation clandestine que pourrait avoir « espionner ».
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans le contexte, il s’agit du territoire de Canaan. « Le pays » est idiomatique et géographiquement précis.
- source_word: מִמִּדְבַּר צִן
  choice: depuis le désert de Tsîn
  rationale: מִדְבָּר désigne une région aride et peu habitée; « désert » convient au français courant. La préposition מִן marque le point de départ de l’étendue parcourue.
- source_word: עַד רְחֹב
  choice: jusqu’à Rehob
  rationale: עַד indique la limite de la reconnaissance; « jusqu’à » en rend directement la portée géographique.
- source_word: לְבֹא חֲמָת
  choice: vers Lebo-Hamath
  rationale: L’expression peut être comprise comme un toponyme ou descriptivement comme « l’entrée de Hamath ». Le texte principal conserve le nom géographique sans trancher davantage, tandis que la note présente l’autre lecture.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Explorer » rend la mission de reconnaissance sans surcharger le verset d’une connotation d’espionnage clandestin. Les noms propres suivent une translittération française lisible; l’ambiguïté de לְבֹא חֲמָת est conservée par une note.
