id: NUM.13.16
reference: Numbers 13:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/הוֹשֵׁ֥עַ בִּן נ֖וּן יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: fr
  text: Voici les noms des hommes que Moïse envoya reconnaître le pays[a]. Moïse donna à Hoshéa, fils de Noun, le nom de Josué[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « explorer le pays » ou « espionner le pays ». Le verbe hébreu peut désigner l’exploration ou une mission de reconnaissance.
    reason: lexical_alternative
  - marker: b
    text: Hoshéa est la forme antérieure du nom de Josué; Moïse lui donne ici le nom de Josué.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Voici les noms
  rationale: Cette formule française introduit naturellement le récapitulatif de la liste et rend la valeur déictique de אֵלֶּה.
- source_word: הָאֲנָשִׁים
  choice: des hommes
  rationale: Le contexte désigne précisément les représentants masculins qui viennent d’être nommés.
- source_word: שָׁלַח
  choice: envoya
  rationale: Équivalent narratif courant de שׁלח, au passé simple dans un registre biblique moderne et digne.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: reconnaître le pays
  rationale: Le verbe תור évoque ici l’exploration et la reconnaissance du territoire; cette formulation française est naturelle et ne réduit pas nécessairement la mission à l’espionnage.
- source_word: וַיִּקְרָא ... יְהוֹשֻׁעַ
  choice: donna ... le nom de Josué
  rationale: Dans cette construction, קרא indique l’attribution d’un nom. La formulation française explicite naturellement la relation sans ajouter l’idée plus forte d’un changement officiel de nom.
- source_word: הוֹשֵׁעַ
  choice: Hoshéa
  rationale: Translittération française proche de la forme hébraïque, distincte d’Osée, nom traditionnel du prophète.
- source_word: בִּן נוּן
  choice: fils de Noun
  rationale: Rend directement le patronyme hébreu; «Noun» suit une translittération française naturelle.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et largement reconnue du nom.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Reconnaître le pays » conserve la portée de la mission sans imposer le sens plus chargé d’« espionner ». Les noms suivent les formes françaises usuelles lorsqu’elles sont bien établies.
