review_pass:
  verdict: revise
  source_fidelity: Le projet rend bien l’ordre d’envoi, l’exploration du pays, le don divin en cours, « fils d’Israël » et la qualification des envoyés comme dirigeants. Toutefois, « tribu ancestrale » ne restitue pas explicitement לְמַטֵּה אֲבֹתָיו (« tribu de ses pères »), et « responsable » affaiblit légèrement le sens institutionnel de נָשִׂיא. La particule לְךָ est difficile à intégrer idiomatiquement en français sans surinterprétation ; une note permet de la signaler tout en conservant un texte naturel.
  naturalness: « Envoie pour toi des hommes » est calqué sur l’hébreu et peu naturel en français moderne ; il peut même suggérer que les hommes sont envoyés à Moïse. « Envoie des hommes » est idiomatique. « Un homme de chaque tribu de ses pères » et « chacun étant un chef parmi eux » sont à la fois précis et lisibles.
  terminology: '« Chef » est ici préférable à « responsable » pour נָשִׂיא : le mot désigne un dirigeant ou notable reconnu, sans imposer le sens monarchique de « prince ». « Fils d’Israël » reste un rendu recevable et fidèle de l’idiome collectif hébreu.'
