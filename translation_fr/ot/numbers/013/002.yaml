  - severity: medium
    issue: L’ascendance dans l’expression tribale est effacée
    rationale: « Tribu ancestrale » généralise לְמַטֵּה אֲבֹתָיו. « De chaque tribu de ses pères » conserve la formulation de filiation et la distributivité du texte.
  - severity: low
    issue: « Responsable » est moins précis que le terme source
    rationale: Dans ce contexte tribal, נָשִׂיא renvoie à un chef/dirigeant reconnu. « Chef » rend plus directement ce statut sans trancher entre les nuances possibles de chef, dirigeant ou prince.
