source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: fr
  text: « Envoie[a] des hommes afin qu’ils explorent[b] le pays de Canaan, que je donne aux fils d’Israël[c]. Vous enverrez un homme de chaque tribu de ses pères, chacun étant un chef parmi eux[d]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ajoute « pour toi » ; cette expression peut marquer l’implication personnelle, l’autorisation ou l’insistance, sans que sa nuance précise soit certaine.
    reason: source_nuance
  - marker: b
    text: Ou « reconnaissent » ou « espionnent » le pays.
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque « fils d’Israël » désigne ici le peuple d’Israël dans son ensemble.
    reason: cultural_note
  - marker: d
    text: Ou « un dirigeant parmi eux » ou « un prince parmi eux » ; le terme hébreu désigne un chef tribal ou un notable reconnu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: Envoie pour toi
  rationale: Conserve explicitement le datif לְךָ et son ambiguïté possible — intérêt personnel, autorisation ou insistance — malgré une tournure volontairement proche de l’hébreu.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le masculin pluriel désigne ici les représentants masculins choisis parmi les tribus.
- source_word: וְיָתֻרוּ
  choice: afin qu’ils explorent
  rationale: Le verbe תור évoque la reconnaissance et l’examen du pays. « Explorer » est naturel en français et moins réducteur qu’« espionner ».
- source_word: אֶרֶץ כְּנַעַן
  choice: le pays de Canaan
  rationale: Rend explicitement אֶרֶץ dans une expression française courante.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: que je donne
  rationale: Le présent français exprime naturellement le don divin en cours ou déjà engagé, sans préciser davantage sa temporalité.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Préserve l’expression familiale et fédérative de l’hébreu plutôt que de la réduire à l’ethnonyme « Israélites ».
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לְמַטֵּה אֲבֹתָיו
  choice: un homme par tribu ancestrale
  rationale: Restitue la valeur distributive de la répétition hébraïque et l’appartenance tribale déterminée par l’ascendance, dans un français intelligible.
- source_word: תִּשְׁלָחוּ
  choice: Vous enverrez
  rationale: Le pluriel du verbe hébreu est conservé; le futur français prend ici une valeur directive.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: chacun étant un responsable parmi eux
  rationale: נָשִׂיא désigne un chef ou dirigeant reconnu. « Responsable » est actuel et évite les connotations monarchiques de « prince ».
theological_decisions:
- issue: Nuance de לְךָ dans le commandement divin
  choice: Conserver « pour toi » dans le texte
  alternative: Omettre le pronom comme élément idiomatique, ou traduire « de ta propre initiative »
  rationale: La formulation maintient la présence et l’ambiguïté du datif hébreu sans décider s’il exprime l’autorisation, l’intérêt de Moïse ou une simple insistance.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: « fils d’Israël »
  alternative: « enfants d’Israël » ou « Israélites »
  rationale: Le choix conserve l’image généalogique et collective du texte; dans cet idiome, l’expression désigne le peuple d’Israël dans son ensemble.
- issue: Portée de נֹתֵן
  choice: « je donne »
  alternative: « je suis en train de donner » ou « je vais donner »
  rationale: Le présent conserve la tension entre la promesse divine déjà effective et sa réalisation historique sans imposer une seule valeur temporelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure naturelle tout en gardant « pour toi », formulation marquée qui reflète une donnée ambiguë de l’hébreu. Le passage du singulier « Envoie » au pluriel « Vous enverrez » suit les formes verbales du texte massorétique.
