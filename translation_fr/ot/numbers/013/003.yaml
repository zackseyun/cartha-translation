source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: fr
  text: Moïse les envoya du désert de Parân sur l’ordre de Yahweh[a]. Tous étaient des hommes, des chefs des fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conformément à la parole de Yahweh ». L’expression hébraïque signifie littéralement « sur la bouche de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des dirigeants des Israélites ». L’hébreu porte littéralement « chefs des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol de שׁלח fait progresser le récit et décrit une action passée ; « envoya » est l’équivalent français naturel.
- source_word: מִמִּדְבַּר פָּארָן
  choice: du désert de Parân
  rationale: מִדְבָּר désigne ici une région inculte ou désertique. « Désert » est la formulation géographique biblique la plus courante en français, et Parân est transcrit comme nom de lieu.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: L’expression idiomatique עַל־פִּי, littéralement « sur la bouche de », indique qu’une action est accomplie conformément à une parole faisant autorité. « Sur l’ordre de » en restitue naturellement la force.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, conformément à la ligne éditoriale fournie.
- source_word: כֻּלָּם
  choice: Tous
  rationale: Ce terme souligne que chacun des envoyés appartenait à la catégorie décrite ; « Tous » conserve cette portée collective exhaustive.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Dans ce contexte, le terme désigne les représentants masculins des tribus ; le français masculin précis est donc conservé.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: des chefs des fils d’Israël
  rationale: « Chefs » rend le sens de רָאשֵׁי sans calquer artificiellement « têtes », tandis que « fils d’Israël » préserve l’expression familiale בְנֵי יִשְׂרָאֵל.
- source_word: הֵמָּה
  choice: étaient
  rationale: Le pronom indépendant renforce l’identification des envoyés. En français, cette insistance est suffisamment portée par « Tous étaient », sans répétition lourde du pronom.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom divin personnel sans lui substituer un titre.
- issue: Langage masculin et désignation familiale d’Israël
  choice: des hommes, des chefs des fils d’Israël
  alternative: des dirigeants des Israélites
  rationale: Le verset parle de représentants masculins et emploie l’expression familiale « fils d’Israël ». Le texte principal conserve ces deux traits, tout en signalant en note une formulation française plus compacte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste concise ; « donc » assure la continuité avec l’ordre divin du verset précédent. L’apposition « des chefs des fils d’Israël » garde la structure et la tonalité familiale de l’hébreu sans employer le calque peu naturel « têtes ».
