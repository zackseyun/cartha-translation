  text: וְ/הָ֨/אֲנָשִׁ֜ים אֲשֶׁר עָל֤וּ עִמּ/וֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַ/עֲל֣וֹת אֶל הָ/עָ֑ם כִּֽי חָזָ֥ק ה֖וּא מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: fr
  text: 'Mais les hommes qui étaient montés avec lui dirent : « Nous ne pouvons pas monter contre ce peuple[a], car il est plus fort que nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « monter vers le peuple » ; dans ce contexte, il s’agit de monter pour l’affronter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Mais les hommes
  rationale: La conjonction introduit ici un contraste avec les paroles de Caleb au verset précédent. « Mais » rend naturellement cette valeur discursive, tandis que « les hommes » conserve le nom concret du texte hébreu.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: qui étaient montés avec lui
  rationale: Le plus-que-parfait situe clairement cette montée avant leur prise de parole et désigne les hommes qui avaient accompagné Caleb.
- source_word: לֹא נוּכַל
  choice: Nous ne pouvons pas
  rationale: Cette formulation française courante exprime directement l’incapacité indiquée par יכל.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: marcher contre ce peuple
  rationale: עלה signifie littéralement « monter », mais, avec אֶל dans ce contexte de confrontation militaire, l’expression désigne le fait d’avancer contre les habitants du pays. « Marcher contre » conserve l’idée de mouvement tout en étant naturel en français.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par les hommes. « Car » convient au registre narratif soutenu sans être archaïque.
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: il est plus fort que nous
  rationale: Le pronom hébreu est au singulier et reprend le nom collectif « peuple ». Le français permet de conserver naturellement ce singulier et la comparaison explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier « ce peuple… il » conserve la construction collective de l’hébreu. « Marcher contre » rend le sens militaire de l’expression sans remplacer entièrement l’image du déplacement par le verbe plus interprétatif « attaquer ».
