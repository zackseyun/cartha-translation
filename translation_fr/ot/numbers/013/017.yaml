  text: וַ/יִּשְׁלַ֤ח אֹתָ/ם֙ מֹשֶׁ֔ה לָ/ת֖וּר אֶת אֶ֣רֶץ כְּנָ֑עַן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם עֲל֥וּ זֶה֙ בַּ/נֶּ֔גֶב וַ/עֲלִיתֶ֖ם אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: fr
  text: 'Moïse les envoya explorer le pays de Canaan[a] et leur dit : « Montez par le Néguev[b], puis montez dans la région montagneuse[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaître le pays de Canaan ».
    reason: lexical_alternative
  - marker: b
    text: Le Néguev est la région aride située au sud du pays.
    reason: cultural_note
  - marker: c
    text: Ou « la montagne » ; le terme hébreu peut désigner collectivement les hautes terres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le verbe שׁלח exprime simplement l’envoi des hommes par Moïse dans la progression narrative.
- source_word: לָתוּר
  choice: explorer
  rationale: Dans ce contexte, תור désigne l’examen méthodique du territoire. « Explorer » est naturel en français et évite de réduire la mission à une activité clandestine, tout en laissant « reconnaître » comme autre traduction possible.
- source_word: אֶרֶץ כְּנָעַן
  choice: le pays de Canaan
  rationale: Cette formulation restitue l’expression territoriale complète et son nom géographique dans un français courant.
- source_word: עֲלוּ זֶה
  choice: Montez par ici
  rationale: « Montez » conserve le mouvement ascendant de עלה, tandis que « par ici » rend la valeur adverbiale probable du démonstratif זֶה.
- source_word: בַּנֶּגֶב
  choice: dans le Néguev
  rationale: Le Néguev est ici une région géographique. « Dans » convient à la direction du déplacement sans imposer l’idée qu’ils doivent nécessairement la traverser entièrement.
- source_word: וַעֲלִיתֶם
  choice: puis montez
  rationale: La forme poursuit l’instruction donnée par l’impératif précédent. « Puis » rend clairement la succession des étapes sans alourdir la phrase.
- source_word: הָהָר
  choice: la région montagneuse
  rationale: Dans ce contexte, le singulier défini הָהָר désigne vraisemblablement la zone de hautes terres plutôt qu’une montagne isolée.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « montez » préserve le mouvement exprimé deux fois en hébreu, tandis que « région montagneuse » explicite sobrement la valeur géographique collective du singulier.
