  text: וַ/יֵּלְכ֡וּ וַ/יָּבֹאוּ֩ אֶל מֹשֶׁ֨ה וְ/אֶֽל אַהֲרֹ֜ן וְ/אֶל כָּל עֲדַ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל אֶל מִדְבַּ֥ר פָּארָ֖ן קָדֵ֑שָׁ/ה וַ/יָּשִׁ֨יבוּ אוֹתָ֤/ם דָּבָר֙ וְ/אֶת כָּל הָ֣/עֵדָ֔ה וַ/יַּרְא֖וּ/ם אֶת פְּרִ֥י הָ/אָֽרֶץ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: fr
  text: Ils se mirent en route et vinrent trouver Moïse, Aaron et toute la communauté des fils d’Israël[a], dans le désert de Parân, à Qadesh. Ils leur firent leur rapport, ainsi qu’à toute la communauté, et leur montrèrent les fruits du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la communauté des Israélites ». L’hébreu dit littéralement « toute la communauté des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Ils se mirent en route et vinrent trouver
  rationale: Cette formulation conserve les deux verbes coordonnés de la narration hébraïque tout en évitant le tour peu naturel « ils allèrent et vinrent ».
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: la communauté des fils d’Israël
  rationale: « Communauté » rend naturellement עֵדָה dans ce contexte, tandis que « fils d’Israël » préserve la forme concrète de l’expression hébraïque.
- source_word: מִדְבַּר פָּארָן
  choice: le désert de Parân
  rationale: « Désert » est le terme français courant pour מִדְבָּר dans les récits de déplacement d’Israël; l’accent du nom propre aide à guider la prononciation française.
- source_word: קָדֵשָׁה
  choice: à Qadesh
  rationale: Le suffixe directionnel indique le mouvement vers Qadesh; dans la phrase d’arrivée, « à Qadesh » exprime naturellement le lieu atteint sans effacer cette orientation.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: Ils leur firent leur rapport
  rationale: L’expression hébraïque désigne la réponse ou le compte rendu rapporté à ceux qui les avaient envoyés. « Faire son rapport » est naturel en français et convient à une mission d’exploration.
- source_word: וְאֶת כָּל הָעֵדָה
  choice: ainsi qu’à toute la communauté
  rationale: La préposition requise en français est reprise explicitement, et « communauté » demeure cohérent avec la première occurrence de עֵדָה.
- source_word: וַיַּרְאוּם
  choice: leur montrèrent
  rationale: Le hifil de ראה a ici le sens causatif de « montrer » ou « faire voir ».
- source_word: פְּרִי הָאָרֶץ
  choice: les fruits du pays
  rationale: Le pluriel français est idiomatique pour les produits concrets présentés par les explorateurs, tandis que « pays » rend ici la terre explorée comme territoire.
