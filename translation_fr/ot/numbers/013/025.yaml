  text: וַ/יָּשֻׁ֖בוּ מִ/תּ֣וּר הָ/אָ֑רֶץ מִ/קֵּ֖ץ אַרְבָּעִ֥ים יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: fr
  text: Ils revinrent après avoir exploré le pays, au bout de quarante jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir reconnu le pays » ou « après avoir espionné le pays ». Le verbe hébreu désigne l’examen du territoire dans le cadre d’une mission de reconnaissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Ils revinrent
  rationale: Le wayyiqtol qal, troisième personne du pluriel, poursuit le récit. En français, le passé simple rend naturellement cette succession narrative sans qu’il soit nécessaire d’expliciter וַ par « et ».
- source_word: מִתּוּר
  choice: après avoir exploré
  rationale: L’infinitif construit de תור précédé de מִן indique ici le retour à l’issue d’une mission d’examen du territoire. « Explorer » reste naturel et neutre; la note conserve les nuances de reconnaissance et d’espionnage.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אָרֶץ désigne le territoire précis que les hommes viennent d’examiner. « Le pays » est idiomatique en français et évite le sens global de « terre ».
- source_word: מִקֵּץ
  choice: au bout de
  rationale: La tournure מִן avec קֵץ marque l’achèvement d’une durée. « Au bout de » en donne une expression française précise et courante.
- source_word: אַרְבָּעִים יוֹם
  choice: quarante jours
  rationale: Le nom hébreu au singulier après le nombre se rend idiomatiquement au pluriel en français.
