base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: fr
  text: On appela ce lieu vallée d’Eshkol[a], à cause de la grappe que les fils d’Israël y avaient coupée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « oued d’Eshkol » ou « ravin d’Eshkol ». Le mot hébreu peut désigner le lit d’un cours d’eau saisonnier ou la vallée qui lui est associée. Eshkol évoque en hébreu le mot qui signifie « grappe » : le nom du lieu est expliqué par la grappe coupée là-bas.'
    reason: lexical_alternative_and_wordplay
  - marker: b
    text: Ou « les Israélites » ou « les enfants d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: ce lieu
  rationale: Le groupe défini renvoie au lieu qui vient d’être décrit. « Ce lieu » restitue naturellement cette référence en français.
- source_word: קָרָא
  choice: on appela
  rationale: La forme hébraïque est un actif masculin singulier dont le sujet n’est pas exprimé. Le pronom indéfini « on » conserve cette construction impersonnelle sans introduire un agent précis.
- source_word: נַחַל
  choice: vallée
  rationale: נַחַל peut désigner un cours d’eau saisonnier, son lit ou la vallée correspondante. « Vallée » convient ici comme désignation géographique naturelle; les autres nuances sont signalées en note.
- source_word: אֶשְׁכּוֹל
  choice: Eshkol
  rationale: Dans נַחַל אֶשְׁכּוֹל, le mot fonctionne comme un nom de lieu. La translittération préserve le nom propre ainsi que son lien sonore avec le nom commun signifiant « grappe », expliqué en note.
- source_word: עַל אֹדוֹת
  choice: à cause de
  rationale: Cette locution introduit la raison donnée au nom du lieu. « À cause de » en exprime clairement la valeur causale.
- source_word: הָאֶשְׁכּוֹל
  choice: la grappe
  rationale: Le nom signifie « grappe » ou « régime ». Le contexte immédiat précise qu’il s’agit d’une grappe de raisin; il n’est donc pas nécessaire d’ajouter « de raisin » dans le verset.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: que … avaient coupée
  rationale: כרת signifie ici « couper ». Le plus-que-parfait français situe naturellement cette action avant l’attribution du nom, sans modifier le rapport temporel du récit.
- source_word: מִשָּׁם
  choice: y
  rationale: Le pronom adverbial « y » renvoie avec naturel au lieu déjà mentionné et exprime ici l’origine locale de la grappe coupée.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale hébraïque et sa texture historique, tout en restant intelligible en français biblique moderne.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Aucun enjeu doctrinal majeur n’est en cause. « Les fils d’Israël » rend formellement l’ethnonyme familial hébreu; une note indique les équivalents français plus idiomatiques.
- issue: Sujet implicite de קָרָא
  choice: on appela
  alternative: il appela; ce lieu fut appelé
  rationale: Le texte ne nomme pas celui qui attribua le nom. Le pronom indéfini préserve cette indétermination plutôt que d’identifier silencieusement un agent.
translation_notes:
  register: Français international actuel, sobre et digne. « On appela » est plus transparent que le passif quant au sujet indéfini de l’hébreu. « Vallée » reste accessible, tandis que la note préserve les nuances topographiques de נַחַל. Les deux marqueurs [a] et [b] figurent dans le texte.
