base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: fr
  text: Ils arrivèrent jusqu’à la vallée d’Eshkol[a] et, de là, ils coupèrent un sarment portant une seule grappe de raisin, qu’ils transportèrent à deux sur une perche. Ils prirent aussi des grenades et des figues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le ravin d’Eshkol », « dans l’oued d’Eshkol » ou « dans le lit d’un cours d’eau saisonnier d’Eshkol ». Le mot hébreu נַחַל peut désigner une vallée encaissée, un ravin ou un cours d’eau saisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: la vallée d’Eshkol
  rationale: נַחַל désigne ici un relief pouvant être compris comme une vallée, un ravin ou le lit d’un cours d’eau saisonnier. « Vallée » est naturel et largement compréhensible en français, tandis qu’une note conserve les autres possibilités.
- source_word: זְמוֹרָה
  choice: un sarment
  rationale: זְמוֹרָה désigne une branche de vigne. « Sarment » rend cette précision de façon concise et idiomatique.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: une seule grappe de raisin
  rationale: Cette formulation française naturelle conserve l’insistance quantitative sur une grappe unique.
- source_word: וַיִּשָּׂאֻהוּ בַמּוֹט בִּשְׁנָיִם
  choice: qu’ils transportèrent à deux sur une perche
  rationale: La tournure exprime naturellement le transport par deux membres du groupe au moyen d’une perche, sans préciser qu’il s’agissait nécessairement de deux hommes.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: Ils prirent aussi des grenades et des figues
  rationale: Le verbe « prirent » est implicite dans l’hébreu et doit être repris en français pour obtenir une phrase claire et naturelle; la quantité demeure indéterminée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Sarment » apporte la précision viticole du terme hébreu sans alourdir la phrase. Le nom de lieu Eshkol est translittéré, et l’ambiguïté géographique de נַחַל est conservée en note.
