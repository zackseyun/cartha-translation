  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: fr
  text: Comment est le pays où ce peuple habite ? Est-il bon ou mauvais ? Comment sont les villes où il habite ? S’agit-il de campements ou de places fortes[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des camps […] des forteresses ». L’hébreu oppose des campements à des lieux fortifiés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: Comment est le pays
  rationale: La tournure française naturelle « Comment est… ? » exprime ici une question sur les caractéristiques et l’état du pays.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: où ce peuple habite
  rationale: Le pronom hébreu masculin singulier a une valeur collective et renvoie au peuple qui occupe le pays. L’explicitation évite en français un « il » sans antécédent clair.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: Est-il bon ou mauvais ?
  rationale: Conserve l’évaluation générale exprimée par les adjectifs hébreux, sans la réduire à la seule fertilité du sol.
- source_word: הֶעָרִים
  choice: les villes
  rationale: Équivalent courant de עָרִים, approprié au contexte des lieux habités examinés par les éclaireurs.
- source_word: הַבְּמַחֲנִים
  choice: des campements
  rationale: מַחֲנִים désigne des camps ou campements, ici opposés à des lieux défendus.
- source_word: בְּמִבְצָרִים
  choice: des places fortes
  rationale: מִבְצָרִים désigne des lieux fortifiés ou des forteresses ; « places fortes » rend naturellement le contraste défensif en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition des questions du texte hébreu est conservée, tandis que le singulier collectif est explicité par « ce peuple » pour assurer une référence naturelle en français.
