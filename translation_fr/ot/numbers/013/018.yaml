  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: fr
  text: Vous examinerez le pays pour voir comment il est[a], et si le peuple qui l’habite est fort ou faible, peu nombreux ou nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qu’il est »; il s’agit d’évaluer la nature ou l’état du pays.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Vous examinerez
  rationale: Le verbe ראה signifie littéralement « voir », mais, dans cette mission d’exploration, il exprime l’idée d’observer afin d’évaluer. Le futur français a ici une valeur d’instruction naturelle.
- source_word: הָאָרֶץ מַה הִוא
  choice: le pays pour voir comment il est
  rationale: מַה הִוא demande une appréciation de la nature ou de l’état du pays. « Comment il est » reste proche de l’hébreu tout en étant idiomatique en français.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: le peuple qui l’habite
  rationale: Le participe יֹשֵׁב avec עַל décrit la population établie sur ce territoire. « Qui l’habite » rend naturellement cette relation en français sans calquer « assis sur lui ».
- source_word: הֶחָזָק
  choice: fort
  rationale: חזק désigne ici la force ou la puissance de la population, dans le cadre d’une évaluation stratégique.
- source_word: הֲרָפֶה
  choice: faible
  rationale: רפה s’oppose directement à חזק et indique ici un manque de force.
- source_word: הַמְעַט
  choice: peu nombreux
  rationale: L’adjectif exprime ici le petit nombre. « Peu nombreux » convient au singulier collectif « peuple » et rend clairement le contraste quantitatif.
- source_word: רָב
  choice: nombreux
  rationale: רב indique ici un grand nombre et forme l’antithèse de הַמְעַט.
- source_word: אִם
  choice: ou
  rationale: Dans cette série de questions indirectes binaires, אִם introduit le second terme de l’alternative; « ou » est la formulation française la plus naturelle.
theological_decisions: []
