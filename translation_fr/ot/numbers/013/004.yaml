  text: 'Voici leurs noms : pour la tribu de Ruben, Shammoua, fils de Zakkour.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Dans l’introduction d’une liste, « Voici » restitue naturellement la valeur présentative de l’hébreu; la continuité marquée par וְ est portée par le contexte sans imposer un « Et » peu idiomatique en français.
- source_word: שְׁמוֹתָם
  choice: leurs noms
  rationale: Rendu direct du syntagme hébreu, intégré à la tournure française naturelle « Voici leurs noms ».
- source_word: לְמַטֵּה
  choice: pour la tribu de
  rationale: Dans cette liste de représentants, לְ indique la tribu pour laquelle l’homme est désigné. « Pour la tribu de » conserve cette nuance, plutôt que de réduire l’expression à la seule provenance.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: שַׁמּוּעַ
  choice: Shammoua
  rationale: Translittération adaptée aux conventions de lecture françaises du nom hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Équivalent généalogique français direct de בֶּן.
- source_word: זַכּוּר
  choice: Zakkour
  rationale: Translittération française qui représente la consonne redoublée et la voyelle finale du nom hébreu.
