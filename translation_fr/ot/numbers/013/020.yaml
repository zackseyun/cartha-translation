  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: fr
  text: si le pays est fertile ou pauvre, s’il y a des arbres ou non. Prenez courage et prenez quelques fruits du pays. » C’était alors la saison des premiers raisins mûrs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: fertile ou pauvre
  rationale: Les adjectifs signifient littéralement « gras » et « maigre ». Appliqués au sol, ils décrivent naturellement sa fertilité ou sa pauvreté.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: s’il y a des arbres ou non
  rationale: עֵץ peut désigner un arbre ou du bois. « Des arbres » convient directement à l’examen des caractéristiques du pays, sans exclure implicitement la question des ressources en bois.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: Prenez courage
  rationale: La forme exprime ici l’idée de se montrer fort ou résolu. « Prenez courage » est une exhortation française naturelle qui garde cette force.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: rapportez quelques fruits du pays
  rationale: מִן a une valeur partitive, rendue par « quelques ». Dans cette mission de reconnaissance, prendre les fruits implique de les rapporter; le français explicite naturellement ce mouvement contextuel.
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: les premiers raisins mûrs
  rationale: L’expression désigne les raisins qui commencent à mûrir, et donc le début de la vendange, sans imposer ici une connotation cultuelle de « prémices ».
- source_word: וְהַיָּמִים יְמֵי
  choice: C’était alors le temps de
  rationale: Cette formulation française naturelle rend la note temporelle narrative, tandis qu’une reproduction littérale de la répétition hébraïque serait lourde.
