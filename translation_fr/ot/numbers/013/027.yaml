base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: fr
  text: 'Ils lui firent leur rapport et dirent : « Nous sommes entrés dans le pays où tu nous as envoyés. Et, en effet, il ruisselle de lait et de miel[a], et voici son fruit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et, de plus, il ruisselle de lait et de miel. » L’hébreu וְגַם souligne ici l’affirmation concernant l’abondance du pays.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: Ils lui firent leur rapport
  rationale: Au piel, ספר signifie ici raconter ou faire un rapport. Cette formulation convient au compte rendu officiel des explorateurs tout en restant naturelle en français.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom renvoie à Moïse dans le contexte, mais l’hébreu emploie simplement un pronom ; la traduction le conserve.
- source_word: וַיֹּאמְרוּ
  choice: en disant
  rationale: Le gérondif relie naturellement en français le verbe de parole au contenu du rapport, sans perdre l’enchaînement narratif hébreu.
- source_word: בָּאנוּ אֶל־הָאָרֶץ
  choice: Nous sommes entrés dans le pays
  rationale: Le verbe בוא peut exprimer le fait de venir ou d’entrer. Ici, les explorateurs déclarent avoir pénétré dans le pays ; cette formulation est idiomatique et précise.
- source_word: אֲשֶׁר שְׁלַחְתָּנוּ
  choice: où tu nous as envoyés
  rationale: Le relatif se rapporte à la destination de leur mission. « Où » rend cette relation naturellement en français moderne.
- source_word: וְגַם
  choice: Oui
  rationale: Dans ce contexte, la combinaison marque une affirmation appuyée de l’abondance du pays. « Oui » restitue cette insistance sans alourdir la phrase.
- source_word: זָבַת חָלָב וּדְבַשׁ הִוא
  choice: il ruisselle de lait et de miel
  rationale: Cette expression hébraïque consacrée évoque l’abondance agricole. Le pronom masculin français « il » reprend « le pays », tandis que « ruisselle de lait et de miel » conserve l’image vive de l’original.
- source_word: וְזֶה פִּרְיָהּ
  choice: et voici son fruit
  rationale: « Voici » rend bien la valeur démonstrative de זֶה lorsque les explorateurs présentent le fruit comme preuve visible de leurs paroles.
