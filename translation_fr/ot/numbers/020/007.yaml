lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol au piel de דבר appartient à la formule narrative habituelle introduisant une parole. « Parla » en conserve la valeur et la cadence dignifiée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre ; « Yahweh » est une transcription française courante.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל indique ici le destinataire de la parole ; « à Moïse » est l’équivalent français naturel.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: 'Cet infinitif introduit le contenu du discours qui suit. « En ces termes : » rend naturellement cette fonction en français et évite le calque pesant « en disant ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. La traduction conserve donc le nom personnel, sans lui substituer un titre. Une note signale la forme hébraïque et les autres usages de traduction.
translation_notes:
  register: 'Français moderne, international et digne. La formule « en ces termes : » annonce clairement la parole du verset suivant tout en restant naturelle à l’oral comme à l’écrit.'
