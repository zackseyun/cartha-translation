  variant: modern international French
source:
  edition: WLC
  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: fr
  text: Aaron sera réuni aux siens[a], car il n’entrera pas dans le pays que j’ai donné aux fils d’Israël, parce que vous vous êtes rebellés contre mon ordre[b] aux eaux de Meriba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « sera rassemblé à son peuple » ; expression hébraïque employée pour la mort, qui évoque l’appartenance aux siens sans préciser l’état après la mort.
    reason: idiome_lexical
  - marker: b
    text: Littéralement, « contre ma bouche », c’est-à-dire contre l’ordre que Dieu a prononcé.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף ... אֶל עַמָּיו
  choice: sera recueilli auprès des siens
  rationale: Conserve l’image hébraïque solennelle de la mort et de la réunion au peuple auquel Aaron appartient, sans la réduire au simple verbe « mourir ». « Auprès des siens » est naturel en français tout en maintenant l’ambiguïté de l’expression.
- source_word: כִּי
  choice: car
  rationale: Introduit clairement la raison pour laquelle Aaron sera recueilli auprès des siens, dans un registre narratif digne et naturel.
- source_word: לֹא יָבֹא אֶל הָאָרֶץ
  choice: il n’entrera pas dans le pays
  rationale: Rend idiomatiquement le verbe de mouvement avec la préposition et conserve « le pays » comme désignation sobre du territoire donné par Dieu.
- source_word: אֲשֶׁר נָתַתִּי
  choice: que j’ai donné
  rationale: Le passé composé exprime un don divin déjà établi et toujours pertinent, sans ajouter « promis » au texte.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Reproduit la formule hébraïque traditionnelle et sa forme masculine, tout en restant intelligible en français biblique moderne.
- source_word: עַל אֲשֶׁר מְרִיתֶם
  choice: parce que vous vous êtes rebellés
  rationale: Exprime la cause du jugement et la gravité de מרה, qui dénote la rébellion ou le refus de l’autorité.
- source_word: אֶת־פִּי
  choice: contre mon ordre
  rationale: Littéralement « contre ma bouche » ; dans ce contexte, la bouche de Dieu désigne l’ordre qu’il a prononcé. Le choix transmet naturellement le sens en français.
- source_word: לְמֵי מְרִיבָה
  choice: aux eaux de Meriba
  rationale: Conserve le nom propre traditionnel du lieu et de l’événement, sans le remplacer par une interprétation telle que « Contestation ».
theological_decisions:
- issue: 'Expression de la mort : « recueilli auprès des siens »'
  choice: Conserver l’image de la réunion avec son peuple
  alternative: « Aaron mourra »
  rationale: L’expression hébraïque évoque davantage que le seul fait biologique de mourir, mais ne définit pas précisément l’état après la mort. La formulation choisie préserve cette richesse et cette réserve.
- issue: Portée de « fils d’Israël »
  choice: Maintenir la formule « fils d’Israël »
  alternative: « Israélites » ou « peuple d’Israël »
  rationale: La formule source est masculine et ethnonymique. Sa conservation respecte la forme du texte sans prétendre que seuls les hommes sont visés.
- issue: Responsabilité exprimée par le pluriel מְרִיתֶם
  choice: Conserver « vous vous êtes rebellés »
  alternative: Nommer explicitement Moïse et Aaron
  rationale: Le texte emploie la deuxième personne du pluriel sans répéter les noms. La traduction garde cette formulation et n’explicite pas davantage que l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur passif « sera recueilli » conserve la solennité de l’idiome hébraïque ; « auprès des siens » évite une formulation française obscure tout en préservant son ouverture. Les marqueurs [a] et [b] figurent dans le texte principal.
