  naturalness: Le français est moderne, clair et d’un registre approprié. « Sous leurs yeux », « communauté » et « donner à boire » sont naturels. La suppression de « ainsi » rend la formulation plus directe sans perdre la fluidité.
  terminology: « Bâton », « communauté », « rocher » et « bétail » conviennent au contexte et aux termes hébreux. « Son bétail » est idiomatique avec l’antécédent collectif français « communauté », tout en désignant les animaux du groupe.
