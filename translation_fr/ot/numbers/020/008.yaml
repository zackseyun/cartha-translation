  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: fr
  text: « Prends le bâton[a], puis rassemble la communauté, toi et ton frère Aaron. Vous parlerez au rocher sous leurs yeux, et il donnera son eau. Tu feras sortir pour eux de l’eau du rocher et tu donneras à boire à la communauté et à son bétail. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la verge ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: le bâton
  rationale: מַטֶּה désigne couramment un bâton ou une verge. « Bâton » est naturel en français moderne et convient à l’objet que Moïse doit prendre.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: עֵדָה désigne ici l’ensemble du peuple d’Israël réuni. « Communauté » est clair, collectif et moins marqué institutionnellement que « congrégation ».
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: Vous parlerez au rocher
  rationale: Le verbe est au pluriel et inclut explicitement Moïse et Aaron. « Parler au rocher » rend directement l’expression hébraïque sans préciser davantage la teneur des paroles.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Cette expression française naturelle conserve l’image des yeux et souligne le caractère public et visible de l’acte.
- source_word: וְנָתַן מֵימָיו
  choice: et il donnera son eau
  rationale: Le sujet singulier est le rocher. La traduction conserve aussi le suffixe possessif de מֵימָיו, sans rationaliser l’image.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: Tu feras ainsi sortir pour eux de l’eau du rocher
  rationale: « Faire sortir » restitue la valeur causative du hiphil de יצא. « Ainsi » exprime ici l’enchaînement résultant sans ajouter un nouveau moyen au commandement.
- source_word: וְהִשְׁקִיתָ
  choice: tu donneras à boire
  rationale: Cette formulation idiomatique rend le causatif de שקה de façon claire et directe.
- source_word: בְּעִירָם
  choice: son bétail
  rationale: בְּעִירָם désigne les animaux domestiques du groupe. L’antécédent collectif « communauté » appelle naturellement le singulier possessif « son » en français.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: toi et ton frère Aaron
  rationale: La formule identifie explicitement les deux responsables. L’ordre français « ton frère Aaron » est naturel tout en préservant le lien familial.
theological_decisions:
- issue: Caractère public du commandement et du signe
  choice: « sous leurs yeux » conserve l’accent sur ce que toute la communauté doit voir.
  alternative: « devant eux », formulation plus générale
  rationale: לְעֵינֵיהֶם met littéralement en avant les yeux des témoins. Cette visibilité est importante pour la logique narrative de l’épisode, sans qu’il soit nécessaire d’en proposer une interprétation doctrinale.
- issue: Nombre du commandement de parler au rocher
  choice: Le pluriel « Vous parlerez » attribue le commandement à Moïse et Aaron.
  alternative: Un singulier français qui ferait de Moïse seul le destinataire actif
  rationale: Le texte massorétique porte וְדִבַּרְתֶּם, deuxième personne masculine plurielle. La traduction maintient cette donnée, même si les verbes suivants reviennent au singulier.
- issue: Alternance entre verbes pluriel et singulier
  choice: Le texte traduit « Vous parlerez », puis « Tu feras… tu donneras », en suivant l’alternance grammaticale hébraïque.
  alternative: Uniformiser tous les verbes au pluriel ou au singulier
  rationale: Cette alternance peut signaler une responsabilité conjointe pour la parole mais une exécution particulièrement confiée à Moïse. La conserver évite de résoudre silencieusement cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La structure impérative est fluide sans effacer les changements de nombre du texte hébreu. « Communauté » évite le caractère ecclésiastique que peut suggérer « congrégation » en français contemporain.
