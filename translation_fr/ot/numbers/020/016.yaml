source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: fr
  text: Nous avons crié vers Yahvé, et il a entendu notre voix. Il a envoyé un ange[a] et nous a fait sortir d’Égypte. Et voici que nous sommes à Qadesh, une ville à la limite de ton territoire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un messager ». Le mot hébreu peut désigner un messager humain ou céleste ; dans ce contexte, beaucoup y voient un ange envoyé par Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: nous avons crié vers
  rationale: Le verbe צעק exprime un appel pressant au secours. « Crier vers » rend cette détresse et convient naturellement à un appel adressé à Dieu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme « Yahvé », courante en français, représente le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: il a entendu notre voix
  rationale: Cette formulation conserve l’image explicite de l’hébreu tout en restant idiomatique en français.
- source_word: מַלְאָךְ
  choice: un ange
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste. Dans ce contexte, « ange » est une lecture naturelle, tandis que la portée plus large du terme est signalée en note.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: nous a fait sortir d’Égypte
  rationale: Le hiphil de יצא signifie ici « faire sortir ». Cette traduction conserve la valeur causative du verbe hébreu.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure française actuelle attire l’attention sur la situation présente sans recourir à une expression archaïque.
- source_word: בְקָדֵשׁ
  choice: à Qadesh
  rationale: En français, « à » est la préposition naturelle avec un nom de ville.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: une ville à la limite de ton territoire
  rationale: La formulation exprime clairement la situation de Qadesh à l’extrémité du domaine édomite; « territoire » rend ici la dimension spatiale de גְּבוּל.
theological_decisions:
- issue: Identité du מַלְאָךְ envoyé lors de la sortie d’Égypte
  choice: Traduire par « un ange » sans préciser davantage son identité
  alternative: « un messager », ou une identification théologique plus précise avec l’ange de Yahvé
  rationale: Le verset affirme seulement que Yahvé a envoyé un מַלְאָךְ. La traduction retient le sens céleste naturel dans ce contexte, mais la note préserve l’ambiguïté lexicale sans imposer une identification théologique absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases ont été légèrement segmentées pour une lecture naturelle, sans modifier les rapports logiques du texte. « Qadesh » suit une translittération française courante, et le tutoiement conserve le singulier de גְבוּלֶךָ adressé au roi d’Édom.
