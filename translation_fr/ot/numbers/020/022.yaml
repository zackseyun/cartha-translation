  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל כָּל הָ/עֵדָ֖ה הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: fr
  text: Ils partirent de Qadesh, et les Israélites, toute la communauté, arrivèrent au mont Hor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Hor la montagne » ; l’expression fonctionne comme un nom de lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans ce contexte de déplacement du camp, נסע indique qu’ils quittèrent une étape pour poursuivre leur route. « Partirent » est naturel et précis en français moderne.
- source_word: מִקָּדֵשׁ
  choice: de Qadesh
  rationale: Le texte hébreu porte simplement « Qadesh » ; ajouter « Barnéa » dépasserait la formulation du verset.
- source_word: וַיָּבֹאוּ
  choice: arrivèrent
  rationale: Avec une destination, בוא peut naturellement se rendre par « arriver à ». Ce choix exprime clairement l’aboutissement du déplacement sans suggérer qu’ils pénétrèrent dans la montagne.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël ». « Les Israélites » restitue naturellement en français moderne la désignation collective portée par cet idiome hébreu.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici la communauté constituée d’Israël. « Toute la communauté » est actuel, compréhensible et conserve la portée collective de כָּל.
- source_word: הֹר הָהָר
  choice: le mont Hor
  rationale: L’expression, littéralement « Hor la montagne », fonctionne comme un nom de lieu. « Le mont Hor » est sa forme française naturelle.
theological_decisions: []
