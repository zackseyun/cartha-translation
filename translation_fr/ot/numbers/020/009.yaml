source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: fr
  text: Moïse prit le bâton qui était devant Yahweh[a], comme Yahweh le lui avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la verge ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit donc
  rationale: Le wayyiqtol qal de לקח exprime ici l’action narrative simple « prit ». « Donc » marque naturellement en français l’enchaînement avec l’ordre précédent.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu מֹשֶׁה.
- source_word: הַמַּטֶּה
  choice: le bâton
  rationale: מַטֶּה désigne ici un objet physique. « Bâton » est le terme français courant et naturel; « verge » demeure une possibilité plus traditionnelle.
- source_word: מִלִּפְנֵי
  choice: qui se trouvait devant
  rationale: La tournure explicite la relation spatiale de מִלִּפְנֵי (« de devant ») dans un français naturel, sans remplacer cette image concrète par l’abstraction « présence ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin Yahweh plutôt que par un titre.
- source_word: כַּאֲשֶׁר
  choice: exactement comme
  rationale: Cette expression rend la conformité précise introduite par כַּאֲשֶׁר dans un français idiomatique.
- source_word: צִוָּהוּ
  choice: celui-ci le lui avait ordonné
  rationale: Le plus-que-parfait indique naturellement que l’ordre précède l’action de prendre le bâton. « Celui-ci » rattache grammaticalement le sujet à Yahweh et évite l’ambiguïté des deux pronoms masculins successifs en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe évite le calque peu naturel « prit le bâton de devant Yahweh » tout en conservant la localisation concrète de l’objet devant Yahweh.
