  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: fr
  text: 'Mais il répondit : « Tu ne passeras pas. » Alors Édom sortit à sa rencontre[a] avec une troupe nombreuse[b] et une grande force[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’affronter » ; l’expression hébraïque signifie en elle-même « aller à la rencontre de », mais le contexte est manifestement hostile.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec un peuple lourd », expression désignant ici un groupe nombreux ou imposant.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « avec une main forte », expression désignant une grande puissance ou une force considérable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais il répondit
  rationale: Le waw fait avancer le récit, tandis que « mais » rend l’opposition à la demande d’Israël. « Répondit » est naturel dans ce dialogue et laisse implicite, comme l’hébreu, le représentant d’Édom.
- source_word: לֹא תַעֲבֹר
  choice: Tu ne passeras pas
  rationale: L’imparfait exprime ici un refus ferme ou une interdiction. Cette formulation conserve la force catégorique de la parole.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: Alors Édom sortit
  rationale: « Sortit » traduit directement יצא sans préciser excessivement qu’il s’agit d’une marche militaire. « Alors » assure l’enchaînement narratif et met en relief la mise à exécution du refus.
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: L’expression hébraïque signifie normalement aller à la rencontre de quelqu’un. Le contexte est hostile, mais le texte principal préserve la neutralité lexicale de l’expression.
- source_word: בְּעַם כָּבֵד
  choice: avec une troupe nombreuse
  rationale: 'Littéralement « avec un peuple lourd » : כבד évoque ici une masse importante ou imposante. « Troupe nombreuse » rend naturellement le sens collectif et militaire suggéré par le contexte.'
- source_word: וּבְיָד חֲזָקָה
  choice: et à main forte
  rationale: Cette traduction conserve l’image hébraïque de la main comme symbole de puissance, sans réduire l’expression au seul sens abstrait de « force ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image sémitique « à main forte », éclairée par une note, et maintient l’ambiguïté lexicale de « à sa rencontre » malgré l’hostilité évidente du contexte.
