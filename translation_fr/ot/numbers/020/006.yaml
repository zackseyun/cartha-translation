  to: Moïse et Aaron se rendirent à l’entrée de la tente de la rencontre, en venant de devant l’assemblée[a]. Ils tombèrent face contre terre, et la gloire de Yahweh leur apparut.
  rationale: La révision conserve le mouvement depuis la présence de l’assemblée vers l’entrée de la tente, sans faire du départ ou de l’éloignement le sens littéral du verbe hébreu. Elle corrige également la note afin qu’elle explique précisément l’idiome spatial.
