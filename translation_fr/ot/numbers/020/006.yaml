base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: fr
  text: Moïse et Aaron se rendirent à l’entrée de la tente de la rencontre, en venant de devant l’assemblée[a]. Ils tombèrent face contre terre, et la gloire de Yahweh leur apparut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant l’assemblée », c’est-à-dire de la présence du peuple réuni.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא ... מִפְּנֵי הַקָּהָל
  choice: quittèrent l’assemblée et se rendirent
  rationale: Le mouvement exprimé par בוא, associé à מִפְּנֵי, va de la présence de l’assemblée vers l’entrée de la tente. Cette formulation française naturelle explicite le déplacement sans ajouter de motif.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: קהל désigne ici la communauté réunie; « assemblée » est clair, actuel et conserve cette dimension collective.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: l’entrée de la tente de la rencontre
  rationale: « Entrée » rend naturellement פֶּתַח. « Tente de la rencontre » traduit les éléments du syntagme hébreu et évoque le lieu fixé de rencontre avec Dieu.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: Ils tombèrent face contre terre
  rationale: Cette expression française restitue concrètement la posture décrite par l’hébreu, sans déterminer si elle relève principalement de la supplication, de l’adoration ou de l’effroi.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: כבוד désigne la gloire divine qui se manifeste. Le tétragramme est rendu par le nom propre « Yahweh » plutôt que par un titre.
- source_word: וַיֵּרָא ... אֲלֵיהֶם
  choice: leur apparut
  rationale: Le niphal de ראה exprime ici une manifestation visible; la construction française avec « apparaître à » rend aussi la direction marquée par אֶל.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le tétragramme, nom propre divin. « Yahweh » le représente directement et évite de le remplacer silencieusement par un titre.
- issue: Portée de la posture face contre terre
  choice: description physique non interprétée
  alternative: ils se prosternèrent
  rationale: Le texte décrit leur chute sur le visage sans en préciser explicitement la fonction. La traduction conserve cette ouverture théologique et narrative.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase a été divisée pour éviter une coordination lourde. « Face contre terre » est idiomatique tout en restant proche de l’image hébraïque; « Yahweh » conserve le nom divin.
