    rationale: Le texte hébreu dit littéralement qu’ils vinrent/allèrent « de devant l’assemblée » vers l’entrée; il n’emploie pas un verbe signifiant explicitement « s’éloigner ». La note doit distinguer le rendu idiomatique de la formulation littérale.
  - severity: low
    issue: « quittèrent l’assemblée » réduit légèrement la spatialité de מִפְּנֵי.
    rationale: Cette formulation est possible dans le contexte, mais « en venant de devant l’assemblée » préserve mieux l’expression source tout en restant idiomatique en français.
  revised_text: Moïse et Aaron se rendirent à l’entrée de la tente de la rencontre, en venant de devant l’assemblée[a]. Ils tombèrent face contre terre, et la gloire de Yahweh leur apparut.
