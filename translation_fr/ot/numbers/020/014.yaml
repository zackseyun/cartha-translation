  text: וַ/יִּשְׁלַ֨ח מֹשֶׁ֧ה מַלְאָכִ֛ים מִ/קָּדֵ֖שׁ אֶל מֶ֣לֶךְ אֱד֑וֹם כֹּ֤ה אָמַר֙ אָחִ֣י/ךָ יִשְׂרָאֵ֔ל אַתָּ֣ה יָדַ֔עְתָּ אֵ֥ת כָּל הַ/תְּלָאָ֖ה אֲשֶׁ֥ר מְצָאָֽתְ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: fr
  text: 'Moïse envoya alors de Qadesh des messagers au roi d’Édom : « Voici ce que dit votre frère Israël[a] : Vous connaissez toutes les difficultés qui nous sont arrivées[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre parent Israël ». L’hébreu dit littéralement « votre frère Israël » et évoque la parenté ancestrale entre Édom et Israël.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « toute la difficulté qui nous a trouvés » ; autrement dit, toutes les difficultés qui nous sont survenues.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya alors
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement la succession narrative en français.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte diplomatique, le terme désigne des représentants humains. « Messagers » reste clair et moins spécialisé qu’« émissaires ».
- source_word: מִקָּדֵשׁ
  choice: de Qadesh
  rationale: L’hébreu porte seulement le nom Qadesh ; il ne convient pas d’ajouter « Barnéa » dans ce verset.
- source_word: מֶלֶךְ אֱדוֹם
  choice: au roi d’Édom
  rationale: Traduction directe et naturelle de la construction hébraïque.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formule de messager est rendue dans un français actuel et digne, le présent convenant au message transmis.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: ton frère Israël
  rationale: La formulation conserve l’image familiale explicite qui rappelle la parenté ancestrale entre Israël et Édom.
- source_word: אַתָּה יָדַעְתָּ
  choice: Tu sais
  rationale: Le parfait exprime ici un état présent de connaissance. Le pronom explicite est naturellement conservé en français.
- source_word: כָּל הַתְּלָאָה
  choice: toutes les difficultés
  rationale: Le singulier collectif hébreu désigne l’ensemble des peines ou épreuves subies. Le pluriel français est idiomatique et compréhensible.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: qui nous sont arrivées
  rationale: Littéralement, ces difficultés « nous ont trouvés ». La formulation choisie restitue naturellement l’idée de ce qui est survenu ou échu à Israël.
theological_decisions:
- issue: Langage de parenté entre Israël et Édom
  choice: ton frère Israël
  alternative: Israël, ton parent
  rationale: Le texte présente délibérément l’appel d’Israël en termes fraternels, sur le fond de la parenté ancestrale d’Édom et d’Israël. La traduction préserve cette métaphore sans la généraliser.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement est conservé dans l’adresse diplomatique parce que l’hébreu emploie le singulier et insiste sur la relation fraternelle. « Qadesh » suit une translittération française courante et n’explicite pas Qadesh-Barnéa.
