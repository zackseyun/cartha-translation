source:
  edition: WLC
  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: fr
  text: Laisse-nous, s’il te plaît, traverser ton pays. Nous ne passerons ni dans les champs ni dans les vignes, et nous ne boirons pas l’eau des puits. Nous suivrons la route du roi[a], sans nous écarter ni à droite ni à gauche, jusqu’à ce que nous ayons franchi ton territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la voie royale ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « ta frontière » ou « ton territoire »; l’expression indique ici qu’ils auront dépassé les limites de son pays.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: Laisse-nous, s’il te plaît, traverser
  rationale: Le cohortatif accompagné de נָא formule une demande polie. Cette tournure en restitue à la fois la force volitive et la courtoisie.
- source_word: בְאַרְצֶךָ
  choice: ton pays
  rationale: Avec עבר, ב indique ici le déplacement à travers un territoire. « Pays » convient naturellement à la terre placée sous l’autorité d’Édom.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: Nous ne passerons ni dans les champs ni dans les vignes
  rationale: Les singuliers hébreux ont une valeur collective. Le français emploie naturellement le pluriel pour désigner les terres cultivées qu’Israël promet d’éviter.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: et nous ne boirons pas l’eau des puits
  rationale: מֵי בְאֵר signifie littéralement « l’eau d’un puits » ou « les eaux de puits ». Le pluriel générique est idiomatique en français et n’ajoute pas de précision substantielle.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: la route du roi
  rationale: La traduction directe « route du roi » conserve l’expression hébraïque et désigne une voie reconnue, sans imposer le sens plus moderne d’« autoroute ».
- source_word: נֵלֵךְ
  choice: Nous suivrons
  rationale: Dans ce contexte, הלך exprime le déplacement le long de la route indiquée. « Suivre la route » est naturel et précis en français.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: sans nous écarter ni à droite ni à gauche
  rationale: נטה signifie ici dévier de l’itinéraire. La formulation française conserve la paire directionnelle et explicite naturellement l’idée.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: jusqu’à ce que nous ayons franchi ton territoire
  rationale: גְּבוּל peut désigner la frontière ou le territoire délimité. Dans ce contexte, il s’agit d’achever la traversée du domaine d’Édom; « franchi ton territoire » rend ce sens sans suggérer qu’une seule frontière serait traversée de part en part.
