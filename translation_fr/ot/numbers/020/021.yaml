source:
  edition: WLC
  text: וַ/יְמָאֵ֣ן אֱד֗וֹם נְתֹן֙ אֶת יִשְׂרָאֵ֔ל עֲבֹ֖ר בִּ/גְבֻל֑/וֹ וַ/יֵּ֥ט יִשְׂרָאֵ֖ל מֵ/עָלָֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: fr
  text: Mais Édom refusa de laisser Israël traverser son territoire. Israël se détourna donc de lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’éloigna de lui ».'
    reason: Variante lexicale possible pour וַיֵּט ... מֵעָלָיו, qui peut exprimer le fait de se détourner ou de s’éloigner d’Édom.
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: refusa
  rationale: Le verbe מאן exprime un refus ou une absence de volonté ; « refusa » est naturel et suffisamment ferme dans ce récit.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Le nom propre du peuple et du territoire est conservé sous sa forme française usuelle.
- source_word: נְתֹן
  choice: de laisser
  rationale: Avec מאן, נתן a ici le sens idiomatique de permettre ; « refusa de laisser » rend naturellement cette construction.
- source_word: עֲבֹר
  choice: traverser
  rationale: Dans ce contexte territorial, עבר désigne le fait de passer à travers le pays ; « traverser » est précis et idiomatique en français.
- source_word: בִּגְבֻלוֹ
  choice: son territoire
  rationale: גְּבוּל peut désigner une frontière, des limites ou le territoire qu’elles délimitent. Ici, la demande concerne le passage à travers le pays d’Édom, d’où « son territoire ».
- source_word: וַיֵּט
  choice: se détourna
  rationale: נטה signifie ici changer de direction ou s’écarter. « Se détourna » conserve cette image sans préciser davantage que le texte la nature du changement d’itinéraire.
- source_word: מֵעָלָיו
  choice: de lui
  rationale: La locution indique l’éloignement par rapport à Édom. Le pronom masculin reprend la personnification collective déjà présente dans le texte hébreu.
theological_decisions: []
