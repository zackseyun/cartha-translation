source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse et à Aaron : « Parce que vous ne m’avez pas fait confiance[a] et que vous ne m’avez pas tenu pour saint[b] aux yeux des Israélites[c], c’est pourquoi vous ne ferez pas entrer cette assemblée dans le pays que je leur ai donné. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous n’avez pas cru en moi ». Le verbe hébreu peut exprimer la foi ou la confiance.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous n’avez pas manifesté ma sainteté » ou « vous n’avez pas montré que je suis saint ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « les fils d’Israël » ; traditionnellement « les enfants d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel du texte hébreu.
- source_word: יַעַן
  choice: Puisque
  rationale: Introduit naturellement en français la cause du jugement qui suit.
- source_word: לֹא הֶאֱמַנְתֶּם בִּי
  choice: vous ne m’avez pas fait confiance
  rationale: Le hiphil de אמן avec ב exprime ici la foi ou la confiance placée en quelqu’un. Cette formulation est naturelle en français et conserve la dimension relationnelle du reproche.
- source_word: לְהַקְדִּישֵׁנִי
  choice: manifesté ma sainteté
  rationale: Le hiphil de קדש indique ici qu’il fallait faire reconnaître publiquement Yahweh comme saint. La formulation évite l’impression que Moïse et Aaron pourraient rendre Dieu saint en lui-même.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Rend l’image hébraïque et souligne le caractère public et visible de la faute.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent ethnonymique idiomatique de « fils d’Israël » en français moderne, désignant le peuple sans limiter le référent aux hommes.
- source_word: לָכֵן
  choice: donc
  rationale: Marque explicitement la conséquence judiciaire tout en restant naturel dans la phrase française.
- source_word: תָבִיאוּ
  choice: vous ne ferez pas entrer
  rationale: Reproduit la valeur causative du hiphil de בוא et convient à l’assemblée conduite vers le pays.
- source_word: הַקָּהָל הַזֶּה
  choice: cette assemblée
  rationale: Préserve l’idée du peuple rassemblé sans connotation ecclésiastique indue.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: « Pays » est idiomatique en français pour la terre promise considérée comme territoire, tout en conservant sa portée contextuelle.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: que je leur ai donné
  rationale: Le parfait hébreu présente le don comme accompli et certain ; le passé composé français en conserve la force.
theological_decisions:
- issue: Nature de la faute de Moïse et d’Aaron
  choice: Conserver à la fois le manque de confiance et le défaut de manifestation publique de la sainteté divine.
  alternative: Expliquer la faute uniquement comme une désobéissance, un manque de foi ou une atteinte à l’honneur de Dieu.
  rationale: Le verset énonce deux aspects liés sans préciser exactement de quelle manière l’acte commis les réalise. La traduction maintient cette tension sans ajouter d’explication.
- issue: Sens causatif de לְהַקְדִּישֵׁנִי
  choice: « manifester ma sainteté »
  alternative: « me sanctifier », « me tenir pour saint » ou « montrer que je suis saint »
  rationale: Le choix exprime la reconnaissance publique de la sainteté de Yahweh sans suggérer qu’il recevrait sa sainteté de Moïse et d’Aaron.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: « les Israélites »
  alternative: « les fils d’Israël » ou « les enfants d’Israël »
  rationale: L’expression est un ethnonyme collectif dans ce contexte. « Les Israélites » en rend naturellement la portée en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le lien causal et la solennité du jugement, tandis que les formulations idiomatiques évitent les calques opaques. Tous les appels de notes figurent dans le texte dans leur ordre d’apparition.
