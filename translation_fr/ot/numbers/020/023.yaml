source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: fr
  text: 'Yahweh[a] dit à Moïse et à Aaron, au mont Hor, à la frontière du pays d’Édom :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme du nom divin dans le texte source et son autre rendu courant.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe אמר signifie normalement « dire ». Le passé simple convient au récit français et introduit directement les paroles qui suivent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette forme rend le nom divin YHWH comme un nom propre plutôt que de lui substituer un titre.
- source_word: וְאֶל אַהֲרֹן
  choice: et à Aaron
  rationale: La répétition de la préposition אֶל est conservée en français pour respecter la structure hébraïque et identifier clairement les deux destinataires.
- source_word: בְּהֹר הָהָר
  choice: au mont Hor
  rationale: La préposition בְּ est ici locative, et « mont Hor » est la forme française usuelle de ce toponyme.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: à la frontière du pays d’Édom
  rationale: Avec גְּבוּל, עַל situe le mont Hor à la limite du territoire d’Édom ; « à la frontière » est idiomatique et précis en français moderne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit les paroles rapportées au verset suivant. En français, les deux-points remplissent naturellement cette fonction sans l’expression lourde « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente directement, tandis que « le SEIGNEUR » reflète la lecture traditionnelle de substitution.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme. Les deux-points annoncent naturellement la déclaration du verset suivant.
