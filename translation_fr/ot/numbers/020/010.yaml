  text: וַ/יַּקְהִ֜לוּ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן אֶת הַ/קָּהָ֖ל אֶל פְּנֵ֣י הַ/סָּ֑לַע וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְעוּ נָא֙ הַ/מֹּרִ֔ים הֲ/מִן הַ/סֶּ֣לַע הַ/זֶּ֔ה נוֹצִ֥יא לָ/כֶ֖ם מָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: fr
  text: 'Moïse et Aaron rassemblèrent alors la communauté devant le rocher, et il leur dit : « Écoutez donc, rebelles ! Est-ce de ce rocher que nous ferons sortir de l’eau pour vous ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: rassemblèrent
  rationale: Le hifil de קהל exprime l’action de faire se réunir. « Rassemblèrent » en restitue naturellement la valeur causative.
- source_word: הַקָּהָל
  choice: la communauté
  rationale: קָהָל désigne ici l’ensemble du peuple réuni. « La communauté » est naturel en français moderne et évite les connotations ecclésiales que pourrait prendre « congrégation ».
- source_word: אֶל פְּנֵי הַסָּלַע
  choice: devant le rocher
  rationale: L’expression signifie « devant » ou « en face de » ; « devant le rocher » est précis et idiomatique.
- source_word: וַיֹּאמֶר
  choice: il leur dit
  rationale: Le verbe est au singulier et renvoie naturellement à Moïse, sans que le français ait besoin de répéter son nom.
- source_word: שִׁמְעוּ נָא
  choice: Écoutez donc
  rationale: L’impératif שִׁמְעוּ appelle à écouter, tandis que נָא renforce ici l’interpellation. « Donc » rend cette insistance sans suggérer une demande polie.
- source_word: הַמֹּרִים
  choice: rebelles
  rationale: Le participe substantivé issu de מרה caractérise directement les destinataires comme des personnes en rébellion. « Rebelles » conserve la vigueur du reproche.
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: Est-ce de ce rocher que
  rationale: Cette tournure française restitue clairement l’interrogation portant sur la provenance exprimée par מִן, tout en gardant l’accent sur « ce rocher ».
- source_word: נוֹצִיא
  choice: nous ferons sortir
  rationale: Le hifil de יצא signifie « faire sortir ». Le futur français convient à la question rhétorique et maintient explicitement la première personne du pluriel.
- source_word: מָיִם
  choice: de l’eau
  rationale: Rendu courant de מַיִם ; l’article partitif est requis dans cette construction française.
theological_decisions:
- issue: La première personne du pluriel dans la question de Moïse
  choice: nous ferons sortir de l’eau
  alternative: Dieu fera sortir de l’eau
  rationale: L’hébreu emploie explicitement la première personne du pluriel נוֹצִיא. La traduction la conserve et ne résout pas artificiellement la tension entre le rôle de Moïse et d’Aaron et l’action de Dieu.
translation_notes:
  register: Français international moderne, direct et digne. « La communauté » privilégie la clarté contextuelle ; l’apostrophe « rebelles ! » garde la force abrupte du texte. La formulation interrogative met naturellement en relief la provenance de l’eau sans atténuer l’ambiguïté relative à l’agent de l’action.
