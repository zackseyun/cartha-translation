source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: fr
  text: Et pourquoi avez-vous amené l’assemblée de Yahweh[a] dans ce désert, pour que nous et notre bétail y mourions ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la communauté de Yahweh ».'
    reason: Signale une autre traduction possible de קָהָל, qui désigne la collectivité rassemblée.
lexical_decisions:
- source_word: וְלָמָה
  choice: Et pourquoi
  rationale: Conserve la conjonction qui relie cette plainte au verset précédent, tout en employant une interrogation naturelle en français.
- source_word: הֲבֵאתֶם
  choice: avez-vous amené
  rationale: Le hifil de בוא signifie ici « faire venir, amener ». Le passé composé exprime naturellement une action accomplie dont les conséquences sont présentes.
- source_word: קְהַל יְהוָה
  choice: l’assemblée de Yahweh
  rationale: קָהָל désigne la collectivité rassemblée. « Assemblée » garde ce sens collectif sans lui donner une coloration ecclésiastique excessive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel porté par le tétragramme, au lieu de le remplacer par un titre.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: dans ce désert
  rationale: מִדְבָּר désigne une région aride ou inculte. « Désert » est ici clair et idiomatique, tandis que « dans » convient au mouvement exprimé par « amener ».
- source_word: לָמוּת שָׁם
  choice: pour que nous y mourions
  rationale: L’infinitif peut exprimer le but ou le résultat envisagé. « Pour que » laisse subsister cette tension dans la plainte, et « y » rend naturellement שָׁם.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: nous et notre bétail
  rationale: Le pronom explicite est conservé par la reprise emphatique « nous », et בְּעִיר désigne collectivement les animaux domestiques ou le bétail.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Valeur de l’infinitif לָמוּת
  choice: pour que nous y mourions
  alternative: de sorte que nous y mourions
  rationale: La construction peut être comprise comme un but sarcastiquement imputé à Moïse et Aaron ou comme le résultat redouté. « Pour que » restitue la formulation accusatrice sans expliciter davantage l’intention.
translation_notes:
  register: Français international moderne, digne et direct. La reprise « nous et notre bétail » conserve l’insistance du pronom hébreu explicite. Le marqueur de note est placé immédiatement après le terme concerné.
