  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: fr
  text: 'Les Israélites lui dirent : « Nous monterons par la grande route. Si nous buvons de ton eau, moi et mes troupeaux, j’en paierai le prix. Je ne demande qu’à traverser à pied, rien de plus. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation naturelle en français moderne désigne fidèlement les membres du peuple d’Israël; le calque « les fils d’Israël » serait ici moins idiomatique.
- source_word: בַּמְסִלָּה
  choice: par la grande route
  rationale: מְסִלָּה désigne une route aménagée ou importante. « Par la grande route » exprime naturellement l’itinéraire établi qu’ils s’engagent à suivre.
- source_word: נַעֲלֶה
  choice: nous monterons
  rationale: Le sens concret de עלה, « monter », est conservé, sans le réduire au simple fait de voyager ou de traverser.
- source_word: מֵימֶיךָ
  choice: ton eau
  rationale: Le nom hébreu morphologiquement pluriel se rend idiomatiquement au singulier collectif en français.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: nous buvons de ton eau, moi et mes troupeaux
  rationale: Le verbe hébreu est au pluriel, suivi du sujet explicité « moi et mon bétail ». La tournure française garde cette structure tout en employant « troupeaux », naturel pour les animaux possédés.
- source_word: וְנָתַתִּי מִכְרָם
  choice: j’en paierai le prix
  rationale: מֶכֶר exprime ici le prix à verser pour l’eau consommée; le pronom « en » rattache clairement le paiement à l’eau.
- source_word: רַק אֵין דָּבָר
  choice: Je ne demande que… rien de plus
  rationale: La formulation restitue la restriction et la minimisation de la requête exprimées par רַק et l’idiome אֵין דָּבָר.
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: à traverser à pied
  rationale: La mention littérale des pieds est rendue par l’expression française naturelle « à pied », tandis que la forme volitive est exprimée comme une requête polie.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le passage du pluriel « nous monterons » au singulier représentatif « moi… j’en paierai… je ne demande » est maintenu afin de préserver le changement de personne présent dans l’hébreu.
