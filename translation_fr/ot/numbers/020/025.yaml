  text: קַ֚ח אֶֽת אַהֲרֹ֔ן וְ/אֶת אֶלְעָזָ֖ר בְּנ֑/וֹ וְ/הַ֥עַל אֹתָ֖/ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: fr
  text: Prends Aaron et son fils Éléazar, et fais-les monter sur le mont Hor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Hor, la montagne » ; traditionnellement : « le mont Hor ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Prends
  rationale: L’impératif qal de לקח signifie directement « prendre ». « Prends » convient naturellement à l’ordre donné à Moïse d’emmener Aaron et Éléazar.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le suffixe masculin singulier renvoie naturellement à Aaron. La tournure « Aaron et son fils Éléazar » lève sans lourdeur une possible hésitation syntaxique en français.
- source_word: וְהַעַל
  choice: fais-les monter
  rationale: 'L’impératif hiphil de עלה a une valeur causative : « faire monter ». Cette formulation en conserve explicitement le sens tout en restant naturelle en français.'
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet pluriel désigne ensemble Aaron et Éléazar.
- source_word: הֹר הָהָר
  choice: le mont Hor
  rationale: Le syntagme hébreu est formellement « Hor, la montagne ». « Le mont Hor » est la désignation géographique conventionnelle et idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif est direct ; « fais-les monter » préserve la valeur causative de l’hébreu. Le marqueur de note est placé après le nom géographique auquel il se rapporte.
