  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: fr
  text: 'Mais Édom lui répondit : « Tu ne passeras pas par mon territoire[a], sinon je sortirai à ta rencontre, l’épée à la main[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par moi ». Édom parle ici comme nation et comme territoire.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec l’épée ». L’expression décrit une sortie armée et hostile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: répondit
  rationale: Dans cet échange, אמר introduit la réponse d’Édom; « répondit » rend naturellement la fonction du verbe dans le contexte.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom masculin singulier renvoie au destinataire de la réponse; « lui » est l’équivalent français naturel.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Nom propre traditionnel de la nation et de son territoire.
- source_word: לֹא תַעֲבֹר
  choice: Tu ne passeras pas
  rationale: L’imparfait qal de עבר exprime ici un refus ferme; le futur français conserve cette force sans archaïsme.
- source_word: בִּי
  choice: par mon territoire
  rationale: Littéralement « par moi » ou « en moi »; puisque la nation personnifiée parle de la traversée de son pays, « par mon territoire » exprime clairement le sens spatial.
- source_word: פֶּן
  choice: sinon
  rationale: Dans cette menace, פן introduit la conséquence d’un passage malgré l’interdiction; « sinon » est idiomatique en français moderne.
- source_word: בַּחֶרֶב
  choice: les armes à la main
  rationale: Littéralement « avec l’épée »; l’expression désigne une intervention armée. La formulation française naturelle garde cette portée tout en signalant le sens littéral en note.
- source_word: אֵצֵא
  choice: je marcherai
  rationale: יצא signifie littéralement « sortir »; dans un contexte militaire, « marcher » vers l’adversaire rend naturellement le mouvement offensif.
- source_word: לִקְרָאתֶךָ
  choice: à ta rencontre
  rationale: La locution signifie formellement « à ta rencontre »; le contexte et la mention de l’épée lui donnent une valeur hostile sans qu’il soit nécessaire de remplacer cette formulation par « contre toi ».
