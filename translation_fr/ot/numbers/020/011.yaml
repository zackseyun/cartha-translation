source:
  edition: WLC
  text: וַ/יָּ֨רֶם מֹשֶׁ֜ה אֶת יָד֗/וֹ וַ/יַּ֧ךְ אֶת הַ/סֶּ֛לַע בְּ/מַטֵּ֖/הוּ פַּעֲמָ֑יִם וַ/יֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַ/תֵּ֥שְׁתְּ הָ/עֵדָ֖ה וּ/בְעִירָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: fr
  text: Alors Moïse leva la main et frappa deux fois le rocher avec son bâton. De l’eau jaillit en abondance, et la communauté but, ainsi que son bétail.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם ... אֶת־יָדוֹ
  choice: leva la main
  rationale: Le hiphil de רום exprime ici l’action de lever. « Leva la main » est direct, naturel et conserve le geste physique du texte hébreu.
- source_word: וַיַּךְ
  choice: frappa
  rationale: נכה signifie frapper. « Frappa » convient au registre narratif moderne et dignifié sans atténuer ni amplifier l’action.
- source_word: הַסֶּלַע
  choice: le rocher
  rationale: סֶלַע désigne une masse rocheuse ou un rocher. « Le rocher » est précis et naturel dans ce contexte.
- source_word: בְּמַטֵּהוּ
  choice: avec son bâton
  rationale: מַטֶּה peut désigner un bâton ou une verge. « Bâton » est le terme courant en français moderne pour l’objet porté par Moïse.
- source_word: פַּעֲמָיִם
  choice: deux fois
  rationale: La forme duelle adverbiale signifie « deux fois » ; cette tournure française est claire et idiomatique.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: De l’eau jaillit en abondance
  rationale: L’expression indique qu’une grande quantité d’eau sortit. « Jaillit en abondance » restitue naturellement le mouvement et la quantité, sans ajouter l’idée d’un miracle au-delà du récit.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: עֵדָה désigne collectivement la communauté assemblée d’Israël. « Communauté » est compréhensible en français international et évite la connotation ecclésiale plus marquée de « congrégation ».
- source_word: וּבְעִירָם
  choice: ainsi que son bétail
  rationale: בְּעִיר désigne collectivement les animaux domestiques. « Bétail » est large, naturel et convient au suffixe renvoyant à la communauté prise comme collectif.
theological_decisions:
- issue: Caractérisation de l’action de Moïse envers le rocher
  choice: Décrire simplement qu’il frappa deux fois le rocher
  alternative: Introduire dans le verset une qualification explicite de désobéissance
  rationale: Le contexte ultérieur évalue l’acte de Moïse, mais ce verset en rapporte sobrement l’action et le résultat. La traduction ne doit pas anticiper cette interprétation dans la formulation même.
translation_notes:
  register: Français moderne, international et narratif, avec un ton digne. La syntaxe reste simple et accessible. « La communauté » est traitée comme un collectif singulier, d’où « son bétail ».
