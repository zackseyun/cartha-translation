  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: fr
  text: Toute la communauté vit qu’Aaron était mort[a], et toute la maison d’Israël[b] pleura Aaron pendant trente jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comprit qu’Aaron était mort » ou « constata qu’Aaron était mort ». L’hébreu dit littéralement « vit qu’Aaron était mort » ; le verbe « voir » peut inclure ici la reconnaissance du fait.
    reason: lexical_alternative
  - marker: b
    text: « Toute la maison d’Israël » est une expression collective qui désigne l’ensemble du peuple d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: vit
  rationale: Le verbe ראה signifie d’abord « voir »; ici, il peut aussi impliquer que la communauté constata ou comprit le fait. « vit » conserve la formulation hébraïque et son ambiguïté.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble de la communauté israélite. « Communauté » est naturel en français moderne et convient au contexte du Pentateuque.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce que la communauté vit ou constata.
- source_word: גָוַע
  choice: était mort
  rationale: גוע est un verbe désignant le fait d’expirer ou de mourir. Après « vit que », l’imparfait exprime naturellement en français l’état résultant constaté, sans surtraduire le verbe.
- source_word: וַיִּבְכּוּ
  choice: pleura
  rationale: בכה signifie « pleurer ». Le singulier s’accorde avec le sujet collectif « toute la maison d’Israël » et conserve la force émotionnelle du texte.
- source_word: אֶת אַהֲרֹן
  choice: Aaron
  rationale: Après « pleurer », le français permet un complément d’objet direct pour désigner la personne dont on déplore la mort.
- source_word: שְׁלֹשִׁים יוֹם
  choice: pendant trente jours
  rationale: L’accusatif hébreu de durée se rend naturellement en français par « pendant trente jours ».
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: Cette traduction conserve l’expression collective et identitaire בֵּית יִשְׂרָאֵל plutôt que de l’aplanir en « tout Israël ».
