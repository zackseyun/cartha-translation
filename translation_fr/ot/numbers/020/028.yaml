    issue: Construction « les fit revêtir à son fils Éléazar »
    rationale: En français, « faire revêtir » demande une construction différente et cette formulation est maladroite. « En revêtit Éléazar, son fils » exprime clairement que Moïse vêtit Éléazar des vêtements retirés à Aaron.
  - severity: low
    issue: Ajout de « donc »
    rationale: Le waw narratif n’impose pas ici une conséquence explicite. L’omission maintient une formulation plus neutre et proche du texte source.
  revised_text: Moïse retira à Aaron ses vêtements et en revêtit Éléazar, son fils[a]. Aaron mourut là, au sommet de la montagne[b]. Puis Moïse et Éléazar descendirent de la montagne.
  revised_footnotes:
