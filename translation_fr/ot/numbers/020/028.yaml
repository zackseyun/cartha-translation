  text: וַ/יַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת אַהֲרֹ֜ן אֶת בְּגָדָ֗י/ו וַ/יַּלְבֵּ֤שׁ אֹתָ/ם֙ אֶת אֶלְעָזָ֣ר בְּנ֔/וֹ וַ/יָּ֧מָת אַהֲרֹ֛ן שָׁ֖ם בְּ/רֹ֣אשׁ הָ/הָ֑ר וַ/יֵּ֧רֶד מֹשֶׁ֛ה וְ/אֶלְעָזָ֖ר מִן הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: fr
  text: Moïse retira à Aaron ses vêtements et en revêtit Éléazar, son fils[a]. Aaron mourut là, au sommet de la montagne[b]. Puis Moïse et Éléazar descendirent de la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit des vêtements sacerdotaux d’Aaron. Leur transfert à Éléazar marque la succession sacerdotale décrite dans le contexte.
    reason: cultural_note
  - marker: b
    text: 'Ou : « en haut de la montagne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: retira … ses vêtements
  rationale: Le hifil de פשט signifie ici enlever les vêtements portés par quelqu’un. « Retira à Aaron ses vêtements » exprime précisément l’action sans la connotation potentiellement humiliante de « dépouilla ».
- source_word: בְּגָדָיו
  choice: ses vêtements
  rationale: בגד est le terme général pour les vêtements. Le contexte indique leur fonction sacerdotale, mais le texte hébreu ne la précise pas dans ce verset.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: les fit revêtir à son fils Éléazar
  rationale: Le hifil de לבש signifie faire porter ou revêtir quelqu’un de vêtements. Cette formulation française conserve le lien explicite avec les vêtements retirés à Aaron et rend clairement la succession père-fils.
- source_word: וַיָּמָת
  choice: mourut
  rationale: מות est le verbe ordinaire « mourir » ; le passé simple convient au registre narratif biblique français tout en restant clair.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe local est conservé explicitement, comme dans l’hébreu.
- source_word: בְּרֹאשׁ הָהָר
  choice: au sommet de la montagne
  rationale: רֹאשׁ signifie littéralement « tête » et, pour un relief, « sommet » ou « haut ». « Au sommet » est naturel et précis en français.
- source_word: וַיֵּרֶד
  choice: descendirent
  rationale: ירד signifie descendre. Le pluriel français s’accorde avec les deux sujets coordonnés, Moïse et Éléazar.
- source_word: מִן הָהָר
  choice: de la montagne
  rationale: La préposition מִן marque ici le point de départ de la descente ; « de la montagne » est la formulation française la plus directe.
theological_decisions:
- issue: Nature des vêtements transmis à Éléazar
  choice: « vêtements » dans le texte principal, avec une note indiquant leur fonction sacerdotale
  alternative: « vêtements sacerdotaux » ou « habits sacerdotaux » dans le texte principal
  rationale: Le contexte décrit la transmission de la charge sacerdotale, mais le verset emploie le nom général בגד. La traduction évite donc d’ajouter dans le corps du texte une précision qui relève du contexte, tout en l’expliquant en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un ton narratif soutenu sans archaïsmes. « Retira » évite la dureté possible de « dépouilla », tandis que « fit revêtir » rend la construction causative de l’hébreu.
