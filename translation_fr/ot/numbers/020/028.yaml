revisions:
- from: Moïse retira donc à Aaron ses vêtements et les fit revêtir à son fils Éléazar[a]. Aaron mourut là, au sommet de la montagne[b]. Puis Moïse et Éléazar descendirent de la montagne.
  to: Moïse retira à Aaron ses vêtements et en revêtit Éléazar, son fils[a]. Aaron mourut là, au sommet de la montagne[b]. Puis Moïse et Éléazar descendirent de la montagne.
  rationale: La révision corrige une tournure française non idiomatique et supprime une inférence connective non exprimée explicitement par l’hébreu. Elle conserve le caractère général de « vêtements » dans le texte principal, tout en maintenant l’explication contextuelle en note.
