language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: fr
  text: Puis les Israélites[a], toute la communauté[b], arrivèrent dans le désert de Tsin au premier mois. Le peuple séjourna à Qadesh. Miriam mourut là et fut enterrée là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël »; on peut aussi traduire « les enfants d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toute l’assemblée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation française naturelle désigne clairement le peuple issu d’Israël, tout en évitant que le calque « les fils d’Israël » soit compris comme ne visant que les hommes. Une note conserve l’accès à la forme littérale de l’hébreu.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble organisé du peuple d’Israël. « Communauté » est courant, collectif et moins marqué religieusement que « congrégation » en français moderne.
- source_word: מִדְבַּר צִן
  choice: le désert de Tsin
  rationale: מִדְבָּר désigne une région aride et inhabitée; « désert » est idiomatique en français dans ce contexte. « Tsin » représente distinctement le nom hébreu צִן.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: au premier mois
  rationale: Rendu direct de l’expression temporelle, sans ajouter le nom du mois, que le texte ne précise pas.
- source_word: וַיֵּשֶׁב
  choice: séjourna
  rationale: Avec « le peuple » pour sujet collectif, « séjourna » exprime une résidence temporaire sans suggérer une installation permanente.
- source_word: הָעָם
  choice: le peuple
  rationale: Équivalent français usuel de עָם lorsqu’il désigne Israël comme collectivité nationale.
- source_word: בְּקָדֵשׁ
  choice: à Qadesh
  rationale: « À » convient naturellement à un lieu nommé; « Qadesh » translittère le nom hébreu tout en restant lisible en français.
- source_word: מִרְיָם
  choice: Miriam
  rationale: Translittération reconnaissable du nom propre hébreu, sans francisation supplémentaire.
- source_word: וַתָּמָת
  choice: mourut
  rationale: Rendu direct et sobre du verbe מות, sans euphémisme.
- source_word: וַתִּקָּבֵר
  choice: fut enterrée
  rationale: Le passif hébreu est conservé, sans introduire des agents que le texte ne nomme pas.
- source_word: שָׁם ... שָׁם
  choice: là ... là
  rationale: La répétition du texte hébreu est maintenue afin de conserver son insistance sur le lieu de la mort et de l’ensevelissement de Miriam.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative reste simple. « Israélites » et « communauté » privilégient la clarté courante, tandis que les notes signalent les principaux équivalents plus formels. La répétition finale « là ... là », légèrement marquée en français, est volontairement conservée pour refléter l’hébreu.
