  terminology: Les noms Aaron et Éléazar sont conformes à l’usage français. « Vêtements » préserve la généralité de בְּגָדָיו, tandis que la note signale sans imposer le contexte sacerdotal. La note sur « sera recueilli » explique l’idiome de mort sans introduire dans le texte principal le complément absent.
