  source_fidelity: 'Le texte français rend fidèlement la séquence des impératifs et la suite annoncée : enlever les vêtements d’Aaron, en revêtir Éléazar, puis l’annonce qu’Aaron « sera recueilli » et mourra là. Il n’ajoute pas « auprès de son peuple / aux siens », absent de l’hébreu de ce verset. Cela corrige implicitement l’expansion injustifiée présente dans la plus récente révision anglaise, tout en respectant la décision lexicale anglaise initiale et le texte source.'
