source:
  edition: WLC
  text: וְ/הַפְשֵׁ֤ט אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/הִלְבַּשְׁתָּ֖/ם אֶת אֶלְעָזָ֣ר בְּנ֑/וֹ וְ/אַהֲרֹ֥ן יֵאָסֵ֖ף וּ/מֵ֥ת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: fr
  text: Retire à Aaron ses vêtements[a] et revêts-en Éléazar, son fils. Aaron sera alors recueilli[b] et mourra là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement d’après le contexte : « ses vêtements sacerdotaux ». L’hébreu dit simplement « ses vêtements ».'
    reason: lexical_alternative
  - marker: b
    text: « Être recueilli » est ici une expression hébraïque liée à la mort. Ailleurs, elle apparaît sous la forme plus complète « être recueilli auprès des siens ».
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט אֶת־אַהֲרֹן אֶת־בְּגָדָיו
  choice: Retire à Aaron ses vêtements
  rationale: Le hiphil impératif de פשט commande d’enlever à quelqu’un ce qu’il porte. Cette formulation est directe et naturelle en français, sans la connotation potentiellement humiliante de « dépouille Aaron ».
- source_word: בְּגָדָיו
  choice: ses vêtements
  rationale: בגד désigne simplement des vêtements. Le contexte indique qu’il s’agit des vêtements sacerdotaux, mais cette précision n’est pas exprimée dans le mot hébreu lui-même et reste donc en note.
- source_word: וְהִלְבַּשְׁתָּם אֶת־אֶלְעָזָר בְּנוֹ
  choice: et revêts-en Éléazar, son fils
  rationale: Le hiphil de לבש signifie ici faire porter les vêtements à Éléazar. « Revêts-en » conserve le renvoi pronominal aux vêtements et exprime avec concision leur transfert.
- source_word: יֵאָסֵף
  choice: sera recueilli
  rationale: Le niphal de אסף est conservé sous la forme d’une image passive liée à la mort. Le complément « auprès des siens » n’apparaît pas dans ce verset et n’est donc pas ajouté au texte principal.
- source_word: וּמֵת שָׁם
  choice: et mourra là
  rationale: La suite verbale exprime le résultat futur de l’ordre donné; « mourra là » rend simplement et directement le verbe et l’adverbe de lieu.
theological_decisions:
- issue: Expression de la mort en יֵאָסֵף
  choice: Conserver l’image par « sera recueilli » sans ajouter de complément.
  alternative: « sera réuni aux siens » ou simplement « mourra »
  rationale: L’hébreu emploie une formule conventionnelle associée à la mort, mais ne contient pas ici le complément « à son peuple / aux siens ». La traduction maintient donc l’image et sa portée possible sans compléter ni réduire le texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Retire à Aaron » évite l’ambiguïté ou la dureté de « dépouille Aaron »; « revêts-en » convient au cadre solennel tout en restant intelligible. L’ordre des mots a été adapté à l’usage naturel du français.
