id: NUM.20.3
reference: Numbers 20:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: fr
  text: 'Le peuple chercha querelle à Moïse et dit[a] : « Ah ! si seulement nous étions morts quand nos frères sont morts devant Yahweh ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ah ! si seulement nous étions morts en même temps que nos frères, devant Yahweh ! »'
    reason: La construction בִּגְוַע peut souligner la concomitance plutôt qu’introduire simplement le moment où les frères sont morts.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: chercha querelle
  rationale: Le verbe ריב exprime ici une contestation hostile. « Chercha querelle » restitue cette force de façon naturelle en français.
- source_word: הָעָם
  choice: le peuple
  rationale: עַם désigne collectivement la communauté israélite ; « le peuple » est le terme français le plus direct.
- source_word: עִם מֹשֶׁה
  choice: à Moïse
  rationale: Avec « chercher querelle », le complément français idiomatique se construit avec « à », tout en rendant l’interaction hostile exprimée par עִם dans ce contexte.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: et dit
  rationale: La formule hébraïque introduit les paroles qui suivent. Le singulier français s’accorde naturellement avec le nom collectif « le peuple » sans reproduire lourdement les deux verbes hébreux.
- source_word: וְלוּ
  choice: Ah ! si seulement
  rationale: La particule exprime un souhait irréalisé chargé de regret. « Ah ! si seulement » en conserve la force émotionnelle dans un français actuel.
- source_word: גָוַעְנוּ … בִּגְוַע
  choice: nous étions morts … sont morts
  rationale: La répétition de « mourir » préserve celle de la racine גוע. Le plus-que-parfait dans le souhait et le passé composé dans la proposition temporelle donnent un français naturel.
- source_word: אַחֵינוּ
  choice: nos frères
  rationale: Le nom est masculin pluriel et désigne vraisemblablement d’autres membres d’Israël morts auparavant. « Nos frères » conserve la forme et le lien communautaire du texte.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant, en présence de ». « Yahweh » représente le nom divin יהוה plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par le titre אֲדֹנָי, tout en restant reconnaissable dans un contexte francophone international.
- issue: Portée de אַחֵינוּ
  choice: nos frères
  alternative: nos proches ; nos frères et sœurs
  rationale: Le masculin pluriel hébreu est conservé sans décider davantage que le texte si le groupe visé comprend uniquement des hommes ou, collectivement, d’autres Israélites.
- issue: Rapport temporel ou circonstanciel exprimé par בִּגְוַע
  choice: quand nos frères sont morts
  alternative: en même temps que nos frères
  rationale: La préposition ב avec l’infinitif construit peut situer l’action dans le temps ou en préciser la circonstance. Le texte principal adopte la lecture temporelle la plus naturelle, tandis que la note conserve la nuance de concomitance.
translation_notes:
  register: Français moderne, digne et accessible. « Chercha querelle » maintient la vigueur du conflit sans tomber dans un registre familier. L’exclamation rend le caractère plaintif du souhait, et la répétition de « morts » reflète la répétition lexicale hébraïque.
