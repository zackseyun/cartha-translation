source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: fr
  text: Moïse fit ce que Yahweh avait ordonné, et ils montèrent au mont Hor sous les yeux de toute la communauté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « sous les yeux de toute la communauté » signifie que la montée eut lieu publiquement, à la vue de tout le peuple assemblé.
    reason: Clarification de l’image idiomatique hébraïque.
lexical_decisions:
- source_word: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה
  choice: Moïse fit ce que […] avait ordonné
  rationale: Cette formulation française exprime naturellement l’obéissance de Moïse tout en conservant le lien direct entre son action et l’ordre divin.
- source_word: וַיַּעֲלוּ
  choice: ils montèrent
  rationale: Le verbe עלה indique un mouvement vers le haut; « montèrent » est concis, naturel et adapté à l’ascension d’une montagne.
- source_word: אֶל הֹר הָהָר
  choice: sur le mont Hor
  rationale: « Le mont Hor » est la forme française naturelle du nom géographique; avec « monter », la préposition « sur » exprime ici la montée sur la montagne.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression conserve l’image hébraïque et souligne que l’action se déroule publiquement, à la vue de tous.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: Dans les Nombres, עֵדָה désigne l’ensemble de la communauté israélite réunie. « Communauté » est clair et actuel, sans connotation ecclésiale indue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin personnel. « Yahweh » le représente directement au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, simple et digne. Le récit reste concis; l’image concrète « sous les yeux de » est conservée, tandis que « toute la communauté » rend עֵדָה de façon accessible.
