source:
  edition: WLC
  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: fr
  text: Ce sont les eaux de Meriba[a], où les fils d’Israël se querellèrent avec Yahweh, et où il se montra saint parmi eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba signifie « contestation » ou « querelle ».
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « et il fut reconnu comme saint en eux » ou « et il se montra saint par eux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: Ce sont
  rationale: Le pronom démonstratif introduit l’identification des eaux; le présent convient naturellement en français à cette formule de désignation.
- source_word: מֵי מְרִיבָה
  choice: les eaux de Meriba
  rationale: Meriba fonctionne ici comme un nom de lieu, tandis que son lien avec l’idée de contestation est indiqué en note.
- source_word: רָבוּ
  choice: contestèrent
  rationale: Le verbe ריב exprime le fait d’entrer en contestation ou en conflit; « contestèrent avec » conserve le lien lexical avec le nom Meriba et reste intelligible.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression rend directement la forme masculine plurielle de l’hébreu et son emploi comme désignation traditionnelle du peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וַיִּקָּדֵשׁ
  choice: il manifesta sa sainteté
  rationale: Le nifal exprime ici que Yahweh se révéla ou fut reconnu comme saint; cette formulation française évite de laisser entendre qu’il aurait été rendu saint par des humains.
- source_word: בָּם
  choice: parmi eux
  rationale: La préposition peut signifier « en eux », « parmi eux » ou, selon l’analyse, « par eux »; « parmi eux » exprime naturellement la sphère humaine dans laquelle sa sainteté fut manifestée.
theological_decisions:
- issue: La manifestation de la sainteté de Yahweh dans la dernière proposition
  choice: il manifesta sa sainteté parmi eux
  alternative: il fut reconnu comme saint en eux / il se montra saint par eux
  rationale: La tournure choisie communique la valeur passive-réflexive du nifal sans suggérer que les Israélites auraient conféré la sainteté à Dieu; une note conserve les autres possibilités syntaxiques.
- issue: Le rendu de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le texte principal maintient la forme masculine du syntagme hébreu sans nier son emploi collectif pour le peuple.
translation_notes:
  register: Français international moderne, digne et lisible. « Contestèrent avec » est légèrement soutenu mais garde le jeu lexical entre ריב et מְרִיבָה. Les deux marqueurs de note figurent dans le texte principal.
