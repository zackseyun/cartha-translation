  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּרְד֤וּ אֲבֹתֵ֨י/נוּ֙ מִצְרַ֔יְמָ/ה וַ/נֵּ֥שֶׁב בְּ/מִצְרַ֖יִם יָמִ֣ים רַבִּ֑ים וַ/יָּרֵ֥עוּ לָ֛/נוּ מִצְרַ֖יִם וְ/לַ/אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: fr
  text: Nos pères sont descendus en Égypte[a], et nous avons habité en Égypte pendant de nombreux jours[b]. Les Égyptiens nous ont fait du mal, ainsi qu’à nos pères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nos ancêtres», ici et à la fin du verset; l’hébreu dit littéralement «nos pères».
    reason: lexical_alternative
  - marker: b
    text: Littéralement «de nombreux jours», expression qui désigne une longue période.
    reason: lexical_alternative
  - marker: c
    text: 'Autres traductions possibles: «ont maltraité nos pères et nous» ou «ont agi avec méchanceté envers nos pères et nous».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: sont descendus
  rationale: Préserve le sens géographique et idiomatique de ירד appliqué au déplacement vers l’Égypte, dans un français biblique naturel.
- source_word: אֲבֹתֵינוּ
  choice: nos pères
  rationale: Rend littéralement le pluriel אָבוֹת et conserve le registre familial et historique; «nos ancêtres» reste une possibilité explicative.
- source_word: מִצְרַיְמָה
  choice: en Égypte
  rationale: Le hé directionnel marque le mouvement vers l’Égypte; avec «descendre», «en Égypte» est la formulation française naturelle.
- source_word: וַנֵּשֶׁב
  choice: nous avons habité
  rationale: ישב désigne ici le fait de résider; «habiter» est actuel, digne et plus précis que «rester».
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: Conserve l’expression hébraïque littérale tout en donnant une syntaxe française fluide; l’idiome désigne une longue période.
- source_word: וַיָּרֵעוּ
  choice: ont fait du mal
  rationale: Le hiphil de רעע exprime le fait de faire du mal ou d’agir mal envers quelqu’un. Cette formulation garde la portée morale assez large du verbe sans la réduire à une forme précise de mauvais traitement.
- source_word: מִצְרַיִם
  choice: les Égyptiens
  rationale: Bien que la forme nomme l’Égypte, l’accord verbal pluriel indique ici ses habitants; le français demande naturellement un sujet personnel.
- source_word: לָנוּ
  choice: nous
  rationale: La préposition ל marque les personnes affectées; «nous ont fait du mal» est l’équivalent idiomatique.
- source_word: וְלַאֲבֹתֵינוּ
  choice: ainsi qu’à nos pères
  rationale: Conserve le second groupe explicitement mentionné dans l’hébreu et sa répétition lexicale, avec une coordination française claire.
theological_decisions: []
