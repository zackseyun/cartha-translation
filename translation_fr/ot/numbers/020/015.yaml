  register: Français international moderne, clair et digne. La traduction maintient «nos pères» et «de nombreux jours» afin de préserver la formulation hébraïque, tout en signalant en notes leurs équivalents idiomatiques. La dernière proposition évite un registre archaïque et conserve la portée générale de רעע.
