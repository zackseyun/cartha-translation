id: NUM.20.5
reference: Numbers 20:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: fr
  text: 'Et pourquoi nous avez-vous fait monter d’Égypte pour nous amener dans ce lieu misérable[a] ? Ce n’est pas un lieu où l’on puisse semer[b] : il n’y a ni figuiers, ni vignes, ni grenadiers, et il n’y a pas d’eau à boire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ce mauvais lieu ». Ici, « mauvais » décrit un endroit pénible ou indésirable, sans nécessairement exprimer un mal moral.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « un lieu de semence »; l’expression peut désigner un endroit où l’on peut semer ou qui produit des céréales et d’autres cultures.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Et pourquoi
  rationale: La conjonction maintient le lien avec la plainte précédente, tandis que l’interrogation est rendue naturellement en français.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: nous avez-vous fait monter d’Égypte
  rationale: Le causatif de עלה est rendu par « faire monter », ce qui préserve l’image biblique de la montée hors d’Égypte.
- source_word: לְהָבִיא אֹתָנוּ
  choice: pour nous amener
  rationale: L’infinitif exprime ici le but attribué à Moïse et Aaron par ceux qui se plaignent.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: dans ce lieu misérable
  rationale: רַע qualifie ici un lieu nuisible, pénible ou indésirable plutôt qu’un mal moral; « misérable » conserve la force de la plainte sans suggérer que le lieu commet le mal.
- source_word: לֹא מְקוֹם זֶרַע
  choice: Ce n’est pas un lieu où l’on puisse semer
  rationale: Littéralement « pas un lieu de semence »; dans ce contexte agricole, l’expression peut désigner un endroit impropre aux semailles, sans exclure entièrement le sens de production céréalière.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: il n’y a ni figuiers, ni vignes, ni grenadiers
  rationale: Les noms singuliers collectifs désignent naturellement en français les plantes ou arbres producteurs, dans une liste des ressources agricoles absentes.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: et il n’y a pas d’eau à boire
  rationale: Rendu idiomatique de la construction existentielle négative suivie de l’infinitif.
theological_decisions: []
