source:
  edition: WLC
  text: וְ/לֹא הָ֥יָה מַ֖יִם לָ/עֵדָ֑ה וַ/יִּקָּ֣הֲל֔וּ עַל מֹשֶׁ֖ה וְ/עַֽל אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: fr
  text: Il n’y avait pas d’eau pour la communauté[a], et ils se rassemblèrent contre Moïse et contre Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assemblée ». Le mot hébreu עֵדָה désigne ici le peuple d’Israël considéré comme un groupe réuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: Il n’y avait pas
  rationale: La construction avec היה et un nom indéfini exprime ici l’existence. Le français « il n’y avait pas » est naturel; la conjonction initiale n’exige pas nécessairement un connecteur distinct dans ce contexte narratif.
- source_word: מַיִם
  choice: d’eau
  rationale: Bien que le mot hébreu ait une forme plurielle, il désigne ici la substance; le français emploie normalement le nom massif « eau ».
- source_word: לָ/עֵדָה
  choice: pour la communauté
  rationale: עֵדָה désigne collectivement le peuple d’Israël. « Communauté » est clair en français moderne et conserve cette portée collective sans connotation confessionnelle marquée.
- source_word: וַ/יִּקָּהֲלוּ
  choice: ils se rassemblèrent
  rationale: Le verbe קהל exprime le fait de se réunir en groupe. La forme pronominale française rend naturellement cette action collective.
- source_word: עַל
  choice: contre
  rationale: Dans le contexte de contestation, la préposition marque une opposition hostile plutôt qu’une simple proximité.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: וְ/עַל אַהֲרֹן
  choice: et contre Aaron
  rationale: La répétition de « contre » reproduit celle de la préposition hébraïque et souligne que l’opposition vise chacun des deux responsables.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit; « communauté » reste accessible et évite la coloration ecclésiale possible de « congrégation ».
