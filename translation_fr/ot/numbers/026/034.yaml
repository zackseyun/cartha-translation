  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: fr
  text: Tels sont les clans de Manassé. Ceux qui furent recensés parmi eux[a] étaient au nombre de 52 700.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux d’entre eux qui furent comptés » ou « leurs hommes recensés ». La formule hébraïque du recensement emploie une forme du verbe פקד, qui désigne ici les personnes comptées ou inscrites.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Cette formule démonstrative introduit naturellement en français le récapitulatif des clans qui précède.
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans le cadre du recensement de Nombres, le terme désigne des subdivisions de parenté au sein de la tribu, et non de simples foyers familiaux.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: וּפְקֻדֵיהֶם
  choice: Ceux qui furent recensés parmi eux
  rationale: Cette expression rend la formule de recensement issue de פקד, maintient le lien avec les clans et n'ajoute pas explicitement « hommes », que l'hébreu laisse ici sous-entendu par le contexte.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 52 700
  rationale: Notation numérique française claire qui conserve exactement le total hébreu de cinquante-deux mille sept cents.
