base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: fr
  text: 'Les fils d’Issacar, selon leurs clans : de Tola, le clan des Tolaïtes ; de Pouva[a], le clan des Pounites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Pouva est écrit « Poua » dans certains passages apparentés et dans certaines traductions.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: Les fils d’Issacar
  rationale: La formule généalogique introduit les lignées issues d’Issacar. « Les fils de » en conserve la forme tout en ayant ici un sens collectif.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce recensement, מִשְׁפָּחָה désigne les subdivisions du groupe tribal ; « clans » est plus précis que « familles ».
- source_word: תּוֹלָע
  choice: Tola
  rationale: Nom propre translittéré ; son sens lexical possible comme nom commun n’est pas pertinent dans ce contexte généalogique.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: le clan des Tolaïtes
  rationale: Le gentilé hébreu désigne le groupe descendant de Tola ; le pluriel français exprime naturellement l’ensemble du clan.
- source_word: לְפֻוָה
  choice: de Pouva
  rationale: Le לְ distributif introduit l’ancêtre de chaque clan. « Pouva » transcrit la forme massorétique פֻוָה de ce verset.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: le clan des Pounites
  rationale: Le gentilé hébreu désigne le clan issu de Pouva ; « Pounites » conserve la consonne n présente dans la forme dérivée hébraïque.
