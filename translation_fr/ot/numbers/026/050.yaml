base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: fr
  text: Voici les clans de Nephtali, selon leurs clans[a] ; ceux qui furent recensés parmi eux étaient au nombre de quarante-cinq mille quatre cents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « répartis selon leurs clans ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Le démonstratif pluriel introduit une formule récapitulative ; « Tels sont » est naturel et digne en français.
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans ce recensement tribal, le terme désigne des subdivisions de parenté étendues plutôt que des familles nucléaires.
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Le préfixe לְ exprime ici le classement ou la répartition selon les clans.
- source_word: וּפְקֻדֵיהֶם
  choice: les hommes recensés parmi eux
  rationale: Dans le contexte explicite du recensement militaire de Nombres 26, la formule renvoie aux hommes comptés ; « parmi eux » rend naturellement le suffixe pronominal sans suggérer une provenance.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: quarante-cinq mille quatre cents
  rationale: Rendu cardinal direct et idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « clans » est conservée parce qu’elle appartient à la formule hébraïque de classement généalogique. Le point-virgule distingue la désignation des clans du total du recensement.
