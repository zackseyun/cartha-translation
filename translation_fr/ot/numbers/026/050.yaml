  source_fidelity: 'Le sens est globalement juste : le verset récapitule les clans de Nephtali et donne le total des personnes dénombrées, soit 45 400. Toutefois, « les hommes recensés » explicite un élément que ce verset ne formule pas lui-même, même si le contexte du recensement concerne les hommes. « Ceux qui furent recensés parmi eux » conserve plus exactement la référence collective du suffixe hébreu.'
