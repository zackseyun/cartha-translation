  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: fr
  text: Et d’Asriel, le clan des Asriélites ; et de Sichem, le clan des Sichémites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: Ashriel
  rationale: Translittération proche de la forme consonantique hébraïque, avec « sh » pour représenter שׂ selon l’usage retenu pour ce nom.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans ce recensement généalogique, le terme désigne une subdivision familiale de la tribu ; « clan » exprime clairement cette réalité sociale.
- source_word: הָאַשְׂרִיאֵלִי
  choice: les Ashriélites
  rationale: Le gentilé hébreu désigne collectivement les descendants d’Ashriel ; la terminaison française « -ites » convient à ce nom de groupe.
- source_word: וְ
  choice: et
  rationale: La conjonction relie simplement les deux entrées de la liste.
- source_word: שֶׁכֶם
  choice: Sichem
  rationale: Forme française biblique courante du nom personnel שֶׁכֶם, qui désigne ici l’ancêtre du clan.
- source_word: הַשִּׁכְמִי
  choice: les Sichémites
  rationale: Gentilé français courant dérivé de Sichem, désignant collectivement ses descendants.
