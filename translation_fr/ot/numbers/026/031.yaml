  register: Français moderne, clair et digne. La formulation fragmentaire avec « d’ » est conservée parce que le verset poursuit directement la liste commencée au verset précédent. Les gentilés prennent une majuscule conformément à l’usage français pour les noms de peuples ou de groupes humains.
