source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: fr
  text: Mais[a] parmi eux, il n’y avait aucun homme de ceux recensés par Moïse et Aaron, le prêtre, qui avaient recensé les fils d’Israël[b] dans le désert du Sinaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et parmi eux » ; la conjonction peut être rendue simplement par « et », mais elle marque probablement ici un contraste avec le verset précédent.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils d’Israël », désignation familiale traditionnelle du peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: Mais parmi eux
  rationale: La conjonction ו peut signifier simplement « et », mais le contexte lui donne vraisemblablement ici une valeur contrastive. « Parmi eux » rend naturellement la préposition בְּ avec le démonstratif.
- source_word: לֹא הָיָה אִישׁ
  choice: il n’y avait aucun homme
  rationale: Cette tournure exprime l’absence de tout individu appartenant au groupe visé; « aucun homme » conserve le singulier masculin et la force de la négation.
- source_word: מִפְּקוּדֵי
  choice: de ceux recensés par
  rationale: Le terme désigne les personnes dénombrées lors du recensement antérieur, et non le recensement comme document abstrait.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: L’hébreu porte seulement « le prêtre »; « le grand prêtre » ajouterait une précision absente du texte.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: qui avaient recensé
  rationale: Le relatif renvoie à Moïse et Aaron comme agents du premier recensement. Le plus-que-parfait situe clairement cette action avant le recensement évoqué dans le contexte immédiat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la désignation familiale traditionnelle de l’hébreu et le caractère masculin du groupe recensé dans ce contexte.
- source_word: בְּמִדְבַּר סִינָי
  choice: dans le désert du Sinaï
  rationale: « Désert du Sinaï » est une expression française courante et fidèle au rapport construit de l’hébreu.
theological_decisions:
- issue: Langage masculin dans אִישׁ et בְּנֵי יִשְׂרָאֵל
  choice: Conserver « homme » et « fils d’Israël » dans le texte principal
  alternative: Employer « personne » et « Israélites » ou « peuple d’Israël »
  rationale: Le verset vise les hommes de la génération masculine recensée auparavant, et l’hébreu emploie des formes masculines. La traduction ne neutralise donc pas cette précision contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure hébraïque tout en employant l’expression idiomatique « il n’y avait aucun homme ». Le relatif pluriel « qui avaient recensé » renvoie à Moïse et Aaron.
