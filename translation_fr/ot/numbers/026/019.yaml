  yaml_path: translation/ot/numbers/026/019.yaml
  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: fr
  text: 'Les fils de Juda : Er et Onân[a]. Mais Er et Onân moururent au pays de Canaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et Er et Onân moururent au pays de Canaan. » La conjonction hébraïque peut se traduire simplement par « et » ; « mais » est retenu dans le texte pour exprimer sa valeur contrastive dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Dans cette liste généalogique, le pluriel construit de בֵּן désigne directement les fils de Juda; cette formulation conserve la précision masculine du texte.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante de ce nom propre biblique.
- source_word: עֵר
  choice: Er
  rationale: Translittération française usuelle du nom propre.
- source_word: וְ/אוֹנָן
  choice: et Onân
  rationale: La conjonction coordonne les deux noms; « Onân » est la forme française usuelle.
- source_word: וַ/יָּמָת
  choice: Mais ... moururent
  rationale: Le verbe indique un événement passé. Le singulier hébreu placé avant un sujet composé se rend naturellement par le pluriel en français; « mais » explicite la valeur contrastive que la conjonction prend ici dans le contexte.
- source_word: בְּ/אֶרֶץ
  choice: au pays de
  rationale: Dans cette expression géographique, « au pays de » est idiomatique en français moderne et correspond au sens de la préposition avec אֶרֶץ.
- source_word: כְּנָעַן
  choice: Canaan
  rationale: Forme française traditionnelle et courante du nom de lieu.
