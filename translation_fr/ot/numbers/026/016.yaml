  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: fr
  text: d’Ozni, le clan des Oznites ; d’Éri, le clan des Érites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְאָזְנִי
  choice: d’Ozni
  rationale: Dans cette formule de recensement, la préposition לְ introduit la lignée issue de l’ancêtre nommé ; « d’Ozni » est naturel en français et conserve ce rapport généalogique.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans le contexte tribal et administratif du recensement, מִשְׁפָּחָה désigne une subdivision de la tribu plus large que la famille nucléaire ; « clan » convient donc mieux que « famille ».
- source_word: הָאָזְנִי
  choice: les Oznites
  rationale: La forme gentilique avec article désigne collectivement les descendants d’Ozni ; le pluriel français « Oznites » rend clairement cette valeur.
- source_word: לְעֵרִי
  choice: d’Éri
  rationale: Comme dans le premier membre, לְ introduit ici la lignée généalogique rattachée à Éri.
- source_word: הָעֵרִי
  choice: les Érites
  rationale: La forme gentilique avec article désigne collectivement les descendants d’Éri ; « Érites » en donne un équivalent français naturel.
