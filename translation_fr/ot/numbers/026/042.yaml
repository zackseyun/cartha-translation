base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: fr
  text: 'Voici les fils de Dan[a], selon leurs clans : de Shouham, le clan des Shouhamites. Tels sont les clans de Dan, selon leurs clans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils de Dan » ; dans cette formule de recensement généalogique, « fils » peut désigner les descendants de Dan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici / Tels sont
  rationale: Le démonstratif hébreu introduit puis récapitule la liste du recensement. Ces formulations françaises gardent cette fonction sans ajouter un passé absent de l’hébreu.
- source_word: בְנֵי דָן
  choice: les fils de Dan
  rationale: La traduction conserve le sens formel de בְּנֵי, tout en signalant en note que, dans cette formule tribale, le terme peut désigner plus largement les descendants.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans / selon leurs familles
  rationale: מִשְׁפָּחָה désigne ici les subdivisions généalogiques de la tribu. « Clans » est précis dans l’introduction; « familles » dans la récapitulation restitue la répétition hébraïque sans produire l’expression française maladroite « les clans… selon leurs clans ».
- source_word: לְשׁוּחָם
  choice: de Shouham
  rationale: Dans cette formule généalogique, la préposition לְ introduit la lignée rattachée à son ancêtre éponyme.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: le clan des Shouhamites
  rationale: Le gentilé singulier a une valeur collective et désigne le clan issu de Shouham.
- source_word: מִשְׁפְּחֹת דָּן
  choice: les clans de Dan
  rationale: Cette formulation rend directement la récapitulation tribale et maintient la terminologie du recensement.
