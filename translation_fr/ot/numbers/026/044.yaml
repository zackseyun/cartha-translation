source:
  edition: WLC
  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: fr
  text: 'Les fils d’Aser, selon leurs clans : d’Imna, le clan des Imnites ; d’Ishvi, le clan des Ishvites ; de Beria, le clan des Beriites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Les fils d’Aser
  rationale: « Fils » conserve la formule généalogique de l’hébreu, tandis que la forme française traditionnelle et naturelle du nom est « Aser ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre du recensement de Nombres, מִשְׁפָּחָה désigne une subdivision du groupe tribal plus large que la famille nucléaire ; « clan » est donc précis et naturel.
- source_word: לְיִמְנָה
  choice: d’Imna
  rationale: La préposition ל introduit ici l’ancêtre dont procède le clan ; « de » rend naturellement cette relation généalogique.
- source_word: מִשְׁפַּחַת הַיִּמְנָה
  choice: le clan des Imnites
  rationale: La forme hébraïque est un gentilé désignant les membres du clan issu d’Imna ; « Imnites » reproduit cette fonction.
- source_word: לְיִשְׁוִי
  choice: d’Ishvi
  rationale: Le nom propre יִשְׁוִי est translittéré au plus près de sa forme consonantique massorétique.
- source_word: מִשְׁפַּחַת הַיִּשְׁוִי
  choice: le clan des Ishvites
  rationale: Le gentilé hébreu dérivé d’Ishvi est rendu par un nom collectif français en « -ites ».
- source_word: לִבְרִיעָה
  choice: de Beria
  rationale: Comme dans les deux membres précédents, ל marque ici la relation du clan à son ancêtre éponyme.
- source_word: מִשְׁפַּחַת הַבְּרִיעִי
  choice: le clan des Beriites
  rationale: « Beriites » suit directement le gentilé hébreu בְּרִיעִי plutôt que de le reformer à partir du nom français Beria.
