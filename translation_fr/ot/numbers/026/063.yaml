  text: אֵ֚לֶּה פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן אֲשֶׁ֨ר פָּֽקְד֜וּ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: fr
  text: Voici ceux que Moïse et le prêtre Éléazar recensèrent, eux qui recensèrent les fils d’Israël dans les plaines de Moab, près du Jourdain, en face de Jéricho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « près du Jourdain, à la hauteur de Jéricho » ou « au bord du Jourdain, près de Jéricho ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: ceux que … recensèrent
  rationale: Le terme désigne ici les personnes enregistrées lors du recensement. La tournure personnelle « ceux que … recensèrent » restitue le construit hébreu et demeure naturelle en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: L’hébreu porte simplement « le prêtre » ; « le grand prêtre » ajouterait un titre absent du texte.
- source_word: פָּקְדוּ
  choice: recensèrent
  rationale: Dans ce contexte de dénombrement national, « recenser » est précis et permet de conserver le lien lexical avec פְּקוּדֵי.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression généalogique et masculine de l’hébreu, pertinente dans le cadre tribal du chapitre.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: « Les plaines de Moab » est l’équivalent géographique consacré, clair et naturel en français moderne.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: près du Jourdain, en face de Jéricho
  rationale: La formulation rend la localisation au bord du Jourdain par rapport à Jéricho. « En face de Jéricho » explicite sobrement la relation géographique suggérée par le contexte.
theological_decisions:
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation retenue préserve la présentation généalogique et tribale du texte sans neutraliser son expression masculine.
- issue: Titre d’Éléazar
  choice: le prêtre
  alternative: le grand prêtre
  rationale: Le titre n’est pas développé au-delà de ce que dit l’hébreu, même si la fonction d’Éléazar est connue par le contexte.
- issue: Relation géographique entre le Jourdain et Jéricho
  choice: près du Jourdain, en face de Jéricho
  alternative: près du Jourdain, à Jéricho
  rationale: La traduction choisie évite de situer les plaines de Moab dans Jéricho même et rend leur position relative sur l’autre rive.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La répétition de « recensèrent » reflète la répétition de la racine hébraïque פקד.
