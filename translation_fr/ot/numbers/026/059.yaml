    issue: Le pronom « elle » dans « qu’elle avait mise au monde » est référentiellement trompeur.
    rationale: En français, son antécédent naturel est Jokébed, sujet de la proposition principale, alors que l’hébreu laisse la femme qui a enfanté Jokébed non identifiée. La traduction doit éviter de résoudre cette ambiguïté en faisant de Jokébed sa propre mère.
