  naturalness: « Qui était née de Lévi en Égypte » est idiomatique, clair et d’un registre approprié. « Miriam » est conservé, conformément au choix de transcription déjà retenu dans le projet, et l’apposition « leur sœur Miriam » est naturelle.
  terminology: « Jokébed », « Lévi », « Aaron » et « Moïse » conviennent. « Fille de Lévi » conserve délibérément la formulation généalogique du texte sans la transformer en « descendante ».
  issues:
