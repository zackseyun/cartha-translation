  text: וְ/שֵׁ֣ם אֵ֣שֶׁת עַמְרָ֗ם יוֹכֶ֨בֶד֙ בַּת לֵוִ֔י אֲשֶׁ֨ר יָלְדָ֥ה אֹתָ֛/הּ לְ/לֵוִ֖י בְּ/מִצְרָ֑יִם וַ/תֵּ֣לֶד לְ/עַמְרָ֗ם אֶֽת אַהֲרֹן֙ וְ/אֶת מֹשֶׁ֔ה וְ/אֵ֖ת מִרְיָ֥ם אֲחֹתָֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: fr
  text: Le nom de la femme d’Amram était Jokébed, fille de Lévi[a], qui était née de Lévi en Égypte[b]. Elle donna à Amram Aaron, Moïse et leur sœur Miriam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fille de Lévi ». Dans les généalogies, « fille » peut parfois désigner plus largement une descendante.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qu’elle mit au monde pour Lévi en Égypte » ; le sujet féminin du verbe n’est pas identifié.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: Le nom de la femme d’Amram
  rationale: La chaîne construite exprime « le nom de la femme d’Amram »; l’omission du ו initial est naturelle en français sans perdre la fonction introductive.
- source_word: יוֹכֶבֶד
  choice: Jokébed
  rationale: Transcription française usuelle du nom hébreu.
- source_word: בַּת לֵוִי
  choice: fille de Lévi
  rationale: Rend directement le texte hébreu sans résoudre par paraphrase la question de savoir si « fille » désigne ici une fille immédiate ou, plus largement, une descendante.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: qu’elle avait mise au monde pour Lévi en Égypte
  rationale: Préserve le verbe actif féminin et le pronom objet féminin de l’hébreu, ainsi que le fait que l’identité de la mère demeure implicite.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: Elle donna à Amram
  rationale: Expression française naturelle dans un registre généalogique; elle conserve la relation marquée par לְ avec Amram, sans la lourdeur de « elle enfanta pour Amram ».
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה וְאֵת מִרְיָם אֲחֹתָם
  choice: Aaron, Moïse et leur sœur Miriam
  rationale: Les marqueurs d’objet ne se traduisent pas; la dernière apposition est réordonnée légèrement pour obtenir un français idiomatique tout en maintenant que Miriam est leur sœur.
theological_decisions:
- issue: Portée généalogique de בַּת לֵוִי (« fille de Lévi »)
  choice: Conserver « fille de Lévi » dans le texte principal.
  alternative: « descendante de Lévi »
  rationale: La formulation littérale préserve la tension chronologique et généalogique du texte au lieu de la résoudre silencieusement.
- issue: Sujet implicite de « elle avait mise au monde »
  choice: Maintenir le féminin singulier sans identifier la femme.
  alternative: 'Employer le passif : « qui était née de Lévi en Égypte »'
  rationale: L’hébreu présente un verbe actif féminin dont le sujet n’est pas nommé; la traduction conserve cette ambiguïté plutôt que de l’effacer.
translation_notes:
  register: Français moderne, international et digne. La syntaxe généalogique reste concise. « Jokébed » et « Moïse » suivent l’usage français courant; « Miriam » conserve une transcription proche de l’hébreu. Les deux appels de note [a] et [b] figurent dans le texte principal.
