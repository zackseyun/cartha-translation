base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: fr
  text: 'À partir de vingt ans et au-dessus[a], comme Yahweh[b] l’avait ordonné à Moïse. Les Israélites[c] qui étaient sortis du pays d’Égypte étaient les suivants :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis un fils de vingt ans et au-dessus », formule hébraïque signifiant « âgé de vingt ans ou plus ».'
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: c
    text: 'Hébreu : « les fils d’Israël », nom collectif désignant ici les Israélites. La syntaxe peut aussi rattacher ce groupe à l’ordre mentionné dans la proposition précédente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: À partir de vingt ans
  rationale: Cette formule hébraïque fixe un seuil d’âge. La tournure française est naturelle et reprend, dans le contexte, les personnes âgées de vingt ans ou plus.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: comme … l’avait ordonné
  rationale: כַּאֲשֶׁר introduit la conformité au commandement antérieur, et le plus-que-parfait français explicite naturellement son antériorité dans le récit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa forme dans le texte source.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Le verbe français « ordonner » se construit naturellement avec un complément indirect désignant la personne qui reçoit l’ordre; אֶת marque Moïse comme objet en hébreu.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Les Israélites
  rationale: L’expression littérale « fils d’Israël » fonctionne ici comme nom collectif du peuple; « les Israélites » est le terme moderne usuel.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: qui étaient sortis du pays d’Égypte
  rationale: Le participe désigne la génération de l’exode. Le plus-que-parfait situe naturellement cette sortie avant le recensement raconté.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve sans le remplacer par le titre traditionnel.
- issue: Rapport syntaxique entre Moïse et les Israélites
  choice: Clore la phrase après « Moïse » et faire des Israélites le sujet de la liste qui suit
  alternative: Comprendre que Yahweh a donné l’ordre à Moïse et aux Israélites
  rationale: La marque d’objet אֶת ne précède que Moïse, tandis que « les Israélites qui étaient sortis… » ouvre naturellement l’énumération généalogique du verset suivant. Cette lecture évite d’attribuer sans nécessité le commandement aux deux groupes.
translation_notes:
  register: Français international moderne, sobre et digne. Les guillemets signalent que le seuil d’âge reprend l’ordre de recensement formulé au verset précédent. « Étaient les suivants » et les deux-points rendent explicite l’ellipse hébraïque qui introduit la liste à partir du verset 5.
