  text: וַ/יָּ֥מָת נָדָ֖ב וַ/אֲבִיה֑וּא בְּ/הַקְרִיבָ֥/ם אֵשׁ זָרָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: fr
  text: Mais Nadab et Abihou moururent lorsqu’ils présentèrent à Yahweh un feu non autorisé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un feu étranger »; on peut aussi traduire : « un feu étrange ». Dans ce contexte, il s’agit d’un feu qui n’était pas autorisé pour être présenté devant Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: moururent
  rationale: Le verbe hébreu singulier précède un sujet composé, construction courante en hébreu. Le français exige ici le pluriel.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadab et Abihou
  rationale: Les noms propres suivent leurs formes françaises bibliques usuelles.
- source_word: בְּהַקְרִיבָם
  choice: lorsqu’ils présentèrent
  rationale: La préposition ב avec l’infinitif construit et le suffixe a ici une valeur temporelle. « Présenter » convient au contexte cultuel sans préciser au-delà du texte la nature exacte du geste.
- source_word: אֵשׁ זָרָה
  choice: un feu non autorisé
  rationale: Dans ce contexte cultuel, זָרָה désigne un feu qui n’était pas permis ou prescrit. Cette formulation est claire en français moderne tout en conservant en note la traduction plus littérale.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי se rend naturellement par « devant » dans ce contexte cultuel, et le tétragramme est transcrit « Yahweh ».
- source_word: וַ
  choice: Mais
  rationale: La conjonction introduit ici une remarque qui fait contraste avec le relevé généalogique environnant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom divin plutôt que de lui substituer un titre.
- issue: Nature du « feu étranger »
  choice: non autorisé
  alternative: étranger / étrange
  rationale: Le contexte indique un feu impropre au service cultuel, mais le texte de ce verset n’en précise pas davantage la faute; la note conserve les équivalents plus littéraux sans développer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Feu non autorisé » privilégie la clarté, tandis que la note préserve la formulation hébraïque plus littérale.
