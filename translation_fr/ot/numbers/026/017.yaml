  text: לַ/אֲר֕וֹד מִשְׁפַּ֖חַת הָ/אֲרוֹדִ֑י לְ/אַ֨רְאֵלִ֔י מִשְׁפַּ֖חַת הָ/אַרְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/017.yaml
  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: fr
  text: 'D’Arod : le clan des Arodites ; d’Aréli : le clan des Arélites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: D’Arod
  rationale: Dans cette formule de recensement, la préposition ל introduit l’ancêtre éponyme dont est issu le clan. « D’Arod » exprime naturellement cette relation en français tout en conservant la structure répétitive.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans le contexte tribal et généalogique de Nombres 26, מִשְׁפָּחָה désigne une subdivision de parenté au sein d’une tribu ; « clan » est précis, naturel et digne en français moderne.
- source_word: הָאֲרוֹדִי
  choice: les Arodites
  rationale: La forme gentilice avec article désigne collectivement les descendants d’Arod ; le pluriel français « Arodites » rend clairement ce nom de groupe.
- source_word: לְאַרְאֵלִי
  choice: d’Areli
  rationale: Comme dans le premier membre, ל introduit l’ancêtre éponyme. « D’Areli » maintient le parallélisme de la formule.
- source_word: הָאַרְאֵלִי
  choice: les Arélites
  rationale: La forme gentilice désigne le groupe issu d’Areli. « Arélites », avec accent conformément à la prononciation française naturelle, distingue aussi clairement le nom du clan de celui de l’ancêtre.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. La formulation nominale et le parallélisme reproduisent le style du recensement, tandis que « d’ » explicite naturellement la filiation sans exclure la lecture plus formelle signalée en note.
