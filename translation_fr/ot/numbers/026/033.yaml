  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: fr
  text: 'Tselofhad, fils de Héfer, n’avait pas de fils[a], mais seulement des filles. Les filles de Tselofhad s’appelaient : Mahla, Noa[b], Hogla, Milka et Tirtsa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « il n’y avait pas pour lui de fils, sauf des filles ».'
    reason: lexical_alternative
  - marker: b
    text: Noa est ici le nom d’une fille de Tselofhad; il ne s’agit pas de Noé, le personnage du récit du déluge.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד
  choice: Tselofhad
  rationale: Le nom propre est translittéré selon une forme française moderne; la conjonction initiale assure ici la continuité du discours et n’exige pas nécessairement un « et » en tête de phrase.
- source_word: בֶּן חֵפֶר
  choice: fils de Héfer
  rationale: Cette formulation rend directement et naturellement la relation généalogique.
- source_word: לֹא הָיוּ לֹו בָּנִים
  choice: n’avait pas de fils
  rationale: Littéralement, « il n’y avait pas pour lui de fils »; la tournure possessive française est idiomatique et conserve le contraste sexué avec les filles.
- source_word: כִּי אִם בָּנוֹת
  choice: mais seulement des filles
  rationale: 'La construction marque l’exception et le contraste : il avait des filles, mais aucun fils.'
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: Les filles de Tselofhad s’appelaient
  rationale: Cette tournure française naturelle rend le sens collectif du singulier hébreu שֵׁם devant le groupe pluriel.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milka et Tirtsa
  rationale: Les noms sont translittérés sous des formes adaptées aux conventions phonétiques et orthographiques françaises, sans les assimiler à d’autres personnages bibliques.
theological_decisions: []
