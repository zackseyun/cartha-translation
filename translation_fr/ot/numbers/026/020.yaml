  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ בְנֵי יְהוּדָה֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שֵׁלָ֗ה מִשְׁפַּ֨חַת֙ הַ/שֵּׁ֣לָנִ֔י לְ/פֶ֕רֶץ מִשְׁפַּ֖חַת הַ/פַּרְצִ֑י לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: fr
  text: 'Les descendants[a] de Juda, selon leurs clans, étaient : de Shéla, le clan des Shélanites ; de Pérets[b], le clan des Péretsites ; de Zérah, le clan des Zérahites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils » ; dans ce recensement, l’expression désigne les descendants de Juda par la lignée masculine, répartis en clans.'
    reason: lexical_alternative
  - marker: b
    text: Certaines traductions françaises de tradition ancienne emploient « Pharès » ; « Pérets » suit plus directement l’hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: Dans cette formule de recensement, le verbe introduit simplement la liste des clans ; « étaient » restitue naturellement cette fonction.
- source_word: בְנֵי יְהוּדָה
  choice: Les descendants de Juda
  rationale: Littéralement « les fils de Juda » ; dans ce contexte généalogique et censitaire, l’expression désigne les descendants de Juda par la lignée masculine. « Descendants » évite de faire croire qu’il s’agit uniquement de ses fils immédiats.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici les groupes familiaux internes à la tribu ; « clans » est plus précis que « familles » dans le contexte du recensement.
- source_word: לְשֵׁלָה
  choice: de Shéla
  rationale: La préposition introduit ici l’ancêtre dont procède le clan ; « de » convient à la structure énumérative française.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: le clan des Shélanites
  rationale: Cette formulation conserve à la fois la notion de clan et le gentilé dérivé du nom de Shéla.
- source_word: לְפֶרֶץ / מִשְׁפַּחַת הַפַּרְצִי
  choice: de Pérets, le clan des Péretsites
  rationale: « Pérets » suit directement l’hébreu פֶרֶץ ; « Péretsites » rend le gentilé correspondant tout en gardant visible son lien avec le nom de l’ancêtre.
- source_word: לְזֶרַח / מִשְׁפַּחַת הַזַּרְחִי
  choice: de Zérah, le clan des Zérahites
  rationale: « Zérah » transcrit directement le nom hébreu, et « Zérahites » rend de façon cohérente le gentilé dérivé.
