  text: לְ/יָשׁ֕וּב מִשְׁפַּ֖חַת הַ/יָּשׁוּבִ֑י לְ/שִׁמְרֹ֕ן מִשְׁפַּ֖חַת הַ/שִּׁמְרֹנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: fr
  text: de Yashoub, le clan des Yashoubites ; de Shimron, le clan des Shimronites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: de Yashoub
  rationale: Dans cette liste de recensement, la préposition לְ devant le nom propre introduit l’ancêtre éponyme dont le clan tire son nom. « de Yashoub » rend naturellement cette relation en français.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans le contexte tribal et administratif du recensement, מִשְׁפָּחָה désigne une subdivision de la tribu fondée sur la parenté. « clan » est ici plus précis que « famille ».
- source_word: הַ/יָּשׁוּבִי
  choice: Yashoubites
  rationale: La forme gentilice désigne les descendants constituant le clan issu de Yashoub. « Yashoubites » conserve clairement le lien avec le nom de l’ancêtre.
- source_word: לְ/שִׁמְרֹן
  choice: de Shimron
  rationale: Comme dans le premier membre, לְ introduit l’ancêtre éponyme. La répétition de « de » respecte la structure formulaire de l’hébreu.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Le même terme et la même fonction syntaxique se répètent ; une traduction identique préserve le parallélisme de la liste.
- source_word: הַ/שִּׁמְרֹנִי
  choice: Shimronites
  rationale: La forme gentilice désigne les membres du clan descendant de Shimron. « Shimronites » est une formation française claire et concise.
