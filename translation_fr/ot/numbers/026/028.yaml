  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: fr
  text: 'Les fils de Joseph, selon leurs clans : Manassé et Éphraïm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן désigne ici les fils de Joseph et, dans ce cadre de recensement, les lignées tribales issues d’eux. « Les fils de » conserve la formulation généalogique de l’hébreu.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans l’organisation tribale et le recensement, מִשְׁפָּחָה désigne un clan plutôt que la famille nucléaire moderne. La préposition לְ exprime ici le classement ou la répartition selon ces clans.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וְאֶפְרָיִם
  choice: et Éphraïm
  rationale: La conjonction coordonne simplement les deux fils et branches tribales de Joseph; les accents français suivent l’usage biblique courant.
theological_decisions: []
translation_notes:
  register: Formulation brève, digne et naturelle, adaptée à une rubrique de recensement. « Clans » rend clairement la structure sociale et tribale sans suggérer la seule famille nucléaire. La tournure « selon leurs clans » reste proche de la construction hébraïque.
