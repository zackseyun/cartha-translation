  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: fr
  text: 'Faites le recensement de toute la communauté des fils d’Israël[a], selon leurs maisons paternelles, à partir de l’âge de vingt ans : tous ceux d’Israël qui sont en âge de porter les armes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Relevez la tête de toute la communauté des fils d’Israël. » Cette expression signifie ici « faire le recensement » ou « compter ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous ceux qui sortent pour le service militaire en Israël ». Cette expression désigne ceux qui relèvent du service militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: Faites le recensement
  rationale: L’expression signifie littéralement « relever la tête », mais constitue ici un idiome désignant le dénombrement de la population.
- source_word: כָּל־עֲדַת
  choice: toute la communauté
  rationale: « Communauté » rend naturellement עֵדָה comme collectivité d’Israël, tout en conservant son caractère communautaire formel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation familiale masculine de l’hébreu est conservée, ce qui convient également au contexte d’un recensement militaire.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Cette formulation restitue clairement le seuil d’âge tout en restant proche de la tournure hébraïque.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: La traduction préserve l’organisation sociale et généalogique désignée par la « maison du père ».
- source_word: כָּל־יֹצֵא צָבָא
  choice: tous ceux qui ... partent à la guerre
  rationale: La formulation suit de près l’expression hébraïque « sortir pour l’armée/la guerre » sans expliciter davantage l’aptitude ou l’obligation militaire.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition est rendue simplement et naturellement dans son sens social ou collectif.
theological_decisions:
- issue: Expression genrée et familiale בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le masculin familial du texte source est maintenu plutôt que neutralisé, particulièrement dans ce contexte de mobilisation militaire.
- issue: Portée de כָּל־יֹצֵא צָבָא
  choice: tous ceux qui, en Israël, partent à la guerre
  alternative: tout homme apte au service militaire en Israël
  rationale: Le choix conserve la formulation active et l’ambiguïté relative de l’hébreu, sans ajouter explicitement la notion d’aptitude.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la structure d’un ordre de recensement, tandis que les termes « fils d’Israël » et « maisons paternelles » préservent les catégories familiales et sociales du texte hébreu.
