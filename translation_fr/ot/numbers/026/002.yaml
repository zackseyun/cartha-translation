  to: 'Faites le recensement de toute la communauté des fils d’Israël[a], selon leurs maisons paternelles, à partir de l’âge de vingt ans : tous ceux d’Israël qui sont en âge de porter les armes[b].'
  rationale: La révision remplace une formulation d’âge non idiomatique et une expression susceptible de décrire un départ guerrier effectif par des formulations françaises naturelles qui correspondent à la fonction militaire de l’expression hébraïque. Les deux ancres de notes sont conservées et la note b est réalignée sur le texte révisé.
