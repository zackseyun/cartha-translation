    issue: « partent à la guerre » peut évoquer un départ effectif au combat.
    rationale: Le participe hébreu yōṣēʾ ṣābāʾ est une désignation conventionnelle de ceux qui relèvent du service militaire. Une expression française d’éligibilité est plus exacte dans le cadre d’un recensement.
  - severity: low
    issue: « depuis l’âge de vingt ans et au-dessus » est maladroit.
    rationale: La formule associe deux constructions concurrentes. « À partir de l’âge de vingt ans » exprime naturellement le seuil inclusif et la suite de l’âge.
