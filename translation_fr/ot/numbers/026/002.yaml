  verdict: revise
  source_fidelity: La formule idiomatique נשׂא את־ראש est bien rendue par « Faites le recensement ». La portée militaire de כָּל־יֹצֵא צָבָא désigne une catégorie soumise au service militaire, plutôt que des personnes actuellement en train de partir combattre. « En âge de porter les armes » rend cette fonction de manière idiomatique sans introduire une doctrine ou une interprétation étrangère au texte.
  naturalness: « Depuis l’âge de vingt ans et au-dessus » n’est pas idiomatique en français moderne. La révision emploie « à partir de l’âge de vingt ans » et clarifie, par une ponctuation plus naturelle, que le recensement vise la catégorie militaire.
  terminology: « Communauté », « fils d’Israël » et « maisons paternelles » préservent les catégories collectives et familiales de l’hébreu. « En âge de porter les armes » est une expression française établie pour l’éligibilité militaire dans ce contexte.
