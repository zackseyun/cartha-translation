  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: fr
  text: 'Les fils de Gad, selon leurs clans : de Tsefon[a], le clan des Tsefonites ; de Haggi, le clan des Haggites ; de Shouni, le clan des Shounites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Genèse 46.16 donne la forme « Tsifyôn » (et, par conséquent, « Tsifyônites » dans certaines traditions). Le texte massorétique de ce verset porte « Tsefon » (צפון) ; cette forme est donc conservée dans le texte.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: Les fils de Gad
  rationale: Conserve l’expression généalogique hébraïque qui présente les lignées issues de l’ancêtre tribal Gad.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte de recensement, מִשְׁפָּחָה désigne une subdivision clanique de la tribu ; « selon leurs clans » rend naturellement le principe de classement.
- source_word: לִצְפוֹן
  choice: de Tsefon
  rationale: Le לְ de cette formule généalogique introduit l’ancêtre dont procède le clan. « De » rend cette relation avec concision.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: le clan des Tsefonites
  rationale: Le terme gentilique désigne collectivement les membres du clan issu de Tsefon. La graphie suit le texte massorétique de ce verset.
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  choice: de Haggi, le clan des Haggites
  rationale: Reproduit le parallélisme de la formule hébraïque en distinguant l’ancêtre du nom collectif de son clan.
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  choice: de Shouni, le clan des Shounites
  rationale: La translittération « Shouni » rend שׁוּנִי de façon lisible en français, tandis que « Shounites » exprime le gentilé collectif.
