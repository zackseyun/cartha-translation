  text: אַךְ בְּ/גוֹרָ֕ל יֵחָלֵ֖ק אֶת הָ/אָ֑רֶץ לִ/שְׁמ֥וֹת מַטּוֹת אֲבֹתָ֖/ם יִנְחָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: fr
  text: Le pays sera partagé uniquement par tirage au sort ; ils recevront leur héritage selon les noms des tribus de leurs pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs ancêtres ». L’hébreu dit littéralement « leurs pères » et renvoie aux lignées paternelles au sein des tribus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: uniquement
  rationale: 'La particule a ici une valeur restrictive : elle précise que le partage doit se faire exclusivement par tirage au sort.'
- source_word: בְּגוֹרָל
  choice: par tirage au sort
  rationale: Cette formulation française naturelle exprime le moyen d’attribution désigné par גוֹרָל.
- source_word: יֵחָלֵק
  choice: sera partagé
  rationale: Le nifal exprime ici le passif ; le futur français convient à la prescription dans son contexte.
- source_word: אֶת הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire que les Israélites doivent recevoir. « Le pays » est idiomatique et n’ajoute aucune précision absente du texte.
- source_word: לִשְׁמוֹת
  choice: selon les noms de
  rationale: La préposition ל indique ici la référence ou le critère selon lequel l’héritage est attribué.
- source_word: מַטּוֹת
  choice: tribus
  rationale: Bien que le nom puisse désigner un bâton, il renvoie ici sans ambiguïté aux groupements tribaux.
- source_word: אֲבֹתָם
  choice: leurs pères
  rationale: Le texte hébreu emploie explicitement le terme masculin et évoque les lignées paternelles des tribus ; la traduction le conserve.
- source_word: יִנְחָלוּ
  choice: ils recevront leur héritage
  rationale: Cette expression rend naturellement en français le sens de recevoir une terre en héritage, tout en maintenant la distinction avec le partage mentionné dans la première proposition.
theological_decisions:
- issue: Terminologie ancestrale genrée dans אֲבֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Dans ce contexte d’héritage tribal, l’hébreu désigne précisément les pères et les lignées paternelles. La formulation principale préserve cette donnée au lieu de la neutraliser.
translation_notes:
  register: Français international moderne, clair et digne. « Tirage au sort » est plus naturel que le calque « par le sort ». Le point-virgule conserve le lien étroit entre le mode de partage et le principe d’héritage.
