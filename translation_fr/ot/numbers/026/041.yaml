- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: « Clans » correspond ici aux grands groupes familiaux recensés et évite l’ambiguïté moderne de « familles ».
- source_word: וּפְקֻדֵיהֶם
  choice: Les hommes recensés parmi eux
  rationale: Le participe passif substantivé désigne ceux qui ont été comptés lors du recensement; « parmi eux » rend l’appartenance au groupe sans suggérer que tous les fils nommés individuellement furent comptés.
