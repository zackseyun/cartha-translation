source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: fr
  text: 'Fils d’Éliab : Nemouel, Datan et Abiram. Ce sont Datan et Abiram, les appelés de la communauté[a], qui s’opposèrent à Moïse et à Aaron au sein du groupe de Coré, lorsqu’ils s’opposèrent à Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les hommes choisis de la communauté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: Fils d’Éliab
  rationale: Dans cette liste généalogique, בְּנֵי désigne les fils mâles nommément recensés. En français, l’absence de « et » en tête de verset rend naturellement la reprise d’une liste.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: Il s’agit de Datan et d’Abiram, ceux-là mêmes
  rationale: Le singulier הוּא a ici une fonction d’identification et de reprise. Cette formulation française conserve l’insistance démonstrative sans produire l’accord artificiel « ce sont ce Datan et cet Abiram ».
- source_word: קרואי העדה
  choice: qui étaient convoqués parmi la communauté
  rationale: Le participe passif de קרא garde son sens de personnes appelées ou convoquées, tandis que « parmi la communauté » évite de trancher trop fortement si la communauté les convoquait ou s’ils en étaient les représentants reconnus.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël. « Communauté » est courant, digne et moins marqué religieusement que « congrégation » en français international.
- source_word: הִצּוּ / בְּהַצֹּתָם
  choice: se dressèrent / lorsqu’ils se dressèrent
  rationale: Le verbe נצה exprime ici une opposition active et conflictuelle. La répétition française reflète celle de la même racine hébraïque.
- source_word: בַּעֲדַת קֹרַח
  choice: au sein du groupe de Coré
  rationale: La formule indique leur association avec Coré et ses partisans. « Groupe » est idiomatique et n’introduit pas l’idée d’une congrégation institutionnelle distincte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. Le conserver sous forme translittérée distingue le nom divin d’un simple titre.
- issue: Statut exprimé par קרואי העדה
  choice: qui étaient convoqués parmi la communauté
  alternative: les hommes choisis de la communauté
  rationale: L’hébreu peut évoquer des hommes appelés, convoqués ou reconnus comme représentants. Le texte principal reste proche de la forme lexicale, tandis que la note conserve l’interprétation plus institutionnelle.
translation_notes:
  register: 'Français international moderne, clair et digne. Les noms propres suivent les formes françaises bibliques usuelles : Éliab, Nemouel, Datan, Moïse et Coré. La syntaxe évite un calque maladroit du pronom hébreu singulier tout en gardant son effet d’identification.'
