revisions:
- from: 'Fils d’Éliab : Nemouel, Datan et Abiram. Il s’agit de Datan et d’Abiram, ceux-là mêmes qui étaient convoqués parmi la communauté[a] et qui se dressèrent contre Moïse et Aaron au sein du groupe de Coré, lorsqu’ils se dressèrent contre Yahweh.'
  to: 'Fils d’Éliab : Nemouel, Datan et Abiram. Ce sont Datan et Abiram, les appelés de la communauté[a], qui s’opposèrent à Moïse et à Aaron au sein du groupe de Coré, lorsqu’ils s’opposèrent à Yahweh.'
  rationale: La correction remplace une paraphrase restrictive de קרואי העדה par « les appelés de la communauté », qui rend le participe passif substantivé et préserve l’ambiguïté entre personnes appelées, reconnues ou désignées par la communauté. La note conserve l’interprétation « hommes choisis » attestée par l’audit anglais. Aucune autre modification de sens n’est apportée.
