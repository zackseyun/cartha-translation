review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour קרואי העדה : « convoqués parmi la communauté » ajoute l’idée spatiale de « parmi » et réduit indûment le participe à une convocation. « les appelés de la communauté » conserve la construction nominale et son ambiguïté quant à leur statut. Le reste rend correctement la liste, l’identification emphatique, l’opposition à Moïse, Aaron et Yahweh, ainsi que l’association avec Coré.'
  naturalness: La formulation révisée reste claire en français biblique moderne. « Les appelés de la communauté » est plus idiomatique et précis que « étaient convoqués parmi la communauté », tout en gardant une sobriété compatible avec une notice généalogique.
  terminology: Les formes Éliab, Nemouel, Datan, Abiram, Moïse et Coré sont cohérentes avec l’usage biblique français. « Communauté » convient pour עֵדָה ; « Yahweh » reproduit le nom divin selon la politique fournie. La note maintient l’alternative interprétative sans l’imposer au texte.
  issues:
  - severity: medium
    issue: « qui étaient convoqués parmi la communauté » pour קרואי העדה
    rationale: Le participe passif suivi du complément en construit signifie littéralement des personnes « appelées de/de la communauté ». « Convoqués » limite le sens à un acte ponctuel, tandis que « parmi » introduit une relation spatiale ou partitive absente du texte et évite artificiellement la relation exprimée par le construit.
  revised_text: 'Fils d’Éliab : Nemouel, Datan et Abiram. Ce sont Datan et Abiram, les appelés de la communauté[a], qui s’opposèrent à Moïse et à Aaron au sein du groupe de Coré, lorsqu’ils s’opposèrent à Yahweh.'
