lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Le démonstratif pluriel introduit ici le récapitulatif du recensement; « Tels sont » rend naturellement en français cette proposition nominale présentative.
- source_word: מִשְׁפְּחֹת
  choice: les clans
  rationale: Dans ce contexte tribal et généalogique, le terme désigne les subdivisions de parenté au sein d'une tribu; « clans » est plus précis que « familles ».
- source_word: הַשִּׁמְעֹנִי
  choice: des Siméonites
  rationale: Le gentilé singulier avec article a un sens collectif et désigne ici l'ensemble tribal issu de Siméon; le pluriel français est idiomatique.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: vingt-deux mille deux cents
  rationale: Rendu français standard du total du recensement, soit 22 200.
