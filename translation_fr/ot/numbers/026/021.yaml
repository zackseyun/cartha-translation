  text: וַ/יִּהְי֣וּ בְנֵי פֶ֔רֶץ לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרֹנִ֑י לְ/חָמ֕וּל מִשְׁפַּ֖חַת הֶ/חָמוּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: fr
  text: 'Les fils de Pérets étaient Hetsron et Hamoul : d’Hetsron, le clan des Hetsronites ; de Hamoul, le clan des Hamoulites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: Dans cette formule généalogique de recensement, היה sert de copule pour introduire les fils et les clans qui leur correspondent ; « étaient » est naturel et fidèle.
- source_word: בְנֵי
  choice: les fils de
  rationale: Le contexte présente les fils immédiats de Pérets comme chefs de lignées ; « fils » conserve la forme et la précision de l’hébreu.
- source_word: פֶרֶץ
  choice: Pérets
  rationale: Translittération française moderne du nom hébreu פֶרֶץ, distincte des formes anciennes issues d’autres traditions.
- source_word: לְחֶצְרֹן
  choice: de Hetsron
  rationale: Dans cette formule de recensement, לְ introduit la personne dont le clan est issu ; « de » rend sobrement ce rapport d’appartenance et de descendance.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans les recensements des Nombres, מִשְׁפָּחָה désigne une subdivision de parenté au sein d’une tribu ; « clan » convient mieux que « famille » à cette unité collective.
- source_word: הַחֶצְרֹנִי
  choice: les Hetsronites
  rationale: La forme gentilice désigne collectivement les descendants de Hetsron ; le pluriel français en « -ites » est clair et conventionnel.
- source_word: לְחָמוּל
  choice: de Hamoul
  rationale: Comme pour Hetsron, לְ marque ici le rattachement généalogique du clan à Hamoul.
- source_word: הֶחָמוּלִי
  choice: les Hamoulites
  rationale: La forme gentilice désigne le groupe issu de Hamoul ; « Hamoulites » en donne un équivalent collectif naturel.
theological_decisions: []
