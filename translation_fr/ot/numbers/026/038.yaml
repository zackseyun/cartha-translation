source:
  edition: WLC
  text: בְּנֵ֣י בִנְיָמִן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/בֶ֗לַע מִשְׁפַּ֨חַת֙ הַ/בַּלְעִ֔י לְ/אַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽ/אַשְׁבֵּלִ֑י לַ/אֲחִירָ֕ם מִשְׁפַּ֖חַת הָ/אֲחִירָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: fr
  text: 'Les fils de Benjamin, selon leurs clans : de Béla, le clan des Bélaïtes ; d’Ashbel, le clan des Ashbélites ; d’Ahiram[a], le clan des Ahiramites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le texte massorétique, le nom est Ahiram ; certaines traditions textuelles et certaines versions portent « Ahiam ». Le texte principal suit ici la lecture hébraïque.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: Les fils de Benjamin
  rationale: בְּנֵי signifie littéralement « fils de ». Dans ce recensement généalogique, l’expression peut inclure les descendants, mais la formulation retenue préserve la structure formelle de l’hébreu et reste naturelle en français.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision clanique de la tribu. « Selon leurs clans » rend clairement la formule de classement du recensement.
- source_word: לְבֶלַע
  choice: de Béla
  rationale: Le préfixe לְ introduit ici la lignée issue de l’ancêtre nommé. En français, « de Béla » exprime naturellement cette relation généalogique.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: le clan des Bélaïtes
  rationale: La forme gentilique הַבַּלְעִי désigne les membres du clan issu de Béla. « Bélaïtes » reproduit clairement ce nom de groupe.
- source_word: לְאַשְׁבֵּל
  choice: d’Ashbel
  rationale: Comme dans les autres éléments de la liste, le préfixe לְ marque la lignée rattachée à l’ancêtre nommé.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: le clan des Ashbélites
  rationale: Le gentilé hébreu désigne le groupe descendant d’Ashbel ; « Ashbélites » en donne une forme française lisible et cohérente.
- source_word: לַאֲחִירָם
  choice: d’Ahiram
  rationale: Le texte massorétique porte אֲחִירָם, rendu par « Ahiram ». Le préfixe לְ est traduit comme dans les deux lignées précédentes.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: le clan des Ahiramites
  rationale: La forme gentilique dérivée d’Ahiram est rendue par le pluriel français « Ahiramites », parallèlement aux autres noms de clans.
