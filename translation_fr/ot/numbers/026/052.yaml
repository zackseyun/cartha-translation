lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … parla
  rationale: Le wayyiqtol fait avancer le récit. « Alors » marque naturellement la progression narrative, tandis que « parla » conserve le verbe de parole de la formule hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « parler à quelqu’un » est la tournure française naturelle.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le contenu de la parole qui suit. « En ces termes » remplit naturellement cette fonction en français et évite le calque pesant « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. Le rendre par « Yahweh » conserve le nom propre et évite de le remplacer silencieusement par un titre traditionnel.
translation_notes:
  register: Français international moderne, sobre et digne. La formule introductive reste nettement perceptible sans reproduire servilement la syntaxe hébraïque.
