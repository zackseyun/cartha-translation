  text: לָ/אֵ֗לֶּה תֵּחָלֵ֥ק הָ/אָ֛רֶץ בְּ/נַחֲלָ֖ה בְּ/מִסְפַּ֥ר שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: fr
  text: C’est entre ceux-là que le pays sera partagé en héritage, selon le nombre des noms[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon le nombre de personnes » ; littéralement, « selon le nombre des noms ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: entre ceux-là
  rationale: Dans le contexte d’un partage territorial entre les groupes recensés, le ל indique les bénéficiaires de la répartition. « Entre ceux-là » est naturel en français et rend clairement la distribution, sans préciser davantage leur identité.
- source_word: תֵּחָלֵק
  choice: sera partagé
  rationale: 'Le nifal inaccompli de חלק exprime ici une action passive prescrite ou future : le pays doit être réparti. « Sera partagé » conserve la forme passive et convient au contexte.'
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans le contexte de l’attribution de Canaan aux tribus, « le pays » est une traduction française courante et naturelle de הָאָרֶץ.
- source_word: בְּנַחֲלָה
  choice: en héritage
  rationale: נַחֲלָה désigne un bien reçu en héritage ou une possession attribuée. « En héritage » préserve de façon concise ses dimensions juridique et patrimoniale.
- source_word: בְּמִסְפַּר
  choice: selon le nombre de
  rationale: La préposition ב marque ici la norme ou la mesure qui règle le partage. « Selon le nombre de » rend directement cette fonction.
- source_word: שֵׁמוֹת
  choice: noms
  rationale: Le texte hébreu dit littéralement « noms ». Le maintien de cette formulation conserve l’expression du recensement, tandis que la note explique qu’elle désigne les personnes comptées.
