source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֤ת בְּנֵי אֶפְרַ֨יִם֙ לִ/פְקֻ֣דֵי/הֶ֔ם שְׁנַ֧יִם וּ/שְׁלֹשִׁ֛ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת אֵ֥לֶּה בְנֵי יוֹסֵ֖ף לְ/מִשְׁפְּחֹתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: fr
  text: 'Voici les clans des fils d’Éphraïm, d’après leur recensement : trente-deux mille cinq cents[a]. Tels sont les fils de Joseph, selon leurs clans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’après leur nombre » ou « selon ceux d’entre eux qui furent recensés ». L’hébreu emploie ici le vocabulaire de l’enregistrement effectué lors d’un recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans ce contexte de recensement tribal, le terme désigne des subdivisions de parenté au sein de la tribu. « Clans » est plus précis que « familles » en français moderne.
- source_word: בְּנֵי אֶפְרַיִם
  choice: fils d’Éphraïm
  rationale: Cette formulation conserve l’expression généalogique hébraïque tout en restant naturelle et intelligible en français.
- source_word: לִפְקֻדֵיהֶם
  choice: d’après leur recensement
  rationale: Le terme appartient au vocabulaire du dénombrement et de l’enregistrement. Cette traduction rend le sens administratif sans la lourdeur d’une formulation littérale telle que « d’après ceux d’entre eux qui furent dénombrés ».
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: trente-deux mille cinq cents
  rationale: Le total exact est exprimé selon l’ordre usuel des nombres en français contemporain.
- source_word: בְנֵי יוֹסֵף
  choice: fils de Joseph
  rationale: La formule généalogique est conservée afin de maintenir le lien explicite établi par le texte entre Éphraïm et Joseph.
- source_word: לְמִשְׁפְחֹתָם
  choice: selon leurs clans
  rationale: Cette traduction reprend de manière cohérente le sens de מִשְׁפָּחָה comme subdivision tribale de parenté.
