  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: fr
  text: Les hommes recensés[b] parmi les fils d’Israël[a] étaient au nombre de six cent un mille sept cent trente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites » ou « les enfants d’Israël ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui ont été comptés » ; l’hébreu désigne les personnes enregistrées lors du recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: étaient au nombre de
  rationale: La proposition hébraïque est nominale et introduit le total du recensement. Cette tournure française exprime naturellement le rapport entre les personnes recensées et le chiffre donné.
- source_word: פְּקוּדֵי
  choice: les hommes recensés
  rationale: Dans le contexte de Nombres 26, le terme désigne les personnes enregistrées dans un recensement portant sur les hommes aptes au service; « recensés » conserve cette nuance concrète.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: « Fils d’Israël » préserve l’expression familiale de l’hébreu, tandis que « parmi » produit une relation idiomatique avec « hommes recensés ».
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: six cent un mille sept cent trente
  rationale: Rendu numérique exact de 601 730, formulé selon l’usage cardinal français.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix principal maintient l’expression familiale littérale sans la réduire à un simple ethnonyme; une note fournit l’équivalent collectif courant.
- issue: Sens de פְּקוּדֵי dans le contexte du recensement
  choice: les hommes recensés
  alternative: ceux qui ont été comptés
  rationale: Le contexte immédiat est celui d’un recensement des hommes. Le rendu désigne donc des personnes enregistrées plutôt qu’un total abstrait, sans ajouter une qualification militaire au texte du verset.
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite une construction nominale trop abrupte en employant « étaient au nombre de », tout en conservant les personnes recensées comme sujet. Le nombre est écrit en toutes lettres conformément au style narratif biblique.
