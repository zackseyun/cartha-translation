id: NUM.26.54
reference: Numbers 26:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/רַ֗ב תַּרְבֶּה֙ נַחֲלָת֔/וֹ וְ/לַ/מְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑/וֹ אִ֚ישׁ לְ/פִ֣י פְקֻדָ֔י/ו יֻתַּ֖ן נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: fr
  text: Au groupe le plus nombreux, tu attribueras un héritage plus grand, et au groupe le moins nombreux, un héritage plus petit. À chacun, son héritage sera donné en proportion de son effectif recensé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «selon ses recensés». L’expression peut aussi se rendre par «selon le nombre de ceux qui ont été recensés pour lui».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: au groupe le plus nombreux
  rationale: Dans le contexte du recensement et du partage du pays, l’adjectif substantivé désigne la collectivité ayant l’effectif le plus élevé.
- source_word: תַּרְבֶּה נַחֲלָתוֹ
  choice: tu attribueras un héritage plus grand
  rationale: Le causatif de רבה demande d’augmenter la part attribuée. Cette formulation française exprime naturellement la proportion sans suggérer qu’un héritage déjà reçu serait ensuite agrandi.
- source_word: וְלַמְעַט תַּמְעִיט נַחֲלָתוֹ
  choice: et au groupe le moins nombreux, un héritage plus petit
  rationale: Le parallélisme hébreu oppose la collectivité nombreuse à celle de faible effectif; l’ellipse du verbe en français allège la phrase tout en conservant l’instruction.
- source_word: נַחֲלָה
  choice: héritage
  rationale: Le terme désigne ici la possession territoriale attribuée à titre d’héritage; «héritage» maintient sa portée juridique et théologique habituelle.
- source_word: אִישׁ
  choice: à chacun
  rationale: Le masculin singulier a ici une valeur distributive. «À chacun» conserve cette distribution sans faire croire que le verset traite de parcelles remises à chaque homme individuellement plutôt qu’aux groupes recensés.
- source_word: לְפִי פְקֻדָיו
  choice: en proportion de son effectif recensé
  rationale: L’expression concise relie directement la taille de l’héritage au nombre des personnes recensées qui relèvent de chaque groupe.
- source_word: יֻתַּן
  choice: sera donné
  rationale: Le passif de נתן est rendu formellement, tout en restant naturel dans le contexte du partage.
theological_decisions:
- issue: Le bénéficiaire individuel ou collectif de l’héritage
  choice: Comprendre אִישׁ distributivement de chaque groupe recensé, sans effacer la forme singulière du texte
  alternative: Comprendre le verset comme l’attribution d’un héritage personnel à chaque homme recensé
  rationale: Le contraste entre le groupe nombreux et le groupe peu nombreux, ainsi que le partage tribal annoncé dans le contexte, indique une distribution proportionnelle entre collectivités. La formulation «à chacun» préserve néanmoins la concision distributive de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La répétition d’«héritage» conserve le terme structurant du texte; «effectif recensé» rend idiomatiquement la formule hébraïque concise, tandis que la note en indique la forme plus littérale.
