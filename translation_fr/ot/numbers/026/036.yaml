  yaml_path: translation/ot/numbers/026/036.yaml
  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: fr
  text: 'Et voici les fils de Shoutélah[a] : d’Éran, le clan des Éranites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils de » est une formule généalogique qui peut désigner des descendants ou des branches claniques, et non uniquement des fils directs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Voici
  rationale: Dans une liste généalogique, « Voici » introduit naturellement l’élément suivant tout en reflétant la fonction présentative de la conjonction et du démonstratif.
- source_word: בְּנֵי
  choice: les descendants de
  rationale: Bien que le terme signifie formellement « fils de », il fonctionne ici comme une désignation généalogique englobant une lignée; « descendants » évite de suggérer plusieurs fils immédiats alors qu’un seul rameau clanique est nommé.
- source_word: שׁוּתָלַח
  choice: Shoutélah
  rationale: Translittération française claire du nom hébreu, avec « ou » pour /u/ et accents facilitant la prononciation.
- source_word: לְ/עֵרָן
  choice: d’Éran
  rationale: Le préfixe לְ introduit ici le membre ou rameau de la subdivision recensée; « d’Éran » exprime naturellement en français l’appartenance généalogique.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans le recensement de Nombres, le mot désigne une subdivision de parenté au sein de la tribu; « clan » est plus précis que « famille » dans ce contexte.
- source_word: הָ/עֵרָנִי
  choice: Éranites
  rationale: La forme patronymique désigne collectivement les membres du clan issu d’Éran; le pluriel français en « -ites » rend clairement ce gentilé.
