  text: אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד אִיעֶ֕זֶר מִשְׁפַּ֖חַת הָ/אִֽיעֶזְרִ֑י לְ/חֵ֕לֶק מִשְׁפַּ֖חַת הַֽ/חֶלְקִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: fr
  text: 'Voici les fils de Galaad[a] : d’Iézer, le clan des Iézérites ; de Hélek, le clan des Hélékites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, l’expression « fils de Galaad » peut désigner ses descendants par la lignée masculine ou les clans issus de lui, et pas seulement ses fils immédiats.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Le démonstratif hébreu, dépourvu de temps verbal, introduit ici une liste. « Voici » convient naturellement au registre généalogique et évite d’ajouter un passé absent du texte.
- source_word: בְּנֵי גִלְעָד
  choice: les fils de Galaad
  rationale: Cette formulation conserve l’expression généalogique formelle de l’hébreu. Dans ce recensement, « fils » peut désigner plus largement les descendants masculins ou les branches issues de Galaad, précision maintenue en note.
- source_word: אִיעֶזֶר
  choice: Yézer
  rationale: Le nom propre est translittéré sous une forme lisible en français moderne, avec Y pour le yod initial et des accents facilitant la prononciation.
- source_word: מִשְׁפַּחַת
  choice: le clan de
  rationale: Dans Nombres 26, le terme désigne une subdivision d’une tribu. « Clan » est plus précis que « famille » dans ce contexte de recensement.
- source_word: הָאִיעֶזְרִי
  choice: les Yézerites
  rationale: La forme gentilice désigne les membres du clan issu de Yézer ; le suffixe français « -ites » rend clairement cette appartenance.
- source_word: לְחֵלֶק
  choice: de Hélek
  rationale: Dans cette formule répétitive du recensement, la préposition לְ introduit le descendant ou fondateur de clan suivant. « De » reproduit naturellement la structure elliptique en français.
- source_word: הַחֶלְקִי
  choice: les Hélékites
  rationale: La forme gentilice issue de Hélek est rendue par un nom de groupe français en « -ites », de manière parallèle à « Yézerites ».
