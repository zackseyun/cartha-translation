  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן אֹתָ֖/ם בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: fr
  text: 'Moïse et le prêtre Éléazar leur parlèrent dans les plaines de Moab, près du Jourdain, en face de Jéricho[a]. Ils dirent :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « près du Jourdain, à la hauteur de Jéricho » ou « près du Jourdain de Jéricho ».'
    reason: La relation géographique exprimée par עַל יַרְדֵּן יְרֵחוֹ est concise et peut se comprendre comme « en face de Jéricho », « à la hauteur de Jéricho » ou, plus littéralement, « au Jourdain de Jéricho ».
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parlèrent
  rationale: Le verbe introduit ici un discours direct. Le pluriel français s’accorde naturellement avec le sujet composé « Moïse et le prêtre Éléazar ».
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  choice: Moïse et le prêtre Éléazar
  rationale: Les formes françaises usuelles des noms sont retenues, et « le prêtre » reste le titre d’Éléazar sans ajouter « grand prêtre », absent de l’hébreu.
- source_word: אֹתָם
  choice: leur
  rationale: Le suffixe désigne les destinataires; « leur parlèrent » est idiomatique en français.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: « Plaines » rend de façon claire la région plate ou steppique désignée par עֲרָבוֹת et conserve l’expression géographique habituelle.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: près du Jourdain, en face de Jéricho
  rationale: La formule situe les plaines de Moab le long du Jourdain, vis-à-vis de Jéricho. La virgule clarifie les deux rapports géographiques sans identifier Jéricho à un lieu situé directement sur le fleuve.
- source_word: לֵאמֹר
  choice: 'Ils dirent :'
  rationale: L’infinitif hébreu introduit les paroles qui suivent. Une nouvelle proposition est plus naturelle que le calque « en disant » après « leur parlèrent », tout en conservant la fonction discursive.
