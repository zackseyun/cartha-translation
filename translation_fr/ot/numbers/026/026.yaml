source:
  edition: WLC
  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: fr
  text: 'Les fils de Zabulon, selon leurs clans : de Séred, le clan des Sardites ; d’Élon, le clan des Élonites ; de Yahléel, le clan des Yahléélites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: Les fils de Zabulon
  rationale: La traduction conserve l’expression généalogique hébraïque « fils de », qui désigne ici les descendants tribaux de Zabulon sans rendre explicite ce que le contexte suffit à indiquer.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le contexte du recensement, מִשְׁפָּחָה désigne une subdivision du groupe tribal plutôt que la seule famille nucléaire ; « selon » rend naturellement la valeur distributive de לְ.
- source_word: לְסֶרֶד
  choice: de Séred
  rationale: Dans cette formule de liste, לְ introduit l’ancêtre dont procède le clan ; « de » exprime naturellement cette filiation.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: le clan des Sardites
  rationale: Le gentilé hébreu désigne collectivement les membres du clan issu de Séred. La forme « Sardites » suit directement la vocalisation du gentilé hébreu.
- source_word: לְאֵלֹון / מִשְׁפַּחַת הָאֵלֹנִי
  choice: d’Élon, le clan des Élonites
  rationale: Le nom propre est translittéré selon l’usage français, et son gentilé est rendu par un pluriel collectif naturel.
- source_word: לְיַחְלְאֵל / מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: de Yahléel, le clan des Yahléélites
  rationale: La translittération française par Y rend le yod initial ; le gentilé correspondant est formé de manière transparente et cohérente avec le nom.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétitive du relevé censitaire est maintenue, avec « clan » pour la précision sociale et « fils » pour préserver l’idiome généalogique hébreu.
