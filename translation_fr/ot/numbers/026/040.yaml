base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: fr
  text: Les fils de Béla étaient Ard et Naaman. D’Ard vient le clan des Ardites, et de Naaman, le clan des Naamanites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: Le verbe ouvre une notice généalogique et s’intègre naturellement en français à la formulation « Les fils de Béla étaient… ».
- source_word: בְנֵי
  choice: les fils de
  rationale: Cette traduction directe conserve le registre généalogique et la relation masculine exprimée par le texte.
- source_word: בֶלַע
  choice: Béla
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: אַרְדְּ
  choice: Ard
  rationale: Le nom propre est conservé sous une forme française transparente.
- source_word: וְנַעֲמָן
  choice: et Naaman
  rationale: Le nom propre est translittéré et la conjonction est maintenue.
- source_word: מִשְׁפַּחַת
  choice: le clan de / le clan des
  rationale: Dans le contexte du recensement tribal, le terme désigne une unité de parenté plus vaste que la famille proche; « clan » est précis et naturel.
- source_word: הָאַרְדִּי
  choice: les Ardites
  rationale: Le gentilé hébreu désigne collectivement les membres du clan issu d’Ard; le pluriel français exprime naturellement cette affiliation.
- source_word: לְנַעֲמָן
  choice: de Naaman
  rationale: La préposition introduit ici l’ancêtre auquel le clan se rattache; la construction parallèle « de Naaman » rend clairement la filiation.
- source_word: הַנַּעֲמִי
  choice: les Naamanites
  rationale: Le gentilé français est formé de façon transparente sur Naaman et désigne le groupe qui en descend.
