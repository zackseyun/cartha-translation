  text: בְּנֵ֣י מְנַשֶּׁ֗ה לְ/מָכִיר֙ מִשְׁפַּ֣חַת הַ/מָּכִירִ֔י וּ/מָכִ֖יר הוֹלִ֣יד אֶת גִּלְעָ֑ד לְ/גִלְעָ֕ד מִשְׁפַּ֖חַת הַ/גִּלְעָדִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: fr
  text: 'Les fils de Manassé : de Makir, le clan des Makirites ; Makir engendra Galaad ; de Galaad, le clan des Galaadites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Les fils de Manassé
  rationale: Rend littéralement la formule généalogique tout en laissant le contexte du recensement lui donner le sens plus large de descendants.
- source_word: לְמָכִיר
  choice: de Makir
  rationale: Dans cette formule de recensement, le préfixe לְ introduit la branche généalogique à laquelle appartient le clan mentionné.
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: le clan des Makirites
  rationale: « Clan » exprime la subdivision tribale désignée par מִשְׁפָּחָה, et le gentilé hébreu est naturellement rendu au pluriel collectif.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: Makir engendra Galaad
  rationale: « Engendra » conserve le sens généalogique précis du hifil de ילד dans un registre biblique digne et intelligible.
- source_word: לְגִלְעָד
  choice: de Galaad
  rationale: Le préfixe לְ reprend la même formule généalogique que pour Makir et introduit la branche de Galaad.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: le clan des Galaadites
  rationale: « Clan » convient au cadre tribal du recensement ; le gentilé est rendu par le pluriel collectif français traditionnel.
