  text: To Aaron were born Nadab and Abihu[a], Eleazar and Ithamar.
translation:
  language: fr
  text: Aaron eut pour fils Nadab, Abihou, Éléazar et Itamar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « À Aaron naquit Nadab, Abihou, Éléazar et Itamar » ; dans cette formule généalogique, le verbe est au singulier bien qu’il introduise une liste de plusieurs noms.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: naquirent
  rationale: Le nifal de ילד exprime ici le fait d’être né. Bien que le verbe hébreu soit morphologiquement au singulier dans cette formule généalogique, le pluriel français s’accorde naturellement avec la liste des quatre fils.
- source_word: לְאַהֲרֹן
  choice: À Aaron
  rationale: La préposition ל désigne le parent auquel les fils sont nés. La tournure « À Aaron naquirent… » conserve la structure généalogique de l’hébreu sans la transformer en proposition active comme « Aaron engendra ».
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: '[marques de l’objet direct non rendues séparément]'
  rationale: Les occurrences répétées de אֶת introduisent les noms dans la liste et n’ont pas d’équivalent lexical direct en français.
- source_word: נָדָב
  choice: Nadab
  rationale: Forme française biblique courante du nom propre.
- source_word: אֲבִיהוּא
  choice: Abihou
  rationale: Forme française biblique courante du nom propre.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Forme française biblique courante du nom propre, avec l’accentuation graphique française.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Translittération française courante du nom propre.
