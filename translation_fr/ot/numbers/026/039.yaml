  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: fr
  text: De Shoufam, le clan des Shoufamites ; de Houfam, le clan des Houfamites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: De Shoufam
  rationale: Dans cette formule de recensement, le préfixe ל indique l’appartenance ou la descendance ; « de » est l’équivalent français naturel. Le nom שְׁפוּפָם est translittéré « Shoufam » selon sa forme dans le texte massorétique.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans le contexte tribal et censitaire, מִשְׁפָּחָה désigne une subdivision de parenté ; « clan » est précis et naturel en français moderne.
- source_word: הַשּׁוּפָמִי
  choice: Shoufamites
  rationale: La forme gentilique avec article désigne collectivement les membres du clan issu de Shoufam ; le pluriel français en « -ites » rend clairement cette valeur.
- source_word: לְחוּפָם
  choice: de Houfam
  rationale: Comme dans le premier membre, ל introduit ici le groupe rattaché à l’ancêtre nommé. חוּפָם est translittéré « Houfam ».
- source_word: הַחוּפָמִי
  choice: Houfamites
  rationale: La forme gentilique désigne collectivement le clan descendant de Houfam ; « Houfamites » conserve le parallélisme de la formule.
