source:
  edition: WLC
  text: וַ/תִּפְתַּ֨ח הָ/אָ֜רֶץ אֶת פִּ֗י/הָ וַ/תִּבְלַ֥ע אֹתָ֛/ם וְ/אֶת קֹ֖רַח בְּ/מ֣וֹת הָ/עֵדָ֑ה בַּ/אֲכֹ֣ל הָ/אֵ֗שׁ אֵ֣ת חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ וַ/יִּהְי֖וּ לְ/נֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: fr
  text: La terre ouvrit sa bouche et les engloutit, eux et Coré[a], lorsque la communauté mourut, lorsque le feu dévora les deux cent cinquante hommes; et ils devinrent un signe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit explicitement «eux et Coré». Ce verset présente ainsi le jugement; voir le récit plus développé en Nombres 16.
    reason: cross_reference
  - marker: b
    text: Ou «un signal». Dans ce contexte, le signe peut avoir valeur d’avertissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: La terre ouvrit sa bouche
  rationale: אֶרֶץ peut désigner la terre ou le pays; ici, l’image du sol qui s’ouvre favorise «terre». La mention de la bouche conserve la personnification concrète de l’hébreu.
- source_word: וַתִּבְלַע
  choice: engloutit
  rationale: בלע signifie avaler ou engloutir. «Engloutit» est naturel en français pour la terre qui absorbe des personnes et garde l’image concrète.
- source_word: אֹתָם וְאֶת־קֹרַח
  choice: les engloutit, eux et Coré
  rationale: L’hébreu coordonne explicitement «eux» et «Coré». Cette formulation conserve cette syntaxe sans harmoniser le verset avec le récit plus large.
- source_word: בְּמוֹת הָעֵדָה
  choice: lorsque la communauté mourut
  rationale: La préposition ב avec l’infinitif construit exprime ici le temps. «Communauté» rend עֵדָה dans un français actuel tout en laissant au groupe son caractère collectif.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: lorsque le feu dévora
  rationale: אכל signifie littéralement manger; avec le feu pour sujet, «dévorer» est une image française naturelle qui reste proche de la métaphore hébraïque.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: les deux cent cinquante hommes
  rationale: Le nombre et le nom sont rendus directement. «Hommes» respecte la référence masculine de אִישׁ.
- source_word: וַיִּהְיוּ לְנֵס
  choice: ils devinrent un signe
  rationale: נֵס peut désigner un signe, un signal ou un étendard. «Signe» préserve la portée lexicale et l’ambiguïté de la fonction sans ajouter explicitement l’idée d’avertissement.
theological_decisions:
- issue: Référent du pluriel final («ils devinrent un signe»)
  choice: Conserver le pronom pluriel sans identifier plus précisément son antécédent.
  alternative: Préciser qu’il s’agit des deux cent cinquante hommes, de l’ensemble des rebelles ou de l’événement du jugement.
  rationale: Le pluriel hébreu permet plusieurs rattachements. La traduction maintient cette ambiguïté au lieu de la résoudre.
- issue: Rapport de Coré à l’engloutissement dans ce verset
  choice: Maintenir «eux et Coré» dans la proposition régie par «engloutit».
  alternative: Dissocier Coré de ceux que la terre engloutit afin d’harmoniser ce verset avec d’autres détails du récit.
  rationale: La syntaxe immédiate inclut explicitement Coré. La traduction suit le texte de ce verset sans importer une harmonisation narrative.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La ponctuation garde les deux propositions temporelles successives de l’hébreu; l’ambiguïté du pronom final est préservée.
