  terminology: « Terre », « engloutit », « communauté », « feu », « hommes » et « signe » conviennent au sens des termes sources. « Coré » est la forme française biblique usuelle. Le choix de « signe », plutôt que « signe d’avertissement », préserve la latitude lexicale de נֵס; la note indique sobrement la valeur contextuelle possible.
