translation:
  language: fr
  text: de Hetsron[a], le clan des Hetsronites ; de Karmi, le clan des Karmites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour Hetsron […] pour Karmi » ; la préposition hébraïque peut se traduire plus littéralement ainsi, mais, dans cette formule de recensement, elle indique l’appartenance généalogique ou la descendance.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: de Hetsron
  rationale: Dans cette formule de recensement, la préposition לְ marque l’appartenance généalogique ou l’origine du groupe. « de Hetsron » exprime naturellement cette filiation tout en conservant la concision de l’hébreu.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans ce contexte généalogique, מִשְׁפָּחָה désigne une subdivision de parenté au sein de la tribu. « clan » est ici plus précis que « famille ».
- source_word: הַחֶצְרוֹנִי
  choice: Hetsronites
  rationale: La forme gentilice désigne collectivement les descendants ou le groupe rattaché à Hetsron. Le pluriel français rend clairement ce sens collectif.
- source_word: לְ/כַרְמִי
  choice: de Karmi
  rationale: Comme dans le premier membre, לְ indique ici l’origine généalogique ou le classement par ascendance. « de Karmi » préserve le parallélisme.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Le même terme de recensement reçoit la même traduction afin de préserver la structure parallèle du verset.
- source_word: הַכַּרְמִי
  choice: Karmites
  rationale: La forme gentilice désigne collectivement le groupe issu de Karmi ; le pluriel français convient à cette valeur collective.
