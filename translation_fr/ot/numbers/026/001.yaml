  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse et à Éléazar, fils d’Aaron le prêtre :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le verbe signifie « dire ». Le waw narratif est rendu par « Alors », qui marque naturellement la progression du récit sans lui imposer une chronologie plus précise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin יהוה, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: à Moïse et à Éléazar
  rationale: La répétition hébraïque de la préposition coordonne clairement les deux destinataires ; une seule occurrence de « à » est naturelle et non ambiguë en français.
- source_word: בֶּן אַהֲרֹן הַכֹּהֵן
  choice: fils d’Aaron le prêtre
  rationale: Cette formulation conserve la chaîne de filiation et rattache naturellement le titre défini « le prêtre » à Aaron.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Devant le discours direct qui suit, les deux-points rendent en français moderne la fonction introductive de l’infinitif hébreu « en disant », sans tournure lourde.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël ; « Yahweh » en maintient la valeur nominale.
- issue: Référent du titre הַכֹּהֵן (« le prêtre »)
  choice: Aaron
  alternative: Éléazar
  rationale: Dans la construction « Éléazar, fils d’Aaron le prêtre », la proximité syntaxique rattache le titre à Aaron. La traduction conserve cette relation sans ajouter une ponctuation susceptible de la déplacer.
translation_notes:
  register: 'Français international moderne, sobre et digne. La formule hébraïque de discours est rendue idiomatiquement par « dit … : », tout en conservant le mouvement narratif initial au moyen de « Alors ».'
