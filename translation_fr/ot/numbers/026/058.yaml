  text: אֵ֣לֶּה מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַ/לִּבְנִ֜י מִשְׁפַּ֤חַת הַֽ/חֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַ/מַּחְלִי֙ מִשְׁפַּ֣חַת הַ/מּוּשִׁ֔י מִשְׁפַּ֖חַת הַ/קָּרְחִ֑י וּ/קְהָ֖ת הוֹלִ֥ד אֶת עַמְרָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: fr
  text: 'Voici les clans de Lévi : le clan des Libnites[a], le clan des Hébronites, le clan des Mahlites, le clan des Mouchites et le clan des Coréites. Et Qehath engendra Amram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « familles » ou « groupes familiaux » ; le mot hébreu מִשְׁפָּחָה désigne ici une subdivision de parenté au sein de la tribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: clans / le clan des
  rationale: Dans ce contexte de recensement tribal, מִשְׁפָּחָה désigne une subdivision de parenté au sein d’une tribu, et non simplement une famille nucléaire. « Clan » est précis, courant et digne en français moderne.
- source_word: לֵוִי
  choice: Lévi
  rationale: Nom propre traditionnellement translittéré ainsi en français biblique.
- source_word: הַלִּבְנִי / הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  choice: les Libnites / les Hébronites / les Mahlites / les Mouchites / les Coréites
  rationale: Ces formes gentilices désignent les groupes issus des ancêtres nommés. Les gentilés français au pluriel s’intègrent naturellement après « le clan des » et maintiennent le parallélisme de l’hébreu.
- source_word: וּקְהָת
  choice: Qehath
  rationale: Le waw introduit ici une nouvelle proposition généalogique; le français peut assurer l’enchaînement sans rendre mécaniquement la conjonction. « Qehath » suit une translittération française reconnaissable du nom.
- source_word: הוֹלִד
  choice: engendra
  rationale: Le hiphil de ילד exprime ici la paternité généalogique. « Engendra » conserve cette précision tout en appartenant au registre narratif biblique français, sans être obscur.
- source_word: אֶת עַמְרָם
  choice: Amram
  rationale: La marque de l’objet direct אֶת n’est pas traduite; le nom propre est translittéré sous sa forme française usuelle.
- source_word: אֵלֶּה
  choice: Voici
  rationale: La proposition hébraïque est sans verbe. « Voici » introduit naturellement une liste en français et évite d’imposer inutilement un temps verbal absent de l’original.
