  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: fr
  text: 'Tels étaient les clans de Juda, d’après le nombre de ceux qui furent recensés parmi eux : 76 500[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’après leur effectif » ; l’expression hébraïque לִפְקֻדֵיהֶם désigne ceux qui ont été inscrits ou comptés lors du recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels étaient
  rationale: Le démonstratif pluriel introduit le récapitulatif des clans; l’imparfait convient au cadre narratif du recensement et donne une formulation française naturelle.
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans ce contexte tribal, le terme désigne les subdivisions de parenté au sein de la tribu; « clans » est plus précis que « familles ».
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française biblique usuelle du nom tribal et personnel.
- source_word: לִפְקֻדֵיהֶם
  choice: d’après le nombre de ceux qui furent recensés parmi eux
  rationale: Cette formulation conserve le sens censitaire de פקד ainsi que le suffixe pluriel, tout en restant claire et idiomatique en français.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 76 500
  rationale: La notation chiffrée exprime sans ambiguïté le total exact selon l’usage français moderne.
