  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: fr
  text: 'Car Yahweh leur avait dit : « Ils mourront à coup sûr dans le désert[a]. » Aucun d’eux ne resta, excepté Caleb, fils de Jephunné, et Josué, fils de Noun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « mourir, ils mourront », une tournure qui renforce la certitude de leur mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication du constat formulé dans le contexte précédent.
- source_word: אָמַר לָהֶם
  choice: avait dit à leur sujet
  rationale: Le plus-que-parfait marque l’antériorité de la déclaration divine; « à leur sujet » rend naturellement la portée contextuelle de לָהֶם sans exclure sa valeur littérale « à eux ».
- source_word: מוֹת יָמֻתוּ
  choice: Ils mourront à coup sûr
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation; cette tournure française en restitue clairement l’emphase.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans le récit de l’errance d’Israël, « désert » est le terme français courant et naturel pour מִדְבָּר, sans prétendre décrire uniquement une étendue de sable.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: Aucun d’eux ne resta
  rationale: 'Cette formulation française idiomatique restitue le sens distributif de אִישׁ : pas un seul individu du groupe ne subsista.'
- source_word: כִּי אִם
  choice: excepté
  rationale: L’expression introduit les deux seules exceptions à l’énoncé négatif précédent.
- source_word: כָּלֵב בֶּן יְפֻנֶּה וִיהוֹשֻׁעַ בִּן נוּן
  choice: Caleb, fils de Yefounné, et Josué, fils de Noun
  rationale: Les noms suivent des formes françaises reconnaissables tout en représentant les consonnes hébraïques; les patronymes sont rendus naturellement par « fils de ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer silencieusement par un titre.
- issue: Portée de la condamnation divine
  choice: Aucun d’eux ne resta, excepté Caleb et Josué
  alternative: Pas un homme d’entre eux ne resta
  rationale: אִישׁ est ici distributif dans un groupe déjà défini; « aucun d’eux » exprime l’exclusion totale sans introduire en français une restriction moderne au seul sexe masculin.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant les calques peu naturels. Le discours direct est conservé, et l’emphase verbale est signalée dans le texte puis explicitée en note.
