  to: 'Car Yahweh leur avait dit : « Ils mourront à coup sûr dans le désert[a]. » Aucun d’eux ne resta, excepté Caleb, fils de Jephunné, et Josué, fils de Noun.'
  rationale: La révision restitue la valeur directe de לָהֶם (« leur »), corrige la glose grammaticale de l’infinitif absolu et emploie la forme française biblique usuelle « Jephunné ». Elle préserve l’emphase, les noms, la portée exhaustive de l’énoncé et l’unique ancre de note.
