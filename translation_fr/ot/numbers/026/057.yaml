  text: וְ/אֵ֨לֶּה פְקוּדֵ֣י הַ/לֵּוִי֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/גֵרְשׁ֗וֹן מִשְׁפַּ֨חַת֙ הַ/גֵּ֣רְשֻׁנִּ֔י לִ/קְהָ֕ת מִשְׁפַּ֖חַת הַ/קְּהָתִ֑י לִ/מְרָרִ֕י מִשְׁפַּ֖חַת הַ/מְּרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: fr
  text: 'Voici les Lévites recensés[a], selon leurs clans : de Guershon, le clan des Guershonites ; de Qehath, le clan des Qehathites ; de Merari, le clan des Merarites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comptés » ou « enregistrés ». L’hébreu désigne ici les personnes inscrites lors du recensement, et non simplement l’opération abstraite de compter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Cette formule introduit naturellement en français la liste qui suit tout en maintenant son lien avec le recensement précédent.
- source_word: פְקוּדֵי הַלֵּוִי
  choice: ceux de Lévi qui furent recensés
  rationale: פְקוּדֵי désigne concrètement les personnes dénombrées ou inscrites lors du recensement. « Ceux de Lévi » conserve la formulation tribale du singulier hébreu sans imposer l’abstraction « recensement ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte tribal, מִשְׁפָּחָה désigne une subdivision clanique plutôt qu’une famille nucléaire moderne.
- source_word: לְגֵרְשׁוֹן / לִקְהָת / לִמְרָרִי
  choice: pour Guershon / pour Qehath / pour Merari
  rationale: Le לְ répété répartit les groupes recensés selon leur ancêtre éponyme ; « pour » reproduit clairement la structure distributive de la liste.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי / הַקְּהָתִי / הַמְּרָרִי
  choice: le clan des Guershonites / des Qehathites / des Merarites
  rationale: Les formes gentilices hébraïques désignent collectivement les descendants constituant chaque clan ; le pluriel français est naturel et précis.
