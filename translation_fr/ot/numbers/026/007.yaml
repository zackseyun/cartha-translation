base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: fr
  text: Voici les clans des Rubénites. Ceux d’entre eux qui furent recensés étaient au nombre de quarante-trois mille sept cent trente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux d’entre eux qui furent dénombrés ». Le terme hébreu désigne les personnes comptées lors du recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans le contexte tribal et censitaire de Nombres, le terme désigne les subdivisions de parenté au sein d’une tribu plutôt que les seules familles nucléaires. « Clans » est naturel et précis en français moderne.
- source_word: הָרֻאוּבֵנִי
  choice: Rubénites
  rationale: Le gentilé hébreu désigne ici les membres ou descendants de la tribu de Ruben. « Rubénites » est la forme française usuelle.
- source_word: פְקֻדֵיהֶם
  choice: ceux d’entre eux qui furent recensés
  rationale: Dans ce contexte, le mot issu de פקד désigne les personnes comptées ou inscrites lors du recensement. Cette formulation conserve le sens passif sans ajouter « hommes », absent de ce verset.
- source_word: וַיִּהְיוּ
  choice: étaient au nombre de
  rationale: Cette tournure française exprime naturellement le total donné par le texte hébreu.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: quarante-trois mille sept cent trente
  rationale: Le nombre est écrit en toutes lettres afin de préserver le style littéraire de la liste censitaire tout en restant clair.
