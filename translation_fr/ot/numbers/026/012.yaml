source:
  edition: WLC
  text: בְּנֵ֣י שִׁמְעוֹן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/נְמוּאֵ֗ל מִשְׁפַּ֨חַת֙ הַ/נְּמ֣וּאֵלִ֔י לְ/יָמִ֕ין מִשְׁפַּ֖חַת הַ/יָּמִינִ֑י לְ/יָכִ֕ין מִשְׁפַּ֖חַת הַ/יָּכִינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: fr
  text: 'Les fils de Siméon, selon leurs clans[a] : de Nemouël, le clan des Nemouélites ; de Yamin, le clan des Yaminites ; de Yakin[b], le clan des Yakinites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs familles ». Dans ce contexte de recensement, le mot hébreu désigne des groupes de parenté au sein de la tribu.
    reason: lexical_alternative
  - marker: b
    text: Le nom Yakin est aussi traditionnellement transcrit Jakin.
    reason: transliteration_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: Fils de Siméon
  rationale: La formule généalogique hébraïque emploie littéralement « fils de ». En français, l'article n'est pas nécessaire dans cette rubrique de recensement, et la formulation conserve la perspective de filiation masculine du texte.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte de recensement, מִשְׁפָּחָה désigne les subdivisions lignagères de la tribu. « Clans » est plus précis que « familles », tandis que « selon » restitue naturellement la valeur distributive de la préposition.
- source_word: לִנְמוּאֵל
  choice: de Nemouel
  rationale: La préposition לְ introduit ici l'ancêtre éponyme de chaque clan. « De » exprime clairement la descendance dans cette liste.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי
  choice: le clan des Nemouélites
  rationale: Le gentilé hébreu désigne collectivement les descendants de Nemouel. Le pluriel français nomme naturellement les membres du clan.
- source_word: לְיָמִין / מִשְׁפַּחַת הַיָּמִינִי
  choice: de Yamin, le clan des Yaminites
  rationale: La translittération par Y représente la consonne initiale hébraïque yod en français moderne ; le gentilé pluriel rend le groupe descendant de Yamin.
- source_word: לְיָכִין / מִשְׁפַּחַת הַיָּכִינִי
  choice: de Yakin, le clan des Yakinites
  rationale: « Yakin » suit une translittération française transparente du nom hébreu יָכִין ; « Yakinites » rend le gentilé collectif correspondant.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétitive du registre de recensement est conservée. Les noms propres sont translittérés directement depuis l'hébreu, avec yod initial rendu par Y ; une note signale la forme française traditionnelle Jakin.
