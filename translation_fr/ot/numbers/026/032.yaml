  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: fr
  text: de Shemida, le clan des Shemidaïtes ; et de Hépher, le clan des Héphérites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: de Shemida
  rationale: 'Dans cette formule elliptique de recensement, la préposition « de » explicite naturellement en français le lien de descendance sous-entendu : « de Shemida, le clan… ».'
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans les listes tribales et les recensements, מִשְׁפָּחָה désigne une subdivision de parenté au sein d’une tribu ; « clan » est ici plus précis que « famille ».
- source_word: הַ/שְּׁמִידָעִי
  choice: les Shemidaïtes
  rationale: La forme gentilice désigne le groupe issu de Shemida. « Shemidaïtes » transpose clairement ce nom collectif en français.
- source_word: וְ/חֵפֶר
  choice: et de Héfer
  rationale: La conjonction introduit le membre suivant de la formule répétée ; « de » est ajouté pour rendre explicite et naturel le lien elliptique avec le clan.
- source_word: הַֽ/חֶפְרִי
  choice: les Héférites
  rationale: La forme gentilice désigne les descendants ou le clan associé à Héfer ; « Héférites » est une formation française claire et conventionnelle.
