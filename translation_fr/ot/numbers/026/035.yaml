base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: fr
  text: 'Voici les fils d’Éphraïm, selon leurs clans : de Shoutélah, le clan des Shoutélahites ; de Béker, le clan des Bakrites ; de Tahan, le clan des Tahanites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: Voici les fils d’Éphraïm
  rationale: « Voici » restitue naturellement la formule démonstrative qui introduit la liste, tandis que « fils » conserve le registre généalogique de בְנֵי.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le contexte du recensement de Nombres, מִשְׁפָּחָה désigne une subdivision tribale ; « clan » est plus précis ici que le sens courant de « famille ».
- source_word: לְשׁוּתֶלַח
  choice: de Shoutélah
  rationale: Dans cette formule généalogique, le préfixe לְ rattache le clan à l’ancêtre qui lui donne son nom ; « de » exprime sobrement ce rapport.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: le clan des Shoutélahites
  rationale: La forme gentilice hébraïque désigne collectivement les membres du clan issu de Shoutélah ; le pluriel français rend cette valeur.
- source_word: לְבֶכֶר מִשְׁפַּחַת הַבַּכְרִי
  choice: de Béker, le clan des Békérites
  rationale: La structure répétée de l’hébreu est maintenue. « Béker » suit la valeur consonantique et vocalique du texte massorétique, et « Békérites » forme un gentilé français transparent.
- source_word: לְתַחַן מִשְׁפַּחַת הַתַּחֲנִי
  choice: de Tahan, le clan des Tahanites
  rationale: Le parallélisme de la liste est conservé, avec un gentilé collectif français correspondant à la forme hébraïque.
