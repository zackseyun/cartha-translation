lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne une récapitulation dans une proposition nominale hébraïque.
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans ce contexte tribal et censitaire, le terme désigne des groupes étendus de parenté plutôt que les seules familles nucléaires.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: לִפְקֻדֵיהֶם
  choice: selon leur recensement
  rationale: Rend de façon naturelle la référence au dénombrement des membres enregistrés de ces clans, tout en conservant en note les autres analyses possibles.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: soixante-quatre mille trois cents
  rationale: Exprime la valeur numérique de 64 300 selon l’ordre naturel du français moderne.
