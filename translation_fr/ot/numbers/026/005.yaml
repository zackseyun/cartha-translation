  text: רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל בְּנֵ֣י רְאוּבֵ֗ן חֲנוֹךְ֙ מִשְׁפַּ֣חַת הַ/חֲנֹכִ֔י לְ/פַלּ֕וּא מִשְׁפַּ֖חַת הַ/פַּלֻּאִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: fr
  text: 'Ruben, le premier-né d’Israël : les fils de Ruben : Hénoc, le clan des Hénocites ; Pallu, le clan des Palluites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: le premier-né d’Israël
  rationale: Cette formulation rend directement le statut familial de Ruben sans ajouter « fils », qui reste implicite.
- source_word: בְּנֵי רְאוּבֵן
  choice: les fils de Ruben
  rationale: Le sens littéral convient à cette formule généalogique et demeure naturel en français ; dans le contexte du recensement, il introduit les lignées issues de Ruben.
- source_word: חֲנוֹךְ
  choice: Hénok
  rationale: Transcription française claire du nom hébreu, distinguée de la forme traditionnellement employée pour Hénoch.
- source_word: מִשְׁפַּחַת
  choice: le clan
  rationale: Dans ce recensement tribal, le terme désigne une subdivision de parenté de la tribu ; « clan » est plus précis que « famille ».
- source_word: הַחֲנֹכִי
  choice: les Hénokites
  rationale: Le gentilé hébreu désigne les membres du clan issu de Hénok ; la terminaison française « -ites » conserve cette valeur collective.
- source_word: לְפַלּוּא
  choice: de Pallou
  rationale: Dans l’énumération, le préfixe לְ introduit la lignée rattachée à Pallou, et non une destination ou un bénéficiaire.
- source_word: הַפַּלֻּאִי
  choice: les Pallouites
  rationale: Le gentilé désigne collectivement le clan issu de Pallou et se rend naturellement en français par « Pallouites ».
