source:
  edition: WLC
  text: לְ/יֵ֕צֶר מִשְׁפַּ֖חַת הַ/יִּצְרִ֑י לְ/שִׁלֵּ֕ם מִשְׁפַּ֖חַת הַ/שִּׁלֵּמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: fr
  text: de Yétser, le clan des Yétserites ; de Shillem, le clan des Shillémites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: de Yétser
  rationale: Dans cette formule de recensement, la préposition לְ introduit le chef ancestral dont le clan tire son nom ; « de » rend naturellement ce rapport en français. Le nom propre est translittéré selon une forme française lisible.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans le contexte tribal et censitaire, מִשְׁפָּחָה désigne une subdivision de parenté plus large que la famille nucléaire moderne ; « clan » exprime clairement cette réalité sociale.
- source_word: הַ/יִּצְרִי
  choice: les Yétserites
  rationale: Le gentilé hébreu désigne les descendants de Yétser. « Yétserites » conserve en français le lien transparent avec le nom de l’ancêtre.
- source_word: לְ/שִׁלֵּם
  choice: de Shillem
  rationale: Comme dans le premier membre, לְ introduit l’ancêtre éponyme du clan et se rend idiomatiquement par « de ».
- source_word: הַ/שִּׁלֵּמִי
  choice: les Shillémites
  rationale: Le gentilé désigne les descendants de Shillem ; « Shillémites » transpose naturellement cette dérivation en français.
theological_decisions: []
translation_notes:
  register: Formulation brève et répétitive, conforme au style du recensement. Français moderne et digne ; « clan » évite l’ambiguïté moderne de « famille ». Les noms sont translittérés de manière cohérente et prononçable.
