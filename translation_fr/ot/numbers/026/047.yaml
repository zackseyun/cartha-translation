  yaml_path: translation/ot/numbers/026/047.yaml
  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: fr
  text: 'Tels sont les clans des fils d’Aser, selon leur dénombrement[a] : cinquante-trois mille quatre cents.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon ceux qui furent recensés parmi eux ». L’hébreu emploie un terme de recensement dérivé du verbe פקד, qui désigne les personnes enregistrées ou comptées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Le démonstratif pluriel introduit ici une formule récapitulative; « Tels sont » est naturel et digne en français.
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans ce contexte tribal, le mot désigne des groupes étendus de parenté plutôt que des familles nucléaires.
- source_word: בְּנֵי אָשֵׁר
  choice: les fils d’Aser
  rationale: Cette formulation conserve l’expression généalogique hébraïque tout en désignant les descendants tribaux d’Aser.
- source_word: לִפְקֻדֵיהֶם
  choice: d’après ceux d’entre eux qui furent recensés
  rationale: Le terme issu de פקד relève du vocabulaire officiel du recensement; cette formulation conserve aussi le suffixe pronominal « d’entre eux » sans réduire l’expression à un simple total.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: cinquante-trois mille quatre cents
  rationale: Le nombre exact est rendu selon l’usage courant du français moderne.
