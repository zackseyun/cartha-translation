  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: fr
  text: 'Ceux d’entre eux qui furent recensés étaient au nombre de 23 000 : tous les mâles âgés d’un mois ou plus. En effet, ils ne furent pas recensés parmi les fils d’Israël[a], puisqu’aucun héritage ne leur fut donné parmi les fils d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Israélites », ici et à la fin du verset.
    reason: Alternative lexicale pour בְּתוֹךְ בְּנֵי יִשְׂרָאֵל dans ses deux occurrences.
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: Ceux d’entre eux qui furent recensés
  rationale: Rend le nom dérivé de פקד dans son contexte de recensement, tout en exprimant naturellement en français l’idée des membres du groupe qui ont été comptés.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: 23 000
  rationale: Forme numérique française claire et usuelle pour le cardinal hébreu.
- source_word: כָּל זָכָר
  choice: tous les individus de sexe masculin
  rationale: Inclut avec précision aussi bien les nourrissons que les adultes, contrairement à « tous les hommes ».
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: âgés d’un mois ou plus
  rationale: Expression française naturelle qui conserve le seuil d’âge indiqué par l’hébreu.
- source_word: הָתְפָּקְדוּ
  choice: furent recensés
  rationale: Maintient le vocabulaire du recensement et le lien avec פְקֻדֵיהֶם au début du verset.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: « Parmi » rend naturellement בְּתוֹךְ, tandis que « les fils d’Israël » conserve l’expression familiale et collective du texte hébreu.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: aucun héritage ne leur fut donné
  rationale: Conserve la construction passive et rend נַחֲלָה par le terme traditionnel et contextuellement juste pour la part territoriale attribuée.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix principal préserve la formulation familiale littérale de l’hébreu sans exclure en français la possibilité plus idiomatique indiquée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « individus de sexe masculin » est légèrement administrative, mais elle évite d’appeler « hommes » des nourrissons d’un mois et respecte l’étendue de כָּל זָכָר. Les deux propositions causales sont distinguées par « En effet » et « puisque » afin d’éviter une répétition lourde de « car » tout en préservant leur relation logique.
