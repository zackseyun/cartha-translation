  text: de Zérah, le clan des Zérahites ; de Saül, le clan des Saülites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: de Zérah
  rationale: Dans cette formule de recensement, le préfixe לְ introduit l’ancêtre auquel le clan se rattache. « de Zérah » exprime naturellement cette filiation en français.
- source_word: מִשְׁפַּחַת
  choice: le clan des
  rationale: Dans le contexte tribal et censitaire, מִשְׁפָּחָה désigne un groupe de parenté constituant une subdivision de la tribu. « clan » est ici plus précis que « famille ».
- source_word: הַזַּרְחִי
  choice: les Zérahites
  rationale: La forme patronymique désigne le groupe issu de Zérah. « Zérahites » reproduit clairement cette formation en français.
- source_word: לְ/שָׁאוּל
  choice: de Shaoul
  rationale: Comme dans le premier membre, le préfixe לְ marque ici le rattachement généalogique au personnage nommé.
- source_word: הַשָּׁאוּלִי
  choice: les Shaoulites
  rationale: La forme patronymique désigne les descendants de Shaoul ; « Shaoulites » conserve la structure concise et parallèle de l’hébreu.
