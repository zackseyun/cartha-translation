  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: fr
  text: 'Tels sont les clans des descendants de Zabulon, d’après leur recensement : soixante mille cinq cents.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: La formule déictique introduit un récapitulatif; « Tels sont » rend naturellement le présent hébreu dans le registre du recensement.
- source_word: מִשְׁפְּחֹת
  choice: les clans
  rationale: Dans ce contexte tribal, le terme désigne des groupes de parenté étendus plutôt que de simples familles nucléaires.
- source_word: הַזְּבוּלֹנִי
  choice: des descendants de Zabulon
  rationale: Le gentilé singulier avec article a un sens collectif et désigne les membres de la tribu issue de Zabulon; cette formulation est claire et naturelle en français.
- source_word: לִפְקֻדֵיהֶם
  choice: d’après leur recensement
  rationale: Le terme dérivé de פקד renvoie ici au dénombrement officiel; la formulation française exprime le rapport entre les clans et l’effectif recensé sans alourdir la phrase.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: soixante mille cinq cents
  rationale: Le nombre est écrit en toutes lettres, conformément au style solennel et formulaire du passage.
