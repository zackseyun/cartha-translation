source:
  edition: WLC
  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: fr
  text: 'Les fils de Nephtali, selon leurs clans : de Yahtséel, le clan des Yahtséélites ; de Gouni, le clan des Gounites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le construit hébreu signifie littéralement « les fils de ». Cette formulation convient à l’introduction d’une lignée tribale et reste naturelle en français.
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Transcription française traditionnelle et largement reconnue du nom propre biblique.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: La locution classe les membres de la tribu par groupes de parenté. « Clans » rend précisément מִשְׁפָּחָה dans le contexte du recensement, et « selon » exprime naturellement la valeur distributive de לְ.
- source_word: לְיַחְצְאֵל
  choice: de Yahtséel
  rationale: Dans cette formule généalogique, לְ introduit l’ancêtre dont le groupe tire son nom. « De » exprime clairement cette relation en français.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: le clan des Yahtséélites
  rationale: Le gentilé hébreu désigne collectivement les descendants de Yahtséel. Le pluriel français convient mieux que le singulier à ce groupe recensé.
- source_word: לְגוּנִי
  choice: de Gouni
  rationale: Comme dans le membre précédent, לְ introduit l’ancêtre éponyme du clan ; « de Gouni » est idiomatique en français.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: le clan des Gounites
  rationale: Le gentilé désigne collectivement le groupe issu de Gouni ; le pluriel français restitue ce sens.
