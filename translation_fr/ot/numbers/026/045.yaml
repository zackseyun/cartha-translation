  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: fr
  text: 'Pour les fils de Béria : de Héber, le clan des Hébérites ; de Malkiel, le clan des Malkiélites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Pour les fils de
  rationale: Dans cette formule de recensement, la préposition ל introduit les subdivisions rattachées à la lignée principale. « Pour les fils de » conserve la structure généalogique tout en restant naturel en français.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Nom propre translittéré selon une forme française claire et usuelle.
- source_word: לְ/חֶבֶר
  choice: de Héber
  rationale: Dans cette liste généalogique, ל devant le nom de l’ancêtre indique la lignée issue de lui ; « de Héber » exprime cette origine avec concision.
- source_word: מִשְׁפַּחַת
  choice: le clan de / le clan des
  rationale: Dans le contexte du recensement, מִשְׁפָּחָה désigne une subdivision de parenté au sein d’une tribu. « Clan » est plus précis ici que « famille ».
- source_word: הַֽ/חֶבְרִי
  choice: les Héberites
  rationale: La forme patronymique désigne le groupe descendant de Héber ; « Héberites » reproduit clairement cette désignation collective.
- source_word: לְ/מַ֨לְכִּיאֵל
  choice: de Malkiel
  rationale: Comme pour Héber, la préposition ל marque ici la lignée issue de l’ancêtre nommé.
- source_word: הַ/מַּלְכִּיאֵלִי
  choice: les Malkielites
  rationale: La forme patronymique désigne le clan descendant de Malkiel ; « Malkielites » maintient le parallélisme généalogique.
