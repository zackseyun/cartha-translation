  yaml_path: translation/ot/numbers/026/056.yaml
  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: fr
  text: Son héritage sera réparti selon le tirage au sort[a], entre les plus nombreux et les moins nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « C’est par le sort que son héritage sera réparti entre les nombreux et les peu nombreux. » L’hébreu oppose ici ce qui est plus nombreux à ce qui l’est moins dans le processus de répartition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: selon
  rationale: Cette locution signifie ici « selon » ou « d’après la décision de ». « Selon » exprime naturellement que le partage est déterminé par le tirage au sort.
- source_word: הַגּוֹרָל
  choice: le tirage au sort
  rationale: Dans ce contexte, גוֹרָל désigne le procédé par lequel les terres sont attribuées. « Tirage au sort » est plus immédiatement compréhensible en français moderne que le seul nom « sort ».
- source_word: תֵּחָלֵק
  choice: le partage … se fera
  rationale: 'Le nifal exprime un procès passif : l’héritage sera partagé ou réparti. Cette tournure française conserve ce sens tout en restant fluide.'
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: Le nom porte un suffixe masculin singulier. « Son héritage » en respecte la forme, avec une valeur distributive dans le contexte de chaque groupe concerné.
- source_word: בֵּין
  choice: entre
  rationale: La préposition met en relation les deux catégories opposées qui suivent ; « entre » en rend directement la structure.
- source_word: רַב
  choice: le groupe nombreux
  rationale: Dans le cadre du recensement et de la répartition du territoire, le terme désigne la catégorie comptant le plus de personnes. L’ajout de « groupe » évite de faire croire qu’il s’agit directement de la taille des lots.
- source_word: לִמְעָט
  choice: le groupe peu nombreux
  rationale: Cette expression forme le pendant de רַב et désigne la catégorie dont l’effectif est moindre. La formulation préserve l’opposition quantitative sans la surinterpréter.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le singulier distributif « son héritage » et explicite seulement que « nombreux » et « peu nombreux » qualifient des groupes, sans résoudre davantage l’ambiguïté du partage.
