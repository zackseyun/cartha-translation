lexical_decisions:
- source_word: כָּל
  choice: Toutes
  rationale: Exprime la totalité des familles résumées dans ce chiffre.
- source_word: מִשְׁפְּחֹת
  choice: familles
  rationale: Dans ce contexte tribal et généalogique, le terme peut désigner des familles ou des clans; « familles » reste naturel et cohérent avec le sens collectif.
- source_word: הַשּׁוּחָמִי
  choice: des Shouhamites
  rationale: Le gentilé désigne les descendants ou le groupe familial associé à Shouham; la translittération française conserve le lien avec le nom propre.
- source_word: לִפְקֻדֵיהֶם
  choice: d’après le nombre de ceux qui furent recensés parmi eux
  rationale: La forme issue de פקד renvoie ici aux personnes enregistrées lors du recensement et indique la base du total.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 64 400
  rationale: La notation numérique française moderne restitue exactement le total hébreu.
