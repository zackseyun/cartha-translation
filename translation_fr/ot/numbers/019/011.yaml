  text: הַ/נֹּגֵ֥עַ בְּ/מֵ֖ת לְ/כָל נֶ֣פֶשׁ אָדָ֑ם וְ/טָמֵ֖א שִׁבְעַ֥ת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: fr
  text: Quiconque touche le cadavre de n’importe quel être humain sera impur pendant sept jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Celui qui touche
  rationale: Le participe avec article a une valeur substantivée et générale. « Celui qui touche » conserve naturellement la formulation juridique et générale en français.
- source_word: בְּמֵת
  choice: le corps d’une personne morte
  rationale: מֵת désigne ici un mort, c’est-à-dire un corps humain sans vie. Cette formulation explicite le référent concret dans le contexte d’impureté rituelle.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: d’une personne morte
  rationale: L’expression précise qu’il s’agit de tout être humain. En français, « une personne morte » exprime clairement cette portée générique sans suggérer que seuls les hommes sont concernés.
- source_word: וְטָמֵא
  choice: sera impur
  rationale: Dans cette formulation légale, le parfait précédé de וְ exprime la conséquence de l’acte. « Sera impur » conserve cette valeur juridique sans ajouter une idée morale.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: La préposition « pendant » rend explicitement et naturellement en français la durée indiquée par l’hébreu.
theological_decisions:
- issue: Sens rituel de טָמֵא
  choice: impur
  alternative: souillé
  rationale: « Impur » est le terme français courant pour l’état rituel décrit dans la législation biblique; il évite de réduire cet état à une saleté physique ou à une faute morale.
- issue: Portée générique de אָדָם
  choice: personne
  alternative: homme / être humain
  rationale: Dans ce contexte, אָדָם désigne un humain sans distinction de sexe. « Personne » communique exactement cette portée juridique générale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure conserve le caractère général de la règle juridique et distingue implicitement l’impureté rituelle d’un jugement moral.
