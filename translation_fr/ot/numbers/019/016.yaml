  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: fr
  text: Toute personne qui, en pleine campagne[a], touche quelqu’un qui a été tué par l’épée, un mort[b], un ossement humain[c] ou une tombe sera impure pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « sur la face du champ », expression désignant ici un lieu en plein air.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un cadavre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « un os d’être humain » ; le terme hébreu est ici générique et ne désigne pas spécialement un homme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: Toute personne qui… touche
  rationale: La construction a une portée distributive et énonce un cas général. Cette formulation est naturelle en français et conserve l’universalité de la règle.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: en pleine campagne
  rationale: L’expression signifie littéralement « sur la face du champ » et désigne ici un lieu à découvert, hors d’un espace bâti.
- source_word: בַּחֲלַל חֶרֶב
  choice: quelqu’un qui a été tué par l’épée
  rationale: חָלָל désigne une personne tuée ou transpercée, tandis que חֶרֶב indique l’instrument. La formulation rend explicitement le référent humain.
- source_word: אוֹ בְמֵת
  choice: un mort
  rationale: מֵת peut désigner une personne morte ou son cadavre. « Un mort » reste clair et conserve la concision de l’hébreu.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: un ossement humain
  rationale: אָדָם est générique dans ce contexte. « O​​ssement humain » exprime naturellement l’idée d’un reste humain sans connotation masculine.
- source_word: אוֹ בְקָבֶר
  choice: une tombe
  rationale: קֶבֶר désigne couramment une tombe ou un lieu de sépulture; « tombe » est l’équivalent direct dans ce contexte légal.
- source_word: יִטְמָא
  choice: sera impure
  rationale: Le verbe exprime l’état d’impureté rituelle. Le futur convient à l’énoncé juridique français sans ajouter une interprétation absente du texte.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: L’ajout idiomatique de « pendant » exprime clairement en français la durée indiquée par l’hébreu.
theological_decisions:
- issue: Sens générique de אָדָם
  choice: humain
  alternative: d’un homme
  rationale: Dans cette loi de pureté, le terme qualifie des restes appartenant à un être humain en général et ne vise pas spécialement un individu masculin.
- issue: Nature de l’impureté exprimée par יִטְמָא
  choice: sera impure
  alternative: deviendra impure
  rationale: Le texte affirme l’état résultant du contact. « Sera impure » conserve le registre légal et n’explicite pas davantage le processus.
translation_notes:
  register: Français international moderne, clair et digne. Le féminin de « impure » s’accorde avec « toute personne ». La phrase conserve la série de quatre objets de contact et le registre juridique du passage.
