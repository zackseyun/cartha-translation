review_pass:
  verdict: revise
  source_fidelity: La formulation « a donnée » affaiblit צִוָּה (« a ordonné / commandé »). De plus, « n’a jamais porté le joug » peut décrire le fait de porter un joug, tandis que l’hébreu dit littéralement qu’aucun joug n’est « monté sur elle »; une formulation explicitant qu’aucun joug n’a été mis sur l’animal est plus exacte.
  naturalness: Le français est globalement naturel, clair et de registre biblique moderne. « Sur laquelle aucun joug n’a jamais été mis » est idiomatique et évite l’ambiguïté de « porter le joug ».
  terminology: « Prescription de la loi », « l’Éternel », « Israélites », « vache rousse », « entière » et « défaut » conviennent. La juxtaposition d’« entière » et de « sans aucun défaut » préserve utilement les deux qualifications hébraïques.
  issues:
  - severity: medium
    issue: Le verbe « a donnée » ne rend pas pleinement le verbe hébreu צִוָּה.
    rationale: צִוָּה signifie « ordonner, commander ». « A ordonnée » conserve le caractère impératif de la prescription.
  - severity: low
    issue: « N’a jamais porté le joug » est moins précis que la construction hébraïque.
    rationale: Le texte dit qu’aucun joug n’est venu/s’est trouvé sur elle. « Aucun joug n’a jamais été mis sur elle » exprime directement cette condition sans introduire une nuance différente.
