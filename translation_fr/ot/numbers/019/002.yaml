  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: fr
  text: 'Voici la prescription de la loi que l’Éternel a ordonnée : « Dis aux Israélites de t’amener une vache rousse, entière, sans aucun défaut, sur laquelle aucun joug n’a jamais été mis. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: la prescription de la loi
  rationale: « Prescription » exprime ici une disposition normative précise; « loi » conserve le sens courant de תּוֹרָה dans cette formule.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et immédiatement reconnaissable du tétragramme, sans vocaliser le nom divin de manière incertaine.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent naturel en français moderne de l’expression littérale « fils d’Israël » lorsqu’elle désigne le peuple.
- source_word: פָרָה אֲדֻמָּה
  choice: une vache rousse
  rationale: פָרָה désigne une vache ou génisse; אֲדֻמָּה indique une couleur rougeâtre. « Vache rousse » est précis, naturel et consacré dans ce contexte.
- source_word: תְּמִימָה
  choice: entière
  rationale: Conserve la notion positive d’intégrité ou de complétude, distincte de la proposition suivante qui exclut explicitement tout défaut.
- source_word: מוּם
  choice: défaut
  rationale: Terme concret et général correspondant à une imperfection physique disqualifiante.
- source_word: לֹא עָלָה עָלֶיהָ עֹל
  choice: qui n’a jamais porté le joug
  rationale: Formulation idiomatique française exprimant qu’aucun joug n’a été placé sur l’animal.
theological_decisions:
- issue: Relation entre תְּמִימָה et אֵין בָּהּ מוּם
  choice: « entière, sans aucun défaut »
  alternative: « sans défaut, sans aucune tare »
  rationale: Le texte hébreu emploie deux expressions distinctes. La traduction maintient leur juxtaposition et évite de les fondre en un seul qualificatif.
- issue: Représentation du tétragramme
  choice: « l’Éternel »
  alternative: « YHWH » ou « Yahvé »
  rationale: Ce choix suit un usage français biblique largement intelligible tout en évitant d’imposer une reconstruction particulière de la prononciation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe indirecte hébraïque (« en disant ») est rendue par deux-points et discours direct. « Entière » est volontairement conservé à côté de « sans aucun défaut » afin de refléter la double qualification du texte source.
