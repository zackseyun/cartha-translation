source:
  edition: WLC
  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: fr
  text: Tout ce que touche la personne impure deviendra impur, et la personne[a] qui le touche deviendra impure jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu néfèsh peut désigner l’âme, la vie ou la personne entière ; ici, il désigne une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Tout ce que
  rationale: Cette tournure française naturelle conserve la portée globale de כֹל et introduit clairement la proposition relative marquée par אֲשֶׁר.
- source_word: יִגַּע בּוֹ
  choice: touche
  rationale: Le verbe נגע avec ב exprime ici le contact. En français, « toucher » se construit directement avec son objet et rend naturellement l’idée de contact rituel.
- source_word: הַטָּמֵא
  choice: la personne impure
  rationale: L’adjectif substantivé désigne ici une personne en état d’impureté rituelle. L’ajout de « personne » explicite le référent sans moraliser le terme.
- source_word: יִטְמָא
  choice: deviendra impur
  rationale: La forme verbale indique que ce qui est touché entre dans un état d’impureté; « deviendra » exprime clairement ce changement d’état.
- source_word: וְהַנֶּפֶשׁ
  choice: et la personne
  rationale: Dans ce contexte juridique et rituel, נֶפֶשׁ désigne l’être humain dans son ensemble. « Personne » est idiomatique et évite le contresens possible de « âme ».
- source_word: הַנֹּגַעַת
  choice: qui y touche
  rationale: Le participe qualifie נֶפֶשׁ. Le pronom adverbial « y » reprend naturellement en français ce qui vient d’être rendu impur, bien que l’objet ne soit pas répété explicitement en hébreu.
- source_word: תִּטְמָא
  choice: sera impure
  rationale: La formulation met l’accent sur l’état rituel qui résulte du contact.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: C’est l’expression française courante et précise correspondant à la limite temporelle habituelle des lois de pureté.
theological_decisions:
- issue: Nature de l’impureté exprimée par טמא
  choice: impur / impure
  alternative: souillé / souillée; pécheur / pécheresse
  rationale: Le passage traite d’une impureté rituelle transmise par contact, et non nécessairement d’une faute morale. « Impur » préserve cette distinction.
- issue: Référent implicite de הַנֹּגַעַת
  choice: « qui y touche », avec renvoi à ce qui vient d’être rendu impur
  alternative: « qui touche » sans complément exprimé
  rationale: L’hébreu ne répète pas l’objet, mais le contexte immédiat le fournit. Le pronom « y » rend la phrase française intelligible sans ajouter de précision théologique étrangère au texte.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et juridique, tout en distinguant nettement l’impureté rituelle de la culpabilité morale.
