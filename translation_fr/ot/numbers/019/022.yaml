  naturalness: « Toucher à » est possible dans certains emplois français, mais « toucher quelque chose » est la construction la plus directe et naturelle pour un contact matériel. « Qui le touche » est donc préférable à « qui y touche ».
  terminology: « Impur / impure » convient au contexte d’impureté rituelle et évite de suggérer une culpabilité morale. « Personne » rend naturellement נֶפֶשׁ dans cette disposition légale.
