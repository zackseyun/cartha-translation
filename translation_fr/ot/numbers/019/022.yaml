revisions:
- from: Tout ce que touche la personne impure deviendra impur, et la personne[a] qui y touche sera impure jusqu’au soir.
  to: Tout ce que touche la personne impure deviendra impur, et la personne[a] qui le touche deviendra impure jusqu’au soir.
  rationale: La révision remplace le pronom adverbial « y » par le complément direct « le », exigé par l’usage le plus naturel de « toucher » dans ce contexte. Elle emploie aussi « deviendra impure » pour exprimer explicitement la conséquence résultant du contact, conformément à la forme verbale hébraïque et au parallélisme de la phrase.
