  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: fr
  text: Un homme rituellement pur prendra de l’hysope, la trempera dans l’eau et, avec l’hysope, aspergera d’eau la tente, tous les objets, les personnes qui s’y trouvaient, ainsi que celui qui a touché un os, une personne tuée[a], un mort ou une tombe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une victime » ou « le corps d’une personne tuée ». Le terme hébreu désigne spécifiquement quelqu’un qui a été tué, souvent violemment, à la différence du terme plus général « mort » qui suit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: hysope
  rationale: Terme traditionnel et précis pour la plante employée dans ce rite de purification.
- source_word: בַּמַּיִם
  choice: dans l’eau
  rationale: L’article hébreu est conservé; il s’agit vraisemblablement de l’eau de purification préparée selon le contexte.
- source_word: אִישׁ טָהוֹר
  choice: un homme rituellement pur
  rationale: Le singulier masculin est maintenu, tandis que «rituellement» empêche de comprendre la pureté comme une qualité morale.
- source_word: וְהִזָּה
  choice: en fera l’aspersion
  rationale: Expression française naturelle dans un contexte rituel, indiquant la projection de gouttelettes de l’eau où l’hysope a été trempée.
- source_word: הָאֹהֶל
  choice: la tente
  rationale: Dans le contexte immédiat, il s’agit de la tente où un décès a eu lieu, non du sanctuaire.
- source_word: הַכֵּלִים
  choice: tous les objets
  rationale: כְּלִי est un terme large désignant divers récipients, ustensiles ou articles; «objets» évite de le restreindre indûment.
- source_word: הַנְּפָשׁוֹת
  choice: les personnes
  rationale: נֶפֶשׁ désigne ici les personnes présentes, sans implication particulière concernant l’âme.
- source_word: הַנֹּגֵעַ
  choice: celui qui a touché
  rationale: Rend naturellement le participe substantivé masculin singulier et l’action antérieure à la purification.
- source_word: בָּעֶצֶם
  choice: un os
  rationale: Malgré la détermination morphologique, le français emploie naturellement l’indéfini dans une énumération de sources possibles d’impureté; le contexte implique un os humain.
- source_word: בֶחָלָל
  choice: une personne tuée
  rationale: חָלָל désigne spécifiquement une personne abattue ou tuée, souvent violemment, et doit rester distinct du terme général מֵת.
- source_word: בַמֵּת
  choice: un mort
  rationale: Expression française concise pour une personne morte, plus générale que חָלָל et distincte de celui-ci.
- source_word: בַקָּבֶר
  choice: une tombe
  rationale: Équivalent moderne et naturel du lieu de sépulture; l’indéfini convient à la série française.
theological_decisions:
- issue: Terminologie de la pureté rituelle
  choice: rituellement pur
  alternative: pur
  rationale: L’ajout explicatif «rituellement» situe la qualité dans le système cérémoniel lié au contact avec la mort et évite une lecture morale.
- issue: Langage masculin représentatif dans אִישׁ
  choice: un homme
  alternative: une personne
  rationale: Le texte hébreu emploie explicitement le nom masculin singulier אִישׁ; la traduction le conserve sans conclure au-delà du texte sur la portée de cette prescription.
- issue: Distinction entre חָלָל et מֵת
  choice: une personne tuée / un mort
  alternative: un cadavre / un mort
  rationale: La formulation conserve la différence entre une victime tuée, probablement violemment, et le terme général désignant une personne morte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit l’enchaînement rituel du texte hébreu tout en évitant les tournures inutilement archaïques. «Aspersion» garde la précision cultuelle; «objets» traduit sans restriction excessive le terme hébreu général.
