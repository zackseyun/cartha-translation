  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: fr
  text: Vous la remettrez au prêtre Éléazar. Il la fera sortir du camp, et elle sera égorgée devant lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un verbe actif à sujet masculin singulier implicite. Le français le rend ici au passif afin de ne pas identifier l’exécutant ; « devant lui » renvoie à Éléazar.
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם אֹתָהּ
  choice: Vous la remettrez
  rationale: Dans cette prescription, le parfait précédé de וְ a une valeur directive. « Remettre » exprime naturellement le fait de confier la génisse au prêtre; le pronom féminin « la » reprend la génisse rouge.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: au prêtre Éléazar
  rationale: Formulation française naturelle du nom accompagné de son titre, sans modifier le sens de la préposition.
- source_word: וְהוֹצִיא אֹתָהּ
  choice: Il la fera sortir
  rationale: Le hifil de יצא est causatif. « Faire sortir » en conserve directement la valeur et laisse ouverte la manière dont Éléazar conduit ou fait conduire l’animal.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: du camp
  rationale: Avec « faire sortir », le français exprime idiomatiquement le mouvement vers l’extérieur par « sortir du camp »; le résultat est bien que l’animal se trouve hors du camp.
- source_word: וְשָׁחַט אֹתָהּ
  choice: et elle sera égorgée
  rationale: Le verbe hébreu est actif avec un sujet masculin singulier implicite, mais l’identité de l’agent demeure discutée dans ce contexte. Le passif français préserve l’acte prescrit sans trancher explicitement qui l’accomplit.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Rend directement l’idée de l’acte accompli sous les yeux ou en présence d’Éléazar, tout en gardant la formulation concise de l’hébreu.
theological_decisions:
- issue: Identité de celui qui égorge la génisse
  choice: Le texte principal emploie le passif « elle sera égorgée devant lui », sans identifier l’agent.
  alternative: « Il l’égorgera devant lui », en comprenant qu’Éléazar reste le sujet implicite; ou « on l’égorgera devant lui », en distinguant l’exécutant d’Éléazar.
  rationale: La suite verbale peut grammaticalement faire d’Éléazar le sujet, mais « devant lui » peut aussi suggérer qu’une autre personne accomplit l’acte en sa présence. Le passif maintient cette tension sans imposer une répartition précise des rôles.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple conserve la force prescriptive du passage. Le féminin grammatical reprend naturellement « la génisse » du contexte précédent.
