base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: fr
  text: Puis le prêtre Éléazar prendra avec son doigt du sang de celle-ci et en fera l’aspersion sept fois en direction de la partie avant de la tente de la Rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant la tente de la Rencontre ». L’expression hébraïque indique une orientation vers la face ou la partie avant de la tente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis … prendra
  rationale: Dans cette prescription rituelle, le waw suivi de l’accompli marque l’étape suivante; le futur français exprime naturellement l’instruction.
- source_word: מִדָּמָהּ
  choice: un peu du sang de la vache
  rationale: Le préfixe מִן a ici une valeur partitive. L’explicitation « de la vache » lève en français l’ambiguïté du possessif sans ajouter de nouvel élément au contexte.
- source_word: בְּאֶצְבָּעוֹ
  choice: avec son doigt
  rationale: La préposition בְּ marque naturellement ici le moyen employé dans le geste rituel.
- source_word: וְהִזָּה
  choice: en fera … l’aspersion
  rationale: Le verbe נזה désigne l’aspersion rituelle; cette formulation est claire et digne en français contemporain.
- source_word: אֶל נֹכַח פְּנֵי
  choice: en direction de l’entrée de
  rationale: L’expression indique une orientation vers la face antérieure de la tente; « entrée » rend concrètement cette façade sans suggérer que le rite se déroule à l’intérieur.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rendu transparent de la désignation cultuelle, sans recourir au terme plus interprétatif « tabernacle ».
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Correspondance directe de l’expression numérique hébraïque.
theological_decisions:
- issue: Orientation de l’aspersion par rapport à la tente
  choice: en direction de l’entrée de la tente
  alternative: devant la tente
  rationale: Le texte précise surtout la direction du geste vers la face de la tente; il ne dit pas nécessairement qu’Éléazar se trouve immédiatement devant elle.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure conserve la progression prescriptive du rituel et la répétition conceptuelle du sang, tout en évitant une lourde répétition nominale grâce à « en fera … l’aspersion ».
