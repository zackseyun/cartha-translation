  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/הּ יְכַבֵּ֤ס בְּגָדָי/ו֙ בַּ/מַּ֔יִם וְ/רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/טָמֵ֖א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: fr
  text: Celui qui la brûle lavera ses vêtements dans l’eau et lavera son corps dans l’eau[a] ; il sera impur[b] jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec de l’eau » dans les deux cas ; l’hébreu dit littéralement « dans l’eau ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « impur » désigne une impureté rituelle, et non nécessairement une faute morale.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: Celui qui l’aura brûlée
  rationale: Le participe substantivé désigne la personne chargée de la combustion. Le féminin « l’… brûlée » renvoie naturellement en français à la vache mentionnée dans le contexte.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Dans cette prescription rituelle, l’inaccompli a une valeur injonctive. « Vêtements » est courant et digne.
- source_word: בַּמַּיִם
  choice: dans l’eau
  rationale: La préposition ב avec l’article signifie littéralement « dans l’eau ». Le français rituel admet aussi « avec de l’eau », signalé en note.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: et se lavera le corps
  rationale: רחץ désigne ici le lavage du corps, tandis que כבס s’emploie pour les vêtements. « Le corps » rend idiomatiquement בשרו sans le littéralisme ambigu « sa chair ».
- source_word: וְטָמֵא
  choice: il sera impur
  rationale: Le terme énonce un état d’impureté rituelle. « Impur » est naturel en français biblique moderne et ne suppose pas en lui-même une faute morale.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Rendu direct de la limite temporelle, sans préciser interprétativement « jusqu’au coucher du soleil ».
theological_decisions:
- issue: Nature de l’impureté exprimée par טמא
  choice: impur
  alternative: rituellement impur
  rationale: Dans cette législation sacerdotale, il s’agit d’un statut rituel et non nécessairement d’une culpabilité morale. Le texte principal conserve le terme concis, tandis qu’une note explicite son sens contextuel.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique au futur conserve la force prescriptive du passage. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
