  source_fidelity: La construction hébraïque הַשֹּׂרֵף (« celui qui brûle ») est un participe substantivé désignant l’exécutant du rite. « Celui qui l’aura brûlée » introduit un futur antérieur absent du texte source. Le reste rend fidèlement le lavage des vêtements, le lavage du corps et le statut d’impureté jusqu’au soir.
  naturalness: Le français est clair et de registre juridique approprié. « Celui qui la brûle » est plus direct et idiomatique dans une prescription générale. « Lavera son corps » est plus naturel que « se lavera le corps » tout en conservant l’objet explicite du verbe hébreu.
  terminology: « Impur » est un équivalent établi de טָמֵא dans ce contexte; la note précise correctement qu’il s’agit d’une impureté rituelle, sans imputer une faute morale. « Dans l’eau » suit littéralement בַּמַּיִם; l’alternative indiquée en note est recevable.
