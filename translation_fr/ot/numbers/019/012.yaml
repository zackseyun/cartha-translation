id: NUM.19.12
reference: Numbers 19:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: fr
  text: Il se purifiera avec elle le troisième jour et le septième jour[a], et il sera pur. Mais s’il ne se purifie pas le troisième jour et le septième jour[b], il ne sera pas pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire avec l’eau de purification préparée plus haut dans le chapitre.
    reason: cross_reference
  - marker: b
    text: Ou « ne se soumet pas au rite de purification ». Le verbe hébreu désigne ici la purification rituelle qui enlève l’impureté.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: se purifiera / se purifie
  rationale: Dans ce contexte rituel, le hitpael de חטא désigne l’accomplissement du rite qui enlève l’impureté, et non le fait de pécher. « Se purifier » est naturel en français et conserve la valeur réfléchie.
- source_word: בּוֹ
  choice: avec elle
  rationale: Le pronom renvoie le plus naturellement à l’eau de purification mentionnée auparavant. « Avec elle » préserve cette référence pronominale sans explicitation excessive dans le texte.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: Formulation temporelle idiomatique et proche de l’hébreu.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: et le septième jour
  rationale: Conserve la coordination hébraïque et les deux étapes prescrites du rite.
- source_word: יִטְהָר
  choice: il sera pur
  rationale: טהר exprime ici l’état de pureté rituelle qui résulte du rite. Ce choix distingue le résultat de l’action exprimée par יתחטא.
- source_word: וְאִם לֹא
  choice: Mais s’il ne… pas
  rationale: La conjonction introduit une condition contrastive; « mais » rend naturellement la portée d’avertissement en français.
- source_word: הוּא
  choice: Il
  rationale: Le pronom masculin singulier explicite est conservé; dans le contexte, il renvoie à la personne devenue impure.
theological_decisions:
- issue: Nature de la purification en Nombres 19
  choice: Employer le vocabulaire de la pureté rituelle
  alternative: Employer un langage général de pardon moral ou de sanctification intérieure
  rationale: Le contexte concerne l’impureté contractée au contact d’un mort et l’eau prescrite pour la purification. Le verset décrit un statut rituel, sans affirmer directement un pardon moral ou une purification intérieure.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « le troisième jour et le septième jour » est maintenue pour respecter l’insistance et la structure conditionnelle de l’hébreu. « Pur » est compris au sens rituel dans ce contexte.
