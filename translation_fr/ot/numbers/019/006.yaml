- from: Puis le prêtre prendra du bois de cèdre, de l’hysope et du fil écarlate, et les jettera au milieu du brasier où brûle la vache.[a]
  to: Puis le prêtre prendra du bois de cèdre, de l’hysope et du fil écarlate, et les jettera au milieu de la combustion de la vache.[a]
  rationale: La révision restitue la construction nominale « combustion de la vache » et corrige la note afin que l’alternative « génisse » porte bien sur le nom de l’animal, sans altérer le sens du rite.
