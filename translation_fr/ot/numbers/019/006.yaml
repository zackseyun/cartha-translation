review_pass:
  verdict: revise
  source_fidelity: La séquence rituelle, les trois objets et l’action de les jeter sont correctement rendus. Toutefois, « brasier où brûle la vache » paraphrase le nom hébreu « combustion/brûlage de la vache » et la note proposée déforme l’alternative en faisant de la génisse ce qui brûle, plutôt que l’animal brûlé.
  naturalness: Le futur prescriptif et le registre sont naturels. « Au milieu de la combustion de la vache » est plus formel, mais convient au style rituel et reflète exactement la construction nominale hébraïque.
  terminology: « Prêtre », « bois de cèdre », « hysope » et « fil écarlate » sont appropriés. « Vache » rend פָּרָה sans imposer l’âge plus précis que suppose parfois « génisse »; l’alternative traditionnelle doit être signalée sans modifier la relation syntaxique.
  issues:
  - severity: medium
    issue: La note inverse la relation exprimée par le texte source.
    rationale: « ce qui brûle la génisse » présente la génisse comme objet d’un brûlage non identifié, alors que l’hébreu dit littéralement « la combustion/le brûlage de la vache ». La note doit conserver cette construction et ne pas introduire un causal implicite.
  - severity: low
    issue: « Brasier où brûle la vache » est une paraphrase moins précise de שְׂרֵפַת הַפָּרָה.
    rationale: Le terme hébreu est un nom désignant la combustion ou le brûlage. Une formulation nominale française préserve mieux l’expression source et l’ambiguïté sur la manière de conceptualiser le feu.
  revised_text: Puis le prêtre prendra du bois de cèdre, de l’hysope et du fil écarlate, et les jettera au milieu de la combustion de la vache.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou : « au milieu de la combustion de la génisse » ; le mot hébreu peut désigner une vache ou une génisse.'
    reason: alternative_reading
  revision_rationale: La révision restitue la construction nominale « combustion de la vache » et corrige la note afin que l’alternative « génisse » porte bien sur le nom de l’animal, sans altérer le sens du rite.
