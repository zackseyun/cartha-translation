  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: fr
  text: Puis le prêtre prendra du bois de cèdre, de l’hysope et du fil écarlate, et les jettera au milieu de la combustion de la vache.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au milieu de la combustion de la génisse » ; le mot hébreu peut désigner une vache ou une génisse.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis ... prendra
  rationale: Le waw suivi du qatal poursuit la séquence prescrite du rite. Le futur français exprime naturellement l’instruction légale et l’enchaînement des actes.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent courant de כֹּהֵן dans un contexte cultuel, avec conservation de l’article défini.
- source_word: עֵץ אֶרֶז
  choice: du bois de cèdre
  rationale: Le syntagme construit signifie littéralement « bois de cèdre »; cette formulation est naturelle et précise la matière.
- source_word: וְאֵזוֹב
  choice: de l’hysope
  rationale: Équivalent traditionnel et usuel de אֵזוֹב, malgré l’incertitude concernant l’identification botanique exacte.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: du fil écarlate
  rationale: Le syntagme désigne une matière teinte en écarlate à l’aide d’un colorant associé à la cochenille. « Fil écarlate » convient à l’objet rituel sans traduire littéralement la référence au ver.
- source_word: וְהִשְׁלִיךְ
  choice: et les jettera
  rationale: Le hiphil de שלך signifie « jeter ». Le pronom « les » explicite en français naturel que les trois éléments précédents sont jetés.
- source_word: אֶל תּוֹךְ
  choice: au milieu de
  rationale: L’expression indique l’intérieur ou le cœur du processus de combustion, et non une simple proximité.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: du brasier où brûle la vache
  rationale: שְׂרֵפָה désigne ici la combustion en cours. Cette formulation française naturelle conserve l’idée du processus plutôt que de réduire l’expression au seul « feu ».
theological_decisions:
- issue: Traduction de פָּרָה dans le rite de purification de la vache rousse
  choice: vache
  alternative: génisse
  rationale: פָּרָה désigne un bovin femelle sans imposer ici un terme français technique lié à l’âge. « Vache » est clair et conforme au contexte; « génisse », fréquent dans la tradition biblique, reste une possibilité lexicale.
translation_notes:
  register: Français international moderne, clair et digne. Le futur garde le caractère prescriptif du rituel; « brasier où brûle » évite la lourdeur de « combustion de la vache » tout en préservant l’action en cours.
