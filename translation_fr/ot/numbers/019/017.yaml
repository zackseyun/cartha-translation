  source_fidelity: 'Le texte rend avec fidélité les principaux éléments de l’hébreu : le bénéficiaire en état d’impureté, la valeur partitive de מִן (« un peu de »), la « poussière » de la combustion, la fonction purificatrice de חַטָּאת, l’eau vive et le récipient. L’alternance « ils prendront … on versera » restitue naturellement en français le passage du pluriel au singulier indéfini sans surinterpréter son référent. « Versera » est une explicitation idiomatique acceptable de נתן lorsqu’il s’agit d’eau.'
