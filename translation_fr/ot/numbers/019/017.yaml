  variant: modern international French
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: fr
  text: Pour la personne impure, ils prendront un peu de la poussière provenant de la combustion de l’offrande de purification[a], puis on versera dessus de l’eau vive[b] dans un récipient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « des cendres provenant de la combustion du sacrifice pour le péché ». L’hébreu emploie le mot « poussière » et le nom חַטָּאת, qui peut désigner, dans les textes sacerdotaux, un sacrifice pour le péché ou une offrande ayant une fonction de purification.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de l’eau vivante », c’est-à-dire de l’eau fraîche provenant d’une source vive ou d’un courant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַטָּמֵא
  choice: pour la personne impure
  rationale: L’adjectif substantivé désigne ici une personne en état d’impureté rituelle. Cette formulation reste claire et n’assimile pas cette impureté à une faute morale.
- source_word: מֵעֲפַר
  choice: un peu de la poussière
  rationale: עָפָר signifie proprement « poussière » ou matière pulvérulente, et la préposition מִן a ici une valeur partitive. Le terme traditionnel « cendres » est signalé en note.
- source_word: שְׂרֵפַת הַחַטָּאת
  choice: la combustion de l’offrande de purification
  rationale: « Combustion » rend le nom verbal שְׂרֵפָה, tandis que « offrande de purification » exprime la fonction rituelle de חַטָּאת dans ce contexte sacerdotal.
- source_word: וְנָתַן
  choice: puis on versera
  rationale: Le texte passe d’un verbe au pluriel à un verbe au singulier. Le pronom indéfini « on » rend naturellement en français cet agent singulier non identifié sans lui attribuer une identité précise.
- source_word: מַיִם חַיִּים
  choice: de l’eau vive
  rationale: Cette expression conserve l’image hébraïque d’une eau « vivante », c’est-à-dire fraîche et provenant d’une source ou d’un courant. Une note en explicite le sens rituel.
- source_word: אֶל כֶּלִי
  choice: dans un récipient
  rationale: La préposition indique que le mélange est placé dans un contenant. « Récipient » est naturel en français moderne tout en convenant au contexte rituel.
theological_decisions:
- issue: Sens de חַטָּאת dans le rite de la vache rousse
  choice: offrande de purification
  alternative: sacrifice pour le péché
  rationale: Le contexte porte sur l’élimination d’une impureté rituelle. « Offrande de purification » met en lumière cette fonction sans nier le sens traditionnel, conservé en note.
- issue: Portée de מַיִם חַיִּים
  choice: eau vive
  alternative: eau fraîche / eau courante
  rationale: La traduction littérale préserve l’image biblique et son éventuelle résonance, tandis que la note précise qu’il s’agit d’une eau provenant d’une source vive ou d’un courant.
- issue: Changement de nombre entre לָקְחוּ et וְנָתַן
  choice: ils prendront… on versera
  alternative: ils prendront… il versera
  rationale: Le changement grammatical de l’hébreu est perceptible sans supposer que le singulier désigne nécessairement une personne masculine précise.
translation_notes:
  register: Français international moderne, clair et digne. Le tour législatif au futur maintient le caractère prescriptif du passage. « Personne impure » précise qu’il s’agit d’un état rituel, et « récipient » évite un archaïsme inutile.
