id: NUM.19.15
reference: Numbers 19:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין צָמִ֥יד פָּתִ֖יל עָלָ֑י/ו טָמֵ֖א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: fr
  text: Tout récipient ouvert qui n’a pas de couvercle solidement attaché[a] est impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de couvercle fixé » ou « de fermeture scellée » ; l’expression hébraïque désigne une couverture maintenue sur le récipient.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְ/כֹל
  choice: Tout
  rationale: כֹל avec un nom singulier a ici une valeur distributive. En français, « Tout » rend naturellement la règle générale; la coordination וְ peut rester implicite dans ce verset autonome sans perte de sens.
- source_word: כְּלִי
  choice: récipient
  rationale: Dans ce contexte, כְּלִי désigne un objet servant de contenant. « Récipient » est plus courant et précis en français moderne que « vase », tout en restant assez large.
- source_word: פָתוּחַ
  choice: ouvert
  rationale: Rend directement l’adjectif hébreu; la proposition suivante précise que le récipient n’est pas fermé par une couverture fixée.
- source_word: אֲשֶׁר אֵין
  choice: qui n’a pas
  rationale: Formulation française naturelle exprimant l’absence indiquée par l’hébreu.
- source_word: צָמִיד פָּתִיל
  choice: de couvercle solidement attaché
  rationale: L’expression rare évoque une fermeture maintenue ou fixée sur le récipient. Cette traduction conserve l’idée concrète sans préciser indûment le mécanisme ancien.
- source_word: עָלָיו
  choice: '[implicite dans « a un couvercle »]'
  rationale: En français, la position du couvercle sur le récipient est inhérente à l’expression et n’exige pas l’ajout lourd de « sur lui ».
- source_word: טָמֵא הוּא
  choice: est impur
  rationale: Rend simplement le statut d’impureté exprimé par l’hébreu, sans ajouter « rituellement » dans le texte principal.
theological_decisions:
- issue: Nature de l’impureté
  choice: « est impur »
  alternative: « est rituellement impur »
  rationale: Le contexte concerne la pureté rituelle, mais le texte hébreu dit seulement טָמֵא. La formulation retenue préserve cette concision sans introduire d’explication dans le corps du verset.
- issue: Degré de fermeture du récipient
  choice: « couvercle solidement attaché »
  alternative: « couvercle scellé »
  rationale: « Scellé » pourrait suggérer une fermeture hermétique ou l’emploi d’un sceau, ce que l’expression hébraïque ne permet pas d’affirmer avec certitude.
translation_notes:
  register: Français international moderne, clair et digne. « Récipient » convient au contexte légal et matériel; « impur » maintient le vocabulaire biblique usuel sans surcharge explicative.
