source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: fr
  text: 'Mais l’homme qui devient impur et ne se purifie pas, cet homme sera retranché du milieu de l’assemblée[a], car il a rendu impur le sanctuaire de Yahvé. L’eau de purification n’a pas été aspergée sur lui[b] : il est impur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cette âme sera retranchée ». Dans cette formule juridique hébraïque, le mot traduit par « âme » peut désigner la personne tout entière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’eau d’impureté » ; traditionnellement : « l’eau de séparation ». Il s’agit de l’eau destinée à la purification, préparée selon les prescriptions de ce chapitre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: l’homme
  rationale: Le nom hébreu est masculin singulier et désigne ici, de manière représentative, un Israélite soumis à cette prescription.
- source_word: יִטְמָא
  choice: devient impur
  rationale: Le qal exprime ici l’entrée dans un état d’impureté rituelle, sans impliquer nécessairement une faute morale.
- source_word: יִתְחַטָּא
  choice: se purifie
  rationale: Dans ce contexte rituel, le hitpael de חטא désigne l’accomplissement de la purification requise, et non le fait de pécher.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: cette personne sera retranchée
  rationale: נפש désigne ici la personne entière dans une formule juridique. « Sera retranchée » conserve l’expression hébraïque sans préciser le mode de la sanction.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: du milieu de l’assemblée
  rationale: קהל désigne la communauté convoquée; cette formulation garde la portée communautaire et juridique de l’hébreu.
- source_word: מִקְדַּשׁ יְהוָה
  choice: le sanctuaire de Yahvé
  rationale: מקדש désigne le lieu saint ou sanctuaire. Le nom divin יהוה est translittéré « Yahvé » conformément à la couche française proposée.
- source_word: טִמֵּא
  choice: a rendu impur
  rationale: 'Le piel a ici une valeur causative : en demeurant impur, l’individu porte atteinte à la pureté rituelle du sanctuaire. Cette formulation maintient explicitement le champ lexical de l’impureté.'
- source_word: מֵי נִדָּה
  choice: l’eau de purification
  rationale: La locution désigne l’eau préparée dans ce chapitre pour ôter l’impureté contractée au contact d’un mort. Le français fonctionnel évite l’expression traditionnelle mais obscure « eau de séparation ».
- source_word: זֹרַק עָלָיו
  choice: n’a pas été répandue sur elle
  rationale: Dans ce rite, זרק désigne l’application de l’eau sur la personne. « Répandue sur » rend le geste sans suggérer nécessairement de fines gouttelettes.
- source_word: טָמֵא הוּא
  choice: elle est impure
  rationale: La proposition nominale prononce directement le statut rituel qui demeure celui de la personne.
theological_decisions:
- issue: Nature de la sanction exprimée par « retranchée »
  choice: Conserver la formule « sera retranchée » sans définir le mécanisme de la sanction.
  alternative: « sera exclue de la communauté » ou « sera mise à mort »
  rationale: La formule d’alliance ne précise pas ici s’il s’agit d’exclusion, de mort ou d’un jugement divin; la traduction préserve donc cette tension juridique et théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition du vocabulaire de l’impureté maintient la cohérence rituelle du passage. Le passage de « l’homme » à « cette personne », puis aux pronoms féminins grammaticaux, suit le genre du nom français « personne » sans modifier le référent.
