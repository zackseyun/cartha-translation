id: NUM.19.21
reference: Numbers 19:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: fr
  text: 'Ce sera pour eux une prescription permanente : celui qui asperge avec l’eau de purification[a] lavera ses vêtements, et celui qui touche cette eau sera impur jusqu’au soir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les eaux de l’impureté » ; on peut aussi traduire : « l’eau destinée à ôter l’impureté ». Traduction traditionnelle : « l’eau de séparation ».'
    reason: La construction hébraïque מֵי הַנִּדָּה est concise et ambiguë hors contexte ; la note préserve sa forme littérale ainsi que les principales possibilités de traduction.
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: Ce sera pour eux une prescription permanente
  rationale: La tournure rend la valeur normative et durable de חֻקַּת עוֹלָם dans ce contexte légal, dans un français actuel et digne.
- source_word: וּמַזֵּה מֵי הַנִּדָּה
  choice: celui qui asperge avec l’eau de purification
  rationale: Le participe désigne la personne qui accomplit l’aspersion rituelle. « Eau de purification » exprime naturellement en français la fonction de מֵי הַנִּדָּה dans Nombres 19, tandis que la formulation hébraïque plus littérale est signalée en note.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Le futur français convient à la formulation prescriptive et « vêtements » traduit clairement בְּגָדָיו.
- source_word: וְהַנֹּגֵעַ בְּמֵי הַנִּדָּה
  choice: et celui qui touche cette eau
  rationale: Le participe substantivé est rendu parallèlement par « celui qui ». Le démonstratif évite une répétition lourde sans obscurcir le référent.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: sera impur jusqu’au soir
  rationale: « Impur » conserve la terminologie rituelle, et « jusqu’au soir » est l’expression française idiomatique correspondant à la limite temporelle indiquée.
theological_decisions:
- issue: Nature de l’impureté évoquée
  choice: Employer « impur » au sens rituel
  alternative: Employer un vocabulaire suggérant une faute morale
  rationale: Le contexte traite de l’état rituel lié au contact avec un mort et à l’eau préparée selon le rite, non d’une culpabilité morale.
- issue: Sens de מֵי הַנִּדָּה
  choice: « l’eau de purification », avec le sens littéral en note
  alternative: « l’eau d’impureté » ou, selon la tradition, « l’eau de séparation »
  rationale: La traduction principale indique clairement la fonction rituelle de l’eau en français moderne, sans supprimer l’expression hébraïque difficile, conservée dans la note.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe parallèle du verset et son caractère juridique sont conservés, avec un vocabulaire accessible et une terminologie rituelle précise.
