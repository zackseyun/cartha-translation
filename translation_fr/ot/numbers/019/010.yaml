  - severity: medium
    issue: « se lavera les vêtements »
    rationale: Cette tournure est ambiguë et n’est pas l’expression usuelle pour laver ses habits. L’hébreu vise explicitement ses vêtements ; « lavera ses vêtements » est clair.
  - severity: low
    issue: « l’immigré »
    rationale: Bien que défendable, ce mot évoque facilement un statut administratif moderne. « L’étranger qui réside parmi eux » rend גֵּר הַגָּר de façon plus stable en français international, tout en conservant la résidence au sein de la communauté.
