source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: fr
  text: Celui qui recueille les cendres de la vache lavera ses vêtements et sera impur jusqu’au soir. Ce sera, pour les Israélites[a] et pour l’étranger qui réside parmi eux, une prescription permanente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël », expression collective désignant le peuple d’Israël.'
    reason: La note conserve la forme hébraïque tout en expliquant sa fonction collective.
  - marker: b
    text: 'Ou : « une prescription perpétuelle ».'
    reason: Cette variante reflète une autre traduction possible de עוֹלָם dans les formules légales.
lexical_decisions:
- source_word: הָאֹסֵף
  choice: celui qui aura recueilli
  rationale: Le participe qal substantivé désigne la personne chargée du ramassage. Le futur antérieur exprime naturellement en français l’action accomplie avant le lavage prescrit.
- source_word: אֵפֶר הַפָּרָה
  choice: les cendres de la vache
  rationale: אֵפֶר a ici un sens collectif, rendu idiomatiquement par « cendres ». פָּרָה désigne un bovin femelle; « vache » est précis et plus naturel en français moderne que « génisse », qui pourrait suggérer à tort que l’animal n’a jamais vêlé.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: se lavera les vêtements
  rationale: Dans les lois de pureté sacerdotales, le piel כִבֶּס désigne le lavage des vêtements. La tournure pronominale avec l’article possessif est idiomatique en français.
- source_word: וְטָמֵא
  choice: sera impur
  rationale: Le terme désigne un statut rituel, non une faute morale. « Impur » est le terme français usuel et précis dans ce contexte.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Formulation française naturelle qui reproduit la limite temporelle indiquée par l’hébreu.
- source_word: וְהָיְתָה
  choice: Ce sera
  rationale: Le féminin singulier renvoie à la prescription rituelle formulée dans le contexte. « Ce » rend cette référence implicite sans ajouter un substantif au texte principal.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les Israélites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Israël », mais fonctionne ici comme désignation collective du peuple. « Les Israélites » est clair, exact et inclusif en français courant.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: et pour l’immigré qui réside au milieu d’eux
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté. « Immigré qui réside » conserve à la fois son statut extérieur et la répétition étymologique גֵּר / גָּר, sans le sens passager de « voyageur ».
- source_word: לְחֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: חֻקָּה est une règle fixée, et עוֹלָם exprime ici sa durée continue dans le cadre légal de l’alliance. « Prescription permanente » est digne et compréhensible en français moderne.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Bien que la forme hébraïque signifie littéralement « fils d’Israël », il s’agit d’une expression collective désignant le peuple. Le choix évite de faire croire que la prescription ne concerne que les hommes; la forme littérale est signalée en note.
- issue: Langage de l’impureté rituelle
  choice: sera impur
  alternative: sera rituellement impur
  rationale: « Impur » préserve le vocabulaire juridique et cultuel du texte sans introduire dans le corps du verset une explicitation absente de l’hébreu. Le contexte de Nombres 19 établit qu’il s’agit d’un statut rituel, non moral.
- issue: Portée temporelle de עוֹלָם
  choice: permanente
  alternative: perpétuelle
  rationale: Le terme hébreu indique une validité durable et non limitée dans la formule légale, mais sa portée exacte dépend du cadre de l’alliance. « Permanente » conserve cette tension sans imposer une conclusion théologique sur une durée métaphysiquement infinie.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe adaptée au registre législatif. « Immigré » est employé au sens ancien-juridique d’un étranger établi parmi les Israélites, sans importer les catégories administratives contemporaines.
