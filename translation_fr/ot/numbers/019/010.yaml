  source_fidelity: 'Révision sûre nécessaire : le futur antérieur (« aura recueilli ») ajoute une antériorité que la formulation juridique hébraïque n’exprime pas explicitement, et « se lavera les vêtements » est ambigu en français, pouvant suggérer qu’il se lave lui-même. Le futur juridique simple et « lavera ses vêtements » rendent fidèlement le texte.'
  naturalness: Le français est globalement clair et de registre approprié. « L’étranger qui réside parmi eux » est toutefois plus neutre et moins tributaire des catégories administratives contemporaines que « l’immigré qui réside au milieu d’eux ».
  terminology: « Impur », dans ce contexte rituel, et « prescription permanente » conviennent. « Vache » rend correctement פָּרָה, sans présumer que l’animal soit une génisse. La note sur « les fils d’Israël » est utile.
