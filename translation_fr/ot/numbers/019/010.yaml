- from: Celui qui aura recueilli les cendres de la vache se lavera les vêtements et sera impur jusqu’au soir. Ce sera, pour les Israélites[a] et pour l’immigré qui réside au milieu d’eux, une prescription permanente[b].
  to: Celui qui recueille les cendres de la vache lavera ses vêtements et sera impur jusqu’au soir. Ce sera, pour les Israélites[a] et pour l’étranger qui réside parmi eux, une prescription permanente[b].
  rationale: La révision retire une nuance temporelle ajoutée, clarifie l’objet du lavage et emploie pour גֵּר une désignation moins anachroniquement administrative. Elle maintient les choix fidèles concernant la vache, l’impureté rituelle, la portée durable de la prescription et l’expression collective « fils d’Israël » signalée en note.
