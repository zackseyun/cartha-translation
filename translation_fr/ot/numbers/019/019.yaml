  variant: modern international French
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: fr
  text: La personne pure aspergera la personne impure le troisième jour et le septième jour. Elle la purifiera[a] le septième jour. La personne impure lavera alors ses vêtements, se baignera dans l’eau et sera pure le soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la débarrassera de son impureté ». Le verbe hébreu appartient à une racine souvent associée au péché, mais il désigne ici la purification rituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: aspergera
  rationale: Le hifil de נזה désigne ici l’application de l’eau de purification par aspersion. « Aspergera » exprime naturellement l’action rituelle sans devoir ajouter un complément absent du texte hébreu.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: la personne pure / la personne impure
  rationale: Les adjectifs substantivés désignent des personnes en état de pureté ou d’impureté rituelle. « Personne » rend leur portée représentative sans introduire une restriction masculine.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: le troisième jour et le septième jour
  rationale: Cette formulation française claire conserve les deux moments prescrits par le texte.
- source_word: וְחִטְּאוֹ
  choice: Elle la purifiera
  rationale: Dans ce contexte d’impureté contractée au contact d’un mort, le piel de חטא exprime l’enlèvement rituel de l’impureté, et non nécessairement le pardon d’une faute morale.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lavera alors ses vêtements
  rationale: « Laver ses vêtements » est l’équivalent moderne et direct de l’expression hébraïque. « Alors » marque naturellement la succession des actes sans ajouter de causalité doctrinale.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se baignera dans l’eau
  rationale: Le verbe רחץ implique ici que la personne lave son corps. La tournure pronominale rend explicite en français ce sens réflexif contextuel.
- source_word: וְטָהֵר בָּעָרֶב
  choice: sera pure le soir
  rationale: Le verbe indique l’état de pureté rituelle atteint au soir. « Le soir » est idiomatique en français moderne tout en conservant précisément l’indication temporelle.
theological_decisions:
- issue: Portée de חטא dans un rite de purification
  choice: Rendre le verbe par « purifier » au sens rituel
  alternative: « purifier du péché » ou « faire l’expiation pour »
  rationale: Le contexte porte sur l’impureté liée à un mort et sur l’eau de purification. Une formulation explicitement morale ou expiatoire importerait une affirmation que ce verset ne formule pas.
- issue: Genre des adjectifs substantivés הַטָּהֹר et הַטָּמֵא
  choice: Employer « la personne »
  alternative: « l’homme pur » et « l’homme impur »
  rationale: Bien que les formes hébraïques soient au masculin singulier, elles ont ici une fonction représentative dans une prescription juridique et ne limitent pas le rite aux hommes.
- issue: Sujet des actions de laver les vêtements et de se baigner
  choice: Expliciter « la personne impure » comme sujet
  alternative: Conserver un pronom susceptible de désigner la personne pure qui procède à l’aspersion
  rationale: Les verbes hébreux ont un sujet masculin singulier non exprimé, mais la séquence rituelle et le résultat « sera pure le soir » indiquent que la personne en cours de purification lave ses vêtements et se baigne. L’explicitation évite une ambiguïté artificielle en français.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère prescriptif du texte tout en évitant un style juridique archaïque. La répétition de « la personne » clarifie les participants au rite; les pronoms féminins sont imposés par le genre grammatical du mot « personne » et ne précisent pas le sexe des participants.
