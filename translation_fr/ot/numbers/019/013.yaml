source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: fr
  text: Toute personne qui touche un mort — le corps d’un être humain décédé — et qui ne se purifie pas souille le tabernacle de l’Éternel ; cette personne sera retranchée d’Israël. Puisque l’eau de purification[a] n’a pas été aspergée sur elle, elle restera impure ; son impureté demeure sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’eau d’impureté » ; il s’agit de l’eau utilisée pour enlever l’impureté contractée au contact d’un mort.'
    reason: La note préserve la formulation hébraïque tout en expliquant la fonction rituelle de cette eau.
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: qui touche un mort
  rationale: Le participe de נגע exprime ici un contact physique, et מֵת désigne le mort, précisé ensuite comme un corps humain.
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: le corps d’un être humain qui est décédé
  rationale: Dans ce contexte d’impureté liée à la mort, נֶפֶשׁ désigne concrètement le corps mort. אָדָם est générique ; « être humain » convient naturellement en français moderne.
- source_word: יִתְחַטָּא
  choice: se purifie
  rationale: 'Le hitpael de חטא a ici un sens rituel : accomplir la purification requise, et non se repentir moralement.'
- source_word: מִשְׁכַּן יְהוָה
  choice: le tabernacle de l’Éternel
  rationale: מִשְׁכָּן désigne la demeure-sanctuaire mobile. « Tabernacle » est le terme français précis et traditionnel ; « l’Éternel » rend le tétragramme de façon usuelle en français biblique.
- source_word: טִמֵּא
  choice: souille
  rationale: Le piel indique que la personne rend le sanctuaire rituellement impur ; « souille » exprime clairement cette profanation cultuelle.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: cette personne sera retranchée
  rationale: נֶפֶשׁ désigne ici l’individu. « Sera retranchée » conserve la formule de sanction sans en préciser abusivement le mode.
- source_word: מֵי נִדָּה
  choice: l’eau de purification
  rationale: L’expression signifie littéralement « eau d’impureté », mais désigne l’eau rituellement préparée pour enlever l’impureté contractée auprès d’un mort. La note conserve la forme hébraïque.
- source_word: זֹרַק עָלָיו
  choice: n’a pas été aspergée sur elle
  rationale: זרה décrit l’aspersion rituelle. Le passif français reflète le sens du contexte et le pronom reprend « personne ».
- source_word: טָמֵא יִהְיֶה
  choice: elle restera impure
  rationale: La proposition déclare la persistance de l’état d’impureté, explicitée par la dernière proposition.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: son impureté demeure sur elle
  rationale: עוֹד marque la continuité ; la formulation conserve l’image de l’impureté qui demeure attachée à la personne.
theological_decisions:
- issue: Sens de la sanction « être retranché »
  choice: Conserver « sera retranchée d’Israël » sans préciser le mécanisme.
  alternative: « sera mise à mort » ou « sera exclue de la communauté »
  rationale: La formule hébraïque est une sanction d’alliance forte, mais ce verset ne précise pas s’il s’agit de mort, d’exclusion communautaire ou d’un jugement divin. La traduction maintient cette ambiguïté.
- issue: Rapport entre l’impureté personnelle et le sanctuaire
  choice: Traduire directement que la personne « souille le tabernacle » même sans mention d’une entrée physique dans celui-ci.
  alternative: Ajouter qu’elle le souille seulement si elle y entre.
  rationale: Le texte hébreu établit directement ce rapport théologique et cultuel ; ajouter une condition absente résoudrait indûment la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La structure solennelle du droit rituel est conservée sans lourdeur excessive. Les pronoms féminins reprennent grammaticalement « personne » et ne restreignent pas la portée universelle du verset.
