  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: fr
  text: On brûlera la vache devant ses yeux ; sa peau, sa chair et son sang, avec ses excréments, on les brûlera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: On brûlera
  rationale: Le qatal précédé de waw s’inscrit dans une suite de prescriptions rituelles. Le futur français exprime naturellement ici l’action prescrite sans identifier plus précisément l’exécutant que ne le permet le verset isolé.
- source_word: הַפָּרָה
  choice: la vache
  rationale: פָּרָה désigne un bovin femelle. « Vache » est le terme français courant et exact ; le contexte précédent apporte les précisions rituelles nécessaires.
- source_word: לְעֵינָיו
  choice: sous ses yeux
  rationale: 'Cette expression conserve l’image concrète de l’hébreu tout en étant idiomatique en français : l’animal doit être brûlé en sa présence et sous son regard.'
- source_word: עֹרָהּ
  choice: sa peau
  rationale: עוֹר désigne la peau d’un animal. « Peau » est plus naturel et plus largement accessible que « cuir », lequel pourrait suggérer une matière déjà préparée.
- source_word: בְּשָׂרָהּ
  choice: sa chair
  rationale: « Chair » correspond directement à בָּשָׂר et convient au registre de la législation sacrificielle.
- source_word: דָּמָהּ
  choice: son sang
  rationale: Équivalent direct de דָּם muni du suffixe féminin singulier.
- source_word: עַל פִּרְשָׁהּ
  choice: avec ses excréments
  rationale: 'פֶּרֶשׁ désigne les excréments ou la fiente. Dans cette énumération, עַל marque l’ajout ou l’accompagnement : ils sont eux aussi compris dans ce qui est brûlé.'
- source_word: יִשְׂרֹף
  choice: on les brûlera
  rationale: L’imparfait hébreu a une valeur prescriptive. La reprise du verbe en fin de phrase reproduit l’insistance de l’original ; le pronom « les » permet une construction française naturelle avec l’énumération détachée.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition finale de « brûlera » ainsi que l’énumération sont maintenues pour préserver la structure insistante de l’hébreu. Le pronom indéfini « on » évite en français une succession pesante de « il » dont le référent dépend du contexte précédent.
