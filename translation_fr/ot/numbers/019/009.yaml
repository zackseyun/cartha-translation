source:
  edition: WLC
  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: fr
  text: Un homme rituellement pur recueillera les cendres de la vache et les déposera hors du camp, dans un lieu rituellement pur. Elles seront conservées pour la communauté des Israélites, pour les eaux de l’impureté[a]. C’est une offrande pour le péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pour des eaux d’impureté ». On peut aussi comprendre « pour l’eau de séparation » ou « pour l’eau de purification ».
    reason: lexical_alternative
  - marker: b
    text: Ou « C’est une offrande de purification ». Le mot hébreu חַטָּאת peut désigner une offrande pour le péché et, dans les textes rituels, une offrande ayant une fonction purificatrice.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: un homme rituellement pur
  rationale: אִישׁ est masculin singulier, et טָהוֹר désigne ici l’état de pureté rituelle. L’explicitation évite que « pur » soit compris seulement au sens moral.
- source_word: וְאָסַף
  choice: recueillera
  rationale: Le qatal avec waw poursuit la série de prescriptions rituelles. Le futur français convient naturellement à cette valeur injonctive et procédurale.
- source_word: אֵפֶר הַפָּרָה
  choice: les cendres de la vache
  rationale: אֵפֶר est collectif et se rend naturellement au pluriel en français. פָּרָה désigne une femelle bovine; « vache » est ici plus courant et exact que « génisse », qui impliquerait précisément une jeune femelle.
- source_word: וְהִנִּיחַ
  choice: et les déposera
  rationale: Le verbe signifie poser, déposer ou laisser. « Déposera » convient au placement intentionnel des cendres dans un lieu réservé.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: La tournure est locative dans ce contexte. « Hors du camp » est naturelle et conserve le registre biblique dignifié.
- source_word: בְּמָקוֹם טָהוֹר
  choice: dans un endroit rituellement pur
  rationale: Le contexte cultuel donne à טָהוֹר un sens rituel; l’explicitation assure la clarté pour le lecteur moderne.
- source_word: וְהָיְתָה ... לְמִשְׁמֶרֶת
  choice: elles seront conservées
  rationale: Le singulier hébreu reprend probablement la cendre comme collectif, tandis que le français reprend naturellement « les cendres » au pluriel. לְמִשְׁמֶרֶת exprime la mise en réserve ou la conservation.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: pour la communauté des Israélites
  rationale: עֲדָה désigne la communauté ou l’assemblée. « Les Israélites » rend naturellement בְּנֵי יִשְׂרָאֵל sans suggérer qu’il s’agit uniquement des hommes adultes.
- source_word: לְמֵי נִדָּה
  choice: afin de préparer l’eau qui ôte l’impureté
  rationale: Littéralement, la construction évoque une « eau d’impureté » ou « eau de séparation ». Dans ce rite, cette eau sert à enlever l’impureté; la formulation dynamique exprime clairement sa fonction tout en signalant en note la difficulté lexicale.
- source_word: חַטָּאת הִוא
  choice: C’est une offrande pour le péché
  rationale: חַטָּאת peut désigner le péché ou l’offrande rituelle qui s’y rapporte. « Offrande pour le péché » conserve le terme traditionnel sans effacer la fonction purificatrice, donnée en note.
theological_decisions:
- issue: Sens de חַטָּאת dans un rite de purification
  choice: C’est une offrande pour le péché
  alternative: C’est une offrande de purification
  rationale: Le terme hébreu peut nommer une offrande liée au péché tout en mettant, dans les textes sacerdotaux, l’accent sur sa fonction purificatrice. Le texte principal garde la valeur lexicale traditionnelle et la note préserve l’autre analyse.
- issue: Fonction de מֵי נִדָּה
  choice: l’eau qui ôte l’impureté
  alternative: l’eau d’impureté; l’eau de séparation
  rationale: Le génitif hébreu est condensé et peut être compris en rapport avec l’impureté ou son élimination. Le contexte indique la fonction purificatrice, mais les rendus plus formels sont conservés en note afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international actuel, clair et dignifié. Le futur exprime la prescription rituelle. Les expressions « rituellement pur » rendent explicite le domaine cultuel, tandis que les notes préservent les ambiguïtés de נִדָּה et חַטָּאת.
