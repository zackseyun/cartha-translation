review_pass:
  verdict: revise
  source_fidelity: La formulation « afin de préparer l’eau qui ôte l’impureté » explicite et fixe indûment la relation condensée de לְמֵי נִדָּה. Le texte hébreu dit littéralement que les cendres seront gardées « pour des eaux d’impureté/de séparation »; le contexte établit un emploi purificatoire, mais le verbe « ôte » et l’idée de « préparer » ne sont pas exprimés dans ce verset. Le reste rend fidèlement la séquence rituelle, le singulier collectif des cendres et la qualification cultuelle de la pureté.
  naturalness: Le français est clair, actuel et d’un registre approprié. « Lieu rituellement pur » est légèrement plus naturel et plus concis que « endroit rituellement pur ». « Eaux de l’impureté » reste une expression rituelle volontairement formelle, éclairée par une note.
  terminology: « Homme rituellement pur », « communauté des Israélites » et « offrande pour le péché » conviennent. « Vache » traduit exactement פָּרָה sans imposer l’âge plus spécifique que pourrait suggérer « génisse ». La note sur חַטָּאת préserve utilement l’alternative « offrande de purification ».
  issues:
  - severity: medium
    issue: La fonction des « eaux » est surinterprétée dans le texte principal.
    rationale: « Afin de préparer l’eau qui ôte l’impureté » ajoute une action de préparation et affirme directement l’élimination de l’impureté. Ces éléments relèvent du contexte rituel plus large, non de la formulation exacte de Nombres 19:9. Une expression plus proche du génitif hébreu conserve l’ambiguïté signalée par la note.
  revised_text: Un homme rituellement pur recueillera les cendres de la vache et les déposera hors du camp, dans un lieu rituellement pur. Elles seront conservées pour la communauté des Israélites, pour les eaux de l’impureté[a]. C’est une offrande pour le péché[b].
  revised_footnotes:
