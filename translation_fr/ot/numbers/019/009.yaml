revisions:
- from: Un homme rituellement pur recueillera les cendres de la vache et les déposera hors du camp, dans un endroit rituellement pur. Elles seront conservées pour la communauté des Israélites, afin de préparer l’eau qui ôte l’impureté[a]. C’est une offrande pour le péché[b].
  to: Un homme rituellement pur recueillera les cendres de la vache et les déposera hors du camp, dans un lieu rituellement pur. Elles seront conservées pour la communauté des Israélites, pour les eaux de l’impureté[a]. C’est une offrande pour le péché[b].
  rationale: La révision retire une paraphrase interprétative de לְמֵי נִדָּה et rétablit une formulation française suffisamment littérale pour conserver la densité et l’ambiguïté du terme hébreu. Les notes maintiennent les lectures idiomatiques et rituelles possibles. Aucune autre modification de sens n’est nécessaire.
