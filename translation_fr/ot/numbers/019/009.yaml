    text: Ou « C’est une offrande de purification ». Le mot hébreu חַטָּאת peut désigner une offrande pour le péché et, dans les textes rituels, une offrande ayant une fonction purificatrice.
    reason: alternative_reading
  revision_rationale: La révision retire une paraphrase interprétative de לְמֵי נִדָּה et rétablit une formulation française suffisamment littérale pour conserver la densité et l’ambiguïté du terme hébreu. Les notes maintiennent les lectures idiomatiques et rituelles possibles. Aucune autre modification de sens n’est nécessaire.
