  text: וְ/כִבֶּ֨ס בְּגָדָ֜י/ו הַ/כֹּהֵ֗ן וְ/רָחַ֤ץ בְּשָׂר/וֹ֙ בַּ/מַּ֔יִם וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/טָמֵ֥א הַ/כֹּהֵ֖ן עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: fr
  text: Alors le prêtre lavera ses vêtements et lavera son corps dans l’eau. Après cela, il entrera dans le camp[a], mais le prêtre sera impur jusqu’au soir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il pourra entrer dans le camp ». L’imparfait hébreu peut être compris comme l’autorisation d’entrer après les ablutions.
    reason: lexical_alternative
  - marker: b
    text: Ici, « impur » désigne une impureté rituelle, et non nécessairement un péché personnel ou une faute morale.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Le piel de כבס désigne ici le lavage des vêtements. Le futur français convient au style prescriptif de cette procédure rituelle.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: se baignera le corps dans l’eau
  rationale: רחץ avec בשר désigne le lavage du corps. « Se baignera le corps » distingue naturellement cette action du lavage des vêtements tout en conservant la mention explicite du corps.
- source_word: וְאַחַר
  choice: Après quoi
  rationale: Cette expression marque clairement la succession des étapes prescrites.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: il pourra rentrer dans le camp
  rationale: Dans ce contexte procédural, l’imparfait hébreu peut exprimer la possibilité de réintégrer le camp après le lavage. « Rentrer » rend naturellement l’idée d’un retour dans le camp.
- source_word: וְטָמֵא הַכֹּהֵן
  choice: mais il restera impur
  rationale: 'Le waw introduit ici un contraste avec son retour désormais permis : malgré celui-ci, son état d’impureté se prolonge. « Impur » est le terme français usuel pour le statut rituel exprimé par טמא.'
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Formulation française naturelle et précise pour la limite temporelle indiquée par l’hébreu.
theological_decisions:
- issue: Nature de l’impureté
  choice: impureté rituelle temporaire
  alternative: faute morale ou péché personnel
  rationale: Dans le contexte de Nombres 19, טמא désigne un statut rituel lié au rite de purification. Le texte n’attribue pas nécessairement au prêtre une faute morale.
- issue: Valeur de יָבֹא après les ablutions
  choice: permission de rentrer dans le camp
  alternative: 'simple annonce ou prescription : « il rentrera dans le camp »'
  rationale: Le contexte permet de comprendre la forme verbale comme autorisant le retour après le lavage, sans effacer l’autre lecture grammaticale possible, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le futur maintient le caractère prescriptif du passage; le vocabulaire rituel traditionnel est conservé sans archaïsme inutile.
