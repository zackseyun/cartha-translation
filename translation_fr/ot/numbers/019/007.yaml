    issue: Formulation « se baignera le corps »
    rationale: Cette construction est peu naturelle en français contemporain. Le verbe pronominal « se baigner » ne se construit pas normalement avec « le corps » comme complément direct dans ce sens rituel.
  - severity: low
    issue: « pourra rentrer dans le camp » interprète et restreint le verbe hébreu
    rationale: יִבֹא signifie littéralement « il entrera/viendra dans le camp ». « Rentrer » ajoute l’idée d’un retour, et « pourra » privilégie la permission. Une formulation neutre préserve mieux la valeur procédurale de l’imparfait; la possibilité permissive peut être signalée en note.
  revised_text: Alors le prêtre lavera ses vêtements et lavera son corps dans l’eau. Après cela, il entrera dans le camp[a], mais le prêtre sera impur jusqu’au soir[b].
