review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu prescrit le lavage des vêtements, le lavage du corps dans l’eau, puis l’entrée dans le camp, tout en maintenant le statut d’impureté jusqu’au soir. « Entrer dans le camp » rend אֶל־הַמַּחֲנֶה sans ajouter l’idée, seulement contextuellement possible, d’un retour.
  naturalness: « Se baignera le corps » n’est pas idiomatique en français moderne. « Lavera son corps dans l’eau » est naturel, précis et convient au registre rituel. « Entrera dans le camp » est plus neutre que « pourra rentrer ».
  terminology: « Prêtre », « vêtements », « corps », « camp » et « impur » sont appropriés. La note explique utilement que l’impureté est rituelle, sans lui attribuer un sens moral.
  issues:
