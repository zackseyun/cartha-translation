  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: fr
  text: 'Voici la loi : lorsqu’un homme meurt dans une tente, toute personne qui entre dans la tente et toute personne qui s’y trouve[a] seront impures pendant sept jours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui se trouve dans la tente ». L’expression hébraïque peut avoir un sens plus large, mais le contexte et le verbe au singulier favorisent ici une référence aux personnes présentes ; les récipients sont traités explicitement au verset suivant.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Voici la loi
  rationale: Dans ce contexte, תּוֹרָה introduit la règle qui régit l’impureté liée à un cadavre. « La loi » exprime naturellement son caractère normatif en français.
- source_word: אָדָם כִּי יָמוּת
  choice: lorsqu’un homme meurt
  rationale: אָדָם est ici un singulier générique, et כִּי introduit le cas envisagé par la règle. « Lorsqu’un homme meurt » reste proche de la forme hébraïque et convient au style juridique.
- source_word: בְּאֹהֶל
  choice: dans une tente
  rationale: La première occurrence d’אֹהֶל est sans article et introduit la situation; l’indéfini français est donc approprié.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: toute personne qui entre dans la tente
  rationale: Le participe précédé de כָּל désigne ici quiconque entre. Cette formulation est claire et naturelle en français moderne.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: et toute personne qui s’y trouve
  rationale: L’expression hébraïque peut être plus large, mais le parallélisme avec la personne qui entre et le verbe au singulier favorisent une référence aux personnes présentes. « S’y trouve » évite une répétition lourde.
- source_word: יִטְמָא
  choice: sera impure
  rationale: Le futur français exprime naturellement la conséquence fixée par cette règle rituelle. « Impure » est le terme usuel pour l’état cultuel désigné par טמא.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: L’ajout de « pendant » rend explicitement et naturellement la durée indiquée par l’hébreu.
