source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר introduit un nouvel acte de parole dans le récit. « Parla » rend naturellement cette formule narrative en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription usuelle « Yahweh », afin de préserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: La préposition אֶל désigne les destinataires de la parole. En français, sa répétition devant le second nom n'est pas nécessaire pour conserver le sens.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Dans cette formule d''introduction au discours, « en ces termes : » annonce idiomatiquement en français les paroles qui suivent, tout en maintenant le lien formel avec le verset suivant.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre ni retenir la forme hybride traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, digne et naturel. La formulation conserve la solennité de l'introduction divine sans employer de tournure archaïque.
