base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: fr
  text: 'Parle aux fils d’Israël[a] et prends-leur, à tous leurs chefs selon leurs maisons paternelles, un bâton pour chaque maison paternelle : douze bâtons[b]. Tu écriras le nom de chacun sur son bâton.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux Israélites ». L’hébreu dit littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « verges ». Le mot hébreu מַטֶּה peut désigner un bâton ou une verge; ici, il s’agit d’un objet concret.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque et sa référence masculine explicite; « les Israélites » serait plus idiomatique mais moins transparent.
- source_word: מַטֶּה
  choice: bâton
  rationale: Le mot peut désigner un bâton ou une verge, et par extension une tribu. Ici, il s’agit de l’objet concret sur lequel un nom est écrit.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: un bâton pour chaque maison paternelle
  rationale: La répétition distributive de מַטֶּה est rendue naturellement par « un… pour chaque », tandis que « maison paternelle » conserve la structure sociale ancestrale du texte.
- source_word: נְשִׂיאֵיהֶם
  choice: leurs chefs
  rationale: Le terme désigne ici les responsables des groupes tribaux; « chefs » est précis et n’introduit pas la nuance royale que pourrait suggérer « princes ».
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: La locution indique le principe d’organisation des chefs et des bâtons, en fonction des groupes ancestraux.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: douze bâtons
  rationale: Traduction directe qui maintient la cohérence lexicale avec les emplois précédents de מַטֶּה.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: Tu écriras le nom de chaque homme
  rationale: « Chaque homme » restitue la valeur distributive de אִישׁ et précise qu’un nom correspond à chaque bâton.
- source_word: עַל מַטֵּהוּ
  choice: sur son bâton
  rationale: Rendu direct et naturel de la relation entre chaque chef et le bâton qui lui correspond.
