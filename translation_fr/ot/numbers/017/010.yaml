id: NUM.17.10
reference: Numbers 17:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: fr
  text: « Éloignez-vous du milieu de cette communauté[a], afin que je les anéantisse en un instant[b]. » Alors ils tombèrent face contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Élevez-vous du milieu de cette communauté »; ou : « Séparez-vous de cette assemblée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que je les fasse disparaître en un moment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: Éloignez-vous
  rationale: Le nifal impératif pluriel de רום signifie littéralement « élevez-vous », mais, avec מִתּוֹךְ dans ce contexte, il commande idiomatiquement de se retirer du groupe menacé. « Éloignez-vous » exprime clairement ce mouvement sans en faire une séparation doctrinale ou permanente.
- source_word: מִתּוֹךְ
  choice: du milieu de
  rationale: Cette expression marque le départ depuis l’intérieur du groupe et suit de près la construction hébraïque tout en restant naturelle en français.
- source_word: הָעֵדָה הַזֹּאת
  choice: cette communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël. « Communauté » est moderne, compréhensible et moins susceptible que « congrégation » d’évoquer uniquement une assemblée cultuelle.
- source_word: וַאֲכַלֶּה
  choice: afin que je les anéantisse
  rationale: Le piel de כלה exprime ici le fait de mener entièrement à son terme, donc d’exterminer ou d’anéantir. « Anéantisse » conserve la gravité et la totalité du jugement annoncé; « afin que » rend le rapport avec l’impératif précédent.
- source_word: כְּרָגַע
  choice: en un instant
  rationale: La locution indique un laps de temps extrêmement bref. « En un instant » est idiomatique et précis.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: Alors ils tombèrent face contre terre
  rationale: Le wayyiqtol poursuit la narration et « alors » marque naturellement la réaction immédiate. « Face contre terre » transmet clairement la posture de prosternation exprimée par l’idiome hébraïque.
theological_decisions:
- issue: Nature de l’ordre divin adressé à Moïse et Aaron
  choice: L’ordre est rendu comme une injonction urgente à s’éloigner de la communauté avant un jugement divin imminent.
  alternative: « Élevez-vous du milieu de cette communauté » ou « Séparez-vous de cette assemblée »
  rationale: Le contexte fait de הֵרֹמּוּ un ordre de retrait. La formulation retenue ne diminue ni l’urgence de l’ordre ni la sévérité de la menace, sans préciser davantage la nature de la prosternation qui suit.
- issue: Valeur de וַאֲכַלֶּה après l’impératif
  choice: « afin que je les anéantisse »
  alternative: « et je les anéantirai »
  rationale: La forme cohortative exprime la volonté ou l’intention divine liée au retrait demandé. La traduction finale conserve ce lien sans transformer l’énoncé en simple prédiction.
translation_notes:
  register: Français international moderne, digne et direct. « Communauté » rend le sens collectif de עֵדָה sans coloration confessionnelle marquée. « Face contre terre » est préféré à « sur leurs faces », trop calqué en français contemporain.
