  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Puis Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque et la traduction traditionnelle du nom divin.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis ... parla
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement la succession, et « parla » rend דבר sans le confondre avec la formule introductive qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération usuelle en français conserve le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל indique ici le destinataire de la parole ; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Dans cette formule, l’infinitif introduit les paroles qui suivent. « En ces termes : » remplit naturellement cette fonction en français moderne sans ajouter de contenu.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre tout en signalant en note la convention traditionnelle française.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient à la narration biblique écrite ; « en ces termes » introduit naturellement le discours direct annoncé au verset suivant.
