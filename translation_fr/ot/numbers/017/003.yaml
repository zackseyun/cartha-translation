- from: Quant aux encensoirs de ces hommes qui ont péché au prix de leur vie[a], qu’on les transforme en plaques martelées pour recouvrir l’autel, car ils les ont présentés devant Yahweh et ils sont devenus saints[b]. Ils serviront de signe aux Israélites.
