  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: fr
  text: Quant aux encensoirs de ces hommes qui ont péché au prix de leur vie[a], qu’on les transforme en plaques martelées pour recouvrir l’autel, car ces hommes les ont présentés devant Yahweh, et ces encensoirs sont devenus saints[b]. Ils serviront de signe aux Israélites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les encensoirs de ces pécheurs, au prix de leur vie » ; on peut aussi comprendre : « contre leur propre vie ». Leur péché leur a coûté la vie.'
    reason: La formule hébraïque associe les pécheurs à leur propre vie et, dans le contexte, exprime le caractère mortel de leur péché.
  - marker: b
    text: 'Ou : « ils ont été consacrés ». Le sujet est très probablement les encensoirs.'
    reason: Le verbe peut exprimer l’entrée dans un état de sainteté ou la consécration ; les encensoirs sont le référent contextuel le plus probable.
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: encensoirs
  rationale: Dans le contexte cultuel de la révolte, il s’agit des récipients où l’on faisait brûler l’encens; « encensoirs » est le terme français courant et précis.
- source_word: הַחַטָּאִים הָאֵלֶּה
  choice: ces hommes qui ont péché
  rationale: La tournure verbale conserve la valeur événementielle du participe hébreu sans figer les hommes sous la seule étiquette de « pécheurs ».
- source_word: בְּנַפְשֹׁתָם
  choice: au prix de leur vie
  rationale: Cette expression idiomatique rend le sens contextuel d’un péché qui leur a coûté la vie, tout en évitant d’imposer une distinction anthropologique entre âme et corps.
- source_word: וְעָשׂוּ אֹתָם
  choice: qu’on les transforme
  rationale: Le contexte prolonge l’ordre du verset précédent. « Transformer » exprime naturellement en français la refonte fonctionnelle des encensoirs en plaques, sans préciser à tort les artisans.
- source_word: רִקֻּעֵי פַחִים
  choice: plaques martelées
  rationale: Le syntagme désigne du métal battu et aplati en plaques; cette formulation est claire et proche de l’image hébraïque.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: pour recouvrir l’autel
  rationale: L’infinitif français exprime naturellement la destination des plaques comme revêtement de l’autel.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: car ils les ont présentés devant Yahweh
  rationale: « Présenter » convient à l’action cultuelle portant sur des encensoirs et « devant » conserve la spatialité relationnelle de לִפְנֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וַיִּקְדָּשׁוּ
  choice: ils sont devenus saints
  rationale: Le pluriel renvoie le plus naturellement aux encensoirs; la formulation préserve le résultat cultuel sans expliciter une agence absente du texte.
- source_word: וְיִהְיוּ לְאוֹת
  choice: Ils serviront de signe
  rationale: Cette formulation française naturelle conserve la fonction de signe ou de mémorial sans en développer ici le contenu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Équivalent collectif moderne et inclusif de l’expression idiomatique « fils d’Israël », désignant le peuple d’Israël.
theological_decisions:
- issue: Référent de « ils sont devenus saints »
  choice: Le pronom renvoie aux encensoirs, devenus saints après avoir été présentés devant Yahweh.
  alternative: Le verbe pourrait être compris comme se rapportant aux hommes, ou comme signifiant seulement que les objets ont été consacrés.
  rationale: Les encensoirs constituent l’antécédent pluriel le plus naturel et leur statut sacré explique pourquoi ils doivent être réemployés comme revêtement de l’autel. La formulation conserve la tension entre leur association avec le péché des rebelles et leur sainteté cultuelle.
- issue: Sens de בְּנַפְשֹׁתָם
  choice: Leur péché a entraîné la perte de leur propre vie.
  alternative: Ils ont péché contre leur propre vie, ou avec leur vie.
  rationale: Le contexte immédiat de leur mort favorise le sens conséquentiel, sans exclure complètement la formulation hébraïque plus littérale signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le texte conserve le nom « Yahweh », le vocabulaire cultuel « encensoirs » et « autel », ainsi que la tension surprenante d’objets liés à une rébellion qui deviennent néanmoins saints.
