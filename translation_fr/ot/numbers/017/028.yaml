  rationale: La révision conserve la répétition emphatique de l’hébreu et tous les termes cultuels établis, mais remplace une expression française artificielle par une formulation naturelle. La note, correctement ancrée à l’ensemble de l’expression finale, signale la différence lexicale et l’incertitude nuancée de la construction hébraïque.
