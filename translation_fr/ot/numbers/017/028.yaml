source:
  edition: WLC
  text: כֹּ֣ל הַ/קָּרֵ֧ב הַ/קָּרֵ֛ב אֶל מִשְׁכַּ֥ן יְהוָ֖ה יָמ֑וּת הַ/אִ֥ם תַּ֖מְנוּ לִ/גְוֺֽעַ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: fr
  text: Toute personne qui s’approche, qui s’approche du tabernacle de Yahweh, mourra. Allons-nous tous finir par mourir[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Allons-nous tous périr ? » L’hébreu emploie ici un verbe différent de celui rendu par « mourra » et l’associe à un verbe qui peut évoquer le fait d’être achevé ou de parvenir à sa fin. La question exprime ainsi la crainte d’une disparition totale.'
    reason: Alternative lexicale et conservation de la distinction entre מות et la construction תמם + גוע.
lexical_decisions:
- source_word: כֹּל
  choice: Toute personne
  rationale: Dans cette construction avec un participe singulier, l’expression désigne sans exception toute personne qui s’approche. « Toute personne » restitue naturellement cette portée universelle en français.
- source_word: הַקָּרֵב הַקָּרֵב
  choice: qui s’approche, qui s’approche
  rationale: La répétition inhabituelle du participe de קרב est conservée afin de rendre l’insistance et l’effroi exprimés dans l’hébreu, sans lisser la formulation.
- source_word: מִשְׁכַּן
  choice: tabernacle
  rationale: Dans le contexte du désert, משכן désigne la demeure-sanctuaire de Yahweh. « Tabernacle » est le terme français traditionnel, précis et immédiatement identifiable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: יָמוּת
  choice: mourra
  rationale: 'L’imparfait hébreu exprime ici la conséquence certaine du fait de s’approcher : la personne mourra.'
- source_word: תַּמְנוּ
  choice: Allons-nous tous finir
  rationale: Le verbe תמם évoque le fait d’arriver à son terme, d’être entièrement consumé ou achevé. Cette formulation française garde l’idée d’une disparition collective imminente.
- source_word: לִגְוֹעַ
  choice: par expirer
  rationale: גוע signifie mourir ou expirer. « Expirer » maintient la distinction lexicale avec מות, rendu juste avant par « mourra ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le nom divin. Le conserver sous la forme « Yahweh » distingue le nom propre d’un titre et n’impose aucune substitution confessionnelle.
- issue: Portée de l’approche du sanctuaire
  choice: Traduire simplement la conséquence mortelle de l’approche
  alternative: Préciser qu’il s’agit d’une approche non autorisée
  rationale: Le contexte peut faire comprendre qu’il s’agit d’une approche interdite, mais le verset lui-même ne comporte pas de qualificatif correspondant. La traduction n’ajoute donc pas cette précision interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « qui s’approche, qui s’approche » est volontairement marquée parce qu’elle correspond à la répétition emphatique du texte hébreu. « Finir par expirer » conserve à la fois l’idée d’achèvement portée par תמם et le verbe distinct גוע.
