  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: fr
  text: Dis à Éléazar, fils du prêtre Aaron, de retirer les encensoirs[a] du milieu du brasier et de disperser le feu au loin, car ils sont devenus saints[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « braseros ». Le mot hébreu désigne des récipients servant à transporter des braises et à brûler de l’encens.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « car ils sont saints ». Le parfait hébreu peut souligner l’état qui en résulte : « ils sont devenus saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Dis
  rationale: L’impératif de אמר introduit l’ordre que Moïse doit transmettre à Éléazar. « Dis » est direct, naturel et fidèle.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: à Éléazar, fils du prêtre Aaron
  rationale: La construction hébraïque rattache le plus naturellement « le prêtre » à Aaron. Cette formulation française évite l’ambiguïté syntaxique de « fils d’Aaron le prêtre ».
- source_word: וְיָרֵם
  choice: de retirer
  rationale: Le jussif qui suit l’impératif exprime le contenu de l’ordre. « Retirer » rend ici naturellement l’idée de soulever et d’enlever les objets hors de la zone en feu.
- source_word: הַמַּחְתֹּת
  choice: les brûle-parfums
  rationale: Le terme désigne des récipients servant à transporter des braises et à faire brûler l’encens. « Brûle-parfums » est un terme cultuel compréhensible en français moderne; « cassolettes » reste possible.
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: du milieu de l’incendie
  rationale: שׂרפה peut désigner l’embrasement ou la zone brûlée. « Incendie » conserve l’image concrète du feu sans imposer l’interprétation plus précise de « décombres calcinés ».
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: et d’en disperser le feu au loin
  rationale: זרה signifie disperser ou éparpiller, et הָלְאָה indique l’éloignement. Le pronom « en » rattache naturellement le feu aux brûle-parfums, sans remplacer explicitement « feu » par l’interprétation « braises ».
- source_word: כִּי קָדֵשׁוּ
  choice: car ils sont devenus saints
  rationale: Le parfait pluriel exprime vraisemblablement l’état résultant des brûle-parfums après leur présentation devant le SEIGNEUR. La traduction conserve le pluriel masculin et l’idée d’un changement d’état.
theological_decisions:
- issue: Référent du pluriel כִּי קָדֵשׁוּ
  choice: Le pluriel renvoie aux brûle-parfums.
  alternative: Le pluriel pourrait englober les objets associés à l’offrande, voire les brûle-parfums et le feu.
  rationale: Les brûle-parfums constituent l’antécédent pluriel explicite le plus naturel et la suite du récit explique qu’ils doivent être préservés en raison de leur sainteté, tandis que le feu doit être dispersé.
- issue: Valeur du parfait קָדֵשׁוּ
  choice: « sont devenus saints »
  alternative: « sont saints »
  rationale: Le parfait peut mettre en relief l’état présent résultant de leur emploi cultuel. La note conserve l’autre rendu possible sans effacer cette nuance.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement de l’ordre hébreu tout en restant idiomatique. « Brûle-parfums » maintient le contexte cultuel sans vocabulaire excessivement technique; « saints » conserve la terminologie biblique et la tension liée à la sainteté acquise des objets.
