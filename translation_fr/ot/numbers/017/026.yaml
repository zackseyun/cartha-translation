id: NUM.17.26
reference: Numbers 17:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: fr
  text: Moïse fit comme Yahweh le lui avait ordonné ; il fit ainsi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie largement « faire ». Dans ce contexte d’obéissance à un ordre, « fit » est naturel et permet de conserver sa reprise à la fin du verset.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: כַּאֲשֶׁר
  choice: exactement ce que
  rationale: La tournure exprime ici la conformité de l’action de Moïse à l’ordre reçu. « Exactement ce que » rend clairement cette correspondance en français naturel.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le verbe צוה désigne un ordre faisant autorité. Le plus-que-parfait situe naturellement l’ordre avant son exécution dans le récit français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֹתוֹ
  choice: lui
  rationale: Le suffixe masculin singulier renvoie à Moïse ; avec « ordonner », le français idiomatique emploie le complément indirect « lui ».
- source_word: כֵּן
  choice: c’est bien ce que
  rationale: כֵּן reprend et confirme avec insistance l’affirmation précédente. Cette formulation française conserve la reprise emphatique sans la rendre obscure.
- source_word: עָשָׂה
  choice: il fit
  rationale: La répétition de עשה souligne l’obéissance effective de Moïse. Répéter « fit » préserve cet effet rhétorique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin et correspond à sa translittération savante courante, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la répétition intentionnelle du verbe « faire » tout en exprimant naturellement la conformité exacte de Moïse à l’ordre reçu.
