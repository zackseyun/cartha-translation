  timestamp: '2026-07-14T12:49:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « des braises » concrétise indûment אֵשׁ (« feu »), et « s’est déchaînée » ajoute une nuance absente de « est sortie ». Le verbe כפר est mieux rendu directement par « fais l’expiation » que par l’ajout interprétatif de « rite ».'
  naturalness: Le français révisé conserve une formulation moderne et urgente. « Est sortie de la présence de Yahweh » est plus idiomatique que « s’est déchaînée de devant Yahweh », tout en explicitant dans la note l’image spatiale de l’hébreu.
  terminology: « Brûle-parfum », « encens », « communauté », « expiation », « colère », « Yahweh » et « fléau » conviennent au registre cultuel et narratif. La note sur le brûle-parfum conserve l’alternative lexicale.
  issues:
  - severity: medium
    issue: « des braises prises sur l’autel » pour אֵשׁ
    rationale: Le texte hébreu dit « feu »; le feu de l’autel pouvait naturellement être porté sous forme de charbons ardents, mais « braises » précise davantage que la source.
  - severity: medium
    issue: « la colère s’est déchaînée de devant Yahweh » pour יָצָא הַקֶּצֶף מִלִּפְנֵי יְהוָה
    rationale: « S’est déchaînée » est une intensification interprétative et la construction « se déchaîner de devant » n’est pas naturelle. Le verbe source signifie que la colère « est sortie ».
  - severity: medium
    issue: « accomplir pour eux le rite d’expiation » pour וְכַפֵּר עֲלֵיהֶם
    rationale: « Rite » n’est pas exprimé, et « accomplir ... le rite » affaiblit l’impératif sacerdotal direct. « Fais l’expiation pour eux » rend le terme technique sans imposer une théorie.
