revisions:
- from: 'Alors Moïse dit à Aaron : « Prends le brûle-parfum[a], mets-y des braises prises sur l’autel, dépose dessus de l’encens et va vite vers la communauté afin d’accomplir pour eux le rite d’expiation. En effet, la colère s’est déchaînée de devant Yahweh[b] : le fléau a commencé. »'
  to: 'Alors Moïse dit à Aaron : « Prends le brûle-parfum[a], mets-y du feu pris sur l’autel, dépose dessus de l’encens et va vite vers la communauté ; fais l’expiation pour eux, car la colère est sortie de la présence de Yahweh[b] : le fléau a commencé. »'
  rationale: La révision rétablit le sens non spécifié de « feu », évite l’intensification de la colère divine et rend כפר par une expression sacerdotale directe. Elle préserve le nom Yahweh, l’urgence de l’ordre, l’ambiguïté matérielle de la מַחְתָּה au moyen de la note, ainsi que l’image de la présence divine dans la note.
