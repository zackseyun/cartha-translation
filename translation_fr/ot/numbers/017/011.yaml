source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: fr
  text: 'Alors Moïse dit à Aaron : « Prends le brûle-parfum[a], mets-y du feu pris sur l’autel, dépose dessus de l’encens et va vite vers la communauté ; fais l’expiation pour eux, car la colère est sortie de la présence de Yahweh[b] : le fléau a commencé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « brasero » : récipient servant à transporter le feu et à brûler l’encens.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant Yahweh », c’est-à-dire de sa présence.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: le brûle-parfum
  rationale: Le terme désigne ici le récipient sacerdotal servant à transporter les braises et à brûler l’encens. « Brûle-parfum » est naturel en français biblique moderne; « brasero » reste possible.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: mets-y des braises prises sur l’autel
  rationale: Dans ce contexte rituel, אֵשׁ désigne concrètement le feu porté sous forme de braises. Cette formulation française explicite le geste sans perdre la provenance indiquée par מֵעַל.
- source_word: קְטֹרֶת
  choice: de l’encens
  rationale: Équivalent usuel du terme cultuel désignant l’encens offert dans le service sacerdotal.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: va vite
  rationale: Rend à la fois l’impératif de mouvement et l’urgence exprimée par מְהֵרָה dans une langue directe et naturelle.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: Dans les Nombres, le mot désigne collectivement la communauté d’Israël. « Communauté » est actuel et conserve cette portée corporative.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: afin d’accomplir pour eux le rite d’expiation
  rationale: Conserve la valeur sacerdotale et rituelle de כפר sans imposer une théorie particulière de l’expiation. La mention du « rite » évite que le verbe français soit compris abstraitement.
- source_word: הַקֶּצֶף
  choice: la colère
  rationale: Désigne ici la colère divine en train de produire un jugement. « Colère » est clair, solennel et moins archaïque que « courroux ».
- source_word: מִלִּפְנֵי יְהוָה
  choice: de devant Yahweh
  rationale: Reproduit l’image hébraïque de ce qui sort de devant la présence divine, plutôt que de réduire la formule à « de Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: הֵחֵל הַנָּגֶף
  choice: le fléau a commencé
  rationale: נֶגֶף désigne ici le coup mortel envoyé au milieu du peuple. « Fléau » garde le lien avec le jugement sans préciser indûment la nature médicale de l’événement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom personnel de l’alliance.
- issue: Portée sacerdotale du verbe כפר
  choice: accomplir pour eux le rite d’expiation
  alternative: faire l’expiation pour eux
  rationale: La formulation retenue exprime une action rituelle destinée à détourner le jugement, tout en évitant d’introduire une explication doctrinale absente du verset.
- issue: Origine de la colère dans מִלִּפְנֵי יְהוָה
  choice: s’est déchaînée de devant Yahweh
  alternative: est sortie de la présence de Yahweh
  rationale: La tournure conserve le mouvement et l’imagerie spatiale du texte hébreu. La note explicite le sens de présence sans effacer l’expression source.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs courts rendent l’urgence de la scène. « Brûle-parfum », « rite d’expiation » et « fléau » maintiennent la précision cultuelle et la gravité du passage sans archaïsme excessif.
