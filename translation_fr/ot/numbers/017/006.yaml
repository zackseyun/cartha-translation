  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: fr
  text: 'Mais le lendemain, toute la communauté des Israélites murmura contre Moïse et contre Aaron : « C’est vous qui avez fait mourir le peuple de Yahweh. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: se mit à murmurer
  rationale: Dans les récits du désert, le verbe לון désigne une plainte collective et hostile dirigée contre les responsables. « Murmurer contre » est naturel dans le registre biblique français et conserve cette nuance accusatrice.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toute la communauté des Israélites
  rationale: עֵדָה désigne ici l’ensemble de la communauté constituée. « Les Israélites » rend idiomatiquement בְּנֵי יִשְׂרָאֵל, expression collective qui inclut le peuple dans son ensemble, sans suggérer que seuls les hommes sont visés.
- source_word: מִמָּחֳרָת
  choice: dès le lendemain
  rationale: L’expression situe la plainte au jour suivant. « Dès le lendemain » restitue naturellement en français l’enchaînement immédiat marqué par le récit.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: contre Moïse et contre Aaron
  rationale: La répétition de « contre » reproduit celle de la préposition עַל et souligne que l’accusation vise chacun des deux responsables.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français actuel, les deux-points introduisent naturellement le discours direct sans qu’il soit nécessaire de traduire littéralement l’infinitif hébreu « en disant ».
- source_word: אַתֶּם הֲמִתֶּם
  choice: C’est vous qui avez fait mourir
  rationale: Le pronom explicite אַתֶּם est emphatique, et la forme causative de מות signifie « faire mourir ». La tournure choisie conserve à la fois l’insistance accusatrice et la valeur causative, sans imposer le sens plus direct de « tuer ».
- source_word: עַם יְהוָה
  choice: le peuple de Yahweh
  rationale: Cette formulation préserve la désignation d’alliance et rend directement le nom divin יהוה par « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de lui substituer un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans cette formule collective, « fils » fonctionne comme une désignation ethnique et communautaire, non comme une restriction explicite aux personnes de sexe masculin. « Les Israélites » communique cette portée en français naturel.
- issue: Force causative de הֲמִתֶּם
  choice: avez fait mourir
  alternative: avez tué
  rationale: La forme hiphil exprime formellement la causalité. « Faire mourir » maintient l’accusation tout en évitant de préciser au-delà du texte la manière dont Moïse et Aaron auraient causé la mort.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme accusateur est conservé par la répétition de « contre », la structure emphatique « C’est vous qui » et le point d’exclamation. Aucun archaïsme ni terme confessionnel particulier.
