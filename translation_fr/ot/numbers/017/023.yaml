source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּבֹ֤א מֹשֶׁה֙ אֶל אֹ֣הֶל הָ/עֵד֔וּת וְ/הִנֵּ֛ה פָּרַ֥ח מַטֵּֽה אַהֲרֹ֖ן לְ/בֵ֣ית לֵוִ֑י וַ/יֹּ֤צֵֽא פֶ֨רַח֙ וַ/יָּ֣צֵֽץ צִ֔יץ וַ/יִּגְמֹ֖ל שְׁקֵדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: fr
  text: Le lendemain, Moïse entra dans la tente du Témoignage[a]. Et voici que le bâton d’Aaron, pour la maison de Lévi[b], avait bourgeonné, porté des boutons, produit des fleurs et mûri des amandes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tente de l’Attestation » (ou « du témoignage »).
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « pour la maison de Lévi » : le bâton représentait la tribu ou le groupe familial de Lévi.'
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Le lendemain
  rationale: Expression temporelle naturelle en français moderne, qui indique clairement le jour suivant.
- source_word: אֹהֶל הָעֵדוּת
  choice: la tente du Témoignage
  rationale: Rend directement la désignation cultuelle hébraïque et conserve sa nuance juridique et covenantale; la majuscule signale ici le nom de l’objet sacré associé à la tente.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la force déictique et l’effet de surprise du marqueur narratif hébreu dans un français digne et courant.
- source_word: מַטֵּה
  choice: le bâton
  rationale: Terme clair et naturel pour le bâton attribué à chaque chef tribal; « verge » serait archaïque et « branche » trop interprétatif.
- source_word: לְבֵית לֵוִי
  choice: celui de la maison de Lévi
  rationale: Préserve l’expression hébraïque tout en précisant naturellement que le bâton d’Aaron représente la maison de Lévi.
- source_word: פָּרַח
  choice: avait bourgeonné
  rationale: Exprime l’apparition initiale de la croissance végétale et introduit la progression miraculeuse décrite ensuite.
- source_word: וַיֹּצֵא פֶרַח
  choice: avait produit des bourgeons
  rationale: Le nom פֶרַח peut désigner une pousse ou une floraison. « Bourgeons » maintient une progression végétale intelligible sans imposer une distinction botanique trop rigide.
- source_word: וַיָּצֵץ צִיץ
  choice: fait éclore des fleurs
  rationale: Rend le couple verbal et nominal par une expression française naturelle, en distinguant cette étape de la formation des bourgeons.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: mûrir des amandes
  rationale: Le verbe indique l’arrivée à maturité; cette traduction conserve le point culminant de la séquence, jusqu’au fruit mûr.
theological_decisions:
- issue: Sens de עֵדוּת dans le nom de la tente
  choice: Témoignage
  alternative: témoignage / attestation
  rationale: « Témoignage » conserve l’ambivalence juridique et covenantale du terme sans l’identifier explicitement à une interprétation confessionnelle particulière.
- issue: Rapport entre le bâton d’Aaron et Lévi
  choice: celui de la maison de Lévi
  alternative: pour la maison de Lévi
  rationale: La formulation indique la fonction représentative du bâton sans déterminer plus précisément si בֵּית doit être compris comme maison, clan ou tribu.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » conserve la vivacité du récit biblique sans archaïsme marqué. La succession bourgeons, fleurs et amandes mûres rend la progression végétale du texte tout en reconnaissant le chevauchement sémantique possible entre פֶרַח et צִיץ.
