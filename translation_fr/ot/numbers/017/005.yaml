id: NUM.17.5
reference: Numbers 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: fr
  text: comme rappel pour les Israélites[a], afin qu’aucune personne non habilitée[b], qui ne descend pas d’Aaron, ne s’approche pour faire brûler de l’encens devant Yahweh, et qu’elle ne devienne pas comme Coré et son groupe, comme Yahweh le lui[d] avait dit par l’intermédiaire de Moïse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme mémorial » ou « comme souvenir ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit ici d’une personne non autorisée à exercer le service sacerdotal, et non nécessairement d’une personne étrangère par son origine.
    reason: cultural_note
  - marker: c
    text: Littéralement « par la main de Moïse », expression qui signifie ici « par l’intermédiaire de Moïse ».
    reason: lexical_alternative
  - marker: d
    text: Le pronom « lui » renvoie probablement à Aaron.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: rappel
  rationale: Le nom désigne ce qui entretient le souvenir et sert d’avertissement. « Rappel » est naturel en français moderne; « mémorial » demeure possible.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les Israélites
  rationale: Cette formulation idiomatique désigne clairement l’ensemble du peuple sans donner à « fils » un sens exclusivement masculin.
- source_word: אִישׁ זָר
  choice: aucune personne non habilitée
  rationale: Dans ce contexte sacerdotal, זָר désigne quelqu’un qui n’est pas autorisé à exercer ce service, et non nécessairement une personne d’origine étrangère.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: de la descendance d’Aaron
  rationale: « Descendance » exprime naturellement en français l’appartenance à la lignée évoquée par זֶרַע.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: faire brûler de l’encens
  rationale: Cette expression conserve l’image causative de la fumée produite tout en restant idiomatique dans un contexte cultuel.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: et qu’elle ne soit pas comme Coré et son groupe
  rationale: La formulation conserve la comparaison du texte hébreu sans préciser si elle porte surtout sur la conduite, la condition ou le sort de Coré et des siens.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Littéralement « par la main de Moïse »; l’expression hébraïque indique ici que Moïse est l’intermédiaire de la parole divine.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de זָר dans le cadre sacerdotal
  choice: personne non habilitée
  alternative: étranger / profane
  rationale: L’interdiction concerne l’absence d’habilitation sacerdotale liée à la descendance d’Aaron, non l’origine ethnique.
- issue: Antécédent du pronom לוֹ
  choice: conserver « lui » dans le texte et signaler Aaron en note
  alternative: expliciter « à Aaron »
  rationale: Le référent le plus probable est Aaron, mais le pronom hébreu ne le nomme pas explicitement; la traduction préserve donc cette légère ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit de près la syntaxe d’avertissement du texte tout en employant « Israélites » et « personne non habilitée » pour éviter des ambiguïtés modernes trompeuses. Le féminin grammatical des pronoms reprend « personne » sans restreindre le référent aux femmes.
