revisions:
- from: comme rappel pour les Israélites[a], afin qu’aucune personne non habilitée[b], qui n’est pas de la descendance d’Aaron, ne s’approche pour faire brûler de l’encens devant Yahweh, et qu’elle ne soit pas comme Coré et son groupe, conformément à ce que Yahweh lui[d] avait dit par l’intermédiaire de Moïse[c].
  to: comme rappel pour les Israélites[a], afin qu’aucune personne non habilitée[b], qui ne descend pas d’Aaron, ne s’approche pour faire brûler de l’encens devant Yahweh, et qu’elle ne devienne pas comme Coré et son groupe, comme Yahweh le lui[d] avait dit par l’intermédiaire de Moïse[c].
  rationale: La révision remplace une tournure française qui modifiait légèrement la fonction de כַּאֲשֶׁר par « comme », et emploie « ne devienne pas » pour la portée d’avertissement de la comparaison avec Coré. « Qui ne descend pas d’Aaron » est une formulation française plus directe de l’appartenance refusée à la lignée d’Aaron. Les notes et leurs ancres sont conservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:50:49Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens cultuel de זָר est correctement rendu par « personne non habilitée », et la restriction généalogique à la descendance d’Aaron est préservée. Le pronom final demeure ambigu dans le texte et est convenablement commenté. Toutefois, « conformément à ce que » exprime plus naturellement une conformité qu’une comparaison (« comme/ainsi que ») et affaiblit légèrement כַּאֲשֶׁר.
  naturalness: Le français est clair et de registre approprié. « Ne devienne pas » rend mieux la portée préventive de « ne soit pas comme Coré » dans ce contexte, sans surinterpréter la nature exacte de la ressemblance. La formule « comme Yahweh le lui avait dit » est plus idiomatique et plus proche de la relation comparative finale.
  terminology: « Israélites », « personne non habilitée », « descendance d’Aaron », « encens », « Coré » et « Yahweh » sont cohérents et adaptés au français international moderne. « Groupe » est une restitution neutre et naturelle de עֵדָה dans ce contexte.
  issues:
  - severity: low
    issue: La locution « conformément à ce que Yahweh lui avait dit » ne reflète pas exactement כַּאֲשֶׁר.
    rationale: 'L’hébreu introduit une comparaison : « comme/ainsi que Yahweh avait parlé ». « Conformément à » peut suggérer que l’action est accomplie en conformité avec une instruction plutôt que signaler que la parole antérieure de Yahweh s’est réalisée.'
  - severity: low
    issue: « Qu’elle ne soit pas comme Coré » est un peu statique dans une clause d’avertissement.
    rationale: Le verbe היה peut être rendu littéralement par « être », mais « ne devienne pas comme » communique naturellement l’avertissement de ne pas finir à l’exemple ou au sort de Coré, sans préciser davantage la comparaison.
