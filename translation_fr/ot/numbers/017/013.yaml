  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: fr
  text: Il se tint entre les morts et les vivants, et le fléau fut arrêté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Il se tint
  rationale: Le verbe עמד signifie « se tenir debout » ou « prendre position ». « Il se tint » exprime naturellement ici une position délibérée dans le récit, sans lui donner une nuance militaire.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et
  rationale: La construction corrélative marque la position spatiale séparant deux groupes ; « entre ... et » en est l’équivalent français direct.
- source_word: הַמֵּתִים
  choice: les morts
  rationale: La forme substantivée désigne ceux qui étaient morts. « Les morts » est idiomatique et conserve le contraste saisissant avec « les vivants ».
- source_word: הַחַיִּים
  choice: les vivants
  rationale: L’adjectif substantivé désigne ceux qui étaient encore en vie. « Les vivants » reproduit naturellement le parallélisme hébreu.
- source_word: וַתֵּעָצַר
  choice: fut arrêté
  rationale: La forme passive de עצר indique que la progression du fléau a été stoppée. « Fut arrêté » conserve la voix passive et le résultat exprimés par l’hébreu.
- source_word: הַמַּגֵּפָה
  choice: le fléau
  rationale: מַגֵּפָה désigne ici un coup mortel collectif, une épidémie frappant le peuple. « Fléau » convient au contexte de jugement et reste assez large pour ne pas réduire le terme à une maladie précisément identifiée.
theological_decisions:
- issue: Nature de מַגֵּפָה dans ce contexte de jugement
  choice: le fléau
  alternative: l’épidémie ; la plaie
  rationale: Le terme renvoie dans le contexte immédiat à un événement meurtrier envoyé en jugement. « Fléau » en préserve la gravité et l’étendue sémantique sans préciser au-delà du texte son mécanisme exact.
translation_notes:
  register: Français moderne, sobre et digne. La symétrie « entre les morts et les vivants » et la voix passive de la proposition finale sont conservées.
