source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: fr
  text: Lorsque la communauté se rassembla contre Moïse et Aaron, ses membres se tournèrent vers la tente de la Rencontre. Et voici que la nuée la couvrit[a], et la gloire de Yahweh apparut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom hébreu renvoie très probablement à « la tente de la Rencontre ».
    reason: Clarifier le référent probable du suffixe pronominal sans effacer entièrement l’ambiguïté.
lexical_decisions:
- source_word: וַיְהִי בְּהִקָּהֵל
  choice: Lorsque … se rassembla
  rationale: La construction introduit la circonstance temporelle du nouvel événement. En français, « Lorsque » rend naturellement la transition narrative sans reprendre lourdement « il arriva que ».
- source_word: הָעֵדָה
  choice: la communauté
  rationale: Le terme désigne ici collectivement la communauté israélite. « Communauté » est actuel, clair et conserve cette dimension collective.
- source_word: עַל
  choice: contre
  rationale: Le contexte indique un rassemblement hostile dirigé contre Moïse et Aaron.
- source_word: וַיִּפְנוּ
  choice: ses membres se tournèrent
  rationale: Le verbe pluriel décrit un mouvement physique. « Ses membres » explicite en français que le pluriel renvoie à la communauté, dont le nom est grammaticalement singulier.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Cette formulation traduit directement le nom du sanctuaire tout en gardant son caractère de désignation établie.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette expression attire l’attention sur la manifestation soudaine et conserve la solennité du récit.
- source_word: כִסָּהוּ הֶעָנָן
  choice: la nuée la couvrait
  rationale: « Nuée » convient au registre biblique de la manifestation divine sans ajouter d’explication au texte. Le pronom féminin français reprend « tente ».
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה exprime ici une manifestation devenue visible.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: « Gloire » conserve le poids théologique de כָּבוֹד, et « Yahweh » représente directement le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin, non un titre. « Yahweh » le distingue clairement du mot hébreu signifiant « Seigneur ».
- issue: Référent du suffixe dans כִסָּהוּ
  choice: la nuée couvrait la tente de la Rencontre
  alternative: la nuée couvrait la communauté ou l’ensemble de la scène
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au nom masculin singulier אֹהֶל, « tente », qui est son antécédent immédiat. Une note conserve néanmoins la légère ambiguïté référentielle.
translation_notes:
  register: Français international moderne, narratif et digne. « La nuée » et « la gloire » maintiennent le registre théophanique traditionnel, tandis que la syntaxe reste accessible. La division en deux phrases évite une longue coordination peu naturelle en français.
