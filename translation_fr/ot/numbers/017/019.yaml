source:
  edition: WLC
  text: וְ/הִנַּחְתָּ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵי֙ הָֽ/עֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: fr
  text: Tu les déposeras dans la tente de la rencontre, devant le témoignage[a], là où je vous rencontrerai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le témoin de l’alliance » ; « le témoignage » désigne probablement le témoignage de l’alliance associé aux tablettes placées dans le sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « là où je me ferai connaître à vous » ou « là où je fixerai une rencontre avec vous ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: Tu les déposeras
  rationale: Le hifil à la deuxième personne du masculin singulier, avec suffixe objet pluriel, exprime l’action de placer ou de déposer les objets. Le futur français convient naturellement à la valeur directive du contexte.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Cette expression désigne le sanctuaire. « Tente de la rencontre » rend de façon transparente אֹהֶל מוֹעֵד tout en restant compréhensible en français moderne.
- source_word: לִפְנֵי הָעֵדוּת
  choice: devant le témoignage
  rationale: לִפְנֵי signifie « devant, en présence de », et הָעֵדוּת signifie littéralement « le témoignage ». La formulation ne précise pas ici s’il s’agit directement des tablettes, de l’arche ou, plus largement, du témoignage de l’alliance.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: là où je vous rencontrerai
  rationale: Le nifal de יעד évoque une rencontre fixée ou assignée. Avec אֲשֶׁר et שָׁמָּה, la tournure française locative « là où » exprime naturellement le sens.
- source_word: לָכֶם
  choice: vous
  rationale: La préposition ל, employée avec יעד dans cette construction, désigne les personnes que Dieu rencontre. Le pronom « vous » conserve le pluriel hébreu.
- source_word: שָׁמָּה
  choice: là où
  rationale: L’adverbe locatif est intégré à la locution « là où », ce qui évite une répétition artificielle tout en conservant sa valeur spatiale.
theological_decisions:
- issue: Référent du « témoignage »
  choice: Conserver l’expression littérale « le témoignage » sans préciser davantage son référent.
  alternative: « les tablettes du témoignage », « l’arche du témoignage » ou « le témoignage de l’alliance »
  rationale: Le texte hébreu emploie un terme théologiquement chargé, mais ne désigne pas explicitement ici les tablettes ou l’arche. Le maintien de l’expression ouverte préserve l’ambiguïté du texte.
- issue: Sens de la rencontre divine
  choice: « là où je vous rencontrerai »
  alternative: « là où je me ferai connaître à vous » ou « là où je fixerai une rencontre avec vous »
  rationale: Dans le contexte du sanctuaire, le verbe peut souligner la rencontre assignée par Dieu. La traduction principale garde le sens relationnel et locatif sans développer une interprétation particulière.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier correspond à l’ordre adressé à Moïse, tandis que « vous » conserve le pluriel de לָכֶם. Les minuscules dans « tente de la rencontre » suivent un usage descriptif plutôt qu’un traitement comme nom propre.
