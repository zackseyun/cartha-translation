  rationale: La révision corrige le référent cultuel de l'objet implicite en remplaçant « brasier » par « encensoir ». Elle ajoute « y » afin que l'action de mettre l'encens soit claire en français tout en conservant le caractère contextuellement implicite du support. Les autres formulations sont maintenues, car elles reflètent convenablement l'hébreu et le registre du passage.
