  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: fr
  text: Aaron prit donc l’encensoir[a], comme Moïse l’avait dit, et courut au milieu de l’assemblée[b]. Or, voici que le fléau avait commencé à sévir parmi le peuple. Il y mit alors l’encens et fit l’expiation pour le peuple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Aaron prit » ; l’objet, implicite en hébreu, est repris du verset précédent : l’encensoir.'
    reason: supplied_contextual_object
  - marker: b
    text: 'Ou : « de la communauté ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « accomplit le rite d’expiation en faveur du peuple ».'
    reason: lexical_theological_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit donc le brasier
  rationale: Le verbe signifie simplement « prendre », mais son objet est implicite en hébreu et doit généralement être exprimé en français. « Le brasier » reprend l’objet rituel mentionné au verset précédent; une note signale cet ajout contextuel.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: comme Moïse l’avait dit
  rationale: דבר signifie « parler, dire » et non spécifiquement « ordonner ». Le plus-que-parfait convient à la succession narrative.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: courut au milieu de l’assemblée
  rationale: רוץ signifie directement « courir », תּוֹךְ « milieu », et קָהָל désigne ici le peuple réuni. « Assemblée » est clair sans connotation ecclésiale trop marquée.
- source_word: וְהִנֵּה
  choice: Or, voici que
  rationale: Cette tournure conserve la fonction de mise en relief vive de הִנֵּה tout en restant naturelle dans un récit français soutenu.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: le fléau avait commencé à sévir parmi le peuple
  rationale: נֶגֶף désigne ici le fléau mortel qui frappe le peuple. « Avait commencé » rend l’antériorité constatée par Aaron; « à sévir » explicite idiomatiquement l’action d’un fléau sans en préciser indûment la nature.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: il mit alors l’encens
  rationale: נתן signifie littéralement « donner, mettre ». « Mit l’encens » reste concret et évite le plus interprétatif « offrit l’encens »; le support ou le feu, implicite dans le contexte, n’est pas répété ici.
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: fit l’expiation pour le peuple
  rationale: Dans le cadre sacerdotal, כפר désigne l’acte rituel d’expiation. Cette formulation conserve son poids cultuel sans définir plus précisément le mécanisme théologique.
theological_decisions:
- issue: Sens cultuel de כפר
  choice: fit l’expiation pour le peuple
  alternative: accomplit le rite d’expiation en faveur du peuple
  rationale: « Fit l’expiation » conserve le terme théologique traditionnel et la concision de l’hébreu. L’alternative est plus explicite, mais ajoute le nom « rite », absent du texte.
- issue: Désignation de la communauté par קָהָל
  choice: assemblée
  alternative: communauté
  rationale: « Assemblée » représente les Israélites réunis et préserve l’idée de rassemblement. « Communauté » est possible, mais met moins nettement l’accent sur le groupe convoqué et présent.
- issue: Nature de הַנֶּגֶף
  choice: le fléau
  alternative: l’épidémie
  rationale: « Fléau » préserve la portée de נֶגֶף comme coup mortel sans réduire le phénomène à une maladie contagieuse, précision que le verset n’impose pas.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures « voici que » et « fit l’expiation » maintiennent la gravité du récit et son vocabulaire cultuel, tandis que la syntaxe demeure accessible.
