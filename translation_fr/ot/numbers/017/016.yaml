  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Puis Yahvé parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le waw consécutif fait avancer le récit. « Puis … parla » est naturel en français moderne tout en conservant le sens précis du verbe דבר.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que remplacé par un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל indique ici le destinataire de la parole; « à Moïse » est la tournure française idiomatique.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cet infinitif introduit le discours direct qui suit. La formule française « en ces termes : » remplit naturellement cette fonction sans alourdir la phrase.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » conserve le nom personnel dans une forme française largement reconnue, sans lui substituer le titre « le Seigneur ».
translation_notes:
  register: Français international moderne, clair et digne. La formule narrative hébraïque est rendue de manière naturelle, et les deux-points annoncent la parole divine du verset suivant.
