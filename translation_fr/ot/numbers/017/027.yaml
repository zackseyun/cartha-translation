  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: fr
  text: 'Les Israélites dirent à Moïse : « Voilà que nous mourons ! Nous périssons ! Nous périssons tous ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation naturelle en français moderne exprime fidèlement l’identité collective portée par l’idiome hébreu « fils d’Israël », sans suggérer qu’il s’agit uniquement des hommes.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: 'dirent ... :'
  rationale: En français, le verbe introducteur suivi de deux-points remplit naturellement la fonction de לֵאמֹר ; ajouter « en disant » serait inutilement lourd.
- source_word: הֵן
  choice: Voilà que
  rationale: Dans cette exclamation alarmée, la locution attire l’attention sur une situation ressentie comme imminente ou déjà engagée. Elle est actuelle et plus digne ici que « Regarde ».
- source_word: גָּוַעְנוּ
  choice: nous mourons
  rationale: Le verbe désigne le fait d’expirer ou de mourir. Le présent français rend l’imminence ressentie dans ce cri de panique.
- source_word: אָבַדְנוּ
  choice: nous périssons
  rationale: « Périr » exprime la destruction et la perte annoncées tout en maintenant une distinction lexicale avec גוע, rendu par « mourir ».
- source_word: כֻּלָּנוּ אָבָדְנוּ
  choice: nous périssons tous
  rationale: La place finale de « tous » produit une emphase naturelle en français sur la totalité du peuple, tandis que la répétition de « périssons » conserve l’insistance affolée de l’hébreu.
theological_decisions: []
