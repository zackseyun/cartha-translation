translation_notes:
  register: Français international moderne, sobre et digne. « Le prêtre Éléazar » suit l’ordre naturel du français. Le sujet non exprimé de l’action de marteler est rendu par « on », ce qui respecte l’actif pluriel hébreu sans identifier arbitrairement les artisans.
