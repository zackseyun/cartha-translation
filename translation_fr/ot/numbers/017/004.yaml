base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: fr
  text: 'Le prêtre Éléazar prit donc les encensoirs[a] en bronze que les hommes consumés par le feu[b] avaient présentés, et on les martela pour en faire un revêtement[c] pour l’autel.


    [a] Ou « braseros ».


    [b] Littéralement : « les brûlés » ou « ceux qui avaient été brûlés » ; il s’agit des hommes consumés par le feu dans le récit précédent.


    [c] Ou « placage » ou « couverture » métallique.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « braseros ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les brûlés » ou « ceux qui avaient été brûlés » ; il s’agit des hommes consumés par le feu dans le récit précédent.'
    reason: lexical_alternative
  - marker: c
    text: Ou « placage » ou « couverture » métallique.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: brûle-parfums
  rationale: Le terme désigne des récipients servant à transporter des braises et à faire brûler l’encens. « Brûle-parfums » est clair dans le contexte cultuel, tandis que « braseros » reste une possibilité.
- source_word: הַנְּחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze ; « bronze » est le terme conventionnel et contextuellement probable pour le mobilier du sanctuaire.
- source_word: הִקְרִיבוּ
  choice: avaient présentés
  rationale: Le hiphil de קרב signifie ici présenter ou offrir dans un cadre cultuel. Le plus-que-parfait situe clairement cette action avant celle d’Éléazar, sans préciser davantage la nature de l’offrande.
- source_word: הַשְּׂרֻפִים
  choice: les hommes consumés par le feu
  rationale: Le participe passif signifie littéralement « les brûlés ». La formulation française conserve la référence concrète aux hommes atteints par le feu tout en étant naturelle et explicite.
- source_word: וַיְרַקְּעוּם
  choice: on les martela
  rationale: La forme hébraïque est active, à la troisième personne du pluriel, avec un suffixe objet pluriel, mais son sujet n’est pas précisé. Le pronom indéfini « on » préserve cette indétermination et « les » rend explicite l’objet.
- source_word: צִפּוּי
  choice: un revêtement
  rationale: Le nom désigne une couche ou couverture métallique appliquée sur un objet. « Revêtement » est naturel, précis et adapté à l’autel.
- source_word: לַמִּזְבֵּחַ
  choice: pour l’autel
  rationale: 'La préposition ל marque ici la destination ou le résultat : le métal martelé devait servir de revêtement à l’autel.'
