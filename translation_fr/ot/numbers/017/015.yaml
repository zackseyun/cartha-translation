source:
  edition: WLC
  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: fr
  text: Alors Aaron revint auprès de Moïse, à l’entrée de la tente de la rencontre, et le fléau fut arrêté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut contenu » ou « fut endigué ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Alors Aaron revint
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque naturellement la succession, et « revint » rend le sens spatial de שׁוּב.
- source_word: אֶל מֹשֶׁה
  choice: auprès de Moïse
  rationale: Dans ce contexte, אֶל indique le retour vers Moïse. « Auprès de » s’accorde naturellement avec la localisation qui suit, sans répéter lourdement « à ».
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: פֶּתַח désigne l’entrée ou l’ouverture. « Tente de la rencontre » rend de manière transparente אֹהֶל מוֹעֵד et demeure intelligible en français moderne.
- source_word: הַמַּגֵּפָה
  choice: le fléau
  rationale: מַגֵּפָה désigne ici le fléau mortel qui frappe le peuple. « Fléau » conserve la portée judiciaire du contexte sans réduire le terme à une maladie précisément identifiée.
- source_word: נֶעֱצָרָה
  choice: fut arrêté
  rationale: Le niphal de עצר indique que le fléau a été stoppé. Le passif français suit la forme hébraïque et ne nomme pas explicitement l’agent.
theological_decisions:
- issue: Agent implicite de l’arrêt du fléau
  choice: Conserver le passif « fut arrêté » sans nommer l’agent.
  alternative: « le Seigneur arrêta le fléau » ou « le fléau s’arrêta »
  rationale: Le contexte fait comprendre l’action divine, mais l’hébreu n’exprime aucun sujet agent dans cette proposition. Le passif préserve cette retenue et évite aussi de présenter l’arrêt comme purement spontané.
translation_notes:
  register: Français international moderne, sobre et narratif. « Tente de la rencontre » est transparent et digne; « fléau » évite le caractère archaïque de « plaie » et la précision excessive d’« épidémie ».
