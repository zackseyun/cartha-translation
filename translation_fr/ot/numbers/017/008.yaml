lexical_decisions:
- source_word: וַיָּבֹא
  choice: Puis … vinrent
  rationale: Le wayyiqtol de בוא fait progresser le récit. Le pluriel français s’accorde naturellement avec le sujet composé « Moïse et Aaron », malgré la forme verbale hébraïque au singulier.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises usuelles de ces noms propres bibliques.
- source_word: אֶל־פְּנֵי
  choice: devant
  rationale: Cette locution signifie littéralement « vers la face de » et indique ici que Moïse et Aaron s’approchent du sanctuaire ou se présentent devant lui, sans affirmer qu’ils y entrent.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Rend le rapport construit et la fonction cultuelle de l’expression, tout en désignant clairement le sanctuaire particulier.
