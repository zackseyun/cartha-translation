  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: fr
  text: Puis Moïse et Aaron vinrent devant la tente de la Rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « vers la face de la tente de la Rencontre ».'
