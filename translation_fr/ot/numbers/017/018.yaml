  text: וְ/אֵת֙ שֵׁ֣ם אַהֲרֹ֔ן תִּכְתֹּ֖ב עַל מַטֵּ֣ה לֵוִ֑י כִּ֚י מַטֶּ֣ה אֶחָ֔ד לְ/רֹ֖אשׁ בֵּ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: fr
  text: Et tu écriras le nom d’Aaron sur le bâton de Lévi, car il y aura un seul bâton pour le chef de leur maison paternelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il y aura un seul bâton pour chaque chef de leur maison paternelle ». L’expression hébraïque peut être comprise dans un sens distributif : chaque chef de maison paternelle est alors représenté par un seul bâton.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: Tu écriras
  rationale: La conjonction poursuit les instructions précédentes; le marqueur d’objet direct n’a pas d’équivalent explicite en français. L’enchaînement est rendu naturellement sans « et » initial.
- source_word: שֵׁם אַהֲרֹן
  choice: le nom d’Aaron
  rationale: Rendu direct et usuel de l’expression désignant le nom personnel à inscrire.
- source_word: תִּכְתֹּב
  choice: Tu écriras
  rationale: L’imparfait qal à la deuxième personne du masculin singulier a ici une valeur prescriptive; le futur français exprime dignement l’instruction adressée à Moïse.
- source_word: עַל מַטֵּה לֵוִי
  choice: sur le bâton de Lévi
  rationale: « Bâton » désigne l’objet concret tout en permettant sa fonction représentative; « de Lévi » indique qu’il représente la tribu de Lévi.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison pour laquelle le nom d’Aaron doit figurer sur le bâton de Lévi.
- source_word: מַטֶּה אֶחָד
  choice: un seul bâton
  rationale: Met clairement en relief l’unicité exprimée par אֶחָד.
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: pour chaque chef de leur famille patriarcale
  rationale: Le singulier peut avoir une portée distributive. « Chef » rend la fonction de רֹאשׁ, et « famille patriarcale » exprime en français actuel l’unité de parenté issue de la lignée paternelle.
theological_decisions:
- issue: Portée distributive de לְרֹאשׁ
  choice: pour chaque chef
  alternative: pour le chef
  rationale: Le contexte du prélèvement des bâtons favorise une lecture distributive, sans exclure la formulation plus littérale au singulier; celle-ci est signalée en note afin de préserver l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, clair et digne. « Famille patriarcale » évite le calque peu naturel « maison de leurs pères » tout en conservant la structure sociale fondée sur la lignée paternelle. La note maintient l’ambiguïté du singulier hébreu.
