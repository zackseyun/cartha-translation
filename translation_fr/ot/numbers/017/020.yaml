  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: fr
  text: Alors, le bâton de l’homme que je choisirai bourgeonnera, et je ferai disparaître de devant moi les récriminations des Israélites, qu’ils dirigent contre vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Alors
  rationale: Introduit naturellement en français l’issue future annoncée par la formule hébraïque, sans lourdeur archaïsante.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: l’homme que je choisirai
  rationale: Conserve le masculin singulier du représentant tribal et exprime idiomatiquement l’élection divine indiquée par בּוֹ.
- source_word: מַטֵּהוּ
  choice: le bâton
  rationale: Dans ce contexte, מַטֶּה désigne le bâton personnel du chef; « bâton » est clair et courant en français moderne.
- source_word: יִפְרָח
  choice: bourgeonnera
  rationale: Le verbe peut évoquer le bourgeonnement ou la floraison; « bourgeonnera » convient au premier signe de vie, avant les développements décrits au verset suivant.
- source_word: וַהֲשִׁכֹּתִי
  choice: je ferai cesser
  rationale: 'Rend directement le causatif: Dieu fera retomber ou cessera les récriminations.'
- source_word: מֵעָלַי
  choice: devant moi
  rationale: Préserve l’idée spatiale ou relationnelle de מֵעָלַי sans affirmer explicitement ici que les récriminations sont « contre moi »; elles sont retirées de devant ou de dessus Dieu.
- source_word: תְּלֻנּוֹת
  choice: les récriminations
  rationale: Exprime des plaintes hostiles et répétées, tout en restant distinct du verbe participial qui suit.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des Israélites
  rationale: Rend naturellement en français la désignation collective littéralement formulée « fils d’Israël », sans laisser croire que seuls les hommes sont visés.
- source_word: אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם
  choice: qu’ils élèvent contre vous
  rationale: Le relatif reprend les récriminations; cette formulation française rend leur action continue et leur orientation hostile contre Moïse et Aaron.
theological_decisions:
- issue: Orientation des récriminations dans מֵעָלַי et עֲלֵיכֶם
  choice: « devant moi » puis « contre vous »
  alternative: « contre moi » puis « contre vous »
  rationale: Le texte distingue מֵעָלַי, littéralement « de dessus moi / de devant moi », de עֲלֵיכֶם, qui décrit clairement les récriminations dirigées contre les destinataires. La traduction conserve cette tension au lieu d’uniformiser les deux expressions.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans ce contexte collectif, l’expression désigne le peuple d’Israël. « Les Israélites » en transmet la portée sans introduire une restriction masculine étrangère au référent collectif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant le calque « et il arrivera que ». « Récriminations » garde la tonalité de contestation persistante du contexte.
