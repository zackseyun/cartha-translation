  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: fr
  text: Moïse déposa les bâtons devant Yahweh, dans la tente du Témoignage[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les verges ». Le mot hébreu désigne ici les bâtons matériels qui représentent les tribus.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « dans le tabernacle du Témoignage ». Littéralement : « dans la tente du Témoignage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: déposa
  rationale: Le hiphil de נוח exprime ici l’action concrète de poser ou déposer quelque chose. « Déposa » convient au récit et suggère que les bâtons sont laissés devant Yahweh.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: הַמַּטֹּת
  choice: les bâtons
  rationale: מַטֶּה peut désigner un bâton, une verge ou une tribu. Ici, il s’agit des objets physiques représentant les tribus; « bâtons » est clair et naturel en français moderne.
- source_word: לִפְנֵי
  choice: devant
  rationale: Cette préposition indique littéralement une position devant quelqu’un et peut aussi évoquer sa présence. « Devant » conserve les deux nuances sans explicitation excessive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: בְּאֹהֶל
  choice: dans la tente
  rationale: אֹהֶל signifie littéralement « tente ». Cette traduction conserve l’image hébraïque; « tabernacle » demeure une possibilité traditionnelle.
- source_word: הָעֵדֻת
  choice: du Témoignage
  rationale: עֵדוּת désigne ici le témoignage lié aux tables de l’alliance et donne son nom au sanctuaire. La majuscule signale cet emploi particulier sans en développer l’interprétation dans le texte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin et évite de le remplacer par un titre.
- issue: Sens de עֵדוּת dans le nom du sanctuaire
  choice: le Témoignage
  alternative: le document de l’alliance; le tabernacle du Témoignage
  rationale: « Témoignage » reste proche du terme hébreu et préserve sa portée cultuelle et juridique sans la réduire explicitement aux seules tables.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit le bref enchaînement narratif de l’hébreu. « Déposa » est idiomatique sans être familier; « tente du Témoignage » conserve la formulation concrète de la source.
