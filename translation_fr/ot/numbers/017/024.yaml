revisions:
- from: Moïse sortit donc tous les bâtons de devant Yahweh et les apporta à tous les fils d’Israël[a]. Ils les regardèrent[b], puis chacun reprit son bâton.
  to: Moïse fit sortir tous les bâtons de devant Yahweh et les présenta à tous les fils d’Israël[a]. Ils les virent[b], et chacun prit son bâton.
  rationale: La révision supprime les inférences non exprimées (« reprit »), rend וַיִּרְאוּ par son équivalent français principal (« virent »), et enlève des connecteurs interprétatifs. Elle conserve le nom Yahweh, les ancres de notes et l’ambiguïté sobre du texte hébreu.
