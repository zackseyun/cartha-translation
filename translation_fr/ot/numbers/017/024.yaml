  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: fr
  text: Moïse fit sortir tous les bâtons de devant Yahweh et les présenta à tous les fils d’Israël[a]. Ils les virent[b], et chacun prit son bâton.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tous les Israélites ». L’hébreu dit littéralement « à tous les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils les regardèrent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: sortit… et les apporta
  rationale: Le hiphil de יצא exprime le fait de faire sortir ou d’apporter dehors. Cette formulation française rend à la fois le mouvement depuis la présence de Yahweh et la présentation aux Israélites.
- source_word: הַמַּטֹּת
  choice: les bâtons
  rationale: מַטֶּה désigne ici les objets matériels déposés devant Yahweh. « Bâtons » est clair, naturel et cohérent avec le contexte.
- source_word: מִלִּפְנֵי יְהוָה
  choice: de devant Yahweh
  rationale: Cette formulation conserve l’image spatiale de l’hébreu לִפְנֵי et rend directement le nom divin יְהוָה par « Yahweh ».
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: à tous les fils d’Israël
  rationale: La traduction formelle conserve la désignation nationale hébraïque בְּנֵי יִשְׂרָאֵל; une formulation française plus idiomatique est donnée en note.
- source_word: וַיִּרְאוּ
  choice: ils les regardèrent
  rationale: ראה signifie fondamentalement « voir »; dans cette séquence, « regarder » exprime naturellement l’examen des bâtons sans ajouter de résultat non formulé.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: chacun reprit son bâton
  rationale: אִישׁ a ici une valeur distributive, bien rendue par « chacun ». Le contexte montre que chacun récupère le bâton qu’il avait remis, d’où le naturel « reprit ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Sujet implicite de וַיִּרְאוּ
  choice: les Israélites regardèrent les bâtons
  alternative: ils virent
  rationale: Le sujet pluriel renvoie naturellement aux fils d’Israël. La traduction ne précise pas ce qu’ils constatèrent, préservant ainsi la sobriété et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination narrative hébraïque est légèrement lissée par « donc » et « puis », tout en conservant l’ordre des actions. Les marqueurs [a] et [b] figurent dans le texte.
