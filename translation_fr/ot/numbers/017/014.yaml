  text: וַ/יִּהְי֗וּ הַ/מֵּתִים֙ בַּ/מַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּ/שְׁבַ֣ע מֵא֑וֹת מִ/לְּ/בַ֥ד הַ/מֵּתִ֖ים עַל דְּבַר קֹֽרַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: fr
  text: Ceux qui moururent lors du fléau furent au nombre de quatorze mille sept cents, sans compter ceux qui étaient morts à cause de Coré[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’affaire de Coré ». L’expression désigne les personnes déjà mortes dans les événements liés à la révolte de Coré.
    reason: Préserver l’ambiguïté de עַל דְּבַר entre une nuance causale et le sens plus général d’une affaire ou d’événements liés à Coré.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: furent au nombre de
  rationale: La forme narrative introduit ici le bilan des morts. « Furent au nombre de » rend naturellement cette fonction sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: הַמֵּתִים
  choice: ceux qui moururent / ceux qui étaient morts
  rationale: Le participe substantivé désigne les personnes mortes. La première formulation convient au bilan du fléau, tandis que le plus-que-parfait dans la seconde situe naturellement les morts liés à Coré avant ce bilan.
- source_word: בַּמַּגֵּפָה
  choice: lors du fléau
  rationale: מַגֵּפָה désigne un fléau meurtrier. « Lors du fléau » exprime en français naturel que ces morts se produisirent pendant celui-ci, sans préciser indûment sa nature médicale.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: quatorze mille sept cents
  rationale: Rendu direct du nombre cardinal hébreu en français courant.
- source_word: מִלְּבַד
  choice: sans compter
  rationale: Cette expression indique clairement que les morts précédents liés à Coré ne sont pas inclus dans le total de 14 700.
- source_word: עַל דְּבַר קֹרַח
  choice: à cause de Coré
  rationale: La locution peut exprimer la cause ou le lien avec une affaire. Le texte principal retient une formulation française concise, tandis que la note préserve l’autre nuance possible.
theological_decisions:
- issue: Étendue des morts associés à Coré
  choice: Le verset distingue les 14 700 victimes du fléau des personnes mortes antérieurement à cause de Coré.
  alternative: « ceux qui étaient morts dans l’affaire de Coré »
  rationale: Le texte renvoie au jugement antérieur lié à Coré sans préciser ici les différents groupes de victimes; la traduction n’ajoute donc aucune catégorisation.
translation_notes:
  register: Français international moderne, sobre et digne. « Fléau » conserve le caractère meurtrier du terme hébreu sans imposer une description médicale précise; « sans compter » rend le décompte clairement accessible.
