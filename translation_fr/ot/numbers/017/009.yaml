  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; « Yahweh » est une vocalisation courante. Autre forme française traditionnelle : « Jéhovah » ; traditionnellement aussi rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר avec le waw narratif fait progresser le récit. « Parla » conserve la distinction avec אמר (« dire ») et convient à la formule française courante « parler à quelqu’un ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’équivalent français naturel avec « parler ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, l’infinitif annonce le discours direct qui suit. « En ces termes » est naturel en français et évite le calque pesant « en disant » en fin de verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: L’hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel et constitue une translittération moderne largement admise ; la note signale les autres usages sans substituer silencieusement un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « en ces termes » remplit naturellement la fonction de לֵאמֹר et annonce que le discours commence au verset suivant.
