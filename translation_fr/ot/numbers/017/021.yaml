  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וַ/יִּתְּנ֣וּ אֵלָ֣י/ו כָּֽל נְשִֽׂיאֵי/הֶ֡ם מַטֶּה֩ לְ/נָשִׂ֨יא אֶחָ֜ד מַטֶּ֨ה לְ/נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת וּ/מַטֵּ֥ה אַהֲרֹ֖ן בְּ/ת֥וֹךְ מַטּוֹתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: fr
  text: 'Moïse parla aux fils d’Israël[a], et tous leurs chefs lui remirent chacun un bâton, un bâton pour chaque chef selon leurs maisons paternelles : douze bâtons. Le bâton d’Aaron se trouvait parmi leurs bâtons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites ». L’hébreu dit littéralement « aux fils d’Israël », une désignation courante du peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר signifie ici parler ou s’adresser à quelqu’un. « Parla » convient naturellement à l’introduction narrative.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la formulation hébraïque et sa valeur de désignation collective et traditionnelle du peuple d’Israël; une note indique l’équivalent idiomatique.
- source_word: נְשִׂיאֵיהֶם
  choice: leurs chefs
  rationale: Dans ce contexte tribal, נָשִׂיא désigne les responsables reconnus des tribus. « Chefs » est clair et actuel, sans la connotation monarchique de « princes ».
- source_word: מַטֶּה
  choice: bâton
  rationale: Il s’agit de l’objet matériel remis comme signe représentatif. « Bâton » est le terme français courant et convient à chaque occurrence.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד ... מַטֶּה לְנָשִׂיא אֶחָד
  choice: un bâton, un bâton pour chaque chef
  rationale: La formulation conserve l’insistance distributive de la répétition hébraïque tout en restant naturelle en français.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons ancestrales
  rationale: L’expression renvoie aux groupes de parenté structurés selon la lignée paternelle. « Maisons ancestrales » communique cette réalité sociale avec dignité et clarté.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: soit douze bâtons
  rationale: « Soit » explicite naturellement en français que le total résultant est de douze, sans modifier le contenu.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: Le bâton d’Aaron était au milieu des leurs
  rationale: La proposition nominale hébraïque requiert « était » en français. « Au milieu des leurs » rend בְּתוֹךְ et évite une répétition lourde de « bâtons ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde l’insistance distributive du texte hébreu, tandis que « soit douze bâtons » clarifie le décompte. La désignation littérale « fils d’Israël » est maintenue avec une note proposant l’équivalent collectif courant.
