revisions:
- from: Moïse parla donc aux fils d’Israël[a], et tous leurs chefs lui remirent un bâton, un bâton pour chaque chef selon leurs maisons ancestrales, soit douze bâtons. Le bâton d’Aaron était au milieu des leurs.
  to: 'Moïse parla aux fils d’Israël[a], et tous leurs chefs lui remirent chacun un bâton, un bâton pour chaque chef selon leurs maisons paternelles : douze bâtons. Le bâton d’Aaron se trouvait parmi leurs bâtons.'
  rationale: La révision supprime l’inférence consécutive non exprimée par le texte source, rend explicitement l’inclusion du bâton d’Aaron parmi les autres bâtons, et emploie une formulation plus précise pour la structure de parenté évoquée par « maisons paternelles ». Elle conserve l’insistance distributive et le total de douze bâtons.
