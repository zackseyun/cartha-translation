source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Replace le bâton d’Aaron devant le témoignage[a], afin qu’il y soit conservé comme un signe pour les fils de la rébellion[b]. Ainsi, tu feras cesser leurs murmures contre moi, et ils ne mourront pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « le témoignage » désigne probablement le témoignage de l’alliance associé à l’arche ; l’hébreu emploie seulement cette expression concise.
    reason: cultural_note
  - marker: b
    text: Expression hébraïque pouvant aussi se rendre par « les rebelles » ou « les fils rebelles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin exprimé dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: הָשֵׁב
  choice: Replace
  rationale: Le hifil impératif de שוב demande à Moïse de remettre le bâton à l’endroit où il se trouvait auparavant ; « replace » rend naturellement cette idée.
- source_word: מַטֵּה
  choice: bâton
  rationale: Terme courant et précis pour l’objet porté par Aaron ; il convient mieux ici que « verge » en français moderne.
- source_word: לִפְנֵי הָעֵדוּת
  choice: devant le témoignage
  rationale: Conserve la formulation concise et quelque peu technique de l’hébreu sans ajouter explicitement l’arche, absente de l’expression.
- source_word: לְמִשְׁמֶרֶת
  choice: afin qu’il y soit conservé
  rationale: Exprime la destination du bâton, qui doit être gardé durablement à cet endroit.
- source_word: לְאוֹת
  choice: comme un signe
  rationale: אוֹת désigne ici un signe visible destiné à servir de rappel et d’avertissement.
- source_word: לִבְנֵי מֶרִי
  choice: pour les fils de rébellion
  rationale: Préserve l’idiome filial marqué de l’hébreu et son expression abstraite « de rébellion », tandis qu’une note en donne le sens courant.
- source_word: וּתְכַל
  choice: Ainsi, tu feras cesser
  rationale: Le hifil de כלה signifie ici mener à son terme ou faire cesser. « Ainsi » fait ressortir le résultat visé sans effacer l’adresse directe à Moïse.
- source_word: תְּלוּנֹּתָם
  choice: leurs murmures
  rationale: « Murmures » rend le motif récurrent des protestations du peuple dans le désert, avec une nuance plus accusatrice que le neutre « plaintes ».
- source_word: מֵעָלַי
  choice: contre moi
  rationale: Avec le nom désignant les murmures, la préposition exprime leur orientation hostile envers Yahweh.
- source_word: וְלֹא יָמֻתוּ
  choice: et ils ne mourront pas
  rationale: Conserve la coordination hébraïque et présente la survie du peuple comme le résultat recherché de la cessation des murmures.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin ; sa translittération préserve cette donnée sans substituer un titre.
- issue: Portée de הָעֵדוּת
  choice: le témoignage
  alternative: l’arche du témoignage
  rationale: Dans ce contexte cultuel, le terme est associé au témoignage de l’alliance et probablement à l’arche qui le contient, mais l’hébreu ne mentionne pas explicitement l’arche ; la traduction garde donc l’ambiguïté concise.
- issue: Idiome לִבְנֵי מֶרִי
  choice: les fils de rébellion
  alternative: les rebelles
  rationale: La formulation principale conserve l’image généalogique et abstraite, volontairement marquée, tandis que la note clarifie son référent idiomatique sans lui attribuer un sens doctrinal particulier.
- issue: Lien entre la cessation des murmures et la mort
  choice: Ainsi, tu feras cesser leurs murmures contre moi, et ils ne mourront pas
  alternative: afin que tu fasses cesser leurs murmures contre moi et qu’ils ne meurent pas
  rationale: Le choix conserve la coordination des deux verbes tout en indiquant que le signe vise à arrêter la contestation et à prévenir la mort, sans préciser davantage le mécanisme théologique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste fluide tout en conservant les expressions théologiquement et culturellement chargées « le témoignage » et « les fils de rébellion ». Les guillemets français et la ponctuation sont conformes à l’usage éditorial français.
