base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: fr
  text: À Guershon appartenaient le clan des Libnites et le clan des Shimeïtes ; ce sont les clans des Guershonites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: À Guershon appartenaient
  rationale: Le לְ marque ici l’appartenance ou le rattachement dans une liste généalogique. Cette tournure française rend clairement la relation entre Guershon et les clans qui descendent de lui.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: le clan / les clans
  rationale: Dans ce contexte de recensement lévitique, מִשְׁפָּחָה désigne un groupe de parenté plus large qu’une famille proche et plus restreint qu’une tribu. « Clan » conserve cette distinction.
- source_word: הַלִּבְנִי
  choice: des Libnites
  rationale: La forme gentilice désigne les descendants de Libni. Le pluriel français en « -ites » est concis et convient à la nomenclature généalogique.
- source_word: הַשִּׁמְעִי
  choice: des Shiméites
  rationale: La forme gentilice désigne les descendants de Shiméi. « Shiméites » maintient le lien reconnaissable avec ce nom propre.
- source_word: אֵלֶּה הֵם
  choice: Tels étaient
  rationale: La formule hébraïque identifie récapitulativement les groupes qui viennent d’être nommés. L’imparfait est naturel en français narratif après « appartenaient », sans modifier la fonction identificatrice de la formule.
- source_word: הַגֵּרְשֻׁנִּי
  choice: des Guershonites
  rationale: Le gentilé désigne collectivement la branche lévitique issue de Guershon. « Guershonites » est transparent et conforme à l’usage biblique français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche de la structure hébraïque tout en évitant une formulation artificielle. « Clan » est retenu avec constance pour le niveau de parenté visé; les gentilés traditionnels rendent les groupes de descendants.
