  text: הַקְרֵב֙ אֶת מַטֵּ֣ה לֵוִ֔י וְֽ/הַעֲמַדְתָּ֣ אֹת֔/וֹ לִ/פְנֵ֖י אַהֲרֹ֣ן הַ/כֹּהֵ֑ן וְ/שֵׁרְת֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: fr
  text: Fais approcher la tribu de Lévi et place-la devant Aaron, le prêtre ; ils le serviront[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils exerceront un service auprès de lui ». Le verbe hébreu peut désigner un service d’assistance ou un service cultuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: Fais approcher
  rationale: L’impératif au hifil de קרב exprime l’action de faire venir près ou de faire approcher. Cette formulation conserve le mouvement concret et la portée cultuelle du verbe.
- source_word: מַטֵּה לֵוִי
  choice: la tribu de Lévi
  rationale: Dans ce contexte, מַטֶּה ne désigne pas un bâton, mais le groupe tribal de Lévi. « Tribu » est le terme français courant et précis.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: et place-la
  rationale: Le hifil de עמד signifie ici faire tenir debout, placer ou établir devant quelqu’un. « Place-la » rend naturellement le causatif, et le pronom féminin reprend « la tribu ».
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: devant Aaron, le prêtre
  rationale: לִפְנֵי signifie directement « devant » ou « en présence de ». L’apposition « Aaron, le prêtre » est claire et naturelle en français.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: ils le serviront
  rationale: שרת désigne un service personnel ou cultuel. Le pronom objet renvoie naturellement à Aaron. Le pluriel « ils » respecte le passage de la désignation collective « tribu » au pluriel hébreu visant ses membres.
theological_decisions:
- issue: Nature du service des Lévites auprès d’Aaron
  choice: Les Lévites sont placés devant Aaron pour le servir dans l’exercice de sa fonction sacerdotale.
  alternative: Les Lévites servent avec Aaron plutôt qu’ils ne le servent.
  rationale: Le pronom objet direct dans וְשֵׁרְתוּ אֹתוֹ désigne le plus naturellement Aaron et présente donc le service comme lui étant rendu. Traduire par un service simplement accompli « avec lui » effacerait cette relation grammaticale.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure conserve le mouvement concret de « faire approcher », l’apposition sacerdotale et le passage du collectif singulier au pluriel sans alourdir le verset.
