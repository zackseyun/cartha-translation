  text: לִ/מְרָרִ֕י מִשְׁפַּ֨חַת֙ הַ/מַּחְלִ֔י וּ/מִשְׁפַּ֖חַת הַ/מּוּשִׁ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: fr
  text: 'Pour Merari : le clan des Mahlites et le clan des Mushites. Ce sont là les clans de Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: Pour Merari
  rationale: Le ל préfixé introduit ici, dans une liste de recensement, le groupe descendant de Merari. « Pour Merari » conserve naturellement cette fonction de rubrique.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: le clan / les clans
  rationale: Dans ce contexte généalogique, מִשְׁפָּחָה désigne une unité de parenté située sous le niveau de la tribu ; « clan » est donc plus précis que « famille ».
- source_word: הַמַּחְלִי
  choice: les Mahlites
  rationale: La forme gentilice désigne collectivement les descendants ou le groupe rattaché à Mahli. La désignation française au pluriel convient après « le clan des ».
- source_word: הַמּוּשִׁי
  choice: les Mushites
  rationale: La forme gentilice désigne collectivement les descendants ou le groupe rattaché à Mushi ; « les Mushites » rend clairement ce nom de clan.
- source_word: אֵלֶּה הֵם
  choice: Ce sont là
  rationale: Le démonstratif suivi du pronom produit une identification appuyée. « Ce sont là » en restitue l'emphase avec naturel en français.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: les clans de Merari
  rationale: Cette expression récapitule les deux groupes qui viennent d'être nommés et maintient la terminologie généalogique du verset.
