  text: וְ/לִ/קְהָ֗ת מִשְׁפַּ֤חַת הַֽ/עַמְרָמִי֙ וּ/מִשְׁפַּ֣חַת הַ/יִּצְהָרִ֔י וּ/מִשְׁפַּ֨חַת֙ הַֽ/חֶבְרֹנִ֔י וּ/מִשְׁפַּ֖חַת הָֽ/עָזִּיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַ/קְּהָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: fr
  text: 'Quant à Kehath : le clan des Amramites, le clan des Jitseharites, le clan des Hébronites et le clan des Uzzielites ; tels sont les clans des Kehathites.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: Quant à Qehath
  rationale: La conjonction et la préposition introduisent le groupe généalogique suivant. « Quant à » restitue naturellement en français cette fonction de classement.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: le clan / les clans
  rationale: Dans ce contexte de recensement et de généalogie, מִשְׁפָּחָה désigne une subdivision de parenté au sein d’un groupe plus large ; « clan » est précis et naturel.
- source_word: הַֽ/עַמְרָמִי
  choice: les Amramites
  rationale: Le gentilé désigne les descendants d’Amram ; la forme française conserve clairement ce lien avec le nom de l’ancêtre.
- source_word: הַ/יִּצְהָרִי
  choice: les Yitseharites
  rationale: Le gentilé désigne les descendants de Yitsehar. Cette graphie rend les consonnes du nom hébreu et permet d’en reconnaître la dérivation.
- source_word: הַֽ/חֶבְרֹנִי
  choice: les Hébronites
  rationale: Le gentilé désigne les descendants d’Hébron ; « Hébronites » est la forme française naturelle.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: les Ouzziélites
  rationale: Le gentilé désigne les descendants d’Ouzziel ; la forme française rend le nom propre et sa dérivation de manière lisible.
- source_word: אֵלֶּה הֵם
  choice: Tels sont
  rationale: La formule hébraïque identifie et récapitule les groupes énumérés. Le présent convient à cette classification, et « Tels sont » évite une répétition pesante.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: les clans des Qehathites
  rationale: Le pluriel construit résume les sous-groupes comme appartenant aux descendants de Qehath ; la formulation reste cohérente avec « clan » dans l’énumération.
