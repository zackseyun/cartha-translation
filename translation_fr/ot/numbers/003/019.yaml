  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: fr
  text: 'Et les fils de Qehath, selon leurs clans : Amram, Yitsehar, Hébron et Ouzziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Fils de
  rationale: בְּנֵי est le pluriel construit de « fils de ». Dans cette liste, les noms désignent les fils de Qehath et les fondateurs des clans correspondants. La coordination initiale וּ est naturellement omise en français au début de cette entrée nominale, sans perte du lien avec la liste précédente.
- source_word: קְהָת
  choice: Qehath
  rationale: Nom propre transcrit selon une forme française qui reflète le qoph initial et la consonne finale du nom hébreu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision familiale structurée au sein d’Israël. « Clans » évite le sens trop domestique que pourrait avoir « familles », tandis que « selon » rend la fonction classificatrice de לְ.
- source_word: עַמְרָם
  choice: Amram
  rationale: Nom propre, sous sa forme française courante.
- source_word: וְיִצְהָר
  choice: Yitsehar
  rationale: Transcription française du nom propre יִצְהָר, conservant perceptiblement ses consonnes et le son initial yod.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Nom propre sous sa forme française consacrée. Le contexte généalogique indique qu’il s’agit ici d’une personne, non de la ville du même nom.
- source_word: וְעֻזִּיאֵל
  choice: et Ouzziel
  rationale: Nom propre rendu sous une forme française lisible; la conjonction finale est exprimée conformément à l’usage français dans une énumération.
