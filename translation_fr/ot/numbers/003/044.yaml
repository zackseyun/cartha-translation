  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/044.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », le tétragramme. Souvent rendu par « l’Éternel » ou « le SEIGNEUR » dans les traductions françaises ; ici translittéré « Yahweh ».'
    reason: Préciser le tétragramme et signaler avec exactitude les principaux rendus traditionnels français.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol fait progresser le récit. « Parla » rend naturellement דבר et maintient sa distinction formelle avec אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le contenu de la parole divine. « En ces termes : » exprime cette fonction idiomatiquement en français tout en annonçant la citation qui suit.'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » le traite comme un nom propre et évite de remplacer silencieusement celui-ci par le titre « le SEIGNEUR ».
translation_notes:
  register: Français moderne, courant et digne. La formulation brève conserve la distinction entre דבר (« parla ») et אמר, inclus dans la formule introductive לֵאמֹר. Le marqueur de note est placé immédiatement après « Yahweh », le terme qu’il explique.
