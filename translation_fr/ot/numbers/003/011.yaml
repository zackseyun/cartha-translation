lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le waw consécutif fait avancer le récit et peut se rendre par « et » ou « puis ». « Parla » conserve le sens formel de דבר, tandis que « puis » assure un enchaînement narratif naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif introduit la parole divine qui suit. « En disant » conserve explicitement la formule hébraïque, malgré son caractère quelque peu formulaire en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel divin sans le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « en disant » garde la formule introductive hébraïque et son lien avec la parole du verset suivant.
