  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Puis Yahweh parla à Moïse[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et Yahweh parla à Moïse en disant. » La conjonction initiale peut aussi se traduire par « et ».'
