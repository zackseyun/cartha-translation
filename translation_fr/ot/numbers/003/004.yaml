  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: fr
  text: Mais Nadab et Abihou moururent devant Yahweh lorsqu’ils offrirent devant Yahweh un feu étranger[a] dans le désert du Sinaï ; ils n’avaient pas de fils. Éléazar et Itamar exercèrent le sacerdoce en présence de leur père Aaron[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un feu profane ». Il s’agit vraisemblablement d’un feu qui n’était pas conforme au service cultuel prescrit.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « devant leur père Aaron ». L’expression peut aussi évoquer l’exercice de leur fonction du vivant de leur père.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: moururent
  rationale: Le wayyiqtol de מות rapporte simplement leur mort; le français emploie le pluriel avec le sujet composé Nadab et Abihou.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: L’expression signifie « devant » ou « en présence de »; « devant Yahweh » conserve ici sa concision et sa portée cultuelle et judiciaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּהַקְרִבָם
  choice: lorsqu’ils présentèrent
  rationale: L’infinitif construit avec ב indique la circonstance temporelle; « présenter » convient à l’action d’apporter une offrande devant Dieu sans ajouter un détail absent.
- source_word: אֵשׁ זָרָה
  choice: un feu profane
  rationale: זרה désigne ici un feu étranger au cadre cultuel prescrit, donc impropre; « profane » garde l’altérité cultuelle du terme sans expliciter avec certitude qu’il était « non autorisé ».
- source_word: בְּמִדְבַּר סִינַי
  choice: dans le désert du Sinaï
  rationale: Traduction française naturelle et directe de la désignation géographique.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: Ils n’avaient pas de fils
  rationale: בנים signifie précisément « fils », élément pertinent pour la succession sacerdotale.
- source_word: וַיְכַהֵן
  choice: exercèrent alors le sacerdoce
  rationale: Le verbe כהן signifie remplir la fonction de prêtre; cette formulation française rend clairement la fonction sacerdotale.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: du vivant de leur père Aaron
  rationale: Dans ce contexte généalogique, l’expression peut indiquer qu’ils exercèrent leur fonction pendant la vie d’Aaron; une note conserve le sens plus spatial « devant/en présence de ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Nature du feu présenté
  choice: feu profane
  alternative: feu étranger / feu non autorisé
  rationale: La traduction retient la qualification cultuelle tout en évitant de préciser au-delà du verset la forme exacte de l’infraction.
- issue: Sens de עַל־פְּנֵי concernant Aaron
  choice: du vivant de leur père Aaron
  alternative: devant leur père Aaron / en présence de leur père Aaron
  rationale: Le contexte favorise la contemporanéité avec Aaron, mais le sens spatial demeure possible et est signalé en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms suivent les formes françaises bibliques courantes. La ponctuation répartit les propositions longues de l’hébreu en phrases lisibles, tandis que les notes préservent les principales ambiguïtés lexicales.
