revisions:
- from: Mais Nadab et Abihou moururent devant Yahweh lorsqu’ils présentèrent devant Yahweh un feu profane[a] dans le désert du Sinaï. Ils n’avaient pas de fils. Éléazar et Itamar exercèrent alors le sacerdoce du vivant de leur père Aaron[b].
  to: Mais Nadab et Abihou moururent devant Yahweh lorsqu’ils offrirent devant Yahweh un feu étranger[a] dans le désert du Sinaï ; ils n’avaient pas de fils. Éléazar et Itamar exercèrent le sacerdoce en présence de leur père Aaron[b].
  rationale: La révision remplace « feu profane » par « feu étranger », plus proche de זָרָה et plus usuel en français biblique, tout en conservant l’explication cultuelle en note. Elle remplace « du vivant de » par « en présence de » afin de ne pas décider dans le texte principal entre les valeurs spatiale, relationnelle et possiblement temporelle de עַל־פְּנֵי. La coordination finale reste neutre par suppression de « alors ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:26:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement la mort de Nadab et d’Abihou, la référence à Yahweh, le désert du Sinaï et l’absence de fils. Deux choix demandent correction : « feu profane » est moins précis et peut évoquer simplement le non-sacré, alors que אֵשׁ זָרָה désigne un feu étranger/non conforme au rite ; et « du vivant de » tranche une ambiguïté de עַל־פְּנֵי qui peut aussi signifier « devant/en présence de ».'
  naturalness: Le français est globalement naturel et de registre biblique moderne. « Offrirent un feu étranger » est plus idiomatique dans ce contexte cultuel que « présentèrent ... un feu profane ». « En présence de leur père Aaron » conserve une formulation française claire sans imposer le seul sens chronologique.
  terminology: « Yahweh », « désert du Sinaï », « fils » et « exercer le sacerdoce » sont adéquats. « Feu étranger » est le terme français biblique établi et garde l’altérité cultuelle du mot hébreu sans définir de façon doctrinale la nature exacte de l’infraction.
  issues:
  - severity: medium
    issue: « feu profane » pour אֵשׁ זָרָה
    rationale: « Profane » oppose normalement le profane au sacré et ne rend pas aussi directement l’idée d’un feu « étranger » ou non conforme. « Feu étranger » offre une correspondance lexicale plus sûre ; une note peut expliciter prudemment le sens cultuel probable.
  - severity: medium
    issue: « du vivant de leur père Aaron » dans le texte principal
    rationale: Le syntagme עַל־פְּנֵי peut exprimer la présence/devant Aaron et peut comporter une nuance de contemporanéité. Le choix exclusif « du vivant de » résout une ambiguïté discutée ; le texte principal doit la préserver, la nuance chronologique étant reléguée en note.
  - severity: low
    issue: Ajout de « alors »
    rationale: « Alors » accentue une succession temporelle qui n’est pas explicitement marquée au-delà de la coordination narrative hébraïque. Sa suppression est plus neutre.
