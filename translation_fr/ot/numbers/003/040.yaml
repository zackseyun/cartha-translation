source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: fr
  text: 'Puis Yahvé dit à Moïse : « Compte tous les premiers-nés de sexe masculin parmi les fils d’Israël, depuis l’âge d’un mois, et relève-les par leur nom[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « relève le nombre de leurs noms ».'
    reason: La note préserve la forme inhabituelle de l’idiome hébraïque derrière la traduction française naturelle.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française traditionnelle et reconnaissable du tétragramme YHWH, qui représente le nom divin plutôt que de le remplacer par un titre.
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw narratif fait avancer le récit; « Puis » rend naturellement cette succession en français.
- source_word: פְּקֹד
  choice: Compte
  rationale: Dans ce contexte de recensement, l’impératif demande de dénombrer; « Compte » est direct, courant et précis.
- source_word: כָּל בְּכֹר זָכָר
  choice: tous les premiers-nés de sexe masculin
  rationale: La formulation conserve à la fois l’idée de premier-né et la précision explicite זָכָר, tout en restant naturelle en français.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: « Parmi » convient à l’extraction d’un groupe recensé, tandis que « fils d’Israël » préserve la formulation hébraïque sans la confondre avec les seuls premiers-nés eux-mêmes.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: depuis l’âge d’un mois
  rationale: Cette expression française indique clairement que le recensement commence à un mois révolu et inclut les âges supérieurs, sans calquer lourdement « et au-dessus ».
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: et relève-les par leur nom
  rationale: L’expression hébraïque, littéralement liée au fait de relever le nombre de leurs noms, désigne ici un dénombrement nominatif. Cette formulation transmet naturellement l’idée sans reproduire un idiome obscur en français.
