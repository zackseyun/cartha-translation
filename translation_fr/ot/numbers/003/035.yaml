source:
  edition: WLC
  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: fr
  text: Et le chef[a] de la maison paternelle[b] des clans de Merari était Tsouriel, fils d’Abihaïl. Ils devaient camper du côté nord du tabernacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsable » ou « prince » ; le mot hébreu désigne un dirigeant reconnu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « maison du père », expression désignant un groupe familial issu d’un même ancêtre.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Le chef
  rationale: Dans ce contexte d’organisation des clans lévitiques, נָשִׂיא désigne un responsable reconnu. « Chef » est naturel et évite les connotations monarchiques de « prince ». La coordination וּ n’est pas rendue séparément, puisque le verset français forme une nouvelle phrase dans une énumération continue.
- source_word: בֵית אָב
  choice: la maison ancestrale
  rationale: L’expression, littéralement « maison du père », désigne une unité de parenté patrilinéaire. « Maison ancestrale » conserve cette dimension institutionnelle sans évoquer un simple bâtiment ou foyer immédiat.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: des clans de Merari
  rationale: Dans les listes de Nombres, מִשְׁפָּחוֹת désigne les subdivisions claniques. Le préfixe לְ est rendu idiomatiquement par la relation exprimée avec « de ».
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: Tsouriel, fils d’Abihaïl
  rationale: Les noms sont translittérés selon des formes françaises lisibles, et בֶּן est rendu par la formule généalogique habituelle « fils de ».
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן ... צָפֹנָה
  choice: sur le côté nord du tabernacle
  rationale: יֶרֶךְ signifie ici le côté ou flanc; צָפֹנָה précise l’orientation. La formulation française réunit naturellement les deux éléments. « Tabernacle » rend מִשְׁכָּן dans ce contexte cultuel.
- source_word: יַחֲנוּ
  choice: Ils devaient camper
  rationale: L’imparfait hébreu exprime ici la disposition prescrite du camp. « Devaient camper » rend cette assignation plus clairement qu’un simple futur.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit l’organisation informative de l’hébreu tout en évitant une tournure excessivement littérale. Les marqueurs de notes [a] et [b] sont placés immédiatement après les termes concernés.
