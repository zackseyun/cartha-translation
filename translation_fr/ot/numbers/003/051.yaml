base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Moïse remit l’argent du rachat[a] à Aaron et à ses fils, sur l’ordre de Yahweh, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’argent des rachetés », c’est-à-dire la somme recueillie pour leur rachat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: remit
  rationale: Dans ce contexte de transfert d’une somme collectée, « remit » exprime naturellement l’action de donner officiellement l’argent à ses destinataires.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: l’argent du rachat
  rationale: כֶּסֶף peut désigner l’argent comme moyen de paiement, tandis que le participe passif הַפְּדֻיִם signifie littéralement « les rachetés ». Dans ce groupe construit, l’expression désigne la somme versée pour leur rachat.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: à Aaron et à ses fils
  rationale: La formulation française identifie clairement les fils comme ceux d’Aaron et rend naturellement les deux prépositions hébraïques.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: L’expression signifie littéralement « selon la bouche de Yahweh », idiome qui indique ici qu’on agit sur son commandement.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exactement comme Yahweh l’avait ordonné à Moïse
  rationale: « Exactement comme » souligne la conformité de l’acte à l’ordre antérieur, et le plus-que-parfait situe naturellement cet ordre avant son exécution.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu qui emploie le tétragramme.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de כֶּסֶף הַפְּדֻיִם
  choice: l’argent du rachat
  alternative: l’argent des rachetés
  rationale: Le contexte immédiat indique qu’il s’agit de la somme collectée pour le rachat. La note maintient visible la forme plus littérale et son lien avec les personnes rachetées.
translation_notes:
  register: Français international moderne, digne et accessible. « Remit » convient à un transfert officiel d’argent; « rachat » conserve la portée juridique et cultuelle du passage sans ajouter d’interprétation confessionnelle.
