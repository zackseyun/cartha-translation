  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: fr
  text: Car tout premier-né est à moi[a]. Le jour où j’ai frappé tous les premiers-nés dans le pays d’Égypte, j’ai consacré pour moi tout premier-né en Israël, des êtres humains au bétail[b]. Ils seront à moi. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « est à moi ». Cette expression d’appartenance est répétée dans tout le verset : « est à moi », « pour moi », « seront à moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de l’être humain au bétail », expression qui englobe les humains et le bétail.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la déclaration précédente concernant les lévites et conserve naturellement la valeur explicative de la conjonction.
- source_word: לִי
  choice: m’appartient / à mon service / m’appartiendront
  rationale: La triple formulation maintient l’insistance sur l’appartenance à Dieu; « à mon service » explicite dans un français naturel la portée de la consécration, sans supprimer l’idée de possession.
- source_word: כָּל בְּכוֹר
  choice: tout premier-né / tous les premiers-nés
  rationale: Rend le caractère exhaustif de כָּל sans ajouter « mâle », qui n’est pas explicite dans ce verset.
- source_word: בְּיוֹם
  choice: Le jour où
  rationale: Conserve le lien temporel formel tout en restant idiomatique en français moderne.
- source_word: הַכֹּתִי
  choice: j’ai frappé
  rationale: Dans le contexte de la mort des premiers-nés d’Égypte, le verbe exprime le jugement mortel; le contexte permet de garder la formulation sobre de l’hébreu.
- source_word: הִקְדַּשְׁתִּי
  choice: j’ai consacré à mon service
  rationale: Le hiphil de קדשׁ signifie mettre à part comme saint pour Dieu. Cette formulation communique clairement la consécration et sa finalité en français courant.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: depuis les êtres humains jusqu’aux animaux
  rationale: Rend le mérisme qui englobe les premiers-nés humains et animaux, dans une langue actuelle et sans ambiguïté de genre.
- source_word: יִהְיוּ
  choice: Ils m’appartiendront
  rationale: Le futur exprime la permanence de la revendication divine et reprend le motif de לִי.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: Transcrit le nom divin personnel et préserve la formule solennelle d’autorité et d’identité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » rend le nom personnel plutôt qu’un titre de substitution.
- issue: Portée de la consécration des premiers-nés
  choice: j’ai consacré à mon service
  alternative: je me suis consacré / j’ai sanctifié pour moi
  rationale: La construction hébraïque indique que Dieu met les premiers-nés à part pour lui-même. La traduction conserve à la fois la dimension sacrée et l’appartenance, sans préciser davantage la manière dont ce droit est exercé.
- issue: Sens collectif de אָדָם dans le mérisme
  choice: les êtres humains
  alternative: l’homme
  rationale: Ici אָדָם désigne collectivement la catégorie humaine opposée aux animaux; la formulation choisie est exacte, inclusive et naturelle en français contemporain.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de l’appartenance divine est préservée, tandis que le mérisme hébreu est rendu par des catégories collectives naturelles. Les marqueurs [a] et [b] figurent tous deux dans le texte.
