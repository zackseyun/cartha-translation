revisions:
- from: Car tout premier-né m’appartient[a]. Le jour où j’ai frappé tous les premiers-nés dans le pays d’Égypte, j’ai consacré à mon service tous les premiers-nés en Israël, depuis les êtres humains jusqu’aux animaux[b]. Ils m’appartiendront. Je suis Yahweh.
  to: Car tout premier-né est à moi[a]. Le jour où j’ai frappé tous les premiers-nés dans le pays d’Égypte, j’ai consacré pour moi tout premier-né en Israël, des êtres humains au bétail[b]. Ils seront à moi. Je suis Yahweh.
  rationale: La révision rétablit explicitement la triple insistance de לִי sans ajouter l’idée de service. Elle affine aussi le rendu de בְּהֵמָה par « bétail ». « J’ai frappé » conserve la formulation sobre du verbe hébreu dans son contexte narratif connu.
  reviewer_model: gpt-5.6-terra
