  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: fr
  text: Recense les fils de Lévi selon leurs maisons ancestrales[a] et selon leurs clans ; tu recenseras tout mâle âgé d’un mois ou plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Lévites » au lieu de « les fils de Lévi ». L’hébreu dit littéralement « les fils de Lévi », ce qui souligne la filiation et l’organisation clanique.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: recense / tu recenseras
  rationale: Dans ce contexte administratif, פקד désigne le dénombrement ou l’inscription lors d’un recensement. « Recenser » rend clairement l’action sans lui donner une nuance militaire.
- source_word: בְּנֵי לֵוִי
  choice: les fils de Lévi
  rationale: La formulation littérale conserve l’accent généalogique du texte, en harmonie avec la mention des maisons ancestrales et des clans.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons ancestrales
  rationale: L’expression désigne les unités de parenté rattachées aux pères. « Maisons ancestrales » reste proche de cette structure tout en étant compréhensible en français moderne.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: « Clans » distingue ce niveau de parenté des maisons ancestrales mentionnées juste avant.
- source_word: כָּל זָכָר
  choice: tous les individus de sexe masculin
  rationale: Le terme précise le sexe, non l’âge adulte; cette formulation inclut donc sans ambiguïté les nourrissons visés par la suite du verset.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: âgés d’un mois ou plus
  rationale: Cette expression française naturelle et précise rend le seuil d’âge inférieur indiqué par l’idiome hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « recenser » reflète celle de la racine hébraïque; la seconde occurrence est conservée comme instruction récapitulative. « Maisons ancestrales » évite l’expression française potentiellement ambiguë « maisons de leurs pères ».
