  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: fr
  text: Voici les générations d’Aaron et de Moïse[a], à l’époque où Yahweh parla à Moïse[b][c] sur le mont Sinaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la descendance d’Aaron et de Moïse ». L’hébreu « générations » est une formule de rubrique qui peut introduire une lignée ou ce qui procède de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au jour où »; cette expression peut signifier « à l’époque où » ou simplement « lorsque ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « parla avec Moïse ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule déictique introduit une nouvelle section. « Voici » est une tournure française naturelle et digne qui rend la fonction présentative sans alourdir la conjonction initiale.
- source_word: תּוֹלְדֹת
  choice: la lignée
  rationale: Le nom peut désigner les générations, la descendance ou ce qui procède de quelqu’un, et sert fréquemment de rubrique généalogique. « La lignée » convient ici à la liste qui suit, tout en évitant l’étrangeté de « générations d’Aaron et de Moïse » en français courant; une note conserve la portée plus formelle et ambiguë de l’hébreu.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: d’Aaron et de Moïse
  rationale: Les deux noms sont maintenus dans l’ordre du texte, même si la suite présente surtout les fils d’Aaron.
- source_word: בְּיוֹם
  choice: à l’époque où
  rationale: L’expression signifie littéralement « au jour où », mais fonctionne ici comme une indication temporelle générale. « À l’époque où » en rend naturellement le sens sans imposer une seule journée.
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: parla avec Moïse
  rationale: La construction avec דִּבֶּר et אֶת peut exprimer le fait de parler avec quelqu’un ou de lui parler. « Parla avec » préserve la possibilité relationnelle de la construction; « parla à » est signalé en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: בְּהַר סִינָי
  choice: sur le mont Sinaï
  rationale: Rendu géographique français usuel, correspondant à la préposition et au nom du lieu.
theological_decisions:
- issue: Portée de תּוֹלְדֹת dans une rubrique nommant Aaron et Moïse
  choice: Maintenir Aaron et Moïse dans la rubrique et rendre תּוֹלְדֹת par « lignée », avec l’alternative formelle en note
  alternative: « les générations d’Aaron et de Moïse » ou « les descendants d’Aaron et de Moïse »
  rationale: Le contexte immédiat porte principalement sur les fils d’Aaron, mais le texte nomme explicitement Aaron et Moïse. La traduction ne supprime ni Moïse ni la tension entre la rubrique et la liste qui suit.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: « le Seigneur » ou « Jéhovah »
  rationale: Le texte source emploie le nom propre divin. Sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Valeur de דִּבֶּר ... אֶת
  choice: « parla avec Moïse »
  alternative: « parla à Moïse »
  rationale: Les deux formulations sont possibles. Le texte principal retient « avec » sans exclure la lecture directionnelle, donnée en note.
translation_notes:
  register: Français international moderne, accessible et soutenu. « Voici » marque nettement l’ouverture de la section. Les notes conservent la forme hébraïque de la rubrique, l’idiome temporel et l’ambiguïté de la construction verbale.
