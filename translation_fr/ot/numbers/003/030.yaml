  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י אֶלִיצָפָ֖ן בֶּן עֻזִּיאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: fr
  text: Le chef[a] de la maison ancestrale[b] des familles des Qehatites était Élitsafân, fils d’Ouzziel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsable » ou « prince » (hébreu נָשִׂיא).
    reason: lexical_alternative
  - marker: b
    text: Littéralement « maison du père », expression désignant une unité familiale ou clanique fondée sur la lignée paternelle.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Le chef
  rationale: נָשִׂיא désigne ici le responsable reconnu d’un groupe tribal. « Chef » exprime cette autorité sans connotation monarchique. Le ו initial n’est pas rendu séparément, car en français ce verset fonctionne naturellement comme la suite d’une liste administrative.
- source_word: בֵית אָב
  choice: la maison ancestrale
  rationale: Littéralement « maison du père », cette expression désigne une unité de parenté patrilinéaire. « Maison ancestrale » conserve l’image de la maison tout en rendant le sens social de l’expression.
- source_word: לְ/מִשְׁפְּחֹת
  choice: des familles
  rationale: מִשְׁפְּחֹת désigne les groupes familiaux ou clans. « Familles » permet de préserver les niveaux de parenté distincts exprimés par « maison ancestrale » et « familles ».
- source_word: הַ/קְּהָתִי
  choice: des Qehatites
  rationale: Le gentilé singulier avec article a ici un sens collectif et désigne les descendants de Qehath. « Qehatites » est une désignation de groupe claire en français.
- source_word: אֶלִיצָפָן
  choice: Élitsafân
  rationale: Le nom propre est translittéré d’après sa forme hébraïque, avec une graphie adaptée au français.
- source_word: בֶּן עֻזִּיאֵל
  choice: fils d’Ouzziel
  rationale: Formule généalogique courante, rendue directement et naturellement en français.
theological_decisions: []
