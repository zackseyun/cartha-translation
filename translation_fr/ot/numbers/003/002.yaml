base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/002.yaml
  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: fr
  text: 'Voici les noms des fils d’Aaron : Nadab, le premier-né, Abihou, Éléazar et Itamar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule déictique introduit naturellement une liste en français. « Voici » restitue l’effet présentatif sans alourdir le début par la conjonction hébraïque.
- source_word: שְׁמוֹת
  choice: les noms
  rationale: Dans la chaîne construite שְׁמוֹת בְּנֵי אַהֲרֹן, le français idiomatique demande « les noms ».
- source_word: בְּנֵי אַהֲרֹן
  choice: des fils d’Aaron
  rationale: Rendu direct et naturel de la chaîne construite, sans ambiguïté sur la filiation.
- source_word: הַבְּכֹר
  choice: le premier-né
  rationale: « Premier-né » exprime le statut indiqué par בְּכוֹר plus précisément que « l’aîné ». Le syntagme est placé en apposition après Nadab, conformément à l’usage français naturel.
- source_word: נָדָב
  choice: Nadab
  rationale: Translittération française usuelle du nom propre.
- source_word: וַאֲבִיהוּא
  choice: Abihou
  rationale: Translittération française usuelle du nom propre ; la coordination est rendue selon la syntaxe naturelle d’une énumération française.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Translittération française usuelle du nom propre.
- source_word: וְאִיתָמָר
  choice: et Itamar
  rationale: Translittération française usuelle ; la conjonction finale conserve la structure d’énumération.
