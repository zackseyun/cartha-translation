id: NUM.3.50
reference: Numbers 3:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֵ/אֵ֗ת בְּכ֛וֹר בְּנֵ֥י יִשְׂרָאֵ֖ל לָקַ֣ח אֶת הַ/כָּ֑סֶף חֲמִשָּׁ֨ה וְ/שִׁשִּׁ֜ים וּ/שְׁלֹ֥שׁ מֵא֛וֹת וָ/אֶ֖לֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: fr
  text: Il préleva auprès des premiers-nés des fils d’Israël l’argent[a], soit mille trois cent soixante-cinq sicles, selon le sicle du sanctuaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner l’argent métal ou l’argent servant au paiement.
    reason: lexical_ambiguity
  - marker: b
    text: Il s’agit du sicle conforme à l’étalon de poids du sanctuaire.
    reason: historical_measurement
lexical_decisions:
- source_word: מֵאֵת
  choice: auprès de
  rationale: La préposition introduit ici les personnes auprès desquelles l’argent est prélevé. « Auprès de » exprime naturellement cette provenance en français sans ajouter l’idée plus précise de « de la main de ».
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: des premiers-nés des fils d’Israël
  rationale: Le singulier collectif בְּכוֹר est rendu par un pluriel naturel en français. « Fils d’Israël » conserve la structure hébraïque et la référence masculine du contexte de recensement et de rachat.
- source_word: לָקַח
  choice: préleva
  rationale: Le verbe signifie fondamentalement « prendre ». Dans ce contexte de perception d’une somme de rachat, « préleva » en communique naturellement le sens sans le réduire au simple fait de recevoir.
- source_word: הַכָּסֶף
  choice: l’argent
  rationale: כֶּסֶף désigne l’argent métal et, par extension, l’argent comme moyen de paiement. Le français « argent » conserve naturellement les deux valeurs.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: mille trois cent soixante-cinq
  rationale: Les composantes du nombre hébreu sont exprimées selon l’ordre cardinal idiomatique du français moderne.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La formule désigne l’étalon de poids en usage pour le sanctuaire. « Selon » rend la valeur normative de la préposition, tandis que « sicle du sanctuaire » conserve la référence cultuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Préleva auprès de » évite la tournure lourde « prit de la part de » tout en respectant le mouvement du texte hébreu. « Soit » introduit naturellement le montant exact. Les termes traditionnels « fils d’Israël », « sicle » et « sanctuaire » sont maintenus en raison de leur précision contextuelle.
