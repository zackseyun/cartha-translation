  text: וַ/יִּפְקֹ֥ד אֹתָ֛/ם מֹשֶׁ֖ה עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צֻוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: fr
  text: Moïse les recensa sur l’ordre de Yahweh[a], comme il en avait reçu l’ordre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche de Yahweh ».'
    reason: La note conserve l’image concrète de l’expression hébraïque עַל־פִּי, rendue idiomatiquement dans le texte principal.
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: recensa
  rationale: Dans ce contexte de dénombrement des Lévites, פקד désigne l’action de compter et d’inscrire les personnes concernées. « Recensa » exprime naturellement cette idée en français.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux Lévites mentionnés dans le contexte immédiat.
- source_word: עַל־פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: L’expression signifie littéralement « selon la bouche de Yahweh », mais fonctionne ici comme un idiome désignant un ordre donné par Dieu. « Sur l’ordre de » en restitue clairement l’autorité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction marque la conformité de l’action de Moïse à l’ordre reçu.
- source_word: צֻוָּה
  choice: cela lui avait été ordonné
  rationale: La forme passive indique que Moïse avait reçu auparavant cet ordre. Le plus-que-parfait rend naturellement cette antériorité en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, clair et digne. « Recensa » convient au contexte administratif du dénombrement, tandis que la répétition de l’idée d’ordre préserve l’insistance du texte hébreu.
