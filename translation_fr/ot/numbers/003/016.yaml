    issue: « donc » ajoute une nuance déductive.
    rationale: Le waw narratif introduit l’action de Moïse, mais n’exprime pas nécessairement une conséquence logique. « Donc » peut ainsi surinterpréter légèrement le lien.
  - severity: low
