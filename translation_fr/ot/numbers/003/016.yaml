  verdict: revise
  source_fidelity: Le sens de וַיִּפְקֹד (« recensa ») est bien rendu dans ce contexte de dénombrement, ainsi que l’idiome עַל־פִּי יְהוָה (« sur l’ordre de Yahweh »). La finale passive (« comme il en avait reçu l’ordre ») rend clairement l’idée que Moïse avait été commandé, sans identifier plus explicitement un agent que ne le fait le texte.
  naturalness: « Recensa » et « sur l’ordre de » sont naturels dans un français moderne de registre soutenu. La suppression de « donc », qui peut suggérer une conséquence absente de la simple conjonction narrative hébraïque, est préférable. « Comme il en avait reçu l’ordre » est plus idiomatique et moins ambigu que « comme cela lui avait été ordonné ».
  terminology: « Yahweh » respecte le rendu établi du tétragramme. « Recensa » convient au vocabulaire administratif du recensement lévitique. La note conserve justement l’image littérale de l’expression hébraïque.
