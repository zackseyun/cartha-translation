revisions:
- from: Quant à moi, voici que j’ai pris les Lévites du milieu des fils d’Israël[a], à la place de tout premier-né qui ouvre le sein maternel parmi les fils d’Israël. Les Lévites seront à moi.
  to: Quant à moi, voici que j’ai pris les Lévites du milieu des fils d’Israël[a], à la place de tout premier-né qui ouvre la matrice parmi les fils d’Israël. Les Lévites seront à moi.
  rationale: La seule révision nécessaire remplace « sein maternel », ambigu et anatomiquement inexact en français moderne, par « matrice », qui restitue la formule hébraïque technique « celui qui ouvre la matrice ». Le reste du texte et la note sont conservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:26:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les principaux termes hébreux sont bien rendus : emphase initiale, choix des Lévites parmi les fils d’Israël, substitution à chaque premier-né et appartenance à Dieu. Toutefois, « sein maternel » désigne normalement le sein au sens de poitrine en français moderne et ne rend donc pas avec suffisamment de précision רֶחֶם, « matrice/utérus ».'
  naturalness: Le français est globalement naturel, soutenu et lisible. « Quant à moi, voici que » convient au ton déclaratif. La correction de l’expression anatomique évite une ambiguïté moderne importante.
  terminology: « Lévites », « fils d’Israël », « à la place de » et « seront à moi » sont cohérents avec le texte source et avec un registre biblique moderne. « Matrice » est ici le terme juridique-biblique précis pour la catégorie technique פֶּטֶר רֶחֶם.
  issues:
  - severity: medium
    issue: « qui ouvre le sein maternel »
    rationale: En français actuel, « sein » renvoie ordinairement au breast, non à l’utérus. Le terme hébreu רֶחֶם désigne la matrice/le ventre maternel ; « qui ouvre la matrice » rend précisément l’expression juridique sans modifier son sens.
  revised_text: Quant à moi, voici que j’ai pris les Lévites du milieu des fils d’Israël[a], à la place de tout premier-né qui ouvre la matrice parmi les fils d’Israël. Les Lévites seront à moi.
