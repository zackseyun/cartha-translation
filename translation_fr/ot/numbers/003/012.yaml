source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: fr
  text: Quant à moi, voici que j’ai pris les Lévites du milieu des fils d’Israël[a], à la place de tout premier-né qui ouvre la matrice parmi les fils d’Israël. Les Lévites seront à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites ». L’expression hébraïque signifie littéralement « les fils d’Israël » et constitue une formule traditionnelle.
    reason: Signaler un équivalent collectif idiomatique tout en expliquant la formulation littérale retenue dans le texte.
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Quant à moi, voici que
  rationale: Cette formulation conserve à la fois la transition, l’insistance portée par le pronom explicite et la force présentative de הִנֵּה, dans un français soutenu mais compréhensible.
- source_word: לָקַחְתִּי
  choice: j’ai pris
  rationale: Le passé composé exprime l’action divine accomplie dont les effets demeurent valables.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française traditionnelle et claire des membres de la tribu de Lévi.
- source_word: מִתּוֹךְ
  choice: du milieu de
  rationale: Rend explicitement la sélection opérée au sein d’un groupe plus vaste, tout en restant naturel en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression hébraïque masculine et formulaire; l’équivalent collectif plus idiomatique est signalé en note.
- source_word: תַּחַת
  choice: à la place de
  rationale: Exprime clairement le rapport de substitution dans ce contexte cultuel et juridique.
- source_word: כָּל בְּכוֹר
  choice: tout premier-né
  rationale: Restitue la portée distributive de כָּל avec une formulation française concise.
- source_word: פֶּטֶר רֶחֶם
  choice: qui ouvre le sein maternel
  rationale: Préserve l’image concrète et la valeur technique de la formule hébraïque désignant le premier enfant à naître d’une mère.
- source_word: וְהָיוּ לִי
  choice: Les Lévites seront à moi
  rationale: Rend directement l’appartenance revendiquée par Dieu ainsi que la portée résultative ou future de la proposition.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: Le texte hébreu emploie une expression masculine formulaire. La traduction principale en garde la forme, sans décider que celle-ci exclut nécessairement l’ensemble de la communauté; la note fournit l’équivalent collectif courant.
- issue: Nature du lien exprimé par וְהָיוּ לִי
  choice: Les Lévites seront à moi
  alternative: Les Lévites m’appartiendront
  rationale: La formulation affirme sobrement la revendication divine sur les Lévites dans un contexte de consécration, sans lui ajouter une catégorie théologique étrangère au verset.
translation_notes:
  register: Français international actuel, digne et lisible. « Voici que » garde la solennité de la déclaration sans recourir à l’archaïque « voici, je ». La répétition de « fils d’Israël » et la formule « ouvre le sein maternel » sont maintenues en raison de leur fonction juridique et cultuelle.
