review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : Aaron et ses fils sont désignés pour la charge sacerdotale, et l’approche d’une personne non habilitée entraîne la mise à mort. Toutefois, « étrangère à cette fonction » introduit une formulation plus étroite et moins naturelle que le terme hébreu זָר, qui désigne globalement une personne non autorisée dans ce contexte, sans que le verset définisse lui-même avec précision l’objet ou la limite de l’approche.'
  naturalness: « Tu établiras Aaron et ses fils » et « ils veilleront sur leur fonction sacerdotale » sont recevables en français moderne. En revanche, « toute personne étrangère à cette fonction » est lourd et peut donner l’impression que la personne est extérieure à une fonction abstraite, plutôt que non habilitée à l’accès sacerdotal. « Toute personne non autorisée » est plus idiomatique et plus clair.
  terminology: « Fonction sacerdotale » rend convenablement כְּהֻנָּתָם comme office sacerdotal. « Sera mise à mort » reflète correctement la valeur passive-causative de יוּמָת. Le remplacement de « étrangère à cette fonction » par « non autorisée » évite aussi une connotation indue d’origine ethnique tout en conservant la portée d’exclusion de זָר.
  issues:
