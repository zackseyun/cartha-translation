  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: fr
  text: Tu établiras Aaron et ses fils, et ils veilleront sur leur fonction sacerdotale. Mais toute personne non autorisée[a] qui s’approchera sera mise à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étranger ». L’expression hébraïque désigne ici une personne qui n’est pas autorisée à accéder au domaine ou au service sacerdotal ; elle ne renvoie pas spécialement à une origine étrangère.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: tu établiras
  rationale: Dans ce contexte, פקד désigne l’établissement ou l’affectation d’Aaron et de ses fils à leur charge, plutôt qu’un recensement. « Établiras » exprime naturellement leur désignation officielle.
- source_word: וְשָׁמְרוּ
  choice: ils veilleront sur
  rationale: שׁמר comporte l’idée de garder, de préserver et de surveiller. « Veilleront sur » rend ici la responsabilité de protéger l’exercice et les limites de la fonction sacerdotale.
- source_word: כְּהֻנָּתָם
  choice: leur fonction sacerdotale
  rationale: Le nom désigne l’office et le service propres aux prêtres. « Fonction sacerdotale » est plus immédiatement compréhensible en français courant que le seul terme « sacerdoce », tout en conservant le sens institutionnel.
- source_word: הַזָּר
  choice: toute personne étrangère à cette fonction
  rationale: זָר désigne ici une personne extérieure au cercle autorisé, et non nécessairement une personne d’origine étrangère. Cette formulation évite une lecture ethnique tout en gardant l’image de l’extériorité.
- source_word: הַקָּרֵב
  choice: qui s’approchera
  rationale: Le participe de קרב évoque l’approche d’un domaine ou d’un service sacré réservé. Le futur français s’accorde naturellement avec la portée juridique de l’énoncé.
- source_word: יוּמָת
  choice: sera mise à mort
  rationale: 'Le hophal de מות est passif et causatif : il s’agit d’une peine infligée, et non de la simple annonce d’un décès.'
theological_decisions:
- issue: Portée de l’accès réservé au sacerdoce
  choice: Le verset réserve à Aaron et à ses fils la responsabilité de la fonction sacerdotale et annonce la mort de toute personne non autorisée qui s’en approche.
  alternative: Comprendre l’interdiction plus largement comme visant toute approche d’un espace sacré par un non-prêtre, sans déterminer ici la limite rituelle exacte.
  rationale: Le texte lie explicitement la charge d’Aaron et de ses fils à l’exclusion du זָר. La traduction conserve l’avertissement et son caractère absolu sans préciser des limites rituelles que ce verset seul ne définit pas.
translation_notes:
  register: Français moderne, clair et digne. Le singulier collectif hébreu est rendu par « toute personne ». « Fonction sacerdotale » évite le caractère potentiellement abstrait de « sacerdoce », tandis que la note préserve la nuance de l’expression hébraïque désignant l’outsider.
