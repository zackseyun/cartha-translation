    issue: « toute personne étrangère à cette fonction »
    rationale: Cette expression est peu idiomatique et restreint inutilement זָר à une relation avec « cette fonction ». Dans ce contexte, זָר vise une personne dépourvue de l’autorisation requise, non une personne étrangère par ethnicité ni seulement extérieure à une fonction formulée comme telle.
