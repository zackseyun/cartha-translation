revisions:
- from: Tu donneras les Lévites à Aaron et à ses fils ; ils lui sont entièrement donnés[a], pris parmi les fils d’Israël[b].
  to: Tu donneras les Lévites à Aaron et à ses fils ; ils lui sont entièrement donnés[a] d’entre les fils d’Israël[b].
  rationale: La révision retire le participe interprétatif « pris » et rend la provenance par « d’entre », qui correspond au sens contextuel de la construction tout en restant proche du texte. La note b maintient l’autre lecture possible, sans effacer l’expression « fils d’Israël ».
