source:
  edition: WLC
  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: fr
  text: Tu donneras les Lévites à Aaron et à ses fils ; ils lui sont entièrement donnés[a] d’entre les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « donnés » pour insister : « donnés, donnés » ou « assurément donnés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « de la part des Israélites ». Hébreu : « d’auprès des fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu donneras
  rationale: Le parfait qal précédé de la conjonction a ici, dans une série d’instructions, une valeur directive. Le futur français exprime naturellement cet ordre solennel.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation traditionnelle, précise et immédiatement compréhensible des membres de la tribu de Lévi affectés au service du sanctuaire.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: à Aaron et à ses fils
  rationale: La préposition לְ introduit les destinataires de ce don ou de cette affectation. « À » conserve naturellement cette relation.
- source_word: נְתוּנִם נְתוּנִם
  choice: entièrement donnés
  rationale: La répétition du participe passif intensifie l’idée du don. « Entièrement donnés » en restitue l’emphase dans un français naturel, tandis que la forme hébraïque est signalée en note.
- source_word: הֵמָּה
  choice: ils sont
  rationale: Le pronom indépendant souligne le sujet. En français, l’emphase est suffisamment portée par « entièrement donnés » sans ajouter un lourd « eux-mêmes ».
- source_word: לוֹ
  choice: lui
  rationale: Le pronom renvoie à Aaron dans le contexte immédiat et maintient le langage du don ou de l’affectation.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: pris parmi les fils d’Israël
  rationale: La construction indique la provenance des Lévites par rapport à l’ensemble d’Israël. « Pris parmi » explicite naturellement en français cette idée de prélèvement, sans effacer l’expression familiale « fils d’Israël ».
theological_decisions:
- issue: Sens de מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: pris parmi les fils d’Israël
  alternative: de la part des Israélites
  rationale: Le contexte présente les Lévites comme séparés du reste d’Israël et remis à Aaron, ce qui favorise l’idée de prélèvement. La construction peut toutefois mettre plus simplement l’accent sur la provenance du don ; cette possibilité est conservée en note.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le rendu formel conserve l’image familiale et collective de l’hébreu, pertinente dans ce contexte tribal et d’alliance. La formulation collective plus courante figure dans la variante en note.
translation_notes:
  register: Français moderne, digne et accessible. Le futur à valeur d’ordre convient au discours législatif. Le point-virgule maintient l’unité de la phrase, et les notes préservent l’emphase hébraïque ainsi que l’ambiguïté relative à la provenance.
