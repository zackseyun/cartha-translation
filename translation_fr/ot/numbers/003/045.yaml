id: NUM.3.45
reference: Numbers 3:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: fr
  text: Prends les Lévites à la place de tout premier-né parmi les fils d’Israël[a], et le bétail des Lévites à la place de leur bétail. Les Lévites seront à moi. Je suis Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « parmi les Israélites ». L’hébreu dit littéralement : « parmi les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Prends
  rationale: L’impératif de לקח adresse à Moïse l’ordre direct de prendre ou de désigner les Lévites; « Prends » est naturel et fidèle.
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans ce contexte, le terme indique une substitution et non une position spatiale; cette tournure préserve clairement le parallèle entre les personnes et le bétail.
- source_word: כָּל בְּכוֹר
  choice: tout premier-né
  rationale: 'Le singulier précédé de כָּל a une valeur distributive: chaque premier-né est visé.'
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: La formulation conserve l’expression hébraïque et rend la valeur partitive de la préposition בְּ.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: le bétail des Lévites
  rationale: בְּהֵמָה désigne collectivement ici les animaux domestiques; « bétail » est le collectif français le plus naturel dans ce contexte.
- source_word: וְהָיוּ לִי
  choice: Les Lévites seront à moi
  rationale: La formulation exprime sobrement l’appartenance à Dieu, tout en répétant le sujet comme dans l’hébreu.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahvé
  rationale: La translittération française traditionnelle « Yahvé » représente directement le nom divin YHWH et conserve la formule solennelle d’auto-identification.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » rend le nom propre en français, tandis que la note signale la convention traditionnelle sans confondre le nom avec un titre.
- issue: Nature de la relation exprimée par תַּחַת
  choice: 'substitution: « à la place de »'
  alternative: « au-dessous de »
  rationale: Le parallélisme du verset établit que les Lévites et leur bétail remplacent respectivement les premiers-nés et le bétail d’Israël; le sens spatial ne convient pas ici.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme de la substitution est conservé, ainsi que l’expression hébraïque « fils d’Israël », éclairée en note. La ponctuation française répartit le long énoncé hébreu en phrases lisibles sans modifier ses relations syntaxiques.
