id: NUM.3.20
reference: Numbers 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: fr
  text: 'Les fils de Merari, selon leurs clans : Mahli et Mushi. Tels sont les clans des Lévites[a], selon leurs maisons paternelles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les clans de Lévi ». L’hébreu emploie le gentilé au singulier, « le Lévite », qui peut avoir un sens collectif ou renvoyer à Lévi, l’ancêtre de la tribu.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: בְּנֵי signifie littéralement « fils de » et convient au cadre généalogique. La conjonction initiale וּ n’est pas rendue séparément, car le français présente naturellement ce membre de liste sans « et » initial.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nom propre transcrit selon l’usage français courant.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: La préposition לְ marque ici un classement par subdivisions familiales; « selon leurs clans » exprime clairement cette organisation.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Mahli et Mushi
  rationale: Noms propres transcrits, avec restitution naturelle de la coordination.
- source_word: אֵלֶּה הֵם
  choice: Tels sont
  rationale: Le démonstratif suivi du pronom forme une proposition d’identification; « Tels sont » est idiomatique et conserve la fonction récapitulative de l’hébreu.
- source_word: מִשְׁפְּחֹת
  choice: les clans
  rationale: Dans ce contexte tribal et généalogique, « clans » désigne mieux que « familles » les unités de parenté au sein de la tribu.
- source_word: הַלֵּוִי
  choice: des Lévites
  rationale: Le gentilé hébreu est morphologiquement singulier, mais peut avoir un sens collectif. Le pluriel français s’accorde naturellement avec « clans » tout en laissant l’autre compréhension en note.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: בֵּית אָבוֹת est une expression de parenté et d’organisation sociale. « Maisons paternelles » conserve l’image de la maison et la référence explicite aux pères; לְ est rendu par « selon » dans son sens classificatoire.
