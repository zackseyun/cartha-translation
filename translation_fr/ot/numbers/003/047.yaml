  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: fr
  text: 'Tu prendras cinq sicles par personne[a], selon le sicle du sanctuaire[b] : le sicle vaut vingt guéras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cinq, cinq sicles par tête ». La répétition de « cinq » a un sens distributif.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire selon l’unité de poids officielle du sanctuaire ; un sicle équivalait à vingt guéras.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu prendras
  rationale: Le parfait qal précédé de la conjonction a ici une valeur directive dans une série d’instructions. Le futur français conserve naturellement ce ton juridique.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים לַגֻּלְגֹּלֶת
  choice: cinq sicles par personne
  rationale: La répétition de « cinq » exprime la distribution, tandis que לַגֻּלְגֹּלֶת signifie littéralement « par tête ». « Par personne » communique clairement le sens en français moderne sans reproduire lourdement la répétition hébraïque.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition indique ici la norme de poids employée. Cette formulation conserve la référence cultuelle tout en précisant qu’il s’agit du sicle étalon du sanctuaire.
- source_word: תִּקָּח
  choice: tu les prendras
  rationale: Le second verbe, également à la deuxième personne du singulier, est conservé plutôt que transformé en simple copule. Le pronom « les » reprend naturellement les sicles à prélever.
- source_word: עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: qui vaut vingt guéras
  rationale: La relative française exprime clairement la valeur du sicle mentionné. « Guéra » est maintenu comme nom technique d’une unité de poids hébraïque et mis au pluriel après vingt.
