translation_notes:
  register: Français moderne, clair et digne, avec le tutoiement singulier correspondant à l’adresse faite à Moïse. « Sicle » et « guéra » sont conservés comme unités anciennes usuelles dans le vocabulaire biblique. La seconde occurrence du verbe « prendre » est maintenue afin de rester proche de la structure hébraïque.
