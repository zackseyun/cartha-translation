  text: מִשְׁפְּחֹ֥ת בְּנֵי קְהָ֖ת יַחֲנ֑וּ עַ֛ל יֶ֥רֶךְ הַ/מִּשְׁכָּ֖ן תֵּימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/029.yaml
  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: fr
  text: Les clans des fils de Qehath camperont sur le côté sud du tabernacle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les descendants de Qehath » ou « les Qehathites ». L’hébreu dit littéralement « les fils de Qehath ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans le contexte de l’organisation tribale et du camp, le terme désigne des groupes de parenté plus larges que les familles nucléaires. « Clans » est naturel et précis en français moderne.
- source_word: בְּנֵי קְהָת
  choice: fils de Qehath
  rationale: La traduction conserve l’expression filiale littérale de l’hébreu et son accent sur la lignée; une note signale les équivalents collectifs possibles.
- source_word: יַחֲנוּ
  choice: camperont
  rationale: L’imparfait hébreu exprime ici la disposition prescrite du camp. Le futur français rend naturellement cette instruction dans son contexte.
- source_word: עַל יֶרֶךְ
  choice: sur le côté
  rationale: Cette expression locative situe les clans par rapport au flanc du tabernacle; « sur le côté » est clair et idiomatique.
- source_word: הַמִּשְׁכָּן
  choice: du tabernacle
  rationale: Dans les Nombres, le mot désigne la tente-sanctuaire sacrée. « Tabernacle » est le terme biblique français établi.
- source_word: תֵּימָנָה
  choice: sud
  rationale: La forme directionnelle indique l’emplacement méridional; avec « côté », la tournure « côté sud » est concise et naturelle.
