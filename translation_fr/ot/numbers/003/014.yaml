  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse dans le désert du Sinaï :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר, dans cette formule narrative, désigne l’acte de parler et introduit une parole divine. Le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל introduit ici le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: בְּמִדְבַּר סִינַי
  choice: dans le désert du Sinaï
  rationale: מִדְבָּר désigne une région peu habitée ou désertique; « désert » est l’équivalent français courant dans ce contexte géographique. L’état construit est naturellement rendu par « du Sinaï ».
- source_word: לֵאמֹר
  choice: 'Il dit :'
  rationale: L’infinitif לֵאמֹר annonce le contenu de la parole qui suit. Une nouvelle proposition avec deux-points est plus naturelle en français moderne que le calque « en disant », tout en conservant sa fonction introductive.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le tétragramme, nom personnel de Dieu. « Yahweh » en préserve la valeur onomastique; une note signale le rendu traditionnel sans imposer cette substitution dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le ton narratif; la formule hébraïque de discours est restructurée en deux phrases pour éviter le lourd calque « parla… en disant ».
