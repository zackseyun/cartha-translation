  register: Français international moderne, clair et digne. La phrase conserve la structure d’un inventaire, tout en évitant une expression artificiellement littérale pour פְקֻדַּת מִשְׁמֶרֶת. Les termes architecturaux sont compréhensibles sans être excessivement techniques.
