revisions:
- from: La responsabilité confiée aux fils de Merari concernait les cadres du tabernacle[a], ses traverses, ses piliers, ses socles[b], tous ses accessoires et tout le travail qui s’y rapportait[c].
  to: La charge confiée aux fils de Merari comprenait les panneaux du tabernacle[a], ses traverses, ses piliers, ses socles[b], tous ses objets et tout le travail qui s’y rapportait[c].
  rationale: La révision préserve le sens de la charge officiellement assignée et de l’inventaire, tout en évitant de figer une interprétation architecturale disputée. Elle remplace également un terme français susceptible de réduire indûment l’étendue des objets visés.
