  variant: modern international French
source:
  edition: WLC
  text: וּ/פְקֻדַּ֣ת מִשְׁמֶרֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמֻּדָ֣י/ו וַ/אֲדָנָ֑י/ו וְ/כָל כֵּלָ֔י/ו וְ/כֹ֖ל עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: fr
  text: La charge confiée aux fils de Merari comprenait les panneaux du tabernacle[a], ses traverses, ses piliers, ses socles[b], tous ses objets et tout le travail qui s’y rapportait[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les planches du tabernacle »; le terme peut aussi désigner des éléments structuraux.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses bases » ou « ses supports ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « tout son service »; il peut s’agir de tout le service ou travail lié à ces éléments.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: la responsabilité confiée
  rationale: Les deux noms forment une expression désignant la charge officiellement attribuée aux Merarites. « La responsabilité confiée » restitue l’idée d’une mission assignée sans reproduire lourdement les deux substantifs hébreux.
- source_word: בְּנֵי מְרָרִי
  choice: les fils de Merari
  rationale: Cette formulation suit explicitement l’hébreu et reste naturelle en français biblique moderne.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: les cadres du tabernacle
  rationale: קֶרֶשׁ désigne les éléments verticaux de la structure. « Cadres » met en valeur leur fonction architecturale, tandis que « planches » demeure une possibilité lexicale.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme français consacré pour cette structure cultuelle, bien que le mot hébreu évoque étymologiquement une demeure.
- source_word: בְרִיחָיו
  choice: ses traverses
  rationale: Il s’agit des barres horizontales associées aux cadres; « traverses » exprime clairement leur fonction dans la construction.
- source_word: עַמֻּדָיו
  choice: ses piliers
  rationale: Le mot désigne des supports verticaux; « piliers » est précis, courant et digne.
- source_word: אֲדָנָיו
  choice: ses socles
  rationale: Dans les descriptions du tabernacle, ces pièces servent de supports inférieurs dans lesquels s’insèrent des éléments verticaux. « Socles » est plus idiomatique ici que « bases ».
- source_word: כָל כֵּלָיו
  choice: tous ses accessoires
  rationale: כֵּלִים est un terme large pour le matériel, les objets ou les éléments associés. « Accessoires » convient aux pièces liées à la structure sans les réduire à des ustensiles.
- source_word: כֹל עֲבֹדָתוֹ
  choice: tout le travail qui s’y rapportait
  rationale: La formule résume le service ou le travail relatif à l’ensemble précédemment nommé. Cette traduction rend explicite le lien référentiel tout en conservant l’étendue générale de l’hébreu.
theological_decisions: []
