  text: פְּקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה פְּקֻ֣דֵי/הֶ֔ם שִׁבְעַ֥ת אֲלָפִ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: fr
  text: Les personnes recensées parmi eux[a], selon le nombre de tous les garçons âgés d’un mois et plus, les personnes recensées parmi eux étaient au nombre de sept mille cinq cents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie deux fois le même terme de recensement : littéralement, « leurs recensés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: les personnes recensées parmi eux
  rationale: Cette expression rend le terme dérivé de פקד dans son contexte de recensement. Le français naturel évite le calque peu idiomatique « leurs recensés », tandis que la note signale la répétition du terme hébreu dans le verset.
- source_word: בְּמִסְפַּר
  choice: d’après le dénombrement de
  rationale: La tournure exprime la base du compte et conserve le vocabulaire du recensement dans un français courant et digne.
- source_word: כָּל זָכָר
  choice: tous les individus de sexe masculin
  rationale: Cette formulation inclut avec exactitude les nourrissons aussi bien que les adultes, contrairement à « tous les hommes », qui pourrait être compris comme ne visant que les adultes.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: âgés d’un mois ou plus
  rationale: Formulation française naturelle et précise de la limite d’âge exprimée par l’hébreu.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: sept mille cinq cents
  rationale: Le nombre est écrit en toutes lettres, conformément au style narratif biblique suivi ici.
