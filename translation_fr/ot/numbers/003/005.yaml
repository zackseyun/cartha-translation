lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le waw consécutif avec le piel de דבר fait progresser le récit et introduit solennellement une parole divine. « Parla » correspond naturellement à cette formule en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif לֵאמֹר introduit le contenu du discours donné au verset suivant. « En ces termes » remplit cette fonction avec naturel et dignité, sans la lourdeur de « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: L’hébreu emploie directement le tétragramme. « Yahweh » en préserve la fonction de nom personnel et correspond à la translittération moderne la plus courante.
translation_notes:
  register: Français moderne, clair et digne. La formule « parla à Moïse en ces termes » conserve le caractère introductif de la formule hébraïque tout en évitant un calque peu idiomatique.
