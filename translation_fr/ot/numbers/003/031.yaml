  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: fr
  text: Ils avaient la charge[a] de l’arche, de la table, du chandelier, des autels, des ustensiles du sanctuaire[b], employés pour le service, du rideau[c] et de tout le service qui s’y rapportait[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la responsabilité » ; le terme hébreu désigne ce qui leur était confié et dont ils devaient s’occuper.
    reason: lexical_alternative
  - marker: b
    text: Ou « des objets sacrés » ou « des ustensiles du lieu saint ».
    reason: lexical_alternative
  - marker: c
    text: Il s’agit de la tenture placée à une entrée, et non du voile intérieur.
    reason: cultural_note
  - marker: d
    text: Littéralement « tout son service ». L’antécédent exact du pronom n’est pas précisé.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: Ils avaient la charge
  rationale: Dans ce contexte lévitique, מִשְׁמֶרֶת désigne la responsabilité confiée à un groupe. « Avoir la charge de » est naturel en français et introduit clairement la liste des objets confiés aux Qehatites.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: Le contexte du sanctuaire identifie sans ambiguïté le coffre sacré. Le texte hébreu ne précise pas ici « de l’alliance » ou « du témoignage » ; cet ajout est donc évité.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: L’hébreu dit simplement « la table ». Le contexte suffit pour reconnaître le mobilier du sanctuaire.
- source_word: הַמְּנֹרָה
  choice: le porte-lampes
  rationale: מְנוֹרָה désigne le support cultuel portant plusieurs lampes. « Porte-lampes » traduit sa fonction sans évoquer improprement des bougies ni recourir à une simple translittération.
- source_word: הַמִּזְבְּחֹת
  choice: les autels
  rationale: Le pluriel hébreu est conservé directement.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: les ustensiles du sanctuaire
  rationale: כְּלִים désigne des objets ou ustensiles servant au culte, tandis que הַקֹּדֶשׁ renvoie ici au domaine sacré, le sanctuaire. Cette formulation est claire sans suggérer uniquement des récipients.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָּהֶם
  choice: avec lesquels ils assuraient le service
  rationale: La préposition marque les objets comme instruments du service cultuel. « Assurer le service » garde cette nuance et le sujet pluriel non nommé du verbe hébreu.
- source_word: הַמָּסָךְ
  choice: le rideau
  rationale: מָסָךְ désigne ici une tenture faisant écran à une entrée. « Rideau » est idiomatique en français ; une note le distingue du voile intérieur.
- source_word: וְכֹל עֲבֹדָתוֹ
  choice: et de tout le service qui s’y rapportait
  rationale: עֲבֹדָה désigne ici le service ou les tâches liés au sanctuaire. La tournure française évite d’imposer un antécédent trop précis au suffixe masculin singulier, dont le rattachement demeure peu explicite.
theological_decisions:
- issue: Terminologie du service cultuel
  choice: « assuraient le service » et « tout le service »
  alternative: « servaient » et « tout le travail »
  rationale: Le vocabulaire reste accessible tout en conservant le caractère cultuel et administratif du passage, sans lui imposer une terminologie ecclésiastique ultérieure.
- issue: Référent du suffixe dans עֲבֹדָתוֹ
  choice: Employer « qui s’y rapportait » et signaler l’indétermination en note
  alternative: Rattacher explicitement tout le service au seul rideau ou à l’ensemble du sanctuaire
  rationale: Le suffixe masculin singulier est explicite en hébreu, mais son antécédent précis ne l’est pas. La traduction préserve cette tension au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase garde la structure d’une liste administrative. « Porte-lampes » évite l’anachronisme de bougies souvent associé à « chandelier ». Les notes rendent visibles les principales possibilités lexicales et l’ambiguïté grammaticale finale.
