revisions:
- from: Ils avaient la charge[a] de l’arche, de la table, du porte-lampes, des autels, des ustensiles du sanctuaire[b] avec lesquels ils assuraient le service, du rideau[c] et de tout le service qui s’y rapportait[d].
  to: Ils avaient la charge[a] de l’arche, de la table, du chandelier, des autels, des ustensiles du sanctuaire[b], employés pour le service, du rideau[c] et de tout le service qui s’y rapportait[d].
  rationale: La révision remplace le sujet français explicite de la relative par « employés pour le service », afin de ne pas attribuer sans appui explicite le service aux porteurs qehatites. Elle adopte aussi « chandelier », terme plus naturel en français moderne pour la menorah dans ce contexte. La formulation finale et sa note conservent l’indétermination du suffixe singulier hébreu.
