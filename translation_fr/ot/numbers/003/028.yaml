  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: fr
  text: Le nombre de tous les garçons et hommes âgés d’un mois ou plus était de huit mille six cents ; ils étaient chargés de la garde du sanctuaire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des choses saintes ».'
    reason: Le nom הַקֹּדֶשׁ peut désigner ici le sanctuaire comme domaine sacré ou les objets sacrés dont les Qehatites avaient la responsabilité.
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: Le nombre total des personnes de sexe masculin
  rationale: La formulation rend naturellement en français la formule de recensement, tout en conservant la référence explicite au sexe masculin sans appeler des nourrissons des « hommes ».
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: âgées d’un mois ou plus
  rationale: Expression française courante et précise pour le seuil d’âge indiqué par l’hébreu.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: huit mille six cents
  rationale: Restitue exactement le nombre du texte massorétique, en toutes lettres conformément au registre littéraire.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: avaient la charge
  rationale: Le participe et le nom apparentés expriment une responsabilité permanente confiée aux Lévites ; cette tournure évite de réduire leur fonction à une simple garde physique.
- source_word: הַקֹּדֶשׁ
  choice: du sanctuaire
  rationale: Dans ce contexte cultuel, le terme désigne naturellement le domaine sacré confié aux Qehatites. Une autre lecture possible est signalée en note.
theological_decisions:
- issue: Référent de הַקֹּדֶשׁ
  choice: le sanctuaire
  alternative: les choses saintes
  rationale: Le contexte immédiat présente la responsabilité cultuelle des Qehatites et permet de comprendre le terme comme désignant le sanctuaire, mais l’hébreu peut aussi viser collectivement les objets sacrés ; l’ambiguïté est conservée par une note.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la formule de recensement et relie explicitement l’effectif à la responsabilité cultuelle, sans alourdir le texte par une imitation stricte de la syntaxe hébraïque.
