  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹן לְ/מִשְׁפְּחֹתָ֑/ם לִבְנִ֖י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: fr
  text: 'Voici les noms des fils de Guershon, selon leurs clans : Libni et Shiméi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Voici
  rationale: Dans une introduction de liste, « Voici » rend naturellement en français la construction hébraïque וְאֵלֶּה sans imposer un « et » peu idiomatique.
- source_word: שְׁמוֹת
  choice: les noms de
  rationale: Le nom est à l’état construit et se rattache à « fils de Guershon ».
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: des fils de Guershon
  rationale: בְּנֵי signifie littéralement « fils de » et les deux personnes nommées sont présentées ici comme ses fils.
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: selon leurs clans
  rationale: Dans le cadre généalogique et censitaire des Nombres, מִשְׁפָּחָה désigne un clan; la préposition ל exprime ici le classement selon ces clans.
- source_word: לִבְנִי
  choice: Libni
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: וְ/שִׁמְעִי
  choice: et Shiméi
  rationale: Le nom propre est translittéré en français, et la conjonction hébraïque est rendue par « et » dans l’énumération.
