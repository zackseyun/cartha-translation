  text: מִשְׁפְּחֹ֖ת הַ/גֵּרְשֻׁנִּ֑י אַחֲרֵ֧י הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ יָֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: fr
  text: Les clans des Guershonites camperont derrière le tabernacle, du côté ouest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la mer », expression hébraïque courante pour désigner l’ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans le contexte tribal et lévitique des Nombres, le terme désigne des groupes de parenté issus d’une même lignée. « Clans » exprime mieux cette réalité collective que « familles », qui peut évoquer le seul foyer domestique.
- source_word: הַגֵּרְשֻׁנִּי
  choice: des Guershonites
  rationale: Le gentilé singulier avec article a ici un sens collectif et désigne les descendants de Guershon. « Guershonites » est la forme française traditionnelle et claire.
- source_word: אַחֲרֵי
  choice: derrière
  rationale: La préposition a ici un sens spatial, et non temporel, dans la description de la disposition du camp.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Dans les Nombres, le mot désigne la tente-sanctuaire sacrée. « Tabernacle » est le terme français établi dans ce contexte cultuel.
- source_word: יַחֲנוּ
  choice: camperont
  rationale: L’imparfait hébreu indique ici la disposition prescrite du camp. Le futur français rend naturellement cette valeur normative dans le contexte.
- source_word: יָמָּה
  choice: du côté ouest
  rationale: Cette forme directionnelle dérivée de « mer » désigne idiomatiquement l’ouest. « Du côté ouest » convient à l’emplacement relatif indiqué ici et reste immédiatement compréhensible.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le vocabulaire structurant du passage (« clans », « tabernacle ») tout en rendant naturellement la disposition géographique du camp.
