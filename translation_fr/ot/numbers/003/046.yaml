  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: fr
  text: Pour le prix de rachat des 273 premiers-nés des fils d’Israël qui sont en surnombre par rapport aux Lévites,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les 273 rachetés » ; la forme hébraïque peut se comprendre plus littéralement comme désignant les personnes rachetées, mais le contexte immédiat porte sur la somme à verser pour les premiers-nés en surnombre (v. 47-48).
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: le prix de rachat
  rationale: Dans ce contexte, le terme dérivé de פדה désigne ce qui doit être versé pour le rachat des premiers-nés en surnombre, comme le précise le verset suivant. « Prix de rachat » exprime naturellement cette valeur sans réduire le mot aux seules personnes rachetées.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: L’hébreu construit le nombre par addition. Les chiffres donnent exactement la même quantité sous la forme française la plus claire.
- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: qui sont en surnombre par rapport aux Lévites
  rationale: Le participe indique un excédent numérique relativement aux Lévites. Cette formulation française conserve explicitement la comparaison.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: des premiers-nés des fils d’Israël
  rationale: 'La préposition a ici une valeur partitive : les 273 appartiennent au groupe des premiers-nés. « Fils d’Israël » conserve l’expression collective et traditionnelle בני ישראל.'
