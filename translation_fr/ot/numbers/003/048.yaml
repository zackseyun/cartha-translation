  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: fr
  text: Tu donneras l’argent à Aaron et à ses fils comme prix de rachat pour ceux qui sont en surnombre parmi eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en suivant de plus près la construction hébraïque : « pour le rachat de ceux qui sont en surnombre parmi eux ». L’hébreu condense l’idée dans une construction nominale; le texte principal l’explicite pour plus de clarté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu donneras
  rationale: Le qatal qal à la deuxième personne masculine singulière, précédé de la conjonction, exprime ici une directive dans la suite des instructions. Le futur français rend naturellement cette valeur prescriptive.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף désigne littéralement l’argent métal et, par extension, une somme monétaire. Dans ce contexte de paiement du rachat, « l’argent » conserve en français à la fois le sens du métal et celui de la somme versée.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: à Aaron et à ses fils
  rationale: La formulation rend les deux destinataires et conserve « fils », qui désigne précisément ici les descendants masculins exerçant la prêtrise.
- source_word: פְּדוּיֵי
  choice: comme prix de rachat pour
  rationale: Cette forme construite plurielle issue de פדה est très condensée et peut désigner les rachetés ou ce qui se rapporte à leur rachat. Puisque « l’argent » est l’objet donné, la formulation explicite naturellement sa fonction de prix du rachat sans modifier la logique du texte.
- source_word: הָעֹדְפִים
  choice: ceux […] qui sont en surnombre
  rationale: Le participe de עודף désigne ceux qui dépassent le nombre correspondant, c’est-à-dire ici les premiers-nés israélites excédant le nombre des lévites.
- source_word: בָּהֶם
  choice: d’entre eux
  rationale: La préposition בְּ avec le pronom marque ici l’appartenance au groupe compté. « D’entre eux » exprime idiomatiquement les personnes en surnombre au sein de ce groupe.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple garde la force directive de l’instruction; « prix de rachat » clarifie la relation syntaxique très condensée de l’hébreu tout en signalant en note la traduction plus formelle.
