  text: וַ/יְהִי֩ כָל בְּכ֨וֹר זָכָ֜ר בְּ/מִסְפַּ֥ר שֵׁמ֛וֹת מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה לִ/פְקֻדֵי/הֶ֑ם שְׁנַ֤יִם וְ/עֶשְׂרִים֙ אֶ֔לֶף שְׁלֹשָׁ֥ה וְ/שִׁבְעִ֖ים וּ/מָאתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: fr
  text: Tous les premiers-nés de sexe masculin, recensés nominativement[a] à partir de l’âge d’un mois, étaient au nombre de vingt-deux mille trois cent soixante-treize.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon le nombre des noms » ; il s’agit d’un recensement où chacun était enregistré individuellement par son nom.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: furent
  rationale: Le verbe היה introduit ici le résultat du recensement. Le passé simple convient au registre narratif biblique français et s’accorde naturellement avec le sujet pluriel.
- source_word: כָל בְּכוֹר זָכָר
  choice: Tous les premiers-nés de sexe masculin
  rationale: Cette formulation conserve à la fois l’idée de totalité, le rang de naissance et la précision de sexe exprimée par זָכָר.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: recensés nominativement
  rationale: L’expression hébraïque signifie littéralement « selon le nombre des noms » et désigne un enregistrement individuel par nom. La formulation française restitue naturellement cet idiome administratif.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: depuis l’âge d’un mois
  rationale: Cette expression rend clairement le seuil inclusif d’un mois et plus sans reproduire lourdement la tournure hébraïque.
- source_word: לִפְקֻדֵיהֶם
  choice: au total
  rationale: Dans ce contexte de recensement, le terme renvoie à l’effectif officiellement dénombré. « au total » évite une répétition maladroite après « recensés nominativement » tout en conservant la fonction récapitulative de l’expression.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: vingt-deux mille trois cent soixante-treize
  rationale: L’ordre des éléments numériques est adapté à l’usage français moderne. L’hébreu donne bien un total de 22 373.
