source:
  edition: WLC
  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: fr
  text: Ils auront la garde de tout le matériel de la tente de la rencontre et de la charge des fils d’Israël[a], afin d’accomplir le service du tabernacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la responsabilité des fils d’Israël ». L’expression peut désigner une charge qui incombe aux fils d’Israël ou une charge exercée pour leur compte.'
    reason: La relation exacte exprimée par מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל demeure ouverte dans l’hébreu ; la note préserve cette ambiguïté.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Ils auront la garde de
  rationale: Dans ce contexte cultuel, שׁמר désigne la garde attentive d’objets et l’exercice d’une fonction confiée, et non une simple surveillance.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: tout le matériel de la tente de la rencontre
  rationale: כְּלִים peut désigner l’ensemble des objets, ustensiles et équipements du sanctuaire. « Matériel » conserve cette portée large en français naturel.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette formulation française consacrée garde à la fois l’image de la tente et l’idée du lieu où la rencontre est fixée.
- source_word: מִשְׁמֶרֶת
  choice: la responsabilité
  rationale: Le nom désigne ici une charge ou une responsabilité confiée. « Responsabilité » évite une répétition lourde avec « garde » tout en conservant l’idée d’une fonction assignée.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve la forme masculine collective explicite de l’hébreu et la désignation traditionnelle du peuple.
- source_word: לַעֲבֹד
  choice: afin d’accomplir
  rationale: L’infinitif exprime ici le but de la garde et de la responsabilité exercées par les Lévites.
- source_word: עֲבֹדַת הַמִּשְׁכָּן
  choice: le service du tabernacle
  rationale: עֲבֹדָה désigne le service cultuel assigné, et « tabernacle » rend de façon reconnue le sanctuaire mobile du désert.
theological_decisions:
- issue: Portée de מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: la responsabilité des fils d’Israël
  alternative: la charge confiée au nom des fils d’Israël
  rationale: Le génitif hébreu peut désigner la responsabilité qui incombe collectivement aux fils d’Israël et que les Lévites assument, ou une charge exercée pour leur compte. Le texte principal préserve la construction nominale sans préciser davantage cette relation.
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix maintient la forme masculine du texte source, sans nier la portée collective de cette désignation nationale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le vocabulaire cultuel traditionnel (« service », « tabernacle »), tandis que « matériel » et « responsabilité » rendent le propos immédiatement compréhensible.
