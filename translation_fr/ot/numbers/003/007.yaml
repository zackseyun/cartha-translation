  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: fr
  text: Ils veilleront à la charge qui lui incombe[a] et à celle de toute la communauté[b], devant la tente de la Rencontre, afin d’accomplir le service du tabernacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils garderont sa charge » ou « ils observeront ce qui lui incombe ». En hébreu, le verbe et le nom apparentés peuvent exprimer aussi bien une responsabilité de garde qu’une observance fidèle.
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, les lévites assument, en rapport avec le sanctuaire, les responsabilités liées à Aaron et à toute la communauté.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ … מִשְׁמַרְתּוֹ
  choice: Ils veilleront à ce qui lui est confié
  rationale: Le verbe שׁמר et le nom מִשְׁמֶרֶת forment une association qui évoque à la fois la garde, l’observance fidèle et l’exercice d’une responsabilité confiée. Cette formulation française conserve cette largeur de sens sans réduire la tâche à une garde physique.
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: ce qui est confié à toute la communauté
  rationale: La reprise de « ce qui est confié » rend le parallélisme lexical de l’hébreu. Dans ce contexte, les lévites assument la responsabilité liée à l’ensemble de la communauté, vraisemblablement pour son compte.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: Dans le livre des Nombres, עֵדָה désigne la collectivité d’Israël. « Communauté » est naturel en français moderne et convient au contexte cultuel sans suggérer seulement une réunion ponctuelle.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: devant la tente de la Rencontre
  rationale: « Devant » conserve l’orientation spatiale de לִפְנֵי. « Tente de la Rencontre » est une désignation française claire et consacrée du sanctuaire mobile désigné par אֹהֶל מוֹעֵד.
- source_word: לַעֲבֹד
  choice: afin d’accomplir
  rationale: L’infinitif exprime ici le but. « Accomplir » évite une répétition française maladroite avec le nom עֲבֹדָה tout en gardant l’idée d’exécuter le travail assigné.
- source_word: עֲבֹדַת הַמִּשְׁכָּן
  choice: le service du tabernacle
  rationale: עֲבֹדָה désigne le service ou le travail cultuel, et מִשְׁכָּן le sanctuaire conçu comme demeure. « Service du tabernacle » conserve la portée technique de la fonction lévitique et la terminologie biblique usuelle.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans מִשְׁמַרְתּוֹ
  choice: Le pronom « lui » renvoie naturellement à Aaron.
  alternative: Le suffixe peut être compris plus généralement comme renvoyant à la responsabilité sacerdotale ou à celle du sanctuaire.
  rationale: Aaron est l’antécédent masculin singulier le plus naturel dans le contexte immédiat de Nombres 3, où les lévites lui sont donnés, à lui et à ses fils. Le pronom français préserve cependant la formulation implicite du texte hébreu plutôt que d’insérer explicitement le nom d’Aaron.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme hébreu tout en évitant le tour peu naturel « garder sa charge ». La majuscule à « Rencontre » signale qu’il s’agit du nom traditionnel du sanctuaire, tandis que « tabernacle » maintient la distinction lexicale avec אֹהֶל מוֹעֵד.
