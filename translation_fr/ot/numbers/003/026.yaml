base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: fr
  text: les tentures du parvis[a], le rideau de l’entrée du parvis qui entoure le tabernacle et l’autel, ainsi que ses cordages[b], pour tout le service qui s’y rapporte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les toiles du parvis ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses cordes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: tentures
  rationale: Le terme désigne les grandes pièces de tissu formant l’enceinte du parvis. « Tentures » convient à ce cadre cultuel et se distingue du rideau placé à l’entrée.
- source_word: חָצֵר
  choice: parvis
  rationale: Dans le contexte du sanctuaire, « parvis » désigne naturellement l’espace clos entourant le tabernacle et l’autel.
- source_word: מָסַךְ
  choice: rideau
  rationale: Il s’agit d’une pièce textile fermant ou masquant une entrée. « Rideau » est clair en français moderne et ne suggère pas une porte rigide.
- source_word: פֶּתַח
  choice: entrée
  rationale: Le mot désigne l’ouverture donnant accès au parvis; « entrée » s’accorde naturellement avec « rideau ».
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: autour du tabernacle et de l’autel
  rationale: Cette formulation restitue sobrement la relation spatiale exprimée par עַל avec סָבִיב, sans répéter artificiellement « autour ».
- source_word: מִשְׁכָּן
  choice: tabernacle
  rationale: Terme français conventionnel et précis pour la tente-sanctuaire dans ce contexte.
- source_word: מִזְבֵּחַ
  choice: autel
  rationale: Équivalent français standard du terme hébreu désignant l’autel sacrificiel.
- source_word: מֵיתָרָיו
  choice: ses cordages
  rationale: « Cordages » désigne concrètement l’ensemble des cordes servant à maintenir la structure, tout en conservant l’ambiguïté du possessif hébreu.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: pour tout le service qui s’y rapporte
  rationale: Cette tournure naturelle conserve l’idée de l’ensemble des tâches ou fonctions liées aux éléments mentionnés.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La coordination nominale est maintenue parce que le verset poursuit l’énumération commencée dans le contexte précédent. La formulation évite de résoudre excessivement le rattachement syntaxique de la proposition spatiale et du possessif « ses ».
