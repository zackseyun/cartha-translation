  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: fr
  text: Le chef de la famille ancestrale des Guershonites était Éliasaph, fils de Laël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « maison du père », expression israélite désignant une famille ancestrale ou une unité clanique.
