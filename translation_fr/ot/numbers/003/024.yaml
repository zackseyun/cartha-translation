lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Le chef
  rationale: נָשִׂיא désigne ici le responsable officiel d’un groupe familial. « Chef » convient au contexte administratif sans connotation royale. Le ו initial assure la continuité de l’énumération, que le français exprime naturellement sans « et » dans ce verset.
- source_word: בֵית אָב
  choice: de la famille ancestrale
  rationale: Littéralement « maison du père », cette expression désigne une unité de parenté patrilinéaire. « Famille ancestrale » en restitue le sens social dans un français moderne et clair.
- source_word: לַגֵּרְשֻׁנִּי
  choice: des Guershonites
  rationale: Le ל marque ici le rattachement au groupe issu de Guershon. Le pluriel collectif « Guershonites » est idiomatique en français.
- source_word: אֶלְיָסָף
  choice: Éliasaph
  rationale: Translittération française traditionnelle du nom propre hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu généalogique courant et direct.
- source_word: לָאֵל
  choice: Laël
  rationale: Translittération française du nom propre hébreu, avec tréma pour signaler la séparation vocalique.
