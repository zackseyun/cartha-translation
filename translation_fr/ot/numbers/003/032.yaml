  text: וּ/נְשִׂיא֙ נְשִׂיאֵ֣י הַ/לֵּוִ֔י אֶלְעָזָ֖ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֑ן פְּקֻדַּ֕ת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: fr
  text: Et le chef placé à la tête des chefs des Lévites était Éléazar, fils d’Aaron, le prêtre ; il avait la responsabilité de ceux qui assuraient la garde du sanctuaire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des choses saintes ». Le terme hébreu peut désigner soit le sanctuaire lui-même, soit les objets sacrés qui lui sont associés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: Le chef placé à la tête des chefs des Lévites
  rationale: נָשִׂיא désigne ici un chef ou responsable, sans connotation nécessairement royale. La formulation française explicite naturellement la relation hiérarchique exprimée par « chef des chefs », tout en conservant les deux niveaux de responsabilité.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Éléazar, fils du prêtre Aaron
  rationale: Cette formulation rend clairement le lien filial et rattache naturellement le titre de prêtre à Aaron, conformément à la syntaxe hébraïque.
- source_word: פְּקֻדַּת
  choice: Il supervisait
  rationale: Le nom פְּקֻדָּה exprime ici la supervision ou la responsabilité confiée à Éléazar. Une tournure verbale donne une phrase française naturelle sans effacer la fonction administrative.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: ceux qui assuraient la garde
  rationale: Le participe accompagné d’un nom de même racine souligne une responsabilité durable de garde. « Assuraient la garde » restitue cet idiome sans la lourdeur d’une répétition littérale.
- source_word: הַקֹּדֶשׁ
  choice: du sanctuaire
  rationale: Dans le contexte du tabernacle, הַקֹּדֶשׁ peut désigner le sanctuaire, mais aussi les choses saintes qui lui sont associées. « Sanctuaire » convient au contexte spatial et cultuel; l’autre possibilité est signalée en note.
theological_decisions:
- issue: Référent de הַקֹּדֶשׁ
  choice: le sanctuaire
  alternative: les choses saintes
  rationale: Le contexte permet les deux sens et ne justifie pas de trancher dogmatiquement. Le texte principal retient le sens spatial le plus naturel ici, tandis que la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La hiérarchie lévitique est exprimée clairement sans employer « prince », qui évoquerait à tort la royauté. La seconde proposition est rendue par une phrase verbale fluide.
