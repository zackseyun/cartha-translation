  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: fr
  text: Moïse recensa tous les premiers-nés parmi les fils d’Israël[a], exactement comme Yahweh le lui avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les fils d’Israël » ; autres traductions possibles : « les Israélites » ou « les enfants d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: recensa
  rationale: Dans ce contexte de dénombrement, פקד désigne l’action de compter ou de recenser des personnes. « Recensa » est précis, naturel et adapté au registre narratif.
- source_word: כַּאֲשֶׁר
  choice: exactement comme
  rationale: La conjonction exprime la conformité de l’action de Moïse au commandement divin. « Exactement comme » rend clairement cette correspondance.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait indique naturellement en français que l’ordre divin précède son exécution par Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » préserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֹתוֹ
  choice: lui
  rationale: Le pronom renvoie à Moïse, destinataire du commandement; dans la construction française « le lui avait ordonné », « lui » marque ce destinataire.
- source_word: אֶת כָּל בְּכֹר
  choice: tous les premiers-nés
  rationale: Cette formulation exprime la totalité des premiers-nés recensés sans ajouter « mâles », terme absent de ce verset, même si le contexte plus large le précise.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: Cette traduction conserve l’expression de parenté masculine בְּנֵי יִשְׂרָאֵל et rend la préposition ב par « parmi » dans ce contexte de recensement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin au lieu de le remplacer par un titre.
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: « Fils d’Israël » reflète formellement le terme de parenté masculin du texte source, tandis que les autres formulations sont possibles selon que l’on privilégie l’usage collectif ou traditionnel.
- issue: Identification des premiers-nés comme mâles
  choice: ne pas ajouter « mâles » dans le texte
  alternative: tous les premiers-nés mâles
  rationale: Le genre masculin ressort du contexte immédiat plus large, mais le mot « mâles » n’est pas exprimé dans ce verset; l’omettre évite d’expliciter silencieusement le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Recensa » convient au contexte administratif sans lourdeur excessive. L’ordre français place le complément d’objet après la proposition comparative pour une lecture naturelle, tout en conservant tous les éléments du texte hébreu.
