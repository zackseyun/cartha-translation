  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: fr
  text: Le nombre total des Lévites que Moïse et Aaron[a] recensèrent sur l’ordre de Yahvé[b], clan par clan — toutes les personnes de sexe masculin âgées d’un mois ou plus —, s’élevait à vingt-deux mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la tradition manuscrite hébraïque, les mots « et Aaron » portent des points extraordinaires, une ancienne marque de copiste dont la signification précise est incertaine.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « selon la bouche de Yahvé », expression signifiant « sur l’ordre de Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פְּקוּדֵי / פָּקַד
  choice: le nombre total… recensèrent
  rationale: Dans ce contexte de recensement, la construction désigne à la fois les personnes recensées et leur total. Cette formulation française reste naturelle tout en conservant le sens du même champ lexical hébreu.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Forme française courante du nom de ce groupe tribal.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahvé
  rationale: Littéralement « selon la bouche de Yahvé » ; l’expression idiomatique indique qu’ils agissaient sur son ordre.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française usuelle du nom divin YHWH, conservé ici comme nom propre.
- source_word: לְמִשְׁפְּחֹתָם
  choice: clan par clan
  rationale: Dans ce recensement tribal, מִשְׁפָּחָה désigne un groupe de parenté plus large que la famille nucléaire moderne.
- source_word: כָּל זָכָר
  choice: tous les garçons
  rationale: Le contexte inclut les enfants mâles dès l’âge d’un mois ; « garçons » exprime naturellement le sexe et l’âge concernés en français.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: âgés d’un mois ou plus
  rationale: Rendu français courant de la formule hébraïque indiquant le seuil d’âge minimal.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: vingt-deux mille
  rationale: Rendu direct du nombre cardinal hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; employer « Yahvé » préserve sa fonction de nom propre sans le remplacer par un titre.
- issue: Rôle de Moïse et d’Aaron dans le recensement
  choice: Moïse et Aaron recensèrent
  alternative: Moïse recensa
  rationale: Le texte consonantique reçu nomme les deux hommes. Les points extraordinaires portés sur « et Aaron » sont signalés en note sans en déduire avec certitude que ces mots doivent être omis.
translation_notes:
  register: Français moderne, clair et digne. « Clan par clan » restitue la structure sociale du recensement ; l’incise garde visible que celui-ci concernait tous les garçons dès l’âge d’un mois.
