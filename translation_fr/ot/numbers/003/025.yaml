  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: fr
  text: La responsabilité des fils de Guershon dans la tente de la rencontre concernait le tabernacle, la tente, sa couverture et le rideau de l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: responsabilité
  rationale: Dans ce contexte d’attribution lévitique, le nom désigne ce qui est confié aux Guershonites et dont ils doivent prendre soin. « Responsabilité » est naturel en français moderne et introduit clairement la liste.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: les fils de Guershon
  rationale: Cette formulation conserve l’expression familiale de l’hébreu tout en restant idiomatique; « les Guershonites » serait également possible.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: La préposition est comprise comme locative ou comme indiquant la sphère du service. « Tente de la rencontre » rend de façon transparente l’expression hébraïque.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme technique établi pour cette structure cultuelle, tout en distinguant ici le מִשְׁכָּן de la tente mentionnée ensuite.
- source_word: וְהָאֹהֶל
  choice: la tente
  rationale: Le groupe nominal est maintenu comme un élément distinct de l’inventaire. En français, la coordination finale suffit à structurer naturellement la liste.
- source_word: מִכְסֵהוּ
  choice: sa couverture
  rationale: Le suffixe renvoie à la tente ou à l’ensemble immédiatement évoqué; « sa couverture » préserve cette relation sans la préciser au-delà du texte.
- source_word: מָסַךְ
  choice: le rideau
  rationale: Le mot désigne ici une tenture fermant une entrée. « Rideau » est plus courant et immédiatement intelligible en français que « écran » dans ce contexte.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: de l’entrée de la tente de la rencontre
  rationale: Cette construction exprime naturellement en français le rapport entre la tenture et l’entrée qu’elle ferme.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure d’inventaire de l’hébreu et la distinction entre « le tabernacle » et « la tente », sans expliquer davantage leur rapport. Aucun marqueur de note n’est nécessaire, car les choix lexicaux retenus sont clairs dans le corps du verset.
