source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: fr
  text: Ceux qui campaient devant la Demeure, à l’est[a], devant la tente de la rencontre, du côté du soleil levant, étaient Moïse, Aaron et ses fils. Ils assuraient la garde du sanctuaire pour le compte des fils d’Israël. Mais toute personne non habilitée[b] qui s’approchera sera mise à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie deux expressions directionnelles apparentées, que l’on pourrait aussi traduire par « vers l’est… à l’est », afin de souligner l’orientation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’étranger » ou « celui du dehors » ; il s’agit ici d’une personne qui n’est pas autorisée à s’approcher pour le service du sanctuaire, et non nécessairement d’un étranger par son origine.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: Ceux qui campaient
  rationale: Le participe substantivé désigne les personnes installées à cet emplacement; l’imparfait convient à la description de la disposition du camp.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: devant la Demeure
  rationale: «Devant» rend naturellement לִפְנֵי. «Demeure» traduit מִשְׁכָּן et le distingue de la «tente de la rencontre» mentionnée ensuite.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: à l’est ... du côté du soleil levant
  rationale: Deux expressions hébraïques apparentées soulignent l’orientation orientale; des formulations distinctes en conservent l’insistance sans répétition pesante.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression claire et consacrée rend le lieu où Dieu rencontre son peuple, sans réduire מוֹעֵד à une simple réunion humaine.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: Moïse, Aaron et ses fils
  rationale: Le suffixe masculin singulier de «ses fils» renvoie le plus naturellement à Aaron, immédiatement antécédent.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת הַמִּקְדָּשׁ
  choice: Ils assuraient la garde du sanctuaire
  rationale: La construction avec deux mots de même racine exprime l’exercice fidèle d’une responsabilité de garde.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: pour le compte des fils d’Israël
  rationale: La formulation exprime une responsabilité exercée en faveur ou au nom d’Israël, tout en évitant de préciser davantage le rapport que ne le fait l’hébreu.
- source_word: וְהַזָּר
  choice: Mais toute personne non habilitée
  rationale: Dans ce contexte cultuel, זָר désigne une personne sans autorisation d’accès ou de service, et non nécessairement quelqu’un d’une autre ethnie.
- source_word: הַקָּרֵב
  choice: qui s’approchera
  rationale: Le verbe exprime ici le fait de s’avancer vers le sanctuaire d’une manière interdite.
- source_word: יוּמָת
  choice: sera mise à mort
  rationale: La forme causative passive indique une peine de mort infligée, et non le simple fait de mourir.
theological_decisions:
- issue: Référent de «ses fils»
  choice: Les fils sont ceux d’Aaron.
  alternative: Les fils ou maisonnées associés conjointement à Moïse et Aaron.
  rationale: Le suffixe singulier suit immédiatement le nom d’Aaron, et la garde sacerdotale revient ailleurs à Aaron et à ses fils.
- issue: Sens de זָר dans la législation du sanctuaire
  choice: Une personne non habilitée à s’approcher dans le cadre du service sacré.
  alternative: Un étranger au sens ethnique ou social.
  rationale: Le contexte porte sur la garde du sanctuaire et l’autorisation cultuelle, non sur l’origine ethnique.
- issue: Rapport exprimé par לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: La garde est exercée pour le compte des fils d’Israël.
  alternative: La garde protège les fils d’Israël, ou constitue strictement l’obligation qui leur incombe.
  rationale: «Pour le compte de» conserve l’idée représentative sans trancher excessivement entre bénéfice, délégation et responsabilité collective.
translation_notes:
  register: Français international moderne, digne et accessible. «Demeure» et «tente de la rencontre» maintiennent la distinction lexicale de l’hébreu. La répétition orientale est conservée sous une forme fluide, et «personne non habilitée» évite le contresens ethnique possible avec «étranger».
