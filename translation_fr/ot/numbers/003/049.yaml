source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: fr
  text: Moïse prit l’argent du rachat[a] auprès de ceux qui étaient en surnombre par rapport à ceux qui avaient été rachetés grâce aux Lévites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’argent de la rançon ». Le terme hébreu désigne la somme versée pour un rachat.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des premiers-nés israélites dont le nombre dépassait le nombre représenté par les Lévites dans ce dénombrement de rachat.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח est rendu par son sens narratif courant, « prendre ». Dans ce contexte de perception d’une somme, « reçut » serait possible, mais « prit » reste plus proche de la forme hébraïque.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: l’argent du rachat
  rationale: כֶּסֶף désigne ici de l’argent, et פִּדְיוֹם le paiement lié au rachat. Cette formulation française conserve le sens juridique et cultuel sans employer le littéral moins naturel « l’argent en métal ».
- source_word: מֵאֵת
  choice: auprès de
  rationale: La préposition indique la source auprès de laquelle Moïse prend ou perçoit la somme. « Auprès de » est naturel en français dans ce contexte.
- source_word: הָעֹדְפִים
  choice: ceux qui étaient en surnombre
  rationale: Le participe de עודף désigne les personnes qui dépassaient numériquement le groupe correspondant. La traduction n’ajoute pas « premiers-nés » dans le corps du verset, puisque ce terme est fourni par le contexte plutôt que par cette proposition.
- source_word: עַל
  choice: par rapport à
  rationale: עַל exprime ici une comparaison numérique. « Par rapport à » rend clairement cette relation en français moderne.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: ceux qui avaient été rachetés par les Lévites
  rationale: Le participe passif construit avec « les Lévites » désigne les personnes comptées comme rachetées grâce à la substitution des Lévites. Cette formulation est intelligible en français tout en laissant la note préciser le mécanisme du dénombrement.
theological_decisions:
- issue: Rôle des Lévites dans l’expression פְּדוּיֵי הַלְוִיִּם
  choice: ceux qui avaient été rachetés par les Lévites
  alternative: les rachetés des Lévites
  rationale: Le génitif hébreu est compact et peut exprimer une relation plus large qu’une simple action instrumentale. La traduction française explicite la relation selon le contexte immédiat, où les Lévites prennent la place des premiers-nés, sans faire d’eux les auteurs autonomes du rachat; la note précise cette substitution.
translation_notes:
  register: Français international moderne, digne et accessible. « En surnombre par rapport à » exprime clairement la comparaison numérique; les précisions contextuelles sur les premiers-nés et la substitution lévitique sont réservées à la note afin de ne pas surtraduire le verset.
