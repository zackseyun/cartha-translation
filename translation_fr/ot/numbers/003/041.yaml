id: NUM.3.41
reference: Numbers 3:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: fr
  text: Tu prendras pour moi les Lévites — moi, je suis Yahweh — à la place de tout premier-né parmi les fils d’Israël[a], et le bétail des Lévites à la place de tout premier-né parmi le bétail des fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Israélites ». L’hébreu dit littéralement « parmi les fils d’Israël ».
    reason: Alternative lexicale et précision sur la forme de l’hébreu.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu prendras
  rationale: Le qatal qal à la deuxième personne masculine singulière, précédé de la conjonction, a ici une valeur directive adressée à Moïse. Le futur français convient au registre prescriptif.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française usuelle du groupe tribal issu de Lévi, avec conservation de l’article défini.
- source_word: לִי
  choice: pour moi
  rationale: La préposition exprime ici l’appartenance ou la consécration; « pour moi » est naturel et conserve cette portée.
- source_word: אֲנִי יְהוָה
  choice: moi, je suis Yahweh
  rationale: La tournure disloquée rend l’emphase du pronom אֲנִי et maintient le nom divin personnel.
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans ce contexte de substitution des premiers-nés, le terme indique clairement le remplacement.
- source_word: כָּל בְּכֹר
  choice: tout premier-né
  rationale: כָּל devant un singulier a une valeur distributive, naturellement rendue par « tout ».
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: Rend directement l’expression hébraïque tout en signalant en note l’équivalent collectif courant.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: le bétail des Lévites
  rationale: בְּהֵמָה désigne collectivement les animaux domestiques; « bétail » est ici concis et idiomatique.
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: tout premier-né parmi le bétail des fils d’Israël
  rationale: Cette formulation conserve le parallélisme de la première substitution et exprime clairement qu’il s’agit des premiers-nés du bétail appartenant à Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre; « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal conserve la forme concrète de l’hébreu, tandis que la note indique son sens collectif possible sans effacer cette particularité.
translation_notes:
  register: Français international moderne, digne et prescriptif. Le futur simple porte l’instruction; l’incise emphatique préserve la force de la formule divine. Le parallélisme des deux substitutions est maintenu.
