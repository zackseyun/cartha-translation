source:
  edition: WLC
  text: וּ/פְקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שֵׁ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: fr
  text: 'On dénombra parmi eux[a] tous les garçons et les hommes âgés d’un mois ou plus : ils étaient six mille deux cents.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur effectif recensé ». L’hébreu peut désigner les personnes recensées parmi eux ou, collectivement, le résultat de leur recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: On dénombra parmi eux
  rationale: Le substantif passif lié à פקד, avec suffixe de troisième personne masculine plurielle, désigne les membres de ce groupe recensés. Cette formulation française exprime naturellement l’acte de recensement sans réduire le terme au seul total abstrait.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: tous les garçons et les hommes
  rationale: Littéralement « selon le nombre de tout mâle ». Dans ce seuil d’âge qui commence à un mois, « garçons et hommes » rend clairement זָכָר en incluant les enfants aussi bien que les adultes.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: âgés d’un mois ou plus
  rationale: Expression française courante qui conserve le seuil inclusif fixé à l’âge d’un mois.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: six mille deux cents
  rationale: Restitution en toutes lettres du nombre cardinal 6 200, conforme au registre narratif biblique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase est restructurée pour éviter le calque pesant de la formule hébraïque, tout en conservant le recensement, le sexe, le seuil d’âge et le total.
