  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: fr
  text: ainsi que les piliers tout autour de la cour, leurs socles, leurs piquets et leurs cordes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: piliers
  rationale: Le pluriel construit désigne les supports verticaux de l’enceinte de la cour. « Piliers » est le terme architectural français naturel dans ce contexte.
- source_word: הֶחָצֵר
  choice: la cour
  rationale: Le nom désigne l’espace délimité autour du sanctuaire. « La cour » est clair, courant et adapté au vocabulaire architectural du tabernacle.
- source_word: סָבִיב
  choice: qui entouraient
  rationale: L’adverbe indique ici la disposition des piliers tout autour de la cour. Une proposition relative rend cette relation naturellement en français sans changer le sens.
- source_word: אַדְנֵיהֶם
  choice: leurs socles
  rationale: Dans les descriptions du tabernacle, le terme désigne les pièces structurelles dans lesquelles reposaient les piliers. « Socles » est à la fois précis et accessible.
- source_word: יְתֵדֹתָם
  choice: leurs piquets
  rationale: Le terme désigne les piquets servant à fixer la structure. « Piquets » convient au contexte et reste plus naturel ici que « chevilles ».
- source_word: מֵיתְרֵיהֶם
  choice: leurs cordes
  rationale: Le mot désigne les cordages utilisés avec les piquets pour maintenir la structure. « Cordes » est simple, exact et courant.
- source_word: וְ
  choice: ainsi que / avec / et
  rationale: Les conjonctions répétées prolongent l’énumération. Leur valeur additive est conservée avec des articulations françaises naturelles, sans reproduire mécaniquement chaque « et ».
