  text: אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/כֹּהֲנִ֖ים הַ/מְּשֻׁחִ֑ים אֲשֶׁר מִלֵּ֥א יָדָ֖/ם לְ/כַהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: fr
  text: Voici les noms des fils d’Aaron, les prêtres oints, dont il a rempli les mains[a] pour exercer le sacerdoce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dont il a rempli les mains ». Cette expression hébraïque désigne leur établissement ou leur installation dans la fonction sacerdotale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Voici les noms
  rationale: Cette formule française naturelle rend le démonstratif et la construction d’identification sans alourdir la phrase.
- source_word: בְּנֵי אַהֲרֹן
  choice: des fils d’Aaron
  rationale: Le masculin précis de בְּנֵי est conservé, ainsi que la relation génitive de la chaîne construite.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Le groupe défini est maintenu en apposition aux fils d’Aaron et désigne leur fonction.
- source_word: הַמְּשֻׁחִים
  choice: ayant reçu l’onction
  rationale: Cette formulation moderne et naturelle conserve l’action rituelle concrète exprimée par le participe passif de משׁח, plutôt que de la généraliser par « consacrés ».
- source_word: אֲשֶׁר מִלֵּא יָדָם
  choice: ceux dont il avait rempli les mains
  rationale: La tournure garde l’image technique hébraïque et la forme verbale active à sujet masculin singulier, tout en laissant non identifié le référent de « il », comme dans le verset.
- source_word: לְכַהֵן
  choice: afin qu’ils exercent le sacerdoce
  rationale: Le tour final exprime clairement le but de l’installation et rend le verbe dénominatif כהן dans un français digne et intelligible.
theological_decisions:
- issue: Expression d’installation sacerdotale מִלֵּא יָדָם
  choice: Conserver dans le texte l’image « remplir les mains » et en expliquer le sens en note.
  alternative: Traduire directement par « ceux qu’il avait établis dans la charge de prêtres » ou « ordonnés prêtres ».
  rationale: L’expression est un idiome technique d’installation dans la fonction sacerdotale. La conserver permet de rendre visible la formulation rituelle du texte hébreu sans imposer une terminologie ecclésiastique ultérieure.
- issue: Identité du sujet de מִלֵּא
  choice: Employer « il » sans identifier son référent.
  alternative: Nommer Moïse, Aaron ou employer une tournure passive.
  rationale: Le verbe hébreu est actif, à la troisième personne masculine du singulier, mais le sujet n’est pas nommé dans ce verset. La traduction conserve à la fois cette donnée grammaticale et cette indétermination.
translation_notes:
  register: Français international actuel, clair et digne. « Ayant reçu l’onction » évite une relative lourde; « exercer le sacerdoce » convient au contexte rituel. L’idiome concret, inhabituel en français, est volontairement conservé et immédiatement signalé par une note.
