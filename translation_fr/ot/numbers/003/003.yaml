revisions:
- from: Voici les noms des fils d’Aaron, les prêtres ayant reçu l’onction, ceux dont il avait rempli les mains[a] afin qu’ils exercent le sacerdoce.
  to: Voici les noms des fils d’Aaron, les prêtres oints, dont il a rempli les mains[a] pour exercer le sacerdoce.
  rationale: La révision élimine l’antériorité non marquée du plus-que-parfait et simplifie la syntaxe française. Elle préserve l’idiome rituel dans le texte, la voix active et le sujet masculin singulier non identifié du verbe hébreu; la note explique l’idiome sans imposer une terminologie ecclésiale ultérieure.
