  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: fr
  text: 'Voici les fils de Lévi, selon leurs noms : Guershon, Qehath et Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ אֵלֶּה
  choice: Voici
  rationale: Dans cette formule généalogique qui introduit une liste, « Voici » rend naturellement en français la présentation exprimée par « ceux-ci furent/étaient », sans suggérer un changement d’état.
- source_word: בְנֵי לֵוִי
  choice: les fils de Lévi
  rationale: Le passage désigne les trois fils directs de Lévi ; « fils » est donc précis et fidèle.
- source_word: בִּשְׁמֹתָם
  choice: avec leurs noms
  rationale: Cette formulation conserve explicitement l’idée hébraïque d’une énumération par noms tout en restant naturelle en français moderne.
- source_word: גֵּרְשׁוֹן
  choice: Guershon
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: קְהָת
  choice: Qehath
  rationale: Translittération qui distingue le qoph initial et conserve la consonne finale de l’hébreu, conformément à un usage biblique français reconnu.
- source_word: מְרָרִי
  choice: Merari
  rationale: Translittération française usuelle du nom propre hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure présentative « Voici » convient au contexte généalogique, tandis que « avec leurs noms » maintient un léger relief formel de l’hébreu sans alourdir la phrase.
