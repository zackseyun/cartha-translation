revisions:
- from: Chaque fois que la nuée s’élevait de dessus la tente[a], les fils d’Israël se mettaient ensuite en route ; et à l’endroit où la nuée demeurait, là les fils d’Israël établissaient leur camp.
  to: Chaque fois que la nuée était enlevée de dessus la tente[a], les fils d’Israël se mettaient ensuite en route ; et à l’endroit où la nuée demeurait, là les fils d’Israël établissaient leur camp.
  rationale: La seule révision remplace une tournure spatiale lourde par « était enlevée de dessus », qui exprime plus directement l’élévation/retrait de la nuée depuis sa position au-dessus de la tente, tout en conservant l’ambiguïté quant à l’agent. Le reste du texte est fidèle et naturel.
