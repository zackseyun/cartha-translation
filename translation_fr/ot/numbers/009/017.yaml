source:
  edition: WLC
  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: fr
  text: Chaque fois que la nuée était enlevée de dessus la tente[a], les fils d’Israël se mettaient ensuite en route ; et à l’endroit où la nuée demeurait, là les fils d’Israël établissaient leur camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tabernacle » ; ici, « la tente » désigne la tente du sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: Chaque fois que … s’élevait
  rationale: L’expression introduit ici la circonstance répétée qui déterminait les départs. L’imparfait français rend naturellement cette valeur habituelle, tandis que « s’élevait » conserve le mouvement de la nuée sans imposer explicitement un agent.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est un terme français digne et bien établi pour le nuage associé à la présence et à la conduite divines dans ce contexte, tout en restant intelligible.
- source_word: מֵעַל הָאֹהֶל
  choice: de dessus la tente
  rationale: Cette formulation garde la relation spatiale de מֵעַל et traduit אֹהֶל par son sens direct, « tente ». Le contexte permet de comprendre qu’il s’agit de la tente du sanctuaire.
- source_word: וְאַחֲרֵי כֵן
  choice: ensuite
  rationale: « Ensuite » marque clairement la succession temporelle sans alourdir la phrase.
- source_word: יִסְעוּ
  choice: se mettaient … en route
  rationale: Dans ce contexte procédural, l’imparfait hébreu décrit une action habituelle. « Se mettre en route » est naturel en français moderne et précis pour le départ du camp.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale du texte hébreu et sa référence à Israël comme ancêtre éponyme, sans la remplacer par le gentilé plus lisse « les Israélites ».
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: et à l’endroit où
  rationale: La traduction maintient explicitement la structure locative du texte source dans un français naturel.
- source_word: יִשְׁכָּן
  choice: demeurait
  rationale: Le verbe שׁכן comporte une nuance d’installation ou de demeure. « Demeurait » la préserve mieux que le simple « s’arrêtait », sans recourir au terme inhabituel « tabernaclait ».
- source_word: שָׁם ... שָׁם
  choice: où … là
  rationale: La reprise « où … là » reproduit la correspondance locative et l’insistance du texte hébreu d’une manière idiomatique en français.
- source_word: יַחֲנוּ
  choice: établissaient leur camp
  rationale: L’imparfait rend l’action répétée, et « établir leur camp » exprime clairement l’acte de camper dans un registre courant et digne.
theological_decisions:
- issue: Nuance de שׁכן appliqué à la nuée
  choice: demeurait
  alternative: se posait
  rationale: « Demeurait » conserve la nuance d’habitation du verbe sans transformer la phrase en affirmation doctrinale explicite sur la présence divine. « Se posait » décrirait plus directement l’immobilisation physique, mais atténuerait cette nuance lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Les imparfaits rendent le caractère habituel des déplacements. « Nuée » et « fils d’Israël » conservent des traits marquants du texte biblique sans archaïsme syntaxique excessif.
