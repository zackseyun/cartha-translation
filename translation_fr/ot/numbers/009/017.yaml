    issue: Formulation spatiale peu idiomatique
    rationale: « La nuée s’élevait de dessus la tente » est calquée sur la syntaxe source et sonne raide en français moderne. Le nifal/hophal contextuel de עלה peut être rendu avec naturel par « était enlevée », sans identifier l’agent.
  revised_text: Chaque fois que la nuée était enlevée de dessus la tente[a], les fils d’Israël se mettaient ensuite en route ; et à l’endroit où la nuée demeurait, là les fils d’Israël établissaient leur camp.
