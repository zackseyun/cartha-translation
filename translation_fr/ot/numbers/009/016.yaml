source:
  edition: WLC
  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: fr
  text: 'Il en était toujours ainsi : la nuée le couvrait et, la nuit, elle avait une apparence de feu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et, la nuit, une apparence de feu ».'
    reason: L’hébreu emploie une expression elliptique (« et une apparence de feu, la nuit ») sans répéter explicitement le sujet ; la traduction principale le reprend contextuellement par « elle ».
lexical_decisions:
- source_word: כֵּן
  choice: ainsi
  rationale: Introduit le résumé du phénomène décrit au verset précédent et conserve naturellement la valeur démonstrative de l’hébreu.
- source_word: יִהְיֶה
  choice: il en était
  rationale: L’imparfait hébreu décrit ici une situation habituelle dans le passé. La tournure française « il en était ainsi » rend ce sens de manière idiomatique.
- source_word: תָמִיד
  choice: constamment
  rationale: Exprime la continuité persistante du phénomène sans suggérer une simple répétition occasionnelle.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: Le nom défini renvoie à la nuée déjà connue dans le contexte. « Nuée » reste clair tout en convenant au registre biblique français.
- source_word: יְכַסֶּנּוּ
  choice: le couvrait
  rationale: Le verbe signifie « couvrir ». Le pronom masculin singulier renvoie le plus naturellement au tabernacle mentionné dans le contexte, lui aussi masculin en français.
- source_word: וּמַרְאֵה אֵשׁ
  choice: et elle avait l’apparence du feu
  rationale: מַרְאֶה désigne ce qui se donne à voir, l’apparence. La formulation n’impose pas qu’il s’agisse littéralement de feu et explicite naturellement en français que la nuée présentait cet aspect.
- source_word: לָיְלָה
  choice: la nuit
  rationale: Expression temporelle française courante qui correspond à l’emploi adverbial de l’hébreu.
theological_decisions:
- issue: Référent du suffixe pronominal dans יְכַסֶּנּוּ
  choice: « le », renvoyant au tabernacle
  alternative: « lui », si le référent était compris comme personnel
  rationale: Le contexte immédiat porte sur le tabernacle, que la nuée recouvre. Le masculin « le » conserve la référence grammaticale naturelle en français sans personnifier le lieu.
- issue: Nature du phénomène nocturne
  choice: « l’apparence du feu »
  alternative: « du feu » ou « comme du feu »
  rationale: Le texte qualifie explicitement ce qui est visible par מַרְאֶה, « apparence/aspect ». La traduction préserve donc la tension entre feu réel et apparence semblable au feu sans la trancher.
translation_notes:
  register: Français international moderne, naturel et digne. « Nuée » maintient une légère coloration biblique largement intelligible. La phrase emploie l’imparfait pour rendre l’état habituel et continu décrit par les formes verbales hébraïques.
