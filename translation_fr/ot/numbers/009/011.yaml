review_pass:
  verdict: revise
  source_fidelity: Le sens calendaire, le moment (« au crépuscule »), l’observance rituelle et les aliments prescrits sont bien rendus. Toutefois, les deux suffixes objets hébreux sont masculins et renvoient, dans le contexte, au פסח, c’est-à-dire au sacrifice/à l’agneau pascal. Le féminin « la » impose sans appui textuel direct le référent grammatical « la Pâque » et rend moins nette la seconde action, qui consiste à manger la victime pascale.
  naturalness: La formulation est globalement claire et de registre approprié. « Le deuxième mois, le quatorzième jour » est naturel dans un cadre scripturaire. « Sacrifice pascal » permet ici un enchaînement français naturel entre « célébrer » et « manger », sans alourdir le texte.
  terminology: « Crépuscule », « pains sans levain » et « herbes amères » sont des équivalents précis et usuels. « Sacrifice pascal » explicite le référent contextuel nécessaire aux pronoms et respecte le caractère sacrificiel du terme פסח dans ce passage.
  issues:
  - severity: medium
    issue: Le pronom féminin « la » dans les deux propositions ne reflète pas le référent masculin du texte hébreu et rend ambiguë l’action de manger.
    rationale: Le suffixe -וֹ de יַעֲשׂוּ אֹתוֹ et de יֹאכְלֻהוּ est masculin. Dans le contexte immédiat, il désigne le פסח, compris comme le sacrifice pascal. Employer « le sacrifice pascal » puis « le » conserve ce référent et rend la phrase française intelligible.
  revised_text: Le deuxième mois, le quatorzième jour, au crépuscule[a], ils célébreront le sacrifice pascal ; ils le mangeront avec des pains sans levain et des herbes amères.
