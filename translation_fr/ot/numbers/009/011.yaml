revisions:
- from: Le deuxième mois, le quatorzième jour, au crépuscule[a], ils la célébreront. Ils la mangeront avec des pains sans levain et des herbes amères.
  to: Le deuxième mois, le quatorzième jour, au crépuscule[a], ils célébreront le sacrifice pascal ; ils le mangeront avec des pains sans levain et des herbes amères.
  rationale: La révision remplace les pronoms féminins par l’expression contextuellement explicitée « le sacrifice pascal » et par le pronom masculin correspondant. Elle évite ainsi d’attribuer au seul verset un féminin absent de l’hébreu, tout en rendant explicitement et naturellement la relation entre la célébration du rite et la consommation de la victime. La note conserve la littéralité et l’incertitude chronologique de l’idiome hébreu.
