  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: fr
  text: Le deuxième mois, le quatorzième jour, au crépuscule[a], ils célébreront le sacrifice pascal ; ils le mangeront avec des pains sans levain et des herbes amères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « entre les deux soirs », expression qui désigne la période située vers le coucher du soleil ; sa délimitation exacte est discutée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: Le deuxième mois
  rationale: Dans ce contexte calendaire, חֹדֶשׁ désigne le mois. Cette tournure française exprime naturellement la date sans ajouter d’élément absent du texte.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: le quatorzième jour
  rationale: La construction cardinale hébraïque sert ici à indiquer une date; l’ordinal est la formulation française naturelle.
- source_word: בֵּין הָעַרְבַּיִם
  choice: au crépuscule
  rationale: L’expression idiomatique situe l’action vers le coucher du soleil. « Au crépuscule » est clair en français moderne, tandis que la formulation littérale et son ambiguïté sont conservées en note.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: ils la célébreront
  rationale: Dans le contexte de la Pâque, עשה signifie accomplir ou observer le rite. Le pronom féminin français renvoie naturellement à « la Pâque » dans le contexte immédiat.
- source_word: עַל מַצּוֹת
  choice: avec des pains sans levain
  rationale: Ici, עַל exprime l’accompagnement du repas plutôt que la position physique. Le pluriel « pains » reflète מַצּוֹת tout en restant naturel.
- source_word: וּמְרֹרִים
  choice: et des herbes amères
  rationale: Dans ce contexte rituel, le pluriel désigne les végétaux amers consommés avec la Pâque; « herbes amères » est l’expression française précise et usuelle.
- source_word: יֹאכְלֻהוּ
  choice: Ils la mangeront
  rationale: Le verbe est un qal inaccompli à la troisième personne du pluriel avec suffixe objet. Le futur français convient à cette prescription, et « la » renvoie à la Pâque ou à la victime pascale selon le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur exprime la prescription légale. La répétition de « ils la » maintient les deux propositions du texte hébreu, tandis que « célébrer » rend le sens rituel de עשה sans recourir au calque obscur « faire ».
