  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: fr
  text: Il y avait des hommes qui étaient impurs à cause d’un cadavre humain[a] et qui, par conséquent, ne pouvaient pas célébrer la Pâque ce jour-là. Ils se présentèrent ce même jour devant Moïse et Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « impurs pour une personne humaine ». Dans ce contexte, l’expression hébraïque désigne l’impureté rituelle causée par un cadavre humain.'
    reason: Précise l’expression idiomatique hébraïque sans calque obscur ni implication d’une impureté morale.
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: Il y avait des hommes
  rationale: La tournure introduit une circonstance narrative. « Il y avait » est naturelle en français et אֲנָשִׁים désigne ici des hommes.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: impurs à cause d’un cadavre humain
  rationale: Dans le cadre des lois de pureté du Pentateuque, l’expression idiomatique désigne l’impureté rituelle liée à un cadavre humain, et non une faute morale.
- source_word: וְלֹא יָכְלוּ
  choice: et qui, par conséquent, ne pouvaient pas
  rationale: Cette formulation rend explicitement le rapport de conséquence avec l’impureté, naturellement exprimé par le contexte hébreu.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: célébrer la Pâque
  rationale: 'Littéralement « faire la Pâque » : en français courant, « célébrer la Pâque » exprime clairement l’accomplissement de cette observance rituelle sans suggérer seulement une fête profane.'
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là / ce même jour
  rationale: La première occurrence est rendue directement; « ce même jour » à la seconde souligne naturellement la répétition et l’identité du jour.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: Ils se présentèrent devant
  rationale: Cette expression française rend l’idée de s’approcher pour comparaître devant Moïse et Aaron sans transformer explicitement la scène en procédure judiciaire.
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: Moïse ... Aaron
  rationale: Formes françaises conventionnelles des noms bibliques.
theological_decisions:
- issue: Nature de l’impureté
  choice: Présenter l’impureté comme résultant d’un cadavre humain
  alternative: Traduire littéralement « impurs pour l’âme/la personne d’un homme »
  rationale: Dans ce contexte sacerdotal, l’expression concerne l’impureté rituelle associée à la mort; la traduction évite d’y importer une culpabilité morale.
translation_notes:
  register: Français international moderne, clair et digne. « Impurs » conserve le vocabulaire rituel; « se présentèrent devant » évite le calque peu naturel « s’approchèrent devant ». Le point sépare les deux mouvements du récit tout en maintenant leur lien temporel.
