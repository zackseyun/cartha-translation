id: NUM.9.19
reference: Numbers 9:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: fr
  text: Quand la nuée restait longtemps au-dessus du tabernacle, les Israélites[a] observaient la consigne de Yahweh[b] et ne partaient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la charge de Yahweh » ou « l’obligation imposée par Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ
  choice: Quand … restait longtemps
  rationale: La préposition ב avec l’infinitif construit introduit une proposition temporelle, tandis que אָרַךְ exprime ici la prolongation du séjour de la nuée.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est un terme français naturel et digne dans ce contexte biblique, et désigne le signe visible qui guide Israël.
- source_word: עַל הַמִּשְׁכָּן
  choice: au-dessus du tabernacle
  rationale: Cette formulation rend clairement la position de la nuée; « tabernacle » est le terme consacré et compréhensible pour le sanctuaire mobile.
- source_word: יָמִים רַבִּים
  choice: longtemps
  rationale: Littéralement « de nombreux jours »; « longtemps » s’intègre naturellement à la tournure française tout en conservant l’idée d’une durée prolongée.
- source_word: וְשָׁמְרוּ
  choice: observaient
  rationale: Avec מִשְׁמֶרֶת, שׁמר exprime l’accomplissement attentif d’une obligation plutôt qu’une simple garde physique.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais désigne ici collectivement le peuple; « les Israélites » est clair, inclusif et idiomatique en français.
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: la consigne de Yahweh
  rationale: מִשְׁמֶרֶת désigne ici une charge, une obligation ou une consigne à respecter. « Consigne » convient particulièrement au fait de rester sur place tant que la nuée demeure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH; sa translittération préserve le nom personnel plutôt que de le remplacer par un titre.
- source_word: וְלֹא יִסָּעוּ
  choice: et ne partaient pas
  rationale: Dans le contexte des déplacements au désert, נסע signifie lever le camp et se mettre en route; « ne partaient pas » est direct et naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » conserve le nom d’alliance sans lui substituer un titre.
- issue: Rendu collectif de בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans ce contexte, l’expression désigne l’ensemble du peuple. Le texte français principal privilégie la désignation collective naturelle, tandis qu’une note conserve la forme littérale et son éventuelle nuance familiale.
- issue: Sens de מִשְׁמֶרֶת יְהוָה
  choice: la consigne de Yahweh
  alternative: la charge de Yahweh
  rationale: Le nom peut désigner une charge, une obligation ou ce qui doit être observé. « Consigne » exprime naturellement ici l’obligation d’attendre, sans transformer l’expression en commandement formulé explicitement.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » et « tabernacle » maintiennent le registre biblique sans archaïsme syntaxique; l’imparfait rend l’action prolongée et habituelle dans ce contexte.
