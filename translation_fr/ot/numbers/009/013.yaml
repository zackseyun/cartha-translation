  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: fr
  text: Mais l’homme qui est rituellement pur et qui n’est pas en voyage, s’il néglige de célébrer la Pâque, cette personne sera retranchée du milieu de son peuple[a], car elle n’a pas présenté l’offrande de Yahweh au temps fixé ; cet homme portera son péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « sera retranchée » désigne un grave jugement lié à l’alliance, sans préciser ici de quelle manière il sera exécuté.
    reason: Précision sur un idiome hébreu dont la portée exacte demeure ouverte.
  - marker: b
    text: 'Ou : « portera sa faute » ou « répondra de son péché ».'
    reason: Autres façons de rendre l’idiome hébreu exprimant la responsabilité et ses conséquences.
lexical_decisions:
- source_word: טָהוֹר
  choice: en état de pureté
  rationale: Dans ce contexte rituel, le terme désigne la pureté cérémonielle plutôt que la pureté morale. Cette formulation rend le sens plus clairement que le seul adjectif « pur ».
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: n’est pas en voyage
  rationale: La formule désigne l’absence due à un déplacement et fait écho à l’exception énoncée dans le contexte immédiat.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: mais s’abstient de célébrer la Pâque
  rationale: חָדַל exprime ici le fait de s’abstenir ou de manquer à l’observance; « célébrer la Pâque » rend naturellement l’action cultuelle sans la réduire au seul sacrifice.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: cette personne sera retranchée
  rationale: נֶפֶשׁ désigne ici l’individu. « Retranchée » conserve l’idiome judiciaire et religieux sans préciser un mode de sanction que le verset ne définit pas.
- source_word: מֵעַמֶּיהָ
  choice: du milieu de son peuple
  rationale: Le suffixe féminin s’accorde grammaticalement avec נֶפֶשׁ, mais renvoie à l’homme mentionné; « son peuple » exprime naturellement cette appartenance.
- source_word: קָרְבַּן יְהוָה
  choice: l’offrande de Yahweh
  rationale: קָרְבָּן désigne ce qui est présenté à Dieu comme offrande. Le nom divin est conservé sous la forme « Yahweh » plutôt que remplacé par un titre.
- source_word: בְּמֹעֲדוֹ
  choice: au temps fixé
  rationale: מוֹעֵד désigne ici le moment prescrit pour la célébration; la formulation française est concise et précise.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: portera son péché
  rationale: La traduction maintient l’idiome hébreu, qui peut englober à la fois la faute, la responsabilité qui en découle et ses conséquences.
- source_word: הָאִישׁ הַהוּא
  choice: cet homme
  rationale: L’hébreu reprend explicitement le nom masculin singulier אִישׁ; la traduction conserve cette précision.
theological_decisions:
- issue: Sens de la peine exprimée par « sera retranchée »
  choice: Conserver l’idiome sans définir le mode précis de la sanction.
  alternative: « sera exclue de la communauté » ou « sera mise à mort »
  rationale: Le verset ne précise pas si le retranchement correspond à l’exclusion, à la mort ou à une intervention judiciaire divine. La traduction préserve donc cette tension.
- issue: Porter son péché
  choice: Conserver « portera son péché ».
  alternative: « portera sa faute » ou « répondra de sa faute »
  rationale: L’expression source associe le péché à la responsabilité et possiblement à ses conséquences. L’idiome retenu évite de limiter le sens à une seule de ces dimensions.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel reste explicite sans devenir technique. La reprise « l’homme… cette personne… cet homme » suit les variations du texte hébreu, malgré une légère lourdeur assumée afin de préserver sa structure et ses nuances.
