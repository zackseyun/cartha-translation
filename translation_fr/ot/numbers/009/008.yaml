source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְ/אֶשְׁמְעָ֔ה מַה יְצַוֶּ֥ה יְהוָ֖ה לָ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: fr
  text: 'Moïse leur dit : « Attendez[a], et j’écouterai ce que Yahweh ordonnera à votre sujet. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tenez-vous debout » ; ou : « Restez en place ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit la narration. En français, le passé simple suffit naturellement sans qu’il soit nécessaire de rendre systématiquement le waw par « et ».
- source_word: אֲלֵהֶם
  choice: leur
  rationale: Le pronom complément indirect rend directement et naturellement le suffixe masculin pluriel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: עִמְדוּ
  choice: Attendez ici
  rationale: L’impératif signifie littéralement « tenez-vous debout », mais prend ici le sens contextuel de rester sur place en attendant une réponse. « Ici » explicite sobrement cette valeur sans transformer l’ordre en simple attente temporelle.
- source_word: וְאֶשְׁמְעָה
  choice: et j’écouterai
  rationale: La forme à valeur cohortative exprime l’intention de Moïse. « J’écouterai » garde l’image auditive et sonne plus intentionnel en français que « j’entendrai ».
- source_word: מַה
  choice: ce que
  rationale: Cette tournure introduit naturellement en français le contenu de l’ordre attendu.
- source_word: יְצַוֶּה
  choice: ordonnera
  rationale: Le piel imparfait de צוה désigne ici l’ordre que Yahweh donnera après cette attente; le futur convient à la perspective de Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, afin de préserver dans le texte le nom propre employé par l’hébreu plutôt que de le remplacer par un titre.
- source_word: לָכֶם
  choice: vous
  rationale: Avec צוה, le complément peut désigner les destinataires de l’ordre. « Vous ordonnera » est idiomatique et préserve la possibilité que l’instruction leur soit adressée, sans imposer la paraphrase « à votre sujet ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme comme nom propre; sa transcription préserve cette distinction sans lui substituer un titre.
- issue: Rapport de לָכֶם à l’ordre divin
  choice: ce que Yahweh vous ordonnera
  alternative: ce que Yahweh ordonnera à votre sujet
  rationale: Le datif hébreu permet de comprendre les hommes comme destinataires ou bénéficiaires de l’ordre. Le choix retenu est naturel en français et n’ajoute pas explicitement l’idée que l’ordre porterait seulement sur leur cas.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct reste simple et oral. La note conserve le sens concret de עמד, tandis que le texte principal en exprime la portée contextuelle.
