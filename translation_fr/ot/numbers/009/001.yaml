source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse dans le désert du Sinaï[a], la deuxième année après leur sortie du pays d’Égypte, au premier mois, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la région désertique du Sinaï ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif biblique français et rend distinctement l’acte de parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme, sans lui substituer un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: Avec דבר, אֶל désigne naturellement le destinataire de la parole.
- source_word: בְמִדְבַּר סִינַי
  choice: dans le désert du Sinaï
  rationale: מִדְבָּר désigne une région aride ou inhabitée. « Désert du Sinaï » est la formulation française naturelle et traditionnelle, tandis que « région désertique » reste une possibilité lexicale signalée en note.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: la deuxième année
  rationale: Expression temporelle directe; en français, la préposition n’a pas besoin d’être répétée après le premier complément de lieu.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: après leur sortie du pays d’Égypte
  rationale: L’infinitif construit avec suffixe forme ici un repère temporel lié à l’exode. La tournure nominale est concise et conserve explicitement אֶרֶץ, « pays ».
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: le premier mois
  rationale: Rendu direct du second repère chronologique, coordonné naturellement au précédent en français.
- source_word: לֵאמֹר
  choice: 'Il dit :'
  rationale: L’infinitif hébreu introduit les paroles qui suivent. Une proposition autonome avec deux-points est plus naturelle en français qu’un participe présent final, tout en maintenant clairement l’introduction du discours.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre et correspond à la reconstruction savante courante, sans le remplacer par le titre « le Seigneur ».
translation_notes:
  register: 'Français international moderne, digne et lisible. Le passé simple maintient le registre narratif des Écritures sans archaïsme marqué. La formule hébraïque לֵאמֹר est rendue idiomatiquement par « Il dit : », puisque le contenu du discours commence au verset suivant.'
