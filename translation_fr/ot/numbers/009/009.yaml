  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Alors Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH »; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … parla
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français, tandis que « parla » rend דבר et évite de faire double emploi avec la formule introductive qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette translittération représente le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif construit introduit la parole qui suit. « En ces termes : » reproduit idiomatiquement cette fonction en français sans la lourdeur de « en disant ».'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le caractère de nom propre sans le remplacer par le titre traditionnel « le SEIGNEUR »; « Jéhovah » repose sur une vocalisation traditionnelle plus tardive.
translation_notes:
  register: 'Français international moderne, sobre et digne. La formule « en ces termes : » introduit naturellement le discours à venir. Le marqueur [a] est placé après « Moïse », conformément à la couche de consultation fournie, bien que la note porte sur « Yahweh ».'
