id: NUM.9.20
reference: Numbers 9:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: fr
  text: Parfois, la nuée restait au-dessus du tabernacle pendant un certain nombre de jours. Sur l’ordre de Yahweh[a], ils campaient, et sur l’ordre de Yahweh, ils repartaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche de Yahweh », c’est-à-dire sur son ordre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Parfois
  rationale: Cette tournure introduit un cas parmi diverses situations; « Parfois » en rend naturellement la valeur circonstancielle.
- source_word: יִהְיֶה הֶעָנָן
  choice: la nuée restait
  rationale: Dans ce contexte, היה exprime la présence continue de la nuée au-dessus du tabernacle, plutôt que sa simple existence.
- source_word: יָמִים מִסְפָּר
  choice: pendant un certain nombre de jours
  rationale: L’expression désigne un nombre limité mais indéterminé de jours, sans imposer le sens plus précis de « quelques jours ».
- source_word: עַל הַמִּשְׁכָּן
  choice: au-dessus du tabernacle
  rationale: « Tabernacle » est le terme français établi pour la demeure-sanctuaire du désert, et « au-dessus » rend la position de la nuée.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: Littéralement « selon la bouche de Yahweh », l’expression idiomatique indique ici que les déplacements obéissaient à son ordre.
- source_word: יַחֲנוּ
  choice: ils campaient
  rationale: L’imparfait français exprime naturellement l’action habituelle et répétée décrite par l’imparfait hébreu.
- source_word: יִסָּעוּ
  choice: ils repartaient
  rationale: Dans le contexte des étapes au désert, נסע désigne le fait de lever le camp et de reprendre la route; « repartaient » est naturel et précis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel porté par le tétragramme, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Nature de la direction divine dans עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  alternative: selon la bouche de Yahweh
  rationale: Le sens idiomatique est celui d’une directive faisant autorité. La note conserve toutefois l’image hébraïque littérale sans lui attribuer un mécanisme non précisé par le verset.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait restitue le caractère habituel des actions. « Nuée » maintient le terme biblique usuel tout en restant compréhensible; « repartaient » rend le mouvement après une période de campement.
