  source_fidelity: La condition porte sur le résident étranger qui « célèbre/observe » la Pâque; le texte hébreu n'exprime pas explicitement le vouloir (« veut »). Le reste rend correctement l'observance dédiée à Yahweh, la conformité aux prescriptions du rite et l'unicité de la règle.
  naturalness: Le français est globalement clair et moderne. « Résident étranger » est plus précis et moins chargé administrativement que « immigré » pour le statut juridique ancien de גֵּר. « Natif du pays » rend naturellement le contraste avec ce résident étranger.
  terminology: « Pâque », « Yahweh », « prescription » et « règle » conviennent au registre rituel et juridique. La distinction souple entre חֻקָּה et מִשְׁפָּט est préservée sans lui attribuer une portée technique excessive.
