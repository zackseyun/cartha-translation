  - severity: low
    issue: « immigré » peut évoquer des catégories administratives contemporaines et « homme du pays » emploie un masculin générique moins naturel.
    rationale: « Résident étranger » explicite avec précision le sens de גֵּר, tandis que « natif du pays » exprime le sens contrastif de אֶזְרַח הָאָרֶץ dans un français international courant.
