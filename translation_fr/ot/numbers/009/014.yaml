  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: fr
  text: Si un résident étranger séjourne parmi vous et célèbre la Pâque pour Yahweh[a], il la célébrera selon la prescription de la Pâque et selon la règle qui s’y applique. Il fera ainsi. Il y aura une seule prescription pour vous, pour le résident étranger[b] et pour le natif du pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en l’honneur de Yahweh ». La préposition hébraïque peut exprimer la destination ou la dédicace de la célébration.
    reason: Précise la nuance possible de la préposition לְ.
  - marker: b
    text: Le mot hébreu désigne un étranger établi parmi les Israélites, et non un simple voyageur. On pourrait aussi traduire par « immigré ».
    reason: Précise le statut exprimé par גֵּר et fournit une autre traduction possible.
  - marker: c
    text: Ou « celui qui est né dans le pays »; c’est-à-dire l’autochtone, par contraste avec le résident étranger.
    reason: Précise le sens de אֶזְרַח הָאָרֶץ.
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Introduit naturellement en français un cas conditionnel lié à la législation précédente; la liaison contextuelle ne nécessite pas un « Et » explicite.
- source_word: יָגוּר ... גֵּר
  choice: un immigré réside parmi vous
  rationale: גֵּר désigne un étranger établi durablement au sein d’Israël, et non un simple voyageur. « Immigré » exprime clairement ce statut en français moderne; « réside parmi vous » rend le verbe apparenté et le cadre communautaire.
- source_word: וְעָשָׂה פֶסַח
  choice: veut célébrer la Pâque
  rationale: Littéralement « faire la Pâque »; dans ce contexte, l’expression désigne l’accomplissement ou la célébration du rite. Le contexte conditionnel autorise ici « veut célébrer ».
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition indique que l’observance est destinée à Yahweh. Cette formulation est idiomatique et conserve le nom divin.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: selon la prescription de la Pâque
  rationale: חֻקָּה désigne une disposition prescrite; « prescription » garde la force juridique et rituelle du terme.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: selon la règle qui s’y applique
  rationale: מִשְׁפָּט renvoie ici à la norme ou aux modalités régissant la Pâque. Cette traduction le distingue de חֻקָּה sans exagérer la différence sémantique.
- source_word: כֵּן יַעֲשֶׂה
  choice: Il fera ainsi
  rationale: Rend avec concision l’insistance sur la conformité à la manière prescrite.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: Il y aura une seule prescription
  rationale: Exprime clairement qu’une même disposition contraignante vaut pour tous les groupes nommés.
- source_word: לָכֶם וְלַגֵּר
  choice: pour vous, pour l’immigré
  rationale: La répétition de « pour » reflète celle de la préposition hébraïque et souligne l’application commune de la prescription.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: et pour l’homme du pays
  rationale: אֶזְרַח désigne celui qui est originaire du pays, par contraste avec le גֵּר. La note explicite cette valeur sans importer la notion politique moderne de citoyenneté.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de l’unique prescription
  choice: La même prescription régit l’Israélite et l’immigré qui célèbre la Pâque.
  alternative: Le verset accorde seulement une permission, sans mettre en relief une règle commune; ou il affirme une égalité juridique générale dans tous les domaines.
  rationale: « Une seule prescription » affirme explicitement une norme commune dans le contexte immédiat de la Pâque, sans justifier à lui seul une généralisation à tous les domaines du droit.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique reste perceptible sans archaïsme. « Immigré » est choisi pour rendre le statut durable de גֵּר; une note fournit « résident étranger ». Les répétitions du texte hébreu sont en partie conservées afin de maintenir son insistance législative.
