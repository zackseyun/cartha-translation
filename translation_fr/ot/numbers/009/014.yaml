revisions:
- from: Si un immigré réside parmi vous et veut célébrer la Pâque en l’honneur de Yahweh[a], il la célébrera selon la prescription de la Pâque et selon la règle qui s’y applique. Il fera ainsi. Il y aura une seule prescription pour vous, pour l’immigré[b] et pour l’homme du pays[c].
  to: Si un résident étranger séjourne parmi vous et célèbre la Pâque pour Yahweh[a], il la célébrera selon la prescription de la Pâque et selon la règle qui s’y applique. Il fera ainsi. Il y aura une seule prescription pour vous, pour le résident étranger[b] et pour le natif du pays[c].
  rationale: La révision supprime l’ajout sémantique « veut », qui n’est pas justifié par le verbe hébreu. Elle remplace aussi deux désignations françaises par des formulations plus exactes et plus naturelles pour le contraste juridique ancien entre le גֵּר et le natif du pays, sans étendre la portée de la règle au-delà du contexte de la Pâque.
