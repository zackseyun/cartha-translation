  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: fr
  text: 'Parle aux fils d’Israël[a] et dis-leur : « Si, parmi vous ou au cours de vos générations, un homme est impur au contact d’un cadavre[b], ou se trouve en voyage lointain, il célébrera la Pâque pour Yahvé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël » ; l’expression désigne ici la communauté israélite.'
    reason: Préciser la portée collective de l’expression hébraïque conservée dans le texte.
  - marker: b
    text: 'Littéralement : « impur pour une personne » ; dans ce contexte juridique et rituel, il s’agit de l’impureté contractée au contact d’un cadavre.'
    reason: Expliquer l’idiome hébraïque טָמֵא לָנֶפֶשׁ.
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Parle aux fils d’Israël et dis-leur
  rationale: « Fils d’Israël » conserve l’expression hébraïque, tandis que « et dis-leur » rend naturellement en français la formule introductive לֵאמֹר.
- source_word: אִישׁ אִישׁ
  choice: Si un homme
  rationale: 'La répétition a une valeur distributive : elle vise chaque homme susceptible de se trouver dans l’un des cas énoncés.'
- source_word: טָמֵא לָנֶפֶשׁ
  choice: est impur à cause d’un mort
  rationale: Dans ce contexte rituel, נֶפֶשׁ désigne une personne morte comme source d’impureté. Cette formulation française rend l’idiome sans suggérer que le mort serait lui-même impur.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: se trouve en voyage au loin
  rationale: L’expression décrit une personne éloignée en raison d’un déplacement; « en voyage au loin » est naturel et conserve l’idée de distance.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: parmi vous ou parmi vos descendants
  rationale: La règle concerne aussi bien la communauté présente que les générations qui en seront issues. « Descendants » exprime ici plus clairement la continuité humaine que le calque « générations ».
- source_word: וְעָשָׂה פֶסַח
  choice: il célébrera la Pâque
  rationale: Avec פֶסַח, עשה signifie accomplir ou célébrer la Pâque. Le futur français convient à la valeur prescriptive de la règle.
- source_word: לַיהוָה
  choice: en l’honneur de Yahvé
  rationale: La préposition ל marque ici l’orientation cultuelle de la célébration vers Yahvé. « En l’honneur de » est plus idiomatique que « à Yahvé » et évite l’ambiguïté de « pour Yahvé ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de l’expression masculine אִישׁ אִישׁ
  choice: un homme
  alternative: quiconque
  rationale: Le choix conserve la forme masculine du texte hébreu sans nier la portée communautaire générale de l’instruction.
- issue: Force de וְעָשָׂה
  choice: il célébrera
  alternative: il pourra néanmoins célébrer
  rationale: Le simple verbe hébreu ne contient ni « pourra » ni « néanmoins ». Le futur prescriptif préserve l’obligation sans expliciter davantage que le texte.
translation_notes:
  register: 'Français international moderne, soutenu sans archaïsmes. La syntaxe a été légèrement réorganisée pour rattacher clairement « parmi vous ou parmi vos descendants » à « un homme », tout en conservant les deux circonstances juridiques : l’impureté due à un mort et l’éloignement en voyage.'
