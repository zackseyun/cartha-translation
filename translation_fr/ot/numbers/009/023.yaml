  rationale: La révision remplace un verbe comportant une nuance non requise par le texte source et choisit pour מִשְׁמֶרֶת un terme français plus englobant. Elle maintient les imparfaits à valeur habituelle, la triple insistance sur l’ordre de Yahweh, la médiation de Moïse et l’ancrage de note correspondant à l’idiome hébreu.
