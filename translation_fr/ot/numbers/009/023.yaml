  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: fr
  text: Sur l’ordre de Yahweh, ils campaient, et sur l’ordre de Yahweh, ils partaient. Ils observaient les prescriptions de Yahweh, conformément à l’ordre de Yahweh transmis par l’intermédiaire de Moïse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse », expression qui signifie ici « par l’intermédiaire de Moïse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: sur l’ordre de
  rationale: L’expression signifie littéralement « sur la bouche de » et désigne ici une directive faisant autorité. « Sur l’ordre de » est naturel en français et permet de conserver la triple répétition de la formule hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin יהוה conformément à l’usage du projet, sans le remplacer par un titre.
- source_word: יַחֲנוּ
  choice: ils campaient
  rationale: Le verbe désigne le fait d’établir ou de maintenir le camp. L’imparfait convient au résumé d’une conduite répétée durant le voyage.
- source_word: יִסָּעוּ
  choice: ils repartaient
  rationale: Dans ce contexte, le verbe évoque la levée du camp et le départ vers l’étape suivante. « Repartaient » s’oppose naturellement à « campaient » tout en exprimant ce mouvement récurrent.
- source_word: מִשְׁמֶרֶת
  choice: les consignes
  rationale: Le nom désigne ce qui est confié à la garde ou à l’observance. « Les consignes » exprime ici les prescriptions que le peuple devait respecter, sans limiter le sens à une tâche cultuelle précise.
- source_word: שָׁמָרוּ
  choice: ils observaient
  rationale: Le verbe peut signifier garder, veiller sur ou observer. Avec מִשְׁמֶרֶת, « observaient » rend clairement l’idée d’obéissance aux consignes reçues.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Littéralement « par la main de Moïse », cette expression idiomatique marque l’agence ou la médiation. La formulation retenue en communique clairement le sens en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Relation entre l’ordre divin et la médiation de Moïse
  choice: « sur l’ordre de Yahweh transmis par l’intermédiaire de Moïse »
  alternative: « sur l’ordre de Yahweh, par la main de Moïse »
  rationale: Le français explicite sobrement que l’ordre vient de Yahweh et est communiqué par Moïse, sans attribuer à Moïse l’origine de cet ordre.
translation_notes:
  register: Français international moderne, sobre et digne. La triple reprise de « sur l’ordre de Yahweh » conserve l’insistance du texte hébreu. Les imparfaits présentent les actions comme la conduite habituelle d’Israël durant les étapes du désert.
