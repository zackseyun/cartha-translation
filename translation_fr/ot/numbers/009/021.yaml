source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: fr
  text: Parfois, la nuée restait du soir jusqu’au matin. Quand la nuée s’élevait le matin[a], ils partaient. Ou bien elle restait un jour et une nuit ; quand la nuée s’élevait, ils partaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « était enlevée ». Littéralement, « la nuée montait » ; dans ce contexte, son élévation signalait le départ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Parfois
  rationale: L’expression introduit un cas occasionnel dans la série de situations décrites ; « Parfois » est naturel et fidèle à cette fonction.
- source_word: יִהְיֶה הֶעָנָן
  choice: la nuée restait
  rationale: Avec la durée qui suit, היה exprime ici la présence continue de la nuée plutôt que sa simple existence.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: du soir jusqu’au matin
  rationale: Cette formulation française rend directement la période et son terme.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: quand la nuée s’élevait
  rationale: Le verbe עלה décrit la nuée qui se lève au-dessus de la demeure et donne ainsi le signal du départ ; le tour pronominal est idiomatique en français tout en préservant l’absence d’agent exprimé.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Expression temporelle naturelle en français dans ce contexte.
- source_word: וְנָסָעוּ
  choice: ils partaient
  rationale: Dans le contexte des déplacements au désert, נסע désigne le fait de quitter le camp et de se mettre en route.
- source_word: אוֹ
  choice: Ou bien
  rationale: Introduit clairement le second cas envisagé, parallèle au premier.
- source_word: יוֹמָם וָלַיְלָה
  choice: un jour et une nuit
  rationale: Dans cette construction, l’expression indique la durée pendant laquelle la nuée demeure.
