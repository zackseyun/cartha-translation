id: NUM.9.18
reference: Numbers 9:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: fr
  text: Sur l’ordre de Yahweh[a], les Israélites se mettaient en route, et sur l’ordre de Yahweh, ils dressaient le camp. Aussi longtemps que le nuage demeurait au-dessus du tabernacle, ils restaient campés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la bouche de Yahweh »; expression hébraïque signifiant « sur l’ordre de Yahweh ».'
    reason: La note conserve l’image littérale de l’idiome hébreu tout en expliquant son sens dans le texte.
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: L’expression signifie littéralement « sur la bouche de Yahweh », mais fonctionne ici comme un idiome désignant son ordre ou sa directive. « Sur l’ordre de » est naturel en français et conserve l’autorité de la parole divine.
- source_word: יִסְעוּ
  choice: se mettaient en route
  rationale: Dans le contexte des déplacements du camp, נסע désigne le fait de lever le camp et de partir. L’imparfait exprime ici l’action habituelle régie par le mouvement du nuage.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Bien que la forme soit littéralement « les fils d’Israël », elle désigne collectivement le peuple d’Israël. « Les Israélites » est précis, naturel et évite de suggérer que seuls les hommes sont concernés.
- source_word: יַחֲנוּ
  choice: ils dressaient le camp / ils restaient campés
  rationale: חנה signifie camper. La première formulation décrit l’installation du camp; la seconde rend la valeur durative imposée par la proposition temporelle, sans changer le sens lexical fondamental.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: aussi longtemps que
  rationale: Cette tournure française exprime naturellement toute la durée indiquée par l’hébreu « tous les jours où ».
- source_word: יִשְׁכֹּן
  choice: demeurait
  rationale: שכן signifie demeurer ou résider. Avec le nuage pour sujet, « demeurait » exprime sa présence continue au-dessus du tabernacle.
- source_word: הֶעָנָן
  choice: le nuage
  rationale: Traduction directe du signe visible qui guide les Israélites dans ce contexte.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: מִשְׁכָּן désigne la demeure sacrée transportable. « Tabernacle » est le terme français traditionnel précis et le distingue de la tente de la Rencontre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel représenté par le tétragramme, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel de Dieu sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait rend le caractère répété des départs et des campements dans le contexte. « Israélites » est préféré au calque « fils d’Israël » parce que l’expression hébraïque désigne ici l’ensemble du peuple.
