id: NUM.9.12
reference: Numbers 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: fr
  text: Ils n’en laisseront rien jusqu’au matin et ne briseront aucun de ses os[a]. Ils célébreront la Pâque conformément à toutes les prescriptions qui la concernent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette prescription reprend celle d’Exode 12.46.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: Ils n’en laisseront rien jusqu’au matin
  rationale: Le hiphil de שׁאר signifie « laisser, laisser subsister ». Avec מִמֶּנּוּ au sens partitif et la négation, « n’en laisseront rien » rend naturellement l’interdiction complète, tandis que עַד בֹּקֶר fixe la limite temporelle.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: et ne briseront aucun de ses os
  rationale: Le singulier עֶצֶם a ici une valeur distributive. « Aucun de ses os » exprime idiomatiquement en français l’interdiction portant sur tout os de l’animal, sans en modifier la portée.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: conformément à toutes les prescriptions qui concernent la Pâque
  rationale: חֻקָּה désigne une règle ou prescription établie. Le singulier collectif accompagné de כָּל renvoie à l’ensemble des règles prescrites pour la Pâque; le pluriel français est plus naturel et en restitue la force globale.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: Ils célébreront la Pâque
  rationale: Avec une fête ou un rite pour complément, עשה peut signifier « accomplir, observer, célébrer ». La répétition explicite de « la Pâque » évite un pronom français dont le genre différerait de celui du référent hébreu et clarifie naturellement l’action prescrite.
theological_decisions:
- issue: Portée intertextuelle de l’interdiction de briser un os
  choice: Présenter directement cette clause comme une prescription de la Pâque, sans introduire dans le texte principal une interprétation christologique ultérieure.
  alternative: Employer une formulation destinée à mettre en avant l’accomplissement évoqué plus tard dans le Nouveau Testament.
  rationale: Dans son contexte immédiat, le verset réglemente la célébration de la Pâque. La traduction doit préserver ce sens premier; le rapprochement canonique peut être signalé en note sans être incorporé au texte.
translation_notes:
  register: Français international moderne, clair et digne. « La Pâque » conserve le terme biblique traditionnel; « célébrer » et « prescriptions » rendent le langage rituel de façon naturelle sans technicité excessive.
