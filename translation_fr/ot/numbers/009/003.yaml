  text: בְּ/אַרְבָּעָ֣ה עָשָֽׂר י֠וֹם בַּ/חֹ֨דֶשׁ הַ/זֶּ֜ה בֵּ֧ין הָֽ/עֲרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖/וֹ בְּ/מוֹעֲד֑/וֹ כְּ/כָל חֻקֹּתָ֥י/ו וּ/כְ/כָל מִשְׁפָּטָ֖י/ו תַּעֲשׂ֥וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: fr
  text: Le quatorzième jour de ce mois, entre les deux soirs[a], vous la célébrerez au moment fixé. Vous la célébrerez conformément à toutes les prescriptions et à toutes les règles qui s’y rapportent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les deux soirs », expression hébraïque traditionnelle désignant la période autour du crépuscule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: Le quatorzième jour de ce mois
  rationale: Cette formulation rend naturellement en français l’expression calendaire hébraïque tout en conservant sa précision.
- source_word: בֵּין הָעַרְבַּיִם
  choice: entre les deux soirs
  rationale: Cette expression traditionnelle conserve la formulation technique et l’ambiguïté temporelle de l’hébreu, plutôt que de la réduire à une interprétation unique comme « au crépuscule ».
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: vous la célébrerez
  rationale: Avec la Pâque comme objet implicite dans le contexte, עשה signifie ici accomplir ou célébrer la fête. Le pronom féminin correspond au genre de « la Pâque » en français, et la répétition du syntagme est conservée.
- source_word: בְּמוֹעֲדוֹ
  choice: au moment fixé
  rationale: מוֹעֵד désigne ici le moment déterminé pour la célébration cultuelle. « Au moment fixé » est précis et idiomatique en français moderne.
- source_word: כְּכָל חֻקֹּתָיו
  choice: conformément à toutes les prescriptions
  rationale: חֻקּוֹת désigne des dispositions prescrites. « Prescriptions » garde la force normative sans adopter un registre juridique inutilement archaïque.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: et à toutes les règles qui s’y rapportent
  rationale: מִשְׁפָּטִים désigne ici les règles ou ordonnances régissant la Pâque. La relative rend clairement en français la valeur des suffixes hébreux sans suggérer que la fête elle-même possède ces règles.
