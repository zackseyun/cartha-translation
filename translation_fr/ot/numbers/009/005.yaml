  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: fr
  text: Ils célébrèrent la Pâque le quatorzième jour du premier mois, au crépuscule[a], dans le désert du Sinaï ; conformément à tout ce que Yahweh avait ordonné à Moïse, les fils d’Israël firent ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les deux soirs » ; expression hébraïque désignant la période du crépuscule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: Ils célébrèrent la Pâque
  rationale: Avec « la Pâque », le verbe עשה désigne ici l’accomplissement ou la célébration du rite. « Célébrèrent » exprime naturellement cet emploi idiomatique sans réduire la Pâque au seul sacrifice.
- source_word: בָּרִאשׁוֹן בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: le quatorzième jour du premier mois
  rationale: Le mot « mois » est implicite après « premier » en hébreu et doit être explicité en français. La formulation conserve clairement la date du calendrier.
- source_word: בֵּין הָעַרְבַּיִם
  choice: au crépuscule
  rationale: Cette expression hébraïque signifie littéralement « entre les deux soirs » et désigne la période du crépuscule. La traduction naturelle figure dans le texte, et la forme littérale est signalée en note.
- source_word: בְּמִדְבַּר סִינָי
  choice: dans le désert du Sinaï
  rationale: מִדְבָּר désigne une région aride ou sauvage. « Désert du Sinaï » est la formulation française courante et convient au contexte géographique.
- source_word: כְּכֹל אֲשֶׁר צִוָּה ... כֵּן עָשׂוּ
  choice: agirent conformément à tout ce que ... avait ordonné
  rationale: Cette formulation rend l’idée de pleine conformité au commandement tout en produisant une phrase française fluide. Le plus-que-parfait marque que l’ordre avait précédé son exécution.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression filiale et masculine de l’hébreu, employée collectivement pour le peuple d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Portée collective de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: La formulation retenue reflète explicitement l’expression masculine et filiale de la source, tout en gardant son sens collectif.
- issue: Portée de הַפֶּסַח
  choice: la Pâque comme observance
  alternative: le sacrifice de la Pâque
  rationale: Dans ce contexte, le terme peut englober l’observance pascale et ne doit pas être limité sans nécessité au seul animal sacrifié.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée pour éviter une répétition maladroite du verbe « faire », tout en conservant l’idée d’obéissance complète. Le terme traditionnel « Pâque » et l’expression source « fils d’Israël » sont maintenus.
