source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: fr
  text: Le jour où le tabernacle fut dressé, la nuée couvrit le tabernacle, la tente du Témoignage[a] ; le soir, elle était au-dessus du tabernacle et avait l’apparence du feu, jusqu’au matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tente de l’Attestation ». Le terme hébreu peut désigner un témoignage ou une attestation ; « Témoignage » est retenu comme terme cultuel traditionnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הָקִים אֶת הַמִּשְׁכָּן
  choice: Le jour où le tabernacle fut dressé
  rationale: La tournure temporelle hébraïque est rendue par une proposition française naturelle. Le passif évite d’ajouter un sujet que le texte source ne nomme pas.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme français consacré et intelligible pour le sanctuaire transportable du désert.
- source_word: כִּסָּה הֶעָנָן
  choice: la nuée couvrit
  rationale: « Couvrir » restitue directement le verbe, tandis que « la nuée » désigne naturellement en français biblique le phénomène divin connu dans ce récit.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: la tente du Témoignage
  rationale: L’expression est comprise comme une apposition qui précise l’identité du tabernacle. « Témoignage » maintient le terme cultuel traditionnel sans le réduire à une seule interprétation de son référent.
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: le soir, elle se tenait
  rationale: L’imparfait français exprime l’état habituel ou continu décrit par l’imparfait hébreu. Le pronom reprend naturellement « la nuée ».
- source_word: עַל הַמִּשְׁכָּן
  choice: au-dessus du tabernacle
  rationale: Cette formulation rend clairement la position de la nuée sans suggérer nécessairement un contact physique.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: avec l’apparence d’un feu
  rationale: 'La formulation conserve la distinction du texte entre le phénomène observé et le feu lui-même : il avait une apparence comparable à celle d’un feu.'
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Équivalent temporel direct et idiomatique en français.
theological_decisions:
- issue: Rapport entre « le tabernacle » et « la tente du Témoignage »
  choice: 'Apposition : la seconde expression identifie la première'
  alternative: Comprendre le לְ comme introduisant une nuance locale ou directionnelle distincte
  rationale: Dans ce contexte, la syntaxe s’explique le plus naturellement comme une précision appositionnelle, sans faire de la tente un second objet séparé.
- issue: Nature du phénomène nocturne
  choice: Conserver une comparaison d’apparence avec le feu
  alternative: Identifier directement la nuée à un feu
  rationale: כְמַרְאֵה marque une ressemblance visuelle. La traduction ne doit donc pas affirmer que la nuée était littéralement du feu.
translation_notes:
  register: Français international moderne, digne et accessible. « Nuée » et « tabernacle » sont conservés comme termes bibliques établis. La phrase suit la progression temporelle de l’hébreu et préserve la comparaison visuelle avec le feu.
