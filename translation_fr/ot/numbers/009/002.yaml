  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: fr
  text: Et que les fils d’Israël célèbrent la Pâque au temps fixé pour elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites »; traditionnellement, « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: Que … célèbrent
  rationale: Avec « la Pâque » pour complément, le verbe עשה signifie idiomatiquement accomplir ou célébrer cette observance. La tournure « Que … célèbrent » rend naturellement en français la valeur injonctive de l’imparfait précédé de וְ.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et masculine littérale de l’hébreu, sans la généraliser silencieusement en « Israélites ».
- source_word: הַפָּסַח
  choice: la Pâque
  rationale: Le terme peut viser le sacrifice ou l’observance pascale dans son ensemble. « La Pâque » maintient cette amplitude sans préciser davantage que le verset.
- source_word: בְּמוֹעֲדוֹ
  choice: au temps fixé pour elle
  rationale: מוֹעֵד désigne ici le moment déterminé de l’observance; le pronom suffixe renvoie à la Pâque. Cette formulation préserve explicitement ce rapport.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Célébrer la Pâque » est idiomatique en français tout en gardant la portée rituelle du verbe; l’expression formelle « fils d’Israël » est conservée et expliquée en note.
