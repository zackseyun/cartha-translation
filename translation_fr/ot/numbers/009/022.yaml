id: NUM.9.22
reference: Numbers 9:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: fr
  text: Qu’il s’agisse de deux jours, d’un mois ou d’une période plus longue[a], tant que la nuée demeurait au-dessus du tabernacle, reposant sur lui, les Israélites restaient campés et ne partaient pas ; mais, lorsqu’elle s’élevait, ils partaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des jours ». Dans ce contexte, l’expression peut désigner une durée prolongée.'
    reason: Préserve la forme littérale du pluriel hébreu et signale prudemment son sens contextuel possible.
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: Que ce soit ... ou ... ou ...
  rationale: Cette tournure française naturelle conserve la série disjonctive qui présente diverses durées possibles.
- source_word: יֹמַיִם
  choice: deux jours
  rationale: La forme duelle désigne explicitement deux jours.
- source_word: חֹדֶשׁ
  choice: un mois
  rationale: Le nom a ici un sens indéfini dans l’énumération des durées.
- source_word: יָמִים
  choice: de nombreux jours
  rationale: Après « deux jours » et « un mois », le pluriel simple désigne vraisemblablement une durée prolongée. La traduction garde néanmoins l’image concrète des « jours » au lieu de l’effacer par une formulation abstraite.
- source_word: בְּהַאֲרִיךְ הֶעָנָן
  choice: aussi longtemps que la nuée demeurait
  rationale: Le hiphil de ארך exprime ici la prolongation du séjour de la nuée ; « aussi longtemps que » rend clairement la relation temporelle.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est un terme français biblique encore intelligible, qui distingue ce signe divin d’un nuage ordinaire.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Terme français établi pour le sanctuaire portatif, précis dans ce contexte.
- source_word: לִשְׁכֹּן עָלָיו
  choice: reposant sur lui
  rationale: Cette formulation exprime la présence stable de la nuée au-dessus du tabernacle sans produire en français la répétition peu naturelle « demeurant sur lui ».
- source_word: יַחֲנוּ בְנֵי יִשְׂרָאֵל
  choice: les Israélites restaient campés
  rationale: « Les Israélites » rend naturellement l’expression collective בְנֵי יִשְׂרָאֵל, et l’imparfait décrit leur conduite habituelle tant que la nuée demeurait en place.
- source_word: וְלֹא יִסָּעוּ
  choice: et ne partaient pas
  rationale: Dans ce contexte de déplacement du camp, נסע signifie se mettre en route ou lever le camp ; « partir » est clair et naturel.
- source_word: וּבְהֵעָלֹתוֹ יִסָּעוּ
  choice: mais quand elle s’élevait, ils partaient
  rationale: Le contraste appelle naturellement « mais ». Le suffixe renvoie à la nuée ; « s’élevait » conserve l’image sans préciser un agent que l’hébreu ne nomme pas.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Nuée » et « tabernacle » sont conservés comme termes bibliques établis ; la syntaxe reste fluide et le parallélisme entre rester campé et partir est maintenu.
