revisions:
- from: Que ce soit deux jours, un mois ou de nombreux jours[a], aussi longtemps que la nuée demeurait au-dessus du tabernacle, reposant sur lui, les Israélites restaient campés et ne partaient pas ; mais quand elle s’élevait, ils partaient.
  to: Qu’il s’agisse de deux jours, d’un mois ou d’une période plus longue[a], tant que la nuée demeurait au-dessus du tabernacle, reposant sur lui, les Israélites restaient campés et ne partaient pas ; mais, lorsqu’elle s’élevait, ils partaient.
  rationale: La révision remplace une interprétation quantitative (« de nombreux jours ») par une formulation française qui rend la durée prolongée suggérée par le contexte sans éliminer l’ambiguïté lexicale, laquelle est conservée dans la note. Le reste de la formulation est maintenu, y compris « lorsqu’elle s’élevait », qui ne spécifie pas l’agent du relèvement de la nuée.
