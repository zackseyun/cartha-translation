    reason: Préserve la forme littérale du pluriel hébreu et signale prudemment son sens contextuel possible.
  revision_rationale: La révision remplace une interprétation quantitative (« de nombreux jours ») par une formulation française qui rend la durée prolongée suggérée par le contexte sans éliminer l’ambiguïté lexicale, laquelle est conservée dans la note. Le reste de la formulation est maintenu, y compris « lorsqu’elle s’élevait », qui ne spécifie pas l’agent du relèvement de la nuée.
