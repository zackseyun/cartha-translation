base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: fr
  text: 'Ces hommes lui dirent : « Nous sommes impurs à cause d’un cadavre humain[a]. Pourquoi serions-nous empêchés de présenter l’offrande de Yahweh au temps fixé parmi les Israélites[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « impurs à cause de l’âme d’un homme » ; dans ce contexte, cette expression désigne l’impureté rituelle liée à un cadavre humain.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « au milieu des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים הָהֵמָּה
  choice: Ces hommes
  rationale: Le nom accompagné du démonstratif désigne avec insistance les hommes déjà mentionnés ; « ces hommes » est naturel en français.
- source_word: טְמֵאִים
  choice: impurs
  rationale: Le terme désigne ici l’impureté rituelle ; « impurs » est le terme français courant dans ce contexte cultuel.
- source_word: לְנֶפֶשׁ אָדָם
  choice: à cause du cadavre d’un homme
  rationale: Dans ce contexte juridique et rituel, l’expression hébraïque désigne l’impureté contractée en rapport avec un cadavre humain. Cette formulation rend l’idiome sans ajouter explicitement une notion de contact absente de la phrase.
- source_word: נִגָּרַע לְבִלְתִּי הַקְרִב
  choice: serions-nous empêchés de présenter
  rationale: Le niphal de גרע exprime ici l’exclusion ou la privation, et הקריב signifie présenter une offrande dans le vocabulaire sacrificiel.
- source_word: קָרְבַּן יְהוָה
  choice: l’offrande de Yahweh
  rationale: קָרְבָּן désigne ce qui est présenté à Dieu comme offrande, et le nom divin est conservé sous la forme « Yahweh ».
- source_word: בְּמֹעֲדוֹ
  choice: au temps fixé
  rationale: מוֹעֵד désigne ici le moment prescrit pour cette offrande ; « au temps fixé » est précis et idiomatique.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: avec les Israélites
  rationale: Littéralement « au milieu des fils d’Israël » ; dans cette demande de participation collective, « avec les Israélites » restitue naturellement le sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël ; « Yahweh » le distingue d’un simple titre.
- issue: Nature de l’impureté exprimée par לְנֶפֶשׁ אָדָם
  choice: à cause du cadavre d’un homme
  alternative: à cause d’un mort / par contact avec un cadavre humain
  rationale: L’expression est un idiome d’impureté liée à un cadavre. Le rendu choisi conserve le référent humain et évite de préciser dans le texte principal un mode de contact que le verset ne formule pas explicitement.
- issue: Portée de נִגָּרַע
  choice: empêchés
  alternative: exclus
  rationale: Le verbe peut évoquer le fait d’être retranché, privé ou exclu. « Empêchés » préserve ici la question ouverte sur la participation au rite sans durcir le sens en exclusion institutionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation directe conserve le ton de protestation respectueuse des hommes. « Israélites » est préféré dans le texte courant à la traduction littérale « fils d’Israël », signalée en note.
