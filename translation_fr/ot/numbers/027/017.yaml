base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: fr
  text: qui sortira devant eux et entrera devant eux[a], qui les fera sortir et les fera entrer[b], afin que l’assemblée de Yahweh[c] ne soit pas comme des brebis qui n’ont pas de berger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à leur tête », dans les deux occurrences.'
    reason: lexical_alternative
  - marker: b
    text: La suite « sortir… entrer… les faire sortir… les faire entrer » est une manière hébraïque de décrire l’ensemble des responsabilités d’un dirigeant public.
    reason: cultural_note
  - marker: c
    text: 'Ou : « la communauté de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֵא ... יָבֹא
  choice: sortira ... rentrera
  rationale: Les deux imparfaits décrivent ici l’action attendue du futur dirigeant. « Sortir » et « rentrer » conservent le parallélisme concret et l’expression hébraïque englobant l’exercice de la direction publique.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Cette traduction garde le sens spatial de l’hébreu et suggère naturellement que le dirigeant marche à la tête du peuple, sans réduire l’expression à une interprétation abstraite.
- source_word: יוֹצִיאֵם ... יְבִיאֵם
  choice: les fera sortir ... les fera rentrer
  rationale: Les formes causatives sont rendues explicitement et reprennent les verbes précédents, ce qui préserve la structure soigneusement parallèle de l’hébreu.
- source_word: עֲדַת יְהוָה
  choice: l’assemblée de Yahweh
  rationale: « Assemblée » exprime le peuple constitué et réuni, tandis que « Yahweh » représente directement le nom divin יהוה.
- source_word: כַצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: comme des brebis qui n’ont pas de berger
  rationale: Le collectif צֹאן est rendu naturellement par « des brebis » en français, et l’image pastorale est conservée sans l’interpréter abstraitement.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de la séquence « sortir… rentrer… faire sortir… faire rentrer »
  choice: Conserver les mouvements concrets et leur parallélisme
  alternative: Paraphraser par « diriger » ou « guider en toute chose »
  rationale: La formule évoque une direction complète du peuple et prépare l’image du berger, mais le texte l’exprime par des verbes concrets qu’il convient de préserver.
- issue: Image du troupeau sans berger
  choice: Conserver littéralement l’image des brebis et du berger
  alternative: Expliciter par « un peuple sans dirigeant »
  rationale: La métaphore appartient au texte et porte sa force politique et pastorale sans qu’il soit nécessaire de la résoudre en langage abstrait.
translation_notes:
  register: 'Français international moderne, simple et digne. La répétition des verbes est volontaire : elle reproduit le parallélisme hébreu et relie l’action personnelle du dirigeant à sa conduite du peuple.'
