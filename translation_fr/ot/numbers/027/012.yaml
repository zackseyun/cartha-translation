source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Monte sur cette montagne des Abarim[a] et regarde le pays que j’ai donné aux Israélites[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cette montagne des Abarim ». On peut aussi comprendre : « ce mont des Abarim » ou « ce mont Abarim ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « aux fils d’Israël » ; autre traduction possible : « au peuple d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw narratif fait progresser le récit ; « Puis » rend naturellement cette succession en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה exprime ici le déplacement vers un lieu élevé ; « Monte » est direct et naturel.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: cette montagne des Abarim
  rationale: Cette formulation conserve le démonstratif et reflète l’expression construite hébraïque, tout en traitant Abarim comme un nom géographique.
- source_word: וּרְאֵה
  choice: et regarde
  rationale: L’impératif invite Moïse à porter son regard sur le pays ; « regarde » convient mieux en français dans une injonction que le simple « vois ».
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, « le pays » est idiomatique en français et désigne la terre accordée à Israël.
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Le passé composé rend l’accompli hébreu comme un don établi dont les effets demeurent.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: L’expression signifie littéralement « aux fils d’Israël », mais fonctionne comme une désignation collective du peuple ; « aux Israélites » est exact, naturel et non ambigu en français.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: « Yahweh » préserve le nom propre présent dans le texte hébreu sans le remplacer par un titre ni privilégier la forme tardive « Jéhovah ».
- issue: Rendu collectif de בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  alternative: aux fils d’Israël ; au peuple d’Israël
  rationale: Dans cette formule ethnique, le masculin « fils » désigne collectivement les membres d’Israël. « Aux Israélites » communique cette portée inclusive et collective sans ajouter de distinction théologique de genre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu sans devenir raide ; les deux impératifs sont conservés et les variantes littérales importantes sont signalées en notes.
