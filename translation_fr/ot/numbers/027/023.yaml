  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: fr
  text: Il posa ses mains sur lui et lui donna des ordres[a], comme Yahvé l’avait dit par l’intermédiaire de Moïse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui donna des instructions ». Le verbe hébreu signifie ordonner ou donner des instructions; dans ce contexte, il accompagne aussi l’établissement officiel de Josué dans sa mission.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de Moïse », expression hébraïque signifiant que Yahvé a parlé par l’intermédiaire de Moïse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: Il posa ses mains sur lui
  rationale: Le verbe סמך accompagné de « mains » désigne ici le geste d’imposition des mains. « Posa ses mains sur lui » restitue naturellement l’action rituelle et conserve le pluriel du texte hébreu.
- source_word: וַיְצַוֵּהוּ
  choice: lui donna ses ordres
  rationale: Le verbe צוה signifie fondamentalement « ordonner, donner des instructions ». Dans ce contexte d’investiture, il peut aussi évoquer la charge officiellement confiée à Josué; la traduction retient le sens lexical direct tout en signalant la nuance contextuelle en note.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » exprime clairement la conformité de l’action de Moïse à la parole antérieure de Yahvé, sans alourdir la phrase.
- source_word: דִּבֶּר
  choice: avait dit
  rationale: Le plus-que-parfait marque naturellement en français que la parole de Yahvé précède l’action racontée. « Dire » convient ici à l’énoncé divin auquel Moïse se conforme.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme « Yahvé » représente en français moderne le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: L’expression hébraïque signifie littéralement « par la main de Moïse » et présente Moïse comme l’agent par lequel Yahvé a parlé. L’équivalent idiomatique français communique clairement cette médiation.
theological_decisions:
- issue: Sens de צוה lors de l’établissement de Josué
  choice: lui donna ses ordres
  alternative: l’investit de sa mission / lui confia sa charge
  rationale: Le contexte est celui de l’installation publique de Josué, mais le verbe garde son sens ordinaire d’ordonner ou de donner des instructions. La traduction évite de remplacer ce sens par un terme institutionnel plus précis que l’hébreu, tout en faisant connaître la nuance d’investiture dans la note.
- issue: Médiation exprimée par בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  alternative: par la main de Moïse
  rationale: La formulation idiomatique française conserve l’idée que Yahvé parle au moyen de Moïse, sans laisser entendre que la main physique de Moïse est en cause.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le geste concret de l’imposition des mains, le nom divin « Yahvé » et l’ambiguïté contextuelle du verbe צוה, sans introduire un vocabulaire confessionnel d’ordination.
