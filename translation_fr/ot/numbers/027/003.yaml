id: NUM.27.3
reference: Numbers 27:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: fr
  text: Notre père est mort dans le désert. Il ne faisait pas partie de l’assemblée de ceux qui s’étaient ligués contre Yahweh avec le groupe de Coré ; il est mort à cause de son propre péché[a], sans avoir de fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans son propre péché ». L’hébreu ne précise pas de quel péché il s’agissait, mais distingue sa mort de la révolte de Coré.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: Notre père
  rationale: Les filles parlent directement de leur père ; le sens familial précis convient au contexte.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme naturel en français moderne pour le cadre des pérégrinations d’Israël, sans exiger l’idée d’une étendue entièrement aride.
- source_word: בְּתוֹךְ הָעֵדָה
  choice: partie de l’assemblée
  rationale: Rend idiomatiquement l’idée d’être au milieu ou au nombre de la communauté concernée.
- source_word: הַנּוֹעָדִים עַל יְהוָה
  choice: ceux qui s’étaient ligués contre Yahweh
  rationale: Le participe niphal exprime ici un rassemblement collectif hostile ; « se liguer » communique naturellement cette nuance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בַּעֲדַת קֹרַח
  choice: avec le groupe de Coré
  rationale: Désigne la faction associée à Coré tout en évitant la répétition d’« assemblée ».
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: il est mort à cause de son propre péché
  rationale: Dans ce contexte contrastif, בְ peut indiquer la cause ; « propre » marque que le péché était le sien, sans en préciser la nature.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: sans avoir de fils
  rationale: Formulation française idiomatique qui conserve la référence précise aux descendants masculins, essentielle au contexte successoral.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel divin ; sa translittération le distingue d’un titre.
- issue: Rapport entre la faute personnelle et la révolte de Coré
  choice: à cause de son propre péché
  alternative: dans son péché
  rationale: 'La formulation maintient la distinction affirmée par les filles : leur père n’appartenait pas au groupe de Coré, mais il est néanmoins mort en rapport avec son propre péché. Elle ne précise ni la faute ni les circonstances au-delà du texte.'
translation_notes:
  register: Français international moderne, digne et accessible. La segmentation en deux phrases allège la longue coordination hébraïque. « Se liguer » rend clairement l’hostilité du rassemblement, tandis que « groupe de Coré » évite une répétition lourde.
