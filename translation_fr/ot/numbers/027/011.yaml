  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: fr
  text: Et si son père n’a pas de frères, vous donnerez son héritage à son parent le plus proche de son clan, et celui-ci en prendra possession. Ce sera pour les fils d’Israël une règle de droit[a], comme Yahweh l’a ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une prescription juridique » ; littéralement, « un statut de jugement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים
  choice: frères
  rationale: 'Le sens familial direct convient à la succession légale exposée dans le passage : il s’agit des frères du père.'
- source_word: לְאָבִיו
  choice: son père
  rationale: La préposition hébraïque s’intègre idiomatiquement en français dans la construction « si son père n’a pas de frères ».
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: « Héritage » exprime clairement le bien transmis selon les règles successorales du contexte.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: à son plus proche parent
  rationale: שְׁאֵר désigne ici un parent par le sang, et הַקָּרֹב אֵלָיו précise qu’il s’agit du plus proche selon le degré de parenté.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: dans son clan
  rationale: מִשְׁפָּחָה désigne le groupe de parenté élargi au sein de l’organisation tribale d’Israël ; « clan » conserve cette portée sociale et juridique.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: et celui-ci en prendra possession
  rationale: Le verbe ירשׁ peut signifier hériter ou prendre possession. Cette formulation évite la répétition immédiate d’« héritage » tout en conservant le résultat juridique.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: La traduction garde la forme masculine du syntagme hébreu, qui fonctionne ici comme désignation collective et conventionnelle du peuple d’Israël.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: une règle de droit
  rationale: La formule désigne une prescription juridique durable. « Règle de droit » rend naturellement en français moderne l’association de חֻקָּה et מִשְׁפָּט sans en obscurcir la fonction légale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le tétragramme ; « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
- issue: Désignation collective לִבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le choix conserve l’expression masculine et généalogique de l’hébreu, comprise comme désignation collective de la nation.
- issue: Portée de לְחֻקַּת מִשְׁפָּט
  choice: une règle de droit
  alternative: une prescription juridique / un statut de jugement
  rationale: La formulation française exprime le caractère normatif et judiciaire de la disposition sans imposer une interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe juridique accessible. Le futur normatif (« vous donnerez », « ce sera ») préserve le ton législatif. Le marqueur [a] figure dans le texte principal.
