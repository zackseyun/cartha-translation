  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: fr
  text: 'Alors les filles de Tselofhad — fils de Héfer, fils de Galaad, fils de Makir, fils de Manassé, des clans de Manassé, fils de Joseph — s’approchèrent[a]. Voici les noms de ses filles : Mahla, Noa[b], Hogla, Milka et Tirsa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « s’avancèrent » ou « vinrent se présenter ». Il peut évoquer ici une démarche officielle, comme le montre la requête racontée dans les versets suivants.
    reason: lexical_alternative
  - marker: b
    text: Noa est ici le nom de l’une des filles de Tselofhad ; il ne s’agit pas de Noé, le personnage masculin du livre de la Genèse.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: s’approchèrent
  rationale: Le qal narratif à la 3e personne du féminin pluriel exprime le fait de s’avancer ou de venir auprès de quelqu’un. « S’approchèrent » reste naturel en français et laisse le contexte suivant préciser qu’il s’agit d’une démarche officielle.
- source_word: בְּנוֹת
  choice: les filles de
  rationale: Le construit désigne ici les filles au sens familial direct, comme le confirme la liste de leurs noms.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: fils de… fils de… fils de… fils de
  rationale: La répétition généalogique est conservée, car elle établit la lignée sur laquelle repose la question d’héritage.
- source_word: לְמִשְׁפְּחֹת
  choice: appartenait aux clans de
  rationale: Dans ce contexte tribal, מִשְׁפָּחָה désigne un clan. La préposition marque ici l’appartenance; la formulation française explicite cette relation sans réduire les clans à de simples familles nucléaires.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: Manassé, fils de Joseph
  rationale: La filiation demeure explicite afin de préserver le rattachement de la lignée à Joseph.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Voici les noms de ses filles
  rationale: Cette formule française rend naturellement la présentation hébraïque de la liste, le possessif renvoyant à Tselofhad.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milka et Tirsa
  rationale: Les noms propres sont transcrits selon des formes françaises claires et usuelles, sans identifier Noa au personnage masculin de la Genèse.
