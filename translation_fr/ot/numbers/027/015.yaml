lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … parla
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession narrative, et « parla » rend directement דבר.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: אֶל
  choice: à
  rationale: 'La préposition indique ici le destinataire de la parole : Moïse parle à Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du tétragramme, qui conserve le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: La formule infinitive introduit les paroles directes qui suivent. « En ces termes » remplit naturellement cette fonction en français sans alourdir la phrase par « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; YHWH
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve sa valeur de nom propre, tandis que la note signale le rendu traditionnel.
translation_notes:
  register: 'Français international moderne, sobre et digne. La tournure « en ces termes : » introduit naturellement le discours direct du verset suivant tout en reflétant לֵאמֹר.'
