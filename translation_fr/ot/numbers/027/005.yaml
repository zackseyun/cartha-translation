  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: fr
  text: Moïse présenta donc leur cause devant Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soumit leur requête juridique à Yahweh ».'
    reason: Alternative lexicale soulignant le caractère formel et juridique de מִשְׁפָּט et de וַיַּקְרֵב.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: présenta
  rationale: Le hifil de קרב signifie « faire approcher » ou, dans ce contexte juridique, « présenter ». « Présenta » exprime naturellement la démarche formelle de Moïse auprès de Yahweh.
- source_word: מִשְׁפָּטָן
  choice: leur cause
  rationale: מִשְׁפָּט peut désigner un jugement, un droit à faire valoir ou une affaire judiciaire. Ici, le terme renvoie à la demande successorale des filles de Tselofhad ; « leur cause » conserve cette portée juridique sans préjuger de la décision.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le terme signifie « devant » ou « en présence de ». « Devant » est concis et convient à la présentation d'une cause à celui qui doit trancher.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַ
  choice: donc
  rationale: Le waw fait progresser le récit et présente l'action de Moïse comme la suite de la requête précédente ; « donc » rend clairement ce lien en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve la valeur de nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste naturelle tout en conservant le cadre judiciaire du passage et le nom divin.
