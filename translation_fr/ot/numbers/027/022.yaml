  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: fr
  text: 'Moïse fit ce que Yahweh lui avait ordonné : il prit Josué et le plaça[a] devant le prêtre Éléazar et devant toute la communauté.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fit se tenir devant » ; le verbe hébreu peut aussi se traduire par « le présenta ».
    reason: Le causatif de עמד peut exprimer le fait de faire tenir quelqu’un debout, de le placer ou de le présenter publiquement.
lexical_decisions:
- source_word: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: Moïse fit ce que Yahweh lui avait ordonné
  rationale: Cette formulation naturelle exprime fidèlement l’obéissance de Moïse au commandement divin antérieur; le plus-que-parfait marque clairement l’antériorité de l’ordre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: il prit Josué
  rationale: « Prendre » conserve le sens direct de לקח et convient au contexte où Moïse conduit Josué à sa présentation publique.
- source_word: וַיַּעֲמִדֵהוּ
  choice: le plaça
  rationale: Le causatif de עמד signifie faire tenir debout ou placer quelqu’un. « Le plaça » est naturel en français et préserve le caractère concret sans imposer la nuance plus interprétative de « présenta ».
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » rend de façon concise la présence publique de Josué face à Éléazar et à la communauté.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Traduction directe du titre d’Éléazar.
- source_word: כָּל־הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble de la communauté d’Israël; cette formulation est actuelle, claire et moins susceptible d’évoquer exclusivement une assemblée cultuelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure narrative du verset tout en évitant une tournure trop littérale. Le marqueur [a] figure immédiatement après « communauté », conformément à la portée de la note.
