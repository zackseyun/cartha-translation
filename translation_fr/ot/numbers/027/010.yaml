source:
  edition: WLC
  text: וְ/אִם אֵ֥ין ל֖/וֹ אַחִ֑ים וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לַ/אֲחֵ֥י אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: fr
  text: Mais s’il n’a pas de frères, vous donnerez son héritage aux frères de son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « à ses oncles paternels ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction suivie de la particule conditionnelle introduit le cas suivant dans une série juridique. « Mais si » marque naturellement la progression contrastive tout en conservant la condition.
- source_word: אֵין לוֹ
  choice: il n’a pas de
  rationale: La négation existentielle hébraïque avec ל et suffixe pronominal exprime ici la possession négative; cette tournure est idiomatique en français.
- source_word: אַחִים
  choice: frères
  rationale: Le pluriel masculin désigne littéralement des frères et, dans cette loi successorale, des héritiers masculins de même génération.
- source_word: וּנְתַתֶּם
  choice: vous donnerez
  rationale: La deuxième personne du pluriel poursuit la prescription juridique adressée à la collectivité ou à ses responsables. Le futur français a ici une valeur normative naturelle.
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: Dans ce contexte juridique, נַחֲלָה désigne le patrimoine transmis ou la possession héréditaire; « héritage » est clair et traditionnel sans être archaïque.
- source_word: לַאֲחֵי אָבִיו
  choice: aux frères de son père
  rationale: Cette formulation conserve directement la structure familiale du syntagme hébreu. « À ses oncles paternels » serait plus idiomatique, mais légèrement plus interprétatif.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure juridique hébraïque; le futur « vous donnerez » porte naturellement la force prescriptive. Le marqueur de note est placé après le syntagme qu’il explicite.
