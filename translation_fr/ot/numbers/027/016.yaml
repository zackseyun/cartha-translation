  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: fr
  text: Que Yahweh[a], le Dieu des esprits de toute chair[b], établisse un homme à la tête de la communauté[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que le SEIGNEUR, le Dieu des esprits de toute chair, établisse un homme à la tête de la communauté. »'
    reason: lexical_alternative
  - marker: b
    text: « Toute chair » est une expression hébraïque qui désigne ici l’ensemble des êtres humains dans leur condition de créatures mortelles.
    reason: cultural_note
  - marker: c
    text: 'Ou : « à la tête de l’assemblée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: établisse
  rationale: Dans ce contexte, פקד désigne l’acte de désigner quelqu’un pour exercer une responsabilité. « Établir à la tête de » exprime naturellement en français la nomination à une fonction de direction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », plutôt que remplacé par le titre « le Seigneur ».
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: le Dieu des esprits
  rationale: La formulation conserve le titre hébreu distinctif et son pluriel, sans préciser davantage ce que recouvre ici « esprits ».
- source_word: לְכָל בָּשָׂר
  choice: de toute chair
  rationale: La tournure hébraïque est conservée afin de préserver sa texture biblique et l’idée des êtres humains dans leur condition de créatures mortelles.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et désigne, dans le contexte, l’homme appelé à succéder à Moïse.
- source_word: עַל הָעֵדָה
  choice: à la tête de la communauté
  rationale: עֵדָה désigne ici la communauté d’Israël. La locution « à la tête de » rend idiomatiquement la relation d’autorité exprimée par עַל.
theological_decisions:
- issue: Expression de la demande avec le nom divin
  choice: Que Yahweh… établisse…
  alternative: Que le Seigneur… établisse…
  rationale: La forme française exprime la valeur de souhait ou de demande du yiqtol hébreu, tout en conservant le nom propre divin.
- issue: Portée de « toute chair »
  choice: Conserver l’expression « toute chair »
  alternative: Rendre explicitement par « tous les êtres humains »
  rationale: La formulation littérale maintient l’anthropologie et l’ambiguïté de l’idiome hébreu; une note en indique le sens probable dans ce contexte.
- issue: Genre de אִישׁ
  choice: un homme
  alternative: quelqu’un
  rationale: Le masculin explicite du texte et le contexte de la succession de Moïse sont conservés sans neutralisation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte, comme dans la source, puisqu’elle se poursuit au verset suivant. « Communauté » est plus courant en français contemporain que « congrégation », tandis que la note conserve l’alternative « assemblée ».
