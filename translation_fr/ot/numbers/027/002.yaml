  variant: modern international French
source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: fr
  text: 'Elles se tinrent devant Moïse, devant le prêtre Éléazar, devant les responsables et devant toute la communauté, à l’entrée de la tente de la Rencontre, et dirent :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: Elles se tinrent
  rationale: Le wayyiqtol féminin pluriel de עמד décrit les filles qui prennent place dans un cadre public et officiel. « Se tinrent » conserve ce sens formel sans ajouter l’idée explicite de présentation.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » rend directement la préposition répétée et maintient la solennité de la comparution publique devant les autorités et la communauté.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: le prêtre Éléazar
  rationale: Cette formulation française naturelle conserve exactement le titre sacerdotal du texte, sans l’élargir à « grand prêtre ».
- source_word: הַנְּשִׂיאִם
  choice: les responsables
  rationale: Dans ce contexte, נְשִׂיאִים désigne les dirigeants officiels de la communauté. « Responsables » est actuel et évite le sens dynastique que pourrait suggérer « princes ».
- source_word: כָל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble de la communauté d’Israël réunie. « Communauté » est clair en français moderne et garde la dimension collective du terme.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la Rencontre
  rationale: « À l’entrée » rend naturellement פֶּתַח. « Tente de la Rencontre » traduit l’expression cultuelle אֹהֶל מוֹעֵד selon un usage français biblique clair et établi.
- source_word: לֵאמֹר
  choice: 'et dirent :'
  rationale: Bien que la forme hébraïque soit littéralement « en disant », le français introduit plus naturellement le discours direct par un verbe conjugué. Le sens et le lien avec le verset suivant sont préservés.
theological_decisions:
- issue: Cadre public et juridique de la requête
  choice: Conserver la répétition de « devant » et l’énumération complète
  alternative: Alléger la phrase en regroupant les autorités et la communauté
  rationale: La structure souligne que les femmes présentent publiquement leur cause devant Moïse, le prêtre, les responsables et toute la communauté. La conserver maintient le poids juridique et communautaire de la scène.
- issue: Sens de עֵדָה
  choice: toute la communauté
  alternative: toute l’assemblée
  rationale: Les deux traductions sont possibles, mais « communauté » exprime bien ici le corps collectif d’Israël sans réduire le terme au seul fait d’être réuni.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe répétitive de l’hébreu est largement conservée pour faire ressortir la solennité de la comparution, tandis que לֵאמֹר est rendu idiomatiquement par « et dirent : ».'
