  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: fr
  text: 'Il se tiendra devant Éléazar, le prêtre, qui consultera pour lui, selon le jugement des Ourim, devant Yahvé[a]. Sur son ordre, ils sortiront, et sur son ordre, ils rentreront : lui-même, tous les fils d’Israël avec lui[b], et toute l’assemblée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « selon la décision des Ourim ». Il s’agit d’une consultation sacerdotale pratiquée devant Yahvé au moyen des Ourim.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Israël », c’est-à-dire les Israélites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: devant
  rationale: 'Le terme garde ici son sens spatial et relationnel courant : Josué doit se tenir devant le prêtre Éléazar.'
- source_word: יַעֲמֹד
  choice: il se tiendra
  rationale: L’imparfait hébreu a une valeur directive dans le contexte de l’investiture; le futur français conserve cette force avec un ton digne et naturel.
- source_word: וְשָׁאַל לוֹ
  choice: qui consultera pour lui
  rationale: Le sujet implicite est Éléazar, qui effectue la consultation en faveur de Josué. La relative explicite le changement naturel de sujet sans ajouter un nouvel acteur.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: au moyen de la décision des Ourim
  rationale: מִשְׁפָּט désigne ici la décision ou la procédure décisionnelle obtenue par la consultation sacerdotale. « Ourim » est conservé comme terme technique translittéré.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est rendu par sa translittération française usuelle plutôt que remplacé par un titre.
- source_word: עַל פִּיו
  choice: sur son ordre
  rationale: L’expression signifie littéralement « selon sa bouche » et indique une directive faisant autorité. Le pronom singulier est maintenu afin de ne pas trancher excessivement son référent immédiat.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: ils sortiront ... ils rentreront
  rationale: Cette paire idiomatique décrit les mouvements du peuple sous la conduite de son chef, possiblement dans un cadre militaire. La formulation française reste proche de l’image hébraïque tout en étant compréhensible.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation reproduit l’expression hébraïque traditionnelle; une équivalence idiomatique inclusive est donnée en note.
- source_word: הָעֵדָה
  choice: l’assemblée
  rationale: Dans le Pentateuque, le mot désigne collectivement la communauté d’Israël, notamment en tant que corps rassemblé. « Assemblée » convient au registre institutionnel et communautaire du passage.
theological_decisions:
- issue: Référent du pronom dans « sur son ordre »
  choice: Conserver le pronom masculin singulier sans identifier explicitement son référent.
  alternative: Préciser qu’il s’agit de l’ordre d’Éléazar, de Josué ou de la directive divine transmise par la consultation.
  rationale: La syntaxe hébraïque est condensée et laisse ouverte la relation immédiate entre la décision divine, la médiation sacerdotale d’Éléazar et le commandement exercé par Josué. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve la portée directive du contexte. Les termes cultuels « Ourim » et le nom « Yahvé » sont maintenus; la syntaxe reste lisible sans effacer l’ambiguïté du pronom d’autorité.
