  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: fr
  text: Quand tu l’auras vue, toi aussi, tu seras recueilli auprès des tiens[a], comme Aaron, ton frère, l’a été.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « tu mourras » ou « tu rejoindras tes ancêtres ». L’expression hébraïque signifie littéralement « être recueilli auprès de ton peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה אֹתָהּ
  choice: Quand tu l’auras vu
  rationale: Le verbe Qal à la 2e personne du masculin singulier, suivi du pronom objet féminin renvoyant au pays évoqué dans le contexte, marque ici la succession temporelle. Le futur antérieur rend naturellement en français l’action achevée avant celle qui suit.
- source_word: וְנֶאֱסַפְתָּ אֶל עַמֶּיךָ
  choice: tu seras recueilli auprès des tiens
  rationale: Le niphal de אסף est conservé sous forme passive afin de préserver l’image hébraïque de la mort comme rassemblement auprès de son peuple. « Auprès des tiens » exprime naturellement עמיך sans limiter explicitement le sens aux seuls ancêtres.
- source_word: גַּם אָתָּה
  choice: toi aussi
  rationale: Cette formulation garde l’insistance du pronom indépendant et souligne que Moïse partagera le sort d’Aaron.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit simplement et clairement le parallèle entre le sort de Moïse et celui d’Aaron.
- source_word: נֶאֱסַף
  choice: l’a été
  rationale: La reprise pronominale évite en français la répétition lourde de « recueilli », tout en maintenant le même passif et le parallèle avec la proposition précédente.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Aaron, ton frère
  rationale: Le nom suit l’usage français courant et le lien familial est conservé dans une apposition naturelle.
theological_decisions:
- issue: Expression funéraire אסף אל־עמיו
  choice: Conserver l’image par « être recueilli auprès des siens »
  alternative: mourir ; rejoindre ses ancêtres ; être réuni à son peuple
  rationale: L’hébreu emploie une expression conventionnelle qui évoque la mort tout en portant une résonance familiale et communautaire. La formulation retenue préserve cette richesse sans imposer une doctrine précise de l’au-delà.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur antérieur rend la séquence des actions avec naturel. « Recueilli auprès des tiens » conserve l’idiome funéraire et son caractère évocateur, tandis que la note en explicite le sens.
