  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֣ישׁ כִּֽי יָמ֗וּת וּ/בֵן֙ אֵ֣ין ל֔/וֹ וְ/הַֽעֲבַרְתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/בִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: fr
  text: 'Tu diras aux fils d’Israël[a] : « Si un homme meurt sans avoir de fils, vous transmettrez son héritage à sa fille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « aux enfants d’Israël ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: L’expression hébraïque signifie littéralement « fils d’Israël ». Cette formulation familiale masculine est conservée dans le texte, tandis que l’équivalent collectif idiomatique « Israélites » est signalé en note.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: 'Tu diras … :'
  rationale: 'La combinaison דבר + לאמר est une formule d’introduction du discours. En français actuel, « Tu diras … : » en exprime naturellement la fonction sans reproduire le pléonasme hébraïque.'
- source_word: אִישׁ
  choice: un homme
  rationale: Le substantif masculin singulier introduit ici un cas juridique. « Un homme » respecte la forme et le contexte de la loi successorale.
- source_word: כִּי יָמוּת
  choice: Si un homme meurt
  rationale: Dans la formulation casuistique d’une loi, כִּי suivi de l’inaccompli introduit une éventualité; « si » convient au français juridique naturel.
- source_word: וּבֵן אֵין לוֹ
  choice: sans avoir de fils
  rationale: Cette tournure française rend avec concision l’hébreu littéral « et il n’a pas de fils », tout en maintenant explicitement l’absence d’un héritier masculin.
- source_word: וְהַעֲבַרְתֶּם
  choice: vous transmettrez
  rationale: Le hiphil de עבר désigne ici le fait de faire passer juridiquement un patrimoine à une autre personne. « Transmettre » est naturel dans le domaine successoral et conserve la valeur administrative du verbe.
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: נַחֲלָה désigne ici le patrimoine héréditaire, notamment foncier. « Héritage » est clair et précis dans ce contexte.
- source_word: לְבִתּוֹ
  choice: à sa fille
  rationale: La préposition ל indique la bénéficiaire du transfert; « à sa fille » est l’équivalent direct et naturel.
