source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: fr
  text: parce que vous vous êtes rebellés contre mon ordre dans le désert de Tsîn, lors de la contestation de la communauté, en ne me faisant pas reconnaître comme saint[a] aux eaux, sous leurs yeux. Ce sont les eaux de Meriba de Qadesh[b], dans le désert de Tsîn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte littéralement une expression positive : « pour me faire reconnaître comme saint » ou « pour manifester ma sainteté ». Le contexte indique que Moïse et Aaron ont manqué à le faire.'
    reason: lexical_alternative
  - marker: b
    text: « Meriba de Qadesh » peut aussi être rendu par « la Contestation de Qadesh » ; Meriba signifie « contestation » ou « querelle ».
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: parce que
  rationale: Dans le contexte, la conjonction introduit la raison de l’exclusion de Moïse et d’Aaron. « Parce que » exprime clairement cette valeur causale.
- source_word: מְרִיתֶם
  choice: vous vous êtes rebellés
  rationale: Le verbe מרה désigne une rébellion ou une désobéissance ouverte envers une autorité. Cette formulation française est directe et naturelle.
- source_word: פִּי
  choice: mon ordre
  rationale: L’expression signifie littéralement « ma bouche », mais désigne ici ce que Dieu a ordonné. « Mon ordre » restitue naturellement l’idiome.
- source_word: בְּמִדְבַּר צִן
  choice: dans le désert de Tsîn
  rationale: מִדְבָּר désigne une région aride ou sauvage. « Désert » est naturel dans l’usage géographique biblique français, et Tsîn est conservé comme nom propre.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: lors de la contestation de la communauté
  rationale: מְרִיבָה évoque une querelle ou contestation, tandis que עֵדָה désigne ici la communauté d’Israël. La formulation identifie clairement l’épisode sans surinterprétation.
- source_word: לְהַקְדִּישֵׁנִי
  choice: en ne me faisant pas reconnaître comme saint
  rationale: Le hiphil de קדש exprime ici l’action de manifester ou faire reconnaître la sainteté de Dieu devant le peuple. La négation, implicite dans la relation avec « vous vous êtes rebellés », est explicitée pour que le français rende le sens contextuel.
- source_word: בַמַּיִם
  choice: près des eaux
  rationale: La préposition situe l’incident aux eaux en question. « Près des eaux » est idiomatique et évite de suggérer que l’action se déroule à l’intérieur de l’eau.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Cette expression conserve l’image hébraïque et souligne le caractère public de l’événement.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: les eaux de Meriba de Qadesh
  rationale: La formulation traite Meriba comme le nom traditionnel du lieu tout en conservant son lien avec Qadesh. Elle reste intelligible en français et permet de signaler le sens littéral en note.
theological_decisions:
- issue: Expression de l’échec indiqué contextuellement par לְהַקְדִּישֵׁנִי
  choice: en ne me faisant pas reconnaître comme saint
  alternative: pour me faire reconnaître comme saint
  rationale: L’infinitif hébreu est positif dans sa forme, mais dépend de l’affirmation selon laquelle Moïse et Aaron se sont rebellés contre l’ordre divin. L’explicitation de la négation transmet le sens contextuel sans définir davantage la nature précise de leur faute.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms géographiques suivent des translittérations françaises usuelles. La formulation conserve le caractère public de la faute et la tension entre la forme positive de l’infinitif hébreu et son sens négatif dans le contexte.
