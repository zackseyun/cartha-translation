  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Prends Josué, fils de Noun, un homme en qui réside l’esprit[a], et pose ta main sur lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme en qui est esprit (ou souffle) ». L’hébreu n’emploie pas d’article; il peut s’agir de l’Esprit de Dieu, mais la formulation reste ambiguë.'
    reason: Signaler l’absence d’article devant רוּחַ et préserver l’ambiguïté entre l’Esprit divin et un esprit ou souffle.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et distingue celui-ci du titre « Seigneur ».
- source_word: קַח לְךָ
  choice: Prends
  rationale: En contexte, l’impératif français « Prends » rend naturellement l’expression hébraïque; le pronom éthique לְךָ n’exige pas « pour toi ».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Emploie les formes françaises usuelles des noms bibliques et rend explicitement la relation filiale.
- source_word: אִישׁ אֲשֶׁר רוּחַ בּוֹ
  choice: un homme en qui réside l’Esprit
  rationale: Conserve le masculin explicite אִישׁ et exprime naturellement la présence intérieure indiquée par רוּחַ בּוֹ. La majuscule retient la référence contextuellement probable à l’Esprit de Dieu, tandis qu’une note signale l’indétermination grammaticale de l’hébreu.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: et pose ta main sur lui
  rationale: Rend l’acte de désignation par imposition de la main, tout en conservant le singulier de יָדְךָ.
theological_decisions:
- issue: 'La référence de רוּחַ : l’Esprit de Dieu ou un esprit/une disposition intérieure'
  choice: l’Esprit
  alternative: un esprit; du souffle; l’esprit
  rationale: Le contexte de l’établissement de Josué comme chef favorise l’idée d’une habilitation divine, mais l’hébreu n’emploie pas d’article et demeure formellement ouvert. La note conserve cette tension au lieu de présenter l’interprétation comme certaine.
translation_notes:
  register: Français international moderne, simple et digne. Le discours direct reste naturel; « pose ta main » évite une formulation ecclésiastique ajoutée tout en évoquant clairement le geste de transmission de charge.
