  text: כֵּ֗ן בְּנ֣וֹת צְלָפְחָד֮ דֹּבְרֹת֒ נָתֹ֨ן תִּתֵּ֤ן לָ/הֶם֙ אֲחֻזַּ֣ת נַחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֣י אֲבִי/הֶ֑ם וְ/הַֽעֲבַרְתָּ֛ אֶת נַחֲלַ֥ת אֲבִי/הֶ֖ן לָ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: fr
  text: Les filles de Tselofhad ont raison[a]. Tu leur donneras assurément une propriété en héritage parmi les frères de leur père[b], et tu leur transmettras l’héritage de leur père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Les filles de Tselofhad parlent juste. »'
    reason: lexical_alternative
  - marker: b
    text: À cet endroit, le texte hébreu emploie une forme pronominale masculine plurielle pour « leur », bien que le contexte désigne clairement les filles de Tselofhad.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: ont raison
  rationale: Dans cette décision juridique, l’expression signifie littéralement qu’elles « parlent juste ». « Ont raison » en rend naturellement la portée affirmative en français moderne.
- source_word: נָתֹן תִּתֵּן
  choice: tu leur donneras sans faute
  rationale: L’infinitif absolu suivi du verbe conjugué renforce ici l’ordre. « Sans faute » exprime cette insistance sans archaïsme.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: une propriété en héritage
  rationale: 'Cette formulation conserve les deux notions du syntagme hébreu : un bien détenu et reçu comme héritage.'
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: parmi les frères de leur père
  rationale: La traduction situe leur part dans le cadre familial et foncier des frères de leur père, tout en restant proche de la syntaxe hébraïque.
- source_word: וְהַעֲבַרְתָּ
  choice: tu transmettras
  rationale: 'Le hiphil de עבר a ici un sens juridique : faire passer l’héritage du père à ses filles. « Transmettre » convient au contexte successoral.'
- source_word: נַחֲלַת אֲבִיהֶן
  choice: l’héritage de leur père
  rationale: La formulation française exprime directement le rapport familial et juridique indiqué par l’hébreu.
