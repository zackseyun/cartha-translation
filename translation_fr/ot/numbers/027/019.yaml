    issue: « tu lui confieras sa charge » interprète fortement וְצִוִּיתָה אֹתוֹ.
    rationale: צוה signifie usuellement « ordonner à quelqu’un / donner des instructions à quelqu’un ». L’objet suffixé est Josué (« lui »), non une « charge ». Le contexte justifie une note sur une commission publique, mais non ce déplacement dans le texte principal.
  - severity: low
    issue: La note propose « tu lui donneras tes ordres » comme seule alternative.
    rationale: Cette expression est possible, mais elle introduit « tes » de manière plus marquée que nécessaire et est moins neutre en français moderne. Une note indiquant la possibilité de « l’ordonner » ou de « lui donner des ordres » reflète mieux l’éventail lexical.
