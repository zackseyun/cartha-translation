- from: Tu le placeras devant le prêtre Éléazar et devant toute la communauté, puis tu lui confieras sa charge[a] sous leurs yeux.
  to: Tu le placeras devant le prêtre Éléazar et devant toute la communauté, puis tu lui donneras des instructions[a] sous leurs yeux.
  rationale: La révision conserve toutes les correspondances formelles du verset, mais rend וְצִוִּיתָה אֹתוֹ par une construction française qui reflète directement « donner des instructions à lui ». La note conserve avec prudence la lecture contextuelle de commission publique attestée par l’audit anglais, sans substituer cette interprétation au sens lexical premier.
