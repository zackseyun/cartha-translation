  text: וְ/הַֽעֲמַדְתָּ֣ אֹת֗/וֹ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָ֑ה וְ/צִוִּיתָ֥ה אֹת֖/וֹ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: fr
  text: Tu le placeras devant le prêtre Éléazar et devant toute la communauté, puis tu lui donneras des instructions[a] sous leurs yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu lui donneras des ordres » ou « tu lui donneras une charge ». Le verbe hébreu signifie habituellement « ordonner » ; dans ce contexte d’établissement public, il peut aussi évoquer une mission officiellement confiée à Josué.'
    reason: 'Alternative lexicale : préserve le sens usuel de צוה tout en signalant la nuance contextuelle d’investiture publique, sans l’imposer dans le texte principal.'
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Tu le placeras
  rationale: Le hiphil de עמד exprime ici l’action de faire tenir quelqu’un debout ou de le présenter officiellement. « Placer » convient naturellement à cette scène publique sans surinterpréter le geste.
- source_word: לִפְנֵי
  choice: devant
  rationale: Cette préposition indique ici la présence spatiale et officielle d’Éléazar et de la communauté.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Translittération française usuelle du nom propre.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le titre défini désigne la fonction officielle d’Éléazar.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble de la communauté d’Israël réunie. « Communauté » est actuel, clair et conserve le sens collectif.
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: puis tu lui confieras sa charge
  rationale: צוה signifie normalement « ordonner, donner des instructions ». Dans ce contexte d’établissement public de Josué, « confier sa charge » exprime la mission officiellement remise, tandis qu’une note conserve le sens lexical plus direct.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Littéralement « à leurs yeux » ; cette expression française conserve l’idée d’un acte accompli publiquement en présence de tous.
theological_decisions:
- issue: Établissement public de l’autorité de Josué
  choice: tu lui confieras sa charge
  alternative: tu lui donneras tes ordres
  rationale: Le contexte décrit la transmission publique d’une responsabilité à Josué devant le prêtre et la communauté. Le texte principal rend cette fonction cérémonielle sans attribuer ici à Josué une autorité que le verset suivant précisera ; la note maintient l’autre sens direct du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse divine directe à Moïse. « Communauté » évite une coloration ecclésiale excessive, et « sous leurs yeux » garde le caractère public de la scène.
