reference: Numbers 27:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: fr
  text: Tu lui conféreras une part de ta dignité[a], afin que toute la communauté des Israélites lui obéisse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une part de ta majesté », « de ton honneur » ou « de ton éclat ». Le mot hébreu peut désigner la splendeur ou la dignité, ainsi que le prestige et l’autorité liés à une charge.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’elle l’écoute » ou « qu’elle l’entende ». Le verbe hébreu désigne souvent une écoute qui conduit à l’obéissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu lui conféreras
  rationale: נתן signifie littéralement « donner »; avec עַל et dans ce contexte d'investiture, « conférer à » exprime naturellement en français la transmission publique d'une qualité liée à la charge, tout en conservant l'idée de don.
- source_word: מֵהוֹדְךָ
  choice: une part de ta dignité
  rationale: הוֹד peut désigner l'éclat, la majesté, l'honneur ou la dignité. Ici, le contexte d'investiture donne à cette dignité une portée officielle, sans réduire le mot à la seule « autorité ». Le préfixe מִן exprime une part de ce qui appartient à Moïse.
- source_word: עָלָיו
  choice: lui
  rationale: Le complément français de « conférer » rend idiomatiquement עַל avec son suffixe, sans reproduire artificiellement « sur lui ».
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution introduit clairement le but exprimé par לְמַעַן dans un registre digne et courant.
- source_word: יִשְׁמְעוּ
  choice: lui obéisse
  rationale: שׁמע couvre entendre, écouter et obéir. Dans ce contexte où Josué reçoit publiquement une dignité de chef, « obéir » exprime la réponse effective attendue; une note conserve l'ambiguïté lexicale.
- source_word: כָּל עֲדַת
  choice: toute la communauté
  rationale: עֵדָה désigne ici l'ensemble de la communauté d'Israël. « Toute la communauté » est naturel en français moderne et reflète כָּל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des Israélites
  rationale: L'expression hébraïque signifie littéralement « les fils d'Israël », mais désigne idiomatiquement le peuple d'Israël. « Les Israélites » est précis, inclusif et naturel en français actuel.
theological_decisions:
- issue: Nature de ce qui est transmis de Moïse à Josué
  choice: Une part de la dignité de Moïse est conférée à Josué, avec les implications officielles propres au contexte.
  alternative: Une part de son éclat, de sa majesté, de son honneur ou, fonctionnellement, de son autorité.
  rationale: Le mot הוֹד ne signifie pas simplement « autorité ». « Dignité » maintient sa dimension d'honneur et de majesté tout en convenant à l'investiture; la note préserve les autres nuances possibles et évite de trancher excessivement.
- issue: Valeur de שׁמע dans la proposition de but
  choice: La communauté doit obéir à Josué.
  alternative: La communauté doit l'écouter ou l'entendre.
  rationale: Dans un cadre de direction et d'investiture, le verbe implique vraisemblablement une écoute qui se traduit par l'obéissance. La note signale néanmoins la gamme sémantique du terme.
translation_notes:
  register: Français international moderne, clair et digne. « Conférer » convient à une investiture publique sans être excessivement technique. « Communauté des Israélites » évite le calque peu naturel « fils d’Israël ». Les notes maintiennent les ambiguïtés réelles de הוֹד et de שׁמע.
