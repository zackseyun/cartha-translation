  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: fr
  text: S’il n’a pas de fille, vous donnerez son héritage à ses frères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: S’il
  rationale: Introduit le cas conditionnel suivant dans la série juridique. En français, la simple condition avec « si » est plus naturelle ici; l’enchaînement avec le contexte porte suffisamment la valeur connective de וְ.
- source_word: אֵין ל֖/וֹ
  choice: il n’a pas
  rationale: La construction existentielle אֵין avec לְ exprime idiomatiquement l’absence de possession; « il n’a pas » est exact et naturel en français.
- source_word: בַּת
  choice: de fille
  rationale: Le singulier hébreu désigne une fille comme héritière éventuelle. Après la négation, le français idiomatique emploie « de fille ».
- source_word: וּ/נְתַתֶּם
  choice: vous donnerez
  rationale: Le verbe à la deuxième personne du pluriel formule une prescription juridique. Le futur français exprime naturellement l’obligation dans ce registre sans ajouter un modal absent du texte.
- source_word: נַחֲלָת֖/וֹ
  choice: son héritage
  rationale: Dans ce contexte, נַחֲלָה désigne le patrimoine héréditaire ou le droit successoral; « héritage » est précis, courant et cohérent avec la loi exposée.
- source_word: לְ/אֶחָי/ו
  choice: à ses frères
  rationale: Le nom hébreu est au masculin pluriel et désigne ici les frères du défunt comme héritiers suivants; la traduction conserve cette précision.
