  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: fr
  text: Pourquoi le nom de notre père serait-il retranché de son clan parce qu’il n’a pas de fils ? Donnez-nous une propriété parmi les frères de notre père[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « serait-il diminué » ou « serait-il ôté ». L’hébreu demande pourquoi le « nom » de leur père devrait être perdu de son clan parce qu’il n’a pas de fils.
    reason: lexical_alternative
  - marker: b
    text: La « propriété » désigne ici un bien foncier, c’est-à-dire une part de territoire attribuée comme patrimoine au sein du clan.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi… disparaîtrait-il
  rationale: Le conditionnel français rend naturellement la question de protestation et son objection implicite.
- source_word: יִגָּרַע
  choice: disparaîtrait
  rationale: Dans ce contexte de lignée et de patrimoine, le niphal de גרע exprime la perte du nom au sein du clan. « Disparaître » restitue cet effet tout en laissant en note les nuances plus littérales.
- source_word: שֵׁם
  choice: nom
  rationale: Le terme est conservé littéralement afin de préserver l’image hébraïque du maintien du père et de sa lignée dans le clan.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: du milieu de son clan
  rationale: « Clan » convient au groupe familial élargi dans le cadre tribal, tandis que « du milieu de » reflète מִתּוֹךְ.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: sous prétexte qu’il n’a pas eu de fils
  rationale: Dans cette protestation, כִּי donne le motif contesté. « Sous prétexte que » exprime naturellement cette force sans nier le fait invoqué; le passé composé convient au père décédé dans le contexte narratif.
- source_word: תְּנָה לָּנוּ
  choice: Donnez-nous
  rationale: L’impératif direct au pluriel de politesse convient à l’adresse faite aux autorités et demeure naturel en français moderne.
- source_word: אֲחֻזָּה
  choice: une propriété
  rationale: Le mot désigne ici un bien foncier détenu comme part patrimoniale; la note précise cette portée juridique et territoriale.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: parmi les frères de notre père
  rationale: La formulation maintient les termes masculins précis de l’hébreu et la ligne agnatique concernée par la demande.
theological_decisions:
- issue: Langage genré du droit successoral
  choice: fils / frères de notre père
  alternative: enfant / parents de notre père
  rationale: L’hébreu emploie explicitement des termes masculins parce que le litige concerne l’absence de fils et l’attribution foncière dans la parenté paternelle. Les neutraliser effacerait un élément essentiel de la question juridique.
translation_notes:
  register: Français international moderne, naturel et digne. La question conserve sa vigueur protestataire; « nom » maintient l’image hébraïque, et le vocabulaire foncier reste accessible grâce à une note explicative.
