base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: fr
  text: 'Mais toi et tes fils avec toi, vous veillerez sur votre sacerdoce pour tout ce qui concerne l’autel et pour ce qui se trouve derrière le voile[a], et vous accomplirez votre service. Je vous donne votre sacerdoce : c’est un service reçu en don[b]. Mais toute personne non autorisée[c] qui s’approchera sera mise à mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à l’intérieur du voile » ; il s’agit de l’espace sacré situé de l’autre côté du voile.'
    reason: clarification_spatiale
  - marker: b
    text: 'L’expression hébraïque est condensée. On peut aussi comprendre : « Je vous accorde le sacerdoce comme un don en vue du service. »'
    reason: ambiguite_syntaxique
  - marker: c
    text: 'Littéralement : « l’étranger » ou « celui qui est extérieur ». Ici, ce terme désigne une personne qui n’est pas autorisée à exercer les fonctions sacerdotales, et non spécialement un étranger d’un autre peuple.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: vous veillerez sur
  rationale: Le verbe שׁמר exprime ici la garde vigilante d’une charge confiée. « Veiller sur » rend à la fois la responsabilité et la dimension protectrice dans un français naturel.
- source_word: כְּהֻנַּתְכֶם
  choice: votre sacerdoce
  rationale: Le terme désigne la fonction et la charge sacerdotales, non seulement des actes rituels isolés. « Sacerdoce » est précis, digne et courant dans le contexte biblique.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: pour tout ce qui concerne l’autel
  rationale: 'דָּבָר a ici un sens large : toute affaire ou responsabilité relative à l’autel. Cette formulation évite de limiter indûment la portée aux seuls rites.'
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: et pour ce qui se trouve derrière le voile
  rationale: L’expression situe la responsabilité sacerdotale du côté intérieur du voile. « Derrière le voile » est naturel en français et identifie clairement l’espace sacré sans préciser davantage que l’hébreu.
- source_word: וַעֲבַדְתֶּם
  choice: et vous accomplirez votre service
  rationale: Dans ce contexte cultuel, עבד désigne l’exercice du service sacerdotal. « Accomplir votre service » est plus explicite que le simple « servir », sans introduire de terminologie ecclésiastique ultérieure.
- source_word: עֲבֹדַת מַתָּנָה
  choice: un service reçu en don
  rationale: La construction nominale est condensée et associe étroitement service et don. La formulation française conserve l’idée que cette fonction n’est pas assumée de sa propre initiative, mais accordée par Dieu.
- source_word: אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: Je vous donne votre sacerdoce
  rationale: Le présent de déclaration solennelle rend naturellement l’imperfectif hébreu dans ce discours divin et garde l’accent sur l’octroi du sacerdoce.
- source_word: הַזָּר
  choice: toute personne non autorisée
  rationale: Dans la législation sacerdotale, זָר désigne une personne extérieure à la fonction sacrée autorisée, et non nécessairement un étranger d’un autre peuple. Cette traduction évite une lecture ethnique erronée.
- source_word: הַקָּרֵב
  choice: qui s’approchera
  rationale: קרב désigne ici le fait de s’approcher du domaine ou du service sacré réservé. Le futur convient à la formulation juridique française.
- source_word: יוּמָת
  choice: sera mise à mort
  rationale: La forme hophal a une valeur passive causative et exprime une sanction de mort, plutôt qu’une simple annonce selon laquelle la personne mourra.
theological_decisions:
- issue: Portée de זָר dans la législation sacerdotale
  choice: toute personne non autorisée
  alternative: l’étranger ; le profane ; toute personne étrangère au sacerdoce
  rationale: Le contexte oppose les prêtres chargés du service à quiconque n’a pas reçu l’autorisation de l’exercer. La traduction préserve cette limite cultuelle sans lui donner à tort un caractère ethnique.
- issue: Rapport syntaxique entre עֲבֹדַת מַתָּנָה et le don du sacerdoce
  choice: le sacerdoce est présenté comme un service reçu en don
  alternative: le sacerdoce est un don accordé en vue du service
  rationale: L’hébreu est très condensé et permet de mettre l’accent soit sur le service comme don, soit sur le sacerdoce donné pour servir. Le texte principal suit la première articulation tout en signalant l’autre dans une note, sans trancher une ambiguïté réelle.
- issue: Nature de l’approche interdite
  choice: conserver le verbe général « s’approcher »
  alternative: s’approcher pour exercer le service sacerdotal
  rationale: Le contexte indique une approche non autorisée du domaine sacerdotal, mais le texte ne développe pas ici toutes ses modalités. La formulation générale conserve la portée et la tension du texte.
translation_notes:
  register: Français international moderne, clair et solennel. Le vouvoiement pluriel explicite (« vous ») conserve l’adresse à Aaron et à ses fils. Le vocabulaire cultuel traditionnel (« sacerdoce », « autel », « voile ») est maintenu parce qu’il reste précis et intelligible, tandis que les formulations susceptibles d’être comprises ethniquement ou confessionnellement sont explicitées avec sobriété.
