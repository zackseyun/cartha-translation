lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר marque l’étape narrative suivante. Le passé simple convient à une narration française soutenue et rend précisément l’acte de parler.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole ; « à Moïse » est l’équivalent français naturel.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule récurrente qui introduit un discours direct, « en ces termes » est naturel en français moderne et évite le calque pesant « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom propre, tandis que « le SEIGNEUR » correspond à sa substitution traditionnelle à la lecture.
translation_notes:
  register: Français international moderne, digne et fluide. Le passé simple maintient le registre narratif biblique sans archaïsme marqué ; « en ces termes » introduit naturellement la parole directe qui suit.
