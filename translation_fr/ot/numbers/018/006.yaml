source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: fr
  text: 'Et moi, voici que j’ai pris vos frères, les Lévites, du milieu des fils d’Israël[a] : ils vous sont donnés en cadeau, donnés à Yahweh, pour accomplir le service de la tente de la Rencontre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du milieu des Israélites ». L’hébreu dit littéralement « du milieu des fils d’Israël ».
    reason: Précise l’expression hébraïque tout en offrant son équivalent collectif naturel en français.
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Et moi, voici
  rationale: Conserve à la fois la continuité marquée par la conjonction, l’insistance sur le locuteur divin et la force solennelle de הִנֵּה.
- source_word: לָקַחְתִּי
  choice: j’ai pris
  rationale: Rend directement le parfait de לקח sans introduire l’idée plus interprétative de sélection.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: vos frères, les Lévites
  rationale: Maintient le langage familial du texte et identifie les frères en question par l’apposition.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: du milieu des fils d’Israël
  rationale: Reproduit l’image d’une prise au sein du groupe ainsi que la formulation masculine et généalogique de l’hébreu; une formulation française plus idiomatique est signalée en note.
- source_word: לָכֶם מַתָּנָה נְתֻנִים
  choice: ils vous sont donnés en cadeau
  rationale: Exprime clairement le bénéficiaire et conserve l’écho entre מַתָּנָה, « cadeau », et נְתֻנִים, « donnés ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Transcrit le nom divin personnel et garde la relation indiquée par la préposition ל.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: pour accomplir le service
  rationale: Rend naturellement en français l’association étymologique du verbe עבד et du nom עֲבֹדָה sans produire la tournure maladroite « servir le service ».
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rend les deux éléments du syntagme et désigne la tente où a lieu la rencontre fixée avec Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve ici le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La traduction principale garde la forme généalogique de l’hébreu sans décider qu’elle désigne seulement des hommes; la note donne l’équivalent collectif idiomatique.
- issue: Double statut des Lévites comme don
  choice: ils vous sont donnés en cadeau, donnés à Yahweh
  alternative: je vous les donne en cadeau pour Yahweh
  rationale: 'La formulation retenue conserve la tension grammaticale du texte: les Lévites sont attribués aux prêtres tout en étant donnés à Yahweh, sans réduire l’un de ces rapports à l’autre.'
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure emphatique « Et moi, voici » et la répétition « donnés… donnés » sont volontairement conservées; les deux-points rendent lisible la longue déclaration hébraïque.
