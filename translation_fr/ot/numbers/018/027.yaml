source:
  edition: WLC
  text: וְ/נֶחְשַׁ֥ב לָ/כֶ֖ם תְּרוּמַתְ/כֶ֑ם כַּ/דָּגָן֙ מִן הַ/גֹּ֔רֶן וְ/כַֽ/מְלֵאָ֖ה מִן הַ/יָּֽקֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: fr
  text: Votre contribution vous sera comptée comme le grain provenant de l’aire de battage et comme le produit du pressoir[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera considérée comme ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « comme la plénitude provenant du pressoir », c’est-à-dire tout le produit du pressoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: sera considérée comme
  rationale: Le niphal de חשׁב exprime ici le fait d’être tenu ou compté pour l’équivalent de quelque chose. Cette formulation française s’intègre naturellement à la construction comparative qui suit.
- source_word: תְּרוּמַתְכֶם
  choice: votre contribution
  rationale: תְּרוּמָה désigne une part prélevée et consacrée. « Contribution » est précis, actuel et convient à la portion que les lévites doivent remettre.
- source_word: כַּדָּגָן מִן הַגֹּרֶן
  choice: comme le blé provenant de l’aire de battage
  rationale: דָּגָן désigne les céréales, souvent rendues collectivement par « blé » en français biblique courant, et גֹּרֶן l’aire où elles sont battues.
- source_word: וְכַמְלֵאָה מִן הַיָּקֶב
  choice: et comme le produit du pressoir
  rationale: מְלֵאָה évoque ici ce qui remplit ou le plein produit du pressoir. « Produit » explicite naturellement la métonymie agricole sans préciser indûment s’il s’agit du raisin, du moût ou du vin.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve le parallélisme agricole et la valeur juridique ou cultuelle de l’assimilation, tout en rendant idiomatiquement l’expression hébraïque littérale « la plénitude du pressoir ».
