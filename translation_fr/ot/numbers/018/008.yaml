  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: fr
  text: 'Yahweh parla à Aaron : « Quant à moi, voici que je t’ai confié la charge de mes prélèvements[a], de toutes les choses saintes des fils d’Israël[b]. Je te les ai donnés comme part liée à ton onction[c], et à tes fils comme prescription perpétuelle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes offrandes » ; plus techniquement, « mes offrandes prélevées » ou « élevées ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des fils d’Israël », désignation habituelle du peuple d’Israël dans le cadre de l’alliance.
    reason: cultural_note
  - marker: c
    text: Littéralement « pour l’onction ». Le sens paraît être la part attribuée à Aaron en raison de son onction et de sa fonction sacerdotale.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: וַאֲנִי הִנֵּה
  choice: Quant à moi, voici que
  rationale: Rend à la fois le pronom emphatique et la valeur présentative de הִנֵּה dans un français naturel et soutenu.
- source_word: נָתַתִּי לְךָ אֶת מִשְׁמֶרֶת
  choice: je t’ai confié la garde
  rationale: Dans cette construction, la traduction explicite naturellement l’idée d’une responsabilité remise à Aaron, tout en conservant le sens de garde ou de charge de מִשְׁמֶרֶת.
- source_word: תְּרוּמֹתָי
  choice: mes contributions
  rationale: Désigne les dons prélevés et consacrés à Yahweh; « contributions » reste précis sans imposer le terme technique et moins transparent d’« offrandes élevées ».
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: c’est-à-dire de toutes les choses saintes des fils d’Israël
  rationale: קָדְשֵׁי est conservé dans sa relative indétermination (« choses saintes »), tandis que la relation avec les contributions est explicitée comme apposition explicative.
- source_word: לְמָשְׁחָה
  choice: comme part liée à ton onction
  rationale: Conserve le lien lexical avec l’onction tout en indiquant que les dons constituent la part sacerdotale d’Aaron; la note signale l’ambiguïté de la formulation hébraïque.
- source_word: לְחָק עוֹלָם
  choice: par une prescription permanente
  rationale: Rend la force normative de חֹק et la durée indéfinie de עוֹלָם sans surcharger le français d’un archaïsme juridique.
theological_decisions:
- issue: Portée de לְמָשְׁחָה dans l’attribution sacerdotale
  choice: comme part liée à ton onction
  alternative: pour l’onction; comme part consacrée
  rationale: Le contexte favorise une part revenant à Aaron en vertu de son onction sacerdotale, mais l’hébreu concis ne formule pas explicitement toute cette relation; la traduction et la note préservent cette tension.
- issue: Rendu de בְנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites; peuple d’Israël
  rationale: La forme traditionnelle conserve ici la désignation généalogique et communautaire de l’hébreu sans lui substituer une paraphrase.
- issue: Valeur de חֹק עוֹלָם
  choice: prescription permanente
  alternative: prescription perpétuelle; droit durable
  rationale: La traduction maintient la force légale et la continuité du statut sans trancher des questions théologiques externes au verset sur la durée des institutions cultuelles.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe solennelle du discours divin est conservée sans calque excessif; « choses saintes » maintient l’amplitude du terme hébreu, et les variantes techniques sont réservées aux notes.
