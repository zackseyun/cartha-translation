revisions:
- from: 'Yahweh parla à Aaron : « Quant à moi, voici que je t’ai confié la garde de mes contributions[a], c’est-à-dire de toutes les choses saintes des fils d’Israël[b]. Je te les ai données comme part liée à ton onction[c], à toi et à tes fils, par une prescription permanente. »'
  to: 'Yahweh parla à Aaron : « Quant à moi, voici que je t’ai confié la charge de mes prélèvements[a], de toutes les choses saintes des fils d’Israël[b]. Je te les ai donnés comme part liée à ton onction[c], et à tes fils comme prescription perpétuelle. »'
  rationale: La révision remplace le terme administratif « contributions » par « prélèvements », supprime l’équivalence interprétative introduite par « c’est-à-dire » et rétablit une structure qui distingue plus nettement la part d’Aaron liée à son onction de l’attribution durable faite à ses fils. Les notes conservent les alternatives lexicales et l’ambiguïté contrôlée de לְמָשְׁחָה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:49:47Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’emphase de « Quant à moi, voici ». Toutefois, « c’est-à-dire » transforme en équivalence explicite une relation syntaxiquement plus concise et quelque peu ouverte dans l’hébreu entre les prélèvements et « toutes les choses saintes ». La formulation finale actuelle associe aussi trop étroitement « à toi et à tes fils » à « ton onction ».
  naturalness: Le français est globalement clair et soutenu. « Contributions » est cependant peu idiomatique dans ce contexte cultuel; « prélèvements » est plus précis et naturel. La révision allège également l’explication intégrée au texte.
  terminology: « Yahweh », « Aaron », « fils d’Israël », « choses saintes » et « onction » conviennent. « Prélèvements » rend bien תְּרוּמֹת, avec les termes techniques proposés en note. « Prescription perpétuelle » conserve la portée normative et durable de חֹק עוֹלָם sans imposer de conclusion doctrinale sur son application ultérieure.
  issues:
  - severity: medium
    issue: « c’est-à-dire » explicite indûment la relation entre les prélèvements et les choses saintes.
    rationale: Le texte hébreu juxtapose « la charge de mes prélèvements » et « pour/touchant toutes les choses saintes des fils d’Israël ». Une apposition explicative sans marqueur conclusif préserve mieux la concision et l’ouverture de la construction.
  - severity: medium
    issue: La clausule « à toi et à tes fils, par une prescription permanente » brouille la distribution syntaxique des bénéficiaires et le lien de l’onction avec Aaron.
    rationale: L’hébreu mentionne d’abord l’attribution à Aaron liée à l’onction, puis l’attribution à ses fils comme statut perpétuel. Une coordination plus proche de cette structure évite de suggérer que « ton onction » qualifie également les fils.
  - severity: low
    issue: « Mes contributions » est trop administratif pour des dons cultuels.
    rationale: « Mes prélèvements » maintient le sens spécialisé de תְּרוּמֹת tout en restant intelligible en français contemporain.
  revised_text: 'Yahweh parla à Aaron : « Quant à moi, voici que je t’ai confié la charge de mes prélèvements[a], de toutes les choses saintes des fils d’Israël[b]. Je te les ai donnés comme part liée à ton onction[c], et à tes fils comme prescription perpétuelle. »'
  revised_footnotes:
