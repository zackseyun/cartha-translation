source:
  edition: WLC
  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: fr
  text: 'Quant à ceux qui doivent être rachetés, tu les rachèteras dès l’âge d’un mois, selon ton estimation : cinq sicles d’argent, d’après le sicle du sanctuaire, qui équivaut à vingt guéras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il est de vingt guéras ». Le pronom hébreu renvoie au sicle du sanctuaire en tant qu’étalon de poids.'
    reason: La note signale la formulation pronominale de l’hébreu et précise son antécédent, que la traduction française rend par une proposition relative.
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: ceux qui doivent être rachetés
  rationale: La forme participiale passive avec suffixe masculin singulier est syntaxiquement difficile. Dans cette prescription générale sur les premiers-nés, une expression passive au pluriel rend naturellement en français sa portée collective, sans transformer le texte en une mention abstraite du prix de rachat.
- source_word: מִבֶּן חֹדֶשׁ
  choice: dès l’âge d’un mois
  rationale: L’expression indique le seuil d’âge à partir duquel le rachat doit avoir lieu. « Dès l’âge d’un mois » est naturel et conserve la valeur initiale de la préposition מִן.
- source_word: תִּפְדֶּה
  choice: tu les rachèteras
  rationale: L’imparfait hébreu à la deuxième personne du masculin singulier exprime ici une prescription juridique. Le futur français convient à ce registre normatif; le pronom « les » reprend explicitement le groupe placé en tête.
- source_word: בְּעֶרְכְּךָ
  choice: selon ton estimation
  rationale: Le nom ערך désigne ici une valeur fixée ou évaluée, et le possessif singulier s’adresse au responsable de cette estimation. Cette formulation conserve ces deux éléments dans un français courant.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: cinq sicles d’argent
  rationale: Cette formulation française rend clairement la quantité et la matière, tout en conservant l’unité ancienne « sicle ».
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: d’après le sicle du sanctuaire
  rationale: La préposition introduit l’étalon de poids servant au calcul. « Sicle du sanctuaire » est une désignation traditionnelle, claire et précise.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: qui équivaut à vingt guéras
  rationale: Le pronom hébreu renvoie au sicle du sanctuaire comme étalon. La relative française explicite ce lien grammatical sans changer la valeur donnée.
