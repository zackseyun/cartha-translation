  rationale: La révision remplace une expression française ambiguë par « contributions sacrées » et rend explicitement, sans lourdeur, l’élévation cultuelle exprimée par le verbe hébreu. Les autres choix du projet sont conservés, notamment l’expression « alliance de sel » et sa note prudente.
