  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: fr
  text: Toutes les contributions sacrées que les Israélites élèvent en offrande pour l’Éternel, je te les donne, à toi ainsi qu’à tes fils et à tes filles avec toi, comme prescription perpétuelle. C’est une alliance de sel perpétuelle devant l’Éternel, pour toi et pour ta descendance avec toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « alliance de sel » évoque une alliance durable ; le texte ne précise pas ici le symbolisme exact du sel.
    reason: L’image hébraïque est conservée dans le texte et reçoit une brève clarification qui n’en impose pas l’interprétation.
lexical_decisions:
- source_word: תְּרוּמֹת
  choice: contributions
  rationale: Le terme désigne ici les parts prélevées et offertes à l’Éternel; « contributions » reste naturel et assez large dans ce contexte cultuel.
- source_word: יָרִימוּ
  choice: prélèveront
  rationale: Le verbe signifie littéralement « élever », mais, associé à תְּרוּמָה, il désigne idiomatiquement l’action de prélever une contribution consacrée.
- source_word: חָק עוֹלָם
  choice: prescription perpétuelle
  rationale: « Prescription » rend le caractère normatif de חֹק, tandis que « perpétuelle » conserve la portée durable de עוֹלָם.
- source_word: בְּרִית מֶלַח
  choice: alliance de sel
  rationale: L’expression imagée est conservée plutôt qu’interprétée dans le corps du texte.
- source_word: זֶרַע
  choice: descendance
  rationale: Ce collectif désigne les descendants d’Aaron; « descendance » convient au singulier collectif hébreu.
theological_decisions:
- issue: Sens de « l’alliance de sel »
  choice: Conserver l’expression sans en fixer le symbolisme dans le texte
  alternative: Traduire ou paraphraser par « alliance inviolable » ou « alliance durable »
  rationale: Le texte affirme clairement la permanence de l’alliance, mais ne précise pas ici la valeur symbolique exacte du sel.
- issue: Nom divin יהוה
  choice: l’Éternel
  alternative: YHWH ou Yahvé
  rationale: « L’Éternel » est une convention française digne et largement intelligible pour représenter le tétragramme, sans imposer une vocalisation reconstruite.
- issue: Destinataires du don
  choice: Conserver « à toi ainsi qu’à tes fils et à tes filles avec toi »
  alternative: Généraliser en « à ta famille »
  rationale: La formulation explicite du texte source souligne que les fils et les filles d’Aaron sont inclus; elle ne doit pas être réduite à une paraphrase.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près l’hébreu tout en évitant les calques peu naturels; l’image « alliance de sel » est préservée.
