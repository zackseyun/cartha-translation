base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: fr
  text: Tout ce qu’il y a de meilleur dans l’huile[a], tout ce qu’il y a de meilleur dans le vin nouveau et les céréales — leurs prémices, qu’ils donnent à Yahvé —, je te les ai donnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute la graisse de l’huile et toute la graisse du vin nouveau et des céréales » ; en hébreu, « graisse » désigne ici la partie la plus riche ou la meilleure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: ce qu’il y a de meilleur dans
  rationale: Le sens premier est « graisse », mais, appliqué aux produits agricoles, le mot désigne idiomatiquement la partie la plus riche ou la meilleure. Cette tournure française restitue naturellement l’image sans la rendre littéralement dans le corps du texte.
- source_word: יִצְהָר
  choice: huile
  rationale: Le terme désigne de l’huile fraîche, normalement de l’huile d’olive dans ce contexte, sans que l’olive soit explicitement nommée.
- source_word: תִּירוֹשׁ
  choice: vin nouveau
  rationale: Cette expression préserve la distinction lexicale avec les termes hébreux désignant le vin de façon plus générale.
- source_word: דָגָן
  choice: blé
  rationale: Le terme hébreu désigne collectivement les céréales ou le grain. « Blé » est ici une formulation agricole courante en français, bien que « céréales » soit une autre possibilité.
- source_word: רֵאשִׁיתָם
  choice: leurs prémices
  rationale: Dans ce contexte d’offrandes agricoles, רֵאשִׁית désigne la première part des produits, consacrée à Dieu; « prémices » est précis, concis et usuel dans le registre biblique français.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: qu’ils donnent à Yahvé
  rationale: « Donner » suit directement נתן et convient à l’attribution de ces prémices; le nom divin יהוה est rendu par « Yahvé » conformément à la couche anglaise auditée fournie.
- source_word: לְךָ נְתַתִּים
  choice: je te l’ai donné
  rationale: Le parfait présente le don comme une attribution établie. Le singulier collectif « l’ » reprend naturellement en français l’ensemble de la meilleure part précédemment énumérée, tandis que le destinataire est au singulier.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le tétragramme est représenté explicitement afin de conserver le nom propre présent dans le texte source et dans la version anglaise POB fournie, sans introduire une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La construction détachée par des tirets conserve la mise en relief des prémices et de leur attribution. « Prémices » maintient la précision cultuelle tout en restant compréhensible dans le contexte.
