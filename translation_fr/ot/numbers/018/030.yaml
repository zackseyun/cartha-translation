source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בַּ/הֲרִֽימְ/כֶ֤ם אֶת חֶלְבּ/וֹ֙ מִמֶּ֔/נּוּ וְ/נֶחְשַׁב֙ לַ/לְוִיִּ֔ם כִּ/תְבוּאַ֥ת גֹּ֖רֶן וְ/כִ/תְבוּאַ֥ת יָֽקֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: fr
  text: 'Tu leur diras : « Lorsque vous en aurez prélevé la meilleure part[a], elle sera considérée, pour les Lévites, comme le produit de l’aire de battage et comme le produit du pressoir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa graisse » ; ici, ce terme désigne de manière imagée la partie la plus riche ou la meilleure des produits.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: Tu leur diras
  rationale: Le singulier s’adresse à Moïse et introduit l’instruction qu’il doit transmettre aux Lévites. Le futur français exprime naturellement cette directive.
- source_word: בַּהֲרִימְכֶם
  choice: Lorsque vous en aurez prélevé
  rationale: Le verbe רום au hiphil désigne ici l’action de retirer ou de présenter une contribution. « Prélever » rend clairement le geste effectué sur la dîme, tandis que le futur antérieur marque son antériorité par rapport à ce qui suit.
- source_word: חֶלְבּוֹ
  choice: la meilleure part
  rationale: Littéralement « sa graisse », l’expression désigne idiomatiquement la partie la plus riche ou la meilleure du produit agricole.
- source_word: מִמֶּנּוּ
  choice: en
  rationale: Le pronom adverbial français reprend naturellement la dîme dont la meilleure part est prélevée.
- source_word: וְנֶחְשַׁב
  choice: elle sera considérée
  rationale: Le passif de חשׁב exprime ici une qualification ou une imputation. « Sera considérée » conserve le sens juridique et comparatif sans lourdeur.
- source_word: לַלְוִיִּם
  choice: pour les Lévites
  rationale: La préposition indique la manière dont ce prélèvement sera reconnu en ce qui concerne les Lévites.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: comme le produit de l’aire de battage
  rationale: Cette formulation conserve תבואה au sens de produit ou récolte et maintient l’image agricole de l’aire où le grain est battu.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: et comme le produit du pressoir
  rationale: יֶקֶב désigne le pressoir ou la cuve de pressurage. « Pressoir » est clair, concis et parallèle à « aire de battage ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement au singulier distingue l’adresse à Moïse, tandis que le pluriel « vous » dans la citation vise les Lévites. La répétition de « comme le produit » préserve le parallélisme hébreu.
