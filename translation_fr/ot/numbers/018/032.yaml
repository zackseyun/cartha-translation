id: NUM.18.32
reference: Numbers 18:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: fr
  text: Vous ne vous chargerez d’aucune faute à ce sujet lorsque vous en prélèverez la meilleure part[a]. Vous ne profanerez pas les choses saintes des Israélites[b], et vous ne mourrez pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sa graisse »; dans ce contexte, l’expression désigne la part la plus riche ou la meilleure.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des fils d’Israël », expression habituelle pour désigner le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: vous ne vous chargerez d’aucune faute
  rationale: L’expression נשא חטא signifie porter une faute ou en assumer la culpabilité. Cette formulation conserve l’image hébraïque tout en restant naturelle en français.
- source_word: עָלָיו
  choice: à ce sujet
  rationale: Le pronom renvoie à la dîme évoquée dans le contexte et exprime la responsabilité à son égard. « À ce sujet » évite un causal trop appuyé.
- source_word: בַּהֲרִימְכֶם
  choice: lorsque vous en prélèverez
  rationale: Le hiphil de רום désigne ici l’action de mettre à part une contribution. Dans le contexte du prélèvement fait sur la dîme, « prélever » rend clairement le geste sans imposer une image française artificielle.
- source_word: חֶלְבּוֹ
  choice: la meilleure part
  rationale: חֶלֶב signifie littéralement « graisse », mais désigne idiomatiquement la part la plus riche ou la meilleure, notamment pour des produits offerts.
- source_word: מִמֶּנּוּ
  choice: en
  rationale: Le pronom français reprend naturellement l’ensemble dont la meilleure part est prélevée et évite la répétition lourde de « de celui-ci ».
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: les choses saintes des Israélites
  rationale: קָדְשֵׁי garde une portée assez large pour désigner les biens consacrés. « Israélites » rend naturellement en français l’ethnonyme hébreu littéral « fils d’Israël ».
- source_word: תְחַלְּלוּ
  choice: vous ne profanerez pas
  rationale: Le piel de חלל exprime le fait de profaner ou de traiter comme ordinaire ce qui est saint. « Profaner » préserve directement l’opposition entre saint et profane.
- source_word: וְלֹא תָמֻתוּ
  choice: et vous ne mourrez pas
  rationale: La coordination hébraïque est conservée sans transformer explicitement la proposition en but ou en menace conditionnelle.
theological_decisions:
- issue: Sens cultuel de חֶלֶב
  choice: la meilleure part
  alternative: la graisse / la part la plus riche
  rationale: Le contexte concerne une part prélevée sur la dîme, et non nécessairement la graisse animale. « Meilleure part » transmet l’exigence de réserver ce qu’il y a de meilleur sans restreindre indûment le référent.
- issue: Traduction de בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël / les enfants d’Israël
  rationale: Il s’agit de l’appellation collective habituelle du peuple d’Israël. En français moderne, « les Israélites » est naturel, précis et n’exclut pas les femmes.
- issue: Relation de la dernière proposition avec l’interdiction
  choice: et vous ne mourrez pas
  alternative: afin que vous ne mouriez pas / sous peine de mourir
  rationale: Le texte hébreu coordonne simplement les propositions par וְ. La traduction conserve cette forme et laisse ouverte la nuance exacte de conséquence ou d’issue évitée.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive correspond au registre juridique du passage. « Choses saintes » conserve l’étendue du terme hébreu, tandis que « prélever » rend naturellement l’action cultuelle dans ce contexte.
