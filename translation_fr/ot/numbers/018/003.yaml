  terminology: « Service qui t’est confié » et « objets du sanctuaire » sont des choix recevables dans ce contexte cultuel. Les alternatives proposées dans la note a restent pertinentes. Le passage de « t’ » au singulier à « vous » au pluriel reflète utilement le texte source.
