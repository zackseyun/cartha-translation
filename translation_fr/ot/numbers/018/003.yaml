source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: fr
  text: Ils assureront le service qui t’est confié et celui de toute la tente. Mais ils ne s’approcheront ni des objets du sanctuaire[a] ni de l’autel, de peur que ni eux ni vous ne mouriez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des ustensiles sacrés » ou « des objets sacrés ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et ils ne mourront pas, eux aussi, vous aussi »; dans ce contexte négatif, le sens est que la mort menace les deux groupes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: Ils assureront le service qui t’est confié
  rationale: שׁמר avec מִשְׁמֶרֶת désigne l’accomplissement vigilant d’une responsabilité assignée. Cette formulation naturelle garde l’idée d’une charge confiée à Aaron.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: et celui de toute la tente
  rationale: Le pronom « celui » reprend « le service » et conserve la répétition conceptuelle de מִשְׁמֶרֶת sans lourdeur. « Toute la tente » rend directement כָּל הָאֹהֶל.
- source_word: אַךְ
  choice: Cependant
  rationale: La conjonction introduit une restriction nette à l’étendue du service qui vient d’être confié.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: des objets du sanctuaire
  rationale: כְּלֵי peut désigner des objets, ustensiles ou équipements; הַקֹּדֶשׁ désigne ici la sphère sacrée, le sanctuaire. « Objets du sanctuaire » reste concret sans limiter le terme aux seuls récipients.
- source_word: וְאֶל הַמִּזְבֵּחַ
  choice: ni de l’autel
  rationale: Dans une interdiction française coordonnée avec « ne… ni… ni », cette formulation exprime naturellement qu’aucun des deux domaines ne doit être approché.
- source_word: לֹא יִקְרָבוּ
  choice: ils ne s’approcheront
  rationale: קרב exprime ici l’approche d’objets sacrés dont l’accès leur est interdit.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: afin que ni eux ni vous ne mouriez
  rationale: La proposition présente la conséquence mortelle à éviter. Sous la négation, גַם…גַם se rend idiomatiquement par « ni… ni », tout en incluant explicitement les deux groupes.
theological_decisions:
- issue: Destinataire et répartition des responsabilités
  choice: Le singulier « t’ » renvoie à Aaron, tandis que « ils » désigne les Lévites chargés d’un service lié à sa responsabilité et à toute la tente.
  alternative: Comprendre la deuxième personne comme visant collectivement l’ensemble des prêtres.
  rationale: Le suffixe hébreu est masculin singulier et le contexte immédiat s’adresse à Aaron; le pluriel final « vous » élargit néanmoins l’avertissement au groupe sacerdotal associé à lui.
- issue: Portée de l’avertissement de mort
  choice: L’avertissement inclut à la fois les Lévites et Aaron avec les prêtres.
  alternative: Limiter la peine de mort aux seuls Lévites.
  rationale: La construction גַם הֵם גַּם אַתֶּם nomme expressément les deux groupes et ne permet pas de restreindre la conséquence aux seuls Lévites.
translation_notes:
  register: Français international moderne, digne et accessible. « Assurer le service qui est confié » rend la responsabilité cultuelle sans archaïsme; « tente » conserve le terme concret de l’hébreu plutôt que d’introduire « tabernacle ». Les marqueurs [a] et [b] figurent tous deux dans le texte.
