source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: fr
  text: 'Voici ce qui t’appartiendra parmi les choses très saintes, du feu[a] : toutes leurs offrandes, toutes leurs offrandes de céréales, tous leurs sacrifices pour le péché[b] et tous leurs sacrifices de réparation[c], qu’ils me rendent. Cela sera très saint pour toi et pour tes fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du feu ». L’expression désigne ici la part réservée des offrandes destinées au feu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sacrifice de purification ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « sacrifice de culpabilité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: parmi les choses très saintes
  rationale: L’expression superlative désigne ici la catégorie sacrificielle de sainteté la plus élevée, et non la pièce intérieure du sanctuaire.
- source_word: מִן הָאֵשׁ
  choice: comme part soustraite au feu
  rationale: L’hébreu dit littéralement « du feu ». Dans ce contexte, il s’agit de la part sacerdotale réservée et non consumée; la note conserve la formulation littérale.
- source_word: קָרְבָּנָם
  choice: tout ce qu’ils présentent en offrande
  rationale: קָרְבָּן désigne de façon générale ce qui est apporté ou présenté à Dieu en offrande.
- source_word: מִנְחָתָם
  choice: offrandes de céréales
  rationale: Dans la législation sacerdotale, מִנְחָה désigne habituellement l’offrande faite de produits céréaliers.
- source_word: חַטָּאתָם
  choice: sacrifices pour le péché
  rationale: Dans cette liste cultuelle, le terme désigne le sacrifice associé au péché et à la purification; la variante est signalée en note.
- source_word: אֲשָׁמָם
  choice: sacrifices de réparation
  rationale: Cette formulation rend la dimension compensatoire de אָשָׁם sans exclure la notion de culpabilité, conservée dans la note.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: qu’ils me rendent
  rationale: Le hiphil de שׁוב exprime l’idée de faire revenir, restituer ou rendre; « rendent » préserve cette image sans la limiter au seul remboursement.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très saint
  rationale: Le redoublement exprime ici le degré suprême de sainteté dans la classification sacrificielle.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: pour toi et pour tes fils
  rationale: Le texte s’adresse à Aaron et vise explicitement ses fils dans l’exercice masculin de la prêtrise; le genre n’est donc pas neutralisé.
theological_decisions:
- issue: Terminologie de la sainteté sacerdotale
  choice: choses très saintes / très saint
  alternative: Saint des saints
  rationale: Le contexte porte sur le statut cultuel des offrandes, non sur la partie intérieure du sanctuaire.
- issue: Référence genrée aux descendants d’Aaron
  choice: tes fils
  alternative: tes enfants / tes descendants
  rationale: L’hébreu nomme explicitement les fils d’Aaron dans un contexte de service sacerdotal; la précision du texte est maintenue.
- issue: Valeur cultuelle de חַטָּאת et אָשָׁם
  choice: sacrifice pour le péché / sacrifice de réparation
  alternative: sacrifice de purification / sacrifice de culpabilité
  rationale: Les choix principaux sont naturels en français et rendent respectivement le lien avec le péché et la fonction réparatrice; les autres nuances légitimes sont préservées en notes.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’énumération cultuelle et la répétition distributive, tout en évitant de confondre les « choses très saintes » avec le lieu appelé le Saint des saints.
