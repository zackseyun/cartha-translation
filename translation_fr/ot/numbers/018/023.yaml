source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: fr
  text: Mais le Lévite lui-même accomplira le service de la tente de la Rencontre, et les Lévites porteront leur faute.[a] Ce sera une prescription perpétuelle pour toutes vos générations. Parmi les fils d’Israël,[b] ils n’auront aucune part d’héritage.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se traduire par « porter leur culpabilité ». Elle peut désigner la faute, la culpabilité, ou la responsabilité et les conséquences qui s’y attachent.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « parmi les Israélites ». L’hébreu porte littéralement « parmi les fils d’Israël ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils n’hériteront pas d’un héritage ». La répétition hébraïque souligne qu’aucune part d’héritage ne leur sera attribuée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: accomplira
  rationale: Dans ce contexte juridique, le parfait précédé de la conjonction a une valeur prescriptive. « Accomplira » exprime naturellement l’obligation en français.
- source_word: הַלֵּוִי הוּא
  choice: le Lévite lui-même
  rationale: Le pronom indépendant הוּא met le sujet en relief; « lui-même » en conserve l’emphase sans introduire une exclusivité absolue.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: le service de la tente de la rencontre
  rationale: עֲבֹדָה désigne ici le service cultuel confié aux Lévites. « Tente de la rencontre » rend le sens de אֹהֶל מוֹעֵד en français courant et digne.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: et les Lévites porteront la responsabilité de leur faute
  rationale: Le pronom pluriel הֵם renvoie aux Lévites comme groupe après le singulier collectif. L’expression נשא עון associe faute, culpabilité et responsabilité pour ses conséquences; la formulation française garde cette tension tout en restant intelligible.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: La formule désigne une règle durable dans l’ordre de l’alliance; « prescription permanente » conserve le registre juridique sans archaïsme.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette tournure française naturelle exprime la continuité à travers les générations, même si le suffixe hébreu est à la deuxième personne du pluriel.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: au milieu des fils d’Israël
  rationale: La traduction conserve l’expression masculine בְּנֵי יִשְׂרָאֵל et rend בְּתוֹךְ de manière formellement proche.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: ils ne recevront aucun patrimoine
  rationale: Le cognat hébreu souligne l’absence de part territoriale héréditaire. Une reproduction comme « hériter d’un héritage » serait peu naturelle en français; « aucun patrimoine » communique clairement le sens foncier dans ce contexte.
theological_decisions:
- issue: Sens de נשא עון dans la responsabilité cultuelle des Lévites
  choice: porteront la responsabilité de leur faute
  alternative: porteront leur faute / supporteront les conséquences de leur faute
  rationale: L’idiome peut viser la culpabilité elle-même, la responsabilité qui en découle ou ses conséquences. La traduction ne réduit pas arbitrairement cette amplitude à la seule peine.
- issue: Passage du singulier הַלֵּוִי au pluriel וְהֵם
  choice: le Lévite lui-même… les Lévites
  alternative: le Lévite lui-même… ils
  rationale: Le texte passe d’un singulier collectif au pluriel. La répétition explicite du référent en français évite que « ils » soit compris comme visant un autre groupe, sans changer le référent du texte.
- issue: Nature de l’héritage refusé aux Lévites
  choice: aucun patrimoine
  alternative: aucun héritage / aucune part d’héritage
  rationale: Dans le contexte de Nombres 18, נַחֲלָה vise la possession héréditaire, notamment territoriale. « Patrimoine » laisse ce cadre perceptible sans ajouter explicitement « terre », absent de ce verset.
translation_notes:
  register: Français international moderne, digne et lisible. Le registre juridique et cultuel est maintenu sans tournures inutilement archaïques. Les ambiguïtés de l’idiome נשא עון sont signalées en note, et l’expression « fils d’Israël » conserve la forme genrée de l’hébreu.
