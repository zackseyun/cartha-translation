    rationale: Cette expression peut désigner la faute, la culpabilité, la responsabilité ou les conséquences associées. La formulation proposée privilégie la responsabilité; « porteront leur faute » préserve mieux l’amplitude de l’idiome, avec explication en note.
  - severity: medium
    issue: « ne recevront aucun patrimoine » ne rend pas directement le verbe hébreu « hériter » ni son redoublement avec « héritage ».
    rationale: Le contexte concerne certes une part héréditaire, mais le texte emploie explicitement la racine de l’héritage. « N’auront aucune part d’héritage » est naturel en français et permet une note sur la répétition formelle.
  - severity: low
