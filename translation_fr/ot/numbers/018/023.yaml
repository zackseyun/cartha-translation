  to: Mais le Lévite lui-même accomplira le service de la tente de la Rencontre, et les Lévites porteront leur faute.[a] Ce sera une prescription perpétuelle pour toutes vos générations. Parmi les fils d’Israël,[b] ils n’auront aucune part d’héritage.[c]
