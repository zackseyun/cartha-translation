review_pass:
  verdict: revise
  source_fidelity: La traduction suit correctement la structure légale du verset, le singulier collectif « le Lévite » suivi du pluriel, et la fonction cultuelle. Toutefois, « responsabilité de leur faute » explicite une facette possible de נשא עון et réduit l’ambiguïté entre faute, culpabilité et conséquences. « Ils ne recevront aucun patrimoine » s’éloigne aussi du verbe « hériter » et du redoublement hébreu. La révision conserve ces éléments sans produire un français artificiel.
  naturalness: « Accomplira le service de la tente de la Rencontre » et « pour toutes vos générations » sont naturels dans un français moderne de registre juridique et cultuel. « Ils n’auront aucune part d’héritage » est plus idiomatique que la répétition littérale « hériter d’un héritage », tout en laissant celle-ci signalée en note.
  terminology: « Tente de la Rencontre », « faute », « prescription perpétuelle », « fils d’Israël » et « part d’héritage » sont cohérents avec le registre biblique moderne. Les notes distinguent l’alternative pour « fils d’Israël » de celle qui explique le redoublement « hériter / héritage ».
