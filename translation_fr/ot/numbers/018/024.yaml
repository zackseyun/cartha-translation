  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: fr
  text: 'Car j’ai donné aux Lévites comme héritage la dîme des Israélites, qu’ils mettent à part pour le SEIGNEUR comme contribution. C’est pourquoi je leur ai dit : « Ils ne recevront pas d’héritage parmi les Israélites. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר (maʿśar)
  choice: dîme
  rationale: Terme français courant et précis pour le dixième prélevé selon la prescription cultuelle.
- source_word: יָרִימוּ (yārîmû)
  choice: prélèvent
  rationale: Le verbe signifie littéralement « élever » et, dans ce contexte cultuel, désigne la mise à part d’une portion offerte; « prélèvent » rend naturellement cette action sans la réduire au seul geste physique.
- source_word: תְּרוּמָה (terûmâ)
  choice: contribution
  rationale: Rend l’idée d’une part prélevée et remise au sanctuaire, tout en évitant de confondre ce terme avec les sacrifices proprement dits.
- source_word: נַחֲלָה (naḥălâ)
  choice: héritage
  rationale: 'Conserve la répétition et le contraste du texte : la dîme constitue l’héritage des Lévites, qui n’ont pas d’héritage territorial parmi les autres Israélites.'
- source_word: בְּנֵי יִשְׂרָאֵל (bənê yiśrāʾēl)
  choice: Israélites
  rationale: Équivalent naturel en français moderne de l’expression littérale « fils d’Israël » dans ce contexte collectif.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit la convention française largement reconnue qui représente le tétragramme par « SEIGNEUR » en capitales, sans imposer une vocalisation reconstruite.
- issue: Nature de l’héritage lévitique
  choice: Maintien du même mot « héritage » dans les deux propositions
  alternative: « revenu » dans la première proposition et « territoire » dans la seconde
  rationale: Le texte hébreu emploie deux fois נַחֲלָה et construit un contraste théologique intentionnel. La traduction préserve ce lien sans expliciter plus que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la causalité (« Car »), le contraste entre les deux emplois d’« héritage » et le passage du discours à la première personne à la déclaration sur les Lévites à la troisième personne.
