revisions:
- from: 'Car j’ai donné aux Lévites, comme héritage, la dîme des Israélites, celle qu’ils prélèvent pour le SEIGNEUR à titre de contribution. C’est pourquoi j’ai dit à leur sujet : « Ils ne recevront pas d’héritage parmi les Israélites. »'
  to: 'Car j’ai donné aux Lévites comme héritage la dîme des Israélites, qu’ils mettent à part pour le SEIGNEUR comme contribution. C’est pourquoi je leur ai dit : « Ils ne recevront pas d’héritage parmi les Israélites. »'
  rationale: La révision corrige le destinataire de « j’ai dit » conformément à l’hébreu, tout en conservant le contraste intentionnel entre les deux occurrences d’« héritage ». Elle rend également de manière plus transparente la dîme que les Israélites mettent à part pour le SEIGNEUR comme contribution.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:49:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est juste : la dîme des Israélites est donnée aux Lévites comme héritage, tandis qu’ils n’ont pas d’héritage parmi les Israélites. Toutefois, « j’ai dit à leur sujet » traduit « à leur sujet » plutôt que לָהֶם (« je leur ai dit »). La formulation de la contribution peut aussi rendre plus explicitement la mise à part pour le SEIGNEUR.'
  naturalness: Le français est clair et de registre approprié. « Je leur ai dit » est à la fois plus direct et plus fidèle. « Qu’ils mettent à part pour le SEIGNEUR comme contribution » est naturel et explicite sans alourdir le texte.
  terminology: « Lévites », « dîme », « contribution », « héritage », « Israélites » et « SEIGNEUR » conviennent. La répétition de « héritage » doit être conservée, comme dans l’hébreu.
  issues:
  - severity: medium
    issue: « à leur sujet » au lieu de « je leur ai dit »
    rationale: Le pronom להם est le destinataire de la déclaration divine (« à eux »), non un complément signifiant « à leur sujet ». La correction préserve l’adresse aux Lévites et le discours rapporté.
  - severity: low
    issue: Nuance cultuelle de יָרִימוּ et תְּרוּמָה
    rationale: « prélèvent pour le SEIGNEUR à titre de contribution » est possible, mais « mettent à part pour le SEIGNEUR comme contribution » exprime plus nettement l’offrande mise à part, sans imposer le geste littéral d’« élever ».
  revised_text: 'Car j’ai donné aux Lévites comme héritage la dîme des Israélites, qu’ils mettent à part pour le SEIGNEUR comme contribution. C’est pourquoi je leur ai dit : « Ils ne recevront pas d’héritage parmi les Israélites. »'
  revised_footnotes: []
  revision_rationale: La révision corrige le destinataire de « j’ai dit » conformément à l’hébreu, tout en conservant le contraste intentionnel entre les deux occurrences d’« héritage ». Elle rend également de manière plus transparente la dîme que les Israélites mettent à part pour le SEIGNEUR comme contribution.
