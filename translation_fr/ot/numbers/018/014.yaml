  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: fr
  text: Tout ce qui est voué à Dieu en Israël sera à toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qui est frappé d’interdit en Israël ». Le mot hébreu désigne ce qui est irrévocablement voué à Dieu et peut, selon le contexte, être voué à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Tout ce qui
  rationale: Avec le nom collectif singulier חֵרֶם, cette formulation exprime naturellement en français la totalité de la catégorie.
- source_word: חֵרֶם
  choice: ce qui est voué à Dieu
  rationale: Le terme désigne ce qui est irrévocablement consacré et soustrait à l’usage ordinaire; la mention de Dieu explicite en français le destinataire implicite de cette consécration sans imposer dans le texte principal l’idée de destruction, qui dépend du contexte.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition בְּ marque ici le cadre ou la sphère dans laquelle s’applique cette disposition.
- source_word: לְךָ
  choice: à toi
  rationale: Le לְ avec suffixe exprime l’attribution à Aaron; « sera à toi » conserve directement la construction hébraïque et son sens juridique.
- source_word: יִהְיֶה
  choice: sera
  rationale: L’imparfait de היה exprime ici une attribution prescrite; le futur français convient au registre législatif sans l’archaïsme de « appartiendra de droit ».
theological_decisions:
- issue: Sens du terme cultuel et juridique חֵרֶם
  choice: ce qui est voué à Dieu
  alternative: tout ce qui est frappé d’interdit en Israël
  rationale: חֵרֶם peut désigner une chose irrévocablement vouée à Dieu et, selon le contexte, vouée à la destruction. Le texte principal retient le sens général adapté à l’attribution sacerdotale, tandis que la note préserve le sens plus fort sans trancher une ambiguïté réelle du terme.
translation_notes:
  register: Français international moderne, clair et digne. La formulation concise conserve le ton juridique du passage; le tutoiement correspond à l’adresse directe à Aaron.
