  variant: modern international French
source:
  edition: WLC
  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: fr
  text: Tu le mangeras dans un lieu très saint[a] ; tout homme pourra en manger. Il sera saint pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le Saint des saints ». Ici, l’expression désigne le lieu très saint prévu pour ce repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: dans un lieu très saint
  rationale: Cette formulation conserve la valeur locative de בְּ et rend naturellement en français le superlatif hébreu. Elle évite de laisser entendre que le repas devait avoir lieu dans le sanctuaire intérieur lui-même.
- source_word: תֹּאכֲלֶנּוּ
  choice: Tu le mangeras
  rationale: Le futur français convient au registre prescriptif de cette instruction adressée à Aaron au singulier et conserve le pronom objet masculin singulier.
- source_word: כָּל זָכָר
  choice: tout homme
  rationale: Dans ce contexte humain et sacerdotal, « homme » exprime naturellement en français la restriction aux personnes de sexe masculin sans la connotation animale que pourrait avoir « tout mâle ».
- source_word: יֹאכַל אֹתוֹ
  choice: pourra en manger
  rationale: Le verbe modal exprime ici l'autorisation accordée à chaque homme qualifié. Le pronom « en » évite une répétition lourde tout en renvoyant clairement à la part très sainte.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: Il sera saint pour toi
  rationale: « Saint » maintient le lien lexical avec le vocabulaire cultuel de la sainteté, et « pour toi » préserve l'adresse singulière à Aaron.
theological_decisions:
- issue: Destinataire et portée de l'instruction sacerdotale
  choice: Conserver l'adresse singulière à Aaron, puis énoncer l'autorisation plus générale accordée à tout homme qualifié.
  alternative: Comprendre la forme singulière comme visant exclusivement Aaron lui-même.
  rationale: Le contexte immédiat traite des parts sacerdotales données à Aaron et à ses fils. Le singulier est donc préservé sans restreindre indûment l'autorisation à Aaron seul.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple porte la valeur prescriptive de la législation, tandis que « pourra » marque explicitement l'autorisation.
