source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: fr
  text: Quant aux fils de Lévi, voici que je leur ai donné toute la dîme en Israël[a] comme héritage, en échange[b] du service qu’ils accomplissent, à savoir le service de la tente de la Rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les dîmes en Israël ». Le singulier hébreu peut être compris collectivement ou distributivement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en compensation de »; le terme hébreu exprime une contrepartie et peut aussi avoir le sens de « à la place de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  choice: Quant aux fils de Lévi
  rationale: Cette formulation conserve l’expression généalogique littérale « fils de Lévi » tout en rendant naturellement en français le changement de destinataire marqué par וְלִ.
- source_word: הִנֵּה
  choice: voici que
  rationale: « Voici que » maintient la valeur présentative et emphatique du terme sans recourir au plus archaïque « voici » isolé ou à « voyez ».
- source_word: נָתַתִּי
  choice: je leur ai donné
  rationale: Le passé composé exprime le don établi par Dieu; le pronom « leur » explicite en français le complément placé en tête dans « aux fils de Lévi ».
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: toute la dîme en Israël
  rationale: Le singulier « la dîme » peut avoir ici une valeur collective, tandis que כָּל indique sa totalité. La note signale la lecture distributive également possible.
- source_word: לְנַחֲלָה
  choice: comme héritage
  rationale: נַחֲלָה désigne une part attribuée en héritage ou possession; « comme héritage » conserve le cadre juridique de l’allocation.
- source_word: חֵלֶף
  choice: en échange
  rationale: Le terme exprime une contrepartie ou une compensation. « En échange » préserve cette relation sans réduire le don à un simple salaire commercial.
- source_word: עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים
  choice: du service qu’ils accomplissent
  rationale: Cette tournure rend le nom et le verbe de même racine sans produire en français la répétition maladroite « du service qu’ils servent ».
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: le service de la tente de la Rencontre
  rationale: La traduction conserve la chaîne nominale hébraïque et l’appellation traditionnelle intelligible du sanctuaire, sans introduire le vocabulaire ecclésial de « ministère ».
theological_decisions:
- issue: Rapport entre la dîme, l’héritage des Lévites et leur service
  choice: La dîme est donnée aux fils de Lévi comme héritage et en contrepartie de leur service.
  alternative: La dîme leur est simplement attribuée, sans que la notion de contrepartie soit mise en relief.
  rationale: Le texte associe explicitement לְנַחֲלָה (« comme héritage ») et חֵלֶף עֲבֹדָתָם (« en échange de leur service »). La traduction maintient ces deux dimensions sans préciser au-delà du verset comment cet héritage se rapporte à une éventuelle possession territoriale.
translation_notes:
  register: Français international moderne, digne et accessible. « Fils de Lévi » préserve la formulation généalogique; « tente de la Rencontre » emploie une désignation biblique française largement reconnaissable. La syntaxe reste proche de l’enchaînement hébreu tout en évitant les répétitions peu naturelles.
