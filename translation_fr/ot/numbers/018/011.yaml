  variant: modern international French
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: fr
  text: 'Et ceci est à toi : la part prélevée sur leurs dons[a], avec toutes les offrandes de balancement des fils d’Israël. Je te les ai données, à toi ainsi qu’à tes fils et à tes filles qui sont avec toi, comme une prescription permanente. Toute personne de ta maison qui est pure[b] peut en manger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « l’offrande prélevée sur leurs dons ». Le terme hébreu désigne une part mise à part pour un usage sacré.
    reason: lexical_alternative
  - marker: b
    text: Ici, « pure » signifie rituellement pure, et non simplement propre physiquement ou moralement droite.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: la part prélevée sur leurs dons
  rationale: תְּרוּמָה désigne ici une part mise à part pour un usage sacré, tandis que מַתָּנָם signifie « leurs dons ». « Part prélevée » rend le caractère cultuel sans employer un terme français obscur.
- source_word: תְּנוּפֹת
  choice: offrandes présentées
  rationale: Le terme désigne des offrandes rituellement présentées, traditionnellement par un geste de balancement. Cette formulation reste naturelle en français, et la note conserve le détail du rite.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation collective explicite de l’hébreu est conservée plutôt que neutralisée en « Israélites ».
- source_word: נְתַתִּים
  choice: Je te les ai données
  rationale: L’accompli exprime une attribution déjà établie et toujours valable; le féminin pluriel s’accorde avec les offrandes en français.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: à toi ainsi qu’à tes fils et à tes filles qui sont avec toi
  rationale: La traduction conserve la mention distincte des fils et des filles et rattache naturellement « avec toi » aux membres de la maison d’Aaron.
- source_word: לְחָק עוֹלָם
  choice: comme une prescription permanente
  rationale: חֹק évoque une règle ou part fixée, et עוֹלָם sa durée continue dans l’ordre prescrit. « Prescription permanente » garde la force juridique dans un français actuel.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: Toute personne de ta maison qui est pure
  rationale: Le singulier collectif inclut toute personne du foyer remplissant la condition de pureté. Une note précise que cette pureté est rituelle.
- source_word: יֹאכַל אֹתוֹ
  choice: peut en manger
  rationale: L’inaccompli exprime ici l’autorisation. Le pronom adverbial « en » renvoie naturellement, en français, aux portions offertes mentionnées auparavant.
theological_decisions:
- issue: Nature de la pureté requise
  choice: « pure » au sens rituel, avec clarification en note
  alternative: « rituellement pure » directement dans le texte
  rationale: Le contexte sacerdotal concerne l’aptitude rituelle à consommer les portions saintes, non une pureté simplement physique ou une rectitude morale. Le texte principal conserve toutefois le terme bref et récurrent de « pure ».
- issue: Portée de עוֹלָם
  choice: « permanente »
  alternative: « éternelle » ou « perpétuelle »
  rationale: Dans cette prescription cultuelle, le terme marque une validité durable au sein de l’ordre d’alliance; « permanente » préserve cette force sans imposer une conclusion théologique sur sa durée absolue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la structure d’attribution du texte hébreu, tout en employant des expressions cultuelles compréhensibles. Les marqueurs de notes [a] et [b] figurent dans le texte principal.
