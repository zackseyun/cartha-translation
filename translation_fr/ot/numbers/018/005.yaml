id: NUM.18.5
reference: Numbers 18:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: fr
  text: Vous assurerez la garde du sanctuaire et la garde de l’autel, afin qu’il n’y ait plus de colère contre les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « le peuple d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: Préciser le sens collectif de l’expression hébraïque tout en signalant des équivalents français plus idiomatiques.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: Vous assurerez la garde
  rationale: La tournure rend l’association de שׁמר et מִשְׁמֶרֶת, qui exprime ici la responsabilité officielle de garder et de veiller sur ce qui est sacré. Le futur français conserve la valeur prescriptive de l’hébreu.
- source_word: הַקֹּדֶשׁ
  choice: du sanctuaire
  rationale: Dans ce contexte sacerdotal, et en parallèle avec l’autel, le terme désigne le lieu ou domaine sacré plutôt que la sainteté abstraite.
- source_word: מִשְׁמֶרֶת הַמִּזְבֵּחַ
  choice: la garde de l’autel
  rationale: La répétition de « garde » reproduit celle de מִשְׁמֶרֶת et souligne les deux responsabilités confiées.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: afin qu’il n’y ait plus
  rationale: Cette formulation naturelle exprime la relation de but ou de résultat suggérée par le contexte, tandis que « plus » rend עוֹד.
- source_word: קֶצֶף
  choice: colère
  rationale: « Colère » convient au jugement divin dans un français moderne et digne, sans ajouter explicitement « de Dieu », absent de la proposition hébraïque.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression hébraïque concrète, tout en indiquant en note son sens collectif.
theological_decisions:
- issue: Rapport entre la garde sacerdotale et l’absence future de colère
  choice: 'Lecture finale : « afin qu’il n’y ait plus »'
  alternative: 'Simple conséquence ou prédiction : « et il n’y aura plus »'
  rationale: Le contexte relie les responsabilités cultuelles à la prévention d’un nouveau jugement. « Afin que » rend cette logique sans préciser davantage le mécanisme théologique.
- issue: Origine de la colère
  choice: Laisser « colère » sans complément explicite
  alternative: Ajouter « la colère de Dieu »
  rationale: Le contexte permet de comprendre qu’il s’agit de la colère divine, mais le texte hébreu ne nomme pas Dieu dans cette proposition; la traduction respecte cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « garde » conserve la structure sacerdotale du texte; « assurer la garde » évite le tour moins naturel « garder la garde ».
