source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/כָל מָק֔וֹם אַתֶּ֖ם וּ/בֵֽיתְ/כֶ֑ם כִּֽי שָׂכָ֥ר הוּא֙ לָ/כֶ֔ם חֵ֥לֶף עֲבֹֽדַתְ/כֶ֖ם בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: fr
  text: Vous pourrez[a] le manger en n’importe quel lieu, vous et votre maisonnée[b], car c’est votre rémunération[c] en échange de votre service dans la tente de la Rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous le mangerez ». Dans ce contexte juridique, la forme hébraïque peut exprimer une instruction ou une permission, plutôt qu’un simple passé.'
    reason: lexical_alternative
  - marker: b
    text: La « maisonnée » désigne ici l’ensemble du foyer, et non la maison en tant que bâtiment.
    reason: cultural_note
  - marker: c
    text: Ou « salaire », « rétribution » ou « compensation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: Vous pourrez le manger
  rationale: Dans ce contexte juridique, la forme hébraïque exprime une permission ou une disposition normative plutôt qu’un simple passé. Le futur modal français rend naturellement cette permission.
- source_word: בְּכָל מָקוֹם
  choice: en n’importe quel lieu
  rationale: L’expression indique que la consommation n’est pas limitée à l’enceinte du sanctuaire et conserve la portée distributive de l’hébreu.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: vous et les membres de votre maisonnée
  rationale: בַּיִת désigne ici l’unité domestique, et non le bâtiment. Cette formulation explicite le sens sans le réduire à la seule famille biologique.
- source_word: כִּי שָׂכָר הוּא לָכֶם
  choice: car c’est votre rémunération
  rationale: שָׂכָר désigne la rétribution reçue pour un travail. « Rémunération » convient au registre juridique et évite de suggérer une récompense purement honorifique.
- source_word: חֵלֶף עֲבֹדַתְכֶם
  choice: en échange de votre service
  rationale: חֵלֶף marque ici la contrepartie, tandis que עֲבֹדָה désigne le service cultuel assigné aux lévites.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: La traduction suit la préposition hébraïque et rend l’appellation cultuelle de manière transparente et cohérente.
theological_decisions:
- issue: Nature de la part attribuée aux lévites
  choice: Le texte présente cette nourriture comme une contrepartie légitime de leur service et permet de la consommer hors d’un lieu sacré déterminé.
  alternative: Comprendre cette part comme un repas sacré soumis à une restriction de lieu.
  rationale: La formule בְּכָל מָקוֹם, « en n’importe quel lieu », écarte explicitement une restriction au sanctuaire, sans pour autant nier l’origine cultuelle de cette part.
translation_notes:
  register: Français international moderne, clair et digne. Le futur modal « pourrez » exprime la permission juridique. « Maisonnée » conserve la portée domestique de בַּיִת, avec une note explicative. Les marqueurs de notes sont placés immédiatement après les termes concernés.
