  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: fr
  text: Ils se joindront à toi et s’acquitteront de la charge de la tente de la Rencontre, pour tout le service de la tente. Mais aucune personne non autorisée[a] ne s’approchera de vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est souvent rendu par « étranger ». Ici, il désigne une personne qui n’est pas habilitée à exercer une fonction ou à s’approcher du sanctuaire, et non nécessairement une personne d’origine étrangère.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: Ils se joindront à toi
  rationale: Le nifal de לוה avec עַל exprime ici le fait de s’attacher à Aaron pour l’assister dans le service; cette formulation française conserve le rapport personnel et fonctionnel.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: s’acquitteront de la charge
  rationale: Dans ce contexte sacerdotal, שׁמר avec מִשְׁמֶרֶת désigne l’accomplissement fidèle d’une responsabilité confiée, et pas seulement une garde physique.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Désignation française claire et consacrée du sanctuaire; la majuscule signale qu’il s’agit d’un nom cultuel.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: pour tout le service de la tente
  rationale: עֲבֹדָה désigne ici l’ensemble du service assigné concernant le sanctuaire; « service » en conserve la nuance cultuelle.
- source_word: וְזָר
  choice: Mais aucune personne non autorisée
  rationale: זָר désigne dans cette législation une personne extérieure au rôle cultuel permis, sans nécessairement évoquer une origine ethnique étrangère. « Mais » rend naturellement le contraste porté par וְ.
- source_word: לֹא יִקְרַב אֲלֵיכֶם
  choice: ne s’approchera de vous
  rationale: קרב exprime l’approche dans la proximité sacrée; le pluriel de אֲלֵיכֶם est préservé par « vous ».
theological_decisions:
- issue: Sens de זָר dans la législation du sanctuaire
  choice: personne non autorisée, extérieure au rôle sacerdotal ou lévitique permis
  alternative: étranger; personne étrangère au service
  rationale: Le contexte porte sur l’accès et les fonctions cultuelles, non sur l’appartenance ethnique. La traduction évite donc de faire de l’origine étrangère le motif de l’exclusion.
translation_notes:
  register: Français international moderne, digne et accessible. « S’acquitter de la charge » maintient la notion de responsabilité confiée sans réduire מִשְׁמֶרֶת à une simple surveillance physique.
