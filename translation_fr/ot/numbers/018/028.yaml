  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: fr
  text: Ainsi, vous prélèverez, vous aussi, la contribution de Yahweh sur toutes les dîmes que vous recevrez des fils d’Israël[a], et vous en donnerez la contribution de Yahweh à Aaron, le prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites ». L’hébreu dit littéralement « des fils d’Israël ».
    reason: Alternative lexicale permettant un français plus idiomatique tout en signalant la forme exacte de l’hébreu.
lexical_decisions:
- source_word: כֵּן
  choice: Ainsi
  rationale: Introduit cette instruction comme correspondant à celle qui précède, dans un français naturel et soutenu.
- source_word: תָּרִימוּ
  choice: vous prélèverez
  rationale: Le hiphil de רום associé à תְּרוּמָה désigne ici l’action de mettre à part une portion; « prélever » exprime clairement qu’elle est prise sur les dîmes reçues.
- source_word: גַם אַתֶּם
  choice: vous aussi
  rationale: Souligne que les Lévites doivent eux aussi mettre à part une contribution, comme les autres Israélites.
- source_word: תְּרוּמַת יְהוָה
  choice: la contribution de Yahweh
  rationale: « Contribution » conserve l’idée générale d’une portion mise à part sans la réduire à un sacrifice; le génitif garde ouverte la nuance d’appartenance ou de destination.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: sur toutes les dîmes
  rationale: « Dîmes » est le terme français établi pour מַעֲשֵׂר; « sur » rend naturellement le prélèvement effectué à partir de chacune d’elles.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: que vous recevrez des fils d’Israël
  rationale: Dans ce contexte réglementaire, « recevoir » exprime mieux que « prendre » la perception légitime des dîmes; « fils d’Israël » préserve la formulation hébraïque.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: et vous en donnerez
  rationale: 'Le pronom « en » rend avec concision le sens partitif: la contribution est donnée à partir de ce qui a été reçu.'
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: à Aaron, le prêtre
  rationale: La préposition indique naturellement le destinataire; l’apposition est conservée dans une syntaxe française claire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: Le corps du texte conserve l’expression hébraïque littérale et sa forme masculine représentative; une note donne l’équivalent français courant.
- issue: Rapport exprimé par תְּרוּמַת יְהוָה
  choice: la contribution de Yahweh
  alternative: la contribution pour Yahweh; l’offrande de Yahweh
  rationale: Le génitif hébreu peut évoquer une portion appartenant ou consacrée à Yahweh; la formulation retenue ne tranche pas inutilement entre ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « contribution de Yahweh » est maintenue pour refléter la structure et l’insistance du texte source; « prélever » et « en donnerez » rendent clairement le mouvement d’une portion tirée des dîmes puis remise à Aaron.
