  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: fr
  text: 'Tu parleras aux Lévites et tu leur diras : « Quand vous recevrez des fils d’Israël[a] la dîme que je vous ai donnée, venant d’eux, comme votre héritage, vous en prélèverez une contribution pour Yahweh[b] : une dîme prise sur la dîme[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites » ou « du peuple d’Israël ». L’hébreu dit littéralement « des fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la contribution de Yahweh »; traditionnellement, « l’offrande élevée de Yahweh ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « une dîme sur la dîme », c’est-à-dire le dixième de la dîme reçue par les Lévites.
    reason: clarification
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française courante et précise des membres de la tribu de Lévi.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: Tu parleras ... et tu leur diras
  rationale: Conserve les deux verbes de la formule hébraïque d’instruction légale, sans lourdeur excessive en français.
- source_word: כִּי תִקְחוּ
  choice: Quand vous recevrez
  rationale: כִּי introduit ici la circonstance d’application du commandement. Dans ce contexte, recevoir exprime naturellement la prise de la dîme remise par les Israélites.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduit l’expression hébraïque genrée tout en signalant en note sa valeur collective possible.
- source_word: הַמַּעֲשֵׂר
  choice: la dîme
  rationale: Terme français établi pour le dixième prélevé dans le cadre cultuel.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם
  choice: que je vous ai donnée, venant d’eux
  rationale: Préserve à la fois le don divin et le fait que la dîme provient des Israélites.
- source_word: בְּנַחֲלַתְכֶם
  choice: comme votre héritage
  rationale: Exprime la part attribuée aux Lévites en guise d’héritage.
- source_word: וַהֲרֵמֹתֶם
  choice: vous en prélèverez
  rationale: Dans ce contexte cultuel, le hiphil de רום désigne l’action de mettre à part et de présenter une portion; « prélever » est clair et convient à une part tirée de la dîme.
- source_word: תְּרוּמַת יְהוָה
  choice: une contribution pour Yahweh
  rationale: תְּרוּמָה désigne une portion prélevée ou une contribution. « Pour Yahweh » rend naturellement sa destination sans recourir à l’expression traditionnelle devenue obscure « offrande élevée ».
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: une dîme prise sur la dîme
  rationale: 'Rend explicitement la valeur partitive de מִן : les Lévites doivent prélever un dixième sur la dîme qu’ils reçoivent.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte hébreu emploie une expression masculine traditionnelle à valeur collective; la traduction formelle est maintenue, et sa portée collective est indiquée en note.
- issue: Rapport exprimé par תְּרוּמַת יְהוָה
  choice: une contribution pour Yahweh
  alternative: la contribution de Yahweh
  rationale: Le génitif hébreu peut être compris comme indiquant l’appartenance ou la destination. Le contexte du prélèvement offert favorise « pour Yahweh », tandis que la note conserve l’autre formulation possible.
translation_notes:
  register: Français international moderne, digne et accessible. La structure d’instruction légale et le passage du singulier adressé à Moïse au pluriel adressé aux Lévites sont conservés. Le vocabulaire cultuel reste précis sans employer de tournures archaïques.
