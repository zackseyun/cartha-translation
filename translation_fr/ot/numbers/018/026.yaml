  source_fidelity: 'Le texte rend fidèlement la syntaxe directive : singulier adressé à Moïse (« Tu parleras »), puis pluriel visant les Lévites (« vous recevrez », « vous prélèverez »). « Quand » restitue bien la valeur circonstancielle de כִּי; « des fils d’Israël », « la dîme », le don divin provenant d’eux, et la valeur partitive de מִן dans « une dîme prise sur la dîme » sont tous conservés. « Contribution pour Yahweh » est une lecture contextuellement recevable de תְּרוּמַת יְהוָה, dont l’autre nuance possible est adéquatement signalée en note.'
