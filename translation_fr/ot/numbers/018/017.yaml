source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: fr
  text: 'Mais tu ne rachèteras pas le premier-né d’un bovin, ni le premier-né d’un mouton, ni le premier-né d’une chèvre : ils sont saints. Tu projetteras leur sang sur l’autel et tu feras brûler leur graisse en offrande par le feu[a], au parfum agréable pour Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « offrande faite par le feu ».'
    reason: Variante française plus explicite du terme cultuel אִשֶּׁה.
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: Introduit une exception restrictive à la règle précédente, avec une tournure française naturelle.
- source_word: בְּכוֹר
  choice: premier-né
  rationale: Rend précisément le premier petit ayant ici un statut cultuel particulier.
- source_word: שׁוֹר
  choice: bovin
  rationale: Le terme désigne ici la catégorie bovine; « bovin » évite le sens moderne plus étroit de « bœuf », animal mâle castré.
- source_word: כֶּשֶׂב
  choice: mouton
  rationale: Dans cette énumération d’espèces, le terme renvoie de façon générique à un ovin plutôt qu’à un agneau d’âge déterminé.
- source_word: עֵז
  choice: chèvre
  rationale: Désigne la catégorie caprine dans la liste des animaux sacrificiels.
- source_word: לֹא תִפְדֶּה
  choice: tu ne rachèteras pas
  rationale: פדה exprime ici le rachat cultuel par paiement ou substitution; « racheter » est le terme juridique et religieux naturel en français.
- source_word: קֹדֶשׁ הֵם
  choice: ils sont saints
  rationale: Conserve le vocabulaire cultuel et la déclaration qui justifie l’interdiction de les racheter.
- source_word: תִּזְרֹק
  choice: tu projetteras
  rationale: זרק décrit l’action de lancer ou projeter le sang contre ou sur l’autel; cette traduction évite de réduire le geste à une fine aspersion.
- source_word: חֶלְבָּם תַּקְטִיר
  choice: tu feras brûler leur graisse
  rationale: Dans le rituel sacrificiel, קטר au hifil désigne la combustion sur l’autel des parties grasses réservées.
- source_word: אִשֶּׁה
  choice: offrande consumée par le feu
  rationale: Rend explicitement le caractère igné de l’offrande sans introduire l’idée moins certaine de nourriture.
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable
  rationale: Expression cultuelle indiquant une odeur favorablement reçue; cette formulation est claire et digne en français contemporain.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme; « Yahweh » conserve le nom personnel de l’alliance plutôt que de le remplacer par un titre.
- issue: Sens cultuel de אִשֶּׁה
  choice: offrande consumée par le feu
  alternative: offrande faite par le feu
  rationale: Le terme désigne une offrande présentée au moyen du feu. Le rendu choisi reste proche de l’image sacrificielle sans trancher au-delà de ce que permet le contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les formes verbales hébraïques adressées au prêtre. Le vocabulaire cultuel reste précis sans archaïsme inutile; le marqueur [a] est placé immédiatement après l’expression qu’il explique.
