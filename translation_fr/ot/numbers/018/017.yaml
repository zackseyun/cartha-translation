revisions:
- from: 'Mais tu ne rachèteras pas le premier-né d’un bovin, ni le premier-né d’un mouton, ni le premier-né d’une chèvre : ils sont saints. Tu projetteras leur sang sur l’autel et tu feras brûler leur graisse en offrande consumée par le feu[a], dont l’odeur est agréable à Yahweh.'
  to: 'Mais tu ne rachèteras pas le premier-né d’un bovin, ni le premier-né d’un mouton, ni le premier-né d’une chèvre : ils sont saints. Tu projetteras leur sang sur l’autel et tu feras brûler leur graisse en offrande par le feu[a], au parfum agréable pour Yahweh.'
  rationale: La révision conserve le sens sacrificiel et les choix lexicaux solides du projet, tout en remplaçant une expression susceptible de surinterpréter la combustion et en rétablissant une articulation française plus proche des deux expressions cultuelles hébraïques coordonnées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:58:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement l’interdiction de rachat, le statut sacré des premiers-nés, l’application de leur sang sur l’autel, la combustion de leur graisse et la formule cultuelle finale. « Offrande consumée par le feu » est toutefois légèrement imprécis et syntaxiquement mal rattaché : אִשֶּׁה qualifie l’acte sacrificiel comme offrande présentée par le feu, sans nécessairement exprimer que l’offrande entière est « consumée ».'
  naturalness: Le français est globalement clair et de registre approprié. La séquence « en offrande consumée par le feu, dont l’odeur est agréable » est néanmoins lourde et son relatif laisse un antécédent imprécis. « En offrande par le feu, au parfum agréable pour Yahweh » rend plus naturellement la construction appositionnelle hébraïque.
  terminology: « Racheter », « premier-né », « saints », « autel », « graisse » et « Yahweh » conviennent au registre cultuel. « Bovin » est acceptable pour la catégorie générique de שׁוֹר. La note doit correspondre au nouveau rendu principal de אִשֶּׁה.
  issues:
