  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: fr
  text: Les prémices de tout ce qui se trouve dans leur pays et qu’ils apportent à Yahweh seront à toi. Toute personne pure[a] de ta maison pourra en manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire rituellement pure.
    reason: Précise le sens cultuel de טָהוֹר dans ce contexte sacerdotal.
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: les prémices
  rationale: Terme français courant dans le registre biblique pour les premiers produits consacrés d’une récolte; il reste concis et respecte le contexte cultuel.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: de tout ce qui se trouve dans leur pays
  rationale: Cette formulation conserve la portée générale de כָּל אֲשֶׁר et rend explicitement, sans la restreindre, la relation locative exprimée par בְּאַרְצָם.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: qu’ils apporteront à Yahweh
  rationale: Le verbe est rendu dans son sens direct, «apporter», sans ajouter le mot «offrande», que le contexte implique déjà.
- source_word: לְךָ יִהְיֶה
  choice: seront à toi
  rationale: Expression française naturelle de l’attribution à Aaron; l’accord pluriel suit «les prémices» en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Transcription claire du nom divin יהוה, conforme à la couche de consultation anglaise fournie et sans le remplacer par un titre.
- source_word: כָּל טָהוֹר
  choice: toute personne pure
  rationale: Le substantif «personne» explicite naturellement l’emploi substantivé de l’adjectif, tandis que «pure» préserve dans le texte l’expression brève de l’hébreu.
- source_word: בְּבֵיתְךָ
  choice: dans ta maison
  rationale: Rendu proche de l’hébreu, où «maison» englobe ici la maisonnée d’Aaron.
- source_word: יֹאכֲלֶנּוּ
  choice: pourra en manger
  rationale: Le futur modal exprime l’autorisation ou le droit de consommer cette part; le pronom «en» reprend naturellement les prémices, collectif pluriel en français.
theological_decisions:
- issue: Sens de «pure» dans la législation sacerdotale
  choice: La personne rituellement pure de la maison d’Aaron peut manger cette part.
  alternative: Une personne moralement pure au sens général peut en manger.
  rationale: Le contexte sacerdotal de Nombres 18 favorise nettement la pureté rituelle, mais le texte principal conserve le terme bref «pure» et la note en précise le sens cultuel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en employant des tournures naturelles; «prémices» conserve le vocabulaire cultuel traditionnel encore compréhensible. Le marqueur [a] est placé après «pure», le terme auquel la note se rapporte.
