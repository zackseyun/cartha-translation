  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : les prémices apportées à Yahweh sont attribuées à Aaron, et les membres rituellement purs de sa maisonnée peuvent les consommer. « Leur pays » correspond à בְּאַרְצָם et « prémices » rend correctement בִּכּוּרֵי. Une formulation au présent (« qu’ils apportent ») reflète plus naturellement la portée générale de l’imparfait dans cette prescription.'
