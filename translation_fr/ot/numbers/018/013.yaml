    rationale: Le futur est possible dans un texte normatif, mais le présent « apportent » rend mieux l’action habituelle ou réglementée exprimée par l’imparfait hébreu et allège la phrase française.
  revised_text: Les prémices de tout ce qui se trouve dans leur pays et qu’ils apportent à Yahweh seront à toi. Toute personne pure[a] de ta maison pourra en manger.
