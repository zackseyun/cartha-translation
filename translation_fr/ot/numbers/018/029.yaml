  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: fr
  text: 'De tous vos dons, vous prélèverez toute la contribution pour Yahweh : de toute leur meilleure part, vous en prélèverez la part consacrée.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « de toute sa graisse ». Dans ce contexte, « graisse » désigne la part la plus riche ou la meilleure.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: Sur tous les dons que vous recevrez
  rationale: מִן avec כֹּל exprime ici le prélèvement effectué sur l’ensemble des dons. L’ajout contextuel « que vous recevrez » rend explicite en français que les dons sont ceux remis aux Lévites, sans changer leur nature.
- source_word: תָּרִימוּ
  choice: vous prélèverez
  rationale: Le hiphil de רוּם appartient au vocabulaire cultuel de la contribution mise à part. « Prélever » exprime naturellement en français l’action de retirer une portion d’un ensemble, tout en conservant l’idée de séparation rituelle.
- source_word: כָּל תְּרוּמַת יְהוָה
  choice: toute contribution destinée à Yahweh
  rationale: תְּרוּמָה désigne une contribution prélevée et consacrée. « Destinée à » rend clairement l’orientation de cette part vers Yahweh sans imposer une possession ambiguë.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, conformément à sa présence explicite dans le texte hébreu.
- source_word: מִכָּל חֶלְבּוֹ
  choice: sur tout ce qu’ils ont de meilleur
  rationale: חֵלֶב signifie littéralement « graisse », mais désigne par extension la partie la plus riche ou la meilleure. Le pluriel « ils » reprend naturellement « les dons » en français.
- source_word: אֶת מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: vous en prélèverez la part sainte
  rationale: מִקְדָּשׁ désigne ici la portion consacrée, et מִמֶּנּוּ indique qu’elle est tirée de ce meilleur ensemble. La reformulation évite le calque maladroit « sa part sainte, d’elle » tout en gardant la relation de prélèvement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même; « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Sens cultuel de תְּרוּמָה et מִקְדָּשׁ
  choice: contribution destinée à Yahweh / part sainte
  alternative: offrande de Yahweh / part consacrée
  rationale: Ces expressions indiquent qu’une portion des dons est mise à part pour Yahweh sans préciser davantage son statut ou son usage que ne le fait le verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Prélever » est employé comme terme concret et cultuel; la répétition du verbe clarifie la syntaxe hébraïque dense. Le marqueur [a] figure dans le texte.
