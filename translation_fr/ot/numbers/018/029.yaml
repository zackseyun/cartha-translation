revisions:
- from: 'Sur tous les dons que vous recevrez, vous prélèverez toute contribution destinée à Yahweh : sur tout ce qu’ils ont de meilleur, vous en prélèverez la part sainte.[a]'
  to: 'De tous vos dons, vous prélèverez toute la contribution pour Yahweh : de toute leur meilleure part, vous en prélèverez la part consacrée.[a]'
  rationale: La révision rétablit « de tous » pour le sens de prélèvement à partir d’un ensemble, retire l’ajout « que vous recevrez », et conserve une syntaxe française claire en explicitant par « vous en prélèverez » le rapport final de provenance. La note est corrigée pour ne porter que sur l’alternative lexicale attestée par חֵלֶב.
