review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est juste : les Lévites doivent prélever, sur l’ensemble des dons qui leur reviennent, la contribution due à Yahweh, en la prenant sur la meilleure part. Toutefois, « sur tous les dons » affaiblit le sens source de מִכֹּל (« de/parmi tous les dons »), et « que vous recevrez » ajoute une précision temporelle absente du verset. La note présente en outre une rétroversion littérale inexacte et peu compréhensible des suffixes hébreux.'
  naturalness: « Prélever » et « part consacrée » sont naturels dans un français moderne de registre cultuel. La reprise « ils » pour « les dons » est grammaticalement possible, mais la formulation révisée rend la relation entre les dons, leur meilleure part et la portion consacrée plus lisible.
  terminology: « Yahweh » rend correctement le tétragramme. « Contribution pour Yahweh » rend sobrement תְּרוּמַת יְהוָה sans imposer une interprétation institutionnelle. « Meilleure part » communique adéquatement le sens contextuel de חֵלֶב; « part consacrée » rend le caractère sacré de מִקְדָּשׁ.
  issues:
  - severity: medium
    issue: Ajout de « que vous recevrez »
    rationale: Le verbe « recevrez » n’est pas exprimé dans ce verset. Le contexte indique que les dons sont ceux attribués aux Lévites, mais la traduction peut conserver le possessif hébreu sans ajouter cette précision.
  - severity: medium
    issue: Préposition « sur » au début
    rationale: מִכֹּל introduit la source du prélèvement (« de/parmi tous »). « Sur » est possible avec « prélever » en français, mais « de tous » reflète plus directement la construction et évite l’ambiguïté.
  - severity: medium
    issue: Note littérale imprécise
    rationale: « prise de lui » ne rend pas clairement les suffixes et donne une formulation française incohérente. La note devrait se limiter à l’alternative lexicale « graisse » et à son sens idiomatique de meilleure part.
  revised_text: 'De tous vos dons, vous prélèverez toute la contribution pour Yahweh : de toute leur meilleure part, vous en prélèverez la part consacrée.[a]'
  revised_footnotes:
  - marker: a
    text: Littéralement, « de toute sa graisse ». Dans ce contexte, « graisse » désigne la part la plus riche ou la meilleure.
    reason: lexical_alternative
  revision_rationale: La révision rétablit « de tous » pour le sens de prélèvement à partir d’un ensemble, retire l’ajout « que vous recevrez », et conserve une syntaxe française claire en explicitant par « vous en prélèverez » le rapport final de provenance. La note est corrigée pour ne porter que sur l’alternative lexicale attestée par חֵלֶב.
