  source_fidelity: 'Le sens fondamental est bien rendu : les premiers-nés appartiennent au prêtre, avec l’exception explicite du rachat des premiers-nés humains et des animaux impurs. Toutefois, dans la phrase actuelle, « parmi tous les êtres vivants que l’on présentera » peut grammaticalement laisser entendre que ce sont tous les êtres vivants qui sont présentés, plutôt que les premiers-nés. Le déplacement de la relative rend la portée de אֲשֶׁר יַקְרִיבוּ plus nette.'
  naturalness: Le français est moderne et globalement naturel. « Premier-né qui ouvre le sein maternel » demeure compréhensible et conserve l’image hébraïque ; la syntaxe révisée améliore la lisibilité sans affaiblir cette image.
  terminology: « Yahweh », « racheter », « être humain », « animal » et « impur » sont appropriés. « De toute créature » rend naturellement לְכָל־בָּשָׂר, tandis que l’apposition « qu’il s’agisse d’un être humain ou d’un animal » maintient les deux domaines explicitement nommés dans l’hébreu.
