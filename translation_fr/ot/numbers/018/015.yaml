revisions:
- from: Tout premier-né qui ouvre le sein maternel[a], parmi tous les êtres vivants que l’on présentera à Yahweh[b], qu’il s’agisse d’un être humain ou d’un animal, sera à toi. Toutefois, tu devras racheter le premier-né de l’être humain, et tu devras racheter le premier-né de l’animal impur.
  to: Tout premier-né qui ouvre le sein maternel[a], de toute créature, qu’on présentera à Yahweh[b], qu’il s’agisse d’un être humain ou d’un animal, sera à toi. Toutefois, tu devras racheter le premier-né de l’être humain, et tu devras racheter le premier-né de l’animal impur.
  rationale: 'La seule correction nécessaire est syntaxique : elle rattache sans ambiguïté l’acte de présenter à Yahweh aux premiers-nés concernés. Les ancres de notes sont conservées et restent immédiatement associées aux expressions expliquées. La formulation ne suppose pas que les premiers-nés humains ou les animaux impurs soient sacrifiés, conformément à la qualification explicite du verset.'
