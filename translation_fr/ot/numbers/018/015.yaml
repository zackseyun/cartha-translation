source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: fr
  text: Tout premier-né qui ouvre le sein maternel[a], de toute créature, qu’on présentera à Yahweh[b], qu’il s’agisse d’un être humain ou d’un animal, sera à toi. Toutefois, tu devras racheter le premier-né de l’être humain, et tu devras racheter le premier-né de l’animal impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui ouvre le sein maternel ». L’expression hébraïque désigne le premier petit à sortir du ventre maternel.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’on fera approcher de Yahweh » ou « qu’on offrira à Yahweh ». Le verbe peut signifier « faire approcher » ou « présenter » dans un contexte d’offrande.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: premier-né qui ouvre le sein maternel
  rationale: Cette expression conserve l’image de l’idiome hébreu tout en indiquant naturellement qu’il s’agit du premier petit à sortir du ventre maternel.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: tout ... parmi tous les êtres vivants
  rationale: Cette formulation rend la portée générale de l’hébreu « toute chair » dans un français actuel, sans limiter le propos aux seuls humains.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: que l’on présentera à Yahweh
  rationale: Le verbe signifie faire approcher ou présenter, notamment dans un contexte d’offrande. « Présenter » convient ici aux humains comme aux animaux, sans laisser entendre que tous sont sacrifiés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: qu’il s’agisse d’un être humain ou d’un animal
  rationale: Cette tournure exprime clairement et naturellement les deux catégories visées.
- source_word: יִהְיֶה לָּךְ
  choice: sera à toi
  rationale: La formulation directe exprime le droit attribué au prêtre.
- source_word: אַךְ
  choice: toutefois
  rationale: Le mot introduit une restriction importante au principe qui vient d’être énoncé.
- source_word: פָּדֹה תִפְדֶּה
  choice: tu devras racheter
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’obligation. En français, « devras » transmet clairement la force impérative sans tournure artificielle.
- source_word: בְּכוֹר הָאָדָם
  choice: le premier-né de l’être humain
  rationale: אָדָם désigne ici l’être humain par opposition à l’animal. Cette formulation moderne conserve exactement ce contraste.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: le premier-né de l’animal impur
  rationale: 'La traduction maintient la catégorie rituelle explicite de l’hébreu : cet animal ne peut pas être offert et doit donc être racheté.'
theological_decisions:
- issue: Sens de אָדָם par opposition à בְּהֵמָה
  choice: être humain
  alternative: homme ; humanité
  rationale: Dans ce contexte, le terme désigne l’humain en général et non spécialement un individu de sexe masculin. « Être humain » rend nettement l’opposition avec l’animal sans neutraliser une distinction pertinente.
- issue: Nature de la présentation des premiers-nés à Yahweh
  choice: présenter, avec rachat obligatoire des premiers-nés humains et des animaux impurs
  alternative: offrir au sens de sacrifier dans tous les cas
  rationale: La restriction formulée dans le verset même exclut l’idée que tous les premiers-nés soient sacrifiés. Le choix lexical conserve donc la portée large du verbe hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Sein maternel » conserve l’image hébraïque sans employer le terme plus technique « matrice ». Le pronom indéfini « on » rend naturellement le sujet pluriel non précisé de יַקְרִיבוּ. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
