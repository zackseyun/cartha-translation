  text: וּ/בְשָׂרָ֖/ם יִהְיֶה לָּ֑/ךְ כַּ/חֲזֵ֧ה הַ/תְּנוּפָ֛ה וּ/כְ/שׁ֥וֹק הַ/יָּמִ֖ין לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: fr
  text: Mais leur viande[a] sera à toi, comme la poitrine de l’offrande de balancement[b] et la cuisse droite te reviendront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « leur chair » ; il s’agit ici de la partie comestible du sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une présentation rituelle accompagnée d’un geste; on traduit aussi « offrande de présentation ».
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: Mais leur viande
  rationale: בָּשָׂר signifie littéralement « chair », mais désigne ici la viande comestible des animaux sacrifiés. « Viande » est naturel en français dans ce contexte, tandis que la note conserve le sens concret du terme hébreu. La conjonction est rendue par « Mais » pour marquer le contraste avec le sang et la graisse mentionnés au verset précédent.
- source_word: יִהְיֶה לָּךְ
  choice: sera à toi
  rationale: La construction היה + ל exprime ici l’appartenance ou l’attribution. « Sera à toi » garde la valeur juridique de la part attribuée au prêtre.
- source_word: כַּחֲזֵה הַתְּנוּפָה
  choice: comme la poitrine de l’offrande présentée rituellement
  rationale: חָזֶה désigne la poitrine, et תְּנוּפָה une présentation cultuelle accompagnée d’un geste rituel. Cette formulation reste compréhensible sans imposer que le geste ait nécessairement été un balancement au sens moderne.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: et comme la cuisse droite
  rationale: שׁוֹק désigne la partie supérieure de la patte, ici une portion sacrificielle. « Cuisse » est précis et idiomatique en français.
- source_word: לְךָ יִהְיֶה
  choice: elle sera à toi
  rationale: La formule d’attribution répétée en hébreu est maintenue afin de préserver l’insistance du texte. Le pronom français reprend « viande » sans ajouter un référent absent de l’hébreu.
theological_decisions:
- issue: Variation de genre dans les formes de la deuxième personne
  choice: Traduire les deux formes par le singulier « à toi », dans l’adresse à Aaron comme représentant du sacerdoce.
  alternative: Expliciter « à toi, Aaron » ou employer un pluriel visant l’ensemble des prêtres.
  rationale: Le texte massorétique emploie d’abord une forme féminine, puis une forme masculine, mais le contexte adresse l’attribution à Aaron. Le français ne marque pas le genre dans « à toi » et permet ainsi de ne pas surinterpréter cette irrégularité grammaticale.
- issue: Nature du geste associé à תְּנוּפָה
  choice: Employer « offrande présentée rituellement » dans le texte et expliquer le geste en note.
  alternative: Traduire par « offrande balancée » ou « offrande agitée ».
  rationale: Le terme désigne une présentation rituelle devant le Seigneur, mais la nature précise du mouvement n’est pas explicitée dans ce verset. La traduction choisie préserve la fonction cultuelle sans préciser abusivement le geste.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition finale reflète l’insistance juridique de l’hébreu, et les deux comparaisons introduites par « comme » en préservent la structure.
