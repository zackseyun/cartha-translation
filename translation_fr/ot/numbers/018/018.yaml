revisions:
- from: 'Mais leur viande[a] sera à toi, comme la poitrine de l’offrande présentée rituellement[b] et comme la cuisse droite : elle sera à toi.'
  to: Mais leur viande[a] sera à toi, comme la poitrine de l’offrande de balancement[b] et la cuisse droite te reviendront.
  rationale: La révision conserve le contraste initial, le vocabulaire sacrificiel concret et la double formule d’attribution. Elle corrige l’ambiguïté grammaticale créée par « elle sera à toi » en faisant porter explicitement le pluriel sur la poitrine et la cuisse. Elle adopte une désignation cultuelle française plus directe, tandis que la note préserve l’incertitude relative à la nature exacte du geste rituel.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:50:14Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens de l’attribution sacerdotale est bien rendu, ainsi que la répétition de la formule d’appartenance. Toutefois, « elle sera à toi » ne reprend pas correctement l’ensemble coordonné « la poitrine ... et la cuisse droite » et peut faire croire que seule la cuisse est visée.
  naturalness: « Offrande présentée rituellement » est compréhensible, mais « la poitrine de l’offrande présentée rituellement » est pesant et peu idiomatique en français biblique moderne. La reprise finale par un pluriel explicite est plus nette et naturelle.
  terminology: « Viande », « poitrine » et « cuisse droite » conviennent dans ce contexte sacrificiel. « Offrande de balancement », avec une note qui signale « offrande de présentation » comme autre rendu, exprime plus directement le terme technique תְּנוּפָה sans prétendre définir avec certitude la mécanique du geste.
  issues:
  - severity: medium
    issue: Accord et portée de la reprise finale
    rationale: 'Dans « la poitrine ... et comme la cuisse droite : elle sera à toi », le singulier féminin « elle » ne peut reprendre naturellement que « la cuisse droite » ou un antécédent féminin isolé. Or la formule hébraïque finale confirme l’attribution des deux portions comparées. Un verbe au pluriel, sans pronom ambigu, rend cette portée.'
  - severity: low
    issue: Expression cultuelle trop paraphrastique dans le texte
    rationale: « Offrande présentée rituellement » alourdit la construction et transforme le nom technique en explication. « Offrande de balancement » est une désignation française usuelle; la note peut conserver la réserve sur le geste et l’alternative « offrande de présentation ».
  revised_text: Mais leur viande[a] sera à toi, comme la poitrine de l’offrande de balancement[b] et la cuisse droite te reviendront.
  revised_footnotes:
