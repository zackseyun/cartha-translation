  source_fidelity: 'Le texte rend fidèlement la structure de l’hébreu : Yahweh s’adresse à Aaron, distingue « toi, tes fils et ta famille paternelle » de « toi et tes fils », et conserve la répétition de « avec toi ». « Vous porterez la faute » maintient l’expression idiomatique נשא עון sans trancher indûment entre faute, culpabilité, responsabilité et conséquences pénales. « Sanctuaire » et « sacerdoce » correspondent bien à המקדש et כהונתכם.'
