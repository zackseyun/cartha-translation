  terminology: « Yahweh », « Aaron », « sanctuaire » et « sacerdoce » sont cohérents avec les choix terminologiques fournis. Les notes conservent l’ambiguïté sémantique de l’expression hébraïque et leurs ancres sont correctement placées après les deux groupes nominaux concernés dans le texte français.
