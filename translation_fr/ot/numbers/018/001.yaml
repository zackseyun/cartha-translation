  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: fr
  text: 'Yahweh dit à Aaron : « Toi, tes fils et ta famille paternelle avec toi, vous porterez la faute du sanctuaire[a] ; toi et tes fils avec toi, vous porterez la faute de votre sacerdoce[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous porterez la culpabilité liée au sanctuaire ». L’expression hébraïque peut aussi signifier qu’ils répondront des fautes commises dans ce qui concerne le sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous porterez la culpabilité liée à votre sacerdoce ». L’expression hébraïque peut aussi signifier qu’ils répondront des fautes commises dans l’exercice de leur fonction sacerdotale.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit ; en français, le passé simple exprime naturellement cette succession sans qu’un connecteur soit nécessaire.
- source_word: בֵית אָבִיךָ
  choice: ta famille paternelle
  rationale: L’expression hébraïque désigne la maisonnée ou le groupe familial rattaché au père, et non un bâtiment ; cette formulation est claire en français moderne.
- source_word: אִתָּךְ
  choice: avec toi
  rationale: La répétition de cette expression dans les deux propositions est conservée afin de respecter l’insistance et la structure de l’hébreu.
- source_word: תִּשְׂאוּ אֶת עֲוֺן
  choice: vous porterez la faute
  rationale: Cette formulation conserve l’image de « porter » et laisse ouverte la nuance entre faute, culpabilité, charge et responsabilité à l’égard des manquements.
- source_word: הַמִּקְדָּשׁ
  choice: le sanctuaire
  rationale: « Sanctuaire » désigne naturellement le domaine sacré confié à la responsabilité d’Aaron et de sa maison.
- source_word: כְּהֻנַּתְכֶם
  choice: votre sacerdoce
  rationale: Le terme désigne la fonction et le service sacerdotaux d’Aaron et de ses fils ; « sacerdoce » en préserve le caractère institutionnel.
theological_decisions:
- issue: Sens de « porter la faute » dans le contexte sacerdotal
  choice: Conserver l’expression « vous porterez la faute » sans préciser davantage le rapport entre la faute et le sanctuaire ou le sacerdoce.
  alternative: « vous répondrez des fautes commises contre le sanctuaire » ou « vous porterez la culpabilité »
  rationale: L’expression hébraïque peut évoquer à la fois la culpabilité, les conséquences d’une faute et la responsabilité relative aux manquements dans le service sacré. La traduction principale maintient cette tension, tandis que les notes signalent les principales nuances possibles.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme et la répétition de « avec toi » sont maintenus. « Famille paternelle » explicite l’idiome de la maison du père sans suggérer un bâtiment ; « sacerdoce » conserve le registre cultuel du passage.
