  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: fr
  text: 'Yahweh dit à Aaron : « Tu ne recevras pas d’héritage dans leur pays, et tu n’auras aucune part au milieu d’eux. C’est moi qui suis ta part et ton héritage au milieu des Israélites.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au milieu des fils d’Israël »; on peut aussi traduire : « au milieu du peuple d’Israël ».'
    reason: La note signale la forme hébraïque בְּנֵי יִשְׂרָאֵל et ses équivalents français possibles, tandis que le texte principal emploie l’ethnonyme naturel « Israélites ».
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit « Yahweh » afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּאַרְצָם לֹא תִנְחָל
  choice: Tu ne recevras pas d’héritage dans leur pays
  rationale: Le verbe נחל exprime ici la réception d’un héritage territorial. Cette formulation française est naturelle et évite l’ambiguïté moderne de « tu n’hériteras pas dans leur pays ».
- source_word: חֵלֶק
  choice: part
  rationale: « Part » convient à la fois à une portion attribuée et à l’affirmation métaphorique selon laquelle Yahweh lui-même est la part d’Aaron; la répétition préserve le lien lexical du verset.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: Cette expression conserve l’image spatiale et communautaire de l’hébreu tout en restant idiomatique en français.
- source_word: אֲנִי חֶלְקְךָ
  choice: C’est moi qui suis ta part
  rationale: La tournure emphatique rend le pronom indépendant אֲנִי et souligne le contraste entre l’absence de part territoriale et Yahweh comme part d’Aaron.
- source_word: נַחֲלָתְךָ
  choice: ton héritage
  rationale: « Héritage » conserve la portée juridique et territoriale de נַחֲלָה ainsi que son rapport avec le verbe נחל au début du verset.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: au milieu des Israélites
  rationale: Dans cette expression ethnique consacrée, בְּנֵי יִשְׂרָאֵל désigne collectivement le peuple d’Israël. « Israélites » est précis, inclusif selon la portée contextuelle et plus naturel en français actuel que le calque « fils d’Israël ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. La transcription « Yahweh » en conserve la fonction sans le remplacer par un titre.
- issue: Sens de l’absence d’héritage d’Aaron
  choice: Absence de part territoriale compensée par Yahweh comme part et héritage
  alternative: Absence de tout bien ou de toute provision
  rationale: Le contexte foncier de « leur pays », « part » et « héritage » indique que l’interdiction concerne l’héritage territorial au sein d’Israël, sans nier les ressources sacerdotales décrites dans le chapitre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël; le peuple d’Israël
  rationale: L’expression fonctionne ici comme un ethnonyme collectif. « Les Israélites » communique cette portée sans suggérer que seuls les hommes sont visés.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct conserve le contraste et l’emphase de l’hébreu. « Pays » est préféré à « terre » pour désigner ici le territoire collectif, et « recevoir un héritage » offre une formulation plus naturelle que le calque verbal.
