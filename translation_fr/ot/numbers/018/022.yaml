source:
  edition: WLC
  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: fr
  text: Les fils d’Israël ne s’approcheront plus de la tente de la rencontre, de peur de porter une faute[a] et de mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’encourir la culpabilité ». L’hébreu dit littéralement « porter une faute », expression sacerdotale et juridique qui peut désigner le fait d’assumer la responsabilité ou les conséquences d’une faute.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: s’approcheront
  rationale: Le verbe קרב signifie « s’approcher » ou « venir près ». « S’approcher » est naturel en français et conserve la portée cultuelle de l’approche d’un lieu sacré.
- source_word: עוֹד
  choice: ne… plus
  rationale: Avec la négation לֹא, עוֹד signifie idiomatiquement « ne… plus » ou « ne… jamais plus » ; « ne… plus » restitue sobrement la formulation hébraïque.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme de l’expression hébraïque, qui désigne collectivement les membres du peuple d’Israël.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression rend de manière transparente le nom hébreu du sanctuaire, sans recourir au terme traditionnel mais moins explicite « tabernacle ».
- source_word: לָשֵׂאת חֵטְא
  choice: de peur de porter leur péché
  rationale: La traduction maintient l’expression sacerdotale et juridique concrète « porter le péché », laquelle peut aussi désigner le fait d’encourir la culpabilité ou d’en porter les conséquences.
- source_word: לָמוּת
  choice: et de mourir
  rationale: L’infinitif coordonné exprime l’issue mortelle de cette approche ; « et de mourir » reproduit clairement et sobrement la séquence hébraïque.
theological_decisions:
- issue: Faut-il expliciter que l’interdiction vise une approche non autorisée du sanctuaire et la culpabilité qui en résulte ?
  choice: 'Conserver la formulation concise : « ne s’approcheront plus de la tente de la rencontre, de peur de porter leur péché et de mourir »'
  alternative: « ne s’approcheront plus de la tente de la rencontre, sinon ils se rendront coupables et mourront »
  rationale: Le contexte immédiat réserve aux lévites et aux prêtres certaines fonctions liées au sanctuaire. La traduction ne développe pas cette précision contextuelle dans le verset et préserve la tension de l’expression juridique « porter le péché » plutôt que de la réduire à une simple faute rituelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe « de peur de… » conserve la valeur préventive de la construction hébraïque. Le choix « fils d’Israël » privilégie ici la transparence formelle, tandis que « tente de la rencontre » rend le terme cultuel sans archaïsme inutile.
