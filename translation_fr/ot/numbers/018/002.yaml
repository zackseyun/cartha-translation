source:
  edition: WLC
  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: fr
  text: Fais aussi approcher auprès de toi tes frères, la tribu de Lévi, la tribu de ton père, afin qu’ils se joignent à toi[a] et te servent, tandis que toi et tes fils avec toi, vous serez devant la tente du Témoignage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils t’accompagnent » ou « qu’ils soient attachés à toi ». Le verbe hébreu fait aussi écho au nom de Lévi.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « la tente du Témoignage ». De nombreuses traductions emploient ici « la tente de la Rencontre », par rapprochement avec des expressions apparentées concernant le sanctuaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Fais aussi
  rationale: Rend la valeur additive de la conjonction et de l’adverbe, tout en s’intégrant naturellement à l’impératif français.
- source_word: אַחֶיךָ
  choice: tes frères
  rationale: Conserve le langage familial de l’hébreu; le contexte précise qu’il s’agit des autres membres de la tribu de Lévi.
- source_word: מַטֵּה לֵוִי
  choice: la tribu de Lévi
  rationale: מַטֶּה désigne ici une tribu et non un bâton.
- source_word: שֵׁבֶט אָבִיךָ
  choice: la tribu de ton père
  rationale: Préserve l’apposition et la formulation ancestrale de l’hébreu sans réduire le terme à «clan».
- source_word: הַקְרֵב אִתָּךְ
  choice: Fais approcher avec toi
  rationale: «Faire approcher» conserve la nuance de présentation en vue du service, et «avec toi» celle d’association à Aaron.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: afin qu’ils se joignent à toi
  rationale: Rend le sens d’attachement ou d’association du nifal de לוה, avec l’écho possible au nom de Lévi.
- source_word: וִישָׁרְתוּךָ
  choice: et te servent
  rationale: Formulation directe et actuelle qui exprime le service rendu à Aaron sans ajouter une coloration ecclésiastique.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: tandis que toi et tes fils avec toi, vous serez
  rationale: «Tandis que» explicite sobrement la relation entre le service des Lévites et la position sacerdotale d’Aaron et de ses fils; la reprise par «vous» est idiomatique en français.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: devant la tente du Témoignage
  rationale: Suit le texte massorétique, qui porte «Témoignage», et non l’expression plus courante «tente de la Rencontre».
theological_decisions:
- issue: Traduction de אֹהֶל הָעֵדֻת
  choice: la tente du Témoignage
  alternative: la tente de la Rencontre
  rationale: Le texte hébreu de ce verset dit explicitement «tente du Témoignage». La traduction évite d’harmoniser avec l’expression tabernaculaire plus fréquente «tente de la Rencontre».
- issue: Relation des Lévites à Aaron dans וְיִלָּווּ עָלֶיךָ
  choice: qu’ils se joignent à toi
  alternative: qu’ils t’accompagnent / qu’ils soient attachés à toi
  rationale: «Se joindre à» maintient la relation de rattachement sans préciser davantage que l’hébreu la nature institutionnelle ou hiérarchique de cette association.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement suit l’adresse directe de Dieu à Aaron. «Témoignage» prend une majuscule comme désignation de la réalité sacrée associée à l’arche, sans ajouter d’interprétation doctrinale.
