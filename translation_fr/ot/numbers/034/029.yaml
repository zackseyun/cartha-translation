    issue: Possessif non exprimé dans le texte source
    rationale: « Leur héritage » explicite un rapport de possession implicite dans le contexte, mais absent de la formulation hébraïque, et son référent peut être momentanément ambigu en français. « L’héritage » préserve le sens tout en évitant cet ajout.
  - severity: low
    issue: Formulation de la note alternative
    rationale: « Faire hériter les fils d’Israël dans le pays de Canaan » est possible, mais moins idiomatique et peut laisser incertain le rôle exact de « dans le pays ». Une alternative avec « donner l’héritage » reflète clairement la valeur causative de נחל.
