  text: אֵ֕לֶּה אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה לְ/נַחֵ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: fr
  text: Ce sont ceux à qui Yahweh ordonna d’attribuer l’héritage aux fils d’Israël dans le pays de Canaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce sont ceux à qui Yahweh ordonna de donner l’héritage aux fils d’Israël dans le pays de Canaan. »'
    reason: Alternative lexicale pour le hiphil de נחל, qui peut exprimer l’action de donner ou d’assigner comme héritage.
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Ce sont ceux à qui
  rationale: Cette tournure française naturelle conserve la valeur démonstrative et relative de l’hébreu, qui identifie en conclusion les responsables précédemment nommés.
- source_word: צִוָּה
  choice: ordonna
  rationale: Le verbe צוה exprime normalement un ordre. « Ordonna » en préserve le sens, tandis que l’infinitif suivant indique la mission confiée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel écrit dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לְנַחֵל
  choice: d’attribuer leur héritage
  rationale: Le hiphil de נחל désigne ici le fait de faire entrer Israël en possession de son héritage, dans le contexte du partage territorial. Cette formulation garde la notion d’héritage tout en restant idiomatique en français.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: « Fils d’Israël » conserve l’expression hébraïque traditionnelle et son référent collectif. La préposition « aux » est requise par la construction française avec « attribuer ».
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: dans le pays de Canaan
  rationale: Cette traduction conserve à la fois le nom géographique et le substantif אֶרֶץ, ici rendu par « pays ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur de לְנַחֵל et rôle des responsables
  choice: attribuer leur héritage aux fils d’Israël
  alternative: faire hériter les fils d’Israël
  rationale: Le contexte concerne la répartition du territoire par les responsables désignés. Le choix principal exprime cette attribution sans effacer la notion d’héritage; la note conserve une formulation plus proche de la structure causative hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la formulation collective « fils d’Israël » et le nom divin « Yahweh ». L’expression « attribuer leur héritage » privilégie l’intelligibilité tout en maintenant le vocabulaire théologique de l’héritage.
