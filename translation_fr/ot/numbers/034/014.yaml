  to: Car la tribu des fils de Ruben, selon leurs clans[a], la tribu des fils de Gad, selon leurs clans[a], et la demi-tribu de Manassé[b] ont pris possession de leur héritage.
  rationale: La révision rend les deux occurrences de l’expression sociale hébraïque et place la même note à chacune, puisque toutes deux ont la même portée. « Selon leurs clans » fournit un équivalent français naturel ; la note conserve l’idiome littéral et sa nuance familiale. Aucun changement de sens n’est apporté à l’acquisition de l’héritage.
