  source_fidelity: 'Le sens général est fidèle : כִּי est explicatif, les trois groupes sont énumérés, et « ont pris possession de leur héritage » rend de façon acceptable le parfait de לקח et נַחֲלָתָם. Toutefois, לְבֵית אֲבֹתָם est répété pour Ruben et Gad ; la traduction doit rendre explicitement cette répétition et l’ancrage de la note doit couvrir les deux occurrences.'
  naturalness: « Selon leurs clans » est plus idiomatique en français moderne que « par familles ancestrales », tout en conservant, avec note, la référence aux subdivisions familiales paternelles. La phrase reste claire et garde la structure énumérative du verset.
