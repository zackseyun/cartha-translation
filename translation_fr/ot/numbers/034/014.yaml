source:
  edition: WLC
  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: fr
  text: Car la tribu des fils de Ruben, selon leurs clans[a], la tribu des fils de Gad, selon leurs clans[a], et la demi-tribu de Manassé[b] ont pris possession de leur héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « selon les maisons de leurs pères » ; il s’agit des divisions familiales ou claniques au sein de chaque tribu.
    reason: cultural_note
  - marker: b
    text: Ou « la moitié de la tribu de Manassé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente; « Car » conserve clairement cette valeur causale et discursive.
- source_word: לָקְחוּ
  choice: ont pris possession de
  rationale: Le qal accompli de לקח exprime ici l’acquisition déjà réalisée du territoire attribué. « Ont pris possession de » reste proche du verbe hébreu tout en étant plus naturel en français que « ont pris leur héritage ».
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans le contexte du partage du pays, le mot désigne sans ambiguïté une unité tribale et non un bâton.
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: les fils de Ruben / les fils de Gad
  rationale: Cette formulation conserve la tournure généalogique de l’hébreu tout en restant courante et compréhensible dans le registre biblique français.
- source_word: לְבֵית אֲבֹתָם
  choice: par familles ancestrales
  rationale: L’expression désigne les subdivisions familiales ou claniques de chaque tribu. Cette traduction rend le sens institutionnel sans reproduire l’idiome peu naturel « maisons de leurs pères ».
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: et la demi-tribu de Manassé
  rationale: Formulation française conventionnelle et claire indiquant qu’une moitié seulement de la tribu de Manassé est concernée.
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: Le terme désigne ici le territoire reçu en partage comme patrimoine héréditaire; « héritage » en conserve les dimensions juridique et théologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure énumérative de l’hébreu est conservée, tandis que l’idiome social « maisons des pères » est rendu de façon intelligible. « Ont pris possession de » maintient la force active de לקח sans suggérer que l’héritage aurait été acquis indépendamment de l’attribution divine.
