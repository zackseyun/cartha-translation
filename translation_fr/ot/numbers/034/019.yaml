  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הָ/אֲנָשִׁ֑ים לְ/מַטֵּ֣ה יְהוּדָ֔ה כָּלֵ֖ב בֶּן יְפֻנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: fr
  text: 'Voici les noms des hommes : pour la tribu de Juda, Caleb, fils de Jephunné.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Dans cette formule de présentation, « Voici » rend naturellement l’introduction hébraïque וְאֵלֶּה et assure la continuité avec le contexte, sans calquer inutilement « et ceux-ci sont ».
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: les noms de ces hommes
  rationale: שְׁמוֹת est à l’état construit devant הָאֲנָשִׁים. « Ces hommes » reprend de façon idiomatique les hommes annoncés dans la formule de présentation et conserve la référence masculine précise.
- source_word: לְמַטֵּה
  choice: pour la tribu de
  rationale: Dans le contexte du partage tribal, מַטֶּה désigne une tribu, tandis que לְ indique ici la représentation ou l’affectation.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Forme française biblique courante du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement et naturellement la construction patronymique hébraïque.
- source_word: יְפֻנֶּה
  choice: Yefounné
  rationale: Translittération française lisible, proche de la forme hébraïque יְפֻנֶּה.
theological_decisions: []
