source:
  edition: WLC
  text: וְ/נָסַ֧ב הַ/גְּב֛וּל מֵ/עַצְמ֖וֹן נַ֣חְלָ/ה מִצְרָ֑יִם וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: fr
  text: Puis la frontière tournera d’Atsmon vers le torrent d’Égypte[a], et elle aboutira à la mer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers l’oued d’Égypte ». Le mot hébreu נחל désigne souvent un cours d’eau saisonnier ou son lit.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « et ses extrémités seront à la mer » ; l’hébreu emploie un pluriel pour désigner le terme de la frontière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Puis … tournera
  rationale: Dans cette description territoriale, נסב indique un changement de direction de la ligne frontalière. « Puis » marque naturellement la progression entre les repères.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: Dans ce contexte géographique, גְּבוּל désigne la ligne qui délimite le territoire; « frontière » est courant et précis en français moderne.
- source_word: מֵעַצְמוֹן
  choice: d’Asmon
  rationale: Le nom de lieu est translittéré; « d’ » rend la préposition indiquant le point de départ.
- source_word: נַחְלָה מִצְרָיִם
  choice: vers le torrent d’Égypte
  rationale: נחל désigne souvent un cours d’eau, parfois saisonnier, ou son lit. « Torrent » est intelligible et traditionnel sans suggérer à tort un grand fleuve comme le Nil; « oued » est signalé en note.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: et elle aboutira
  rationale: L’expression hébraïque, littéralement « et ses sorties/extrémités seront », indique ici le point terminal de la frontière. La formulation verbale française est naturelle tout en conservant ce sens géographique.
- source_word: הַיָּמָּה
  choice: à la mer
  rationale: La forme directionnelle signifie « vers la mer » et, avec l’expression du terme de la frontière, indique qu’elle y aboutit. Le texte ne précise pas ici « Méditerranée ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le futur convient au caractère prescriptif de la délimitation. La tournure « elle aboutira » évite un calque peu naturel tout en laissant la note rendre le pluriel hébreu.
