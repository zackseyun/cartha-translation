  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: fr
  text: À partir du mont Hor, vous tracerez la frontière jusqu’à Lebo-Hamath[a], et les limites de la frontière seront à Tsedad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à l’entrée de Hamath » ; il s’agit probablement d’un nom de lieu fixe, Lebo-Hamath.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: Depuis le mont Hor
  rationale: La construction hébraïque désigne le toponyme « mont Hor » avec la préposition « depuis ».
- source_word: תְּתָאוּ
  choice: vous tracerez
  rationale: Dans cette description territoriale, le verbe exprime le tracé ou la délimitation d’une frontière.
- source_word: לְבֹא חֲמָת
  choice: jusqu’à Lebo-Hamath
  rationale: L’expression, littéralement « à l’entrée de Hamath », fonctionne vraisemblablement comme une désignation géographique fixe.
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: elle aboutira
  rationale: Littéralement « les extrémités de la frontière seront » ; cette formulation française rend naturellement le point terminal du tracé sans alourdir la phrase.
- source_word: צְדָדָה
  choice: à Tsedad
  rationale: Le suffixe directionnel situe ici le lieu où la frontière atteint son terme ; « à Tsedad » convient au contexte géographique.
