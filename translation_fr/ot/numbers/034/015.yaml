base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: fr
  text: Les deux tribus et la demi-tribu ont pris leur héritage au-delà du Jourdain[a], en face de Jéricho, vers l’est, du côté du soleil levant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de l’autre côté du Jourdain».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement «vers l’est, du côté du soleil levant», expression redoublée qui souligne le côté oriental.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: les deux tribus
  rationale: Dans le contexte du partage du territoire, מַטֶּה désigne idiomatiquement une tribu, et non un bâton.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: et la demi-tribu
  rationale: L’expression désigne ici l’unité reconnue formée par la moitié de la tribu de Manassé; «demi-tribu» est naturel et précis en français.
- source_word: לָקְחוּ
  choice: ont pris
  rationale: Le qal accompli exprime une action achevée. «Ont pris» conserve le sens direct de לקח sans introduire l’interprétation «ont reçu».
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: Dans le cadre du partage du pays, נַחֲלָה désigne le territoire reçu en héritage et garde sa portée liée à l’alliance.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Cette formulation française rend naturellement la région située au-delà du Jourdain selon le point de vue du discours.
- source_word: יְרֵחוֹ
  choice: à la hauteur de Jéricho
  rationale: Le nom localise ici la portion du Jourdain visée. «À la hauteur de Jéricho» évite de laisser entendre que l’héritage se trouve dans la ville même.
- source_word: קֵדְמָה
  choice: à l’est
  rationale: La forme directionnelle indique l’orientation ou la situation vers l’est.
- source_word: מִזְרָחָה
  choice: du côté du soleil levant
  rationale: Cette expression conserve l’image du lever du soleil et rend perceptible le redoublement emphatique de l’hébreu.
