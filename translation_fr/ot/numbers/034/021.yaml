- source_word: לְמַטֵּה
  choice: De la tribu de
  rationale: Dans cette liste de représentants désignés, la préposition לְ peut marquer l’appartenance ou l’affectation. « De la tribu de » exprime naturellement ici l’origine tribale du représentant, sans exclure le sens possible « Pour la tribu de ».
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: אֱלִידָד
  choice: Élidad
  rationale: Translittération adaptée aux conventions graphiques et phonétiques du français moderne.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement la relation patronymique exprimée par le construit hébreu.
- source_word: כִּסְלוֹן
  choice: Kislôn
  rationale: Translittération française proche des consonnes hébraïques; l’accent circonflexe aide à distinguer la voyelle longue finale sans prétendre reproduire exactement la prononciation ancienne.
