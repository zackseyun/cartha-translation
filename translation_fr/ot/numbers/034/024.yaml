  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי אֶפְרַ֖יִם נָשִׂ֑יא קְמוּאֵ֖ל בֶּן שִׁפְטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/024.yaml
  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
translation:
  language: fr
  text: 'Et pour la tribu des fils d’Éphraïm[a], un responsable : Qemouël, fils de Shiftân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils d’Éphraïm » ; c’est-à-dire les membres ou descendants de la tribu d’Éphraïm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Et pour la tribu de
  rationale: Dans cette liste administrative, מַטֶּה désigne une tribu plutôt qu’un bâton ou une branche; les préfixes וּ et לְ sont rendus ensemble par « Et pour ».
- source_word: בְנֵי אֶפְרַיִם
  choice: les fils d’Éphraïm
  rationale: Cette formulation conserve la construction hébraïque, tout en indiquant par une note qu’elle désigne ici les membres ou descendants de la tribu.
- source_word: נָשִׂיא
  choice: un responsable
  rationale: Le mot désigne ici le représentant placé à la tête de la tribu. « Responsable » est naturel en français moderne et évite les connotations royales possibles de « prince ».
- source_word: קְמוּאֵל
  choice: Qemouël
  rationale: Translittération française du nom hébreu, avec tréma pour signaler la séparation vocalique.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu naturel et formel de la construction patronymique hébraïque.
- source_word: שִׁפְטָן
  choice: Shiftân
  rationale: Translittération française du nom hébreu, distinguant les consonnes פ et ט.
