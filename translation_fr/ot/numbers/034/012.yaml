  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: fr
  text: Puis la frontière descendra jusqu’au Jourdain, et ses extrémités[a] aboutiront à la mer du Sel[b]. Telle sera votre terre, avec ses frontières tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu, au pluriel, peut désigner les points terminaux ou les extrémités de la frontière.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la mer du Sel »; il s’agit de l’étendue d’eau appelée couramment la mer Morte.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Puis … descendra
  rationale: Le verbe ירד signifie « descendre ». Le futur convient à cette délimitation prescriptive, et « puis » exprime naturellement la progression de l’itinéraire.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: גְּבוּל désigne ici la ligne qui délimite le territoire; « frontière » est clair et naturel en français moderne.
- source_word: הַיַּרְדֵּנָה
  choice: jusqu’au Jourdain
  rationale: La terminaison directionnelle indique un mouvement en direction du Jourdain. Dans cet itinéraire frontalier, « jusqu’au » exprime naturellement le point atteint.
- source_word: תוֹצְאֹתָיו
  choice: son extrémité
  rationale: Le pluriel hébreu désigne ici le point terminal ou les extrémités de la frontière. Le singulier « son extrémité » est plus idiomatique en français dans cette description, tandis qu’une note signale la forme et l’autre interprétation possibles.
- source_word: יָם הַמֶּלַח
  choice: la mer Salée
  rationale: Cette traduction conserve le nom hébreu littéral plutôt que de lui substituer directement le nom moderne « mer Morte ».
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: Tel sera votre pays
  rationale: La tournure rend avec naturel la formule récapitulative et la valeur possessive de לָכֶם.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: avec ses frontières tout autour
  rationale: Cette formulation conserve l’idée d’un pays défini par l’ensemble de ses limites environnantes sans ajouter d’interprétation géographique.
