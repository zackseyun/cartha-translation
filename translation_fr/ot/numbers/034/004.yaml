  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: fr
  text: Votre frontière changera alors de direction au sud de la montée d’Aqrabbim[a] et passera par Tsin. Son extrémité se trouvera au sud de Qadesh-Barnéa. Elle se prolongera ensuite jusqu’à Hatsar-Addar et passera par Atsmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqrabbim signifie probablement « scorpions » ; ce nom de lieu pourrait aussi être rendu par « montée des Scorpions » ou « col des Scorpions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב לָכֶם הַגְּבוּל
  choice: Votre frontière changera alors de direction
  rationale: נָסַב décrit le changement de direction d’une ligne frontalière. La tournure avec « votre frontière » exprime naturellement לָכֶם en français.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: au sud de la montée d’Aqrabbim
  rationale: מִנֶּגֶב situe la frontière au sud du lieu nommé. מַעֲלֵה est traduit par « montée », tandis qu’Aqrabbim est conservé comme toponyme.
- source_word: וְעָבַר צִנָה
  choice: et passera en direction de Tsin
  rationale: עָבַר décrit le passage de la frontière, et le hé directionnel de צִנָה indique un mouvement vers Tsin sans nécessairement préciser qu’elle traverse ce lieu.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: Son extrémité se trouvera
  rationale: Dans les descriptions de frontières, le pluriel morphologique תּוֹצְאֹתָיו désigne idiomatiquement le point d’aboutissement du tracé. Le singulier français convient au verbe hébreu singulier et au mouvement d’une seule ligne frontalière.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: au sud de Qadesh-Barnéa
  rationale: La construction situe l’aboutissement de la frontière du côté sud de Qadesh-Barnéa.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: Elle se prolongera ensuite jusqu’à Hatsar-Addar
  rationale: יָצָא, dans un itinéraire frontalier, indique que la ligne se poursuit jusqu’au point suivant. « Se prolongera jusqu’à » est naturel et précis en français.
- source_word: וְעָבַר עַצְמֹנָה
  choice: et passera en direction d’Atsmon
  rationale: Le verbe marque le passage de la frontière et le hé directionnel indique qu’elle va vers Atsmon.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les toponymes sont translittérés plutôt que traduits; la note conserve toutefois le sens lexical d’Aqrabbim. Le découpage en trois phrases rend lisible l’itinéraire sans supprimer les relations spatiales de l’hébreu.
