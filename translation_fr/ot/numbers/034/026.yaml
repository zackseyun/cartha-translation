  text: 'Et pour la tribu des fils d’Issacar : un responsable, Paltiel, fils d’Azzan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Pour la tribu de
  rationale: Dans ce contexte de répartition territoriale, מַטֶּה désigne une tribu. Le ו initial poursuit l’énumération; en français, la continuité de la liste n’exige pas nécessairement « et », tandis que לְ est naturellement rendu par « pour ».
- source_word: בְנֵי
  choice: les fils de
  rationale: Rend directement le pluriel construit masculin et conserve la désignation tribale traditionnelle.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forme française usuelle du nom biblique.
- source_word: נָשִׂיא
  choice: un responsable
  rationale: Le terme désigne ici le représentant désigné de la tribu. « Responsable » exprime clairement sa fonction administrative sans suggérer nécessairement un titre royal.
- source_word: פַּלְטִיאֵל
  choice: Paltiel
  rationale: Translittération française courante du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Rend le patronyme hébreu de manière directe et naturelle.
- source_word: עַזָּן
  choice: Azzân
  rationale: Translittération qui marque la consonne redoublée et la voyelle longue du nom hébreu.
