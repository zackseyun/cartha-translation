lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: vous tracerez
  rationale: Dans ce contexte de délimitation territoriale, le verbe inhabituel désigne l’action de tracer ou de marquer la ligne d’une frontière. « Tracer » est naturel en français et convient au cadre géographique et juridique.
- source_word: לָכֶם
  choice: pour vous
  rationale: Le datif indique que cette délimitation est faite pour les Israélites, en vue du territoire qui leur revient. « Pour vous » conserve cette nuance bénéficiaire sans lourdeur.
- source_word: לִגְבוּל קֵדְמָה
  choice: la frontière orientale
  rationale: גְּבוּל désigne ici une limite territoriale, et קֵדְמָה précise le côté est. La formulation adjectivale est claire et idiomatique en français.
- source_word: מֵחֲצַר עֵינָן
  choice: de Hatsar-Énan
  rationale: Le nom de lieu est translittéré et introduit le point de départ de ce segment frontalier.
- source_word: שְׁפָמָה
  choice: à Shefam
  rationale: Le hé final indique ici la direction vers ce lieu; avec « de », la préposition « à » exprime naturellement en français l’étendue de la ligne jusqu’à Shefam.
