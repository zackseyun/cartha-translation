  text: וְ/יָצָ֤א הַ/גְּבֻל֙ זִפְרֹ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו חֲצַ֣ר עֵינָ֑ן זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל צָפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: fr
  text: La frontière se prolongera jusqu’à Tsifrôn, et son extrémité sera Hatsar-Énân[a]. Telle sera pour vous la frontière nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ses aboutissements seront Hatsar-Énân ». L’hébreu emploie une expression au pluriel pour le terme de la frontière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא הַגְּבֻל
  choice: La frontière se prolongera
  rationale: Dans une description territoriale, יצא indique le tracé ou le prolongement d’une frontière plutôt qu’un déplacement littéral. Cette formulation est naturelle en français tout en conservant le sens géographique.
- source_word: זִפְרֹנָה
  choice: jusqu’à Tsifrôn
  rationale: Le ה directionnel marque l’orientation vers ce lieu. « Jusqu’à » convient ici au parcours de la frontière; le toponyme est translittéré selon une forme française.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: et son extrémité sera
  rationale: Dans les textes de délimitation, תוֹצָאוֹת désigne l’aboutissement ou le terme du tracé. Le singulier collectif donne un français clair, tandis qu’une note signale le pluriel hébreu.
- source_word: חֲצַר עֵינָן
  choice: Hatsar-Énân
  rationale: Le nom de lieu est translittéré plutôt que traduit, avec une graphie adaptée aux conventions françaises.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: Telle sera pour vous
  rationale: La tournure reprend naturellement en français la ligne qui vient d’être décrite et conserve explicitement le bénéficiaire pluriel לָכֶם.
- source_word: גְּבֻל צָפוֹן
  choice: la frontière nord
  rationale: Le groupe construit désigne la frontière située au nord; « frontière nord » est concis et idiomatique en français moderne.
