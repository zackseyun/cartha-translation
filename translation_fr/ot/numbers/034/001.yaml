base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Puis Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ». Autre translittération : « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin, la convention traditionnelle de traduction et une translittération française alternative, sans contredire le texte principal.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement cette succession, et « parla » conserve la valeur verbale de דבר dans cette formule introductive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « parler à Moïse » est l’expression française naturelle.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif construit introduit le discours qui suit. « En ces termes » rend cette fonction idiomatiquement et avec dignité, sans la lourdeur de « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: L’hébreu porte explicitement le tétragramme. « Yahweh » préserve le nom personnel tout en signalant en note la convention française traditionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formule hébraïque d’introduction est conservée sans calque maladroit ; les deux-points annoncent le discours du verset suivant.
