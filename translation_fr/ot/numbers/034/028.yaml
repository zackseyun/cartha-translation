  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
translation:
  language: fr
  text: 'Et pour la tribu des fils de Nephtali[a], un chef : Pedahel, fils d’Ammihud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils de Nephtali » est une désignation tribale habituelle qui désigne les descendants de Nephtali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Pour la tribu de
  rationale: Dans ce contexte de répartition tribale, מַטֶּה désigne la tribu, non un bâton. En français, l’absence de « et » est naturelle dans cette liste elliptique, tandis que לְ est rendu par « pour ».
- source_word: בְנֵי
  choice: les fils de
  rationale: La tournure conserve le sens littéral masculin du syntagme construit, tout en signalant en note qu’il s’agit de la désignation collective des descendants.
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: נָשִׂיא
  choice: un responsable
  rationale: Dans cette liste administrative, le terme désigne le chef désigné de la tribu. « Responsable » est clair et actuel, sans les connotations monarchiques possibles de « prince ».
- source_word: פְּדַהְאֵל
  choice: Pedahel
  rationale: Translittération française claire du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu direct et naturel de la formule patronymique.
- source_word: עַמִּיהוּד
  choice: Ammihoud
  rationale: Translittération conforme aux usages français des noms bibliques.
