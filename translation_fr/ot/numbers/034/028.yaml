  source_fidelity: 'La structure et les principaux termes sont bien rendus : מַטֶּה est correctement compris comme « tribu », בְנֵי comme « fils de », et נָשִׂיא désigne ici le chef d’une tribu. Toutefois, la conjonction initiale וְ doit être représentée dans une traduction à équivalence optimale. Le nom עַמִּיהוּד est plus fidèlement rendu « Ammihud » que « Ammihoud ».'
