  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: fr
  text: Votre côté sud s’étendra depuis le désert de Tsin, le long d’Édom, et votre frontière sud partira de l’extrémité[b] de la mer Salée[a], vers l’est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « mer Morte » ; hébreu : « mer Salée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du bord de la mer Salée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: côté sud
  rationale: Dans cette description territoriale, פֵּאָה désigne un côté ou une bordure, et נֶגֶב a ici un sens directionnel. « Côté sud » est clair et naturel en français.
- source_word: מִמִּדְבַּר צִן
  choice: depuis le désert de Tsin
  rationale: מִדְבָּר désigne une région aride ou inhabitée. « Désert » est l’équivalent géographique courant en français, tandis que « Tsin » conserve le nom propre.
- source_word: עַל יְדֵי אֱדוֹם
  choice: le long d’Édom
  rationale: L’expression spatiale signifie « à côté de » ou « le long de ». Cette formulation préserve la proximité géographique sans préciser indûment qu’il s’agit d’une frontière officielle d’Édom.
- source_word: גְּבוּל נֶגֶב
  choice: frontière sud
  rationale: גְּבוּל désigne ici la limite d’un territoire, et נֶגֶב indique le sud. « Frontière sud » convient au contexte du tracé territorial.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: de l’extrémité de la mer Salée
  rationale: קָצֶה désigne un bout ou une extrémité. « Extrémité » conserve cette précision, et « mer Salée » traduit directement le nom hébreu.
- source_word: יָם הַמֶּלַח
  choice: la mer Salée
  rationale: Cette traduction rend directement le toponyme hébreu plutôt que de lui substituer l’appellation française traditionnelle « mer Morte ».
- source_word: קֵדְמָה
  choice: vers l’est
  rationale: L’adverbe directionnel indique une orientation vers l’est. La formulation française conserve cette valeur sans la transformer en simple localisation.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: s’étendra ... partira
  rationale: Dans cette formule descriptive, le verbe introduit les données du tracé. Ces verbes français rendent naturellement la portée future et géographique tout en évitant une répétition lourde de « sera ».
