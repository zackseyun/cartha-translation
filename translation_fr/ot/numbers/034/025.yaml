  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי זְבוּלֻ֖ן נָשִׂ֑יא אֱלִיצָפָ֖ן בֶּן פַּרְנָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: fr
  text: 'Et pour la tribu des fils de Zabulon, un responsable : Élitsafân, fils de Parnak.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Et pour la tribu de
  rationale: Dans ce contexte de répartition tribale, מַטֶּה désigne la « tribu », et non le bâton ou la branche. Les préfixes וּ et לְ sont rendus naturellement par « Et pour » dans cette liste.
- source_word: בְנֵי זְבוּלֻן
  choice: des fils de Zabulon
  rationale: La formulation conserve le sens généalogique explicite de בְנֵי (« fils de »), employé ici collectivement pour les membres de la tribu.
- source_word: נָשִׂיא
  choice: un responsable
  rationale: נָשִׂיא désigne ici l'homme investi d'une fonction représentative à la tête de la tribu. « Responsable » est clair en français moderne et évite les connotations monarchiques de « prince ».
- source_word: אֱלִיצָפָן
  choice: Élitsafân
  rationale: Le nom propre est translittéré d'après sa forme hébraïque, avec une graphie française lisible.
- source_word: בֶּן פַּרְנָךְ
  choice: fils de Parnak
  rationale: בֶּן est le marqueur généalogique courant signifiant « fils de ». Le nom פַּרְנָךְ est translittéré en « Parnak ».
