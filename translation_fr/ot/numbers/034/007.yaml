  text: וְ/זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֣וּל צָפ֑וֹן מִן הַ/יָּם֙ הַ/גָּדֹ֔ל תְּתָא֥וּ לָ/כֶ֖ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: fr
  text: 'Voici quelle sera votre frontière nord : depuis la Grande Mer, vous tracerez la frontière jusqu’au mont Hor[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous marquerez la frontière jusqu’au mont Hor ». Dans ce contexte géographique, le verbe peut désigner le tracé ou le marquage d’une frontière.'
    reason: lexical_alternative
  - marker: b
    text: La « Grande Mer » désigne la mer Méditerranée.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: Voici quelle sera votre
  rationale: Cette formulation française naturelle conserve l’introduction successive et la valeur prospective de la description légale, tout en rendant le datif possessif par « votre ».
- source_word: גְּבוּל צָפוֹן
  choice: frontière nord
  rationale: Expression géographique courante en français moderne pour désigner la limite septentrionale du territoire.
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: depuis la Grande Mer
  rationale: Conserve la désignation géographique littérale de l’hébreu au lieu de lui substituer directement le nom moderne ; la note précise le référent.
- source_word: תְּתָא֥וּ לָ/כֶ֖ם
  choice: vous tracerez la frontière
  rationale: Dans ce contexte de délimitation territoriale, le verbe désigne vraisemblablement l’action de tracer ou de marquer une ligne frontière. Le pronom français « vous » rend le sujet collectif ; l’objet explicité assure une lecture naturelle.
- source_word: הֹ֥ר הָ/הָֽר
  choice: le mont Hor
  rationale: Rend le toponyme selon son usage français établi, plutôt que par la forme littérale inhabituelle « Hor la montagne ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure garde le caractère prescriptif d’une délimitation territoriale, tout en évitant le « shall » français artificiel. Les deux appels de note figurent dans le texte principal.
