  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: fr
  text: 'Moïse donna alors cet ordre aux Israélites : « Voici le pays que vous recevrez en héritage par tirage au sort, et que l’Éternel a ordonné de donner aux neuf tribus et à la demi-tribu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent français naturel et exact de l’expression collective « fils d’Israël » dans ce contexte national.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: vous recevrez en héritage
  rationale: Le hitpael de נחל exprime ici la prise de possession du pays comme héritage attribué; cette formulation française garde l’idée d’héritage sans lourdeur.
- source_word: בְּגוֹרָל
  choice: par tirage au sort
  rationale: Rend explicitement le procédé d’attribution indiqué par גּוֹרָל.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et digne du tétragramme, clairement distinct du titre « Seigneur ».
- source_word: לָתֵת
  choice: de donner
  rationale: Conserve l’infinitif actif du texte hébreu sans introduire un passif ni préciser un agent que la syntaxe laisse implicite.
- source_word: תִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: aux neuf tribus et à la demi-tribu
  rationale: Rend directement le décompte tribal, avec le singulier du second מַטֶּה.
theological_decisions:
- issue: Agent implicite de « donner »
  choice: Conserver « a ordonné de donner » sans nommer l’agent chargé de donner le pays.
  alternative: « a ordonné que soit donné » ou « vous a ordonné de donner »
  rationale: L’hébreu אֲשֶׁר צִוָּה יְהוָה לָתֵת emploie un infinitif dont l’agent n’est pas explicité; la traduction préserve cette indétermination.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Donna alors cet ordre » restitue naturellement וַיְצַו…לֵאמֹר sans calquer la formule hébraïque « ordonna… en disant ». Aucun marqueur de note n’est requis.
