  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: fr
  text: 'Et pour la tribu des fils d’Aser, un chef : Ahihoud, fils de Shelomi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Et pour la tribu de
  rationale: Dans le contexte du partage tribal du territoire, מַטֶּה désigne la tribu, et non le bâton ou la branche. Les préfixes וּ et לְ sont naturellement rendus par « Et pour ».
- source_word: בְנֵי אָשֵׁר
  choice: des fils d’Aser
  rationale: La formulation conserve l’expression hébraïque littérale « fils de » employée comme désignation de la tribu, tout en restant naturelle en français biblique moderne.
- source_word: נָשִׂיא
  choice: un responsable
  rationale: Le terme désigne ici le représentant officiel de la tribu chargé de participer au partage du territoire. « Responsable » évite les connotations royales de « prince » et exprime clairement la fonction.
- source_word: אֲחִיהוּד
  choice: Ahihoud
  rationale: Le nom propre est translittéré selon une forme française claire, en représentant la voyelle ou de l’hébreu.
- source_word: בֶּן שְׁלֹמִי
  choice: fils de Shelomi
  rationale: Rendu direct et naturel de la construction patronymique hébraïque.
