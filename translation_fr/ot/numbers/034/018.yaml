- from: Vous prendrez un responsable de chaque tribu pour faire hériter le pays[a].
  to: Vous prendrez un responsable de chaque tribu pour attribuer le pays en héritage[a].
  rationale: La révision remplace une tournure française non idiomatique par « attribuer le pays en héritage », qui correspond au sens causatif favorisé par la forme verbale et le contexte de l’attribution du territoire. La note maintient l’alternative liée au domaine lexical de l’héritage sans masquer la lecture contextuellement la plus probable.
