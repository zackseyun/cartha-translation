review_pass:
  verdict: revise
  source_fidelity: Le verbe לִנְחֹל, dans ce contexte d’organisation de l’attribution territoriale et avec « le pays » comme complément direct, exprime le fait de faire recevoir le pays en héritage, donc de l’attribuer. « Faire hériter le pays » inverse toutefois, en français, le rapport attendu entre les bénéficiaires et le pays.
  naturalness: '« Vous prendrez un responsable de chaque tribu » est naturel et clair. « Pour faire hériter le pays » n’est pas idiomatique : en français, on fait hériter quelqu’un d’un bien, ou l’on attribue un bien en héritage.'
  terminology: « Responsable » est acceptable dans un français moderne international pour נָשִׂיא dans ce cadre administratif; « tribu » et « pays » conviennent. « Attribuer le pays en héritage » rend précisément la fonction d’allotissement sans introduire une terminologie confessionnelle.
  issues:
  - severity: medium
    issue: Construction française ambiguë et peu naturelle de « faire hériter le pays »
    rationale: La formule peut laisser entendre que le pays est lui-même l’héritier. Le texte hébreu vise l’attribution du pays aux bénéficiaires comme héritage. « Attribuer le pays en héritage » rend cette relation clairement et naturellement.
  - severity: low
    issue: La note présente « prendre possession du pays en héritage » comme une alternative sans signaler que le contexte administratif favorise l’attribution.
    rationale: Cette possibilité relève du champ sémantique de l’héritage, mais le complément direct et le contexte immédiat favorisent le sens causatif/attributif. La note révisée conserve l’alternative tout en indiquant la lecture contextuellement privilégiée.
