  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: fr
  text: Vous prendrez un responsable de chaque tribu pour attribuer le pays en héritage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour prendre possession du pays en héritage ». Le verbe hébreu appartient au champ de l’héritage; dans ce contexte, il est généralement compris au sens de faire recevoir le pays en héritage, c’est-à-dire d’en attribuer les parts.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: responsable
  rationale: Dans ce contexte administratif, le terme désigne un chef ou représentant reconnu. « Responsable » est clair en français moderne et évite la connotation royale de « prince ».
- source_word: אֶחָד ... אֶחָד
  choice: un ... de chaque
  rationale: La répétition distributive indique un représentant par tribu; « un responsable de chaque tribu » l'exprime naturellement.
- source_word: מִמַּטֶּה
  choice: de chaque tribu
  rationale: מַטֶּה peut désigner un bâton, mais signifie ici une tribu en tant qu'unité administrative.
- source_word: תִּקְחוּ
  choice: vous prendrez
  rationale: L'imparfait hébreu a ici une valeur directive adressée à plusieurs personnes; le futur français conserve cette force d'instruction avec dignité.
- source_word: לִנְחֹל
  choice: pour faire hériter
  rationale: La forme verbale peut exprimer soit l'entrée en possession d'un héritage, soit l'action de faire recevoir ou d'attribuer cet héritage. « Faire hériter » maintient la valeur causative possible sans détailler davantage que l'hébreu le processus de répartition.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le mot désigne ici le territoire promis et attribué à Israël; « le pays » est idiomatique dans ce contexte géographique.
theological_decisions:
- issue: Rôle des responsables dans l'héritage du pays
  choice: Traduire לִנְחֹל par « faire hériter »
  alternative: « prendre possession du pays en héritage »
  rationale: Le contexte immédiat présente ces responsables comme participant à l'attribution du territoire, tandis que le verbe appartient au champ de l'héritage et admet une lecture non causative. Le texte retient la nuance causative probable et la note conserve l'autre possibilité.
translation_notes:
  register: Français international moderne, simple et digne. « Responsable » convient à la fonction administrative; « faire hériter » est légèrement marqué mais préserve la concision et l'ambiguïté lexicale de l'hébreu, explicitée en note.
