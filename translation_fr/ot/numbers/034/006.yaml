  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: fr
  text: Quant à votre frontière occidentale, la Grande Mer vous servira de frontière[a] ; telle sera votre frontière occidentale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « frontière de mer » ou « frontière maritime ». Dans cette description des limites du territoire, le mot hébreu traduit par « mer » désigne aussi la direction de l’ouest ; d’où « frontière occidentale ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: frontière
  rationale: Dans ce contexte de délimitation territoriale, « frontière » désigne naturellement la limite du pays.
- source_word: יָם
  choice: occidentale
  rationale: 'Dans l’expression גְּבוּל יָם, « mer » a une valeur directionnelle : le côté de la mer, donc l’ouest.'
- source_word: הַיָּם הַגָּדוֹל
  choice: la Grande Mer
  rationale: Cette appellation géographique biblique désigne la Méditerranée ; la majuscule conserve sa valeur de nom géographique.
- source_word: וְהָיָה לָכֶם
  choice: vous servira de
  rationale: Cette formulation française exprime naturellement que la Grande Mer constituera la frontière assignée au peuple.
- source_word: וּגְבוּל
  choice: frontière
  rationale: Le nom reprend en apposition la fonction de la Grande Mer comme limite territoriale.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל יָם
  choice: telle sera votre frontière occidentale
  rationale: Cette tournure restitue clairement la formule récapitulative hébraïque sans lourdeur.
