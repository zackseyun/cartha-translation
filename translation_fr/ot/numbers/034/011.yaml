  text: וְ/יָרַ֨ד הַ/גְּבֻ֧ל מִ/שְּׁפָ֛ם הָ/רִבְלָ֖ה מִ/קֶּ֣דֶם לָ/עָ֑יִן וְ/יָרַ֣ד הַ/גְּב֔וּל וּ/מָחָ֛ה עַל כֶּ֥תֶף יָם כִּנֶּ֖רֶת קֵֽדְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: fr
  text: Puis la frontière descendra de Shepham vers Ribla, à l’est d’Aïn[a] ; puis la frontière descendra et atteindra le côté de la mer de Kinnéreth, à l’est[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se rendre plus littéralement par « du côté oriental d’Aïn ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « touchera l’épaule de la mer de Kinnéreth, vers l’est ». Dans cet emploi géographique, « épaule » désigne un côté ou un flanc du terrain voisin de la mer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: descendra
  rationale: Le verbe יָרַד signifie « descendre ». Dans cette description territoriale, le futur français exprime naturellement le tracé prescrit de la frontière tout en conservant son mouvement topographique.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: la frontière
  rationale: גְּבוּל désigne ici la limite d’un territoire. « Frontière » est clair et naturel dans une description géographique.
- source_word: מִשְּׁפָם
  choice: de Shefam
  rationale: Le nom de lieu est translittéré en français ; la préposition מִן indique le point de départ.
- source_word: הָרִבְלָה
  choice: vers Ribla
  rationale: Le nom propre est translittéré. Le hé directionnel indique le mouvement vers ce lieu ; « vers » évite d’affirmer nécessairement que la ligne le traverse ou s’y termine.
- source_word: מִקֶּדֶם לָעָיִן
  choice: à l’est d’Aïn
  rationale: Cette expression situe Ribla par rapport à Aïn. « À l’est d’Aïn » rend directement et naturellement la relation géographique, tout en laissant en note la valeur plus littérale de מִקֶּדֶם.
- source_word: וּמָחָה
  choice: atteindra
  rationale: Dans ce contexte de délimitation, מחה exprime le contact de la frontière avec un élément géographique. « Atteindra » restitue ce sens sans le littéralisme trompeur de « frapper ».
- source_word: עַל כֶּתֶף
  choice: le versant
  rationale: כֶּתֶף signifie littéralement « épaule », mais désigne en emploi topographique un côté, un flanc ou un versant. « Versant » est intelligible en français moderne et conserve l’idée du relief.
- source_word: יָם כִּנֶּרֶת
  choice: la mer de Kinnéreth
  rationale: La désignation hébraïque est conservée plutôt que remplacée par un nom postérieur. « Mer » correspond formellement à יָם.
- source_word: קֵדְמָה
  choice: oriental
  rationale: L’adverbe indique l’orientation vers l’est. Intégré à « versant oriental », il produit une formulation française fluide sans perdre l’indication directionnelle.
