source:
  edition: WLC
  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: fr
  text: 'Voici les noms des hommes qui vous attribueront le pays en héritage : Éléazar, le prêtre, et Josué, fils de Noun[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui vous donneront le pays en héritage » ou « qui vous feront hériter du pays ». Le verbe hébreu exprime ici l’idée de faire recevoir un héritage ou de l’attribuer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Voici les noms
  rationale: La formule française « Voici les noms » rend naturellement la proposition nominale hébraïque qui introduit l’énumération.
- source_word: הָאֲנָשִׁים
  choice: des hommes
  rationale: Le masculin pluriel désigne ici les responsables masculins nommément désignés dans le passage.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif introduit la fonction exercée par ces hommes.
- source_word: יִנְחֲלוּ לָכֶם אֶת־הָאָרֶץ
  choice: qui vous attribueront le pays en héritage
  rationale: La forme causative de נחל indique que ces responsables feront entrer le peuple en possession de son héritage en en administrant l’attribution. « Attribueront » exprime clairement cette fonction, tandis que « en héritage » conserve la valeur du verbe hébreu.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Éléazar, le prêtre
  rationale: Translittération française usuelle du nom, suivie du titre de fonction rendu explicitement.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: et Josué, fils de Noun
  rationale: Les formes françaises traditionnelles et intelligibles des noms sont retenues; la relation patronymique est rendue directement.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le futur simple convient à l’annonce de la mission confiée à ces responsables. « Pays » rend naturellement הָאָרֶץ dans ce contexte territorial, et la note préserve la nuance causative et successorale du verbe.
