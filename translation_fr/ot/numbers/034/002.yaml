source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי אַתֶּ֥ם בָּאִ֖ים אֶל הָ/אָ֣רֶץ כְּנָ֑עַן זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּפֹּ֤ל לָ/כֶם֙ בְּֽ/נַחֲלָ֔ה אֶ֥רֶץ כְּנַ֖עַן לִ/גְבֻלֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: fr
  text: 'Donne cet ordre aux Israélites[a] et dis-leur : « Quand vous entrerez dans le pays de Canaan, voici le pays qui vous échoira en héritage[b] : le pays de Canaan, selon ses frontières. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui vous sera attribué en héritage ». L’hébreu dit littéralement « qui tombera pour vous », expression employée pour une part territoriale assignée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Donne cet ordre
  rationale: L’impératif de צוה exprime une directive ferme. « Donne cet ordre » restitue cette autorité dans un français naturel et convient bien à la formule qui introduit les paroles à transmettre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël ». Dans ce contexte collectif, « les Israélites » désigne naturellement l’ensemble du peuple en français moderne sans modifier le référent.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Traduction directe de la seconde injonction, qui distingue l’ordre donné à Moïse des paroles qu’il doit transmettre au peuple.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: Quand vous entrerez dans
  rationale: כִּי introduit ici la circonstance future de l’entrée dans le pays. Le futur français rend naturellement la valeur prospective du participe בָּאִים.
- source_word: הָאָרֶץ כְּנָעַן
  choice: le pays de Canaan
  rationale: Cette formulation idiomatique rend clairement l’apposition hébraïque entre « le pays » et « Canaan ».
- source_word: זֹאת הָאָרֶץ
  choice: voici le pays
  rationale: « Voici » conserve la force présentative du démonstratif et introduit naturellement la délimitation territoriale qui suit.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם
  choice: qui vous échoira
  rationale: Le verbe נפל signifie littéralement « tomber », mais désigne ici le territoire attribué, probablement par lot. « Échoir » conserve l’image d’une part qui revient à quelqu’un tout en restant intelligible dans ce registre juridique solennel.
- source_word: בְּנַחֲלָה
  choice: en héritage
  rationale: נחלה désigne une possession héréditaire ou une part attribuée. « En héritage » convient au contexte foncier et à la promesse du pays.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: le pays de Canaan, selon ses frontières
  rationale: La préposition ל avec le pluriel גְבֻלוֹת introduit les limites territoriales qui vont être détaillées. « Selon ses frontières » préserve cette fonction de délimitation.
theological_decisions:
- issue: La terre comme héritage attribué
  choice: Conserver « échoira en héritage »
  alternative: « vous sera attribué en héritage »
  rationale: La formulation retenue garde l’idiome concret de נפל sans préciser davantage le mécanisme d’attribution ni effacer la notion d’héritage portée par נחלה.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve les deux impératifs hébreux (« Donne cet ordre… et dis-leur »), tandis que « Israélites » évite une tournure littérale aujourd’hui moins naturelle. « Échoira » relève d’un registre légèrement soutenu, approprié à une instruction juridique et territoriale.
