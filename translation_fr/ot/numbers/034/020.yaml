  text: וּ/לְ/מַטֵּה֙ בְּנֵ֣י שִׁמְע֔וֹן שְׁמוּאֵ֖ל בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: fr
  text: 'Et pour la tribu des fils de Siméon : Shemouël, fils d’Ammihoud.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Pour la tribu de
  rationale: Dans cette liste administrative, מַטֶּה désigne une tribu, non un bâton ou une branche. En français, la coordination ו peut rester implicite dans l’énumération, tandis que לְ est naturellement rendu par « pour ».
- source_word: בְּנֵי
  choice: des fils de
  rationale: Le pluriel construit signifie littéralement « fils de » et sert ici de désignation tribale conventionnelle.
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: שְׁמוּאֵל
  choice: Shemouël
  rationale: Translittération française qui reflète directement la forme hébraïque du nom, tout en distinguant ce personnage de la forme française traditionnelle « Samuel ».
- source_word: בֶּן
  choice: fils de
  rationale: Rendu direct du marqueur généalogique dans cette liste de responsables tribaux.
- source_word: עַמִּיהוּד
  choice: Ammihoud
  rationale: Translittération française usuelle du nom hébreu.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, sobre et digne. La structure nominale concise de la liste hébraïque est conservée. Aucun appel de note n’est nécessaire : « Shemouël » est une translittération française transparente, et l’alternative anglaise « Samuel » relève spécifiquement de l’anglicisation.'
