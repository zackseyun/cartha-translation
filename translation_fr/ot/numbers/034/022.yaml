source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵי דָ֖ן נָשִׂ֑יא בֻּקִּ֖י בֶּן יָגְלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: fr
  text: 'Pour la tribu des descendants de Dan, un chef : Bouqqi, fils de Yogli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Pour la tribu de
  rationale: Dans le contexte du partage du territoire en Nombres 34, מַטֶּה désigne une tribu, et non littéralement un bâton. La coordination hébraïque n’a pas besoin d’être reproduite par « et » dans cette liste en français.
- source_word: בְנֵי דָן
  choice: des descendants de Dan
  rationale: Littéralement « fils de Dan »; dans cette formule tribale, l’expression désigne l’ensemble de ses descendants. « Descendants » restitue clairement ce sens collectif en français moderne.
- source_word: נָשִׂיא
  choice: un responsable
  rationale: Le terme désigne ici le représentant tribal chargé de participer au partage du pays. « Responsable » exprime cette fonction sans suggérer une dignité royale comme pourrait le faire « prince ».
- source_word: בֻּקִּי
  choice: Bouqui
  rationale: Translittération française usuelle du nom hébreu, avec ou pour le qibbouts et qu pour le qoph.
- source_word: בֶּן
  choice: fils de
  rationale: Expression filiale directe et naturelle dans l’identification d’une personne.
- source_word: יָגְלִי
  choice: Yogli
  rationale: Translittération française proche de l’hébreu, conservant le yod initial par Y.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation concise conserve la structure nominale de la liste hébraïque tout en privilégiant « descendants de Dan » pour rendre sans ambiguïté la valeur tribale collective.
