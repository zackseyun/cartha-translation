  text: Then Yahweh spoke to Moses, saying,
translation:
  language: fr
  text: 'Puis Yahweh parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis ... parla
  rationale: Le wayyiqtol fait progresser le récit. « Puis » en restitue naturellement la valeur séquentielle, tandis que « parla » correspond précisément à דבר dans cette formule introductive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל introduit ici le destinataire de la parole ; « à Moïse » est l’expression française courante.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule introduit les paroles qui suivent. « En ces termes : » est idiomatique en français et signale clairement que le discours direct commence au verset suivant.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre ; « Jéhovah » repose sur une vocalisation hybride traditionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la progression narrative et la fonction introductive de la formule hébraïque, tout en évitant le calque peu naturel « disant ».
