  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה נָשִׂ֑יא חַנִּיאֵ֖ל בֶּן אֵפֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: fr
  text: 'Pour les fils de Joseph[a], pour la tribu des fils de Manassé : un chef, Hanniel, fils d’Éphod.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants de Joseph […] descendants de Manassé ». L’hébreu emploie deux fois l’expression « fils de » dans un sens tribal et généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Pour les fils de Joseph
  rationale: « Fils de » conserve la forme généalogique de l’hébreu tout en désignant ici les membres issus de Joseph; la préposition לְ est rendue par « pour » dans cette liste de représentants.
- source_word: לְמַטֵּה
  choice: pour la tribu de
  rationale: Dans le contexte administratif du partage du pays, מַטֶּה désigne une tribu, et non un bâton; לְ est rendu par « pour ».
- source_word: בְנֵי מְנַשֶּׁה
  choice: les fils de Manassé
  rationale: La formulation conserve le parallélisme généalogique hébreu; dans ce contexte tribal, elle inclut les descendants de Manassé.
- source_word: נָשִׂיא
  choice: un responsable
  rationale: Le terme désigne ici le représentant placé à la tête d’une tribu. « Responsable » est naturel en français moderne et évite les connotations royales de « prince ».
- source_word: חַנִּיאֵל
  choice: Hanniel
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בֶּן אֵפֹד
  choice: fils d’Éphod
  rationale: Construction patronymique hébraïque ordinaire. Éphod est ici un nom de personne, et non la désignation du vêtement sacerdotal.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure de liste et la répétition de « pour » sont maintenues afin de refléter la syntaxe administrative de l’hébreu; « fils de » préserve sa formulation généalogique, avec une note explicitant son sens collectif.
