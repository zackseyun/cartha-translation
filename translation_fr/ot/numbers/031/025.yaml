lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait avancer le récit. « Puis » exprime naturellement cette progression en français; « Et » reste possible dans la formule narrative hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que remplacé par un titre.
- source_word: אֶל
  choice: à
  rationale: Cette préposition introduit naturellement en français le destinataire du verbe « dire ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans la tournure lourde « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin. « Yahweh » préserve sa valeur de nom propre, tandis que « le SEIGNEUR » constitue une substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, simple et digne. « Dit » rend directement אָמַר; les deux-points annoncent avec naturel le contenu de la parole au verset suivant.
