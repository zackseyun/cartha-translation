  text: וַ/יְהִ֛י הַ/מֶּ֥כֶס לַֽ/יהוָ֖ה מִן הַ/צֹּ֑אן שֵׁ֥שׁ מֵא֖וֹת חָמֵ֥שׁ וְ/שִׁבְעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: fr
  text: Le tribut pour Yahweh, prélevé sur le petit bétail, fut de six cent soixante-quinze têtes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut de
  rationale: Dans cette indication comptable au fil du récit, la forme de היה sert de copule et introduit le montant; « fut de » est naturel et fidèle en français.
- source_word: הַמֶּכֶס
  choice: le tribut
  rationale: מֶכֶס désigne ici la part exigée sur le butin et mise à part; « tribut » conserve cette idée sans évoquer trop précisément un impôt moderne.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique que cette part est destinée ou consacrée à Yahweh.
- source_word: יהוה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à la décision théologique fournie et sans le remplacer par un titre.
- source_word: מִן הַצֹּאן
  choice: prélevé sur le petit bétail
  rationale: צֹאן est un collectif désignant les ovins et les caprins; « petit bétail » évite de le réduire aux seuls moutons, tandis que « prélevé sur » explicite naturellement la relation partitive de מִן.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: six cent soixante-quinze
  rationale: Rendu cardinal exact et conforme à l'usage orthographique français traditionnel pour ce nombre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme; « Yahweh » préserve ici le nom d'alliance conformément à la décision doctrinale fournie.
translation_notes:
  register: Français international moderne, sobre et digne. « Petit bétail » garde l'étendue sémantique du collectif hébreu; « têtes » est ajouté comme classificateur français naturel dans un dénombrement d'animaux, sans changer le total.
