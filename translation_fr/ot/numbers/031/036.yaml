  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: fr
  text: La moitié — la part de ceux qui étaient partis au combat — comptait 337 500 moutons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: comptait
  rationale: Dans ce relevé numérique, le verbe היה introduit le total obtenu. « comptait » est idiomatique en français et n’ajoute pas d’interprétation substantielle.
- source_word: הַמֶּחֱצָה חֵלֶק
  choice: La moitié — la part
  rationale: « La moitié » conserve le sens précis de מֶחֱצָה, tandis que « la part » rend l’apposition חֵלֶק qui précise à qui cette moitié revient.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: ceux qui étaient partis au combat
  rationale: L’expression désigne les hommes partis dans le cadre de l’expédition militaire. « au combat » restitue naturellement le sens contextuel de בַּצָּבָא sans réduire le groupe au seul nom « guerriers ».
- source_word: מִסְפַּר הַצֹּאן
  choice: comptait … moutons
  rationale: La tournure française intègre naturellement מִסְפַּר dans le verbe « comptait ». Dans cette liste de butin, הַצֹּאן désigne les moutons.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337 500
  rationale: Le nombre hébreu est additif et correspond exactement à 337 500. L’écriture chiffrée avec une espace comme séparateur des milliers suit l’usage typographique français moderne.
