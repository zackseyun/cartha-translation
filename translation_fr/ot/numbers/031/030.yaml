revisions:
- from: Sur la moitié attribuée aux fils d’Israël, tu prélèveras un être sur cinquante[a], parmi les personnes, les bovins, les ânes et le petit bétail[b] — parmi toutes les bêtes —, et tu les donneras aux lévites chargés de la garde du tabernacle de Yahvé.
  to: De la moitié revenant aux fils d’Israël, tu prélèveras un sur cinquante[a], parmi les personnes, les bovins, les ânes et le petit bétail[b] — parmi tout le bétail —, et tu les donneras aux lévites chargés de la garde du tabernacle de Yahvé.
  rationale: 'La révision remplace deux formulations françaises peu naturelles sans modifier le sens : le prélèvement est pris de la moitié revenant aux Israélites et correspond à un sur cinquante dans les catégories énumérées. La note a conserve la nuance passive de אָחוּז, tandis que le texte principal emploie la formulation française usuelle du ratio.'
  reviewer_model: gpt-5.6-terra
