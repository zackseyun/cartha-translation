  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: fr
  text: De la moitié revenant aux fils d’Israël, tu prélèveras un sur cinquante[a], parmi les personnes, les bovins, les ânes et le petit bétail[b] — parmi tout le bétail —, et tu les donneras aux lévites chargés de la garde du tabernacle de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un pris sur cinquante » ; c’est-à-dire un sur cinquante.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « petit bétail » peut désigner collectivement les moutons et les chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Sur la moitié attribuée aux fils d’Israël
  rationale: מַחֲצִית désigne une moitié ou demi-part. « Attribuée » explicite naturellement qu’il s’agit de la part revenant aux fils d’Israël, tandis que « fils d’Israël » conserve l’expression hébraïque dans ce contexte juridique.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: un être sur cinquante
  rationale: La formule fixe un prélèvement d’un sur cinquante. Le nom « être » convient à la fois aux personnes et aux animaux énumérés ensuite; la note conserve la nuance passive de אָחֻז.
- source_word: מִן הָאָדָם
  choice: parmi les personnes
  rationale: אָדָם est ici un singulier collectif désignant la part humaine du butin. « Les personnes » restitue ce sens en français naturel sans suggérer un seul homme.
- source_word: מִן הַבָּקָר
  choice: les bovins
  rationale: בָּקָר désigne le gros bétail, particulièrement les bovins. « Bovins » est précis et courant dans une énumération de cheptel.
- source_word: מִן הַחֲמֹרִים
  choice: les ânes
  rationale: Équivalent moderne et direct du pluriel חֲמֹרִים.
- source_word: וּמִן הַצֹּאן
  choice: et le petit bétail
  rationale: צֹאן est un collectif englobant normalement moutons et chèvres. « Petit bétail » en rend mieux l’étendue que le seul mot « troupeau ».
- source_word: מִכָּל הַבְּהֵמָה
  choice: parmi toutes les bêtes
  rationale: Cette expression récapitule largement les animaux domestiques mentionnés. « Bêtes » conserve la portée générale de בְּהֵמָה sans ajouter une classification absente du texte.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: chargés de la garde du tabernacle
  rationale: La construction apparentée שֹׁמְרֵי מִשְׁמֶרֶת insiste sur une responsabilité de garde ou de surveillance. Cette formulation française est naturelle et garde le sens custodial.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Yahweh
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » est la forme française traditionnelle et intelligible du nom propre, qui évite de le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et directement compréhensible. Le tutoiement singulier reflète l’ordre adressé à Moïse. La formulation conserve le caractère juridique du prélèvement tout en évitant des tournures françaises artificielles.
