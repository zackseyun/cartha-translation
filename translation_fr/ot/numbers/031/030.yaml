review_pass:
  verdict: revise
  source_fidelity: Le sens du prélèvement d’un cinquantième est conservé, de même que l’énumération des personnes et des catégories de bétail, ainsi que la fonction de garde des lévites. Toutefois, « un être » n’est pas une désignation naturelle en français pour l’unité prélevée dans une liste qui comprend personnes et animaux. « Sur la moitié » rend aussi moins exactement la préposition « de, à partir de » que « De la moitié ».
  naturalness: La formulation proposée est globalement claire, mais « un être sur cinquante » est maladroit et peut évoquer une créature plutôt qu’une unité de prélèvement. « Un sur cinquante » est idiomatique, précis et garde l’ambiguïté délibérée du référent. La reprise « parmi toutes les bêtes » reste proche de la récapitulation hébraïque, mais « parmi tout le bétail » convient mieux au contexte d’animaux domestiques.
  terminology: « Fils d’Israël », « bovins », « ânes », « petit bétail », « lévites », « tabernacle » et « Yahvé » sont appropriés. « Chargés de la garde » rend correctement la responsabilité cultuelle exprimée par la construction hébraïque.
  issues:
  - severity: medium
    issue: « Sur la moitié attribuée »
    rationale: 'La préposition hébraïque indique la source du prélèvement : il est pris de la moitié des fils d’Israël. « De la moitié revenant aux fils d’Israël » est plus exact et naturel.'
  - severity: medium
    issue: « un être sur cinquante »
    rationale: Le mot « être » est peu idiomatique ici et ne rend pas naturellement une unité indifférenciée pouvant appartenir à plusieurs catégories. « un sur cinquante » exprime clairement le ratio sans restreindre le référent.
  - severity: low
    issue: « parmi toutes les bêtes »
    rationale: Dans ce contexte de cheptel, « parmi tout le bétail » est plus naturel et plus cohérent avec בְּהֵמָה, tout en conservant la récapitulation finale.
  revised_text: De la moitié revenant aux fils d’Israël, tu prélèveras un sur cinquante[a], parmi les personnes, les bovins, les ânes et le petit bétail[b] — parmi tout le bétail —, et tu les donneras aux lévites chargés de la garde du tabernacle de Yahvé.
  revised_footnotes:
