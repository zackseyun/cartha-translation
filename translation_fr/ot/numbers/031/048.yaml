  text: וַֽ/יִּקְרְבוּ֙ אֶל מֹשֶׁ֔ה הַ/פְּקֻדִ֕ים אֲשֶׁ֖ר לְ/אַלְפֵ֣י הַ/צָּבָ֑א שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/שָׂרֵ֥י הַ/מֵּאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: fr
  text: Les responsables[a] des milliers[b] de l’armée, c’est-à-dire les chefs de milliers et les chefs de centaines, s’approchèrent de Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne ici des hommes établis dans une fonction de responsabilité militaire ; la suite les identifie comme chefs de milliers et chefs de centaines.
    reason: lexical_note
  - marker: b
    text: Le mot traduit par « milliers » peut désigner soit des groupes comptés par mille, soit des formations militaires appelées ainsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: s’approchèrent de
  rationale: Le verbe קרב décrit ici un mouvement vers Moïse. « S’approchèrent de » en conserve le sens concret et convient au récit.
- source_word: הַפְּקֻדִים
  choice: les responsables
  rationale: Cette forme issue de פקד désigne des hommes établis ou affectés à une charge. « Responsables » exprime leur fonction sans leur attribuer un grade moderne précis; la suite indique qu’il s’agit des chefs de milliers et de centaines.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: des milliers de l’armée
  rationale: La formulation garde la désignation hébraïque des formations militaires et leur rattachement à l’armée, sans trancher plus que le contexte ne le permet entre une valeur numérique stricte et un nom d’unité.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: les chefs de milliers et les chefs de centaines
  rationale: Dans ce contexte militaire, שׂר désigne un dirigeant ou commandant. « Chefs » est clair, digne et suffisamment large, tandis que la répétition conserve le parallélisme hébreu.
theological_decisions: []
translation_notes:
  register: Français international actuel, au registre narratif digne. La tournure « c’est-à-dire » rend explicite l’apposition qui identifie les responsables, tandis que « milliers » et « centaines » conserve la structure militaire du texte hébreu.
