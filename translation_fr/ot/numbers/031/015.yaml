  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מֹשֶׁ֑ה הַֽ/חִיִּיתֶ֖ם כָּל נְקֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: fr
  text: 'Moïse leur dit : « Avez-vous laissé en vie toutes les personnes de sexe féminin ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple convient au wayyiqtol narratif de אמר et au registre soutenu mais courant du récit biblique français.
- source_word: אֲלֵיהֶם
  choice: leur
  rationale: Le pronom indirect rend naturellement אֶל avec le suffixe masculin pluriel dans l’expression française « leur dit ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française conventionnelle du nom propre.
- source_word: הַחִיִּיתֶם
  choice: avez-vous laissé en vie
  rationale: Le hifil de חיה exprime ici le fait de laisser vivre ou de maintenir en vie. Le passé composé relie l’action accomplie à l’examen immédiat de ses résultats.
- source_word: כָּל
  choice: toutes les
  rationale: Avec le singulier collectif נְקֵבָה, כָּל exprime ici la totalité de la catégorie; le pluriel est idiomatique en français.
- source_word: נְקֵבָה
  choice: personnes de sexe féminin
  rationale: נְקֵבָה désigne le sexe féminin sans limiter le référent aux adultes. Cette formulation conserve cette étendue tout en évitant l’emploi substantivé potentiellement déshumanisant de « femelles » pour des êtres humains.
theological_decisions:
- issue: Rendu de נְקֵבָה dans un contexte de violence guerrière
  choice: personnes de sexe féminin
  alternative: femmes; femmes et filles; femelles
  rationale: Le terme hébreu est plus large que « femmes » et ne fixe aucune limite d’âge. « Personnes de sexe féminin » préserve la portée générale et la dureté du propos sans introduire une restriction interprétative ni employer en français moderne un terme généralement réservé aux animaux.
translation_notes:
  register: Français international moderne, naturel et digne. La question directe conserve le ton de reproche du contexte sans l’expliciter au-delà du texte hébreu.
