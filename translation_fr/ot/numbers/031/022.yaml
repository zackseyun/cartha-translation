base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: fr
  text: Seulement l’or, l’argent, le bronze[a], le fer, l’étain et le plomb —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre ». Le terme hébreu peut désigner plus largement un métal à base de cuivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Seulement
  rationale: Dans ce contexte, le terme introduit une restriction par rapport aux instructions précédentes plutôt qu’une forte opposition.
- source_word: הַזָּהָב
  choice: l’or
  rationale: Désignation habituelle du métal.
- source_word: הַכָּסֶף
  choice: l’argent
  rationale: Le contexte d’une énumération de métaux indique le métal, et non la monnaie.
- source_word: הַנְּחֹשֶׁת
  choice: le bronze
  rationale: Le mot hébreu peut désigner le cuivre ou le bronze; « bronze » convient naturellement aux listes bibliques de métaux, tandis que l’autre possibilité est signalée en note.
- source_word: הַבַּרְזֶל
  choice: le fer
  rationale: Équivalent français usuel.
- source_word: הַבְּדִיל
  choice: l’étain
  rationale: Dans cette liste de métaux, le sens le plus probable est « étain » plutôt que « alliage ».
- source_word: הָעֹפָרֶת
  choice: le plomb
  rationale: Équivalent français usuel.
- source_word: אֵת (répété devant chaque nom)
  choice: non traduit séparément
  rationale: Cette particule marque et structure les compléments d’objet en hébreu; l’énumération et la ponctuation en rendent ici la fonction.
