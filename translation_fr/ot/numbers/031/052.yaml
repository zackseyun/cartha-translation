  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: fr
  text: La totalité de l’or de la contribution[a] qu’ils présentèrent à Yahweh fut de seize mille sept cent cinquante sicles ; cet or provenait des chefs de milliers et des chefs de centaines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrande ». Le terme hébreu désigne une contribution mise à part pour Yahweh ; on le traduit traditionnellement par « offrande par élévation ».
    reason: Signaler les principales possibilités lexicales de תְּרוּמָה et expliquer son sens cultuel.
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: Tout l’or … s’élevait à
  rationale: Cette formulation française exprime naturellement le total introduit par וַיְהִי tout en conservant le lien narratif et l’idée de totalité portée par כָּל.
- source_word: הַתְּרוּמָה
  choice: la contribution
  rationale: תְּרוּמָה désigne ici une part mise à part pour un usage sacré. « Contribution » convient au don prélevé sur le butin et évite l’expression traditionnelle mais obscure « offrande élevée ».
- source_word: אֲשֶׁר הֵרִימוּ
  choice: qu’ils avaient présentée
  rationale: Le hiphil de רום désigne ici l’action de mettre à part et de présenter à Dieu, non un simple geste physique consistant à lever. Le plus-que-parfait situe naturellement cette présentation avant l’établissement du total.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique le destinataire de la consécration, et le tétragramme est rendu par le nom divin « Yahweh ».
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: seize mille sept cent cinquante sicles
  rationale: Rendu direct du nombre et de l’unité hébraïque de poids ; « sicle » est la forme française biblique usuelle.
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: il provenait des chefs de milliers et des chefs de centaines
  rationale: מֵאֵת marque la provenance. Les expressions militaires hiérarchiques sont conservées sans les réduire à de simples nombres d’individus.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve sa fonction de nom propre d’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. « S’élevait à » rend idiomatiquement l’énoncé du total. La reprise par « il provenait » évite une longue construction ambiguë tout en conservant la provenance finale exprimée en hébreu.
