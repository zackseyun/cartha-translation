  variant: modern international French
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: fr
  text: « Voici, ce sont elles qui, sur le conseil de Balaam[a], ont amené les fils d’Israël[b] à se montrer infidèles envers Yahweh dans l’affaire de Péor ; c’est ainsi que le fléau a frappé la communauté de Yahweh. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la parole de Balaam » ; on peut aussi comprendre : « sur les conseils de Balaam » ou « à l’instigation de Balaam ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « les fils d’Israël » désigne ici le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: Voici, ce sont elles qui
  rationale: La construction emphatique désigne explicitement un groupe féminin. Cette formulation en conserve l’insistance tout en restant naturelle en français.
- source_word: בִּדְבַר בִּלְעָם
  choice: sur le conseil de Balaam
  rationale: Dans ce contexte, דָּבָר renvoie à la parole donnée comme conseil ou instigation. La note conserve le sens littéral plus large.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction maintient l’expression hébraïque, tout en signalant en note qu’elle désigne ici le peuple d’Israël.
- source_word: לִמְסָר מַעַל
  choice: ont amené … à se montrer infidèles
  rationale: La tournure rend l’action causative exprimée dans le contexte et la notion de rupture de fidélité portée par מַעַל.
- source_word: בַּיהוָה
  choice: envers Yahweh
  rationale: Avec מַעַל, la préposition désigne celui envers qui l’infidélité est commise. Le nom divin est translittéré.
- source_word: עַל דְּבַר פְּעוֹר
  choice: dans l’affaire de Peor
  rationale: Cette expression renvoie à l’épisode concernant Peor sans préciser davantage que le texte source.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: c’est ainsi que le fléau a frappé
  rationale: La formulation exprime naturellement la conséquence narrative tout en conservant le lien causal avec l’infidélité précédente.
- source_word: בַּעֲדַת יְהוָה
  choice: la communauté de Yahweh
  rationale: עֵדָה désigne ici l’ensemble constitué du peuple. « Communauté » est actuel, digne et adapté au contexte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme ; sa translittération conserve le nom d’alliance sans le remplacer par un titre.
- issue: Degré de précision concernant le rôle de Balaam
  choice: sur le conseil de Balaam
  alternative: par la parole de Balaam
  rationale: Le contexte permet de comprendre la parole de Balaam comme un conseil, mais la formulation littérale et son amplitude sémantique sont conservées dans la note.
- issue: Identification du référent féminin de הֵנָּה
  choice: elles
  alternative: celles-ci
  rationale: Le pronom hébreu est féminin pluriel et renvoie, dans le contexte immédiat, aux femmes madianites. La traduction explicite le genre sans ajouter leur identité dans le verset.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » porte l’emphase initiale ; le point-virgule rend lisible la conséquence sans rompre l’unité de la phrase.
