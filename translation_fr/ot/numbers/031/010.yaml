  text: וְ/אֵ֤ת כָּל עָרֵי/הֶם֙ בְּ/מ֣וֹשְׁבֹתָ֔/ם וְ/אֵ֖ת כָּל טִֽירֹתָ֑/ם שָׂרְפ֖וּ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: fr
  text: Ils incendièrent toutes leurs villes dans leurs lieux d’habitation[a], ainsi que tous leurs campements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leurs établissements » ou « dans les lieux où ils habitaient ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes leurs enceintes » ou « tous leurs villages ». Le terme hébreu peut désigner différents types d’établissements ou d’enclos.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: leurs villes
  rationale: עִיר désigne couramment une ville ou une localité. « Villes » convient au contexte géographique et militaire sans préciser indûment leur taille.
- source_word: בְּמוֹשְׁבֹתָם
  choice: où ils habitaient
  rationale: מוֹשָׁב peut désigner un lieu d’habitation ou un établissement. Ici, la tournure relative exprime naturellement en français le rapport locatif avec « leurs villes ».
- source_word: טִירֹתָם
  choice: leurs campements
  rationale: טִירָה peut désigner un campement, une enceinte ou une forme d’établissement. « Campements » maintient ici la distinction avec les villes sans imposer une identification trop précise.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: incendièrent
  rationale: Le verbe שׂרף accompagné de בָּאֵשׁ exprime l’action de brûler par le feu. « Incendièrent » rend cette action clairement et sans la lourdeur, en français moderne, de « brûlèrent par le feu ».
- source_word: וְאֵת ... וְאֵת
  choice: toutes ... ainsi que tous
  rationale: Cette coordination conserve les deux ensembles visés dans leur totalité tout en donnant à la phrase une syntaxe française fluide.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Incendièrent » évite un calque pesant tout en conservant explicitement l’idée du feu. Les notes préservent l’étendue sémantique des termes relatifs aux lieux d’habitation.
