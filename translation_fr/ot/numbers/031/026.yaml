  naturalness: La formulation révisée est fluide en français international moderne. « Toi, avec le prêtre Éléazar et les chefs… » exprime clairement que Moïse est le destinataire direct tout en associant les autres personnes nommées.
  terminology: « Êtres humains », « animaux », « prêtre Éléazar », « maisons ancestrales » et « communauté » sont précis, naturels et adaptés au registre. « Maisons ancestrales » est plus proche de la structure familiale exprimée par רָאשֵׁי אָבוֹת que « familles ancestrales ».
