  text: שָׂ֗א אֵ֣ת רֹ֤אשׁ מַלְק֨וֹחַ֙ הַ/שְּׁבִ֔י בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה אַתָּה֙ וְ/אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/רָאשֵׁ֖י אֲב֥וֹת הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: fr
  text: « Toi, fais le dénombrement des prises de guerre[a], tant des êtres humains[b] que des animaux, avec le prêtre Éléazar et les chefs des maisons ancestrales de la communauté[c]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le butin capturé » ou « ce qui a été pris comme butin ». L’expression hébraïque englobe ici les êtres humains et les animaux capturés à la guerre.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie אָדָם, « être humain », par opposition aux animaux.
    reason: lexical_alternative
  - marker: c
    text: Ou « les chefs des familles ancestrales »; plus librement, « les chefs de clan de la communauté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: Faites le compte
  rationale: L’expression idiomatique signifie recenser ou établir le total, et non littéralement « lever la tête ». Le pluriel inclut Moïse et les autres responsables ensuite nommés.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: ce qui a été pris comme butin
  rationale: L’expression désigne l’ensemble de ce qui a été capturé à la guerre; cette formulation englobe naturellement les êtres humains et les animaux sans limiter שְׁבִי aux seuls captifs humains.
- source_word: בָּאָדָם
  choice: des êtres humains
  rationale: אָדָם est ici collectif et s’oppose aux animaux; « êtres humains » exprime clairement cette opposition en français actuel.
- source_word: וּבַבְּהֵמָה
  choice: des animaux
  rationale: בְּהֵמָה désigne ici les animaux, vraisemblablement domestiques. « Animaux » préserve l’étendue du terme sans la restreindre explicitement au bétail.
- source_word: אַתָּה
  choice: toi
  rationale: Le pronom explicite met Moïse en relief parmi ceux qui doivent procéder au dénombrement.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: le prêtre Éléazar
  rationale: Ordre naturel en français pour le titre et le nom propre.
- source_word: רָאשֵׁי אֲבוֹת
  choice: les chefs des familles ancestrales
  rationale: La formule désigne les responsables des groupes familiaux issus des ancêtres; cette traduction est plus naturelle que le calque « chefs des pères » tout en conservant la structure sociale évoquée.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: Le mot désigne ici la communauté constituée d’Israël. « Communauté » est courant, digne et approprié au contexte du Pentateuque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel « Faites » rend l’action confiée conjointement à Moïse, Éléazar et aux chefs, tandis que « toi » conserve l’accent porté par le pronom hébreu explicite. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
