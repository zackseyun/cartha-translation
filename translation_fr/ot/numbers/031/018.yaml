source:
  edition: WLC
  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: fr
  text: Mais gardez-les en vie pour vous, toutes les jeunes filles parmi les femmes qui n’ont pas connu d’homme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « qui n’ont pas eu de relations sexuelles avec un homme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mais… toutes les
  rationale: Dans le contexte, וְ introduit un contraste avec l’ordre précédent; « mais » rend cette valeur adversative. כֹל avec le collectif הַטַּף est naturellement rendu ici par « toutes les ».
- source_word: הַטַּף
  choice: les jeunes filles
  rationale: טַף désigne les petits ou les enfants. Les précisions qui suivent restreignent ici le groupe aux jeunes personnes de sexe féminin; « jeunes filles » explicite ce que le contexte hébreu indique.
- source_word: בַּ/נָּשִׁים
  choice: parmi les femmes
  rationale: 'La préposition בְּ a ici une valeur partitive: les jeunes filles sont distinguées au sein de la population féminine.'
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: qui n’ont pas connu
  rationale: יָדַע est employé comme euphémisme sexuel. Le pluriel français s’accorde naturellement avec « toutes les jeunes filles » tout en conservant l’image du texte.
- source_word: מִשְׁכַּב זָכָר
  choice: la couche d’un homme
  rationale: L’expression désigne les relations sexuelles avec un individu masculin. « La couche d’un homme » conserve la formulation métaphorique et reste intelligible en français soutenu courant.
- source_word: הַחֲיוּ לָ/כֶם
  choice: gardez en vie pour vous
  rationale: Le hifil impératif de חיה signifie « laisser vivre » ou « garder en vie ». « Pour vous » maintient explicitement לָכֶם sans préciser l’usage ou le statut ultérieur que le verset ne formule pas.
theological_decisions:
- issue: Faut-il expliciter entièrement l’euphémisme sexuel?
  choice: Conserver dans le texte « n’ont pas connu la couche d’un homme ».
  alternative: « n’ont pas eu de relations sexuelles avec un homme »; « sont vierges »
  rationale: L’hébreu emploie une périphrase plutôt que le terme abstrait « vierge ». La traduction principale conserve cette image et la note en donne le sens explicite, sans réduire l’expression à une catégorie technique.
- issue: Faut-il expliciter le sexe des personnes désignées par טַף?
  choice: Employer « jeunes filles ».
  alternative: « enfants »; « jeunes personnes »
  rationale: Bien que טַף ne soit pas intrinsèquement féminin, בַּנָּשִׁים et la proposition relative qui suit identifient ici un groupe féminin. « Jeunes filles » rend cette restriction contextuelle sans attribuer un âge exact.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La tournure « la couche d’un homme » conserve volontairement l’euphémisme concret de l’hébreu; la note fournit une formulation contemporaine explicite. Le marqueur [a] figure dans le texte principal.
