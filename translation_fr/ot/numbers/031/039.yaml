source:
  edition: WLC
  text: וַ/חֲמֹרִ֕ים שְׁלֹשִׁ֥ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת וּ/מִכְסָ֥/ם לַֽ/יהוָ֖ה אֶחָ֥ד וְ/שִׁשִּֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: fr
  text: Les ânes étaient au nombre de 30 500, et la part prélevée pour Yahweh était de 61.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: Les ânes
  rationale: חֲמֹרִים est le nom courant au pluriel pour les ânes. La conjonction initiale est omise en français afin de conserver la fluidité de cette énumération.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: étaient au nombre de 30 500
  rationale: La suite de nombres hébraïque indique un total de trente mille cinq cents. Les chiffres conviennent au caractère d'inventaire du passage.
- source_word: וּ/מִכְסָ/ם
  choice: la part prélevée
  rationale: מֶכֶס désigne ici la portion imposée et mise à part sur le butin. « La part prélevée » exprime clairement l'opération sans suggérer l'impôt ordinaire moderne.
- source_word: לַ/יהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique que cette part est destinée à Yahweh; « pour » est naturel en français dans ce contexte. Le nom divin est translittéré afin de représenter directement le tétragramme.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: '61'
  rationale: L'expression hébraïque donne exactement soixante et un; les chiffres maintiennent le style statistique du contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Nature du מֶכֶס destiné à Yahweh
  choice: la part prélevée pour Yahweh
  alternative: le tribut à Yahweh
  rationale: Le terme désigne la portion exigée du butin et attribuée à Yahweh. « Part prélevée » décrit ce mécanisme avec précision sans ajouter une interprétation cultuelle ou fiscale plus étroite.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation « au nombre de » rend naturelle la phrase nominale d'inventaire; les nombres sont écrits en chiffres conformément au contexte statistique.
