  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה עֲבָדֶ֣י/ךָ נָֽשְׂא֗וּ אֶת רֹ֛אשׁ אַנְשֵׁ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר בְּ/יָדֵ֑/נוּ וְ/לֹא נִפְקַ֥ד מִמֶּ֖/נּוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: fr
  text: 'Ils dirent à Moïse : « Tes serviteurs ont recensé[a] les hommes de guerre placés sous nos ordres[b], et il ne manque pas un seul homme parmi nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont levé la tête des hommes de guerre », expression hébraïque signifiant ici qu’ils les ont dénombrés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « confiés à notre responsabilité ». Littéralement : « qui sont dans notre main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans cette adresse respectueuse des officiers à Moïse, le terme exprime la déférence plutôt qu’une condition servile mise au premier plan.
- source_word: נָשְׂאוּ אֶת רֹאשׁ
  choice: ont recensé
  rationale: L’expression hébraïque signifie littéralement « lever la tête » et désigne ici le dénombrement des troupes. « Recenser » restitue clairement cet idiome administratif.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les hommes de guerre
  rationale: Cette formulation conserve la référence explicite aux hommes engagés dans la guerre, sans généraliser le groupe en un terme non marqué.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: placés sous nos ordres
  rationale: Littéralement « qui sont dans notre main » ; dans ce contexte militaire, l’expression indique l’autorité et la responsabilité des officiers sur les troupes.
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: et il ne manque pas un seul homme parmi nous
  rationale: Le nifal de פקד exprime ici le fait d’être manquant ou absent après le dénombrement. La tournure française conserve l’insistance sur l’absence de toute perte.
