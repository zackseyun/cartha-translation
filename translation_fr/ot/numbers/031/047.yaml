revisions:
- from: Sur la moitié attribuée aux Israélites, Moïse préleva une part sur cinquante, tant sur les personnes que sur le bétail, et les donna aux Lévites chargés de veiller sur le tabernacle de Yahweh, comme Yahweh l’avait ordonné à Moïse.
  to: De la moitié revenant aux Israélites, Moïse préleva un sur cinquante parmi les personnes et parmi le bétail, et les donna aux Lévites qui avaient la charge du service du tabernacle de Yahweh, comme Yahweh l’avait ordonné à Moïse.
  rationale: La révision résout la discordance grammaticale tout en conservant le taux distributif d’un sur cinquante et le pluriel des personnes et animaux remis aux Lévites. Elle affine également le rendu de la responsabilité lévitique sans ajouter d’interprétation confessionnelle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:51:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement la moitié revenant à Israël, le prélèvement d’un sur cinquante, les personnes et le bétail, les Lévites et le nom divin Yahweh. Toutefois, « une part sur cinquante » suivi de « les donna » crée en français une discordance référentielle : « part » est singulier, tandis que le pronom vise les personnes et animaux effectivement prélevés. La formulation révisée conserve clairement le pluriel des éléments prélevés.'
  naturalness: « De la moitié revenant aux Israélites » est plus idiomatique et plus précis que « Sur la moitié attribuée ». « Parmi les personnes et parmi le bétail » exprime naturellement la répartition du prélèvement. « qui avaient la charge du service du tabernacle » rend mieux la responsabilité cultuelle exprimée par la construction hébraïque que « chargés de veiller sur le tabernacle ».
  terminology: « Israélites », « personnes », « bétail », « Lévites », « tabernacle » et « Yahweh » conviennent au français international moderne et au contexte. Le nom divin est maintenu sans substitution par un titre.
  issues:
  - severity: medium
    issue: Discordance entre « une part » et « les donna »
    rationale: Le français présente « une part » comme un antécédent singulier, mais « les » renvoie aux personnes et aux animaux prélevés, pluriels dans l’hébreu. Reformuler le prélèvement comme « un sur cinquante » permet au pronom pluriel de référer sans ambiguïté aux éléments sélectionnés.
  - severity: low
    issue: Rendu réducteur de la charge lévitique
    rationale: « Veiller sur le tabernacle » évoque principalement une surveillance matérielle. שֹׁמְרֵי מִשְׁמֶרֶת exprime la garde ou la responsabilité d’une charge assignée liée au tabernacle; « avoir la charge du service » est plus complet et naturel.
  revised_text: De la moitié revenant aux Israélites, Moïse préleva un sur cinquante parmi les personnes et parmi le bétail, et les donna aux Lévites qui avaient la charge du service du tabernacle de Yahweh, comme Yahweh l’avait ordonné à Moïse.
  revised_footnotes: []
