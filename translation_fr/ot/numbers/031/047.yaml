source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: De la moitié revenant aux Israélites, Moïse préleva un sur cinquante parmi les personnes et parmi le bétail, et les donna aux Lévites qui avaient la charge du service du tabernacle de Yahweh, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Sur la moitié attribuée aux Israélites
  rationale: Le syntagme désigne la moitié du butin revenant aux Israélites. « Israélites » rend naturellement l’expression collective בְּנֵי יִשְׂרָאֵל en français moderne, tandis que « attribuée » explicite la relation implicite dans le contexte du partage.
- source_word: אֶת הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: une part sur cinquante
  rationale: אָחֻז désigne ici ce qui est prélevé comme redevance; l’expression indique un prélèvement au taux d’un sur cinquante. Cette formulation française est claire et conserve la valeur distributive.
- source_word: מִן הָאָדָם
  choice: sur les personnes
  rationale: אָדָם est collectif et vise les êtres humains comptés parmi les prises, non un homme particulier. « Les personnes » évite une restriction masculine indue.
- source_word: וּמִן הַבְּהֵמָה
  choice: sur le bétail
  rationale: בְּהֵמָה désigne ici l’ensemble des animaux domestiques pris comme butin; « bétail » est le terme contextuel naturel.
- source_word: וַיִּתֵּן אֹתָם
  choice: et les donna
  rationale: Le suffixe pronominal hébreu est pluriel et renvoie aux personnes et aux animaux prélevés. Le pluriel français en maintient le nombre.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: chargés de veiller sur le tabernacle de Yahweh
  rationale: La construction avec la racine שׁמר exprime la responsabilité de garder et d’assurer la charge du tabernacle. Cette formulation évite une répétition lourde tout en conservant le sens custodial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: כַּאֲשֶׁר marque la conformité à l’ordre antérieur; le plus-que-parfait convient à la succession narrative française.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; sa translittération préserve le nom propre sans lui substituer un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans ce contexte collectif de partage du butin, « les Israélites » est le français courant correspondant à l’expression idiomatique hébraïque, sans changer le référent.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concise, rend explicitement le prélèvement d’un sur cinquante et conserve le pluriel pour les bénéficiaires humains et animaux du prélèvement.
