id: NUM.31.21
reference: Numbers 31:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: fr
  text: 'Le prêtre Éléazar dit alors aux hommes de l’armée qui étaient venus au combat[a] : « Voici la prescription de la loi[b] que Yahweh a commandée à Moïse : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui viennent au combat ». L’expression peut désigner ceux qui se sont rendus au combat; le contexte les présente après l’expédition, sans que le verbe dise explicitement « revenaient ».'
    reason: Préserve la valeur du participe hébreu et évite d’imposer explicitement un retour ou une participation accomplie.
  - marker: b
    text: Ou « la règle de la loi » ou « la prescription de l’instruction ».
    reason: חֻקָּה peut désigner une prescription, une règle ou un statut, et תּוֹרָה peut signifier « loi » ou « instruction ».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait avancer le récit ; « alors » marque naturellement la succession en français.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: le prêtre Éléazar
  rationale: Cette formulation française naturelle conserve le nom propre et la fonction définie d’Éléazar.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: les hommes de l’armée
  rationale: La traduction conserve la désignation masculine explicite אַנְשֵׁי et rend צָבָא par le terme collectif courant « armée ».
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: qui avaient pris part au combat
  rationale: Dans le contexte, ces hommes reviennent de l’expédition militaire. Cette formulation naturelle exprime leur rapport au combat sans imposer au participe et à la préposition un mouvement français qui serait trompeur ; la note conserve la forme plus littérale.
- source_word: חֻקַּת הַתּוֹרָה
  choice: la prescription de la loi
  rationale: « Prescription » exprime le caractère fixé et obligatoire de חֻקָּה, tandis que « loi » rend ici le sens juridique de תּוֹרָה. Une note signale les autres nuances possibles.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: que Yahweh a commandée à Moïse
  rationale: La proposition relative rattache le commandement à la prescription mentionnée, tout en présentant Moïse comme celui à qui Yahweh a donné l’ordre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin personnel sans le remplacer par un titre.
- issue: Rapport entre la prescription, la loi et Moïse
  choice: la prescription de la loi que Yahweh a commandée à Moïse
  alternative: la prescription de l’instruction que Yahweh a donnée à Moïse
  rationale: La traduction maintient la force normative de חֻקָּה et de תּוֹרָה, ainsi que Moïse comme destinataire du commandement, sans présenter explicitement Moïse comme médiateur dans ce verset.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La syntaxe reste proche de l’hébreu tout en évitant une tournure artificielle ; les ambiguïtés lexicales importantes sont conservées en notes.
