base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: fr
  text: Ils amenèrent les captifs, les prises et le butin à Moïse, au prêtre Éléazar et à la communauté des Israélites, jusqu’au camp, dans les plaines de Moab[a], près du Jourdain, à la hauteur de Jéricho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les steppes de Moab ».
    reason: Alternative lexicale et topographique pour עַרְבֹת מוֹאָב.
  - marker: b
    text: Ou « près du Jourdain, en face de Jéricho ».
    reason: La construction hébraïque situe le lieu par rapport au Jourdain et à Jéricho sans expliciter entièrement leur relation géographique.
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Ils amenèrent
  rationale: Le hifil de בוא exprime ici l’action d’amener ou d’apporter. Comme le premier complément désigne des personnes captives, « amenèrent » convient naturellement à l’ensemble de l’énumération.
- source_word: הַשְּׁבִי
  choice: les captifs
  rationale: Dans ce contexte militaire, le terme désigne les personnes faites prisonnières plutôt que l’état abstrait de captivité.
- source_word: הַמַּלְקוֹחַ
  choice: les prises
  rationale: « Prises » désigne ce qui a été capturé et permet de conserver une distinction lexicale avec שׁלל, rendu par « butin ».
- source_word: הַשָּׁלָל
  choice: le butin
  rationale: Terme français courant et précis pour les biens emportés à la guerre; il reste distinct de « prises ».
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: la communauté des Israélites
  rationale: עֵדָה désigne la communauté rassemblée. « Israélites » rend naturellement en français moderne l’expression hébraïque littérale « fils d’Israël » sans en modifier le référent collectif.
- source_word: אֶל הַמַּחֲנֶה
  choice: jusqu’au camp
  rationale: La préposition אֶל marque la destination. « Jusqu’au camp » rend clairement le mouvement sans affirmer plus que le texte quant à l’entrée dans celui-ci.
- source_word: עַרְבֹת מוֹאָב
  choice: les plaines de Moab
  rationale: Traduction géographique consacrée et immédiatement compréhensible; « steppes » demeure une possibilité plus technique signalée en note.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: près du Jourdain, en face de Jéricho
  rationale: Cette formulation situe les plaines à proximité du Jourdain du côté opposé à Jéricho, tout en gardant en note une formulation moins interprétative de la relation géographique.
