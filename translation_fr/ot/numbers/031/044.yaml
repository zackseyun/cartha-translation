lexical_decisions:
- source_word: וּ/בָקָר
  choice: et … bovins
  rationale: בָּקָר désigne collectivement le gros bétail, en particulier les bovidés. « Bovins » est précis et naturel dans cette liste de dénombrement; la conjonction וּ est rendue par « et », conformément à la structure additive du passage.
- source_word: שִׁשָּׁה וּ/שְׁלֹשִׁים אָלֶף
  choice: 36 000
  rationale: L’expression hébraïque signifie littéralement « six et trente mille ». L’ordre usuel du français moderne et la notation chiffrée donnent naturellement « 36 000 », sans modifier la quantité.
