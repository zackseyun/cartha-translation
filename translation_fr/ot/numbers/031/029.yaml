  terminology: « Éléazar », « prêtre », « contribution » et « Yahweh » conviennent au registre moderne et au texte source. La note doit présenter « contribution de Yahweh » comme une possibilité de construction, mais « contribution destinée à Yahweh » est préférable dans le texte courant pour le contexte cultuel.
