  text: מִ/מַּֽחֲצִיתָ֖/ם תִּקָּ֑חוּ וְ/נָתַתָּ֛ה לְ/אֶלְעָזָ֥ר הַ/כֹּהֵ֖ן תְּרוּמַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: fr
  text: Vous en prélèverez une part de leur moitié et vous la donnerez au prêtre Éléazar comme contribution destinée à Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme offrande à Yahweh » ou « comme contribution de Yahweh ». Le mot hébreu תְּרוּמָה désigne une part prélevée et mise à part pour un usage sacré.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: sur la moitié qui leur revient
  rationale: Le préfixe מִן indique la provenance du prélèvement, et le suffixe possessif renvoie à la moitié attribuée aux combattants dans le contexte. Cette formulation est naturelle en français et explicite sobrement le référent.
- source_word: תִּקָּחוּ
  choice: vous la prélèverez
  rationale: Le verbe est à la deuxième personne du pluriel et a ici une valeur prescriptive. « Prélever » convient précisément à une part tirée d'un ensemble.
- source_word: וְנָתַתָּה
  choice: et vous la donnerez
  rationale: La forme passe à la deuxième personne du singulier, mais le français écrit ne distingue pas le singulier de politesse du pluriel avec « vous ». La coordination conserve la suite des instructions sans alourdir le texte.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: au prêtre Éléazar
  rationale: Cette tournure française identifie naturellement Éléazar par sa fonction tout en conservant le nom propre.
- source_word: תְּרוּמַת יְהוָה
  choice: comme contribution pour Yahweh
  rationale: תְּרוּמָה désigne ici une part prélevée et mise à part pour un usage sacré. « Contribution » rend son caractère de part attribuée, tandis que « pour Yahweh » préserve une lecture possible du rapport génitif sans suggérer que Yahweh en serait matériellement propriétaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » préserve le nom divin plutôt que de lui substituer un titre.
- issue: Rapport entre תְּרוּמָה et יהוה
  choice: contribution pour Yahweh
  alternative: contribution de Yahweh
  rationale: Le génitif hébreu permet plusieurs relations. Dans ce contexte de prélèvement remis au prêtre, « pour Yahweh » exprime clairement la destination sacrée; la note conserve les autres rendus possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire administratif de « prélever » et « contribution » correspond au partage du butin, tandis que la note signale la portée cultuelle du terme hébreu.
