  text: וַ/יִּקְצֹ֣ף מֹשֶׁ֔ה עַ֖ל פְּקוּדֵ֣י הֶ/חָ֑יִל שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/שָׂרֵ֣י הַ/מֵּא֔וֹת הַ/בָּאִ֖ים מִ/צְּבָ֥א הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: fr
  text: Moïse se mit en colère contre les officiers de l’armée[a], les chefs de milliers et les chefs de centaines, qui arrivaient de l’expédition militaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre les responsables de la troupe ».
    reason: La construction פְּקוּדֵי הֶחָיִל peut désigner les hommes chargés de responsabilités dans la force militaire, sans correspondre nécessairement au système moderne des grades.
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: se mit en colère
  rationale: Le verbe קצף exprime la colère. « Se mit en colère » rend naturellement la forme narrative sans renforcer indûment le sens par « entra en fureur ».
- source_word: פְּקוּדֵי הֶחָיִל
  choice: les officiers de l’armée
  rationale: Le participe passif de פקד désigne ici les hommes investis d’une responsabilité au sein de la force militaire; « officiers de l’armée » est clair et idiomatique.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: les chefs de milliers
  rationale: « Chefs » rend שׂרים sans imposer un grade militaire moderne précis, tandis que « de milliers » conserve l’organisation numérique du texte hébreu.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: et les chefs de centaines
  rationale: Le choix parallèle à « chefs de milliers » préserve la structure et la hiérarchie exprimées en hébreu.
- source_word: הַבָּאִים
  choice: qui revenaient
  rationale: Le participe signifie littéralement « qui venaient ». Dans ce contexte, avec מִן marquant la provenance depuis l’expédition, le français naturel appelle « revenaient », tout en signalant en note la formulation littérale.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: de l’expédition militaire
  rationale: צָבָא peut désigner l’armée, le service ou une campagne militaire. Avec מִלְחָמָה, « expédition militaire » exprime naturellement la mission guerrière sans reproduire l’expression maladroite « service de la guerre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la hiérarchie numérique hébraïque (« milliers », « centaines »), tout en employant une formulation militaire naturelle. Le retour depuis l’opération est explicité par le contexte, sans ajouter de précision géographique ou théologique.
