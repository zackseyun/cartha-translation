source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ אָדָ֔ם שִׁשָּׁ֥ה עָשָׂ֖ר אָ֑לֶף וּ/מִכְסָ/ם֙ לַֽ/יהוָ֔ה שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: fr
  text: Les êtres humains étaient au nombre de seize mille, et la part prélevée sur eux pour Yahweh fut de trente-deux personnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: les êtres humains
  rationale: Dans cette liste de partage du butin, l’expression désigne des individus humains par opposition aux animaux. « Les êtres humains » est naturel en français et conserve cette distinction.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: seize mille
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: מִכְסָם
  choice: la part prélevée sur eux
  rationale: Le terme désigne ici la quote-part imposée sur le butin et réservée à Yahweh. Cette formulation explicite sobrement le sens administratif dans le contexte.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition indique l’attribution ou la consécration de cette part à Yahweh.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: trente-deux personnes
  rationale: נֶפֶשׁ sert ici à compter des individus; « personnes » évite le sens métaphysique que pourrait suggérer « âmes ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Rendu de נֶפֶשׁ אָדָם comme catégorie humaine
  choice: les êtres humains
  alternative: les personnes / les âmes humaines
  rationale: Dans le dénombrement du butin, l’expression distingue les humains des animaux sans définir la nature de l’âme; le rendu choisi préserve cette fonction contextuelle.
translation_notes:
  register: Français moderne, clair et digne. La tournure « étaient au nombre de » convient à un relevé administratif, tandis que « part prélevée » restitue le caractère évalué de מֶכֶס sans employer le peu naturel « tribut de personnes ».
