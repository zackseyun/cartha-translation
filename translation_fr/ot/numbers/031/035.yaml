  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: fr
  text: Parmi les femmes, celles qui n’avaient pas eu de relations sexuelles avec un homme étaient au nombre de trente-deux mille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui n’avaient pas connu la couche d’un mâle » ; expression hébraïque signifiant qu’elles n’avaient pas eu de relations sexuelles avec un homme.'
