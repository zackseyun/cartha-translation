    issue: La nuance de sélection exprimée par מִן n’est pas explicitement rendue.
    rationale: « Quant aux femmes » désigne le groupe, mais ne rend pas aussi clairement « parmi les femmes / d’entre les femmes », alors que le contexte énumère des catégories de butin.
  - severity: low
    issue: La tournure de totalisation peut être plus idiomatique et précise.
    rationale: « Elles étaient en tout trente-deux mille » est compréhensible, mais « étaient au nombre de trente-deux mille » rend plus naturellement la formule de dénombrement כָּל־נֶפֶשׁ.
