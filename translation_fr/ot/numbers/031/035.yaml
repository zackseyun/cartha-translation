lexical_decisions:
- source_word: וְנֶפֶשׁ אָדָם מִן הַנָּשִׁים
  choice: Quant aux femmes
  rationale: Dans ce relevé qui oppose les personnes au bétail, נֶפֶשׁ אָדָם désigne des êtres humains. En français, « les femmes » exprime naturellement le groupe humain visé sans le calque lourd « personnes humaines parmi les femmes ».
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: qui n’avaient pas eu de relations sexuelles avec un homme
  rationale: L’expression hébraïque littérale « connaître la couche d’un mâle » est un euphémisme désignant les rapports sexuels. La traduction explicite en restitue clairement le sens en français moderne, tandis que la formulation littérale est conservée en note.
- source_word: כָּל נֶפֶשׁ
  choice: elles étaient en tout
  rationale: La formule récapitule l’effectif du groupe. « En tout » rend sa fonction totalisatrice de manière idiomatique.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: trente-deux mille
  rationale: Rendu français standard du nombre hébreu.
