revisions:
- from: Moïse donna à Éléazar le prêtre le tribut[a], c’est-à-dire la contribution destinée à Yahweh[b], exactement comme Yahweh le lui avait ordonné.
  to: Moïse remit à Éléazar, le prêtre, le prélèvement[a], la contribution réservée pour Yahweh[b], comme Yahweh l’avait ordonné à Moïse.
  rationale: La révision améliore la fluidité française et précise le sens contextuel de מֶכֶס par « prélèvement ». Elle maintient l’apposition présente dans l’hébreu sans l’expliquer par « c’est-à-dire », conserve Yahweh, et rend la formule finale de conformité de manière directe. Les deux notes restent ancrées aux expressions auxquelles elles se rapportent.
