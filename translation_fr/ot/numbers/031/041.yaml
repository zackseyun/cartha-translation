  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Moïse remit à Éléazar, le prêtre, le prélèvement[a], la contribution réservée pour Yahweh[b], comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « redevance », « tribut » ou « taxe » : il s’agit de la part fixée prélevée sur le butin.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « la contribution de Yahweh » ou « l’offrande pour Yahweh » ; traduction traditionnelle : « l’offrande élevée de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן, dans cette forme narrative, exprime simplement une action passée. « Donna » est direct et naturel en français.
- source_word: מֶכֶס
  choice: tribut
  rationale: Dans le contexte du partage du butin, le terme désigne la part obligatoire qui en est prélevée. « Tribut » conserve l’idée d’une part due, tandis que la note signale des équivalents possibles.
- source_word: תְּרוּמַת יְהוָה
  choice: la contribution destinée à Yahweh
  rationale: תְּרוּמָה désigne une contribution mise à part. « Destinée à Yahweh » rend naturellement le rapport exprimé par le nom divin sans imposer le sens rituel plus précis d’une « offrande élevée ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: à Éléazar le prêtre
  rationale: Cette formulation rend directement la préposition, le nom propre et l’apposition sacerdotale.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: exactement comme Yahweh le lui avait ordonné
  rationale: « Exactement comme » souligne la conformité à l’ordre antérieur. Les pronoms « le lui » reprennent naturellement en français l’acte ordonné à Moïse, sans en modifier le contenu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: L’hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Nature de תְּרוּמַת יְהוָה
  choice: contribution destinée à Yahweh
  alternative: offrande de Yahweh / offrande élevée pour Yahweh
  rationale: La formulation retenue laisse ouverte la nuance exacte de תְּרוּמָה tout en indiquant que cette part est réservée à Yahweh; elle évite d’introduire une modalité rituelle qui n’est pas explicitée ici.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des compléments est légèrement réorganisé pour être naturel en français. « C’est-à-dire » explicite l’apposition entre מֶכֶס et תְּרוּמַת יְהוָה sans présenter deux objets distincts.
