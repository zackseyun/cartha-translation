source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: fr
  text: 'Nous avons donc apporté en offrande à Yahweh les objets en or que chacun avait trouvés : anneaux de bras[a], bracelets, bagues, boucles d’oreilles et ornements[b], afin de faire expiation pour nous-mêmes[c] devant Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne probablement un ornement porté au bras ; il peut aussi désigner un bracelet de cheville.
    reason: lexical_alternative
  - marker: b
    text: Le sens exact du terme hébreu est incertain ; il pourrait s’agir de pendentifs, de colliers ou d’anneaux de nez.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « pour nos vies » ou « pour nos personnes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב אֶת־קָרְבַּן יְהוָה
  choice: Nous avons donc apporté en offrande à Yahweh
  rationale: Le hiphil de קרב exprime l’action d’apporter ou de présenter, tandis que קָרְבַּן désigne ce qui est présenté comme offrande. Cette formulation française rend naturellement l’ensemble sans suggérer que l’offrande appartient à Yahweh plutôt qu’elle ne lui est destinée.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: les objets en or que chacun avait trouvés
  rationale: אִישׁ a ici une valeur distributive. « Chacun » convient au groupe masculin de soldats déjà établi par le contexte, et le plus-que-parfait situe naturellement leur découverte avant la présentation.
- source_word: כְלִי זָהָב
  choice: les objets en or
  rationale: כְלִי est un terme large désignant des objets ou articles. La liste qui suit en précise la nature sans qu’il soit nécessaire de traduire d’emblée par « bijoux ».
- source_word: אֶצְעָדָה
  choice: chaînettes
  rationale: Le sens exact et l’emplacement de cet ornement sont incertains. « Chaînettes » reste général et correspond à un sens lexical attesté; les possibilités « bracelets de bras » et « bracelets de cheville » sont signalées en note.
- source_word: צָמִיד
  choice: bracelets
  rationale: Le mot désigne couramment un bracelet ou un anneau porté au poignet ou au bras; « bracelets » est clair en français moderne.
- source_word: טַבַּעַת
  choice: bagues
  rationale: Le terme désigne un anneau ou une bague, sans imposer ici le sens plus précis de « bague à cachet ».
- source_word: עָגִיל
  choice: boucles d’oreilles
  rationale: Dans une liste de parures, il s’agit naturellement d’anneaux ou de boucles d’oreilles.
- source_word: כוּמָז
  choice: ornements
  rationale: L’identification précise de l’objet est incertaine. Le terme générique « ornements » évite une précision injustifiée; plusieurs propositions sont conservées en note.
- source_word: לְכַפֵּר עַל־נַפְשֹׁתֵינוּ
  choice: afin de faire l’expiation pour nos personnes
  rationale: « Faire l’expiation » conserve la portée cultuelle de כפר. נֶפֶשׁ au pluriel désigne ici les personnes ou les vies elles-mêmes, sans supposer une opposition philosophique entre âme et corps.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Portée expiatoire de l’offrande
  choice: afin de faire l’expiation pour nos personnes devant Yahweh
  alternative: afin d’obtenir le pardon pour nous / comme simple offrande de reconnaissance
  rationale: Le texte associe explicitement קָרְבַּן à כפר et à la présence de Yahweh. La traduction conserve donc le langage d’expiation sans préciser le mécanisme ou l’efficacité de l’offrande au-delà de ce que dit le verset.
- issue: Sens anthropologique de נַפְשֹׁתֵינוּ
  choice: nos personnes
  alternative: nos vies / nos âmes / nous-mêmes
  rationale: « Nos personnes » préserve la formulation concrète de נֶפֶשׁ tout en évitant d’introduire une doctrine particulière de l’âme. La note donne le sens littéral alternatif « nos vies ».
translation_notes:
  register: Français international moderne, sobre et digne. La phrase est restructurée pour être naturelle en français tout en conservant la progression de l’hébreu, le vocabulaire cultuel et les incertitudes lexicales. Tous les appels de notes figurent dans le texte.
