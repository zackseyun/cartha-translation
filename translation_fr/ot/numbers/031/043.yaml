  language: fr
  text: La moitié qui revenait à la communauté, prise sur le petit bétail, était de 337 500 têtes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: était de
  rationale: Dans ce relevé numérique, la forme de היה introduit le total obtenu. « était de » est naturel en français et reste moins interprétatif que « s’élevait à ».
- source_word: מֶחֱצַת הָעֵדָה
  choice: la moitié qui revenait à la communauté
  rationale: Le construit signifie littéralement « la moitié de la communauté », mais le contexte du partage indique la part attribuée à celle-ci. Cette formulation naturelle évite de suggérer que la communauté elle-même aurait été divisée en deux.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël. « communauté » est actuel, clair et n’évoque pas nécessairement une institution ecclésiale ultérieure.
- source_word: מִן הַצֹּאן
  choice: prise sur le petit bétail
  rationale: צֹאן est un collectif désignant principalement les moutons et les chèvres. « petit bétail » conserve cette portée avec précision, tandis que « prise sur » rend la provenance exprimée par מִן.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337 500
  rationale: La suite hébraïque totalise 300 000 + 30 000 + 7 000 + 500. Les chiffres arabes et l’espacement typographique français facilitent la lecture d’un inventaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe demeure proche du relevé hébreu, tout en explicitant naturellement la relation d’attribution. « Têtes » est ajouté comme classificateur idiomatique pour des animaux comptés, sans modifier la quantité ni la catégorie.
