id: NUM.31.24
reference: Numbers 31:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: fr
  text: Vous laverez vos vêtements le septième jour et vous serez purs[a] ; après quoi, vous pourrez entrer dans le camp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous serez purifiés ». L’hébreu peut désigner le fait de parvenir à l’état de pureté rituelle après le lavage prescrit.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous entrerez dans le camp ». Dans ce contexte, l’entrée est permise une fois la purification achevée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: vous laverez
  rationale: Le piel de כבס désigne ici le lavage de vêtements. Le futur français exprime naturellement l’instruction donnée dans ce contexte rituel.
- source_word: בִּגְדֵיכֶם
  choice: vos vêtements
  rationale: בגד désigne les habits ou vêtements ; « vêtements » est courant, précis et digne en français moderne.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: le septième jour
  rationale: Cette formulation rend directement et idiomatiquement l’expression temporelle hébraïque.
- source_word: וּטְהַרְתֶּם
  choice: vous serez purs
  rationale: 'Le qal de טהר est ici intransitif ou résultatif : à l’issue du lavage prescrit, les personnes se trouvent en état de pureté rituelle. « Vous serez purs » préserve cette valeur sans préciser excessivement l’agent du processus.'
- source_word: וְאַחַר
  choice: après quoi
  rationale: 'Cette locution marque clairement la succession : l’entrée dans le camp vient après l’achèvement de la purification.'
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: vous pourrez entrer dans le camp
  rationale: בוא אל signifie « venir dans » ou « entrer dans ». Dans ce cadre, la purification rend de nouveau l’entrée permise ; « pourrez entrer » exprime naturellement cette nuance contextuelle.
theological_decisions:
- issue: Vocabulaire de la pureté rituelle
  choice: vous serez purs
  alternative: vous serez purifiés ; purifiez-vous
  rationale: Le verset traite du rétablissement de la pureté rituelle après la guerre. La formulation retenue décrit l’état obtenu sans transformer la purification en affirmation morale ou spirituelle et sans imposer une valeur réflexive au verbe.
- issue: Valeur de l’entrée dans le camp
  choice: vous pourrez entrer dans le camp
  alternative: vous entrerez dans le camp
  rationale: La forme hébraïque peut se rendre littéralement par un futur, mais le contexte indique que la réadmission est autorisée une fois la purification accomplie. La note conserve l’autre possibilité grammaticale.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le pluriel « purs » reprend directement le langage biblique de l’état rituel ; les notes préservent les nuances possibles du verbe de purification et de la réadmission dans le camp.
