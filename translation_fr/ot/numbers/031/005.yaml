source:
  edition: WLC
  text: וַ/יִּמָּֽסְרוּ֙ מֵ/אַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַ/מַּטֶּ֑ה שְׁנֵים עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: fr
  text: On préleva donc sur les milliers d’Israël[a] mille hommes par tribu, soit douze mille hommes équipés pour la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « milliers d’Israël » peut aussi désigner les grands groupements claniques ou militaires d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: On préleva
  rationale: Le nifal exprime ici que des hommes furent fournis ou désignés parmi Israël pour la campagne. « On préleva » rend naturellement cette sélection sans imposer l’idée plus forte d’une remise forcée.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: sur les milliers d’Israël
  rationale: Le terme אֲלָפִים peut désigner des milliers au sens numérique, mais aussi des groupements claniques ou militaires. La traduction littérale conserve cette ambiguïté, explicitée en note.
- source_word: אֶלֶף לַמַּטֶּה
  choice: mille hommes par tribu
  rationale: La préposition לְ a ici une valeur distributive. L’ajout de « hommes » est requis naturellement en français par le contexte militaire.
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: douze mille hommes
  rationale: Il s’agit du total des contingents fournis par les douze tribus; « hommes » reprend explicitement le référent sous-entendu.
- source_word: חֲלוּצֵי צָבָא
  choice: hommes équipés pour la guerre
  rationale: חֲלוּצֵי désigne des hommes équipés, armés ou préparés pour l’action militaire. Cette formulation conserve l’idée d’équipement et la finalité guerrière.
