revisions:
- from: Moïse et le prêtre Éléazar prirent donc l’or remis par les chefs des milliers et des centaines, et ils l’apportèrent dans la tente de la Rencontre, pour servir de mémorial aux fils d’Israël[a] devant Yahweh.
  to: Moïse et le prêtre Éléazar prirent donc l’or provenant des chefs de milliers et de centaines, et ils l’apportèrent dans la tente de la Rencontre comme mémorial pour les fils d’Israël[a] devant Yahweh.
  rationale: La révision remplace une formulation qui impliquait une remise explicite par une expression neutre correspondant à la préposition hébraïque. Elle ajuste également la construction du mémorial pour refléter directement les compléments hébreux, tout en préservant l’ambiguïté cultuelle de « devant Yahweh ».
