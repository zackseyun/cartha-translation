base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: fr
  text: Moïse et le prêtre Éléazar prirent donc l’or provenant des chefs de milliers et de centaines, et ils l’apportèrent dans la tente de la Rencontre comme mémorial pour les fils d’Israël[a] devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les Israélites ». L’hébreu dit littéralement « pour les fils d’Israël », désignation collective conventionnelle du peuple de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prirent
  rationale: Le verbe לקח signifie directement « prendre ». Le pluriel français s’impose puisque Moïse et Éléazar en sont tous deux sujets.
- source_word: מֵאֵת
  choice: remis par
  rationale: La préposition marque la provenance. Dans ce contexte de remise d’une offrande aux responsables, « remis par » exprime naturellement en français que l’or venait des chefs, sans changer le sens de l’action.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: les chefs des milliers et des centaines
  rationale: שׂרים désigne ici des responsables militaires. « Milliers » et « centaines » conservent les désignations hébraïques des unités sans supposer qu’il s’agit nécessairement d’effectifs exacts.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Cette expression consacrée désigne le sanctuaire où Yahweh rencontre son peuple. La majuscule à « Rencontre » signale qu’il s’agit d’une désignation cultuelle établie.
- source_word: זִכָּרוֹן
  choice: pour servir de mémorial
  rationale: Le nom désigne ce qui garde ou rappelle le souvenir. « Mémorial » préserve sa portée cultuelle, tandis que la tournure verbale est naturelle en français.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: La traduction formelle conserve l’expression hébraïque conventionnelle et son image généalogique; une note en explicite la valeur collective.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formulation conserve l’expression spatiale et cultuelle hébraïque, qui peut aussi évoquer la présence de Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom personnel divin. « Yahweh » le translittère au lieu de lui substituer un titre.
- issue: Portée de בְנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites; peuple d’Israël
  rationale: La formulation garde l’expression généalogique et covenantale du texte hébreu sans exclure sa portée collective conventionnelle, précisée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe narrative reste fluide, tandis que les termes cultuels « tente de la Rencontre » et « mémorial » préservent la couleur du texte source.
