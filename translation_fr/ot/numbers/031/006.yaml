  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה אֶ֥לֶף לַ/מַּטֶּ֖ה לַ/צָּבָ֑א אֹ֠תָ/ם וְ/אֶת פִּ֨ינְחָ֜ס בֶּן אֶלְעָזָ֤ר הַ/כֹּהֵן֙ לַ/צָּבָ֔א וּ/כְלֵ֥י הַ/קֹּ֛דֶשׁ וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: fr
  text: Moïse les envoya au combat, mille par tribu, avec eux Phinéas, fils d’Éléazar le prêtre, ainsi que les objets sacrés[a] et les trompettes destinées à donner le signal[b], qu’il avait en main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ustensiles du sanctuaire » ou « les objets saints ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les trompettes d’alarme » ou « les trompettes destinées à la sonnerie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le verbe « envoyer » rend naturellement שלח dans ce récit, sans ajouter l’idée plus précise de déploiement militaire.
- source_word: אֶלֶף לַמַּטֶּה
  choice: mille par tribu
  rationale: La formulation concise exprime clairement la valeur distributive de la construction hébraïque.
- source_word: לַצָּבָא
  choice: au combat
  rationale: Dans ce contexte, צבא désigne l’expédition ou le service militaire plutôt que l’armée comme institution. « Au combat » est idiomatique en français et conserve l’orientation militaire.
- source_word: אֹתָם ... אֹתָם
  choice: les ... les
  rationale: La reprise par une deuxième phrase conserve la répétition emphatique de l’hébreu tout en évitant une construction française obscure.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Phinéas, fils du prêtre Éléazar
  rationale: Cette formulation rattache explicitement le titre de prêtre à Éléazar, conformément à l’ordre syntaxique de l’hébreu, et emploie les formes françaises établies des noms.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: les objets sacrés
  rationale: כְּלֵי peut désigner des objets, ustensiles ou récipients. « Objets sacrés » reste volontairement général et ne précise pas une nature que le texte ne donne pas.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: les trompettes servant à donner le signal
  rationale: תְּרוּעָה désigne ici une sonnerie forte servant de signal, vraisemblablement militaire. La traduction exprime leur fonction sans imposer qu’il s’agisse uniquement d’un cri de guerre ou d’une alarme.
- source_word: בְּיָדוֹ
  choice: avait en main
  rationale: L’expression conserve l’image hébraïque et le singulier renvoie naturellement à Phinéas, le référent masculin singulier le plus proche.
theological_decisions:
- issue: Rôle de Phinéas et des objets sacrés dans l’expédition
  choice: Phinéas accompagne les combattants avec les objets sacrés et les trompettes de signalisation.
  alternative: Présenter Phinéas comme chef militaire, simple observateur ou développer une doctrine de la guerre sainte.
  rationale: Le verset associe explicitement Phinéas, les objets sacrés et les trompettes à l’expédition, mais ne définit pas davantage son rôle. La traduction maintient ce lien cultuel et militaire sans ajout doctrinal.
- issue: Référent du singulier בְּיָדוֹ
  choice: Le singulier est rapporté à Phinéas.
  alternative: Comprendre collectivement que les objets étaient entre les mains des hommes envoyés.
  rationale: Phinéas est l’antécédent singulier le plus proche. Cette lecture respecte la grammaire sans développer la nature exacte de sa responsabilité.
translation_notes:
  register: Français international moderne, digne et accessible. La division en trois phrases clarifie une syntaxe hébraïque fortement coordonnée tout en conservant la répétition de « les envoya au combat ». « Phinéas avait en main » maintient l’image du texte source sans employer le tour aujourd’hui raide « dans sa main ».
