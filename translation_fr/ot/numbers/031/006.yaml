revisions:
- from: Moïse les envoya au combat, mille par tribu. Il les envoya au combat avec Phinéas, fils du prêtre Éléazar. Phinéas avait en main les objets sacrés[a] et les trompettes servant à donner le signal[b].
  to: Moïse les envoya au combat, mille par tribu, avec eux Phinéas, fils d’Éléazar le prêtre, ainsi que les objets sacrés[a] et les trompettes destinées à donner le signal[b], qu’il avait en main.
  rationale: La révision réunit en une seule construction l’envoi des mille hommes par tribu et l’accompagnement de Phinéas, conformément à la syntaxe et à l’apposition du texte hébreu. « Avec eux » rend la reprise de « eux » sans créer un second envoi. Les objets sacrés et les trompettes restent explicitement associés à Phinéas par le singulier « qu’il avait en main », sans préciser leur nature ou leur fonction au-delà du texte.
