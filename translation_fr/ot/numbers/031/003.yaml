source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: fr
  text: 'Moïse parla au peuple en ces termes : « Mobilisez parmi vous des hommes pour le combat. Qu’ils affrontent Madian afin d’exercer sur Madian la vengeance de Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la vengeance pour Yahweh ». L’hébreu peut désigner la vengeance qui appartient à Yahweh ou celle qui est exercée pour lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol narratif de דבר introduit ici un discours direct ; « parla » convient au cadre narratif solennel.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne ici la communauté israélite à laquelle Moïse s’adresse.
- source_word: הֵחָלְצוּ
  choice: Équipez pour le combat
  rationale: Dans ce contexte militaire, חלץ exprime la préparation et l’équipement en vue d’une campagne ; cette formulation est naturelle et évite l’ambiguïté moderne de « armez des hommes ».
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: des hommes pris parmi vous
  rationale: La formulation conserve à la fois la sélection au sein du peuple et la référence masculine explicite de אֲנָשִׁים.
- source_word: לַצָּבָא
  choice: pour le combat
  rationale: צבא renvoie ici à l’activité militaire ou à la campagne ; « pour le combat » s’intègre naturellement au verbe choisi.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: Qu’ils affrontent Madian
  rationale: L’expression היה על marque ici une opposition hostile. « Affronter » restitue cette force militaire sans ajouter explicitement un déplacement absent de l’hébreu.
- source_word: לָתֵת
  choice: afin d’exercer
  rationale: Avec נקמה, נתן signifie mettre à exécution ou infliger la vengeance ; « exercer » rend idiomatiquement cette valeur.
- source_word: נִקְמַת
  choice: la vengeance
  rationale: נקמה désigne directement la vengeance ou l’acte de venger ; le terme français en conserve la dureté.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: בְּמִדְיָן
  choice: sur Madian
  rationale: La préposition ב marque ici la cible sur laquelle s’exerce la vengeance.
theological_decisions:
- issue: Rapport entre Yahweh et la vengeance dans נִקְמַת יְהוָה
  choice: la vengeance de Yahweh
  alternative: la vengeance pour Yahweh
  rationale: Le construit hébreu peut désigner une vengeance qui appartient à Yahweh, qui vient de lui, ou qui est accomplie pour sa cause. Le texte principal garde la formulation génitive concise, tandis qu’une note signale l’autre valeur possible sans résoudre la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite un calque raide de « qu’ils soient contre Madian », tout en ne rendant pas explicite un mouvement que le texte hébreu n’énonce pas. Le terme « vengeance » est maintenu sans atténuation.
