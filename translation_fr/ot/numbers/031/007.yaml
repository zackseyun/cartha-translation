  rationale: La révision retire l’intensif non requis « exactement » et remplace une formulation administrative par « tous les mâles », qui reproduit directement la portée sexuelle, non limitée à l’âge adulte, du terme hébreu זָכָר. L’ancre et le contenu de la note lexicale sont conservés.
