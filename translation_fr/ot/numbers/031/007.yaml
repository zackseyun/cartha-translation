id: NUM.31.7
reference: Numbers 31:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: fr
  text: Ils firent la guerre à Madian[a], comme Yahweh l’avait ordonné à Moïse, et ils tuèrent tous les mâles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils combattirent contre Madian. » Le verbe hébreu peut désigner le fait de prendre part à une campagne ou à une action militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: ils firent la guerre
  rationale: Le verbe צבא désigne ici l’engagement dans une action militaire. « Faire la guerre » est naturel en français moderne et conserve la force militaire du terme, tandis que « combattre » reste une autre traduction possible.
- source_word: עַל
  choice: à
  rationale: 'Avec « faire la guerre », le français idiomatique construit l’hostilité avec « à » : « faire la guerre à Madian ».'
- source_word: מִדְיָן
  choice: Madian
  rationale: Forme française conventionnelle du nom propre biblique.
- source_word: כַּאֲשֶׁר
  choice: exactement comme
  rationale: Cette expression marque la conformité de l’action au commandement divin. « Exactement comme » rend explicitement cette correspondance sans archaïsme.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait indique naturellement en français que le commandement précède l’action militaire, sans modifier le sens de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du tétragramme, qui préserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Moïse est l’objet direct hébreu de צוה, mais « ordonner quelque chose à quelqu’un » exige ici la préposition « à » en français idiomatique.
- source_word: וַיַּהַרְגוּ
  choice: ils tuèrent
  rationale: הרג signifie directement « tuer ». Le passé simple convient au registre narratif biblique dignifié et demeure courant à l’écrit.
- source_word: כָּל
  choice: tous les
  rationale: Avec l’expression plurielle française « individus de sexe masculin », כָּל se rend naturellement par « tous les ».
- source_word: זָכָר
  choice: individus de sexe masculin
  rationale: זָכָר désigne le sexe masculin sans se limiter aux hommes adultes. Cette formulation maintient cette portée, là où « hommes » la restreindrait et où « mâles » appliqué à des personnes sonnerait déshumanisant en français actuel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le translittère directement, sans le remplacer par un titre.
- issue: Portée de זָכָר
  choice: tous les individus de sexe masculin
  alternative: tous les hommes ; tous les mâles
  rationale: L’hébreu vise les personnes de sexe masculin sans préciser qu’elles sont adultes. Le choix retenu évite de réduire le référent aux hommes adultes tout en restant respectueux en français.
translation_notes:
  register: Français international moderne, narratif et dignifié. Le passé simple porte la progression du récit, et le plus-que-parfait situe le commandement antérieur. La formulation de זָכָר privilégie la précision référentielle, malgré une légère lourdeur, afin de ne pas limiter le texte aux seuls adultes.
