source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: fr
  text: Et maintenant, tuez tous les garçons parmi les enfants, et tuez toute femme qui a eu des relations sexuelles avec un homme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui a connu un homme par le coucher d’un mâle », expression hébraïque désignant des relations sexuelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois la transition marquée par וְ et l’immédiateté de עַתָּה dans un français naturel.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: tuez
  rationale: L’impératif de הרג est direct et énergique. « Tuez » en conserve la force sans archaïsme ni euphémisme.
- source_word: כָל זָכָר בַּטָּף
  choice: tous les garçons parmi les enfants
  rationale: זָכָר signifie littéralement « mâle », tandis que טַף désigne les enfants, particulièrement les petits. Dans ce contexte, « garçons » exprime naturellement en français les enfants de sexe masculin, et « parmi les enfants » maintient la portée de בַּטָּף.
- source_word: כָל אִשָּׁה
  choice: toute femme
  rationale: אִשָּׁה désigne ici toute personne adulte de sexe féminin, sans indiquer spécialement une épouse.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: qui a eu des relations sexuelles avec un homme
  rationale: L’expression hébraïque associe le verbe « connaître » à une formulation concernant le fait de coucher avec un homme. Le français explicite naturellement le sens sexuel sans ajouter d’interprétation.
theological_decisions:
- issue: Rendre sans l’atténuer un ordre de guerre moralement difficile
  choice: Conserver un impératif direct et la pleine étendue des groupes visés
  alternative: Employer un euphémisme comme « mettez à mort » ou insérer une explication historique dans le corps du verset
  rationale: Le texte hébreu formule un ordre direct. La traduction ne doit ni en adoucir la violence ni introduire dans le verset un commentaire moral ou historique absent de la source.
- issue: Degré d’explicitation de l’idiome sexuel hébreu
  choice: Exprimer clairement « a eu des relations sexuelles avec un homme » dans le texte et signaler la formulation littérale en note
  alternative: Conserver dans le texte « a connu un homme en couchant avec lui »
  rationale: La formulation française choisie communique sans ambiguïté le sens idiomatique, tandis que la note préserve l’accès à la structure particulière de l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le vocabulaire ne cherche pas à atténuer la dureté du commandement. « Garçons parmi les enfants » évite le tour plus technique « enfants mâles » tout en conservant les deux éléments de l’hébreu.
