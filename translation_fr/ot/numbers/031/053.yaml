  text: אַנְשֵׁי֙ הַ/צָּבָ֔א בָּזְז֖וּ אִ֥ישׁ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/053.yaml
  text: The men of the army had each taken plunder for himself[a].
translation:
  language: fr
  text: Les hommes de l’armée avaient chacun pris du butin pour lui-même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Les hommes de l’armée avaient pillé, chacun pour lui-même. »'
    reason: Alternative lexicale plus formelle qui conserve le verbe « piller » et la construction distributive de l’hébreu.
lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: les hommes de l’armée
  rationale: Le groupe construit désigne les hommes appartenant à la force militaire. « Les hommes de l’armée » conserve cette relation et rend explicitement le sens masculin du texte source.
- source_word: בָּזְזוּ
  choice: avaient pris du butin
  rationale: Le verbe בזז signifie piller ou prendre comme butin. Le plus-que-parfait convient au contexte récapitulatif, et « prendre du butin » exprime naturellement en français l’objet implicite du verbe.
- source_word: אִישׁ לוֹ
  choice: chacun … pour eux-mêmes
  rationale: La tournure distributive indique que chaque homme avait pris du butin pour son propre compte. « Chacun » préserve cette distribution, tandis que « pour eux-mêmes » reprend naturellement le groupe pluriel « les hommes » en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de l’hébreu tout en explicitant idiomatiquement le butin sous-entendu.
