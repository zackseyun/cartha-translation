source:
  edition: WLC
  text: וּ/מִֽ/מַּחֲצִ֖ית בְּנֵ֣י יִשְׂרָאֵ֑ל אֲשֶׁר֙ חָצָ֣ה מֹשֶׁ֔ה מִן הָ/אֲנָשִׁ֖ים הַ/צֹּבְאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: fr
  text: 'Quant à la moitié revenant aux fils d’Israël, que Moïse avait séparée de celle des hommes partis en campagne :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּחֲצִית
  choice: Quant à la moitié
  rationale: Le waw assure la continuité avec le contexte, tandis que la préposition מן introduit la part dont le décompte va suivre. En français, « Quant à » rend naturellement cette transition sans alourdir la phrase.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: revenant aux fils d’Israël
  rationale: « fils d’Israël » conserve la forme masculine de l’hébreu; « revenant à » explicite naturellement le rapport d’attribution de cette moitié.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif renvoie à « la moitié » et introduit l’action accomplie par Moïse.
- source_word: חָצָה
  choice: avait séparée
  rationale: Dans le partage du butin en deux moitiés, le verbe désigne la mise à part d’une portion. Le plus-que-parfait situe correctement cette opération avant le décompte.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: מִן הָאֲנָשִׁים
  choice: de celle des hommes
  rationale: Le complément sous-entend la moitié attribuée aux hommes; « celle » le restitue clairement en français, et « hommes » correspond au référent masculin dans ce contexte militaire.
- source_word: הַצֹּבְאִים
  choice: partis en campagne
  rationale: Le participe de צבא désigne ici les hommes engagés dans l’expédition militaire. « partis en campagne » est naturel et garde le sens militaire contextuel.
theological_decisions: []
