language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: fr
  text: 'Tu prélèveras pour Yahweh un tribut parmi les hommes de guerre qui sont partis en campagne : un être vivant sur cinq cents[a], parmi les humains, les bovins, les ânes et le petit bétail.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une âme sur cinq cents ». Ici, le mot hébreu néfèsh sert à compter un être vivant, humain ou animal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: Tu prélèveras ... un tribut
  rationale: Le hiphil de רום exprime ici la mise à part d’une portion imposée, et מֶכֶס une part due prélevée sur le butin. « Prélever un tribut » rend naturellement les deux éléments.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition désigne Yahweh comme bénéficiaire ou destinataire du tribut; le nom divin est conservé sous la forme « Yahweh ».
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: sur les hommes de guerre qui sont partis au combat
  rationale: La formulation conserve le groupe masculin explicitement militaire et exprime idiomatiquement leur participation à l’expédition.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: un être vivant sur cinq cents
  rationale: נֶפֶשׁ sert ici à compter un individu vivant, humain ou animal. « Être vivant » maintient cette portée commune sans suggérer seulement une personne ni imposer un sens métaphysique à « âme ».
- source_word: מִן הָאָדָם
  choice: parmi les humains
  rationale: אָדָם désigne ici la catégorie humaine du butin, mise en contraste avec les catégories animales qui suivent.
- source_word: וּמִן הַבָּקָר
  choice: les bovins
  rationale: בָּקָר désigne les bêtes du gros bétail; « bovins » convient précisément à cette liste de catégories.
- source_word: וּמִן הַחֲמֹרִים
  choice: les ânes
  rationale: Traduction française moderne et directe du pluriel חֲמֹרִים.
- source_word: וּמִן הַצֹּאן
  choice: le petit bétail
  rationale: צֹאן est un collectif comprenant normalement moutons et chèvres; « petit bétail » en préserve mieux l’étendue que « troupeau » sans précision.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel d’alliance sans le remplacer par un titre.
- issue: Portée de נֶפֶשׁ dans le décompte
  choice: être vivant
  alternative: individu / tête
  rationale: Puisque le terme couvre ici à la fois les humains et les animaux énumérés, le rendu choisi maintient cette portée sans réduire le sens à l’une des catégories.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’ordre hébreu tout en évitant un calque pesant. « Hommes de guerre » conserve la spécificité masculine et militaire du groupe; « petit bétail » inclut les moutons et les chèvres.
