  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: fr
  text: Le gros bétail comptait trente-six mille têtes, et la part prélevée pour le SEIGNEUR fut de soixante-douze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: le gros bétail
  rationale: בָּקָר désigne collectivement les bovins. « Le gros bétail » est naturel en français dans cet inventaire et évite de restreindre indûment le terme aux seuls bœufs.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: trente-six mille
  rationale: L’ordre numérique hébreu est rendu selon l’usage idiomatique du français moderne.
- source_word: מִכְסָם
  choice: la part prélevée
  rationale: מֶכֶס désigne ici la quote-part exigée sur le butin. « Part prélevée » exprime clairement cette portion sans les connotations modernes parfois trop fiscales de « taxe » ou politiques de « tribut ».
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: La préposition ל indique que la part est destinée au SEIGNEUR; le tétragramme est rendu selon la convention française traditionnelle en petites capitales.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: soixante-douze
  rationale: L’ordre numérique hébreu est transposé dans l’ordre normal du français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: le SEIGNEUR
  alternative: Yahvé
  rationale: « Le SEIGNEUR » suit la convention biblique française largement reconnue et la couche de consultation fournie, tout en signalant typographiquement le nom divin. « Yahvé » reste une restitution possible, mais le verset n’exige pas de trancher la vocalisation du tétragramme.
translation_notes:
  register: Français international moderne, sobre et digne. L’ajout idiomatique de « têtes » clarifie que le nombre porte sur des animaux; « comptait » convient au contexte d’inventaire. Aucun marqueur de note n’est requis.
