  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: fr
  text: Quant à vous, campez hors du camp pendant sept jours. Que tous ceux parmi vous qui ont tué quelqu’un, et tous ceux qui ont touché un mort[a], se purifient le troisième jour et le septième jour, vous et vos captifs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « une personne tuée ». Dans ce contexte, il s’agit du contact avec le corps d’une personne tuée, qui entraîne une impureté rituelle.
    reason: Préserver la nuance lexicale de חָלָל, rendue contextuellement par « un mort », et expliciter sans surcharge le lien avec l’impureté rituelle.
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Quant à vous
  rationale: Le pronom explicite et antéposé marque le groupe auquel Moïse s’adresse; « Quant à vous » restitue cette mise en relief.
- source_word: חֲנוּ מִחוּץ לַמַּחֲנֶה
  choice: campez hors du camp
  rationale: L’impératif pluriel de חנה ordonne de demeurer campés à l’extérieur; la répétition de « camp » convient au cadre militaire.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: « Pendant » exprime naturellement en français la durée indiquée par l’hébreu.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: vous tous qui avez tué une personne
  rationale: נֶפֶשׁ désigne ici une personne humaine, non une « âme » abstraite. Le participe prend dans le contexte de l’après-bataille une valeur passée.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: ainsi que tous ceux qui ont touché une personne tuée
  rationale: חָלָל désigne une personne tuée, et dans cette prescription le contact est celui d’un cadavre. La formulation conserve la référence personnelle et le caractère violent de la mort.
- source_word: תִּתְחַטְּאוּ
  choice: purifiez-vous
  rationale: À la forme hitpael et dans ce contexte rituel, le verbe désigne l’action de se purifier d’une impureté, plutôt qu’une purification morale générale.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: le troisième jour et le septième jour
  rationale: Les deux échéances rituelles sont conservées explicitement.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: vous et vos captifs
  rationale: שְׁבִי désigne les personnes capturées à la guerre; « captifs » est plus précis que « prisonniers » dans ce contexte.
theological_decisions:
- issue: Nature de la purification après avoir tué ou touché une personne tuée
  choice: Purification rituelle liée au contact avec la mort
  alternative: Purification morale du meurtre ou absolution d’une culpabilité de sang
  rationale: Le contexte et les troisième et septième jours renvoient à la procédure de purification de l’impureté contractée au contact d’un mort. « Purifiez-vous » exprime cette exigence sans ajouter une affirmation sur le pardon moral.
translation_notes:
  register: Français moderne, international et digne. La construction à la deuxième personne rend naturelle l’adresse collective de l’hébreu tout en conservant l’insistance finale « vous et vos captifs ». Le marqueur [a] est placé après l’expression qu’il explique.
