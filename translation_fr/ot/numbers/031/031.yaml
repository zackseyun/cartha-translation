id: NUM.31.31
reference: Numbers 31:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: fr
  text: Moïse et le prêtre Éléazar firent donc ce que Yahvé avait ordonné à Moïse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH »; traditionnellement rendu par « le Seigneur ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel alternatif.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: firent donc
  rationale: Le verbe עשה résume ici l’exécution fidèle de l’ordre précédent. « Firent » s’intègre naturellement à la tournure française « faire ce que… avait ordonné »; « donc » rend la progression narrative du waw.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וְאֶלְעָזָר
  choice: et Éléazar
  rationale: La conjonction est conservée et le nom propre suit sa forme française usuelle.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Titre en apposition qui précise la fonction d’Éléazar; « le prêtre » en donne le sens direct.
- source_word: כַּאֲשֶׁר
  choice: ce que
  rationale: Dans la tournure « faire ce que quelqu’un a ordonné », « ce que » exprime naturellement en français la conformité à l’ordre, sans en modifier le sens.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait marque naturellement l’antériorité de l’ordre par rapport à son exécution.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du tétragramme divin, qui conserve ici le nom propre plutôt que de lui substituer le titre « le Seigneur ».
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: אֵת marque l’objet direct en hébreu, mais le verbe français « ordonner » se construit ici idiomatiquement avec un complément de personne introduit par « à ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » est la forme française usuelle qui le présente comme un nom propre; la note signale la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide tout en conservant les deux occurrences de Moïse et le titre sacerdotal d’Éléazar.
