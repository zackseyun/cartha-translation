id: NUM.31.23
reference: Numbers 31:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: fr
  text: Tout objet qui peut passer par le feu, vous le ferez passer par le feu, et il sera pur. Mais il devra être purifié par l’eau de purification[a]. Tout ce qui ne peut pas passer par le feu, vous le ferez passer par l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « l’eau d’impureté » ; traduction traditionnelle : « l’eau de séparation ». Voir Nombres 19.'
    reason: La construction מֵי נִדָּה peut être rendue plus littéralement de plusieurs manières; dans le contexte, elle désigne l’eau employée pour la purification rituelle.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: Tout objet
  rationale: Dans le contexte du butin, דָּבָר désigne concrètement chaque objet; « tout objet » garde la portée distributive et évite l’abstraction de « toute chose ».
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: qui peut passer par le feu
  rationale: L’expression distingue les objets capables de supporter un traitement par le feu, plutôt que ceux qui y entrent simplement de fait.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: vous le ferez passer par le feu
  rationale: Le hifil de עבר est causatif. Cette formulation française conserve l’action prescrite et le parallélisme avec le passage par l’eau.
- source_word: וְטָהֵר
  choice: et il sera pur
  rationale: Le verbe exprime ici l’état rituellement pur qui résulte du traitement, sans introduire une notion de pardon moral.
- source_word: אַךְ
  choice: Toutefois
  rationale: 'La particule apporte une restriction importante à l’affirmation précédente: le feu ne supprime pas l’exigence du rite par l’eau.'
- source_word: בְּמֵי נִדָּה
  choice: par l’eau de purification
  rationale: Dans ce contexte sacerdotal lié à Nombres 19, il s’agit de l’eau rituelle destinée à ôter l’impureté. Cette formulation française est claire, tout en signalant en note les traductions plus littérales.
- source_word: יִתְחַטָּא
  choice: il devra aussi être purifié
  rationale: Le hitpael de חטא désigne ici le fait de subir une purification rituelle. « devra » rend la prescription; « aussi » explicite que cette purification s’ajoute au traitement par le feu, implication portée par la qualification אַךְ.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: Tout ce qui ne peut pas passer par le feu
  rationale: Le contraste pratique oppose les objets supportant le feu à ceux qui ne le supportent pas.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: vous le ferez passer par l’eau
  rationale: La reprise du même verbe causatif préserve le parallélisme formel entre le feu et l’eau, sans réduire le geste au simple lavage.
theological_decisions:
- issue: Nature de la purification dans la législation sacerdotale
  choice: Employer le vocabulaire de la pureté et de la purification rituelles.
  alternative: Traduire le langage de חטא en termes de péché ou de purification morale.
  rationale: Nombres 31, en lien avec Nombres 19, traite de la purification d’objets rendus rituellement impurs. Le verset ne parle pas ici du pardon d’une faute morale.
- issue: Rapport entre le traitement par le feu et l’eau rituelle
  choice: 'Conserver les deux exigences: passage par le feu et purification par l’eau.'
  alternative: Comprendre le feu comme remplaçant entièrement la purification par l’eau.
  rationale: La qualification introduite par אַךְ indique que l’objet passé par le feu doit néanmoins subir la purification prescrite par l’eau.
translation_notes:
  register: Français international moderne, clair et digne. « Tout objet » convient au contexte concret du butin. Le futur prescriptif (« vous le ferez », « il devra ») rend naturellement l’instruction légale. Le marqueur [a] figure dans le texte et renvoie à l’ambiguïté lexicale de מֵי נִדָּה.
