  choice: cinq cents
  rationale: Dans l’écriture française moderne des nombres, le total coordonné en hébreu se formule naturellement « trente mille cinq cents », sans rendre séparément la conjonction ו. « Cents » prend un s puisqu’il termine le nombre.
