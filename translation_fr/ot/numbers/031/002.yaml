source:
  edition: WLC
  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: fr
  text: « Exerce sur les Madianites la vengeance des Israélites[a]. Après cela, tu seras réuni à ton peuple[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Venge les Israélites des Madianites. » Hébreu : « Venge la vengeance des fils d’Israël sur/contre les Madianites. »'
    reason: lexical_alternative
  - marker: b
    text: « Être réuni à son peuple » est une expression hébraïque désignant la mort.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: Venge
  rationale: Le verbe et son nom apparenté forment en hébreu une tournure intensive littéralement proche de « venge la vengeance ». Le français naturel exprime cette force par l’impératif « Venge » sans répétition artificielle.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation collective signifie ici le peuple d’Israël. « Les Israélites » est précis, inclusif et plus naturel en français moderne que « les fils d’Israël », qui pourrait être compris comme ne visant que les hommes.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: des Madianites
  rationale: 'Avec le verbe « venger », la préposition française « de » désigne naturellement ceux contre qui la vengeance est exercée : les Madianites.'
- source_word: אַחַר
  choice: Après cela
  rationale: Cette locution marque clairement la succession temporelle annoncée par l’adverbe hébreu.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: tu seras réuni aux tiens
  rationale: La formulation conserve l’image hébraïque traditionnelle de la réunion au peuple auquel on appartient, tout en employant une expression française fluide. Elle ne remplace pas directement l’image par « tu mourras ».
theological_decisions:
- issue: L’expression de la mort prochaine de Moïse
  choice: 'Conserver l’image : « tu seras réuni aux tiens »'
  alternative: « tu mourras » ou « tu rejoindras tes ancêtres »
  rationale: L’expression hébraïque est un idiome désignant la mort. La garder préserve son imagerie et évite de préciser si « ton peuple » désigne strictement les ancêtres ou implique une conception particulière de l’au-delà.
- issue: Le rapport entre Israël et la vengeance
  choice: « Venge les Israélites des Madianites »
  alternative: « Exerce contre les Madianites la vengeance des Israélites »
  rationale: La traduction choisie rend naturellement l’ordre divin sans décider plus que l’hébreu si la vengeance est conçue comme appartenant aux Israélites ou comme étant exercée en réparation du tort qu’ils ont subi. La note signale la forme littérale.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif reste ferme. « Les Israélites » évite l’ambiguïté contemporaine de « fils d’Israël », tandis que « réuni aux tiens » conserve l’image sémitique sans lourdeur.
