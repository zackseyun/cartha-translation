revisions:
- from: « Venge les Israélites des Madianites[a]. Après cela, tu seras réuni aux tiens[b]. »
  to: « Exerce sur les Madianites la vengeance des Israélites[a]. Après cela, tu seras réuni à ton peuple[b]. »
  rationale: La révision rend explicitement la vengeance appartenant aux Israélites et son exercice contre les Madianites, sans affaiblir la force de l’impératif ni résoudre au-delà du texte la nature de cette vengeance. Elle remplace aussi « aux tiens » par « à ton peuple », traduction directe de l’idiome hébreu, dont la note explique sobrement la fonction funéraire.
