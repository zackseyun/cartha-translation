review_pass:
  verdict: revise
  source_fidelity: La tournure principale proposée, « Venge les Israélites des Madianites », peut rendre le sens général, mais elle est syntaxiquement ambiguë en français moderne et atténue la construction hébraïque explicite « la vengeance des fils d’Israël » dirigée contre les Madianites. « Tu seras réuni aux tiens » conserve l’idée de l’idiome, mais « aux tiens » restreint potentiellement עַמֶּיךָ (« ton peuple ») à la parenté.
  naturalness: « Exerce sur les Madianites la vengeance des Israélites » est clair, direct et d’un registre solennel naturel pour ce contexte. « Tu seras réuni à ton peuple » est une formulation française lisible qui maintient l’image hébraïque sans la paraphraser en termes doctrinaux.
  terminology: « Madianites », « Israélites » et « vengeance » sont appropriés. Le maintien de « vengeance » rend mieux le nom apparenté au verbe hébreu et l’objet de l’ordre. « Ton peuple » traduit directement עַמֶּיךָ, sans interpréter l’expression comme « tes ancêtres » ou seulement « les tiens ».
  issues:
  - severity: medium
    issue: Ambiguïté de « Venge les Israélites des Madianites »
    rationale: Bien que « venger quelqu’un de quelqu’un » soit possible, la tournure est moins transparente en français international actuel et ne rend pas explicitement « la vengeance des Israélites ». Une construction avec « exercer ... la vengeance » conserve plus fidèlement la structure sémantique.
  - severity: low
    issue: « aux tiens » est plus étroit que « à ton peuple »
    rationale: L’hébreu emploie « ton peuple », idiome de mort. « Les tiens » peut évoquer seulement la famille ou les proches; « ton peuple » préserve la formulation source et son ambiguïté.
  - severity: low
    issue: La note a qualifie improprement « de la part des Madianites » de littéral
    rationale: Dans cette construction avec נקם, la préposition désigne ceux contre qui la vengeance est exercée. « De la part des Madianites » suggère plutôt qu’ils en sont la source ou les agents.
