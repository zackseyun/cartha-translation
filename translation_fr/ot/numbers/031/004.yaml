base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/004.yaml
  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
translation:
  language: fr
  text: Vous enverrez à l’armée mille hommes par tribu, mille hommes par tribu, pris dans toutes les tribus d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le service militaire ». L’hébreu peut désigner le service dans la force armée, et non seulement l’envoi vers un lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף
  choice: mille hommes
  rationale: Le cardinal signifie « mille »; « hommes » est explicité naturellement en français d’après le contexte de mobilisation militaire, sans modifier le nombre.
- source_word: לַמַּטֶּה
  choice: par tribu
  rationale: מַטֶּה désigne ici la tribu; avec ל et le nombre répété, la tournure a une valeur distributive.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: mille hommes par tribu, mille hommes par tribu
  rationale: La répétition marquée de l’hébreu est conservée afin d’en respecter l’insistance rhétorique plutôt que de la lisser.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: pris dans toutes les tribus d’Israël
  rationale: La formule précise l’origine des contingents et la portée distributive du commandement; « pris dans » rend clairement ce rapport en français.
- source_word: תִּשְׁלְחוּ
  choice: vous enverrez
  rationale: L’imparfait qal à valeur injonctive est rendu par le futur français, qui exprime ici un ordre avec dignité et naturel.
- source_word: לַצָּבָא
  choice: à l’armée
  rationale: צָבָא peut désigner la force armée ou le service/campagne militaire; « à l’armée » garde une formulation concise sans réduire le terme à un simple déplacement.
