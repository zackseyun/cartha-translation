lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le waw consécutif fait progresser le récit. « Puis » marque naturellement la succession, et « parla » correspond au verbe דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette forme rend le nom divin יהוה comme un nom propre plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de la parole ; « parler à quelqu’un » est la tournure française naturelle.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule infinitive introduit les paroles directes qui suivent. « En ces termes » est idiomatique en français et évite le calque pesant « en disant ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: L’hébreu porte explicitement le tétragramme. « Yahweh » préserve son statut de nom personnel sans le remplacer silencieusement par un titre ; la note signale les usages traditionnels.
translation_notes:
  register: Français moderne, naturel et digne. La phrase conserve la progression narrative et la formule introductive de la parole divine ; les deux-points annoncent le discours du verset suivant.
