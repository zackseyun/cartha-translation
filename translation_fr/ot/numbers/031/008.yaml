revisions:
- from: 'Ils tuèrent les rois de Madian parmi les autres morts[a] : Évi, Réqem, Tsour, Hour et Réba, les cinq rois de Madian. Ils tuèrent aussi par l’épée Balaam, fils de Béor.'
  to: 'Ils tuèrent les rois de Madian avec ceux qui avaient été tués[a] : Évi, Réqem, Tsour, Hour et Réba, les cinq rois de Madian. Ils tuèrent aussi Balaam, fils de Béor, par l’épée.'
  rationale: La révision évite d’ajouter « autres » dans le texte principal tout en donnant une formulation française intelligible. La note conserve l’ambiguïté syntaxique et sémantique de עַל־חַלְלֵיהֶם, sans déterminer de façon indue l’antécédent du possessif ni la relation exacte entre les rois et les morts.
