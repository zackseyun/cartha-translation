  text: וְ/אֶת מַלְכֵ֨י מִדְיָ֜ן הָרְג֣וּ עַל חַלְלֵי/הֶ֗ם אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע חֲמֵ֖שֶׁת מַלְכֵ֣י מִדְיָ֑ן וְ/אֵת֙ בִּלְעָ֣ם בֶּן בְּע֔וֹר הָרְג֖וּ בֶּ/חָֽרֶב־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: fr
  text: 'Ils tuèrent les rois de Madian avec ceux qui avaient été tués[a] : Évi, Réqem, Tsour, Hour et Réba, les cinq rois de Madian. Ils tuèrent aussi Balaam, fils de Béor, par l’épée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « sur leurs tués ». L’expression hébraïque est concise; elle peut signifier « avec leurs tués » ou « parmi leurs tués » et peut désigner les rois comme tués avec les autres morts de Madian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: ils tuèrent
  rationale: Le qal accompli, 3e personne du pluriel, exprime directement l’action de tuer. Le passé simple convient au registre narratif biblique en français sans être obscur.
- source_word: עַל חַלְלֵיהֶם
  choice: parmi les autres morts
  rationale: La préposition עַל et le nom חַלְלֵיהֶם forment ici une expression compacte, littéralement proche de « sur/parmi leurs transpercés ». En contexte, elle situe les rois parmi les autres morts de Madian, sans préciser davantage la relation.
- source_word: מַלְכֵי מִדְיָן
  choice: les rois de Madian
  rationale: Le groupe construit désigne simplement les rois de Madian; la même formulation est conservée dans la reprise appositionnelle.
- source_word: אֱוִי
  choice: Évi
  rationale: Transcription française du nom propre hébreu.
- source_word: רֶקֶם
  choice: Réqem
  rationale: Transcription française du nom propre, avec q pour représenter le qof.
- source_word: צוּר
  choice: Tsour
  rationale: Forme française traditionnelle qui rend la consonne initiale צ et la voyelle longue.
- source_word: חוּר
  choice: Hour
  rationale: Transcription française usuelle du nom propre.
- source_word: רֶבַע
  choice: Réba
  rationale: Transcription française usuelle du nom propre.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: les cinq rois de Madian
  rationale: L’expression résume en apposition les cinq hommes qui viennent d’être nommés.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaam, fils de Béor
  rationale: Le nom et le patronyme sont rendus selon leurs formes françaises usuelles; les virgules font naturellement ressortir l’apposition.
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: Le beth instrumental indique le moyen employé. « Par l’épée » conserve l’image concrète et le tour solennel de l’hébreu.
