source:
  edition: WLC
  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: fr
  text: Vous purifierez aussi tout vêtement, tout objet en cuir, tout ouvrage en poil de chèvre et tout objet en bois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie une forme réfléchie, littéralement « vous vous purifierez ». Dans ce contexte, elle concerne la purification rituelle des objets qui viennent d’être énumérés.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: vêtement
  rationale: Le terme désigne couramment un vêtement ou une pièce d’habillement; « vêtement » convient au registre d’inventaire.
- source_word: כְּלִי עוֹר
  choice: objet en cuir
  rationale: כְּלִי peut désigner largement un objet, un ustensile ou un récipient. « Objet » évite de limiter indûment la catégorie aux récipients, tandis que « cuir » exprime naturellement la matière.
- source_word: מַעֲשֵׂה עִזִּים
  choice: ouvrage en poil de chèvre
  rationale: מַעֲשֵׂה désigne ce qui est fabriqué ou travaillé. Dans cette liste de matières, l’expression vise vraisemblablement un ouvrage en poil de chèvre, tout en gardant la formulation matérielle du texte.
- source_word: כְּלִי עֵץ
  choice: objet en bois
  rationale: Comme pour כְּלִי עוֹר, « objet » conserve la portée générale de כְּלִי et « en bois » indique clairement la matière.
- source_word: תִּתְחַטָּאוּ
  choice: vous purifierez
  rationale: Le hitpael de חטא porte ici un sens rituel de purification. Bien que sa morphologie soit réflexive, les objets énumérés fonctionnent contextuellement comme ce qui doit être purifié; le français emploie donc le verbe transitivement, sans ajouter une purification morale « du péché ».
theological_decisions:
- issue: Portée de la purification dans un contexte d’impureté consécutive à la guerre
  choice: Rapporter « vous purifierez » aux objets énumérés et conserver un vocabulaire rituel général.
  alternative: « vous vous purifierez » ou « vous vous purifierez du péché »
  rationale: La forme hébraïque est morphologiquement réfléchie, mais le contexte immédiat énumère les biens soumis à purification. Ajouter « du péché » ferait glisser le passage vers une lecture morale ou doctrinale que le contexte rituel n’impose pas.
translation_notes:
  register: Français international moderne, digne et direct. La structure répétitive de l’inventaire hébreu est conservée par la reprise de « tout », avec « aussi » pour rendre la coordination initiale.
