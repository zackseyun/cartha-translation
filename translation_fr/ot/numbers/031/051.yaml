  text: Moïse et Éléazar, le prêtre, reçurent d’eux l’or, tous les objets façonnés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prirent
  rationale: Le verbe לקח exprime ici l’action concrète de prendre ou de recevoir; « prirent » convient au déroulement narratif.
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  choice: Moïse et le prêtre Éléazar
  rationale: Formulation française naturelle qui conserve le nom traditionnel de Moïse et le titre sacerdotal d’Éléazar.
- source_word: אֶת הַזָּהָב
  choice: l’or
  rationale: L’article défini désigne l’or précis offert dans le contexte immédiat.
- source_word: מֵאִתָּם
  choice: qu’ils leur avaient apporté
  rationale: Le syntagme indique que l’or provenait d’eux. Cette formulation explicite naturellement la source en français à la lumière de l’offrande mentionnée au verset précédent, sans changer l’action principale.
- source_word: כֹּל כְּלִי מַעֲשֶׂה
  choice: tous les objets façonnés
  rationale: כְּלִי est un terme large désignant des objets ou articles, tandis que מַעֲשֶׂה précise qu’il s’agit d’objets travaillés, et non d’or brut.
