  source_fidelity: 'La formulation « qu’ils leur avaient apporté » dépasse le texte hébreu : מֵאִתָּם signifie simplement « d’eux / de leur part » et n’énonce ni un apport antérieur ni l’action de remettre. Le rendu révisé conserve cette relation de provenance. « Tous les objets façonnés » rend correctement כֹּל כְּלִי מַעֲשֶׂה, entendu comme l’ensemble des objets d’or travaillés.'
  naturalness: « Reçurent d’eux l’or » est naturel dans une scène de remise et exprime en français, sans ajout narratif, la prise/réception indiquée par לקח. L’apposition « Éléazar, le prêtre » est claire et fluide. La virgule introduit naturellement l’explication apposée de l’or.
