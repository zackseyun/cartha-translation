  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: fr
  text: Moïse, le prêtre Éléazar et tous les responsables de la communauté[a] sortirent à leur rencontre, hors du camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs de l’assemblée »; le terme désigne les dirigeants reconnus de la communauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Le wayyiqtol de יצא exprime un mouvement vers l’extérieur; « sortirent » rend naturellement la progression narrative et le sens directionnel.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: le prêtre Éléazar
  rationale: Cette tournure française naturelle conserve le titre qui précise la fonction d’Éléazar.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: tous les responsables de la communauté
  rationale: נְשִׂיאִים désigne ici les dirigeants reconnus du peuple plutôt que des souverains; « responsables » est actuel et non royal. הָעֵדָה désigne la communauté d’Israël rassemblée.
- source_word: לִקְרָאתָם
  choice: à leur rencontre
  rationale: L’infinitif construit avec ל et le suffixe exprime le but de leur sortie; l’expression française « sortir à la rencontre de » est idiomatique.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: La locution indique un lieu situé au-delà des limites du camp. « Hors du camp » en conserve le relief directionnel et spatial avec concision.
