  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: fr
  text: Le butin[a], le reste des prises dont les membres de l’armée s’étaient emparés, était de 675 000 têtes de petit bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les prises, le reste du butin ». L’hébreu emploie deux termes proches pour ce qui est pris à la guerre (מַלְקוֹחַ et בָּז), probablement avec une nuance stylistique ou classificatoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: était de
  rationale: La forme narrative de היה introduit ici le total de l’inventaire. « était de » exprime naturellement en français la valeur chiffrée sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: הַמַּלְקוֹחַ
  choice: le butin
  rationale: Le terme désigne ce qui a été pris à la guerre. « Butin » est courant, précis et adapté au contexte militaire.
- source_word: יֶתֶר הַבָּז
  choice: le reste des prises
  rationale: יֶתֶר marque ce qui reste, tandis que בָּז désigne les biens pris à l’ennemi. « Prises » permet de conserver la distinction stylistique avec « butin ».
- source_word: אֲשֶׁר בָּזְזוּ
  choice: dont … s’étaient emparés
  rationale: Cette formulation française rend l’acte de prendre comme butin sans produire la répétition peu naturelle « butin qu’ils avaient butiné ».
- source_word: עַם הַצָּבָא
  choice: les membres de l’armée
  rationale: Cette expression garde les deux composantes de l’hébreu, « peuple/gens » et « armée », tout en étant naturelle et sans préciser plus que le texte le sexe ou le statut exact des personnes.
- source_word: צֹאן
  choice: têtes de petit bétail
  rationale: צֹאן est un terme collectif pouvant désigner les ovins et, selon le contexte, les caprins. « Petit bétail » préserve cette portée mieux que le seul mot « moutons »; « têtes de » convient au dénombrement.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 675 000
  rationale: Le nombre hébreu totalise 600 000 + 70 000 + 5 000. Les chiffres facilitent la lecture de cet inventaire, avec l’espacement typographique français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure d’inventaire du texte tout en évitant une répétition lexicale artificielle. « Petit bétail » maintient l’étendue sémantique du collectif hébreu צֹאן.
