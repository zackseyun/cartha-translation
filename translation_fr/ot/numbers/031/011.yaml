  text: And they took all the spoil and all the plunder, both man and beast.
translation:
  language: fr
  text: Ils prirent tout le butin et toutes les prises, personnes et bêtes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: butin
  rationale: Terme français naturel pour les biens pris à la guerre; il maintient la distinction avec מַלְקוֹחַ.
- source_word: מַלְקוֹחַ
  choice: ce qu’ils avaient capturé
  rationale: Le nom désigne ici les prises vivantes, comme le précise la suite « personnes et bêtes »; cette formulation évite de le confondre avec le butin matériel.
- source_word: אָדָם
  choice: personnes
  rationale: Dans cette construction collective, le terme hébreu renvoie aux êtres humains capturés; « personnes » est naturel en français moderne sans préciser leur sexe.
- source_word: בְּהֵמָה
  choice: bêtes
  rationale: Rend le terme collectif désignant les animaux domestiques ou le bétail, tout en conservant la formulation générale du texte.
