  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: fr
  text: Les fils d’Israël emmenèrent en captivité les femmes de Madian et leurs jeunes enfants[a], et pillèrent tout leur bétail, tous leurs troupeaux et toutes leurs richesses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs enfants ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tous leurs biens » ou « toutes leurs ressources ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: emmenèrent captives
  rationale: Le qal de שׁבה désigne ici le fait de faire des personnes prisonnières. Cette formulation française exprime clairement leur mise en captivité et leur déplacement, sans employer le moins naturel « prirent captives ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Les fils d’Israël
  rationale: Rend directement l’expression hébraïque tout en demeurant compréhensible dans un registre biblique digne. « Les Israélites » serait plus idiomatique, mais moins formellement proche.
- source_word: נְשֵׁי מִדְיָן
  choice: les femmes de Madian
  rationale: נָשִׁים désigne ici les femmes en général, non nécessairement les épouses. La construction avec « de Madian » reproduit naturellement le syntagme construit.
- source_word: טַפָּם
  choice: leurs jeunes enfants
  rationale: טַף désigne collectivement les petits enfants ou les jeunes personnes à charge. « Jeunes enfants » conserve la nuance d’âge tout en étant plus courant en français que « petits » substantivé.
- source_word: בְּהֶמְתָּם
  choice: tout leur bétail
  rationale: בְּהֵמָה au collectif renvoie aux animaux domestiques. « Bétail » est le terme français naturel dans ce contexte.
- source_word: מִקְנֵהֶם
  choice: tous leurs troupeaux
  rationale: מִקְנֶה peut désigner les possessions en animaux, notamment les troupeaux. Ce choix conserve le cadre pastoral et distingue le terme de בְּהֵמָה.
- source_word: חֵילָם
  choice: toutes leurs richesses
  rationale: Dans ce contexte non militaire, חַיִל désigne les ressources, biens ou richesses. « Richesses » résume naturellement les biens matériels restants sans imposer une catégorie trop précise.
- source_word: בָּזָזוּ
  choice: pillèrent
  rationale: בזז exprime la prise de butin après la victoire. « Pillèrent » conserve nettement cette valeur guerrière dans un français courant et digne.
theological_decisions:
- issue: Traduction de l’expression ethnonymique בְנֵי יִשְׂרָאֵל
  choice: Les fils d’Israël
  alternative: Les Israélites
  rationale: Aucun enjeu doctrinal particulier n’est tranché ici. Le choix conserve la forme masculine et filiale de l’hébreu, tandis que l’alternative serait plus idiomatique mais moins transparente.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe coordonnée suit le mouvement de l’hébreu. « Madian » est la forme française biblique courante. Les répétitions de « tout/tous/toutes » rendent les trois occurrences de כָּל.
