  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: fr
  text: Partage le butin entre les combattants qui sont partis en campagne et toute la communauté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: Partage
  rationale: Le verbe חצה signifie « diviser, partager ». Dans cette suite d’instructions adressées à Moïse, l’impératif français exprime naturellement la valeur prescriptive.
- source_word: הַמַּלְקוֹחַ
  choice: le butin
  rationale: מַלְקוֹחַ désigne ce qui a été pris à la guerre et englobe ici les personnes, les animaux et les biens recensés dans le contexte. « Butin » est le terme français courant et suffisamment large.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et
  rationale: La construction hébraïque distingue les deux groupes entre lesquels le butin doit être réparti.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: les combattants
  rationale: L’expression signifie littéralement ceux qui « saisissent/manient la guerre » et désigne idiomatiquement ceux qui ont combattu. « Les combattants » en restitue le sens avec concision.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: qui sont partis en campagne
  rationale: La formule désigne ceux qui sont sortis pour le service ou l’expédition militaire. « Partir en campagne » conserve le mouvement exprimé par יצא et le sens militaire de צבא.
- source_word: כָּל הָעֵדָה
  choice: toute la communauté
  rationale: עֵדָה désigne ici l’ensemble de la communauté d’Israël. « Communauté » est naturel en français moderne et préserve la portée collective du terme.
