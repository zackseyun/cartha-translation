  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: fr
  text: Yaïr, fils de Manassé, partit et s’empara de leurs villages. Il les appela Havvoth-Yaïr[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Havvoth-Yaïr signifie « villages de Yaïr » ou « établissements de Yaïr ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: Yaïr
  rationale: Translittération française usuelle du nom propre hébreu, avec tréma pour signaler la séparation des voyelles.
- source_word: בֶּן מְנַשֶּׁה
  choice: fils de Manassé
  rationale: Rend littéralement la relation exprimée par l’hébreu sans la préciser comme « descendant », bien que cet emploi généalogique soit possible.
- source_word: הָלַךְ
  choice: partit
  rationale: Dans cette séquence narrative, « partit » exprime naturellement le déplacement de Yaïr sans ajouter de direction ni de but absents de l’hébreu.
- source_word: וַיִּלְכֹּד
  choice: s’empara de
  rationale: Convient au contexte de conquête territoriale et rend l’idée de prise ou de capture.
- source_word: חַוֺּתֵיהֶם
  choice: leurs villages
  rationale: Le terme désigne de petites localités ou agglomérations; « villages » est clair et naturel en français moderne.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: Il les appela
  rationale: Préserve l’expression hébraïque pouvant signifier appeler ou donner un nom, tout en restant idiomatique.
- source_word: חַוֺּת יָאִיר
  choice: Havvoth-Yaïr
  rationale: Le groupe fonctionne comme un nom de lieu. La translittération le conserve comme toponyme, tandis que son sens est donné en note.
