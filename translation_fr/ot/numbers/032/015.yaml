base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: fr
  text: Car si vous cessez de le suivre[a], il le laissera de nouveau dans le désert[b], et vous causerez la ruine de tout ce peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « revenir de derrière lui », expression qui signifie ici cesser de le suivre.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie un pronom singulier : « il le laissera dans le désert ». Ce pronom désigne vraisemblablement de manière collective Israël, c’est-à-dire le peuple. On pourrait aussi traduire : « il laissera ce peuple » ou « il les laissera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car si
  rationale: Dans ce contexte, כִּי relie l’avertissement à ce qui précède tout en introduisant une condition. « Car si » conserve ces deux valeurs.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: vous cessez de le suivre
  rationale: L’expression signifie littéralement revenir ou se détourner de derrière quelqu’un, c’est-à-dire renoncer à le suivre. La formulation française rend naturellement cet idiome sans ajouter de motif.
- source_word: וְיָסַף עוֹד
  choice: de nouveau
  rationale: 'La combinaison de יסף et עוד exprime la répétition de l’action : Dieu laisserait encore une fois le peuple dans le désert.'
- source_word: לְהַנִּיחוֹ
  choice: il le laissera
  rationale: Le hiphil de נוח peut signifier laisser ou faire rester. Le pronom suffixe est masculin singulier ; il est conservé dans le texte, malgré son emploi vraisemblablement collectif.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme français courant et traditionnel pour מִדְבָּר dans le récit du séjour d’Israël.
- source_word: וְשִׁחַתֶּם
  choice: vous causerez la ruine
  rationale: Le verbe שׁחת exprime ici une action destructrice dont les destinataires seraient responsables. « Causerez la ruine » garde cette causalité sans limiter le sens à une extermination immédiate.
- source_word: לְכָל הָעָם הַזֶּה
  choice: de tout ce peuple
  rationale: La formulation respecte le singulier collectif de הָעָם et s’intègre naturellement au complément de « causer la ruine ».
theological_decisions:
- issue: Référent du pronom masculin singulier dans לְהַנִּיחוֹ
  choice: 'Conserver le singulier : « il le laissera »'
  alternative: 'Expliciter ou lisser au pluriel : « il laissera ce peuple » ou « il les laissera »'
  rationale: Le texte hébreu porte un suffixe masculin singulier, probablement collectif et renvoyant à Israël ou au peuple. Le singulier est maintenu afin de ne pas effacer la forme ni l’ambiguïté du texte source ; une note en explique le référent probable.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le lien explicatif et conditionnel de l’hébreu. Le singulier collectif inhabituel est maintenu dans le texte et expliqué en note.
