    issue: « à l’endroit qui leur est destiné »
    rationale: Cette formulation ajoute l’idée d’un lieu assigné ou destiné. Le texte hébreu dit seulement « à leur lieu / à leur place »; le contexte permet de comprendre le lieu d’établissement sans l’inscrire dans la traduction.
  - severity: medium
    issue: « Nos enfants et les personnes à notre charge »
    rationale: טַפֵּנוּ désigne d’abord les jeunes enfants/petits. Une extension aux dépendants est possible selon le contexte, mais la coordination dans le texte principal la présente comme explicite.
