revisions:
- from: Mais nous, nous nous armerons sans tarder pour marcher devant les Israélites[a], jusqu’à ce que nous les ayons conduits à l’endroit qui leur est destiné. Nos enfants et les personnes à notre charge[b] resteront dans les villes fortifiées, à cause des habitants du pays.
  to: Mais nous, nous nous armerons sans tarder pour aller devant les Israélites[a], jusqu’à ce que nous les ayons conduits à leur place ; nos jeunes enfants[b] resteront dans les villes fortifiées, à cause des habitants du pays.
  rationale: La révision retire deux explicitations non exprimées par l’hébreu tout en conservant le sens militaire probable dans la note. Elle emploie « leur place », qui préserve l’ouverture de מְקוֹמָם, et réserve à la note l’extension possible de טַף aux dépendants.
