language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: fr
  text: Mais nous, nous nous armerons sans tarder pour aller devant les Israélites[a], jusqu’à ce que nous les ayons conduits à leur place ; nos jeunes enfants[b] resteront dans les villes fortifiées, à cause des habitants du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « devant les fils d’Israël ». Dans ce contexte, l’expression signifie probablement qu’ils iront en tête des Israélites pour combattre.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne collectivement les jeunes enfants et peut, dans un sens plus large, inclure des personnes dépendantes.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: nous nous armerons
  rationale: 'Le niphal de חלץ a ici une valeur moyenne ou réfléchie : les tribus promettent de s’équiper elles-mêmes pour le combat.'
- source_word: חֻשִׁים
  choice: sans tarder
  rationale: Le terme exprime vraisemblablement l’empressement ou la promptitude. Cette formulation évite de répéter l’idée d’armement déjà portée par נֵחָלֵץ, tout en laissant la variante militaire à la note.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: pour marcher devant les Israélites
  rationale: Littéralement « devant les fils d’Israël ». Dans ce contexte militaire, la phrase indique probablement qu’ils prendront place en tête de l’armée; « Israélites » est naturel et inclusif en français moderne.
- source_word: עַד אֲשֶׁר אִם
  choice: jusqu’à ce que
  rationale: La combinaison marque idiomatiquement le terme de l’action.
- source_word: הֲבִיאֹנֻם
  choice: nous les ayons conduits
  rationale: Le hiphil de בוא signifie « faire venir, amener ». « Conduire » convient au déplacement collectif vers le territoire attribué.
- source_word: אֶל מְקוֹמָם
  choice: à l’endroit qui leur est destiné
  rationale: Littéralement « à leur lieu ». La formulation française rend naturellement le lieu où les autres Israélites doivent s’établir sans le définir plus précisément.
- source_word: טַפֵּנוּ
  choice: nos enfants et les personnes à notre charge
  rationale: Le collectif טף désigne principalement les jeunes enfants, mais peut englober plus largement les membres dépendants du groupe familial.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: dans les villes fortifiées
  rationale: Le syntagme désigne des villes protégées par des ouvrages défensifs.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: à cause des habitants du pays
  rationale: La préposition exprime ici la menace qui motive le maintien des familles dans des villes fortifiées, sans expliciter davantage que le texte source la nature de cette menace.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition emphatique « nous, nous » rend וַאֲנַחְנוּ. La traduction conserve « à cause des habitants du pays » plutôt que d’expliciter entièrement la notion de protection, et les notes signalent les principales nuances lexicales.
