  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: fr
  text: 'Ils s’approchèrent de lui et dirent : « Nous construirons ici des enclos pour le petit bétail et des villes pour nos jeunes enfants[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos personnes à charge ». Le mot hébreu désigne les jeunes enfants ou, plus largement, les membres dépendants et vulnérables d’un groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: Ils s’approchèrent de lui
  rationale: Le verbe נגשׁ décrit ici un mouvement vers Moïse. « S’approchèrent de lui » est naturel en français moderne et conserve explicitement ce mouvement.
- source_word: וַיֹּאמְרוּ
  choice: et dirent
  rationale: Cette formulation maintient la succession narrative de l’hébreu et introduit directement les paroles prononcées.
- source_word: גִּדְרֹת צֹאן
  choice: des enclos pour notre petit bétail
  rationale: גְּדֵרָה désigne un espace clôturé, tandis que צֹאן peut inclure les moutons et les chèvres. « Petit bétail » évite de restreindre indûment le terme aux seuls moutons.
- source_word: נִבְנֶה
  choice: Nous construirons
  rationale: L’inaccompli à la première personne du pluriel exprime ici leur intention ou projet. Le futur français transmet naturellement cette valeur en contexte.
- source_word: לְמִקְנֵנוּ
  choice: pour notre petit bétail
  rationale: מִקְנֶה désigne les animaux possédés, donc le bétail. Dans cette phrase, le rapprochement avec צֹאן permet une expression française concise sans ajouter une catégorie animale étrangère au texte.
- source_word: פֹּה
  choice: ici
  rationale: Équivalent direct et idiomatique de l’adverbe locatif.
- source_word: וְעָרִים
  choice: et des villes
  rationale: « Villes » est l’équivalent lexical direct de עָרִים et conserve le contraste entre les enclos destinés au bétail et les lieux fortifiés ou habités destinés aux familles.
- source_word: לְטַפֵּנוּ
  choice: pour nos petits enfants
  rationale: טַף désigne collectivement les jeunes enfants et peut, selon le contexte, englober plus largement les personnes à charge. « Petits enfants » rend ici l’accent sur les jeunes membres vulnérables des familles.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste proche de l’hébreu sans être archaïque. « Petit bétail » rend la portée de צֹאן, qui ne se limite pas nécessairement aux moutons, et la note préserve l’étendue possible de טַף.
