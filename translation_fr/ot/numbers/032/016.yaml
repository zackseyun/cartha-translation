  naturalness: « Ils s’approchèrent de lui et dirent » et le futur d’intention sont naturels en français moderne. « Nos jeunes enfants » est plus clair que « nos petits enfants », expression qui peut aussi désigner des petits-enfants en français contemporain.
  terminology: « Enclos pour le petit bétail » rend היטèlement גִּדְרֹת צֹאן; « bétail » rend ensuite לְמִקְנֵנוּ sans le réduire aux seuls ovins et caprins. « Jeunes enfants » rend le sens principal de טַף, avec une note pour l’extension possible aux dépendants.
