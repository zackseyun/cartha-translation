  text: וַ/יְצַ֤ו לָ/הֶם֙ מֹשֶׁ֔ה אֵ֚ת אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/אֵ֖ת יְהוֹשֻׁ֣עַ בִּן נ֑וּן וְ/אֶת רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: fr
  text: Alors, Moïse donna, à leur sujet, des ordres à Éléazar le prêtre, à Josué fils de Noun et aux chefs des groupes familiaux des tribus d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : le pronom hébreu peut désigner Éléazar, Josué et les chefs nommés dans ce verset ; on comprendrait alors que Moïse leur donna des ordres, plutôt que des ordres au sujet des tribus mentionnées auparavant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna des ordres
  rationale: Le verbe צוה exprime un ordre faisant autorité. « Donna des ordres » convient naturellement à la construction française avec les destinataires introduits par « à ».
- source_word: לָהֶם
  choice: à leur sujet
  rationale: Le pronom renvoie vraisemblablement aux Rubénites et aux Gadites évoqués auparavant, tandis qu’Éléazar, Josué et les chefs sont les destinataires des ordres. Cette traduction préserve toutefois l’autre analyse possible dans une note.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: à Éléazar le prêtre
  rationale: Avec צוה, la marque de l’objet introduit ici l’une des personnes chargées de recevoir et d’exécuter les instructions; le français demande naturellement « à » après « donna des ordres ».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué fils de Noun
  rationale: Forme française traditionnelle et concise du nom et du patronyme hébreux.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: les chefs des groupes familiaux des tribus
  rationale: L’expression administrative hébraïque est condensée. « Groupes familiaux » rend אבות dans son sens de maisons ancestrales ou clans, sans employer le peu naturel « maisons des pères ».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: d’Israël
  rationale: Dans cette chaîne administrative, « des tribus d’Israël » est clair et idiomatique; il communique l’appartenance au peuple d’Israël sans alourdir la phrase par le calque « fils d’Israël ».
theological_decisions:
- issue: Référent et fonction de לָהֶם
  choice: « à leur sujet », renvoyant aux Rubénites et aux Gadites
  alternative: « leur donna des ordres », le pronom désignant les responsables nommés dans le verset
  rationale: Dans le contexte immédiat, Moïse confie aux responsables des instructions concernant les tribus qui demandent un territoire à l’est du Jourdain. La syntaxe hébraïque permet néanmoins l’autre compréhension, conservée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, digne et direct. La formulation administrative hébraïque est rendue de manière intelligible, tout en conservant par une note l’ambiguïté syntaxique de לָהֶם.
