  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: fr
  text: Et pourquoi découragez-vous les Israélites de passer dans le pays que Yahweh leur a donné ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « le cœur des fils d’Israël »; le « cœur » désigne ici notamment leur courage ou leur résolution.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Israël »; on peut aussi traduire « les enfants d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Et pourquoi
  rationale: Conserve la conjonction qui relie cette question au reproche précédent, tout en restant naturel en français.
- source_word: תנואון אֶת לֵב
  choice: découragez-vous
  rationale: Le hiphil de נוא, associé au « cœur », exprime ici l’affaiblissement du courage ou de la résolution. Le français naturel intègre l’idée du cœur dans le verbe « décourager ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent français courant de l’expression nationale et familiale « fils d’Israël »; il désigne naturellement le peuple sans donner à tort l’impression que seuls les hommes sont concernés.
- source_word: מֵעֲבֹר אֶל הָאָרֶץ
  choice: de passer dans le pays
  rationale: La préposition מִן après le verbe marque ce dont on détourne quelqu’un; « passer dans » rend le mouvement de traversée et d’entrée dans le territoire.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: que … leur a donné
  rationale: Le passé composé rend l’accompli hébreu comme un don déjà accordé dont les effets demeurent présents.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom propre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël; les enfants d’Israël
  rationale: L’expression hébraïque masculine plurielle fonctionne comme une désignation collective du peuple. « Les Israélites » en conserve la portée sans restreindre artificiellement le référent aux hommes.
- issue: Métaphore du cœur dans תנואון אֶת לֵב
  choice: découragez-vous
  alternative: faites-vous perdre courage au cœur de; détournez-vous le cœur de
  rationale: Le sens porte sur le courage et la résolution. Le corps du texte privilégie l’idiome français, tandis que la note conserve la forme littérale et sa tension anthropologique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation est idiomatique sans effacer les principaux traits de l’hébreu, qui sont signalés en notes.
