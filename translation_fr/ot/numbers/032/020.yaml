  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ מֹשֶׁ֔ה אִֽם תַּעֲשׂ֖וּ/ן אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה אִם תֵּחָֽלְצ֛וּ לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: fr
  text: 'Moïse leur dit : « Si vous faites cela, si vous vous armez devant Yahweh pour le combat,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: Moïse leur dit
  rationale: Rend naturellement en français la progression narrative du wayyiqtol et le complément indirect.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: Si vous faites cela
  rationale: « Cela » reprend de façon idiomatique la proposition précédente tout en conservant la portée générale de דָּבָר.
- source_word: אִם תֵּחָלְצוּ
  choice: si vous vous équipez pour le combat
  rationale: 'Le nifal de חלץ a ici un sens militaire : s’équiper, se préparer ou se présenter en armes. Cette formulation demeure naturelle sans réduire le verbe au seul geste de prendre des armes.'
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Préserve le sens spatial et théologique de לִפְנֵי ainsi que le nom divin explicite du texte hébreu.
- source_word: לַמִּלְחָמָה
  choice: pour le combat
  rationale: Dans cette stipulation militaire, « pour le combat » est plus idiomatique en français que « pour la guerre » et exprime bien la destination de l’équipement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée de « devant Yahweh »
  choice: conserver la formulation sans explicitation dans le corps du texte
  alternative: en présence de Yahweh / sous l’autorité de Yahweh
  rationale: « Devant » maintient l’ambiguïté féconde du texte entre présence divine, orientation cultuelle et autorité, tandis qu’une note en précise la portée possible.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste ouverte par une virgule, conformément au fait que le verset forme le début d’une condition dont la suite vient aux versets suivants.
