  yaml_path: translation/ot/numbers/032/008.yaml
  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: fr
  text: 'C’est ainsi qu’ont agi vos pères quand je les ai envoyés de Qadesh-Barnéa pour voir le pays[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour examiner » ou « pour explorer le pays ». Le verbe hébreu signifie littéralement « voir », mais il désigne ici l’exploration du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה עָשׂוּ
  choice: C’est ainsi qu’ont agi
  rationale: Cette tournure naturelle conserve la valeur démonstrative de כֹּה et présente l’action passée comme un précédent comparable à la situation présente.
- source_word: אֲבֹתֵיכֶם
  choice: vos pères
  rationale: Le terme hébreu signifie explicitement « vos pères » et désigne ici la génération précédente; ce choix préserve mieux cette force générationnelle que « vos ancêtres ».
- source_word: בְּשָׁלְחִי אֹתָם
  choice: quand je les ai envoyés
  rationale: La préposition בְּ avec l’infinitif construit et le suffixe de première personne a ici une valeur temporelle, rendue naturellement en français par « quand ».
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: de Qadesh-Barnéa
  rationale: Transcription française moderne du nom de lieu, avec trait d’union pour le toponyme composé.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: Le verbe ראה signifie littéralement « voir ». Dans ce contexte, il implique l’exploration du pays, mais le texte principal conserve son sens lexical direct.
- source_word: אֶת הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, « le pays » est plus idiomatique en français que « la terre », sans expliciter davantage que l’hébreu le territoire visé.
