source:
  edition: WLC
  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: fr
  text: Le pays que Yahweh a frappé devant la communauté d’Israël est un pays propice au bétail[a], et tes serviteurs ont du bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un pays qui convient aux troupeaux »; le terme hébreu désigne largement les animaux d’élevage, et non seulement les bovins.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: Le pays
  rationale: אֶרֶץ désigne ici le territoire dont il vient d’être question; « pays » est naturel en français et conserve l’article défini.
- source_word: הִכָּה
  choice: a frappé
  rationale: Le verbe נכה évoque l’action militaire par laquelle Yahweh a frappé les habitants du territoire. « A frappé » reste proche de l’hébreu sans expliciter davantage par « a vaincu ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le terme signifie littéralement « devant, en présence de »; ici, Israël est témoin de l’action de Yahweh.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: la communauté d’Israël
  rationale: עֵדָה désigne la collectivité d’Israël. « Communauté » est précis, actuel et plus naturel en français courant que « congrégation ».
- source_word: אֶרֶץ מִקְנֶה
  choice: un pays propice au bétail
  rationale: La juxtaposition hébraïque caractérise le territoire par son aptitude à l’élevage. « Propice au bétail » exprime ce rapport naturellement sans limiter מִקְנֶה aux seuls bovins.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: et tes serviteurs ont du bétail
  rationale: La construction avec ל exprime la possession. La formulation française avec « avoir » est idiomatique et conserve l’adresse respectueuse à Moïse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Nature de l’action exprimée par הִכָּה
  choice: a frappé
  alternative: a vaincu
  rationale: « A frappé » maintient la formulation concrète et l’étendue sémantique de l’hébreu, sans réduire l’action divine à la seule idée de victoire militaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Communauté d’Israël » évite la coloration ecclésiale possible de « congrégation ». La répétition de « pays » et de « bétail » reflète celle du texte hébreu.
