language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: fr
  text: Et voici, vous vous êtes levés à la place de vos pères, engeance d’hommes pécheurs[a], pour ajouter encore à l’ardente colère[b] de Yahweh contre Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « multiplication d’hommes pécheurs » ou « descendance d’hommes pécheurs ». Le mot hébreu תַּרְבּוּת peut désigner un accroissement ou une descendance ; « engeance » restitue ici le ton de réprobation.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie littéralement « l’ardeur de la narine de Yahweh » ; c’est une image désignant une colère intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la force déictique et l’accent solennel de l’avertissement de Moïse dans un français biblique encore naturel.
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: vous vous êtes levés à la place de vos pères
  rationale: Préserve l’image du verbe קום tout en exprimant la succession générationnelle indiquée par תַּחַת.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: engeance d’hommes pécheurs
  rationale: « Engeance » rend à la fois l’idée de descendance ou de groupe issu d’autres personnes et la forte nuance de réprobation du contexte; « hommes » maintient le masculin explicite de אֲנָשִׁים.
- source_word: לִסְפּוֹת עוֹד עַל
  choice: pour ajouter encore à
  rationale: Rend directement l’idée d’accroître davantage une colère déjà présente.
- source_word: חֲרוֹן אַף
  choice: l’ardente colère
  rationale: Expression française naturelle qui conserve l’image de chaleur intense portée par l’expression hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל יִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec un terme de colère, אֶל désigne ici la cible vers laquelle celle-ci est dirigée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le Tétragramme; la transcription préserve le nom propre divin sans le remplacer par un titre.
- issue: Portée masculine de אֲנָשִׁים חַטָּאִים
  choice: hommes pécheurs
  alternative: gens pécheurs
  rationale: Le substantif hébreu est explicitement masculin pluriel et vise les hommes des tribus auxquels Moïse répond; le français conserve donc cette précision.
- issue: Rapport entre la génération présente et les pères
  choice: à la place de vos pères
  alternative: après vos pères
  rationale: תַּחַת exprime ici la succession et le remplacement. La formulation retenue garde cette continuité accusatrice sans affirmer que les fils commettent exactement la même faute.
translation_notes:
  register: Français international moderne, soutenu sans être archaïque. « Et voici » garde la vigueur rhétorique du texte; « engeance » est volontairement marqué afin de restituer la sévérité de la réprimande.
