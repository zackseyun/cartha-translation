  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: fr
  text: Nos jeunes enfants[a], nos femmes, nos troupeaux et toutes nos bêtes resteront là, dans les villes de Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos enfants ». Le mot hébreu טַף désigne souvent plus particulièrement les petits enfants ou les enfants à charge.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: nos jeunes enfants
  rationale: טַף désigne souvent les petits enfants ou, plus largement, les enfants à charge. « Jeunes enfants » exprime clairement ici les non-combattants les plus jeunes, tout en laissant l'autre possibilité en note.
- source_word: נָשֵׁינוּ
  choice: nos femmes
  rationale: Dans ce contexte familial, le terme désigne les épouses des hommes qui parlent. « Nos femmes » est une formulation française naturelle et courante.
- source_word: מִקְנֵנוּ
  choice: nos troupeaux
  rationale: מִקְנֶה désigne le bétail constituant les troupeaux, c'est-à-dire les animaux possédés. « Troupeaux » convient au contexte pastoral et se distingue naturellement du terme plus général qui suit.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: et toutes nos bêtes
  rationale: בְּהֵמָה est un terme large pour les animaux, surtout domestiques. « Toutes nos bêtes » conserve cette généralité et l'insistance sur la totalité sans répéter « troupeaux ».
- source_word: יִהְיוּ שָׁם
  choice: resteront là
  rationale: Le verbe signifie littéralement « seront », mais le contexte indique qu'ils demeureront sur place pendant que les hommes partiront en campagne. « Resteront là » rend naturellement cette valeur contextuelle.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: dans les villes de Galaad
  rationale: עָרִים peut désigner des villes ou des localités fortifiées. « Villes de Galaad » est direct, digne et conforme à l'usage biblique français du nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve l'énumération hébraïque et distingue « troupeaux » du terme plus général « bêtes ». Le marqueur [a] est placé immédiatement après l'expression concernée.
