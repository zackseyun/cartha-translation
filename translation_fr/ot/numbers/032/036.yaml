  text: וְ/אֶת בֵּ֥ית נִמְרָ֖ה וְ/אֶת בֵּ֣ית הָרָ֑ן עָרֵ֥י מִבְצָ֖ר וְ/גִדְרֹ֥ת צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: fr
  text: ainsi que Beth-Nimra et Beth-Harân, villes fortifiées, et des enclos pour les troupeaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: Beth-Nimra
  rationale: Nom de lieu translittéré selon une forme française claire; le constituant בֵּית fait partie du toponyme et n’est donc pas traduit par « maison de ».
- source_word: בֵּית הָרָן
  choice: Beth-Harân
  rationale: Nom de ville translittéré plutôt que traduit; l’accent circonflexe aide à distinguer la voyelle longue finale dans l’usage français.
- source_word: עָרֵי מִבְצָר
  choice: villes fortifiées
  rationale: Expression française naturelle qui conserve le sens défensif de la construction hébraïque « villes de fortification ».
- source_word: גִדְרֹת צֹאן
  choice: enclos pour les troupeaux
  rationale: גִדְרֹת désigne des enceintes ou parcs, tandis que צֹאן peut englober le petit bétail, notamment brebis et chèvres; « troupeaux » évite de restreindre indûment le référent aux seuls moutons.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: ainsi que ... et ... et
  rationale: La formulation poursuit l’énumération du verset précédent; « ainsi que » rend naturellement cette continuité en français sans traduire le marqueur d’objet אֵת.
theological_decisions: []
