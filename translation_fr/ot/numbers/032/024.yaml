  text: בְּנֽוּ לָ/כֶ֤ם עָרִים֙ לְ/טַפְּ/כֶ֔ם וּ/גְדֵרֹ֖ת לְ/צֹנַאֲ/כֶ֑ם וְ/הַ/יֹּצֵ֥א מִ/פִּי/כֶ֖ם תַּעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: fr
  text: Construisez pour vous des villes pour vos enfants et des enclos pour votre petit bétail[a] ; faites ce qui est sorti de votre bouche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour vos troupeaux ». Le terme hébreu désigne collectivement surtout les moutons et les chèvres.
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire : « accomplissez ce que vous avez promis ». L’hébreu dit littéralement : « faites ce qui est sorti de votre bouche ».'
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּנוּ לָכֶם
  choice: Construisez-vous
  rationale: L’impératif pluriel de בנה commande de bâtir, et le pronom suffixé à לְ exprime ici l’intérêt des destinataires. « Construisez-vous » restitue cette force de manière concise et naturelle.
- source_word: עָרִים
  choice: des villes
  rationale: עִיר peut désigner une ville ou une localité. « Villes » est le terme usuel dans ce contexte d’établissement.
- source_word: לְטַפְּכֶם
  choice: pour vos enfants
  rationale: טַף désigne les jeunes enfants, parfois envisagés avec les membres vulnérables du foyer. « Enfants » est naturel en français moderne et convient au contraste contextuel avec les hommes aptes au combat.
- source_word: וּגְדֵרֹת
  choice: et des enclos
  rationale: גְּדֵרוֹת désigne des espaces entourés ou clôturés. « Enclos » convient précisément à l’usage pastoral indiqué par le complément.
- source_word: לְצֹנַאֲכֶם
  choice: pour votre petit bétail
  rationale: צֹאן est un collectif qui vise surtout les moutons et les chèvres. « Petit bétail » est plus précis que « troupeaux », qui peut inclure les bovins.
- source_word: וְהַיֹּצֵא מִפִּיכֶם
  choice: puis faites ce qui est sorti de votre bouche
  rationale: Le participe substantivé désigne littéralement « ce qui est sorti », suivi de « votre bouche ». La formulation conserve l’image hébraïque et son sens idiomatique d’engagement verbal.
- source_word: תַּעֲשׂוּ
  choice: faites
  rationale: עשה signifie couramment « faire ». Ici, il appelle les destinataires à mettre à exécution leur parole sans expliciter davantage que l’hébreu.
theological_decisions:
- issue: Portée de la parole donnée
  choice: Conserver l’expression « ce qui est sorti de votre bouche »
  alternative: « tenez votre promesse » ou « accomplissez ce que vous avez promis »
  rationale: Le contexte implique une promesse, mais le texte hébreu emploie une image plus large portant sur la parole prononcée. La conserver évite de réduire explicitement sa portée tout en permettant une explication en note.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe impérative reste proche de l’hébreu. « Petit bétail » apporte la précision pastorale nécessaire, tandis que l’idiome de la bouche est conservé dans le texte et éclairé en note.
