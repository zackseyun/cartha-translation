  text: וְ/אֶת נְב֞וֹ וְ/אֶת בַּ֧עַל מְע֛וֹן מֽוּסַבֹּ֥ת שֵׁ֖ם וְ/אֶת שִׂבְמָ֑ה וַ/יִּקְרְא֣וּ בְ/שֵׁמֹ֔ת אֶת שְׁמ֥וֹת הֶ/עָרִ֖ים אֲשֶׁ֥ר בָּנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: fr
  text: ainsi que Nebo[a], Baal-Meôn (dont les noms furent changés), et Sibma. Ils donnèrent des noms aux villes qu’ils bâtirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des noms changés » ou « dont on avait changé les noms ». L’expression hébraïque indique probablement que Nebo et Baal-Meôn portaient des noms modifiés.
    reason: alternative lexicale
lexical_decisions:
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nom de lieu translittéré selon l’usage français courant.
- source_word: בַּעַל מְעוֹן
  choice: Baal-Meôn
  rationale: Nom de lieu composé, translittéré avec un trait d’union et un accent circonflexe pour guider la prononciation française.
- source_word: מוּסַבֹּת שֵׁם
  choice: dont les noms furent changés
  rationale: Le participe passif pluriel exprime vraisemblablement le changement des noms de Nebo et de Baal-Meôn; la relative française conserve ce sens sans identifier les nouveaux noms.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Translittération française simple du nom de lieu.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: Ils donnèrent des noms
  rationale: Formulation française idiomatique qui rend l’acte d’attribuer des noms.
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: aux villes
  rationale: Complément naturel de « donnèrent des noms »; le contenu littéral « les noms des villes » demeure implicite dans cette construction.
- source_word: אֲשֶׁר בָּנוּ
  choice: qu’ils avaient bâties
  rationale: Le plus-que-parfait exprime naturellement en français que la construction précède l’attribution des noms; « bâtir » conserve le sens ordinaire de בנה sans imposer « rebâtir ».
