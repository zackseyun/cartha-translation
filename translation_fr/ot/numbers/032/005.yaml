  text: וַ/יֹּאמְר֗וּ אִם מָצָ֤אנוּ חֵן֙ בְּ/עֵינֶ֔י/ךָ יֻתַּ֞ן אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לַ/עֲבָדֶ֖י/ךָ לַ/אֲחֻזָּ֑ה אַל תַּעֲבִרֵ֖/נוּ אֶת הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: fr
  text: 'Ils dirent : « Si nous avons trouvé grâce à tes yeux, que ce pays soit donné à tes serviteurs en propriété. Ne nous fais pas traverser le Jourdain[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne nous fais pas passer le Jourdain. » Le verbe hébreu est à la forme causative et peut être rendu par plusieurs formulations françaises proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: si nous avons trouvé grâce à tes yeux
  rationale: Cette tournure conserve l’image de l’expression hébraïque tout en restant claire en français actuel ; dans ce contexte, « grâce » désigne l’accueil favorable de la demande.
- source_word: יֻתַּן
  choice: que ... soit donné
  rationale: Le passif à valeur de souhait ou de requête polie est rendu directement, sans transformer la formulation en impératif explicite.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Dans ce contexte territorial, « pays » est une traduction naturelle de אֶרֶץ et convient mieux que « terre », qui pourrait évoquer le sol.
- source_word: לַעֲבָדֶיךָ
  choice: à tes serviteurs
  rationale: Le terme sert ici d’auto-désignation respectueuse dans une requête adressée à Moïse ; « serviteurs » restitue ce registre sans suggérer à tort que l’accent porte sur l’esclavage.
- source_word: לַאֲחֻזָּה
  choice: comme propriété
  rationale: אֲחֻזָּה désigne un bien foncier détenu durablement. « Comme propriété » exprime ce statut sans introduire explicitement la notion distincte d’héritage.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: Ne nous fais pas traverser le Jourdain
  rationale: La forme causative du verbe עבר est conservée par « fais ... traverser ». L’expression française rend clairement la demande de ne pas être contraints ou conduits à franchir le fleuve.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La requête conserve sa politesse formelle et l’auto-désignation déférente « tes serviteurs ». Le marqueur de note est placé après la proposition qu’il explique.
