id: NUM.32.21
reference: Numbers 32:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: fr
  text: et que tout homme armé parmi vous traverse le Jourdain devant Yahweh, jusqu’à ce qu’il ait chassé ses ennemis de devant lui[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi être traduit par « dépossédé ». Les pronoms dans « il ait chassé ses ennemis de devant lui » renvoient le plus naturellement à Yahweh; certains les rapportent toutefois à Israël ou à ses hommes armés.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: et que… traverse
  rationale: Dans la condition commencée au verset précédent, le parfait avec waw a une valeur prospective. La tournure française au subjonctif exprime naturellement la condition posée.
- source_word: לָכֶם כָּל חָלוּץ
  choice: tout homme armé parmi vous
  rationale: לָכֶם marque ici l’appartenance au groupe interpellé, tandis que חָלוּץ désigne un homme équipé pour le combat. Cette formulation conserve la valeur distributive de כָּל.
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Forme géographique française usuelle; l’ajout de « fleuve » n’est pas nécessaire.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime la présence ou la position devant quelqu’un. « Yahweh » rend directement le nom divin יהוה.
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Introduit la limite temporelle de l’action et appelle naturellement le subjonctif en français.
- source_word: הוֹרִישׁוֹ
  choice: il ait chassé
  rationale: Le hiphil de ירשׁ peut signifier chasser ou déposséder. « Chasser » est clair et naturel dans ce contexte militaire, sans exclure l’idée de dépossession.
- source_word: אֹיְבָיו
  choice: ses ennemis
  rationale: Le suffixe masculin singulier est conservé, de même que son lien avec le sujet de הוֹרִישׁוֹ.
- source_word: מִפָּנָיו
  choice: de devant lui
  rationale: Rend de près l’expression hébraïque « loin de sa face/présence » et préserve l’écho avec לִפְנֵי.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve ici le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Référent des pronoms masculins singuliers dans הוֹרִישׁוֹ, אֹיְבָיו et מִפָּנָיו
  choice: Les pronoms renvoient le plus naturellement à Yahweh.
  alternative: Ils peuvent être rapportés collectivement à Israël ou à sa force armée.
  rationale: L’antécédent masculin singulier explicite le plus proche est Yahweh, et l’idée que Yahweh chasse les ennemis correspond au langage de la conquête dans le Pentateuque. L’autre lecture demeure grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe dépend de la condition commencée au verset 20. La formulation maintient la chaîne pronominale ambiguë de l’hébreu tout en indiquant en note son référent le plus probable.
