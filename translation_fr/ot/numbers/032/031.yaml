id: NUM.32.31
reference: Numbers 32:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: fr
  text: 'Les fils de Gad et les fils de Ruben répondirent : « Nous ferons ce que Yahweh a dit à tes serviteurs. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: répondirent
  rationale: Dans ce récit, le verbe ענה introduit une réplique. Le passé simple convient au registre narratif français et exprime directement l’action.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: les fils de Gad et les fils de Ruben
  rationale: Cette formulation conserve la double construction filiale explicite du texte hébreu, sans la remplacer par des gentilés.
- source_word: לֵאמֹר
  choice: ponctuation introduisant le discours direct
  rationale: Après « répondirent », traduire littéralement par « en disant » serait lourd en français. Les deux-points remplissent naturellement la fonction d’introduction du discours.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: ce que…
  rationale: La construction corrélative désigne le contenu de la parole qui sera mis en pratique. « Nous ferons ce que… » restitue ce rapport clairement et naturellement.
- source_word: דִּבֶּר
  choice: a dit
  rationale: Le parfait renvoie à la parole divine prononcée précédemment et toujours pertinente. Le passé composé est naturel en français moderne; « a parlé » serait possible, mais moins idiomatique avec ce complément.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé comme nom propre plutôt que remplacé par un titre.
- source_word: אֶל עֲבָדֶיךָ
  choice: à tes serviteurs
  rationale: עֶבֶד sert ici d’auto-désignation respectueuse adressée à Moïse. « Serviteurs » préserve cette déférence sans imposer le sens plus étroit d’« esclaves ».
- source_word: נַעֲשֶׂה
  choice: nous ferons
  rationale: Le verbe עשה exprime directement la mise en œuvre de ce qui a été commandé. Le futur français rend l’engagement des locuteurs sans ajouter d’objet absent de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme comme nom propre. « Yahweh » le préserve, tandis que « le Seigneur » lui substituerait un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le style narratif biblique sans archaïsme marqué. La formulation idiomatique omet le calque « en disant » tout en conservant intégralement le contenu et la relation entre parole et action.
