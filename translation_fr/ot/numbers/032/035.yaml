  yaml_path: translation/ot/numbers/032/035.yaml
  text: and Atroth-shophan[a], and Jazer, and Jogbehah.
translation:
  language: fr
  text: Et Atroth-Shophân[a], Yazer et Yogbeha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ataroth-Shophân ». Il s’agit d’un nom de lieu composé, dont la translittération peut varier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: ainsi que
  rationale: La conjonction וְ relie ce dernier groupe de villes à la liste commencée au verset précédent; « ainsi que » rend ce lien naturellement en français. La particule אֶת, marqueur de l’objet direct, n’a pas d’équivalent explicite en français.
- source_word: עַטְרֹת שׁוֹפָן
  choice: Ataroth-Shofân
  rationale: Nom de lieu composé, translittéré plutôt que traduit. « Ataroth » représente distinctement la forme hébraïque עַטְרֹת, et « Shofân » adapte שׁוֹפָן aux conventions graphiques françaises.
- source_word: יַעְזֵר
  choice: Yazer
  rationale: Translittération française naturelle du nom de lieu hébreu, avec Y pour le yod initial et z pour le son consonantique central.
- source_word: יָגְבֳּהָה
  choice: Yogbeha
  rationale: Translittération adaptée au français qui conserve l’identité du lieu sans maintenir un h final muet ne correspondant pas ici à une consonne prononcée.
theological_decisions: []
translation_notes:
  register: Formulation brève et digne, adaptée à la continuation d’une liste. Les noms propres suivent des conventions de translittération françaises modernes; la ponctuation finale respecte la syntaxe française.
