source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: fr
  text: Ils montèrent jusqu’à la vallée d’Eshkol et virent le pays, et ils découragèrent les Israélites[a] d’entrer dans le pays que Yahvé[b] leur avait donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël ». Cette expression hébraïque désigne couramment le peuple d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Ils montèrent
  rationale: Le verbe עלה exprime un mouvement vers le haut; « montèrent » est naturel en français et conserve cette orientation.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: jusqu’à la vallée d’Eshkol
  rationale: נחל peut désigner un ravin, un oued ou sa vallée. « vallée » est clair pour un large lectorat, tandis que « jusqu’à » rend עַד.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: et virent le pays
  rationale: ראה signifie simplement « voir ». « Le pays » convient ici au territoire observé et garde la sobriété de l’hébreu.
- source_word: וַיָּנִיאוּ אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: puis ils découragèrent les Israélites
  rationale: Le hiphil de נוא exprime ici le fait de détourner ou de décourager. L’expression littérale concernant le « cœur » désigne la résolution collective; la formulation française choisie en communique naturellement le sens sans ajouter une répétition lourde.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: d’entrer dans le pays
  rationale: לְבִלְתִּי suivi de l’infinitif exprime l’empêchement ou le résultat négatif. Après « décourager », « d’entrer » rend clairement l’effet visé.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: que … leur avait donné
  rationale: Le plus-que-parfait convient au regard rétrospectif du récit et rend l’accompli hébreu sans suggérer que le don était encore en cours.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin YHWH et conserve ici le nom propre présent dans le texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahvé » préserve le nom divin, tandis que « le SEIGNEUR » refléterait la tradition de substitution liturgique.
- issue: Portée de אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: ils découragèrent les Israélites
  alternative: ils détournèrent le cœur des fils d’Israël
  rationale: Le « cœur » singulier représente collectivement le courage ou la résolution du peuple. Le français idiomatique exprime cet effet par « décourager », sans trancher davantage sur le mécanisme intérieur évoqué.
translation_notes:
  register: Français international moderne, fluide et digne. « Israélites » évite le calque peu naturel « fils d’Israël », expliqué en note. « Puis » rend la succession narrative marquée par ו sans introduire l’opposition absente de l’hébreu.
