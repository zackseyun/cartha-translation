  text: וַ/יִּבְנ֣וּ בְנֵי גָ֔ד אֶת דִּיבֹ֖ן וְ/אֶת עֲטָרֹ֑ת וְ/אֵ֖ת עֲרֹעֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/034.yaml
  text: The sons of Gad built Dibon[a], Ataroth[b], and Aroer.
translation:
  language: fr
  text: Les fils de Gad[b] construisirent Dibôn[a], Ataroth et Aroër.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconstruisirent » ou « fortifièrent », selon le contexte ; le verbe hébreu signifie simplement « bâtir » ou « construire ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « fils de Gad », c’est-à-dire des membres de la tribu de Gad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: construisirent
  rationale: Le verbe בנה exprime simplement l’action de bâtir. Dans ce contexte, « reconstruisirent » ou « fortifièrent » est possible par inférence, mais cette nuance n’est pas imposée par l’hébreu.
- source_word: בְנֵי גָד
  choice: Les fils de Gad
  rationale: Cette traduction conserve l’expression de parenté hébraïque, qui désigne ici les membres de la tribu de Gad, tout en restant claire en français.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct sans équivalent lexical autonome en français; sa fonction est rendue par la syntaxe.
- source_word: דִּיבֹן
  choice: Dibôn
  rationale: Nom de lieu translittéré selon l’usage biblique français courant.
- source_word: עֲטָרֹת
  choice: Ataroth
  rationale: Nom de lieu translittéré selon l’usage biblique français courant.
- source_word: עֲרֹעֵר
  choice: Aroër
  rationale: Nom de lieu translittéré selon l’usage biblique français courant.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le passé simple convient au registre narratif biblique. L’expression littérale « les fils de Gad » est conservée; elle désigne ici les membres de la tribu de Gad. Les graphies Dibôn et Aroër utilisent les signes diacritiques usuels en français.
