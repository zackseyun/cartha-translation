source:
  edition: WLC
  text: וְ/נֹ֣בַח הָלַ֔ךְ וַ/יִּלְכֹּ֥ד אֶת קְנָ֖ת וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יִּקְרָ֧א לָ֦/ה נֹ֖בַח בִּ/שְׁמֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: fr
  text: 'Nobah partit, s’empara de Qenath et des localités qui en dépendaient[a], puis lui donna son propre nom : Nobah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « ses filles »; expression désignant les petites localités rattachées à Qenath.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: Nobah
  rationale: Nom propre de personne, translittéré selon une forme française usuelle; sa répétition à la fin est conservée comme nom donné à la ville.
- source_word: הָלַךְ
  choice: partit
  rationale: Dans cette séquence narrative, le verbe exprime le déplacement de Nobah vers son objectif; « partit » est naturel en français sans ajouter de précision absente de l’hébreu.
- source_word: וַיִּלְכֹּד
  choice: s’empara de
  rationale: Dans un contexte militaire, לכד signifie prendre ou capturer une ville; « s’empara de » convient idiomatiquement à une cité.
- source_word: קְנָת
  choice: Qenath
  rationale: Nom de lieu translittéré; le q rend distinctement la consonne hébraïque initiale ק.
- source_word: בְּנֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Littéralement « ses filles »; l’expression désigne les petites localités rattachées à la ville principale. Cette formulation française communique le rapport de dépendance sans limiter indûment leur taille ou leur statut.
- source_word: וַיִּקְרָא לָהּ
  choice: puis lui donna … le nom
  rationale: La construction קרא + ל exprime ici l’attribution d’un nom. « Lui donna … le nom » est naturel en français et maintient Qenath comme référent grammatical.
- source_word: בִּשְׁמוֹ
  choice: son propre nom
  rationale: La formule indique que la ville reçoit le nom de Nobah lui-même; « propre » lève naturellement l’ambiguïté possible du possessif français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est rendue par « puis » pour une progression naturelle. La ponctuation finale met en relief l’identité entre le nom de l’homme et celui donné à la ville.
