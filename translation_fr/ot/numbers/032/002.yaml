  yaml_path: translation/ot/numbers/032/002.yaml
  text: Then the sons of Gad and the sons of Reuben came and spoke to Moses, to Eleazar the priest, and to the leaders of the congregation, saying,
translation:
  language: fr
  text: 'Les descendants de Gad et les descendants de Ruben vinrent trouver Moïse, le prêtre Éléazar et les chefs de la communauté, et leur dirent :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: descendants
  rationale: Dans ce contexte tribal, le terme désigne les membres issus de Gad et de Ruben plutôt que leurs fils immédiats ; « descendants » est naturel et précis en français moderne.
- source_word: נְשִׂיאֵי
  choice: chefs
  rationale: Le mot désigne ici les principaux responsables de la communauté ; « chefs » conserve l’idée d’autorité sans lui donner une coloration institutionnelle étrangère au texte.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: Le terme renvoie à la collectivité d’Israël réunie ou représentée ; « communauté » convient au contexte et reste accessible.
- source_word: לֵאמֹר
  choice: 'et leur dirent :'
  rationale: La formule hébraïque introduit les paroles qui suivent. En français, le verbe déclaratif suivi de deux-points en rend naturellement la fonction.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition « les descendants de » maintient la structure parallèle qui distingue nettement les deux tribus. « Vinrent trouver » exprime naturellement le mouvement vers les responsables nommés.
