  text: וַ/יָּבֹ֥אוּ בְנֵֽי גָ֖ד וּ/בְנֵ֣י רְאוּבֵ֑ן וַ/יֹּאמְר֤וּ אֶל מֹשֶׁה֙ וְ/אֶל אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/אֶל נְשִׂיאֵ֥י הָ/עֵדָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
