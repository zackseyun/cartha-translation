source:
  edition: WLC
  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: fr
  text: Mais tes serviteurs traverseront, tous ceux qui sont équipés pour le combat[a], devant Yahweh[b], pour la guerre[c], comme mon seigneur le dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les hommes armés pour le combat » ; l’expression hébraïque désigne ceux qui sont équipés et prêts au service militaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « devant Yahweh » : leur participation à la campagne se déroule sous son autorité et en sa présence.'
    reason: cultural_note
  - marker: c
    text: Ou « pour le combat » ou « afin de faire la guerre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: Mais tes serviteurs
  rationale: Le nom עֶבֶד désigne ici des hommes qui parlent d’eux-mêmes avec déférence à Moïse. « Serviteurs » convient au contexte, et le waw est rendu par « mais » pour marquer le contraste avec la préoccupation précédente.
- source_word: יַעַבְרוּ
  choice: traverseront
  rationale: Dans ce contexte militaire et géographique, עבר exprime le passage vers l’autre côté, avec la traversée du Jourdain comprise dans le contexte.
- source_word: כָּל חֲלוּץ צָבָא
  choice: tous ceux qui sont équipés pour le combat
  rationale: כָּל avec חֲלוּץ a une portée distributive, tandis que חֲלוּץ צָבָא désigne ceux qui sont équipés et prêts au service militaire. Cette formulation française est naturelle et ne précise pas davantage que l’hébreu le type exact d’équipement.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי conserve l’idée d’agir devant ou en présence de Dieu, et le tétragramme est transcrit « Yahweh » comme nom divin.
- source_word: לַמִּלְחָמָה
  choice: pour la guerre
  rationale: La préposition ל exprime ici la destination ou le but de la mobilisation. « Pour la guerre » garde le substantif hébreu et la portée militaire générale.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: comme mon seigneur l’a dit
  rationale: אֲדֹנִי est une adresse respectueuse à Moïse, distincte du nom divin. Le participe דֹּבֵר renvoie à la parole que Moïse vient de prononcer; le passé composé est idiomatique en français dans ce contexte immédiat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre révélé sans le remplacer par un titre.
- issue: Sens de לִפְנֵי יְהוָה dans la campagne militaire
  choice: devant Yahweh
  alternative: en présence de Yahweh
  rationale: « Devant » préserve la formulation spatiale et relationnelle de l’hébreu sans décider si l’accent porte principalement sur la présence, l’autorité ou la conduite divine.
- issue: Référent de אֲדֹנִי
  choice: mon seigneur
  alternative: mon maître
  rationale: Le titre vise ici Moïse et exprime la déférence humaine; la minuscule le distingue clairement du nom divin.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement et « mon seigneur » conservent la relation de déférence envers Moïse. La syntaxe reste proche de l’hébreu tout en évitant une tournure française artificielle.
