source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַעֲשׂוּ/ן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַ/יהוָ֑ה וּ/דְעוּ֙ חַטַּאתְ/כֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: fr
  text: Mais si vous n’agissez pas ainsi, vous aurez bel et bien péché contre Yahweh. Sachez que votre péché vous rattrapera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre péché vous trouvera » ou « votre culpabilité vous atteindra ». L’expression hébraïque personnifie le péché et évoque une conséquence inévitable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition en contraste avec l’engagement exigé dans le contexte précédent.
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: vous n’agissez pas ainsi
  rationale: Renvoie naturellement en français à ce que les interlocuteurs se sont engagés à faire.
- source_word: הִנֵּה חֲטָאתֶם לַיהוָה
  choice: vous pécherez contre Yahweh
  rationale: Dans cette condition prospective, le parfait hébreu présente comme certain le résultat d’un manquement. La tournure française au futur l’exprime clairement; הִנֵּה renforce cette certitude sans nécessiter un calque tel que « voici ».
- source_word: וּדְעוּ
  choice: Sachez alors
  rationale: Conserve l’impératif pluriel et rend explicitement le lien conséquentiel naturel dans cet avertissement.
- source_word: חַטַּאתְכֶם
  choice: votre péché
  rationale: Préserve le sens moral direct du nom, tout en laissant la note signaler la nuance possible de culpabilité.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: vous rattrapera
  rationale: Expression française idiomatique qui personnifie le péché comme en hébreu et communique l’inéluctabilité de ses conséquences.
- source_word: יהוה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel employé dans le texte hébreu.
theological_decisions:
- issue: Portée de l’image selon laquelle le péché « trouve » les coupables
  choice: votre péché vous rattrapera
  alternative: votre péché vous trouvera; votre culpabilité retombera sur vous
  rationale: Le texte personnifie le péché sans préciser si l’accent porte surtout sur sa découverte, la culpabilité ou ses conséquences. « Vous rattrapera » conserve l’image et son caractère inéluctable sans réduire la formule à une seule de ces dimensions.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération préserve le nom propre présent dans le texte source et suit la décision doctrinale fournie.
translation_notes:
  register: Français international moderne, direct et solennel. « Vous rattrapera » est courant sans être familier; la syntaxe brève conserve la force de l’avertissement.
