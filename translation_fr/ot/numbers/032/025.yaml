  text: וַ/יֹּ֤אמֶר בְּנֵי גָד֙ וּ/בְנֵ֣י רְאוּבֵ֔ן אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר עֲבָדֶ֣י/ךָ יַעֲשׂ֔וּ כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י מְצַוֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: fr
  text: 'Les descendants de Gad et les descendants de Ruben dirent à Moïse : « Tes serviteurs feront ce que mon seigneur ordonne. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: les descendants de Gad et les descendants de Ruben
  rationale: Dans ce contexte tribal, בְּנֵי désigne les membres issus de Gad et de Ruben plutôt que leurs fils immédiats.
- source_word: לֵאמֹר
  choice: non rendu séparément
  rationale: Après « dirent », l’infinitif hébreu introduit la citation; le reproduire par « en disant » serait lourd et peu naturel en français moderne.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Conserve la formule de déférence par laquelle les locuteurs se désignent devant Moïse.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Titre respectueux adressé ici à Moïse, avec la première personne du singulier telle qu’elle figure dans le texte hébreu.
- source_word: מְצַוֶּה
  choice: ordonne
  rationale: Exprime directement l’idée d’un commandement donné par une autorité humaine.
theological_decisions:
- issue: Identité du « seigneur »
  choice: « mon seigneur » en minuscules, référé à Moïse
  alternative: « le Seigneur », compris comme un titre divin
  rationale: Le contexte syntaxique et narratif présente Moïse comme l’interlocuteur; אֲדֹנִי est ici une adresse honorifique humaine, non le nom divin.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « les descendants de… et les descendants de… » conserve la structure emphatique des deux groupes tribaux; la formule de politesse reste formelle sans archaïsme excessif.
