source:
  edition: WLC
  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: fr
  text: Aucun des hommes qui sont montés d’Égypte[a], âgés de vingt ans et plus, ne verra le pays que j’ai juré de donner à Abraham, à Isaac et à Jacob, car ils ne m’ont pas suivi pleinement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement une formule de serment avec « si » : « si les hommes… voient le pays », ce qui implique une forte négation : « aucun… ne verra ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils ne m’ont pas suivi entièrement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Aucun ... ne verra
  rationale: Dans cette formule de serment elliptique, אִם implique une forte négation. La tournure française exprime clairement ce sens sans conserver un « si » trompeur.
- source_word: יִרְאוּ
  choice: ne verra
  rationale: ראה signifie ici « voir », avec la portée contextuelle de connaître le pays ou d’y entrer, sans qu’il soit nécessaire d’expliciter cette nuance dans le texte.
- source_word: הָאֲנָשִׁים
  choice: des hommes
  rationale: Le nom hébreu est explicitement masculin pluriel et s’inscrit dans le contexte des hommes recensés à partir de vingt ans.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: qui sont montés d’Égypte
  rationale: Cette traduction conserve l’idiome biblique de la montée depuis l’Égypte tout en restant naturelle en français.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: La formulation restitue le seuil d’âge inclusif exprimé par l’hébreu.
- source_word: הָאֲדָמָה
  choice: le pays
  rationale: Dans ce contexte d’alliance, אֲדָמָה désigne le territoire promis plutôt que le sol matériel.
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai juré de donner
  rationale: Le verbe exprime le serment divin. « de donner » explicite en français la relation entre le serment et les destinataires introduits par לְ, implicite mais claire dans l’hébreu et le contexte.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: à Abraham, à Isaac et à Jacob
  rationale: La répétition de « à » reproduit la cadence solennelle des prépositions hébraïques.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison du jugement prononcé dans le serment.
- source_word: לֹא מִלְאוּ אַחֲרָי
  choice: ils ne m’ont pas suivi pleinement
  rationale: Cette formulation conserve l’image relationnelle de « suivre » et rend la valeur adverbiale de l’idiome מלא אחרי.
theological_decisions:
- issue: Formule de serment introduite par אִם
  choice: Aucun des hommes ... ne verra
  alternative: Si les hommes ... voient
  rationale: L’hébreu emploie une formule de serment elliptique dont la force est négative. Une traduction littérale avec « si » masquerait le jugement solennel exprimé.
- issue: Portée de l’expression לֹא מִלְאוּ אַחֲרָי
  choice: ils ne m’ont pas suivi pleinement
  alternative: ils ne m’ont pas été entièrement fidèles
  rationale: Le choix retenu préserve l’image hébraïque de la marche à la suite de Dieu et évite d’élargir l’expression à une notion abstraite de fidélité.
- issue: Objet du serment fait aux patriarches
  choice: le pays que j’ai juré de donner à Abraham, à Isaac et à Jacob
  alternative: le pays que j’ai juré à Abraham, à Isaac et à Jacob
  rationale: L’ajout de « donner » rend idiomatiquement en français la construction hébraïque et son complément implicite, sans modifier le contenu de la promesse.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité du serment, l’idiome de la montée d’Égypte et l’image de suivre Dieu, tout en explicitant seulement ce qui est nécessaire à une syntaxe française naturelle.
