source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: fr
  text: 'Moïse leur dit : « Si tous les hommes armés des fils de Gad et des fils de Ruben traversent avec vous le Jourdain pour le combat devant Yahweh, et que le pays soit soumis devant vous, alors vous leur donnerez le pays de Galaad en propriété. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Moïse leur dit
  rationale: Le passé simple rend naturellement en français soutenu le wayyiqtol narratif, sans ajouter une nuance temporelle absente du texte.
- source_word: אִם
  choice: Si ... et si
  rationale: La conjonction introduit une condition réelle. La répétition de « si » devant le second élément rend claire en français la portée conditionnelle de l’ensemble.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: les fils de Gad et les fils de Ruben
  rationale: Cette formulation conserve l’expression tribale de parenté du texte hébreu, tout en restant intelligible en français.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: traversent ... le Jourdain
  rationale: « Traverser le Jourdain » est l’expression française naturelle correspondant au verbe עבר avec ce complément direct.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: Rend directement l’idée d’accompagnement sans explicitation superflue.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: tous équipés pour le combat
  rationale: חָלוּץ désigne ici ceux qui sont équipés et prêts au combat. Le pluriel « tous équipés » se rattache naturellement aux fils de Gad et de Ruben sans introduire explicitement un nom absent de l’hébreu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve l’expression spatiale et théologique hébraïque; le nom divin est translittéré comme nom propre.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: et si le pays est soumis
  rationale: Le nifal de כבש exprime le fait d’être soumis ou placé sous domination. La voix passive et le résultat sont préservés.
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: La traduction maintient l’idiome hébreu et son rapport à l’avancée d’Israël, sans le réduire à « par vous ».
- source_word: וּנְתַתֶּם לָהֶם
  choice: alors vous leur donnerez
  rationale: « Alors » marque clairement l’apodose en français; le futur traduit l’instruction conditionnelle adressée aux responsables.
- source_word: אֶרֶץ הַגִּלְעָד לַאֲחֻזָּה
  choice: le pays de Galaad comme propriété
  rationale: « Pays de Galaad » est la désignation géographique courante; « comme propriété » rend l’idée d’une possession foncière durable associée à אֲחֻזָּה.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de לִפְנֵי dans les expressions « devant Yahweh » et « devant vous »
  choice: Conserver « devant » dans les deux cas
  alternative: Interpréter « devant Yahweh » comme « sous le regard de Yahweh » et « devant vous » comme « par vous »
  rationale: La répétition lexicale de l’hébreu est significative. La conserver évite de résoudre silencieusement la relation entre présence divine, marche militaire et soumission du pays.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au récit biblique écrit. La syntaxe conditionnelle a été légèrement explicitée par « et si » puis « alors », sans modifier les rapports logiques du texte.
