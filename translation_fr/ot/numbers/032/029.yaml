  to: 'Moïse leur dit : « Si tous les hommes armés des fils de Gad et des fils de Ruben traversent avec vous le Jourdain pour le combat devant Yahweh, et que le pays soit soumis devant vous, alors vous leur donnerez le pays de Galaad en propriété. »'
  rationale: La révision explicite la portée collective et militaire de כָּל חָלוּץ sans modifier la condition ni ajouter d’interprétation confessionnelle. « En propriété » est une formulation française naturelle pour l’octroi durable exprimé par לַאֲחֻזָּה. La répétition de « devant » conserve volontairement l’ambiguïté des expressions לִפְנֵי יהוה et לִפְנֵיכֶם.
