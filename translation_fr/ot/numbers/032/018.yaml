source:
  edition: WLC
  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: fr
  text: Nous ne retournerons pas chez nous jusqu’à ce que chacun des fils d’Israël ait pris possession de son héritage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: nous ne retournerons pas
  rationale: Le qal inaccompli à la première personne du pluriel exprime ici un engagement portant sur l’avenir; le futur simple est naturel en français.
- source_word: אֶל בָּתֵּינוּ
  choice: chez nous
  rationale: Bien que le mot hébreu désigne littéralement « nos maisons », « retourner chez nous » est l’expression française naturelle et conserve l’idée du domicile.
- source_word: עַד
  choice: avant que
  rationale: Dans une proposition négative, « ne… pas avant que » rend naturellement la limite temporelle exprimée par עַד.
- source_word: הִתְנַחֵל
  choice: aient pris possession
  rationale: Le hitpael de נחל désigne ici l’entrée en possession de la part de territoire attribuée; le subjonctif passé convient après « avant que » et présente l’action comme accomplie avant le retour.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale masculine du texte hébreu; l’équivalent idiomatique « les Israélites » est signalé en note.
- source_word: אִישׁ נַחֲלָתוֹ
  choice: chacun, de son héritage
  rationale: אִישׁ a ici une valeur distributive, rendue par « chacun »; « son héritage » conserve le langage de la part territoriale transmise ou attribuée.
theological_decisions:
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal préserve l’image généalogique et la forme masculine de l’hébreu sans en élargir ou en restreindre silencieusement la portée; la note donne l’équivalent collectif courant.
- issue: Sens territorial de נַחֲלָתוֹ
  choice: son héritage
  alternative: la part de territoire qui lui revient
  rationale: « Héritage » maintient le vocabulaire théologique et juridique du partage du pays, tandis que le verbe « prendre possession » rend explicite la dimension territoriale dans ce contexte.
translation_notes:
  register: Français international moderne, digne et accessible. « Chez nous » évite la raideur de « vers nos maisons », tandis que « les fils d’Israël » et « héritage » préservent les traits saillants de l’hébreu.
