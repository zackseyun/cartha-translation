source:
  edition: WLC
  text: וְ/אִם לֹ֧א יַֽעַבְר֛וּ חֲלוּצִ֖ים אִתְּ/כֶ֑ם וְ/נֹֽאחֲז֥וּ בְ/תֹכְ/כֶ֖ם בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: fr
  text: Mais s’ils ne traversent pas avec vous en armes, alors ils recevront une possession[a] parmi vous, dans le pays de Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors ils seront établis parmi vous dans le pays de Canaan ». Le verbe hébreu peut désigner le fait d’être établi dans une possession, et non seulement celui de la recevoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Mais s’ils
  rationale: La conjonction introduit l’éventualité opposée à celle du verset précédent ; « Mais » rend naturellement ce contraste en français.
- source_word: לֹא יַעַבְרוּ
  choice: ne traversent pas
  rationale: Le verbe עבר désigne ici la traversée vers Canaan, dans le contexte géographique du passage du Jourdain.
- source_word: חֲלוּצִים
  choice: en armes
  rationale: Le terme décrit des hommes équipés et prêts pour le combat ; « en armes » est concis, naturel et conserve la portée militaire.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: Cette expression marque simplement l’accompagnement des autres Israélites lors de la traversée.
- source_word: וְנֹאחֲזוּ
  choice: alors ils recevront une possession
  rationale: Le niphal de אחז, dans ce contexte de partage territorial, indique qu’ils seront pourvus d’une possession ou établis dans celle-ci. La formulation retenue exprime le résultat passif sans leur attribuer indûment la conquête comme initiative propre.
- source_word: בְּתֹכְכֶם
  choice: parmi vous
  rationale: L’expression situe leur possession au sein de la communauté établie à l’ouest du Jourdain.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: dans le pays de Canaan
  rationale: Cette formulation conserve l’expression géographique complète de l’hébreu.
theological_decisions: []
