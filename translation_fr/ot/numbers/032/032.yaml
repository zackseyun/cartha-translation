  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: fr
  text: Nous-mêmes, nous traverserons en armes devant Yahweh vers le pays de Canaan, et notre propriété héréditaire sera avec nous de ce côté-ci du Jourdain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà du Jourdain » ou « de l’autre côté du Jourdain » ; l’expression hébraïque dépend du point de vue. Ici, « de ce côté-ci du Jourdain » reflète la perspective des interlocuteurs, à l’est du fleuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: Nous, nous
  rationale: Le pronom indépendant renforce le sujet déjà exprimé par le verbe; la dislocation « Nous, nous » rend cette insistance de façon naturelle en français.
- source_word: נַעֲבֹר
  choice: traverserons
  rationale: Le qal inaccompli à la première personne du pluriel exprime ici un engagement futur à franchir le Jourdain.
- source_word: חֲלוּצִים
  choice: en armes
  rationale: Dans ce contexte militaire, le terme désigne des hommes équipés et prêts au combat; « en armes » est concis et digne.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve la valeur spatiale et relationnelle de לִפְנֵי, tandis que « Yahweh » rend directement le nom divin.
- source_word: אֶרֶץ כְּנָעַן
  choice: pour entrer dans le pays de Canaan
  rationale: Après « traverser », cette formulation française explicite naturellement la destination impliquée par la syntaxe hébraïque, sans changer le sens.
- source_word: וְאִתָּנוּ אֲחֻזַּת נַחֲלָתֵנוּ
  choice: tandis que notre propriété héréditaire restera avec nous
  rationale: La proposition hébraïque est sans verbe exprimé. « Restera » convient à l'engagement futur et fait comprendre que le lot revendiqué demeure leur possession; « propriété héréditaire » restitue ensemble אֲחֻזָּה et נַחֲלָה.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: de ce côté-ci du Jourdain
  rationale: L'expression est déictique. Dans la bouche des tribus situées à l'est du fleuve et parlant de leur propre lot, « de ce côté-ci » reflète leur perspective, tout en signalant en note l'ambiguïté intrinsèque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre d'alliance sans le remplacer par un titre.
- issue: Portée de לִפְנֵי יְהוָה
  choice: devant Yahweh
  alternative: en présence de Yahweh
  rationale: La traduction retenue conserve la formulation concrète et sa possible portée religieuse et militaire, sans réduire l'expression à un simple repère géographique.
translation_notes:
  register: Français international moderne, clair et digne. L'insistance du pronom hébreu est conservée par « Nous, nous ». La phrase reste proche de la structure source tout en évitant un calque maladroit de la proposition nominale hébraïque.
