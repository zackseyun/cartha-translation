  text: Ataroth[a], Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo[b], and Beon—
translation:
  language: fr
  text: Ataroth, Dibon, Yazer, Nimra, Heshbon, Éléalé, Sebam[a], Nébo et Béôn[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu « Sebam »; ailleurs, le nom de lieu apparenté apparaît sous les formes « Sibma » ou « Shibma ».
    reason: lexical_alternative
  - marker: b
    text: Hébreu « Béôn »; ailleurs, le nom de lieu apparenté apparaît sous la forme développée « Baal-Meôn ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: Ataroth
  rationale: Nom de lieu translittéré; cette forme est bien établie en français biblique et conserve le th traditionnel pour la consonne finale.
- source_word: דִיבֹן
  choice: Dibon
  rationale: Translittération française usuelle de ce nom de lieu.
- source_word: יַעְזֵר
  choice: Yazer
  rationale: Le y initial représente naturellement le yod hébreu en français moderne; le nom est translittéré plutôt que traduit.
- source_word: נִמְרָה
  choice: Nimra
  rationale: La forme brève du toponyme présente dans ce verset est conservée, sans l’harmoniser avec Beth-Nimra attesté ailleurs.
- source_word: חֶשְׁבּוֹן
  choice: Heshbon
  rationale: Translittération qui rend visible la consonne hébraïque initiale et distingue le groupe sh; elle reste aisément lisible en français.
- source_word: אֶלְעָלֵה
  choice: Éléalé
  rationale: Forme francisée lisible, avec accents indiquant naturellement la prononciation des voyelles.
- source_word: שְׂבָם
  choice: Sebam
  rationale: Reproduit la forme particulière שׂבם du texte massorétique sans la normaliser d’après les formes apparentées Sibma ou Shibma.
- source_word: נְבוֹ
  choice: Nébo
  rationale: Forme française traditionnelle et naturelle du nom de lieu.
- source_word: בְּעֹן
  choice: Béôn
  rationale: Reproduit la forme brève présente ici, sans la remplacer par le nom apparenté et plus développé Baal-Meôn.
- source_word: וְ / וּ
  choice: virgules, puis « et » avant le dernier nom
  rationale: En français, une liste ainsi coordonnée est plus naturelle avec des virgules et une conjonction finale; la structure énumérative de l’hébreu demeure claire sans reproduire chaque waw.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les toponymes sont translittérés selon des formes lisibles en français. Les appels de note ont été placés après les noms auxquels ils se rapportent, contrairement à leur position manifestement décalée dans la couche anglaise fournie. Le tiret final est conservé, puisque le verset se poursuit syntaxiquement au verset suivant.
