  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּשָּׁבַ֖ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: fr
  text: 'La colère de Yahweh[a] s’enflamma ce jour-là, et il prêta serment :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, généralement transcrit « Yahweh » ; autre transcription : « Jéhovah ».'
    reason: Signaler la graphie hébraïque du nom divin et une autre transcription usuelle, sans présenter « Yahweh » comme une alternative au rendu déjà employé.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère … s’enflamma
  rationale: L’expression idiomatique associe חרה (« devenir brûlant, s’enflammer ») à אַף (« colère » dans ce contexte). Cette formulation conserve naturellement en français la métaphore de la chaleur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Équivalent narratif naturel et précis en français moderne.
- source_word: וַיִּשָּׁבַע
  choice: il fit ce serment
  rationale: Le niphal de שבע signifie « jurer, prêter serment ». Cette tournure introduit clairement le contenu du serment qui suit.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit les paroles du serment au verset suivant. En français, les deux-points remplissent cette fonction avec plus de naturel qu’un calque tel que « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: YHWH ou Jéhovah
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » en préserve le caractère de nom propre sans lui substituer le titre « le Seigneur ».
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore hébraïque de la colère qui devient brûlante est conservée par « s’enflamma ». Les deux-points rendent naturellement לֵאמֹר et signalent que le serment se poursuit au verset suivant.
