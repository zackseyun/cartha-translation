  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: fr
  text: Alors la colère de Yahweh s’enflamma contre Israël[a], et il les fit errer dans le désert pendant quarante ans[b], jusqu’à ce que toute la génération qui avait fait ce qui est mal aux yeux de Yahweh ait disparu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh se mit en colère contre Israël ». Litt. « le nez de Yahweh brûla » ; c’est une expression hébraïque pour dire que sa colère s’enflamma.
    reason: lexical_alternative
  - marker: b
    text: Ou « il les fit aller çà et là dans le désert ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: la colère de Yahweh s’enflamma
  rationale: Conserve l’image hébraïque d’une colère qui brûle, tout en employant une tournure française naturelle et digne.
- source_word: בְּיִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec le vocabulaire de la colère, la préposition désigne ici l’objet contre lequel celle-ci se porte.
- source_word: וַיְנִעֵם
  choice: il les fit errer
  rationale: 'Le hifil exprime une valeur causative : Yahweh les a fait errer, et non simplement accompagnés dans leur errance.'
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans le contexte de l’Exode, « désert » est le terme français courant pour l’espace inculte et peu habité désigné par מִדְבָּר.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: L’ajout idiomatique de « pendant » exprime clairement la durée en français.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: jusqu’à ce que toute la génération … ait disparu
  rationale: תֹּם indique l’achèvement ou l’extinction complète; « ait disparu » communique naturellement ici que la génération entière est arrivée à son terme.
- source_word: הָעֹשֶׂה הָרַע
  choice: qui avait fait ce qui est mal
  rationale: Le participe qualifie collectivement la génération. Le plus-que-parfait situe ses actes mauvais avant l’achèvement du jugement.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette expression conserve l’image hébraïque tout en restant idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Représentation de la colère divine
  choice: la colère de Yahweh s’enflamma contre Israël
  alternative: Yahweh se mit en colère contre Israël
  rationale: La formulation retenue préserve l’image forte de la colère qui brûle sans l’expliquer ni l’atténuer.
- issue: Agent de l’errance au désert
  choice: il les fit errer
  alternative: ils errèrent
  rationale: La forme verbale causative attribue explicitement à Yahweh l’action de faire errer Israël; cette tension théologique est maintenue.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste naturelle tout en conservant l’image de la colère qui s’enflamme, le nom divin Yahweh et la valeur causative du verbe décrivant l’errance.
