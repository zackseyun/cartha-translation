  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: fr
  text: Moïse donna Galaad à Makir, fils de Manassé, et il s’y établit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Dans ce récit d’attribution territoriale, נתן garde son sens simple de « donner » ; « attribuer » ajouterait une nuance administrative inutile.
- source_word: הַגִּלְעָד
  choice: Galaad
  rationale: Galaad est la forme française traditionnelle et naturelle du nom de lieu ; l’article hébreu ne se rend normalement pas devant ce nom propre.
- source_word: לְמָכִיר
  choice: à Makir
  rationale: La préposition לְ marque ici le destinataire ; « à Makir » est direct et idiomatique.
- source_word: בֶּן מְנַשֶּׁה
  choice: fils de Manassé
  rationale: בֵּן signifie naturellement « fils » dans cette indication généalogique ; le contexte n’impose pas l’élargissement « descendant ».
- source_word: וַיֵּשֶׁב
  choice: s’établit
  rationale: Dans le contexte de la prise de possession d’un territoire, ישב désigne naturellement l’installation durable ; « s’établit » exprime cette valeur sans surinterprétation.
- source_word: בָּהּ
  choice: s’y
  rationale: Le suffixe féminin renvoie à Galaad comme territoire ; le pronom adverbial « y » est la tournure française la plus naturelle.
