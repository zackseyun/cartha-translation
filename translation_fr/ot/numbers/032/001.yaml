base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: fr
  text: Les fils de Ruben et les fils de Gad possédaient des troupeaux extrêmement nombreux[a], et ils virent le pays de Yazer et le pays de Galaad ; et voici que le lieu était un lieu pour les troupeaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Les Rubénites et les Gadites avaient du bétail en très grande abondance ». L’hébreu dit littéralement « les fils de Ruben et les fils de Gad ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le lieu était un lieu pour les troupeaux ». L’hébreu répète « lieu » pour souligner que l’endroit convenait au bétail.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: des troupeaux extrêmement nombreux
  rationale: מִקְנֶה désigne collectivement le bétail ou les troupeaux, considérés comme biens mobiliers. « Des troupeaux » est naturel en français et convient à la reprise finale; « extrêmement nombreux » restitue l’abondance fortement soulignée par רַב et עָצוּם מְאֹד.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: les fils de Ruben et les fils de Gad
  rationale: La formulation conserve la répétition et la transparence de l’hébreu. Dans ce contexte, « fils » désigne les membres ou descendants des tribus correspondantes; « Rubénites et Gadites » reste une solution plus idiomatique signalée en note.
- source_word: וַיִּרְאוּ
  choice: Ils virent
  rationale: Le verbe narratif est rendu par une proposition coordonnée indépendante, sans introduire une nuance temporelle ou causale absente de la forme hébraïque.
- source_word: אֶרֶץ יַעְזֵר וְאֶת אֶרֶץ גִּלְעָד
  choice: le pays de Yazer et le pays de Galaad
  rationale: « Pays » rend ici אֶרֶץ comme territoire ou région et préserve la répétition de la source. Les formes françaises bibliques usuelles « Yazer » et « Galaad » sont retenues.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette locution française attire l’attention sur le constat qui suit et préserve la fonction présentative de הִנֵּה sans recourir à l’archaïsme « voici » isolé.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: cette région était propice à l’élevage
  rationale: La formulation exprime naturellement en français la valeur prédicative de « lieu pour le bétail ». La répétition hébraïque de מָקוֹם, difficile à conserver sans lourdeur, est explicitée en note.
