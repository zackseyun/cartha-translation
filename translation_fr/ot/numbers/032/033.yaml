  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: fr
  text: 'Moïse donna aux fils de Gad, aux fils de Ruben et à la demi-tribu de Manassé, fils de Joseph, le royaume de Sihôn, roi des Amorites, et le royaume d’Og, roi du Bashân : le pays avec ses villes dans leurs territoires, les villes du pays alentour.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible de la fin du verset : « et le pays, ses villes avec leurs territoires, les villes du pays alentour ». La formulation hébraïque est très condensée et permet plusieurs analyses syntaxiques proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן désigne ici l’octroi d’un territoire. « Donna » conserve la simplicité du récit hébreu.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: aux fils de Gad, aux fils de Ruben
  rationale: Cette formulation conserve l’expression tribale et familiale בְּנֵי tout en restant intelligible en français moderne.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: et à la demi-tribu de Manassé
  rationale: « Demi-tribu » est une désignation française claire et conventionnelle qui reflète directement le syntagme hébreu.
- source_word: בֶן יוֹסֵף
  choice: fils de Joseph
  rationale: La précision généalogique est maintenue comme dans l’hébreu; elle se rapporte à Manassé.
- source_word: מַמְלֶכֶת
  choice: le royaume
  rationale: מַמְלָכָה désigne ici le domaine territorial autrefois gouverné par chacun des deux rois; « royaume » est direct et naturel.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihôn, roi des Amorites
  rationale: Le singulier collectif hébreu désigne le peuple amorite; le français idiomatique emploie « des Amorites ».
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, roi du Bashân
  rationale: Traduction directe de l’apposition hébraïque, avec la forme française traditionnelle et reconnaissable du toponyme.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, « pays » rend naturellement אֶרֶץ sans suggérer nécessairement un État moderne.
- source_word: לְעָרֶיהָ
  choice: avec ses villes
  rationale: La construction est elliptique; « avec ses villes » exprime clairement que le territoire et les villes qui en dépendent sont compris dans le don.
- source_word: בִּגְבֻלֹת
  choice: dans leurs territoires
  rationale: Le pluriel גְּבֻלוֹת peut désigner des limites ou des territoires délimités. Cette formulation reste proche du texte sans imposer artificiellement un antécédent unique au suffixe pluriel.
- source_word: עָרֵי הָאָרֶץ סָבִיב
  choice: les villes du pays tout autour
  rationale: Cette traduction garde le caractère appositionnel et spatial de la formule finale hébraïque, qui est syntaxiquement condensée.
