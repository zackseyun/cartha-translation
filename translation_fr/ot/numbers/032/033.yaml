translation_notes:
  register: Français international moderne, digne et narratif. Les noms propres suivent des formes françaises bibliques largement reconnaissables. La syntaxe finale est légèrement explicitée par « c’est-à-dire », tandis que la note conserve l’ambiguïté réelle de l’hébreu.
