revisions:
- from: 'Moïse donna donc aux fils de Gad, aux fils de Ruben et à la demi-tribu de Manassé, fils de Joseph, le royaume de Sihôn, roi des Amorites, et le royaume d’Og, roi du Bashân : le pays avec ses villes dans leurs territoires, c’est-à-dire les villes du pays tout autour.[a]'
  to: 'Moïse donna aux fils de Gad, aux fils de Ruben et à la demi-tribu de Manassé, fils de Joseph, le royaume de Sihôn, roi des Amorites, et le royaume d’Og, roi du Bashân : le pays avec ses villes dans leurs territoires, les villes du pays alentour.[a]'
  rationale: La révision retire l’inférence causale ajoutée par « donc » et l’explication ajoutée par « c’est-à-dire ». Elle maintient ainsi le caractère appositionnel et ambigu de la finale hébraïque, tandis que la note présente une analyse voisine sans trancher la syntaxe.
