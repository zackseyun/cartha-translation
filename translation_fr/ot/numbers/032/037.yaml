  text: וּ/בְנֵ֤י רְאוּבֵן֙ בָּנ֔וּ אֶת חֶשְׁבּ֖וֹן וְ/אֶת אֶלְעָלֵ֑א וְ/אֵ֖ת קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: fr
  text: Les fils de Ruben bâtirent Heshbon[a], Éléalé et Qiryataïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les Rubénites bâtirent Heshbon, Éléalé et Qiryataïm. »'
    reason: Alternative idiomatique pour l’expression hébraïque littérale « les fils de Ruben ».
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: Les fils de Ruben
  rationale: La formulation conserve le sens littéral de בְנֵי (« fils de ») ainsi que l’accent généalogique, tout en restant naturelle en français biblique moderne.
- source_word: בָּנוּ
  choice: bâtirent
  rationale: Le qal accompli de בנה signifie normalement « bâtir ». Le contexte pourrait impliquer une reconstruction ou un réaménagement, mais le texte ne l’explicite pas.
- source_word: אֶת / וְאֶת / וְאֵת
  choice: non rendus séparément
  rationale: Ces particules signalent les compléments d’objet direct définis et n’ont pas d’équivalent lexical autonome en français.
- source_word: חֶשְׁבּוֹן
  choice: Heshbon
  rationale: Nom de lieu translittéré selon une forme française courante et proche de l’hébreu.
- source_word: אֶלְעָלֵא
  choice: Éléalé
  rationale: Nom de lieu translittéré en français en tenant compte de la vocalisation massorétique.
- source_word: קִרְיָתָיִם
  choice: Qiryataïm
  rationale: Nom de lieu translittéré de façon à refléter l’hébreu קִרְיָתָיִם, avec le tréma indiquant que les voyelles finales se prononcent séparément.
theological_decisions: []
