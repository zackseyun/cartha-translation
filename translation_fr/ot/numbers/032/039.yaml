source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: fr
  text: Les fils de Makir, fils de Manassé, se rendirent en Galaad et s’en emparèrent. Il déposséda[a] les Amorites[b] qui s’y trouvaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe ici au singulier : « il déposséda », après deux verbes au pluriel. Le sujet peut être la lignée de Makir envisagée comme une unité collective; il peut aussi s’agir d’un changement stylistique ou d’une difficulté textuelle. Certaines traductions rendent le verbe au pluriel : « ils dépossédèrent ».'
    reason: textual_variant
  - marker: b
    text: L’hébreu emploie le singulier collectif « l’Amorite » pour désigner les habitants amorites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: se rendirent
  rationale: Le verbe הלך est ici le verbe narratif courant exprimant le déplacement. « Se rendirent » est naturel en français et n’ajoute pas l’idée d’une montée absente du texte.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Les fils de Makir, fils de Manassé
  rationale: בני signifie littéralement « fils de » tout en pouvant désigner des descendants ou les membres d’un clan. La formulation conserve l’expression de parenté hébraïque sans exclure sa portée collective.
- source_word: גִּלְעָדָה
  choice: en Galaad
  rationale: Le hé directionnel marque un mouvement vers Galaad. En français, « se rendre en Galaad » exprime idiomatiquement cette destination.
- source_word: וַיִּלְכְּדֻהָ
  choice: s’en emparèrent
  rationale: לכד désigne la prise ou la capture d’un territoire. « S’en emparèrent » convient naturellement à la conquête d’une région et rend le suffixe féminin renvoyant à Galaad.
- source_word: וַיּוֹרֶשׁ
  choice: Il déposséda
  rationale: Le hifil de ירש signifie faire perdre une possession, déposséder ou chasser. La forme massorétique est au masculin singulier; la traduction la conserve malgré le passage abrupt des verbes pluriels au singulier.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: L’ethnonyme est morphologiquement singulier en hébreu mais possède ici un sens collectif. Le pluriel français désigne clairement les membres de ce peuple présents dans le territoire.
- source_word: אֲשֶׁר בָּהּ
  choice: qui s’y trouvaient
  rationale: La relative désigne les habitants présents en Galaad. Cette tournure est naturelle en français et explicite seulement ce que le contexte rend déjà évident.
theological_decisions:
- issue: Sujet singulier de וַיּוֹרֶשׁ après deux verbes pluriels
  choice: Conserver « Il déposséda » et signaler l’irrégularité en note
  alternative: 'Lisser au pluriel : « ils dépossédèrent »'
  rationale: Le texte massorétique présente réellement un verbe masculin singulier. Le conserver évite de résoudre silencieusement une possible construction collective, particularité stylistique ou difficulté textuelle.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste claire tout en conservant le changement de nombre du texte massorétique. « Makir », « Manassé » et « Galaad » suivent les formes françaises bibliques usuelles.
