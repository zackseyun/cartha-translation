source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: fr
  text: à l’exception de Caleb, fils de Yefounné, le Qenizzite, et de Josué, fils de Noun, car ils ont suivi Yahvé sans réserve[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont suivi Yahvé de tout leur cœur ». L’expression hébraïque signifie littéralement « remplir derrière » et exprime une fidélité entière.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: à l’exception de
  rationale: Dans ce contexte, la particule introduit les deux seules personnes exclues du jugement annoncé. Cette tournure est naturelle et précise en français moderne.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Caleb, fils de Yefounné
  rationale: Les noms sont transcrits selon un usage français moderne, et בֶּן est rendu par la formule généalogique « fils de ».
- source_word: הַקְּנִזִּי
  choice: le Qenizzite
  rationale: Ce gentilé désigne l’appartenance familiale ou ethnique de Caleb. « Qenizzite » reproduit de près la forme hébraïque tout en restant lisible en français.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: et de Josué, fils de Noun
  rationale: La conjonction coordonne la seconde exception. « Josué » est la forme française consacrée, tandis que « Noun » transcrit נוּן.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle Caleb et Josué échappent au jugement. « Car » convient à la continuité syntaxique de ce fragment de phrase.
- source_word: מִלְאוּ אַחֲרֵי
  choice: ont suivi … sans réserve
  rationale: L’expression hébraïque, littéralement « remplir derrière », décrit une adhésion entière et loyale. « Suivre sans réserve » restitue naturellement cette idée sans la réduire à la seule obéissance.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par le nom divin « Yahvé », forme française courante, plutôt que par un titre substitutif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. Le rendre comme nom propre préserve sa fonction dans le texte hébreu sans lui substituer un titre.
- issue: Portée de l’expression מִלְאוּ אַחֲרֵי
  choice: ont suivi Yahvé sans réserve
  alternative: ont pleinement obéi à Yahvé
  rationale: L’hébreu met en avant l’engagement total à suivre Yahvé, et non uniquement l’obéissance comprise de manière abstraite. Le choix retenu conserve l’image du fait de suivre et la notion de loyauté entière.
translation_notes:
  register: Français international moderne, clair et digne. Le verset étant la suite syntaxique du verset précédent, il commence par une minuscule. Les appositions sont ponctuées pour faciliter la lecture, et l’idiome hébreu est rendu naturellement tout en étant signalé en note.
