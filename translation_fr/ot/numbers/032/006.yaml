  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: fr
  text: 'Moïse dit aux fils de Gad et aux fils de Ruben : « Vos frères iront-ils au combat[a] pendant que vous resterez ici ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la guerre ». L’hébreu emploie une expression courante pour désigner l’entrée dans un conflit armé.
    reason: lexical_alternative
  - marker: b
    text: Les « frères » sont ici les autres Israélites, appartenant aux autres tribus.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Moïse dit
  rationale: Le wayyiqtol fait progresser le récit. En français, « dit » rend naturellement l’introduction du discours sans qu’il soit nécessaire de traduire systématiquement le waw par « et ».
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: aux fils de Gad et aux fils de Ruben
  rationale: Cette formulation conserve l’expression hébraïque désignant les descendants et les groupes tribaux, tout en restant intelligible en français biblique moderne.
- source_word: הַאַחֵיכֶם
  choice: vos frères
  rationale: Le terme signifie littéralement « vos frères » et désigne ici les autres Israélites; l’image familiale et la force de l’interpellation sont conservées.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: iraient-ils au combat
  rationale: Avec « combat/guerre », le verbe exprime idiomatiquement l’entrée dans un conflit armé. Le conditionnel interrogatif rend en français la question rhétorique et le reproche implicite de Moïse.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: pendant que vous resteriez ici
  rationale: ישב peut signifier « s’asseoir », « habiter » ou « rester ». Dans ce contexte, « rester » exprime naturellement le contraste entre partir combattre et demeurer sur place, tandis que « pendant que » explicite la relation contrastive portée par le waw.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure interrogative au conditionnel conserve la vigueur du reproche sans le transformer en ordre explicite. Les notes sont placées au plus près de l’expression qu’elles éclairent.
