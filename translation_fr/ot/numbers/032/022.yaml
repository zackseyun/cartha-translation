id: NUM.32.22
reference: Numbers 32:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: fr
  text: et que le pays aura été soumis devant Yahweh[a], vous pourrez ensuite revenir et vous serez dégagés de toute obligation envers Yahweh et envers Israël[b]. Alors, ce pays sera votre possession devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « le SEIGNEUR ». L’hébreu porte le nom divin YHWH.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « vous serez innocents » ou « vous serez quittes devant Yahweh et devant Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה
  choice: et que le pays aura été soumis
  rationale: Le nifal de כבש exprime ici le fait que le pays est amené sous contrôle. Le futur antérieur français marque naturellement l’accomplissement préalable de cette condition tout en conservant le sens passif.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie littéralement « devant » ou « en présence de ». « Devant Yahweh » conserve la nuance de responsabilité et l’expression répétée du texte hébreu.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: vous pourrez ensuite revenir
  rationale: אַחַר marque la succession temporelle. Dans ce contexte conditionnel, le retour est permis après l’accomplissement de l’engagement.
- source_word: וִהְיִיתֶם נְקִיִּים
  choice: vous serez dégagés de toute obligation
  rationale: נָקִי peut signifier « innocent », « quitte » ou « libre de toute responsabilité ». Ici, il s’agit de l’obligation assumée envers Dieu et la communauté; cette formulation explicite ce sens sans effacer les autres possibilités, signalées en note.
- source_word: מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: envers Yahweh et envers Israël
  rationale: Avec נָקִי, la préposition מן indique de qui l’on n’est plus redevable. « Envers » rend cette relation de responsabilité en français naturel.
- source_word: לַאֲחֻזָּה
  choice: comme possession
  rationale: אֲחֻזָּה désigne un bien foncier détenu durablement. « Possession » garde cette portée sans préciser davantage que le texte la transmission héréditaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » représente directement le nom divin présent dans le texte hébreu; une note indique la convention traditionnelle.
- issue: Portée de נְקִיִּים dans le contexte de l’engagement
  choice: dégagés de toute obligation
  alternative: innocents ou quittes
  rationale: Le contexte porte sur l’accomplissement d’un engagement militaire envers Yahweh et Israël. La traduction principale exprime la cessation de cette responsabilité, tandis que la note préserve la nuance judiciaire possible d’innocence.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conditionnelle est rendue par « et que… aura été », en continuité avec le verset précédent. « Dégagés de toute obligation envers » privilégie l’intelligibilité courante, tandis que la note conserve les nuances juridique et morale du terme hébreu.
