revisions:
- from: Car nous ne recevrons pas d’héritage avec eux au-delà du Jourdain et plus loin, puisque notre héritage est venu jusqu’à nous[a] de l’autre côté du Jourdain, à l’est.
  to: Car nous ne recevrons pas d’héritage avec eux au-delà du Jourdain et plus loin, puisque notre héritage nous est venu sur la rive orientale du Jourdain[a].
  rationale: La révision remplace le calque géographiquement ambigu « de l’autre côté du Jourdain, à l’est » par « sur la rive orientale du Jourdain », qui rend le complément מִזְרָחָה de façon claire en français. Elle réorganise aussi « est venu jusqu’à nous » afin que le complément de lieu ne soit pas lu comme une provenance. L’ambiguïté lexicale de בָאָה est préservée dans la note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:52:42Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement la négation, la participation collective (« avec eux ») et l’extension spatiale de מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה. Dans la seconde, « de l’autre côté du Jourdain, à l’est » conserve trop littéralement מֵעֵבֶר et devient perspectivement opaque, voire contradictoire en français. Le repère מִזְרָחָה identifie ici la rive orientale du Jourdain.
  naturalness: « Notre héritage est venu jusqu’à nous » est compréhensible mais peu idiomatique, et l’enchaînement « jusqu’à nous de l’autre côté » laisse entendre que l’héritage proviendrait de l’autre côté. « Notre héritage nous est venu sur la rive orientale du Jourdain » conserve l’image verbale tout en étant plus lisible.
  terminology: « Héritage » est approprié pour נַחֲלָה dans ce contexte d’attribution territoriale. « Recevrons ... d’héritage » est également exact et de registre moderne sobre. La note conserve à juste titre les possibilités plus idiomatiques ou interprétatives d’attribution.
  issues:
  - severity: medium
    issue: Repère géographique de la seconde proposition
    rationale: « De l’autre côté du Jourdain, à l’est » ne rend pas naturellement la désignation de la rive orientale et peut suggérer, selon le point de vue du lecteur, une rive opposée à l’est. « Sur la rive orientale du Jourdain » explicite le repère donné par מִזְרָחָה sans ajouter de donnée géographique.
  - severity: low
    issue: Construction de « est venu jusqu’à nous »
    rationale: Cette formulation est lourde en français et, suivie d’un complément introduit par « de », peut faire de la rive orientale le lieu d’origine du mouvement plutôt que le lieu de l’héritage. Une légère réorganisation résout l’ambiguïté sans modifier le sens.
  revised_text: Car nous ne recevrons pas d’héritage avec eux au-delà du Jourdain et plus loin, puisque notre héritage nous est venu sur la rive orientale du Jourdain[a].
  revised_footnotes:
  - marker: a
    text: 'Ou : « notre héritage nous est échu sur la rive orientale du Jourdain » ou « notre héritage nous a été attribué sur la rive orientale du Jourdain ».'
    reason: La tournure hébraïque peut décrire simplement l’arrivée de l’héritage aux intéressés ou, dans le contexte du partage des terres, son attribution comme lot.
  revision_rationale: La révision remplace le calque géographiquement ambigu « de l’autre côté du Jourdain, à l’est » par « sur la rive orientale du Jourdain », qui rend le complément מִזְרָחָה de façon claire en français. Elle réorganise aussi « est venu jusqu’à nous » afin que le complément de lieu ne soit pas lu comme une provenance. L’ambiguïté lexicale de בָאָה est préservée dans la note.
