  text: כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔/ם מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן וָ/הָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֨/נוּ֙ אֵלֵ֔י/נוּ מֵ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: fr
  text: Car nous ne recevrons pas d’héritage avec eux au-delà du Jourdain et plus loin, puisque notre héritage nous est venu sur la rive orientale du Jourdain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « notre héritage nous est échu sur la rive orientale du Jourdain » ou « notre héritage nous a été attribué sur la rive orientale du Jourdain ».'
    reason: La tournure hébraïque peut décrire simplement l’arrivée de l’héritage aux intéressés ou, dans le contexte du partage des terres, son attribution comme lot.
lexical_decisions:
- source_word: נִנְחַל
  choice: nous ne recevrons pas d’héritage
  rationale: Le verbe נחל désigne ici le fait de recevoir une terre en héritage. Cette formulation française conserve l’idée d’attribution territoriale et la valeur future du contexte.
- source_word: אִתָּם
  choice: avec eux
  rationale: La préposition indique que les tribus concernées ne participeront pas avec les autres à l’héritage situé à l’ouest du Jourdain.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: au-delà du Jourdain et plus loin
  rationale: La traduction garde le repère spatial relatif du texte hébreu ainsi que la progression exprimée par וָהָלְאָה, sans ajouter explicitement « vers l’ouest ».
- source_word: בָאָה
  choice: est venu jusqu’à nous
  rationale: Le parfait féminin s’accorde avec נַחֲלָתֵנוּ et présente l’héritage comme déjà obtenu. La formulation conserve l’image verbale du texte source plutôt que de rendre directement l’idée par « a été attribué ».
- source_word: נַחֲלָתֵנוּ
  choice: notre héritage
  rationale: « Héritage » est le terme français naturel dans ce contexte de partage de la terre et maintient la portée d’un lot reçu durablement.
- source_word: אֵלֵינוּ
  choice: jusqu’à nous
  rationale: Avec le verbe « venir », cette tournure rend naturellement en français la direction exprimée par אֶל.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: de l’autre côté du Jourdain, à l’est
  rationale: Cette formulation rend מֵעֵבֶר sans effacer son caractère perspectif et traduit explicitement מִזְרָחָה par « à l’est ».
