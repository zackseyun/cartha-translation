    issue: « mais » ajoute une opposition explicite
    rationale: Le texte hébreu porte simplement וּ (« et ») avant גְלוּי עֵינָיִם. Même si la juxtaposition peut suggérer une tension entre la chute et la vision, une conjonction adversative française la résout et la renforce indûment.
  - severity: low
    issue: « dont les yeux sont dévoilés » est plus interprétatif et lourd
    rationale: Cette relative passive suggère que les yeux sont activement dévoilés. La construction nominale « les yeux découverts » reproduit plus étroitement l’expression hébraïque tout en restant lisible dans le style poétique.
