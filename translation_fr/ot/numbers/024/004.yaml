source:
  edition: WLC
  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: fr
  text: 'Déclaration[a] de celui qui entend les paroles de Dieu,

    qui voit la vision du Tout-Puissant,

    qui tombe, les yeux découverts[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « oracle de celui qui entend ». Le mot hébreu נְאֻם est un terme prophétique formel désignant une parole solennelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « les yeux ouverts ». Littéralement, « les yeux découverts »; l’expression évoque une vue rendue accessible dans la révélation.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: déclaration
  rationale: Ce nom introduit solennellement une parole prophétique. « Déclaration » conserve la valeur formelle de la formule sans les connotations parfois obscures ou païennes que peut avoir « oracle » en français courant.
- source_word: שֹׁמֵעַ
  choice: celui qui entend
  rationale: Le participe substantivé caractérise le locuteur par sa capacité à entendre; cette tournure est naturelle en français moderne.
- source_word: אִמְרֵי אֵל
  choice: les paroles de Dieu
  rationale: Le pluriel construit désigne les paroles ou propos de Dieu. « Paroles de Dieu » est clair et idiomatique; אֵל fonctionne ici comme titre divin commun.
- source_word: מַחֲזֵה שַׁדַּי
  choice: la vision du Tout-Puissant
  rationale: מַחֲזֵה désigne une perception visionnaire, et שַׁדַּי est rendu par son titre français traditionnel plutôt que translittéré.
- source_word: יֶחֱזֶה
  choice: voit
  rationale: L'imparfait hébreu a ici une valeur présente ou caractérisante, parallèle à « entend ». « Voit » exprime simplement l'expérience visionnaire.
- source_word: נֹפֵל
  choice: qui tombe
  rationale: Le participe garde sa force verbale sans préciser au-delà du texte si le locuteur tombe à terre, demeure étendu ou se prosterne.
- source_word: וּגְלוּי עֵינָיִם
  choice: mais dont les yeux sont dévoilés
  rationale: La formulation conserve l'image littérale d'yeux découverts ou dévoilés. « Mais » rend naturellement le contraste entre la chute et la perception révélée.
theological_decisions:
- issue: Traduction de שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Le terme fonctionne comme un titre divin. Sa traduction traditionnelle préserve son sens général sans imposer une interprétation doctrinale plus étroite.
- issue: État du voyant pendant la révélation
  choice: qui tombe, mais dont les yeux sont dévoilés
  alternative: prosterné, les yeux ouverts
  rationale: Le texte associe la chute à une vue dévoilée sans préciser explicitement une prosternation volontaire ni résoudre entièrement la nature de cet état. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme poétique est conservé sur trois lignes. Les relatives successives reproduisent la structure descriptive de l'hébreu sans archaïsme.
