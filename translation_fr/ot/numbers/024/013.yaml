    issue: Ancre de note mal placée
    rationale: La note [a] explique « la parole de Yahweh », qui rend פי יהוה (« la bouche de Yahweh »), mais l’ancre est actuellement attachée au nom « Yahweh ». Elle doit suivre l’expression « la parole de Yahweh ».
  - severity: medium
    issue: Formulation française maladroite de מִלִּבִּי
    rationale: « pour faire de moi-même le bien ou le mal » est syntaxiquement lourd et moins clair. « pour faire, de ma propre initiative, le bien ou le mal » conserve l’idée que Balaam ne peut agir selon son propre vouloir.
