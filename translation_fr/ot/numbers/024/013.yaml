language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: fr
  text: Si Balak me donnait sa maison pleine d’argent et d’or, je ne pourrais pas aller au-delà de la parole de Yahweh[a], pour faire, de ma propre initiative, le bien ou le mal. Ce que Yahweh dira, je le dirai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dépasser la bouche de Yahweh ».'
    reason: La note signale la métaphore corporelle de l’hébreu derrière le rendu idiomatique « la parole de Yahweh ».
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: Même si ... me donnait
  rationale: Dans ce contexte, אִם suivi de l’inaccompli introduit une hypothèse concessive. Le français « Même si ... donnait » exprime naturellement que cette offre extrême ne changerait rien.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: sa maison pleine d’argent et d’or
  rationale: Cette formulation française naturelle conserve l’image concrète d’une maison remplie de richesses.
- source_word: לֹא אוּכַל
  choice: je ne pourrais pas
  rationale: Le conditionnel s’accorde avec le cadre hypothétique ouvert par la première proposition.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: aller au-delà de la parole de Yahweh
  rationale: L’expression hébraïque signifie littéralement « dépasser la bouche de Yahweh ». « Parole » rend idiomatiquement la parole ou l’ordre émanant de lui, tandis que « aller au-delà » préserve la métaphore d’une limite à ne pas franchir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom propre présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: faire ... le bien ou le mal
  rationale: Cette formulation conserve directement la polarité hébraïque sans en réduire ici la portée à « favorable ou défavorable ».
- source_word: מִלִּבִּי
  choice: de moi-même
  rationale: Littéralement « de mon cœur », l’expression désigne ici ce qui procéderait de la propre initiative de Balaam. « De moi-même » en communique clairement le sens en français courant.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ אֲדַבֵּר
  choice: Ce que Yahweh dira, je le dirai
  rationale: La reprise par « le » conserve naturellement en français la structure résomptive de l’hébreu et maintient le même verbe dans les deux propositions.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nature de la limitation affirmée par Balaam
  choice: Balaam ne peut agir de sa propre initiative au-delà de la parole de Yahweh
  alternative: Balaam ne peut modifier que l’ordre particulier de bénir ou de maudire
  rationale: Le verset emploie les termes généraux « faire le bien ou le mal » et « de mon cœur ». La traduction conserve cette formulation sans en tirer une doctrine générale dépassant le contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le conditionnel maintient le cadre hypothétique; « de moi-même » évite le calque peu naturel « de mon cœur » tout en préservant l’idée d’initiative personnelle. Le marqueur [a] figure dans le texte principal.
