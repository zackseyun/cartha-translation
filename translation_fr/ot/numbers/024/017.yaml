language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: fr
  text: Je le vois[a], mais pas maintenant ; je le contemple, mais il n’est pas proche. Une étoile est sortie de Jacob, et un sceptre s’est levé d’Israël ; il écrasera les confins de Moab[b] et abattra tous les fils de Seth[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Je le verrai ». L’inaccompli hébreu peut avoir ici une valeur présente, pour rendre la vision plus vive, ou une valeur future.'
    reason: alternative_temporelle
  - marker: b
    text: 'Littéralement : « les coins de Moab » ; cette image peut désigner ses extrémités, son territoire ou sa puissance.'
    reason: image_poetique
  - marker: c
    text: L’expression hébraïque « les fils de Seth » est difficile. Certains y voient les descendants de Seth, d’autres une désignation poétique plus large de l’humanité ou d’un peuple ennemi.
    reason: lecture_alternative
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: Je le vois
  rationale: Le qal inaccompli à la première personne avec suffixe masculin singulier présente vivement la vision. « Le » conserve le référent personnel suggéré par le suffixe sans l’identifier explicitement.
- source_word: אֲשׁוּרֶנּוּ
  choice: je le contemple
  rationale: Le verbe שׁור signifie regarder ou contempler. Ce choix maintient le parallélisme élevé avec « je le vois » sans confondre les deux verbes.
- source_word: וְלֹא קָרוֹב
  choice: mais il n’est pas proche
  rationale: « Proche » préserve la formulation et l’ambiguïté du texte hébreu, même si, dans ce contexte, la proximité est probablement surtout temporelle.
- source_word: דָּרַךְ כּוֹכָב
  choice: Une étoile est sortie
  rationale: דָּרַךְ évoque littéralement le fait de marcher ou de s’avancer. Avec « étoile », « est sortie » exprime naturellement son apparition tout en conservant l’accompli prophétique.
- source_word: וְקָם שֵׁבֶט
  choice: et un sceptre s’est levé
  rationale: שֵׁבֶט peut désigner un bâton, une verge, un sceptre ou une tribu. En parallèle avec l’étoile et dans un contexte royal et guerrier, « sceptre » convient le mieux.
- source_word: וּמָחַץ פַּאֲתֵי מוֹאָב
  choice: il écrasera les confins de Moab
  rationale: מחץ signifie écraser ou fracasser. פֵּאָה désigne un coin, un côté ou une extrémité ; « confins » rend l’image en français naturel sans préciser abusivement s’il s’agit du territoire ou de la puissance de Moab.
- source_word: וְקַרְקַר
  choice: et abattra
  rationale: Ce verbe rare est de sens incertain ; les propositions comprennent démolir, renverser et dévaster. « Abattra » convient à des personnes et conserve la force du contexte de conquête sans prétendre résoudre entièrement l’incertitude lexicale.
- source_word: כָּל בְּנֵי שֵׁת
  choice: tous les fils de Seth
  rationale: La vocalisation massorétique permet de reconnaître le nom propre Seth. La note signale que l’expression reste difficile et qu’elle a reçu des interprétations plus larges.
theological_decisions:
- issue: Portée messianique de l’oracle de Balaam
  choice: Conserver dans le texte les images royales de l’étoile et du sceptre sans nommer explicitement le Messie.
  alternative: Identifier directement le personnage au Messie, ou limiter la prophétie à un roi historique tel que David.
  rationale: Le texte hébreu présente une figure royale future au moyen d’images, mais ne la nomme pas. La traduction maintient donc la portée théologique possible sans imposer une identification qui relève de l’interprétation.
- issue: Relation entre le personnage vu et les symboles royaux
  choice: Employer un pronom personnel au début, puis laisser l’étoile et le sceptre porter l’image avant de reprendre « il » pour l’action.
  alternative: Rendre toute la scène de manière impersonnelle, ou remplacer partout les symboles par un roi explicitement désigné.
  rationale: Les suffixes masculins singuliers du début suggèrent un personnage, tandis que les propositions suivantes emploient des noms symboliques masculins. Cette formulation conserve les deux niveaux du langage prophétique.
- issue: Valeur temporelle des accomplis דָּרַךְ et קָם
  choice: Employer le passé composé pour l’apparition certaine dans la vision, puis le futur pour les actes de conquête.
  alternative: 'Tout traduire au futur : « sortira », « se lèvera », « écrasera ».'
  rationale: Les formes accomplies peuvent présenter prophétiquement l’événement comme déjà réalisé ou assuré. Le passé composé français conserve cet effet sans nier la perspective future indiquée par le contexte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. Le parallélisme poétique et les images royales sont conservés. La ponctuation met en relief les deux membres de la vision puis les actions de conquête.
