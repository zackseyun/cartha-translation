  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: fr
  text: 'Puis il prononça son discours et dit : « Déclaration de Balaam, fils de Béor, déclaration de l’homme à l’œil fermé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont l’œil est ouvert ». Certains comprennent ainsi l’expression en raison du contexte de vision prophétique et d’une ancienne tradition d’interprétation, mais la forme hébraïque suggère plus directement un œil « fermé » ou « clos ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Puis il prononça son discours
  rationale: L’expression introduit une parole poétique solennelle. « Prononça son discours » rend naturellement la fonction de la formule sans confondre מָשָׁל avec נְאֻם, qui suit.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Rend simplement la forme narrative de אמר et conserve la cadence de l’introduction hébraïque.
- source_word: נְאֻם
  choice: déclaration de
  rationale: Formule solennelle qui introduit une parole prophétique ou autoritative. « Déclaration » est clair et permet de conserver la répétition hébraïque.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Balaam, fils de Béor
  rationale: Translittération française usuelle des noms et rendu direct de la filiation.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: Rendu naturel du masculin singulier dans cette formule d’auto-présentation.
- source_word: שְׁתֻם הָעָיִן
  choice: à l’œil fermé
  rationale: Le sens lexical le plus direct de la forme massorétique est « fermé » ou « clos ». La formulation française demeure concise, tandis que l’autre compréhension ancienne et contextuelle est signalée en note.
theological_decisions:
- issue: Sens de la description visionnaire שְׁתֻם הָעָיִן
  choice: à l’œil fermé
  alternative: dont l’œil est ouvert
  rationale: La traduction principale suit le sens le plus direct de la forme hébraïque sans l’harmoniser avec le contexte visionnaire. La lecture concurrente est conservée en note afin de respecter l’ambiguïté interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition solennelle de « déclaration » est conservée. « À l’œil fermé » suit de près l’hébreu tout en restant idiomatique.
