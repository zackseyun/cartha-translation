source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: fr
  text: Balaam leva les yeux et vit Israël campé tribu par tribu[a]. Alors l’Esprit de Dieu vint sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « campé selon ses tribus » ; ou : « installé par tribus ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’esprit de Dieu fut sur lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: leva les yeux
  rationale: Cette expression française naturelle conserve l’image explicite de l’idiome hébreu plutôt que de la réduire à « regarda ».
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe exprime directement ce que Balaam perçoit après avoir levé les yeux.
- source_word: שֹׁכֵן
  choice: campé
  rationale: Dans ce contexte, le participe décrit Israël établi dans son camp. « Campé » rend cette situation plus précisément que le terme général « installé », sans ajouter une nuance militaire absente du passage.
- source_word: לִשְׁבָטָיו
  choice: tribu par tribu
  rationale: La préposition indique ici une disposition selon les tribus. Cette formulation idiomatique fait ressortir l’organisation visible du camp tout en traitant Israël comme un collectif.
- source_word: רוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  rationale: Dans le contexte immédiat de l’oracle prophétique, l’expression désigne naturellement l’Esprit venant rendre Balaam capable de parler, sans importer de précision doctrinale ultérieure.
- source_word: וַתְּהִי עָלָיו
  choice: vint sur lui
  rationale: Cette tournure rend la valeur événementielle de la proposition dans la suite narrative et correspond à l’idiome de la présence divine qui saisit ou rend capable un prophète.
theological_decisions:
- issue: Sens de רוּחַ אֱלֹהִים dans un contexte d’inspiration prophétique
  choice: l’Esprit de Dieu
  alternative: l’esprit de Dieu fut sur lui
  rationale: Le contexte favorise une intervention de l’Esprit de Dieu qui rend Balaam capable de prononcer l’oracle. La note conserve toutefois une traduction plus formellement statique et moins interprétative de la construction hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’idiome « leva les yeux », rend visible l’organisation tribale du camp et maintient en note l’ambiguïté entre une venue dynamique de l’Esprit et l’énoncé plus statique de sa présence.
