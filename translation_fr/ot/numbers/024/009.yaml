source:
  edition: WLC
  text: כָּרַ֨ע שָׁכַ֧ב כַּ/אֲרִ֛י וּ/כְ/לָבִ֖יא מִ֣י יְקִימֶ֑/נּוּ מְבָרֲכֶ֣י/ךָ בָר֔וּךְ וְ/אֹרְרֶ֖י/ךָ אָרֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: fr
  text: 'Il s’est accroupi, il s’est couché comme un lion,

    comme une lionne[a] : qui le fera se lever ?


    Ceux qui te bénissent sont bénis,

    et ceux qui te maudissent sont maudits[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un lion puissant » ou « comme un lion adulte ». Le terme hébreu, distinct de celui traduit juste avant par « lion », peut désigner un lion fort ou mûr.
    reason: lexical_alternative
  - marker: b
    text: Cette formule de bénédiction et de malédiction fait écho à Genèse 12.3 et 27.29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: il s’est accroupi
  rationale: Le verbe exprime le fait de se plier ou de s’accroupir. Avec שָׁכַב et l’image du lion, « s’accroupir » décrit naturellement la posture de l’animal sans suggérer un acte d’adoration ou de soumission.
- source_word: שָׁכַב
  choice: il s’est couché
  rationale: Ce verbe courant signifie « se coucher, être couché ». Le passé composé rend naturellement le tableau poétique d’un lion qui s’installe au repos.
- source_word: כַּאֲרִי
  choice: comme un lion
  rationale: Traduction directe de la comparaison explicite formée avec כְּ et du nom אֲרִי.
- source_word: וּכְלָבִיא
  choice: comme un lion vigoureux
  rationale: לָבִיא peut désigner un lion, notamment puissant ou adulte, sans imposer le sexe féminin. « Lion vigoureux » maintient une distinction avec אֲרִי tout en préservant l’idée de force; « lionne » demeure une possibilité lexicale signalée en note.
- source_word: מִי יְקִימֶנּוּ
  choice: qui le fera se lever ?
  rationale: Le hifil de קום signifie littéralement « faire se lever ». Dans le contexte du lion couché, cette formulation évoque aussi le fait de le déranger ou de l’éveiller, tout en restant proche de la forme hébraïque.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: ceux qui te bénissent sont bénis
  rationale: Le participe substantivé avec suffixe masculin singulier est rendu par une proposition naturelle. L’adjectif prédicatif singulier hébreu peut avoir une portée distributive ou collective; le français emploie le pluriel avec « ceux ».
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: et ceux qui te maudissent sont maudits
  rationale: La construction parallèle est conservée, ainsi que l’opposition directe entre bénédiction et malédiction.
theological_decisions:
- issue: Référent des suffixes de deuxième personne dans la formule de bénédiction et de malédiction
  choice: Maintien du « te » masculin singulier, adressé à Israël/Jacob dans la représentation poétique de l’oracle
  alternative: Préciser qu’il s’agit exclusivement du peuple ou, plus étroitement, de son roi
  rationale: Le contexte présente Israël/Jacob au singulier poétique. Garder le singulier préserve la force à la fois individuelle et collective de l’hébreu sans fixer davantage le référent.
- issue: Écho de la formule patriarcale de bénédiction et de malédiction
  choice: Conserver la déclaration sans explicitation doctrinale dans le corps du verset
  alternative: Développer la traduction afin de rendre explicite le lien avec Abraham ou la bénédiction patriarcale
  rationale: Le rapprochement avec Genèse 12.3 et 27.29 est important, mais relève de l’intertextualité; une note le signale sans ajouter au texte une interprétation absente de l’hébreu.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est disposé en quatre lignes. Le passé composé offre une narration naturelle, tandis que « qui le fera se lever ? » conserve la vigueur de l’image et la structure causative de l’hébreu.
