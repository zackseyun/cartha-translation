  text: וַ/יָּ֣קָם בִּלְעָ֔ם וַ/יֵּ֖לֶךְ וַ/יָּ֣שָׁב לִ/מְקֹמ֑/וֹ וְ/גַם בָּלָ֖ק הָלַ֥ךְ לְ/דַרְכּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: fr
  text: Alors Balaam se leva, partit et retourna chez lui. Balak aussi s’en alla de son côté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום indique ici que Balaam se met debout pour partir. « Se leva » conserve sobrement le mouvement exprimé par l’hébreu.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: הלך signifie littéralement « aller ». Dans cette succession narrative de verbes de mouvement, « partit » exprime naturellement le départ sans ajouter de destination.
- source_word: וַיָּשָׁב
  choice: retourna
  rationale: שׁוב, suivi d’une indication de destination, signifie revenir ou retourner. « Retourna » préserve ce sens direct.
- source_word: לִמְקֹמוֹ
  choice: chez lui
  rationale: Littéralement « à son lieu ». En français courant, « chez lui » rend naturellement cette expression sans préciser qu’il s’agit nécessairement de sa maison ou de son pays.
- source_word: וְגַם
  choice: lui aussi
  rationale: Cette formulation marque clairement l’ajout de Balak comme second personnage qui s’en va, tout en évitant une coordination française lourde.
- source_word: בָּלָק
  choice: Balak
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: הָלַךְ
  choice: poursuivit
  rationale: Avec לְדַרְכּוֹ, le verbe forme l’idée idiomatique d’aller son chemin. « Poursuivit son chemin » est une formulation française naturelle qui respecte cette expression.
- source_word: לְדַרְכּוֹ
  choice: son chemin
  rationale: דרך désigne le chemin ou la route. Dans ce contexte, l’expression signifie que Balak s’en va de son côté, sans que le texte nomme sa destination.
