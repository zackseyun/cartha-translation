source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: fr
  text: 'Puis il prononça son oracle et dit :


    « Déclaration de Balaam, fils de Béor,


    déclaration de l’homme dont l’œil est ouvert[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont l’œil est fermé (ou clos) ». L’expression hébraïque est difficile et a été comprise de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Puis il prononça son oracle
  rationale: La construction נשׂא avec מָשָׁל introduit ici une déclaration poétique solennelle. « Prononça son oracle » rend naturellement l’expression en français sans reproduire littéralement l’idée de « lever ».
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Le verbe « dire » introduit la parole citée. Après « prononça son oracle », les deux-points évitent une répétition lourde tout en conservant sa fonction discursive.
- source_word: נְאֻם
  choice: déclaration
  rationale: Ce terme marque une proclamation solennelle et autorisée. La répétition de « déclaration » reproduit le parallélisme hébreu.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Balaam, fils de Béor
  rationale: Les noms suivent leur forme française usuelle, et le patronyme est rendu directement.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: « L’homme » est la formulation française la plus naturelle ici; une éventuelle nuance de vigueur portée par גֶּבֶר n’est pas déterminante dans ce contexte.
- source_word: שְׁתֻם הָעָיִן
  choice: dont l’œil est ouvert
  rationale: L’expression est difficile, mais le contexte immédiat de la vision et des yeux dévoilés favorise l’idée d’une perception rendue possible. Le singulier « l’œil » respecte la forme hébraïque; l’autre compréhension ancienne et lexicale est signalée en note.
theological_decisions:
- issue: Sens de la description שְׁתֻם הָעָיִן appliquée à Balaam
  choice: dont l’œil est ouvert
  alternative: dont l’œil est fermé / clos
  rationale: Le contexte présente Balaam comme bénéficiaire d’une vision divine, ce qui soutient la lecture « ouvert ». Comme la forme hébraïque demeure discutée et peut être comprise dans le sens opposé, la traduction ne supprime pas cette tension et conserve l’alternative en note.
translation_notes:
  register: Français international moderne, solennel mais accessible. La mise en lignes fait ressortir le caractère poétique et le parallélisme de la déclaration.
