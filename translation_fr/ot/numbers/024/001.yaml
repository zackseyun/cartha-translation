language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: fr
  text: Balaam vit qu’il était bon aux yeux de Yahweh de bénir Israël. Il n’alla pas, comme les autres fois, à la recherche de présages[a], mais se tourna vers le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la rencontre de pratiques divinatoires » ou « pour rencontrer des présages ». L’expression hébraïque renvoie à l’ancienne pratique de Balaam, qui recherchait des signes divinatoires.
    reason: Alternative lexicale préservant l’ambiguïté de לִקְרַאת נְחָשִׁים.
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le sens premier de ראה est « voir »; dans ce contexte, le verbe exprime aussi la constatation de Balaam. « Vit » conserve l’image hébraïque et reste naturel en français.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: qu’il était bon aux yeux de Yahweh
  rationale: Cette formulation conserve l’expression hébraïque signifiant que la chose plaît à Yahweh ou a son approbation, sans en effacer l’image.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: לְבָרֵךְ
  choice: de bénir
  rationale: Traduction directe de l’infinitif ברך dans ce contexte.
- source_word: וְלֹא הָלַךְ
  choice: Il n’alla pas
  rationale: הלך est le verbe courant signifiant « aller »; le passé simple convient au registre narratif français.
- source_word: כְּפַעַם בְּפַעַם
  choice: comme les autres fois
  rationale: L’expression évoque une pratique répétée lors des occasions précédentes.
- source_word: לִקְרַאת נְחָשִׁים
  choice: à la recherche de présages
  rationale: נְחָשִׁים désigne ici des signes divinatoires, non des serpents. La formulation rend la fonction contextuelle de la démarche tout en signalant en note la valeur plus littérale de לִקְרַאת.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: tourna son visage
  rationale: L’expression hébraïque décrit le fait de s’orienter délibérément dans une direction. « Tourna son visage » préserve l’image sans employer une tournure française trop artificielle.
- source_word: אֶל הַמִּדְבָּר
  choice: vers le désert
  rationale: מִדְבָּר désigne une région désertique ou sauvage; « désert » est ici clair et naturel, tandis que « vers » exprime la direction.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Nature des נְחָשִׁים recherchés par Balaam
  choice: des présages divinatoires
  alternative: des signes indéterminés; des divinations
  rationale: Dans ce contexte, le terme renvoie à la divination pratiquée auparavant par Balaam. La traduction ne présente ni les présages ni sa pratique comme approuvés par Yahweh.
translation_notes:
  register: Français international moderne, narratif et digne. L’imagerie hébraïque « bon aux yeux de » est conservée; la tournure plus opaque concernant les présages est rendue clairement dans le texte et documentée en note.
