source:
  edition: WLC
  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: fr
  text: Dieu le fait sortir d’Égypte ; il possède les cornes d’un taureau sauvage[a]. Il dévorera les nations qui lui sont hostiles, rongera leurs os[b] et les écrasera de ses flèches[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il a la puissance d’un taureau sauvage ». L’expression hébraïque est difficile ; elle peut évoquer concrètement les cornes de l’animal ou, plus généralement, sa force imposante.
    reason: lexical_alternative
  - marker: b
    text: Ou « brisera leurs os » ou « mettra leurs os à nu ». Le verbe hébreu est rare, et sa nuance exacte demeure incertaine.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, le texte hébreu porte « ses flèches, il écrase ». Cette construction est difficile ; la traduction comprend les flèches comme le moyen par lequel il écrase ses adversaires.
    reason: source_ambiguity
lexical_decisions:
- source_word: אֵל
  choice: Dieu
  rationale: Le nom désigne ici Dieu comme auteur de la délivrance ; « Dieu » est la formulation française directe et naturelle.
- source_word: מוֹצִיאוֹ
  choice: le fait sortir
  rationale: Le participe muni d’un suffixe a une valeur verbale et présente vivement l’action de Dieu. « Le fait sortir » rend aussi la nuance causative du verbe.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Formulation française idiomatique de l’expression de l’exode hors d’Égypte.
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: les cornes d’un buffle sauvage
  rationale: L’expression difficile évoque les hautes saillies ou la puissance du ré’em. L’image concrète des cornes est conservée, tandis que « buffle sauvage », immédiatement compréhensible, évite le traditionnel mais inexact « licorne ».
- source_word: לוֹ
  choice: il possède
  rationale: Le datif exprime ici la possession ou l’avantage. Une tournure possessive est plus naturelle en français que le calque « il y a pour lui ».
- source_word: יֹאכַל
  choice: dévorera
  rationale: Le sens littéral, « manger », prend dans cette poésie guerrière la valeur métaphorique de détruire. « Dévorera » conserve fortement cette image.
- source_word: גּוֹיִם צָרָיו
  choice: les nations qui lui sont hostiles
  rationale: Cette formulation rend les nations comme adversaires du personnage désigné par les pronoms singuliers, sans réduire גּוֹיִם à de simples individus.
- source_word: וְעַצְמֹתֵיהֶם יְגָרֵם
  choice: rongera leurs os
  rationale: Le verbe rare יְגָרֵם est incertain. « Rongera » s’accorde avec l’image précédente de la dévoration tout en conservant l’objet explicite, les os ; l’incertitude est signalée en note.
- source_word: וְחִצָּיו יִמְחָץ
  choice: les écrasera de ses flèches
  rationale: Le verbe מחץ exprime l’action de broyer ou d’écraser. Les flèches sont comprises instrumentalement, et l’objet sous-entendu renvoie aux adversaires.
theological_decisions:
- issue: Référent des pronoms singuliers dans l’oracle de Balaam
  choice: Maintenir « le / il / lui / ses » sans préciser davantage le référent
  alternative: Identifier explicitement le personnage à Israël collectivement, à son roi ou à un individu messianique
  rationale: L’hébreu emploie le singulier, mais le contexte permet d’y voir Israël comme entité collective ou son représentant royal. Le maintien des pronoms préserve cette tension sans imposer une interprétation doctrinale plus étroite.
- issue: Sujet implicite des verbes guerriers après l’action de Dieu
  choice: Conserver le pronom « il », sans répéter un nom
  alternative: Nommer explicitement Dieu ou Israël comme sujet
  rationale: La transition syntaxique autorise plusieurs perceptions du sujet. Répéter un nom en français trancherait une ambiguïté que le texte hébreu laisse ouverte.
translation_notes:
  register: Français international actuel, poétique et digne. Le futur rend la progression de l’oracle guerrier, tandis que les images violentes de la dévoration, des os et des flèches sont conservées. Les pronoms singuliers restent volontairement non explicités.
