  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל בָּלָ֑ק הֲ/לֹ֗א גַּ֧ם אֶל מַלְאָכֶ֛י/ךָ אֲשֶׁר שָׁלַ֥חְתָּ אֵלַ֖/י דִּבַּ֥רְתִּי לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: fr
  text: 'Balaam dit à Balak : « N’ai-je pas aussi parlé à tes messagers[a] que tu avais envoyés vers moi, en disant :[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes envoyés ».
    reason: lexical_alternative
  - marker: b
    text: Les paroles ainsi introduites se poursuivent au verset suivant.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר est la formule narrative habituelle pour introduire un discours direct ; « dit » est naturel en français.
- source_word: בִּלְעָם אֶל־בָּלָק
  choice: Balaam dit à Balak
  rationale: Les noms suivent leur forme française usuelle, et אֶל indique le destinataire de la parole.
- source_word: הֲלֹא
  choice: N’ai-je pas… ?
  rationale: La question négative attend une réponse affirmative. Le passé composé convient à ce rappel d’une parole antérieure encore pertinente dans l’échange.
- source_word: גַּם
  choice: aussi
  rationale: Le terme ajoute l’idée que Balaam avait également parlé aux représentants de Balak.
- source_word: מַלְאָכֶיךָ
  choice: tes messagers
  rationale: Dans ce contexte diplomatique, מַלְאָך désigne nécessairement des envoyés humains, non des anges.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: que tu m’avais envoyés
  rationale: Le plus-que-parfait situe naturellement l’envoi avant la parole que Balaam rappelle ; le complément « à moi » peut être omis en français, puisque « envoyer quelqu’un » dans ce contexte et la suite narrative rendent la destination claire, sans modifier le référent.
- source_word: דִּבַּרְתִּי לֵאמֹר
  choice: 'dit… :'
  rationale: En français moderne, un verbe de parole suivi de deux-points introduit naturellement le contenu annoncé par לֵאמֹר, lequel se poursuit au verset suivant.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La question rhétorique est conservée. Les deux-points remplacent l’hébraïsme littéral « en disant » afin d’introduire naturellement la citation qui commence au verset suivant.
