  text: וְ/יֵ֖רְדְּ מִֽ/יַּעֲקֹ֑ב וְ/הֶֽאֱבִ֥יד שָׂרִ֖יד מֵ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: fr
  text: 'De Jacob viendra celui qui dominera[a],

    et il fera périr le survivant de la ville[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De Jacob viendra celui qui exercera la domination. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le reste » ; le mot hébreu peut désigner un survivant ou ce qui subsiste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: surgira celui qui dominera
  rationale: Le verbe est compris comme une forme de רדה, « dominer, exercer le pouvoir ». Comme son sujet n’est pas exprimé, « celui qui » le laisse indéfini tout en le reliant naturellement à la figure royale du contexte. « Surgira » transpose avec מִן l’idée qu’un souverain sera issu de Jacob, sans retenir l’analyse moins probable « descendra ».
- source_word: מִיַּעֲקֹב
  choice: De Jacob
  rationale: 'La préposition מן indique ici l’origine : le personnage appelé à dominer est issu de Jacob.'
- source_word: וְהֶאֱבִיד
  choice: et il fera disparaître
  rationale: Le hifil de אבד signifie causer la perte ou la disparition. « Faire disparaître » exprime clairement cette valeur causative dans un français naturel et soutenu.
- source_word: שָׂרִיד
  choice: le dernier survivant
  rationale: Le nom désigne celui qui reste ou survit. Dans ce contexte de destruction, « le dernier survivant » rend idiomatiquement la portée du singulier, tandis que « le reste » demeure une possibilité signalée en note.
- source_word: מֵעִיר
  choice: de la ville
  rationale: עִיר signifie normalement « ville », et מן marque ici l’origine ou le lieu dont le survivant sera éliminé. Rien dans le terme seul ne justifie « ville fortifiée ».
theological_decisions:
- issue: Référence royale ou messianique dans l’oracle de Balaam
  choice: Employer une formulation royale générale sans identifier explicitement le personnage comme le Messie.
  alternative: Identifier le personnage soit uniquement à un roi historique immédiat, soit directement au Messie.
  rationale: Le contexte présente une figure souveraine issue de Jacob, mais ce verset ne la nomme pas explicitement. La formulation retenue préserve donc l’ouverture historique, typologique et messianique du texte.
translation_notes:
  register: Français international moderne, digne et direct. La tournure poétique en deux lignes convient à l’oracle. « Celui qui » préserve l’absence de sujet nominal explicite en hébreu, et les notes maintiennent les principales possibilités lexicales.
