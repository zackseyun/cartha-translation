  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר א֕וֹי מִ֥י יִחְיֶ֖ה מִ/שֻּׂמ֥/וֹ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: fr
  text: 'Il prononça alors son discours et dit :


    « Hélas ! Qui survivra quand Dieu fera cela ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la dernière proposition est difficile. On peut aussi traduire : « Qui vivra lorsque Dieu établira cela ? » ou « Qui survivra quand Dieu le mettra en place ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Puis il prononça son discours
  rationale: L’expression forme un idiome signifiant prendre la parole pour énoncer une déclaration poétique. « Prononça son discours » est naturel en français tout en gardant le terme large מָשָׁל, qui peut aussi désigner une sentence, un oracle ou une parabole.
- source_word: אֹוי
  choice: Hélas !
  rationale: Cette interjection exprime ici la détresse ou l’effroi. « Hélas ! » convient au registre poétique sans imposer la formule technique d’un oracle de malheur.
- source_word: מִי יִחְיֶה
  choice: Qui survivra
  rationale: Littéralement « qui vivra ? ». Dans le contexte d’un bouleversement redouté, le sens est « qui restera en vie ? » ; « survivra » l’exprime clairement et idiomatiquement.
- source_word: מִשֻּׂמוֹ אֵל
  choice: quand Dieu fera cela
  rationale: La proposition hébraïque est très condensée et difficile. Cette traduction comprend אֵל comme sujet et rend שׂוּם de manière contextuelle, sans préciser davantage ce que Dieu met en place ou accomplit.
theological_decisions:
- issue: Interprétation de מִשֻּׂמוֹ אֵל
  choice: quand Dieu fera cela
  alternative: quand Dieu établira cela ; lorsque Dieu le mettra en place
  rationale: Le texte permet difficilement de déterminer la fonction exacte du suffixe et la nuance de שׂוּם. La formulation retenue conserve l’action divine et la référence indéterminée de l’hébreu sans transformer l’ambiguïté en affirmation doctrinale précise.
translation_notes:
  register: Français international moderne, digne et poétique. Le bref cri « Hélas ! » préserve la force de l’interjection, tandis que « survivra » rend explicitement le sens contextuel de rester en vie. La difficulté réelle de la dernière proposition est signalée en note.
