source:
  edition: WLC
  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: fr
  text: 'Et maintenant, fuis et va chez toi. J’avais dit : « Je t’honorerais grandement. » Mais voici, Yahweh t’a privé d’honneur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction et l’indication temporelle, tout en introduisant naturellement la conclusion irritée de Balaq.
- source_word: בְּרַח לְךָ אֶל־מְקוֹמֶךָ
  choice: fuis, retourne chez toi
  rationale: בְּרַח garde la force de l’impératif « fuis »; l’expression idiomatique אֶל־מְקוֹמֶךָ désigne ici le lieu propre de Balaam, naturellement rendu en français par « chez toi ».
- source_word: אָמַרְתִּי
  choice: J’avais dit
  rationale: Le plus-que-parfait exprime clairement que Balaq renvoie à sa promesse antérieure, sans changer la valeur fondamentale du verbe.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: Je te comblerai d’honneurs
  rationale: La tournure infinitif absolu plus verbe conjugué est fortement emphatique; « combler d’honneurs » restitue cette intensité dans un français naturel.
- source_word: וְהִנֵּה
  choice: Mais voici
  rationale: « Mais » rend le contraste contextuel, tandis que « voici » conserve la fonction présentative et vive de הִנֵּה.
- source_word: מְנָעֲךָ
  choice: t’a privé
  rationale: Avec מִן, le verbe indique que Balaam a été empêché d’obtenir l’honneur promis; « priver de » exprime naturellement ce résultat en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: מִכָּבוֹד
  choice: de ces honneurs
  rationale: כָּבוֹד renvoie ici aux honneurs royaux promis juste auparavant; le pluriel français et le démonstratif rendent cette reprise de façon idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom propre sans imposer la substitution traditionnelle par un titre.
- issue: Agent de la privation d’honneur
  choice: Yahweh t’a privé de ces honneurs
  alternative: Yahweh t’a empêché de recevoir ces honneurs
  rationale: La formulation conserve l’accusation de Balaq selon laquelle Yahweh est directement responsable de la perte des honneurs promis, sans approuver ni atténuer son interprétation.
translation_notes:
  register: Français international moderne, digne et direct. Le ton brusque de Balaq est conservé par « fuis »; « retourne chez toi » évite le calque peu naturel « vers ton lieu ». Le parallélisme autour des « honneurs » reste perceptible.
