id: NUM.24.22
reference: Numbers 24:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֥י אִם יִהְיֶ֖ה לְ/בָ֣עֵֽר קָ֑יִן עַד מָ֖ה אַשּׁ֥וּר תִּשְׁבֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: fr
  text: Car, si Caïn[a] est voué à être consumé, combien de temps faudra-t-il avant qu’Assour[b] t’emmène en captivité ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Caïn » désigne vraisemblablement les Qénites plutôt que l’individu Caïn.
    reason: lexical_alternative
  - marker: b
    text: Selon le contexte, « Assour » peut désigner l’Assyrie ou la puissance assyrienne.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Car, si
  rationale: Cette formulation conserve à la fois le lien explicatif avec l’oracle précédent et la valeur conditionnelle possible de la locution hébraïque, sans transformer la proposition en affirmation catégorique.
- source_word: יִהְיֶה לְבָעֵר
  choice: est voué à être consumé
  rationale: Le verbe « être » suivi de לְ et de l’infinitif exprime ici l’issue qui attend Caïn. « Être consumé » garde l’image de destruction associée à בער sans imposer un incendie littéral.
- source_word: קָיִן
  choice: Caïn
  rationale: La forme française traditionnelle du nom propre est retenue dans le texte. Dans ce contexte, le nom désigne vraisemblablement le peuple des Qénites, ce que précise la note.
- source_word: עַד מָה
  choice: combien de temps faudra-t-il avant que
  rationale: Cette tournure française naturelle rend la question temporelle et son orientation vers l’événement à venir, tout en évitant le calque peu idiomatique « jusqu’à quand avant que ».
- source_word: אַשּׁוּר
  choice: Assour
  rationale: La translittération française du nom hébreu préserve l’ambiguïté entre le territoire, le peuple et la puissance assyrienne; la note signale les deux lectures contextuelles principales.
- source_word: תִּשְׁבֶּךָּ
  choice: t’emmène en captivité
  rationale: Le verbe שבה signifie prendre ou emmener captif. Cette expression fait entendre le déplacement en captivité, et non une simple arrestation.
