source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: fr
  text: Comme des vallées, ils s’étendent, comme des jardins au bord d’une rivière, comme des aloès[a] que Yahweh a plantés, comme des cèdres au bord des eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne ici des arbres au bois parfumé, aussi appelé « bois d’aloès » ; l’identification botanique précise reste incertaine. Il ne s’agit pas de tentes.
    reason: Précision lexicale et botanique concernant אֲהָלִים, homographe d’un mot pouvant signifier « tentes ».
lexical_decisions:
- source_word: נְחָלִים
  choice: vallées
  rationale: Le nom peut désigner des vallées, des lits de torrents ou des oueds. « Vallées » est naturel en français et convient à cette évocation poétique d’un paysage irrigué, sans réduire l’image à un cours d’eau permanent.
- source_word: נִטָּיוּ
  choice: ils s’étendent
  rationale: La forme de נטה décrit ce qui est déployé ou étendu. Le présent français rend naturellement l’état visible évoqué dans la bénédiction poétique.
- source_word: גַנֹּת
  choice: jardins
  rationale: Équivalent direct qui conserve l’image de fertilité cultivée.
- source_word: עֲלֵי נָהָר
  choice: au bord d’un fleuve
  rationale: Dans cet emploi, עֲלֵי marque la proximité. נָהָר désigne ici un fleuve ou une rivière; « fleuve » donne une image naturelle et majestueuse sans préciser indûment son identité.
- source_word: אֲהָלִים
  choice: arbres à bois d’aloès
  rationale: Dans ce contexte poétique, le terme désigne des arbres produisant un bois parfumé, et non des tentes. Cette formulation évite que le lecteur moderne pense à la plante succulente communément appelée aloès.
- source_word: נָטַע
  choice: a plantés
  rationale: Le parfait présente l’action accomplie de Yahweh, dont le résultat est visible dans l’image.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: אֲרָזִים
  choice: cèdres
  rationale: Traduction usuelle qui conserve l’image de grandeur, de vigueur et de stabilité.
- source_word: עֲלֵי מָיִם
  choice: au bord des eaux
  rationale: La formulation garde le pluriel hébreu et l’image poétique d’une abondante alimentation en eau.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme; sa transcription préserve le caractère personnel du nom divin sans lui substituer un titre.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « comme » reproduit le parallélisme hébreu. Le pronom « ils » maintient le lien implicite avec les campements ou les habitats mentionnés au verset précédent.
