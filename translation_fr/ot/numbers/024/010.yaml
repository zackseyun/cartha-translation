source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף בָּלָק֙ אֶל בִּלְעָ֔ם וַ/יִּסְפֹּ֖ק אֶת כַּפָּ֑י/ו וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם לָ/קֹ֤ב אֹֽיְבַ/י֙ קְרָאתִ֔י/ךָ וְ/הִנֵּה֙ בֵּרַ֣כְתָּ בָרֵ֔ךְ זֶ֖ה שָׁלֹ֥שׁ פְּעָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: fr
  text: 'Alors la colère de Balak s’enflamma contre Balaam, et il frappa des mains. Balak dit à Balaam : « Je t’ai appelé pour maudire mes ennemis, et voilà que tu les as bel et bien bénis, par trois fois[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tu as béni, béni », tournure emphatique qui souligne la bénédiction répétée ou appuyée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: la colère de Balak s’enflamma contre Balaam
  rationale: Cette formulation conserve l’image hébraïque de la colère qui brûle tout en restant naturelle et soutenue en français moderne.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: il frappa des mains
  rationale: Le geste exprime ici la colère ou l’exaspération. « Frapper des mains » évite la connotation positive que pourrait avoir « applaudir ».
- source_word: לָקֹב אֹיְבַי
  choice: pour maudire mes ennemis
  rationale: Rend directement le but de l’appel adressé à Balaam et le sens courant de לָקֹב dans ce contexte.
- source_word: קְרָאתִיךָ
  choice: Je t’ai appelé
  rationale: Équivalent simple et naturel du verbe hébreu; le complément de but précise qu’il s’agit d’une convocation.
- source_word: וְהִנֵּה
  choice: et voilà que
  rationale: Cette tournure française marque à la fois l’attention et le résultat inattendu dénoncé par Balak.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: tu les as bel et bien bénis
  rationale: « Bel et bien » restitue l’emphase produite par le verbe suivi de l’infinitif absolu sans ajouter l’idée plus interprétative de « ne rien faire d’autre que ».
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: par trois fois
  rationale: Expression française naturelle et légèrement solennelle qui souligne la répétition constatée jusqu’à ce moment.
