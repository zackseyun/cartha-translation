  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: fr
  text: Mais des navires viendront des côtes de Kittim[a] ; ils opprimeront Assour[b], ils opprimeront Éber[c] ; lui aussi[d] ira à sa perte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kittim peut désigner précisément Chypre ou, plus largement, des peuples maritimes occidentaux.
    reason: alternative_reading
  - marker: b
    text: Assour peut aussi être rendu par « l’Assyrie ».
    reason: lexical_alternative
  - marker: c
    text: Éber peut désigner un peuple portant ce nom, les Hébreux ou des populations situées « au-delà » d’une frontière telle que l’Euphrate.
    reason: alternative_reading
  - marker: d
    text: L’hébreu porte « lui aussi ». L’antécédent est incertain ; certains comprennent l’expression dans un sens collectif, « cela aussi », ou l’appliquent à un chef représentant la puissance venue de Kittim.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: des navires
  rationale: Le nom désigne des bâtiments de mer. « Des navires » est naturel en français et n’ajoute pas la notion plus précise de flotte ou de navires de guerre.
- source_word: מִיַּד
  choice: des côtes de
  rationale: L’expression signifie littéralement « de la main de », mais peut indiquer le côté ou la région d’un lieu. Dans le contexte de navires, « des côtes de » rend naturellement sa portée géographique et maritime.
- source_word: כִּתִּים
  choice: Kittim
  rationale: La translittération conserve le nom ou la désignation collective de l’hébreu sans trancher entre Chypre et un ensemble plus large de peuples maritimes occidentaux.
- source_word: וְעִנּוּ
  choice: ils opprimeront
  rationale: Au piel, ענה peut signifier affliger, humilier ou opprimer. Dans ce contexte de domination de peuples, « opprimeront » est clair et naturel, sans préciser la forme exacte de l’assujettissement.
- source_word: אַשּׁוּר
  choice: Assour
  rationale: « Assour » reproduit le nom hébreu et maintient l’ambiguïté possible entre un peuple, un territoire et la puissance assyrienne.
- source_word: עֵבֶר
  choice: Éber
  rationale: 'La translittération préserve l’incertitude du référent : nom de peuple, Hébreux ou populations situées « au-delà » d’une frontière.'
- source_word: וְגַם הוּא
  choice: lui aussi
  rationale: Le pronom hébreu est masculin singulier. « Lui aussi » en respecte la forme tout en laissant son antécédent indéterminé.
- source_word: עֲדֵי אֹבֵד
  choice: ira à sa perte
  rationale: Cette expression française idiomatique conserve le mouvement vers une issue de destruction exprimé par l’hébreu, sans introduire l’idée plus forte d’une perdition éternelle.
theological_decisions:
- issue: Identification de Kittim, d’Assour, d’Éber et de l’antécédent du pronom final
  choice: Conserver les noms Kittim, Assour et Éber, puis rendre le pronom final au masculin singulier sans identifier son référent historique.
  alternative: Identifier Kittim à Chypre ou aux puissances maritimes occidentales, Assour à l’Assyrie, Éber aux Hébreux ou aux peuples d’au-delà de l’Euphrate, et rapporter le pronom à Kittim, à son chef ou à une autre puissance.
  rationale: La prophétie demeure historiquement discutée. Le texte hébreu ne tranche pas ces identifications ; la traduction conserve donc son ambiguïté et sa tension interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « ils opprimeront » reproduit la structure hébraïque et son effet solennel. Les noms propres et le pronom singulier sont conservés afin de ne pas résoudre les ambiguïtés historiques du texte.
