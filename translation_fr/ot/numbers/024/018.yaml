  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: fr
  text: Édom deviendra une possession ; Séir aussi deviendra une possession pour ses ennemis[a], tandis qu’Israël fera preuve de vaillance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le possessif « ses » traduit un suffixe masculin singulier. Il peut renvoyer à Séir/Édom ou au souverain évoqué dans l’oracle qui précède.
    reason: alternative_reading
  - marker: b
    text: Littéralement, l’hébreu dit qu’Israël « fait » la force/la vaillance ; l’expression signifie agir avec force ou faire preuve de vaillance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: deviendra
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction a une valeur future et résultative. « Deviendra » exprime naturellement le passage à la condition annoncée.
- source_word: יְרֵשָׁה
  choice: une possession
  rationale: Le nom désigne ce dont on prend possession ou ce que l’on occupe. « Une possession » convient au contexte de conquête sans introduire indûment la notion plus familiale d’héritage.
- source_word: שֵׂעִיר
  choice: Séir
  rationale: Nom propre géographique parallèle à Édom. Le texte hébreu ne comporte pas ici de terme signifiant explicitement « mont ».
- source_word: אֹיְבָיו
  choice: ses ennemis
  rationale: Le suffixe hébreu est masculin singulier. Le possessif français « ses » en conserve l’ambiguïté référentielle, puisqu’il peut renvoyer soit à Séir/Édom, soit au souverain singulier évoqué dans l’oracle.
- source_word: וְיִשְׂרָאֵל
  choice: tandis qu’Israël
  rationale: « Tandis que » rend de manière idiomatique le rapport de concomitance entre la conquête annoncée et l’action puissante d’Israël, sans exclure le simple sens coordonnant de la conjonction.
- source_word: עֹשֶׂה חָיִל
  choice: déploiera sa puissance
  rationale: L’expression signifie littéralement « fait/accomplit la puissance, la vaillance ». Cette formulation française actuelle conserve l’idée d’une force manifestée en action et la valeur future du contexte prophétique.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans אֹיְבָיו
  choice: Conserver le possessif ambigu « ses ennemis » dans le texte principal.
  alternative: Expliciter « les ennemis du souverain » ou comprendre « les ennemis de Séir/Édom ».
  rationale: 'L’hébreu porte un suffixe masculin singulier, mais son antécédent demeure discuté. En français, « ses » permet de préserver cette tension : il peut se rapporter grammaticalement à Séir, nom masculin, ou au souverain singulier annoncé dans le contexte immédiat, sans imposer une interprétation messianique ou nationale.'
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « deviendra une possession » est maintenue pour refléter le parallélisme hébreu. « Déploiera sa puissance » évite une tournure archaïque tout en gardant la vigueur martiale de l’idiome.
