  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: fr
  text: 'Puis il vit Amalec. Il prononça son discours[a] et dit : « Amalec est le premier des peuples[b], mais sa fin est la ruine[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il proféra son oracle », « il prononça sa parole proverbiale » ou « il entonna son chant satirique » ; le terme hébreu peut désigner une déclaration poétique, un proverbe, une satire ou un oracle.
    reason: lexical_alternative
  - marker: b
    text: Ou « le plus éminent des peuples » ; l’hébreu peut évoquer soit la priorité dans le temps, soit la prééminence.
    reason: lexical_alternative
  - marker: c
    text: Ou « sa fin est de périr » ou « son dernier sort est la destruction » ; l’expression hébraïque est concise et met l’accent sur une ruine complète.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת־עֲמָלֵק
  choice: Puis il vit Amalec
  rationale: Le verbe ראה garde son sens ordinaire, « voir », et « puis » rend naturellement la progression narrative du waw consécutif.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Il prononça son poème
  rationale: Dans le cycle de Balaam, מָשָׁל désigne une parole poétique solennelle. « Poème » reste naturel en français et évite de réduire le terme à un simple proverbe ou d'imposer le sens technique d'oracle.
- source_word: רֵאשִׁית גּוֹיִם
  choice: le premier des peuples
  rationale: רֵאשִׁית peut exprimer soit l'antériorité, soit la prééminence. Cette formulation française conserve dans une certaine mesure cette ambiguïté, explicitée en note.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre hébreu, qui représente ici le peuple.
- source_word: וְאַחֲרִיתוֹ
  choice: mais sa fin
  rationale: אַחֲרִית désigne la fin, l'issue ou le destin ultérieur. « Mais » rend le contraste implicite entre la position initiale d'Amalec et son issue.
- source_word: עֲדֵי אֹבֵד
  choice: sera la destruction
  rationale: L'expression hébraïque est elliptique et présente la disparition comme l'issue finale. Cette formulation conserve sa concision sans ajouter explicitement « pour toujours ».
theological_decisions:
- issue: Sens du statut d'Amalec dans רֵאשִׁית גּוֹיִם
  choice: Conserver l'ambiguïté entre priorité chronologique et prééminence.
  alternative: Traduire exclusivement « le plus ancien des peuples » ou « le plus éminent des peuples ».
  rationale: Le texte hébreu ne tranche pas entre ces deux nuances; la traduction et la note évitent donc d'imposer une reconstruction historique ou une interprétation théologique.
- issue: Portée de עֲדֵי אֹבֵד
  choice: Rendre l'issue comme « la destruction » sans introduire explicitement l'éternité.
  alternative: « périra pour toujours » ou « disparaîtra complètement ».
  rationale: La formule souligne une ruine définitive, mais aucun adverbe hébreu signifiant directement « éternellement » ne doit être ajouté au texte principal.
translation_notes:
  register: Français international moderne, sobre et solennel. « Prononça son poème » signale le caractère poétique de la parole sans employer un terme confessionnel ou excessivement technique. Les marqueurs [a] et [b] figurent dans le texte principal.
