source:
  edition: WLC
  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: fr
  text: 'Qu’elles sont belles[a], tes tentes, Jacob,

    tes demeures, Israël !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’elles sont bonnes / agréables, tes tentes… tes lieux d’habitation. » L’hébreu exprime ici une vive admiration.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה טֹּבוּ
  choice: Qu’elles sont belles
  rationale: מַה introduit ici une exclamation admirative, non une question. Dans ce contexte visuel et poétique, « belles » rend naturellement la valeur de טוֹב (« bonnes, agréables, belles »), tout en signalant en note son étendue sémantique.
- source_word: אֹהָלֶיךָ
  choice: tes tentes
  rationale: אֹהֶל désigne ordinairement une tente. Le contexte est celui du campement d’Israël ; « tabernacles » introduirait à tort une connotation cultuelle.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom est conservé et sert ici de désignation poétique collective du peuple.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: tes demeures
  rationale: מִשְׁכָּן désigne des lieux d’habitation. « Demeures » préserve le parallélisme avec « tentes » sans confondre ces habitations avec le sanctuaire.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom est conservé ; en parallèle avec « Jacob », il désigne poétiquement le peuple d’Israël.
theological_decisions:
- issue: Faut-il employer le vocabulaire traditionnel de « tabernacles » ?
  choice: Employer « tentes » et « demeures ».
  alternative: « tabernacles »
  rationale: Le verset décrit le camp et les habitations d’Israël, sans référence nécessaire au sanctuaire. « Tabernacles » importerait une association cultuelle absente du contexte.
translation_notes:
  register: Poésie brève, actuelle et digne. Le tutoiement convient à l’adresse directe faite aux figures collectives « Jacob » et « Israël ». Le point d’exclamation et la tournure « Qu’elles sont… » rendent la force admirative de l’hébreu.
