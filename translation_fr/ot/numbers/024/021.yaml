  text: וַ/יַּרְא֙ אֶת הַ/קֵּינִ֔י וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר אֵיתָן֙ מֽוֹשָׁבֶ֔/ךָ וְ/שִׂ֥ים בַּ/סֶּ֖לַע קִנֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: fr
  text: 'Puis il vit le Qénite. Il prononça son oracle[a] et dit :


    « Ta demeure est solide,

    et place ton nid dans le rocher. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner une sentence, un proverbe ou une déclaration poétique solennelle ; ici, il introduit l’oracle poétique de Balaam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: les Qénites
  rationale: Le singulier hébreu désigne ici collectivement le peuple qénite. Le pluriel est la manière la plus naturelle de rendre ce collectif en français moderne.
- source_word: מְשָׁלוֹ
  choice: son oracle
  rationale: Dans le cycle de Balaam, מָשָׁל désigne une déclaration poétique solennelle à portée prophétique. « Oracle » exprime clairement cette fonction, tandis que « proverbe » serait trop étroit.
- source_word: אֵיתָן
  choice: solide
  rationale: L’adjectif évoque la fermeté et la stabilité durable de la demeure. « Solide » conserve cette image concrète sans expliciter excessivement la notion de sécurité.
- source_word: מוֹשָׁבֶךָ
  choice: ta demeure
  rationale: Le nom désigne le lieu où l’on habite ou s’établit. « Demeure » convient au parallélisme poétique et reste clair en français actuel.
- source_word: וְשִׂים
  choice: est placé
  rationale: La forme massorétique se lit formellement comme un impératif, mais la ligne est couramment comprise comme décrivant la position sûre du nid. Le rendu prédicatif produit un parallélisme naturel; la lecture impérative est conservée en note.
- source_word: בַּסֶּלַע
  choice: dans le rocher
  rationale: סֶלַע désigne une masse rocheuse, un rocher ou un escarpement. « Dans le rocher » préserve l’image d’un nid établi dans une anfractuosité rocheuse.
- source_word: קִנֶּךָ
  choice: ton nid
  rationale: Le sens concret de « nid » porte la métaphore de la communauté établie en hauteur et doit être conservé.
theological_decisions:
- issue: Valeur de וְשִׂים dans la seconde ligne
  choice: 'Lecture descriptive : « et ton nid est placé »'
  alternative: 'Lecture impérative : « place ton nid »'
  rationale: La vocalisation massorétique correspond à l’impératif « place », mais le contexte poétique permet de comprendre la ligne comme une description de l’établissement du nid. La traduction principale suit cette lecture contextuelle sans masquer l’impératif formel, signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé sur deux lignes. « Qénites » rend naturellement le singulier collectif hébreu; « demeure », « nid » et « rocher » maintiennent l’imagerie concrète du texte.
