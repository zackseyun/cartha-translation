  to: Et maintenant, voici, je vais retourner auprès de mon peuple. Viens, je vais t’indiquer ce que ce peuple fera à ton peuple[a] dans les derniers jours[b].
  rationale: 'La révision améliore l’idiomaticité française tout en conservant les éléments sémantiques marqués du texte hébreu : l’emphase de הִנְנִי, le départ vers le propre peuple de Balaam, l’ambiguïté relationnelle de לְעַמְּךָ et la portée prophétique, sans schéma eschatologique imposé, de בְּאַחֲרִית הַיָּמִים. Les ancres de notes restent attachées aux expressions pertinentes.'
