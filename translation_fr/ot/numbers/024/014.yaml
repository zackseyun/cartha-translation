source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: fr
  text: Et maintenant, voici, je vais retourner auprès de mon peuple. Viens, je vais t’indiquer ce que ce peuple fera à ton peuple[a] dans les derniers jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre ton peuple ». La préposition hébraïque signifie littéralement « à » ou « envers », mais le contexte peut impliquer une action hostile.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les jours à venir ». L’expression hébraïque peut désigner l’avenir de manière générale, tout en conservant ici une portée prophétique.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Marque la transition dans le discours tout en conservant la valeur connective de וְ et la valeur temporelle de עַתָּה.
- source_word: הִנְנִי הוֹלֵךְ לְעַמִּי
  choice: voici que je m’en vais rejoindre mon peuple
  rationale: « Voici que » maintient l’emphase de הִנְנִי, tandis que « je m’en vais rejoindre » exprime naturellement en français le mouvement imminent vers le peuple auquel Balaam appartient.
- source_word: לְכָה
  choice: Viens
  rationale: Cet impératif idiomatique attire l’attention de Balak et l’invite à écouter la déclaration qui suit.
- source_word: אִיעָצְךָ
  choice: je vais t’indiquer
  rationale: 'Le sens lexical fondamental est « conseiller ». Ici, cependant, la proposition qui suit donne le contenu annoncé : ce que le peuple fera dans l’avenir. « T’indiquer » rend ce fonctionnement contextuel sans transformer la parole en simple conseil stratégique.'
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Conserve le collectif singulier et la désignation démonstrative de l’hébreu.
- source_word: לְעַמְּךָ
  choice: à ton peuple
  rationale: Reproduit la préposition לְ sans expliciter dans le texte principal une hostilité que le contexte peut néanmoins impliquer.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: dans la suite des temps
  rationale: Cette formulation française conserve la portée prophétique de l’expression tout en pouvant désigner plus largement une époque future, sans imposer à elle seule un scénario eschatologique précis.
theological_decisions:
- issue: Portée temporelle et prophétique de בְּאַחֲרִית הַיָּמִים
  choice: dans la suite des temps
  alternative: dans les jours à venir
  rationale: L’expression peut renvoyer à un avenir encore éloigné et porter une résonance eschatologique, sans que ce verset exige à lui seul une compréhension technique de la fin des temps. Le texte principal préserve cette tension, et la note signale le sens futur plus général.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici que » conserve l’emphase du discours prophétique sans archaïsme excessif. Les notes sont placées exactement sur les expressions auxquelles elles se rapportent.
