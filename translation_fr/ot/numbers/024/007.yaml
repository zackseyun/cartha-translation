source:
  edition: WLC
  text: יִֽזַּל מַ֨יִם֙ מִ/דָּ֣לְיָ֔/ו וְ/זַרְע֖/וֹ בְּ/מַ֣יִם רַבִּ֑ים וְ/יָרֹ֤ם מֵֽ/אֲגַג֙ מַלְכּ֔/וֹ וְ/תִנַּשֵּׂ֖א מַלְכֻתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: fr
  text: L’eau coulera de ses seaux, et sa semence sera dans des eaux abondantes ; son roi s’élèvera plus haut qu’Agag, et son royaume sera exalté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִזַּל
  choice: ruissellera
  rationale: Le verbe exprime l’écoulement d’un liquide. « Ruissellera » rend naturellement l’image d’une eau qui s’écoule en abondance, sans la réduire à un simple goutte-à-goutte.
- source_word: מַיִם
  choice: L’eau
  rationale: Bien que le nom hébreu ait une forme plurielle, « l’eau » est ici le nom massif idiomatique en français.
- source_word: מִדָּלְיוֹ
  choice: de ses seaux
  rationale: דְּלִי désigne ordinairement un seau servant à puiser de l’eau. Ce sens concret convient à l’imagerie immédiate du verset.
- source_word: וְזַרְעוֹ
  choice: et sa semence
  rationale: זֶרַע peut désigner la semence ou la descendance. « Semence » conserve dans ce contexte poétique la résonance possible de la fertilité comme de la postérité.
- source_word: בְּמַיִם רַבִּים
  choice: au milieu d’eaux abondantes
  rationale: Cette formulation rend la préposition בְּ et l’image d’un environnement richement pourvu en eau, tout en restant naturelle en français poétique.
- source_word: וְיָרֹם
  choice: s’élèvera plus haut
  rationale: רוּם exprime l’élévation et introduit ici une comparaison avec Agag. Cette formulation maintient la distinction avec le verbe d’exaltation du dernier membre.
- source_word: מֵאֲגַג
  choice: qu’Agag
  rationale: 'Après le verbe d’élévation, מִן marque naturellement la comparaison : « plus haut qu’Agag ».'
- source_word: מַלְכּוֹ
  choice: son roi
  rationale: מֶלֶךְ signifie directement « roi ». La traduction ne précise pas l’identité de ce roi au-delà du texte.
- source_word: וְתִנַּשֵּׂא
  choice: sera exalté
  rationale: La forme verbale exprime le fait d’être élevé ou exalté. « Sera exalté » convient au registre royal et conserve le passif hébreu.
- source_word: מַלְכֻתוֹ
  choice: son royaume
  rationale: מַלְכוּת peut signifier royaume, royauté ou règne. « Royaume » exprime naturellement ici la domination royale envisagée dans son étendue.
theological_decisions:
- issue: Référent de « sa semence »
  choice: Maintien de « sa semence » sans préciser s’il s’agit de fertilité agricole, de descendance, ou des deux.
  alternative: « sa descendance » ou « ses descendants »
  rationale: Le mot זֶרַע porte ces différents sens, et le parallélisme poétique peut intentionnellement les faire résonner ensemble.
- issue: Identité de « son roi » et rapport avec Agag
  choice: 'Traduction générique : « son roi s’élèvera plus haut qu’Agag ».'
  alternative: Identifier explicitement le roi à Saül, David, au Messie ou à une autre figure.
  rationale: L’oracle annonce l’élévation royale d’Israël sans nommer ce roi. La traduction évite donc d’introduire une identification théologique ultérieure.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, ainsi que l’ambiguïté de « semence ». Aucun marqueur de note n’est nécessaire puisque toutes les ambiguïtés essentielles sont maintenues dans le texte ou documentées dans les décisions.
