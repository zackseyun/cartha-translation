source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: fr
  text: 'Déclaration de celui qui entend les paroles de Dieu[a], qui connaît la connaissance du Très-Haut, qui voit la vision du Tout-Puissant, tombant, les yeux découverts[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dires de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tombant, les yeux découverts »; certains comprennent qu’il s’agit d’un état de transe visionnaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: déclaration de
  rationale: Introduit solennellement une parole prophétique; « déclaration » est clair, digne et naturel en français moderne.
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: celui qui entend les paroles de Dieu
  rationale: Le participe décrit une caractéristique durable, et « paroles de Dieu » rend naturellement le groupe construit sans traiter אֵל comme un nom propre.
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: qui connaît la connaissance du Très-Haut
  rationale: 'Cette formulation conserve la répétition sémantique et l’ambiguïté du rapport génitif: connaissance que possède, concerne ou donne le Très-Haut.'
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: qui voit la vision du Tout-Puissant
  rationale: Conserve le parallélisme poétique et traduit שַׁדַּי par son titre français traditionnel.
- source_word: נֹפֵל
  choice: tombant
  rationale: Rend littéralement le participe sans imposer l’interprétation plus précise d’un état de transe ou d’une posture prosternée.
- source_word: וּגְלוּי עֵינָיִם
  choice: mais les yeux découverts
  rationale: Préserve l’image hébraïque inhabituelle; « mais » exprime naturellement le contraste contextuel sans remplacer l’image par « yeux ouverts ».
theological_decisions:
- issue: Traduction des titres divins אֵל, עֶלְיוֹן et שַׁדַּי
  choice: Dieu / le Très-Haut / le Tout-Puissant
  alternative: El / Élyôn / Shaddaï
  rationale: Dans ce contexte, ces termes fonctionnent comme des désignations ou titres divins; les traduire communique leur sens au lecteur francophone sans les transformer en noms propres.
- issue: Nature de la chute décrite par נֹפֵל
  choice: tombant
  alternative: prosterné / en état de transe
  rationale: Le texte nomme une chute sans en préciser explicitement la nature. La traduction principale conserve cette indétermination, tandis que la note signale l’interprétation visionnaire possible.
translation_notes:
  register: Français international moderne, solennel et poétique. La syntaxe en cascade garde la forme d’une déclaration prophétique. Les expressions volontairement singulières « connaît la connaissance » et « les yeux découverts » préservent la densité et les images de l’hébreu.
