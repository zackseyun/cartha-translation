  terminology: « Dieu », « le Très-Haut » et « le Tout-Puissant » rendent adéquatement les titres אֵל, עֶלְיוֹן et שַׁדַּי. « Déclaration » convient à נְאֻם. La note a doit proposer une véritable alternative pour אִמְרֵי, non « déclarations », qui risque de se confondre avec נְאֻם.
