id: NUM.2.9
reference: Numbers 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה יְהוּדָ֗ה מְאַ֨ת אֶ֜לֶף וּ/שְׁמֹנִ֥ים אֶ֛לֶף וְ/שֵֽׁשֶׁת אֲלָפִ֥ים וְ/אַרְבַּע מֵא֖וֹת לְ/צִבְאֹתָ֑/ם רִאשֹׁנָ֖ה יִסָּֽעוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: fr
  text: Le total des recensés[a] du camp de Juda était de 186 400, selon leurs unités[b]. Ils se mettront en route les premiers[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dénombrés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « selon leurs corps de troupe » ou « selon leurs armées ».
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi traduire : « Ils lèveront le camp les premiers. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Le total des recensés
  rationale: Dans cette formule récapitulative, כָּל introduit l’ensemble des personnes comptées. « Le total des recensés » rend naturellement en français la portée globale de l’expression, tandis que « recensés » conserve le sens passif de פקד dans un contexte de dénombrement et d’organisation militaire.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: du camp de Juda
  rationale: Le לְ marque ici l’appartenance ou le rattachement au grand ensemble formé autour de Juda. « Du camp de Juda » est idiomatique et précis dans le contexte du chapitre.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 186 400
  rationale: La notation chiffrée reproduit exactement la somme hébraïque et facilite la lecture dans cette section de recensement. L’espace suit l’usage typographique français pour les milliers.
- source_word: לְצִבְאֹתָם
  choice: selon leurs unités
  rationale: צָבָא peut désigner une armée, une troupe ou un corps organisé. « Unités » exprime ici l’organisation collective et militaire sans évoquer indûment une armée permanente au sens moderne.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: Ils se mettront en route les premiers
  rationale: נסע désigne le départ d’un camp ou la mise en marche, et רִאשֹׁנָה indique l’ordre du départ. Cette formulation est naturelle en français tout en conservant le futur de l’hébreu.
