translation:
  language: fr
  text: 'et son contingent, et les personnes recensées parmi eux : cinquante-neuf mille trois cents.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: et son corps d’armée
  rationale: Dans le contexte du recensement et de l’organisation du camp, צָבָא désigne le contingent organisé de la tribu. « Corps d’armée » exprime clairement cette réalité collective et militaire dans un français actuel et digne.
- source_word: וּפְקֻדֵיהֶם
  choice: avec ceux qui en avaient été recensés
  rationale: Le terme désigne les personnes comptées lors du recensement. « Recensés » convient au contexte immédiat, tandis que « en » reprend le groupe tribal sans ajouter explicitement « hommes » dans cette proposition.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף
  choice: cinquante-neuf mille
  rationale: L’ordre hébreu, littéralement « neuf et cinquante mille », est rendu selon l’ordre numérique naturel du français moderne, sans modifier la valeur.
- source_word: וּשְׁלֹשׁ מֵאוֹת
  choice: trois cents
  rationale: Cette expression complète le total. En français, « cent » prend ici la marque du pluriel puisqu’il est multiplié et n’est suivi d’aucun autre nombre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu. La formulation conserve le lien syntaxique avec le verset précédent et le caractère militaire du contexte, sans employer l’archaïsme « armée » au sens de multitude ni ajouter de précision absente de l’hébreu.
