  variant: modern international French
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה דָ֛ן צָפֹ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י דָ֔ן אֲחִיעֶ֖זֶר בֶּן עַמִּֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: fr
  text: L’étendard du camp de Dan sera au nord, selon leurs divisions[a] ; le chef des fils de Dan sera Ahiézer, fils d’Ammishaddaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs corps d’armée » ou « selon leurs unités ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: étendard
  rationale: Désigne l’emblème tribal autour duquel le camp est organisé. « Étendard » convient au contexte militaire et cérémoniel sans être obscur.
- source_word: מַחֲנֵה
  choice: camp
  rationale: Terme naturel et précis pour le camp tribal organisé dans Nombres 2.
- source_word: צָפֹנָה
  choice: au nord
  rationale: La forme directionnelle indique ici la position du camp sur le côté nord de l’ensemble.
- source_word: לְצִבְאֹתָם
  choice: selon leurs divisions
  rationale: Le terme צָבָא évoque des groupes organisés, de type militaire. « Divisions » exprime cet ordre collectif tout en restant compréhensible en français moderne.
- source_word: וְנָשִׂיא
  choice: le chef
  rationale: Dans ce cadre tribal et administratif, נָשִׂיא désigne le responsable reconnu de la tribu ; « chef » évite la connotation monarchique de « prince ».
- source_word: לִבְנֵי דָן
  choice: des fils de Dan
  rationale: Conserve la désignation tribale masculine formelle du texte hébreu.
- source_word: אֲחִיעֶזֶר
  choice: Ahiézer
  rationale: Translittération française usuelle du nom propre.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: fils d’Ammishaddaï
  rationale: Rend directement la construction patronymique et suit les conventions françaises de translittération biblique.
theological_decisions:
- issue: Désignation tribale genrée בְנֵי
  choice: fils de Dan
  alternative: descendants de Dan / membres de la tribu de Dan
  rationale: Le masculin pluriel constitue ici la désignation tribale formelle. Le conserver respecte la formulation du texte sans imposer une reformulation interprétative inclusive.
translation_notes:
  register: Français international moderne, digne et lisible. La structure nominale hébraïque est explicitée par « sera », comme l’exige le français. Le point-virgule distingue les deux propositions coordonnées sans alourdir la phrase.
