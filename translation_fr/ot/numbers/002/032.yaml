  variant: modern international French
source:
  edition: WLC
  text: אֵ֛לֶּה פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל פְּקוּדֵ֤י הַֽ/מַּחֲנֹת֙ לְ/צִבְאֹתָ֔/ם שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: fr
  text: Voici les hommes recensés[a] parmi les fils d’Israël[b], selon leurs maisons paternelles[c]. Tous les hommes recensés des camps, selon leurs unités[d], étaient au nombre de six cent trois mille cinq cent cinquante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui avaient été recensés » ou « les hommes enregistrés ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire selon leurs groupes familiaux issus de la lignée paternelle.
    reason: cultural_clarification
  - marker: d
    text: Ou « selon leurs divisions », « selon leurs corps d’armée » ou « selon leurs armées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: les hommes recensés
  rationale: Le terme désigne ici les personnes enregistrées lors du recensement. Le contexte de Nombres 1–2 précise qu’il s’agit des hommes en âge de servir dans l’armée ; « hommes » explicite donc le référent contextuel sans être un mot distinct dans ce verset.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’image familiale et collective de l’hébreu, tout en restant compréhensible en français biblique moderne.
- source_word: לְבֵית אֲבֹתָם
  choice: selon leurs maisons paternelles
  rationale: Le choix maintient la structure patrilinéaire explicitement exprimée par l’hébreu. « Maisons » désigne ici des groupes de parenté, non des bâtiments.
- source_word: הַמַּחֲנֹת
  choice: les camps
  rationale: Le mot renvoie aux formations tribales disposées autour du sanctuaire ; « camps » est direct et naturel.
- source_word: לְצִבְאֹתָם
  choice: selon leurs unités
  rationale: Dans ce contexte, צְבָאוֹת désigne des groupements organisés à caractère militaire. « Unités » rend l’organisation sans suggérer nécessairement des armées engagées au combat.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: six cent trois mille cinq cent cinquante
  rationale: Le nombre 603 550 est écrit en toutes lettres afin de conserver le ton solennel du récapitulatif hébreu.
theological_decisions:
- issue: Langage genré du recensement
  choice: les hommes recensés
  alternative: les personnes recensées ; ceux qui avaient été recensés
  rationale: Même si « hommes » n’est pas un lexème séparé dans ce verset, le contexte immédiat définit les recensés comme les hommes adultes aptes au service militaire. Le rendre explicitement évite de neutraliser le référent historique.
- issue: Portée militaire de צְבָאוֹת
  choice: unités
  alternative: corps d’armée ; armées
  rationale: Le contexte présente Israël comme un camp organisé en formations susceptibles de servir militairement, mais le verset ne décrit pas un combat. « Unités » préserve cette organisation sans accentuer indûment l’idée de guerre.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe garde la structure récapitulative du verset tout en ajoutant « Au total » et « étaient au nombre de » pour une lecture française naturelle. Les termes familiaux et militaires de l’hébreu sont conservés ou signalés en note sans archaïsme excessif.
