  text: 'And his division[a], those numbered from them: forty thousand and five hundred.'
translation:
  language: fr
  text: Son contingent, selon le recensement, était de 40 500 hommes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les enrôlés ». Le terme hébreu désigne les personnes inscrites ou dénombrées pour le service dans le cadre du recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Son corps d’armée
  rationale: Dans le contexte de l’organisation du camp et du recensement militaire, צָבָא désigne ici le contingent organisé de la tribu. « Corps d’armée » rend ce sens collectif et militaire sans évoquer l’armée entière.
- source_word: וּפְקֻדֵיהֶם
  choice: avec ceux d’entre eux qui furent recensés
  rationale: La forme issue de פקד désigne les personnes dénombrées ou enrôlées lors du recensement. « D’entre eux » conserve le suffixe pluriel hébreu, tandis que « recensés » convient naturellement au contexte.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 40 500
  rationale: Rendu numérique clair et conforme à l’usage français moderne.
