  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: fr
  text: Son contingent[a], avec les hommes recensés parmi eux[b], comptait 41 500 hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son armée » ou « son corps » ; le terme hébreu peut désigner un contingent militaire ou un groupe organisé dans le cadre du camp et du recensement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui furent dénombrés parmi eux » ou « leurs hommes recensés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Son corps d’armée
  rationale: Dans le contexte du recensement et de l’organisation du camp, צָבָא désigne le contingent organisé de la tribu. « Corps d’armée » conserve la dimension militaire sans suggérer qu’un combat est en cours.
- source_word: וּפְקֻדֵיהֶם
  choice: ceux d’entre eux qui avaient été recensés
  rationale: Cette expression issue de פקד désigne les personnes comptées ou passées en revue lors du recensement. La formulation française rend explicitement la relation entre le contingent et son effectif.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 41 500
  rationale: Le nombre hébreu est rendu selon l’ordre et la notation usuels du français contemporain.
