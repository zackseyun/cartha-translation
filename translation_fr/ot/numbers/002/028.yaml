  register: Français international moderne, clair et digne. La syntaxe nominale hébraïque est transformée en phrase française naturelle avec « comptait ». « Hommes » est précisé d’après le contexte immédiat du recensement militaire, tout en laissant la note expliquer la formulation littérale.
