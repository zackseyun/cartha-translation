  text: Son contingent — les hommes qui y étaient recensés — comptait 46 500 hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: son corps
  rationale: Dans le contexte du recensement et de l’organisation du camp, צָבָא désigne le contingent organisé de la tribu. « Corps » conserve cette dimension collective et militaire sans suggérer nécessairement des combats en cours.
- source_word: פְקֻדָיו
  choice: les hommes qui y avaient été recensés
  rationale: Le terme issu de פקד désigne ici les personnes dénombrées lors du recensement. La formulation française explicite naturellement le lien avec le corps tribal et le caractère accompli du recensement.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 46 500
  rationale: Le total hébreu est rendu selon la notation numérique française contemporaine, avec une espace comme séparateur des milliers.
