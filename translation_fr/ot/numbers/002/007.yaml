  text: מַטֵּ֖ה זְבוּלֻ֑ן וְ/נָשִׂיא֙ לִ/בְנֵ֣י זְבוּלֻ֔ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/007.yaml
  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: fr
  text: 'la tribu de Zabulon, et le chef des fils de Zabulon[a] : Éliab, fils de Hélôn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les fils de Zabulon ». La préposition hébraïque peut se rendre de plusieurs manières très proches dans cette formule d’organisation tribale.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans le contexte du recensement et de l’organisation du camp en Nombres, le terme désigne une division tribale, non un bâton matériel.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: וְנָשִׂיא
  choice: et le chef
  rationale: Dans cette formule administrative, נָשִׂיא désigne le responsable reconnu de la tribu. « Chef » est naturel et n’implique pas à tort un statut monarchique.
- source_word: לִבְנֵי זְבוּלֻן
  choice: des fils de Zabulon
  rationale: Cette formulation reste proche de l’expression hébraïque et conserve son langage généalogique et tribal; la préposition ל peut aussi exprimer l’idée de représentation ou d’attribution.
- source_word: אֱלִיאָב
  choice: Éliab
  rationale: Transcription française usuelle du nom propre.
- source_word: בֶּן חֵלֹן
  choice: fils de Hélôn
  rationale: Rendu direct de la construction patronymique hébraïque.
