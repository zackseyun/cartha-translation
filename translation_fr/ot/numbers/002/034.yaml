  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: fr
  text: Les Israélites[a] firent tout ce que Yahweh avait ordonné à Moïse. C’est ainsi qu’ils campèrent sous leurs étendards[b], et c’est ainsi qu’ils partirent, chacun selon ses clans, selon sa maison paternelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: La note rend visible la forme de l’expression hébraïque derrière la désignation collective naturelle « les Israélites ».
  - marker: b
    text: 'Ou : « selon leurs étendards ».'
    reason: Le terme hébreu désigne l’étendard, et peut aussi évoquer le groupement organisé autour de lui.
  - marker: c
    text: 'Littéralement : « chacun selon ses clans, selon la maison de ses pères ».'
    reason: La formule hébraïque exprime les divisions de parenté par clans et par maison ancestrale paternelle.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: firent
  rationale: Le verbe עשה résume ici l’obéissance d’Israël aux instructions précédentes. « Firent » est direct et naturel en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette expression collective désigne le peuple d’Israël. « Les Israélites » est plus naturel en français moderne que le calque « les fils d’Israël », lequel est signalé en note.
- source_word: כְּכֹל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure exprime clairement la totalité des commandements auxquels le peuple s’est conformé, sans alourdir la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre, conformément au tétragramme hébreu, plutôt que remplacé par un titre.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: avait ordonné à Moïse
  rationale: Le plus-que-parfait marque naturellement en français que l’ordre avait précédé son exécution.
- source_word: כֵּן ... וְכֵן
  choice: C’est ainsi que ... et c’est ainsi que
  rationale: La répétition reproduit l’insistance de l’hébreu sur la correspondance exacte entre l’ordre donné et l’action du peuple.
- source_word: חָנוּ
  choice: campèrent
  rationale: Ce verbe rend directement l’installation du camp dans un registre narratif digne et courant.
- source_word: לְדִגְלֵיהֶם
  choice: près de leurs étendards
  rationale: דגל désigne ici les signes de ralliement autour desquels les groupes tribaux étaient organisés. « Étendards » conserve cette dimension structurante.
- source_word: נָסָעוּ
  choice: partirent
  rationale: Dans le contexte des déplacements du camp, « partirent » exprime clairement la mise en route sans ajouter explicitement l’idée de lever le camp.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif hébreu indique que chaque personne ou unité suivait l’ordre assigné. « Chacun » en conserve la force sans lourdeur.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: selon son clan
  rationale: Dans l’organisation tribale d’Israël, מִשְׁפָּחָה désigne souvent un clan ou un groupe familial élargi plutôt qu’une famille nucléaire.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: et sa famille paternelle
  rationale: L’expression désigne l’unité de parenté rattachée à la lignée du père. Cette formulation moderne garde l’idée sociale de la « maison des pères ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « C’est ainsi que » conserve la structure emphatique de l’hébreu. Le passé simple convient à ce résumé narratif, tandis que les termes « clan », « famille paternelle » et « étendards » rendent accessibles les structures sociales et militaires du passage.
