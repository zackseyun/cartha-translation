    issue: « près de leurs étendards »
    rationale: Le texte hébreu indique que les Israélites campaient par rapport à leurs étendards, c’est-à-dire dans l’organisation définie par eux; « près de » ajoute une simple proximité qui n’est pas le point du texte.
  - severity: low
