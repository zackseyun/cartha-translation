  verdict: revise
  source_fidelity: 'La formulation « près de leurs étendards » introduit une relation spatiale de proximité qui n’est pas explicitement exprimée par לְדִגְלֵיהֶם et affaiblit la fonction organisatrice des étendards. La fin du verset doit aussi conserver plus nettement les deux repères distributifs : les clans et la maison paternelle.'
  naturalness: Le passé simple et la répétition « C’est ainsi que » conviennent au récit. « Sous leurs étendards » est plus naturel en français que « selon leurs étendards » tout en rendant l’organisation du camp. « Maison paternelle » est une expression claire dans ce contexte, avec une note pour la tournure hébraïque.
  terminology: « Israélites », « Yahweh », « étendards », « clans » et « maison paternelle » sont adaptés au français international moderne et respectent les termes institutionnels du passage.
