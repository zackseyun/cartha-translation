revisions:
- from: Les Israélites[a] firent tout ce que Yahweh avait ordonné à Moïse. C’est ainsi qu’ils campèrent près de leurs étendards[b], et c’est ainsi qu’ils partirent, chacun selon son clan et sa famille paternelle[c].
  to: Les Israélites[a] firent tout ce que Yahweh avait ordonné à Moïse. C’est ainsi qu’ils campèrent sous leurs étendards[b], et c’est ainsi qu’ils partirent, chacun selon ses clans, selon sa maison paternelle[c].
  rationale: La révision remplace la proximité non exprimée par l’idée organisationnelle portée par les étendards et rétablit la double structuration de la dernière proposition. Elle préserve la répétition emphatique du texte hébreu ainsi que l’ambiguïté normale de la relation aux étendards.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:28:11Z'
