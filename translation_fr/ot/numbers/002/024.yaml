  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה אֶפְרַ֗יִם מְאַ֥ת אֶ֛לֶף וּ/שְׁמֹֽנַת אֲלָפִ֥ים וּ/מֵאָ֖ה לְ/צִבְאֹתָ֑/ם וּ/שְׁלִשִׁ֖ים יִסָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: fr
  text: Tous ceux qui ont été recensés dans le camp d’Éphraïm étaient au nombre de 108 100, selon leurs divisions[a]. Ils partiront en troisième position.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs unités » ou « selon leurs contingents » ; le terme hébreu peut désigner des groupes organisés pour le service et la marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Tous les hommes recensés
  rationale: Le participe passif de פקד évoque ici le recensement à visée militaire. « Hommes » est explicité naturellement d’après le contexte immédiat de Nombres 2, où sont comptés les hommes aptes au service.
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: du camp d’Éphraïm
  rationale: Le ל marque l’appartenance au groupement placé sous la bannière d’Éphraïm; la tournure française « du camp » est naturelle et précise.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 108 100
  rationale: La notation chiffrée avec espace des milliers suit l’usage typographique français moderne et reproduit exactement le total hébreu.
- source_word: לְצִבְאֹתָם
  choice: selon leurs corps d’armée
  rationale: צָבָא désigne ici les unités organisées pour le service et la marche. « Corps d’armée » conserve la nuance militaire sans employer l’archaïque « armées » au pluriel.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: Ils partiront en troisième position
  rationale: נסע désigne la mise en route du camp, et l’ordinal indique clairement l’ordre de départ. Cette formulation est naturelle en français tout en restant proche de l’hébreu.
