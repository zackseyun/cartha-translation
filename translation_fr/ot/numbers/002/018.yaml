  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְ/צִבְאֹתָ֖/ם יָ֑מָּ/ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: fr
  text: La bannière[a] du camp d’Éphraïm, selon leurs divisions[b], sera à l’ouest[c]. Le chef des fils d’Éphraïm[d] sera Élishama, fils d’Ammihoud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étendard ».
    reason: lexical_alternative
  - marker: b
    text: Ou « selon leurs corps de troupe ». L’hébreu évoque une organisation ordonnée de type militaire.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « vers la mer », c’est-à-dire vers l’ouest.
    reason: linguistic_clarification
  - marker: d
    text: L’expression « fils d’Éphraïm » désigne ici les descendants d’Éphraïm, c’est-à-dire la tribu d’Éphraïm.
    reason: cultural_clarification
lexical_decisions:
- source_word: דֶּגֶל
  choice: bannière
  rationale: Le terme désigne le signe distinctif autour duquel s’organise un camp tribal. « Bannière » est clair en français actuel, tandis qu’« étendard » demeure une possibilité plus traditionnelle.
- source_word: מַחֲנֵה
  choice: camp
  rationale: Le nom désigne ici le camp organisé d’Éphraïm dans la disposition d’Israël.
- source_word: לְצִבְאֹתָם
  choice: selon leurs divisions
  rationale: צָבָא porte ici un sens d’organisation collective et militaire. « Divisions » conserve cette idée sans suggérer nécessairement un combat en cours; le pluriel « leurs » respecte la forme hébraïque.
- source_word: יָמָּה
  choice: à l’ouest
  rationale: L’adverbe signifie littéralement « vers la mer » et, dans l’orientation géographique israélite, désigne l’ouest. La formulation indique ici la position du camp.
- source_word: וְנָשִׂיא
  choice: le chef
  rationale: נָשִׂיא désigne le responsable tribal. « Chef » convient au contexte et évite la connotation dynastique que pourrait avoir « prince ».
- source_word: לִבְנֵי אֶפְרַיִם
  choice: des fils d’Éphraïm
  rationale: Cette traduction garde l’expression de parenté hébraïque, employée comme désignation tribale des descendants d’Éphraïm.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Élishama, fils d’Ammihoud
  rationale: Les noms sont transcrits sous des formes françaises lisibles, et בֶּן est rendu directement par « fils de ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe nominale concise de l’hébreu est explicitée par « sera », conformément à la formule de positionnement du chapitre. Les termes d’organisation tribale et militaire restent perceptibles sans archaïsme excessif.
