  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: fr
  text: À côté de lui se trouvait la tribu de Manassé[a]. Le responsable des fils de Manassé était Gamaliel, fils de Pedahtsour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Près de lui se trouvait la tribu de Manassé. » L’expression hébraïque indique que cette tribu occupait une place adjacente dans la disposition du camp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: À côté de lui se trouvait
  rationale: Dans le contexte de la disposition du camp, עַל avec suffixe exprime ici la proximité spatiale, non une position d’autorité. Cette formulation est naturelle en français.
- source_word: מַטֶּה
  choice: tribu
  rationale: Dans le contexte du recensement et de l’organisation du camp, מַטֶּה désigne l’unité tribale, et non un bâton.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Translittération française traditionnelle du nom propre et tribal.
- source_word: וְנָשִׂיא
  choice: Le responsable
  rationale: נָשִׂיא désigne le chef officiellement reconnu de la tribu. « Responsable » est clair et actuel, sans la connotation monarchique possible de « prince ».
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: des fils de Manassé
  rationale: La formulation conserve explicitement בְּנֵי, « fils de », et exprime naturellement en français le groupe lignager placé sous ce responsable.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Translittération française conventionnelle du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu usuel de la construction patronymique hébraïque.
- source_word: פְּדָהצוּר
  choice: Pedahtsour
  rationale: Translittération française du nom propre, faisant entendre les consonnes de l’hébreu פְּדָהצוּר.
