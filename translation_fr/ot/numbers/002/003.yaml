source:
  edition: WLC
  text: וְ/הַ/חֹנִים֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: fr
  text: Ceux qui camperont à l’est, du côté du soleil levant, seront sous la bannière du camp de Juda, selon leurs corps d’armée. Le chef des fils de Juda sera Nahshôn, fils d’Amminadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵדְמָה מִזְרָחָה
  choice: à l’est, du côté du soleil levant
  rationale: Conserve les deux indications directionnelles du texte hébreu, la seconde explicitant l’est par le lever du soleil.
- source_word: דֶּגֶל
  choice: bannière
  rationale: Désigne ici l’emblème autour duquel se regroupe un ensemble de tribus; « bannière » est naturel et maintient cette fonction symbolique et organisationnelle.
- source_word: מַחֲנֵה יְהוּדָה
  choice: camp de Juda
  rationale: Rend directement la construction hébraïque et désigne le groupement placé sous la conduite de Juda.
- source_word: לְצִבְאֹתָם
  choice: selon leurs corps d’armée
  rationale: Le terme צבא désigne des unités organisées, notamment militaires; « corps d’armée » convient au contexte du recensement et de l’ordonnance du camp sans réduire le sens à de simples familles.
- source_word: נָשִׂיא
  choice: chef
  rationale: Terme français courant et digne pour le responsable principal de la tribu, sans importer un titre politique moderne.
- source_word: בְּנֵי יְהוּדָה
  choice: fils de Juda
  rationale: Traduction formelle de l’expression généalogique hébraïque, naturelle dans le registre biblique français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression du verset hébreu tout en évitant une tournure excessivement littérale. Le nom נַחְשׁוֹן est translittéré « Nahshôn » afin de représenter la voyelle longue finale de la première syllabe selon l’usage biblique français.
