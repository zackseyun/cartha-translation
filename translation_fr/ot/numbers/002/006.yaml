lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: et son corps d’armée
  rationale: צָבָא désigne ici le groupement militaire organisé de la tribu dans la disposition du camp. « Corps d’armée » conserve cette dimension collective et militaire sans suggérer une armée permanente distincte du recensement; le suffixe masculin singulier est rendu par « son ».
- source_word: וּפְקֻדָיו
  choice: et ceux qui y furent recensés
  rationale: La forme issue de פקד renvoie aux hommes dénombrés lors du recensement. « Y » rattache naturellement les recensés au corps d’armée mentionné, tandis que la forme passive préserve l’idée qu’ils ont fait l’objet du dénombrement.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: cinquante-quatre mille quatre cents
  rationale: Le nombre hébreu est rendu selon l’ordre usuel du français moderne, sans modifier la quantité exacte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « et » suit les deux conjonctions hébraïques. « Recensés » maintient le cadre du dénombrement des tribus, tandis que « corps d’armée » exprime leur organisation militaire dans le camp.
