  text: כָּל הַ/פְּקֻדִים֙ לְ/מַ֣חֲנֵה דָ֔ן מְאַ֣ת אֶ֗לֶף וְ/שִׁבְעָ֧ה וַ/חֲמִשִּׁ֛ים אֶ֖לֶף וְ/שֵׁ֣שׁ מֵא֑וֹת לָ/אַחֲרֹנָ֥ה יִסְע֖וּ לְ/דִגְלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: fr
  text: Tous ceux qui furent recensés pour le camp de Dan étaient au nombre de 157 600. Ils partiront les derniers, selon leurs étendards.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Tous ceux qui furent recensés
  rationale: Le participe passif de פקד désigne les personnes enregistrées lors du recensement. Cette formulation reste claire sans répéter « hommes », absent de ce verset.
- source_word: לְמַחֲנֵה דָן
  choice: dans le camp de Dan
  rationale: Le לְ marque ici le rattachement au groupement du camp de Dan ; « dans le camp de Dan » est naturel en français et convient à la formule récapitulative.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 157 600
  rationale: Le nombre exact est rendu en chiffres selon l’usage typographique français moderne.
- source_word: לָאַחֲרֹנָה
  choice: les derniers
  rationale: L’adverbe indique la dernière position dans l’ordre de marche ; l’accord au pluriel donne une formulation française naturelle.
- source_word: יִסְעוּ
  choice: partiront
  rationale: Dans le contexte des déplacements au désert, נסע signifie lever le camp ou se mettre en route. « Partiront » exprime sobrement le départ.
- source_word: לְדִגְלֵיהֶם
  choice: sous leurs étendards
  rationale: דגל désigne les étendards ainsi que les unités tribales organisées autour d’eux. « Sous leurs étendards » conserve l’image concrète et convient à l’ordre de marche.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la structure récapitulative du texte hébreu et son vocabulaire d’organisation du camp, sans explicitation confessionnelle.
