source:
  edition: WLC
  text: וּ/מַטֵּ֖ה נַפְתָּלִ֑י וְ/נָשִׂיא֙ לִ/בְנֵ֣י נַפְתָּלִ֔י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/029.yaml
  text: 'And the tribe of Naphtali[a], and the leader of the sons of Naphtali: Ahira son of Enan.'
translation:
  language: fr
  text: 'Puis la tribu de Nephtali, avec pour chef des fils de Nephtali : Ahira, fils d’Énan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans le contexte de l’organisation du camp en Nombres 2, le mot désigne une unité tribale et non un bâton.
- source_word: נָשִׂיא
  choice: chef
  rationale: Le terme désigne ici le responsable reconnu de la tribu. « Chef » est naturel en français moderne et n’introduit pas les connotations royales de « prince ».
- source_word: לִבְנֵי
  choice: des fils de
  rationale: Cette formulation conserve la désignation tribale hébraïque et s’intègre naturellement à la construction française « chef des fils de Nephtali ».
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française traditionnelle et largement reconnue du nom propre biblique.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Translittération française usuelle du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement la formule patronymique hébraïque.
- source_word: עֵינָן
  choice: Énan
  rationale: Translittération française du nom propre, avec accent initial facilitant la prononciation.
