  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « armée » ou « troupe ». Le mot hébreu peut désigner une armée ou un groupe organisé en vue du service militaire ; ici, il s’agit du contingent de la tribu.
