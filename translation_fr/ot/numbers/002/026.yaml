lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: et son corps d’armée
  rationale: Dans le contexte de l’organisation du camp et du recensement militaire en Nombres 1–2, צָבָא désigne ici le contingent organisé de la tribu. « Corps d’armée » exprime ce sens collectif et militaire en français actuel, tandis que le possessif masculin singulier rend le suffixe hébreu.
- source_word: וּפְקֻדֵיהֶם
  choice: ceux d’entre eux qui avaient été recensés
  rationale: Cette formulation rend le sens passif de la forme issue de פקד et maintient le lien explicite avec le groupe concerné. La juxtaposition conserve la valeur explicative du syntagme hébreu sans le réduire au simple abstrait « effectif ».
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 62 700
  rationale: Le nombre exact est présenté selon l’ordre et la notation usuels du français contemporain.
