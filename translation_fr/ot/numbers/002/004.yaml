lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: de sa division
  rationale: Dans le contexte de l’organisation du camp et du recensement militaire, צָבָא désigne ici le contingent tribal placé sous l’autorité du chef nommé. « Division » exprime naturellement cette unité organisée sans accentuer indûment l’idée de combat.
- source_word: וּפְקֻדֵיהֶם
  choice: Les hommes recensés
  rationale: Le terme issu de פקד relève ici du vocabulaire du recensement et désigne les personnes dénombrées ou enrôlées. « Hommes » est explicité d’après le contexte immédiat du recensement militaire (Nombres 1.20-46), tout en rendant la phrase idiomatique en français.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 74 600
  rationale: Le total exact est présenté selon la notation numérique française contemporaine, claire et concise.
