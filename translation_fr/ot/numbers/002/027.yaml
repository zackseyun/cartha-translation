source:
  edition: WLC
  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה אָשֵׁ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י אָשֵׁ֔ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: fr
  text: 'Ceux qui campent à côté de lui : la tribu d’Aser ; le chef des fils d’Aser est Paguiël, fils d’Ocran.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹנִים
  choice: Ceux qui camperont
  rationale: Le participe de חנה désigne ceux qui campent ou sont établis dans le camp. Le futur convient au contexte prescriptif de l’organisation du camp tout en restant naturel en français.
- source_word: עָלָיו
  choice: à côté de lui
  rationale: Dans la description de la disposition du camp, עַל avec suffixe exprime ici la proximité. Le pronom masculin renvoie naturellement au groupe tribal mentionné juste avant dans le contexte.
- source_word: מַטֵּה
  choice: la tribu
  rationale: Dans le contexte du recensement et de l’ordre du camp, מַטֶּה désigne une division tribale.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Translittération française usuelle du nom propre et tribal.
- source_word: נָשִׂיא
  choice: chef
  rationale: Dans les Nombres, נָשִׂיא désigne le responsable reconnu d’une tribu. « Chef » est précis, courant et n’implique pas une dignité dynastique.
- source_word: לִבְנֵי אָשֵׁר
  choice: des fils d’Aser
  rationale: Cette formulation préserve l’expression généalogique hébraïque et s’intègre naturellement après « chef ».
- source_word: פַּגְעִיאֵל
  choice: Paguiel
  rationale: Translittération française transparente du nom propre.
- source_word: בֶּן עָכְרָן
  choice: fils d’Okrân
  rationale: Rendu direct de la formule patronymique; la graphie conserve la consonne initiale du nom hébreu עָכְרָן.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure en deux phrases évite une coordination nominale lourde et s’accorde avec le style prescriptif du passage. Le vocabulaire tribal et généalogique est conservé.
