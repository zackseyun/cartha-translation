lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: et son corps de troupe
  rationale: Dans le contexte de l’organisation du camp et du recensement, צָבָא désigne ici le contingent organisé de la tribu. « Corps de troupe » conserve cette dimension collective et militaire sans suggérer qu’un combat est en cours.
- source_word: וּפְקֻדֵיהֶם
  choice: c’est-à-dire ceux d’entre eux qui ont été recensés
  rationale: La forme issue de פקד désigne les personnes comptées ou enregistrées lors du recensement. « C’est-à-dire » rend la valeur explicative probable du second groupe coordonné, tandis que « d’entre eux » respecte le suffixe pluriel.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 45 650
  rationale: 'Notation numérique française claire et standard du total hébreu : quarante-cinq mille six cent cinquante.'
