lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Son contingent
  rationale: צָבָא désigne ici le groupe tribal organisé dans le cadre du campement et du recensement, avec une nuance militaire. « Contingent » exprime cette organisation sans évoquer nécessairement des combats en cours.
- source_word: וּפְקֻדֵיהֶם
  choice: selon le recensement
  rationale: Le terme renvoie aux personnes dénombrées ou inscrites lors du recensement. Cette formulation française naturelle restitue la fonction de l’expression hébraïque tout en évitant d’ajouter « hommes » dans cette proposition.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 53 400
  rationale: Le nombre hébreu correspond exactement à cinquante-trois mille quatre cents ; la notation chiffrée est claire et naturelle en français moderne.
