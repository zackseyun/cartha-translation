  text: and his company[a], even those numbered from them, was thirty-five thousand four hundred.
translation:
  language: fr
  text: Son contingent[a], avec ses hommes recensés, comptait trente-cinq mille quatre cents hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son armée » ou « ses troupes » ; le terme hébreu désigne le contingent organisé de la tribu dans le cadre militaire du recensement et du campement au désert.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: son corps d’armée
  rationale: צָבָא désigne ici le contingent organisé de la tribu dans l’agencement militaire du camp. « Corps d’armée » conserve cette dimension sans suggérer qu’un combat est en cours.
- source_word: וּפְקֻדֵיהֶם
  choice: avec les hommes qui y avaient été recensés
  rationale: Le terme issu de פקד renvoie aux hommes dénombrés et inscrits lors du recensement. La tournure française rend le sens censitaire tout en rattachant clairement l’effectif au contingent.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: trente-cinq mille quatre cents
  rationale: Le nombre est rendu exactement selon l’ordre naturel du français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Comptait » évite une construction lourde et convient au contexte du recensement ; l’ajout final de « hommes » explicite naturellement l’unité dénombrée déjà établie par le contexte.
