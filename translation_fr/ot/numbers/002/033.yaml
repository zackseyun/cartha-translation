  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: fr
  text: Mais les Lévites ne furent pas recensés parmi les fils d’Israël[a], comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ; traditionnellement « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: 'Variante lexicale : la formulation du texte principal préserve l’expression hébraïque, tandis que la note donne ses équivalents idiomatique et traditionnel.'
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: Mais les Lévites
  rationale: La conjonction ו peut signifier « et », mais elle marque ici le contraste avec les totaux du recensement qui précèdent ; « mais » rend naturellement cette articulation en français.
- source_word: לֹא הָתְפָּקְדוּ
  choice: ne furent pas recensés
  rationale: Dans ce contexte, le hitpael de פקד désigne le fait d’être inscrit et compté lors d’un recensement. La tournure passive « ne furent pas recensés » est claire et fidèle.
- source_word: בְּ/תוֹךְ
  choice: parmi
  rationale: La préposition exprime ici l’inclusion dans un groupe ; « parmi » est l’équivalent français le plus naturel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression masculine plurielle de l’hébreu. La note signale les équivalents plus idiomatique et traditionnel.
- source_word: כַּ/אֲשֶׁר
  choice: comme
  rationale: Le terme introduit la conformité de l’action au commandement divin antérieur ; « comme » est concis et naturel.
- source_word: צִוָּה
  choice: l’avait ordonné
  rationale: Le commandement a été donné avant le recensement rapporté ici ; le plus-que-parfait marque clairement cette antériorité en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Moïse est le destinataire du commandement ; la construction française avec « ordonner à » rend naturellement la relation syntaxique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en conserve la valeur de nom propre sans lui substituer le titre « le Seigneur ».
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit sans archaïsme lexical ; « recensés » maintient le contexte précis du dénombrement.
