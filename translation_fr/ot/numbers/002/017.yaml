- from: Puis la tente de la Rencontre partira, avec le camp des Lévites au milieu des autres camps. Ils partiront dans l’ordre où ils campent, chacun à sa place[a], sous son étendard[b].
  to: Puis la tente de la Rencontre partira, avec le camp des Lévites au milieu des camps. Ils partiront dans le même ordre que celui où ils campent, chacun à sa place[a], selon leurs étendards[b].
  rationale: La révision retire l’ajout interprétatif « autres » et remplace « sous son étendard » par « selon leurs étendards », qui rend plus fidèlement le rapport organisationnel indiqué par l’hébreu tout en conservant un français moderne et naturel. Les deux ancres de notes restent attachées aux expressions concernées.
