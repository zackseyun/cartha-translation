source:
  edition: WLC
  text: וְ/נָסַ֧ע אֹֽהֶל מוֹעֵ֛ד מַחֲנֵ֥ה הַ/לְוִיִּ֖ם בְּ/ת֣וֹךְ הַֽ/מַּחֲנֹ֑ת כַּ/אֲשֶׁ֤ר יַחֲנוּ֙ כֵּ֣ן יִסָּ֔עוּ אִ֥ישׁ עַל יָד֖/וֹ לְ/דִגְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: fr
  text: Puis la tente de la Rencontre partira, avec le camp des Lévites au milieu des camps. Ils partiront dans le même ordre que celui où ils campent, chacun à sa place[a], selon leurs étendards[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à son poste ». L’expression hébraïque emploie littéralement le mot « main » ou « côté » et désigne ici la position assignée dans l’ordre de marche.
    reason: lexical_alternative
  - marker: b
    text: Ou « par leurs étendards ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Puis … partira
  rationale: Dans le contexte des déplacements du camp, נָסַע signifie lever le camp et se mettre en route. « Partira » est naturel en français, tandis que « Puis » marque la succession dans l’ordre de marche.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Cette formulation conserve l’image concrète de la tente et la fonction de rencontre exprimée par מוֹעֵד, sans introduire un terme cultuel absent de l’hébreu.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: le camp des Lévites
  rationale: Traduction directe de la chaîne construite, qui garde la désignation collective des Lévites.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: au milieu des autres camps
  rationale: בְּתוֹךְ indique ici une position centrale. L’ajout contextuel d’« autres » évite en français de sembler inclure le camp lévitique dans les camps qui l’entourent.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: Ils partiront dans l’ordre où ils campent
  rationale: La construction corrélative établit une correspondance entre la disposition du campement et l’ordre de marche. Cette formulation française explicite sobrement la relation impliquée par le contexte.
- source_word: אִישׁ עַל יָדוֹ
  choice: chacun à sa place
  rationale: אִישׁ a une valeur distributive, et l’expression idiomatique עַל יָדוֹ désigne la place ou la position assignée dans l’organisation du déplacement.
- source_word: לְדִגְלֵיהֶם
  choice: sous son étendard
  rationale: דֶּגֶל désigne l’étendard qui identifie une division tribale. Le singulier distributif après « chacun » rend naturellement en français le pluriel hébreu référant à l’ensemble des étendards.
