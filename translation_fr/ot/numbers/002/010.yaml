  text: דֶּ֣גֶל מַחֲנֵ֧ה רְאוּבֵ֛ן תֵּימָ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י רְאוּבֵ֔ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: fr
  text: La bannière[a] du camp de Ruben, avec ses corps d’armée[b], sera au sud ; le chef des fils de Ruben sera Élitsur, fils de Shedéour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étendard ».
    reason: lexical_alternative
  - marker: b
    text: Ou « selon ses armées » ou « selon ses divisions » ; l’hébreu désigne des groupes organisés dans un cadre militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: bannière
  rationale: Le terme désigne ici l’enseigne distinctive autour de laquelle un camp tribal est organisé. « Bannière » est clair en français moderne, tandis qu’« étendard » demeure une possibilité plus militaire.
- source_word: מַחֲנֵה
  choice: camp
  rationale: Le mot désigne le camp organisé de la tribu dans le dispositif d’Israël.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et courante du nom tribal et personnel.
- source_word: תֵּימָנָה
  choice: au sud
  rationale: La forme directionnelle situe le camp sur le côté sud ; « au sud » est naturel et précis en français.
- source_word: לְצִבְאֹתָם
  choice: selon leurs formations
  rationale: Le terme צבא évoque des corps organisés, souvent militaires. « Formations » rend ici l’organisation ordonnée des groupes sans imposer l’image d’armées engagées au combat.
- source_word: וְנָשִׂיא
  choice: le chef
  rationale: Dans ce contexte, נָשִׂיא désigne le responsable reconnu de la tribu. « Chef » est concis et n’introduit pas la connotation monarchique de « prince ».
- source_word: לִבְנֵי רְאוּבֵן
  choice: des fils de Ruben
  rationale: Cette formulation conserve l’expression généalogique hébraïque qui désigne les membres de la tribu de Ruben.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Élitsour, fils de Shedéour
  rationale: Translittération française des noms propres et restitution directe du patronyme hébreu.
