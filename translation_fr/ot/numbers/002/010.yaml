  register: Français international moderne, digne et accessible. La phrase nominale hébraïque reçoit le verbe « sera », nécessaire en français pour exprimer clairement la disposition prescrite. Le vocabulaire conserve l’organisation tribale et militaire du contexte sans archaïsme excessif.
