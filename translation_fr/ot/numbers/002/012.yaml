source:
  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: fr
  text: Ceux qui campent à côté de lui[a] sont la tribu de Siméon. Le chef des fils de Siméon est Sheloumiel, fils de Tsourishaddaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ses côtés ». Dans cette description du camp, la préposition hébraïque exprime la proximité. Le suffixe est masculin singulier ; son antécédent précis se déduit du contexte précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: Ceux qui campent
  rationale: Le participe de חנה est employé comme substantif collectif. Cette formulation naturelle conserve sa valeur participiale.
- source_word: עָלָיו
  choice: à côté de lui
  rationale: Dans la disposition du camp, עַל exprime ici la proximité. Le suffixe masculin singulier est rendu par « lui », sans imposer davantage l’identification de son antécédent.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: la tribu de Siméon
  rationale: Dans les textes de recensement et d’organisation du camp, מַטֶּה désigne une unité tribale, et non un bâton au sens concret.
- source_word: וְנָשִׂיא
  choice: Le chef
  rationale: נָשִׂיא désigne ici le responsable reconnu de la tribu. « Chef » est clair, digne et dépourvu des connotations royales possibles de « prince ».
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: des fils de Siméon
  rationale: La formulation conserve l’expression généalogique masculine du texte hébreu tout en restant idiomatique en français.
- source_word: שְׁלֻמִיאֵל
  choice: Sheloumiel
  rationale: Le nom propre est translittéré selon une forme française lisible qui représente les éléments consonantiques et vocaliques du nom hébreu.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: fils de Tsourishaddaï
  rationale: La construction patronymique est rendue directement, et le nom du père est translittéré comme un seul nom propre.
theological_decisions:
- issue: Expression généalogique genrée dans לִבְנֵי שִׁמְעוֹן
  choice: des fils de Siméon
  alternative: des descendants de Siméon
  rationale: L’hébreu emploie explicitement le pluriel masculin « fils ». Le conserver respecte la forme généalogique du texte sans rendre le sens obscur.
- issue: Antécédent du suffixe masculin dans עָלָיו
  choice: à côté de lui
  alternative: à côté d’elle / à ses côtés
  rationale: Le suffixe hébreu est masculin singulier, mais son référent précis dépend du contexte antérieur. Le texte principal conserve ce genre grammatical et la note signale l’autre formulation possible en français, sans résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement du texte hébreu tout en divisant la longue coordination en deux phrases naturelles. Les formes « Sheloumiel » et « Tsourishaddaï » sont adaptées à la lecture française.
