  yaml_path: translation/ot/numbers/002/014.yaml
  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: fr
  text: 'Et la tribu de Gad[a], et le chef des fils de Gad : Éliasaph, fils de Réouel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits ou passages parallèles donnent « Déouel » comme nom du père (voir Nombres 1.14).
    reason: textual_variant
lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: Puis la tribu de
  rationale: Dans le contexte de l’organisation du camp, מַטֶּה désigne une tribu, non un bâton. « Puis » rend naturellement la coordination dans cette liste.
- source_word: גָּד
  choice: Gad
  rationale: Nom propre de la tribu, conservé sous sa forme française usuelle.
- source_word: וְ/נָשִׂיא
  choice: Le chef
  rationale: Dans ce cadre administratif, נָשִׂיא désigne le responsable reconnu de la tribu. « Chef » est actuel, clair et digne.
- source_word: לִ/בְנֵי גָד
  choice: des fils de Gad
  rationale: Cette formule identifie le groupe tribal dont Éliasaph est le chef; « fils de Gad » conserve l’expression hébraïque traditionnelle sans la paraphraser.
- source_word: אֶלְיָסָף
  choice: Éliasaph
  rationale: Transcription française usuelle du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Équivalent direct de la formule patronymique hébraïque.
- source_word: רְעוּאֵל
  choice: Réouel
  rationale: Le texte massorétique de ce verset porte רְעוּאֵל, rendu sans harmonisation avec le passage parallèle.
