  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה יִשָּׂשכָ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י יִשָּׂשכָ֔ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: fr
  text: À côté de lui campe la tribu d’Issacar. Le responsable des descendants d’Issacar[a] est Netanéel, fils de Tsouar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les fils d’Issacar ». Cette expression est une désignation tribale courante qui englobe les descendants et les membres de la tribu d’Issacar, et non uniquement les hommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: Ceux qui campent
  rationale: Le participe substantivé désigne le groupe installé dans le camp; cette formulation naturelle conserve l’idée d’une situation en cours.
- source_word: עָלָיו
  choice: à côté de lui
  rationale: Dans le contexte de la disposition du camp, la préposition exprime la proximité avec le groupe précédemment mentionné, plutôt qu’une position littérale «sur» lui.
- source_word: מַטֵּה יִשָּׂשכָר
  choice: la tribu d’Issacar
  rationale: Dans ce contexte, מַטֶּה désigne une tribu, et non un bâton. Le nom propre suit la forme française usuelle.
- source_word: נָשִׂיא
  choice: responsable
  rationale: Le terme désigne ici le chef officiellement reconnu de la tribu. «Responsable» est clair en français actuel et évite les connotations royales possibles de «prince».
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: des descendants d’Issacar
  rationale: L’expression hébraïque signifie littéralement «des fils d’Issacar», mais sert ici de désignation collective et généalogique de la tribu.
- source_word: נְתַנְאֵל
  choice: Netanéel
  rationale: Transcription française intelligible du nom hébreu, distinguant ses éléments vocaliques.
- source_word: בֶּן צוּעָר
  choice: fils de Tsouar
  rationale: Traduction naturelle de la construction patronymique hébraïque; le nom propre est transcrit selon l’usage français.
