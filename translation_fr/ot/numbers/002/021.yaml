lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: et son corps d’armée
  rationale: צָבָא désigne ici le contingent de la tribu organisé pour le campement et la marche. « Corps d’armée » rend naturellement cette unité structurée sans suggérer qu’un combat est en cours.
- source_word: וּפְקֻדֵיהֶם
  choice: avec ceux d’entre eux qui ont été recensés
  rationale: La forme issue de פקד désigne les hommes comptés ou recensés. Le pronom pluriel renvoie aux membres du contingent, et la formulation introduit clairement le total qui suit.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: trente-deux mille deux cents
  rationale: Le nombre est rendu selon l’ordre usuel du français contemporain.
