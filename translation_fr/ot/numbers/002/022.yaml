source:
  edition: WLC
  text: וּ/מַטֵּ֖ה בִּנְיָמִ֑ן וְ/נָשִׂיא֙ לִ/בְנֵ֣י בִנְיָמִ֔ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: fr
  text: Puis la tribu de Benjamin. Le chef des descendants de Benjamin[a] était Abidân, fils de Guidéoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef pour les descendants de Benjamin ». La préposition hébraïque peut exprimer ici ces deux rapports très proches.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans le contexte de l’organisation du camp d’Israël, le mot désigne l’unité tribale, et non un bâton ou une branche.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: נָשִׂיא
  choice: chef
  rationale: Le terme désigne ici le représentant reconnu de la tribu. « Chef » est naturel en français et évite les connotations royales que pourrait avoir « prince ».
- source_word: לִבְנֵי בִנְיָמִן
  choice: des descendants de Benjamin
  rationale: Dans ce contexte tribal, בְּנֵי désigne les membres issus de Benjamin; « descendants » exprime clairement ce sens collectif en français moderne. La note conserve l’ambiguïté relationnelle de la préposition לְ.
- source_word: אֲבִידָן
  choice: Abidân
  rationale: Translittération française usuelle du nom propre, avec accent circonflexe indiquant la voyelle longue finale.
- source_word: בֶּן גִּדְעֹנִי
  choice: fils de Guidéoni
  rationale: Rendu direct de la construction patronymique hébraïque, avec la forme française traditionnelle du nom.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La première proposition nominale, caractéristique de la liste du camp, est conservée sans ajouter un verbe absent de l’hébreu. « Descendants » est plus immédiatement intelligible que « fils » pour désigner collectivement la tribu.
