  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: fr
  text: Les fils d’Israël[b] camperont, chacun près de son étendard[a], avec les signes distinctifs de leurs familles paternelles. Ils camperont à quelque distance, tout autour de la tente de la Rencontre[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bannière ». Le mot hébreu désigne un étendard servant à identifier une tribu ou une formation.
    reason: lexical_alternative
  - marker: b
    text: Ou « Les Israélites ». La traduction littérale conserve l’expression familiale de l’hébreu.
    reason: lexical_alternative
  - marker: c
    text: Expression traditionnellement aussi rendue par « tente de la rencontre » ou « tabernacle ».
    reason: lexical_alternative
  - marker: d
    text: Ou « en face de ». Le terme hébreu exprime une position vis-à-vis de la tente et peut aussi indiquer une certaine distance.
    reason: source_ambiguity
lexical_decisions:
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif désigne chaque homme au sein de l’ensemble; « chacun » exprime naturellement cette valeur en français sans alourdir la phrase.
- source_word: דִּגְלוֹ
  choice: son étendard
  rationale: דֶּגֶל désigne ici l’étendard identifiant une formation tribale ou militaire. « Étendard » convient au contexte organisé du camp; « bannière » reste possible.
- source_word: בְאֹתֹת
  choice: avec les signes distinctifs
  rationale: אוֹת désigne des signes ou marques d’identification. L’ajout de « distinctifs » explicite leur fonction dans ce contexte sans préciser indûment leur forme matérielle.
- source_word: לְבֵית אֲבֹתָם
  choice: de leurs familles paternelles
  rationale: L’expression hébraïque renvoie aux unités de parenté structurées selon la lignée paternelle. « Familles paternelles » est plus intelligible en français actuel que le calque « maisons de leurs pères ».
- source_word: יַחֲנוּ
  choice: camperont
  rationale: Dans cette instruction, l’inaccompli hébreu a une portée prescriptive. Le futur français convient à l’énoncé des dispositions à observer.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Les fils d’Israël
  rationale: Cette formulation conserve l’image familiale explicite de l’hébreu; « les Israélites » constitue une formulation française plus idiomatique mais moins littérale.
- source_word: מִנֶּגֶד
  choice: en face de
  rationale: Le terme situe le camp vis-à-vis de la tente. Il peut aussi comporter l’idée d’une certaine distance, possibilité signalée en note.
- source_word: סָבִיב
  choice: tout autour d’elle
  rationale: L’adverbe décrit une disposition encerclant la tente de tous côtés; le pronom rend clairement son référent en français.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction transparente conserve les deux éléments du syntagme hébreu et n’importe pas les associations architecturales que peut évoquer « tabernacle ».
theological_decisions:
- issue: Langage familial et masculin collectif
  choice: Les fils d’Israël … chacun
  alternative: Les Israélites … chacun
  rationale: Le texte garde l’expression familiale masculine בְּנֵי יִשְׂרָאֵל tout en employant le distributif français naturel « chacun ». Une note offre la désignation collective usuelle.
- issue: Désignation du sanctuaire
  choice: la tente de la rencontre
  alternative: le tabernacle
  rationale: Le syntagme אֹהֶל מוֹעֵד est rendu directement. Le terme traditionnel « tabernacle » est possible, mais il est moins transparent et ne rend pas explicitement la notion de rencontre.
- issue: Position du camp par rapport à la tente
  choice: en face de … tout autour d’elle
  alternative: à quelque distance de … tout autour d’elle
  rationale: מִנֶּגֶד permet une nuance spatiale qui peut être comprise comme « en face de » ou comme indiquant une position à distance. La traduction principale suit le sens relationnel, et la note préserve l’autre possibilité.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve l’organisation familiale et tribale du texte tout en évitant les calques peu naturels. « Étendard » et « tente de la rencontre » maintiennent la précision concrète du vocabulaire hébreu.
