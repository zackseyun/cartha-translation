  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: fr
  text: Son contingent[a] comptait 57 400 hommes recensés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « corps d’armée » ou « division ». Le mot hébreu צָבָא peut désigner une troupe ou un groupe organisé dans le contexte du recensement et de la disposition du camp.
    reason: lexical_alternative
  - marker: b
    text: Ou « hommes enregistrés » ou « hommes passés en revue ». L’hébreu désigne ceux qui ont été officiellement comptés lors du recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Son contingent
  rationale: Dans le contexte de l’organisation du camp et du recensement, צָבָא désigne ici le groupe organisé d’une tribu, envisagé notamment sous son aspect militaire. « Contingent » est naturel en français moderne sans suggérer que les hommes sont déjà engagés au combat.
- source_word: וּפְקֻדָיו
  choice: avec ses hommes recensés
  rationale: La forme issue de פקד désigne les personnes officiellement comptées ou enregistrées lors du recensement. Cette formulation rend clairement le sens de la formule hébraïque et son rapport avec le contingent.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57 400
  rationale: Le nombre hébreu est rendu selon l’ordre et la notation usuels du français contemporain, sans modification de sa valeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère organisé, potentiellement militaire, du groupe sans employer « armée », qui serait plus appuyé. L’ajout final de « hommes », implicite en hébreu dans cette formule de recensement, rend le chiffre naturel et immédiatement compréhensible en français.
