  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה רְאוּבֵ֗ן מְאַ֨ת אֶ֜לֶף וְ/אֶחָ֨ד וַ/חֲמִשִּׁ֥ים אֶ֛לֶף וְ/אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים לְ/צִבְאֹתָ֑/ם וּ/שְׁנִיִּ֖ם יִסָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: fr
  text: Tous ceux qui furent recensés pour le camp de Ruben étaient au nombre de 151 450, selon leurs unités. Ils partiront en deuxième position.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Tous ceux qui furent recensés
  rationale: Le participe passif désigne les personnes dénombrées lors du recensement. Cette formulation reste claire sans ajouter « hommes », absent de ce verset.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: pour le camp de Ruben
  rationale: La préposition marque ici l’appartenance ou le rattachement au groupement constitué autour de Ruben.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 151 450
  rationale: Les chiffres donnent exactement le total hébreu et conviennent au contexte d’un recensement.
- source_word: לְצִבְאֹתָם
  choice: selon leurs corps d’armée
  rationale: צָבָא désigne ici les unités organisées pour le service et la marche; « corps d’armée » conserve la dimension militaire sans réduire le terme à une taille d’unité trop précise.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: Ils partiront en deuxième position
  rationale: La tournure hébraïque indique le rang du camp de Ruben dans l’ordre de départ. La formulation française en explicite naturellement la valeur ordinale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient à l’énoncé récapitulatif du recensement, tandis que le futur exprime l’ordre de marche prescrit.
