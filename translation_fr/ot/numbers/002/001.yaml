source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: fr
  text: 'Yahvé[a] parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; souvent rendu « le SEIGNEUR » dans les traductions.'
    reason: Signaler la forme hébraïque et l’autre convention majeure de traduction.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר, précédé du waw narratif, introduit une nouvelle prise de parole. « Parla » convient à la formule solennelle de discours divin.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante transcrit le nom divin YHWH et le distingue d’un titre comme « le Seigneur ».
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: La préposition אֶל, répétée en hébreu devant chacun des deux noms, désigne clairement les deux destinataires. En français, sa répétition serait possible, mais inutile dans cette coordination simple.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule introduit le contenu du discours qui suit. « En ces termes » est naturel en français et assure la transition vers la citation du verset suivant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre YHWH. Le transcrire préserve sa valeur de nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, clair et digne. La tournure « en ces termes » évite le calque peu naturel « disant » tout en conservant la fonction introductive de לֵאמֹר.
