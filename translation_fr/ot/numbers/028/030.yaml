  text: and one male goat to make atonement for you[a].
translation:
  language: fr
  text: et un bouc, afin de faire l’expiation pour vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique : « et un bouc, afin de faire l’expiation pour vous ». D’après le contexte sacrificiel immédiat, il s’agit d’un sacrifice pour le péché.'
    reason: Préciser la fonction sacrificielle implicite sans l’insérer dans le texte principal.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: Dans ce contexte sacrificiel, l’expression désigne un caprin mâle. « Bouc » est précis, naturel et évite le calque lourd « bouc de chèvres ».
- source_word: אֶחָד
  choice: un
  rationale: Le numéral indique qu’un seul animal doit être offert ; en français, « un bouc » exprime naturellement à la fois le nombre et l’indéfini.
- source_word: לְכַפֵּר
  choice: afin de faire l’expiation
  rationale: L’infinitif avec לְ exprime ici le but. « Faire l’expiation » conserve le sens cultuel sacerdotal sans imposer une théorie particulière de l’expiation.
- source_word: עֲלֵיכֶם
  choice: pour vous
  rationale: Avec כפר, עַל désigne les personnes au bénéfice desquelles l’expiation est accomplie. « Pour vous » est le tour français idiomatique.
theological_decisions:
- issue: La fonction sacrificielle du bouc n’est pas explicitement nommée dans cette proposition hébraïque.
  choice: Ne pas ajouter « en sacrifice pour le péché » dans le corps du texte, mais signaler l’ellipse en note.
  alternative: Ajouter « en sacrifice pour le péché » d’après le contexte sacrificiel immédiat.
  rationale: Le contexte permet de reconnaître la fonction du bouc, mais les mots correspondants ne figurent pas dans cette proposition. Une traduction proche du texte, accompagnée d’une note, préserve à la fois l’ellipse hébraïque et l’information contextuelle sans transformer une inférence en formulation explicite.
translation_notes:
  register: Français international moderne, sobre et digne. « Bouc » est courant et précis ; « faire l’expiation » maintient le registre cultuel du passage. La coordination initiale « et » respecte le caractère continu de la liste sacrificielle.
