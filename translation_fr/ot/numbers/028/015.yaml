  text: וּ/שְׂעִ֨יר עִזִּ֥ים אֶחָ֛ד לְ/חַטָּ֖את לַ/יהוָ֑ה עַל עֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: fr
  text: On offrira à Yahweh un bouc en sacrifice pour le péché[a], en plus de l’holocauste régulier et de son offrande de boisson.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner le sacrifice qui concerne aussi bien l’impureté que le péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: La construction désigne un caprin mâle. « Bouc » est précis, naturel et courant en français dans un contexte sacrificiel.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral fait partie de la prescription. En français, « un bouc » exprime naturellement à la fois le nombre et l’indéfini sans lourdeur.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans la législation sacrificielle, חַטָּאת désigne l’offrande liée au péché ou à la purification. Le rendu principal reste immédiatement compréhensible, tandis que l’autre nuance est conservée en note.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte porte le tétragramme יהוה. « À Yahweh » exprime ici le destinataire du sacrifice.
- source_word: עַל
  choice: en plus de
  rationale: Dans ce contexte, עַל indique l’ajout ou l’accompagnement, et non une position spatiale. « En plus de » est clair et idiomatique.
- source_word: עֹלַת הַתָּמִיד
  choice: l’holocauste régulier
  rationale: עֹלָה est rendu par le terme sacrificiel français établi « holocauste », et תָּמִיד décrit son caractère régulier ou continuel sans qu’il soit nécessaire d’ajouter « quotidien ».
- source_word: יֵעָשֶׂה
  choice: on offrira
  rationale: Le verbe signifie littéralement « sera fait », mais, dans ce contexte cultuel, « on offrira » restitue naturellement l’action prescrite.
- source_word: וְנִסְכּוֹ
  choice: et de son offrande de vin
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Offrande de vin » est plus accessible que « libation » et le contexte antérieur détermine le liquide.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le nom propre divin est conservé sous la forme « Yahweh », conformément au texte hébreu, plutôt que remplacé par un titre.
- issue: Sens sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut mettre en avant le traitement du péché ou la purification rituelle. Le rendu traditionnel et accessible figure dans le texte, sans effacer l’autre analyse, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le caractère prescriptif du texte cultuel, avec un vocabulaire biblique reconnu (« holocauste ») et une formulation accessible (« offrande de vin »).
