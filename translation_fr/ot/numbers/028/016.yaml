  text: וּ/בַ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֑דֶשׁ פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: fr
  text: Le quatorzième jour du premier mois, c’est la Pâque de Yahvé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la Pâque pour Yahvé ». La préposition hébraïque peut exprimer la consécration ou l’appartenance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: Au premier mois
  rationale: La conjonction initiale rattache le verset au contexte, mais n’exige pas un « et » en français. « Au premier mois » exprime naturellement le cadre temporel.
- source_word: בְּ/אַרְבָּעָה עָשָׂר י֖וֹם לַ/חֹדֶשׁ
  choice: le quatorzième jour du mois
  rationale: Cette formulation française courante reproduit fidèlement la formule hébraïque de datation.
- source_word: פֶּ֖סַח
  choice: la Pâque
  rationale: « La Pâque » est le terme français consacré dans ce contexte cultuel et calendaire. « Sacrifice de la Pâque » préciserait indûment ce que l’hébreu laisse concis.
- source_word: לַ/יהוָה
  choice: pour Yahvé
  rationale: La préposition לְ peut marquer la destination, la consécration ou l’appartenance. « Pour Yahvé » conserve ici l’idée de célébration orientée vers Dieu sans transformer la construction en simple génitif.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » rend le nom propre divin plutôt que de le remplacer par un titre.
- issue: Relation exprimée par לַיהוָה
  choice: pour Yahvé
  alternative: de Yahvé
  rationale: Le choix principal met en relief la destination ou la consécration de la Pâque, tandis que la note conserve l’autre nuance possible d’appartenance ou de relation.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. « A lieu » explicite naturellement la proposition nominale hébraïque sans lui imposer une valeur temporelle plus précise.
