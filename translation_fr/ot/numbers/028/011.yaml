id: NUM.28.11
reference: Numbers 28:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: fr
  text: 'Au début de chacun de vos mois[a], vous présenterez à Yahweh un holocauste : deux taureaux du troupeau, un bélier et sept agneaux mâles âgés d’un an, sans défaut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux commencements de vos mois » ; c’est-à-dire lors des célébrations de la nouvelle lune.'
    reason: La note conserve la forme de l’idiome hébreu et explicite sa référence aux nouvelles lunes.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: Au début de chacun de vos mois
  rationale: L’expression hébraïque signifie littéralement « aux commencements de vos mois » et désigne le début de chaque mois, marqué par la nouvelle lune. La formulation française retenue transmet naturellement l’idiome, tandis que la note en précise l’arrière-plan cultuel.
- source_word: תַּקְרִיבוּ
  choice: vous présenterez
  rationale: Le hiphil de קרב, dans un contexte sacrificiel, signifie présenter ou offrir. « Présenter » conserve l’idée d’amener l’offrande devant Dieu.
- source_word: עֹלָה
  choice: un holocauste
  rationale: Terme sacrificiel établi en français pour l’offrande entièrement consumée sur l’autel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique le destinataire de l’offrande, et le nom divin יהוה est rendu par « Yahweh » conformément à sa forme personnelle dans le texte source.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: deux taureaux du troupeau
  rationale: La formule désigne deux taureaux appartenant au gros bétail. « Du troupeau » conserve cette précision sans imposer l’idée de jeunesse, qui n’est pas nécessaire ici.
- source_word: וְאַיִל אֶחָד
  choice: un bélier
  rationale: Équivalent direct du nom de l’animal sacrificiel accompagné du nombre un.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sept agneaux mâles âgés d’un an
  rationale: כְּבָשִׂים désigne ici des agneaux mâles, et l’expression « fils d’un an » indique qu’ils ont un an ou sont dans leur première année.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, l’adjectif qualifie des animaux exempts de tare physique.
theological_decisions:
- issue: Interprétation de l’indication temporelle mensuelle
  choice: Au début de chacun de vos mois
  alternative: Lors de vos nouvelles lunes
  rationale: L’hébreu emploie un idiome fondé sur le « commencement » des mois. Il renvoie aux célébrations de la nouvelle lune, mais la traduction principale conserve l’image du commencement du mois et laisse la note expliciter la référence cultuelle.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, rendu ici comme nom propre afin de préserver le nom d’alliance plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le futur « vous présenterez » convient à la prescription cultuelle. Le vocabulaire sacrificiel traditionnel (« holocauste », « sans défaut ») est maintenu parce qu’il reste précis et largement intelligible.
