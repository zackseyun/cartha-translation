revisions:
- from: 'Donne cet ordre aux Israélites[a] et dis-leur : « Mon offrande, la nourriture qui m’est destinée, sous forme de sacrifices consumés par le feu, dont l’odeur m’est agréable[b], vous veillerez à me la présenter au moment fixé. »'
  to: 'Donne cet ordre aux Israélites[a] et dis-leur : « Vous veillerez à me présenter, au moment fixé, mon offrande, mon aliment pour mes sacrifices consumés par le feu, d’une odeur agréable pour moi[b]. »'
  rationale: La révision restitue la série d’appositions et l’ordre final de l’injonction (« vous veillerez à me présenter »), sans expliquer ou atténuer le langage cultuel concret. « Au moment fixé » rend naturellement le singulier collectif de « son temps fixé ».
