  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: fr
  text: 'Donne cet ordre aux Israélites[a] et dis-leur : « Vous veillerez à me présenter, au moment fixé, mon offrande, mon aliment pour mes sacrifices consumés par le feu, d’une odeur agréable pour moi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’« odeur agréable » est une expression habituelle du langage sacrificiel : elle indique que l’offrande est agréée par Dieu.'
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Donne cet ordre
  rationale: L’impératif exprime une directive ferme adressée à Moïse; cette formulation conserve sa force en français naturel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël »; le gentilé désigne clairement et naturellement l’ensemble du peuple en français moderne.
- source_word: קָרְבָּנִי
  choice: Mon offrande
  rationale: קָרְבָּן est le terme général pour ce qui est présenté à Dieu dans le cadre du culte.
- source_word: לַחְמִי
  choice: la nourriture qui m’est destinée
  rationale: לֶחֶם signifie littéralement « pain », mais désigne ici la nourriture cultuelle; la tournure évite de laisser entendre que Dieu aurait besoin d’être nourri tout en conservant l’image concrète.
- source_word: לְאִשַּׁי
  choice: sous forme de sacrifices consumés par le feu
  rationale: אִשֶּׁה désigne une offrande sacrificielle consumée sur l’autel; cette traduction rend explicite le procédé cultuel sans l’identifier simplement à de la nourriture.
- source_word: רֵיחַ נִיחֹחִי
  choice: dont l’odeur m’est agréable
  rationale: Expression sacrificielle consacrée indiquant que l’offrande est agréée par Dieu, tout en conservant l’image olfactive du texte.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב לִי
  choice: vous veillerez à me la présenter
  rationale: שׁמר suivi de l’infinitif marque l’attention scrupuleuse; הקריב est rendu par « présenter » dans son sens sacrificiel.
- source_word: בְּמוֹעֲדוֹ
  choice: au moment fixé
  rationale: מוֹעֵד désigne ici le moment prescrit pour chaque offrande; le singulier français reprend l’offrande comme ensemble collectif.
theological_decisions:
- issue: Langage anthropomorphique de la nourriture et de l’odeur
  choice: Conserver les images sacrificielles concrètes en les formulant comme nourriture destinée à Dieu et odeur qui lui est agréable
  alternative: Réduire l’ensemble à « les offrandes qui me sont agréables »
  rationale: Le texte hébreu associe explicitement nourriture, sacrifices consumés et odeur agréable. La traduction préserve cette tension cultuelle sans suggérer que Dieu dépend matériellement de nourriture.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Le syntagme hébreu est littéralement masculin, mais fonctionne comme désignation ethnique collective. « Les Israélites » transmet le référent sans donner en français l’impression que seuls les hommes sont concernés.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de l’énumération hébraïque est légèrement explicitée pour éviter l’enchaînement obscur « mon offrande, ma nourriture, mes sacrifices », tout en conservant les trois éléments cultuels et l’adresse divine à la première personne.
