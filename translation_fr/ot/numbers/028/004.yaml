translation_notes:
  register: Français moderne, clair et digne. Le singulier « tu » reflète l’adresse hébraïque. La répétition de « tu offriras » conserve le parallélisme de la prescription, tandis que l’expression culturellement spécifique « entre les deux soirs » demeure visible dans le texte et est éclairée par une note.
