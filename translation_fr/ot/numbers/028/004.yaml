  text: אֶת הַ/כֶּ֥בֶשׂ אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָֽ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: fr
  text: Tu offriras un agneau le matin, et tu offriras le second agneau entre les deux soirs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression hébraïque traditionnelle désignant le moment situé vers le crépuscule ou la fin de l’après-midi.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: agneau
  rationale: כֶּבֶשׂ désigne un agneau, généralement un jeune mouton mâle dans le contexte sacrificiel. « Agneau » est naturel en français et n’ajoute pas ici une précision de sexe que ce verset ne formule pas explicitement.
- source_word: אֶחָד
  choice: un
  rationale: Le cardinal אֶחָד signifie « un ». Cette traduction conserve la formulation hébraïque sans la transformer en ordinal « premier ».
- source_word: תַּעֲשֶׂה
  choice: tu offriras
  rationale: Bien que עשה signifie littéralement « faire », le verbe désigne ici, dans une prescription sacrificielle, l’action de préparer et d’offrir la victime. « Tu offriras » exprime clairement cet emploi idiomatique.
- source_word: בַבֹּקֶר
  choice: le matin
  rationale: בֹּקֶר signifie « matin » ; avec la préposition, « le matin » est la tournure temporelle la plus naturelle en français moderne.
- source_word: הַשֵּׁנִי
  choice: le second
  rationale: שֵׁנִי est l’ordinal « second ». Cette formulation préserve la séquence établie par « un agneau ».
- source_word: בֵּין הָעַרְבָּיִם
  choice: entre les deux soirs
  rationale: La locution hébraïque traditionnelle signifie littéralement « entre les deux soirs ». Comme sa délimitation exacte est discutée, le texte conserve cette expression et une note en explique la portée temporelle générale.
