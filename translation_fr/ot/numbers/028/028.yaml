  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֣ר הָֽ/אֶחָ֔ד שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: fr
  text: 'Leur offrande de céréales sera de la farine fine mélangée à l’huile : trois dixièmes[a] pour chaque taureau et deux dixièmes pour le bélier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trois mesures d’un dixième » et « deux mesures d’un dixième » ; dans ces prescriptions sacrificielles, il s’agit généralement de dixièmes d’épha.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Leur offrande de céréales sera
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne une offrande de céréales. Le français explicite la proposition nominale hébraïque par « sera ».
- source_word: סֹלֶת
  choice: farine fine
  rationale: Terme cultuel courant pour une farine de qualité fine destinée aux offrandes.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: pétrie à l’huile
  rationale: Le participe passif décrit la farine préparée en étant intimement mélangée avec de l’huile; « pétrie à l’huile » est naturel dans ce contexte rituel.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: trois dixièmes
  rationale: עִשָּׂרוֹן est une mesure d’un dixième, comprise dans ces prescriptions comme un dixième d’épha; l’unité est précisée en note.
- source_word: לַפָּר הָאֶחָד
  choice: pour chacun des taureaux
  rationale: Dans la continuité de 28.27, plusieurs taureaux sont prescrits; l’expression distributive hébraïque indique ici la quantité à prévoir pour chaque taureau.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: deux dixièmes
  rationale: Rend littéralement les deux unités d’un dixième, sans ajouter l’épha dans le corps du texte.
- source_word: לָאַיִל הָאֶחָד
  choice: pour le bélier
  rationale: Le verset précédent ne prescrit qu’un bélier; le français naturel n’a pas besoin de reproduire « le bélier, l’unique ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation distributive « chacun des taureaux » tient compte du contexte immédiat tout en rendant la fonction de הָאֶחָד; le vocabulaire cultuel reste accessible.
