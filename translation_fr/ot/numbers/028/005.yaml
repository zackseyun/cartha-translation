  variant: modern international French
source:
  edition: WLC
  text: וַ/עֲשִׂירִ֧ית הָ/אֵיפָ֛ה סֹ֖לֶת לְ/מִנְחָ֑ה בְּלוּלָ֛ה בְּ/שֶׁ֥מֶן כָּתִ֖ית רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: fr
  text: et un dixième d’épha de farine fine pour une offrande de céréales, mélangée à un quart de hin[a] d’huile obtenue par broyage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’épha et le hin sont d’anciennes unités de mesure israélites.
    reason: cultural_note
  - marker: b
    text: 'Ou : « d’huile pressée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: et un dixième d’épha
  rationale: La conjonction relie cette quantité à la prescription précédente. Le nom de l’unité ancienne est conservé plutôt que remplacé par une estimation moderne.
- source_word: סֹלֶת
  choice: farine fine
  rationale: Le terme désigne une farine finement moulue destinée notamment aux offrandes ; cette formulation est claire en français moderne.
- source_word: לְמִנְחָה
  choice: pour une offrande de céréales
  rationale: Dans ce contexte rituel sacerdotal, מִנְחָה désigne l’offrande non animale faite de produits céréaliers, et non une offrande générique.
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: mélangée à … d’huile
  rationale: Le participe passif décrit la farine combinée à l’huile. « Mélangée à » est naturel en français et conserve le sens grammatical.
- source_word: כָּתִית
  choice: huile obtenue par broyage
  rationale: L’adjectif évoque l’huile produite à partir d’olives broyées ou pilées. La formulation retenue rend le procédé sans employer l’expression française peu naturelle « huile battue ».
- source_word: רְבִיעִת הַהִין
  choice: un quart de hin
  rationale: Cette formulation idiomatique conserve le nom de l’ancienne unité de capacité.
