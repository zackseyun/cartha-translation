  variant: modern international French
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: fr
  text: 'Vous présenterez à Yahweh un sacrifice consumé par le feu[a], un holocauste : deux taureaux, un bélier et sept agneaux mâles âgés d’un an ; ils devront être sans défaut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande faite par le feu ». Le mot hébreu est un terme sacrificiel technique désignant une offrande livrée au feu de l’autel.
    reason: Alternative lexicale permettant de conserver la formulation traditionnelle sans réduire le terme à une étymologie incertaine.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Vous présenterez
  rationale: Le hifil de קרב désigne couramment, en contexte sacrificiel, l’action de présenter une offrande. « Présenterez » conserve cette valeur cultuelle dans un français naturel.
- source_word: אִשֶּׁה
  choice: un sacrifice consumé par le feu
  rationale: Ce terme sacrificiel technique désigne une offrande livrée au feu de l’autel. Cette formulation évite le possible contresens de « sacrifice de nourriture » tout en rendant explicite le rôle du feu.
- source_word: עֹלָה
  choice: un holocauste
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement brûlée sur l’autel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire du sacrifice, et le tétragramme est rendu par le nom propre « Yahweh ».
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: deux taureaux
  rationale: « Taureaux » rend naturellement la désignation bovine masculine; le contexte ne permet pas d’imposer avec certitude une précision supplémentaire d’âge.
- source_word: וְאַיִל אֶחָד
  choice: un bélier
  rationale: Équivalent français habituel et précis du terme sacrificiel אַיִל.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: sept agneaux mâles âgés d’un an
  rationale: La formulation conserve le sexe des animaux et rend clairement l’expression idiomatique hébraïque relative à leur âge.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Vous veillerez à ce qu’ils soient sans défaut
  rationale: En contexte sacrificiel, תמים signifie exempt de défaut. La tournure française exprime naturellement l’exigence qui incombe aux destinataires et rend ainsi la nuance de לָכֶם sans le calque obscur « pour vous ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » le traite comme le nom divin personnel plutôt que de lui substituer un titre.
- issue: Rapport entre אִשֶּׁה et עֹלָה
  choice: 'deux désignations en apposition : « un sacrifice consumé par le feu, un holocauste »'
  alternative: fusionner les deux expressions en « un holocauste »
  rationale: 'Le maintien des deux termes respecte la formulation hébraïque : le premier caractérise l’offrande par son traitement au feu, le second en précise la catégorie sacrificielle.'
translation_notes:
  register: Français international moderne, sobre et digne. Le futur prescriptif convient au contexte légal. « Holocauste » est conservé comme terme sacrificiel biblique établi; la dernière proposition est légèrement restructurée pour éviter un calque peu naturel tout en préservant la responsabilité exprimée par לָכֶם.
