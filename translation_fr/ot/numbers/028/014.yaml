  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: fr
  text: 'Voici leurs libations de vin : un demi-hin pour le taureau, un tiers de hin pour le bélier et un quart de hin pour l’agneau. C’est l’holocauste de chaque mois, en son mois, pour les mois de l’année.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est l’holocauste de la nouvelle lune, en son mois, pour les mois de l’année. » Le mot hébreu חֹדֶשׁ peut désigner soit le mois, soit la nouvelle lune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: leurs libations
  rationale: Le nom désigne une offrande liquide versée. « Libations » est le terme français précis et usuel dans le contexte sacrificiel; la reformulation « Pour leurs libations, on offrira du vin » rend clairement la relation avec יָיִן.
- source_word: חֲצִי הַהִין
  choice: un demi-hin
  rationale: La mesure ancienne est conservée sans conversion, et la fraction est exprimée naturellement en français.
- source_word: לַפָּר
  choice: pour le taureau
  rationale: Le singulier défini désigne ici l’animal sacrificiel précisé par le contexte.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: un tiers de hin
  rationale: Rend directement et naturellement la fraction hébraïque.
- source_word: לָאַיִל
  choice: pour le bélier
  rationale: Le singulier défini est maintenu comme désignation de l’animal prévu.
- source_word: וּרְבִיעִת הַהִין
  choice: un quart de hin
  rationale: Expression française naturelle correspondant exactement à la fraction indiquée.
- source_word: לַכֶּבֶשׂ
  choice: pour l’agneau
  rationale: Le singulier défini est conservé conformément au texte hébreu.
- source_word: יָיִן
  choice: du vin
  rationale: Le mot placé après les quantités en hébreu précise le liquide offert. Il est avancé en français pour éviter une construction maladroite tout en gardant le même sens.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: C’est l’holocauste mensuel
  rationale: « Holocauste » rend le terme sacrificiel עֹלָה. חֹדֶשׁ peut désigner le mois ou la nouvelle lune; le texte principal exprime la récurrence mensuelle, tandis qu’une note conserve l’autre lecture.
- source_word: בְּחָדְשׁוֹ
  choice: à offrir chaque mois
  rationale: La formulation explicite en français la valeur distributive de l’expression littérale « en son mois » sans modifier sa portée.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: pendant tous les mois de l’année
  rationale: Cette tournure idiomatique préserve l’idée de répétition sur l’ensemble du cycle annuel.
theological_decisions:
- issue: Sens de חֹדֶשׁ dans l’expression cultuelle
  choice: mensuel
  alternative: de la nouvelle lune
  rationale: Le contexte décrit une offrande répétée au fil des mois; cependant, חֹדֶשׁ peut aussi désigner spécifiquement la nouvelle lune. La traduction principale privilégie la portée récurrente et la note maintient l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, clair et digne. « Hin » conserve l’unité antique; « holocauste » et « libations » maintiennent la précision du vocabulaire sacrificiel. La syntaxe est légèrement réorganisée pour être naturelle en français sans effacer l’ambiguïté de חֹדֶשׁ.
