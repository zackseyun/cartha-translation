  yaml_path: translation/ot/numbers/028/021.yaml
  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: fr
  text: Tu prépareras un dixième d’épha pour chacun des sept agneaux[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un dixième, un dixième tu prépareras pour un agneau, pour les sept agneaux ». La répétition exprime ici une répartition : un dixième pour chaque agneau.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire un dixième d’épha, mesure habituelle de l’offrande végétale dans ce contexte.
    reason: cultural_note
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: un dixième d’épha pour chacun
  rationale: Dans les prescriptions sacrificielles, עִשָּׂרוֹן désigne la mesure correspondant au dixième d’un épha. La répétition du terme a ici une valeur distributive, rendue naturellement par « pour chacun ».
- source_word: תַּעֲשֶׂה
  choice: tu prépareras
  rationale: Le verbe עשה signifie littéralement « faire », mais « préparer » exprime de façon idiomatique son emploi dans cette prescription d’offrande sans lui donner le sens plus précis d’« offrir ».
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: pour chacun des … agneaux
  rationale: Le singulier accompagné de l’article et du numéral, après la répétition distributive, indique la quantité attribuée à chaque animal.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: des sept agneaux
  rationale: Cette expression identifie l’ensemble des sept agneaux auxquels la quantité doit être distribuée individuellement.
theological_decisions: []
