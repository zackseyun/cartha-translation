  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: fr
  text: Le jour du sabbat, vous offrirez deux agneaux d’un an, sans défaut, ainsi que deux dixièmes d’épha[a] de fleur de farine en offrande de céréales, mélangée à de l’huile, et la libation qui l’accompagne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « deux dixièmes » ; dans la législation sacrificielle, il s’agit de deux dixièmes d’épha.
    reason: cultural_note
  - marker: b
    text: La libation est une offrande liquide versée rituellement.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: Le jour du sabbat
  rationale: Cette tournure temporelle naturelle en français introduit l’offrande supplémentaire du sabbat. Le lien avec les prescriptions précédentes demeure clair dans le contexte, sans qu’un « et » initial soit nécessaire.
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: deux agneaux d’un an
  rationale: כְבָשִׂים désigne ici des agneaux mâles, ce que le nom français « agneaux » exprime naturellement, et l’expression idiomatique בְּנֵי שָׁנָה indique leur âge.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans le contexte sacrificiel, le terme exige des animaux exempts de défaut physique ; « sans défaut » est précis et courant.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: deux dixièmes d’épha
  rationale: Le texte dit « deux dixièmes » ; dans cette législation, l’unité sous-entendue est l’épha. Elle est explicitée dans le texte et signalée en note.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Cette expression française usuelle désigne une farine fine de qualité, conforme à l’emploi cultuel de סֹלֶת.
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans la législation sacerdotale, מִנְחָה désigne ici l’offrande non animale préparée avec de la farine, plutôt qu’une offrande générique.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mélangée à de l’huile
  rationale: La formulation rend clairement l’idée de farine combinée à l’huile, dans un français moderne et naturel.
- source_word: וְנִסְכּוֹ
  choice: et la libation qui l’accompagne
  rationale: נֶסֶךְ désigne un liquide rituellement versé. La tournure française rend le suffixe singulier comme une relation d’accompagnement avec l’offrande prescrite.
theological_decisions:
- issue: Verbe absent dans la proposition hébraïque
  choice: vous offrirez
  alternative: 'Le jour du sabbat : deux agneaux…'
  rationale: L’hébreu présente une liste nominale dans le cadre des prescriptions sacrificielles. L’ajout de « vous offrirez » explicite en français l’instruction déjà imposée par le contexte sans modifier son contenu.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire sacrificiel reste précis sans archaïsmes inutiles. La phrase explicite le verbe sous-entendu par le contexte hébreu, tandis que les notes rendent visibles l’unité de mesure implicite et le sens cultuel de « libation ».
